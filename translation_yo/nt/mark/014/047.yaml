  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀kan lára àwọn tí ó dúró nítòsí fa idà rẹ̀ yọ, ó sì lu ẹrú olórí àlùfáà náà[a], ó sì gé etí ẹrú náà kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ni δοῦλος, èyí tí ó lè túmọ̀ sí ẹrú tàbí ìránṣẹ́ tí ó wà lábẹ́ àṣẹ olúwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Ṣùgbọ́n ọ̀kan
  rationale: Ó pa ìyípadà kékeré tí δέ ń fi hàn mọ́, ó sì jẹ́ kí ẹni náà wà láìdárúkọ gẹ́gẹ́ bí èdè Gíríìkì.
- source_word: τῶν παρεστηκότων
  choice: lára àwọn tí ó dúró nítòsí
  rationale: Ó ṣàfihàn pé àwọn náà dúró níbẹ̀, lẹ́gbẹ̀ẹ́ ibi tí ìṣẹ̀lẹ̀ náà ti ń ṣẹlẹ̀.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: fa idà rẹ̀ yọ
  rationale: Nínú ọ̀rọ̀ ohun ìjà, σπάομαι túmọ̀ sí fífa ohun ìjà jáde; lílo arọ́pò-orúkọ oní ohun jẹ́ èdè Yorùbá àdánidá.
- source_word: ἔπαισεν
  choice: fi gé
  rationale: Nínú àyíká yìí, ìlù náà ló yọrí sí gígé etí; ‘fi gé’ sọ ìgbésẹ̀ ìwa-ipa náà ní Yorùbá àdánidá, láìlo ọ̀rọ̀ àtijọ́.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: ẹrú olórí àlùfáà
  rationale: ‘Ẹrú’ pa ipò ìdè àti ìṣàkóso tí δοῦλος lè tọ́ka sí mọ́; ‘olórí àlùfáà’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún ἀρχιερεύς.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: ó sì gé etí rẹ̀ kúrò
  rationale: Àyíká ìwa-ipa náà fi hàn pé etí náà gé kúrò; fọ́ọ̀mù kékeré ὠτάριον kò béèrè pé kí a sọ ‘etí kékeré,’ bẹ́ẹ̀ ni Máàkù kò sọ pé etí ọ̀tún ni.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àlàyé ipò àwùjọ
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: ‘Ẹrú’ dáàbò bo òtítọ́ ipò ìdè àti ìṣàkóso tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí níbí; àlàyé ìsàlẹ̀ ojú ewé fún ‘ìránṣẹ́’ gẹ́gẹ́ bí àṣàyàn èdè tí ó rọrùn sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A kò ṣàfikún pé etí ọ̀tún ni, nítorí ìyẹn kò sí nínú ẹ̀rí Máàkù.
