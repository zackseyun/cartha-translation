  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: yo
  text: Ó sì tún lọ gbàdúrà, ó sì sọ ọ̀rọ̀ kan náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun kan náà” tàbí “ọ̀rọ̀ àdúrà kan náà.” Èdè Gíríìkì ní “ọ̀rọ̀ kan náà”; níbí, “ọ̀rọ̀” ń tọ́ka sí ohun tí ó sọ nínú àdúrà rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù ṣe ohun náà lẹ́ẹ̀kan sí i, ó sì bá ìtẹ̀síwájú ìtàn Yorùbá mu.
- source_word: ἀπελθὼν
  choice: lọ
  rationale: Aorist participle náà tọ́ka sí pé ó kọ́kọ́ kúrò níbẹ̀ kí ó tó gbàdúrà; ìtumọ̀ pẹ̀lú ọ̀rọ̀-ìṣe tó tẹ̀ lé ara wọn jẹ́ àdánidá ní Yorùbá.
- source_word: προσηύξατο
  choice: gbàdúrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún fífi àdúrà sí Ọlọ́run hàn.
- source_word: τὸν αὐτὸν λόγον
  choice: ọ̀rọ̀ kan náà
  rationale: Ó pa ẹyọ λόγος mọ́, ṣùgbọ́n ní àyíká yìí ó ń tọ́ka sí ohun tí Jésù sọ nínú àdúrà rẹ̀, kì í ṣe ọ̀rọ̀ ẹyọ kan ṣoṣo.
- source_word: εἰπών
  choice: ó ń sọ
  rationale: Ó fi ọ̀nà tí ó gbà gbàdúrà hàn ní Yorùbá àdánidá, ó sì jẹ́ kó ṣe kedere pé ó tún sọ ohun tó ti sọ tẹ́lẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní ọlá, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà tẹ̀ lé ìtẹ̀síwájú ìtàn ní ṣókí, kò sì sọ pé Jésù tún gbogbo ọ̀rọ̀ àdúrà àkọ́kọ́ ṣe lẹ́yọ-ọ̀rọ̀.
