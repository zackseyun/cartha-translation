reference: Mark 14:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: yo
  text: Ní ibikíbi tí ó bá wọ̀, ẹ sọ fún baálé ilé pé, “Olùkọ́ náà ní, ‘Níbo ni yàrá àlejò mi[a] wà tí mo ti lè jẹ Ìrékọjá pẹ̀lú àwọn ọmọ-ẹ̀yìn mi?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùgbé” tàbí “yàrá.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibi ìdúró; níhìn-ín, ó ṣeé ṣe kí ó jẹ́ yàrá àlejò nínú ilé aládani, kì í ṣe ilé ìtura oníṣòwò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: Ní ibikíbi tí ó bá wọ̀
  rationale: Àkópọ̀ ὅπου àti ἐάν pẹ̀lú ọ̀rọ̀-ìṣe abẹ́sọ fi ibi tí a kò dá pàtó hàn; “ní ibikíbi tí … bá” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: εἴπατε
  choice: ẹ sọ fún
  rationale: Àṣẹ náà jẹ́ fún àwọn ọmọ-ẹ̀yìn méjì; “ẹ” fi ọ̀pọ̀ ènìyàn hàn, “sọ fún” sì bá ọ̀rọ̀ tí wọ́n ní láti sọ fún ẹni kan mu.
- source_word: οἰκοδεσπότῃ
  choice: baálé ilé náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó jẹ́ olórí tàbí aláṣẹ nínú ilé; “baálé ilé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ipa yẹn hàn láì sọ ọ́ di onílé lásán.
- source_word: Ὁ διδάσκαλος
  choice: Olùkọ́ náà
  rationale: “Olùkọ́” ni ìtumọ̀ àkọ́kọ́ ọ̀rọ̀ náà, “náà” sì fi hàn pé wọ́n mọ ẹni tí àkọlé yìí ń tọ́ka sí.
- source_word: κατάλυμά
  choice: yàrá àlejò
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κατάλυμα ṣeé lóye gẹ́gẹ́ bí yàrá tí wọ́n pèsè fún àlejò nínú ilé, kì í ṣe ilé èrò oníṣòwò.
- source_word: μου
  choice: mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní wà nínú SBLGNT, ó sì ṣeé ṣe kí ó tọ́ka sí yàrá tí a pinnu tàbí tí a pèsè fún Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀.
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: Níwọ̀n bí ọ̀rọ̀-ìṣe “jẹ” ti fi hàn pé oúnjẹ ayẹyẹ ni àyíká náà ń sọ, orúkọ “Ìrékọjá” tó lákòókò láìfi “àsè” kún un.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn mi
  rationale: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ọ̀nà Yorùbá tí a mọ̀ dáadáa fún μαθηταί, ó sì pa ìbáṣepọ̀ wọn pẹ̀lú olùkọ́ mọ́.
- source_word: φάγω
  choice: tí èmi yóò ti jẹ
  rationale: Abẹ́sọ aorist náà wà nínú gbólóhùn tó ń ṣàlàyé yàrá tí a ń wá fún iṣẹ́ tí a pinnu; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì fi iṣẹ́ ọjọ́ iwájú tí a pinnu hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àkọlé διδάσκαλος tí Jésù lò fún ara rẹ̀
  choice: Olùkọ́ náà
  alternative: Ọ̀gá náà
  rationale: “Olùkọ́” pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, kò sì gbé èrò nípa ipò tàbí àṣẹ tí ọ̀rọ̀ náà kò sọ ní tààrà wọ inú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá àdánidá, ọlọ́lá, tí àwọn òǹkàwé òde òní lè lóye, pẹ̀lú àmì ohùn ní kíkún. A fi “ẹ” hàn pé àṣẹ náà jẹ́ fún ẹni méjì, a sì lo àgbékalẹ̀ ọ̀rọ̀ tààrà méjì láti pa ìtẹ̀sí ọ̀rọ̀ Gíríìkì mọ́.
