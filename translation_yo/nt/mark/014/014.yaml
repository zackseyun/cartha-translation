  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀ ìpele ìtumọ̀ Gíríìkì mọ́: ibi tí a kò sọ pàtó, àṣẹ fún ọ̀pọ̀ ènìyàn, baálé ilé, yàrá àlejò, ìní ‘mi,’ àti jíjẹ Ìrékọjá pẹ̀lú àwọn ọmọ-ẹ̀yìn. Ṣùgbọ́n ‘yóò’ ń sọ φάγω di ìfẹ́ ọjọ́ iwájú tó dájú ju bí gbólóhùn ibi-afẹ́ mu lọ; ‘lè’ dára jù láti fi ibi tí a ń wá láti jẹun hàn.'
  naturalness: ‘Níbo ni’ jẹ́ ọ̀nà Yorùbá tó péye, tó sì mọ́gbọ́n dání ju ‘Ibo ni.’ A yọ ‘náà’ kúrò lẹ́yìn ‘baálé ilé,’ nítorí pé kò sí afìkún ìtọ́kasí bẹ́ẹ̀ nínú Gíríìkì, ó sì lè dà bí ẹni pé ilé kan tí a ti mẹ́nuba ni a ń tọ́ka sí. ‘Olùkọ́ náà’ ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí àkọ́lé tí a mọ̀.
  terminology: ‘Baálé ilé,’ ‘Olùkọ́ náà,’ ‘yàrá àlejò,’ ‘Ìrékọjá,’ àti ‘àwọn ọmọ-ẹ̀yìn’ bá ìtumọ̀ orísun mu, wọ́n sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó bójú mu. A tún ṣe àtúnṣe ìtumọ̀ àlàyé ẹsẹ̀ ìsàlẹ̀ kí ‘ilé ìtura’ má bà a dà pọ̀ mọ́ yàrá àlejò nínú ilé aládani.
