id: MRK.14.31
reference: Mark 14:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: yo
  text: Ṣùgbọ́n ó túbọ̀ ń tẹnumọ́ ọ̀rọ̀ rẹ̀ gidigidi[a] pé, “Bí mo bá ní láti bá ọ kú, èmi kì yóò sẹ́ ọ rárá[b].” Gbogbo wọn sì ń sọ ohun kan náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń sọ̀rọ̀ pẹ̀lú ìtẹnumọ́ tó pọ̀ jù.”
    reason: lexical_alternative
  - marker: b
    text: Èdè Gíríìkì lo ìkọ̀ tó lágbára gan-an níbí; a tún lè túmọ̀ rẹ̀ sí, “èmi kì yóò sẹ́ ọ láéláé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: ó túbọ̀ ń tẹnumọ́ ọ̀rọ̀ rẹ̀ gidigidi
  rationale: Ọ̀rọ̀ yìí mú ìtẹnumọ́ ἐκπερισσῶς àti ìṣe tí ń bá a lọ nínú imperfect ἐλάλει jáde ní Yorùbá àdánidá.
- source_word: Ἐὰν δέῃ με
  choice: Bí mo bá ní láti
  rationale: Ó pa ìtumọ̀ àìgbọ́dọ̀máṣe tàbí dandan ti δέῃ mọ́, kì í ṣe pé ó ṣeé ṣe lásán.
- source_word: συναποθανεῖν σοι
  choice: bá ọ kú
  rationale: Nínú Yorùbá, ‘bá ọ kú’ jẹ́ ọ̀nà àdánidá láti sọ pé kí ẹni méjì kú papọ̀, ó sì pa agbára σύν inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐ μή
  choice: kì yóò ... rárá
  rationale: Ìṣọ̀kan ‘kì yóò ... rárá’ fi ìkọ̀ emphatic Gíríìkì hàn ní kedere láì lo èdè àtijọ́.
- source_word: ἀπαρνήσομαι
  choice: sẹ́ ọ
  rationale: ‘Sẹ́’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún kí ẹni sọ pé òun kò mọ ẹnì kan tàbí kí ó kọ̀ ọ́ sílẹ̀ nínú àyíká ìtàn yìí.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Gbogbo wọn sì ń sọ ohun kan náà
  rationale: Ó mú gbogbo ènìyàn tí πάντες tọ́ka sí àti ìṣe tí ń bá a lọ nínú imperfect ἔλεγον hàn, ó sì sọ ohun tí ὡσαύτως ń tọ́ka sí di mímọ́.
theological_decisions:
- issue: Agbára ìbúra Pétérù pé òun kì yóò sẹ́ Jésù
  choice: èmi kì yóò sẹ́ ọ rárá
  alternative: èmi kò lè sẹ́ ọ láéláé
  rationale: Yíyan yìí pa ìkọ̀ líle οὐ μή mọ́, ó sì fi ìgbẹ́kẹ̀lé ara ẹni Pétérù àti ìforígbárí rẹ̀ pẹ̀lú ohun tó ṣẹlẹ̀ lẹ́yìn náà sílẹ̀ láì ṣàlàyé rẹ̀ nípa ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó sì ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Bá ọ kú’ jẹ́ àdánidá ju ‘kú papọ̀ pẹ̀lú rẹ’ lọ, nígbà tí ‘rárá’ ń ru ìtẹnumọ́ ìkọ̀ Gíríìkì.
