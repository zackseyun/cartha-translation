  source_fidelity: 'The Yoruba accurately represents the Greek: the intensified, ongoing speech in ἐκπερισσῶς ἐλάλει; the necessity expressed by ἐὰν δέῃ με; dying with/together with Jesus; the emphatic future negation οὐ μή; and the collective ongoing response of all the disciples. “Bá ọ kú” is a natural Yoruba expression that adequately carries the συν- force in context.'
  naturalness: The rendering is clear, idiomatic Standard Yoruba with appropriate tone marking and a suitably serious narrative register. “Ó túbọ̀ ń tẹnumọ́ ọ̀rọ̀ rẹ̀ gidigidi” naturally conveys escalating emphatic insistence, while “Gbogbo wọn sì ń sọ ohun kan náà” clearly expresses the final clause.
  terminology: “Sẹ́ ọ” is appropriate in this narrative setting for denying/disowning Jesus. The emphatic construction “èmi kì yóò sẹ́ ọ rárá” fittingly reflects οὐ μή without adding interpretive theology. The existing footnotes are correctly anchored and relevant to the marked expressions.
