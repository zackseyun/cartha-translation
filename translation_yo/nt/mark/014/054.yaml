  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní àmì ohùn ní kíkún. Gbólóhùn méjì náà jẹ́ kí ìtàn rọrùn láti ka, nígbà tí ‘títí ó fi wọ inú’ ń pa agbára ἕως ἔσω εἰς mọ́.
