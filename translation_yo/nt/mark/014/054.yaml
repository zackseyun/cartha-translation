source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: yo
  text: Pétérù sì tẹ̀ lé e láti ibi jíjìn, títí ó fi wọ inú àgbàlá àlùfáà àgbà. Ó ń jókòó pẹ̀lú àwọn ìránṣẹ́, ó sì ń fi ara rẹ̀ gbóná lẹ́gbẹ̀ẹ́ iná náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gidi: “sí ìmọ́lẹ̀ náà.” Ó ṣeé ṣe kí èyí tọ́ka sí ìmọ́lẹ̀ iná tó wà ní àgbàlá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: láti òkèèrè
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń tẹ̀ lé ẹlòmíràn láti ibi tí kò sún mọ́ ọn.
- source_word: ἠκολούθησεν αὐτῷ
  choice: tẹ̀ lé e
  rationale: Ó mú ìṣe àtẹ̀lé tí aorist náà sọ jáde ní ọ̀nà ìtàn Yorùbá tó ṣe kedere.
- source_word: ἕως ἔσω εἰς
  choice: títí ó fi wọ inú
  rationale: Ó pa ìtẹnumọ́ orísun náà mọ́ pé Pétérù dé inú àgbàlá, kì í ṣe pé ó dúró sí ẹnu ọ̀nà rẹ̀.
- source_word: αὐλήν
  choice: àgbàlá
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àgbàlá ilé olórí àlùfáà.
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò àlùfáà tó ga jù lọ nínú àyíká Júù yìí.
- source_word: ἦν συγκαθήμενος
  choice: Ó jókòó pẹ̀lú
  rationale: Ó fi ìṣe tó ń lọ ní àkókò náà hàn, ó sì pa èrò σύν mọ́ nípasẹ̀ ‘pẹ̀lú.’
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: pẹ̀lú àwọn ìránṣẹ́
  rationale: ‘Àwọn ìránṣẹ́’ jẹ́ ọ̀rọ̀ gbòòrò tó lè tọ́ka sí àwọn tó ń ṣiṣẹ́ lábẹ́ àṣẹ níbẹ̀, láìfi dandan sọ pé ẹrú ilé ni wọ́n tàbí pé olùṣọ́ nìkan ni wọ́n.
- source_word: θερμαινόμενος
  choice: ń yáná
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún fífi ara gbóná lẹ́gbẹ̀ẹ́ iná.
- source_word: πρὸς τὸ φῶς
  choice: sí iná náà
  rationale: Ní ti gidi φῶς túmọ̀ sí ‘ìmọ́lẹ̀,’ ṣùgbọ́n nínú àyíká yìí iná tó ń fúnni ní ìmọ́lẹ̀ ni Pétérù fi ń yáná; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
