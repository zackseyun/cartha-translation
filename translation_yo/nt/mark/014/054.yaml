revisions:
- from: Pétérù sì tẹ̀ lé e láti òkèèrè, títí ó fi wọ inú àgbàlá olórí àlùfáà. Ó jókòó pẹ̀lú àwọn ìránṣẹ́, ó sì ń yáná sí iná náà.[a]
  to: Pétérù sì tẹ̀ lé e láti ibi jíjìn, títí ó fi wọ inú àgbàlá àlùfáà àgbà. Ó ń jókòó pẹ̀lú àwọn ìránṣẹ́, ó sì ń fi ara rẹ̀ gbóná lẹ́gbẹ̀ẹ́ iná náà.[a]
  rationale: Àtúnṣe náà pa ìtumọ̀ àti ìtẹnumọ́ Gíríìkì mọ́, ó sì mú ọ̀rọ̀ Yorùbá di mímọ́ síi. A rọ́pò ọ̀rọ̀ tó lè jẹ́ àìtóbi (“láti òkèèrè”), a ṣàfihàn imperfect náà pẹ̀lú “ó ń jókòó,” a sì lo “àlùfáà àgbà” fún high priest. Àlàyé ìsàlẹ̀ ṣì ń tọ́ka sí ìtumọ̀ gangan φῶς, láìsọ pé ìdánimọ̀ iná náà dájú ju bó ṣe yẹ lọ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtàn Gíríìkì dáadáa ní gbogbogbòò: Pétérù tẹ̀ lé Jesu láti ibi jíjìn, ó wọ àgbàlá àlùfáà àgbà, ó sì wà pẹ̀lú àwọn ὑπηρέται níbi tó ti ń fi ara rẹ̀ gbóná. Ṣùgbọ́n “Ó jókòó” lè dà bí ìṣe tó parí, níbi tí ἦν συγκαθήμενος ti ń ṣàpèjúwe ipò tó ń lọ. “Láti òkèèrè” tún lè sọ ‘láti òde’ tàbí ‘láti ilẹ̀ òkèèrè’; “láti ibi jíjìn” ṣàfihàn ἀπὸ μακρόθεν kedere jù. “Àlùfáà àgbà” sì jẹ́ ọ̀nà tó dájú síi láti yà ἀρχιερεύς sọ́tọ̀ kúrò nínú ‘àwọn olórí àlùfáà.’'
  naturalness: 'Àtúnṣe náà ń lo Yorùbá ìgbàlódé tó rọrùn: “ó ń jókòó” fún ìṣe tó ń lọ, àti “ń fi ara rẹ̀ gbóná lẹ́gbẹ̀ẹ́ iná náà” fún ìṣe fífi ara gbóná níbi iná. Àmì ohùn wà ní kíkún.'
  terminology: “Àlùfáà àgbà” yẹ fún ἀρχιερεύς nínú ẹsẹ̀ yìí. “Àwọn ìránṣẹ́” jẹ́ ìtumọ̀ gbòòrò tó yẹ fún ὑπηρέται, láìfi ìtumọ̀ ‘olùṣọ́’ tàbí ‘ẹrú’ kún un. Àlàyé ìsàlẹ̀ ń pa ìtumọ̀ gangan πρὸς τὸ φῶς (‘sí ìmọ́lẹ̀ náà’) mọ́, nígbà tí ọ̀rọ̀ àkọ́kọ́ ń ṣàlàyé ìtumọ̀ rẹ̀ nínú àyíká.
