  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ó fi aṣọ ọ̀gbọ̀ náà sílẹ̀, ó sì sá lọ ní ìhòòhò[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aṣọ ìbora ọ̀gbọ̀” tàbí “ẹ̀wù ọ̀gbọ̀” fún “aṣọ ọ̀gbọ̀” (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: “Ní ìhòòhò” (γυμνός) lè túmọ̀ sí ẹni tí aṣọ rẹ̀ kò pé ní àwọn àyíká kan; ṣùgbọ́n níbí, ìtumọ̀ tó hàn gbangba ni pé ó sá lọ láìsí aṣọ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níbí, δέ ń fi ìyípadà kékeré hàn láti inú bí wọ́n ṣe mú un sí bí ó ṣe bọ́ sá lọ; “Ṣùgbọ́n” bá ìtàn náà mu.
- source_word: καταλιπὼν
  choice: fi ... sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó fi aṣọ náà sílẹ̀ lẹ́yìn rẹ̀ nígbà tí ó ń sá; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: σινδόνα
  choice: aṣọ ọ̀gbọ̀
  rationale: σινδών jẹ́ aṣọ tàbí aṣọ ìbora tí a fi ọ̀gbọ̀ ṣe; “aṣọ ọ̀gbọ̀” kò sọ ìrísí rẹ̀ pàtó ju ẹ̀rí orísun lọ.
- source_word: γυμνὸς
  choice: ní ìhòòhò
  rationale: γυμνός túmọ̀ sí ìhòòhò ní kíkún ní ọ̀nà tó ṣeé ṣe jù ní àyíká yìí, bí ó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ẹni tí aṣọ rẹ̀ kò pé ní àwọn àyíká mìíràn.
- source_word: ἔφυγεν
  choice: ó sì sá lọ
  rationale: φεύγω ń tọ́ka sí sísá kúrò ní kíákíá; “sá lọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìkánjú ìṣe náà mọ́.
