  source_fidelity: 'Ìtumọ̀ náà mú νεανίσκος τις, imperfect συνηκολούθει, àti ìtumọ̀ gbooro σινδών dáadáa. Ṣùgbọ́n “ó fi aṣọ ... bo ara rẹ̀ ní ìhòòhò” kò sọ ìbáṣepọ̀ ἐπὶ γυμνοῦ ní kedere: ó lè dà bí ẹni pé ó bo ìhòòhò rẹ̀, dípò pé aṣọ náà nìkan ni ó wọ lórí ara ìhòòhò rẹ̀. “Wọ́n sì gbá a mú” tún yí historical present κρατοῦσιν padà sí ìṣe tí ó ti parí; a lè fi ìrísí ìṣe tí ń lọ hàn ní Yorùbá.'
  naturalness: “Ń tọ̀ ọ́ lẹ́yìn” jẹ́ Yorùbá àdánidá. Àtúnṣe sí “wọ aṣọ ... lórí ara ìhòòhò rẹ̀” jẹ́ kedere, ó sì rọrùn ju ìlò “fi ... bo ara rẹ̀ ní ìhòòhò” lọ. “Ń gbá a mú” dá ìṣẹ̀lẹ̀ ìtàn tó hàn gbangba padà ní ọ̀nà tí ó bá Yorùbá mu.
  terminology: “Ọ̀dọ́mọkùnrin,” “aṣọ ọ̀gbọ̀,” àti “gbá a mú” yẹ sí ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì. Àlàyé ìsàlẹ̀ yẹ kí ó fi “aṣọ ìbora” hàn gẹ́gẹ́ bí aṣàyàn lexical, láìfi ìrísí aṣọ kan múlẹ̀ ju ohun tí σινδών sọ lọ.
