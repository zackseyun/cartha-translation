  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. Àmì ohùn wà níbi tí ó bá yẹ. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí àlàyé rẹ̀ kan.
