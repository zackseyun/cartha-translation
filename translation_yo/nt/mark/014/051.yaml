  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: yo
  text: Ọ̀dọ́mọkùnrin kan sì ń tọ̀ ọ́ lẹ́yìn, ó wọ aṣọ ọ̀gbọ̀ kan[a] lórí ara ìhòòhò rẹ̀, wọ́n sì ń gbá a mú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “aṣọ ìbora ọ̀gbọ̀.” Ọ̀rọ̀ Gíríìkì náà, σινδών, lè túmọ̀ sí aṣọ ọ̀gbọ̀ tàbí aṣọ ìbora.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: ọ̀dọ́mọkùnrin kan
  rationale: “Ọ̀dọ́mọkùnrin” túmọ̀ νεανίσκος, “kan” sì pa àìdánimọ̀ àti agbára ìsọ̀rọ̀-pàtó díẹ̀ tí τις ní mọ́.
- source_word: συνηκολούθει
  choice: ń tọ̀ ọ́ lẹ́yìn
  rationale: Àmì “ń” fi hàn pé ìṣe náà ń bá a lọ ní àkókò ìtàn, bí imperfect Gíríìkì ṣe túmọ̀ sí.
- source_word: περιβεβλημένος
  choice: ó fi … bo ara rẹ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó dì tàbí wọ aṣọ náà mọ́ ara.
- source_word: σινδόνα
  choice: aṣọ ọ̀gbọ̀ kan
  rationale: Ó pa ìtumọ̀ aṣọ tí a fi ọ̀gbọ̀ ṣe mọ́ láìsọ irú tàbí ìrísí aṣọ náà ní pàtó.
- source_word: ἐπὶ γυμνοῦ
  choice: bo ara rẹ̀ ní ìhòòhò
  rationale: Èyí fi hàn pé aṣọ náà wà lórí ara rẹ̀ ní tààrà, kò sì sí aṣọ mìíràn lábẹ́ rẹ̀.
- source_word: κρατοῦσιν αὐτόν
  choice: wọ́n sì gbá a mú
  rationale: “Gbá a mú” mú agbára κρατέω jáde, ó sì bá ìṣe òjijì náà mu; ìtẹ̀síwájú ìtàn Yorùbá ń jẹ́ kí ó dun ní gbangba láìfi ìtumọ̀ “mú un gẹ́gẹ́ bí ẹlẹ́wọ̀n” kún un.
