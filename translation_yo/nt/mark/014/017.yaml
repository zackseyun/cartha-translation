  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: yo
  text: Nígbà tí ó di ìrọ̀lẹ́, ó wá pẹ̀lú àwọn méjìlá náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú Àwọn Méjìlá náà,” níbi tí “Àwọn Méjìlá” ti jẹ́ orúkọ tí a mọ̀ fún ẹgbẹ́ àwọn àpọ́sítélì Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nígbà tí
  rationale: A kò túmọ̀ Καὶ lọ́tọ̀ sí ‘Àti’ nítorí ìbẹ̀rẹ̀ gbólóhùn yìí dára sí i ní Yorùbá gẹ́gẹ́ bí gbólóhùn àkókò; ìtẹ̀síwájú ìtàn ṣì hàn kedere.
- source_word: ὀψίας γενομένης
  choice: tí ó di ìrọ̀lẹ́
  rationale: 'Gbólóhùn yìí mú ìtumọ̀ genitive absolute tó ń tọ́ka sí àkókò jáde ní Yorùbá àdánidá: ‘nígbà tí ó di ìrọ̀lẹ́.’'
- source_word: ἔρχεται
  choice: ó wá
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, Yorùbá máa ń sọ ìtàn àtijọ́ lọ́nà àdánidá pẹ̀lú ‘ó wá’; èyí kò fi ìtumọ̀ dídé kún ọ̀rọ̀ náà.
- source_word: μετὰ τῶν δώδεκα
  choice: pẹ̀lú àwọn méjìlá náà
  rationale: ‘Pẹ̀lú’ fi ìbákẹ́gbẹ́ μετά hàn, ‘àwọn méjìlá náà’ sì tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn méjìlá tí a ti mọ̀ láìfi ‘àpọ́sítélì’ tàbí ‘ọmọ-ẹ̀yìn’ kún un.
theological_decisions:
- issue: Àwọn tí ‘àwọn méjìlá náà’ ń tọ́ka sí
  choice: Ẹgbẹ́ àwọn ọmọ-ẹ̀yìn méjìlá Jésù, tí Júdásì ṣì wà lára wọn ní àkókò yìí
  alternative: Kí a túmọ̀ ọ́ ní kíkún sí ‘àwọn ọmọ-ẹ̀yìn méjìlá náà’ tàbí ‘àwọn àpọ́sítélì méjìlá náà’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘àwọn méjìlá’ nìkan. Mímú un dúró ní ṣókí yago fún fífi àlàyé tàbí oyè tí kò sí nínú gbólóhùn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìtumọ̀ náà yan ìṣọ̀kan tó dára láàárín ìfaradà sí ìṣètò Gíríìkì àti ìṣàn Yorùbá àdánidá.
