source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: yo
  text: Ó sì lọ síwájú díẹ̀[a], ó ṣubú sí ilẹ̀, ó sì ń gbàdúrà pé, bí ó bá ṣeé ṣe, kí wákàtí náà kọjá kúrò lọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ti lọ sí iwájú díẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: lọ síwájú díẹ̀
  rationale: Ó fi hàn pé ó lọ ní ọ̀nà díẹ̀ síwájú ju àwọn tó wà pẹ̀lú rẹ̀ lọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: ó dojúbolẹ̀
  rationale: Ọ̀rọ̀ yìí sọ ìṣubú sí ilẹ̀ ní kíkún, ó sì bá ìtẹríba àti ìrora inú ìṣẹ̀lẹ̀ náà mu láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: προσηύχετο
  choice: ó sì ń gbàdúrà
  rationale: Àmì ‘ń’ pa ìṣe tí ń lọ lọ́wọ́ mọ́, gẹ́gẹ́ bí imperfect Gíríìkì ṣe fi hàn.
- source_word: ἵνα
  choice: pé
  rationale: ‘Pé’ ṣàgbékalẹ̀ ohun tí àdúrà náà ní nínú Yorùbá àdánidá, láìfipá mú ìtumọ̀ ète kan lé e lórí.
- source_word: εἰ δυνατόν ἐστιν
  choice: bí ó bá ṣeé ṣe
  rationale: Ó pa ìtumọ̀ ipò àti àìdájú mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó níyì.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: kí wákàtí náà kọjá kúrò lọ́dọ̀ rẹ̀
  rationale: Ó pa àwòrán ‘wákàtí náà’ àti ìṣe ‘kọjá kúrò lọ́dọ̀ rẹ̀’ mọ́, láìtú u sí àsọyé nípa ìjìyà tàbí ikú.
theological_decisions:
- issue: Ìtumọ̀ ‘wákàtí náà’
  choice: A pa ‘wákàtí náà’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àpẹẹrẹ fún àkókò tí a yàn fún ìjìyà àti ikú Jésù.
  alternative: ‘àkókò náà’ tàbí ‘àkókò ìjìyà náà’
  rationale: Ìsọ̀rọ̀ náà ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ nínú Máàkù. Pípa àwòrán ọ̀rọ̀ náà mọ́ kò tú ìdààmú ẹ̀kọ́ inú ẹsẹ náà sí ìtumọ̀ ẹ̀sìn kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì pa ìṣàn ìtàn àti ìṣe àdúrà tó ń lọ lọ́wọ́ mọ́.
