id: MRK.14.61
reference: Mark 14:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: yo
  text: Ṣùgbọ́n ó dákẹ́ jẹ́ẹ́, kò sì dá ohunkóhun lóhùn. Olórí àlùfáà tún ń bi í léèrè, ó sì wí fún un pé, “Ìwọ ha ni Mèsáyà[a], Ọmọ Ẹni Ìbùkún náà[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà, Χριστός (Christos), jẹ́ oyè níbí; ìtumọ̀ rẹ̀ ni ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: “Ẹni Ìbùkún náà” jẹ́ ọ̀nà ọ̀wọ̀ tí àwọn Júù fi ń tọ́ka sí Ọlọ́run.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: ó dákẹ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ó ń bá ìdákẹ́jẹ́ rẹ̀ lọ; ‘ó dákẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò fèsì.
- source_word: ἀπεκρίνατο οὐδέν
  choice: kò sì dá ohunkóhun lóhùn
  rationale: Èyí pa ìtẹnumọ́ pé kò dá ohun kankan lóhùn mọ́, ó sì jẹ́ gbolohun Yorùbá tó ṣe kedere.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé àlùfáà àgbà bẹ̀rẹ̀ sí í bi í léèrè lẹ́ẹ̀kan sí i.
- source_word: ἀρχιερεὺς
  choice: Àlùfáà àgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ipò olórí àlùfáà Júù.
- source_word: ἐπηρώτα
  choice: ń bi í léèrè
  rationale: Àmì aláìpé inú Gíríìkì tọ́ka sí ìbéèrè tó ń lọ lọ́wọ́; ‘ń bi í léèrè’ mú abala yìí jáde láì sọ ọ́ di ìfọ̀rọ̀wánilẹ́nuwò líle ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: λέγει
  choice: ó sì wí fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ìtàn, fífi rẹ̀ sí ọ̀nà ìtàn Yorùbá yìí jẹ́ àdánidá, kò sì yí ìtumọ̀ rẹ̀ padà.
- source_word: χριστός
  choice: Mèsáyà
  rationale: Nínú àyíká ìdájọ́ Júù yìí, ọ̀rọ̀ náà jẹ́ orúkọ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ Júù náà mọ́ ju lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lọ.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Ọmọ Ẹni Ìbùkún náà
  rationale: Èyí pa ọ̀nà ọ̀wọ̀ tí àwọn Júù fi ń tọ́ka sí Ọlọ́run láì pe orúkọ rẹ̀ ní tààràtà mọ́, dípò kí a fi ‘Ọlọ́run’ kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí orúkọ oyè Mèsáyà
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìbéèrè àlùfáà àgbà, ọ̀rọ̀ náà jẹ́ orúkọ oyè ẹni tí àwọn Júù ń retí, kì í ṣe orúkọ lásán; ‘Mèsáyà’ mú iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè hàn.
- issue: Bí a ṣe túmọ̀ τοῦ εὐλογητοῦ
  choice: Ẹni Ìbùkún náà
  alternative: Ọlọ́run
  rationale: Gíríìkì lo ọ̀nà ìtọ́ka ọlọ́wọ̀ kan sí Ọlọ́run. Títọ́jú ọ̀nà àyíká yìí kò jẹ́ kí a sọ ohun tí orísun náà kò sọ ní tààràtà, ó sì pa àṣà Júù inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ìwọ ha ni’ mú ìbéèrè ìdánimọ̀ tó wà nínú Σὺ εἶ hàn ní ọ̀nà tó bá ọ̀rọ̀ ìdájọ́ mu. Àwọn àmì àlàyé [a] àti [b] ni a so mọ́ ‘Mèsáyà’ àti ‘Ẹni Ìbùkún náà’ ní ìbámu pẹ̀lú ohun tí àlàyé kọ̀ọ̀kan ń ṣàlàyé; a kò fi àmì sí ‘ohunkóhun lóhùn’ nítorí kò sí àlàyé orísun tó bá a mu.
