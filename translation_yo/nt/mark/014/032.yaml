translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A ṣe historical presents méjèèjì gẹ́gẹ́ bí ìṣe tó ti ṣẹlẹ̀ nínú ìtàn, nítorí èyí ni ó ṣàn dáadáa jù ní Yorùbá; a kò fi àlàyé ẹsẹ̀ sílẹ̀ nítorí yíyan yìí kò yí ìtumọ̀ ọ̀rọ̀ orísun padà.
