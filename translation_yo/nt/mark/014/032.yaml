source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: yo
  text: Wọ́n sì dé ibi kan tí orúkọ rẹ̀ ń jẹ́ Gẹtisémánì, ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ jókòó níbí títí tí màá fi gbàdúrà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ present tense tí a lò fún ìtàn (historical present). Èdè Yorùbá àdánidá máa ń sọ ìṣẹ̀lẹ̀ yìí gẹ́gẹ́ bí ohun tó ti ṣẹlẹ̀; “wọ́n dé” sì mú ìtumọ̀ wíwá sí ibi náà jáde dáadáa.
- source_word: χωρίον
  choice: ibi kan
  rationale: χωρίον lè túmọ̀ sí ibi, ilẹ̀ kan, tàbí ohun-ìní kan. “Ibi kan” jẹ́ gbígbòòrò, ó sì yẹra fún fífi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: tí orúkọ rẹ̀ ń jẹ́ Gẹtisémánì
  rationale: Èyí tẹ̀lé ìkọ̀lé Gíríìkì ní ọ̀nà tí ó jẹ́ àdánidá ní Yorùbá, ó sì pa Gẹtisémánì mọ́ gẹ́gẹ́ bí orúkọ ibi.
- source_word: λέγει
  choice: ó sì sọ fún
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, ìṣe àtẹ̀lé nínú ìtàn Yorùbá máa ń ṣe àdánidá pẹ̀lú “ó sì sọ fún.” Ọ̀rọ̀ “fún” tún mú ẹni tí ọ̀rọ̀ náà ń tọ́ sí hàn kedere.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ẹni tó ń kọ́ lẹ́sẹ̀ olùkọ́ rẹ̀ tí ó sì ń tẹ̀ lé e.
- source_word: Καθίσατε
  choice: Ẹ jókòó
  rationale: Àṣẹ náà ń tọ́ka sí ọ̀pọ̀ ènìyàn; àmì ọ̀wọ̀/ọ̀pọ̀ “Ẹ” àti “jókòó” sọ àṣẹ náà ní kúkúrú àti ní èdè àdánidá.
- source_word: ὧδε
  choice: síbí
  rationale: “Síbí” jẹ́ ìtumọ̀ taara àti àdánidá fún ọ̀rọ̀ tó ń tọ́ka sí ibi tí olùsọ wà.
- source_word: ἕως προσεύξωμαι
  choice: títí èmi yóò fi gbàdúrà
  rationale: “Títí ... yóò fi” pa ààlà àkókò tí ἕως pẹ̀lú aorist subjunctive ń tọ́ka sí mọ́. Fífi “èmi” hàn ń fún gbólóhùn náà ní ìtẹnumọ́ àdánidá láì fi ìtumọ̀ míì kún un.
