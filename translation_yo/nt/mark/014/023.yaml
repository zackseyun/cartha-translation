  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: yo
  text: Ó sì mú ago kan[a]; lẹ́yìn tí ó ti dúpẹ́, ó fi fún wọn, gbogbo wọn sì mu nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ago náà.” Ọ̀rọ̀ Gíríìkì náà lo “ago” láìní àmì ìdánimọ̀; síbẹ̀, àyíká oúnjẹ lè fi hàn pé ago kan pàtó ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: ó mú
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; lílo ọ̀rọ̀-ìṣe alápapọ̀ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹ̀síwájú ìṣe náà hàn láìjẹ́ kí gbolohun le.
- source_word: ποτήριον
  choice: ife kan
  rationale: Ọ̀rọ̀ Gíríìkì náà kò ní article; “ife kan” ni ìtumọ̀ tààrà jù, bí ó tilẹ̀ jẹ́ pé àyíká oúnjẹ náà lè tọ́ka sí ife pàtó kan.
- source_word: εὐχαριστήσας
  choice: ó dúpẹ́
  rationale: Ìṣe dúpẹ́ yìí ṣẹlẹ̀ ṣáájú fífi ife náà fún wọn. Ìtòlẹ́sẹẹsẹ àwọn ọ̀rọ̀-ìṣe ní Yorùbá mú ìbáṣepọ̀ àkókò náà ṣe kedere láìfi èdè ìsìn ayẹyẹ kún un.
- source_word: ἔδωκεν αὐτοῖς
  choice: ó sì fi fún wọn
  rationale: “Fi fún” jẹ́ ọ̀nà Yorùbá àdánidá; ohun tí ó fi fún wọn, ìyẹn ife náà, ti hàn gbangba láti inú àyíká.
- source_word: ἔπιον
  choice: mu
  rationale: “Mu” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá aorist verb náà mu ní àyíká yìí.
- source_word: ἐξ αὐτοῦ
  choice: nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ife; “nínú rẹ̀” fi hàn ní àdánidá pé inú ife náà ni wọn ti mu.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ìgbékalẹ̀ yìí pa ìtẹnumọ́ mọ́ pé olúkúlùkù wọn ló mu.
theological_decisions:
- issue: Ìtumọ̀ ti εὐχαριστήσας tó lè ní ìró ti Oúnjẹ Alẹ́ Olúwa
  choice: ó dúpẹ́
  alternative: ó súre sí i; ó ṣe ìdúpẹ́ ayẹyẹ
  rationale: εὐχαριστέω túmọ̀ sí dúpẹ́ ní tààrà. Ìtumọ̀ náà kò gbọ́dọ̀ fi àwọn ọ̀rọ̀ ìsìn tàbí ẹ̀kọ́ ṣọ́ọ̀ṣì tí ó wá lẹ́yìn náà sínú ẹsẹ̀ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì yé àwọn òǹkàwé lasán. A lo àtẹ̀lé àwọn ọ̀rọ̀-ìṣe pẹ̀lú “ó sì” láti gbé ìtẹ̀síwájú ìtàn Gíríìkì jáde ní ọ̀nà Yorùbá àdánidá; a sì fi àmì ohùn sí ibi tó yẹ.
