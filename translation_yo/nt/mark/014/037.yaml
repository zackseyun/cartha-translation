source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: yo
  text: Ó sì wá, ó sì bá wọn tí wọ́n ń sùn, ó sì sọ fún Pétérù pé, “Símónì, ṣé o ń sùn? Ṣé o kò lè wà lójúfò fún wákàtí kan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé o kò lè ṣọ́ fún wákàtí kan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Ó sì wá
  rationale: A lo ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí ní ìtumọ̀ ìtàn Yorùbá láti pa ìmúniláradá ti historical present Máríkọ̀ mọ́.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: ó sì bá wọn tí wọ́n ń sùn
  rationale: ‘Bá’ jẹ́ ọ̀nà àdánidá láti sọ pé ó rí wọn ní ipò tí wọ́n ń sùn; ‘ń sùn’ sì fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: λέγει τῷ Πέτρῳ
  choice: ó sì sọ fún Pétérù
  rationale: Èyí mú àsìkò ìsinsìnyí inú ìtàn àti ẹni tí ọ̀rọ̀ náà ń tọ̀ sí jáde ní Yorùbá àdánidá.
- source_word: Σίμων
  choice: Símónì
  rationale: A pa orúkọ tí Jésù fi pè Pétérù mọ́, kí ìyàtọ̀ rẹ̀ sí ‘Pétérù’ tó ṣáájú lè hàn.
- source_word: καθεύδεις
  choice: ṣé o ń sùn?
  rationale: Ìbéèrè yìí tọ́ka sí ohun tí Símónì ń ṣe ní àkókò náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: οὐκ ἴσχυσας
  choice: Ṣé o kò lè
  rationale: Nínú àyíká yìí, ἰσχύω ń sọ nípa agbára tàbí àǹfààní láti ṣe ohun kan; ‘kò lè’ jẹ́ àdánidá ju fífi agbára ara hàn lọ.
- source_word: μίαν ὥραν
  choice: fún wákàtí kan
  rationale: A fi ‘fún’ hàn gẹ́gẹ́ bí àkókò tí ìṣe náà gbọ́dọ̀ fi pé.
- source_word: γρηγορῆσαι
  choice: máa ṣọ́nà
  rationale: Nítorí pé a bá wọn tí wọ́n ń sùn, ‘ṣọ́nà’ sọ ìdúró lójúfò àti ìṣọ́ra papọ̀ ní Yorùbá.
theological_decisions:
- issue: Pípa historical present Máríkọ̀ mọ́
  choice: A lo ‘Ó sì wá … ó sì bá … ó sì sọ’ nínú ìtàn.
  alternative: Lílo àsìkò tí ó ti kọjá ní kíkún, bí ‘ó wá … ó bá … ó sọ.’
  rationale: Ìlò Yorùbá yìí lè ru ìtàn lọ ní ọ̀nà tó láàyè, ó sì tẹ̀lé bí àwọn ọ̀rọ̀-ìṣe Gíríìkì ṣe wà ní àsìkò ìsinsìnyí láì mú kí gbolohun di àjèjì.
- issue: Ìtumọ̀ γρηγορέω nínú àyíká
  choice: máa ṣọ́nà
  alternative: máa ṣọ́; má ṣe sùn
  rationale: ‘Ṣọ́nà’ mú ìtumọ̀ jíjí láìsùn àti wíwà lójúfò hàn. Ó pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ìṣọ́ra tẹ̀mí láì sọ ọ̀rọ̀ náà di ẹ̀kọ́ ìjọ kan pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò. A lo ‘ṣé’ fún ìbéèrè tààrà, ‘ń sùn’ fún ìṣe tó ń lọ lọ́wọ́, àti àwọn àmì ohùn ní kíkún níbi tí wọ́n ti bá Yorùbá boṣewa mu.
