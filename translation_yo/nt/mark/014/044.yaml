source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: yo
  text: Ẹni tí ó ń ta á ti fún wọn ní àmì ìdámọ̀ kan[a], ó ní, “Ẹni tí mo bá fi ẹnu kò lẹ́nu[b], òun ni. Ẹ mú un, kí ẹ sì mú un lọ pẹ̀lú ìṣọ́ra[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àmì kan”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àmì ìdámọ̀ tí wọ́n ti fohùn ṣọ̀kan lé lórí.
    reason: lexical_alternative
  - marker: b
    text: Fífi ẹnu kò ẹnì kan lẹ́nu jẹ́ ọ̀nà ìkíni tí ó wọ́pọ̀ nígbà náà; níbí, Judasi lò ó gẹ́gẹ́ bí àmì láti fi dá Jesu mọ̀.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “kí ẹ sì mú un lọ ní ààbò.” Ní àyíká yìí, ó ṣeé ṣe kí èrò pàtàkì jẹ́ pé kí wọ́n ṣọ́ ọ dáadáa, kí ó má bàa bọ́ lọ́wọ́ wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: ti fún
  rationale: Ìṣe àsìkò tí ó ti kọjá yìí fi hàn pé ó ti ṣètò àmì náà ṣáájú ìṣẹ̀lẹ̀ ìmú Jesu; “ti fún” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: Ẹni tí ó ń dà á
  rationale: Ó pa ìtumọ̀ ẹni tó ń fi Jesu lé àwọn ọ̀tá lọ́wọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà ọ̀dàlẹ̀ nínú àyíká yìí.
- source_word: σύσσημον
  choice: àmì ìdámọ̀ kan
  rationale: Ọ̀rọ̀ náà tọ́ka sí àmì tí wọ́n ti fohùn ṣọ̀kan lé lórí láti fi dá ẹni kan mọ̀; “àmì ìdámọ̀” mú iṣẹ́ àmì náà ṣe kedere láìsọ ju orísun lọ.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti so ohun tí ó ti ṣe mọ́ ọ̀rọ̀ tí ó sọ.
- source_word: Ὃν ἂν φιλήσω
  choice: Ẹni tí mo bá fi ẹnu kò lẹ́nu
  rationale: “Ẹni tí … bá” pa ìtumọ̀ gbólóhùn ìbátan aláìdánilójú náà mọ́; “fi ẹnu kò lẹ́nu” jẹ́ ọ̀nà Yorùbá àdánidá fún fífẹnu-konu.
- source_word: αὐτός ἐστιν
  choice: òun ni
  rationale: Ó ṣetọju ìtẹnumọ́ ìdámọ̀ inú Gíríìkì ní ọ̀nà kúkúrú, àdánidá ní Yorùbá.
- source_word: κρατήσατε
  choice: Ẹ mú un
  rationale: Ó sọ ìmú ẹni náà pẹ̀lú agbára, láìfi ìtumọ̀ ìlànà òfin tí “ẹ mú un bí ẹlẹ́wọ̀n” lè kó wọlé.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: kí ẹ sì mú un lọ lábẹ́ ìṣọ́ tó dájú
  rationale: Nínú àyíká ìmú yìí, gbólóhùn náà fi hàn pé kí wọ́n mú un lọ ní ọ̀nà tí yóò máa wà lábẹ́ àkóso wọn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn, “ní ààbò,” mọ́.
