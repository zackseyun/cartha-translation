translation_notes:
  register: A lo Yorùbá àfọwọ́dá, ọ̀wọ̀, tí ó sì yé òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá yẹ. Ìtumọ̀ náà tẹ̀ lé ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀ Gíríìkì, kò sì fi ọ̀rọ̀ àsopọ̀ bí “Ní báyìí” kún un ní ìbẹ̀rẹ̀.
