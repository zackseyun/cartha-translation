  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ gbogbogbòò Gíríìkì dáadáa: àkókò tí ó ti kọjá nínú δεδώκει, àmì tí a ti ṣètò, ìdámọ̀ nípasẹ̀ ìfẹnu-kíni, àti àwọn àṣẹ méjèèjì ni a gbé kalẹ̀. Síbẹ̀, “Ẹni tí ó ń dà á” kò ṣàfihàn παραδιδοὺς ní kedere ní Yorùbá, ó sì lè yí ìtumọ̀ sí ọ̀nà mìíràn. “Lábẹ́ ìṣọ́ tó dájú” tún sọ ohun tí ἀσφαλῶς túmọ̀ sí di pàtó jù, bí ẹni pé ìṣọ́ ológun tàbí ẹ̀wọ̀n ni orísun sọ.'
  naturalness: Ọ̀pọ̀ nínú gbólóhùn náà jẹ́ Yorùbá òde òní tí ó mọ́. “Ẹni tí ó ń ta á” jẹ́ ọ̀nà tó ṣe kedere, tó sì rọrùn láti lóye fún ẹni tó ń dà Jesu. “Pẹ̀lú ìṣọ́ra” pa ìtumọ̀ ‘securely/carefully’ mọ́ láìsọ ìṣọ́ pàtó kan. A tún gbe àmì àlàyé ìfẹnu-kíni sí ibi tí ọ̀rọ̀ náà wà gan-an.
  terminology: “Àmì ìdámọ̀” yẹ fún σύσσημον; “òun ni” mú ìtẹnumọ́ ìdámọ̀ αὐτός ἐστιν wá ní ti ara; “Ẹ mú un” sì yẹ fún κρατήσατε. “Ta á” jẹ́ ìlò tí ó wọ́pọ̀ nínú àyíká ìwà ọ̀dàlẹ̀ fún παραδίδωμι, láìfikún ẹni tí a fi í lé lọ́wọ́.
  issues:
  - severity: medium
    issue: “Ẹni tí ó ń dà á” kò jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún ‘ẹni tí ó ń fi í lé ọwọ́’/‘ẹni tí ń da a’ nínú ìtumọ̀ ìwà ọ̀dàlẹ̀.
    rationale: Ọ̀rọ̀ náà lè máa túmọ̀ sí ‘pours it’ tàbí ohun mìíràn, nítorí náà kò dá ìṣe παραδιδοὺς mọ́ ní kedere. “Ẹni tí ó ń ta á” jẹ́ ìlò àdánidá fún ẹni tó ń hùwà ìdàjẹ ẹni.
  - severity: medium
    issue: “Lábẹ́ ìṣọ́ tó dájú” jẹ́ ìtumọ̀ tó di pàtó jù fún ἀσφαλῶς.
    rationale: Gíríìkì náà ní ‘securely/safely’ ní ìtumọ̀ tí ó lè ní ààyè díẹ̀. Kò sọ ní tààrà pé kí wọ́n fi sí abẹ́ ìṣọ́. “Pẹ̀lú ìṣọ́ra” dá ìtumọ̀ náà dúró, àlàyé ìsàlẹ̀ sì lè ṣàfihàn èrò pé kí ó má bọ́ lọ́wọ́ wọn.
