revisions:
- from: Lẹ́sẹ̀kẹsẹ̀, àkùkọ ké lẹ́ẹ̀kejì. Pétérù sì rántí ọ̀rọ̀ tí Jésù ti sọ fún un pé, “Kí àkùkọ tó ké lẹ́ẹ̀mejì, ìwọ yóò sẹ́ mi lẹ́ẹ̀mẹ́ta.” Nígbà náà, ọkàn rẹ̀ bàjẹ́, ó sì sunkún.[a]
  to: Lẹ́sẹ̀kẹsẹ̀, àkùkọ ké lẹ́ẹ̀kejì. Pétérù sì rántí ọ̀rọ̀ tí Jésù ti sọ fún un pé, “Kí àkùkọ tó ké lẹ́ẹ̀mejì, ìwọ yóò sẹ́ mí lẹ́ẹ̀mẹ́ta.” Nígbà tí ó ronú lórí èyí, ó sunkún.[a]
  rationale: A rọ́pò ìsọ̀rọ̀ tí ó dá ìbànújẹ́ inú ọkàn Pétérù lójú pẹlu ìtumọ̀ kan tí ó ti ní ìtẹ́wọ́gbà fún alábápín Gíríìkì tí ó ṣòro náà. Àlàyé ìsàlẹ̀ ń pa àìdánilójú ìtumọ̀ náà mọ́, pẹ̀lú aṣàyàn ìtumọ̀ ìmọ̀lára àti ìfarahàn ara, ní ìbámu pẹ̀lú ẹ̀rí Gíríìkì àti ọ̀nà àyẹ̀wò Gẹ̀ẹ́sì.
