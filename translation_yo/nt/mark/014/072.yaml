id: MRK.14.72
reference: Mark 14:72
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, àkùkọ ké lẹ́ẹ̀kejì. Pétérù sì rántí ọ̀rọ̀ tí Jésù ti sọ fún un pé, “Kí àkùkọ tó ké lẹ́ẹ̀mejì, ìwọ yóò sẹ́ mí lẹ́ẹ̀mẹ́ta.” Nígbà tí ó ronú lórí èyí, ó sunkún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dààmú gidigidi, ó sunkún.” Ọ̀rọ̀ Gíríìkì ἐπιβαλών ṣòro láti túmọ̀ níbí; a tún ti lóye rẹ̀ gẹ́gẹ́ bí ìyípadà inú ọkàn tàbí ìfarahàn ara kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ hàn, ó sì bá ìlò Máàkù tí ó sábà máa ń mú ìtàn lọ kánkán mu.
- source_word: ἐκ δευτέρου
  choice: lẹ́ẹ̀kejì
  rationale: Ìtumọ̀ rẹ̀ ni pé ohun náà ṣẹlẹ̀ fún ìgbà kejì; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀλέκτωρ ... ἐφώνησεν
  choice: àkùkọ ké
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé jù lọ láti sọ igbe àkùkọ.
- source_word: ἀνεμνήσθη
  choice: rántí
  rationale: Ó sọ ìṣe Pétérù ní tààrà pé ó tún mú ọ̀rọ̀ náà wá sí ọkàn.
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ọ̀rọ̀ tí Jésù ti sọ fún un
  rationale: Ó túmọ̀ ῥῆμα gẹ́gẹ́ bí ọ̀rọ̀ tàbí àsọjáde, ó sì so ẹ̀ka ὡς mọ́ àkóónú ohun tí Pétérù rántí ní Yorùbá tó mọ́.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Kí àkùkọ tó ké lẹ́ẹ̀mejì
  rationale: Ó pa ìbáṣepọ̀ àkókò πρίν mọ́, kò sì fi hàn pé àkùkọ kan pàtó ni.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ìwọ yóò sẹ́ mi lẹ́ẹ̀mẹ́ta
  rationale: ‘Sẹ́ mi’ jẹ́ ọ̀nà ṣókí, àdánidá láti sọ kíkọ́ ẹni tàbí ìbáṣepọ̀ ẹni, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπιβαλών
  choice: Nígbà náà, ọkàn rẹ̀ bàjẹ́
  rationale: Ọ̀rọ̀ alábápín yìí ṣòro láti dá lójú. Ìtumọ̀ yìí fi ìparun ọkàn Pétérù hàn láìfi ìfarahàn ara kan tí Gíríìkì kò fi dájú kún un; àìdánilójú náà wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔκλαιεν
  choice: ó sì sunkún
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó bójú mu, tó sì ní iyì fún ìṣe ẹkún tí ó ń bá a lọ nínú àyíká ìtàn.
theological_decisions:
- issue: Ìtumọ̀ alábápín ἐπιβαλών tí kò ṣe kedere
  choice: Nígbà náà, ọkàn rẹ̀ bàjẹ́
  alternative: ‘nígbà tí ó ronú lé e lórí’; tàbí ìfarahàn ara bí fífi aṣọ bo orí tàbí fífi ara sọ̀ kalẹ̀
  rationale: Ọ̀ràn ìtumọ̀ ọ̀rọ̀ àti ìlò gírámà ni èyí ní pàtàkì, ṣùgbọ́n ó kan bí a ṣe fi ìbànújẹ́ àti ìrònúpìwàdà Pétérù hàn. Aṣàyàn náà mú agbára ìmọ̀lára wá láìdá ìfarahàn ara kan tí kò dájú sílẹ̀ gẹ́gẹ́ bí òtítọ́; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá àkókò yìí jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé lásán, ó sì lo àmì ohùn ní kíkún. A lo ‘àkùkọ ké,’ ‘sẹ́ mi,’ àti ‘ọkàn rẹ̀ bàjẹ́’ gẹ́gẹ́ bí àwọn gbólóhùn àdánidá, láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan kún ọ̀rọ̀.
