  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Lóòótọ́ ni mo wí fún ọ, lónìí, ní òru yìí gan-an, kí àkùkọ tó kọ lẹ́ẹ̀mejì, ìwọ yóò sẹ́ mi lẹ́ẹ̀mẹ́ta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: wí
  rationale: A lo ọ̀rọ̀ ìṣe ní ìsinsìnyí láti pa ìsinsìnyí ìtàn tí Máàkù lò mọ́, dípò yíyí i sí àsìkò àtijọ́.
- source_word: Ἀμὴν λέγω σοι
  choice: Lóòótọ́ ni mo wí fún ọ
  rationale: Èyí fi agbára ìjẹ́rìí ọ̀rọ̀ Jésù hàn ní Yorùbá àdánidá, tí ó sì pa ìtọ́kasí tààrà sí ẹni tí ó ń bá sọ̀rọ̀ mọ́.
- source_word: σήμερον · ταύτῃ τῇ νυκτί
  choice: lónìí, ní òru yìí gan-an
  rationale: A pa àwọn àkókò méjèèjì mọ́, bí Gíríìkì ṣe ní wọn, kí ìtẹnumọ́ pé ohun náà sún mọ́lé má bàjẹ́.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: àkùkọ tó kọ lẹ́ẹ̀mejì
  rationale: ‘Àkùkọ kọ’ ni ọ̀nà Yorùbá àdánidá láti sọ igbe àkùkọ; ‘lẹ́ẹ̀mejì’ sì pa iye tí Máàkù sọ mọ́.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ìwọ yóò sẹ́ mi lẹ́ẹ̀mẹ́ta
  rationale: ‘Sẹ́ mi’ jẹ́ ọ̀rọ̀ kedere fún kíkọ́ pé ẹni mọ Jésù tàbí pé ó ní ìbáṣepọ̀ pẹ̀lú rẹ̀; a fi ‘ìwọ’ hàn láti gbé tẹnumọ́ σὺ jáde.
theological_decisions:
- issue: Àpapọ̀ σήμερον àti ταύτῃ τῇ νυκτί
  choice: Pa méjèèjì mọ́ gẹ́gẹ́ bí ‘lónìí, ní òru yìí gan-an’
  alternative: Ṣàkópọ̀ wọn sí ‘ní òru yìí gan-an’ nìkan
  rationale: Ọ̀rọ̀ Gíríìkì ní àfihàn àkókò méjèèjì, ó sì ṣeé ṣe kí wọ́n jẹ́ ìtẹnumọ́; mímú wọn méjèèjì wọlé kò yanjú ìtumọ̀ náà kọjá ohun tí orísun sọ.
- issue: Ìsinsìnyí ìtàn nínú λέγει
  choice: ‘Jésù sì wí’ ní ìsinsìnyí ìtàn
  alternative: ‘Jésù sì sọ’ gẹ́gẹ́ bí ohun tó ti kọjá
  rationale: Yíyan ìsinsìnyí ń jẹ́ kí àṣà ìtàn Máàkù hàn, láìjẹ́ kí Yorùbá di aláìdánidá.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; àmì ohùn ni a lò níbi tí ó yẹ. Kò sí àlàyé ẹ̀kọ́ ìjọ kan tí a fi kún un.
