  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: yo
  text: Ọmọbìnrin ìránṣẹ́ náà rí i, ó sì tún bẹ̀rẹ̀ sí í sọ fún àwọn tí ó dúró níbẹ̀ pé, “Ọkùnrin yìí jẹ́ ọ̀kan lára wọn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: ọmọbìnrin ìránṣẹ́
  rationale: Ó túmọ̀ sí ọ̀dọ́bìnrin tó ń ṣiṣẹ́ gẹ́gẹ́ bí ìránṣẹ́. Ọ̀rọ̀ yìí jẹ́ ti Yorùbá òde òní, ó sì yẹ fún àyíká àgbàlá náà láìfi ipò ẹrú tí àyọkà kò tẹnumọ́ kún un.
- source_word: ἰδοῦσα
  choice: rí i
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe tó bá ìtàn Yorùbá mu; ó fi hàn pé rírí Peteru ló ṣáájú ọ̀rọ̀ rẹ̀.
- source_word: ἤρξατο πάλιν λέγειν
  choice: tún bẹ̀rẹ̀ sí í sọ
  rationale: Èyí pa ìtumọ̀ ìbẹ̀rẹ̀ inú ἤρξατο àti ìtúnṣe inú πάλιν mọ́, ní ọ̀nà tó ṣe déédéé ní Yorùbá.
- source_word: τοῖς παρεστῶσιν
  choice: fún àwọn tí ó dúró níbẹ̀
  rationale: Ó pa èrò àwọn tó wà tí wọ́n sì dúró nítòsí mọ́, láìsọ ọ̀rọ̀ náà di ti àtijọ́ tàbí aláìmọ́.
- source_word: Οὗτος
  choice: Ọkùnrin yìí
  rationale: Demonstrative náà tọ́ka sí Peteru ní tààràtà; fífi “ọkùnrin” kún un jẹ́ ọ̀nà Yorùbá tó ṣe kedere nínú ẹ̀sùn yìí.
- source_word: ἐξ αὐτῶν
  choice: jẹ́ ọ̀kan lára wọn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ ọmọ ẹgbẹ́ wọn tàbí jíjẹ́ ọ̀kan nínú àwọn tó bá Jesu rìn; àyànmọ́ yìí jẹ́ kedere, ó sì jẹ́ ti Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ìtàn, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹ̀síwájú ìṣe àti ìtúnṣe “tún bẹ̀rẹ̀” mọ́.
