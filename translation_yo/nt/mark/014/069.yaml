  source_fidelity: Ìtumọ̀ náà fi παιδίσκη hàn gẹ́gẹ́ bí “Ọmọbìnrin ìránṣẹ́ náà,” ó sì tọ́ka sí i ní ìbámu pẹ̀lú ọ̀rọ̀-ìṣe participle ἰδοῦσα. “Ó sì tún bẹ̀rẹ̀ sí í sọ” pa ipa ìbẹ̀rẹ̀ ἤρξατο àti πάλιν (“tún”) mọ́. “Fún àwọn tí ó dúró níbẹ̀” jẹ́ ìtumọ̀ tó pé fún τοῖς παρεστῶσιν, àti “jẹ́ ọ̀kan lára wọn” dá ἐξ αὐτῶν hàn dáadáa.
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa tó rọrùn láti ka, pẹ̀lú àmì ohùn tó yẹ. Ìṣọ̀kan ìtàn náà—rírí i, lẹ́yìn náà sísọ fún àwọn tó wà nítòsí—jẹ́ adayeba.
  terminology: “Ọmọbìnrin ìránṣẹ́,” “Ọkùnrin yìí,” àti “ọ̀kan lára wọn” jẹ́ àṣàyàn ọ̀rọ̀ tó ṣe kedere, tó bá ìforúkọsílẹ̀ ìtàn mu, tí kò sì fi ìtumọ̀ ẹ̀kọ́-ìjọ kún ọ̀rọ̀ náà.
