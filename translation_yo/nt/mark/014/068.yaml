id: MRK.14.68
reference: Mark 14:68
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: yo
  text: Ṣùgbọ́n ó sẹ́, ó ní, “Èmi kò mọ̀, mi ò sì lóye ohun tí ìwọ ń sọ.” Ó sì jáde lọ sí ẹnu-ọ̀nà àgbàlá, àkùkọ kan sì kọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ẹ̀dà àfọwọ́kọ kan kò ní: “àkùkọ kan sì kọ.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ó sẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó kọ̀ tàbí ó sẹ́ ohun tí wọ́n fẹ̀sùn rẹ̀ kàn. Jíjẹ́ kí ọ̀rọ̀ náà dúró láìfi ohun tàbí ẹni kan kún un tẹ̀ lé èdè Gíríìkì, ó sì yẹra fún ṣíṣe àlàyé rẹ̀ sí ‘ó sẹ́ Jésù.’
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Èmi kò mọ̀, mi ò sì lóye
  rationale: Àwọn ọ̀rọ̀-ìṣe méjèèjì ń mú kí ìsẹ́ Pétérù le sí i. ‘Kò mọ̀’ àti ‘kò lóye’ pa ìtẹnumọ́ méjì náà mọ́ ní Yorùbá àdánidá.
- source_word: σὺ τί λέγεις
  choice: ohun tí ìwọ ń sọ
  rationale: Èyí túmọ̀ gígùn ọ̀rọ̀ Gíríìkì ní tààrà, ó sì pa ìtẹnumọ́ orúkọ arọ́pò-orúkọ ‘ìwọ’ mọ́.
- source_word: ἐξῆλθεν ἔξω
  choice: ó jáde lọ
  rationale: Gbólóhùn yìí fi ìṣípò sí òde hàn ní Yorùbá àdánidá láìṣe àtúnwí tí kò pọndandan.
- source_word: προαύλιον
  choice: ẹnu-ọ̀nà àgbàlá
  rationale: Ọ̀rọ̀ náà tọ́ka sí ibi ìwọlé tàbí àyè tó wà níwájú àgbàlá inú, kì í ṣe àgbàlá pàtàkì náà lásán.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: àkùkọ kan sì kọ
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ìṣe àkùkọ ní Yorùbá; ‘kan’ tún bá àìsí atóka pàtó lórí ọ̀rọ̀-orúkọ Gíríìkì mu.
theological_decisions:
- issue: Bóyá a ó fi gbólóhùn καὶ ἀλέκτωρ ἐφώνησεν sínú ọ̀rọ̀ náà
  choice: A fi í sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ‘àkùkọ kan sì kọ.’
  alternative: Àwọn ẹ̀dà àfọwọ́kọ kan kò ní gbólóhùn náà.
  rationale: SBLGNT tí a pèsè fi gbólóhùn náà sínú ọ̀rọ̀ pẹ̀lú àmì pé ẹ̀rí àwọn àfọwọ́kọ yàtọ̀. Nítorí náà, a túmọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì, a sì sọ iyàtọ̀ náà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ; ‘mi ò’ jẹ́ ọ̀nà ọ̀rọ̀ Yorùbá àdánidá tí ó ṣì bójú mu fún ìjíròrò inú ìtàn, nígbà tí ‘ẹnu-ọ̀nà àgbàlá’ ń mú ìtumọ̀ ibi náà ṣe kedere fún òǹkàwé lónìí.
