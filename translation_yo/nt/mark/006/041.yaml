- from: Ó sì mú ìṣù àkàrà márùn-ún náà àti ẹja méjì náà; ó gbé ojú sókè sí ọ̀run, ó súre, ó sì bù àwọn ìṣù àkàrà náà. Ó ń fi wọ́n fún àwọn ọmọ-ẹ̀yìn rẹ̀ kí wọn lè gbé wọn ka iwájú àwọn ènìyàn; ó sì pín ẹja méjì náà fún gbogbo wọn.
  to: Ó sì mú àwọn búrẹ́dì márùn-ún náà àti ẹja méjì náà; ó gbé ojú sókè sí ọ̀run, ó súre, ó sì bù àwọn búrẹ́dì náà. Ó ń fi wọ́n fún àwọn ọmọ-ẹ̀yìn rẹ̀ kí wọ́n lè gbé wọn kalẹ̀ níwájú àwọn ènìyàn; ó sì pín ẹja méjì náà fún gbogbo wọn.
