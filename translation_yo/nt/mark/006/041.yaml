id: MRK.6.41
reference: Mark 6:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: yo
  text: Ó sì mú àwọn búrẹ́dì márùn-ún náà àti ẹja méjì náà; ó gbé ojú sókè sí ọ̀run, ó súre, ó sì bù àwọn búrẹ́dì náà. Ó ń fi wọ́n fún àwọn ọmọ-ẹ̀yìn rẹ̀ kí wọ́n lè gbé wọn kalẹ̀ níwájú àwọn ènìyàn; ó sì pín ẹja méjì náà fún gbogbo wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: ó sì mú
  rationale: Aorist participle náà bẹ̀rẹ̀ ìtẹ̀síwájú àwọn ìṣe; ‘ó sì mú’ jẹ́ ọ̀nà Yorùbá àdánidá láti so ìṣe yìí mọ́ ohun tó tẹ̀ lé e.
- source_word: τοὺς πέντε ἄρτους
  choice: ìṣù àkàrà márùn-ún náà
  rationale: ἄρτος níbí tọ́ka sí àwọn ìṣù oúnjẹ tí a lè kà, kì í ṣe oúnjẹ búrẹ́dì ní àpapọ̀; ‘ìṣù àkàrà’ mú ìrísí ohun tí a kà yẹn hàn láìfi búrẹ́dì òde òní wọ ọ́.
- source_word: τοὺς δύο ἰχθύας
  choice: ẹja méjì náà
  rationale: Ìtumọ̀ tààrà fún ọ̀pọ̀ ἰχθύς, pẹ̀lú iye méjì tí ọ̀rọ̀ Gíríìkì sọ ní kedere.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ó gbé ojú sókè sí ọ̀run
  rationale: Ó fi ìrìn ojú sókè àti ibi tí ojú náà dojú kọ hàn ní Yorùbá àdánidá, nígbà tó pa ìtumọ̀ ọ̀run mọ́.
- source_word: εὐλόγησεν
  choice: ó súre
  rationale: εὐλογέω túmọ̀ sí súre; ní àyíká oúnjẹ ó lè ní ìtumọ̀ tó sún mọ́ dúpẹ́, ṣùgbọ́n a pa ọ̀rọ̀ orísun náà mọ́ láìfi ohun tí ó súre fún sí i.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: ó sì bù àwọn ìṣù àkàrà náà
  rationale: ‘Bù’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún fífi oúnjẹ bí àkàrà tàbí búrẹ́dì ya sí wẹ́wẹ́, ó sì pa ohun tí a ṣe sí mọ́ ní kedere.
- source_word: ἐδίδου
  choice: ó ń fi wọ́n fún
  rationale: Àkókò imperfect fi ìṣe tó ń lọ tàbí tó ń tún ṣẹlẹ̀ hàn; ‘ó ń fi ... fún’ gbé ìtẹ̀síwájú pínpín náà jáde.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó pa possessive αὐτοῦ mọ́, ó sì lo ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún disciple.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: kí wọn lè gbé wọn ka iwájú àwọn ènìyàn
  rationale: ‘Kí ... lè’ fi ète ἵνα hàn; ‘gbé ... ka iwájú’ pa àwòrán fífi oúnjẹ síwájú àwọn tí yóò jẹ ẹ́ mọ́. ‘Àwọn ènìyàn’ mú ẹni tí αὐτοῖς ń tọ́ka sí yé kedere nínú àyíká.
- source_word: ἐμέρισεν πᾶσιν
  choice: ó sì pín ... fún gbogbo wọn
  rationale: ‘Pín ... fún’ fi ìtumọ̀ pínpín tàbí fífún ẹnì kọ̀ọ̀kan hàn, ‘gbogbo wọn’ sì dúró fún πᾶσιν.
theological_decisions:
- issue: Ìtumọ̀ εὐλόγησεν ní àyíká oúnjẹ
  choice: ó súre
  alternative: ó dúpẹ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ εὐλογέω, kì í ṣe εὐχαριστέω. ‘Ó súre’ jẹ́ èyí tó sún mọ́ ọ̀rọ̀ orísun jù, ó sì fi ààyè sílẹ̀ fún bí ìbùkún àti ìdúpẹ́ ṣe lè yí ara wọn ká ní àṣà jíjẹun.
- issue: Ohun tí a kò sọ lẹ́yìn εὐλόγησεν
  choice: 'a kò fi object kún un: ‘ó súre’'
  alternative: ó súre fún wọn / ó súre sí àwọn ìṣù àkàrà àti ẹja náà
  rationale: Gíríìkì kò sọ object ní kedere. Yíyọ̀ ọ́ sílẹ̀ dènà fífi ìtumọ̀ pé Jésù súre fún oúnjẹ náà gẹ́gẹ́ bí ohun tí a ṣe sí, nígbà tí ó tún jẹ́ Yorùbá tó pé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún olùkà òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ìṣù àkàrà’ dípò loanword ‘búrẹ́dì’ láti fi hàn pé àwọn ìṣù kéékèèké tí a lè kà ni ọ̀rọ̀ náà ń tọ́ka sí. Kò sí àlàyé ẹsẹ̀ tí ó pọn dandan; yíyan ‘ó súre’ pa ambiguity orísun mọ́.
