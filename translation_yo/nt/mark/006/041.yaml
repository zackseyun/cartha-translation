  source_fidelity: 'Ìtẹ̀lé èdè Gíríìkì dára lápapọ̀: a pa ìṣe tẹ̀léra, imperfect ti ἐδίδου (‘ó ń fi’), ète ἵνα, àti object tí a kò sọ lẹ́yìn εὐλόγησεν mọ́. Ṣùgbọ́n ‘ìṣù àkàrà’ kò bá ἄρτους mu dáadáa, nítorí ìṣù jẹ́ isu/túbà, kì í ṣe ìṣù búrẹ́dì.'
