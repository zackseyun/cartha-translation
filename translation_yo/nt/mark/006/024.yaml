source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: yo
  text: Ó sì jáde lọ, ó sọ fún ìyá rẹ̀ pé, “Kí ni kí n béèrè fún?” Ìyá rẹ̀ sì wí pé, “Orí Jòhánù Olùrìbọmi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jòhánù ẹni tí ń rìí bọmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: jáde lọ
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ jáde kí ó tó bá ìyá rẹ̀ sọ̀rọ̀; ìtẹ̀lé àwọn ọ̀rọ̀-ìṣe náà mú èyí ṣe kedere ní Yorùbá àdánidá.
- source_word: Τί αἰτήσωμαι
  choice: Kí ni kí n béèrè fún?
  rationale: Aorist middle subjunctive deliberative náà jẹ́ ìbéèrè nípa ohun tí ó yẹ kí ọmọbìnrin náà béèrè; gbolohun yìí sọ ìtumọ̀ náà ní Yorùbá tó ṣe déédé.
- source_word: μητρὶ αὐτῆς
  choice: ìyá rẹ̀
  rationale: Èyí túmọ̀ ìbátan àti ohun-ìní ọ̀rọ̀ Gíríìkì náà ní tààràtà.
- source_word: κεφαλήν
  choice: orí
  rationale: A pa ohun pàtó tí a béèrè fún mọ́ láìlo ọ̀rọ̀ ìrọ̀rùn láti bo ìbànújẹ rẹ̀ mọ́lẹ̀.
- source_word: τοῦ βαπτίζοντος
  choice: Arìbọmi
  rationale: Present participle tí a lò gẹ́gẹ́ bí orúkọ náà dá Jòhánù mọ̀ nípasẹ̀ iṣẹ́ àbùdá rẹ̀, ẹni tí ń rì àwọn ènìyàn bọmi. “Arìbọmi” jẹ́ oyè Yorùbá tó mọ́ nípa ìtumọ̀, láìjẹ́ kí ó dà bí orúkọ ẹ̀ka ìjọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ oyè Jòhánù, βαπτίζων
  choice: Arìbọmi
  alternative: Onírìbọmi
  rationale: A túmọ̀ participle náà gẹ́gẹ́ bí ẹni tí iṣẹ́ rẹ̀ ni ríri àwọn ènìyàn bọmi, dípò kí a mú un gẹ́gẹ́ bí àmì ẹ̀ka ìjọ. Àṣàyàn míì tó tún ṣeé lò ni “Onírìbọmi.”
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yé òǹkàwé òde òní. A pa ìtẹ̀lé ìṣẹ̀lẹ̀ àti líle ìbéèrè náà mọ́.
