id: MRK.6.15
reference: Mark 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ẹlòmíràn ń sọ pé, “Èlíjà ni,” àwọn ẹlòmíràn sì ń sọ pé, “Wòlíì kan ni, bí ọ̀kan lára àwọn wòlíì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ yìí kò ṣeé ṣe púpọ̀, “Wòlíì náà ni,” bí a bá gbà pé ó ń tọ́ka sí ẹni pàtó tí a ń retí ní àkókò ìkẹyìn; ṣùgbọ́n Gíríìkì ń fi “wòlíì kan” hàn dáadáa sí i níbí, nítorí ó tẹ̀ síwájú pé, “bí ọ̀kan lára àwọn wòlíì.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Ṣùgbọ́n àwọn ẹlòmíràn
  rationale: ἄλλοι tọ́ka sí ẹgbẹ́ mìíràn nínú àwọn èrò tí ènìyàn ń sọ, δέ sì fi ìyàtọ̀ díẹ̀ hàn; ‘Ṣùgbọ́n àwọn ẹlòmíràn’ jẹ́ ọ̀nà àdánidá láti pa ìyípadà ọ̀rọ̀ náà mọ́.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Ìṣe aláìpé náà lè fi ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí a ń tún sọ hàn; ‘ń sọ’ pa apá yìí mọ́ láìfi agbára tí kò sí nínú Gíríìkì kún un.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Èlíjà ni,”
  rationale: Ọ̀rọ̀ tààrà jẹ́ àdánidá lẹ́yìn ọ̀rọ̀-ìṣe sísọ ní Yorùbá, ‘Èlíjà ni’ sì pa gbólóhùn ìdánimọ̀ náà mọ́.
- source_word: προφήτης
  choice: Wòlíì kan
  rationale: 'Orúkọ náà kò ní árítíkù, àfikún ‘bí ọ̀kan lára àwọn wòlíì’ sì ń tọ́ka sí ìtumọ̀ àìní pàtó: wòlíì kan, kì í ṣe dandan ‘Wòlíì náà.’'
- source_word: ὡς εἷς τῶν προφητῶν
  choice: bí ọ̀kan lára àwọn wòlíì
  rationale: ὡς jẹ́ ìfiwéra níbí; ọ̀rọ̀ Yorùbá yìí sọ ìfiwéra náà ní kedere, ó sì pa èrò pé a ń fi Jésù wé àwọn wòlíì mọ́.
theological_decisions:
- issue: Bóyá προφήτης túmọ̀ sí wòlíì kan lápapọ̀ tàbí oyè pàtó ‘Wòlíì náà’
  choice: Wòlíì kan
  alternative: Wòlíì náà
  rationale: Gíríìkì kò lo árítíkù, ó sì tẹ̀ síwájú pẹ̀lú ‘bí ọ̀kan lára àwọn wòlíì,’ èyí tí ó ṣe àtìlẹ́yìn fún ìdánimọ̀ lápapọ̀. Àmọ́ àlàyé ìsàlẹ̀ fi ìtumọ̀ oyè pàtó náà sílẹ̀ gẹ́gẹ́ bí ohun tí ó ṣeé gbà, bí ó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó èkejì.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘wòlíì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì lo àtòpọ̀ ‘ń sọ’ láti pa ìṣe aláìpé mọ́.
