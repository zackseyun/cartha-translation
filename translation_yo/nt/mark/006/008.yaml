lexical_decisions:
- source_word: παρήγγειλεν
  choice: pàṣẹ fún wọn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífúnni ní ìtọ́ni tí ó ní agbára àṣẹ; “pàṣẹ fún wọn” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí kò sì sọ agbára ọ̀rọ̀ náà di aláìlágbára.
- source_word: μηδὲν αἴρωσιν
  choice: kí wọn má mú ohunkóhun lọ
  rationale: Nínú àyíká ìrìn-àjò, αἴρω túmọ̀ sí mímú tàbí gbígbé ohun lọ; gbólóhùn yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa ìfòfindè náà mọ́.
- source_word: εἰς ὁδὸν
  choice: fún ìrìn-àjò náà
  rationale: Èyí sọ ète ohun tí wọn ì bá mú lọ, ó sì jẹ́ ọ̀nà Yorùbá ti òde òní fún ọ̀rọ̀ nípa ìpèsè ìrìn-àjò.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: àfi ọ̀pá nìkan
  rationale: “Àfi” pa ìyàtọ̀ náà mọ́, “nìkan” sì fi ìtẹnumọ́ μόνον hàn; “ọ̀pá” lè jẹ́ ọ̀pá arìnrìn-àjò láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: Gíríìkì dárúkọ búrẹ́dì ní pàtó, nítorí náà a kò sọ ọ́ di “oúnjẹ” lápapọ̀.
- source_word: πήραν
  choice: àpò
  rationale: Πήρα jẹ́ àpò tí arìnrìn-àjò fi ń kó ìpèsè; “àpò” ṣe kedere nínú ọ̀rọ̀ àkọ́kọ́, àlàyé ìtumọ̀ pàtó sì wà ní àlàyé ìsàlẹ̀.
- source_word: ζώνην
  choice: àmùrè
  rationale: “Àmùrè” ni ohun tí a fi ń di ẹgbẹ́, tí a sì lè fi owó pamọ́ sí ní àṣà ìgbà náà.
- source_word: χαλκόν
  choice: idẹ
  rationale: A pa irin tí Gíríìkì dárúkọ mọ́ dípò yíyí rẹ̀ padà sí “owó” nìkan; àlàyé ìsàlẹ̀ ṣàlàyé pé owó ẹyọ idẹ ni a ń tọ́ka sí.
