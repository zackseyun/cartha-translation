  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: yo
  text: Ó sì pàṣẹ fún wọn pé kí wọn má mú ohunkóhun lọ fún ìrìn-àjò náà, àfi ọ̀pá nìkan—kí wọn má mú búrẹ́dì, má mú àpò[a], kí wọn má sì ní owó idẹ kankan[b] nínú àmùrè wọn—
  philosophy: optimal-equivalence
