id: MRK.6.34
reference: Mark 6:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: yo
  text: Nígbà tí ó sì jáde kúrò nínú ọkọ̀[a], ó rí ogunlọ́gọ̀ ènìyàn, àánú wọn sì ṣe é, nítorí wọ́n dà bí àgùntàn tí kò ní olùṣọ́.[b] Ó sì bẹ̀rẹ̀ sí í kọ́ wọn ní ọ̀pọ̀lọpọ̀ ohun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘nígbà tí ó jáde.’ Àyíká ìtàn fi hàn pé ó jáde kúrò nínú ọkọ̀ sí orí ilẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Àwòrán ‘àgùntàn tí kò ní olùṣọ́’ fara jọ èdè Bíbélì nípa àwọn ènìyàn tí kò ní aṣáájú olóòótọ́; wo Númérì 27:17; 1 Àwọn Ọba 22:17; Ìsíkíẹ́lì 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: nígbà tí ó jáde kúrò nínú ọkọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘nígbà tí ó jáde.’ Àyíká ìtàn ní Máàkù 6:32–33 fi hàn pé ó ń jáde kúrò nínú ọkọ̀ sí orí ilẹ̀; ìtumọ̀ yìí mú ìṣẹ̀lẹ̀ náà ṣe kedere láì fi ohun tí kò sí nínú àyíká kún un.
- source_word: πολὺν ὄχλον
  choice: ogunlọ́gọ̀ ènìyàn
  rationale: Ó sọ iye ènìyàn púpọ̀ tí ó péjọ sí ibi kan; ‘ogunlọ́gọ̀ ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ‘àwùjọ ńlá.’
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτούς
  choice: àánú wọn ṣe é
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka sí ìmọ̀lára àánú jíjinlẹ̀. ‘Àánú wọn ṣe é’ jẹ́ gbólóhùn Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: wọ́n dà bí àgùntàn tí kò ní olùṣọ́
  rationale: A pa àfiwé olùṣọ́ àti àgùntàn mọ́ gẹ́gẹ́ bí ó ṣe wà nínú orísun, láì túmọ̀ rẹ̀ sí ‘àìní aṣáájú ẹ̀mí’ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: ó bẹ̀rẹ̀ sí í kọ́ wọn ní ọ̀pọ̀lọpọ̀ ohun
  rationale: ‘Bẹ̀rẹ̀ sí í kọ́’ pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ náà mọ́, ‘ọ̀pọ̀lọpọ̀ ohun’ sì fi πολλά hàn gẹ́gẹ́ bí ọ̀pọ̀ kókó ẹ̀kọ́.
theological_decisions:
- issue: Àwòrán àgùntàn tí kò ní olùṣọ́
  choice: A pa àfiwé náà mọ́ láì ṣàlàyé rẹ̀ síwájú nínú ọ̀rọ̀ pàtàkì.
  alternative: wọ́n dà bí àwọn ènìyàn tí kò ní aṣáájú ẹ̀mí
  rationale: Àfiwé náà rántí èdè Májẹ̀mú Láéláé nípa àwọn ènìyàn Ọlọ́run àti àwọn aṣáájú wọn, ṣùgbọ́n ṣíṣàlàyé rẹ̀ nínú ọ̀rọ̀ pàtàkì yóò dín ìtumọ̀ rẹ̀ kù, yóò sì yanjú ohun tí orísun fi sílẹ̀ ní ìmọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Àánú wọn ṣe é’ jẹ́ ọ̀nà àdánidá tí òǹkàwé Yorùbá lásán lè lóye; ‘ogunlọ́gọ̀ ènìyàn’ sì mú ìtúmọ̀ àwùjọ ńlá jáde kedere.
