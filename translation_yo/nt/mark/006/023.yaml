source:
  edition: SBLGNT
  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: yo
  text: Ó sì búra fún un pé, “Ohunkóhun[a] tí o bá béèrè lọ́wọ́ mi, màá fún ọ, títí dé ìdajì ìjọba mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun yòówù tí o bá béèrè lọ́wọ́ mi.”
    reason: lexical_alternative
  - marker: b
    text: “Títí dé ìdajì ìjọba mi” jẹ́ ọ̀nà àsọdùn tí àwọn ọba máa ń gbà ṣe ìlérí ńlá.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: búra
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ìbúra. “Búra” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ìlérí oníbúra náà mọ́.
- source_word: αὐτῇ
  choice: fún un
  rationale: Dátífù náà tọ́ka sí ọmọbìnrin tí Hẹ́rọ́dù ń bá sọ̀rọ̀; “fún un” jẹ́ ìtumọ̀ àdánidá ní Yorùbá.
- source_word: Ὅ τι ἐάν
  choice: Ohunkóhun tí ... bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí fi ohun tí a kò dá mọ́, tí kò sì ní ààlà pàtó hàn. Ìkọ̀lé “ohunkóhun tí ... bá” mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: με αἰτήσῃς
  choice: o bá béèrè lọ́wọ́ mi
  rationale: αἰτέω túmọ̀ sí béèrè tàbí tọrọ ohun kan. “Béèrè lọ́wọ́ mi” bá ọ̀rọ̀ tààrà yìí mu, kò sì fi ohun tí ẹni náà yóò béèrè kún un.
- source_word: δώσω σοι
  choice: ni èmi yóò fún ọ
  rationale: Ọ̀rọ̀ ọ̀la náà jẹ́ ìlérí pàtó. Fífi “èmi” hàn ń tẹ ẹni tó ṣe ìlérí náà mọ́lẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń ṣe nínú àyíká yìí.
- source_word: ἕως ἡμίσους
  choice: títí dé ìdajì
  rationale: Níbí, ἕως ń fi òpin ìwọ̀n hàn, kì í ṣe òpin àkókò. “Títí dé ìdajì” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún ìwọ̀n náà.
- source_word: τῆς βασιλείας μου
  choice: ìjọba mi
  rationale: Nínú àyíká ìlérí ọba yìí, βασιλεία tọ́ka sí ìjọba tàbí ilẹ̀-ọba rẹ̀. “Ìjọba mi” pa àwòrán ọba àti ìtumọ̀ gbooro ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία nínú ọ̀rọ̀ Hẹ́rọ́dù
  choice: ìjọba
  alternative: ìṣàkóso ọba; ilẹ̀-ọba
  rationale: βασιλεία lè túmọ̀ sí ìjọba gẹ́gẹ́ bí agbègbè tàbí sí àṣẹ ìṣàkóso. Nínú ìlérí àsọdùn ti ọba yìí, “ìjọba” jẹ́ èyí tó bá àyíká mu jù, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtó.
translation_notes:
  register: A lo Yorùbá boṣewa, èdè ọlọ́wọ̀ àti àdánidá. “Búra,” “béèrè lọ́wọ́ mi,” àti “títí dé ìdajì ìjọba mi” jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, tí ó sì pa ìwúwo àti àsọdùn ọ̀rọ̀ Hẹ́rọ́dù mọ́.
