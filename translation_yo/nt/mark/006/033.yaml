  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì rí wọn bí wọ́n ti ń lọ, wọ́n sì dá wọn mọ̀. Àwọn ènìyàn láti gbogbo àwọn ìlú[a] sì fi ẹsẹ̀[b] sáré lọ síbẹ̀ papọ̀, wọ́n sì dé ibẹ̀ ṣáájú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti gbogbo àwọn ìlú ńlá àti kékeré.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìlú ńlá tàbí ìlú kékeré, gẹ́gẹ́ bí àyíká ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gba orí ilẹ̀ lọ,” èyí tó tẹnu mọ́ ìyàtọ̀ sí ìrìn wọn nínú ọkọ̀ ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: rí
  rationale: Ọ̀rọ̀ yìí sọ ní tààrà pé wọ́n fi ojú rí wọn, láìfi ìtumọ̀ míì kún un.
- source_word: ὑπάγοντας
  choice: bí wọ́n ti ń lọ
  rationale: Ó fi hàn pé wọ́n wà lójú ọ̀nà nígbà tí àwọn ènìyàn rí wọn; àyíká ẹsẹ tó ṣáájú ti sọ pé ọkọ̀ ojú omi ni wọ́n wọ̀.
- source_word: ἐπέγνωσαν
  choice: dá wọn mọ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé àwọn ènìyàn mọ ẹni tí wọ́n jẹ́, kì í ṣe pé wọ́n ṣẹ̀ṣẹ̀ ní ìmọ̀ nípa wọn.
- source_word: πολλοί
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Àfikún ‘ènìyàn’ jẹ́ kí ọ̀rọ̀ náà ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: πεζῇ
  choice: fi ẹsẹ̀
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín ìrìn wọn lórí ilẹ̀ àti ìrìn Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ nínú ọkọ̀ ojú omi.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: láti gbogbo àwọn ìlú
  rationale: ‘Ìlú’ lè tọ́ka sí ìlú kékeré tàbí ńlá ní Yorùbá, ó sì bá ìtumọ̀ πόλις ní àyíká Gálílì mu.
- source_word: συνέδραμον
  choice: sáré lọ síbẹ̀ papọ̀
  rationale: Ìtumọ̀ náà pa ìsáré àti bí àwọn ènìyàn ṣe kóra jọ lọ sí ibi kan náà mọ́.
- source_word: ἐκεῖ
  choice: síbẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti tọ́ka sí ibi tí wọ́n ń lọ.
- source_word: προῆλθον αὐτούς
  choice: dé ibẹ̀ ṣáájú wọn
  rationale: Ó mú kedere pé àwọn ènìyàn náà kọ́kọ́ dé ibi tí wọ́n ń lọ ṣáájú Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀.
