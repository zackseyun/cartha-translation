translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye ni a lò. A yà gbólóhùn Gíríìkì gígùn náà sí méjì fún ìṣàn èdè Yorùbá àdánidá, láìsọ ìtumọ̀ rẹ̀ nù. Àmì ohùn kíkún ni a lò níbi tí ó bá yẹ.
