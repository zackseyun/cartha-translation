  source_fidelity: 'Ìtumọ̀ náà mú gbogbo àwọn apá pàtàkì inú Gíríìkì náà hàn: rírí wọn nígbà tí wọ́n ń lọ, mímọ ẹni tí wọ́n jẹ́, jíjẹ ẹni ọ̀pọ̀, jíjáde láti gbogbo ìlú, rírìn/sísáré lórí ilẹ̀, ìkójọ sí ibi kan, àti dídé ṣáájú wọn. “Dé ibẹ̀ ṣáájú wọn” jẹ́ ìtumọ̀ kedere, tó bá προῆλθον αὐτούς mu.'
