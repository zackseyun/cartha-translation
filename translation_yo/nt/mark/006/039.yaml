  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: yo
  text: Ó sì pàṣẹ fún wọn pé kí wọ́n mú kí gbogbo ènìyàn jókòó ní ẹgbẹ́ẹgbẹ́[a] lórí koríko aláwọ̀ ewé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “ní ẹgbẹ́ kọ̀ọ̀kan”; ọ̀rọ̀ Gíríìkì náà tí a tún sọ lẹ́ẹ̀mejì ní ìtumọ̀ pínpín, ó ń tẹnu mọ́ bí wọ́n ṣe ṣètò àwọn ènìyàn sí ẹgbẹ́ fún oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ kan tẹ́lẹ̀ rí ni, “pé kí gbogbo wọn jókòó.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπέταξεν
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àṣẹ tí ó lágbára fúnni; “pàṣẹ” pa agbára ìtumọ̀ yẹn mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àwọn tí Jésù ń bá sọ̀rọ̀, ìyẹn àwọn ọmọ-ẹ̀yìn rẹ̀ ní àyíká ọ̀rọ̀, ṣùgbọ́n a kò fi orúkọ wọn kún ẹsẹ náà.
- source_word: ἀνακλῖναι πάντας
  choice: kí wọn mú kí gbogbo ènìyàn jókòó
  rationale: Ètò gírámà Gíríìkì yà “wọn” tí wọ́n gba àṣẹ sọ́tọ̀ sí “gbogbo ènìyàn” tí wọ́n ní láti jókòó. “Jókòó” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbé ara kalẹ̀ fún oúnjẹ, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè tọ́ka sí fífẹ̀gbẹ́ sílẹ̀ nígbà oúnjẹ.
- source_word: συμπόσια συμπόσια
  choice: ní ẹgbẹ́ẹgbẹ́
  rationale: Àtúnṣe ọ̀rọ̀ Gíríìkì ní ìtumọ̀ pínpín, ó sì fi hàn pé wọ́n ṣètò àwọn ènìyàn sí onírúurú ẹgbẹ́ fún oúnjẹ.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: lórí koríko tútù
  rationale: χλωρός lè túmọ̀ sí “tútù” tàbí “tí ó jẹ́ ewé tútù,” χόρτος sì túmọ̀ sí koríko níbí; gbólóhùn yìí jẹ́ tààrà, ó sì dùn mọ́ etí ní Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó sì ṣe kedere. “Kí wọn mú kí” pa ìyàtọ̀ gírámà mọ́ láàárín àwọn ọmọ-ẹ̀yìn tí Jésù pàṣẹ fún àti gbogbo ènìyàn tí wọ́n ní láti jókòó; “ní ẹgbẹ́ẹgbẹ́” sì jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ pínpín hàn.
