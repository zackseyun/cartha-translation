id: MRK.6.20
reference: Mark 6:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: yo
  text: Nítorí Hẹ́rọ́dù bẹ̀rù Johanu, nítorí ó mọ̀ pé Johanu jẹ́ ọkùnrin olódodo àti mímọ́, ó sì ń dáàbò bo Johanu. Nígbà tí ó gbọ́ Johanu sọ̀rọ̀, ó ń dàrú gidigidi[a], síbẹ̀ ó ń fi ayọ̀ tẹ́tí sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “ó ń ṣe ohun púpọ̀,” dípò, “ó ń dàrú gidigidi.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: bẹ̀rù
  rationale: Ọ̀rọ̀ yìí pa agbára ìtumọ̀ ìbẹ̀rù mọ́, kò sì sọ ọ́ di ọ̀wọ̀ tàbí ìbọ̀wọ̀ nìkan; àìpé náà fi hàn pé ó jẹ́ ìwà tí ó ń bá a lọ.
- source_word: εἰδὼς
  choice: ó mọ̀ pé
  rationale: Ó mú ìtumọ̀ participle náà jáde lọ́nà Yorùbá àdánidá, ó sì lè tọ́ka sí ìdí tí Hẹ́rọ́dù fi bẹ̀rù Johanu tí ó sì ń dáàbò bò ó.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: ọkùnrin olódodo àti mímọ́
  rationale: “Olódodo” sọ ìwà títọ́, “mímọ́” sì pa ìtumọ̀ ìyàsọ́tọ̀ fún Ọlọ́run àti ìwà ọlọ́run mọ́.
- source_word: συνετήρει αὐτόν
  choice: ó ń dáàbò bò ó
  rationale: Ní àyíká ọ̀rọ̀ náà, ìtumọ̀ tó ṣeé ṣe jù ni pé Hẹ́rọ́dù ń pa Johanu mọ́ kúrò nínú ewu; gbolohun yìí ṣe kedere ní Yorùbá òde òní.
- source_word: ἀκούσας αὐτοῦ
  choice: nígbà tí ó bá sì gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Ìtumọ̀ náà jẹ́ pé Hẹ́rọ́dù ń gbọ́ Johanu sọ̀rọ̀. Fífi “ọ̀rọ̀ rẹ̀” kún un yàgò fún àìṣedéédé tí “gbọ́ ọ” lè ní ní Yorùbá.
- source_word: πολλὰ ἠπόρει
  choice: ọ̀ràn náà máa ń dà á láàmú gidigidi
  rationale: Ó fi hàn pé Hẹ́rọ́dù wà nínú ìdàrúdàpọ̀, kò mọ ohun tí yóò ṣe; “gidigidi” mú ipa adverbial πολλὰ jáde.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: síbẹ̀ ó máa ń fi ayọ̀ tẹ́tí sí i
  rationale: “Fi ayọ̀ tẹ́tí sí i” jẹ́ Yorùbá àdánidá fún fífetí sí ẹni pẹ̀lú ìdùnnú; “síbẹ̀” mú ìtakora tó wà láàárín ìdàrúdàpọ̀ rẹ̀ àti ìfẹ́ rẹ̀ láti gbọ́ Johanu hàn.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ lẹ́yìn gbígbọ́ Johanu
  choice: 'Tẹ̀lé SBLGNT: “ọ̀ràn náà máa ń dà á láàmú gidigidi” (ἠπόρει).'
  alternative: “ó ń ṣe ohun púpọ̀” (ἐποίει).
  rationale: Àkọsílẹ̀ àyẹ̀wò SBLGNT ní ἠπόρει, tó fi ìdàrúdàpọ̀ inú Hẹ́rọ́dù àti ìfẹ́ rẹ̀ láti gbọ́ Johanu sílẹ̀ ní ìtakora gidi. Nítorí ìyàtọ̀ kejì yí ìtumọ̀ padà gidigidi, a pa á mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Àwọn ọ̀rọ̀ àìpé Gíríìkì ni a fi “ń” àti “máa ń” hàn láti tọ́ka sí ìṣe tàbí ìwà tó ń bá a lọ.
