  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: yo
  text: Ó sì pe àwọn Méjìlá náà, ó sì bẹ̀rẹ̀ sí í rán wọn jáde ní méjì-méjì[a], ó sì ń fún wọn ní àṣẹ lórí àwọn ẹ̀mí àìmọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní tọ̀kọ̀taya.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “agbára lórí àwọn ẹ̀mí àìmọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: ó pe
  rationale: Aorist-style Yoruba narration is more natural here than reproducing Mark's historical present mechanically; 'pe' conveys summoning, while the context supplies the sense of calling them to himself.
- source_word: τοὺς δώδεκα
  choice: àwọn méjìlá náà
  rationale: This preserves the recognized group designation without adding 'disciples,' which is not explicit in the Greek.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: ó bẹ̀rẹ̀ sí í rán wọn jáde
  rationale: This naturally represents the inceptive construction and retains the missionary sense of sending out.
- source_word: δύο δύο
  choice: ní méjì-méjì
  rationale: 'The reduplicated Yoruba expression naturally preserves the distributive meaning and rhythm: two at a time, in pairs.'
- source_word: ἐδίδου
  choice: ó sì ń fún wọn
  rationale: The progressive marker 'ń' reflects the imperfect's ongoing or repeated aspect contemporaneous with the sending.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: '''Àṣẹ'' communicates conferred authority or authorization more precisely than raw ability or force.'
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: àwọn ẹ̀mí àìmọ́
  rationale: This closely preserves Mark's terminology rather than replacing 'spirits' with the interpretive term 'demons.'
theological_decisions:
- issue: Nature of Jesus' grant in ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: àṣẹ lórí àwọn ẹ̀mí àìmọ́
  alternative: agbára lórí àwọn ẹ̀mí àìmọ́
  rationale: '''Àṣẹ'' preserves the sense of delegated authority over the spirits, whereas ''agbára'' could be understood merely as inherent power.'
translation_notes:
  register: Standard Yorùbá with full tone marks; dignified but readily understandable. The narrative tenses are made idiomatic in Yorùbá, while the imperfect force of ἐδίδου is retained with 'ń.' No footnote is added for a present-tense rendering of προσκαλεῖται because that is chiefly a Greek narrative-style feature and would be unnatural as a Yoruba alternative here.
