id: MRK.6.14
reference: Mark 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: yo
  text: Ọba Hẹrọdu sì gbọ́ nípa rẹ̀, nítorí pé orúkọ Jésù ti di gbajúmọ̀. Àwọn ènìyàn sì ń sọ pé, “Jòhánù ẹni tí ń ṣe ìbatisí[a] ni a ti jí dìde kúrò láàárín àwọn òkú,[b] ìdí nìyẹn tí àwọn agbára náà[c] fi ń ṣiṣẹ́ nínú rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí oyè ìbílẹ̀, “Jòhánù Batisiti.”
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “ti jí dìde kúrò láàárín àwọn òkú.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn àfarajìn: “a ti jí i dìde.”'
    reason: alternative_reading
  - marker: c
    text: Tàbí, “àwọn agbára iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ alágbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Ọba Hẹrọdu
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ orúkọ ọba pẹ̀lú oyè rẹ̀.
- source_word: ἤκουσεν
  choice: gbọ́ nípa rẹ̀
  rationale: Ọ̀rọ̀ tí ó gbọ́ kò fara hàn nínú gbólóhùn Gíríìkì, ṣùgbọ́n àyíká ọ̀rọ̀ ń tọ́ka sí iṣẹ́ Jésù àti òkìkí rẹ̀; “nípa rẹ̀” mú kí Yorùbá dùn láìfi ìtumọ̀ tuntun kún un.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: nítorí orúkọ rẹ̀ ti di mímọ̀
  rationale: Ó pa àwòrán “orúkọ” mọ́, ó sì sọ pé orúkọ tàbí òkìkí rẹ̀ ti di ohun tí gbogbo ènìyàn mọ̀.
- source_word: ἔλεγον
  choice: Àwọn ènìyàn sì ń sọ
  rationale: Ọ̀rọ̀-ìṣe ọ̀pọ̀ yìí kò dárúkọ ẹni pàtó; “àwọn ènìyàn” fi ìtumọ̀ àìsọ ẹni pàtó náà hàn lọ́nà àdánidá.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Jòhánù Olùbatisí
  rationale: '“Olùbatisí” pa ipa ọ̀rọ̀-ìṣe náà mọ́: ẹni tí ń ṣe ìbatisí, kì í ṣe oyè tí a kò lè rí ìṣe inú rẹ̀.'
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: ni a ti jí dìde kúrò láàárín àwọn òkú
  rationale: 'Ìṣọ̀rọ̀ yìí pa ohùn àfarajìn Gíríìkì mọ́: ẹnì kan ni ó jí Jòhánù dìde, bí ó tilẹ̀ jẹ́ pé a kò dárúkọ ẹni náà. “Láàárín àwọn òkú” tún fi ọ̀pọ̀ nínú νεκρῶν hàn.'
- source_word: διὰ τοῦτο
  choice: ìdí nìyẹn tí…fi
  rationale: Èyí fi ìbáṣepọ̀ ìdí àti àbájáde hàn kedere, ó sì jẹ́ ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ
  choice: àwọn agbára wọ̀nyí fi ń ṣiṣẹ́ nínú rẹ̀
  rationale: “Ń ṣiṣẹ́” fi ìṣe tí ó ń bá a lọ hàn; “nínú rẹ̀” sì pa ἐν αὐτῷ mọ́ láìyí i sí “nípasẹ̀ rẹ̀.”
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐγήγερται nínú ọ̀rọ̀ àjíǹde
  choice: ni a ti jí dìde kúrò láàárín àwọn òkú
  alternative: ti jí dìde kúrò láàárín àwọn òkú
  rationale: Ọ̀rọ̀ Gíríìkì wà ní ohùn àfarajìn. Ìtumọ̀ tí a yàn kò sọ ẹni tí ó jí i dìde, bẹ́ẹ̀ ni kò yí ọ̀rọ̀ náà sí ìṣe tí Jòhánù ṣe fúnra rẹ̀.
- issue: Bí a ṣe túmọ̀ Ἰωάννης ὁ βαπτίζων
  choice: Jòhánù Olùbatisí
  alternative: Jòhánù Batisiti
  rationale: Èyí fi ìṣe tí àpólà aláìlẹ́gbẹ́ Gíríìkì ń sọ hàn, nígbà tí àkíyèsí ìsàlẹ̀ ojú ìwé ń tọ́ka sí oyè ìbílẹ̀ tí àwọn òǹkàwé mọ̀.
- issue: Ìtumọ̀ αἱ δυνάμεις
  choice: àwọn agbára
  alternative: àwọn iṣẹ́ ìyanu alágbára
  rationale: '“Àwọn agbára” pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́: ó lè tọ́ka sí agbára tí ń ṣiṣẹ́ tàbí sí iṣẹ́ ìyanu alágbára, láìfi tipátipá yan ọ̀kan ṣoṣo.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “Olùbatisí” láti jẹ́ kí ìṣe inú oyè náà hàn, a sì pa àìdánilójú “àwọn agbára” àti ohùn àfarajìn inú ọ̀rọ̀ àjíǹde mọ́.
