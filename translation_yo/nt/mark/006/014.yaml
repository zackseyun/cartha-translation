revisions:
- from: Ọba Hẹrọdu sì gbọ́ nípa rẹ̀, nítorí orúkọ rẹ̀ ti di mímọ̀. Àwọn ènìyàn sì ń sọ pé, “Jòhánù Olùbatisí[a] ni a ti jí dìde kúrò láàárín àwọn òkú,[b] ìdí nìyẹn tí àwọn agbára[c] wọ̀nyí fi ń ṣiṣẹ́ nínú rẹ̀.”
  to: Ọba Hẹrọdu sì gbọ́ nípa rẹ̀, nítorí pé orúkọ Jésù ti di gbajúmọ̀. Àwọn ènìyàn sì ń sọ pé, “Jòhánù ẹni tí ń ṣe ìbatisí[a] ni a ti jí dìde kúrò láàárín àwọn òkú,[b] ìdí nìyẹn tí àwọn agbára náà[c] fi ń ṣiṣẹ́ nínú rẹ̀.”
  rationale: Àtúnṣe náà jẹ́ kí ẹni tí “orúkọ” náà tọ́ka sí ṣe kedere gẹ́gẹ́ bí Jésù, ó rọ́pò ọ̀rọ̀ tí ó lè túmọ̀ sí ìwà mímọ́ pẹ̀lú “gbajúmọ̀,” ó sì lo ìṣọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ὁ βαπτίζων. A kò yí ìtumọ̀ tàbí ìbáṣepọ̀ ìdí-àbájáde gbolohun náà padà; a sì pa ohùn àfarajìn nínú ọ̀rọ̀ àjíǹde mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ní gbogbo ìtumọ̀ pàtàkì nínú Gíríìkì: Hẹrọdu gbọ́, orúkọ ẹni tí a ń tọ́ka sí ti di gbajúmọ̀, ìròyìn nípa jíjí Jòhánù dìde láti inú òkú wà ní ohùn àfarajìn, àti àwọn agbára ń ṣiṣẹ́ nínú rẹ̀. Síbẹ̀, “orúkọ rẹ̀” lẹ́yìn “Ọba Hẹrọdu” lè jẹ́ kí a ka a sí orúkọ Hẹrọdu, nígbà tí αὐτοῦ nínú àyíká yìí tọ́ka sí Jésù. “Mímọ̀” tún sábà túmọ̀ sí ‘holy,’ kì í ṣe ‘well known.’'
  naturalness: “Jòhánù Olùbatisí” kò wọ́pọ̀ tàbí dùn gẹ́gẹ́ bí Yorùbá òde òní fún olùkà gbogbogbò. “Jòhánù ẹni tí ń ṣe ìbatisí” jẹ́ kedere, ó sì pa ipa àpólà Gíríìkì náà mọ́. “Ti di gbajúmọ̀” jẹ́ ọ̀nà àdánidá láti sọ pé orúkọ rẹ̀ ti di mímọ̀ káàkiri.
  terminology: A pa “a ti jí ... dìde” mọ́ láti fi ohùn àfarajìn ἐγήγερται hàn, láìsọ ẹni tí ó jí i dìde. “Ìbatisí” jẹ́ ọ̀rọ̀ ìjọsìn tí ó mọ̀ sí Yorùbá, àti “ẹni tí ń ṣe ìbatisí” yẹ fún ὁ βαπτίζων. “Àwọn agbára náà” jẹ́ ìtumọ̀ tí kò fi tipátipá pinnu bóyá δυνάμεις jẹ́ agbára tàbí iṣẹ́ ìyanu.
  issues:
  - severity: medium
    issue: Ìtọ́kasí “orúkọ rẹ̀” kò ṣe kedere
    rationale: Nínú Yorùbá, aṣojú-orúkọ náà lè tọ́ka sí Hẹrọdu tí a ṣẹ̀ṣẹ̀ dárúkọ. Ṣùgbọ́n nínú Gíríìkì, orúkọ tí ó di mímọ̀ ni ti Jésù, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
  - severity: medium
    issue: “Ti di mímọ̀” lè yí ìtumọ̀ φανερὸν ἐγένετο padà
    rationale: “Mímọ̀” sábà ń tọ́ka sí ìwà mímọ́ ní Yorùbá. “Ti di gbajúmọ̀” tàbí “ti di ohun tí a mọ̀ káàkiri” ń sọ ìtumọ̀ ‘became known/public’ dáadáa.
  - severity: low
    issue: “Olùbatisí” kò rọrùn fún ìlò ìgbàlódé
    rationale: Bí ó tilẹ̀ jẹ́ pé ó ń gbìyànjú láti fi ipa àpólà náà hàn, ìṣọ̀rọ̀ náà kì í ṣe ọ̀nà tí ó wọ́pọ̀. “Ẹni tí ń ṣe ìbatisí” jẹ́ kedere, ó sì jẹ́ adúróṣinṣin sí Gíríìkì.
  - severity: low
    issue: Àkíyèsí b tún sọ gbolohun kan náà bí ìtumọ̀ àkọ́kọ́
    rationale: Àkíyèsí yíyàn yẹ kí ó fi àṣàyàn aláìfarajìn “ti jí dìde” hàn, nígbà tí ọ̀rọ̀ àkọ́kọ́ ń pa ohùn àfarajìn mọ́.
