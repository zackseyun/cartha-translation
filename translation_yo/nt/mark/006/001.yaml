id: MRK.6.1
reference: Mark 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: yo
  text: Ó sì kúrò níbẹ̀, ó sì wá sí ìlú ìbílẹ̀ rẹ̀,[a] àwọn ọmọ-ẹ̀yìn rẹ̀ sì tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń wá sí ìlú ìbílẹ̀ rẹ̀, àwọn ọmọ-ẹ̀yìn rẹ̀ sì ń tẹ̀ lé e”—Gíríìkì lo àsìkò ìsinsìnyí nínú ìtàn láti mú ìṣẹ̀lẹ̀ náà dà bí ohun tó ń ṣẹlẹ̀ lójú ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ó kúrò
  rationale: Aorist ἐξέρχομαι ń tọ́ka sí fífi ibi tí ó wà tẹ́lẹ̀ sílẹ̀; “kúrò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú ìtumọ̀ ìjáde tàbí ìlọkúrò náà hàn.
- source_word: ἐκεῖθεν
  choice: níbẹ̀
  rationale: Adverb ibi náà ń sọ ibi tí ó ti kúrò; nínú “kúrò níbẹ̀,” ìtumọ̀ “láti ibẹ̀” hàn gbangba ní Yorùbá àdánidá.
- source_word: ἔρχεται
  choice: ó wá
  rationale: A lo ìṣe àsìkò tí ó ti kọjá nínú ìtàn Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present. “Wá sí” pa ìṣípò sí ibi àfojúsùn mọ́.
- source_word: πατρίδα
  choice: ìlú ìbílẹ̀ rẹ̀
  rationale: Nínú àyíká Máàkù 6, πατρίς tọ́ka sí ibi ìbílẹ̀ Jésù, ìyẹn Násárétì, kì í ṣe orílẹ̀-èdè rẹ̀ ní ìtumọ̀ fífẹ̀.
- source_word: ἀκολουθοῦσιν
  choice: tẹ̀ lé e
  rationale: “Tẹ̀ lé” jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún ἀκολουθέω, ó sì pa èdè jíjẹ́ ọmọ-ẹ̀yìn mọ́ ju ọ̀rọ̀ tó túmọ̀ sí kíkàn bá a rìn lọ.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó ṣe kedere, tí ó sì ní ìtumọ̀ ẹni tí ń kọ́ lábẹ́ olùkọ́ tí ó sì ń tẹ̀ lé e.
theological_decisions:
- issue: Ìtúmọ̀ historical presents (ἔρχεται, ἀκολουθοῦσιν)
  choice: 'A túmọ̀ wọn gẹ́gẹ́ bí ìṣe ìtàn tí ó ti kọjá: “ó wá” àti “tẹ̀ lé e.”'
  alternative: 'Kí a pa àsìkò ìsinsìnyí Gíríìkì mọ́: “ó ń wá … wọ́n sì ń tẹ̀ lé e” tàbí “ó dé … wọ́n sì tẹ̀ lé e” pẹ̀lú ìrísí ìtàn aláàyè.'
  rationale: Ìpinnu ara ìtàn ni, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Àsìkò tí ó ti kọjá dára sí ìtàn Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ ìrísí aláàyè inú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ìlú ìbílẹ̀” láti yẹra fún ìtumọ̀ fífẹ̀ “orílẹ̀-èdè,” a sì pa àsopọ̀ ọ̀rọ̀ Καὶ mọ́ nípasẹ̀ “sì” láì mú gbolóhùn náà wuwo.
