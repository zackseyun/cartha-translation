  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: yo
  text: Wọ́n sì jáde lọ, wọ́n sì kéde pé kí àwọn ènìyàn ronúpìwàdà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, “pé kí wọ́n ronúpìwàdà,” níbi tí “wọ́n” ti ń tọ́ka sí àwọn tí ó gbọ́ ìkéde wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó so ìṣe yìí mọ́ ìtàn ìránṣẹ́ tí ó ṣáájú rẹ̀ láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἐξελθόντες
  choice: wọ́n jáde lọ
  rationale: Ọ̀rọ̀ àìṣe aorist yìí tọ́ka sí àwọn ọmọ-ẹ̀yìn; lílo gbólóhùn-ìṣe Yorùbá mú kí ìtàn náà ṣàn lọ́nà àdánidá.
- source_word: ἐκήρυξαν
  choice: wọ́n kéde
  rationale: κηρύσσω túmọ̀ sí pípolongo ní gbangba; “kéde” pa agbára ìkéde náà mọ́ láìfi èrò ìjọ ti àkókò tó tẹ̀ lé e sínú ọ̀rọ̀ náà.
- source_word: ἵνα
  choice: pé kí
  rationale: Níhìn-ín ó ṣàfihàn ohun tí wọ́n kéde tàbí ìdáhùn tí ìkéde náà ń béèrè; “pé kí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: μετανοῶσιν
  choice: ronúpìwàdà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìyípadà ọkàn àti ìgbésí ayé ní ìdojúkọ sí Ọlọ́run; “ronúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní ìwọ̀n ìtumọ̀ ẹ̀sìn tó yẹ.
theological_decisions:
- issue: Bóyá a ó sọ ẹni tí ó yẹ kí ó ronúpìwàdà ní kedere
  choice: kí àwọn ènìyàn ronúpìwàdà
  alternative: kí wọ́n ronúpìwàdà
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì ní ẹni-kẹta ọ̀pọ̀ ṣùgbọ́n kò sọ olùṣe ní gbangba; àyíká fi hàn pé ó ń tọ́ka sí àwọn olùgbọ́, kì í ṣe àwọn ọmọ-ẹ̀yìn. “Àwọn ènìyàn” mú èyí kedere láìfi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu.
