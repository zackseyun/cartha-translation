  verdict: revise
  source_fidelity: Àkọ́kọ́ ìtumọ̀ náà fi ‘ilẹ̀ ti fẹ́rẹ̀ẹ́ ṣú’ kún ọ̀rọ̀ orísun ní pàtó ju bó ṣe yẹ lọ. ὥρα πολλή ń tọ́ka sí àkókò tí ó ti pẹ́ gan-an, kì í sì dá ìwọ̀-oòrùn tàbí ìfẹ́rẹ̀ẹ́ ṣíṣe ilẹ̀ mú dájú. Bákan náà, ‘jìnnà sí ìlú’ jẹ́ ìtumọ̀ àfikún tí ἔρημος kò sọ ní pàtó; ọ̀rọ̀ náà ń ṣàpèjúwe ibi ìdánìkanwà/aginjù.
  naturalness: ‘Nígbà tí ó ti pẹ́ gan-an’ àti ‘Ibi aginjù ni ibi yìí’ jẹ́ Yorùbá àgbàlódé, ó sì yẹ fún ìtàn ọlọ́wọ̀. ‘Wá sọ́dọ̀ rẹ̀’ jẹ́ ìtumọ̀ àdánidá fún προσελθόντες αὐτῷ, nígbà tí ‘ń wí’ ń pa ìrísí àìpé ti ἔλεγον mọ́.
  terminology: ‘Àwọn ọmọ-ẹ̀yìn rẹ̀’ bójú mu. ‘Ibi aginjù’ ń fi ἔρημος hàn láìsọ pé ibi náà jìnnà sí ìlú tàbí pé a ti pa á run. A tún ṣètò àwọn àmì akọ́silẹ̀ kí àmì ọ̀kọ̀ọ̀kan lè wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí akọ́silẹ̀ rẹ̀ ń ṣàlàyé.
