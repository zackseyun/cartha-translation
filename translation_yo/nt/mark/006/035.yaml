source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: yo
  text: Nígbà tí ó ti pẹ́ gan-an[a], àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá sọ́dọ̀ rẹ̀, wọ́n sì ń wí pé, “Ibi aginjù ni ibi yìí[b], ó sì ti pẹ́ gan-an.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “nígbà tí wákàtí pẹ́ ti dé tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ibi yìí dá wà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ti
  rationale: Àmì àsìkò yìí fi hàn pé ọ̀pọ̀ àsìkò ti kọjá; ìṣe pípé ‘ti’ ni Yorùbá ń lò lọ́nà àdánidá láti sọ ìtẹ̀síwájú yìí ní ibi méjèèjì.
- source_word: ὥρας πολλῆς γενομένης
  choice: nígbà tí ilẹ̀ sì ti fẹ́rẹ̀ẹ́ ṣú
  rationale: Gbólóhùn genitive absolute náà túmọ̀ sí pé ọjọ́ ti pẹ́ gan-an. ‘Ilẹ̀ ti fẹ́rẹ̀ẹ́ ṣú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká ìtàn mu, láìdá a mọ́ àsìkò kan pàtó.
- source_word: προσελθόντες αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó sọ pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; ‘tọ̀ ọ́ wá’ jẹ́ èdè Yorùbá àdánidá nínú ìtàn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì fi ìní hàn ní kedere.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àmì àìpé nínú ọ̀rọ̀ Gíríìkì ń fi ìṣe tó ń lọ lọ́wọ́ hàn; ‘ń sọ’ pa ìrísí yẹn mọ́ láìfi dandan kún un pé wọ́n ń tún un sọ lemọ́lemọ́.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Ibi yìí jìnnà sí ìlú
  rationale: ἔρημος níbí túmọ̀ sí ibi tí kò sí olùgbé tàbí tó yà sọ́tọ̀. ‘Jìnnà sí ìlú’ sọ ìtumọ̀ náà ní Yorùbá tó ṣe kedere láìdábàá pé ibi náà ti di ahoro pátápátá.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: ilẹ̀ sì ti fẹ́rẹ̀ẹ́ ṣú
  rationale: Gbólóhùn yìí tún tẹnu mọ́ pé ọjọ́ ti pẹ́. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ àkókò mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ilẹ̀ ti fẹ́rẹ̀ẹ́ ṣú’ jẹ́ ọ̀nà àdánidá láti sọ pé ọjọ́ ti pẹ́, nígbà tí ‘jìnnà sí ìlú’ yàgò fún ìtumọ̀ pé ibi náà jẹ́ ahoro tàbí ibi ìparun.
