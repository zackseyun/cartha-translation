source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: yo
  text: Ó sì gbé orí rẹ̀ wá lórí àwo ńlá pẹlẹbẹ kan[a], ó sì fún ọmọbìnrin náà ní i; ọmọbìnrin náà sì fún ìyá rẹ̀ ní i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àtẹ̀” tàbí “àwo ìjẹun.” Ọ̀rọ̀ Gíríìkì πίναξ ń tọ́ka sí àwo tàbí àtẹ̀ tí a fi ń gbé oúnjẹ kalẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: gbé … wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó gbé orí tí a ti gé náà dé ibi àsè. ‘Gbé … wá’ jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà ní Yorùbá láì ṣàfikún bí ó ṣe gbé e.
- source_word: κεφαλὴν αὐτοῦ
  choice: orí rẹ̀
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ arọ́pò-orúkọ inú Gíríìkì; àyíká ẹsẹ̀ ṣáájú fi hàn pé Jòhánù ni ‘rẹ̀’ ń tọ́ka sí.
- source_word: ἐπὶ πίνακι
  choice: lórí àwo ńlá pẹlẹbẹ kan
  rationale: πίναξ jẹ́ àwo tàbí àtẹ̀ pẹlẹbẹ tí a fi ń gbé oúnjẹ kalẹ̀. Ọ̀rọ̀ yìí bá àyíká àsè mu, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ἔδωκεν
  choice: fún … ní i
  rationale: A lo ‘fún … ní i’ ní ìgbà méjèèjì láti pa àtúnṣe ọ̀rọ̀-ìṣe Gíríìkì mọ́, ní ọ̀nà tí ó jẹ́ ti ẹ̀dá Yorùbá.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: ọmọbìnrin náà
  rationale: κοράσιον ń tọ́ka sí ọmọbìnrin kan; ‘ọmọbìnrin náà’ ṣe kedere, ó sì yẹra fún ọ̀rọ̀ àtijọ́ tàbí àfikún ọjọ́-orí tí kò pọndandan.
- source_word: τῇ μητρὶ αὐτῆς
  choice: ìyá rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ọ̀rọ̀ náà, ó sì pa bí a ṣe fi orí náà lọ́wọ́ ọmọbìnrin títí dé ọ̀dọ̀ ìyá rẹ̀ mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá tí ó lọ́wọ́lọ́wọ́, tí ó ní iyì, tí ó sì rọrùn láti lóye. Àmì ẹsẹ̀ [a] wà lẹ́yìn ọ̀rọ̀ tí àlàyé rẹ̀ ń tọ́ka sí, ìyẹn ‘àwo ńlá pẹlẹbẹ kan.’
