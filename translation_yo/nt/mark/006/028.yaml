  naturalness: Yorùbá náà jẹ́ èyí tí ó ṣe déédéé, ó sì ní ìforúkọsílẹ̀ ìtàn mímọ́ tí ó rọrùn fún òǹkàwé òde òní. ‘Àwo ńlá pẹlẹbẹ’ jẹ́ ìtumọ̀ tí ó yege fún ohun èlò ìjẹun/ìgbékalẹ̀ náà, bí ó tilẹ̀ jẹ́ pé àwọn ọ̀nà míràn wà.
  terminology: ‘Ọmọbìnrin náà’ jẹ́ ìbámu tó dáa fún κοράσιον, láì fi ọjọ́-orí kan tí Gíríìkì kò sọ kún un. ‘Ìyá rẹ̀’ ṣètọju ìtọ́kasí arọ́pò-orúkọ náà. Àlàyé ìsàlẹ̀ [a] wà ní ibi tí ó tọ́, ó sì ń ṣàlàyé πίναξ ní ìbámu pẹ̀lú ìtumọ̀ Gẹ̀ẹ́sì.
