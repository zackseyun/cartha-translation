source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n rékọjá dé ilẹ̀[a], wọ́n dé Gẹnésárẹ́tì, wọ́n sì mú ọkọ̀ náà gúnlẹ̀ síbẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘dé etíkun’; Gíríìkì ní ‘dé ilẹ̀,’ èyí tó ń tọ́ka sí dídé ilẹ̀ láti inú ọkọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘wọ́n dá ọkọ̀ síbẹ̀’ tàbí ‘wọ́n so ọkọ̀ náà mọ́ ibẹ̀’; ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ pàtó ti ojú omi, ó ń sọ nípa mímú ọkọ̀ dé ibi ìdádúró tàbí etíkun.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: nígbà tí wọ́n rékọjá
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist, ó sì tọ́ka sí ìṣe tí ó ṣáájú ìṣe pàtàkì nínú gbólóhùn náà. ‘Nígbà tí wọ́n rékọjá’ jẹ́ Yorùbá àdánidá tí ó pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: dé ilẹ̀ ... wọ́n dé Gẹnésárẹ́tì
  rationale: γῆ túmọ̀ sí ‘ilẹ̀’ ní pàtàkì, ṣùgbọ́n nínú ọ̀rọ̀ ìrìn-àjò ojú omi yìí ó ń tọ́ka sí dídé ilẹ̀ láti inú ọkọ̀. Fífọ̀rọ̀ náà sí ‘dé ilẹ̀’ pa àwòrán Gíríìkì mọ́ láì fi ìtumọ̀ tó ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
- source_word: Γεννησαρὲτ
  choice: Gẹnésárẹ́tì
  rationale: A kọ orúkọ ibi náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà ìkọ̀wé Yorùbá.
- source_word: προσωρμίσθησαν
  choice: wọ́n sì mú ọkọ̀ náà gúnlẹ̀ síbẹ̀
  rationale: 'Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ pàtó ti ojú omi: mímú ọkọ̀ dé ibi ìdádúró tàbí etíkun. Gbólóhùn Yorùbá yìí sọ ìṣe náà ní kedere, bí ó tilẹ̀ jẹ́ pé ‘ọkọ̀’ wà nínú àyíká ọ̀rọ̀, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ tí a sọ ní tààrà nínú Gíríìkì.'
- source_word: καί
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ ìtàn Yorùbá tó bá καί mu, ó sì pa ìṣàn ìtàn náà mọ́ láì fi ìtumọ̀ tuntun kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá, a sì kọ orúkọ Gẹnésárẹ́tì ní ìbámu pẹ̀lú ètò ìró Yorùbá.
