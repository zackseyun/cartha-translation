base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: yo
  text: Àwọn tí wọ́n jẹ àwọn ìṣù búrẹ́dì náà[a] jẹ́ ọkùnrin ẹgbẹ̀rún márùn-ún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “búrẹ́dì náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “búrẹ́dì” tàbí “àwọn ìṣù búrẹ́dì,” ṣùgbọ́n níhìn-ín ó ń tọ́ka sí àwọn ìṣù búrẹ́dì pàtó inú ìṣẹ̀lẹ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ọkùnrin,” pàápàá àwọn akọ tí wọ́n ti dàgbà; kì í ṣe ọ̀rọ̀ gbogbogbò fún “ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: sì jẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àsopọ̀ tó sọ iye àwọn tó jẹun; “sì jẹ́” mú ìtumọ̀ náà jáde ní Yorùbá láìfi èrò míì kún un bí “a kà wọ́n sí.”
- source_word: οἱ φαγόντες
  choice: Àwọn tí wọ́n jẹ
  rationale: Gbólóhùn yìí ń dá ẹgbẹ́ náà mọ̀ nípa ohun tí wọ́n ṣe; ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ participle aorist mu láìsọ ọ́ di “tí wọ́n ti jẹ” láìnídí.
- source_word: τοὺς ἄρτους
  choice: àwọn ìṣù búrẹ́dì náà
  rationale: Ọ̀pọ̀ nǹkan ni ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí níhìn-ín, ìyẹn àwọn ìṣù búrẹ́dì pàtó tí a pín fún wọn; “àwọn ìṣù búrẹ́dì náà” pa àlàyé ìṣẹ̀lẹ̀ náà mọ́.
- source_word: πεντακισχίλιοι
  choice: ẹgbẹ̀rún márùn-ún
  rationale: Èyí ni ìtumọ̀ tààrà fún nọ́ńbà náà ní Yorùbá.
- source_word: ἄνδρες
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka pàtó sí àwọn ọkùnrin, kì í ṣe ọ̀rọ̀ gbogbogbò fún gbogbo ènìyàn; “ọkùnrin” pa ìyàtọ̀ yẹn mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ìkà tí ó tọ́ka pàtó sí akọ
  choice: Lo “ọkùnrin” nínú ẹsẹ̀ náà.
  alternative: ènìyàn
  rationale: ἄνδρες jẹ́ ọ̀rọ̀ tó ń tọ́ka pàtó sí àwọn ọkùnrin, kì í ṣe ọ̀rọ̀ tí ó gba gbogbo akọ àti abo. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ìkà yìí di iye gbogbo ènìyàn láìfi ẹ̀rí sí i.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lásán. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “ìṣù búrẹ́dì” fún loaf láti pa ọ̀pọ̀ nǹkan pàtó inú ìtàn náà mọ́.
