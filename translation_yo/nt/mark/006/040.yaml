  to: Wọ́n sì jókòó sílẹ̀ ní ìlà-ìlà, ní ọgọ́rùn-ún àti ní àádọ́ta.[a]
  rationale: The revision changes only the rendering of πρασιαὶ πρασιαὶ, replacing the generic “ní ẹgbẹ́ẹgbẹ́” with “ní ìlà-ìlà” to represent the source’s repeated garden-bed image and its implication of orderly rows. The wording for the numerical distributions remains close to the Greek and avoids adding an interpretation beyond the text.
