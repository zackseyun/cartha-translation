  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: yo
  text: Wọ́n sì jókòó sílẹ̀ ní ìlà-ìlà, ní ọgọ́rùn-ún àti ní àádọ́ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn àpá ọgbà, àwọn apá ọgbà”; ó jẹ́ àwòrán àwọn ènìyàn tí a tò sí ìlà tàbí sí ìpín ní ètò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: jókòó sílẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gbígbé ipò ẹni fún oúnjẹ, nígbà púpọ̀ pẹ̀lú ìtẹ̀ sí ẹ̀gbẹ́. “Jókòó sílẹ̀” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n múra láti jẹun láìfi ìtumọ̀ tí kò wọ́pọ̀ kún un.
- source_word: πρασιαὶ πρασιαὶ
  choice: ní ẹgbẹ́ẹgbẹ́
  rationale: Orúkọ tí a tún sọ yìí túmọ̀ ní tààrà sí àwọn apá tàbí ààyè gbígbìn nínú ọgbà, ṣùgbọ́n níhìn-ín ó ṣàpèjúwe bí a ṣe to àwọn ènìyàn sí ẹgbẹ́ létòlétò. “Ní ẹgbẹ́ẹgbẹ́” mú ìtumọ̀ pínpín náà jáde lọ́nà Yorùbá tó ṣe kedere; àlàyé ìṣàpẹẹrẹ ọgbà wà nínú àlàyé ìsàlẹ̀.
- source_word: κατὰ ἑκατὸν
  choice: ọgọ́rùn-ún sí ibì kan
  rationale: κατά pẹ̀lú nọ́ńbà ń fi ìpín sí ìsọ̀rí hàn. Gbólóhùn yìí sọ ní kedere pé ọgọ́rùn-ún ènìyàn wà nínú àwọn ẹgbẹ́ kan.
- source_word: κατὰ πεντήκοντα
  choice: àádọ́ta sí ibì kan
  rationale: Bákan náà, κατά ń fi ìpín sí ìsọ̀rí hàn; ọ̀rọ̀ yìí pa ìbáradọ́gba mọ́ pẹ̀lú “ọgọ́rùn-ún sí ibì kan” ó sì fi hàn pé àádọ́ta ènìyàn wà nínú àwọn ẹgbẹ́ mìíràn.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò. “Jókòó sílẹ̀” yẹra fún ọ̀rọ̀ àjèjì tí yóò fi dandan sọ pé gbogbo wọn tẹ̀ sí ẹ̀gbẹ́, nígbà tí “ní ẹgbẹ́ẹgbẹ́” àti àlàyé ìsàlẹ̀ pa ìṣàpẹẹrẹ àti ìtòlẹ́sẹẹsẹ inú Gíríìkì mọ́.
