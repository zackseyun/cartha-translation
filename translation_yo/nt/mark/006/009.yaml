  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: yo
  text: ṣùgbọ́n kí ẹ wọ bàtà, kí ẹ má sì wọ ẹ̀wù méjì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má sì ní ẹ̀wù méjì lára.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìṣe fífi aṣọ wọ ara tàbí sí ipò níní aṣọ lára; ọ̀rọ̀ pàtàkì náà tẹ̀lé ìṣe wíwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí àwọn ìtọ́nisọ́nà ìrìn-àjò tí ó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé láti sọ ìyàtọ̀ náà.
- source_word: ὑποδεδεμένους
  choice: kí ẹ wọ ... sí ẹsẹ̀ yín
  rationale: Ọ̀rọ̀ náà jẹ́ perfect participle tí ó ní agbára àṣẹ níbí; gbólóhùn yìí sọ ní kedere pé kí wọ́n ní bàtà náà ní ẹsẹ̀ wọn.
- source_word: σανδάλια
  choice: bàtà aláwọ̀
  rationale: Ó tọ́ka sí sandal, irú bàtà ìgbà náà tí a fi awọ ṣe; yíyan yìí ṣe kedere ju lílo ọ̀rọ̀ àjèjì lọ.
- source_word: μὴ ἐνδύσησθε
  choice: kí ẹ má sì wọ
  rationale: Aorist middle subjunctive pẹ̀lú μή jẹ́ ìfòfin nípa fífi aṣọ wọ ara ẹni; ‘wọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì lè tọ́ka sí ìṣe fífi wọ̀ tàbí ipò wíwọ̀.
- source_word: δύο
  choice: méjì
  rationale: A pa nọ́ńbà náà mọ́ ní tààrà.
- source_word: χιτῶνας
  choice: ẹ̀wù àwọ̀
  rationale: χιτών jẹ́ aṣọ ìpìlẹ̀ tí a wọ mọ́ ara; ‘ẹ̀wù àwọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí kò sì mú aṣọ òde òní wọ inú ọ̀rọ̀ náà.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. A lo ọ̀rọ̀ tó mọ́gbọ́n dání, tó ní iyì, tí òǹkàwé òde òní sì lè lóye; fọ́ọ̀mù ọ̀pọ̀ ‘ẹ’ bá àwọn ọmọ-ẹ̀yìn mu.
