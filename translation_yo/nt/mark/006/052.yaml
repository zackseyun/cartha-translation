  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: yo
  text: Nítorí wọn kò lóye nípa àwọn búrẹ́dì náà[b], ṣùgbọ́n ọkàn wọn ti le[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn wọn ti di aláìní ìmọ̀lára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn kò lóye ìtumọ̀ àwọn búrẹ́dì náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: kò lóye
  rationale: “Lóye” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún níní òye tàbí mímú ìtumọ̀ ohun kan; ó sì pa àìlóye àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: ọ̀ràn àwọn ìṣù búrẹ́dì náà
  rationale: Ìtumọ̀ yìí fi hàn pé àwọn ìṣù búrẹ́dì nínú iṣẹ́ ìyanu tí ó ṣáájú ni ọ̀rọ̀ náà dá lé, láìfi ìtumọ̀ iṣẹ́ ìyanu náà kún ẹsẹ̀.
- source_word: ἄρτοις
  choice: àwọn ìṣù búrẹ́dì
  rationale: Ọ̀pọ̀ nọ́ńbà Gíríìkì tọ́ka sí àwọn ìṣù pàtó tí a lò nígbà fífún ọ̀pọ̀ ènìyàn ní oúnjẹ; “ìṣù búrẹ́dì” mú èyí ṣe kedere ju “búrẹ́dì” lásán lọ.
- source_word: καρδία
  choice: ọkàn
  rationale: “Ọkàn” ní Yorùbá lè tọ́ka sí inú ènìyàn, títí kan òye àti ìwà inú, bí ọ̀rọ̀ Gíríìkì ṣe rí níhìn-ín.
- source_word: πεπωρωμένη
  choice: ti sé le
  rationale: “Sé le” pa àkàwé líle mọ́, ó sì lè ṣàpèjúwe àìní ìmọ̀lára tàbí àìgbọ́kàn, láìsọ ẹni tàbí ohun tó fa ipò náà.
- source_word: ἀλλ’ ἦν
  choice: ṣùgbọ́n … ti
  rationale: “Ṣùgbọ́n” pa ìtakora mọ́; “ti sé le” sọ ipò tí ọkàn wọn wà nígbà náà ní Yorùbá àdánidá.
- source_word: αὐτῶν ἡ καρδία
  choice: ọkàn wọn
  rationale: Yorùbá gba ọ̀kan ṣoṣo pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀ lọ́nà àdánidá, nítorí náà ó pa ìrísí àkójọpọ̀ ọ̀kan ṣoṣo inú Gíríìkì mọ́.
theological_decisions:
- issue: Irú ipò àwọn ọmọ-ẹ̀yìn tí πεπωρωμένη ń ṣàpèjúwe
  choice: ọkàn wọn ti sé le
  alternative: ọkàn wọn ti yigbì
  rationale: Ìtumọ̀ yìí sọ ìdíwọ́ nínú òye àti ìmọ̀lára ẹ̀mí wọn, ṣùgbọ́n kò pinnu bóyá Ọlọ́run, àwọn fúnra wọn, tàbí ohun mìíràn ló fa a; nípa bẹ́ẹ̀, ó pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo “ọkàn wọn” gẹ́gẹ́ bí àkójọpọ̀ ọ̀kan ṣoṣo, àti “ìṣù búrẹ́dì” láti tọ́ka sí àwọn ìṣù pàtó inú ìtàn.
