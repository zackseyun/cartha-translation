id: MRK.6.49
reference: Mark 6:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n rí i tí ó ń rìn lórí òkun, wọ́n rò pé iwin[a] ni, wọ́n sì ké jáde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfarahàn ẹ̀mí” tàbí “ohun àjèjì tí ó farahàn.” Ọ̀rọ̀ Gíríìkì náà, φάντασμα, tọ́ka sí ìfarahàn bí ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n ... wọ́n
  rationale: δέ ní agbára ìyípadà kékeré sí ìhùwàpadà àwọn ọmọ-ẹ̀yìn; ‘Ṣùgbọ́n’ mú èyí jáde lọ́nà àdánidá.
- source_word: ἰδόντες αὐτὸν
  choice: nígbà tí wọ́n rí i
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ‘i’ sì tọ́ka sí Jésù.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: tí ó ń rìn lórí òkun
  rationale: ἐπί pẹ̀lú genitive nínú àyíká yìí túmọ̀ sí pé ó ń rìn lórí omi, kì í ṣe lẹ́gbẹ̀ẹ́ òkun; ‘òkun’ pa ọ̀rọ̀ θάλασσα mọ́.
- source_word: ἔδοξαν
  choice: wọ́n rò
  rationale: δοκέω níbí túmọ̀ sí rírò tàbí fífura nípa ohun tí wọ́n rí.
- source_word: ὅτι φάντασμά ἐστιν
  choice: pé iwin ni
  rationale: ‘Iwin’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìfarahàn ẹ̀mí tí ó dẹ́rù bani; àlàyé ìsàlẹ̀ fi àṣàyàn ‘àwòrán ẹ̀mí’ hàn láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: καὶ ἀνέκραξαν
  choice: wọ́n sì ké jáde
  rationale: ἀνακράζω tọ́ka sí igbe rara; ‘ké jáde’ pa agbára ọ̀rọ̀ náà mọ́ láì sọ irú igbe náà ju bí orísun ṣe sọ lọ.
theological_decisions:
- issue: Irú ìrìn Jésù lórí omi
  choice: ó ń rìn lórí òkun
  alternative: ó ń rìn lẹ́gbẹ̀ẹ́ òkun
  rationale: Nínú àyíká ìtàn yìí, ἐπὶ τῆς θαλάσσης tọ́ka sí orí omi òkun, kì í ṣe etí òkun; èyí pa ìtumọ̀ iṣẹ̀ ìyanu náà mọ́ láì ṣe àfikún.
- issue: Ìtumọ̀ φάντασμα
  choice: iwin
  alternative: àwòrán ẹ̀mí / ohun àrà tí ó farahàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ìfarahàn bí ẹ̀mí; ‘iwin’ jẹ́ kíkún, àdánidá, ó sì yẹ fún ohun tí àwọn ọmọ-ẹ̀yìn rò, kì í ṣe ìdájọ́ onítumọ̀ nípa ohun tí Jésù jẹ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé yé fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìṣètò gbólóhùn tẹ̀ lé ìṣàn ìtàn Yorùbá, ó sì pa ìtumọ̀ àti àìdánilójú inú orísun Gíríìkì mọ́.
