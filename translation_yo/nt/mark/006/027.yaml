source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ọba rán ọmọ-ogun olùṣọ́ kan, ó sì pàṣẹ fún un pé kí ó mú orí Jòhánù wá.[a] Ó lọ, ó sì gé orí Jòhánù ní ilé ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “olùṣọ́” tàbí “olùṣọ́ ara.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ àyálò láti èdè Látìn (spekoulatōr), tí ó ń tọ́ka sí ọmọ ẹgbẹ́ olùṣọ́ alákòóso; níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ẹni tí ń ṣe ìdájọ́ ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ tí ó wọ́pọ̀ nínú ìtàn Máàkù hàn ní Yorùbá àdánidá.
- source_word: ὁ βασιλεὺς
  choice: ọba
  rationale: A pa orúkọ oyè tí Máàkù lò mọ́, bí ó tilẹ̀ jẹ́ pé Hẹ́rọ́dù jẹ́ tetrarch nípa ìtàn.
- source_word: σπεκουλάτορα
  choice: olùṣọ́ kan tí ń ṣe iṣẹ́ pípa ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ àyálò Látìn fún ọmọ ẹgbẹ́ olùṣọ́ alákòóso; níbí, iṣẹ́ rẹ̀ ni pípa ẹni tí a dá lẹ́bi. Gbólóhùn yìí pa ìtumọ̀ olùṣọ́ àti ipa apànìyàn rẹ̀ pọ̀.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: ó sì pàṣẹ fún un pé kí ó mú ... wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi àṣẹ líle àti ìṣe tí a ní kí ẹni náà ṣe hàn.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: orí Jòhánù
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ‘orí rẹ̀,’ lílo orúkọ Jòhánù mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere ní Yorùbá, láì yí ìtumọ̀ padà.
- source_word: ἀπεκεφάλισεν
  choice: gé orí Jòhánù
  rationale: ‘Gé orí’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ìforúkọsílẹ̀ ìtàn mu.
- source_word: ἐν τῇ φυλακῇ
  choice: ní inú ẹ̀wọ̀n
  rationale: Ó tọ́ka sí ibi pàtó tí a ti fi Jòhánù sẹ́wọ̀n, ó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn. A lo ‘ọba’ gẹ́gẹ́ bí orísun Gíríìkì, a sì ṣàlàyé σπεκουλάτωρ ní ọ̀nà tí ó pa ipò olùṣọ́ àti iṣẹ́ pípa rẹ̀ mọ́.
