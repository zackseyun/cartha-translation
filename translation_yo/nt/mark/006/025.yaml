id: MRK.6.25
reference: Mark 6:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: yo
  text: Ó sì wọlé lọ sí ọ̀dọ̀ ọba lẹ́sẹ̀kẹsẹ̀, ní ìkánjú, ó sì béèrè lọ́wọ́ rẹ̀ pé, “Mo fẹ́ kí o fún mi ní orí Jòhánù Olùṣe ìrìbọmi[a] lórí àwo, nísinsìnyí gan-an.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìlò àṣà, “Jòhánù Bátísítì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: wọlé lọ bá ọba
  rationale: Ó fi ìgbésẹ̀ rẹ̀ wọ ibi tí ọba wà hàn ní èdè Yorùbá àdánidá, láìfi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára tí ó wọ́pọ̀ nínú ìtàn Máàkù mọ́, ó sì yàtọ̀ sí ἐξαυτῆς tó wà nínú ọ̀rọ̀ tí ọmọbìnrin náà sọ.
- source_word: μετὰ σπουδῆς
  choice: ní ìkánjú
  rationale: Ó túmọ̀ sí pé ó yára gidigidi láti ṣe ohun náà, láìdá ìtumọ̀ náà sí ìtara rere.
- source_word: βασιλέα
  choice: ọba
  rationale: Bí ó tilẹ̀ jẹ́ pé Hẹ́rọ́dù Àńtípà jẹ́ tetrarch nípa ìtàn, βασιλέα ní ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘ọba,’ a sì pa ìsọfúnni ìtàn náà mọ́ gẹ́gẹ́ bí a ti kọ ọ́.
- source_word: ᾐτήσατο
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ó fi ìbéèrè tàbí ìbéèrè ohun kan hàn ní ọ̀nà àdánidá; bí ọ̀rọ̀ rẹ̀ ṣe le tó wà nínú ohun tí ó sọ fúnra rẹ̀.
- source_word: Θέλω
  choice: Mo fẹ́
  rationale: Ó pa ọ̀rọ̀ ìfẹ́-inú tó ṣe tààràtà mọ́, ó sì yẹ fún èdè Yorùbá òde òní.
- source_word: ἵνα ... δῷς μοι
  choice: kí o fún mi ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ohun tí ẹni náà fẹ́ kí ẹlòmíràn ṣe.
- source_word: ἐξαυτῆς
  choice: nísinsìnyí gan-an
  rationale: Ó fi dandan ìmúṣẹ lẹ́sẹ̀kẹsẹ̀ hàn, ó sì jẹ́ kí àdíwọ́bò méjèèjì—εὐθὺς àti ἐξαυτῆς—dúró lọ́tọ̀.
- source_word: ἐπὶ πίνακι
  choice: lórí àwo
  rationale: Àwo ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun ìjẹun tí a lè gbé nǹkan lé lórí níbi àsè; ọ̀rọ̀ yìí kò fi ìwọ̀n tàbí ìrísí tí Gíríìkì kò sọ kún un.
- source_word: τὴν κεφαλὴν
  choice: orí
  rationale: A pa ìsọfúnni líle náà mọ́ ní tààràtà, láìrọ̀ ọ́ lójú.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jòhánù Olùṣe Ìrìbọmi
  rationale: ‘Olùṣe Ìrìbọmi’ túmọ̀ ipa iṣẹ́ βαπτιστής ní kedere dípò kí a kan yá orúkọ oyè àṣà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jòhánù Olùṣe Ìrìbọmi
  alternative: Jòhánù Batisiti
  rationale: Kì í ṣe ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ariyanjiyan wà lórí rẹ̀; síbẹ̀, ‘Olùṣe Ìrìbọmi’ pa agbára àpèjúwe βαπτιστής mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àpèjúwe àṣà tí ọ̀pọ̀ mọ̀ sílẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu, a sì pa ìyára ìtàn àti bí ìbéèrè náà ṣe bani lẹ́rù mọ́.
