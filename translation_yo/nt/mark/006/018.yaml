source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: yo
  text: Nítorí Jòhánù ti ń sọ fún Hẹ́rọ́dù pé, “Kò bófin mu[a] fún ọ láti ní aya arákùnrin rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kò yọ̀ǹda fún ọ láti ní aya arákùnrin rẹ̀.”
    reason: 'Àṣàyàn ìtumọ̀ ọ̀rọ̀: ἔξεστιν lè tẹnu mọ́ ohun tí a fàyè gbà tàbí ohun tí ó bófin mu.'
lexical_decisions:
- source_word: ἔλεγεν
  choice: ti máa ń sọ
  rationale: Àkókò imperfect ní Gíríìkì ń fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; “ti máa ń sọ” mú agbára yìí jáde ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ náà mọ́ àlàyé ohun tí ó ṣáájú, ó sì pa ipa ìdí tàbí àlàyé rẹ̀ mọ́.
- source_word: Ἡρῴδῃ
  choice: Hẹ́rọ́dù
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Kò bófin mu fún ọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a fàyè gbà tàbí ohun tí ó bá òfin mu. Ní àyíká ìbáwí Jòhánù, yíyan yìí pa agbára ìwà rere àti òfin mọ́ láìfi àlàyé tí ẹsẹ̀ náà kò sọ kún un.
- source_word: ἔχειν
  choice: láti ní
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ náà, ó sì ṣeé lò ní àyíká ìgbéyàwó yìí láìṣe àfikún ìtumọ̀.
- source_word: γυναῖκα
  choice: aya
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “obìnrin” tàbí “aya,” gbólóhùn “aya arákùnrin rẹ” fi hàn pé aya ni a ń sọ̀rọ̀ rẹ̀.
- source_word: τοῦ ἀδελφοῦ σου
  choice: arákùnrin rẹ
  rationale: Ó pa ìbátan pàtàkì tí ẹ̀sùn Jòhánù dá lé mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ gbólóhùn oní-ìní náà ní Yorùbá.
theological_decisions:
- issue: Irú ìbáwí Jòhánù
  choice: “Kò bófin mu fún ọ” gẹ́gẹ́ bí ìdènà ti òfin àti ìwà rere
  alternative: “A kò yọ̀ǹda fún ọ” tàbí “Kò tọ́ fún ọ”
  rationale: ἔξεστιν dá lórí ohun tí a fàyè gbà tàbí tí ó bófin mu. Àyíká náà lè tọ́ka sí àwọn ìdènà inú Òfin, ṣùgbọ́n a kò sọ ìtọ́kasí náà ní gbangba nínú ẹsẹ̀ yìí; nítorí náà, ìtumọ̀ náà pa agbára òfin mọ́ láìṣe àfikún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Ti máa ń sọ” pa ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra mọ́.
