  source_fidelity: Àṣẹ ìtẹnumọ́ náà (Δότε ... ὑμεῖς), ìbéèrè ìrònú náà, àti iye ‘igba dínárì’ ni a ti pa mọ́. Ṣùgbọ́n ‘kí a sì fún wọn jẹ’ kò ṣàfihàn ìtumọ̀ δώσομεν αὐτοῖς φαγεῖν ní Yorùbá tí ó pé; a tún un ṣe sí ‘kí a fún wọn ní búrẹ́dì náà kí wọ́n jẹ.’
  naturalness: ‘Wọ́n sì bi í pé’ lè ṣeé lóye, ṣùgbọ́n ‘wọ́n sì wí fún un pé’ sún mọ́ λέγουσιν αὐτῷ, ó sì jẹ́ Yorùbá ìtàn tí ó rọrùn. ‘Ó sì dá wọn lóhùn, ó ní’ tún dá ìsọ̀rọ̀ méjì ἀποκριθεὶς εἶπεν hàn dáadáa.
  terminology: ‘Búrẹ́dì’ yẹ fún ἄρτους nínú àyíká yìí. Àmọ́ ‘ìṣù búrẹ́dì’ nínú àlàyé ìsàlẹ̀ kò tọ́, nítorí ìṣù túmọ̀ sí yam; a fi ‘àwọn búrẹ́dì’ rọ́pò rẹ̀ fún ìtumọ̀ ‘loaves.’ ‘Dínárì’ àti àlàyé iye owó iṣẹ́ ọjọ́ kan yẹ.
