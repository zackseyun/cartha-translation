  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn, ó ní, “Ẹ̀yin fúnra yín, ẹ fún wọn ní ohun tí wọ́n máa jẹ.” Wọ́n sì wí fún un pé, “Ṣé kí a lọ ra búrẹ́dì[b] tí iye rẹ̀ jẹ́ igba dínárì[a], kí a sì fún wọn ní búrẹ́dì náà kí wọ́n jẹ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dínárì kan jẹ́ iye owó iṣẹ́ ọjọ́ kan tí òṣìṣẹ́ tàbí ọmọ ogun sábà máa ń gbà.
    reason: cultural_note
  - marker: b
    text: A tún lè tú ọ̀rọ̀ Gíríìkì ἄρτους sí “àwọn búrẹ́dì.” Ó lè túmọ̀ sí búrẹ́dì lápapọ̀ tàbí àwọn búrẹ́dì ọlọ́kọ̀ọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dá wọn lóhùn pé
  rationale: Ó sọ ìtumọ̀ ìdáhùn náà ní èdè Yorùbá àdánidá; ‘pé’ ló ṣe iṣẹ́ ọ̀rọ̀ ìṣáájú fún ohun tí ó sọ, láìjẹ́ kí gbólóhùn náà le koko.
- source_word: Δότε ... ὑμεῖς
  choice: Ẹ̀yin fúnra yín, ẹ fún
  rationale: ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς mọ́, ‘ẹ fún’ sì jẹ́ àṣẹ tààrà gẹ́gẹ́ bí Δότε.
- source_word: φαγεῖν
  choice: ohun tí wọn yóò jẹ
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘fún wọn ní ohun jíjẹ,’ ó sì pa ìtumọ̀ infinitive náà mọ́.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Ṣé kí a lọ ra
  rationale: Ó fi ìbéèrè deliberative subjunctive hàn ní Yorùbá òde òní, ó sì so lílọ àti ríra pọ̀ bí Gíríìkì ṣe ṣe.
- source_word: δηναρίων διακοσίων
  choice: tí iye rẹ̀ jẹ́ igba dínárì
  rationale: Genitive náà ń fi iye owó tí ohun náà jẹ́ hàn; ọ̀rọ̀ yìí mú un ṣe kedere láìyí iye náà padà.
- source_word: ἄρτους
  choice: búrẹ́dì
  rationale: ‘Búrẹ́dì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún bread; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn, ‘ìṣù búrẹ́dì,’ mọ́.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: kí a sì fún wọn jẹ
  rationale: Ó pa ìṣe ‘fún’ mọ́, ó sì tún ìlànà ọ̀rọ̀ àṣẹ Jésù ṣe ní Yorùbá ṣókí àti àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ. Ìbéèrè àwọn ọmọ-ẹ̀yìn dúró gẹ́gẹ́ bí ìbéèrè ìrònú, láìfi ìbínú tàbí ẹ̀gàn kún un.
