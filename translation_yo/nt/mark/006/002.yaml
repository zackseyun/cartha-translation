id: MRK.6.2
reference: Mark 6:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: yo
  text: Nígbà tí ọjọ́ Ìsinmi dé, ó bẹ̀rẹ̀ sí í kọ́ni nínú sínágọ́gù. Ẹnu sì ya ọ̀pọ̀ àwọn tí ń gbọ́ ọ, wọ́n ń sọ pé, “Níbo ni ọkùnrin yìí ti rí àwọn nǹkan wọ̀nyí gbà? Kí sì ni ọgbọ́n yìí tí a fi fún un, àti àwọn iṣẹ́ agbára irú bẹ́ẹ̀ tí ń ṣẹlẹ̀ nípasẹ̀ ọwọ́ rẹ̀[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ ńlá irú bẹ́ẹ̀” tàbí “àwọn iṣẹ́ ìyanu irú bẹ́ẹ̀.” Ọ̀rọ̀ Gíríìkì ọ̀pọ̀ δυνάμεις lè túmọ̀ sí àwọn iṣẹ́ ìyanu tàbí àwọn ìfihàn agbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Nígbà tí ọjọ́ Ìsinmi dé
  rationale: Ó fi àyíká àkókò tí genitive absolute ń tọ́ka sí hàn ní Yorùbá àdánidá, láì sọ ọ́ di gbólóhùn aláìrọ̀rùn.
- source_word: ἤρξατο διδάσκειν
  choice: ó bẹ̀rẹ̀ sí í kọ́ni
  rationale: Èyí mú ìtumọ̀ ingressive náà jáde, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ‘ó bẹ̀rẹ̀ láti kọ́ àwọn ènìyàn.’
- source_word: συναγωγῇ
  choice: sínágọ́gù
  rationale: Ní àyíká Júù yìí, ọ̀rọ̀ náà ń tọ́ka sí ilé ìpàdé àti ibi ìjọsìn tí a mọ̀ sí sínágọ́gù.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: ọ̀pọ̀ àwọn tí wọ́n gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Ó tú participle náà sí Yorùbá tó ṣe kedere, ó sì jẹ́ kí ohun tí wọ́n gbọ́—ọ̀rọ̀ ẹ̀kọ́ rẹ̀—ye òǹkàwé láti inú àyíká.
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu sì ya ... wọ́n
  rationale: Àṣàọ̀rọ̀ Yorùbá yìí fi ìyàlẹ́nu líle hàn, ó sì bá ìhùwàpadà tí imperfect náà ń ṣàpèjúwe mu.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Níbo ni ọkùnrin yìí ti rí àwọn nǹkan wọ̀nyí gbà?
  rationale: ‘Níbo’ ń béèrè orísun, ‘rí ... gbà’ sì jẹ́ Yorùbá àdánidá. ‘Ọkùnrin yìí’ tún pa ìjìnnà tàbí ìfojúrí díẹ̀ tó lè wà nínú τούτῳ mọ́.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Kí sì ni ọgbọ́n yìí tí a fi fún un
  rationale: Ó pa irú ìbéèrè àti passive ‘tí a fi fún un’ mọ́, láì sọ ẹni tó fún un ní ọgbọ́n náà ní pàtó.
- source_word: δυνάμεις
  choice: iṣẹ́ agbára
  rationale: Ó pa èrò agbára inú δυνάμεις mọ́, ó sì lè tọ́ka sí àwọn iṣẹ́ àrà ọ̀tọ̀ láì fi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- source_word: τοιαῦται
  choice: irú ... báwọ̀nyí
  rationale: Àkópọ̀ yìí fi ìfarahàn àti ìyàlẹ́nu sí irú àwọn iṣẹ́ náà hàn.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: tí ń ṣẹlẹ̀ nípasẹ̀ ọwọ́ rẹ̀
  rationale: Ó pa àwòrán Gíríìkì ‘nípasẹ̀ ọwọ́ rẹ̀’ àti ìṣe tó ń ṣẹlẹ̀ mọ́, dípò yíyí rẹ̀ padà sí active tó rọrùn jù.
theological_decisions:
- issue: Ìtumọ̀ δυνάμεις nínú àyíká yìí
  choice: A lò ‘iṣẹ́ agbára’ fún àwọn iṣẹ́ àrà ọ̀tọ̀ tí agbára ń farahàn nínú wọn.
  alternative: ‘iṣẹ́ ìyanu’ tàbí ‘iṣẹ́ ńlá’
  rationale: Nínú Máàkù, plural δυνάμεις sábà ń tọ́ka sí àwọn iṣẹ́ àrà ọ̀tọ̀; ‘iṣẹ́ agbára’ pa ìtumọ̀ iṣẹ́ àti agbára rẹ̀ pọ̀, láì pinnu ju orísun lọ.
- issue: Ìró ohùn τούτῳ
  choice: A túmọ̀ ọ́ sí ‘ọkùnrin yìí’ nínú ìbéèrè àkọ́kọ́.
  alternative: ‘òun’ tàbí ‘eléyìí’
  rationale: Èyí lè fi ìjìnnà tàbí ìfojúrí díẹ̀ tí demonstrative náà lè ní nínú àyíká hàn, láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Ẹni tó fún Jésù ní ọgbọ́n
  choice: A pa passive náà mọ́ gẹ́gẹ́ bí ‘tí a fi fún un.’
  alternative: ‘tí Ọlọ́run fi fún un’
  rationale: Gbólóhùn Gíríìkì kò dárúkọ ẹni tó fún un; fífi ‘Ọlọ́run’ sínú ọ̀rọ̀ àkọ́kọ́ yóò yanjú ohun tí orísun náà fi sílẹ̀ ní àìsọ pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìṣàn gbólóhùn náà jẹ́ ti ìtàn àdánidá, ṣùgbọ́n a pa ìbéèrè kejì tó ní ìfọ̀rọ̀wérọ̀ dídìpọ̀ àti àwòrán ‘nípasẹ̀ ọwọ́ rẹ̀’ mọ́ kí ìdàrúdàpọ̀ gidi inú Gíríìkì má bàa sọnù. A gbe àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ‘iṣẹ́ agbára,’ nítorí ibẹ̀ ni àlàyé lexical náà kàn.
