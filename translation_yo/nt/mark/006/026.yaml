source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: yo
  text: Ọba náà sì banújẹ́ gidigidi, ṣùgbọ́n nítorí àwọn ìbúra rẹ̀ àti àwọn tí wọ́n jókòó síbi àsè pẹ̀lú rẹ̀[a], kò fẹ́ kọ̀ ọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí wọ́n dùbúlẹ̀ níbi oúnjẹ, gẹ́gẹ́ bí àṣà jíjẹun nígbà náà; ó tún lè túmọ̀ sí “àwọn àlejò àsè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kọ ohun tí ó béèrè” tàbí “fi ohun tí ó ti ṣèlérí sílẹ̀.” Èrò náà ni pé ọba kò fẹ́ yí padà kúrò nínú ohun tí ó ti ṣèlérí fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: banújẹ́ gidigidi
  rationale: Ó fi ìbànújẹ́ tó jinlẹ̀ hàn ní èdè Yorùbá àdánidá, láì dín agbára ọ̀rọ̀ Gíríìkì kù.
- source_word: γενόμενος
  choice: sì banújẹ́
  rationale: A mú ìyípadà sí ipò ìbànújẹ́ náà wá sínú ìtàn ní ọ̀nà tó rọrùn ní Yorùbá; ‘ṣùgbọ́n’ fi ìtakora tó wà láàárín ìbànújẹ́ rẹ̀ àti ohun tó pinnu láti ṣe hàn.
- source_word: ὁ βασιλεὺς
  choice: Ọba náà
  rationale: ‘Ọba’ ni ìtumọ̀ tààrà tí Máàkù lò fún Hẹ́rọ́dù nínú àyíká yìí.
- source_word: διὰ τοὺς ὅρκους
  choice: nítorí àwọn ìbúra rẹ̀
  rationale: Ó pa ìtumọ̀ ìdí tàbí okùnfà tí διά pẹ̀lú accusative ní mọ́; ‘rẹ̀’ ṣe kedere pé ìbúra ọba náà ni.
- source_word: τοὺς ἀνακειμένους
  choice: àwọn tí wọ́n jókòó síbi àsè pẹ̀lú rẹ̀
  rationale: Ó tọ́ka sí àwọn tó wà níbi oúnjẹ náà, ó sì jẹ́ èdè Yorùbá tó ṣeé lóye; àlàyé ìdúbúlẹ̀ síbi tábìlì wà ní àlàyé ìsàlẹ̀.
- source_word: οὐκ ἠθέλησεν
  choice: kò fẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ inú tàbí àìfẹ́ sí ohun kan mọ́, kì í ṣe àìlágbára láti ṣe é.
- source_word: ἀθετῆσαι αὐτήν
  choice: kọ̀ fún un
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ọba náà kò fẹ́ kọ ohun tí ọmọbìnrin náà béèrè tàbí fi í sílẹ̀; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì tún pa ẹni tí a kọ̀ fún mọ́.
theological_decisions: []
translation_notes:
  register: 'Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A yan ìṣètò gbólóhùn tó ṣe kedere ní Yorùbá, ṣùgbọ́n a pa ìtakora tó wà nínú ọ̀rọ̀ Gíríìkì mọ́: ó banújẹ́, síbẹ̀ nítorí ìbúra rẹ̀ àti àwọn tó wà níbi àsè, kò fẹ́ kọ̀ fún ọmọbìnrin náà.'
