  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti dágbére fún wọn[a], ó sì lọ sí òkè náà láti gbàdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí ó ti yà kúrò lọ́dọ̀ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú nínú ìtàn, láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἀποταξάμενος
  choice: lẹ́yìn tí ó ti dágbére
  rationale: Ọ̀rọ̀ náà níbí túmọ̀ sí kí ènìyàn dágbére tàbí kí ó gba ààyè lọ́dọ̀ àwọn ẹlòmíràn. ‘Dágbére’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ yìí, ó sì bá αὐτοῖς mu.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ onípò àfúnni ọ̀pọ̀ yìí tọ́ka sí àwọn ènìyàn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ‘fún wọn’ bá gbólóhùn ‘dágbére fún wọn’ mu ní Yorùbá.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Ó sọ pé ó kúrò níbẹ̀ lọ sí ibòmíràn. ‘Ó lọ’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: εἰς τὸ ὄρος
  choice: sí orí òkè
  rationale: ὄρος lè túmọ̀ sí òkè tàbí agbègbè olókè. Àpilẹ̀kọ pàtó inú Gíríìkì ni a fi hàn pẹ̀lú ‘orí òkè,’ láìsọ pé òkè kan lásán ni tàbí fífi ìtumọ̀ àmì ẹ̀sìn kún un.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: Ọ̀rọ̀ àìlẹ́ni yìí sọ ète tí ó fi lọ; ‘láti gbàdúrà’ jẹ́ ìtumọ̀ tààrà àti àdánidá.
theological_decisions:
- issue: Ohun tí ‘τὸ ὄρος’ ń tọ́ka sí
  choice: orí òkè
  alternative: òkè kan; agbègbè olókè; ibi ìfihàn pàtàkì
  rationale: Gíríìkì ní àpilẹ̀kọ pàtó, ṣùgbọ́n kò sọ pé òkè náà ní ìtumọ̀ àmì tàbí ti ẹ̀kọ́ ìgbàgbọ́ kan. Ìtumọ̀ náà pa àlàyé ojú-ìṣẹ̀lẹ̀ mọ́ láìfi ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́wọ́lọ́wọ́, tó níyì, tí ó sì rọrùn fún òǹkàwé lasán. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
