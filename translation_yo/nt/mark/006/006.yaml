base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: yo
  text: Àìgbàgbọ́ wọn sì ń yà á lẹ́nu.[a] Ó sì ń lọ káàkiri àwọn abúlé, ó ń kọ́ni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì ń ṣe é ní ìyàlẹ́nu nítorí àìgbàgbọ́ wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ń lọ yí ká láàárín àwọn abúlé,” tàbí “ó sì ń lọ ní àyíká láti abúlé kan sí òmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: ń yà á lẹ́nu
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ń ṣe ẹnì kan ní ìyàlẹ́nu. Àmì ìṣe “ń” tún fi ipa ìṣe aláìparí inú ọ̀rọ̀ Gíríìkì hàn.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: Àìgbàgbọ́ wọn … lẹ́nu
  rationale: Àìgbàgbọ́ túmọ̀ ἀπιστία ní kíkún, ó sì lágbára ju ọ̀rọ̀ tó lè túmọ̀ sí kìkì pé ìgbàgbọ́ wọn kéré. Ìṣètò gbólóhùn Yorùbá fi àìgbàgbọ́ wọn hàn gẹ́gẹ́ bí ohun tó yà á lẹ́nu.
- source_word: περιῆγεν
  choice: ń lọ káàkiri
  rationale: “Ń lọ káàkiri” fi ìrìn láti ibì kan sí ibòmíràn hàn, ó sì pa ipa ìṣe aláìparí náà mọ́.
- source_word: τὰς κώμας
  choice: àwọn abúlé
  rationale: “Àwọn abúlé” ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún àwọn ìletò kéékèèké tí κώμη ń tọ́ka sí.
- source_word: κύκλῳ
  choice: tó yí ká
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn abúlé náà wà ní àyíká, bó tilẹ̀ jẹ́ pé ó tún lè ṣàpèjúwe bí ó ṣe ń rìn yí ká láàárín wọn; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ méjèèjì mọ́.
- source_word: διδάσκων
  choice: ó ń kọ́ni
  rationale: Gbólóhùn yìí fi ìkọ́ni hàn gẹ́gẹ́ bí ohun tó ń ṣe nígbà tó ń lọ káàkiri, ní ìbámu pẹ̀lú participle àsìkò ìsinsìnyí.
theological_decisions:
- issue: Bí a ṣe máa sọ ìyàlẹ́nu Jésù sí àìgbàgbọ́ wọn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un
  choice: Àìgbàgbọ́ wọn sì ń yà á lẹ́nu.
  alternative: Ó sì ń ṣe ìyàlẹ́nu nítorí àìgbàgbọ́ wọn.
  rationale: 'Ìtumọ̀ náà sọ ohun tí ẹsẹ náà sọ ní tààràtà: àìgbàgbọ́ wọn yà Jésù lẹ́nu. A kò dín agbára ọ̀rọ̀ náà kù, bẹ́ẹ̀ ni a kò fi àlàyé àròsọ kún bí ìyàlẹ́nu yìí ṣe bá irú ẹni tí Jésù jẹ́ mu.'
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “yà á lẹ́nu” dípò gbólóhùn líle tàbí ti àtijọ́, a sì lo àwọn “ń” méjèèjì láti fi ìṣe tó ń bá a lọ hàn.
