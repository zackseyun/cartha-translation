  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: yo
  text: 'Nígbà tí wọ́n sì jáde kúrò nínú ọkọ̀ ojú omi,[a] lẹ́sẹ̀kẹsẹ̀ ni àwọn ènìyàn ibẹ̀ dá a mọ̀.


    [a] Lọ́nà tí ó tẹ̀ lé èdè Gíríìkì pẹ́kípẹ́kí: “Nígbà tí wọ́n jáde kúrò nínú ọkọ̀ ojú omi, lẹ́sẹ̀kẹsẹ̀ ni wọ́n dá a mọ̀.” Èdè Gíríìkì kò sọ ẹni tí ó dá a mọ̀ ní tààrà; àyíká ọ̀rọ̀ fi hàn pé àwọn ènìyàn agbègbè náà ni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lọ́nà tí ó tẹ̀ lé èdè Gíríìkì pẹ́kípẹ́kí: “Nígbà tí wọ́n jáde kúrò nínú ọkọ̀ ojú omi, lẹ́sẹ̀kẹsẹ̀ ni wọ́n dá a mọ̀.” Èdè Gíríìkì kò sọ ẹni tí ó dá a mọ̀ ní tààrà; àyíká ọ̀rọ̀ fi hàn pé àwọn ènìyàn agbègbè náà ni.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: nígbà tí wọ́n jáde
  rationale: A tú ìkọ̀lé genitive absolute náà sí gbólóhùn àsìkò tó bá èdè Yorùbá mu, láì pàdánù ìtumọ̀ pé ìdámọ̀ náà ṣẹlẹ̀ nígbà tí wọ́n jáde.
- source_word: ἐκ τοῦ πλοίου
  choice: kúrò nínú ọkọ̀ ojú omi
  rationale: “Ọkọ̀ ojú omi” jẹ́ ọ̀nà àdánidá àti òde òní láti sọ πλοῖον, ọkọ̀ kékeré tí wọ́n ń lò lórí Òkun Gálílì.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Èyí pa agbára ọ̀rọ̀ náà àti ìlò rẹ̀ tí ó wọ́pọ̀ nínú Máàkù mọ́.
- source_word: ἐπιγνόντες
  choice: dá a mọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n mọ ẹni tí wọ́n rí; “dá a mọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere jù lọ.
- source_word: αὐτόν
  choice: a
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Jésù nínú àyíká ìtàn.
- source_word: implicit subject of ἐπιγνόντες
  choice: àwọn ènìyàn ibẹ̀
  rationale: Olùṣe ìṣe náà kò fara hàn gẹ́gẹ́ bí orúkọ nínú Gíríìkì. Àyíká ẹsẹ tó tẹ̀ lé e fi hàn pé àwọn ènìyàn agbègbè náà ni wọ́n dá Jésù mọ̀; fífi wọn hàn nínú ìtumọ̀ ń dènà àṣìlóye pé àwọn tó jáde nínú ọkọ̀ ni wọ́n dá ẹlòmíràn mọ̀.
theological_decisions:
- issue: Ta ni ó dá Jésù mọ̀?
  choice: Àwọn ènìyàn ibẹ̀ ni wọ́n dá a mọ̀.
  alternative: Kí a fi olùṣe ìṣe náà sílẹ̀ gẹ́gẹ́ bí “wọ́n,” bí Gíríìkì ṣe fi í ṣe aláìlórúkọ.
  rationale: Ìpinnu gírámà àti àyíká ìtàn ni èyí, kì í ṣe fífi ẹ̀kọ́ ìjọ kan kún un. Participial nominative plural ἐπιγνόντες kò tọ́ka lọ́nà àdánidá sí αὐτῶν inú genitive absolute; ẹsẹ tó tẹ̀ lé e fi àwọn ènìyàn agbègbè hàn gẹ́gẹ́ bí olùṣe ìṣe náà. Àlàyé ìsàlẹ̀ ojú ìwé sì pa ìfarapamọ́ olùṣe nínú Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. “Lẹ́sẹ̀kẹsẹ̀ ni” ń mú ìtẹnumọ́ Máàkù jáde, “dá a mọ̀” sì jẹ́ gbólóhùn ojoojúmọ́ tó péye fún ìdámọ̀ ẹni.
