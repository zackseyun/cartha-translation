language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: yo
  text: Ní ibì èyíkéyìí tí àwọn ènìyàn ibẹ̀ kò bá gbà yín, tí wọn kò sì fetí sí yín, nígbà tí ẹ bá ń kúrò níbẹ̀, ẹ gbọn erùpẹ̀ tí ó wà lábẹ́ ẹsẹ̀ yín kúrò, láti jẹ́ ẹ̀rí sí wọn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “láti jẹ́ ẹ̀rí lòdì sí wọn” tàbí “láti jẹ́ ẹ̀rí fún wọn.” Gíríìkì sọ ní tààrà pé “ẹ̀rí sí wọn,” bí ó tilẹ̀ jẹ́ pé àyíká lè fi hàn pé ẹ̀rí náà dojú kọ àwọn tí kò gba àwọn ìránṣẹ́ náà tàbí tí kò fetí sí wọn.
    reason: alternative_reading
  - marker: b
    text: Gbígbọn erùpẹ̀ kúrò ní ẹsẹ̀ jẹ́ ìṣe àmì kan tí ó fi hàn pé ẹni náà ya ara rẹ̀ sọ́tọ̀, ó sì jẹ́ ìkìlọ̀ nítorí ìkọ̀sílẹ̀ náà.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: bí ibì kan
  rationale: Ọ̀rọ̀ yìí fi ibì èyíkéyìí tí ipò náà bá ṣẹlẹ̀ hàn, ó sì pa ọ̀rọ̀-orúkọ τόπος (‘ibì’) mọ́.
- source_word: μὴ δέξηται ὑμᾶς
  choice: kò bá sì gbà yín
  rationale: δέχομαι níbí túmọ̀ sí gbígba àwọn ìránṣẹ́ wọlé tàbí kí a tẹ́wọ́ gbà wọ́n; ‘gbà yín’ jẹ́ àdánidá, ó sì pa ìtumọ̀ gbígbà àlejò mọ́ láì ṣe àlàyé rẹ̀ ju bó ṣe yẹ lọ.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: tàbí fetí sí yín
  rationale: ‘Fetí sí’ fi hàn pé kì í ṣe gbígbọ́ ohùn lásán, bí kò ṣe fífi àfiyèsí sí ọ̀rọ̀ àwọn ìránṣẹ́.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: nígbà tí ẹ bá ń kúrò níbẹ̀
  rationale: Ó mú ipa àsìkò ti participle náà jáde ní Yorùbá àdánidá, ó sì pa bí ìṣe méjèèjì ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἐκτινάξατε
  choice: ẹ gbọn ... kúrò
  rationale: Ìṣe náà ni fífi gbígbọ̀n mú erùpẹ̀ kúrò lára ẹsẹ̀; ọ̀rọ̀ yìí ṣe kedere, ó sì bá Yorùbá mu.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: erùpẹ̀ tí ó wà lábẹ́ ẹsẹ̀ yín
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìṣètò Gíríìkì pẹ́kípẹ́kí, ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: láti jẹ́ ẹ̀rí sí wọn
  rationale: ‘Sí wọn’ pa dative αὐτοῖς àti àìdánilójú gidi inú gbólóhùn náà mọ́. Àyíká lè fi agbára ẹ̀rí tí ó dojú kọ wọ́n hàn, ṣùgbọ́n a kò fi ìtumọ̀ yẹn sínú ọ̀rọ̀ pàtàkì láìṣàlàyé.
theological_decisions:
- issue: Agbára ìtumọ̀ àmì gbígbọn erùpẹ̀ kúrò ní ẹsẹ̀
  choice: Ẹ̀rí sí àwọn tí kò gba ìránṣẹ́ náà
  alternative: Ẹ̀rí tí ó dojú kọ wọ́n tàbí àmì ìyàsọ́tọ̀ kúrò lọ́dọ̀ wọn
  rationale: εἰς μαρτύριον αὐτοῖς túmọ̀ ní tààrà sí ‘fún/sí wọn gẹ́gẹ́ bí ẹ̀rí.’ Àyíká ìkọ̀sílẹ̀ mú kí ìtumọ̀ ìkìlọ̀ tàbí ẹ̀rí lòdì sí wọn ṣeé ṣe gan-an, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ‘lòdì sí’ ní kedere; nítorí náà, a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ náà mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘ẹ/yín’ bá àwọn ọmọ-ẹ̀yìn tí a ń bá sọ̀rọ̀ mu. A yan ‘fetí sí’ dípò ‘gbọ́’ láti fi ìgbọ́ran tàbí àfiyèsí hàn láì lọ dé ‘gbọ́ràn sí.’ Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn náà nítorí pé àwọn méjèèjì ṣàlàyé ìtumọ̀ gbogbo ìṣe ìkẹyìn.
