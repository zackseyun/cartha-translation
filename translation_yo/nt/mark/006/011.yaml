  source_fidelity: Ọ̀rọ̀ pàtàkì náà pa ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́, pàápàá jù lọ ìtumọ̀ tí kò fìdí ‘lòdì sí wọn’ múlẹ̀ nínú εἰς μαρτύριον αὐτοῖς. Síbẹ̀, lílo ‘ibì kan’ gẹ́gẹ́ bí ẹni tí yóò ‘gbọ́/fetí sí’ kò rọrùn ní Yorùbá; fífi ‘àwọn ènìyàn ibẹ̀’ hàn jẹ́ ìmúṣiṣẹ́ gírámà Yorùbá, láì yí ẹni tí ìkọ̀sílẹ̀ náà kan padà.
  naturalness: '‘Bí ibì kan kò bá sì gbà yín tàbí fetí sí yín’ kò dára rárá ní ìṣètò Yorùbá: ‘sì’ wà ní ipò tí kò yẹ, ‘tàbí’ kò ṣe àfihàn ìsopò-òdì ‘kì í ṣe ... bẹ́ẹ̀ ni kì í ṣe ...’ náà dáadáa, ibì sì kì í ‘fetí sí’ ènìyàn. Ìtúnṣe náà lo ìsọ̀rọ̀ ìgbàlódé tí ó rọrùn, tí ó sì ní iyì.'
  terminology: ‘Gbà yín,’ ‘fetí sí yín,’ ‘gbọ́n erùpẹ̀ ... kúrò,’ àti ‘ẹ̀rí sí wọn’ yẹ. A tún ṣe àtúnṣe àlàyé [a] kí ‘ẹlẹ́rìí’ (ẹni) má bàa rọ́pò μαρτύριον, èyí tí ó jẹ́ ‘ẹ̀rí’ tàbí ‘ìjẹ́rìí.’
