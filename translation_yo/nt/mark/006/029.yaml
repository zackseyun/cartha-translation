  terminology: “Àwọn ọmọ-ẹ̀yìn rẹ̀,” “òkú rẹ̀,” àti “ibojì” bá orísun mu, wọ́n sì yẹ fún Yorùbá boṣewa. Kò sí ìdí fún àlàyé ẹsẹ̀ ìsàlẹ̀ nítorí “òkú” ti sọ ìtumọ̀ πτῶμα ní kedere.
