  source_fidelity: 'Ìtumọ̀ náà ń fi ìlànà àti àwọn èrò pàtàkì ti Gíríìkì hàn dáadáa: àwọn ọmọ-ẹ̀yìn Johanu gbọ́ ìròyìn náà, wọ́n wá, wọ́n gbé òkú rẹ̀, wọ́n sì fi í sínú ibojì. Ṣùgbọ́n “tẹ́ ẹ sínú ibojì” kò dáa gẹ́gẹ́ bí ìtumọ̀ τίθημι nínú àyíká yìí.'
