id: MRK.6.29
reference: Mark 6:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn rẹ̀ gbọ́, wọ́n wá, wọ́n gbé òkú rẹ̀, wọ́n sì fi í sínú ibojì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí ... gbọ́
  rationale: Aorist participle náà ní agbára àkókò ní àyíká yìí; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn hàn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθητής, ó sì pa ìbáṣepọ̀ wọn pẹ̀lú olùkọ́ wọn mọ́. Nínú àyíká ẹsẹ yìí, “rẹ̀” ń tọ́ka sí Johanu Onítẹ̀bọmi.
- source_word: ἦλθον
  choice: wọ́n wá
  rationale: “Wá” bá ìtumọ̀ ἔρχομαι mu, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n dé ibi tí òkú náà wà.
- source_word: ἦραν
  choice: gbé
  rationale: “Gbé” lè túmọ̀ sí gbígbé ohun sókè tàbí gbígbé e kúrò níbìkan; ó bá ìṣe tí αἴρω ń ṣàpèjúwe níbí mu láì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: πτῶμα
  choice: òkú
  rationale: πτῶμα tọ́ka pàtó sí ara ẹni tí ó ti kú. “Òkú” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tó bá ọ̀rọ̀ náà mu, tí kò sì nílò àlàyé ẹsẹ̀ ìsàlẹ̀ bí “ara” ṣe lè nílò.
- source_word: ἔθηκαν
  choice: tẹ́ ẹ
  rationale: Nínú àyíká ìsìnkú, “tẹ́ ẹ sínú ibojì” jẹ́ ọ̀rọ̀ Yorùbá àdánidá àti ọ̀wọ̀ fún fífi òkú sí ibi ìsìnkú.
- source_word: ἐν μνημείῳ
  choice: sínú ibojì
  rationale: μνημεῖον níbí ni ibi tí a ń sin òkú sí. “Ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún tomb tàbí ibi ìsìnkú.
theological_decisions:
- issue: Ẹni tí “àwọn ọmọ-ẹ̀yìn rẹ̀” ń tọ́ka sí
  choice: Àwọn ọmọ-ẹ̀yìn Johanu Onítẹ̀bọmi
  alternative: Àwọn ọmọ-ẹ̀yìn Jesu
  rationale: Àyíká tó sún mọ́ ẹsẹ náà ń sọ nípa pípa Johanu; nítorí náà, Johanu ni ẹni tí arọ́pò-orúkọ αὐτοῦ (“rẹ̀”) ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ ti ìtàn, ó ṣe kedere, ó sì ní ọlá tó yẹ fún àpèjúwe ìsìnkú. A lo “òkú” dípò “ara” nítorí ọ̀rọ̀ Gíríìkì sọ ara ẹni tí ó ti kú ní pàtó; nítorí náà, kò sí àfikún àmì ẹsẹ̀ ìsàlẹ̀.
