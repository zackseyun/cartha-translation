  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, òde òní, tí àmì ohùn rẹ̀ péye. “Ó gbé ọwọ́ lé àwọn aláìsàn díẹ̀, ó sì mú wọn láradá” jẹ́ ìkọ̀wé adayeba, ó sì ṣètọ́jú ìbáṣepọ̀ participle àti ọ̀rọ̀-ìṣe àkọ́kọ́ nínú Gíríìkì láìfipá mú ètò gbólóhùn Gíríìkì wọ Yorùbá.
  terminology: “Iṣẹ́ agbára” jẹ́ yíyan tó dára fún δύναμις nínú Máàkù, nítorí ó pa ìsopọ̀ mọ́ “agbára” ṣùgbọ́n ó tún jẹ́ kedere pé iṣẹ́ tí a ṣe ni. “Aláìsàn” àti “mú ... láradá” jẹ́ ọ̀rọ̀ tó bójú mu fún ἀρρώστοις àti ἐθεράπευσεν. Àkọsílẹ̀ ẹsẹ̀ náà wà ní ibi tó yẹ, ó sì ṣàlàyé yíyan ọ̀rọ̀ náà láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
