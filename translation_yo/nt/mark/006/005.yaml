  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: yo
  text: Kò sì lè ṣe iṣẹ́ agbára kankan níbẹ̀[a], àyàfi pé ó gbé ọwọ́ lé àwọn aláìsàn díẹ̀, ó sì mú wọn láradá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ ìyanu kankan” tàbí “iṣẹ́ agbára kankan”; Gíríìkì sọ ní tààrà pé “agbára kankan,” èyí tí Máàkù máa ń lò fún àwọn iṣẹ́ ìyanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: lè
  rationale: Pẹ̀lú òdì “kò,” ó túmọ̀ ọ̀rọ̀ àìlè inú Gíríìkì ní tààràtà, láìsọ ọ́ di pé kò fẹ́ ṣe é.
- source_word: ποιῆσαι
  choice: ṣe
  rationale: Ọ̀rọ̀ Yoruba tó wọ́pọ̀, tó sì bá ìtumọ̀ gbòòrò ποιέω mu nínú gbólóhùn yìí.
- source_word: οὐδεμίαν δύναμιν
  choice: iṣẹ́ agbára kankan
  rationale: Ó pa ìsopọ̀ δύναμις mọ́ pẹ̀lú “agbára,” ó sì tọ́ka sí iṣẹ́ ìyanu láìfi ọ̀rọ̀ ìtumọ̀ tó dín kù rọ́pò rẹ̀.
- source_word: εἰ μὴ
  choice: àyàfi pé
  rationale: Ó fi ìyọkúrò sí òdì tó ṣáájú hàn kedere, ó sì jẹ́ èdè Yoruba àdánidá.
- source_word: ὀλίγοις ἀρρώστοις
  choice: àwọn aláìsàn díẹ̀
  rationale: Ó sọ iye díẹ̀ àti ipò àìsàn wọn ní èdè òde òní tó ṣe kedere.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: ó gbé ọwọ́ lé
  rationale: Èyí ni ọ̀nà Yoruba àdánidá láti sọ ìṣe fífi ọwọ́ lé ènìyàn; ẹyọ “ọwọ́” jẹ́ àṣà èdè bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀pọ̀.
- source_word: ἐθεράπευσεν
  choice: mú wọn láradá
  rationale: Ó túmọ̀ ìwòsàn padà sí Yoruba tó wọ́pọ̀, ó sì mú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Bóyá a ó rọ οὐκ ἐδύνατο kí ó má bàa dà bí ìdíwọ́ kan wà lórí Jésù
  choice: Pa ìtumọ̀ tààrà “kò sì lè ṣe” mọ́
  alternative: kò sì fẹ́ ṣe iṣẹ́ agbára kankan níbẹ̀
  rationale: Gíríìkì sọ àìlè ní kedere pẹ̀lú δύναμαι àti òdì. Ìtumọ̀ náà gbọ́dọ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ náà mọ́, kó má sì yí i padà sí àìfẹ́ láti ṣe.
translation_notes:
  register: Yoruba boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹnumọ́ àìlè àti ìyọkúrò tó tẹ̀ lé e mọ́.
