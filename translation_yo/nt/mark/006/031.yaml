review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìpè Jésù, ibi tó yà sọ́tọ̀, ìsinmi díẹ̀, àti ìṣàn àwọn ènìyàn tí ń bọ̀ tí wọ́n sì ń lọ hàn dáadáa. Síbẹ̀, gbolohun ìkẹyìn lè jẹ́ kí ‘wọn’ tọ́ka sí àwọn ènìyàn tó ń bọ̀ tí wọ́n sì ń lọ, nígbà tí ọrọ̀ Gíríìkì ń tọ́ka sí Jésù àti àwọn tí ó ń bá sọ̀rọ̀. Àtúnṣe náà mú olùtọ́kasí náà hàn gbangba.
  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì. Fífi ‘lọ’ kún ìpè náà mú ìṣípo láti ibi ogunlọ́gọ̀ lọ sí ibi tí ó yà sọ́tọ̀ hàn ní kedere; ‘ẹ̀yin nìkan’ sì pa ìtumọ̀ ìyàsọ́tọ̀ mọ́.
  terminology: ‘Ibi àdádó’ jẹ́ ìtumọ̀ tó yẹ fún ἔρημον τόπον, láìfi hàn pé aginjù oníyanrìn ni dandan. ‘Àǹfààní láti jẹun’ ń gbé ìtumọ̀ ‘ààyè/ìgbà tó yẹ’ ti εὐκαιρέω kalẹ̀ dáadáa.
  issues:
