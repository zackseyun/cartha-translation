id: MRK.6.31
reference: Mark 6:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ wá, ẹ̀yin nìkan, lọ sí ibi àdádó[a], kí ẹ sì sinmi díẹ̀.” Nítorí ọ̀pọ̀ ènìyàn ni ń bọ̀ tí wọ́n sì ń lọ, àwọn ọmọ-ẹ̀yìn náà kò tilẹ̀ ní àǹfààní[b] láti jẹun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ibi tí kò sí ènìyàn” tàbí “ibi ìdákẹ́jẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibi tí ó dá wà tàbí tí ènìyàn kò gbé, kì í ṣe dandan aginjù bí a ṣe sábà máa ń rò ó lóde òní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ọmọ-ẹ̀yìn náà kò tilẹ̀ ní àkókò láti jẹun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì wí
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ historical present, ṣùgbọ́n lílo àkókò tí ó ti kọjá bá ìtàn Yorùbá mu ní ti ẹ̀dá, láìsọ iṣẹ́ rẹ̀ nínú ìtàn nù.
- source_word: Δεῦτε
  choice: Ẹ wá
  rationale: Àṣẹ ìpè ni ọ̀rọ̀ náà, ó sì ń pe àwọn ọmọ-ẹ̀yìn láti kúrò níbi ogunlọ́gọ̀ lọ sí ibòmíràn.
- source_word: ὑμεῖς αὐτοὶ ... κατ’ ἰδίαν
  choice: ẹ̀yin nìkan
  rationale: Ó ṣàfihàn ìtẹnumọ́ pé àwọn fúnra wọn ni kí wọn lọ, yàtọ̀ sí àwọn ènìyàn yòókù; ọ̀rọ̀ yìí dára, ó sì ṣe kedere ní Yorùbá.
- source_word: ἔρημον τόπον
  choice: ibi àdádó
  rationale: Ó túmọ̀ sí ibi tí ènìyàn kò fi bẹ́ẹ̀ sí tàbí ibi tí ó jìnnà sí ariwo, kì í ṣe dandan aginjù oníyanrìn.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: kí ẹ sì sinmi díẹ̀
  rationale: Ó paṣẹ fún wọn láti dá iṣẹ́ dúró kí wọ́n sì gba ìsinmi fún ìgbà díẹ̀.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: ọ̀pọ̀ ènìyàn ni ń bọ̀ tí wọ́n sì ń lọ
  rationale: Ó pa ìtumọ̀ ìṣàn àwọn ènìyàn púpọ̀ tí ń dé tí wọ́n sì ń kúrò mọ́ ní èdè Yorùbá àdánidá.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: wọn kò tilẹ̀ ní àǹfààní láti jẹun
  rationale: ‘Àǹfààní’ fi ìtumọ̀ εὐκαιρέω gẹ́gẹ́ bí àyè tàbí àsìkò tó yẹ hàn, ‘tilẹ̀’ sì ṣàfihàn οὐδέ.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí i níbi tó yẹ. A gbé àmì àlàyé [a] sí lẹ́yìn ‘ibi àdádó,’ níbi tí àlàyé náà ti jẹ mọ́, dípò lẹ́yìn ‘wọn.’
