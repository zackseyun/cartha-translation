- from: Ó sì wí fún wọn pé, “Ẹ wá sí ibi àdádó[a], ẹ̀yin nìkan, kí ẹ sì sinmi díẹ̀.” Nítorí ọ̀pọ̀ ènìyàn ni ń bọ̀ tí wọ́n sì ń lọ, wọn kò tilẹ̀ ní àǹfààní[b] láti jẹun.
  to: Ó sì wí fún wọn pé, “Ẹ wá, ẹ̀yin nìkan, lọ sí ibi àdádó[a], kí ẹ sì sinmi díẹ̀.” Nítorí ọ̀pọ̀ ènìyàn ni ń bọ̀ tí wọ́n sì ń lọ, àwọn ọmọ-ẹ̀yìn náà kò tilẹ̀ ní àǹfààní[b] láti jẹun.
  rationale: Àtúnṣe náà ṣàlàyé ẹni tí kò ní ààyè láti jẹun, kí ìtumọ̀ má bàa yí sí àwọn ènìyàn tó ń bọ̀ tí wọ́n sì ń lọ. Ó tún fi ìṣípo tó wà nínú ìpè náà hàn ní kedere. A pa ààmì-ẹsẹ̀ mọ́ sí ibi tí ó yẹ, a sì tún ọ̀rọ̀ àlàyé [b] ṣe kí ó bá olùtọ́kasí tí a ti sọ di kedere mu.
