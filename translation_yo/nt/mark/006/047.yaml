id: MRK.6.47
reference: Mark 6:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: yo
  text: Nígbà tí ó sì di ìrọ̀lẹ́, ọkọ̀ náà wà ní àárín òkun, òun nìkan sì wà lórí ilẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “létí bèbè.” Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “lórí ilẹ̀,” ó sì fi ibi tí ó wà ṣe ìyàtọ̀ sí ibi tí ọkọ̀ náà wà ní òkun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Nígbà tí ó sì di ìrọ̀lẹ́
  rationale: Gbólóhùn olóhun-ìní yìí ń tọ́ka sí àkókò. Èdè yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé ìrọ̀lẹ́ ti dé.
- source_word: πλοῖον
  choice: ọkọ̀
  rationale: Nínú àyíká Òkun Galili, “ọkọ̀” ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọkọ̀ ojú omi náà láìfi èrò ọkọ̀ ńlá kún un.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: ní àárín òkun
  rationale: Èyí pa ìtumọ̀ ibi tí ọkọ̀ náà wà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó ṣe kedere.
- source_word: θαλάσσης
  choice: òkun
  rationale: Bí ó tilẹ̀ jẹ́ pé Òkun Galili jẹ́ adágún nípa ẹ̀kọ́ ilẹ̀-ayé, ọ̀rọ̀ Gíríìkì ni “òkun”; ìtumọ̀ náà tẹ̀ lé ọ̀rọ̀ orísun.
- source_word: αὐτὸς μόνος
  choice: òun nìkan
  rationale: Àkópọ̀ arọ́pò-orúkọ náà àti μόνος tẹnu mọ́ pé Jésù dá wà; “òun nìkan” mú ìtẹnumọ́ yẹn jáde lọ́nà àdánidá.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín ọkọ̀ ní òkun àti Jésù lórí ilẹ̀ mọ́, láìyí ọ̀rọ̀ orísun sí ìtumọ̀ tó túbọ̀ pàtó.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àpéjọ, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtẹ̀síwájú ìtàn tí καί ń fi hàn ni “sì” mú jáde.
