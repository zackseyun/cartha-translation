revisions:
- from: Lẹ́sẹ̀kẹsẹ̀, ó fi dandan mú àwọn ọmọ-ẹ̀yìn rẹ̀ láti wọ inú ọkọ̀ ojú omi, kí wọn sì ṣáájú rẹ̀ lọ sí òdìkejì, síhà Bẹtisáídà,[a] títí tí òun fúnra rẹ̀ fi tú ogunlọ́gọ̀ náà ká.[b]
  to: Lẹ́sẹ̀kẹsẹ̀, ó fi dandan mú àwọn ọmọ-ẹ̀yìn rẹ̀ wọ inú ọkọ̀ ojú omi, kí wọn sì ṣáájú rẹ̀ lọ sí ìhà kejì, síhà Bẹtisáídà,[a] títí tí òun fúnra rẹ̀ fi tú ogunlọ́gọ̀ náà ká.[b]
  rationale: Àtúnṣe náà jẹ́ ti ọ̀nà ìsọ̀rọ̀ àti ìmọ́lẹ̀ díẹ̀ nìkan. Ó mú ‘ìhà kejì’ hàn kedere, ó mú ìṣètò ìfẹ̀sùn dandan náà jẹ́ Yorùbá àdánidá síi, ó sì mú àlàyé ìsàlẹ̀ b bá ìtumọ̀ tí a tẹ̀ mu. Kò yí ìtumọ̀, ìdarí sí Bẹtisáídà, tàbí ìtẹnumọ́ orísun padà.
  reviewer_model: gpt-5.6-terra
