  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn èrò pàtàkì Gíríìkì mọ́: ìyára (εὐθύς), dandan/agbara (ἠνάγκασεν), lílọ ṣáájú Jésù, ìhà kejì, ìdarí síhà Bẹtisáídà, àti ìtẹnumọ́ pé òun fúnra rẹ̀ ló rán ogunlọ́gọ̀ náà lọ. Síbẹ̀, “sí òdìkejì” kò sọ ‘ìhà’ tàbí ‘apá kejì’ di mímọ́ tó; “sí ìhà kejì” bá εἰς τὸ πέραν àti àyíká adágún mu dáadáa.'
