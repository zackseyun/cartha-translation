  terminology: “Àwọn ọmọ-ẹ̀yìn,” “ọkọ̀ ojú omi,” “ìhà kejì,” “ogunlọ́gọ̀,” àti “Bẹtisáídà” yẹ fún ìforúkọsílẹ̀ ìtàn náà. A pa “síhà Bẹtisáídà” mọ́ nítorí ó ń fi ìdarí πρός hàn, kì í sì fipá sọ pé ibẹ̀ gan-an ni ibi ìdúró.
