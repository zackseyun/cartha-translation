  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó fi dandan mú àwọn ọmọ-ẹ̀yìn rẹ̀ wọ inú ọkọ̀ ojú omi, kí wọn sì ṣáájú rẹ̀ lọ sí ìhà kejì, síhà Bẹtisáídà,[a] títí tí òun fúnra rẹ̀ fi tú ogunlọ́gọ̀ náà ká.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “sí Bẹtisáídà.” Ọ̀rọ̀ ìtọ́sọ́nà Gíríìkì náà lè fi ìdarí sí ibì kan hàn tàbí lè tọ́ka sí ibẹ̀ gẹ́gẹ́ bí ibi tí a ń lọ.
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, ọ̀rọ̀ ìṣe náà wà ní àkókò ìsinsìnyí: “títí tí ó fi tú ogunlọ́gọ̀ náà ká.” Nínú irú gbólóhùn àkókò nínú ìtàn yìí, Yorùbá lè sọ ọ́ gẹ́gẹ́ bí ìṣe tí ó parí.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìtàn tí Máàkù sábà máa ń fi εὐθύς hàn pamọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἠνάγκασεν
  choice: ó fi dandan mú
  rationale: Àpólà yìí fi agbára tàbí dandan tí ἀναγκάζω ní hàn láìsọ pé a lo ipá ara.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún ẹni tí ń kọ́ lábẹ́ olùkọ́ tí ó sì ń tọ̀ ọ́ lẹ́yìn.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: láti wọ inú ọkọ̀ ojú omi
  rationale: Ó sọ ìṣe wíwọ inú ọkọ̀ náà ní Yorùbá àdánidá, kedere.
- source_word: προάγειν
  choice: kí wọn sì ṣáájú rẹ̀ lọ
  rationale: Ó pa èrò pé àwọn ọmọ-ẹ̀yìn yóò lọ síwájú Jésù mọ́; fífi ‘rẹ̀’ kún un mú ìbátan tó wà nínú ọ̀rọ̀ náà ṣe kedere.
- source_word: εἰς τὸ πέραν
  choice: sí òdìkejì
  rationale: Nínú àyíká adágún, àpólà náà tọ́ka sí ìhà kejì omi.
- source_word: πρὸς Βηθσαϊδάν
  choice: síhà Bẹtisáídà
  rationale: ‘Síhà’ pa ìtumọ̀ ìdarí πρός mọ́, láìfipá pinnu pé ìlú náà gan-an ni ibi tí wọn yóò dé.
- source_word: ἕως
  choice: títí tí
  rationale: Ó pa ààlà àkókò tí ἕως fi hàn mọ́.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn pé Jésù fúnra rẹ̀ ló dúró láti bójú tó ogunlọ́gọ̀.
- source_word: ἀπολύει τὸν ὄχλον
  choice: fi tú ogunlọ́gọ̀ náà ká
  rationale: ‘Tú … ká’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó rán àwọn ènìyàn tí ó péjọ lọ; ‘ogunlọ́gọ̀’ bá ọ̀pọ̀ ènìyàn mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ọ̀nà tó bójú mu, tó sì yé òǹkàwé òde òní. Gbólóhùn náà pa ìyára ìtàn Máàkù, agbára àṣẹ Jésù, ìtẹnumọ́ ‘òun fúnra rẹ̀,’ àti àìdájú díẹ̀ tó wà nínú πρὸς Bẹtisáídà mọ́.
