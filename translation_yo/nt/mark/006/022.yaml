id: MRK.6.22
reference: Mark 6:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: yo
  text: Nígbà tí ọmọbìnrin Hẹ́rọ́díà[a] wọlé, tí ó sì jó, tí ó sì mú inú Hẹ́rọ́dù àti àwọn tí wọ́n jókòó ní tábìlì pẹ̀lú rẹ̀[b] dùn, ọba sọ fún ọmọbìnrin náà pé, “Béèrè lọ́wọ́ mi ohunkóhun tí o bá fẹ́, èmi yóò sì fi fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ tàbí àṣà kan lóye ọ̀rọ̀ náà sí “ọmọbìnrin rẹ̀, Hẹ́rọ́díà,” dípò “ọmọbìnrin Hẹ́rọ́díà.” Ọ̀rọ̀ Gíríìkì tí a tẹ̀ lé níbí kà á sí “ọmọbìnrin Hẹ́rọ́díà.”
    reason: textual_variant
  - marker: b
    text: Tàbí “àwọn tí wọ́n ń jẹun pẹ̀lú rẹ̀.” Ọ̀rọ̀ Gíríìkì ń tọ́ka sí àwọn àlejò àsè tí wọ́n rọ̀gbọ̀kú ní tábìlì pẹ̀lú rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: Nígbà tí ... wọlé
  rationale: A tú participle aorist inú genitive absolute náà sí gbólóhùn àkókò tí ó bá Yorùbá mu, láì pàdánù ìtumọ̀ wíwọlé sí ibi àsè náà.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ọmọbìnrin Herodia
  rationale: Ìṣọ̀kan genitive yìí dára jù lọ gẹ́gẹ́ bí ọmọbìnrin tí Herodia bí; a pa àṣàyàn ọ̀rọ̀ inú ẹ̀dà mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ὀρχησαμένης
  choice: tí ó sì jó
  rationale: Ọ̀rọ̀ yìí túmọ̀ tààrà sí jíjó, a sì lo ìṣètò ọ̀rọ̀ àdánidá Yorùbá fún ìtẹ̀síwájú àwọn ìṣe náà.
- source_word: ἀρεσάσης
  choice: tí ó sì mú inú ... dùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan tẹ́ àwọn míì lọ́rùn, láì fi ìmọ̀lára tó lágbára ju ti Gíríìkì lọ kún un.
- source_word: τοῖς συνανακειμένοις
  choice: àwọn tí wọ́n jókòó síbi tábìlì pẹ̀lú rẹ̀
  rationale: Ó tọ́ka sí àwọn alábàájẹun tí wọ́n jókòó tàbí rọ̀gbọ̀kú níbi àsè. Yorùbá yìí jẹ́ kíkà-rọrùn, àlàyé ìsàlẹ̀ sì ṣàlàyé àṣà ìrọ̀gbọ̀kú ní tábìlì.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: ọba sọ
  rationale: A pa βασιλεύς mọ́ gẹ́gẹ́ bí “ọba,” bí Máàkù ṣe pè é, dípò fífi oyè ìtàn míì rọ́pò rẹ̀.
- source_word: τῷ κορασίῳ
  choice: fún ọmọbìnrin náà
  rationale: “Ọmọbìnrin” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó mọ́gbọ́n dání fún κοράσιον; “náà” ń tọ́ka padà sí ẹni tí a ti dárúkọ.
- source_word: Αἴτησόν με
  choice: Béèrè lọ́wọ́ mi
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún fífi ẹ̀bẹ̀ tàbí ìbéèrè kan hàn.
- source_word: ὃ ἐὰν θέλῃς
  choice: ohunkóhun tí o bá fẹ́
  rationale: Ó pa àṣàyàn tí kò ní ààlà inú indefinite relative construction náà mọ́ ní Yorùbá àdánidá.
- source_word: δώσω σοι
  choice: èmi yóò sì fi fún ọ
  rationale: “Fi” ní ohun tí a mẹ́nuba ṣáájú gẹ́gẹ́ bí ohun tí a óò fún un; fífi “èmi” hàn bá ìlérí ta-kókó náà mu.
theological_decisions:
- issue: Bí a ṣe tú βασιλεύς tí a lò fún Herodu Antipa
  choice: ọba
  alternative: alákòóso; Herodu tetraki
  rationale: Máàkù lo ọ̀rọ̀ “ọba”; ìtumọ̀ náà tẹ̀ lé ọ̀rọ̀ orísun, kò sì fi oyè ìtàn tí ó jẹ́ àtúnṣe sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo “jókòó síbi tábìlì” nínú ẹsẹ̀ kí ó lè ṣàn dáadáa, a sì fi àṣà ìrọ̀gbọ̀kú hàn nínú àlàyé ìsàlẹ̀.
