  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Búrẹ́dì mélòó ni ẹ ní? Ẹ lọ wò.” Nígbà tí wọ́n ti mọ̀, wọ́n sọ pé, “Márùn-ún, àti ẹja méjì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: ìṣù búrẹ́dì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ìṣù oúnjẹ tí a fi ìyẹ̀fun ṣe; ‘ìṣù búrẹ́dì’ jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere, ó sì pa àwòrán ohun tí a lè kà mọ́.
- source_word: ὑπάγετε ἴδετε
  choice: Ẹ lọ wò ó
  rationale: 'Ó ṣàfihàn àwọn ọ̀rọ̀ àṣẹ méjèèjì ní ọ̀nà Yorùbá àdánidá: kí wọ́n lọ, kí wọ́n sì ṣàyẹ̀wò.'
- source_word: γνόντες
  choice: Nígbà tí wọ́n sì ti mọ iye wọn
  rationale: Participulu náà túmọ̀ sí pé wọ́n ti wádìí, wọ́n sì ti mọ ìdáhùn; fífi ‘iye wọn’ kún un mú ohun tí wọ́n mọ̀ ṣe kedere láì yí ìtumọ̀ padà.
- source_word: ἰχθύας
  choice: ẹja
  rationale: ‘Ẹja’ ni ọ̀rọ̀ Yorùbá gbogbogbòò àti àdánidá fún fish; nọ́ńbà ‘méjì’ ti fi hàn pé ó ju ọ̀kan lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A lo ọ̀rọ̀-orúkọ ẹlẹ́ni-kẹta ‘ó’ gẹ́gẹ́ bí ti orísun, láì fi ‘Jésù’ kún un. Àwọn ọ̀rọ̀ ìṣe àkókò ìsinsìnyí tí ó wà nínú Gíríìkì ìtàn ni a tú sí àkókò tí ó ti kọjá ní Yorùbá, nítorí pé bẹ́ẹ̀ ni ìtàn náà ṣe máa ń dun lọ́nà àdánidá.
