  verdict: revise
  source_fidelity: 'Ìṣù búrẹ́dì does not faithfully render ἄρτους: ìṣù ordinarily denotes yam/tuber rather than a loaf of bread. The remaining clauses correctly convey Jesus’ question, the paired imperatives, the disciples’ discovery, and the quantities.'
  naturalness: Búrẹ́dì mélòó ni ẹ ní? Ẹ lọ wò is natural, clear Standard Yoruba. Removing the unnecessary object pronoun after wò avoids implying a particular object not specified in Greek.
  terminology: Use búrẹ́dì for ἄρτους. Ẹja is the normal general term for fish, and the expressions márùn-ún and méjì are appropriate.
  issues:
  - severity: high
    issue: ‘Ìṣù búrẹ́dì’ for ἄρτους
    rationale: Ìṣù normally means yam or tuber in Yoruba. It introduces an incorrect food category; ἄρτους here means loaves/bread.
  - severity: low
    issue: ‘wò ó’ supplies a specific object
    rationale: The Greek simply commands ‘go, see’; Yoruba can naturally retain this openness with ‘Ẹ lọ wò.’
