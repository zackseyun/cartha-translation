id: MRK.6.3
reference: Mark 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: yo
  text: “Ṣé èyí kì í ṣe gbẹ́nàgbẹ́nà náà, ọmọ Màríà, àti arákùnrin Jákọ́bù, Jósẹ́sì, Júdásì àti Símónì[a]? Àwọn arábìnrin rẹ̀ náà kò ha wà níhìn-ín pẹ̀lú wa?” Wọ́n sì rí i gẹ́gẹ́ bí ohun ìkọsẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ọ̀rọ̀ Gíríìkì fún “arákùnrin” àti “arábìnrin” sábà máa ń túmọ̀ sí arákùnrin àti arábìnrin ní ìtumọ̀ ojoojúmọ́. Síbẹ̀, àwọn kan lóye wọn níbí gẹ́gẹ́ bí ìbátan tímọ́tímọ́, tàbí gẹ́gẹ́ bí àwọn ọmọ Jòsépù látinú ìgbéyàwó ìṣáájú.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Wọ́n sì bínú sí i” tàbí “Wọ́n sì kọ̀ ọ́.” Ní ìtumọ̀ gangan, wọ́n rí i gẹ́gẹ́ bí ohun ìkọsẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: gbẹ́nàgbẹ́nà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí oníṣẹ́ ọwọ́ tàbí akọ́lé ní gbòòrò, ṣùgbọ́n ‘gbẹ́nàgbẹ́nà’ ni ìtumọ̀ àṣà tí ó ṣeé yé jù lọ ní àyíká yìí.
- source_word: υἱὸς τῆς Μαρίας
  choice: ọmọ Màríà
  rationale: Èyí pa ìdánimọ̀ rẹ̀ nípasẹ̀ ìyá rẹ̀ mọ́, láìfi ìtumọ̀ àfikún sí ohun tí àwọn ará ìlú sọ.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: arákùnrin / arábìnrin
  rationale: Ìwọ̀nyí ni ìtumọ̀ ojoojúmọ́ àwọn ọ̀rọ̀ Gíríìkì náà; àlàyé ìsàlẹ̀ ṣí ààyè sí ìtumọ̀ ìbátan tí ó gbòòrò tàbí ọmọ òbí kan ṣoṣo.
- source_word: Ἰωσῆτος
  choice: Jósẹ́sì
  rationale: A ṣe àkọsílẹ̀ fọ́ọ̀mù orúkọ Gíríìkì tí ó wà níbí, dípò kí a sọ ọ́ di Jósẹ́fù.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: níhìn-ín pẹ̀lú wa
  rationale: Gbólóhùn yìí sọ pé wọ́n wà ní agbègbè kan náà pẹ̀lú àwọn olùsọ̀rọ̀, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: wọ́n kọsẹ̀ lára rẹ̀
  rationale: Àpẹẹrẹ ‘kọsẹ̀’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n ní àyíká yìí ó túmọ̀ sí pé ẹni tí ó jẹ́ àti ohun tí ó sọ di ohun ìdènà fún wọn, tí wọ́n sì kọ̀ ọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘arákùnrin’ àti ‘arábìnrin’ nípa ìdílé Jésù
  choice: A lo àwọn ọ̀rọ̀ ìbátan ojoojúmọ́ ‘arákùnrin’ àti ‘arábìnrin’ nínú ẹsẹ̀ náà, láìpinnu irú ìbátan pàtó.
  alternative: Wọ́n lè jẹ́ ìbátan tímọ́tímọ́ ní gbòòrò tàbí ọmọ òbí kan ṣoṣo pẹ̀lú rẹ̀.
  rationale: Gíríìkì sábà máa ń túmọ̀ sí arákùnrin àti arábìnrin, ṣùgbọ́n ẹsẹ̀ náà fúnra rẹ̀ kò yanju àríyànjiyàn ìtàn ẹ̀kọ́ ìgbàgbọ́ nípa ìbátan wọn.
- issue: Agbára àwùjọ inú ‘ọmọ Màríà’
  choice: A túmọ̀ ọ́ tààrà gẹ́gẹ́ bí ìdánimọ̀ àwọn ará ìlú.
  alternative: Ó lè jẹ́ ìdánimọ̀ lásán tàbí ọ̀rọ̀ tí ó ní ìrẹ̀gàn nínú.
  rationale: Ọ̀rọ̀ náà lè ní ẹ̀gàn ní àyíká rẹ̀, ṣùgbọ́n orísun kò ṣàlàyé èyí ní tààrà; a kò fi ìtumọ̀ náà kún ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tí ó ṣeé yé fún òǹkàwé òde òní. Ìbéèrè ‘Ṣé … kì í ṣe’ àti ‘kò ha’ pa ìró ìbéèrè àwọn ará ìlú mọ́; orúkọ àti àmì ohùn ni a kọ ní kíkún níbi tí ó bá yẹ.
