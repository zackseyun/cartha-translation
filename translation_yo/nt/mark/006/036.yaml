  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: yo
  text: Rán wọn lọ[a], kí wọn lè lọ sí àwọn ilẹ̀ oko àti àwọn abúlé tó wà ní àyíká, kí wọn sì ra oúnjẹ fún ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jẹ́ kí wọn lọ, kí wọn lè lọ sí àwọn ilẹ̀ oko àti àwọn abúlé tó wà ní àyíká, kí wọn sì ra oúnjẹ fún ara wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Rán wọn lọ
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí pé kí a jẹ́ kí ogunlọ́gọ̀ náà kúrò níbẹ̀. “Rán wọn lọ” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: ἵνα
  choice: kí wọn lè
  rationale: Ó ṣàfihàn ète ohun tí a pàṣẹ; “kí wọn lè” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìtumọ̀ yìí.
- source_word: ἀπελθόντες
  choice: lọ sí
  rationale: Bí ó tilẹ̀ jẹ́ pé participle aorist ni ọ̀rọ̀ Gíríìkì náà, fífi rẹ̀ sínú gbólóhùn ète gẹ́gẹ́ bí “lọ sí” mú kí ìtẹ̀lé ìṣe náà ṣe kedere láìsọ èdè di líle.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: àwọn ìgbèríko àti abúlé tó wà ní àyíká
  rationale: “Ìgbèríko” lè gba ìtumọ̀ àwọn ilẹ̀ oko tàbí agbègbè ìta ìlú, “abúlé” sì bá κώμας mu; “tó wà ní àyíká” pa ìtumọ̀ κύκλῳ mọ́.
- source_word: ἀγοράσωσιν
  choice: ra
  rationale: “Ra” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ríra nǹkan pẹ̀lú owó.
- source_word: ἑαυτοῖς
  choice: fún ara wọn
  rationale: Ó pa ìtumọ̀ reflexive dative mọ́, pé àwọn fúnra wọn ni yóò jèrè ohun tí wọ́n rà.
- source_word: τί φάγωσιν
  choice: ohun tí wọn yóò jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun jíjẹ láìfi ìtumọ̀ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. A yan “ìgbèríko” láti bo ìtumọ̀ gbooro ti ἀγροί, nígbà tí àlàyé ìsàlẹ̀ fi “àwọn ilẹ̀ oko” hàn gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ìrísí ọ̀rọ̀ Gíríìkì.
