language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: yo
  text: Nígbà tí ó rí wọn tí wọ́n ń ṣe làálàá ní wíwa ọkọ̀[d], nítorí afẹ́fẹ́ ń dojú kọ wọ́n, ní nǹkan bí ìṣọ́ kẹrin òru[a], ó wá sí ọ̀dọ̀ wọn, ó ń rìn lórí òkun[b]; ó sì fẹ́ kọjá wọn lọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìṣọ́ kẹrin òru” ni apá òru tó kẹ́yìn, láti nǹkan bí aago mẹ́ta òru títí di aago mẹ́fà òwúrọ̀, gẹ́gẹ́ bí ìṣírò àkókò àwọn ará Róòmù.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ó ń rìn lórí omi.” Ọ̀rọ̀ Gíríìkì sọ pé “lórí òkun.”
    reason: lexical_alternative
  - marker: c
    text: “Ó fẹ́ kọjá wọn lọ” lè túmọ̀ sí pé ó fẹ́ lọ kọjá wọn lásán; ṣùgbọ́n ó tún lè mú àwọn ìṣẹ̀lẹ̀ Májẹ̀mú Láéláé wá sí ìrántí, níbi tí Ọlọ́run ti “kọjá” nígbà tí ó ń fi ara rẹ̀ hàn (fún àpẹẹrẹ, Ẹ́kísódù 33:19, 22; 34:6; 1 Àwọn Ọba 19:11).
    reason: alternative_reading
  - marker: d
    text: Tàbí, “wọ́n ń jìyà gidigidi nígbà tí wọ́n ń wa ọkọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí ó rí
  rationale: Aorist participle náà so rírí wọn mọ́ ohun tí ó tẹ̀ lé e ní ti àkókò, láìfi ìtẹ̀síwájú tí Gíríìkì kò sọ kún un.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: wọ́n ń ṣe làálàá ní wíwa ọkọ̀
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìpọ́njú líle tí wọ́n ń jẹ nígbà tí wọ́n ń wa ọkọ̀; ó pa agbára βασανιζομένους mọ́ ju ọ̀rọ̀ tí yóò kàn túmọ̀ sí pé wọ́n ń tiraka lọ.
- source_word: ἐναντίος αὐτοῖς
  choice: ń dojú kọ wọ́n
  rationale: Nípa afẹ́fẹ́, ‘dojú kọ’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé afẹ́fẹ́ ń fẹ́ ní ìhà òdì sí wọn.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: ní nǹkan bí ìṣọ́ kẹrin òru
  rationale: Ó pa ètò pípín òru ìgbàanì mọ́, ‘ní nǹkan bí’ sì ṣàfihàn περὶ.
- source_word: ἔρχεται πρὸς αὐτούς
  choice: ó wá sí ọ̀dọ̀ wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo present tense ìtàn, ìtumọ̀ yìí jẹ́ ọ̀nà àdánidá àti aláyè gbígbé ní ìtàn Yorùbá.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: ó ń rìn lórí òkun
  rationale: ‘Òkun’ túmọ̀ θάλασσα ní tààrà, ‘lórí’ sì bá ἐπί mu ní àyíká yìí.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: ó fẹ́ kọjá wọn lọ
  rationale: ‘Fẹ́’ lè sọ ète tàbí ìfẹ́ inú ní Yorùbá, gẹ́gẹ́ bí θέλω; gbólóhùn náà sì pa àìdánilójú náà mọ́ bóyá ó kàn fẹ́ kọjá wọn tàbí bóyá àwòrán ìfarahàn Ọlọ́run wà níbẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘ó fẹ́ kọjá wọn lọ’
  choice: A fi gbólóhùn náà sílẹ̀ ní ọ̀nà tí ó sún mọ́ Gíríìkì, láìṣàlàyé rẹ̀ nínú ẹsẹ̀.
  alternative: Ó ní lọ kọjá wọn ní ti ìrìn-àjò lásán; tàbí ó fẹ́ fi ara rẹ̀ hàn bí Ọlọ́run ṣe ‘kọjá’ nínú àwọn ìtàn Májẹ̀mú Láéláé.
  rationale: Gíríìkì kò ṣàlàyé ète náà ní tààrà. Nítorí náà, a pa ìforígbárí ìtumọ̀ náà mọ́, a sì fi àlàyé sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, èdè òde òní tí ó ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
