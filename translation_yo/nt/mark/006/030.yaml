  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: yo
  text: Àwọn aposteli sì kóra jọ sọ́dọ̀ Jesu, wọ́n sì ròyìn fún un gbogbo ohun tí wọ́n ti ṣe àti gbogbo ohun tí wọ́n ti kọ́ni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: kóra jọ
  rationale: Ó mú ìtumọ̀ pé ẹgbẹ́ náà tún péjọ pọ̀ jáde ní Yorùbá àdánidá; a lo àkókò tí ó ti kọjá fún historical present inú ìtàn.
- source_word: ἀπόστολοι
  choice: àwọn aposteli
  rationale: Ọ̀rọ̀ yìí jẹ́ orúkọ ipa fún àwọn tí Jesu rán jáde, kì í ṣe ‘àwọn ońṣẹ́’ lásán.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: sọ́dọ̀ Jesu
  rationale: Ó fi ìlọ sí ọ̀dọ̀ ènìyàn hàn ní Yorùbá tó wọ́pọ̀, gẹ́gẹ́ bí πρός pẹ̀lú accusative ṣe túmọ̀ sí níbí.
- source_word: ἀπήγγειλαν
  choice: ròyìn fún un
  rationale: Ó bá àyíká ìpadà láti iṣẹ́ tí wọ́n lọ ṣe mu, ó sì ju ‘sọ fún un’ lọ ní pàtó nínú fífi èsì iṣẹ́ hàn.
- source_word: πάντα ὅσα ἐποίησαν
  choice: gbogbo ohun tí wọ́n ti ṣe
  rationale: Ó pa agbára àkópọ̀ πάντα ὅσα mọ́, ó sì fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀ ṣáájú ìròyìn wọn.
- source_word: ὅσα ἐδίδαξαν
  choice: gbogbo ohun tí wọ́n ti kọ́ni
  rationale: Ó pa ìṣe ìkọ́ni mọ́, ó sì tún ọ̀rọ̀ ‘gbogbo ohun’ sọ láti fi ìṣọ̀kan àwọn gbólóhùn méjèèjì hàn.
theological_decisions:
- issue: Ìdánimọ̀ àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ἀπόστολοι
  choice: àwọn aposteli
  alternative: àwọn tí a rán / àwọn ońṣẹ́
  rationale: Ní àyíká yìí, ἀπόστολοι jẹ́ ìdánimọ̀ ipa àwọn Méjìlá tí a rán lọ; ‘aposteli’ pa ìdánimọ̀ yẹn mọ́ láì sọ ọ́ di ońṣẹ́ lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. ‘Sọ́dọ̀ Jesu’ jẹ́ àdánidá ju ìtumọ̀ líle ‘sí Jesu’ lọ; àtúnwí ‘gbogbo ohun’ ń pa ìfarajọ àwọn relative clauses Gíríìkì mọ́.
