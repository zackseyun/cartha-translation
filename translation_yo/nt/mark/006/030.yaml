  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: “Àwọn aposteli” ń ṣètọ́ka sí οἱ ἀπόστολοι; “kóra jọ sọ́dọ̀ Jesu” ń gbé ìlọ/pípadà sí ọ̀dọ̀ Jesu jáde; “ròyìn fún un” bá ἀπήγγειλαν mu; àwọn gbólóhùn méjèèjì “gbogbo ohun tí wọ́n ti ṣe” àti “gbogbo ohun tí wọ́n ti kọ́ni” sì pa àkópọ̀ πάντα ὅσα àti ìfarajọ ὅσα ... καὶ ὅσα ... mọ́. “Ti” jẹ́ ọ̀nà Yorùbá tó yẹ láti tọ́ka sí iṣẹ́ tí ó ṣáájú ìròyìn wọn.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tó mọ́gbọ́n dání. “Kóra jọ,” “sọ́dọ̀,” àti “ròyìn fún un” jẹ́ àṣàyàn àdánidá, tó sì ní ìwọ̀n ìtàn ọlọ́lá tó yẹ. Àtúnwí “gbogbo ohun” jẹ́ mímọ́, kò sì dùn bí àtúnwí àìnílò.
  terminology: “Aposteli” jẹ́ ọ̀rọ̀ tí a ti mọ̀ nínú ìforúkọsílẹ̀ Kristẹni Yorùbá, ó sì dá ipa ἀπόστολοι dúró láì dín un kù sí “ońṣẹ́” lásán. “Jesu” àti “kọ́ni” tún jẹ́ ìlò tí ó wọ́pọ̀, tí ó sì bá àkọsílẹ̀ mímọ́ mu.
