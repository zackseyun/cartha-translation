  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ náà dáadáa: ìyára ìrìn wọn ká agbègbè náà, ìbẹ̀rẹ̀ gbígbé àwọn aláìsàn, àkéte, àti ibi tí wọ́n ti gbọ́ pé ó wà. Síbẹ̀, “sáré ká” nílò àfikún “yí” kí ìkáàkiri tí περιέδραμον túbọ̀ ṣe kedere nínú Yorùbá.'
