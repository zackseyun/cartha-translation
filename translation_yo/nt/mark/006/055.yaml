base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: yo
  text: Wọ́n sáré yí ká gbogbo agbègbè náà, wọ́n sì bẹ̀rẹ̀ sí í gbé àwọn aláìsàn lórí àkéte[a] lọ sí ibikíbi tí wọ́n gbọ́ pé ó wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lórí ibùsùn tí a lè gbé” tàbí “lórí ibùsùn kékeré”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àkéte tàbí ibùsùn rọrùn tí a lè gbé kiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: wọ́n sáré ká
  rationale: Ọ̀rọ̀-ìṣe náà fi ìyára hàn, ó sì túmọ̀ sí yí ká gbogbo agbègbè kan; “sáré ká” pa àwọn ìtumọ̀ méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: gbogbo agbègbè náà
  rationale: χώρα níbí ń tọ́ka sí ìlú àti ilẹ̀ tó yí ibi náà ká, kì í ṣe orílẹ̀-èdè ní ìtumọ̀ òde òní; “gbogbo agbègbè náà” tún pa ìtẹnumọ́ ὅλην mọ́.
- source_word: ἤρξαντο ... περιφέρειν
  choice: wọ́n sì bẹ̀rẹ̀ sí í gbé ... lọ
  rationale: “Bẹ̀rẹ̀ sí í” fi ìbẹ̀rẹ̀ ìṣe tí ἤρξαντο ń tọ́ka sí hàn, “gbé ... lọ” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń ru àwọn aláìsàn láti ibì kan dé ibòmíràn.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: lórí àkéte
  rationale: κράβαττος jẹ́ ohun ìtẹ́lẹ̀ tàbí ibùsùn ríru tó rọrùn láti gbé; “àkéte” ṣe kedere fún òǹkàwé Yorùbá, àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: τοὺς κακῶς ἔχοντας
  choice: àwọn aláìsàn
  rationale: Gbólóhùn Gíríìkì yìí jẹ́ àṣà ọ̀rọ̀ fún àwọn tí ara wọn kò yá; “àwọn aláìsàn” jẹ́ kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: sí ibikíbi tí wọ́n bá gbọ́ pé ó wà
  rationale: “Ibikíbi” pa ìtumọ̀ ibi tí ὅπου ní nínú àyíká ọ̀rọ̀ mọ́, gbólóhùn náà sì fi hàn pé wọ́n gbé àwọn aláìsàn lọ sí ibi èyíkéyìí tí ìròyìn bá sọ pé Jésù wà.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ, ó sì jẹ́ ti òde òní, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye. A lo “sáré ká” láti pa ìyára àti ìkáàkiri mọ́, a sì gbé àmì àlàyé sí “àkéte,” ibi tí àlàyé ọ̀rọ̀ náà ti bá mu.
