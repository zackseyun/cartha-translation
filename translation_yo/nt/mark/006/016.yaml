source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Hẹ́rọ́dù gbọ́ ọ̀rọ̀ náà, ó sọ pé,[a] “Jòhánù, ẹni tí mo gé orí rẹ̀—òun yìí ni a ti jí dìde.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń sọ pé,” tàbí “ó máa ń sọ pé”; ọ̀rọ̀-ìṣe Gíríìkì lè tọ́ka sí ọ̀rọ̀ tó ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “a jí i dìde,” tàbí “ó ti jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní fọ́ọ̀mù àìṣe: “a ti jí i dìde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ... gbọ́ ọ̀rọ̀ náà
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé ohun tí Hẹ́rọ́dù gbọ́ ló mú un sọ ọ̀rọ̀ tó tẹ̀ lé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń tọ́ka sí ìyípadà díẹ̀ nínú ìtàn sí ohun tí Hẹ́rọ́dù ṣe; “Ṣùgbọ́n” mú ìyàtọ̀ náà jáde láìfún un ní agbára tó pọ̀ jù.
- source_word: ἔλεγεν
  choice: ó sọ pé
  rationale: Imperfect náà lè túmọ̀ sí pé ó ń sọ ọ́ tàbí pé ó máa ń sọ ọ́ léraléra, ṣùgbọ́n “ó sọ pé” jẹ́ ọ̀nà ìtàn tó ṣe déédéé ní Yorùbá; àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Jòhánù, ẹni tí mo bẹ́ lórí
  rationale: Èyí tún ìṣètò ọ̀rọ̀ Gíríìkì ṣe sí Yorùbá tó ṣe kedere, nígbà tó ṣì pa ìtẹnumọ́ ẹni tí Hẹ́rọ́dù fúnra rẹ̀ pa mọ́.
- source_word: ἀπεκεφάλισα
  choice: bẹ́ lórí
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí yíyọ orí ẹni kúrò; “bẹ́ lórí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì bá àyíká ikú mu.
- source_word: οὗτος
  choice: òun yìí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ní ìtẹnumọ́; “òun yìí” pa agbára náà mọ́ ju “òun” nìkan lọ.
- source_word: ἠγέρθη
  choice: ni a ti jí dìde
  rationale: 'A pa fọ́ọ̀mù àìṣe ti Gíríìkì mọ́: ẹnì kan ni a jí dìde, dípò lílọ sí ọ̀rọ̀ aláṣe bí “ó dìde.” Àmì “ti” fi ipò tó ti wáyé hàn ní ti ara Yorùbá.'
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἠγέρθη nínú èdè àjíǹde
  choice: a ti jí dìde
  alternative: ó ti jí dìde; ó dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àìṣe, nítorí náà a pa èrò pé a jí Jòhánù dìde mọ́, láìsọ ẹni tó ṣe é tàbí láìfi ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀ tó yẹ fún ìtàn Ìwé Mímọ́. “Bẹ́ lórí” jẹ́ kedere fún ‘behead’; “òun yìí” pa ìtẹnumọ́ οὗτος mọ́ bó tilẹ̀ jẹ́ pé ó ní ìrísí ọ̀rọ̀ gíga díẹ̀.
