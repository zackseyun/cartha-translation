source:
  edition: SBLGNT
  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: yo
  text: Ṣùgbọ́n Herodíà di èébú mú un[a], ó sì fẹ́ pa á, ṣùgbọ́n kò lè ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ó ń di ìbínú mú un” tàbí “ó ń ní ìkórìíra sí i.” Ìdíọ̀mù Gíríìkì náà ń sọ nípa ìkórìíra tàbí ìbínú tó ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó wà láàárín ìṣe Herodíà àti ohun tí ẹsẹ tó ṣáájú sọ hàn.
- source_word: Ἡρῳδιὰς
  choice: Herodíà
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Gíríìkì náà ní Yorùbá.
- source_word: ἐνεῖχεν αὐτῷ
  choice: di èébú mú sí i
  rationale: Òwe Yorùbá yìí fi ìkórìíra àti ìbínú tí ẹni kan ń gbé lọ́kàn sí ẹlòmíràn hàn, ó sì bá ìṣe tí ń bá a lọ nínú ọ̀rọ̀ Gíríìkì mu.
- source_word: ἤθελεν
  choice: fẹ́
  rationale: Ó sọ ìfẹ́-ọkàn tàbí ète Herodíà ní ọ̀nà tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: pa á
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún pípa ènìyàn; lílo ọ̀rọ̀ tó túmọ̀ sí ìpànìyàn lọ́nà òfin yóò fi ìtumọ̀ tí kò ṣe kedere nínú Gíríìkì kún un.
- source_word: καὶ οὐκ ἠδύνατο
  choice: ṣùgbọ́n kò lè ṣe bẹ́ẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé καὶ sábà máa ń túmọ̀ sí “àti,” níbí ó fi ìdènà sí ohun tí Herodíà fẹ́ ṣe hàn; “ṣùgbọ́n” mú ìyàtọ̀ náà ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Di èébú mú sí i” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkórìíra tó pẹ́ hàn; àmì ohùn ni a fi síbi tó yẹ.
