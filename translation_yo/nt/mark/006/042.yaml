  text: Gbogbo wọn sì jẹ, wọ́n sì yó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: jẹ
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀rọ̀ lasan fún jíjẹ oúnjẹ. “Jẹ” ni Yorùbá àdánidá, kò sì fi àfikún ohun tí kò sí nínú orísun kún un.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Àpèjúwe ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí gbogbo àwọn ènìyàn inú ọ̀wọ́ náà. “Gbogbo wọn” pa ìtumọ̀ pé kò sí ẹni tí a yọ sílẹ̀ mọ́.
- source_word: ἐχορτάσθησαν
  choice: wọ́n sì yó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n jẹun débi pé ebi kò pa wọ́n mọ́. “Yó” jẹ́ ọ̀nà Yorùbá tó ṣeé lóye, tó sì bá jíjẹ oúnjẹ mu dáadáa.
- source_word: καὶ ... καὶ
  choice: sì ... sì ...
  rationale: Àtúnsọ καί so ìṣe méjèèjì pọ̀ ní ọ̀nà tààrà. “Sì” ní ibi méjèèjì pa ìṣàn ìtàn onírúurú gbólóhùn kúkúrú ti Máàkù mọ́.
theological_decisions: []
translation_notes:
