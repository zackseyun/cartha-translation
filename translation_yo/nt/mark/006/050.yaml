  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: πάντες γὰρ αὐτὸν εἶδον, ἐταράχθησαν, εὐθύς, ἐλάλησεν μετ’ αὐτῶν, àti àwọn àṣẹ mẹ́tẹ̀ẹ̀ta náà wà nínú rẹ̀. ‘Èmi ni’ dá àìmọ̀ye ìtumọ̀ ἐγώ εἰμι dúró bí ó ti wà nínú ọ̀rọ̀ ìpilẹ̀.'
  naturalness: A nílò àtúnṣe kékeré fún ìṣàn Yorùbá òde òní. ‘Gbogbo wọn rí i’ jẹ́ ọ̀nà tààrà àti àdánidá ju ìṣètò ìfọkànsí ‘gbogbo wọn ni ó rí i’ lọ níbí, níbi tí Gíríìkì kò ti fi ìfọkànsí pàtó sí ‘gbogbo wọn’. Bákan náà, ‘Ẹ mú ọkàn yín le’ jẹ́ ìpè àṣẹ tó péye àti tó wọ́pọ̀ ju fífi ‘yín’ sílẹ̀ lọ.
