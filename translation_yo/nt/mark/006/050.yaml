  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: yo
  text: Nítorí gbogbo wọn rí i, ẹ̀rù sì bà wọ́n. Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀, ó bá wọn sọ̀rọ̀, ó sì wí fún wọn pé, “Ẹ mú ọkàn yín le; èmi ni; ẹ má bẹ̀rù.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: ẹ̀rù sì bà wọ́n
  rationale: Ó fi ìdàrúdàpọ̀ àti ìpayà tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: Θαρσεῖτε
  choice: Ẹ mú ọkàn le
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; ó túmọ̀ sí kí wọ́n ní ìgboyà tàbí kí ọkàn wọn le.
- source_word: ἐγώ εἰμι
  choice: èmi ni
  rationale: Ìtumọ̀ yìí pa gbolohun Gíríìkì náà mọ́ ní ṣókí, láì fi ohun tí ọ̀rọ̀ náà kò sọ kún un; nínú àyíká yìí ó tún lè túmọ̀ sí ‘Èmi ni ẹni náà.’
- source_word: μὴ φοβεῖσθε
  choice: ẹ má bẹ̀rù
  rationale: Àṣẹ òdì fún ọ̀pọ̀ ènìyàn ni, a sì túmọ̀ rẹ̀ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἐγώ εἰμι
  choice: èmi ni
  alternative: Èmi ni ẹni náà
  rationale: A pa àìṣe kedere tó wà nínú ọ̀rọ̀ ìpilẹ̀ mọ́, nítorí gbolohun náà lè jẹ́ ìdánimọ̀ lasán, ó sì tún lè ru ìrántí èdè ìfihàn Ọlọ́run láìjẹ́ pé a fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lasán. A lo ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ’ ní gbogbo ọ̀rọ̀ tí Jésù sọ fún àwọn ọmọ-ẹ̀yìn.
