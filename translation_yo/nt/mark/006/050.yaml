revisions:
- from: Nítorí gbogbo wọn ni ó rí i, ẹ̀rù sì bà wọ́n. Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀, ó bá wọn sọ̀rọ̀, ó sì wí fún wọn pé, “Ẹ mú ọkàn le; èmi ni; ẹ má bẹ̀rù.”
  to: Nítorí gbogbo wọn rí i, ẹ̀rù sì bà wọ́n. Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀, ó bá wọn sọ̀rọ̀, ó sì wí fún wọn pé, “Ẹ mú ọkàn yín le; èmi ni; ẹ má bẹ̀rù.”
  rationale: A yọ ìṣètò ìfọkànsí tí kò ṣe pàtàkì kúrò nínú gbolohun àkọ́kọ́, a sì fi aṣojú-ìní ‘yín’ kún ìpè náà fún Yorùbá adayeba. A pa ‘èmi ni’ mọ́ kí ìtumọ̀ má bà a fi ìdánimọ̀ tàbí ìtumọ̀ ẹ̀kọ́ kan tí ọ̀rọ̀ ìpilẹ̀ kò sọ kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:51Z'
