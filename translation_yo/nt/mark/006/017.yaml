id: MRK.6.17
reference: Mark 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: yo
  text: Nítorí Hẹ́rọ́dù fúnra rẹ̀ ni ó ti ránṣẹ́ mú Jòhánù[a], ó sì dè é nínú ilé ẹ̀wọ̀n nítorí Hẹ́rọ́díà, aya Fílípì arákùnrin rẹ̀, nítorí pé Hẹ́rọ́dù ti fẹ́ ẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ṣókí, “ó ránṣẹ́, ó sì mú Jòhánù.” Ọ̀rọ̀ Gíríìkì fi hàn pé Hẹ́rọ́dù ló dá iṣẹ́ náà sílẹ̀ nípa ríranṣẹ́, bí ó tilẹ̀ jẹ́ pé kò sọ àwọn aṣojú náà ní tààràtà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Nítorí Hẹ́rọ́dù fúnra rẹ̀ ni
  rationale: “Nítorí” so ẹsẹ̀ náà mọ́ àlàyé tó ṣáájú, “fúnra rẹ̀ ni” sì pa ìtẹnumọ́ Αὐτός mọ́, pé Hẹ́rọ́dù gan-an ló dá iṣẹ́ náà sílẹ̀.
- source_word: ἀποστείλας ἐκράτησεν
  choice: ó ti ránṣẹ́ mú
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún bí alákòóso ṣe rán àwọn aṣojú rẹ̀ láti mú ẹnì kan. Ó tún pa tẹ̀lé-tẹ̀lé iṣẹ́ inú Gíríìkì mọ́ láì sọ pé Hẹ́rọ́dù fúnra rẹ̀ ló fi ọwọ́ mú Jòhánù.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: ó sì dè é sínú ẹ̀wọ̀n
  rationale: “Dè é” pa ìtumọ̀ gidi δέω mọ́, “sínú ẹ̀wọ̀n” sì sọ ibi ìhámọ́ náà ní Yorùbá tó ṣe kedere láì fi ẹ̀wọ̀n irin kún ohun tí orísun kò sọ.
- source_word: διὰ Ἡρῳδιάδα
  choice: nítorí Herodia
  rationale: διά pẹ̀lú accusative ń fi ìdí tàbí okùnfà hàn; “nítorí” jẹ́ ọ̀nà àdánidá láti sọ ìbáṣepọ̀ yìí.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: aya Filipi arákùnrin rẹ̀
  rationale: γυνή túmọ̀ sí “aya” ní ibí yìí, ọ̀rọ̀ náà sì pa àjọṣe pé Filipi jẹ́ arákùnrin Hẹ́rọ́dù mọ́.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: nítorí pé Hẹ́rọ́dù ti fẹ́ ẹ
  rationale: “Ti fẹ́ ẹ” fi hàn pé ìgbéyàwó náà ti ṣẹlẹ̀ ṣáájú ìmú Jòhánù. A tún Hẹ́rọ́dù sọ dípò ọ̀rọ̀ arọ́pò-orúkọ nítorí kíkedere, kí a má bàa ka Filipi sí ẹni tó ṣe iṣẹ́-ìṣe náà.
theological_decisions:
- issue: Ìṣàpèjúwe ìtàn àti ìdájọ́ ìwà lórí ìgbéyàwó Hẹ́rọ́dù
  choice: A sọ pé ìgbéyàwó Hẹ́rọ́dù sí Herodia ni okùnfà ìhámọ́ Jòhánù, láì fi ìdájọ́ ìwà míì kún ẹsẹ̀ yìí.
  alternative: Kí a pe ìgbéyàwó náà ní èèwọ̀ tàbí aláìbófinmu nínú ẹsẹ̀ yìí fúnra rẹ̀.
  rationale: Gbólóhùn Gíríìkì yìí sọ ìṣẹ̀lẹ̀ àti okùnfà rẹ̀; ẹsẹ̀ tó tẹ̀ lé e ló ṣàlàyé ọ̀ràn òfin àti ìwà. Ìtumọ̀ náà kò yẹ kí ó ṣáájú ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá àpapọ̀, ti òde òní, tí ó ní ọlá ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó ti yẹ; a pa àwọn orúkọ àjèjì mọ́ ní ìrísí tí ó rọrùn fún òǹkà Yorùbá. Ìṣètò “ránṣẹ́ mú” jẹ́ àdánidá, ó sì yẹra fún àní-àní pé Hẹ́rọ́dù fúnra rẹ̀ ló lọ mú Jòhánù.
