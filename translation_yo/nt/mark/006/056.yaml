reference: Mark 6:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: yo
  text: Ní ibikíbi tí ó bá wọ̀—ìbáà ṣe abúlé, ìlú tàbí agbègbè ìgbèríko[a]—àwọn ènìyàn a máa gbé àwọn aláìsàn sí àwọn ibi ọjà, wọ́n sì máa ń bẹ̀ ẹ́ pé kí àwọn aláìsàn náà lè kàn etí aṣọ rẹ̀ nìkan[b]. Gbogbo àwọn tí wọ́n kàn án sì ni a ń mú láradá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “oko.” Níhìn-ín, ἀγρούς lè túmọ̀ sí àwọn oko tàbí gbogbo agbègbè ìgbèríko.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìṣẹ́ aṣọ rẹ̀” tàbí “okùn etí aṣọ rẹ̀.” Ọ̀rọ̀ Gíríìkì κράσπεδον lè jẹ́ etí aṣọ, ó sì tún lè mú okùn etí aṣọ àwọn Júù wá sí ọkàn.
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “a ń gbà wọ́n là.” Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí mímú àwọn aláìsàn láradá tàbí pípa wọ́n padà bọ̀ sí ara-dídá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: Ní ibikíbi tí ó bá
  rationale: 'Ìsọ̀rọ̀ yìí fi ibi àìdá kan hàn ní ọ̀nà àpapọ̀: ibikíbi tí ó bá lọ.'
- source_word: εἰσεπορεύετο
  choice: wọ̀
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń ṣàkópọ̀ ohun tí ó máa ń ṣẹlẹ̀ léraléra; ‘tí ó bá wọ̀’ bá ìtumọ̀ yẹn mu ní Yorùbá.
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: abúlé, ìlú tàbí agbègbè ìgbèríko
  rationale: ‘Agbègbè ìgbèríko’ mú ἀγρούς gẹ́gẹ́ bí ìlú-kékeré tàbí ilẹ̀ ìta gbangba, láìfi dandan túmọ̀ ọ́ sí oko kọ̀ọ̀kan.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sí àwọn ibi ọjà
  rationale: ἀγορά lè jẹ́ ọjà tàbí gbangba ìlú; ‘ibi ọjà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere ní àyíká yìí.
- source_word: ἐτίθεσαν
  choice: a máa gbé
  rationale: Àmì ‘a máa’ ṣe àfihàn ìṣe tí àwọn ènìyàn ń ṣe léraléra, gẹ́gẹ́ bí ọ̀rọ̀-ìṣe aláìpé Gíríìkì.
- source_word: τοὺς ἀσθενοῦντας
  choice: àwọn aláìsàn
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn tí ara wọn kò le tàbí tí wọ́n ń ṣàìsàn.
- source_word: παρεκάλουν
  choice: máa ń bẹ̀ ẹ́
  rationale: παρακαλέω níbí jẹ́ ẹ̀bẹ̀ onítara, kì í ṣe ìbéèrè lásán.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: kí ... lè kàn ... nìkan
  rationale: ‘Nìkan’ mú ìtumọ̀ κἄν jáde pé fífi ọwọ́ kan etí aṣọ náà pàápàá ti tó.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: etí aṣọ rẹ̀
  rationale: κράσπεδον lè tọ́ka sí etí, ìṣẹ́ aṣọ, tàbí okùn etí aṣọ; ‘etí aṣọ’ kò fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἥψαντο αὐτοῦ
  choice: kàn án
  rationale: αὐτοῦ tọ́ka sí Jesu ní gírámà, bí ó tilẹ̀ jẹ́ pé gbólóhùn tó ṣáájú fi etí aṣọ rẹ̀ hàn gẹ́gẹ́ bí ohun tí wọ́n fẹ́ kàn.
- source_word: ἐσῴζοντο
  choice: a ń mú láradá
  rationale: Nínú àyíká àwọn aláìsàn, ọ̀rọ̀ náà tọ́ka sí ìwòsàn tàbí pípadà sí ara-dídá; àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ gbígbòòrò ‘gbà là’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐσῴζοντο láti inú σῴζω
  choice: a ń mú láradá
  alternative: a ń gbà là
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ jẹ́ ti ìwòsàn ara. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘gbà là,’ kí a má bà a dín ìwọ̀n ọ̀rọ̀ náà kù láìsọ.
- issue: Ohun tí ἥψαντο αὐτοῦ tọ́ka sí
  choice: kàn án
  alternative: kàn etí aṣọ rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì tọ́ka sí Jesu, ṣùgbọ́n etí aṣọ rẹ̀ ni a mẹ́nu kàn ṣáájú. Ìtumọ̀ pàtàkì tẹ̀lé gírámà, ó sì jẹ́ kí àyíká ṣàlàyé bí wọ́n ṣe kàn án.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì bí ‘a máa’ àti ‘máa ń’ pa ìṣe àṣà tí àwọn ọ̀rọ̀-ìṣe aláìpé Gíríìkì fi hàn mọ́. ‘Ìbáà ṣe’ jẹ́ ọ̀rọ̀ àkọsílẹ̀ oníyì ṣùgbọ́n ó ṣì wọ́pọ̀, ‘etí aṣọ’ sì jẹ́ èdè àdánidá tí kò yanju àìdájú κράσπεδον jù.
