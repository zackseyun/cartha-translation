  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘àwọn ẹja’ nítorí τῶν ἰχθύων jẹ́ ọ̀pọ̀, a sì yẹra fún fífi ‘búrẹ́dì’ kún ẹsẹ náà bó tilẹ̀ jẹ́ pé àyíká ìtàn fi hàn pé àwọn ẹ̀bẹ̀ náà jẹ́ ti búrẹ́dì.
