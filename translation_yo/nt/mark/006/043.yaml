  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: yo
  text: Wọ́n sì kó àwọn àjẹkù tí ó ṣẹ́ kù jọ, tó kún agbọ̀n méjìlá, pẹ̀lú àwọn àjẹkù lára àwọn ẹja náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì kó ìkún agbọ̀n méjìlá ti àwọn àjẹkù jọ, pẹ̀lú lára àwọn ẹja náà.” Ọ̀rọ̀ Gíríìkì náà so “àwọn àjẹkù,” “agbọ̀n méjìlá,” àti “ìkún” pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wọ́n sì kó ... jọ
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ṣà àwọn ohun tó ṣẹ́ kù jọ; ‘kó ... jọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà.
- source_word: κλάσματα
  choice: àwọn ẹ̀bẹ̀ tí ó ṣẹ́ kù
  rationale: ‘Ẹ̀bẹ̀’ ń tọ́ka sí àwọn apá kéékèèké tí a ṣẹ́ tàbí fọ́ kúrò lára odindi ohun; fífi ‘tí ó ṣẹ́ kù’ kún un mú kí ipa wọn gẹ́gẹ́ bí àjẹkù oúnjẹ hàn ní kedere láì fi ‘búrẹ́dì’ tí kò sí ní ẹsẹ yìí kún ọ̀rọ̀ náà.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: ó kún agbọ̀n méjìlá
  rationale: Èyí mú iye agbọ̀n méjìlá àti ìtumọ̀ πλήρωμα gẹ́gẹ́ bí ohun tó kún wọn jáde ní Yorùbá tó rọrùn, bí ó tilẹ̀ jẹ́ pé ìṣètò ọ̀rọ̀ Gíríìkì lè tún jẹ́ ‘ìkún agbọ̀n méjìlá.’
- source_word: κόφινος
  choice: agbọ̀n
  rationale: ‘Agbọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún irú ohun èlò tí a fi ń kó nǹkan, láì sọ ìwọ̀n tí ẹsẹ náà kò sọ.
- source_word: πληρώματα
  choice: ó kún
  rationale: Ọ̀rọ̀-ìṣe ‘kún’ sọ ní kedere pé iye àjẹkù náà tó láti kún àwọn agbọ̀n náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: pẹ̀lú èyí tí ó ṣẹ́ kù lára àwọn ẹja náà
  rationale: ‘Lára’ pa agbára apá-orísun ἀπό mọ́, ‘èyí tí ó ṣẹ́ kù’ sì mú ìbáṣepọ̀ rẹ̀ pẹ̀lú ìkójọ àjẹkù yé ẹni tó ń kà á. ‘Pẹ̀lú’ so àjẹkù ẹja mọ́ àjẹkù tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
