id: MRK.6.21
reference: Mark 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: yo
  text: Nígbà tí ọjọ́ kan tó bójú mu sì dé[a], Hẹ́rọ́dù ṣe àsè[b] ní ayẹyẹ ọjọ́ ìbí rẹ̀ fún àwọn ọlọ́lá rẹ̀, àwọn olórí ọmọ ogun, àti àwọn ọkùnrin pàtàkì ní Gálílì[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọjọ́ kan tó yẹ” tàbí “ọjọ́ kan tó rọgbọ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ọjọ́ tàbí àkókò tó bójú mu.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ṣe oúnjẹ alẹ́”; ìtumọ̀ rẹ̀ níbí ni pé ó ṣe àsè ńlá.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ọkùnrin tó jẹ́ aṣáájú ní Gálílì.” Ó ń tọ́ka sí àwọn ọkùnrin olókìkí àti aláṣẹ ní agbègbè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó pa ìsopọ̀ ìtàn Máàkù mọ́ ní ọ̀nà tó bá èdè Yorùbá mu, láìfi ‘àti’ tí kò ní ṣàn dáadáa sí ìbẹ̀rẹ̀.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: Nígbà tí ọjọ́ àǹfààní kan sì dé
  rationale: ‘Ọjọ́ àǹfààní’ fi hàn pé ọjọ́ náà jẹ́ àkókò tó bójú mu tàbí àǹfààní tí a ti ń dúró de; ó tún pa ìrísí búburú tó wà nínú ìtàn náà mọ́.
- source_word: ὅτε
  choice: nígbà tí (a ṣàkópọ̀ rẹ̀ mọ́ gbólóhùn àkọ́kọ́)
  rationale: Ọ̀rọ̀ àsìkò yìí ṣàlàyé ohun tó mú ọjọ́ náà jẹ́ ọjọ́ àǹfààní. Yorùbá àdánidá kò nílò àtúnwí ‘nígbà tí’ lẹ́ẹ̀mejì.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: ní ọjọ́ ìbí rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ṣe àdánidá láti sọ ayẹyẹ ọjọ́ ìbí.
- source_word: δεῖπνον ἐποίησεν
  choice: ṣe àsè
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì túmọ̀ ní tààrà sí ‘ṣe oúnjẹ alẹ́,’ ‘ṣe àsè’ fi àsè ńlá tí ẹni kan gbàlejò hàn lọ́nà Yorùbá tó yẹ.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: fún àwọn ọlọ́lá rẹ̀
  rationale: ‘Àwọn ọlọ́lá’ tọ́ka sí àwọn ẹni ipò gíga tó sún mọ́ ààfin Hẹ́rọ́dù, láìfi oyè pàtó tí orísun kò sọ kún un.
- source_word: τοῖς χιλιάρχοις
  choice: àwọn olórí ọmọ ogun
  rationale: Ó sọ iṣẹ́ àwọn ọ̀gá ológun gíga wọ̀nyí ní kedere, láìfi oyè Róòmù pàtó kan lé ọ̀rọ̀ náà lórí.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: àwọn ọkùnrin pàtàkì ní Gálílì
  rationale: Ó pa ìtọ́kasí sí àwọn ọkùnrin olókìkí tàbí olórí agbègbè náà mọ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Àkọ̀ọ́lẹ̀ orúkọ tí ó wọ́pọ̀ ní Yorùbá Bíbélì, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ṣe àsè’ gẹ́gẹ́ bí àṣà èdè Yorùbá, a sì pa ìtẹnumọ́ orísun mọ́ pé àwọn ọkùnrin ipò gíga ni àwọn àlejò náà.
