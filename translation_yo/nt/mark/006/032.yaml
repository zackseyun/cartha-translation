  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: yo
  text: Wọ́n sì fi ọkọ̀ ojú omi lọ sí ibi tí kò sí ènìyàn[a], ní àdáni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ibi aṣálẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn nìkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: lọ
  rationale: Ọ̀rọ̀ náà ń sọ pé wọ́n kúrò ní ibi tí wọ́n wà, wọ́n sì lọ sí ibòmíràn. “Lọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tí àyíká gbolohun náà sì mú kí ìtumọ̀ kíkúrò hàn kedere.
- source_word: ἐν τῷ πλοίῳ
  choice: fi ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ọkọ̀ ojú omi ni wọ́n fi rin ìrìn àjò náà; ó bá ìtumọ̀ “nínú ọkọ̀ náà” mu láìjẹ́ kí gbolohun náà le.
- source_word: εἰς ἔρημον τόπον
  choice: sí ibi tí kò sí ènìyàn
  rationale: ἔρημος τόπος tọ́ka sí ibi tí kò sí olùgbé tàbí ibi tó ya sọ́tọ̀. Yíyan ọ̀rọ̀ yìí kò fi dandan túmọ̀ ibi náà sí aṣálẹ̀ oníyanrìn.
- source_word: κατ’ ἰδίαν
  choice: àwọn nìkan
  rationale: Àpólà yìí túmọ̀ sí pé wọ́n ya ara wọn sọ́tọ̀ kúrò lọ́dọ̀ àwọn ẹlòmíràn. “Àwọn nìkan” bá olùṣe ọ̀pọ̀ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: καὶ
  choice: sì
  rationale: “Sì” ń tẹ ìtàn náà síwájú lọ́nà àdánidá, ó sì pa ìṣàn àsopọ̀ καί mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé yé ni a lò. A lo “ibi tí kò sí ènìyàn” láti pa ìtumọ̀ ibi àdádó tàbí ibi tí kò ní olùgbé mọ́, láìfi àwòrán aṣálẹ̀ oníyanrìn kún un. Àwọn àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
