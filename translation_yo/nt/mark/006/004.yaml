language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: yo
  text: Jésù sì ń sọ fún wọn pé, “Wòlíì kì í ṣe aláìní ọlá, bí kò ṣe ní ìlú ìbílẹ̀ rẹ̀[a], láàárín àwọn ìbátan rẹ̀[b], àti nínú ilé rẹ̀[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi ìbílẹ̀” tàbí “ilẹ̀ ìbílẹ̀.” Ọ̀rọ̀ Gíríìkì πατρίς ń tọ́ka sí ibi tí ẹni ti wá; níbí, “ìlú ìbílẹ̀” bá àyíká Násárẹ́tì mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ará ìdílé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ìbátan tàbí àwọn tí wọ́n jẹ́ ara ìdílé kan náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “agbo ilé rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilé tí a kọ́ tàbí àwọn ènìyàn inú ilé; “ilé rẹ̀” pa àìdájú náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ó ń lọ lọ́wọ́ hàn; ‘ń sọ’ pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún προφήτης.
- source_word: ἄτιμος
  choice: aláìní ọlá
  rationale: Ó pa ìtumọ̀ ‘ẹni tí kò ní ọlá’ mọ́, ó sì bá àgbékalẹ̀ òwe náà, ‘kì í ṣe ... bí kò ṣe,’ mu láìyí i sí ‘ẹni tí a kẹ́gàn.’
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Nínú gbólóhùn ìkọ̀ yìí, ó ń sọ ibi àyọkúrò, kì í ṣe ipò ‘bí ... bá.’
- source_word: πατρίδι
  choice: ìlú ìbílẹ̀
  rationale: Ní àyíká Násárẹ́tì, ọ̀rọ̀ náà tọ́ka sí ibi tí ẹni ti wá tàbí ìlú tirẹ̀, kì í ṣe gbogbo orílẹ̀-èdè.
- source_word: συγγενεῦσιν
  choice: àwọn ìbátan
  rationale: Ó túmọ̀ sí àwọn tí ìbátan ẹ̀jẹ̀ tàbí ìdílé so pọ̀ mọ́ ẹni; ọ̀rọ̀ yìí sì ṣe kedere ju ‘àwọn ará’ lọ.
- source_word: οἰκίᾳ
  choice: agbo ilé
  rationale: Nínú ọ̀rọ̀ yìí, ó lè tọ́ka sí ilé gẹ́gẹ́ bí àwùjọ àwọn tí ń gbé inú rẹ̀, kì í ṣe kìkì ilé tí a kọ́; ‘agbo ilé’ yà á sọ́tọ̀ sí àwọn ìbátan lápapọ̀.
- source_word: καὶ ... καὶ ... καὶ
  choice: '... láàárín ... àti nínú ...'
  rationale: Àtòjọ Yorùbá náà pa ìkójọpọ̀ àwọn ibi mẹ́tẹ̀ẹ̀ta mọ́, bó tilẹ̀ jẹ́ pé Yorùbá àdánidá kò nílò kí a tún ‘àti’ ṣe lẹ́yìn gbogbo apá.
theological_decisions:
- issue: Ìwọ̀n òwe Jésù nípa ọlá wòlíì
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí òwe gbogbogbò tí Jésù lò fún ipò tirẹ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Kí a ṣàlàyé nínú ìtumọ̀ náà pé Jésù ń pe ara rẹ̀ ní Mèsáyà tí a kọ̀, tàbí pé ó ń sọ nípa àìgbàgbọ́ lápapọ̀.
  rationale: Gíríìkì sọ òwe nípa àìní ọlá wòlíì ní àwọn ibi tí wọ́n ti mọ̀ ọ́n dáadáa. Àyíká fi òwe náà kan Jésù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò fi àwọn àlàyé ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àgbékalẹ̀ ‘kì í ṣe ... bí kò ṣe’ pa ìrísí òwe àti ìtakora inú Gíríìkì mọ́.
