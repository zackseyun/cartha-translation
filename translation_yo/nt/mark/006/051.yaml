source:
  edition: SBLGNT
  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: yo
  text: Ó sì wọ inú ọkọ̀ lọ bá wọn[a], afẹ́fẹ́ náà sì dáwọ́ dúró. Ẹnu sì yà wọ́n gidigidi ní ọkàn wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘ó gòkè wọ inú ọkọ̀ sí ọ̀dọ̀ wọn’; ní àyíká yìí, ìtumọ̀ rẹ̀ ni pé ó wọ inú ọkọ̀ lọ láti wà pẹ̀lú wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ìyàlẹ́nu bò wọ́n débi pé wọn kò mọ ara wọn mọ́.’ Gíríìkì kó ọ̀pọ̀ ọ̀rọ̀ amúnágbára jọ láti fi hàn pé ìyàlẹ́nu wọn pọ̀ rékọjá ìwọ̀n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: wọ inú ọkọ̀ lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ‘lọ sókè,’ ní àyíká yìí ó túmọ̀ sí wíwọ inú ọkọ̀; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: πρὸς αὐτοὺς
  choice: bá wọn
  rationale: Ó fi hàn pé ó wọ inú ọkọ̀ láti wà pẹ̀lú wọn, láìsọ ìtumọ̀ náà di ohun tí ó ju ohun tí Gíríìkì sọ lọ.
- source_word: πλοῖον
  choice: ọkọ̀
  rationale: ‘Ọkọ̀’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọkọ̀ ojú omi inú ìtàn Adágún Galili mu.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: afẹ́fẹ́ náà dáwọ́ dúró
  rationale: Ó sọ ní kedere pé afẹ́fẹ́ náà rọlẹ̀ tàbí dáwọ́; ‘dáwọ́ dúró’ jẹ́ ọ̀rọ̀ àdánidá, ó sì sún mọ́ ìtumọ̀ pé ó ṣíwọ́.
- source_word: λίαν ἐκ περισσοῦ
  choice: gidigidi
  rationale: Àkójọpọ̀ àwọn ọ̀rọ̀ Gíríìkì yìí ń fi ìyàlẹ́nu náà le gidigidi. ‘Gidigidi’ jẹ́ kíkà tó rọrùn, nígbà tí àlàyé ìsàlẹ̀ fi agbára àkójọpọ̀ náà hàn.
- source_word: ἐν ἑαυτοῖς
  choice: lọ́kàn ara wọn
  rationale: Ó pa ìtumọ̀ ìhùwàpadà inú wọn mọ́, ó sì jẹ́ Yorùbá àdánidá ju ìtumọ̀ ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ lọ.
- source_word: ἐξίσταντο
  choice: ẹnu yà wọ́n
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìyàlẹ́nu tó lágbára gan-an; ‘ẹnu yà wọ́n’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tí àfikún ‘gidigidi’ sì ń pa agbára rẹ̀ mọ́.
theological_decisions:
- issue: Bí ìhùwàpadà àwọn ọmọ-ẹ̀yìn sí iṣẹ́ Jésù ṣe lágbára tó
  choice: Ẹnu sì yà wọ́n gidigidi lọ́kàn ara wọn
  alternative: Wọ́n sì dàbí ẹni tí kò mọ ara wọn mọ́ nítorí ìyàlẹ́nu
  rationale: Ìtumọ̀ yìí pa ìyàlẹ́nu ńlá tí ẹsẹ náà tẹnumọ́ mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ohun tí ìtàn náà sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘wọ inú ọkọ̀ lọ bá wọn’ àti ‘ẹnu yà wọ́n gidigidi’ fún ìṣàn ọ̀rọ̀ àdánidá, nígbà tí àwọn àlàyé ìsàlẹ̀ ń pa ìtumọ̀ tààràtà àti agbára ọ̀rọ̀ Gíríìkì mọ́.
