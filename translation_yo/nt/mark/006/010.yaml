  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ní ibikíbi tí ẹ bá wọ ilé kan, ẹ dúró níbẹ̀ títí tí ẹ ó fi kúrò níbẹ̀[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “títí tí ẹ ó fi kúrò ní àgbègbè náà.” Gíríìkì túmọ̀ ní tààràtà sí “títí tí ẹ ó fi jáde kúrò níbẹ̀”; nínú àyíká yìí, ó lè ń tọ́ka sí fífi ìlú tàbí àgbègbè náà sílẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ fún wọn
  rationale: Àkókò imperfect nínú Gíríìkì lè fi ìṣe tí ń lọ lọ́wọ́ tàbí ọ̀rọ̀ tí a ń sọ léraléra hàn; “ń sọ fún wọn” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: Ὅπου ἐὰν
  choice: Ní ibikíbi tí … bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí ibi àìdákan pàtó; àkójọ “ní ibikíbi tí … bá” ni ọ̀nà Yorùbá àdánidá fún “wherever.”
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ẹ bá wọ ilé kan
  rationale: “Wọ ilé” sọ ìlọwọlé di mímọ́ láìlo ọ̀rọ̀ tí kò wọ́pọ̀, “kan” sì fi àìdákan pàtó ti οἰκίαν hàn.
- source_word: ἐκεῖ μένετε
  choice: ẹ dúró níbẹ̀
  rationale: Nínú àyíká ìtọ́ni nípa ibùgbé, “dúró níbẹ̀” túmọ̀ sí kí wọn má ṣe yí ilé tí wọ́n ń gbé padà, ó sì bá μένω mu.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: títí tí ẹ ó fi kúrò níbẹ̀
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú mọ́ nípa bóyá “níbẹ̀” ń tọ́ka sí ilé náà tàbí gbogbo àgbègbè náà.
theological_decisions:
- issue: Ìwọ̀n ibi tí ἐκεῖθεν ń tọ́ka sí nínú gbólóhùn ìkúrò
  choice: A lo “kúrò níbẹ̀” nínú àyọkà pàtàkì, láìfi “àgbègbè” kún un.
  alternative: “Kúrò ní àgbègbè náà,” èyí tó túmọ̀ sí pé kí àwọn ọmọ-ẹ̀yìn dúró nínú ilé kan náà títí wọn yóò fi fi ìlú tàbí agbègbè náà sílẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ṣùgbọ́n àyíká iṣẹ́ ìránṣẹ́ lè mú un tọ́ka sí àgbègbè náà. Ìtumọ̀ pàtàkì kò yẹ kí ó yanjú àìdánilójú yìí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
