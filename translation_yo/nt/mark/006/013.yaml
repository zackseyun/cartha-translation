source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: yo
  text: Wọ́n sì ń lé ọ̀pọ̀ ẹ̀mí èṣù jáde, wọ́n sì ń fi òróró yan ọ̀pọ̀ aláìsàn, wọ́n sì ń mú wọn lára dá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια
  choice: ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwọn ẹ̀mí búburú tàbí àwọn ẹ̀mí èṣù. “Ẹ̀mí èṣù” jẹ́ ọ̀nà àdánidá, tó ṣe kedere ní Yorùbá, láì yá ọ̀rọ̀ “ẹ̀mí àìmọ́” láti àwọn ẹsẹ míì wá.
- source_word: πολλὰ
  choice: ọ̀pọ̀
  rationale: Ó ṣàlàyé iye àwọn ẹ̀mí èṣù náà ní ọ̀nà tó ṣe tààrà, láì fi ìtumọ̀ kún un.
- source_word: ἐξέβαλλον
  choice: ń lé ... jáde
  rationale: Àkókò imperfect Gíríìkì fi iṣẹ́ tó ń ṣẹlẹ̀ léraléra tàbí tó ń bá a lọ hàn; “ń lé ... jáde” pa ìrísí yẹn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bá iṣẹ́ yìí mu.
- source_word: ἤλειφον
  choice: ń fi ... yan
  rationale: ἀλείφω túmọ̀ sí fífi ohun kan, pàápàá òróró, pa tàbí yan ara. “Fi òróró yan” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, ó sì pa ìrísí iṣẹ́ tó ń bá a lọ mọ́.
- source_word: ἐλαίῳ
  choice: òróró
  rationale: ἔλαιον túmọ̀ sí òróró, tí ó sábà máa ń jẹ́ òróró ólífì ní àyíká Mẹditaréníà ìgbàanì. “Òróró” tó nìkan tó fún ẹsẹ yìí; kíkún un sí òróró ólífì nínú ọ̀rọ̀ àkọ́kọ́ yóò ṣe pàtó ju Gíríìkì lọ.
- source_word: πολλοὺς ἀρρώστους
  choice: ọ̀pọ̀ aláìsàn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tó ń ṣàìsàn. “Ọ̀pọ̀ aláìsàn” jẹ́ kedere, àdánidá, ó sì bá iye tó wà nínú Gíríìkì mu.
- source_word: ἐθεράπευον
  choice: ń mú wọn lára dá
  rationale: θεραπεύω túmọ̀ sí láti mú ènìyàn lára dá tàbí láti wò ó sàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, “wọn” sì tọ́ka padà sí àwọn aláìsàn; àmì “ń” pa ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra mọ́.
- source_word: καὶ
  choice: sì
  rationale: Àwọn καί tó tún ara wọn ṣe so àwọn ìṣe náà pọ̀ ní ìtàn tó tẹ̀ léra. “Sì” ń mú ìsopọ̀ yẹn jáde ní Yorùbá tó rọrùn, láì fi ìtumọ̀ tuntun kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ fífi òróró yan ara àti ìmúláradá
  choice: Ṣàpèjúwe àwọn ìṣe méjèèjì gẹ́gẹ́ bí ìṣẹ̀lẹ̀ ìtàn, láì sọ pé òróró fúnra rẹ̀ ló mú wọn lára dá.
  alternative: Kí a sọ pé òróró fúnra rẹ̀ ló ṣe ìwòsàn, tàbí pé fífi òróró yan wọn kò ní ipa kankan rárá, àmì lásán ni.
  rationale: Ẹsẹ náà sọ pé àwọn ọmọ-ẹ̀yìn fi òróró yan àwọn aláìsàn, wọ́n sì mú wọn lára dá, ṣùgbọ́n kò ṣàlàyé ọ̀nà ẹ̀kọ́ ìgbàgbọ́ tí ìmúláradá fi ṣẹlẹ̀. Ìtumọ̀ náà pa ìtẹ̀lé ìtàn àti àìmọ̀ pàtó yìí mọ́ láì gbé ẹ̀kọ́ ẹ̀sìn kan wọlé.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóòótọ́, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tó yẹ. Ìṣọ̀kan “wọ́n sì ń” pa ọ̀nà ìtàn Gíríìkì àti ìṣe léraléra mọ́.
