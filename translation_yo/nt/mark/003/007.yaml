  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: yo
  text: Jésù sì bá àwọn ọmọ-ẹ̀yìn rẹ̀ kúrò lọ sí òkun[a][b]; ogunlọ́gọ̀ ènìyàn láti Gálílì sì tẹ̀ lé e, àti láti Jùdíà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “lọ síhà òkun.” Ọ̀rọ̀ aṣáájú Gíríìkì náà lè tọ́ka sí lílọ síhà òkun.
    reason: lexical_alternative
  - marker: b
    text: Èyí ni Òkun Gálílì. Ọ̀rọ̀ Gíríìkì náà kàn sọ pé “òkun.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: kúrò lọ
  rationale: Ó sọ pé Jésù yọ kúrò níbi náà, ó sì lè ní ìtumọ̀ yíyẹra fún ìtakò tàbí ìpọ́njú, láì fi ìtumọ̀ pé ó sá kún ọ̀rọ̀ náà.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: bá àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn tí ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tọ̀ ọ́ lẹ́yìn; “bá” sọ ìbákẹ́gbẹ́ tí μετά ní.
- source_word: πρὸς τὴν θάλασσαν
  choice: lọ sí òkun
  rationale: “Òkun” pa àpèjúwe gangan θάλασσα mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí adágún; “lọ sí” jẹ́ ọ̀nà àdánidá láti sọ ìrìn sí ibi tàbí síhà ibi kan.
- source_word: πολὺ πλῆθος
  choice: ogunlọ́gọ̀ ènìyàn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwùjọ ènìyàn tí ó pọ̀ gidigidi, ó sì pa ìtẹnumọ́ πολὺ mọ́.
- source_word: ἠκολούθησεν
  choice: tẹ̀ lé e
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé àwọn ènìyàn náà ń lọ lẹ́yìn Jésù; “tẹ̀ lé e” jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: láti Gálílì
  rationale: Ó sọ ibi tí ogunlọ́gọ̀ náà ti wá ní tààràtà.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: àti láti Jùdíà,
  rationale: A pa gbólóhùn tí kò tíì parí mọ́, nítorí àtòjọ àwọn agbègbè náà ń bá a lọ nínú ẹsẹ tó tẹ̀ lé e.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A fi “òkun” sí ọ̀rọ̀ pàtàkì láti pa àpèjúwe Gíríìkì mọ́, a sì so àmì àlàyé [a] àti [b] mọ́ ọ̀rọ̀ náà nítorí pé àwọn méjèèjì ń ṣàlàyé “òkun.” A mọ̀ọ́mọ̀ fi kọ́ńmà sí òpin láti fi hàn pé àtòjọ náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
