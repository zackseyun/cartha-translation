  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: yo
  text: Ó sì dá wọn lóhùn pé[a], “Ta ni ìyá mi tàbí àwọn arákùnrin mi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní títẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki: “Ní dídá wọn lóhùn, ó ní.” Gíríìkì lo ọ̀rọ̀-ìṣe alábápín pẹ̀lú ọ̀rọ̀-ìṣe ìsinsìnyí nínú ìtàn.'
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì ní ní tààràtà: “Ta ni ìyá mi, tàbí àwọn arákùnrin mi?” Ọ̀rọ̀-ìṣe náà wà ní ẹyọ, gẹ́gẹ́ bí ọ̀rọ̀ ìbéèrè ‘Ta ni.’'
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Ó sì dá wọn lóhùn pé
  rationale: Èdè Gíríìkì lo ọ̀rọ̀-ìṣe aláìparí ‘ní dídáhùn’ pẹ̀lú ọ̀rọ̀-ìṣe ìsinsìnyí ìtàn ‘ó ní.’ ‘Ó sì dá wọn lóhùn pé’ mú ìtumọ̀ méjèèjì jáde ní Yorùbá àdánidá láìsọ ọ̀rọ̀ náà di líle tàbí àtúnlò.
- source_word: Τίς
  choice: Ta ni
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé àti tó ṣe kedere fún ìbéèrè nípa ẹni tí ẹnì kan jẹ́.
- source_word: μήτηρ
  choice: ìyá
  rationale: ‘Ìyá’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, tó sì bá μήτηρ mu.
- source_word: ἢ
  choice: tàbí
  rationale: ‘Tàbí’ pa ìyàn àṣàyàn tí ἢ gbé kalẹ̀ mọ́, dípò yíyí i padà sí ‘àti.’
- source_word: ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, àyíká ọ̀rọ̀ náà sì ń tọ́ka sí àwọn arákùnrin Jésù; nítorí náà a kò fẹ̀ ọ́ sí ‘àwọn arákùnrin àti arábìnrin’ tàbí ‘àwọn ọmọ ìyá kan.’
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìbátan ἀδελφοί
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn ọmọ ìyá kan
  rationale: A pa akọ ọ̀pọ̀ inú Gíríìkì mọ́, láìfẹ̀ ìtumọ̀ náà sí ẹgbẹ́ akọ àti abo, láì sì fi èrò ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
- issue: Àsopọ̀ μήτηρ àti ἀδελφοί
  choice: ìyá mi tàbí àwọn arákùnrin mi
  alternative: ìyá mi àti àwọn arákùnrin mi
  rationale: Gíríìkì ní ἢ (‘tàbí’). Bí ó tilẹ̀ jẹ́ pé àwọn èdè kan lè fẹ́ ‘àti’ fún ìrọ̀rùn, Yorùbá lè pa ‘tàbí’ mọ́ lọ́nà tó ṣe kedere àti àdánidá.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. ‘Ó sì dá wọn lóhùn pé’ jẹ́ àdánidá ju ṣíṣe àdàkọ ‘ní dídáhùn … ó ní’ lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìṣètò àti ìsinsìnyí ìtàn inú Gíríìkì mọ́. A fi àmì ohùn sí ibi tí ó yẹ.
