  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: yo
  text: Àwọn Farisi sì jáde, lẹ́sẹ̀kẹsẹ̀ wọ́n sì bẹ̀rẹ̀ sí í gbìmọ̀ pọ̀ pẹ̀lú àwọn Hẹ́rọ́díánù lòdì sí Jesu, bí wọ́n ṣe lè pa á run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àyíká ọ̀rọ̀ yìí, ó tún lè túmọ̀ sí “pa á” tàbí “mú un kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: jáde
  rationale: Aorist participle náà ń tọ́ka sí ìṣe tó tẹ̀ lé ohun tó ṣẹlẹ̀ nínú sínágọ́gù; ‘jáde’ jẹ́ ọ̀rọ̀ àdánidá nínú ìtàn Yorùbá.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìkánjú tí Máàkù sábà máa ń fi εὐθύς hàn mọ́.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: pọ̀ mọ́ àwọn ọmọ ẹ̀yìn Hẹ́rọ́dù
  rationale: μετά pẹ̀lú genitive túmọ̀ sí ìbáṣepọ̀; àpèjúwe yìí jẹ́ kí òǹkàwé òde òní mọ̀ pé ẹgbẹ́ tó fara mọ́ Hẹ́rọ́dù ni wọ́n, láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
- source_word: συμβούλιον ἐδίδουν
  choice: bẹ̀rẹ̀ sí í dìtẹ̀
  rationale: Àpólà náà jẹ́ ọ̀nà Gíríìkì fún jíjọ gbìmọ̀; ète ọ̀tá tó tẹ̀ lé e fi hàn pé ìdìtẹ̀ ni. ‘Bẹ̀rẹ̀ sí í’ ń fi agbára imperfect ἐδίδουν hàn.
- source_word: κατ’ αὐτοῦ
  choice: láti tako Jesu
  rationale: κατά pẹ̀lú genitive níbí ní agbára ọ̀tá, ìyẹn gbígbìmọ̀ lòdì sí i. Lílo ‘Jesu’ mú ẹni tí arọ́pò-orúkọ ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ὅπως
  choice: bí wọ́n ṣe lè
  rationale: Ó pa ìtumọ̀ ète àti ìrònú ọ̀nà tí wọ́n yóò gbà ṣe é mọ́ nínú ọ̀rọ̀ Yorùbá tó ṣàn.
- source_word: ἀπολέσωσιν
  choice: pa á run
  rationale: ‘Pa á run’ pa ìtumọ̀ fífẹ̀ ἀπόλλυμι—ìparun tàbí pípa—mọ́, nígbà tí àyíká ọ̀rọ̀ ń tọ́ka sí ète láti mú un kú.
theological_decisions:
- issue: Bóyá kí ète àwọn aṣáájú náà jẹ́ pípa Jesu ní kedere nínú ọ̀rọ̀ pàtàkì
  choice: A lo ọ̀rọ̀ fífẹ̀ ‘pa á run’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘pa á’ tàbí ‘mú un kú’
  rationale: ἀπόλλυμι ní ìtumọ̀ tó gbòòrò ju pípa ènìyàn nìkan lọ, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ níbí fi ète ikú hàn. Èyí pa ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́, àlàyé ìsàlẹ̀ sì sọ ìtumọ̀ tó ṣe kedere jù.
translation_notes:
  register: Yorùbá àpéjọ tó bófin mu, tó ní àmì ohùn níbi tó yẹ, tí ó sì ní ọ̀wọ̀ àti ìṣàn ìtàn. ‘Àwọn ọmọ ẹ̀yìn Hẹ́rọ́dù’ túmọ̀ orúkọ ẹgbẹ́ náà lọ́nà tí òǹkàwé gbogbogbò lè lóye; ‘dìtẹ̀’ fi ìgbìmọ̀ ọ̀tá hàn láìsọ̀rọ̀ di líle ju.
