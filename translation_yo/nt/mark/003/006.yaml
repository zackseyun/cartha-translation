  naturalness: Ọ̀rọ̀ náà ṣàn dáadáa ní Yorùbá. Síbẹ̀, “Àwọn Farisí” dara kí ó jẹ́ “Àwọn Farisi” gẹ́gẹ́ bí ìkọ̀wé orúkọ ẹgbẹ́ náà tí ó wọ́pọ̀ nínú Yorùbá, àti “àwọn ọmọ ẹ̀yìn Hẹ́rọ́dù” kò ṣàn gẹ́gẹ́ bí orúkọ ẹgbẹ́ ìṣèlú/àwọn alátìlẹ́yìn Hẹ́rọ́dù.
  terminology: “Àwọn Hẹ́rọ́díánù” jẹ́ ìtúmọ̀-orúkọ tó péye jù fún Ἡρῳδιανοί; a lè ṣàlàyé ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀ bí ó bá wúlò. “gbìmọ̀ pọ̀” jẹ́ ọ̀nà ìbílẹ̀, tó wà ní àárín, fún συμβούλιον ἐδίδουν; àyíká ọ̀rọ̀ náà ti fi ìlòdì àti ète ìparun hàn, nítorí náà kò pọndandan láti mú “dìtẹ̀” wá sínú ọ̀rọ̀ pàtàkì.
