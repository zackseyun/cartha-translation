  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: Καὶ, ìwọlé sí ilé kan, ìpéjọ ogunlọ́gọ̀ náà lẹ́ẹ̀kan sí i, àti àbájáde pé ‘wọn’ kò lè jẹun pàápàá ni a gbé kalẹ̀ láì ṣàfikún ẹni tí αὐτούς ń tọ́ka sí. ‘Ilé kan’ pa àìní article/possessive nínú εἰς οἶκον mọ́.'
  naturalness: ‘Ó sì wọ ilé kan lọ; ogunlọ́gọ̀ sì tún péjọ, tó bẹ́ẹ̀ tí wọn kò fi lè jẹun pàápàá’ jẹ́ Yorùbá òde-òní tí ó yè, tí ìṣàn ọ̀rọ̀ rẹ̀ sì dára. Ìlò ‘tó bẹ́ẹ̀ tí ... kò fi lè’ ń fi àbájáde ὥστε hàn ní ti ẹ̀dá.
