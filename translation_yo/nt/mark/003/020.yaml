id: MRK.3.20
reference: Mark 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: yo
  text: Ó sì wọ ilé kan lọ[a]; ogunlọ́gọ̀ sì tún péjọ, tó bẹ́ẹ̀ tí wọn kò fi lè jẹun pàápàá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ ilé lọ,” èyí tó lè túmọ̀ sí pé ó padà sí ibi tí ó ń gbé. Gíríìkì sọ ní tààrà pé “wọ ilé kan lọ,” kò sì sọ pé ilé tirẹ̀ ni.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “jẹ búrẹ́dì pàápàá”; ìyẹn ni pé, jẹ oúnjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Ó sì wọ ... lọ
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ historical present nínú Gíríìkì. Yorùbá kò fi àmì àsìkò hàn lórí ọ̀rọ̀-ìṣe ní ọ̀nà kan náà; “ó sì wọ ... lọ” jẹ́ àrọ́sọ tó ṣe déédé, ó sì mú ìṣísẹ̀ náà hàn kedere.
- source_word: εἰς οἶκον
  choice: ilé kan
  rationale: οἶκον kò ní article tàbí possessive; “ilé kan” kò sọ pé ilé tirẹ̀ ni, kò sì sọ pé ilé pàtó tí a ti mọ̀ ni. “Ilé” lè tún túmọ̀ sí ibi tí ẹni ń gbé, nítorí náà a fi àṣàyàn “ilé” ní ìtumọ̀ home sínú àlàyé ìsàlẹ̀.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: ogunlọ́gọ̀ sì tún péjọ
  rationale: “Péjọ” mú ìtumọ̀ intransitive ti συνέρχεται jáde lọ́nà àdánidá; “tún” ń ṣàfihàn πάλιν, “ogunlọ́gọ̀” sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ὁ ὄχλος.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: tó bẹ́ẹ̀ tí wọn kò fi lè
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń sọ àbájáde, “tó bẹ́ẹ̀ tí ... fi” sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi àbájáde hàn. “Wọn” pa ìtọ́kasí plural αὐτούς mọ́ láì fi ẹni tí Gíríìkì kò dárúkọ kún un.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: jẹun pàápàá
  rationale: ἄρτον túmọ̀ ní tààrà sí búrẹ́dì, ṣùgbọ́n nínú gbólóhùn yìí ó jẹ́ ọ̀nà ìsọ̀rọ̀ fún jíjẹ oúnjẹ tàbí jíjẹun. “Jẹun” jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó ní àmì ohùn níbi tó yẹ, ní ọ̀nà ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A tú historical present sí àrọ́sọ Yorùbá àdánidá, a sì pa àbájáde àti plural “wọn” mọ́ láì yan ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
