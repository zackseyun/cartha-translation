id: MRK.3.4
reference: Mark 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ṣé ó bófin mu láti ṣe rere ní ọjọ́ ìsinmi tàbí láti ṣe ibi, láti gba ẹ̀mí là tàbí láti pa?” Ṣùgbọ́n wọ́n dákẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Ṣé ó bófin mu
  rationale: Nínú àríyànjiyàn nípa ohun tí òfin ọjọ́ ìsinmi fàyè gbà, gbólóhùn yìí sọ ìbéèrè nípa ohun tí ó tọ́ lábẹ́ òfin, kì í ṣe ohun tí ènìyàn kàn lè ṣe.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, ó jẹ́ àṣà-ìsọ̀rọ̀ Koiné fún ọjọ́ ìsinmi; ẹyọ ni ó bá Yorùbá àdánidá àti ọ̀rọ̀ ọjọ́ pàtó yìí mu.
- source_word: ἀγαθοποιῆσαι
  choice: láti ṣe rere
  rationale: Ó túmọ̀ sí ṣíṣe ohun rere tàbí ohun tí yóò ṣe ẹlòmíràn láǹfààní; ‘ṣe rere’ jẹ́ kedere, ó sì bá ìyàtọ̀ inú ẹsẹ náà mu.
- source_word: κακοποιῆσαι
  choice: láti ṣe ibi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣe ibi tàbí ṣíṣe ẹnìkan ní ibi. ‘Ṣe ibi’ pa ìtumọ̀ ìwà rere àti búburú mọ́, láì dín un kù sí ìpalára ara nìkan.
- source_word: ψυχὴν
  choice: ẹ̀mí
  rationale: Nínú ìyàtọ̀ rẹ̀ pẹ̀lú pípa, ψυχή ń tọ́ka sí ìyè ènìyàn. ‘Gba ẹ̀mí là’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pípa ìyè mọ́, kì í ṣe ẹ̀mí aláìlẹ́ran nìkan.
- source_word: σῶσαι
  choice: láti gba ... là
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ìgbàlà tàbí pípa ẹ̀mí mọ́.
- source_word: ἀποκτεῖναι
  choice: láti pa
  rationale: ‘Pa’ mú ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ náà jáde láì fi ìtumọ̀ àfikún bí ‘pànìyàn’ kún un.
- source_word: ἐσιώπων
  choice: wọ́n dákẹ́
  rationale: Ó sọ ìdákẹ́jẹ tí ó tẹ̀ síwájú gẹ́gẹ́ bí ìdáhùn wọn; gbólóhùn náà jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ àṣà-ìsọ̀rọ̀ nípa ọjọ́ ìsinmi nínú àríyànjiyàn òfin
  choice: ní ọjọ́ ìsinmi
  alternative: ní àwọn ọjọ́ ìsinmi
  rationale: Ọ̀pọ̀ nínú Gíríìkì jẹ́ àṣà-ìsọ̀rọ̀ tí ó lè tọ́ka sí ọjọ́ ìsinmi kan. Ẹyọ náà dá ìtumọ̀ ọ̀rọ̀ inú àyíká sílẹ̀, ó sì yẹra fún èrò pé Jesu ń sọ̀rọ̀ nípa ọ̀pọ̀ ọjọ́ ọ̀tọ̀ọ̀tọ̀.
- issue: Ìyàtọ̀ ἀγαθοποιῆσαι àti κακοποιῆσαι
  choice: ṣe rere ... ṣe ibi
  alternative: ṣe rere ... ṣe ìpalára
  rationale: ‘Ṣe ibi’ pa ààyè ìtumọ̀ ìwà búburú àti ìpalára mọ́; ọ̀rọ̀ tí ó tẹ̀ lé e nípa gbígba ẹ̀mí là tàbí pípa ló mú abala ìpalára hàn kedere.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘ọjọ́ ìsinmi’ fún Sabbath, ‘Ṣé ó bófin mu’ fún ìbéèrè òfin, àti ‘wọ́n dákẹ́’ láti mú ìtàn náà rọrùn láti lóye. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí náà kò sí àmì àlàyé nínú ọ̀rọ̀ pàtàkì.
