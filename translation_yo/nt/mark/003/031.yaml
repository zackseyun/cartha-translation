base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: yo
  text: Nígbà náà ni ìyá rẹ̀ àti àwọn arákùnrin rẹ̀ dé; wọ́n dúró níta, wọ́n sì ránṣẹ́ sí i[a] láti pè é[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi ìhìn ránṣẹ́ sí i.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti pè é wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nígbà náà ni
  rationale: Καί ń tẹ ìtàn náà síwájú níbí; ‘Nígbà náà ni’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹ̀síwájú ìtàn hàn.
- source_word: ἔρχονται
  choice: dé
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ present historical nínú ìtàn; ‘dé’ sọ ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ ní ọ̀nà Yorùbá tó rọrùn, ó sì tún mú ìtumọ̀ wíwá sí ibi náà jáde.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ìyá rẹ̀
  rationale: Ìtumọ̀ tààrà fún gbólóhùn ohun-ìní náà ni èyí.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: ἀδελφοί jẹ́ akọ ní ọ̀pọ̀; ‘àwọn arákùnrin rẹ̀’ pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì pinnu irú ìbátan wọn ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἔξω στήκοντες
  choice: wọ́n dúró síta
  rationale: Èyí sọ ipò wọn níta ní Yorùbá àdánidá, ó sì pa iṣẹ́ participle náà mọ́ gẹ́gẹ́ bí ipò tó bá ìṣe pàtàkì náà lọ.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: wọ́n sì ránṣẹ́ sí i
  rationale: Gbólóhùn náà lè tọ́ka sí rírán ènìyàn tàbí ìhìn sí ọ̀dọ̀ rẹ̀; ‘ránṣẹ́ sí i’ jẹ́ àdánidá, ó sì pa àyè fún ìtumọ̀ méjèèjì mọ́.
- source_word: καλοῦντες αὐτόν
  choice: láti pè é
  rationale: Participle náà ṣàlàyé ète ríránṣẹ́ náà. ‘Láti pè é’ sun mọ́ ọ̀rọ̀ Gíríìkì, ó sì lè túmọ̀ sí kí wọ́n ké sí i tàbí kí wọ́n ní kó wá.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn arákùnrin rẹ̀’
  choice: Túmọ̀ ọ́ ní tààrà sí ‘àwọn arákùnrin rẹ̀’ láì fi àlàyé irú ìbátan náà kún un.
  alternative: Kí a túmọ̀ ọ́ sí àwọn ará tàbí ìbátan rẹ̀ lápapọ̀.
  rationale: Ẹsẹ náà lo ἀδελφοί, tí ìtumọ̀ rẹ̀ tó hàn gbangba níbí jẹ́ ‘àwọn arákùnrin.’ Ìtumọ̀ kò gbọ́dọ̀ dáhùn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ nípa bóyá arákùnrin ọmọ ìyá kan náà ni wọ́n tàbí ìbátan mìíràn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi àmì ohùn sí gbogbo ibi tí ó yẹ, a sì ya gbolohun náà sí apá méjì pẹ̀lú àmì àbọ̀ láti jẹ́ kí ìṣàn ìtàn náà ṣe kedere.
