id: MRK.3.35
reference: Mark 3:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá ṣe ìfẹ́ Ọlọ́run, ẹni náà[a] ni arákùnrin mi àti arábìnrin mi àti ìyá mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun ni.” Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ atọ́ka tí a tẹnumọ́, ní tààrà, “ẹni yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: ẹnikẹ́ni tí ó bá ṣe
  rationale: Àpapọ̀ ọ̀rọ̀ arọ́pò-orúkọ, ἄν, àti ọ̀rọ̀-ìṣe subjunctive ń tọ́ka sí ipò gbogbogbò tí kò dá lórí ẹni kan pàtó; “ẹnikẹ́ni tí ó bá ṣe” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “whoever does.”
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń fi ìdí tàbí àlàyé fún ọ̀rọ̀ tó ṣáájú hàn; “Nítorí” pa ìsopọ̀ yẹn mọ́ ní kedere.
- source_word: ποιήσῃ
  choice: ṣe
  rationale: ποιέω níbí túmọ̀ sí ṣíṣe tàbí mímú ohun kan ṣẹ; “ṣe” jẹ́ ọ̀rọ̀ tààrà àti àdánidá pẹ̀lú “ìfẹ́ Ọlọ́run.”
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe déédéé láti sọ ohun tí Ọlọ́run fẹ́ tàbí pinnu.
- source_word: οὗτος
  choice: ẹni náà
  rationale: οὗτος jẹ́ ọ̀rọ̀ atọ́ka tí ó ní ìtẹnumọ́. “Ẹni náà” jẹ́ àdánidá ní Yorùbá lẹ́yìn “ẹnikẹ́ni tí ó bá ...,” ó sì tẹ ẹni tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe náà mọ́lẹ̀ láìfi akọ tàbí abo kún un.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: arákùnrin mi àti arábìnrin mi àti ìyá mi
  rationale: A pa gbogbo àwọn ọ̀rọ̀ ìbátan mẹ́tẹ̀ẹ̀ta mọ́ lọ́tọ̀ọ̀tọ̀, pẹ̀lú ìtumọ̀ akọ àti abo wọn, kí agbára àkójọ ọ̀rọ̀ Jesu má bàjẹ́.
- source_word: ἐστίν
  choice: ni
  rationale: “Ni” ni copula Yorùbá tó bá ìdánimọ̀ ẹni mu ní gbólóhùn yìí.
theological_decisions:
- issue: Bí a ṣe máa fi ẹni kan ṣoṣo hàn nígbà tí àwọn ọ̀rọ̀ ìbátan akọ àti abo wà nínú àpólà ìròyìn
  choice: ẹni náà
  alternative: òun
  rationale: “Ẹni náà” pa ẹyọ ọ̀rọ̀ Gíríìkì àti ìtẹnumọ́ οὗτος mọ́, láìjẹ́ kí a fi akọ nìkan hàn níbi tí Jesu ti dárúkọ arákùnrin, arábìnrin, àti ìyá.
- issue: Irú ìtumọ̀ tí ọ̀rọ̀ Jesu ní nípa ìdílé
  choice: A pa “arákùnrin,” “arábìnrin,” àti “ìyá” mọ́ gẹ́gẹ́ bí àwòrán ìbátan ìdílé
  alternative: ẹni ìdílé mi
  rationale: Jesu lo ọ̀rọ̀ ìbátan mẹ́tẹ̀ẹ̀ta ní pàtó láti ṣàlàyé ìdílé rẹ̀ ní ìbámu pẹ̀lú ṣíṣe ìfẹ́ Ọlọ́run. Ṣíṣe wọn ní ọ̀rọ̀ gbogbogbò “ẹni ìdílé” yóò dín agbára ọ̀rọ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní. A lo “tí ó bá ṣe” fún ipò gbogbogbò, “ẹni náà ni” sì ń mú ìtẹnumọ́ Gíríìkì wá ní Yorùbá tó rọrùn láti lóye.
