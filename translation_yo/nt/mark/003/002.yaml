source:
  edition: SBLGNT
  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: yo
  text: Wọ́n sì ń ṣọ́ ọ pẹkipẹki láti rí bóyá yóò wo ọkùnrin náà sàn ní ọjọ́ Ìsinmi,[a] kí wọ́n lè fi ẹ̀sùn kàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú ọ̀rọ̀ Gíríìkì, a lo ìrísí ọ̀pọ̀ náà, “ní àwọn ọjọ́ Ìsinmi”; ìrísí yìí lè jẹ́ ọ̀nà ìsọ̀rọ̀ fún ọjọ́ Ìsinmi kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: ń ṣọ́ ọ pẹkipẹki
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ìṣọ́ náà ń bá a lọ, παρατηρέω sì níbí ń tọ́ka sí wíwo ẹni pẹkipẹki pẹ̀lú ète búburú.
- source_word: εἰ
  choice: láti rí bóyá
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe tó túmọ̀ sí ṣíṣọ́ tàbí àkíyèsí, gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àìṣe-taara.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ Ìsinmi
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni fọ́ọ̀mù Gíríìkì, ó lè jẹ́ àṣà-ìsọ̀rọ̀ Koiné fún ọjọ́ Ìsinmi kan; ẹyọ jẹ́ èdè Yorùbá tó ṣe kedere, akọsilẹ̀ sì ṣàlàyé fọ́ọ̀mù orísun.
- source_word: θεραπεύσει
  choice: yóò wo ... sàn
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú nínú ìbéèrè àìṣe-taara ni a túmọ̀ lọ́nà àdánidá pé “yóò”; “wo ... sàn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwòsàn.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó fi ète ìṣọ́ wọn hàn ní èdè Yorùbá àdánidá.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: fi ẹ̀sùn kàn án
  rationale: Ó pa ìtumọ̀ ẹ̀sùn mọ́ láìfi dandan sọ pé ẹjọ́ ilé-ẹjọ́ tàbí ìgbẹ́jọ́ ni.
theological_decisions:
- issue: Ète àwọn tó ń ṣọ́ Jésù
  choice: A sọ pé wọ́n ń ṣọ́ ọ láti rí ohun tí wọn yóò fi ẹ̀sùn kàn án.
  alternative: Láti mú un lọ sí ilé-ẹjọ́ tàbí láti ṣe ìgbẹ́jọ́ rẹ̀.
  rationale: κατηγορέω lè ní ìtumọ̀ tó jẹ mọ́ ẹjọ́, ṣùgbọ́n ẹsẹ̀ náà kò sọ pé ìlànà ilé-ẹjọ́ ti bẹ̀rẹ̀; a kò gbọ́dọ̀ fi ohun tí orísun kò sọ kún un.
- issue: Ẹni tí Jésù lè wò sàn
  choice: ọkùnrin náà
  alternative: òun
  rationale: αὐτόν ń tọ́ka sí ọkùnrin tó ní ọwọ́ gbígbẹ nínú ẹsẹ̀ tó ṣáájú; lílo “ọkùnrin náà” mú ìtọ́kasí náà ṣe kedere láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. “Ń ṣọ́ ọ pẹkipẹki” pa ìṣe tó ń bá a lọ àti ìfura wọn mọ́; “fi ẹ̀sùn kàn án” yẹra fún mímú ọ̀rọ̀ náà le dé ìgbẹ́jọ́ ilé-ẹjọ́.
