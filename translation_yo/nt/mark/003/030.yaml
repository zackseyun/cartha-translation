  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: yo
  text: nítorí wọ́n ń sọ pé, “Ó ní ẹ̀mí àìmọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó bá èdè Yorùbá mu jù, “Ẹ̀mí àìmọ́ ń gbé inú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tí Jésù sọ ṣáájú hàn ní kedere; ìtumọ̀ rẹ̀ níbí ni ‘nítorí’.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì tọ́ka sí ọ̀rọ̀ tí wọ́n ń sọ lọ́wọ́ tàbí tí wọ́n máa ń sọ léraléra; ‘wọ́n ń sọ’ pa apá yìí mọ́.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: ẹ̀mí àìmọ́
  rationale: Èyí jẹ́ ọ̀nà tó ṣe déédéé láti túmọ̀ gbólóhùn Ìhìn Rere fún ẹ̀mí èṣù, ó sì pa ìsopọ̀ pẹ̀lú ìtumọ̀ ‘àìmọ́’ mọ́.
- source_word: ἔχει
  choice: ó ní
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí ‘ní’; a kò mú ìtumọ̀ àlàyé ‘ẹ̀mí àìmọ́ ń gbé inú rẹ̀’ wọ inú ẹsẹ̀ pàtàkì.
theological_decisions:
- issue: Irú ẹ̀sùn tí wọ́n fi kan Jésù
  choice: Pa ẹ̀sùn tààrà náà mọ́ pé, ‘Ó ní ẹ̀mí àìmọ́.’
  alternative: ‘Ẹ̀mí àìmọ́ ń gbé inú rẹ̀.’
  rationale: Ọ̀rọ̀ náà ròyìn ẹ̀sùn líle àwọn alátakò láìdín agbára rẹ̀ kù tàbí láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un. Àṣàyàn míì wà nínú àlàyé ìsàlẹ̀ láti jẹ́ kí ìtumọ̀ àṣà-ọ̀rọ̀ rẹ̀ ṣe kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ adayeba, ọlọ́lá, ó sì pa ìtẹnumọ́ àti ìtumọ̀ orísun Gíríìkì mọ́.
