source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: yo
  text: 'Ó sì pè wọ́n sí ọ̀dọ̀ rẹ̀, ó sì ń bá wọn sọ̀rọ̀ nípasẹ̀ àwọn àkàwé: “Báwo ni Satani ṣe lè lé Satani jáde?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ó pè wọ́n wá sọ́dọ̀ ara rẹ̀
  rationale: Aorist middle participle náà fi hàn pé Jésù kọ́kọ́ pe wọ́n wá sí ọ̀dọ̀ ara rẹ̀; gbolohun Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtẹ̀lé ìṣe náà mọ́.
- source_word: ἐν παραβολαῖς
  choice: nípasẹ̀ àwọn àkàwé
  rationale: παραβολή níbí tọ́ka sí ọ̀nà fífi àfiwé tàbí àpẹẹrẹ sọ̀rọ̀. A pa ọ̀pọ̀-orúkọ náà mọ́ pẹ̀lú “àwọn àkàwé,” láì fi irú lítíréṣọ̀ kan pàtó kún un.
- source_word: ἔλεγεν
  choice: ó ń bá wọn sọ̀rọ̀
  rationale: Imperfect náà ń fi ìṣe tí ń lọ lọ́wọ́ hàn; “ó ń bá wọn sọ̀rọ̀” mú aspect yẹn jáde ní Yorùbá àdánidá.
- source_word: Πῶς δύναται
  choice: Báwo ni ... ṣe lè
  rationale: Àkójọpọ̀ yìí ṣe àfihàn ìbéèrè àsọyé nípa ohun tí ó ṣeé ṣe; ó pa agbára ìpèníjà inú Gíríìkì mọ́.
- source_word: Σατανᾶς
  choice: Satani
  rationale: A mú orúkọ/oyè náà wọ Yorùbá ní ìrísí tí ó wọ́pọ̀, “Satani”; nominative àti accusative jẹ́ bákan náà ní ìtumọ̀ Yorùbá.
- source_word: ἐκβάλλειν
  choice: lé ... jáde
  rationale: Ní àyíká Máàkù, ọ̀rọ̀ náà sábà ń tọ́ka sí lílé ẹ̀mí èṣù jáde. “Lé ... jáde” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí kò sì ṣe àlàyé ju orísun lọ.
theological_decisions:
- issue: Agbára ìbéèrè Jésù nípa Satani tí yóò lé Satani jáde
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìbéèrè àsọyé nípa àìṣeéṣe: “Báwo ni Satani ṣe lè lé Satani jáde?”'
  alternative: “Ọ̀nà wo ni Satani fi lè lé Satani jáde?”
  rationale: Gíríìkì béèrè nípa ṣíṣeéṣe, àyíká ọ̀rọ̀ sì ń fi àìbáramu ẹ̀sùn náà hàn. Ìtumọ̀ náà pa agbára ìbéèrè mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lo “àkàwé” fún ọ̀nà fífi àfiwé kọ́ni, àti “lé ... jáde” fún ọ̀rọ̀ exorcism inú àyíká náà.
