  source_fidelity: 'Ìtumọ̀ náà ń gbé gbogbo àwọn apá pàtàkì ti Gíríìkì náà kalẹ̀ dáadáa: ìṣẹ̀lẹ̀ tí ó máa ń ṣẹlẹ̀ léraléra, ‘àwọn ẹ̀mí àìmọ́,’ ìṣubú níwájú Jésù, igbe náà, àti oyè náà ‘Ọmọ Ọlọ́run.’ ‘Dojúbolẹ̀ níwájú rẹ̀’ kò fi ìjọsìn kún ohun tí προσπίπτω sọ.'
  naturalness: Àrọ̀kọ́ náà sunmọ́ Yorùbá òde òní. Bí ó tilẹ̀ jẹ́ pé ‘bá sì rí i’ lè lóye, ‘sì’ níbẹ̀ lè dà bí ìfikún ‘wọn náà rí i’; yíyọ ọ́ kúrò mú gbolóhùn ìṣẹ̀lẹ̀-àṣà náà rọrùn, ó sì yẹ sí i. A tún tún ọ̀rọ̀ àlàyé ìsàlẹ̀ ṣe kí ó lè jẹ́ Yorùbá adayeba.
  terminology: ‘Ẹ̀mí àìmọ́,’ ‘ké jáde,’ àti ‘Ọmọ Ọlọ́run’ jẹ́ àwọn ọ̀rọ̀ tó pé, tó bójú mu, tí wọ́n sì pa ìtumọ̀ àti ipò oyè Gíríìkì mọ́. ‘Dojúbolẹ̀’ dára ju ‘jọ́sìn’ lọ níbi, nítorí ó pa àìdánilójú ìdí ìṣe náà mọ́.
  issues:
