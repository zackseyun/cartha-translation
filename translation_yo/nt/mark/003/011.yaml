id: MRK.3.11
reference: Mark 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: yo
  text: Nígbàkigbà tí àwọn ẹ̀mí àìmọ́ bá rí i, wọ́n a dojúbolẹ̀ níwájú rẹ̀[a], wọ́n a sì ké jáde pé, “Ìwọ ni Ọmọ Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n a ju ara wọn sílẹ̀ níwájú rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pé ènìyàn ṣubú níwájú ẹnì kan láti fi ìtẹríba tàbí ẹ̀bẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: àwọn ẹ̀mí àìmọ́
  rationale: Ó túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà, ó sì pa èrò àìmọ́ mọ́ láì fi ìtumọ̀ ‘ẹ̀mí búburú’ kún un.
- source_word: ὅταν
  choice: nígbàkigbà tí ... bá
  rationale: Àkójọpọ̀ yìí fi hàn pé ìṣẹ̀lẹ̀ náà máa ń ṣẹlẹ̀ léraléra, gẹ́gẹ́ bí ὅταν pẹ̀lú àwọn ọ̀rọ̀-ìṣe aláìpé ṣe túmọ̀ sí níbí.
- source_word: ἐθεώρουν
  choice: rí i
  rationale: ‘Rí i’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìṣe rírí náà; ìtumọ̀ àtúnṣe léraléra wà nínú ‘nígbàkigbà.’
- source_word: προσέπιπτον αὐτῷ
  choice: dojúbolẹ̀ níwájú rẹ̀
  rationale: Ó pa ìṣe fífi ara ṣubú níwájú ẹni kan mọ́, láì pinnu pé ìjọsìn ni wọ́n ń ṣe.
- source_word: ἔκραζον
  choice: ké jáde
  rationale: Ó fi agbára àti ohùn gíga tí κράζω ní hàn ní Yorùbá àdánidá.
- source_word: λέγοντα
  choice: pé
  rationale: Lẹ́yìn ‘ké jáde,’ ‘pé’ ni ọ̀nà Yorùbá tó rọrùn láti mú ọ̀rọ̀ tí wọ́n ké wọlé.
- source_word: Σὺ εἶ
  choice: Ìwọ ni
  rationale: Fífi ‘Ìwọ’ síwájú pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ lọ́nà Yorùbá tó ṣe déédéé.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa ipò orúkọ oyè àti ìwúwo ọ̀rọ̀ nípa ẹni tí Jésù jẹ́ mọ́.
theological_decisions:
- issue: Bóyá kí a tú ìṣubú àwọn ẹ̀mí náà níwájú Jésù sí ìjọsìn tàbí sí fífi ara balẹ̀ lásán
  choice: dojúbolẹ̀ níwájú rẹ̀
  alternative: foríbalẹ̀ fún un / jọ́sìn fún un
  rationale: προσπίπτω lè tọ́ka sí fífi ara ṣubú nítorí ìtẹríba, ẹ̀bẹ̀, tàbí ìfipámúṣẹ; ẹsẹ náà kò sọ ní pàtó pé wọ́n ń jọ́sìn, nítorí náà a pa ìṣe ara náà àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tó sì yé àwọn òǹkàwé òde òní. ‘Wọn a’ ń fi ìṣe àṣà tí ó máa ń ṣẹlẹ̀ léraléra hàn; a yàgò fún ‘jọ́sìn’ kí a má bà a pinnu ohun tí Gíríìkì fi sílẹ̀ ní àìdánilójú.
