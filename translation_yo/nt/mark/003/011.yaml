  to: Nígbàkigbà tí àwọn ẹ̀mí àìmọ́ bá rí i, wọ́n a dojúbolẹ̀ níwájú rẹ̀[a], wọ́n a sì ké jáde pé, “Ìwọ ni Ọmọ Ọlọ́run.”
