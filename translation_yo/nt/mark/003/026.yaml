id: MRK.3.26
reference: Mark 3:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: yo
  text: Bí Sátánì bá sì dìde sí ara rẹ̀, tí ó sì pínyà, kò lè dúró, ṣùgbọ́n ó ti dé òpin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ rẹ̀ ní tààràtà sí i, “ṣùgbọ́n ó ní òpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Sátánì
  rationale: Orúkọ ẹni náà ni a ṣe àkọ̀lò rẹ̀ ní ìrísí Yorùbá tí ó wọ́pọ̀, dípò kí a tú ìtumọ̀ orúkọ náà.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: dìde sí ara rẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí dídìde láti dojú kọ ara ẹni; ‘dìde sí ara rẹ̀’ jẹ́ àdámọ̀ Yorùbá, ó sì pa ìtumọ̀ ìtakò mọ́.
- source_word: ἐμερίσθη
  choice: pínyà
  rationale: Ó sọ ipò ìyapa inú hàn láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: οὐ δύναται στῆναι
  choice: kò lè dúró
  rationale: Ìtumọ̀ yìí jẹ́ kíkún, ó sì pa àwòrán Gíríìkì mọ́ pé ẹni tí ó pínyà kò lè dúró tàbí fara da ipò náà.
- source_word: ἀλλὰ τέλος ἔχει
  choice: ṣùgbọ́n ó ti dé òpin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdámọ̀ láti sọ pé òpin ti dé bá a, láìṣàlàyé àsìkò tàbí ẹ̀kọ́ ní àfikún sí ohun tí gbolohun Gíríìkì sọ.
theological_decisions:
- issue: Irú ọ̀rọ̀ tí ẹsẹ̀ náà sọ nípa ìṣubú Sátánì
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí àbájáde ọgbọ́n inú àríyànjiyàn Jésù pé ìjọba tí ó pínyà kò lè dúró.
  alternative: Kí a mú un gbooro sí ìkéde ẹ̀kọ́ nípa ìparun Sátánì ní òpin ayé.
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ìdáhùn sí ẹ̀sùn pé Jésù ń fi agbára Sátánì lé àwọn ẹ̀mí èṣù jáde; ẹsẹ̀ yìí fúnra rẹ̀ kò béèrè pé kí a sọ ohun tó ju àbájáde ìyapa náà lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A fi àmì àlàyé [a] sí ẹ̀gbẹ́ gbólóhùn tí ó ń ṣàlàyé.
