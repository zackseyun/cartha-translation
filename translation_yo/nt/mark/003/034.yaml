source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: yo
  text: Ó sì yí ojú wo àwọn tí wọ́n jókòó ní àyíká rẹ̀, ó wí pé, “Ẹ wò ó, ìyá mi àti àwọn arákùnrin mi[a] nìyí!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin mi.” Gíríìkì ní “àwọn arákùnrin,” ṣùgbọ́n ó ṣeé ṣe kí àwọn obìnrin náà wà lára ẹgbẹ́ àwọn tó yí Jésù ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Ó sì wo … yí i ká
  rationale: Èyí fi hàn pé Jésù yí ojú rẹ̀ wo àwọn tó wà ní gbogbo àyíká rẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: àwọn tí ó jókòó yí i ká ní àyíká
  rationale: Ìtumọ̀ yìí pa ìjókòó wọn, wíwà wọn yí Jésù ká, àti ìtẹnumọ́ κύκλῳ mọ́.
- source_word: λέγει
  choice: ó wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ìtàn, Yorùbá máa ń lo ‘ó wí pé’ lọ́nà àdánidá nínú ìtàn láìsọ ìṣe náà di aláìláàyè.
- source_word: Ἴδε
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí àwọn olùgbọ́ sí ohun tí Jésù fẹ́ fi hàn; ‘Ẹ wò ó’ jẹ́ ti òde òní, ó sì ní agbára tó yẹ.
- source_word: μήτηρ
  choice: ìyá
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ọ̀rọ̀ náà.
- source_word: ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Gíríìkì jẹ́ ọ̀pọ̀ akọ ní gírámà; ìtumọ̀ yìí pa ìrísí ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ tó lè gbòòrò sí àwọn obìnrin.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφοί ní àyíká àwọn ọmọlẹ́yìn tí ó ṣeé ṣe kí àwọn obìnrin wà lára wọn
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn ọmọ ìyá
  rationale: A pa akọ ọ̀pọ̀ inú ọ̀rọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, ṣùgbọ́n a kò fi èyí pinnu pé àwọn obìnrin kò sí nínú ẹgbẹ́ náà; àlàyé ìsàlẹ̀ pa ìtumọ̀ gbígbòòrò náà mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Nìyí’ ń mú ìtọ́kasí Ἴδε jáde lọ́nà àdánidá, ‘Ẹ wò ó’ sì ń pa ìpè sí àfiyèsí mọ́.
