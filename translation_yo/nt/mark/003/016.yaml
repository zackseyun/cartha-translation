  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: yo
  text: Ó sì yan àwọn méjìlá náà, ó sì fún Símónì ní orúkọ Pétérù[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orúkọ Pétérù túmọ̀ sí “Àpáta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: yan
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Jésù yan àwọn ọmọ-ẹ̀yìn náà, ó sì fi wọ́n múlẹ̀ gẹ́gẹ́ bí ẹgbẹ́ àwọn méjìlá; “yan” jẹ́ èdè Yorùbá àdánidá tí kò fi ọ̀rọ̀ iṣẹ́ ìjọ kan kún un.
- source_word: τοὺς δώδεκα
  choice: àwọn méjìlá náà
  rationale: Ó tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn méjìlá tí a ti mọ̀; “náà” fi ìdánimọ̀ ẹgbẹ́ náà hàn láìjẹ́ pé a gbé ìtumọ̀ mìíràn wọlé.
- source_word: ἐπέθηκεν ὄνομα
  choice: sọ ... ní
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí fífi orúkọ kan lé ẹnì kan; “sọ Símónì ní Pétérù” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fún un ní orúkọ náà.
- source_word: Σίμωνι
  choice: Símónì
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: Πέτρον
  choice: Pétérù
  rationale: Nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni níbí, a ṣe àfọwọ́kọ rẹ̀ sí Yorùbá dípò kí a túmọ̀ rẹ̀ sí “Àpáta”; ìtumọ̀ orúkọ náà wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìṣe Jésù sí àwọn méjìlá
  choice: yan àwọn méjìlá náà
  alternative: dá àwọn méjìlá náà sílẹ̀; fi àwọn méjìlá náà sípò
  rationale: “Yan” mú èrò yíyan àti fífi ẹgbẹ́ náà múlẹ̀ jáde, ṣùgbọ́n kò fi èdè ipò àṣẹ ìjọ tí ó lè pọ̀ ju ohun tí Gíríìkì sọ lọ kún un.
- issue: Bí a ṣe mú Πέτρον jáde
  choice: Pétérù
  alternative: Àpáta
  rationale: Πέτρον jẹ́ orúkọ tí a fún Símónì níbí. Àfọwọ́kọ orúkọ náà pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí orúkọ ẹni mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé ìtumọ̀ rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa àsopọ̀ gbolohun náà mọ́ pẹ̀lú àmì kọ́má ní ìparí, nítorí ẹsẹ yìí ń tẹ̀ síwájú sínú àkójọ orúkọ.
