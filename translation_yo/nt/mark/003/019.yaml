source:
  edition: SBLGNT
  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: yo
  text: àti Júdásì Iskáríótù, ẹni tí ó sì ṣe ọ̀dàlẹ̀ sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó sì fi í lé ọwọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fi lé ọwọ́” tàbí “fà lé ọwọ́”; níbí, nítorí ohun tí Júdásì ṣe sí Jésù, “ṣe ọ̀dàlẹ̀ sí i” ni a lò.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti
  rationale: Ọ̀rọ̀ àsopọ̀ yìí so orúkọ tó gbẹ̀yìn nínú àkọsílẹ̀ náà mọ́ àwọn tó ṣáájú.
- source_word: Ἰούδαν
  choice: Júdásì
  rationale: A kọ orúkọ ẹni náà ní ìrísí tí ó wọ́pọ̀ ní Yorùbá.
- source_word: Ἰσκαριώθ
  choice: Iskáríótù
  rationale: Orúkọ àfikún ni; nítorí ìtumọ̀ ìpilẹ̀ rẹ̀ kò dájú níbí, a ṣe àkọsílẹ̀ ohùn rẹ̀ dípò ṣíṣe ìtumọ̀ àròsọ.
- source_word: ὃς
  choice: ẹni tí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn àpèjúwe tó dá Júdásì mọ̀ ní kedere.
- source_word: καὶ
  choice: sì
  rationale: Ní inú gbólóhùn àpèjúwe náà, ó fi àfikún ìdánimọ̀ Júdásì hàn lọ́nà àdánidá ní Yorùbá.
- source_word: παρέδωκεν
  choice: fi í lé wọn lọ́wọ́
  rationale: Ó pa ìtumọ̀ ìpìlẹ̀ ti ‘fá ẹni lé ẹlòmíràn lọ́wọ́’ mọ́, ó sì jẹ́ kí ọ̀rọ̀ àyíká fi ìwà ọ̀dàlẹ̀ inú ìṣe Júdásì hàn láì fi ìtumọ̀ kan ṣoṣo rọ́pò àìdájú gíríìkì.
- source_word: αὐτόν
  choice: í
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbàṣe náà tọ́ka sí Jésù; Yorùbá máa ń lo ‘í’ lẹ́yìn ‘fi’ nínú ìkọ̀lé yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδίδωμι nípa ohun tí Júdásì ṣe sí Jésù
  choice: fi í lé wọn lọ́wọ́
  alternative: dà á / ṣe ọ̀dàlẹ̀ sí i
  rationale: Ọ̀rọ̀ gíríìkì náà ní ìtumọ̀ gbooro ti fífi ẹni lé ẹlòmíràn lọ́wọ́, bí ó tilẹ̀ jẹ́ pé nínú ìtàn Júdásì ó ní agbára ìtumọ̀ ọ̀dàlẹ̀. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ ìpìlẹ̀ mọ́, àlàyé ìsàlẹ̀ sì sọ agbára ọ̀dàlẹ̀ náà di mímọ̀.
translation_notes:
  register: Yorùbá àgbàlágba tó ṣeé yé, tó sì ní iyì ni a lò. A fi àmì ohùn síbi tí ó bá jẹ́ àdánidá, a sì yan ìkọ̀lé ‘fi í lé wọn lọ́wọ́’ láti pa ìtumọ̀ orísun àti agbára ọ̀dàlẹ̀ ọ̀rọ̀ àyíká mọ́.
