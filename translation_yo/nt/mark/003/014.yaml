base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: yo
  text: Ó sì yan àwọn méjìlá[a], kí wọn lè wà pẹ̀lú rẹ̀, àti kí ó lè rán wọn jáde láti wàásù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀dà àfọwọ́kọ kan fi kún un pé, “àwọn tí ó tún pè ní àpọ́sítélì.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “láti kéde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: yan
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ lè jẹ́ ‘ṣe,’ ní àyíká ọ̀rọ̀ yìí ó túmọ̀ sí yíyan tàbí yíyan àwọn méjìlá sí ipò kan. ‘Yan’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi èrò àfikún sí ẹsẹ náà.
- source_word: δώδεκα
  choice: àwọn méjìlá
  rationale: Èdè Gíríìkì sọ ‘méjìlá’ láì darúkọ ohun tí wọ́n jẹ́. Yorùbá nílò ‘àwọn’ níbí láti fi hàn pé ènìyàn ni a ń tọ́ka sí, ṣùgbọ́n a kò fi orúkọ oyè ‘àpọ́sítélì’ kún un.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: kí wọn lè wà pẹ̀lú rẹ̀
  rationale: ‘Kí ... lè’ fi ète tí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń sọ hàn ní Yorùbá àdánidá.
- source_word: ἀποστέλλῃ
  choice: kí ó lè rán wọn jáde
  rationale: ‘Rán ... jáde’ mú ìtumọ̀ rírán wọn lọ fún iṣẹ́ hàn, láì sọ wọ́n di ‘àpọ́sítélì’ nínú gbólóhùn tí orísun kò ti lo oyè náà.
- source_word: κηρύσσειν
  choice: láti wàásù
  rationale: ‘Wàásù’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún pípolongo ọ̀rọ̀ ní gbangba nínú àyíká Ìhìn Rere; ‘láti kéde’ ṣì jẹ́ àṣàyàn ìtumọ̀ tó ṣeé ṣe.
theological_decisions:
- issue: Bóyá kí a fi oyè ‘àpọ́sítélì’ tí kò sí nínú ọ̀rọ̀ àkọ́kọ́ kún ẹsẹ náà
  choice: A kò fi ‘àpọ́sítélì’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Ó sì yan àwọn méjìlá, àwọn tí ó tún pè ní àpọ́sítélì...
  rationale: Ọ̀rọ̀ SBLGNT tí a pèsè sọ pé ó yan àwọn méjìlá nìkan; gbolohun nípa pípè wọ́n ní àpọ́sítélì jẹ́ àfikún inú àwọn ẹ̀dà àfọwọ́kọ kan. Nítorí náà, a pa ọ̀rọ̀ pàtàkì mọ́ gẹ́gẹ́ bí orísun, a sì fi àṣàyàn náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ó jẹ́ ọ̀rọ̀ àdánidá, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ó sì’ láti pa ìsopọ̀ καὶ mọ́, ‘rẹ̀’ sì tọ́ka sí Jésù láì tún orúkọ tí kò sí nínú Gíríìkì sọ.
