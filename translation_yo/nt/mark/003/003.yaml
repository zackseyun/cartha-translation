translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò. A tú historical present náà sí irú àsìkò ìtàn tí ó jẹ́ àdánidá ní Yorùbá, a sì fi àmì ohùn sí ibi tí ó yẹ.
