base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: yo
  text: Ó sì sọ fún ọkùnrin tí ọwọ́ rẹ̀ rọ[a] pé, “Dìde, kí o sì wá sí àárín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ọwọ́ rẹ̀ gbẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì sọ
  rationale: Aorísì ìtàn ni a lò ní Yorùbá fún ìtàn tí ó ń lọ lọ́wọ́; ó jẹ́ ọ̀nà àdánidá láti fi historical present Gíríìkì hàn láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ἀνθρώπῳ
  choice: ọkùnrin
  rationale: Ẹni tí a ń tọ́ka sí jẹ́ akọ ní àyíká ọ̀rọ̀ náà; “ọkùnrin” bá ìtọ́kasí náà mu.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: tí ọwọ́ rẹ̀ rọ
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe ọwọ́ tí kò ṣiṣẹ́ bó ṣe yẹ. “Ọwọ́ rẹ̀ rọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yẹra fún fífi irú àìsàn kan pàtó kún ohun tí Gíríìkì kò sọ.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: Àṣẹ náà túmọ̀ sí láti dìde tàbí dúró sókè; “Dìde” jẹ́ àṣẹ kúkúrú, tààrà, tí ó bá Gíríìkì mu.
- source_word: εἰς τὸ μέσον
  choice: kí o sì wá sí àárín
  rationale: εἰς fi ìṣíkiri sí ibi kan hàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘sí àárín’ mọ́.
