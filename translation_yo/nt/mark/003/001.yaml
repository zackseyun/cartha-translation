  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: yo
  text: Ó sì tún wọ sínú sínágọ́gù kan[a]. Níbẹ̀ ni ọkùnrin kan wà[c] tí ọwọ́ rẹ̀ ti gbẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínágọ́gù náà,” bí Máàkù bá ń tọ́ka sí sínágọ́gù pàtó kan tí a ti mọ̀ nínú àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ọwọ́ rẹ̀ ti rẹgẹ́,” tàbí “ọwọ́ rẹ̀ ti wọ́.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè tò ó sí, “Ọkùnrin kan sì wà níbẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: Καὶ
  choice: Ó sì
  rationale: “Sì” ń pa ìsopọ̀ ìtàn tí Καὶ ní mọ́; a fi “Ó” kún un nítorí èdè Yorùbá nílò arọ́pò-orúkọ gẹ́gẹ́ bí olùṣe ọ̀rọ̀-ìṣe.
- source_word: εἰσῆλθεν
  choice: wọ inú
  rationale: Èyí fi ìṣípò láti òde sí inú hàn ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìwọlé.
- source_word: πάλιν
  choice: tún
  rationale: “Tún” ń fi hàn pé ó ṣe ìṣe náà lẹ́ẹ̀kan sí i, bí πάλιν ṣe túmọ̀ sí.
- source_word: εἰς συναγωγήν
  choice: inú sínágọ́gù kan
  rationale: “Inú” pa agbára εἰς mọ́ lẹ́yìn ọ̀rọ̀-ìṣe ìṣípò, “kan” sì ń fi àìsí àpilẹ̀kọ ní Gíríìkì hàn láì sọ pé ó dájú pé sínágọ́gù pàtó kan ni.
- source_word: ἦν ἐκεῖ
  choice: Níbẹ̀ ni ... wà
  rationale: Ètò ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ wíwà ní ibi náà mọ́.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nínú ìtàn yìí, ἄνθρωπος ń tọ́ka sí ọkùnrin kan; “ọkùnrin kan” jẹ́ kedere, ó sì bá àìní àpilẹ̀kọ mu.
- source_word: ἐξηραμμένην ἔχων τὴν χεῖρα
  choice: tí ọwọ́ rẹ̀ ti rọ
  rationale: Perfect participle náà ṣàpèjúwe ipò ọwọ́ tí ó ti di aláìlera tàbí aláìṣiṣẹ́. “Ọwọ́ rẹ̀ ti rọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọwọ́ tí ó ti rẹ̀wẹ̀sì tàbí dín kù ní agbára, láì fi kún ìtàn náà pé ó ya tàbí gé.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A ya àwọn gbólóhùn méjì náà sọ́tọ̀ kí ìtàn lè ṣàn dáadáa ní Yorùbá, ṣùgbọ́n a pa àwọn ìsopọ̀ àti gbogbo kókó inú Gíríìkì mọ́.
