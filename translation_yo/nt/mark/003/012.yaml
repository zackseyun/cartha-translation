  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: yo
  text: Ó sì kìlọ̀ fún wọn léraléra gidigidi pé kí wọ́n má ṣe fi òun hàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n má ṣe mú un di ẹni tí a mọ̀,” tàbí “kí wọ́n má ṣe fi òun hàn gbangba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: gidigidi léraléra
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àpèjúwe ìṣe, ó sì lè fi líle tàbí àsọtúnsọ ìkìlọ̀ hàn. “Gidigidi léraléra” mú agbára méjèèjì jáde ní Yorùbá àdánidá.
- source_word: ἐπετίμα
  choice: kìlọ̀ fún wọn
  rationale: Ní àyíká yìí, ó túmọ̀ sí ìkìlọ̀ tàbí àṣẹ líle sí àwọn ẹ̀mí àìmọ́; “kìlọ̀ fún wọn” jẹ́ èdè Yorùbá tó ṣe kedere, “gidigidi” sì mú líle ọ̀rọ̀ náà hàn.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ nínú ọ̀ràn ìfúnni yìí tọ́ka sí àwọn ẹ̀mí àìmọ́ tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: ἵνα μὴ
  choice: pé kí wọ́n má ṣe
  rationale: Ó sọ ohun tí ìkìlọ̀ náà ní nínú, pẹ̀lú ìtumọ̀ ìdènà ní Yorùbá tó bójú mu.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: jẹ́ kí àwọn ènìyàn mọ ẹni tí òun jẹ́
  rationale: Gbólóhùn náà túmọ̀ sí mímú ẹni kan di mímọ̀ tàbí fífi ẹni náà hàn gbangba. Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa èrò ìfihàn ìdánimọ̀ mọ́ láìfi ohun tí ẹsẹ náà kò sọ kún un.
theological_decisions:
- issue: Irú ohun tí Jésù pàṣẹ fún àwọn ẹ̀mí àìmọ́ pé kí wọ́n má ṣe
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìdènà pé kí wọ́n má ṣe fi ẹni tí Jésù jẹ́ hàn sí àwọn ènìyàn, láìsọ ìdánimọ̀ náà ní kíkún ju bí ẹsẹ náà ṣe sọ lọ.
  alternative: Kí a sọ ní pàtó pé ó dè wọ́n láti kéde rẹ̀ gẹ́gẹ́ bí Ọmọ Ọlọ́run, tàbí kí a ka á sí àṣẹ ìdákẹ́jẹ́ lásán.
  rationale: Àyíká ẹsẹ ṣáájú tọ́ka sí ìdánimọ̀ Jésù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ kìkì pé kí wọ́n má ṣe mú un di mímọ̀. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó bá àṣà ìkọ̀wé mu. “Òun” tọ́ka padà sí Jésù nínú gbólóhùn alákòóso, nígbà tí “àwọn ènìyàn” jẹ́ ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ lábẹ́ òye gẹ́gẹ́ bí àwọn tí ìfihàn náà yóò dé ọ̀dọ̀ wọn.
