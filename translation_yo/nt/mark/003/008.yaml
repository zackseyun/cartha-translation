  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: yo
  text: Àti láti Jerúsálẹ́mù, àti láti Idumea, àti láti òdìkejì odò Jọ́dánì[a], àti láti àyíká Tírè àti Sídónì[b], ọ̀pọ̀lọpọ̀ ènìyàn, nígbà tí wọ́n gbọ́ ohun tí ó ń ṣe[c], wá sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti agbègbè tí ó wà ní ìkọjá odò Jọ́dánì.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí agbègbè ní ìhà kejì odò náà.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “láti àyíká Tírè àti Sídónì.” Èyí ń tọ́ka sí agbègbè tó yí àwọn ìlú náà ká, kì í ṣe dandan pé inú àwọn ìlú náà ni wọ́n ti wá.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gbogbo ohun tí ó ń ṣe.” Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà lè ní ìtumọ̀ tí ó kárí gbogbo rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: láti Jerúsálẹ́mù
  rationale: ἀπό pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń tọ́ka sí ibi tí àwọn ènìyàn ti wá; “Jerúsálẹ́mù” ni ìkọ̀wé Yorùbá tí ó wọ́pọ̀ fún orúkọ ìlú náà.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: láti Idumea
  rationale: Ó pa ìtumọ̀ ibi ìpilẹ̀ mọ́, ó sì lo orúkọ agbègbè náà láìfi ìtumọ̀ míì kún un.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: láti òdìkejì odò Jọ́dánì
  rationale: πέραν pẹ̀lú genitive túmọ̀ sí agbègbè tí ó wà ní ìkọjá tàbí ní òdìkejì ààlà kan; fífi “odò” kún un mú kí ó ṣe kedere ní Yorùbá pé Jọ́dánì ni odò náà.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: láti agbègbè Tírè àti Sídónì
  rationale: περί níbí ń tọ́ka sí àyíká àwọn ìlú náà, kì í ṣe dandan pé inú àwọn ìlú náà nìkan ni àwọn ènìyàn ti wá.
- source_word: πλῆθος πολύ
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Gbólóhùn yìí ń tẹnu mọ́ iye ènìyàn tí ó pọ̀ gidigidi; “ọ̀pọ̀lọpọ̀ ènìyàn” jẹ́ ọ̀nà àdánidá àti òde òní láti sọ ọ́ ní Yorùbá.
- source_word: ἀκούοντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Ìtumọ̀ yìí so participle náà mọ́ ìṣe pàtàkì ní ọ̀nà tí ó ṣe kedere ní Yorùbá, láìsọ pé gbígbọ́ náà ni ìdí kan ṣoṣo tí wọ́n fi wá.
- source_word: ὅσα ἐποίει
  choice: ohun tí ó ń ṣe
  rationale: ἐποίει jẹ́ imperfect, nítorí náà “ó ń ṣe” pa ìṣe tí ń lọ lọ́wọ́ mọ́. ὅσα lè túmọ̀ sí ohun tàbí gbogbo ohun tí ó ń ṣe; àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn gbooro náà mọ́.
- source_word: ἦλθον πρὸς αὐτόν
  choice: wá sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún lílọ sí ibi tí ẹnìkan wà, ó sì pa ìdarí ìṣípò πρός mọ́.
- source_word: καὶ ... καὶ ... καὶ
  choice: àti ... àti ... àti
  rationale: Àtúnsọ καί ń mú kí àkójọ àwọn agbègbè náà máa pọ̀ sí i ní ìpele-ìpele; àtúnsọ “àti” pa ara ìkọ̀wé Máàkù mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtúnsọ “àti” àti ìtẹ̀síwájú ìṣe inú ọ̀rọ̀ Gíríìkì mọ́. Àwọn àmì àlàyé ni a so mọ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an.
