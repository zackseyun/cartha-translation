id: MRK.3.22
reference: Mark 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: yo
  text: Àwọn akọ̀wé tí wọ́n sọ̀kalẹ̀ láti Jerúsálẹ́mù sì ń sọ pé, “Ó ní Bẹ́ẹ́lísébúlù[a][b],” àti pé, “Nípasẹ̀ olórí àwọn ẹ̀mí èṣù[c] ni ó fi ń lé àwọn ẹ̀mí èṣù jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí tún lè túmọ̀ sí ní kíkún pé, “Bẹ́ẹ́lísébúlù ń gbé inú rẹ̀,” tàbí, “Bẹ́ẹ́lísébúlù ti wọ̀ ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, Βεελζεβούλ (Bẹ́ẹ́lísébúlù); ìrísí orúkọ tí àṣà kan sábà máa ń lò ni “Bẹ́ẹ́lísébúbù.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “Nípasẹ̀ ọmọ-aládé àwọn ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn amòye òfin Júù nínú ìtàn Ìhìn Rere; níbí, kì í ṣe àwọn adàkọ lásán ni.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: tí wọ́n sọ̀kalẹ̀ láti Jerúsálẹ́mù
  rationale: Gbólóhùn àsopọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtumọ̀ ìtọ́sọ́nà καταβάντες mọ́, nítorí pé a ń sọ̀kalẹ̀ láti Jerúsálẹ́mù.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ fi ìṣe aláìpé ti Gíríìkì hàn, èyí tó lè túmọ̀ sí pé wọ́n ń sọ ọ́ lọ́wọ́ tàbí wọ́n ń sọ ọ́ léraléra.
- source_word: Βεελζεβοὺλ
  choice: Bẹ́ẹ́lísébúlù
  rationale: Àkọsílẹ̀ orúkọ yìí tẹ̀ lé ìrísí Gíríìkì Βεελζεβούλ dípò ìrísí àṣà ‘Beelzebub.’
- source_word: ἔχει
  choice: Ó ní
  rationale: Èyí pa àkànlò èdè Gíríìkì ‘ó ní Bẹ́ẹ́lísébúlù’ mọ́ láì fi ìtumọ̀ ìgbàgbọ́ míì kún un nínú ẹsẹ̀ pàtàkì; àlàyé pé ó túmọ̀ sí pé Bẹ́ẹ́lísébúlù ń gbé inú rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: Nípasẹ̀ olórí àwọn ẹ̀mí èṣù
  rationale: Níhìn-ín, ἐν ń tọ́ka sí ohun èlò tàbí agbára tí a fi ṣe ohun kan. ‘Nípasẹ̀’ sọ ẹ̀sùn náà ní Yorùbá àdánidá, ‘olórí’ sì ṣe àfihàn ἄρχων ní kedere.
- source_word: δαιμονίων / δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ yìí yàtọ̀ sí gbólóhùn ‘ẹ̀mí àìmọ́’; ‘ẹ̀mí èṣù’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ àwọn ẹ̀dá ẹ̀mí búburú.
- source_word: ἐκβάλλει
  choice: ń lé ... jáde
  rationale: Èyí jẹ́ àkànlò Yorùbá àdánidá fún fífi agbára lé ẹ̀mí èṣù kúrò nínú ẹni tí ó ń ṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ẹ̀sùn ‘Βεελζεβοὺλ ἔχει’
  choice: Ó ní Bẹ́ẹ́lísébúlù
  alternative: Bẹ́ẹ́lísébúlù ń gbé inú rẹ̀ / Bẹ́ẹ́lísébúlù ti wọ̀ ọ́
  rationale: Ẹsẹ̀ pàtàkì pa àkànlò Gíríìkì tí kò túmọ̀ ohun gbogbo jáde mọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ tó hàn nínú ọ̀rọ̀ náà yé òǹkàwé láì sọ ọ́ di dandan pé ọ̀nà kan ṣoṣo ni a gbọ́dọ̀ gbà á.
- issue: Bí a ṣe túmọ̀ ἄρχων
  choice: olórí àwọn ẹ̀mí èṣù
  alternative: ọmọ-aládé àwọn ẹ̀mí èṣù
  rationale: ‘Olórí’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣàfihàn ẹni tó ní àṣẹ, láì mú oyè ìjọba kan tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọlé.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá jẹ́ ti ẹ̀dá Yorùbá, a sì lo ‘ń’ láti pa ìṣe tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra mọ́. ‘Àwọn akọ̀wé’ pa ọ̀rọ̀ ìtàn Bíbélì mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé àwọn amòye òfin Júù ni wọ́n.
