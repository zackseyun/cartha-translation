  terminology: “Àwọn ọmọ-ẹ̀yìn,” “ọkọ̀ ojú omi kékeré,” àti “ogunlọ́gọ̀” yẹ ní ìforúkọsílẹ̀ Ìhìn Rere. A pa ìtumọ̀ alágbára θλίβω mọ́ pẹ̀lú “tẹ̀ ẹ́ mọ́lẹ̀,” nígbà tí àlàyé ìsàlẹ̀ fi “tẹ̀ mọ́ ọn” hàn gẹ́gẹ́ bí yíyàn mìíràn.
