  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: ìbéèrè fún ọkọ̀ ojú omi kékeré tí yóò wà ní ìmúrasílẹ̀, ìdí tí ogunlọ́gọ̀ fi jẹ́ ewu, àti èrò pé kí wọ́n má tẹ Jesu mọ́lẹ̀. Ṣùgbọ́n “mú ọkọ̀ ... wà ní ìmúrasílẹ̀” kò dáa gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ προσκαρτερῇ, “fún un pọ̀ mọ́lẹ̀” sì jẹ́ àìdánidá, ó sì lè dà bí “fún” (give) dípò ìfúnpá ara ogunlọ́gọ̀.'
