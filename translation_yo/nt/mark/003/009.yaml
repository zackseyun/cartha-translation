  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: yo
  text: Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé kí ọkọ̀ ojú omi kékeré kan máa wà ní ìmúrasílẹ̀ fún un nítorí ogunlọ́gọ̀ náà, kí wọ́n má bàa tẹ̀ ẹ́ mọ́lẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n má bàa tẹ̀ mọ́ ọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí títẹ̀ mọ́ ẹni, fífún ẹni ní ìfúnpá, tàbí títẹ ẹni mọ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sọ fún
  rationale: Ọ̀rọ̀ yìí bá ìtumọ̀ λέγω mu nínú gbólóhùn tí a fi ohun tí a sọ hàn láìlo ọ̀rọ̀ tààrà, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún μαθητής nínú àwọn Ìhìn Rere, ó sì pa ìbáṣepọ̀ olùkọ́ àti àwọn tí ń tẹ̀ lé e mọ́.
- source_word: πλοιάριον
  choice: ọkọ̀ ojú omi kékeré kan
  rationale: Ó pa ìtumọ̀ ohun kékeré inú πλοιάριον mọ́, ó sì ṣe kedere pé ọkọ̀ ojú omi ni.
- source_word: προσκαρτερῇ
  choice: kí wọ́n mú ... wà ní ìmúrasílẹ̀
  rationale: Ó fi hàn pé kí ọkọ̀ náà máa wà nílẹ̀ ní gbogbo ìgbà, ní ṣíṣe tán fún lílò Jesu; ìlò ọ̀rọ̀ ọ̀pọ̀ ẹni bá 'àwọn ọmọ-ẹ̀yìn' tí ó jẹ́ ẹni tí a pàṣẹ fún mu.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù náà tọ́ka sí pé ọkọ̀ náà gbọ́dọ̀ wà ní ìmúrasílẹ̀ fún lílò rẹ̀.
- source_word: διὰ τὸν ὄχλον
  choice: nítorí ogunlọ́gọ̀ náà
  rationale: διά pẹ̀lú akúsátífù ń sọ ìdí; 'nítorí' jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: θλίβωσιν
  choice: fún un pọ̀ mọ́lẹ̀
  rationale: Èyí mú agbára θλίβω jáde gẹ́gẹ́ bí títẹ̀ tàbí fífún ènìyàn pọ̀ mọ́lẹ̀ lábẹ́ ìkójọpọ̀ ogunlọ́gọ̀, láìfi dandan sọ pé wọ́n pa á.
