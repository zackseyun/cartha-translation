translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “ogunlọ́gọ̀” fún ọ̀pọ̀ ènìyàn tí wọ́n kóra jọ, àti “ọkọ̀ ojú omi kékeré” láti pa ìtumọ̀ dímínútífù Gíríìkì mọ́.
