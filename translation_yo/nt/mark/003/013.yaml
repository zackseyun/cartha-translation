id: MRK.3.13
reference: Mark 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: yo
  text: Ó sì gun orí òkè lọ, ó sì pe àwọn tí òun fúnra rẹ̀ fẹ́ wá sọ́dọ̀ ara rẹ̀[a], wọ́n sì lọ sọ́dọ̀ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó fẹ́”; Gíríìkì tẹnu mọ́ ọn pé òun fúnra rẹ̀ ló fẹ́ wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n sì wá sọ́dọ̀ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: gun orí òkè lọ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìsinsìnyí ìtàn, ṣùgbọ́n Yorùbá lè sọ ìṣẹ̀lẹ̀ tó tẹ̀ lé e ní ti ẹ̀dá láì fi àmì àkókò ọ̀rọ̀-ìṣe kún un. ‘Gun orí òkè lọ’ pa ìtumọ̀ ìgòkè mọ́, ó sì bá èdè Yorùbá mu.
- source_word: εἰς τὸ ὄρος
  choice: orí òkè
  rationale: Pẹ̀lú ‘gun,’ gbólóhùn yìí túmọ̀ sí gígun dé orí òkè; kò yẹ kí a túmọ̀ εἰς ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ bí ‘sínú’ níbí.
- source_word: προσκαλεῖται
  choice: pe … wá sọ́dọ̀ ara rẹ̀
  rationale: Èyí mú ohùn àárín ọ̀rọ̀-ìṣe náà àti ìtumọ̀ pé Jésù pè wọ́n sí ọ̀dọ̀ ara rẹ̀ hàn, láì lo ọ̀rọ̀ aláṣẹ tó le bí ‘pàṣẹ pé kí wọ́n wá.’
- source_word: οὓς ἤθελεν αὐτός
  choice: àwọn tí òun fúnra rẹ̀ fẹ́
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́; ‘fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún θέλω ní àyíká yìí, láì mú un le ju bó ṣe wà lọ.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: wọ́n sì lọ sọ́dọ̀ rẹ̀
  rationale: ‘Lọ sọ́dọ̀ rẹ̀’ pa ìdarí ìṣípò πρὸς αὐτόν mọ́, ó sì fi ἀπέρχομαι hàn ní kedere. ‘Wọ́n wá sọ́dọ̀ rẹ̀’ tún ṣeé ṣe bí a bá wo ìṣípò náà láti ibi tí Jésù wà.
theological_decisions:
- issue: Ìtẹnumọ́ pé Jésù fúnra rẹ̀ ló yan àwọn tí ó pè
  choice: àwọn tí òun fúnra rẹ̀ fẹ́
  alternative: àwọn tí ó fẹ́
  rationale: αὐτός tẹnu mọ́ ìfẹ́ àti ìgbésẹ̀ Jésù fúnra rẹ̀. A pa ìtẹnumọ́ náà mọ́, ṣùgbọ́n a kò fi ẹ̀kọ́ ìsìn kan nípa àyànmọ́ tàbí ìdìbò kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó níyì, tó sì ṣeé lóye lójoojúmọ́. A lo ‘òun fúnra rẹ̀’ fún ìtẹnumọ́, ‘sọ́dọ̀ ara rẹ̀’ fún ìtumọ̀ ìpè sí ara ẹni, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
