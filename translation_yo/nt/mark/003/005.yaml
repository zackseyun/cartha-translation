id: MRK.3.5
reference: Mark 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: yo
  text: Ó sì wò wọ́n yíká pẹ̀lú ìbínú, ó ń banújẹ́ nítorí líle ọkàn wọn, ó sì sọ fún ọkùnrin náà pé, “Na ọwọ́ rẹ jáde.” Ó sì na ọwọ́ rẹ̀ jáde, ọwọ́ rẹ̀ sì padà bọ̀ sípò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: wo gbogbo wọn yíká
  rationale: Ó fi ìwò yíká tí ó kan gbogbo ẹgbẹ́ náà hàn ní Yorùbá àdánidá. Àsopọ̀ “ó sì” pa tẹ̀lé-tẹ̀lé ìtàn náà mọ́ láì mú gbolohun náà le.
- source_word: μετ’ ὀργῆς
  choice: pẹ̀lú ìbínú
  rationale: Èyí túmọ̀ ọ̀nà tí ó gbà wò wọ́n ní tààrà, kò sì dín agbára ìmọ̀lára náà kù.
- source_word: συλλυπούμενος
  choice: ó ń banújẹ́
  rationale: Àmì àsìkò “ń” jẹ́ kí ìbànújẹ́ náà fara hàn gẹ́gẹ́ bí ohun tí ó ń bá ìwò pẹ̀lú ìbínú náà lọ, ní ìbámu pẹ̀lú participle Gíríìkì.
- source_word: ἐπὶ τῇ πωρώσει
  choice: nítorí líle
  rationale: ἐπί pẹ̀lú dative fi ìdí ìbànújẹ́ náà hàn; “líle” sì pa àwòrán ọkàn tí ó le mọ́.
- source_word: τῆς καρδίας αὐτῶν
  choice: ọkàn wọn
  rationale: Yorùbá máa ń lo ọ̀rọ̀-orúkọ ẹyọ kan pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀ “wọn” lọ́nà àdánidá. Nítorí náà, “ọkàn wọn” pa ẹyọ καρδίας àti ìtumọ̀ àkójọpọ̀ rẹ̀ mọ́ láì nílò àlàyé àfikún.
- source_word: λέγει
  choice: ó sì sọ
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, àsìkò tí ó ti kọjá ni Yorùbá àdánidá ń lò nínú irú ìtàn yìí; “ó sì sọ” mú ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà ṣe kedere.
- source_word: τῷ ἀνθρώπῳ
  choice: fún ọkùnrin náà
  rationale: Ó tọ́ka sí ọkùnrin pàtó tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Na ọwọ́ rẹ jáde
  rationale: Àṣẹ yìí jẹ́ tààrà, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún fífi ọwọ́ nà síta.
- source_word: ἐξέτεινεν
  choice: ó sì nà án jáde
  rationale: Ó tún ọ̀rọ̀-ìṣe inú àṣẹ náà ṣe, gẹ́gẹ́ bí Gíríìkì, nígbà tí “án” ń tọ́ka sí ọwọ́ náà láì tún un sọ lásán.
- source_word: ἀπεκατεστάθη
  choice: padà bọ̀ sípò
  rationale: Èyí mú èrò ìmúpadàbọ̀ sí ipò tí ó yẹ jáde dáadáa ju ọ̀rọ̀ gbogbogbò fún ìwòsàn lọ.
theological_decisions:
- issue: Ìbínú àti ìbànújẹ́ Jésù
  choice: A túmọ̀ àwọn ìmọ̀lára méjèèjì ní tààrà gẹ́gẹ́ bí “pẹ̀lú ìbínú” àti “ó ń banújẹ́.”
  alternative: A lè sọ ìbínú náà di “àìtẹ́lọ́rùn,” tàbí mú ìbànújẹ́ náà lágbára sí i ní ọ̀rọ̀ àfikún.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìbínú àti ìbànújẹ́ hàn papọ̀. Ìtumọ̀ náà kò gbọ́dọ̀ rọ ọ̀kan lára wọn tàbí yanjú ẹdọfu ìmọ̀-ẹ̀sìn tí ẹsẹ̀ náà mọ̀ọ́mọ̀ pa mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “ọkàn wọn” lọ́nà àkójọpọ̀ tí ó jẹ́ àdánidá ní Yorùbá, tí ó sì bá ẹyọ inú Gíríìkì mu.
