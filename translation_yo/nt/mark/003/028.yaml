  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: yo
  text: “Lóòótọ́ ni mo sọ fún yín pé, a ó dárí gbogbo ẹ̀ṣẹ̀ ji àwọn ọmọ ènìyàn[a], àti gbogbo ọ̀rọ̀-òdì tí wọ́n bá sọ;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ènìyàn” tàbí “aráyé.” Gbólóhùn Gíríìkì náà jẹ́ ọ̀nà gbogbogbò láti tọ́ka sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìdánilójú àti ọ̀wọ̀ inú ọ̀rọ̀ ìṣáájú Jésù jáde ní Yorùbá àdánidá, láì ṣe àdàkọ ọ̀rọ̀ náà sí “Àmín.”
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ tààrà sí ọ̀pọ̀ ènìyàn, ó sì pa ìtẹnumọ́ gbolohun náà mọ́.
- source_word: πάντα … τὰ ἁμαρτήματα
  choice: gbogbo ẹ̀ṣẹ̀
  rationale: “Gbogbo” níbí bo gbogbo àwọn ìṣe ẹ̀ṣẹ̀ tí orúkọ ọ̀pọ̀ náà ń tọ́ka sí; kò túmọ̀ sí “ohun gbogbo” láìní ààlà.
- source_word: ἀφεθήσεται
  choice: a ó dárí … ji
  rationale: Àpólà “dárí ẹ̀ṣẹ̀ ji” ni ọ̀nà Yorùbá tó ṣe kedere jù lọ fún ìdáríjì ẹ̀ṣẹ̀; ìṣètò aláìlórúkọ “a ó” tún pa ìṣe àbáwọlé ti èdè Gíríìkì mọ́.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: àwọn ọmọ ènìyàn
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Sẹ́mítì tó wà nínú orísun, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi hàn pé gbogbo aráyé ni ó ń tọ́ka sí.
- source_word: αἱ βλασφημίαι
  choice: gbogbo ọ̀rọ̀-òdì
  rationale: “Ọ̀rọ̀-òdì” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ tó tako ohun mímọ́; àyíká ẹsẹ tó tẹ̀ lé ló mú agbára ẹ̀sìn rẹ̀ hàn láìfi “sí Ọlọ́run” kún orísun.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: tí wọ́n bá sọ
  rationale: “Bá” fi àìdánilójú àti ààyè gbígbòòrò ti ἐάν pẹ̀lú subjunctive hàn; “gbogbo” tó ṣáájú mú ìtumọ̀ “ohunkóhun tí” pé.
theological_decisions:
- issue: Ìwọ̀n ìlérí ìdáríjì ní ìbámu pẹ̀lú ìkìlọ̀ nípa ọ̀rọ̀-òdì sí Ẹ̀mí Mímọ́ nínú ẹsẹ tó tẹ̀ lé
  choice: A túmọ̀ ẹsẹ yìí gẹ́gẹ́ bí ìkéde ìdáríjì tó gbòòrò, láìfi ìyàsọ́tọ̀ ẹsẹ tó tẹ̀ lé sínú rẹ̀.
  alternative: Kí a fi ààlà kan sínú gbolohun yìí látàrí ẹsẹ 29.
  rationale: Ẹsẹ 28 fúnra rẹ̀ kéde ìdáríjì ní ọ̀nà tó gbòòrò; ẹsẹ tó tẹ̀ lé ni ó sọ ìkìlọ̀ náà. Ìtumọ̀ náà pa ìfúnpá ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ dípò kíkó ìpinnu ẹsẹ 29 wọ inú ẹsẹ 28.
- issue: Ìtumọ̀ gbólóhùn akọ tó dúró fún gbogbo aráyé, τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: A pa “àwọn ọmọ ènìyàn” mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìtumọ̀ tó kan gbogbo ènìyàn ní àlàyé ìsàlẹ̀.
  alternative: gbogbo ènìyàn; aráyé
  rationale: “Àwọn ọmọ ènìyàn” pa àwòrán àti ìrísí gbólóhùn orísun mọ́, ṣùgbọ́n àlàyé náà dena kí a má ṣe kà á sí àwọn ọkùnrin nìkan.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn kún ibi tí ó yẹ. “Lóòótọ́ ni mo sọ fún yín” ní ìdánilójú tó bá ọ̀rọ̀ Jésù mu; “ọ̀rọ̀-òdì” sì jẹ́ ọ̀rọ̀ ìjọsìn tó mọ́gbọ́n dání láìdi ìtumọ̀ Gíríìkì mọ́ sí àlàyé kan ṣoṣo.
