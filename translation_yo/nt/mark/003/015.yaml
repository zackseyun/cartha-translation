  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ‘àti’ fún καὶ, ‘láti ní’ fún ἔχειν, ‘àṣẹ’ fún ἐξουσίαν, àti ‘láti lé ... jáde’ fún ἐκβάλλειν. ‘Àwọn ẹ̀mí èṣù’ ṣàfihàn ọ̀pọ̀ τὰ δαιμόνια, láì rọ́pò wọn pẹ̀lú ‘ẹ̀mí àìmọ́.’'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé, ó sì ń ṣàn dáadáa gẹ́gẹ́ bí apá kan nínú àtòjọ iṣẹ́ tí a fi rán àwọn ọmọ-ẹ̀yìn. Àmì ohùn wà ní àwọn ọ̀rọ̀ tí ó nílò wọn.
  terminology: ‘Àṣẹ’ yẹ fún ἐξουσίαν nínú ọ̀rọ̀ ìfìrànṣẹ́ yìí, nítorí ó gbé ẹ̀tọ́/ìyọ̀nda láti ṣe iṣẹ́ náà kalẹ̀. ‘Ẹ̀mí èṣù’ jẹ́ ìlò tí ó ṣe kedere, tí ó sì pa ìtumọ̀ δαιμόνια mọ́. Àlàyé ẹsẹ̀-ìsàlẹ̀ náà fún ‘lé ... kúrò’ jẹ́ àṣàyàn ọ̀rọ̀ tó bófin mu.
