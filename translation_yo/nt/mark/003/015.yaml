  text: καὶ ἔχειν ⸀ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: yo
  text: àti láti ní àṣẹ láti lé àwọn ẹ̀mí èṣù jáde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti lé àwọn ẹ̀mí èṣù kúrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti
  rationale: Ó so gbólóhùn aláìlẹ́ni pọ̀ mọ́ àwọn ohun tí a sọ ṣáájú nínú iṣẹ́ tí Jésù yàn wọ́n sí.
- source_word: ἔχειν
  choice: láti ní
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tí ó sì bá ọ̀wọ́ àwọn ọ̀rọ̀ aláìlẹ́ni inú àyíká yìí mu.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àṣẹ tàbí ẹ̀tọ́ tí a fi fún ẹni láti ṣe ohun kan, kì í ṣe agbára lásán.
- source_word: ἐκβάλλειν
  choice: láti lé ... jáde
  rationale: Èyí fi ipa ìyọkúrò tí ọ̀rọ̀ Gíríìkì náà ní hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí túmọ̀ δαιμόνια ní pàtó, láì fi gbólóhùn míì bí ‘àwọn ẹ̀mí àìmọ́’ tí kò sí nínú ẹsẹ yìí kún un.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσίαν nínú iṣẹ́ tí a fi fún àwọn ọmọ-ẹ̀yìn
  choice: àṣẹ
  alternative: agbára
  rationale: ‘Àṣẹ’ tẹnumọ́ pé Jésù fún wọn ní ẹ̀tọ́ àti agbára tí a fọwọ́ sí láti ṣe iṣẹ́ náà; kò sọ pé ìṣe àgbàyanu náà kò nílò agbára.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
