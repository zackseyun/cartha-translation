id: MRK.3.24
reference: Mark 3:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: yo
  text: Bí ìjọba kan bá pínyà sí ara rẹ̀, ìjọba náà kò lè dúró.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (kò ṣe é túmọ̀ lọ́tọ̀ níbí)
  rationale: Ní Yorùbá, bẹ̀rẹ̀ gbólóhùn òwe yìí pẹ̀lú “Àti” kì í ṣe àdánidá. Ìbáṣepọ̀ rẹ̀ mọ́ ọ̀rọ̀ tó ṣáájú wà nínú àyíká ọ̀rọ̀.
- source_word: ἐὰν
  choice: Bí ... bá
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti fi sọ ipò àídájú tí ἐὰν pẹ̀lú subjunctive ń fi hàn.
- source_word: βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” bá àwòrán ilẹ̀ tàbí àwùjọ tó wà lábẹ́ ìṣàkóso kan mu; kò sọ ọ́ di èrò àìrí bí “ìṣàkóso” nìkan.
- source_word: ἐφ’ ἑαυτὴν
  choice: sí ara rẹ̀
  rationale: Nínú àyíká yìí, gbolohun náà túmọ̀ sí ìtakora tàbí ìjà láàárín àwọn ara ohun kan. “Pínyà sí ara rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μερισθῇ
  choice: bá pínyà
  rationale: Ó pa ìtumọ̀ passive—kí ìjọba náà wà ní pípa sí apá—mọ́, láìsọ ẹni tàbí ohun tó fa ìpín náà.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún àìlèṣe.
- source_word: σταθῆναι
  choice: dúró
  rationale: “Dúró” pa àwòrán ohun tó dúró ṣinṣin mọ́, ó sì tún lè túmọ̀ sí láti má bàjẹ́ tàbí ṣubú.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ìjọba náà
  rationale: Àfihàn “náà” ń tọ́ka padà sí ìjọba tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa ìtẹnumọ́ Gíríìkì mọ́ lọ́nà àdánidá.
theological_decisions:
- issue: Irú ọ̀rọ̀ tí gbólóhùn náà jẹ́
  choice: Fi í hàn gẹ́gẹ́ bí òtítọ́ gbogbogbò nínú àríyànjiyàn Jésù, láìfi ẹ̀kọ́ míì kún un.
  alternative: Kà á sí òwe tó ń kọ́ni nípa gbogbo ìjọba ayé tàbí fi ẹ̀kọ́ tó gbòòrò nípa Sátánì kún un.
  rationale: Ẹsẹ̀ náà jẹ́ àfiwé nínú ìdáhùn Jésù. Ìtumọ̀ náà pa agbára òwe rẹ̀ mọ́, ṣùgbọ́n kò kọjá ohun tí ọ̀rọ̀ Gíríìkì sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasan. A yọ “Àti” kúrò ní ìbẹ̀rẹ̀ nítorí pé kì í dun bí Yorùbá àdánidá nínú gbólóhùn yìí, nígbà tí ìsopọ̀ ọ̀rọ̀ ṣì hàn gbangba nínú àyíká rẹ̀.
