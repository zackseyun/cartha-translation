source:
  edition: SBLGNT
  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì ń jókòó yí i ká, wọ́n sì sọ fún un pé, “Wò ó, ìyá rẹ àti àwọn arákùnrin rẹ wà níta, wọ́n ń wá ọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθητο
  choice: jókòó
  rationale: Ọ̀rọ̀ ìṣe aláìpé náà ṣàpèjúwe ipò tí ó ń lọ lọ́wọ́; nínú Yorùbá, àkópọ̀ ‘Ọ̀pọ̀ ènìyàn sì jókòó yí i ká’ fi ìran náà hàn ní ti ẹ̀dá láìfi àmì àsìkò tí kò wọ́pọ̀ kún un.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Ọ̀pọ̀ ènìyàn ... yí i ká
  rationale: ‘Yí i ká’ pa ìtumọ̀ ibi tí περί pẹ̀lú accusative ní mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ogunlọ́gọ̀ wà ní àyíká rẹ̀.
- source_word: λέγουσιν
  choice: wọ́n sì sọ fún un
  rationale: Present tense Gíríìkì jẹ́ historical present nínú ìtàn; àsìkò ìtàn Yorùbá yìí dára, ó sì mú ẹni tí a bá sọ̀rọ̀ fún hàn kedere.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó fa àfiyèsí sí ohun tí ń bọ̀, ní èdè Yorùbá òde òní tí ó ṣeé lóye, láìlo ọ̀rọ̀ àtijọ́.
- source_word: μήτηρ
  choice: ìyá
  rationale: Èyí ni ọ̀rọ̀ ìbátan Yorùbá tààrà fún ‘mother.’
- source_word: ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Ó pa irú akọ ní ọ̀pọ̀ tí ọ̀rọ̀ Gíríìkì ní mọ́, láìṣàlàyé irú ìbátan náà kọjá ohun tí ẹsẹ̀ sọ.
- source_word: ἔξω
  choice: níta
  rationale: Èyí ni ìtumọ̀ ibi tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ζητοῦσίν σε
  choice: wọ́n ń wá ọ́
  rationale: ‘Ń wá ọ́’ jẹ́ Yorùbá àdánidá fún ìgbìyànjú láti rí ẹni náà; ó tún pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ìtọ́kasí ‘àwọn arákùnrin’
  choice: Túmọ̀ ἀδελφοί sí ‘àwọn arákùnrin’ láìfi àlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: àwọn arákùnrin tàbí ìbátan rẹ̀; àwọn ọmọ ìyá rẹ̀
  rationale: Ẹsẹ̀ náà lo ọ̀rọ̀ ìbátan tí ó wọ́pọ̀, kò sì ṣàlàyé bí ìbátan wọn ṣe rí ní pàtó. Ìtumọ̀ tààrà yìí yẹra fún fífi ìpinnu ẹ̀ya ìjọ kan sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Kò sí àmì àlàyé ẹsẹ̀ nítorí ‘wọ́n ń wá ọ́’ fún ζητοῦσίν σε jẹ́ kedere, ó sì pa ìtumọ̀ orísun mọ́; àlàyé Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé àmì [a] rẹ̀ kò bá ibi tó wà nínú gbolohun mu.
