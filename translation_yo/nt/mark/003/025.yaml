source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: yo
  text: Bí ilé kan bá sì pínyà sí ara rẹ̀[a], ilé náà kò ní lè dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “agbo ilé” tàbí “ìdílé” dípò “ilé” (οἰκία); ṣùgbọ́n àwòrán “dúró” nínú ọ̀rọ̀ yìí mú kí “ilé” bá ọ̀rọ̀ náà mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ilé
  rationale: “Ilé” pa àwòrán ilé gidi mọ́, ó sì bá ọ̀rọ̀ “dúró” mu; síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí agbo ilé tàbí ìdílé.
- source_word: ἐφ’ ἑαυτὴν
  choice: sí ara rẹ̀
  rationale: Nínú gbólóhùn yìí, ó túmọ̀ sí ìtakò láàárín ohun kan náà; “pínyà sí ara rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: μερισθῇ
  choice: bá ... pínyà
  rationale: Ìtumọ̀ yìí pa ìṣe tí a ṣe sí ohun náà àti ipò àídájú gbogbogbò mọ́ lẹ́yìn ἐὰν.
- source_word: δυνήσεται
  choice: kò ní lè
  rationale: Ó fi agbára tàbí àǹfààní ọjọ́ iwájú hàn ní kedere nínú àbájáde àídájú náà.
- source_word: σταθῆναι
  choice: dúró
  rationale: Ó pa àwòrán ohun tí ó dúró ṣinṣin mọ́, nígbà tí ìtumọ̀ fífaradà tàbí wíwà láìwó ṣì wà nínú rẹ̀.
- source_word: ἡ οἰκία ἐκείνη
  choice: ilé náà
  rationale: “Náà” ń fi ìtọ́kasí ἐκείνη hàn lọ́nà Yorùbá tí ó ṣe déédéé.
- source_word: καὶ ἐὰν
  choice: Bí ... bá sì
  rationale: Ìṣètò yìí jẹ́ àdánidá ní Yorùbá, ó sì pa mejeeji ìsopọ̀ καί àti àídájú ἐὰν mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó bójú mu, tí ó sì yé òǹkàwé òde òní. Gbólóhùn àídájú “bí ... bá” àti “kò ní lè dúró” jẹ́ ti ẹnu àti ti ìkọ̀wé ní ti ẹ̀dá, wọ́n sì pa àwòrán orísun mọ́.
