source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: yo
  text: àti Àńdérù, àti Fílípì, àti Bátólómíù, àti Mátíù, àti Tómásì, àti Jákọ́bù ọmọ Álíféù, àti Tádéù, àti Símónì Onítara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ọ̀rọ̀ náà ni Kananaîos; ó ṣeé ṣe kí ó túmọ̀ sí “Onítara,” gẹ́gẹ́ bí ó ti rí ní Lúùkù 6:15. Sísọ ọ́ di “ará Kénáánì” lè ṣìnà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti
  rationale: A tún “àti” ṣe ní ìbámu pẹ̀lú ìṣètò àtòjọ oníṣọ̀kan tí Gíríìkì lò.
- source_word: Ἀνδρέαν
  choice: Àńdérù
  rationale: A kọ orúkọ náà ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀ nínú Bíbélì.
- source_word: Φίλιππον
  choice: Fílípì
  rationale: Ìtumọ̀-ohùn orúkọ ẹni sí Yorùbá.
- source_word: Βαρθολομαῖον
  choice: Bátólómíù
  rationale: Ìtumọ̀-ohùn orúkọ ẹni sí Yorùbá.
- source_word: Μαθθαῖον
  choice: Mátíù
  rationale: Ìtumọ̀-ohùn orúkọ ẹni sí Yorùbá.
- source_word: Θωμᾶν
  choice: Tómásì
  rationale: Ìtumọ̀-ohùn orúkọ ẹni sí Yorùbá.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Jákọ́bù ọmọ Álíféù
  rationale: Ìṣọ̀kan àròkọ àti ọ̀rọ̀ olóhun nínú Gíríìkì fi ìbátan baba hàn; “ọmọ Álíféù” sọ ọ́ ní Yorùbá kedere.
- source_word: Θαδδαῖον
  choice: Tádéù
  rationale: Ìtumọ̀-ohùn orúkọ ẹni sí Yorùbá.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Símónì Onítara
  rationale: Καναναῖος ṣeé ṣe kí ó jẹ́ àfihàn ọ̀rọ̀ Árámáíkì fún ẹni onítara, bí Lúùkù 6:15 ti fi ζηλωτής hàn; “Onítara” yàgò fún ìtumọ̀ àṣìṣe pé ará ilẹ̀ Kénáánì ni.
theological_decisions:
- issue: Ìtumọ̀ orúkọ àpèjáde Καναναῖος tí a fi mọ Símónì
  choice: Símónì Onítara
  alternative: Símónì ará Kánánì
  rationale: Èyí jẹ́ ìpinnu ọ̀rọ̀ àti ìtàn ju ti ẹ̀kọ́ ìgbàgbọ́ lọ. Ọ̀rọ̀ Máàkù ṣeé ṣe kí ó wá láti Árámáíkì, Lúùkù 6:15 sì lo ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí “onítara.” Àkọ́lé náà ni a túmọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìrísí Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó bójú mu, tí ó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá jẹ́ ti ẹ̀dá, a sì pa àtòjọ “àti” ti Gíríìkì mọ́. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí àlàyé náà ń tọ́ka sí.
