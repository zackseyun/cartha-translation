  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: yo
  text: ṣùgbọ́n ẹnikẹ́ni tí ó bá sọ̀rọ̀-òdì sí Ẹ̀mí Mímọ́, kò ní ìdáríjì láéláé[a], ṣùgbọ́n ó jẹ̀bi ẹ̀ṣẹ̀ ayérayé[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “kò ní ìdáríjì sí ayérayé”; ìyẹn ni pé, “kò ní ìdáríjì láéláé” tàbí “kò ní ìdáríjì títí láé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó wà lábẹ́ ẹ̀bi ẹ̀ṣẹ̀ ayérayé.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé àfọwọ́kọ kan ní “ìdájọ́ ayérayé” tàbí “ìdálẹ́bi ayérayé” dípò “ẹ̀ṣẹ̀ ayérayé.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: ṣùgbọ́n ẹnikẹ́ni tí ó bá
  rationale: “Ẹnikẹ́ni tí ó bá” fi agbára gbólóhùn aláìnídìí hàn ní Yorùbá, “ṣùgbọ́n” sì mú ìyàtọ̀ pẹ̀lú ohun tí ó ṣáájú jáde.
- source_word: βλασφημήσῃ
  choice: sọ̀rọ̀-òdì
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ búburú sí ohun mímọ́, ó sì pa ìwúwo ẹ̀sìn inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: sí Ẹ̀mí Mímọ́
  rationale: Nínú àkópọ̀ yìí, εἰς ń tọ́ka sí ẹni tí ọ̀rọ̀-òdì náà dojú kọ; “sí” ni Yorùbá àdánidá fún ìtumọ̀ yẹn.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: kò ní ìdáríjì láéláé
  rationale: Ìtumọ̀ yìí darapọ̀ àìní ìdáríjì mọ́ agbára àkókò εἰς τὸν αἰῶνα ní Yorùbá tó ṣe kedere; àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
- source_word: ἔνοχός ἐστιν
  choice: ó jẹ̀bi
  rationale: “Jẹ̀bi” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bá agbára ẹ̀bi tàbí jíjẹ́ ẹni tí ọ̀ràn kan kàn nínú ἔνοχος mu.
- source_word: αἰωνίου ἁμαρτήματος
  choice: ẹ̀ṣẹ̀ ayérayé
  rationale: Ó tẹ̀lé ẹ̀dà SBLGNT, èyí tí ó ní ἁμαρτήματος, “ẹ̀ṣẹ̀,” ó sì fi αἰωνίου hàn láì tú ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà nípa àfikún ìtumọ̀.
theological_decisions:
- issue: Irú ẹ̀ṣẹ̀ tí kò ní ìdáríjì
  choice: A pa ọ̀rọ̀ tààrà nípa sísọ̀rọ̀-òdì sí Ẹ̀mí Mímọ́ mọ́.
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìkọ̀sílẹ̀ ẹ̀rí Ẹ̀mí láìdáwọ́ dúró, tàbí fífi iṣẹ́ Ẹ̀mí kan agbára ẹ̀mí èṣù.
  rationale: Àyíká ẹsẹ náà ń ran òǹkàwé lọ́wọ́, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò fi gbogbo àlàyé ẹ̀kọ́ náà kún un; a kò fẹ́ fi ìtumọ̀ ẹ̀ya ìjọ kan sínú ọ̀rọ̀ náà.
- issue: Ìyàtọ̀ nínú àwọn ìwé àfọwọ́kọ ní òpin ẹsẹ
  choice: A túmọ̀ ẹ̀dà SBLGNT sí “ẹ̀ṣẹ̀ ayérayé.”
  alternative: “Ìdájọ́ ayérayé” tàbí “ìdálẹ́bi ayérayé.”
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè ni αἰωνίου ἁμαρτήματος; a tẹ̀lé e nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí àwọn ẹ̀dà mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo “sọ̀rọ̀-òdì” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀sìn tó ṣeé lóye láì jẹ́ ti ẹ̀ya ìjọ kan ṣoṣo.
