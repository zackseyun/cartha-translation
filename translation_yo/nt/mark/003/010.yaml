  to: Nítorí ó ti wo ọ̀pọ̀ ènìyàn sàn, débi pé gbogbo àwọn tí wọ́n ní àìsàn[b] ń ya wọ̀ sí i[a] kí wọ́n lè fọwọ́ kàn án.
  rationale: A yọ gbolohun àfikún tí kò sí nínú orísun kúrò nínú ọ̀rọ̀ àkọ́kọ́, a sì gbe àlàyé àwòrán μάστιγας sí àkọsílẹ̀ níbi tí ó yẹ. A tún ṣe ìtumọ̀ ἐπιπίπτειν ní “ń ya wọ̀ sí i” fún Yorùbá adayeba tí ó ṣì ń fi ìfẹ́sẹ̀mulẹ̀ ìsúnmọ́ ogunlọ́gọ̀ hàn. A tún ṣètò àwọn àmì àkọsílẹ̀ kí ọkọọkan lè dúró lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ó ń ṣàlàyé.
