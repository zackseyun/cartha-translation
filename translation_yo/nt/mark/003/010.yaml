id: MRK.3.10
reference: Mark 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: yo
  text: Nítorí ó ti wo ọ̀pọ̀ ènìyàn sàn, débi pé gbogbo àwọn tí wọ́n ní àìsàn[b] ń ya wọ̀ sí i[a] kí wọ́n lè fọwọ́ kàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń ṣubú lé e.” Ọ̀rọ̀ Gíríìkì náà lágbára gan-an, ó ń ṣàpèjúwe bí àwọn ènìyàn ṣe ń ya wọ̀ sí ọ̀dọ̀ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “pàṣán”; níhìn-ín ó lè túmọ̀ sí àwọn àìsàn tàbí ìpọ́njú líle.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ ohun tí ἐθεράπευσεν ń ṣe sí; fífi “ènìyàn” kún un mú kí Yorùbá ṣe kedere, láìfi ìtumọ̀ tuntun kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí ìwà àwọn ènìyàn nínú ìtàn yìí hàn.
- source_word: ἐθεράπευσεν
  choice: ó ti wo ... sàn
  rationale: Ìṣe náà ti ṣẹlẹ̀ ṣáájú, ó sì ń ṣàlàyé ìdí tí àwọn ènìyàn fi ń rọ́ wọ lé Jesu.
- source_word: ὥστε
  choice: débi pé
  rationale: Ó fi àbájáde ìwòsàn ọ̀pọ̀ ènìyàn hàn lọ́nà Yorùbá tí ó bójú mu.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: ń rọ́ wọ lé e
  rationale: 'Ó pa agbára ἐπιπίπτω mọ́: àwọn ènìyàn ń ya wọ̀, wọ́n sì ń tẹ̀ sí i, kì í ṣe pé wọ́n kàn yí i ká.'
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: kí wọ́n lè fọwọ́ kàn án
  rationale: Ó sọ ète tí wọ́n fi ń rọ́ wọ lé e, ó sì mú ìfọwọ́kàn ti ara hàn ní ti ẹ̀dá Yorùbá.
- source_word: ὅσοι εἶχον μάστιγας
  choice: gbogbo àwọn tí wọ́n ní àìsàn líle
  rationale: ὅσοι ní agbára àkópọ̀, μάστιγας sì jẹ́ àwòrán ìyà líle tí ó lè tọ́ka sí àwọn àìsàn tàbí ìpọ́njú líle; “àìsàn líle” bá àyíká ìwòsàn mu láìsọ ọ́ di orúkọ àìsàn kan pàtó.
theological_decisions:
- issue: Ìwà μάστιγας nínú àyíká ìwòsàn
  choice: àìsàn líle, pẹ̀lú àlàyé àwòrán pàṣán nínú àkọsílẹ̀
  alternative: ìpọ́njú; àjàkálẹ̀-àrùn; pàṣán
  rationale: Àyíká náà jẹ́ ti ìwòsàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbòòrò, ó sì lágbára ju ọ̀rọ̀ ìṣègùn lasan lọ. Ìtumọ̀ yìí kò dín un sí àyẹ̀wò àìsàn kan, kò sì fi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ ti ẹ̀dá. A yàn “ń rọ́ wọ lé e” láti dá agbára ìṣíkiri ogunlọ́gọ̀ nínú Gíríìkì dúró, a sì pa àwòrán μάστιγας mọ́ nípasẹ̀ àkọsílẹ̀.
