id: MRK.3.17
reference: Mark 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: yo
  text: àti Jákọ́bù ọmọ Sebedéù, àti Jòhánù arákùnrin Jákọ́bù (ó sì fún wọn ní orúkọ[a] Bóánẹ́gẹ́sì, èyí tí ó túmọ̀ sí “Àwọn ọmọ àrá”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní “àwọn orúkọ” ní ọ̀pọ̀; ó ṣeé ṣe kí ọ̀pọ̀ náà dúró fún orúkọ àpèjáde kan ṣoṣo tí àwọn arákùnrin méjèèjì jọ ń jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Jákọ́bù
  rationale: Èyí ni ìrísí orúkọ Ἰάκωβος tí ó ti wọ́pọ̀ ní Yorùbá fún aposteli yìí; ó tún pa ìyàtọ̀ ìlò tí ó ti fìdí múlẹ̀ láàárín Jákọ́bù àti Jékọ́bù mọ́.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: ọmọ Sebedéù
  rationale: Ọ̀rọ̀-orúkọ pẹ̀lú ẹ̀yà olùní nínú Gíríìkì ń fi Jákọ́bù hàn gẹ́gẹ́ bí ọmọkùnrin Sebedéù; ‘ọmọ Sebedéù’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àyíká mu.
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Ìrísí orúkọ Ἰωάννης tí ó wọ́pọ̀, tí ó sì yé àwọn òǹkàwé Yorùbá.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: arákùnrin Jákọ́bù
  rationale: ἀδελφός níbí ń tọ́ka sí ìbátan ẹ̀jẹ̀ ọkùnrin; ‘arákùnrin’ fi ìtumọ̀ náà hàn láìfi ohun míì kún un.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: ó sì fún wọn ní orúkọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐπιτίθημι lè túmọ̀ sí fífi ohun kan lé ohun míì lórí, pẹ̀lú ὀνόματα ó túmọ̀ sí fífúnni ní orúkọ. Gíríìkì lo ‘àwọn orúkọ’ ní ọ̀pọ̀, ṣùgbọ́n orúkọ àpèjáde kan náà ni a fún àwọn méjèèjì; ẹyọ ‘orúkọ’ jẹ́ èdè Yorùbá àdánidá, a sì ṣàlàyé ọ̀pọ̀ Gíríìkì ní àlàyé ìsàlẹ̀.
- source_word: Βοανηργές
  choice: Bóánẹ́gẹ́sì
  rationale: A ṣe àfọwọ́kọ ohùn orúkọ àjèjì náà sínú Yorùbá, nítorí pé àkọsílẹ̀ fúnra rẹ̀ pa orúkọ náà mọ́ kí ó tó ṣàlàyé ìtumọ̀ rẹ̀.
- source_word: ὅ ἐστιν
  choice: èyí tí ó túmọ̀ sí
  rationale: Gbólóhùn yìí fi hàn pé ohun tí ó tẹ̀ lé e jẹ́ ìtumọ̀ orúkọ Semitic náà; yíyan yìí jẹ́ kedere ní Yorùbá òde òní.
- source_word: Υἱοὶ Βροντῆς
  choice: Àwọn Ọmọ Àrá
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán alágbára ti orúkọ àpèjáde náà mọ́. ‘Àwọn’ mú ọ̀pọ̀ Υἱοὶ hàn ní kedere.
theological_decisions:
- issue: Bí a ṣe máa gbé orúkọ àpèjáde Jákọ́bù àti Jòhánù kalẹ̀
  choice: Pa ‘Bóánẹ́gẹ́sì’ mọ́ gẹ́gẹ́ bí orúkọ tí a kọ ní ìró Yorùbá, kí a sì fi ìtumọ̀ rẹ̀, ‘Àwọn Ọmọ Àrá,’ tẹ̀ lé e.
  alternative: Kí a túmọ̀ ìtumọ̀ náà nìkan, láìkọ ‘Bóánẹ́gẹ́sì’; tàbí kí a kọ ‘àwọn ọmọ àrá’ bí gbólóhùn lásán.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ pa ìrísí àjèjì náà àti ìtumọ̀ rẹ̀ mọ́. Fífi àwọn méjèèjì sílẹ̀ ń pa àwọ̀ àti ìfọkànsìn ìtàn náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, èdè ọ̀wọ̀ tí ó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa àkójọ gírámà ẹsẹ tó yí i ká mọ́ nípa bẹ̀rẹ̀ pẹ̀lú ‘àti’ àti parí pẹ̀lú àmì kọ́má.
