  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: yo
  text: Nígbà tí àwọn tó sún mọ́ ọn[a] gbọ́, wọ́n jáde lọ láti mú un, nítorí wọ́n ń sọ pé, “Orí rẹ̀ ti dàrú.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdílé rẹ̀” tàbí “àwọn ènìyàn tirẹ̀.” Gbólóhùn Gíríìkì náà jẹ́ àkànlò èdè, ó sì lè tọ́ka ní pàtó sí àwọn ará ilé Jesu tàbí àwọn tó wà nínú ẹgbẹ́ tímọ́tímọ́ rẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Kò sí ní ipò ara rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: àwọn tó sún mọ́ ọn
  rationale: Gbólóhùn Gíríìkì yìí jẹ́ àkànlò èdè tí ó lè tọ́ka sí ìdílé Jesu, àwọn ará ilé rẹ̀, tàbí àwọn alábàáṣiṣẹ́ tímọ́tímọ́ rẹ̀. Yíyan ‘àwọn tó sún mọ́ ọn’ pa àìdánilójú yẹn mọ́ ní Yorùbá àdánidá.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́ nípa ohun tó ń ṣẹlẹ̀
  rationale: Ọ̀rọ̀ aṣáájú aorist náà ń fi àkókò àti ìtẹ̀lé ìṣẹ̀lẹ̀ hàn. Àfikún ‘nípa ohun tó ń ṣẹlẹ̀’ mú kí Yorùbá péye nípa ohun tí wọ́n gbọ́ láìfi kúlẹ̀kúlẹ̀ tuntun kún ìtàn.
- source_word: ἐξῆλθον
  choice: wọ́n jáde lọ
  rationale: Èyí fi ìṣípòpadà inú ìtàn hàn ní ọ̀nà Yorùbá tí ó ṣe déédéé, láìsọ ibi tí wọ́n ti jáde ní pàtó.
- source_word: κρατῆσαι αὐτόν
  choice: láti mú un
  rationale: ‘Mú un’ lè túmọ̀ sí dí ẹni mú tàbí gba á lọ́wọ́, ó sì pa agbára inú κρατέω mọ́ láìsọ pé ìmúṣẹ òfin ni tàbí pé ète wọn ni láti dè é.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àmì àìparí imperfect inú Gíríìkì ń tọ́ka sí ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí wọ́n ń sọ léraléra; ‘ń sọ’ fi ìhà yẹn hàn ní Yorùbá.
- source_word: ἐξέστη
  choice: Orí rẹ̀ ti dàrú
  rationale: Àkànlò Yorùbá yìí sọ ẹ̀sùn pé ọkàn tàbí ìrònú ẹni kò dúró déédéé, láìlo ọ̀rọ̀ tó le jù bí ‘ó ya wèrè.’
theological_decisions:
- issue: Àwọn wo ni οἱ παρ’ αὐτοῦ?
  choice: A túmọ̀ rẹ̀ ní gbogbogbòò sí ‘àwọn tó sún mọ́ ọn.’
  alternative: ‘ìdílé rẹ̀,’ ‘àwọn ará ilé rẹ̀,’ tàbí ‘àwọn ènìyàn tirẹ̀’
  rationale: Àwọn ẹsẹ tó tẹ̀ lé e mú kí ìdílé Jesu ṣeé ṣe gan-an, ṣùgbọ́n gbólóhùn Gíríìkì fúnra rẹ̀ kò lo ọ̀rọ̀ ìbátan ní tààrà. Ìtumọ̀ àkọ́kọ́ kò gbọ́dọ̀ pinnu ohun tí orísun fi sílẹ̀ ní àìdánilójú.
- issue: Ìtumọ̀ ẹ̀sùn ἐξέστη
  choice: ‘Orí rẹ̀ ti dàrú.’
  alternative: ‘Kò sí ní àárín ara rẹ̀’ tàbí ‘Ó ti ya wèrè.’
  rationale: Ọ̀rọ̀ náà lè sọ pé ẹni ti pàdánù ìwọ̀ntúnwọ̀nsì ọpọlọ tàbí pé kò sí ní ipò ara rẹ̀. Yíyan yìí jẹ́ kedere, ó sì yẹra fún fífi ẹ̀sùn tó le ju ti Gíríìkì lọ kún un.
translation_notes:
  register: A lo Yorùbá àgbàṣe òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá. ‘Àwọn tó sún mọ́ ọn’ àti ‘Orí rẹ̀ ti dàrú’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lásán lè lóye, wọ́n sì pa àìdánilójú àti agbára ẹ̀sùn inú orísun mọ́.
