id: MRK.3.27
reference: Mark 3:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: yo
  text: Ṣùgbọ́n kò sí ẹni tí ó lè wọ inú ilé ọkùnrin alágbára[b] kí ó sì kó ohun-ìní rẹ̀[a] lọ ní ìkógun, bí kò bá kọ́kọ́ dè ọkùnrin alágbára náà mọ́; nígbà náà ni yóò tó kó gbogbo ohun inú ilé rẹ̀ lọ ní ìkógun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn nǹkan rẹ̀” tàbí, ní títẹ̀lé ọ̀rọ̀ náà gan-an, “àwọn ohun èlò rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ọkùnrin alágbára” jẹ́ ara àkàwé Jésù nípa bí Jésù ṣe borí Sátánì; a pa àwòrán àkàwé náà mọ́ dípò kí a fi ìtumọ̀ rẹ̀ hàn gbangba nínú ọ̀rọ̀ pàtàkì.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ọ̀rọ̀ yìí àti ẹ̀sùn tí wọ́n ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: οὐδεὶς δύναται
  choice: kò sí ẹni tí ó lè
  rationale: Ó pa ìtumọ̀ àìṣeéṣe mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ọkùnrin alágbára
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ ẹni; yíyan yìí pa àwòrán ọkùnrin alágbára mọ́, ó sì tún ọ̀rọ̀ kan náà ṣe ní ibi méjèèjì gẹ́gẹ́ bí Giriki.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ohun-ìní rẹ̀
  rationale: Ní àyíká jíjà ilé, σκεύη ń tọ́ka sí àwọn ohun tàbí dúkìá inú ilé ní gbogbogbòò, kì í ṣe ohun èlò tàbí ohun-èlò ìdáná nìkan.
- source_word: διαρπάσαι / διαρπάσει
  choice: kó ... ní ìkógun
  rationale: Ọ̀rọ̀ yìí fi hàn pé a gba ohun lọ pẹ̀lú agbára gẹ́gẹ́ bí ìkógun; ó lágbára ju ‘mú’ tàbí ‘kó lọ’ lásán lọ, ó sì bójú mu àwòrán jíjà ilé.
- source_word: ἐὰν μὴ πρῶτον
  choice: bí kò bá kọ́kọ́
  rationale: Ó pa ipò dandan àti bí dídè ọkùnrin alágbára ṣe gbọdọ̀ ṣáájú ìkógun mọ́.
- source_word: δήσῃ
  choice: dè ... mọ́
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún dídè ẹnì kan kí ó má bàa lè dá ẹni tó wọ ilé dúró.
- source_word: καὶ τότε
  choice: nígbà náà ni yóò tó
  rationale: Ìtòlẹ́sẹẹsẹ yìí tẹnu mọ́ pé lẹ́yìn tí a bá ti mú ipò àkọ́kọ́ ṣẹ ni ìkógun ilé yóò ṣeé ṣe.
theological_decisions:
- issue: Agbára àkàwé ‘ọkùnrin alágbára’ nínú àríyànjiyàn Jésù nípa Sátánì
  choice: A pa àkàwé ‘ọkùnrin alágbára’ mọ́ láì fi Sátánì sínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a túmọ̀ ọkùnrin alágbára náà ní tààràtà sí Sátánì nínú ẹsẹ náà.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àkàwé náà ń tọ́ka sí bí Jésù ṣe borí Sátánì, ṣùgbọ́n Giriki gbé e kalẹ̀ gẹ́gẹ́ bí àkàwé. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ohun tí àyíká ń túmọ̀ sí di ọ̀rọ̀ tí ẹsẹ náà sọ ní tààràtà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. ‘Kó ... ní ìkógun’ pa agbára ọ̀rọ̀ Giriki àti àwòrán jíjà ilé mọ́ láì sọ àkàwé náà di ẹ̀kọ́ ìtumọ̀ ní tààràtà.
