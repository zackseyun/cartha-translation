review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà dá ìfẹ̀sẹ̀mulẹ̀ Giriki pàtàkì mọ́: ìyàtọ̀ ‘Ṣùgbọ́n,’ ìṣeéṣe tí a ń sẹ́, wíwọ ilé ọkùnrin alágbára, dídè e ní àkọ́kọ́, àti ìkógun tí ó tẹ̀ lé e. Síbẹ̀, ‘kó ilé rẹ̀ ní ìkógun’ kì í ṣe ọ̀nà Yorùbá tí ó hàn gbangba; ‘ilé’ ní gbolohun Giriki ìkẹyìn ń ṣiṣẹ́ gẹ́gẹ́ bí gbogbo agbègbè/ohun inú ilé ẹni náà.'
  naturalness: ‘Kí ó sì kó’ lẹ́yìn ‘tí ó lè wọ’ lè dà bí ìpinnu tàbí èsì dípò ìṣe kejì tí ẹni náà lè ṣe. Ìṣètò ‘wọ ... kí ó kó ...’ ń dáa síi. Fífi ‘lọ’ kún ‘kó ... ní ìkógun’ sì jẹ́ kí ìtumọ̀ ìkógun náà jẹ́ Yorùbá òde-òní tí ó rọrùn.
  terminology: ‘Ọkùnrin alágbára,’ ‘dè ... mọ́,’ àti ‘ohun-ìní’ yẹ, wọ́n sì pa àwòrán àti ìtúnwí Giriki mọ́. Àlàyé akọsílẹ̀ b yẹ kí ó sọ Jésù gẹ́gẹ́ bí ẹni tí ó borí Sátánì, bí àlàyé Gẹ̀ẹ́sì ṣe sọ, láì sọ ìtumọ̀ àkàwé náà di apá ọ̀rọ̀ pàtàkì.
  issues:
  - severity: medium
    issue: ‘kó ilé rẹ̀ ní ìkógun’ kò dáa gẹ́gẹ́ bí gbolohun Yorùbá.
    rationale: Bí ó tilẹ̀ jẹ́ pé Giriki tún ‘ilé rẹ̀’ ṣe, ìtumọ̀ ọ̀rọ̀ náà níbí ni láti gba gbogbo ohun inú ilé/agbo ẹni alágbára náà. ‘Kó gbogbo ohun inú ilé rẹ̀ lọ ní ìkógun’ ń sọ èyí ní kedere, ó sì pa ìfọwọ́sowọpọ̀ àwòrán náà mọ́.
  - severity: low
    issue: Ìṣètò ‘tí ó lè wọ ... , kí ó sì kó ...’ lè ní ìtumọ̀ ìpinnu.
    rationale: Yíyí i sí ‘tí ó lè wọ ... kí ó sì kó ...’ láì fi àmì ìdádúró sí àárín, pẹ̀lú ‘lọ,’ ń jẹ́ kí àwọn ìṣe méjèèjì farahàn gẹ́gẹ́ bí ohun tí kò sí ẹni tó lè ṣe.
  - severity: low
    issue: Akọsílẹ̀ b sọ ‘bí a ṣe ń borí Sátánì’ dípò kí ó tọ́ka sí Jésù.
    rationale: Àlàyé ìtẹ̀lé Gẹ̀ẹ́sì sọ pé àkàwé náà jẹ́ nípa bí Jésù ṣe borí Sátánì. Àtúnṣe akọsílẹ̀ náà ń mú ìtàn àyíká náà péye, nígbà tí ọ̀rọ̀ pàtàkì ṣì jẹ́ àkàwé.
