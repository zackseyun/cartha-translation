  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: yo
  text: Ó sì di ọwọ́ afọ́jú náà mú, ó mú un jáde kúrò ní abúlé náà. Lẹ́yìn tí ó tutọ́ sínú ojú rẹ̀, tí ó sì gbé ọwọ́ lé e, ó bi í pé, “Ǹjẹ́ o rí ohunkóhun?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: Ó di ọwọ́ afọ́jú náà mú
  rationale: Ọ̀rọ̀ yìí sọ ní kedere pé ó di ọwọ́ ọkùnrin afọ́jú náà mú; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣe gidi náà mọ́.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: ó mú un jáde kúrò ní abúlé náà
  rationale: Ní àyíká ọ̀rọ̀ yìí, ẹni tí a di lọ́wọ́ ni a ń darí jáde; “mú un jáde” jẹ́ èdè Yorùbá tó rọrùn, tí “kúrò ní” sì fi ìtọ́sọ́nà síta hàn.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: Lẹ́yìn tí ó tutọ́ sí ojú rẹ̀
  rationale: A pa ìṣe ara tó ṣe kedere náà mọ́ láì dín un kù. “sí ojú rẹ̀” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, bó tilẹ̀ jẹ́ pé εἰς lè dà bí “sínú” ní ìtumọ̀ gidi.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: tí ó sì gbé ọwọ́ lé e
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún fífi ọwọ́ kan ẹni; kò fi èrò àṣà ìsìn tàbí ìlànà ìjọ kún ọ̀rọ̀ náà.
- source_word: ἐπηρώτα αὐτόν
  choice: ó bi í pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní imperfect, ìtàn Yorùbá ń sọ ìbéèrè kan ṣoṣo yìí lọ́nà àdánidá pẹ̀lú “ó bi í pé.”
- source_word: Εἴ τι βλέπεις;
  choice: Ǹjẹ́ o rí ohunkóhun?
  rationale: Ìtumọ̀ yìí pa ìbéèrè bóyá ìríran kankan wà mọ́, láì sọ pé ó rí tàbí kò rí.
theological_decisions:
- issue: Mímú gbogbo ìṣe ìwòsàn tó jẹ́ ti ara dúró láì rọ ọ̀rọ̀ náà
  choice: A sọ pé Jésù tutọ́ sí ojú rẹ̀, ó sì gbé ọwọ́ lé e.
  alternative: Kí a lo àtúnsọ tó dín ìṣe ara wọ̀nyí kù tàbí tó mú wọn rọrùn.
  rationale: Orísun náà ṣe àkọsílẹ̀ ìṣe wọ̀nyí ní tààrà; ìtumọ̀ kò gbọ́dọ̀ fọ wọn mọ́ tàbí sọ wọn di ohun mìíràn.
- issue: Èrò àṣà ìsìn tí “gbé ọwọ́ lé” lè mú wá
  choice: A lo gbólóhùn náà gẹ́gẹ́ bí ìfọwọ́kan fún ìwòsàn nínú àyíká ọ̀rọ̀.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ayẹyẹ ìjọ tàbí ìṣe sákírámẹ́ǹtì.
  rationale: Ẹsẹ̀ náà kò sọ nípa ìyàsímímọ́, ipò ìjọ, tàbí àṣẹ àṣà ìsìn; kò yẹ kí ìtumọ̀ fi irú èrò bẹ́ẹ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ọ̀rọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “afọ́jú náà” gẹ́gẹ́ bí orúkọ fún ẹni tí ajẹtífù Gíríìkì dúró fún, láì fi “ọkùnrin” kún ohun tí orísun kò sọ ní tààrà.
