source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: yo
  text: Lẹ́yìn náà, ó tún gbé ọwọ́ méjèèjì rẹ̀ lé ojú ọkùnrin náà[a]. Ọkùnrin náà sì rí kedere, ó sì padà bọ̀ sípò[b], ó sì ń rí ohun gbogbo ní pàtó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan ní gbólóhùn tí a lè túmọ̀ sí: “ó sì wò fínnífínní, ó padà bọ̀ sípò, ó sì rí ohun gbogbo kedere.”'
    reason: textual_variant
  - marker: b
    text: 'Tàbí: “ó sì lè rí ohun gbogbo kedere.” Ọ̀rọ̀-ìṣe tó gbẹ̀yìn wà ní irú àkókò tí ń tọ́ka sí ìṣe tí ó ń bá a lọ, pẹ̀lú ọ̀rọ̀ kan tó túmọ̀ sí rírí kedere tàbí ní pàtó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Lẹ́yìn náà, ó tún
  rationale: “Lẹ́yìn náà” fi ìtẹ̀síwájú àkókò hàn, “ó tún” sì pa ìtumọ̀ ìṣe kejì mọ́.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: gbé ọwọ́ rẹ̀ lé ojú ọkùnrin náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọwọ́ lé ẹnìkan. Bí ó tilẹ̀ jẹ́ pé “ọwọ́” lè ní ìtumọ̀ ọ̀pọ̀ nínú àyíká yìí, ó yàgò fún gbólóhùn tí kò wọ́pọ̀.
- source_word: διέβλεψεν
  choice: ríran kedere
  rationale: Ó mú ìtumọ̀ rírí kedere tàbí ìpadàbọ̀ ìríran hàn láì fi èrò “wo sókè” tàbí “wo fínnífínní” tí kì í ṣe dandan sí ọ̀rọ̀ náà.
- source_word: ἀπεκατέστη
  choice: padà bọ̀ sípò
  rationale: Ó pa ìtumọ̀ ìmúpadàbọ̀ sí ipò tó yẹ mọ́, láì sọ ọ́ di “a mú un láradá” ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐνέβλεπεν
  choice: ń rí
  rationale: Àmì “ń” fi ìṣe tí ó ń bá a lọ hàn, ó sì bá imperfect Gíríìkì mu ju fífi gbogbo ìṣe náà sí àkókò tí ó ti parí lọ.
- source_word: τηλαυγῶς
  choice: ní pàtó
  rationale: Ó sọ pé ìríran náà ṣe kedere, ó sì dín àtúnlò “kedere” lẹ́ẹ̀mejì nínú gbólóhùn kan kù.
- source_word: ἅπαντα
  choice: ohun gbogbo
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ gbogbo ohun tí ó rí hàn.
theological_decisions:
- issue: Àwòrán ìmúláradá ní ìpele méjì
  choice: 'A pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà mọ́: ó kọ́kọ́ ríran kedere, ó padà bọ̀ sípò, lẹ́yìn náà ó ń rí ohun gbogbo ní pàtó.'
  alternative: Kí a sọ gbogbo àwọn ọ̀rọ̀-ìṣe náà gẹ́gẹ́ bí ìṣe kan ṣoṣo tí ó parí lójijì.
  rationale: Àtòjọ àwọn ọ̀rọ̀-ìṣe Gíríìkì àti imperfect ἐνέβλεπεν ń fi ìtẹ̀síwájú àti ipò tí ó ń bá a lọ hàn. Ìtumọ̀ yìí kò mú ìfarahàn ìpele méjì náà kúrò.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A tún darúkọ “ọkùnrin náà” lẹ́yìn àmi ìdádúró láti mú kí ẹni tó jẹ́ olùṣe àwọn ọ̀rọ̀-ìṣe tó tẹ̀ lé e ṣe kedere, láì yí ìtumọ̀ orísun padà.
