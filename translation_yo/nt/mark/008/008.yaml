  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: yo
  text: Wọ́n sì jẹun, wọ́n sì yó,[a] wọ́n sì kó agbọ̀n méje ti àwọn ajẹkù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì σπυρίδας ń tọ́ka sí àwọn agbọ̀n; ó ṣeé ṣe kí wọ́n jẹ́ agbọ̀n ńlá. Máàkù lo ọ̀rọ̀ mìíràn fún “agbọ̀n” nínú ìtàn fífún ẹgbẹ̀rún márùn-ún ní oúnjẹ (κόφινοι, 6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: wọ́n jẹun
  rationale: Ọ̀rọ̀ náà jẹ́ ìtàn ohun tí wọ́n ṣe ní àkókò tí ó ti kọjá; “jẹun” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n jẹ oúnjẹ láìfi ìtẹnumọ́ míì kún un.
- source_word: ἐχορτάσθησαν
  choice: wọ́n yó
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé wọ́n jẹun débi pé ó tó wọn; “wọ́n yó” jẹ́ kedere, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἦραν
  choice: wọ́n kó
  rationale: Ní àyíká kíkó ohun tó ṣẹ́ kù jọ, “kó” sọ ìṣe náà ní Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní ọ̀rọ̀ gangan gẹ́gẹ́ bí “gbé sókè” lọ.
- source_word: περισσεύματα κλασμάτων
  choice: ajẹkù
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ẹ̀ka oúnjẹ tí ó ṣẹ́ kù. “Ajẹkù” jẹ́ ọ̀rọ̀ Yorùbá ṣókí tí ó mú èrò ohun tí ó ṣẹ́ kù lẹ́yìn jíjẹ jáde.
- source_word: ἑπτὰ σπυρίδας
  choice: agbọ̀n ńlá méje
  rationale: σπυρίς jẹ́ irú agbọ̀n tí ó ṣeé ṣe kí ó tóbi ju κόφινος tí Máàkù lò ní 6:43 lọ. Fífi “ńlá” sínú ọ̀rọ̀ mú ìyàtọ̀ ọ̀rọ̀ Gíríìkì náà hàn ní ṣókí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ìsọ̀rọ̀ ìtàn tó rọrùn, tó bójú mu, tí òǹkàwé òde òní lè lóye. A lo “wọ́n yó” fún ìtẹ́lọ́rùn lẹ́yìn jíjẹ, àti “ajẹkù” fún àwọn ẹ̀ka oúnjẹ tó ṣẹ́ kù.
