source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: yo
  text: Ó sì gbé ojú sókè[a], ó ní, “Mo rí àwọn ènìyàn, nítorí pé mo rí wọn bí àwọn igi; àwọn ènìyàn náà ń rìn káàkiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì tún ríran.”
    reason: Ọ̀rọ̀ Gíríìkì ἀναβλέψας lè túmọ̀ sí ‘gbé ojú sókè’ tàbí, nínú àyíká ìwòsàn ojú, ‘tún ríran.’
lexical_decisions:
- source_word: ἀναβλέψας
  choice: gbé ojú sókè
  rationale: Ó tẹ̀ lé ìtumọ̀ gidi ‘gbé ojú sókè/wo òkè,’ ó sì bá ìṣe tí ọ̀rọ̀ náà ń ṣàpèjúwe mu; àlàyé ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: A pa ìbáṣepọ̀ ìdí tí ὅτι lè fi hàn mọ́, gẹ́gẹ́ bí ẹ̀rí Gíríìkì àti ìtumọ̀ ìtọ́kasí ṣe gbà láàyè.
- source_word: ὡς δένδρα
  choice: bí igi
  rationale: Ìtumọ̀ tààrà ni fún àfiwé ẹni tí ojú rẹ̀ kò tíì ríran kedere.
- source_word: περιπατοῦντας
  choice: wọ́n ń rìn káàkiri
  rationale: Ọ̀rọ̀ Gíríìkì náà bá ‘àwọn ènìyàn’ mu ní ìbámu gírámà; gbólóhùn Yorùbá yìí mú kedere pé àwọn ènìyàn ni wọ́n ń rìn, kì í ṣe igi.
theological_decisions:
- issue: Bóyá ἀναβλέψας túmọ̀ sí pé ó gbé ojú sókè tàbí pé ó tún ríran
  choice: gbé ojú sókè
  alternative: tún ríran
  rationale: Ìtumọ̀ àkọ́kọ́ bá fọ́ọ̀mù ọ̀rọ̀ náà àti ìtumọ̀ ìtọ́kasí mu, ṣùgbọ́n a kò fi ìtumọ̀ kejì pamọ́; a mẹ́nu kàn án nínú àlàyé ìsàlẹ̀ láìfi ẹ̀kọ́ ìsìn kankan kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A pa àwòrán àrà ọ̀tọ̀ ti ‘ènìyàn bí igi’ àti ìtẹ̀síwájú ìwòsàn náà mọ́.
