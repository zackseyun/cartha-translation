  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ìtúmọ̀ pàtàkì Gíríìkì hàn, ṣùgbọ́n ‘igi’ yẹ kí ó wà ní púpọ̀ gẹ́gẹ́ bí δένδρα. Ìpínrọ̀ gbólóhùn náà tún yẹ kí ó sọ ní kedere pé àwọn ènìyàn—kì í ṣe àwọn igi—ni wọ́n ń rìn káàkiri, ní ìbámu pẹ̀lú participle akọ́ ọkùnrin púpọ̀ περιπατοῦντας.
  naturalness: Èdè àkọ́kọ́ lóye, ṣùgbọ́n ‘bí igi, wọ́n ń rìn káàkiri’ lè jẹ́ kí ìtọ́kasí ‘wọ́n’ dà rú. Àtúnṣe náà jẹ́ Yorùbá òde-òní tó mọ́, ó sì pa àwòrán àjèjì inú ọ̀rọ̀ ìpilẹ̀ mọ́.
  terminology: ‘Gbé ojú sókè’ jẹ́ ìtumọ̀ tó ṣeé gbà fún ἀναβλέψας. A pa àṣàyàn míì, ‘tún ríran,’ mọ́ nínú àlàyé ìsàlẹ̀, ṣùgbọ́n a tún ọ̀rọ̀ àlàyé náà ṣe sí Yorùbá tó péye.
