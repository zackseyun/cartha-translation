  rationale: A rọ́pò “àwọn” pẹ̀lú “wọ́n” kí arọ́pò-orúkọ kókó-ọrọ ọ̀pọ̀ náà lè jẹ́ Standard Yorùbá tí ó ṣe déédé. A tún ṣàtúnṣe gbolohun àlàyé ìsàlẹ̀ náà kí ó sọ ‘more literally’ ní Yorùbá ní tòótọ́. Ìyókù ìtumọ̀ náà pa ìtumọ̀, ìṣe tí ó ń lọ, àti ìbáṣepọ̀ alápadà nínú Gíríìkì mọ́.
