review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì náà dáadáa: “ń bá ara wọn sọ̀rọ̀” ń fi ìṣe tí ó ń tẹ̀síwájú ti διελογίζοντο hàn, “bá ara wọn” ń ṣàfihàn πρὸς ἀλλήλους, àti “pé” ń ṣàfihàn ὅτι gẹ́gẹ́ bí gbolohun àkóónú. “Búrẹ́dì” jẹ́ ìtumọ̀ àdánidá fún ἄρτους nínú àyíká yìí, pẹ̀lú àlàyé fún ọ̀pọ̀ ‘ìṣù.’'
  naturalness: Ìbẹ̀rẹ̀ gbolohun náà jẹ́ Yorùbá òde òní tó rọrùn. Ṣùgbọ́n “àwọn kò ní” kò ṣe déédé níbí gẹ́gẹ́ bí kókó-ọrọ ẹni kẹta púpọ̀; “wọ́n kò ní” ni ìlò tó mọ́gbọ́n dání jù. Ọ̀rọ̀ àlàyé ìsàlẹ̀ náà gbọdọ̀ tún yí padà, nítorí “ní ṣókí sí i” túmọ̀ sí fífi ọ̀rọ̀ kúrú sí i, kì í ṣe “more literally.”
  terminology: “Búrẹ́dì” yẹ fún bread. “Ìṣù búrẹ́dì” lè ṣàfihàn ‘loaves,’ bí ó tilẹ̀ jẹ́ pé “ìṣù” ní àwọn ìtumọ̀ mìíràn nínú Yorùbá; níbi àlàyé tí ó sọ pé a ń tọ́ka sí búrẹ́dì tí a lè kà, ó yé. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìjọ tàbí ọ̀rọ̀ orúkọ tó nílò àtúnṣe.
  issues:
  - severity: medium
    issue: Arọ́pò-orúkọ “àwọn” nínú “pé àwọn kò ní búrẹ́dì.”
    rationale: Fun kókó-ọrọ ẹni kẹta púpọ̀, “wọ́n” ni ìlò Standard Yorùbá tó péye àti tó hàn kedere. “Àwọn” sábà máa ń ṣiṣẹ́ gẹ́gẹ́ bí àmì ọ̀pọ̀ tàbí apá kan nínú ọ̀rọ̀-orúkọ, nítorí náà ó lè dá òye dúró níbí.
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ náà lo “ní ṣókí sí i” láti ṣàlàyé ìtumọ̀ gangan.
    rationale: “Ní ṣókí sí i” jẹ́ ‘more concisely,’ kì í ṣe ‘more literally.’ A gbọdọ̀ lo ìsọ̀rọ̀ tó tọ́ fún ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ gangan.
  revised_text: Wọ́n sì ń bá ara wọn sọ̀rọ̀ pé wọ́n kò ní búrẹ́dì[a].
