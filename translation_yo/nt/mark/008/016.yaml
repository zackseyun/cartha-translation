  text: And they were discussing with one another that they had no bread[a].
translation:
  language: yo
  text: Wọ́n sì ń bá ara wọn sọ̀rọ̀ pé wọ́n kò ní búrẹ́dì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ gangan, “wọ́n kò ní ìṣù búrẹ́dì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: ń bá ara wọn sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí fi ìjíròrò tí ó ń lọ lọ́wọ́ láàárín àwọn ọmọ-ẹ̀yìn hàn; ìṣe aláìparí náà ni “ń” fi hàn ní Yorùbá.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Ó sọ ìbáṣepọ̀ alápadà láàárín wọn jáde ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣe àgbékalẹ̀ ohun tí wọ́n ń sọ̀rọ̀ nípa rẹ̀, kì í ṣe ìdí; “pé” ni ó bá ìtumọ̀ yìí mu.
- source_word: ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ “ìṣù búrẹ́dì,” “búrẹ́dì” jẹ́ ọ̀rọ̀ àkójọpọ̀ tí ó mọ́gbọ́n dání ní Yorùbá. A pa ìtumọ̀ gẹ́gẹ́ bí ìṣù tí a lè kà mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οὐκ ἔχουσιν
  choice: àwọn kò ní
  rationale: Ìṣe àsìkò ìsinsìnyí nínú ọ̀rọ̀ tí a ròyìn ni orísun náà lò. Yorùbá lè pa ojú-ìwòye yẹn mọ́ lọ́nà àdánidá pẹ̀lú “àwọn kò ní,” nígbà tí ìṣe àkọ́kọ́ “ń ... sọ̀rọ̀” ń gbé ìṣẹ̀lẹ̀ náà sínú ìtàn.
