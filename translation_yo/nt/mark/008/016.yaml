translation_notes:
  register: A lo Yorùbá àfẹnusọ tó ṣe déédé, tó ní iyì, tí ó sì yé òǹkàwé òde òní. A lo “àwọn” gẹ́gẹ́ bí arọ́pò-orúkọ nínú gbólóhùn tí wọ́n sọ láti mú kí ó yé kedere pé àwọn ọmọ-ẹ̀yìn ń tọ́ka sí ara wọn.
