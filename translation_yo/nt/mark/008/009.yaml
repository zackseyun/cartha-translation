lexical_decisions:
- source_word: ἦσαν
  choice: Àwọn ènìyàn náà … tó
  rationale: Èyí sọ iye àwọn ènìyàn inú ogunlọ́gọ̀ náà ní Yorùbá àdánidá, dípò títúmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ànímọ́ wọn.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́; “sì” bá ìṣàn ìtàn mu láìfi ìtumọ̀ àsìkò kún un.
- source_word: ὡς
  choice: nǹkan bí
  rationale: Níwájú nọ́ńbà, ὡς fi hàn pé iye náà kì í ṣe iye pàtó; “nǹkan bí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìsúnmọ́ iye.
- source_word: τετρακισχίλιοι
  choice: ẹgbẹ̀rún mẹ́rin
  rationale: Èyí ni ìtumọ̀ tààrà nọ́ńbà náà, ó sì ń tọ́ka sí iye àwọn ènìyàn inú ogunlọ́gọ̀.
- source_word: ἀπέλυσεν
  choice: rán wọn lọ
  rationale: Nínú àyíká yìí, ἀπολύω túmọ̀ sí jíjẹ́ kí ogunlọ́gọ̀ náà kúrò tàbí pí wọn ká; “rán wọn lọ” ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: αὐτούς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka padà sí àwọn ènìyàn inú ogunlọ́gọ̀.
