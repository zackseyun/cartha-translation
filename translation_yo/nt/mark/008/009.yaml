translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tó bá ti yẹ, a sì lo “sì” láti pa àsopọ̀ pẹ̀lẹ́ δὲ mọ́ láìsọ ọ́ di àmì àsìkò pàtó.
