translation:
  language: yo
  text: Àwọn ènìyàn náà sì tó nǹkan bí ẹgbẹ̀rún mẹ́rin. Ó sì rán wọn lọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
