  text: καὶ ⸀ἠρώτα αὐτούς· Πόσους ἔχετε ἄρτους; οἱ δὲ εἶπαν· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: yo
  text: Ó sì béèrè lọ́wọ́ wọn pé, “Ìṣù búrẹ́dì mélòó ni ẹ ní?” Wọ́n sì sọ pé, “Méje.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Ó ń tẹ̀ lé ìṣàn ìtàn Máàkù lọ́nà àdánidá, láì fi ìtumọ̀ àkókò míì kún ọ̀rọ̀ Gíríìkì.
- source_word: ἠρώτα
  choice: bi … pé
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà lè tọ́ka sí ìṣe tí ń lọ lọ́wọ́, ṣùgbọ́n nínú ìtàn Yorùbá, ‘bi … pé’ sọ ìbéèrè náà ní kedere àti lọ́nà àdánidá.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ tí ó tọ́ka sí àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ẹni tí Jesu ń béèrè lọ́wọ́.
- source_word: Πόσους
  choice: mélòó
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè iye ohun tí a lè kà.
- source_word: ἔχετε
  choice: ẹ ní
  rationale: Ó pa ẹni kejì ọ̀pọ̀ mọ́, ó sì bá ọ̀nà Yorùbá òde òní mu.
- source_word: ἄρτους
  choice: ìṣù búrẹ́dì
  rationale: Nítorí pé a ń ka àwọn ẹyọ ọ̀tọ̀ọ̀tọ̀, ‘ìṣù búrẹ́dì’ ṣe kedere ju ‘búrẹ́dì’ lásán lọ.
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì dáhùn pé
  rationale: ‘Wọ́n’ tọ́ka sí ẹgbẹ́ tí ó ń fèsì; ‘dáhùn’ jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ọ̀rọ̀ tí wọ́n sọ lẹ́yìn ìbéèrè kalẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí ‘sọ.’
- source_word: Ἑπτά
  choice: Méje
  rationale: Nọ́ńbà ìdáhùn náà ni a túmọ̀ ní tààràtà.
theological_decisions: []
translation_notes:
  register: Yorùbá àṣàṣe pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ’ fún ẹni kejì ọ̀pọ̀, ‘ìṣù búrẹ́dì’ sì mú kíkà àwọn ìṣù náà ṣe kedere.
