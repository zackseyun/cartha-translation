id: MRK.8.28
reference: Mark 8:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: yo
  text: Wọ́n sì sọ fún un[a] pé, “Jòhánù ẹni tí ń batisí ni; àwọn mìíràn ní, Èlíjà ni; àwọn mìíràn sì ní, ọ̀kan lára àwọn wòlíì ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kíkún sí i, “Wọ́n sì sọ fún un, wọ́n ní, ‘Jòhánù ẹni tí ń batisí ni; àwọn mìíràn ní, Èlíjà ni; àwọn mìíràn sì ní, ọ̀kan lára àwọn wòlíì ni.’” Èdè Gíríìkì ní “wọ́n sọ fún un, wọ́n ní”; ó sì fi “ìwọ ni” tí a lóye sílẹ̀ nínú àwọn abala tó tẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: “Wọ́n” tọ́ka sí àwọn ọmọ-ẹ̀yìn nínú ọ̀rọ̀ tó ṣáájú, “sì” sì fi ìsopọ̀ pẹ̀lẹ́ ti δέ hàn láì mú un le jù.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: sọ fún un
  rationale: Èdè Gíríìkì lo ọ̀rọ̀ ìṣe λέγω lẹ́ẹ̀mejì nínú àkójọpọ̀ ọ̀rọ̀ ìròyìn. “Sọ fún un” jẹ́ ọ̀nà Yorùbá tó ṣe déédé, tó sì dá ìtumọ̀ náà dúró láì tún “sọ” ṣe lọ́nà àjèjì.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ tí wọ́n ròyìn sílẹ̀ ní Yorùbá.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jòhánù Oníbatisí
  rationale: “Oníbatisí” fi ipa ẹni tó ń batisí hàn, kì í sì í tọ́ka sí ẹ̀sìn ìjọ kan nínú àyíká yìí.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: àwọn mìíràn ... àwọn mìíràn sì
  rationale: Àtúnṣe yìí pa pínpín àwọn èrò oríṣiríṣi mọ́; “sì” jẹ́ asopọ̀ pẹ̀lẹ́ tó bá δέ mu ní Yorùbá.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: Èyí ni ìrísí orúkọ náà tó ti wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: ọ̀kan lára àwọn wòlíì ni
  rationale: Gbólóhùn náà jẹ́ kúkúrú nínú orísun, ó sì fi “ìwọ ni” sílẹ̀ láti inú àyíká. Yorùbá yìí pa ìkìmọ́ náà mọ́, ṣùgbọ́n “ni” mú ìdánimọ̀ náà ṣe kedere.
- source_word: προφητῶν
  choice: àwọn wòlíì
  rationale: “Wòlíì” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún προφήτης nígbà tí a ń sọ̀rọ̀ nípa àwọn aṣojú Ọlọ́run.
theological_decisions:
- issue: Bí a ṣe máa sọ àwọn ìdánimọ̀ tí àwọn ènìyàn fún Jésù
  choice: A gbé wọn kalẹ̀ gẹ́gẹ́ bí àkójọ kúkúrú, láì fi “ìwọ ni” kún ọ̀kọ̀ọ̀kan.
  alternative: “Àwọn kan ní ìwọ ni Jòhánù Oníbatisí, àwọn mìíràn ní ìwọ ni Èlíjà, àwọn mìíràn sì ní ìwọ ni ọ̀kan lára àwọn wòlíì.”
  rationale: Orísun Gíríìkì fi ọ̀rọ̀ ìṣe àti “ìwọ ni” sílẹ̀ nínú àwọn abala tó tẹ̀ lé. Àtúnṣe yìí pa ìkìmọ́ àti oríṣiríṣi èrò àwọn ènìyàn mọ́ láì yanju ohun tí orísun kò sọ ní kíkún.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó lọ́lá, tó ṣe déédé, tí àwọn òǹkàwé òde òní sì lè lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa àkójọ kúkúrú ti orísun mọ́.
