id: MRK.8.11
reference: Mark 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: yo
  text: Àwọn Farisí sì jáde, wọ́n sì bẹ̀rẹ̀ sí í bá a jiyàn. Wọ́n ń wá àmì kan láti ọ̀run lọ́wọ́ rẹ̀[a], láti dán an wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì kan láti ojú ọ̀run”; ó ṣeé ṣe jù pé gbólóhùn náà túmọ̀ sí àmì tó wá láti ọ̀run, ìyẹn ni pé, láti ọ̀dọ̀ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: jáde
  rationale: Ó pa ìtumọ̀ ìṣípòpadà ọ̀rọ̀ Gíríìkì mọ́ láì sọ ibi tí wọ́n ti jáde nígbà tí orísun kò sọ ọ́.
- source_word: ἤρξαντο συζητεῖν
  choice: bẹ̀rẹ̀ sí í bá a jiyàn
  rationale: ‘Bẹ̀rẹ̀ sí í’ fi ìbẹ̀rẹ̀ ìṣe hàn, ‘jiyàn’ sì bá àyíká ìtakora àti ìdánwò mu ju ìjíròrò lásán lọ.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: ń wá … lọ́wọ́ rẹ̀
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń fẹ́ kí òun fún wọn ní ohun tí wọ́n béèrè.
- source_word: σημεῖον
  choice: àmì
  rationale: ‘Àmì’ pa èrò ẹ̀rí tàbí ìfìdíṣẹ̀ múlẹ̀ mọ́, dípò lílo ọ̀rọ̀ tó túmọ̀ sí iṣẹ́ ìyanu nìkan.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó tẹ̀ lé ọ̀rọ̀ orísun, ó sì lè tọ́ka sí àmì tí orísun rẹ̀ jẹ́ ti Ọlọ́run láì ṣàlàyé rẹ̀ ré kọjá ohun tí ẹsẹ náà sọ.
- source_word: πειράζοντες αὐτόν
  choice: láti dán an wò
  rationale: Ó fi ète ìbéèrè wọn hàn, kò sì mú kí ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ń tàn án láti ṣẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘láti ọ̀run’ nínú ohun tí wọ́n béèrè
  choice: A fi ‘láti ọ̀run’ sínú ọ̀rọ̀ pàtàkì, èyí tó lè túmọ̀ sí àmì tó ní orísun tàbí àṣẹ láti ọ̀dọ̀ Ọlọ́run.
  alternative: Àmì kan láti ojú ọ̀run.
  rationale: Nínú àyíká Ìhìn Rere àti ìpèníjà àwọn Farisí, orísun tàbí ìfọwọ́sí Ọlọ́run ni ó ṣeé ṣe kó jẹ́ ìtumọ̀ rẹ̀; ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ojú ọ̀run mọ́ gẹ́gẹ́ bí àṣàyàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pín gbólóhùn Gíríìkì sí gbólóhùn méjì fún ìṣàn ọ̀rọ̀ Yorùbá tó ṣe kedere, láì yí ìbáṣepọ̀ àwọn ìṣe náà padà.
