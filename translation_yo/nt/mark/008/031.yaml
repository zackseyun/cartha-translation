id: MRK.8.31
reference: Mark 8:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: yo
  text: Ó sì bẹ̀rẹ̀ sí í kọ́ wọn pé ó pọn dandan kí Ọmọ Ènìyàn jìyà ohun púpọ̀, kí àwọn alàgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé kọ̀ ọ́ sílẹ̀, kí a pa á, kí ó sì jí dìde lẹ́yìn ọjọ́ mẹ́ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọjọ́ mẹ́ta.” Nínú èdè Gíríìkì, Máàkù kọ́ ọ pé “lẹ́yìn ọjọ́ mẹ́ta”; àwọn àṣà ìtumọ̀ Gẹ̀ẹ́sì kan sọ ọ́ ní ọ̀nà tí ó bá ìlò èdè mu tàbí mú un bá àwọn ẹsẹ̀ tó jọ ọ́ mu, tí wọ́n sọ pé “ní ọjọ́ kẹta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: bẹ̀rẹ̀ sí í kọ́ wọn
  rationale: Ó fi ìbẹ̀rẹ̀ ìṣe náà hàn ní Yorùbá àdánidá, ó sì pa ìyípadà inú ìtàn mọ́.
- source_word: δεῖ
  choice: ó pọndandan kí
  rationale: Èyí pa agbára ọ̀rọ̀ Gíríìkì tó ń sọ nípa ohun tó gbọ́dọ̀ ṣẹlẹ̀ mọ́, láìṣàlàyé ohun tó mú un pọndandan ju ohun tí ẹsẹ̀ náà sọ lọ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà tó taara, tó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú lílò rẹ̀ ní àwọn ibòmíràn nínú Ìwé Mímọ́ mọ́.
- source_word: πολλὰ παθεῖν
  choice: jìyà ohun púpọ̀
  rationale: Ó pa ọ̀pọ̀ ohun tí ìjìyà náà kàn mọ́, ó sì sún mọ́ ọ̀rọ̀ Gíríìkì ju ‘jìyà púpọ̀’ lọ.
- source_word: ἀποδοκιμασθῆναι
  choice: kí ... kọ̀ ọ́ sílẹ̀
  rationale: Yorùbá máa ń lo gbólóhùn aláṣe ní ti ẹ̀dá ju gbólóhùn àìṣe lọ; èyí sọ ìkọ̀sílẹ̀ látọwọ́ àwọn aṣáájú náà ní kedere.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: àwọn alàgbà
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ẹgbẹ́ àwọn aṣáájú Júù, kì í ṣe àwọn arúgbó lásán.
- source_word: τῶν ἀρχιερέων
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àlùfáà, kì í ṣe pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo wà.
- source_word: τῶν γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí pa orúkọ ẹgbẹ́ ìtàn náà mọ́, ó sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì Yorùbá mọ̀.
- source_word: ἀποκτανθῆναι
  choice: kí a pa á
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó taara, tó sì ṣe déédé pẹ̀lú ìṣe àìsọ ẹni tó pa á ní Gíríìkì.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: lẹ́yìn ọjọ́ mẹ́ta
  rationale: μετά pẹ̀lú accusative túmọ̀ sí ‘lẹ́yìn’; a pa ọ̀rọ̀ Máàkù mọ́ dípò mímú un bá ‘ní ọjọ́ kẹta’ mu.
- source_word: ἀναστῆναι
  choice: jí dìde
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni tó kú padà sí ìyè; ó tún pa ìṣe aláṣe inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìpọndandan inú àsọtẹ́lẹ̀ ìjìyà Jésù (δεῖ)
  choice: ó pọndandan kí
  alternative: Ọmọ Ènìyàn gbọdọ̀
  rationale: Gbólóhùn yìí jẹ́ kí ìpọndandan náà kan gbogbo ìjìyà, ìkọ̀sílẹ̀, ikú àti àjíǹde tí ó tẹ̀ lé e, láìfi ẹ̀kọ́ ìsìn míì kún un.
- issue: Àkókò tí μετὰ τρεῖς ἡμέρας ń tọ́ka sí
  choice: lẹ́yìn ọjọ́ mẹ́ta
  alternative: ní ọjọ́ kẹta; ní ọjọ́ mẹ́ta
  rationale: Ọ̀rọ̀ Gíríìkì Máàkù sọ ní tààrà pé ‘lẹ́yìn ọjọ́ mẹ́ta.’ A kò mú un bá ọ̀rọ̀ àwọn ìhìn rere mìíràn mu, kí a lè pa ìsọ Máàkù fúnra rẹ̀ mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìtòlẹ́sẹẹsẹ ‘ó pọndandan kí ...’ jẹ́ kí gbogbo àwọn ìṣe inú àsọtẹ́lẹ̀ náà wà lábẹ́ ìpọndandan kan náà, nígbà tí gbólóhùn aláṣe ‘àwọn ... kọ̀ ọ́ sílẹ̀’ àti aláìsọ aṣekúpani ‘a pa á’ jẹ́ Yorùbá tó rọrùn láti lóye.
