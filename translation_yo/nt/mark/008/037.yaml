  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: yo
  text: Nítorí kí ni ènìyàn lè fi ṣe ìpààrọ̀ fún ìyè rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀mí rẹ̀” tàbí “ara ẹni rẹ̀”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìyè,” “ara ẹni,” tàbí “ẹ̀mí,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Nítorí kí ni
  rationale: “Kí ni” dá ìbéèrè náà dúró, “nítorí” sì pa agbára ìṣàlàyé γάρ mọ́, ní ìbámu pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: δοῖ
  choice: lè fi ṣe
  rationale: 'Ọ̀nà yìí fi agbára ìbéèrè àsọ àsọdùn ti subjunctive hàn ní Yorùbá àdánidá: ohun wo ni ó ṣeé ṣe kí ènìyàn fi fúnni?'
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: ἄνθρωπος níbí dúró fún ẹnikẹ́ni ní gbogbogbòò; “ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sì fi akọ tàbí abo kún ohun tí ẹsẹ náà ń sọ.
- source_word: ἀντάλλαγμα
  choice: ṣe pàṣípààrọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a fi fúnni ní ìpadà tàbí ní pàṣípààrọ̀; gbólóhùn yìí ṣe kedere pé a ń béèrè ohun tí ènìyàn lè fi pààrọ̀ ẹ̀mí rẹ̀.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: ẹ̀mí rẹ̀
  rationale: ψυχή ní àyíká Máàkù 8:35–37 lè tọ́ka sí ìyè, ara-ẹni gbogbo, tàbí ọkàn/ẹ̀mí. “Ẹ̀mí” bá ìlò Yorùbá nínú irú ọ̀rọ̀ yìí mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “ìyè” àti “ara-ẹni” mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ nípa pípa tàbí pàdánù rẹ̀
  choice: ẹ̀mí
  alternative: ìyè; ara-ẹni
  rationale: Àyíká náà ní ìtumọ̀ ìyè ènìyàn, ṣùgbọ́n kò yẹ kí a dín ọ̀rọ̀ náà kù sí ìwàláàyè ara nìkan. “Ẹ̀mí” pa ìjinlẹ̀ ọ̀rọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì jẹ́ kí àwọn ìtumọ̀ míì hàn gbangba láìyanjú ìfẹ̀yàtọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A yan “pàṣípààrọ̀” láti sọ èrò ohun tí a fi fúnni ní ìpadà ní kedere, a sì fi àmì ohùn síbi tí ó bá yẹ.
