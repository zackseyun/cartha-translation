source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: yo
  text: Wọ́n sì dé Bẹtisáídà. Wọ́n sì mú ọkùnrin afọ́jú kan wá sọ́dọ̀ rẹ̀, wọ́n sì bẹ̀ ẹ́ pé kí ó fọwọ́ kan an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé
  rationale: Ìsinsìnyí ìtàn ni Gíríìkì lò; Yorùbá máa ń sọ ìṣẹ̀lẹ̀ ìtàn ní ọ̀nà àdánidá láì fi àmì àsìkò ọ̀rọ̀-ìṣe kún un. “Dé” sọ pé wọ́n dé ibi náà ní kedere.
- source_word: εἰς Βηθσαϊδάν
  choice: Bẹtisáídà
  rationale: A ṣe àfọwọ́kọ orúkọ ibi náà sí ìró Yorùbá; ọ̀rọ̀-ìṣe “dé” ti fi ìtọ́sọ́nà εἰς hàn, nítorí náà kò nílò àfikún “sí.”
- source_word: φέρουσιν
  choice: wọ́n mú ... wá sọ́dọ̀ rẹ̀
  rationale: “Mú ... wá sọ́dọ̀” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún mímú ènìyàn wá sí iwájú ẹlòmíràn, láì sọ pé wọ́n gbé e ní ọwọ́ tàbí ru ú.
- source_word: τυφλὸν
  choice: ọkùnrin afọ́jú kan
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó sì jẹ́ akọ ẹyọ; “ọkùnrin afọ́jú kan” mú ìtumọ̀ àti akọ náà hàn ní èdè Yorùbá àdánidá.
- source_word: παρακαλοῦσιν
  choice: wọ́n bẹ̀ ẹ́
  rationale: Ní àyíká yìí, παρακαλέω jẹ́ ẹ̀bẹ̀ tọkàntọkàn, kì í ṣe ìbéèrè lásán; “bẹ̀” mú ìtara ẹ̀bẹ̀ náà hàn.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: pé kí ó fọwọ́ kan an
  rationale: “Pé kí” jẹ́ ìṣètò Yorùbá àdánidá fún ohun tí wọ́n bẹ̀ pé kí ó ṣẹlẹ̀. “Fọwọ́ kan” túmọ̀ ἅπτομαι ní kedere, “an” sì ń tọ́ka sí ọkùnrin afọ́jú náà.
- source_word: καὶ
  choice: sì
  rationale: “Sì” pa ìsopọ̀ gbólóhùn léraléra ti Máàkù mọ́, ó sì dun bí Yorùbá ìtàn tó ní iyì ju fífi “àti” bẹ̀rẹ̀ gbogbo gbólóhùn lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá bá àṣà mu; ọ̀rọ̀ náà rọrùn, ó ní iyì, ó sì pa ìṣàn ìtàn alásopọ̀ ti Máàkù mọ́.
