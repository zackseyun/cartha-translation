  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì dá a lóhùn pé, “Níbo ni ẹnikẹ́ni yóò ti lè rí búrẹ́dì láti fi tẹ́ àwọn ènìyàn wọ̀nyí lọ́rùn níhìn-ín, ní ibi ahoro?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni ẹnikẹ́ni yóò ṣe lè fi búrẹ́dì tẹ́ àwọn ènìyàn wọ̀nyí lọ́rùn níhìn-ín, ní aginjù?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: dá a lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi èsì sí ẹni kan nínú ìtàn.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàgbékalẹ̀ ọ̀rọ̀ tààrà lẹ́yìn ọ̀rọ̀ ìdáhùn; ‘pé’ àti àmì ọ̀rọ̀ tààrà bá ìlò Yorùbá mu.
- source_word: Πόθεν
  choice: Níbo ni ... yóò ti rí
  rationale: Ó pa ìbéèrè nípa orísun búrẹ́dì mọ́, dípò yíyí i sí ìbéèrè gbogbogbò nípa ọ̀nà tí a ó gbà ṣe é.
- source_word: τούτους
  choice: àwọn ènìyàn wọ̀nyí
  rationale: Ó mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí hàn kedere, láì fi í mọ́ àwọn ọkùnrin nìkan.
- source_word: δυνήσεταί τις
  choice: ẹnikẹ́ni yóò ... lè
  rationale: Ó pa ìtumọ̀ agbára tàbí ṣíṣeéṣe àti ìtọ́ka ọjọ́ iwájú mọ́ ní Yorùbá àdánidá.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Èyí ni ìtumọ̀ ibi tó ṣe tààrà, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: χορτάσαι
  choice: tẹ́ ... lọ́rùn
  rationale: Nínú àyíká oúnjẹ, gbólóhùn yìí túmọ̀ sí fífún wọn ní oúnjẹ tó tó wọn, kì í ṣe fífún wọn ní díẹ̀ lásán.
- source_word: ἄρτων
  choice: búrẹ́dì
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún bread, láì sọ pé ìṣù búrẹ́dì mélòó kan ni.
- source_word: ἐπ’ ἐρημίας
  choice: ní ibi ahoro yìí
  rationale: Ó fi ibi tí ènìyàn kò fi bẹ́ẹ̀ gbé, tí ohun ìpèsè kò sì rọrùn láti rí, hàn ní èdè tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn níbi tó bá yẹ; èdè náà níyì, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo ‘Níbo ni ... ti rí’ láti pa ìbéèrè nípa orísun ìpèsè mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní yíyan ‘Báwo ni ... ṣe lè’.
