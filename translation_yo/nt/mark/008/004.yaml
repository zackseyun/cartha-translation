  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ gbogbogbò ẹsẹ̀ náà dáadáa: àwọn ọmọ-ẹ̀yìn dá Jesu lóhùn, wọ́n béèrè nípa ibi tí búrẹ́dì yóò ti wá, àti nípa bí a ṣe lè tẹ́ ogunlọ́gọ̀ ènìyàn náà lọ́rùn ní ibi asán. Síbẹ̀, ‘búrẹ́dì tó lè fi’ lè jẹ́ kí ó dà bíi pé búrẹ́dì náà fúnra rẹ̀ ló ní agbára, dípò ẹni náà (‘ẹnikẹ́ni’) ẹni tí δύναται ń ṣàpèjúwe. Àtúnṣe náà mú agbára ẹni náà àti ìṣe ọjọ́ iwájú hàn kedere.'
  naturalness: ‘Níbo ni ẹnikẹ́ni yóò ti lè rí búrẹ́dì láti fi tẹ́ ... lọ́rùn’ jẹ́ Yorùbá òde òní tó dára, tó sì jẹ́ ìbéèrè àdánidá. Yíyọ ‘yìí’ kúrò lẹ́yìn ‘ibi ahoro’ yẹra fún fífi ìtọ́kasí ‘níhìn-ín’ tún un léraléra, nígbà tí ó sì pa ὧδε mọ́.
  terminology: ‘Ọmọ-ẹ̀yìn,’ ‘dá ... lóhùn,’ ‘búrẹ́dì,’ àti ‘tẹ́ ... lọ́rùn’ bá ìforúkọsílẹ̀ ìtàn mímọ́ mu, wọ́n sì ṣàfihàn ἄρτων àti χορτάσαι láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
  issues:
  - severity: medium
    issue: Ìbáṣepọ̀ ‘tó lè fi’ kò ṣe kedere.
    rationale: Nínú akọ́pamọ́ náà, ‘búrẹ́dì tó lè fi’ lè tọ́ka agbára ‘lè’ sí búrẹ́dì. Gíríìkì δυνήσεταί τις sọ nípa agbára ẹnikẹ́ni. ‘Yóò ti lè rí búrẹ́dì láti fi’ so agbára náà mọ́ ẹnikẹ́ni ní kedere.
  - severity: low
    issue: ‘yìí’ lẹ́yìn ‘ibi ahoro’ tún ìtọ́kasí ibi ṣe.
    rationale: ‘Níhìn-ín’ ti ń túmọ̀ ὧδε tẹ́lẹ̀; Gíríìkì kò ní afihàn tó yàtọ̀ fún ‘ibi ahoro yìí.’ Yíyọ ọ́ kúrò jẹ́ kí gbólóhùn náà rọrùn láì pa ìtumọ̀ rẹ̀ dà.
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ lo ‘bọ́ àwọn ènìyàn ... ní búrẹ́dì.’
    rationale: Ọ̀rọ̀ náà kò ṣe kedere gẹ́gẹ́ bí àfidámọ́ χορτάσαι. ‘Fi búrẹ́dì tẹ́ ... lọ́rùn’ mú ìtumọ̀ fífún wọn ní oúnjẹ tó tó wọn hàn kedere, ó sì bá ọ̀rọ̀ àkọ́kọ́ mu.
