revisions:
- from: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì dá a lóhùn pé, “Níbo ni ẹnikẹ́ni yóò ti rí búrẹ́dì tó lè fi tẹ́ àwọn ènìyàn wọ̀nyí lọ́rùn níhìn-ín ní ibi ahoro yìí?”[a]
  to: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì dá a lóhùn pé, “Níbo ni ẹnikẹ́ni yóò ti lè rí búrẹ́dì láti fi tẹ́ àwọn ènìyàn wọ̀nyí lọ́rùn níhìn-ín, ní ibi ahoro?”[a]
  rationale: Àtúnṣe náà pa ìbéèrè Πόθεν (‘níbo ni ... ti’) mọ́, ó sì ṣètò ‘yóò ti lè’ kí ó le tọ́ka sí ẹnikẹ́ni, gẹ́gẹ́ bí δυνήσεταί τις. ‘Láti fi’ jẹ́ kó ye wa pé búrẹ́dì ni ohun èlò fífún àwọn ènìyàn náà ní oúnjẹ tó tó wọn. Àlàyé ìsàlẹ̀ ń fún ní yíyan ‘Báwo ni’ fún Πόθεν, ó sì lo ọ̀rọ̀ tó ṣe kedere fún χορτάσαι.
