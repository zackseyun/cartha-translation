id: MRK.8.6
reference: Mark 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: yo
  text: Ó sì pàṣẹ fún ọ̀pọ̀ ènìyàn náà pé kí wọ́n fi ara tì sílẹ̀ lórí ilẹ̀[a]. Nígbà náà, ó mú àwọn búrẹ́dì méje náà, lẹ́yìn tí ó dúpẹ́, ó ṣẹ́ wọ́n, ó sì ń fi wọ́n fún àwọn ọmọ-ẹ̀yìn rẹ̀ kí wọ́n lè gbé wọn kalẹ̀ níwájú ọ̀pọ̀ ènìyàn náà[b]; wọ́n sì gbé wọn kalẹ̀ níwájú ọ̀pọ̀ ènìyàn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n jókòó sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí fífi ara tì sílẹ̀ fún oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọ́n lè pín oúnjẹ náà fún wọn.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “gbé kalẹ̀ níwájú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: Ó sì pàṣẹ fún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àṣẹ tàbí ìtọ́ni léni lọ́wọ́. “Pàṣẹ fún” pa agbára ọ̀rọ̀ Gíríìkì mọ́, kò sì le jù nínú àyíká yìí. A tú ìsinsìnyí ìtàn náà sí ọ̀nà ìtàn Yorùbá tí ó bá àyíká mu.
- source_word: ἀναπεσεῖν
  choice: láti jókòó sílẹ̀
  rationale: Ní àṣà àsè ìgbà náà, ọ̀rọ̀ náà lè túmọ̀ sí fífi ara tì sílẹ̀ láti jẹun. “Jókòó sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí gbogbo ènìyàn lóye; àlàyé ìsàlẹ̀ fi ìtumọ̀ pàtó náà hàn.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀
  rationale: Nínú àyíká yìí, γῆ ni ojú ilẹ̀ tí àwọn ènìyàn jókòó sí, kì í ṣe ayé tàbí agbègbè ilẹ̀ kan.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: ó mú ìṣù búrẹ́dì méje náà
  rationale: Ἄρτοι jẹ́ àwọn ìṣù búrẹ́dì nínú ìtàn fífún ènìyàn ní oúnjẹ. “Ìṣù búrẹ́dì” ṣe kedere pé búrẹ́dì odidi ni a ń sọ.
- source_word: εὐχαριστήσας
  choice: ó dúpẹ́
  rationale: Èyí sọ ìdúpẹ́ lórí oúnjẹ láìfi ẹni tí a dúpẹ́ lọ́wọ́ rẹ̀ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἔκλασεν
  choice: ó bù wọ́n
  rationale: “Bù” jẹ́ ọ̀rọ̀ àdánidá fún pípín búrẹ́dì sí wẹ́wẹ́. Arọ́pò-orúkọ “wọ́n” tọ́ka sí ìṣù méje náà.
- source_word: ἐδίδου
  choice: ó sì ń fi wọ́n fún
  rationale: Àmì àkókò aláìpé Gíríìkì fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; “ń fi wọ́n fún” pa ìtumọ̀ yẹn mọ́.
- source_word: ἵνα παρατιθῶσιν
  choice: kí wọ́n lè gbé wọn ka iwájú ọ̀pọ̀ ènìyàn náà
  rationale: Παρατίθημι túmọ̀ ní pàtó sí gbígbé oúnjẹ sí iwájú ẹni. “Gbé wọn ka iwájú” tún mú iṣẹ́ pípín oúnjẹ fún ogunlọ́gọ̀ yéni, láìsọ ọ̀rọ̀ náà di “sìn” nìkan.
- source_word: παρέθηκαν
  choice: wọ́n sì gbé wọn ka iwájú wọn
  rationale: A tún lo gbólóhùn kan náà fún ìṣe àwọn ọmọ-ẹ̀yìn, ṣùgbọ́n “wọn” ní ìparí dín àtúnwí gígùn kù ní Yorùbá.
- source_word: ὄχλος
  choice: ọ̀pọ̀ ènìyàn
  rationale: “Ọ̀pọ̀ ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ogunlọ́gọ̀ ènìyàn, tí kò sì ní ìró àtijọ́.
theological_decisions:
- issue: Ìtẹ̀lé ìtàn àti ìró Ìdúpẹ́ Olúwa
  choice: A tú εὐχαριστήσας ní tààrà sí “ó dúpẹ́.”
  alternative: “Ó ṣe ìdúpẹ́” pẹ̀lú ìtumọ̀ ìlànà mímọ́ tàbí fífi “lọ́wọ́ Ọlọ́run” kún un.
  rationale: Ọ̀rọ̀ yìí jẹ́ èdè àsè tí ó lè rán oníkà létí ìṣe Kristẹni lẹ́yìn náà, ṣùgbọ́n ẹsẹ̀ náà kò sọ ẹ̀kọ́ sákrámẹ́ǹtì ní gbangba, kò sì darúkọ ẹni tí a dúpẹ́ lọ́wọ́ rẹ̀. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A yan “jòkó sílẹ̀” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì pa àṣà fífi ara tì jẹun mọ́ nínú àlàyé ìsàlẹ̀. Gbólóhùn “gbé wọn ka iwájú” pa àwòrán gidi παρατίθημι mọ́, bí ó tilẹ̀ jẹ́ pé àlàyé tún fúnni ní “pín wọn fún wọn.”
