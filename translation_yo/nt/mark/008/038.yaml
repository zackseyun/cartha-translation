id: MRK.8.38
reference: Mark 8:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ojú rẹ̀ bá tì nítorí mi àti nítorí àwọn ọ̀rọ̀ mi láàárín ìran panṣágà àti ẹlẹ́ṣẹ̀ yìí[a], Ọmọ Ènìyàn náà yóò tijú ẹni náà nígbà tí ó bá dé nínú ògo Baba rẹ̀ pẹ̀lú àwọn áńgẹ́lì mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìran aláìṣòótọ́ àti ẹlẹ́ṣẹ̀.’ A fi ‘panṣágà’ sí ẹsẹ̀ nítorí ọ̀rọ̀ Gíríìkì lo àwòrán àsọtẹ́lẹ̀ tó ṣe kedere ti panṣágà fún àìṣòótọ́ sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: ojú bá tì nítorí / ojú yóò sì tì ... nítorí
  rationale: Òwe Yorùbá ‘ojú tì ẹni nítorí ẹnì kan’ sọ ìtìjú nípa ẹni tàbí ọ̀rọ̀ rẹ̀ lọ́nà àdánidá, ó sì pa agbára ìdápadà tó wà nínú àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
- source_word: λόγους
  choice: àwọn ọ̀rọ̀
  rationale: Ó pa ọ̀pọ̀ nǹkan tí λόγους jẹ́ mọ́, ó sì dá ìtẹnumọ́ lórí ohun tí Jesu sọ dúró láì túmọ̀ ọ́ sí ‘ìhìn’ nìkan.
- source_word: γενεᾷ
  choice: ìran
  rationale: ‘Ìran’ ni ìtumọ̀ Yorùbá tó bá ‘generation’ mu, ó sì lè tọ́ka sí àwọn ènìyàn àti àkókò wọn ní àyíká ìwà rere tàbí búburú.
- source_word: μοιχαλίδι
  choice: panṣágà
  rationale: ‘Panṣágà’ pa àwòrán àsọtẹ́lẹ̀ tó ṣe kedere nípa àìṣòótọ́ mọ́, dípò yíyí i padà sí àlàyé ‘aláìṣòótọ́’ nìkan.
- source_word: ἁμαρτωλῷ
  choice: ẹlẹ́ṣẹ̀
  rationale: ‘Ẹlẹ́ṣẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé ìran náà kún fún ẹ̀ṣẹ̀, láì fi ìgbóná mìíràn kún ọ̀rọ̀ orísun.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa oyè Kristi yìí àti ìtumọ̀ ẹ̀kọ́ ìgbà ìkẹyìn rẹ̀ mọ́, láì rọ́pò rẹ̀ pẹ̀lú ‘Èmi’ tàbí ‘Mèsáyà.’
- source_word: δόξῃ
  choice: ògo
  rationale: ‘Ògo’ jẹ́ ọ̀rọ̀ Bíbélì tó wọ́pọ̀, ó sì gba èrò ọlá, ìtànṣán, àti ọlá àtọ̀runwá sínú.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: pẹ̀lú àwọn áńgẹ́lì mímọ́
  rationale: Ó tẹ̀lé àpèjúwe Gíríìkì ní ti gidi, láì fi ọ̀rọ̀ ohun-ìní ‘rẹ̀’ kún un.
- source_word: ὃς γὰρ ἐὰν
  choice: Nítorí ẹnikẹ́ni tí ... bá
  rationale: Ìlànà ‘ẹnikẹ́ni tí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn àídájú gbogbogbò, ‘Nítorí’ sì pa γάρ mọ́.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: láàárín ìran ... yìí
  rationale: ‘Láàárín’ ṣàfihàn àyíká àwùjọ àti ìwà tí ìtìjú náà ti ń fara hàn lọ́nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Agbára àpẹẹrẹ ọ̀rọ̀ μοιχαλίδι
  choice: Fi ‘panṣágà’ sínú ẹsẹ̀ gẹ́gẹ́ bí àwòrán àsọtẹ́lẹ̀ nípa àìṣòótọ́ sí Ọlọ́run.
  alternative: Túmọ̀ rẹ̀ sí ‘aláìṣòótọ́’ láti jẹ́ kí ìtumọ̀ àpẹẹrẹ náà hàn gbangba.
  rationale: Ọ̀rọ̀ Gíríìkì lo àwòrán ìwà panṣágà ní tààrà, gẹ́gẹ́ bí àwọn wòlíì ṣe máa ń sọ nípa àìṣòótọ́ sí májẹ̀mú. Dídá àwòrán náà dúró pa ìjápọ̀ Bíbélì àti ìfọkànsìn ẹ̀kọ́ rẹ̀ mọ́.
- issue: Ìtọ́kasí ‘Ọmọ Ènìyàn’
  choice: Pa oyè ‘Ọmọ Ènìyàn’ mọ́ gẹ́gẹ́ bí ó ti wà ní orísun.
  alternative: Rọ́pò rẹ̀ pẹ̀lú ‘Èmi’ tàbí ‘Mèsáyà.’
  rationale: Orísun Gíríìkì lo oyè pàtàkì kan tó ní agbára nípa ẹni Kristi àti ìgbà ìkẹyìn; rírọ́pò rẹ̀ yóò mú ìtumọ̀ náà dín kù, yóò sì tú ìdọ̀gba tó wà nínú ọ̀rọ̀ náà.
- issue: Ọ̀rọ̀ arọ́pò-orúkọ αὐτόν
  choice: Lo ‘rẹ̀’ nínú gbólóhùn ‘ojú yóò ... tì ... nítorí rẹ̀,’ èyí tí ó tọ́ka sí ẹnikẹ́ni ọ̀kọ̀ọ̀kan.
  alternative: Lo àgbékalẹ̀ ọ̀pọ̀ ènìyàn tàbí tún ‘ẹni náà’ sọ.
  rationale: Gíríìkì jẹ́ ẹyọ kan nínú gbólóhùn gbogbogbò. Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀,’ ṣùgbọ́n ó pa ẹyọ àti agbára aṣojú gbogbogbò náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. ‘Ojú tì ... nítorí’ ni a lò fún ìtìjú nípa ẹni kan; a pa ‘Ọmọ Ènìyàn,’ ‘ògo,’ àti àwòrán ‘panṣágà’ mọ́ nítorí ìwọ̀n ẹ̀kọ́ àti ìjápọ̀ wọn pẹ̀lú èdè Bíbélì.
