source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó wọ ọkọ̀ ojú omi pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì lọ sí agbègbè Dalmanuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gidi, ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀: “àwọn agbègbè Dalmanuta” tàbí “àwọn ìhà ilẹ̀ Dalmanuta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ hàn, ó sì bá ọ̀nà tí Máàkù fi ń sọ ìtàn rẹ̀ mu ní èdè Yorùbá àdánidá.
- source_word: ἐμβὰς
  choice: ó wọ inú
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó tọ́ka sí ohun tí ó ṣe ṣáájú lílọ rẹ̀; gbólóhùn Yorùbá yìí sọ ìtẹ̀lé ìṣe náà ní kedere.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọkọ̀ ojú omi tí ó bá àyíká Òkun Gálílì mu.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ἦλθεν
  choice: ó sì lọ
  rationale: Nínú ìtàn ìrìn sí ibi kan, ‘lọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣíkiri kúrò ní ibi tí wọ́n wà sí ibi mìíràn.
- source_word: τὰ μέρη
  choice: agbègbè
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, ó ń tọ́ka ní ọ̀nà àdánidá sí ẹkùn tàbí agbègbè kan; ‘agbègbè’ mú ìtumọ̀ ilẹ̀ náà jáde láìsọ ọ́ di líle.
- source_word: Δαλμανουθά
  choice: Dálímánútà
  rationale: Orúkọ ibi ni; a ṣe àfọwọ́kọ rẹ̀ sí bí ìró èdè Yorùbá ṣe rí, láìtumọ̀ orúkọ náà.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àṣàdé òní tí ó ní iyì, tí ó rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó jẹ́ àdánidá, a sì pa ìtẹ̀lé ìṣe inú Gíríìkì mọ́ ní gbólóhùn Yorùbá tó ń ṣàn dáadáa.
