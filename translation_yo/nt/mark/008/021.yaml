  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: yo
  text: Ó sì ń wí fún wọn pé[a], “Ẹ kò ha tíì lóye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì wí fún wọn pé.”
    reason: Imperfect ἔλεγεν lè jẹ́ àfihàn ìṣe tí ń lọ lọ́wọ́ (“ń wí”) tàbí kí a sọ ọ́ lọ́nà ìtàn Yorùbá tó rọrùn gẹ́gẹ́ bí “wí.”
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” pa ìsopọ̀ ìtàn tó rọrùn mọ́ láì fi agbára àkókò tí kò sí nínú Gíríìkì kún un; “Ó” ni arọ́pò-orúkọ ẹni kẹta tí ọ̀rọ̀-ìṣe náà nílò ní Yorùbá.
- source_word: ἔλεγεν
  choice: ń wí
  rationale: Àmì “ń” fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì bá imperfect Gíríìkì mu ju fífi í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo lọ.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó túmọ̀ arọ́pò-orúkọ ọ̀pọ̀ dative náà ní tààrà, láì fi “àwọn ọmọ-ẹ̀yìn rẹ̀” kún ẹsẹ yìí láti inú àyíká ọ̀rọ̀.
- source_word: Οὔπω
  choice: kò ... tíì
  rationale: Àkópọ̀ Yorùbá “kò ... tíì” jẹ́ ọ̀nà àdánidá láti sọ pé ipò náà kò tíì dé títí di àkókò yìí.
- source_word: συνίετε
  choice: lóye
  rationale: “Lóye” sọ ìmòye inú àti mímú ìtumọ̀ ọ̀rọ̀ mú, kì í ṣe ìríran tàbí ìgbọ́ran lásán.
theological_decisions:
- issue: Bóyá kí a fi ohun tí wọ́n kò lóye hàn gbangba, bí “èyí” tàbí “ọ̀rọ̀ yìí.”
  choice: 'A kò fi ohun kankan kún un: “Ẹ kò ha tíì lóye?”'
  alternative: “Ẹ kò ha tíì lóye èyí?”
  rationale: Gíríìkì kò sọ ohun tí ìṣe “lóye” ń tọ́ka sí ní pàtó. Fífi í sílẹ̀ báyìí pa ìbéèrè àti ìbáwí Jésù mọ́ láì dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ẹni kejì; “ha” mú ìbéèrè ìbáwí náà jáde lọ́nà àdánidá. A lo “wí” dípò “sọ” nítorí pé ó bá ìforúkọsílẹ̀ Bíbélì tó ní iyì mu láì di ọ̀rọ̀ àtijọ́ tí kò ṣeé lóye.
