  verdict: approve
  source_fidelity: “Ó sì ń wí fún wọn pé” faithfully represents καὶ ἔλεγεν αὐτοῖς, retaining the narrative connection, plural indirect object, and a natural Yoruba expression of the imperfective verbal aspect. “Ẹ kò ha tíì lóye?” accurately renders Οὔπω συνίετε; “kò ... tíì” preserves ‘not yet,’ and no unstated object is supplied.
