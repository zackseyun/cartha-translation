review_pass:
  verdict: revise
  source_fidelity: Àkàrà does not denote the baked bread/loaf (ἄρτος) of the source in normal modern Standard Yoruba; it ordinarily denotes a bean cake/fritter. This materially changes the food item. The exceptive sense of εἰ μὴ ἕνα ἄρτον is otherwise retained, but the wording can more directly express that the one loaf was the sole bread they had.
  naturalness: “Kò ní … lọ́wọ́ nínú ọkọ̀” is understandable but less idiomatic for possessions carried along in a boat. “Kò ní … pẹ̀lú wọn nínú ọkọ̀” is clearer and natural. “Ìṣù búrẹ́dì kan” suitably marks the single, countable loaf.
  terminology: Use búrẹ́dì for bread in this historical context, avoiding àkàrà, which names a different Yoruba food. The general first occurrence may remain uncounted, while ìṣù búrẹ́dì renders the singular loaf.
  issues:
  - severity: high
    issue: “Àkàrà” is used for ἄρτος.
    rationale: In Standard Yoruba, àkàrà normally means a fried bean cake, not bread/loaf. It therefore misidentifies the item in the narrative.
  - severity: medium
    issue: Possessive-location phrase is awkward.
    rationale: “Àkàrà kankan lọ́wọ́ nínú ọkọ̀ náà” can be understood, but “búrẹ́dì kankan pẹ̀lú wọn nínú ọkọ̀ náà” more naturally renders μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
  revised_text: Wọ́n sì ti gbàgbé láti mú búrẹ́dì[a], wọn kò sì ní búrẹ́dì kankan pẹ̀lú wọn nínú ọkọ̀ náà, àfi ìṣù búrẹ́dì kan ṣoṣo.
  revised_footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ díẹ̀ sí i, “láti mú àwọn ìṣù búrẹ́dì.” Ọ̀pọ̀ ἄρτους lè tọ́ka sí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan, ṣùgbọ́n níbí ó lè túmọ̀ sí búrẹ́dì tàbí ìpèsè oúnjẹ lápapọ̀.
    reason: lexical_alternative
  revision_rationale: Àtúnṣe náà rọ́pò “àkàrà,” èyí tí ó jẹ́ oúnjẹ ẹ̀wà tí a din, pẹ̀lú “búrẹ́dì,” tó bá ἄρτος mu nínú àyíká yìí. Ó tún mú ìbáṣepọ̀ “pẹ̀lú wọn nínú ọkọ̀ náà” dà bí èdè Yorùbá àdánidá, nígbà tí “àfi ìṣù búrẹ́dì kan ṣoṣo” ń pa ìyọkúrò àti ẹyọ kan nínú èdè Gíríìkì mọ́.
