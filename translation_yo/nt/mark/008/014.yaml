id: MRK.8.14
reference: Mark 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: yo
  text: Wọ́n sì ti gbàgbé láti mú búrẹ́dì[a], wọn kò sì ní búrẹ́dì kankan pẹ̀lú wọn nínú ọkọ̀ náà, àfi ìṣù búrẹ́dì kan ṣoṣo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ díẹ̀ sí i, “láti mú àwọn ìṣù búrẹ́dì.” Ọ̀pọ̀ ἄρτους lè tọ́ka sí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan, ṣùgbọ́n níbí ó lè túmọ̀ sí búrẹ́dì tàbí ìpèsè oúnjẹ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: ti gbàgbé
  rationale: Ọ̀rọ̀-ìṣe aorist yìí sọ pé wọ́n gbàgbé; lílo “ti” bá ipò ìtàn náà mu, nítorí ìgbàgbé wọn ló ṣàlàyé ìdí tí àkàrà kò fi sí lọ́wọ́ wọn.
- source_word: λαβεῖν
  choice: láti mú
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́ni náà parí èrò ἐπελάθοντο, ó sì túmọ̀ sí pé wọ́n gbàgbé láti mú àkàrà wọ ọkọ̀.
- source_word: ἄρτους
  choice: àkàrà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ἄρτος lè tọ́ka sí àwọn ìṣù àkàrà kọ̀ọ̀kan, níbí ó lè dúró fún àkàrà tàbí ìpèsè oúnjẹ lápapọ̀. “Àkàrà” pa àwòrán oúnjẹ pàtó náà mọ́.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: àfi ìṣù àkàrà kan ṣoṣo
  rationale: εἰ μή jẹ́ gbólóhùn ìyọkúrò níbí, kì í ṣe gbólóhùn oníṣ条件; “àfi” fi hàn pé ìṣù kan ṣoṣo ni wọ́n ní.
- source_word: οὐκ εἶχον
  choice: wọn kò ní àkàrà kankan lọ́wọ́
  rationale: A tún ohun tí wọn kò ní—àkàrà—sọ nítorí èdè Yorùbá máa ń ṣe bẹ́ẹ̀ ní ti ẹ̀dá, “lọ́wọ́” sì fi hàn pé kò sí pẹ̀lú wọn.
- source_word: μεθ’ ἑαυτῶν
  choice: lọ́wọ́
  rationale: Nínú àyíká yìí, “ní ... lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan wà pẹ̀lú wọn.
- source_word: ἐν τῷ πλοίῳ
  choice: nínú ọkọ̀ náà
  rationale: “Nínú ọkọ̀ náà” túmọ̀ ἐν τῷ πλοίῳ ní kedere, ó sì bá ibi tí ìṣẹ̀lẹ̀ náà ti ń ṣẹlẹ̀ mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn níbi tí ó ti yẹ. A lo “àkàrà” ní ìtumọ̀ ìṣù oúnjẹ tí a yan, kì í ṣe àkàrà ẹ̀wà ti òde òní; “ìṣù àkàrà” mú ìtumọ̀ ohun tí a lè kà ní ẹyọ kan ṣe kedere.
