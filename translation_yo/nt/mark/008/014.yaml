- from: Wọ́n sì ti gbàgbé láti mú àkàrà[a]; wọn kò sì ní àkàrà kankan lọ́wọ́ nínú ọkọ̀ náà, àfi ìṣù àkàrà kan ṣoṣo.
  to: Wọ́n sì ti gbàgbé láti mú búrẹ́dì[a], wọn kò sì ní búrẹ́dì kankan pẹ̀lú wọn nínú ọkọ̀ náà, àfi ìṣù búrẹ́dì kan ṣoṣo.
  rationale: Àtúnṣe náà rọ́pò “àkàrà,” èyí tí ó jẹ́ oúnjẹ ẹ̀wà tí a din, pẹ̀lú “búrẹ́dì,” tó bá ἄρτος mu nínú àyíká yìí. Ó tún mú ìbáṣepọ̀ “pẹ̀lú wọn nínú ọkọ̀ náà” dà bí èdè Yorùbá àdánidá, nígbà tí “àfi ìṣù búrẹ́dì kan ṣoṣo” ń pa ìyọkúrò àti ẹyọ kan nínú èdè Gíríìkì mọ́.
