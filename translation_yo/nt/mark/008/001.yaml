id: MRK.8.1
reference: Mark 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: yo
  text: Ní ọjọ́ wọ̀nyẹn, nígbà tí ọ̀pọ̀ ènìyàn tún wà níbẹ̀[a], tí wọn kò sì ní ohun tí wọ́n lè jẹ, ó pe àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì sọ fún wọn pé:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí, “nígbà tí ogunlọ́gọ̀ ènìyàn tún wà níbẹ̀.” Gíríìkì lo gbólóhùn àyíká kan: “nígbà tí ogunlọ́gọ̀ ènìyàn tún wà.”'
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ λέγει, ìyẹn “ó ń sọ” ní fọ́ọ̀mù ìsinsìnyí. Máàkù sábà máa ń lo fọ́ọ̀mù ìsinsìnyí yìí nínú ìtàn; Yorùbá máa ń lo “ó sọ” ní irú ọ̀rọ̀ ìtàn bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Ní àwọn ọjọ́ wọnnì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn àkókò yìí, ó sì pa ìtẹ̀síwájú ìtàn náà mọ́ láì fi ìwọ̀n àkókò mìíràn kún un.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: nígbà tí ọ̀pọ̀ ènìyàn tún wà níbẹ̀
  rationale: 'Gbólóhùn yìí fi ipò tó wà lẹ́yìn ìtàn hàn: ogunlọ́gọ̀ ènìyàn tún wà níbẹ̀. ‘Tún’ pa ìtumọ̀ πάλιν mọ́, ‘ọ̀pọ̀ ènìyàn’ sì sọ ìtóbi ogunlọ́gọ̀ náà ní Yorùbá àdánidá.'
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: tí wọn kò sì ní ohun tí wọn lè jẹ
  rationale: Èyí tọ́ka sí pé ogunlọ́gọ̀ náà kò ní oúnjẹ. Ìtumọ̀ yìí jẹ́ ti èdè Yorùbá àdánidá, ó sì pa agbára τί φάγωσιν mọ́ gẹ́gẹ́ bí ohun tí wọ́n lè jẹ.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: ó pe àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ó pe’ sọ ìṣe pípe wọn tọ̀ ọ́ wá ní ṣókí; ‘àwọn ọmọ-ẹ̀yìn rẹ̀’ ṣe kedere ní Yorùbá pé àwọn ọmọ-ẹ̀yìn Jesu ni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ arọ́pò oníhun kò farahàn ní Gíríìkì.
- source_word: λέγει αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Yorùbá kò fi àkókò ìṣe hàn lórí ọ̀rọ̀-ìṣe ní ọ̀nà kan náà bí Gíríìkì. Nínú ìtàn, ‘ó sì sọ’ jẹ́ ọ̀nà àdánidá tí ó ń bá ìṣe ṣáájú rẹ̀ lọ, láì ṣe àfikún ìtumọ̀ sí ohun tí ó sọ.
theological_decisions:
- issue: Ìgbà ìṣe lọwọlọwọ nínú àkọsílẹ̀ ìtàn Máàkù (historical present)
  choice: Lo ‘ó sì sọ fún wọn pé’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sọ pé Gíríìkì lo fọ́ọ̀mù ìgbà lọwọlọwọ.
  alternative: ‘Ó sì ń sọ fún wọn pé’
  rationale: ‘Ó sì ń sọ’ lè túmọ̀ sí ìṣe tó ń lọ lọ́wọ́ tàbí tó máa ń ṣẹlẹ̀ léraléra ní Yorùbá, èyí tí kò bá ète λέγει mu dáadáa níbí. ‘Ó sì sọ’ jẹ́ ìtàn Yorùbá tó ṣe déédéé, àlàyé sì pa àrà ọ̀rọ̀ Gíríìkì náà mọ́ láì dá ẹ̀kọ́ ìgbàgbọ́ kankan lé e.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ, a sì yàgò fún gbólóhùn tó lè mú kí ‘ó sì ń sọ’ dà bí ìṣe tó ń lọ fún àkókò gígùn.
