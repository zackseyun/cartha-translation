revisions:
- from: Ṣùgbọ́n nígbà tí ó yí padà, tí ó sì rí àwọn ọmọ-ẹ̀yìn rẹ̀, ó bá Peteru wí, ó sì sọ pé, “Lọ sí ẹ̀yìn mi, Sátánì, nítorí pé ìwọ kò fi ọkàn sí àwọn ohun ti Ọlọ́run, bí kò ṣe àwọn ohun ti ènìyàn[a].”
