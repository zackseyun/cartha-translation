reference: Mark 8:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: yo
  text: Ṣùgbọ́n ó yí padà, ó sì rí àwọn ọmọ-ẹ̀yìn rẹ̀; ó bá Peteru wí, ó sì sọ pé, “Lọ sẹ́yìn mi, Sátánì, nítorí pé ìwọ kò fi ọkàn rẹ sí àwọn ohun ti Ọlọ́run, bí kò ṣe àwọn ohun ti ènìyàn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ohun ti àwọn ènìyàn” tàbí “àwọn ohun ti ẹ̀dá ènìyàn”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: nígbà tí ó yí padà
  rationale: Ó fi ìyípadà ara Jésù hàn ní ọ̀nà àdánidá, ó sì bá ipa aorist participle náà mu nínú ìtẹ̀lé ìṣẹ̀lẹ̀.
- source_word: ἰδὼν
  choice: tí ó sì rí
  rationale: 'Ó pa ìtẹ̀lé náà mọ́: Jésù kọ́kọ́ yí padà, lẹ́yìn náà ó rí àwọn ọmọ-ẹ̀yìn rẹ̀.'
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn akẹ́kọ̀ọ́ olùfọkànsìn Jésù.
- source_word: ἐπετίμησεν
  choice: ó bá ... wí
  rationale: Gbólóhùn yìí fi ìbáwí líle hàn, gẹ́gẹ́ bí ἐπιτιμάω ṣe túmọ̀ sí ní àyíká yìí.
- source_word: καὶ λέγει
  choice: ó sì sọ pé
  rationale: A tú historical present náà sí àsìkò àtijọ́ fún ìṣàn ìtàn Yorùbá tó ṣe kedere.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Lọ sí ẹ̀yìn mi
  rationale: Ó pa àṣẹ líle náà àti àwòrán ibi tí ẹni náà gbọ́dọ̀ wà mọ́, láì túmọ̀ rẹ̀ sí pé kí ó kàn lọ kúrò.
- source_word: Σατανᾶ
  choice: Sátánì
  rationale: Orúkọ tàbí oyè tí a ń pè ní tààrà ni; ìkọ̀wé Yorùbá yìí jẹ́ èyí tí ó wọ́pọ̀, ó sì pa líle ọ̀rọ̀ náà mọ́.
- source_word: φρονεῖς
  choice: ìwọ kò fi ọkàn sí
  rationale: Ó ju ríronú lásán lọ, ó sì mú ìtẹ̀sí ọkàn, ìfẹ́ àti ohun tí ẹni kan kà sí pàtàkì wọ inú ìtumọ̀ náà.
- source_word: τὰ τοῦ θεοῦ
  choice: àwọn ohun ti Ọlọ́run
  rationale: Ó pa gbígbòòrò àti àìdánilójú tòótọ́ ti gbólóhùn Gíríìkì náà mọ́, láì dín in kù sí ète tàbí àǹfààní kan pàtó.
- source_word: τὰ τῶν ἀνθρώπων
  choice: àwọn ohun ti ènìyàn
  rationale: “Ènìyàn” jẹ́ ọ̀rọ̀ àpapọ̀ ní Yorùbá fún ẹ̀dá ènìyàn, ó sì dá ìyàtọ̀ tó wà láàárín ohun ti Ọlọ́run àti ohun ti ènìyàn dúró.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ “Sátánì” ń tọ́ka sí nínú ìbáwí Jésù
  choice: Jésù bá Peteru wí ní tààrà, ó sì pè é ní “Sátánì,” nígbà tí ọ̀rọ̀ Peteru dúró ní ìhà àtakò.
  alternative: Jésù ń bá Sátánì kan tí ó wà lẹ́yìn Peteru sọ̀rọ̀, tàbí “Sátánì” túmọ̀ sí “alátakò” lásán níbí.
  rationale: Peteru ni ἐπετίμησεν Πέτρῳ tọ́ka sí gẹ́gẹ́ bí ẹni tí a bá wí, ọ̀rọ̀ tààrà náà sì tẹ̀ síwájú sí i. Ìtumọ̀ náà pa líle àti ìdíjú ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ láì sọ pé Peteru gan-an ni Sátánì.
- issue: Ìtumọ̀ ἀνθρώπων gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀
  choice: ènìyàn
  alternative: àwọn ènìyàn; ẹ̀dá ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan. “Ènìyàn” ní Yorùbá jẹ́ ọ̀rọ̀ àpapọ̀ tó jẹ́ ti ẹ̀dá ènìyàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ó bá Peteru wí” jẹ́ ọ̀rọ̀ àdánidá fún ìbáwí líle, “fi ọkàn sí” sì sọ ìtẹ̀sí inú φρονεῖς jáde. A fi àmì àlàyé [a] sí ọ̀dọ̀ gbólóhùn tí ó ń ṣàlàyé gan-an.
