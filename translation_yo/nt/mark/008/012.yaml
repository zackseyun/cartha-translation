id: MRK.8.12
reference: Mark 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: yo
  text: Ó sì kérora gidigidi nínú ẹ̀mí rẹ̀, ó wí pé, “Èé ṣe tí ìran yìí fi ń wá àmì? Lóòótọ́ ni mo wí fún yín, a kì yóò fi àmì kankan fún ìran yìí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ jù lọ: “bí a ó bá fi àmì fún ìran yìí”—ìlànà ọ̀rọ̀ ìbúra kan ní Gíríìkì tí ó túmọ̀ sí pé a kì yóò fi àmì kankan fún un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: kérora gidigidi
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìmí ẹ̀dùn tàbí ìkérora tí ó jinlẹ̀. ‘Kérora gidigidi’ mú agbára ìmọ̀lára inú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá láì sọ ọ́ di ohun tí ó le ju.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: nínú ẹ̀mí rẹ̀
  rationale: Èyí pa èdè nípa ẹ̀mí ènìyàn mọ́ gẹ́gẹ́ bí ó ti wà nínú Gíríìkì, dípò yíyí i padà sí ‘nínú ara rẹ̀’ tàbí ‘nínú ọkàn rẹ̀.’
- source_word: λέγει
  choice: ó wí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí ìtàn, ‘ó wí’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún ìtàn ní Yorùbá.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú àṣà ọ̀rọ̀ yìí, τί túmọ̀ sí ìbéèrè ìdí; ‘Èé ṣe’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere tí ó sì bá àyíká mu.
- source_word: γενεὰ
  choice: ìran
  rationale: ‘Ìran’ pa ìtumọ̀ àwùjọ ènìyàn tí ó wà láàyè ní àkókò kan mọ́, ó sì bá γενεά mu dáadáa.
- source_word: ζητεῖ
  choice: ń wá
  rationale: ‘Ń wá’ jẹ́ ìbámu tààrà pẹ̀lú ọ̀rọ̀ náà, kò sì fi agbára ‘ń béèrè lójú méjèèjì’ tàbí ‘ń fipá béèrè’ kún un.
- source_word: σημεῖον
  choice: àmì
  rationale: ‘Àmì’ pa ìtumọ̀ iṣẹ́ tí ń jẹ́ ẹ̀rí tàbí ìfìdí ohun kan múlẹ̀ mọ́, láì fi ọ̀rọ̀ àfikún bí ‘iṣẹ́ ìyanu’ sínú ẹsẹ náà.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Gbólóhùn yìí mú ìjẹ́rìí ọlọ́lá àti ìmúdájú ἀμήν jáde ní Yorùbá òde òní.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: a kì yóò fi àmì kankan fún ìran yìí
  rationale: εἰ jẹ́ apá ọ̀rọ̀ ìbúra tí a gé kúrú, tí agbára rẹ̀ jẹ́ ìkọ̀sílẹ̀ pátápátá. Ìtumọ̀ yìí sọ agbára ìkọ̀ náà di mímọ̀ ní Yorùbá, nígbà tí àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe tú gbólóhùn ìbúra tí εἰ bẹ̀rẹ̀ lẹ́yìn ἀμὴν λέγω ὑμῖν
  choice: 'A tú u sí ìkọ̀ tí ó lágbára: ‘a kì yóò fi àmì kankan fún ìran yìí.’'
  alternative: 'Ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ tí kò rọrùn: ‘bí a ó bá fi àmì fún ìran yìí.’'
  rationale: Gíríìkì lo ìlànà ìbúra tí a kò parí, èyí tí ó túmọ̀ sí ìkọ̀ pátápátá. Sísọ ìkọ̀ náà ní kedere ń jẹ́ kí òǹkàwé Yorùbá lóye agbára ọ̀rọ̀ náà láì yanju aáwọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ní ọ̀nà ẹ̀gbẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ní èdè òde òní tí ó ní ọlá tí ó sì ṣeé lóye. ‘Nínú ẹ̀mí rẹ̀’ mọ èdè ìpilẹ̀ nípa ẹ̀mí ènìyàn, ‘kérora gidigidi’ sì mú ìmọ̀lára ọ̀rọ̀ náà jáde láì ṣe àsọdùn.
