source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: yo
  text: Nítorí kí ni yóò ṣe ènìyàn láǹfààní bí ó bá jèrè gbogbo ayé, tí ó sì pàdánù ìyè rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, ψυχή, lè túmọ̀ sí “ìyè,” “ẹ̀mí,” tàbí “ẹni tìkára rẹ̀,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Nítorí èrè wo
  rationale: “Nítorí” so ìbéèrè yìí mọ́ ẹ̀kọ́ tó ṣáájú, “èrè wo” sì gbé ìbéèrè àsọ̀rọ̀ tí τί ń béèrè jáde ní Yorùbá àdánidá.
- source_word: ὠφελεῖ
  choice: ni ènìyàn yóò rí
  rationale: Pẹ̀lú “èrè wo,” gbólóhùn náà túmọ̀ sí ‘èrè wo ni ènìyàn yóò rí,’ èyí tó dá ìtumọ̀ àǹfààní sí, tó sì pa àwòrán èrè àti àdánù mọ́.
- source_word: ἄνθρωπον
  choice: ènìyàn
  rationale: “Ènìyàn” jẹ́ ọ̀rọ̀ akọ tàbí abo lápapọ̀, ó sì bá ìlò ἄνθρωπος gẹ́gẹ́ bí aṣojú gbogbo ènìyàn mu láìfi akọ nìkan hàn.
- source_word: κερδῆσαι
  choice: jèrè
  rationale: “Jèrè” jẹ́ ìtumọ̀ tààrà fún rí èrè tàbí ní ohun kan, ó sì bá ìyàtọ̀ tó wà láàárín èrè àti àdánù mu.
- source_word: τὸν κόσμον ὅλον
  choice: gbogbo ayé
  rationale: “Gbogbo ayé” sọ bí κόσμος ṣe kún fún gbogbo ohun tó wà lábẹ́ àfojúsùn ὅλον ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ζημιωθῆναι
  choice: pàdánù
  rationale: Nínú ọ̀rọ̀ yìí, ζημιόω ní ìṣe àìṣe túmọ̀ sí jíjẹ́ ẹni tó fara da àdánù; “pàdánù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì mú ìtakora pẹ̀lú “jèrè” hàn.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ìyè ara rẹ̀
  rationale: Nínú Máàkù 8:35–37, ψυχή ń tọ́ka sí ìyè ẹni tí a lè gbà là tàbí pàdánù. “Ìyè ara rẹ̀” pa ìtumọ̀ ọ̀rọ̀ inú àyíká yìí mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ “ọkàn rẹ̀” sílẹ̀ gẹ́gẹ́ bí ohun tó tún ṣeé ṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ψυχή nínú ọ̀rọ̀ nípa jíjẹ́ ọmọ-ẹ̀yìn, níbi tí ó ti lè túmọ̀ sí “ìyè” tàbí “ọkàn”
  choice: ìyè ara rẹ̀
  alternative: ọkàn ara rẹ̀
  rationale: Àyíká ọ̀rọ̀ tó sún mọ́ ọn jù lọ ń sọ nípa gbígba ìyè là àti pípàdánù rẹ̀ nítorí Jésù àti ìhìn rere. “Ìyè” mú ìbáṣepọ̀ yẹn hàn láìfi ẹ̀kọ́ pàtó kan nípa ẹ̀dá ènìyàn kún ọ̀rọ̀ náà; síbẹ̀, “ọkàn” jẹ́ ìtumọ̀ àtijọ́ tó ṣeé gbà, nítorí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Ènìyàn” ti jẹ́ ọ̀rọ̀ gbogbogbò ní Yorùbá, nítorí náà kò nílò àlàyé ìsàlẹ̀ míì láti fi hàn pé akọ àti abo ni ó dúró fún.
