  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: yo
  text: Ó sì ń sọ ọ̀rọ̀ náà ní gbangba[a]. Pétérù sì mú un lọ sí ẹ̀gbẹ́ kan, ó sì bẹ̀rẹ̀ sí í bá a wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní kedere” tàbí “pẹ̀lú ìgboyà.” Ọ̀rọ̀ Gíríìkì náà ń fi ìsọ̀rọ̀ ní ìfẹ̀hàn àti ní kedere hàn, láìfi nǹkan pamọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: ní gbangba
  rationale: Ọ̀rọ̀ náà tọ́ka sí sísọ̀rọ̀ ní gbangba, láìfi nǹkan pamọ́, àti ní kedere. “Ní gbangba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá ipò yìí mu; àlàyé ìsàlẹ̀ tún pa àwọn ìtumọ̀ “ní kedere” àti “pẹ̀lú ìgboyà” mọ́.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ nípa ìjìyà, ikú, àti àjíǹde rẹ̀. “Ọ̀rọ̀ náà” pa ìsopọ̀ rẹ̀ mọ́ àsọyé tó ṣáájú, ó sì tẹ̀lé ọ̀rọ̀ Gíríìkì láìdá ìtumọ̀ míì kún un.
- source_word: ἐλάλει
  choice: ń sọ
  rationale: Ìṣe aláìpé náà fi ìṣe tó ń lọ lọ́wọ́ hàn; “ń sọ” mú apá yìí jáde ní Yorùbá àdánidá láìsọ pé ó ń tún ọ̀rọ̀ náà sọ léraléra.
- source_word: προσλαβόμενος
  choice: mú un sẹ́gbẹ̀ẹ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, Pétérù mú Jésù kúrò lẹ́gbẹ̀ẹ́ àwọn yòókù láti bá a sọ̀rọ̀ ní àdáni. “Mú un sẹ́gbẹ̀ẹ́” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tí kò sì fi ohun tó kọjá àyíká ọ̀rọ̀ kún un.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: bẹ̀rẹ̀ sí í bá a wí
  rationale: “Bẹ̀rẹ̀ sí í” pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe náà mọ́. “Bá a wí” fi ìbáwí líle tí ἐπιτιμάω túmọ̀ sí hàn ní Yorùbá òde òní, láìlo ọ̀rọ̀ aláìmọ̀ tàbí ọ̀rọ̀ tó rọ̀ jù.
theological_decisions:
- issue: Agbára ìtumọ̀ παρρησίᾳ nínú àsọtẹ́lẹ̀ Jésù nípa ìjìyà rẹ̀
  choice: ní gbangba
  alternative: ní kedere; pẹ̀lú ìgboyà
  rationale: Yíyan “ní gbangba” tẹnu mọ́ pé Jésù sọ ohun náà láìfi pamọ́. Ó tún lè túmọ̀ sí “ní kedere” tàbí “pẹ̀lú ìgboyà”; àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ náà mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tó yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé gbogbogbò, ṣùgbọ́n ó pa ìṣe tó ń lọ nínú ἐλάλει àti ìbẹ̀rẹ̀ ìṣe nínú ἤρξατο mọ́.
