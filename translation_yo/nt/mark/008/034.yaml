id: MRK.8.34
reference: Mark 8:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: yo
  text: Ó sì pe ọ̀pọ̀ ènìyàn náà wá pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì sọ fún wọn pé, “Bí ẹnikẹ́ni bá fẹ́ wá tẹ̀ lé mi,[a] kí ó sẹ́ ara rẹ̀, kí ó gbé àgbélébùú tirẹ̀,[b] kí ó sì máa tẹ̀ lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹnikẹ́ni bá fẹ́ wá lẹ́yìn mi.”
    reason: lexical_alternative
  - marker: b
    text: “Kí ó gbé àgbélébùú tirẹ̀” pa àwòrán gidi àgbélébùú mọ́, dípò kí a túmọ̀ rẹ̀ sí gbígbé ẹrù tàbí ìjìyà lásán.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe ... wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jesu pe àwọn ènìyàn náà sí ọ̀dọ̀ ara rẹ̀; “pe ... wá” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: τὸν ὄχλον
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún àwùjọ ènìyàn púpọ̀, láìlo ọ̀rọ̀ àtijọ́ tàbí èyí tó le.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Pẹ̀lú” pa ìtumọ̀ ìbákẹ́gbẹ́ σύν mọ́, ó sì mú kedere pé ọ̀pọ̀ ènìyàn àti àwọn ọmọ-ẹ̀yìn wà níbẹ̀.
- source_word: Εἴ τις θέλει
  choice: Bí ẹnikẹ́ni bá fẹ́
  rationale: Ìtumọ̀ yìí pa àìdánimọ̀ τις àti ìpè gbogbogbò náà mọ́ ní Yorùbá àdánidá.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: wá tẹ̀ lé mi
  rationale: Gbólóhùn náà jẹ́ èdè ìfọkànsìn ọmọ-ẹ̀yìn. “Wá tẹ̀ lé mi” jẹ́ àdánidá ní Yorùbá, ó sì yà sí àṣẹ ìkẹyìn “máa tẹ̀ lé mi,” èyí tó fi ìtẹ̀síwájú hàn.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: kí ó kọ ara rẹ̀
  rationale: “Kọ ara rẹ̀” fi ìkọ̀ ara ẹni sílẹ̀ hàn, kì í ṣe kìkì fífi ìfẹ́ kékeré kan dù ara ẹni; “kí ó” sì gbé agbára àṣẹ ẹni-kẹta jáde.
- source_word: ἀράτω
  choice: kí ó gbé
  rationale: “Gbé” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn fún gbígbé ohun sókè tàbí mímú un lọ, ó sì bá àwòrán àgbélébùú mu.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: àgbélébùú tirẹ̀
  rationale: A pa àwòrán gidi “àgbélébùú” mọ́, “tirẹ̀” sì tẹnumọ́ ohun tí ó kan olúkúlùkù.
- source_word: ἀκολουθείτω μοι
  choice: kí ó sì máa tẹ̀ lé mi
  rationale: “Máa tẹ̀ lé” mú ìṣe tí ń bá a lọ nínú present imperative hàn ní Yorùbá tó jẹ́ àdánidá.
theological_decisions:
- issue: Agbára àwọn àṣẹ nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìpè sí ẹnikẹ́ni, tí àwọn ọ̀rọ̀ “kí ó” sì fi agbára àṣẹ hàn.
  alternative: Lílo “ó gbọ́dọ̀” lẹ́ẹ̀kọ̀ọ̀kan fún gbogbo àwọn àṣẹ.
  rationale: Gíríìkì ní gbólóhùn àídájú tí àwọn àṣẹ ẹni-kẹta tẹ̀ lé. “Kí ó” pa ìpè tí ó ṣí sí gbogbo ènìyàn àti dandan ìfọkànsìn ọmọ-ẹ̀yìn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ìtumọ̀ σταυρός nínú àyíká ọ̀rọ̀
  choice: A pa á mọ́ ní tààrà gẹ́gẹ́ bí “àgbélébùú.”
  alternative: “Ẹrù,” “ìjìyà,” tàbí “ohun èlò ikú.”
  rationale: Àwòrán náà dá lórí àgbélébùú Róòmù gidi. Píparọ̀ rẹ̀ sí “ẹrù” tàbí “ìjìyà” nìkan yóò dín ìtumọ̀ rẹ̀ kù ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ọ̀pọ̀ ènìyàn” dípò ọ̀rọ̀ àtijọ́, a sì lo “máa tẹ̀ lé” láti mú ìtẹ̀síwájú àṣẹ ìkẹyìn hàn.
