id: MRK.8.15
reference: Mark 8:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: yo
  text: Ó sì ń kìlọ̀ fún wọn pé, “Ẹ kíyè sí i; ẹ ṣọ́ra fún ìwúkàrà[a] àwọn Farisí àti ìwúkàrà Hẹ́rọ́dù.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìwúkàrà ni ohun tí a fi ń mú ìyẹ̀fun wú; a pa ọ̀rọ̀ náà mọ́ níbí nítorí àkàwé ipa kan tí ń tàn ká.
    reason: lexical_alternative
  - marker: b
    text: Èyí ń tọ́ka sí ipa búburú tí ó ní í ṣe pẹ̀lú àwọn Farisí àti Hẹ́rọ́dù; fi wé Mátíù 16:6, 12 àti Lúùkù 12:1, níbi tí a ti lo “ìwúkàrà” lọ́nà tó jọ èyí.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: ó sì ń kìlọ̀ fún wọn
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ìkìlọ̀ náà ń bá a lọ tàbí pé ó ń tún un ṣe. “Ń kìlọ̀” bá ipò ọ̀rọ̀ yìí mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: λέγων
  choice: pé
  rationale: Ní èdè Yorùbá, “pé” ni ọ̀nà àdánidá láti mú ọ̀rọ̀ tí ẹni kan sọ wọlé lẹ́yìn ọ̀rọ̀-ìṣe bí “kìlọ̀ fún.”
- source_word: Ὁρᾶτε
  choice: Ẹ kíyè sí i
  rationale: Nínú ọ̀rọ̀ ìkìlọ̀, ó túmọ̀ sí jíjíròrò tàbí wíwà lójúfò, kì í ṣe wíwo lásán.
- source_word: βλέπετε ἀπὸ
  choice: ẹ ṣọ́ra fún
  rationale: Àkójọpọ̀ yìí jẹ́ ìkìlọ̀ láti yẹra fún ohun eléwu. Ìtumọ̀ yìí tún pa ìtẹnumọ́ àwọn ọ̀rọ̀-àṣẹ méjèèjì mọ́ láì mú kí Yorùbá le.
- source_word: ζύμης
  choice: ìwúkàrà
  rationale: “Ìwúkàrà” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye fún ohun tí ń mú ìyẹ̀fun wú, ó sì pa àkàwé ohun tí ipa rẹ̀ ń tàn ká mọ́.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí ó wọ́pọ̀ nínú Yorùbá; ìbáṣepọ̀ oníhun nínú Gíríìkì farahàn nínú “ìwúkàrà àwọn Farisí.”
- source_word: Ἡρῴδου
  choice: Hẹ́rọ́dù
  rationale: A pa orúkọ ẹni tí Gíríìkì mẹ́nu kàn mọ́, láì fi ìtumọ̀ bí “ilé Hẹ́rọ́dù” tàbí “ẹgbẹ́ Hẹ́rọ́dù” kún un.
theological_decisions:
- issue: Ìtumọ̀ àkàwé “ìwúkàrà”
  choice: Pa àkàwé “ìwúkàrà” mọ́ nínú ọ̀rọ̀ pàtàkì, kí a má ṣe sọ ọ́ di “ẹ̀kọ́,” “àgàbàgebè,” tàbí “ipa búburú.”
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ẹ̀kọ́, àgàbàgebè, tàbí ipa tí ń bàjẹ́.
  rationale: Àyíká ọ̀rọ̀ àti àwọn ibi tó jọ ọ́ fi hàn pé àkàwé òdì ni, ṣùgbọ́n Máàkù 8:15 kò sọ ìtumọ̀ pàtó rẹ̀. Pípa àkàwé náà mọ́ kò ní fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé ẹsẹ náà lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. “Ẹ kíyè sí i; ẹ ṣọ́ra fún” pa àtúnṣe ìkìlọ̀ méjì nínú Gíríìkì mọ́, nígbà tí “ó sì ń kìlọ̀” fi ipa ọ̀rọ̀-ìṣe aláìpé hàn.
