  to: Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ sì jáde lọ sí àwọn abúlé tó yí Kesaríà Fílípì ká. Nígbà tí wọ́n wà lójú ọ̀nà, ó ń béèrè lọ́wọ́ àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ta ni àwọn ènìyàn[a] ń sọ pé mo jẹ́?”
