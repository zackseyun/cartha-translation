id: MRK.8.27
reference: Mark 8:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: yo
  text: Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ sì jáde lọ sí àwọn abúlé tó yí Kesaríà Fílípì ká. Nígbà tí wọ́n wà lójú ọ̀nà, ó ń béèrè lọ́wọ́ àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ta ni àwọn ènìyàn[a] ń sọ pé mo jẹ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ti gbolohun náà ní èdè Gíríìkì, “àwọn ọkùnrin.” Ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìtumọ̀ ìjáde àti ìlọ hàn ní Yorùbá àdánidá, láì lo ọ̀rọ̀ àtijọ́ tàbí fi ìtumọ̀ míì kún un.
- source_word: κώμας
  choice: àwọn abúlé
  rationale: κώμη sábà ń tọ́ka sí abúlé tàbí ìletò kékeré, kì í ṣe ìlú ńlá.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Kesaríà Fílípì
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Yorùbá; ọ̀rọ̀ “ní agbègbè” mú ìbáṣepọ̀ àwọn abúlé náà pẹ̀lú Kesaríà Fílípì ṣe kedere ní èdè àdánidá.
- source_word: ἐν τῇ ὁδῷ
  choice: Ní ọ̀nà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún jíjẹ́ lójú ọ̀nà, ó sì pa ìṣísẹ̀ ìtàn inú Máàkù mọ́.
- source_word: ἐπηρώτα
  choice: ó ń béèrè lọ́wọ́
  rationale: Àmì “ń” fi ìṣe tó ń lọ lọ́wọ́ ní àkókò ìtàn hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: λέγων αὐτοῖς
  choice: pé
  rationale: Ní Yorùbá, “béèrè lọ́wọ́ wọn pé” ni ọ̀nà àdánidá láti darapọ̀ ìbéèrè náà mọ́ ohun tí ó sọ, láì tún ọ̀rọ̀ ṣe lọ́nà líle.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Ta ni àwọn ènìyàn ń sọ pé èmi jẹ́?
  rationale: “Ta ni” béèrè nípa ẹni tí Jésù jẹ́; “àwọn ènìyàn” sì fi ìtumọ̀ gbogbogbò ἄνθρωποι hàn. “Ń sọ” pa present λέγουσιν mọ́ ní Yorùbá àdánidá.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí dúró fún μαθηταί àti possessive αὐτοῦ ní ibi méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ gbogbogbò ἄνθρωποι nínú ìbéèrè Jésù
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú àyíká yìí, ἄνθρωποι ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn akọ nìkan. “Àwọn ènìyàn” pa ìtumọ̀ orísun mọ́ láì dín àwọn tí Jésù ń tọ́ka sí kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tó bá bá ìkọ̀wé Yorùbá àdánidá mu, a sì ṣe àwọn orúkọ àjèjì ní ìbámu pẹ̀lú ìró Yorùbá.
