  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: yo
  text: Ó sì fi wọ́n sílẹ̀, ó tún wọ ọkọ̀ ojú omi, ó sì lọ sí òdìkejì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì πάλιν lè túmọ̀ sí “padà.” Nítorí náà, a lè túmọ̀ ọ̀rọ̀ náà pé, “Ó sì fi wọ́n sílẹ̀, ó padà wọ ọkọ̀ ojú omi, ó sì lọ sí òdìkejì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: fi … sílẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tí ó túmọ̀ sí pé ó kúrò lọ́dọ̀ wọn tàbí ó fi wọ́n sílẹ̀; ìtumọ̀ yìí bójú mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: αὐτοὺς
  choice: wọ́n
  rationale: Ó tọ́ka sí àwọn Farisí inú àyíká ọ̀rọ̀ tó ṣáájú; arọ́pò-orúkọ nìkan tó.
- source_word: πάλιν
  choice: tún
  rationale: πάλιν lè túmọ̀ sí ‘lẹ́ẹ̀kan sí i’ tàbí ìpadà sí ibi kan. ‘Tún’ pa ìtumọ̀ ìṣe tó ṣẹlẹ̀ lẹ́ẹ̀kan sí i mọ́, láìfi dandan pinnu pé adverb náà túmọ̀ sí ‘padà’.
- source_word: ἐμβὰς
  choice: wọ ọkọ̀ ojú omi
  rationale: Participle náà túmọ̀ sí wíwọ inú ohun kan; ọkọ̀ ojú omi ni ohun tí àyíká ìtàn mú kedere, nítorí náà fífi í hàn jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ἀπῆλθεν
  choice: lọ
  rationale: Ọ̀rọ̀-ìṣe náà sọ nípa kíkúrò tàbí lílọ; ‘lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tí ibi tí ó ń lọ sì mú ìtumọ̀ rẹ̀ pé.
- source_word: εἰς τὸ πέραν
  choice: sí òdìkejì
  rationale: Gbólóhùn náà tọ́ka sí òdìkejì adágún/òkun; ‘sí òdìkejì’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere nínú àyíká yìí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó bá yẹ. A pa bí participle àti àwọn ọ̀rọ̀-ìṣe ṣe tẹ̀ lé ara wọn mọ́ ní ọ̀nà àdánidá, a sì fi àlàyé sílẹ̀ fún àìdánilójú ìtumọ̀ πάλιν.
