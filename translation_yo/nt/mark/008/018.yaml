base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: yo
  text: Ẹ ní ojú[a], ẹ kò ha rí? Ẹ sì ní etí, ẹ kò ha gbọ́? Ẹ kò ha sì rántí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ó tilẹ̀ jẹ́ pé ẹ ní ojú, ẹ kò ha lóye? Bí ó tilẹ̀ jẹ́ pé ẹ ní etí, ẹ kò ha mọ ohun tí ẹ ń gbọ́?” Gíríìkì lo àwọn ọ̀rọ̀ lasan fún “rí” àti “gbọ́,” ṣùgbọ́n nínú àyíká yìí wọ́n tún lè ní ìtumọ̀ òye nípa ohun ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Ẹ ní ojú
  rationale: Èyí túmọ̀ ọ̀rọ̀ participle Gíríìkì ní ọ̀nà àdánidá ní Yorùbá, ó sì pa ìbéèrè àfiwé tí ó lè ní agbára ìyànilẹ́nu mọ́ láì fi ‘bí ó tilẹ̀ jẹ́ pé’ kún un ní pàtó.
- source_word: βλέπετε
  choice: ẹ kò ha ríran
  rationale: ‘Ríran’ pa ìtumọ̀ ìpìlẹ̀ ti rí mọ́; ọ̀rọ̀ yìí tún lè tọ́ka sí òye inú gẹ́gẹ́ bí àyíká ṣe fi hàn, láì sọ ìtumọ̀ àpẹẹrẹ náà di dandan.
- source_word: ὦτα ἔχοντες
  choice: Ẹ sì ní etí
  rationale: Èyí bá ìlà ọ̀rọ̀ àkọ́kọ́ mu, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ‘ní etí.’
- source_word: ἀκούετε
  choice: ẹ kò ha gbọ́
  rationale: ‘Gbọ́’ ni ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì; àyíká lè mú kí ó tún ní agbára ‘fetí sí’ tàbí ‘lóye,’ ṣùgbọ́n a kò fi ìtumọ̀ yẹn rọ́pò ọ̀rọ̀ gangan.
- source_word: μνημονεύετε
  choice: Ẹ kò ha sì rántí
  rationale: ‘Rántí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tí ó sì bá ìbáwí Jésù nípa àìfi ohun tí ó ti ṣẹlẹ̀ sọ́kàn mu.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so àwọn ìbéèrè náà pọ̀, ó sì pa agbára ìtẹ̀lé ara wọn ti καὶ mọ́ ní Yorùbá àdánidá.
- source_word: οὐ / οὐκ
  choice: kò ha
  rationale: Ìṣọ̀kan ‘kò ha’ fi ìkà tí ìbéèrè àsọyé odi ní Gíríìkì hàn lọ́nà Yorùbá tó ní iyì.
theological_decisions:
- issue: Agbára gangan tàbí ti àpẹẹrẹ nínú ‘rí’ àti ‘gbọ́’
  choice: A lo àwọn ọ̀rọ̀ gangan ‘ríran’ àti ‘gbọ́’ nínú ẹsẹ̀ pàtàkì, kí àyíká lè fi àìlóye ẹ̀mí hàn.
  alternative: A lè túmọ̀ wọn sí ‘lóye’ àti ‘mọ ohun tí ẹ ń gbọ́’ láti sọ ìtumọ̀ àpẹẹrẹ di mímọ̀.
  rationale: Gíríìkì lo àwọn ọ̀rọ̀ ìmọ̀lára ara lasan, bí ó tilẹ̀ jẹ́ pé àyíká àti ìrántí èdè àwọn wòlíì ń tọ́ka sí líle ọkàn. Yíyan ọ̀rọ̀ gangan pa ìró àti ìdọ́gba ẹ̀kọ́ náà mọ́ láì túmọ̀ ju ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá àkànṣe tó ní àmì ohùn kíkún; èdè náà jẹ́ àdánidá, kedere, ó sì ní iyì. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀, ‘kò ha’ sì pa ìrísí ìbéèrè àsọyé mọ́.
