source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: yo
  text: Ó sì ń bi wọ́n léèrè pé, “Ṣùgbọ́n ẹ̀yin ńkọ́, ta ni ẹ wí pé mo jẹ́?” Pétérù dá a lóhùn pé, “Ìwọ ni Mèsáyà náà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi náà.”
    reason: Àṣàyàn ìtumọ̀ mìíràn fún ὁ χριστός tí ó pa ọ̀rọ̀ oyè Gíríìkì mọ́ ní ìlò ìbílẹ̀.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ń bi wọ́n léèrè
  rationale: Ọ̀rọ̀-ìṣe àìpé náà fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń bi … léèrè’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìrísí yìí mọ́.
- source_word: Ὑμεῖς δὲ
  choice: Ṣùgbọ́n ẹ̀yin ńkọ́
  rationale: ‘Ẹ̀yin’ mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ náà jáde, ‘ṣùgbọ́n’ sì fi ìyàtọ̀ sí èrò àwọn ẹlòmíràn hàn; ‘ńkọ́’ jẹ́ kí ìyàtọ̀ náà dára ní Yorùbá.
- source_word: τίνα με λέγετε εἶναι
  choice: ta ni ẹ̀yin wí pé èmi jẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédé fún àkójọpọ̀ accusative àti infinitive Gíríìkì, láìpàdánù ìbéèrè nípa ẹni tí Jésù jẹ́.
- source_word: ἀποκριθεὶς … λέγει αὐτῷ
  choice: Pétérù dá a lóhùn pé
  rationale: A sọ participle àti historical present náà di ìtàn àkókò tí ó kọjá ní Yorùbá; ‘dá a lóhùn’ pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí ìdáhùn mọ́.
- source_word: Σὺ εἶ
  choice: Ìwọ ni
  rationale: ‘Ìwọ’ tí a sọ ní gbangba pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ‘ni’ sì jẹ́ àkànṣe Yorùbá tó bá gbólóhùn ìdánimọ̀ mu.
- source_word: ὁ χριστός
  choice: Mèsáyà náà
  rationale: Níbí, χριστός jẹ́ oyè ẹni tí a fòróró yàn, kì í ṣe orúkọ lasan. ‘Mèsáyà’ pa àyíká àti ìtumọ̀ Júù rẹ̀ mọ́; ‘náà’ fi ìdánimọ̀ oyè pàtó náà hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà náà
  alternative: Kristi náà
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn. ‘Mèsáyà’ mú ìtumọ̀ àti àyíká Hébérù rẹ̀ jáde, nígbà tí a fi ‘Kristi náà’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ tí ọ̀pọ̀ mọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ìtàn tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. ‘Ẹ̀yin ńkọ́’ mú ìtẹnumọ́ àti ìyàtọ̀ inú ìbéèrè náà jáde lọ́nà àdánidá.
