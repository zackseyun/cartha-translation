  source_fidelity: 'Ìtumọ̀ náà gba àwọn kókó inú Gíríìkì mọ́ dáadáa: ἰχθύδια jẹ́ “ẹja kéékèèké,” ὀλίγα jẹ́ “dìẹ̀,” αὐτά tọ́ka sí ẹja náà, àti παρατιθέναι jẹ́ àṣẹ alágbèṣe pé kí wọ́n gbé e kalẹ̀ níwájú àwọn tí yóò jẹ ẹ. “Ó ní kí wọ́n...” jẹ́ ìṣàfihàn Yorùbá tó péye fún εἶπεν pẹ̀lú infinitive àṣẹ náà.'
