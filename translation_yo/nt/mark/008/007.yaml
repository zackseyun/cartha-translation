  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: yo
  text: Wọ́n sì ní ẹja kéékèèké díẹ̀; nígbà tí ó súre fún wọn tán, ó ní kí wọ́n gbé àwọn wọ̀nyí náà kalẹ̀ níwájú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: ẹja kéékèèké
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ fọ́ọ̀mù tí ó ń tọ́ka sí ẹja kéékèèké; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: ὀλίγα
  choice: díẹ̀
  rationale: “Díẹ̀” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti fi hàn pé iye wọn kò pọ̀.
- source_word: εὐλογήσας
  choice: lẹ́yìn tí ó súre fún wọn
  rationale: Ó fi hàn pé ìbùkún náà ṣẹlẹ̀ ṣáájú àṣẹ tí ó tẹ̀ lé e, ó sì dúró sún mọ́ ìtumọ̀ εὐλογέω ju “dúpẹ́” lọ.
- source_word: αὐτά
  choice: wọn
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí àwọn ẹja kéékèèké náà.
- source_word: καὶ ταῦτα
  choice: àwọn wọ̀nyí náà
  rationale: Ó pa agbára àfikún καί àti ìtẹnumọ́ ταῦτα mọ́ lọ́nà Yorùbá tó ṣe déédéé.
- source_word: παρατιθέναι
  choice: kí wọ́n gbé ... kalẹ̀ níwájú wọn
  rationale: Nínú àyíká oúnjẹ, ọ̀rọ̀ náà túmọ̀ sí gbígbé oúnjẹ kalẹ̀ níwájú àwọn ènìyàn láti jẹ; ìtumọ̀ yìí tún pa ìṣe alágbèṣe inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἶπεν
  choice: ó ní
  rationale: “Ó ní kí...” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi àṣẹ tí a ròyìn hàn, láìfi ìtumọ̀ míì kún λέγω.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. “Súre fún wọn” pa ohun tí a súre fún—àwọn ẹja—mọ́, nígbà tí “ó ní kí wọ́n...” fi àṣẹ sí àwọn ọmọ-ẹ̀yìn tí a kò dárúkọ ní Gíríìkì hàn lọ́nà Yorùbá tó mọ́gbọ́n dání.
