source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: yo
  text: “Àánú àwọn ènìyàn yìí ṣe mí, nítorí pé wọ́n ti wà pẹ̀lú mi fún ọjọ́ mẹ́ta, wọ́n kò sì ní ohun tí wọ́n lè jẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Àánú … ṣe mí
  rationale: Ọ̀rọ̀ yìí fi ìyọ́nú jíjinlẹ̀ hàn. ‘Àánú … ṣe mí’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa agbára ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: ἐπὶ τὸν ὄχλον
  choice: àwọn ènìyàn yìí
  rationale: ἐπί pẹ̀lú accusative tọ́ka sí àwọn tí àánú náà kàn; ‘àwọn ènìyàn yìí’ jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀pọ̀ ènìyàn tí Jésù ń tọ́ka sí níbí.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìdí tí àánú fi ṣe Jésù wọlé ní kedere.
- source_word: ἤδη
  choice: báyìí
  rationale: Ní ìṣọ̀kan pẹ̀lú ‘ti wà,’ ‘báyìí’ fi hàn pé iye àkókò náà ti dé ọjọ́ mẹ́ta tán.
- source_word: ἡμέραι τρεῖς
  choice: fún ọjọ́ mẹ́ta
  rationale: ‘Fún ọjọ́ mẹ́ta’ jẹ́ gbólóhùn Yorùbá àdánidá fún iye àkókò.
- source_word: προσμένουσίν μοι
  choice: wọ́n ti wà pẹ̀lú mi
  rationale: Ó sọ ìtẹ̀síwájú wíwà wọn lọ́dọ̀ Jésù ní Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: wọn kò sì ní ohun tí wọn yóò jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò sí oúnjẹ kankan fún wọn láti jẹ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn ènìyàn yìí’ dípò ọ̀rọ̀ líle tàbí àtijọ́ fún ὄχλος.
