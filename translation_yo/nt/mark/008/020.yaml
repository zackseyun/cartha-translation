  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: yo
  text: Nígbà tí mo sì pín àwọn búrẹ́dì méje náà fún ẹgbẹ̀rún mẹ́rin ènìyàn, apẹ̀rẹ̀ ńlá[a] mélòó tí ó kún fún àwọn àjẹkù ni ẹ kó jọ? Wọ́n sì wí fún un pé, “Méje.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì σπυρίς túmọ̀ sí apẹ̀rẹ̀ ńlá; ó yàtọ̀ sí ọ̀rọ̀ tí a lò fún apẹ̀rẹ̀ kékeré ní Máàkù 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Nígbà tí mo sì
  rationale: Ó so ìbéèrè yìí mọ́ àmì ìṣáájú, ó sì jẹ́ kí ìtumọ̀ àkókò àti ìtẹ̀síwájú ọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: τοὺς ἑπτὰ
  choice: ìṣù méje náà
  rationale: Gíríìkì fi ‘méje náà’ sílẹ̀ láì tún ‘ìṣù’ sọ, ṣùgbọ́n ní Yorùbá fífi orúkọ tí àyíká ọ̀rọ̀ túmọ̀ sí kún un mú ọ̀rọ̀ ṣe kedere láì yí ìtumọ̀ padà.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: fún ẹgbẹ̀rún mẹ́rin ènìyàn
  rationale: ‘Fún’ fi ìbáṣepọ̀ oúnjẹ náà sí àwọn tí a bọ́ hàn, ‘ènìyàn’ sì mú iye ẹgbẹ́ náà ṣe kedere ní Yorùbá.
- source_word: πόσων σπυρίδων
  choice: apẹ̀rẹ̀ ńlá mélòó
  rationale: σπυρίς tọ́ka sí apẹ̀rẹ̀ ńlá, ó yàtọ̀ sí κόφινος tí ẹsẹ 19 lò; ‘mélòó’ ni ọ̀nà Yorùbá àdánidá láti béèrè iye.
- source_word: πληρώματα κλασμάτων
  choice: tí ó kún fún àjẹkù
  rationale: Ó sọ pé àwọn apẹ̀rẹ̀ náà kún fún àwọn ègé oúnjẹ tí ó ṣẹ́ kù; ‘àjẹkù’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere nínú àyíká yìí.
- source_word: ἤρατε
  choice: ni ẹ kó
  rationale: Nínú àyíká yìí, αἴρω túmọ̀ sí kíkó àwọn àjẹkù jọ, kì í ṣe gbígbé lásán.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Wọ́n wí fún un pé
  rationale: A tú ìsinsìnyí ìtàn Gíríìkì sí àkókò tí ó ti kọjá ní Yorùbá àdánidá, láì pàdánù pé àwọn ọmọ-ẹ̀yìn ló dá a lóhùn.
- source_word: Ἑπτά
  choice: Méje
  rationale: Ìdáhùn iye tààrà ni.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn, ní èdè ọ̀wọ̀, kedere, àti ti òde òní. A mú ‘ìṣù’ tí àyíká ọ̀rọ̀ fi hàn wọlé fún ìmúlò Yorùbá àdánidá, a sì pa ìyàtọ̀ láàárín irú apẹ̀rẹ̀ ẹsẹ 19 àti 20 mọ́.
