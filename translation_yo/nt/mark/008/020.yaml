  to: Nígbà tí mo sì pín àwọn búrẹ́dì méje náà fún ẹgbẹ̀rún mẹ́rin ènìyàn, apẹ̀rẹ̀ ńlá[a] mélòó tí ó kún fún àwọn àjẹkù ni ẹ kó jọ? Wọ́n sì wí fún un pé, “Méje.”
