id: MRK.8.35
reference: Mark 8:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ẹ̀mí rẹ̀ là yóò pàdánù rẹ̀; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ẹ̀mí rẹ̀ nítorí mi àti ìhìn rere yóò gbà á là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “ẹ̀mí” lè túnmọ̀ sí “ìwàláàyè” tàbí “ọkàn” ní gbogbo ẹsẹ yìí, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: ẹ̀mí ara ẹni
  rationale: Nínú ọ̀rọ̀ yìí, ψυχή túmọ̀ sí ìwàláàyè tàbí gbogbo ẹni náà, kì í ṣe dandan apá aláìlera ara tí a ń pè ní ọkàn. ‘Ẹ̀mí ara ẹni’ bá èdè Yorùbá mu nínú àpẹẹrẹ ‘gba ẹ̀mí là / pàdánù ẹ̀mí,’ ó sì pa ìtakora inú ọ̀rọ̀ Jesu mọ́.
- source_word: σῶσαι / σώσει
  choice: gba ... là / yóò gbà ... là
  rationale: ‘Gba ... là’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún σῴζω, ó sì pa ìbámu ọ̀rọ̀ náà mọ́ ní ìbẹ̀rẹ̀ àti òpin ẹsẹ náà.
- source_word: ἀπολέσει
  choice: yóò pàdánù
  rationale: Níbi tí ohun tí a ń sọ̀rọ̀ rẹ̀ jẹ́ ψυχή, ‘pàdánù’ mú àdììtú ọ̀rọ̀ náà jáde dáadáa ju ‘parun’ lọ.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: nítorí mi àti nítorí ìhìn rere
  rationale: ἕνεκεν sọ ìdí tàbí ohun tí ẹni ṣe nítorí rẹ̀. Àtúnṣe ‘nítorí’ fún méjèèjì mú ìbáṣepọ̀ rẹ̀ sí ‘mi’ àti ‘ìhìn rere’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: ‘Ìhìn rere’ jẹ́ ìtumọ̀ tó ṣe kedere, tó wọ́pọ̀, tí ó sì lè yé òǹkàwé Yorùbá òde òní láìsọ agbára ọ̀rọ̀ náà nù.
- source_word: ὃς ... ὃς
  choice: ẹnikẹ́ni ... ẹnikẹ́ni
  rationale: Ìkọ̀lé náà kan gbogbo ẹni tí ó bá ṣe ohun tí a sọ; ‘ẹnikẹ́ni’ mú ìtumọ̀ gbogbogbò yìí jáde ní Yorùbá àdánidá.
- source_word: θέλῃ
  choice: tí ó bá fẹ́
  rationale: ‘Fẹ́’ sọ ìfẹ́-inú tàbí ìpinnu ẹni ní èdè Yorùbá tó rọrùn, tí ‘bá’ sì bá ìkọ̀lé àìdánilójú ἐὰν mu.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú àdììtú ọ̀rọ̀ Jesu
  choice: Lo ‘ẹ̀mí ara ẹni’ nínú ọ̀rọ̀ pàtàkì, ní ìtumọ̀ ìwàláàyè tàbí gbogbo ẹni náà
  alternative: Lo ‘ọkàn’ tàbí ‘ìwàláàyè’
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti jíjẹ́ ọmọ-ẹ̀yìn, kíkọ ara ẹni, àti fífi ìwàláàyè sílẹ̀ nítorí Jesu àti ìhìn rere. ‘Ẹ̀mí ara ẹni’ bá àkójọpọ̀ ọ̀rọ̀ Yorùbá ‘gba ẹ̀mí là’ mu, láìfi ìtumọ̀ náà mọ́ apá aláìlera ara nìkan. Àlàyé ìsàlẹ̀ jẹ́ kí ìwọ̀n ìtumọ̀ Gíríìkì hàn.
- issue: Ìtọ́kasí akọ ẹyọ kan tí ó ní agbára gbogbogbò
  choice: Lo ‘ẹnikẹ́ni’ àti ‘ara rẹ̀’
  alternative: Lo ọ̀rọ̀ akọ bí ‘ọkùnrin’ tàbí ‘tirẹ̀’ ní ọ̀nà tí yóò lè dà bí ẹni pé akọ nìkan ni
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú àwọn arọ́pò-orúkọ wọ̀nyí. ‘Ẹnikẹ́ni ... ara rẹ̀’ pa ẹyọ kan àti agbára gbogbogbò ti Gíríìkì mọ́ láìfikún ìyàtọ̀ akọ-abo tí kò sí nínú ìtumọ̀ ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àpẹẹrẹ Yorùbá àdánidá ‘gba ẹ̀mí là’ àti ‘pàdánù ẹ̀mí,’ a sì tún ‘nítorí’ ṣe láti mú ìbáṣepọ̀ méjèèjì kedere. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
