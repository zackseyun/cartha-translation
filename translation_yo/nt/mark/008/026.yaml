id: MRK.8.26
reference: Mark 8:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: yo
  text: Ó sì rán an lọ sí ilé rẹ̀[a], ó ní, “Má tilẹ̀ wọ inú abúlé náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan fi kún un pé, “má sì sọ fún ẹnikẹ́ni nínú abúlé náà.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán an lọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù ní kí ọkùnrin náà máa lọ; ‘rán an lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fi èrò iṣẹ́ ìránṣẹ́ kún un.
- source_word: εἰς οἶκον αὐτοῦ
  choice: sí ilé rẹ̀
  rationale: Èyí sọ ibi tí ó ń lọ ní Yorùbá àdánidá, ó sì lè túmọ̀ sí ilé tirẹ̀ tàbí ibi ìgbé rẹ̀.
- source_word: λέγων
  choice: ó ní
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ participle, ‘ó ní’ so ọ̀rọ̀ tí Jésù sọ mọ́ ìṣe rírán an lọ lọ́nà tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: Μηδὲ
  choice: Má tilẹ̀
  rationale: ‘Má tilẹ̀’ mú ìtẹnumọ́ àṣẹ òdì náà jáde pé kò gbọdọ̀ wọ abúlé náà rárá.
- source_word: κώμην
  choice: abúlé náà
  rationale: ‘Abúlé’ bá ìtumọ̀ κώμη gẹ́gẹ́ bí ìletò kékeré mu; ‘náà’ tọ́ka sí abúlé tí àyíká ìtàn ti dá mọ̀.
- source_word: εἰσέλθῃς
  choice: wọ inú
  rationale: ‘Wọ inú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwọlé sí ibì kan, ó sì pa agbára ìtọ́sọ́nà εἰς mọ́.
theological_decisions:
- issue: Ìwọ̀n àṣẹ Jésù nípa abúlé náà
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ kedere pé kí ọkùnrin náà má wọ abúlé náà, láìfi ohun tó fà á tàbí ọ̀rọ̀ àfikún àwọn ẹ̀dà kan sínú ẹsẹ̀ pàtàkì.
  alternative: Àwọn àṣà àfọwọ́kọ kan fi kún un pé kí ó má sọ fún ẹnikẹ́ni nínú abúlé náà.
  rationale: Ẹ̀dà SBLGNT ní àṣẹ pé kí ó má wọ abúlé náà nìkan; ó yẹ kí àfikún ẹ̀rí àfọwọ́kọ wà ní àlàyé ìsàlẹ̀, kì í ṣe nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Má tilẹ̀ wọ inú’ jẹ́ àṣẹ òdì tó ṣe kedere fún òǹkàwé òde òní.
