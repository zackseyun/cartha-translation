source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: yo
  text: “Nígbà tí mo bù búrẹ́dì márùn-ún fún àwọn ẹgbẹ̀rún márùn-ún,[a] àwọn agbọ̀n mélòó tí ó kún fún àwọn àjẹkù búrẹ́dì ni ẹ kó?[b]” Wọ́n dá a lóhùn pé, “Méjìlá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ẹgbẹ̀rún márùn-ún”; àwọn ìtumọ̀ kan ní, “àwọn ọkùnrin ẹgbẹ̀rún márùn-ún.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ègé búrẹ́dì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn apá búrẹ́dì tí a ṣẹ́ kù lẹ́yìn tí a bù ú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: Nígbà tí
  rationale: Ó fi gbólóhùn àkókò hàn, ó sì tọ́ka padà sí iṣẹ́ ìyanu jíjẹ àwọn ẹgbẹ̀rún márùn-ún.
- source_word: τοὺς πέντε ἄρτους
  choice: àwọn ìṣù búrẹ́dì márùn-ún
  rationale: ἄρτος jẹ́ ohun tí a lè kà níbí; ‘ìṣù búrẹ́dì’ ṣe ìtumọ̀ yẹn ní kedere ju ‘búrẹ́dì’ lásán lọ.
- source_word: ἔκλασα
  choice: mo bù
  rationale: κλάω túmọ̀ sí bíbu búrẹ́dì; ‘bù’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe náà.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: fún àwọn ẹgbẹ̀rún márùn-ún
  rationale: εἰς níbí fi àwọn tí a pín búrẹ́dì náà fún hàn; a kò fi ‘ọkùnrin’ kún un nítorí ẹsẹ̀ yìí kò sọ ọ́ ní pàtó.
- source_word: κοφίνους
  choice: agbọ̀n
  rationale: κόφινος jẹ́ irú agbọ̀n; ‘agbọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì fi àlàyé tí orísun kò béèrè kún un.
- source_word: κλασμάτων πλήρεις
  choice: tí ó kún fún àwọn ègé búrẹ́dì
  rationale: Ó pa ìtumọ̀ àwọn agbọ̀n tí ó kún fún àwọn apá búrẹ́dì tí a bù mọ́, ó sì ṣàn dáadáa ní Yorùbá.
- source_word: ἤρατε
  choice: ẹ kó
  rationale: αἴρω ní àyíká yìí ń tọ́ka sí kíkó àwọn àjẹkù jọ; ‘ẹ kó’ jẹ́ ìtumọ̀ àdánidá láìfi ‘jọ’ tí kò sí ní ọ̀rọ̀ Gíríìkì ṣe pàtàkì.
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n dá a lóhùn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ‘wọ́n sọ fún un,’ ọ̀rọ̀ náà jẹ́ ìdáhùn sí ìbéèrè, ‘dá a lóhùn’ sì jẹ́ Yorùbá àdánidá.
- source_word: Δώδεκα
  choice: Méjìlá
  rationale: Ìdáhùn nọ́ńbà tààrà ni; ohun tí wọ́n kà ti ṣe kedere nínú ìbéèrè.
theological_decisions:
- issue: Agbára aṣojú ti πεντακισχιλίους
  choice: àwọn ẹgbẹ̀rún márùn-ún
  alternative: àwọn ọkùnrin ẹgbẹ̀rún márùn-ún
  rationale: Ìrísí akọ nínú Gíríìkì lè tọ́ka sí ọkùnrin ní àwọn àyíká kan, ṣùgbọ́n níbí ó ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tí a fi mọ́ ogunlọ́gọ̀ náà. Fífún un ní ‘ọkùnrin’ nínú àkọ́kọ́ yóò sọ ohun tí ẹsẹ̀ náà kò sọ ní pàtó di pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀.
