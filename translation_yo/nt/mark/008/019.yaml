revisions:
- from: Nígbà tí mo bù àwọn ìṣù búrẹ́dì márùn-ún fún àwọn ẹgbẹ̀rún márùn-ún,[a] agbọ̀n mélòó ni ẹ kó, tí ó kún fún àwọn ègé búrẹ́dì?[b]” Wọ́n dá a lóhùn pé, “Méjìlá.”
