  rationale: Àtúnṣe náà rọ́pò ‘ìṣù búrẹ́dì,’ tí ó lè túmọ̀ sí iṣu, pẹ̀lú ‘búrẹ́dì márùn-ún,’ èyí tí ó bá ἄρτους mu ní kedere. A tún ṣètò gbólóhùn ‘agbọ̀n’ kí ‘tí ó kún fún àwọn àjẹkù búrẹ́dì’ lè ṣàlàyé àwọn agbọ̀n gẹ́gẹ́ bí πλήρεις κλασμάτων. Àwọn àlàyé ìsàlẹ̀ pa àwọn àṣàyàn ìtumọ̀ tó yẹ mọ́.
