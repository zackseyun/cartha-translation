  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: yo
  text: Bí mo bá sì rán wọn lọ sí ilé wọn ní ebi, wọ́n yóò rẹ̀wẹ̀sì lójú ọ̀nà[a]; àwọn kan lára wọn sì ti wá láti ibi jíjìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “agbára yóò tán wọn lójú ọ̀nà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí rírẹ̀wẹ̀sì tàbí dídi aláìlágbára débi pé ènìyàn kò lè tẹ̀ síwájú mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: rán wọn lọ
  rationale: Nínú ọ̀rọ̀ yìí, ó túmọ̀ sí jíjẹ́ kí ọ̀pọ̀ ènìyàn náà máa lọ, kì í ṣe ìtúsílẹ̀ kúrò nínú ìgbèkùn.
- source_word: νήστεις
  choice: ní ebi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ẹni tí kò jẹun, ṣùgbọ́n níbí ó ń ṣàpèjúwe bí ebi ti ń pa wọn, kì í ṣe ààwẹ̀ ẹ̀sìn tí wọ́n mọ̀ọ́mọ̀ gbà.
- source_word: εἰς οἶκον αὐτῶν
  choice: sí ilé wọn
  rationale: Ó fi hàn pé olúkúlùkù wọn yóò padà sí ilé tirẹ̀; ọ̀nà yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐκλυθήσονται
  choice: agbára yóò tán wọn
  rationale: Ó sọ pé wọn yóò rẹ̀wẹ̀sì tàbí di aláìlágbára gidigidi nítorí ebi; gbolohun yìí jẹ́ ti ẹ̀dá, ó sì pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́ láìfi dandan sọ pé wọn yóò dákú.
- source_word: ἐν τῇ ὁδῷ
  choice: lójú ọ̀nà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ohun tó ṣẹlẹ̀ nígbà ìrìn àjò.
- source_word: καί τινες αὐτῶν
  choice: àwọn kan lára wọn sì
  rationale: Ó pa ìsopọ̀ καί mọ́, ó sì ń tọ́ka sí apá kan nínú ọ̀pọ̀ ènìyàn náà.
- source_word: ἀπὸ μακρόθεν
  choice: láti ọ̀nà jíjìn
  rationale: Nínú àyíká yìí, ó tọ́ka sí jíjìn tí wọ́n ti rin wá, kì í ṣe ibi tí wọ́n dúró sí nìkan.
- source_word: ἥκασιν
  choice: ti wá
  rationale: Ó fi ipò wọn nísinsìnyí hàn gẹ́gẹ́ bí àwọn tí wọ́n ti dé láti ibi jíjìn.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tí ó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìsopọ̀ àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà àdánidá.
