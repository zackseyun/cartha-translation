source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: yo
  text: Ó sì kìlọ̀ fún wọn gidigidi pé kí wọn má sọ fún ẹnikẹ́ni nípa òun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó bá wọn wí”; tàbí, “Ó pàṣẹ fún wọn gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: kìlọ̀ fún wọn gidigidi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘báni wí’ tàbí ‘pa láṣẹ líle’. Nínú àyíká yìí, Jésù ń fún àwọn ọmọ-ẹ̀yìn ní ìkìlọ̀ líle pé wọn kò gbọdọ̀ sọ ẹni tí òun jẹ́; gbolohun yìí fi agbára àṣẹ náà hàn láìjẹ́ kí ó dà bí ẹni pé ó ń bá wọn wí nítorí ẹ̀ṣẹ̀ kan.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ọmọ-ẹ̀yìn tí Jésù ń bá sọ̀rọ̀.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: pé kí wọn má sọ ... fún ẹnikẹ́ni
  rationale: Lẹ́yìn ọ̀rọ̀ ìkìlọ̀ tàbí àṣẹ, ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń sọ ohun tí a pàṣẹ. Ìṣètò ‘pé kí ... má’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi àṣẹ ìdènà yìí hàn.
- source_word: περὶ αὐτοῦ
  choice: nípa òun
  rationale: περί pẹ̀lú genitive túmọ̀ sí ‘nípa’ tàbí ‘ní ti’. ‘Òun’ tọ́ka padà sí Jésù, ó sì yàtọ̀ sí ‘wọn’ nínú gbólóhùn náà.
theological_decisions:
- issue: Agbára àṣẹ Jésù nínú àyíká tí ó fi dènà fífi ẹni tí òun jẹ́ hàn
  choice: Fi hàn gẹ́gẹ́ bí ìkìlọ̀ líle pé wọn kò gbọdọ̀ sọ nípa rẹ̀ fún ẹnikẹ́ni.
  alternative: ‘Ó bá wọn wí’ tàbí ‘ó pàṣẹ fún wọn gidigidi.’
  rationale: Ẹsẹ náà fi ìdènà alágbára hàn, ṣùgbọ́n kò sọ ìdí tí Jésù fi pa á mọ́. Ìtumọ̀ náà kò gbé ẹ̀kọ́ pàtó kan wọ inú ọ̀rọ̀, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘kìlọ̀ ... gidigidi’ láti fi agbára ἐπετίμησεν hàn; ‘òun’ mú kí ẹni tí περὶ αὐτοῦ ń tọ́ka sí ṣe kedere.
