- from: Nígbà tí ó sì mọ̀ èyí, ó wí fún wọn pé, “Èé ṣe tí ẹ fi ń jíròrò pé ẹ kò ní búrẹ́dì[a]? Ẹ kò ha tíì fòye mọ̀, tàbí lóye? Ṣé ọkàn yín ti yigbì[b]?”
  to: Nígbà tí ó sì mọ̀ èyí, ó wí fún wọn pé, “Èé ṣe tí ẹ fi ń jíròrò pé ẹ kò ní búrẹ́dì[a]? Ẹ kò ha tíì fòye mọ̀, bẹ́ẹ̀ ni ẹ kò sì lóye? Ṣé ọkàn yín ti di líle[b]?”
  rationale: The revision replaces an unclear final predicate with the idiomatic “ti di líle,” retaining the Greek perfect passive sense of a present hardened condition and leaving its agent unstated. It also changes the connector between “fòye mọ̀” and “lóye” to express the Greek’s cumulative negation rather than an alternative. No theological interpretation has been added.
