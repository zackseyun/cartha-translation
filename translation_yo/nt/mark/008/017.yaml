id: MRK.8.17
reference: Mark 8:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: yo
  text: Nígbà tí ó sì mọ̀ èyí, ó wí fún wọn pé, “Èé ṣe tí ẹ fi ń jíròrò pé ẹ kò ní búrẹ́dì[a]? Ẹ kò ha tíì fòye mọ̀, bẹ́ẹ̀ ni ẹ kò sì lóye? Ṣé ọkàn yín ti di líle[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ọ̀pọ̀ ni ọ̀rọ̀ náà: ‘àwọn ìṣù búrẹ́dì.’'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘Ṣé ẹ ní ọkàn tí ó ti le?’ Gíríìkì sọ ọ́ ní ọ̀nà tó sún mọ́, ‘Ṣé ẹ ní ọkàn tí a ti sọ di líle?’
    reason: alternative_rendering
lexical_decisions:
- source_word: γνοὺς
  choice: nígbà tí ó sì mọ̀ èyí
  rationale: Aorist participle náà fi hàn pé ó mọ ohun tí wọ́n ń jíròrò; ‘èyí’ jẹ́ ohun tí àyíká ọ̀rọ̀ tọ́ka sí, ó sì mú gbolohun Yorùbá ṣe kedere.
- source_word: διαλογίζεσθε
  choice: ẹ fi ń jíròrò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìfọ̀rọ̀wérọ̀ tàbí ìrònú láàárín àwọn ọmọ-ẹ̀yìn; ‘jíròrò’ bá àyíká yìí mu ní Yorùbá àdánidá.
- source_word: ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà, ‘búrẹ́dì’ gẹ́gẹ́ bí orúkọ ohun jíjẹ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: νοεῖτε
  choice: fòye mọ̀
  rationale: ‘Fòye mọ̀’ gbé ìtumọ̀ ìfòye tàbí mímú ohun kan wọ inú sókè, ó sì yà díẹ̀ sí ‘lóye’ tó tẹ̀ lé e.
- source_word: συνίετε
  choice: lóye
  rationale: ‘Lóye’ sọ ìmòye tàbí òye kíkún, ó sì pa ìbejì ọ̀rọ̀ ìbéèrè náà mọ́ láìfi àwọn ọ̀rọ̀ méjèèjì dọ́gba pátápátá.
- source_word: πεπωρωμένην
  choice: ti yigbì
  rationale: ‘Yigbì’ ń ṣàpèjúwe ohun tí ó le, tí kò sì ní ìmọ̀lára tàbí ìdáhùn bí ó ti yẹ; ó pa àkàwé ìṣòro ọkàn mọ́.
- source_word: καρδίαν
  choice: ọkàn
  rationale: ‘Ọkàn’ pa àkàwé orísun mọ́, ó sì lè tọ́ka sí inú ènìyàn, òye rẹ̀, àti bí ó ṣe ń dáhùn sí òtítọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìbéèrè ìkẹyìn nípa ipò ọkàn àwọn ọmọ-ẹ̀yìn
  choice: Ṣé ọkàn yín ti yigbì?
  alternative: Ṣé ẹ ní ọkàn tí ó ti le?
  rationale: Gíríìkì ní ìtumọ̀ gangan tó sún mọ́ ‘ẹ ní ọkàn tí a ti sọ di líle,’ ṣùgbọ́n ìtumọ̀ yẹn kò rọrùn ní Yorùbá. Àṣàyàn yìí pa ipò líle àti àìní ìfèsì ọkàn mọ́, láìsọ ẹni tó fa á tàbí yanju bí líle náà ṣe ṣẹlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé lasán. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, bí àyíká ṣe béèrè.
