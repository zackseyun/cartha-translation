source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: yo
  text: Nítorí náà, mo sọ fún yín pé, ohun gbogbo[b] tí ẹ bá gbàdúrà fún, tí ẹ sì béèrè, ẹ gbàgbọ́ pé ẹ ti gbà á[a], yóò sì jẹ́ tiyín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “ẹ gbàgbọ́ pé ẹ ń gbà á,” dípò “ẹ ti gbà á.” Ọ̀rọ̀ Gíríìkì tí a lò níbí ní, “ẹ ti gbà á,” ó sì fi ìṣe tí ó ti parí hàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ohunkóhun tí ẹ bá gbàdúrà fún, tí ẹ sì béèrè.”
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti so ọ̀rọ̀ yìí mọ́ ẹ̀kọ́ tó ṣáájú, ó sì pa agbára ìtumọ̀ ìparí tàbí ìdí mọ́.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Ó jẹ́ ọ̀rọ̀ ìbánisọ̀rọ̀ tààrà, tó bójú mu ní Yorùbá òde òní, tí ó sì pa ohùn àṣẹ ẹni tó ń sọ̀rọ̀ mọ́.
- source_word: πάντα ὅσα
  choice: ohunkóhun tí
  rationale: Ó fi gbígbòòrò gbólóhùn Gíríìkì hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: ẹ bá gbàdúrà tí ẹ sì béèrè
  rationale: 'A pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́: gbígbàdúrà àti bíbéèrè ohun kan nínú àdúrà.'
- source_word: πιστεύετε
  choice: ẹ gbàgbọ́
  rationale: Èyí ni ìtumọ̀ àdánidá fún àṣẹ náà, ó sì darapọ̀ mọ́ ohun tí ó tẹ̀ lé e dáadáa.
- source_word: ἐλάβετε
  choice: ẹ ti gbà á
  rationale: Àmì “ti” fi ìṣe tí ó ti parí hàn, ó sì pa agbára àkókò aorist àti ìyàlẹ́nu ọ̀rọ̀ náà mọ́.
- source_word: ἔσται ὑμῖν
  choice: yóò sì jẹ́ tiyín
  rationale: Ó fi ìlérí ọjọ́ iwájú hàn ní ṣókí, ó sì bá “ohunkóhun” mu gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀.
theological_decisions:
- issue: Agbára àkókò ìdáhùn sí àdúrà ní ìbáṣepọ̀ pẹ̀lú ìgbàgbọ́
  choice: ẹ gbàgbọ́ pé ẹ ti gbà á, yóò sì jẹ́ tiyín
  alternative: ẹ gbàgbọ́ pé ẹ ń gbà á, yóò sì jẹ́ tiyín
  rationale: SBLGNT ní ἐλάβετε, ọ̀rọ̀-ìṣe aorist, kì í ṣe ọ̀rọ̀-ìṣe present. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ tó wà láàárín ohun tí a ti gbà àti ohun tí yóò jẹ́ ti ẹni mọ́, láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ẹ/yín” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῖν, a sì fi àmì ohùn sí ibi tí ó yẹ. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
