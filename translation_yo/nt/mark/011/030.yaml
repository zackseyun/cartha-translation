base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: yo
  text: Ṣé ìrìbọmi Jòhánù láti ọ̀run[a] ni, àbí láti ọ̀dọ̀ ènìyàn[b]? Ẹ dá mi lóhùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀dọ̀ Ọlọ́run.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “láti ọ̀run,” èyí tó jẹ́ àkànlò Júù fún orísun tàbí àṣẹ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: “Láti ọ̀dọ̀ ènìyàn” túmọ̀ sí pé orísun tàbí àṣẹ rẹ̀ jẹ́ ti ẹ̀dá ènìyàn lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: ìrìbọmi Jòhánù
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí ìrìbọmi tí Jòhánù ń ṣe, ó sì pa ìtumọ̀ genitive Gíríìkì mọ́ láìdi gbólóhùn náà líle.
- source_word: ἐξ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì pa àkànlò èdè Júù tí ń tọ́ka sí orísun tàbí àṣẹ Ọlọ́run mọ́.
- source_word: ἐξ ἀνθρώπων
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ ọ̀rọ̀ àpapọ̀ ní Yorùbá fún àwọn ẹ̀dá ènìyàn; ‘láti ọ̀dọ̀’ fi orísun tàbí àṣẹ ènìyàn hàn ní kedere, ní ìyàtọ̀ sí ‘láti ọ̀run.’
- source_word: ἀποκρίθητέ μοι
  choice: Ẹ dá mi lóhùn
  rationale: Èyí jẹ́ àṣẹ tààrà, tó ṣe déédé pẹ̀lú aorist imperative, ó sì jẹ́ èdè Yorùbá àdánidá àti ọlọ́lá.
- source_word: ἦν ἢ
  choice: Ṣé ... ni, àbí ...?
  rationale: Ìṣètò ìbéèrè yìí jẹ́ ti Yorùbá àdánidá, ó sì pa yíyan láàárín orísun méjèèjì tí Gíríìkì gbé kalẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘láti ọ̀run’ nínú ìbéèrè Jésù
  choice: Pa àkànlò náà mọ́ gẹ́gẹ́ bí ‘láti ọ̀run’ nínú ọ̀rọ̀ pàtàkì.
  alternative: láti ọ̀dọ̀ Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘láti ọ̀run,’ àkànlò Júù kan fún orísun tàbí àṣẹ àtọ̀runwá. Mímú un dúró kò yanjú ìtumọ̀ náà ju bí orísun ṣe ṣe lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ohun tí àkànlò náà lè túmọ̀ sí hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘Ṣé ... ni, àbí ...?’ fún ìbéèrè yíyan, àti ‘Ẹ’ gẹ́gẹ́ bí ọ̀nà ọ̀wọ̀ tí ó tún lè bá àṣẹ tí a sọ fún ọ̀pọ̀ ènìyàn mu.
