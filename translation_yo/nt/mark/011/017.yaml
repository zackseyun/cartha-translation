id: MRK.11.17
reference: Mark 11:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: yo
  text: Ó sì ń kọ́ni, ó sì ń sọ fún wọn pé, “A kò ha kọ ọ́ sílẹ̀ pé, ‘Ilé mi ni a ó pè ní ilé àdúrà fún gbogbo àwọn orílẹ̀-èdè[a]’? Ṣùgbọ́n ẹ̀yin ti sọ ọ́ di ìhò àwọn ọlọ́ṣà[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “fún gbogbo àwọn ènìyàn.” Gíríìkì sọ ní tààrà pé “fún gbogbo àwọn orílẹ̀-èdè,” ó sì ń tọ́ka sí Aísáyà 56:7, ní fífi ìwọ̀n tó kan gbogbo orílẹ̀-èdè hàn.
    reason: lexical_alternative
  - marker: b
    text: “Ìhò àwọn ọlọ́ṣà” ń tọ́ka sí Jeremáyà 7:11. Ọ̀rọ̀ Gíríìkì fún “ọlọ́ṣà” tún lè túmọ̀ sí “jàndùkú” tàbí, ní àwọn àyíká kan, “ọlọ̀tẹ̀ ológun.”
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ń kọ́ni
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé iṣẹ́ kíkọ́ni ń lọ lọ́wọ́ nínú tẹ́ńpìlì; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtẹ̀síwájú iṣẹ́ náà mọ́.
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: ó sì ń sọ fún wọn pé
  rationale: A lo ìṣe tí ń lọ lọ́wọ́ fún ἔλεγεν, a sì mú αὐτοῖς jáde ní kedere gẹ́gẹ́ bí ‘fún wọn.’
- source_word: Οὐ γέγραπται
  choice: A kò ha kọ ọ́ pé
  rationale: Èyí pa ìbéèrè tí ó retí ìdáhùn rere mọ́, ó sì fi agbára ohun tí a ti kọ sínú Ìwé Mímọ́ hàn.
- source_word: Ὁ οἶκός μου
  choice: Ilé mi
  rationale: ‘Ilé’ ni ìbámu tààrà, ó sì pa ìróhìn ọ̀rọ̀ Aísáyà 56:7 mọ́ láìfi ‘tẹ́ńpìlì’ rọ́pò àwòrán inú ọ̀rọ̀ náà.
- source_word: οἶκος προσευχῆς
  choice: ilé àdúrà
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ilé tí a yà sí mímọ́ fún àdúrà, ó sì pa ìtumọ̀ ìsopọ̀ orúkọ Gíríìkì mọ́.
- source_word: κληθήσεται
  choice: a ó máa pè
  rationale: Ìtumọ̀ yìí fi ọjọ́ iwájú àti ohùn àìṣe hàn ní Yorùbá àdánidá.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: fún gbogbo àwọn orílẹ̀-èdè
  rationale: ‘Orílẹ̀-èdè’ pa ìtumọ̀ ἔθνη àti ìwọ̀n àgbáyé inú àsọtẹ́lẹ̀ Aísáyà mọ́; ‘fún’ sì bá ipa dative nínú àyọlò náà mu.
- source_word: ὑμεῖς δὲ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a mú jáde ní kedere fi ìtẹnumọ́ àti ìyàtọ̀ líle láàárín ète Ọlọ́run àti ohun tí àwọn olùgbọ́ ṣe hàn.
- source_word: πεποιήκατε
  choice: ti sọ ọ́ di
  rationale: 'Àmì ‘ti’ pa agbára perfect mọ́: ohun tí wọ́n ṣe tẹ́lẹ̀ ti yọrí sí ipò tí ó wà nísinsìnyí.'
- source_word: σπήλαιον λῃστῶν
  choice: ihò àwọn ọlọ́ṣà
  rationale: ‘Ihò’ jẹ́ ibi ìfarapamọ́ tàbí ibùgbé àwọn ọlọ́ṣà ní àyíká ọ̀rọ̀ yìí, ‘àwọn ọlọ́ṣà’ sì pa ìróhìn Jeremáyà 7:11 mọ́ láìfi ìtumọ̀ òṣèlú tí ẹsẹ̀ náà kò sọ kún un.
theological_decisions:
- issue: Ìwọ̀n gbogbo ayé nínú àyọlò àsọtẹ́lẹ̀ náà
  choice: fún gbogbo àwọn orílẹ̀-èdè
  alternative: fún gbogbo àwọn ènìyàn; láti ọ̀dọ̀ gbogbo àwọn orílẹ̀-èdè
  rationale: Èyí tẹ̀lé ἔθνη ní pẹkipẹki, ó sì pa ìtẹnumọ́ Aísáyà mọ́ pé a pinnu ilé Ọlọ́run fún àwọn tí ó wà ní òde Ísírẹ́lì pẹ̀lú, láìyanjú gbogbo ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ó lè jẹyọ láti inú rẹ̀.
- issue: Agbára λῃστῶν nínú ẹ̀sùn Jésù
  choice: àwọn ọlọ́ṣà
  alternative: àwọn jàndùkú; àwọn ọlọ̀tẹ̀ ológun
  rationale: Bí ó tilẹ̀ jẹ́ pé λῃστής lè túmọ̀ sí jàndùkú tàbí ọlọ̀tẹ̀ ní àwọn àyíká kan, ìróhìn Jeremáyà 7:11 ń darí ìtumọ̀ níbí. ‘Àwọn ọlọ́ṣà’ kò fi ìtumọ̀ òṣèlú tí ọ̀rọ̀ náà kò béèrè kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àwọn ìṣe ‘ń kọ́ni’ àti ‘ń sọ’ pa ìtẹ̀síwájú àwọn ọ̀rọ̀-ìṣe aláìpé Gíríìkì mọ́, nígbà tí ‘ti sọ ọ́ di’ pa àbájáde tí ó ṣì wà nínú perfect mọ́. A gbé àmì àlàyé [a] àti [b] sí ibi tí àlàyé kọ̀ọ̀kan ń tọ́ka sí ní tààrà.
