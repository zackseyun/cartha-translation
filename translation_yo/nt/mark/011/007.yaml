  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: yo
  text: Wọ́n sì mú ọmọ kẹ́tẹ́kẹ́tẹ́ náà wá sọ́dọ̀ Jésù, wọ́n sì da aṣọ wọn lé e, ó sì jókòó lórí rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́
  rationale: Ní àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́; èyí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐπιβάλλουσιν
  choice: da ... lé e
  rationale: Ó mú ìṣe fífi aṣọ bo ẹranko náà jáde ní ọ̀nà tó lágbára, ó sì bá ìtumọ̀ 'threw/put upon' mu láì sọ pé wọ́n ṣe é ní ìwà ipá.
- source_word: ἱμάτια
  choice: aṣọ
  rationale: Ọ̀rọ̀ gbogbogbò fún aṣọ òde wọn ni; 'aṣọ' jẹ́ èdè Yorùbá tó rọrùn, tó sì bójú mu.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: ó jókòó lórí rẹ̀
  rationale: Ìtumọ̀ tààrà ni pé Jésù jókòó lórí ọmọ kẹ́tẹ́kẹ́tẹ́ náà; arọ́pò-orúkọ náà jẹ́ àdánidá nínú Yorùbá.
