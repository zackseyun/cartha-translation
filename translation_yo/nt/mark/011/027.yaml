id: MRK.11.27
reference: Mark 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: yo
  text: Wọ́n sì tún dé Jerúsálẹ́mù. Bí ó sì ti ń rìn nínú àgbàlá tẹ́ńpìlì[a], àwọn olórí àlùfáà, àwọn akọ̀wé àti àwọn àgbààgbà wá sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú tẹ́ńpìlì” tàbí “ní àgbègbè tẹ́ńpìlì”; ọ̀rọ̀ Gíríìkì náà tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé / wá
  rationale: Ọ̀rọ̀ náà jẹ́ historical present ní Gíríìkì. Yorùbá ìtàn àdánidá lo ‘dé’ fún dídé Jerúsálẹ́mù, ó sì lo ‘wá’ fún ìṣípò àwọn aṣáájú sí ọ̀dọ̀ Jésù.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé wọ́n padà dé Jerúsálẹ́mù lẹ́ẹ̀kan sí i.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọsílẹ̀ orúkọ ìlú náà tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. ‘Àgbàlá tẹ́ńpìlì’ jẹ́ ọ̀nà àdánidá láti sọ ibi gbangba tí ènìyàn lè máa rìn.
- source_word: περιπατοῦντος αὐτοῦ
  choice: bí ó sì ti ń rìn
  rationale: Ó pa iṣẹ́ tí ó ń lọ lọ́wọ́ mọ́, ó sì fi í ṣe àyíká fún dídé àwọn aṣáájú.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ní ọ̀pọ̀, ọ̀rọ̀ náà tọ́ka sí àwọn aláṣẹ pàtàkì láàárín àwọn àlùfáà, kì í ṣe ọ̀pọ̀ olórí àlùfáà gíga tí ó dọ́gba.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí jẹ́ ìtumọ̀ taara tí ó pa ipa ẹgbẹ́ àwọn amòye Ìwé Mímọ́ Júù mọ́ láì dín ọ̀rọ̀ Gíríìkì náà kù sí ‘olùkọ́ òfin’ nìkan.
- source_word: πρεσβύτεροι
  choice: àwọn àgbààgbà
  rationale: Nínú àyíká yìí, ó túmọ̀ sí àwọn aṣáájú tí a mọ̀ sí àgbààgbà, kì í ṣe àwọn ọkùnrin arúgbó lásán.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó sọ ìṣípò wọn sí ibi tí Jésù wà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἱερόν
  choice: àgbàlá tẹ́ńpìlì
  alternative: tẹ́ńpìlì; àgbègbè tẹ́ńpìlì
  rationale: Yíyan ‘àgbàlá tẹ́ńpìlì’ kò jẹ́ kí òǹkàwé rò pé Jésù wà nínú ibi mímọ́ inú ilé tẹ́ńpìlì. Ó bá àgbègbè tẹ́ńpìlì gbígbòòrò tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí mu, láì fi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn kejì pa ìṣàn ìtàn Gíríìkì mọ́ ní ọ̀nà àdánidá; ‘bí ó sì ti ń rìn’ fi iṣẹ́ tí ó ń lọ lọ́wọ́ hàn.
