source:
  edition: SBLGNT
  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: yo
  text: Pétérù sì rántí, ó wí fún un pé, “Rábì, wò ó! Igi ọ̀pọ̀tọ́ tí o bú ti gbẹ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti rọgbẹ.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ti gbẹ” tàbí “ti rọgbẹ”; àkókò pípé náà tẹnumọ́ àbájáde tí ó ṣì wà nísinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: nígbà tí Peteru sì rántí
  rationale: Ó fi ìṣe alábápín aorist hàn gẹ́gẹ́ bí ìṣe tó ṣáájú ọ̀rọ̀ Peteru díẹ̀, ó sì jẹ́ Yorùbá àdánidá.
- source_word: λέγει
  choice: ó wí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, ‘ó wí’ bá ìtàn Yorùbá mu láìsọ ìtumọ̀ di ohun mìíràn.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó pa ọ̀rọ̀ arọ́pò-orúkọ inú Gíríìkì mọ́, láìfi ‘Jésù’ kún un.
- source_word: Ῥαββί
  choice: Rábì
  rationale: Ìkọ̀wé orúkọ oyè náà pa àyíká Júù àti ọ̀nà ìpè tààrà mọ́.
- source_word: ἴδε
  choice: wò ó
  rationale: Àṣẹ tààrà, àdánidá ní Yorùbá, tó fa àfiyèsí sí ohun tí Peteru rí.
- source_word: συκῆ
  choice: igi ọ̀pọ̀tọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí igi ọ̀pọ̀tọ́, kì í ṣe èso rẹ̀ nìkan.
- source_word: κατηράσω
  choice: tí o fi bú
  rationale: Ó sọ ìṣe ẹni kejì ẹyọ kan ní tààrà, ó sì bá ọ̀nà Yorùbá mu.
- source_word: ἐξήρανται
  choice: ti rọ
  rationale: ‘Ti rọ’ jẹ́ ọ̀nà àdánidá láti sọ pé igi náà ti gbẹ tàbí rẹ̀, ó sì fi àbájáde tó wà nísinsìnyí hàn.
