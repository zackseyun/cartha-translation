  - severity: medium
    issue: “ti rọ” fún ἐξήρανται
    rationale: “Rọ” sábà máa ń tọ́ka sí rírò/síse rọ̀ tàbí ìrẹ̀, kì í sì ṣe ọ̀rọ̀ tó dájú fún igi tí ó ti gbẹ. “Ti gbẹ” ń fi ìtumọ̀ ‘has withered/has dried up’ àti ipò àbájáde hàn kedere.
  - severity: low
    issue: “Peteru” àti ìbẹ̀rẹ̀ “Nígbà tí”
