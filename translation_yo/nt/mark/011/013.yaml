  terminology: “Igi ọ̀pọ̀tọ́,” “ewé,” àti “àkókò èso ọ̀pọ̀tọ́” yẹ, ó sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá òde òní mu. A yọ àlàyé ẹsẹ̀ kúrò nítorí yíyan “tí ewé bò” ń fi ìtumọ̀ pé ewé bo igi náà kún un, èyí tí ó lágbára ju ἔχουσαν φύλλα (‘tí ó ní ewé’) lọ.
