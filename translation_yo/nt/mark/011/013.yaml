  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì gbogbo rẹ̀ ní pàtàkì: igi ọ̀pọ̀tọ́ tí ó ní ewé ni a rí ní òkèèrè; ó lọ láti wá ohun kan lórí i; ewé nìkan ni ó rí; gbólóhùn ìdí náà sì ṣì pa ìforígbárí nípa àsìkò èso mọ́. Síbẹ̀, “kì í ṣe” sábà ń fi ìṣe àṣà/hábítù hàn ní Yorùbá, níbi tí ἦν ń tọ́ka sí ipò ní àkókò ìtàn náà.'
