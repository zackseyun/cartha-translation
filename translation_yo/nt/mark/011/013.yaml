id: MRK.11.13
reference: Mark 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: yo
  text: Ó rí igi ọ̀pọ̀tọ́ kan ní òkèèrè tí ó ní ewé, ó sì lọ wò bóyá ó lè rí ohun kan lára rẹ̀. Ṣùgbọ́n nígbà tí ó dé sí i, kò rí ohunkóhun bí kò ṣe ewé, nítorí pé kò jẹ́ àsìkò èso ọ̀pọ̀tọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: Ó rí
  rationale: Ọ̀rọ̀ yìí mú ìṣe participle náà wá sí Yorùbá àdánidá gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó yọrí sí lílọ rẹ̀, láì fi ìtúmọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: συκῆν
  choice: igi ọ̀pọ̀tọ́ kan
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún igi fig, ó sì dá igi náà yàtọ̀ sí èso rẹ̀.
- source_word: ἀπὸ μακρόθεν
  choice: láti ọ̀nà jíjìn
  rationale: Gbólóhùn Yorùbá àdánidá tó pa ìtumọ̀ jíjìn sí ibi tí igi náà wà mọ́.
- source_word: ἔχουσαν φύλλα
  choice: tí ó ní ewé
  rationale: Ó tẹ̀ lé ìtumọ̀ ‘having leaves’ ní kedere, láì túmọ̀ sí pé igi náà gbilẹ̀ ju ohun tí orísun sọ lọ.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: ó sì lọ wò bóyá òun lè rí ohun kan lára rẹ̀
  rationale: ‘Bóyá’ pa àìdánilójú εἰ ἄρα mọ́; ‘lọ wò’ sì sọ ète lílọ náà ní Yorùbá tó mọ́gbọ́n dání.
- source_word: ἐν αὐτῇ
  choice: lára rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tàbí èso wà lórí ara igi.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: nígbà tí ó dé ọ̀dọ̀ rẹ̀
  rationale: Ó mú participle àti ìtọ́kasí sí igi náà jáde ní Yorùbá tó rọrùn, tó sì dára.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: kò rí ohunkóhun bí kò ṣe ewé
  rationale: ‘Bí kò ṣe’ jẹ́ ìbámu Yorùbá tó péye fún εἰ μὴ, ó sì pa ìtẹnumọ́ pé ewé nìkan ni ó rí mọ́.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: nítorí pé kì í ṣe àsìkò èso ọ̀pọ̀tọ́
  rationale: ‘Àsìkò’ mú καιρός jáde gẹ́gẹ́ bí àkókò tó yẹ fún èso; fífi ‘èso’ kún ọ̀pọ̀tọ́ mú un ṣe kedere pé èso igi ni a ń sọ, láì ṣàlàyé ìṣòro inú ẹsẹ náà kúrò.
theological_decisions:
- issue: Agbára ìtumọ̀ gbólóhùn àlàyé nípa àsìkò èso ọ̀pọ̀tọ́
  choice: 'Túmọ̀ ọ́ tààrà gẹ́gẹ́ bí àlàyé akọ̀ròyìn: “nítorí pé kì í ṣe àsìkò èso ọ̀pọ̀tọ́.”'
  alternative: Ṣàlàyé rẹ̀ síwájú nípa bí igi ọ̀pọ̀tọ́ ṣe ń so èso tàbí kí a dín ìforígbárí náà kù.
  rationale: Orísun Gíríìkì sọ pé ó wá ohun kan lórí igi náà, síbẹ̀ kò tíì jẹ́ àsìkò èso. Ìtumọ̀ náà pa ìforígbárí yìí mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí ti iṣẹ́ àgbẹ̀ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lasán. A lo ‘òun’ láti mú kí ẹni tí yóò rí ohun náà ṣe kedere, a sì yẹra fún àlàyé iṣẹ́ àgbẹ̀ tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ.
