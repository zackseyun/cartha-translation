  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: yo
  text: Nígbà tí wọ́n ń sún mọ́ Jerúsálẹ́mù[a], ní agbègbè Bẹtifágè àti Betaní, nítòsí Òkè Ólífì, ó rán[b] méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń sún mọ́ Jerúsálẹ́mù, sí Bẹtifágè àti Betaní, ní ìhà Òkè Ólífì.” Àwọn ọ̀rọ̀ atọ́ka ibi inú Gíríìkì lè túmọ̀ sí ìtọ́sọ́nà tàbí ìsúnmọ́.
    reason: lexical_alternative
  - marker: b
    text: Máàkù sábà máa ń lo àsìkò ìsinsìnyí láti sọ ìṣẹ̀lẹ̀ àtijọ́ lọ́nà alárinrin; nítorí náà, “ó rán” tún lè jẹ́ “ó ń rán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: wọ́n ń sún mọ́
  rationale: Ó fi ìṣípò tí ó ń lọ síwájú hàn lọ́nà àdánidá ní Yorùbá, bó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí nínú ìtàn.
- source_word: εἰς Ἱεροσόλυμα
  choice: mọ́ Jerúsálẹ́mù
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘sún mọ́,’ èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédé jù fún ibi tí wọ́n ń sún mọ́.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: tí wọ́n dé agbègbè Bẹtifágè àti Betaní
  rationale: Àtúmọ̀ yìí mú kí ìbáṣepọ̀ àwọn ibi náà yéni ní Yorùbá láìfi dandan sọ pé wọ́n dé àárín ìlú méjèèjì.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: nítòsí Òkè Ólífì
  rationale: πρός níbí lè tọ́ka sí ìsúnmọ́ tàbí ìdojúkọ ibi; ‘nítòsí’ bá àyíká ọ̀rọ̀ mu láìfi ìtọ́sọ́nà kan múlẹ̀ ju bó ṣe yẹ lọ.
- source_word: ἀποστέλλει
  choice: ó rán
  rationale: Àsìkò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá; àlàyé ìsàlẹ̀ tọ́ka sí ìsinsìnyí ìtàn inú Gíríìkì.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó pa ìtumọ̀ ìpín lára ẹgbẹ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Βηθφαγὴ
  choice: Bẹtifágè
  rationale: Ìkọ̀wé orúkọ ibi náà ni a mú bá ìró Gíríìkì mu ní Yorùbá.
- source_word: Βηθανίαν
  choice: Betaní
  rationale: Ìkọ̀wé orúkọ ibi náà ni a mú bá ìró Gíríìkì mu ní Yorùbá.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Òkè Ólífì
  rationale: Orúkọ ibi tó ṣe kedere, tó sì ṣàfihàn ìbáṣepọ̀ rẹ̀ pẹ̀lú igi ólífì.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó lọ́lá, tó ṣe kedere, tí ó sì yé òǹkàwé òde òní. A lo àsìkò tí ó ti kọjá fún ìṣàn ìtàn Yorùbá, a sì pa àìdánilójú àwọn atọ́ka ibi Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
