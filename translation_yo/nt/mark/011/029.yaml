    issue: “irú àṣẹ tí mo fi ń ṣe” kò ní “wo”
    rationale: ποίᾳ jẹ́ ọ̀rọ̀ ìbéèrè (“what/such as what”). Nínú ìbéèrè tí a fi sínú ọ̀rọ̀ Jésù, Yorùbá adayeba nílò “àṣẹ wo ni mo fi …”; bí bẹ́ẹ̀ kọ́, gbolohun náà lè dun bí ìlérí láti sọ irú àṣẹ kan kan náà.
  - severity: low
    issue: Ọ̀rọ̀ “ní ti gígùn-gẹ́gẹ́” nínú àlàyé ìsàlẹ̀ a kò dáa
    rationale: Kì í ṣe ọ̀nà Yorùbá adayeba láti tọ́ka sí ìtumọ̀ ọ̀rọ̀ ní ìpele gidi/lítíràlì. “Ní ìtumọ̀ gidi” yé kedere.
