revisions:
- from: Ṣùgbọ́n Jésù sọ fún wọn pé, “Èmi yóò bi yín ní ìbéèrè kan[a]. Ẹ dá mi lóhùn[b], èmi náà yóò sì sọ fún yín irú àṣẹ tí mo fi ń ṣe àwọn nǹkan wọ̀nyí.”
  to: Ṣùgbọ́n Jésù sọ fún wọn pé, “Èmi yóò bi yín ní ìbéèrè kan[a]. Ẹ dá mi lóhùn[b], èmi yóò sì sọ fún yín àṣẹ wo ni mo fi ń ṣe àwọn nǹkan wọ̀nyí.”
  rationale: Àtúnṣe náà fi “wo” kún ìbéèrè nípa àṣẹ, láti ṣe àfihàn ποίᾳ ní kedere àti láti mú gbolohun Yorùbá rọrùn. A tún ṣàtúnṣe ọ̀rọ̀ àlàyé ìsàlẹ̀ a nìkan; ìyókù ni a pa mọ́, pẹ̀lú ìtumọ̀, ìforígbárí, àti ìkọ̀wé ọ̀wọ̀ ti ìpilẹ̀ṣẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbo ìpín pàtàkì: ìyípadà δέ, ìbéèrè kan, àṣẹ pé kí wọ́n dá a lóhùn, àti ìbéèrè nípa ἐξουσία. Ṣùgbọ́n, “irú àṣẹ tí mo fi” kò ní ọ̀rọ̀ ìbéèrè tó yẹ, ó sì lè dà bí pé Jésù yóò sọ irú àṣẹ kan tí a ti mọ̀. “àṣẹ wo ni mo fi” pa ìbéèrè ποίᾳ mọ́ ní kedere.'
  naturalness: 'Èdè náà jẹ́ Yorùbá boṣewa tí ó mọ́gbọ́n dání. A tún gbé àsọyé nípa àṣẹ náà kalẹ̀ sí ọ̀nà tí ó wọ́pọ̀ jù: “àṣẹ wo ni mo fi ń ṣe …” Àlàyé ìsàlẹ̀ a ni a tún ṣe kí ọrọ̀ “more literally” lè hàn ní Yorùbá adayeba.'
  terminology: “Jésù,” “ìbéèrè,” “dá … lóhùn,” àti “àṣẹ” yẹ, wọ́n sì pa ìforígbárí tó wà lórí ẹ̀tọ́/àṣẹ Jésù mọ́ láìsọ ìtumọ̀ ẹ̀kọ́ ẹ̀sìn kan di dandan.
  issues:
