  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Èmi yóò bi yín ní ìbéèrè kan[a]. Ẹ dá mi lóhùn[b], èmi yóò sì sọ fún yín àṣẹ wo ni mo fi ń ṣe àwọn nǹkan wọ̀nyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ kan” tàbí “ọ̀ràn kan”; ní ìtumọ̀ gidi, “ọ̀rọ̀ kan.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè kọ ọ́ pọ̀ pé, “Èmi yóò bi yín ní ìbéèrè kan, kí ẹ sì dá mi lóhùn, èmi yóò sì sọ fún yín …”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré àti ìdáhùn Jésù sí ìbéèrè àwọn aṣáájú hàn; ‘Ṣùgbọ́n’ bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni àkọsílẹ̀ orúkọ náà tí ó wọ́pọ̀, tí ó sì dúró ṣinṣin ní Yorùbá.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣí ọ̀rọ̀ tààrà sílẹ̀, ó sì pa ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Èmi yóò bi yín
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún ìbéèrè tí Jésù fẹ́ fi dá tiwọn lóhùn; fífi ‘Èmi’ síbẹ̀ tẹnumọ́ ẹni tí yóò béèrè láìfi ohun tuntun kún un.
- source_word: ἕνα λόγον
  choice: ní ìbéèrè kan
  rationale: Nínú àyíká yìí, λόγος ń tọ́ka sí ọ̀rọ̀ tàbí ohun kan tí wọ́n gbọ́dọ̀ dá lóhùn; ‘ìbéèrè kan’ mú iṣẹ́ rẹ̀ nínú àyíká náà hàn kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro rẹ̀ mọ́.
- source_word: ἀποκρίθητέ μοι
  choice: Ẹ dá mi lóhùn
  rationale: Ó pa agbára àṣẹ aorist imperative mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: ἐρῶ ὑμῖν
  choice: èmi náà yóò sì sọ fún yín
  rationale: ‘Sọ fún yín’ jẹ́ ọ̀nà àdánidá láti sọ ìlérí pé òun yóò fi ìsọfúnni náà hàn; ‘náà’ mú ìbáṣepọ̀ ìdáhùn méjèèjì hàn láìyí ìtumọ̀ padà.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: irú àṣẹ tí mo fi
  rationale: Ọ̀rọ̀ yìí béèrè irú tàbí ìpìlẹ̀ àṣẹ tí Jésù fi ń ṣe iṣẹ́ rẹ̀. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì sọ ọ́ di agbára lasán tàbí sọ ẹni tí ó fún un ní àṣẹ ní pàtó.
- source_word: ταῦτα ποιῶ
  choice: mo fi ń ṣe àwọn nǹkan wọ̀nyí
  rationale: Àmì ‘ń’ pa ìṣe tí ó ń lọ tàbí tí ó sábà ń ṣẹlẹ̀ mọ́, ‘àwọn nǹkan wọ̀nyí’ sì tọ́ka sí àwọn iṣẹ́ tí wọ́n ń jiyàn lé lórí.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú àyíká yìí
  choice: àṣẹ
  alternative: ẹ̀tọ́; agbára
  rationale: Àríyànjiyàn náà dá lórí ìdánilójú tàbí ẹ̀tọ́ Jésù láti ṣe àwọn iṣẹ́ wọ̀nyí, kì í ṣe agbára láti ṣe wọn nìkan. ‘Àṣẹ’ pa agbára ilé-iṣẹ́ àti ti ẹ̀sìn inú ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá bá àṣà ìkọ̀wé mu, pẹ̀lú èdè ọ̀wọ̀, òde òní, tí ó sì yé òǹkàwé lásán. A ya gbólóhùn ìbéèrè ọjọ́ iwájú kúrò lọ́dọ̀ àṣẹ ‘Ẹ dá mi lóhùn’ kí ọ̀rọ̀ lè ṣàn dáadáa ní Yorùbá, nígbà tí ‘sì’ àti ‘náà’ ń pa ìsopọ̀ àwọn gbólóhùn Gíríìkì mọ́.
