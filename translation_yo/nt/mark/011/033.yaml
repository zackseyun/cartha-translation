source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: yo
  text: Wọ́n sì dá Jésù lóhùn pé, “Àwa kò mọ̀.” Jésù sì wí fún wọn pé, “Èmi náà kì yóò sọ fún yín àṣẹ wo ni mo fi ń ṣe nǹkan wọ̀nyí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: dá Jésù lóhùn
  rationale: Ó mú ìṣe alábápín tí ó ṣáájú ọ̀rọ̀ wọn jáde lọ́nà Yorùbá àdánidá, ó sì fi hàn pé wọ́n ń fèsì sí Jésù.
- source_word: λέγουσιν / λέγει / λέγω
  choice: pé / wí fún / sọ fún
  rationale: 'Àwọn ọ̀rọ̀ wọ̀nyí bá ọ̀nà Yorùbá mu ní àwọn àyíká ọ̀tọ̀ọ̀tọ̀: “pé” ṣí ọ̀rọ̀ tààrà, “wí fún” bá ìtàn ọlọ́lá mu, “sọ fún” sì bá ìbéèrè àìṣe-taara mu.'
- source_word: Οὐκ οἴδαμεν
  choice: Àwa kò mọ̀
  rationale: Ó túmọ̀ ìkọ̀sílẹ̀ pẹ̀lú ìtumọ̀ ìsinsìnyí ní tààrà; fífi “Àwa” síbẹ̀ ń tẹnumọ́ ẹni tí ń dáhùn.
- source_word: Οὐδὲ ἐγὼ
  choice: Èmi náà kì yóò
  rationale: 'Ó pa ìfarawé ìdáhùn náà mọ́: bí àwọn náà kò ṣe sọ, bẹ́ẹ̀ ni Jésù kò ní sọ. Ọ̀rọ̀ náà ṣàfihàn ìkọ̀sílẹ̀ rẹ̀ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.'
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: irú àṣẹ tí mo fi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìpìlẹ̀ tàbí àṣẹ tí ẹnì kan fi ń ṣe ohun kan, ó sì pa ìbéèrè “irú àṣẹ wo” mọ́.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ ti atọ́ka Gíríìkì mọ́, tí ó tọ́ka sí àwọn iṣẹ́ Jésù ní àyíká ọ̀rọ̀ náà.
- source_word: ποιῶ
  choice: mo fi ń ṣe
  rationale: Àmì “ń” fi ìṣe tí ó ń lọ tàbí tí ó jẹ́ àṣà hàn, ó sì bá present Gíríìkì mu lọ́nà Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti ìgbàlódé, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo present/future-like refusal “kì yóò sọ” nítorí pé ní Yorùbá, ó mú ìdáhùn Jésù pé òun kọ̀ láti fi àṣẹ náà hàn jáde lọ́nà àdánidá.
