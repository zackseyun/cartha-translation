id: MRK.11.11
reference: Mark 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: yo
  text: Ó sì wọ Jerúsálẹ́mù, ó wọ inú àgbàlá tẹ́ńpìlì[a]. Lẹ́yìn tí ó ti wo ohun gbogbo yíká, níwọ̀n bí ó ti pẹ́ gan-an[b], ó jáde lọ sí Bẹ́tánì pẹ̀lú àwọn méjìlá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àgbègbè tẹ́ńpìlì,” tàbí ní ṣókí, “tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ó ti pẹ́,” tàbí “níwọ̀n bí wákàtí náà ti pẹ́.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, àwọn ọmọ-ẹ̀yìn Jesu méjìlá.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ó wọ
  rationale: Ọ̀rọ̀ náà sọ ní tààrà nípa wíwọ inú ibì kan; “ó wọ” jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa ìṣípò ìtàn náà mọ́.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ìkọ̀wé orúkọ ìlú náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: τὸ ἱερόν
  choice: àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; “àgbàlá tẹ́ńpìlì” mú kí ibi tí gbogbo ènìyàn lè wọ̀ àti tí Jesu lè wò yíká hàn kedere.
- source_word: περιβλεψάμενος
  choice: lẹ́yìn tí ó sì wo ... yíká
  rationale: Ó fi hàn pé ó fara balẹ̀ wo àwọn ohun tó yí i ká, ó sì ṣẹlẹ̀ ṣáájú bí ó ṣe jáde lọ.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́ láì fi ohun tí kò sí nínú rẹ̀ kún un.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: nítorí ọjọ́ ti fẹ́rẹ̀ẹ́ lọ tán
  rationale: Gbólóhùn náà sọ àkókò tó ti pẹ́, ó sì lè jẹ́ ìdí tí Jesu fi jáde; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá tí ó pa ipa àkókò àti ìdí mọ́.
- source_word: ἐξῆλθεν
  choice: ó jáde lọ
  rationale: Ó pa ìtumọ̀ ìjáde kúrò ní ibẹ̀ àti lílọ sí ibi mìíràn mọ́.
- source_word: Βηθανίαν
  choice: Bẹ́tánì
  rationale: Èyí ni ìkọ̀wé orúkọ abúlé náà tí ó bá ìró Yorùbá mu.
- source_word: μετὰ τῶν δώδεκα
  choice: pẹ̀lú àwọn méjìlá
  rationale: Ó pa nọ́ńbà tí Gíríìkì lò mọ́, láì sọ ọ́ di oyè pàtó; àwọn ọmọ-ẹ̀yìn Jesu méjìlá ni ó ń tọ́ka sí.
theological_decisions:
- issue: Ohun tí τὸ ἱερόν ń tọ́ka sí
  choice: àgbàlá tẹ́ńpìlì, ìyẹn àgbègbè tẹ́ńpìlì ní gbòòrò
  alternative: tẹ́ńpìlì
  rationale: Ọ̀rọ̀ Gíríìkì ἱερόν yàtọ̀ sí ναός, ó sì ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀ dípò ibi mímọ́ inú rẹ̀ nìkan.
- issue: Bí a ṣe ń pe μετὰ τῶν δώδεκα
  choice: pẹ̀lú àwọn méjìlá
  alternative: pẹ̀lú Àwọn Méjìlá
  rationale: Gíríìkì kan fúnra rẹ̀ kò fi ìkọ̀wé olórí hàn; lílo lẹ́tà kékeré pa ọ̀rọ̀ nọ́ńbà náà mọ́, láì sẹ́ pé ẹgbẹ́ àwọn ọmọ-ẹ̀yìn Jesu ni.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì tẹ̀ lé ìṣísẹ̀ ìtàn Gíríìkì láì yanju àìdánilójú àkókò àti ìdí ju bó ṣe yẹ lọ.
