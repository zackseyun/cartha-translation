  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: yo
  text: Wọ́n sì sọ fún wọn gẹ́gẹ́ bí Jésù ti sọ; wọ́n sì jẹ́ kí wọ́n lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì yọ̀ǹda fún wọn” tàbí “wọ́n sì tú wọn sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífúnni láàyè, títú wọn sílẹ̀, tàbí jíjẹ́ kí ẹnì kan lọ; níbí, ó túmọ̀ sí pé àwọn tó dúró níbẹ̀ kò dá àwọn ọmọ-ẹ̀yìn dúró mọ́ láti mú ọmọ kẹ́tẹ́kẹ́tẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn ọmọ-ẹ̀yìn nínú àyíká ọ̀rọ̀; “sì” jẹ́ àsopọ̀ ìtàn tó bá Yorùbá àdánidá mu láì fi ìyàtọ̀ líle kún un.
- source_word: εἶπαν αὐτοῖς
  choice: sọ fún wọn
  rationale: Èyí túmọ̀ sí sísọ ọ̀rọ̀ sí àwọn ènìyàn náà ní tààrà; “sọ fún wọn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì wọ́pọ̀.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: gẹ́gẹ́ bí Jésù ti sọ
  rationale: “gẹ́gẹ́ bí” pa ìtumọ̀ ìbámu pẹ̀lú ohun tí Jésù ti sọ mọ́, “ti sọ” sì fi hàn pé ọ̀rọ̀ Jésù ti ṣáájú ìdáhùn wọn.
- source_word: ἀφῆκαν αὐτούς
  choice: wọ́n sì jẹ́ kí wọ́n lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé àwọn tó dúró níbẹ̀ kò dá àwọn ọmọ-ẹ̀yìn dúró mọ́, wọ́n sì yọ̀ǹda fún wọn láti mú ọmọ kẹ́tẹ́kẹ́tẹ́ náà lọ.
