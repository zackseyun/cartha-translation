revisions:
- from: Wọ́n sì dé Jerúsálẹ́mù. Nígbà tí ó wọ inú tẹ́ńpìlì[a], ó bẹ̀rẹ̀ sí í lé àwọn tí ń tà àti àwọn tí ń rà nínú tẹ́ńpìlì jáde; ó sì dojú àwọn tábìlì àwọn onípàṣípààrọ̀ owó àti àwọn àga àwọn tí ń ta àdàbà bolẹ̀.
  to: Wọ́n sì dé Jerúsálẹ́mù. Nígbà tí ó wọ inú tẹ́ńpìlì[a], ó bẹ̀rẹ̀ sí í lé àwọn tí ń tà àti àwọn tí ń rà nínú tẹ́ńpìlì jáde; ó sì yí àwọn tábìlì àwọn onípàṣípààrọ̀ owó àti àwọn àga àwọn tí ń ta àdàbà dojú bolẹ̀.
  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a rọ́pò ìkọ́lé ‘ó dojú ... bolẹ̀’ pẹ̀lú ‘ó yí ... dojú bolẹ̀.’ Èyí jẹ́ Yorùbá boṣewa tó dájú jù, ó sì ń tú κατέστρεψεν (‘ó yí/ó dojú bolẹ̀’) lọ́nà tó pé. Gbogbo àwọn ẹ̀yà ìtumọ̀, ìbáramu, àti àlàyé ìsàlẹ̀ míì ni a pa mọ́.'
  reviewer_model: gpt-5.6-terra
