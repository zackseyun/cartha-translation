id: MRK.11.15
reference: Mark 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: yo
  text: Wọ́n sì dé Jerúsálẹ́mù. Nígbà tí ó wọ inú tẹ́ńpìlì[a], ó bẹ̀rẹ̀ sí í lé àwọn tí ń tà àti àwọn tí ń rà nínú tẹ́ńpìlì jáde; ó sì yí àwọn tábìlì àwọn onípàṣípààrọ̀ owó àti àwọn àga àwọn tí ń ta àdàbà dojú bolẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àgbàlá tẹ́ńpìlì” tàbí “àgbègbè tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé
  rationale: A mú ọ̀rọ̀ ìṣe ìsinsìnyí inú ìtàn Gíríìkì wá sí àkókò tí ó ti kọjá ní Yorùbá, kí ìtàn náà lè ṣàn lọ́nà àdánidá; “dé” tún fi hàn pé wọ́n dé ibi náà.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọsílẹ̀ orúkọ ìlú náà tí ó wọ́pọ̀, tí a sì fi àmì ohùn Yorùbá sí.
- source_word: εἰσελθὼν
  choice: nígbà tí ó wọ inú
  rationale: Ọ̀rọ̀ yìí so wíwọlé rẹ̀ mọ́ ìṣe pàtàkì tó tẹ̀ lé e, láìfi àlàyé àkókò tó lágbára ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: tẹ́ńpìlì / nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè ilé Ọlọ́run, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; a pa ọ̀rọ̀ tí ó mọ́ni lára mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìwọ̀n rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: ἤρξατο ἐκβάλλειν
  choice: ó bẹ̀rẹ̀ sí í lé ... jáde
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe náà àti agbára ἐκβάλλω mọ́ ní Yorùbá àdánidá.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: àwọn tí ń tà àti àwọn tí ń rà
  rationale: Àwọn gbólóhùn aláìlórúkọ yìí pa ìṣe tó ń lọ lọ́wọ́ àti ìbáramu àwọn ẹgbẹ́ méjèèjì mọ́.
- source_word: κολλυβιστῶν
  choice: àwọn onípàṣípààrọ̀ owó
  rationale: Ó túmọ̀ sí àwọn tí iṣẹ́ wọn jẹ́ ṣíṣe pàṣípààrọ̀ owó; ìṣàpẹẹrẹ yìí ṣe kedere ní Yorùbá òde òní.
- source_word: καθέδρας
  choice: àwọn àga
  rationale: “Àga” jẹ́ ọ̀rọ̀ gbogbogbò tí kò sọ irú ohun ìjókòó kan pàtó ju Gíríìkì lọ.
- source_word: περιστερὰς
  choice: àdàbà
  rationale: “Àdàbà” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ẹyẹ tí a ń tà fún ẹbọ ní àyíká yìí.
- source_word: κατέστρεψεν
  choice: ó dojú ... bolẹ̀
  rationale: Gbólóhùn yìí fi ìṣe líle ti yíyí tábìlì àti àga ṣubú hàn lọ́nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n ibi tí ἱερόν ń tọ́ka sí nínú ìtàn yìí
  choice: A lo “tẹ́ńpìlì” nínú ẹsẹ̀, ṣùgbọ́n a ṣàlàyé pé gbogbo àgbègbè tẹ́ńpìlì ni.
  alternative: Àgbàlá tẹ́ńpìlì tàbí àgbègbè tẹ́ńpìlì
  rationale: ἱερόν lè gba gbogbo àgbègbè ilé Ọlọ́run, kì í ṣe ibi mímọ́ inú ilé náà nìkan. Àlàyé ìsàlẹ̀ ń dáàbò bo ìyàtọ̀ yìí láìsọ ẹsẹ̀ di líle láti kà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo “tẹ́ńpìlì” gẹ́gẹ́ bí ọ̀rọ̀ tó mọ́ni lára, pẹ̀lú àlàyé ìsàlẹ̀ láti ṣàfihàn ìtumọ̀ àgbègbè gbooro ti ἱερόν.
