id: MRK.11.2
reference: Mark 11:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ lọ sí abúlé tí ó wà ní òdìkejì yín. Ní kété tí ẹ bá wọ inú rẹ̀, ẹ ó rí ọmọ kẹ́tẹ́kẹ́tẹ́ kan[a] tí a dè mọ́lẹ̀, tí kò sí ènìyàn kankan tí ó tíì gùn rí.[b] Ẹ tú u, kí ẹ sì mú un wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì πῶλον lè túmọ̀ sí ọmọ ẹranko; nínú àyíká yìí, ó ń tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́ tí Jésù yóò gùn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “tí kò sí ẹnikẹ́ni nínú àwọn ènìyàn tí ó tíì jókòó lórí rẹ̀.” Ọ̀rọ̀ náà tẹnu mọ́ ọn pé kò sí ènìyàn kankan tí ó tíì gùn ún.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Ẹ lọ
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; ‘Ẹ lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìránṣẹ́ náà mu.
- source_word: κώμην
  choice: abúlé
  rationale: κώμη ń tọ́ka sí ìletò kékeré ju ìlú ńlá lọ; ‘abúlé’ ni ọ̀rọ̀ Yorùbá àdánidá fún un.
- source_word: τὴν κατέναντι ὑμῶν
  choice: tí ó wà ní òdìkejì yín
  rationale: Èyí pa ìtumọ̀ ibi tí ó dojú kọ́ wọn mọ́ ní Yorùbá tó ṣe kedere.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: Ní kété tí ẹ bá wọ inú rẹ̀
  rationale: Ìtumọ̀ àkókò náà ni pé ohun tí wọ́n máa rí yóò ṣẹlẹ̀ bí wọ́n ṣe wọlé; ìṣètò yìí jẹ́ àdánidá ní Yorùbá.
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́ kan
  rationale: πῶλος lè túmọ̀ sí ọmọ ẹranko, ṣùgbọ́n àyíká ìṣẹ̀lẹ̀ yìí fi hàn pé ọmọ kẹ́tẹ́kẹ́tẹ́ ni; àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δεδεμένον
  choice: tí a dè mọ́lẹ̀
  rationale: Perfect passive participle náà ṣàpèjúwe ẹranko tí ó wà ní ipò dídè; ‘dè mọ́lẹ̀’ jẹ́ ọ̀rọ̀ àdánidá fún ẹranko tí a so sí ibì kan.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: tí ẹnikẹ́ni kò tíì gùn rí
  rationale: Nípa ẹranko tí a ó gùn, ‘gùn’ mú ìtumọ̀ ἐκάθισεν jáde lọ́nà àdánidá; ‘ẹnikẹ́ni’ tọ́ka sí ènìyàn, ‘kò tíì … rí’ sì pa οὔπω mọ́.
- source_word: λύσατε
  choice: Ẹ tú u
  rationale: Àṣẹ náà ni kí wọ́n tú ohun tí a fi dè é; èyí ṣe kedere ní Yorùbá.
- source_word: φέρετε
  choice: kí ẹ sì mú un wá
  rationale: ‘Mú un wá’ pa ìtumọ̀ gbòòrò φέρω mọ́ láì fi kún un pé wọ́n gbé e tàbí wọ́n fà á.
theological_decisions:
- issue: Ẹranko tí πῶλον ń tọ́ka sí
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́
  alternative: ọmọ ẹranko
  rationale: Àyíká ìwọlé Jésù àti ìlò ọ̀rọ̀ náà ní ìtàn yìí ṣe atilẹyin ‘ọmọ kẹ́tẹ́kẹ́tẹ́,’ ṣùgbọ́n a jẹ́ kí àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lè gbòòrò sí ọmọ ẹranko.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo ‘gùn’ dípò ìtumọ̀ gígùn ‘jókòó lé’ nítorí pé ẹranko ni a ń sọ̀rọ̀ nípa rẹ̀.
