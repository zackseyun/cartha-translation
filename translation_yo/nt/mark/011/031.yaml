id: MRK.11.31
reference: Mark 11:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: yo
  text: Wọ́n sì ń gbèrò láàárín ara wọn pé, “Kí ni kí a sọ? Bí a bá sọ pé, ‘Láti ọ̀run ni,’[a] yóò sọ pé, ‘Èé ṣe nígbà náà tí ẹ kò gba a gbọ́?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Láti ọ̀run” jẹ́ ọ̀nà ọ̀wọ̀ tí àwọn Júù fi ń sọ pé “láti ọ̀dọ̀ Ọlọ́run” tàbí pé ohun náà ní ìpilẹ̀ láti ọ̀dọ̀ Ọlọ́run.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: ń gbèrò
  rationale: Ọ̀rọ̀ yìí fi ìgbèrò tí ó ń lọ lọ́wọ́ hàn; ‘ń gbèrò’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìfọ̀rọ̀wérọ̀ àti ìṣírò ọ̀nà ìdáhùn mọ́.
- source_word: πρὸς ἑαυτοὺς
  choice: láàárín ara wọn
  rationale: Ó tọ́ka sí ìfọ̀rọ̀wérọ̀ àwọn ọmọ ẹgbẹ́ náà pẹ̀lú ara wọn, kì í ṣe pé ẹnì kọ̀ọ̀kan ń ronú nínú ara rẹ̀ nìkan.
- source_word: λέγοντες
  choice: pé
  rationale: ‘Pé’ ṣe àgbékalẹ̀ ọ̀rọ̀ tí ó tẹ̀ lé e ní Yorùbá lọ́nà tí ó rọrùn, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo participle ‘ní sísọ.’
- source_word: Τί εἴπωμεν;
  choice: Kí ni kí a sọ?
  rationale: Èyí fi ìbéèrè ìgbèrò hàn—ìyẹn, irú ìdáhùn wo ni ó yẹ kí wọ́n fún un—ní èdè Yorùbá ti òde òní.
- source_word: ἐὰν εἴπωμεν
  choice: Bí a bá sọ pé
  rationale: Ó ṣe àfihàn gbólóhùn oníṣ条件 ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: Ἐξ οὐρανοῦ
  choice: Láti ọ̀run ni
  rationale: Ó pa àwòrán àti ọ̀rọ̀ orísun mọ́, láì fi ‘lọ́dọ̀ Ọlọ́run’ rọ́pò rẹ̀ nínú ẹsẹ̀ náà.
- source_word: ἐρεῖ
  choice: yóò sọ pé
  rationale: Èyí tú ọ̀rọ̀ ọjọ́ iwájú náà tààrà, ó sì ṣí ọ̀nà fún ìbéèrè tí ó tẹ̀ lé e.
- source_word: Διὰ τί οὖν
  choice: Èé ṣe nígbà náà
  rationale: '‘Nígbà náà’ pa ìsopọ̀ ìmọ̀ràn náà mọ́: bí ìdáhùn yẹn bá jẹ́ òtítọ́, kí ló dé tí wọ́n kò fi ṣe ohun tí ó yẹ?'
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ẹ kò fi gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: Pisteuō pẹ̀lú dative níbí túmọ̀ sí gbígba ẹni náà tàbí ẹ̀rí rẹ̀ gbọ́. ‘Gba ọ̀rọ̀ rẹ̀ gbọ́’ yà kúrò ní ‘gbà á gbọ́’ tí ó lè dà bí ìgbàgbọ́ sínú ẹni ní ìtumọ̀ ẹ̀sìn tó lágbára ju ohun tí ọ̀rọ̀ Gíríìkì níbí ń béèrè lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘láti ọ̀run’ nípa ìrìbọmi tàbí àṣẹ Jòhánù
  choice: Fi àṣà ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ‘Láti ọ̀run ni’ nínú ẹsẹ̀
  alternative: ‘Láti ọ̀dọ̀ Ọlọ́run ni’ tàbí ‘Ọlọ́run ló rán an’
  rationale: ‘Ọ̀run’ jẹ́ ọ̀nà ọ̀wọ̀ tí àwọn Júù fi ń tọ́ka sí Ọlọ́run tàbí ohun tí ó ní ìpilẹ̀ ọ̀run. Dídá ọ̀rọ̀ orísun náà dúró pa ìfarapamọ́ ọ̀wọ̀ àti agbára àríyànjiyàn náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé ń ṣàlàyé ìtumọ̀ rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó sì ní iyì. A lo ‘ń gbèrò láàárín ara wọn’ láti mú ìjíròrò tí ń lọ lọ́wọ́ hàn, a sì lo ‘gba ọ̀rọ̀ rẹ̀ gbọ́’ láti mú kedere pé ẹ̀rí Jòhánù ni wọ́n kọ̀ láti tẹ́wọ́ gbà. Àmì ìsàlẹ̀ ojú-ewé [a] wà lẹ́yìn gbólóhùn náà, ó sì ń tọ́ka sí ‘Láti ọ̀run.’
