source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: yo
  text: Ó sì dáhùn, ó wí fún igi náà pé, “Kí ẹnikẹ́ni má ṣe jẹ èso lára rẹ mọ́ láéláé.” Àwọn ọmọ-ẹ̀yìn rẹ̀ sì ńgbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “Àwọn ọmọ-ẹ̀yìn rẹ̀ sì gbọ́ ọ̀rọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Ó sì dáhùn
  rationale: Ó pa àṣà ìtàn Gíríìkì náà mọ́, níbi tí ‘dáhùn’ ti lè farahàn láìsí ọ̀rọ̀ tí ẹnikẹ́ni sọ ṣáájú; ó sì jẹ́ Yorùbá àdánidá.
- source_word: αὐτῇ
  choice: fún igi náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí igi ọ̀pọ̀tọ́; pípe igi náà ní kedere yàgò fún àìmọ̀ye ní Yorùbá.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: má ṣe ... mọ́ láéláé
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi hàn pé kí jíjẹ èso lára igi náà dópin títí láéláé, láìsọ agbára ọ̀rọ̀ náà di aláìlágbára.
- source_word: ἐκ σοῦ
  choice: lára rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé èso wá láti ara igi, ó sì pa ìtọ́kasí ẹni kejì mọ́ nínú ọ̀rọ̀ tí Jésù bá igi náà sọ.
- source_word: μηδεὶς
  choice: ẹnikẹ́ni má ṣe
  rationale: Pẹ̀lú ‘kí,’ èyí ń gbé ìfẹ́ tàbí ègún tí kò jẹ́ kí ẹnikẹ́ni ṣe ohun náà jáde lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: καρπὸν
  choice: èso
  rationale: ‘Èso’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún èso igi ọ̀pọ̀tọ́.
- source_word: φάγοι
  choice: Kí ... má ṣe jẹ
  rationale: Ìṣesí optative náà ń sọ ìfẹ́ tàbí ìkéde ègún, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú lásán; ìkọ̀lé ‘Kí ... má ṣe’ pa agbára yẹn mọ́.
- source_word: ἤκουον
  choice: ń gbọ́
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú imperfect Gíríìkì ni a fi ‘ń gbọ́’ hàn. Ó tún lè túmọ̀ sí pé wọ́n gbọ́ ọ̀rọ̀ náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ kan.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún gbólóhùn ohun-ìní náà.
theological_decisions:
- issue: Ìwà ọ̀rọ̀ tí Jésù sọ sí igi ọ̀pọ̀tọ́
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkéde ègún tàbí ìfẹ́ pé kí ẹnikẹ́ni má ṣe jẹ èso lára rẹ̀ mọ́.
  alternative: A lè sọ ọ́ bí àsọtẹ́lẹ̀ pé, ‘Ẹnikẹ́ni kì yóò jẹ èso lára rẹ mọ́ láéláé.’
  rationale: φάγοι jẹ́ optative tó ní agbára ìfẹ́ tàbí ègún, kì í ṣe future indicative. Ìkọ̀lé ‘Kí ... má ṣe’ jẹ́ kí ìtumọ̀ yẹn dúró láìyanju ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó ní iyì ṣùgbọ́n tó ṣeé lóye. ‘Ó sì dáhùn’ pa àwọ̀n ìtàn Gíríìkì mọ́; ‘Kí ... má ṣe’ sì fi agbára optative hàn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó kan ἤκουον.
