source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ní, ‘Láti ọ̀dọ̀ àwọn ènìyàn ni?’—wọ́n bẹ̀rù ogunlọ́gọ̀ náà, nítorí gbogbo ènìyàn gbà pé Johanu jẹ́ wòlíì ní tòótọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú Gíríìkì náà sí, “nítorí gbogbo ènìyàn ka Johanu sí wòlíì ní ti gidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Ṣùgbọ́n bí a bá ní
  rationale: Ó pa ìyàtọ̀ àti ìrònú àṣàyàn inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: Ἐξ ἀνθρώπων
  choice: Láti ọ̀dọ̀ àwọn ènìyàn ni
  rationale: Ó túmọ̀ orísun tó jẹ́ ti ènìyàn ní tààrà, láì fi ìtumọ̀ àlàyé ‘ó pilẹ̀ láti ọ̀dọ̀ ènìyàn’ sínú ọ̀rọ̀ pàtàkì.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: ẹ̀rù àwọn ènìyàn náà ń bà wọ́n
  rationale: Àkókò imperfect náà fi ìbẹ̀rù tí ó ń bá a lọ hàn; ‘àwọn ènìyàn náà’ tọ́ka sí ogunlọ́gọ̀ tó wà níbẹ̀ ní èdè Yorùbá tó rọrùn.
- source_word: ἅπαντες γὰρ εἶχον
  choice: nítorí gbogbo ènìyàn gbà pé
  rationale: ‘Gbà pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n di èrò kan mú, γὰρ sì ń fúnni ní ìdí.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: Johanu jẹ́ wòlíì ní tòótọ́
  rationale: Ó pa agbára ὄντως mọ́, ó sì fi ìdánilójú àwọn ènìyàn nípa ipò Johanu gẹ́gẹ́ bí wòlíì hàn.
theological_decisions:
- issue: Orísun ìbatisí tàbí àṣẹ Johanu nínú Ἐξ ἀνθρώπων
  choice: Láti ọ̀dọ̀ àwọn ènìyàn ni
  alternative: Ó pilẹ̀ láti ọ̀dọ̀ ènìyàn
  rationale: Àṣàyàn pàtàkì náà pa àwòrán ‘láti ọ̀dọ̀’ àti ìyàtọ̀ láàárín orísun ọ̀run àti orísun ènìyàn mọ́; àyípadà kejì jẹ́ àlàyé díẹ̀ sí i.
- issue: Agbára ὄντως nínú èrò ogunlọ́gọ̀ nípa Johanu
  choice: gbà pé Johanu jẹ́ wòlíì ní tòótọ́
  alternative: ka Johanu sí wòlíì ní ti gidi
  rationale: Ó jẹ́ kí gbólóhùn náà dúró gẹ́gẹ́ bí ohun tí gbogbo ènìyàn gbà, kì í ṣe ìdájọ́ tuntun láti ọ̀dọ̀ akọ̀ròyìn, ó sì pa ìtẹnumọ́ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún olùkà òde òní. A lo ‘Johanu’ àti ‘wòlíì’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀.
