  text: ⸂καὶ πολλοὶ⸃ τὰ ἱμάτια αὐτῶν ἔστρωσαν εἰς τὴν ὁδόν, ἄλλοι δὲ στιβάδας ⸂κόψαντες ἐκ τῶν ἀγρῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì tẹ́ aṣọ àwọ̀lékè wọn sí ojú ọ̀nà, àwọn mìíràn sì tẹ́ àwọn ẹ̀ka ewé tí wọ́n gé láti inú oko sí ojú ọ̀nà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “ewé tí wọ́n gé”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àkójọpọ̀ ewéko tàbí àwọn ẹ̀ka ewé, kò sì sọ ní pàtó pé ẹ̀ka ọ̀pẹ ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó sọ iye ènìyàn lọ́nà tó ṣe kedere, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἱμάτια
  choice: aṣọ àwọ̀lékè
  rationale: Nínú ìṣẹ̀lẹ̀ yìí, ọ̀rọ̀ náà tọ́ka sí aṣọ òde tí wọ́n bọ́ tí wọ́n sì tẹ́ sí ojú ọ̀nà.
- source_word: ἔστρωσαν
  choice: tẹ́ ... sí
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí títẹ́ tàbí títú ohun ká sórí ilẹ̀; gbólóhùn yìí bá aṣọ àti ewé mu ní Yorùbá.
- source_word: εἰς τὴν ὁδόν
  choice: sí ojú ọ̀nà
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe στρώννυμι, ìtumọ̀ àdánidá ni pé wọ́n tẹ́ àwọn nǹkan náà sórí ojú ọ̀nà.
- source_word: ἄλλοι δὲ
  choice: àwọn mìíràn sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tó ń fi ẹgbẹ́ kejì kún àkọ́kọ́ láìsọ ìyàtọ̀ náà di líle.
- source_word: στιβάδας
  choice: ẹ̀ka ewé
  rationale: στιβάς lè tọ́ka sí àkójọpọ̀ ewé, koríko tàbí ẹ̀ka tí a gé; ‘ẹ̀ka ewé’ fi àwòrán ewéko tí wọ́n tẹ́ sílẹ̀ hàn láìsọ pé ẹ̀ka ọ̀pẹ ni.
- source_word: κόψαντες
  choice: tí wọ́n gé
  rationale: Ó fi hàn pé gígé náà ti ṣẹlẹ̀ ṣáájú títẹ́ wọn sí ojú ọ̀nà, ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἐκ τῶν ἀγρῶν
  choice: láti inú oko
  rationale: ἀγροί lè túmọ̀ sí oko tàbí ilẹ̀ ìgbèríko; ‘inú oko’ bá ibi tí wọ́n ti gé ewéko náà mu ní tààrà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún; ‘aṣọ àwọ̀lékè’ yà aṣọ òde sọ́tọ̀, ‘ẹ̀ka ewé’ sì pa ìwọ̀n ìtumọ̀ στιβάδας mọ́ láìgbé àlàyé inú Jòhánù wọ inú Máàkù.
