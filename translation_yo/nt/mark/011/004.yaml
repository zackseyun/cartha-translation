base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: yo
  text: Wọ́n sì lọ, wọ́n sì rí ọmọ kẹ́tẹ́kẹ́tẹ́ kan tí a dè ní ẹ̀gbẹ́ ilẹ̀kùn, níta ní ojú ọ̀nà[a]; wọ́n sì tú u.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ẹ̀gbẹ́ ilẹ̀kùn níta lẹ́gbẹ̀ẹ́ ọ̀nà.” Gbólóhùn Gíríìkì náà lè ní ìtẹnumọ́ ipò tó yà díẹ̀ síra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: wọ́n lọ
  rationale: Ó sọ pé wọ́n kúrò níbi tí Jésù ti fún wọn ní àṣẹ; ‘wọ́n lọ’ jẹ́ ọ̀rọ̀ àkọsílẹ̀ ìtàn tó ṣe déédé ní Yorùbá.
- source_word: εὗρον
  choice: wọ́n rí
  rationale: Èyí ni ìtumọ̀ tó rọrùn, tó sì bá ìtàn mu fún εὑρίσκω ní àyíká yìí.
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́
  rationale: πῶλος túmọ̀ sí ọmọ ẹranko; àyíká ẹsẹ tó ṣáájú fi hàn pé ọmọ kẹ́tẹ́kẹ́tẹ́ ni. Yíyan èyí mú kí Yorùbá ṣe kedere láìlo ọ̀rọ̀ àjèjì.
- source_word: δεδεμένον
  choice: tí a dè
  rationale: Apá-ọrọ̀ perfect passive náà ṣàpèjúwe bí ẹranko náà ṣe wà nígbà tí wọ́n rí i; ‘tí a dè’ jẹ́ ọ̀rọ̀ àdánidá fún ìdè ẹranko.
- source_word: πρὸς θύραν
  choice: sí ẹ̀gbẹ́ ilẹ̀kùn
  rationale: πρός pẹ̀lú accusative níbí tọ́ka sí ìsúnmọ́ tàbí ipò lẹ́gbẹ̀ẹ́ ilẹ̀kùn; ‘sí ẹ̀gbẹ́ ilẹ̀kùn’ fi èyí hàn ní Yorùbá.
- source_word: ἔξω
  choice: níta
  rationale: Ó fi hàn pé ibi náà wà ní ẹ̀yìn odi tàbí ní ìta, kì í ṣe nínú ilé.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: ní ojú ọ̀nà
  rationale: ἄμφοδον lè jẹ́ òpópónà, ọ̀nà kékeré, tàbí ààyè ìkọjá; ‘ní ojú ọ̀nà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ṣùgbọ́n a pa ìyàtọ̀ ìtumọ̀ ipò mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: λύουσιν αὐτόν
  choice: wọ́n sì tú un
  rationale: Bó tilẹ̀ jẹ́ pé λύουσιν jẹ́ historical present, Yorùbá ìtàn gba àkókò ìṣe tó bá ìṣàn ìtàn mu; ‘tú un’ ni ọ̀rọ̀ tó yẹ fún yíyọ ìdè ẹranko.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ìgbà òde, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọmọ kẹ́tẹ́kẹ́tẹ́’ dípò ọ̀rọ̀ tí ó lè ṣókùnkùn, níwọ̀n bí àyíká tó sún mọ́ ẹsẹ yìí ti dá irú ẹranko náà mọ̀.
