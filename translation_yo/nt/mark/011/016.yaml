  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: yo
  text: Kò sì jẹ́ kí ẹnikẹ́ni gbé ohun kan gba inú agbègbè tẹ́ńpìlì kọjá.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba inú àgbàlá tẹ́ńpìlì kọjá.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbé ohun èlò kan” tàbí “gbé ohun ìkó-nǹkan kan.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbòòrò, kò sì sọ irú ohun tí ó jẹ́ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: kò sì jẹ́ kí
  rationale: Ọ̀rọ̀-ìṣe àìpé yìí fi hàn pé ó ń bá a lọ láti má ṣe gba wọn láàyè; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún ìdènà tí ń bá a lọ.
- source_word: ἵνα τις διενέγκῃ
  choice: kí ẹnikẹ́ni gbé ... gba ... kọjá
  rationale: Lẹ́yìn ἤφιεν, ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́ṣẹ̀ sọ ohun tí kò gbà láàyè; ìṣètò ‘jẹ́ kí ẹnikẹ́ni’ mú èyí jáde lọ́nà Yorùbá tó ṣe kedere.
- source_word: διενέγκῃ
  choice: gbé ... gba ... kọjá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ohun láti ibì kan sí ibòmíràn nípasẹ̀ agbègbè kan; ‘gba ... kọjá’ pa ìtọ́sọ́nà náà mọ́.
- source_word: σκεῦος
  choice: ohun èlò kan
  rationale: σκεῦος jẹ́ ọ̀rọ̀ gbòòrò fún ohun kan, ohun èlò, tàbí ohun ìkó-nǹkan; ‘ohun èlò’ kò fi irú ohun náà múlẹ̀ ju bí orísun ṣe sọ lọ.
- source_word: διὰ τοῦ ἱεροῦ
  choice: gba inú àgbàlá tẹ́ńpìlì kọjá
  rationale: ἱερόν tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú lọ́hùn-ún nìkan; ‘àgbàlá tẹ́ńpìlì’ jẹ́ kó yé òǹkàwé pé agbègbè gbangba inú àyíká tẹ́ńpìlì ni.
theological_decisions:
- issue: Ìtumọ̀ ἱερόν ní ìbámu pẹ̀lú tẹ́ńpìlì Jerúsálẹ́mù
  choice: gbogbo agbègbè tẹ́ńpìlì, tí a túmọ̀ sí ‘àgbàlá tẹ́ńpìlì’
  alternative: ‘tẹ́ńpìlì’ tàbí ‘agbègbè tẹ́ńpìlì’
  rationale: Yíyan ‘àgbàlá tẹ́ńpìlì’ yà ἱερόν sí ọ̀tọ̀ kúrò ní ναός, ibi mímọ́ inú tẹ́ńpìlì, láìfi ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀, ‘ohun èlò’ sì pa àìdájú σκεῦος mọ́.
