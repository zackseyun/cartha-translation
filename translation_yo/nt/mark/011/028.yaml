id: MRK.11.28
reference: Mark 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: yo
  text: Wọ́n sì ń sọ fún un pé, “Àṣẹ wo ni o fi ń ṣe àwọn nǹkan wọ̀nyí?[a] Tàbí ta ni ó fún ọ ní àṣẹ yìí láti ṣe àwọn nǹkan wọ̀nyí?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì: “Nínú àṣẹ wo ni o ń ṣe àwọn nǹkan wọ̀nyí?”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí o lè ṣe àwọn nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ fún un pé
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń tẹ̀ síwájú nínú bíbéèrè; ‘ń sọ’ pa ìrísí yìí mọ́ ní Yorùbá.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Àṣẹ wo ni o fi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ìpìlẹ̀ tàbí orísun ẹ̀tọ́ tí ẹni kan fi ń ṣe ohun kan, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ lè túmọ̀ sí agbára tàbí ẹ̀tọ́ tí a fúnni láti ṣe ohun kan, ó sì bá ìpèníjà àwọn aṣáájú nípa ẹ̀tọ́ Jésù mu.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: ń ṣe àwọn nǹkan wọ̀nyí / láti ṣe àwọn nǹkan wọ̀nyí
  rationale: A pa ọ̀pọ̀ ‘ταῦτα’ mọ́ gẹ́gẹ́ bí ‘àwọn nǹkan wọ̀nyí,’ nítorí ó lè tọ́ka sí gbogbo ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe àti ohun tí ó ń kọ́ni.
- source_word: ἢ
  choice: Tàbí
  rationale: Ó mú ìbéèrè kejì wọlé gẹ́gẹ́ bí ọ̀nà míì láti sọ ìpèníjà kan náà.
- source_word: τίς σοι ἔδωκεν
  choice: ta ni ó fún ọ
  rationale: Ó fi ìbéèrè tààrà nípa ẹni tí ó fún Jésù ní àṣẹ hàn, ó sì pa àkókò ohun tí ó ti ṣẹlẹ̀ mọ́.
- source_word: ἵνα ταῦτα ποιῇς
  choice: láti ṣe àwọn nǹkan wọ̀nyí
  rationale: ‘Láti ṣe’ jẹ́ ọ̀nà Yorùbá àdánidá lẹ́yìn ‘fún ọ ní àṣẹ,’ ó sì gbé ète tàbí ohun tí àṣẹ náà fún un láyè láti ṣe jáde.
theological_decisions:
- issue: Irú àti orísun àṣẹ Jésù
  choice: A túmọ̀ ìbéèrè náà láìsọ pé àṣẹ náà wá láti ọ̀dọ̀ Ọlọ́run tàbí láti orísun mìíràn.
  alternative: A lè túmọ̀ ọ̀rọ̀ náà ní ọ̀nà tí yóò fi ‘àṣẹ láti ọ̀dọ̀ Ọlọ́run’ hàn gbangba.
  rationale: Ẹsẹ yìí ń ṣe àkọsílẹ̀ ìpèníjà àwọn olórí, kì í ṣe ìdáhùn onítàn sí i; nítorí náà, ó yẹ kí ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanjú rẹ̀ sínú ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Àṣẹ wo ni o fi’ jẹ́ èdè àdánidá fún ìpèníjà ẹ̀tọ́ ẹni láti ṣe ohun kan; a tún pa àtúnṣe ìbéèrè kejì àti ìrísí ọ̀rọ̀-ìṣe àìpé mọ́.
