id: MRK.11.9
reference: Mark 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: yo
  text: Àwọn tí ń lọ níwájú àti àwọn tí ń tọ̀ lẹ́yìn sì ń ké jáde pé,[b] “Hósánà![a] Ìbùkún ni fún ẹni tí ń bọ̀ ní orúkọ Olúwa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hósánà” jẹ́ igbe ìjọsìn láti inú èdè Hébérù/Árámáíkì, tí ìtumọ̀ rẹ̀ jọ “gbà wá là, jọ̀wọ́” tàbí “gbà wá là nísinsìnyí”; ṣùgbọ́n níhìn-ín, ó tún ń ṣiṣẹ́ gẹ́gẹ́ bí igbe ìyìn.
    reason: lexical_alternative
  - marker: b
    text: Ìkéde yìí ń ṣe ìrántí Sáàmù 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: àwọn tí ń lọ níwájú
  rationale: Ó fi ẹgbẹ́ àwọn tí ń lọ níwájú nínú ìrìn náà hàn, ó sì pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: οἱ ἀκολουθοῦντες
  choice: àwọn tí ń tọ̀ lẹ́yìn
  rationale: Ó bá ọ̀rọ̀ ìṣáájú mu, ó sì ṣàpèjúwe àwọn ènìyàn tí wọ́n ń bọ̀ lẹ́yìn.
- source_word: ἔκραζον
  choice: ń ké jáde pé
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka sí igbe tí ó ń bá a lọ tàbí tí a ń tún ṣe; ‘ń ké jáde’ mú èyí àti ìkéde ní gbangba hàn.
- source_word: Ὡσαννά
  choice: Hósánà
  rationale: A pa igbe ìjọsìn Hébérù/Árámáíkì náà mọ́ ní àkọsílẹ̀-ohùn nítorí pé ó ti ń ṣiṣẹ́ gẹ́gẹ́ bí ẹ̀bẹ̀ àti igbe ìyìn; àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: Εὐλογημένος
  choice: Olùbùkún ni
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ìkéde ìbùkún yìí, ó sì pa ìró Sáàmù 118:26 mọ́.
- source_word: ὁ ἐρχόμενος
  choice: ẹni tí ń bọ̀
  rationale: Ó tú participle tí ó ní article náà sí Yorùbá àdánidá láì fi oyè Mèsáyà kún un.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Ó pa àpólà Bíbélì náà mọ́, èyí tí ó lè túmọ̀ sí wíwá lábẹ́ àṣẹ tàbí gẹ́gẹ́ bí aṣojú Olúwa.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún κύριος nínú àyọkà Sáàmù yìí.
theological_decisions:
- issue: Bóyá kí a sọ ìdánimọ̀ Mèsáyà di mímọ́ gbangba nínú ìtumọ̀ náà
  choice: A pa ọ̀rọ̀ àyọkà náà mọ́ pé, ‘Olùbùkún ni ẹni tí ń bọ̀ ní orúkọ Olúwa,’ láì fi ‘Mèsáyà’ tàbí ‘ọba’ kún un.
  alternative: ‘Olùbùkún ni Mèsáyà tí ń bọ̀ ní orúkọ Olúwa.’
  rationale: Ọ̀rọ̀ àwọn ènìyàn náà ń ṣe ìrántí Sáàmù 118:26, ó sì ní ìtumọ̀ ti Mèsáyà nínú àyíká rẹ̀; ṣùgbọ́n Gíríìkì kò fi oyè bẹ́ẹ̀ sínú ẹsẹ yìí. Fífi ọ̀rọ̀ Ìwé Mímọ́ náà sílẹ̀ bí ó ti rí pa agbára ẹ̀kọ́ rẹ̀ mọ́ láì fi ìtumọ̀ àfikún wọlé.
translation_notes:
  register: Yorùbá àdánidá, ọlọ́lá, tí òǹkàwé òde òní lè lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn àpólà ‘àwọn tí ń lọ níwájú’ àti ‘àwọn tí ń tọ̀ lẹ́yìn’ pa ìfararora àwọn participle Gíríìkì mọ́. ‘Ń ké jáde’ jẹ́ kí ìṣe tí ó ń bá a lọ hàn. A kọ Hósánà pẹ̀lú àmì ohùn Yorùbá, a sì ṣàlàyé gbòǹgbò àti iṣẹ́ rẹ̀ ní àlàyé ìsàlẹ̀.
