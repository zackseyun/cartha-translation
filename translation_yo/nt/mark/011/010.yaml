source:
  edition: SBLGNT
  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: yo
  text: Ìbùkún ni fún ìjọba tí ń bọ̀ ti Dáfídì, baba wa! Hòsánná ní ibi gíga jù lọ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Hòsánná” lè ní ìtumọ̀ ẹ̀bẹ̀ náà pé, “Jọ̀wọ́, gbà là,” tàbí “Gbà là nísinsìnyí”; ṣùgbọ́n níbí, ó jẹ́ ìkéde ìyìn nínú ìjọsìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Alábùkún ni
  rationale: Ó mú àkíyèsí ìbùkún inú ìhó ayọ̀ náà jáde ní ọ̀nà àdánidá ní Yorùbá, láì dín in kù sí ‘ìyìn’ nìkan.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: ìjọba tí ń bọ̀
  rationale: Gbólóhùn ìṣe ‘tí ń bọ̀’ pa agbára present participle mọ́, ó sì ṣe kedere pé ìjọba náà ń bọ̀.
- source_word: βασιλεία
  choice: ìjọba
  rationale: ‘Ìjọba’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì bá àyíká ìjọba ọba ti Dáfídì mu ju ṣíṣe àlàyé rẹ̀ sí ‘ìṣàkóso’ lọ.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: ti Dáfídì baba wa
  rationale: Ó pa ìtumọ̀ baba ńlá tí a bọ̀wọ̀ fún mọ́, ó sì so ìjọba náà mọ́ Dáfídì ní kedere.
- source_word: Ὡσαννὰ
  choice: Hòsánná
  rationale: A pa á mọ́ gẹ́gẹ́ bí ìhó ìjọsìn tí ó ti di ọ̀rọ̀ àkànṣe; àlàyé ìtumọ̀ ẹ̀bẹ̀ tó wà lẹ́yìn rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν τοῖς ὑψίστοις
  choice: ní ibi gíga jù lọ
  rationale: Ó tẹ̀ lé àwòrán ibi gíga tí Gíríìkì ní, láì fi ‘ọ̀run’ kún un nípasẹ̀ ìtumọ̀.
theological_decisions:
- issue: Ìhó ayọ̀ nípa ìjọba Dáfídì
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ìbùkún fún ìjọba Dáfídì tí ń bọ̀.
  alternative: Kí a fi ‘ìjọba Mèsáyà’ sínú ọ̀rọ̀ náà.
  rationale: Àyíká náà ń tọ́ka sí ìrètí Mèsáyà, ṣùgbọ́n Gíríìkì kò lo ọ̀rọ̀ ‘Mèsáyà’; nítorí náà, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ pàtó náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A yan ìtòlẹ́sẹẹsẹ ‘ìjọba tí ń bọ̀ ti Dáfídì baba wa’ láti jẹ́ kedere pé ‘tí ń bọ̀’ ń ṣàpèjúwe ìjọba, kì í ṣe Dáfídì.
