id: MRK.11.23
reference: Mark 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: yo
  text: “Lóòótọ́ ni mo sọ fún yín pé, ẹnikẹ́ni tí ó bá sọ fún òkè yìí pé, ‘Kí a gbé e sókè, kí a sì sọ ọ sínú òkun,’ tí kò sì ṣiyèméjì nínú ọkàn rẹ̀[a], ṣùgbọ́n tí ó gbàgbọ́ pé ohun tí òun ń sọ ń ṣẹlẹ̀[b], ohun tí ó sọ yóò ṣẹlẹ̀ fún un.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí kò fọkàn méjì” tàbí “tí ọkàn rẹ̀ kò pín sí méjì”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìpínyà inú ọkàn, kì í ṣe ṣíṣiyèméjì nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “pé ohun tí òun ń sọ máa ń ṣẹlẹ̀” tàbí “ń wá sí ìmúṣẹ.” Ọ̀rọ̀ Gíríìkì náà lo ìṣe ìsinsìnyí (“ń ṣẹlẹ̀” tàbí “máa ń ṣẹlẹ̀”) ṣáájú gbólóhùn àbájáde ọjọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ọ̀rọ̀ ìṣáájú ọ̀wọ̀ yìí jẹ́ ìmúdájú ọ̀rọ̀ ní ẹnu Jésù; ‘Lóòótọ́ ni’ mú agbára rẹ̀ jáde ní Yorùbá àdánidá, nígbà tí ‘mo sọ fún yín’ pa ìtọ́kasí tààrà mọ́.
- source_word: ὃς ἂν εἴπῃ
  choice: ẹnikẹ́ni tí ó bá sọ
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń tọ́ka sí ẹni àìdánimọ̀ ní ipò gbogbogbò; ‘ẹnikẹ́ni tí ó bá sọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: τῷ ὄρει τούτῳ
  choice: fún òkè yìí
  rationale: ‘Òkè’ ni ìtumọ̀ àdánidá fún ὄρος, ‘yìí’ sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Kí a gbé ọ sókè, kí a sì sọ ọ sínú òkun
  rationale: Ilana ‘kí a … ọ’ fi ìṣe tí a ṣe sí olùgbà hàn ní Yorùbá, ó sì pa àwòrán gbígbé òkè sókè àti sísọ ọ́ sínú òkun mọ́.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: tí kò sì ṣiyèméjì nínú ọkàn rẹ̀
  rationale: Nínú àyíká yìí, διακριθῇ lè túmọ̀ sí ṣíṣiyèméjì tàbí yíyẹ̀ láàárín èrò méjì. ‘Ṣiyèméjì’ ṣe kedere, ẹsẹ̀-àlàyé sì pa ìtumọ̀ míì mọ́.
- source_word: πιστεύῃ
  choice: tí ó gbàgbọ́
  rationale: ‘Gbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá πιστεύω mu nínú àyíká yìí.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: pé ohun tí òun ń sọ ń ṣẹlẹ̀
  rationale: Àmì ìṣe ‘ń’ pa ìṣe ìsinsìnyí γίνεται mọ́, dípò kí a sọ ọ́ di ọjọ́ iwájú láìjẹ́ dandan. ‘Òun’ tún mú kí ó ṣe kedere pé ọ̀rọ̀ ẹni náà ni a ń tọ́ka sí.
- source_word: ἔσται αὐτῷ
  choice: yóò rí bẹ́ẹ̀ fún un
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì tó ṣí sílẹ̀ mọ́, láìfi ọ̀nà tàbí ìlànà bí ohun náà yóò ṣe ṣẹlẹ̀ kun un.
theological_decisions:
- issue: Irú ìlérí tí ọ̀rọ̀ Jésù nípa ìgbàgbọ́ yìí jẹ́
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìlérí oníwà-àídájú tó so mọ́ gbígbàgbọ́ láìṣiyèméjì, a kò sì fi àwọn àlàyé ẹ̀kọ́ ìgbàgbọ́ ti ẹ̀yìn-ọ̀-rẹyìn kún un.
  alternative: Kí a sọ pé àfiwé àsọdùn lásán ni, tàbí kí a túmọ̀ ọ́ sí ìlérí tí kò ní ààlà rárá.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo àwòrán tó lágbára nípa ìgbàgbọ́, ṣùgbọ́n kò ṣàlàyé gbogbo àwọn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ó lè tẹ̀ lé e; nítorí náà, a pa agbára àti ìfọ̀rọ̀ṣọ̀kan rẹ̀ mọ́ láìyanjú aáwọ̀ náà fún òǹkàwé.
- issue: Ọ̀rọ̀ arọ́pò-orúkọ akọ ẹyọkan αὐτοῦ / αὐτῷ
  choice: A lo ‘rẹ̀’ àti ‘fún un,’ tí ó jẹ́ arọ́pò-orúkọ ẹyọkan ní Yorùbá.
  alternative: Kí a fi ọ̀rọ̀ akọ kan kún un láti fi hàn pé akọ ni gírámà Gíríìkì lò.
  rationale: Arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn. Ìtumọ̀ yìí pa ẹyọkan àti agbára aṣojú-gbogbogbò mọ́ láìfi ìyàtọ̀ akọ-abo tí Yorùbá kò sábà sọ sínú ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo ìṣètò ‘kí a … ọ’ láti fi ohùn àṣẹ aláìṣe-taara hàn, a sì pa àwòrán àsọdùn ti òkè àti òkun mọ́.
