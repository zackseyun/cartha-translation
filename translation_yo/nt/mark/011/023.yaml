revisions:
- from: “Lóòótọ́ ni mo sọ fún yín, ẹnikẹ́ni tí ó bá sọ fún òkè yìí pé, ‘Kí a gbé ọ sókè, kí a sì sọ ọ sínú òkun,’ tí kò sì ṣiyèméjì nínú ọkàn rẹ̀[a], ṣùgbọ́n tí ó gbàgbọ́ pé ohun tí òun ń sọ ń ṣẹlẹ̀[b], yóò rí bẹ́ẹ̀ fún un.”
  to: “Lóòótọ́ ni mo sọ fún yín pé, ẹnikẹ́ni tí ó bá sọ fún òkè yìí pé, ‘Kí a gbé e sókè, kí a sì sọ ọ sínú òkun,’ tí kò sì ṣiyèméjì nínú ọkàn rẹ̀[a], ṣùgbọ́n tí ó gbàgbọ́ pé ohun tí òun ń sọ ń ṣẹlẹ̀[b], ohun tí ó sọ yóò ṣẹlẹ̀ fún un.”
  rationale: The revision preserves the Greek syntax and theological force while improving Yoruba clarity. It retains the present-tense force of γίνεται and does not soften or qualify the saying. The explicit subject in the final clause is supplied only because Yoruba requires a clearer referent for a natural rendering of the Greek’s elliptical future clause.
