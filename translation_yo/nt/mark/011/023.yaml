review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the solemn affirmation, the indefinite condition, the passive commands concerning the mountain, inward doubt, present-tense γίνεται, and the future result. However, “yóò rí bẹ́ẹ̀ fún un” is not a natural or sufficiently clear Yoruba rendering of ἔσται αὐτῷ; the implied subject should be made explicit as what the person says.
  naturalness: Adding “pé” after “mo sọ fún yín” makes the long saying syntactically smoother in modern Standard Yoruba. “Ohun tí ó sọ yóò ṣẹlẹ̀ fún un” is clear and idiomatic. The revised footnote replaces the awkward expression “tí kò yẹ̀ láàárín èrò méjì” with natural Yoruba wording for inward indecision.
  terminology: Òkè, òkun, ọkàn, ṣiyèméjì, and gbàgbọ́ are appropriate standard terms. The indirect passive-command construction “Kí a gbé e sókè, kí a sì sọ ọ sínú òkun” is a reasonable Yoruba representation of the Greek passive imperatives without assigning an explicit agent.
  issues:
  - severity: medium
    issue: “yóò rí bẹ́ẹ̀ fún un” is unclear and unidiomatic in this context.
    rationale: Although it attempts to preserve the openness of ἔσται αὐτῷ, it can be understood as ‘he will see/find it thus’ rather than expressing that the stated thing will come about for the speaker. Making the antecedent explicit preserves the source sense clearly.
  - severity: low
    issue: The affirmation formula lacks the complementizer “pé.”
    rationale: “Lóòótọ́ ni mo sọ fún yín pé” more naturally introduces the following content in modern Standard Yoruba.
  - severity: low
    issue: Footnote a’s first alternative is not idiomatic Yoruba.
    rationale: “Tí kò yẹ̀ láàárín èrò méjì” is awkward. “Tí kò fọkàn méjì” naturally conveys inward wavering or divided-mindedness.
