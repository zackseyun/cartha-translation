  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti àwọn akọ̀wé sì gbọ́ nípa rẹ̀, wọ́n sì ń wá ọ̀nà tí wọn yóò fi pa á run[a]; nítorí wọ́n bẹ̀rù rẹ̀, nítorí pé gbogbo ogun ènìyàn náà sì ń yà wọ́n lẹ́nu nípa ẹ̀kọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pa á” tàbí “mú un kú.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí “pa run” ní ọ̀nà tó gbòòrò, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé wọ́n ní ète láti pa á.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: gbọ́ nípa rẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé wọ́n gbọ́ tàbí pé ìròyìn dé etí wọn. ‘Gbọ́ nípa rẹ̀’ tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe nínú tẹ́ńpìlì láì sọ ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ẹgbẹ́ àwọn aṣáájú àlùfáà ní Jerúsálẹ́mù, kò sì mú kó dà bí ẹni pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo ló wà.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí pa orúkọ ẹgbẹ́ àwọn amòfin àti amòye Ìwé Mímọ́ Júù mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ipa kan ṣoṣo.
- source_word: ἐζήτουν
  choice: wọ́n sì ń wá ọ̀nà
  rationale: Àmì àkókò imperfect fi hàn pé ìwá ọ̀nà náà ń bá a lọ tàbí pé wọ́n ń gbìyànjú láti rí ọ̀nà.
- source_word: πῶς
  choice: ọ̀nà tí wọn yóò fi
  rationale: Ó fi ọ̀nà tàbí bí wọn yóò ṣe mú ète wọn ṣẹ hàn, èyí sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: ἀπολέσωσιν
  choice: pa á run
  rationale: ‘Pa run’ pa ìtumọ̀ gbòòrò ti ἀπόλλυμι mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ yìí ète pípa Jésù ló ṣeé ṣe kedere jù.
- source_word: ἐφοβοῦντο
  choice: wọ́n bẹ̀rù rẹ̀
  rationale: Ó sọ ìbẹ̀rù tí ó ń bá a lọ ní ṣókí, ó sì lè ní ìtumọ̀ ìbẹ̀rù ipa Jésù àti bí èrò ṣe ń dáhùn sí i.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo èrò náà
  rationale: Ó pa ìtẹnumọ́ pé èrò náà lápapọ̀ ni ọ̀rọ̀ ń sọ mọ́.
- source_word: ἐξεπλήσσετο
  choice: ń yà á lẹ́nu
  rationale: Ọ̀nà Yorùbá àdánidá ni fún ìyàlẹ́nu tó lágbára, imperfect náà sì hàn nínú ‘ń’ gẹ́gẹ́ bí ipò tó ń bá a lọ.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sí ẹ̀kọ́ rẹ̀
  rationale: Ó sọ pé ẹ̀kọ́ Jésù ni ìdí tàbí ohun tó fa ìyàlẹ́nu wọn, ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìwọ̀n ète àwọn aṣáájú nínú ἀπολέσωσιν
  choice: pa á run
  alternative: pa á; mú un kú
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ète pípa Jésù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà gbòòrò ju ‘pa’ lọ. Nítorí náà, àkọ́kọ́ ọ̀rọ̀ pa ìwọ̀n ìtumọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì fi ète ikú tó wà nínú àyíká ọ̀rọ̀ hàn.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó mọ́gbọ́n dání, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn Gíríìkì, ṣùgbọ́n a ṣe é ní ìṣètò Yorùbá àdánidá.
