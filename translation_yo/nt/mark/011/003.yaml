  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: ó pa ipò náà, ìbéèrè ìpèníjà, àṣẹ fún ọ̀pọ̀ ènìyàn, “Olúwa,” ìpadà ọmọ kẹ́tẹ́kẹ́tẹ́ náà, àti ìkánjú εὐθύς mọ́. Síbẹ̀, ìkọ̀ ọrọ̀ apá ìkẹyìn, “lẹ́sẹ̀kẹsẹ̀ ni yóò sì rán an,” kò rọrùn dáadáa, ó sì lè dá ìtẹnumọ́ tí kò wà nínú Gíríìkì sí i. Àtúnṣe náà mú ọjọ́ iwájú tí ó wúlò fún ἀποστέλλει hàn ní ọ̀nà Yorùbá tí ó mọ́gbọ́n dání.'
