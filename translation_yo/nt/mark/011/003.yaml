language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá sì sọ fún yín pé, “Èé ṣe tí ẹ fi ń ṣe èyí?” ẹ sọ pé, “Olúwa[a] nílò rẹ̀,” òun yóò sì rán an padà síbí lẹ́sẹ̀kẹsẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá nílò rẹ̀.” Ọ̀rọ̀ Gíríìkì κύριος lè túmọ̀ sí “Olúwa” tàbí “ọ̀gá”; “Olúwa” ni a lò níbí nítorí àyíká Ìhìn Rere Máàkù.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó sì rán an padà síbí lẹ́sẹ̀kẹsẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì ἀποστέλλει wà ní àkókò ìsinsìnyí, ṣùgbọ́n ó lè jẹ́ ìsinsìnyí alààyè tó ń tọ́ka sí ohun tí yóò ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: Bí ẹnikẹ́ni bá sì sọ fún yín
  rationale: Àkópọ̀ bí...bá ṣe àfihàn ipò ọjọ́ iwájú tí ó ṣí sílẹ̀, bí ἐάν pẹ̀lú subjunctive ṣe rí; “ẹnikẹ́ni” sì bá τις mu.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Èé ṣe tí ẹ fi ń ṣe èyí?
  rationale: Nínú ọ̀rọ̀ yìí, τί jẹ́ ìbéèrè ìdí tí wọ́n fi ń ṣe ohun náà, kì í ṣe ìbéèrè nípa ohun tí wọ́n ń ṣe lásán. Èyí jẹ́ Yorùbá àdánidá fún ìpèníjà náà.
- source_word: εἴπατε
  choice: ẹ sọ pé
  rationale: Ó pa àṣẹ aorist fún ọ̀pọ̀ ènìyàn mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: Ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” pa agbára orúkọ oyè κύριος mọ́, ó sì bá ọ̀rọ̀ ìtàn Máàkù mu; “ọ̀gá” ṣì ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ ayélujára.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: nílò rẹ̀
  rationale: Yorùbá àdánidá ni fún “ní àìní rẹ̀”; “rẹ̀” tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́ tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ ìkánjú tí εὐθύς sábà máa ń ní nínú Máàkù mọ́.
- source_word: ἀποστέλλει
  choice: yóò sì rán an
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní present, àyíká ọ̀rọ̀ jẹ́ kí ó ní agbára ọjọ́ iwájú; “yóò” sọ ìtumọ̀ yẹn di àdánidá ní Yorùbá.
- source_word: πάλιν ὧδε
  choice: padà síbí
  rationale: “Padà” mú ìtumọ̀ πάλιν hàn ní àyíká ìdápadà ọmọ kẹ́tẹ́kẹ́tẹ́, “síbí” sì bá ὧδε mu.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí àti agbára ọ̀rọ̀ náà
  choice: “Olúwa” gẹ́gẹ́ bí orúkọ oyè tí ó tọ́ka sí Jésù
  alternative: “ọ̀gá” tàbí “olúwa rẹ̀” ní ìtumọ̀ ẹni tó ni ẹran náà
  rationale: Nínú àyíká ìtàn, Jésù ni ó ń fún àwọn ọmọ-ẹ̀yìn ní àṣẹ, “Olúwa” sì pa agbára κύριος mọ́ láìfi ẹ̀kọ́ ẹ̀sìn míì kún un. Àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ “ọ̀gá” tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Èé ṣe tí ẹ fi ń ṣe èyí?” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìbéèrè ìpèníjà náà mọ́.
