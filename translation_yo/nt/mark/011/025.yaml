  source_fidelity: Ìtumọ̀ náà mú ìpè láti dárí ji, ìtumọ̀ gbòòrò ‘ohunkóhun ... ẹnikẹ́ni,’ àti ìsopọ̀ ἵνα láàárín ìdáríjì ènìyàn àti ti Baba mọ́. Ṣùgbọ́n ‘ní ohunkóhun sí ẹnikẹ́ni’ lè dà bí ní ohun kan fún ẹni náà, kì í ṣe ìkùnsínú sí i; a nílò ‘lòdì sí.’ ‘Àwọn ìrékọjá’ tún yẹ kí ó wà ní ọ̀pọ̀ nọ́ńbà gẹ́gẹ́ bí παραπτώματα.
