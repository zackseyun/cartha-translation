  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: yo
  text: Nígbà tí ẹ bá dúró tí ẹ sì ń gbàdúrà, ẹ dárí ji, bí ẹ bá ní ohunkóhun lòdì sí ẹnikẹ́ni, kí Baba yín, ẹni tí ó wà ní àwọn ọ̀run[a], lè dárí ji yín nítorí àwọn ìrékọjá yín[b] náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “Baba yín ní ọ̀run.” Gíríìkì ní “ní àwọn ọ̀run” (ọ̀pọ̀ nọ́ńbà).
    reason: lexical_alternative
  - marker: b
    text: A tún lè lo “àwọn àṣìṣe” tàbí “àwọn ẹ̀ṣẹ̀” dípò “àwọn ìrékọjá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: ẹ bá dúró
  rationale: Ó pa àwòrán ìdúró nígbà àdúrà mọ́, ó sì bá ìṣe tí ó máa ń ṣẹlẹ̀ lẹ́yìn ὅταν mu.
- source_word: προσευχόμενοι
  choice: tí ẹ sì ń gbàdúrà
  rationale: Ó fi hàn pé gbígbàdúrà ń lọ ní àkókò kan náà pẹ̀lú dídúró, ní èdè Yorùbá àdánidá.
- source_word: ἀφίετε
  choice: ẹ dárí jì
  rationale: Nínú ọ̀rọ̀ ìbáṣepọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀ṣẹ̀ tàbí ohun tí ẹnìkan ṣe síni sílẹ̀; ‘dárí jì’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: bí ẹ bá ní ohunkóhun sí ẹnikẹ́ni
  rationale: Ó pa ìtumọ̀ gbòòrò ti τι àti τινος mọ́, ó sì sọ ìkùnsínú tàbí ẹ̀sùn sí ẹlòmíràn ní Yorùbá àdánidá.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Baba yín tí ń bẹ ní àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà οὐρανοῖς (‘àwọn ọ̀run’) mọ́ láì sọ ọ́ di ẹ̀kọ́ ìsìn kan pàtó.
- source_word: ἀφῇ
  choice: lè dárí ... jì
  rationale: ‘Lè’ bá ipò subjunctive lẹ́yìn ἵνα mu, ó sì pa ìsopọ̀ ète/àbájáde náà mọ́.
- source_word: παραπτώματα
  choice: ìrékọjá
  rationale: ‘Ìrékọjá’ ń sọ ìṣe yíyapa kúrò ní ohun tó tọ́, ó sì pa ìyàtọ̀ díẹ̀ mọ́ sí ọ̀rọ̀ gbogbogbò fún ‘ẹ̀ṣẹ̀’.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín dídárí ji ènìyàn àti dídárí ji láti ọ̀dọ̀ Ọlọ́run
  choice: A túmọ̀ ἵνα ... ἀφῇ ní tààrà gẹ́gẹ́ bí ‘kí ... lè dárí ... jì,’ láì rọ ìsopọ̀ náà.
  alternative: Kí a sọ ọ́ di àmì ẹ̀rí lásán pé ẹni náà ti rí ìdáríjì gbà tẹ́lẹ̀.
  rationale: Gíríìkì fi ìdáríjì àwọn ẹlòmíràn àti ìdáríjì Baba so pọ̀ ní kedere; ìtumọ̀ náà pa ìfúnpọ̀ ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ láì fi ètò ẹ̀kọ́ ìsìn mìíràn ṣàlàyé rẹ̀ kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ/yín’ gẹ́gẹ́ bí Gíríìkì ṣe ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀.
