  terminology: ‘Dárí ji’ jẹ́ ìbámu tó yẹ fún ἀφίετε/ἀφῇ. ‘Àwọn ìrékọjá’ pa ìyàtọ̀ lexical ti παράπτωμα mọ́, bí ó tilẹ̀ jẹ́ pé ‘àwọn àṣìṣe’ tàbí ‘àwọn ẹ̀ṣẹ̀’ lè jẹ́ àṣàyàn. ‘Àwọn ọ̀run’ ń pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́.
  issues:
