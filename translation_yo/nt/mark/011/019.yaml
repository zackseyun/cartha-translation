  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: yo
  text: Ní gbogbo ìgbà tí ó bá di alẹ́, wọ́n máa ń jáde kúrò ní ìlú náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: nígbàkígbà tí ... bá
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe aláìpé tí ó tẹ̀ lé e, ó fi ìṣe tí ó máa ń ṣẹlẹ̀ léraléra hàn, kì í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
- source_word: ὀψὲ ἐγένετο
  choice: alẹ́ bá sì ń lẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò ti ń di alẹ́, ó sì pa ìtumọ̀ àkókò inú gbólóhùn Gíríìkì mọ́.
- source_word: ἐξεπορεύοντο
  choice: wọ́n a máa jáde
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ṣeé lóye gẹ́gẹ́ bí ìṣe àṣà tí wọ́n ń ṣe léraléra; ‘a máa’ mú ìtumọ̀ yẹn jáde ní Yorùbá.
- source_word: ἔξω τῆς πόλεως
  choice: jáde kúrò ní ìlú náà
  rationale: ‘Jáde kúrò ní’ fi ìṣípò láti inú ìlú sí òde hàn kedere, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: πόλεως
  choice: ìlú náà
  rationale: Orísun náà sọ ‘ìlú náà’ láì dárúkọ Jerúsálẹ́mù; ìtumọ̀ yìí kò fi orúkọ tí kò sí nínú ẹsẹ náà kún un.
