  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: yo
  text: Ní ọjọ́ kejì, bí wọ́n ti jáde kúrò ní Bẹ́tánì, ebi sì pa á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ìtàn tó ṣáájú, ó sì pa àṣà ìtẹ̀síwájú ìtàn Máàkù mọ́ ní Yorùbá àdánidá.
- source_word: τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Gbólóhùn náà ń tọ́ka sí ọjọ́ tó tẹ̀ lé e; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἐξελθόντων αὐτῶν
  choice: bí wọ́n ti jáde
  rationale: Ẹ̀ka ọ̀rọ̀ aorist genitive absolute náà fi hàn pé ọ̀pọ̀ ènìyàn ni wọ́n jáde, ó sì ṣètò àkókò fún ìṣe pàtàkì. ‘Bí wọ́n ti jáde’ jẹ́ Yorùbá àdánidá láì sọ ọ́ di ìṣe tó ń lọ lọ́wọ́ dandan.
- source_word: ἀπὸ Βηθανίας
  choice: kúrò ní Bẹ́tánì
  rationale: ἀπό fi ìṣípò kúrò ní ibi kan hàn. ‘Kúrò ní’ sọ ìtumọ̀ yẹn ní kedere; Bẹ́tánì jẹ́ àkọsílẹ̀ orúkọ ibìkan ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: ἐπείνασεν
  choice: ebi pa á
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún pípa ebi ènìyàn. Aorist náà lè ròyìn ìṣẹ̀lẹ̀ tàbí ìwọlé ipò ebi láìjẹ́ pé a gbọ́dọ̀ fi ‘bẹ̀rẹ̀ sí’ kún un.
theological_decisions:
- issue: Olùṣe tí a kò dárúkọ nínú ἐπείνασεν
  choice: A lo arọ́pò-orúkọ ẹni kẹta ẹyọ nínú ‘pa á,’ láìfi orúkọ Jésù kún ẹsẹ náà.
  alternative: ‘Ebi pa Jésù’ fún àlàyé tó túbọ̀ ṣe kedere.
  rationale: Ọ̀rọ̀ Gíríìkì fi olùṣe ẹyọ sílẹ̀ láìdárúkọ rẹ̀, ṣùgbọ́n àyíká ìtàn mú kedere pé Jésù ni. Arọ́pò-orúkọ náà pa ìkékúrú àti ìtumọ̀ orísun mọ́, ó sì sọ ebi ara rẹ̀ ní tààrà láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A yan ìṣètò ọ̀rọ̀ tó rọrùn fún olùkà lasán, láìsọ ìbáṣepọ̀ àkókò tàbí iyípadà láti ọ̀pọ̀ sí ẹyọ nù.
