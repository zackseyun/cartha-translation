id: MRK.11.22
reference: Mark 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: yo
  text: Jésù sì dá wọn lóhùn pé, “Ẹ ní ìgbàgbọ́ nínú Ọlọ́run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà gangan, “Ẹ ní ìgbàgbọ́ Ọlọ́run.” Èyí tún lè túmọ̀ sí “Ẹ ní ìdúróṣinṣin Ọlọ́run” tàbí “Ẹ ní ìgbàgbọ́ láti ọ̀dọ̀ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … λέγει
  choice: Jésù sì dá wọn lóhùn pé
  rationale: Àpapọ̀ participle àti historical present náà ń ṣe àfihàn ìdáhùn nínú ìtàn. Ọ̀rọ̀ Yorùbá àdánidá ‘dá wọn lóhùn pé’ mú iṣẹ́ ọ̀rọ̀ náà jáde láìfi ìrísí participle Gíríìkì ṣe líle.
- source_word: Ἔχετε
  choice: Ẹ ní
  rationale: Àṣẹ present náà ń pe fún ìwà tàbí ipò tí ó ń bá a lọ; ‘Ẹ ní’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí kò sì túmọ̀ aspect náà ju bí ó ti yẹ lọ.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún πίστις ní àyíká ẹ̀kọ́ nípa gbígbẹ́kẹ̀ lé Ọlọ́run.
- source_word: θεοῦ
  choice: nínú Ọlọ́run
  rationale: Genitive náà ní ìtumọ̀ tí ó lè yàtọ̀. Nínú àyíká ẹsẹ 23–24, ìgbàgbọ́ tí a darí sí Ọlọ́run ni ó bá ọ̀rọ̀ mu jù; àmọ́ a pa ìtumọ̀ gangan àti àwọn ọ̀nà míì mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Genitive aláìdánilójú nínú πίστιν θεοῦ
  choice: ìgbàgbọ́ nínú Ọlọ́run
  alternative: ìgbàgbọ́ Ọlọ́run; ìṣòtítọ́ Ọlọ́run; ìgbàgbọ́ láti ọ̀dọ̀ Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ nípa àdúrà àti gbígbàgbọ́ ṣe atilẹyin fún ìgbàgbọ́ tí a gbé lé Ọlọ́run. Síbẹ̀, Gíríìkì náà kò mú ibáṣepọ̀ genitive yìí ṣe pàtó, nítorí náà a kò fi àwọn ìtumọ̀ míì pamọ́.
translation_notes:
  register: Yorùbá àgbàlágba, àdánidá, tí ó ní àmì ohùn níbi tí ó yẹ. A lo ‘Ẹ’ gẹ́gẹ́ bí àṣẹ fún ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú αὐτοῖς àti imperative plural Ἔχετε.
