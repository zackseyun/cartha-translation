  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀, bí wọ́n ti ń kọjá lọ, wọ́n rí i pé igi ọ̀pọ̀tọ́ náà ti gbẹ láti gbòǹgbò rẹ̀ wá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: bí wọ́n ti ń kọjá lọ
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ tó wà ní àkókò ìsinsìnyí yìí ń fi iṣẹ́ abẹ́lẹ̀ tí ó ń lọ ní àkókò kan náà pẹ̀lú ‘wọ́n rí’ hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: πρωῒ
  choice: Ní kùtùkùtù òwúrọ̀
  rationale: Ó ń tọ́ka sí àkókò òwúrọ̀ gan-an, nígbà tí ọjọ́ ṣẹ̀ṣẹ̀ bẹ̀rẹ̀; ‘kùtùkùtù òwúrọ̀’ mú ìtẹnumọ́ pé ó jẹ́ kutukutu jáde.
- source_word: εἶδον
  choice: wọ́n rí i pé
  rationale: Èyí túmọ̀ ìṣe ìríran ní tààrà; lílo ‘rí i pé’ bá àfikún tó ń ṣàpèjúwe ipò igi náà mu ní Yorùbá.
- source_word: συκῆν
  choice: igi ọ̀pọ̀tọ́ náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún fig tree, àtẹnudẹ́nu náà sì tọ́ka sí igi tí a ti mẹ́nu kàn nínú ìtàn.
- source_word: ἐξηραμμένην
  choice: ti gbẹ
  rationale: Apá ọ̀rọ̀ perfect passive náà ṣàpèjúwe ipò tí igi wà nítorí ohun tó ti ṣẹlẹ̀ sí i; ‘ti gbẹ’ jẹ́ ọ̀rọ̀ àdánidá, ó sì fi ipò àbájáde náà hàn.
- source_word: ἐκ ῥιζῶν
  choice: láti gbòǹgbò rẹ̀ wá
  rationale: Ó fi hàn pé gbígbẹ náà bẹ̀rẹ̀ ní gbòǹgbò tàbí pé ó dé títí dé ibẹ̀; ‘láti ... wá’ pa àwòrán orísun/ìtẹ̀síwájú tó wà nínú èdè Gíríìkì mọ́ láì fi àlàyé tí kò sí kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A ṣètò gbólóhùn náà ní ọ̀nà Yorùbá àdánidá, ṣùgbọ́n a pa ìbáṣepọ̀ àkókò tó wà láàárín iṣẹ́ kọjá lọ àti ríran mọ́. Àkọsílẹ̀ ìsàlẹ̀ ojú ìwé Gẹ̀ẹ́sì tó wí ‘Or dried up from the roots’ dà bí ẹni pé àmì rẹ̀ kò bá ibi tó wà nínú ọ̀rọ̀ mu; nítorí pé ‘ti gbẹ’ ti tú ἐξηραμμένην ní tààrà, kò sí àǹfààní gidi láti fi àkọsílẹ̀ àfikún kan sí i.
