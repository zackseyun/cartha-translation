  - severity: low
    issue: Ìtúmọ̀ ìsàlẹ̀-ẹsẹ̀ ní àwọn gbolohun tí kò rọrùn díẹ̀ nípa àwọn ìlànà ẹ̀rí àfọwọ́kọ.
