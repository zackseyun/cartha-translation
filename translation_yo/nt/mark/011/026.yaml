  source_fidelity: 'Ìtumọ̀ náà pa ìlànà gbólóhùn Gíríìkì mọ́: ìpèsè náà jẹ́ ti ọ̀pọ̀ ènìyàn, ó sì fi ìbáṣepọ̀ ìdí–àbájáde hàn láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un. “Ìrékọjá” jẹ́ ìtumọ̀ tó yẹ fún παραπτώματα, ó sì dá ìyàtọ̀ rẹ̀ mọ́ ‘ẹ̀ṣẹ̀’ gbogbogbò.'
  naturalness: “...dárí ... jì pẹ̀lú” lè dà bí ẹni pé Baba náà máa dáríjì papọ̀ pẹ̀lú ẹlòmíràn, dípò ìtumọ̀ οὐδέ (‘bẹ́ẹ̀ náà ni ... kò’). Fífi “náà” sí Baba yóò jẹ́ Yorùbá tí ó rọrùn, tí ó sì túmọ̀ ìsopọ̀ ìfẹ̀hónúhàn náà dáadáa. A tún mú ọ̀rọ̀ àlàyé ẹsẹ̀ náà rọrùn nípasẹ̀ lílo orúkọ àwọn ìlànà àfọwọ́kọ ní ọ̀nà tí ó hàn gbangba.
  terminology: “Dárí jì” dára fún ἀφίημι nínú àyíká yìí. “Baba yín tí ń bẹ ní ọ̀run” jẹ́ ìlò tí ó ní ìyì, tí ó sì dúró ṣinṣin fún ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς. “Ìrékọjá” ni a pa mọ́ fún παράπτωμα.
  issues:
