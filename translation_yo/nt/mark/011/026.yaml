  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: yo
  text: Ṣùgbọ́n[a] bí ẹ̀yin kò bá dárí jì, Baba yín tí ń bẹ ní ọ̀run náà kì yóò dárí àwọn ìrékọjá yín jì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì ìjímìjí jù lọ (tí ó fi mọ́ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin) àti nínú àwọn ìtumọ̀ Kọ́pítìkì ìjímìjí. Ṣùgbọ́n ó wà nínú ìbílẹ̀ ọ̀pọ̀ jù lọ ti Byzantine, ìbílẹ̀ Latin, àti ọ̀pọ̀ jù lọ àwọn ẹlẹ́rìí Syriac. Ó ṣeé ṣe kí àwọn akọ̀wé ìgbà tó tẹ̀ lé e fi kún un láti mú un bá ọ̀rọ̀ Jésù ní Mátíù 6:15 mu.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: dárí jì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye jù lọ fún fífi ẹ̀ṣẹ̀ tàbí àṣìṣe ẹni sílẹ̀ láìdá a lẹ́bi mọ́, yálà láàárín ènìyàn tàbí níwájú Ọlọ́run.
- source_word: παράπτωμα
  choice: ìrékọjá
  rationale: “Ìrékọjá” pa ìtumọ̀ ìgbésẹ̀ tí ó yà kúrò ní ọ̀nà tó tọ́ mọ́, ó sì fi ọ̀rọ̀ náà yà díẹ̀ sí ọ̀rọ̀ gbogbogbò fún ẹ̀ṣẹ̀.
- source_word: οὐδέ
  choice: kì yóò ... pẹ̀lú
  rationale: 'Ìṣètò yìí túmọ̀ ìbáṣepọ̀ náà lọ́nà Yorùbá àdánidá: bí àwọn olùgbọ́ kò bá dárí jì, Baba wọn náà kì yóò dárí jì.'
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín dídáríjì àwọn ẹlòmíràn àti dídáríjì Ọlọ́run
  choice: 'A pa gbólóhùn oníwọ̀nà náà mọ́ gẹ́gẹ́ bí orísun ṣe sọ ọ: bí ẹ̀yin kò bá dárí jì, Baba yín kì yóò dárí jì.'
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí àmì tàbí ẹ̀rí ìgbàlà tí ó ti wáyé tẹ́lẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò ṣàlàyé ìlànà ẹ̀kọ́ ìgbàlà níbí; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kun un tàbí mú ìhámọ́ra ọ̀rọ̀ náà kúrò.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ̀yin” àti “yín” pa ọ̀pọ̀ ènìyàn inú ὑμεῖς/ὑμῶν mọ́. “Baba yín tí ń bẹ ní ọ̀run” tẹ̀ lé gbólóhùn ìbátan Gíríìkì ὁ ἐν τοῖς οὐρανοῖς lọ́nà tó ṣe kedere.
