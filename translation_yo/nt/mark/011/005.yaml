  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: yo
  text: Àwọn kan lára àwọn tí wọ́n dúró níbẹ̀ sì ń sọ fún wọn pé, “Kí ni ẹ ń ṣe, tí ẹ ń tú ọmọ ẹranko náà[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọ kẹ́tẹ́kẹ́tẹ́ náà.” Ọ̀rọ̀ Gíríìkì πῶλος lè túmọ̀ sí ọmọ ẹranko ọdọ; nínú àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: Àwọn kan
  rationale: Ó ń tọ́ka sí iye àwọn ènìyàn tí a kò sọ pàtó lára àwọn tó wà níbẹ̀.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: lára àwọn tí ó dúró níbẹ̀
  rationale: Ó tẹ̀ lé àpèjúwe Gíríìkì ní pẹkipẹki, ó sì jẹ́ Yorùbá àdánidá ju lílo ọ̀rọ̀ ìtumọ̀ síi bí ‘àwọn olùwòran’ lọ.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àmì àsìkò aláìpé nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń sọ’ pa apá yìí mọ́ láìfi dandan túmọ̀ sí pé wọ́n sọ ọ́ léraléra.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó jẹ́ arọ́pò-orúkọ ọ̀pọ̀ nínú ipò olùgbà, ó sì tọ́ka sí àwọn tí wọ́n ń bá sọ̀rọ̀.
- source_word: Τί ποιεῖτε
  choice: Kí ni ẹ ń ṣe
  rationale: Ìbéèrè tààrà nípa ohun tí wọ́n ń ṣe ni; ìtumọ̀ yìí kò fi ‘kí ló dé’ tàbí ‘níbí’ kún ohun tí Gíríìkì sọ.
- source_word: λύοντες
  choice: tí ẹ ń tú
  rationale: Nínú àyíká ẹranko tí a dè, ‘tú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe yíyan okùn kúrò mu.
- source_word: τὸν πῶλον
  choice: ọmọ ẹranko náà
  rationale: πῶλος lè túmọ̀ sí ọmọ ẹranko kan láìdárúkọ irú rẹ̀. Yíyan ‘ọmọ ẹranko’ pa ìtumọ̀ gbòòrò inú Máàkù mọ́; àlàyé ìsàlẹ̀ fi hàn pé kẹ́tẹ́kẹ́tẹ́ ni àyíká náà ń tọ́ka sí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Ìṣètò ‘sì ń sọ’ pa ìlọsíwájú ìṣe inú ἔλεγον mọ́.
