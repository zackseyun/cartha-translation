  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: yo
  text: Wọ́n sì wọ Kápánáúmù lọ.[a] Lẹ́sẹ̀kẹsẹ̀ ní ọjọ́ Ìsinmi,[b] ó sì ń kọ́ni nínú sínágọ́gù.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì ń wọ Kápánáúmù lọ.” Máàkù sábà máa ń lo àsìkò ìsinsìnyí láti sọ ìṣẹ̀lẹ̀ àtijọ́ lọ́nà tí ó mú kí ìtàn náà yè kedere.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ní àwọn ọjọ́ Ìsinmi”; èyí jẹ́ àṣà-ìsọ tí ó lè túmọ̀ sí “ní ọjọ́ Ìsinmi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó bẹ̀rẹ̀ sí í kọ́ni” tàbí “ó kọ́ni.” Àsìkò imperfect nínú èdè Gíríìkì lè tẹnu mọ́ iṣẹ́ tí ń lọ lọ́wọ́, tàbí ìbẹ̀rẹ̀ iṣẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: wọ … lọ
  rationale: Ọ̀rọ̀ náà jẹ́ present historical tí Máàkù sábà máa ń lò láti mú ìtàn yè kooro; àsìkò tí ó ti kọjá jẹ́ èdè Yorùbá àdánidá fún ìtàn yìí, nígbà tí ‘wọ … lọ’ pa ìtumọ̀ ìṣípò sínú ibìkan mọ́.
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: Ìkọ̀wé yìí mú orúkọ Gíríìkì Καφαρναούμ wá sí ìró Yorùbá, pẹ̀lú àmì ohùn níbi tí ó bá bá ìpè rẹ̀ mu.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti ìkanjú ìtàn Máàkù hàn ní èdè Yorùbá òde òní.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ Ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní plural, ó jẹ́ àṣà-ìsọ tí ó lè túmọ̀ sí ọjọ́ Ìsinmi kan ṣoṣo nínú àyíká yìí.
- source_word: ἐδίδασκεν
  choice: ó ń kọ́ni
  rationale: Àmì ‘ń’ fi imperfect náà hàn gẹ́gẹ́ bí iṣẹ́ tí ń lọ lọ́wọ́, láìfi dandan pinnu pé ìtumọ̀ rẹ̀ ni ‘ó bẹ̀rẹ̀ sí í kọ́ni.’
- source_word: συναγωγήν
  choice: sínágọ́gù
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà tọ́ka sí ibi ìpéjọsìn agbègbè, kì í ṣe ìpéjọ lásán.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọjọ́ Ìsinmi’ fún Sabbath àti ‘sínágọ́gù’ fún ibi ìpéjọsìn Júù. A yan ‘ó ń kọ́ni’ láti pa àìdánilójú aspect imperfect mọ́, kí akọsilẹ̀ ìsàlẹ̀ sì ṣàfihàn inceptive àti simple-past gẹ́gẹ́ bí àwọn àṣàyàn.
