id: MRK.1.5
reference: Mark 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: yo
  text: Gbogbo agbègbè Jùdíà àti gbogbo àwọn ará Jerúsálẹ́mù sì ń jáde lọ sọ́dọ̀ rẹ̀, ó sì ń batisí wọn nínú Odò Jọ́dánì, bí wọ́n ti ń jẹ́wọ́ àwọn ẹ̀ṣẹ̀ wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: ń jáde lọ
  rationale: Ìṣe aláìparí náà fi ìṣe tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn; ‘ń jáde lọ’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: gbogbo agbègbè Jùdíà
  rationale: χώρα lè túmọ̀ sí agbègbè, ìpínlẹ̀, tàbí ilẹ̀ ìgbèríko; ‘agbègbè Jùdíà’ jẹ́ gbígbòòrò tó sì bá àyíká ilẹ̀ mu láìfi ‘gbogbo’ sílẹ̀.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: gbogbo àwọn ará Jerúsálẹ́mù
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn olùgbé Jerúsálẹ́mù; ‘àwọn ará Jerúsálẹ́mù’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἐβαπτίζοντο
  choice: ó sì ń batisí wọn
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lo ohùn àgbàwọlé, Yorùbá máa ń sọ irú ìṣe yìí lọ́nà àdánidá pẹ̀lú olùṣe gẹ́gẹ́ bí kókó gbólóhùn. Àpèjúwe aláìparí wà nínú ‘ń,’ ‘wọn’ sì pa ẹni tí a ṣe fún mọ́.
- source_word: ὑπ’ αὐτοῦ
  choice: ó … wọn
  rationale: A pa arọ́pò-orúkọ ẹni náà mọ́ láìfi orúkọ Jòhánù kún un; ìṣètò Yorùbá yí ohùn àgbàwọlé padà sí ohùn olùṣe.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: nínú Odò Jọ́dánì
  rationale: ποταμός túmọ̀ sí odò ní kedere, ‘nínú’ sì pa ìtọ́kasí ibi ìṣe náà mọ́.
- source_word: ἐξομολογούμενοι
  choice: bí wọ́n ti ń jẹ́wọ́
  rationale: Àpólà aláìlẹ́ni náà ṣàpèjúwe ìṣe tó ń bá batisí lọ; ‘bí wọ́n ti ń jẹ́wọ́’ sọ ìbáṣepọ̀ ìgbà náà ní Yorùbá tó ṣe kedere láìsọ ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: àwọn ẹ̀ṣẹ̀ wọn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá fún ohun tí wọ́n ń jẹ́wọ́ àti arọ́pò-orúkọ ohun-ìní.
theological_decisions:
- issue: Ìwọ̀n ‘gbogbo’ nínú àpèjúwe Jùdíà àti Jerúsálẹ́mù
  choice: Pa ‘gbogbo’ mọ́ ní àwọn ibi méjèèjì, kí a sì jẹ́ kí ó ní agbára ọ̀rọ̀ àkójọpọ̀ rẹ̀.
  alternative: Túmọ̀ ọ́ sí ‘ọ̀pọ̀ ènìyàn láti Jùdíà àti Jerúsálẹ́mù.’
  rationale: Gíríìkì ní πᾶσα àti πάντες. Ìtumọ̀ gbọ́dọ̀ pa àsọdùn ìtàn yẹn mọ́ láìrọ̀ pé ó gbọ́dọ̀ jẹ́ gbogbo ẹnì kọ̀ọ̀kan láìsí àfiwé.
- issue: Ìtumọ̀ ìṣe batisí
  choice: Lo ‘batisí’ láìṣàlàyé ọ̀nà tí a gbà ṣe é tàbí ìjẹ́pàtàkì ẹ̀kọ́ ìsìn rẹ̀.
  alternative: Lo ‘rì sínú omi’ tàbí ‘wẹ̀.’
  rationale: Ẹsẹ̀ náà ròyìn ìṣe náà, kò sì yanju gbogbo ìbéèrè nípa ọ̀nà tàbí ẹ̀kọ́ ìsìn. ‘Batisí’ yẹra fún fífi ìtumọ̀ ẹ̀ya ìjọ kan kún ọ̀rọ̀ náà.
- issue: Ohùn àgbàwọlé nínú ἐβαπτίζοντο
  choice: 'Ṣe é ní ohùn olùṣe Yorùbá: ‘ó sì ń batisí wọn.’'
  alternative: ‘Wọ́n sì ń ṣe batisí fún wọn láti ọwọ́ rẹ̀.’
  rationale: Ohùn olùṣe ni ó túbọ̀ jẹ́ Yorùbá àdánidá, ó sì tún pa Jòhánù mọ́ gẹ́gẹ́ bí olùṣe àti àwọn ènìyàn gẹ́gẹ́ bí ẹni tí a batisí.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé lasán; ‘batisí’ ni ọ̀rọ̀ Bíbélì tí a mọ̀ dáadáa, nígbà tí àwọn orúkọ ibi tẹ̀lé ìkọ̀wé Yorùbá tó wọ́pọ̀.
