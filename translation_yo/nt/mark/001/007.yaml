  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: yo
  text: Ó sì ń kéde[a] pé, “Ẹni tí ó lágbára ju mí lọ ń bọ̀ lẹ́yìn mi[b]; èmi kò yẹ[c] láti tẹ̀ sílẹ̀ kí n sì tú okùn bàtà rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń wàásù.” ‘Ń kéde’ tẹnu mọ́ iṣẹ́ akéde tí ń kéde ìhìn ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: ‘Lẹ́yìn mi’ lè túmọ̀ sí ẹni tí ń bọ̀ tẹ̀ lé Jòhánù ní àkókò tàbí ẹni tí ń bọ̀ láti ẹ̀yìn rẹ̀.
    reason: source_ambiguity
  - marker: c
    text: Tàbí, “èmi kò tó” tàbí “èmi kò kúnjú ìwọ̀n”; gbólóhùn náà fi ìrẹ̀lẹ̀ jíjinlẹ̀ Jòhánù níwájú ẹni tí ń bọ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: ń kéde
  rationale: Àkókò aláìparí nínú Gíríìkì fi iṣẹ́ tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; ‘ń kéde’ sì pa ìtumọ̀ iṣẹ́ akéde mọ́ láìfi èdè ìjọ kún un.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ó tẹ̀ lé ọ̀rọ̀-ìṣe ‘kéde’; kò pọndandan láti tún ‘sọ pé’ ṣe.
- source_word: Ἔρχεται
  choice: ń bọ̀
  rationale: Ó pa ìmọ̀lára ohun tí ń ṣẹlẹ̀ nísinsìnyí àti ìsúnmọ́ dídé ẹni náà mọ́.
- source_word: ὁ ἰσχυρότερός μου
  choice: Ẹni tí ó lágbára ju mí lọ
  rationale: Ó mú àfiwé Gíríìkì jáde ní Yorùbá tó ṣe kedere, tí ó sì jẹ́ ti èdè ojoojúmọ́.
- source_word: ὀπίσω μου
  choice: lẹ́yìn mi
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ipò lẹ́yìn ẹni àti sí ẹni tí ń bọ̀ tẹ̀ lé e; ‘lẹ́yìn mi’ pa ìtumọ̀ méjèèjì sílẹ̀.
- source_word: ἱκανὸς
  choice: yẹ
  rationale: Nínú ọ̀rọ̀ yìí, ó fi àìyẹ Jòhánù níwájú ẹni tí ń bọ̀ hàn ju àìlèṣe lasán lọ.
- source_word: κύψας
  choice: láti tẹ̀ ba
  rationale: Ó ṣàfihàn ìtẹ̀sílẹ̀ ara tí ó ṣáájú àti tí ó bá títú okùn bàtà lọ.
- source_word: λῦσαι
  choice: tú
  rationale: ‘Tú’ ni ọ̀rọ̀ Yorùbá tó bá títú okùn bàtà mu lọ́nà àdánidá.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: okùn bàtà rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì pegedé fún okùn aláwọ̀ tí a fi ń di bàtà ìgbàanì.
theological_decisions:
- issue: Ìwọ̀n ìrẹ̀lẹ̀ inú ọ̀rọ̀ Jòhánù
  choice: èmi kò yẹ
  alternative: èmi kò tó / èmi kò kúnjú ìwọ̀n
  rationale: ‘Kò yẹ’ fi ìyàtọ̀ ipò àti ìrẹ̀lẹ̀ Jòhánù hàn, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ ‘kò tó’ tàbí ‘kò kúnjú ìwọ̀n’ tí ἱκανός tún lè ní mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó níyì ni a lò. Àkópọ̀ ‘láti tẹ̀ ba kí n sì tú’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìbáṣepọ̀ κύψας àti λῦσαι mọ́ láìsọ ọ̀rọ̀ náà di líle láti lóye.
