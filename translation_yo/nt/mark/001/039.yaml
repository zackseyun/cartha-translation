id: MRK.1.39
reference: Mark 1:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: yo
  text: Ó sì lọ ká gbogbo Gálílì kiri[a], ó ń wàásù nínú àwọn sínágọ́gù wọn, ó sì ń lé àwọn ẹ̀mí èṣù jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì wá, ó ń wàásù nínú àwọn sínágọ́gù wọn ká gbogbo Gálílì kiri, ó sì ń lé àwọn ẹ̀mí èṣù jáde.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí “wá,” ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó ń ṣàpèjúwe bí ó ṣe ń rìn ká agbègbè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: lọ ká ... kiri
  rationale: Bí ó tilẹ̀ jẹ́ pé ἦλθεν lè túmọ̀ sí ‘wá,’ nínú àyíká yìí ó ń ṣàpèjúwe bí Jésù ṣe ń rìn ká agbègbè Gálílì. ‘Lọ ká ... kiri’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìrìn káàkiri hàn láìfi ohun tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: κηρύσσων
  choice: ó ń wàásù
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípolongo ní gbangba. ‘Wàásù’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá iṣẹ́ pípolongo nínú sínágọ́gù mu.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: nínú àwọn sínágọ́gù wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς lè túmọ̀ sí ‘sínú,’ níbí ó ń tọ́ka sí ibi tí iṣẹ́ wíwàásù ti ń ṣẹlẹ̀. ‘Nínú’ jẹ́ àfihàn Yorùbá tí ó ṣe kedere, a sì pa ‘wọn’ mọ́ fún αὐτῶν.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: ká gbogbo Gálílì kiri
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń fi bí ìrìn náà ṣe dé gbogbo agbègbè hàn. Ìtumọ̀ yìí pa ὅλην (‘gbogbo’) mọ́, ó sì sọ ọ́ ní Yorùbá àdánidá.
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: δαιμόνια ń tọ́ka sí àwọn ẹ̀dá ẹ̀mí búburú, kì í ṣe gbólóhùn gbòòrò ‘àwọn ẹ̀mí àìmọ́.’ ‘Àwọn ẹ̀mí èṣù’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere tí kò fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
- source_word: ἐκβάλλων
  choice: ó ń lé ... jáde
  rationale: Nínú àyíká yíyọ ẹ̀mí èṣù, ἐκβάλλω túmọ̀ sí lílé tàbí yíyọ jáde. ‘Lé ... jáde’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lágbára tó.
theological_decisions:
- issue: Ìwà àwọn δαιμόνια
  choice: A túmọ̀ wọn sí ‘àwọn ẹ̀mí èṣù,’ ìyẹn àwọn ẹ̀dá ẹ̀mí ti ara ẹni.
  alternative: àwọn ẹ̀mí búburú
  rationale: Ọ̀rọ̀ náà fi Jésù hàn bí ẹni tí ó ní àṣẹ lórí àwọn ẹ̀dá ẹ̀mí èṣù. ‘Àwọn ẹ̀mí èṣù’ bá ọ̀rọ̀ Gíríìkì mu ní tààrà, kò sì dá ẹ̀kọ́ ìsìn àfikún sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu; a sì lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ àmúlò fún ibi ìjọsìn Júù.
