base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: yo
  text: Ó sì bínú[a], ó na ọwọ́ rẹ̀, ó fọwọ́ kan an, ó sì wí fún un pé, “Mo fẹ́; di mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “Ó sì ṣàánú,” dípò “Ó sì bínú.”
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: nígbà tí ó bínú
  rationale: Ọ̀rọ̀ Gíríìkì tí SBLGNT tẹ̀ jáde túmọ̀ sí pé ó bínú. Gbólóhùn yìí sọ ìmọ̀lára náà ní Yorùbá àdánidá láì sọ ohun tí ìbínú náà dojú kọ.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: ó na ọwọ́ rẹ̀
  rationale: Èyí pa ìṣe ara tí ó ṣe kedere mọ́, ó sì tẹ̀ lé ìṣàn ìtàn Yorùbá lọ́nà àdánidá.
- source_word: ἥψατο
  choice: ó fọwọ́ kan an
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọwọ́ kan ẹni náà; ìtumọ̀ yìí tún pa ìjẹ́pàtàkì ìfọwọ́kan adẹ́tẹ̀ mọ́.
- source_word: λέγει αὐτῷ
  choice: ó sì wí fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí ìtàn, àsìkò tí ó ti kọjá bá ìtàn Yorùbá mu dáadáa. “Wí fún un” ní ọlá tó yẹ fún àkọsílẹ̀ Bíbélì, ó sì ṣeé lóye.
- source_word: Θέλω
  choice: Mo fẹ́
  rationale: Níbí, θέλω ń fi ìfẹ́-ọkàn àti ìmúratán hàn, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú. “Mo fẹ́” dáhùn taara sí ọ̀rọ̀ adẹ́tẹ̀ náà pé, “bí ìwọ bá fẹ́.”
- source_word: καθαρίσθητι
  choice: jẹ́ kí a sọ ọ́ di mímọ́
  rationale: Àṣẹ aláìṣe yìí ní ìtumọ̀ ìwẹ̀nùmọ́ kúrò nínú ẹ̀tẹ̀, nípa ara àti nípa ipò ìmọ́tótó ẹ̀sìn. Ọ̀rọ̀ “mímọ́” pa ìtumọ̀ méjèèjì mọ́ ju “wọ̀ sàn” lọ.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa ìmọ̀lára Jésù
  choice: A tú ὀργισθείς inú SBLGNT sí “nígbà tí ó bínú” nínú ẹsẹ̀ pàtàkì.
  alternative: “Nígbà tí àánú rẹ̀ ṣe é” tàbí “ẹ̀mí ìyọ́nú sì gbé e.”
  rationale: A tẹ̀ lé ẹ̀dà Gíríìkì tí a pèsè gẹ́gẹ́ bí orísun àkọ́kọ́. Nítorí ìyàtọ̀ yìí ṣe pàtàkì sí bí a ṣe ń rí ìmọ̀lára Jésù, a fi ẹ̀dà mìíràn sínú àlàyé ìsàlẹ̀ dípò kí a yanjú ìṣòro náà láìjẹ́ kí òǹkàwé mọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Jẹ́ kí a sọ ọ́ di mímọ́” jẹ́ àṣẹ Yorùbá àdánidá tí ó pa ohùn aláìṣe Gíríìkì àti ìtumọ̀ ìwẹ̀nùmọ́ mọ́.
