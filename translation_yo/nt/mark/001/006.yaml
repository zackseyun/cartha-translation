  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: yo
  text: Jòhánù wọ aṣọ irun ràkúnmí, ó sì di àmùrè awọ ní ìbàdí rẹ̀[a]; ó ń jẹ eṣú àti oyin ìgbẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aṣọ Jòhánù mú àpèjúwe Èlíjà nínú 2 Àwọn Ọba 1:8 wá sí ìrántí, ó sì ń fi Jòhánù hàn gẹ́gẹ́ bí wòlíì aṣáájú-ọ̀nà nínú ìtàn Máàkù.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: wọ aṣọ tí a fi irun ràkúnmí ṣe
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ipò Jòhánù gẹ́gẹ́ bí ẹni tí ó wọ aṣọ irun ràkúnmí. Fífi “aṣọ tí a fi ... ṣe” kún un mú kí ó ṣe kedere ní Yorùbá pé irun ni ohun èlò aṣọ náà, kì í ṣe awọ tàbí gbogbo ara ràkúnmí.
- source_word: ζώνην δερματίνην
  choice: àmùrè awọ
  rationale: “Àmùrè” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìgbànú tàbí belt, “awọ” sì sọ ohun tí a fi ṣe é.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: mọ́ ẹ̀gbẹ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó di àmùrè yí agbègbè ìbàdí rẹ̀ ká.
- source_word: ἔσθων
  choice: ó ń jẹ
  rationale: Àmì “ń” pa ìṣe tí ó ń lọ tàbí àṣà jíjẹ rẹ̀ mọ́ nínú àpèjúwe náà.
- source_word: ἀκρίδας
  choice: eṣú
  rationale: Ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ni kòkòrò eṣú; kò sí ìdí nínú àyíká ọ̀rọ̀ láti yí i padà sí ohun mìíràn.
- source_word: μέλι ἄγριον
  choice: oyin ìgbẹ́
  rationale: Èyí túmọ̀ sí oyin tí a rí nínú igbó tàbí ní ẹ̀dá, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: καὶ ἦν
  choice: Jòhánù wọ
  rationale: A kò fi àmì àsopọ̀ àkọ́kọ́ kan bí “Nígbà náà” kún un, nítorí καί ń tẹ ìtàn náà síwájú, kò sì ní ọ̀rọ̀ tó túmọ̀ sí “nísinsìnyí” ní pàtó. Ìṣe “wọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò aṣọ rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ aṣọ Jòhánù pẹ̀lú àwòrán wòlíì Èlíjà
  choice: A fi ẹsẹ náà sílẹ̀ gẹ́gẹ́ bí àpèjúwe aṣọ àti oúnjẹ Jòhánù nìkan.
  alternative: Kí a sọ ní pàtó nínú ọ̀rọ̀ àkọ́kọ́ pé Jòhánù dà bí Èlíjà tàbí pé òun ni aṣáájú wòlíì.
  rationale: Máàkù 1:6 ń mú 2 Àwọn Ọba 1:8 wá sí ìrántí, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ìdánimọ̀ náà ní tààrà. Àlàyé ìsopọ̀ náà yẹ fún àlàyé ìsàlẹ̀, kì í ṣe fún fífi kún ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé lásán, ó sì pa àpèjúwe orísun Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sọ ní tààrà kún un.
