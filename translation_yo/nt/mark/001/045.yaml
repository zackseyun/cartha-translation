revisions:
- from: Ṣùgbọ́n lẹ́yìn tí ó jáde lọ, ó bẹ̀rẹ̀ sí í kéde ọ̀rọ̀ náà káàkiri, ó sì tan ìròyìn náà kalẹ̀, tó bẹ́ẹ̀ tí Jésù kò fi lè wọ ìlú kan ní gbangba mọ́. Dípò bẹ́ẹ̀, ó dúró síta ní àwọn ibi ahoro; àwọn ènìyàn sì ń tọ̀ ọ́ wá láti gbogbo agbègbè.
  to: Ṣùgbọ́n lẹ́yìn tí ó jáde lọ, ó bẹ̀rẹ̀ sí í kéde lọ́pọ̀lọpọ̀ àti sí í tan ọ̀rọ̀ náà káàkiri, tó bẹ́ẹ̀ tí Jésù kò fi lè wọ ìlú kan ní gbangba mọ́; ṣùgbọ́n ó wà níta, ní àwọn ibi tí kò sí ènìyàn. Àwọn ènìyàn sì ń tọ̀ ọ́ wá láti ibi gbogbo.
  rationale: 'Àtúnṣe náà pa ìtumọ̀ ẹsẹ náà mọ́: ọkùnrin tí a mú lára dá náà ń kéde, ṣùgbọ́n Jésù ni ẹni tí kò lè wọ ìlú ní gbangba mọ́. Ó tún mú ìṣàtakò ἀλλά, ìtumọ̀ ‘ibi àdádó’ ti ἐρήμοις τόποις, àti àgbáyé πάντοθεν hàn ní kedere, láì fi ìtumọ̀ tàbí ẹ̀kọ́ mìíràn kún un.'
