    issue: “Dípò bẹ́ẹ̀” fún ἀλλά
    rationale: '“Dípò bẹ́ẹ̀” sábà máa ń fi ìyàn tàbí àfidípò hàn. Ἀλλά níbí jẹ́ ìṣàtakò tó rọrùn: Jésù kò lè wọ ìlú ní gbangba, ṣùgbọ́n ó wà níta.'
  - severity: medium
    issue: “Àwọn ibi ahoro” fún ἐπ’ ἐρήμοις τόποις
    rationale: Ní Yorùbá, ‘ibi ahoro’ lè tọ́ka sí ibi tí ilé ti wó tàbí ibi ìparun. Gíríìkì náà tọ́ka sí àwọn ibi tí kò ní ènìyàn, tàbí ibi àdádó.
  - severity: low
    issue: “Láti gbogbo agbègbè” fún πάντοθεν
    rationale: Ìtumọ̀ náà sun mọ́ ọ̀rọ̀ náà, ṣùgbọ́n ‘láti ibi gbogbo’ dá ìtumọ̀ ‘from everywhere’ hàn ní kíkún.
