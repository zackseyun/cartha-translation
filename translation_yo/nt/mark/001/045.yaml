id: MRK.1.45
reference: Mark 1:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí ó jáde lọ, ó bẹ̀rẹ̀ sí í kéde lọ́pọ̀lọpọ̀ àti sí í tan ọ̀rọ̀ náà káàkiri, tó bẹ́ẹ̀ tí Jésù kò fi lè wọ ìlú kan ní gbangba mọ́; ṣùgbọ́n ó wà níta, ní àwọn ibi tí kò sí ènìyàn. Àwọn ènìyàn sì ń tọ̀ ọ́ wá láti ibi gbogbo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: kéde ọ̀rọ̀ náà káàkiri
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó ń kéde rẹ̀ lọ́pọ̀lọpọ̀ tàbí ní ibigbogbo; ‘káàkiri’ fi ìtànkálẹ̀ ìkéde náà hàn ní Yorùbá àdánidá.
- source_word: διαφημίζειν τὸν λόγον
  choice: tan ìròyìn náà kalẹ̀
  rationale: διαφημίζειν ní ìtumọ̀ fífi ohun kan di mímọ̀ káàkiri; τὸν λόγον ní àyíká yìí tọ́ka sí ìròyìn nípa ohun tí ó ṣẹlẹ̀.
- source_word: φανερῶς
  choice: ní gbangba
  rationale: Ó fi hàn pé Jésù kò tún lè wọ ìlú ní ọ̀nà tí gbogbo ènìyàn yóò rí i, kì í ṣe pé kò lè wọ̀ ọ́ rárá.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: ní àwọn ibi ahoro
  rationale: ἐρήμοις τόποις jẹ́ àwọn ibi tí ènìyàn kò pọ̀ sí tàbí ibi tí kò sí ìgbé ayé púpọ̀; ‘ibi ahoro’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láì sọ ọ́ di aṣálẹ̀ dandan.
- source_word: πάντοθεν
  choice: láti gbogbo agbègbè
  rationale: Ó mú ìtumọ̀ ‘láti ibi gbogbo’ jáde ní èdè Yorùbá tó ń ṣàn.
theological_decisions:
- issue: Ẹni tí αὐτόν tọ́ka sí nínú gbólóhùn pé kò lè wọ ìlú mọ́
  choice: Jésù
  alternative: òun
  rationale: Ní gírámà Gíríìkì, αὐτόν tọ́ka sí Jésù, bí ó tilẹ̀ jẹ́ pé akọlé ọ̀rọ̀ tó ṣáájú ni ọkùnrin tí a mú lára dá; lílo orúkọ ‘Jésù’ yọ ìdàrúdàpọ̀ èdè Yorùbá kúrò láì yí ìtumọ̀ padà.
- issue: Ẹni tí ó ń kéde ìròyìn náà
  choice: ọkùnrin tí a mú lára dá, gẹ́gẹ́ bí ó ṣe hàn láti ẹsẹ tó ṣáájú
  alternative: Jésù
  rationale: ὁ δὲ ἐξελθὼν ń bá ẹni tí Jésù rán jáde ní 1:43–44 lọ; a kò fi orúkọ tàbí àlàyé míì kún ọ̀rọ̀ ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Ó dúró síta’ mú àbájáde ìṣe tí ń bá a lọ jáde, dípò fífi ἦν sílẹ̀ gẹ́gẹ́ bí ‘ó wà’ tí kò fi ìgbékalẹ̀ náà hàn dáadáa.
