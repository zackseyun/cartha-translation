review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ náà tọ́ka ẹni tí a mú lára dá gẹ́gẹ́ bí ẹni tó jáde, ó sì tọ́ka sí Jésù ní ibi tí αὐτόν wà. Síbẹ̀, “Dípò bẹ́ẹ̀” fi ìmọ̀ ‘instead’ tó lágbára ju ἀλλά (‘ṣùgbọ́n’) hàn, “ibi ahoro” lè túmọ̀ sí àwókù ilé tàbí ibi tí ó bàjẹ́, kì í ṣe àwọn ibi tí ènìyàn kò gbé, àti “láti gbogbo agbègbè” dín πάντοθεν (‘láti ibi gbogbo’) kù díẹ̀.
  naturalness: Èdè náà rọrùn, ó sì ní àmì ohùn tó péye ní gbogbogbò. “Àwọn ibi tí kò sí ènìyàn” jẹ́ ọ̀nà Yorùbá àdánidá tó ṣàlàyé ἐρήμοις τόποις dáadáa ju “àwọn ibi ahoro” lọ nínú àyíká yìí.
  terminology: “Kéde” yẹ fún κηρύσσειν; “tan ọ̀rọ̀ náà káàkiri” yẹ fún διαφημίζειν τὸν λόγον. A tún ṣe “κερύσσειν πολλὰ” ní “kéde lọ́pọ̀lọpọ̀,” láti má ṣe so ‘káàkiri’ mọ́ ìṣe méjèèjì, kí ìyàtọ̀ láàrin ìkéde púpọ̀ àti títàn ọ̀rọ̀ náà hàn.
