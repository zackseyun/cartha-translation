  text: And Simon and those with him pursued him,[a]
translation:
  language: yo
  text: Símónì àti àwọn tí ó wà pẹ̀lú rẹ̀ sì lépa rẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wá a kiri.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí lílépa ẹnì kan pẹ̀lú ìtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: lépa
  rationale: Ọ̀rọ̀ Gíríìkì náà ní agbára ju ‘wá’ lásán lọ, ó sì lè túmọ̀ sí lílépa ẹnì kan pẹ̀lú ìtara. ‘Lépa’ pa agbára yìí mọ́ ní Yorùbá àdánidá.
- source_word: αὐτὸν
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù nínú àyíká ẹsẹ náà.
- source_word: Σίμων
  choice: Símónì
  rationale: A kọ orúkọ náà ní ìrísí tí ó bá ìlò Yorùbá mu.
- source_word: οἱ μετ’ αὐτοῦ
  choice: àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Èyí dúró nítòsí gbólóhùn Gíríìkì, kò sì fi ìtumọ̀ pàtó tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ẹsẹ yìí mọ́ ìtàn tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti pa ìṣọ̀kan ọ̀rọ̀ Máàkù mọ́ ní Yorùbá.
