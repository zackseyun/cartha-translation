source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: yo
  text: Wọ́n sì fi àwọn àwọ̀n náà sílẹ̀ lẹ́sẹ̀kẹsẹ̀[a], wọ́n sì tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lójú ẹsẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Àsopọ̀ ‘sì’ jẹ́ ọ̀nà àdánidá láti pa ìṣàn ìtàn Máàkù mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ṣe ohun náà láìjáfara; ‘lẹ́sẹ̀kẹsẹ̀’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀφέντες
  choice: fi ... sílẹ̀
  rationale: Ẹ̀yà-ìṣe aorist yìí tọ́ka sí ohun tí wọ́n ṣe ṣáájú ìṣe pàtàkì náà. Gbólóhùn alápapọ̀ ní Yorùbá mú un jáde lọ́nà àdánidá láìsọ pé wọ́n ‘kọ̀’ àwọn àwọ̀n náà sílẹ̀ pátápátá.
- source_word: τὰ δίκτυα
  choice: àwọn àwọ̀n náà
  rationale: Èyí pa article àti ọ̀pọ̀ nǹkan inú Gíríìkì mọ́. A kò fi ‘àwọn àwọ̀n wọn’ sí i, nítorí pé ọ̀rọ̀ arọ́pò ohun-ìní kò sí ní kedere nínú Gíríìkì.
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé
  rationale: ‘Tẹ̀ lé’ lè sọ nípa lílọ lẹ́yìn ẹnì kan, ó sì tún lè gbé ìtumọ̀ jíjẹ́ ọmọlẹ́yìn láìṣàlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ náà sọ.
- source_word: αὐτῷ
  choice: e
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí Jésù nínú àyíká ọ̀rọ̀; a pa á mọ́ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò dípò fífi orúkọ Jésù rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ọmọlẹ́yìn nínú ἠκολούθησαν
  choice: tẹ̀ lé e
  alternative: bá a lọ; di ọmọlẹ́yìn rẹ̀
  rationale: ‘Tẹ̀ lé e’ pa ìtumọ̀ lílọ lẹ́yìn Jésù àti ìtumọ̀ tó ń yọjú nípa jíjẹ́ ọmọlẹ́yìn mọ́. A kò túmọ̀ rẹ̀ sí ‘di ọmọlẹ́yìn rẹ̀,’ nítorí ìyẹn yóò ṣàlàyé ohun tí ọ̀rọ̀ náà jẹ́ kí àyíká ìtàn fi hàn fúnra rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìròyìn kúkúrú àti ìkánjú ara ìtàn Máàkù mọ́.
