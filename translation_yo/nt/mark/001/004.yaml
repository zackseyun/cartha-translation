source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: yo
  text: Jòhánù, ẹni tí ń ṣe ìrìbọmi, farahàn ní aginjù, ó ń kéde ìrìbọmi ìrònúpìwàdà fún ìdáríjì ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: farahàn
  rationale: Nínú ìtàn Máàkù, ọ̀rọ̀ náà lè fi ẹni tuntun hàn bí ẹni tí ó dé sí ojú ìṣẹ̀lẹ̀. “Farahàn” sọ agbára ìtàn yìí ní Yorùbá àdánidá, láì túmọ̀ ọ́ ní líle gẹ́gẹ́ bí “ó wà.”
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: A lo ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú èdè Yorùbá.
- source_word: ὁ βαπτίζων
  choice: Onírìbọmi
  rationale: Ọ̀rọ̀ alábápín pẹ̀lú atọ́ka náà dá Jòhánù mọ̀ nípa iṣẹ́ ìrìbọmi rẹ̀. “Onírìbọmi” jẹ́ oyè Yorùbá tí ó mọ́gbọ́n dání, tí ó sì ti wọ́pọ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ gígún tó sún mọ́ ọ̀rọ̀ Gíríìkì hàn.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ilẹ̀ tí kò ní olùgbé púpọ̀, ó sì yẹ fún àyíká àti ìró Bíbélì níbí láì sọ pé aṣálẹ̀ yanrìn ni pàtó.
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: “Kéde” pa ìtumọ̀ iṣẹ́ akéde mọ́, ó sì gbooro ju ọ̀rọ̀ tí ó lè dà bí èdè inú ṣọ́ọ̀ṣì nìkan.
- source_word: βάπτισμα
  choice: ìrìbọmi
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ sí iṣe ìrìbọmi, ó sì bá ọ̀rọ̀ Gíríìkì mu ní àyíká yìí.
- source_word: μετανοίας
  choice: ìrònúpìwàdà
  rationale: Ọ̀rọ̀ yìí fi ìyípadà ọkàn àti ìwà sí Ọlọ́run hàn, kì í ṣe yíyan èrò padà lásán.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: fún ìdáríjì ẹ̀ṣẹ̀
  rationale: “Fún” lè gbé ète tàbí àbájáde inú εἰς, láì fipá yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan. “Ìdáríjì ẹ̀ṣẹ̀” sì jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún gbólóhùn náà.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìrìbọmi, ìrònúpìwàdà àti ìdáríjì
  choice: “ìrìbọmi ìrònúpìwàdà fún ìdáríjì ẹ̀ṣẹ̀”
  alternative: “ìrìbọmi tí ń ṣàpẹẹrẹ ìrònúpìwàdà fún ìdáríjì” tàbí “ìrìbọmi tí ń mú ìdáríjì wá nípasẹ̀ ìrònúpìwàdà”
  rationale: Èdè Gíríìkì sọ pé àwọn nǹkan wọ̀nyí ní ìbáṣepọ̀, ṣùgbọ́n kò fi dandan mú kí atúmọ̀ pinnu bóyá ìrìbọmi jẹ́ ohun èlò, àmì, tàbí ìkéde ìdáríjì. A pa àìmọ́tán àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “Onírìbọmi” gẹ́gẹ́ bí oyè tí ó wọ́pọ̀, “aginjù” fún ilẹ̀ tí kò ní olùgbé púpọ̀, àti “ó ń kéde” láti mú ìṣe alábápín Gíríìkì jáde ní ọ̀nà tí ó rọrùn láti lóye.
