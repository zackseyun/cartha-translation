source:
  edition: SBLGNT
  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: yo
  text: Wọ́n sì rí i, wọ́n sì sọ fún un pé, “Gbogbo ènìyàn ló ń wá ọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo wọn ló ń wá ọ.” Ọ̀rọ̀ Gíríìkì ζητοῦσίν tún lè túmọ̀ sí “ń ṣàwárí ọ”; ṣùgbọ́n nínú àyíká yìí, ó ṣeé ṣe kí ó túmọ̀ sí pé àwọn ènìyàn ń gbìyànjú láti rí ibi tí Jésù wà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: rí i
  rationale: 'Ọ̀rọ̀ náà ṣàpèjúwe àṣeyọrí ìwá wọn: wọ́n rí Jésù. ‘Rí i’ jẹ́ ọ̀nà àdánidá àti tààrà ní Yorùbá.'
- source_word: λέγουσιν
  choice: sọ fún un
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí historical present, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá mu níbí.
- source_word: ὅτι
  choice: pé, “…”
  rationale: ‘Pé’ fi ọ̀rọ̀ tí wọ́n sọ hàn lọ́nà àdánidá ní Yorùbá, àmì ọ̀rọ̀ taara sì pa ìsọ̀rọ̀ náà mọ́.
- source_word: Πάντες
  choice: Gbogbo ènìyàn
  rationale: Ó túmọ̀ sí gbogbo àwọn ènìyàn nínú ipò ìtàn yìí, láìfi dandan sọ pé gbogbo aráyé pátápátá.
- source_word: ζητοῦσίν σε
  choice: ló ń wá ọ
  rationale: ζητέω lè túmọ̀ sí ‘wá’ tàbí ‘ṣàwárí.’ Nínú àyíká yìí, àwọn ènìyàn ń gbìyànjú láti rí ibi tí Jésù wà; ‘ń wá ọ’ jẹ́ Yorùbá òde òní tí ó bá ìtumọ̀ náà mu.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ pa ìsopọ̀ καί àti ìṣàn ìtàn Mákù mọ́ láìfikún ìtumọ̀ tuntun.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: i / un / ọ
  rationale: 'A tú àwọn arọ́pò-orúkọ náà gẹ́gẹ́ bí ipa wọn nínú gbólóhùn: ẹni tí wọ́n rí, ẹni tí wọ́n bá sọ̀rọ̀, àti ẹni tí àwọn ènìyàn ń wá.'
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ní àmì ohùn níbi tí ó ti yẹ, tí ó sì rọrùn fún òǹkàwé òde òní. Ìtúmọ̀ náà pa àtúnsọ καί mọ́ pẹ̀lú ‘sì,’ ó sì lo ‘ń wá ọ’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún wíwá ẹni ní ti ara.
