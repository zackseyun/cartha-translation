  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọ Simoni tẹ̀lé fọ́ọ̀mù tí ó wọ́pọ̀ nínú Yorùbá Bíbélì. Ìtúmọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní.
