base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: yo
  text: Ìyá ìyàwó Simoni sì wà ní ìdùbúlẹ̀, ibà sì ń ṣe é; lẹ́sẹ̀kẹsẹ̀ ni wọ́n sọ fún un nípa rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ìṣe-ọrọ̀ náà wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ọ̀nà ìtàn tó ń mú ìṣẹ̀lẹ̀ sún mọ́ olùkà: “wọ́n ń sọ fún un nípa rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ Σίμωνος
  choice: Ìyá ìyàwó Simoni
  rationale: πενθερά túmọ̀ sí ìyá ọkọ tàbí ìyá ìyàwó; ní ọ̀rọ̀ nípa ọkùnrin bí Simoni, ‘ìyá ìyàwó Simoni’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ mother-in-law.
- source_word: κατέκειτο
  choice: dùbúlẹ̀
  rationale: Ọ̀rọ̀ náà fi ipò tó ń bá a lọ hàn pé ó wà ní ìdùbúlẹ̀; ‘dùbúlẹ̀’ jẹ́ èdè Yorùbá àdánidá láìfi kún un pé kò lè dìde rárá.
- source_word: πυρέσσουσα
  choice: ibà sì ń ṣe é
  rationale: Ẹ̀ka ọ̀rọ̀ yìí túmọ̀ sí pé ibà ń ṣe é; ìtumọ̀ yìí jẹ́ èdè Yorùbá tó wọ́pọ̀, ó sì pa ìṣe tó ń bá a lọ mọ́.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó tọ́ka sí ohun tí wọ́n ṣe láìjáfara, ó sì bá ìlò ọ̀rọ̀ yìí lemọ́lemọ́ nínú Máàkù mu.
- source_word: λέγουσιν αὐτῷ περὶ αὐτῆς
  choice: wọ́n sọ̀rọ̀ nípa rẹ̀ fún un
  rationale: ‘sọ̀rọ̀ nípa rẹ̀ fún un’ mú περί pẹ̀lú genitive jáde, ó sì jẹ́ Yorùbá tó ṣe kedere. A tú historical present náà sí ìtàn Yorùbá láìfi àmì àkókò àfikún sí i.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ níbí; ‘sì’ ń so gbólóhùn náà mọ́ ohun tó ṣáájú láìsọ ọ́ di ìtakora líle.
