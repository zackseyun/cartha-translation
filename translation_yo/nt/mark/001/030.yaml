review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì mọ́: ìyá ìyàwó Simoni, ìdùbúlẹ̀ nítorí ibà, ìmẹ́sẹ̀kẹsẹ̀, àti fífi ọ̀rọ̀ náà hàn fún un nípa obìnrin náà. Síbẹ̀, ‘sọ̀rọ̀ nípa rẹ̀ fún un’ kì í jẹ́ ọ̀nà Yorùbá tó rọrùn jù lọ fún λέγουσιν αὐτῷ περὶ αὐτῆς; ‘sọ fún un nípa rẹ̀’ ni ó sun mọ́ ‘wọ́n sọ fún un nípa rẹ̀/told him about her’ dáadáa.'
  naturalness: ‘Wà ní ìdùbúlẹ̀’ ṣe kedere síi ju ‘dùbúlẹ̀’ nínú ìtàn yìí, nítorí ó fi ipò tí ó ń bá a lọ hàn. ‘Wọ́n sọ fún un nípa rẹ̀’ jẹ́ ìlò Yorùbá àdánidá, ó sì yẹ fún ìforúkọsílẹ̀ ìtàn.
  terminology: ‘Ìyá ìyàwó Simoni’ jẹ́ ọ̀nà tó ṣe kedere fún πενθερὰ Σίμωνος nínú àyíká ọkùnrin náà. ‘Ibà ń ṣe é’ jẹ́ ọ̀rọ̀ òde òní tó bójú mu fún πυρέσσουσα. A ti pa ‘Simoni’ àti àmì ohùn mọ́.
