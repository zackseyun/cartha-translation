  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: yo
  text: Ìbẹ̀rẹ̀ ìhìn rere[a] Jésù Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú ọ̀rọ̀ Gíríìkì náà sí “ìhìnrere,” ọ̀rọ̀ ìbílẹ̀ tí a máa ń lò fún ìhìn rere yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός túmọ̀ sí “Mèsáyà” nígbà tí a bá lò ó gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Ìbẹ̀rẹ̀
  rationale: Ọ̀rọ̀ orúkọ yìí bá ìṣípayá kúkúrú tí ó dà bí àkọlé mu, kò sì fi gbolohun-ìṣe kún ohun tí Gíríìkì kò sọ.
- source_word: εὐαγγελίου
  choice: ìhìn rere
  rationale: Èyí tú ìtumọ̀ ọ̀rọ̀ Gíríìkì náà jáde ní èdè Yorùbá tí ó ṣe kedere, dípò lílo ọ̀rọ̀ ẹ̀sìn kan láìṣàlàyé.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìlànà àkọtọ Yorùbá tí ó wọ́pọ̀.
- source_word: χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Jésù, kì í ṣe bí orúkọ ìdílé; “Mèsáyà” pa agbára oyè náà mọ́.
theological_decisions:
- issue: Bóyá kí Χριστός jẹ́ oyè tí a túmọ̀ sí “Mèsáyà” tàbí kí a pa fọ́ọ̀mù ìbílẹ̀ “Kristi” mọ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ìṣètò ọ̀rọ̀ náà ń dá Jésù mọ̀ nípasẹ̀ ipò Mèsáyà rẹ̀. Yíyan “Mèsáyà” mú kí oyè náà hàn gbangba láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìbáṣepọ̀ genitive nínú “εὐαγγελίου Ἰησοῦ”
  choice: ìhìn rere Jésù
  alternative: ìhìn rere nípa Jésù / ìhìn rere láti ọ̀dọ̀ Jésù
  rationale: Gíríìkì lè tọ́ka sí ìhìn rere nípa Jésù tàbí èyí tí ó wá láti ọ̀dọ̀ rẹ̀. Ìsopọ̀ orúkọ Yorùbá tí a lò kò fi tipátipá yan ọ̀kan nínú méjèèjì.
translation_notes:
  register: Èdè náà kúkúrú, lọ́lá, ó sì bá ìṣípayá tí ó dà bí àkọlé mu. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àìdánilójú ìbáṣepọ̀ genitive mọ́.
