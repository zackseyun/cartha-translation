  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀ lẹ́yìn tí wọ́n jáde nínú sínágọ́gù, wọ́n lọ sí ilé Símónì àti Àńdérù, pẹ̀lú Jákọ́bù àti Jòhánù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára ìtàn Máàkù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἐκ τῆς συναγωγῆς
  choice: kúrò nínú sínágọ́gù
  rationale: Àpapọ̀ ‘kúrò nínú’ fi ìṣípò láti inú ilé náà hàn ní kedere, ní ìbámu pẹ̀lú ἐκ àti ọ̀rọ̀ ìṣe ‘jáde.’
- source_word: ἐξελθόντες ἦλθον
  choice: nígbà tí wọ́n jáde ... wọ́n lọ
  rationale: 'Èyí pa ìtẹ̀lé àwọn ìṣe méjèèjì mọ́: wọ́n kọ́kọ́ jáde, lẹ́yìn náà wọ́n lọ sí ilé náà. ‘Wọ́n lọ’ jẹ́ èdè Yorùbá àdánidá láti ojú-ìwòye ibi tí wọ́n ti kúrò.'
- source_word: εἰς τὴν οἰκίαν
  choice: sí ilé
  rationale: ‘Sí ilé’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò sí ibi tí a ń lọ; ọ̀rọ̀ ìṣe ‘wọ́n lọ’ mú ìtọ́sọ́nà náà ṣe kedere.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: Símónì àti Áńdérù
  rationale: Àwọn orúkọ tó tẹ̀ lé ‘ilé’ ń fi àwọn ẹni tí ilé náà jẹ́ tiwọn hàn lọ́nà Yorùbá àdánidá.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: pẹ̀lú Jákọ́bù àti Jòhánù
  rationale: ‘Pẹ̀lú’ túmọ̀ ìbákẹ́gbẹ́ tí μετά pẹ̀lú génítífù ń sọ ní tààrà.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Símónì / Áńdérù / Jákọ́bù / Jòhánù
  rationale: A lo àwọn ìrísí orúkọ tí ó wọ́pọ̀, tí ó sì ṣe kedere nínú Yorùbá Bíbélì.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó lọ́lá, tí ó sì yé àwọn òǹkàwé òde òní; a fi àmì ohùn síbi tí ó bá yẹ. Ìtumọ̀ náà tẹ̀ lé ìtẹ̀síwájú ìtàn yíyára ti Máàkù láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
