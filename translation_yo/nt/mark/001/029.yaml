  source_fidelity: 'Ìtumọ̀ náà ń gbé gbogbo àwọn apá pàtàkì ti Gíríìkì kalẹ̀: ìmúrasílẹ̀ ìtàn (εὐθύς), jíjáde kúrò nínú sínágọ́gù, lílọ sí ilé náà, àwọn olú-ilé, àti ìbákẹ́gbẹ́ Jákọ́bù àti Jòhánù. Síbẹ̀, ‘nígbà tí’ lè sọ pé àwọn ìṣe méjèèjì ń ṣẹlẹ̀ ní àkókò kan náà, níbi tí ἐξελθόντες fi ìṣe tó ṣáájú hàn. ‘Lẹ́yìn tí’ dá ìtẹ̀lé náà hàn dáadáa.'
