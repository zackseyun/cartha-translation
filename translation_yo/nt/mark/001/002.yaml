  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó pa ìlànà ìtọ́kasí, ìránṣẹ́, ìṣe ìsinsìnyí nínú àyọlò, àti ìlérí ọjọ́ iwájú mọ́. Síbẹ̀, fífi “ìwé” kún ìtọ́kasí náà kò sí nínú Gíríìkì, àti “pèsè ọ̀nà” lè túmọ̀ sí pípèsè ọ̀nà kan dípò ṣíṣe ọ̀nà náà ṣetán.'
  naturalness: “Gẹ́gẹ́ bí a ti kọ ọ́ nínú Àìsáyà wòlíì” jẹ́ ọ̀nà ìtọ́kasí Ìwé Mímọ́ tí ó dára ní Yorùbá. “Yóò mú ọ̀nà rẹ ṣetán” sọ κατασκευάσει ní kedere àti ní èdè Yorùbá àdánidá. A tún ṣàtúnṣe ọ̀rọ̀ àlàyé ìsàlẹ̀ [b] kí ó lè rọrùn, kí ó sì pe.
  terminology: “Ìránṣẹ́” bá ἄγγελος mu nínú àyíká yìí; kò fi ipò áńgẹ́lì ọ̀run lé e lórí. “Wò ó” pa ohùn àsọtẹ́lẹ̀ Ἰδού mọ́. “Àìsáyà wòlíì” ń tẹ̀lé ìka SBLGNT, nígbà tí àyípadà “àwọn wòlíì” wà nínú àlàyé ìsàlẹ̀.
