source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: yo
  text: "Gẹ́gẹ́ bí a ti kọ ọ́ nínú Àìsáyà wòlíì[a] pé:\n\n“Wò ó, mo ń rán ìránṣẹ́ mi ṣáájú rẹ[c],\n ẹni tí yóò mú ọ̀nà rẹ ṣetán.”[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “nínú àwọn wòlíì” dípò “nínú Àìsáyà wòlíì.”
    reason: textual_variant
  - marker: b
    text: Ọ̀rọ̀ láti Málákì 3:1 àti Àìsáyà 40:3 ni a dapọ̀ nínú ìyọlò yìí.
    reason: cross_reference
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “níwájú rẹ.” Ní ti gidi, “níwájú ojú rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó fi ìbámu pẹ̀lú ohun tí Ìwé Mímọ́ ti kọ sílẹ̀ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ó ṣàfihàn ipò ohun tí a ti kọ sílẹ̀ tí ó sì ṣì dúró gẹ́gẹ́ bí ẹ̀rí Ìwé Mímọ́.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: sínú ìwé Àìsáyà wòlíì
  rationale: Fífi “ìwé” kún un mú ọ̀nà ìtọ́kasí náà ṣe kedere ní Yorùbá láì yí ẹni tí Gíríìkì dárúkọ padà.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ àsọtẹ́lẹ̀ tí ń pe olùgbọ́ láti kíyè sí ohun tí ń bọ̀ mọ́.
- source_word: ἀποστέλλω
  choice: mo ń rán
  rationale: Àmì “ń” mú ìṣe ìsinsìnyí tí ó ní agbára àsọtẹ́lẹ̀ hàn, dípò kí “mo rán” dà bí ohun tó ti ṣẹlẹ̀.
- source_word: ἄγγελόν
  choice: ìránṣẹ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹni tí a rán níwájú, kì í ṣe dandan áńgẹ́lì ọ̀run.
- source_word: πρὸ προσώπου σου
  choice: ṣáájú rẹ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbolohun tí ó túmọ̀ ní ti gidi sí “níwájú ojú rẹ.”
- source_word: κατασκευάσει
  choice: yóò pèsè
  rationale: Ó fi ìtumọ̀ ṣíṣe ohun sílẹ̀ de ẹni tí ń bọ̀ hàn ní ṣókí.
- source_word: τὴν ὁδόν σου
  choice: ọ̀nà rẹ
  rationale: Ó pa àwòrán ọ̀nà mọ́, pẹ̀lú ìtumọ̀ gidi àti ti àpèjúwe rẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ ìtọ́kasí náà dárúkọ Àìsáyà nìkan, bí ó tilẹ̀ jẹ́ pé àyọlò náà ní ọ̀rọ̀ tó bá Málákì 3:1 àti Àìsáyà 40:3 mu.
  choice: Àìsáyà wòlíì
  alternative: àwọn wòlíì
  rationale: Èyí tẹ̀ lé àkọsílẹ̀ SBLGNT, kò sì gbìyànjú láti mú ìtọ́kasí náà bá àwọn orísun méjèèjì mu nípa yíyí ọ̀rọ̀ pàtàkì padà. Àyípadà inú àwọn àfọwọ́kọ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. “Wò ó” dá ohùn àsọtẹ́lẹ̀ dúró; “ṣáájú rẹ” sì jẹ́ àdánidá ju títú “níwájú ojú rẹ” lọ ní ọ̀rọ̀ pàtàkì.
