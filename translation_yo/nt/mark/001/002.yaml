revisions:
- from: 'Gẹ́gẹ́ bí a ti kọ ọ́ sínú ìwé Àìsáyà wòlíì[a] pé:


    “Wò ó, mo ń rán ìránṣẹ́ mi ṣáájú rẹ[c],

    ẹni tí yóò pèsè ọ̀nà rẹ.”[b]'
  to: "Gẹ́gẹ́ bí a ti kọ ọ́ nínú Àìsáyà wòlíì[a] pé:\n\n“Wò ó, mo ń rán ìránṣẹ́ mi ṣáájú rẹ[c],\n ẹni tí yóò mú ọ̀nà rẹ ṣetán.”[b]"
  rationale: A yọ ìfikún “ìwé” kúrò kí ìtọ́kasí náà lè bá Gíríìkì ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ mu. A rọ́pò “pèsè ọ̀nà rẹ” pẹ̀lú “mú ọ̀nà rẹ ṣetán” láti sọ ìtumọ̀ κατασκευάσει ní kedere láì pa àwòrán ọ̀nà mọ́. A tún mú ọ̀rọ̀ àlàyé ìsàlẹ̀ [b] di Yorùbá tó rọrùn, tó sì péye.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:00Z'
