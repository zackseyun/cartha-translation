id: MRK.1.9
reference: Mark 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní àwọn ọjọ́ wọ̀nyẹn pé Jésù wá láti Násárẹ́tì ní Gálílì, Jòhánù sì ṣe ìbatisí fún un ní Jọ́dánì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínú Jọ́dánì.” Ìfàrọ̀pò-ọrọ Gíríìkì náà lè túmọ̀ sí “sínú” ní tààràtà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó fi ìyípadà ìtàn àti ìṣẹ̀lẹ̀ tuntun hàn ní Yorùbá òde òní láì lo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò ṣe déédé.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ wọnnì
  rationale: Ó tẹ̀ lé ìtọ́kasí àkókò inú Gíríìkì, ó sì ní ìró àkọsílẹ̀ ìtàn tí ó bójú mu.
- source_word: ἦλθεν
  choice: wá
  rationale: Èyí ni ọ̀rọ̀ ìṣípò ibi tí ó rọrùn, tí ó sì bá ἦλθεν mu láì fi ìtumọ̀ míì kún un.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ tí a ti mú bá ìkọ̀wé àti ìpè Yorùbá mu.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: láti Násárẹ́tì ní Gálílì
  rationale: ‘Ní Gálílì’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi mọ ibi tí Násárẹ́tì wà, nígbà tí ó ṣì pa ìbáṣepọ̀ àwọn ibi méjèèjì mọ́.
- source_word: ἐβαπτίσθη
  choice: Jòhánù sì batisí rẹ̀
  rationale: Yorùbá sábà máa ń fi gbólóhùn aṣolùṣe hàn lọ́nà àdánidá ju ìṣe aláìlórúkọ lọ; ‘batisí’ pa ìtumọ̀ ìṣe náà mọ́ láì pinnu ọ̀nà ìbatisí kan pàtó.
- source_word: εἰς τὸν Ἰορδάνην
  choice: ní odò Jọ́dánì
  rationale: ‘Ní’ sọ ibi tí ìbatisí náà ti wáyé ní Yorùbá àdánidá; àfikún ‘odò’ mú kí orúkọ ibi náà yé òǹkàwé, bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ‘Jọ́dánì’ nìkan.
- source_word: ὑπὸ Ἰωάννου
  choice: Jòhánù sì batisí rẹ̀
  rationale: A yí aṣolùṣe inú gbólóhùn aláìṣe Gíríìkì padà sí olùṣe gbangba ní Yorùbá, ṣùgbọ́n Jòhánù ṣì jẹ́ ẹni tó ṣe ìbatisí náà.
theological_decisions:
- issue: Ìtumọ̀ βαπτίζω ní ibi tí àwọn ẹ̀kọ́ ìjọ lè yàtọ̀
  choice: batisí rẹ̀
  alternative: rì í sínú omi
  rationale: ‘Batisí’ jẹ́ ọ̀rọ̀ tó gbòòrò tó sì mọ́ sí àwọn Kristẹni Yorùbá; kò fi ọ̀nà ìbatisí kan ṣoṣo múlẹ̀ ju ohun tí ẹsẹ̀ náà sọ lọ.
- issue: Bí a ṣe máa túmọ̀ εἰς pẹ̀lú Jọ́dánì
  choice: ní odò Jọ́dánì
  alternative: sínú odò Jọ́dánì
  rationale: ‘Ní’ jẹ́ ọ̀nà Yorùbá tó rọrùn fún ibi ìṣẹ̀lẹ̀ náà, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ ìṣípò ‘sínú’ tí εἰς lè ní mọ́.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ṣe àdánidá. A yan ìtòlẹ́sẹẹsẹ aṣolùṣe fún ìṣe ìbatisí nítorí pé ó dùn mọ́ etí Yorùbá ju gbólóhùn aláìṣe lọ; a sì pa gbogbo àkóónú orísun mọ́.
