  to: Ó sì ṣẹlẹ̀ ní àwọn ọjọ́ wọ̀nyẹn pé Jésù wá láti Násárẹ́tì ní Gálílì, Jòhánù sì ṣe ìbatisí fún un ní Jọ́dánì[a].
