  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: yo
  text: Ẹ̀mí àìmọ́ náà sì mú un gbọ̀n jìgìjìgì[a], ó sì ké ní ohùn ńlá[b], ó sì jáde kúrò nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú un gbọ̀n líle.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó pa igbe ńlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαράξαν
  choice: mú kí ara ọkùnrin náà gbọ̀n jìgìjìgì
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ẹ̀mí náà ṣe mú kí ara ọkùnrin náà gbọ̀n líle kí ó tó jáde. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún ìtumọ̀ ‘ya’ tí ó lè dà bí ẹni pé ó fa ara rẹ̀ ya ní ti gidi.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: Ẹ̀mí àìmọ́ náà
  rationale: ‘Ẹ̀mí àìmọ́’ pa èrò àìmọ́ nípa ẹ̀sìn àti ìwà búburú mọ́, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀ láti pe ẹ̀mí búburú nínú àwọn ìtàn Ìhìn Rere.
- source_word: φωνῆσαν
  choice: ó sì ké
  rationale: Èyí fi ohùn líle tí ẹ̀mí náà pa hàn láì fi ìmọ̀lára kan tí Gíríìkì kò sọ kún un.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ohùn tí ó ga tí ó sì lágbára, ó sì pa àwòrán ‘ohùn’ inú Gíríìkì mọ́.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: ó jáde kúrò lára rẹ̀
  rationale: Èyí ṣe àfihàn ní kedere pé ẹ̀mí náà fi ọkùnrin náà sílẹ̀, ó sì pa ìtumọ̀ ibi àti ẹni tí gbólóhùn Gíríìkì ní mọ́.
- source_word: καὶ ... καὶ
  choice: sì ... ó sì
  rationale: Ìlò ‘sì’ pa ìṣàn ìtàn àti ìsopọ̀ àwọn ìṣe Marku mọ́ ní Yorùbá tí ó ṣe déédé.
theological_decisions:
- issue: Irú ẹni tàbí ohun tí ẹ̀mí tí ó wọ ọkùnrin náà jẹ́
  choice: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ẹ̀mí búburú tí ó ń ṣe bí aṣojú alààyè
  alternative: Agbára búburú tí kì í ṣe ẹni
  rationale: 'Nínú ìtàn Marku, ẹ̀mí àìmọ́ náà ń gbé ìgbésẹ̀ fúnra rẹ̀: ó mú ara ọkùnrin náà gbọ̀n, ó ké, ó sì jáde. Ìtumọ̀ náà pa ìṣe ẹni yìí mọ́ láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún ọ̀rọ̀ náà.'
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. ‘Ọkùnrin náà’ mú ẹni tí αὐτόν ń tọ́ka sí ṣe kedere ní Yorùbá, nígbà tí ‘lára rẹ̀’ ń tọ́ka padà sí ọkùnrin náà. Ìtẹ̀lé ìṣe—gbígbọ̀n, kíké, àti jíjáde—ni a pa mọ́.
