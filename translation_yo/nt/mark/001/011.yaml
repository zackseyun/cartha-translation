  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: yo
  text: Ohùn kan sì wá láti àwọn ọ̀run[a] pé, “Ìwọ ni Ọmọ mi tí mo fẹ́ràn; inú mi dùn sí ọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “láti ọ̀run.” Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀: “láti àwọn ọ̀run.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú rẹ ni mo ní ìtẹ́lọ́rùn,” tàbí “inú mi ti dùn sí ọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Ohùn kan sì wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohùn kan bẹ̀rẹ̀ sí í jáde ní ìṣẹ̀lẹ̀ náà, láìtumọ́ gbolohun Gíríìkì náà ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ lọ́nà tí kò ní dùn létí.
- source_word: ἐκ τῶν οὐρανῶν
  choice: láti àwọn ọ̀run
  rationale: A pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́ ní ‘àwọn ọ̀run’; ó ṣe kedere, ó sì bójú mu ní Yorùbá. A fi ‘láti ọ̀run’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tí ó wọ́pọ̀.
- source_word: Σὺ εἶ
  choice: Ìwọ ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba nínú Gíríìkì mú kí ọ̀rọ̀ náà dojú kọ Jésù tààrà; ‘Ìwọ ni’ pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
- source_word: ὁ υἱός μου
  choice: Ọmọ mi
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún ọ̀rọ̀ ìbátan ọmọ pẹ̀lú arọ́pò-orúkọ ohun-ìní. Lílò lẹ́tà ńlá fún ‘Ọmọ’ bá ìtọ́kasí pàtó sí Jésù nínú ọ̀rọ̀ Ọlọ́run mu.
- source_word: ὁ ἀγαπητός
  choice: olùfẹ́
  rationale: ‘Olùfẹ́’ jẹ́ ọ̀rọ̀ Yorùbá ọlọ́lá, kúkúrú, tí ó sì sọ ẹni tí a fẹ́ràn gidigidi; ó bá ìtumọ̀ ἀγαπητός mu láìfi àlàyé ẹ̀kọ́ míì kún un.
- source_word: ἐν σοὶ
  choice: sí ọ
  rationale: Nínú àṣà èdè Yorùbá, ‘inú mi dùn sí ọ’ ni ọ̀nà àdánidá láti sọ ìtẹ́lọ́rùn sí ẹni kan. Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní tààrà sí ‘nínú,’ gbólóhùn ‘inú mi dùn nínú rẹ’ kì í ṣe Yorùbá àdánidá.
- source_word: εὐδόκησα
  choice: inú mi dùn
  rationale: Ọ̀rọ̀ yìí fi ìtẹ́lọ́rùn àti inú dídùn Ọlọ́run hàn ní Yorùbá tó ṣe kedere. Ó tún jẹ́ kí agbára ọ̀rọ̀ ìkéde náà wà ní báyìí, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ aorist.
theological_decisions:
- issue: Bí a ṣe máa pa agbára ọ̀rọ̀ Ọlọ́run sí Jésù mọ́ láìfi ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ẹsẹ náà
  choice: Ọmọ mi olùfẹ́
  alternative: Ọmọ mi, ẹni olùfẹ́ náà; Ọmọ mi tí mo fẹ́ràn gidigidi
  rationale: Ọ̀rọ̀ yìí pa ìdánimọ̀ Jésù gẹ́gẹ́ bí Ọmọ àti ìfẹ́ Ọlọ́run sí i mọ́, ṣùgbọ́n kò fi àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà kún un.
- issue: Bóyá a ó sọ οὐρανῶν ní nọ́ńbà púpọ̀ tàbí kí a mú un rọrùn sí nọ́ńbà kan ṣoṣo
  choice: láti àwọn ọ̀run
  alternative: láti ọ̀run
  rationale: Nọ́ńbà púpọ̀ inú orísun Gíríìkì ni a pa mọ́ nínú àkọ́kọ́; nọ́ńbà kan ṣoṣo tí ó wọ́pọ̀ nínú Yorùbá wà nínú àlàyé ìsàlẹ̀.
- issue: Bí a ṣe máa sọ ἐν σοὶ εὐδόκησα ní Yorùbá láìdín ìtẹ́lọ́rùn Ọlọ́run kù
  choice: inú mi dùn sí ọ
  alternative: nínú rẹ ni mo ní inú dídùn; inú mi ti dùn sí ọ
  rationale: Ìtumọ̀ tí a yàn jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìtẹ́lọ́rùn àti ayọ̀ Ọlọ́run sí Jésù mọ́. Àwọn ìtumọ̀ míì fi ìrísí ọ̀rọ̀ Gíríìkì tàbí apá àsìkò aorist hàn sí i, ṣùgbọ́n wọn kò dùn létí tó bẹ́ẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ohùn kan sì wá’ pa ìṣàn ìtàn mọ́; ‘inú mi dùn sí ọ’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìkéde ìtẹ́lọ́rùn.
