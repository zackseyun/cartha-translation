  to: Ní kùtùkùtù òwúrọ̀ gan-an, nígbà tí òkùnkùn ṣì wà, ó dìde, ó jáde, ó sì lọ sí ibi ahoro[a], ó sì ń gbàdúrà níbẹ̀.
