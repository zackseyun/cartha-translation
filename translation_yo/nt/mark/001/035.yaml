id: MRK.1.35
reference: Mark 1:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀ gan-an, nígbà tí òkùnkùn ṣì wà, ó dìde, ó jáde, ó sì lọ sí ibi ahoro[a], ó sì ń gbàdúrà níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibi tí kò sí ènìyàn” tàbí “ibi àdádó.” Ọ̀rọ̀ Gíríìkì náà lè ṣàpèjúwe ibi tí ènìyàn kò gbé, ibi ahoro, tàbí ibi aginjù.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: ní kùtùkùtù òwúrọ̀ gan-an, nígbà tí ilẹ̀ ṣì ṣókùnkùn
  rationale: Àpapọ̀ gbólóhùn yìí fi hàn pé ó jẹ́ ní òwúrọ̀ kùtùkùtù gan-an, nígbà tí òkùnkùn ṣì wà. Èyí jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ náà ní Yorùbá láì sọ ìtẹnumọ́ rẹ̀ nù.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Ó ṣàfihàn ìṣe tí ó ṣáájú àwọn ọ̀rọ̀-ìṣe pàtàkì tó tẹ̀ lé e, ó sì bá ìtẹ̀síwájú ìtàn mu ní Yorùbá.
- source_word: ἐξῆλθεν
  choice: ó jáde
  rationale: Ó pa ìtumọ̀ ìṣípò kúrò ní ibi tí ó wà mọ́, ó sì jẹ́ kí ọ̀rọ̀-ìṣe yìí yàtọ̀ sí ἀπῆλθεν.
- source_word: ἀπῆλθεν
  choice: ó sì lọ
  rationale: Ó fi ìṣípò lọ sí ibòmíràn hàn lẹ́yìn tí ó jáde, láì da àwọn ọ̀rọ̀-ìṣe méjèèjì pọ̀.
- source_word: εἰς ἔρημον τόπον
  choice: sí ibi ahoro[a]
  rationale: “Ibi ahoro” lè ṣàfihàn ibi tí ènìyàn kò gbé tàbí ibi tó dá wà. Àkọ́lé ìsàlẹ̀ fi àwọn ìtumọ̀ míì tó ṣeé ṣe hàn láì pinnu pé aginjù gẹ́gẹ́ bí agbègbè ilẹ̀ pàtó ni.
- source_word: κἀκεῖ
  choice: níbẹ̀ ni ó sì
  rationale: Ó pa ìsopọ̀ ìtàn àti ibi tí ìṣe náà ti ṣẹlẹ̀ mọ́ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: προσηύχετο
  choice: ó ń gbàdúrà
  rationale: Àmì “ń” ṣàfihàn pé ìṣe àdúrà náà ń lọ lọ́wọ́, gẹ́gẹ́ bí ìrísí ọ̀rọ̀-ìṣe aláìpé nínú Gíríìkì.
theological_decisions:
- issue: Ìtẹnumọ́ ìtàn lórí àdúrà Jésù
  choice: A sọ ìṣẹ̀lẹ̀ náà ní tààràtà pé Jésù lọ sí ibi ahoro, ó sì ń gbàdúrà.
  alternative: Láti fi kún un pé ó ṣe bẹ́ẹ̀ láti kọ́ àwọn ọmọ-ẹ̀yìn ní àṣà ìdákẹ́jẹ tàbí láti ṣàlàyé ẹ̀kọ́ nípa ìgbẹ́kẹ̀lé rẹ̀ nínú àdúrà.
  rationale: Ẹsẹ náà sọ ìṣe Jésù nìkan; kò ṣàlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀. Nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Kùtùkùtù òwúrọ̀ gan-an” àti “ilẹ̀ ṣì ṣókùnkùn” jẹ́ ọ̀nà tí ó rọrùn fún òǹkàwé láti lóye ìtẹnumọ́ àkókò; “ó ń gbàdúrà” sì pa ìṣe tó ń lọ lọ́wọ́ mọ́.
