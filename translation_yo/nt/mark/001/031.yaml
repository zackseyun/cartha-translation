source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: yo
  text: Ó sì sún mọ́ ọn, ó di ọwọ́ rẹ̀ mú, ó sì gbé e dìde; ibà náà sì fi í sílẹ̀, ó sì ń ṣe ìránṣẹ́ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “ó bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún wọn.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè ṣàpèjúwe pé ó ń ṣe ìránṣẹ́, ṣùgbọ́n àyíká náà tún lè fi hàn pé ó bẹ̀rẹ̀ sí í ṣe bẹ́ẹ̀ lẹ́sẹ̀kẹsẹ̀ lẹ́yìn tí ibà náà fi í sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Ó sì sún mọ́ ọn
  rationale: Aorist participle náà fi hàn pé Jésù kọ́kọ́ sún mọ́ obìnrin náà kí ó tó gbé e dìde; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì ṣàfikún ohun tí Gíríìkì kò sọ.
- source_word: ἤγειρεν αὐτήν
  choice: ó sì gbé e dìde
  rationale: ἐγείρω túmọ̀ sí gbígbé ẹnì kan dìde níbí. ‘Gbé e dìde’ pa agbára ọ̀rọ̀ náà mọ́ ju ‘ràn án lọ́wọ́ láti dìde’ lọ, ó sì lè pa ìró èdè Máàkù mọ́ láìsọ pé àjíǹde ni ìṣẹ̀lẹ̀ náà.
- source_word: κρατήσας τῆς χειρός
  choice: ó dì í mú ní ọwọ́
  rationale: κρατέω jẹ́ dídì mú tàbí mímú ṣinṣin; genitive χείρ náà jẹ́ ọ̀nà Gíríìkì láti sọ pé ó mú un ní ọwọ́. Ètò ọ̀rọ̀ Yorùbá yìí jẹ́ kedere, ó sì fi ohun tí ó bá gbígbé e dìde lọ hàn.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ibà náà sì fi í sílẹ̀
  rationale: ἀφίημι níbí túmọ̀ sí pé àìsàn náà kúrò lára rẹ̀. ‘Fi í sílẹ̀’ tún pa bí Gíríìkì ṣe fi ibà náà hàn bí ẹni tó ń ṣe ìṣe mọ́.
- source_word: διηκόνει αὐτοῖς
  choice: ó sì ń ṣe ìránṣẹ́ fún wọn
  rationale: Imperfect διηκόνει lè ṣàpèjúwe ìṣe tó ń lọ lọ́wọ́ lẹ́yìn ìwòsàn náà. ‘Ń ṣe ìránṣẹ́ fún wọn’ pa àìdájú náà mọ́, kò sì fi dandan sọ pé ‘ó bẹ̀rẹ̀ sí í’ ṣe bẹ́ẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká lè tọ́ka sí ìbẹ̀rẹ̀ lẹ́sẹ̀kẹsẹ̀.
theological_decisions:
- issue: Ìró ἐγείρω pẹ̀lú èdè àjíǹde
  choice: ó gbé e dìde
  alternative: ó ràn án lọ́wọ́ láti dìde
  rationale: ‘Gbé e dìde’ bá ìtumọ̀ ara ní àyíká ìwòsàn mu, ó sì pa yíyan ọ̀rọ̀ Máàkù mọ́ láìfi ẹ̀kọ́ àjíǹde tí ẹsẹ yìí kò sọ ní tààrà sí i.
- issue: Bóyá imperfect διηκόνει túmọ̀ sí ìbẹ̀rẹ̀ ìṣe
  choice: ó ń ṣe ìránṣẹ́ fún wọn
  alternative: ó bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún wọn
  rationale: Fọ́ọ̀mù Gíríìkì lè jẹ́ ìṣe tó ń lọ tàbí ìṣe tó bẹ̀rẹ̀ nígbà náà. Àkọ́kọ́ pa àìdájú gírámà mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
translation_notes:
  register: Yorùbá àfẹnusọ tí ó bójú mu, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; ‘ṣe ìránṣẹ́’ yẹ fún iṣẹ́ àlejò inú ilé, kò sì ní ìró ọ̀rọ̀ ṣọ́ọ̀ṣì tó pọ̀.
