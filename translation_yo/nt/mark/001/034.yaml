source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: yo
  text: Ó sì wo ọ̀pọ̀ ènìyàn tí onírúurú àrùn ń ṣe sàn, ó sì lé ọ̀pọ̀ ẹ̀mí èṣù jáde. Kò sì jẹ́ kí àwọn ẹ̀mí èṣù náà sọ̀rọ̀, nítorí wọ́n mọ̀ ọ́n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n mọ ẹni tí òun jẹ́.” Èdè Gíríìkì kàn sọ pé, “wọ́n mọ̀ ọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: wo ... sàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú aláìsàn láradá; ‘wo ... sàn’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé, tí ó sì bójú mu nínú ìtàn iṣẹ́ ìwòsàn Jésù.
- source_word: πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις
  choice: ọ̀pọ̀ àwọn tí onírúurú àrùn ń ṣe
  rationale: Gbólóhùn κακῶς ἔχω jẹ́ àpólà èdè fún jíjẹ́ aláìsàn, ποικίλος sì fi hàn pé oríṣiríṣi ni àwọn àrùn náà; yíyí rẹ̀ sí Yorùbá báyìí jẹ́ adayébá, ó sì pa ìtumọ̀ mọ́.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: lé ọ̀pọ̀ ẹ̀mí èṣù jáde
  rationale: ‘Lé ... jáde’ fi agbára ìtújáde inú ἐκβάλλω hàn, ‘ẹ̀mí èṣù’ sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún δαιμόνιον nínú àyíká yìí.
- source_word: οὐκ ἤφιεν
  choice: Kò sì jẹ́ kí
  rationale: Ìlò yìí jẹ́ Yorùbá adayébá fún àìfàyè gba; nínú ìtàn náà ó tún lè gbé ìṣe tí Jésù ń bá a lọ láti máa dí lọ́wọ́.
- source_word: λαλεῖν
  choice: sọ̀rọ̀
  rationale: ‘Sọ̀rọ̀’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún λαλεῖν.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι ṣe àlàyé ìdí tí Jésù kò fi jẹ́ kí wọ́n sọ̀rọ̀; ‘nítorí’ mú ìbáṣepọ̀ ìdí yẹn hàn kedere.
- source_word: ᾔδεισαν αὐτόν
  choice: wọ́n mọ̀ ọ́n
  rationale: Èdè Gíríìkì ní àfọ̀mọ́ taara ‘òun’ nìkan; ‘wọ́n mọ̀ ọ́n’ pa ìsọ̀rọ̀ kúkúrú àti àìṣàlàyé ìdánimọ̀ rẹ̀ mọ́.
theological_decisions:
- issue: Bóyá a ó sọ ìmọ̀ àwọn ẹ̀mí èṣù nípa Jésù di ìjẹ́wọ́ Krístì ní kedere
  choice: wọ́n mọ̀ ọ́n
  alternative: wọ́n mọ ẹni tí ó jẹ́; wọ́n mọ̀ pé òun ni Mèsáyà/Ọmọ Ọlọ́run
  rationale: Àyọkà náà sọ pé wọ́n mọ òun, kò sì sọ ìdánimọ̀ pàtó sí i. Ìtumọ̀ yìí kò kó àlàyé láti àwọn ẹsẹ tó wà nítòsí wọ inú ẹsẹ yìí, ó sì pa ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘ẹ̀mí èṣù’ láti jẹ́ kí δαιμόνια yé ni kedere, a sì yà àwọn gbólóhùn sí méjì fún ìṣàn ọ̀rọ̀ adayébá láìyí èrò Gíríìkì padà.
