  naturalness: 'Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá tó yé ẹni. Fífún ‘ènìyàn’ ní ìpìlẹ̀ ‘ọ̀pọ̀’ mú kókó ẹni tí a wò sàn hàn kedere. Àtúnṣe pàtàkì ni nínú àlàyé ìsàlẹ̀: ‘wọ́n mọ ẹni tí ó jẹ́’ kò rọrùn tó, nígbà tí ‘wọ́n mọ ẹni tí òun jẹ́’ jẹ́ ìlò Yorùbá tó mọ́gbọ́n dání fún ‘they knew who he was.’'
