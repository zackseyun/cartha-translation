id: MRK.1.12
reference: Mark 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, Ẹ̀mí náà sì lé e jáde sínú aginjù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “rán an jáde.” Ọ̀rọ̀-ìṣe Gíríìkì náà lágbára; fi wé bí Máàkù ṣe máa ń lo ọ̀rọ̀-ìṣe kan náà nígbà púpọ̀ fún lílé àwọn ẹ̀mí èṣù jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn tó wọ́pọ̀ ní Yorùbá; ó ń tẹ̀síwájú nínú ìṣàn ìtàn Máàkù láì fi ìtumọ̀ míì kún un.
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí mú ìyára àti ìkánjú tó jẹ́ àbùdá ìtàn Máàkù hàn ní Yorùbá òde òní.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Àtẹ̀jáde yìí pa àpólà onípàtó Gíríìkì mọ́, ó sì ń tọ́ka sí Ẹ̀mí tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn nígbà ìbatisí Jésù, láì fi “Mímọ́” kún ohun tí ẹsẹ yìí sọ ní tààràtà.
- source_word: αὐτὸν
  choice: e
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí ìṣe náà dé bá; ìkọ̀wé “lé e” jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐκβάλλει
  choice: lé e jáde lọ
  rationale: “Lé … jáde” pa agbára ọ̀rọ̀-ìṣe Gíríìkì mọ́ ju “mú un lọ” tàbí “rán an” lọ, “lọ” sì mú ìṣípò sí ibi tí a mẹ́nu kàn ṣe kedere ní Yorùbá.
- source_word: εἰς τὴν ἔρημον
  choice: sínú aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá tí ó bá ibi ahoro tí ènìyàn kì í gbé mu; “sínú” sì fi ìṣípò wọ ibi náà hàn.
theological_decisions:
- issue: Agbára ìṣe Ẹ̀mí sí Jésù
  choice: “lé e jáde lọ”
  alternative: “mú un lọ” tàbí “rán an jáde”
  rationale: ἐκβάλλει jẹ́ ọ̀rọ̀-ìṣe alágbára. Àtẹ̀jáde yìí kò rọ ìtumọ̀ rẹ̀ kù láti mú un bá ọ̀nà tí àwọn Ìhìn Rere mìíràn gbà sọ ìṣẹ̀lẹ̀ náà mu; ó pa ìfúnpá ọ̀rọ̀ náà àti ìpinnu Ẹ̀mí nínú ìlọ Jésù sí aginjù mọ́, láì sọ pé a fi ipá mú Jésù lòdì sí ìfẹ́ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yan “aginjù” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó ti fìdí múlẹ̀ fún ibi ahoro.
