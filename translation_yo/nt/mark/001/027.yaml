id: MRK.1.27
reference: Mark 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: yo
  text: Ẹnu sì ya gbogbo wọn[a], tó bẹ́ẹ̀ tí wọ́n fi ń jíròrò láàárín ara wọn, wọ́n sì ń wí pé, “Kí ni èyí? Ẹ̀kọ́ tuntun tí ó ní àṣẹ! Ó tilẹ̀ ń pàṣẹ fún àwọn ẹ̀mí àìmọ́, wọ́n sì ń ṣègbọràn sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni èyí? Kí ni ẹ̀kọ́ tuntun tí ó ní àṣẹ yìí?” A lè fi àmì ìdádúró sínú ọ̀rọ̀ Gíríìkì náà lọ́nà tí “ẹ̀kọ́ tuntun” yóò fi so mọ́ ìbéèrè náà ní tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: ṣe kàyéfì
  rationale: Ó sọ pé ohun tí wọ́n rí mú kí ẹnu ya wọ́n gidigidi, láìfi ìtẹnumọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἅπαντες
  choice: Gbogbo wọn
  rationale: Ó pa ìtẹnumọ́ pé gbogbo àwọn tó wà níbẹ̀ ló fèsì mọ́.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: tó bẹ́ẹ̀ tí wọ́n fi ń bá ara wọn sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí fi àbájáde ìyàlẹ́nu wọn hàn, ó sì túmọ̀ sí ìjíròrò láàárín ara wọn láìsọ ọ́ di àríyànjiyàn.
- source_word: Τί ἐστιν τοῦτο;
  choice: Kí ni èyí?
  rationale: Ìbéèrè tààrà yìí pa ìyàlẹ́nu inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διδαχὴ καινή
  choice: Ẹ̀kọ́ tuntun
  rationale: “Ẹ̀kọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye ní ti ẹ̀kọ́ tí a ń kọ́ni, kò sì ní ìtumọ̀ ìmọ̀-ẹ̀sìn tó le ju ibi yìí lọ.
- source_word: κατ’ ἐξουσίαν
  choice: tí ó ní àṣẹ
  rationale: Ó fi hàn pé ẹ̀kọ́ àti iṣẹ́ Jesu ní agbára àṣẹ, nígbà tó tún pa àìdánilójú díẹ̀ nípa ohun tí gbólóhùn náà so mọ́ mọ́.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: àwọn ẹ̀mí àìmọ́
  rationale: “Àìmọ́” pa agbára ìtumọ̀ ἀκάθαρτος mọ́ ju ọ̀rọ̀ tó túbọ̀ rọ̀ lọ.
- source_word: ἐπιτάσσει
  choice: ń pàṣẹ fún
  rationale: Ó ṣàfihàn àṣẹ tó lágbára tí ọ̀rọ̀-ìṣe Gíríìkì náà ní.
- source_word: ὑπακούουσιν αὐτῷ
  choice: wọ́n sì ń gbọ́ tirẹ̀
  rationale: Àpólà Yorùbá yìí túmọ̀ sí pé wọ́n ń ṣègbọràn sí àṣẹ rẹ̀, ó sì bá ọ̀rọ̀ ojoojúmọ́ mu.
theological_decisions:
- issue: Ìbáṣepọ̀ “tí ó ní àṣẹ” pẹ̀lú ìṣètò gbólóhùn náà
  choice: A so ó mọ́ “Ẹ̀kọ́ tuntun” gẹ́gẹ́ bí ìkéde ìyàlẹ́nu, ṣùgbọ́n àyíká náà tún jẹ́ kí àṣẹ yẹn hàn nínú bí Jesu ṣe ń pàṣẹ fún àwọn ẹ̀mí.
  alternative: A lè ka gbogbo rẹ̀ gẹ́gẹ́ bí ìbéèrè pé, “Kí ni èyí? Kí ni ẹ̀kọ́ tuntun tí ó ní àṣẹ yìí?” tàbí kí “ní àṣẹ” túbọ̀ so mọ́ bí ó ṣe ń pàṣẹ fún àwọn ẹ̀mí.
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì gba ọ̀nà púpọ̀ láàyè; ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn kan lé e lórí, ó sì pa ìdààmú ìtumọ̀ náà mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá.
