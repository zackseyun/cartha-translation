revisions:
- from: Gbogbo wọn sì ṣe kàyéfì[a], tó bẹ́ẹ̀ tí wọ́n fi ń bá ara wọn sọ̀rọ̀ pé, “Kí ni èyí? Ẹ̀kọ́ tuntun tí ó ní àṣẹ! Ó tilẹ̀ ń pàṣẹ fún àwọn ẹ̀mí àìmọ́, wọ́n sì ń gbọ́ tirẹ̀.”
  to: Ẹnu sì ya gbogbo wọn[a], tó bẹ́ẹ̀ tí wọ́n fi ń jíròrò láàárín ara wọn, wọ́n sì ń wí pé, “Kí ni èyí? Ẹ̀kọ́ tuntun tí ó ní àṣẹ! Ó tilẹ̀ ń pàṣẹ fún àwọn ẹ̀mí àìmọ́, wọ́n sì ń ṣègbọràn sí i.”
  rationale: Àtúnṣe náà ṣe ìgbọràn àwọn ẹ̀mí sí Jesu ní kedere, mú ìjíròrò àpapọ̀ wọn hàn dáadáa, ó sì tún ọ̀rọ̀ ìsàlẹ̀ ṣe nípa àmì ìdádúró. Ìṣètò tí “tí ó ní àṣẹ” so mọ́ “Ẹ̀kọ́ tuntun” ni a pa mọ́, pẹ̀lú ìsàlẹ̀ tó fi ọ̀nà ìpín gbolohun mìíràn hàn.
