  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: gbogbo ènìyàn ni ìyàlẹ́nu mú, wọ́n jíròrò láàárín ara wọn, wọ́n pe ẹ̀kọ́ náà ní tuntun tí ó ní àṣẹ, Jesu sì ń pàṣẹ fún àwọn ẹ̀mí àìmọ́. Síbẹ̀, “wọ́n sì ń gbọ́ tirẹ̀” kì í sọ ὑπακούουσιν αὐτῷ ní kedere; ó lè túmọ̀ sí pé wọ́n ń gbọ́ ohun tirẹ̀. “Wọ́n sì ń ṣègbọràn sí i” ni ó fi ìgbọràn sí òfin rẹ̀ hàn pẹkipẹki.'
  naturalness: “Gbogbo wọn sì ṣe kàyéfì” lóye, ṣùgbọ́n “Ẹnu sì ya gbogbo wọn” jẹ́ ìsọ̀rọ̀ Yorùbá ìgbàlódé tó rọrùn, tó sì bá ìyàlẹ́nu tó lágbára mu. “Ń jíròrò láàárín ara wọn” tún ṣàfihàn συζητεῖν kedere ju “ń bá ara wọn sọ̀rọ̀” lọ.
  terminology: “Ẹ̀kọ́ tuntun,” “àṣẹ,” àti “àwọn ẹ̀mí àìmọ́” yẹ, wọ́n sì pa ìtumọ̀ àti ìforúkọsílẹ̀ ọ̀rọ̀ inú ìwé Mákù mọ́. A tún ṣe àtúnṣe gbolohun ìsàlẹ̀ náà sí “àmì ìdádúró,” èyí tó yẹ fún punctuation, dípò “àmì ìdákẹ́jẹ.”
