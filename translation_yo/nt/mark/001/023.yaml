  text: καὶ ⸀εὐθὺς ἦν ἐν τῇ συναγωγῇ αὐτῶν ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ καὶ ἀνέκραξεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ọkùnrin kan tí ó ní ẹ̀mí àìmọ́[a] wà nínú sínágọ́gù wọn, ó sì ké jáde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan, “tí ó wà nínú ẹ̀mí àìmọ́.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan sọ ọ́ ní ọ̀nà àlàyé pé, “tí ẹ̀mí àìmọ́ ń gbé inú rẹ̀.” Ṣùgbọ́n gbólóhùn Gíríìkì kò sọ ọ́ ní ọ̀nà yẹn ní tààràtà.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìtàn tí Máàkù máa ń lo εὐθύς hàn ní Yorùbá àdánidá.
- source_word: ἦν
  choice: wà
  rationale: Ìṣe ọ̀rọ̀ náà ń sọ pé ẹni kan wà ní ibi náà; ‘wà’ ni ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: συναγωγῇ αὐτῶν
  choice: nínú sínágọ́gù wọn
  rationale: ‘Sínágọ́gù’ tọ́ka sí ilé ìpàdé àwọn Júù, ‘wọn’ sì pa αὐτῶν mọ́.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ní àyíká yìí, ọ̀rọ̀ akọ ẹyọ kan náà tọ́ka sí ọkùnrin pàtó kan.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: tí ó ní ẹ̀mí àìmọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìbáṣepọ̀ tí gbólóhùn Gíríìkì sọ, láìfi àlàyé tó lágbára bí ‘tí ẹ̀mí ... ń gbé inú rẹ̀’ kún un.
- source_word: ἀκαθάρτῳ
  choice: àìmọ́
  rationale: ‘Àìmọ́’ pa ìtumọ̀ ìwà àti ti ẹ̀sìn ti ἀκάθαρτος mọ́ nínú àyíká ẹ̀mí búburú.
- source_word: ἀνέκραξεν
  choice: ó sì ké jáde
  rationale: Ó sọ igbe ohùn rara di Yorùbá àdánidá láì pinnu pé ó jẹ́ igbe ẹ̀rù tàbí igbe irora.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐν πνεύματι ἀκαθάρτῳ nípa ìpọ́njú ẹ̀mí búburú
  choice: tí ó ní ẹ̀mí àìmọ́
  alternative: tí ó wà nínú ẹ̀mí àìmọ́; tí ẹ̀mí àìmọ́ ń gbé inú rẹ̀
  rationale: Ìtumọ̀ yìí mú ọ̀rọ̀ náà yé kedere ní Yorùbá, ṣùgbọ́n kò fi èrò ìtumọ̀ àfikún kan sí i. Àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ gangan àti ìtumọ̀ àlàyé mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọ̀wọ̀, ó ṣe déédé, ó sì rọrùn fún òǹkàwé òde òní. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ tí a ti ń lò fún ilé ìpàdé àwọn Júù.
