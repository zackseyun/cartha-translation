source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: yo
  text: Bí ó ti ń kọjá lọ lẹ́gbẹ̀ẹ́ Òkun Gálílì, ó rí Símónì àti Áńdérù, arákùnrin Símónì, tí wọ́n ń ju àwọ̀n sínú òkun, nítorí apẹja ni wọ́n.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων
  choice: Bí ó ti ń kọjá lọ
  rationale: Ọ̀rọ̀ ìṣe aláìparí yìí ń tọ́ka sí ohun tí ó ń ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú εἶδεν; ìtumọ̀ yìí pa ìṣe tí ń lọ lọ́wọ́ mọ́ ní Yorùbá àdánidá.
- source_word: παρὰ τὴν θάλασσαν
  choice: lẹ́gbẹ̀ẹ́ Òkun
  rationale: παρά pẹ̀lú accusative níbí fi ìrìn lẹ́gbẹ̀ẹ́ tàbí ní etí omi hàn; “lẹ́gbẹ̀ẹ́” mú ipò náà jáde kedere.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Òkun Gálílì
  rationale: Bó tilẹ̀ jẹ́ adágún nípa ìmọ̀ ilẹ̀, θάλασσα ni orísun lò, “Òkun Gálílì” sì ni orúkọ ibi tí ó yẹ, tó sì pa àṣà Bíbélì mọ́.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ tààrà ti aorist ὁράω ni; kò fi ìtumọ̀ àfikún bí “ó kíyè sí” kún un.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Símónì àti Áńdérù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìrísí tí ó bá èdè Yorùbá àti àmì ohùn rẹ̀ mu.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: arákùnrin Símónì
  rationale: Ìkọ̀ yìí dá Áńdérù mọ̀ gẹ́gẹ́ bí arákùnrin Símónì, ó sì jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó ṣe kedere.
- source_word: ἀμφιβάλλοντας
  choice: tí wọ́n ń ju àwọ̀n
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí jíju àwọ̀n ẹja; fífi “àwọ̀n” hàn jẹ́ ohun tí ìtumọ̀ ọ̀rọ̀ Gíríìkì fúnra rẹ̀ béèrè.
- source_word: ἐν τῇ θαλάσσῃ
  choice: sínú òkun
  rationale: Bó tilẹ̀ jẹ́ pé ἐν sábà máa ń túmọ̀ sí “nínú,” ìṣe jíju àwọ̀n béèrè fún “sínú” ní Yorùbá àdánidá, láti fi ibi tí àwọ̀n náà ń lọ hàn.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: nítorí apẹja ni wọ́n
  rationale: γάρ ṣàlàyé ìdí tí wọ́n fi ń ju àwọ̀n; ìkọ̀ Yorùbá yìí mú agbára àlàyé náà jáde lọ́nà tí ó ṣe déédéé.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “ó” láìfi “Jésù” kún un, nítorí orísun Gíríìkì kò tún dárúkọ ẹni náà nínú ẹsẹ yìí.
