  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: yo
  text: Nígbà tí ó di alẹ́, nígbà tí oòrùn wọ̀, wọ́n ń mú gbogbo àwọn aláìsàn àti àwọn tí ẹ̀mí èṣù ń wọ̀ wá sọ́dọ̀ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó wà lábẹ́ agbára àwọn ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Nígbà tí ó di alẹ́
  rationale: Èyí mú ìyípadà àkókò tí genitive absolute náà ń tọ́ka sí jáde ní Yorùbá àdánidá.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: tí oòrùn sì wọ̀
  rationale: Ó tú ὅτε àti aorist ἔδυ ní ọ̀nà tó ṣe kedere, láìfi ‘lẹ́yìn’ kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: ἔφερον
  choice: wọ́n ń gbé … wá
  rationale: Àmì ‘ń’ pa ìṣe tí ń lọ lọ́wọ́ nínú imperfect mọ́; ‘wọ́n’ jẹ́ olùṣe tí a kò dárúkọ ní pàtó.
- source_word: πρὸς αὐτὸν
  choice: sọ́dọ̀ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìrìn sí ọ̀dọ̀ ẹni kan, láìdárúkọ Jésù níbi tí Gíríìkì ti lo arọ́pò-orúkọ.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: gbogbo àwọn aláìsàn
  rationale: ‘Aláìsàn’ sọ ìtumọ̀ ọ̀rọ̀ àpèjúwe κακῶς ἔχοντας ní ṣókí, ní kedere, ó sì pa agbára πάντας (‘gbogbo’) mọ́.
- source_word: τοὺς δαιμονιζομένους
  choice: àwọn tí ẹ̀mí èṣù ń ṣe níṣìírí
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tó ṣeé lóye fún àwọn ẹni tí agbára ẹ̀mí èṣù ń ṣiṣẹ́ lára wọn; kò sọ ọ́ di àìsàn lásán, bẹ́ẹ̀ ni kò ṣàfikún ẹ̀kọ́ nípa àwọn ẹ̀mí èṣù tí ẹsẹ náà kò sọ.
theological_decisions:
- issue: Bí a ṣe máa tú δαιμονιζομένους láìsẹ́ ìṣe ẹ̀mí èṣù àti láìsọ ohun tó ju Gíríìkì lọ
  choice: àwọn tí ẹ̀mí èṣù ń ṣe níṣìírí
  alternative: àwọn tí ó wà lábẹ́ agbára àwọn ẹ̀mí èṣù
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìtọ́kasí sí ìṣe ẹ̀mí èṣù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀. Àlàyé ìsàlẹ̀ fi ọ̀nà tó sún mọ́ ìrísí Gíríìkì hàn láìyanju bí ìṣàkóso náà ṣe rí ní kíkún.
- issue: Ìrísí ìṣe ἔφερον
  choice: wọ́n ń gbé … wá
  alternative: wọ́n gbé … wá
  rationale: Imperfect náà lè fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; ‘ń gbé’ pa ìṣàn ìtàn yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, àkójọpọ̀ ọ̀rọ̀ tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
