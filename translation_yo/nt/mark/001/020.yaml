language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: yo
  text: Ó sì pè wọ́n lẹ́sẹ̀kẹsẹ̀. Wọ́n sì fi Sébédè baba wọn sílẹ̀ nínú ọkọ̀ ojú omi pẹ̀lú àwọn alágbàṣe, wọ́n sì lọ lẹ́yìn rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ́n lọ ní ẹ̀yìn rẹ̀” tàbí “wọ́n tẹ̀ lé e.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìṣípò ní ti ara àti ìbẹ̀rẹ̀ sí í jẹ́ ọmọ-ẹ̀yìn rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ àkókò àti ìmọ̀lára ìkánjú tí Máàkù sábà máa ń fi hàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἐκάλεσεν
  choice: pè
  rationale: “Pè” ni ìtumọ̀ tààrà tí ó bá ọ̀rọ̀ yìí mu, láìfi agbára àṣẹ tàbí ìrọ̀rùn ìkésíni kún ohun tí Gíríìkì sọ.
- source_word: ἀφέντες
  choice: fi … sílẹ̀
  rationale: Ó fi ìṣe tí ó ṣẹlẹ̀ ṣáájú lílọ wọn hàn ní Yorùbá àdánidá, láìsọ pé wọ́n kọ baba wọn sílẹ̀ pátápátá.
- source_word: Ζεβεδαῖον
  choice: Sébédè
  rationale: Àkọsílẹ̀ orúkọ náà ni ìrísí tí ó bá ìró àti ìkọ̀wé Yorùbá mu.
- source_word: πλοίῳ
  choice: ọkọ̀ ojú omi
  rationale: Ó yẹ fún ọkọ̀ ìpẹja lórí Òkun Galili, kò sì mú kí a ronú nípa ọkọ̀ ńlá.
- source_word: μισθωτῶν
  choice: àwọn alágbàṣe
  rationale: Ó tọ́ka sí àwọn tí a gbà síṣẹ́ fún owó, láìfi èdè ilé-iṣẹ́ òde òní tàbí akọ-nìkan kún un.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: wọ́n sì lọ lẹ́yìn rẹ̀
  rationale: Gbólóhùn yìí lè tọ́ka sí lílọ ní ẹ̀yìn Jésù ní ti ara, ó sì tún lè mú ìtumọ̀ bẹ̀rẹ̀ sí í tẹ̀ lé e gẹ́gẹ́ bí ọmọ-ẹ̀yìn wá sí ọkàn, láìyan ọ̀kan ṣoṣo nínú méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn nínú ὀπίσω αὐτοῦ
  choice: lọ lẹ́yìn rẹ̀
  alternative: tẹ̀ lé e
  rationale: “Lọ lẹ́yìn rẹ̀” pa ìṣípò ní ti ara mọ́, ó sì ṣí sí ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn; “tẹ̀ lé e” lè mú ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn hàn gbangba ju bí Gíríìkì ṣe fi í sílẹ̀ lọ.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu, a sì pa àsopọ̀ ìtàn náà mọ́ pẹ̀lú “ó sì” àti “wọ́n sì.”
