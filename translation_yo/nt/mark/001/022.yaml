source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: yo
  text: Ẹnu sì ń yà wọ́n sí ẹ̀kọ́ rẹ̀, nítorí ó ń kọ́ wọn bí ẹni tí ó ní àṣẹ[a], kì í sì í ṣe bí àwọn akọ̀wé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú àṣẹ.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn akọ̀wé” níbí ni àwọn amòye àti olùkọ́ Òfin Mósè láàárín àwọn Júù.
    reason: cultural_clarification
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu sì ń yà wọ́n
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle hàn; àmì ìṣe tí ń lọ lọ́wọ́ nínú èdè Gíríìkì ni a fi “ń” mú jáde ní èdè Yorùbá.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sí ẹ̀kọ́ rẹ̀
  rationale: “Ẹ̀kọ́” lè tọ́ka sí ohun tí Jésù ń kọ́ni àti ọ̀nà tí ó gbà ń kọ́ni; ó sì bá àṣà ọ̀rọ̀ “ẹnu yà sí” mu.
- source_word: ἦν γὰρ διδάσκων
  choice: nítorí ó ń kọ́ wọn
  rationale: “Ó ń kọ́ wọn” pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́, “nítorí” sì fi ìdí ìyàlẹ́nu wọn hàn.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: bí ẹni tí ó ní àṣẹ
  rationale: Èyí tẹ̀ lé ìfiwéra ὡς, ó sì pa èrò pé ó jẹ́ ẹni tí ó ní àṣẹ mọ́ láìṣàlàyé orísun àṣẹ náà ju ohun tí ẹsẹ náà sọ lọ.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà fún àwọn amòye Júù nínú Ìwé Mímọ́ àti Òfin; àlàyé ìtumọ̀ iṣẹ́ wọn wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú àṣẹ Jésù ní ní ìyàtọ̀ sí ti àwọn akọ̀wé
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àpèjúwe pé Jésù ní àṣẹ, láìfikún pé “àṣẹ Ọlọ́run” ni.
  alternative: pẹ̀lú àṣẹ Ọlọ́run
  rationale: Ẹsẹ náà fi ọ̀nà tí Jésù gbà ń kọ́ni wé ti àwọn akọ̀wé, ṣùgbọ́n kò sọ ní pàtó nínú gbólóhùn yìí ibi tí àṣẹ náà ti wá tàbí irú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàlágba tí ó lọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ẹnu ń yà” gẹ́gẹ́ bí àkànlò èdè àdánidá, a sì tún ọ̀rọ̀-ìṣe “kọ́” ṣe ní ìparí kí ìfiwéra náà lè ṣe kedere.
