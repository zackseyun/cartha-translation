source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n fi Jòhánù lé ẹni lọ́wọ́[a], Jésù wá sí Gálílì, ó sì ń kéde ìhìn rere[b] ti Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n mú Jòhánù.” Gíríìkì sọ ní tààrà sí i pé a “fi Jòhánù lé ẹni lọ́wọ́”; ọ̀rọ̀ yìí tún fara hàn nígbà tí Máàkù ń sọ nípa fífi Jésù lé àwọn mìíràn lọ́wọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìnrere.”
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn “ti Ọlọ́run” lè túmọ̀ sí ìhìn rere tí ó wá láti ọ̀dọ̀ Ọlọ́run, tí ó jẹ́ ti Ọlọ́run, tàbí tí àkóónú rẹ̀ dá lórí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: Lẹ́yìn tí wọ́n fi ... léni lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi ìgbà tí ohun náà ṣẹlẹ̀ hàn, ó sì pa ìtumọ̀ παραδίδωμι mọ́ gẹ́gẹ́ bí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́. Ó tún jẹ́ kí ìbáṣepọ̀ ọ̀rọ̀ yìí pẹ̀lú èdè ìjìyà Jesu ní Máàkù dúró, láì dín un kù sí mímú nìkan.
- source_word: Ἰωάννην
  choice: Johanu
  rationale: Èyí ni ìkọ orúkọ Ἰωάννης tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwọn òǹkàwé Yorùbá.
- source_word: ἦλθεν
  choice: wá
  rationale: “Wá” túmọ̀ ἔρχομαι ní ọ̀nà àdánidá nínú Yorùbá, láì fi ìtumọ̀ tóóró bíi “dé” kún un.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: “Sí” fi ìlọ sí ibi kan hàn ní Yorùbá àdánidá, ó sì bá ipa ìtọ́sọ́nà εἰς mu.
- source_word: κηρύσσων
  choice: ó sì ń kéde
  rationale: “Ń kéde” fi iṣẹ́ kíkéde ní gbangba tí κηρύσσω ń tọ́ka sí hàn, fọ́ọ̀mù “ń” sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: “Ìhìn rere” sọ ìtumọ̀ εὐαγγέλιον ní kedere fún òǹkàwé òde òní, láì gbára lé ọ̀rọ̀ ẹ̀sìn àkànṣe.
- source_word: τοῦ θεοῦ
  choice: ti Ọlọ́run
  rationale: '“Ti Ọlọ́run” pa ìbáṣepọ̀ genitive náà mọ́ ní ọ̀nà gbígbòòrò: ìhìn rere náà lè wá láti ọ̀dọ̀ Ọlọ́run, jẹ́ ti Ọlọ́run, tàbí dá lé Ọlọ́run.'
theological_decisions:
- issue: Ìtumọ̀ παραδοθῆναι àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀ ìjìyà nínú Máàkù
  choice: wọ́n fi Johanu léni lọ́wọ́
  alternative: wọ́n mú Johanu
  rationale: Máàkù máa ń lo παραδίδωμι fún fífi ẹnì kan lé àwọn ọ̀tá tàbí aláṣẹ lọ́wọ́, títí kan nípa ìjìyà Jesu. Yíyan “fi ... léni lọ́wọ́” pa ìró ìtàn àti ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́ láì sọ ohun tí Gíríìkì kò sọ ní pàtó.
- issue: Agbára genitive nínú τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere ti Ọlọ́run
  alternative: ìhìn rere láti ọ̀dọ̀ Ọlọ́run; ìhìn rere nípa Ọlọ́run
  rationale: Genitive náà lè ní ju ìtumọ̀ kan tí ó jọra lọ. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú tó wà nínú Gíríìkì mọ́ dípò yíyan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé gbogbogbò, ó sì yẹra fún èdè ìjọ kan pàtó. “Léni lọ́wọ́” jẹ́ ọ̀nà láti pa ẹni tí a fi Johanu fún mọ́ láì sọ ọ́ ní pàtó, gẹ́gẹ́ bí orísun Gíríìkì.
