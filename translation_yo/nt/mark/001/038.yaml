  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ jẹ́ kí a lọ sí ibòmíràn, sí àwọn ìlú kéékèèké tó wà nítòsí[a], kí n lè wàásù níbẹ̀ pẹ̀lú, nítorí èyí ni mo ṣe jáde[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ìlú kéékèèké” lè tọ́ka sí ibùgbé kékeré kan tó dà bí ohun tó wà láàárín abúlé àti ìlú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ète yìí ni mo ṣe jáde.” Gbólóhùn náà lè tọ́ka sí jíjáde Jésù kúrò ní ibi tó wà, tàbí, ní ọ̀nà tó gbòòrò, sí ète rẹ̀ láti jáde lọ wàásù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Ẹ jẹ́ kí a lọ
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ hortatory subjunctive ẹni àkọ́kọ́ púpọ̀; ọ̀nà yìí jẹ́ Yorùbá àdánidá tó sì pa agbára ìpè láti jọ lọ mọ́.
- source_word: ἀλλαχοῦ
  choice: sí ibòmíràn
  rationale: Ó túmọ̀ sí lílọ sí ibi mìíràn, kì í ṣe dídúró ní ibi tí wọ́n wà.
- source_word: ἐχομένας
  choice: tó wà nítòsí
  rationale: Nípa àwọn ibi, participle náà ń tọ́ka sí àwọn ibi tó sún mọ́ ibi tí a ń sọ̀rọ̀ rẹ̀ tàbí tó tẹ̀ lé e.
- source_word: κωμοπόλεις
  choice: àwọn ìlú kéékèèké
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ibùgbé tó dà bí ohun tó wà láàárín abúlé àti ìlú; ‘ìlú kéékèèké’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: kí n lè wàásù níbẹ̀ pẹ̀lú
  rationale: ‘Kí n lè’ fi ète hàn, ‘wàásù’ sì mú ìtumọ̀ κηρύσσω jáde; ‘níbẹ̀ pẹ̀lú’ pa ìtẹnumọ́ καὶ ἐκεῖ mọ́.
- source_word: εἰς τοῦτο
  choice: nítorí èyí ni
  rationale: Gbólóhùn náà ṣàlàyé ìdí tàbí ète ohun tó ṣáájú lọ́nà Yorùbá tó ṣe kedere.
- source_word: ἐξῆλθον
  choice: mo ṣe jáde
  rationale: ‘Jáde’ pa ìtumọ̀ gangan mọ́ láì pinnu bóyá ó ń tọ́ka sí jíjáde kúrò ní ibi tó wà tàbí sí ète iṣẹ́ ìwàásù rẹ̀ ní ọ̀nà tó gbòòrò.
- source_word: λέγει αὐτοῖς
  choice: Ó sì sọ fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, Yorùbá ìtàn máa ń lo ọ̀rọ̀-ìṣe àkókò tí ó ti kọjá ní ọ̀nà àdánidá níbí.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἐξῆλθον
  choice: mo ṣe jáde
  alternative: mo jáde kúrò níbí; mo jáde wá fún iṣẹ́ yìí
  rationale: Gíríìkì lè tọ́ka sí jíjáde kúrò ní ilé tàbí ibi tó wà, ó sì tún lè ní ìtumọ̀ tó gbòòrò nípa ète iṣẹ́ ìwàásù. Àyíká ọ̀rọ̀ kò fi dandan mú ká yan ọ̀kan ṣoṣo, nítorí náà a pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Ẹ jẹ́ kí a lọ’ jẹ́ ìpè onírẹ̀lẹ̀ láti jọ ṣe ohun kan; ‘ìlú kéékèèké’ yàgò fún ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ tó le.
