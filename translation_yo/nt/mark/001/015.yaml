source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: yo
  text: ó sì ń wí pé, “Àkókò náà ti pé, ìjọba Ọlọ́run sì ti sún mọ́.[a] Ẹ ronúpìwàdà, kí ẹ sì gba ìhìn rere gbọ́.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣàkóso Ọlọ́run sì ti sún mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìnrere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: ti pé
  rationale: Ọ̀rọ̀ yìí fi hàn pé àkókò tí a yàn ti dé ìmúṣẹ̀, ipa rẹ̀ sì wà ní báyìí; ‘ti pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: καιρὸς
  choice: Àkókò náà
  rationale: καιρός tọ́ka sí àkókò pàtàkì tí a yàn, kì í ṣe àkókò lásán; ọ̀rọ̀ àfihàn ‘náà’ mú ìtumọ̀ àkókò tí a ń retí yẹn jáde.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Ìṣe pípé náà sọ pé ó ti súnmọ́, ìsúnmọ́ rẹ̀ sì jẹ́ òtítọ́ nísinsìnyí; ‘ti sún mọ́lé’ pa ìṣísẹ̀ àti àbájáde rẹ̀ mọ́.
- source_word: βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ gbólóhùn Yorùbá tí ó gbòòrò, tí ó sì lè ní ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run láì dín ọ̀rọ̀ Gíríìkì náà kù sí ọ̀kan ṣoṣo.
- source_word: μετανοεῖτε
  choice: Ẹ ronú pìwà dà
  rationale: Àṣẹ yìí ń pè fún ìyípadà inú àti ìgbésí ayé. ‘Ronú pìwà dà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ju ìyí èrò orí lásán lọ.
- source_word: πιστεύετε
  choice: kí ẹ sì ... gbọ́
  rationale: ‘Gba ... gbọ́’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún πιστεύω níbí, ó sì pa àṣẹ náà mọ́ láì fi ìtumọ̀ tóóró kan kún un.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: gba ìhìn rere gbọ́
  rationale: εὐαγγέλιον túmọ̀ sí ìhìn rere; lẹ́yìn ọ̀rọ̀ ìṣe ‘gba ... gbọ́,’ Yorùbá kò nílò láti ṣe àfihàn ἐν pẹ̀lú ‘nínú,’ èyí tí kò ní dùn bí èdè àdánidá.
- source_word: λέγων
  choice: ó sì ń wí pé
  rationale: Participle náà ń tẹ ìtàn ẹsẹ tó ṣáájú lọ; ‘ó sì ń wí pé’ fi ìtẹ̀síwájú ìṣe náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: ‘Ìjọba’ pa ìbú ọ̀rọ̀ náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú gbogbo Ìwé Mímọ́ mọ́; àlàyé ìsàlẹ̀ fi ‘ìṣàkóso’ hàn láì pinnu pé ìtumọ̀ kan ṣoṣo ni.
- issue: Ìtumọ̀ εὐαγγέλιον
  choice: ìhìn rere
  alternative: ẹ̀kọ́ ìhìn rere
  rationale: ‘Ìhìn rere’ sọ ìtumọ̀ ọ̀rọ̀ orísun náà ní kedere fún òǹkàwé òde òní, láì jẹ́ kí ọ̀rọ̀ náà di èdè ìjọ nìkan.
- issue: Agbára μετανοεῖτε καὶ πιστεύετε
  choice: Ẹ ronú pìwà dà, kí ẹ sì gba ... gbọ́
  alternative: Ẹ máa ronú pìwà dà, kí ẹ sì máa gba ... gbọ́
  rationale: Àṣẹ ìsinsìnyí Gíríìkì lè ní ìtumọ̀ ìṣe tí ń bá a lọ, ṣùgbọ́n àṣẹ Yorùbá tí kò ní ‘máa’ pa ìkésíni tó lágbára mọ́ láì fi àlàyé aspect tí ọ̀rọ̀ náà kò fi dandan múlẹ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ọ̀rọ̀ náà ń tẹ ẹsẹ 14 lọ, nítorí náà a bẹ̀rẹ̀ pẹ̀lú ‘ó sì ń wí pé.’ Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
