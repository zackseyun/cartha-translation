id: MRK.1.10
reference: Mark 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, bí ó ti ń gòkè jáde láti inú omi, ó rí àwọn ọ̀run tí ń ya sílẹ̀[a], àti Ẹ̀mí náà tí ó ń sọ̀kalẹ̀ bí àdàbà sí orí rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “àwọn ọ̀run tí a ń fa ya.” Ọ̀rọ̀ Gíríìkì náà lágbára ju pé wọ́n kàn “ṣí” lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sínú rẹ̀.” Ọ̀rọ̀ Gíríìkì εἰς lè túmọ̀ sí “sínú,” ṣùgbọ́n níbí, “sí orí rẹ̀” bá ọ̀nà tí a fi ń sọ ìsọ̀kalẹ̀ Ẹ̀mí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti ìmúnibíni ìtàn Máàkù hàn ní èdè Yorùbá òde òní.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: bí ó ti ń gòkè jáde láti inú omi
  rationale: Ìsọ yìí pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì fi agbára ἐκ hàn gẹ́gẹ́ bí jíjáde láti inú omi.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ tààrà, tí ó bá aorist ìfiyesi mu láìfi ohun tí kò sí nínú orísun kún un.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: àwọn ọ̀run tí ń ya sí méjì
  rationale: ‘Ya sí méjì’ lágbára ju ‘ṣí’ lọ, ó sì pa àwòrán ìṣẹ̀lẹ̀ líle tí σχίζω ní mọ́; ‘àwọn ọ̀run’ tún ṣe àfihàn ọ̀pọ̀ οὐρανούς.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Àyíká náà tọ́ka sí Ẹ̀mí Ọlọ́run, ṣùgbọ́n a kò fi ‘Mímọ́’ kún un nítorí pé ọ̀rọ̀ Gíríìkì kò sọ ọ́ ní kedere.
- source_word: ὡς περιστερὰν
  choice: bí àdàbà
  rationale: Ó pa ìfiwéra mọ́ láìpinnu bóyá ó ń tọ́ka sí ìrísí, ọ̀nà ìsọ̀kalẹ̀, tàbí àwọn méjèèjì.
- source_word: καταβαῖνον
  choice: tí ó ń sọ̀kalẹ̀
  rationale: Ó ṣe àfihàn participle tí ó ń lọ lọ́wọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: εἰς αὐτόν
  choice: sí orí rẹ̀
  rationale: Nínú àyíká ìsọ̀kalẹ̀ Ẹ̀mí, èyí ni ọ̀nà Yorùbá àdánidá láti sọ ‘upon him,’ nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘sínú rẹ̀’ mọ́ gẹ́gẹ́ bí àṣàyàn.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ ń tọ́ka sí
  choice: Ẹ̀mí Ọlọ́run, tí a túmọ̀ sí ‘Ẹ̀mí náà’
  alternative: ‘Ẹ̀mí Mímọ́’
  rationale: Àyíká ìbatisí Jésù fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn, ṣùgbọ́n τὸ πνεῦμα kò ní ọ̀rọ̀ ‘mímọ́’; nítorí náà, a pa bí orísun ṣe sọ ọ́ mọ́.
- issue: Ipa ìfiwéra àdàbà
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘bí àdàbà’ láìsọ ibi pàtó tí ìjọra wà
  alternative: Ẹ̀mí ní ìrísí àdàbà; tàbí Ẹ̀mí sọ̀kalẹ̀ ní ọ̀nà tí àdàbà ń gbà
  rationale: ὡς περιστερὰν jẹ́ ìfiwéra, ṣùgbọ́n kò pinnu bóyá ìrísí, ìrìn, tàbí ohun mìíràn ni ó ń ṣàpèjúwe.
- issue: Ìtọ́sọ́nà εἰς αὐτόν
  choice: ‘sí orí rẹ̀’
  alternative: ‘sínú rẹ̀’
  rationale: εἰς lè túmọ̀ sí ‘sínú,’ ṣùgbọ́n pẹ̀lú ọ̀rọ̀ ìsọ̀kalẹ̀ Ẹ̀mí, ‘sí orí rẹ̀’ bá èdè àti àyíká mu dáadáa; àṣàyàn orísun náà wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìsọ ‘àwọn ọ̀run tí ń ya sí méjì’ pa agbára àwòrán Gíríìkì mọ́, ‘bí àdàbà’ sì mọ̀ọ́mọ̀ fi ibi pàtó tí ìfiwéra náà wà sílẹ̀ láìyanjú rẹ̀.
