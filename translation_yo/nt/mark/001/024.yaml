source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: yo
  text: Ó ń wí pé, “Kí ni ìwọ ní í ṣe pẹ̀lú wa,[a] Jésù ará Násárẹ́tì?[b] Ṣé o wá láti pa wá run ni? Mo mọ ẹni tí ìwọ jẹ́—Ẹni Mímọ́ ti Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni àárín àwa àti ìwọ?” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ àkànlò èdè tó ń fi ìyapa tàbí ìṣọ̀tá hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Jésù ti Násárẹ́tì.” Gíríìkì náà lo ọ̀rọ̀ àpèjúwe tó túmọ̀ sí “ará Násárẹ́tì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: Kí ni ìwọ ní í ṣe pẹ̀lú wa
  rationale: Ọ̀rọ̀ àkànlò èdè yìí ń fi ìyapa tàbí ìdojúkọ hàn. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ láì túmọ̀ rẹ̀ jù.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jésù ará Násárẹ́tì
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe Jésù gẹ́gẹ́ bí ará Násárẹ́tì; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ náà mu.
- source_word: ἦλθες
  choice: Ṣé o wá
  rationale: Ìbéèrè yìí tọ́ka sí wíwá tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì wà níwájú; ‘Ṣé o wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἀπολέσαι
  choice: láti pa wá run
  rationale: Ọ̀rọ̀ náà túmọ̀ sí píparun tàbí pípa run; àkójọpọ̀ ‘pa … run’ mú ìtumọ̀ ìparun kíkún jáde ní Yorùbá.
- source_word: ἡμᾶς
  choice: wa
  rationale: A pa ọ̀pọ̀-orúkọ ẹni àkọ́kọ́ mọ́ gẹ́gẹ́ bí ó ti wà nínú orísun.
- source_word: οἶδά σε τίς εἶ
  choice: Mo mọ ẹni tí ìwọ jẹ́
  rationale: Èyí sọ ìdánimọ̀ ẹni náà ní tààrà, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Ẹni Mímọ́ ti Ọlọ́run
  rationale: A ṣe é bí oyè ìdánimọ̀, a sì pa ìbáṣepọ̀ gẹ́gẹ́ bí genitive ‘ti Ọlọ́run’ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Oyè nípa Kristi nínú ìdánimọ̀ ẹ̀mí àìmọ́
  choice: Ẹni Mímọ́ ti Ọlọ́run
  alternative: Ẹni Mímọ́ Ọlọ́run
  rationale: Yíyan ‘Ẹni Mímọ́ ti Ọlọ́run’ pa oyè ìdánimọ̀ náà àti ìbáṣepọ̀ tó wà nínú Gíríìkì mọ́, láì fẹ̀ sí i di ìjẹ́wọ́ ẹ̀kọ́ ìgbàgbọ́ tó gbooro ju ọ̀rọ̀ náà lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘ń wí pé’ láti so ẹsẹ̀ náà mọ́ gbólóhùn tó ṣáájú, gẹ́gẹ́ bí λέγων ṣe ń ṣiṣẹ́.
