  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ẹ̀tẹ̀ náà kúrò lára rẹ̀, a sì sọ ọ́ di mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì di mímọ́.” Ọ̀rọ̀-ìṣe náà tún lè ní ìtumọ̀ ìwẹ̀mímọ́ ní ti ìlànà ẹ̀sìn, kì í ṣe ìwòsàn ara nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti àìní ìdádúró tí ọ̀rọ̀ Gíríìkì náà sábà máa ń ní nínú Máàkù hàn ní Yorùbá òde òní.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: kúrò lára rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àrùn náà fi ẹni náà sílẹ̀, ó sì pa ìtumọ̀ ‘lọ kúrò lọ́dọ̀ rẹ̀’ mọ́.
- source_word: ἡ λέπρα
  choice: ẹ̀tẹ̀ náà
  rationale: ‘Ẹ̀tẹ̀’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún irú àrùn awọ ara tí ọrọ̀ Bíbélì yìí ń tọ́ka sí; ‘náà’ tún pa article Gíríìkì náà mọ́ ní ọ̀nà àdánidá.
- source_word: ἐκαθαρίσθη
  choice: a sì sọ ọ́ di mímọ́
  rationale: Ọ̀nà yìí pa ohùn àìṣe Gíríìkì mọ́, ó sì lè gba ìwòsàn ara àti yíyọ kúrò nínú àìmọ́ ní ti ìlànà ẹ̀sìn láàyè, dípò kí a dín ìtumọ̀ rẹ̀ kù sí ‘ó rí ìwòsàn’ nìkan.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìwòsàn ara àti mímọ́ ní ti ìlànà ẹ̀sìn nínú καθαρίζω
  choice: a sì sọ ọ́ di mímọ́
  alternative: ó sì rí ìwòsàn; ó sì di mímọ́
  rationale: Ọ̀rọ̀ náà kò sọ nípa píparí àìsàn nìkan; nínú àyíká ẹ̀tẹ̀ ti Bíbélì, ó tún ní ìtumọ̀ yíyọ ẹni kúrò nínú àìmọ́. Ìtumọ̀ yìí pa ìpele méjèèjì mọ́ láìfi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọlọ́lá, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì yan gbólóhùn tí ó jẹ́ àdánidá láìsọ ìtumọ̀ orísun di híhá ju bó ṣe wà lọ.
