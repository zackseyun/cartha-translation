id: MRK.1.44
reference: Mark 1:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ṣọ́ra kí o má ṣe sọ ohunkóhun fún ẹnikẹ́ni; ṣùgbọ́n lọ, fi ara rẹ hàn àlùfáà, kí o sì rú ẹbọ tí Mósè pàṣẹ fún ìwẹ̀nùmọ́ rẹ, gẹ́gẹ́ bí ẹ̀rí fún wọn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ẹ̀rí sí wọn”; gbolohun náà lè túmọ̀ sí ẹ̀rí tí a gbé kalẹ̀ fún àwọn àlùfáà tàbí àwọn ẹlòmíràn, àwọn kan sì lóye rẹ̀ ní ọ̀nà tó le sí i gẹ́gẹ́ bí ẹ̀rí lòdì sí wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Kíyèsí i
  rationale: Àṣẹ ìkìlọ̀ àti ìmòràn ni ọ̀rọ̀ náà; “Kíyèsí i” jẹ́ Yorùbá àdánidá tí ó pa agbára rẹ̀ mọ́.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: má ṣe sọ ohunkóhun fún ẹnikẹ́ni
  rationale: 'Ó pa ìfòfindè alágbára méjèèjì mọ́: kò gbọdọ̀ sọ ohunkóhun, kò sì gbọdọ̀ sọ ọ́ fún ẹnikẹ́ni.'
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ohun tí kò gbọdọ̀ ṣe yàtọ̀ sí ohun tí ó gbọdọ̀ ṣe ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ὕπαγε
  choice: lọ
  rationale: Àṣẹ ìrìn ni, “lọ” sì jẹ́ ìtumọ̀ tààrà àti àdánidá.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: fi ara rẹ hàn àlùfáà
  rationale: Ó pa arọ́pò-orúkọ afẹ̀hìntì àti ìfihàn ẹni fún àyẹ̀wò àlùfáà mọ́.
- source_word: ἱερεῖ
  choice: àlùfáà
  rationale: Ó tọ́ka sí àlùfáà tí ó yẹ gẹ́gẹ́ bí àṣẹ Òfin; Yorùbá kò nílò àmì pàtó bí article Gíríìkì níbí.
- source_word: προσένεγκε
  choice: rú
  rationale: Ní àyíká ìrúbọ, “rú” ṣàfihàn ìṣe ẹbọ ju “mú wá” lọ.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: fún ìwẹ̀nùmọ́ rẹ
  rationale: Ó ṣàfihàn ìdí àti ìbáṣepọ̀ ẹbọ náà pẹ̀lú ìwẹ̀nùmọ́ ẹni náà, láìfi ìtumọ̀ míì kún un.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ohun tí Mósè pàṣẹ
  rationale: Ìkójọpọ̀ ohun tí Mósè pàṣẹ ni; fọ́ọ̀mù ẹyọ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: láti jẹ́ ẹ̀rí fún wọn
  rationale: Ó pa ète tàbí àbájáde, ìtumọ̀ ẹ̀rí, àti arọ́pò-orúkọ “wọn” mọ́ láìsọ pé ẹ̀rí náà lòdì sí wọn.
theological_decisions:
- issue: Ẹni tí “wọn” ń tọ́ka sí àti bí “ẹ̀rí fún wọn” ṣe lágbára
  choice: A fi gbolohun náà sílẹ̀ ní gbígbòòrò gẹ́gẹ́ bí “ẹ̀rí fún wọn.”
  alternative: “ẹ̀rí sí wọn” tàbí “ẹ̀rí lòdì sí wọn”
  rationale: Gíríìkì kò sọ “lòdì sí” ní kedere. Ìtumọ̀ yìí jẹ́ kí ẹ̀rí náà lè jẹ́ fún àwọn àlùfáà tàbí àwọn míì, yálà gẹ́gẹ́ bí ìfihàn òtítọ́ tàbí ní agbára tó le ju bẹ́ẹ̀ lọ.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo “àlùfáà” àti “rú” nítorí àyíká Òfin àti ìrúbọ. Àmì ohùn ni a fi sí ibi tí ó bá yẹ.
