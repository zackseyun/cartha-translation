source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: yo
  text: Jésù sì wí fún wọn pé, “Ẹ wá tẹ̀lé mi, èmi yóò sì mú kí ẹ di apẹja ènìyàn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Ẹ máa tọ̀ mí lẹ́yìn
  rationale: Ó sọ ìpè láti tẹ̀ lé Jésù ní ọ̀nà Yorùbá àdánidá, ó sì pa àwòrán ‘lẹ́yìn mi’ mọ́.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: èmi yóò mú kí ẹ di
  rationale: Ó pa ìtumọ̀ méjèèjì, ‘mú kí’ àti ‘di,’ mọ́ láì sọ gbólóhùn náà di líle ní Yorùbá.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: apẹja ènìyàn
  rationale: Ìtumọ̀ tààrà ti àwòrán iṣẹ́ apẹja; ‘ènìyàn’ níbí jẹ́ ti gbogbo ènìyàn, gẹ́gẹ́ bí ἀνθρώπων.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπων nínú àwòrán ‘apẹja’
  choice: ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú Gíríìkì, ἀνθρώπων tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe ọkùnrin nìkan; ‘ènìyàn’ tún pa àwòrán ìpilẹ̀ṣẹ̀ mọ́ láì fi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn; èdè ọ̀wọ̀, kedere, tí ó sì jẹ́ àdánidá fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú αὐτοῖς/ὑμᾶς.
