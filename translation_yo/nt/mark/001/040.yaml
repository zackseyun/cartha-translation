language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: yo
  text: Ọkùnrin kan tí ó ní àrùn ẹ̀tẹ̀ sì wá sọ́dọ̀ rẹ̀[a], ó ń bẹ̀ ẹ́ lọwọ́, ó sì kúnlẹ̀, ó ń sọ fún un pé, “Bí o bá fẹ́[b], o lè sọ mí di mímọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọkùnrin adẹ́tẹ̀ kan sì wá sọ́dọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Bí o bá múra tán.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wẹ mí mọ́.” Fáàbù Gíríìkì náà lè tọ́ka sí ìwẹ̀nùmọ́ kúrò nínú àìmọ́ ní ti ìsìn àti sí ìmúbọ̀sípò ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: ọkùnrin kan tí ó ní àrùn ẹ̀tẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ fún ẹni tí àrùn ẹ̀tẹ̀ tàbí àìsàn awọ ara kan ń ṣe. Ìtumọ̀ yìí fi ẹni síwájú, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: παρακαλῶν
  choice: ó ń bẹ̀ ẹ́
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi taratara bẹ̀ tàbí rawọ́ ẹ̀bẹ̀; ‘ó ń bẹ̀ ẹ́’ jẹ́ èdè Yorùbá àdánidá tí kò fi ohun tí Gíríìkì kò sọ kún un.
- source_word: γονυπετῶν
  choice: ó kúnlẹ̀
  rationale: Ó sọ ìṣe fífi eékún balẹ̀ ní ṣókí àti ní èdè Yorùbá tí ó wọ́pọ̀.
- source_word: Ἐὰν θέλῃς
  choice: Bí o bá fẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ tàbí ìmúratán ẹni mọ́, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú.
- source_word: δύνασαί
  choice: o lè
  rationale: ‘O lè’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ agbára tàbí àǹfààní láti ṣe ohun kan.
- source_word: καθαρίσαι
  choice: sọ mí di mímọ́
  rationale: Ó pa ìtumọ̀ ìwẹ̀nùmọ́ mọ́, èyí tí ó lè kan ìmúbọ̀sípò ara àti kíkúrò nínú àìmọ́ ní ti ìsìn, dípò yíyí rẹ̀ sí ‘mú mi láradá’ nìkan.
- source_word: ἔρχεται
  choice: tọ̀ ọ́ wá
  rationale: Fáàbù àkókò ìsinsìnyí Gíríìkì jẹ́ historical present; Yorùbá kò ní láti samisi àkókò náà ní ọ̀nà kan náà, ṣùgbọ́n ‘tọ̀ ọ́ wá’ mú ìrìnṣẹ̀lẹ̀ náà hàn gbangba, ó sì bá ìtàn mu.
theological_decisions:
- issue: Irú ìwẹ̀nùmọ́ tí καθαρίσαι ń tọ́ka sí nínú ọ̀rọ̀ àrùn ẹ̀tẹ̀
  choice: sọ mí di mímọ́
  alternative: mú mi láradá
  rationale: Orísun náà lo fáàbù ‘wẹ̀ mọ́,’ kì í ṣe fáàbù ìwòsàn lásán. Ìtumọ̀ yìí jẹ́ kí ìmúbọ̀sípò ara àti ìmúpadàbọ̀ sí ipò mímọ́ ní ti ìsìn dúró papọ̀ láìfi ọ̀kan pa èkejì rẹ́.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá; ọ̀rọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀rọ̀ tí ó fi ẹni síwájú fún λεπρός, a sì pa ìyàtọ̀ tó wà láàárín ‘sọ di mímọ́’ àti ‘mú láradá’ mọ́.
