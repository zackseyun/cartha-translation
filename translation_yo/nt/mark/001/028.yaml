  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: yo
  text: Ìròyìn nípa rẹ̀ sì tàn lẹ́sẹ̀kẹsẹ̀ káàkiri gbogbo agbègbè Gálílì[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun tí a gbọ́ nípa rẹ̀” tàbí “òkìkí rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tàn lẹ́sẹ̀kẹsẹ̀ sí gbogbo ibi nínú gbogbo agbègbè Gálílì.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: tàn ... dé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń ṣàpèjúwe bí ìròyìn ṣe jáde tí ó sì dé ibi púpọ̀. “Tàn ... dé” jẹ́ Yorùbá àdánidá, ó sì pa ìrísí ìṣíkiri ìròyìn mọ́.
- source_word: ἀκοὴ
  choice: ìròyìn
  rationale: Níbí, ἀκοή túmọ̀ sí ohun tí àwọn ènìyàn ń gbọ́ nípa Jésù, ìyẹn ìròyìn tàbí èsì kan, kì í ṣe ìgbọ́ràn tàbí agbára láti gbọ́.
- source_word: αὐτοῦ
  choice: nípa rẹ̀
  rationale: Ẹ̀ka ọ̀rọ̀ olùní Gíríìkì yìí ń tọ́ka sí ohun tí ìròyìn náà dá lé, kì í ṣe pé ó ní ìròyìn náà; “nípa rẹ̀” sọ èyí ní Yorùbá kedere.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Èyí fi ìyára àti àìsí ìdádúró tí Máàkù tẹnumọ́ hàn ní Yorùbá òde òní.
- source_word: πανταχοῦ
  choice: gbogbo ibi
  rationale: “Gbogbo ibi” jẹ́ ìtumọ̀ tààrà fún adverb náà, ó sì tẹnumọ́ bí ìròyìn náà ṣe tàn káàkiri.
- source_word: περίχωρον
  choice: agbègbè
  rationale: Nínú gbolohun yìí, “agbègbè” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ilẹ̀ tàbí àgbègbè tó yí ibi kan ká, láìfi kún un pé ìgbèríko nìkan ni.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: j gbogbo agbègbè Gálílì
  rationale: A ṣe àtúnṣe ìkọ̀wé rẹ̀ nínú ẹsẹ̀ sí “jákèjádò gbogbo agbègbè Gálílì”; èyí sọ ìwọ̀n tó kún (“gbogbo”) àti bí ìròyìn náà ṣe dé káàkiri agbègbè náà, láìsọ pé agbègbè náà wà níta Gálílì.
theological_decisions:
- issue: Ohun tí ἀκοὴ αὐτοῦ ń tọ́ka sí
  choice: ìròyìn nípa rẹ̀
  alternative: òkìkí rẹ̀
  rationale: “Ìròyìn nípa rẹ̀” fi ojú sí ohun tí àwọn ènìyàn gbọ́ nípa Jésù lẹ́yìn ohun tó ṣẹlẹ̀, láìfi èrò òkìkí tàbí ipò gbajúmọ̀ kún ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ περίχωρον àti Γαλιλαίας
  choice: gbogbo agbègbè Gálílì
  alternative: gbogbo agbègbè tó yí Gálílì ká
  rationale: Yíyàn àkọ́kọ́ kò fi dandan mú kí òǹkàwé rò pé ìròyìn náà lọ sí ilẹ̀ tó wà lẹ́yìn ààlà Gálílì; ó jẹ́ kí genitive Gíríìkì dúró gẹ́gẹ́ bí àpèjúwe agbègbè tó jẹ́ ti Gálílì.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Tàn ... dé” jẹ́ àdánidá ju títúmọ̀ ἐξῆλθεν ní líle gẹ́gẹ́ bí “jáde” lọ, ṣùgbọ́n àkíyèsí [b] pa ìtò Gíríìkì tó túbọ̀ sun mọ́ orísun mọ́. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
