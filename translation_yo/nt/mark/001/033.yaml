  text: And the whole city was gathered at the door[a].
translation:
  language: yo
  text: Gbogbo ìlú náà sì péjọ ní ẹnu ọ̀nà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ẹnu ọ̀nà.” Ọ̀rọ̀-atọ́ka Gíríìkì náà lè tọ́ka sí ìlọ sí ibi kan tàbí sí ibi tí ènìyàn wà; ní àyíká yìí, ó ń tọ́ka sí àwọn ènìyàn tí wọ́n péjọ ní ibi àbáwọlé ilé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: péjọ
  rationale: Ìṣe àìpé ἦν pẹ̀lú participle perfect passive ἐπισυνηγμένη ṣàpèjúwe bí àwùjọ náà ṣe wà nígbà yẹn. Ní Yorùbá, ọ̀rọ̀-ìṣe “péjọ” sọ ipò yìí ní ti ẹ̀dá láìfi ọ̀rọ̀ àsopọ̀ tí kò pọndandan kún un.
- source_word: ὅλη ἡ πόλις
  choice: gbogbo ìlú náà
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí “gbogbo ìlú náà” mọ́, títí kan ìsọ àsọdùn aláwòrán rẹ̀, láìsọ ọ́ di iye tí a fọ̀nà iṣirò mú.
- source_word: ἐπισυνηγμένη
  choice: péjọ
  rationale: “Péjọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún pípé àwọn ènìyàn jọ sí ibì kan; kò fi ìtumọ̀ àfikún bí ìhámọ́ra tàbí ìkójọpọ̀ líle kún ọ̀rọ̀ náà.
- source_word: πρὸς τὴν θύραν
  choice: sí ẹnu ọ̀nà
  rationale: “Sí” pa agbára πρός mọ́, èyí tí ó lè tọ́ka sí ìdojúkọ tàbí ibi tí ìkójọpọ̀ náà dé; “ẹnu ọ̀nà” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi àbáwọlé ilé.
- source_word: θύραν
  choice: ẹnu ọ̀nà
  rationale: Ní àyíká yìí θύρα tọ́ka sí ibi àbáwọlé ilé. “Ẹnu ọ̀nà” dára ju “ilẹ̀kùn” lọ nítorí àwọn ènìyàn péjọ sí ibi àbáwọlé, kì í ṣe sórí ohun tí a fi ń ti ọ̀nà.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ òde òní, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “péjọ” dípò gbólóhùn passive tí yóò le ní Yorùbá, a sì lo “ẹnu ọ̀nà” láti fi ibi àbáwọlé hàn ní ti ẹ̀dá.
