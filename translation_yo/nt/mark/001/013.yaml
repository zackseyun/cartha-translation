language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: yo
  text: Ó sì wà ní aginjù fún ogójì ọjọ́, Sátánì sì ń dán an wò[a]. Ó sì wà pẹ̀lú àwọn ẹranko igbó, àwọn áńgẹ́lì sì ń ṣe ìránṣẹ́ fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń dẹwò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “dán wò” tàbí “dẹwò”; níhìn-ín, níwọ̀n bí Sátánì ti jẹ́ olùṣe, ìtumọ̀ ìdẹwò sí ẹ̀ṣẹ̀ ṣeé ṣe gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi tí kò fi bẹ́ẹ̀ sí olùgbé; kò fi dandan túmọ̀ sí aṣálẹ̀ oníyanrìn, ó sì dá ìtumọ̀ ibi àti ìró Bíbélì náà dúró.
- source_word: τεσσεράκοντα ἡμέρας
  choice: fún ogójì ọjọ́
  rationale: Ó túmọ̀ àkókò tí gbólóhùn accusative náà fi hàn ní tààràtà, láìfi àlàyé ìtumọ̀ ìṣàpẹẹrẹ kún un.
- source_word: πειραζόμενος
  choice: ń dán an wò
  rationale: πειράζω lè túmọ̀ sí dídán ẹnì kan wò tàbí dídẹ ẹ́ wò sínú ẹ̀ṣẹ̀. “Dán an wò” jẹ́ àdéhùn Yorùbá tó bójú mu, tí ó sì pa ìṣòro ìtumọ̀ méjèèjì mọ́; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé, nítorí Sátánì ni aṣojú, ìdẹwò sí ẹ̀ṣẹ̀ ṣeé ṣe kó jẹ́ ohun tí ọ̀rọ̀ náà tẹnumọ́ jù.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: Sátánì
  rationale: Orúkọ tàbí oyè ẹni àtakò ẹ̀mí yìí ni a ń kọ ní Yorùbá gẹ́gẹ́ bí “Sátánì”; a fi í ṣe olùṣe nínú gbólóhùn náà ní kedere.
- source_word: μετὰ τῶν θηρίων
  choice: pẹ̀lú àwọn ẹranko igbó
  rationale: “Àwọn ẹranko igbó” jẹ́ èdè Yorùbá òde òní tó ṣe kedere fún àwọn ẹranko tí kì í ṣe ẹran ọ̀sìn, ó sì pa àyíká egan náà mọ́.
- source_word: ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Àyíká Sátánì àti iṣẹ́ ìránṣẹ́ tí ó ju ti ẹ̀dá ènìyàn lọ fi hàn pé àwọn ẹ̀dá ọ̀run ni, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: διηκόνουν αὐτῷ
  choice: ń ṣe ìránṣẹ́ fún un
  rationale: Ìṣe aláìparí “ń ṣe” pa ìtẹ̀síwájú imperfect náà mọ́, “ṣe ìránṣẹ́ fún un” sì jẹ́ Yorùbá àdánidá fún iṣẹ́ ìtọ́jú tàbí sísìn.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Ó sì wà ... Ó sì wà ... àwọn ... sì
  rationale: Àtúnṣe “sì” pa ọ̀nà ìsọ̀rọ̀ alásopọ̀ Marku mọ́, ṣùgbọ́n pípín sí gbólóhùn méjì mú un rọrùn láti ka ní Yorùbá.
theological_decisions:
- issue: Agbára ìtumọ̀ πειραζόμενος nígbà tí Sátánì jẹ́ aṣojú
  choice: ń dán an wò
  alternative: ń dẹ ẹ́ wò / ń tàn án wò sínú ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ “dán wò” àti “dẹ wò.” Nítorí Sátánì ni olùṣe, ìdẹwò sí ibi lágbára nínú àyíká yìí; síbẹ̀, “dán an wò” àti àlàyé [a] pa àìdánilójú gidi àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. Àwọn “sì” tí a tún lò ń ṣètọju ara ìtàn Marku.
