  text: καὶ ἐμβριμησάμενος αὐτῷ ⸀εὐθὺς ἐξέβαλεν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: yo
  text: Ó sì kìlọ̀ fún un gidigidi[a], lẹ́sẹ̀kẹsẹ̀ ni ó sì lé e jáde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó pàṣẹ fún un gidigidi”; ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ìbínú líle tàbí bíbáni wí líle.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó fi agbára rán an jáde.” Ọ̀rọ̀ Gíríìkì náà lágbára ju ọ̀rọ̀ tí ó túmọ̀ sí “rán an lọ” lásán lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: kìlọ̀ fún un gidigidi
  rationale: Ọ̀rọ̀ náà ń fi ìmọ̀lára àti agbára líle hàn nínú ìkìlọ̀ tàbí àṣẹ. “Kìlọ̀ fún un gidigidi” jẹ́ èdè Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ náà mọ́ láì pinnu pé Jésù ń dá ọkùnrin náà lẹ́bi.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ọkùnrin tí a mú lára dá; ó bá ìlò ọ̀rọ̀ “kìlọ̀ fún” mu ní Yorùbá.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ ìṣe tí ó ṣẹlẹ̀ láìjáfara mọ́, ó sì bá ìyára ìtàn Máàkù mu.
- source_word: ἐξέβαλεν
  choice: lé e jáde
  rationale: Ìṣe náà lágbára ju “rán an lọ” lọ. “Lé e jáde” pa agbára yẹn mọ́, bí ó tilẹ̀ jẹ́ pé ní àyíká yìí kì í ṣe ẹ̀mí èṣù ni a ń lé jáde.
- source_word: αὐτόν
  choice: e
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí ọkùnrin kan náà, ó sì fara mọ́ ọ̀rọ̀-ìṣe “lé” ní ọ̀nà àdánidá.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì jẹ́ àsopọ̀ ìtàn tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Bí ìṣe Jésù sí ọkùnrin tí a mú lára dá ṣe le tó
  choice: A fi hàn pé Jésù kìlọ̀, ó sì lé ọkùnrin náà jáde pẹ̀lú agbára líle.
  alternative: A lè túmọ̀ rẹ̀ bí fífún un ní àṣẹ líle lásán, tàbí bí bíbá ọkùnrin náà wí nítorí ìbínú.
  rationale: ἐμβριμησάμενος àti ἐξέβαλεν jẹ́ ọ̀rọ̀ tó lágbára. Ìtumọ̀ náà pa líle yìí mọ́, ṣùgbọ́n kò fi kún un pé Jésù ṣe ìbínú ẹ̀ṣẹ̀ tàbí pé ó dá ọkùnrin náà lẹ́bi.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. “Kìlọ̀ fún un gidigidi” jẹ́ kíkà tí ó rọrùn, nígbà tí “lé e jáde” mọ̀ọ́mọ̀ pa agbára ọ̀rọ̀ Gíríìkì mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
