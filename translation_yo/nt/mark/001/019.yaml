source:
  edition: SBLGNT
  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: yo
  text: Ó sì lọ síwájú díẹ̀, ó rí Jákọ́bù ọmọ Sebedé àti Jòhánù, arákùnrin rẹ̀, bí wọ́n ti wà nínú ọkọ̀ ojú omi tí wọ́n ń tún àwọn àwọ̀n náà ṣe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń ṣàtúnṣe àwọn àwọ̀n náà” tàbí “wọ́n ń pèsè àwọn àwọ̀n náà.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pípa ohun kan sí ipò tó yẹ tàbí títún un ṣe kí ó padà sí ipò rere.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: lọ síwájú díẹ̀
  rationale: Ó fi ìlọsíwájú ní ọ̀nà fún ìjìnnà díẹ̀ hàn ní Yorùbá àdánidá, ó sì bá ipa participle aorist tí ń ṣàlàyé ohun tó ṣẹlẹ̀ ṣáájú ìrí náà mu.
- source_word: εἶδεν
  choice: ó rí
  rationale: Èyí ni ìtumọ̀ ìtàn lasan ti ὁράω, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jákọ́bù ọmọ Sebedé
  rationale: Àkójọpọ̀ article àti genitive dá Jákọ́bù mọ̀ nípa baba rẹ̀; ‘ọmọ Sebedé’ ni ọ̀nà Yorùbá tó ṣe kedere jù.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jòhánù arákùnrin rẹ̀
  rationale: αὐτοῦ tọ́ka sí Jákọ́bù lọ́nà tó ṣeé ṣe jù, nítorí náà gbolohun yìí fi ìbátan wọn hàn ní ṣókí.
- source_word: ἐν τῷ πλοίῳ
  choice: nínú ọkọ̀ ojú omi
  rationale: Article náà tọ́ka sí ọkọ̀ ojú omi pàtó tí wọ́n wà nínú rẹ̀; ‘nínú ọkọ̀ ojú omi’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: καταρτίζοντας
  choice: ń tún ... ṣe
  rationale: Nínú ọ̀rọ̀ ìpẹja, èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún títún àwọ̀n tó bàjẹ́ ṣe, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè tún túmọ̀ sí pípa ohun kan sí ipò tàbí pípèsè rẹ̀.
- source_word: τὰ δίκτυα
  choice: àwọn àwọ̀n náà
  rationale: δίκτυα túmọ̀ sí àwọn àwọ̀n ìpẹja; demonstrative náà ṣe iṣẹ́ article Gíríìkì ní Yorùbá, láìfi ohun-ìní tí kò hàn gbangba sínú ẹsẹ náà.
- source_word: καὶ αὐτούς
  choice: Àwọn náà wà
  rationale: ‘Àwọn náà’ pa ìtumọ̀ pé Jákọ́bù àti Jòhánù pẹ̀lú wà nínú ọkọ̀ mọ́, ó sì yí accusative pẹ̀lú participle padà sí gbolohun Yorùbá tó rọrùn.
