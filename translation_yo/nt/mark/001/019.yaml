  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbolohun méjì náà jẹ́ kí ìtàn náà ṣe kedere fún òǹkàwé lásán, láìyí ìtẹ̀síwájú ìṣẹ̀lẹ̀ inú Gíríìkì padà.
