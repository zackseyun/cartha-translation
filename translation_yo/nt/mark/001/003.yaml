id: MRK.1.3
reference: Mark 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: yo
  text: 'Ohùn ẹni tí ń ké jáde ní aginjù[a]:


    “Ẹ pèsè ọ̀nà Olúwa[b];


    ẹ ṣe àwọn ipa ọ̀nà rẹ̀ ní tààrà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá lo ìlànà àmì ìdádúró mìíràn fún àyọlò Aísáyà: “Ohùn ẹni tí ń ké jáde pé, ‘Ní aginjù, ẹ pèsè ọ̀nà Olúwa …’”'
    reason: alternative_reading
  - marker: b
    text: “Olúwa” ni a fi tú κύριος ní èdè Gíríìkì; àyọlò náà ń ṣe ìrántí Aísáyà 40:3, níbi tí ọ̀rọ̀ Hébérù ti ń tọ́ka sí OLÚWA (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Ohùn
  rationale: “Ohùn” jẹ́ ìtumọ̀ àdánidá fún φωνή; Yorùbá kò nílò ọ̀rọ̀ atókùn bí “a” tàbí “the” níbí.
- source_word: βοῶντος
  choice: ẹni tí ń ké jáde
  rationale: Ó pa àkóónú genitive participle náà mọ́, ó sì fi agbára ìpè oníwàásù hàn ju “tí ń pè” lọ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” bá àyíká Máàkù àti àwòrán àsọtẹ́lẹ̀ Aísáyà mu, ó sì lè túmọ̀ sí ilẹ̀ aṣálẹ̀ tàbí ibi ìkọ̀kọ̀ tí ènìyàn kò pọ̀ sí.
- source_word: Ἑτοιμάσατε
  choice: Ẹ pèsè
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni; “ẹ pèsè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì fi ìpè sí ìmúrasílẹ̀ hàn.
- source_word: τὴν ὁδὸν
  choice: ọ̀nà
  rationale: “Ọ̀nà” pa ìtumọ̀ gidi ti ipa ìrìn àti ìtumọ̀ àpẹẹrẹ àsọtẹ́lẹ̀ mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος, láì fi YHWH sínú ọ̀rọ̀ Gíríìkì ní tààràtà.
- source_word: εὐθείας
  choice: tọ́
  rationale: Nínú gbolohun nípa ipa ọ̀nà, “tọ́” túmọ̀ sí pé kí ó má yí tàbí wọ́, kì í ṣe ìwà òdodo.
- source_word: ποιεῖτε
  choice: ẹ mú … tọ́
  rationale: Ìṣọ̀kan Yorùbá “mú … tọ́” jẹ́ àdánidá fún “make … straight” ó sì pa àṣẹ náà mọ́.
- source_word: τὰς τρίβους αὐτοῦ
  choice: àwọn ipa ọ̀nà rẹ̀
  rationale: “Àwọn ipa ọ̀nà” pa ọ̀pọ̀ τρίβους mọ́, ó sì yà á díẹ̀ sọ́tọ̀ kúrò ní ὁδός; “rẹ̀” ń tọ́ka sí Olúwa.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò Aísáyà tí Hébérù rẹ̀ ń tọ́ka sí YHWH
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì ni κύριος, nítorí náà àkọlé “Olúwa” dúró nínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ ojú ewé fi hàn pé àyọlò náà ń ṣe ìrántí Aísáyà 40:3, níbi tí Hébérù ti ń tọ́ka sí YHWH, láì pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
- issue: Ibi tí “ní aginjù” so mọ́
  choice: Ó so mọ́ “ẹni tí ń ké jáde”
  alternative: 'Ó so mọ́ àṣẹ náà: “Ní aginjù, ẹ pèsè ọ̀nà Olúwa”'
  rationale: Ètò ọ̀rọ̀ Gíríìkì Máàkù ṣe àtìlẹ́yìn fún “ẹni tí ń ké jáde ní aginjù.” Síbẹ̀, ìlànà àmì ìdádúró mìíràn nínú àyọlò Aísáyà ṣeé ṣe, nítorí náà a pa á mọ́ nínú àlàyé [a].
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; àṣẹ ọ̀pọ̀ ènìyàn “Ẹ …” jẹ́ kedere, ọ̀rọ̀ náà sì ní iyì tó yẹ fún àyọlò àsọtẹ́lẹ̀ láì di àtijọ́ tàbí líle láti lóye.
