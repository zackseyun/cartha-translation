  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: yo
  text: Jésù sì bá a wí pé, “Dákẹ́![a] Jáde kúrò nínú ọkùnrin náà!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààràtà, “Kí a di ẹnu rẹ mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: bá a wí
  rationale: Ọ̀rọ̀ yìí fi ìbáwí líle àti àṣẹ Jésù hàn, láì sọ ọ́ di àṣẹ lásán tàbí fi ìtumọ̀ míì kún un.
- source_word: αὐτῷ
  choice: a
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ẹ̀mí àìmọ́ tí Jésù ń bá sọ̀rọ̀. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ yìí, ṣùgbọ́n àṣẹ pé kí ó jáde kúrò lára ọkùnrin náà mú ẹni tí a ń bá sọ̀rọ̀ ṣe kedere.
- source_word: λέγων
  choice: pé
  rationale: “Pé” ni ọ̀nà àdánidá ní Yorùbá láti mú ọ̀rọ̀ tí ó tẹ̀ lé ìbáwí náà wọlé, bó tilẹ̀ jẹ́ pé Gíríìkì lo ẹ̀yà-ìṣe tí ó túmọ̀ sí “ní sísọ.”
- source_word: Φιμώθητι
  choice: Dákẹ́
  rationale: Àṣẹ kúkúrú yìí sọ ìtumọ̀ àfiwé náà ní Yorùbá òde òní lọ́nà tó ṣe kedere, ó sì pa líle àṣẹ náà mọ́. Ìtumọ̀ tààràtà jù lọ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔξελθε
  choice: Jáde
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ àṣẹ fún ẹ̀mí náà láti jáde láti inú ẹni tí ó wà lára rẹ̀.
- source_word: ἐξ αὐτοῦ
  choice: kúrò lára rẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìyapa ẹ̀mí náà kúrò lára ọkùnrin náà hàn ní Yorùbá àdánidá; ó tún jẹ́ kí ìyàtọ̀ láàárín ẹni tí Jésù ń bá sọ̀rọ̀ àti ọkùnrin náà ṣe kedere.
theological_decisions:
- issue: Ẹni tí Jésù bá wí
  choice: Ẹ̀mí àìmọ́ ni Jésù ń bá sọ̀rọ̀ ní tààràtà.
  alternative: Kí a ka ọkùnrin náà sí ẹni tí Jésù bá wí.
  rationale: Àyíká ẹsẹ tó ṣáájú àti àṣẹ “Jáde kúrò lára rẹ̀” fi hàn pé ẹ̀mí náà ni a ń bá sọ̀rọ̀, nígbà tí “rẹ̀” tọ́ka sí ọkùnrin náà. Èyí pa ìyàtọ̀ tí ìtàn náà ṣe láàárín ẹni tí ìpọ́njú bá àti ẹ̀mí náà mọ́, láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. Àṣẹ méjèèjì jẹ́ kúkúrú, ó sì lágbára gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì. Àmì ohùn kún gbogbo ọ̀rọ̀ níbi tó bá yẹ.
