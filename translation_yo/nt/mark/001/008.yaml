source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: yo
  text: Èmi ni mo fi omi baptisi yín, ṣùgbọ́n òun yóò fi Ẹ̀mí Mímọ́ baptisi yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí Mímọ́.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà lè túmọ̀ sí méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Èmi
  rationale: A lo arọ́pò-orúkọ tí ó ní ìtẹnumọ́ láti pa ìyàtọ̀ tó wà láàárín Jòhánù àti ẹni tí ń bọ̀ mọ́.
- source_word: ἐβάπτισα
  choice: fi omi baptisi
  rationale: “Baptisi” ni ọ̀rọ̀ ìsìn tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa; “fi omi” fi ipa irinṣẹ́ dative ὕδατι hàn ní èdè àdánidá láì fi ọ̀nà baptisi kan pàtó múlẹ̀.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, ó sì bá ὑμᾶς mu.
- source_word: ὕδατι
  choice: fi omi
  rationale: Dative náà lè tọ́ka sí ohun èlò tàbí ọ̀nà; “fi omi” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì dára.
- source_word: αὐτὸς
  choice: òun
  rationale: “Òun” mú ìtẹnumọ́ àti ìyàtọ̀ sí “Èmi” jáde ní ti ẹ̀dá, láì nílò àfikún ọ̀rọ̀.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín baptisi Jòhánù àti baptisi ẹni tí ń bọ̀.
- source_word: βαπτίσει
  choice: yóò ... baptisi
  rationale: A pa àsìkò ọjọ́ iwájú àti ìbámu ọ̀rọ̀ pẹ̀lú ἐβάπτισα mọ́.
- source_word: ἐν
  choice: fi
  rationale: “Fi” jẹ́ ìtumọ̀ Yorùbá tó ṣe àdánidá fún ọ̀nà tàbí ohun èlò, ṣùgbọ́n a pa ìtumọ̀ agbègbè “nínú” mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: πνεύματι ἁγίῳ
  choice: Ẹ̀mí Mímọ́
  rationale: Ní àyíká ọ̀rọ̀ Máàkù, gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run; èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tó sì ní ọlá.
theological_decisions:
- issue: Bóyá πνεύματι ἁγίῳ ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni Ọlọ́run tàbí sí agbára mímọ́ aláìlẹ́ni-nínú
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan; ẹ̀mí mímọ́
  rationale: Ìyàtọ̀ tí Jòhánù ṣe láàárín baptisi omi tirẹ̀ àti baptisi ẹni alágbára tí ń bọ̀ tọ́ka lọ́nà tó ṣeé ṣe jù sí Ẹ̀mí Mímọ́ Ọlọ́run, láì fi ẹ̀kọ́ mìíràn kún ohun tí ẹsẹ náà sọ.
- issue: Bí a ṣe yẹ kí a túmọ̀ ἐν nínú ἐν πνεύματι ἁγίῳ
  choice: fi Ẹ̀mí Mímọ́
  alternative: nínú Ẹ̀mí Mímọ́
  rationale: “Fi” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìbáramu pẹ̀lú “fi omi” mọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ “nínú” tí preposition Gíríìkì náà tún lè ní mọ́.
translation_notes:
  register: Èdè Yorùbá òde òní tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A yan “baptisi” gẹ́gẹ́ bí ọ̀rọ̀ ìsìn tí ó ti wọ́pọ̀, kí a má bàa dín ìtumọ̀ náà kù sí ọ̀nà ìrìbọmi kan ṣoṣo. “Èmi ... òun” pa ìtẹnumọ́ Gíríìkì mọ́.
