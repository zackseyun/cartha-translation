  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: yo
  text: Lẹ́yìn tí ó gbọ́ nípa Jésù, ó wá sí ẹ̀yìn rẹ̀ nínú ogunlọ́gọ̀ náà, ó sì fọwọ́ kan aṣọ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘aṣọ àwọ̀lékè rẹ̀.’ Ọ̀rọ̀ Gíríìkì ἱμάτιον ń tọ́ka sí aṣọ ní gbòòrò, ó sì sábà máa ń túmọ̀ sí aṣọ àwọ̀lékè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Lẹ́yìn tí ó gbọ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó fi hàn pé gbígbọ́ náà ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn àkókò yìí jẹ́ ti Yorùbá àdánidá.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: nípa Jésù
  rationale: περί pẹ̀lú genitive túmọ̀ sí ohun tí a gbọ́ nípa ẹnì kan; ‘nípa Jésù’ ṣe àfihàn ìtumọ̀ náà ní kedere.
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: ó wá láti ẹ̀yìn rẹ̀ ní àárín ogunlọ́gọ̀
  rationale: Ó pa ìṣísẹ̀ obìnrin náà láti ẹ̀yìn Jésù mọ́, ó sì fi hàn pé inú ogunlọ́gọ̀ ni ó ti sún mọ́ ọn.
- source_word: ἥψατο
  choice: ó fi ọwọ́ kan
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ fífi ọwọ́ kan ohun kan, láìfikún èrò pé ó dì í mú tàbí pé ó rọ̀ mọ́ ọn.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ‘Aṣọ’ jẹ́ ọ̀rọ̀ gbòòrò tí ó lè dúró fún aṣọ ara tàbí aṣọ àwọ̀lékè, ó sì pa ẹyọ ọ̀rọ̀ Gíríìkì náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti àkókò yìí, ó níyì, ó sì rọrùn fún òǹkàwé lásán. A lo ‘ogunlọ́gọ̀’ fún àwùjọ ènìyàn púpọ̀, a sì tú participle àkọ́kọ́ sí gbólóhùn àkókò Yorùbá àdánidá.
