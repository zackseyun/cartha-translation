  source_fidelity: 'Ìtumọ̀ náà mú ìlànà ìṣẹ̀lẹ̀ Gíríìkì náà dáadáa: obìnrin náà gbọ́ nípa Jésù, ó sún mọ́ ọn láti ẹ̀yìn láàrín ogunlọ́gọ̀, ó sì kan aṣọ rẹ̀. Ṣùgbọ́n ìpò àwọn gbolohun ọrọ̀ nínú ‘ó wá láti ẹ̀yìn rẹ̀ ní àárín ogunlọ́gọ̀’ lè jẹ́ kí ‘láti ẹ̀yìn rẹ̀’ dà bí ibi tí ó ti bẹ̀rẹ̀ ìrìnàjò rẹ̀, kì í ṣe ipò rẹ̀ sí Jésù. Àtúnṣe kékeré ń mú ὄπισθεν hàn kedere.'
