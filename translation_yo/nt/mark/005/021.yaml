source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: yo
  text: Lẹ́yìn tí Jésù ti tún fi ọkọ̀ ojú omi kọjá lọ sí apá kejì[a], ọ̀pọ̀ èrò péjọ yí i ká, Jésù sì wà létí òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni Òkun Gálílì, adágún kan tí àwọn Ìwé Ìhìn Rere sábà máa ń pè ní “òkun.”
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Nígbà tí ... rékọjá
  rationale: Aorist participle inú genitive absolute ń fi ìṣẹ̀lẹ̀ àyíká hàn; “nígbà tí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, nígbà tí “rékọjá” ń fi ìkọjá dé apá kejì hàn.
- source_word: ἐν τῷ πλοίῳ
  choice: fi ọkọ̀ ojú omi
  rationale: Ní Yorùbá, lílo “fi” pẹ̀lú ohun èlò ìrìn jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ pé inú ọkọ̀ ni Jésù fi rékọjá mọ́.
- source_word: πάλιν
  choice: tún
  rationale: “Tún” ń sọ pé ìṣe náà ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: εἰς τὸ πέραν
  choice: sí apá kejì
  rationale: Gbólóhùn yìí ń tọ́ka sí etí òkun ní ìhà òdìkejì, “sí apá kejì” sì jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: συνήχθη
  choice: péjọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí àgbàṣe, “péjọ” ni Yorùbá àdánidá fún bí èrò ṣe kóra jọ.
- source_word: ὄχλος πολὺς
  choice: ọ̀pọ̀ èrò
  rationale: “Ọ̀pọ̀ èrò” sọ iye ńlá àwọn ènìyàn náà ní èdè Yorùbá tó rọrùn, tó sì bójú mu.
- source_word: ἐπ’ αὐτόν
  choice: yí i ká
  rationale: Nínú àyíká yìí, gbólóhùn náà ń fi hàn pé èrò kóra jọ sí ọ̀dọ̀ Jésù, wọ́n sì wà yíká rẹ̀.
- source_word: παρὰ τὴν θάλασσαν
  choice: létí òkun
  rationale: “Létí òkun” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wà ní ẹ̀gbẹ́ omi, lẹ́gbẹ̀ẹ́ etíkun.
- source_word: θάλασσαν
  choice: òkun
  rationale: A pa ọ̀rọ̀ orísun náà mọ́ gẹ́gẹ́ bí “òkun,” dípò yíyí i padà sí “adágún”; àlàyé ìbùdó náà wà nínú àkọsílẹ̀ ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó lọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ọkọ̀ ojú omi” láti yà á sọ́tọ̀ gedegbe kúrò lọ́dọ̀ ọkọ̀ ojú pópó, a sì lo “létí òkun” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá.
