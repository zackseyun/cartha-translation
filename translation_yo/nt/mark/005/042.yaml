  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ọmọbìnrin náà dìde, ó sì ń rìn[a], nítorí ọmọ ọdún méjìlá ni. Lẹ́sẹ̀kẹsẹ̀, ẹnu yà wọ́n gidigidi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì ń rìn káàkiri.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní imperfect, ó sì fi ìṣe tó ń bá a lọ hàn.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ọ̀nà tó sún mọ́ Gíríìkì: “ìyàlẹ́nu ńlá ya wọ́n.” Gíríìkì lo ọ̀rọ̀-ìṣe kan àti ọ̀rọ̀-orúkọ tí ó jọmọ́ ara wọn láti tẹnumọ́ bí ìyàlẹ́nu náà ṣe pọ̀ tó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára àti ìgbésẹ̀ alágbára tí Máàkù sábà fi εὐθύς hàn mọ́ nínú Yorùbá àdánidá.
- source_word: ἀνέστη
  choice: dìde
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé ọmọbìnrin náà dìde ní ti ara lẹ́yìn àṣẹ Jésù; ‘dìde’ kò fi ìtumọ̀ àjíǹde kún un ju bí Gíríìkì ṣe béèrè lọ.
- source_word: κοράσιον
  choice: ọ̀dọ́bìnrin náà
  rationale: Ó tọ́ka sí ọmọbìnrin tàbí ọ̀dọ́bìnrin; gbólóhùn tó tẹ̀ lé e sọ ọjọ́ orí rẹ̀ ní kedere.
- source_word: περιεπάτει
  choice: ó bẹ̀rẹ̀ sí í rìn
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ hàn lẹ́yìn dídìde rẹ̀; ọ̀rọ̀ yìí mú ìbẹ̀rẹ̀ àti ìtẹ̀síwájú ìrìn náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: nítorí ọmọ ọdún méjìlá ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ọjọ́ orí, ‘nítorí’ sì pa iṣẹ́ àlàyé γάρ mọ́.
- source_word: ἐξέστησαν … ἐκστάσει μεγάλῃ
  choice: ẹnu yà wọ́n gidigidi
  rationale: Ó sọ ìyàlẹ́nu líle tí ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ alábátan Gíríìkì náà ń tẹnumọ́, láì jẹ́ kí Yorùbá le tàbí di àsọtúnsọ àjèjì.
theological_decisions:
- issue: Ìtumọ̀ àjíǹde tó lè wà nínú ἀνέστη
  choice: A túmọ̀ ọ́ sí dídìde ní ti ara nínú ìtàn iṣẹ́ ìyanu náà.
  alternative: ‘jí dìde,’ èyí tó lè mú àjíǹde kún ọ̀rọ̀ náà ní kedere sí i
  rationale: Àyíká fi hàn pé a dá ọmọ náà padà sí ìyè, ṣùgbọ́n ọ̀rọ̀-ìṣe náà fúnra rẹ̀ tún lè túmọ̀ sí dídìde lásán. ‘Dìde’ pa agbára ìṣẹ̀lẹ̀ náà mọ́ láì fi ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò fi dandan sọ kún un.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn ní kíkún, tó sì jẹ́ ti òde òní. ‘Ẹnu yà wọ́n gidigidi’ jẹ́ ọ̀nà àdánidá, ọ̀wọ̀, tí òǹkàwé Yorùbá lásán lè lóye; àlàyé ìtumọ̀ alábátan Gíríìkì wà nínú àlàyé ìsàlẹ̀.
