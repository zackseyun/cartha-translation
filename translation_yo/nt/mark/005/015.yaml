id: MRK.5.15
reference: Mark 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: yo
  text: Wọ́n sì wá sọ́dọ̀ Jésù, wọ́n sì rí ọkùnrin tí ẹ̀mí èṣù ti wọ̀ náà; ó jókòó, ó wọ aṣọ, ọpọlọ rẹ̀ sì pé—òun ni ẹni tí Lẹ́gíónì[a] ti wọ̀ tẹ́lẹ̀—ẹ̀rù sì bà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lẹ́gíónì” lè jẹ́ orúkọ tí àwọn ẹ̀mí èṣù náà fi pe ara wọn, tàbí àpèjúwe ẹgbẹ́ ńlá wọn. Ní ilẹ̀ Róòmù, lẹ́gíónì jẹ́ ẹgbẹ́ ọmọ ogun ńlá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n sì tọ ... wá
  rationale: A tú ìṣe àkókò ìsinsìnyí inú ìtàn Gíríìkì sí ọ̀nà ìsọ̀rọ̀ ìtàn Yorùbá tí ó bá àyíká ọ̀rọ̀ mu, láì sọ ìtàn náà di ọ̀rọ̀ àkókò ìsinsìnyí tí kò wọ́pọ̀.
- source_word: θεωροῦσιν
  choice: wọ́n sì rí
  rationale: “Rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìran tí wọ́n rí níwájú wọn mu; kò fi ìtumọ̀ àfikún bí ìwádìí jinlẹ̀ kún un.
- source_word: δαιμονιζόμενον
  choice: ọkùnrin tí àwọn ẹ̀mí èṣù ti wọ̀
  rationale: Èyí sọ ìdálóró ẹ̀mí èṣù gẹ́gẹ́ bí ìtàn náà ṣe gbé e kalẹ̀, ó sì lo ọ̀nà ìsọ̀rọ̀ Yorùbá tó ṣe kedere dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ìṣègùn.
- source_word: καθήμενον
  choice: ó jókòó
  rationale: Ìtumọ̀ tààrà yìí fi ipò tí wọ́n bá ọkùnrin náà hàn ní kedere.
- source_word: ἱματισμένον
  choice: ó wọ aṣọ
  rationale: Ọ̀nà yìí jẹ́ ti ẹnu gbogbo ènìyàn, ó sì mú ìyàtọ̀ sí ipò rẹ̀ tẹ́lẹ̀ hàn.
- source_word: σωφρονοῦντα
  choice: ọpọlọ rẹ̀ sì pé
  rationale: Àkànlò èdè Yorùbá yìí fi hàn pé èrò àti ìwà rẹ̀ ti padà sí ipò rere, láì dín ọ̀rọ̀ náà kù sí àyẹ̀wò ìṣègùn nìkan.
- source_word: ἐσχηκότα
  choice: tí ... ti wọ̀ tẹ́lẹ̀
  rationale: “Ti ... tẹ́lẹ̀” fi hàn pé ipò yẹn ti wà ṣáájú ohun tí wọ́n ń rí báyìí, ṣùgbọ́n ó ṣì ń dá ọkùnrin náà mọ̀ nínú ìtàn.
- source_word: λεγιῶνα
  choice: ẹgbẹ́ ẹ̀mí èṣù tí a ń pè ní Lẹ́gíónì
  rationale: Ọ̀nà yìí pa ìtọ́kasí sí orúkọ tàbí àpèjúwe inú ẹsẹ ṣáájú mọ́, ó sì jẹ́ kó yé òǹkàwé pé ọ̀pọ̀ ẹ̀mí èṣù ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù sì bà wọ́n
  rationale: Èyí ni àkànlò Yorùbá tó wọ́pọ̀ jù lọ fún ìbẹ̀rù tó dé bá wọn nígbà tí wọ́n rí ohun tó ṣẹlẹ̀.
theological_decisions:
- issue: Àpèjúwe bí ẹ̀mí èṣù ṣe ń dá ọkùnrin náà lóró
  choice: ọkùnrin tí àwọn ẹ̀mí èṣù ti wọ̀
  alternative: ọkùnrin tí ẹ̀mí èṣù ń dá lóró
  rationale: Àṣàyàn náà pa ìjẹ́wọ́ ìtàn nípa agbára àwọn ẹ̀mí èṣù mọ́, láì sọ ọ́ di àìsàn lásán, ó sì bá ọ̀pọ̀ ẹ̀mí inú “Lẹ́gíónì” mu.
- issue: Bóyá λεγιών jẹ́ orúkọ tàbí àpèjúwe
  choice: ẹgbẹ́ ẹ̀mí èṣù tí a ń pè ní Lẹ́gíónì
  alternative: lẹ́gíónì náà
  rationale: Gíríìkì lè tọ́ka sí àpèjúwe tàbí sí orúkọ tí àwọn ẹ̀mí náà sọ tẹ́lẹ̀. Ọ̀nà tí a yàn jẹ́ kí ìbáṣepọ̀ méjèèjì dúró láì fi dandan yan ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí wọ́n ti yẹ, a sì pa ìṣàn gbólóhùn Gíríìkì mọ́ pẹ̀lú àmì àárín gbólóhùn àti àmì ìfọ̀rọ̀gbárí.
