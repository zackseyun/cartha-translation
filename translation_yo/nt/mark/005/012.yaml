  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Wọ́n sì bẹ̀ ẹ́ gidigidi” ṣàfihàn παρεκάλεσαν αὐτὸν, “Rán wa sínú àwọn ẹlẹ́dẹ̀” ṣètọ́ka sí Πέμψον ἡμᾶς εἰς τοὺς χοίρους, àti “kí a lè wọ inú wọn” pa ète ìwọlé nínú àwọn ẹlẹ́dẹ̀ náà mọ́. Kò fikún ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ìtàn tí kò sí nínú ẹsẹ̀.'
  naturalness: Gbolóhùn náà jẹ́ Yorùbá òde òní tó rọrùn láti ka ní gbangba. Ìlò “bẹ̀ ẹ́ gidigidi,” “Rán wa,” àti “wọ inú wọn” jẹ́ èdè àdánidá, àwọn àmì ohùn sì pé.
  terminology: “Ẹlẹ́dẹ̀” jẹ́ ìbámu kedere àti ti ìlò gbogbogbò fún χοίρους. “Rán” ń dá ìtumọ̀ πέμπω dúró dáadáa, láìsọ ọ́ di ìfẹ̀gẹ̀gẹ̀ fún ìyọ̀nda nìkan. Kò sí ẹsẹ̀ ìsàlẹ̀ Yorùbá tó nílò láti ṣe àtúnṣe, nítorí àṣàyàn pigs/swine nínú Gẹ̀ẹ́sì kò ṣàfihàn ìyàtọ̀ tó yẹ kí a gbé wá sínú Yorùbá.
