id: MRK.5.12
reference: Mark 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: yo
  text: Wọ́n sì bẹ̀ ẹ́ gidigidi pé, “Rán wa sínú àwọn ẹlẹ́dẹ̀, kí a lè wọ inú wọn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: bẹ̀ ẹ́ gidigidi
  rationale: Ọ̀rọ̀ yìí fi ẹ̀bẹ̀ líle àti kánjúkánjú hàn; “bẹ̀ … gidigidi” jẹ́ Yorùbá àdánidá tó bá agbára ìtàn náà mu.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, “pé” ni ọ̀nà àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹ̀bẹ̀ náà ní, láìfi ìtumọ̀ kún un.
- source_word: Πέμψον ἡμᾶς
  choice: Rán wa
  rationale: Ó pa ìtumọ̀ pàtàkì πέμπω, ‘rán,’ mọ́, dípò kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ‘gbà wá láàyè’ nìkan.
- source_word: εἰς τοὺς χοίρους
  choice: sínú àwọn ẹlẹ́dẹ̀
  rationale: “Ẹlẹ́dẹ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún χοῖρος; “sínú” sì pa ìtọ́sọ́nà εἰς mọ́.
- source_word: ἵνα εἰς αὐτοὺς εἰσέλθωμεν
  choice: kí a lè wọ inú wọn
  rationale: “Kí” fi ète hàn, “lè” sì pa ìrísí ohun tí wọ́n ń fẹ́ kí ó ṣeé ṣe mọ́; “wọ inú wọn” sọ ìwọlé sínú àwọn ẹranko náà ní kedere.
theological_decisions:
- issue: Irú ẹ̀bẹ̀ tí àwọn ẹ̀mí náà ń bẹ Jésù
  choice: A fi wọ́n hàn bí ẹni tó ń bẹ Jésù gidigidi pé kó rán wọn sínú àwọn ẹlẹ́dẹ̀.
  alternative: Kí a sọ ọ́ di pé wọ́n kàn ń béèrè ààyè láti lọ, láìfi bí wọ́n ṣe wà lábẹ́ àṣẹ rẹ̀ hàn.
  rationale: “Bẹ̀ ẹ́ gidigidi” àti “Rán wa” tẹ̀ lé agbára ọ̀rọ̀ Gíríìkì, wọ́n sì pa àṣẹ Jésù tí ìtàn náà fi hàn mọ́ láìfikún ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A kò gbé àlàyé ẹsẹ̀ ìsàlẹ̀ Gẹ̀ẹ́sì kalẹ̀ nítorí pé ‘pigs/swine’ jẹ́ àṣàyàn ọ̀rọ̀ Gẹ̀ẹ́sì, “ẹlẹ́dẹ̀” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere; pẹ̀lú náà, ibi àmì [a] nínú ẹ̀dà ìtọ́kasí Gẹ̀ẹ́sì kò bá àlàyé rẹ̀ mu.
