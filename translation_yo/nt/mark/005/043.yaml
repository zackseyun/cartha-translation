base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: yo
  text: Ó sì pàṣẹ gidigidi fún wọn pé kí ẹnikẹ́ni má ṣe mọ̀ nípa ohun yìí,[a] ó sì sọ pé kí wọ́n fún un ní ohun kan láti jẹ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó pàṣẹ líle fún wọn léraléra,” tàbí “ó kìlọ̀ gidigidi fún wọn.” Ọ̀rọ̀ Gíríìkì náà ní ọ̀rọ̀ ìtẹnumọ́ kan tí ìtumọ̀ rẹ̀ ní tààrà jẹ́ “púpọ̀” tàbí “ọ̀pọ̀ ohun.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kí a fún un láti jẹ”; ní Yorùbá àdánidá, “kí wọ́n fún un ní ohun kan láti jẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο ... πολλὰ
  choice: pàṣẹ kíkankíkan
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì yìí ń fi agbára àti ìmúlórúkọ pàṣẹ hàn. “Pàṣẹ kíkankíkan” jẹ́ Yorùbá àdánidá tí ó pa ìtẹnumọ́ náà mọ́ láì tú πολλὰ sí ‘ọ̀pọ̀lọpọ̀ ohun.’
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dátífù náà tọ́ka sí àwọn tí ó wà níbẹ̀; “fún wọn” bá ìlò ọ̀rọ̀-ìṣe ‘pàṣẹ’ mu ní Yorùbá.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: pé kí ẹnikẹ́ni má ṣe mọ ohun yìí
  rationale: Ìṣètò ‘kí ... má ṣe’ fi ète àti àṣẹ ìdènà inú ἵνα pẹ̀lú subjunctive hàn ní Yorùbá àdánidá; “mọ ohun yìí” kò fi àlàyé míì kún ohun tí τοῦτο ń tọ́ka sí.
- source_word: εἶπεν
  choice: ó sọ
  rationale: Ìtumọ̀ tààrà fún ‘ó sọ’; àkópọ̀ gbolohun tí ó tẹ̀ lé e mú agbára ìtọ́nisọ́nà rẹ̀ jáde láì yí ọ̀rọ̀ náà sí ‘ó pàṣẹ.’
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: kí wọ́n fún un ní ohun kan láti jẹ
  rationale: Yorùbá máa ń lo ẹni tí a kò dárúkọ gẹ́gẹ́ bí ‘wọ́n’ fún passive; “ohun kan” jẹ́ àfikún tí èdè Yorùbá nílò láti sọ ìtumọ̀ ‘fún un láti jẹ’ ní kedere àti ní àdánidá.
theological_decisions:
- issue: Àṣẹ kí iṣẹlẹ̀ náà má ṣe di mímọ̀ / ohun tí a sábà ń pè ní ìkọ̀kọ̀ Mèsáyà
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí àṣẹ líle pé kí ẹnikẹ́ni má ṣe mọ ohun yìí, láì ṣàlàyé ìdí rẹ̀.
  alternative: Láti fi kún un pé àṣẹ náà jẹ́ fún ìdílé àti àwọn ẹlẹ́rìí nìkan, tàbí láti so ó mọ́ àkòrí ìkọ̀kọ̀ Mèsáyà ní tààrà.
  rationale: Ẹsẹ náà kò sọ ìdí tàbí àlà àṣẹ náà ju ẹni tí Jesu ń bá sọ̀rọ̀ lọ; ìtumọ̀ náà pa ìfojúdi ẹ̀kọ́-ìgbàgbọ́ àti ìdààmú inú àkọsílẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. “Fún un” tọ́ka sí ọmọbìnrin náà; a kò fi orúkọ rẹ̀ tàbí àlàyé tí kò sí nínú orísun kún un.
