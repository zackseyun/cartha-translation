  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: yo
  text: Nítorí ó ń sọ pé, “Bí mo bá tilẹ̀ kan aṣọ rẹ̀ nìkan, ara mi yóò dá[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “a ó gbà mí là.” Ọ̀rọ̀ náà lè túmọ̀ sí “gbà là,” “mú lára dá,” tàbí “mú kí ara yá”; níbí, àyíká ń tọ́ka sí ìmúláradá ara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ó ń lọ tàbí tí a ń ṣe léraléra hàn. “Ó ń sọ” pa apá yìí mọ́ láì pinnu bóyá ó ń sọ ọ́ sókè tàbí nínú ara rẹ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ṣàlàyé ìdí ìṣe tí ó ṣáájú; “Nítorí” jẹ́ àsopọ̀ ìtàn tí ó ṣe déédé ní Yorùbá.
- source_word: ὅτι
  choice: pé, pẹ̀lú àmì ọ̀rọ̀ tààrà
  rationale: Ó ṣe àfihàn ohun tí obìnrin náà ń sọ; ọ̀rọ̀ tààrà ló bá Yorùbá mu jù níbí.
- source_word: ἐὰν ἅψωμαι
  choice: Bí mo bá ... fi ọwọ́ kan
  rationale: “Bí ... bá” mú gbólóhùn oníṣ شرط náà jáde lọ́nà àdánidá, “fi ọwọ́ kan” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífọwọ́ kan ohun kan.
- source_word: κἂν
  choice: tilẹ̀ ... nìkan
  rationale: Àpapọ̀ yìí ní ìtumọ̀ ìdínkù, “kódà bí ó bá jẹ́ pé ... nìkan”; “tilẹ̀ ... nìkan” pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá àdánidá.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ἱμάτια jẹ́ ọ̀rọ̀ gbogbogbò fún aṣọ tí a wọ̀. “Aṣọ rẹ̀” jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún dídín ìtumọ̀ náà sí ẹ̀wù kan pàtó.
- source_word: σωθήσομαι
  choice: ara mi yóò dá
  rationale: Nínú àyíká yìí, obìnrin náà ń retí ìmúláradá kúrò nínú àìsàn ẹ̀jẹ̀ rẹ̀. “Ara mi yóò dá” sọ ìtumọ̀ ìmúláradá náà lọ́nà Yorùbá tó ṣe déédé; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ fífẹ̀ ti “gbà là” mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ σωθήσομαι nínú ìtàn ìwòsàn
  choice: ara mi yóò dá
  alternative: a ó gbà mí là; ara mi yóò yá
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń tọ́ka sí ìmúláradá ara, ṣùgbọ́n ọ̀rọ̀ Gíríìkì σῴζω tún lè túmọ̀ sí “gbà là.” A lo ìtumọ̀ àyíká nínú ẹsẹ̀, a sì fi ìfarapamọ́ ìtumọ̀ méjèèjì hàn nínú àlàyé láì yanjú ìnira ẹ̀kọ́ ìgbàgbọ́ náà lọ́nà àṣejù.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti bá èdè mu, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
