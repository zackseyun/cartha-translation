    issue: “lórí àwọn òkè” fún ἐν τοῖς ὄρεσιν
    rationale: ἐν jẹ́ ‘nínú/láàárín’ níbí, gẹ́gẹ́ bí ó ti rí pẹ̀lú ‘nínú àwọn ibojì’; “lórí” jẹ́ ìtumọ̀ tó dín ìbámu pẹ̀lú orísun kù.
  - severity: low
    issue: “ó máa ń” fún ἦν κράζων ... κατακόπτων
    rationale: Ó lè jẹ́ ìṣe àṣà tàbí ìṣe léraléra. “Ó ń” lẹ́yìn ọ̀rọ̀ àkókò “Ní gbogbo ìgbà, ní òru àti ní ọ̀sán” ń fi ìṣe tí ń bá a lọ ní ìgbà àtijọ́ hàn kedere.
  - severity: low
    issue: “òkúta” jẹ́ ẹyọ kan níbi tí λίθοις jẹ́ ọ̀pọ̀
    rationale: Bí ó tilẹ̀ jẹ́ pé ẹyọ kan lè jẹ́ ọ̀rọ̀ àpapọ̀ nínú Yorùbá, “àwọn òkúta” pa nọ́ńbà orísun mọ́ dáadáa.
