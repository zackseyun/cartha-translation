  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: yo
  text: Ní gbogbo ìgbà, ní òru àti ní ọ̀sán, ó ń ké jáde nínú àwọn ibojì àti nínú àwọn òkè, ó sì ń gé ara rẹ̀ pẹ̀lú àwọn òkúta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń pariwo, ó sì ń gé ara rẹ̀ ní ọgbẹ́ pẹ̀lú àwọn òkúta.”
    reason: Àṣàyàn ọ̀rọ̀ fún κράζων àti κατακόπτων tí ń ṣe àfihàn agbára ìṣe náà láìyí ìtumọ̀ pàtàkì padà.
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Ní gbogbo ìgbà, ní òru àti ní ọ̀sán
  rationale: Èyí fi ìṣe tí ń bá a lọ láìdáwọ́ dúró hàn, ó sì pa ìtọ́kasí sí òru àti ọ̀sán mọ́ ní Yorùbá àdánidá.
- source_word: μνήμασιν
  choice: àwọn ibojì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ibi ìsìnkú tàbí ibojì; ‘àwọn ibojì’ bá àyíká àwọn ibojì tí a gbẹ́ sínú àpáta mu.
- source_word: ὄρεσιν
  choice: àwọn òkè
  rationale: ‘Àwọn òkè’ ni ìtumọ̀ tààrà àti èyí tí ó wọ́pọ̀ fún ọ̀rọ̀ Gíríìkì náà.
- source_word: ἦν κράζων
  choice: ó máa ń ké jáde
  rationale: Ìṣọ̀kan ọ̀rọ̀-ìṣe aláìpé àti participle fi ìṣe tí ó ń ṣẹlẹ̀ léraléra tàbí tí ó ń bá a lọ ní àkókò àtijọ́ hàn; ‘ó máa ń ké jáde’ sọ èyí ní Yorùbá àdánidá.
- source_word: κατακόπτων ἑαυτὸν
  choice: ó máa ń gé ara rẹ̀
  rationale: Èyí mú ìṣe ṣíṣe ara ẹni léṣe pẹ̀lú gígé jáde kedere láìfi ìtumọ̀ tó le ju ti orísun lọ kún un.
- source_word: λίθοις
  choice: fi òkúta
  rationale: Ọ̀nà ìlò ‘fi ...’ ni Yorùbá àdánidá fún dative irinṣẹ́, ó sì fi hàn pé òkúta ni ó lò.
