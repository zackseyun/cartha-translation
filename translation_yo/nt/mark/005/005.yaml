translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ; àtúnṣe ‘máa ń’ mú ìṣe tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn.
