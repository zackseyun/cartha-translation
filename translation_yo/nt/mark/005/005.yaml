  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà: ìṣe tí ń bá a lọ ní òru àti ọ̀sán, ibi àwọn ibojì àti òkè, igbe kéékèèké, àti gígé ara ẹni pẹ̀lú òkúta. Síbẹ̀, “lórí àwọn òkè” mú ἐν ... ὄρεσιν dà bí ẹni pé ó túmọ̀ sí ‘lórí’; ìtumọ̀ tó sún mọ́ orísun ni “nínú àwọn òkè.” “Ó máa ń” lè tọ́ka sí ìṣe àṣà tàbí ìṣe léraléra ju ìṣe tí ń lọ ní àkókò ìtàn lọ, nítorí náà “ó ń” dára jù.'
  naturalness: Àkọsílẹ̀ náà jẹ́ Yorùbá ìgbàlódé, ó sì rọrùn láti lóye. Àtúnṣe náà ń mú ìbáṣepọ̀ àwọn participle Gíríìkì méjèèjì hàn dáadáa pẹ̀lú “ó ń ... ó sì ń ...,” ó sì ń lo “pẹ̀lú àwọn òkúta” gẹ́gẹ́ bí irinṣẹ́ ní ọ̀nà tí ó hàn gedegbe.
  terminology: “Àwọn ibojì,” “àwọn òkè,” “ké jáde,” àti “gé ara rẹ̀” jẹ́ àwọn ọ̀rọ̀ tó péye, tó jẹ́ ti ìforúkọsílẹ̀ ọ̀wọ̀, tí wọn kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún ẹsẹ̀ náà. A pa ọ̀pọ̀ ‘λίθοις’ mọ́ nínú “àwọn òkúta.”
  issues:
