  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: yo
  text: Agbo ẹlẹ́dẹ̀ ńlá kan sì wà níbẹ̀ lẹ́gbẹ̀ẹ́ òkè náà, tí ń jẹun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní ẹ̀gbẹ́ òkè náà.” Gbólóhùn Gíríìkì πρὸς τῷ ὄρει ń tọ́ka sí ibi tí ó sún mọ́ òkè tàbí tí ó wà lẹ́gbẹ̀ẹ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: kan sì wà
  rationale: “Wà” ṣàfihàn pé ohun kan wà níbẹ̀; “sì” jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ tí kò fi ìtakora kún ọ̀rọ̀ náà.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Èyí ni ìtumọ̀ ibi tí ó ṣe déédé fún locative adverb náà.
- source_word: πρὸς τῷ ὄρει
  choice: lẹ́gbẹ̀ẹ́ òkè náà
  rationale: Pẹ̀lú dative, πρός ń tọ́ka sí ibi tí ó sún mọ́ tàbí tí ó wà lẹ́gbẹ̀ẹ́ òkè; “lẹ́gbẹ̀ẹ́” jẹ́ Yorùbá àdánidá tí kò sọ ibi náà pàtó ju ti Gíríìkì lọ.
- source_word: ἀγέλη
  choice: ẹgbẹ́
  rationale: Nínú àyíká yìí, “ẹgbẹ́” túmọ̀ sí ọ̀pọ̀ ẹranko tí ó kóra jọ, ó sì bá ọ̀rọ̀ “ẹlẹ́dẹ̀” mu lọ́nà tí òǹkàwé òde òní lè lóye.
- source_word: χοίρων
  choice: ẹlẹ́dẹ̀
  rationale: “Ẹlẹ́dẹ̀” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere fún pigs/swine.
- source_word: μεγάλη
  choice: ńlá
  rationale: Ó ṣàpèjúwe bí ẹgbẹ́ náà ti tóbi tàbí ti pọ̀; “ńlá” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: βοσκομένη
  choice: wọ́n ń jẹun
  rationale: Present participle náà ṣàpèjúwe àwọn ẹlẹ́dẹ̀ bí wọ́n ṣe ń jẹ ní àkókò náà. “Ń jẹun” gbòòrò ju “ń jẹ koríko” lọ, kò sì fi irú oúnjẹ wọn sílẹ̀ lọ́nà tí orísun kò sọ.
