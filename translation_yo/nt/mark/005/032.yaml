  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: yo
  text: Ó sì ń wo yíká láti rí ẹni tí ó ṣe èyí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì, ọ̀rọ̀ náà jẹ́ ti abo: “ẹni tí ó ṣe èyí,” èyí sì fi hàn pé obìnrin kan ni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Àsopọ̀ “sì” ń tẹ̀ síwájú nínú ìtàn láìfi ìtumọ̀ àbájáde kún ọ̀rọ̀ Gíríìkì.
- source_word: περιεβλέπετο
  choice: ń wo yíká
  rationale: Àkókò imperfect fi hàn pé ó ń bá a lọ láti máa wo àwọn tí ó yí i ká; ìṣètò yìí jẹ́ ti àdánidá ní Yorùbá.
- source_word: ἰδεῖν
  choice: láti rí
  rationale: Infinitive náà sọ ète ìwò yíká náà; “láti rí” túmọ̀ ọ́ ní tààrà.
- source_word: τὴν ... ποιήσασαν
  choice: ẹni tí ó ṣe
  rationale: Substantival participle náà túmọ̀ sí ẹni tó ṣe ohun náà. Yorùbá kò fi akọ tàbí abo hàn nínú “ẹni,” nítorí náà àlàyé ìsàlẹ̀ ojú ewé ló tọ́ka sí abo tí fọ́ọ̀mù Gíríìkì fi hàn.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, “èyí” sì ṣe kedere ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní ibi tí ó yẹ; “ń wo yíká” pa ìṣe tí ń bá a lọ mọ́, “ẹni” sì pa ìṣètò Gíríìkì mọ́ láìfi orúkọ “obìnrin” sínú ọ̀rọ̀ pàtàkì.
