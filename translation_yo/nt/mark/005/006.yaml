base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: yo
  text: Nígbà tí ó rí Jésù láti òkèèrè, ó sáré, ó sì wólẹ̀ fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sìn ín,” tàbí, “ó fi ọlá fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí jíjọ́sìn tàbí wíwólẹ̀ láti fi ọlá hàn, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ó … rí
  rationale: Aorist participle ἰδών expresses an action accompanying and preceding the main verbs. A temporal clause is the most natural current Yoruba way to preserve that sequence without implying more than the Greek states.
- source_word: ἀπὸ μακρόθεν
  choice: láti òkèèrè
  rationale: This naturally expresses seeing someone from far away while retaining the source phrase's spatial sense.
- source_word: ἔδραμεν
  choice: ó sáré
  rationale: This is the plain Yoruba equivalent of the aorist verb meaning ‘he ran,’ without adding the heightened force of ‘rushed.’
- source_word: προσεκύνησεν αὐτόν
  choice: ó … tẹrí ba níwájú rẹ̀
  rationale: The phrase depicts bowing or prostration before Jesus while leaving open whether the act should be understood specifically as worship, homage, or obeisance. The alternative nuances are retained in the footnote.
- source_word: καὶ
  choice: sì … ó sì
  rationale: Yoruba narrative coordination uses sì naturally here, preserving Mark's linked sequence without forcing a stronger temporal inference.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: The proper name is rendered in its established Standard Yoruba form.
theological_decisions:
- issue: Whether προσεκύνησεν explicitly denotes worship of Jesus in this context
  choice: tẹrí ba níwájú rẹ̀
  alternative: jọ́sìn fún un; fi ìbọ̀wọ̀ fún un
  rationale: προσκυνέω can denote worship, homage, or bodily obeisance. The main rendering preserves the visible action and genuine contextual ambiguity rather than deciding in advance that the act was formal worship; the other legitimate senses remain available in the footnote.
translation_notes:
  register: Standard Yoruba in a natural, dignified narrative register, with full tone marks where natural. The temporal clause avoids an awkward calque of the Greek participle, while the repeated sì preserves Mark's coordinated narrative movement. Tẹrí ba is intentionally concrete and non-sectarian.
