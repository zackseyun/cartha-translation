  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: yo
  text: Ó sì bá a lọ. Ogunlọ́gọ̀ ènìyàn sì ń tẹ̀ lé e, wọ́n sì ń rọ́ mọ́ ọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “wọ́n ń tẹ̀ é mọ́lẹ̀” tàbí “wọ́n ń kó ara wọn mọ́ ọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà fi hàn pé ogunlọ́gọ̀ náà ń tẹ̀ Jésù mọ́ra ní ti ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: lọ
  rationale: Ọ̀rọ̀-ìṣe aorist yìí sọ ìgbésẹ̀ Jésù nínú ìtàn. “Lọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kò sì fi ìtumọ̀ “kúrò níbẹ̀” kun ohun tí àyíká ọ̀rọ̀ kò béèrè.
- source_word: μετ’ αὐτοῦ
  choice: bá a
  rationale: μετά pẹ̀lú genitive túmọ̀ sí pé ẹni kan ń bá ẹlòmíràn lọ. “Ó bá a lọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu.
- source_word: ἠκολούθει
  choice: ń tẹ̀ lé e
  rationale: Imperfect náà fi ìṣe tó ń lọ lọ́wọ́ hàn. Àmì “ń” pa ìtumọ̀ ìṣe tí ń bá a lọ mọ́.
- source_word: ὄχλος πολύς
  choice: ogunlọ́gọ̀ ènìyàn
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ọ̀pọ̀ ènìyàn tí wọ́n péjọ sí ibi kan. “Ogunlọ́gọ̀ ènìyàn” jẹ́ gbólóhùn Yorùbá àdánidá fún èrò tó pọ̀ gan-an.
- source_word: συνέθλιβον
  choice: ń há a mọ́ra
  rationale: Ọ̀rọ̀ Gíríìkì náà ní èrò fífún ara pọ̀ tàbí fífún ẹnì kan láti gbogbo ẹ̀gbẹ́. “Ń há a mọ́ra” sọ bí ogunlọ́gọ̀ náà ṣe kó ara wọn mọ́ Jésù láì sọ pé wọ́n ṣe é léṣe.
- source_word: αὐτόν
  choice: a
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí ogunlọ́gọ̀ ń há mọ́ra; “a” bá ìlànà arọ́pò-orúkọ Yorùbá mu nínú gbólóhùn yìí.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá òde òní tó bójú mu, tó sì ṣeé lóye. “Ó bá a lọ” àti “ń tẹ̀ lé e” jẹ́ àwọn gbólóhùn àdánidá; “ń há a mọ́ra” sì pa agbára ti ara tó wà nínú συνέθλιβον mọ́ láì sọ àsọdùn pé ogunlọ́gọ̀ náà ń pa á lára.
