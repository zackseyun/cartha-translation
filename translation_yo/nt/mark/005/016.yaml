  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: yo
  text: Àwọn tí wọ́n rí i náà sì ròyìn fún wọn bí ó ti ṣẹlẹ̀ sí ọkùnrin tí ẹ̀mí èṣù wọ̀ náà[a], àti nípa àwọn ẹlẹ́dẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin tí ẹ̀mí èṣù ń ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: sọ fún wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti ròyìn tàbí ṣàlàyé ohun tí ó ṣẹlẹ̀; ‘sọ fún wọn’ jẹ́ èdè Yorùbá àdánidá, àyíká ẹsẹ náà sì fi hàn pé ìròyìn kíkún ni.
- source_word: οἱ ἰδόντες
  choice: Àwọn tí ó sì rí ohun tí ó ṣẹlẹ̀ náà
  rationale: Èyí pa ìtumọ̀ participle náà mọ́, ó sì fi hàn pé àwọn ènìyàn wọ̀nyí jẹ́ ẹlẹ́rìí ohun tí ó ṣẹlẹ̀ láìfi orúkọ ìtumọ̀ míì kún un.
- source_word: πῶς ἐγένετο
  choice: bí ó ti ṣẹlẹ̀
  rationale: Ìtumọ̀ yìí pa ọ̀nà tàbí bí ìṣẹ̀lẹ̀ náà ṣe wáyé mọ́, dípò kíkàn sọ pé ‘ohun tí ó ṣẹlẹ̀.’
- source_word: τῷ δαιμονιζομένῳ
  choice: ọkùnrin tí ẹ̀mí èṣù ń ṣe
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tí ó ṣe kedere fún ẹni tí ó wà lábẹ́ ìdarí tàbí ìpọ́njú ẹ̀mí èṣù; ó yẹra fún ọ̀rọ̀ amọ̀ṣẹ́dá tàbí èdè àtijọ́ tí kò rọrùn.
- source_word: περὶ τῶν χοίρων
  choice: nípa àwọn ẹlẹ́dẹ̀ náà
  rationale: ‘Nípa’ jẹ́ ìtumọ̀ àdánidá fún περί pẹ̀lú genitive, ‘ẹlẹ́dẹ̀’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún χοῖροι.
theological_decisions:
- issue: Ìtumọ̀ δαιμονιζομένῳ nínú ìtàn nípa iṣẹ́ ẹ̀mí èṣù
  choice: ọkùnrin tí ẹ̀mí èṣù ń ṣe
  alternative: ọkùnrin tí ẹ̀mí èṣù wọ̀
  rationale: Àṣàyàn pàtàkì náà jẹ́ èdè Yorùbá àdánidá tí ó jẹ́wọ́ ìpọ́njú ẹ̀mí èṣù gẹ́gẹ́ bí ìtàn Máàkù ṣe gbé e kalẹ̀, ṣùgbọ́n kò pinnu ju ọ̀rọ̀ Gíríìkì lọ nípa bí ìdarí náà ṣe rí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A tún ‘sọ’ ṣe lẹ́ẹ̀kejì kí ìbáṣepọ̀ àwọn gbólóhùn méjèèjì lè ṣe kedere ní Yorùbá, láìyí ìtumọ̀ Gíríìkì padà.
