review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: ẹni náà jẹ́ ọ̀kan lára àwọn olórí sínágọ́gù, a sì dá a mọ̀ sí Jáírù; ó rí Jésù, ó sì wólẹ̀ níwájú rẹ̀. Síbẹ̀, “Nígbà náà” lè fi ìbáṣepọ̀ àkókò tó lágbára ju καὶ (“àti”) hàn, àti “dé” dín ἔρχεται/‘wá’ kù sí ‘arrived.’'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tó ṣe kedere, pẹ̀lú àmì ohùn tó yẹ. Àmọ́ “wá” jẹ́ ìtumọ̀ tó taara, tó sì rọrùn ju “dé” lọ nínú àyíká yìí; ìṣọ̀kan gbolohun pẹ̀lú àmì-ìdádúró (;) sì ń ṣetọju ìṣàn ìtàn náà.
  terminology: “Olórí sínágọ́gù,” “Jáírù,” àti “wólẹ̀ ní ẹsẹ̀ rẹ̀” yẹ, wọ́n sì pa ìpele ìjọba/ìdarí sínágọ́gù, orúkọ, àti ìṣe ìforíbalẹ̀ náà mọ́. “Wólẹ̀” kò fi ìjọsìn tí kò sí ní ọ̀rọ̀ Gíríìkì kún un.
  issues:
  - severity: low
    issue: “Nígbà náà” fún καὶ
    rationale: Καὶ jẹ́ asopọ̀ ìtàn tó rọrùn (‘àti’); “Nígbà náà” lè túmọ̀ sí ìpele àkókò kan pàtó (‘then’) tí a kò sọ ní ẹsẹ̀ náà.
  - severity: low
    issue: “dé” fún ἔρχεται
    rationale: “Dé” lè dá lórí ìmọ̀ ‘arrive,’ nígbà tí ἔρχεται níhìn-ín túmọ̀ sí ‘wá/comes.’ “Wá” pa ìtumọ̀ náà mọ́ pẹkipẹki.
  revised_text: Ọ̀kan lára àwọn olórí sínágọ́gù, tí orúkọ rẹ̀ ń jẹ́ Jáírù, wá; nígbà tí ó rí Jésù, ó wólẹ̀ ní ẹsẹ̀ rẹ̀.
