  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: yo
  text: Ọ̀kan lára àwọn olórí sínágọ́gù, tí orúkọ rẹ̀ ń jẹ́ Jáírù, wá; nígbà tí ó rí Jésù, ó wólẹ̀ ní ẹsẹ̀ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: dé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àkókò ìsinsìnyí tí a lò nínú ìtàn láti mú un yè kooro; ‘dé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣẹ̀lẹ̀ náà nínú ìtàn.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: ọ̀kan lára àwọn olórí sínágọ́gù
  rationale: Ó pa ìtumọ̀ apá inú ọ̀pọ̀ mọ́, ó sì fi ipò ìdarí ẹni náà nínú sínágọ́gù hàn láìsọ ojúṣe rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ὀνόματι Ἰάϊρος
  choice: tí orúkọ rẹ̀ ń jẹ́ Jáírù
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún fífi orúkọ ẹni kan hàn.
- source_word: Ἰάϊρος
  choice: Jáírù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti àṣà ìkọ̀wé Yorùbá.
- source_word: ἰδὼν αὐτὸν
  choice: nígbà tí ó rí Jésù
  rationale: Àpólà náà fi àkókò tàbí tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ hàn. Lílo ‘Jésù’ mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: ó wólẹ̀ lẹ́sẹ̀ rẹ̀
  rationale: Èyí ṣàpèjúwe ìṣe ti ara gẹ́gẹ́ bí Gíríìkì ṣe sọ, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá fún wíwólẹ̀ níwájú ẹnì kan.
theological_decisions:
- issue: Ìtumọ̀ ìwà tí Jáírù hù sí Jésù
  choice: ó wólẹ̀ lẹ́sẹ̀ rẹ̀
  alternative: ó foríbalẹ̀ fún un / ó jọ́sìn rẹ̀
  rationale: Gíríìkì ṣàpèjúwe wíwólẹ̀ lẹ́sẹ̀ Jésù, ṣùgbọ́n kò lo ọ̀rọ̀ tó túmọ̀ sí ìjọsìn ní tààrà. Ìtumọ̀ yìí fi ọ̀wọ̀, ìbànújẹ́, tàbí ẹ̀bẹ̀ sílẹ̀ gẹ́gẹ́ bí àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A pín gbolohun Gíríìkì sí gbólóhùn méjì fún ìṣàn Yorùbá tó ṣe àdánidá.
