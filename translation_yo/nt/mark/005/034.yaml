id: MRK.5.34
reference: Mark 5:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ọmọbìnrin, ìgbàgbọ́ rẹ ti gbà ọ́ là[a]. Lọ ní àlàáfíà[b], kí o sì láradá kúrò nínú ìpọ́njú rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ rẹ ti mú ọ láradá,” tàbí “ìgbàgbọ́ rẹ ti wo ọ sàn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbàlà, fífipamọ́, tàbí ìmúláradá.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní ìrẹ́pò,” “ní àlàáfíà,” tàbí “ní ìlera pípé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Ọmọbìnrin
  rationale: Ó pa ọ̀rọ̀ ìpè onífẹ̀ẹ́ tí ó túmọ̀ sí ‘ọmọbìnrin’ mọ́ láìfi ọ̀rọ̀ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Ní àyíká yìí, ó ń tọ́ka sí bí obìnrin náà ṣe fi ìgbẹ́kẹ̀lé rẹ sínú Jésù; ‘ìgbàgbọ́’ tún pa ọ̀rọ̀ pàtàkì náà mọ́ ní ọ̀nà tó yẹ.
- source_word: σέσωκέν
  choice: ti gbà ọ́ là
  rationale: Ó ṣàfihàn ìṣe tí àbájáde rẹ̀ dúró títí di ìsinsìnyí, ó sì pa ìtumọ̀ gbígbàlà mọ́ láìdín ọ̀rọ̀ náà kù sí ìmúláradá ara nìkan.
- source_word: ὕπαγε
  choice: Máa lọ
  rationale: Àṣẹ rírọrùn àti àdánidá ní Yorùbá ni, tó bá ọ̀rọ̀ Gíríìkì mu.
- source_word: εἰς εἰρήνην
  choice: ní àlàáfíà
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé kí ẹni náà lọ pẹ̀lú àlàáfíà àti ìfọ̀kànbalẹ̀.
- source_word: ἴσθι ὑγιὴς
  choice: kí ara rẹ sì dá
  rationale: Ọ̀rọ̀ náà jẹ́ ipò jíjẹ́ alára-dídá, kì í ṣe ọ̀rọ̀ ìṣe ìmúláradá lásán; gbólóhùn Yorùbá yìí sọ ipò ìlera náà lọ́nà àdánidá.
- source_word: μάστιγός
  choice: ìpọ́njú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ àpèjúwe àìsàn tó ń jẹ obìnrin náà níyà; ‘ìpọ́njú’ pa agbára àfiwé ‘ìyà líle’ náà mọ́ láìfi ìtumọ̀ pàṣán gidi sí i.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ bá ìṣe obìnrin náà mu, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú èrò ìgbàgbọ́ nínú Májẹ̀mú Tuntun mọ́.
- issue: Ìtumọ̀ σῴζω ní ìbáṣepọ̀ pẹ̀lú ìmúláradá
  choice: ti gbà ọ́ là
  alternative: ti mú ọ lára dá / ti mú ọ láradá
  rationale: ‘Gbà là’ pa ìtumọ̀ fífẹ̀ ti ọ̀rọ̀ Gíríìkì mọ́, tó lè kan ìgbàlà àti ìmúláradá; gbólóhùn tó tẹ̀ lé e ló sọ ní pàtó nípa ara dídá, nítorí náà a kò pa ìfòyemọ̀ àti ìdíjú ẹ̀kọ́ ìgbàgbọ́ náà rẹ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. A pa ìyàtọ̀ tó wà láàárín “ti gbà ọ́ là” àti “kí ara rẹ sì dá” mọ́, a sì fi àmì ohùn sí ibi tí ó yẹ.
