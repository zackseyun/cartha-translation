  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: yo
  text: nítorí pé wọ́n ti fi ṣẹ́kẹ́ṣẹkẹ̀ àti ẹ̀wọ̀n dè é ní ọ̀pọ̀ ìgbà, ó sì ti fa àwọn ẹ̀wọ̀n náà ya, ó sì ti fọ́ àwọn ṣẹ́kẹ́ṣẹkẹ̀ náà túútúú; kò sì sí ẹni tí ó ní agbára láti mú un wá sábẹ́ àkóso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ṣẹ́gun rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “láti ṣẹ́gun rẹ̀,” tàbí ní ìtumọ̀ gbòòrò, “láti mú un wá sábẹ́ àkóso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: nítorí a ti ... dè é
  rationale: Ìtumọ̀ yìí mú ìdí tí gbólóhùn náà ń fi hàn jáde ní Yorùbá àdánidá; a lo ọ̀nà aláìlórúkọ ẹni nítorí Gíríìkì kò sọ ẹni tó ń dè é.
- source_word: πολλάκις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ó ṣàfihàn pé ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ léraléra.
- source_word: πέδαις / τὰς πέδας
  choice: ṣẹ́kẹ́ṣẹkẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun ìdè irin, ní pàtàkì èyí tí a fi ń de ẹsẹ̀; ó sì yàtọ̀ sí ẹ̀wọ̀n lápapọ̀.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: ẹ̀wọ̀n
  rationale: Ìtumọ̀ yìí bójú mu ẹ̀wọ̀n irin, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí ṣẹ́kẹ́ṣẹkẹ̀.
- source_word: δεδέσθαι
  choice: a ti ... dè é
  rationale: Ó mú ipò tí ó jẹ́ àbájáde dídè léraléra jáde ní Yorùbá tó ṣe déédé.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: ó máa ń fa ẹ̀wọ̀n náà ya
  rationale: Ó fi agbára ìṣe náà àti pé ọkùnrin náà fúnra rẹ̀ ni ó ṣe é hàn kedere.
- source_word: συντετρῖφθαι
  choice: ó sì máa ń fọ́ ṣẹ́kẹ́ṣẹkẹ̀ náà túútúú
  rationale: “Fọ́ ... túútúú” mú ìtumọ̀ fífọ́ sí wẹ́wẹ́ tàbí pípa á run jáde lọ́nà tó ṣeé lóye.
- source_word: οὐδεὶς ἴσχυεν
  choice: kò sì sí ẹni tí ó lágbára tó
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé kò sí ẹni tí agbára rẹ̀ tó fún iṣẹ́ náà.
- source_word: δαμάσαι
  choice: tẹ́ ẹ ló rí
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí mímú ẹni náà wá sábẹ́ àkóso tàbí dídá agbára rẹ̀ dúró, láìfi èrò ìkọ́ ẹranko kún un.
theological_decisions:
- issue: Irú ipò ọkùnrin náà àti orísun agbára rẹ̀
  choice: A ṣàpèjúwe bí gbogbo ìgbìyànjú láti dè é ṣe já sí pàbó, láìsọ orísun agbára náà ní ẹsẹ yìí.
  alternative: Kí a mú agbára ẹ̀mí èṣù jáde gbangba nínú ìtumọ̀ ẹsẹ yìí.
  rationale: Gíríìkì ṣàpèjúwe agbára àrà ọ̀tọ̀ àti àìlè tẹ́ ọkùnrin náà ba, ṣùgbọ́n kò ṣàlàyé orísun agbára náà nínú ẹsẹ yìí fúnra rẹ̀; àyíká ìtàn ló ń ṣe bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. “Ṣẹ́kẹ́ṣẹkẹ̀” àti “ẹ̀wọ̀n” pa àwọn ohun ìdè méjì inú Gíríìkì mọ́ lọ́tọ̀.
