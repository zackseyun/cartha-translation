  to: nítorí pé wọ́n ti fi ṣẹ́kẹ́ṣẹkẹ̀ àti ẹ̀wọ̀n dè é ní ọ̀pọ̀ ìgbà, ó sì ti fa àwọn ẹ̀wọ̀n náà ya, ó sì ti fọ́ àwọn ṣẹ́kẹ́ṣẹkẹ̀ náà túútúú; kò sì sí ẹni tí ó ní agbára láti mú un wá sábẹ́ àkóso.[a]
