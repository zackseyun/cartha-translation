  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ tó wà láàárín πέδαι (ṣẹ́kẹ́ṣẹkẹ̀) àti ἁλύσεις (ẹ̀wọ̀n) mọ́, ó sì tọ́ka sí i pé ọkùnrin náà fúnra rẹ̀ ni ó ba àwọn ìdè náà jẹ́. Síbẹ̀, “ṣùgbọ́n” ń fi ìfaradà tàbí ìyàtọ̀ kún ìsopọ̀ tí Gíríìkì fi καὶ (“àti/ó sì”) hàn. Bákan náà, “ó máa ń” ń ṣe àpèjúwe ìwà tí ń ṣẹlẹ̀ déédé, níbi tí àwọn perfect infinitive náà ti ń sọ nípa àwọn ìṣe tí ó ti ṣẹlẹ̀ nínú ìtàn ẹ̀yìn. “Tẹ́ ẹ ló rí” sì ní “ló rí/ever” tí kò hàn nínú ọ̀rọ̀ Gíríìkì, tí “tẹ́ ẹ” náà sì lè máa yé kedere ní ìlò òde òní.
  naturalness: Yorùbá náà lóye, ṣùgbọ́n “ó ti fa ... ya” àti “ó ti fọ́ ... túútúú” bá ìpìlẹ̀ ìtàn ẹ̀yìn mu dáadáa ju “ó máa ń” lọ. “Láti mú un wá sábẹ́ àkóso” jẹ́ ìtumọ̀ tí ó hàn gbangba, tí ó sì bá àyíká ìdènà ọkùnrin náà mu.
  terminology: “Ṣẹ́kẹ́ṣẹkẹ̀” fún ìdè-ẹsẹ̀ àti “ẹ̀wọ̀n” fún chains jẹ́ yíyan tó dáa, tí ó sì pa àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́ lọ́tọ̀. “Mú un wá sábẹ́ àkóso” ń ṣàfihàn δαμάσαι ní ìtumọ̀ “subdue/bring under control” láìmú ìtumọ̀ ìkọ́ ẹranko wọlé sínú ọ̀rọ̀ àkọ́kọ́.
  issues:
  - severity: medium
    issue: “ṣùgbọ́n” ni a lò fún καὶ lẹ́yìn àpá ìbẹ̀rẹ̀.
    rationale: Ọ̀rọ̀ Gíríìkì ní ìsopọ̀ àfikún (“and”), kì í ṣe ìsopọ̀ ìtakò. Bí ó tilẹ̀ jẹ́ pé ìtakò náà lè hàn nínú ọgbọ́n ìtàn, a kò gbọ́dọ̀ fi í kún un nínú ìtumọ̀.
  - severity: medium
    issue: “Ó máa ń” yí àwọn perfect infinitive padà sí ìṣe àṣà tí ń ṣẹlẹ̀ déédé.
    rationale: δεδέσθαι, διεσπάσθαι, àti συντετρῖφθαι jẹ́ perfect infinitives; ní àyíká yìí wọ́n ń ṣàpèjúwe ohun tí ó ti ṣẹlẹ̀ ṣáájú. “Ó ti ...” dá ìwòye yìí pa mọ́ dáadáa.
  - severity: low
    issue: “Tẹ́ ẹ ló rí” ní ìfikún “ló rí,” tí “tẹ́ ẹ” sì lè máa dá ìtumọ̀ méjì sílẹ̀.
    rationale: οὐδεὶς ἴσχυεν αὐτὸν δαμάσαι sọ pé kò sí ẹni tó ní agbára láti ṣẹ́gun tàbí mú un wá sábẹ́ àkóso; kò ní ìtumọ̀ “ever” ní pàtó.
