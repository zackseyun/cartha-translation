  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: yo
  text: Kò sì jẹ́ kí ẹnikẹ́ni bá a lọ, àfi Peteru àti Jakọbu àti Johanu, arákùnrin Jakọbu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: jẹ́ kí
  rationale: Nínú àkópọ̀ yìí pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni, ἀφίημι túmọ̀ sí fífúnni láàyè. “Jẹ́ kí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kò gba àwọn mìíràn láàyè láti tẹ̀ lé e.
- source_word: οὐδένα
  choice: ẹnikẹ́ni
  rationale: Pẹ̀lú “kò,” “ẹnikẹ́ni” fi ìkọ̀sílẹ̀ gbogbo ènìyàn hàn ní kedere.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: bá òun lọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí títẹ̀ lé ẹnì kan papọ̀ tàbí lílọ pẹ̀lú rẹ̀. “Bá òun lọ” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìrìn-àjò pẹ̀lú Jésù mọ́.
- source_word: εἰ μὴ
  choice: àfi
  rationale: Níhìn-ín, εἰ μὴ ń fi àwọn tí a yọ sílẹ̀ kúrò nínú ìdènà náà hàn; “àfi” ni ìbámu Yorùbá tó ṣe kedere.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Peteru àti Jakọbu àti Johanu
  rationale: A kọ orúkọ náà ní ìrísí tí ó wọ́pọ̀ nínú Bíbélì Yorùbá, a sì pa àsopọ̀ “àti” tí Gíríìkì tún sọ mọ́.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: arákùnrin Jakọbu
  rationale: Gbólóhùn àfikún yìí ń dá Johanu yìí mọ̀ gẹ́gẹ́ bí arákùnrin Jakọbu; ìtumọ̀ náà ṣe tààrà, ó sì ṣe àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. “Òun” mú ẹni tí wọ́n bá lọ, ìyẹn Jésù, hàn ní kedere láìfi ọ̀rọ̀ kún orísun.
