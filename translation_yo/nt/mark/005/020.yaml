source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: yo
  text: Ó sì lọ, ó sì bẹ̀rẹ̀ sí í kéde ní Dekapoli gbogbo ohun tí Jésù ti ṣe fún un[a]; ẹnu sì ya gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ohun tí Jésù ti ṣe fún un ṣe pọ̀ tó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Ó sọ pé ọkùnrin náà kúrò níbi náà lọ, ní èdè Yorùbá àdánidá láìlo ọ̀rọ̀ àsọdùn.
- source_word: ἤρξατο κηρύσσειν
  choice: ó bẹ̀rẹ̀ sí í kéde
  rationale: Ìkọ̀lé yìí pa ìtumọ̀ ìbẹ̀rẹ̀ mọ́; ‘kéde’ sì bá ẹ̀rí tí ọkùnrin náà ń sọ ní gbangba mu ju ọ̀rọ̀ tó lè túmọ̀ sí ìwàásù pàtó lọ.
- source_word: ἐν τῇ Δεκαπόλει
  choice: káàkiri ní Dekapoli
  rationale: ‘Ní Dekapoli’ ni ìtumọ̀ tààrà ἐν; ‘káàkiri’ mú kí ìṣe ìkéde ní ẹkùn náà dun bí Yorùbá àdánidá, láìsọ pé ó dé gbogbo ibi.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ó pa àyè ìtumọ̀ ‘all that’ mọ́, ó sì jẹ́ ìsọ̀rọ̀ Yorùbá tó ṣe kedere; àlàyé ìsàlẹ̀ fi ọ̀nà míì, ‘bí ohun tí ... ṣe pọ̀ tó,’ hàn.
- source_word: ἐποίησεν αὐτῷ
  choice: ti ṣe fún un
  rationale: Dátífù αὐτῷ níbí tọ́ka sí ohun tí Jésù ṣe ní àǹfààní rẹ̀; ‘fún un’ ni Yorùbá tó bójú mu.
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Ó fi àpapọ̀ àwọn ènìyàn tí wọ́n gbọ́ ọ̀rọ̀ náà hàn láìfi ẹgbẹ́ pàtó kún un.
- source_word: ἐθαύμαζον
  choice: ẹnu sì ya
  rationale: Gbólóhùn Yorùbá àdánidá ni fún ìyàlẹ́nu; bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù imperfect lè fi ìyàlẹ́nu tó ń bá a lọ hàn, àyíká ọ̀rọ̀ náà kò béèrè àfikún àsọyé.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Àkọtọ̀ orúkọ náà tẹ̀lé ìlò Yorùbá tó fìdí múlẹ̀.
theological_decisions:
- issue: Ìkéde ọkùnrin náà àti ìdánimọ̀ Jésù
  choice: A sọ ní tààrà pé ó kéde ohun tí Jésù ṣe fún un.
  alternative: Kí a ṣàfikún pé iṣẹ́ náà fi àṣẹ tàbí ìwà Ọlọ́run Jésù hàn.
  rationale: Ẹsẹ̀ náà ròyìn ẹ̀rí ọkùnrin náà àti ìyàlẹ́nu àwọn ènìyàn, ṣùgbọ́n kò sọ ìparí ẹ̀kọ́ ìgbàgbọ́ kan ní gbangba; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu; ‘Dekapoli’ jẹ́ àkọsílẹ̀ orúkọ ẹkùn náà ní ọ̀nà Yorùbá.
