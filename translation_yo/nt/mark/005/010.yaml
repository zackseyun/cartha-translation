  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: yo
  text: Ó sì ń bẹ̀ ẹ́ léraléra pé kí ó má ṣe rán wọn jáde kúrò ní agbègbè náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì ń bẹ̀ ẹ́ gidigidi pé kí ó má ṣe rán wọn kúrò ní ilẹ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλει
  choice: ń bẹ̀ ẹ́
  rationale: Nínú ọ̀rọ̀ yíyọ ẹ̀mí àìmọ́ jáde yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀bẹ̀ kánjúkánjú, kì í ṣe ìṣírí tàbí ìbéèrè lásán.
- source_word: πολλὰ
  choice: gidigidi
  rationale: Gẹ́gẹ́ bí ọ̀rọ̀ tí ó ń mú ìṣe náà lágbára, “gidigidi” jẹ́ Yorùbá àdánidá tí ó fi ìtẹnumọ́ ẹ̀bẹ̀ náà hàn; ó lè tún ní ìtumọ̀ pé ó bẹ̀ léraléra.
- source_word: ἵνα μὴ
  choice: pé kí ó má ṣe
  rationale: Èyí sọ ohun tí ó ń bẹ̀ fún ní Yorùbá tó ṣe kedere, ó sì pa ìkọ̀sẹ̀ odi inú Gíríìkì mọ́.
- source_word: αὐτὰ
  choice: wọn
  rationale: Arọ́pò-orúkọ Gíríìkì náà jẹ́ ọ̀pọ̀, ó sì tọ́ka sí àwọn ẹ̀mí àìmọ́ tàbí àwọn ẹ̀mí èṣù; “wọn” pa ọ̀pọ̀ yẹn mọ́.
- source_word: ἀποστείλῃ
  choice: rán ... jáde
  rationale: “Rán ... jáde” túmọ̀ ìṣe fífi wọn kúrò níbẹ̀ ní tààrà, láìfi ipá tí kò ṣe kedere nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἔξω τῆς χώρας
  choice: jáde kúrò ní agbègbè náà
  rationale: χώρα níbí ń tọ́ka sí ẹkùn tàbí ilẹ̀ àdúgbò kan, kì í ṣe orílẹ̀-èdè òde òní; “agbègbè” sọ èrò ibi náà ní kedere.
theological_decisions:
- issue: Ìyípadà láàárín olùsọ ẹyọ kan nínú àwọn ọ̀rọ̀-ìṣe àti arọ́pò-orúkọ ọ̀pọ̀ fún àwọn ẹ̀mí èṣù
  choice: Lo “ó” fún ẹni tí ń sọ̀rọ̀, kí a sì lo “wọn” fún àwọn tí a kò fẹ́ kí Jésù rán jáde.
  alternative: Ṣe gbogbo gbólóhùn náà ní ọ̀pọ̀ láti mú iye wọn bá ara wọn mu.
  rationale: 'Gíríìkì fúnra rẹ̀ pa ìdààmú yìí mọ́: olùsọ kan ń bẹ̀bẹ̀ ní orúkọ àwọn ẹ̀mí púpọ̀. Ìtumọ̀ náà kò mú un dọ́gba ní ọ̀nà tí yóò pa ìyàtọ̀ náà rẹ́.'
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; “ń bẹ̀ ẹ́ gidigidi” jẹ́ ọ̀rọ̀ àdánidá fún ẹ̀bẹ̀ líle, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ léraléra àti àṣàyàn “ilẹ̀/ààlà” mọ́.
