    rationale: Ìṣọ̀kan ‘òde ààlà’ jẹ́ aláìdánidá, ó sì lè mú ìtumọ̀ ibi dàrú. ‘Kúrò ní ilẹ̀ náà’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọn-dánilójú fún àṣàyàn ‘out of the territory.’
