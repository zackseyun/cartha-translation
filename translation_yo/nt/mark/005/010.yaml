  source_fidelity: Ìtumọ̀ náà pa olùsọ ẹyọ kan (‘Ó’) àti ohun tí a rán ní ọ̀pọ̀ (‘wọn’) mọ́ dáadáa. ‘Rán wọn jáde kúrò ní agbègbè náà’ jẹ́ ìtumọ̀ tí ó bá ἀποστείλῃ ἔξω τῆς χώρας mu. Ṣùgbọ́n πολλὰ níbí ní agbára ìtẹ̀síwájú/ìfàsípò nínú ìbẹ̀bẹ̀ náà, nítorí náà ‘léraléra’ sun mọ́ ‘repeatedly’ ju ‘gidigidi’ lọ nínú ọ̀rọ̀ àkọ́kọ́.
  naturalness: ‘Ó sì ń bẹ̀ ẹ́ léraléra’ jẹ́ Yorùbá ìgbàlódé, ó sì hàn gbangba. Àlàyé ìsàlẹ̀ ojú ìwé tí ó sọ ‘sí òde ààlà ilẹ̀ náà’ kò rọrùn, nítorí ‘òde ààlà’ lè dà bí ibi tí ó wà ní òde ààlà dípò kíkúrò ní agbègbè náà.
