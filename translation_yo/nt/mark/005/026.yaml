translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasán. Àwọn gbólóhùn náà ń tẹ̀ síwájú gẹ́gẹ́ bí apá kan ti gbolohun tó ń bá a lọ, nítorí náà a fi àmì kọ́má parí rẹ̀.
