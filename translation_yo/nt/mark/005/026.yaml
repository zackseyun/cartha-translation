  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ nínú ẹ̀kúnrẹ́rẹ́ Gíríìkì náà dáadáa: ìjìyà lábẹ́/onípasẹ̀ àwọn oníṣègùn púpọ̀, lílo gbogbo ohun ìní rẹ̀, àìrí ìrànlọ́wọ́, àti ìlọ sí ipò tí ó burú sí i. Síbẹ̀, “dípò bẹ́ẹ̀” kò ní agbára ìfiwéra tó wà nínú ἀλλὰ μᾶλλον dáadáa; “ṣùgbọ́n kàkà bẹ́ẹ̀” ni ó sún mọ́ ọn. Bákan náà, “àìsàn rẹ̀” ṣàfikún ohun tí gbolohun Gíríìkì kò sọ ní ẹsẹ̀ yìí gan-an; “ipò rẹ̀” pa ìtumọ̀ náà mọ́ láìfikún un.'
