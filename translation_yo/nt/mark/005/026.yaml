  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: yo
  text: Ó ti jìyà púpọ̀ lọ́wọ́ ọ̀pọ̀lọpọ̀ oníṣègùn[a], ó sì ti ná gbogbo ohun tí ó ní[b], kò sì rí ìrànlọ́wọ́ kankan; ṣùgbọ́n kàkà bẹ́ẹ̀, ipò rẹ̀ burú sí i,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “nítorí ọ̀pọ̀lọpọ̀ oníṣègùn” tàbí “ní ọwọ́ ọ̀pọ̀lọpọ̀ oníṣègùn.” Ọ̀rọ̀ Gíríìkì lè tẹnu mọ́ àwọn oníṣègùn gẹ́gẹ́ bí olùṣe, tàbí bí obìnrin náà ṣe wà lábẹ́ ìtọ́jú wọn.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “gbogbo ohun tí ó wà lọ́dọ̀ rẹ̀,” ìyẹn ni, gbogbo ohun tí ó ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: Ó ti jìyà púpọ̀
  rationale: Ó mú ìtumọ̀ ìrírí πάσχω àti ohun tí ó ti ṣẹlẹ̀ ṣáájú wá ní Yorùbá àdánidá.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: lọ́wọ́ ọ̀pọ̀lọpọ̀ oníṣègùn
  rationale: “Lọ́wọ́” lè tọ́ka sí ẹni tí ìṣe ti ọ̀dọ̀ rẹ̀ wá tàbí ẹni tí obìnrin náà wà lábẹ́ ìtọ́jú rẹ̀; bẹ́ẹ̀ ni ó pa àìdánilójú Gíríìkì mọ́.
- source_word: δαπανήσασα
  choice: ó sì ti ná
  rationale: Ó túmọ̀ sí lílo owó tàbí ohun ìní, ó sì bá ìtẹ̀lé àwọn participle aorist mu láìfi ìtumọ̀ míì kún un.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: gbogbo ohun tí ó ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ gbogbo ohun ìní tàbí ohun tó wà ní ìkáwọ́ rẹ̀.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: kò rí ìrànlọ́wọ́ kankan
  rationale: 'Ó pa ohùn gbólóhùn passive mọ́: kò gba àǹfààní tàbí ìrànlọ́wọ́ kankan láti inú ìtọ́jú náà.'
- source_word: ἀλλὰ μᾶλλον
  choice: dípò bẹ́ẹ̀
  rationale: 'Ó fi ìyàtọ̀ tó lágbára hàn: kì í ṣe pé kò rí ìrànlọ́wọ́ nìkan, ipò náà tilẹ̀ yí padà sí búburú.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: àìsàn rẹ̀ ń burú sí i
  rationale: Ó sọ ìlọsíwájú sí ipò búburú ní Yorùbá tó ṣe kedere, láìsọ ọ̀rọ̀ Gíríìkì náà ní líle ju.
