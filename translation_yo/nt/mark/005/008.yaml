  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: yo
  text: Nítorí ó ń sọ fún un[a] pé, “Jáde nínú ọkùnrin náà, ìwọ ẹ̀mí àìmọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “un” lè tọ́ka sí ọkùnrin náà tàbí sí ẹ̀mí àìmọ́ náà; àṣẹ tí ó tẹ̀ lé e dojú kọ ẹ̀mí náà.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn nínú ìtàn; “ó ń sọ” mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ṣàlàyé ìdí tàbí àlàyé abẹ́lẹ̀ fún ohun tí ó ṣáájú; “Nítorí” pa ìsopọ̀ yìí mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà wà ní dative, “fún un” sì tẹ̀ lé ìṣètò Gíríìkì láìfipá yan ẹni tí “un” ń tọ́ka sí.
- source_word: Ἔξελθε
  choice: Jáde
  rationale: Aorist imperative ni, ó sì jẹ́ àṣẹ tààrà. “Jáde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílọ láti inú ibìkan sí òde.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: kúrò lára ọkùnrin náà
  rationale: ἐκ tọ́ka sí ìjáde láti inú ẹni náà; ní Yorùbá, “kúrò lára ọkùnrin náà” sọ ìyapa kúrò nínú ẹni tí ẹ̀mí náà ń gbé lọ́nà tí ó ṣe kedere, tí ó sì bá àyíká ìtàn mu.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: ìwọ ẹ̀mí àìmọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní àpilẹ̀kọ, ó ń ṣiṣẹ́ gẹ́gẹ́ bí àpèjúwe ẹni tí a ń bá sọ̀rọ̀. “Ìwọ” mú ìpè tààrà náà hàn, “ẹ̀mí àìmọ́” sì pa ìtumọ̀ ἀκάθαρτον mọ́ ju “ẹ̀mí búburú” lọ.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα ἀκάθαρτον nínú àyíká yíyọ ẹ̀mí jáde
  choice: ẹ̀mí àìmọ́
  alternative: ẹ̀mí búburú
  rationale: Gíríìkì sọ ní pàtó pé “ẹ̀mí àìmọ́.” Yíyí i sí “ẹ̀mí búburú” yóò jẹ́ ìtumọ̀ àlàyé tí kò pa gbogbo ìfarahàn àìmọ́ mọ́.
- issue: Ẹni tí αὐτῷ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ arọ́pò orúkọ náà mọ́ gẹ́gẹ́ bí “un”
  alternative: Láti sọ ní pàtó pé ọkùnrin náà tàbí ẹ̀mí náà ni
  rationale: Àyíká fi hàn pé àṣẹ náà dojú kọ ẹ̀mí àìmọ́, ṣùgbọ́n ọ̀rọ̀ arọ́pò orúkọ Gíríìkì fúnra rẹ̀ kò sọ ẹni tí ó ń tọ́ka sí ní orúkọ. Yorùbá “un” pa ìṣòro ìtọ́kasí náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún, ó sì jẹ́ ti ọ̀wọ̀, ṣókí, àti àdánidá fún òǹkàwé òde òní. A lo “ìwọ” nínú àṣẹ láti fi hàn pé “ẹ̀mí àìmọ́” jẹ́ ẹni tí a ń pè ní tààrà.
