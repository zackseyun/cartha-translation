  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ gbooro ti Gíríìkì dáadáa: wọ́n dé ilé olórí sínágọ́gù, Jésù rí ìdàrúdàpọ̀/ariwo, àwọn ènìyàn sì ń sunkún, wọ́n ń pohùnréré. Síbẹ̀, ọ̀rọ̀ “ń pohùn réré” kò dájú gẹ́gẹ́ bí ìlò Yorùbá òde òní fún ἀλαλάζοντας; ó lè dà bí ọ̀rọ̀ tí a kọ tàbí tí a dá pọ̀ ní àìmọ̀ọ́kà. “Ń ké ramúramù gidigidi” sọ igbe ọ̀fọ̀ aláriwo náà ní kedere, ó sì pa ìmúnilágbára πολλά mọ́.'
