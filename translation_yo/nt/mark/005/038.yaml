source:
  edition: SBLGNT
  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: yo
  text: Wọ́n sì dé ilé olórí sínágọ́gù náà, ó sì rí ariwo, àwọn ènìyàn sì ń sunkún, wọ́n sì ń ké ramúramù gidigidi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé
  rationale: Ọ̀rọ̀ yìí wà ní ìsinsìnyí ìtàn nínú Gíríìkì, ṣùgbọ́n “wọ́n dé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n dé ibi náà, láì fi ìtumọ̀ míì kún un.
- source_word: οἶκον
  choice: ilé
  rationale: “Ilé” ni ìbámu tààrà àti èdè Yorùbá àdánidá fún οἶκος níbí.
- source_word: ἀρχισυναγώγου
  choice: olórí sínágọ́gù
  rationale: Ó sọ ipò ẹni tó ń darí tàbí tó jẹ́ ọ̀gá sínágọ́gù ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: θεωρεῖ
  choice: ó rí
  rationale: Ọ̀rọ̀-ìṣe ẹyọ kan náà tọ́ka sí Jésù gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn; “ó rí” ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: θόρυβον
  choice: ariwo
  rationale: Ní àyíká ọ̀fọ̀ yìí, “ariwo” lè gba ìtumọ̀ ìró ńlá àti rúdurùdu tó wà nínú θόρυβος, láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: κλαίοντας
  choice: àwọn ènìyàn tí ń sunkún
  rationale: A fi “àwọn ènìyàn” hàn gbangba nítorí participle náà ń ṣiṣẹ́ bí orúkọ fún àwọn tó ń sunkún.
- source_word: ἀλαλάζοντας πολλά
  choice: tí wọ́n sì ń pohùn réré gidigidi
  rationale: Àpapọ̀ ọ̀rọ̀ náà ń ṣàpèjúwe igbe ọ̀fọ̀ tó lágbára; “pohùn réré gidigidi” mú ariwo àti ìmúnilágbára πολλά jáde ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìtẹ̀lé àwọn àsopọ̀ Gíríìkì mọ́ ní ọ̀nà àdánidá.
