  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: yo
  text: Wọ́n sì bẹ̀rẹ̀ sí í bẹ̀ ẹ́ pé kí ó kúrò ní agbègbè wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì bẹ̀rẹ̀ sí í rọ̀ ọ́ pé kí ó lọ kúrò ní ilẹ̀ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá nínú Yorùbá, láìfi ìtumọ̀ àkókò kún un.
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ìkọ̀lé yìí fi ìtumọ̀ ìbẹ̀rẹ̀ ìṣe tí ó wà nínú ἤρξαντο pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni hàn ní Yorùbá àdánidá.
- source_word: παρακαλεῖν
  choice: bẹ̀ ẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, παρακαλεῖν túmọ̀ sí ẹ̀bẹ̀ tó lágbára; “bẹ̀ ẹ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìmọ̀lára ìṣẹ̀lẹ̀ náà mu.
- source_word: αὐτὸν
  choice: ẹ́
  rationale: Arọ́pò-orúkọ olùgbà ìṣe náà ń tọ́ka sí Jésù; fọ́ọ̀mù “ẹ́” bá ọ̀rọ̀-ìṣe “bẹ̀” mu ní Yorùbá.
- source_word: ἀπελθεῖν
  choice: kí ó kúrò
  rationale: 'Ó sọ àkóónú ẹ̀bẹ̀ wọn ní Yorùbá àdánidá: pé kí ó lọ kúrò níbẹ̀.'
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ní agbègbè wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ὅρια lè túmọ̀ ní tààrà sí ààlà, nínú gbólóhùn yìí ó ń tọ́ka sí ilẹ̀ tàbí agbègbè wọn; “agbègbè wọn” ṣe ìtumọ̀ náà ní kedere.
