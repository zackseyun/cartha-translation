reference: Mark 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: yo
  text: Ó sì yọ̀ǹda fún wọn. Nígbà náà, àwọn ẹ̀mí àìmọ́ náà jáde, wọ inú àwọn ẹlẹ́dẹ̀ náà; agbo ẹlẹ́dẹ̀ náà—ní nǹkan bí ẹgbẹ̀rún méjì—sì tú sáré sọ̀ kalẹ̀ gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà[a] sínú òkun[b], wọ́n sì rì nínú òkun náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “pàlàpálá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibi gẹ̀rẹ́gẹ̀rẹ́ tàbí pàlàpálá.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “òkun” ni. Òkun Galili, tí ó jẹ́ adágún ńlá, ni ọ̀rọ̀ náà ń tọ́ka sí.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: Ó sì yọ̀ǹda fún wọn
  rationale: “Yọ̀ǹda fún” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fún wọn láàyè, láì sọ ọ́ di àṣẹ tí ó pàṣẹ fún wọn.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: àwọn ẹ̀mí àìmọ́
  rationale: Ó pa èdè ẹni-ẹ̀mí inú Gíríìkì mọ́, ó sì gbé ìtumọ̀ àìmọ́ rẹ̀ jáde láì sọ wọn di agbára búburú aláìlẹ́ni.
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: jáde, wọ inú àwọn ẹlẹ́dẹ̀
  rationale: Àwọn ọ̀rọ̀ ìṣe méjèèjì mú ìtẹ̀lé ìṣẹ̀lẹ̀ náà hàn ní Yorùbá tó rọrùn, wọ́n sì fi ẹlẹ́dẹ̀ hàn gẹ́gẹ́ bí ohun tí àwọn ẹ̀mí wọ inú rẹ̀.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: gbogbo agbo ẹlẹ́dẹ̀ náà ... tú sáré
  rationale: “Agbo” bá orúkọ àkójọpọ̀ mu, “tú sáré” sì fi ìṣísẹ̀ òjijì àti líle náà hàn láì fi ìtumọ̀ míì kún un.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: lọ sí ìsàlẹ̀ etí omi gẹ̀rẹ́gẹ̀rẹ́ náà
  rationale: κρημνός lè jẹ́ ibi gẹ̀rẹ́gẹ̀rẹ́ tàbí ibi gíga tó ṣán kalẹ̀; yíyan yìí kò fi dandan mú un jẹ́ pàlàpálá tó dúró ṣánṣán.
- source_word: ὡς δισχίλιοι
  choice: tí iye wọn tó bí ẹgbẹ̀rún méjì
  rationale: “Bí” pa ìsúnmọ́ iye tí ὡς ń tọ́ka sí mọ́, kò sì sọ ẹgbẹ̀rún méjì di iye pípé.
- source_word: εἰς τὴν θάλασσαν ... ἐν τῇ θαλάσσῃ
  choice: wọ inú òkun ... rì sínú òkun náà
  rationale: “Òkun” tẹ̀lé θάλασσα, ìtúnṣe ọ̀rọ̀ náà sì pa àtúnwí inú Gíríìkì mọ́; “rì” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ikú wọn nínú omi.
theological_decisions:
- issue: Ohun tí “wọn” nínú “yọ̀ǹda fún wọn” ń tọ́ka sí
  choice: Àwọn ẹ̀mí àìmọ́ ni “wọn” ń tọ́ka sí.
  alternative: Kí a fi orúkọ “àwọn ẹ̀mí àìmọ́” síbẹ̀ dípò arọ́pò-orúkọ.
  rationale: Àyíká ọ̀rọ̀ ṣáájú ẹsẹ yìí mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere; pípa arọ́pò-orúkọ mọ́ tún tẹ̀lé Gíríìkì láì ṣe àlàyé sínú ẹsẹ náà.
- issue: Bí a ṣe máa túmọ̀ “àwọn ẹ̀mí àìmọ́”
  choice: Pa èdè ẹni-ẹ̀mí mọ́.
  alternative: Àwọn agbára búburú.
  rationale: πνεύματα fi wọn hàn gẹ́gẹ́ bí àwọn ẹ̀mí tó ń ṣe ohun kan nínú ìtàn náà; ìtumọ̀ yìí kò dín wọn kù sí agbára aláìlẹ́ni, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá Àjùmọ̀lò tó ní àmì ohùn ní kíkún, ó ní ìyì ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A lo “ẹlẹ́dẹ̀,” “agbo,” àti “tú sáré” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá; a sì pa àtúnwí “òkun” inú orísun mọ́.
