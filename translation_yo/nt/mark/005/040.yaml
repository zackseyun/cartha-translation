source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: yo
  text: Wọ́n sì ń rẹ́rìn-ín sí i.[a] Ṣùgbọ́n lẹ́yìn tí ó lé gbogbo wọn jáde, ó mú baba ọmọ náà àti ìyá ọmọ náà, àti àwọn tí ó wà pẹ̀lú rẹ̀[b] lọ; ó sì wọ ibi tí ọmọ náà wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń fi í ṣe ẹlẹ́yà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀rín ẹ̀gàn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, àwọn ọmọ-ẹ̀yìn tí wọ́n ń bá a rìn.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: ń fi í rẹ́rìn-ín
  rationale: Ọ̀rọ̀ yìí fi ẹ̀rín ẹ̀gàn hàn; àmì àkókò imperfect náà ń tọ́ka sí ìṣe tí ń lọ lọ́wọ́ nígbà náà.
- source_word: ἐκβαλὼν πάντας
  choice: lẹ́yìn tí ó lé gbogbo wọn jáde
  rationale: Ó fi hàn pé ó mú kí gbogbo àwọn yòókù jáde, láìjẹ́ kí èdè náà dá bí ọ̀rọ̀ ìlé ẹ̀mí èṣù.
- source_word: παραλαμβάνει
  choice: ó mú ... lọ
  rationale: Historical present Gíríìkì ni a túmọ̀ sí ọ̀nà àlàyé ìtàn tí ó bá Yorùbá mu; ó túmọ̀ sí pé ó mú àwọn tí a dárúkọ náà pẹ̀lú ara rẹ̀.
- source_word: παιδίου / παιδίον
  choice: ọmọ
  rationale: παιδίον jẹ́ ọ̀rọ̀ àìdá akọ tàbí abo pàtó fún ọmọ; bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ọmọbìnrin ni, a pa àìsọ̀tọ̀ ọ̀rọ̀ ẹsẹ̀ yìí mọ́.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Èyí pa ìṣọ̀kan gbólóhùn Gíríìkì mọ́ láìsọ àwọn ẹni náà di pàtó nínú ẹsẹ̀.
- source_word: εἰσπορεύεται
  choice: ó sì wọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún wíwọ inú ibi tí ọmọ náà wà.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: ibi tí ọmọ náà wà
  rationale: A kò fi ‘gbọ́lẹ̀’ kún un, nítorí Gíríìkì sọ ipò ibi nìkan.
theological_decisions:
- issue: Àkókò ìṣe nínú ìtàn àti ìmúlẹ̀ ìṣẹ̀lẹ̀
  choice: 'Lo àkókò ìtàn Yorùbá déédéé: “ó mú ... lọ; ó sì wọ”'
  alternative: 'Pa historical present mọ́ ní tààrà: “ó mú ... lọ; ó sì ń wọ”'
  rationale: Máàkù lo historical present láti mú ìtàn yè; ṣùgbọ́n àdàkọ tààrà rẹ̀ lè dà bí ìṣe tó ń lọ lọ́wọ́ ní Yorùbá. Àkókò ìtàn déédéé ń mú ìtumọ̀ àti ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn kedere.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “ń fi í rẹ́rìn-ín” fún ẹ̀rín ẹ̀gàn, a sì pa “ọmọ” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí kò sọ akọ tàbí abo pàtó.
