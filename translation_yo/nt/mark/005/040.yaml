  to: Wọ́n sì ń rẹ́rìn-ín sí i.[a] Ṣùgbọ́n lẹ́yìn tí ó lé gbogbo wọn jáde, ó mú baba ọmọ náà àti ìyá ọmọ náà, àti àwọn tí ó wà pẹ̀lú rẹ̀[b] lọ; ó sì wọ ibi tí ọmọ náà wà.
