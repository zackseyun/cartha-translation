  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: imperfect κατεγέλων ni a fi hàn gẹ́gẹ́ bí ìṣe tí ń lọ; ἐκβαλὼν πάντας ni ‘lé gbogbo wọn jáde’; ó sì pa ‘ọmọ’ mọ́, láìfi ‘ọmọbìnrin’ tí gbolohun náà kò sọ kún un. ‘Mú ... lọ’ àti ‘wọ’ jẹ́ ìtúmọ̀ tó yẹ fún παραλαμβάνει àti εἰσπορεύεται nínú ìtàn Yorùbá.'
  naturalness: ‘Ń fi í rẹ́rìn-ín’ kò ṣe kedere tàbí déédéé gẹ́gẹ́ bí ọ̀nà Yorùbá fún rírẹ́rìn sí ẹnì kan pẹ̀lú ẹ̀gàn. ‘Ń rẹ́rìn-ín sí i’ jẹ́ ọ̀nà tó rọrùn, tó ṣe kedere, tí ó sì pa ìtumọ̀ ẹ̀rín ẹ̀gàn mọ́. Yíyí ‘ìyá rẹ̀’ sí ‘ìyá ọmọ náà’ tún yọ ìṣòro ìtọ́kasí aṣojú-ọrọ̀ kúrò.
  terminology: ‘Ọmọ,’ ‘lé ... jáde,’ ‘mú ... lọ,’ àti ‘wọ’ bá ìforúkọsílẹ̀ ìtàn mímọ́ Yorùbá òde òní mu. Àwọn àlàyé abẹ́lẹ̀ méjèèjì yẹ, àwọn àmì wọn sì wà níbi tó tọ́.
  issues:
  - severity: medium
    issue: ‘Wọ́n sì ń fi í rẹ́rìn-ín’ jẹ́ àsọyé tí kò déédéé.
    rationale: Ó dà bí ìpapọ̀ àwọn àkànṣe ọ̀nà méjì, ó sì lè fa ìdàrúdàpọ̀. ‘Wọ́n sì ń rẹ́rìn-ín sí i’ sọ ìṣe ‘laugh at him’ ní kedere, pẹ̀lú ìtẹ̀síwájú imperfect.
  - severity: low
    issue: ‘Ìyá rẹ̀’ lè ní ìtọ́kasí tí kò ṣe kedere.
    rationale: Bí ó tilẹ̀ ṣeé mọ̀ láti inú àyíká pé ìyá ọmọ náà ni, ‘ìyá ọmọ náà’ ń fi ìfararora Gíríìkì ‘the mother’ hàn kedere lẹ́gbẹ̀ẹ́ ‘baba ọmọ náà.’
