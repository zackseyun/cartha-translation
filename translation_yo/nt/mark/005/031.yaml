source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì ń sọ fún un pé, “Ìwọ rí bí ogunlọ́gọ̀ ènìyàn ṣe ń tẹ̀ mọ́ ọ[a], o sì ń sọ pé, ‘Ta ni ó fọwọ́ kàn mí?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń kó ara wọn mọ́ ọ.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé ogunlọ́gọ̀ náà kóra jọ, wọ́n sì ń tẹ̀ Jésù mọ́ra nípa ti ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ fún un
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ọ̀rọ̀ wọn ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; ‘ń sọ fún un’ pa ìtumọ̀ yìí mọ́ ní Yorùbá àdánidá.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìbáṣepọ̀ akẹ́kọ̀ọ́ àti olùtẹ̀lé mọ́.
- source_word: Βλέπεις
  choice: Ìwọ rí
  rationale: Ó jẹ́ gbólóhùn ìfihàn ní àsìkò ìsinsìnyí, ó sì tọ́ka sí ohun tí ó hàn gbangba níwájú wọn.
- source_word: ὄχλον
  choice: ogunlọ́gọ̀ ènìyàn
  rationale: Ó sọ ọ̀pọ̀ ènìyàn tí ó péjọ ní kedere, ó sì jẹ́ èdè Yorùbá òde òní tí ó ní iyì.
- source_word: συνθλίβοντά
  choice: ń tẹ̀ mọ́ ọ
  rationale: Ó fi ìfúnpọ̀ ara hàn—ogunlọ́gọ̀ náà ń tẹ̀ mọ́ Jésù—láìsọ pé wọ́n ń pa á lára tàbí fọ́ ọ.
- source_word: λέγεις
  choice: o sì ń sọ pé
  rationale: Ó tẹ̀ lé ìtumọ̀ taara ti ọ̀rọ̀-ìṣe náà, ó sì pa ìyàlẹ́nu àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: Τίς μου ἥψατο
  choice: Ta ni ó fọwọ́ kàn mí?
  rationale: ‘Fọwọ́ kàn’ jẹ́ ọ̀nà àdánidá láti sọ ìfọwọ́kàn kan pàtó tí ó ṣẹ̀ṣẹ̀ wáyé; ‘mí’ sì mú iṣẹ́ genitive náà jáde gẹ́gẹ́ bí èdè Yorùbá ṣe ń lò ó.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìpele àárín tí ó ṣe kedere, tí ó ní iyì, tí ó sì jẹ́ àdánidá fún òǹkàwé òde òní. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà ní kíkún níbi tí wọ́n ti yẹ.
