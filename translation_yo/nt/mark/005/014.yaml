id: MRK.5.14
reference: Mark 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: yo
  text: Àwọn tí ń tọ́jú wọn sì sá lọ, wọ́n sì ròyìn ohun náà ní ìlú àti ní àwọn agbègbè ìgbèríko[a]; àwọn ènìyàn sì wá láti wo ohun tí ó ṣẹlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn oko.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí èyí ní tààràtà, ṣùgbọ́n níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí àwọn agbègbè ìgbèríko tó yí ìlú ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: àwọn tí ń tọ́jú wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn olùtọ́jú agbo ẹlẹ́dẹ̀; “tọ́jú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè gba iṣẹ́ jíjẹ́ wọn àti dídá wọn sí ọ̀nà.
- source_word: αὐτούς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn ẹlẹ́dẹ̀ inú ẹsẹ tó ṣáájú, a sì pa arọ́pò-orúkọ Gíríìkì náà mọ́ nítorí ohun tí ó ń tọ́ka sí ṣe kedere nínú àyíká ọ̀rọ̀.
- source_word: ἔφυγον
  choice: sá lọ
  rationale: Ó fi ìsá tí ó ṣẹlẹ̀ lójijì hàn ní ọ̀nà àdánidá àti alágbára nínú ìtàn Yorùbá.
- source_word: ἀπήγγειλαν
  choice: ròyìn ohun náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjíṣẹ́ tàbí fífi ìròyìn ohun tí ó ṣẹlẹ̀ hàn; “ròyìn ohun náà” bá àyíká ìtàn mu.
- source_word: εἰς τὴν πόλιν
  choice: ní ìlú
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń túmọ̀ sí “sí/inú,” pẹ̀lú iṣẹ́ ríròyìn, Yorùbá àdánidá ń sọ ibi tí wọ́n ti tan ìròyìn náà sí pé “ní ìlú.”
- source_word: εἰς τοὺς ἀγρούς
  choice: ní àwọn agbègbè ìgbèríko
  rationale: Nínú ìyàtọ̀ rẹ̀ sí “ìlú,” ọ̀rọ̀ náà lè tọ́ka sí àwọn agbègbè òde tó yí ìlú ká, kì í ṣe àwọn oko nìkan.
- source_word: ἦλθον
  choice: àwọn ènìyàn sì wá
  rationale: Gíríìkì ní olùṣe púpọ̀ tí kò sọ orúkọ rẹ̀; fífi “àwọn ènìyàn” hàn jẹ́ Yorùbá àdánidá, ó sì yẹra fún arọ́pò-orúkọ tí ẹni tí ó ń tọ́ka sí lè dà rú.
- source_word: ἰδεῖν
  choice: láti wo
  rationale: Ó sọ ète wíwá wọn ní kedere, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: τί ἐστιν τὸ γεγονός
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Ó gbé ìtumọ̀ ìṣẹ̀lẹ̀ tí ó ti wáyé jáde ní ṣókí, láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún àwọn òǹkàwé òde òní. A pa ìṣàn gbólóhùn Gíríìkì mọ́ ní ẹsẹ kan, a sì fi àmì àlàyé [a] sí ọ̀rọ̀ tí ó kan.
