  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: yo
  text: Ó sì ń béèrè lọ́wọ́ rẹ̀ pé, “Kí ni orúkọ rẹ?” Ó sì wí fún un pé, “Orúkọ mi ni Lẹ́gíọ̀nù[a], nítorí a pọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lẹ́gíọ̀nù” jẹ́ ọ̀rọ̀ ológun Látìnì tí a yá wọ èdè Gíríìkì, tí ó ń tọ́ka sí ẹ̀ka ọmọ ogun Róòmù ńlá kan; níhìn-ín, ó jẹ́ orúkọ tí ẹ̀mí èṣù náà sọ fún ara rẹ̀, ó sì fi hàn pé wọ́n pọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ń bi í pé
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì náà fi ìṣe tí ó ń lọ tàbí tí a ń tún ṣe hàn; ‘ń bi í’ pa ìtumọ̀ yìí mọ́ ní Yorùbá àdánidá.
- source_word: Τί ὄνομά σοι
  choice: Kí ni orúkọ rẹ?
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé, tí ó sì ṣe kedere fún gbólóhùn Gíríìkì náà.
- source_word: λέγει αὐτῷ
  choice: Ó sì wí fún un pé
  rationale: A lo ọ̀rọ̀ ìtàn Yorùbá tí ó ní iyì; ó mú ìdáhùn tààrà náà jáde, bí ó tilẹ̀ jẹ́ pé Yorùbá kò sábà fi ìsinsìnyí ìtàn hàn bí Gíríìkì.
- source_word: Λεγιών
  choice: Lẹ́gíọ̀nù
  rationale: A ṣe àfọ̀rọ̀kọ orúkọ/àpèjúwe náà sí ìró Yorùbá dípò títúmọ̀ ọ́ sí ọ̀rọ̀ gbogbogbò, nítorí ó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni tí ń dáhùn.
- source_word: ὄνομά μοι
  choice: ni orúkọ mi
  rationale: Èyí jẹ́ ìṣètò ọ̀rọ̀ Yorùbá àdánidá fún ìfihàn orúkọ ẹni.
- source_word: ὅτι πολλοί ἐσμεν
  choice: nítorí pé ọ̀pọ̀ ni wá
  rationale: ‘Nítorí pé’ fi ìdí orúkọ náà hàn, ‘wá’ sì pa yíyí láti ẹni kan sí ọ̀pọ̀ ènìyàn mọ́.
theological_decisions:
- issue: Yíyí láti arọ́pò-orúkọ ẹyọ kan sí ọ̀pọ̀ nínú ọ̀rọ̀ ẹni tí ń sọ
  choice: Pa ‘orúkọ mi’ àti ‘ọ̀pọ̀ ni wá’ mọ́ láì mú wọn dọ́gba.
  alternative: Lílọ ‘orúkọ wa’ láti mú gbogbo gbólóhùn náà bá ọ̀pọ̀ mu.
  rationale: Gíríìkì mọ̀ọ́mọ̀ pa ìforígbárí láàárín ẹyọ kan àti ọ̀pọ̀ mọ́; ó yẹ kí ìtumọ̀ náà má ṣe yanjú ìṣòro yìí fún òǹkàwé.
translation_notes:
  register: Yorùbá àfẹnusọ tí ó bójú mu, tí ó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. ‘Wí fún un’ bá ìforúkọsílẹ̀ Bíbélì mu láì di ọ̀rọ̀ àtijọ́ tí kò ṣeé lóye; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé àyíká ológun Róòmù.
