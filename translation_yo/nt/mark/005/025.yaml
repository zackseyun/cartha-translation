  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: yo
  text: Obìnrin kan sì wà tí ó ti ní ìṣàn ẹ̀jẹ̀ fún ọdún méjìlá,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ẹ̀jẹ̀ ti ń jáde lára rẹ̀,” tàbí, “tí ó ní ìjẹ̀jẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹni tuntun yìí mọ́ ìtàn tó ń lọ, ó sì pa ọ̀nà ìsọ̀rọ̀ alásopọ̀ ti Máàkù mọ́ ní Yorùbá àdánidá.
- source_word: γυνὴ
  choice: Obìnrin kan
  rationale: Ọ̀rọ̀ náà ń mú ẹni tuntun kan wọ inú ìtàn; “kan” fi àìdá ẹni náà hàn lọ́nà Yorùbá àdánidá.
- source_word: οὖσα
  choice: wà tí ... ń
  rationale: Ìtumọ̀ gangan ni “tí ó wà,” ṣùgbọ́n pẹ̀lú gbólóhùn ipò tó tẹ̀ lé e, àkójọpọ̀ “wà tí ... ń” fi ipò tó ń bá a lọ hàn.
- source_word: ἐν ῥύσει αἵματος
  choice: ẹ̀jẹ̀ ń dà lára rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ipò ẹ̀jẹ̀ tó ń jáde lára ẹni; ó pa ìrísí ìṣàn ẹ̀jẹ̀ àti ipò tó ń bá a lọ mọ́ láìfi ìtumọ̀ ìṣègùn kan ṣoṣo lé e lórí.
- source_word: ῥύσει
  choice: ń dà
  rationale: Ọ̀rọ̀-ìṣe yìí mú èrò ohun tó ń ṣàn tàbí jáde jáde hàn ní Yorùbá àdánidá.
- source_word: αἵματος
  choice: ẹ̀jẹ̀
  rationale: Èyí ni ìtumọ̀ taara ti αἷμα ní àyíká yìí.
- source_word: δώδεκα ἔτη
  choice: fún ọdún méjìlá
  rationale: “Fún” fi gígùn àkókò hàn kedere, bí ẹ̀sùn àkókò inú Gíríìkì ṣe rí.
