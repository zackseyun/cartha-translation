id: MRK.5.1
reference: Mark 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: yo
  text: Wọ́n sì dé sí ìhà kejì òkun, sí agbègbè àwọn ará Gérásà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka “àwọn ará Gádárà”; àwọn mìíràn ka “àwọn ará Gérgésà.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó pa ìṣàn ìtàn oníṣe-tẹ̀lé-iṣẹ́ Máàkù mọ́ ní ọ̀nà àdánidá Yorùbá, láì sọ ọ́ di ‘lẹ́yìn náà.’
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀pọ̀ ènìyàn, ó sì tọ́ka sí Jésù àti àwọn tí ó wà pẹ̀lú rẹ̀; ‘dé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún dídé ibi tí wọ́n ń lọ.
- source_word: εἰς τὸ πέραν
  choice: òdìkejì
  rationale: Ó ṣàfihàn apá òdìkejì omi tí wọ́n ré kọjá, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τῆς θαλάσσης
  choice: òkun
  rationale: Bí ó tilẹ̀ jẹ́ pé Òkun Gálílì jẹ́ adágún ní ti ilẹ̀-ayé, Gíríìkì lo ‘θαλάσσης’ (‘òkun’); yíyan ‘òkun’ pa ọ̀rọ̀ orísun àti ìlò Ìhìn Rere mọ́.
- source_word: εἰς τὴν χώραν
  choice: sí agbègbè
  rationale: χώρα níbí túmọ̀ sí ilẹ̀ tàbí ìpínlẹ̀ agbègbè kan, kì í ṣe orílẹ̀-èdè òde òní; ‘agbègbè’ ṣe kedere ní Yorùbá.
- source_word: Γερασηνῶν
  choice: àwọn ará Gérásà
  rationale: Orúkọ náà jẹ́ orúkọ àwọn ènìyàn tí a dá láti orúkọ ibi; ‘àwọn ará Gérásà’ jẹ́ Yorùbá àdánidá ju fífi fọ́ọ̀mù Gíríìkì náà ṣe àfọwọ́kọ lọ.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa orúkọ ibi nínú ìtàn ọkùnrin tí ẹ̀mí àìmọ́ ń yọ lẹ́nu
  choice: àwọn ará Gérásà
  alternative: àwọn ará Gádárà; àwọn ará Gérgésà
  rationale: SBLGNT ka Γερασηνῶν. Ọ̀rọ̀ pàtàkì tẹ̀lé ẹ̀rí Gíríìkì yìí, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìyàtọ̀ pàtàkì inú àfọwọ́kọ mọ́ láì dá àríyànjiyàn nípa ilẹ̀-ayé tàbí ẹ̀kọ́ ìgbàgbọ́ parí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Ìtúmọ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì pa ìṣàn gbolohun Máàkù mọ́. A lo ‘àwọn ará Gérásà’ gẹ́gẹ́ bí ọ̀nà Yorùbá tó wọ́pọ̀ fún orúkọ àwọn olùgbé ibi kan.
