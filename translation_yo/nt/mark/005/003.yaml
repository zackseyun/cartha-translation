source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: yo
  text: ẹni tí ó ń gbé láàárín àwọn ibojì[a]. Kò sì sí ẹnikẹ́ni tí ó lè dè é mọ́, kódà pẹ̀lú ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà tímọ́tímọ́, “ẹni tí ó ní ibùgbé rẹ̀ nínú àwọn ibojì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: ń gbé
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ní ti gidi pé ó ‘ní ibùgbé’; ‘ń gbé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ibẹ̀ ni ibùgbé rẹ̀, ó sì fi ìṣe tí ń bá a lọ nínú àkókò àtijọ́ hàn.
- source_word: ἐν τοῖς μνήμασιν
  choice: láàárín àwọn ibojì
  rationale: ‘Ibojì’ tọ́ka sí ibi ìsìnkú; ‘láàárín’ bá àyíká náà mu láìfi dandan sọ pé inú ibojì kan pàtó ni ó wà ní gbogbo ìgbà. Àṣàyàn tó tẹ̀lé ọ̀rọ̀ Gíríìkì tímọ́tímọ́ ni ‘nínú àwọn ibojì.’
- source_word: οὐδὲ ἁλύσει
  choice: fi ẹ̀wọ̀n
  rationale: ἅλυσις jẹ́ ẹ̀wọ̀n irin, ó sì wà ní ẹyọ ọ̀rọ̀. Ìtumọ̀ náà pa ìtẹnumọ́ pé kódà ẹ̀wọ̀n kò tó láti dè é mọ́, bí ó tilẹ̀ jẹ́ pé ìṣètò gbolohun Yorùbá mú ‘ẹ̀wọ̀n’ wọ inú gbólóhùn àkọ́kọ́.
- source_word: οὐκέτι
  choice: tún … mọ́
  rationale: Àpapọ̀ ‘tún’ àti ‘mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ‘kò … mọ́,’ ó sì tọ́ka sí pé ohun tí ó ṣeé ṣe tẹ́lẹ̀ kò ṣeé ṣe mọ́.
- source_word: ἐδύνατο
  choice: lè
  rationale: ‘Lè’ ni ọ̀nà Yorùbá tó ṣe déédéé jù láti sọ agbára tàbí àǹfààní láti ṣe ohun kan.
- source_word: δῆσαι
  choice: dè é
  rationale: ‘Dè’ túmọ̀ sí fífi okùn tàbí ẹ̀wọ̀n mú ẹni kan, ó sì pa ìtumọ̀ ìdènà ara tí ọ̀rọ̀ Gíríìkì ní mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘ń gbé’ dípò gbólóhùn líle bí ‘ó ní ibùgbé,’ àti ‘tó’ gẹ́gẹ́ bí ìsọdipúpọ̀ àdánidá nínú ìtàn.
