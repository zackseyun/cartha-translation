source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀ ni ìsun ẹ̀jẹ̀ rẹ̀ gbẹ[a], ó sì mọ̀ nínú ara rẹ̀ pé a ti mú un láradá kúrò nínú ìpọ́njú náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣàn ẹ̀jẹ̀ rẹ̀ dá.” Gíríìkì lo àwòrán alágbára ti ìsun tàbí orísun.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kúrò nínú ìyọnu náà” tàbí “kúrò lọ́wọ́ pàṣán náà.” Níhìn-ín ọ̀rọ̀ náà ń tọ́ka sí ìpọ́njú ìlera tó ń dá a lóró.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti ìṣẹ̀lẹ̀ ojijì tí Máàkù tẹnumọ́ hàn ní Yorùbá àdánidá.
- source_word: ἐξηράνθη
  choice: gbẹ
  rationale: Ó pa àwòrán gidi ti ohun tí ó gbẹ mọ́, dípò ṣíṣe àlàyé rẹ̀ nìkan gẹ́gẹ́ bí ohun tí ó dáwọ́ dúró.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: ìsun ẹ̀jẹ̀ rẹ̀
  rationale: “Ìsun” pa àwòrán πηγή gẹ́gẹ́ bí orísun tàbí ibi tí ohun ti ń ṣàn jáde mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí ẹ̀jẹ̀ dídà rẹ̀.
- source_word: ἔγνω τῷ σώματι
  choice: ó mọ̀ nínú ara rẹ̀
  rationale: Ó pa ìtumọ̀ ìmọ̀ tàbí ìdánilójú mọ́, ó sì tún fi hàn pé inú ara rẹ̀ ni ó ti mọ ohun tí ó ṣẹlẹ̀.
- source_word: ἴαται
  choice: a ti mú òun láradá
  rationale: Ìlò “ti” fi hàn pé ìwòsàn náà ti ṣẹlẹ̀ tán, àbájáde rẹ̀ sì dúró, gẹ́gẹ́ bí perfect Gíríìkì.
- source_word: ἀπὸ τῆς μάστιγος
  choice: kúrò nínú ìpọ́njú náà
  rationale: Nínú àyíká yìí μάστιξ kì í ṣe pàṣán gidi, bí kò ṣe àìsàn tó ń dáni lóró; “ìpọ́njú” sọ ìrora líle náà ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Irú ìwòsàn tí gbólóhùn náà ń sọ
  choice: A ṣe àpèjúwe ìwòsàn ara gidi tí ó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀, pẹ̀lú bí obìnrin náà ṣe mọ̀ ọ́ nínú ara rẹ̀.
  alternative: Kí a túmọ̀ ọ́ bí ìmọ̀lára obìnrin náà nìkan, láìjẹ́rìí sí ìwòsàn gidi.
  rationale: 'Gíríìkì sọ méjèèjì: ẹ̀jẹ̀ náà gbẹ ní ti gidi, obìnrin náà sì mọ̀ pé a ti mú un láradá. A kò fi àlàyé míì kún ọ̀nà tàbí orísun ìwòsàn náà.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “òun” nínú gbólóhùn abẹ́ láti yà ẹni tí a mú láradá sọ́tọ̀ gedegbe; àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
