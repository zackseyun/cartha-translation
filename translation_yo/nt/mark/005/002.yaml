source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: yo
  text: Nígbà tí ó sì jáde kúrò nínú ọkọ̀ ojú omi, lẹ́sẹ̀kẹsẹ̀ ọkùnrin kan tí ó ní ẹ̀mí àìmọ́[a] jáde láti inú àwọn ibojì wá pàdé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ẹ̀mí àìmọ́ ń gbé inú rẹ̀.” Ní ti gidi, èdè Gíríìkì sọ pé, “nínú/pẹ̀lú ẹ̀mí àìmọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: nígbà tí ó jáde
  rationale: Ọ̀rọ̀ àkókò yìí túmọ̀ aorist participle náà lọ́nà Yorùbá àdánidá, láìfi dandan sọ bóyá ìpàdé náà ṣẹlẹ̀ nígbà tó ń jáde tàbí lẹ́yìn tó jáde tán.
- source_word: πλοίου
  choice: ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ọkọ̀ kékeré tí a ń rìn lórí omi, ó sì bá àyíká Òkun Gálílì mu.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára àti ìmúnilára àmì ìtàn tí Máàkù sábà máa ń lò mọ́.
- source_word: ὑπήντησεν αὐτῷ
  choice: wá pàdé rẹ̀
  rationale: Ó sọ ìṣípò ènìyàn náà sí ọ̀dọ̀ Jésù àti ète ìṣípò náà ní Yorùbá tó ṣe àdánidá.
- source_word: ἐκ τῶν μνημείων
  choice: láti inú àwọn ibojì
  rationale: μνημεῖον tọ́ka sí ibojì tàbí ibi ìsìnkú; ‘àwọn ibojì’ ṣe kedere, ‘láti inú’ sì pa ìtumọ̀ ἐκ mọ́.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ náà jẹ́ akọ ní gírámà, àyíká ìtàn náà sì ń tọ́ka sí ọkùnrin pàtó kan.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: tí ó ní ẹ̀mí àìmọ́
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìbáṣepọ̀ tàbí ipò tí èdè Gíríìkì sọ, láìfikún ìtumọ̀ tó lágbára jù bí ‘ẹ̀mí àìmọ́ ń gbé inú rẹ̀’.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ nípa ìpọ́njú ẹ̀mí èṣù
  choice: tí ó ní ẹ̀mí àìmọ́
  alternative: ẹni tí ẹ̀mí àìmọ́ ń gbé inú rẹ̀
  rationale: Gíríìkì sọ ní tààràtà pé ‘nínú/pẹ̀lú ẹ̀mí àìmọ́.’ Ìtumọ̀ yìí pa ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, ó sì yẹra fún fífi àlàyé ẹ̀kọ́ nípa bí ẹ̀mí náà ṣe ń darí ọkùnrin náà kún ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa, olóhùn pípé níbi tó yẹ, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá. A lo ‘ọkọ̀ ojú omi’ àti ‘ibojì’ gẹ́gẹ́ bí ọ̀rọ̀ òde òní tí òǹkàwé gbogbo lè lóye; a sì pa ìyára ìtàn Máàkù mọ́ pẹ̀lú ‘lẹ́sẹ̀kẹsẹ̀.’
