source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: yo
  text: Nígbà tí ó sì wọlé, ó wí fún wọn pé, “Èé ṣe tí ẹ fi ń pariwo, tí ẹ sì ń sọkún? Ọmọ náà kò kú, ṣùgbọ́n ó ń sùn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Ọmọ náà kò kú, ṣùgbọ́n ó sùn.” Ó ṣeé ṣe kí Jésù lo “sùn” gẹ́gẹ́ bí àpẹẹrẹ ikú ní ìmọ́lẹ̀ ìjíǹde tó ń bọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Nígbà tí ó sì wọlé
  rationale: Aorist participle náà tọ́ka sí wíwọlé tí ó bá ọ̀rọ̀-ìṣe pàtàkì náà lọ; gbólóhùn yìí jẹ́ Yorùbá àdánidá láì fi ìtẹnumọ́ àkókò tí kò pọndandan kún un.
- source_word: λέγει
  choice: ó wí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, ìtàn Yorùbá máa ń lo ìṣe àtẹ̀yìnwá ní ti ẹ̀dá; “ó wí” tún jẹ́ èdè ọlọ́lá tó bá àsọyé taara mu.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú ìbéèrè yìí, Τί ní agbára ìtumọ̀ “kí ló dé/èé ṣe,” tí ó sì ń béèrè ìdí ìhùwàsí wọn.
- source_word: θορυβεῖσθε
  choice: ẹ fi ń pariwo
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ariwo tàbí rudurudu olóhùn; “pariwo” ṣe àfihàn apá ariwo náà ní Yorùbá tó ṣe kedere.
- source_word: κλαίετε
  choice: ẹ sì ń sọkún
  rationale: “Sọkún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ọlọ́lá fún ẹkún, láì sọ ọ́ di ẹkún àṣà pàtó.
- source_word: παιδίον
  choice: Ọmọ náà
  rationale: παιδίον jẹ́ “ọmọ” láì sọ akọ tàbí abo ní pàtó; àyíká mọ̀ pé ọmọbìnrin ni, ṣùgbọ́n a pa àìsọ-abo ọ̀rọ̀ ẹsẹ̀ yìí mọ́.
- source_word: οὐκ ἀπέθανεν
  choice: kò kú
  rationale: Aorist ἀπέθανεν sọ ìṣẹ̀lẹ̀ ikú; “kò kú” tẹ̀lé fọ́ọ̀mù ọ̀rọ̀-ìṣe náà ní ṣókí, ó sì jẹ́ Yorùbá àdánidá.
- source_word: καθεύδει
  choice: ó ń sùn ni
  rationale: Present καθεύδει ni a mú wá pẹ̀lú àmì ìṣe tí ń lọ “ń”; “ni” tẹnumọ́ ìyàtọ̀ ἀλλά láàárín ikú àti oorun, ó sì pa àwòrán oorun mọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jésù jẹ́ kíkọ̀ pé ọmọ náà kú ní ti gidi tàbí lílo oorun gẹ́gẹ́ bí àpẹẹrẹ ikú ní ojú ìjíǹde tó ń bọ̀
  choice: A pa ọ̀rọ̀ náà mọ́ ní tààrà pé “Ọmọ náà kò kú, ó ń sùn ni.”
  alternative: “Ọmọ náà kò kú títí láé; ó dà bí ẹni tó ń sùn nítorí Jésù yóò jí i dìde.”
  rationale: Gíríìkì fi ìtakora náà hàn láì ṣàlàyé rẹ̀. Ìtumọ̀ náà kò yanjú bóyá ọ̀rọ̀ náà jẹ́ àpẹẹrẹ, ìfojúsọ́nà, tàbí kíkọ̀ ní ti gidi; àlàyé ìsàlẹ̀ ojú ewé nìkan ló tọ́ka sí àǹfààní ìtumọ̀ àpẹẹrẹ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “sọkún” dípò ọ̀rọ̀ tó lè fi ẹkún àṣà pàtó kún ẹsẹ̀ náà; a sì pa ìtakora láàárín “kò kú” àti “ń sùn” mọ́.
