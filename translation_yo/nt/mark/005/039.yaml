  to: Nígbà tí ó sì wọlé, ó wí fún wọn pé, “Èé ṣe tí ẹ fi ń pariwo, tí ẹ sì ń sọkún? Ọmọ náà kò kú, ṣùgbọ́n ó ń sùn.”[a]
  rationale: Àtúnṣe náà mú ìsopọ̀ ìtakora ἀλλά (‘ṣùgbọ́n’) hàn ní kedere. Ó tún yọ ‘kàn’ kúrò nínú àṣàyàn ìtumọ̀, nítorí pé ó ń fi ìdíwọ̀n tí kò sí nínú ìpilẹ̀ Gíríìkì kún un. A tún tún ìsàlẹ̀ ojú-ewé ṣe kí ó tọ́ka sí ìtumọ̀ àpẹẹrẹ pẹ̀lú ìṣọ́ra, láì sọ ìdí tàbí èrò Jésù ní ọ̀nà tó ju ẹsẹ̀ náà lọ.
