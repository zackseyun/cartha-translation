source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: yo
  text: Ó sì ń bẹ̀ ẹ́ gidigidi pé, “Ọmọbìnrin kékeré mi wà létí ikú. Jọ̀wọ́, wá gbé ọwọ́ rẹ lé e, kí ó lè gba là, kí ó sì yè.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλεῖ … πολλὰ
  choice: ń bẹ̀ ẹ́ gidigidi
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ẹ̀bẹ̀ kánjúkánjú àti tọkàntọkàn hàn; “ń bẹ̀ ẹ́ gidigidi” jẹ́ ọ̀nà Yorùbá àdánidá láti mú agbára ọ̀rọ̀ náà jáde.
- source_word: θυγάτριόν μου
  choice: Ọmọbìnrin mi kékeré
  rationale: “Kékeré” pa ìtumọ̀ ìfẹ́ni àti kékeré-ọjọ́ inú ọ̀rọ̀ arékérekè Gíríìkì mọ́.
- source_word: ἐσχάτως ἔχει
  choice: wà létí ikú
  rationale: Àkànlò èdè Gíríìkì náà túmọ̀ sí pé ipò rẹ ti le dé etí ikú; àkànlò Yorùbá yìí ṣe àfihàn ìkánjú náà ní ṣókí.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Jọ̀wọ́ wá gbé ọwọ́ rẹ méjèèjì lé e
  rationale: Èyí sọ ìbéèrè náà ní Yorùbá àdánidá, ó sì pa ọ̀pọ̀ “ọwọ́” inú Gíríìkì mọ́ nípa “méjèèjì.”
- source_word: σωθῇ
  choice: kí a lè gbà á là
  rationale: σῴζω lè túmọ̀ sí gbígbà là tàbí mímú láradá. “Gbà á là” pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ náà mọ́, nígbà tí àyíká fi hàn pé ìwòsàn ara ni ó wà lọ́kàn.
- source_word: ζήσῃ
  choice: kí ó sì yè
  rationale: “Yè” sọ ìtumọ̀ ìwàláàyè lẹ́yìn ìgbàlà tàbí ìwòsàn náà ní kedere.
theological_decisions:
- issue: Ìtumọ̀ σωθῇ nínú àyíká ìwòsàn
  choice: kí a lè gbà á là
  alternative: kí ara rẹ̀ lè dá; kí ó lè rí ìwòsàn
  rationale: Àyíká náà tọ́ka sí ìwòsàn ara, ṣùgbọ́n ọ̀rọ̀ Gíríìkì ní ìtumọ̀ tó gbòòrò ju ìwòsàn nìkan lọ. Ìtumọ̀ pàtàkì pa fífẹ̀ yẹn mọ́, àlàyé ìsàlẹ̀ sì fi àwọn ìtumọ̀ tó bá àyíká mu hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “létí ikú” gẹ́gẹ́ bí àkànlò èdè àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
