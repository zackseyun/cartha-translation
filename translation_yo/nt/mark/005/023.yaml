  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìbéèrè ọlọ́kànkàn, ipò ọmọ náà ní etí ikú, ìfọwọ́kan ọwọ́, àti ète pé kí ó gba là kí ó sì yè. Síbẹ̀, “kí a lè gbà á là” yí gbolohun aláìṣiṣẹ́ (passive) Gíríìkì padà sí ìṣe ẹni-akọ́kọ́ púpọ̀, ó sì lè jẹ́ kí Jairu ara rẹ̀ dà bí ẹni tí ó ń ṣe ìgbàlà náà. “Kí ó lè gba là” dá ìtumọ̀ náà padà sí ọmọbìnrin náà, ó sì pa ìfọ̀rọ̀wérọ̀ gbígbà-là/ìwòsàn mọ́.
  naturalness: “Ọmọbìnrin kékeré mi” jẹ́ títò ọ̀rọ̀ tó rọrùn ju “Ọmọbìnrin mi kékeré” lọ nínú Yorùbá ìgbàlódé. “Wá gbé ọwọ́ rẹ lé e” jẹ́ àdánidá; fífi “méjèèjì” kún un ń fi ìtẹnumọ́ ‘ọwọ́ méjèèjì’ sórí ọ̀rọ̀ náà, níbi tí ọ̀pọ̀ ọwọ́ Gíríìkì kò ti béèrè ìtẹnumọ́ bẹ́ẹ̀.
