source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù, nígbà tí ó gbọ́ ọ̀rọ̀ tí wọ́n ń sọ[a], sọ fún olórí sínágọ́gù náà pé, “Má bẹ̀rù; kàn gbàgbọ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “nígbà tí Jésù kọbi ara sí ohun tí wọ́n sọ,” bí a bá ka παρακούσας sí pé ó kọ̀ láti tẹ̀ lé ìròyìn náà dípò pé ó gbọ́ ọ̀rọ̀ náà.
    reason: alternative_reading
  - marker: b
    text: Ó tún lè jẹ́, “kàn ní ìgbàgbọ́” tàbí “kàn ní ìgbẹ́kẹ̀lé.” Ọ̀rọ̀-ìṣe Gíríìkì náà ni πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: nígbà tí ó gbọ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé Jésù gbọ́ ohun tí wọ́n ń sọ tàbí pé kò ka ohun tí wọ́n sọ sí. Nínú ìṣàn ìtàn yìí, pé ó gbọ́ ọ̀rọ̀ náà dára jù, nítorí lẹ́sẹ̀kẹsẹ̀ ni ó bá olórí sínágọ́gù náà sọ̀rọ̀.
- source_word: τὸν λόγον λαλούμενον
  choice: ọ̀rọ̀ tí wọ́n ń sọ
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó sì pa ìtumọ̀ gbólóhùn Gíríìkì náà mọ́, láì sọ ó di ‘ìròyìn’ ní pàtó ju orísun lọ.
- source_word: λέγει
  choice: sọ fún
  rationale: ‘Sọ fún’ ṣe àfihàn ẹni tí Jésù ń bá sọ̀rọ̀ ní Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí inú ìtàn, Yorùbá kì í nílò àmì àsìkò míràn níbi yìí.
- source_word: ἀρχισυναγώγῳ
  choice: olórí sínágọ́gù
  rationale: Èyí ṣàlàyé ipò ẹni tí ń darí tàbí bójú tó sínágọ́gù ní èdè Yorùbá òde òní.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Àṣẹ òdì yìí ṣe àfihàn ìtùnú àti ìkìlọ̀ Jésù ní ṣókí, Yorùbá àdánidá.
- source_word: μόνον πίστευε
  choice: kàn gbàgbọ́
  rationale: ‘Kàn’ pa agbára ìdíwọ̀ μόνον mọ́, ‘gbàgbọ́’ sì jẹ́ ìtumọ̀ tààrà fún πίστευε. Gbólóhùn náà jẹ́ àṣẹ tí ó hàn gbangba, tí ó sì lè ní ìtumọ̀ pé kí ó máa bá a lọ ní gbígbàgbọ́.
theological_decisions:
- issue: Agbára ìtumọ̀ παρακούσας
  choice: Jésù gbọ́ ọ̀rọ̀ tí wọ́n ń sọ.
  alternative: Jésù kọbi ara sí ohun tí wọ́n sọ, tàbí kò tẹ̀ lé e.
  rationale: Ìtumọ̀ méjèèjì ṣeé ṣe nípa ọ̀rọ̀ Gíríìkì. Ìṣètò gbólóhùn àti ìdáhùn Jésù lẹ́sẹ̀kẹsẹ̀ ti ìròyìn náà mú kí ‘gbọ́’ bá ọ̀rọ̀ mu dáadáa; àmọ́ a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πίστευε nínú àṣẹ Jésù
  choice: gbàgbọ́
  alternative: ní ìgbàgbọ́; gbẹ́kẹ̀ lé
  rationale: ‘Gbàgbọ́’ ni ìbámu tààrà àti àdánidá jù lọ fún ọ̀rọ̀-ìṣe náà ní Yorùbá. ‘Gbẹ́kẹ̀ lé’ lè tẹnu mọ́ ìgbẹ́kẹ̀lé, ṣùgbọ́n kò yẹ kí a fi ìtumọ̀ yẹn nìkan dí gbogbo ààyè ọ̀rọ̀ Gíríìkì náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ tí a ti gba wọlé, a sì fi àmì ohùn sí i. Gbólóhùn ‘kàn gbàgbọ́’ jẹ́ àdánidá, ṣókí, ó sì pa ìtẹnumọ́ μόνον mọ́.
