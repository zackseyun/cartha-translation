  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà fara mọ́ Gíríìkì: παρακούσας ni a túmọ̀ sí ‘gbọ́,’ τὸν λόγον λαλούμενον sí ‘ọ̀rọ̀ tí wọ́n ń sọ,’ ἀρχισυναγώγῳ sí ‘olórí sínágọ́gù náà,’ àti μόνον πίστευε sí ‘kàn gbàgbọ́.’ Àìpéye kékeré kan wà nínú àlàyé ìsàlẹ̀ b: ‘gbẹ́kẹ̀ lé e’ fi kókó-ọrọ̀ kan (‘e’) kún un, nígbà tí πίστευε nínú ẹsẹ̀ yìí kò ní kókó-ọrọ̀ tí a sọ ní kedere.'
