reference: Mark 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: yo
  text: Kò gbà á láyè, ṣùgbọ́n ó wí fún un pé, “Lọ sí ilé rẹ, lọ sọ́dọ̀ àwọn tìrẹ, kí o sì ròyìn fún wọn gbogbo ohun tí Olúwa ṣe fún ọ àti bí ó ti ṣàánú rẹ.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ‘sí àwọn tìrẹ.’ Ọ̀rọ̀ náà lè tọ́ka sí àwọn ará ilé, ìbátan, àti àwọn ẹni tímọ́tímọ́ mìíràn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lóye ‘Olúwa’ níbí gẹ́gẹ́ bí Ọlọ́run ní pàtó; àwọn mìíràn rí i pé Máàkù mọ̀ọ́mọ̀ pa ìsopọ̀ mọ́ láàárín àánú Ọlọ́run àti iṣẹ́ àti àṣẹ Jésù fúnra rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: kò gbà á láyè
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀφίημι túmọ̀ sí fífúnni láyè, kì í ṣe dídáríjì tàbí fífi sílẹ̀. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá èdè ìsinsìnyí mu.
- source_word: λέγει αὐτῷ
  choice: ó wí fún un
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí nínú ìtàn, àsìkò àtijọ́ ni Yorùbá ìtàn àdánidá ń lò níbí.
- source_word: Ὕπαγε
  choice: Lọ
  rationale: Ọ̀rọ̀ àṣẹ náà ń sọ pé kí ẹni náà lọ sí ibi tí a dárúkọ; ‘Lọ’ ni ọ̀rọ̀ Yorùbá tó rọrùn jù, tó sì péye.
- source_word: εἰς τὸν οἶκόν σου
  choice: sí ilé rẹ
  rationale: οἶκος lè túmọ̀ sí ilé tàbí agbo ilé; ‘sí ilé rẹ’ jẹ́ ọ̀nà àdánidá láti sọ pé kó padà sí àyíká ilé tirẹ̀.
- source_word: πρὸς τοὺς σούς
  choice: sọ́dọ̀ àwọn ará rẹ
  rationale: Ọ̀rọ̀ náà ní ti gidi ni ‘sọ́dọ̀ àwọn tirẹ̀.’ ‘Àwọn ará rẹ’ ní Yorùbá lè gba ẹbí, ìbátan àti àwọn ẹni tímọ́tímọ́, láì fi ìtumọ̀ náà mọ́ ẹbí nìkan.
- source_word: ἀπάγγειλον
  choice: ròyìn
  rationale: ἀπαγγέλλω túmọ̀ sí jíjẹ́ kí àwọn ẹlòmíràn mọ ohun tó ṣẹlẹ̀ tàbí fífi ìròyìn rẹ̀ fún wọn. ‘Ròyìn’ pa ìtumọ̀ yìí mọ́.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ní ìsopọ̀ yìí, ὅσα ń tọ́ka sí gbogbo ohun tí a ṣe. ‘Gbogbo ohun tí’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì dá ìwọ̀n ohun tí Olúwa ṣe dúró.
- source_word: ὁ κύριός σοι πεποίηκεν
  choice: Olúwa ṣe fún ọ
  rationale: Dátífù σοι ní ìbáṣepọ̀ pẹ̀lú ọ̀rọ̀-ìṣe, ó sì túmọ̀ sí ‘fún ọ.’ A pa κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa’ láì fi ‘Ọlọ́run’ rọ́pò rẹ̀.
- source_word: ἠλέησέν σε
  choice: bí ó ti ṣàánú rẹ
  rationale: ἐλεάω ń sọ nípa fífi àánú hàn. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ọ̀rọ̀ àánú mọ́.
theological_decisions:
- issue: Ta ni κύριος (‘Olúwa’) ń tọ́ka sí níbi tí Jésù ti sọ ohun tí Olúwa ṣe?
  choice: Olúwa
  alternative: Ọlọ́run; ọ̀gá
  rationale: ‘Olúwa’ pa ọ̀rọ̀ Gíríìkì àti ìṣòro ìtumọ̀ inú àyíká náà mọ́. Ó lè tọ́ka sí Ọlọ́run ní pàtó, ṣùgbọ́n Máàkù tún lè ń so àánú Ọlọ́run pọ̀ mọ́ iṣẹ́ àti àṣẹ Jésù. Kí a má bàa dá ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà yanjú fún òǹkàwé, a kò fi ‘Ọlọ́run’ rọ́pò rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘wí’ fún ìtàn mímọ́ ní ìforúkọsílẹ̀ tó ga díẹ̀, ṣùgbọ́n gbogbo gbólóhùn náà ṣì jẹ́ ti ẹ̀dá. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé ní àpapọ̀.
