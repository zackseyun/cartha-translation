source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: yo
  text: Bí ó sì ṣe ń wọ inú ọkọ̀ ojú omi, ọkùnrin tí ó ti ní ẹ̀mí èṣù[a] ń bẹ̀ ẹ́ léraléra pé kí òun lè wà pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin tí ẹ̀mí èṣù ti wọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: nígbà tí ó … ń wọ inú
  rationale: Ìsọ̀rọ̀ alábápín ọ̀rọ̀ ìṣe ti àkókò ìsinsìnyí fi hàn pé wíwọ ọkọ̀ náà ń lọ lọ́wọ́ ní àkókò tí ọkùnrin náà ń bẹ̀ ẹ́; “nígbà tí … ń wọ” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Nínú àyíká Òkun Gálílì, “ọkọ̀ ojú omi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì mú kí a ronú nípa ọkọ̀ òkun ńlá.
- source_word: παρεκάλει
  choice: ń bẹ̀ ẹ́ léraléra
  rationale: Ọ̀rọ̀ ìṣe aláìpé náà ń tọ́ka sí ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra; ìtumọ̀ yìí tún pa ìtara ẹ̀bẹ̀ náà mọ́.
- source_word: ὁ δαιμονισθείς
  choice: ọkùnrin tí ó ti ní ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ alábápín tí a lò gẹ́gẹ́ bí orúkọ ń tọ́ka sí ọkùnrin tí ẹ̀mí èṣù ti ń pọ́n lójú ṣáájú, ṣùgbọ́n tí a ti dá sílẹ̀ báyìí. “Tí ó ti ní” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ipò rẹ̀ tẹ́lẹ̀ hàn láì sọ pé ó ṣì wà nínú ipò náà.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: pé kí òun lè wà pẹ̀lú rẹ̀
  rationale: “Pé kí … lè” pa ìṣètò gbólóhùn ἵνα mọ́, “wà pẹ̀lú rẹ̀” sì pa ìtumọ̀ ìbáṣepọ̀ ti μετ’ αὐτοῦ mọ́ láì dín un kù sí kíkàn bá a rìnrìn-àjò.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δαιμονισθείς láì sọ ọ́ di àìsàn lásán tàbí fi ẹ̀kọ́ ìsìn kan kún un
  choice: ọkùnrin tí ó ti ní ẹ̀mí èṣù
  alternative: ọkùnrin tí ẹ̀mí èṣù ti tẹ̀ mọ́lẹ̀
  rationale: Àṣàyàn náà fi ìpọ́njú ẹ̀mí èṣù gidi tí ìtàn náà sọ hàn, ó sì mú un ṣe kedere pé ó jẹ́ ipò ọkùnrin náà tẹ́lẹ̀. Kò fi èrò ìṣègùn tàbí ìtumọ̀ àpẹẹrẹ rọ́pò ohun tí ọ̀rọ̀ Gíríìkì sọ.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. “Òun” nínú gbólóhùn ìkẹyìn ń tọ́ka sí ọkùnrin náà, “rẹ̀” sì ń tọ́ka sí ẹni tó ń wọ ọkọ̀; èyí pa ìyàtọ̀ àwọn ẹni inú ọ̀rọ̀ mọ́ lọ́nà àdánidá.
