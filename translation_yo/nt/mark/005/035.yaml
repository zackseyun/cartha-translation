id: MRK.5.35
reference: Mark 5:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀, àwọn ènìyàn kan wá láti ilé olórí sínágọ́gù[b], wọ́n ní, “Ọmọbìnrin rẹ ti kú. Kí nìdí tí o fi ṣì ń yọ Olùkọ́ náà[a] lẹ́nu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dá Olùkọ́ náà láàmú.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “láti ọ̀dọ̀ olórí sínágọ́gù.” Àyíká ìtàn fi hàn pé ilé tàbí agbo ilé rẹ̀ ni a ń tọ́ka sí.
    reason: previous_rendering
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Nígbà tí ó ṣì ń sọ̀rọ̀ lọ́wọ́
  rationale: Ó fi hàn pé ọ̀rọ̀ tí ó ń sọ ṣì ń lọ ní àkókò tí àwọn mìíràn dé; èyí jẹ́ ọ̀nà Yorùbá àdánidá fún genitive absolute náà.
- source_word: ἔρχονται
  choice: àwọn ènìyàn kan wá
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ historical present, ṣùgbọ́n Yorùbá ìtàn máa ń lo ‘wá’ ní ti ara; a fi ‘àwọn ènìyàn kan’ kún un gẹ́gẹ́ bí olùṣe tí ọ̀pọ̀ nínú participle λέγοντες fi hàn.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: láti ilé olórí sínágọ́gù
  rationale: Ní àyíká ìtàn náà, àwọn aṣojú náà wá láti ilé tàbí agbo ilé olórí sínágọ́gù, nítorí olórí náà fúnra rẹ̀ wà pẹ̀lú Jésù. A tọ́ka sí ìtumọ̀ gangan nínú àlàyé ìsàlẹ̀.
- source_word: λέγοντες ὅτι
  choice: wọ́n ní
  rationale: Ọ̀nà Yorùbá tó rọrùn, tó sì jẹ́ àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tààrà ni ‘wọ́n ní’.
- source_word: Ἡ θυγάτηρ σου
  choice: Ọmọbìnrin rẹ
  rationale: Ó túmọ̀ gbólóhùn ohun-ìní náà ní tààrà, láìsí àìdánilójú.
- source_word: ἀπέθανεν
  choice: ti kú
  rationale: ‘Ti kú’ fi ìṣẹ̀lẹ̀ tí ó ti parí àti ipa rẹ̀ ní àkókò yẹn hàn ní Yorùbá àdánidá.
- source_word: τί ἔτι
  choice: Èé ṣe tí o tún ... mọ́?
  rationale: Àpapọ̀ ‘tún’ àti ‘mọ́’ mú ìtumọ̀ ṣíṣe ohun kan síwájú tàbí pẹ́ ju àkókò yìí lọ jáde.
- source_word: σκύλλεις
  choice: ń yọ ... lẹ́nu
  rationale: Nínú àyíká yìí, ó túmọ̀ sí dídá ẹnì kan láàmú tàbí fífi ẹrù ìbéèrè kàn án; ‘yọ ... lẹ́nu’ jẹ́ Yorùbá tó wọ́pọ̀, tó sì bá ohùn ọ̀rọ̀ náà mu.
- source_word: τὸν διδάσκαλον
  choice: Olùkọ́ náà
  rationale: ‘Olùkọ́’ ni ìtumọ̀ διδάσκαλος, ‘náà’ sì pa definite article mọ́ láìfi ìtumọ̀ àṣẹ tàbí ẹ̀kọ́ ìgbàgbọ́ míì kún un.
theological_decisions:
- issue: Ẹni tí àkọ́lé ‘Olùkọ́ náà’ ń tọ́ka sí
  choice: A tú διδάσκαλον sí ‘Olùkọ́ náà,’ tí ó ń tọ́ka sí Jésù láìrọ́pò àkọ́lé náà pẹ̀lú orúkọ rẹ̀.
  alternative: ‘Ọ̀gá náà’ tàbí ‘Jésù’
  rationale: Gíríìkì lo àkọ́lé, kì í ṣe orúkọ. Ìtumọ̀ yìí pa ojú-ìwòye àwọn olùsọ̀rọ̀ náà mọ́, kò sì fi ìjẹ́wọ́ nípa ẹni tí Kristi jẹ́ tí kò hàn gbangba nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Sínágọ́gù’ pa orúkọ ilé ìjọsìn Júù mọ́, ‘olórí’ sì yẹra fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
