- from: Nígbà tí ó ṣì ń sọ̀rọ̀ lọ́wọ́, àwọn ènìyàn kan wá láti ilé olórí sínágọ́gù[b], wọ́n ní, “Ọmọbìnrin rẹ ti kú. Èé ṣe tí o tún fi ń yọ Olùkọ́ náà[a] lẹ́nu mọ́?”
  to: Nígbà tí ó ṣì ń sọ̀rọ̀, àwọn ènìyàn kan wá láti ilé olórí sínágọ́gù[b], wọ́n ní, “Ọmọbìnrin rẹ ti kú. Kí nìdí tí o fi ṣì ń yọ Olùkọ́ náà[a] lẹ́nu?”
  rationale: Àtúnṣe náà jẹ́ ti ìrọ̀rùn àti ìmúlò Yorùbá nìkan. Ó yọ ‘lọ́wọ́’ tí kò pọndandan kúrò, ó sì lo ‘ṣì’ láti tú ἔτι ní ọ̀nà tó kedere. Kò yí ìtumọ̀, ìforúkọsílẹ̀, tàbí ìtọ́kasí àlàyé ìsàlẹ̀ padà.
