id: MRK.5.41
reference: Mark 5:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: yo
  text: Ó sì di ọwọ́ ọmọ náà mú, ó sì wí fún un pé, “Talita kúm,” èyí tí ìtumọ̀ rẹ̀ jẹ́, “Ọmọbìnrin kékeré, mo wí fún ọ, dìde.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: Ó sì di ọwọ́ ọmọ náà mú
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jesu mú ọwọ́ ọmọ náà. ‘Di ... mú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ọwọ́ mú ohun kan, láìfi agbára tó wà nínú ‘gbá mú’ tàbí ‘já mú’ kún ọ̀rọ̀ náà.
- source_word: λέγει αὐτῇ
  choice: ó sì wí fún un
  rationale: A lo ‘wí’ láti pa ìrísí ìtàn ọlọ́lá mọ́. Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí gẹ́gẹ́ bí historical present, Yorùbá kò fi àmì àsìkò sí ọ̀rọ̀-ìṣe ní ọ̀nà kan náà; àgbékalẹ̀ yìí sì bá ìtàn tó ń lọ mu.
- source_word: Ταλιθα κουμ
  choice: Talita kúm
  rationale: A pa gbólóhùn Árámáíkì tí Gíríìkì náà tọ́jú mọ́ ní ìkọlélórí Yorùbá, kí ìtumọ̀ Máàkù tó tẹ̀ lé e lè ṣàlàyé rẹ̀. ‘Kúm’ tẹ̀ lé κουμ nínú ẹ̀dà SBLGNT.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: èyí tí ìtumọ̀ rẹ̀ jẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti fi hàn pé òǹkọ̀wé ń túmọ̀ gbólóhùn èdè mìíràn.
- source_word: Τὸ κοράσιον
  choice: Ọmọbìnrin kékeré
  rationale: κοράσιον tọ́ka sí ọmọbìnrin ọ̀dọ́, ó sì ní ìrísí ìfẹ́ni tàbí kékeré. ‘Ọmọbìnrin kékeré’ mú ìtumọ̀ méjèèjì jáde lọ́nà tó yé ẹni gbogbo.
- source_word: σοὶ λέγω
  choice: mo wí fún ọ
  rationale: A pa gbólóhùn tó ṣe pàtó yìí mọ́ dípò kí a yọ ọ́ sílẹ̀ bí ohun àsọtúnṣe; ó fi hàn pé àṣẹ náà dojú kọ ọmọbìnrin náà gan-an.
- source_word: ἔγειρε
  choice: dìde
  rationale: ‘Dìde’ jẹ́ àṣẹ Yorùbá àdánidá fún jíjí tàbí gbígbé ara sókè ní àyíká yìí, ó sì bá ohun tó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ nínú ìtàn mu.
theological_decisions:
- issue: Pípa ọ̀rọ̀ Árámáíkì Jesu mọ́ nínú ẹsẹ̀ náà
  choice: A fi ‘Talita kúm’ sílẹ̀, a sì tẹ̀ lé e pẹ̀lú ìtumọ̀ Máàkù fúnra rẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ nìkan sí ‘Ọmọbìnrin kékeré, mo wí fún ọ, dìde,’ tàbí kí a lo ìkọlélórí àṣà ‘Talita kum/cum.’
  rationale: Orísun Gíríìkì fúnra rẹ̀ pa ọ̀rọ̀ Semitic náà mọ́, ó sì túmọ̀ rẹ̀ lẹ́yìn náà. Pípa méjèèjì mọ́ bọ̀wọ̀ fún àgbékalẹ̀ àti ìtẹnumọ́ orísun náà láìṣókùnkùn ìtumọ̀ rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó ṣe kedere fún òǹkàwé gbogbogbò ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘ọmọ náà’ fún παιδίον, lẹ́yìn náà ‘ọmọbìnrin kékeré’ fún κοράσιον, kí ìlọsíwájú ọ̀rọ̀ inú orísun má bàjẹ́. Kò sí àmì àlàyé ìsàlẹ̀ nínú ọ̀rọ̀ àkọ́kọ́ nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè nípa ‘Talitha cum/koum’ kò bá àmì [a] tó wà lẹ́yìn ‘hand’ mu, ìyàtọ̀ ìkọlélórí náà sì lè mú wa ṣìnà nínú ẹ̀dà Yorùbá.
