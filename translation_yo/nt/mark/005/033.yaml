  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: yo
  text: Ṣùgbọ́n obìnrin náà, pẹ̀lú ìbẹ̀rù àti ìwárìrì,[a] ní mímọ̀ ohun tí ó ṣẹlẹ̀ sí i, ó wá, ó sì wólẹ̀ níwájú rẹ̀,[b] ó sì sọ gbogbo òtítọ́ fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rù ń bà á, ó sì ń wárìrì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó dojú bolẹ̀ níwájú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré tàbí ìlọsíwájú ìtàn hàn láàárín ìbéèrè Jésù àti ìdáhùn obìnrin náà.
- source_word: ἡ γυνὴ
  choice: obìnrin náà
  rationale: Àyíká ọ̀rọ̀ fi hàn pé obìnrin tí a ti mẹ́nu kàn tẹ́lẹ̀ ni.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: pẹ̀lú ìbẹ̀rù àti ìwárìrì
  rationale: Ó pa àwọn ìmọ̀lára méjèèjì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó lọ́nà àdánidá láìsọ ohun tí ó fa ìbẹ̀rù náà kún un.
- source_word: εἰδυῖα
  choice: ní mímọ
  rationale: Ó pa ìṣe alábápín mọ́, bẹ́ẹ̀ ni kò sọ ní pàtó pé mímọ̀ náà ni ó fa ohun tí ó tẹ̀ lé e.
- source_word: ὃ γέγονεν αὐτῇ
  choice: ohun tí ó ṣẹlẹ̀ sí i
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrírí ìwòsàn tí ó dé bá a.
- source_word: ἦλθεν
  choice: ó wá
  rationale: Ó túmọ̀ ìṣe ìtàn náà ní tààrà láìfi ìtumọ̀ mìíràn kún un.
- source_word: προσέπεσεν αὐτῷ
  choice: ó wólẹ̀ níwájú rẹ̀
  rationale: Ó fi ìṣubú sílẹ̀ níwájú Jésù hàn láìdájọ́ pé ìjọsìn ní pàtó ni ìṣe náà túmọ̀ sí.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: ó sọ gbogbo òtítọ́ fún un
  rationale: Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì mú ìtẹnumọ́ πᾶσαν pé kò fi ohunkóhun pamọ́ hàn.
theological_decisions:
- issue: Ìdúró ara obìnrin náà ní προσέπεσεν αὐτῷ
  choice: ó wólẹ̀ níwájú rẹ̀
  alternative: ó dojú bolẹ̀ níwájú rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí wíwólẹ̀ níwájú ẹnì kan nítorí ọ̀wọ̀, ìpọ́njú, tàbí ẹ̀bẹ̀. A kò fi ìtumọ̀ ìjọsìn tí ó lágbára ju ohun tí ẹsẹ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa ìbáṣepọ̀ alábápín inú Gíríìkì mọ́ ní ‘ní mímọ,’ kí a má bàa sọ ọ́ di ìdí pàtó. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
