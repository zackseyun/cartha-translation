  to: Lẹ́sẹ̀kẹsẹ̀, Jésù mọ̀ nínú ara rẹ̀ pé agbára ti jáde lára òun. Ó yíjú padà láàárín ọ̀pọ̀ ènìyàn náà, ó sì wí pé, “Ta ni ó fọwọ́ kan aṣọ mi[a]?”
  rationale: 'Àtúnṣe kékeré kan ṣoṣo ni a ṣe: a rọ́pò “ó sì béèrè pé” pẹ̀lú “ó sì wí pé” kí ìtumọ̀ náà lè faramọ́ ἔλεγεν (“ó wí/sọ pé”) dáadáa, láì yí ìtumọ̀ ìbéèrè Jésù padà. A pa ìyókù ìtumọ̀ àti àlàyé abẹ́lẹ̀ mọ́.'
