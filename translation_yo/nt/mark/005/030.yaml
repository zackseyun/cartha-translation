source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, Jésù mọ̀ nínú ara rẹ̀ pé agbára ti jáde lára òun. Ó yíjú padà láàárín ọ̀pọ̀ ènìyàn náà, ó sì wí pé, “Ta ni ó fọwọ́ kan aṣọ mi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀wù mi.”
    reason: Àwọn ọ̀rọ̀ ἱματίων jẹ́ ọ̀pọ̀, ó sì lè túmọ̀ sí aṣọ tàbí àwọn ẹ̀wù; ọ̀rọ̀ inú ẹsẹ̀ lo “aṣọ” gẹ́gẹ́ bí orúkọ àkójọpọ̀ tó bá èdè Yorùbá mu.
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìtàn Máàkù hàn ní èdè Yorùbá àdánidá.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: mọ̀ nínú ara rẹ̀
  rationale: Ó tọ́ka sí ìmọ̀ tí Jésù ní nínú ara rẹ̀, kì í ṣe ohun tí ó fi ojú rí.
- source_word: δύναμιν ἐξελθοῦσαν ἐξ αὐτοῦ
  choice: agbára ti jáde lára òun
  rationale: Ó pa ọ̀rọ̀ orísun mọ́ pé agbára jáde lára Jésù, láì fi àlàyé míràn kún irú agbára náà tàbí bí iṣẹ́ ìyanu náà ṣe ṣẹlẹ̀.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: Ó yíjú padà láàárín ọ̀pọ̀ ènìyàn náà
  rationale: Ó ṣe àfihàn ìyípadà ara Jésù ní ibi tí ọ̀pọ̀ ènìyàn wà yí i ká.
- source_word: ἥψατο τῶν ἱματίων
  choice: fọwọ́ kan aṣọ mi
  rationale: “Fọwọ́ kan” jẹ́ ọ̀nà Yorùbá àdánidá fún ìfọwọ́kàn; “aṣọ” lè dúró gẹ́gẹ́ bí orúkọ àkójọpọ̀ fún ἱμάτια.
theological_decisions:
- issue: Agbára tí ó jáde lára Jésù
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìṣẹ̀lẹ̀ gidi tí Jésù mọ̀ nínú ara rẹ̀.
  alternative: Ṣíṣe àlàyé rẹ̀ sí i gẹ́gẹ́ bí “agbára ìwòsàn” tàbí bí ìmọ̀lára lásán.
  rationale: Ọ̀rọ̀ Gíríìkì sọ “agbára” láì ṣàlàyé bí ó ṣe ṣiṣẹ́; ìtumọ̀ náà kò gbọ́dọ̀ dín ìṣẹ̀lẹ̀ náà kù tàbí fi ẹ̀kọ́ àfikún sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún olùkà òde òní.
