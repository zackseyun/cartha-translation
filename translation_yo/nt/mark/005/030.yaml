  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà mọ́ dáadáa: ìmọ̀ Jésù lẹ́sẹ̀kẹsẹ̀, agbára tí ó ti jáde lára rẹ̀, yíjú padà nínú ọ̀pọ̀ ènìyàn, àti ìbéèrè nípa aṣọ rẹ̀. Síbẹ̀, ἔλεγεν túmọ̀ sí “ó wí pé/ó sọ pé” níbí; “ó béèrè pé” jẹ́ ìtumọ̀ ìṣe tí ó lè yẹ nítorí ìbéèrè náà, ṣùgbọ́n ó dín ọ̀rọ̀ ìpilẹ̀ kù díẹ̀.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì ní àmì ohùn tó péye. “Ó sì wí pé” jẹ́ ọ̀nà tó rọrùn, tó sì sún mọ́ ọ̀rọ̀ orísun ju “ó sì béèrè pé” lọ. “Aṣọ mi” jẹ́ ìlò àkójọpọ̀ tí ó dára fún ἱματίων.
  terminology: “Agbára,” “fọwọ́ kan,” àti “aṣọ” bá ọ̀rọ̀ Gíríìkì àti ìforúkọsílẹ̀ inú ìtàn mu. Àlàyé abẹ́lẹ̀ náà ń ṣàlàyé yíyan nọ́ńbà ẹyọ gẹ́gẹ́ bí orúkọ àkójọpọ̀ láì sọ pé “aṣọ” nìkan ni ìtumọ̀ tó ṣeé ṣe.
