revisions:
- from: Ó sì ké sókè ní ohùn rara, ó wí pé, “Kí ni mo ní í ṣe pẹ̀lú rẹ[a], Jesu, Ọmọ Ọlọ́run Ọ̀gá Ògo? Mo fi Ọlọ́run rọ̀ ọ́[b], má ṣe dá mi lóró.”
  to: Ó sì kígbe ní ohùn rara, ó wí pé, “Kí ni mo ní í ṣe pẹ̀lú rẹ[a], Jésù, Ọmọ Ọlọ́run, Ẹni Gíga Jù Lọ? Mo fi Ọlọ́run bẹ̀ ọ́[b], má ṣe dá mi lóró.”
  rationale: The revision explicitly renders the Most High divine title, improves the idiomatic Yoruba for the loud cry, and strengthens the plea’s solemn appeal without over-interpreting the disputed nuance of ὁρκίζω. Footnote a corrects the literal idiom, and footnote b preserves the oath/solemn-charge alternative.
