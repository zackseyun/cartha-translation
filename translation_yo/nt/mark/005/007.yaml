id: MRK.5.7
reference: Mark 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: yo
  text: Ó sì kígbe ní ohùn rara, ó wí pé, “Kí ni mo ní í ṣe pẹ̀lú rẹ[a], Jésù, Ọmọ Ọlọ́run, Ẹni Gíga Jù Lọ? Mo fi Ọlọ́run bẹ̀ ọ́[b], má ṣe dá mi lóró.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “Kí ni sí èmi àti ìwọ?” Àkànlò èdè Gíríìkì yìí ń fi ìyapa, àríyànjiyàn, tàbí àìfẹ́ kí ẹnì kejì dá sí ọ̀rọ̀ ẹni hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Mo fi Ọlọ́run mú ọ́ bùra,” tàbí, “Mo fi Ọlọ́run fún ọ ní àṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè fi ẹnì kan sábẹ́ ìbúra tàbí jẹ́ ìbẹ̀bẹ̀ ọlọ́wọ̀ọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: Ó sì ké sókè ní ohùn rara
  rationale: Èyí mú agbára igbe náà àti bí ó ti pariwo tó hàn ní Yorùbá àdánidá, láìfi ìtumọ̀ mìíràn kún un.
- source_word: λέγει
  choice: ó wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo àsìkò ìsinsìnyí gẹ́gẹ́ bí àsìkò ìtàn, Yorùbá àdánidá máa ń sọ ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ ní ọ̀nà yìí; “ó wí pé” tún ní iyì tó bá ìforúkọsílẹ̀ mu.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Kí ni mo ní í ṣe pẹ̀lú rẹ
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún àkànlò èdè tí ń fi ìyapa, àríyànjiyàn tàbí àìfẹ́ kí ẹnì kejì dá sí ọ̀rọ̀ ẹni hàn. Àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán gangan rẹ̀ mọ́.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Ọmọ Ọlọ́run Ọ̀gá Ògo
  rationale: Ó pa orúkọ oyè Jesu àti àpèjúwe Ọlọ́run gẹ́gẹ́ bí Ẹni Gíga Jù Lọ mọ́ ní ọ̀nà tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Mo fi Ọlọ́run rọ̀ ọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ìrọ̀lẹ́ pàtàkì tí a fi orúkọ Ọlọ́run ṣe, ó sì jẹ́ Yorùbá àdánidá. Àlàyé ìsàlẹ̀ ojú ìwé ṣàfihàn pé ọ̀rọ̀ Gíríìkì tún ní agbára fífi ẹnì kan sábẹ́ ìbúra.
- source_word: μή με βασανίσῃς
  choice: má ṣe dá mi lóró
  rationale: “Dá mi lóró” sọ ìjìyà líle tí βασανίζω túmọ̀ sí ní kedere, láìsọ irú ọ̀nà ìjìyà kan pàtó.
theological_decisions:
- issue: Ìdánimọ̀ Jesu láti ẹnu ẹ̀mí àìmọ́
  choice: Ọmọ Ọlọ́run Ọ̀gá Ògo
  alternative: Ọmọ Ọlọ́run, Ẹni Gíga Jù Lọ
  rationale: Àṣàyàn náà pa ìjẹ́wọ́ tó ṣe kedere nípa ẹni tí Jesu jẹ́ mọ́, láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.
- issue: Agbára ὁρκίζω nínú ẹ̀bẹ̀ ẹ̀mí àìmọ́ sí Jesu
  choice: Mo fi Ọlọ́run rọ̀ ọ́
  alternative: Mo fi Ọlọ́run mú ọ sábẹ́ ìbúra
  rationale: Èyí pa ìyàlẹ́nu tó wà nínú bí ẹ̀mí àìmọ́ ṣe fi Ọlọ́run ṣe ìrọ̀lẹ́ sí Jesu mọ́. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí agbára ìbúra inú ọ̀rọ̀ Gíríìkì má bàa sọnù.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ọ̀gá Ògo” jẹ́ ọ̀nà tí ó mọ́gbọ́n dání láti sọ ὕψιστος nínú èdè ẹ̀sìn Yorùbá; iyókù gbolohun náà jẹ́ èdè tí ará ìgbàlódé lè lóye láìṣòro.
