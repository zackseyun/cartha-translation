  verdict: approve
  source_fidelity: Ìtumọ̀ náà gbé οὐαί δὲ kalẹ̀ dáadáa gẹ́gẹ́ bí “Ṣùgbọ́n ègbé ni fún,” ó sì pa ìró ìkìlọ̀-ẹkún náà mọ́. “Àwọn aboyún” ṣe ìtumọ̀ ταῖς ἐν γαστρὶ ἐχούσαις ní kedere, “àwọn tí ń fún ọmọ lọ́mú” sì jẹ́ ìtumọ̀ àdánidá fún ταῖς θηλαζούσαις. “Ní àwọn ọjọ́ wọ̀nyẹn” bá ἐν ἐκείναις ταῖς ἡμέραις mu ní pípé.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé, kedere, àti ọ̀wọ̀. Ìlò “ègbé ni fún” dára fún ọ̀rọ̀ ìkìlọ̀ tó wà nínú ẹsẹ náà; àmì ìyanu náà sì bá agbára ìkéde náà mu.
  terminology: Àwọn ọ̀rọ̀ pàtàkì—“aboyún,” “fún ọmọ lọ́mú,” àti “ọjọ́ wọ̀nyẹn”—wúlò, wọ́pọ̀, wọ́n sì yẹ fún ìforúkọsílẹ̀ Bíbélì Yorùbá. Àwọn àlàyé ìsàlẹ̀ a àti b ní ìdákọ̀ró tó tọ́, wọ́n sì fúnni ní ọ̀nà ìsọ̀rọ̀ míì láìyí ìtumọ̀ padà.
