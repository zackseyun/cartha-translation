  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ègbé ni fún àwọn aboyún[a] àti àwọn tí ń fún ọmọ lọ́mú[b] ní àwọn ọjọ́ wọ̀nyẹn!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó lóyún.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń fi ọmú bọ́ ọmọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ àsọtẹ́lẹ̀ tí ó jẹ́ ẹkún ìbànújẹ́ àti ìkìlọ̀ mọ́; ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé láti sọ ìpọ́njú ńlá tí ń bọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn láti inú ìkìlọ̀ tó ṣáájú, láìsọ pé ìtakora líle kan wà.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: àwọn aboyún
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí àwọn obìnrin tí ó lóyún; ‘àwọn aboyún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: γαστρί
  choice: aboyún
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè tọ́ka sí inú tàbí ilé-ọmọ, ìtumọ̀ rẹ̀ nínú àkójọpọ̀ ọ̀rọ̀ yìí ni oyún, nítorí náà a túmọ̀ gbogbo àkànlò náà dípò títúmọ̀ ọ̀rọ̀ kọ̀ọ̀kan ní tààrà.
- source_word: θηλαζούσαις
  choice: àwọn tí ń fún ọmọ lọ́mú
  rationale: Ó sọ ní èdè Yorùbá àdánidá pé àwọn obìnrin náà ń fi ọmú bọ́ ọmọ; ‘ọmọ’ mú ohun tí iṣe náà kan, tí Gíríìkì fi sílẹ̀ láìsọ, ṣe kedere.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó pa ìtọ́kasí àkókò àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àwọn ìṣẹ̀lẹ̀ tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti kedere ni a lò. Àmì ìyanu náà bá ìró ẹkún ìbànújẹ́ àti ìkìlọ̀ inú οὐαί mu. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
