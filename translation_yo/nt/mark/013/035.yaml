id: MRK.13.35
reference: Mark 13:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: yo
  text: 'Nítorí náà, ẹ máa ṣọ́nà[a], nítorí ẹ kò mọ ìgbà tí olúwa ilé yóò dé: bóyá ní ìrọ̀lẹ́, tàbí ní ọ̀gànjọ́ òru, tàbí nígbà tí àkùkọ bá kọ[b], tàbí ní òwúrọ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa wà lójúfò.” Àṣẹ náà túmọ̀ sí pé kí ẹ máa wà ní ìṣọ́ra, kí ẹ sì wà ní ìmúrasílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Igbe àkùkọ jẹ́ àmì ọ̀kan lára àwọn apá ìṣọ́ òru ní àsìkò náà.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ẹ máa ṣọ́nà
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn olùgbọ́ láti máa wà lójúfò, kí wọ́n sì má ṣe jẹ́ kí àìmọ̀ ìgbà tí olúwa ilé yóò dé bá wọn lójijì. ‘Ẹ máa ṣọ́nà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì ní ìtumọ̀ ìṣọ́ra àti ìmúrasílẹ̀.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ẹ̀kọ́ tó ṣáájú.
- source_word: οὐκ οἴδατε
  choice: ẹ kò mọ
  rationale: Ó túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà láìfi ìtumọ̀ mìíràn kún un.
- source_word: πότε
  choice: ìgbà tí
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ àkókò tí a kò mọ̀ nínú gbólóhùn Yorùbá.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: olúwa ilé
  rationale: Ó pa àwòrán ẹni tó ní àṣẹ lórí ilé mọ́, ó sì yẹra fún ṣíṣe àlàyé àkàwé náà ju bí orísun ṣe ṣe lọ.
- source_word: ἔρχεται
  choice: yóò dé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà ní àkókò ìsinsìnyí ní Gíríìkì, ó tọ́ka sí dídé tí a ń retí; ‘yóò dé’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé nínú àyíká yìí.
- source_word: ὀψὲ
  choice: ní ìrọ̀lẹ́
  rationale: Nínú àtòjọ àwọn ìṣọ́ òru, ó ń tọ́ka sí apá ìbẹ̀rẹ̀ òru, ìyẹn ìrọ̀lẹ́.
- source_word: μεσονύκτιον
  choice: ní ọ̀gànjọ́ òru
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àárín òru.
- source_word: ἀλεκτοροφωνίας
  choice: nígbà tí àkùkọ bá kọ
  rationale: Ó sọ àmì àkókò náà ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye lẹ́sẹ̀kẹsẹ̀, ó sì pa àwòrán igbe àkùkọ mọ́.
- source_word: πρωΐ
  choice: ní òwúrọ̀
  rationale: Ó bá apá ìkẹyìn ìṣọ́ òru tó ń wọ òwúrọ̀ mu, láìfi ‘àfẹ̀mọ́jú’ tàbí àkókò tó há ju orísun lọ kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κύριος nínú àkàwé ilé, níbi tí ó ti lè tọ́ka sí Jésù lọ́nà àpẹẹrẹ
  choice: olúwa ilé
  alternative: ẹni tó ni ilé; baálé ilé
  rationale: ‘Olúwa ilé’ pa ìtumọ̀ ẹni tó ní àṣẹ nínú àwòrán ilé mọ́, ó sì tún jẹ́ kí ìtọ́kasí àpẹẹrẹ sí Jésù ṣí sílẹ̀ láìsọ ọ́ di orúkọ oyè Ọlọ́run ní tààrà.
translation_notes:
  register: A lo Yorùbá àkókò-òde tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ ìrọ̀lẹ́, ọ̀gànjọ́ òru, igbe àkùkọ, àti òwúrọ̀ pa àtòjọ àwọn ìṣọ́ òru inú orísun mọ́.
