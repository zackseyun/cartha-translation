id: MRK.13.6
reference: Mark 13:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn yóò wá ní orúkọ mi, wọn yóò máa sọ pé, ‘Èmi ni’[a], wọn yóò sì mú ọ̀pọ̀ ènìyàn ṣìnà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “Èmi ni.” Gíríìkì kò sọ ohun tí ẹni náà ní òun jẹ́ ní gbangba; gẹ́gẹ́ bí àyíká ọ̀rọ̀, a tún lè túmọ̀ ọ́ sí “Èmi ni ẹni náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Àjẹ́tífù ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ ń tọ́ka sí ọ̀pọ̀ ènìyàn láì sọ iye wọn pàtó; fífi “ènìyàn” kún un jẹ́ kí Yorùbá ṣe kedere, kí ó sì dùn mọ́ etí.
- source_word: ἐλεύσονται
  choice: yóò wá
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà túmọ̀ sí pé wọn yóò dé tàbí farahàn; “yóò wá” jẹ́ ọ̀nà tààrà, àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Gbólóhùn náà lè fi hàn pé wọ́n ń lo orúkọ Jesu, ń pe ara wọn mọ́ ọn, tàbí ń sọ pé wọ́n ní àṣẹ rẹ̀. “Ní orúkọ mi” pa ìtúmọ̀ gbòòrò yìí mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: λέγοντες
  choice: wọn yóò máa sọ pé
  rationale: Ó ń ṣàlàyé ohun tí wọn yóò sọ nígbà tí wọn bá wá. Ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, kò sì fi èrò bí “wọ́n ń kéde” tàbí “wọ́n ń fẹ̀sùn kan” kún ọ̀rọ̀ Gíríìkì.
- source_word: ὅτι Ἐγώ εἰμι
  choice: pé, ‘Èmi ni’
  rationale: Gíríìkì tẹnumọ́ “Èmi,” kò sì sọ àpólà-orúkọ tó tẹ̀ lé “ni” ní gbangba. “Èmi ni” jẹ́ gbólóhùn Yorùbá tó ṣókí tí ó lè ṣiṣẹ́ gẹ́gẹ́ bí ìdánimọ̀ ẹni náà, nígbà tí ó tún pa àìsọ ohun tí ó jẹ́ mọ́.
- source_word: πολλοὺς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Èyí ni ẹni tí ìṣìnà náà kan. “Ọ̀pọ̀ ènìyàn” ṣe kedere, ó sì bá πολλοὶ ní ìbẹ̀rẹ̀ ẹsẹ náà mu.
- source_word: πλανήσουσιν
  choice: yóò mú ... ṣìnà
  rationale: πλανάω ní èrò yíyí ènìyàn kúrò ní ọ̀nà tó tọ́ tàbí ṣi wọn lọ́nà. “Mú ... ṣìnà” pa àwòrán yíyapa kúrò ní ọ̀nà tó tọ́ mọ́, ó sì jẹ́ Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἐγώ εἰμι nínú ọ̀rọ̀ nípa àwọn afẹnujẹ́
  choice: ‘Èmi ni,’ pẹ̀lú àlàyé ìsàlẹ̀ ìwé pé Gíríìkì kò sọ ohun tí ẹni náà ní òun jẹ́ ní gbangba
  alternative: ‘Èmi ni ẹni náà’
  rationale: “Èmi ni ẹni náà” lè mú ìdánimọ̀ ẹni tí àyíká ọ̀rọ̀ ń tọ́ka sí ṣe kedere, ṣùgbọ́n ó fi “ẹni náà” kún ọ̀rọ̀ tí kò sí ní Gíríìkì. “Èmi ni” pa ìṣókí àti àìdánilójú ojúlówó náà mọ́, láì pinnu bóyá ẹ̀sùn náà jẹ́ Mèsáyà ní pàtó tàbí ìdánimọ̀ mìíràn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Mú ... ṣìnà” jẹ́ ọ̀rọ̀ àdánidá fún yíyí ènìyàn kúrò ní ọ̀nà òtítọ́, “ní orúkọ mi” sì pa ìtumọ̀ nípa lílo orúkọ tàbí fífi ara mọ́ Jesu mọ́.
