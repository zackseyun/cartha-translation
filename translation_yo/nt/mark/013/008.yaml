id: MRK.13.8
reference: Mark 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: yo
  text: Nítorí orílẹ̀-èdè yóò dìde sí orílẹ̀-èdè, ìjọba yóò sì dìde sí ìjọba. Ìsẹ̀lẹ̀ ilẹ̀ yóò wáyé ní onírúurú ibi, ìyàn yóò sì wáyé. Àwọn nǹkan wọ̀nyí ni ìbẹ̀rẹ̀ ìrora ìbímọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìrora ìrọbí” tàbí “ìrora ìbí ọmọ.” Ọ̀rọ̀ Gíríìkì náà ń lo àwòrán ìrora tó máa ń bá bíbí ọmọ rìn gẹ́gẹ́ bí àkàwé fún ìjìyà tó ṣáájú ohun tí yóò tẹ̀ lé e.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: yóò dìde
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹgbẹ́ kan yóò gbógun ti ẹgbẹ́ mìíràn; kò fi ìṣe aláìṣe ti Gíríìkì hàn lọ́nà líle tí kò bá èdè Yorùbá mu.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: orílẹ̀-èdè ... sí orílẹ̀-èdè
  rationale: Nínú àyíká ogun yìí, “orílẹ̀-èdè” mú ìtumọ̀ ẹgbẹ́ ènìyàn olóṣèlú jáde, “sí” sì fi ìdojúkọ hàn ní kedere.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: ìjọba ... sí ìjọba
  rationale: Níhìn-ín βασιλεία ń tọ́ka sí agbègbè tàbí ìjọba olóṣèlú, kì í ṣe agbára jíjẹ ọba lásán; yíyan yìí tún pa ìbáradọ́gba gbólóhùn mọ́.
- source_word: σεισμοὶ
  choice: ìsẹ̀lẹ̀ ilẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ìgbọ̀n ilẹ̀.
- source_word: κατὰ τόπους
  choice: ní onírúurú ibi
  rationale: Ó pa agbára ìpínkiri κατά mọ́, ó sì fi hàn pé àwọn ìṣẹ̀lẹ̀ náà yóò ṣẹlẹ̀ ní ibi ọ̀tọ̀ọ̀tọ̀.
- source_word: λιμοί
  choice: ìyàn
  rationale: “Ìyàn” túmọ̀ sí àìsí oúnjẹ tó gbòòrò ju ebi lásán lọ. Bí ó tilẹ̀ jẹ́ pé orúkọ náà kì í sábà gba àmì ọ̀pọ̀ ní Yorùbá, ó lè ṣàpèjúwe ọ̀pọ̀ ìṣẹ̀lẹ̀ ìyàn.
- source_word: ἀρχὴ
  choice: ìbẹ̀rẹ̀
  rationale: Ó fi hàn pé àwọn ìṣẹ̀lẹ̀ wọ̀nyí kàn ń ṣàmì sí ìpilẹ̀ ohun tó ń bọ̀, wọn kì í ṣe gbogbo rẹ̀.
- source_word: ὠδίνων
  choice: ìrora ìbímọ
  rationale: Ó pa àwòrán ìrora tó ní í ṣe pẹ̀lú bíbí ọmọ mọ́, ó sì jẹ́ ọ̀rọ̀ tó ṣe kedere, tó bójú mu ní Yorùbá òde òní.
- source_word: ταῦτα
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí ọ̀pọ̀ ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ dárúkọ, ó sì bá lílo Yorùbá mu.
theological_decisions:
- issue: Àkàwé àsọtẹ́lẹ̀ inú ọ̀rọ̀ ἀρχὴ ὠδίνων
  choice: Àwọn ìṣẹ̀lẹ̀ wọ̀nyí ni ìbẹ̀rẹ̀ ìrora ìbímọ.
  alternative: Àwọn wọ̀nyí jẹ́ wàhálà lásán; tàbí fífi ìrora ìbímọ náà mọ ètò ẹ̀kọ́ nípa òpin ayé kan pàtó.
  rationale: 'Ìtumọ̀ náà pa ìforígbárí àkàwé mọ́: ìjìyà ti bẹ̀rẹ̀, ṣùgbọ́n ọ̀rọ̀ náà kò sọ pé òpin ti dé. A kò fi ètò ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A gbé àmì àlàyé [a] sí “ìrora ìbímọ,” níbi tí àlàyé ọ̀rọ̀ náà ti jẹ mọ́.
