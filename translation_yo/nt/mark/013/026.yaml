  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: yo
  text: Nígbà náà ni wọn yóò rí Ọmọ Ènìyàn tí ó ń bọ̀ nínú àwọsánmà[a] pẹ̀lú agbára ńlá àti ògo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ń bọ̀ pẹ̀lú àwọsánmà.” Ọ̀rọ̀ Gíríìkì náà sọ pé “nínú àwọsánmà,” ṣùgbọ́n ọ̀nà kejì yìí lè jẹ́ kí ìtọ́kasí tí ó ṣeé ṣe sí Dáníẹ́lì 7:13 hàn gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: wọn yóò rí
  rationale: Ó túmọ̀ sí ohun tí wọn yóò rí ní gbangba ní ọjọ́ iwájú, láìfi ìtumọ̀ míì kún un.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni àkọ́lé Bíbélì tí a mọ̀ dáadáa, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú Dáníẹ́lì 7.
- source_word: ἐρχόμενον
  choice: tí ó ń bọ̀
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ nínú participle Gíríìkì mọ́, ó sì bá ọ̀rọ̀ ìfarahàn ọjọ́ ìkẹyìn mu.
- source_word: ἐν νεφέλαις
  choice: nínú àwọsánmà
  rationale: “Nínú” ṣe àfihàn ἐν ní tààrà, “àwọsánmà” sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣùpọ̀ ìkùukùu láìfi article tí kò sí nínú Gíríìkì kún un.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: pẹ̀lú agbára ńlá
  rationale: “Pẹ̀lú” fi ìtẹ̀lé tàbí ìbáṣepọ̀ μετά hàn, “agbára ńlá” sì jẹ́ Yorùbá àdánidá fún ìwọ̀n agbára náà.
- source_word: καὶ δόξης
  choice: àti ògo
  rationale: “Ògo” pa ìtumọ̀ Bíbélì ti ọlá ńlá tí ó farahàn mọ́, ó sì yẹ fún àyíká ọ̀rọ̀ yìí.
theological_decisions:
- issue: Àkọ́lé apokalíptì àti àwòrán àwọsánmà
  choice: Pa “Ọmọ Ènìyàn” àti bíbọ̀ nínú àwọsánmà mọ́ láìṣe àlàyé rẹ̀ sínú ẹsẹ̀ náà.
  alternative: Ṣe “Ọmọ Ènìyàn” ní ọ̀nà àlàyé bí “Ẹni tí ó jẹ́ ènìyàn,” tàbí tú ìtọ́kasí sí Dáníẹ́lì 7 sílẹ̀ gbangba.
  rationale: Ọ̀rọ̀ náà ń tọ́ka gidigidi sí Dáníẹ́lì 7:13, ṣùgbọ́n ó yẹ kí ìtumọ̀ pa ìtọ́kasí náà mọ́ dípò kí ó pinnu gbogbo ìtumọ̀ rẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá ìṣedéédé òde òní pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà ní ọlá, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “Nígbà náà ni” fún ìtẹnumọ́ καὶ τότε, a sì yàgò fún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú orísun.
