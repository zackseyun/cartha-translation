language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ọjọ́ náà tàbí wákàtí náà, kò sí ẹni tí ó mọ̀—àní àwọn áńgẹ́lì ní ọ̀run kò mọ̀, àní Ọmọ náà kò mọ̀,[a] bí kò ṣe Bàbá nìkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn aṣàlàyé kan gbà pé ọ̀rọ̀ “àní Ọmọ náà kò mọ̀” ń tọ́ka sí iṣẹ́ Ọmọ nígbà tí ó di ènìyàn tàbí sí ìwà ènìyàn rẹ̀; ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé náà kún ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ṣùgbọ́n ní ti
  rationale: “Ní ti” fi kókó tuntun hàn gẹ́gẹ́ bí περί pẹ̀lú ọ̀rọ̀ inú genitive, “ṣùgbọ́n” sì pa ìyípadà tàbí ìyàtọ̀ pẹ̀lẹ́ tí δέ ní mọ́.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ọjọ́ náà tàbí wákàtí náà
  rationale: Ó pa ìyàtọ̀ láàárín ọjọ́ àti wákàtí mọ́, ó sì tún “náà” ṣe ní ọ̀nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: οὐδεὶς οἶδεν
  choice: kò sí ẹni tí ó mọ̀
  rationale: Ó tú οὐδείς àti ìtumọ̀ àsìkò ìsinsìnyí ti οἶδα jáde ní Yorùbá àdánidá.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: àní àwọn áńgẹ́lì ní ọ̀run kò mọ̀
  rationale: “Àní” mú agbára ìtẹnumọ́ οὐδέ jáde; “ní ọ̀run” sì jẹ́ locative tí ó tọ́ka sí àwọn áńgẹ́lì.
- source_word: οὐδὲ ὁ υἱός
  choice: bẹ́ẹ̀ ni Ọmọ náà kò mọ̀
  rationale: Ó tẹ̀síwájú nínú àtòjọ ohun tí a kọ̀, ó sì pa “Ọmọ náà” mọ́ gẹ́gẹ́ bí oyè Kristi láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: εἰ μὴ ὁ πατήρ
  choice: bí kò ṣe Baba nìkan
  rationale: Lẹ́yìn ọ̀rọ̀ ìkọ̀, “bí kò ṣe” fi ẹni kan ṣoṣo tí a yọ sílẹ̀ hàn, “nìkan” sì mú ìyàsọ́tọ̀ náà ṣe kedere.
theological_decisions:
- issue: Gbólóhùn nípa Kristi pé Ọmọ náà kò mọ ọjọ́ tàbí wákàtí náà
  choice: Pa ọ̀rọ̀ tààrà náà mọ́ pé “Ọmọ náà kò mọ̀,” láìrẹ̀ ẹ́ sílẹ̀ tàbí fi àlàyé kún un nínú ọ̀rọ̀ pàtàkì.
  alternative: Fi ọ̀rọ̀ ìtumọ̀ bí “nípa ìwà ènìyàn rẹ̀” kún un, tàbí yọ gbólóhùn náà kúrò.
  rationale: Ọ̀rọ̀ Gíríìkì ní οὐδὲ ὁ υἱός ní kedere. Ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ó wà nínú ọ̀rọ̀ orísun mọ́, kò sì yanju rẹ̀ nípasẹ̀ àfikún tí kò sí nínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtúnṣe “kò mọ̀” nínú àwọn apá méjèèjì yàgò fún àìgbọ́ye, ó sì pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
