id: MRK.13.22
reference: Mark 13:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: yo
  text: Nítorí àwọn Mèsáyà èké[a] àti àwọn wòlíì èké yóò dìde, wọn yóò sì ṣe àwọn àmì àti iṣẹ́ ìyanu láti mú àwọn àyànfẹ́ ṣìnà, bí ó bá ṣeé ṣe.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Kristi èké.” Ọ̀rọ̀ Gíríìkì náà dá lórí Christos, tí a lò níbí gẹ́gẹ́ bí oyè tó túmọ̀ sí “Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “bí ó bá lè ṣeé ṣe.” Ọ̀rọ̀ Gíríìkì náà kò pinnu ní tààrà bóyá a lè mú àwọn àyànfẹ́ ṣìnà ní tòótọ́; ó ń sọ ète àwọn ẹlẹ́tàn náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “láti mú, bí ó bá ṣeé ṣe, àwọn àyànfẹ́ ṣìnà.” Ìṣètò yìí ń fi ipò ọ̀rọ̀ náà nínú Gíríìkì hàn.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: yóò dìde
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé àwọn ènìyàn wọ̀nyí yóò farahàn tàbí yóò bẹ̀rẹ̀ sí í ṣiṣẹ́. “Yóò dìde” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ohùn ìkìlọ̀ àsọtẹ́lẹ̀ mọ́ láì sọ pé Ọlọ́run ló gbé wọn dìde.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìkìlọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí fún un.
- source_word: ψευδόχριστοι
  choice: àwọn Mèsáyà èké
  rationale: Χριστός wà nínú ọ̀rọ̀ àkópọ̀ yìí gẹ́gẹ́ bí oyè tó túmọ̀ sí Mèsáyà. “Àwọn Mèsáyà èké” mú ìtumọ̀ Júù àti ti àsọtẹ́lẹ̀ náà hàn kedere ju lílo “Kristi” bí ẹni pé ó jẹ́ orúkọ lọ.
- source_word: ψευδοπροφῆται
  choice: àwọn wòlíì èké
  rationale: Èyí jẹ́ ìtumọ̀ tó ṣe kedere, tó sì wọ́pọ̀ fún àwọn tó ń pe ara wọn ní wòlíì ṣùgbọ́n tí wọ́n jẹ́ èké.
- source_word: δώσουσιν
  choice: wọn yóò sì ṣe
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fúnni,” Yorùbá adayébá máa ń sọ pé ẹnì kan “ṣe àmì àti iṣẹ́ ìyanu.” Èyí pa ìtumọ̀ mọ́ láì mú gbólóhùn náà le.
- source_word: σημεῖα καὶ τέρατα
  choice: àwọn àmì àti iṣẹ́ ìyanu
  rationale: “Àmì àti iṣẹ́ ìyanu” jẹ́ àpapọ̀ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì yàgò fún fífi “àwọn iṣẹ́ ìyanu láti ọ̀dọ̀ Ọlọ́run” kún un, èyí tí orísun kò sọ.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: láti mú ... ṣìnà
  rationale: Ìṣètò ọ̀rọ̀ náà fi ète hàn. “Mú ... ṣìnà” pa àwòrán jíjẹ́ kí ẹnì kan yà kúrò ní ọ̀nà òtítọ́ mọ́, kì í ṣe pé wọ́n kan tan án jẹ nìkan.
- source_word: εἰ δυνατόν
  choice: bí ó bá ṣeé ṣe
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ àídájú Gíríìkì ní ṣókí, láì pinnu bóyá ó ṣeé ṣe ní tòótọ́ láti mú àwọn àyànfẹ́ ṣìnà.
- source_word: τοὺς ἐκλεκτούς
  choice: àwọn àyànfẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí a yàn. “Àwọn àyànfẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kíkún, tó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láì fi èrò ẹ̀sìn ẹgbẹ́ kan kún un.
theological_decisions:
- issue: Ìtumọ̀ ψευδόχριστοι níbi tí Χριστός ti jẹ́ oyè
  choice: àwọn Mèsáyà èké
  alternative: àwọn Kristi èké
  rationale: Nínú ọ̀rọ̀ àkópọ̀ yìí, oyè Mèsáyà ni a ń lò, kì í ṣe “Kristi” bí orúkọ ẹni. Ìtumọ̀ yìí mú àyíká ìrètí Mèsáyà hàn kedere.
- issue: Ohun tí εἰ δυνατόν túmọ̀ sí nípa bóyá a lè mú àwọn àyànfẹ́ ṣìnà
  choice: bí ó bá ṣeé ṣe
  alternative: bí ó bá lè ṣeé ṣe
  rationale: Gíríìkì fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí àídájú, kò sì sọ ní tààrà bóyá ohun náà lè ṣẹlẹ̀ níkẹyìn tàbí kò lè ṣẹlẹ̀. A pa ìfòyemọ̀ méjèèjì yìí mọ́.
- issue: Ibi tí εἰ δυνατόν dúró nínú gbólóhùn
  choice: láti mú àwọn àyànfẹ́ ṣìnà, bí ó bá ṣeé ṣe
  alternative: láti mú ṣìnà, bí ó bá ṣeé ṣe, àwọn àyànfẹ́
  rationale: Ìṣètò àkọ́kọ́ jẹ́ Yorùbá adayébá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtòlẹ́sẹẹsẹ Gíríìkì mọ́ fún ẹni tó fẹ́ rí bí ọ̀rọ̀ àídájú náà ṣe wà láàárín ìṣe àti ẹni tí ìṣe náà kàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. “Ṣe àwọn àmì àti iṣẹ́ ìyanu” jẹ́ adayébá ju ìtumọ̀ gígún bí “fúnni ní” lọ, nígbà tí “àwọn àyànfẹ́” pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ orísun mọ́ láì ṣàlàyé rẹ̀ ní ojú kan ṣoṣo.
