  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: yo
  text: kí ó má bàa dé lójijì, kí ó sì bá yín nígbà tí ẹ ń sùn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: kí ó má bàa
  rationale: Ó fi ìkìlọ̀ nípa ohun tí a kò fẹ́ kí ó ṣẹlẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἐλθὼν ἐξαίφνης
  choice: dé lójijì
  rationale: Ọ̀rọ̀ náà pa ìtumọ̀ dídé láìròtẹ́lẹ̀ mọ́, ó sì jẹ́ ọ̀nà tí ó bá Yorùbá mu.
- source_word: εὕρῃ ὑμᾶς
  choice: kí ó sì bá yín
  rationale: ‘Bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan dé, ó sì rí àwọn ènìyàn ní ipò kan.
- source_word: καθεύδοντας
  choice: ní oorun
  rationale: Ó túmọ̀ sí pé ó bá wọn tí wọ́n ń sùn; gbolohun yìí ṣe ìtumọ̀ náà ní kedere láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
theological_decisions:
- issue: Bóyá ‘oorun’ jẹ́ oorun gidi tàbí àpẹẹrẹ àìṣọ́ra
  choice: ní oorun
  alternative: tí ẹ̀yin kò ṣọ́ra
  rationale: Orísun Gíríìkì sọ ‘tí wọ́n ń sùn’ ní tààrà; a pa àwòrán náà mọ́, a kò sì pinnu fún òǹkàwé bóyá ó jẹ́ gidi tàbí àpẹẹrẹ.
translation_notes:
  register: Yorùbá boṣewa, ohùn ọ̀wọ̀ àti èdè àdánidá. A lo ‘yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ὑμᾶς.
