source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: yo
  text: Ẹni tí ó wà lórí òrùlé[a] kò gbọdọ̀ sọ̀kalẹ̀, bẹ́ẹ̀ sì ni kò gbọdọ̀ wọ inú ilé láti gba ohun kankan láti inú ilé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Òrùlé tí a ń sọ níbí jẹ́ òrùlé pẹlẹbẹ ilé, èyí tí àwọn ènìyàn sábà máa ń lò gẹ́gẹ́ bí ààyè ìgbé.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Ẹni tí ó bá wà lórí òrùlé
  rationale: Gbólóhùn náà ń tọ́ka sí ẹnikẹ́ni tí ó wà ní ibi yẹn; ìtumọ̀ yìí jẹ́ ti ẹ̀dá, ó sì pa agbára gbogbogbò ti ìtọ́ni náà mọ́.
- source_word: δώματος
  choice: òrùlé
  rationale: Ọ̀rọ̀ náà tọ́ka sí òrùlé pẹlẹbẹ ilé, ibi tí àwọn ènìyàn lè dúró tàbí lò gẹ́gẹ́ bí ààyè ìgbé.
- source_word: μὴ καταβάτω
  choice: kò gbọdọ̀ sọ̀kalẹ̀
  rationale: Èyí fi àṣẹ ìdènà ẹni-kẹta hàn ní Yorùbá àdánidá, ó sì bá ìrìn láti orí òrùlé sọ̀kalẹ̀ mu.
- source_word: μηδὲ εἰσελθάτω
  choice: bẹ́ẹ̀ ni kí ó má wọ inú ilé
  rationale: Ó so ìdènà kejì mọ́ ti àkọ́kọ́, nígbà tí ‘wọ inú ilé’ mú ibi tí a ń wọ̀ ṣe kedere láì fi ohun tí kò sí nínú orísun kún un.
- source_word: τι ἆραι
  choice: láti mú ohunkóhun jáde
  rationale: Infinitive náà sọ ète ìwọlé; ‘ohunkóhun’ pa ìtumọ̀ àìlópin ti τι mọ́, ‘jáde’ sì bá ἐκ tí ó tẹ̀ lé e mu.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: kúrò ní ilé rẹ̀
  rationale: ‘Kúrò ní’ fi ìmú ohun jáde láti inú ilé hàn, ‘ilé rẹ̀’ sì pa ẹyọ ọ̀rọ̀ arọ́pò-orúkọ oníṣòwò gbogbogbò mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ arọ́pò-orúkọ akọ ẹyọ tí ó ní agbára gbogbogbò
  choice: ilé rẹ̀
  alternative: ilé wọn / ilé náà
  rationale: αὐτοῦ jẹ́ akọ ẹyọ ní Gíríìkì, ṣùgbọ́n Yorùbá ‘rẹ̀’ kò fi akọ tàbí abo hàn. Ó pa ẹyọ náà mọ́ láì mú ìtọ́ni gbogbogbò náà di ti akọ nìkan.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘kò gbọdọ̀’ àti ‘kí ó má’ láti fi ìdènà méjèèjì hàn ní ọ̀nà àdánidá; àmì àlàyé [a] wà lẹ́yìn ẹsẹ̀ gẹ́gẹ́ bí a ṣe béèrè.
