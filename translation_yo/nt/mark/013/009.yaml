revisions:
- from: Ṣùgbọ́n ẹ máa ṣọ́ra fún ara yín. Wọn yóò fi yín lé àwọn ìgbìmọ̀ lọ́wọ́, a ó sì lù yín ní àwọn sínágọ́gù. Ẹ ó dúró níwájú àwọn gomina àti àwọn ọba nítorí mi, láti jẹ́ ẹ̀rí fún wọn.[a]
  to: Ṣùgbọ́n ẹ máa ṣọ́ra fún ara yín. Wọn yóò fi yín lé àwọn ìgbìmọ̀ lọ́wọ́, a ó sì lù yín ní àwọn sínágọ́gù. Ẹ ó dúró níwájú àwọn gomina àti àwọn ọba nítorí mi, gẹ́gẹ́ bí ẹ̀rí fún wọn.[a]
  rationale: A yí ‘láti jẹ́ ẹ̀rí’ padà sí ‘gẹ́gẹ́ bí ẹ̀rí’ láti fara mọ́ ipá εἰς μαρτύριον (‘gẹ́gẹ́ bí/ fún ìjẹ́rìí’) pẹ̀lú ìtúmọ̀ tí kò fi ète mìíràn kún un. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí ó má ṣe yi ‘ẹ̀rí’ padà sí ‘ẹlẹ́rìí,’ kí ó sì pa ìṣeeṣe ìtumọ̀ aláìdájọ́ (‘sí wọn’ tàbí ‘lòdì sí wọn’) mọ́.
