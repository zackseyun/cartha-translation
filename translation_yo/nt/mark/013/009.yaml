id: MRK.13.9
reference: Mark 13:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa ṣọ́ra fún ara yín. Wọn yóò fi yín lé àwọn ìgbìmọ̀ lọ́wọ́, a ó sì lù yín ní àwọn sínágọ́gù. Ẹ ó dúró níwájú àwọn gomina àti àwọn ọba nítorí mi, gẹ́gẹ́ bí ẹ̀rí fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ẹ̀rí sí wọn”; gbólóhùn náà tún lè ní ìtumọ̀ “gẹ́gẹ́ bí ẹ̀rí lòdì sí wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Ṣùgbọ́n ẹ máa ṣọ́ra fún ara yín
  rationale: Ọ̀rọ̀ àṣẹ tó wà ní àsìkò ìsinsìnyí ń pe fún ìṣọ́ra tí kò dáwọ́ dúró; ‘fún ara yín’ tún pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ àti àfidípò ara mọ́.
- source_word: παραδώσουσιν ὑμᾶς
  choice: Wọn yóò fi yín ... lọ́wọ́
  rationale: Ó túmọ̀ sí fífi ẹni lé àwọn aláṣẹ lọ́wọ́ nínú àyíká inúnibíni, kì í ṣe dandan pé ìwà ọ̀dàlẹ̀ ni a ń tẹnumọ́.
- source_word: εἰς συνέδρια
  choice: lé àwọn ìgbìmọ̀ lọ́wọ́
  rationale: Ọ̀pọ̀ ‘συνέδρια’ tọ́ka sí àwọn ìgbìmọ̀ ìjọba tàbí ìdájọ́ àdúgbò, kì í ṣe Sànhẹ́dírìnì Jerúsálẹ́mù nìkan.
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: a ó sì lù yín ní àwọn sínágọ́gù
  rationale: Ọ̀rọ̀ náà sọ ní tààrà nípa lílu ẹni ní ibi sínágọ́gù; ‘lù’ kò fi irú ohun èlò tàbí ọ̀nà lílu kan pàtó kún un.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: Ẹ ó dúró níwájú àwọn gomina àti àwọn ọba
  rationale: Ó pa ìfarahàn níwájú àwọn aláṣẹ méjèèjì mọ́, láìṣe àfikún pé wọ́n fà wọ́n lọ síbẹ̀ bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù ìṣe Gíríìkì lè ní ìtumọ̀ pé a mú wọn dúró.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: Ó sọ pé ìbáṣepọ̀ wọn pẹ̀lú Jésù ni okùnfà inúnibíni náà.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: láti jẹ́ ẹ̀rí fún wọn
  rationale: Ó pa ìtumọ̀ ẹ̀rí tí a darí sí àwọn aláṣẹ náà mọ́, láìfi ipa ìdálẹ́bi tí Gíríìkì kò fipá béèrè kún un.
theological_decisions:
- issue: Agbára ìtumọ̀ gbólóhùn εἰς μαρτύριον αὐτοῖς
  choice: Ìfarahàn àwọn ọmọ-ẹ̀yìn níwájú àwọn aláṣẹ yóò ṣiṣẹ́ gẹ́gẹ́ bí ẹ̀rí fún wọn.
  alternative: Ó lè túmọ̀ sí ẹ̀rí lòdì sí wọn, èyí tó ní ipa ìdálẹ́bi.
  rationale: Dátífù αὐτοῖς kò fi dandan mú ìtumọ̀ ọ̀tá tàbí ìdálẹ́bi wá; nítorí náà, ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa àìdánilójú tó jẹ́ ojúlówó mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Sínágọ́gù’ àti ‘gomina’ jẹ́ àwọn ọ̀rọ̀ tó wọ́pọ̀, tí òǹkàwé òde-òní lè lóye; ìtumọ̀ náà yàgò fún èdè ẹ̀sìn ẹ̀ka kan pàtó.
