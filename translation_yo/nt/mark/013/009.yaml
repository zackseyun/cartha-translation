  source_fidelity: Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa nípa ìkìlọ̀, fífi àwọn ọmọ-ẹ̀yìn lé àwọn ìgbìmọ̀ lọ́wọ́, lílù wọn nínú sínágọ́gù, àti ìfarahàn wọn níwájú àwọn aláṣẹ. A tún ṣe ìtúnṣe kékeré sí gbólóhùn ìkẹyìn kí ó lè túmọ̀ εἰς μαρτύριον gẹ́gẹ́ bí ‘gẹ́gẹ́ bí ẹ̀rí,’ kì í ṣe bí ète tí a sọ ní pàtó.
