source:
  edition: SBLGNT
  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: yo
  text: “Ẹ sọ fún wa, nígbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀, kí sì ni àmì náà yóò jẹ́ nígbà tí gbogbo àwọn nǹkan wọ̀nyí bá fẹ́rẹ̀ẹ́ dé ìparí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí gbogbo àwọn nǹkan wọ̀nyí bá dé ìparí.” Ọ̀rọ̀ Gíríìkì μέλλῃ pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin lè tẹnu mọ́ pé ohun náà ti sún mọ́lé, ìyẹn “fẹ́rẹ̀ẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Ẹ sọ fún wa
  rationale: Ọ̀rọ̀ àṣẹ ẹyọ kan ni Εἰπὸν, tí ἡμῖν sì túmọ̀ sí ‘fún wa.’ Èdè Yorùbá máa ń lo ‘sọ fún wa’ lọ́nà àdánidá; ‘Ẹ’ jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí ẹni kan, ìyẹn Jésù.
- source_word: πότε ταῦτα ἔσται
  choice: nígbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀
  rationale: ‘Nígbà wo’ ṣe àfihàn ìbéèrè àkókò, ‘àwọn nǹkan wọ̀nyí’ sì pa ọ̀pọ̀ nọ́ńbà ταῦτα mọ́. Bí ó tilẹ̀ jẹ́ pé ἔσται jẹ́ ‘yóò wà’ ní tààrà, ‘yóò ṣẹlẹ̀’ dára sí i ní Yorùbá fún àwọn ìṣẹ̀lẹ̀ tí a sọ tẹ́lẹ̀.
- source_word: τί τὸ σημεῖον
  choice: kí sì ni yóò jẹ́ àmì
  rationale: ‘Àmì’ ni ìtumọ̀ àdánidá ti σημεῖον. A fi ‘yóò jẹ́’ kún un láti inú ọ̀rọ̀ àyíká, bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe tí a kọ ní kedere nínú gbólóhùn Gíríìkì yìí.
- source_word: ὅταν μέλλῃ
  choice: pé ... ti fẹ́
  rationale: Ọ̀nà yìí pa ìtumọ̀ ohun tí ó sún mọ́lé tàbí tí ó fẹ́ ṣẹlẹ̀ mọ́, èyí tí μέλλω pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin lè ní.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: gbogbo àwọn nǹkan wọ̀nyí ... dé ìparí
  rationale: ‘Gbogbo àwọn nǹkan wọ̀nyí’ pa πάντα àti ταῦτα mọ́; ‘dé ìparí’ ṣe àfihàn ìparí tàbí ìmúṣẹ pátápátá tí συντελεῖσθαι ń tọ́ka sí, láì fi ìtumọ̀ àsọtẹ́lẹ̀ kan pàtó kún un.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ohun tí ó sún mọ́lé nínú μέλλῃ pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin
  choice: pé gbogbo àwọn nǹkan wọ̀nyí ti fẹ́ dé ìparí
  alternative: nígbà tí gbogbo àwọn nǹkan wọ̀nyí yóò dé ìparí
  rationale: ‘Ti fẹ́’ pa ìmọ̀lára pé ohun náà ń bọ̀ tàbí ó sún mọ́lé mọ́. A kò sọ èyí di ẹ̀kọ́ kan pàtó nípa ìtòlẹ́sẹẹsẹ àwọn ìṣẹ̀lẹ̀ ọjọ́ ìkẹyìn.
- issue: Ìtumọ̀ συντελεῖσθαι
  choice: dé ìparí
  alternative: ṣẹ ní kíkún; parí pátápátá; ní ìmúṣẹ
  rationale: ‘Dé ìparí’ gba ìtumọ̀ ìparí tàbí ìpéye iṣẹ́ náà, láì mú un dandan túmọ̀ sí ìmúṣẹ àsọtẹ́lẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo ‘Ẹ’ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ sí Jésù; kò túmọ̀ sí pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀. Gbólóhùn náà yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan, ó sì pa ìfọ̀rọ̀wérọ̀ àti ìdíjú ọ̀rọ̀ Gíríìkì mọ́.
