source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí i pé àwọn nǹkan wọ̀nyí ń ṣẹlẹ̀, ẹ mọ̀ pé ó ti sún mọ́lé, ó sì wà ní ẹnu àwọn ilẹ̀kùn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: “Bẹ́ẹ̀ náà” so ọ̀rọ̀ yìí mọ́ àpẹẹrẹ igi ọ̀pọ̀tọ́ tó ṣáájú, “ẹ̀yin pẹ̀lú” sì pa ìtẹnumọ́ tó wà lórí àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: ὅταν ἴδητε
  choice: nígbà tí ẹ bá rí i pé
  rationale: Ìlò “nígbà tí ... bá” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí hàn ní Yorùbá àdánidá; “rí i pé” sì mú kí gbólóhùn tó tẹ̀ lé e ṣàn dáadáa.
- source_word: ταῦτα γινόμενα
  choice: àwọn nǹkan wọ̀nyí ń ṣẹlẹ̀
  rationale: Èyí pa ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì tú γινόμενα sí ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: γινώσκετε
  choice: ẹ mọ̀
  rationale: Àṣẹ yìí rọ àwọn olùgbọ́ láti mọ ìtumọ̀ ohun tí wọ́n rí; “ẹ mọ̀” jẹ́ ìtumọ̀ tààrà, tó sì bá àyíká mu.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: pé ó sún mọ́lé
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ Yorùbá “ó” kò fi hàn bóyá ẹni tàbí ohun ni a ń tọ́ka sí, nítorí náà ó pa àìsọ kókó-ọrọ̀ ní pàtó nínú Gíríìkì mọ́ láìfi ìtumọ̀ kan lé e lórí.
- source_word: ἐπὶ θύραις
  choice: ó wà ní ẹnu àwọn ilẹ̀kùn
  rationale: Gbólóhùn yìí fi bí ohun náà ṣe sún mọ́ tòsí gan-an hàn, ó sì pa ọ̀pọ̀ θύραις (“àwọn ilẹ̀kùn”) mọ́.
theological_decisions:
- issue: Kókó-ọrọ̀ tí a kò sọ ní gbangba nínú ἐστιν (“ó sún mọ́lé”)
  choice: Lo “ó,” èyí tí ó lè tọ́ka sí ohun tàbí ìṣẹ̀lẹ̀ tó sún mọ́lé láìsọ kókó-ọrọ̀ náà ní pàtó.
  alternative: Kà á sí ẹni pé “òun ti sún mọ́lé,” ní títọ́ka sí Ọmọ Ènìyàn.
  rationale: Gíríìkì kò sọ kókó-ọrọ̀ náà. Àìyànjú rẹ̀ nínú àkọsílẹ̀ pàtàkì ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ẹ̀yin/ẹ” láti fi ọ̀pọ̀ ẹni tí ὑμεῖς ń tọ́ka sí hàn.
