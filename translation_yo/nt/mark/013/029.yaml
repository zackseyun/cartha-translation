  to: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí i pé àwọn nǹkan wọ̀nyí ń ṣẹlẹ̀, ẹ mọ̀ pé ó ti sún mọ́lé, ó sì wà ní ẹnu àwọn ilẹ̀kùn.
  rationale: A fi ‘ti’ kún ‘sún mọ́lé’ láti fi ipò ìsúnmọ́ tí ó ti dé hàn, èyí tó bá ἐγγύς ἐστιν àti àwòrán ἐπὶ θύραις mu. A tún ṣàtúnṣe àkọsílẹ̀ ìsàlẹ̀ kí ó lè fi àṣàyàn kókó-ọrọ̀ ẹni hàn ní kedere, láìyan ẹni tí Gíríìkì kò dárúkọ.
