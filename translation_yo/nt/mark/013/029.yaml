  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìsopò ọrọ̀ náà pẹ̀lú àpẹẹrẹ igi ọ̀pọ̀tọ́ mọ́, ó dá ọ̀pọ̀ ‘àwọn nǹkan wọ̀nyí’ sí, ó sì dá àìsọ kókó-ọrọ̀ nínú ἐγγύς ἐστιν sípò. Síbẹ̀, ‘ó sún mọ́lé’ láìsí ‘ti’ lè dà bí ìṣe ìsúnmọ́ tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ ju ipò ìsúnmọ́ tí ó ti wà lọ. ‘Ó ti sún mọ́lé’ bá ìtumọ̀ ‘is near’ àti àwòrán ‘at the doors’ mu dáadáa.
  naturalness: ‘Ó sì wà ní ẹnu àwọn ilẹ̀kùn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tú àwòrán ‘at the doors’ sílẹ̀, bí ó tilẹ̀ jẹ́ pé ó tún ń sọ ìpò ìsúnmọ́ náà di mímọ̀. Fífi ‘ti’ kún un mú gbólóhùn náà rọrùn, ó sì ń dun bí Yorùbá boṣewa.
  terminology: ‘Ẹ̀yin pẹ̀lú,’ ‘àwọn nǹkan wọ̀nyí,’ àti ‘àwọn ilẹ̀kùn’ tọ́jú ìtẹnumọ́, ọ̀pọ̀, àti àwòrán Gíríìkì náà. Àkọsílẹ̀ ìsàlẹ̀ gbọ́dọ̀ ṣàlàyé yíyàn ‘òun’ gẹ́gẹ́ bí àṣàyàn ti ẹni, dípò kí ó kan tún ọ̀rọ̀-arọ́pò ‘ó’ tí ó wà nínú ìtumọ̀ àkọ́kọ́ sọ.
