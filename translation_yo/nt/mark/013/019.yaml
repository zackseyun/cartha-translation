  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: yo
  text: Nítorí ìpọ́njú yóò wà ní àwọn ọjọ́ wọ̀nyẹn, irú èyí tí kò ṣẹlẹ̀ rí láti ìbẹ̀rẹ̀ ìṣẹ̀dá tí Ọlọ́run dá títí di ìsinsin yìí[a], tí kò sì ní ṣẹlẹ̀ láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irú èyí tí kò tíì sí rí láti ìbẹ̀rẹ̀ ìṣẹ̀dá tí Ọlọ́run dá títí di ìsinsin yìí, tí kò sì ní sí láéláé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: ìpọ́njú
  rationale: “Ìpọ́njú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìyà àti wàhálà líle, ó sì bá ìtumọ̀ ọ̀rọ̀ náà nínú àsọyé nípa ìkẹyìn mu láìfi èrò ẹ̀kọ́ ìsìn kan kún un.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: irú èyí tí kò tíì ṣẹlẹ̀
  rationale: Ìtumọ̀ yìí pa ìfiwéra àti àìlẹ́gbẹ́ ìpọ́njú náà mọ́ ní Yorùbá àdánidá. Àlàyé ìsàlẹ̀ ojú ìwé fi “kò tíì sí rí” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn fún γέγονεν.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: láti ìbẹ̀rẹ̀ ìṣẹ̀dá
  rationale: Ó tẹ̀lé èdè Gíríìkì ní pẹkipẹki, ó sì jẹ́ kí gbolohun àsopọ̀ tó tẹ̀ lé e dúró kedere.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: tí Ọlọ́run dá
  rationale: A pa gbolohun àsopọ̀ náà mọ́ ní tààràtà, pẹ̀lú Ọlọ́run gẹ́gẹ́ bí ẹni tó dá ìṣẹ̀dá.
- source_word: ἕως τοῦ νῦν
  choice: títí di ìsinsin yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì péye fún àkókò tó dé báyìí.
- source_word: οὐ μὴ γένηται
  choice: kò sì ní ṣẹlẹ̀ láéláé
  rationale: “Kò ní … láéláé” mú ìkọ̀sílẹ̀ ọjọ́ iwájú tó lágbára nínú οὐ μή jáde, láìfi ọ̀rọ̀ “lẹ́ẹ̀kan sí i” tí kò sí ní tààràtà nínú Gíríìkì kún un.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: ìpọ́njú yóò wà ní àwọn ọjọ́ wọnnì
  rationale: Èdè Gíríìkì fi “àwọn ọjọ́ wọnnì” àti “ìpọ́njú” ṣe àsọtẹ́lẹ̀ ní ọ̀nà tí ó há díẹ̀; ìṣètò Yorùbá yìí mú un ṣe kedere láìyí ìtumọ̀ pé àwọn ọjọ́ náà yóò jẹ́ àkókò ìpọ́njú padà.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ọ̀rọ̀ nípa ìṣẹ̀dá
  choice: A pa “ìṣẹ̀dá tí Ọlọ́run dá” mọ́, gẹ́gẹ́ bí ìtọ́ka sí gbogbo ohun tí a dá.
  alternative: Láti ìbẹ̀rẹ̀ ayé.
  rationale: Gíríìkì lo κτίσις àti κτίζω ní kedere, ó sì sọ Ọlọ́run di olùdá. Ìtumọ̀ yìí kò dín ọ̀rọ̀ náà kù sí ìṣẹ̀lẹ̀ agbègbè kan tàbí àkókò májẹ̀mú kan, bẹ́ẹ̀ ni kò fi ètò ìtumọ̀ nípa ìkẹyìn kan lé e lórí.
- issue: Ìtumọ̀ ìkọ̀sílẹ̀ ọjọ́ iwájú
  choice: “kò sì ní ṣẹlẹ̀ láéláé”
  alternative: “kò sì ní ṣẹlẹ̀ mọ́ láéláé”
  rationale: A kò fi “mọ́” tàbí “lẹ́ẹ̀kan sí i” kún un, nítorí οὐ μὴ γένηται ń sọ pé kò ní ṣẹlẹ̀ ní ọjọ́ iwájú, ṣùgbọ́n kò ní ọ̀rọ̀ tó túmọ̀ sí “again” ní tààràtà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; “àwọn ọjọ́ wọnnì” tọ́ka sí àwọn ọjọ́ tí a ti mẹ́nu kàn tẹ́lẹ̀.
