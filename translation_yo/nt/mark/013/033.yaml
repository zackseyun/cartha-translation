  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: yo
  text: Ẹ máa ṣọ́ra; ẹ máa wà lójúfò[a], nítorí ẹ kò mọ ìgbà tí àkókò náà yóò dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ máa ṣọ́nà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí jíjí láìsùn tàbí wíwà ní ìmúrasílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Ẹ máa ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ni, tí ó jẹ́ ìkìlọ̀ láti kíyè sí ewu, kì í ṣe wíwo lójú lasán; ó sì yàtọ̀ sí àṣẹ ἀγρυπνεῖτε tí ó tẹ̀ lé e.
- source_word: ἀγρυπνεῖτε
  choice: ẹ máa wà lójúfò
  rationale: Ó túmọ̀ sí láti máa ṣọ́nà láìsí àìfiyèsí; èdè yìí jẹ́ ti àdánidá ní Yorùbá, ó sì pa àwòrán jíjí àti ìṣọ́ra mọ́.
- source_word: οὐκ οἴδατε
  choice: ẹ kò mọ
  rationale: Ó ṣe àfihàn ìkọ̀ tí ó rọrùn, láìfi ìtumọ̀ míì kún un.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi ìdí àwọn àṣẹ tó ṣáájú múlẹ̀ ní èdè Yorùbá àdánidá.
- source_word: πότε
  choice: ìgbà tí
  rationale: Ó tọ́ka sí àkókò tí ohun náà yóò ṣẹlẹ̀.
- source_word: ὁ καιρός
  choice: àkókò náà
  rationale: καιρός lè jẹ́ àkókò pàtàkì tàbí àkókò tí a yàn; “àkókò náà” pa ìtumọ̀ rẹ̀ mọ́ láìfipá yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí.
- source_word: ἐστιν
  choice: yóò dé
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ àsìkò ìsinsìnyí, “ìgbà tí àkókò náà yóò dé” ni ọ̀nà Yorùbá àdánidá láti sọ ìbéèrè nípa àkókò ìṣẹ̀lẹ̀ ọjọ́ iwájú nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ καιρός nínú ọ̀rọ̀ nípa ohun tó máa ṣẹlẹ̀ ní ọjọ́ iwájú
  choice: àkókò náà
  alternative: àkókò tí a yàn; àsìkò náà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àsìkò pàtàkì tàbí tí a ti yàn. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ kí ìtumọ̀ náà gbòòrò, akọsilẹ̀ sì ṣàlàyé àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀ àti ti òde òní. A lo àṣẹ ọ̀pọ̀ ènìyàn “Ẹ” gẹ́gẹ́ bí ó ṣe wà nínú Gíríìkì.
