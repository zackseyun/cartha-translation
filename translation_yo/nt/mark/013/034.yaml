  terminology: “Ẹrú” jẹ́ ìtumọ̀ tó bojúmu fún δούλοι nínú àpèjúwe agbo ilé yìí, ó sì bá ìpinnu audit Gẹ̀ẹ́sì mu. “Àṣẹ,” “iṣẹ́,” àti “olùṣọ́ ẹnu-ọ̀nà” tún jẹ́ àwọn ọ̀rọ̀ tó yẹ fún ἐξουσία, ἔργον, àti θυρωρός.
