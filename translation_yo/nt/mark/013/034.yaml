  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ọkùnrin náà kúrò ní ilé, ó fi àṣẹ fún àwọn ẹrú rẹ̀, ó pín iṣẹ́ fún ẹnì kọ̀ọ̀kan, ó sì pàṣẹ fún olùṣọ́ ẹnu-ọ̀nà. Ṣùgbọ́n “lọ sí òkèèrè” lè dín ἀπόδημος kù sí ìrìn-àjò lọ sí ilẹ̀ òkèèrè, nígbà tí ọ̀rọ̀ náà lè kan wíwà ní ìrìn-àjò/jìnnà sí ilé. Bákan náà, γρηγορῇ ń tẹnumọ́ wíwà lójúfò, kì í ṣe ṣíṣọ́nà nìkan.'
