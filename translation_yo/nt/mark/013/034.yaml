id: MRK.13.34
reference: Mark 13:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: yo
  text: Ó dàbí ọkùnrin kan tí ó lọ sí ìrìn àjò, tí ó fi ilé rẹ̀ sílẹ̀, tí ó sì fi àṣẹ fún àwọn ẹrú rẹ̀, ó sì fún olúkúlùkù ní iṣẹ́ tirẹ̀, ó sì pàṣẹ fún olùṣọ́ ẹnu-ọ̀nà kí ó máa wà lójúfò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: Ó dàbí
  rationale: Ó mú àfiwé tí èdè Gíríìkì bẹ̀rẹ̀ jáde ní Yorùbá àdánidá, láìfi ìtumọ̀ tuntun kún un.
- source_word: ἄνθρωπος ἀπόδημος
  choice: ọkùnrin kan tó rin ìrìn àjò lọ sí òkèèrè
  rationale: ἄνθρωπος ń tọ́ka sí ọkùnrin kan nínú àpèjúwe náà, ἀπόδημος sì fi hàn pé ó kúrò ní ilé tàbí ní ilẹ̀ rẹ̀ fún ìrìn àjò.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: tó fi ilé rẹ̀ sílẹ̀
  rationale: Èyí ṣàfihàn ìṣe participle náà ní ọ̀nà tó ṣe déédé ní Yorùbá, ó sì pa ìtumọ̀ οἰκία gẹ́gẹ́ bí ilé mọ́.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: tó sì fi àṣẹ fún àwọn ẹrú rẹ̀
  rationale: “Fi ... fún” bá δοὺς mu, “àṣẹ” sì ṣàfihàn agbára tàbí ẹ̀tọ́ tí a yàn fún wọn. “Àwọn ẹrú” pa ipò ìdè tí δοῦλοι lè túmọ̀ sí mọ́ nínú agbo ilé ọ̀gá.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ó fún olúkúlùkù ní iṣẹ́ tirẹ̀
  rationale: Ó pa ìpín iṣẹ́ fún ẹnì kọ̀ọ̀kan mọ́, ó sì mú gbólóhùn elliptical ti Gíríìkì ṣe kedere ní Yorùbá láìṣe àfikún ìtumọ̀.
- source_word: τῷ θυρωρῷ
  choice: olùṣọ́ ẹnu ọ̀nà
  rationale: Ó túmọ̀ ẹni tí ń ṣọ́ ẹnu ọ̀nà ilé ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: ó pàṣẹ ... pé kó máa ṣọ́nà
  rationale: “Pàṣẹ” pa agbára ἐνετείλατο mọ́; “máa ṣọ́nà” gba ìtumọ̀ jíjíròrò àti wíwà lójúfò ti γρηγορέω, ó sì bá iṣẹ́ olùṣọ́ ẹnu ọ̀nà mu.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àpèjúwe agbo ilé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú àwòrán ọ̀gá ilé tó ń pín àṣẹ fún àwọn tó wà lábẹ́ rẹ̀, “ẹrú” ṣàfihàn ìbáṣepọ̀ ìdè àti àṣẹ tí ọ̀rọ̀ Gíríìkì náà ní, láìrọ̀ ọ́ sí “ìránṣẹ́.”
- issue: Ìtumọ̀ γρηγορῇ
  choice: kó máa ṣọ́nà
  alternative: kó máa wà lójúfò; kó má ṣe sùn
  rationale: Nínú ọ̀rọ̀ nípa olùṣọ́ ẹnu ọ̀nà, “ṣọ́nà” jẹ́ àdánidá, ó sì pa ìtumọ̀ ìṣọ́ra àti jíjí mọ́; kò fi dandan sọ pé àìsùn nípa ti ara nìkan ni.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “tó” àti “kó” gẹ́gẹ́ bí ìkékúrú ọ̀rọ̀ tó wọ́pọ̀ nínú Yorùbá ìkọ̀wé òde òní.
