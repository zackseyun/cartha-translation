revisions:
- from: Ó dàbí ọkùnrin kan tó rin ìrìn àjò lọ sí òkèèrè, tó fi ilé rẹ̀ sílẹ̀, tó sì fi àṣẹ fún àwọn ẹrú rẹ̀—ó fún olúkúlùkù ní iṣẹ́ tirẹ̀—ó sì pàṣẹ fún olùṣọ́ ẹnu ọ̀nà pé kó máa ṣọ́nà.
  to: Ó dàbí ọkùnrin kan tí ó lọ sí ìrìn àjò, tí ó fi ilé rẹ̀ sílẹ̀, tí ó sì fi àṣẹ fún àwọn ẹrú rẹ̀, ó sì fún olúkúlùkù ní iṣẹ́ tirẹ̀, ó sì pàṣẹ fún olùṣọ́ ẹnu-ọ̀nà kí ó máa wà lójúfò.
