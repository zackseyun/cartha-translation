id: MRK.13.11
reference: Mark 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: yo
  text: Nígbà tí wọ́n bá sì mú yín lọ, tí wọ́n sì fi yín lé ọwọ́ àwọn aláṣẹ[a], ẹ má ṣe ṣàníyàn ṣáájú nípa ohun tí ẹ ó sọ. Ṣùgbọ́n ohunkóhun tí a bá fún yín ní wákàtí náà, ohun náà ni kí ẹ sọ. Nítorí ẹ̀yin kọ́ ni ẹ ń sọ̀rọ̀[b], bí kò ṣe Ẹ̀mí Mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “mú yín lọ ní fífi yín lé ọwọ́ àwọn aláṣẹ.” Ọ̀rọ̀ kejì nínú Gíríìkì jẹ́ participle, ó sì lè ṣàlàyé bí mímú wọn lọ ṣe ń ṣẹlẹ̀.
    reason: syntactical_alternative
  - marker: b
    text: Gíríìkì lo onírúurú fọ́ọ̀mù ọ̀rọ̀ kan náà, λαλέω (“sọ̀rọ̀/sọ”), nínú “ohun tí ẹ ó sọ,” “kí ẹ sọ,” àti “ẹ ń sọ̀rọ̀.”
    reason: lexical_note
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Nígbà tí ... bá sì
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú, ó sì fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ó ṣeé retí hàn láì sọ pé yóò ṣẹlẹ̀ ní gbogbo ìgbà.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: mú yín lọ, tí wọ́n sì fi yín léni lọ́wọ́
  rationale: “Mú ... lọ” fi ìgbésẹ̀ tí a fi agbára ṣe hàn; “fi ... léni lọ́wọ́” sì pa ìtumọ̀ fífi ẹni lé àwọn tó ní àṣẹ lọ́wọ́ mọ́. A yí participle Gíríìkì padà sí gbólóhùn alárìnàkò méjì fún Yorùbá àdánidá.
- source_word: μὴ προμεριμνᾶτε
  choice: ẹ má ṣe ṣàníyàn ṣáájú
  rationale: Ó pa ìtumọ̀ àníyàn tí ènìyàn ń ṣe kí ìṣẹ̀lẹ̀ tó dé mọ́, pẹ̀lú agbára ìṣáájú tó wà nínú προ-.
- source_word: τί λαλήσητε
  choice: ohun tí ẹ ó sọ
  rationale: “Sọ” ni ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu jù fún λαλέω nínú àyíká yìí.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: ohunkóhun tí a bá fi fún yín
  rationale: A pa ìṣe aláìlórúkọ mọ́, kí a má bàa sọ ẹni tó fún wọn ní ọ̀rọ̀ náà ní kedere ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ní wákàtí náà
  rationale: Ó tẹ̀ lé àwòrán “wákàtí” inú orísun, ó sì dára gẹ́gẹ́ bí ọ̀rọ̀ ọlọ́lá nínú Yorùbá Bíbélì.
- source_word: τοῦτο λαλεῖτε
  choice: ohun náà ni kí ẹ sọ
  rationale: 'Ìṣètò yìí tẹnu mọ́ τοῦτο: ohun gan-an tí a bá fi fún wọn ni kí wọ́n sọ.'
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: Nítorí ẹ̀yin kọ́ ni ẹ ń sọ̀rọ̀
  rationale: “Ẹ̀yin kọ́” pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς àti ìyàtọ̀ tó tẹ̀ lé e mọ́ ní Yorùbá àdánidá.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni orúkọ àdánidá, ọlọ́lá, tí a sábà máa ń lò ní Yorùbá fún ẹni mímọ́ tí ẹsẹ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Ipa Ẹ̀mí Mímọ́ àti ipa àwọn ọmọ-ẹ̀yìn nínú ọ̀rọ̀ tí wọ́n máa sọ nígbà inúnibíni
  choice: A pa ìṣe aláìlórúkọ “a bá fi fún yín” àti ìyàtọ̀ “ẹ̀yin kọ́ ... bí kò ṣe Ẹ̀mí Mímọ́” mọ́, nígbà tí àṣẹ “kí ẹ sọ” ṣi fi hàn pé àwọn ọmọ-ẹ̀yìn gan-an ló ń sọ ọ̀rọ̀ náà.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé àwọn ọmọ-ẹ̀yìn kò ní ipa rárá, tàbí bí ẹni pé Ẹ̀mí Mímọ́ kàn jẹ́ agbára tàbí ìmọ̀lára kan.
  rationale: Gíríìkì náà fi iṣẹ́ Ọlọ́run àti ìkópa ènìyàn sí ẹ̀gbẹ́ ara wọn; ìtumọ̀ kò gbọ́dọ̀ mú ọ̀kan parẹ́ nítorí èkejì.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtúmọ̀ náà yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan, ó sì pa ìtẹnumọ́, ìṣe aláìlórúkọ, àti ìforígbárí iṣẹ́ Ẹ̀mí àti ìkópa ènìyàn mọ́.
