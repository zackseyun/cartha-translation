revisions:
- from: Nígbà tí wọ́n bá sì mú yín lọ, tí wọ́n sì fi yín léni lọ́wọ́[a], ẹ má ṣe ṣàníyàn ṣáájú nípa ohun tí ẹ ó sọ. Ṣùgbọ́n ohunkóhun tí a bá fi fún yín ní wákàtí náà, ohun náà ni kí ẹ sọ. Nítorí ẹ̀yin kọ́ ni ẹ ń sọ̀rọ̀[b], bí kò ṣe Ẹ̀mí Mímọ́.
  to: Nígbà tí wọ́n bá sì mú yín lọ, tí wọ́n sì fi yín lé ọwọ́ àwọn aláṣẹ[a], ẹ má ṣe ṣàníyàn ṣáájú nípa ohun tí ẹ ó sọ. Ṣùgbọ́n ohunkóhun tí a bá fún yín ní wákàtí náà, ohun náà ni kí ẹ sọ. Nítorí ẹ̀yin kọ́ ni ẹ ń sọ̀rọ̀[b], bí kò ṣe Ẹ̀mí Mímọ́.
  rationale: A ṣàtúnṣe ìsọ̀rọ̀ Yorùbá méjì nìkan. Àfikún ‘àwọn aláṣẹ’ nínú ‘fi yín lé ọwọ́ àwọn aláṣẹ’ ṣàlàyé ìtumọ̀ ìgbẹ́jọ́ tí παραδιδόντες ní nínú àyíká ẹsẹ̀, láì sọ ẹni pàtó kan. A sì rọ́pò ‘a bá fi fún yín’ pẹ̀lú ‘a bá fún yín’ kí passive náà lè jẹ́ Yorùbá àdánidá, nígbà tí a kò dárúkọ ẹni tó ń fún wọn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:22:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtòlẹ́sẹẹsẹ ìtumọ̀ Gíríìkì mọ́ dáadáa: ìgbà tí a ó mú wọn lọ tí a sì ń fi wọn lé ọwọ́, àṣẹ pé kí wọ́n má ṣàníyàn ṣáájú, ohun tí a ó fún wọn ní wákàtí náà, àti ìyàtọ̀ láàárín àwọn ọmọ-ẹ̀yìn àti Ẹ̀mí Mímọ́. Síbẹ̀, ‘fi yín léni lọ́wọ́’ kò pé gẹ́gẹ́ bí gbolohun Yorùbá; ó nílò olùgbà tàbí àfikún míì.'
  naturalness: ‘Fi yín lé ọwọ́ àwọn aláṣẹ’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti ṣàfihàn fífi ẹni lé ọwọ́ àwọn tó ní àṣẹ nínú àyíká ìgbẹ́jọ́. ‘Ohunkóhun tí a bá fún yín’ sì jẹ́ gbolohun aláìlórúkọ tó rọrùn, tó sì pé ju ‘tí a bá fi fún yín’ lọ níbi yìí.
  terminology: ‘Ẹ̀mí Mímọ́’ yẹ, ó sì jẹ́ ọ̀rọ̀ ìsìn Yorùbá boṣewa. ‘Ṣàníyàn ṣáájú,’ ‘wákàtí náà,’ àti ‘sọ̀rọ̀’ dáa. Àwọn àtúnṣe náà kò dá ìtúmọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
  issues:
  - severity: medium
    issue: ‘fi yín léni lọ́wọ́’
    rationale: Ìṣọ̀kan ‘léni’ kò bá arọ́pò-orúkọ ‘yín’ mu, gbolohun náà sì kò sọ ẹni tí a fi wọn lé lọ́wọ́. Èyí mú kí ìtumọ̀ παραδιδόντες di aláìpé nínú Yorùbá.
  - severity: low
    issue: ‘ohunkóhun tí a bá fi fún yín’
    rationale: Pẹ̀lú ‘ohunkóhun’ gẹ́gẹ́ bí ohun tí a ń fún, ‘a bá fún yín’ ni ọ̀nà Yorùbá tó pé, tó sì pa passive Gíríìkì mọ́.
