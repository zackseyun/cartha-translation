  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn èrò pàtàkì Gíríìkì mọ́: ìkórìíra látọ̀dọ̀ gbogbo ènìyàn nítorí orúkọ Jesu, fífaradà dé òpin, àti ìlérí pé ẹni bẹ́ẹ̀ ni a ó gbà là. Ṣùgbọ́n “fara dà á” fi ohun kan (“á”) tí kò hàn nínú orísun kún un, ó sì kéré sí “faradà” ní ìbámu pẹ̀lú ὑπομείνας.'
