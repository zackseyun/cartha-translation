source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: yo
  text: Gbogbo ènìyàn yóò sì kórìíra yín nítorí orúkọ mi.[a] Ṣùgbọ́n ẹni tí ó bá faradà títí dé òpin,[b] òun ni a ó gbà là.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí mi” tàbí “nítorí orúkọ mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó bá dúró ṣinṣin títí dé òpin.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a ó yọ kúrò nínú ewu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdáǹdè kúrò nínú ewu tàbí ìgbàlà; àyíká ọ̀rọ̀ kò fi gbogbo ìtumọ̀ rẹ̀ mọ́ ọ̀kan ṣoṣo.
    reason: alternative_reading
  - marker: d
    text: 'Ní ọ̀nà tó sún mọ́ ìtòlẹ́sẹẹsẹ Gíríìkì: “ẹni tí ó bá faradà títí dé òpin, ẹni náà ni a ó gbà là.”'
    reason: previous_rendering
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: Gbogbo ènìyàn yóò sì kórìíra yín
  rationale: Ọ̀rọ̀ yìí sọ ìkórìíra ọjọ́ iwájú ní ọ̀nà àdánidá ní Yorùbá, ó sì pa bí πάντων ṣe gbòòrò mọ́ láì dín in kù.
- source_word: διὰ τὸ ὄνομά μου
  choice: nítorí orúkọ mi
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ìdí; “orúkọ mi” sì pa àwòrán orísun mọ́, níbi tí orúkọ ti dúró fún ẹni Jesu, àṣẹ rẹ̀, àti ìfaramọ́ sí i.
- source_word: ὁ δὲ ὑπομείνας
  choice: Ṣùgbọ́n ẹni tí ó bá fara dà á
  rationale: “Fara dà á” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún dídúró ṣinṣin lábẹ́ ìnira; ohun arọ́pò “á” ń tọ́ka sí ìpọ́njú àti ìkórìíra inú ọ̀rọ̀.
- source_word: εἰς τέλος
  choice: dé òpin
  rationale: Ó pa ìtẹ̀síwájú títí dé ibi ìparí mọ́, láì pinnu bóyá òpin ìdánwò, ìgbésí ayé, tàbí òpin ìgbà ni.
- source_word: οὗτος
  choice: òun ni
  rationale: “Òun ni” ń pa ìtẹnumọ́ arọ́pò resumptive náà mọ́ ní Yorùbá tó ṣe déédé, láì mú gbolohun náà le.
- source_word: σωθήσεται
  choice: a ó gbà là
  rationale: “Gbà là” lè tọ́ka sí ìdáǹdè tàbí ìgbàlà ní ìtumọ̀ tó jinlẹ̀, nítorí náà ó pa ààyè ìtumọ̀ σῴζω àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú àyíká ọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ σωθήσεται nínú ọ̀rọ̀ nípa fífaradà
  choice: a ó gbà là
  alternative: a ó dá sílẹ̀ / a ó yọ kúrò nínú ewu
  rationale: Yíyan “gbà là” kò fi ọ̀rọ̀ náà mọ́ ìdáǹdè ti ara nìkan, bẹ́ẹ̀ ni kò sọ ọ́ di ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan nípa fífaradà; ó pa ìtumọ̀ ìgbàlà àti ìdáǹdè méjèèjì sílẹ̀.
- issue: Ìwọ̀n πάντων
  choice: Gbogbo ènìyàn
  alternative: gbogbo wọn
  rationale: A pa ọ̀rọ̀ tó gbòòrò ti Gíríìkì mọ́ láì fi àlàyé tí kò sí nínú orísun kún un; àyíká ọ̀rọ̀ ló máa darí bí a ṣe lóye rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìtòlẹ́sẹẹsẹ “òun ni” pa ìtẹnumọ́ οὗτος mọ́, nígbà tí gbolohun náà ṣì ń ṣàn dáadáa.
