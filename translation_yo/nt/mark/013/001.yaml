  source_fidelity: 'Àkọ́lé náà ń tẹ̀lé ìbẹ̀rẹ̀ gbólóhùn Gíríìkì dáadáa: jíjáde Jésù, ọ̀kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀, àti ìpè náà sí Olùkọ́. Ṣùgbọ́n ìpín ìkẹyìn yí ìtumọ̀ ποταποὶ ... ποταπαὶ padà nípa lílo àpèjúwe méjì tí kò dọ́gba—“ńláńlá” fún òkúta, “ológo” fún ilé—níbi tí Gíríìkì ti tún ọ̀rọ̀ ìyàlẹ́nu kan náà ṣe fún méjèèjì. Gbólóhùn “mà lèyí” kò sì dára ní Yorùbá nínú àyíká yìí.'
