source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: yo
  text: Bí ó sì ti ń jáde kúrò ní tẹ́ńpìlì[a], ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀ sọ fún un pé, “Olùkọ́, wò ó—àwọn òkúta wọ̀nyí lẹ́wà́ tó, àti àwọn ilé wọ̀nyí lẹ́wà́ tó!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Irú àwọn òkúta wo ni wọ̀nyí, àti irú àwọn ilé wo ni wọ̀nyí!” Ọ̀rọ̀ Gíríìkì náà ń fi ìyàlẹ́nu tàbí ìmọrírì hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Bí ó sì ti ń jáde
  rationale: Ọ̀rọ̀ yìí fi hàn pé jíjáde rẹ̀ ń lọ lọ́wọ́ ní àkókò tí ọmọ-ẹ̀yìn náà ń sọ̀rọ̀; ìtumọ̀ yìí sì bá èdè Yorùbá àdánidá mu.
- source_word: τοῦ ἱεροῦ
  choice: kúrò ní àgbàlá tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “àgbàlá tẹ́ńpìlì” mú ìyàtọ̀ yẹn hàn ní kedere.
- source_word: λέγει
  choice: sọ fún un
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí gẹ́gẹ́ bí historical present, ìtàn Yorùbá máa ń lo ọ̀rọ̀-àṣe tí ó parí ní irú àyíká yìí; “sọ fún un” jẹ́ àdánidá, ó sì pa ìṣe náà mọ́.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá fún gbólóhùn apá-kúrò-nínú-àpapọ̀ náà.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ ìpè yìí túmọ̀ sí ẹni tí ń kọ́ni; “Olùkọ́” ṣe kedere, kò sì fi ìtumọ̀ míì tí kò sí nínú Gíríìkì kún un.
- source_word: ἴδε
  choice: wò ó
  rationale: Àṣẹ náà ń pe àfiyèsí sí ohun tí ọmọ-ẹ̀yìn náà rí; “wò ó” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bẹ́ẹ̀.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: àwọn òkúta ńláńlá àti àwọn ilé ológo mà lèyí
  rationale: ποταπός jẹ́ ọ̀rọ̀ ìyàlẹ́nu tàbí ìmọrírì nípa bí ohun ṣe tóbi tàbí ṣe dára. Ilana Yorùbá “mà lèyí” mú ìyàlẹ́nu náà jáde, nígbà tí “ńláńlá” àti “ológo” bá àwọn orúkọ tí wọ́n ń ṣàpèjúwe mu.
- source_word: λίθοι
  choice: àwọn òkúta
  rationale: Ìtumọ̀ tààrà ni, ó sì tó nítorí àyíká ti fi hàn pé òkúta tẹ́ńpìlì ni.
- source_word: οἰκοδομαί
  choice: àwọn ilé
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ilé tàbí àwọn ohun tí a kọ́ nínú àgbègbè tẹ́ńpìlì; “àwọn ilé” rọrùn, ó sì yé òǹkàwé lónìí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Àgbàlá tẹ́ńpìlì” yà ἱερόν sọ́tọ̀ kúrò ní ibi mímọ́ inú tẹ́ńpìlì. Gbólóhùn ìkẹyìn lo “mà lèyí” láti mú ohùn ìyàlẹ́nu àti ìmọrírì Gíríìkì jáde ní Yorùbá àdánidá.
