id: MRK.13.14
reference: Mark 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹ bá rí “ohun ìríra ìsọdahoro” tí ó dúró ní ibi tí kò yẹ kí ó dúró (kí ẹni tí ń kà á lóye)[a], nígbà náà, kí àwọn tí ó wà ní Jùdíà sá lọ sí àwọn òkè ńlá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè lóye apá yìí pé, “ẹni náà dúró ní ibi tí kò yẹ kí ó dúró.” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “tí ó dúró” wà ní ẹ̀yà akọ, èyí tí ó lè fi hàn pé ẹni kan wà lẹ́yìn “ohun ìríra” náà.
    reason: alternative_reading
  - marker: b
    text: “Ohun ìríra ìsọdahoro” ń ṣe ìrántí ọ̀rọ̀ inú ìwé Dáníẹ́lì (wo Dan. 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: “Nígbà tí” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí hàn, “ṣùgbọ́n” sì jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìkìlọ̀ tí ó ṣáájú síwájú.
- source_word: ἴδητε
  choice: ẹ bá rí
  rationale: Ìṣètò “nígbà tí ẹ bá rí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi gbólóhùn àkókò oníṣíṣe tí kò tíì ṣẹlẹ̀ hàn.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ohun ìríra ìsọdahoro
  rationale: Ó pa ìtumọ̀ tó sún mọ́ orísun àti ìtọ́kasí sí ìwé Dáníẹ́lì mọ́, láì pinnu bóyá ohun, ìṣe, tàbí ẹni kan pàtó ni gbólóhùn náà ń tọ́ka sí.
- source_word: ἑστηκότα
  choice: tí ó dúró
  rationale: Ó fi ipò tí ohun tàbí ẹni náà wà nígbà tí a rí i hàn, bí àbájáde dídúró tàbí gbígbé e síbẹ̀.
- source_word: ὅπου οὐ δεῖ
  choice: ní ibi tí kò yẹ kí ó dúró
  rationale: Ó sọ àìyẹ ipò náà ní Yorùbá àdánidá, láì sọ ibi pàtó tàbí irú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: kí ẹni tí ń kà á lóye
  rationale: Ó pa àṣẹ inú àkámọ́ náà mọ́, ó sì ṣe kedere pé ẹni tó ń ka ọ̀rọ̀ náà ni a ń gbà níyànjú láti lóye.
- source_word: τότε
  choice: nígbà náà
  rationale: Ó samisi ohun tí àwọn ènìyàn gbọdọ̀ ṣe lẹ́yìn tí àmì náà bá farahàn.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: àwọn tí ó wà ní Jùdíà
  rationale: Ó pa àgbègbè tí orísun dárúkọ mọ́ ní ọ̀nà tó ṣe kedere.
- source_word: φευγέτωσαν
  choice: kí ... sá lọ
  rationale: Ìṣètò yìí fi àṣẹ kánjúkánjú ẹni kẹta ọ̀pọ̀ hàn ní Yorùbá àdánidá.
- source_word: εἰς τὰ ὄρη
  choice: sí àwọn òkè ńlá
  rationale: “Àwọn òkè ńlá” jẹ́ ìtumọ̀ tààrà tí ó bá àwòrán ilẹ̀ orísun mu.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn Dáníẹ́lì, βδέλυγμα τῆς ἐρημώσεως
  choice: A lo “ohun ìríra ìsọdahoro” láì sọ ohun, ìṣe, tàbí ẹni pàtó tí ó ń tọ́ka sí.
  alternative: “ohun ìríra tí ń fa ìsọdahoro” tàbí “ẹ̀ṣẹ̀ ìbàjẹ́ apanirun”
  rationale: Orísun lè tọ́ka sí ohun, ìṣe, tàbí ẹni kan, ìtumọ̀ rẹ̀ sì jẹ́ ohun tí a ń jíròrò. Ìtumọ̀ náà pa àìdánilójú àti ìró Dáníẹ́lì mọ́.
- issue: Ẹ̀yà akọ ἑστηκότα lẹ́gbẹ̀ẹ́ ọ̀rọ̀ aláìlẹ́yà akọ tàbí abo βδέλυγμα
  choice: A lo arọ́pò-orúkọ “ó,” èyí tí kò fi akọ tàbí abo hàn ní Yorùbá, a sì ṣàlàyé ìtọ́kasí sí ẹni kan nínú àlàyé ìsàlẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní kedere bí “ẹni náà dúró ní ibi tí kò yẹ kí ó dúró.”
  rationale: Gíríìkì lè tọ́ka sí ẹni kan lẹ́yìn “ohun ìríra,” ṣùgbọ́n kò dájú. Yorùbá jẹ́ kí a pa àìdánilójú náà mọ́ láì mú ọ̀rọ̀ nira.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà jẹ́ kíkà fún ará ìjọ àti òǹkàwé lásán, ó sì pa ìkìlọ̀ kánjúkánjú àti àìdánilójú orísun mọ́.
