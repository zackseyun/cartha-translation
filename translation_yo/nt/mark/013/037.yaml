base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: yo
  text: 'Ohun tí mo sì ń sọ fún yín ni mo ń sọ fún gbogbo ènìyàn: Ẹ máa wà lójúfò[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa ṣọ́nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ẹyọ kan ni a lò bí ọ̀rọ̀-orúkọ; “Ohun tí” mú ìtumọ̀ àkójọpọ̀ rẹ̀ jáde lọ́nà Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́, kì í ṣe ìtakora líle; “sì” so gbólóhùn náà mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó jẹ́ ẹni-kejì ọ̀pọ̀, ó sì kọ́kọ́ tọ́ka sí àwọn ọmọ-ẹ̀yìn tí Jésù ń bá sọ̀rọ̀.
- source_word: λέγω ... λέγω
  choice: mo ń sọ ... mo ń sọ
  rationale: A pa àtúnwí Gíríìkì mọ́ láti fi ìtẹnumọ́ àti ìṣètò ọ̀rọ̀ náà hàn; àmì ìṣe “ń” tún bá ìṣe tí ó wà lọ́wọ́ mu.
- source_word: πᾶσιν
  choice: fún gbogbo ènìyàn
  rationale: “Gbogbo ènìyàn” mú agbára àkópọ̀ ọ̀rọ̀ náà hàn ní Yorùbá tó ṣe kedere, láì dín un kù sí àwọn olùgbọ́ lẹ́sẹ̀kẹsẹ̀ nìkan.
- source_word: γρηγορεῖτε
  choice: Ẹ máa ṣọ́ra
  rationale: Àṣẹ ọ̀pọ̀ ní àsìkò ìsinsìnyí ń béèrè fún ìṣọ́ra tí ń bá a lọ. “Ẹ máa ṣọ́ra” jẹ́ Yorùbá àdánidá fún ìwà títají àti wíwà lójúfò, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè tún túmọ̀ sí kí ènìyàn má ṣe sùn tàbí kí ó máa ṣọ́nà.
theological_decisions:
- issue: Ààlà àwọn tí ìkìlọ̀ Jésù kan
  choice: Ọ̀rọ̀ tí a kọ́kọ́ sọ fún àwọn ọmọ-ẹ̀yìn ni a mú dé ọ̀dọ̀ gbogbo ènìyàn ní kedere.
  alternative: A lè ka ọ̀rọ̀ náà bí èyí tó kan àwọn olùgbọ́ Jésù lẹ́sẹ̀kẹsẹ̀ nínú ìtàn náà nìkan.
  rationale: Gíríìkì fi “fún yín” àti “fún gbogbo” sí ìyàtọ̀ kedere; ìtumọ̀ náà pa agbára àgbáyé yìí mọ́ láì pinnu síwájú sí i nípa gbogbo ìlò ẹ̀kọ́ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé lásán. A lo “Ẹ” fún àṣẹ ọ̀pọ̀, a sì pa àtúnwí inú orísun mọ́.
