  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: yo
  text: Ọ̀run àti ayé yóò kọjá lọ, ṣùgbọ́n ọ̀rọ̀ mi kì yóò kọjá lọ láéláé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘kì yóò kọjá lọ rárá’ tàbí ‘kì yóò kọjá lọ ní ọ̀nà kankan.’ Èdè Gíríìkì lo ìkọ̀ tí ó ní ìtẹnumọ́ gidigidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Ọ̀run
  rationale: Nínú ìsọ àsọtẹ́lẹ̀ yìí, tí a ti so ọ̀run pọ̀ mọ́ ayé, ọ̀run túmọ̀ sí apá ọ̀run nínú gbogbo ohun tí a dá, kì í ṣe ojú ọ̀run tí a rí nìkan.
- source_word: ἡ γῆ
  choice: ayé
  rationale: Nínú gbólóhùn ‘ọ̀run àti ayé,’ γῆ ń tọ́ka sí ayé gẹ́gẹ́ bí apá gbogbo ohun tí a dá, kì í ṣe ilẹ̀ agbègbè kan pàtó.
- source_word: παρελεύσονται
  choice: yóò kọjá lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ohun kan yóò kọjá lọ tàbí dé òpin; ‘kọjá lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì fi irú bí ìkọjá náà yóò ṣe rí kún ọ̀rọ̀ orísun.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín bí ọ̀run àti ayé yóò ṣe kọjá lọ àti bí ọ̀rọ̀ Jésù kò ṣe ní kọjá lọ.
- source_word: οἱ λόγοι μου
  choice: ọ̀rọ̀ mi
  rationale: Ní Yorùbá, ‘ọ̀rọ̀ mi’ lè ṣàpèjúwe àwọn ọ̀rọ̀ tàbí àwọn àsọjáde Jésù lọ́nà àdánidá, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀.
- source_word: οὐ μὴ παρελεύσονται
  choice: kì yóò kọjá lọ láéláé
  rationale: Àkójọpọ̀ οὐ μή pẹ̀lú ọ̀rọ̀ ọjọ́ iwájú jẹ́ ìkọ̀ tí a tẹnumọ́ gidigidi. ‘Kì yóò … láéláé’ mú agbára ìtẹnumọ́ yẹn jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Agbára ìkọ̀ tí Jésù fi sọ pé ọ̀rọ̀ rẹ̀ kò ní kọjá lọ
  choice: A túmọ̀ ọ́ pẹ̀lú ìtẹnumọ́ gbangba pé ‘kì yóò kọjá lọ láéláé.’
  alternative: ‘kò lè kọjá lọ rárá’ tàbí ‘kì yóò kọjá lọ ní ọ̀nàkọnà’
  rationale: Èyí pa ìyàtọ̀ líle mọ́ láàárín bí ohun tí a dá ṣe lè kọjá lọ àti bí ọ̀rọ̀ Jésù ṣe dúró ṣinṣin, láìfi ẹ̀kọ́ ẹ̀sìn mìíràn tí kò sí nínú ọ̀rọ̀ orísun kún un.
translation_notes:
  register: Èdè Yorùbá tó bófin mu, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo ‘ọ̀run àti ayé’ gẹ́gẹ́ bí gbólóhùn tí Yorùbá mọ̀, a sì lo ‘láéláé’ láti mú ìtẹnumọ́ ìkọ̀ Gíríìkì jáde.
