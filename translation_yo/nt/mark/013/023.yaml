  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin, ẹ máa ṣọ́ra[a]; mo ti sọ ohun gbogbo fún yín ṣáájú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ wà lójúfò” tàbí “ẹ rí i dájú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “mo ti sọ gbogbo nǹkan ṣáájú” tàbí “mo ti kìlọ̀ fún yín nípa ohun gbogbo ṣáájú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ẹni kejì ọ̀pọ̀ yìí hàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́; “ẹ̀yin” pa ìyàtọ̀ àti ìtẹnumọ́ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tàbí ìyípadà ọ̀rọ̀ hàn sí ohun tí ó ṣáájú; “Ṣùgbọ́n” bá ìkìlọ̀ inú àyíká ọ̀rọ̀ mu.
- source_word: βλέπετε
  choice: ẹ máa ṣọ́ra
  rationale: Àṣẹ ìsinsìnyí fún ọ̀pọ̀ ènìyàn ni, tí ó ń pe wọ́n láti wà lójúfò nígbà gbogbo; “ẹ máa ṣọ́ra” jẹ́ Yorùbá àdánidá tí ó pa ìtẹnumọ́ ìkìlọ̀ mọ́.
- source_word: προείρηκα
  choice: mo ti sọ ... ṣáájú
  rationale: Àkókò perfect tọ́ka sí ohun tí a ti sọ tẹ́lẹ̀ tí ó ṣì ṣe pàtàkì nísinsìnyí; “mo ti sọ ... ṣáájú” pa ìtumọ̀ sísọ ní ìlọsíwájú mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dative náà jẹ́ ẹni tí a bá sọ̀rọ̀; Yorùbá fi èyí hàn lọ́nà àdánidá pẹ̀lú “fún yín.”
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Neuter plural yìí lè túmọ̀ sí “gbogbo nǹkan” tàbí “ohun gbogbo”; àṣàyàn yìí jẹ́ àdánidá, ó sì pa ìtẹ̀sí àpapọ̀ ọ̀rọ̀ náà mọ́ láì pinnu bóyá ó ń tọ́ka sí gbogbo kúlẹ̀kúlẹ̀ tàbí gbogbo ohun tó yẹ nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Agbára ìkìlọ̀ Jésù àti ohun tí ó ti sọ tẹ́lẹ̀
  choice: Jésù tẹnumọ́ pé kí àwọn ọmọ-ẹ̀yìn máa ṣọ́ra, nítorí ó ti sọ ohun gbogbo tí àyíká ọ̀rọ̀ náà ní lọ́kàn fún wọn ṣáájú.
  alternative: Jésù ń sọ pé òun ti ṣàlàyé gbogbo kúlẹ̀kúlẹ̀ nípa ọjọ́ iwájú láìsí ohun kan tó kù.
  rationale: πάντα jẹ́ gbòòrò, ṣùgbọ́n àyíká ọ̀rọ̀ ló ń pinnu ààlà rẹ̀. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́, kò sì fi ìtumọ̀ kan tí ọ̀rọ̀ Gíríìkì kò fipá mú kún un.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹ máa ṣọ́ra” mú ìṣe tí ó ń bá a lọ nínú àṣẹ present náà jáde; àmì ohùn ni a lò ní kíkún níbi tí ó ti jẹ́ àdánidá.
