source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: yo
  text: 'Ẹ kọ́ àkàwé láti ara igi ọ̀pọ̀tọ́: nígbà tí ẹ̀ka rẹ̀ bá ti rọ̀, tí ó sì hù ewé[a], ẹ mọ̀ pé ìgbà ẹ̀ẹ̀rùn sún mọ́lé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀kọ́” tàbí “àpẹẹrẹ” dípò “àkàwé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε
  choice: Ẹ kọ́ ... lára igi ọ̀pọ̀tọ́
  rationale: Àṣẹ μάθετε jẹ́ pé kí àwọn olùgbọ́ gba ẹ̀kọ́; ‘ẹ kọ́ ... lára’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n kẹ́kọ̀ọ́ láti inú àpẹẹrẹ igi náà. A kò fi ọ̀rọ̀ àkókò kún δέ.
- source_word: τὴν παραβολήν
  choice: àkàwé
  rationale: ‘Àkàwé’ dá ìtumọ̀ παραβολή gẹ́gẹ́ bí àfiwé olùkọ́ni mú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere nínú àyíká yìí.
- source_word: ὅταν ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: nígbà tí ẹ̀ka rẹ̀ bá ti rọ̀
  rationale: Ìkọ̀lé ‘nígbà tí ... bá’ bá ὅταν pẹ̀lú subjunctive mu; ‘ti’ ń pa ìtumọ̀ ἤδη mọ́, ‘rọ̀’ sì fi ìrọ̀rùn tàbí ìtutù ẹ̀ka tuntun hàn.
- source_word: καὶ ἐκφύῃ τὰ φύλλα
  choice: tí ó sì ń yọ ewé
  rationale: ‘Yọ ewé’ jẹ́ àsọyé Yorùbá àdánidá fún bí igi ṣe ń mú ewé tuntun jáde.
- source_word: γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν
  choice: ẹ mọ̀ pé ìgbà ẹ̀ẹ̀rùn ti sún mọ́lé
  rationale: γινώσκετε jẹ́ indicative níhìn-ín, nítorí náà ‘ẹ mọ̀’ ni a lò, kì í ṣe àṣẹ. ‘Ìgbà ẹ̀ẹ̀rùn’ túmọ̀ θέρος gẹ́gẹ́ bí àsìkò ooru, ‘ti sún mọ́lé’ sì sọ ìsúnmọ́ àkókò.
theological_decisions:
- issue: Ìtumọ̀ παραβολή nínú àyíká yìí
  choice: àkàwé
  alternative: ẹ̀kọ́; àpẹẹrẹ
  rationale: ‘Àkàwé’ pa àwòrán àfiwé tí Jésù lò mọ́ láìfi ìtumọ̀ àpẹẹrẹ ẹ̀kọ́ ìsìn kan pàtó kún un; àkọ́lé ìsàlẹ̀ ṣàfihàn àwọn ìtumọ̀ míì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ọ̀pọ̀ ènìyàn ‘ẹ’ gẹ́gẹ́ bí àwọn olùgbọ́ tí Jésù ń bá sọ̀rọ̀.
