  to: 'Ẹ kọ́ àkàwé láti ara igi ọ̀pọ̀tọ́: nígbà tí ẹ̀ka rẹ̀ bá ti rọ̀, tí ó sì hù ewé[a], ẹ mọ̀ pé ìgbà ẹ̀ẹ̀rùn sún mọ́lé.'
