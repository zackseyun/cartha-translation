  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: àṣẹ náà, ẹ̀ka tí ó di rírẹ̀, yíyọ ewé, àti ìmọ̀ pé ìgbà ẹ̀ẹ̀rùn sún mọ́lé wà nínú rẹ̀. Síbẹ̀, ‘ti sún mọ́lé’ ń ṣàfikún ìrísí ìṣe tí a ti parí, níbi tí ἐστίν jẹ́ ọ̀rọ̀ ìpo lọwọlọwọ (‘wà nítòsí’).'
  naturalness: ‘Ẹ kọ́ àkàwé lára igi ọ̀pọ̀tọ́’ lè yéni, ṣùgbọ́n ‘láti ara igi’ jẹ́ ọ̀nà Yorùbá tí ó rọrùn àti tí ó ṣe kedere síi fún orísun ẹ̀kọ́ náà. ‘Tí ó sì hù ewé’ jẹ́ ìsọ̀rọ̀ àdánidá fún igi tí ń mú ewé jáde nínú ìpèníjà àkókò yìí.
  terminology: ‘Àkàwé’ yẹ fún παραβολή, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ọ̀rọ̀ Ìhìn Rere. ‘Igi ọ̀pọ̀tọ́’ yẹ fún συκῆ, ‘ìgbà ẹ̀ẹ̀rùn’ sì yẹ fún θέρος. Àkọsílẹ̀ ìsàlẹ̀ fún ‘ẹ̀kọ́’ tàbí ‘àpẹẹrẹ’ wúlò.
  issues:
