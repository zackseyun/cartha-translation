  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: yo
  text: Àti pé a gbọdọ̀ kọ́kọ́ kéde ìròyìn ayọ̀ náà fún gbogbo àwọn orílẹ̀-èdè[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìnrere náà.” Ọ̀rọ̀ Gíríìkì εὐαγγέλιον túmọ̀ ní tààrà sí “ìròyìn ayọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láàárín gbogbo àwọn orílẹ̀-èdè.” Ní àwọn àyíká ọ̀rọ̀ kan, ἔθνη tún lè túmọ̀ sí “àwọn Kèfèrí.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Àti pé
  rationale: Ó so gbólóhùn yìí mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ àtakò kún un.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: fún gbogbo àwọn orílẹ̀-èdè
  rationale: “Fún” bá ìṣe kíkéde mu, ó sì lè fi ibi tí iṣẹ́ náà ń dé hàn. “Gbogbo àwọn orílẹ̀-èdè” pa ìwọ̀n àgbáyé mọ́ láìdín ἔθνη kù sí àwọn Kèfèrí nìkan.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi bí ohun kan ṣe ní láti ṣáájú hàn ní ṣókí, láìṣàlàyé bí gbogbo ìṣẹ̀lẹ̀ yóò ṣe tẹ̀ lé ara wọn.
- source_word: δεῖ
  choice: a gbọdọ̀
  rationale: Ó pa agbára ọ̀rọ̀ tó ń fi dandan hàn mọ́, ṣùgbọ́n kò sọ orísun dandan náà ní kedere ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: κηρυχθῆναι
  choice: kéde
  rationale: Ó túmọ̀ sí pípolongo ọ̀rọ̀ ní gbangba; “kéde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu fún àwọn òǹkàwé òde òní.
- source_word: τὸ εὐαγγέλιον
  choice: ìròyìn ayọ̀ náà
  rationale: Ó mú ìtumọ̀ gidi εὐαγγέλιον jáde ní Yorùbá àdánidá. Àmì ìtọ́kasí fi ọ̀rọ̀ ìbílẹ̀ “ìhìnrere” hàn gẹ́gẹ́ bí òmíràn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  alternative: láàárín gbogbo àwọn orílẹ̀-èdè; fún gbogbo àwọn Kèfèrí
  rationale: Yíyan “orílẹ̀-èdè” pa ìwọ̀n gbogbo ayé mọ́, kò sì fi àtakò Júù àti Kèfèrí sínú ẹsẹ náà níbi tí ọ̀rọ̀ Gíríìkì kò ti mú un dandan.
- issue: Agbára δεῖ
  choice: a gbọdọ̀
  alternative: ó ṣe pàtàkì pé kí a
  rationale: Ó pa ìtumọ̀ dandan mọ́, tó lè ní agbára ète Ọlọ́run nínú àyíká ọ̀rọ̀ Máàkù, ṣùgbọ́n kò fi èyí kún ohun tí ẹsẹ náà sọ ní tààrà.
- issue: Ẹni tó ń ṣe iṣẹ́ nínú ọ̀rọ̀ aláìní olùṣe
  choice: a gbọdọ̀ ... kéde
  alternative: ìròyìn ayọ̀ náà gbọdọ̀ di kíkéde
  rationale: Gíríìkì lo ọ̀rọ̀ aláìní olùṣe, kò sì dárúkọ ẹni tó máa kéde. Yorùbá àdánidá nílò ìṣètò tó rọrùn; “a” níbí jẹ́ aláìlẹ́nìkan, kì í ṣe fífi ẹgbẹ́ kan pàtó kún ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Àti pé” ń bá àyíká ọ̀rọ̀ tó ṣáájú mu; “a” jẹ́ aláìlẹ́nìkan láti mú ọ̀rọ̀ aláìní olùṣe Gíríìkì jáde lọ́nà Yorùbá àdánidá.
