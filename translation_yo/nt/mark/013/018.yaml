  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹ gbàdúrà kí ó má ṣẹlẹ̀ ní ìgbà òtútù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ṣíṣàlàyé ohun tí àyíká ọ̀rọ̀ tọ́ka sí: ‘kí ìsálọ yín má ṣẹlẹ̀ ní ìgbà òtútù.’ Ọ̀rọ̀ Gíríìkì Máàkù kúrú sí i, kò sì sọ ohun náà ní kedere bí Mátíù 24:20 ṣe ṣe.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. ‘Ẹ máa gbàdúrà’ jẹ́ Yorùbá àdánidá, ó sì lè fi ìrísí ìṣe tí ó ń bá a lọ hàn láì fi ìtẹnumọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àsopọ̀ oníwọ̀nba tí ó tún lè ní ìtumọ̀ ìyàtọ̀ díẹ̀; ‘Ṣùgbọ́n’ bá ìṣàn ọ̀rọ̀ ìkìlọ̀ tó ṣáájú mu.
- source_word: ἵνα μὴ
  choice: pé kí ... má
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ohun tí àdúrà náà ń béèrè pẹ̀lú ìkọ̀.
- source_word: γένηται
  choice: ó má ṣẹlẹ̀
  rationale: γένηται tọ́ka sí ohun tí yóò ṣẹlẹ̀, ṣùgbọ́n ohun náà kò hàn gbangba nínú Gíríìkì Máàkù. Gbólóhùn aláìdárúkọ yìí pa àìsọ-kedere náà mọ́.
- source_word: χειμῶνος
  choice: ní ìgbà òtútù
  rationale: Ẹ̀bùn-orúkọ àkókò ni χειμῶνος; ‘ní ìgbà òtútù’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún ‘in winter.’
theological_decisions:
- issue: Ohun tí γένηται ń tọ́ka sí láì dárúkọ rẹ̀
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘kí ó má ṣẹlẹ̀,’ láì fi ‘ìsálọ yín’ sínú ẹsẹ náà.
  alternative: ‘kí ìsálọ yín má ṣẹlẹ̀ ní ìgbà òtútù’
  rationale: Gíríìkì Máàkù kò sọ ‘ìsálọ yín’ ní tààràtà, bí Mátíù 24:20 ti ṣe. Fífi ọ̀rọ̀ náà kún ẹsẹ yóò tú àìsọ-kedere ojúlówó náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘ẹ’ láti fi hàn pé àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn; a sì pa ìsọ̀rọ̀ kúkúrú àti àìsọ-kedere ti Gíríìkì mọ́.
