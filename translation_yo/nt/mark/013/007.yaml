source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: yo
  text: Nígbà tí ẹ bá sì gbọ́ nípa àwọn ogun àti ìròyìn nípa àwọn ogun[a], ẹ má ṣe fòyà; àwọn nǹkan wọ̀nyí gbọdọ̀ ṣẹlẹ̀, ṣùgbọ́n kì í ṣe òpin náà ní báyìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn àhesọ nípa àwọn ogun.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìròyìn, ìkéde, tàbí àhesọ tí a gbọ́ nípa àwọn ogun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nígbà tí ẹ bá sì
  rationale: ὅταν ń fi àkókò tí ohun kan lè ṣẹlẹ̀ hàn, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ láìfi ìtakora líle kún un.
- source_word: ἀκούσητε
  choice: ẹ bá gbọ́ nípa
  rationale: Aorist subjunctive lẹ́yìn ὅταν ní ìtumọ̀ ọjọ́ iwájú ni a fi bá ṣe ní Yorùbá; “gbọ́ nípa” bá àwọn ohun tí ó tẹ̀ lé e mu lọ́nà àdánidá.
- source_word: πολέμους
  choice: àwọn ogun
  rationale: Èyí ni ìtumọ̀ tààrà àti èyí tí ó wọ́pọ̀ fún πόλεμος ní ọ̀pọ̀.
- source_word: ἀκοὰς πολέμων
  choice: ìròyìn nípa àwọn ogun
  rationale: ἀκοή lè túmọ̀ sí ìròyìn, ìgbóhùnsáfẹ́fẹ́, tàbí ohun tí a gbọ́. “Ìròyìn nípa àwọn ogun” gbooro ju “àhesọ” lọ, kò sì fi hàn dandan pé ìròyìn náà kò dájú.
- source_word: μὴ θροεῖσθε
  choice: ẹ má ṣe fòyà
  rationale: θροέομαι ń tọ́ka sí jíjẹ́ kí ohun kan dá ẹni láàmú tàbí kó fa ìpayà; “ẹ má ṣe fòyà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún àyíká ìkìlọ̀ náà.
- source_word: δεῖ γενέσθαι
  choice: àwọn nǹkan wọ̀nyí gbọdọ̀ ṣẹlẹ̀
  rationale: δεῖ sọ pé ohun náà pọndandan, γενέσθαι sì túmọ̀ sí ṣẹlẹ̀. Fífi “àwọn nǹkan wọ̀nyí” kún un ń tọ́ka sí àwọn ogun àti ìròyìn wọn láìfi èrò tuntun kún ọ̀rọ̀ náà.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ṣùgbọ́n òpin kò tíì dé
  rationale: Ọ̀rọ̀ yìí jẹ́ kúkúrú, ó sì jẹ́ Yorùbá àdánidá; ó pa ìtẹnumọ́ οὔπω mọ́ pé òpin náà kò tíì dé.
theological_decisions:
- issue: Ìpọndandan nípa òpin ayé nínú δεῖ γενέσθαι
  choice: “gbọdọ̀ ṣẹlẹ̀” láti pa agbára ìtumọ̀ ìpọndandan mọ́
  alternative: “ó yẹ kí ó ṣẹlẹ̀” tàbí “ó pọn dandan kí ó ṣẹlẹ̀”
  rationale: Ẹsẹ̀ náà sọ pé ohun wọ̀nyí gbọdọ̀ ṣẹlẹ̀, ṣùgbọ́n kò ṣàlàyé ọ̀nà tàbí ìlànà ẹ̀kọ́ ìsìn kan pàtó. Ìtumọ̀ yìí pa ìdíwọ̀n ọ̀rọ̀ Gíríìkì mọ́ láìgbé ètò ẹ̀kọ́ nípa òpin ayé kan wọlé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní ọ̀wọ̀, ó ṣe kedere, ó sì rọrùn fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ἀκούσητε àti θροεῖσθε.
