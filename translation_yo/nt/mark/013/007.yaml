  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: ó pa ọ̀pọ̀ ‘àwọn ogun,’ ìtumọ̀ gbooro ti ἀκοαὶ πολέμων, ìkìlọ̀ náà, àti ìpọndandan nínú δεῖ γενέσθαι mọ́. Síbẹ̀, ‘òpin kò tíì dé’ lè túmọ̀ sí pé òpin yóò dé ní àkókò kan, dípò ìdí Gíríìkì pé ‘òpin kò tíì sí níhìn-ín’/‘kì í ṣe òpin ní báyìí.’'
