  terminology: ‘Ogun,’ ‘ìròyìn,’ àti ‘òpin’ jẹ́ àwọn ọ̀rọ̀ boṣewa tó bójú mu. Àlàyé ẹsẹ̀-ẹ̀gbẹ́ náà pa àṣàyàn ‘àhesọ’ mọ́ ní ìbámu pẹ̀lú audit trail.
