id: MRK.13.27
reference: Mark 13:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: yo
  text: Nígbà náà ni yóò rán àwọn áńgẹ́lì jáde, yóò sì kó àwọn àyànfẹ́ jọ láti ẹ̀fúùfù mẹ́rin[b], láti ìkángun ayé títí dé ìkángun ọ̀run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Láti ẹ̀fúùfù mẹ́rin” jẹ́ ọ̀rọ̀ àpèjúwe tó túmọ̀ sí láti gbogbo ìhà.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ apá ìkẹyìn náà ní ọ̀nà àlàyé sí “láti ibi tó jìnnà jù ní ayé títí dé ibi tó jìnnà jù ní ọ̀run,” tàbí “láti òpin ọ̀run kan dé òpin kejì.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: nígbà náà
  rationale: Ó fi ìtẹ̀lé àkókò hàn nínú àsọyé nípa ìkẹyìn; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: ἀποστελεῖ
  choice: yóò rán ... jáde
  rationale: Ó mú ìtumọ̀ fífi àwọn aṣojú ránṣẹ́ lọ hàn ní èdè Yorùbá àdánidá.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ìran ìkẹyìn yìí, àwọn ẹ̀dá ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe ońṣẹ́ ènìyàn.
- source_word: ἐπισυνάξει
  choice: yóò ... kó ... jọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún kíkó àwọn ènìyàn jọ sí ibi kan.
- source_word: ἐκλεκτούς
  choice: àwọn àyànfẹ́
  rationale: Ó túmọ̀ sí àwọn tí a yàn, ó sì yẹra fún fífi èrò ẹ̀kọ́ ìsìn kan pàtó kún ọ̀rọ̀ náà.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: láti inú ẹ̀fúùfù mẹ́rin
  rationale: A pa àwòrán inú Gíríìkì mọ́; ọ̀rọ̀ àpèjúwe yìí túmọ̀ sí láti gbogbo ìhà.
- source_word: ἀπ’ ἄκρου γῆς
  choice: láti ìkángun ayé
  rationale: “Ìkángun” sọ ibi tó jìnnà jù tàbí òpin di mímọ̀, ó sì pa àwòrán àyè inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: títí dé ìkángun ọ̀run
  rationale: Ó pa ìfarajọ pẹ̀lú “ìkángun ayé” mọ́, láì sọ ọ́ di gbólóhùn ẹ̀kọ́ nípa ibùgbé Ọlọ́run.
- source_word: καὶ τότε ... καὶ
  choice: Nígbà náà ni ... yóò sì
  rationale: Ilana yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìsopọ̀ àti ìtẹ̀lé àwọn ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐκλεκτούς nínú ọ̀rọ̀ nípa ìkẹyìn
  choice: àwọn àyànfẹ́
  alternative: àwọn tí a yàn
  rationale: “Àwọn àyànfẹ́” jẹ́ kedere, ó sì fi ìtumọ̀ yíyan wọn hàn láì fi ìlànà ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
- issue: Ìwọ̀n ibi tí àkójọ náà dé
  choice: láti inú ẹ̀fúùfù mẹ́rin, láti ìkángun ayé títí dé ìkángun ọ̀run
  alternative: láti gbogbo ìhà, láti òpin ayé kan dé òpin kejì
  rationale: A pa àwòrán àgbáyé àti ìtumọ̀ gbogbo ibi tí Gíríìkì ní mọ́, dípò kí a rọ́pò rẹ̀ pátápátá pẹ̀lú àlàyé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, tí ó bójú mu, tí ó níyì, tí àwọn òǹkàwé òde òní sì lè lóye. A lo “àyànfẹ́” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀; kò nílò àlàyé àṣàyàn ọ̀rọ̀ míì, nítorí náà kò sí àmì [a] nínú àkọsílẹ̀ yìí.
