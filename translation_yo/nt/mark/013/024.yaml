  verdict: revise
  source_fidelity: 'Ìtumọ̀ pàtàkì náà tọ́ka dáadáa sí Gíríìkì: ìyàtọ̀ Ṣùgbọ́n, àsìkò ‘ní ọjọ́ wọ̀nyẹn,’ ìtẹ̀lé ‘lẹ́yìn ìpọ́njú náà,’ àti àwọn àmì ojú ọ̀run méjèèjì wà ní kíkún. ‘Oòrùn yóò ṣókùnkùn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọjọ́ iwájú náà, bí ó tilẹ̀ jẹ́ pé σκοτισθήσεται jẹ́ aláìṣe ní Gíríìkì. ‘Òṣùpá kì yóò sì fi ìmọ́lẹ̀ rẹ̀ hàn’ pa àwòrán ìmọ́lẹ̀ tí òṣùpá kò ní fún hàn mọ́.'
