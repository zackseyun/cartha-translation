  terminology: ‘Ìpọ́njú’ yẹ fún θλῖψις nínú àyíká yìí, ó sì dá ìwúwo ọ̀rọ̀ náà mọ́ láìsọ ọ́ di orúkọ ètò ẹ̀kọ́ ìgbà ìkẹyìn. Ṣùgbọ́n ‘ìṣẹ́nilójú’ sábà ń tọ́ka sí inúnibíni/persecution, ‘ìyà’ sì lè túmọ̀ sí ìjìyà tàbí punishment; àwọn méjèèjì kò dáa gẹ́gẹ́ bí àṣàyàn gbooro fún θλῖψις nínú àlàyé ẹsẹ̀ yìí.
