source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: yo
  text: Ṣùgbọ́n ní ọjọ́ wọ̀nyẹn, lẹ́yìn ìpọ́njú náà[a], oòrùn yóò ṣókùnkùn, òṣùpá kì yóò sì fi ìmọ́lẹ̀ rẹ̀ hàn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lẹ́yìn ìdààmú náà” tàbí “lẹ́yìn ìnira náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tàbí ìyípadà ọ̀rọ̀ tó lágbára hàn, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn yìí ní Yorùbá.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní ọjọ́ wọ̀nyẹn
  rationale: Ó pa ìtumọ̀ àsìkò àti ìtọ́kasí àwọn ọjọ́ kan pàtó mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: lẹ́yìn ìpọ́njú náà
  rationale: “Lẹ́yìn” ṣàfihàn ìtẹ̀lé àsìkò; “ìpọ́njú” sì pa agbára θλῖψις mọ́ láìfi ètò ẹ̀kọ́ nípa ìgbà ìkẹyìn kan pàtó kún un.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: oòrùn yóò ṣókùnkùn
  rationale: Ó ṣàfihàn ìṣẹ̀lẹ̀ ọjọ́ iwájú ní Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ aláìṣe, Yorùbá sábà máa ń lo ọ̀rọ̀-ìṣe aláìrékọjá fún ìṣókùnkùn láìpàdánù ìtumọ̀.
- source_word: καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: òṣùpá kì yóò sì fi ìmọ́lẹ̀ rẹ̀ hàn
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún àwòrán pé òṣùpá kò ní tan tàbí fi ìmọ́lẹ̀ rẹ̀ hàn, ó sì pa àwòrán inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ θλῖψις nínú ọ̀rọ̀ àsọtẹ́lẹ̀ nípa ìgbà ìkẹyìn
  choice: ìpọ́njú
  alternative: ìṣẹ́nilójú tàbí ìyà
  rationale: “Ìpọ́njú” ní ìwọ̀n àti agbára tó bá àyíká ọ̀rọ̀ mu, ṣùgbọ́n kò sọ pé ó jẹ́ orúkọ ìpele kan pàtó nínú ètò ẹ̀kọ́ ìgbà ìkẹyìn.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
