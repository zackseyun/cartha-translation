source:
  edition: SBLGNT
  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: yo
  text: Ẹni tí ó sì wà ní oko kò gbọdọ̀ padà sẹ́yìn láti mú aṣọ òde rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ àwọ̀lékè rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: Ẹni tí ó bá sì wà ní oko
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹnì kan ní ọ̀nà àpapọ̀, ẹni tí ó wà ní oko; gbolohun Yorùbá yìí jẹ́ ti ẹ̀dá, kò sì fi kún un pé ọkùnrin nìkan ni.
- source_word: ἀγρός
  choice: oko
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀγρός túmọ̀ sí ilẹ̀ oko tàbí pápá tí a ti ń ṣiṣẹ́; “oko” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: kò gbọdọ̀ padà sẹ́yìn
  rationale: Èyí mú ìfòfin tí ó lágbára nínú aorist imperative pẹ̀lú μή jáde, ó sì ṣàfihàn ìtumọ̀ idiomatic ti lílọ padà sí ohun tó wà lẹ́yìn.
- source_word: ἆραι
  choice: láti lọ mú
  rationale: 'Infinitive náà sọ ète ìpadà náà: láti mú tàbí gba ohun tí a fi sílẹ̀. “Láti lọ mú” jẹ́ ti ẹ̀dá ní Yorùbá, ó sì bá ipò ìkìlọ̀ náà mu.'
- source_word: ἱμάτιον
  choice: aṣọ àwọ̀lékè
  rationale: ἱμάτιον sábà ń tọ́ka sí aṣọ òde tí a wọ lórí aṣọ mìíràn. “Aṣọ àwọ̀lékè” ṣe kedere fún òǹkàwé Yorùbá òde òní láì dín ìtumọ̀ náà sí irú aṣọ kan pàtó.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: “Rẹ̀” pa ìtọ́kasí ẹnì kan ṣoṣo mọ́, bí ó tilẹ̀ jẹ́ pé kò ní àmì akọ tàbí abo ní Yorùbá; èyí jẹ́ ìbámu gírámà tó jẹ́ ti ẹ̀dá.
theological_decisions:
- issue: Ìtọ́kasí ẹnì kan ṣoṣo tí Gíríìkì fi akọ hàn
  choice: Pa ẹnì kan ṣoṣo mọ́ ní “Ẹni ... rẹ̀,” gẹ́gẹ́ bí gírámà Yorùbá ṣe ń sọ ọ́.
  alternative: 'Lílo ọ̀pọ̀: “Àwọn tí ó wà ní oko ... aṣọ wọn.”'
  rationale: Orísun náà lo singular substantival masculine àti singular pronoun. Yorùbá kò ya akọ àti abo sọ́tọ̀ nínú “ẹni” tàbí “rẹ̀”; nítorí náà, singular náà wà ní ààyè láì fi ìtumọ̀ akọ tí èdè àfojúsùn kò sábà fi hàn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. “Kò gbọdọ̀” ń mú ìkìlọ̀ pajawiri jáde; “padà sẹ́yìn” jẹ́ ọ̀nà àdánidá láti sọ idiom Gíríìkì náà.
