  terminology: ‘tẹ́ńpìlì’ jẹ́ ìlò tó yéni, footnote náà sì ṣe ìyàtọ̀ ἱερόν sí ναός ní kedere. A pa ‘ń bi í léèrè’ mọ́ nítorí imperfect ἐπηρώτα, kì í ṣe aorist.
