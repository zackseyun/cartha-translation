source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: yo
  text: Bí ó sì ti jókòó lórí Òkè Ólífì ní òdìkejì tẹ́ńpìlì náà[a], Pétérù àti Jákọ́bù àti Jòhánù àti Áńdérù ń bi í léèrè ní ìpamọ́ pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, ἱερόν, ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: bí ó ti jókòó
  rationale: Ọ̀rọ̀ alábápín onísinsin yìí nínú genitive absolute fi ìṣe tó ń lọ lọ́wọ́ hàn. “Bí ó ti jókòó” jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ipò yẹn kalẹ̀ láì sọ ọ́ di ìṣe tó ṣẹ̀ṣẹ̀ parí.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: lórí Òkè Ólífì
  rationale: Pẹ̀lú ọ̀rọ̀ ìjókòó, εἰς ń tọ́ka sí ibi níhìn-ín. “Lórí Òkè Ólífì” jẹ́ ìtumọ̀ àdánidá fún orúkọ ibi náà.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: ní òdìkejì tẹ́ńpìlì náà
  rationale: κατέναντι túmọ̀ sí wíwà ní òdìkejì tàbí ní ibi tí ń dojú kọ ohun kan. ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé nìkan; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìyàtọ̀ náà mọ́.
- source_word: ἐπηρώτα
  choice: ń bi í léèrè
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ lọ́wọ́ hàn. Ẹ̀yà “ń bi í léèrè” pa ìwòye ìṣe tí ó ń tẹ̀ síwájú mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Gbólóhùn náà túmọ̀ sí pé wọ́n yà sọ́tọ̀ kúrò lọ́dọ̀ àwọn ẹlòmíràn láti bá a sọ̀rọ̀; “ní ìkọ̀kọ̀” sọ èyí ní ṣókí.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Pétérù àti Jákọ́bù àti Jòhánù àti Áńdérù
  rationale: A lo àwọn ìkọ̀wé orúkọ tí ó bá èdè Yorùbá mu, a sì pa àtúnṣe “àti” mọ́ láti tẹ̀lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àtúnṣe “àti” pa ìlù ìtàn orísun mọ́. Àmì kọ́ńmà àti “pé” ní òpin fi hàn pé ìbéèrè náà ń bá a lọ nínú ẹsẹ tó tẹ̀ lé e.
