id: MRK.13.21
reference: Mark 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: yo
  text: Nígbà náà, bí ẹnikẹ́ni bá sọ fún yín pé, ‘Wò ó, Mèsáyà[a] wà níhìn-ín!’ tàbí pé, ‘Wò ó, ó wà lọ́hùn-ún!’ ẹ má ṣe gbà á gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τότε
  choice: Nígbà náà
  rationale: Ó so ìkìlọ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì tọ́ka sí àkókò tó tẹ̀ lé e; èdè Yorùbá àdánidá kò nílò kí a fi καί hàn lọ́tọ̀ níbí.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: bí ẹnikẹ́ni bá sọ fún yín
  rationale: Èyí fi ipò àfojúsùn gbogbogbò hàn, ó sì pa ìtumọ̀ ẹni àìdá kan àti ọ̀pọ̀ ènìyàn tí ὑμῖν ń tọ́ka sí mọ́.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Àṣẹ yìí ń pe àfiyèsí lọ́nà tó lágbára, tó sì jẹ́ èdè Yorùbá òde òní.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó túmọ̀ sí ibi tó sún mọ́ ẹni tó ń sọ̀rọ̀, ìyẹn ‘níbí.’
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Nínú àyíká yìí, χριστός jẹ́ oyè ẹni àmì-òróró tí a ń retí, kì í ṣe orúkọ ara ẹni; ‘Mèsáyà’ pa agbára oyè náà mọ́.
- source_word: ἐκεῖ
  choice: lọ́hùn-ún
  rationale: Ó fi ibi tó jìnnà sí ẹni tó ń sọ̀rọ̀ hàn, ó sì dá ìyàtọ̀ ὧδε/ἐκεῖ dúró lọ́nà Yorùbá àdánidá.
- source_word: μὴ πιστεύετε
  choice: ẹ má ṣe gbà á gbọ́
  rationale: Àrọ́pò ‘á’ tọ́ka sí ohun tí wọ́n sọ, kì í ṣe dandan sí ẹni tó sọ ọ́; èyí pa ohun tí Gíríìkì kò sọ ní pàtó mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ ὁ àti àyíká àwọn olùbéèrè èké fi hàn pé oyè ni ọ̀rọ̀ náà ń ṣe níbí. ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì-òróró tí a ń retí mọ́; àṣàyàn ìbílẹ̀ ‘Kristi’ wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Wò ó’ mú ohùn ìkìlọ̀ alágbára jáde; ‘lọ́hùn-ún’ sì jẹ́ alábàákẹ́gbẹ́ àdánidá fún ‘níhìn-ín.’
