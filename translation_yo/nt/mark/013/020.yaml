reference: Mark 13:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: yo
  text: Bí Olúwa kò bá ti gé àwọn ọjọ́ náà kúrú, kò sí ẹran-ara kankan[a] tí ìbá là. Ṣùgbọ́n nítorí àwọn àyànfẹ́, àwọn tí Olúwa yàn, ó gé àwọn ọjọ́ náà kúrú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹran-ara kankan” túmọ̀ sí “ènìyàn kankan” tàbí “ẹnikẹ́ni.” Ní tààrà, “kò sí ẹran-ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: gé … kúrú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti mú ohun kúrú tàbí láti gé e kúrú. Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára àwòrán ọ̀rọ̀ Gíríìkì mọ́. A lò ó ní ọ̀nà kan náà ní ibi méjèèjì.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó dúró ṣinṣin fún κύριος nígbà tí ó ń tọ́ka sí Ọlọ́run.
- source_word: τὰς ἡμέρας
  choice: àwọn ọjọ́ náà
  rationale: Ó pa ìtọ́kasí sí àkókò ìpọ́njú tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀ mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: οὐκ ἂν ἐσώθη
  choice: kò … tí ìbá là
  rationale: Ìṣètò ‘ìbá’ fi àbájáde ipò tí kò ṣẹlẹ̀ hàn. ‘Là’ lè sọ nípa pípa ẹ̀mí mọ́ nínú ewu, èyí tí ó bá àyíká ọ̀rọ̀ mu, láìsọ ọ̀rọ̀ náà di ẹ̀kọ́ nípa ìgbàlà ayérayé.
- source_word: πᾶσα σάρξ
  choice: kò sí ẹran-ara kankan
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì ‘ẹran-ara’ mọ́, nígbà tí ìtumọ̀ àṣà ọ̀rọ̀ náà jẹ́ pé kò sí ènìyàn kankan. Àlàyé ìsàlẹ̀ ojú-ìwé sọ ìtumọ̀ dídán rẹ̀.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: nítorí àwọn àyànfẹ́
  rationale: ‘Nítorí’ fi hàn pé lílò ọjọ́ náà kúrú wáyé fún ire tàbí nítorí àwọn tí a yàn, láìfi ẹ̀kọ́ ẹ̀sìn pàtó kún ọ̀rọ̀ náà.
- source_word: ἐκλεκτούς
  choice: àwọn àyànfẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ àwọn tí a yàn, ó sì pa ẹ̀ka ọ̀rọ̀ Bíbélì náà mọ́ láìdáhùn àwọn àríyànjiyàn nípa irú ìyàn náà.
- source_word: οὓς ἐξελέξατο
  choice: àwọn tí ó yàn
  rationale: Ó túmọ̀ gbólóhùn ìbátan náà ní tààrà, ó sì pa ìtẹnumọ́ orísun náà mọ́ pé àwọn àyànfẹ́ ni àwọn tí Olúwa yàn.
theological_decisions:
- issue: Ìtumọ̀ ‘là’ nínú àyíká ọ̀rọ̀
  choice: Pípa ẹ̀mí ènìyàn mọ́ láàárín ìpọ́njú ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ jù lọ, ṣùgbọ́n a kò dín ọ̀rọ̀ náà kù sí ẹ̀kọ́ nípa ìgbàlà ayérayé.
  alternative: Kí a ka a sí ìgbàlà ẹ̀mí nìkan.
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa àwọn ọjọ́ àjálù tí a gé kúrú kí ènìyàn má bàa ṣègbé. Nítorí náà, ‘là’ jẹ́ àdánidá, ó sì pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ mọ́.
- issue: Ta ni ‘àwọn àyànfẹ́’ ń tọ́ka sí?
  choice: A pa ‘àwọn àyànfẹ́’ mọ́ gẹ́gẹ́ bí orúkọ tí ẹsẹ náà fún àwọn tí a gé ọjọ́ náà kúrú nítorí wọn.
  alternative: Kí a ṣàlàyé rẹ̀ ní pàtó gẹ́gẹ́ bí ìyàn àwùjọ tàbí ìpinnu ayérayé fún olúkúlùkù.
  rationale: Ẹsẹ náà sọ pé Olúwa yàn wọn, ṣùgbọ́n kò yanju bí a ṣe gbọdọ̀ ṣàlàyé gbogbo ẹ̀kọ́ nípa ìyàn. Ìtumọ̀ náà kò gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọ inú ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Gé … kúrú’ àti ‘àwọn àyànfẹ́’ jẹ́ ọ̀rọ̀ tí òǹkàwé lasán lè lóye, tí ó sì pa ìtẹnumọ́ àti ìṣòro ẹ̀kọ́ inú orísun mọ́.
