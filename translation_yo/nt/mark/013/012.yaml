  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: yo
  text: Arákùnrin yóò sì fi arákùnrin rẹ̀ lé ikú lọ́wọ́[a], baba yóò sì fi ọmọ rẹ̀ lé ikú lọ́wọ́; àwọn ọmọ yóò dìde sí àwọn òbí wọn, wọn yóò sì pa wọ́n[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò sì fi arákùnrin rẹ̀ hàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan lé ọwọ́ ẹlòmíràn, fífi ẹni hàn, tàbí fífi ẹni lélẹ̀ nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn yóò sì mú ikú bá wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: yóò fi ... lé ... lọ́wọ́
  rationale: Ọ̀rọ̀ yìí ń sọ nípa fífi ẹnì kan lé agbára tàbí àṣẹ mìíràn lọ́wọ́. Nínú àyíká inúnibíni yìí, gbólóhùn náà pa ìtumọ̀ fífi ẹni náà lé ikú lọ́wọ́ mọ́, láìfi ìtumọ̀ ìmọ̀lára ‘dẹ́kùn mú’ kún un dandan.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: arákùnrin ... arákùnrin rẹ̀
  rationale: Èyí pa akọ-ǹṣe àti àtúnrọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìbátan wọn ní Yorùbá.
- source_word: εἰς θάνατον
  choice: lé ikú lọ́wọ́
  rationale: Ó fi àbájáde tàbí òpin fífi ẹni náà lé wọn lọ́wọ́ hàn, ìyẹn ikú.
- source_word: πατὴρ τέκνον
  choice: baba ... ọmọ rẹ̀
  rationale: πατήρ túmọ̀ sí baba, τέκνον sì jẹ́ ọmọ láìsọ pé akọ tàbí abo ni; ‘rẹ̀’ mú ìbátan náà ṣe kedere ní Yorùbá.
- source_word: ἐπαναστήσονται
  choice: yóò dìde sí
  rationale: Ó pa àwòrán dídìde lòdì sí ẹnì kan mọ́, ó sì fi ìṣọ̀tẹ̀ oníjà hàn.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Ọ̀pọ̀ γονεῖς ń tọ́ka sí àwọn òbí, ìyẹn baba àti ìyá.
- source_word: θανατώσουσιν αὐτούς
  choice: wọn yóò sì mú kí a pa wọ́n
  rationale: θανατόω lè túmọ̀ sí pípa ẹnì kan tàbí mímú kí a pa á. Yíyan ‘mú kí a pa wọ́n’ bá àyíká fífi àwọn mọ̀lẹ́bí lé àwọn aláṣẹ lọ́wọ́ mu, ṣùgbọ́n a pa ìtumọ̀ tààrà ‘pa wọ́n’ mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Àwọn ọ̀rọ̀ ìbátan tí ó dá lórí akọ tàbí abo nínú gbólóhùn àpẹẹrẹ
  choice: A pa ‘arákùnrin’ àti ‘baba’ mọ́, nígbà tí a tú τέκνον àti γονεῖς sí ‘ọmọ’ àti ‘àwọn òbí.’
  alternative: Lílo ọ̀rọ̀ tí kò fi akọ tàbí abo hàn fún gbogbo àwọn ìbátan náà.
  rationale: ἀδελφός àti πατήρ jẹ́ ọ̀rọ̀ akọ níhìn-ín, ṣùgbọ́n τέκνον àti γονεῖς gbòòrò sí i. Ìtumọ̀ náà tẹ̀ lé ìyàtọ̀ inú orísun láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
- issue: Bí àwọn ọmọ ṣe fa ikú àwọn òbí wọn
  choice: ‘wọn yóò sì mú kí a pa wọ́n’
  alternative: ‘wọn yóò sì pa wọ́n’
  rationale: Ọ̀rọ̀ Gíríìkì lè gba ìtumọ̀ tààrà tàbí ti jíjẹ́ okùnfà ikú. Ọ̀rọ̀ àkọ́kọ́ bá àyíká fífi ènìyàn lé ikú lọ́wọ́ mu, a sì fi èkejì sí àlàyé ìsàlẹ̀ láti pa àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àtúnrọ̀ ‘arákùnrin ... arákùnrin’ àti ìtẹ̀síwájú àwọn gbólóhùn ni a pa mọ́ láti fi líle ọ̀rọ̀ Gíríìkì hàn; a gbe àmì [b] sí ibi tí θανατώσουσιν αὐτούς wà nínú ọ̀rọ̀.
