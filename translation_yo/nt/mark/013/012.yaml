    issue: ‘wọn yóò sì mú kí a pa wọ́n’ fún θανατώσουσιν αὐτούς
    rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ọjọ́ iwájú ẹni-kẹta ọ̀pọ̀, ní ohùn ìṣiṣẹ́, tó túmọ̀ sí pé àwọn ọmọ náà ‘yóò pa wọ́n.’ Ìtumọ̀ ìpilẹ̀ṣẹ̀ náà sọ pé wọ́n fa kí ẹlòmíràn pa wọ́n, ó sì ṣàfikún aláṣe tí orísun kò sọ.
  - severity: medium
    issue: Àlàyé [a] lo ‘dídẹ́kùn mú’ gẹ́gẹ́ bí àṣàyàn fún παραδώσει
    rationale: Ní àyíká yìí παραδίδωμι lè jẹ́ ‘fi lé ọwọ́,’ ‘fà lé,’ tàbí ‘fi ẹni hàn/fìtàn ẹni’; ‘dẹ́kùn mú’ dà bí ìmú-ènìyàn nípasẹ̀ ìdẹ̀, kì í sì ṣàlàyé ìtumọ̀ ọ̀rọ̀ náà dáadáa.
