review_pass:
  verdict: revise
  source_fidelity: 'Àpá ìbẹ̀rẹ̀ tẹ̀lé παραδώσει ... εἰς θάνατον dáadáa pẹ̀lú ‘fi ... lé ikú lọ́wọ́,’ ó sì pa ìtẹ̀lé ‘arákùnrin ... arákùnrin’ mọ́. Ṣùgbọ́n θανατώσουσιν αὐτούς jẹ́ ìṣe tààrà: ‘wọn yóò pa wọ́n’/‘wọn yóò mú ikú bá wọn.’ ‘Wọn yóò mú kí a pa wọ́n’ yí i padà sí fífi ikú náà ṣẹlẹ̀ nípasẹ̀ ẹlòmíràn, èyí tí kò sí nínú Gíríìkì.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn tó péye. ‘Fi ... lé ikú lọ́wọ́’ bá ọ̀rọ̀ ìtàn inúnibíni mu. A tún ṣàtúnṣe àlàyé [a], nítorí ‘dídẹ́kùn mú’ kì í ṣe ìtumọ̀ àdánidá tàbí tó péye fún παραδίδωμι níhìn-ín.
  terminology: ‘Arákùnrin,’ ‘baba,’ ‘ọmọ,’ àti ‘àwọn òbí’ ń fara mọ́ ìyàtọ̀ akọ àti ọ̀rọ̀ gbòòrò nínú orísun. ‘Pa wọ́n’ ni ìtumọ̀ tó péye jù lọ fún θανατώσουσιν αὐτούς; àlàyé ìsàlẹ̀ ń fúnni ní ọ̀nà ìsọ̀rọ̀ mìíràn láìyí ipa-ìṣe Gíríìkì padà.
  issues:
