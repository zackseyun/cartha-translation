source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: yo
  text: Lóòótọ́ ni mo wí fún yín pé, ìran yìí kì yóò kọjá lọ rárá títí gbogbo nǹkan wọ̀nyí fi ṣẹlẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ènìyàn yìí” tàbí “ẹ̀yà yìí”; ọ̀rọ̀ Gíríìkì γενεά lè ní ìtumọ̀ tó gbòòrò sí i, bí ó tilẹ̀ jẹ́ pé “ìran” ni ìtumọ̀ tó ṣe àdánidá jù lọ níbí.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “kì yóò kọjá lọ rárá” ń fi agbára ìkọ̀ tí ó lágbára gan-an nínú èdè Gíríìkì hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó ṣí ọ̀rọ̀ pàtàkì tí a sọ pẹ̀lú ọlá-àṣẹ sílẹ̀; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín
  rationale: Ó tẹ̀lé ìtumọ̀ tààrà ti ọ̀rọ̀ ìfọ̀rọ̀wérọ̀ náà, ní ìforúkọsílẹ̀ ọlọ́lá tí ó tún ṣeé yé.
- source_word: οὐ μὴ παρέλθῃ
  choice: kì yóò kọjá lọ rárá
  rationale: Àfikún “rárá” fi ìkọ̀ emphatic οὐ μή hàn gbangba láì sọ ọ́ di “láéláé,” èyí tí ó lè yí ààlà àsìkò inú ẹsẹ̀ náà padà.
- source_word: ἡ γενεὰ αὕτη
  choice: ìran yìí
  rationale: “Ìran” ni ìbámu Yorùbá tó ṣe àdánidá jù lọ fún γενεά ní àyíká ọ̀rọ̀ yìí, ó sì pa ìṣòro ìtumọ̀ ọ̀rọ̀ àsọtẹ́lẹ̀ náà mọ́.
- source_word: μέχρις οὗ
  choice: títí ... yóò fi
  rationale: Ìkọ̀lé Yorùbá yìí ń fi ààlà àsìkò tí gbólóhùn Gíríìkì náà tọ́ka sí hàn lọ́nà àdánidá.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó pa àfihàn ọ̀pọ̀ àti ìtẹnumọ́ πᾶς mọ́, ó sì ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ tí a mẹ́nu kàn ṣáájú.
- source_word: γένηται
  choice: ṣẹlẹ̀
  rationale: Ní àyíká àsọtẹ́lẹ̀ yìí, ó túmọ̀ sí pé àwọn ìṣẹ̀lẹ̀ náà yóò wáyé; “ṣẹlẹ̀” jẹ́ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ “ìran yìí” (ἡ γενεὰ αὕτη) nínú ọ̀rọ̀ nípa àwọn ohun ìkẹyìn
  choice: A túmọ̀ ọ́ ní tààrà sí “ìran yìí,” láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: “Àwọn ènìyàn yìí” tàbí “ẹ̀yà yìí”; tàbí ìran ọjọ́ iwájú tí yóò rí àwọn àmì náà bẹ̀rẹ̀.
  rationale: “Ìran yìí” ni ìtumọ̀ tó ṣe àdánidá jù lọ nínú àyíká ọ̀rọ̀ náà. Nítorí pé ìtumọ̀ rẹ̀ ṣì ń fa àríyànjiyàn, àyípadà gbọ́dọ̀ pa ìfọ̀rọ̀wérọ̀ àti ìnira ẹ̀kọ́ inú orísun náà mọ́ dípò yíyan ètò ìtumọ̀ nípa ọjọ́ ìkẹyìn kan pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “wí” dípò “sọ” láti pa ìdúróṣinṣin ọ̀rọ̀ mímọ́ mọ́ láì di èdè àtijọ́ tí kò ṣeé yé.
