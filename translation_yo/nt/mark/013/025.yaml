source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: yo
  text: Àwọn ìràwọ̀ yóò sì máa jábọ́ láti ọ̀run[a] wá, a ó sì mì àwọn agbára tí ó wà ní àwọn ọ̀run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì οὐρανός lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn agbára tí ó wà ní àwọn ọ̀run” lè tọ́ka sí àwọn ẹ̀dá alágbára ti ọ̀run, àwọn ipá àgbáyé, tàbí àwọn ohun àti ètò inú àwọn ọ̀run; Gíríìkì kò sọ ọ́ ní pàtó ju bẹ́ẹ̀ lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: àwọn ìràwọ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn ìràwọ̀ ojú ọ̀run, ó sì bá àyíká ọ̀rọ̀ nípa àwọn ìṣẹ̀lẹ̀ àgbáyé mu.
- source_word: ἔσονται ... πίπτοντες
  choice: yóò máa jábọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ ọjọ́ iwájú àti present participle nínú Gíríìkì fi ìṣe ọjọ́ iwájú tí ń lọ lọ́wọ́ hàn; ‘yóò máa jábọ́’ pa ìtumọ̀ yẹn mọ́.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run wá
  rationale: ‘Ọ̀run’ ní ìforúkọsílẹ̀ gíga tí ó yẹ fún àyíká ọ̀rọ̀ apokalíptìkì, ṣùgbọ́n ó tún lè tọ́ka sí ojú ọ̀run; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì náà hàn.
- source_word: δυνάμεις
  choice: àwọn agbára
  rationale: ‘Àwọn agbára’ jẹ́ ìtumọ̀ gbòòrò tí kò pinnu bóyá àwọn ẹ̀dá ọ̀run, àwọn ipá àgbáyé, tàbí ètò àwọn ọ̀run ni a ń tọ́ka sí.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: tí ó wà ní àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́ pẹ̀lú ‘àwọn ọ̀run,’ èyí sì ń fi ìwọ̀n àgbáyé gbòòrò ti gbólóhùn náà hàn.
- source_word: σαλευθήσονται
  choice: a ó mì
  rationale: Ìlò ‘a’ aláìdárúkọ ní Yorùbá ń sọ ìṣe náà láìsọ ẹni tó ṣe é, ó sì fi passive ọjọ́ iwájú Gíríìkì hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn agbára tí ó wà ní àwọn ọ̀run’
  choice: A túmọ̀ rẹ̀ ní gbogbogbò gẹ́gẹ́ bí ‘àwọn agbára tí ó wà ní àwọn ọ̀run.’
  alternative: Ó lè túmọ̀ sí àwọn ẹ̀dá alágbára ti ọ̀run, àwọn ipá àgbáyé, tàbí àwọn ohun/ètò tí ó dúró ṣinṣin ní àwọn ọ̀run.
  rationale: Gbólóhùn Gíríìkì kò sọ irú agbára tí wọ́n jẹ́ ní pàtó. Ìtumọ̀ yìí pa àìdájú inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, kò sì fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere ni a lò. ‘Yóò máa jábọ́’ mú ìṣe tí ń lọ lọ́wọ́ hàn; ‘a ó mì’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ẹni tó ń ṣe ìṣe náà mọ́ láìdárúkọ.
