  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: yo
  text: 'Nígbà náà, Jésù bẹ̀rẹ̀ sí í sọ fún wọn pé: “Ẹ ṣọ́ra kí ẹnikẹ́ni má ṣe mú yín ṣìnà.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ ṣọ́ra kí ẹnikẹ́ni má ṣe tàn yín jẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘Nígbà náà’ bá ìtẹ̀síwájú ọ̀rọ̀ mu láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: ἤρξατο λέγειν
  choice: bẹ̀rẹ̀ sí í sọ
  rationale: Èyí tẹ̀ lé ìtumọ̀ gírámà Gíríìkì, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá; a kò fi ‘dáhùn’ kún un nítorí kò sí nínú ẹsẹ yìí.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi ‘àwọn ọmọ-ẹ̀yìn rẹ̀’ kún ọ̀rọ̀ pàtó ẹsẹ náà.
- source_word: Βλέπετε
  choice: Ẹ ṣọ́ra
  rationale: Àṣẹ ìsinsìnyí náà ń béèrè fún ìṣọ́ra tí ń bá a lọ; ‘Ẹ ṣọ́ra’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó sì ní agbára ìkìlọ̀.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: kí ẹnikẹ́ni má bà a mú yín ṣìnà
  rationale: Ìṣètò μή pẹ̀lú subjunctive lẹ́yìn àṣẹ jẹ́ ìkìlọ̀ láti dènà ohun kan; ‘mú yín ṣìnà’ pa àwòrán yíyọ kúrò ní ọ̀nà tó tọ́ mọ́, ó sì tún lè ní ìtumọ̀ ẹ̀tàn.
theological_decisions:
- issue: Irú ìkìlọ̀ tí πλανήσῃ ń tọ́ka sí
  choice: Ìkìlọ̀ lòdì sí ẹ̀tàn tí ó lè mú ènìyàn kúrò ní ọ̀nà tó tọ́
  alternative: Ìkìlọ̀ tí ó ní í ṣe pẹ̀lú gbígba èrò èké nìkan
  rationale: πλανάω lè túmọ̀ sí fífi ẹnì kan ṣìnà tàbí tàn án jẹ, kì í ṣe sísọ ohun èké fún un nìkan. Ìtumọ̀ yìí pa agbára ìhùwàsí àti ti ẹ̀sìn inú ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ìgbàlódé, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹ ṣọ́ra’ àti ‘mú yín ṣìnà’ yé àwọn òǹkàwé lónìí, wọ́n sì pa agbára ìkìlọ̀ àti àwòrán ọ̀nà inú Gíríìkì mọ́.
