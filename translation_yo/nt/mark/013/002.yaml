source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Ǹjẹ́ o rí àwọn ilé ńlá wọ̀nyí?[a] Kò sí òkúta kan tí a ó fi sílẹ̀ níhìn-ín lórí òkúta mìíràn[b] tí a kò ní wó lulẹ̀.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ilé ńlá inú àgbègbè tẹ́ńpìlì wọ̀nyí.” Àyíká ọ̀rọ̀ ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, bí ó tilẹ̀ jẹ́ pé “àwọn ilé” lásán ni Gíríìkì sọ.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “òkúta kan ... lórí òkúta mìíràn” jẹ́ àpèjúwe ìparun pátápátá.
    reason: cultural_note
  - marker: c
    text: Tàbí, “pa run” tàbí “sọ lulẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Ǹjẹ́ o rí
  rationale: Ọ̀rọ̀-ìṣe ìsinsìnyí ni a lò gẹ́gẹ́ bí ìbéèrè tààrà. “Ǹjẹ́ o rí” jẹ́ Yorùbá àdánidá, ó sì pa agbára ìbéèrè mọ́ láì sọ ọ́ di àṣẹ bí “Wò ó.”
- source_word: μεγάλας οἰκοδομάς
  choice: àwọn ilé ńlá wọ̀nyí
  rationale: “Ilé” túmọ̀ sí àwọn ohun tí a kọ́, “ńlá” sì lè fi ìwọ̀n àti ọlá wọn hàn. Àyíká ọ̀rọ̀ fi hàn pé àwọn ilé inú àgbègbè tẹ́ńpìlì ni, ṣùgbọ́n a kò fi “tẹ́ńpìlì” kún ọ̀rọ̀ pàtó tí Gíríìkì sọ.
- source_word: οὐ μὴ ἀφεθῇ
  choice: Kò sí ... tí yóò ṣẹ́ kù
  rationale: οὐ μή pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń fi ìkọ̀ ọjọ́ iwájú tó lágbára hàn. Ìṣètò “Kò sí ... tí yóò ṣẹ́ kù” mú ìdánilójú yẹn jáde ní Yorùbá àdánidá.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó tọ́ka sí ibi tí wọ́n wà nígbà náà, bí “here” ṣe rí.
- source_word: λίθος ἐπὶ λίθον
  choice: òkúta kan ... lórí òkúta mìíràn
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì ṣe kedere ní Yorùbá pé ìparun pátápátá ni a ń sọ.
- source_word: καταλυθῇ
  choice: a kì yóò wó lulẹ̀
  rationale: Ní ti ilé, καταλύω túmọ̀ sí wíwó tàbí pípa ohun tí a kọ́ run. “Wó lulẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ ìwópalẹ̀ ilé mu.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jésù sì wí fún un pé
  rationale: “Sì” ń tẹ̀síwájú nínú ìtàn, “wí fún un” sì bá εἶπεν αὐτῷ mu láì fi èrò pé ó dáhùn kún un.
theological_decisions:
- issue: Ibi tí àsọtẹ́lẹ̀ Jésù dé nínú àgbègbè tẹ́ńpìlì
  choice: A tú οἰκοδομάς sí “ilé” nínú ẹsẹ̀ náà.
  alternative: àwọn ilé ńlá inú àgbègbè tẹ́ńpìlì wọ̀nyí
  rationale: Àyíká ọ̀rọ̀ fi tẹ́ńpìlì hàn gbangba, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ “àwọn ilé.” Yíyan ọ̀rọ̀ gbooro yìí kò fi àlàyé tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní àmì ohùn níbi tí ó ti yẹ. “Wí fún un pé” ní ìrísí ọ̀wọ̀ díẹ̀, nígbà tí “Ǹjẹ́ o rí” jẹ́ ìbéèrè tó ṣe kedere fún òǹkàwé lónìí. A ṣètò gbólóhùn ìkọ̀ náà ní ọ̀nà Yorùbá àdánidá láti pa agbára οὐ μή àti àwòrán òkúta-lórí-òkúta mọ́.
