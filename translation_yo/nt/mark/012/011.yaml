  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: yo
  text: Èyí wá láti ọ̀dọ̀ Olúwa,[a][b] ó sì jẹ́ ohun ìyanu ní ojú wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa ló mú èyí ṣẹ.” Gbólóhùn Gíríìkì náà lè tọ́ka sí orísun tàbí ẹni tó ṣe ohun náà; “wá láti ọ̀dọ̀ Olúwa” tẹnumọ́ orísun rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ìlà yìí jẹ́ àyọlò láti Sáàmù 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: ti ọ̀dọ̀ Olúwa wá
  rationale: παρά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive sábà ń tọ́ka sí orísun. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì fi hàn pé ọ̀dọ̀ Olúwa ni èyí ti pilẹ̀ṣẹ̀, láìpa ìtumọ̀ míì tí ó lè jẹ́ pé Olúwa ló ṣe é run.
- source_word: κυρίου
  choice: Olúwa
  rationale: Nínú àyọlò Sáàmù yìí, κύριος ń tọ́ka sí Ọlọ́run. “Olúwa” ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, láìfi orúkọ àtọ̀runwá Hébérù tí kò sí nínú ọ̀rọ̀ Gíríìkì wọ̀ ọ́.
- source_word: ἐγένετο
  choice: wá
  rationale: Ní ìṣọ̀kan pẹ̀lú παρὰ κυρίου, “ti ọ̀dọ̀ … wá” mú èrò pé ohun náà ṣẹlẹ̀ tàbí pilẹ̀ láti ọ̀dọ̀ Olúwa jáde ní Yorùbá àdánidá.
- source_word: αὕτη
  choice: Èyí
  rationale: Ọ̀rọ̀-atọ́ka náà ń tọ́ka padà sí ohun tí ẹsẹ tó ṣáájú sọ nípa òkúta náà. “Èyí” pa ìtọ́kasí náà mọ́ láìfi “òkúta” kún ọ̀rọ̀ tí kò sí ní abala yìí.
- source_word: θαυμαστὴ
  choice: ohun ìyanu
  rationale: θαυμαστός túmọ̀ sí ohun tó yẹ fún ìyanu tàbí tó yanilẹ́nu. “Ohun ìyanu” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó ní iyì, tí kò sì le jù.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: ní ojú wa
  rationale: Ìtumọ̀ yìí pa àwòrán ojú inú ọ̀rọ̀ Gíríìkì àti ti Sáàmù mọ́, ó sì ṣeé lóye gẹ́gẹ́ bí “ní ojú ìwòye wa.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κύριος nínú àyọlò Sáàmù tó ń tọ́ka sí Ọlọ́run
  choice: Olúwa
  alternative: OLÚWA
  rationale: Bí ó tilẹ̀ jẹ́ pé Hébérù Sáàmù 118:23 ní orúkọ àtọ̀runwá, ọ̀rọ̀ Máàkù ní Gíríìkì lo κύριος. Nítorí náà, “Olúwa” tẹ̀ lé ẹ̀rí ọ̀rọ̀ Májẹ̀mú Tuntun, kò sì gbe ìkọ̀wé Hébérù wọ inú rẹ̀ láìṣe àlàyé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún ni a lò. Ìforúkọsílẹ̀ náà ní iyì tó yẹ fún àyọlò Sáàmù, ṣùgbọ́n ó ṣì jẹ́ èdè òde òní tó ṣeé lóye. A pa àwòrán “ní ojú wa” mọ́ dípò ṣíṣe àlàyé rẹ̀ sí “ní ojú ìwòye wa.”
