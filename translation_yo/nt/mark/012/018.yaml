  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: àwọn Sadusí wá sọ́dọ̀ Jesu, a ṣàlàyé ìgbọ́gbọ̀ wọn pé àjíǹde kò sí, lẹ́yìn náà wọ́n bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀. Ìfẹ̀sẹ̀mulẹ̀ ‘bẹ̀rẹ̀ sí í’ bójú mu pẹ̀lú imperfect ἐπηρώτων àti ìpinnu ìtúmọ̀ POB Gẹ̀ẹ́sì.'
