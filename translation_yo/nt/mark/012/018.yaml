id: MRK.12.18
reference: Mark 12:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: yo
  text: Àwọn Sadusí sì wá sọ́dọ̀ rẹ̀—àwọn tí ó sọ pé àjíǹde kò sí—wọ́n sì bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀ pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: àwọn Sadusí
  rationale: Orúkọ ẹgbẹ́ ẹ̀sìn náà ni a ṣe àkọsílẹ̀ rẹ̀ ní ìlànà Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: ἀνάστασιν
  choice: àjíǹde
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí jí dìde kúrò nínú òkú, ó sì bá ọ̀rọ̀ Gíríìkì mu ní àyíká ẹ̀kọ́ ẹ̀sìn yìí.
- source_word: ἐπηρώτων
  choice: wọ́n sì bẹ̀rẹ̀ sí í bi í léèrè
  rationale: Àkókò imperfect Gíríìkì lè fi ìṣe tí ó ń lọ tàbí tí a bẹ̀rẹ̀ hàn; ìtumọ̀ yìí pa ìtẹnumọ́ POB mọ́ pé wọ́n bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá àdánidá, ‘pé’ ni ọ̀nà tó rọrùn láti ṣí ọ̀rọ̀ tí wọ́n fẹ́ sọ, tí yóò sì tẹ̀ síwájú ní ẹsẹ tó tẹ̀ lé e.
theological_decisions:
- issue: Ìtumọ̀ ἀνάστασις
  choice: àjíǹde
  alternative: jí dìde lẹ́yìn ikú
  rationale: ‘Àjíǹde’ jẹ́ ọ̀rọ̀ ṣókí, tí ó mọ́gbọ́n dání, tí kò sì pinnu àwọn kúlẹ̀kúlẹ̀ ẹ̀kọ́ tí ẹsẹ yìí kò sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì gígùn yà àlàyé ẹgbẹ́ Sadusí sọ́tọ̀ láì mú ìtumọ̀ ẹsẹ náà yí padà.
