  terminology: ‘Sadusí’ jẹ́ àkọsílẹ̀ orúkọ ẹgbẹ́ náà tí ó yẹ, ‘àjíǹde’ sì jẹ́ ọ̀rọ̀ ìsìn Yorùbá tó pé fún ἀνάστασις. Kò sí ìṣòro ẹ̀kọ́ ìsìn tàbí orúkọ kankan.
  issues:
