source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: yo
  text: Nítorí gbogbo wọn fi nínú ohun tí wọ́n ní lọ́pọ̀ ju ohun tí wọ́n nílò lọ fúnni; ṣùgbọ́n òun, láti inú àìní rẹ̀, fi gbogbo ohun tí ó ní fúnni—gẹ́gẹ́ bí gbogbo ohun tí ó ní fún ìgbẹ́ ayé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “gbogbo ohun ìgbé-ayé rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn olówó tí wọ́n ń fi ọrẹ sínú àpótí, ó sì pa ìtẹnumọ́ pé gbogbo wọn mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìdájọ́ Jésù nínú ẹsẹ tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: lára àpọ̀jù ohun tí wọ́n ní
  rationale: Ó fi hàn pé ọrẹ wọn wá láti inú ohun tó pọ̀ ju ohun tí wọ́n nílò lọ, láìsọ pé gbogbo ọrọ̀ wọn ni.
- source_word: ἔβαλον / ἔβαλεν
  choice: fi ... sínú àpótí ọrẹ
  rationale: Báλλω túmọ̀ sí fífi tàbí ju ohun kan sínú ibì kan; fífi sínú àpótí ọrẹ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá àyíká ilé ìṣúra mu.
- source_word: αὕτη δὲ
  choice: ṣùgbọ́n obìnrin yìí
  rationale: Ó mú ìyàtọ̀ láàárín obìnrin opó náà àti àwọn olówó hàn kedere, láìfi ohun tí orísun kò sọ kún un.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: láti inú òṣì rẹ̀
  rationale: Ὑστέρησις níbí ń tọ́ka sí àìní gidi nípa ọrọ̀; “òṣì” jẹ́ ọ̀rọ̀ kedere, tó lágbára, tí ó sì bá àyíká mu.
- source_word: πάντα ὅσα εἶχεν
  choice: gbogbo ohun tí ó ní
  rationale: Ó pa ìtẹnumọ́ àti ìkúnrẹ́rẹ́ gbolohun Gíríìkì mọ́.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: gbogbo ohun tí ó fi lè gbé ayé
  rationale: Βίος ní àyíká ọrẹ owó yìí túmọ̀ sí ohun ìgbé-ayé tàbí ohun tí ènìyàn ń gbé lé, kì í ṣe ẹ̀mí ara rẹ̀ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ βίος nínú ọ̀rọ̀ ọrẹ obìnrin opó
  choice: ohun gbogbo tí ó fi lè gbé ayé
  alternative: gbogbo ìgbésí ayé rẹ̀
  rationale: Àyíká náà jẹ́ ti fífi owó sínú àpótí ọrẹ, βίος sì lè túmọ̀ sí ohun ìgbé-ayé. Yíyan èyí pa agbára ọrẹ rẹ̀ mọ́ láìjẹ́ kí ó dà bí ẹni pé ó fi ẹ̀mí ara rẹ̀ fúnni ní àkókò náà.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. “Àpọ̀jù ohun tí wọ́n ní” yà ohun tó kọjá àìní wọn sọ́tọ̀, “òṣì” sì mú àìní obìnrin náà hàn gbangba. Àmì àlàyé [a] wà lẹ́yìn gbolohun tí ó kan.
