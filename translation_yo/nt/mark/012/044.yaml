revisions:
- from: Nítorí gbogbo wọn fi lára àpọ̀jù ohun tí wọ́n ní sínú àpótí ọrẹ; ṣùgbọ́n obìnrin yìí, láti inú òṣì rẹ̀, fi gbogbo ohun tí ó ní sínú rẹ̀—gbogbo ohun tí ó fi lè gbé ayé.[a]
  to: Nítorí gbogbo wọn fi nínú ohun tí wọ́n ní lọ́pọ̀ ju ohun tí wọ́n nílò lọ fúnni; ṣùgbọ́n òun, láti inú àìní rẹ̀, fi gbogbo ohun tí ó ní fúnni—gẹ́gẹ́ bí gbogbo ohun tí ó ní fún ìgbẹ́ ayé rẹ̀.[a]
  rationale: A tún gbolohun náà kọ́ kí ìbáṣepọ̀ ἐκ (‘nínú/láti inú’) àti ἔβαλον (‘fúnni’) lè jẹ́ Yorùbá tó péye. A yọ “àpótí ọrẹ” kúrò nítorí kò hàn nínú gbolohun Gíríìkì yìí. A pa ìtẹnumọ́ πάντα ὅσα εἶχεν àti àlàyé ὅλον τὸν βίον αὐτῆς mọ́, pẹ̀lú àmì àlàyé [a] níbi tó yẹ.
