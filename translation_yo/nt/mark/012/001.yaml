id: MRK.12.1
reference: Mark 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: yo
  text: Ó sì bẹ̀rẹ̀ sí í bá wọn sọ̀rọ̀ ní àwọn òwe àpèjúwe pé, “Ọkùnrin kan gbin ọgbà àjàrà kan, ó sì fi ohun ìdènà yí i ká[a], ó gbẹ́ kòtò ìsàlẹ̀ fún ìfúntí wáìnì[b], ó kọ́ ilé ìṣọ́ kan, ó sì fi í yá fún àwọn àgbẹ̀ tí wọ́n gba a yá[c], lẹ́yìn náà ó lọ sí ibòmíràn.[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fi ọgbà ewéko yí i ká.” Ọ̀rọ̀ Gíríìkì φραγμός lè túmọ̀ sí ohun ìdènà, ọgbà ewéko, tàbí ààlà tí a fi yí ibi kan ká.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó gbẹ́ kòtò fún ìfúntí wáìnì.” Ọ̀rọ̀ Gíríìkì ὑπολήνιον ń tọ́ka ní pàtó sí ìkòkò tàbí kòtò ìsàlẹ̀ tí omi àjàrà ń ṣàn sí láti inú ìfúntí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó fi í yá fún àwọn àgbẹ̀” tàbí “ó fi í yá fún àwọn olùtọ́jú àjàrà.”
    reason: lexical_alternative
  - marker: d
    text: Àwòrán yìí ránni létí Àìsáyà 5:1–2, níbi tí a ti gbin ọgbà àjàrà, tí a fi ohun ìdènà yí i ká, tí a sì pèsè ohun èlò fún un.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: bẹ̀rẹ̀ sí í bá wọn sọ̀rọ̀
  rationale: Ó fi ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ inú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá, ó sì pa ìṣe sísọ̀rọ̀ mọ́.
- source_word: ἐν παραβολαῖς
  choice: nípa àwọn òwe àpèjúwe
  rationale: “Òwe àpèjúwe” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún àkọsílẹ̀ ìtàn àpèjúwe tí ń kọ́ni; ọ̀pọ̀ nǹkan inú Gíríìkì ni a pa mọ́.
- source_word: Ἀμπελῶνα
  choice: ọgbà àjàrà kan
  rationale: Ìtumọ̀ tààrà àti èyí tí ó wọ́pọ̀ fún ọgbà tí a ti ń gbin àjàrà.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà tọ́ka sí akọ tó ni ilẹ̀, kì í ṣe sí ènìyàn lápapọ̀.
- source_word: περιέθηκεν φραγμόν
  choice: ṣe ọgbà yí i ká
  rationale: Ó sọ pé ó fi ohun ìdènà dáàbò bo ọgbà àjàrà náà láì fi dandan pinnu bóyá igi, ewéko, tàbí ohun èlò mìíràn ni.
- source_word: ὤρυξεν ὑπολήνιον
  choice: gbẹ́ kòtò ìfúntí wáìnì
  rationale: ὑπολήνιον ni ibi ìsàlẹ̀ tí omi àjàrà ń ṣàn sí láti inú ohun ìfúntí; “kòtò ìfúntí wáìnì” mú pàtó yìí jáde.
- source_word: ᾠκοδόμησεν πύργον
  choice: kọ́ ilé ìṣọ́ kan
  rationale: “Ilé ìṣọ́” mú iṣẹ́ ilé gíga inú ọgbà náà yé òǹkàwé Yorùbá dáadáa.
- source_word: ἐξέδετο ... γεωργοῖς
  choice: fi ọgbà náà yá àwọn àgbẹ̀ olùgbé e
  rationale: Ó pa ìbáṣepọ̀ olúwa ilẹ̀ àti àwọn àgbẹ̀ tí wọ́n gba ilẹ̀ yá mọ́, láì sọ àwọn àgbẹ̀ di ẹni tó ni ọgbà náà.
- source_word: ἀπεδήμησεν
  choice: rìnrìn àjò lọ
  rationale: Ó fi hàn pé ó fi agbègbè náà sílẹ̀ fún àkókò kan, bí ọ̀rọ̀ Gíríìkì ṣe lè túmọ̀ sí.
theological_decisions:
- issue: Ìdánimọ̀ ἄνθρωπος
  choice: ọkùnrin kan
  alternative: ènìyàn kan
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ènìyàn lápapọ̀, ṣùgbọ́n ipa ẹni tó ni ọgbà nínú àpèjúwe yìí jẹ́ ti ọkùnrin; yíyan yìí kò fi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Pàtó ìtumọ̀ γεωργοῖς lẹ́yìn ἐξέδετο
  choice: àwọn àgbẹ̀ olùgbé e
  alternative: àwọn àgbẹ̀; àwọn olùtọ́jú àjàrà
  rationale: Ọ̀rọ̀ ìṣe “fi ... yá” fi hàn pé wọ́n ń ṣiṣẹ́ lórí ohun ìní ẹlòmíràn. Àṣàyàn yìí mú ìyàtọ̀ láàárín ẹni tó ni ọgbà àti àwọn tó gba a yá hàn.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún. “Òwe àpèjúwe” ń jẹ́ kí παραβολή yé òǹkàwé láì sọ ọ́ di òwe kúkúrú lásán. Àwọn àmì àlàyé [a]–[d] wà nínú ọ̀rọ̀ pàtàkì.
