revisions:
- from: Ó sì bẹ̀rẹ̀ sí í bá wọn sọ̀rọ̀ nípa àwọn òwe àpèjúwe pé, “Ọkùnrin kan gbin ọgbà àjàrà kan, ó ṣe ọgbà yí i ká[a], ó sì gbẹ́ kòtò ìfúntí wáìnì[b], ó kọ́ ilé ìṣọ́ kan, ó sì fi ọgbà náà yá àwọn àgbẹ̀ olùgbé e[c], lẹ́yìn náà ó rìnrìn àjò lọ. [d]”
  to: Ó sì bẹ̀rẹ̀ sí í bá wọn sọ̀rọ̀ ní àwọn òwe àpèjúwe pé, “Ọkùnrin kan gbin ọgbà àjàrà kan, ó sì fi ohun ìdènà yí i ká[a], ó gbẹ́ kòtò ìsàlẹ̀ fún ìfúntí wáìnì[b], ó kọ́ ilé ìṣọ́ kan, ó sì fi í yá fún àwọn àgbẹ̀ tí wọ́n gba a yá[c], lẹ́yìn náà ó lọ sí ibòmíràn.[d]”
  rationale: The revision corrects the central prepositional sense of ἐν παραβολαῖς, clarifies the vineyard enclosure without choosing between fence and hedge, renders the lower winepress vat/pit intelligibly, and expresses the leasing relationship idiomatically. It also places footnote d at the end of the quoted parable, where its cross-reference applies.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative sequence and the major agricultural details. However, “nípa àwọn òwe àpèjúwe” means “about parables,” rather than expressing that Jesus spoke in parables. The tenant-farmer expression also requires correction for idiomatic and grammatical clarity.
  naturalness: 'Several phrases are understandable but not fully natural in modern Standard Yoruba: “ṣe ọgbà yí i ká” is unclear as an enclosing barrier, “àwọn àgbẹ̀ olùgbé e” is not an idiomatic expression for tenants, and “rìnrìn àjò lọ” is unnecessarily repetitive. The revised wording is fluent while retaining the source’s compact narrative style.'
  terminology: “Òwe àpèjúwe,” “ọgbà àjàrà,” “ilé ìṣọ́,” and “àwọn àgbẹ̀” are suitable. The enclosure and winepress terminology is revised for clarity without wrongly specifying the material of the barrier or expanding the technical sense beyond the Greek.
  issues:
  - severity: high
    issue: “nípa àwọn òwe àpèjúwe”
    rationale: 'This means “about parables,” whereas ἐν παραβολαῖς describes the manner or medium of Jesus’ speech: he spoke in parables.'
  - severity: medium
    issue: “ó ṣe ọgbà yí i ká”
    rationale: This can suggest making another garden around the vineyard and does not clearly convey φραγμός, an enclosing barrier such as a fence or hedge.
  - severity: high
    issue: “àwọn àgbẹ̀ olùgbé e”
    rationale: This is not a natural or clear Yoruba designation for tenant farmers; it can be understood as farmers who live there rather than farmers who lease the vineyard.
  - severity: low
    issue: Footnote a uses “ọgbà” as an alternative for φραγμός
    rationale: “Ọgbà” normally denotes a garden/farm, not a fence, hedge, or enclosing barrier. The footnote should use terms for an enclosure.
  - severity: low
    issue: “rìnrìn àjò lọ”
    rationale: The construction is repetitive. “Lọ sí ibòmíràn” naturally conveys that the owner departed without adding a precise destination.
  revised_text: Ó sì bẹ̀rẹ̀ sí í bá wọn sọ̀rọ̀ ní àwọn òwe àpèjúwe pé, “Ọkùnrin kan gbin ọgbà àjàrà kan, ó sì fi ohun ìdènà yí i ká[a], ó gbẹ́ kòtò ìsàlẹ̀ fún ìfúntí wáìnì[b], ó kọ́ ilé ìṣọ́ kan, ó sì fi í yá fún àwọn àgbẹ̀ tí wọ́n gba a yá[c], lẹ́yìn náà ó lọ sí ibòmíràn.[d]”
