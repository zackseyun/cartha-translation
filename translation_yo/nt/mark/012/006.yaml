source:
  edition: SBLGNT
  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: yo
  text: Ó ṣì ní ẹnì kan ṣoṣo, ọmọkùnrin rẹ̀ olùfẹ́.[a] Ní ìkẹyìn, ó rán an sí wọn, ó ní, “Wọn yóò bọ̀wọ̀ fún ọmọkùnrin mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ṣì ní ẹnì kan sí i, ọmọkùnrin rẹ̀ tí ó fẹ́ràn gidigidi.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí “ojú yóò tì wọ́n níwájú ọmọkùnrin mi” tàbí “wọn yóò fi ìtẹríba hàn sí ọmọkùnrin mi”; nínú àyíká yìí, “bọ̀wọ̀ fún” bá a mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Ó ṣì ní ẹnì kan ṣoṣo
  rationale: Ó fi hàn pé lẹ́yìn àwọn ìránṣẹ́ tí ó ti rán, ẹnì kan ṣoṣo ṣì kù lọ́wọ́ rẹ̀; gbólóhùn náà sì ṣe déédé ní Yorùbá.
- source_word: υἱὸν ἀγαπητόν
  choice: ọmọkùnrin àyànfẹ́ rẹ̀
  rationale: “Àyànfẹ́” túmọ̀ sí ẹni tí a fẹ́ràn gidigidi, ó sì pa ìwọ̀n ọ̀rọ̀ náà àti ìṣọ̀kan rẹ̀ pẹ̀lú àwòrán Ọmọ àyànfẹ́ nínú Máàkù mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἀπέστειλεν
  choice: ó rán an
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé fún fífi ẹni kan ránṣẹ́ sí àwọn ẹlòmíràn.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: Ní ìkẹyìn, ó rán an sí wọn
  rationale: “Ní ìkẹyìn” fi ipò ọmọ náà gẹ́gẹ́ bí ẹni ìkẹyìn nínú ọ̀wọ̀ àwọn tí a rán hàn ní kedere.
- source_word: λέγων ὅτι
  choice: ó ní
  rationale: Ọ̀nà àdánidá ní Yorùbá láti ṣáájú ọ̀rọ̀ tààrà ni “ó ní.”
- source_word: Ἐντραπήσονται
  choice: Wọn yóò bọ̀wọ̀ fún
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí fífi ọ̀wọ̀ tàbí ìtẹríba hàn, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ jíjẹ́ kí ojú tì ẹni.
- source_word: τὸν υἱόν μου
  choice: ọmọkùnrin mi
  rationale: Ó túmọ̀ gbólóhùn ohun-ìní náà ní tààrà, ó sì pa agbára àwòrán ọmọ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ nípa Kristi tó wà nínú “ọmọkùnrin àyànfẹ́”
  choice: Pa “ọmọkùnrin àyànfẹ́ rẹ̀” mọ́ nínú ẹsẹ̀ láìṣàfikún àlàyé.
  alternative: ọmọkùnrin rẹ̀ tí ó fẹ́ràn gidigidi
  rationale: Gbólóhùn náà lè mú Ọmọ àyànfẹ́ nínú ìwé Máàkù wá sí ọkàn, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó kọjá ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó ṣe yẹ. “Ẹnì kan ṣoṣo” ṣàfihàn ẹni kan tó kù, “àyànfẹ́” sì jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání fún ẹni tí a fẹ́ràn gidigidi. Àwọn àmì [a] àti [b] wà nínú ẹsẹ̀, wọ́n sì bá àwọn àlàyé ìsàlẹ̀ mu.
