source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: yo
  text: Nítorí nígbà tí wọ́n bá jí dìde láàárín àwọn òkú, wọn kì í gbéyàwó, bẹ́ẹ̀ ni a kì í fi wọn fúnni ní ìgbéyàwó; ṣùgbọ́n wọ́n dàbí àwọn áńgẹ́lì ní ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ọ̀run.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Nítorí nígbà tí ... bá
  rationale: “Nítorí” mú agbára àlàyé γάρ jáde, “nígbà tí ... bá” sì sọ ìtumọ̀ àkókò tí ὅταν ní ní Yorùbá àdánidá.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: wọ́n bá jí dìde kúrò nínú òkú
  rationale: “Jí dìde” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún àjíǹde, ó sì bá ìṣe alágbára ἀναστῶσιν mu; “kúrò nínú òkú” pa èrò ἐκ νεκρῶν mọ́.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: wọn kì í gbéyàwó, bẹ́ẹ̀ ni a kì í fi wọn fún ẹlòmíràn ní ìgbéyàwó
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín wíwọ inú ìgbéyàwó àti fífi ẹni fún ẹlòmíràn ní ìgbéyàwó mọ́, ó sì fi ìbáṣepọ̀ οὔτε ... οὔτε hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀλλ’ εἰσὶν ὡς ἄγγελοι
  choice: ṣùgbọ́n wọ́n dàbí àwọn áńgẹ́lì
  rationale: “Ṣùgbọ́n” fi ìtakora ἀλλά hàn; “dàbí” sọ ìfiwéra ὡς, láì sọ pé àwọn tó jí dìde di áńgẹ́lì.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà, “ní ọ̀run” ni ọ̀nà Yorùbá tó rọrùn, tó sì ṣe àdánidá jù lọ ní àyíká yìí; àlàyé ìsàlẹ̀ fi ọ̀pọ̀ Gíríìkì náà hàn.
theological_decisions:
- issue: Irú ìfiwéra pẹ̀lú àwọn áńgẹ́lì
  choice: Àwọn tí ó jí dìde dàbí àwọn áńgẹ́lì ní ti àìṣe ìgbéyàwó; a kò sọ pé wọ́n di áńgẹ́lì.
  alternative: Àwọn tí ó jí dìde yí padà di áńgẹ́lì.
  rationale: Patikulu ìfiwéra ὡς túmọ̀ sí ìfarajọ, kì í ṣe pé irú ẹni wọn yí padà. “Wọ́n dàbí” pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà níyì, ó ṣe àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ìsàlẹ̀ [a] sí “ọ̀run,” ibi tí àlàyé rẹ̀ kan ní tààrà.
