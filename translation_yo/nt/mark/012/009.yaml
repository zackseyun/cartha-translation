source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: yo
  text: Kí ni ẹni tó ni ọgbà àjàrà náà[a] yóò ṣe? Yóò wá, yóò sì pa àwọn àgbẹ̀ ayálégbé náà run, yóò sì fi ọgbà àjàrà náà fún àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “olúwa ọgbà àjàrà náà” tàbí “ọ̀gá ọgbà àjàrà náà”; Gíríìkì: “κύριος (kyrios) ọgbà àjàrà náà.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ọgbà àjàrà jẹ́ tirẹ̀ nínú àkàwé náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: Kí ni ... yóò ṣe?
  rationale: Ìbéèrè yìí túmọ̀ ọ̀rọ̀ arọ́pò-orúkọ ìbéèrè τί àti ọ̀rọ̀-ìṣe ọjọ́ iwájú ποιήσει ní ọ̀nà Yorùbá tó ṣe déédé, láìfi ìsopọ̀ míì kún un.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: olówó ọgbà àjàrà náà
  rationale: Nínú àkàwé yìí, κύριος ń tọ́ka sí ẹni tí ọgbà àjàrà jẹ́ tirẹ̀. “Olówó” mú ìtumọ̀ onílé tàbí ẹni tó ni ohun-ìní náà jáde, láìsọ ọ́ di orúkọ oyè Ọlọ́run.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ibi tí wọ́n ti ń gbin àjàrà.
- source_word: ἐλεύσεται
  choice: Yóò wá
  rationale: Ó pa ìṣe ọjọ́ iwájú àti ìfarahàn olówó ọgbà náà mọ́ ní ṣókí.
- source_word: ἀπολέσει
  choice: yóò sì pa ... run
  rationale: Gbólóhùn Yorùbá yìí fi ìdájọ́ líle àti ìparun pátápátá hàn. Ní àyíká àkàwé náà, ó bá ìṣe tí olówó yóò ṣe sí àwọn àgbẹ̀ náà mu.
- source_word: τοὺς γεωργούς
  choice: àwọn àgbẹ̀ ayálégbé náà
  rationale: γεωργοί jẹ́ àwọn tó ń ṣiṣẹ́ ọgbà ẹlòmíràn gẹ́gẹ́ bí ayálégbé, kì í ṣe òṣìṣẹ́ oko lásán. Àkójọpọ̀ ọ̀rọ̀ yìí pa iṣẹ́ àgbẹ̀ àti ipò ayálégbé wọn mọ́.
- source_word: δώσει
  choice: yóò sì fi ... fún
  rationale: “Fi ... fún” jẹ́ ọ̀nà Yorùbá àdánidá fún δίδωμι níhìn-ín, láìfi èrò yíyá tàbí fífi sí ìkáwọ́ tí Gíríìkì kò sọ ní pàtó kún un.
- source_word: ἄλλοις
  choice: àwọn ẹlòmíràn
  rationale: Ó pa àìsọ ẹni tí wọ́n jẹ́ ní pàtó mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, dípò ṣíṣe wọn ní “àwọn ayálégbé mìíràn.”
theological_decisions:
- issue: Ìtumọ̀ κύριος níbi tí ó ti ń tọ́ka sí ẹni inú àkàwé, kì í ṣe oyè Ọlọ́run ní tààrà
  choice: olówó
  alternative: olúwa; ọ̀gá
  rationale: “Olówó” tọ́ka sí ẹni tí ọgbà àjàrà jẹ́ tirẹ̀ nínú ìtàn náà. Èyí kò fi ìtumọ̀ oyè Ọlọ́run sínú ọ̀rọ̀ náà ní tipátipá, ṣùgbọ́n kò sì dí ìtumọ̀ ẹ̀kọ́ ìsìn tí àkàwé náà lè ní nínú àyíká rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti bá àṣà ìkọ̀wé mu. “Àgbẹ̀ ayálégbé” ṣàlàyé ipa àwọn γεωργοί láìsọ ohun tí ọ̀rọ̀ Gíríìkì kò sọ.
