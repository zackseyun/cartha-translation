revisions:
- from: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ wá sọ́dọ̀ ara rẹ̀, ó wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín, opó tálákà yìí fi sínú àpótí ìṣúra[a] ju gbogbo àwọn tí ń fi sí inú rẹ̀ lọ.”
  to: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ wá sí ọ̀dọ̀ rẹ̀, ó wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín, opó tálákà yìí ti fi sínú àpótí ìṣúra[a] ju gbogbo àwọn tí ń fi sí inú rẹ̀ lọ.”
  rationale: 'The revision makes two limited idiomatic and aspectual improvements: it replaces the redundant ‘sí ọ̀dọ̀ ara rẹ̀’ with the natural ‘sí ọ̀dọ̀ rẹ̀,’ and uses ‘ti fi’ to present the widow’s contribution as completed against the ongoing contributions of the others. It retains the Greek comparative ambiguity and keeps the footnote anchor on ‘àpótí ìṣúra.’'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the calling of the disciples, the solemn affirmation, the poor widow, the completed contribution, the ongoing contributions of others, and the comparative wording without specifying whether ‘more’ is monetary or qualitative. The Greek participle προσκαλεσάμενος is best expressed idiomatically in Yoruba as calling them to himself, without the somewhat redundant ‘ara rẹ̀.’
  naturalness: The proposed wording is generally clear and dignified. ‘Pe àwọn ọmọ-ẹ̀yìn rẹ̀ wá sí ọ̀dọ̀ rẹ̀’ is more natural Standard Yoruba than ‘pe ... wá sọ́dọ̀ ara rẹ̀.’ Adding ‘ti’ to the widow’s action clearly distinguishes her completed act from the others’ ongoing action marked by ‘ń.’
  terminology: ‘Àwọn ọmọ-ẹ̀yìn,’ ‘opó,’ ‘tálákà,’ and ‘àpótí ìṣúra’ are suitable. The footnote appropriately preserves the possible range of γαζοφυλάκιον as a receptacle or the temple treasury area.
  issues:
  - severity: low
    issue: The phrase ‘wá sọ́dọ̀ ara rẹ̀’ is slightly redundant/less idiomatic.
    rationale: In Standard Yoruba, ‘pe ... wá sí ọ̀dọ̀ rẹ̀’ naturally conveys summoning people to oneself and retains the middle-force implication without adding ‘ara.’
  - severity: low
    issue: The widow’s completed action is not overtly marked in the Yoruba verb phrase.
    rationale: Although context can imply completion, ‘ti fi’ better reflects the aorist ἔβαλεν in contrast to ‘àwọn tí ń fi,’ which correctly represents the present participle.
  revised_text: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ wá sí ọ̀dọ̀ rẹ̀, ó wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín, opó tálákà yìí ti fi sínú àpótí ìṣúra[a] ju gbogbo àwọn tí ń fi sí inú rẹ̀ lọ.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “àpótí ọrẹ” tàbí “ibi ìṣúra.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun èlò tí a fi ń gba ọrẹ tàbí sí agbègbè ìṣúra tẹ́ńpìlì.
    reason: lexical_alternative
  revision_rationale: 'The revision makes two limited idiomatic and aspectual improvements: it replaces the redundant ‘sí ọ̀dọ̀ ara rẹ̀’ with the natural ‘sí ọ̀dọ̀ rẹ̀,’ and uses ‘ti fi’ to present the widow’s contribution as completed against the ongoing contributions of the others. It retains the Greek comparative ambiguity and keeps the footnote anchor on ‘àpótí ìṣúra.’'
