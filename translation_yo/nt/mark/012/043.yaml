id: MRK.12.43
reference: Mark 12:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: yo
  text: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ wá sí ọ̀dọ̀ rẹ̀, ó wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín, opó tálákà yìí ti fi sínú àpótí ìṣúra[a] ju gbogbo àwọn tí ń fi sí inú rẹ̀ lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àpótí ọrẹ” tàbí “ibi ìṣúra.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun èlò tí a fi ń gba ọrẹ tàbí sí agbègbè ìṣúra tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe … wá sọ́dọ̀ ara rẹ̀
  rationale: Ó fi hàn pé Jésù pe àwọn ọmọ-ẹ̀yìn rẹ̀ kí wọ́n sún mọ́ ọn; ó sì jẹ́ ọ̀nà àdánidá láti túmọ̀ participle middle náà ní Yorùbá.
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn tó ń tẹ̀ lé olùkọ́ tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìfìdí múlẹ̀ tí Jésù fi bẹ̀rẹ̀ gbólóhùn rẹ̀ mọ́, ní èdè Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: χήρα
  choice: opó
  rationale: Ìtumọ̀ tààrà àti èyí tó wọ́pọ̀ fún obìnrin tí ọkọ rẹ̀ ti kú.
- source_word: πτωχὴ
  choice: tálákà
  rationale: Ó sọ ipò àìní obìnrin náà ní kedere láìṣe àfikún ohun tí ẹsẹ náà kò sọ.
- source_word: πλεῖον πάντων
  choice: ju gbogbo … lọ
  rationale: Ó pa ìfiwéra Gíríìkì mọ́ láìṣàlàyé nínú ọ̀rọ̀ pàtàkì bóyá iye owó tàbí ìwọ̀n ẹbọ ni a ń fi wéra.
- source_word: ἔβαλεν
  choice: fi sínú
  rationale: Nínú ọ̀rọ̀ fífi ọrẹ sí àpótí, èyí jẹ́ ọ̀nà àdánidá ní Yorùbá ju títúmọ̀ βάλλω gẹ́gẹ́ bí ‘sọ’ tàbí ‘jù’ lọ.
- source_word: τῶν βαλλόντων
  choice: àwọn tí ń fi sí inú rẹ̀
  rationale: Àmì ‘ń’ pa ìṣe tí ó ń lọ lọ́wọ́ nínú present participle mọ́.
- source_word: γαζοφυλάκιον
  choice: àpótí ìṣúra
  rationale: Ó tọ́ka sí ibi tàbí ohun èlò gbígba ọrẹ ní tẹ́ńpìlì; ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa fífẹ̀ ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìdájọ́ Jésù nípa ọrẹ opó náà
  choice: Pa ọ̀rọ̀ ìfiwéra náà mọ́ gẹ́gẹ́ bí ‘fi … ju gbogbo … lọ’ láìsọ irú ‘jù’ tí ó jẹ́.
  alternative: Láti túmọ̀ ọ́ ní pàtó pé iye owó rẹ̀ pọ̀ ju ti gbogbo wọn lọ, tàbí pé iye ẹbọ rẹ̀ ní ojú Ọlọ́run ló pọ̀ jù.
  rationale: Ẹsẹ tó tẹ̀ lé e ṣàlàyé pé obìnrin náà fi fúnni láti inú àìní rẹ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ìfiwéra náà di ti iye owó nìkan tàbí ti ìwúlò ẹ̀mí nìkan. Ìtumọ̀ náà pa àìdánilójú àti ìforígbárí ìmọ̀-ẹ̀sìn yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi [a] sí lẹ́yìn ‘àpótí ìṣúra,’ ibi tí àlàyé náà bá mu.
