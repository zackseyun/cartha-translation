id: MRK.12.7
reference: Mark 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: yo
  text: Ṣùgbọ́n àwọn àgbẹ̀ ayálégbé wọ̀nyẹn sọ fún ara wọn[a] pé, “Ẹni yìí ni ajogún náà. Ẹ wá, ẹ jẹ́ kí a pa á, ogún náà yóò sì di tiwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ láàárín ara wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ogún náà yóò jẹ́ tiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Ṣùgbọ́n àwọn ... wọ̀nyẹn
  rationale: “Ṣùgbọ́n” mú ìyípadà onírẹ̀lẹ̀ tí δέ ní nínú ìtàn jáde, “wọ̀nyẹn” sì pa agbára àfihàn ἐκεῖνοι mọ́.
- source_word: γεωργοὶ
  choice: àwọn àgbẹ̀ ayálégbé
  rationale: Nínú àkàwé ọgbà àjàrà yìí, àwọn náà jẹ́ àgbẹ̀ tí wọ́n gba ilẹ̀ olówó ṣe àgbẹ̀, kì í ṣe òṣìṣẹ́ oko lásán; ọ̀rọ̀ yìí mú ipò wọn gẹ́gẹ́ bí ayálégbé hàn.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: sọ fún ara wọn
  rationale: Ó fi ìjíròrò inú ẹgbẹ́ wọn hàn ní Yorùbá àdánidá, láì sọ ọ́ di èrò inú ẹni kọ̀ọ̀kan.
- source_word: ὅτι
  choice: pé, “…”
  rationale: ὅτι ń ṣí ọ̀rọ̀ tààrà sílẹ̀ níbí; “pé” pẹ̀lú àmì ọ̀rọ̀ àsọyé jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Ẹni yìí ni ajogún náà
  rationale: “Ẹni yìí” tọ́ka sí ènìyàn lọ́nà àdánidá, “ajogún” sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tó ní ẹ̀tọ́ sí ogún.
- source_word: δεῦτε
  choice: Ẹ wá
  rationale: Ó pa ìpè ìmúrasílẹ̀ àti ìṣírí δεῦτε mọ́ ní ọ̀nà àdánidá.
- source_word: ἀποκτείνωμεν
  choice: ẹ jẹ́ kí a pa á
  rationale: Ó mú àbá ìṣírí ẹni àkọ́kọ́ púpọ̀ jáde ní tààrà, láì fi ìtumọ̀ òfin míì kún ọ̀rọ̀ náà.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: ogún náà yóò sì di tiwa
  rationale: Ó pa ìtẹnumọ́ ohun-ìní ἡμῶν mọ́, láì fi “tirẹ̀” kún un, nítorí kò sí ní pàtó nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ γεωργοί tó bá àkàwé mu
  choice: àwọn àgbẹ̀ ayálégbé
  alternative: àwọn ayálégbé; àwọn àgbẹ̀; àwọn olùtọ́jú ọgbà àjàrà
  rationale: Yíyan yìí fi hàn pé wọ́n ń ṣiṣẹ́ ilẹ̀ tí kì í ṣe tiwọn, ó sì pa ìbáṣepọ̀ wọn pẹ̀lú olúwa ọgbà mọ́ láì fi ìtumọ̀ àpẹẹrẹ ẹ̀sìn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ; “àgbẹ̀ ayálégbé” ṣàlàyé ipò àwọn olùṣe oko náà láì gùn jù.
