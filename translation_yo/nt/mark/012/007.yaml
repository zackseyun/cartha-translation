  naturalness: Yorùbá náà jẹ́ ti ìgbàlódé, ó ṣeé ka, ó sì yẹ fún ìtàn àkàwé tó ní ìwọ̀ntúnwọ̀nsì. Àmì ohùn àti ìkọ̀wé jẹ́ títọ́. “Ẹ jẹ́ kí a pa á” jẹ́ ọ̀nà tó bójú mu láti sọ àbá ẹgbẹ́ náà, bí ó tilẹ̀ jẹ́ pé “ẹ jẹ́ ká pa á” tún lè wọ́pọ̀ ní ọ̀rọ̀ àsọyé.
  terminology: “Àgbẹ̀ ayálégbé,” “ajogún,” àti “ogún” jẹ́ àwọn ọ̀rọ̀ tó péye nínú àyíká yìí. Wọ́n ṣàlàyé ipò àwọn olùgbẹ́ ilẹ̀ náà àti ẹ̀tọ́ ajogún láì fi ìtumọ̀ ẹ̀kọ́ ìjọ tàbí ìtúmọ̀ àpẹẹrẹ mìíràn kún un.
