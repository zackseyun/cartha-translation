id: MRK.12.2
reference: Mark 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: yo
  text: Ó sì rán ẹrú kan[a] sí àwọn àgbẹ̀ ọgbà àjàrà[b] ní àkókò tí ó yẹ, kí ó lè gba díẹ̀ lára èso ọgbà àjàrà lọ́wọ́ àwọn àgbẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́” fún “ẹrú” (δοῦλος).
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn àgbẹ̀” tàbí “àwọn ayálégbé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ń ṣiṣẹ́ ilẹ̀; ọgbà àjàrà tí a mẹ́nu kàn níbí ló mú kí “àwọn àgbẹ̀ ọgbà àjàrà” bá àyíká ọ̀rọ̀ náà mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ pé ẹnì kan ní kí ẹlòmíràn lọ ṣe iṣẹ́ kan; ó bá ìṣe àlàyé ἀποστέλλω mu.
- source_word: γεωργοὺς / γεωργῶν
  choice: àwọn àgbẹ̀ ọgbà àjàrà
  rationale: γεωργός túmọ̀ sí ẹni tí ń ṣiṣẹ́ ilẹ̀. Nítorí pé ọgbà àjàrà ni àyíká ọ̀rọ̀ náà, àfikún “ọgbà àjàrà” mú ìtumọ̀ pàtó náà hàn láìfi dandan sọ pé ayálégbé ni wọ́n.
- source_word: τῷ καιρῷ
  choice: ní àkókò tí ó yẹ
  rationale: καιρός níbí tọ́ka sí àkókò tí ó bójú mu tàbí tí a yàn, bóyá àkókò ìkórè; ìtumọ̀ yìí kò fi ohun tí Gíríìkì kò sọ kún un.
- source_word: δοῦλον
  choice: ẹrú
  rationale: Ní àwùjọ ìgbà náà, δοῦλος ń tọ́ka sí ẹni tí olúwa ní lórí, kì í ṣe òṣìṣẹ́ ilé lásán. “Ẹrú” pa ipò àwùjọ yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi “ìránṣẹ́” sílẹ̀ gẹ́gẹ́ bí àṣàyàn.
- source_word: ἵνα ... λάβῃ
  choice: kí ó lè gba
  rationale: Ìtumọ̀ yìí pa ète tí ἵνα àti ọ̀rọ̀-ìṣe abẹ́ rẹ̀ ń fi hàn mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: παρὰ τῶν γεωργῶν
  choice: lọ́wọ́ àwọn àgbẹ̀ náà
  rationale: παρά pẹ̀lú ọ̀rọ̀-orúkọ oníbùdó-orísun fi ibi tàbí ẹni tí ohun ti wá hàn; “lọ́wọ́” ni ọ̀nà Yorùbá àdánidá láti sọ orísun ní irú àyíká yìí.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: díẹ̀ lára èso ọgbà àjàrà
  rationale: ἀπό pẹ̀lú ẹ̀yà ọ̀rọ̀ yìí ń tọ́ka sí apá kan lára odindi ohun; “díẹ̀ lára” mú ìtumọ̀ apá-inú-odindi náà hàn láìfi èrò “ìpín tirẹ̀” kún un.
- source_word: ἀμπελῶνος
  choice: ọgbà àjàrà
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ἀμπελών.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ. Gbólóhùn náà pa ìtẹ̀síwájú ìtàn mọ́ pẹ̀lú “Ó sì,” ó sì yẹra fún fífi dandan sọ pé àwọn àgbẹ̀ náà jẹ́ ayálégbé tàbí pé ohun tí olúwa fẹ́ gba ni “ìpín tirẹ̀,” nítorí Gíríìkì kò sọ àwọn ohun wọ̀nyẹn ní tààràtà.
