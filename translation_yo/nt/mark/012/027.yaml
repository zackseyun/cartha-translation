id: MRK.12.27
reference: Mark 12:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: yo
  text: Kì í ṣe Ọlọ́run àwọn òkú[a], bí kò ṣe ti àwọn alààyè. Ẹ ṣìnà gidigidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Ọlọ́run kì í ṣe Ọlọ́run àwọn òkú, bí kò ṣe ti àwọn alààyè.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “Ẹ wà nínú àṣìṣe ńlá” tàbí “Ẹ ṣe àṣìṣe gidigidi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Nínú àyíká ọ̀rọ̀ yìí, θεός ń tọ́ka sí Ọlọ́run Ábúráhámù, Ísáákì àti Jékọ́bù; nítorí náà, orúkọ oyè pàtó “Ọlọ́run” ló bá a mu, kì í ṣe “ọlọ́run kan.”
- source_word: νεκρῶν
  choice: àwọn òkú
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-orúkọ ní ìtumọ̀, ó sì ń tọ́ka sí àwọn tí ó ti kú; “àwọn òkú” pa ìyàtọ̀ rẹ̀ mọ́ pẹ̀lú “àwọn alààyè.”
- source_word: ἀλλὰ ζώντων
  choice: bí kò ṣe ti àwọn alààyè
  rationale: ζώντων ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀-orúkọ fún àwọn tí ó wà láàyè. “Bí kò ṣe ti àwọn alààyè” jẹ́ Yorùbá àdánidá, ó sì pa ìtakora inú Gíríìkì mọ́.
- source_word: πολὺ
  choice: gidigidi
  rationale: πολύ ń mú agbára πλανᾶσθε pọ̀ sí i; “gidigidi” fi ìbáwí líle náà hàn ní Yorùbá òde òní.
- source_word: πλανᾶσθε
  choice: Ẹ ṣìnà
  rationale: Fọ́ọ̀mù yìí lè ní ìmọ̀lára ṣíṣìnà, wíwà nínú àṣìṣe, tàbí jíjẹ́ ẹni tí a tàn. Nínú àyíká yìí, “Ẹ ṣìnà” jẹ́ àdánidá, ó sì yàgò fún ṣíṣe ìpinnu bóyá àwọn fúnra wọn ló ṣìnà tàbí ẹlòmíràn ló tàn wọ́n.
- source_word: οὐκ ἔστιν
  choice: Kì í ṣe
  rationale: Gbólóhùn Gíríìkì sọ ìkọ̀sílẹ̀ ìbáṣepọ̀ náà ní ṣókí. “Kì í ṣe Ọlọ́run àwọn òkú” jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere láìfi arọ́pò-orúkọ kún un níbi tí kò ti pọn dandan.
theological_decisions:
- issue: Ìtumọ̀ tí ọ̀rọ̀ Jésù ní fún ìyè àti àjíǹde
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìtakora tààrà láàárín “àwọn òkú” àti “àwọn alààyè,” láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: A lè ṣàlàyé rẹ̀ sí i gẹ́gẹ́ bí ẹ̀rí pé àwọn baba ńlá ṣì wà láàyè níwájú Ọlọ́run tàbí pé àjíǹde yóò ṣẹlẹ̀.
  rationale: Ọ̀rọ̀ náà jẹ́ apá kan ìjiyàn Jésù nípa àjíǹde, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ yanju bí ìyè àwọn baba ńlá àti àjíǹde ṣe ní í ṣe pẹ̀lú ara wọn ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ.
translation_notes:
  register: A lo Yorùbá àfẹnusọ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Ẹ” pa ọ̀wọ̀ àti ọ̀pọ̀ ènìyàn tí πλανᾶσθε ń bá sọ mọ́. Àkọ́kọ́ gbólóhùn jẹ́ ṣókí bí ti Gíríìkì, kò sì fi ẹ̀kọ́ ìgbàgbọ́ àfikún sínú ọ̀rọ̀ náà.
