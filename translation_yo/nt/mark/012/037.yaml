source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: yo
  text: Dáfídì fúnra rẹ̀ ń pè é ní ‘Olúwa’; báwo wá ni ó ṣe jẹ́ ọmọ rẹ̀?[a][b] Ọ̀pọ̀ ènìyàn náà sì ń fi ayọ̀ tẹ́tí sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀rọ̀ tí ó túmọ̀ ní tààrà jù: “Láti ibo ni ó ti jẹ́ ọmọ rẹ̀?”'
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, “ọmọ” ń tẹnu mọ́ oyè Mèsáyà náà, “Ọmọ Dáfídì”; ó sì tún lè ní ìtumọ̀ gbòòrò pé “àtọmọdọ́mọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Dáfídì fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ αὐτός mọ́, pé Dáfídì fúnra rẹ̀ gan-an ni ó lo orúkọ oyè náà.
- source_word: λέγει αὐτὸν κύριον
  choice: ń pè é ní ‘Olúwa’
  rationale: Nínú gbólóhùn yìí, λέγει túmọ̀ sí fífi orúkọ oyè kan pe ẹnì kan; ‘ń pè é ní’ jẹ́ èdè Yorùbá àdánidá, ‘Olúwa’ sì pa agbára orúkọ oyè κύριος mọ́.
- source_word: καὶ πόθεν
  choice: báwo wá
  rationale: Bí ó tilẹ̀ jẹ́ pé πόθεν túmọ̀ ní tààrà sí ‘láti ibo,’ níbí ó ń béèrè nípa ìdí tàbí ọ̀nà tí ọ̀rọ̀ náà fi lè rí bẹ́ẹ̀. ‘Báwo wá’ mú agbára ìbéèrè àríyànjiyàn náà jáde ní Yorùbá àdánidá.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: ó ṣe jẹ́ ọmọ rẹ̀
  rationale: ‘Ọmọ rẹ̀’ pa ọ̀rọ̀ υἱός àti ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ oyè Mèsáyà, ‘Ọmọ Dáfídì,’ mọ́; a kò dín un kù sí ‘àtọmọdọ́mọ’ nínú ara ẹsẹ náà.
- source_word: ὁ πολὺς ὄχλος
  choice: Ogunlọ́gọ̀ èrò náà
  rationale: Ọ̀rọ̀ yìí fi hàn pé èrò náà pọ̀ gidigidi; ‘ogunlọ́gọ̀ èrò’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì ní iyì.
- source_word: ἤκουεν αὐτοῦ
  choice: ń ... tẹ́tí sí i
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ nínú ἤκουεν ni a fi ‘ń tẹ́tí sí i’ hàn, kì í ṣe pé wọ́n kàn gbọ́ ọ̀rọ̀ rẹ̀ lẹ́ẹ̀kan ṣoṣo.
- source_word: ἡδέως
  choice: fi ayọ̀
  rationale: Ó sọ pé inú àwọn olùgbọ́ dùn sí fífetí sí Jesu; ‘fi ayọ̀’ jẹ́ kedere, ó sì bá èdè Yorùbá òde òní mu.
theological_decisions:
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú bí Dáfídì ṣe pe Mèsáyà ní ‘Olúwa’
  choice: A pa orúkọ oyè ‘Olúwa’ àti ìbéèrè náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Kí a sọ ní gbangba pé Dáfídì ń pe Mèsáyà ní Olúwa, tàbí kí a ṣàlàyé pé Mèsáyà ju àtọmọdọ́mọ Dáfídì lásán lọ.
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ dá ìforígbárí ìtumọ̀ sílẹ̀ láàárín ‘Olúwa’ àti ‘ọmọ.’ Ìtumọ̀ yẹ kí ó pa agbára yẹn mọ́ láìyanjú rẹ̀ nípasẹ̀ àfikún.
- issue: Ìtumọ̀ υἱός nínú ọ̀rọ̀ nípa Mèsáyà
  choice: ọmọ
  alternative: àtọmọdọ́mọ
  rationale: ‘Ọmọ’ pa ìró orúkọ oyè ‘Ọmọ Dáfídì’ àti ìbéèrè Jesu mọ́. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé ó tún lè túmọ̀ sí àtọmọdọ́mọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Ogunlọ́gọ̀ èrò’ yẹra fún ọ̀rọ̀ àtijọ́ tí kò rọrùn, ‘ń fi ayọ̀ tẹ́tí sí i’ sì jẹ́ ọ̀rọ̀ àdánidá fún ìṣe tí ó ń lọ lọ́wọ́ àti ìdùnnú àwọn olùgbọ́.
