  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: yo
  text: Opó tálákà kan sì dé, ó sì fi lépítà méjì sílẹ̀, èyí tí ó dọ́gba pẹ̀lú kọ́dráńtì kan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lépítọ́n kan jẹ́ owó kékeré gan-an; lépítà méjì dọ́gba pẹ̀lú kọ́dráńtì Róòmù kan.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “owó bàbà kékeré méjì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: dé
  rationale: Aorist participle náà ń tọ́ka sí dídé obìnrin náà; lílo ọ̀rọ̀-ìṣe aláṣẹ pẹ̀lú “ó sì” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìṣàn ìtàn mọ́.
- source_word: μία
  choice: kan
  rationale: Níhìn-ín μία ń mú ẹnì kan wọ inú ìtàn, kò sì fi dandan tẹnumọ́ iye “ọ̀kan”; “kan” bá èdè Yorùbá mu.
- source_word: χήρα πτωχὴ
  choice: obìnrin opó tálákà
  rationale: “Obìnrin opó” sọ χήρα ní kedere, “tálákà” sì jẹ́ ìtumọ̀ àdánidá fún πτωχή láì sọ ipò rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἔβαλεν
  choice: fi … sínú àpótí ọrẹ
  rationale: Ní àyíká yìí ọ̀rọ̀ náà túmọ̀ sí fífi owó sínú ibi ìkójọ ọrẹ. Àfikún “àpótí ọrẹ” mú ohun tí a mọ̀ láti inú àyíká ẹsẹ ṣáájú yé kedere ní Yorùbá, láì jẹ́ kí ó dà bí ẹni pé ó ju owó náà ní agbára.
- source_word: λεπτὰ δύο
  choice: lépítà méjì
  rationale: A pa orúkọ owó Gíríìkì náà mọ́ ní àfọwọkọ Yorùbá, nítorí gbólóhùn tó tẹ̀ lé e fúnra rẹ̀ ṣàlàyé iye rẹ̀; àlàyé ẹsẹ̀ ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ bí owó náà ti kéré tó.
- source_word: ὅ ἐστιν
  choice: èyí tí ó dọ́gba pẹ̀lú
  rationale: Nínú ọ̀rọ̀ nípa owó yìí, gbólóhùn náà ń ṣàlàyé ìdọ́gba iye, kì í ṣe pé lépítà méjì àti kọ́dráńtì jẹ́ orúkọ ohun kan náà ní gbogbo ọ̀nà.
- source_word: κοδράντης
  choice: kọ́dráńtì kan
  rationale: A pa orúkọ owó Róòmù tó wà nínú Gíríìkì mọ́, dípò lílo orúkọ owó òde òní tí ó lè ṣini lọ́nà.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá. A lo àwọn àmì ohùn níbi tí wọ́n ti yẹ. A fi orúkọ àwọn owó ìgbàanì hàn ní àfọwọkọ Yorùbá, pẹ̀lú àlàyé kúkúrú ní ẹsẹ̀ ìsàlẹ̀. A fi “àpótí ọrẹ” hàn láti inú àyíká Marku 12:41 kí ìṣe fífi owó sínú rẹ̀ lè yé òǹkàwé.
