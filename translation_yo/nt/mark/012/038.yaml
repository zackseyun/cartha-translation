source:
  edition: SBLGNT
  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: yo
  text: Nínú ẹ̀kọ́ rẹ̀, ó sì ń sọ pé, “Ẹ ṣọ́ra fún àwọn akọ̀wé[a] tí wọ́n fẹ́ máa rìn káàkiri nínú àwọn aṣọ òde gígùn[b], tí wọ́n sì fẹ́ kí àwọn ènìyàn máa kí wọn ní àwọn ibi ọjà,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè túmọ̀ apá ìkìlọ̀ náà sí “Ẹ máa ṣọ́ra fún” tàbí “Ẹ wà lójúfò sí.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn aṣọ òde gígùn” tọ́ka sí aṣọ tí a ń wọ lórí aṣọ mìíràn, tí ó lè jẹ́ àmì ipò àti ọlá ní gbangba.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Nínú ẹ̀kọ́ rẹ̀
  rationale: Èyí pa ìṣètò gbólóhùn Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti tọ́ka sí àyíká tí Jésù ti ń sọ̀rọ̀.
- source_word: ἔλεγεν
  choice: ó sì ń sọ pé
  rationale: Àmì ìṣe aláìparí nínú Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́; “ń sọ” mú ìtumọ̀ yìí jáde ní Yorùbá.
- source_word: Βλέπετε ἀπὸ
  choice: Ẹ ṣọ́ra fún
  rationale: Àṣẹ yìí jẹ́ ìkìlọ̀ pé kí àwọn olùgbọ́ wà lójúfò, kí wọ́n sì má ṣe jẹ́ kí irú àwọn ẹni tí a mẹ́nu kàn ní ipa búburú lórí wọn.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” jẹ́ ìtumọ̀ tààrà fún ẹgbẹ́ àwọn amòye Ìwé Mímọ́ àti òfin ní àkókò náà, láì fi àlàyé ìtumọ̀ kan kún ọ̀rọ̀ orísun.
- source_word: τῶν θελόντων
  choice: tí wọ́n fẹ́
  rationale: Ó fi ìfẹ́ tàbí ìwà tí wọ́n mọ̀ọ́mọ̀ yàn hàn, kò sì sọ ọ́ di ìfẹ́ kékeré lásán.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: máa rìn káàkiri nínú aṣọ gígùn
  rationale: “Rìn káàkiri” mú περιπατεῖν jáde, “aṣọ gígùn” sì ṣàpèjúwe στολή lọ́nà tí òǹkàwé òde òní lè lóye.
- source_word: ἀσπασμοὺς
  choice: kí àwọn ènìyàn máa kí wọn
  rationale: Yorùbá máa ń sọ ìfẹ́ láti gba ìkíni lọ́nà àdánidá gẹ́gẹ́ bí ìfẹ́ pé kí àwọn ẹlòmíràn máa kí ẹni náà; ó pa èrò ìyìn ní gbangba mọ́ láì ṣe àfikún oyè kan.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ní àwọn ibi ọjà
  rationale: Èyí túmọ̀ ibi ìtajà àti ibi ìpéjọpọ̀ gbogbogbò tí ἀγοραί ń tọ́ka sí ní ọ̀nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Àwọn tí ìkìlọ̀ Jésù ń tọ́ka sí àti bí ìkìlọ̀ náà ṣe lágbára
  choice: Ìkìlọ̀ náà dojú kọ àwọn akọ̀wé tí ìfẹ́ sí ọlá ní gbangba ń ṣàpèjúwe wọn.
  alternative: Kí a ka a sí ìdálẹ́bi gbogbo akọ̀wé kọ̀ọ̀kan láìsí ìyàtọ̀.
  rationale: Gbólóhùn alájọṣe “tí wọ́n fẹ́...” ṣàpèjúwe àwọn akọ̀wé tí a ń kìlọ̀ nípa wọn. Ìtumọ̀ náà pa orúkọ ẹgbẹ́ náà àti àpèjúwe rẹ̀ mọ́, kò sì pinnu pé gbogbo ọmọ ẹgbẹ́ náà jẹ́ bákan náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ó sì ń sọ” pa ìṣe tó ń lọ lọ́wọ́ mọ́; àtúnṣe “tí wọ́n fẹ́...” sì jẹ́ kó ṣe kedere pé àpèjúwe náà ń dín ẹgbẹ́ tí ìkìlọ̀ náà dojú kọ kù. Àmì ẹsẹ̀ [a] wà lẹ́yìn “àwọn akọ̀wé” nítorí ó ṣàlàyé agbára ìkìlọ̀ náà, [b] sì tẹ̀ lé “aṣọ gígùn” nítorí àlàyé àṣà rẹ̀.
