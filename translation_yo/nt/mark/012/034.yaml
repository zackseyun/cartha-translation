  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: yo
  text: Nígbà tí Jésù rí i pé ó fi òye dáhùn, ó sọ fún un pé, “Ìwọ kò jìnnà sí ìjọba Ọlọ́run.”[a] Kò sì sí ẹnikẹ́ni tó tún gbójúgbóyà láti béèrè lọ́wọ́ rẹ̀ mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ó sún mọ́ ìjọba Ọlọ́run.” Ọ̀rọ̀ Gíríìkì sọ pé ó sún mọ́ ọn, kò sì sọ ní pàtó pé ó ti wọ inú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí ... rí i
  rationale: Ọ̀nà yìí mú iṣẹ́ participle Gíríìkì wá sí Yorùbá àdánidá, ó sì fi hàn pé ohun tí Jésù ṣàkíyèsí ló ṣáájú ọ̀rọ̀ rẹ̀.
- source_word: νουνεχῶς
  choice: fi òye
  rationale: Ó túmọ̀ sí dídáhùn lọ́nà tó fi ìrònú rere àti ìmòye hàn; ‘fi òye’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì gbé ìyìn inú ọ̀rọ̀ náà jáde láìsọ ọ́ di ohun tó lágbára jù.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: ‘Dáhùn’ ni ọ̀rọ̀ Yorùbá tó bá ìṣe pípa èsì fún ìbéèrè mu; àgbékalẹ̀ ‘rí i pé ó ... dáhùn’ mú bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn hàn.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Ìwọ kò jìnnà sí
  rationale: Ó pa àpẹẹrẹ jíjìnnà tàbí sísún mọ́ ohun kan mọ́, láìsọ pé ẹni náà ti wọ ìjọba náà.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì lè ní ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run.
- source_word: οὐκέτι
  choice: tún ... mọ́
  rationale: Àkópọ̀ ọ̀rọ̀ Yorùbá yìí mú ìtumọ̀ pé láti ìgbà yẹn lọ kò ṣẹlẹ̀ mọ́ hàn ní ti ẹ̀dá.
- source_word: ἐτόλμα
  choice: gbójúgbóyà
  rationale: Ó sọ àìní ìgboyà láti ṣe ohun náà jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐπερωτῆσαι
  choice: láti bi í léèrè
  rationale: Ó túmọ̀ sí fífi ìbéèrè kan sí Jésù; ọ̀rọ̀ yìí lè gba agbára ìdánwò tó wà nínú àyíká náà láìsọ ọ́ di fífọ̀rọ̀-wá-ẹni-lẹ́nu-wò.
theological_decisions:
- issue: Ipò akọ̀wé náà ní ìbámu pẹ̀lú ìjọba Ọlọ́run
  choice: “Ìwọ kò jìnnà sí ìjọba Ọlọ́run” ni a lò, láìfi hàn pé ó ti wọ inú rẹ̀.
  alternative: “O sún mọ́ ìjọba Ọlọ́run.”
  rationale: 'Gíríìkì sọ nípa bí ẹni náà ṣe sún mọ́ ìjọba, kì í ṣe pé ó ti ní in tàbí pé ó ti wọ inú rẹ̀. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ mọ́: Jésù gbóríyìn fún òye ọkùnrin náà, ṣùgbọ́n kò kéde pé ó ti wà nínú ìjọba náà.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìsinsìnyí tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu. A lo ‘tó’ nínú gbólóhùn ìkẹyìn gẹ́gẹ́ bí ìsúnkì àdánidá ti ‘tí ó’.
