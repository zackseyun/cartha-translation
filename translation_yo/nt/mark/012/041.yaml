id: MRK.12.41
reference: Mark 12:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: yo
  text: Ó sì jókòó ní òdìkejì ibi ìṣúra[a], ó ń wo bí ogunlọ́gọ̀ náà ṣe ń fi owó sínú ibi ìṣúra; ọ̀pọ̀ àwọn ọlọ́rọ̀ sì ń fi púpọ̀ sínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àpótí ọrẹ’ tàbí ‘àpótí ìṣúra’; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibi ìṣúra tẹ́ńpìlì tàbí àwọn ohun ìgbà ọrẹ tí ó ní í ṣe pẹ̀lú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: jókòó
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ aorist yìí ṣètò ìṣẹ̀lẹ̀ ṣáájú ìṣe pàtàkì; ‘jókòó’ jẹ́ èdè Yorùbá àdánidá ní àyíká yìí.
- source_word: κατέναντι
  choice: ní òdìkejì
  rationale: Ó tọ́ka sí ipò tí ó dojú kọ ibi kan tààrà.
- source_word: γαζοφυλάκιον
  choice: ibi ìṣúra
  rationale: Ó pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ láàárín ibi ìṣúra tẹ́ńpìlì àti àpótí tàbí ohun ìgbà ọrẹ tó wà níbẹ̀.
- source_word: ἐθεώρει
  choice: ó ń wo
  rationale: Àkókò imperfect fi hàn pé wíwo náà ń bá a lọ.
- source_word: πῶς
  choice: bí ... ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ ‘how’ hàn, ó sì dá ojú lé bí fífi owó náà ṣe ń lọ.
- source_word: ὄχλος
  choice: ogunlọ́gọ̀ náà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ọ̀pọ̀ ènìyàn tí wọ́n kóra jọ.
- source_word: βάλλει / ἔβαλλον
  choice: ń fi ... sínú
  rationale: Nínú àyíká fífi owó sí ibi ìṣúra, ‘fi sínú’ jẹ́ àdánidá ju ‘sọ sínú’ lọ, ó sì pa ìṣe tí ń bá a lọ mọ́.
- source_word: χαλκόν
  choice: owó
  rationale: Ní àyíká yìí, bàbà náà dúró fún owó ẹyọ bàbà; ‘owó’ mú ìtumọ̀ ìlò rẹ̀ jáde láìfi irú ẹyọ kan kún un.
- source_word: πολλοὶ πλούσιοι
  choice: ọ̀pọ̀ àwọn ọlọ́rọ̀
  rationale: Ó jẹ́ ìtumọ̀ àdánidá tí kò fi akọ tàbí abo tí ọ̀rọ̀ náà kò béèrè kún un.
- source_word: πολλά
  choice: púpọ̀
  rationale: Nínú àyíká owó, neuter plural náà túmọ̀ sí iye ńlá; ‘púpọ̀’ pa ìtumọ̀ yẹn mọ́ ní ṣókí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹ̀síwájú àwọn imperfect mọ́ nípasẹ̀ ‘ń’.
