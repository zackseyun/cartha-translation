id: MRK.12.13
reference: Mark 12:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: yo
  text: Wọ́n sì rán díẹ̀ lára àwọn Farisí àti díẹ̀ lára àwọn Hẹ́rọ́díánì sí ọ̀dọ̀ rẹ̀, kí wọ́n lè fi ọ̀rọ̀ dẹkùn mú un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n lè mú un nínú ohun tí ó sọ.” Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àpèjúwe iṣẹ́ ọdẹ, gbólóhùn ìkẹyìn sì fi hàn pé ọ̀rọ̀ ẹnu rẹ̀ ni wọ́n fẹ́ lò láti dẹkùn mú un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: Wọ́n sì rán
  rationale: A lo ọ̀nà ìtàn àsìkò tí ó ti kọjá, èyí tí ó bá ìsọ̀rọ̀ Yorùbá mu, bí ó tilẹ̀ jẹ́ pé àsìkò ìsinsìnyí ni Gíríìkì lò gẹ́gẹ́ bí àsìkò ìsinsìnyí inú ìtàn.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: díẹ̀ lára àwọn Farisí àti díẹ̀ lára àwọn Hẹ́rọ́díánì
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn aṣojú díẹ̀ wá láti inú ẹgbẹ́ kọ̀ọ̀kan; a tún kọ orúkọ àwọn ẹgbẹ́ náà ní ìbámu pẹ̀lú ìró wọn.
- source_word: ἵνα
  choice: kí wọ́n lè
  rationale: Ó sọ ète ìránṣẹ́ wọn ní Yorùbá àdánidá.
- source_word: ἀγρεύσωσιν
  choice: dẹkùn mú un
  rationale: Ó pa àwòrán iṣẹ́ ọdẹ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì ṣàfihàn ète wọn láti mú un sínú ìṣòro.
- source_word: λόγῳ
  choice: fi ọ̀rọ̀
  rationale: Ó pa ọ̀nà ẹyọ ọ̀rọ̀ Gíríìkì mọ́, ó sì fi ọ̀rọ̀ hàn gẹ́gẹ́ bí ohun èlò tí wọn fẹ́ lò láti dẹkùn mú un, láìfi ẹni tí ọ̀rọ̀ náà jẹ́ tirẹ̀ kún un ní kedere.
theological_decisions:
- issue: Ẹni tí ó ṣe iṣẹ́ náà kò fara hàn ní orúkọ nínú ọ̀rọ̀-ìṣe Gíríìkì ọ̀pọ̀
  choice: Wọ́n
  alternative: Àwọn olórí àlùfáà, àwọn akọ̀wé àti àwọn àgbààgbà
  rationale: A pa àìsọ orúkọ ẹni tí ó ṣe iṣẹ́ náà mọ́, dípò fífi àwọn ẹni tí àyíká ẹsẹ̀ ṣáájú tọ́ka sí sínú ẹsẹ̀ yìí.
- issue: Bí λόγῳ ṣe ní í ṣe pẹ̀lú ọ̀rọ̀ tí Jésù yóò sọ
  choice: fi ọ̀rọ̀
  alternative: nínú ohun tí ó sọ
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa ìsọ̀rọ̀ Gíríìkì tí kò ṣàlàyé ẹni tí ọ̀rọ̀ náà jẹ́ tirẹ̀ mọ́; àlàyé tó ṣe kedere sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Àwọn Hẹ́rọ́díánì” jẹ́ àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní ìbámu pẹ̀lú ìró, láìṣàfikún ìtumọ̀ ẹ̀kọ́ tàbí òṣèlú tí ẹsẹ̀ kò sọ.
