source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: yo
  text: 'Èkejì ni èyí: ‘Kí o nífẹ̀ẹ́ ọmọnìkejì rẹ bí ara rẹ.’ Kò sí àṣẹ mìíràn tí ó tóbi ju àwọn wọ̀nyí lọ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹkipẹki: “Àṣẹ mìíràn kò tóbi ju àwọn wọ̀nyí lọ.” ‘Àwọn wọ̀nyí’ ń tọ́ka sí àwọn àṣẹ méjèèjì papọ̀ nínú àyíká ọ̀rọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Èkejì ni èyí
  rationale: Ọ̀rọ̀ Gíríìkì náà kò sọ ‘òfin’ ní tààràtà níhìn-ín, ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé òfin kejì ni a ń tọ́ka sí. Ìtumọ̀ yìí pa ìtẹnumọ́ ‘èkejì’ mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Ἀγαπήσεις
  choice: Ìwọ yóò nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú tí a lò gẹ́gẹ́ bí àṣẹ nínú àyọlò Ìwé Mímọ́. ‘Ìwọ yóò nífẹ̀ẹ́’ pa ìrísí àti agbára àṣẹ inú àyọlò náà mọ́.
- source_word: τὸν πλησίον σου
  choice: ọmọnìkejì rẹ
  rationale: ‘Ọmọnìkejì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹnì kejì tí ojúṣe ìfẹ́ bá kan, ó sì yẹ fún àyíká ìwà rere àti ìtọ́kasí sí Léfítíkù 19:18.
- source_word: ὡς σεαυτόν
  choice: bí ara rẹ
  rationale: Ìtumọ̀ kúkúrú yìí tẹ̀ lé ìfiwéra Gíríìkì láìfi ọ̀rọ̀ àlàyé tí kò sí nínú orísun kún un.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Kò sí òfin mìíràn tí ó tóbi ju àwọn wọ̀nyí lọ
  rationale: Èyí pa ìfiwéra ‘tóbi ju’ àti ọ̀pọ̀ ‘àwọn wọ̀nyí’ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ἐντολή
  choice: òfin
  rationale: Nínú àyíká yìí, ‘òfin’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àṣẹ Ọlọ́run nínú Tórà, ó sì pa ìwọ̀n ọ̀rọ̀ Ìwé Mímọ́ mọ́.
theological_decisions:
- issue: Ohun tí τούτων (‘àwọn wọ̀nyí’) ń tọ́ka sí ní gbólóhùn ìkẹyìn
  choice: Ó tọ́ka sí àwọn òfin méjèèjì papọ̀
  alternative: Kí a ka a sí ìtọ́kasí sí òfin kejì tí a ṣẹ̀ṣẹ̀ sọ nìkan ní ọ̀nà gbogbogbò
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ nínú Gíríìkì tọ́ka lọ́nà àdánidá sí àwọn òfin méjèèjì tí àyíká ọ̀rọ̀ ń jíròrò. Ìtumọ̀ ‘àwọn wọ̀nyí’ pa ọ̀pọ̀ náà àti ìdíwọ̀n ìtumọ̀ inú orísun mọ́ láìsọ ọ́ di ẹyọ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìrísí àṣẹ inú àyọlò àti ọ̀pọ̀ inú ‘τούτων’ mọ́.
