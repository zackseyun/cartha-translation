  to: 'Èkejì ni èyí: ‘Kí o nífẹ̀ẹ́ ọmọnìkejì rẹ bí ara rẹ.’ Kò sí àṣẹ mìíràn tí ó tóbi ju àwọn wọ̀nyí lọ.[a]'
