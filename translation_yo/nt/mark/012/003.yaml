  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: yo
  text: Wọ́n sì mú un, wọ́n lù ú, wọ́n sì rán an padà pẹ̀lú ọwọ́ òfo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì rán an padà láìní ohun kan.” Ọ̀rọ̀ Gíríìkì κενόν túmọ̀ ní ti gidi sí “òfo”; níbí, ó túmọ̀ sí pé wọ́n rán ìránṣẹ́ náà padà láìgba ohunkóhun.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: mú un
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tí ó ṣáájú àwọn ìṣe tó tẹ̀ lé e. “Mú un” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n fi agbára gba ìránṣẹ́ náà, láìfi ìtumọ̀ tó lágbára ju ti Gíríìkì lọ kún un.
- source_word: ἔδειραν
  choice: lù ú
  rationale: δέρρω níbí túmọ̀ sí lílu tàbí fífi ìyà lílu jẹ ẹnìkan. “Lù ú” ṣe kedere, ó sì yẹ fún ìwà ìkà tí àkàwé náà ń ṣàpèjúwe, láìsọ pé lílu náà jẹ́ ìnà pàṣán lọ́nà ìlànà.
- source_word: ἀπέστειλαν
  choice: rán an padà
  rationale: ἀποστέλλω túmọ̀ sí ríran ẹni lọ. Nínú àyíká yìí, “rán an padà” fi hàn pé wọ́n lé ìránṣẹ́ náà kúrò lọ́dọ̀ wọn, ó sì padà sọ́dọ̀ ẹni tó rán an.
- source_word: κενόν
  choice: lọ́wọ́ òfo
  rationale: Adjective náà túmọ̀ ní ti gidi sí “òfo,” ṣùgbọ́n níbí ó fi hàn pé ìránṣẹ́ náà kò rí ohunkóhun gbà. “Lọ́wọ́ òfo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó mú ìtumọ̀ náà jáde kedere.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: Àwọn καί tí a tún lò so àwọn ìṣe náà pọ̀ ní ìtẹ̀lé ìtàn. “Sì ... sì” pa ìṣètò paratactic Gíríìkì mọ́ ní Yorùbá tó dùn mọ́ etí.
