translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó bá yẹ, a sì pa ìtẹ̀lé àwọn ìṣe inú Gíríìkì mọ́.
