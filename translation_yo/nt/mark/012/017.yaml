id: MRK.12.17
reference: Mark 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Ẹ dá[a] ohun tí ó jẹ́ ti Késárì padà fún Késárì, kí ẹ sì fi ohun tí ó jẹ́ ti Ọlọ́run fún Ọlọ́run.” Ẹnu sì yà wọ́n gidigidi sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ fi ohun tí ó jẹ́ ti Késárì fún Késárì, kí ẹ sì fi ohun tí ó jẹ́ ti Ọlọ́run fún Ọlọ́run.” Ọ̀rọ̀ náà lè túmọ̀ sí “dá padà,” “san padà,” tàbí “fi ohun tí ó tọ́ sí ẹnì kan fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Ẹ dá ... padà fún
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí dídá ohun tí ó jẹ́ ti ẹnì kan padà fún un tàbí fífi ohun tí a jẹ ẹ́ fún un. “Ẹ dá ... padà fún” pa agbára ọ̀rọ̀ ìṣàṣẹ náà mọ́ láì fi ìtumọ̀ rẹ̀ mọ́ owó-orí nìkan.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: ohun tí ó jẹ́ ti Késárì ... fún Késárì
  rationale: Èyí sọ ohun-ìní Késárì ní Yorùbá àdánidá, ó sì yẹra fún dín ohun tí ọ̀rọ̀ náà ń tọ́ka sí kù sí ohun kan pàtó.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: ohun tí ó jẹ́ ti Ọlọ́run ... fún Ọlọ́run
  rationale: A pa ìfarajọ́ gbolohun méjèèjì mọ́, gẹ́gẹ́ bí ó ti rí nínú èdè Gíríìkì.
- source_word: ἐξεθαύμαζον
  choice: Ẹnu sì yà wọ́n gidigidi
  rationale: “Gidigidi” mú agbára ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí ìyàlẹ́nu ńlá jáde, ìrísí ọ̀rọ̀ náà sì ṣàpèjúwe ìhùwàpadà wọn.
- source_word: ἐπ’ αὐτῷ
  choice: sí i
  rationale: Èyí tọ́ka sí Jésù gẹ́gẹ́ bí ohun tí ó yà wọ́n lẹ́nu, láì ṣàlàyé rékọjá ohun tí orísun sọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà pẹ̀lú ìtakora díẹ̀ hàn nínú ìjíròrò náà.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹnì kan sọ fún àwọn ẹlòmíràn.
theological_decisions:
- issue: Ìbáṣepọ̀ ojúṣe sí ìjọba àti ojúṣe sí Ọlọ́run nínú ọ̀rọ̀ Jésù
  choice: A tú gbolohun méjèèjì ní tààrà, a sì pa ìfarajọ́ wọn mọ́.
  alternative: Kí a tú u lọ́nà tí yóò fi tẹnumọ́ pé Jésù fọwọ́ sí àṣẹ ìjọba, tàbí pé ó ń dín ẹ̀tọ́ Késárì kù.
  rationale: Ẹsẹ̀ náà sọ pé ohun kan jẹ́ ti Késárì, ohun kan sì jẹ́ ti Ọlọ́run, ṣùgbọ́n kò ṣàlàyé gbogbo èrò nípa ìbáṣepọ̀ ìjọba àti ìgbàgbọ́. Ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì ṣe kedere ni a lò. “Késárì” ni àkọsílẹ̀ Yorùbá fún Caesar; a fi àmì ohùn sí ibi tí ó yẹ. Gbolohun méjèèjì ṣetọju ìfarajọ́ orísun, láì dín ìtumọ̀ rẹ̀ kù sí sísan owó-orí nìkan.
