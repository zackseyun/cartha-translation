  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: yo
  text: Arákùnrin méje wà; ẹni àkọ́kọ́ fẹ́ aya, nígbà tí ó kú, kò fi ọmọ sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “kò fi irúgbìn sílẹ̀.” Ọ̀rọ̀ Gíríìkì fún “irúgbìn” ni a lò gẹ́gẹ́ bí àṣà-ọrọ fún ọmọ tàbí àtọmọdọ́mọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Àwọn arákùnrin méje kan wà
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ gbólóhùn ìwàláàyè náà, ó sì pa ìtumọ̀ pé arákùnrin ọkùnrin ni wọ́n mọ́.
- source_word: ὁ πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: πρῶτος ń tọ́ka sí ipò rẹ̀ nínú ìtẹ̀lé àwọn arákùnrin náà; kò fi dandan hàn pé òun ni àgbà jù.
- source_word: ἔλαβεν γυναῖκα
  choice: fẹ́ aya
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣà-ọrọ fún gbígba obìnrin níyàwó; “fẹ́ aya” ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì yé àwọn òǹkàwé òde òní.
- source_word: ἀποθνῄσκων
  choice: nígbà tí ó sì kú
  rationale: A tú participle náà sí gbólóhùn àkókò tó bá èdè Yorùbá mu, láìyí ìbáṣepọ̀ ìṣẹ̀lẹ̀ náà padà.
- source_word: οὐκ ἀφῆκεν
  choice: kò fi ... sílẹ̀
  rationale: Nínú àyíká ikú, ἀφίημι túmọ̀ sí fífi ohun tàbí ẹni kan sílẹ̀ lẹ́yìn ẹni.
- source_word: σπέρμα
  choice: ọmọ
  rationale: Nínú àyíká ìdílé àti òfin ìgbéyàwó yìí, σπέρμα ń tọ́ka sí àtọmọdọ́mọ. “Ọmọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere; àlàyé ìsàlẹ̀ sọ àwòrán gangan ti “irúgbìn.”
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “fẹ́ aya” gẹ́gẹ́ bí àṣà-ọrọ Yorùbá àdánidá fún ìgbéyàwó, a sì fi àmì ìsàlẹ̀ [a] lẹ́yìn gbólóhùn tí ó bá σπέρμα mu.
