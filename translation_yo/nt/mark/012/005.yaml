  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: yo
  text: Ó sì rán ẹlòmíràn; wọ́n sì pa òun náà. Ó sì rán ọ̀pọ̀ ẹlòmíràn; wọ́n lu àwọn kan, wọ́n sì pa àwọn mìíràn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: ẹlòmíràn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìránṣẹ́ mìíràn nínú àwọn tí olówó ọgbà náà ń rán; “ẹlòmíràn” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: ἀπέστειλεν
  choice: ó tún rán
  rationale: “Rán” túmọ̀ iṣẹ́ náà ní tààrà; “tún” mú agbára ìfikún inú àyíká ọ̀rọ̀ àti καί jáde ní Yorùbá àdánidá.
- source_word: κἀκεῖνον
  choice: àwọn náà sì pa á
  rationale: Aṣàyàn yìí fi agbára ìfikún καί àti ìtọ́ka ἐκεῖνον hàn nípasẹ̀ “náà,” nígbà tí “pa á” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti tọ́ka sí ẹni tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: ἀπέκτειναν
  choice: pa á
  rationale: “Pa” jẹ́ ìtumọ̀ tààrà, kedere, tí ó sì bá ìwà ipá inú àkàwé náà mu.
- source_word: πολλοὺς ἄλλους
  choice: ọ̀pọ̀ àwọn ẹlòmíràn
  rationale: Gbólóhùn yìí tọ́ka sí ọ̀pọ̀ ìránṣẹ́ míì lẹ́yìn ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; a tún fi ọ̀rọ̀-ìṣe “rán” kún un ní Yorùbá kí gbólóhùn má bà a dà bí àjákù.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: àwọn kan ... àwọn mìíràn
  rationale: Èyí pa ìpínpin àwọn ènìyàn méjì tí ìkọ̀lé Gíríìkì ń fi hàn mọ́ ní Yorùbá tó ṣe déédé.
- source_word: δέροντες
  choice: wọ́n lu
  rationale: “Lu” gbooro tó láti túmọ̀ lílu tàbí fífi ìyà jẹ ẹni, láìfi ìtumọ̀ pàtó bí ìnà ìdájọ́ kún ohun tí Gíríìkì kò fi dandan sọ.
- source_word: ἀποκτέννοντες
  choice: wọ́n sì pa
  rationale: A sọ participle náà di ọ̀rọ̀-ìṣe pípé ní Yorùbá láti mú àkótán ìṣe tí a pín sí ẹgbẹ́ méjì ṣe kedere àti àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn participle inú àkótán ìpínpin náà
  choice: 'A lo àwọn ọ̀rọ̀-ìṣe pípé: “wọ́n lu àwọn kan, wọ́n sì pa àwọn mìíràn.”'
  alternative: “ní lílu àwọn kan àti pípa àwọn mìíràn”
  rationale: Èyí jẹ́ ìpinnu gírámà àti ìṣarasíhùwà, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Ọ̀rọ̀-ìṣe pípé mú ìpínpin ìṣe náà hàn kedere ní Yorùbá òde òní, ó sì pa ìtẹ̀síwájú ìwà ipá inú àkàwé mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A tún “rán” sọ ní ìpín kejì láti yàgò fún àjákù gbólóhùn tí kò ṣe déédé ní Yorùbá.
