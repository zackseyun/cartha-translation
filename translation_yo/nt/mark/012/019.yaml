id: MRK.12.19
reference: Mark 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: yo
  text: “Olùkọ́, Mósè kọ̀wé fún wa pé bí arákùnrin ẹnì kan bá kú, tí ó fi aya sílẹ̀, tí kò sì fi ọmọ sílẹ̀,[a] kí arákùnrin rẹ̀ fẹ́ aya náà, kí ó sì gbé irú-ọmọ dìde fún arákùnrin rẹ̀.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “tí kò sì fi ọmọ kan sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ṣùgbọ́n ó lè ní ìtumọ̀ gbogbogbò pé kò fi ọmọ kankan sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Gbé irú-ọmọ dìde fún arákùnrin rẹ̀” jẹ́ àkànlò-èdè fún mímú kí ọmọ wà fún arákùnrin náà nípasẹ̀ ìgbéyàwó yìí.
    reason: lexical_alternative
  - marker: c
    text: Wo Diutarónómì 25:5 nípa òfin Mósè tí wọ́n ń tọ́ka sí.
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ ìpè sí Jésù ni; ‘Olùkọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ διδάσκαλος mu láìfi ìtumọ̀ ‘ọ̀gá’ tí kò pọn dandan kún un.
- source_word: ἔγραψεν ἡμῖν
  choice: kọ̀wé fún wa
  rationale: ‘Fún wa’ fi hàn pé àwọn olùsọ̀rọ̀ ka òfin Mósè sí ohun tí a kọ fún àwọn ọmọ Ísírẹ́lì.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: bí arákùnrin ẹnì kan bá kú
  rationale: Ìtumọ̀ yìí pa àìdánimọ̀ τινος mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: καταλίπῃ γυναῖκα
  choice: tí ó fi aya sílẹ̀
  rationale: Nínú àyíká ikú yìí, ‘fi aya sílẹ̀’ sọ pé aya náà wà lẹ́yìn ikú ọkọ rẹ̀.
- source_word: μὴ ἀφῇ τέκνον
  choice: tí kò sì fi ọmọ sílẹ̀
  rationale: ‘Ọmọ’ pa ẹyọ ọ̀rọ̀ τέκνον mọ́, ó sì lè dúró fún ọmọ lọ́nà gbogbogbò nínú Yorùbá.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: kí arákùnrin rẹ̀ fẹ́ aya náà
  rationale: Nínú òfin ìgbéyàwó yìí, λάβῃ γυναῖκα túmọ̀ sí gbígba obìnrin náà níyàwó; ‘fẹ́ aya náà’ jẹ́ Yorùbá tó ṣe kedere ju àdàkọ gígún ‘gba aya náà’ lọ.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: kí ó sì mú irú-ọmọ wá
  rationale: Èyí sọ ète àkànlò-èdè náà ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ‘gbé irúgbìn dìde’ hàn.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fún arákùnrin rẹ̀
  rationale: Ó pa ìbáṣepọ̀ àǹfààní tí dative náà ń fi hàn mọ́ láìṣàfikún ‘arákùnrin rẹ̀ tó ti kú,’ nítorí gbolohun tó ṣáájú ti fi ikú náà hàn.
theological_decisions:
- issue: Bí a ṣe máa tú àkànlò-èdè òfin ìgbéyàwó opó arákùnrin láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un
  choice: “kí arákùnrin rẹ̀ fẹ́ aya náà, kí ó sì mú irú-ọmọ wá fún arákùnrin rẹ̀”
  alternative: “kí arákùnrin rẹ̀ gba aya náà, kí ó sì gbé irúgbìn dìde fún arákùnrin rẹ̀”
  rationale: Àṣàyàn inú ẹsẹ̀ jẹ́ kó yé òǹkàwé Yorùbá pé ìgbéyàwó àti ìtẹ̀síwájú ìran ni ọ̀rọ̀ náà ń tọ́ka sí, ṣùgbọ́n àlàyé [b] tún pa àwòrán ‘irúgbìn’ inú Gíríìkì mọ́.
- issue: Àwọn ọ̀rọ̀ ìbátan tó ní akọ tàbí abo
  choice: A pa ‘arákùnrin’ àti ‘aya’ mọ́.
  alternative: Lílo ọ̀rọ̀ àpapọ̀ bí ‘ẹ̀gbọ́n tàbí àbúrò’ àti ‘ọkọ tàbí aya’
  rationale: Gíríìkì sọ ἀδελφός àti γυνή ní pàtó nínú òfin ìgbéyàwó ọkùnrin àti obìnrin; ṣíṣe wọn ní ọ̀rọ̀ àpapọ̀ yóò yí àkóónú orísun padà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àtúnṣe yìí tún ṣètò àwọn àmì àlàyé kí [a] bá ‘ọmọ,’ [b] bá ‘irú-ọmọ,’ àti [c] bá ìtọ́kasí sí òfin Mósè mu.
