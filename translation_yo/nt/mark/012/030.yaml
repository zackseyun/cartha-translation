source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: yo
  text: Kí o sì fẹ́ Olúwa Ọlọ́run rẹ pẹ̀lú gbogbo ọkàn rẹ, àti pẹ̀lú gbogbo ẹ̀mí rẹ, àti pẹ̀lú gbogbo èrò inú rẹ, àti pẹ̀lú gbogbo agbára rẹ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú gbogbo ìwàláàyè rẹ” dípò “pẹ̀lú gbogbo ẹ̀mí rẹ” (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú gbogbo òye rẹ” dípò “pẹ̀lú gbogbo èrò inú rẹ” (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “pẹ̀lú gbogbo ipá rẹ” dípò “pẹ̀lú gbogbo agbára rẹ” (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: Kí ìwọ kí ó sì fẹ́
  rationale: Ọ̀rọ̀ ọjọ́-ọ̀la náà ní agbára àṣẹ nínú àyọlò yìí. Ìtumọ̀ yìí fi ìrísí àṣẹ Ìwé Mímọ́ hàn ní Yorùbá adayébá, nígbà tí ‘sì’ ń pa ìbáṣepọ̀ καί mọ́.
- source_word: κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédé fún gbólóhùn májẹ̀mú ‘Olúwa Ọlọ́run rẹ,’ láìfi àṣà lẹ́tà kékeré tàbí lẹ́tà ńlá tí kò sí nínú Gíríìkì kún un.
- source_word: ἐξ
  choice: pẹ̀lú
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐξ lè túmọ̀ sí ‘láti inú,’ nínú àkójọ àwọn apá agbára ènìyàn yìí, ‘pẹ̀lú’ ni Yorùbá adayébá fún ìfọkànsìn tí gbogbo ẹni náà fi ṣe.
- source_word: ὅλης
  choice: gbogbo
  rationale: A tún ‘gbogbo’ sọ ní ẹ̀ka kọ̀ọ̀kan láti pa ìtẹnumọ́ àti ìṣètò Gíríìkì mọ́.
- source_word: καρδίας
  choice: ọkàn
  rationale: ‘Ọkàn’ jẹ́ ìtumọ̀ Yorùbá tí ó fẹsẹ̀ múlẹ̀, ó sì lè tọ́ka sí àárín ìfẹ́, ìpinnu, àti ìgbésí ayé inú láìṣàlàyé ju orísun lọ.
- source_word: ψυχῆς
  choice: ọkàn-ayé
  rationale: ψυχή lè jẹ́ ‘ọkàn,’ ‘ẹ̀mí/ìwàláàyè,’ tàbí ‘ẹni.’ ‘Ọkàn-ayé’ pa ìyàtọ̀ rẹ̀ mọ́ sí καρδία, ó sì ń tọ́ka sí ìwàláàyè tàbí gbogbo ẹni; àfikún ẹsẹ̀ ṣí àṣàyàn ‘gbogbo ìwàláàyè rẹ’ sílẹ̀.
- source_word: διανοίας
  choice: èrò inú
  rationale: ‘Èrò inú’ ń sọ agbára ìrònú àti òye, ó sì yàtọ̀ sí ‘ọkàn’ ní ọ̀nà tí àwọn òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἰσχύος
  choice: agbára
  rationale: ‘Agbára’ jẹ́ ọ̀rọ̀ Yorùbá adayébá fún okun tàbí ipa tí ἰσχύς ń tọ́ka sí; àfikún ẹsẹ̀ fi ‘ipá’ hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: sì ... àti ... àti ... àti
  rationale: A pa àkójọpọ̀ àsopọ̀ mọ́ láti fi ìtẹnumọ́ ọlọ́pọ̀ Gíríìkì hàn, láìjẹ́ kí Yorùbá di aláìṣàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò òfin náà
  choice: Olúwa
  alternative: OLÚWA; Ọ̀gá
  rationale: Gíríìkì ní κύριος. ‘Olúwa’ bá lílo Majẹ̀mú Tuntun àti ìrántí gbólóhùn májẹ̀mú mu, láìgbé àṣà lẹ́tà ńlá tí kò farahàn nínú Gíríìkì wọlé.
- issue: Àwọn ọ̀rọ̀ mẹ́rin nípa gbogbo ẹni
  choice: ọkàn / ọkàn-ayé / èrò inú / agbára
  alternative: ọkàn / ìwàláàyè / òye / ipá
  rationale: A kò ṣopọ̀ àwọn ọ̀rọ̀ mẹ́rin náà di gbólóhùn gbogbogbò kan. Èyí pa ìyàtọ̀ ọ̀rọ̀, ìlù àsọyé, àti ìpè sí ìfọkànsìn gbogbo ẹni mọ́, láìdá ẹ̀kọ́ pé ènìyàn ní àwọn apá mẹ́rin tí a lè ya sọ́tọ̀ múlẹ̀.
translation_notes:
  register: Yorùbá ìṣàkóso tí ó ní àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, ti òde òní, tí ó sì ṣeé lóye. A pa àtúnsọ ‘gbogbo’ àti àsopọ̀ àkójọpọ̀ mọ́, ṣùgbọ́n a yẹra fún gbolohun atijọ́ tàbí ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
