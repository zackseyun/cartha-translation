id: MRK.12.35
reference: Mark 12:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: yo
  text: Jésù sì dáhùn, nígbà tí ó ń kọ́ni nínú tẹ́ńpìlì, pé, “Báwo ni àwọn akọ̀wé ṣe ń sọ pé Mèsáyà[a] jẹ́ ọmọ Dáfídì?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ oyè náà ní èdè Gíríìkì ni Christos, a sì lò ó níhìn-ín ní ìtumọ̀ oyè Mèsáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dáhùn
  rationale: Ọ̀rọ̀ náà sábà máa ń túmọ̀ sí ‘dáhùn’ tàbí ‘fèsì.’ Bí ó tilẹ̀ jẹ́ pé kò sí ìbéèrè tí a sọ níwájú ẹsẹ yìí, ó lè fi hàn pé Jésù ń fèsì sí ọ̀rọ̀ tàbí èrò kan; ‘dáhùn’ pa ìtumọ̀ yẹn mọ́ láìfi ohun tí kò sí kún un.
- source_word: ἔλεγεν
  choice: pé
  rationale: Nínú gbólóhùn Yorùbá yìí, ‘dáhùn ... pé’ ni ọ̀nà àdánidá láti mú ọ̀rọ̀ tí Jésù sọ wọlé. Ìṣe tí ń lọ lọ́wọ́ nínú imperfect Gíríìkì tún farahàn nínú àyíká kíkọ́ni.
- source_word: διδάσκων
  choice: nígbà tí ó ń kọ́ni
  rationale: Ó fi hàn pé Jésù ń kọ́ni ní àkókò tí ó sọ ọ̀rọ̀ yìí; àmì ‘ń’ pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. ‘Nínú tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè gba ìtumọ̀ àgbègbè náà.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Èyí tẹ̀ lé ìtumọ̀ gígùn ti Πῶς, ó sì jẹ́ ìbéèrè Yorùbá tó bójú mu. Kò fi ọ̀rọ̀ ‘lè’ kún un, nítorí Gíríìkì fúnra rẹ̀ lè jẹ́ ìbéèrè nípa ìdí tàbí ọ̀nà tí àwọn akọ̀wé fi ń sọ bẹ́ẹ̀.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: ‘Àwọn akọ̀wé’ pa orúkọ ẹgbẹ́ amòfin àti olùkọ́ Ìwé Mímọ́ ní àkókò náà mọ́, láìfẹ̀ ìtumọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός jẹ́ oyè ẹni tí àwọn Júù ń retí, nítorí náà ‘Mèsáyà’ mú àyíká náà jáde kedere; ‘Kristi’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àyànfẹ́ mìíràn.
- source_word: υἱὸς Δαυίδ
  choice: ọmọ Dáfídì
  rationale: ‘Ọmọ Dáfídì’ jẹ́ gbólóhùn àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìran Dáfídì àti oyè Mèsáyà náà pọ̀ mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àríyànjiyàn náà wà nínú àyíká ìrètí Mèsáyà àwọn Júù. ‘Mèsáyà’ ni a lò nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ‘Kristi’ mọ́ gẹ́gẹ́ bí ìtumọ̀ oyè Gíríìkì náà.
- issue: Agbára ìbéèrè Πῶς
  choice: Báwo ni àwọn akọ̀wé ṣe ń sọ pé ...?
  alternative: Báwo ni àwọn akọ̀wé ṣe lè sọ pé ...?
  rationale: A kò fi ‘lè’ kún un, kí ìbéèrè náà má bàa di ìkọ̀sílẹ̀ gbólóhùn àwọn akọ̀wé pátápátá ṣáájú àlàyé Jésù. Èyí pa àìdánilójú bóyá ó ń béèrè nípa ìdí, ọ̀nà, tàbí ìbámu ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn àdánidá Yorùbá, ṣùgbọ́n ó pa ‘dáhùn,’ àkókò kíkọ́ni, àti irú ìbéèrè Gíríìkì mọ́.
