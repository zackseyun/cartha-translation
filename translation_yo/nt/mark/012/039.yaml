  yaml_path: translation/nt/mark/012/039.yaml
  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: yo
  text: àti àwọn ìjókòó ọlá nínú àwọn sínágọ́gù, àti àwọn ipò ọlá níbi àsè,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibi tí ó dára jù lọ”; ní ìtumọ̀ gangan nínú àṣà jíjẹun ìgbàanì, “àwọn ibi ìrọ̀gbọ̀kú àkọ́kọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: àwọn ìjókòó ọlá
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ìjókòó tí a fi ń bu ọlá fún ẹni tí ó ní ipò gíga nínú àpéjọ; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì mú ìtumọ̀ ipò àti ọlá jáde.
- source_word: συναγωγαῖς
  choice: àwọn sínágọ́gù
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn ilé ìpàdé àwọn Júù; ‘sínágọ́gù’ ni ọ̀rọ̀ pàtó tí a mọ̀ sí i ní Yorùbá.
- source_word: πρωτοκλισίας
  choice: àwọn ipò ọlá
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ibi tí ó ní ọlá jù lọ níbi oúnjẹ, níbi tí àwọn ènìyàn ayé àtijọ́ ti máa ń rọ̀gbọ̀kú; ‘àwọn ipò ọlá’ sọ ìtumọ̀ àwùjọ rẹ̀ ní kedere láìfi àṣà jíjẹun òde òní wọ ọ́.
- source_word: δείπνοις
  choice: àsè
  rationale: Nínú àyíká ìwá ọlá àti ipò ní gbangba, ‘àsè’ dára ju ‘oúnjẹ alẹ́’ lọ, nítorí ó lè túmọ̀ sí oúnjẹ pàtàkì tí ọ̀pọ̀ ènìyàn péjọ sí.
- source_word: καὶ ... καὶ
  choice: àti ... àti
  rationale: A pa àsopọ̀ tí a tún sọ mọ́ láti fi hàn bí àwọn ohun tí wọ́n fẹ́ràn ṣe ń tẹ̀ lé ara wọn.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: nínú àwọn sínágọ́gù ... níbi àsè
  rationale: 'A túmọ̀ ἐν ní ọ̀nà tí ó bá Yorùbá mu: ‘nínú’ fún ilé ìpàdé, àti ‘níbi’ fún ìṣẹ̀lẹ̀ àsè.'
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó bójú mu, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìjókòó ọlá’ àti ‘ipò ọlá’ láti yà πρωτοκαθεδρίας sí ọ̀tọ̀ kúrò ní πρωτοκλισίας, nígbà tí a ṣì pa èrò ìwá ipò àti ọlá tí ó wà nínú méjèèjì mọ́.
