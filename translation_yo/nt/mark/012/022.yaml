  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: yo
  text: Àwọn méje náà kò sì fi ọmọ sílẹ̀[a]. Ní ìkẹyìn, lẹ́yìn gbogbo wọn, obìnrin náà pẹ̀lú kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “kò fi irúgbìn sílẹ̀,” ìyẹn ni pé wọn kò fi ọmọ tàbí àtọmọdọ́mọ sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: àwọn méje náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí àwọn arákùnrin méje tí a ti mẹ́nu kàn tẹ́lẹ̀; “àwọn méje náà” ṣe kedere, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: kò fi ọmọ sílẹ̀
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààràtà sí pé wọn kò “fi irúgbìn sílẹ̀,” ṣùgbọ́n ní àyíká yìí ó túmọ̀ sí pé wọn kò bí ọmọ tàbí fi àtọmọdọ́mọ sílẹ̀. “Fi ọmọ sílẹ̀” sọ ìtumọ̀ náà ní Yorùbá tó ṣe kedere.
- source_word: ἔσχατον πάντων
  choice: ní ìkẹyìn gbogbo wọn
  rationale: Ó pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́, ó sì fi hàn pé ikú obìnrin náà ni ó ṣẹlẹ̀ lẹ́yìn ti gbogbo àwọn yòókù.
- source_word: καὶ ἡ γυνὴ
  choice: obìnrin náà pẹ̀lú
  rationale: “Pẹ̀lú” mú agbára àfikún καί jáde, nígbà tí “náà” ń tọ́ka sí obìnrin tí a ti mọ̀ nínú àkọsílẹ̀ náà.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá ti ọ̀rọ̀-ìṣe Gíríìkì náà; kò yẹ kí a rọ ìtumọ̀ rẹ̀.
