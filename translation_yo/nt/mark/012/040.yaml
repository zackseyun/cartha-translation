  - severity: medium
    issue: ‘Ìdálẹ́bi tí ó le jù’ yí περισσότερον sí ìwọ̀n líle.
    rationale: περισσότερον túmọ̀ sí ‘tó pọ̀ ju’/‘tó ga ju’ ní ìfiwéra; kò sọ ní pàtó pé ìdálẹ́bi náà ‘le’ ju.
