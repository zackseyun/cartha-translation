source:
  edition: SBLGNT
  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: yo
  text: àwọn tí ń jẹ ilé àwọn opó run, tí wọ́n sì ń gbàdúrà fún ìgbà pípẹ́ fún àṣehàn[a]—àwọn wọ̀nyí yóò gba ìdálẹ́bi tí ó pọ̀ ju[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gẹ́gẹ́ bí àwáwí” tàbí “láti ṣe àṣehàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìdájọ́ tí ó pọ̀ ju.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: ń jẹ ... run
  rationale: Ọ̀rọ̀ yìí pa àwòrán líle ti jíjẹ ohun kan run mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣàpèjúwe bí wọ́n ṣe ń fi ìwọra gba ohun ìní àwọn opó.
- source_word: οἰκίας
  choice: ilé
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, nígbà tí àyíká ọ̀rọ̀ jẹ́ kí a lè lóye rẹ̀ gẹ́gẹ́ bí ilé, agbo ilé, tàbí ohun ìní wọn láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: χηρῶν
  choice: àwọn opó
  rationale: Ó túmọ̀ sí àwọn obìnrin tí ọkọ wọn ti kú, tí wọ́n sì jẹ́ ẹgbẹ́ aláìlágbára tí a ń ni lára nínú àyíká yìí.
- source_word: προφάσει
  choice: láti fi ara hàn
  rationale: Gbólóhùn Yorùbá yìí sọ ète àṣehàn àti àgàbàgebè náà ní ọ̀nà tí ó ṣe kedere, nígbà tí a fi ìtumọ̀ tó sún mọ́ ‘gẹ́gẹ́ bí àwáwí’ sínú àlàyé ìsàlẹ̀.
- source_word: μακρὰ
  choice: fún ìgbà pípẹ́
  rationale: Ó fi hàn pé àdúrà náà ń gba àkókò gígùn, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: προσευχόμενοι
  choice: ń gbàdúrà
  rationale: Ìṣe tí ń lọ lọ́wọ́ bá ipa participle Gíríìkì mu nínú àpèjúwe àwọn akọ̀wé náà.
- source_word: λήμψονται
  choice: yóò gba
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú ti gbígba ohun tí a dá lé wọn lórí mọ́, pẹ̀lú ohùn ọ̀wọ̀ tó bá ọ̀rọ̀ ìdájọ́ mu.
- source_word: περισσότερον
  choice: tí ó le jù
  rationale: Pẹ̀lú ‘ìdálẹ́bi,’ èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìjìyà tàbí ìdálẹ́bi náà yóò pọ̀ ní ìwọ̀n tàbí ní líle.
- source_word: κρίμα
  choice: ìdálẹ́bi
  rationale: Nínú ìkìlọ̀ yìí, ọ̀rọ̀ náà ní agbára ìdájọ́ tí ń yọrí sí ẹ̀bi àti ìjìyà; ‘ìdálẹ́bi’ mú agbára yẹn jáde, nígbà tí ‘ìdájọ́’ ṣì wà gẹ́gẹ́ bí ìtumọ̀ mìíràn.
theological_decisions:
- issue: Agbára κρίμα nínú ìkìlọ̀ sí àgàbàgebè ẹ̀sìn
  choice: ìdálẹ́bi
  alternative: ìdájọ́
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìdájọ́ Ọlọ́run tí yóò mú ẹ̀bi àti ìjìyà wá, kì í ṣe àyẹ̀wò lásán. Síbẹ̀, àlàyé ìsàlẹ̀ pa ‘ìdájọ́’ mọ́ láti má ṣe pa ìbú ìtumọ̀ ọ̀rọ̀ Gíríìkì náà run.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. ‘Ń jẹ ... run’ pa àwòrán líle ti ọ̀rọ̀ Gíríìkì mọ́; ‘láti fi ara hàn’ sì sọ ìwà àgàbàgebè náà ní ọ̀nà àdánidá. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó yẹ.
