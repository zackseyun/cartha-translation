  to: àwọn tí ń jẹ ilé àwọn opó run, tí wọ́n sì ń gbàdúrà fún ìgbà pípẹ́ fún àṣehàn[a]—àwọn wọ̀nyí yóò gba ìdálẹ́bi tí ó pọ̀ ju[b].
