  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé èdè Gíríìkì dáadáa ní gbogbogbòò: ó pa àwòrán ‘jíjẹ ilé àwọn opó run’ mọ́, ó sì fi ìdájọ́ ọjọ́ iwájú hàn. Ṣùgbọ́n ‘láti fi ara hàn’ lè túmọ̀ sí fífi ara ẹni hàn lasan ju ète àwáwí/àṣehàn ti προφάσει lọ, àti ‘tí ó le jù’ ń tọ́ka sí líle dípò ìwọ̀n ‘tó pọ̀ ju’ ti περισσότερον.'
  naturalness: ‘Fún àṣehàn’ jẹ́ àdánidá, ó sì ṣàfihàn ìwà ìbòsípò tàbí àgàbàgebè náà ní kedere. ‘Ìdálẹ́bi tí ó pọ̀ ju’ jẹ́ ọ̀nà Yorùbá tó dára láti fi ìfiwéra ‘greater condemnation’ hàn láì sọ ìwọ̀n ìdálẹ́bi náà di ‘líle’ nìkan.
  terminology: ‘Àwọn opó,’ ‘ń gbàdúrà,’ àti ‘ìdálẹ́bi’ bá ọ̀rọ̀ náà àti ohùn ìkìlọ̀ rẹ̀ mu. Àlàyé ìsàlẹ̀ ‘ìdájọ́’ yẹ kí ó lo ‘tí ó pọ̀ ju’ pẹ̀lú, kí ó má bàa yí ìfiwéra Gíríìkì padà sí ìdájọ́ tó le jù.
  issues:
