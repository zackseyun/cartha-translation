id: MRK.12.10
reference: Mark 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: yo
  text: '“Ṣé ẹ kò tilẹ̀ ka Ìwé Mímọ́ yìí rí:


    ‘Òkúta tí àwọn tí ń kọ́ ilé kọ̀ sílẹ̀,

    òun náà di orí igun’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφὴν
  choice: Ìwé Mímọ́
  rationale: Nínú Májẹ̀mú Tuntun, γραφή sábà máa ń tọ́ka sí Ìwé Mímọ́; yíyan ọ̀rọ̀ yìí mú ìtumọ̀ ìtọ́kasí sí ẹsẹ Ìwé Mímọ́ hàn gbangba.
- source_word: ἀνέγνωτε
  choice: ẹ̀yin kò ... ka ... rí
  rationale: Ìbéèrè àtakò yìí ń tọ́ka sí ohun tí wọ́n yẹ kí wọ́n ti kà; ìṣètò ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìbéèrè náà mọ́.
- source_word: οὐδὲ
  choice: kò tilẹ̀
  rationale: “Kò tilẹ̀” pa ìtẹnumọ́ οὐδέ mọ́, kì í ṣe ìkọ̀sílẹ̀ lásán.
- source_word: Λίθον
  choice: Òkúta
  rationale: Bó tilẹ̀ jẹ́ pé àpólà Gíríìkì náà kò ní article, òkúta pàtó kan ni àwòrán inú Sáàmù 118 ń tọ́ka sí; Yorùbá kò nílò article kan láti sọ ìdánimọ̀ yìí.
- source_word: ἀπεδοκίμασαν
  choice: kọ̀ sílẹ̀
  rationale: Àpólà yìí sọ pé àwọn ọmọlé yẹ òkúta náà wò, wọ́n sì kọ̀ ọ́; “kọ̀ sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi àlàyé kún ẹsẹ náà.
- source_word: οἱ οἰκοδομοῦντες
  choice: àwọn ọmọlé
  rationale: Participle náà dúró bí orúkọ fún àwọn tó ń kọ́ ilé; “àwọn ọmọlé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa àkàwé iṣẹ́ ìkọ́lé mọ́.
- source_word: οὗτος ἐγενήθη
  choice: òun náà ni ó di
  rationale: “Òun náà” pa ìtẹnumọ́ demonstrative οὗτος mọ́, “ó di” sì fi ìyípadà sí ipò tuntun tí ἐγενήθη sọ hàn.
- source_word: εἰς κεφαλὴν γωνίας
  choice: olórí igun ilé
  rationale: Ìtumọ̀ gígùn rẹ̀ ni “orí igun”; “olórí igun ilé” pa àwòrán òkúta pàtàkì ní igun ilé mọ́, kò sì fi tipátipá pinnu bóyá ó jẹ́ òkúta ìpìlẹ̀ tàbí òkúta òkè.
theological_decisions:
- issue: Lílo àwòrán Sáàmù 118:22 nípa Mèsáyà
  choice: Pa àwòrán òkúta, àwọn ọmọlé àti olórí igun ilé mọ́ láìsọ ní tààrà pé Mèsáyà ni òkúta náà.
  alternative: Ṣàlàyé nínú ìtumọ̀ pé Jésù tàbí Mèsáyà ni òkúta náà.
  rationale: Àyíká ọ̀rọ̀ náà fi àwòrán yìí kan Jésù, ṣùgbọ́n ẹsẹ tí a fa yọ fúnra rẹ̀ ń sọ̀rọ̀ ní àkàwé; ìtumọ̀ náà yẹ kí ó pa agbára àti àìsọ ohun gbogbo ní gbangba yẹn mọ́.
- issue: Ìtumọ̀ κεφαλὴ γωνίας
  choice: Lo “olórí igun ilé,” kí àlàyé ìsàlẹ̀ sọ àwọn àṣàyàn pàtàkì.
  alternative: “Òkúta igun ilé” tàbí “òkúta pàtàkì jù lọ ní igun ilé.”
  rationale: Àpólà Gíríìkì náà túmọ̀ ní gígùn sí “orí igun,” ṣùgbọ́n ipa gangan òkúta náà lè jẹ́ kókó àríyànjiyàn. Àkọ́kọ́ ọrọ̀ àti àlàyé ìsàlẹ̀ jọ ń pa àìdánilójú náà mọ́ láìsọ ẹ̀kọ́ ìsìn kan di dandan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. “Ṣé” jẹ́ ọ̀rọ̀ ìbéèrè tó wọ́pọ̀, “ẹ̀yin” sì bá ẹni púpọ̀ tí Gíríìkì ń bá wí mu. Ìtòlẹ́sẹẹsẹ ewì ni a lò fún ọ̀rọ̀ tí a fa yọ láti inú Sáàmù.
