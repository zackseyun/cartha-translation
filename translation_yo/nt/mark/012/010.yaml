  source_fidelity: Ìbéèrè náà àti àwòrán ìtọ́kasí Sáàmù 118 ni a pa mọ́, ṣùgbọ́n ìtẹ̀síwájú “rí pé” nínú àkọsílẹ̀ yìí kì í bá ìṣètò ìbéèrè Gíríìkì náà mu dáadáa. Pẹ̀lú náà, “olórí igun ilé” lè mú kí òkúta náà dà bí ẹni, ó sì fi “ilé” kún àpólà tí kò sí nínú orísun.
