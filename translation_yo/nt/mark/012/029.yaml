id: MRK.12.29
reference: Mark 12:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: yo
  text: 'Jésù dáhùn pé, “Èyí àkọ́kọ́ ni pé: ‘Gbọ́, Ísírẹ́lì, Olúwa[b] Ọlọ́run wa, Olúwa kan ni’[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí, “Olúwa Ọlọ́run wa jẹ́ Olúwa kan,” tàbí “Olúwa ni Ọlọ́run wa, Olúwa nìkan ṣoṣo.” Ìlà Gíríìkì náà jẹ́ àyọlò Diutarónómì 6:4, ó sì lè tẹnumọ́ pé Ọlọ́run jẹ́ ọ̀kan àti/tàbí pé òun nìkan ni Ọlọ́run.
    reason: alternative_reading
  - marker: b
    text: Nítorí pé ìlà yìí jẹ́ àyọlò láti inú Ṣémà (Diutarónómì 6:4), “Olúwa” níbí ṣojú κύριος Gíríìkì, èyí tí Septuagint lò fún orúkọ Ọlọ́run, YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé Jésù fèsì sí ìbéèrè náà.
- source_word: Πρώτη
  choice: Èyí àkọ́kọ́
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró fún ‘àṣẹ’ tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀; yíyan èyí kò fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: Ἄκουε
  choice: Gbọ́
  rationale: Ó pa ìró ìpè ìbẹ̀rẹ̀ Ṣémà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún fífetísílẹ̀ àti ṣíṣe ohun tí a gbọ́.
- source_word: Ἰσραήλ
  choice: Ísírẹ́lì
  rationale: A lo ìkọ̀wé orúkọ náà ní Yorùbá, pẹ̀lú ‘ìwọ’ láti mú ìpè tààrà náà ṣe kedere.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún κύριος; nínú àyọlò Ṣémà yìí, ó tún ṣojú orúkọ Ọlọ́run YHWH gẹ́gẹ́ bí Septuagint ṣe lò ó.
- source_word: θεὸς ἡμῶν
  choice: Ọlọ́run wa
  rationale: Ó túmọ̀ ìbáṣepọ̀ ohun-ìní náà ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: εἷς
  choice: kan
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì láì pinnu láìmọ̀ọ́mọ̀ bóyá ìtẹnumọ́ náà wà lórí ìṣọ̀kan Ọlọ́run, pé òun nìkan ni Ọlọ́run, tàbí méjèèjì.
theological_decisions:
- issue: Bí a ṣe máa tú gbólóhùn ìkẹyìn Ṣémà láì mú ìtumọ̀ rẹ̀ dín kù sí ọ̀kan ṣoṣo
  choice: Olúwa Ọlọ́run wa, Olúwa kan ni
  alternative: “Olúwa Ọlọ́run wa jẹ́ Olúwa kan,” tàbí “Olúwa ni Ọlọ́run wa, Olúwa nìkan ṣoṣo”
  rationale: Ìtòlẹ́sẹẹsẹ Gíríìkì ń fara mọ́ Septuagint ti Diutarónómì 6:4, ó sì lè tẹnumọ́ jíjẹ́ ọ̀kan Ọlọ́run, pé òun nìkan ló yẹ kí a sìn, tàbí méjèèjì. Àyànfẹ́ yìí sún mọ́ ìtò Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní iyì, tó sì yé àwọn òǹkàwé òde òní. A fi àmì ohùn síbi tí ó bá yẹ, a sì pa ìró ọ̀rọ̀ ìjẹ́wọ́ Ṣémà mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
