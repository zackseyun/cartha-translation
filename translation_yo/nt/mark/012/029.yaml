  terminology: “Jésù,” “Ísírẹ́lì,” “Olúwa,” àti “Ọlọ́run” yẹ, wọ́n sì bá ìforúkọsílẹ̀ ìwé mímọ́ Yorùbá mu. A pa “Olúwa” mọ́ fún κύριος, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú YHWH láì yí ìtumọ̀ ẹsẹ̀ padà.
