source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: yo
  text: Ẹ̀kejì sì gba obìnrin náà níyàwó[a], ó sì kú láì fi ọmọ sílẹ̀; bẹ́ẹ̀ náà sì ni ẹ̀kẹta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “gba obìnrin náà”; nínú àyíká yìí, ìtumọ̀ rẹ̀ ni pé ó fẹ́ ẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ẹ̀kejì
  rationale: Ọ̀rọ̀ onípò yìí dúró gẹ́gẹ́ bí orúkọ. Àyíká ọ̀rọ̀ fi hàn pé arákùnrin kejì ni, ṣùgbọ́n ‘arákùnrin’ kò fara hàn gbangba nínú gbólóhùn Gíríìkì yìí.
- source_word: ἔλαβεν αὐτήν
  choice: gba obìnrin náà níyàwó
  rationale: Bí ó tilẹ̀ jẹ́ pé λαμβάνω túmọ̀ ní pàtàkì sí ‘gbà’ tàbí ‘mú,’ nínú àyíká ìgbéyàwó opó yìí ó túmọ̀ sí gbígbà á níyàwó. Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ἀπέθανεν
  choice: ó sì kú
  rationale: Ìtumọ̀ tààrà àti àdánidá ni ‘kú,’ láì lo ọ̀rọ̀ ìrọ̀rùn tí yóò dín agbára ìtàn náà kù.
- source_word: μὴ καταλιπὼν
  choice: láì fi ... sílẹ̀
  rationale: Ìṣètò yìí sọ ìṣe tó bá ikú rẹ̀ lọ àti àbájáde rẹ̀ ní Yorùbá tó rọrùn.
- source_word: σπέρμα
  choice: irú-ọmọ
  rationale: Nínú àyíká òfin ìgbéyàwó opó, ọ̀rọ̀ náà tọ́ka sí ọmọ tàbí àtọmọdọ́mọ, kì í ṣe irúgbìn gidi. ‘Irú-ọmọ’ pa ìtẹnumọ́ lórí ìran mọ́, kò sì fi dandan sọ pé ọmọ kan ṣoṣo ni.
- source_word: ὁ τρίτος ὡσαύτως
  choice: bẹ́ẹ̀ náà sì ni ẹ̀kẹta
  rationale: Èyí pa kúkúrú àti ìfọ̀rọ̀wépọ̀ gbólóhùn Gíríìkì mọ́; àwọn ìṣe tí a kò tún sọ hàn gbangba láti inú àyíká.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘gba ... níyàwó’ dípò ‘fẹ́’ láti pa àwòrán gbígbà obìnrin náà gẹ́gẹ́ bí aya mọ́ díẹ̀, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tààrà hàn.
