id: MRK.12.15
reference: Mark 12:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: yo
  text: Ṣùgbọ́n ó mọ àgàbàgebè wọn, ó sì sọ fún wọn pé, “Èé ṣe tí ẹ fi ń dán mi wò?[b] Ẹ mú owó dínárì kan[a] wá fún mi, kí n lè wò ó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dínárì jẹ́ owó fàdákà ilẹ̀ Róòmù kan; a sábà máa ń lò ó gẹ́gẹ́ bí ìsanwó iṣẹ́ ọjọ́ kan.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “Èé ṣe tí ẹ fi ń dẹ mí wò?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ó mọ
  rationale: Ó fi ìmọ̀ Jésù nípa èrò inú wọn hàn ní ọ̀nà Yorùbá tó ṣe déédé, láì fi ìtumọ̀ míì kún un.
- source_word: ὑπόκρισιν
  choice: àgàbàgebè
  rationale: Ọ̀rọ̀ yìí ṣàfihàn ìwà èké tí wọ́n fi bo ète búburú wọn, ó sì bá agbára ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú gbólóhùn yìí, Τί ń béèrè ìdí; “Èé ṣe” ni ọ̀nà Yorùbá àdánidá fún ìbéèrè náà.
- source_word: πειράζετε
  choice: ẹ fi ń dán mi wò
  rationale: Ó sọ ìgbìyànjú ọ̀tá láti dán Jésù wò, ó sì tún pa ààyè ìtumọ̀ tó lè jẹ́ ìdẹwò mọ́.
- source_word: φέρετέ
  choice: Ẹ mú ... wá fún mi
  rationale: Ó jẹ́ àṣẹ pé kí wọ́n gbé ohun náà tọ Jésù wá, èyí sì jẹ́ ọ̀nà Yorùbá tó ṣe déédé.
- source_word: δηνάριον
  choice: owó dínárì kan
  rationale: A pa orúkọ owó ìgbà Róòmù náà mọ́ fún ìpéye ìtàn, a sì fi “owó” kún un kí òǹkàwé lè mọ ohun tí ó jẹ́.
- source_word: ἵνα ἴδω
  choice: kí n lè wò ó
  rationale: Ó pa ète gbólóhùn Gíríìkì mọ́; arọ́pò-orúkọ “ó” ń tọ́ka sí owó dínárì náà.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀sùn Jésù nínú πειράζετε
  choice: dán mi wò
  alternative: dẹ mí wò / fi mí sínú ìdẹwò
  rationale: “Dán mi wò” bá ọ̀rọ̀ nípa ìgbìyànjú ọ̀tá láti mú Jésù nínú mu, láì sọ ọ́ di ìbéèrè lásán tàbí fi ẹ̀kọ́ ìsìn kan tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe déédé fún òǹkàwé òde òní ni a lò. A gbe àmì àlàyé [a] sí lẹ́yìn “dínárì” àti [b] sí lẹ́yìn “dán mi wò” kí ọkọọkan lè tọ́ka sí ohun tí àlàyé rẹ̀ ń ṣàlàyé.
