source:
  edition: SBLGNT
  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: yo
  text: Ó sì tún rán ìránṣẹ́ mìíràn sí wọn; wọ́n lù ú ní orí[b], wọ́n sì kó ìtìjú bá a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ọ̀rọ̀ ìṣe Gíríìkì tí ó ṣọ̀wọ́n níbí ń tọ́ka sí ìwà ipá tí a ṣe sí orí; ó ṣeé túmọ̀ sí “wọ́n lù ú ní orí” tàbí “wọ́n ṣe ọgbẹ́ ní orí rẹ̀,” kì í ṣe pé wọ́n gé orí rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wọ́n hùwà sí i ní ọ̀nà ìtìjú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ohun tí ó ṣẹlẹ̀ tẹ́lẹ̀ tún ṣẹlẹ̀ nínú ìtẹ̀síwájú àkàwé náà.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ ìṣe aorist náà sọ ìṣẹ̀lẹ̀ kan ní àkókò tí ó kọjá; “rán” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé, tí ó sì ṣe kedere.
- source_word: πρὸς αὐτοὺς
  choice: sí wọn
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe “rán,” “sí wọn” ni ìtumọ̀ Yorùbá àdánidá fún ìtọ́sọ́nà sí àwọn ẹni náà.
- source_word: ἄλλον δοῦλον
  choice: ìránṣẹ́ mìíràn
  rationale: δοῦλος lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú gẹ́gẹ́ bí àyíká ọ̀rọ̀. “Ìránṣẹ́” bá àkàwé yìí mu, ó sì pa ìbáṣepọ̀ olúwa àti ìránṣẹ́ mọ́ láìfi ipò ẹrú hàn ju bí ẹsẹ̀ náà ṣe béèrè lọ.
- source_word: κἀκεῖνον
  choice: wọ́n … ú
  rationale: Yorùbá àdánidá ń lo arọ́pò-orúkọ ohun “ú” níbí; “sì” pa agbára àsopọ̀ καί mọ́.
- source_word: ἐκεφαλίωσαν
  choice: wọ́n lù ú ní orí
  rationale: Ọ̀rọ̀ ìṣe tí ó ṣọ̀wọ́n yìí tọ́ka sí ìwà ipá tí a ṣe sí orí. Ìtumọ̀ yìí ṣe kedere, kò sì túmọ̀ ọ́ sí pípa orí rẹ̀.
- source_word: ἠτίμασαν
  choice: wọ́n sì tàbùkù sí i
  rationale: Àṣàyàn yìí fi hàn pé wọ́n ṣe é ní àìbọ̀wọ̀ àti ní ọ̀nà ìtìjú; ó jẹ́ Yorùbá àdánidá fún ìtumọ̀ ọ̀rọ̀ Gíríìkì náà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìṣàpẹẹrẹ àkàwé tó ní iyì ṣùgbọ́n tó ṣeé lóye. A kò fi àmì àlàyé [a] sí δοῦλος, nítorí “ẹrú” kì í ṣe àṣàyàn ìtumọ̀ pàtó tí ó nílò àlàyé ní Yorùbá níbí; “ìránṣẹ́” ni àṣàyàn àyíká-ọ̀rọ̀.
