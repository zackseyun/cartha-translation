id: MRK.12.28
reference: Mark 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: yo
  text: Ọ̀kan lára àwọn akọ̀wé sì sún mọ́ ọn. Ó gbọ́ bí wọ́n ṣe ń jíròrò, ó sì rí i pé Jésù dá wọn lóhùn dáadáa. Nígbà náà, ó bi í pé, “Èwo ni àṣẹ àkọ́kọ́ nínú gbogbo wọn[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “èyí tó ga jù lọ nínú gbogbo wọn” tàbí “èyí tó ṣe pàtàkì jù lọ nínú gbogbo wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Nínú àyíká àwọn Ìhìn Rere, ọ̀rọ̀ náà ń tọ́ka sí àwọn amòye Júù tí a mọ̀ sí akẹ́kọ̀ọ́ àti olùkọ́ Òfin; “àwọn akọ̀wé” jẹ́ ìtumọ̀ taara tí kò fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: προσελθὼν
  choice: sún mọ́ ọn
  rationale: Ó fi ìṣípò ènìyàn náà sí ọ̀dọ̀ Jésù hàn ní Yorùbá àdánidá.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: gbọ́ bí wọ́n ṣe ń jíròrò
  rationale: “Jíròrò” lè gba ìtumọ̀ ìfọ̀rọ̀wérọ̀ tàbí àríyànjiyàn lórí ọ̀ràn kan láìjẹ́ pé ó dájú pé wọ́n ń bínú sí ara wọn.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: rí i pé Jésù dá wọn lóhùn dáadáa
  rationale: Ó pa ìtumọ̀ pé akọ̀wé náà ṣàkíyèsí didara ìdáhùn náà mọ́; lílo “Jésù” mú ẹni tí arọ́pò-orúkọ ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ἐπηρώτησεν
  choice: bi í pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífi ìbéèrè kan hàn.
- source_word: Ποία
  choice: Èwo
  rationale: Ó béèrè fún yíyan ọ̀kan lára àwọn àṣẹ.
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì yẹ fún ohun tí Ọlọ́run pàṣẹ nínú Òfin.
- source_word: πρώτη πάντων
  choice: àkọ́kọ́ nínú gbogbo wọn
  rationale: Ó dúró sítòsí Gíríìkì “àkọ́kọ́ nínú gbogbo,” ó sì tún jẹ́ kí ìtumọ̀ ipò tàbí pàtàkì rẹ̀ wà ní ṣíṣí.
theological_decisions:
- issue: Ìtumọ̀ πρώτη nínú ìbéèrè nípa àṣẹ
  choice: àkọ́kọ́ nínú gbogbo wọn
  alternative: èyí tó ṣe pàtàkì jù lọ nínú gbogbo wọn; èyí tó ga jù lọ
  rationale: πρώτη lè túmọ̀ sí àkọ́kọ́ ní ìtẹ̀lé tàbí èyí tó ga jù lọ ní ipò. Ọ̀rọ̀ inú ẹsẹ náà pa “àkọ́kọ́” mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tó ṣeé ṣe hàn, kí a má bàa yanjú àìdánilójú Gíríìkì láìfọ̀rọ̀ sábẹ́ ahọ́n sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pín gbólóhùn Gíríìkì gígùn náà sí àwọn gbólóhùn kúkúrú fún ìtumọ̀ tó ṣe kedere ní Yorùbá, láìyí ìtẹ̀síwájú ìṣẹ̀lẹ̀ padà.
