  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣètò àti ìfọkànsìn Gíríìkì dáadáa ní ọ̀pọ̀lọpọ̀: ó pa kókó àwọn òkú, ìbéèrè àsọyé, ìtọ́kasí sí ìwé Mósè, ìsọ̀rọ̀ Ọlọ́run fún Mósè, àti ìtúnlò «Ọlọ́run» nínú àsọyé náà mọ́. Ṣùgbọ́n «igbó kékeré» túmọ̀ sí igbó tàbí aginjù kékeré, kì í sì ṣe βάτος, èyí tí ó jẹ́ igbó/igi ẹ̀gún (bramble, thornbush).'
  naturalness: «Ní ti àwọn òkú sì» lè yí padà sí «Ní ti àwọn òkú náà» láti jẹ́ Yorùbá òde òní tí ó rọrùn fún kíkà ní gbangba. «Pé a ń jí wọn dìde» lóye, ṣùgbọ́n «pé a máa ń jí àwọn òkú dìde» sọ ìṣe gbogbogbò tí ìsinsìnyí Gíríìkì ń tọ́ka sí ní kedere, ó sì yọ ìfarahàn aṣojú tí kò ní ìtọ́kasí kúrò.
  terminology: A gbọdọ̀ rọ́pò «igbó kékeré» pẹ̀lú «igbó ẹ̀gún» nínú ẹsẹ̀ àti àlàyé ìsàlẹ̀. Èyí dá ìtumọ̀ βάτος (thornbush/bramble) dúró, nígbà tí ó tún bójú mu ìṣẹ̀lẹ̀ Mósè tí a ń tọ́ka sí. Àwọn orúkọ Ábúráhámù, Ísáákì, àti Jákọ́bù, pẹ̀lú «Ọlọ́run», bójú mu.
