revisions:
- from: Ní ti àwọn òkú sì, pé a ń jí wọn dìde, ṣé ẹ̀yin kò kà á nínú ìwé Mósè, ní apá tí ó sọ nípa igbó kékeré[a], bí Ọlọ́run ṣe sọ fún un pé, ‘Èmi ni Ọlọ́run Ábúráhámù àti Ọlọ́run Ísáákì àti Ọlọ́run Jákọ́bù’?”
  to: Ní ti àwọn òkú náà, pé a máa ń jí àwọn òkú dìde, ṣé ẹ̀yin kò kà á nínú ìwé Mósè, ní apá tí ó sọ nípa igbó ẹ̀gún náà[a], bí Ọlọ́run ṣe sọ fún un pé, ‘Èmi ni Ọlọ́run Ábúráhámù àti Ọlọ́run Ísáákì àti Ọlọ́run Jákọ́bù’?
  rationale: Àtúnṣe náà ṣe pàtàkì nítorí «igbó ẹ̀gún» ló bá βάτος mu; a kò gbọdọ̀ sọ ọ́ di «igbó kékeré». A tún ṣe ìṣètò ìbẹ̀rẹ̀ ẹsẹ̀ náà ní Yorùbá tí ó rọrùn, a sì pa ìtumọ̀ ìṣe àjíǹde gẹ́gẹ́ bí òtítọ́ gbogbogbò mọ́. A pa ìbéèrè, ìtọ́kasí sí Mósè, ìdí-ọrọ̀ «fún un», àti ìtúnlò «Ọlọ́run» nínú àsọyé Ọlọ́run mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:43Z'
