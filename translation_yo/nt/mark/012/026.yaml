id: MRK.12.26
reference: Mark 12:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: yo
  text: Ní ti àwọn òkú náà, pé a máa ń jí àwọn òkú dìde, ṣé ẹ̀yin kò kà á nínú ìwé Mósè, ní apá tí ó sọ nípa igbó ẹ̀gún náà[a], bí Ọlọ́run ṣe sọ fún un pé, ‘Èmi ni Ọlọ́run Ábúráhámù àti Ọlọ́run Ísáákì àti Ọlọ́run Jákọ́bù’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níbi igbó ẹ̀gún náà”; gbólóhùn Gíríìkì lè fi ìṣẹ̀lẹ̀ igbó ẹ̀gún náà dá apá Ìwé Mímọ́ yìí mọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Ní ti àwọn òkú sì
  rationale: ‘Ní ti’ fi kókó tí a ń jíròrò hàn, ‘sì’ sì mú ìṣàn ọ̀rọ̀ δέ wá láìfi ìtakora tó lágbára kún un.
- source_word: ὅτι ἐγείρονται
  choice: pé a ń jí wọn dìde
  rationale: 'Ọ̀rọ̀ yìí pa ìtumọ̀ àìṣe-fúnra-ẹni mọ́: ẹlòmíràn, ní àyíká yìí Ọlọ́run, ni ó ń jí àwọn òkú dìde. Àkókò tí a lò tún lè sọ òtítọ́ gbogbogbò nípa àjíǹde.'
- source_word: οὐκ ἀνέγνωτε
  choice: ṣé ẹ̀yin kò kà á
  rationale: Èyí jẹ́ ìbéèrè àsọyé tó bá ọ̀rọ̀ Yorùbá òde òní mu, tí ó sì tọ́ka sí ohun tí wọ́n yẹ kí wọ́n ti kà nínú Ìwé Mímọ́.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: nínú ìwé Mósè
  rationale: ‘Ìwé Mósè’ jẹ́ ọ̀nà adayébá láti tọ́ka sí àwọn ìkọ̀wé Mósè; kò pọndandan láti sọ pé àkájọ ìwé.
- source_word: ἐπὶ τοῦ βάτου
  choice: ní apá tí ó sọ nípa igbó kékeré
  rationale: Gbólóhùn Gíríìkì lè fi ìṣẹ̀lẹ̀ igbó kékeré náà dá apá Ìwé Mímọ́ kan mọ̀. Ìtumọ̀ yìí jẹ́ kó ṣe kedere fún òǹkàwé òde òní, nígbà tí àlàyé ìtumọ̀ gígùn síi wà nínú àlàyé ìsàlẹ̀.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: bí Ọlọ́run ṣe sọ fún un pé
  rationale: Èyí darapọ̀ ọ̀nà tí πῶς fi mú ọ̀rọ̀ àyọlò wọlé àti iṣẹ́ λέγων lọ́nà Yorùbá tó rọrùn.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Èmi ni Ọlọ́run Ábúráhámù àti Ọlọ́run Ísáákì àti Ọlọ́run Jákọ́bù
  rationale: A pa ‘Èmi ni’ àti àtúnṣe ‘Ọlọ́run’ mọ́ nítorí ìtẹnumọ́ àti bí ọ̀rọ̀ àyọlò náà ṣe ṣe pàtàkì sí àríyànjiyàn Jésù.
theological_decisions:
- issue: Èdè àjíǹde nínú ὅτι ἐγείρονται
  choice: pé a ń jí wọn dìde
  alternative: pé wọ́n ń dìde
  rationale: ‘A ń jí wọn dìde’ pa ìrísí àìṣe-fúnra-ẹni mọ́, ó sì jẹ́ kí a lóye pé a ń ṣe ìgbésẹ̀ náà sí wọn, láìṣàlàyé gbogbo ẹ̀kọ́ ẹ̀sìn tó yí i ká.
- issue: Àkókò ìsinsìnyí àti àtúnṣe nínú ìdánimọ̀ Ọlọ́run
  choice: Èmi ni Ọlọ́run Ábúráhámù àti Ọlọ́run Ísáákì àti Ọlọ́run Jákọ́bù
  alternative: Èmi ni Ọlọ́run àwọn Ábúráhámù, Ísáákì àti Jákọ́bù
  rationale: A pa ‘Èmi ni’ àti àtúnṣe ọ̀rọ̀ náà mọ́, nítorí wọn ṣe pàtàkì sí bí Jésù ṣe ń lo ẹsẹ Ìwé Mímọ́ yìí; a kò dín ìfọkànsìn ọ̀rọ̀ Gíríìkì kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, adayébá, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ̀yin’ láti fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
