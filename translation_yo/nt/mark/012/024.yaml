  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ἔφη ni “sọ fún wọn pé”; ìbéèrè àsọyé Οὐ διὰ τοῦτο… ni a mú wá gẹ́gẹ́ bí “Ṣé kì í ṣe nítorí èyí ni ẹ fi ń ṣìnà”; μὴ εἰδότες ni a fi hàn gẹ́gẹ́ bí ìdí; àwọn ohun méjèèjì, “àwọn Ìwé Mímọ́” àti “agbára Ọlọ́run,” wà ní kíkún. Àmì-ẹsẹ̀ náà ń pa àìdánilójú middle/passive ti πλανᾶσθε mọ́ láìfi ìtumọ̀ ẹ̀kọ́ míì kún un.'
  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì yẹ fún ọ̀rọ̀ ìbáwí ọlọ́wọ̀. Ìṣọ̀kan “ẹ kò mọ…, bẹ́ẹ̀ ni ẹ kò mọ…” jẹ́ ọ̀nà tí ó hàn gbangba láti ṣàfihàn μηδέ, àti àmì ohùn jẹ́ pípé ní gbogbogbòò.
  terminology: “Jésù,” “àwọn Ìwé Mímọ́,” àti “agbára Ọlọ́run” jẹ́ ọ̀rọ̀ boṣewa, tí ó ní ìforúkọsílẹ̀ tó yẹ fún ẹsẹ̀ ìwé mímọ́. “Ṣìnà” ń mú ìbáwí πλανᾶσθε wá nípasẹ̀ tí kò fi dandan sọ bóyá wọ́n tan ẹni náà jẹ tàbí wọ́n ṣì lóye.
