id: MRK.12.24
reference: Mark 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Ṣé kì í ṣe nítorí èyí ni ẹ fi ń ṣìnà[a]—nítorí ẹ kò mọ àwọn Ìwé Mímọ́, bẹ́ẹ̀ ni ẹ kò mọ agbára Ọlọ́run?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń mú yín ṣìnà.”
    reason: πλανᾶσθε lè jẹ́ middle tàbí passive ní ìtumọ̀, nítorí náà ó lè túmọ̀ sí pé wọ́n ṣìnà tàbí pé a mú wọn ṣìnà.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sọ fún wọn pé
  rationale: φημί níbí ń ṣe iṣẹ́ ọ̀rọ̀ ìtàn lasán, ‘sọ’; ‘sọ fún wọn pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ, láìfi ìtumọ̀ ‘dáhùn’ kún un.
- source_word: Οὐ διὰ τοῦτο
  choice: Ṣé kì í ṣe nítorí èyí
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè àsọyé tí ó ń retí ìfaramọ́, ó sì pa ìtumọ̀ ìdí tí διά pẹ̀lú accusative ní mọ́.
- source_word: πλανᾶσθε
  choice: ẹ fi ń ṣìnà
  rationale: ‘Ṣìnà’ lè tọ́ka sí jíjẹ́ aláṣìṣe tàbí yíyapa kúrò ní ọ̀nà tó tọ́, láìpinnu bóyá ẹnì kan ló tan wọn jẹ tàbí àwọn fúnra wọn ló ṣìnà.
- source_word: μὴ εἰδότες
  choice: nítorí ẹ kò mọ
  rationale: Participle náà ń sọ ìdí tí wọ́n fi ṣìnà; gbólóhùn ìdí pẹ̀lú ‘nítorí’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὰς γραφὰς
  choice: àwọn Ìwé Mímọ́
  rationale: Plural γραφαί tọ́ka sí àwọn ìwé mímọ́ tí àwọn Júù gbà gẹ́gẹ́ bí Ọ̀rọ̀ Ọlọ́run; fọ́ọ̀mù plural ‘àwọn Ìwé Mímọ́’ pa èyí mọ́.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: bẹ́ẹ̀ ni ẹ kò mọ agbára Ọlọ́run
  rationale: Àtúnṣe ‘ẹ kò mọ’ ń mú ìsopọ̀ òdì μηδέ jáde ní Yorùbá kedere, nígbà tí ‘agbára Ọlọ́run’ túmọ̀ δύναμις τοῦ θεοῦ ní tààrà.
theological_decisions:
- issue: Irú ìṣìnà tí πλανᾶσθε ń sọ
  choice: ẹ fi ń ṣìnà
  alternative: a ń mú yín ṣìnà / ẹ ṣì ní òye
  rationale: Gíríìkì lè túmọ̀ sí jíjẹ́ aláṣìṣe, ṣíṣìnà, tàbí jíjẹ́ ẹni tí a mú ṣìnà. Àyíká ọ̀rọ̀ dá lórí àìlóye wọn nípa àjíǹde, àwọn Ìwé Mímọ́, àti agbára Ọlọ́run; ‘ṣìnà’ pa ìbáwí náà àti ààyè ìtumọ̀ rẹ̀ mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìbéèrè àsọyé náà àti ìbáwí Jésù ni a pa mọ́, láìsọ ọ̀rọ̀ náà di líle ju Gíríìkì lọ.
