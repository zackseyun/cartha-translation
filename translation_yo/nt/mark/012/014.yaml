  source_fidelity: 'Ìtumọ̀ náà gba èrò pàtàkì ẹsẹ náà dáadáa, ṣùgbọ́n àwọn gbolohun Gíríìkì méjì nípa àìfẹ́ ojúsàájú ti di ìtumọ̀ àlàyé ní méjèèjì. Àtúnṣe náà mú ìtẹ̀síwájú orísun náà hàn kedere: a kò lè darí Jésù nípa ẹnikẹ́ni; kò sì máa ń wo ojú ènìyàn.'
