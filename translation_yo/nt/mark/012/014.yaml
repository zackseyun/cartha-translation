- from: Wọ́n sì wá, wọ́n sì wí fún un pé, “Olùkọ́, àwa mọ̀ pé olóòótọ́ ni ọ́, o kò sì ṣe ojúsàájú sí ẹnikẹ́ni,[a] nítorí ìwọ kì í wo ipò ènìyàn, ṣùgbọ́n ní òtítọ́ ni ìwọ ń kọ́ni ní ọ̀nà Ọlọ́run. Ǹjẹ́ ó bófin mu láti san owó orí fún Késárì tàbí kò bófin mu? Ṣé kí a san án,[b] tàbí kí a má san án?”
  to: Wọ́n sì wá, wọ́n sì wí fún un pé, “Olùkọ́, àwa mọ̀ pé olóòótọ́ ni ìwọ, o kò sì jẹ́ kí ẹnikẹ́ni darí ọ, nítorí ìwọ kì í wo ojú ènìyàn,[a] ṣùgbọ́n ní òtítọ́ ni ìwọ ń kọ́ni ní ọ̀nà Ọlọ́run. Ǹjẹ́ ó bófin mu láti san owó orí fún Késárì tàbí kò bófin mu? Ṣé kí a san án,[b] tàbí kí a má san án?”
  rationale: A tún ìtumọ̀ awọn idiomu méjì náà ṣe kí ọkọọkan lè dúró fún apá Gíríìkì tirẹ̀. Àtúnṣe náà pa ìtumọ̀ ìdẹkùn ìbéèrè náà mọ́, ó sì yẹra fún gbolohun “kò bìkítà nípa ẹnikẹ́ni,” èyí tí ó lè dá bí àìní àánú nínú Yorùbá òde òní. A fi “wo ojú ènìyàn” sínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé idiomu nínú àkọsílẹ̀ ìsàlẹ̀.
