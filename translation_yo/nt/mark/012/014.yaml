id: MRK.12.14
reference: Mark 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: yo
  text: Wọ́n sì wá, wọ́n sì wí fún un pé, “Olùkọ́, àwa mọ̀ pé olóòótọ́ ni ìwọ, o kò sì jẹ́ kí ẹnikẹ́ni darí ọ, nítorí ìwọ kì í wo ojú ènìyàn,[a] ṣùgbọ́n ní òtítọ́ ni ìwọ ń kọ́ni ní ọ̀nà Ọlọ́run. Ǹjẹ́ ó bófin mu láti san owó orí fún Késárì tàbí kò bófin mu? Ṣé kí a san án,[b] tàbí kí a má san án?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ìwọ kì í wo ojú ènìyàn.” Èyí jẹ́ idiomu fún àìṣe ojúsàájú sí ènìyàn, tàbí kí ipò, ọlá, tàbí ìrísí wọn má ṣe darí ìdájọ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì κῆνσος ń tọ́ka sí owó orí Róòmù tí a ń gba ní ìbámu pẹ̀lú ìkànìyàn ènìyàn.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ àdírẹ́sì Yorùbá tó wọ́pọ̀ fún ẹni tí ń kọ́ni; ó pa ipa διδάσκαλος mọ́ láì lo ọ̀rọ̀ àtijọ́.
- source_word: ἀληθὴς
  choice: olóòótọ́ ni ọ́
  rationale: Ó ṣàpèjúwe Jésù gẹ́gẹ́ bí ẹni tí ń sọ òtítọ́; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì bá àpólà àsọyé ẹni mu.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: o kò ṣe ojúsàájú sí ẹnikẹ́ni
  rationale: Nínú àyíká yìí, ìtumọ̀ náà ni pé ènìyàn tàbí ipò wọn kò lè yí i lọ́kàn; èyí yẹra fún ìtumọ̀ tí yóò dà bí ẹni pé kò ní ìfẹ́ sí ẹnikẹ́ni.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: ìwọ kì í wo ipò ènìyàn
  rationale: Ó mú àwòrán wíwo ènìyàn mọ́ ní ọ̀nà Yorùbá tó ṣeé lóye, ó sì sọ ìtumọ̀ àkànṣe náà pé kì í jẹ́ kí ipò tàbí ọlá ènìyàn darí ìdájọ́ rẹ̀.
- source_word: ἐπ’ ἀληθείας
  choice: ní òtítọ́
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó sì ṣe àtúnṣe sí ọ̀nà tí ó fi ń kọ́ni.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ọ̀nà Ọlọ́run
  rationale: Ó pa àwòrán ọ̀nà tàbí ipa ọ̀nà inú orísun mọ́, ó sì jẹ́ gbólóhùn Bíbélì tó mọ́gbọ́n dání ní Yorùbá.
- source_word: ἔξεστιν
  choice: ó bófin mu
  rationale: Ó mú ìbéèrè nípa ohun tí òfin tàbí ìlànà fàyè gba jáde ní Yorùbá tó bójú mu.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: láti san owó orí fún Késárì
  rationale: ‘San’ ni ọ̀rọ̀ Yorùbá àdánidá fún sísan owó orí; ‘owó orí’ sọ irú owó ìjọba Róòmù náà ní ṣókí, pẹ̀lú àlàyé ìtàn nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: Καίσαρι
  choice: Késárì
  rationale: Àkọsílẹ̀ orúkọ oyè Róòmù náà ní ìbámu pẹ̀lú ìró Yorùbá, dípò fífi ‘ọba ńlá’ rọ́pò rẹ̀.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Ṣé kí a san án, tàbí kí a má san án?
  rationale: Ó pa àtúnwí ọ̀rọ̀ ìṣe inú Gíríìkì mọ́, èyí tí ń mú ìbéèrè ìdẹkùn náà le sí i.
theological_decisions:
- issue: Ìtumọ̀ àkànṣe nípa ojúsàájú àti ojú ènìyàn
  choice: A lo ‘o kò ṣe ojúsàájú sí ẹnikẹ́ni’ àti ‘ìwọ kì í wo ipò ènìyàn,’ pẹ̀lú àkọsílẹ̀ ìsàlẹ̀ fún àwọn ìtumọ̀ mìíràn.
  alternative: ‘o kò bìkítà nípa ẹnikẹ́ni’ tàbí ‘ìwọ kì í wo ojú ènìyàn’
  rationale: Gíríìkì kò túmọ̀ sí pé Jésù kò ní àánú tàbí ìfẹ́ sí ènìyàn; kókó rẹ̀ ni pé ìwọ̀n ènìyàn, ipò, tàbí ìrísí wọn kò ní ipa lórí rẹ̀. Ìtumọ̀ yìí pa ìdẹkùn ọ̀rọ̀ àwọn olùbéèrè mọ́ láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìpele ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Ǹjẹ́’ fún ìbéèrè òfin àti ‘Ṣé’ fún ìbéèrè àtẹ̀lé tó mú ìdẹkùn náà hàn.
