  verdict: revise
  source_fidelity: Àjíǹde, gbólóhùn àkókò ọjọ́ iwájú náà, ìbéèrè nípa ẹni nínú àwọn méje, àti ìdí tí a fi béèrè náà ni a pa mọ́. Àtúnṣe náà yọ ìfarahàn tí kò dáa nínú ‘ní i ní aya’ kúrò, ó sì tú ἔσχον αὐτὴν γυναῖκα sí ọ̀nà Yorùbá tí ó ṣe kedere gẹ́gẹ́ bí ìbáṣepọ̀ ìgbéyàwó, kì í ṣe ìṣẹ̀lẹ̀ ìfẹ́yàwó nìkan.
