source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: yo
  text: Ní àjíǹde [a], nígbà tí wọ́n bá jí dìde, aya ta nínú wọn ni obìnrin náà yóò jẹ́? Nítorí àwọn méje náà ní obìnrin náà ní aya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “nígbà tí wọ́n bá tún jí dìde.” Gíríìkì sọ ní tààrà pé, “nígbà tí wọ́n bá jí dìde”; àyíká ọ̀rọ̀ nípa àjíǹde ló fi ìtumọ̀ náà hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: àjíǹde
  rationale: Ó tọ́ka sí àjíǹde ọjọ́ iwájú tí ìjíròrò pẹ̀lú àwọn Sadusí dá lé; ‘àjíǹde’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ti wọ́pọ̀ fún resurrection.
- source_word: ὅταν ἀναστῶσιν
  choice: nígbà tí wọ́n bá jí dìde
  rationale: ὅταν pẹ̀lú aorist subjunctive jẹ́ gbólóhùn àkókò tó ń tọ́ka sí ọjọ́ iwájú. A kò fi ‘padà’ kún un, nítorí kò sí ní kedere nínú Gíríìkì.
- source_word: τίνος αὐτῶν
  choice: aya ta ni ... nínú wọn
  rationale: 'Èyí mú ìbéèrè genitive àti ìtumọ̀ partitive náà jáde lọ́nà Yorùbá àdánidá: ta nínú àwọn méje náà ni yóò jẹ́ ọkọ rẹ̀?'
- source_word: ἔσται γυνή
  choice: aya ta ni obìnrin náà yóò jẹ́
  rationale: Ìtumọ̀ predicate nominative náà ni pé obìnrin náà yóò wà ní ipò aya fún ẹni wo; ọ̀nà yìí jẹ́ Yorùbá tó ṣe kedere.
- source_word: γυνή
  choice: aya
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti ìgbéyàwó, nítorí náà ‘aya’ péye ju ìtumọ̀ gbogbogbò ‘obìnrin’ lọ.
- source_word: οἱ γὰρ ἑπτὰ
  choice: nítorí pé àwọn méje náà
  rationale: γάρ ṣàlàyé ìdí ìbéèrè náà. Àyíká ṣáájú ti fi hàn pé àwọn méje náà ni àwọn arákùnrin, nítorí náà kò pọndandan láti fi ‘ọkùnrin’ kún un.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ní i ní aya
  rationale: Èyí pa ìtumọ̀ ‘ní obìnrin náà gẹ́gẹ́ bí aya’ mọ́, dípò yíyí ọ̀rọ̀ náà sí ìṣẹ̀lẹ̀ ‘fẹ́ ẹ’ nìkan.
theological_decisions:
- issue: Èdè àjíǹde nínú àríyànjiyàn pẹ̀lú àwọn Sadusí
  choice: Ní àjíǹde ... nígbà tí wọ́n bá jí dìde
  alternative: Ní àjíǹde kúrò nínú òkú ... nígbà tí wọ́n bá tún jí dìde
  rationale: Ọ̀rọ̀ náà gba àjíǹde ọjọ́ iwájú gẹ́gẹ́ bí kókó, ṣùgbọ́n a kò fi ‘kúrò nínú òkú’ tàbí ‘tún’ kún ohun tí Gíríìkì kò sọ ní kedere. Èyí pa ìtumọ̀ àti àìsọ pàtó inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘aya ta ni ... yóò jẹ́’ gẹ́gẹ́ bí ìṣètò Yorùbá àdánidá, a sì pa àsopọ̀ àlàyé ‘nítorí pé’ mọ́.
