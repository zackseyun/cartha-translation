id: MRK.12.8
reference: Mark 12:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: yo
  text: Wọ́n sì mú un[a], wọ́n pa á, wọ́n sì jù ú síta kúrò nínú ọgbà àjàrà náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn òǹkàwé kan lè retí ìtẹ̀lé pé, “wọ́n jù ú síta kúrò nínú ọgbà àjàrà, wọ́n sì pa á,” nítorí àkàwé tó jọ èyí ní àwọn ibòmíràn; ṣùgbọ́n ọ̀rọ̀ Gíríìkì Máàkù níbí sọ pé, “wọ́n pa á, wọ́n sì jù ú síta kúrò nínú ọgbà àjàrà.”
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: wọ́n mú un
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist ti λαμβάνω, ó sì ṣáájú àwọn ìṣe pàtàkì. “Wọ́n mú un” jẹ́ Yorùbá àdánidá fún ìtẹ̀lé ìṣẹ̀lẹ̀ yìí, láìfi agbára ìtumọ̀ “wọ́n gbá a mú” kún un láìnídí.
- source_word: ἀπέκτειναν
  choice: wọ́n pa á
  rationale: ἀποκτείνω túmọ̀ sí pípa ẹni; “wọ́n pa á” ṣe kedere, ó sì bá bí ìtàn náà ṣe sọ ọ́ ní tààrà mu.
- source_word: ἐξέβαλον
  choice: wọ́n jù ú síta
  rationale: ἐκβάλλω níbí ní agbára ìtumọ̀ jíju tàbí lé ohun kan jáde. “Wọ́n jù ú síta” pa agbára ìṣe náà mọ́, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: síta kúrò nínú ọgbà àjàrà náà
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ἐξέβαλον, gbólóhùn yìí tọ́ka sí ìṣípò láti inú ọgbà àjàrà sí òde; “síta kúrò nínú” sọ ìṣípò náà ní Yorùbá àdánidá.
- source_word: ἀμπελῶνος
  choice: ọgbà àjàrà
  rationale: ἀμπελών ni ọgbà tí a ti ń gbin àjàrà; “ọgbà àjàrà” ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún un.
theological_decisions:
- issue: Ìtẹ̀lé pípa ọmọ náà àti jíju rẹ̀ síta nínú àkàwé
  choice: A tẹ̀ lé ìtẹ̀lé Gíríìkì pé wọ́n kọ́kọ́ pa á, lẹ́yìn náà wọ́n jù ú síta kúrò nínú ọgbà àjàrà.
  alternative: Àwọn kan lè retí pé wọ́n kọ́kọ́ jù ú síta kúrò nínú ọgbà àjàrà, lẹ́yìn náà ni wọ́n pa á, nítorí bí àkàwé tó jọ èyí ṣe wà ní àwọn ibòmíràn.
  rationale: Ọ̀rọ̀ SBLGNT ní Máàkù 12:8 fi ìtẹ̀lé náà hàn pé wọ́n mú un, wọ́n pa á, wọ́n sì jù ú síta. A kò mú un bá àwọn àkọsílẹ̀ tó jọ ọ́ mu, bẹ́ẹ̀ ni a kò yanjú ìforígbárí tó wà níbẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo. A lo “mú un” dípò ọ̀rọ̀ tó lè fi ìwa ipá tí Gíríìkì kò fi dandan hàn kún un.
