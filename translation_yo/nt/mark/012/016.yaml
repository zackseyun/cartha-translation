  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ Gíríìkì mọ́ dáadáa: ohun tí wọ́n mú wá ni a fi hàn nípasẹ̀ àyíká ọ̀rọ̀, ìbéèrè méjèèjì ń béèrè ẹni tí àwòrán àti ìkọ̀wé náà jẹ́ tirẹ̀, ìdáhùn náà sì ṣókí gẹ́gẹ́ bí Καίσαρος. Síbẹ̀, a tún ọ̀rọ̀ fún ἐπιγραφή ṣe kí ó túmọ̀ sí ìkọ̀wé tí a kọ sí nǹkan, kì í ṣe akọlé.'
  naturalness: “Ẹyọ kan” àti “Ti Késárì ni” jẹ́ èdè Yorùbá boṣewa, ó sì bá àyíká owó mu. “Àwòrán yìí àti ìkọ̀wé yìí jẹ́ ti ta ni?” jẹ́ gbolohun ìbéèrè tó ṣe kedere, tó sì jẹ́ àdánidá ju lílo “àkọlé ta ni” lọ.
  terminology: Àwòrán yẹ fún εἰκών. “Ìkọ̀wé” yẹ ní ibi yìí fún ἐπιγραφή lórí owó; “àkọlé” sábà ń túmọ̀ sí akọ́lé ìwé, orúkọ àpilẹ̀kọ, tàbí title, nítorí náà kò péye fún inscription. Késárì jẹ́ ìkọ̀wé orúkọ tó wọ́pọ̀, tí ó sì bójú mu.
  issues:
  - severity: medium
    issue: “Àkọlé” ni a lò fún ἐπιγραφή.
    rationale: Nínú ọ̀rọ̀ owó, ἐπιγραφή ni ìkọ̀wé/àkọsílẹ̀ tí a kọ sí ojú owó. “Àkọlé” lè mú ìtumọ̀ ‘title’ wá, kò sì ṣàfihàn inscription náà ní kíkún.
  revised_text: Wọ́n sì mú ẹyọ kan wá.[a] Ó sì wí fún wọn pé, “Àwòrán yìí àti ìkọ̀wé yìí jẹ́ ti ta ni?” Wọ́n sì dá a lóhùn pé, “Ti Késárì ni.”
