- from: Wọ́n sì mú ẹyọ kan wá.[a] Ó sì wí fún wọn pé, “Àwòrán ta ni èyí, àkọlé ta sì ni?” Wọ́n sì dá a lóhùn pé, “Ti Késárì ni.”
  to: Wọ́n sì mú ẹyọ kan wá.[a] Ó sì wí fún wọn pé, “Àwòrán yìí àti ìkọ̀wé yìí jẹ́ ti ta ni?” Wọ́n sì dá a lóhùn pé, “Ti Késárì ni.”
  rationale: A rọ́pò “àkọlé” pẹ̀lú “ìkọ̀wé” láti fi ìtumọ̀ ἐπιγραφή hàn ní kedere. A tún ṣètò ìbéèrè náà sí “jẹ́ ti ta ni?” kí ìbáṣepọ̀ ìní/ìfaramọ́ tí genitive Gíríìkì ń béèrè hàn ní Yorùbá tí ó mọ́. Ìtumọ̀, ìforígbárí, àti ìdáhùn ṣókí ti orísun kò yí padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:22Z'
