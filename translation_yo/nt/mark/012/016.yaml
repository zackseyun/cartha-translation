  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: yo
  text: Wọ́n sì mú ẹyọ kan wá.[a] Ó sì wí fún wọn pé, “Àwòrán yìí àti ìkọ̀wé yìí jẹ́ ti ta ni?” Wọ́n sì dá a lóhùn pé, “Ti Késárì ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì mú un wá.” A kò sọ ohun tí wọ́n mú wá ní tààrà nínú Gíríìkì; àyíká ọ̀rọ̀ ṣáájú fi hàn pé owó náà, ìyẹn dẹ́náríù kan, ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: wọ́n sì mú ẹyọ kan wá
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ‘mú wá,’ ṣùgbọ́n kò sọ ohun tí wọ́n mú ní tààrà. ‘Ẹyọ kan’ fi owó tí àyíká ọ̀rọ̀ ń tọ́ka sí hàn láìfi ‘dẹ́náríù’ kún ẹsẹ yìí ní pàtó.
- source_word: λέγει
  choice: Ó sì wí fún wọn pé
  rationale: Àkókò ìsinsìnyí nínú Gíríìkì jẹ́ ìsinsìnyí ìtàn tí Máàkù sábà máa ń lò. Yorùbá yìí pa ìtẹ̀síwájú ìtàn mọ́ ní ọ̀nà àdánidá, láìjẹ́ kí gbolohun náà dà bí ẹni pé ó ń ṣẹlẹ̀ ní àsìkò tí a ń kà á.
- source_word: Τίνος
  choice: ta ni / ta sì ni
  rationale: Fọ́ọ̀mù genitive yìí béèrè ẹni tí àwòrán àti àkọlé náà jẹ́ tirẹ̀ tàbí ẹni tí wọ́n ní í ṣe pẹ̀lú. ‘Ta ni’ ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti ẹnu.
- source_word: εἰκών
  choice: àwòrán
  rationale: ‘Àwòrán’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwòrán ẹni tí a tẹ̀ sára owó, ó sì pa ìtumọ̀ Bíbélì tó gbòòrò ti ọ̀rọ̀ náà mọ́.
- source_word: ἐπιγραφή
  choice: àkọlé
  rationale: Ní ti owó, ọ̀rọ̀ náà tọ́ka sí àkọlé tàbí ìkọ̀wé tí a tẹ̀ sí i. ‘Àkọlé’ jẹ́ ọ̀rọ̀ ṣókí, tó lóye, tí kò sì ní ìmọ̀ iṣẹ́ owó àkànṣe tí ‘legend’ ní.
- source_word: Καίσαρος
  choice: Ti Késárì ni
  rationale: Genitive náà dá ìbéèrè nípa ẹni tí àwòrán àti àkọlé jẹ́ tirẹ̀ lóhùn. Ìdáhùn Yorùbá ‘Ti Késárì ni’ jẹ́ àdánidá, ó sì pa ìdáhùn ṣókí ti Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò; a pa ìdáhùn Késárì mọ́ ní ṣókí gẹ́gẹ́ bí orísun.
