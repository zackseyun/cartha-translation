  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: yo
  text: àti láti fi gbogbo ọkàn, gbogbo òye àti gbogbo agbára fẹ́ràn rẹ̀, àti láti fẹ́ràn aládùúgbò ẹni bí ara ẹni, ó ju gbogbo ẹbọ sísun[a] àti ẹbọ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ẹbọ tí a sun tán pátápátá lórí pẹpẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: láti ... fẹ́ràn
  rationale: Ọ̀nà yìí pa agbára ọ̀rọ̀-ìṣe inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá nínú ìtòlẹ́sẹẹsẹ méjèèjì.
- source_word: αὐτόν
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ọlọ́run nínú àyíká ẹsẹ tó ṣáájú; ‘rẹ̀’ pa ọ̀rọ̀ Gíríìkì mọ́ láìfi orúkọ náà kún un.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: fi gbogbo ọkàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìfọkànsìn pátápátá, láìyí ọ̀rọ̀ náà sí àṣẹ tààrà sí olùgbọ́.
- source_word: συνέσεως
  choice: gbogbo òye
  rationale: ‘Òye’ fi ìtumọ̀ ìmọ̀lára, ìlóye àti ìfòyemọ̀ hàn dáadáa ju ọ̀rọ̀ tó túmọ̀ sí èrò inú lásán lọ.
- source_word: ἰσχύος
  choice: gbogbo agbára
  rationale: ‘Agbára’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì sọ gbogbo okun tàbí ipá ẹni nínú àyíká yìí.
- source_word: πλησίον
  choice: aládùúgbò ẹni
  rationale: Bí ó tilẹ̀ jẹ́ ẹyọ nínú Gíríìkì, ìtumọ̀ rẹ̀ kárí gbogbo ènìyàn; ‘ẹni’ pa ìtumọ̀ gbogbogbò yìí mọ́.
- source_word: ὡς ἑαυτόν
  choice: bí ara ẹni
  rationale: Èyí pa ìtumọ̀ arọ́pò-orúkọ àfarawé gbogbogbò mọ́, láìyí i sí ọ̀rọ̀ àṣẹ tààrà.
- source_word: περισσότερόν ἐστιν
  choice: ó ju ... lọ
  rationale: Gbólóhùn Yorùbá yìí sọ ìfiwéra àti ipò gíga jù lọ ní kedere, láìfi àlàyé míì kún un.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: gbogbo ẹbọ sísun àti ẹbọ
  rationale: ‘Ẹbọ sísun’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọrẹ tí a fi iná sun; àlàyé ìtumọ̀ pàtó pé a sun ún tán pátápátá wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn àṣẹ ìfẹ́ pẹ̀lú ìjọsìn nípa ẹbọ
  choice: Ẹsẹ náà sọ pé fífẹ́ràn Ọlọ́run pátápátá àti fífẹ́ràn aládùúgbò ẹni ga ju gbogbo ẹbọ sísun àti ẹbọ lọ.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé ẹsẹ náà fagi lé gbogbo ètò ẹbọ pátápátá, tàbí pé ìfẹ́ àti ẹbọ wà ní ipò kan náà.
  rationale: Ọ̀rọ̀ Gíríìkì περισσότερόν ἐστιν fi ipò gíga jù lọ hàn gbangba, ṣùgbọ́n ẹsẹ náà kò sọ ní tààrà pé a ti fagi lé gbogbo ètò ẹbọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹni’ láti pa ìtumọ̀ gbogbogbò mọ́, a sì fi àmì ìsàlẹ̀ sí ibi tí ó bá ọ̀rọ̀ ‘ẹbọ sísun’ mu.
