    rationale: ἐζήτουν αὐτὸν κρατῆσαι ní ìtumọ̀ tààrà pé wọ́n ń wá a láti mú un. Kí a má fi ohun mìíràn kún un, a gbọ́dọ̀ sọ ẹni tí wọ́n ń wá náà.
