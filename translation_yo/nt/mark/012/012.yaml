  verdict: revise
  source_fidelity: 'Ìbẹ̀rẹ̀ ìtumọ̀ náà ní ìṣòro kékeré: “ń wá ọ̀nà” túmọ̀ sí wíwá ọ̀nà/ìlànà kan, nígbà tí ἐζήτουν αὐτόν sọ pé wọ́n ń wá a (Jésù) láti mú un. Ìtumọ̀ ìyókù mú ìtẹ̀síwájú ìṣe náà, ìbẹ̀rù ogunlọ́gọ̀, àti ìfi-sílẹ̀ rẹ̀ dáadáa. “Pa òwe sí wọn lára” kò dára bí ìsọ̀kan ọ̀rọ̀ Yorùbá fún ìfẹ̀sùn/ìtọ́kasí tí πρός αὐτούς ní ní àyíká yìí.'
  naturalness: “Wọ́n ń wá a láti mú un” jẹ́ Yorùbá àdánidá, ó sì kedere. “Ó pa òwe náà sí wọn lórí” jẹ́ ìṣọ̀kan ọ̀rọ̀ Bíbélì Yorùbá tí ó bójú mu fún òwe tí ó dojú kọ́ wọn. Àmì ohùn àti ìforúkọsílẹ̀ gbolohun ni a pa mọ́ ní ìpele Yorùbá ìgbàlódé ọlọ́lá.
  terminology: A pa “òwe” mọ́ fún παραβολή, “ogunlọ́gọ̀” fún ὄχλος, àti “mú un” fún κρατῆσαι. “Sí wọn lórí” ṣàfihàn ìhà ìdojúkọ́/ìbáwí ti πρός αὐτούς láì sọ ju ohun tí ọ̀rọ̀ Gíríìkì dá lójú; àlàyé ìsàlẹ̀ sì ń pa àwọn ìtumọ̀ míràn mọ́.
