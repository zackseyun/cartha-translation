  to: Wọ́n sì ń wá a láti mú un, ṣùgbọ́n wọ́n bẹ̀rù ogunlọ́gọ̀ náà, nítorí wọ́n mọ̀ pé ó pa òwe náà sí wọn lórí.[a] Wọ́n sì fi í sílẹ̀, wọ́n sì lọ.
  rationale: A rọ́pò “ń wá ọ̀nà” pẹ̀lú “ń wá a” kí ẹni tí wọ́n fẹ́ mú náà hàn gẹ́gẹ́ bí αὐτόν. A tún rọ́pò “sí wọn lára” pẹ̀lú “sí wọn lórí,” èyí tí ó jẹ́ Yorùbá Bíbélì tó mọ́gbọ́n dání fún òwe tí a pa lòdì sí wọn. Àlàyé ìsàlẹ̀ ń ṣètọ́jú àìdánilójú ìtumọ̀ πρός αὐτούς.
