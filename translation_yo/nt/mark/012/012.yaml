id: MRK.12.12
reference: Mark 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: yo
  text: Wọ́n sì ń wá a láti mú un, ṣùgbọ́n wọ́n bẹ̀rù ogunlọ́gọ̀ náà, nítorí wọ́n mọ̀ pé ó pa òwe náà sí wọn lórí.[a] Wọ́n sì fi í sílẹ̀, wọ́n sì lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó pa òwe náà nípa wọn,” tàbí, “ó pa òwe náà sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: wọ́n ń wá ọ̀nà
  rationale: Àkókò imperfect fi ìgbìyànjú tí ó ń lọ lọ́wọ́ hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá láì sọ pé wọ́n ti ṣe é tán.
- source_word: κρατῆσαι
  choice: láti mú un
  rationale: Nínú àyíká yìí, ó túmọ̀ sí láti dì í mú tàbí láti gbá a; ‘mú un’ dúró sítòsí ìtumọ̀ náà láì fi ètò ìdájọ́ pàtó kún un.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: wọ́n bẹ̀rù ogunlọ́gọ̀ náà
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀ ní Yorùbá láti sọ pé ẹnì kan bẹ̀rù àwùjọ ènìyàn.
- source_word: ἔγνωσαν
  choice: wọ́n mọ̀
  rationale: ‘Mọ̀’ pa ìdánilójú ìṣàkíyèsí wọn mọ́ láì túmọ̀ rẹ̀ sí ‘wọ́n ṣẹ̀ṣẹ̀ rí i’.
- source_word: πρὸς αὐτοὺς
  choice: sí wọn lára
  rationale: Nínú àyíká ọ̀tá yìí, gbolohun Yorùbá náà fi hàn pé òwe náà kan àwọn fúnra wọn, ó sì ní agbára ìbáwí; àṣàyàn tí kò fi ìtakora hàn tó bẹ́ẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: τὴν παραβολὴν
  choice: òwe náà
  rationale: ‘Òwe’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó mọ́gbọ́n dání fún παραβολή níbi yìí, ‘náà’ sì tọ́ka sí èyí tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: εἶπεν
  choice: ó pa
  rationale: ‘Pa òwe’ jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá àdánidá fún sísọ òwe, ó sì bá παραβολή mu.
- source_word: ἀφέντες αὐτὸν
  choice: wọ́n fi í sílẹ̀
  rationale: Ó fi hàn pé wọ́n dáwọ́ ìgbìyànjú láti mú un dúró, wọ́n sì fi í sílẹ̀.
- source_word: ἀπῆλθον
  choice: wọ́n sì lọ
  rationale: Ìtumọ̀ Yorùbá tó rọrùn, tó sì bá ìṣípò nínú ìtàn mu.
theological_decisions:
- issue: Agbára ìtumọ̀ πρὸς αὐτοὺς
  choice: ó pa òwe náà sí wọn lára
  alternative: ó pa òwe náà nípa wọn / sí wọn
  rationale: Àyíká náà ṣe àtìlẹ́yìn fún ìtumọ̀ pé òwe náà dojú kọ wọ́n, ṣùgbọ́n πρός αὐτοὺς tún lè túmọ̀ sí pé ó ń tọ́ka sí wọn tàbí pé a sọ ọ́ sí wọn; àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé yé ni a lò. Gbólóhùn ‘pa òwe sí wọn lára’ jẹ́ àdánidá, ó sì mú agbára ọ̀rọ̀ inú àyíká náà jáde; àmì ohùn ni a fi sí ibi tí ó bá yẹ.
