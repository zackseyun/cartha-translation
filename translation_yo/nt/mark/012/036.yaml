id: MRK.12.36
reference: Mark 12:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: yo
  text: Dáfídì fúnra rẹ̀ sọ nínú Ẹ̀mí Mímọ́[a] pé, “Olúwa sọ fún Olúwa mi[b] pé, ‘Jókòó ní ọwọ́ ọ̀tún mi títí tí màá fi gbé àwọn ọ̀tá rẹ sí abẹ́ ẹsẹ̀ rẹ.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ẹ̀mí Mímọ́.”
    reason: alternative_reading
  - marker: b
    text: Àyọlò náà wá láti Sáàmù 110:1. Nínú ọ̀rọ̀ Hébérù, “Olúwa” àkọ́kọ́ dúró fún orúkọ Ọlọ́run (YHWH, tí a sábà máa ń túmọ̀ sí “OLÚWA”), ṣùgbọ́n èkejì ń tọ́ka sí olúwa Dáfídì.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Dáfídì fúnra rẹ̀
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ Dáfídì gẹ́gẹ́ bí ẹni tó sọ ọ̀rọ̀ náà; ‘fúnra rẹ̀’ mú ìtẹnumọ́ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: ‘Nínú’ tẹ̀ lé ἐν pẹ̀lú daatífù láì pinnu bóyá ọ̀rọ̀ náà túmọ̀ sí ipò tàbí ọ̀nà tí Ẹ̀mí fi mú Dáfídì sọ̀rọ̀.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος, ó sì pa àtúnsọ ọ̀rọ̀ kan náà mọ́ ní àyọlò náà.
- source_word: τῷ κυρίῳ μου
  choice: fún Olúwa mi
  rationale: Èyí pa àtúnsọ κύριος àti agbára ìjiyàn Jésù mọ́; ‘Olúwa mi’ tún jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì.
- source_word: Κάθου
  choice: Jókòó
  rationale: Àṣẹ yìí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá èdè ìjokòó lórí ìtẹ́ mu.
- source_word: ἐκ δεξιῶν μου
  choice: ní ọwọ́ ọ̀tún mi
  rationale: Èyí ni àṣà Yorùbá tó bá ìtumọ̀ gbolohun Gíríìkì náà mu fún ipò ọlá lẹ́gbẹ̀ẹ́ ẹni.
- source_word: ἕως ἂν θῶ
  choice: títí èmi yóò fi fi
  rationale: Gbolohun náà fi àkókò ọjọ́ iwájú hàn; fífi ‘èmi’ sí i tún pa ìtẹnumọ́ olùṣe mọ́ lọ́nà àdánidá.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sí abẹ́ ẹsẹ̀ rẹ
  rationale: Èyí dúró sún mọ́ ọ̀rọ̀ Mákù pé ‘abẹ́ ẹsẹ̀ rẹ,’ láì fi àwòrán ‘àpótí ìtìsẹ̀’ tí kò sí nínú ẹsẹ yìí kún un.
theological_decisions:
- issue: Ọ̀nà láti túmọ̀ gbólóhùn nípa ọ̀rọ̀ Dáfídì láti ọ̀dọ̀ Ẹ̀mí
  choice: Dáfídì fúnra rẹ̀ sọ nínú Ẹ̀mí Mímọ́
  alternative: Dáfídì fúnra rẹ̀ sọ nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: ‘Nínú Ẹ̀mí Mímọ́’ pa àìdánilójú tó wà nínú ἐν mọ́, ó sì jẹ́rìí sí ipa Ẹ̀mí Mímọ́ láì sọ èrò ìmísí kan pàtó ju ohun tí Gíríìkì sọ lọ.
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú àyọlò Sáàmù 110:1
  choice: Olúwa sọ fún Olúwa mi
  alternative: OLÚWA sọ fún Olúwa mi
  rationale: Nítorí κύριος kan náà ni Gíríìkì lò fún àwọn méjèèjì, àkọsílẹ̀ pàtàkì pa ‘Olúwa’ mọ́ ní ibì méjèèjì. Àlàyé ìyàtọ̀ tó wà nínú Hébérù wà ní àlàyé ìsàlẹ̀, kì í ṣe pé a fi í wọ Gíríìkì.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ; ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì àyọlò méjì láti fi ọ̀rọ̀ inú ọ̀rọ̀ hàn. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí ọkọọkan ń ṣàlàyé.
