  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: yo
  text: Ọ̀mọ̀wé òfin náà sì sọ fún un pé[a], “O sọ̀rọ̀ dáadáa, Olùkọ́. Lóòótọ́ ni o sọ pé òun jẹ́ ọ̀kan, kò sì sí ẹlòmíràn bí kò ṣe òun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ṣíṣe ohun tí àyíká túmọ̀ sí kedere sí i: “Ọlọ́run jẹ́ ọ̀kan.” Ọ̀rọ̀ Gíríìkì kàn sọ pé “òun jẹ́ ọ̀kan”; a mọ ẹni tí “òun” ń tọ́ka sí láti inú ọ̀rọ̀ tó ṣáájú.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: ọ̀mọ̀wé òfin
  rationale: Nínú àyíká àwọn Ìhìnrere, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó jẹ́ amòye nínú Òfin Mósè. “Ọ̀mọ̀wé òfin” jẹ́ èdè Yorùbá tó ṣe kedere sí òǹkàwé òde òní ju àyálò “akọ̀wé” lọ, èyí tí ó lè túmọ̀ sí ẹni tó kàn ń kọ̀wé.
- source_word: Καλῶς
  choice: O sọ dáadáa
  rationale: Ó fi ìtẹ́wọ́gbà ọ̀mọ̀wé òfin sí ọ̀rọ̀ Jésù hàn lọ́nà àdánidá ní Yorùbá.
- source_word: διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ fún ẹni tí ń kọ́ni.
- source_word: ἐπ’ ἀληθείας
  choice: Lóòótọ́ ni
  rationale: Gbólóhùn yìí ń fi ìjẹ́rìí sí òtítọ́ ọ̀rọ̀ Jésù; “Lóòótọ́ ni” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ adverbial náà mọ́.
- source_word: εἶπες
  choice: o sọ
  rationale: Aorist Gíríìkì náà tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; ìṣe àkókò tí ó rọrùn yìí bá ìjíròrò Yorùbá mu.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí Jésù sọ sílẹ̀, kì í ṣe ìdí tí ọ̀mọ̀wé òfin fi gbà á.
- source_word: εἷς ἐστιν
  choice: òun jẹ́ ọ̀kan
  rationale: Ọ̀rọ̀ Gíríìkì kò tún “Ọlọ́run” sọ ní kedere; “òun” pa kókó-ọ̀rọ̀ tí a lóye láti ẹsẹ tó ṣáájú mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: οὐκ ἔστιν ἄλλος
  choice: kò sì sí ẹlòmíràn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá láti sọ pé kò sí ẹlòmíràn.
- source_word: πλὴν αὐτοῦ
  choice: lẹ́yìn òun
  rationale: Nínú gbólóhùn yìí, “lẹ́yìn òun” túmọ̀ sí “yàtọ̀ sí òun/bí kò ṣe òun,” ó sì ń pa ìtumọ̀ ìyasọ́tọ̀ náà mọ́.
theological_decisions:
- issue: Olùṣe tí a kò dárúkọ ní εἷς ἐστιν
  choice: “òun jẹ́ ọ̀kan” ni a lò nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: “Ọlọ́run jẹ́ ọ̀kan” tàbí “Ọlọ́run kan ṣoṣo ni ó wà.”
  rationale: Àyíká ẹsẹ tó ṣáájú fi hàn pé Ọlọ́run ni a ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n ẹsẹ yìí kò tún θεός sọ. Ìtumọ̀ náà pa àkójọpọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ kí àyíká sọ ẹni tí “òun” ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A yan “ọ̀mọ̀wé òfin” gẹ́gẹ́ bí ìtumọ̀ iṣẹ́ ẹni náà dípò àyálò tí ó lè ṣókùnkùn.
