  to: Ọ̀mọ̀wé òfin náà sì sọ fún un pé[a], “O sọ̀rọ̀ dáadáa, Olùkọ́. Lóòótọ́ ni o sọ pé òun jẹ́ ọ̀kan, kò sì sí ẹlòmíràn bí kò ṣe òun.”
