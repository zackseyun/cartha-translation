source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mélòó kan, ó tún wọ Kápánáúmù, a sì gbọ́ pé ó wà ní ilé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ilé kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: ó wọ
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; ìṣètò gbolohun Yorùbá fi ìṣẹ̀lẹ̀ wíwọlé hàn lọ́nà àdánidá lábẹ́ ‘Lẹ́yìn ọjọ́ mélòó kan.’
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù padà wọ Kápánáúmù lẹ́ẹ̀kan sí i.
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: Àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú bí a ṣe ń pe e ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: δι’ ἡμερῶν
  choice: Lẹ́yìn ọjọ́ mélòó kan
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkókò ọjọ́ díẹ̀ tí kò ní iye pàtó; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἠκούσθη
  choice: a sì gbọ́
  rationale: A lo ọ̀nà aláìsọ ẹni pàtó tí Yorùbá máa ń lò láti ṣàfihàn pé ìròyìn náà tàn ká, láìfi ẹni tó gbọ́ ọ sí iwájú.
- source_word: ἐν οἴκῳ
  choice: ní ilé
  rationale: 'Ó pa àìdájú Gíríìkì mọ́: ó lè túmọ̀ sí ‘ní ilé’ tàbí, ní àyíká kan, ‘ní ilé tirẹ̀.’'
- source_word: ἐστίν
  choice: ó wà
  rationale: Yorùbá kò nílò ìpadà-àkókò bí ti Gẹ̀ẹ́sì; ‘ó wà’ bá ọ̀rọ̀ tí a gbọ́ mu lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá ἐν οἴκῳ túmọ̀ sí ilé kan lápapọ̀ tàbí ilé tí a mọ̀ sí ibùgbé rẹ̀.
  choice: ní ilé
  alternative: ní ilé rẹ̀
  rationale: ‘Ní ilé’ sún mọ́ ẹ̀rí Gíríìkì, ó sì yẹra fún fífi hàn dájú pé ilé Jésù fúnra rẹ̀ ni, nígbà tí ọ̀rọ̀ náà kò sọ bẹ́ẹ̀ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan ìṣètò gbolohun tó rọrùn fún òǹkàwé, ṣùgbọ́n a pa àìdájú ἐν οἴκῳ mọ́ nípasẹ̀ àkọ́kọ́ ‘ní ilé’ àti àlàyé ìsàlẹ̀.
