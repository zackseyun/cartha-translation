id: MRK.2.9
reference: Mark 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: yo
  text: 'Èwo ni ó rọrùn jù: láti sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé, ‘A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́,’[a] tàbí láti sọ pé, ‘Dìde, gbé àkéte rẹ, kí o sì rìn’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà tún lè tẹnumọ́ ipò ìdáríjì tí ó wà ní ìsinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Èwo ni ó rọrùn jù
  rationale: Ó fi ìfiwéra inú εὐκοπώτερον hàn ní Yorùbá àdánidá láìfi àlàyé kún un.
- source_word: εἰπεῖν
  choice: láti sọ
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ tí ó ń ṣí àsọyé tààrà sílẹ̀, ó sì bá àwọn apá méjèèjì mu.
- source_word: τῷ παραλυτικῷ
  choice: fún ọkùnrin arọ náà
  rationale: ‘Ọkùnrin arọ’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti tọ́ka sí ẹni tí àìsàn rọ, láìlo ọ̀rọ̀ ìṣègùn líle.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Ìtúmọ̀ yìí jẹ́ ìkéde aláìlórúkọ olùṣe, ó sì fi ipò ìdáríjì tí ó ti wà hàn ní Yorùbá àdánidá. Àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ àsìkò ìsinsìnyí hàn.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká ẹ̀kọ́ Ọlọ́run mu láìfikún àwòrán gbèsè tàbí ẹ̀ṣẹ̀ sí ẹlòmíràn.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: Àṣẹ Yorùbá kúkúrú, àdánidá ni fún ẹni tí ó dùbúlẹ̀ láti dìde.
- source_word: ἆρον
  choice: gbé
  rationale: Ní àyíká yìí, ó túmọ̀ sí gbígbé ohun náà sókè láti mú un lọ; ‘gbé’ sọ èyí ní ṣókí.
- source_word: τὸν κράβαττόν σου
  choice: àkéte rẹ
  rationale: ‘Àkéte’ ń sọ ohun ìtẹ́lẹ̀ tí kò wúwo, tí ẹni lè gbé kiri; ó péye ju ibùsùn ńlá tàbí ohun ìgbé aláìsàn lọ.
- source_word: περιπάτει
  choice: kí o sì máa rìn
  rationale: ‘Máa rìn’ mú agbára àṣẹ ìsinsìnyí hàn ní Yorùbá àdánidá, nígbà tí ‘kí o sì’ so ó mọ́ àwọn àṣẹ tó ṣáájú.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìkéde ìdáríjì
  choice: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  alternative: A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Àṣàyàn náà pa ìkéde aláìlórúkọ olùṣe mọ́, ó sì jẹ́ kí ipò ìdáríjì tí gbolóhùn Gíríìkì lè tẹnumọ́ hàn. Kò sọ ẹni tí ó ṣe ìdáríjì ní pàtó, bẹ́ẹ̀ ni kò yanjú ìforígbárí ìtàn nípa àṣẹ Jésù láti dárí ẹ̀ṣẹ̀ jì.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
