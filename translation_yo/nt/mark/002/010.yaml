id: MRK.2.10
reference: Mark 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: yo
  text: Ṣùgbọ́n kí ẹ̀yin lè mọ̀ pé Ọmọ Ènìyàn[a] ní àṣẹ lórí ilẹ̀ ayé láti dárí ẹ̀ṣẹ̀ jì—ó sọ fún ọkùnrin tí ó rọ̀ náà[b] pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni tí í ṣe Ènìyàn.” Àkọlé Gíríìkì náà lè ní ìtumọ̀ tó jẹ mọ́ jíjẹ́ ènìyàn, ó sì tún lè tọ́ka sí Daniẹli 7.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó sọ fún arọ náà pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Ṣùgbọ́n kí
  rationale: “Ṣùgbọ́n” fi ìyípadà ọ̀rọ̀ tí δέ mú wá hàn, “kí” sì ṣàfihàn ète tí ἵνα ní.
- source_word: εἰδῆτε
  choice: ẹ̀yin lè mọ̀
  rationale: Èyí túmọ̀ ìmọ̀ tí iṣẹ́ ìwòsàn tí ń bọ̀ yóò jẹ́rìí sí; lílo “ẹ̀yin” mú ẹni púpọ̀ tí ọ̀rọ̀ náà ń tọ́ka sí hàn kedere.
- source_word: ἐξουσίαν ἔχει
  choice: ní àṣẹ
  rationale: “Àṣẹ” ní ìtumọ̀ ẹ̀tọ́ àti agbára tó bófin mu, kì í ṣe agbára láti ṣe nǹkan lásán.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Àkọlé yìí pa ọ̀nà ìṣọ̀rọ̀ nípa ẹ̀dá ènìyàn àti ìtọ́kasí tó ṣeé ṣe sí Daniẹli 7 mọ́, láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Gbólóhùn yìí tọ́ka sí agbègbè ilẹ̀ ayé, ó sì lè dúró ní ìyàtọ̀ sí ọ̀run.
- source_word: ἀφιέναι ἁμαρτίας
  choice: láti dárí ẹ̀ṣẹ̀ jì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti kedere fún ìdáríjì ẹ̀ṣẹ̀.
- source_word: λέγει τῷ παραλυτικῷ
  choice: ó sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé
  rationale: Àpèjúwe yìí ṣe kedere sí òǹkàwé òde òní, ó sì pa ẹni tí παραλυτικός ń tọ́ka sí mọ́. “Ó sọ” lè ṣiṣẹ́ ní àlàyé ìtàn láìfi àsìkò ọ̀rọ̀ Gíríìkì hàn ní ọ̀nà tí kò bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ àkọlé ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí í ṣe Ènìyàn
  rationale: A pa àkọlé náà mọ́ láti gba ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ nípa ẹ̀dá ènìyàn àti ìtọ́kasí tó ṣeé ṣe sí Daniẹli 7 láàyè, láìyanju ìjiyàn ẹ̀kọ́ nípa rẹ̀ sínú ìtumọ̀.
- issue: Ìtumọ̀ ἐξουσία nípa dídárí ẹ̀ṣẹ̀ jì
  choice: àṣẹ
  alternative: agbára; ẹ̀tọ́
  rationale: Ọ̀rọ̀ inú àyíká yìí dá lórí ẹ̀tọ́ àti ọlá-àṣẹ láti dárí ẹ̀ṣẹ̀ jì, kì í ṣe agbára láti ṣe iṣẹ́ kan nìkan.
translation_notes:
  register: Yorùbá àṣàkọsílẹ̀, ọlọ́lá, tí ó sì yé òǹkàwé òde òní ni a lò. A yan “ọkùnrin tí ara rẹ̀ rọ” dípò ọ̀rọ̀ ìṣègùn tàbí ọ̀rọ̀ àtijọ́ tí kò rọrùn; àmì ìdádúró gígùn pa ìfọ̀rọ̀wérọ̀ tí kò tíì parí mọ́ bí ó ṣe rí nínú orísun.
