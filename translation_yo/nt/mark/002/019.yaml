source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: yo
  text: Jésù sì wí fún wọn pé, “Ṣé àwọn àlejò ìgbéyàwó[a] lè gbààwẹ̀ nígbà tí ọkọ ìyàwó wà pẹ̀lú wọn? Níwọ̀n ìgbà tí wọ́n bá ní ọkọ ìyàwó náà pẹ̀lú wọn, wọn kò lè gbààwẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọ gbọ̀ngàn ìgbéyàwó” tàbí “àwọn ọmọ iyàrá ìgbéyàwó”; èyí jẹ́ àṣà-ọ̀rọ̀ fún àwọn tó ń kópa nínú ayẹyẹ ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: kò lè gbààwẹ̀ ... àbí wọ́n lè ṣe bẹ́ẹ̀?
  rationale: Μή pẹ̀lú ọ̀rọ̀-ìṣe atọ́ka ṣe ìbéèrè àtakò tí ó retí ìdáhùn òdì. Ìtumọ̀ yìí mú ìbéèrè náà jáde ní Yorùbá àdánidá láì sọ ọ́ di gbólóhùn lasán.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: àwọn àlejò ìgbéyàwó
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘àwọn ọmọ gbọ̀ngàn/iyàrá ìgbéyàwó,’ ṣùgbọ́n ó jẹ́ àṣà-ọ̀rọ̀ fún àwọn tí wọ́n ń kópa nínú ayẹyẹ ìgbéyàwó. ‘Àwọn àlejò ìgbéyàwó’ ṣe kedere, ó sì yẹra fún dídín ẹgbẹ́ náà kù sí àwọn ọ̀rẹ́ ọkọ ìyàwó nìkan.
- source_word: ἐν ᾧ ... ἐστιν
  choice: nígbà tí ... bá wà pẹ̀lú wọn
  rationale: Ìtumọ̀ ọ̀rọ̀-ìsopọ̀ náà jẹ́ ti àkókò níbí; ‘nígbà tí’ jẹ́ Yorùbá àdánidá.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún bridegroom, ó sì pa àwòrán àfiwé inú ẹsẹ náà mọ́.
- source_word: μετ’ αὐτῶν
  choice: pẹ̀lú wọn
  rationale: Μετά pẹ̀lú genitive fi ìbágbépọ̀ hàn; ‘pẹ̀lú wọn’ ni ìtumọ̀ tààrà tí ó sì jẹ́ àdánidá.
- source_word: ὅσον χρόνον
  choice: ní gbogbo ìgbà tí
  rationale: Gbólóhùn náà tọ́ka sí gbogbo gígùn àkókò kan; ‘ní gbogbo ìgbà tí’ mú ìtẹnumọ́ iye àkókò náà hàn.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: ọkọ ìyàwó bá wà pẹ̀lú wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé Giriki lo ‘wọ́n ní ọkọ ìyàwó pẹ̀lú wọn,’ Yorùbá àdánidá ń sọ pé ẹni náà ‘wà pẹ̀lú wọn.’ Èyí pa ìtumọ̀ ìbágbépọ̀ mọ́ láì dá gbolohun tí kò wọ́pọ̀.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sì wí fún wọn pé
  rationale: Ìṣílẹ̀ ìtàn tó bójú mu, tó ní iyì, tí ó sì ṣàn ní Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ Jésù nípasẹ̀ àfiwé ọkọ ìyàwó
  choice: Pa àfiwé ‘ọkọ ìyàwó’ mọ́ láì ṣàlàyé ẹni tí ó dúró fún nínú ẹsẹ náà.
  alternative: Túmọ̀ ọ́ ní ọ̀nà àlàyé tí yóò sọ ní tààrà pé Jésù ni ọkọ ìyàwó tàbí tẹnumọ́ ìtumọ̀ Mèsáyà.
  rationale: Jésù fi àwòrán ọkọ ìyàwó tọ́ka sí ara rẹ̀, ṣùgbọ́n ẹsẹ náà kò ṣe àlàyé ẹ̀kọ́ ní kíkún. Ìtumọ̀ náà yẹ kí ó pa àwòrán àti àìfọ̀rọ̀mọ́lẹ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘gbààwẹ̀’ fún νηστεύειν àti ‘ọkọ ìyàwó’ láti pa àwòrán orísun mọ́.
