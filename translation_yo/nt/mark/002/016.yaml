id: MRK.2.16
reference: Mark 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: yo
  text: Àwọn akọ̀wé tí ó wà lára àwọn Farisí rí i pé ó ń bá àwọn ẹlẹ́ṣẹ̀ àti àwọn agbowó-ori jẹun.[a] Wọ́n sì ń sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Èé ṣe tí ó fi ń bá àwọn agbowó-ori àti àwọn ẹlẹ́ṣẹ̀ jẹun?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀nà ìtumọ̀ tí ó túbọ̀ ṣàlàyé, “ó ń bá àwọn agbowó-ori àti àwọn ẹlẹ́ṣẹ̀ pín oúnjẹ.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “jẹun pẹ̀lú,” èyí tí ó túmọ̀ sí ìbáṣepọ̀ níbi oúnjẹ nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà fún àwọn amòye nípa kíkọ àti Òfin nínú àyíká àwọn Ìhìn Rere; kò sì fi àlàyé iṣẹ́ wọn tí ó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ kún un.
- source_word: τῶν Φαρισαίων
  choice: tí ó wà lára àwọn Farisí
  rationale: Ọ̀rọ̀ yìí fi ìbáṣepọ̀ tàbí jíjẹ́ ọ̀kan lára ẹgbẹ́ àwọn Farisí hàn, láìfi dandan pinnu pé gbogbo àwọn akọ̀wé náà jẹ́ Farisí ní ọ̀nà kan náà.
- source_word: ἰδόντες
  choice: rí i pé
  rationale: 'Ó sọ ìṣẹ̀lẹ̀ tí ó ṣáájú ọ̀rọ̀ wọn ní Yorùbá àdánidá: wọ́n rí ohun tí Jésù ń ṣe.'
- source_word: ὅτι ἐσθίει
  choice: pé ó ń ... jẹun
  rationale: Àmì “ń” mú ìṣe tí ó ń lọ lọ́wọ́ nínú ìtàn náà hàn, gẹ́gẹ́ bí imperfect ἐσθίει.
- source_word: μετὰ
  choice: bá ... jẹun
  rationale: Ìlò ọ̀rọ̀-ìṣe “bá ... jẹun” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ jíjẹun pẹ̀lú ẹlòmíràn, ó sì pa ìtumọ̀ ìbáṣepọ̀ níbi tábìlì mọ́.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí pa agbára orúkọ ìdámọ̀ ẹ̀sìn àti ti àwùjọ tí ó wà nínú ọ̀rọ̀ Gíríìkì mọ́, láìrọ̀ ọ́.
- source_word: τελωνῶν
  choice: àwọn agbowó-ori
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó yé kedere fún àwọn tí ń gba owó orí tàbí owó ìjọba, ẹgbẹ́ tí àwọn ènìyàn kórìíra ní àyíká ìtàn náà.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àmì “ń” pa ìrísí ìṣe tí ó ń bá a lọ tàbí tí a ń tún ṣe nínú imperfect mọ́.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ìtumọ̀ Yorùbá tí a mọ̀ dáadáa fún μαθηταί, ó sì pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ mọ́.
- source_word: Ὅτι
  choice: Èé ṣe tí ... fi
  rationale: Nínú ìbéèrè yìí, ὅτι ń mú ẹ̀sùn tí ó dà bí ìbéèrè wọlé; “Èé ṣe tí ... fi” ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἐσθίει
  choice: ń ... jẹun
  rationale: Àmì ìṣe tí ó ń lọ lọ́wọ́ tún lè tọ́ka sí ohun tí Jésù sábà ń ṣe; Yorùbá yìí pa àyè méjèèjì sílẹ̀.
theological_decisions:
- issue: Agbára ti àwùjọ àti ti ẹ̀sìn nínú jíjẹun pọ̀
  choice: A sọ ẹ̀sùn náà ní tààrà pé Jésù “ń bá àwọn ẹlẹ́ṣẹ̀ àti àwọn agbowó-ori jẹun.”
  alternative: A lè sọ ọ́ ní ìtumọ̀ gbígbòòrò pé ó “ń bá wọn pín oúnjẹ àti ìbáṣepọ̀ tábìlì.”
  rationale: Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀ lasan fún “jẹun” pẹ̀lú “pẹ̀lú”; ìtumọ̀ yìí jẹ́ kí ìtàn fúnra rẹ̀ fi ìjìnlẹ̀ ìbáṣepọ̀ àti ẹ̀sùn náà hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: 'A lo Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, àti àmì ohùn níbi tí ó bá yẹ. “Àwọn akọ̀wé” pa àwòrán ìtàn ayé ìgbà náà mọ́; “àwọn agbowó-ori” sì jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye. A pa ìtòlẹ́sẹẹsẹ ẹgbẹ́ méjèèjì mọ́ gẹ́gẹ́ bí Gíríìkì: “ẹlẹ́ṣẹ̀ àti agbowó-ori” ní ìbẹ̀rẹ̀, “agbowó-ori àti ẹlẹ́ṣẹ̀” nínú ìbéèrè.'
