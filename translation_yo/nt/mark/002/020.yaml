id: MRK.2.20
reference: Mark 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọjọ́ yóò dé nígbà tí a ó mú ọkọ ìyàwó kúrò lọ́dọ̀ wọn; nígbà náà ni wọn yóò sì gbààwẹ̀ ní ọjọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “ní ọjọ́ yẹn.” Gbólóhùn Gíríìkì náà jẹ́ ẹyọ—“ní ọjọ́ náà”—kì í ṣe “ní àwọn ọjọ́ náà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ṣùgbọ́n àwọn ọjọ́ yóò dé
  rationale: Èyí pa àfiwé ìtakora δέ mọ́ pẹ̀lú “Ṣùgbọ́n,” ó sì tú ọ̀rọ̀ àpẹẹrẹ Gíríìkì náà sí Yorùbá àdánidá láì sọ àwọn ọjọ́ náà di ohun tí a ti dárúkọ tẹ́lẹ̀.
- source_word: ὅταν
  choice: nígbà tí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú kan, kì í ṣe ohun tí ń ṣẹlẹ̀ léraléra.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: a ó mú ... kúrò lọ́dọ̀ wọn
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe mọ́, ó fi ìyapa hàn, kò sì sọ ẹni tó ṣe é tàbí ọ̀nà tí yóò gbà ṣẹlẹ̀ ní pàtó.
- source_word: ὁ νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àkàwé ẹni tó ń fẹ́ ìyàwó mọ́, láì fi Jésù rọ́pò àkàwé náà nínú ẹsẹ yìí.
- source_word: καὶ τότε
  choice: nígbà náà ni ... sì
  rationale: Ètò yìí jẹ́ àdánidá ní Yorùbá, ó sì tẹnu mọ́ pé ààwẹ̀ náà yóò tẹ̀ lé mímú ọkọ ìyàwó kúrò.
- source_word: νηστεύσουσιν
  choice: wọn yóò gbààwẹ̀
  rationale: “Gbààwẹ̀” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ìṣe ẹ̀sìn náà mọ́.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ní ọjọ́ náà
  rationale: Èyí pa nọ́ńbà ẹyọ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
theological_decisions:
- issue: Dídá Jésù mọ̀ gẹ́gẹ́ bí ọkọ ìyàwó nínú àkàwé
  choice: A pa “ọkọ ìyàwó” mọ́ gẹ́gẹ́ bí àkàwé láì sọ ní tààrà pé Jésù ni.
  alternative: “nígbà tí a ó mú mi kúrò lọ́dọ̀ wọn”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ń tọ́ka sí ara rẹ̀, ṣùgbọ́n Gíríìkì lo àkàwé náà; pípa á mọ́ ń dáàbò bo agbára lítíréṣọ̀ àti ti ẹ̀kọ́ ìgbàgbọ́ rẹ̀.
- issue: Irú mímú ọkọ ìyàwó kúrò
  choice: A lo ọ̀nà àìṣe “a ó mú ... kúrò” láì sọ ẹni tó ṣe é tàbí pé ikú lórí àgbélébùú ni.
  alternative: “a ó mú ọkọ ìyàwó kúrò lọ́dọ̀ wọn nípasẹ̀ ikú”
  rationale: Ẹsẹ náà lè máa tọ́ka sí ikú Jésù tó ń bọ̀, ṣùgbọ́n kò sọ aṣojú tàbí ọ̀nà mímú un kúrò ní pàtó; ìtumọ̀ náà pa àìsọtán yìí mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó yé òǹkàwé òde òní. Àmì ohùn kún ibi tí ó yẹ. Àmì àárín gbólóhùn ṣèrànwọ́ láti ya ìṣẹ̀lẹ̀ mímú ọkọ ìyàwó kúrò sí ọ̀dọ̀ àbájáde rẹ̀.
