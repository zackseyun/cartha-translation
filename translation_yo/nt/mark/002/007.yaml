source:
  edition: SBLGNT
  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: yo
  text: “Èé ṣe tí ọkùnrin yìí fi ń sọ̀rọ̀ báyìí? Ó ń sọ̀rọ̀-òdì sí Ọlọ́run! Ta ni ó lè dárí ẹ̀ṣẹ̀ jì bí kò ṣe Ọlọ́run nìkan?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, “Kí ni ọkùnrin yìí ń sọ̀rọ̀ báyìí?” Àṣà ọ̀rọ̀ Gíríìkì níbí túmọ̀ sí, “Èé ṣe tí ọkùnrin yìí fi ń sọ̀rọ̀ báyìí?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí kò ṣe Ọlọ́run kan ṣoṣo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ Τί ... λαλεῖ, ìbéèrè náà ń béèrè ìdí tí ó fi ń sọ̀rọ̀ bẹ́ẹ̀, kì í ṣe ohun tí ó sọ; “Èé ṣe” ni Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí Jésù pẹ̀lú ìjìnnà inú ọ̀rọ̀. “Ọkùnrin yìí” jẹ́ kedere láìfi ẹ̀gàn tí ó ju ti Gíríìkì lọ kún un.
- source_word: οὕτως λαλεῖ
  choice: ń sọ̀rọ̀ báyìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì pa àtakò wọn sí irú ọ̀rọ̀ Jésù mọ́.
- source_word: βλασφημεῖ
  choice: Ó ń sọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Gbólóhùn yìí fi ẹ̀sùn ìsọ̀rọ̀-òdì tí ó ní ìwúwo ẹ̀sìn hàn, ó sì jẹ́ kí àkókò ìṣe tí ń lọ lọ́wọ́ farahàn.
- source_word: τίς δύναται
  choice: Ta ni ó lè
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè nípa agbára tàbí àṣẹ láti ṣe ohun kan.
- source_word: ἀφιέναι ἁμαρτίας
  choice: dárí ẹ̀ṣẹ̀ jì
  rationale: Nínú àyíká yìí, ἀφίημι pẹ̀lú ἁμαρτίας túmọ̀ sí fífi ẹ̀ṣẹ̀ jì; “dárí ẹ̀ṣẹ̀ jì” ni gbólóhùn Yorùbá tí ó ṣe kedere jù.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: bí kò ṣe Ọlọ́run nìkan
  rationale: Ìkọ́lé náà ń fi ẹni kan ṣoṣo yà sọ́tọ̀. “Bí kò ṣe Ọlọ́run nìkan” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ pé Ọlọ́run nìkan ni wọ́n ní lọ́kàn mọ́.
theological_decisions:
- issue: Bóyá kí a fi ẹ̀gàn púpọ̀ sí οὗτος
  choice: ọkùnrin yìí
  alternative: ẹni yìí; ọkùnrin burúkú yìí
  rationale: Àtakò àwọn akọ̀wé hàn gbangba, ṣùgbọ́n a kò gbọ́dọ̀ mú ẹ̀gàn náà le ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- issue: Ìwúwo ẹ̀sùn βλασφημεῖ
  choice: Ó ń sọ̀rọ̀-òdì sí Ọlọ́run!
  alternative: Ó ń sọ̀rọ̀ ẹ̀gàn sí Ọlọ́run!; Ọ̀rọ̀-òdì ni èyí!
  rationale: Àṣàyàn yìí pa ìdájọ́ ẹ̀sìn àwọn akọ̀wé mọ́, láìdáhùn fún òǹkàwé bóyá ẹ̀sùn wọn tọ́; nípa bẹ́ẹ̀, ìforígbárí inú ìtàn ṣì dúró.
- issue: Ìtumọ̀ εἷς ὁ θεός
  choice: Ọlọ́run nìkan
  alternative: Ọlọ́run kan ṣoṣo náà
  rationale: Àkọ́kọ́ fi ìyàsọ́tọ̀ hàn ní Yorùbá àdánidá; àyípadà kejì pa seese ìtumọ̀ “Ọlọ́run kan ṣoṣo” mọ́, ṣùgbọ́n ó le dun bí ìtẹnumọ́ ẹ̀kọ́ ìgbàgbọ́ ju bí gbolohun inú ìtàn lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “sọ̀rọ̀-òdì sí Ọlọ́run” láti pa ìwúwo ẹ̀sùn náà mọ́ láìfi èrò ẹ̀sìn ẹ̀ka kan kún ọ̀rọ̀.
