  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ̀yin kò ha tíì kà rí ohun tí Dáfídì ṣe nígbà tí ó wà nínú àìní, tí ebi sì pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: ó ṣe aláìní
  rationale: Ó fi ipò àìní Dáfídì hàn ní ọ̀nà Yorùbá tó ṣe déédé pẹ̀lú orísun, láì dín un kù sí ebi nìkan.
- source_word: ἐπείνασεν
  choice: ebi sì pa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún jíjẹ́ ẹni tí ebi ń pa, ó sì pa ìyàtọ̀ mọ́ láàárín àìní àti ebi.
- source_word: οἱ μετ’ αὐτοῦ
  choice: àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ tààrà tó sì ṣe kedere fún àwọn ẹlẹgbẹ́ Dáfídì.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Ẹ̀yin kò ha tíì kà rí
  rationale: Àbéèrè olóhùn ìbáwí ni Gíríìkì; ẹ̀ka ‘kò ha’ mú ìrísí àbéèrè náà jáde ní Yorùbá tó níyì.
theological_decisions: []
