- from: Ó sì wí fún wọn pé, “Ẹ̀yin kò ha tíì kà rí ohun tí Dáfídì ṣe nígbà tí ó ṣe aláìní, tí ebi sì pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀?”
  to: Ó sì wí fún wọn pé, “Ẹ̀yin kò ha tíì kà rí ohun tí Dáfídì ṣe nígbà tí ó wà nínú àìní, tí ebi sì pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀?”
