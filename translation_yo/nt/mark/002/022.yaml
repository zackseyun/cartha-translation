  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: yo
  text: Kò sì sí ẹni tí ń fi wáìnì tuntun sínú àwọn àpò awọ fún wáìnì tí ó ti gbó. Bí bẹ́ẹ̀ kọ́, wáìnì náà yóò ya àwọn àpò awọ náà; wáìnì náà yóò sì bàjẹ́[a], bẹ́ẹ̀ ni àwọn àpò awọ náà pẹ̀lú. Ṣùgbọ́n wáìnì tuntun yẹ fún àwọn àpò awọ tí ó ṣì tuntun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wáìnì náà yóò ṣòfò.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn àpò awọ tuntun.” A lo “tí ó ṣì tuntun” láti fi ìtumọ̀ tuntun ní ipò tàbí dídára hàn, ní ìyàtọ̀ sí “tí ó ti gbó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: fi … sínú
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ohun kan sí ibì kan ní gbogbogbòò. “Fi … sínú” jẹ́ èdè Yorùbá àdánidá ní àyíká yìí, ó sì yẹra fún fífi ìtumọ̀ pàtó bí “da” kún ọ̀rọ̀ náà.
- source_word: οἶνον νέον
  choice: wáìnì tuntun
  rationale: Èyí pa àkójọpọ̀ orúkọ àti ajẹtífù Gíríìkì mọ́, ó sì tọ́ka sí wáìnì tí a ṣẹ̀ṣẹ̀ ṣe, tí ó ṣì lè máa ru.
- source_word: ἀσκούς
  choice: àwọn àpò awọ fún wáìnì
  rationale: Àwọn ohun èlò awọ ẹranko tí a fi ń kó wáìnì ni ọ̀rọ̀ náà ń tọ́ka sí. Gbólóhùn yìí ṣàlàyé àwòrán àṣà náà kedere fún òǹkàwé Yorùbá òde òní.
- source_word: παλαιούς
  choice: tí ó ti gbó
  rationale: “Tí ó ti gbó” jẹ́ ọ̀nà àdánidá láti sọ pé àwọn àpò náà ti di àtijọ́, ó sì pa ìyàtọ̀ wọn sí àwọn àpò tuntun mọ́ láì fi ìtumọ̀ “tí ó ti bàjẹ́ pátápátá” kún un.
- source_word: ῥήξει
  choice: yóò ya
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí agbára wáìnì tí ń ru ṣe máa ya àpò awọ. “Yóò ya” jẹ́ kedere, ó sì bá ohun èlò tí a fi awọ ṣe mu ju “yóò fọ́” lọ.
- source_word: ἀπόλλυται
  choice: yóò bàjẹ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà lè túmọ̀ sí pé wáìnì náà bàjẹ́ tàbí pé ó ṣòfò. “Yóò bàjẹ́” sọ àbájáde náà ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn mọ́.
- source_word: καινούς
  choice: tí ó ṣì tuntun
  rationale: Gbólóhùn yìí fi ìtumọ̀ tuntun ní ipò tàbí dídára hàn, ó sì yà á díẹ̀ sí νέον, bí Gíríìkì ṣe ṣe, láì lo èdè tí kò wọ́pọ̀.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Ṣùgbọ́n wáìnì tuntun yẹ fún àwọn àpò awọ tí ó ṣì tuntun
  rationale: Gbólóhùn Gíríìkì náà kò ní ọ̀rọ̀-ìṣe ní gbangba. “Yẹ fún” pa ìrísí òwe àti ìlànà gbogbogbòò mọ́ láì sọ ọ́ di àṣẹ tí orísun kò sọ ní tààrà.
theological_decisions:
- issue: Ìwà gbólóhùn ìparí tí ọ̀rọ̀-ìṣe kò hàn nínú rẹ̀
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìlànà gbogbogbòò: “wáìnì tuntun yẹ fún àwọn àpò awọ tí ó ṣì tuntun.”'
  alternative: “A gbọ́dọ̀ fi wáìnì tuntun sínú àwọn àpò awọ tuntun” tàbí “ènìyàn a máa fi wáìnì tuntun sínú àwọn àpò awọ tuntun.”
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ nínú gbólóhùn ìparí. Yíyan gbólóhùn ìlànà pa kúkúrú àti agbára òwe náà mọ́, kò sì fi àṣẹ tí kò hàn gbangba sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. “Àpò awọ fún wáìnì” ṣàlàyé ohun èlò àṣà náà láì pa àwòrán inú òwe rẹ́.
