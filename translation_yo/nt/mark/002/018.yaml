id: MRK.2.18
reference: Mark 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn Jòhánù àti àwọn Farisí ń gbààwẹ̀ nígbà náà. Wọ́n sì wá, wọ́n sọ fún un[a] pé, “Kí ló dé tí àwọn ọmọ-ẹ̀yìn Jòhánù àti àwọn ọmọ-ẹ̀yìn àwọn Farisí fi ń gbààwẹ̀, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ kì í gbààwẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “àwọn ènìyàn wá, wọ́n sì sọ fún un.” Èdè Gíríìkì kò sọ ẹni tí ó ṣe “wá” àti “sọ” ní gbangba.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: ń gbààwẹ̀
  rationale: Àkópọ̀ imperfect εἰμί àti present participle ń fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò ìtàn hàn. “Ń gbààwẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí ó ń tẹ̀ síwájú; àyíká ìtàn ló fi hàn pé ó ṣẹlẹ̀ ní àkókò àtijọ́.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: àwọn ọmọ-ẹ̀yìn Jòhánù
  rationale: Ó ṣàfihàn ìbáṣepọ̀ àwọn akẹ́kọ̀ọ́ pẹ̀lú Jòhánù ní ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: “Farisí” ni àkọsílẹ̀ orúkọ ẹgbẹ́ náà tí ó ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: wọ́n sì wá, wọ́n sọ fún un
  rationale: Àwọn ọ̀rọ̀-ìṣe yìí jẹ́ historical presents nínú ìtàn Máàkù. Àtẹ̀lé “wọ́n sì wá, wọ́n sọ” jẹ́ Yorùbá àdánidá, ó sì pa ìgbésẹ̀ méjèèjì mọ́ láì sọ ẹni tí “wọ́n” jẹ́ ní pàtó.
- source_word: Διὰ τί
  choice: Kí ló dé tí ... fi
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún ìdí ohun kan, ó sì bá “nítorí kí ni” ti Gíríìkì mu.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: àwọn ọmọ-ẹ̀yìn àwọn Farisí
  rationale: Ó pa ìbáṣepọ̀ genitive mọ́, ó sì yà àwọn ọmọ-ẹ̀yìn ẹgbẹ́ náà sọ́tọ̀ kedere.
- source_word: νηστεύουσιν
  choice: ń gbààwẹ̀ / kì í gbààwẹ̀
  rationale: Nínú ìbéèrè náà, present tense lè tọ́ka sí àṣà tí wọ́n máa ń ṣe, kì í ṣe dandan ohun tí wọ́n ń ṣe ní ìṣẹ́jú náà. “Ń gbààwẹ̀” àti ìkọ̀ rẹ̀ “kì í gbààwẹ̀” mú ìyàtọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ
  rationale: “Ṣùgbọ́n” mú ìtakora δέ hàn, “rẹ” sì ṣàfihàn agbára possessive σοὶ ní ṣókí.
theological_decisions:
- issue: Ta ni ó wá, tí ó sì sọ fún Jésù?
  choice: A lo “Wọ́n” láì dárúkọ ẹgbẹ́ kankan ní pàtó.
  alternative: A lè sọ pé “àwọn ènìyàn kan wá, wọ́n sì sọ fún un,” tàbí kí a sọ pé àwọn ọmọ-ẹ̀yìn Jòhánù àti àwọn Farisí ni.
  rationale: Gíríìkì kò sọ subject fún ἔρχονται àti λέγουσιν ní gbangba. Dídárúkọ ẹgbẹ́ kan ní pàtó yóò fi ìtumọ̀ tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò múlẹ̀ kún un; nítorí náà a pa àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì rọrùn fún òǹkàwé gbogbo. A fi àmì ohùn sí ibi tí ó yẹ. “Gbààwẹ̀” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fasting; “ọmọ-ẹ̀yìn” sì jẹ́ ọ̀rọ̀ tí ó fìdí múlẹ̀ fún disciple. Àtẹ̀lé àwọn gbólóhùn pa ìṣàn ìtàn Máàkù mọ́ láì fi àsọyé ẹ̀kọ́ ìsìn kan kún un.
