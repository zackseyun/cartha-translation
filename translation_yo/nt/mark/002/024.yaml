id: MRK.2.24
reference: Mark 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: yo
  text: Àwọn Farisí sì ń sọ fún un pé, “Wò ó, èé ṣe tí wọ́n fi ń ṣe ohun tí kò bófin mu ní ọjọ́ ìsinmi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wò ó, kí ni wọ́n ń ṣe ní ọjọ́ ìsinmi tí kò bófin mu?” A lè ka τί Gíríìkì náà sí “kí ni,” bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ yìí ó ṣeé ṣe kó túmọ̀ sí “èé ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tó wọ́pọ̀ ní Yorùbá; ó ń tẹ̀síwájú láìfi ìtumọ̀ àkókò kún ọ̀rọ̀ náà.
- source_word: οἱ Φαρισαῖοι
  choice: Àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ní ìtumọ̀ Yorùbá tó ti wọ́pọ̀, pẹ̀lú àmì ọ̀pọ̀ ‘àwọn.’
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Ó fi àbùdá imperfect hàn gẹ́gẹ́ bí ọ̀rọ̀ tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra, láìfipá mú ọ̀kan nínú méjèèjì.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dative indirect object náà ni Yorùbá àdánidá fi ‘fún un’ hàn, ó sì ń tọ́ka sí Jésù.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Àṣẹ tó ń pe àfiyèsí ni; ‘Wò ó’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: τί
  choice: èé ṣe
  rationale: Nínú àyíká ẹ̀sùn yìí, τί ṣe iṣẹ́ adverbial tó túmọ̀ sí ‘kí nìdí/èé ṣe’; àṣàyàn ‘èé ṣe’ jẹ́ ti ẹnu-ọ̀rọ̀ àdánidá.
- source_word: ποιοῦσιν
  choice: tí wọ́n fi ń ṣe
  rationale: Ìṣètò yìí bá ìbéèrè ‘èé ṣe’ mu ní Yorùbá, ‘ń ṣe’ sì pa present progressive mọ́.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ plural ní ìrísí, ó jẹ́ ọ̀rọ̀ àṣà fún ọjọ́ Sábáàtì kan; ‘ọjọ́ ìsinmi’ jẹ́ ọ̀nà Yorùbá tó yé kedere.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ohun tí kò bófin mu
  rationale: Ó pa agbára ọ̀rọ̀ nípa ohun tí a fàyè gbà tàbí tí ó bófin mu mọ́, láìsọ irú òfin tàbí àṣà ìtumọ̀ òfin tí wọ́n ní lọ́kàn.
theological_decisions:
- issue: Irú ẹ̀sùn àwọn Farisí
  choice: ohun tí kò bófin mu
  alternative: ohun tí a kò fàyè gbà
  rationale: Gíríìkì sọ pé ohun náà kò ní àṣẹ tàbí kò bófin mu, ṣùgbọ́n kò sọ bóyá Òfin Mósè, àṣà àwọn Farisí, tàbí ìtumọ̀ halakhic ni wọ́n ń tọ́ka sí. Ìtumọ̀ náà pa àìdánilójú yìí mọ́.
- issue: Ìtumọ̀ τί nínú ìbéèrè
  choice: èé ṣe
  alternative: kí ni
  rationale: Àyíká ẹ̀sùn náà ṣe atilẹyin fún ìtumọ̀ ‘èé ṣe,’ ṣùgbọ́n Gíríìkì tún lè jẹ́ ‘kí ni’; àṣàyàn mìíràn náà wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Ọjọ́ ìsinmi’ ni a lò fún Sabbath láti jẹ́ àdánidá ní Yorùbá, láìṣàlàyé ẹ̀sùn náà ju ohun tí orísun sọ lọ.
