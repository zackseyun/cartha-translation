  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: yo
  text: Wọ́n sì wá, wọ́n mú ọkùnrin kan tí ara rẹ̀ rọ wá sọ́dọ̀ rẹ̀, ẹni tí àwọn mẹ́rin gbé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì kan sọ “nípasẹ̀ mẹ́rin” péré; kò sọ ní pàtó pé ọkùnrin ni wọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wọ́n sì
  rationale: “Sì” pa ìsopọ̀ ìtàn tí Máàkù sábà máa ń lò mọ́, láì fi ìtumọ̀ àkókò bí “lẹ́yìn náà” kún un.
- source_word: ἔρχονται
  choice: wá
  rationale: Ọ̀rọ̀ náà jẹ́ historical present ní Gíríìkì; fífi í ṣe ìṣe àtẹ̀yìnwá ní Yorùbá mú kí ìtàn náà jẹ́ àdánidá.
- source_word: φέροντες πρὸς αὐτὸν
  choice: ń gbé ... wá sọ́dọ̀ rẹ̀
  rationale: Èyí sọ ìṣe tí ó bá wíwá wọn rìn àti ibi tí wọ́n ń gbé ẹni náà lọ ní Yorùbá àdánidá.
- source_word: παραλυτικὸν
  choice: ọkùnrin kan tí ara rẹ̀ rọ
  rationale: Ọ̀rọ̀ ajẹ́tífù náà dúró gẹ́gẹ́ bí orúkọ ẹni; yíyan ọ̀rọ̀ yìí jẹ́ kedere, ó sì kọ́kọ́ fi ẹni hàn dípò kí ó fi àìlera rẹ̀ sọ ọ́ di orúkọ.
- source_word: αἰρόμενον
  choice: tí ... gbé
  rationale: Àpólà aláìṣe náà túmọ̀ sí pé àwọn ẹlòmíràn ni wọ́n ń gbé ọkùnrin náà ní ti ara.
- source_word: ὑπὸ τεσσάρων
  choice: tí àwọn mẹ́rin gbé
  rationale: Gíríìkì sọ “mẹ́rin” nìkan láì sọ “ọkùnrin”; Yorùbá lè pa ìyọkúrò yẹn mọ́ ní ọ̀nà tí ó yé ni.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè ìtàn tí ó ṣeé lóye. A pa ìṣọ̀kan àtẹ̀lé gbólóhùn Máàkù mọ́ pẹ̀lú “sì,” a sì yẹra fún fífi “ọkùnrin” kún iye mẹ́rin nítorí pé kò sí ní pàtó nínú Gíríìkì.
