id: MRK.2.14
reference: Mark 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: yo
  text: Bí ó sì ti ń kọjá lọ, ó rí Lefi ọmọ Alfeu tí ó jókòó ní ibi tí wọ́n ti ń gba owó orí[a]. Ó sì wí fún un pé, “Tẹ̀lé mi.” Ó sì dìde, ó tẹ̀lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ibùdó tí wọ́n ti ń gba owó ọ̀nà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibi tí wọ́n ti ń gba owó orí tàbí owó kọ́ọ̀sítọ́ọ̀mù.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: Bí ó sì ti ń kọjá lọ
  rationale: Ọ̀rọ̀ aláìparí yìí ń fi ìṣe tí ó ń lọ lọ́wọ́ hàn nígbà tí ó rí Lefi; ọ̀rọ̀ Yorùbá yìí dá àyíká ìtàn náà sílẹ̀ lọ́nà àdánidá.
- source_word: εἶδεν
  choice: ó rí
  rationale: Èyí túmọ̀ sí pé ó rí i; ‘rí’ kò fi ìtumọ̀ àfikún bí ‘ṣàkíyèsí’ kún un.
- source_word: Λευὶν
  choice: Lefi
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: ọmọ Alfeu
  rationale: Ìṣọ̀kan oníwàásù yìí ń dá Lefi mọ̀ nípa baba rẹ̀; ‘ọmọ Alfeu’ ni ọ̀nà Yorùbá tó ṣe kedere.
- source_word: καθήμενον
  choice: ó jókòó
  rationale: Ó ṣàpèjúwe ipò Lefi nígbà tí Jesu rí i; fífi gbólóhùn kíkún lò jẹ́ àdánidá ní Yorùbá.
- source_word: ἐπὶ τὸ τελώνιον
  choice: ní ibi tí wọ́n ti ń gba owó orí
  rationale: τελώνιον ni ibi tí a ti ń gba owó orí tàbí owó kọ́ọ̀sítọ́ọ̀mù; àpèjúwe yìí ṣe kedere fún òǹkàwé Yorùbá láì dín ìtumọ̀ náà sí ibùdó owó ọ̀nà nìkan.
- source_word: λέγει
  choice: Ó sì wí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ìtàn, Yorùbá sábà máa ń sọ tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ pẹ̀lú ‘ó sì wí’; èyí pa ìgbésẹ̀ ìtàn mọ́ láì jẹ́ kí ọ̀rọ̀ dà bí ohun tó ń ṣẹlẹ̀ nísinsìnyí.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: Àṣẹ ìsinsìnyí náà lè tọ́ka sí títẹ̀síwájú gẹ́gẹ́ bí ọmọ-ẹ̀yìn; ‘máa tọ̀ mí lẹ́yìn’ pa agbára àti ìtẹ̀síwájú àṣẹ náà mọ́ láì fi ‘wá’ kún un.
- source_word: ἀναστὰς
  choice: ó sì dìde
  rationale: Ó fi ìgbésẹ̀ tó ṣáájú títọ̀ Jesu lẹ́yìn hàn ní ṣókí àti ní ọ̀nà àdánidá.
- source_word: ἠκολούθησεν αὐτῷ
  choice: ó tọ̀ ọ́ lẹ́yìn
  rationale: Èyí pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ láàárín àṣẹ Jesu àti ìdáhùn Lefi, láì yí i sí àlàyé pé ó di ọmọ-ẹ̀yìn.
theological_decisions:
- issue: Àkókò ìsinsìnyí nínú ìtàn Máàkù (λέγει)
  choice: Lo ‘Ó sì wí’ nínú ìtẹ̀lé ìtàn Yorùbá.
  alternative: 'Pa àkókò ìsinsìnyí mọ́ ní tààrà: ‘Ó sì wí fún un’ (èyí kò ní ìyàtọ̀ àmì àkókò tó hàn gbangba ní Yorùbá), tàbí ‘ó sì ń wí fún un.’'
  rationale: Èdè Yorùbá kò ní ìyàtọ̀ àkókò-ìṣe tó bá ti Gíríìkì mu níbi yìí; ‘ó sì wí’ jẹ́ ìtàn àdánidá, ó sì pa ìyára ìtàn mọ́. ‘Ó ń wí’ lè ṣàfikún ìtumọ̀ pé ọ̀rọ̀ náà ń pẹ́ tàbí ń tẹ̀síwájú, èyí tí orísun kò béèrè.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìtẹ̀lé kíkán àti ìpe Jesu tó lágbára mọ́.
