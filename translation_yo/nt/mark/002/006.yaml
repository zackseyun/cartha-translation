source:
  edition: SBLGNT
  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: yo
  text: 'Ṣùgbọ́n àwọn kan lára àwọn akọ̀wé jókòó níbẹ̀, wọ́n sì ń ronú nínú ọkàn wọn pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ṣùgbọ́n ... jókòó
  rationale: δέ yí ìtàn sí ìhùwàpadà inú ti ẹgbẹ́ mìíràn; “Ṣùgbọ́n” fi ìyàtọ̀ náà hàn láìmú un le jù. Yorùbá kò nílò kí a tú ἦσαν sí ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: τινες τῶν γραμματέων
  choice: àwọn kan lára àwọn akọ̀wé
  rationale: 'Èyí pa ìtumọ̀ apá-nínú-àpapọ̀ mọ́: àwọn kan péré lára ẹgbẹ́ àwọn akọ̀wé ni a ń sọ̀rọ̀ nípa wọn.'
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ ibi tó ṣe déédéé, tó sì bá ìtàn Yorùbá mu.
- source_word: καθήμενοι
  choice: jókòó
  rationale: Ó ṣàpèjúwe bí wọ́n ṣe wà níbi náà; “jókòó” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: διαλογιζόμενοι
  choice: wọ́n sì ń ronú
  rationale: Ó fi ìrònú àti ìgbèrò inú hàn kí wọ́n tó sọ àtakò wọn jáde; àmì “ń” tún pa ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: nínú ọkàn wọn
  rationale: Èyí pa àkànlò èdè Bíbélì mọ́, níbi tí “ọkàn” ti jẹ́ ibi ìrònú inú, láìdín un kù sí “èrò inú” nìkan.
theological_decisions:
- issue: Àkànlò èdè nípa καρδίαις gẹ́gẹ́ bí ibi ìrònú inú
  choice: nínú ọkàn wọn
  alternative: nínú ara wọn; nínú èrò wọn
  rationale: Mímú “ọkàn” dúró pa àwòrán àti ìmọ̀ nípa ẹ̀dá ènìyàn inú ọ̀rọ̀ Gíríìkì mọ́, láìfi ìyàtọ̀ òde òní láàárín ọkàn àti èrò wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “àwọn akọ̀wé” fún γραμματεῖς, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu. Kò sí àmì àlàyé ẹsẹ̀ nítorí ìtumọ̀ “nínú ọkàn wọn” jẹ́ àkànlò Yorùbá tó ṣe kedere, tí kò sì nílò àlàyé míì.
