  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: yo
  text: Ó sì tún jáde lọ lẹ́bàá òkun[a]. Gbogbo ogunlọ́gọ̀ náà[b] sì ń wá sọ́dọ̀ rẹ̀[c], ó sì ń kọ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí etí òkun.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo ìjọ ènìyàn náà.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ọ̀rọ̀-ìṣe tí a túmọ̀ sí “ń wá” àti “ń kọ́” jẹ́ imperfect ní èdè Gíríìkì; èyí lè fi ìṣe tí ń bá a lọ ní àkókò àtijọ́ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó jáde kúrò níbi tí ó wà; “jáde lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà láìfi ibi tí ó ti jáde sí kún un.
- source_word: πάλιν
  choice: tún
  rationale: “Tún” fi hàn ní ṣókí pé ìṣe náà ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: παρὰ τὴν θάλασσαν
  choice: sí ẹ̀gbẹ́ òkun
  rationale: Παρά pẹ̀lú accusative níbí tọ́ka sí lílọ sí ibi tí ó wà lẹ́gbẹ̀ẹ́ etí omi; “sí ẹ̀gbẹ́ òkun” pa ìtumọ̀ ìṣípò àti ipò mọ́.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo ogunlọ́gọ̀ náà
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí gbogbo àwùjọ ènìyàn náà gẹ́gẹ́ bí odindi kan; “gbogbo ogunlọ́gọ̀ náà” jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἤρχετο
  choice: ń wá
  rationale: Imperfect Gíríìkì náà lè fi ìṣe tí ń bá a lọ ní àkókò àtijọ́ hàn; àmì “ń” pa apá ìṣe tí ń lọ lọ́wọ́ mọ́ láìtúmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà ń fi ìṣípò sí ọ̀dọ̀ ẹni kan hàn; “sọ́dọ̀ rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún un.
- source_word: ἐδίδασκεν
  choice: ó sì ń kọ́
  rationale: Imperfect náà ń tọ́ka sí kíkọ́ni tí ń bá a lọ; “ń kọ́” ṣe àfihàn apá yìí ní Yorùbá.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ yìí tọ́ka padà sí àwọn ènìyàn inú ogunlọ́gọ̀ náà; “wọn” ni ìbámu Yorùbá tààrà.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo “ń” láti ṣàfihàn ìṣe tí ń bá a lọ nínú àwọn imperfect méjèèjì.
