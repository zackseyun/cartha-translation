  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: yo
  text: Nígbà tí Jésù gbọ́ ọ̀rọ̀ náà, ó sọ fún wọn pé, “Àwọn tí ara wọn le[a] kò nílò oníṣègùn, ṣùgbọ́n àwọn aláìsàn. Èmi kò wá láti pe àwọn olódodo[b], ṣùgbọ́n àwọn ẹlẹ́ṣẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn alágbára.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní tààrà sí àwọn tó lágbára tàbí tí ara wọn le.
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, a lè gbọ́ “àwọn olódodo” gẹ́gẹ́ bí àwọn tí a kà sí olódodo tàbí tí wọ́n ka ara wọn sí olódodo; ṣùgbọ́n Gíríìkì sọ “àwọn olódodo” lásán.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Nígbà tí Jésù gbọ́ ọ̀rọ̀ náà
  rationale: Aorist participle náà ń tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀ àkọ́kọ́. Èdè Yorùbá adayeba ń fi í hàn pẹ̀lú ‘nígbà tí’; ‘ọ̀rọ̀ náà’ ni a fi kún un láti tọ́ka sí ẹ̀sùn inú àyíká ọ̀rọ̀, nítorí Gíríìkì kò sọ ohun tí ó gbọ́ ní tààrà.
- source_word: λέγει
  choice: ó sọ fún wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo present historical, ìtàn Yorùbá adayeba máa ń lo ‘ó sọ’; yíyan tense yìí kò yí ìtumọ̀ padà, ó sì jẹ́ kí gbolohun náà yéni kedere.
- source_word: οἱ ἰσχύοντες
  choice: àwọn alágbára
  rationale: Èyí pa ìtumọ̀ ìpilẹ̀ ti ἰσχύω mọ́—àwọn tí ó lágbára tàbí tí ara wọn le—nínú àkàwé oníṣègùn. Àlàyé ìsàlẹ̀ fún ‘àwọn tí ara wọn le’ gẹ́gẹ́ bí ọ̀nà míì.
- source_word: χρείαν ἔχουσιν
  choice: kò nílò
  rationale: Ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti òde òní fún idiom Gíríìkì ‘kò ní àìní’ ni ‘kò nílò.’
- source_word: ἰατροῦ
  choice: oníṣègùn
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, fún dókítà tàbí ẹni tó ń tọ́jú àìsàn ni ‘oníṣègùn’; ó bá àkàwé ìṣègùn mu.
- source_word: οἱ κακῶς ἔχοντες
  choice: àwọn aláìsàn
  rationale: Idiom náà túmọ̀ sí àwọn tí ara wọn kò dára, pàápàá nípa àìsàn. ‘Àwọn aláìsàn’ sọ ìtumọ̀ yẹn ní ṣókí.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Èmi kò wá láti pe
  rationale: Ó pa àlàyé iṣẹ́ tí Jésù wá ṣe mọ́, ó sì fi ìtumọ̀ gbòòrò καλέω sílẹ̀ láì dín in kù sí pípè sí àsè tàbí sí ìpàdé nìkan.
- source_word: δικαίους
  choice: àwọn olódodo
  rationale: Ó pa ẹ̀ka ìwà àti ẹ̀sìn tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí mọ́ láì fi ẹ̀gàn tàbí ìrònú ara ẹni kún ọ̀rọ̀ pàtàkì.
- source_word: ἁμαρτωλούς
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún substantival adjective náà, ó sì pa orúkọ ẹ̀ka ìwà náà mọ́.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí Jésù gbọ́ ní kedere
  choice: A lo ‘ọ̀rọ̀ náà’ gẹ́gẹ́ bí ohun tí ó gbọ́
  alternative: ‘Nígbà tí Jésù gbọ́’ láì sọ ohun tí ó gbọ́
  rationale: Gíríìkì fi object sílẹ̀ láì sọ, ṣùgbọ́n àyíká ọ̀rọ̀ tọ́ka sí ẹ̀sùn tàbí ọ̀rọ̀ wọn. ‘Ọ̀rọ̀ náà’ jẹ́ ìrànwọ́ èdè, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
- issue: Bóyá kí a pa historical present mọ́ ní Yorùbá
  choice: A lo ‘ó sọ’ nínú ìtàn
  alternative: ‘ó ń sọ fún wọn’ tàbí ‘ó sọ pé’ tí a fi present historical hàn lọ́nà tó le ní Yorùbá
  rationale: Yorùbá kì í lo historical present bí Gíríìkì ṣe ń lò ó ní gbogbo ibi. ‘Ó sọ’ jẹ́ adayeba, ó sì pa ìṣẹ̀lẹ̀ náà mọ́ láì mú kí ó dà bí ọ̀rọ̀ tí ó ń lọ lọ́wọ́.
- issue: Bóyá ‘àwọn olódodo’ jẹ́ ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ tààrà
  choice: A fi ‘àwọn olódodo’ sí ọ̀rọ̀ pàtàkì láì ṣàlàyé rẹ̀ sí i
  alternative: ‘àwọn tí wọ́n ka ara wọn sí olódodo’
  rationale: Àyíká lè jẹ́ kí a gbọ́ ọ̀rọ̀ náà gẹ́gẹ́ bí ẹ̀gàn, ṣùgbọ́n Gíríìkì sọ ‘àwọn olódodo’ lásán. Àlàyé ìsàlẹ̀ pa àǹfààní ìtumọ̀ yẹn mọ́ láì pinnu rẹ̀ fún òǹkàwé.
translation_notes:
  register: Standard Yorùbá tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ní iyì, ó sì rọrùn fún gbogbo ènìyàn. ‘Oníṣègùn,’ ‘aláìsàn,’ ‘olódodo,’ àti ‘ẹlẹ́ṣẹ̀’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀ nínú Yorùbá ẹ̀sìn àti ti gbogbogbòò.
