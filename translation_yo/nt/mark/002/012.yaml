  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: yo
  text: Ó sì dìde, lẹ́sẹ̀kẹsẹ̀ ó gbé àkéte náà, ó sì jáde níwájú gbogbo wọn, tí èyí fi jẹ́ pé ẹnu ya gbogbo wọn, wọ́n sì yin Ọlọ́run lógo, wọ́n ń wí pé, “A kò tíì rí irú èyí rí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an: “A kò rí bẹ́ẹ̀ rí.” Àṣà-ọrọ náà túmọ̀ sí pé wọn kò tíì rí irú ohun tó ṣẹlẹ̀ yìí rí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: ó dìde
  rationale: Nínú ìtàn ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé ọkùnrin náà dìde gẹ́gẹ́ bí Jésù ti pàṣẹ; yíyan ‘ó dìde’ kò fi ìtumọ̀ àjíǹde kún àyíká ọ̀rọ̀ náà.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ hàn, ó sì pa ìmísí ìtàn Máàkù mọ́ ní Yorùbá àdánidá.
- source_word: ἄρας
  choice: ó gbé
  rationale: Ó sọ ìṣe gbígbé ohun náà sókè láti mú un lọ ní ọ̀nà Yorùbá tó rọrùn.
- source_word: κράβαττον
  choice: àkéte
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun ìrọ̀lẹ́ tàbí ohun ìsùn pẹlẹbẹ, kì í ṣe ibùsùn ńlá; ‘àkéte’ ṣe kedere fún òǹkàwé Yorùbá.
- source_word: ἔμπροσθεν πάντων
  choice: níwájú gbogbo wọn
  rationale: Ó pa ìtumọ̀ pé gbogbo àwọn tó wà níbẹ̀ rí i ní gbangba mọ́.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Ẹnu ya gbogbo wọn
  rationale: Àpólà Yorùbá yìí fi ìyàlẹ́nu ńlá tí ἐξίστασθαι ń sọ hàn lọ́nà àdánidá.
- source_word: δοξάζειν τὸν θεόν
  choice: wọ́n sì yin Ọlọ́run lógo
  rationale: Ó pa ìdáhùn tí ó dojú kọ Ọlọ́run àti èrò δοξάζω mọ́ nínú èdè ìsìn Yorùbá tó mọ́gbọ́n dání.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: A kò tíì rí irú èyí rí
  rationale: Ó mú agbára àṣà-ọrọ Gíríìkì náà jáde pé ohun tí wọ́n rí kò tíì ṣẹlẹ̀ rí lójú wọn, láìfi ohun míì kún un.
theological_decisions:
- issue: Ìtumọ̀ àjíǹde tí ἠγέρθη lè ní ní àwọn àyíká ọ̀rọ̀ mìíràn
  choice: ó dìde
  alternative: a gbé e dìde
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐγείρω lè tọ́ka sí jíjí ẹni dìde kúrò nínú òkú níbòmíràn, níhìn-ín ọkùnrin arọ náà ń dáhùn sí àṣẹ Jésù nípa dídìde. Ìtumọ̀ yìí kò gbé ẹ̀kọ́ àjíǹde wọ ààyè tí kì í ṣe kókó ìsẹ̀lẹ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó lọ́lá ṣùgbọ́n tí ó ṣeé lóye, ni a lò. A yan àwọn àpólà àdánidá bí ‘lẹ́sẹ̀kẹsẹ̀’ àti ‘ẹnu ya gbogbo wọn,’ pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A gbé àmì àlàyé [a] sí ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé, dípò fífi sí ‘ó dìde.’
