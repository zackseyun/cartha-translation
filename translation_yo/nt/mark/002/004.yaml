source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: yo
  text: Níwọ̀n bí wọn kò ti lè mú un dé ọ̀dọ̀ Jesu nítorí ogunlọ́gọ̀ ènìyàn náà, wọ́n ṣí òrùlé ilé náà ní ibi tí ó wà; lẹ́yìn tí wọ́n ti wa ihò sí i, wọ́n sọ àkéte tí ẹni tí ara rẹ̀ rọ náà dùbúlẹ̀ lé e kalẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: nígbà tí wọn kò sì lè
  rationale: Ó fi ipò tí ó fa ìgbésẹ̀ wọn hàn ní Yorùbá àdánidá, láì sọ ìtumọ̀ náà di ohun tí ó ju ti Gíríìkì lọ.
- source_word: προσενέγκαι αὐτῷ
  choice: mú un dé ọ̀dọ̀ Jesu
  rationale: Àwọn arọ́pò-orúkọ méjèèjì nínú Gíríìkì ń tọ́ka sí ẹni tí ara rẹ̀ rọ àti Jesu. Lílo orúkọ Jesu mú àwọn ẹni méjèèjì yé kedere ní Yorùbá, níwọ̀n bí àtúnṣe ‘mú un tọ̀ ọ́ wá’ ti lè dàrú.
- source_word: διὰ τὸν ὄχλον
  choice: nítorí ọ̀pọ̀ ènìyàn náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìdí tí ὄχλος fi dí wọn lọ́wọ́.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: wọ́n tú òrùlé ilé náà
  rationale: ‘Tú òrùlé’ sọ ìṣe yíyan tàbí yíyọ ohun tí a fi bo ilé kúrò ní ọ̀nà tí ó bá àṣà èdè Yorùbá mu.
- source_word: ὅπου ἦν
  choice: ní ibi tí ó wà
  rationale: Ó pa àìsọ pàtó ti Gíríìkì mọ́ nípa ẹni tí ó wà níbẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí Jesu.
- source_word: ἐξορύξαντες
  choice: lẹ́yìn tí wọ́n sì ti wa ihò sí i
  rationale: Ó ṣàfihàn wíwà tàbí ṣíṣí ihò gba inú òrùlé láì sọ ohun èlò tí a fi kọ ọ́ ní pàtó.
- source_word: χαλῶσι
  choice: wọ́n sọ ... kalẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ ohun kan láti ibi gíga lọ sí ìsàlẹ̀. Àkókò ìsinsìnyí ìtàn Gíríìkì ni a túmọ̀ gẹ́gẹ́ bí ìṣe ìtàn Yorùbá.
- source_word: κράβαττον
  choice: àkéte
  rationale: Àkéte jẹ́ ohun ìtẹ́lẹ̀ rírọrùn tí ènìyàn lè dùbúlẹ̀ lé, ó sì yẹ ju ‘ibùsùn’ tí ó lè túmọ̀ sí ohun èlò ńlá lọ.
- source_word: ὁ παραλυτικὸς
  choice: ẹni tí ara rẹ̀ rọ
  rationale: Ó túmọ̀ àpèjúwe ẹni náà ní Yorùbá òde òní, láì sọ ọ́ di orúkọ àrùn tí kò wọ́pọ̀.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: tí ẹni tí ara rẹ̀ rọ náà dùbúlẹ̀ lé e
  rationale: Ó so gbólóhùn ìbátan náà mọ́ àkéte gẹ́gẹ́ bí ohun tí ọkùnrin náà dùbúlẹ̀ lé.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní ọlá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. A kò fi àlàyé àṣà ilé tàbí ohun èlò òrùlé kún ohun tí orísun kò sọ.
