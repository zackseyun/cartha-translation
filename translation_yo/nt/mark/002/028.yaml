  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: yo
  text: Nítorí náà, Ọmọ Ènìyàn jẹ́ Olúwa lórí ọjọ́ Ìsinmi pàápàá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà, Ọmọ Ènìyàn jẹ́ Olúwa lórí ọjọ́ Ìsinmi pẹ̀lú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àti/pẹ̀lú,” ṣùgbọ́n níhìn-ín ó ṣeé ṣe kó túmọ̀ sí “pàápàá,” láti tẹnu mọ́ bí àṣẹ rẹ̀ ṣe gbòòrò tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó ń fi ìparí ọ̀rọ̀ tí a fà jáde láti inú àlàyé tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ láti sọ ọ́ ní Yorùbá.
- source_word: κύριος
  choice: Olúwa
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ní àṣẹ àti ìṣàkóso. “Olúwa” pa agbára ọ̀rọ̀ Gíríìkì náà àti ìtumọ̀ rẹ̀ nípa Kristi mọ́.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù máa ń lò fún ara rẹ̀ nínú àwọn Ìhìn Rere; títúmọ̀ rẹ̀ lọ́nà yìí pa ìtumọ̀ tó jinlẹ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ Bíbélì mìíràn mọ́.
- source_word: καὶ
  choice: pàápàá
  rationale: Nínú gbólóhùn yìí, καὶ lè ní agbára ìtẹnumọ́, tó ń fi hàn pé àṣẹ Ọmọ Ènìyàn dé orí ọjọ́ Ìsinmi pàápàá. Àmì ìsàlẹ̀ fi ìtumọ̀ “pẹ̀lú” tó tún ṣeé ṣe hàn.
- source_word: σαββάτου
  choice: ọjọ́ Ìsinmi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún Sábáàtì nínú àríyànjiyàn nípa ohun tó yẹ láti ṣe ní ọjọ́ náà.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù pé òun ní àṣẹ lórí ọjọ́ Ìsinmi
  choice: A túmọ̀ κύριος gẹ́gẹ́ bí “Olúwa,” èyí tó sọ àṣẹ Ọmọ Ènìyàn lórí ọjọ́ Ìsinmi ní tààràtà.
  alternative: “Ó ní àṣẹ nípa ọjọ́ Ìsinmi.”
  rationale: κύριος ń sọ ipò olúwa àti ìṣàkóso, kì í ṣe àṣẹ kékeré tàbí ìyọ̀ǹda lásán. Ìtumọ̀ yìí pa agbára gbólóhùn náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- issue: Ẹni tí “Ọmọ Ènìyàn” ń tọ́ka sí
  choice: A pa “Ọmọ Ènìyàn” mọ́ gẹ́gẹ́ bí orúkọ oyè Jésù.
  alternative: “ẹni tí ó jẹ́ ènìyàn” tàbí “ènìyàn” ní ìtumọ̀ gbogbogbò.
  rationale: Nínú Máàkù, gbólóhùn náà jẹ́ orúkọ tí Jésù fi ń tọ́ka sí ara rẹ̀, ó sì lè ní ìbáṣepọ̀ pẹ̀lú ìran inú Dáníẹ́lì. Ìtumọ̀ náà kò yẹ kí ó yanjú ìfọ̀rọ̀wérọ̀ yìí ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Nítorí náà” mú ìsopọ̀ ọgbọ́n mọ́ ohun tó ṣáájú; “pàápàá” sì fi agbára ascensive καὶ hàn láìpa ìtumọ̀ míì rẹ̀ rẹ́, èyí tí a fi sínú àmì ìsàlẹ̀.
