base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: yo
  text: Mo sọ fún ọ pé, “Dìde, gbé àkéte rẹ[a], kí o sì lọ sí ilé rẹ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “ibùsùn rẹ.” Ọ̀rọ̀ Gíríìkì κράβαττος ń tọ́ka sí àkéte tí a fi sùn tàbí ibùsùn kékeré tí a lè gbé kiri.
    reason: lexical_alternative
  - marker: b
    text: Àbí, “lọ sílé.” Ní tààràtà, èdè Gíríìkì ní, “lọ sí ilé rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Mo sọ fún ọ pé
  rationale: Èyí túmọ̀ ọ̀rọ̀ àṣẹ náà ní èdè Yorùbá àdánidá, ó sì pa ìtọ́kasí taara sí ẹni tí Jésù ń bá sọ̀rọ̀ mọ́. Bí ó tilẹ̀ jẹ́ pé Σοί wà ní iwájú fún ìtẹnumọ́, lílo ‘Ìwọ ni mo sọ fún’ lè mú ìtẹnumọ́ tó pọ̀ ju ti ọ̀rọ̀ Gíríìkì lọ.
- source_word: ἔγειρε
  choice: Dìde
  rationale: Ọ̀rọ̀ àṣẹ Yorùbá tó ṣe kedere, tó sì bá àyíká ọkùnrin arọ tí a ń pàṣẹ fún láti dìde mu.
- source_word: ἆρον
  choice: gbé
  rationale: Ó ṣàpèjúwe gbígbé ohun tí ó wà nílẹ̀ sókè, ó sì jẹ́ ọ̀rọ̀ àdánidá nínú àṣẹ yìí.
- source_word: κράβαττόν
  choice: àkéte
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun ìrọ̀lẹ́ tàbí ibùsùn kékeré tí a lè gbé kiri; ‘àkéte’ kò mú kí òǹkàwé ronú nípa ibùsùn ńlá tó ní férémù.
- source_word: ὕπαγε
  choice: lọ
  rationale: ‘Lọ’ jẹ́ ọ̀rọ̀ àṣẹ Yorùbá tó rọrùn, tó sì dá ìtumọ̀ ọ̀rọ̀ Gíríìkì náà dúró láìfi agbára míì kún un.
- source_word: εἰς τὸν οἶκόν σου
  choice: sí ilé rẹ
  rationale: Ó pa ìtọ́sọ́nà εἰς àti orúkọ οἶκος mọ́ ní tààràtà; ‘sílé’ tún ṣeé lò gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá fún ‘lọ sí ilé ẹni.’
theological_decisions:
- issue: Ohùn àti agbára àṣẹ ìwòsàn Jésù
  choice: 'Àṣẹ taara sí ẹni náà: “Mo sọ fún ọ pé, ‘Dìde, gbé àkéte rẹ, kí o sì lọ sí ilé rẹ.’”'
  alternative: 'Ìtumọ̀ tó tẹnumọ́ arọ́pò-orúkọ: “Ìwọ ni mo sọ fún: Dìde...”'
  rationale: Ìtumọ̀ náà pa agbára àti lẹ́sẹẹsẹ àwọn àṣẹ Jésù mọ́, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un. A kò mú ìtẹnumọ́ Σοί ga ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. Gbólóhùn náà ṣe kedere fún òǹkàwé lasán, ó sì pa lẹ́sẹẹsẹ àwọn àṣẹ mẹ́ta àti ìsọ̀rọ̀ taara mọ́. Àwọn àmì ẹsẹ̀ [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé wọn kan.
