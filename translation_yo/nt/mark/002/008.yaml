  to: Lẹ́sẹ̀kẹsẹ̀, Jésù mọ̀ nínú ẹ̀mí rẹ̀[a] pé wọ́n ń ronú báyìí nínú ara wọn, ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi ń ronú nípa àwọn nǹkan wọ̀nyí nínú ọkàn yín?”
