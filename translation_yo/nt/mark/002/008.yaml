language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, Jésù mọ̀ nínú ẹ̀mí rẹ̀[a] pé wọ́n ń ronú báyìí nínú ara wọn, ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi ń ronú nípa àwọn nǹkan wọ̀nyí nínú ọkàn yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ẹ̀mí rẹ̀,” tàbí “mọ̀ nínú ara rẹ̀.” Gíríìkì kò sọ ọ̀nà tí Jésù gbà mọ̀ ọ́ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára àti agbára ọ̀nà ìtàn Máàkù mọ́ ní Yorùbá àdánidá.
- source_word: ἐπιγνοὺς
  choice: mọ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé Jésù mọ̀ tàbí dá ohun tí wọ́n ń rò mọ̀; ọ̀rọ̀ yìí kò sọ bí ìmọ̀ náà ṣe dé bá a.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: nínú ẹ̀mí rẹ̀
  rationale: Ó tẹ̀ lé àyè tí gíríìkì fi ìmọ̀ náà sí, láì pinnu bóyá ó ń tọ́ka sí ẹ̀mí ènìyàn Jésù, ọ̀nà ìmọ̀ nípa ẹ̀mí, tàbí ohun mìíràn.
- source_word: οὕτως
  choice: báyìí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ bí wọ́n ṣe ń ronú.
- source_word: διαλογίζονται
  choice: wọ́n ń ronú
  rationale: Ọ̀rọ̀ náà níbí jẹ́ ìrònú àti ìgbèrò inú, kì í ṣe dandan pé wọ́n ń bá ara wọn jiyàn ní gbangba.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara wọn
  rationale: Ó pa ìtumọ̀ ìrònú inú ọ̀kọ̀ọ̀kan wọn mọ́, bí ó tilẹ̀ jẹ́ pé gíríìkì tún lè fara hàn bí ‘láàárín ara wọn’ ní àyíká mìíràn.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Èé ṣe tí ẹ fi ń ronú àwọn nǹkan wọ̀nyí
  rationale: ‘Èé ṣe’ mú ipa ìbéèrè τί jáde ní Yorùbá àdánidá, ‘àwọn nǹkan wọ̀nyí’ sì ṣàfihàn ταῦτα.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: ‘Ọkàn’ pa àwòrán Bíbélì fún inú ènìyàn—ìrònú àti èrò—mọ́, dípò kí a dín un kù sí ‘ọpọlọ’ nìkan.
theological_decisions:
- issue: Irú ìmọ̀ Jésù nínú gbólóhùn ‘nínú ẹ̀mí rẹ̀’
  choice: Pa ‘nínú ẹ̀mí rẹ̀’ mọ́, kí a sì sọ pé Jésù mọ ìrònú inú wọn láì ṣàlàyé ọ̀nà tí ó gbà mọ̀ ọ́.
  alternative: Láti sọ ọ́ ní pàtó gẹ́gẹ́ bí ìmọ̀ ohun gbogbo ti Ọlọ́run, tàbí gẹ́gẹ́ bí òye ènìyàn tó jinlẹ̀ nìkan.
  rationale: Ẹsẹ̀ náà fi hàn pé Jésù mọ ohun tí wọ́n ń rò nínú, ṣùgbọ́n τῷ πνεύματι αὐτοῦ kò fúnra rẹ̀ yan ọ̀kan lára àwọn àlàyé ẹ̀kọ́ ìgbàgbọ́ wọ̀nyẹn.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a pa àwòrán ‘ẹ̀mí’ àti ‘ọkàn’ ti orísun mọ́.
