  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “A dá ọjọ́ Ìsinmi sílẹ̀ fún ènìyàn[a], kì í ṣe pé a dá ènìyàn sílẹ̀ fún ọjọ́ Ìsinmi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fún ìran ènìyàn” tàbí “fún gbogbo ènìyàn.” Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ṣùgbọ́n ó dúró fún gbogbo aráyé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect nínú èdè Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń sọ” jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ yẹn mọ́ nínú Yorùbá.
- source_word: τὸ σάββατον
  choice: ọjọ́ Ìsinmi
  rationale: Ó tọ́ka sí ọjọ́ tàbí ètò Sábáàtì; “ọjọ́ Ìsinmi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ nínú àyíká Bíbélì.
- source_word: διὰ τὸν ἄνθρωπον
  choice: fún ènìyàn
  rationale: διά pẹ̀lú accusative túmọ̀ sí fún àǹfààní tàbí nítorí; “ènìyàn” ní ẹyọ ṣùgbọ́n ó dúró fún gbogbo aráyé níbí.
- source_word: ἐγένετο
  choice: A dá ... sílẹ̀
  rationale: γίνομαι níbí sọ bí ọjọ́ Ìsinmi ṣe wá sí ìwàláàyè àti ète rẹ̀; “A dá ... sílẹ̀” jẹ́ Yorùbá àdánidá tí kò fi dandan sọ ẹni tó dá a.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: kì í ṣe ènìyàn fún ọjọ́ Ìsinmi
  rationale: Ó pa ìfiwéra òdì àti ìṣọ̀kan ọ̀rọ̀ méjèèjì mọ́, nígbà tó ń fi hàn pé a kò dá ènìyàn sílẹ̀ nítorí ọjọ́ Ìsinmi.
theological_decisions:
- issue: ἄνθρωπος ní ẹyọ gẹ́gẹ́ bí aṣojú gbogbo aráyé
  choice: ènìyàn
  alternative: ìran ènìyàn / gbogbo ènìyàn
  rationale: “Ènìyàn” lè jẹ́ ẹyọ nínú gírámà, síbẹ̀ ó lè dúró fún gbogbo ènìyàn lọ́nà àdánidá nínú Yorùbá; èyí pa ọ̀nà ìsọ Gíríìkì àti ìtumọ̀ tó kárí gbogbo aráyé mọ́.
- issue: Ẹni tó ṣe ìṣe nínú ἐγένετο kò hàn gbangba
  choice: A dá ... sílẹ̀
  alternative: Ọjọ́ Ìsinmi wá sí ìwàláàyè
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tó ṣe ìṣe ní tààrà; lílo “A dá ... sílẹ̀” gẹ́gẹ́ bí passive aláìlórúkọ ní Yorùbá yàgò fún fífi “Ọlọ́run” kún ọ̀rọ̀ náà, bí ó tilẹ̀ jẹ́ pé àyíká lè mú un wá sí ọkàn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa àtúnwí ìlòdì nínú gbolohun Gíríìkì mọ́.
