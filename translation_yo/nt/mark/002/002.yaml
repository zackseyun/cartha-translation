  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì péjọ, tó bẹ́ẹ̀ tí kò sí ààyè mọ́, kódà ní ẹnu ọ̀nà; ó sì ń sọ ọ̀rọ̀ náà[a] fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn náà.” Ní Gíríìkì, “ọ̀rọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Ọ̀pọ̀ ènìyàn sì péjọ
  rationale: “Péjọ” sọ ìpéjọpọ̀ ọ̀pọ̀ ènìyàn jáde lọ́nà àdánidá ní Yorùbá, ó sì pa ìtumọ̀ συν- mọ́ láì mú gbólóhùn náà le.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: tó bẹ́ẹ̀ tí ààyè kò fi sí mọ́
  rationale: 'Èyí fi àbájáde ìpéjọpọ̀ náà àti ìtumọ̀ μηκέτι hàn kedere: gbogbo ààyè ti kún tán.'
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: kódà ní ẹnu ọ̀nà pàápàá
  rationale: Gbólóhùn yìí dúró fún ààyè tó wà lẹ́gbẹ̀ẹ́ tàbí ní agbègbè ẹnu ọ̀nà; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹnumọ́ μηδέ mọ́.
- source_word: ἐλάλει
  choice: ó sì ń sọ
  rationale: Àmì “ń” fi ìṣe tó ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí imperfect Gíríìkì, láì túmọ̀ ọ́ ní pàtó sí “wàásù.”
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó pa àrọ́pò-orúkọ Gíríìkì mọ́, kò sì fi àlàyé míì kún ẹni tí “wọn” ń tọ́ka sí.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” tẹ̀ lé ọ̀nà tí Gíríìkì gbà sọ ọ́, ó sì ṣí ààyè sílẹ̀ fún ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ìhìn tí Jésù ń kéde láì fi “Ọlọ́run” kún ohun tí ẹsẹ náà kò sọ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ τὸν λόγον nínú ohun tí Jésù ń sọ
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà; ọ̀rọ̀ Ọlọ́run
  rationale: Ẹsẹ náà sọ “ọ̀rọ̀ náà” nìkan. Yíyan èyí pa ọ̀rọ̀ inú Gíríìkì mọ́, ó sì yẹra fún fífi “Ọlọ́run” kún un níbi tí kò ti fara hàn ní ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbòò láti lóye.
