id: MRK.2.15
reference: Mark 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí ó jókòó láti jẹun ní ilé rẹ̀[a], ọ̀pọ̀ àwọn agbowó orí àti àwọn ẹlẹ́ṣẹ̀ ń bá Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ jókòó jẹun, nítorí wọ́n pọ̀, wọ́n sì ń tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ilé Léfì”; àwọn kan sì lóye rẹ̀ gẹ́gẹ́ bí “ní ilé Jésù.” Gíríìkì sọ kìkì pé “ní ilé rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ìṣe àsìkò ìsinsìnyí nínú ìtàn ni Máàkù lò láti mú ìtàn lọ síwájú; a túmọ̀ rẹ̀ sí ọ̀nà ìtàn àdánidá ní Yorùbá.
- source_word: κατακεῖσθαι
  choice: jókòó láti jẹun
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìdúró ara tí wọ́n fi ń jẹun nígbà náà; Yorùbá àdánidá kò nílò kí a sọ pé ó rọ̀gbọ̀.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: ní ilé rẹ̀
  rationale: Ó pa arọ́pò-orúkọ ohun-ìní Gíríìkì mọ́, pẹ̀lú àìmọ̀ọ́kàn ẹni tí ‘rẹ̀’ ń tọ́ka sí.
- source_word: τελῶναι
  choice: àwọn agbowó orí
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún àwọn aṣojú tí ń gba owó orí.
- source_word: ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó sì pa àmì ẹgbẹ́ awùjọ àti ẹ̀sìn tí ọ̀rọ̀ náà ní nínú àyíká yìí mọ́.
- source_word: συνανέκειντο
  choice: ń bá ... jókòó jẹun
  rationale: Ó fi jíjẹun papọ̀ hàn ní Yorùbá àdánidá, dípò ìtumọ̀ líle ti ìrọ̀gbọ̀ níbi oúnjẹ.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ tí ó sì pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ mọ́.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: nítorí wọ́n pọ̀
  rationale: Ó pa iṣẹ́ ìṣàlàyé γάρ mọ́, ó sì dun bí Yorùbá àdánidá.
- source_word: ἠκολούθουν αὐτῷ
  choice: wọ́n sì ń tẹ̀ lé e
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ tàbí tí wọ́n máa ń ṣe hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
theological_decisions:
- issue: Ẹni tí ‘ilé rẹ̀’ (αὐτοῦ) ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ilé rẹ̀’ láì sọ ẹni tó ni ilé náà.
  alternative: Ilé Léfì; tàbí ilé Jésù.
  rationale: Arọ́pò-orúkọ Gíríìkì kò mú ẹni tí ó ń tọ́ka sí dájú ní àyíká lẹ́sẹ̀kẹsẹ̀. Ìtumọ̀ yìí pa àìmọ̀ọ́kàn inú orísun mọ́, àkọsílẹ̀ ìsàlẹ̀ sì ṣàlàyé àwọn ọ̀nà méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘jókòó jẹun’ gẹ́gẹ́ bí ìbámu àdánidá fún àṣà ìrọ̀gbọ̀ níbi oúnjẹ.
