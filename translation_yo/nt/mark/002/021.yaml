id: MRK.2.21
reference: Mark 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: yo
  text: Kò sí ẹni tí ó máa ń rán àlẹ̀mọ́ aṣọ tí a kò tíì fọ̀[a] mọ́ aṣọ àtijọ́ kan; bí kò bá rí bẹ́ẹ̀, àlẹ̀mọ́ tuntun náà yóò fa kúrò lára aṣọ àtijọ́ náà, yíya náà yóò sì burú sí i.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ tí a kò tíì ṣiṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí aṣọ tí a kò tíì fọ̀ ṣiṣẹ́ kí ó dín kù; bí a bá lò ó gẹ́gẹ́ bí àlẹ̀mọ́, ìdínkù rẹ̀ lè fa yíya náà pọ̀ sí i.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ohun tí ó kún un ń mú kúrò lára rẹ̀—èyí tuntun kúrò lára èyí àtijọ́.” Gbolohun Gíríìkì náà nira díẹ̀; ìtumọ̀ rẹ̀ ní àyíká ni pé àlẹ̀mọ́ tuntun náà fa kúrò lára aṣọ àtijọ́, yíya náà sì burú sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: àlẹ̀mọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹ̀yà aṣọ tí a fi ń dí ibi tí aṣọ ti ya; “àlẹ̀mọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún patch nínú àyíká yìí.
- source_word: ῥάκους ἀγνάφου
  choice: aṣọ tí a kò tíì rẹ̀
  rationale: ἄγναφος ṣàpèjúwe aṣọ tí a kò tíì ṣe ní ọ̀nà tí yóò mú un wọ́ tàbí dín kù; yíyan “tí a kò tíì rẹ̀” mú ìtumọ̀ iṣẹ́ rẹ̀ hàn ní èdè Yorùbá tó ṣeé lóye.
- source_word: ἐπιράπτει
  choice: fi ... ṣe àlẹ̀mọ́ sí
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí rírán ohun mọ́ ohun mìíràn; gbolohun Yorùbá yìí jẹ́ àdánidá, ó sì pa ìṣe rírán àlẹ̀mọ́ mọ́ aṣọ mọ́.
- source_word: ἱμάτιον παλαιόν
  choice: aṣọ àwọ̀tẹ́lẹ̀ kan
  rationale: ἱμάτιον sábà ń tọ́ka sí aṣọ òde; “aṣọ àwọ̀tẹ́lẹ̀” pa ìtumọ̀ gbogbogbò rẹ̀ mọ́ láì sọ irú aṣọ kan pàtó jù.
- source_word: εἰ δὲ μή
  choice: bí ó bá ṣe bẹ́ẹ̀
  rationale: Nínú àyíká òwe yìí, gbolohun náà ṣàfihàn àbájáde bí ẹni kan bá ṣe ohun tí a ṣẹ̀ṣẹ̀ sọ pé kò sí ẹni tó ń ṣe.
- source_word: αἴρει
  choice: já kúrò lára
  rationale: Ní àyíká aṣọ, ọ̀rọ̀ náà ṣàpèjúwe àlẹ̀mọ́ tuntun tí ó fa ara rẹ̀ kúrò lára aṣọ àtijọ́; “já kúrò lára” mú ìṣe àti àbájáde rẹ̀ hàn kedere.
- source_word: τὸ πλήρωμα
  choice: àlẹ̀mọ́ náà
  rationale: Níhìn-ín πλήρωμα ni ẹ̀yà tí ó kún ibi tí aṣọ ti ya, ìyẹn àlẹ̀mọ́; yíyan yìí ṣe kedere sí òǹkàwé.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: èyí tuntun kúrò lára èyí àtijọ́
  rationale: Ìtumọ̀ yìí pa ìfarakanra àti ìyàtọ̀ Gíríìkì láàárín tuntun àti àtijọ́ mọ́, láì mú ohun tí gbolohun náà fi sílẹ̀ ní ṣókí ṣe pàtó ju bó ṣe yẹ lọ.
- source_word: χεῖρον σχίσμα γίνεται
  choice: yíya náà yóò burú sí i
  rationale: σχίσμα jẹ́ yíya tàbí pínyà aṣọ; ọ̀nà yìí jẹ́ Yorùbá àdánidá fún àbájáde tí yíya náà fi ń pọ̀ sí i.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán àlẹ̀mọ́, ìyàtọ̀ tuntun àti àtijọ́, àti ìṣòro inú gbolohun Gíríìkì mọ́.
