language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ ìsinmi pé Jésù ń kọjá láàárín àwọn oko ọkà[a], àwọn ọmọ-ẹ̀yìn rẹ̀ sì bẹ̀rẹ̀ sí í la ọ̀nà lọ[b], bí wọ́n ti ń fa àwọn orí ọkà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “la inú ọkà tí ó dúró ní oko kọjá.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “bẹ̀rẹ̀ sí í ṣe ọ̀nà”; níbí, ó túmọ̀ sí pé wọ́n ń tẹ̀ síwájú gba inú oko, bí wọ́n ti ń fa àwọn orí ọkà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “etí ọkà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tó ṣe déédé fún gbólóhùn ìtàn tí ń mú ìṣẹ̀lẹ̀ tuntun wọlé, láì lo ọ̀rọ̀ àtijọ́ tàbí èdè líle.
- source_word: ἐν τοῖς σάββασιν
  choice: ní ọjọ́ ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, ó sábà máa ń tọ́ka sí ọjọ́ ìsinmi kan ṣoṣo nínú irú àyíká yìí.
- source_word: παραπορεύεσθαι
  choice: ń kọjá láàárín
  rationale: Ó fi ìrìn Jesu gba inú tàbí àárín oko hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: διὰ τῶν σπορίμων
  choice: láàárín oko ọkà
  rationale: σπόριμος ń tọ́ka sí oko tí a gbìn ọkà sí; ‘oko ọkà’ ṣe kedere, ó sì jẹ́ èdè àgbẹ̀ tí òǹkàwé Yorùbá lè lóye.
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìṣe tí ó bẹ̀rẹ̀.
- source_word: ὁδὸν ποιεῖν
  choice: la ọ̀nà lọ
  rationale: Ó pa àwòrán ọ̀nà mọ́, ṣùgbọ́n kò sọ pé àwọn ọmọ-ẹ̀yìn ń kọ́ ọ̀nà; ó túmọ̀ sí pé wọ́n ń tẹ̀ síwájú gba inú oko.
- source_word: τίλλοντες
  choice: wọ́n ń já
  rationale: ‘Já’ sọ ìṣe yíyan apá ọkà kúrò lára igi rẹ̀ ní kedere.
- source_word: τοὺς στάχυας
  choice: ìṣù ọkà
  rationale: ‘Ìṣù ọkà’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti tọ́ka sí orí tàbí etí ọkà tí hóró rẹ̀ wà lára rẹ̀.
- source_word: αὐτὸν
  choice: Jesu
  rationale: A tún orúkọ Jesu sọ dípò arọ́pò-orúkọ kí ẹni tí a ń tọ́ka sí lè ṣe kedere ní ẹsẹ tí a bá ka ní òun nìkan; èyí kò fi ìtumọ̀ tuntun kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ọ̀rọ̀ ọjọ́ ìsinmi
  choice: ní ọjọ́ ìsinmi
  alternative: ní àwọn ọjọ́ ìsinmi
  rationale: Ọ̀pọ̀ nínú Gíríìkì lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àdápọ̀ fún ọjọ́ ìsinmi kan ṣoṣo ní àyíká yìí; ìpinnu èdè ni, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́.
- issue: Ìtumọ̀ ὁδὸν ποιεῖν nínú àríyànjiyàn ọjọ́ ìsinmi
  choice: la ọ̀nà lọ
  alternative: ṣe ọ̀nà
  rationale: ‘La ọ̀nà lọ’ pa ìtumọ̀ ìrìn wọn gba inú oko mọ́ láì mú un dà bí ẹni pé wọ́n ń kọ́ ọ̀nà, èyí tí yóò le koko ju ohun tí àyíká sọ lọ.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ìtàn tó lọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Gbólóhùn náà tẹ̀ lé ìṣàn Gíríìkì, ṣùgbọ́n a tún un ṣe díẹ̀ kí ó lè dun bí Yorùbá àdánidá. Gbogbo àmì àlàyé [a], [b], [c] wà nínú ọ̀rọ̀ pàtàkì.
