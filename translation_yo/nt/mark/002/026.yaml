id: MRK.2.26
reference: Mark 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: yo
  text: bí ó ti wọ ilé Ọlọ́run ní àkókò Ábíátárì, olórí àlùfáà[a], tí ó sì jẹ búrẹ́dì tí a gbé kalẹ̀ níwájú Ọlọ́run[b], èyí tí kò bófin mu fún ẹnikẹ́ni láti jẹ bí kò ṣe àwọn àlùfáà, tí ó sì tún fún àwọn tí ó wà pẹ̀lú rẹ̀ ní búrẹ́dì náà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “nígbà tí Ábíátárì jẹ́ olórí àlùfáà.” Gbólóhùn náà tún lè ní ìtumọ̀ tó gbòòrò, kí ó tọ́ka sí àkókò tàbí apá ìtàn tí ó ní í ṣe pẹ̀lú Ábíátárì, olórí àlùfáà.
    reason: alternative_reading
  - marker: b
    text: Èyí ni búrẹ́dì mímọ́ tí a máa ń gbé kalẹ̀ níwájú Ọlọ́run nínú ibi mímọ́; ní ìbílẹ̀, a máa ń pè é ní “búrẹ́dì ìfihàn.”
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: bí ó ti
  rationale: Ó bẹ̀rẹ̀ àlàyé nípa ohun tí Dáfídì ṣe; ‘bí ó ti’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún agbára ìtàn yìí.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: wọ ilé Ọlọ́run
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe àti ibi náà ní ṣókí, ní Yorùbá àdánidá, tí ó sì pa ìtumọ̀ ‘ilé Ọlọ́run’ mọ́.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: ní àkókò Ábíátárì olórí àlùfáà
  rationale: ἐπί pẹ̀lú ẹ̀yà genitive lè tọ́ka sí àkókò tàbí àyíká ìtàn; yíyan yìí kò fi ìtumọ̀ ọjọ́ pàtó kan lé ọ̀rọ̀ náà lórí.
- source_word: ἄρτους τῆς προθέσεως
  choice: búrẹ́dì tí a gbé kalẹ̀ níwájú Ọlọ́run
  rationale: Ó ṣàlàyé gbólóhùn ìjọsìn náà ní èdè tí òǹkàwé òde òní lè lóye, ó sì pa èrò pé a gbé búrẹ́dì náà síwájú Ọlọ́run mọ́.
- source_word: ἔφαγεν
  choice: jẹ
  rationale: Ọ̀rọ̀ ìṣe Yorùbá tó rọrùn, tó sì bá aorist ìtàn mu.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: èyí tí kò bófin mu fún ẹnikẹ́ni láti jẹ
  rationale: ‘Kò bófin mu’ fi agbára ìfàyègbà àti òfin mímọ́ inú ἔξεστιν hàn ní Yorùbá àdánidá.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: bí kò ṣe àwọn àlùfáà
  rationale: Ó sọ ìyàsọ́tọ̀ náà kedere pé àwọn àlùfáà nìkan ni a yọ láàyè.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: tí ó sì tún fún àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Ó tẹ̀lé participle Gíríìkì náà tímọ́tímọ́, nígbà tí ó ṣì jẹ́ Yorùbá tó ṣeé kà; ohun tí ó fún wọn ṣe kedere láti inú ọ̀rọ̀ tó ṣáájú.
theological_decisions:
- issue: Gbólóhùn àkókò nípa Ábíátárì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìtàn Májẹ̀mú Láéláé
  choice: ní àkókò Ábíátárì olórí àlùfáà
  alternative: nígbà tí Ábíátárì jẹ́ olórí àlùfáà; nínú apá ìtàn nípa Ábíátárì olórí àlùfáà
  rationale: Gbólóhùn Gíríìkì lè ní ìtumọ̀ àkókò tó gbòòrò tàbí àyíká ìtàn. A pa ìfojú-diẹ̀ yìí mọ́, a kò sì yanjú ìṣòro ìbámu pẹ̀lú 1 Sámúẹ́lì 21 nípasẹ̀ ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
