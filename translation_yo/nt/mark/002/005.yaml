source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: yo
  text: Nígbà tí Jésù rí ìgbàgbọ́ wọn, ó sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé, “Ọmọ mi,[a] a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọmọkùnrin mi”; ọ̀rọ̀ Gíríìkì τέκνον jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ tí ó túmọ̀ sí “ọmọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí ... rí
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀ pàtàkì; gbólóhùn àsìkò yìí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: πίστιν αὐτῶν
  choice: ìgbàgbọ́ wọn
  rationale: Ó pa ìtumọ̀ ìgbẹ́kẹ̀lé ẹgbẹ́ náà mọ́, ó sì fi ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ hàn gẹ́gẹ́ bí Gíríìkì.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, Yorùbá ìtàn àdánidá máa ń lo àmì àsìkò tí ó ti kọjá; èyí kò yí ìṣe ọ̀rọ̀ náà padà.
- source_word: παραλυτικῷ
  choice: ọkùnrin arọ náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún ẹni tí ara rẹ̀ rọ, láìlo àpèjúwe tí ń tàbùkù sí i.
- source_word: Τέκνον
  choice: Ọmọ mi
  rationale: Àpèjúwe onífẹ̀ẹ́ ni τέκνον; “Ọmọ mi” jẹ́ àdánidá, ọlọ́lá, kò sì fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: a ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Ọ̀rọ̀ yìí sọ ìdáríjì gẹ́gẹ́ bí ohun tó jẹ́ òtítọ́ fún ẹni náà. Ìkọ̀ Yorùbá aláìlórúkọ “a” kò sọ ẹni tó ṣe ìdáríjì ní pàtó, bí passive Gíríìkì náà ṣe fi olùṣe sílẹ̀ láìdárúkọ.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, ó sì pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́.
theological_decisions:
- issue: Irú ìkéde ìdáríjì tí Jésù ṣe
  choice: “a ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́” gẹ́gẹ́ bí ìkéde taara
  alternative: “a ń dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́” tàbí “Ọlọ́run ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́”
  rationale: Ìtumọ̀ yìí mú kí ìdáríjì jẹ́ òtítọ́ fún ọkùnrin náà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀nà tàbí àkókò rẹ̀, láì sì dárúkọ Ọlọ́run níbi tí passive Gíríìkì kò ti dárúkọ olùṣe.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. “Ọmọ mi” mú ìfẹ́ inú ọ̀rọ̀ ìpè náà jáde, nígbà tí “a ti dárí ... jì” pa olùṣe ìdáríjì mọ́ láìdárúkọ.
