revisions:
- from: Nígbà tí Jésù rí ìgbàgbọ́ wọn, ó sọ fún ọkùnrin arọ náà pé, “Ọmọ mi,[a] a ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
  to: Nígbà tí Jésù rí ìgbàgbọ́ wọn, ó sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé, “Ọmọ mi,[a] a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
  rationale: The revision replaces a broad disability label with a phrase that specifically represents paralysis, avoids importing a completed-perfect nuance into the present passive forgiveness pronouncement, and aligns the footnote with the Yoruba form of address while preserving the tender, non-male-specific sense of the Greek term.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ perception of the group’s faith, his address to the paralyzed man, and the unexpressed agent in the forgiveness declaration. However, “arọ” is broader than παραλυτικός and can denote lameness or disability generally; the wording should specify paralysis more closely. The present passive pronouncement is better represented by the unmarked declarative rather than the completed-perfect nuance of “a ti dárí.”
  naturalness: The revised wording is idiomatic, respectful Standard Yoruba with tone marks. “Ọmọ mi” is a natural tender form of address in Yoruba, and “ọkùnrin tí ara rẹ̀ rọ” is clearer and less potentially stigmatizing than using “arọ” substantivally.
  terminology: “Ìgbàgbọ́,” “ẹ̀ṣẹ̀,” and the indirect-agent forgiveness construction are appropriate. The footnote is adjusted so that its alternative accurately corresponds to the Yoruba rendering and the lexical range of τέκνον.
  issues:
  - severity: medium
    issue: “Ọkùnrin arọ náà” is not sufficiently specific for παραλυτικῷ.
    rationale: Arọ can refer broadly to a lame or physically disabled person, whereas παραλυτικός specifically denotes a paralyzed person. “Ọkùnrin tí ara rẹ̀ rọ náà” retains the intended condition more precisely and respectfully.
  - severity: low
    issue: “A ti dárí … jì ọ́” adds a completed-perfect aspect.
    rationale: The Greek ἀφίενται is present passive. Yoruba’s unmarked “a dárí … jì ọ́” gives a direct pronouncement without emphasizing completion, while still leaving the agent unstated.
  - severity: low
    issue: The existing footnote’s stated alternative does not clearly reflect the lexical distinction intended.
    rationale: Since the main rendering is “Ọmọ mi,” the useful alternative is “Ọmọkùnrin mi” (“Son”), while the note should explain that τέκνον itself means a tender “child.”
  revised_text: Nígbà tí Jésù rí ìgbàgbọ́ wọn, ó sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé, “Ọmọ mi,[a] a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
  revised_footnotes:
