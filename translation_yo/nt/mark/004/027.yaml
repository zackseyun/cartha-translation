  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìṣe àtúnṣe ‘sùn ... jí ní òru àti ní ọ̀sán,’ ìtẹ̀lé ‘hù ... ga sí i,’ àti àìmọ̀ afúnrúgbìn náà mọ́. Àmọ́ ‘kò tilẹ̀ mọ’ lè fi ìtẹnumọ́ ‘kò mọ́ rárá’ kún un díẹ̀ ju αὐτός ṣe béèrè lọ; ‘kò ṣe mọ̀’ jẹ́ ọ̀nà tó dájú síi láti fi ìyàtọ̀/concession náà hàn.'
