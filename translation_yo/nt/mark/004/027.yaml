source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: yo
  text: ó sì máa ń sùn, ó sì máa ń jí ní òru àti ní ọ̀sán; irúgbìn náà sì ń hù, ó sì ń ga sí i[a], bí òun fúnra rẹ̀ kò ṣe mọ̀ bí ó ti ń ṣẹlẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó sì ń dàgbà’ tàbí ‘ó sì ń gùn sí i.’ Ọ̀rọ̀ kejì náà ní pàtó ń tọ́ka sí jíjẹ́ gígùn tàbí pípọ̀ sí ní gíga.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: ‘gẹ́gẹ́ bí òun fúnra rẹ̀ kò ṣe mọ̀’; ìtumọ̀ nínú àyíká ni pé òun fúnra rẹ̀ kò mọ bí ó ti ń ṣẹlẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ó sì máa ń sùn
  rationale: Àpẹẹrẹ ‘máa ń’ fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí subjunctive ìsinsìnyí ṣe ń ṣiṣẹ́ nínú àkójọpọ̀ ìṣe inú òwe yìí.
- source_word: ἐγείρηται
  choice: ó sì máa ń jí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí jí lójú oorun tàbí dìde kúrò lójú oorun; ‘jí’ jẹ́ èdè Yorùbá àdánidá tí kò mú èrò àjíǹde wọ inú ẹsẹ yìí.
- source_word: νύκτα καὶ ἡμέραν
  choice: ní òru àti ní ọ̀sán
  rationale: Ó pa ìtẹ̀lé òru àti ọ̀sán mọ́, ó sì fi bí àkókò ṣe ń lọ ní gbogbo ìgbà hàn.
- source_word: ὁ σπόρος
  choice: irúgbìn náà
  rationale: Àfihàn náà tọ́ka padà sí irúgbìn tí a ti fún ní inú òwe náà; ‘irúgbìn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tí a gbìn.
- source_word: βλαστᾷ
  choice: ń hù
  rationale: ‘Hù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìbẹ̀rẹ̀ ìdàgbàsókè ohun ọ̀gbìn.
- source_word: μηκύνηται
  choice: ń ga sí i
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ohun tí ń gùn tàbí ń pọ̀ sí ní gíga. ‘Ń ga sí i’ pa ìtumọ̀ pàtó yìí mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: bí òun fúnra rẹ̀ kò tilẹ̀ mọ bí ó ti ń ṣẹlẹ̀
  rationale: ‘Kò tilẹ̀ mọ’ fi ìbáṣepọ̀ ìyàtọ̀ inú gbólóhùn náà hàn lọ́nà àdánidá, ‘òun fúnra rẹ̀’ sì tẹnu mọ́ αὐτός. Fífikun ‘bí ó ti ń ṣẹlẹ̀’ sọ ohun tí ọkùnrin náà kò mọ̀ di mímọ̀ láìsọ ìdí tàbí aṣojú ìdàgbàsókè náà.
theological_decisions:
- issue: Aṣojú tàbí agbára tó ń mú irúgbìn dàgbà nínú òwe náà
  choice: A fi bí ìdàgbàsókè náà ṣe ń ṣẹlẹ̀ sílẹ̀ láìṣàlàyé rẹ̀, nígbà tí a tẹnu mọ́ pé afúnrúgbìn náà kò mọ ọ̀nà rẹ̀.
  alternative: Láti sọ ní tààrà pé Ọlọ́run ni ó ń mú un dàgbà, tàbí pé ìṣẹ̀lẹ̀ àdánidá lásán ni.
  rationale: Ẹsẹ náà kò dárúkọ aṣojú ìdàgbàsókè náà; ó dojú kọ àìmọ̀ afúnrúgbìn àti bí irúgbìn ṣe ń dàgbà. Ìtumọ̀ náà kò gbọdọ̀ yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ ìpilẹ̀ fi sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. ‘Máa ń’ mú ìṣe tí ó ń ṣẹlẹ̀ léraléra jáde, ‘ń hù’ àti ‘ń ga sí i’ sì pa ìtẹ̀sí ìdàgbàsókè irúgbìn mọ́. A kò fi ẹni tàbí agbára tí ń fa ìdàgbàsókè náà kún ọ̀rọ̀ ìpilẹ̀.
