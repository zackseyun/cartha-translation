  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: yo
  text: Bí ó sì ti ń fúnrúgbìn, díẹ̀ nínú irúgbìn náà ṣubú sí ẹ̀gbẹ́ ọ̀nà,[a] àwọn ẹyẹ sì wá, wọ́n sì jẹ ẹ́ run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́bàá ọ̀nà.” Gbólóhùn Gíríìkì náà túmọ̀ sí ní ẹ̀gbẹ́ tàbí lẹ́gbẹ̀ẹ́ ọ̀nà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Bí ó sì ti ń fúnrúgbìn
  rationale: Ọ̀rọ̀ yìí fi ohun tó ṣẹlẹ̀ ní àkókò fífúnrúgbìn hàn ní Yorùbá àdánidá, láìfi gbólóhùn líle bí ‘ó sì ṣẹlẹ̀ nígbà tí’ kún un.
- source_word: ὃ μὲν
  choice: irúgbìn kan
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́ni náà pẹ̀lú μέν ń tọ́ka sí apá kan lára irúgbìn tí a ń fún; ‘irúgbìn kan’ mú ìtumọ̀ apá yìí jáde ní Yorùbá.
- source_word: ἔπεσεν
  choice: bọ́
  rationale: ‘Bọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún píπτω ní àyíká yìí.
- source_word: παρὰ τὴν ὁδόν
  choice: sí ẹ̀gbẹ́ ọ̀nà
  rationale: παρά pẹ̀lú ọ̀rọ̀ accusative níbí túmọ̀ sí ibi tó wà lẹ́gbẹ̀ẹ́ ọ̀nà; ‘sí ẹ̀gbẹ́ ọ̀nà’ jẹ́ àdánidá, ó sì pa àwòrán oko mọ́.
- source_word: τὰ πετεινὰ
  choice: àwọn ẹyẹ
  rationale: πετεινά túmọ̀ sí àwọn ẹyẹ; kò sí àfikún ‘ojú ọ̀run’ nínú ẹsẹ yìí.
- source_word: κατέφαγεν
  choice: jẹ ẹ́ run
  rationale: ‘Jẹ ... run’ pa agbára ọ̀rọ̀ àkópọ̀ κατεσθίω mọ́ ju ‘jẹ’ lásán lọ.
- source_word: αὐτό
  choice: ẹ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí irúgbìn gẹ́gẹ́ bí odidi kan; ‘ẹ́’ jẹ́ ọ̀nà àdánidá láti tọ́ka sí i nínú gbólóhùn Yorùbá yìí.
