source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: yo
  text: Nígbà tí a jí i[a], ó bá afẹ́fẹ́ náà wí, ó sì sọ fún òkun náà[b] pé, “Dákẹ́! Di ẹnu rẹ mọ́!”[c] Afẹ́fẹ́ náà sì dáwọ́ dúró, ìdákẹ́jẹ́ ńlá sì wáyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè tún túmọ̀ sí, “lẹ́yìn tí ó jí.”
    reason: lexical_alternative
  - marker: b
    text: Èyí ni Òkun Gálílì; ọ̀rọ̀ Gíríìkì náà ní, “òkun.”
    reason: cultural_note
  - marker: c
    text: Ní ti gidi, Gíríìkì ní àṣẹ méjì pé, “Dákẹ́! Di ẹnu rẹ mọ́!” Ní ìtumọ̀ àṣà, a sábà máa ń sọ pé, “Àlàáfíà! Dákẹ́!”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: Nígbà tí ó jí
  rationale: Ó fi ipa àkókò ti participle náà hàn ní Yorùbá àdánidá, láì pinnu ní pàtó bóyá Jesu jí fúnra rẹ̀ tàbí àwọn ọmọ-ẹ̀yìn ló jí i.
- source_word: ἐπετίμησεν
  choice: ó bá … wí
  rationale: ‘Bá … wí’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìbáwí aláṣẹ, ó sì lágbára ju ọ̀rọ̀ ìkìlọ̀ lásán lọ.
- source_word: ἀνέμῳ
  choice: afẹ́fẹ́ náà
  rationale: Orúkọ náà túmọ̀ sí ‘afẹ́fẹ́’; àyíká ló fi hàn pé afẹ́fẹ́ ìjì ni.
- source_word: θαλάσσῃ
  choice: òkun
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ‘òkun’ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí adágún omi.
- source_word: Σιώπα
  choice: Dákẹ́!
  rationale: Àṣẹ kúkúrú, tààrà, tó sì lágbára ni èyí, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: πεφίμωσο
  choice: Di ẹnu rẹ mọ́!
  rationale: Ó pa àwòrán fífi ìdí ẹnu mú nínú φιμόω mọ́, ó sì jẹ́ àṣẹ Yorùbá tí a lè lóye nígbà tí a bá ń sọ̀rọ̀ sí òkun bí ẹni pé ó ní ẹnu.
- source_word: ἐκόπασεν
  choice: dáwọ́ dúró
  rationale: Ó sọ ní kedere pé afẹ́fẹ́ náà dá tàbí ṣíwọ́ fífẹ́.
- source_word: γαλήνη μεγάλη
  choice: ìparọ́rọ́ ńlá
  rationale: ‘Ìparọ́rọ́’ fi ìdákẹ́jẹ́ omi àti ojú ọjọ́ hàn, ‘ńlá’ sì pa ìtẹnumọ́ Máàkù mọ́.
- source_word: ἐγένετο
  choice: wáyé
  rationale: Ọ̀nà Yorùbá àdánidá ni láti sọ pé ipò tuntun kan bẹ̀rẹ̀ sí í sí.
theological_decisions:
- issue: Bóyá kí a rọ àṣẹ Jesu sí òkun di gbólóhùn àṣà pé ‘Àlàáfíà! Dákẹ́ jẹ́ẹ́!’ tàbí kí a pa àwòrán ọ̀rọ̀ Gíríìkì mọ́
  choice: “Dákẹ́! Di ẹnu rẹ mọ́!”
  alternative: “Àlàáfíà! Dákẹ́ jẹ́ẹ́!”
  rationale: Gíríìkì kò ní orúkọ tó túmọ̀ sí ‘àlàáfíà’; àṣẹ méjì ló ní, èkejì sì lo àwòrán dídi ẹnu. Ìtumọ̀ yìí pa agbára àti ìmúná rẹ̀ mọ́.
- issue: Bóyá kí θάλασσα jẹ́ ‘òkun’ tàbí ‘adágún omi’
  choice: òkun
  alternative: adágún omi
  rationale: ‘Òkun’ ni ọ̀rọ̀ orísun sọ. Àkọ́lé ìsàlẹ̀ ṣàlàyé ibi náà láì yí ọ̀rọ̀ inú ẹsẹ̀ padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘bá … wí’ fún ìbáwí aláṣẹ, ‘ìparọ́rọ́’ fún ìdákẹ́jẹ́ ojú omi, a sì pa àwòrán líle ti dídi ẹnu mọ́ nínú àṣẹ Jesu.
