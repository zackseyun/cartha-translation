review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ èdè Gíríìkì ní pàtàkì: Jesu bá afẹ́fẹ́ wí, ó sì pàṣẹ fún òkun ní àṣẹ méjì; afẹ́fẹ́ náà dáwọ́ dúró, ìdákẹ́jẹ́ ńlá sì wáyé. Ṣùgbọ́n «Nígbà tí ó jí» sọ ìṣe náà di ti ara Jesu nìkan, nígbà tí διεγερθείς jẹ́ participle passive tí ó lè túmọ̀ sí pé a jí i. «Nígbà tí a jí i» pa èyí mọ́ dáadáa.'
  naturalness: «Nígbà tí a jí i» jẹ́ Yorùbá boṣewa tí ó dára. «Ìdákẹ́jẹ́ ńlá» ṣeé lóye, ó sì jẹ́ ọ̀nà tó wọ́pọ̀ ju «ìparọ́rọ́ ńlá» lọ fún ìfọ̀kànbalẹ̀ ojú omi lẹ́yìn ìjì. «Di ẹnu rẹ mọ́!» pa àwòrán dídi ẹnu mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ rẹ gbọdọ̀ jẹ́ gígéde àti ìbámu pẹ̀lú ọ̀rọ̀ náà.
  terminology: «Ó bá afẹ́fẹ́ náà wí» yẹ fún ἐπετίμησεν; «òkun náà» tẹ̀ lé θάλασσα; «Dákẹ́! Di ẹnu rẹ mọ́!» ṣàfihàn Σιώπα, πεφίμωσο láì fi «àlàáfíà» kún ọ̀rọ̀ inú ẹsẹ̀.
  issues:
  - severity: medium
    issue: «Nígbà tí ó jí» yí participle passive διεγερθείς padà sí ìṣe active.
    rationale: Bí ó tilẹ̀ jẹ́ pé participle náà lè ní ìmọ̀ intransitive ní àyíká, fọ́ọ̀mù passive rẹ̀ àti àyíká ẹsẹ̀ tó ṣáájú ń tọ́ka sí pé a jí Jesu. Ìtumọ̀ impersonal Yoruba pa àìdánilójú ti ẹni tó jí i mọ́.
  - severity: low
    issue: Àkọsílẹ̀ [c] lo «Jẹ́ kí a dí ẹnu rẹ», èyí tí kò bá àṣẹ Gíríìkì tàbí ìtumọ̀ inú ẹsẹ̀ mu.
    rationale: πεφίμωσο jẹ́ àṣẹ taara sí ẹni/ohun tí a ń bá sọ̀rọ̀, kì í ṣe ìpè sí ‘àwa’ pé kí a ṣe ìṣe kan.
  - severity: low
    issue: «Ìparọ́rọ́ ńlá» kì í ṣe ọ̀rọ̀ tó wọ́pọ̀ jù fún òǹkàwé Yorùbá òde òní.
    rationale: «Ìdákẹ́jẹ́ ńlá» jẹ́ kedere, ó sì ṣàfihàn γαλήνη μεγάλη ní ti ojú omi àti afẹ́fẹ́.
