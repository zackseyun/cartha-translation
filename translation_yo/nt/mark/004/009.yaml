  text: καὶ ἔλεγεν· ⸂Ὃς ἔχει⸃ ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: yo
  text: Ó sì ń wí pé, “Ẹnikẹ́ni tí ó bá ní etí láti fi gbọ́, kí ó gbọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì pẹkipẹki, “Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bá καὶ mu, láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἔλεγεν
  choice: ń wí
  rationale: Àmì “ń” fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì ṣe àfihàn abala imperfect ti ọ̀rọ̀ Gíríìkì láìsọ pé ó ń tún un sọ léraléra dandan.
- source_word: Ὃς ἔχει
  choice: Ẹnikẹ́ni tí ó bá ní
  rationale: Èyí fi ipa àpapọ̀/generic ti gbólóhùn relative náà hàn ní Yorùbá àdánidá; “bá” ń mú ìtumọ̀ ẹni yòówù tó bá bá àpèjúwe náà mu jáde.
- source_word: ὦτα
  choice: etí
  rationale: “Etí” ni ìtumọ̀ tààrà; orúkọ Yorùbá kì í sábà fi ìyàtọ̀ ẹyọ àti ọ̀pọ̀ hàn nínú irú gbólóhùn yìí, nítorí náà kò yẹ kí a fi “méjèèjì” kún un.
- source_word: ἀκούειν
  choice: láti fi gbọ́
  rationale: Ó so iṣẹ́ etí mọ́ gbígbọ́ ní ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa àtúnlò gbọ́/ἀκούω mọ́.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Ìlànà “kí ó” fi imperative ẹni-kẹta hàn ní Yorùbá, nígbà tí “gbọ́” pa ìró ọ̀rọ̀ kan náà mọ́ pẹ̀lú ἀκούειν.
theological_decisions:
- issue: Ọ̀rọ̀ akọ ẹyọ tí a lò fún gbogbo ènìyàn nínú òwe náà
  choice: Ẹnikẹ́ni ... kí ó ...
  alternative: Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́.
  rationale: Ὃς jẹ́ akọ ẹyọ ní gírámà Gíríìkì, ṣùgbọ́n ó ń tọ́ka sí ẹni yòówù, kì í ṣe ọkùnrin nìkan. Yorùbá lè pa ẹyọ àti ìtumọ̀ àpapọ̀ náà mọ́ láìfi abo tàbí akọ sí i.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; “ń wí” pa abala imperfect mọ́, “kí ó gbọ́” sì jẹ́ àṣẹ ẹni-kẹta tó jẹ́ àdánidá.
