  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: yo
  text: Nítorí kò sí ohun tí a fi pamọ́ bí kò ṣe kí a lè fi í hàn[a]; bẹ́ẹ̀ ni kò sí ohun tí ó di àṣírí bí kò ṣe kí ó lè wá sí gbangba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Nítorí kò sí ohun tí a fi pamọ́ bí kò ṣe pé a ó fi í hàn … bí kò ṣe pé yóò wá sí gbangba.” Àwọn gbólóhùn Gíríìkì tí ἵνα bẹ̀rẹ̀ lè tọ́ka sí ète tàbí àbájáde.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “wá sínú gbangba,” tàbí “wá sí ibi tí ó hàn gbangba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àyíká ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé.
- source_word: κρυπτόν
  choice: ohun tí a fi pamọ́
  rationale: Ó fi ìtumọ̀ ohun tí ó fara sin tàbí tí a pa mọ́ hàn ní Yorùbá àdánidá, láì fi dandan sọ pé àṣírí ni.
- source_word: ἐὰν μὴ ἵνα
  choice: bí kò ṣe kí ... lè
  rationale: Ìtumọ̀ yìí pa ìrísí àyọkà àfi-kún-pẹ̀lú-èrò mọ́, nígbà tí ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: φανερωθῇ
  choice: a lè fi í hàn
  rationale: Ó pa ohùn àìṣe ti Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá, ó sì lè túmọ̀ sí mímú ohun di mímọ̀ tàbí kedere.
- source_word: ἀπόκρυφον
  choice: àṣírí
  rationale: Ó ṣàfihàn ohun tí a mú kúrò ní ojú tàbí tí kò hàn, ó sì yà díẹ̀ sí ‘fi pamọ́’ nínú ìlà àkọ́kọ́.
- source_word: ἐγένετο
  choice: ó di
  rationale: Ó mú ìtumọ̀ wíwọ inú ipò kan jáde ní Yorùbá kúkúrú, àdánidá.
- source_word: ἔλθῃ εἰς φανερόν
  choice: wá sí gbangba
  rationale: Ó pa àwòrán ìṣípò nínú ἔλθῃ εἰς mọ́, ó sì sọ ‘sí ibi tí ó hàn gbangba’ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ète tàbí àbájáde nínú àwọn gbólóhùn ἵνα méjèèjì
  choice: bí kò ṣe kí ... lè
  alternative: bí kò ṣe pé ... yóò
  rationale: ἵνα sábà máa ń fi ète hàn, ṣùgbọ́n ó tún lè sún mọ́ àbájáde ní Gíríìkì Koine. ‘Kí ... lè’ pa àìdánilójú yẹn mọ́ láì sọ ní pàtó pé Ọlọ́run ló fa ìfarapamọ́ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti kedere fún òǹkàwé òde òní; a lo àfiwé alákànṣe méjèèjì láti pa ìṣọ̀kan àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
