  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ gbogbogbò ti Gíríìkì náà hàn dáadáa: γάρ jẹ́ ìdí/àlàyé; κρυπτόν àti ἀπόκρυφον ni a túmọ̀ ní ọ̀nà tó yẹ; ‘bí kò ṣe kí ... lè’ ń pa agbára ète tí ἵνα ní mọ́ láì sọ pé ète náà dájú ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ. ‘ó di àṣírí’ tún ń ṣàfihàn ἐγένετο (‘di’/‘wá sínú ipò kan’) dáadáa. Àmọ́ àlàyé ẹsẹ̀ ìsàlẹ̀ b tí ń pe ara rẹ̀ ní ìtumọ̀ tààràtà kò fi εἰς φανερόν hàn lọ́nà pípé, nítorí ‘ohun tí ó hàn gbangba’ ń tọ́ka sí ohun kan dípò ‘ní ibi/ní àyè gbangba.’'
