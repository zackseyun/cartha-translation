id: MRK.4.11
reference: Mark 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ẹ̀yin ni a ti fi àṣírí ìjọba Ọlọ́run fún, ṣùgbọ́n fún àwọn tí ó wà níta, ohun gbogbo ń wáyé nípasẹ̀ àwọn àkàwé,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: àṣírí
  rationale: Ó túmọ̀ sí ohun tí ó ti farapamọ́ ṣùgbọ́n tí Ọlọ́run ń fi hàn, kì í ṣe ohun àdììtú tí ènìyàn lè tú nìkan.
- source_word: τοῖς ἔξω
  choice: àwọn tí ó wà níta
  rationale: Ìtumọ̀ gígúnná tí ó pa àwòrán ìyàtọ̀ láàárín àwọn inú àti àwọn òde mọ́ láìṣe àfikún ẹni tí wọ́n jẹ́.
- source_word: ἐν παραβολαῖς
  choice: nípasẹ̀ àwọn àkàwé
  rationale: Ó fi παραβολαί hàn gẹ́gẹ́ bí ọ̀nà tí ohun gbogbo fi ń dé bá àwọn tí ó wà níta, ní ìbámu pẹ̀lú γίνεται.
- source_word: γίνεται
  choice: ń wáyé
  rationale: Ó pa ìtumọ̀ alágbára ‘ṣẹlẹ̀/ń dé’ mọ́, dípò yíyí ọ̀rọ̀ náà sí ‘jẹ́’ lásán.
theological_decisions:
- issue: Bí a ṣe fi àṣírí ìjọba náà fún àwọn ọmọ-ẹ̀yìn
  choice: a ti fi ... fún
  alternative: a ti fún yín ní òye àṣírí náà
  rationale: Perfect passive δέδοται sọ nípa fífúnni, ṣùgbọ́n kò sọ ní tààrà ẹni tí ó fúnni tàbí pé ohun tí a fún wọn jẹ́ ‘òye’; a kò fi àwọn àlàyé wọ̀nyẹn kún un.
- issue: Ìbáṣepọ̀ ‘ohun gbogbo’ àti àwọn àkàwé
  choice: ohun gbogbo ń wáyé nípasẹ̀ àwọn àkàwé
  alternative: ohun gbogbo jẹ́ àkàwé
  rationale: Yíyan ‘ń wáyé’ pa ìṣòro àti ìfọ̀rọ̀wérọ̀ inú γίνεται mọ́, ó sì yẹra fún dídín gbólóhùn náà kù sí ìdánimọ̀ lasan.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ó sì ń sọ’ ń ṣàfihàn imperfect ἔλεγεν; ‘ẹ̀yin’ fún ὑμῖν ní ìtẹnumọ́; a kò sì ṣàlàyé ‘àwọn tí ó wà níta’ kọjá bí orísun ṣe sọ.
