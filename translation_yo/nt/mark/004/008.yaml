source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: yo
  text: Àwọn irúgbìn mìíràn[a] sì bọ́ sí ilẹ̀ rere, wọ́n sì ń so èso; wọ́n ń hù sókè, wọ́n ń pọ̀ sí i, wọ́n sì ń mú èso jáde—ọ̀kan ní ìlọ́po ọgbọ̀n, ọ̀kan ní ìlọ́po ọgọ́ta, àti ọ̀kan ní ìlọ́po ọgọ́rùn-ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Àwọn mìíràn,” níbi tí a ti lóye “irúgbìn” láti inú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Àwọn irúgbìn mìíràn
  rationale: Ọ̀rọ̀ ajẹtífù aláìlẹ́mìí ọ̀pọ̀ ni a lò bí ọ̀rọ̀-orúkọ, ó sì ń tọ́ka sí irúgbìn inú àkàwé náà; a fi “irúgbìn” kún un kí Yorùbá lè ṣe kedere, kí ó sì dùn mọ́ etí.
- source_word: γῆν τὴν καλήν
  choice: ilẹ̀ rere
  rationale: Nínú ọ̀rọ̀ iṣẹ́ àgbẹ̀ yìí, γῆ túmọ̀ sí ilẹ̀ tí ó dára fún fífúnrúgbìn, kì í ṣe agbègbè tàbí orílẹ̀-èdè.
- source_word: ἐδίδου καρπὸν
  choice: wọ́n sì ń so èso
  rationale: Ìṣe àìparí náà fi ìṣe tí ń bá a lọ hàn; “ń so èso” jẹ́ ọ̀nà Yorùbá àdánidá fún ohun ọ̀gbìn tí ń mú èso wá.
- source_word: ἀναβαίνοντα
  choice: wọ́n ń hù sókè
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀, ọ̀rọ̀ náà ń sọ nípa bí ohun ọ̀gbìn ṣe ń yọ, tí ó sì ń ga sókè.
- source_word: αὐξανόμενα
  choice: wọ́n ń pọ̀ sí i
  rationale: Ìtumọ̀ yìí pa èrò ìlọsíwájú àti ìbísí mọ́, kò sì da a pọ̀ mọ́ ἀναβαίνοντα.
- source_word: ἔφερεν
  choice: wọ́n sì ń mú èso jáde
  rationale: Ìṣe àìparí náà ń fi ìmújáde tí ń bá a lọ hàn, ó sì pa àtúnsọ ìtumọ̀ èso inú orísun mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ọ̀kan ní ọgbọ̀n ìlọ́po, ọ̀kan ní ọgọ́ta ìlọ́po, àti ọ̀kan ní ọgọ́rùn-ún ìlọ́po
  rationale: Àtúnsọ ἓν fi ìpínkiri hàn—ọ̀kọ̀ọ̀kan ní ìwọ̀n èso tirẹ̀—nígbà tí “ìlọ́po” sọ ìbáṣepọ̀ ìkórè sí iye tí a fúnrúgbìn ní kedere.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpéwọ̀n, ọ̀wọ̀, àti èyí tí ó yé àwọn òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìtẹ̀síwájú àwọn ìṣe inú Gíríìkì mọ́.
