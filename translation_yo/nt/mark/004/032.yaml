id: MRK.4.32
reference: Mark 4:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: yo
  text: àti nígbà tí a bá gbìn ín, ó máa ń hù sókè, ó sì di èyí tí ó tóbi ju gbogbo ewéko inú ọgbà lọ. Ó máa ń yọ àwọn ẹ̀ka ńlá, tó bẹ́ẹ̀ tí àwọn ẹyẹ ojú ọ̀run[a] fi lè tẹ́ ìtẹ́[b] lábẹ́ òjìji rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹyẹ ọ̀run,” tàbí gẹ́gẹ́ bí a ti máa ń sọ ní àṣà, “àwọn ẹyẹ ojú afẹ́fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbé,” tàbí “tẹ̀ dó.” Ó ṣeé ṣe kí ọ̀rọ̀ yìí rántí àwòrán inú Májẹ̀mú Láéláé níbi tí àwọn ẹyẹ ti rí ààbò nínú igi ńlá (fún àpẹẹrẹ, Ìsíkíẹ́lì 17:23; Dáníẹ́lì 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: a bá fún un
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣeyọrí aláìlópìn lẹ́yìn ὅταν; ‘nígbà tí a bá fún un’ jẹ́ Yorùbá àdánidá fún ‘when it is sown,’ ó sì pa àwòrán fífún irúgbìn mọ́.
- source_word: ἀναβαίνει
  choice: ó máa ń hù sókè
  rationale: Nínú ọ̀rọ̀ iṣẹ́ àgbẹ̀, ó túmọ̀ sí bí ohun ọ̀gbìn ṣe ń yọ láti inú ilẹ̀ tí ó sì ń dàgbà sókè.
- source_word: γίνεται
  choice: ó sì máa ń tóbi
  rationale: Ó fi ipò tí ohun ọ̀gbìn dé lẹ́yìn ìdàgbàsókè hàn; ‘máa ń tóbi’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àbájáde náà.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: tóbi ju gbogbo ewéko inú ọgbà lọ
  rationale: ‘Ewéko inú ọgbà’ bo àwọn ewé tàbí ohun ọ̀gbìn ọgbà láì dín ìtumọ̀ rẹ̀ kù sí ẹ̀fọ́ jíjẹ nìkan; ‘tóbi ju ... lọ’ tún pa ìfiwéra Gíríìkì mọ́.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: ó máa ń yọ àwọn ẹ̀ka ńlá
  rationale: ‘Yọ àwọn ẹ̀ka’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun ọ̀gbìn tí ń mú ẹ̀ka jáde.
- source_word: ὥστε δύνασθαι
  choice: tó bẹ́ẹ̀ tí ... fi lè
  rationale: Ìkọ̀lé yìí fi àbájáde hàn gẹ́gẹ́ bí ὥστε pẹ̀lú ọ̀rọ̀ àìlẹ́ni ṣe rí.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: sábẹ́ ibòji rẹ̀
  rationale: ‘Ibòji’ jẹ́ ọ̀rọ̀ àdánidá fún ìdáàbòbò tí òjìji ohun ọ̀gbìn ń pèsè.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ̀kipẹ̀ki, ó sì jẹ́ àṣà ọ̀rọ̀ Ìwé Mímọ́ tí ó yé àwọn òǹkàwé Yorùbá.
- source_word: κατασκηνοῦν
  choice: tẹ́ ìtẹ́
  rationale: Ní ti ẹyẹ, ‘tẹ́ ìtẹ́’ sọ àwòrán ibùgbé wọn ní kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tún lè túmọ̀ sí gbé tàbí tẹ̀ dó.
theological_decisions:
- issue: Àwòrán àwọn ẹyẹ tí ń rí ibùgbé lábẹ́ ẹ̀ka
  choice: A pa àwòrán náà mọ́ ní tààrà láì ṣàlàyé ìtumọ̀ rẹ̀ nínú ẹsẹ̀.
  alternative: Lílo ‘gbé’ tàbí ‘tẹ̀ dó’ láti pa ìró àwọn àwòrán igi ìjọba inú Májẹ̀mú Láéláé mọ́ sí i.
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà rántí Ìsíkíẹ́lì 17:23 àti Dáníẹ́lì 4:12, ṣùgbọ́n Gíríìkì kò túmọ̀ àwòrán náà fúnra rẹ̀. Ìtumọ̀ náà kò gbé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan wọ ẹsẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn láti lóye ni a lò. Àmì ohùn wà níbi tí ó yẹ. ‘Máa ń’ mú ìṣe tí ó sábà máa ń ṣẹlẹ̀ nínú àkàwé náà jáde, nígbà tí ‘tó bẹ́ẹ̀ tí ... fi lè’ pa ìtumọ̀ àbájáde mọ́.
