id: MRK.4.12
reference: Mark 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: yo
  text: "kí ó lè jẹ́ pé,\n\n“Bí wọ́n ti ń wò, kí wọ́n máa wò,\n    kí wọ́n má sì fòye mọ̀ [a];\nbí wọ́n ti ń gbọ́, kí wọ́n máa gbọ́,\n    kí wọ́n má sì lóye [c],\nkí wọ́n má bàa yí padà [b],\n    kí a sì dárí jì wọ́n.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí wọ́n má sì fi òye rí ohun tí wọ́n ń wò.”
    reason: lexical_alternative
  - marker: b
    text: “Má bàa yí padà” tún lè túmọ̀ sí “má bàa padà,” tàbí, nínú àyíká yìí, “má bàa ronúpìwàdà.”
    reason: lexical_alternative
  - marker: c
    text: Jésù ń mú ọ̀rọ̀ Aísáyà 6:9–10 wá sí ìrántí; ó sì pa ìnira tó wà láàárín ìdájọ́ Ọlọ́run àti bí àwọn ènìyàn kò ṣe dáhùn mọ́.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè jẹ́ pé
  rationale: Ó mú èrò ìdí tàbí àbájáde inú Gíríìkì wá sí Yorùbá láì sọ ọ́ di àlàyé lásán.
- source_word: βλέποντες βλέπωσι
  choice: Bí wọ́n ti ń wò, kí wọ́n máa wò
  rationale: Àtúnṣe ọ̀rọ̀-ìṣe náà pa ìtẹnumọ́ àti ìró àsọyé Aísáyà mọ́, bí ó tilẹ̀ jẹ́ pé ó mọ̀ọ́mọ̀ dà bí àdììtú.
- source_word: ἴδωσιν
  choice: fòye mọ̀
  rationale: Ó yà ìfòye-rí sí ohun kan sọ́tọ̀ kúrò nínú wíwo lásán, ó sì bá ìtumọ̀ ‘perceive/discern’ mu.
- source_word: ἀκούοντες ἀκούωσι
  choice: bí wọ́n ti ń gbọ́, kí wọ́n máa gbọ́
  rationale: Ó pa ìlò ọ̀rọ̀ méjì tí ó jọra mọ́, láti fi ìtẹnumọ́ àsọyé náà hàn.
- source_word: συνιῶσιν
  choice: lóye
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún mímọ ìtumọ̀ tàbí òye ohun tí a gbọ́.
- source_word: μήποτε
  choice: kí wọ́n má bà á
  rationale: Ìlò yìí pa agbára ìkìlọ̀ pé ohun kan lè ṣẹlẹ̀ mọ́, tí kò sì sọ ọ́ di àbájáde lásán.
- source_word: ἐπιστρέψωσιν
  choice: yí padà
  rationale: Ó pa àwòrán yíyí tàbí pípadà mọ́, láì fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó túmọ̀ sí ìrònúpìwàdà sínú ọ̀rọ̀ pàtó náà.
- source_word: ἀφεθῇ αὐτοῖς
  choice: kí a sì dárí jì wọ́n
  rationale: Ọ̀nà àìsọ ẹni tó ṣe ìṣe yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ẹni tó ń dárí jì mọ́ gẹ́gẹ́ bí ẹni tí a kò dárúkọ, bí ìṣe aláìlórúkọ inú Gíríìkì.
theological_decisions:
- issue: Bóyá ἵνα àti μήποτε ń fi ète hàn tàbí àbájáde, àti bóyá òwe náà ń dí ìrònúpìwàdà lọ́wọ́
  choice: 'A pa èdè tó dà bí ti ète mọ́: “kí ó lè jẹ́ pé … kí wọ́n má bà á …”'
  alternative: “tó fi jẹ́ pé … bí bẹ́ẹ̀ kọ́ wọ́n ì bá yí padà”
  rationale: Ọ̀rọ̀ Gíríìkì mọ̀ọ́mọ̀ pa ìnira tó wà láàárín ìdájọ́ Ọlọ́run àti àìdáhùn àwọn ènìyàn mọ́; ìtumọ̀ kò gbọ́dọ̀ tú ìnira náà sí ọ̀nà ẹ̀kọ́ kan ṣoṣo.
- issue: Ìtumọ̀ ἐπιστρέψωσιν nípa ìrònúpìwàdà
  choice: yí padà
  alternative: ronúpìwàdà
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ìrònúpìwàdà nínú àyíká Aísáyà, ṣùgbọ́n ìtumọ̀ rẹ̀ gbòòrò ju ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtó náà lọ; àlàyé ìsàlẹ̀ pa àǹfààní méjèèjì mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó lọ́lá, tó sì ṣeé lóye ni a lò. Àtúnṣe “wò … wò” àti “gbọ́ … gbọ́” jẹ́ mọ̀ọ́mọ̀ láti pa ìró àsọyé Gíríìkì àti Aísáyà mọ́; a kò sọ ọ́ di gbolohun Yorùbá tó rọrùn débi tí agbára àdììtú rẹ̀ yóò fi sọnù. Àwọn àmì ohùn kún ibi tí wọ́n ti yẹ.
