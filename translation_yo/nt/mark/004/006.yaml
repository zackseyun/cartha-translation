  register: A lo èdè Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A gbé àmì àlàyé [a] sí lẹ́yìn ‘ó rọ,’ ibi tí àṣàyàn ọ̀rọ̀ náà kan ní tààrà.
