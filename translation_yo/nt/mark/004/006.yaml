  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: yo
  text: Nígbà tí oòrùn sì yọ, ó jóná; nítorí kò ní gbòǹgbò, ó sì gbẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó rọ̀.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí pé ohun kan gbẹ tàbí pé ó rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Nígbà tí oòrùn sì yọ
  rationale: Ó ṣe àfihàn àsopọ̀ ìtàn καὶ gbólóhùn àkókò náà lọ́nà Yorùbá tó ṣe déédé, láì fi ìtumọ̀ míì kún un.
- source_word: ἐκαυματίσθη
  choice: ó jóná
  rationale: Ọ̀rọ̀ yìí fi hàn pé ooru oòrùn ba ohun ọ̀gbìn náà jẹ́; ‘ó jóná’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ooru jó o.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: nítorí tí kò ní gbòǹgbò
  rationale: Ó pa ìtumọ̀ ìdí tí διά pẹ̀lú infinitive náà ní mọ́, ó sì tẹ̀ lé ẹyọ ọ̀rọ̀ ‘gbòǹgbò’ gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐξηράνθη
  choice: ó rọ
  rationale: ‘Ó rọ’ bá àwòrán ohun ọ̀gbìn tó pàdánù agbára rẹ̀ mu, nígbà tí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé ó gbẹ.
