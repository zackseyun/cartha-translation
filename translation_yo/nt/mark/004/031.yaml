revisions:
- from: Ó dà bí irúgbìn músítádì kan[a], èyí tí, nígbà tí a bá fún un sí orí ilẹ̀, ó kéré ju gbogbo irúgbìn tí ó wà lórí ilẹ̀ lọ—
  to: Ó dà bí irúgbìn músítádì kan[a], èyí tí, nígbà tí a bá gbìn ín sínú ilẹ̀, ó kéré ju gbogbo àwọn irúgbìn tí ń bẹ ní ilẹ̀ lọ—
  rationale: Replaced the incorrect verb fún (‘give’) with gbìn (‘sow/plant’), retaining the passive-indefinite sense through “a bá gbìn ín.” The comparative construction and the open-ended dash are preserved. No footnote corresponding to the English [b] is needed, since the Yoruba wording itself clearly marks the comparative and no appropriate anchor is present for that note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the simile, the mustard-seed image, and the comparative force of μικρότερον. However, “a bá fún un sí orí ilẹ̀” means ‘they give it onto the ground,’ not ‘it is sown,’ and therefore fails to translate σπαρῇ.
  naturalness: The proposed revision uses the ordinary Yoruba agricultural verb “gbìn” (‘sow/plant’) and its natural construction “gbìn ín sínú ilẹ̀.” The final qualifier “ní ilẹ̀” idiomatically conveys seeds found/on the earth without suggesting that they are merely lying on its surface.
  terminology: “Irúgbìn músítádì” and the alternative “hóró músítádì” are suitable. “Ó kéré ju gbogbo àwọn irúgbìn ... lọ” appropriately retains the Greek comparative rather than introducing a superlative.
  issues:
  - severity: high
    issue: “nígbà tí a bá fún un sí orí ilẹ̀” does not mean ‘when it is sown on the ground.’
    rationale: Fún un means ‘give it,’ whereas σπαρῇ is the passive of ‘sow.’ This changes the agricultural action central to the comparison.
  - severity: low
    issue: The first occurrence of “orí ilẹ̀” is less idiomatic for the location into which seed is sown.
    rationale: In natural Yoruba, seed is sown/planted “sínú ilẹ̀.” This is a necessary idiomatic adjustment and does not alter the agricultural sense of ἐπὶ τῆς γῆς.
  revised_text: Ó dà bí irúgbìn músítádì kan[a], èyí tí, nígbà tí a bá gbìn ín sínú ilẹ̀, ó kéré ju gbogbo àwọn irúgbìn tí ń bẹ ní ilẹ̀ lọ—
  revised_footnotes:
  - marker: a
    text: Tàbí, “hóró músítádì kan.”
    reason: lexical_alternative
  revision_rationale: Replaced the incorrect verb fún (‘give’) with gbìn (‘sow/plant’), retaining the passive-indefinite sense through “a bá gbìn ín.” The comparative construction and the open-ended dash are preserved. No footnote corresponding to the English [b] is needed, since the Yoruba wording itself clearly marks the comparative and no appropriate anchor is present for that note.
