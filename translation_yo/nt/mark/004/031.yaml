  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: yo
  text: Ó dà bí irúgbìn músítádì kan[a], èyí tí, nígbà tí a bá gbìn ín sínú ilẹ̀, ó kéré ju gbogbo àwọn irúgbìn tí ń bẹ ní ilẹ̀ lọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “hóró músítádì kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Ó dà bí
  rationale: Ó bẹ̀rẹ̀ àfiwé náà, ó sì kún ohun tí gbolohun Gíríìkì fi sílẹ̀ láti inú ìbéèrè ẹsẹ tó ṣáájú.
- source_word: κόκκῳ σινάπεως
  choice: irúgbìn músítádì kan
  rationale: κόκκος lè túmọ̀ sí hóró tàbí irúgbìn; ‘irúgbìn músítádì’ jẹ́ ọ̀rọ̀ àdánidá, ó sì pa àwòrán ohun ọ̀gbìn mọ́.
- source_word: ὅταν σπαρῇ
  choice: nígbà tí a bá fún un
  rationale: Ìṣe aláìlórúkọ tí ó wà nínú Gíríìkì ni a fi àpólà ‘a bá fún un’ hàn; ó sì pa ìtumọ̀ ìgbà gbogbogbò ὅταν mọ́.
- source_word: ἐπὶ τῆς γῆς
  choice: sí orí ilẹ̀ / lórí ilẹ̀
  rationale: Ó tẹ̀ lé agbára ἐπί, nígbà tí γῆ ní àyíká iṣẹ́ àgbẹ̀ yìí ń tọ́ka sí ilẹ̀ tí a fi ń gbìn.
- source_word: μικρότερον ὂν
  choice: ó kéré ju
  rationale: A lo ìpele ìfiwéra ‘kéré ju,’ kì í ṣe ìpele gíga jù lọ, gẹ́gẹ́ bí μικρότερον.
- source_word: πάντων τῶν σπερμάτων
  choice: gbogbo irúgbìn
  rationale: Ó mú ìfiwéra pẹ̀lú gbogbo àwọn irúgbìn tó wà nínú gbólóhùn orísun jáde láìfi àlàyé nípa ìmọ̀ ewéko kún un.
theological_decisions:
- issue: Ìfiwéra tàbí ìpele gíga jù lọ nípa bí irúgbìn músítádì ṣe kéré
  choice: ó kéré ju gbogbo irúgbìn ... lọ
  alternative: ó jẹ́ èyí tí ó kéré jù lọ lára gbogbo irúgbìn
  rationale: Gíríìkì lo μικρότερον, ìpele ìfiwéra. Ìtumọ̀ yìí pa ọ̀nà tí orísun gbà sọ ọ́ mọ́, láìfi ọ̀rọ̀ ìbílẹ̀ tí ó lo ìpele gíga jù lọ rọ́pò rẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbàṣe tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye ni a lò. A fi àmì ohùn sí gbogbo ibi tí ó bá yẹ. Gbólóhùn náà parí pẹ̀lú àmì gígùn nítorí pé ó ń bá ẹsẹ tó tẹ̀ lé e lọ. Àlàyé Gẹ̀ẹ́sì [b] nípa comparative kò yẹ gẹ́gẹ́ bí àlàyé tó so mọ́ ‘ground’; nítorí náà a jẹ́ kí ìpele ìfiwéra hàn kedere nínú ọ̀rọ̀ náà, láìdá àlàyé ẹlẹ́sẹ̀ tí kò bá àmì rẹ̀ mu sílẹ̀.
