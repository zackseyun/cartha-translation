  source_fidelity: Ìtumọ̀ náà jẹ́ olóòtọ́ sí Gíríìkì. “Ẹ̀rù ńlá sì bà wọ́n” ń sọ ìbẹ̀rù tó lágbára ti ἐφοβήθησαν φόβον μέγαν ní Yorùbá àdánidá; àlàyé ẹsẹ̀-ìsàlẹ̀ sì dá ìfọkànsìn cognate accusative náà mọ́. “Wọ́n sì ń sọ fún ara wọn” jẹ́ ìṣàfihàn tó yẹ fún imperfect ἔλεγον àti πρὸς ἀλλήλους. Ìbéèrè náà, pẹ̀lú “gan-an,” pa ìyàlẹ́nu/inferential force ti ἄρα mọ́ ní ọ̀nà tí kò fi ìtumọ̀ ẹ̀kọ́ kún un. “Àní afẹ́fẹ́ àti òkun fi ń gbọ́ tirẹ̀” ń mú ìtẹnumọ́ καὶ àti ìtumọ̀ ὑπακούει αὐτῷ—ṣíṣe ìgbọràn sí i—jáde dáadáa.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tó rọrùn, tó sì yẹ fún ìtàn Bíbélì òde òní. “Ẹ̀rù ńlá bà wọ́n,” “sọ fún ara wọn,” àti “gbọ́ tirẹ̀” jẹ́ ọ̀nà ìsọ̀rọ̀ tó hàn gbangba, tó sì ní ìwọ̀ntúnwọ̀nsì register.
  terminology: 'Àwọn ọ̀rọ̀ pàtàkì wà ní ìmúrasílẹ̀: “afẹ́fẹ́,” “òkun,” àti “gbọ́ tirẹ̀” fún ìgbọràn. Ìtumọ̀ náà kò yí ìbéèrè àwọn ọmọ-ẹ̀yìn padà sí ìkéde ẹ̀kọ́ nípa ìdánimọ̀ Jésù.'
