  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: yo
  text: Ẹ̀rù ńlá sì bà wọ́n[a], wọ́n sì ń sọ fún ara wọn pé, “Ta ni ẹni yìí gan-an, tí àní afẹ́fẹ́ àti òkun fi ń gbọ́ tirẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà sí i, “wọ́n bẹ̀rù ìbẹ̀rù ńlá.” Èdè Gíríìkì lo gbólóhùn àtẹnumọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: Ẹ̀rù ńlá sì bà wọ́n
  rationale: Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ tí gbòǹgbò wọn jọ láti mú ìbẹ̀rù náà le. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ìtumọ̀ náà mọ́.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àkókò imperfect ní Gíríìkì lè fi ìṣe tó ń lọ tàbí àsọtúnṣe hàn; “ń sọ” pa àwọ̀ ìtumọ̀ yẹn mọ́ nínú ìtàn Yorùbá.
- source_word: πρὸς ἀλλήλους
  choice: fún ara wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé wọ́n ń bá ara wọn sọ̀rọ̀.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Ta ni ẹni yìí gan-an
  rationale: “gan-an” mú ìyàlẹ́nu àti ìbéèrè ìfìdí-ọ̀rọ̀-múlẹ̀ tí ἄρα ní wá, láìfi àlàyé míì kún un.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: àní afẹ́fẹ́ àti òkun
  rationale: “àní” fi ìtẹnumọ́ adverbial ti καὶ àkọ́kọ́ hàn, nígbà tí “àti” so àwọn kókó méjèèjì pọ̀.
- source_word: ὑπακούει αὐτῷ
  choice: ń gbọ́ tirẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí pé afẹ́fẹ́ àti òkun ń tẹ̀lé àṣẹ rẹ̀, ó sì pa àwòrán ẹni tí ìṣẹ̀dá ń ṣègbọràn sí mọ́.
theological_decisions:
- issue: Àṣẹ Jésù lórí ìṣẹ̀dá
  choice: Pa ìyàlẹ́nu àwọn ọmọ-ẹ̀yìn àti ṣíṣe tí afẹ́fẹ́ àti òkun ń gbọ́ tirẹ̀ mọ́ gẹ́gẹ́ bí ẹsẹ náà ṣe sọ ọ.
  alternative: Ṣàfikún gbólóhùn tó túmọ̀ ìbéèrè náà ní tààrà sí ìjẹ́-Ọlọ́run Jésù.
  rationale: Ẹsẹ náà fúnra rẹ̀ ń fi àṣẹ àràọ̀tọ̀ Jésù hàn gidigidi, ṣùgbọ́n ó gbé e kalẹ̀ nípasẹ̀ ìbéèrè àwọn ọmọ-ẹ̀yìn. Ìtumọ̀ kò gbọ́dọ̀ yanjú ìbéèrè náà pẹ̀lú àfikún ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní.
