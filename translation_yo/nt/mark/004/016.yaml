review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main contrasts and preserves the parabolic expression, but “a fúnrúgbìn” is not a sound passive expression for people/seed being sown in this construction. “A gbìn” is the natural passive verbal form and retains the Greek image without interpretation.
  naturalness: “Àwọn wọ̀nyí pẹ̀lú sì ni” is understandable, but “Bákan náà ni àwọn wọ̀nyí” more naturally expresses ὁμοίως. The revised word order also makes the immediate reception with joy flow naturally in Standard Yoruba.
  terminology: “Ọ̀rọ̀ náà,” “lẹ́sẹ̀kẹsẹ̀,” and “fi ayọ̀ gbà á” appropriately render the repeated word/message, εὐθύς, and the neutral act of receiving. “Ilẹ̀ olókùúta” suitably represents rocky ground.
  issues:
  - severity: medium
    issue: “àwọn tí a fúnrúgbìn sí”
    rationale: Fúnrúgbìn means to sow seed and is awkward in this passive construction with “àwọn” as the implied thing sown. “Àwọn tí a gbìn sí” is idiomatic Yoruba while preserving the deliberately parabolic, non-explicit referent of σπειρόμενοι.
  - severity: low
    issue: Rendering of ὁμοίως as “pẹ̀lú”
    rationale: “Pẹ̀lú” can mean “also,” but “bákan náà” more directly expresses the analogical/discourse-linking force of “likewise.”
