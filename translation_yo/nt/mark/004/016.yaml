source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: yo
  text: 'Bákan náà ni àwọn wọ̀nyí jẹ́ àwọn tí a gbìn sí orí ilẹ̀ olókùúta: nígbà tí wọ́n bá gbọ́ ọ̀rọ̀ náà, wọ́n a fi ayọ̀ gbà á lẹ́sẹ̀kẹsẹ̀,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: pẹ̀lú
  rationale: Ó so ẹgbẹ́ yìí pọ̀ mọ́ àlàyé ẹgbẹ́ tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘bákan náà’ nínú gbólóhùn yìí.
- source_word: ἐπὶ τὰ πετρώδη
  choice: sí orí ilẹ̀ olókùúta
  rationale: Ó pa àwòrán ibi tí ilẹ̀ rẹ̀ kún fún òkúta mọ́, gẹ́gẹ́ bí ó ṣe wà nínú àkàwé náà.
- source_word: σπειρόμενοι
  choice: àwọn tí a fúnrúgbìn
  rationale: Ó pa ìṣe àfọwọ́ṣe tí a ṣe sí wọn mọ́, kò sì tú àkàwé náà sí ọ̀rọ̀ nípa ọkàn wọn.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa ọ̀rọ̀ pàtàkì tí a ń tún lò nínú àyíká àkàwé náà mọ́, ó sì lè túmọ̀ sí ọ̀rọ̀ ìkéde tàbí iṣẹ́ tí a ń kéde.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi kíkánkíkan ìṣe náà hàn, ó sì bá ìlò adverb yìí tí ó wọ́pọ̀ nínú Máàkù mu.
- source_word: μετὰ χαρᾶς
  choice: fi ayọ̀
  rationale: Ó ṣàfihàn ọ̀nà tí wọ́n gbà gba ọ̀rọ̀ náà láìfi ìtumọ̀ míì kún un.
- source_word: λαμβάνουσιν αὐτόν
  choice: gbà á
  rationale: ‘Gbà á’ jẹ́ Yorùbá àdánidá fún gbígba ọ̀rọ̀ tàbí ìhìn kan; kò sọ pé ìgbàgbọ́ náà dúró pẹ́.
theological_decisions:
- issue: Ohun tí ‘àwọn tí a fúnrúgbìn’ ń tọ́ka sí nínú àlàyé àkàwé náà
  choice: A pa ọ̀rọ̀ àkàwé náà mọ́ pé ‘àwọn tí a fúnrúgbìn sí orí ilẹ̀ olókùúta.’
  alternative: Àwọn tí ọkàn wọn dà bí ilẹ̀ olókùúta.
  rationale: Gíríìkì náà ń bá a lọ láti lo àwòrán fífúnrúgbìn nígbà tó ń tọ́ka sí àwọn ènìyàn. Yíyí i padà sí àlàyé nípa ọkàn wọn yóò fi èrò tí kò sí ní tààrà sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìṣòro àkàwé Gíríìkì mọ́ láìṣe àlàyé ẹ̀kọ́ ìsìn sínú ọ̀rọ̀ náà.
