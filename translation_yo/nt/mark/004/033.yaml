  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: yo
  text: Ó sì ń sọ ọ̀rọ̀ náà[a] fún wọn nípasẹ̀ ọ̀pọ̀ òwe irú bẹ́ẹ̀, gẹ́gẹ́ bí wọ́n ṣe lè gbọ́ ọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn náà” tàbí “ẹ̀kọ́ náà” dípò “ọ̀rọ̀ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “dé ìwọ̀n tí wọ́n lè gbọ́ ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: irú bẹ́ẹ̀
  rationale: Ó tọ́ka sí irú àwọn òwe tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì pa ìtumọ̀ ìfiwéra náà mọ́ ní Yorùbá àdánidá.
- source_word: παραβολαῖς
  choice: òwe
  rationale: “Òwe” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún irú ẹ̀kọ́ àpẹẹrẹ àti ìfiwéra tí Jésù ń lò ní àyíká yìí.
- source_word: πολλαῖς
  choice: ọ̀pọ̀
  rationale: Ó fi iye púpọ̀ hàn ní kedere, ó sì bá “òwe” mu lọ́nà àdánidá.
- source_word: ἐλάλει
  choice: ń ... sọ
  rationale: Àmì ìṣe “ń” pa ìrísí ìṣe tí ń lọ tàbí tí a máa ń ṣe nínú imperfect Gíríìkì mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó mú dative indirect object jáde lọ́nà Yorùbá tó ṣe déédéé.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa ìtumọ̀ gangan ti λόγος àti ìró rẹ̀ nínú Máàkù mọ́, láì fi dandan sọ ọ́ di “ẹ̀kọ́” tàbí “ìhìn.”
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu tàbí ìwọ̀n agbára àwọn olùgbọ́ hàn.
- source_word: ἠδύναντο
  choice: agbára wọn ti mọ́
  rationale: Àṣà Yorùbá yìí sọ ìwọ̀n ohun tí wọ́n lè ṣe, ó sì bá imperfect tí ń tọ́ka sí agbára tí wọ́n ní mu.
- source_word: ἀκούειν
  choice: láti gbọ́ ọ
  rationale: Ó pa ìtumọ̀ pàtàkì “gbọ́” mọ́, láì túmọ̀ rẹ̀ sí “lóye”; “ọ” tọ́ka padà sí ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ τὸν λόγον nínú iṣẹ́ ìkọ́ni Jésù
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà; ẹ̀kọ́ náà
  rationale: “Ọ̀rọ̀ náà” pa ìṣọ̀rọ̀ Gíríìkì àti ìlò Bíbélì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ẹ̀kọ́ ìsìn pàtó kan.
- issue: Ohun tí ἀκούειν túmọ̀ sí níbí
  choice: gbọ́ ọ
  alternative: lóye rẹ̀; gbà á
  rationale: Ẹsẹ̀ náà sọ nípa agbára wọn láti gbọ́. Bó tilẹ̀ jẹ́ pé gbígbọ́ lè ní òye nínú, a kò yanjú ìṣòro ìtumọ̀ náà nípa fífi “lóye” rọ́pò ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A yan “òwe” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí ó mọ́gbọ́n dání fún παραβολή, “ń ... sọ” sì pa àkókò imperfect mọ́. Àwọn àmì ohùn ni a fi síbi tí ó yẹ.
