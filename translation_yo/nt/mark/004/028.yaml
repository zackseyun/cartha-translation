translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan àwọn ọ̀rọ̀ iṣẹ́ àgbẹ̀ tí òǹkàwé Yorùbá lè lóye láìjẹ́ kí ìtumọ̀ ju ohun tí Gíríìkì sọ lọ.
