  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: yo
  text: 'Ilẹ̀ fúnra rẹ̀ ń mú èso jáde: kọ́kọ́, ewé ọkà; lẹ́yìn náà, orí ọkà; lẹ́yìn náà, ọkà tí ó kún nínú orí ọkà.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ilẹ̀ fúnra rẹ̀ ń mú èso jáde: kọ́kọ́, ewé; lẹ́yìn náà, etí ọkà; lẹ́yìn náà, ọkà tí ó kún nínú etí ọkà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτομάτη
  choice: fúnra rẹ̀
  rationale: Ó fi hàn pé ilẹ̀ ń mú irúgbìn dàgbà láìsí iṣẹ́ ènìyàn tí a lè rí; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, kò sì mú ìtumọ̀ ẹ̀rọ ‘láìfọwọ́sí’ wọlé.
- source_word: ἡ γῆ
  choice: ilẹ̀
  rationale: Nínú àkàwé iṣẹ́ àgbẹ̀ yìí, ó ń tọ́ka sí ilẹ̀ tí a gbìn sí; ‘ilẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: καρποφορεῖ
  choice: ń mú èso jáde
  rationale: Ó pa àwòrán ohun ọ̀gbìn tí ń so èso mọ́, ó sì lè túmọ̀ sí mímú ohun ọ̀gbìn tàbí irúgbìn jáde láìfi irú ọkà kan pàtó kún un.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó tọ́ka sí ìpele àkọ́kọ́ nínú bí irúgbìn ṣe ń dàgbà.
- source_word: χόρτον
  choice: èéhù
  rationale: Nínú ọ̀rọ̀ ìdàgbàsókè ọkà, χόρτος ni ohun ewé tútù àkọ́kọ́ tí ó hù; ‘èéhù’ mú ìpele yìí yàtọ̀ sí igi tàbí gègé tí ó ti dàgbà.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó fi ìtẹ̀lé àwọn ìpele ìdàgbàsókè hàn ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: στάχυν / ἐν τῷ στάχυϊ
  choice: orí ọkà / inú orí ọkà
  rationale: στάχυς jẹ́ apá òkè igi ọkà tí àwọn hóró wà; ‘orí ọkà’ ṣe kedere, a sì lo ọ̀rọ̀ kan náà ní ibi méjèèjì fún ìṣọ̀kan.
- source_word: πλήρης
  choice: tí ó kún
  rationale: Ó pa ìtumọ̀ ‘kíkún’ tàbí ‘pípé’ mọ́ láìfi èrò pé ó ti pọ́n, èyí tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà, kún un.
- source_word: σῖτον
  choice: ọkà
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbò fún hóró tàbí irúgbìn oúnjẹ, kò sì fi dandan sọ pé àlìkámà ni.
