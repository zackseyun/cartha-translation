  to: 'Ilẹ̀ fúnra rẹ̀ ń mú èso jáde: kọ́kọ́, ewé ọkà; lẹ́yìn náà, orí ọkà; lẹ́yìn náà, ọkà tí ó kún nínú orí ọkà.[a]'
