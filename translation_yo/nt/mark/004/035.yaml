  source_fidelity: 'The temporal setting and hortatory invitation are retained. However, “sí òdìkejì” is somewhat elliptical: πέραν in this context denotes the opposite side/shore, which is more explicitly conveyed by “sí ìhà kejì.”'
  naturalness: “Nígbà tí ó di ìrọ̀lẹ́” is a more direct, idiomatic Standard Yoruba rendering of ὀψίας γενομένης than “nígbà tí ilẹ̀ ń ṣú.” “Ẹ jẹ́ kí a kọjá lọ” is also smoother than the fused “rékọjá.”
  terminology: No theological terminology occurs. “Ìhà kejì” naturally expresses the destination on the opposite side without adding “adágún” or other unstated detail.
  issues:
