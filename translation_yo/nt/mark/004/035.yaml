  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: yo
  text: Ní ọjọ́ náà, nígbà tí ó di ìrọ̀lẹ́, ó wí fún wọn pé, “Ẹ jẹ́ kí a kọjá lọ sí ìhà kejì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ó sọ
  rationale: A lo àkókò tí ó ti kọjá nínú Yorùbá kí ìtàn lè máa ṣàn lọ́nà àdánidá; fífi historical present Gíríìkì ṣe ní gígún bí ‘ó sọ’ ní àkókò ìsinsìnyí yóò ṣòro láti yé nínú ọ̀rọ̀ Yorùbá.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ìtọ́kasí àkókò náà, ó sì pa ìsopọ̀ mọ́ ọjọ́ tí ìṣẹ̀lẹ̀ ṣáájú wáyé.
- source_word: ὀψίας γενομένης
  choice: nígbà tí ilẹ̀ ń ṣú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún bí ìrọ̀lẹ́ ṣe dé; ó mú attendant time ti genitive absolute jáde láìdi ọ̀rọ̀ mọ́ ọn.
- source_word: Διέλθωμεν
  choice: Ẹ jẹ́ kí a rékọjá
  rationale: Ìlànà ‘Ẹ jẹ́ kí a’ fi first-person plural hortatory subjunctive hàn, ‘rékọjá’ sì bá ìrìn kọjá adágún mu.
- source_word: εἰς τὸ πέραν
  choice: sí òdìkejì
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀gbẹ́ kejì adágún; ‘sí òdìkejì’ jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn. A kò fi àlàyé adágún kún ọ̀rọ̀ nítorí pé àyíká ìtàn ló ń mú un yé.
