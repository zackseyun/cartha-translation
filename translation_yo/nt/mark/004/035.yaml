    issue: The destination is rendered elliptically as “sí òdìkejì.”
    rationale: The Greek τὸ πέραν refers here to the other side; “sí ìhà kejì” supplies the natural Yoruba noun for the side without expanding the sense.
  - severity: low
    issue: The evening clause and crossing invitation can be made more idiomatic.
    rationale: “Nígbà tí ó di ìrọ̀lẹ́” directly marks the arrival of evening, and “Ẹ jẹ́ kí a kọjá lọ” is clear contemporary Standard Yoruba for the hortatory “Let us go across.”
