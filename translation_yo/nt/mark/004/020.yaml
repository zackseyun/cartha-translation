language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: yo
  text: 'Àwọn wọ̀nyẹn sì ni àwọn tí a fún sí ilẹ̀ rere: wọ́n ń gbọ́ ọ̀rọ̀ náà, wọ́n sì ń gbà á[a], wọ́n sì ń so èso—ọgbọ̀nlọ́po, ọgọ́ta lọ́po, àti ọgọ́rùn-únlọ́po.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ́n sì ń tẹ́wọ́ gbà á” fún παραδέχονται.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: Àwọn wọ̀nyẹn
  rationale: Ó tọ́ka padà sí ẹ̀ka ìkẹyìn nínú àlàyé àkàwé náà, ó sì yà wọ́n sọ́tọ̀ kúrò lára àwọn ẹ̀ka tí a ti mẹ́nu kàn.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: àwọn tí a fúnrúgbìn sí orí ilẹ̀ rere
  rationale: Ó pa àwòrán iṣẹ́ àgbẹ̀ àti ìṣe àbápín tí Gíríìkì lò mọ́; “sí orí” fi hàn pé irúgbìn ṣubú sórí ilẹ̀ gẹ́gẹ́ bí àyíká àkàwé náà.
- source_word: γῆν τὴν καλὴν
  choice: ilẹ̀ rere
  rationale: Ní àyíká yìí, γῆ túmọ̀ sí ilẹ̀ tí irúgbìn lè hù sí; “ilẹ̀ rere” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìyàtọ̀ láàárín oríṣiríṣi ilẹ̀ mu.
- source_word: οἵτινες
  choice: wọ́n
  rationale: Gbólóhùn tuntun pẹ̀lú “wọ́n” jẹ́ èdè Yorùbá àdánidá, ó sì ṣàlàyé àwọn àmì tí ó dá ẹgbẹ́ yìí mọ̀.
- source_word: ἀκούουσιν τὸν λόγον
  choice: wọ́n ń gbọ́ ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” pa àsopọ̀ mọ́ lílo λόγος léraléra nínú Máàkù 4, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: παραδέχονται
  choice: wọ́n sì ń gbà á
  rationale: “Gbà á” lè sọ ìtẹ́wọ́gbà rere sí ọ̀rọ̀ náà ní ṣókí, ó sì pa ìtẹ̀lé gbọ́ → gbà → so èso mọ́.
- source_word: καρποφοροῦσιν
  choice: wọ́n sì ń so èso
  rationale: Èyí jẹ́ àkànlò Yorùbá àdánidá fún jíjẹ́ eléso, ó sì pa àpẹẹrẹ iṣẹ́ àgbẹ̀ àti ìtumọ̀ ẹ̀mí rẹ̀ mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ọ̀kan ní ọgbọ̀n ìlọ́po, ọ̀kan ní ọgọ́ta ìlọ́po, àti ọ̀kan ní ọgọ́rùn-ún ìlọ́po
  rationale: “Ìlọ́po” mú iye èso tí ó ju irúgbìn lọ hàn kedere; pípa “ọ̀kan” mọ́ lẹ́ẹ̀mẹ́ta tún ṣàfihàn ìlò ἓν léraléra nínú Gíríìkì.
theological_decisions:
- issue: Irú ìdáhùn tí ilẹ̀ rere ṣe sí ọ̀rọ̀ náà
  choice: Ẹsẹ náà sọ pé wọ́n gbọ́ ọ̀rọ̀ náà, wọ́n gbà á, wọ́n sì so èso ní tòótọ́.
  alternative: Kí a sọ pé ilẹ̀ rere fi dandan ìforítì títí dé òpin hàn, tàbí pé ó ń sọ nípa ìdáhùn àkọ́kọ́ nìkan.
  rationale: Gíríìkì sọ àwọn ìṣe mẹ́tẹ̀ẹ̀ta ní tààrà; ìtumọ̀ náà kò gbọ́dọ̀ fi ètò ẹ̀kọ́ ìsìn kan tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún. A pa ìtẹ̀lé ọ̀rọ̀ Gíríìkì àti àwòrán iṣẹ́ àgbẹ̀ mọ́ ní Yorùbá àdánidá.
