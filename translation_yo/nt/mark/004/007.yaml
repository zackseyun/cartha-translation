  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: yo
  text: Irúgbìn mìíràn sì ṣubú sáàárín àwọn ẹ̀gún,[a] àwọn ẹ̀gún náà sì hù sókè, wọ́n sì fún un pa; kò sì so èso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínú àwọn ẹ̀gún.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “sínú,” ṣùgbọ́n “sáàárín àwọn ẹ̀gún” jẹ́ ọ̀nà Yorùbá àdánidá nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Irúgbìn mìíràn
  rationale: Ọ̀rọ̀ náà jẹ́ àfihàn aláìpé ní Gíríìkì tí ó tọ́ka sí irúgbìn nínú àyíká òwe náà; fífi “irúgbìn” kún un mú ìtumọ̀ náà ṣe kedere láìfi èrò tuntun kún un.
- source_word: ἔπεσεν
  choice: ṣubú
  rationale: Èyí túmọ̀ sí pé ó ṣubú; kò yẹ kí a túmọ̀ rẹ̀ sí pé a fún un nítorí ìyẹn yóò fi ìtumọ̀ àyíká rọ́pò ọ̀rọ̀ tí a lò.
- source_word: εἰς τὰς ἀκάνθας
  choice: sáàárín àwọn ẹ̀gún
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń túmọ̀ sí “sínú,” “sáàárín àwọn ẹ̀gún” jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàpèjúwe ibi tí ẹ̀gún ti wà tí irúgbìn náà ṣubú sí.
- source_word: ἀνέβησαν
  choice: hù sókè
  rationale: Ó ṣàpèjúwe bí àwọn ẹ̀gún ṣe hù tí wọ́n sì ga sókè; gbólóhùn yìí jẹ́ ti àdánidá fún ìdàgbàsókè ewéko ní Yorùbá.
- source_word: συνέπνιξαν
  choice: fún un pa
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán fífún ohun pa tàbí dídènà ìdàgbàsókè rẹ̀; “fún un pa” pa àwòrán lílágbára náà mọ́ ní Yorùbá.
- source_word: αὐτό
  choice: un
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí irúgbìn ẹyọ kan; “un” jẹ́ arọ́pò-orúkọ Yorùbá àdánidá nínú gbólóhùn yìí.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: kò sì so èso
  rationale: Bí ìtumọ̀ gangan ṣe jẹ́ pé “kò fúnni ní èso,” “kò so èso” ni ọ̀nà Yorùbá àdánidá tí ó bójú mu fún ohun ọ̀gbìn tí kò mú èso jáde.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ àdánidá, ọ̀wọ̀, tí òǹkàwé òde òní lè lóye. A pa àsopọ̀ àwọn gbólóhùn Gíríìkì mọ́ nípa lílo “sì,” ṣùgbọ́n a yà àwọn ìṣẹ̀lẹ̀ náà sọ́tọ̀ pẹ̀lú àmì ìdádúró fún kíkà tó rọrùn.
