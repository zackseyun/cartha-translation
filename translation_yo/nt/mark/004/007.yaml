  terminology: ‘Ẹ̀gún,’ ‘hù sókè,’ àti ‘so èso’ jẹ́ àwọn ọ̀rọ̀ tó péye, tó sì rọrùn fún òǹkàwé òde òní. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí orúkọ tó nílò àtúnṣe.
