language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: yo
  text: wọ́n kò sì ní gbòǹgbò nínú ara wọn, ṣùgbọ́n wọ́n wà fún ìgbà díẹ̀ péré. Lẹ́yìn náà, nígbà tí ìpọ́njú tàbí inúnibíni bá dé nítorí ọ̀rọ̀ náà, lẹ́sẹ̀kẹsẹ̀ ni wọ́n kọsẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n yí kúrò.” Ọ̀rọ̀ Gíríìkì náà tún lè fi ìtumọ̀ bí “di ìdẹ̀kùn fún wọn” tàbí “mú wọn bínú” hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: gbòǹgbò
  rationale: Ó pa àwòrán irúgbìn àti ilẹ̀ mọ́ láìfi ọ̀rọ̀ bí ‘jìn’ tàbí ‘fẹsẹ̀ múlẹ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara wọn
  rationale: Ó pa ìtumọ̀ afarahẹ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πρόσκαιροί
  choice: wọ́n wà fún ìgbà díẹ̀ péré
  rationale: Ó túmọ̀ sí pé wọ́n dúró fún àkókò díẹ̀ nìkan, láìfi ìtumọ̀ nípa ìwà tí kò dúró ṣinṣin kún un.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní ọ̀nà tó ṣe kedere, tó sì bá ìṣàn ọ̀rọ̀ mu.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: nígbà tí ìpọ́njú tàbí inúnibíni bá dé
  rationale: A tú ẹ̀ka ọ̀rọ̀ náà sí gbólóhùn àkókò tó ṣe àdánidá ní Yorùbá; ‘ìpọ́njú’ pa èrò ìhámọ́ra àti ìnira mọ́, ‘inúnibíni’ sì sọ διωγμός ní pàtó.
- source_word: διὰ τὸν λόγον
  choice: nítorí ọ̀rọ̀ náà
  rationale: ‘Ọ̀rọ̀’ pa àsopọ̀ ọ̀rọ̀ pàtàkì tí a ń tún lò nínú àkàwé náà mọ́, láìdín un kù sí àlàyé kan ṣoṣo.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìmọ̀lára ìkánjú tí Máàkù sábà máa ń fi hàn mọ́.
- source_word: σκανδαλίζονται
  choice: wọ́n yí padà kúrò
  rationale: Nínú àyíká yìí, ó fi hàn pé wọ́n kọ ohun tí wọ́n ti kọ́kọ́ gbà sílẹ̀ nígbà ìpọ́njú; ọ̀rọ̀ yìí jẹ́ kedere ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwòrán ‘kọsẹ̀’ inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζονται nínú àyíká títẹ̀lé àti yíyí padà kúrò
  choice: wọ́n yí padà kúrò
  alternative: wọ́n kọsẹ̀; a mú wọn kọsẹ̀; wọ́n bínú sí i
  rationale: Àyíká náà sọ nípa àwọn tó gba ọ̀rọ̀ fún ìgbà díẹ̀, tí wọ́n sì kọ̀ láti dúró nígbà ìpọ́njú. Ìtumọ̀ yìí pa bí ìyípadà náà ti ṣe le koko mọ́, láìdájọ́ ju ohun tí ẹsẹ náà sọ lọ nípa ìgbàlà wọn níkẹyìn.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A pa àwòrán gbòǹgbò àti ọ̀rọ̀ pàtàkì inú àkàwé náà mọ́.
