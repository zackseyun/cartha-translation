id: MRK.4.24
reference: Mark 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ẹ fiyè sí ohun tí ẹ ń gbọ́. Òṣùwọ̀n tí ẹ fi ń wọ̀n ni a ó fi wọ̀n fún yín[a], a ó sì fi sí i fún yín[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Òṣùwọ̀n èyíkéyìí tí ẹ bá fi wọ̀n ni a ó fi wọ̀n fún yín.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lóye “a ó sì fi sí i fún yín” pé ó ń tọ́ka sí òye tí yóò pọ̀ sí i fún àwọn tó gba ẹ̀kọ́ Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a máa ń ṣe hàn; “ń sọ” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Βλέπετε
  choice: Ẹ fiyè sí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ ìkìlọ̀ tàbí ìpè sí àkíyèsí, kì í ṣe wíwo lásán.
- source_word: τί ἀκούετε
  choice: ohun tí ẹ ń gbọ́
  rationale: τί túmọ̀ sí “ohun tí,” kì í ṣe “bí”; èyí pa ọ̀rọ̀ Máàkù mọ́ láì mú un bá Lúùkù 8:18 mu.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Òṣùwọ̀n tí ẹ fi ń wọ̀n
  rationale: Ó pa àwòrán òṣùwọ̀n àti wíwọ̀n mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: μετρηθήσεται ὑμῖν
  choice: ni a ó fi wọ̀n fún yín
  rationale: Yorùbá sábà máa ń lo “a” aláìdárúkọ láti sọ ìṣe tí ẹni tó ṣe é kò hàn; èyí mú passive ọjọ́ iwájú àti ìdáhùn tó bá òṣùwọ̀n mu dúró.
- source_word: προστεθήσεται ὑμῖν
  choice: a ó sì fi sí i fún yín
  rationale: “Fi sí i” jẹ́ ọ̀nà àdánidá láti sọ pé a ó ṣàfikún sí ohun tí wọ́n rí gbà, láì sọ ohun tí àfikún náà jẹ́ ní pàtó.
theological_decisions:
- issue: Ìtumọ̀ òwe nípa òṣùwọ̀n tí a fi ń wọ̀n
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìlànà ìdáhùn tó bá bí ènìyàn ṣe gba ẹ̀kọ́ Jésù mu, láì dín in kù sí ẹ̀kọ́ kan ṣoṣo.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìlànà ìdájọ́, ọ̀làwọ́, tàbí bí òye ẹ̀mí ṣe ń pọ̀ sí i.
  rationale: Àyíká tó sún mọ́ ọn dá lórí gbígbọ́ àti gbígba ọ̀rọ̀ Jésù; ìtumọ̀ náà pa àìdánilójú àti ìfúnpá ẹ̀kọ́ Ọlọ́run tó wà nínú àwòrán náà mọ́.
- issue: Ohun tí “a ó sì fi sí i fún yín” ń tọ́ka sí
  choice: A kò sọ ohun tí a ó fi kún un ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Àwọn kan lóye rẹ̀ sí òye tó pọ̀ sí i fún àwọn tó gba ẹ̀kọ́ Jésù.
  rationale: Gíríìkì kò dárúkọ ohun tí a ń fi kún un; àyíká lè tọ́ka sí òye, ṣùgbọ́n ìtumọ̀ yẹ kí ó wà nínú àlàyé ìsàlẹ̀, kì í ṣe kí a fi í sínú ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú ọ̀rọ̀ ọlọ́lá tó ṣe kedere fún òǹkàwé òde òní. “Ẹ” pa ọ̀pọ̀ ènìyàn tí αὐτοῖς àti àwọn ọ̀rọ̀-ìṣe ẹni kejì ọ̀pọ̀ ń tọ́ka sí mọ́. A pa àwòrán òṣùwọ̀n mọ́, a kò sì fi èrò ẹ̀sìn kan pàtó sínú rẹ̀.
