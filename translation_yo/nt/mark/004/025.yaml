language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: yo
  text: Nítorí ẹni tí ó bá ní, a ó fún un[a]; ẹni tí kò bá sì ní, àní ohun tí ó ní ni a ó gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó kan sọ pé, “a ó fún un”; kò sọ ohun tí a ó fún un. Àyíká òwe náà fi ìbísí hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí ó bá
  rationale: Ọ̀rọ̀ arọ́pò orúkọ aláìnídìí yìí ní ìtumọ̀ gbogbogbò; ‘ẹni tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ẹnikẹ́ni tí’ nínú òwe.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
- source_word: ἔχει
  choice: ní
  rationale: Ó pa ìtumọ̀ ìní mọ́ ní ṣókí, bí ó ti rí nínú Gíríìkì, láì sọ ohun tí a ní di ohun pàtó.
- source_word: δοθήσεται αὐτῷ
  choice: a ó fi fún un
  rationale: Gíríìkì kò sọ ohun tí a ó fi fún un ní tààrà; Yorùbá lè pa àfojúsùn tí a kò dárúkọ yìí mọ́ lọ́nà àdánidá pẹ̀lú ‘fi fún un,’ láì fi ‘sí i’ kún ọ̀rọ̀ pàtàkì.
- source_word: καὶ
  choice: sì
  rationale: Nínú apá kejì, ‘sì’ so ìyàtọ̀ tó wà láàárín àwọn apá méjèèjì pọ̀ lọ́nà Yorùbá tó mọ́gbọ́n dání.
- source_word: οὐκ ἔχει
  choice: kò bá ní
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ ìní ní ọ̀nà tó bá àkópọ̀ ‘ẹni tí ó bá’ mu.
- source_word: ὃ ἔχει
  choice: ohun tí ó ní
  rationale: Ó pa ìtọ́ka gbòòrò, aláìsọ pàtó ti arọ́pò orúkọ àárín Gíríìkì mọ́.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ó gbà kúrò lọ́wọ́ rẹ̀
  rationale: Ó ṣàfihàn ìgbésẹ̀ yíyọ ohun náà kúrò ní ìkáwọ́ ẹni náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí a kò dárúkọ nínú δοθήσεται
  choice: 'Pa ohun tí a ó fi fún un mọ́ gẹ́gẹ́ bí ohun tí a kò dárúkọ nínú ọ̀rọ̀ pàtàkì: ‘a ó fi fún un.’'
  alternative: ‘a ó fi sí i fún un’ tàbí ‘a ó fún un ní púpọ̀ sí i.’
  rationale: Orísun Gíríìkì sọ pé ‘a ó fi fún un’ láì sọ ‘sí i.’ Àyíká òwe náà lè túmọ̀ sí ìbísí, ṣùgbọ́n kí a má bà á yanjú ju orísun lọ, a pa àìsọ ohun náà mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
- issue: Ìtọ́ka akọ ẹyọ kan tó dúró fún gbogbo ènìyàn
  choice: Lo ‘ẹni tí ó bá ... un/rẹ̀,’ èyí tí kò fi akọ tàbí abo hàn ní Yorùbá.
  alternative: Ṣe àtúnkọ sí ọ̀pọ̀ ènìyàn.
  rationale: Bí Gíríìkì tilẹ̀ lo akọ ẹyọ kan gẹ́gẹ́ bí aṣojú gbogbogbò, àwọn arọ́pò orúkọ Yorùbá kò pín sí akọ àti abo. Ẹyọ kan àti agbára gbogbogbò ọ̀rọ̀ náà ṣì wà ní pípé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ṣókí, ó sì ní ìrísí òwe. ‘Àní ... pàápàá’ mú agbára καὶ nínú apá kejì jáde, nígbà tí ‘gbà kúrò lọ́wọ́ rẹ̀’ jẹ́ ọ̀rọ̀ òde òní tó ṣe kedere.
