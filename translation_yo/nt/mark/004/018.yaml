source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: yo
  text: Àwọn mìíràn sì ni àwọn tí a gbìn sí àárín àwọn ẹ̀gún[a]; àwọn wọ̀nyí ni àwọn tí wọ́n ti gbọ́ ọ̀rọ̀ náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sínú àwọn ẹ̀gún.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìhìn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: Àwọn mìíràn
  rationale: Ọ̀rọ̀ yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń fi ẹgbẹ́ yìí yà sí àwọn ẹgbẹ́ ilẹ̀ tí a ti mẹ́nu kàn ṣáájú.
- source_word: εἰς τὰς ἀκάνθας
  choice: sí àárín àwọn ẹ̀gún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún irúgbìn tí ó bọ́ sí ilẹ̀ tí ẹ̀gún wà, ó sì tún pa ìtumọ̀ εἰς mọ́ láìjẹ́ kí gbólóhùn náà le.
- source_word: ἀκάνθας
  choice: àwọn ẹ̀gún
  rationale: “Ẹ̀gún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àwòrán ilẹ̀ tí ẹ̀gún ti hù mu.
- source_word: σπειρόμενοι
  choice: àwọn tí a fún
  rationale: Ìtumọ̀ yìí pa àfiwé àwọn ènìyàn mọ́ irúgbìn tí a fún mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ ọ́ ní ìṣe àgbàwí.
- source_word: οὗτοί εἰσιν
  choice: àwọn wọ̀nyí ni
  rationale: Ó fi ìdánimọ̀ ẹgbẹ́ tí àlàyé òwe náà ń tọ́ka sí hàn ní kedere.
- source_word: οἱ ... ἀκούσαντες
  choice: àwọn tí wọ́n ti gbọ́
  rationale: “Ti gbọ́” fi hàn pé gbígbọ́ ọ̀rọ̀ náà ti ṣẹlẹ̀ kí ohun tí ẹsẹ tó tẹ̀ lé sọ tó ṣẹlẹ̀.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” pa àṣà ọ̀rọ̀ Bíbélì àti ìsopọ̀ rẹ̀ pẹ̀lú òwe yìí mọ́; ó ń tọ́ka sí ọ̀rọ̀ tí a kéde.
theological_decisions:
- issue: Àfiwé tí ó fi àwọn ènìyàn hàn bí irúgbìn nínú àlàyé òwe náà
  choice: Pa àfiwé náà mọ́ pé “àwọn tí a fún sí àárín àwọn ẹ̀gún.”
  alternative: Àwọn tí ó dà bí irúgbìn tí a fún sí ilẹ̀ ẹlẹ́gùn-ún
  rationale: Ọ̀rọ̀ Gíríìkì kò tú àfiwé náà sí ọ̀rọ̀ àlàyé lasan; ó ń bá a lọ ní fífi àwọn ènìyàn wé irúgbìn. Ìtumọ̀ náà kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìtẹ̀sí gírámà Gíríìkì mọ́ láìsọ ọ́ di gbolohun líle.
