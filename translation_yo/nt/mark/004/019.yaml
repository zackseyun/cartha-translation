id: MRK.4.19
reference: Mark 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: yo
  text: àti àwọn àníyàn ìgbà ayé yìí[a], àti ẹ̀tàn ọrọ̀[b], àti àwọn ìfẹ́kúfẹ̀ẹ́ sí àwọn ohun mìíràn; gbogbo wọn wọlé, wọ́n sì pa ọ̀rọ̀ náà lọ́mì, ó sì di aláìléso.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àníyàn ayé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbà” tàbí, ní ìtumọ̀ fífẹ̀, ètò ayé ìsinsìnyí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ìtànjẹ ọrọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, Gíríìkì sọ pé “ó di aláìléso.” “Ọ̀rọ̀ náà” ni orúkọ ẹyọ kan tó sún mọ́ ọn jù lọ; síbẹ̀, a tún lè lóye rẹ̀ pé olùgbọ́ náà tàbí irúgbìn náà di aláìléso.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: àwọn àníyàn
  rationale: “Àníyàn” túmọ̀ sí ìṣòro ọkàn tàbí ohun tí ń gba ọkàn ènìyàn, láìfi ìtumọ̀ ẹ̀dá-ọpọlọ tí ó pọ̀ jù kún ọ̀rọ̀ náà.
- source_word: αἰῶνος
  choice: ìgbà ayé yìí
  rationale: “Ìgbà ayé yìí” pa ìtumọ̀ àkókò tí αἰών ní mọ́, ó sì tún lè tọ́ka sí ètò ayé ìsinsìnyí.
- source_word: ἀπάτη τοῦ πλούτου
  choice: ẹ̀tàn ọrọ̀
  rationale: Gbólóhùn yìí fi hàn pé ọrọ̀ tàbí ọrọ̀-ajé lè tan ènìyàn jẹ; ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ṣókí.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ sí àwọn ohun mìíràn
  rationale: “Ìfẹ́kúfẹ̀ẹ́” mú agbára ìfẹ́ tí ń fà ènìyàn mọ́ àwọn ohun mìíràn jáde, “àwọn ohun mìíràn” sì pa fífẹ̀ ìtumọ̀ λοιπά mọ́.
- source_word: εἰσπορευόμεναι
  choice: gbogbo wọn wọlé
  rationale: Fífi “gbogbo wọn” kún un mú kí ó ṣe kedere ní Yorùbá pé àwọn ohun mẹ́tẹ̀ẹ̀ta tí a tò lẹ́sẹẹsẹ ni wọ́n ń wọ inú ọkàn/ilé náà, gẹ́gẹ́ bí àwòrán inú òwe náà.
- source_word: συμπνίγουσιν
  choice: fún ... pa
  rationale: “Fún ... pa” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi àwòrán fífún ohun kan pa tàbí dídènà rẹ̀ láti dàgbà hàn.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” pa ọ̀nà ìsọ̀rọ̀ Bíbélì àti ìtọ́ka sí ọ̀rọ̀ tí a kéde mọ́.
- source_word: ἄκαρπος γίνεται
  choice: ó sì di aláìléso
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìyípadà sí ipò àìní èso tí γίνεται ń sọ, ó sì pa àwòrán ohun ọ̀gbìn mọ́.
theological_decisions:
- issue: Ohun tí ọ̀rọ̀ arọ́pò-orúkọ ẹyọ kan nínú “ó sì di aláìléso” ń tọ́ka sí
  choice: A jẹ́ kí “ó” tọ́ka sí “ọ̀rọ̀ náà,” èyí tí ó sún mọ́ ọn jù lọ nínú gírámà.
  alternative: Ó lè tọ́ka sí olùgbọ́ náà tàbí sí irúgbìn ohun ọ̀gbìn náà.
  rationale: τὸν λόγον ni orúkọ ẹyọ kan tó sún mọ́ ἄκαρπος γίνεται jù lọ; síbẹ̀, àwòrán inú òwe náà lè mú kí òǹkàwé ronú nípa irúgbìn tàbí olùgbọ́. Àlàyé ìsàlẹ̀ pa àìdájú yìí mọ́ láìyanju rẹ̀ ju ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtòjọ náà ni a yí sí gbólóhùn “gbogbo wọn wọlé” kí ó lè ṣe kedere pé gbogbo àwọn kókó mẹ́tẹ̀ẹ̀ta ni participle Gíríìkì náà kàn, láìsọ èrò ẹ̀kọ́ ìgbàgbọ́ kan di dandan.
