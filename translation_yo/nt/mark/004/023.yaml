base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ní etí láti gbọ́, kí ó gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹnikẹ́ni bá ní etí láti fetí sí, kí ó fetí sí.” Ọ̀rọ̀ Greek kan náà ni a tún lò fún “gbọ́” ní ibì méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Bí ẹnikẹ́ni bá
  rationale: Ó pa ìrísí gbólóhùn oníṣ条件 Greek mọ́, ó sì fi hàn pé ìpè náà ṣí sí ẹnikẹ́ni.
- source_word: ἔχει
  choice: ní
  rationale: Ọ̀rọ̀ Yorùbá tó rọrùn, tó sì ṣe déédé fún ìní.
- source_word: ὦτα
  choice: etí
  rationale: Ní Yorùbá, ‘etí’ lè tọ́ka sí etí méjèèjì láìsí àmì ọ̀pọ̀; ó pa àwòrán ara tí Greek lò mọ́.
- source_word: ἀκούειν
  choice: láti gbọ́
  rationale: Ó fi ète tàbí agbára hàn, ó sì pa àtúnlò gbọ́/ἀκούω mọ́.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Ìṣàpẹẹrẹ ‘kí ó’ jẹ́ ọ̀nà àdánidá láti sọ àṣẹ ẹni kẹta ní Yorùbá; ‘gbọ́’ tún lè túmọ̀ sí fífetísílẹ̀ àti gbígba ọ̀rọ̀ wọ inú.
theological_decisions:
- issue: Ìtumọ̀ gbígbọ́ gẹ́gẹ́ bí fífetísílẹ̀ pẹ̀lú ìtẹ́wọ́gbà
  choice: gbọ́
  alternative: fetí sí
  rationale: Greek tún ọ̀rọ̀ ἀκούω ṣe, tí ó lè ní ìtumọ̀ gbígbọ́ lasan àti gbígbọ́ pẹ̀lú ìtẹ́wọ́gbà; ‘gbọ́’ pa ìfẹ̀yàrá yìí àti àtúnlò ọ̀rọ̀ náà mọ́.
- issue: Ẹni kan ṣoṣo aláìtọ́ka ní Greek
  choice: ẹnikẹ́ni … kí ó
  alternative: gbogbo ẹni … kí wọ́n
  rationale: ‘Ẹnikẹ́ni … kí ó’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tí kò fi akọ tàbí abo hàn, ó sì pa nọ́ńbà ẹyọ Greek mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá, tó ṣe kedere fún òǹkàwé gbogbo; a lo ‘kí ó’ fún àṣẹ ẹni kẹta, a sì yà á sọ́tọ̀ gẹ́gẹ́ bí ìlànà àkọtọ̀ Yorùbá.
