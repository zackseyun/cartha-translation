id: MRK.4.15
reference: Mark 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: yo
  text: Àwọn wọ̀nyí sì ni àwọn tí ó wà lẹ́gbẹ̀ẹ́ ọ̀nà, níbi tí a ti gbìn ọ̀rọ̀ náà. Nígbà tí wọ́n bá gbọ́ ọ̀rọ̀ náà, lẹ́sẹ̀kẹsẹ̀ ni Sátánì ń wá, ó sì ń mú ọ̀rọ̀ tí a gbìn sínú wọn[a] kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ tí a gbìn sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: Àwọn wọ̀nyí sì ni
  rationale: Ó pa ìdánimọ̀ àwọn tí Jésù ń ṣàlàyé mọ́, ó sì fi δέ hàn gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀ tí kò lágbára.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: àwọn tí ó wà lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: “Lẹ́gbẹ̀ẹ́ ọ̀nà” fi ipò tí παρά pẹ̀lú accusative ń tọ́ka sí hàn, ó sì bá àwòrán oko mu.
- source_word: σπείρεται ὁ λόγος
  choice: a ti ń fún ọ̀rọ̀ náà bí irúgbìn
  rationale: Èyí mú àfiwé fífún irúgbìn yé kedere ní Yorùbá, nígbà tí ó tún pa passive àti àtúnlò λόγος mọ́.
- source_word: ὅταν ἀκούσωσιν
  choice: Nígbà tí wọ́n bá gbọ́ ọ
  rationale: Àkópọ̀ “nígbà tí… bá” jẹ́ ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ gbogbogbò tí ὅταν pẹ̀lú subjunctive ń fi hàn.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìkánjú àti àìsí àkókò láàárín àwọn ìṣẹ̀lẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: ὁ Σατανᾶς
  choice: Sátánì
  rationale: A túmọ̀ orúkọ oyè ẹni náà ní tààràtà, láì sọ ọ́ di agbára aláìlẹ́ni tàbí èrò lásán.
- source_word: αἴρει
  choice: mú … kúrò
  rationale: Ó mú ìtumọ̀ gbígbé tàbí mímú ohun kan kúrò jáde láìfi agbára ìjá gbà á kun ọ̀rọ̀ Gíríìkì.
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: ọ̀rọ̀ tí a fún sínú wọn bí irúgbìn
  rationale: “Sínú wọn” pa ìdarí εἰς àti èrò pé ọ̀rọ̀ náà wọ inú àwọn olùgbọ́ mọ́; àlàyé “bí irúgbìn” jẹ́ kí àwòrán náà ṣe kedere.
theological_decisions:
- issue: Iṣe Sátánì gẹ́gẹ́ bí ẹni nínú àlàyé àkàwé náà
  choice: Sọ ὁ Σατανᾶς ní tààràtà gẹ́gẹ́ bí “Sátánì,” ẹni tí ó ń wá tí ó sì ń mú ọ̀rọ̀ náà kúrò.
  alternative: Lílo ọ̀rọ̀ àìlẹ́ni bí “ọ̀tá” tàbí agbára ibi lásán.
  rationale: Gíríìkì fi orúkọ/oyè pẹ̀lú article hàn ní ọ̀nà tí ó tọ́ka sí ẹni ibi kan pàtó; ìtumọ̀ kò gbọ́dọ̀ dín èyí kù sí àpẹẹrẹ aláìlẹ́ni.
- issue: Ìtumọ̀ εἰς αὐτούς
  choice: sínú wọn
  alternative: láàárín wọn
  rationale: “Sínú wọn” pa àìdánilójú díẹ̀ tó wà nínú εἰς mọ́, ó sì bá àlàyé nípa bí àwọn olùgbọ́ ṣe gba ọ̀rọ̀ mu; àlàyé ìsàlẹ̀ ojú ìwé jẹ́wọ́ ọ̀nà Yorùbá míràn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “fún … bí irúgbìn” láti jẹ́ kí àwòrán fífún irúgbìn ṣe kedere fún òǹkàwé lasán, a sì lo ìṣe àṣà “máa ń” láti fi àlàyé gbogbogbò inú àkàwé náà hàn.
