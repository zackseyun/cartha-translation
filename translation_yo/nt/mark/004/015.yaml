- from: Àwọn wọ̀nyí sì ni àwọn tí ó wà lẹ́gbẹ̀ẹ́ ọ̀nà, níbi tí a ti ń fún ọ̀rọ̀ náà bí irúgbìn. Nígbà tí wọ́n bá gbọ́ ọ, lẹ́sẹ̀kẹsẹ̀ ni Sátánì máa ń wá, ó sì máa ń mú ọ̀rọ̀ tí a fún sínú wọn bí irúgbìn[a] kúrò.
  to: Àwọn wọ̀nyí sì ni àwọn tí ó wà lẹ́gbẹ̀ẹ́ ọ̀nà, níbi tí a ti gbìn ọ̀rọ̀ náà. Nígbà tí wọ́n bá gbọ́ ọ̀rọ̀ náà, lẹ́sẹ̀kẹsẹ̀ ni Sátánì ń wá, ó sì ń mú ọ̀rọ̀ tí a gbìn sínú wọn[a] kúrò.
  rationale: Àtúnṣe náà rọ́pò “fún ... bí irúgbìn” pẹ̀lú “gbìn,” láti pa àwòrán àti ìtumọ̀ passive ti Gíríìkì mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ orísun kún un. A tún sọ ohun tí wọ́n gbọ́ di “ọ̀rọ̀ náà” fún ìmúlò Yorùbá tó móye, a sì ṣètò àlàyé ìsàlẹ̀ ojú ìwé láti fi ìyàtọ̀ “sí wọn” hàn.
