  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní. A pa ìtẹnumọ́ àṣẹ méjèèjì mọ́ nípa ‘Ẹ fetí sílẹ̀!’ àti ‘Ẹ wò ó.’
