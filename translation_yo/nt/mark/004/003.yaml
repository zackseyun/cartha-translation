  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: yo
  text: “Ẹ fetí sílẹ̀! Ẹ wò ó, afúnrúgbìn kan jáde lọ láti fúnrúgbìn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Ẹ fetí sílẹ̀!
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó ń pe àwọn olùgbọ́ láti tẹ́tí dáadáa. ‘Ẹ fetí sílẹ̀!’ jẹ́ Yorùbá àdánidá tó sì pa agbára àṣẹ náà mọ́.
- source_word: ἰδού
  choice: Ẹ wò ó,
  rationale: Ó fa àfiyèsí sí ohun tí ó tẹ̀ lé e. ‘Ẹ wò ó’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní agbára ìkìlọ̀ ìtàn náà.
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Ó sọ ìṣípò láti inú ibìkan sí òde; ‘jáde lọ’ bá ìtọ́sọ́nà ìṣe náà mu ní Yorùbá.
- source_word: ὁ σπείρων
  choice: afúnrúgbìn kan
  rationale: Àpólà alábápín pẹ̀lú atọ́ka náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni tó ń fúnrúgbìn. Yorùbá sábà máa ń lo ‘kan’ nígbà tí a kọ́kọ́ mú ẹni bẹ́ẹ̀ wọ inú ìtàn; ‘afúnrúgbìn’ sì jẹ́ orúkọ ipa tó ṣe kedere.
- source_word: σπεῖραι
  choice: láti fúnrúgbìn
  rationale: Ọ̀rọ̀ náà fi ète ìjáde hàn; ‘láti fúnrúgbìn’ ń sọ ète náà ní tààrà.
theological_decisions: []
