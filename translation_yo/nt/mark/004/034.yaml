source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: yo
  text: Kò sì máa ń bá wọn sọ̀rọ̀ láìlo àkàwé; ṣùgbọ́n ní àdádó, ó máa ń ṣàlàyé[a] ohun gbogbo fún àwọn ọmọ-ẹ̀yìn tirẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ó máa ń tumọ̀ ohun gbogbo” tàbí “ó máa ń ṣí ìtumọ̀ ohun gbogbo.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ṣàlàyé, tumọ̀, tàbí ṣí ìtumọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ọmọ-ẹ̀yìn tirẹ̀” pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì náà mọ́, èyí tí ó túmọ̀ sí “àwọn ọmọ-ẹ̀yìn tirẹ̀ gan-an.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: láìlo àkàwé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé kò bá wọn sọ̀rọ̀ láìsí àkàwé; ‘láìlo àkàwé’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ gíríìkì mọ́.
- source_word: ἐλάλει
  choice: máa ń bá wọn sọ̀rọ̀
  rationale: Àkókò imperfect níbí ń tọ́ka sí ohun tí ó jẹ́ àṣà tàbí tí ó ń ṣẹlẹ̀ léraléra; ‘máa ń’ mú ìtumọ̀ yẹn jáde ní Yorùbá.
- source_word: αὐτοῖς
  choice: pẹ̀lú wọn / fún wọn
  rationale: Ní ìtumọ̀ gbolohun náà, ‘bá wọn sọ̀rọ̀’ jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá tó bá dative gíríìkì mu lọ́nà àdánidá.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí ní ibi tí kì í ṣe ní gbangba, ó sì fi ìyàtọ̀ hàn láàárín ọ̀rọ̀ sí ọ̀pọ̀ ènìyàn àti àlàyé fún àwọn ọmọ-ẹ̀yìn.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: fún àwọn ọmọ-ẹ̀yìn tirẹ̀
  rationale: ‘Tirẹ̀’ pa ìtẹnumọ́ ἰδίοις mọ́, tí ó ju ‘àwọn ọmọ-ẹ̀yìn rẹ̀’ lásán lọ.
- source_word: ἐπέλυεν
  choice: ó máa ń ṣàlàyé
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣàlàyé, túmọ̀, tàbí tú ohun tí ó ṣòro; ‘ṣàlàyé’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, ‘máa ń’ sì fi imperfect hàn.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Èyí pa ààlà ọ̀rọ̀ gíríìkì mọ́ láìdín un kù sí ‘gbogbo àkàwé’ tàbí ‘gbogbo ohun tí ó sọ.’
theological_decisions:
- issue: Ìwọ̀n ohun tí Jésù ṣàlàyé ní ìkọ̀kọ̀
  choice: ohun gbogbo
  alternative: gbogbo àkàwé; gbogbo ohun tí ó ti sọ
  rationale: Gíríìkì sọ πάντα lásán. Bí àyíká ṣe lè tọ́ka sí àwọn àkàwé tàbí ẹ̀kọ́ rẹ̀, ìtumọ̀ kò gbọ́dọ̀ fi ààlà tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘máa ń’ láti fi ìṣe àṣà/léraléra inú imperfect méjèèjì hàn. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá jẹ́ àdánidá.
