id: MRK.4.21
reference: Mark 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “A kì í mú fìtílà wá láti fi sí abẹ́ òṣùwọ̀n[a] tàbí abẹ́ ibùsùn, àbí? Kì í ha ṣe láti fi sí orí ọ̀pá fìtílà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò ìwọ̀n tí a fi ń wọn ohun gbígbẹ; ó lè túmọ̀ sí àpò tàbí agbọ̀n tí a fi ń wọn.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń sọ” mú apá yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Μήτι
  choice: A kì í ... àbí?
  rationale: Μήτι bẹ̀rẹ̀ ìbéèrè tí ó ń retí ìdáhùn òdì; ọ̀nà yìí pa agbára ìbéèrè àsọyé náà mọ́ ní Yorùbá.
- source_word: ἔρχεται ὁ λύχνος
  choice: A kì í mú fìtílà wá
  rationale: Gíríìkì sọ ní ti gidi pé fìtílà “ń bọ̀,” ó sì sọ ọ́ bí ẹni pé ó lè rìn. Yorùbá àdánidá máa ń sọ pé a mú un wá; èyí pa àwòrán wíwá náà mọ́ láì jẹ́ kí gbólóhùn náà ṣòro.
- source_word: λύχνος
  choice: fìtílà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun èlò ìmọ́lẹ̀ kékeré tí a ń fi òróró jó, kì í ṣe ìmọ́lẹ̀ lásán.
- source_word: μόδιον
  choice: òṣùwọ̀n
  rationale: μόδιος jẹ́ ohun èlò tí a fi ń wọn ohun gbígbẹ, ó sì tún lè tọ́ka sí àpò tàbí agbọ̀n ìwọ̀n náà. “Òṣùwọ̀n” mú iṣẹ́ rẹ̀ hàn ní kúkúrú; àlàyé ìsàlẹ̀ fi ìtumọ̀ àṣà rẹ̀ kún un.
- source_word: κλίνην
  choice: ibùsùn
  rationale: κλίνη lè jẹ́ ibùsùn tàbí àga ìrọ̀gbọ̀kú; “ibùsùn” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ nínú àwòrán ilé yìí.
- source_word: λυχνίαν
  choice: ọ̀pá fìtílà
  rationale: λυχνία jẹ́ ohun ìdúró pàtó fún fìtílà; “ọ̀pá fìtílà” jẹ́ kedere, ó sì pa àwòrán ohun èlò náà mọ́.
- source_word: τεθῇ
  choice: fi sí / gbé ... ka
  rationale: Àwọn ọ̀rọ̀ yìí túmọ̀ sí fífi ohun kan sí ibi; yíyan ọ̀rọ̀ gẹ́gẹ́ bí ibi tí a ń fi í sí mú Yorùbá náà dán mọ́rán.
- source_word: ἵνα ... τεθῇ
  choice: láti fi sí / láti gbé ... ka
  rationale: ἵνα sọ ète nínú àwọn ìbéèrè àsọyé náà; “láti” fi ète yẹn hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a pa àpèjúwe tí ó sọ fìtílà di ẹni bí ẹni pé ó “ń bọ̀” mọ́ tàbí kí a sọ ọ́ gẹ́gẹ́ bí ohun tí a mú wá
  choice: A kì í mú fìtílà wá
  alternative: Ṣé fìtílà máa ń wá ...?
  rationale: Ọ̀nà tí a yàn pa ìṣe “wíwá” inú Gíríìkì mọ́, ṣùgbọ́n ó jẹ́ Yorùbá àdánidá. Àlàyé pé Gíríìkì sọ ọ́ lọ́nà àfiwé ẹni kò ṣe pàtàkì tó láti fi àkọsílẹ̀ mìíràn kún ẹsẹ yìí.
- issue: Ìtumọ̀ ὁ λύχνος gẹ́gẹ́ bí ohun kan pàtó tàbí ohun gbogbo irú rẹ̀
  choice: fìtílà gẹ́gẹ́ bí orúkọ àpapọ̀
  alternative: fìtílà náà
  rationale: Àsọyé náà jẹ́ òwe gbogbogbò; Yorùbá lè lo orúkọ láìsí “náà” láti sọ nípa gbogbo ohun irú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tí ó ṣe kedere fún òǹkàwé òde òní. A lo “a kì í” fún ìbéèrè àsọyé òwe, a sì pa ìlànà ìbéèrè méjì inú orísun Gíríìkì mọ́.
