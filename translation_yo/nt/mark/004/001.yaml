  to: Ó sì tún bẹ̀rẹ̀ sí í kọ́ni létí òkun. Ogunlọ́gọ̀ ènìyàn sì ń péjọ sọ́dọ̀ rẹ̀[a], tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan, ó sì jókòó lórí òkun[b]. Gbogbo ènìyàn náà sì wà létí òkun, lórí ilẹ̀.
  rationale: A tún gbolohun náà ṣe díẹ̀ nìkan láti mú Yorùbá rẹ̀ rọrùn, láti pa ìṣe ìsinsìnyí ìtàn Gíríìkì mọ́, àti láti yí àlàyé ìsàlẹ̀ a padà kí ó bá ọ̀rọ̀ àkọ́kọ́ mu. Ìtumọ̀, ìbáṣepọ̀ àwọn gbolohun, àti àìdánilójú tí kò sí nínú orísun kò yí padà.
