id: MRK.4.1
reference: Mark 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: yo
  text: Ó sì tún bẹ̀rẹ̀ sí í kọ́ni létí òkun. Ogunlọ́gọ̀ ènìyàn sì ń péjọ sọ́dọ̀ rẹ̀[a], tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan, ó sì jókòó lórí òkun[b]. Gbogbo ènìyàn náà sì wà létí òkun, lórí ilẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “péjọ.” Máàkù sábà máa ń lo ìṣe ìsinsìnyí láti mú kí ìtàn dà bí ohun tó ń ṣẹlẹ̀ lójú ẹni.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, ó jókòó nínú ọkọ̀ lórí omi, nígbà tí ogunlọ́gọ̀ ènìyàn náà wà lórí ilẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù tún ṣe iṣẹ́ ìkọ́ni yìí; ‘tún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì ṣe kúkúrú.
- source_word: ἤρξατο διδάσκειν
  choice: bẹ̀rẹ̀ sí í kọ́ni lẹ́kọ̀ọ́
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: παρὰ τὴν θάλασσαν
  choice: létí òkun
  rationale: Ó tọ́ka sí ibi tó wà lẹ́gbẹ̀ẹ́ omi; ‘òkun’ tẹ̀ lé θάλασσα láì yí i sí ‘adágún.’
- source_word: συνάγεται
  choice: péjọ
  rationale: A lo ìṣe àtẹ̀yìnwá nínú Yorùbá fún ìtàn tó ń lọ lọ́nà àdánidá; àlàyé ìsìnrú ìṣe ìsinsìnyí inú Gíríìkì wà ní àlàyé ìsàlẹ̀.
- source_word: ὄχλος πλεῖστος
  choice: ọ̀pọ̀ ènìyàn púpọ̀ gidigidi
  rationale: Ó pa agbára ọ̀rọ̀ àfihàn iye ńlá jù lọ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó fi ìṣípo àwọn ènìyàn sí ọ̀dọ̀ Jésù hàn lọ́nà àdánidá.
- source_word: ὥστε
  choice: tó bẹ́ẹ̀ tí ... fi
  rationale: Ìkọ̀lé Yorùbá yìí fi àbájáde tó wá látinú ọ̀pọ̀ ènìyàn náà hàn dáadáa.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: wọ inú ọkọ̀ ojú omi
  rationale: Ó mú ìṣe lílọ sínú ọkọ̀ jáde ní kedere, bó tilẹ̀ jẹ́ pé participle ni Gíríìkì.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún boat láì sọ bí ọkọ̀ náà ṣe tóbi.
- source_word: καθῆσθαι
  choice: jókòó
  rationale: Ó túmọ̀ ìjókòó Jésù ní ṣókí àti ní ti ẹ̀dá Yorùbá.
- source_word: ἐν τῇ θαλάσσῃ
  choice: lórí òkun
  rationale: Níwọ̀n bí ó ti wà nínú ọkọ̀, ‘lórí òkun’ ni ìtumọ̀ ibi tó ṣe àdánidá; àlàyé ìsàlẹ̀ mú un ṣe kedere.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo ọ̀pọ̀ ènìyàn náà
  rationale: Ó pa ìtumọ̀ gbogbo ẹgbẹ́ ènìyàn náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo ‘létí òkun’ àti ‘ọkọ̀ ojú omi’ fún ìmúlò tó ṣe kedere fún òǹkàwé gbogbo; a kò sọ pé Adágún Gálílì ni nítorí pé θάλασσα ni orísun sọ.
