source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: yo
  text: Ó sì ń sọ pé, “Báwo ni a ó ṣe fi ìjọba Ọlọ́run wé, tàbí àkàwé wo ni a ó fi gbé e kalẹ̀[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “tàbí nínú àkàwé wo ni a ó gbé e kalẹ̀?” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ àkàwé gẹ́gẹ́ bí ohun èlò tí a fi ń ṣàpèjúwe ìjọba náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ pé
  rationale: Àmì ìṣe aláìpé náà fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ nínú ìtàn; ‘ń sọ pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìrísí yìí mọ́.
- source_word: Πῶς ὁμοιώσωμεν
  choice: Kí ni a ó fi … wé
  rationale: Ìbéèrè ìfọ̀rọ̀wérọ̀ yìí ń wá ohun tàbí àwòrán tí a lè fi ṣe ìfiwéra. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ subjunctive deliberative mọ́.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Yorùbá tí ó ṣe kedere tí ó sì pa àwòrán ìjọba àti ìṣàkóso inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: παραβολῇ
  choice: àkàwé
  rationale: ‘Àkàwé’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún irú ìtàn tàbí àpẹẹrẹ ìfiwéra tí Jésù máa ń lò.
- source_word: ἐν τίνι αὐτὴν παραβολῇ θῶμεν
  choice: àkàwé wo ni a ó fi gbé e kalẹ̀
  rationale: ‘Fi … gbé e kalẹ̀’ ka ἐν gẹ́gẹ́ bí ohun èlò, ó sì pa àwòrán τίθημι (‘gbé/fi sílẹ̀’) mọ́ ní Yorùbá tí ó ṣe déédé.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘a ó’ láti fi ìbéèrè ìfọ̀rọ̀wérọ̀ ẹni àkọ́kọ́ ọ̀pọ̀ hàn, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
