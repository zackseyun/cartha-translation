translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. A lo “òwe” ní ìtumọ̀ gbooro fún παραβολή, gẹ́gẹ́ bí ìtàn tàbí àfiwé tí a fi ń kọ́ni.
