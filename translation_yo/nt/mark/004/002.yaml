  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: yo
  text: 'Ó sì ń kọ́ wọn ní ohun púpọ̀ nípasẹ̀ àwọn òwe[a]; nínú ẹ̀kọ́ rẹ̀, ó sì ń wí fún wọn pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọ́ wọn ní ọ̀pọ̀ ohun nípasẹ̀ àwọn òwe.” Ọ̀rọ̀ Gíríìkì πολλά lè túmọ̀ sí “ohun púpọ̀” tàbí “ọ̀pọ̀ ohun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ń ... kọ́ wọn
  rationale: Àkókò imperfect fi hàn pé ìkọ́ni náà ń lọ lọ́wọ́ nínú ìṣẹ̀lẹ̀ náà; “ń kọ́ wọn” ṣe àfihàn èyí lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν παραβολαῖς
  choice: fi òwe
  rationale: ἐν pẹ̀lú dative ń tọ́ka sí ọ̀nà tàbí ohun èlò ìkọ́ni. “Fi òwe” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó kọ́ni nípasẹ̀ àwọn ìtàn àpẹẹrẹ.
- source_word: πολλά
  choice: ọ̀pọ̀lọpọ̀ ohun
  rationale: Neuter plural náà lè túmọ̀ sí “ọ̀pọ̀ ohun” tàbí, ní ṣókí, “púpọ̀.” Àṣàyàn yìí pa ìtẹnumọ́ sí fífẹ̀ ìkọ́ni náà mọ́.
- source_word: ἔλεγεν
  choice: ó sì ń wí
  rationale: Imperfect náà ṣí ọ̀rọ̀ tí ó tẹ̀ lé sílẹ̀ gẹ́gẹ́ bí ohun tí Jesu ń sọ nígbà ìkọ́ni; “ń wí” pa abala ìṣe tó ń lọ mọ́.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: nínú ẹ̀kọ́ rẹ̀
  rationale: Àṣàyàn yìí tẹ̀ lé ìṣètò Gíríìkì, ó sì so ọ̀rọ̀ tí yóò tẹ̀ lé mọ́ àkóónú ìkọ́ni rẹ̀ láì sọ ìtumọ̀ náà di pàtó ju orísun lọ.
- source_word: καὶ
  choice: Ó sì / ó sì
  rationale: “Sì” pa ìtẹ̀síwájú ìtàn àti ara paratactic Máàkù mọ́ ní Yorùbá àdánidá.
- source_word: αὐτοὺς / αὐτοῖς
  choice: wọn / fún wọn
  rationale: “Wọn” jẹ́ ẹni tí a ń kọ́, “fún wọn” sì fi dative ẹni tí a ń bá sọ̀rọ̀ hàn.
