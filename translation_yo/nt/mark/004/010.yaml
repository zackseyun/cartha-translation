id: MRK.4.10
reference: Mark 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: yo
  text: Nígbà tí ó sì wà ní àdádó, àwọn tí ó wà ní àyíká rẹ̀[a], pẹ̀lú àwọn méjìlá náà, ń béèrè lọ́wọ́ rẹ̀ nípa àwọn òwe àkàwé náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó wà pẹ̀lú rẹ̀.” Gbólóhùn náà ń tọ́ka sí ẹgbẹ́ àwọn ọmọlẹ́yìn Jésù tó yí i ká, kì í ṣe àwọn méjìlá nìkan dandan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Nígbà tí ó sì
  rationale: “sì” pa ìsopọ̀ καί mọ́ nínú ìṣàn ìtàn Máàkù, nígbà tí “nígbà tí” túmọ̀ ὅτε lọ́nà àdánidá.
- source_word: ἐγένετο κατὰ μόνας
  choice: ó wà ní ibi ìkọ̀kọ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí wíwà ní àdádó tàbí ní àṣírí, kì í ṣe dandan pé kò sí ẹnikẹ́ni pẹ̀lú rẹ̀ rárá. Èyí bá àyíká ọ̀rọ̀ mu, nítorí àwọn ọmọlẹ́yìn rẹ̀ wá béèrè lọ́wọ́ rẹ̀.
- source_word: ἠρώτων
  choice: ń béèrè lọ́wọ́ rẹ̀
  rationale: Àmì àkókò aláìpé nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń béèrè” pa apá yẹn mọ́ ní Yorùbá àdánidá.
- source_word: οἱ περὶ αὐτὸν
  choice: àwọn tí ó wà ní àyíká rẹ̀
  rationale: Ó pa àwòrán ẹgbẹ́ àwọn ọmọlẹ́yìn tó yí Jésù ká mọ́, láì dín wọn kù sí àwọn méjìlá nìkan.
- source_word: σὺν τοῖς δώδεκα
  choice: pẹ̀lú àwọn méjìlá náà
  rationale: Ó fi ìbáṣepọ̀ ẹgbẹ́ tó gbòòrò pẹ̀lú àwọn Méjìlá hàn, ó sì pa ìyàtọ̀ tó wà láàárín wọn mọ́.
- source_word: τὰς παραβολάς
  choice: àwọn òwe àkàwé náà
  rationale: Ó fi ọ̀pọ̀ nǹkan hàn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, ó sì tọ́ka sí àwọn ẹ̀kọ́ àkàwé tí Jésù ṣẹ̀ṣẹ̀ sọ.
theological_decisions:
- issue: Àwọn wo ni wọ́n ń béèrè lọ́wọ́ Jésù?
  choice: Ẹgbẹ́ àwọn ọmọlẹ́yìn tó wà ní àyíká Jésù, pẹ̀lú àwọn Méjìlá, ni wọ́n ń béèrè lọ́wọ́ rẹ̀.
  alternative: Àwọn Méjìlá nìkan ni wọ́n béèrè; tàbí ẹgbẹ́ mìíràn tó yà sọ́tọ̀ ni ó wà pẹ̀lú àwọn Méjìlá.
  rationale: Ìṣètò ọ̀rọ̀ οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα fi ẹgbẹ́ tó gbòòrò àti àwọn Méjìlá hàn. Ìtumọ̀ náà kò da ẹgbẹ́ méjèèjì pọ̀ sí àwọn Méjìlá nìkan.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, ní èdè òde òní tó ní iyì. “Ní ibi ìkọ̀kọ̀” yẹra fún ìtumọ̀ líle pé Jésù kò ní ẹnikẹ́ni rárá pẹ̀lú rẹ̀, nígbà tí ó ṣì pa èrò ìdákẹ́jẹ àti àṣírí inú κατὰ μόνας mọ́.
