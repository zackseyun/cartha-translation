source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí irè oko bá ti gbó[a], ó sì lẹ́sẹ̀kẹsẹ̀ fi dòjé bẹ́ ẹ, nítorí ìgbà ìkórè ti dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá ti ṣe tán fún ìkórè”; ní ti gidi, “bá fi ara rẹ̀ léni lọ́wọ́.” Gíríìkì lo ìlò ìṣe-ọrọ̀ tí kò wọ́pọ̀, níbi tí irè oko fúnra rẹ̀ ti jẹ́ olùṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅταν ṣe àfihàn àkókò tí kò dá lórí ìṣẹ̀lẹ̀ kan ṣoṣo, δέ sì ń yí ọ̀rọ̀ padà díẹ̀; gbolohun yìí jẹ́ Yorùbá àdánidá fún ‘ṣùgbọ́n nígbà tí.’
- source_word: παραδοῖ ὁ καρπός
  choice: irè oko bá ti gbó
  rationale: παραδοῖ jẹ́ ọ̀rọ̀ aláìlẹ́gbẹ́ níbi yìí, ní ti gidi ó ní èrò ‘fi ara rẹ̀ léni lọ́wọ́’; nínú àyíká iṣẹ́ oko, ó túmọ̀ sí pé irè náà ti ṣe tán fún ìkórè. ‘Bá ti gbó’ sọ èrò náà ní Yorùbá àdánidá, a sì fi àlàyé ìtumọ̀ gidi sí àkọsílẹ̀ ẹsẹ̀.
- source_word: ὁ καρπός
  choice: irè oko
  rationale: Níwọ̀n bí dòjé àti ìkórè ti tẹ̀ lé e, ‘irè oko’ bá àyíká mu ju ‘èso’ lọ, láìdín ọ̀rọ̀ náà kù sí irúgbìn kan pàtó.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ ìgbésẹ̀ kíákíá tí Máàkù sábà máa ń fi εὐθύς hàn mọ́.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: ó fi dòjé sí i
  rationale: Gíríìkì ní ti gidi sọ pé ‘ó rán dòjé’; èyí jẹ́ àwòrán fún bíbẹ̀rẹ̀ ìkórè. ‘Fi dòjé sí i’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa àwòrán dòjé mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí a fi gbé ìgbésẹ̀ lẹ́sẹ̀kẹsẹ̀ hàn.
- source_word: παρέστηκεν ὁ θερισμός
  choice: ìgbà ìkórè ti dé
  rationale: Ọ̀rọ̀ perfect παρέστηκεν túmọ̀ sí pé ìkórè ti dé, ó sì wà níbẹ̀ báyìí; ‘ti dé’ mú ìṣẹ̀lẹ̀ àti ipò tó ń bá a lọ jáde.
theological_decisions:
- issue: Ìmúrasílẹ̀ irè oko gẹ́gẹ́ bí àwòrán nínú òwe ìjọba Ọlọ́run
  choice: Pa àwòrán iṣẹ́ oko mọ́, kí a má sì sọ ohun tí ìkórè dúró fún ní pàtó.
  alternative: Túmọ̀ rẹ̀ ní ọ̀nà tó ń sọ ìdájọ́, iṣẹ́ ìránṣẹ́, tàbí òpin ayé ní tààrà.
  rationale: Ẹsẹ̀ náà kò dá ohun tí ìkórè dúró fún ní pàtó. Ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú òwe náà mọ́ dípò fífi èrò ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá ìpele àárín, tó ní iyì, tó sì yé òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘irè oko,’ ‘dòjé,’ àti ‘ìgbà ìkórè’ pa àwòrán iṣẹ́ oko mọ́.
