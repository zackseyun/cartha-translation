  to: Irúgbìn mìíràn sì bọ́ sórí ilẹ̀ olókùúta[a], níbi tí erùpẹ̀ kò pọ̀; ó sì hù jáde lẹ́sẹ̀kẹsẹ̀ nítorí erùpẹ̀ náà kò jinlẹ̀.
