  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: ‘irúgbìn mìíràn,’ ilẹ̀ olókùúta, erùpẹ̀ díẹ̀, ìhùhù jáde kíákíá, àti àìní ìjìnlẹ̀ erùpẹ̀. Síbẹ̀, ‘níbi tí kò ti ní erùpẹ̀ púpọ̀’ lè jẹ́ kí ó dà bí ẹni pé irúgbìn náà ni kò ní erùpẹ̀, dípò ibi náà. ‘Sórí’ sì túmọ̀ ἐπὶ (‘lórí/sórí’) dájú ju ‘sí’ lọ nínú àyíká irúgbìn tí ó ṣubú sórí ilẹ̀.'
