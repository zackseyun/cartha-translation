  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: yo
  text: Irúgbìn mìíràn sì bọ́ sórí ilẹ̀ olókùúta[a], níbi tí erùpẹ̀ kò pọ̀; ó sì hù jáde lẹ́sẹ̀kẹsẹ̀ nítorí erùpẹ̀ náà kò jinlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilẹ̀ tí òkúta pọ̀.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ilẹ̀ olókùúta tí erùpẹ̀ díẹ̀ péré bo àpáta rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Irúgbìn mìíràn
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù aláìlábùdá ẹyọ kan tí a lò gẹ́gẹ́ bí orúkọ; ó ń tọ́ka sí irúgbìn láti inú àyíká ọ̀rọ̀ tó ṣáájú, nítorí náà fífi ‘irúgbìn’ kún un mú ìtumọ̀ hàn gbangba.
- source_word: πετρῶδες
  choice: ilẹ̀ olókùúta
  rationale: Ó ṣàpèjúwe ilẹ̀ tí àpáta tàbí òkúta pọ̀, tí erùpẹ̀ rẹ̀ sì fẹ́lẹ́fẹ́lẹ́; ‘ilẹ̀ olókùúta’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá àwòrán iṣẹ́ àgbẹ̀ mu.
- source_word: γῆν πολλήν
  choice: erùpẹ̀ púpọ̀
  rationale: Níhìn-ín γῆ túmọ̀ sí erùpẹ̀ tí ohun ọ̀gbìn lè dàgbà nínú rẹ̀, kì í ṣe ilẹ̀ ní ìtumọ̀ gbòòrò.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi bí ohun náà ṣe ṣẹlẹ̀ kíákíá hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐξανέτειλεν
  choice: hù jáde
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀, ọ̀rọ̀ náà ń tọ́ka sí bí irúgbìn ṣe rú jáde láti inú erùpẹ̀.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: nítorí erùpẹ̀ náà kò jinlẹ̀
  rationale: Ìṣètò διά pẹ̀lú infinitive tó ní article fi ìdí ohun tó ṣẹlẹ̀ hàn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán erùpẹ̀ tí kò ní ìjìnlẹ̀ mọ́.
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó jẹ́ ọ̀rọ̀ ìbátan tó ń tọ́ka sí ibi; ‘níbi tí’ ni ìtumọ̀ Yorùbá tó tààrà.
