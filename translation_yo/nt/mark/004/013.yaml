id: MRK.4.13
reference: Mark 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ṣé ẹ kò lóye àkàwé yìí? Báwo ni ẹ ó ṣe wá lóye gbogbo àwọn àkàwé náà?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “Ṣé ẹ kò mọ àkàwé yìí? Báwo ni ẹ ó sì ṣe mọ gbogbo àwọn àkàwé náà?” Àwọn ọ̀rọ̀ ìṣe Gíríìkì lè túmọ̀ sí “mọ̀,” ṣùgbọ́n níbí wọn ní ìtumọ̀ “lóye.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì wí
  rationale: A lo ìṣe àsìkò ìsinsìnyí tí ó ní ìtumọ̀ ìtàn nínú Gíríìkì ní ọ̀nà Yorùbá tí ó wọ́pọ̀ nínú ìtàn; “wí” jẹ́ ọ̀rọ̀ ọlọ́lá, ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: οἴδατε
  choice: ẹ kò lóye
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí “mọ̀,” níbí ó ń tọ́ka sí lílóye ìtumọ̀ àkàwé, kì í ṣe mímọ̀ nípa rẹ̀ lásán.
- source_word: παραβολὴν
  choice: àkàwé
  rationale: “Àkàwé” ni ọ̀rọ̀ Yorùbá tí ó bá irú ẹ̀kọ́ Jesu yìí mu, ó sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì mọ̀.
- source_word: ταύτην
  choice: yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí àkàwé tí Jesu ṣẹ̀ṣẹ̀ sọ.
- source_word: καὶ πῶς
  choice: Báwo ni ... ṣe wá
  rationale: “Wá” mú ìbáṣepọ̀ ìyọrísí láàárín ìbéèrè méjèèjì hàn ní Yorùbá àdánidá, láìfi èrò tuntun kún un.
- source_word: πάσας τὰς παραβολὰς
  choice: gbogbo àwọn àkàwé náà
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ pẹ̀lú πᾶς mọ́, ó sì tọ́ka ní gbangba sí àkójọpọ̀ àwọn àkàwé.
- source_word: γνώσεσθε
  choice: ẹ ó ... lóye
  rationale: Ọ̀rọ̀ náà ń sọ nípa bí wọn yóò ṣe lóye ìtumọ̀ àwọn àkàwé; yíyan “lóye” tún pa agbára àfiwé ìbéèrè méjèèjì mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ οἴδατε àti γνώσεσθε
  choice: A tú àwọn méjèèjì sí “lóye.”
  alternative: A lè tú wọn sí “mọ̀,” tàbí kí a tú ti àkọ́kọ́ sí “mọ̀” àti ti kejì sí “lóye.”
  rationale: Àyíká ọ̀rọ̀ náà dá lórí lílóye àwọn àkàwé Jesu. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gígùn “mọ̀” tí àwọn ọ̀rọ̀ Gíríìkì méjèèjì lè ní mọ́.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ṣé” fún ìbéèrè tí ó ní agbára ìbáwí, àti “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn.
