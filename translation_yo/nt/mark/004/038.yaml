- from: Ṣùgbọ́n òun fúnra rẹ̀ wà ní ẹ̀yìn ọkọ̀, ó ń sùn lórí ìrọ̀rí[a]. Wọ́n jí i, wọ́n sì wí fún un pé, “Olùkọ́, ìwọ kò bìkítà pé à ń ṣègbé?”
  to: Òun fúnra rẹ̀ sì wà ní ẹ̀yìn ọkọ̀ ojú omi, ó ń sùn lórí ìrọ̀rí[a]. Wọ́n jí i, wọ́n sì sọ fún un pé, “Olùkọ́, ṣé o kò bìkítà pé à ń ṣègbé?”
  rationale: Àtúnṣe náà rọ́pò ìsopọ̀ alòdì tí kò sí nínú Gíríìkì pẹ̀lú “sì,” sọ ọkọ̀ ojú omi di mímọ̀, lo ọ̀rọ̀ ìtàn Yorùbá òde òní tí ó wúlò, ó sì tún àkọsílẹ̀ náà ṣe kí ó má bà a jẹ́ nípa pípe ìrọ̀rí ní àga. Ìtumọ̀, ìtẹnumọ́, àti líle ìbéèrè Gíríìkì ṣì wà láìfi ìtumọ̀ ẹ̀kọ́ ẹ̀sìn kún un.
