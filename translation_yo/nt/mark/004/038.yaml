id: MRK.4.38
reference: Mark 4:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: yo
  text: Òun fúnra rẹ̀ sì wà ní ẹ̀yìn ọkọ̀ ojú omi, ó ń sùn lórí ìrọ̀rí[a]. Wọ́n jí i, wọ́n sì sọ fún un pé, “Olùkọ́, ṣé o kò bìkítà pé à ń ṣègbé?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lórí ohun tí a fi ń gbé orí lé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìrọ̀rí tàbí ohun ìgbọ́orí.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: òun fúnra rẹ̀ wà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ αὐτός tí a fi hàn gbangba níbí ní agbára ìtẹnumọ́ àti ìyàtọ̀; “òun fúnra rẹ̀” pa agbára yẹn mọ́ ní Yorùbá.
- source_word: πρύμνῃ
  choice: ní ẹ̀yìn ọkọ̀
  rationale: πρύμνα túmọ̀ sí apá ẹ̀yìn ọkọ̀ ojú omi. Gbólóhùn yìí ṣe kedere fún òǹkàwé Yorùbá ju lílo ọ̀rọ̀ àkànṣe ti iṣẹ́ ọkọ̀ lọ.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: lórí ìrọ̀rí
  rationale: προσκεφάλαιον jẹ́ ohun tí a fi ń gbé orí lé, ìrọ̀rí tàbí aga kékeré asọ; “ìrọ̀rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi àlàyé tí Gíríìkì kò sọ kún un.
- source_word: καθεύδων
  choice: ó ń sùn
  rationale: Ẹ̀yà ọ̀rọ̀ yìí ṣàpèjúwe ipò tí ó ń bá a lọ ní àkókò náà; “ó ń sùn” jẹ́ àdánidá, ó sì pa ìtẹ̀síwájú iṣẹ́ náà mọ́.
- source_word: ἐγείρουσιν
  choice: wọ́n jí i
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí ìtàn, “wọ́n jí i” jẹ́ ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ ìtàn ní Yorùbá.
- source_word: λέγουσιν
  choice: wọ́n sì wí fún un
  rationale: A ṣe àsìkò ìsinsìnyí ìtàn náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀; “wí fún un” jẹ́ ọ̀rọ̀ ọ̀wọ̀, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: διδάσκαλος túmọ̀ ní tààrà sí ẹni tí ń kọ́ni; “Olùkọ́” kò fi ìtumọ̀ míràn bí “Ọ̀gá” tàbí oyè ẹ̀sìn kún un.
- source_word: οὐ μέλει σοι
  choice: ìwọ kò bìkítà
  rationale: Gbólóhùn náà fi ẹ̀sùn àti ìbéèrè líle hàn. Fífi “ìwọ” síbẹ̀ ń mú ìtẹnumọ́ inú ìbéèrè náà jáde ní Yorùbá.
- source_word: ἀπολλύμεθα
  choice: à ń ṣègbé
  rationale: Fọ́ọ̀mù náà ń sọ ìparun tàbí ikú tó sún mọ́lé. “À ń ṣègbé” pa ìyára, ewu, àti agbára ọ̀rọ̀ náà mọ́ láì sọ pé ikú ti ṣẹlẹ̀ tán.
theological_decisions:
- issue: Agbára ìtàn inú ìbéèrè àwọn ọmọ-ẹ̀yìn sí Jesu
  choice: “ìwọ kò bìkítà pé à ń ṣègbé?”
  alternative: “Ṣé kò ṣe pàtàkì sí ọ pé a fẹ́ kú?”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìbéèrè pajawiri tó ní ẹ̀sùn nínú, kì í ṣe ìbéèrè ìròyìn lásán. Ìtumọ̀ yìí pa ìdààmú àti ìforígbárí náà mọ́ láì ṣe ìdájọ́ lórí èrò Jesu tàbí ìgbàgbọ́ àwọn ọmọ-ẹ̀yìn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá bá ìlò àdánidá mu. Èdè náà jẹ́ títọ́, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní; a lo “ẹ̀yìn ọkọ̀” dípò ọ̀rọ̀ iṣẹ́ ọkọ̀ tí ó lè ṣòro, a sì pa ìbéèrè àwọn ọmọ-ẹ̀yìn mọ́ ní líle rẹ̀.
