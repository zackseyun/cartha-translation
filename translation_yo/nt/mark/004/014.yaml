  text: The sower sows the word[a].
translation:
  language: yo
  text: Afúnrúgbìn náà ń fúnrúgbìn ọ̀rọ̀ náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìhìn náà.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí “ọ̀rọ̀” tàbí “ìhìn,” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Afúnrúgbìn
  rationale: Ọ̀rọ̀ yìí fi participle tí ó ní article hàn gẹ́gẹ́ bí orúkọ ẹni tí iṣẹ́ rẹ̀ nínú àkàwé náà jẹ́ fífúnrúgbìn. “Afúnrúgbìn” ṣe kúkúrú, ó sì pa àwòrán àkàwé náà mọ́ láì túmọ̀ rẹ̀ sí “àgbẹ̀,” èyí tí yóò fi iṣẹ́ ẹni náà hàn ní ọ̀nà tí ó gbòòrò ju Gíríìkì lọ.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: λόγος lè túmọ̀ sí “ọ̀rọ̀” tàbí “ìhìn iṣẹ́” ní ibámu pẹ̀lú àyíká ọ̀rọ̀. “Ọ̀rọ̀ náà” tẹ̀ lé Gíríìkì pẹ́kípẹ́kí, ó sì yẹra fún fífi “Ọ̀rọ̀ Ọlọ́run” tàbí “ìhìn rere” kún ohun tí ẹsẹ yìí sọ ní tààrà.
- source_word: σπείρει
  choice: ń fún
  rationale: Àmì ìṣe “ń” pẹ̀lú “fún” sọ ìṣe tí afúnrúgbìn máa ń ṣe ní gbogbogbòò. Ó tún pa àsopọ̀ ọ̀rọ̀ tó wà láàárín “Afúnrúgbìn” àti “ń fún” mọ́, bí Gíríìkì ṣe tún gbòǹgbò σπειρ- lò.
theological_decisions:
- issue: Ohun tí “ọ̀rọ̀ náà” ń tọ́ka sí nínú àlàyé àkàwé náà
  choice: ọ̀rọ̀ náà
  alternative: ìhìn iṣẹ́ náà; Ọ̀rọ̀ Ọlọ́run; ìhìn rere
  rationale: Gíríìkì ní τὸν λόγον nìkan. Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí ìkéde ìhìn àtọ̀dọ̀ Ọlọ́run, fífi “Ọlọ́run” tàbí “ìhìn rere” kún un yóò yan ìtumọ̀ kan tí ẹsẹ náà kò sọ ní gbangba. Ìtumọ̀ yìí pa ààyè ìtumọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtúmọ̀ náà pa àwòrán fífúnrúgbìn àti àtúnsọ gbòǹgbò ọ̀rọ̀ inú Gíríìkì mọ́.
