  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi ń bẹ̀rù?[a] Ṣé ẹ kò tíì ní ìgbàgbọ́?[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó túmọ̀ ọ̀rọ̀ náà ní líle síi, “Èé ṣe tí ẹ fi ń ṣe bí ẹlẹ́rùjẹ̀jẹ̀?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ṣé ẹ kò ní ìgbàgbọ́ títí di báyìí?”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì πίστις tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé” níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ àrọ́sọ̀ tó bá Yorùbá mu, ó sì so ọ̀rọ̀ yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀.
- source_word: εἶπεν αὐτοῖς
  choice: wí fún wọn
  rationale: Ìtumọ̀ àdánidá fún ọ̀rọ̀ ìṣe tí ó ń ṣáájú ọ̀rọ̀ tààrà, pẹ̀lú ẹni tí a bá sọ̀rọ̀ sí.
- source_word: Τί δειλοί ἐστε
  choice: Èé ṣe tí ẹ fi ń bẹ̀rù báyìí?
  rationale: Τί ṣiṣẹ́ gẹ́gẹ́ bí ‘èé ṣe’ nínú ìbéèrè ìbáwí yìí. δειλοί ní agbára tó lè túmọ̀ sí ‘ọ̀lẹ nínú ewu’ tàbí ‘ẹlẹ́rù,’ ṣùgbọ́n àyíká ìjì náà mú ‘ń bẹ̀rù báyìí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì sọ agbára ọ̀rọ̀ Gíríìkì nù; a fi ìtumọ̀ tó le síi sínú àlàyé ìsàlẹ̀.
- source_word: οὔπω
  choice: kò tíì
  rationale: Ó pa ìtumọ̀ àkókò ‘not yet’ mọ́ ní tààrà, ó sì jẹ́ àdánidá nínú Yorùbá.
- source_word: ἔχετε πίστιν
  choice: ní ìgbàgbọ́
  rationale: ἔχετε tọ́ka sí níní tàbí wíwà ní ipò kan; ‘ní ìgbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu. ‘Ìgbẹ́kẹ̀lé’ tún ṣeé ṣe nínú àyíká yìí, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí ‘ìgbẹ́kẹ̀lé’ tún bá àyíká mu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀sìn àti fífẹ̀ ìtumọ̀ πίστις mọ́, nígbà tí ‘ìgbẹ́kẹ̀lé’ ṣàlàyé bí ó ṣe kan fífi ara le Jésù láàárín ewu. Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí wọ́n gbọ́ tàbí gbẹ́kẹ̀ lé ní gbangba, nítorí náà a kò fi kún ọ̀rọ̀ pàtàkì.
- issue: Agbára ìbáwí inú δειλοί
  choice: ń bẹ̀rù báyìí
  alternative: ẹ ṣe ń ṣe bí ẹlẹ́rù
  rationale: Àṣàyàn pàtàkì dá lórí ìbẹ̀rù àwọn ọmọ-ẹ̀yìn nínú ìjì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ líle ‘cowardly’ mọ́ láì sọ ọ́ di ìdájọ́ ìwà tí ó kọjá àyíká.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè méjèèjì pa ìbáwí àti ìyàlẹ́nu ọ̀rọ̀ Gíríìkì mọ́. ‘Báyìí’ ń fi agbára àyíká hàn, nígbà tí ‘kò tíì’ pa οὔπω mọ́ láì yanju ìṣòro ìtumọ̀ rẹ̀ lọ́nà ẹ̀kọ́ ìsìn.
