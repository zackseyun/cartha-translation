  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: yo
  text: 'Ó sì ń wí pé,[a] “Báyìí ni ìjọba Ọlọ́run rí: bí ọkùnrin kan[b] bá fọ́n irúgbìn sórí ilẹ̀,[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ń wí’ tún lè túmọ̀ sí ‘ó sì wí’; ìṣe Gíríìkì lè fi ọ̀rọ̀ tí ó ń bá a lọ tàbí tí a máa ń sọ hàn.
    reason: aspectual_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ-ẹyọ; ‘ọkùnrin kan’ ń tọ́ka sí ẹni aṣojú kan nínú àkàwé yìí.
    reason: lexical_alternative
  - marker: c
    text: Àfiwé Gíríìkì há díẹ̀ níbí, ó sì ń bá a lọ nínú ẹsẹ tó tẹ̀ lé e. A tún lè túmọ̀ rẹ̀ pé, ‘Ìjọba Ọlọ́run dà bí ẹni pé ọkùnrin kan fọ́n irúgbìn sórí ilẹ̀.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń wí
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ yìí fi apá imperfect hàn, ó sì lè tọ́ka sí ọ̀rọ̀ tí ó ń bá a lọ tàbí tí a máa ń sọ.
- source_word: Οὕτως
  choice: Báyìí ni ... rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ bí ohun kan ṣe rí kí àfiwé tó tẹ̀ lé e.
- source_word: βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó jẹ́ gbólóhùn Yorùbá tí a mọ̀ dáadáa, ó sì lè ní ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run.
- source_word: ὡς ἄνθρωπος
  choice: bí ọkùnrin kan bá
  rationale: ‘Bí ... bá’ mú àfiwé àti ìṣe tí a gbé kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ jáde ní Yorùbá; ‘ọkùnrin kan’ sì pa akọ ẹyọ ọ̀rọ̀ orísun mọ́.
- source_word: βάλῃ
  choice: bá fọ́n
  rationale: Ní àyíká iṣẹ́ àgbẹ̀, fífọ́n irúgbìn ni ìṣe tí βάλλω ń tọ́ka sí; yíyàn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán títú irúgbìn ká mọ́.
- source_word: τὸν σπόρον
  choice: irúgbìn
  rationale: ‘Irúgbìn’ ni ọ̀rọ̀ Yorùbá àdánidá fún seed tí a ń gbìn; a kò nílò atúmọ̀ article náà lọ́tọ̀ níbí.
- source_word: ἐπὶ τῆς γῆς
  choice: sórí ilẹ̀
  rationale: Ní àyíká yìí γῆ túmọ̀ sí ilẹ̀ tí a ń gbìn, kì í ṣe ayé gẹ́gẹ́ bí gbogbo ẹ̀dá.
theological_decisions:
- issue: Àfiwé tí gírámà rẹ̀ há díẹ̀ tí ó sì ń bá a lọ sí ẹsẹ tó tẹ̀ lé e
  choice: 'Pa ìṣí sílẹ̀ mọ́ pẹ̀lú ‘Báyìí ni ... rí: bí ... bá ...’'
  alternative: ‘Ìjọba Ọlọ́run dà bí ọkùnrin kan tí ó fọ́n irúgbìn sórí ilẹ̀.’
  rationale: Èdè Gíríìkì kò parí àfiwé náà ní ẹsẹ yìí; àtúmọ̀ yìí kò fi ọkùnrin náà dọ́gba pátápátá pẹ̀lú ìjọba, kò sì fi àlàyé tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn ‘Báyìí ni ... rí’ jẹ́ àdánidá fún olùkà Yorùbá, nígbà tí ‘bí ... bá’ pa ìṣàn àfiwé tí kò tíì parí mọ́.
