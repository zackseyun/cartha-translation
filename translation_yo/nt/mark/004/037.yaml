source:
  edition: SBLGNT
  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: yo
  text: Ìjì ẹ̀fúùfù ńlá kan sì dìde[a], àwọn ìgbì omi sì ń kọlu ọkọ̀ náà, wọ́n sì ń ró wọ inú rẹ̀[b], débi pé ọkọ̀ náà ti ń kún fún omi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ rẹ̀ lọ́nà tó sún mọ́ ọ̀rọ̀ Gíríìkì, “ìjì ńlá ti ẹ̀fúùfù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ìgbì omi sì ń lù wọ inú ọkọ̀ náà.” Ọ̀rọ̀ ìṣe Gíríìkì fi ìṣe tó ń ṣẹlẹ̀ léraléra hàn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “omi sì ti ń kún inú ọkọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: dìde
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìsinsìnyí nínú ìtàn Gíríìkì tó ń mú ìṣẹ̀lẹ̀ hàn bí ohun tó ń ṣẹlẹ̀ lójú ẹni; “dìde” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìjì bẹ̀rẹ̀ lojijì.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: ìjì ẹ̀fúùfù ńlá kan
  rationale: Èyí pa ìtumọ̀ ìjì líle tí ẹ̀fúùfù ńlá ń fà mọ́, ó sì tún ṣàfihàn μεγάλη (“ńlá”) àti ἀνέμου (“ẹ̀fúùfù”).
- source_word: κύματα
  choice: àwọn ìgbì omi
  rationale: “Àwọn ìgbì omi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká adágún mu.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: ń kọlu ọkọ̀ náà, wọ́n sì ń ró wọ inú rẹ̀
  rationale: Ìṣe aláìparí náà ń fi ìgbì tó ń kọlu ọkọ̀ léraléra, tó sì ń wọ inú rẹ̀ hàn. Gbólóhùn Yorùbá yìí mú agbára ìkọlù àti ìwọlé náà pọ̀.
- source_word: πλοῖον
  choice: ọkọ̀
  rationale: “Ọkọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun èlò ìrìn lórí omi ní àyíká yìí; kò fi hàn pé ó tóbi bí ọkọ̀ ojú omi ńlá.
- source_word: ὥστε
  choice: débi pé
  rationale: “Débi pé” fi àbájáde ìgbì tó ń wọ inú ọkọ̀ hàn ní kedere.
- source_word: ἤδη γεμίζεσθαι τὸ πλοῖον
  choice: ọkọ̀ náà ti ń kún fún omi
  rationale: “Ti ń kún” fi hàn pé ìkún omi náà ti bẹ̀rẹ̀, ó sì ń bá a lọ; fífi “omi” kún un jẹ́ ohun tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn, ní èdè ìtàn tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo “ọkọ̀” dípò ọ̀rọ̀ tó lè mú kí ènìyàn ronú nípa ọkọ̀ ojú omi ńlá; àyíká náà ti mú kedere pé ọkọ̀ lórí omi ni.
