id: MRK.4.36
reference: Mark 4:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: yo
  text: Wọ́n sì fi ọ̀pọ̀ ènìyàn náà sílẹ̀, wọ́n mú un lọ pẹ̀lú wọn bí ó ti wà, nínú ọkọ̀ ojú omi náà.[a] Àwọn ọkọ̀ ojú omi mìíràn sì wà pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ́n mú un lọ pẹ̀lú wọn bí ó ti wà nínú ọkọ̀ ojú omi náà.” Èdè Gíríìkì lè tẹnu mọ́ pé Jésù ti wà nínú ọkọ̀ náà, tàbí pé wọ́n mú un lọ láìṣe ìmúrasílẹ̀ mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: fi … sílẹ̀
  rationale: Àpólà yìí fi ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn. “Fi … sílẹ̀” jẹ́ èdè Yorùbá àdánidá, kò sì fi dandan túmọ̀ rẹ̀ sí pé wọ́n lé ogunlọ́gọ̀ náà lọ ní ìlànà pàtó.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: “Ogunlọ́gọ̀” túmọ̀ sí ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì bá àyíká ìtàn náà mu.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: wọ́n mú un lọ pẹ̀lú wọn
  rationale: Ìtumọ̀ παραλαμβάνω níbí ni láti mú ẹnì kan lọ pẹ̀lú ara ẹni; “pẹ̀lú wọn” mú agbára ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá.
- source_word: ὡς ἦν
  choice: bí ó ti wà
  rationale: Ìtumọ̀ yìí pa ọ̀nà sílẹ̀ fún èrò pé wọ́n mú Jésù lọ láìṣe ìmúrasílẹ̀ mìíràn, ní ipò tí ó ti wà.
- source_word: ἐν τῷ πλοίῳ
  choice: nínú ọkọ̀ ojú omi náà
  rationale: “Ọkọ̀ ojú omi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún πλοῖον ní àyíká Òkun Galili; “náà” tọ́ka sí ọkọ̀ tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀.
- source_word: ἄλλα πλοῖα
  choice: àwọn ọkọ̀ ojú omi mìíràn
  rationale: Gíríìkì sọ “àwọn ọkọ̀ mìíràn” láìfi ọ̀rọ̀ kan kún un pé wọ́n kéré, nítorí náà a kò fi “kéékèèké” kún ìtumọ̀.
- source_word: ἦν μετ’ αὐτοῦ
  choice: wà pẹ̀lú rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹyọ ọ̀rọ̀ nítorí kókó ọ̀rọ̀ aláìní akọ tàbí abo tó pọ̀, Yorùbá kò nílò ìyàtọ̀ iye nínú “wà”; “pẹ̀lú rẹ̀” sì pa àkọsílẹ̀ ìtàn náà mọ́ láìsọ ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Ìbáṣepọ̀ ὡς ἦν àti ἐν τῷ πλοίῳ
  choice: A yà “bí ó ti wà” sí mímú Jésù lọ, a sì fi “nínú ọkọ̀ ojú omi náà” hàn gẹ́gẹ́ bí ibi tí ó ti wà.
  alternative: “Wọ́n mú un lọ pẹ̀lú wọn bí ó ti wà nínú ọkọ̀ ojú omi náà.”
  rationale: Èdè Gíríìkì lè tẹnu mọ́ pé Jésù ti wà nínú ọkọ̀ náà tàbí pé wọ́n mú un lọ láìṣe ìmúrasílẹ̀ mìíràn. Ọ̀rọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀ pa àìdánilójú gidi yìí mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Ogunlọ́gọ̀” àti “ọkọ̀ ojú omi” jẹ́ ọ̀rọ̀ àdánidá fún òǹkàwé Yorùbá òde òní; a sì yà àwọn gbólóhùn díẹ̀ láti má ṣe dá ìtumọ̀ èdè Gíríìkì dúró sí ọ̀nà kan ṣoṣo.
