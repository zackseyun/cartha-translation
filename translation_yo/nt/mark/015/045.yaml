  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: yo
  text: Lẹ́yìn tí Pilatu ti gbọ́ láti ọ̀dọ̀ balógun ọ̀rún, ó fi òkú náà[a] fún Jósẹ́fù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ara òkú náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: lẹ́yìn tí ... ti gbọ́ ọ̀rọ̀ náà
  rationale: 'Aorist participle náà ń fi ìṣẹ̀lẹ̀ tó ṣáájú hàn: Pilatu kọ́kọ́ gba ìròyìn náà, lẹ́yìn náà ló fi òkú náà fún Jósẹ́fù. ‘Gbọ́ ọ̀rọ̀ náà’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó rí ìdánilójú gbà.'
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: láti ọ̀dọ̀ balógun ọ̀rún
  rationale: ἀπό pẹ̀lú genitive ń tọ́ka sí ibi tí ìròyìn ti wá. ‘Balógun ọ̀rún’ ṣàlàyé ipò kenturíónì Romu ní ọ̀nà tí òǹkàwé Yorùbá lè lóye.
- source_word: ἐδωρήσατο
  choice: fi ... fún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífúnni tàbí fífi ohun kan lé ẹni lọ́wọ́ gẹ́gẹ́ bí ojúrere. Nínú àyíká yìí, Pilatu yọ̀ǹda òkú náà fún Jósẹ́fù; ‘fi ... fún’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá àṣẹ ìjọba náà mu.
- source_word: πτῶμα
  choice: òkú náà
  rationale: πτῶμα ń tọ́ka ní pàtó sí ara ẹni tó ti kú. ‘Òkú’ dá ìtumọ̀ yìí sí Yorùbá ní ṣókí, láìfi ikú Jésù sí òjìji.
- source_word: τῷ Ἰωσήφ
  choice: fún Jósẹ́fù
  rationale: Dative náà fi Jósẹ́fù hàn gẹ́gẹ́ bí ẹni tí Pilatu fi òkú náà fún.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πτῶμα
  choice: òkú náà
  alternative: ara náà
  rationale: Nípa ìtumọ̀ gírámà àti ọ̀rọ̀, πτῶμα túmọ̀ sí òkú tàbí ara ẹni tó ti kú. Yíyan ‘òkú’ pa ìjẹ́rìí ìtàn pé Jésù ti kú mọ́, láìfikún ẹ̀kọ́ ẹ̀sìn kankan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. Orúkọ Pilatu ni a tún sọ dípò ọ̀rọ̀ arọ́pò-orúkọ nítorí pé ẹsẹ yìí lè dúró gẹ́gẹ́ bí àyọkà kan ṣoṣo.
