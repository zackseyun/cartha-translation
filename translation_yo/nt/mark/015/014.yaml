  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: yo
  text: Ṣùgbọ́n Pílátù ń sọ fún wọn pé, “Kí ni ó ṣe búburú?” Ṣùgbọ́n wọ́n sì túbọ̀ ké sí i pé, “Kàn án mọ́ àgbélébùú!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń tún ṣe hàn; “ń sọ” pa apá yìí mọ́ láìfi dandan sọ pé ó tún ọ̀rọ̀ náà ṣe léraléra.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Èé ṣe? Ibi wo ni ó ṣe?
  rationale: γάρ níbí ń béèrè ìdí tàbí ẹ̀rí fún ẹ̀sùn náà. “Èé ṣe?” mú ipa ìbéèrè yẹn jáde ní Yorùbá àdánidá, “Ibi wo ni ó ṣe?” sì pa κακόν mọ́ gẹ́gẹ́ bí ibi tó ní agbára ìwà rere àti ìwà búburú.
- source_word: κακόν
  choice: ibi
  rationale: “Ibi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ohun búburú ní ti ìwà àti ẹ̀sùn; kò dín agbára ọ̀rọ̀ Gíríìkì náà kù sí àṣìṣe lásán.
- source_word: περισσῶς
  choice: túbọ̀
  rationale: “Túbọ̀” fi bí igbe wọn ṣe pọ̀ sí i hàn ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ἔκραξαν
  choice: ké sókè
  rationale: Ọ̀rọ̀ yìí mú igbe rara ní gbangba tí κράζω túmọ̀ sí jáde.
- source_word: Σταύρωσον αὐτόν
  choice: Kàn án mọ́ àgbélébùú!
  rationale: Èyí jẹ́ àṣẹ tààrà sí Pílátù, ó sì lo ọ̀rọ̀ Yorùbá tí ó ti fìdí múlẹ̀ fún ìkànmọ́ àgbélébùú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tó wà láàárín ọ̀rọ̀ Pílátù àti ìdáhùn ogunlọ́gọ̀ hàn ní àwọn apá méjèèjì.
- source_word: Πιλᾶτος
  choice: Pílátù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
theological_decisions:
- issue: Agbára ìwà rere àti ìwà búburú nínú κακόν nínú ìbéèrè Pílátù
  choice: A túmọ̀ rẹ̀ sí “ibi”
  alternative: “ohun búburú” tàbí “àṣìṣe”
  rationale: “Ibi” pa agbára ẹ̀sùn ní ti òfin àti ìwà mọ́, láìdín un kù sí àṣìṣe kékeré tàbí fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún oníkàwé lásán. A yan “Èé ṣe? Ibi wo ni ó ṣe?” láti jẹ́ kí γάρ àti ìbéèrè ìdí rẹ̀ hàn ní ọ̀nà àdánidá.
