  text: And the chief priests were accusing him of many things[a].
translation:
  language: yo
  text: Àwọn olórí àlùfáà sì ń fi ọ̀pọ̀ ẹ̀sùn kan án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn olórí àlùfáà sì ń fẹ̀sùn ọ̀pọ̀ nǹkan kàn án.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ yìí mọ́ ìtàn tó ṣáájú rẹ̀, ó sì pa ìṣàn ọ̀rọ̀ Márùkù mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: κατηγόρουν
  choice: ń fi ... ẹ̀sùn kan
  rationale: Àmì àkókò imperfect fi hàn pé ẹ̀sùn fífi náà ń lọ lọ́wọ́ tàbí pé wọ́n ń ṣe é léraléra; ìtumọ̀ yìí mú ìṣe tó ń bá a lọ yẹn jáde.
- source_word: αὐτοῦ
  choice: án
  rationale: Genitive lẹ́yìn κατηγορέω ń tọ́ka sí ẹni tí wọ́n ń fẹ̀sùn kàn; ọ̀rọ̀ arọ́pò-orúkọ olùgbà ní Yorùbá sọ èyí ní àdánidá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe pé gbogbo wọn ló jẹ́ olórí àlùfáà kan ṣoṣo.
- source_word: πολλά
  choice: ọ̀pọ̀ ẹ̀sùn
  rationale: Neuter plural náà tọ́ka sí ọ̀pọ̀ nǹkan tí wọ́n fi ń fẹ̀sùn kàn án. ‘Ọ̀pọ̀ ẹ̀sùn’ jẹ́ kedere, ó sì bá àyíká ìdájọ́ mu láìfi kúlẹ̀kúlẹ̀ tí Gíríìkì kò sọ kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo ‘ń ... kàn’ láti pa ìtumọ̀ ìṣe tó ń bá a lọ nínú imperfect mọ́; àmì ẹsẹ̀ ìsàlẹ̀ [a] wà nínú ọ̀rọ̀ gangan.
