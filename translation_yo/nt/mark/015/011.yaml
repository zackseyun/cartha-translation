translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ẹni tí ó jẹ́ kókó-ọrọ̀ ἀπολύσῃ mọ́ gẹ́gẹ́ bí ẹni tí àyíká ọ̀rọ̀ fi hàn, a kò sì fi orúkọ rẹ̀ kún ẹsẹ náà.
