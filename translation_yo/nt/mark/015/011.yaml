base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn olórí àlùfáà mú ọ̀pọ̀ ènìyàn náà ru kí ó kúkú dá Bárábà sílẹ̀ fún wọn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ru ọ̀pọ̀ ènìyàn náà sókè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ẹgbẹ́ ènìyàn kan ru sí ìgbésẹ̀ tí ẹni kan fẹ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kàkà bẹ́ẹ̀.” Èrò ọ̀rọ̀ náà ni pé kí ó dá Bárábà sílẹ̀ ní ààyò ju àṣàyàn kejì tí àyíká ọ̀rọ̀ náà tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ṣe àfihàn ìyàtọ̀ pẹ̀lẹ́ sí ohun tí Pílátù ṣẹ̀ṣẹ̀ béèrè; “Ṣùgbọ́n” jẹ́ ọ̀nà àdánidá láti fi ìyàtọ̀ náà hàn.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà ní Jerúsálẹ́mù, kì í ṣe pé gbogbo wọn jẹ́ olórí àlùfáà kan ṣoṣo.
- source_word: ἀνέσεισαν
  choice: ru ... sókè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ẹgbẹ́ ènìyàn ru sí ìgbésẹ̀ kan; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὸν ὄχλον
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: ὄχλος ni àwùjọ ènìyàn tí ó péjọ; “ọ̀pọ̀ ènìyàn náà” ṣe kedere, ó sì yẹ fún ìtàn náà.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó bẹ̀rẹ̀ gbólóhùn ète tàbí àbájáde tí àwọn olórí àlùfáà fẹ́ mú ṣẹ.
- source_word: μᾶλλον
  choice: dípò rẹ̀
  rationale: Ó fi ìfẹ́ sí Bárábà ju ẹni mìíràn tí àyíká ọ̀rọ̀ ti tọ́ka sí hàn. Arọ́pò-orúkọ “rẹ̀” pa ìtọ́kasí náà mọ́ láì tún orúkọ Jésù fi kún ẹsẹ yìí.
- source_word: τὸν Βαραββᾶν
  choice: Bárábà
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìrísí tí ó wọ́pọ̀, tí ó sì bá ìlànà ìkọ̀wé Yorùbá mu.
- source_word: ἀπολύσῃ
  choice: dá ... sílẹ̀
  rationale: Aoristi subjunctive lẹ́yìn ἵνα sọ ohun tí wọ́n fẹ́ kí Pílátù ṣe; “dá ... sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìtúsílẹ̀ ẹlẹ́wọ̀n.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dative náà fi àwọn ènìyàn hàn gẹ́gẹ́ bí ẹni tí ìtúsílẹ̀ náà jẹ́ fún; “fún wọn” jẹ́ ọ̀nà Yorùbá àdánidá.
