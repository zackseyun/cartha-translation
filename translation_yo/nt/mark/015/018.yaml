  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: yo
  text: Wọ́n sì bẹ̀rẹ̀ sí í kí i[a] pé, “Kábíyèsí, Ọba àwọn Júù[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí i ní ìkíni.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìkíni lásán, ṣùgbọ́n níbí ó ní ìrísí ìkíni ọba tí wọ́n fi ń ṣe ẹ̀gàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ará Jùdíà.” Ọ̀rọ̀ náà lè tọ́ka sí àwọn Júù tàbí àwọn ará Jùdíà; a lo “àwọn Júù” níbí nítorí pé ìyẹn ni ìtumọ̀ tó wọ́pọ̀ nínú àkọlé yìí ní àkọsílẹ̀ ìjìyà Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wọ́n sì
  rationale: “Sì” pa ìsopọ̀ gbolohun ti Máàkù mọ́ láì fi ìtumọ̀ àkókò bí “lẹ́yìn náà” kún un.
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó fi ìtumọ̀ ìbẹ̀rẹ̀ ìṣe tí ἄρχομαι pẹ̀lú ọ̀rọ̀-ìṣe àìlópin ní hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀσπάζεσθαι
  choice: kí i
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí kíni tàbí kí ẹnìkan káàbọ̀; níbí, ọ̀nà tí wọ́n gbà kí i jẹ́ àwàdà ìkíni ọba.
- source_word: Χαῖρε
  choice: Kábíyèsí
  rationale: Nínú àyíká yìí, Χαῖρε jẹ́ ìkíni ayẹyẹ sí ọba, kì í ṣe àṣẹ gidi pé kí ẹni náà yọ̀; “Kábíyèsí” mú ìrísí ìkíni ọba àti ẹ̀gàn wọn jáde ní Yorùbá.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: “Ọba” tọ́ka sí βασιλεύς ní ọ̀rọ̀ ìpè, “àwọn Júù” sì jẹ́ ìtumọ̀ tó wọ́pọ̀ jù lọ fún Ἰουδαίων nínú àkọlé ìjìyà yìí, bí ó tilẹ̀ jẹ́ pé “àwọn ará Jùdíà” tún ṣeé ṣe.
theological_decisions:
- issue: Bí a ṣe lè tú ìkíni ẹ̀gàn sí Jésù láì dín ìtumọ̀ ìjọba àti irony rẹ̀ kù
  choice: Lo “Kábíyèsí, Ọba àwọn Júù!” gẹ́gẹ́ bí ìkíni ọba tí wọ́n fi ń ṣẹ̀sín.
  alternative: “Mo kí ọ, Ọba àwọn Júù!”
  rationale: “Kábíyèsí” jẹ́ ìkíni ọba tí olùkà Yorùbá mọ̀, ó sì jẹ́ kí àwàdà ẹ̀gàn àwọn ọmọ-ogun hàn kedere láì fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá tó bófin mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tó yẹ. “Kábíyèsí” jẹ́ ọ̀rọ̀ àṣà Yorùbá fún ìkíni ọba, ó sì mú ẹ̀gàn àwòrán-ọba inú ẹsẹ náà hàn lọ́nà àdánidá.
