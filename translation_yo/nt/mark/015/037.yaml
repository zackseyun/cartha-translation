  source_fidelity: Ìtumọ̀ náà mú ìtẹ̀lé ìtàn δέ, ìkígbe Jésù, àti ikú rẹ̀ hàn dáadáa. Ṣùgbọ́n “mí èémí ìkẹyìn” kò fi ìyàtọ̀ Yorùbá hàn dáadáa láàárín ìmí (‘breath’) àti ẹ̀mí (‘spirit’), ó sì lè dà bí ìsọ̀rọ̀ tí kò wọ́pọ̀. “Mí ìmí ìkẹyìn” dá àwòrán ἐξέπνευσεν (‘breathed out/breathed his last’) dúró láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
  naturalness: “Ké ní ohùn rara” ṣeé lóye, ṣùgbọ́n “ké jáde ní ohùn rara” jẹ́ ìṣọ̀kan òde òní tí ó rọrùn sí i, ó sì hàn gbangba pé ìkígbe kan ni a tú jáde. “Ìmí ìkẹyìn” jẹ́ ọ̀rọ̀ àdánidá ju “èémí ìkẹyìn” lọ ní àyíká yìí.
