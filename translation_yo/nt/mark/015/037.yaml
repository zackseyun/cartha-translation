  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù ké jáde ní ohùn rara[a], ó sì mí ìmí ìkẹyìn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kígbe ńlá”; tàbí, “ohùn ńlá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó kú.” Ní ti gangan, ọ̀rọ̀ Gíríìkì náà ní í ṣe pẹ̀lú “mímí jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “Ṣùgbọ́n” fi ìyípadà àti ìtakora ọlọ́wọ̀ọ́rọ̀ ní àkókò pàtàkì yìí hàn, láìsọ ọ́ di ìtakora líle.
- source_word: ἀφεὶς
  choice: ké
  rationale: Nínú àkópọ̀ ἀφεὶς φωνὴν, ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ kí ohùn jáde. “Ké” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbé ohùn jáde ní agbára.
- source_word: φωνὴν μεγάλην
  choice: ní ohùn rara
  rationale: φωνή lè jẹ́ “ohùn” tàbí “igbe,” μεγάλην sì ń tọ́ka sí bí ohùn náà ṣe ga tàbí lágbára. “ní ohùn rara” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá àyíká náà mu.
- source_word: ἐξέπνευσεν
  choice: mí èémí ìkẹyìn
  rationale: ἐκπνέω ní ìtumọ̀ gangan ní í ṣe pẹ̀lú mímí jáde, ó sì jẹ́ àpèjúwe ikú. “mí èémí ìkẹyìn” pa àwòrán èémí àti ọ̀wọ̀ inú ọ̀rọ̀ Gíríìkì mọ́, dípò fífi “ó kú” nìkan sí i.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ṣùgbọ́n Jésù
  rationale: Àpilẹ̀kọ ὁ kò nílò ìtumọ̀ ọ̀tọ̀ níwájú orúkọ ẹni ní Yorùbá; àsopọ̀ δὲ ni a fi “Ṣùgbọ́n” hàn.
theological_decisions:
- issue: Bí a ṣe máa sọ ikú Jésù láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un
  choice: ó sì mí èémí ìkẹyìn
  alternative: ó kú; ó dá ẹ̀mí rẹ̀ sílẹ̀
  rationale: Ọ̀rọ̀ yìí sọ ikú Jésù ní ṣókí, ó sì lo àwòrán mímí. “Mí èémí ìkẹyìn” tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì; “dá ẹ̀mí rẹ̀ sílẹ̀” lè mú ọ̀rọ̀ láti inú ìròyìn Ihinrere mìíràn wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A gbe àmì àlàyé [a] lẹ́yìn gbólóhùn tó ní í ṣe pẹ̀lú φωνὴν μεγάλην, àti [b] lẹ́yìn ìtumọ̀ ἐξέπνευσεν, kí àmì kọ̀ọ̀kan lè bá àlàyé rẹ̀ mu.
