id: MRK.15.29
reference: Mark 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: yo
  text: Àwọn tí ń kọjá sì ń bú u, wọ́n ń mì orí wọn, wọ́n sì ń wí pé, “Háà! Ìwọ tí yóò wó tẹ́ńpìlì[a] lulẹ̀, tí yóò sì kọ́ ọ́ ní ọjọ́ mẹ́ta,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó, “ibi mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tún un kọ́ ní ọjọ́ mẹ́ta.” Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ sí “kọ́” lásán, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè túmọ̀ sí títún un kọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: àwọn tí ń kọjá
  rationale: Ó fi àwọn ènìyàn tí ń kọjá níbi náà hàn, ó sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
- source_word: ἐβλασφήμουν
  choice: ń bú u
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé wọ́n ń sọ̀rọ̀ ẹ̀gàn àti ọ̀rọ̀ burúkú sí Jesu; ‘ń bú u’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ ẹ̀sìn pàtó kún un.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: wọ́n ń mi orí wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe fífi orí hàn gẹ́gẹ́ bí àmì ẹ̀gàn.
- source_word: Οὐὰ
  choice: Háà!
  rationale: Ó mú ìró ìyàlẹ́nu ẹlẹ́gàn tàbí ìpèníjà inú ọ̀rọ̀ àwọn olùyọ̀ ṣẹ̀sín hàn.
- source_word: ὁ καταλύων
  choice: ìwọ tí yóò wó ... lulẹ̀
  rationale: Àpilẹ̀kọ pẹ̀lú participle ń ṣiṣẹ́ bí ìpè tààrà; fọ́ọ̀mù ọjọ́ iwájú bá ẹ̀sùn tí wọ́n ń fi ọ̀rọ̀ Jesu ṣẹ̀sín mu.
- source_word: ναὸν
  choice: tẹ́ńpìlì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ilé mímọ́ náà; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó lè túbọ̀ pàtó sí ‘ibi mímọ́ inú tẹ́ńpìlì’ mọ́.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: tí yóò sì kọ́ ọ ní ọjọ́ mẹ́ta
  rationale: Ó túmọ̀ ọ̀rọ̀ Gíríìkì ‘kọ́’ ní tààrà, láì fi ‘tún kọ́’ sínú ẹsẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè túmọ̀ sí bẹ́ẹ̀.
theological_decisions:
- issue: Ohun tí ọ̀rọ̀ nípa tẹ́ńpìlì ń tọ́ka sí
  choice: A túmọ̀ ọ̀rọ̀ àwọn olùyọ̀ ṣẹ̀sín gẹ́gẹ́ bí ẹ̀sùn tàbí ìtọ́kasí tí Mákù gbé kalẹ̀, láì ṣàlàyé nínú ẹsẹ̀ pé ara Jesu ni tẹ́ńpìlì náà.
  alternative: Láti túmọ̀ ọ́ lọ́nà ìṣàlàyé tí yóò fi hàn pé Jesu ń sọ nípa ara rẹ̀ lọ́nà àpẹẹrẹ.
  rationale: Ẹsẹ̀ náà ń sọ ọ̀rọ̀ láti ojú ìwòye àwọn tí ń kọjá nígbà ìkànmọ́ àgbélébùú; ó yẹ kí ìtumọ̀ pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ìwé mìíràn mọ́, kí ó má ṣe yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, olóhùn-orí níbi tí ó bá yẹ, pẹ̀lú èdè ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, a sì pa ìṣàn gbolohun ẹ̀gàn náà mọ́.
