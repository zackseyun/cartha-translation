  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì Gíríìkì mọ́: àwọn tó ń kọjá ń sọ ọ̀rọ̀ ẹ̀gàn sí Jesu, wọ́n ń mì orí wọn, wọ́n sì ń fi ìpè ẹlẹ́gàn bá ẹni tí a sọ pé yóò wó tẹ́ńpìlì lulẹ̀, tí yóò sì kọ́ ọ́ ní ọjọ́ mẹ́ta sọ̀rọ̀. Síbẹ̀, ‘ń mì orí wọn’ ni ọ̀rọ̀-ìṣe tó yẹ, kì í ṣe ‘ń mi orí wọn.’ Fọ́ọ̀mù ọjọ́ iwájú ‘yóò’ nínú ọ̀rọ̀ ẹ̀gàn náà lè ṣàfihàn ẹ̀sùn/ìpè tí a ń fi ṣe Jesu, ó sì bá ìpinnu Gẹ̀ẹ́sì audit trail mu.'
