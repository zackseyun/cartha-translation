id: MRK.15.5
reference: Mark 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù kò dáhùn ohunkóhun mọ́[a], èyí sì mú kí ẹnu ya Pílátù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n Jésù kò dá èsì kankan mọ́, èyí sì mú kí ẹnu ya Pílátù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ẹ̀sùn tí wọ́n ń kàn án àti ìdákẹ́jẹ́ Jésù; ó bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: οὐκέτι
  choice: kò ... mọ́
  rationale: Ìṣọ̀rọ̀ yìí fi hàn pé ohun tí ó ti ń ṣẹlẹ̀ tẹ́lẹ̀ ti dáwọ́ dúró, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ‘no longer.’
- source_word: οὐδὲν
  choice: ohunkóhun
  rationale: Pẹ̀lú ọ̀rọ̀ ìkọ̀ ‘kò,’ ó sọ pé Jésù kò dáhùn rárá, láì lo ọ̀rọ̀ tí kò bá èdè Yorùbá àdánidá mu.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: ‘Dáhùn’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún fífèsì sí ìbéèrè tàbí ẹ̀sùn nínú àyíká ìdájọ́.
- source_word: ὥστε
  choice: èyí sì mú kí
  rationale: 'Ó pa ìtumọ̀ àbájáde mọ́: ìdákẹ́jẹ́ Jésù ló yọrí sí ìyàlẹ́nu Pílátù.'
- source_word: θαυμάζειν
  choice: ẹnu ya
  rationale: ‘Ẹnu ya’ jẹ́ gbólóhùn Yorùbá àdánidá tí ó túmọ̀ sí pé ìṣẹ̀lẹ̀ náà ya ẹni lẹ́nu, láì fi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: Πιλᾶτον
  choice: Pílátù
  rationale: A ṣe àfọwọkọ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní ọlá ṣùgbọ́n tí ó ṣe kedere fún gbogbo ènìyàn. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa ìtẹnumọ́ Gíríìkì mọ́ pé Jésù kò dáhùn ohunkóhun mọ́.
