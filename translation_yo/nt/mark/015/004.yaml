base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: yo
  text: Ṣùgbọ́n Pílátù tún ń bi í léèrè pé, “Ṣé o kò dáhùn rárá? Wo bí ẹ̀sùn tí wọ́n ń fi kàn ọ́ ṣe pọ̀ tó.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ́ ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “Wo bí ohun tí wọ́n ń fi fẹ̀sùn kàn ọ́ ṣe pọ̀ tó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà ìtàn hàn pẹ̀lú ìtakora díẹ̀, ó sì bá ìṣẹ̀lẹ̀ náà mu ní Yorùbá.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Pílátù ṣe ìbéèrè náà lẹ́ẹ̀kan sí i.
- source_word: ἐπηρώτα
  choice: ń bi í léèrè
  rationale: Àkókò imperfect ní Gíríìkì lè tọ́ka sí ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra; ọ̀rọ̀ yìí mú ìtumọ̀ méjèèjì wọlé láì sọ ọ́ di ìfọ̀rọ̀wánilẹ́nuwò líle jù.
- source_word: λέγων
  choice: pé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni kan sọ, bí ó tilẹ̀ jẹ́ pé Gíríìkì lò participle ‘ní sísọ.’
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Ṣé o kò ní dáhùn rárá?
  rationale: Ó pa ìtẹnumọ́ ìdákẹ́jẹ Jesu mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere àti tó bá ẹnu mu.
- source_word: ἴδε
  choice: Wo
  rationale: Àṣẹ ni láti fa àfiyèsí sí ohun tó ń ṣẹlẹ̀; ‘Wo’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: πόσα
  choice: bí ẹ̀sùn ... ti pọ̀ tó
  rationale: Ní ti gangan, ó túmọ̀ sí ‘bí ohun ... ti pọ̀ tó,’ ṣùgbọ́n ọ̀rọ̀-ìṣe κατηγοροῦσιν àti ipò ilé-ẹjọ́ fi hàn pé ẹ̀sùn ni àwọn ‘ohun’ náà.
- source_word: σου
  choice: kàn ọ́
  rationale: Genitive yìí tọ́ka sí ẹni tí wọ́n ń fẹ̀sùn kàn; ìṣọ̀kan ‘fi ẹ̀sùn kàn ọ́’ ni Yorùbá àdánidá.
- source_word: κατηγοροῦσιν
  choice: wọ́n ń fi kàn ọ́
  rationale: Ó túmọ̀ sí fífi ẹ̀sùn kan ẹni; àmì ‘ń’ tún fi ìṣe tó ń lọ lọ́wọ́ hàn.
