  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ gbogbogbọ̀ ẹsẹ̀ náà hàn dáadáa: Pílátù tún béèrè lọ́wọ́ Jesu, ó sì tọ́ka sí ọ̀pọ̀ ẹ̀sùn tí a ń kàn án. Síbẹ̀, “kò ní dáhùn” sábà máa ń tọ́ka sí ọjọ́ iwájú (‘will not answer’), nígbà tí ἀποκρίνῃ nínú ìbéèrè yìí ń tẹnumọ́ ìdákẹ́jẹ tàbí àìfèsì tí ó wà ní àkókò náà. “Ṣé o kò dáhùn rárá?” dá ìfẹ̀sẹ̀mulẹ̀ náà padà láì fi ohun tí kò sí nínú Gíríìkì kún un.'
