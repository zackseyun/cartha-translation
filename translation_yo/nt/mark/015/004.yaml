  terminology: “Pílátù,” “bi í léèrè,” “dáhùn,” àti “fi ẹ̀sùn kàn” bá Yorùbá àkànṣe àti àyíká ilé-ẹjọ́ mu. Ẹsẹ̀ náà ń lo “ẹ̀sùn” gẹ́gẹ́ bí ìmúṣiṣẹ́ ọ̀rọ̀ tí ó ṣe kedere fún κατηγοροῦσιν; akọsilẹ̀ ìsàlẹ̀ sì ń pa ìṣòro πόσα (‘ohun’/‘nǹkan’) mọ́.
