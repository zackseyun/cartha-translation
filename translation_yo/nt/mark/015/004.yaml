translation_notes:
  register: Yorùbá àkànṣe tó ní àmì ohùn níbi tó yẹ, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘ń bi í léèrè’ láti fi imperfect Gíríìkì hàn, a sì lo ‘ẹ̀sùn’ nínú ẹsẹ̀ fún ìtumọ̀ tó ṣe kedere ní ipò ìdájọ́.
