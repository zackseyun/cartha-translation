  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: yo
  text: Màríà ará Magdala àti Màríà, ìyá Jósẹ̀, sì ń wo ibi tí a ti gbé e sí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki, “Màríà ti Jósẹ̀.” Ọ̀rọ̀ Gíríìkì dá Màríà yìí mọ̀ nípasẹ̀ ìbátan rẹ̀ pẹ̀lú Jósẹ̀, ṣùgbọ́n kò sọ irú ìbátan náà ní tààràtà.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn ìsìnkú náà síwájú; “sì” bá ìṣàn èdè Yorùbá mu láì fi ìtakora líle hàn.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Màríà ará Magdala
  rationale: Ọ̀rọ̀ ìdánimọ̀ náà sọ Màríà yìí di ẹni tí ó jẹ́ ará Magdala; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ ti èdè Yorùbá àdánidá.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Màríà ìyá Jósẹ̀
  rationale: Àpólà oníjẹ́nítífù náà dá Màríà mọ̀ nípasẹ̀ ìbátan rẹ̀ pẹ̀lú Jósẹ̀. Àyíká Máàkù mú kí “ìyá Jósẹ̀” ṣeé gbà jù, ṣùgbọ́n àlàyé ẹsẹ̀ pa ìtumọ̀ gangan tí kò sọ irú ìbátan náà mọ́.
- source_word: ἐθεώρουν
  choice: ń wo
  rationale: Àkókò imperfect tọ́ka sí ìṣe tí ó ń lọ ní àkókò àtijọ́; “ń wo” pa ìtumọ̀ ìwòran tí ó tẹ̀ síwájú mọ́.
- source_word: ποῦ
  choice: ibi tí
  rationale: Èyí túmọ̀ sí “where”; “ibi tí” jẹ́ ọ̀nà àdánidá láti so gbólóhùn náà pọ̀ ní Yorùbá.
- source_word: τέθειται
  choice: a tẹ́ ẹ sí
  rationale: Perfect passive τίθημι ń tọ́ka sí fífi ẹni náà sí ibì kan, pẹ̀lú ipò tí ó ń bá a lọ. “A tẹ́ ẹ sí” jẹ́ passive àdánidá ní Yorùbá, ó sì mú ẹni tí a fi sílẹ̀—Jésù—hàn nípasẹ̀ arọ́pò-orúkọ “ẹ.”
theological_decisions:
- issue: Ohun tí ọ̀rọ̀-ìṣe passive ń tọ́ka sí kò farahàn ní Gíríìkì
  choice: Lo arọ́pò-orúkọ ẹni “ẹ” nínú “a tẹ́ ẹ sí”
  alternative: Lo “òkú rẹ̀” tàbí fi ohun tí ọ̀rọ̀-ìṣe ń tọ́ka sí sílẹ̀ láì sọ ọ́
  rationale: Àyíká fi hàn pé Jésù ni a ń sọ̀rọ̀ nípa rẹ̀. Arọ́pò-orúkọ ẹni pa ìtọ́kasí sí Jésù mọ́, kò sì sọ ọ́ di ohun aláìlẹ́mìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé yé fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “ń wo” pa ìṣe tí ó ń lọ mọ́, “a tẹ́ ẹ sí” sì jẹ́ ọ̀nà Yorùbá àdánidá fún passive náà.
