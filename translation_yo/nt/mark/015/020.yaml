  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti fi í ṣe ẹlẹ́yà, wọ́n bọ́ aṣọ elése àlùkò náà kúrò lára rẹ̀, wọ́n sì wọ̀ ọ́ ní aṣọ tirẹ̀. Wọ́n sì mú un jáde láti kàn án mọ́ àgbélébùú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n lè kàn án mọ́ àgbélébùú.” Èdè Gíríìkì lo gbólóhùn tó ń sọ ète.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: fi ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe ẹnì kan ní ẹlẹ́yà tàbí fífi í ṣẹ̀sín; yíyan yìí bá ìró ọ̀rọ̀ ìtàn ọlọ́wọ̀ mu, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: wọ́n bọ́ aṣọ aláwọ̀ elése àlùkò náà kúrò lára rẹ̀
  rationale: Èdè Gíríìkì sọ ní tààrà pé wọ́n bọ́ ‘eléṣe àlùkò’ kúrò lára rẹ̀, nígbà tí ohun aṣọ náà wà ní àgbọ́yé láti inú àyíká ọ̀rọ̀. ‘Aṣọ aláwọ̀ elése àlùkò’ mú ìtumọ̀ náà ṣe kedere láì pinnu pé gúnugùn tàbí agbádá ni.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: wọ́n sì wọ aṣọ tirẹ̀ fún un
  rationale: Ìtumọ̀ náà pa ìṣe fífi aṣọ wọ̀ ọ́ àti ìtẹnumọ́ pé aṣọ tirẹ̀ gan-an ni mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐξάγουσιν αὐτόν
  choice: wọ́n sì mú un jáde
  rationale: Èyí ṣàfihàn pé àwọn tó ń ṣọ́ ọ ló mú un kúrò níbẹ̀. Èdè Yorùbá kò nílò àyípadà ọ̀rọ̀-ìṣe láti fi ìsinsìnyí ìtàn Gíríìkì hàn.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: láti kàn án mọ́ àgbélébùú
  rationale: ‘Láti’ fi ète ìṣe tí gbólóhùn ἵνα sọ hàn lọ́nà àdánidá; ‘kàn án mọ́ àgbélébùú’ sì sọ irú ikú náà ní pàtó.
theological_decisions:
- issue: Ìtìjú Jésù ṣáájú kíkàn án mọ́ àgbélébùú
  choice: 'Ṣàkọsílẹ̀ àwọn ìṣe náà ní tààrà: wọ́n fi í ṣe ẹlẹ́yà, wọ́n bọ́ aṣọ elése àlùkò náà, wọ́n dá aṣọ tirẹ̀ padà wọ̀ ọ́, wọ́n sì mú un lọ fún ìkànmọ́ àgbélébùú.'
  alternative: Ṣàlàyé aṣọ náà gẹ́gẹ́ bí aṣọ ọba èké tàbí fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ìtàn náà.
  rationale: Ẹsẹ náà jẹ́ ìtàn tààrà. Ìtumọ̀ yìí pa ìtìjú inú àwọn ìṣe náà mọ́, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- issue: Ìbáṣepọ̀ ἵνα pẹ̀lú ìkànmọ́ àgbélébùú
  choice: 'Túmọ̀ ọ́ gẹ́gẹ́ bí ète: ‘láti kàn án mọ́ àgbélébùú.’'
  alternative: ‘kí wọ́n lè kàn án mọ́ àgbélébùú.’
  rationale: Àwọn méjèèjì lè fi ète hàn ní Yorùbá; ‘láti’ kúkúrú, ó sì ṣàn dáadáa nínú ìtàn láì sọ ìtumọ̀ míì sínú gbólóhùn náà.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó lọ́lá, tó ṣe kedere, tí ó sì yé òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Fi ṣe ẹlẹ́yà,’ ‘bọ́ ... kúrò lára,’ àti ‘wọ aṣọ ... fún un’ jẹ́ àwọn ìṣọ̀rọ̀ àdánidá; a yẹra fún ọ̀rọ̀ ìjọ kan pàtó tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú orísun.
