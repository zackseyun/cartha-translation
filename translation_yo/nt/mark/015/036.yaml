source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: yo
  text: Ẹnì kan sì sáré, ó fi wáìnì kíkan[b] kún kànìnkànìn kan, ó gbé e lé orí ọ̀pá esùsú, ó sì ń fún un mu, ó ní, “Ẹ fi í sílẹ̀.[a] Ẹ jẹ́ kí a rí i bóyá Èlíjà ń bọ̀ láti sọ̀ ọ́ kalẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ dúró. Ẹ jẹ́ kí a rí i bóyá Èlíjà yóò wá sọ̀ ọ́ kalẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Wáìnì kíkan” túmọ̀ sí ohun mímu olówó poku tí a fi wáìnì ṣe, tí ó sì ní adùn kíkan; kì í ṣe dandan kí ó jẹ́ ọtí kíkan tí a mọ̀ sí vinegar lóde òní.
    reason: cultural_note
lexical_decisions:
- source_word: δραμὼν
  choice: sáré
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí bẹ̀rẹ̀ ìtẹ̀síwájú àwọn ìṣe; fífi í ṣe ọ̀rọ̀ ìṣe tó tẹ̀ lé ara wọn jẹ́ Yorùbá àdánidá.
- source_word: τις καὶ
  choice: Ẹnì kan sì
  rationale: τις tọ́ka sí ẹni tí a kò dárúkọ; “sì” ń so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú láìfi ìtumọ̀ “pẹ̀lú” tí kò ṣe pàtàkì kún un.
- source_word: γεμίσας σπόγγον ὄξους
  choice: fi wáìnì kíkan kún kànìnkànìn kan
  rationale: ὄξος jẹ́ wáìnì olówó poku tó ti kan, kì í ṣe dandan kí ó jẹ́ ọtí kíkan ilé òde òní; kànìnkànìn ni ohun tó ń fa omi mọ́ra.
- source_word: περιθεὶς καλάμῳ
  choice: gbé e lé orí ọ̀pá esùsú
  rationale: κάλαμος túmọ̀ sí esùsú tàbí ọ̀pá esùsú; gbólóhùn náà ṣàlàyé bí a ṣe gbé kànìnkànìn náà sókè sí Jésù.
- source_word: ἐπότιζεν αὐτόν
  choice: ó sì ń fún un mu
  rationale: Àmì imperfect fi ìṣe tó ń lọ lọ́wọ́ tàbí ìgbìyànjú hàn; “ń fún un mu” pa ìrísí yẹn mọ́ ní Yorùbá àdánidá.
- source_word: Ἄφετε
  choice: Ẹ fi í sílẹ̀
  rationale: Àṣẹ náà lè túmọ̀ sí kí àwọn yòókù dáwọ́ dúró, kí wọn sì fi Jésù sílẹ̀ fún ìgbà díẹ̀; àṣàyàn “Ẹ dúró” wà nínú àlàyé ìsàlẹ̀ láti pa àìdánilójú ọ̀rọ̀ náà mọ́.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Ẹ jẹ́ kí a rí i bóyá Èlíjà ń bọ̀
  rationale: Gbólóhùn yìí pa ìdánwò ohun tí yóò ṣẹlẹ̀ àti ìmọ̀lára pé ó lè ń ṣẹlẹ̀ nísinsìnyí mọ́.
- source_word: καθελεῖν αὐτόν
  choice: láti sọ̀ ọ́ kalẹ̀
  rationale: Nínú àyíká ìkàn mọ́ àgbélébùú, καθαιρέω túmọ̀ sí yíyọ ẹni náà kúrò ní ibi gíga, ìyẹn láti sọ̀ ọ́ kalẹ̀ láti orí àgbélébùú.
theological_decisions:
- issue: Èrò ẹni tó sọ Ἄφετε
  choice: A túmọ̀ ọ́ sí àṣẹ pé kí wọ́n fi Jésù sílẹ̀ fún ìgbà díẹ̀ kí wọ́n lè rí i bóyá Èlíjà yóò dá sí ọ̀ràn náà.
  alternative: Ó tún lè jẹ́ ọ̀nà àdánidá láti sọ pé, “Ẹ dúró.”
  rationale: Kì í ṣe ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára, ṣùgbọ́n ó jẹ́ àìdánilójú ìtumọ̀. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ tààrà ἀφίημι mọ́, àlàyé ìsàlẹ̀ sì pa àṣàyàn ọ̀rọ̀ àdánidá mọ́.
translation_notes:
  register: A lo Yorùbá ìpele àárín tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ń fún un mu” láti pa ìṣe tó ń lọ lọ́wọ́ mọ́, a sì gbe àwọn àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
