  text: But they cried out again, “Crucify him!”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n tún ké jáde pé, “Kàn án mọ́ àgbélébùú!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: wọ́n
  rationale: Àtíkù ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí àwọn ènìyàn tí a ti ń sọ̀rọ̀ nípa wọn; “wọ́n” ni ìtumọ̀ Yorùbá tó ṣe déédé jù.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ náà fi ìyàtọ̀ díẹ̀ hàn sí ohun tí Pílátù ṣẹ̀ṣẹ̀ sọ; “Ṣùgbọ́n” mú ìyàtọ̀ yẹn jáde láìfi agbára tí kò sí nínú Gíríìkì kún un.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé igbe náà tún ṣẹlẹ̀ lẹ́ẹ̀kan sí i; “tún” jẹ́ ọ̀nà àdánidá àti ṣókí ní Yorùbá.
- source_word: ἔκραξαν
  choice: ké jáde
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí kíké tàbí igbe sókè; “ké jáde” pa agbára àti ìró ohùn náà mọ́.
- source_word: Σταύρωσον
  choice: Kàn án mọ́ àgbélébùú
  rationale: Àṣẹ tààrà sí ẹnì kan ṣoṣo ni; gbólóhùn Yorùbá yìí pa ìṣe kíkàn mọ́ àgbélébùú àti agbára àṣẹ náà mọ́, láìyí i sí àṣẹ pé kí Pílátù mú ẹlòmíràn ṣe é.
- source_word: αὐτόν
  choice: án
  rationale: Arọ́pò-orúkọ olùgbà ìṣe yìí ń tọ́ka sí Jésù; “án” ni fọ́ọ̀mù tó bójú mu lẹ́yìn “kàn.”
