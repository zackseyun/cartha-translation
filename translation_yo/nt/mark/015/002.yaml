source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: yo
  text: Pílátù sì bi í pé, “Ṣé ìwọ ni ọba àwọn Júù[a]?” Ó sì dá a lóhùn pé, “Ìwọ ni o sọ bẹ́ẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà.” Níhìn-ín, gbólóhùn náà, “ọba àwọn Júù,” ń fi ẹ̀sùn ìṣèlú tí wọ́n sábà máa ń mú wá síwájú Pílátù hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Ìwọ sọ,” tàbí ní ọ̀nà tó túbọ̀ ṣe kedere, “Ohun tí ìwọ sọ nìyẹn.” Ìdáhùn Jésù kúkúrú, ìtumọ̀ rẹ̀ kò sì hàn gbangba pátápátá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: bi í pé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti béèrè tàbí bi ẹnì kan léèrè. “Bi í pé” jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi agbára ìfọ̀rọ̀wánilẹ́nuwò ọ̀daràn kún ohun tí Gíríìkì sọ.
- source_word: Σὺ εἶ
  choice: Ṣé ìwọ ni
  rationale: Èyí mú ìbéèrè tààrà àti ìtẹnumọ́ orúkọ-arọ́pò “ìwọ” jáde ní Yorùbá.
- source_word: βασιλεὺς
  choice: ọba
  rationale: “Ọba” ni ìtumọ̀ pàtó tó pa ìtumọ̀ ipò ọba àti ẹ̀sùn ìṣèlú inú ọ̀rọ̀ náà mọ́; “alákòóso” yóò gbòòrò jù.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú ẹ̀sùn tí a mú wá síwájú Pílátù, “ọba àwọn Júù” ni gbólóhùn ìṣèlú tí ó mọ́gbọ́n dání. “Àwọn ará Jùdíà” ṣì ṣeé ṣe nípa ìtumọ̀ ọ̀rọ̀, a sì fi í sínú àlàyé ìsàlẹ̀.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Ó sì dá a lóhùn pé
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìṣe dídáhùn náà, láìfi ìṣètò participle Gíríìkì tí yóò le ní Yorùbá múlẹ̀ ní ọ̀nà líle.
- source_word: Σὺ λέγεις
  choice: Ìwọ ni o sọ bẹ́ẹ̀
  rationale: Gbólóhùn yìí kúkúrú, ó sì fi ọ̀rọ̀ náà sí ẹnu Pílátù láìyí i padà sí “Bẹ́ẹ̀ ni” tàbí sí ìkọ̀ kedere.
theological_decisions:
- issue: Agbára ìdáhùn Jésù, Σὺ λέγεις
  choice: 'Ìdáhùn tí ó ní ìkálọ́wọ́kò, tí ó sì pa àìmọ́ díẹ̀ mọ́: “Ìwọ ni o sọ bẹ́ẹ̀.”'
  alternative: “Bẹ́ẹ̀ ni, bí o ti sọ ni” gẹ́gẹ́ bí ìjẹ́wọ́ kedere; tàbí “Ìwọ sọ” gẹ́gẹ́ bí ìtumọ̀ gírámà tó sún mọ́ ọ̀rọ̀-orísun ṣùgbọ́n tí kò péye tó ní Yorùbá.
  rationale: Gíríìkì kò ní “bẹ́ẹ̀ ni” ní kedere. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ìdáhùn náà di ìjẹ́wọ́ pípé tàbí ìkọ̀; ó yẹ kí ó pa ìfòyemọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún gbogbo ènìyàn. A lo “Ṣé” fún ìbéèrè àdánidá, a sì pa ìtẹnumọ́ “ìwọ” àti àìmọ́ inú ìdáhùn Jésù mọ́.
