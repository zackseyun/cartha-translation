id: MRK.15.31
reference: Mark 15:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: yo
  text: Bákan náà ni àwọn olórí àlùfáà pẹ̀lú àwọn akọ̀wé ṣe ń fi í ṣe ẹlẹ́yà, tí wọ́n sì ń sọ fún ara wọn pé, “Ó gba àwọn ẹlòmíràn là; kò lè gba ara rẹ̀ là.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Bákan náà
  rationale: Ó so ẹ̀gàn yìí pọ̀ mọ́ ti àwọn ẹgbẹ́ tí a mẹ́nu kàn ṣáájú, ó sì pa ìtumọ̀ ìfiwéra mọ́ ní Yorùbá àdánidá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ni wọ́n jọ di olórí àlùfáà kan ṣoṣo ní àkókò kan náà.
- source_word: ἐμπαίζοντες
  choice: ṣe ń fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ yìí fi ẹ̀gàn àti ìfiniṣẹ̀sín hàn, ó sì dára mọ́ bí a ṣe ń sọ ọ́ ní Yorùbá òde òní.
- source_word: πρὸς ἀλλήλους
  choice: ń sọ fún ara wọn
  rationale: Ó pa ìtumọ̀ ìbánisọ̀rọ̀ láàárín wọn mọ́, dípò kí ó túmọ̀ sí pé àwọn náà ń fi ara wọn ṣe ẹlẹ́yà.
- source_word: μετὰ τῶν γραμματέων
  choice: pẹ̀lú àwọn akọ̀wé
  rationale: Ó fi hàn pé àwọn akọ̀wé darapọ̀ mọ́ àwọn olórí àlùfáà nínú ẹ̀gàn náà.
- source_word: ἔλεγον
  choice: ṣe ń ... sọ
  rationale: Ìlò ọ̀rọ̀-ìṣe aláìparí náà tọ́ka sí ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí wọ́n ń tún sọ.
- source_word: Ἄλλους
  choice: àwọn ẹlòmíràn
  rationale: Ó tọ́ka sí àwọn ènìyàn mìíràn láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: ἔσωσεν ... σῶσαι
  choice: gba ... là
  rationale: Ìtumọ̀ Yorùbá yìí lè túmọ̀ sí gbígbàlà tàbí ìdáǹdè, ó sì pa àtúnlò ọ̀rọ̀ náà àti ẹ̀gàn oníjàngbọ̀n rẹ̀ mọ́.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Ó túmọ̀ arọ́pò-orúkọ afẹni-padà náà ní tààràtà.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Ó pa èrò àìní agbára mọ́ ní ọ̀nà Yorùbá tí ó ṣe déédéé.
theological_decisions:
- issue: Ṣíṣe ìtumọ̀ σῴζω ní ọ̀nà kan náà nínú gbólóhùn méjèèjì
  choice: gba ... là
  alternative: dá ... nídè
  rationale: Lílo “gba ... là” lẹ́ẹ̀mejì pa àtúnlò Gíríìkì àti ìtumọ̀ onípele púpọ̀ ti ẹ̀gàn wọn mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí óóró ju àyíká ọ̀rọ̀ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A ṣètò πρὸς ἀλλήλους gẹ́gẹ́ bí ìbánisọ̀rọ̀ láàárín wọn, kí ó má bàa dà bí ẹni pé wọ́n ń fi ara wọn ṣe ẹlẹ́yà.
