  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: yo
  text: Àwọn obìnrin pẹ̀lú wà tí wọ́n ń wò láti ibi jíjìn[a]; nínú wọn ni Maria Magdalénì, Maria ìyá Jakọbu ẹni tí a ń pè ní Kékeré àti ìyá Josesi[c][b], àti Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti òkèèrè.”
    reason: lexical_alternative
  - marker: b
    text: “Kékeré” lè tọ́ka sí ẹni tí ó kéré ní ọjọ́ orí, ní ìgùn, tàbí ní ipò; a kò lè pinnu èyí tí a túmọ̀ sí ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: Orúkọ Gíríìkì níbí ni Josesi, fọ́ọ̀mù kan tí ó yàtọ̀ sí Josefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: Àwọn obìnrin kan pẹ̀lú sì
  rationale: Ó fi agbára àfikún δέ àti καί hàn ní ọ̀nà tí ó bá ìtàn Yorùbá mu, láì fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: ń wò láti òkèrè
  rationale: Ó mú ìṣe tí ó ń bá a lọ nínú θεωροῦσαι àti ìtumọ̀ ibi jíjìn nínú ἀπὸ μακρόθεν jáde ní Yorùbá àdánidá.
- source_word: ἐν αἷς
  choice: lára wọn ni
  rationale: Ó fi hàn pé àwọn obìnrin tí a dárúkọ jẹ́ apá kan nínú ẹgbẹ́ àwọn obìnrin náà.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalénì
  rationale: Ó lo orúkọ tí ó wọ́pọ̀ ní Yorùbá fún Maria, ó sì tú epithet Magdalene sí fọ́ọ̀mù orúkọ Yorùbá.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria ìyá Jakọbu ẹni tí a ń pè ní kékeré àti Josesi
  rationale: μήτηρ ń ṣàkóso àwọn orúkọ méjèèjì; gbolohun náà fi Maria hàn gẹ́gẹ́ bí ìyá Jakọbu àti Josesi. Àfikún ‘ẹni tí a ń pè ní’ jẹ́ kí ‘kékeré’ ṣiṣẹ́ bí àmì ìdánimọ̀ láì pinnu bóyá ó tọ́ka sí ọjọ́ orí, ìgùn, tàbí ipò.
- source_word: Ἰακώβου
  choice: Jakọbu
  rationale: Fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀ fún orúkọ Ἰάκωβος, ó sì sun mọ́ Jacob ju àṣà Gẹ̀ẹ́sì ‘James’ lọ.
- source_word: τοῦ μικροῦ
  choice: ẹni tí a ń pè ní kékeré
  rationale: μικρός lè túmọ̀ sí ẹni kékeré ní ọjọ́ orí, ìgùn, tàbí ipò. Ìtumọ̀ yìí pa àìdánilójú náà mọ́ dípò pípa á mọ́ ‘àbúrò’.
- source_word: Ἰωσῆτος
  choice: Josesi
  rationale: Ó pa fọ́ọ̀mù orúkọ Ἰωσῆς mọ́, kò sì da a pọ̀ mọ́ Josefu.
- source_word: Σαλώμη
  choice: Salome
  rationale: Fífi orúkọ Gíríìkì náà kọ sí fọ́ọ̀mù tí ó rọrùn fún òǹkà Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ àmì ìdánimọ̀ τοῦ μικροῦ fún Jakọbu
  choice: ẹni tí a ń pè ní kékeré
  alternative: Jakọbu àbúrò; Jakọbu ẹni kékeré
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó bóyá ìyàtọ̀ náà jẹ́ ti ọjọ́ orí, ìgùn ara, tàbí ipò. Ìtumọ̀ àkọ́kọ́ pa àìdánilójú yìí mọ́, kò sì fi ẹ̀kọ́ ìtumọ̀ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tí ó ní iyì ṣùgbọ́n tí ó ṣeé yé fún òǹkà òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa àwọn orúkọ ẹni mọ́ ní fọ́ọ̀mù tí ó rọrùn láti kà ní Yorùbá.
