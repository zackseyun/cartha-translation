language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: yo
  text: Ó sì ra aṣọ ọ̀gbọ̀ kan[a]. Lẹ́yìn tí ó sọ ọ́ kalẹ̀, ó fi aṣọ ọ̀gbọ̀ náà dì í, ó sì gbé e sínú ibojì kan tí a ti gbẹ́ nínú àpáta. Ó sì yí òkúta kan sí ẹnu ibojì náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ọ̀gbọ̀ ńlá” tàbí “aṣọ ìsìnkú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ilẹ̀kùn ibojì náà”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ilẹ̀kùn tàbí ẹnu ọ̀nà.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: aṣọ ọ̀gbọ̀ kan / aṣọ ọ̀gbọ̀ náà
  rationale: “Aṣọ ọ̀gbọ̀” sọ irú ohun èlò aṣọ náà ní kedere láì fi kún un pé aṣọ ìsìnkú pàtó ni; “náà” ní ìṣẹ̀lẹ̀ kejì tọ́ka sí aṣọ kan náà.
- source_word: καθελών
  choice: ó sọ ọ́ kalẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé ó sọ ara Jésù kalẹ̀ láti orí àgbélébùú; gbolohun Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ohun tí ọ̀rọ̀ Gíríìkì sọ mọ́.
- source_word: ἐνείλησεν
  choice: ó fi aṣọ ọ̀gbọ̀ náà wé e
  rationale: “Wé e” fi ìṣe fífi aṣọ yí ara rẹ̀ ká hàn, láì fi àlàyé ìsìnkú míì tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἔθηκεν
  choice: ó tẹ́ ẹ sínú
  rationale: Ọ̀rọ̀ yìí sọ fífi ara náà dùbúlẹ̀ sí inú ibojì ní èdè Yorùbá tó yẹ fún àyíká ìsìnkú.
- source_word: μνημείῳ / μνημείου
  choice: ibojì / ibojì náà
  rationale: “Ibojì” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ibi ìsìnkú tí a gbẹ́ sínú àpáta mu; ìsọ̀rí tó tẹ̀ lé e mú kí irú ibojì náà ṣe kedere.
- source_word: λελατομημένον ἐκ πέτρας
  choice: tí a ti gbẹ́ jáde lára àpáta
  rationale: “A ti gbẹ́ jáde” fi ipò iṣẹ́ tí a ti parí hàn, “àpáta” sì bá πέτρα mu ju òkúta kékeré tàbí òkúta tí a ti ṣiṣẹ́ lọ.
- source_word: προσεκύλισεν
  choice: ó yí òkúta kan dé
  rationale: “Yí … dé” fi hàn pé a mú òkúta náà lọ nípa yíyí, a sì gbé e dé ibi tí yóò fi dí ẹnu ibojì.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: dé ẹnu ọ̀nà ibojì náà
  rationale: “Ẹnu ọ̀nà” jẹ́ ọ̀nà àbáwọlé tàbí ihò tí a ń gbà wọ ibojì; ó jẹ́ èdè Yorùbá àdánidá, ó sì pa ààyè ìtumọ̀ θύρα mọ́.
- source_word: ἀγοράσας
  choice: ó sì ra …, ó …
  rationale: Títẹ̀lé àwọn ìṣe náà ní ọ̀wọ̀ọ̀wọ́—ra aṣọ, sọ ara náà kalẹ̀, kí ó sì dì í—fi ìṣe àkọ́kọ́ tí participle aorist náà tọ́ka sí hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó ní iyì tó bá ìtàn ìsìnkú mu, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. A lo ìtẹ̀síwájú “ó sì” láti pa ìsopọ̀ àwọn ìṣe inú ẹsẹ náà mọ́.
