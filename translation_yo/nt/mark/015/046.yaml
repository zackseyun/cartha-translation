  to: Ó sì ra aṣọ ọ̀gbọ̀ kan[a]. Lẹ́yìn tí ó sọ ọ́ kalẹ̀, ó fi aṣọ ọ̀gbọ̀ náà dì í, ó sì gbé e sínú ibojì kan tí a ti gbẹ́ nínú àpáta. Ó sì yí òkúta kan sí ẹnu ibojì náà[b].
  rationale: 'A tún ọ̀rọ̀ iṣẹ́ méjì ṣe kí ìtumọ̀ wọn lè bá Gíríìkì mu: a lo “dì í” fún lílí ara rẹ̀ ní aṣọ, a sì lo “gbé e sínú” fún fífi í sí ibojì. A ṣe àtúnṣe àlàyé “linen sheet” sí ọ̀rọ̀ Yorùbá tí ó ṣe kedere. Ìbáṣepọ̀ ìṣe ἀγοράσας ṣáájú àwọn ìṣe tó kù wà nínú “Lẹ́yìn tí.”'
