  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: yo
  text: Nígbà tí ìrọ̀lẹ́ ti dé, nítorí pé ó jẹ́ Ọjọ́ Ìmúrasílẹ̀—èyíinì ni, ọjọ́ tí ó ṣáájú Sábáàtì[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ní èdè Gíríìkì, “ṣáájú Sábáàtì.” Ọ̀rọ̀ “Ọjọ́ Ìmúrasílẹ̀” ni wọ́n ń lò fún ọjọ́ ìmúrasílẹ̀ sí Sábáàtì.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ
  choice: Nígbà tí
  rationale: A kò tú Καὶ sí ọ̀rọ̀ ọ̀tọ̀ níbí; ìbẹ̀rẹ̀ gbólóhùn àkókò ní ‘Nígbà tí’ jẹ́ Yorùbá àdánidá, ó sì ń bá ìtàn tó ṣáájú lọ.
- source_word: ἤδη ὀψίας γενομένης
  choice: ilẹ̀ ti ń ṣú lọ́jọ́ náà
  rationale: Ọ̀rọ̀ yìí fi àkókò tí ìrọ̀lẹ́ ti dé hàn. ‘Ilẹ̀ ti ń ṣú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ìrọ̀lẹ́ ti wọlé; ‘lọ́jọ́ náà’ ń mú ìtọ́kasí àkókò náà ṣe kedere láìyí ìtumọ̀ padà.
- source_word: ἐπεὶ
  choice: nítorí
  rationale: Ó mú ìdí tàbí àlàyé ohun tó tẹ̀ lé e wọlé, gẹ́gẹ́ bí ἐπεὶ ṣe rí nínú àyíká yìí.
- source_word: παρασκευή
  choice: Ọjọ́ Ìmúrasílẹ̀
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà jẹ́ orúkọ ọjọ́ tí wọ́n fi ń múra sílẹ̀ fún Sábáàtì, kì í ṣe ìmúrasílẹ̀ lásán.
- source_word: ὅ ἐστιν
  choice: èyíinì ni
  rationale: Ó jẹ́ àgbékalẹ̀ àlàyé tó bá Yorùbá mu, tí ó sì pa iṣẹ́ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: προσάββατον
  choice: ọjọ́ tí ó ṣáájú Sábáàtì
  rationale: Ó sọ ìtumọ̀ ọ̀rọ̀ náà ní tààrà, bí àlàyé Mákù ṣe fẹ́, láìfi ‘Ọjọ́ Ẹtì’ rọ́pò rẹ̀ ní ọ̀nà ìtumọ̀ àfikún.
