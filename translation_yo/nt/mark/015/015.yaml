  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: yo
  text: Pílátù sì, nítorí ó fẹ́ tẹ́ ogunlọ́gọ̀ lọ́rùn[a], dá Bárábà sílẹ̀ fún wọn; lẹ́yìn tí ó ti pàṣẹ pé kí a nà Jésù, ó fi Jésù fún ìkànmọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti tẹ́ ogunlọ́gọ̀ lọ́rùn.” Ní tààràtà, “láti ṣe ohun tí ó tó fún ogunlọ́gọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ẹni tí ó fẹ́
  rationale: Ó fi ìfẹ́ tàbí ète Pílátù hàn ní èdè Yorùbá àdánidá, láì fi ìgbèrò jinlẹ̀ tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: ṣe ohun tí yóò tẹ́ ọ̀pọ̀ ènìyàn lọ́rùn
  rationale: Ó túmọ̀ àkànlò-èdè náà gẹ́gẹ́ bí mímú ohun tí ogunlọ́gọ̀ ń béèrè ṣẹ, ó sì pa ìtumọ̀ ‘ṣe ohun tí ó tó fún wọn’ mọ́ dé ìwọ̀n kan.
- source_word: ἀπέλυσεν
  choice: dá ... sílẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún yíyọ ẹlẹ́wọ̀n kúrò ní àhámọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó fi hàn pé ìdásílẹ̀ Bárábà jẹ́ ohun tí Pílátù ṣe fún ogunlọ́gọ̀ náà gẹ́gẹ́ bí ohun tí wọ́n béèrè.
- source_word: παρέδωκεν
  choice: fà á lé wọn lọ́wọ́
  rationale: Ó pa agbára ọ̀rọ̀ náà mọ́ pé a fi Jésù sábẹ́ àṣẹ àwọn mìíràn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: φραγελλώσας
  choice: lẹ́yìn tí ó ... ti pàṣẹ pé kí a nà Jésù
  rationale: Aorist participle náà ṣáájú fífi Jésù lé wọn lọ́wọ́. Ìtumọ̀ yìí tún mú ipa Pílátù gẹ́gẹ́ bí ẹni tí ó pàṣẹ ìnà náà hàn, dípò lílo ọ̀rọ̀ tí yóò dà bí ẹni pé òun fúnra rẹ̀ ni ó nà á.
- source_word: ἵνα σταυρωθῇ
  choice: láti kàn án mọ́ àgbélébùú
  rationale: Ó sọ ète fífi Jésù lé wọn lọ́wọ́ ní Yorùbá àdánidá, ó sì pa ìṣe aláìṣe-ẹni (passive) náà mọ́ nípa fífi ẹni tí yóò ṣe e sílẹ̀ láìdárúkọ.
- source_word: Βαραββᾶν
  choice: Bárábà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti àṣà kíkọ orúkọ inú Bíbélì ní Yorùbá.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó fìdí múlẹ̀ ní Yorùbá.
theological_decisions:
- issue: Ìdí tí Pílátù fi ṣe ohun tí ogunlọ́gọ̀ ń fẹ́ nínú τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pílátù fẹ́ ṣe ohun tí yóò tẹ́ ọ̀pọ̀ ènìyàn lọ́rùn
  alternative: Pílátù fẹ́ ṣe ohun tí yóò dùn mọ́ ọ̀pọ̀ ènìyàn; tàbí ṣe ohun tí ó tó fún wọn
  rationale: Àṣàyàn náà fi ìtẹ́lọ́rùn sí ohun tí ogunlọ́gọ̀ ń béèrè hàn, láì sọ pé Pílátù ń ṣe iṣẹ́ rere fún wọn tàbí láì dín ìforígbárí ìwà rere inú ìtàn náà kù.
- issue: Ẹni tí ó ṣe ìnà Jésù
  choice: Pílátù pàṣẹ pé kí a nà Jésù
  alternative: Pílátù nà Jésù
  rationale: Ọ̀rọ̀ Gíríìkì lè sọ ìṣe náà nípasẹ̀ àṣẹ alákòóso. Ìtumọ̀ yìí yẹra fún fífi kún un pé Pílátù fúnra rẹ̀ ló mú pàṣán nà á, ṣùgbọ́n ó pa ojúṣe rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ọ̀pọ̀ ènìyàn” fún ὄχλος nínú àyíká yìí, “nà” fún ìnà pẹ̀lú pàṣán, àti “kàn ... mọ́ àgbélébùú” gẹ́gẹ́ bí ọ̀nà Yorùbá tí ó fìdí múlẹ̀ fún ìkànmọ́ àgbélébùú.
