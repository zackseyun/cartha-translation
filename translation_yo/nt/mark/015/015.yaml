  source_fidelity: 'Ìtumọ̀ náà gba ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀ àti èrò pàtàkì Gíríìkì mọ́: Pílátù fẹ́ tẹ́ ogunlọ́gọ̀ lọ́rùn, ó dá Bárábà sílẹ̀, a sì nà Jésù kí a tó fi í fún ìkànmọ́ àgbélébùú. Síbẹ̀, “fà á lé wọn lọ́wọ́” kò dáa gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá fún παρέδωκεν, ó sì lè mú kí “wọn” dà bí ogunlọ́gọ̀ gan-an ni àwọn tó gba Jésù. A tún tún ìsọ̀rọ̀ ìdí (“Nítorí náà”) ṣe kí ó má bàa fi ìbáṣepọ̀ àbájáde tó lágbára ju δέ hàn.'
