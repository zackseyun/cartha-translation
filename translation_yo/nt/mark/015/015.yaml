  to: Pílátù sì, nítorí ó fẹ́ tẹ́ ogunlọ́gọ̀ lọ́rùn[a], dá Bárábà sílẹ̀ fún wọn; lẹ́yìn tí ó ti pàṣẹ pé kí a nà Jésù, ó fi Jésù fún ìkànmọ́ àgbélébùú.
