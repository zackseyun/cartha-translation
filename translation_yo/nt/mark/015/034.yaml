id: MRK.15.34
reference: Mark 15:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: yo
  text: Ní wákàtí kẹ́sàn-án, Jésù ké jáde pẹ̀lú ohùn ńlá pé, “Eloi, Eloi, lema sabachthani?”[a] èyí tí ìtumọ̀ rẹ̀ ní, “Ọlọ́run mi, Ọlọ́run mi, kí ni ìdí tí o fi kọ̀ mí sílẹ̀?”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan àti ọ̀pọ̀ ìtumọ̀ Gẹ̀ẹ́sì fi ọ̀rọ̀ Sẹ́mítì náà hàn gẹ́gẹ́ bí “lama sabachthani” dípò “lema sabachthani.”
    reason: textual_variant
  - marker: b
    text: Ọ̀rọ̀ Jésù yìí ń tún ọ̀rọ̀ Sáàmù 22:1 sọ.
    reason: cross_reference
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ pé, “Èé ṣe tí o fi kọ̀ mí sílẹ̀?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: ní wákàtí kẹ́sàn-án
  rationale: Ó pa ọ̀nà tí Máàkù gbà ka àkókò mọ́ dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí aago mẹ́ta ọ̀sán nínú ẹsẹ̀ náà.
- source_word: ἐβόησεν
  choice: ké jáde
  rationale: Ó fi hàn pé Jesu ké igbe ńlá, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Ó sọ bí igbe náà ṣe lágbára ní èdè Yorùbá tí ó ṣe kedere, tí ó sì níyì.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloi, Eloi, lema sabachthani?
  rationale: A pa ọ̀rọ̀ Sẹ́mítì tí Máàkù kọ sílẹ̀ mọ́, kí a tó fún ni ní ìtumọ̀ rẹ̀, láì mú un bá ìrísí ọ̀rọ̀ inú Mátíù mu.
- source_word: μεθερμηνευόμενον
  choice: èyí tí ó túmọ̀ sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ ọ̀rọ̀ èdè mìíràn hàn.
- source_word: εἰς τί
  choice: kí ni ìdí tí
  rationale: Ó mú ìbéèrè nípa ìdí tàbí ohun tí ó fà á jáde ní kedere, láì pinnu ìdáhùn sí ìbéèrè náà.
- source_word: ἐγκατέλιπές με
  choice: o fi kọ̀ mí sílẹ̀
  rationale: Ó sọ ìtumọ̀ fífi ẹnì kan sílẹ̀ tàbí pípa á tì ní Yorùbá àdánidá, ó sì pa ìwọ̀n ìbànújẹ́ ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ igbe Jesu pẹ̀lú Sáàmù 22:1
  choice: A pa igbe fífi-sílẹ̀ náà àti ìró ọ̀rọ̀ Sáàmù mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ẹsẹ̀ náà.
  alternative: Kí a sọ nínú ẹsẹ̀ náà pé ó ń fa Sáàmù 22 yọ, tàbí kí a rọ ìtumọ̀ fífi Jesu sílẹ̀.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ gbé ìbànújẹ́ àti ìfọkànsìn sí Ìwé Mímọ́ papọ̀; ìtumọ̀ kò gbọ́dọ̀ yanjú ìfarapa ẹ̀kọ́ ìgbàgbọ́ yìí ní ìkọ̀kọ̀.
- issue: Bí a ṣe mú ọ̀rọ̀ Sẹ́mítì Jesu wá
  choice: A fi ọ̀rọ̀ tí a kọ ní ìrísí ohùn rẹ̀ sílẹ̀, a sì tẹ̀ lé e pẹ̀lú ìtumọ̀ Yorùbá.
  alternative: Kí a kọ ìtumọ̀ rẹ̀ nìkan, tàbí kí a yí i sí irú ọ̀rọ̀ Mátíù, “Eli, Eli.”
  rationale: Èyí tẹ̀ lé àpẹẹrẹ Máàkù gan-an, kò sì da ìyàtọ̀ tó wà láàárín àwọn ìròyìn Ìhìn Rere rú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó níyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ọ̀rọ̀ Yorùbá níbi tí ó bá yẹ, ṣùgbọ́n a pa gbólóhùn Sẹ́mítì mọ́ ní ìrísí ìkọ-lẹ́tà tí orísun náà gbé kalẹ̀.
