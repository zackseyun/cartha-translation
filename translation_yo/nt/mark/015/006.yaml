  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: yo
  text: Ní àkókò àjọ̀dún náà, ó máa ń dá ẹlẹ́wọ̀n kan tí wọ́n béèrè fún sílẹ̀ fún wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Ní àkókò àjọ̀dún náà
  rationale: Κατά pẹ̀lú ọ̀rọ̀-orúkọ ní ipò accusative níbí ń tọ́ka sí àkókò. “Ní àkókò àjọ̀dún náà” jẹ́ Yorùbá àdánidá, ó sì bá àyíká Ìrékọjá mu láì fi orúkọ àjọ̀dún náà kún ohun tí ẹsẹ̀ yìí sọ. A kò túmọ̀ δέ lọ́tọ̀ nítorí agbára ìsopọ̀ rẹ̀ rọrùn, ìṣàn gbolohun Yorùbá sì ti gbé e.
- source_word: ἀπέλυεν
  choice: ó máa ń dá ... sílẹ̀
  rationale: Àkókò imperfect náà fi ìṣe àṣà tí ó máa ń ṣẹlẹ̀ hàn. Àkójọpọ̀ “máa ń” sọ ìṣe àsọtúnsọ yìí ní kedere, “dá ẹlẹ́wọ̀n sílẹ̀” sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìtúsílẹ̀ ẹlẹ́wọ̀n.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dative náà tọ́ka sí àwọn ẹni tí ìtúsílẹ̀ náà ṣe fún; “fún wọn” jẹ́ àdánidá ju “sí wọn” lọ nínú gbolohun yìí.
- source_word: ἕνα δέσμιον
  choice: ẹlẹ́wọ̀n kan
  rationale: “Kan” pa ìtumọ̀ iye ọ̀kan nínú ἕνα mọ́, “ẹlẹ́wọ̀n” sì bá ọ̀rọ̀ ìdájọ́ àti àhámọ́ mu dáadáa.
- source_word: ὃν παρῃτοῦντο
  choice: tí wọ́n bá béèrè fún
  rationale: παραιτέομαι túmọ̀ sí béèrè fún tàbí tọrọ. “Tí wọ́n bá béèrè fún” bá ìṣe àṣà nínú gbogbo gbólóhùn náà mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn. “Máa ń” fi ìṣe àṣà hàn, a kò sì sọ ẹni tí “ó” jẹ́ ní orúkọ nítorí orísun náà náà lo arọ́pò-orúkọ.
