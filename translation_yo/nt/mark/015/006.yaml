  terminology: ‘Àjọ̀dún,’ ‘ẹlẹ́wọ̀n,’ àti ‘dá ... sílẹ̀’ yẹ fún àyíká ìjọba àti ìdájọ́. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí orúkọ tí ó nílò àtúnṣe.
