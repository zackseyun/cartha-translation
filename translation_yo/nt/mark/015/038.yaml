  edition: SBLGNT
  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: yo
  text: Aṣọ ìkélé[a] tẹ́ńpìlì[b] náà sì ya sí méjì, láti òkè dé ìsàlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ìbòjú.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: aṣọ ìkélé
  rationale: Ó ń tọ́ka sí aṣọ tí a fi ń ké ohun kan mọ́ tàbí pín ààyè sí ọ̀tọ̀; “aṣọ ìkélé” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ναοῦ
  choice: tẹ́ńpìlì
  rationale: “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní mọ̀ dáadáa. Nítorí ναός lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, a fi àlàyé yìí sínú àlàyé ìsàlẹ̀.
- source_word: ἐσχίσθη
  choice: ya
  rationale: Ọ̀nà yìí sọ pé aṣọ náà ya láì sọ ẹni tàbí ohun tí ó fà á, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe aláìṣe-taara Gíríìkì náà ṣe fi ẹni tó ṣe é sílẹ̀ láìdárúkọ.
- source_word: εἰς δύο
  choice: sí méjì
  rationale: “Ya sí méjì” jẹ́ gbólóhùn Yorùbá àdánidá fún pípín ohun kan sí apá méjì.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: láti òkè dé ìsàlẹ̀
  rationale: Ó pa ìtọ́sọ́nà àti gbogbo gígùn ibi tí yíya náà dé mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ìṣẹ̀lẹ̀ yìí mọ́ ìtàn tí ó ṣáájú láìfi ìtumọ̀ àkókò tuntun kún un.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí yíya aṣọ ìkélé tẹ́ńpìlì lè ní
  choice: A sọ ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí ó ti ṣẹlẹ̀, láìṣe àlàyé àmì tí ó lè dúró fún nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè túmọ̀ ọ́ gẹ́gẹ́ bí àmì pé ọ̀nà sí Ọlọ́run ṣí sílẹ̀, tàbí bí ìdájọ́ lórí ètò tẹ́ńpìlì.
  rationale: Ẹsẹ̀ náà kò sọ ìtumọ̀ àmì náà ní kedere; nítorí náà, ìtumọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A kò dárúkọ ẹni tó fa aṣọ náà ya, a kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ìròyìn ìṣẹ̀lẹ̀ náà.
