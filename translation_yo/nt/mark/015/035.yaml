review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú gbogbo àwọn ẹ̀yà pàtàkì Gíríìkì náà wá: ẹgbẹ́ kan nínú àwọn tó wà níbẹ̀, ìgbọ́ igbe náà, ọ̀rọ̀ wọn tí ń tẹ̀síwájú, ìpè àfiyèsí, àti Èlíjà ẹni tí wọ́n ní Jésù ń pè. “Ó ń pe Èlíjà” pa ìtumọ̀ φωνεῖ mọ́ láìfi ìtumọ̀ ‘ké fún ìrànlọ́wọ́’ kún un.'
  naturalness: 'Ìṣàtúnṣe kékeré kan ń jẹ́ kí ìtọ́kasí sí ọ̀pọ̀ ènìyàn dájú síi nínú Yorùbá àtẹ̀jáde: “àwọn tí wọ́n dúró níbẹ̀” dára ju “àwọn tí ó dúró níbẹ̀” lọ nítorí ẹgbẹ́ ènìyàn ni a ń sọ̀rọ̀ nípa wọn. Fífì “nígbà tí wọ́n gbọ́ ọ́” tún so participle ἀκούσαντες mọ́ ìṣe ọ̀rọ̀ wọn ní kedere àti ní àdánidá.'
  terminology: “Èlíjà” jẹ́ ìkọ̀wé Yorùbá tí ó wọ́pọ̀ fún Ἠλίαν. “Wò ó” àti “ó ń pe” bá ìforúkọsílẹ̀ òde òní, ọ̀wọ̀, mu dáadáa. Àkọsílẹ̀ ẹsẹ̀ náà pa àṣàyàn ‘pe ... wá’ mọ́ láìgbé e sínú ọ̀rọ̀ pàtàkì.
