source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: yo
  text: Àwọn kan lára àwọn tí wọ́n dúró níbẹ̀, nígbà tí wọ́n gbọ́ ọ́, ń wí pé, “Wò ó, ó ń pe Èlíjà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń pe Èlíjà wá.”
    reason: φωνεῖ pẹ̀lú ẹni tí a ń pè lè túmọ̀ sí pípe orúkọ ẹni náà tàbí pípe ẹni náà pé kí ó wá; àkọsílẹ̀ yìí pa àṣàyàn kejì mọ́.
lexical_decisions:
- source_word: καί
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí so ìhùwàpadà wọn mọ́ igbe Jésù tí ó ṣáájú, láìfi ìtumọ̀ àkókò kún un.
- source_word: τινες
  choice: Àwọn kan
  rationale: Ó ń tọ́ka sí apá kan tí a kò sọ iye wọn nínú àwọn ènìyàn tí ó wà níbẹ̀.
- source_word: τῶν παρεστηκότων
  choice: lára àwọn tí ó dúró níbẹ̀
  rationale: Ó pa àwòrán gidi àwọn ènìyàn tí ó dúró ní ibi ìṣẹ̀lẹ̀ náà mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀκούσαντες
  choice: gbọ́
  rationale: A fi ìṣe tí ó ṣáájú ọ̀rọ̀ wọn hàn ní ọ̀nà ṣókí tí ó bá èdè Yorùbá mu; ohun tí wọ́n gbọ́ hàn gbangba láti inú àyíká ọ̀rọ̀.
- source_word: ἔλεγον
  choice: wọ́n ń wí
  rationale: Àmì “ń” pa ìrísí ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń tún ṣe nínú imperfect Gíríìkì mọ́.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Àṣẹ yìí ń pe àfiyèsí àwọn olùgbọ́ ní ọ̀nà Yorùbá òde òní tí ó ṣe kedere.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: Èyí ni ìkọ̀wé orúkọ wòlíì náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: φωνεῖ
  choice: ó ń pe
  rationale: Ó pa ìtumọ̀ ìpè mọ́ láìfi kún un pé ó ń ké fún ìrànlọ́wọ́; ó sì fi present Gíríìkì hàn bí ìṣe tí ń lọ lọ́wọ́.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé àwọn tí ó dúró níbẹ̀ ṣì lóye igbe Jésù gẹ́gẹ́ bí ìpè sí Èlíjà
  choice: 'Pa gbólóhùn ojú-ọrọ̀ náà mọ́: “ó ń pe Èlíjà”'
  alternative: “ó ń pe Èlíjà wá” tàbí “wọ́n rò pé ó ń pe Èlíjà”
  rationale: Ọ̀rọ̀ Gíríìkì ròyìn ohun tí wọ́n sọ, kò sì ṣàlàyé èrò wọn láti ẹnu akọ̀ròyìn. Àyíká ọ̀rọ̀ ló ń fi àìgbọ́ye wọn hàn, nítorí náà a kò gbọ́dọ̀ túmọ̀ rẹ̀ jù ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó tàbí àlàyé tí orísun kò sọ.
