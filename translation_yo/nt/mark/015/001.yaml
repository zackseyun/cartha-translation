id: MRK.15.1
reference: Mark 15:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀, lẹ́sẹ̀kẹsẹ̀ ni àwọn olórí àlùfáà ṣe ìpàdé ìmọ̀ràn pẹ̀lú àwọn àgbààgbà, àwọn akọ̀wé, àti gbogbo ìgbìmọ̀ náà[a]. Lẹ́yìn náà, wọ́n di Jésù, wọ́n mú un lọ, wọ́n sì fi í lé Pílátù lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo Sànhẹ́dírìn náà.” Ọ̀rọ̀ Gíríìkì συνέδριον ń tọ́ka sí ìgbìmọ̀ aláṣẹ àwọn Júù.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìmọ̀lára ìṣe kánkán tí ó wọ́pọ̀ nínú ìtàn Máàkù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: πρωῒ
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní ìbẹ̀rẹ̀ òwúrọ̀, kì í ṣe nígbà òwúrọ̀ lásán.
- source_word: συμβούλιον ποιήσαντες
  choice: ṣe ìpàdé ìmọ̀ràn
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí ìjíròrò tàbí ìmọ̀ràn tí a ṣe ní ọ̀nà ìṣàkóso; yíyan yìí jẹ́ adayébá ní Yorùbá láì sọ pé wọ́n ti pinnu ète kan pàtó.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ olórí àlùfáà gíga ló wà ní ipò lẹ́ẹ̀kan náà.
- source_word: πρεσβυτέρων
  choice: àwọn àgbààgbà
  rationale: Nínú àyíká ìṣàkóso yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn aṣáájú tí a mọ̀ sí àgbààgbà.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ ṣókí tí ó bójú mu fún àwọn amòye òfin àti olùkọ́ni tí ọ̀rọ̀ náà ń tọ́ka sí ní àyíká yìí.
- source_word: ὅλον τὸ συνέδριον
  choice: gbogbo ìgbìmọ̀ náà
  rationale: Ó túmọ̀ iṣẹ́ ilé ìṣàkóso náà fún òǹkàwé Yorùbá, dípò lílo orúkọ àyálò tí ó lè má yé gbogbo ènìyàn.
- source_word: δήσαντες
  choice: wọ́n di Jésù
  rationale: Ó sọ ní tààrà pé wọ́n fi okùn tàbí ohun ìdè mú Jésù kí wọ́n tó mú un lọ.
- source_word: ἀπήνεγκαν
  choice: wọ́n mú un lọ
  rationale: Nínú àyíká ìmúnisìn yìí, gbólóhùn náà jẹ́ adayébá, kò sì fi dandan hàn pé wọ́n gbé e ní apá.
- source_word: παρέδωκαν
  choice: wọ́n fi í lé Pílátù lọ́wọ́
  rationale: Ó pa ìtumọ̀ fífi ẹni tí a mú sí abẹ́ àṣẹ ẹlòmíràn mọ́, ó sì yẹ fún àyíká ìdájọ́.
- source_word: Πιλάτῳ
  choice: Pílátù
  rationale: Èyí ni ìkọ̀wé orúkọ Πιλᾶτος ní ọ̀nà tí ó bá ìró àti àmì ohùn Yorùbá mu.
theological_decisions:
- issue: Ohun tí συνέδριον ń tọ́ka sí
  choice: gbogbo ìgbìmọ̀ náà
  alternative: gbogbo Sànhẹ́dírìn náà
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ ilé ìṣàkóso àwọn Júù. Títúmọ̀ iṣẹ́ rẹ̀ sínú Yorùbá mú kí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi orúkọ ìtàn rẹ̀ pamọ́.
- issue: Agbára παρέδωκαν nínú ìtàn ìjìyà Jésù
  choice: fi í lé Pílátù lọ́wọ́
  alternative: fi í fún Pílátù
  rationale: Yíyan náà fi ìyípadà àṣẹ àti ìmúnisìn sí ọwọ́ aláṣẹ Róòmù hàn láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ohun tí ẹsẹ yìí sọ.
translation_notes:
  register: A lo Yorùbá tí ó lọ́wọ́, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì ṣètò àwọn gbólóhùn ìṣe tẹ̀ lé ara wọn kí ìtàn náà lè ṣàn lọ́nà adayébá.
