source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: yo
  text: “Kí Mèsáyà[a], Ọba Ísírẹ́lì, sọ̀kalẹ̀ nísinsin yìí láti orí àgbélébùú, kí àwa lè rí, kí a sì gbàgbọ́.” Àwọn tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀ náà sì ń gàn án.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ẹni tí a fòróró yàn”; “Mèsáyà” fi ìtumọ̀ oyè ọba náà hàn níhìn-ín.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ń sọ̀rọ̀ ẹ̀gàn sí i” tàbí “ń kẹ́gàn rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ẹni tí a fòróró yàn, ó sì wà nínú ọ̀rọ̀ ẹ̀gàn nípa ìjọba; “Mèsáyà” mú ìtumọ̀ oyè yìí hàn ju lílo rẹ̀ bí orúkọ lọ.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: Ọba Ísírẹ́lì
  rationale: Ó pa oyè ọba àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ísírẹ́lì mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: sọ̀ kalẹ̀ nísinsin yìí láti orí àgbélébùú
  rationale: “Sọ̀ kalẹ̀” fi àṣẹ ẹni kẹta tó ní ìpèníjà hàn; “nísinsin yìí” pa ìkánjú àti ẹ̀gàn νῦν mọ́, “láti orí àgbélébùú” sì sọ ibi ìsọ̀kalẹ̀ náà di mímọ́.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: kí àwa lè rí, kí a sì gbàgbọ́
  rationale: Ìtúmọ̀ yìí pa ète ìpèníjà náà àti ìtẹ̀lé ‘rí’ àti ‘gbàgbọ́’ mọ́; fífi “àwa” hàn tẹnumọ́ ẹni àkọ́kọ́ ọ̀pọ̀ bí Gíríìkì.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: Àwọn tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀
  rationale: Ó pa ìṣe aláìṣe àti òtítọ́ pé àwọn mìíràn pín ìkànmọ́-àgbélébùú pẹ̀lú rẹ̀ mọ́, láìfi ohun tí orísun kò sọ kún un.
- source_word: ὠνείδιζον αὐτόν
  choice: ń gàn án
  rationale: “Ń gàn án” jẹ́ èdè Yorùbá àdánidá fún ẹ̀gàn tàbí ìkẹ́gàn, àmì ìṣe “ń” sì mú ìṣe tí ń bá a lọ nínú imperfect hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ọ̀rọ̀ ẹ̀gàn nípa ọba
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọba ẹni àmì-òróró, kì í ṣe bí orúkọ lasán; “Mèsáyà” pa ìtumọ̀ Jù àti ti ọba inú àyíká ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “sọ̀ kalẹ̀” fún ìpèníjà ẹlẹ́gàn, “àgbélébùú” fún σταυρός, àti ìṣe “ń gàn” láti pa ìtẹ̀síwájú imperfect mọ́.
