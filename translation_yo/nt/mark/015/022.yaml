source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: yo
  text: Wọ́n sì mú un lọ sí ibi Gọ́lgọ́tà[a], tí ìtumọ̀ rẹ̀ jẹ́, “Ibi Agbárí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ibi Agbárí náà.” Ọ̀rọ̀ Gíríìkì náà, Κρανίου Τόπος, kò ní àpilẹ̀kọ, nítorí náà ó lè túmọ̀ sí “Ibi Agbárí kan” tàbí “Ibi Agbárí náà”; Yorùbá “Ibi Agbárí” lè gba ìtumọ̀ méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: mú un wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n mú Jesu dé ibi kan láì sọ ní pàtó pé wọ́n gbé e ní apá tàbí pé ó fi ẹsẹ̀ rìn. Àkókò ìsinsìnyí Gíríìkì jẹ́ ìsinsìnyí ìtàn, tí Yorùbá lè sọ lọ́nà àdánidá pẹ̀lú ìṣe tó ti ṣẹlẹ̀.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: sí ibi Gọ́lgọ́tà
  rationale: “Sí” fi ìlọsí ibi tí wọ́n ń lọ hàn; “ibi” sì pa τόπον mọ́, láì fi “tí a ń pè ní” kún un, nítorí kò sí ọ̀rọ̀ bẹ́ẹ̀ ní Gíríìkì.
- source_word: Γολγοθᾶν
  choice: Gọ́lgọ́tà
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Yorùbá, dípò títúmọ̀ orúkọ náà nínú gbólóhùn àkọ́kọ́.
- source_word: μεθερμηνευόμενον
  choice: nígbà tí a bá túmọ̀ rẹ̀
  rationale: Èyí pa iṣẹ́ ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìtumọ̀ láti inú èdè kan sí òmíràn, ó sì dun ní ti ẹ̀dá Yorùbá ju fọ́ọ̀mù aláìṣe lọ.
- source_word: Κρανίου Τόπος
  choice: Ibi Agbárí
  rationale: Ìṣọ̀kan orúkọ méjèèjì fi ìbáṣepọ̀ genitive Gíríìkì hàn lọ́nà Yorùbá tó ṣeé kà. Yorùbá kò fi àpilẹ̀kọ hàn bí Gẹ̀ẹ́sì, nítorí náà gbolohun yìí kò fi tipátipá yàn láàárín “agbárí kan” àti “agbárí náà.”
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó mọ́gbọ́n dání, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá, a sì pa ìtúmọ̀ orúkọ Gọ́lgọ́tà mọ́ nínú àlàyé gẹ́gẹ́ bí orísun Gíríìkì.
