source:
  edition: SBLGNT
  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: yo
  text: Wọ́n sì kan àwọn ọlọ́ṣà méjì[a] mọ́ àgbélébùú pẹ̀lú rẹ̀, ọ̀kan ní ìhà ọ̀tún rẹ̀ àti ọ̀kan ní ìhà òsì rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn adìgunjálè”; ó ṣeé ṣe kó túmọ̀ sí “àwọn ọlọ̀tẹ̀” bí ọ̀rọ̀ náà bá ní ìtumọ̀ ìṣèlú.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Σύν pẹ̀lú ọ̀rọ̀-orúkọ ní ipò dative ń fi ìbákẹ́gbẹ́ hàn; “pẹ̀lú rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé tí ó sì ṣe kedere.
- source_word: σταυροῦσιν
  choice: wọ́n ... kan ... mọ́ àgbélébùú
  rationale: Ọ̀rọ̀-ìṣe náà wà ní present active indicative, ó sì jẹ́ historical present nínú ìtàn Máàkù. Èdè Yorùbá kò fi àkókò hàn lórí ọ̀rọ̀-ìṣe bí Gíríìkì; “Wọ́n sì kan” tẹ̀síwájú nínú ìtàn lọ́nà àdánidá láìfi àmì àkókò tí kò sí nínú orísun kún un.
- source_word: δύο λῃστάς
  choice: àwọn ọlọ́ṣà méjì
  rationale: Λῃστής lè túmọ̀ sí ọlọ́ṣà oníwà ipá tàbí adigunjalè, ó sì lè ní ìtumọ̀ ìṣèlú ní àwọn àyíká kan. “Àwọn ọlọ́ṣà méjì” jẹ́ èdè tó wọ́pọ̀, tó ṣe kedere, tí kò sì fi ìtumọ̀ ìṣèlú kan ọ̀rọ̀ náà lágbára; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: ἕνα ἐκ δεξιῶν
  choice: ọ̀kan ní ọwọ́ ọ̀tún rẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí ibi tí ẹni náà wà ní ẹ̀gbẹ́ ọ̀tún Jésù. “Ní ọwọ́ ọ̀tún rẹ̀” jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún ipò yìí.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: ọ̀kan ní ọwọ́ òsì rẹ̀
  rationale: Εὐώνυμος ń tọ́ka sí ẹ̀gbẹ́ òsì níbí. “Ní ọwọ́ òsì rẹ̀” bá ìtumọ̀ ipò náà mu, ó sì ṣe àfiwé tó dọ́gba pẹ̀lú “ní ọwọ́ ọ̀tún rẹ̀.”
theological_decisions:
- issue: Bí a ṣe túmọ̀ λῃσταί nínú ìtàn ìkànmọ́ àgbélébùú
  choice: àwọn ọlọ́ṣà
  alternative: àwọn adigunjalè; àwọn ọlọ̀tẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ọlọ́ṣà oníwà ipá tàbí àwọn adigunjalè, ó sì lè kan àwọn ọlọ̀tẹ̀ ní àyíká ìṣèlú. Ẹsẹ yìí fúnra rẹ̀ kò fi dandan mú kí a yan ìtumọ̀ ìṣèlú náà, nítorí náà ọ̀rọ̀ tó gbòòrò ni a lò nínú àyọkà, a sì tọ́ka sí àwọn ìtumọ̀ mìíràn nínú àlàyé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàndá tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àtẹ̀jáde ìtàn Yorùbá àdánidá “Wọ́n sì kan,” èyí tí kò fi àkókò tuntun kún ọ̀rọ̀ Gíríìkì, tí ó sì pa ìtẹ̀síwájú ìtàn Máàkù mọ́.
