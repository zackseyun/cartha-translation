id: MRK.15.39
reference: Mark 15:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: yo
  text: Nígbà tí balógun ọ̀rún náà, ẹni tí ó dúró ní òdìkejì rẹ̀, rí i pé lọ́nà yìí ni ó mí èémí ìkẹyìn, ó sọ pé, “Lóòótọ́, Ọmọ Ọlọ́run[a] ni ọkùnrin yìí jẹ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí, “ọmọ ọlọ́run kan ni ọkùnrin yìí jẹ́.” Gbólóhùn Gíríìkì náà lè ṣàpèjúwe irú ẹni tí ó jẹ́ tàbí kí ó jẹ́ àìsọ pàtó; ṣùgbọ́n nínú àyíká ìtàn Máàkù, ó ṣeé ṣe kí ó ní agbára oyè náà, “Ọmọ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nígbà tí ... rí i
  rationale: A tú participle aorist náà sí gbólóhùn àsìkò ní Yorùbá. δέ jẹ́ àsopọ̀ fífẹ́, kò sì pọn dandan láti fi ‘ṣùgbọ́n’ hàn.
- source_word: κεντυρίων
  choice: balógun ọ̀rún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti sọ ipò ológun Róòmù kan tí ó ń ṣe àkóso ẹgbẹ́ ọmọ ogun bí ọgọ́rùn-ún.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: ẹni tí ó dúró ní òdìkejì rẹ̀
  rationale: Ó pa ipò tí ọkùnrin náà ti dúró sí, níwájú tàbí ní ìdojúkọ Jesu, mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: pé lọ́nà yìí ni ó mí èémí ìkẹyìn
  rationale: ‘Mí èémí ìkẹyìn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ikú, ó sì tún pa àwòrán mímí tí ἐκπνέω ní mọ́. ‘Lọ́nà yìí’ fi οὕτως hàn ní kedere.
- source_word: Ἀληθῶς
  choice: Lóòótọ́
  rationale: Ó mú ìdánilójú àti ìjẹ́wọ́ pàtàkì inú ἀληθῶς jáde ní èdè Yorùbá àdánidá.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ọkùnrin yìí
  rationale: Ní àyíká yìí, ἄνθρωπος ń tọ́ka sí Jesu gẹ́gẹ́ bí ọkùnrin kan; ‘ọkùnrin yìí’ jẹ́ ìtumọ̀ tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: υἱὸς θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Gbólóhùn náà lè ní agbára ànímọ́ tàbí àìsọ pàtó nítorí kò ní article, ṣùgbọ́n nínú ìtàn Máàkù, ‘Ọmọ Ọlọ́run’ dára jù láti fi agbára oyè Kristi náà hàn. A pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἦν
  choice: ni ... jẹ́
  rationale: Àkójọpọ̀ ‘ni ... jẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún àsọyé ìdánimọ̀; àyíká ìtàn àti ọ̀rọ̀ ìṣe ‘jẹ́’ ń gbé ìtọ́kasí sí ohun tó ṣẹlẹ̀ nígbà náà.
theological_decisions:
- issue: Agbára ìtumọ̀ υἱὸς θεοῦ nínú ìjẹ́wọ́ balógun ọ̀rún
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ ọlọ́run kan
  rationale: Nínú àkóónú ìtàn Máàkù, gbólóhùn náà ní agbára oyè pàtàkì fún Jesu. Síbẹ̀, bí Gíríìkì ṣe kò ní article jẹ́ kí ìtumọ̀ àìsọ pàtó tún ṣeé ṣe; nítorí náà a kò fi àríyànjiyàn náà pamọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
