source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: yo
  text: Nígbà náà, àwọn ọmọ ogun mú un lọ sínú àgbàlá náà, èyí tí í ṣe Pírétóríọ̀mù[a], wọ́n sì pe gbogbo kọ́họ́ọ̀tì náà jọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pírétóríọ̀mù ni ilé tàbí ibùdó ìṣàkóso gómìnà Róòmù.
    reason: cultural_note
  - marker: b
    text: Kọ́họ́ọ̀tì jẹ́ ẹ̀ka kan nínú ọmọ ogun Róòmù; níhìn-ín, ó tọ́ka sí gbogbo ẹgbẹ́ ọmọ ogun tí wọ́n pè jọ.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Nígbà náà
  rationale: δέ ń tẹ ìtàn náà síwájú ju pé ó ń fi ìyàtọ̀ líle hàn; “Nígbà náà” jẹ́ ọ̀nà àdánidá láti so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú.
- source_word: στρατιῶται
  choice: àwọn ọmọ ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún àwọn sójà kọ̀ọ̀kan.
- source_word: ἀπήγαγον
  choice: mú un wọ
  rationale: ἀπάγω túmọ̀ sí mímú tàbí ṣíṣe amọ̀nà ẹnì kan lọ; pẹ̀lú ἔσω, “mú un wọ inú” sọ ibi tí wọ́n mú un lọ ní ọ̀nà àdánidá.
- source_word: ἔσω τῆς αὐλῆς
  choice: wọ inú àgbàlá náà
  rationale: Ó pa ìtumọ̀ ibi inú tàbí àárín àgbàlá mọ́ láì fi kún un pé ó jẹ́ ààfin tàbí ilé kan pàtó.
- source_word: ὅ ἐστιν πραιτώριον
  choice: èyí tí í ṣe Pírétóríọ̀mù
  rationale: A pa orúkọ ìṣàkóso Róòmù náà mọ́ nítorí ìtàn àti àṣà rẹ̀, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: συγκαλοῦσιν
  choice: wọ́n sì pe ... jọ
  rationale: “Pe ... jọ” fi ìtumọ̀ ìpè sí àpéjọ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá. Ìṣe Yorùbá kò fi dandan samisi ìyípadà sí àsìkò ìsinsìnyí, ṣùgbọ́n ó pa ìṣàn ìtàn Máàkù mọ́.
- source_word: ὅλην τὴν σπεῖραν
  choice: gbogbo ẹgbẹ́ ọmọ ogun tí a ń pè ní kọ́họ́ọ̀tì
  rationale: “Kọ́họ́ọ̀tì” pa ìtumọ̀ ẹgbẹ́ ọmọ ogun Róòmù pàtó mọ́; gbólóhùn àlàyé inú ọ̀rọ̀ mú kí ó yé òǹkàwé Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A fi àwọn ọ̀rọ̀ ìtàn Róòmù “Pírétóríọ̀mù” àti “kọ́họ́ọ̀tì” sílẹ̀, ṣùgbọ́n a fi àlàyé kún wọn kí àwọn òǹkàwé lasán lè lóye wọn. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn ní ọ̀nà àdánidá.
