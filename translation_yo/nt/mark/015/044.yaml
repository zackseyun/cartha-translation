  to: Ṣùgbọ́n ó yà Pílátù lẹ́nu pé ó ti kú tẹ́lẹ̀; ó sì pe balógun ọgọ́rùn-ún náà wá, ó bi í bóyá ó ti pẹ́ láti ìgbà tí ó kú.[a]
  rationale: Àtúnṣe náà mú ìsọ̀rọ̀ Yorùbá di adayeba sí i, ní pàtàkì nípa ìyàlẹ́nu Pílátù àti ìbéèrè rẹ̀ nípa àkókò tí ó ti kọjá látìgbà ikú náà. Ó pa ìyàtọ̀ tó wà láàárín ἤδη (‘tẹ́lẹ̀’) àti πάλαι (‘ó ti pẹ́ láti ìgbà náà’) mọ́, láì fi iye àkókò kan tí Gíríìkì kò sọ kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:28:52Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìtumọ̀ ìyàlẹ́nu Pílátù, ikú tí ó ti ṣẹlẹ̀, pípe balógun ọgọ́rùn-ún, àti ìbéèrè nípa bí àkókò ṣe ti kọjá látìgbà ikú náà mọ́. Àmọ́ ‘ó ti pẹ́ díẹ̀ tí ó ti kú’ kò rọrùn gan-an ní Yorùbá; a tún lè sọ àjọṣe àkókò náà ní kedere ju bẹ́ẹ̀ lọ.
  naturalness: ‘Ẹnu ya Pílátù’ lóye, ṣùgbọ́n ‘ó yà Pílátù lẹ́nu’ jẹ́ ọ̀nà Yorùbá boṣewa tó rọrùn sí i. ‘Pé ó ti kú tẹ́lẹ̀’ mú ἤδη hàn ní ti ara. ‘Bóyá ó ti pẹ́ láti ìgbà tí ó kú’ jẹ́ gbólóhùn adayeba fún πάλαι nínú àyíká yìí.
  terminology: ‘Balógun ọgọ́rùn-ún’ yẹ fún κεντυρίων, ó sì pa ipò ológun náà mọ́. ‘Kú’ jẹ́ ọ̀rọ̀ tó yẹ fún ἀποθνῄσκω/θνῄσκω nínú ẹsẹ̀ yìí.
