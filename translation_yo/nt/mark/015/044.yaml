  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: yo
  text: Ṣùgbọ́n ó yà Pílátù lẹ́nu pé ó ti kú tẹ́lẹ̀; ó sì pe balógun ọgọ́rùn-ún náà wá, ó bi í bóyá ó ti pẹ́ láti ìgbà tí ó kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bóyá ó ti jẹ́ òkú fún ìgbà díẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ẹnu ya Pílátù
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàlẹ́nu líle tí Pílátù ní nítorí bí ikú náà ṣe yára dé.
- source_word: εἰ ἤδη τέθνηκεν
  choice: pé ó ti kú ná
  rationale: ‘Ó ti kú’ fi iṣẹ́ tí ó ti parí àti ipò ikú tí ó yọ lára rẹ̀ hàn; ‘ná’ sì mú ìtumọ̀ ἤδη, ìyẹn ‘tẹ́lẹ̀ rí/ní báyìí,’ wọ inú gbolohun lọ́nà Yorùbá àdánidá.
- source_word: προσκαλεσάμενος
  choice: ó sì pe ... wá
  rationale: Ó fi hàn pé Pílátù kọ́kọ́ pè é sí ọ̀dọ̀ ara rẹ̀ kí ó tó bi í léèrè.
- source_word: κεντυρίωνα
  choice: balógun ọgọ́rùn-ún
  rationale: Ó pa ipò ológun Róòmù náà mọ́, ìyẹn ọ̀gá tí a fi mọ́ ẹgbẹ́ ọmọ ogun tó tó ọgọ́rùn-ún.
- source_word: ἐπηρώτησεν αὐτόν
  choice: ó bi í
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtàn mu fún ‘ó béèrè lọ́wọ́ rẹ̀.’
- source_word: εἰ πάλαι ἀπέθανεν
  choice: bóyá ó ti pẹ́ díẹ̀ tí ó ti kú
  rationale: Ó fi ìbéèrè àìdánilójú εἰ pamọ́, ó sì tú πάλαι sí ìtumọ̀ pé àkókò díẹ̀ ti kọjá láti ìgbà ikú náà, láì sọ pé ó ti pẹ́ gan-an.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé lóye ní rọ́rùn. A lo ‘balógun ọgọ́rùn-ún’ láti pa pàtó ipò ológun Róòmù mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì pa ọ̀nà ìtumọ̀ tó sún mọ́ perfect/state ní Gíríìkì mọ́.
