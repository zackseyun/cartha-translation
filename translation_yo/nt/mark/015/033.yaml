source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: yo
  text: Nígbà tí ó sì di wákàtí kẹfà[b], òkùnkùn ṣú bo gbogbo ilẹ̀[a] títí di wákàtí kẹsàn-án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ayé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ilẹ̀” tàbí “ayé.”
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni, láti nǹkan bí ọ̀sán gangan títí di nǹkan bí aago mẹ́ta ọ̀sán.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: nígbà tí ó sì di wákàtí kẹfà
  rationale: Èyí tú ọ̀rọ̀ àkókò inú genitive absolute náà sí Yorùbá àdánidá, ó sì pa ọ̀nà ìṣírò wákàtí inú orísun mọ́ dípò yíyí i sí ọ̀sán gangan nínú ẹsẹ̀.
- source_word: σκότος
  choice: òkùnkùn
  rationale: “Òkùnkùn” ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ orúkọ Gíríìkì náà mu.
- source_word: ἐγένετο
  choice: ṣú bo
  rationale: Nínú gbólóhùn yìí, “òkùnkùn ṣú bo” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé òkùnkùn dé, ó sì tàn bo agbègbè náà; ó pa agbára ìṣẹ̀lẹ̀ ἐγένετο mọ́.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: bo gbogbo ilẹ̀
  rationale: γῆ lè túmọ̀ sí “ilẹ̀” tàbí “ayé.” “Gbogbo ilẹ̀” kò fi dandan sọ pé gbogbo àgbáyé ni, ó sì jẹ́ kí àlàyé ìtumọ̀ kejì wà nínú àlàyé ìsàlẹ̀.
- source_word: ἕως ὥρας ἐνάτης
  choice: títí di wákàtí kẹsàn-án
  rationale: Èyí pa ọ̀nà tí orísun fi ń ka wákàtí ọjọ́ mọ́, ó sì bá “wákàtí kẹfà” mu ní ìṣọ̀kan.
theological_decisions:
- issue: Ìwọ̀n agbègbè tí γῆ ń tọ́ka sí nínú òkùnkùn nígbà ìkàn mọ́ àgbélébùú
  choice: gbogbo ilẹ̀
  alternative: gbogbo ayé
  rationale: Ọ̀rọ̀ Gíríìkì γῆ ní ìtumọ̀ tó gbòòrò, ó lè jẹ́ ilẹ̀ agbègbè tàbí ayé. Yíyan “gbogbo ilẹ̀” kò gbé ìpinnu pé gbogbo àgbáyé ni òkùnkùn náà bo wọ inú ẹsẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “gbogbo ayé” mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní; a pa ọ̀nà ìṣírò wákàtí ti ayé ìgbàanì mọ́ nínú ẹsẹ̀, a sì ṣàlàyé rẹ̀ ní ìsàlẹ̀.
