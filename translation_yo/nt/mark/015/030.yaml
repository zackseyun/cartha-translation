  text: Save yourself[a], coming down from the cross!
translation:
  language: yo
  text: Gba ara rẹ là[a]; sọ̀ kalẹ̀ kúrò lórí àgbélébùú!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì ní ọrọ̀ ìṣe àṣẹ kan (“Gba ara rẹ là”) pẹ̀lú participle kan (“nígbà tí o ti sọ̀ kalẹ̀” / “nípa sísọ̀ kalẹ̀”). Yorùbá fi hàn níbí gẹ́gẹ́ bí àṣẹ méjì: “Gba ara rẹ là; sọ̀ kalẹ̀ kúrò lórí àgbélébùú!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: Gba … là
  rationale: Ọ̀rọ̀ ìṣe àṣẹ aorist, ẹni kejì ẹyọ; “gba … là” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa èdè ìgbàlà mọ́, ó sì bá ọ̀rọ̀ ẹ̀gàn náà mu.
- source_word: σεαυτόν
  choice: ara rẹ
  rationale: Arọ́pò-orúkọ afarahẹ tí ó jẹ́ ohun tí ìṣe náà dé bá; “ara rẹ” pa agbára ọ̀rọ̀ ẹ̀gàn tí a darí sí ẹni náà fúnra rẹ̀ mọ́.
- source_word: καταβάς
  choice: nípa sísọ̀ kalẹ̀
  rationale: Participle aorist ni; nínú ọ̀rọ̀ ìpèníjà yìí, gbígbé e kalẹ̀ gẹ́gẹ́ bí ọ̀nà tí ìgbàlà ara rẹ yóò gbà ṣẹlẹ̀ jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ìbáṣepọ̀ rẹ̀ pẹ̀lú àṣẹ náà lè tún túmọ̀ sí ìṣe tí ó tẹ̀ lé e.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: kúrò lórí àgbélébùú
  rationale: Ó fi ìṣípò kúrò níbi àgbélébùú hàn; “kúrò lórí” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún sísọ̀ kalẹ̀ láti orí ohun kan.
theological_decisions:
- issue: Ìbáṣepọ̀ participle καταβάς pẹ̀lú àṣẹ σῶσον
  choice: “Gba ara rẹ là nípa sísọ̀ kalẹ̀ kúrò lórí àgbélébùú!”
  alternative: “Gba ara rẹ là; sọ̀ kalẹ̀ kúrò lórí àgbélébùú!” tàbí “Gba ara rẹ là lẹ́yìn tí o bá sọ̀ kalẹ̀ kúrò lórí àgbélébùú!”
  rationale: Èyí ka participle náà gẹ́gẹ́ bí ọ̀nà tàbí ìṣe tí ó bá àṣẹ náà rìn, ó sì mú ìpèníjà àwọn ẹlẹ́gàn náà jáde ní Yorùbá àdánidá. Àkọ́lẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ gírámà mìíràn tí ó ṣeé ṣe mọ́ láìfi tipátipá yanju àìdánilójú inú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kedere, ọ̀wọ̀, ó sì bójú mu ọ̀rọ̀ ẹ̀gàn tààrà inú ìṣẹ̀lẹ̀ náà.
