  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: yo
  text: Ọkùnrin tí a ń pè ní Bárábà sì wà ní ìdè pẹ̀lú àwọn ọlọ̀tẹ̀ tí wọ́n ti ṣe ìpànìyàn nínú ìṣọ̀tẹ̀ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “pẹ̀lú àwọn tó dìde sí ìjọba” / “nínú ìdìde sí ìjọba náà.” Ọ̀rọ̀ Gíríìkì lo àwọn ọ̀rọ̀ tó jọra fún àwọn tó kópa nínú ìṣọ̀tẹ̀ àti fún ìṣọ̀tẹ̀ náà fúnra rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: sì wà
  rationale: “Sì” fi ìsopọ̀ ìtàn pẹ̀lẹ́pẹ̀lẹ́ tí δέ ní hàn láì sọ ọ́ di àmì àkókò; “wà” túmọ̀ ἦν ní ti ẹ̀dá.
- source_word: ὁ λεγόμενος
  choice: Ọkùnrin tí a ń pè ní
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti dá ẹni náà mọ̀ nípasẹ̀ orúkọ tí a fi ń pè é, láì fi ìtumọ̀ ẹ̀gàn kún un.
- source_word: Βαραββᾶς
  choice: Bárábà
  rationale: A kọ orúkọ náà ní ọ̀nà tí ó bá ìró àti àkọtọ̀ Yorùbá mu.
- source_word: μετὰ τῶν στασιαστῶν
  choice: pẹ̀lú àwọn ọlọ̀tẹ̀
  rationale: “Àwọn ọlọ̀tẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àwọn tó kópa nínú ìdìtẹ̀ tàbí ìṣọ̀tẹ̀.
- source_word: δεδεμένος
  choice: wà ní ìdè
  rationale: Ó pa ìtumọ̀ jíjẹ́ ẹni tí a dè mọ́, ó sì bá ipò àhámọ́ nínú ẹsẹ yìí mu.
- source_word: οἵτινες
  choice: tí wọ́n
  rationale: Ó ṣàgbékalẹ̀ gbólóhùn àlàyé nípa àwọn ọlọ̀tẹ̀ náà lọ́nà Yorùbá àdánidá.
- source_word: ἐν τῇ στάσει
  choice: nínú ìṣọ̀tẹ̀ náà
  rationale: “Ìṣọ̀tẹ̀” tọ́ka sí ìdìde sí àṣẹ, kì í ṣe rògbòdìyàn lásán; “náà” fi ìṣọ̀tẹ̀ pàtó tí a mẹ́nu kàn hàn.
- source_word: φόνον πεποιήκεισαν
  choice: tí wọ́n ti ṣe ìpànìyàn
  rationale: “Ti ṣe” fi hàn pé ìṣe náà ti ṣẹlẹ̀ ṣáájú, “ìpànìyàn” sì pa agbára ọ̀rọ̀ φόνος gẹ́gẹ́ bí pípa ènìyàn mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “wà ní ìdè” láti pa àwòrán jíjẹ́ ẹni tí a dè mọ́, àti “ìṣọ̀tẹ̀/ọlọ̀tẹ̀” láti fi ìbátan àwọn ọ̀rọ̀ Gíríìkì hàn.
