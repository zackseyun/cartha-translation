    rationale: “Wọ̀” ni fọ́ọ̀mù tó yẹ fún ‘clothe/dress someone’; “wọ” lè yí ìtumọ̀ gbolohun padà.
  - severity: medium
    issue: “Aṣọ” wọ inú ọ̀rọ̀ ìtumọ̀ gẹ́gẹ́ bí apá gbolohun pàtàkì, bí ó tilẹ̀ jẹ́ pé πορφύραν kò sọ ‘aṣọ’ ní pàtó.
    rationale: Gíríìkì náà ní ‘purple’ nìkan. Yíyọ “aṣọ” kúrò nínú ẹsẹ pa àìsọ náà mọ́; àlàyé ìsàlẹ̀ lè darí olùkà sí ìtumọ̀ aṣọ náà.
