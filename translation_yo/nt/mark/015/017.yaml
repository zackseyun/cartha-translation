  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: yo
  text: Wọ́n sì wọ̀ ọ́ ní elése àlùkò[a]; lẹ́yìn tí wọ́n hun adé ẹ̀gún, wọ́n sì fi í lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi elése àlùkò wọ̀ ọ́.” Ọ̀rọ̀ Gíríìkì kò sọ “aṣọ” ní pàtó nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé ohun ìwọ̀ kan ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: wọ aṣọ ... fún un
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí fífi aṣọ wọ ẹnì kan. Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ olùṣe mọ́.
- source_word: πορφύραν
  choice: aṣọ aláwọ̀ elése àlùkò
  rationale: Nọ́ọ̀nù náà lè tọ́ka sí aṣọ tàbí ohun èlò aláwọ̀ elése àlùkò. Fífi “aṣọ” kún un mú gbolohun Yorùbá ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì kò sọ irú aṣọ náà ní pàtó.
- source_word: περιτιθέασιν
  choice: wọ́n gbé e lé e
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ohun yí ẹnì kan ká tàbí lé e. Arọ́pò-orúkọ “e” àkọ́kọ́ tọ́ka sí adé, èkejì sì tọ́ka sí Jésù.
- source_word: πλέξαντες
  choice: lẹ́yìn tí wọ́n hun
  rationale: Aorist participle náà ṣáájú ìṣe pàtàkì ní ìtẹ̀síwájú àkókò; “lẹ́yìn tí” fi ìtẹ̀lé ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: ἀκάνθινον
  choice: ẹ̀gún
  rationale: Adjective náà ṣàpèjúwe ohun tí a fi ẹ̀gún ṣe; “adé ẹ̀gún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì rọrùn.
- source_word: στέφανον
  choice: adé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí òdòdó tàbí ohun tí a hun yí orí ká, “adé” dára jù nínú àyíká yìí, níbi tí àwọn ọmọ-ogun ti ń fi ipò ọba ṣe ẹlẹ́yà.
theological_decisions:
- issue: Àwòrán ìfiniṣòòṣì ọba nínú ìtìjú Jésù
  choice: Lílo “adé” fún στέφανος
  alternative: ohun tí a hun yí orí ká
  rationale: Aṣọ elése àlùkò àti adé ẹ̀gún jọ fi hàn pé àwọn ọmọ-ogun ń ṣe ipò ọba Jésù ní ẹlẹ́yà. “Adé” pa àwòrán ọba yìí mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì yé gbogbo ènìyàn ni a lò. “Elése àlùkò” ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún àwọ̀ purple; a fi “aṣọ” kún un fún ìtumọ̀ àdánidá, pẹ̀lú àlàyé ìsàlẹ̀ láti pa àìsọ irú aṣọ náà ní Gíríìkì mọ́.
