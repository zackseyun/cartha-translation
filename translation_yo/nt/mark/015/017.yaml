  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní ìlànà ìṣe: wọ́n kọ́kọ́ wọ Jésù ní elése àlùkò, lẹ́yìn náà wọ́n hun adé ẹ̀gún, wọ́n sì gbé e lé e. Ṣùgbọ́n àmì ohùn ọ̀rọ̀-ìṣe akọkọ gbọdọ̀ jẹ́ “wọ̀,” kì í ṣe “wọ,” nítorí ìtumọ̀ rẹ̀ níbí ni wọ aṣọ sí ẹnì kan. “Aṣọ” tún jẹ́ àfikún tí Gíríìkì kò sọ ní pàtó; a lè yọ ọ́ kúrò láìba ìtumọ̀ Yorùbá jẹ́.'
  naturalness: “Wọ́n sì wọ̀ ọ́ ní elése àlùkò” jẹ́ gbolohun Yorùbá tó rọrùn, tó sì pa ìtumọ̀ “dress him in purple” mọ́. “Wọ́n sì gbé e lé e” lè dá lójú nínú àyíká, ṣùgbọ́n “wọ́n sì fi í lé e” sọ ìṣe fífi adé náà lé e ní kedere síi.
  terminology: “Elése àlùkò” jẹ́ ọ̀nà tó bójú mu fún πορφύρα, àti “adé ẹ̀gún” bójú mu fún στέφανον ἀκάνθινον nínú àyíká ìfẹ̀sùfẹ̀ ọba. A kò yẹ kí a sọ irú aṣọ kan, bí “aṣọ àwọ̀,” nínú ẹsẹ gẹ́gẹ́ bí ẹni pé ó wà nínú Gíríìkì; àlàyé ìsàlẹ̀ lè ṣàlàyé ìtumọ̀ aṣọ tí àyíká ń fi hàn.
  issues:
