review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì Gíríìkì náà mọ́ dáadáa: ìṣe àṣà tí imperfect ń fi hàn nínú ‘máa ń,’ iṣẹ́/àtìlẹ́yìn ti διηκόνουν, àti lílọ ‘gòkè’ sí Jerúsálẹ́mù. Ṣùgbọ́n ‘níbẹ̀’ fi àfikún ibi kan kún gbolohun náà tí kò sí nínú ìpilẹ̀ ọ̀rọ̀.'
  naturalness: Yorùbá náà jẹ́ èyí tí ó ṣeé lóye, ó sì ní àmì ohùn tó péye ní gbogbogbòò. ‘Àti ọ̀pọ̀ àwọn obìnrin mìíràn ... wà’ ń dá ìṣọ̀kan gbolohun kejì pọ̀ sí i, ó sì yẹra fún àfikún ‘níbẹ̀.’ ‘Tí wọ́n ti bá a gòkè lọ’ ń sọ ìṣe tí ó ṣáájú èyí tí a ń ṣàpèjúwe hàn ní ti ara.
  terminology: ‘Máa ń ṣe ìránṣẹ́ fún un’ jẹ́ ìtumọ̀ tó gbooro tó sì bójú mu fún διηκόνουν; kò fi ipò ìjọ kan tàbí iṣẹ́ ilé nìkan kàn án. ‘Gòkè lọ sí Jerúsálẹ́mù’ ń pa ọ̀nà-ìsọ ọrọ̀ Bíbélì mọ́. Àwọn àkọsílẹ̀ ìsàlẹ̀ ìwé náà wà ní ibi tó yẹ.
  issues:
  - severity: medium
    issue: Ọ̀rọ̀ náà ní ‘níbẹ̀’ ní òpin gbolohun kejì.
    rationale: Gíríìkì náà sọ pé ‘àwọn obìnrin mìíràn púpọ̀, àwọn tí wọ́n bá a gòkè lọ sí Jerúsálẹ́mù’; kò ní ọ̀rọ̀ kan tó dọ́gba pẹ̀lú ‘níbẹ̀.’ Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí ibi ìṣẹ̀lẹ̀ náà, kò yẹ kí ìtumọ̀ fi ibi náà hàn ní kedere níbi tí ìpilẹ̀ ọ̀rọ̀ kò ti ṣe bẹ́ẹ̀.
  - severity: low
