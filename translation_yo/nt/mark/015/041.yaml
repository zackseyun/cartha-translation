revisions:
- from: Àwọn obìnrin wọ̀nyí, nígbà tí ó wà ní Gálílì, máa ń tọ̀ ọ́ lẹ́yìn, wọ́n sì máa ń ṣe ìránṣẹ́ fún un[a]. Ọ̀pọ̀ àwọn obìnrin mìíràn tí wọ́n bá a gòkè lọ sí Jerúsálẹ́mù pẹ̀lú sì wà níbẹ̀[b].
  to: Àwọn obìnrin wọ̀nyí, nígbà tí ó wà ní Gálílì, máa ń tọ̀ ọ́ lẹ́yìn, wọ́n sì máa ń ṣe ìránṣẹ́ fún un[a]. Àti ọ̀pọ̀ àwọn obìnrin mìíràn, tí wọ́n ti bá a gòkè lọ sí Jerúsálẹ́mù, wà[b].
  rationale: A yọ ‘níbẹ̀’ kúrò nítorí pé ó jẹ́ àfikún tí ìpilẹ̀ ọ̀rọ̀ kò sọ. A tún fi ‘ti’ kún gbolohun alábùdá náà láti ṣàfihàn ìṣe ìrìnàjò tí ó ti ṣẹlẹ̀, ní ìbámu pẹ̀lú aorist participle συναναβᾶσαι. Àwọn ìyókù ni a pa mọ́ nítorí pé wọ́n jẹ́ olóòtítọ́ sí ìpilẹ̀ ọ̀rọ̀, wọ́n sì jẹ́ Yorùbá boṣewa àdánidá.
