  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: yo
  text: Àwọn obìnrin wọ̀nyí, nígbà tí ó wà ní Gálílì, máa ń tọ̀ ọ́ lẹ́yìn, wọ́n sì máa ń ṣe ìránṣẹ́ fún un[a]. Àti ọ̀pọ̀ àwọn obìnrin mìíràn, tí wọ́n ti bá a gòkè lọ sí Jerúsálẹ́mù, wà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tọ́jú rẹ̀” tàbí “pèsè fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí iṣẹ́ ọwọ́ tàbí àtìlẹ́yìn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “bá a gòkè lọ sí Jerúsálẹ́mù.” Èyí ń tẹ̀ lé ọ̀nà tí Bíbélì sábà máa ń gbà sọ nípa lílọ sí Jerúsálẹ́mù.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Àwọn obìnrin wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ yìí ń tọ́ka padà sí àwọn obìnrin tí ẹsẹ tó ṣáájú dárúkọ; fífi ‘Àwọn obìnrin wọ̀nyí’ ṣe é jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: nígbà tí ó wà ní Gálílì
  rationale: Ó túmọ̀ gbólóhùn àkókò náà ní tààràtà láìfi àlàyé kún un.
- source_word: ἠκολούθουν
  choice: máa ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò imperfect náà ń fi ìṣe tí wọ́n sábà máa ń ṣe ní àtijọ́ hàn, kì í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
- source_word: διηκόνουν
  choice: máa ń ṣe ìránṣẹ́ fún un
  rationale: Ọ̀rọ̀ náà lè ní iṣẹ́ ọwọ́, ìtọ́jú, tàbí àtìlẹ́yìn nínú; ‘ṣe ìránṣẹ́ fún un’ pa ìtumọ̀ gbooro yìí mọ́ láìsọ ọ́ di ipò iṣẹ́ ìjọ kan.
- source_word: ἄλλαι πολλαὶ
  choice: ọ̀pọ̀ àwọn obìnrin mìíràn
  rationale: Àyíká ọ̀rọ̀ náà fi hàn pé obìnrin ni wọ́n, ‘mìíràn’ sì pa ìyàtọ̀ tí ἄλλαι ń sọ mọ́.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: tí wọ́n bá a gòkè lọ ... pẹ̀lú
  rationale: Aorist participle náà tọ́ka sí ìrìn àjò tí ó ti ṣẹlẹ̀; ‘gòkè lọ’ tún pa àṣà ọ̀rọ̀ Bíbélì nípa lílọ sí Jerúsálẹ́mù mọ́.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ibi tí ìrìn àjò náà ń lọ.
theological_decisions:
- issue: Irú iṣẹ́ tí àwọn obìnrin náà ṣe gẹ́gẹ́ bí διηκόνουν
  choice: ṣe ìránṣẹ́ fún un
  alternative: tọ́jú rẹ̀ / pèsè fún un
  rationale: Yíyan yìí fi wọ́n hàn gẹ́gẹ́ bí àwọn alátìlẹ́yìn Jésù, ṣùgbọ́n kò dín iṣẹ́ wọn kù sí iṣẹ́ ilé nìkan, bẹ́ẹ̀ ni kò sọ ọ́ di ipò àṣẹ kan nínú ìjọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Máa ń’ fi ìṣe àṣà ní àtijọ́ hàn; ‘gòkè lọ’ pa àwòrán ìpilẹ̀ṣẹ̀ mọ́. Àmì ìsẹ̀lẹ̀ ìsàlẹ̀ ìwé ni a gbé sí ibi tí ọkọọkan ń ṣàlàyé.
