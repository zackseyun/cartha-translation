    rationale: Fífì ‘ti’ kún un—‘tí wọ́n ti bá a gòkè lọ’—jẹ́ Yorùbá àdánidá tí ó ń ṣàfihàn pé ìrìnàjò náà ti ṣẹlẹ̀ ṣáájú àkókò ìṣẹ̀lẹ̀ tí a ń ṣàpèjúwe.
