  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì Bísántíọ̀mù dáadáa ní pàtàkì: ἐπληρώθη jẹ́ ìmúṣẹ Ìwé Mímọ́, àti μετὰ ἀνόμων ń sọ pé a kà á pọ̀ mọ́ ẹgbẹ́ àwọn arúfin. Síbẹ̀, “Àti pé” fi ‘pé’ kún Καὶ láìní ìdí, a sì nílò “sì” nínú gbólóhùn àkọ́kọ́ kí ìṣọ̀kan gbolohun Yorùbá àti ipa ‘And’ hàn ní kedere.'
