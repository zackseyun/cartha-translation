  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: yo
  text: Àti[a] Ìwé Mímọ́ náà sì ṣẹ, èyí tí ó wí pé, “A sì kà á mọ́ àwọn arúfin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì ìbẹ̀rẹ̀pẹ̀tẹ̀, títí kan Sínáítíkù àti Vátíkánù ti ọ̀rúndún kẹrin, bẹ́ẹ̀ ni kò sí nínú àwọn ìtumọ̀ Kọ́pítì ìbẹ̀rẹ̀pẹ̀tẹ̀. Ṣùgbọ́n, ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ ti àṣà Bísántíọ̀mù àti nínú àṣà Látìn. Ó ṣeé ṣe kí àwọn akọ̀wé ìgbà tó tẹ̀ lé e fi kún un láti mú un bá Lúùkù 22:37 mu, níbi tí Lúùkù ti fa ọ̀rọ̀ yọ láti inú Aísáyà 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω (ἐπληρώθη)
  choice: ṣẹ
  rationale: Nínú ọ̀rọ̀ àsọtẹ́lẹ̀, ‘ṣẹ’ fi hàn ní ṣókí àti ní èdè Yorùbá àdánidá pé ohun tí Ìwé Mímọ́ sọ ti wá sí ìmúṣẹ.
- source_word: ἄνομος (ἀνόμων)
  choice: àwọn arúfin
  rationale: ‘Àwọn arúfin’ túmọ̀ sí àwọn tí ń rú òfin, ó sì pa ìtumọ̀ ẹ̀sìn àti ìwà ọ̀daràn inú àyọkà Aísáyà mọ́ láì dín un kù sí orúkọ ẹ̀ṣẹ̀ kan pàtó.
- source_word: λογίζομαι (ἐλογίσθη)
  choice: kà á mọ́
  rationale: 'Gbólóhùn ‘kà á mọ́’ ṣàfihàn ìṣe aláìṣe-taara náà: a fi í sínú ẹgbẹ́ kan, a sì kà á sí ọ̀kan lára wọn.'
- source_word: γραφή
  choice: Ìwé Mímọ́
  rationale: Ní ibi yìí, ọ̀rọ̀ náà tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí àṣẹ ìkọ̀wé tí ń sọ àsọtẹ́lẹ̀, kì í ṣe ìkọ̀wé lásán.
theological_decisions:
- issue: Bí a ṣe máa sọ ìbáṣepọ̀ Jesu pẹ̀lú àwọn ἀνόμων
  choice: “A sì kà á mọ́ àwọn arúfin”
  alternative: “A sì kà á sí arúfin”
  rationale: Ọ̀rọ̀ Gíríìkì μετὰ túmọ̀ sí pé a kà á pọ̀ mọ́ wọn tàbí sí ọ̀kan lára wọn; kò fi dandan sọ pé òun fúnra rẹ̀ jẹ́ arúfin. Ìtumọ̀ yìí pa ìyàtọ̀ pàtàkì náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ṣẹ’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìmúṣẹ àsọtẹ́lẹ̀, àti ‘kà á mọ́’ láti pa ìtumọ̀ pípa ẹni pọ̀ mọ́ ẹgbẹ́ kan mọ́.
