source:
  edition: SBLGNT
  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: yo
  text: 'A sì kọ àkọlé ẹ̀sùn rẹ̀ sílẹ̀ pé: “Ọba àwọn Júù.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọba àwọn ará Jùdíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: Àkọlé
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí a kọ síbi tí gbogbo ènìyàn lè rí gẹ́gẹ́ bí ìdánimọ̀ ẹ̀sùn; “àkọlé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì bá àyíká yìí mu.
- source_word: αἰτία
  choice: ẹ̀sùn tí wọ́n ... sí i
  rationale: Nínú àyíká ìdájọ́ yìí, αἰτία túmọ̀ sí ẹ̀sùn tàbí ìdí ìdálẹ́bi tí a fi kàn án. Ìṣètò ọ̀rọ̀ yìí mú ìtumọ̀ òfin náà hàn láìṣe àfikún.
- source_word: ἐπιγεγραμμένη
  choice: tí wọ́n kọ
  rationale: Ìkọ̀wé periphrastic Gíríìkì fi hàn pé àkọlé náà wà ní kíkọ. “Tí wọ́n kọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ èyí.
- source_word: βασιλεὺς
  choice: Ọba
  rationale: Ó jẹ́ oyè ọba nínú àkọlé ẹ̀sùn náà; lílo lẹ́tà ńlá bá bí a ṣe ń gbé àkọlé náà kalẹ̀ mu.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Èyí pa oyè tí a mọ̀ nínú ìtàn ìjìyà Jésù mọ́, ó sì tọ́ka sí ẹgbẹ́ ènìyàn náà gẹ́gẹ́ bí ẹ̀sùn Romu ṣe gbé e kalẹ̀. Àṣàyàn “àwọn ará Jùdíà” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú oyè tí wọ́n kọ mọ́ àgbélébùú
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: “Àwọn Júù” pa oyè ìbílẹ̀ nínú àwọn ìtàn ìjìyà Jésù mọ́, kò sì fi àlàyé agbègbè tí ẹsẹ̀ náà kò sọ kún un. Níwọ̀n bí Ἰουδαῖος ti lè túmọ̀ sí “ará Jùdíà” ní àwọn àyíká kan, a fi àṣàyàn náà sí àlàyé ìsàlẹ̀ láti pa àìdánilójú ọ̀rọ̀ ìpilẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbo; a lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá.
