  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà: “Ó jẹ́ wákàtí kẹta” ń mú Ἦν ... ὥρα τρίτη wá dáadáa, “wọ́n sì” ń gbé δέ kalẹ̀ gẹ́gẹ́ bí àsopọ̀ ìtàn onírẹ̀lẹ̀, àti “wọ́n ... kàn án mọ́ àgbélébùú” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ἐσταύρωσαν αὐτόν. Kò fi ìṣètò àkókò òde òní sínú ọ̀rọ̀ pàtàkì.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ó ní àmì ohùn tó yẹ, ó sì ní ìgbọ́gbọ́n ọrọ̀ tó bá ìtàn ọlọ́wọ̀ mu. “Wákàtí kẹta” àti “kàn án mọ́ àgbélébùú” jẹ́ gbólóhùn tí òǹkàwé Yorùbá lè lóye nírọ̀rùn nínú àkọsílẹ̀ Ìwé Mímọ́.
  terminology: “Àgbélébùú” jẹ́ ọ̀rọ̀ tó yẹ fún cross, àti ìtumọ̀ náà kò ṣàfikún ìtumọ̀ ẹ̀kọ́-ìjọ kankan. Àkọsílẹ̀ ìsàlẹ̀ náà ń ṣàlàyé “wákàtí kẹta” gẹ́gẹ́ bí ìtọ́kasí àṣà, nígbà tó ń jẹ́ kí ọ̀rọ̀ pàtàkì dúró ní ìtumọ̀ gangan.
