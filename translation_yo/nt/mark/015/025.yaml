source:
  edition: SBLGNT
  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: yo
  text: Ó jẹ́ wákàtí kẹta[a], wọ́n sì kàn án mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí túmọ̀ sí nǹkan bí aago mẹ́sàn-án òwúrọ̀, gẹ́gẹ́ bí ìlànà ìkà àkókò tí ó wọ́pọ̀ láàárín àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: Ó jẹ́
  rationale: Àìpé ọ̀rọ̀-ìṣe εἰμί ń fi àkókò ìṣẹ̀lẹ̀ hàn; “Ó jẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkókò.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn síwájú, kì í ṣe ìtakora líle; “sì” dá iṣẹ́ yìí dúró nínú gbólóhùn.
- source_word: ὥρα τρίτη
  choice: wákàtí kẹta
  rationale: Ìtumọ̀ yìí pa ìlànà ìkà àkókò ayé àtijọ́ mọ́, láì yí i sí aago òde òní nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐσταύρωσαν
  choice: wọ́n kàn ... mọ́ àgbélébùú
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún fífi ènìyàn mọ́ àgbélébùú.
- source_word: αὐτόν
  choice: án
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbàṣe yìí tọ́ka sí Jésù; a lo fọ́ọ̀mù “án” lẹ́yìn ọ̀rọ̀-ìṣe “kàn.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìtọ́kasí àkókò nípa ìṣètò ìṣẹ̀lẹ̀
  choice: Pa “wákàtí kẹta” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Túmọ̀ rẹ̀ sí “nǹkan bí aago mẹ́sàn-án òwúrọ̀.”
  rationale: Ẹsẹ náà fúnra rẹ̀ lo ìlànà ìkà àkókò ayé àtijọ́, kò sì ṣàlàyé bí a ṣe lè yí i sí aago òde òní. Pípa ọ̀rọ̀ gangan mọ́ kò fi ọ̀nà ìbámu ìṣètò ìṣẹ̀lẹ̀ kankan kún ẹsẹ náà; àlàyé wà ní àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìtọ́kasí àkókò ayé àtijọ́ mọ́, a sì ṣàlàyé rẹ̀ ní àkọsílẹ̀ ìsàlẹ̀.
