id: MRK.15.9
reference: Mark 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: yo
  text: Ṣùgbọ́n Pilatu dá wọn lóhùn pé, “Ṣé ẹ fẹ́ kí n dá Ọba àwọn Júù[a] sílẹ̀ fún yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì Ἰουδαίων lè túmọ̀ sí “àwọn Júù” tàbí “àwọn ará Jùdíà”; ṣùgbọ́n nínú àkọlé tí a máa ń lò nínú ìtàn ìjìyà Jesu yìí, “àwọn Júù” ni ìtumọ̀ àtọwọ́dọ́wọ́ tó sì bá àyíká ọ̀rọ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré nínú ìtàn hàn bí Pilatu ṣe dá ogunlọ́gọ̀ náà lóhùn; ó bá ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú ohun tó ṣáájú mu.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó dá wọn lóhùn, ó sì bẹ̀rẹ̀ ọ̀rọ̀ tààrà; kò pọndandan láti tú λέγων lọ́tọ̀ sí ‘ó ń wí’.
- source_word: Θέλετε
  choice: Ṣé ẹ fẹ́
  rationale: θέλω ń tọ́ka sí ìfẹ́ tàbí ohun tí ẹni fẹ́ kí ó ṣẹlẹ̀; ‘Ṣé ẹ fẹ́’ ṣe kedere, ó sì jẹ́ èdè Yorùbá òde òní.
- source_word: ἀπολύσω
  choice: kí n dá … sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, ἀπολύω túmọ̀ sí dídá ẹlẹ́wọ̀n sílẹ̀ tàbí fífi í sílẹ̀ lọ́fẹ̀ẹ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dátífù náà fi àwọn ènìyàn tí Pilatu yóò ṣe ìgbésẹ̀ náà fún hàn; ‘fún yín’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Èyí pa àkọlé ìṣèlú tó wà nínú ìtàn ìjìyà Jesu mọ́. Lílo ‘Júù’ bá àkọlé tí a mọ̀ sí ‘Ọba àwọn Júù’ mu, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àkọlé τὸν βασιλέα τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  alternative: ọba àwọn ará Jùdíà
  rationale: Nínú ìtàn ìjìyà Jesu, gbólóhùn náà jẹ́ àkọlé ìṣèlú tí àwọn aláṣẹ Róòmù àti àwọn mìíràn lò, tó sì ní ìrísí ẹ̀gàn nínú àyíká ọ̀rọ̀ náà. ‘Àwọn Júù’ ni ìtumọ̀ àtọwọ́dọ́wọ́ tó bá àkọlé yìí mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ibi-ìbí ‘àwọn ará Jùdíà’ ṣì hàn gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní àmì ohùn níbi tó yẹ, ó ní ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Dá wọn lóhùn pé’ àti ‘Ṣé ẹ fẹ́’ jẹ́ àdánidá ju títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì lẹ́yọ-ọ̀kan lọ, nígbà tí gbogbo ìtumọ̀ pàtàkì ṣì dúró.
