  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: yo
  text: Pílátù sì tún dá wọn lóhùn pé, “Ǹjẹ́ kí ni ẹ fẹ́ kí n ṣe pẹ̀lú ẹni tí ẹ ń pè ní ọba àwọn Júù?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ǹjẹ́ kí ni ẹ fẹ́ kí n ṣe pẹ̀lú ẹni tí ẹ sọ pé òun ni ọba àwọn Júù?”
    reason: Àṣàyàn yìí túmọ̀ ὃν λέγετε gẹ́gẹ́ bí “ẹ sọ pé òun ni,” ṣùgbọ́n “ẹ ń pè ní” sún mọ́ ọ̀rọ̀ Gíríìkì jù.
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pílátù tún ń bá wọn sọ̀rọ̀ nínú ìjíròrò náà.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fèsì, láìfi ìtumọ̀ tuntun kún ọ̀rọ̀ Gíríìkì.
- source_word: Τί οὖν
  choice: Ǹjẹ́ kí ni
  rationale: “Ǹjẹ́” so ìbéèrè náà pọ̀ mọ́ ohun tí àwọn ènìyàn béèrè tẹ́lẹ̀, bí οὖν ṣe ń ṣe nínú Gíríìkì.
- source_word: θέλετε ποιήσω
  choice: ẹ fẹ́ kí n ṣe
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tí ó ṣe kedere, ó sì ṣàfihàn ìfẹ́ tàbí ohun tí àwọn ènìyàn fẹ́ kí Pílátù ṣe.
- source_word: ὃν λέγετε
  choice: ẹ sọ pé òun ni
  rationale: 'Ó pa ojú-ìwòye àwọn ènìyàn mọ́: àwọn ni wọ́n ń sọ pé ẹni náà ni ọba; kì í ṣe pé Pílátù fúnra rẹ̀ ń jẹ́wọ́ rẹ̀. Àlàyé ẹsẹ̀ tún fúnni ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù.'
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ọba àwọn Júù
  rationale: Èyí jẹ́ akọ́lé ìṣèlú tí ó bá àyíká ìtàn ìjìyà Jésù mu, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pílátù jẹ́ ìjẹ́wọ́ pé Jésù ni ọba àwọn Júù, tàbí pé ó kàn ń tún ohun tí àwọn ènìyàn ń pè é sọ
  choice: 'A fi akọ́lé náà sí ẹnu àwọn ènìyàn: “ẹ sọ pé òun ni ọba àwọn Júù.”'
  alternative: “ẹ ń pè ní ọba àwọn Júù”
  rationale: Gbólóhùn ὃν λέγετε fi ìtẹnumọ́ sí ohun tí “ẹ̀yin” ń sọ, ó sì pa ààyè ìbéèrè Pílátù àti ìyapa rẹ̀ sí akọ́lé náà mọ́ láìdá ìṣòro ẹ̀kọ́ ìsìn náà parí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò Yorùbá àdánidá mu; “Júù” ni ìkọ̀wé orúkọ àwọn ènìyàn náà.
