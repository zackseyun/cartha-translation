  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: yo
  text: Wọ́n sì fi ipá mú[b] ọkùnrin kan tí ó ń kọjá lọ, Símónì ará Kírénè, ẹni tí ó ń bọ̀ láti ìgbèríko[a], baba Alẹkisáńdà àti Rúfù, láti gbé àgbélébùú Jésù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti oko”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí oko tàbí ìgbèríko.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “fi ipá mú” ń tọ́ka sí fífi ẹnì kan ṣe iṣẹ́ àfipámúni.
    reason: cultural_note
  - marker: c
    text: Àwọn kan gbà pé igi ìfẹ̀gbẹ́ àgbélébùú ni a ní lọ́kàn ní pàtó, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà kàn sọ “àgbélébùú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: fi ipá mú
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí iṣẹ́ àfipámúni tàbí fífi ẹni kan sínú iṣẹ́ láìfẹ́ tirẹ̀; ‘fi ipá mú’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìfipámúni náà mọ́.
- source_word: παράγοντά τινα
  choice: ọkùnrin kan tí ó ń kọjá lọ
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ẹni kan tí ó kàn ń kọjá lọ, tí a kò sì kọ́kọ́ dá mọ̀; gbolohun yìí mú ìtumọ̀ àìdánimọ̀ àti bí ó ṣe wà ní ọ̀nà rẹ̀ jáde.
- source_word: Σίμωνα Κυρηναῖον
  choice: Símónì ará Kírénè
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní Yorùbá, a sì lo ‘ará Kírénè’ fún ìdánimọ̀ ibi tí ó ti wá.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: ẹni tí ó ń bọ̀ láti ìgbèríko
  rationale: ἀγρός lè túmọ̀ sí oko tàbí ìgbèríko. Nínú ìṣẹ̀lẹ̀ yìí, ‘láti ìgbèríko’ fi hàn pé ó ń wọlé láti ẹ̀yìn ìlú, láìfi dandan sọ pé ó ti inú oko kan pàtó wá.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: baba Alẹkisáńdérì àti Rúfù
  rationale: A pa ìdánimọ̀ àfikún nípa àwọn ọmọ Símónì mọ́ ní ọ̀nà ṣókí àti àdánidá.
- source_word: ἵνα ἄρῃ
  choice: láti gbé
  rationale: Lẹ́yìn ‘fi ipá mú,’ ọ̀rọ̀ ìdí ‘láti gbé’ jẹ́ Yorùbá àdánidá, ó sì sọ ète ìfipámúni náà kedere.
- source_word: σταυρὸν
  choice: àgbélébùú
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘àgbélébùú’ ní gbogbogbò, kì í ṣe ‘igi àgbélébùú apá’ ní pàtó; nítorí náà a kò mú ìtumọ̀ náà dín kù.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́; nínú àyíká ẹsẹ̀ náà, ó ń tọ́ka sí Jésù ní ti ẹ̀dá.
theological_decisions:
- issue: Irú ìmúni tí wọ́n fi kan Símónì
  choice: Wọ́n fi ipá mú Símónì láti gbé àgbélébùú náà.
  alternative: Wọ́n kàn bẹ̀ ẹ́ tàbí wọ́n yàn án fún iṣẹ́ náà láìsí ìfipámúni.
  rationale: ἀγγαρεύω ní ìtumọ̀ iṣẹ́ àfipámúni; ‘fi ipá mú’ kò rọ ìṣẹ̀lẹ̀ náà kù sí ìbéèrè lásán.
- issue: Ohun pàtó tí Símónì gbé
  choice: àgbélébùú
  alternative: igi àgbélébùú apá
  rationale: Bí ó tilẹ̀ jẹ́ pé àwọn àtúnyẹ̀wò ìtàn kan ń sọ pé igi apá àgbélébùú ni, σταυρός nínú ẹsẹ̀ yìí kò sọ ohun náà ní pàtó ju ‘àgbélébùú’ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá bá àdánidá mu, pẹ̀lú ìforúkọsílẹ̀ tí ó lọ́lá ṣùgbọ́n tí òǹkàwé òde òní lè lóye. A lo ‘ọkùnrin kan tí ó ń kọjá lọ’ dípò ọ̀rọ̀ àdàkọ líle, a sì pa àìdánilójú ἀγρός àti àìsọ pàtó σταυρός mọ́ nípasẹ̀ àwọn àlàyé ìsàlẹ̀.
