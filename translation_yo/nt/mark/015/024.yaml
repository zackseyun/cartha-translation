id: MRK.15.24
reference: Mark 15:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: yo
  text: Wọ́n sì kàn án mọ́ àgbélébùú, wọ́n sì pín aṣọ rẹ̀ láàárín ara wọn, wọ́n sì ṣẹ́ ìpín fún wọn láti mọ ohun tí olúkúlùkù yóò mú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ṣẹ́ ìpín lórí àwọn aṣọ náà láti mọ ẹni tí yóò gba èwo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: kàn án mọ́ àgbélébùú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pípa ènìyàn nípa kíkàn án mọ́ àgbélébùú. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí nínú Gíríìkì, àkókò tí ó ti kọjá ni Yorùbá máa ń lò lọ́nà àdánidá nínú ìtàn irú èyí.
- source_word: διαμερίζονται
  choice: pín ... láàárín ara wọn
  rationale: Èyí sọ pé wọ́n pín àwọn ohun náà sí ìpín tí ẹnì kọ̀ọ̀kan yóò gbà; ‘láàárín ara wọn’ mú ìtumọ̀ alájọpín náà hàn kedere.
- source_word: ἱμάτια
  choice: aṣọ
  rationale: ‘Aṣọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè tọ́ka sí àwọn ẹ̀wù tàbí ohun ìbora ara gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
- source_word: βάλλοντες κλῆρον
  choice: dìbò
  rationale: Nínú àyíká yìí, gbólóhùn Gíríìkì náà túmọ̀ sí lílo ìbò láti pinnu bí a ó ṣe pín ohun kan; ‘dìbò’ jẹ́ ìsọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἐπ’ αὐτὰ
  choice: lé wọn lórí
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àwọn aṣọ; ìtumọ̀ yìí pa àwòrán pé àwọn aṣọ ni wọ́n dìbò lé lórí mọ́.
- source_word: τίς τί ἄρῃ
  choice: láti mọ ohun tí olúkúlùkù yóò mú
  rationale: 'Èyí pa ìpín méjì τίς τί mọ́: ẹni tí yóò gba ohun kọ̀ọ̀kan àti ohun tí ẹni kọ̀ọ̀kan yóò mú.'
theological_decisions:
- issue: Àkókò ìsinsìnyí nínú ìtàn ìjìyà Jesu
  choice: 'Lo àkókò tí ó ti kọjá ní Yorùbá: ‘Wọ́n sì kàn án’'
  alternative: ‘Wọ́n sì ń kàn án’
  rationale: Ìsinsìnyí ìtàn inú Gíríìkì ń mú ìtàn náà yè kooro, ṣùgbọ́n Yorùbá àdánidá sábà máa ń sọ ìṣẹ̀lẹ̀ tí ó tẹ̀ lé ara wọn ní àkókò tí ó ti kọjá. ‘Ń kàn’ lè túmọ̀ sí ìṣe tí ó ń lọ lọ́wọ́, èyí tí kò ṣe dandan níhìn-ín; yíyan àkókò tí ó ti kọjá kò fi ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tí ó lọ́wọ́, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ‘àgbélébùú’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ohun tí wọ́n fi kan Jesu.
