  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: yo
  text: Nítorí ó mọ̀ pé ìlara ni ó mú kí àwọn olórí àlùfáà ti fi Jésù lé e lọ́wọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí owú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: ó mọ̀
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà ń fi ìmọ̀ Pílátù tí ó ti dúró ṣinṣin hàn; “ó mọ̀” ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: ὅτι
  choice: pé
  rationale: Ó bẹ̀rẹ̀ àkóónú ohun tí Pílátù mọ̀.
- source_word: διὰ φθόνον
  choice: ìlara ni ó mú kí
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ìdí; ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìlara mọ́ gẹ́gẹ́ bí ohun tí ó sún wọn ṣe é.
- source_word: παραδεδώκεισαν
  choice: fi ... lé ... lọ́wọ́
  rationale: Ó túmọ̀ sí fífi ẹnì kan lé aláṣẹ lọ́wọ́; àyíká ìdájọ́ kò béèrè ìtumọ̀ tó lágbára jù bí “dalẹ̀.” Ìṣe náà ti ṣẹlẹ̀ ṣáájú ìmọ̀ tí a sọ nípa rẹ̀.
- source_word: αὐτὸν
  choice: Jésù
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù. Lílo orúkọ rẹ̀ mú ìtọ́kasí náà ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú alufaa, kì í ṣe olórí àlùfáà kan ṣoṣo.
theological_decisions:
- issue: Ohun tí ó sún àwọn olórí àlùfáà fi Jésù lé Pílátù lọ́wọ́
  choice: Ẹsẹ náà sọ pé ìlara ló mú wọn ṣe bẹ́ẹ̀.
  alternative: Owú jíjẹ
  rationale: A pa ìdájọ́ Pílátù nípa èrò inú wọn mọ́ láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí mú un le ju ìtumọ̀ φθόνος lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Fi ... lé ... lọ́wọ́” bá àyíká ìdájọ́ mu, “àwọn olórí àlùfáà” sì ṣe kedere fún òǹkàwé lónìí.
