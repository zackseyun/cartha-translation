  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ ìtumọ̀ Gíríìkì wá dáadáa: γάρ jẹ́ “Nítorí,” ἐγίνωσκεν jẹ́ “ó mọ̀,” φθόνος jẹ́ “ìlara,” àti οἱ ἀρχιερεῖς jẹ́ “àwọn olórí àlùfáà.” Ṣùgbọ́n παραδεδώκεισαν jẹ́ pluperfect, nítorí náà “ti fi ... lé ... lọ́wọ́” yẹ kí ó hàn láti fi ìṣe tí ó ti ṣẹlẹ̀ ṣáájú ìmọ̀ Pílátù hàn.'
  naturalness: “Fi Jésù lé òun lọ́wọ́” lè yé ẹni, ṣùgbọ́n “fi Jésù lé e lọ́wọ́” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì ṣe kedere jù fún “hand him over to him.” “Nítorí owú” sì jẹ́ àṣàyàn àlàyé ẹsẹ̀ ìsàlẹ̀ tí ó dára jù “owú jíjẹ.”
  terminology: “Ìlara” dáa fún φθόνος; “owú” lè wà nínú àlàyé ẹsẹ̀ ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn. “Àwọn olórí àlùfáà” jẹ́ ìtumọ̀ boṣewa, tí ó yẹ fún ἀρχιερεῖς nínú àyíká yìí.
