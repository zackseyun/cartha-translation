revisions:
- from: Jósẹ́fù ará Arimatíà, ọ̀kan lára àwọn ọmọ ìgbìmọ̀ tí a bọ̀wọ̀ fún, ẹni tí òun fúnra rẹ̀ pẹ̀lú ń retí ìjọba Ọlọ́run, fi ìgboyà wọlé tọ Pílátù lọ, ó sì béèrè fún òkú Jésù.[a]
  to: Jósẹ́fù ará Arimatíà, ọmọ ìgbìmọ̀ kan tí a bọ̀wọ̀ fún, ẹni tí òun fúnra rẹ̀ pẹ̀lú ń retí ìjọba Ọlọ́run, wá, ó sì fi ìgboyà wọlé lọ bá Pílátù, ó sì béèrè fún ara Jésù.[a]
  rationale: Àtúnṣe náà mú ‘wá’ padà láti ṣojú ἐλθὼν, ó tún ṣe ìtumọ̀ εἰσῆλθεν πρὸς τὸν Πιλᾶτον ní Yorùbá tó rọrùn (‘wọlé lọ bá Pílátù’). A ṣàlàyé ìpò Jósẹ́fù ní ọ̀nà tí kò ní ìdààmú, a sì lo ‘ara Jésù’ fún σῶμα ní ọ̀rọ̀ pàtàkì, pẹ̀lú ‘òkú Jésù’ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
