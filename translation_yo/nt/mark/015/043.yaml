id: MRK.15.43
reference: Mark 15:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: yo
  text: Jósẹ́fù ará Arimatíà, ọmọ ìgbìmọ̀ kan tí a bọ̀wọ̀ fún, ẹni tí òun fúnra rẹ̀ pẹ̀lú ń retí ìjọba Ọlọ́run, wá, ó sì fi ìgboyà wọlé lọ bá Pílátù, ó sì béèrè fún ara Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òkú Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: wọlé tọ ... lọ
  rationale: Ìtumọ̀ wíwá rẹ̀ ni a ṣopọ̀ mọ́ ìṣe lílọ wọlé sí ọ̀dọ̀ Pílátù, kí gbolohun Yorùbá lè ṣàn láìṣe àtúnṣe ọ̀rọ̀ ìrìn-àjò.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: ará Arimatíà
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ ibi tí ẹni kan ti wá, ó sì pa ìtumọ̀ ἀπό mọ́.
- source_word: εὐσχήμων
  choice: tí a bọ̀wọ̀ fún
  rationale: Ó fi ipò ọlá àti iyì rẹ̀ hàn ní èdè tí òǹkàwé òde òní lè lóye; ‘olókìkí’ tàbí ‘ọlọ́lá’ tún ṣeé ṣe.
- source_word: βουλευτής
  choice: ọ̀kan lára àwọn ọmọ ìgbìmọ̀
  rationale: Ó túmọ̀ sí ọmọ ẹgbẹ́ ìgbìmọ̀ kan láìfi kún un pé Sàńhẹ́dírìn ni, nítorí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò dárúkọ rẹ̀.
- source_word: ὃς καὶ αὐτὸς
  choice: ẹni tí òun fúnra rẹ̀ pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ καὶ αὐτός mọ́ pé Jósẹ́fù fúnra rẹ̀ náà ní ìrètí yìí.
- source_word: ἦν προσδεχόμενος
  choice: ń retí
  rationale: Àmì ‘ń’ fi ipò ìrètí tí ó ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ìtumọ̀ tààrà, tí ó wọ́pọ̀, tí ó sì pa gbólóhùn pàtàkì inú Ìhìn Rere mọ́.
- source_word: τολμήσας
  choice: fi ìgboyà
  rationale: Ó gbé ìgboyà Jósẹ́fù láti tọ Pílátù lọ jáde, bí ọ̀rọ̀ Gíríìkì ṣe ṣe.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: wọlé tọ Pílátù lọ
  rationale: Ó pa ìtumọ̀ wíwọlé àti sísún mọ́ Pílátù mọ́ ní ọ̀nà tí ó bá Yorùbá mu.
- source_word: ᾐτήσατο
  choice: béèrè fún
  rationale: Ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìbéèrè ohun kan mu.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: òkú Jésù
  rationale: Ní àyíká ikú àti ìsìnkú, ‘òkú Jésù’ jẹ́ Yorùbá àdánidá fún ara ẹni tí ó ti kú; ‘ara Jésù’ jẹ́ ìtumọ̀ tó sún mọ́ ìrísí Gíríìkì.
theological_decisions:
- issue: Ìdánimọ̀ βουλευτής
  choice: ọmọ ìgbìmọ̀
  alternative: ọmọ ìgbìmọ̀ Sàńhẹ́dírìn
  rationale: Àyíká lè tọ́ka sí ìgbìmọ̀ àwọn Júù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò dárúkọ Sàńhẹ́dírìn ní pàtó; a kò fi àlàyé ìtàn kún ọ̀rọ̀.
- issue: Agbára τολμήσας
  choice: fi ìgboyà
  alternative: nígbà tí ó ti pinnu láti ṣe ohun tí ó lewu
  rationale: ‘Fi ìgboyà’ fi ewu àti ìgboyà ìṣe náà hàn láìṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìtumọ̀ σῶμα lẹ́yìn ikú
  choice: òkú Jésù
  alternative: ara Jésù
  rationale: Mejèèjì ṣeé ṣe; ‘òkú’ jẹ́ ọ̀nà Yorùbá àdánidá ní àyíká ìsìnkú, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ tó sún mọ́ fọ́ọ̀mù Gíríìkì hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ará Arimatíà’ gẹ́gẹ́ bí ìfihàn ìbílẹ̀, a sì pa ìtẹnumọ́ ‘òun fúnra rẹ̀ pẹ̀lú’ àti ìgboyà Jósẹ́fù mọ́. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó kan.
