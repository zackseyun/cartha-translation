review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìdánimọ̀ Jósẹ́fù, ipò rẹ̀ gẹ́gẹ́ bí βουλευτής, ìrètí rẹ̀ nípa ìjọba Ọlọ́run, àti ìgboyà rẹ̀ mọ́ dáadáa. Ṣùgbọ́n a yẹ kí ἐλθὼν (‘wá’) hàn nínú ọ̀rọ̀ pàtàkì, kì í ṣe kí a gbé e kúrò pátápátá. ‘Ara Jésù’ sì sún mọ́ τὸ σῶμα τοῦ Ἰησοῦ ju ‘òkú Jésù’ lọ, bí ó tilẹ̀ jẹ́ pé ìgbẹ̀yìn jẹ́ ọ̀nà Yorùbá tí ó ṣeé lò nínú àyíká ìsìnkú.
  naturalness: ‘Fi ìgboyà wọlé tọ Pílátù lọ’ kò rọrùn nínú Yorùbá òde òní. Ìṣètò ‘wá, ó sì fi ìgboyà wọlé lọ bá Pílátù’ ń pa ìṣísẹ̀ méjèèjì mọ́, ó sì jẹ́ ìsọ̀rọ̀ adayeba. ‘Ọmọ ìgbìmọ̀ kan tí a bọ̀wọ̀ fún’ tún ṣe kedere pé Jósẹ́fù ni a bọ̀wọ̀ fún, kì í ṣe gbogbo àwọn ọmọ ìgbìmọ̀.
  terminology: ‘Ìjọba Ọlọ́run’ jẹ́ ìtumọ̀ ìbílẹ̀, tó mọ́gbọ́n dání, fún βασιλεία τοῦ θεοῦ. A kò sọ pé ìgbìmọ̀ náà ni Sàńhẹ́dírìn, nítorí Gíríìkì kò dárúkọ rẹ̀. ‘Ara Jésù’ dá ìtumọ̀ σῶμα dúró, nígbà tí àlàyé ìsàlẹ̀ ń fúnni ní ‘òkú Jésù’ gẹ́gẹ́ bí àṣàyàn Yorùbá.
  issues:
  - severity: medium
    issue: A ti mú ἐλθὼν (‘wá’) kúrò nínú ọ̀rọ̀ pàtàkì.
    rationale: Bí ‘wọlé’ ṣe ní ìṣísẹ̀ nínú ara rẹ̀, ó kò sọ ìṣe ‘wíwá’ tí participle Gíríìkì náà ṣàfikún ní kedere. A lè pa á mọ́ láìjẹ́ kí gbolohun náà wuwo.
  - severity: medium
    issue: ‘Fi ìgboyà wọlé tọ Pílátù lọ’ kò dáa ní ìṣètò Yorùbá.
    rationale: Àpapọ̀ ‘wọlé tọ ... lọ’ kì í ṣàn lọ́nà adayeba. ‘Wọlé lọ bá Pílátù’ ń sọ ìwọlé sí iwájú Pílátù ní kedere.
  - severity: low
    issue: ‘Ọ̀kan lára àwọn ọmọ ìgbìmọ̀ tí a bọ̀wọ̀ fún’ lè jẹ́ aláìmọ́ ẹni tí a bọ̀wọ̀ fún.
    rationale: Ó lè dà bí ẹni pé àwọn ọmọ ìgbìmọ̀ náà lápapọ̀ ni a bọ̀wọ̀ fún. ‘Ọmọ ìgbìmọ̀ kan tí a bọ̀wọ̀ fún’ jẹ́ kedere.
  - severity: low
    issue: ‘Òkú Jésù’ jẹ́ ìtumọ̀ tó dín ìfaramọ́ σῶμα kù nínú ọ̀rọ̀ pàtàkì.
    rationale: σῶμα ni ‘ara’; ‘òkú’ jẹ́ àṣàyàn adayeba nínú àyíká ikú, ó yẹ sí àlàyé ìsàlẹ̀ dípò ọrọ̀ pàtàkì.
