  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn náà sì gòkè wá, wọ́n sì bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀ pé kí ó ṣe fún wọn gẹ́gẹ́ bí ó ti máa ń ṣe tẹ́lẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní títúmọ̀ ọ̀rọ̀ náà ní ọ̀nà tó tẹ̀ lé ìṣètò Gíríìkì pẹkipẹki: “Ọ̀pọ̀ ènìyàn náà, nígbà tí wọ́n gòkè wá, bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀ gẹ́gẹ́ bí ó ti máa ń ṣe fún wọn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: gòkè wá
  rationale: Aorist participle ἀναβαίνω ń tọ́ka sí gíga lọ tàbí wíwọ ibi kan lọ; “gòkè wá” pa ìṣípò wọn mọ́ ní èdè Yorùbá àdánidá.
- source_word: ὁ ὄχλος
  choice: ogunlọ́gọ̀ náà
  rationale: ὄχλος túmọ̀ sí àwùjọ tàbí ọ̀pọ̀ ènìyàn; “ogunlọ́gọ̀ náà” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì bá ìṣẹ̀lẹ̀ náà mu.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: wọ́n sì bẹ̀rẹ̀ sí í béèrè
  rationale: Àkópọ̀ ἄρχομαι àti infinitive túmọ̀ sí bẹ̀rẹ̀ sí í ṣe ohun kan; αἰτέω níbí ni béèrè tàbí tọrọ̀.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: καθώς túmọ̀ sí “gẹ́gẹ́ bí” tàbí “gan-an gẹ́gẹ́ bí,” ó sì so ìbéèrè wọn pọ̀ mọ́ àṣà Pilatu tẹ́lẹ̀ láì sọ ohun tí wọ́n béèrè ní kíkún.
- source_word: ἐποίει
  choice: ó ti máa ń ṣe tẹ́lẹ̀
  rationale: Imperfect náà ní agbára ìṣe àṣà ní àkókò tó kọjá; “máa ń ṣe tẹ́lẹ̀” mú ìtumọ̀ ìṣe tí ó sábà máa ń ṣe jáde.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dative náà jẹ́ aláǹfààní ní àyíká yìí, nítorí náà “fún wọn” dára ju “sí wọn” lọ.
