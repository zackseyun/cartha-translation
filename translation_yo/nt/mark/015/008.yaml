translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A lo “wọ́n” fún “ogunlọ́gọ̀” nítorí pé ó jẹ́ àkójọpọ̀ ènìyàn. A fi “pé kí ó ṣe” hàn gẹ́gẹ́ bí àfikún tí gírámà Yorùbá ń béèrè, ṣùgbọ́n a kò sọ ohun tí Pilatu yóò ṣe ní pàtó, kí àìsọ-kedere inú Gíríìkì lè dúró.
