  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: yo
  text: Wọ́n sì ń fún un ní wáìnì tí a fi òjíá pò,[a] ṣùgbọ́n òun kò gbà á.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì ń fi wáìnì tí a fi òjíá pò fún un.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gidi, Gíríìkì lo gbólóhùn tó dà bí “ẹni náà ṣùgbọ́n,” láti tún tọ́ka sí Jésù: “ṣùgbọ́n òun kò gbà á.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: wọ́n ń fún un
  rationale: Àìpé (imperfect) náà fi ìṣe tí ó ń lọ lọ́wọ́ tàbí ìgbìyànjú hàn; ‘ń fún un’ pa ìrísí yìí mọ́ ju ọ̀rọ̀ àkókò tí ó ti kọjá lásán lọ.
- source_word: ἐσμυρνισμένον οἶνον
  choice: wáìnì tí a fi òjíá pò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wáìnì tí a ti pèsè pẹ̀lú òjíá; gbólóhùn yìí ṣe kedere, ó sì sọ ohun tí a dà pọ̀ mọ́ ọn ní tààrà.
- source_word: ὃς δὲ
  choice: ṣùgbọ́n òun
  rationale: Bí ó tilẹ̀ jẹ́ pé ὃς jẹ́ arọ́pò-orúkọ ìbátan ní ìrísí rẹ̀, níbí ó tún tọ́ka sí Jésù; ‘ṣùgbọ́n òun’ jẹ́ Yorùbá àdánidá, ó sì pa agbára ìtakora díẹ̀ ti δέ mọ́.
- source_word: ἔλαβεν
  choice: kò gbà á
  rationale: λαμβάνω lè túmọ̀ sí ‘gbà’ tàbí ‘mú.’ Nínú àyíká yìí, ‘kò gbà á’ sọ pé Jésù kò gba ohun mímu náà láìfi ìdí tí kò fi gbà á kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìdí tí Jésù kò fi gba ohun mímu náà
  choice: 'A ṣe àpèjúwe ìṣe náà nìkan: ‘òun kò gbà á.’'
  alternative: Láti sọ pé ó kọ oògùn amúnilára tí a fẹ́ fi dín ìrora kù, tàbí pé ó kọ ohun mímu àṣà kan fún ìdí mìíràn.
  rationale: Ẹsẹ̀ náà kò sọ ìdí tí Jésù kò fi gba wáìnì náà; ìtumọ̀ kò gbọdọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí ìròyìn tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá jẹ́ àdánidá; ọ̀rọ̀ náà jẹ́ ti òde òní, kedere, ó sì ní ọlá. ‘Wáìnì’ ni a lò fún οἶνος, ‘òjíá’ sì ni a lò fún μύρρα. A yà àmì àlàyé [a] sí ọ̀rọ̀ àdàpọ̀ wáìnì àti òjíá, [b] sì sí ìṣètò ὃς δὲ.
