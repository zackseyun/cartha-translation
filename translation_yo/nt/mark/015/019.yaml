id: MRK.15.19
reference: Mark 15:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: yo
  text: Wọ́n sì ń fi ọ̀pá esùsú lu orí rẹ̀, wọ́n ń tutọ́ sí i, wọ́n sì ń kúnlẹ̀, wọ́n ń tẹrí bá fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń jọ́sìn fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “tẹrí bá níwájú,” “fi ọlá fún,” tàbí “jọ́sìn”; ṣùgbọ́n níbí, ó ṣàpèjúwe bí àwọn ọmọ-ogun ṣe ń fi ẹ̀gàn ṣe àfarawé ọlá tí a máa ń fi fún ọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: ń ... lu
  rationale: Àkókò imperfect fi hàn pé ìṣe náà ń bá a lọ tàbí pé wọ́n ṣe é léraléra; ‘ń ... lu’ mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: orí rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi hàn pé orí tirẹ̀ ni.
- source_word: καλάμῳ
  choice: pẹ̀lú ọ̀pá esùsú
  rationale: κάλαμος túmọ̀ sí esùsú tàbí ọ̀pá tí a ṣe bí esùsú; ‘ọ̀pá esùsú’ jẹ́ kó ṣe kedere pé ohun tí wọ́n fi ń lù ú ni.
- source_word: ἐνέπτυον αὐτῷ
  choice: wọ́n ń tutọ́ sí i
  rationale: ‘Ń tutọ́ sí i’ pa ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τιθέντες τὰ γόνατα
  choice: wọ́n ń kúnlẹ̀
  rationale: Gbólóhùn Gíríìkì náà jẹ́ àpólà ọ̀rọ̀ fún kíkúnlẹ̀; ìtumọ̀ tààrà àti àdánidá rẹ̀ ní Yorùbá ni ‘kúnlẹ̀.’
- source_word: προσεκύνουν αὐτῷ
  choice: wọ́n ń tẹrí ba fún un
  rationale: προσκυνέω lè tọ́ka sí títẹrí ba, fífi ọlá fún, tàbí jíjọ́sìn. Nínú àyíká ẹ̀gàn yìí, ‘tẹrí ba fún un’ pa ìṣe ìbọ̀wọ̀ ti ọba tí wọ́n ń ṣe ní ẹ̀gàn mọ́ láì sọ pé ìjọ́sìn tòótọ́ ni.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω nínú àyíká ẹ̀gàn
  choice: tẹrí ba fún un
  alternative: jọ́sìn fún un
  rationale: Àyíká náà fi hàn pé àwọn ọmọ-ogun ń ṣe àfarawé ọlá ọba láti fi ṣẹ̀sín, kì í ṣe pé wọ́n ń ṣe ìjọ́sìn tọkàntọkàn. Àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn ìtumọ̀ ‘jọ́sìn’ mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A lo ìṣètò ‘ń’ léraléra láti pa ipa imperfect Gíríìkì mọ́.
