id: MRK.7.3
reference: Mark 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: yo
  text: Nítorí àwọn Farisí àti gbogbo àwọn Júù kì í jẹun àyàfi tí wọ́n bá fi ìkùnwọ́[a] fọ ọwọ́ wọn, ní títẹ̀lé àṣà àwọn àgbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìkùnwọ́”; ó lè túmọ̀ sí “títí dé ibi tí ọwọ́ ti so mọ́ apá” tàbí “dáadáa.” Ọ̀rọ̀ Gíríìkì náà ṣòro láti túmọ̀, ó sì ṣeé ṣe kí ó tọ́ka sí ọ̀nà àṣà fífọ ọwọ́ fún ìwẹ̀nù.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àlàyé àfikún sí ohun tí ó ṣáájú.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ tí a sábà máa ń lò ní Yorùbá fún ẹgbẹ́ Júù yìí.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: gbogbo àwọn Júù
  rationale: Ó pa gbólóhùn gbooro inú Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí àwọn ará Jùdíà nìkan.
- source_word: ἐὰν μὴ
  choice: àyàfi tí ... bá
  rationale: Ọ̀nà Yorùbá àdánidá fún àdéhùn aláìní, ‘unless.’
- source_word: πυγμῇ
  choice: fi ìkùnwọ́
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì tí ó ṣòro yìí ní pẹkipẹki, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ míì tí ó ṣeé ṣe mọ́.
- source_word: νίψωνται τὰς χεῖρας
  choice: fọ ọwọ́ wọn
  rationale: Ìtumọ̀ Yorùbá tí ó ṣe kedere fún fífọ apá ara, níbí yìí ọwọ́.
- source_word: οὐκ ἐσθίουσιν
  choice: kì í jẹun
  rationale: Ó fi ìṣe tí wọ́n máa ń ṣe déédéé hàn ní Yorùbá àdánidá.
- source_word: κρατοῦντες
  choice: ní mímú ... mú ṣinṣin
  rationale: Ó sọ ìfaramọ́ wọn sí àṣà náà, kì í ṣe pé wọ́n mọ̀ ọ́n lásán.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: àṣà àtọwọ́dọ́wọ́ àwọn àgbà
  rationale: ‘Àṣà àtọwọ́dọ́wọ́’ fi ohun tí a jogún láti ọ̀dọ̀ àwọn àgbà hàn ní kedere.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn ‘gbogbo àwọn Júù’
  choice: A pa ‘gbogbo àwọn Júù’ mọ́ gẹ́gẹ́ bí àlàyé gbooro ti Máàkù.
  alternative: gbogbo àwọn ará Jùdíà; ọ̀pọ̀ àwọn Júù
  rationale: Gíríìkì sọ ‘gbogbo àwọn Júù’ ní tààrà; a kò yẹ kí ìtumọ̀ dín un kù, bí ó tilẹ̀ jẹ́ pé ó jẹ́ ọ̀nà àsọyé gbooro, kì í ṣe ìṣirò ẹnì kọ̀ọ̀kan.
- issue: Ìtumọ̀ πυγμῇ
  choice: fi ìkùnwọ́, pẹ̀lú àmì àlàyé
  alternative: títí dé ọwọ́-ọwọ́; dáadáa; ní ìṣọ́ra
  rationale: Ọ̀rọ̀ náà ní àríyànjiyàn nípa ọ̀nà tàbí ìwọ̀n fífọ ọwọ́. Ìtumọ̀ gangan jù lọ wà nínú ọ̀rọ̀, àwọn àṣàyàn míì sì wà ní àlàyé, kí a má ṣe yanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ‘kì í’ fún ìṣe àṣà déédéé, ‘àṣà àtọwọ́dọ́wọ́’ fún παράδοσις, a sì pa àìdánilójú πυγμῇ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ewé.
