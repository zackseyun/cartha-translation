  to: Nítorí àwọn Farisí àti gbogbo àwọn Júù kì í jẹun àyàfi tí wọ́n bá fi ìkùnwọ́[a] fọ ọwọ́ wọn, ní títẹ̀lé àṣà àwọn àgbà.
