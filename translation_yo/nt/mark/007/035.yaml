  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: yo
  text: Àwọn etí rẹ̀ sì ṣí sílẹ̀[a], ìdè ahọ́n rẹ̀ sì tú[b], ó sì ń sọ̀rọ̀ dáradára[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “agbára ìgbọ́ rẹ̀ ṣí sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí tàbí sí agbára láti gbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ìdè ahọ́n rẹ̀ tú”; ìyẹn ni pé, ohun tí ń dí ọ̀rọ̀ sísọ rẹ̀ lọ́wọ́ kúrò.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ọ̀nà tí ó tọ́” tàbí “ní kedere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: ṣí sílẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive plural. “Ṣí sílẹ̀” fi hàn pé ìdènà náà kúrò lójijì, ó sì bá àwòrán ọ̀rọ̀ Gíríìkì mu ní èdè Yorùbá àdánidá.
- source_word: αἱ ἀκοαί
  choice: àwọn etí rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí gẹ́gẹ́ bí ẹ̀yà ara tàbí sí agbára ìgbọ́ràn. “Àwọn etí rẹ̀” jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ olókìkí plural náà mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
- source_word: ἐλύθη
  choice: tú
  rationale: Aorist passive ti λύω ni. Nínú Yorùbá, “ìdè … tú” jẹ́ ọ̀nà kedere, àdánidá láti sọ pé ohun tí ó dè é ti tú, láìsọ ọ́ di ọ̀rọ̀ ìṣègùn.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: ìdè ahọ́n rẹ̀
  rationale: Èyí pa àwòrán gidi ti δεσμός—ìdè tàbí ohun ìdènà—mọ́, dípò fífi ìtumọ̀ àlàyé bí “ìṣòro ọ̀rọ̀ sísọ” sínú ẹsẹ̀ náà.
- source_word: ἐλάλει
  choice: ó sì ń sọ̀rọ̀
  rationale: Imperfect náà lè fi ìṣe tí ń lọ lọ́wọ́ hàn. “Ń sọ̀rọ̀” sọ pé agbára ọ̀rọ̀ sísọ rẹ̀ ti padà, láìfi ìtumọ̀ “ó bẹ̀rẹ̀” kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó.
- source_word: ὀρθῶς
  choice: lọ́nà tí ó tọ́
  rationale: ὀρθῶς túmọ̀ sí ní ọ̀nà tí ó tọ́, dáradára, tàbí kedere. Nínú àyíká ìwòsàn yìí, gbolohun náà fi hàn pé ó lè sọ̀rọ̀ bí ó ti yẹ, láìdín ìtumọ̀ náà kù sí gírámà tàbí ìwà rere.
theological_decisions:
- issue: Bóyá kí a pa àwòrán “ìdè ahọ́n” mọ́ tàbí kí a túmọ̀ rẹ̀ sí ìṣòro ọ̀rọ̀ sísọ ní tààrà
  choice: 'Pa àwòrán náà mọ́: “ìdè ahọ́n rẹ̀ sì tú”'
  alternative: “ìṣòro ọ̀rọ̀ sísọ rẹ̀ sì kúrò” tàbí “ahọ́n rẹ̀ sì gba òmìnira”
  rationale: Orísun Gíríìkì lo àwòrán ìdè, kì í ṣe ọ̀rọ̀ ìṣègùn. Pípa àwòrán náà mọ́ ń jẹ́ kí iṣẹ́ ìwòsàn náà hàn gbangba láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí ìtumọ̀ tí ó ju ohun tí ẹsẹ̀ sọ lọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. Gbólóhùn náà tẹ̀ lé ìṣọ̀kan àwọn abala mẹ́ta inú Gíríìkì pẹ̀lú “sì,” ó sì pa àwòrán ìdè ahọ́n mọ́. Àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
