  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: yo
  text: Ṣùgbọ́n lásán ni wọ́n ń jọ́sìn mí, nípa kíkọ́ àwọn àṣẹ ènìyàn gẹ́gẹ́ bí ẹ̀kọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: lásán
  rationale: Ó túmọ̀ sí pé ìjọ́sìn náà kò ní èrè tàbí ìmúṣẹ; ‘lásán’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìbáwí àsọtẹ́lẹ̀ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora hàn sí ọlá ètè tí ẹsẹ tó ṣáájú mẹ́nu kàn, nígbà tí ọkàn wọn jìnnà sí Ọlọ́run.
- source_word: σέβονταί με
  choice: wọ́n ń jọ́sìn mí
  rationale: σέβομαι níbí tọ́ka sí ìbọ̀wọ̀ tàbí ìjọ́sìn sí Ọlọ́run; ‘jọ́sìn’ ni ọ̀rọ̀ tó ṣe kedere jù lọ nínú àyọlò yìí.
- source_word: διδάσκοντες
  choice: bí wọ́n ti ń kọ́ni
  rationale: A pa ìṣe alábàáṣiṣẹ́ participle náà mọ́ gẹ́gẹ́ bí ọ̀nà tàbí ìwà tí ìjọ́sìn asán wọn gbà ń hàn.
- source_word: διδασκαλίας
  choice: bí ẹ̀kọ́
  rationale: 'Ó mú ìbáṣepọ̀ apposition-like pẹ̀lú ἐντάλματα yé ni Yorùbá: wọ́n gbé àṣẹ ènìyàn kalẹ̀ ní ipò ẹ̀kọ́ àṣẹ.'
- source_word: ἐντάλματα ἀνθρώπων
  choice: àwọn àṣẹ ènìyàn
  rationale: ‘Àṣẹ’ pa ìtumọ̀ ohun tí a pàṣẹ mọ́, ‘ènìyàn’ sì fi orísun rẹ̀ hàn láì sọ pé àwọn ọkùnrin nìkan ni.
theological_decisions:
- issue: Ìtakora láàárín ìjọ́sìn sí Ọlọ́run àti fífi àṣẹ ènìyàn ṣe ẹ̀kọ́ àṣẹ
  choice: bí wọ́n ti ń kọ́ni ní àwọn àṣẹ ènìyàn bí ẹ̀kọ́
  alternative: wọ́n ń kọ́ ẹ̀kọ́ tí í ṣe àṣẹ ènìyàn
  rationale: 'Àṣàyàn náà jẹ́ kí kókó Gíríìkì tó há pọ̀ yé: àṣẹ tó wá láti ọ̀dọ̀ ènìyàn ni wọ́n ń gbé kalẹ̀ bí ẹ̀kọ́. Ó pa ìbáwí ẹ̀sìn náà mọ́ láì fi èrò ẹ̀kọ́ ìjọ kan kun un.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Àwọn àṣẹ ènìyàn’ yẹra fún ìtumọ̀ akọ nìkan, ó sì pa ìtakora láàárín ohun Ọlọ́run àti ohun ènìyàn mọ́.
