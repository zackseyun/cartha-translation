source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: yo
  text: Ó sì gbé ojú sókè sí ọ̀run, ó mí ìmí jinlẹ̀, ó sì sọ fún un pé, “Ẹfata,” èyí tí ó túmọ̀ sí, “Ṣí sílẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: gbé ojú sókè
  rationale: Ó fi ìṣe gbígbé ojú sókè hàn ní èdè Yorùbá àdánidá, gẹ́gẹ́ bí participle aorist tó ṣáájú ìṣe pàtàkì.
- source_word: εἰς τὸν οὐρανόν
  choice: sí ọ̀run
  rationale: Nínú àyíká yìí, ọ̀run ni ó bá ìfarahàn bí àdúrà mu ju ojú-ọ̀run lasán lọ.
- source_word: ἐστέναξεν
  choice: ó kérora
  rationale: ‘Kérora’ lè sọ ìmí jinlẹ̀ tàbí ìró ìbànújẹ́ tí στενάζω ń tọ́ka sí, láì fi agbára ìmọ̀lára tí ọ̀rọ̀ Gíríìkì kò dájú kún un.
- source_word: λέγει αὐτῷ
  choice: ó sì sọ fún un pé
  rationale: A tú historical present náà sí àkókò àtẹ̀yìnwá fún ìtàn Yorùbá tó ń ṣàn dáadáa, a sì pa ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: Εφφαθα
  choice: Ẹfata
  rationale: A pa ọ̀rọ̀ Árámáíkì tí Máàkù fúnra rẹ̀ kọ ní ìtumọ̀-ohùn mọ́, pẹ̀lú àkọtọ̀ tó bá èdè Yorùbá mu.
- source_word: Διανοίχθητι
  choice: Ṣí sílẹ̀
  rationale: Ó jẹ́ àṣẹ aláìṣe sí ẹni kan; ‘Ṣí sílẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìrísí passive ‘Be opened’ mọ́.
theological_decisions:
- issue: Ẹni tí αὐτῷ ń tọ́ka sí
  choice: fún un—ọkùnrin adití náà
  alternative: sí etí tàbí agbára ọ̀rọ̀ rẹ̀ lọ́nà àfiwé
  rationale: Dative Gíríìkì náà tọ́ka sí ọkùnrin náà lọ́nà tó ṣeé ṣe jù, bí ó tilẹ̀ jẹ́ pé àṣẹ náà kan ṣíṣí àwọn ẹ̀yà ara rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye; a lo àmì ohùn ní kíkún níbi tó bá yẹ. A pa ọ̀rọ̀ Árámáíkì mọ́, a sì jẹ́ kí àlàyé Máàkù tẹ̀ lé e. A kò fi àlàyé ìjọ tàbí ẹ̀kọ́ ẹ̀sìn kan kún ọ̀rọ̀ náà.
