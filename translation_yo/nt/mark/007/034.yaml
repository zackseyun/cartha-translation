  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ pàtàkì Gíríìkì dáadáa: gbígbé ojú sókè sí ọ̀run, sísọ fún ọkùnrin náà, àti pípa ọ̀rọ̀ Árámáíkì náà mọ́. Ṣùgbọ́n “ó kérora” kì í ṣe ìbámu tó pé fún ἐστέναξεν nínú àyíká yìí; ó sábà ń túmọ̀ sí ẹ̀dùn-ọkàn tàbí ìkùnàkùnà. “Ó mí ìmí jinlẹ̀” ń fi ìró ẹ̀mí ìbànújẹ́/tàbí ìrònú tí ọ̀rọ̀ Gíríìkì náà ń sọ hàn dáadáa.'
