  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: yo
  text: àwọn ìṣe panṣágà, ojúkòkòrò, àwọn ìwà búburú, ẹ̀tàn, ìwà ìbàjẹ́ aláìnítìjú, ojú búburú[a], ọ̀rọ̀ ẹ̀gàn[b], ìgbéraga àti àìgbọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìlara” tàbí “ojú tí kò fẹ́ kí ẹlòmíràn rí rere.” Ní ti gidi, “ojú búburú”; àkànlò èdè ni fún ojú ìlara tàbí èrò ibi sí ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìbanilórúkọjẹ́” tàbí “ọ̀rọ̀-òdì sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ ẹ̀gàn sí ènìyàn tàbí sí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: àwọn ìṣe panṣágà
  rationale: Ọ̀pọ̀ nọ́ńbà Gíríìkì náà tọ́ka sí àwọn ìṣe panṣágà; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀pọ̀ náà mọ́.
- source_word: πλεονεξίαι
  choice: ojúkòkòrò
  rationale: Ó túmọ̀ sí ìfẹ́ oníwọra láti ní púpọ̀ sí i tàbí láti gba ohun ẹlòmíràn; ‘ojúkòkòrò’ ṣe kedere ní Yorùbá òde òní.
- source_word: πονηρίαι
  choice: àwọn ìwà búburú
  rationale: Ọ̀pọ̀ nọ́ńbà inú Gíríìkì ni a fi hàn ní ọ̀nà Yorùbá tí ó wọ́pọ̀, láìlo ọ̀rọ̀ àjèjì tàbí gbólóhùn tí kò dùn mọ́ etí.
- source_word: δόλος
  choice: ẹ̀tàn
  rationale: ‘Ẹ̀tàn’ sọ ìṣe fífi ète tan ẹlòmíràn ní ṣókí, ó sì bá àkójọ àwọn ìwà burúkú mu.
- source_word: ἀσέλγεια
  choice: ìwà ìbàjẹ́ aláìnítìjú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìwà búburú tí a ń hù láìní ìtìjú tàbí ìjánu, ní ọ̀pọ̀ ìgbà nípa ìbálòpọ̀; yíyan yìí pa agbára ìtumọ̀ rẹ̀ mọ́.
- source_word: ὀφθαλμὸς πονηρός
  choice: ojú búburú
  rationale: A pa àwòrán ojú inú gbólóhùn Gíríìkì náà mọ́, nígbà tí àlàyé ìtumọ̀ àkànlò èdè rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: βλασφημία
  choice: ọ̀rọ̀ ẹ̀gàn
  rationale: Yíyan gbòòrò yìí lè kan ọ̀rọ̀ aburú sí ènìyàn tàbí ẹ̀gàn sí Ọlọ́run, nítorí náà kò fi tipátipá yan ọ̀kan nínú ìtumọ̀ méjèèjì.
- source_word: ὑπερηφανία
  choice: ìgbéraga
  rationale: ‘Ìgbéraga’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún fífi ara ẹni ga àti ìwà agbéraga.
- source_word: ἀφροσύνη
  choice: àìgbọ́n
  rationale: Ó tọ́ka sí àìní ọgbọ́n nípa ìwà àti ìṣe, kì í ṣe pé agbára ọpọlọ ẹni kéré lásán; ‘àìgbọ́n’ pa ìyàtọ̀ yìí mọ́.
theological_decisions:
- issue: Ìtumọ̀ βλασφημία nínú àkójọ àwọn ìwà búburú
  choice: ọ̀rọ̀ ẹ̀gàn
  alternative: ìbanilórúkọjẹ́; ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ìpalára sí ènìyàn tàbí ọ̀rọ̀ ẹ̀gàn sí Ọlọ́run. ‘Ọ̀rọ̀ ẹ̀gàn’ jẹ́ kí ìtumọ̀ méjèèjì ṣí sílẹ̀, àlàyé ìsàlẹ̀ sì sọ àìdánilójú náà ní kedere.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó lọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àkójọ náà pa ìṣísẹ̀ ọ̀rọ̀ orísun mọ́, ó sì lo ‘àwọn’ níbi tí ọ̀pọ̀ nọ́ńbà Gíríìkì ṣe pàtàkì. A gbe àmì [a] lẹ́yìn ‘ojú búburú’ àti [b] lẹ́yìn ‘ọ̀rọ̀ ẹ̀gàn’ kí wọ́n lè bá àlàyé tí wọ́n tọ́ka sí mu.
