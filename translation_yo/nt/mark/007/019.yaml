id: MRK.7.19
reference: Mark 7:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: yo
  text: nítorí pé kò wọ inú ọkàn rẹ̀, bí kò ṣe inú ikùn rẹ̀, ó sì jáde lọ sí ilé ìgbọ̀nsẹ̀”—nípa bẹ́ẹ̀, ó ń sọ gbogbo oúnjẹ di mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa bẹ́ẹ̀, ó ń mú gbogbo oúnjẹ jáde,” bí a bá ka gbólóhùn ìkẹyìn gẹ́gẹ́ bí àpèjúwe iṣẹ́ ìjẹ-ounjẹ nínú ara, dípò gẹ́gẹ́ bí àlàyé Márkù.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: ọkàn
  rationale: Ọ̀rọ̀ yìí pa àwòrán Bíbélì mọ́ nípa ọkàn gẹ́gẹ́ bí inú ẹni, ó sì mú ìyàtọ̀ rẹ̀ sí ẹ̀yà tí ń da oúnjẹ pọ̀ hàn láì túmọ̀ rẹ̀ ju bí ó ti yẹ lọ.
- source_word: κοιλίαν
  choice: ikùn
  rationale: “Inú ikùn” jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí ibi tí oúnjẹ ń lọ nínú ara, ó sì bá àyíká ọ̀rọ̀ nípa dídá oúnjẹ pọ̀ mu.
- source_word: ἀφεδρῶνα
  choice: ilé ìgbọ̀nsẹ̀
  rationale: Ó tọ́ka ní kedere, ní èdè ọ̀wọ̀ àti èdè òde òní, sí ibi tí ènìyàn ti ń yọ ìgbẹ́ jáde, láì fi ètò ọ̀nà omi ìdọ̀tí tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: καθαρίζων
  choice: ń sọ ... di mímọ́
  rationale: Èyí fi ìtumọ̀ ìṣe pé kí ohun di mímọ́ hàn, ó sì yàgò fún fífi “kéde” kún ọ̀rọ̀ náà ní tààrà. Ìkọ̀wé náà jẹ́ kí gbolohun yìí dúró gẹ́gẹ́ bí àlàyé olùkọ̀wé, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó ní í ṣe pẹ̀lú dídá oúnjẹ pọ̀ mọ́.
- source_word: βρώματα
  choice: gbogbo oúnjẹ
  rationale: “Gbogbo oúnjẹ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti gbé ìtumọ̀ ọ̀pọ̀ àti gbogbo ẹ̀ka oúnjẹ inú πάντα τὰ βρώματα jáde.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀; “rẹ̀” bá èdè Yorùbá mu láì fi akọ tàbí abo tí ọ̀rọ̀ Gíríìkì kò fi rinlẹ̀ kún un.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: wọ inú / jáde lọ
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí pa ìṣípò láti òde wọ inú àti láti inú jáde mọ́ ní ọ̀nà tó rọrùn, tó sì ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ καθαρίζων πάντα τὰ βρώματα
  choice: 'Àlàyé olùkọ̀wé: “nípa bẹ́ẹ̀, ó ń sọ gbogbo oúnjẹ di mímọ́”'
  alternative: 'Ìtumọ̀ nípa iṣẹ́ inú ara: oúnjẹ ń jáde kúrò nínú ara, “nípa bẹ́ẹ̀, ó ń fọ gbogbo oúnjẹ jáde.”'
  rationale: Ẹni akọ kan ṣoṣo ni participle καθαρίζων, èyí sì lè tọ́ka sí Jésù nínú àlàyé Márkù nípa ohun tí ẹ̀kọ́ náà túmọ̀ sí. Síbẹ̀, ìsopọ̀ rẹ̀ mọ́ gbolohun tó ṣáájú lè jẹ́ kí a ka a sí àpèjúwe bí ara ṣe ń yọ oúnjẹ jáde. Nítorí pé ìyàtọ̀ yìí jẹ́ gidi, ó sì kan òfin oúnjẹ, a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ìjọ kan pàtó. Àmì àyọlò fi hàn pé ọ̀rọ̀ Jésù parí ṣáájú àlàyé olùkọ̀wé.
