source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: yo
  text: Ó dìde kúrò níbẹ̀, ó sì lọ sí agbègbè Tírè.[a] Nígbà tí ó wọ ilé kan, kò fẹ́ kí ẹnikẹ́ni mọ̀ pé òun wà níbẹ̀,[b] síbẹ̀ kò lè fara sin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ilẹ̀ Tírè”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí agbègbè tàbí ilẹ̀ tí ó jẹ́ ti Tírè, kì í ṣe ìlà ààlà rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “kò fẹ́ kí ẹnikẹ́ni mọ̀”; ohun tí wọn kò gbọ́dọ̀ mọ̀ kò hàn gbangba nínú Gíríìkì, ṣùgbọ́n ó tọ́ka sí wíwà rẹ̀ tàbí ibi tí ó wà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kò lè sá kúrò ní àkíyèsí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: kúrò níbẹ̀
  rationale: Ἐκεῖθεν tọ́ka sí ibi tí ó ti kúrò; δέ jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́ tí “ó sì” fi hàn lọ́nà àdánidá nínú ìtàn Yorùbá.
- source_word: ἀναστὰς
  choice: Ó dìde
  rationale: Ọ̀rọ̀ àbọ̀ aorist yìí bẹ̀rẹ̀ ìgbésẹ̀ tuntun nínú ìtàn; “dìde” pa ìtumọ̀ ìṣípò gidi mọ́ láì jẹ́ líle.
- source_word: ἀπῆλθεν
  choice: ó sì lọ
  rationale: ἀπέρχομαι túmọ̀ sí kíkúrò ní ibi kan lọ sí ibòmíràn; “kúrò níbẹ̀, ó sì lọ” mú ìtumọ̀ ìkúrò àti ìlọ jáde lọ́nà Yorùbá àdánidá.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: sí agbègbè Tírè
  rationale: ὅρια lè jẹ́ ààlà, ilẹ̀ ìjọba, tàbí agbègbè. Nínú àyíká yìí, “agbègbè Tírè” ṣe kedere pé kì í ṣe ìlà ààlà nìkan.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Nígbà tí ó wọ ilé kan
  rationale: Ọ̀rọ̀ àbọ̀ náà fi ìtẹ̀lé àkókò hàn, οἰκίαν tí kò ní article sì tọ́ka sí ilé kan tí a kò dárúkọ.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: kò fẹ́ kí ẹnikẹ́ni mọ̀ pé òun wà níbẹ̀
  rationale: Ohun tí ẹnikẹ́ni kò gbọ́dọ̀ mọ̀ kò hàn gbangba nínú Gíríìkì, ṣùgbọ́n ó tọ́ka sí wíwà Jesu níbẹ̀. Yorùbá nílò àlàyé díẹ̀ yìí kí gbólóhùn lè ṣe kedere, a sì samì sí i nínú àlàyé ìsàlẹ̀.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: síbẹ̀ kò lè fara sin
  rationale: λανθάνω túmọ̀ sí yíyẹ fún àkíyèsí tàbí wíwà ní ìkọ̀kọ̀; “fara sin” jẹ́ ọ̀nà Yorùbá àdánidá, “síbẹ̀” sì mú ìtakora pẹ̀lú ohun tí ó fẹ́ hàn.
