translation_notes:
  register: Yorùbá àfọwọ́ṣe tí ó lọ́lá, tó ṣe kedere, tí ó sì bá ọ̀nà ìtàn Bíbélì mu ni a lò. A fi àmì ohùn sí gbogbo ibi tí ó bá yẹ. “Òun” ni a lò nínú gbólóhùn abẹ́ láti yà ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ sí mímọ́ kúrò lọ́dọ̀ “ó.”
