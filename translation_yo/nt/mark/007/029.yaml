source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Nítorí ọ̀rọ̀ yìí[a], máa lọ; ẹ̀mí èṣù náà ti jáde kúrò lára ọmọbìnrin rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ohun tí o sọ yìí, máa lọ; ẹ̀mí èṣù náà ti jáde kúrò lára ọmọbìnrin rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Ó sì sọ fún un pé
  rationale: Èyí ń tẹ̀ lé ìtàn náà lọ́nà àdánidá, ó sì fi καί àti ọ̀rọ̀ ìṣáájú hàn láìfi ìtumọ̀ míì kún un.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Nítorí ọ̀rọ̀ yìí
  rationale: Nítorí ṣe àfihàn ìdí tàbí ohun tí ó fa nǹkan, gẹ́gẹ́ bí διά pẹ̀lú accusative; ọ̀rọ̀ yìí ń tọ́ka sí ìdáhùn obìnrin náà, ó sì pa singular λόγος mọ́.
- source_word: ὕπαγε
  choice: máa lọ
  rationale: Àṣẹ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti tú ẹni sílẹ̀ pé kí ó lọ; kò fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐξελήλυθεν
  choice: ti jáde kúrò
  rationale: Àmì ti ń fi ìṣe tí ó ti ṣẹlẹ̀ hàn, kúrò sì ń tọ́ka sí àbájáde tí ó wà pé ẹ̀mí náà kò sí lára ọmọ náà mọ́.
- source_word: ἐκ τῆς θυγατρός σου
  choice: kúrò lára ọmọbìnrin rẹ
  rationale: Lára ... kúrò jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹ̀mí náà ti jáde kúrò nínú ẹni tí ó ń gbé.
- source_word: τὸ δαιμόνιον
  choice: ẹ̀mí èṣù náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ẹ̀dá ẹ̀mí búburú tí δαιμόνιον ń tọ́ka sí, láìyí i padà sí àìsàn tàbí agbára búburú lásán.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ ìlépa ẹ̀mí èṣù láìrọ supernatural claim rẹ̀ di aláìlágbára
  choice: ẹ̀mí èṣù náà ti jáde kúrò lára ọmọbìnrin rẹ
  alternative: ẹ̀mí búburú náà ti fi ọmọbìnrin rẹ sílẹ̀
  rationale: Gíríìkì dárúkọ δαιμόνιον ní tààrà, ó sì sọ pé ó ti jáde kúrò lára ọmọbìnrin náà. Ìtumọ̀ yìí pa ìtọ́kasí sí ẹ̀dá ẹ̀mí náà àti àwòrán ìjáde mọ́, láìsọ ọ́ di àìsàn tàbí ipa búburú lásán.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì yé òǹkàwé lásán. Gbólóhùn náà tẹ̀ lé ìṣètò Gíríìkì níwọ̀n tí ó ti jẹ́ àdánidá ní Yorùbá, a sì fi àmì ohùn sí ibi tí ó yẹ.
