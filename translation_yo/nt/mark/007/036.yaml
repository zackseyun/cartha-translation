  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: yo
  text: Ó sì pàṣẹ fún wọn pé kí wọn má sọ fún ẹnikẹ́ni. Ṣùgbọ́n bí ó ti ń pàṣẹ fún wọn tó, bẹ́ẹ̀ ni wọ́n ń túbọ̀ kéde rẹ̀ sí i.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστείλατο
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìlànà tàbí àṣẹ tí ó lágbára fúnni; “pàṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìtọ́nisọ́nà náà mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ nínú ipò dátífù ni, ó sì tọ́ka sí àwọn tí ó wà níbẹ̀.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: pé kí wọn má sọ fún ẹnikẹ́ni
  rationale: Ó sọ ohun tí àṣẹ náà ní kí wọ́n ṣe; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìfòfindè náà mọ́ láìfi àlàyé kún un.
- source_word: ὅσον ... διεστέλλετο
  choice: bí ó ti ń pàṣẹ fún wọn tó
  rationale: Àkókò aláìpé àti ὅσον fi hàn pé àṣẹ náà ń tẹ̀ síwájú, wọ́n sì ń kéde rẹ̀ sí i ní ìwọ̀n kan náà.
- source_word: μᾶλλον περισσότερον
  choice: túbọ̀ ń kéde rẹ̀ lọ́pọ̀lọpọ̀
  rationale: Àpapọ̀ ọ̀rọ̀ méjèèjì mú ìtẹnumọ́ ìlọsíwájú pọ̀; “túbọ̀ ... lọ́pọ̀lọpọ̀” pa agbára ìtẹnumọ́ náà mọ́ ní Yorùbá tó ṣeé kà.
- source_word: ἐκήρυσσον
  choice: wọ́n ... ń kéde rẹ̀
  rationale: κηρύσσω túmọ̀ sí pípolongo ohun ní gbangba. “Kéde” dára ju “wàásù” lọ níbí, nítorí “wàásù” lè mú ìtumọ̀ iṣẹ́ ìjọ tàbí ìsọ̀rọ̀ ẹ̀sìn tí kò pọndandan wọlé; “rẹ̀” dúró fún ohun tí ó ṣẹlẹ̀.
theological_decisions:
- issue: Àṣírí nípa Mèsáyà àti agbára àṣẹ Jésù
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìfòfindè gidi, láìṣàlàyé ìdí tí Jésù fi pàṣẹ bẹ́ẹ̀.
  alternative: Lílo ọ̀rọ̀ bí “kìlọ̀ gidigidi” láti fi líle àṣẹ náà hàn, tàbí fífi ìdí tí ó fi fẹ́ ìdákẹ́jẹ́ kún ìtumọ̀.
  rationale: Ẹsẹ̀ náà sọ ní tààrà pé ó pàṣẹ kí wọ́n má sọ fún ẹnikẹ́ni, síbẹ̀ wọ́n túbọ̀ ń kéde rẹ̀. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. Ìṣètò “bí ... tó, bẹ́ẹ̀ ni ...” mú ìbáṣepọ̀ afiwéra inú Gíríìkì jáde ní ọ̀nà Yorùbá àdánidá.
