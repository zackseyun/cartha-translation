  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: yo
  text: Ṣùgbọ́n obìnrin náà dá a lóhùn pé, “Olúwa[a], àwọn ajá kéékèèké tí ó wà lábẹ́ tábìlì pàápàá máa ń jẹ lára èérún oúnjẹ àwọn ọmọ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń pe ẹnì kan, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ajá kékeré tàbí ajá ilé; “àwọn ajá kéékèèké” pa ìtumọ̀ àdínkù náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: dá a lóhùn pé
  rationale: Ó mú ìtumọ̀ ìdáhùn àti ọ̀rọ̀ tí ó tẹ̀ lé e pọ̀ mọ́ra ní Yorùbá àdánidá, láì tún ọ̀rọ̀ ṣe lásán.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ àkọ́kọ́ fún κύριε nígbà tí a bá ń bá Jésù sọ̀rọ̀; àmọ́ ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ bí “Ọ̀gá.”
- source_word: καὶ
  choice: pàápàá
  rationale: Níhìn-ín ó ní agbára àfikún tí ó tẹnu mọ́ ọn pé àwọn ajá kéékèèké náà pẹ̀lú ń rí ohun jẹ.
- source_word: κυνάρια
  choice: àwọn ajá kéékèèké
  rationale: Ó pa ìtumọ̀ àdínkù inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí àwọn ajá kéékèèké tàbí ajá ilé.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: tí ó wà lábẹ́ tábìlì
  rationale: Ìtumọ̀ ààyè náà ṣe kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐσθίουσιν
  choice: máa ń jẹ
  rationale: Àmì ìṣe àṣà “máa ń” fi hàn pé ohun tí ó sábà máa ń ṣẹlẹ̀ ni àpèjúwe náà ń sọ.
- source_word: ἀπὸ τῶν ψιχίων
  choice: jẹ lára èérún oúnjẹ
  rationale: “Lára” pa agbára apá-nínú-ọ̀pọ̀ ti ἀπό mọ́; “èérún oúnjẹ” sọ ψιχίων di mímọ́ ní Yorùbá.
- source_word: τῶν παιδίων
  choice: àwọn ọmọ
  rationale: Ó pa ìbáṣepọ̀ genitive mọ́ gẹ́gẹ́ bí èérún oúnjẹ tí ó jẹ́ ti àwọn ọmọ, láì fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ tí obìnrin náà sọ sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa akọ́lé κύριος mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ọ̀rọ̀ náà tún lè ṣiṣẹ́ gẹ́gẹ́ bí ìkíni ọ̀wọ̀; bẹ́ẹ̀ ni a kò fi tipátipá yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. Àmì ìsàlẹ̀ [a] wà lẹ́yìn “Olúwa,” níbi tí àṣàyàn κύριε ti yẹ; [b] wà ní òpin ẹsẹ láti ṣàlàyé “àwọn ajá kéékèèké.”
