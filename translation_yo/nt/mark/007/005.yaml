id: MRK.7.5
reference: Mark 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: yo
  text: Àwọn Farisí àti àwọn akọ̀wé sì béèrè lọ́wọ́ rẹ̀ pé, “Èé ṣe tí àwọn ọmọ-ẹ̀yìn rẹ kò fi ń rìn gẹ́gẹ́ bí àṣà àtọwọ́dọ́wọ́ àwọn àgbà, ṣùgbọ́n tí wọ́n ń fi ọwọ́ aláìmọ́[a] jẹ búrẹ́dì?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọwọ́ tí a sọ di aláìmọ́”; ní tààrà, “ọwọ́ wọ́pọ̀,” èyí tí ó ń tọ́ka sí àìmọ́ ní ti ìlànà ẹ̀sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ yìí sọ ìṣe bíbéèrè; a mú un wá ní ọ̀nà àdánidá ní Yorùbá, láì fi ìtumọ̀ pé wọ́n béèrè léraléra kún un.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ tí a sábà lò fún ẹgbẹ́ àwọn amòfin àti olùkọ́ òfin ní àyíká Ìhìn Rere, ó sì pa ìtumọ̀ orísun mọ́ láì ṣàlàyé rẹ̀ ju bó ṣe yẹ lọ.
- source_word: Διὰ τί
  choice: Èé ṣe tí
  rationale: Èyí jẹ́ ọ̀nà ìbéèrè Yorùbá tó ṣe àdánidá fún bíbéèrè ìdí.
- source_word: περιπατοῦσιν
  choice: ń rìn
  rationale: A pa àwòrán ‘rìn’ inú Gíríìkì mọ́; nínú àyíká yìí ó túmọ̀ sí ìwà tàbí ọ̀nà ìgbésí ayé, ó sì ṣeé lóye ní Yorùbá.
- source_word: κατὰ τὴν παράδοσιν
  choice: gẹ́gẹ́ bí àṣà àtọwọ́dọ́wọ́
  rationale: ‘Gẹ́gẹ́ bí’ fi ìbámu pẹ̀lú ìlànà hàn, ‘àṣà àtọwọ́dọ́wọ́’ sì sọ παράδοσις gẹ́gẹ́ bí ohun tí a fi ń sọ̀kalẹ̀ láti ìran dé ìran.
- source_word: τῶν πρεσβυτέρων
  choice: àwọn àgbà
  rationale: Ìtumọ̀ tààrà ni èyí, ó sì yàgò fún fífi kún un pé àwọn àgbà ìjọ ni wọ́n.
- source_word: κοιναῖς χερσὶν
  choice: ọwọ́ aláìmọ́
  rationale: Ní àríyànjiyàn yìí, κοινός ń tọ́ka sí àìmọ́ ní ti ìlànà ẹ̀sìn, kì í ṣe dọ́tí ara tàbí ìwà búburú. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gangan ‘ọwọ́ lásán’ mọ́.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: A pa ohun tí ọ̀rọ̀ Gíríìkì sọ ní tààrà mọ́ dípò fífi ‘oúnjẹ’ rọ́pò rẹ̀, bí ó tilẹ̀ jẹ́ pé ó lè dúró fún jíjẹun lápapọ̀.
theological_decisions:
- issue: Ìpo àìmọ́ tí κοινός ń tọ́ka sí
  choice: ọwọ́ aláìmọ́
  alternative: ọwọ́ tí a sọ di aláìmọ́; ọwọ́ lásán
  rationale: Àríyànjiyàn náà dá lórí ìmọ́tótó ní ti àṣà ẹ̀sìn àwọn Farisí, kì í ṣe ìmọ́tótó ara. Ìtumọ̀ yìí fi agbára ẹ̀sìn ọ̀rọ̀ náà hàn láì pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
translation_notes:
  register: Yorùbá àdánidá, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àṣà àtọwọ́dọ́wọ́’ fún παράδοσις, a sì pa àwòrán ‘rìn’ àti ‘búrẹ́dì’ inú orísun mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
