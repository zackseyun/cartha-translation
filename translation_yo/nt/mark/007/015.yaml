id: MRK.7.15
reference: Mark 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: yo
  text: Kò sí ohunkóhun ní òde ènìyàn tí ó lè sọ ọ́ di aláìmọ́[a] nígbà tí ó bá wọ inú rẹ̀; kàkà bẹ́ẹ̀, àwọn ohun tí ń jáde láti inú ènìyàn ni àwọn tí ń sọ ènìyàn di aláìmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ ọ́ di ẹlẹ́gbin.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí sísọ ẹnì kan di aláìmọ́ ní ti ìlànà ìmọ́tótó; ó sì tún ní ìfarahàn ní ti ìwà nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: Kò sí ohunkóhun
  rationale: Ó ṣàfihàn ìkọ̀sílẹ̀ pátápátá tí ọ̀rọ̀ Gíríìkì náà ní, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nothing’ ní Yorùbá.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: láti òde ènìyàn
  rationale: Ó pa ìtumọ̀ orísun tàbí ibi ìta mọ́, ó sì dá ìyàtọ̀ rẹ̀ sí ‘láti inú ènìyàn’ dúró.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: nípa wíwọ inú rẹ̀
  rationale: Ó pa ipa participle náà mọ́ gẹ́gẹ́ bí ọ̀nà tí ohun ìta fi wọ inú ènìyàn, láì mú gbólóhùn náà le ju bó ṣe yẹ lọ.
- source_word: κοινῶσαι / κοινοῦντα
  choice: sọ ... di aláìmọ́
  rationale: Nínú ọ̀rọ̀ nípa ìmọ́tótó, yíyan yìí lè tọ́ka sí àìmọ́ ní ti ìlànà ìjọsìn àti ní ti ìwà, láì fi ìtumọ̀ náà mọ́ apá kan ṣoṣo.
- source_word: ἀλλὰ
  choice: kàkà bẹ́ẹ̀
  rationale: Ó mú àtakò àti àtúnṣe tó lágbára nínú ọ̀rọ̀ Jesu hàn ju ‘ṣùgbọ́n’ lásán lọ.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: àwọn ohun tí ń jáde láti inú ènìyàn
  rationale: Ó tẹ̀ lé ọ̀pọ̀ ohun tí fọ́ọ̀mù Gíríìkì náà ń tọ́ka sí, ó sì pa ìtakora ‘láti òde’ àti ‘láti inú’ mọ́.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹ̀dá ènìyàn lápapọ̀, ó sì bá agbára aṣojú ti singular Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ κοινόω nínú àríyànjiyàn nípa ìmọ́tótó
  choice: sọ di aláìmọ́
  alternative: sọ di ẹlẹ́gbin / bà jẹ́
  rationale: ‘Sọ di aláìmọ́’ pa àyíká ìmọ́tótó ẹ̀sìn mọ́, ṣùgbọ́n ó ṣì lè ru ìtumọ̀ ìwà búburú tí ọ̀rọ̀ tó tẹ̀ lé e ń ṣàlàyé; àlàyé ìsàlẹ̀ fi ọ̀nà míì tí ó ṣeé ṣe hàn.
- issue: Lílo ἄνθρωπος gẹ́gẹ́ bí ẹni aṣojú gbogbo ènìyàn
  choice: ènìyàn
  alternative: ọkùnrin
  rationale: Nínú Yorùbá, ‘ènìyàn’ ni ọ̀rọ̀ tó péye àti tó wọ́pọ̀ fún ìtumọ̀ aṣojú yìí; ‘ọkùnrin’ yóò dín ọ̀rọ̀ náà kù sí akọ láìnídí.
translation_notes:
  register: Yorùbá àgbàdojú, ọlọ́lá, tí ó sì ṣeé yé ni a lò. A pa àfiwé láàárín ‘láti òde ènìyàn’ àti ‘láti inú ènìyàn’ mọ́, pẹ̀lú àtúnṣe tó lágbára ‘kàkà bẹ́ẹ̀.’ Àmì ohùn ni a fi sí ibi tí ó bá yẹ.
