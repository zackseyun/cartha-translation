  source_fidelity: Ìtumọ̀ náà ń pa ìtakora pàtàkì láàárín ohun tí ó wà níta ènìyàn àti ohun tí ń jáde láti inú rẹ̀ mọ́, ó sì túmọ̀ κοινόω ní ọ̀nà tó yẹ gẹ́gẹ́ bí ‘sọ di aláìmọ́.’ Síbẹ̀, ‘láti òde ènìyàn’ lè dun bí orísun ìbẹ̀rẹ̀ dípò ipò ohun tí ó wà níta; ‘ní òde ènìyàn’ sún mọ́ ἔξωθεν dáadáa. ‘Nígbà tí ó bá wọ inú rẹ̀’ sì jẹ́ ìṣọ̀kan tí ó mọ́gbọ́n dání fún participle náà.
  naturalness: Ìtúnṣe náà mú ìlànà gbólóhùn Yorùbá rọrùn síi, ó sì mú kí ẹni tí ‘ó bá wọ inú rẹ̀’ tọ́ka sí ohunkóhun tí ó wà níta ní kedere. A yọ ‘ń’ kúrò ní ibi ìṣe ìparí kí a má bàa fi ìṣe àṣà-tí-ń-tẹ̀síwájú sí ibi tí Gíríìkì ń ṣe àpèjúwe gbogbogbò.
  terminology: ‘Ènìyàn’ jẹ́ ìtumọ̀ tó péye fún ἄνθρωπος ní ọ̀rọ̀ aṣojú. ‘Aláìmọ́’ bójú mu àyíká ìmọ́tótó, tí ó sì lè ní ìfarahàn ìwà; àlàyé ìsàlẹ̀ náà ni a sọ di Yorùbá adayeba síi.
