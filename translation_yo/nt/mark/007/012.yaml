  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: yo
  text: Ẹ̀yin kò jẹ́ kí ó ṣe ohunkóhun fún baba rẹ̀ tàbí ìyá rẹ̀ mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin kò jẹ́ kí ó ṣe ohunkóhun láti ran baba rẹ̀ tàbí ìyá rẹ̀ lọ́wọ́ mọ́.” Ọ̀rọ̀ Gíríìkì náà gbòòrò; nínú àyíká yìí, ó lè kan ìrànlọ́wọ́ ní ti ohun ìní tàbí owó.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: mọ́
  rationale: Ní ìparí gbólóhùn, “mọ́” fi hàn lọ́nà àdánidá ní Yorùbá pé ohun tí a ń ṣe tẹ́lẹ̀ kò ṣẹlẹ̀ mọ́.
- source_word: ἀφίετε
  choice: jẹ́ kí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífún ẹnì kan láyè, kì í ṣe dídárí jì tàbí fífi sílẹ̀.
- source_word: αὐτὸν
  choice: ó
  rationale: A lo arọ́pò-orúkọ ẹni kẹta ẹyọ, ní ìbámu pẹ̀lú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: οὐδὲν
  choice: ohunkóhun
  rationale: Pẹ̀lú gbólóhùn òdì “kò ... jẹ́,” “ohunkóhun” sọ pé wọn kò fún un láyè láti ṣe irú ìṣe kankan.
- source_word: ποιῆσαι
  choice: ṣe
  rationale: Èyí pa ìtumọ̀ ìṣe gbogbogbòò inú ọ̀rọ̀ Gíríìkì mọ́ láì dín un kù sí ìrànlọ́wọ́ owó nìkan.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: fún baba tàbí ìyá rẹ̀
  rationale: “Fún” fi ìtumọ̀ àǹfààní inú dátífù hàn; “rẹ̀” sì mú kí ó ṣe kedere lọ́nà àdánidá pé àwọn òbí ẹni náà ni.
theological_decisions:
- issue: Bóyá kí a sọ ìtumọ̀ ìrànlọ́wọ́ owó tàbí ìtọ́jú òbí ní pàtó
  choice: Pa ọ̀rọ̀ náà mọ́ ní gbogbogbòò gẹ́gẹ́ bí “ṣe ohunkóhun fún baba tàbí ìyá rẹ̀.”
  alternative: “ṣe ohunkóhun láti ran baba tàbí ìyá rẹ̀ lọ́wọ́” tàbí “pèsè fún baba tàbí ìyá rẹ̀.”
  rationale: Àyíká Kọ́bánì tọ́ka sí ìrànlọ́wọ́ ohun ìní, ṣùgbọ́n ọ̀rọ̀ Gíríìkì nínú ẹsẹ yìí fúnra rẹ̀ gbòòrò. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ náà mọ́, kò sì fi àlàyé àyíká rọ́pò ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìtúmọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì tẹ̀ lé ìṣètò ọ̀rọ̀ àyíká. “Ẹ̀yin” mú kókó ọ̀rọ̀-ìṣe ènìyàn kejì púpọ̀ tó wà nínú ἀφίετε hàn.
