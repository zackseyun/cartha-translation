  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: yo
  text: Ó yà wọ́n lẹ́nu gidigidi,[a] wọ́n sì ń sọ pé, “Ó ti ṣe ohun gbogbo dáadáa. Ó ń mú kí àwọn adití gbọ́ àti àwọn tí kò lè sọ̀rọ̀ sọ̀rọ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “ju ìwọ̀n lọ” tàbí “ní ọ̀nà tí ó pọ̀ ju.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí rántí Aísáyà 35:5–6, níbi tí a ti sọ pé etí adití yóò ṣí, ahọ́n odi sì yóò kọrin nígbà ìmúpadàbọ̀sípò Ọlọ́run.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: lọ́nà tí ó kọjá àfẹnusọ
  rationale: Ọ̀rọ̀ náà ń fi ìyàlẹ́nu tí ó ga jù lọ hàn. Gbólóhùn yìí mú agbára rẹ̀ jáde ní Yorùbá àdánidá láì fi ìtumọ̀ àjèjì kún un.
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu sì yà wọ́n
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì lágbára, láti sọ pé ìyàlẹ́nu ńlá mú àwọn ènìyàn.
- source_word: λέγοντες
  choice: wọ́n sì ń wí pé
  rationale: Ó fi ohun tí wọ́n ń sọ hàn, ó sì jẹ́ kí ìṣe tí ó ń lọ ní àkókò náà fara hàn lọ́nà àdánidá.
- source_word: Καλῶς
  choice: dáadáa
  rationale: Ó ṣe àyẹ̀wò bí iṣẹ́ náà ṣe rí, ó sì pa ìtumọ̀ ‘ní ọ̀nà rere’ mọ́ láì mú ìtọ́ka ìwé mímọ́ kan di gbangba ju orísun lọ.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa àpapọ̀ àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì náà mọ́, ó sì tún lè jẹ́ kí ìró èdè nípa iṣẹ́ Ọlọ́run dúró.
- source_word: πεποίηκεν
  choice: Ó ti ṣe
  rationale: Àmì ìṣe pípé nínú Gíríìkì ń tọ́ka sí ohun tí a ti ṣe tí ipa rẹ̀ ṣì wà; ‘Ó ti ṣe’ sọ èyí ní Yorùbá kedere.
- source_word: κωφοὺς
  choice: àwọn adití
  rationale: ‘Adití’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí kò lè gbọ́ nínú àyíká ìwòsàn yìí.
- source_word: ποιεῖ ἀκούειν
  choice: Ó ń mú kí àwọn adití gbọ́
  rationale: Ìṣètò ‘mú kí …’ fi ìdí-okùnfà tí ποιέω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni hàn ní Yorùbá àdánidá.
- source_word: ἀλάλους
  choice: àwọn tí kò lè sọ̀rọ̀
  rationale: Àpèjúwe yìí ṣe ìtumọ̀ àìlera ọ̀rọ̀ wọn ní kedere, ó sì yẹra fún ọ̀rọ̀ tí ó lè dún bí ẹ̀gàn ní Yorùbá òde òní.
- source_word: λαλεῖν
  choice: sọ̀rọ̀
  rationale: Èyí ni ìbámu Yorùbá tààrà fún ‘sọ̀rọ̀’ nínú àyíká yìí.
- source_word: καὶ
  choice: kí … sì
  rationale: Ìsopọ̀ yìí pa ìbáṣepọ̀ àwọn iṣẹ́ ìyanu méjèèjì mọ́ láì fi ìtẹnumọ́ ‘àní’ kún ọ̀rọ̀ Gíríìkì lọ́nà tí kò pọndandan.
theological_decisions:
- issue: Ó ṣeé ṣe kí ‘Ó ti ṣe ohun gbogbo dáadáa’ ní ìró èdè nípa iṣẹ́ Ọlọ́run, àti pé apá tó kàn rántí Aísáyà 35:5–6.
  choice: A pa ọ̀rọ̀ àwọn ènìyàn mọ́ ní ọ̀nà tààrà, a sì ṣàlàyé àwọn ìró Ìwé Mímọ́ tó ṣeé ṣe nínú àlàyé ìsàlẹ̀.
  alternative: A lè lo ọ̀rọ̀ tí ó túbọ̀ tẹnumọ́ ìbáramu pẹ̀lú ìṣẹ̀dá tàbí darúkọ Aísáyà nínú ẹsẹ̀ fúnra rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì gba àwọn ìró wọ̀nyí láyè, ṣùgbọ́n kò sọ wọ́n di àlàyé gbangba. Ìtumọ̀ náà kò gbọ́dọ̀ mú ohun tí ó ṣeé ṣe nìkan di ohun tí a ti pinnu dájú.
translation_notes:
  register: A lo Yorùbá àṣàwọ́dá tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Àwọn tí kò lè sọ̀rọ̀’ ni a yàn dípò ọ̀rọ̀ kúkúrú kan tí ó lè dún bí ẹ̀gàn, nígbà tí ‘àwọn adití’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì ṣe kedere.
