  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà: àṣà wọn ni ọ̀nà tí wọ́n fi ń sọ ọ̀rọ̀ Ọlọ́run di asán, àti pé wọ́n ń ṣe ọ̀pọ̀ ìṣe mìíràn tí ó jọ èyí. Ṣùgbọ́n “Ẹ sì tipa” kò pé ní ìlò Yorùbá; “nípasẹ̀” ló ṣe kedere, ó sì fi dátífù ohun-èlò náà hàn dáadáa.'
