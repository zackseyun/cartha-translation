  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: yo
  text: Ẹ sì ń sọ ọ̀rọ̀ Ọlọ́run di asán nípasẹ̀ àṣà yín tí ẹ fi lé àwọn ẹlòmíràn lọ́wọ́[a]. Ẹ sì ń ṣe ọ̀pọ̀ ohun mìíràn tí ó jọ irú èyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú ọ̀rọ̀ Ọlọ́run di aláìlégbára” tàbí “fagilé ọ̀rọ̀ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: sọ ... di asán
  rationale: Ó fi agbára ọ̀rọ̀ náà hàn pé wọ́n ń mú ọ̀rọ̀ Ọlọ́run di aláìníṣẹ́ tàbí aláìnípa, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì pa ìyàtọ̀ tó wà láàárín ọ̀rọ̀ Ọlọ́run àti àṣà wọn mọ́.
- source_word: τῇ παραδόσει ὑμῶν
  choice: tipa àṣà yín
  rationale: Dátífù náà ń tọ́ka sí ohun èlò tàbí ọ̀nà tí wọ́n fi sọ ọ̀rọ̀ Ọlọ́run di asán; ‘tipa’ mú èyí hàn ní Yorùbá àdánidá.
- source_word: ᾗ παρεδώκατε
  choice: tí ẹ fi lé àwọn ẹlòmíràn lọ́wọ́
  rationale: Ó mú ìṣe fífi àṣà náà ránṣẹ́ láti ọ̀dọ̀ ẹni kan sí ẹlòmíràn hàn, ó sì pa ìbátan ọ̀rọ̀ rẹ̀ pẹ̀lú παράδοσις mọ́.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ọ̀pọ̀ ohun mìíràn tí ó dà bí irú èyí
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀pọ̀ àwọn ìṣe mìíràn tó jọ èyí mọ́ láìsọ ọ̀rọ̀ náà di líle.
- source_word: ποιεῖτε
  choice: ẹ sì ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tí ń bá a lọ tàbí tí wọ́n máa ń ṣe déédéé hàn.
theological_decisions:
- issue: Irú ‘àṣà’ tí Jésù ń bá wọn wí nípa rẹ̀
  choice: àṣà yín
  alternative: àṣà ènìyàn
  rationale: Gíríìkì sọ ní tààrà pé ‘àṣà yín’; kò fi ọ̀rọ̀ ‘ènìyàn’ kún un ní ẹsẹ yìí. Àyíká ọ̀rọ̀ fúnra rẹ̀ ló ń fi hàn pé àṣà pàtó yìí tako ọ̀rọ̀ Ọlọ́run.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò; lílo ‘ẹ’ bá ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ mu. A fi àmì ohùn sí ibi tí ó bá yẹ.
