  to: Ẹ sì ń sọ ọ̀rọ̀ Ọlọ́run di asán nípasẹ̀ àṣà yín tí ẹ fi lé àwọn ẹlòmíràn lọ́wọ́[a]. Ẹ sì ń ṣe ọ̀pọ̀ ohun mìíràn tí ó jọ irú èyí.
