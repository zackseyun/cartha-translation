source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ṣé ẹ̀yin náà kò ní òye ni? Ṣé ẹ kò lóye pé ohunkóhun tí ń wọ inú ènìyàn láti òde[b] kò lè sọ ọ́ di aláìmọ́[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “sọ ọ́ di eléèérí.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ àìmọ́ ní ti ìlànà ìwẹ̀nùmọ́ nínú àyíká yìí.'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “gbogbo ohun tí ń wọ inú ènìyàn láti òde.”'
    reason: word_order_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì wí
  rationale: Ọ̀rọ̀ ìtàn Gíríìkì yìí lo àsìkò ìsinsìnyí gẹ́gẹ́ bí ọ̀nà ìsọ̀rọ̀ ìtàn; àsìkò àtijọ́ ní Yorùbá bá ìtàn náà mu lọ́nà àdánidá.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε;
  choice: Ṣé ẹ̀yin náà kò ní òye báyìí?
  rationale: Èyí mú ìtẹnumọ́ οὕτως καὶ ὑμεῖς àti ìbáwí ìyàlẹ́nu inú ìbéèrè náà jáde, nígbà tí ‘kò ní òye’ fi ìtumọ̀ ἀσύνετοι hàn láìlo ọ̀rọ̀ ẹ̀gàn tó le jù.
- source_word: οὐ νοεῖτε
  choice: Ṣé ẹ kò mọ̀
  rationale: Nínú àyíká yìí, νοεῖτε túmọ̀ sí mímọ̀ tàbí lílóye ohun kan; ‘ẹ kò mọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì jẹ́ kí àtúnsọ èrò òye nínú gbolohun ṣáájú dúró.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: ohunkóhun tí ó bá ti òde wọ
  rationale: ‘Ohunkóhun tí ó bá’ fi ìtumọ̀ gbogbo ohun láìsí ààlà hàn, ‘ti òde wọ’ sì ṣàfihàn ἔξωθεν àti ìṣe εἰσπορευόμενον ní Yorùbá àdánidá.
- source_word: εἰς τὸν ἄνθρωπον
  choice: inú ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ orúkọ àpapọ̀ fún ẹ̀dá ènìyàn, ó sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́ láìfi akọ tàbí abo kún un níbi tí àkọ́kọ́ kò ti ń tẹnumọ́ akọ.
- source_word: κοινῶσαι
  choice: sọ ọ́ di aláìmọ́
  rationale: Nínú àríyànjiyàn nípa ìwẹ̀nùmọ́ yìí, κοινόω ń tọ́ka sí sísọ ènìyàn di aláìmọ́ ní ti ìlànà ẹ̀sìn, kì í ṣe ìbàjẹ́ ìwà nìkan.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìwẹ̀nùmọ́ κοινόω
  choice: sọ ọ́ di aláìmọ́
  alternative: sọ ọ́ di eléèérí
  rationale: ‘Sọ ọ́ di aláìmọ́’ jẹ́ ọ̀rọ̀ tó ṣe kedere, tó sì lè rú ìtumọ̀ àìmọ́ ní ti ìlànà ẹ̀sìn. Àlàyé ìsàlẹ̀ ojú ìwé sọ ìtumọ̀ yẹn di mímọ́ láìdín ọ̀rọ̀ náà kù sí ẹ̀ṣẹ̀ ìwà tàbí láìfi ẹ̀kọ́ ẹgbẹ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ ọ̀pọ̀ ‘ẹ̀yin/ẹ’ fún àwọn ọmọ-ẹ̀yìn, àti ìforúkọsílẹ̀ ohùn ní kíkún. Ìbéèrè méjèèjì jẹ́ ti ìbáwí ṣùgbọ́n kò di ọ̀rọ̀ ẹ̀gàn. A fi àmì kọ́mà sí òpin nítorí gbolohun náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
