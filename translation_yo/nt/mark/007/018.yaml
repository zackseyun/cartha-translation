  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa ní gbogbogbòò: ó pa ìbéèrè méjèèjì mọ́, ó túmọ̀ εἰς τὸν ἄνθρωπον sí ‘inú ènìyàn,’ ó sì fi ìtumọ̀ àìmọ́ ti κοινόω hàn ní àyíká ìwẹ̀nùmọ́. Síbẹ̀, ‘báyìí’ jẹ́ ọ̀rọ̀ àkókò (‘ní ìsinsìnyí’) lọ́pọ̀ ìgbà, níbi tí Οὕτως ti ń mú ìtumọ̀ ‘bẹ́ẹ̀/ní ọ̀nà yìí’ tàbí ìtẹnumọ́ ìbáwí wá. ‘Ṣé ẹ̀yin náà kò ní òye ni?’ dá ìtẹnumọ́ náà padà láìyí i padà sí àkókò.'
  naturalness: ‘Ohunkóhun tí ń wọ inú ènìyàn láti òde’ jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó rọrùn, tó sì ṣàfihàn substantival participle Gíríìkì náà kedere. Lílo ‘lóye’ nínú ìbéèrè kejì tún mú àtúnsọ èrò òye nínú ἀσύνετοι/νοεῖτε hàn dáadáa ju ‘mọ̀’ lọ. Àlàyé ìsàlẹ̀ ojú ìwé a ni a tún ṣàtúnṣe díẹ̀ kí ó lè jẹ́ Yorùbá adayeba.
  terminology: ‘Sọ ọ́ di aláìmọ́’ yẹ fún κοινῶσαι nínú àyíká ìwẹ̀nùmọ́; àlàyé a ṣe kedere pé àìmọ́ ìlànà ìwẹ̀nùmọ́ ni a ń sọ, kì í ṣe ẹ̀ṣẹ̀ ìwà nìkan. ‘Eléèérí’ wà gẹ́gẹ́ bí àṣàyàn ìtumọ̀ ọrọ̀, ṣùgbọ́n kò yẹ kí ó rọ́pò ọ̀rọ̀ àkọ́kọ́.
