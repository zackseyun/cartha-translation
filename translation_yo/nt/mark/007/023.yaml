source:
  edition: SBLGNT
  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: yo
  text: Gbogbo àwọn ohun búburú wọ̀nyí ń jáde láti inú ènìyàn, wọ́n sì ń sọ ènìyàn di aláìmọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Gbogbo ohun búburú wọ̀nyí
  rationale: Gbólóhùn yìí tẹnu mọ́ gbogbo àwọn ohun búburú tí a ṣẹ̀ṣẹ̀ tò lẹ́sẹẹsẹ; “ohun búburú” pa ìtumọ̀ ọ̀pọ̀ ohun gidi mọ́ dípò ọ̀rọ̀ àkójọpọ̀ kan.
- source_word: ἔσωθεν
  choice: láti inú
  rationale: Ó fi hàn pé inú ènìyàn ni orísun wọn, ó sì bá ìyàtọ̀ tó wà láàárín ohun inú àti ohun òde nínú àyíká ọ̀rọ̀ náà mu.
- source_word: ἐκπορεύεται
  choice: ń jáde
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò láti inú sí òde; bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ẹyọ, olùṣe rẹ̀ jẹ́ ọ̀pọ̀ ohun aláìlẹ́mìí gẹ́gẹ́ bí ìlò Gíríìkì.
- source_word: κοινοῖ
  choice: ń sọ ... di aláìmọ́
  rationale: Nínú àyíká ọ̀rọ̀ nípa ìmọ́tótó, κοινόω túmọ̀ sí fífi àìmọ́ bá ènìyàn nípa ìwà àti ní ìtumọ̀ ẹ̀sìn, kì í ṣe pé a kàn sọ ọ́ di ohun gbogbo ènìyàn.
- source_word: τὸν ἄνθρωπον
  choice: ènìyàn
  rationale: ἄνθρωπος níbí jẹ́ ẹyọ tí a lò ní gbogbogbòò fún ẹ̀dá ènìyàn. “Ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ akọ tàbí abo tí Gíríìkì kò ń tẹnu mọ́ kún un.
theological_decisions:
- issue: Ìtumọ̀ τὸν ἄνθρωπον nínú gbólóhùn gbogbogbòò nípa àìmọ́ ènìyàn
  choice: ènìyàn
  alternative: ọkùnrin náà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìrísí akọ ní Gíríìkì, agbára rẹ̀ níbí jẹ́ ti gbogbo ènìyàn. Yorùbá “ènìyàn” pa ẹyọ àti ìtumọ̀ gbogbogbòò mọ́ láì mú akọ wọ inú ọ̀rọ̀ náà.
- issue: Ìtumọ̀ κοινόω nínú àríyànjiyàn nípa ohun tó ń sọ ènìyàn di aláìmọ́
  choice: sọ ... di aláìmọ́
  alternative: sọ ... di ẹlẹ́gbin
  rationale: “Aláìmọ́” ń pa ìsopọ̀ pẹ̀lú èdè ìmọ́tótó nínú àyíká ọ̀rọ̀ náà mọ́, nígbà tí “ẹlẹ́gbin” lè dà bí ẹni pé ó ń tọ́ka sí ìdọ̀tí ara nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. Kò sí àmì àlàyé ẹsẹ̀ nítorí “ènìyàn” fúnra rẹ̀ ń sọ ìtumọ̀ gbogbogbòò ti ἄνθρωπος ní Yorùbá láìsí àìyédè tó nílò àlàyé.
