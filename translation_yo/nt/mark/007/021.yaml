source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: yo
  text: 'Nítorí láti inú ọkàn àwọn ènìyàn ni àwọn èrò búburú ń jáde: ìṣekúṣe, ìjìjí, ìpànìyàn,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: láti inú
  rationale: Ó tọ́ka sí ibi inú gẹ́gẹ́ bí orísun, ó sì pa ìyàtọ̀ tó wà láàárín ohun inú àti ohun òde mọ́ nínú àyíká ọ̀rọ̀ náà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ṣàlàyé ìdí fún gbólóhùn tó ṣáájú.
- source_word: καρδίας
  choice: ọkàn
  rationale: Ọ̀rọ̀ Yorùbá yìí pa àwòrán ọkàn mọ́ gẹ́gẹ́ bí àárín èrò, ìfẹ́ àti ìwà ènìyàn.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo aráyé ní gbogbogbòò, kì í ṣe àwọn ọkùnrin nìkan; ‘àwọn ènìyàn’ ni èdè Yorùbá àdánidá tó péye.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: àwọn èrò búburú
  rationale: Ó mú èrò inú tó ní ìwà ibi hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐκπορεύονται
  choice: ń jáde
  rationale: Ìṣe àkókò ìsinsìnyí yìí pa àwòrán ohun tó ń jáde láti inú mọ́.
- source_word: πορνεῖαι
  choice: ìṣekúṣe
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbòò fún àwọn ìṣe ìbálòpọ̀ tí kò bófin mu, láì dín ìtumọ̀ náà kù sí irú kan ṣoṣo.
- source_word: κλοπαί
  choice: olè jíjà
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ àwọn ìṣe jíjí ohun ẹlòmíràn.
- source_word: φόνοι
  choice: ìpànìyàn
  rationale: Ó tọ́ka sí pípa ènìyàn lọ́nà ẹ̀ṣẹ̀, kì í ṣe gbogbo irú pípa.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπων nínú gbólóhùn tó kan gbogbo aráyé
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ní gírámà, lílò rẹ̀ níbí jẹ́ ti gbogbo ènìyàn. Yorùbá kò nílò kí a fi akọ hàn níbi tí ìtumọ̀ orísun kò fi mọ́ àwọn ọkùnrin nìkan.
- issue: Ìtumọ̀ ọ̀pọ̀ πορνεῖαι
  choice: ìṣekúṣe
  alternative: àwọn ìṣe ìṣekúṣe
  rationale: ‘Ìṣekúṣe’ jẹ́ orúkọ àkójọpọ̀ tó wọ́pọ̀, tó sì lè gba ọ̀pọ̀ ìṣe tí fọ́ọ̀mù Gíríìkì náà ní lọ́kàn láì sọ ọ̀rọ̀ náà di líle tàbí àjèjì.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì bá ọ̀rọ̀ Bíbélì mu. Àtúnṣe ‘láti inú, láti inú ọkàn’ mọ́ ìtẹnumọ́ àti àwòrán orísun inú ti Gíríìkì mọ́.
