id: MRK.7.27
reference: Mark 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: yo
  text: Ó sì ń sọ fún un pé, “Jẹ́ kí àwọn ọmọ kọ́kọ́ jẹun títí wọn yó, nítorí kò yẹ láti gba búrẹ́dì àwọn ọmọ kí a sì jù ú fún àwọn ajá kéékèèké.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ajá inú ilé,” tàbí “àwọn ajá” lásán. Ọ̀rọ̀ Gíríìkì náà ní fọ́ọ̀mù ìkéré, èyí tí ó lè ba àwòrán ajá kékeré tàbí ajá inú ilé mu, bí ó tilẹ̀ jẹ́ pé kì í pinnu ìwọn tàbí ibi tí ajá náà wà dandan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect ní Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń sọ” pa abala yẹn mọ́ ní Yorùbá àdánidá.
- source_word: Ἄφες
  choice: Ẹ jẹ́ kí
  rationale: Àṣẹ náà ní ìtumọ̀ fífàyè gba; “Ẹ jẹ́ kí” jẹ́ ọ̀nà Yorùbá tó bójú mu láti sọ “let/allow.”
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: “Kọ́kọ́” pa ìtẹ̀síwájú àti ipò àkọ́kọ́ mọ́, láì sọ pé àwọn mìíràn kò ní rí ìpín gbà lẹ́yìn náà.
- source_word: χορτασθῆναι
  choice: jẹun títí wọn yó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ tàbí fífúnni ní oúnjẹ títí ẹni fi yó; gbólóhùn yìí bá àwòrán oúnjẹ mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὰ τέκνα
  choice: àwọn ọmọ
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún àwọn ọmọ, ó sì pa àkàwé ìdílé mọ́ láì fi ọjọ́-orí tàbí akọ-n-bábo kún un.
- source_word: καλόν ἐστιν
  choice: kò dára
  rationale: καλόν níbí lè túmọ̀ sí ohun tó dára tàbí tó yẹ; “kò dára” pa fífi ọ̀rọ̀ náà sílẹ̀ ní gbangba mọ́ láì dín in kù sí ẹwà nìkan.
- source_word: λαβεῖν
  choice: láti mú
  rationale: “Mú” jẹ́ ìtumọ̀ Yorùbá tó rọrùn fún gbígba tàbí mímú ohun kan ní àyíká yìí.
- source_word: τὸν ἄρτον
  choice: oúnjẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄρτος túmọ̀ sí búrẹ́dì, “oúnjẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá jù lọ nínú àwòrán jíjẹun inú ilé, láì sọ àkàwé náà nù.
- source_word: κυναρίοις
  choice: àwọn ajá kéékèèké
  rationale: Fọ́ọ̀mù diminutive náà tọ́ka sí ajá kékeré tàbí ajá inú ilé; “ajá kéékèèké” pa ìwọ̀n ọ̀rọ̀ náà mọ́ láì túmọ̀ sí ọmọ ajá dandan.
- source_word: βαλεῖν
  choice: sọ fún
  rationale: βάλλω túmọ̀ sí sísọ tàbí jíju; “sọ fún” pa ìṣe tó hàn gbangba nínú àwòrán náà mọ́.
theological_decisions:
- issue: Agbára àkàwé “àwọn ọmọ” àti “àwọn ajá kéékèèké”
  choice: Pa àkàwé ilé náà mọ́ nínú ẹsẹ̀, láì ṣàlàyé àwọn tí ọkọọkan dúró fún.
  alternative: Túmọ̀ “àwọn ọmọ” sí àwọn Júù/Ísírẹ́lì, àti “àwọn ajá” sí àwọn Kèfèrí nínú ọ̀rọ̀ ẹsẹ̀ náà.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àkàwé; ṣíṣàlàyé àwọn ẹni tí àkàwé náà dúró fún nínú ìtumọ̀ yóò fi ìtumọ̀ àlàyé kún ọ̀rọ̀.
- issue: Ìtumọ̀ πρῶτον (“kọ́kọ́”)
  choice: Fi “kọ́kọ́” sílẹ̀ nínú ọ̀rọ̀.
  alternative: Yọ ọ́ kúrò láti mú gbólóhùn rọrùn sí i.
  rationale: '“Kọ́kọ́” pa ìforígbárí ẹ̀kọ́ àti ìtàn náà mọ́: àwọn ọmọ ní ipò àkọ́kọ́, ṣùgbọ́n èyí kò fi dandan túmọ̀ sí pé a ti dá àwọn mìíràn sílẹ̀ títí láé.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ohùn ọ̀rọ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “Ẹ” nínú “Ẹ jẹ́ kí” gẹ́gẹ́ bí àṣẹ oníyì tó jẹ́ àdánidá ní Yorùbá.
