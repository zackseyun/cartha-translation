id: MRK.7.26
reference: Mark 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: yo
  text: Obìnrin náà jẹ́ ará Gíríìkì[a], ará Sírò-Fòníṣíà nípa ìbí[b]; ó sì ń bẹ̀ ẹ́ pé kí ó lé ẹ̀mí èṣù náà jáde kúrò lára ọmọbìnrin rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹni tí kì í ṣe Júù.” Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “ará Gíríìkì”; nínú àyíká yìí, ó ṣeé ṣe kí ó tún fi hàn pé obìnrin náà kì í ṣe Júù.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ará Sírò-Fòníṣíà nípa ìran tàbí ìpilẹ̀ṣẹ̀”; ìyẹn ni pé, ó jẹ́ ọmọ ìran Sírò-Fòníṣíà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: ará Gíríìkì
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì náà ní tààrà, ó sì lè tọ́ka sí obìnrin tí kì í ṣe Júù, tí ó tún ní àṣà tàbí èdè Gíríìkì.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: ará Sírò-Fòníṣíà nípa ìbí
  rationale: Gbólóhùn yìí fi ìran àti ibi tí obìnrin náà ti wá hàn; “nípa ìbí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ τῷ γένει.
- source_word: ἠρώτα
  choice: ó ń bẹ̀ ẹ́
  rationale: Àkókò imperfect náà fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; àmì “ń” pa apá yìí mọ́ láìfi ìmọ̀lára tí ó pọ̀ ju ọ̀rọ̀ ìpilẹ̀ṣẹ̀ lọ kún un.
- source_word: ἵνα ... ἐκβάλῃ
  choice: pé kí ó lé ... jáde
  rationale: Èyí sọ ohun tí obìnrin náà ń béèrè, ó sì pa agbára ἐκβάλλω mọ́ nínú ọ̀rọ̀ yíyọ ẹ̀mí èṣù jáde.
- source_word: τὸ δαιμόνιον
  choice: ẹ̀mí èṣù náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ “demon,” láìyí i padà sí àìsàn tàbí ohun mìíràn.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: kúrò lára ọmọbìnrin rẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì mú ìtumọ̀ ἐκ, ìyẹn yíyọ ohun kan jáde kúrò nínú ẹni, hàn.
- source_word: δὲ
  choice: sì
  rationale: “Sì” so gbólóhùn náà mọ́ ìtàn tí ó ṣáájú gẹ́gẹ́ bí àsopọ̀ ìtàn pẹ̀lẹ́, láìsọ ọ́ di ìtakò líle tàbí fi ọ̀rọ̀ àkókò tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìdánimọ̀ ẹ̀yà obìnrin náà
  choice: 'A pa àwọn àpèjúwe méjèèjì mọ́: “ará Gíríìkì, ará Sírò-Fòníṣíà nípa ìbí.”'
  alternative: “ẹni tí kì í ṣe Júù, láti ìran Sírò-Fòníṣíà”
  rationale: Ọ̀rọ̀ orísun fi ìdánimọ̀ àṣà tàbí ẹ̀sìn àti ìran tàbí agbègbè rẹ̀ hàn ní ọ̀nà méjì; ìtumọ̀ náà kò da àwọn méjèèjì pọ̀ sí ohun kan.
- issue: Irú ìpọ́njú ọmọbìnrin náà
  choice: “ẹ̀mí èṣù náà”
  alternative: “ẹ̀mí búburú náà”
  rationale: A tẹ̀ lé δαιμόνιον ní kedere, láìrọ̀ ọ́ tàbí túmọ̀ ọ́ sí àìsàn lásán.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, ọ̀wọ̀, àti èyí tí ó yé òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá; “ń” pa ìṣe tí ó ń bá a lọ mọ́, “sì” sì ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn pẹ̀lẹ́.
