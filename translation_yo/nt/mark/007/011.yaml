id: MRK.7.11
reference: Mark 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin sọ pé, ‘Bí ẹnì kan bá sọ fún baba rẹ̀ tàbí ìyá rẹ̀ pé, “Kọ́bánì”[a] (èyí ni, ẹ̀bùn[b]), ohunkóhun tí ìwọ bá fi rí ìrànlọ́wọ́ lọ́wọ́ mi—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kọ́bánì jẹ́ ọ̀rọ̀ fún ohun tí a yà sí mímọ́ gẹ́gẹ́ bí ẹ̀bùn fún Ọlọ́run, tí a kò sì ní lò fún àìní ìdílé mọ́.
    reason: cultural_note
  - marker: b
    text: Tàbí “ọrẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ṣùgbọ́n ẹ̀yin sọ pé
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tí δὲ ń mú wá hàn, “ẹ̀yin” sì pa ìtẹnumọ́ orúkọ arọ́pò ὑμεῖς mọ́. Ọ̀rọ̀ ìṣe “sọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí wọ́n máa ń kọ́ni tàbí gbà láàyè.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Bí ẹnì kan bá sọ
  rationale: Àkójọpọ̀ “bí ... bá” jẹ́ ọ̀nà Yorùbá tó bá ipò àìdánilójú ἐὰν pẹ̀lú subjunctive mu. “Ẹnì kan” ṣe iṣẹ́ ἄνθρωπος gẹ́gẹ́ bí aṣojú ẹnikẹ́ni láìfi akọ tàbí abo tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: fún baba rẹ̀ tàbí ìyá rẹ̀
  rationale: “Fún” fi ẹni tí ọ̀rọ̀ náà ń tọ̀ sí hàn; “baba rẹ̀ tàbí ìyá rẹ̀” pa ìbátan méjèèjì àti ìwọ̀ntúnwọ̀nsì gbólóhùn Gíríìkì mọ́.
- source_word: Κορβᾶν
  choice: Kọ́bánì
  rationale: A ṣe àkọsílẹ̀ ọ̀rọ̀ Sẹ́mítì náà ní ìró àti ìkọ̀wé tó ṣeé kà ní Yorùbá, bí Gíríìkì náà ṣe pa ọ̀rọ̀ àdábọ̀ náà mọ́, dípò kí a túmọ̀ rẹ̀ ní tààràtà.
- source_word: ὅ ἐστιν Δῶρον
  choice: èyíinì ni, ẹ̀bùn
  rationale: Gbólóhùn yìí pa àlàyé tí Máàkù fúnra rẹ̀ fi kún ọ̀rọ̀ Kọ́bánì mọ́. “Ẹ̀bùn” ni ìtumọ̀ gbòòrò, tààrà jù lọ fún δῶρον; àlàyé ìsìn rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ohunkóhun tí ìwọ ìbá fi rí ìrànlọ́wọ́ lọ́wọ́ mi
  rationale: “Ohunkóhun” mú ìtumọ̀ àìdálórí ti relative pronoun pẹ̀lú ἐὰν jáde. “Rí ìrànlọ́wọ́ lọ́wọ́ mi” sọ ὠφεληθῇς àti ἐξ ἐμοῦ ní Yorùbá àdánidá, láìdín àǹfààní náà kù sí owó nìkan. Àmì gígùn ní ìparí fi hàn pé ẹsẹ tó tẹ̀ lé ló máa parí èrò náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ ìlérí ẹ̀sìn Κορβᾶν nínú àríyànjiyàn nípa ohun tí a yà sí mímọ́ fún Ọlọ́run àti àṣà ènìyàn
  choice: Pa ọ̀rọ̀ àdábọ̀ náà mọ́ gẹ́gẹ́ bí “Kọ́bánì,” kí a sì tẹ̀ lé e pẹ̀lú àlàyé Máàkù, “èyíinì ni, ẹ̀bùn.”
  alternative: Túmọ̀ ọ́ ní tààràtà gẹ́gẹ́ bí “ọrẹ” tàbí “ẹ̀bùn tí a yà sí mímọ́ fún Ọlọ́run.”
  rationale: Gíríìkì fúnra rẹ̀ pa ọ̀rọ̀ Sẹ́mítì náà mọ́, ó sì ṣàlàyé rẹ̀ lẹ́yìn náà. Ṣíṣe bẹ́ẹ̀ nínú Yorùbá pa àyíká ìtàn àti ẹ̀sìn mọ́, kò sì fi ẹ̀kọ́ àfikún nípa bí ìlérí náà ṣe ń ṣiṣẹ́ sínú ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìsọ̀rọ̀ tààrà, àlàyé inú àkámọ́, àti gbólóhùn tí ẹsẹ tó tẹ̀ lé máa parí mọ́.
