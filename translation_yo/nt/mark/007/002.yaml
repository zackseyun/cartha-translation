  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: yo
  text: wọ́n sì rí i pé àwọn kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀ ń fi ọwọ́ tí a kà sí aláìmọ́[a] jẹ búrẹ́dì—èyí ni pé, ọwọ́ tí a kò wẹ̀—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gírámà, Gíríìkì sọ pé “pẹ̀lú ọwọ́ wọ́pọ̀”; níhìn-ín ó túmọ̀ sí ọwọ́ tí a kà sí aláìmọ́ ní ti ìlànà ìwẹ̀nù, kì í ṣe ọwọ́ tí ó kàn dọ̀tí nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: wọ́n sì rí i
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist, ṣùgbọ́n lílo ọ̀rọ̀-ìṣe pípé ní Yorùbá bá ìtàn náà mu, ó sì tọ́ka sí àwọn Farisí àti àwọn akọ̀wé inú ẹsẹ tó ṣáájú.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: àwọn kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: 'Ó ṣe àfihàn ìtumọ̀ partitive náà ní kedere: kì í ṣe gbogbo àwọn ọmọ-ẹ̀yìn, bí kò ṣe àwọn kan lára wọn.'
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàlàyé ohun tí wọ́n rí, kì í ṣe ìdí tí wọ́n fi rí i.
- source_word: κοιναῖς χερσίν
  choice: pẹ̀lú ọwọ́ tí a kà sí aláìmọ́
  rationale: κοινός túmọ̀ sí ‘wọ́pọ̀’ tàbí ‘lásán’ ní ìpilẹ̀, ṣùgbọ́n ní àyíká àṣà ìwẹ̀nù Júù ó ń tọ́ka sí ohun tí a kà sí aláìmọ́ ní ti ìlànà ẹ̀sìn. Gbólóhùn Yorùbá yìí mú ìtumọ̀ àṣà náà jáde láì sọ pé ọwọ́ náà kàn dọ̀tí ní ti ara.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: èyí ni pé, ọwọ́ tí wọn kò wẹ̀
  rationale: Ó pa àlàyé tí Máàkù fúnra rẹ̀ fi kún ọ̀rọ̀ náà mọ́, ó sì ṣe kedere ní Yorùbá pé ‘ọwọ́’ ni a kò wẹ̀.
- source_word: ἐσθίουσιν
  choice: ń ... jẹ
  rationale: Àmì ‘ń’ fi hàn pé iṣẹ́ jíjẹ náà ń lọ lọ́wọ́ nígbà tí wọ́n rí wọn.
- source_word: τοὺς ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀, ‘búrẹ́dì’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ irú oúnjẹ náà láì fi dandan ka àwọn ìṣù rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ìwẹ̀nù inú κοινός
  choice: ọwọ́ tí a kà sí aláìmọ́
  alternative: ọwọ́ lásán; ọwọ́ ẹlẹ́gbin; ọwọ́ aláìmọ́
  rationale: Àyíká náà ń sọ̀rọ̀ nípa àìmọ́ ní ti àṣà ìwẹ̀nù, kì í ṣe ìdọ̀tí ara nìkan. ‘Tí a kà sí’ dáàbò bo ìyàtọ̀ yìí, nígbà tí àlàyé Máàkù, ‘ọwọ́ tí wọn kò wẹ̀,’ ṣì dúró láìyípadà.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà jẹ́ apá kan tí yóò tẹ̀ síwájú sínú ẹsẹ tó tẹ̀ lé e, nítorí náà a pa àmì ìdádúró gígùn ìparí mọ́.
