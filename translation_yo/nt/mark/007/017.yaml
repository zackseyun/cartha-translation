id: MRK.7.17
reference: Mark 7:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: yo
  text: Nígbà tí ó sì wọ ilé kan lẹ́yìn tí ó kúrò lọ́dọ̀ ọ̀pọ̀ ènìyàn náà, àwọn ọmọ-ẹ̀yìn rẹ̀ béèrè lọ́wọ́ rẹ̀ nípa àkàwé náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ náà” tàbí “àpèjúwe náà.” Ọ̀rọ̀ Gíríìkì náà ni παραβολή.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó pa ìṣàn ìtàn Máàkù mọ́ gẹ́gẹ́ bí àsopọ̀, láì sọ ọ́ di ọ̀rọ̀ tí kò sí nínú Gíríìkì.
- source_word: ὅτε
  choice: Nígbà tí
  rationale: Ó fi àkókò tí àwọn ọmọ-ẹ̀yìn béèrè ìbéèrè náà hàn ní èdè Yorùbá àdánidá.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ó wọ ilé kan
  rationale: οἶκον kò ní article; “ilé kan” pa àìsọ ilé pàtó mọ́, “wọ” sì mú ìtumọ̀ ọ̀rọ̀-ìṣe náà jáde.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: lẹ́yìn tí ó kúrò lọ́dọ̀ ọ̀pọ̀ ènìyàn náà
  rationale: Ó sọ ìyapa rẹ̀ kúrò lọ́dọ̀ ogunlọ́gọ̀ ní Yorùbá tí ó ṣe kedere, bó tilẹ̀ jẹ́ pé a tún ètò gbólóhùn ṣe díẹ̀ fún ìṣàn àdánidá.
- source_word: ἐπηρώτων
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n béèrè ohun kan lọ́wọ́ ẹni; ìgbà àìpé Gíríìkì lè túmọ̀ sí ìbéèrè tí ó ń lọ, ṣùgbọ́n àkóónú ìtàn gba ọ̀nà yìí láàyè.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá tí ó sì pa ìbáṣepọ̀ ohun-ìní náà mọ́.
- source_word: τὴν παραβολήν
  choice: àkàwé náà
  rationale: “Àkàwé” ni ọ̀rọ̀ Yorùbá tí ó bá παραβολή mu jù lọ níbí, ó sì pa bí Máàkù ṣe pín ẹ̀kọ́ àpẹẹrẹ Jésù sí ẹ̀ka yìí mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραβολή níbi tí ó tún lè tọ́ka sí ọ̀rọ̀ àpẹẹrẹ tàbí ọ̀rọ̀ kan
  choice: àkàwé náà
  alternative: ọ̀rọ̀ náà; àpèjúwe náà
  rationale: Yíyan “àkàwé” tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì yẹra fún dídín irú ẹ̀kọ́ Jésù tí Máàkù ń tọ́ka sí kù; àkọ́silẹ̀ ìsàlẹ̀ ojú-ewé pa àwọn ìtumọ̀ mìíràn tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì yé òǹkàwé lásán ni a lò. A tún ìtòlẹ́sẹẹsẹ gbolohun Gíríìkì ṣe díẹ̀ kí ìbáṣepọ̀ “kúrò lọ́dọ̀ ọ̀pọ̀ ènìyàn” lè dun bí Yorùbá àdánidá, láì pàdánù ìtumọ̀ rẹ̀.
