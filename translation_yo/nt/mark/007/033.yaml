revisions:
- from: Ó mú ọkùnrin náà kúrò lọ́dọ̀ èrò náà sí apá kan ní ìkọ̀kọ̀[a]. Ó fi àwọn ìka ọwọ́ rẹ̀ sínú etí ọkùnrin náà, lẹ́yìn tí ó sì tutọ́[b], ó fi ọwọ́ kan ahọ́n rẹ̀.
  to: Ó mú ọkùnrin náà kúrò láàárín àwọn ènìyàn sí apá kan ní àdáni[a]. Ó fi àwọn ìka ọwọ́ rẹ̀ sínú etí ọkùnrin náà, lẹ́yìn tí ó tutọ́, ó sì fi ọwọ́ kan ahọ́n rẹ̀[b].
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó lè fi ìtumọ̀ ‘ní aṣírí’ kún ọ̀rọ̀ orísun pẹ̀lú ‘ní àdáni,’ ó sì mú ìṣàn gbolohun náà rọrùn. Ó pa gbogbo ìṣe, àwọn olùtọ́ka ẹni, àti àìní ìtẹnumọ́ pé a fi itọ́ sí ahọ́n mọ́.
