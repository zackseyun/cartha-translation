  terminology: ‘Fi ọwọ́ kan’ jẹ́ ìtumọ̀ àdánidá fún ἥψατο, ‘ahọ́n’ sì pé. A pa ìṣọ́ra ìtumọ̀ mọ́ nípa kíkò sọ pé itọ́ náà dé sí ahọ́n ọkùnrin náà.
