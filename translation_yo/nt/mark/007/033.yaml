  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: yo
  text: Ó mú ọkùnrin náà kúrò láàárín àwọn ènìyàn sí apá kan ní àdáni[a]. Ó fi àwọn ìka ọwọ́ rẹ̀ sínú etí ọkùnrin náà, lẹ́yìn tí ó tutọ́, ó sì fi ọwọ́ kan ahọ́n rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìpamọ́.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì sọ pé, “lẹ́yìn tí ó tutọ́, ó fi ọwọ́ kan ahọ́n rẹ̀”; kò sọ ní pàtó pé Jésù fi itọ́ sí ahọ́n ọkùnrin náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: Ó mú ọkùnrin náà kúrò lọ́dọ̀ èrò náà sí apá kan
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó ya ọkùnrin náà sọ́tọ̀ kúrò láàárín àwọn ènìyàn. ‘Mú ... kúrò ... sí apá kan’ jẹ́ èdè Yorùbá àdánidá tí kò fi ipá tàbí ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí pé ìṣe náà wáyé ní àdáni, níbi tí èrò kò sí; ó bá iṣẹ́ gbólóhùn náà mu gẹ́gẹ́ bí àfikún ọ̀nà ìṣe.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: Ó fi àwọn ìka ọwọ́ rẹ̀ sínú etí ọkùnrin náà
  rationale: ‘Fi ... sínú’ sọ ìṣe ara náà ní kedere. Sísọ ‘ọkùnrin náà’ dípò aṣèjẹ oníṣiyèméjì kejì mú ẹni tí etí jẹ́ tirẹ̀ ṣe kedere láì yí ìtumọ̀ padà.
- source_word: πτύσας
  choice: lẹ́yìn tí ó sì tutọ́
  rationale: Àpólà aláìlórúkọ aorist náà tọ́ka sí ìṣe tí ó ṣáájú fífi ọwọ́ kan ahọ́n. Ìtumọ̀ yìí kò sọ ibi tí itọ́ náà dé.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: ó fi ọwọ́ kan ahọ́n rẹ̀
  rationale: ἅπτομαι pẹ̀lú genitive níhìn-ín túmọ̀ sí ‘fọwọ́ kan.’ Ọ̀rọ̀ àyíká fi hàn pé ahọ́n ọkùnrin náà ni.
theological_decisions:
- issue: Àpèjúwe ìṣe ìwòsàn Jésù
  choice: A sọ àwọn ìṣe ara náà gẹ́gẹ́ bí Gíríìkì ṣe sọ wọ́n, láì ṣàlàyé àmì tàbí ọ̀nà tí ìwòsàn fi ṣiṣẹ́.
  alternative: Kí a sọ pé Jésù fi itọ́ sí ahọ́n ọkùnrin náà, tàbí kí a ṣàlàyé ìṣe náà gẹ́gẹ́ bí àṣà ìwòsàn.
  rationale: Gíríìkì sọ pé Jésù tutọ́, ó sì kan ahọ́n ọkùnrin náà; kò sọ ní pàtó pé ó fi itọ́ sí ahọ́n rẹ̀, bẹ́ẹ̀ ni kò ṣàlàyé ìdí tàbí àmì ìṣe náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì yẹ fún òǹkàwé òde òní. A lo ‘èrò’ fún ὄχλος, ‘ní ìkọ̀kọ̀’ fún κατ’ ἰδίαν, a sì tú àwọn aṣèjẹ tí ó lè rú ẹni ka sílẹ̀ níwọ̀nba.
