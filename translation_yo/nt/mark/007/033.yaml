  source_fidelity: 'Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ àti ìṣe ara nínú Gíríìkì dáadáa: Jésù ya ọkùnrin náà sọ́tọ̀ kúrò nínú ọ̀pọ̀ ènìyàn, ó fi ìka rẹ̀ sínú etí rẹ̀, ó tutọ́, ó sì kan ahọ́n rẹ̀. Bí ó ti wù kí ó rí, ‘ní ìkọ̀kọ̀’ sábà máa ń túmọ̀ sí ṣiṣe ohun kan ní aṣírí, èyí tó lè fi ìmọ̀ afikun sí κατ’ ἰδίαν. ‘Ní àdáni’ dá ìtumọ̀ ‘apart/in private’ sí rere láì fi aṣírí kún un.'
