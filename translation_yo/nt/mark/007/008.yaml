id: MRK.7.8
reference: Mark 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: yo
  text: Ẹ fi àṣẹ Ọlọ́run sílẹ̀, ẹ sì di àṣà àtọwọ́dọ́wọ́ àwọn ènìyàn[a] mú ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ẹ̀dá ènìyàn lápapọ̀; ó ń fi ohun tí ó ti ọ̀dọ̀ ènìyàn wá ṣe ìyàtọ̀ sí ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες (ἀφίημι)
  choice: Ẹ fi ... sílẹ̀
  rationale: Ó sọ pé wọ́n yà kúrò ní àṣẹ Ọlọ́run tàbí wọ́n gbé e sí ẹ̀gbẹ́ kan, láìfi agbára ìtumọ̀ tí ó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá adayeba fún ohun tí Ọlọ́run pàṣẹ, ó sì yẹra fún fífi ìtumọ̀ “òfin” lápapọ̀ lé ẹsẹ̀ náà lórí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ó fi hàn pé Ọlọ́run ni orísun àti ẹni tí àṣẹ náà jẹ́ tirẹ̀.
- source_word: κρατεῖτε
  choice: ẹ di ... mú ṣinṣin
  rationale: Ó pa agbára κρατέω mọ́ gẹ́gẹ́ bí fífẹ̀ mọ́ ohun kan tàbí dídì í mú láìjẹ́ kí ó lọ.
- source_word: παράδοσιν
  choice: àṣà àtọwọ́dọ́wọ́
  rationale: Gbólóhùn yìí túmọ̀ sí àṣà tí a ti ń fi láti ọwọ́ ìran kan dé ọwọ́ ìran mìíràn, ó sì mọ́ ní etí àwọn olùkà Yorùbá òde òní.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; yíyan yìí sì pa ìtakora ohun ti ènìyàn àti ohun ti Ọlọ́run mọ́.
theological_decisions:
- issue: Ìtakora láàárín àṣẹ Ọlọ́run àti àṣà ènìyàn
  choice: 'A pa ìtakora náà mọ́ ní tààràtà: “àṣẹ Ọlọ́run” ní ìhà kan àti “àṣà àtọwọ́dọ́wọ́ àwọn ènìyàn” ní ìhà kejì.'
  alternative: Lílo gbólóhùn tí yóò dà bí ẹni pé gbogbo àṣà àtọwọ́dọ́wọ́ ni ẹsẹ̀ náà ń dá lẹ́bi.
  rationale: Ẹsẹ̀ náà ń bá àwọn tí wọ́n fi àṣà ènìyàn sí ipò àṣẹ Ọlọ́run wí; kò sọ ní tààràtà pé gbogbo àṣà jẹ́ búburú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ adayeba, ó ní ọlá, ó sì ṣe kedere fún àwọn olùkà òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ọ̀rọ̀-ìṣe Gíríìkì κρατεῖτε.
