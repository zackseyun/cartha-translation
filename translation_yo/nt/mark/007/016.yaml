translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ní etí láti gbọ́, kí ó gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ (pẹ̀lú Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin) àti àwọn ìtumọ̀ Kọ́pítikì ìjímìjí; ṣùgbọ́n ó wà nínú ìbílẹ̀ Byzantine tí ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ tẹ̀lé, ìbílẹ̀ àwọn ẹ̀dà Latin, àti púpọ̀ nínú àwọn ẹlẹ́rìí Syriac. Ó ṣeé ṣe kí a fi kún un lẹ́yìn náà nípasẹ̀ akọ̀wé kan, gẹ́gẹ́ bí ìtúnṣe gbólóhùn kan náà tó wà ní Máàkù 4:9 àti 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: etí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹ̀yà ara tí a fi ń gbọ́ ní tààrà, ṣùgbọ́n níbí ó tún ń tọ́ka sí ìmúrasílẹ̀ láti fetí sí ọ̀rọ̀ náà kí a sì lóye rẹ̀.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Èyí ń fi àṣẹ ẹni-kẹta ẹyọ kan hàn lọ́nà Yorùbá tó ṣe déédé, ó sì pa ìtẹnumọ́ pé kí ẹni náà fetí sílẹ̀, kí ó sì lóye mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo “Bí … bá” fún gbolohun àídájú, àti “kí ó gbọ́” láti pa ìrísí àṣẹ Gíríìkì mọ́ ní èdè àdánidá.
