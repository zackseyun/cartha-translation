source:
  edition: SBLGNT
  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: yo
  text: Ó sì ń wí pé, “Ohun tí ó ń jáde láti inú ènìyàn, òun ni ń sọ ènìyàn di aláìmọ́.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun ni ń sọ ènìyàn di ẹlẹ́gbin.” Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ọ̀rọ̀ ìwẹ̀mọ́, ó sì ń sọ nípa mímú ènìyàn di aláìmọ́ tàbí ẹlẹ́gbin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ó sì ń wí
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń wí’ pa ìtumọ̀ yẹn mọ́ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú ìtàn; ‘sì’ so gbólóhùn náà mọ́ ohun tó ṣáájú láìfi ìtakora líle kún un.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣí ọ̀rọ̀ tí ẹni kan sọ sílẹ̀, kódà nígbà tí àmì àyọlò bá tẹ̀ lé e.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Ohun tí ó ń jáde láti inú ènìyàn
  rationale: Ìtumọ̀ yìí mú articular participle náà jáde bí ‘ohun tí...,’ ó sì pa ìṣípò láti inú ènìyàn mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: ènìyàn
  rationale: ἄνθρωπος níbí ń tọ́ka sí ènìyàn lápapọ̀; ‘ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, ó sì pa àtúnlò ọ̀rọ̀ náà mọ́.
- source_word: ἐκεῖνο
  choice: òun ni
  rationale: '‘Òun ni’ fi ìtẹnumọ́ demonstrative náà hàn: ohun náà gan-an ló ń sọ ènìyàn di aláìmọ́.'
- source_word: κοινοῖ
  choice: ń sọ ènìyàn di aláìmọ́
  rationale: Nínú àyíká ọ̀rọ̀ ìwà mímọ́ àti àìmọ́, κοινόω túmọ̀ sí sísọ ènìyàn di aláìmọ́; yíyan ọ̀rọ̀ yìí pa èdè ìwẹ̀mọ́ inú orísun mọ́.
theological_decisions:
- issue: Èdè ìwẹ̀mọ́ inú κοινόω nínú ẹ̀kọ́ Jésù
  choice: ń sọ ènìyàn di aláìmọ́
  alternative: ń sọ ènìyàn di ẹlẹ́gbin
  rationale: ‘Di aláìmọ́’ mú ẹ̀ka ìtumọ̀ ìwẹ̀mọ́ àti àìmọ́ tó wà nínú àyíká ọ̀rọ̀ náà hàn ní tààrà. ‘Di ẹlẹ́gbin’ tún ṣeé ṣe, ṣùgbọ́n ó lè gbòòrò sí ìdọ̀tí tàbí ìbàjẹ́ lápapọ̀; a pa á mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye, ni a lò. ‘Ó sì ń wí’ pa ìṣe tí ń lọ lọ́wọ́ mọ́; ‘òun ni’ sì gbé ìtẹnumọ́ orísun jáde. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
