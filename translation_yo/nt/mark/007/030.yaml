source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: yo
  text: Nígbà tí ó sì lọ sí ilé rẹ̀, ó rí ọmọ náà níbi tí ó dùbúlẹ̀ lórí ibùsùn, ẹ̀mí èṣù náà sì ti jáde lọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó túbọ̀ tẹ̀lé ọ̀rọ̀ Gíríìkì: “ẹ̀mí èṣù náà sì ti jáde.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: nígbà tí ó sì lọ
  rationale: Aorist participle náà tọ́ka sí ìgbésẹ̀ tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́ láìfi ‘padà’ kún orísun.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: sí ilé rẹ̀
  rationale: Ó fi ìlọ sí ibùgbé obìnrin náà hàn ní kedere, ó sì bá ìlò Yorùbá mu.
- source_word: εὗρεν
  choice: ó bá
  rationale: Nínú ìtàn Yorùbá, ‘ó bá’ jẹ́ ọ̀nà àdánidá láti sọ pé ẹni kan dé ibi kan, ó sì rí ipò tí nkan wà.
- source_word: παιδίον
  choice: ọmọ náà
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ọmọ láìsọ akọ tàbí abo ní ẹsẹ yìí; àyíká ìtàn ló fi hàn pé ọmọbìnrin obìnrin náà ni.
- source_word: βεβλημένον
  choice: dùbúlẹ̀
  rationale: Perfect passive participle náà ṣàpèjúwe ipò ọmọ náà lórí ibùsùn; ‘dùbúlẹ̀’ sọ ipò yẹn ní Yorùbá àdánidá láìdá èrò ìwà ipá sílẹ̀.
- source_word: ἐπὶ τὴν κλίνην
  choice: lórí ibùsùn
  rationale: Èyí tẹ̀lé ìtumọ̀ preposition náà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: δαιμόνιον
  choice: ẹ̀mí èṣù náà
  rationale: ‘Ẹ̀mí èṣù’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún δαιμόνιον, ó sì yà á sọ́tọ̀ kúrò nínú ọ̀rọ̀ orísun míì tó lè túmọ̀ sí ‘ẹ̀mí àìmọ́.’
- source_word: ἐξεληλυθός
  choice: ti jáde lọ
  rationale: Perfect participle náà fi hàn pé ẹ̀mí èṣù náà ti jáde, àbájáde ìjáde náà sì ṣì dúró; ‘ti jáde lọ’ mú ìṣe àti àbájáde rẹ̀ jáde ní Yorùbá.
theological_decisions:
- issue: Àpèjúwe àbájáde ìlépa ẹ̀mí èṣù jáde
  choice: ẹ̀mí èṣù náà sì ti jáde lọ
  alternative: ẹ̀mí èṣù náà kò sí níbẹ̀ mọ́
  rationale: Ìtumọ̀ tí a yàn pa ìṣe ìjáde àti ipò àbájáde perfect participle mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá ìṣàkóso tó ní àmì ohùn ni a lò, pẹ̀lú èdè ìtàn tó lọ́nà, tó níyì, tí ó sì yé òǹkàwé òde òní. A kò lo ‘padà’ tàbí ‘kúrò lára rẹ̀,’ nítorí àwọn ọ̀rọ̀ wọ̀nyẹn kò fara hàn ní tààrà nínú ẹsẹ Gíríìkì.
