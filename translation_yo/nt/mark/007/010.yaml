  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: yo
  text: Nítorí Mósè sọ pé, “Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ,” àti pé, “Ẹnikẹ́ni tí ó bá sọ̀rọ̀ burúkú sí baba rẹ̀ tàbí ìyá rẹ̀[a] gbọ́dọ̀ kú dájúdájú[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí ó bá bú baba rẹ̀ tàbí ìyá rẹ̀.” Ọ̀rọ̀ náà lè túmọ̀ sí sísọ ibi sí wọn, fífi ọ̀rọ̀ gàn wọ́n, tàbí bú wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a gbọ́dọ̀ pa á kú.” Gíríìkì lo gbólóhùn òfin kan tí ó túmọ̀ ní tààràtà sí “kí ó kú nípa ikú.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Orúkọ náà ni a lò ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí ń ṣàlàyé, ó sì ń fi ẹ̀rí múlẹ̀ fún àríyànjiyàn Jésù.
- source_word: Τίμα
  choice: Bọ̀wọ̀ fún
  rationale: Èyí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ àṣẹ láti fi ọlá àti iyì tó yẹ fún òbí.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: baba rẹ àti ìyá rẹ
  rationale: Ó pa àwọn méjèèjì mọ́ ní kedere, ó sì bá ọ̀nà tí a mọ̀ sí àṣẹ yìí mu.
- source_word: Ὁ κακολογῶν
  choice: Ẹnikẹ́ni tí ó bá sọ̀rọ̀ burúkú sí
  rationale: Ó mú ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì náà jáde láì fi mọ́ èébú nìkan; ó lè túmọ̀ sí sísọ ibi sí ẹni, fífi ọ̀rọ̀ gàn án, tàbí búburú.
- source_word: πατέρα ἢ μητέρα
  choice: baba rẹ̀ tàbí ìyá rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ ohun-ìní kò fara hàn nínú gbólóhùn Gíríìkì yìí, Yorùbá àdánidá nílò rẹ̀ láti fi ìbátan òbí hàn; kò yí ìtumọ̀ padà.
- source_word: θανάτῳ τελευτάτω
  choice: gbọ́dọ̀ kú dájúdájú
  rationale: Ó sọ agbára àṣẹ òfin àti ìmúdájú ikú nínú àkójọpọ̀ ọ̀rọ̀ náà ní Yorùbá àdánidá, láì sọ ọ́ di dandan pé àwọn ẹlòmíràn ni yóò pa ẹni náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àkójọpọ̀ ọ̀rọ̀ òfin θανάτῳ τελευτάτω
  choice: gbọ́dọ̀ kú dájúdájú
  alternative: a gbọ́dọ̀ pa á kú
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣẹ òfin tó lágbára, tí ìtumọ̀ rẹ̀ jẹ́ pé ikú ẹni náà dájú. Àṣàyàn pàtàkì náà pa ọ̀rọ̀ náà mọ́ láì pinnu ní pàtó ẹni tó máa mú ìdájọ́ náà ṣẹ; àlàyé ìsàlẹ̀ fi ìtumọ̀ òfin mìíràn hàn.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Bọ̀wọ̀ fún” gẹ́gẹ́ bí àṣẹ àdánidá, a sì pa ìyàtọ̀ tó wà láàárín “sọ̀rọ̀ burúkú sí/bú” àti “kú/a pa á kú” mọ́ nípasẹ̀ àwọn àlàyé ìsàlẹ̀.
