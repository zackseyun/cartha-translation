language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: yo
  text: 'Nígbà tí wọ́n bá sì dé láti ọjà, wọn kì í jẹun bí wọn kò bá wẹ̀ ara wọn[a]. Ọ̀pọ̀ ohun mìíràn sì tún wà tí wọ́n ti gbà láti máa pa mọ́: fífi omi wẹ àwọn ife, àwọn ṣágo, àwọn ohun èlò bàbà, àti àwọn àga ìrọ̀gbọ̀kú tí wọ́n fi ń jẹun[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “rì ara wọn sínú omi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ìrísí ọ̀rọ̀-ìṣe kan tí a sábà máa ń túmọ̀ sí “baptisi,” ṣùgbọ́n níhìn-ín ó ń tọ́ka sí ìwẹ̀nùmọ́ nípa àṣà ìmímọ́.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan kò ní “àti àwọn àga ìrọ̀gbọ̀kú tí wọ́n fi ń jẹun.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: ọjà
  rationale: “Ọjà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi tí gbogbo ènìyàn ti ń tà, tí wọ́n sì ti ń rà ọjà.
- source_word: βαπτίσωνται
  choice: wẹ̀ ara wọn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń sọ nípa ìwẹ̀nùmọ́ ara gẹ́gẹ́ bí àṣà, kì í ṣe nípa baptisi Kristẹni; “ara wọn” sì fi ìtumọ̀ ọ̀nà àárín ọ̀rọ̀-ìṣe Gíríìkì náà hàn.
- source_word: παρέλαβον κρατεῖν
  choice: wọ́n ti gbà láti máa pa mọ́
  rationale: Èyí pa pọ̀ mọ́ èrò pé wọ́n gba àwọn àṣà náà, wọ́n sì ń bá a lọ láti máa ṣọ́ wọn.
- source_word: βαπτισμοὺς
  choice: fífi omi wẹ
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ nípa àwọn ìwẹ̀nùmọ́ ohun èlò, láì mú èrò baptisi Kristẹni wọ inú ẹsẹ náà.
- source_word: ξεστῶν
  choice: ṣágo
  rationale: “Ṣágo” ń tọ́ka sí ohun èlò bí ìgò ńlá tàbí ìkòkò tí a fi ń bu omi tàbí ohun mímu, ó sì bá ohun èlò tí ξέστης ń tọ́ka sí mu.
- source_word: χαλκίων
  choice: àwọn ohun èlò bàbà
  rationale: “Bàbà” túmọ̀ sí copper, “ohun èlò” sì dá àìdánilójú irú ohun náà sílẹ̀.
- source_word: κλινῶν
  choice: àwọn àga ìrọ̀gbọ̀kú tí wọ́n fi ń jẹun
  rationale: κλίνη lè jẹ́ ibùsùn tàbí àga ìrọ̀gbọ̀kú; àyíká oúnjẹ mú kí àga tí a fi ń rọ̀gbọ̀kú nígbà jíjẹun ṣeé ṣe jù.
- source_word: ἄλλα πολλά
  choice: ọ̀pọ̀ ohun mìíràn
  rationale: Èyí pa ìtumọ̀ gbòòrò ti Gíríìkì mọ́, láì sọ ọ́ di “àṣà” tàbí “ìṣe” nìkan.
theological_decisions:
- issue: Ìtumọ̀ βαπτίσωνται àti βαπτισμοὺς nínú àyíká ìwẹ̀nùmọ́ nípa àṣà
  choice: Lo “wẹ̀ ara wọn” àti “fífi omi wẹ.”
  alternative: “baptisi ara wọn” tàbí “rì ara wọn sínú omi”
  rationale: Ẹsẹ náà ń sọ nípa àwọn àṣà ìwẹ̀nùmọ́ àwọn Farisí, kì í ṣe nípa baptisi Kristẹni. Ìtumọ̀ yìí yàgò fún fífi èrò ẹ̀kọ́ ìsìn tí kò sí nínú àyíká náà kún un, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn “rì sínú omi” mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún níbi tí ó ti bá èdè mu; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “ṣágo” gẹ́gẹ́ bí ọ̀rọ̀ tí ó ṣeé lóye fún ohun èlò ìbu omi, a sì ṣàlàyé κλινῶν ní kíkún láti mú àṣà jíjẹun lórí àga ìrọ̀gbọ̀kú yé òǹkàwé.
