  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: yo
  text: Àwọn Farisí àti àwọn kan lára àwọn akọ̀wé, tí wọ́n ti Jerúsálẹ́mù wá, sì péjọ sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, gẹ́gẹ́ bí καί ti sábà máa ń ṣe nínú ìtàn Máàkù.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: péjọ sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n kóra jọ níbi tí Jésù wà; ó jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣípò-sọ́dọ̀ àti ìbáṣepọ̀ mọ́.
- source_word: οἱ Φαρισαῖοι
  choice: Àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù yìí ni a kọ ní ìró Yorùbá dípò kí a túmọ̀ iṣẹ́ wọn sí i.
- source_word: τινες τῶν γραμματέων
  choice: àwọn kan lára àwọn akọ̀wé
  rationale: Ó pa ìtumọ̀ partitive genitive mọ́ pé kì í ṣe gbogbo àwọn akọ̀wé ni a ń sọ̀rọ̀ nípa wọn.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù; kò fi àlàyé iṣẹ́ wọn tí ọ̀rọ̀ náà kò sọ ní tààrà kun un.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: tí ó ti Jerúsálẹ́mù wá
  rationale: Gbólóhùn ìbátan yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé wíwá wọn láti Jerúsálẹ́mù ṣáájú pípéjọ wọn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. A yan “péjọ sọ́dọ̀ rẹ̀” dípò ọ̀rọ̀ tí yóò túmọ̀ sí pé wọ́n yí i ká patapata, nítorí πρός αὐτόν ní pàtàkì ń tọ́ka sí wíwá sọ́dọ̀ rẹ̀.
