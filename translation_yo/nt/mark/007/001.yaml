  source_fidelity: 'Ìtumọ̀ náà mú gbogbo ẹ̀yà pàtàkì nínú Gíríìkì wá: àwọn Farisí, díẹ̀ lára àwọn akọ̀wé, wíwá láti Jerúsálẹ́mù, àti ìpéjọ wọn sọ́dọ̀ Jésù. Ṣùgbọ́n «tí ó ti Jerúsálẹ́mù wá» lè dà bí ẹni pé ó ń ṣàpèjúwe àwọn akọ̀wé nìkan, nígbà tí participle ọ̀pọ̀ nínú Gíríìkì lè kan gbogbo ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ dárúkọ.'
