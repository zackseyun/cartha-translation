  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: yo
  text: Ó sì tún pe èrò náà sí ọ̀dọ̀ rẹ̀, ó ń sọ fún wọn pé, “Gbogbo yín, ẹ fetí sí mi, kí ẹ sì lóye.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe ... sí ọ̀dọ̀ rẹ̀
  rationale: Ó fi ìtumọ̀ pípe àwọn ènìyàn wá sún mọ́ ẹni hàn ní Yorùbá àdánidá.
- source_word: πάλιν
  choice: tún
  rationale: Ó tọ́ka sí pé Jésù tún pe èrò náà lẹ́ẹ̀kan sí i.
- source_word: τὸν ὄχλον
  choice: èrò náà
  rationale: “Èrò” jẹ́ ọ̀rọ̀ Yorùbá tí ó yẹ fún ọ̀pọ̀ ènìyàn tí ó péjọ; “náà” ń dúró fún arọ́pò-orúkọ pàtó inú Gíríìkì.
- source_word: ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò aláìpé Gíríìkì ni a pa mọ́ gẹ́gẹ́ bí ìṣe tí ń lọ lọ́wọ́, láì sọ ọ́ di “ó sọ” lásán.
- source_word: Ἀκούσατέ μου
  choice: ẹ fetí sí mi
  rationale: Nínú àyíká yìí, ἀκούω túmọ̀ sí fífetí sí ẹni pẹ̀lú àfiyèsí, kì í ṣe gbígbọ́ ohùn lásán.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó bá ìpè tí a darí sí gbogbo àwọn tó wà nínú èrò náà mu.
- source_word: σύνετε
  choice: ẹ ... lóye
  rationale: Ó mú àṣẹ láti fi òye gba ohun tí a gbọ́ jáde ní Yorùbá kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn “ẹ,” a sì pa ìtẹnumọ́ “gbogbo yín” àti apá ìṣe tí ń lọ lọ́wọ́ nínú ἔλεγεν mọ́.
