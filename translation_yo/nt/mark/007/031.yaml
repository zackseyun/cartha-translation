translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A fi ‘Jésù’ sípò arọ́pò-orúkọ Gíríìkì tí ó wà nínú ọ̀rọ̀-ìṣe náà kí ẹni tí ó ń ṣe ìṣe lè ṣe kedere ní ẹsẹ tí ó dúró ṣoṣo; èyí kò fi ìtumọ̀ tuntun kún ọ̀rọ̀. A pa ìṣòro àti àìdájú ọ̀nà ìrìn-àjò náà mọ́ nínú ẹsẹ àti àlàyé ìsàlẹ̀.
