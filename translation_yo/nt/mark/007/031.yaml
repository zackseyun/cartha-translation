source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: yo
  text: Jésù tún kúrò ní agbègbè Tírè, ó sì gba Sídónì[a] kọjá lọ sí Òkun Gálílì, ó sì gba àárín agbègbè Dekapólì kọjá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Sídónì” tàbí “ní ọ̀nà Sídónì.” Gbólóhùn Gíríìkì náà lè fi ìrìn-àjò kọjá níbi náà tàbí ní ọ̀nà ibẹ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àárín agbègbè Dekapólì,” tàbí “láàárín àwọn agbègbè Dekapólì.” Ọ̀rọ̀ Gíríìkì ἀνὰ μέσον lè túmọ̀ sí “ní àárín” tàbí “láàárín,” àpèjúwe ọ̀nà náà sì ṣòro láti mú bá ilẹ̀-àyíká mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ìrìn-àjò mìíràn bẹ̀rẹ̀ lẹ́ẹ̀kan sí i, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: kúrò ní agbègbè Tírè
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘kúrò ní’ mú ìtẹ̀lé ìṣẹ̀lẹ̀ náà yé, ‘agbègbè’ sì túmọ̀ ὅρια gẹ́gẹ́ bí ilẹ̀ tàbí àgbègbè, kì í ṣe ìlà ààlà nìkan.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς
  choice: ó sì gba Sídónì kọjá lọ sí
  rationale: ‘gba … kọjá lọ sí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrìn-àjò tí ó lọ la ibi kan kọjá sí ibi mìíràn, ó sì pa ipa διά pẹ̀lú genitive mọ́.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Òkun Gálílì
  rationale: ‘Òkun Gálílì’ ni orúkọ ilẹ̀-àyíká tí ó bá θάλασσα τῆς Γαλιλαίας mu, bí ó tilẹ̀ jẹ́ pé adágún ni nípa ìmọ̀ ilẹ̀.
- source_word: ἀνὰ μέσον
  choice: la àárín … kọjá
  rationale: Ó pa agbára ibi tí gbólóhùn Gíríìkì aláìṣedéédé yìí ní—láàárín, ní àárín, tàbí la àgbègbè náà kọjá—mọ́ láì sọ ọ́ di ọ̀nà tí ó dájú ju orísun lọ.
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: agbègbè Dekapólì
  rationale: ‘Agbègbè’ fi ìtumọ̀ ilẹ̀-ọba tàbí àgbègbè hàn; ‘Dekapólì’ jẹ́ ìkọ̀wé orúkọ Gíríìkì náà ní Yorùbá.
