source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀, obìnrin kan—tí ọmọbìnrin rẹ̀ kékeré[a] ní ẹ̀mí àìmọ́[b]—gbọ́ nípa rẹ̀,[c] ó wá, ó sì wólẹ̀ sí ẹsẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọbìnrin.” Ọ̀rọ̀ Gíríìkì θυγάτριον jẹ́ irú ọ̀rọ̀ tí ó lè tọ́ka sí ọmọ tí ó kéré tàbí fi ìfẹ́ni hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ̀mí èṣù.” “Ẹ̀mí àìmọ́” ni ọ̀rọ̀ pàtó tí Máàkù lò; “ẹ̀mí èṣù” jẹ́ ìtumọ̀ àlàyé.
    reason: alternative_reading
  - marker: c
    text: 'A tún lè túmọ̀ ìbẹ̀rẹ̀ ẹsẹ yìí sí: “Ṣùgbọ́n ní kété tí obìnrin kan—tí ọmọbìnrin rẹ̀ kékeré ní ẹ̀mí àìmọ́—gbọ́ nípa rẹ̀, ó wá …” Èyí fi “lẹ́sẹ̀kẹsẹ̀” mọ́ bí ó ṣe dáhùn sí ohun tí ó gbọ́.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó pa ìtumọ̀ ìyípadà onírẹ̀lẹ̀ mọ́, ó sì so ẹsẹ yìí mọ́ ohun tí ó ṣáájú.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìkánjú tí ó wọ́pọ̀ nínú ìtàn Máàkù hàn, láì mú èdè Yorùbá di àjèjì.
- source_word: ἀκούσασα ... περὶ αὐτοῦ
  choice: gbọ́ nípa rẹ̀
  rationale: Gbólóhùn yìí túmọ̀ sí pé obìnrin náà gbọ́ ìròyìn nípa Jésù; èyí jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: γυνὴ
  choice: obìnrin kan
  rationale: Ọ̀rọ̀ náà kò ní article ní Gíríìkì, nítorí náà a fi obìnrin náà wọ inú ìtàn gẹ́gẹ́ bí ẹni tí a kò tíì dárúkọ.
- source_word: θυγάτριον
  choice: ọmọbìnrin rẹ̀ kékeré
  rationale: Ó pa ìbátan ọmọ sí ìyá mọ́, ó sì tún gbìyànjú láti fi ìrísí diminutive inú ọ̀rọ̀ Gíríìkì hàn.
- source_word: πνεῦμα ἀκάθαρτον
  choice: ẹ̀mí àìmọ́
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Máàkù ní tààrà, ó sì pa ìtumọ̀ àìmọ́ rẹ̀ mọ́ ju kí a túmọ̀ rẹ̀ sí ẹ̀mí èṣù nìkan lọ.
- source_word: ἐλθοῦσα
  choice: ó wá
  rationale: Ó sọ participle náà di ìṣe tó tẹ̀ lé ara rẹ̀ ní ọ̀nà tí ó ṣe déédé fún ìtàn Yorùbá.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: ó sì wólẹ̀ lẹ́bàá ẹsẹ̀ rẹ̀
  rationale: Ó pa àwòrán ìrẹ̀lẹ̀ àti ẹ̀bẹ̀ pajawiri mọ́ láì fi irú ìdúró ara kan tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πνεῦμα ἀκάθαρτον
  choice: ẹ̀mí àìmọ́
  alternative: ẹ̀mí àìmọ́; tàbí ẹ̀mí èṣù
  rationale: Ìtumọ̀ àkọ́kọ́ pa ọ̀rọ̀ pàtó tí Máàkù lò àti ìfarahàn àìmọ́ rẹ̀ mọ́. “Ẹ̀mí èṣù” lè tọ́ka sí ohun kan náà, ṣùgbọ́n ó jẹ́ ìtumọ̀ tí ó túmọ̀ sí i jinlẹ̀ ju ọ̀rọ̀ orísun lọ.
- issue: Ohun tí εὐθὺς ń ṣàlàyé nínú gírámà
  choice: lẹ́sẹ̀kẹsẹ̀ ... gbọ́ nípa rẹ̀, ó wá
  alternative: ní kété tí ó gbọ́ nípa rẹ̀, ó wá
  rationale: Ipò ọ̀rọ̀ Gíríìkì so εὐθὺς mọ́ ἀκούσασα ní pẹkipẹki, ṣùgbọ́n ó tún lè jẹ́ kí gbogbo ìṣe tí ó tẹ̀ lé ìgbọ́ràn náà ní ìkánjú. Àlàyé ìsàlẹ̀ pa ààyè fún méjèèjì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “lẹ́sẹ̀kẹsẹ̀” fún ìkánjú ìtàn Máàkù, “ẹ̀mí àìmọ́” fún ìfarabalẹ̀ sí ọ̀rọ̀ orísun, àti “wólẹ̀ lẹ́bàá ẹsẹ̀ rẹ̀” gẹ́gẹ́ bí ọ̀rọ̀ tí ó ní iyì, tí ó sì yé àwọn òǹkàwé lónìí.
