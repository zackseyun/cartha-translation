language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ẹ mọ bí a ṣe ń kọ àṣẹ Ọlọ́run sílẹ̀ dáadáa,[a] kí ẹ lè pa àṣà yín mọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ ṣe dáadáa láti kọ àṣẹ Ọlọ́run sílẹ̀, kí ẹ lè pa àṣà yín mọ́.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ẹ̀gàn níhìn-ín; kì í ṣe pé ó ń yìn wọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń tún ṣe hàn. “Ń sọ” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: Καλῶς
  choice: Ẹ mọ bí a ṣe ń … dáadáa
  rationale: Nínú àyíká yìí, καλῶς jẹ́ ọ̀rọ̀ ẹ̀gàn, kì í ṣe ìyìn. Ọ̀nà Yorùbá yìí mú ìbáwí ẹlẹ́gàn náà jáde láì jẹ́ kí ó dà bí ẹni pé Jésù ń fọwọ́ sí ohun tí wọ́n ṣe.
- source_word: ἀθετεῖτε
  choice: ń kọ … sílẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí kíkọ, fífi sílẹ̀, tàbí sọ ohun kan di aláìníṣẹ́. “Kọ … sílẹ̀” ṣe kedere pé wọ́n mọ̀ọ́mọ̀ kọ àṣẹ Ọlọ́run, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐντολήν
  choice: òfin
  rationale: “Òfin” jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn lóye fún àṣẹ aláṣẹ, ó sì bá ọlá àṣẹ Ọlọ́run mu ní àríyànjiyàn yìí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: A túmọ̀ ìbáṣepọ̀ náà ní tààrà gẹ́gẹ́ bí “òfin Ọlọ́run,” èyí tí ó fi ìyàtọ̀ rẹ̀ sí “àṣà yín” hàn kedere.
- source_word: ἵνα
  choice: kí … lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a fẹ́ hàn.
- source_word: παράδοσιν
  choice: àṣà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ohun tí a jogún tí a sì ń fi lé àwọn ẹlòmíràn lọ́wọ́. “Àṣà” jẹ́ kúkúrú, ó ṣe kedere, ó sì yẹ fún èdè Yorùbá òde òní.
- source_word: τηρήσητε
  choice: pa … mọ́
  rationale: “Pa … mọ́” fi ìtumọ̀ ṣíṣọ́ tàbí títẹ̀lé àṣà hàn, ó sì dá ìyàtọ̀ tó lágbára sí “kọ … sílẹ̀.”
theological_decisions:
- issue: Ohùn tí Jésù fi sọ gbólóhùn náà
  choice: Ìbáwí ẹlẹ́gàn, kì í ṣe ìyìn gidi
  alternative: 'Ìyìn ní ìtumọ̀ tààrà: “Ẹ ṣe dáadáa láti kọ òfin Ọlọ́run sílẹ̀”'
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ń dá wọn lẹ́bi nítorí fífi àṣà ènìyàn ga ju òfin Ọlọ́run lọ. Ìtumọ̀ náà pa ẹ̀gàn inú καλῶς mọ́ láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìlọsíwájú ọ̀rọ̀-ìṣe, ìdí ète, àti ìyàtọ̀ láàárín òfin Ọlọ́run àti àṣà ènìyàn mọ́.
