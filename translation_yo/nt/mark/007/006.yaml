id: MRK.7.6
reference: Mark 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: yo
  text: 'Ṣùgbọ́n ó sọ fún wọn pé, “Ó dára bí Àìsáyà ṣe sọ àsọtẹ́lẹ̀ nípa yín, ẹ̀yin alágàbàgebè, gẹ́gẹ́ bí a ti kọ ọ́ pé:


    ‘Àwọn ènìyàn yìí ń fi ètè wọn bu ọlá fún mi,

    ṣùgbọ́n ọkàn wọn jìnnà sí mi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí ohun tí ó ṣáájú, ó sì bá ìdáhùn Jésù mu.
- source_word: εἶπεν αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan bá àwọn mìíràn sọ̀rọ̀, láìsọnù ìtumọ̀ gíríìkì.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: sọ àsọtẹ́lẹ̀ ní ẹ̀tọ́
  rationale: “Ní ẹ̀tọ́” ṣàfihàn pé àsọtẹ́lẹ̀ náà bá ipò wọn mu, láìfi ìtumọ̀ ìwà rere tàbí ìpéye tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: nípa yín, ẹ̀yin alágàbàgebè
  rationale: Ó pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́, ó sì mú apposition gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ὡς γέγραπται ὅτι
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Àgbékalẹ̀ Yorùbá tí ó wọ́pọ̀ fún fífi ọ̀rọ̀ Ìwé Mímọ́ tí a kọ sílẹ̀ hàn.
- source_word: Οὗτος ὁ λαὸς
  choice: Àwọn ènìyàn yìí
  rationale: Bí ó tilẹ̀ jẹ́ pé gíríìkì lo nọ́ńbà ẹyọ fún “ènìyàn/orílẹ̀-èdè,” ọ̀pọ̀ ni Yorùbá àdánidá lò fún àwùjọ ènìyàn yìí.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: ń fi ètè wọn bọ̀wọ̀ fún mi
  rationale: “Bọ̀wọ̀ fún” dá ìtumọ̀ τιμάω dúró, “fi ètè wọn” sì pa àwòrán ara tí ó wà nínú orísun mọ́.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ṣùgbọ́n ọkàn wọn
  rationale: Ó pa “ọkàn” mọ́ ní ẹyọ gẹ́gẹ́ bí àwòrán ìṣọ̀kan fún inú àti ìfẹ́ àwùjọ náà, nígbà tí “wọn” jẹ́ ìtọ́kasí Yorùbá àdánidá.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: jìnnà sí mi
  rationale: Ó lè ṣàfihàn jíjìnnà nípa ìbáṣepọ̀ àti ẹ̀mí, kì í ṣe ààyè nìkan.
theological_decisions:
- issue: Jésù lo Àìsáyà 29:13 tààrà sí àwọn alátakò rẹ̀
  choice: A pa ẹ̀sùn tààrà náà mọ́ pẹ̀lú “nípa yín, ẹ̀yin alágàbàgebè” àti “Àwọn ènìyàn yìí.”
  alternative: Ṣíṣe ọ̀rọ̀ náà rọ̀ tàbí yí i padà sí ẹ̀kọ́ gbogbogbò tí kò tọ́ka sí àwọn olùgbọ́ náà.
  rationale: Gíríìkì fi hàn gbangba pé Jésù ń lo àsọtẹ́lẹ̀ Àìsáyà sí àwọn tó ń bá sọ̀rọ̀; a kò gbọ́dọ̀ dín agbára ẹ̀sùn náà kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “alágàbàgebè” fún ὑποκριτής nítorí ó jẹ́ ọ̀rọ̀ Yorùbá tí ó dúró ṣinṣin fún ẹni tí ìfarahàn rẹ̀ kò bá inú rẹ̀ mu.
