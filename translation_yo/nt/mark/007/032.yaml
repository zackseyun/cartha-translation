  terminology: “Adití” yẹ fún κωφός ní àyíká yìí; “tí ó ń sọ̀rọ̀ pẹ̀lú ìṣòro” kò sọ pé ẹni náà yadi. “Gbẹ ọwọ́ rẹ̀ lé e” dá ìṣe fífi ọwọ́ lé ẹni náà hàn, ó sì jẹ́ kí ẹni tí ọwọ́ náà jẹ́ hàn kedere.
