  source_fidelity: Ìtumọ̀ náà tọ́ka sí ìgbọ́-kúrò àti ìṣòro nínú sísọ̀rọ̀ lọ́tọ̀ọ̀tọ̀, ó sì pa ìbéèrè wọn láti fi ọwọ́ kan án mọ́. Ṣùgbọ́n “ọ̀rọ̀ ń ṣòro fún un” lè túmọ̀ sí pé kókó ọ̀rọ̀ kan ṣòro fún un láti lóye, kì í sì ṣe dandan pé ìṣòro sísọ̀rọ̀ ni.
