revisions:
- from: Wọ́n sì mú ọkùnrin kan tí ó di etí, tí ọ̀rọ̀ sì ń ṣòro fún un[a], wá sọ́dọ̀ rẹ̀; wọ́n sì bẹ̀ ẹ́ pé kí ó gbé ọwọ́ lé e.
  to: Wọ́n sì mú ọkùnrin adití kan tí ó ń sọ̀rọ̀ pẹ̀lú ìṣòro wá sọ́dọ̀ rẹ̀; wọ́n sì bẹ̀ ẹ́ pé kí ó gbé ọwọ́ rẹ̀ lé e.[a]
