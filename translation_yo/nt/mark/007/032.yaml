  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: yo
  text: Wọ́n sì mú ọkùnrin adití kan tí ó ń sọ̀rọ̀ pẹ̀lú ìṣòro wá sọ́dọ̀ rẹ̀; wọ́n sì bẹ̀ ẹ́ pé kí ó gbé ọwọ́ rẹ̀ lé e.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, “ọkùnrin adití kan àti ẹni tí ó ń sọ̀rọ̀ pẹ̀lú ìṣòro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: wọ́n sì mú ... wá
  rationale: Aorist-style Yoruba narrative wording naturally represents Mark's historical present while retaining the sequence of events.
- source_word: κωφόν
  choice: ọkùnrin kan tí ó di etí
  rationale: “Di etí” is a natural, dignified Yoruba expression for deafness; it does not imply muteness, since the next adjective separately describes impaired speech.
- source_word: μογιλάλον
  choice: tí ọ̀rọ̀ sì ń ṣòro fún un
  rationale: This conveys difficulty in speaking rather than complete inability to speak, preserving the distinction in the Greek.
- source_word: παρακαλοῦσιν
  choice: wọ́n sì bẹ̀ ẹ́
  rationale: “Bẹ̀” conveys earnest entreaty appropriate to the healing context, stronger than merely asking.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: pé kí ó gbé ọwọ́ lé e
  rationale: This is the natural Yoruba construction for the requested healing gesture and preserves the singular “hand.”
theological_decisions:
- issue: Irú àìlera ọkùnrin náà
  choice: Ó di etí, ọ̀rọ̀ sì ń ṣòro fún un; kò sọ pé kò lè sọ̀rọ̀ rárá.
  alternative: Ó di etí, ó sì yadi.
  rationale: κωφός and μογιλάλος distinguish deafness from difficult or impeded speech. Translating the latter as total muteness would overstate the source.
translation_notes:
  register: Standard Yorùbá with full tone marks; natural contemporary narrative style, dignified and accessible. The wording avoids treating the man as wholly mute and retains the singular hand in the requested gesture.
