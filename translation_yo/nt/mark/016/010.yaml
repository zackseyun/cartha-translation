translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àwọn participle tó kẹ́yìn ni a sọ di gbólóhùn àpèjúwe “tí wọ́n ń…” láti pa ìbáṣepọ̀ wọn mọ́ àwọn olùgbọ́.
