  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: yo
  text: Ó lọ, ó sì ròyìn fún àwọn tí wọ́n ti bá a wà[a], tí wọ́n ń ṣọ̀fọ̀, tí wọ́n sì ń sunkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó lọ, ó sì sọ fún àwọn tí wọ́n ti bá a wà, tí wọ́n ń ṣọ̀fọ̀, tí wọ́n sì ń sunkún.”
    reason: Ọ̀rọ̀ ἀπήγγειλεν lè túmọ̀ sí “ròyìn” tàbí “sọ fún”; “sọ fún” jẹ́ ọ̀nà Yorùbá tó rọrùn sí i.
lexical_decisions:
- source_word: ἐκείνη
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka padà sí Màríà Magidalénì nínú ẹsẹ tó ṣáájú; “Ó” ni ọ̀nà àdánidá jù lọ ní Yorùbá láìfi ìtumọ̀ míì kún un.
- source_word: πορευθεῖσα
  choice: lọ
  rationale: Aorist participle náà ṣàfihàn ìṣe tó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; “Ó lọ, ó sì…” mú tẹ̀lé-tẹ̀lé àwọn ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: ἀπήγγειλεν
  choice: ròyìn rẹ̀
  rationale: “Ròyìn” dá ìtumọ̀ jíjíṣẹ́ tàbí fífi ìròyìn kan hàn mú; “rẹ̀” ni a pèsè láti inú àyíká ọ̀rọ̀ nítorí ohun tí a ròyìn kò fara hàn gbangba nínú Gíríìkì.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: fún àwọn tí wọ́n ti wà pẹ̀lú rẹ̀
  rationale: Gbólóhùn yìí dá ẹgbẹ́ àwọn tó ti bá Jésù gbé tàbí rìn mọ̀; ìtumọ̀ yìí ṣe kedere, ó sì pa ìtọ́kasí sí àkókò tó kọjá mọ́.
- source_word: πενθοῦσι
  choice: tí wọ́n ń ṣọ̀fọ̀
  rationale: “Ṣọ̀fọ̀” bá ìbànújẹ́ nítorí ikú tàbí àdánù mu, ó sì yẹ fún àyíká ọ̀rọ̀ yìí.
- source_word: καὶ κλαίουσιν
  choice: tí wọ́n sì ń sunkún
  rationale: “Sunkún” túmọ̀ sí ẹkún gidi, ó sì bá ìró ọ̀rọ̀ ọlọ́lá àti ìbànújẹ́ ẹsẹ náà mu.
