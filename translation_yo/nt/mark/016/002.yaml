  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀ ní ọjọ́ kìíní ọ̀sẹ̀[a], wọ́n ń bọ̀[b] sí ibojì nígbà tí oòrùn ti yọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gígún, Gíríìkì náà ní, ‘ní ọjọ́ kìíní nínú àwọn Sábáàtì’; èyí jẹ́ ìsọ̀rọ̀ tí ó túmọ̀ sí ‘ní ọjọ́ kìíní ọ̀sẹ̀.’
    reason: lexical_alternative
  - marker: b
    text: Máàkù lo ọ̀rọ̀ ìṣe ìsinsìnyí nínú Gíríìkì—‘wọ́n ń bọ̀’—gẹ́gẹ́ bí ìsinsìnyí ìtàn. Ọ̀pọ̀ ìtumọ̀ lè lò ọ̀rọ̀ ìṣe àsìkò tí ó ti kọjá nínú àyíká ìtàn yìí.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí, ‘lẹ́yìn tí oòrùn ti yọ.’ Ìkọ̀ Gíríìkì náà jẹ́ genitive absolute tí ń fi àkókò ìbẹ̀wò wọn hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó jẹ́ ní òwúrọ̀ gan-an. ‘Ní kùtùkùtù òwúrọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ yìí hàn.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: ọjọ́ kìn-ín-ní ọ̀sẹ̀
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ Semitic/Koine tí ó túmọ̀ sí ọjọ́ àkọ́kọ́ nínú ọ̀sẹ̀, kì í ṣe ọ̀pọ̀ Sábáàtì ní ìtumọ̀ gígún.
- source_word: ἔρχονται
  choice: wọ́n wá
  rationale: Gíríìkì lo ìsinsìnyí ìtàn láti mú ìṣẹ̀lẹ̀ náà yè kooro. Fọ́ọ̀mù ìṣe Yorùbá ‘wọ́n wá’ kò fi àkókò mọ́lẹ̀ nípa ara rẹ̀, ó sì bá ìtàn náà mu láìfi ìlọsíwájú ‘ń’ kún un.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: sí ibojì
  rationale: Nínú àyíká ìsìnkú yìí, μνημεῖον jẹ́ ibojì, ἐπί pẹ̀lú accusative sì ń tọ́ka sí ìrìn sí ibi náà.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: nígbà tí oòrùn ti yọ
  rationale: Genitive absolute náà ń sọ àkókò tí wọ́n dé. ‘Nígbà tí oòrùn ti yọ’ pa ìbáṣepọ̀ àkókò náà mọ́ láìfi ìtumọ̀ ‘lẹ́yìn’ tí ó lágbára ju ohun tí Gíríìkì sọ kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìsinsìnyí ìtàn àti àìdánilójú kékeré inú genitive absolute mọ́ nípasẹ̀ ọ̀rọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀.
