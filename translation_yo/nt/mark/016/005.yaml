  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: yo
  text: Nígbà tí wọ́n sì wọ inú ibojì náà, wọ́n rí ọ̀dọ́mọkùnrin kan tí ó jókòó ní apá ọ̀tún, tí ó wọ aṣọ funfun gígùn; ìpayà sì bá wọ́n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnu sì yà wọ́n gidigidi.” Ọ̀rọ̀ Gíríìkì náà lè fi ìpayà, ìdààmú ọkàn, tàbí ìyàlẹ́nu líle hàn.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Nígbà tí wọ́n sì wọ inú
  rationale: Aorist participle feminine plural ni a túmọ̀ sí gbólóhùn àkókò ní Yorùbá; ó tọ́ka sí àwọn obìnrin tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀.
- source_word: μνημεῖον
  choice: ibojì
  rationale: Ní àyíká ìsìnkú àti àjíǹde, “ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ibi tí a tẹ́ òkú sí.
- source_word: νεανίσκον
  choice: ọ̀dọ́mọkùnrin kan
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ọkùnrin ọ̀dọ́; a kò fi “áńgẹ́lì” sínú ọ̀rọ̀ pàtàkì nítorí ẹsẹ yìí kò pe e ní bẹ́ẹ̀ ní tààrà.
- source_word: καθήμενον
  choice: tí ó jókòó
  rationale: Ó ṣàpèjúwe bí ọ̀dọ́mọkùnrin náà ṣe wà, ní èdè Yorùbá àdánidá.
- source_word: ἐν τοῖς δεξιοῖς
  choice: ní apá ọ̀tún
  rationale: Ìtumọ̀ ibi tí ó wà ni; “ní apá ọ̀tún” ṣe kedere, kò sì fi ẹni tí a ń fi ọ̀tún rẹ̀ wé kún ọ̀rọ̀ náà.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: tí ó wọ aṣọ funfun gígùn
  rationale: Perfect participle náà ń fi ipò rẹ̀ hàn gẹ́gẹ́ bí ẹni tí ó ti wọ aṣọ; στολή tọ́ka sí aṣọ gígùn tàbí aṣọ òde pàtàkì.
- source_word: στολή
  choice: aṣọ gígùn
  rationale: Èyí mú ìtumọ̀ aṣọ gígùn tàbí robe jáde ní Yorùbá òde òní láì lo ọ̀rọ̀ àjèjì.
- source_word: ἐξεθαμβήθησαν
  choice: ẹ̀rù sì bà wọ́n gidigidi
  rationale: Ọ̀rọ̀-ìṣe náà fi ìpayà tàbí ìdààmú ọkàn líle hàn, ó ju ìyàlẹ́nu lásán lọ; gbolohun yìí jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ta ni νεανίσκος náà?
  choice: A pe e ní “ọ̀dọ́mọkùnrin” nínú ọ̀rọ̀ pàtàkì.
  alternative: áńgẹ́lì
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká àti àwọn ìtàn tó jọra ń tọ́ka sí aṣojú ọ̀run, Máàkù 16:5 fúnra rẹ̀ lo ọ̀rọ̀ tó túmọ̀ sí “ọ̀dọ́mọkùnrin.” Ìtumọ̀ náà pa àpèjúwe Máàkù mọ́ láì pinnu ohun tí ẹsẹ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “wọ́n” fún àwọn obìnrin nínú àyíká ọ̀rọ̀; a sì pa ìdánimọ̀ ọ̀dọ́mọkùnrin náà mọ́ gẹ́gẹ́ bí àpèjúwe inú ẹsẹ.
