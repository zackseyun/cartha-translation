source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: yo
  text: Ẹni tí ó ti gbàgbọ́, tí a sì ti ṣe ìrìbọmi fún un, ni a ó gbà là[b][a]; ṣùgbọ́n ẹni tí kò bá gbàgbọ́ ni a ó dá lẹ́bi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà Yorùbá tí ó rọrùn sí i: “Ẹnikẹ́ni tí ó bá gbàgbọ́, tí a sì ṣe ìrìbọmi fún, ni a ó gbà là; ṣùgbọ́n ẹnikẹ́ni tí kò bá gbàgbọ́ ni a ó dá lẹ́bi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “tí ó gbàgbọ́, tí a sì ṣe ìrìbọmi fún un.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: Ẹni tí ó ti gbàgbọ́
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ẹni kan tí ìṣe náà ń ṣàpèjúwe mọ́, ó sì fi hàn pé ìgbàgbọ́ náà ṣáájú àbájáde ọjọ́ iwájú.
- source_word: βαπτισθεὶς
  choice: tí a sì ti ṣe ìrìbọmi fún un
  rationale: Ìtumọ̀ yìí pa ohùn àgbàṣe palolo mọ́, ó sì fi ìṣe tí ó ti ṣẹlẹ̀ ṣáájú àbájáde ọjọ́ iwájú hàn ní Yorùbá àdánidá.
- source_word: σωθήσεται
  choice: ni a ó gbà là
  rationale: ‘Gbà là’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù fún ìgbàlà ní àyíká ọ̀rọ̀ yìí, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ὁ δὲ ἀπιστήσας
  choice: ṣùgbọ́n ẹni tí kò bá gbàgbọ́
  rationale: Èyí pa ìtakora sí ‘gbàgbọ́’ mọ́ ní Yorùbá tí ó ṣe déédéé, bí ó tilẹ̀ jẹ́ pé ìrísí ‘bá’ jẹ́ ọ̀nà àdánidá ju pípa apá ìṣe aorist náà mọ́ ní líle.
- source_word: κατακριθήσεται
  choice: ni a ó dá lẹ́bi
  rationale: ‘Dá lẹ́bi’ sọ ìdájọ́ búburú àti ìjẹ̀bi tí κατακρίνω túmọ̀ sí ní kedere.
- source_word: καὶ
  choice: tí ... sì
  rationale: Àkójọpọ̀ ‘tí ... sì’ so ìgbàgbọ́ àti ìrìbọmi pọ̀ ní Yorùbá láìfi ìtẹnumọ́ mìíràn kún un.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ tó wà láàárín àbájáde méjèèjì hàn.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti ìrìbọmi pẹ̀lú ìgbàlà
  choice: A sọ àwọn ìṣe méjèèjì gẹ́gẹ́ bí àpèjúwe ẹni tí a ó gbà là, láìsọ ìrìbọmi di ohun tí ó dá ìgbàlà sílẹ̀ ní tààràtà tàbí sọ ọ́ di ohun tí kò ṣe pàtàkì.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ẹni pé ìrìbọmi jẹ́ ọ̀nà dandan tí ó ń mú ìgbàlà wá, tàbí kí a sọ ìrìbọmi di ohun àfikún tí kò ní ìbáṣepọ̀ gidi pẹ̀lú ìgbàlà.
  rationale: Gíríìkì so ẹni tí ó gbàgbọ́ àti ẹni tí a ṣe ìrìbọmi fún pọ̀ mọ́ ẹni tí a ó gbà là; ṣùgbọ́n gbólóhùn kejì dá ẹni tí kò gbàgbọ́ lẹ́bi, kò sì mẹ́nu kan ẹni tí a kò ṣe ìrìbọmi fún. A pa ìforígbárí ẹ̀kọ́ ìsìn yìí mọ́ láìyanju rẹ̀ fún ẹ̀sìn kan.
- issue: Ẹni kan akọ tí a lò gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: Lo ‘Ẹni tí’ ní ẹyọ ọ̀rọ̀, tí ó lè tọ́ka sí ẹnikẹ́ni.
  alternative: Lo ọ̀pọ̀ ènìyàn tàbí ọ̀rọ̀ àtúnsọ bí ‘ẹnikẹ́ni tí’.
  rationale: ‘Ẹni tí’ pa ẹyọ ọ̀rọ̀ aṣojú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ náà mọ́ akọ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn ni a lò. A yan ‘ṣe ìrìbọmi fún’ dípò ọ̀rọ̀ àyálò láti jẹ́ kí palolo Gíríìkì àti ìtumọ̀ ìṣe náà hàn gbangba. Àwọn àmì ohùn ni a fi síbi tí ó bá yẹ.
