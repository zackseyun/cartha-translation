  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ó pa àṣẹ ìkìlọ̀ náà mọ́, ó ṣàfihàn Jésù gẹ́gẹ́ bí ará Násárétì àti ẹni tí a kàn mọ́ àgbélébùú, ó sì dá ohùn àìṣe ti ἠγέρθη mọ́ nínú “A ti jí i dìde.” “Kò sí níbí” àti “Ẹ wo ibi tí wọ́n tẹ́ ẹ sí” tún bá ὧδε àti ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν mu. Ìlò àkókò àtijọ́ nínú “ó sọ fún wọn” jẹ́ ìṣàn Yorùbá tí ó ṣeé gbà fún historical present náà, láìpa ìtumọ̀ rẹ̀ run.'
