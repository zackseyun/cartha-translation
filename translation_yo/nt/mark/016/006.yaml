id: MRK.16.6
reference: Mark 16:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ẹ má ṣe fòyà. Ẹ ń wá Jésù ará Násárétì[a], ẹni tí a kàn mọ́ àgbélébùú. A ti jí i dìde; kò sí níbí[b]. Ẹ wo ibi tí wọ́n tẹ́ ẹ sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù ọmọ Násárétì.” Ọ̀rọ̀ Gíríìkì jẹ́ àpèjúwe tí a mú jáde láti inú orúkọ Násárétì.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “Ó ti jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn àìṣe: “A ti jí i dìde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Ẹ má ṣe fòyà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìdàrúdàpọ̀ tàbí ìbẹ̀rù líle, kì í ṣe ìyàlẹ́nu lásán; “ẹ má ṣe fòyà” jẹ́ Yorùbá àdánidá tó bá àyíká ibojì mu.
- source_word: Ναζαρηνὸν
  choice: ará Násárétì
  rationale: Ó pa ìtumọ̀ àpèjúwe ẹni tí ó ti Násárétì mọ́ ní Yorùbá tó ṣe kedere, láìfi orúkọ ẹ̀ya tàbí ẹ̀kọ́ mìíràn kún un.
- source_word: ἐσταυρωμένον
  choice: ẹni tí a kàn mọ́ àgbélébùú
  rationale: Ìsọ̀rọ̀ yìí fi hàn pé ìkànmọ́ àgbélébùú ti ṣẹlẹ̀, ó sì ń dá Jésù mọ̀ gẹ́gẹ́ bí ẹni tí wọ́n ṣe bẹ́ẹ̀ sí.
- source_word: ἠγέρθη
  choice: A ti jí i dìde
  rationale: A pa ohùn àìṣe (passive) Gíríìkì mọ́, nígbà tí gbolohun náà ṣì jẹ́ Yorùbá àdánidá; kò sọ ẹni tó jí i dìde ní tààrà.
- source_word: ὧδε
  choice: níbí
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì péye fún ọ̀rọ̀ ibi náà.
- source_word: ἴδε
  choice: Ẹ wo
  rationale: Ó jẹ́ àṣẹ tó ń darí àfiyèsí àwọn obìnrin sí ibi náà, ní èdè òde òní tó ní iyì.
- source_word: τόπος
  choice: ibi
  rationale: “Ibi” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere nínú àyíká ibojì.
- source_word: ἔθηκαν
  choice: wọ́n tẹ́ ẹ sí
  rationale: “Tẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó bá fífi òkú sí ibojì mu, ó sì ní iyì ju “fi” lásán lọ.
- source_word: ζητεῖτε
  choice: Ẹ ń wá
  rationale: Ó fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún wíwá ẹnì kan.
- source_word: λέγει αὐταῖς
  choice: ó sọ fún wọn
  rationale: A lo àkókò ìsinsìnyí nínú Gíríìkì gẹ́gẹ́ bí ìtàn alárinrin, ṣùgbọ́n àkókò àtijọ́ ní Yorùbá ń ṣàn lọ́nà àdánidá jù, láìyí ìtumọ̀ iṣẹlẹ̀ padà.
theological_decisions:
- issue: Ọ̀rọ̀ àjíǹde àti ohùn ọ̀rọ̀-ìṣe
  choice: A ti jí i dìde
  alternative: Ó ti jí dìde
  rationale: ἠγέρθη jẹ́ ọ̀rọ̀-ìṣe ní ohùn àìṣe; ìtumọ̀ tí a yàn pa èyí mọ́, ó sì fi iṣẹ́ Ọlọ́run tí a lóye pé ó wà lẹ́yìn rẹ̀ sílẹ̀ láìṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà ní iyì, ó ṣe kedere fún òǹkàwé gbogbo ènìyàn, ó sì yàgò fún èdè ìjọ kan pàtó. Ọ̀rọ̀ “àgbélébùú” àti “tẹ́ ẹ sí” bá àyíká ikú àti ibojì mu.
