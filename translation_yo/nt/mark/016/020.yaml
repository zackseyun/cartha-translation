revisions:
- from: Wọ́n sì jáde lọ, wọ́n sì kéde níbi gbogbo, Olúwa sì ń bá wọn ṣiṣẹ́, ó sì ń fi àwọn àmì tí ó tẹ̀ lé e mú ọ̀rọ̀ náà dájú.[a][b]
  to: Wọ́n sì jáde lọ, wọ́n sì kéde ní gbogbo ibi; Olúwa sì ń ṣiṣẹ́ pọ̀ pẹ̀lú wọn, ó sì ń fi àwọn àmì tí ó tẹ̀ lé[b] mú ọ̀rọ̀ náà[a] dájú.
  rationale: A yọ arọ́pò-orúkọ ‘e’ kúrò kí ìtumọ̀ má bà a fi ohun tí àwọn àmì tẹ̀lé hàn gẹ́gẹ́ bí ohun tí a sọ ní kedere. A tún ṣe ‘níbi gbogbo’ sí ‘ní gbogbo ibi,’ a sì lo ‘ń ṣiṣẹ́ pọ̀ pẹ̀lú wọn’ fún ìmọ̀ iṣẹ́-pọ̀ nínú συνεργοῦντος. Àwọn àmì ẹsẹ̀-isàlẹ̀ ni a gbe sí lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà: àwọn ọmọ-ẹ̀yìn jáde, wọ́n kéde káàkiri, Olúwa sì ń ṣiṣẹ́ pọ̀ pẹ̀lú wọn, ó sì fi àwọn àmì fìdí ọ̀rọ̀ náà múlẹ̀. Ṣùgbọ́n ‘àwọn àmì tí ó tẹ̀ lé e’ fi ohun tí àwọn àmì tẹ̀ lé hàn bí ẹni pé a ti sọ ọ́ ní kedere, nígbà tí Gíríìkì kò mẹ́nu kan ohun náà ní pàtó.'
  naturalness: ‘Ní gbogbo ibi’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ ju ‘níbi gbogbo’ lọ nínú àyíká yìí. ‘Ń ṣiṣẹ́ pọ̀ pẹ̀lú wọn’ tún ṣàfihàn συνεργοῦντος kedere ju ‘ń bá wọn ṣiṣẹ́’ lọ.
  terminology: ‘Olúwa,’ ‘kéde,’ ‘ọ̀rọ̀ náà,’ ‘àmì,’ àti ‘mú ... dájú’ yẹ, wọ́n sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá òde òní mu. A pa λόγον mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀ náà,’ pẹ̀lú àlàyé ẹsẹ̀-isàlẹ̀ fún ‘ìhìn iṣẹ́ náà.’
