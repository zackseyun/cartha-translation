  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: yo
  text: Wọ́n sì jáde lọ, wọ́n sì kéde ní gbogbo ibi; Olúwa sì ń ṣiṣẹ́ pọ̀ pẹ̀lú wọn, ó sì ń fi àwọn àmì tí ó tẹ̀ lé[b] mú ọ̀rọ̀ náà[a] dájú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn iṣẹ́ náà.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí “ọ̀rọ̀,” ṣùgbọ́n níbí ó tọ́ka sí ohun tí wọ́n ń kéde.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn àmì tí ó bá a lọ” tàbí “àwọn àmì tí ó tẹ̀ lé wọn.” Gbólóhùn Gíríìkì náà kò sọ ẹni tàbí ohun tí àwọn àmì náà tẹ̀ lé ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí àwọn ọmọ-ẹ̀yìn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “wọ́n” ni ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἐξελθόντες
  choice: jáde lọ
  rationale: A tú participle aorist náà sí ìṣe tó ń bá ìtàn lọ ní Yorùbá, láì fi ìtumọ̀ ìjáde sílẹ̀.
- source_word: ἐκήρυξαν
  choice: kéde
  rationale: κηρύσσω túmọ̀ sí pípolongo ní gbangba; “kéde” jẹ́ ọ̀rọ̀ adayébá, ó sì kò dín ìtumọ̀ náà kù sí ìwàásù inú ilé ìjọsìn nìkan.
- source_word: πανταχοῦ
  choice: níbi gbogbo
  rationale: Èyí jẹ́ ìtumọ̀ tó ṣe kedere, tó sì wọ́pọ̀ fún “ní gbogbo ibi.”
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Àkọlé κύριος ni a pa mọ́ gẹ́gẹ́ bí “Olúwa”; àyíká ẹsẹ ṣáájú tọ́ka sí Jésù.
- source_word: συνεργοῦντος
  choice: ń bá wọn ṣiṣẹ́
  rationale: Ó pa èrò iṣẹ́ pọ̀ mọ́ wọn mọ́, ó sì jẹ́ Yorùbá adayébá.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀” pa àwòrán λόγος mọ́, nígbà tí àyíká fi hàn pé ó jẹ́ ọ̀rọ̀ ìkéde tàbí iṣẹ́ ìránṣẹ́ wọn.
- source_word: βεβαιοῦντος
  choice: ń mú ... dájú
  rationale: Ó sọ ìtumọ̀ ìfìdí ohun tí a kéde múlẹ̀ tàbí ìjẹ́rìí sí i ní Yorùbá kedere.
- source_word: διὰ
  choice: fi ... mú
  rationale: Ìṣètò “fi X mú Y dájú” ṣàfihàn ọ̀nà tàbí ohun èlò tí διά pẹ̀lú genitive túmọ̀ sí.
- source_word: τῶν ἐπακολουθούντων σημείων
  choice: àwọn àmì tí ó tẹ̀ lé e
  rationale: Ó pa àìdánilójú ἐπακολουθέω mọ́ láàárín ‘tẹ̀ lé’ àti ‘bá a lọ’; arọ́pò-orúkọ “e” náà kò fi tipátipá pinnu bóyá ó tọ́ka sí ọ̀rọ̀ náà tàbí ìkéde wọn.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A fi “Olúwa” sílẹ̀; àyíká tọ́ka sí Jésù tí ó jíǹde.
  alternative: Ọlọ́run ní ìtumọ̀ gbogbogbò.
  rationale: Ẹsẹ 19 pè Jésù ní “Olúwa,” ṣùgbọ́n a kò fi orúkọ Jésù kún ẹsẹ 20 níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- issue: Iṣẹ́ àwọn àmì
  choice: Àwọn àmì ni ọ̀nà tí Olúwa fi mú ọ̀rọ̀ ìkéde náà dájú.
  alternative: Àwọn àmì kàn tẹ̀ lé àwọn olùkéde láìní iṣẹ́ ìjẹ́rìí tó ṣe kedere.
  rationale: Gbólóhùn náà so mímú ọ̀rọ̀ náà dájú mọ́ àwọn àmì nípasẹ̀ διά; a kò fi ẹ̀kọ́ míì kún un nípa bí àwọn àmì bẹ́ẹ̀ ṣe pé tó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ adayébá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ìṣe tí ń lọ (“ń bá,” “ń mú”) láti ṣàfihàn iṣẹ́ Olúwa tó ń bá ìkéde wọn lọ.
