id: MRK.16.12
reference: Mark 16:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, ó farahàn ní ìrísí mìíràn[a] sí méjì lára wọn bí wọ́n ti ń rìn lọ sí ìgbèríko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìrísí tí ó yàtọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí oko kan”; níhìn-ín, “sí ìgbèríko” fi ohun tí ó ṣeé ṣe kí ἀγρός túmọ̀ sí nínú àyíká yìí hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ìtẹ̀lé àkókò tí μετά pẹ̀lú ọ̀rọ̀ ní accusative ń fi hàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: sí méjì lára wọn
  rationale: Ó fi hàn pé àwọn méjèèjì jẹ́ ara ẹgbẹ́ ńlá náà, láì mú kí gbólóhùn le.
- source_word: περιπατοῦσιν
  choice: bí wọ́n ti ń rìn
  rationale: Ìlò ‘ń’ fi iṣẹ́ tí ó ń lọ lọ́wọ́ ní àkókò ìfarahàn náà hàn.
- source_word: ἐφανερώθη
  choice: ó farahàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí bí Jésù ṣe jẹ́ kí wọ́n rí i; ‘ó farahàn’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ mu.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: ní ìrísí mìíràn
  rationale: ‘Ìrísí’ lè sọ μορφή gẹ́gẹ́ bí ohun tí ojú rí, nígbà tí ‘mìíràn’ pa ìyàtọ̀ tí ἑτέρᾳ ń tọ́ka sí mọ́.
- source_word: πορευομένοις
  choice: lọ
  rationale: A so ó pọ̀ mọ́ ‘ń rìn’ gẹ́gẹ́ bí ‘ń rìn lọ’ láti fi ìrìn-àjò tí ó ní ibi tí wọ́n ń lọ hàn láì tún ọ̀rọ̀ kan náà sọ lọ́nà líle.
- source_word: εἰς ἀγρόν
  choice: sí ìgbèríko
  rationale: Nínú àyíká ìtàn yìí, ἀγρός ṣeé lóye gẹ́gẹ́ bí agbègbè ìta ìlú; ‘ìgbèríko’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtumọ̀ yẹn, ṣùgbọ́n àṣàyàn ‘sí oko kan’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú ìfarahàn àjíǹde tí ἐν ἑτέρᾳ μορφῇ ń ṣàpèjúwe
  choice: ní ìrísí mìíràn
  alternative: pẹ̀lú ìrísí tí ó yàtọ̀
  rationale: Ẹsẹ̀ náà sọ pé ó farahàn ní ìrísí mìíràn, ṣùgbọ́n kò ṣàlàyé bóyá ara rẹ̀ ni ó yàtọ̀, ojú wọn ni kò mọ̀ ọ́n, tàbí ohun mìíràn ló ṣẹlẹ̀. Ìtumọ̀ náà pa àìsọtán yìí mọ́ láì fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí yóò tú àdììtú inú ẹsẹ̀ náà sí ọ̀nà kan ṣoṣo.
