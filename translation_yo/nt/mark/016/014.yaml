id: MRK.16.14
reference: Mark 16:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: yo
  text: Lẹ́yìn náà[a], ó fara han àwọn mọ́kànlá náà bí wọ́n ti rọ̀gbọ̀kú níbi tí wọ́n ti ń jẹun[b]. Ó sì bá wọn wí nítorí àìgbàgbọ́ wọn àti líle ọkàn wọn, nítorí wọn kò gba àwọn tí wọ́n ti rí i lẹ́yìn tí a ti jí i dìde[c] gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Nígbà tó yá.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ gangan, “bí wọ́n ti rọ̀gbọ̀kú”; èyí ni ìdúró tí wọ́n sábà máa ń wà nígbà tí wọ́n ń jẹun ní àṣà ìgbà náà.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn tí wọ́n ti rí i pé ó ti jí dìde.” Ní ọ̀rọ̀ gangan, Gíríìkì náà sọ pé “àwọn tí wọ́n ti rí i ní ẹni tí a ti jí dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Lẹ́yìn náà
  rationale: Ó jẹ́ ọ̀rọ̀ àsìkò tó fi hàn pé ìfarahàn yìí ṣẹlẹ̀ lẹ́yìn àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; ó jẹ́ Yorùbá àdánidá, tó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: ἀνακειμένοις
  choice: bí wọ́n ti rọ̀gbọ̀kú síbi oúnjẹ
  rationale: Ó pa ìdúró ara tí àwọn ènìyàn máa ń wà nígbà tí wọ́n ń jẹun ní àṣà ìgbà náà mọ́, ó sì mú ipò oúnjẹ náà yé òǹkàwé.
- source_word: τοῖς ἕνδεκα
  choice: àwọn mọ́kànlá náà gan-an
  rationale: “Àwọn mọ́kànlá” tọ́ka sí ẹgbẹ́ àwọn aposteli lẹ́yìn àdánù Júdásì; “náà gan-an” fi ìtẹnumọ́ αὐτοῖς hàn ní Yorùbá àdánidá.
- source_word: ἐφανερώθη
  choice: ó fara han
  rationale: Èyí ni ọ̀nà Yorùbá tó bójú mu jù lọ fún ìfarahàn Jesu lẹ́yìn àjíǹde, láìfi àlàyé míì kún ọ̀rọ̀ náà.
- source_word: ὠνείδισεν
  choice: ó bá wọn wí
  rationale: Ó sọ ìbáwí líle ní èdè Yorùbá òde òní tó mọ́gbọ́n dání, láìdi ọ̀rọ̀ náà sí èdè àtijọ́.
- source_word: ἀπιστίαν
  choice: àìgbàgbọ́ wọn
  rationale: Ó dúró fún kíkọ̀ tàbí àìfẹ́ láti gba ẹ̀rí àwọn tó rí Jesu gbọ́, gẹ́gẹ́ bí gbólóhùn tó tẹ̀ lé ṣe fi hàn.
- source_word: σκληροκαρδίαν
  choice: líle ọkàn wọn
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì àti ìtumọ̀ rẹ̀ nípa ọkàn tí kò fẹ́ gba òtítọ́ mọ́, dípò yíyí i padà sí “agídí” nìkan.
- source_word: θεασαμένοις
  choice: àwọn tí wọ́n ti rí i
  rationale: Ó sọ ẹ̀rí àwọn tó fi ojú ara wọn rí Jesu ní kedere àti ní Yorùbá tó rọrùn.
- source_word: ἐγηγερμένον
  choice: lẹ́yìn tí a jí i dìde
  rationale: Ó pa ìrísí aláìṣe-taara ti ọ̀rọ̀ Gíríìkì mọ́, ó sì fi àjíǹde hàn láìdárúkọ ẹni tó jí i dìde, gẹ́gẹ́ bí ọ̀rọ̀ orísun náà.
- source_word: οὐκ ἐπίστευσαν
  choice: wọn kò ... gbọ́
  rationale: Ìṣètò “gba ... gbọ́” jẹ́ Yorùbá àdánidá fún pé wọn kò gba ẹ̀rí tí a ti sọ fún wọn tẹ́lẹ̀.
theological_decisions:
- issue: Ọ̀nà tí a gbà sọ ἐγηγερμένον nípa àjíǹde
  choice: lẹ́yìn tí a jí i dìde
  alternative: tí wọ́n ti rí i pé ó ti jí dìde
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìrísí aláìṣe-taara (“having been raised”) mọ́, kò sì sọ ẹni tó ṣe iṣẹ́ náà ní pàtó. Àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé rí ọ̀nà àdánidá míì tí Gíríìkì lè gbà yé ni.
- issue: Ìtumọ̀ àwòrán σκληροκαρδία
  choice: líle ọkàn
  alternative: agídí
  rationale: “Líle ọkàn” pa àwòrán Bíbélì àti ìfọkànsìn rẹ̀ sí ìkọ̀ tàbí ìdènà inú mọ́; “agídí” lè dín ìtumọ̀ náà kù sí ìwà òde nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A pa àwòrán “líle ọkàn” àti ìrísí aláìṣe-taara ti ọ̀rọ̀ àjíǹde mọ́, nígbà tí a fi àlàyé àṣà sí ìsàlẹ̀ fún “rọ̀gbọ̀kú síbi oúnjẹ.”
