id: MRK.16.15
reference: Mark 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ lọ sí gbogbo ayé, kí ẹ sì kéde ìhìn rere[b] fún gbogbo ìṣẹ̀dá[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “fún gbogbo ẹ̀dá.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ẹ̀dá kọ̀ọ̀kan tàbí sí gbogbo ìṣẹ̀dá lápapọ̀.
    reason: alternative_reading
  - marker: b
    text: A tún lè sọ pé “ìhìnrere.” Ọ̀rọ̀ Gíríìkì εὐαγγέλιον túmọ̀ ní tààrà sí “ìhìn rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Ẹ lọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó ṣáájú àṣẹ pàtàkì κηρύξατε; nínú Yorùbá àdánidá, “Ẹ lọ” fi agbára àṣẹ iṣẹ́ náà hàn dáadáa ju “Nígbà tí ẹ bá ń lọ” lọ.
- source_word: κόσμον ἅπαντα
  choice: gbogbo ayé
  rationale: κόσμος níbí tọ́ka sí ayé gẹ́gẹ́ bí gbogbo ibi tí ènìyàn ń gbé àti ibi iṣẹ́ ìránṣẹ́; ἅπαντα tẹnu mọ́ àpapọ̀ rẹ̀. “Gbogbo ayé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìwọ̀n àṣẹ náà mọ́.
- source_word: κηρύξατε
  choice: kéde
  rationale: κηρύσσω túmọ̀ sí pípolongo ní gbangba pẹ̀lú agbára aṣojú. “Kéde” jẹ́ ọ̀rọ̀ Yorùbá ìgbàlódé tó bójú mu, tí kò sì dín ìtumọ̀ náà kù sí ìwàásù nínú ilé ìjọsìn nìkan.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: εὐαγγέλιον túmọ̀ ní tààrà sí ìròyìn tàbí ìhìn rere. “Ìhìn rere” sọ ìtumọ̀ náà ní kedere fún òǹkàwé Yorùbá, bí ó tilẹ̀ jẹ́ pé “ìhìnrere” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀sìn tí a ti mú papọ̀ tún wọ́pọ̀.
- source_word: πάσῃ τῇ κτίσει
  choice: fún gbogbo ìṣẹ̀dá
  rationale: κτίσις lè túmọ̀ sí ìṣẹ̀dá lápapọ̀ tàbí ẹ̀dá kọ̀ọ̀kan. “Fún gbogbo ìṣẹ̀dá” pa ìfẹ̀ ìtumọ̀ tó gbòòrò àti ìró àgbáyé inú Gíríìkì mọ́ láìfi tipátipá dín in kù sí àwọn ènìyàn kọ̀ọ̀kan.
- source_word: εἶπεν αὐτοῖς
  choice: Ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti ọ̀nà ìtàn Gíríìkì; “sì” so ẹsẹ̀ náà mọ́ ohun tó ṣáájú, “sọ fún wọn” sì pa olùgbà ọ̀rọ̀ mọ́ kedere.
theological_decisions:
- issue: Ìwọ̀n πάσῃ τῇ κτίσει nínú àṣẹ ìránṣẹ́ náà
  choice: fún gbogbo ìṣẹ̀dá
  alternative: fún gbogbo ẹ̀dá
  rationale: Gbólóhùn Gíríìkì náà lè jẹ́ ti àpapọ̀ tàbí ti ẹ̀dá kọ̀ọ̀kan. Yíyan “gbogbo ìṣẹ̀dá” pa ìwọ̀n tó gbòòrò àti ìfẹ̀ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́; àlàyé ìsàlẹ̀ ojú ewé sì fi ọ̀nà ìtumọ̀ kejì hàn láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, àti èdè ìgbàlódé tí ó rọrùn fún gbogbo ènìyàn. Àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn “Ẹ” bá αὐτοῖς mu, ó sì mú àṣẹ náà ṣe kedere.
