  source_fidelity: 'Ìtumọ̀ ẹsẹ̀ pàtàkì náà fi ìtẹ̀lé Gíríìkì hàn dáadáa: àwọn obìnrin jáde, wọ́n sá kúrò nínú ibojì, ìwárìrì àti ìyàlẹ́nu gbá wọn mú, wọn kò sì sọ ohunkóhun fún ẹnikẹ́ni nítorí ẹ̀rù bà wọ́n. Àmọ́, ìtumọ̀ òpin kúkúrú nínú àlàyé ìsàlẹ̀ yí ìbáṣepọ̀ gbolohun “fún àwọn tí ó yí Peteru ká” padà, ó sì sọ ìtumọ̀ δι’ αὐτῶν ní ọ̀nà tí kò rọrùn.'
  naturalness: Ọ̀rọ̀ ẹsẹ̀ pàtàkì jẹ́ Yorùbá boṣewa, ó sì dára ní ìforígbárí àti ìrìn kúkúrú ti Máàkù. A tún ṣe àtúnṣe kékeré sí àlàyé ìsàlẹ̀ kí ó lè jẹ́ gidi, kedere, àti adayeba.
  terminology: “ibojì,” “ìwárìrì,” “ìyàlẹ́nu,” àti “ẹ̀rù bà wọ́n” yẹ sí àyíká ọ̀rọ̀ náà. Nínú àlàyé ìsàlẹ̀, “ìkéde mímọ́ àti àìṣègbé ti ìgbàlà ayérayé” mú ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας hàn dáadáa.
