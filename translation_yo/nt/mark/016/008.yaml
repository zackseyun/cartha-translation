id: MRK.16.8
reference: Mark 16:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: yo
  text: Wọ́n sì jáde, wọ́n sá kúrò ní ibojì náà[a], nítorí ìwárìrì àti ìyàlẹ́nu ti gbá wọn mú. Wọ́n kò sì sọ ohunkóhun fún ẹnikẹ́ni, nítorí ẹ̀rù bà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan fi ohun tí a sábà ń pè ní òpin kúkúrú kún un pé: “Wọ́n sì ròyìn ní ṣókí fún àwọn tí ó yí Peteru ká gbogbo ohun tí a ti pa láṣẹ. Lẹ́yìn èyí, Jésù fúnra rẹ̀ sì rán ìkéde mímọ́ àti àìṣègbé ti ìgbàlà ayérayé jáde nípasẹ̀ wọn, láti ìlà-oòrùn títí dé ìwọ̀-oòrùn. Àmín.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Wọ́n sì jáde
  rationale: Aorist participle feminine plural refers to the women and marks action preceding or accompanying their flight; this direct Yoruba sequence is natural without overexplaining the temporal relation.
- source_word: ἔφυγον
  choice: wọ́n sá kúrò
  rationale: This preserves the vivid force of fleeing rather than merely leaving.
- source_word: μνημείου
  choice: ibojì náà
  rationale: “Ibojì” is the clear, standard Yoruba term for the tomb in this resurrection context.
- source_word: εἶχεν αὐτὰς
  choice: ti gbá wọn mú
  rationale: The idiom conveys emotions taking hold of the women; “gbá wọn mú” naturally preserves that intensity.
- source_word: τρόμος
  choice: ìwárìrì
  rationale: This expresses bodily trembling and remains distinct from the explicit fear mentioned at the end.
- source_word: ἔκστασις
  choice: ìyàlẹ́nu
  rationale: In context it denotes overwhelming astonishment or shock, not the modern sense of ecstatic pleasure.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: Wọn kò sì sọ ohunkóhun fún ẹnikẹ́ni
  rationale: 'Natural Yoruba preserves the comprehensive negative: they said nothing to anyone.'
- source_word: ἐφοβοῦντο
  choice: ẹ̀rù bà wọ́n
  rationale: A natural Yoruba expression for their continuing state of fear.
- source_word: γάρ
  choice: nítorí
  rationale: In both occurrences, “nítorí” clearly conveys the explanatory or causal force while retaining the abrupt final explanation.
theological_decisions:
- issue: Bí a ṣe ṣe sí òpin kúkúrú tí a fi mọ́ Máàkù 16:8 nínú àwọn ìwé àfọwọ́kọ kan
  choice: A kò fi òpin kúkúrú náà sínú ẹsẹ pàtàkì; a tọ́ka sí i pẹ̀lú àmì [a], a sì túmọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
  alternative: Kí a fi òpin kúkúrú náà sínú ẹsẹ pàtàkì, tàbí kí a tẹ àwọn òpin méjèèjì sínú ọ̀rọ̀ pàtàkì.
  rationale: SBLGNT fi apá yìí sínú àmì onígun méjì láti fi hàn pé kì í ṣe ara ọ̀rọ̀ pàtàkì tí a ń túmọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ẹ̀rí ìyàtọ̀ inú àwọn ìwé àfọwọ́kọ mọ́ fún òtítọ́ àti ìṣípayá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti yékéyéké ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn gbólóhùn kúkúrú àti ìtẹ̀síwájú pẹ̀lú “sì” pa ìrìn líle àti òpin àìròtẹ́lẹ̀ ti Máàkù mọ́.
