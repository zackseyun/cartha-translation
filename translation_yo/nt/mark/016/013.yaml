id: MRK.16.13
reference: Mark 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: yo
  text: Àwọn náà sì lọ, wọ́n sì ròyìn rẹ̀ fún àwọn tó kù[a]; ṣùgbọ́n àwọn náà kò gbà wọ́n gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwọn yòókù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Àwọn náà sì
  rationale: Ọ̀rọ̀ náà darapọ̀ mọ́ ‘àti àwọn náà’; ìtumọ̀ yìí tọ́ka sí àwọn ọmọ-ẹ̀yìn méjèèjì láì fi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἀπελθόντες
  choice: lọ
  rationale: Aorist participle náà fi hàn pé wọ́n kọ́kọ́ lọ kí wọ́n tó ròyìn; èdè Yorùbá àdánidá lè fi àwọn ọ̀rọ̀-ìṣe tẹ̀ lé ara wọn láti pa ìtẹ̀lé iṣẹ́ náà mọ́.
- source_word: ἀπήγγειλαν
  choice: ròyìn rẹ̀
  rationale: ‘Ròyìn’ bá ìtumọ̀ jíjíṣẹ́ tàbí sísọ ohun tí ó ṣẹlẹ̀ mu; ‘rẹ̀’ jẹ́ ohun tí a mú láti inú àyíká ọ̀rọ̀ nítorí Gíríìkì kò sọ ohun tí wọ́n ròyìn ní gbangba.
- source_word: τοῖς λοιποῖς
  choice: fún àwọn tó kù
  rationale: λοιπός ń tọ́ka sí àwọn ọmọ ẹgbẹ́ yòókù; ‘àwọn tó kù’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ṣàdánidá.
- source_word: οὐδὲ
  choice: ṣùgbọ́n àwọn náà kò ... gbọ́
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà ìtàn hàn, ‘àwọn náà’ sì mú agbára àfikún οὐδέ jáde pé ẹgbẹ́ yìí pẹ̀lú kò gbàgbọ́.
- source_word: ἐκείνοις
  choice: wọ́n
  rationale: Àrọ́pò-orúkọ náà tọ́ka padà sí àwọn méjèèjì tí wọ́n ròyìn; nínú gbólóhùn Yorùbá ‘gbà wọ́n gbọ́,’ ‘wọ́n’ jẹ́ ohun tí wọ́n kò gba gbọ́.
- source_word: ἐπίστευσαν
  choice: kò gbà wọ́n gbọ́
  rationale: Nínú àyíká ìtàn yìí, πιστεύω túmọ̀ sí gbígba ẹ̀rí tàbí ọ̀rọ̀ ẹni gbọ́; ‘gbà wọ́n gbọ́’ dá ìtumọ̀ náà dúró láì yí i sí ìgbẹ́kẹ̀lé ẹlẹ́kọ̀ọ́gbọ́n.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω nínú àyíká ẹ̀rí ìtàn
  choice: kò gbà wọ́n gbọ́
  alternative: kò ní ìgbẹ́kẹ̀lé nínú wọn
  rationale: Ẹsẹ̀ yìí ń sọ nípa kíkọ̀ láti gba ìròyìn àwọn méjèèjì gbọ́, kì í ṣe ní pàtàkì nípa ìgbẹ́kẹ̀lé ara ẹni tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. Àmì ohùn ni a lò níbi tó yẹ; a pa ìtẹ̀lé ìṣe àti agbára ‘àwọn náà’ mọ́ láì sọ pé ‘ọkùnrin’ níbi tí orísun kò ti sọ ọ́ ní tààrà.
