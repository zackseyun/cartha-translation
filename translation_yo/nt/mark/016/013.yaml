  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ‘Àwọn náà sì’ ń gbé κἀκεῖνοι (“àti àwọn náà”) jáde; ‘lọ, wọ́n sì ròyìn’ ń pa ìtẹ̀lé ἀπελθόντες ... ἀπήγγειλαν mọ́; ‘fún àwọn tó kù’ yẹ fún τοῖς λοιποῖς; ‘kò gbà wọ́n gbọ́’ sì ń sọ ìkọ̀ láti gba ẹ̀rí àwọn méjèèjì gbọ́, gẹ́gẹ́ bí ἐκείνοις ἐπίστευσαν. ‘Ṣùgbọ́n’ pẹ̀lú ‘àwọn náà’ ń mú ìyípadà ìtàn àti agbára àfikún οὐδέ jáde ní ti ara Yorùbá.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé tó rọrùn, tí ìlò ‘ròyìn rẹ̀ fún,’ ‘àwọn tó kù,’ àti ‘gbà wọ́n gbọ́’ sì jẹ́ ti ara. Àmì ohùn àti ìkọ̀wé náà péye. Àrọ́pò-orúkọ ‘àwọn náà’ nínú apá kejì lè tọ́ka sí àwọn tó kù láti inú àyíká ọ̀rọ̀, nígbà tí ‘wọ́n’ jẹ́ àwọn méjèèjì tó ròyìn.
  terminology: A ti lo ‘gbà ... gbọ́’ ní ìtumọ̀ gbígba ìròyìn tàbí ẹ̀rí gbọ́, kì í ṣe ìtumọ̀ ẹ̀kọ́ ìsìn tí ó lè pọ̀ ju ohun tí πιστεύω túmọ̀ sí nínú àyíká yìí. Ìsọ̀rọ̀ ‘àwọn náà’ kò fi akọ tàbí ‘ọkùnrin’ kún orísun. Àfikún àlàyé ẹsẹ̀ abẹ́lẹ̀ náà jẹ́ àṣàyàn tó bófin mu fún λοιποί.
