id: MRK.16.18
reference: Mark 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: yo
  text: Wọ́n yóò gbé àwọn ejò[a][b]; bí wọ́n bá tilẹ̀ mu ohunkóhun tó lè fa ikú[c], kò ní ṣe wọ́n léṣe rárá. Wọ́n yóò gbé ọwọ́ lé àwọn aláìsàn, wọ́n yóò sì sàn[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ ìjímìjí kan kò ní Máàkù 16:9–20; ẹsẹ yìí wà nínú òpin gígùn Ìhìnrere Máàkù.
    reason: textual_variant
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ejò”; kò sọ pé ejò olóró nìkan ni.
    reason: lexical_clarification
  - marker: c
    text: Ní tààràtà, “ohun apaniláyà èyíkéyìí”; gbólóhùn náà gbòòrò, kò sì mọ́ sí májèlé nìkan.
    reason: lexical_alternative
  - marker: d
    text: Ní tààràtà, “wọ́n yóò wà dáadáa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: àwọn ejò
  rationale: “Ejò” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ Gíríìkì mu láìfi kún un pé ejò olóró ni.
- source_word: ἀροῦσιν
  choice: yóò gbé ...
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé tàbí mímú ohun sókè; “gbé àwọn ejò” jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà ní Yorùbá.
- source_word: κἂν
  choice: bí ... tilẹ̀
  rationale: 'Èyí mú agbára ìtumọ̀ ìfàyègbà náà jáde: kódà bí ohun tí a sọ bá ṣẹlẹ̀.'
- source_word: θανάσιμόν τι
  choice: ohunkóhun tó lè pani
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ohun tó lè fa ikú mọ́, láìdín un kù sí májèlé nìkan.
- source_word: οὐ μὴ ... βλάψῃ
  choice: kò ní ṣe wọ́n léṣe rárá
  rationale: “Rárá” fi ìtẹnumọ́ líle ti οὐ μή hàn, “ṣe ... léṣe” sì jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìpalára hàn.
- source_word: χεῖρας ἐπιθήσουσιν
  choice: yóò gbé ọwọ́ lé
  rationale: Èyí ni gbólóhùn Yorùbá tó mọ́, tó sì pa àwòrán fífi ọwọ́ lé ènìyàn mọ́.
- source_word: ἀρρώστους
  choice: àwọn aláìsàn
  rationale: Ó tọ́ka sí àwọn ènìyàn tí àìsàn ń ṣe ní ọ̀nà tó ṣe kedere, tó sì bọ́gbọ́n mu ní Yorùbá òde òní.
- source_word: καλῶς ἕξουσιν
  choice: ara wọn yóò dá
  rationale: Bí ó tilẹ̀ jẹ́ pé ní tààràtà ó túmọ̀ sí “wọn yóò wà dáadáa,” “ara wọn yóò dá” sọ ìmúláradá àwọn aláìsàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú ààbò àti ìwòsàn tí ẹsẹ náà ṣèlérí
  choice: A túmọ̀ àwọn ìṣe àti àbájáde ọjọ́ iwájú náà ní tààràtà, láìfi àlàyé kún un nípa bóyá wọ́n wúlò fún gbogbo onígbàgbọ́ ní gbogbo àkókò.
  alternative: Kí a sọ pé àwọn àmì wọ̀nyí jẹ́ dandan fún gbogbo onígbàgbọ́; tàbí pé wọ́n mọ sí àkókò àwọn aposteli nìkan; tàbí pé àpẹẹrẹ lásán ni.
  rationale: Gíríìkì sọ àwọn ìṣe àti àbájáde náà ní kedere, ṣùgbọ́n kò dáhùn àwọn ìjiyàn ẹ̀kọ́ ìgbàgbọ́ wọ̀nyí; ìtumọ̀ kò gbọ́dọ̀ yan ẹgbẹ́ kan láìní ẹ̀rí nínú ọ̀rọ̀ náà.
- issue: Ipò ẹ̀rí àfọwọ́kọ fún Máàkù 16:9–20
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ó ṣe wà nínú SBLGNT tí a pèsè, a sì sọ ìṣòro ẹ̀rí àfọwọ́kọ náà nínú àlàyé ìsàlẹ̀.
  alternative: Kí a yọ ẹsẹ náà kúrò tàbí kí a fi sínú àmì àkámọ́ nínú ọ̀rọ̀ pàtàkì.
  rationale: Orísun tí a pèsè ní ẹsẹ náà, ṣùgbọ́n àìsí òpin gígùn Máàkù nínú àwọn àfọwọ́kọ ìjímìjí kan jẹ́ ọ̀ràn pàtàkì tí ó yẹ kí òǹkàwé mọ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Ara wọn yóò dá” jẹ́ gbólóhùn àdánidá fún ìmúláradá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tààràtà mọ́.
