revisions:
- from: Wọ́n yóò gbé àwọn ejò[a][b]; bí wọ́n tilẹ̀ mu ohunkóhun tó lè pani[c], kò ní ṣe wọ́n léṣe rárá. Wọ́n yóò gbé ọwọ́ lé àwọn aláìsàn, ara wọn yóò sì dá[d].
  to: Wọ́n yóò gbé àwọn ejò[a][b]; bí wọ́n bá tilẹ̀ mu ohunkóhun tó lè fa ikú[c], kò ní ṣe wọ́n léṣe rárá. Wọ́n yóò gbé ọwọ́ lé àwọn aláìsàn, wọ́n yóò sì sàn[d].
