  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó pa ìṣe gbígbé ejò, ìpohùnrere ìkọ̀sílẹ̀, ìpalára tí a sẹ́ pátápátá, fífi ọwọ́ lé aláìsàn, àti ìmúláradá mọ́. Ṣùgbọ́n “ohunkóhun tó lè pani” lè ka sí “ohun tó lè pa mí,” kì í sì ṣe ìfihàn tí ó dájú fún ‘ohun apaniláyà/ohun tó lè fa ikú.’'
  naturalness: “Bí wọ́n bá tilẹ̀ mu” jẹ́ ìpò-ìṣe Yorùbá tó péye fún κἂν. “Wọ́n yóò sì sàn” jẹ́ ọ̀nà kedere, adayeba fún àwọn aláìsàn láti ‘wà dáadáa’ nínú àyíká ọ̀rọ̀ yìí. A tún tún gírámà àlàyé ìsàlẹ̀ a ṣe.
  terminology: “Ejò,” “aláìsàn,” àti “gbé ọwọ́ lé” bá ìforúkọsílẹ̀ Yorùbá ìjọsìn/ìwé mímọ́ òde òní mu. “Ohunkóhun tó lè fa ikú” pa gbígbòòrò θανάσιμόν τι mọ́ láìdín un kù sí májèlé.
