source:
  edition: SBLGNT
  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: yo
  text: Wọ́n sì ń sọ fún ara wọn pé, “Ta ni yóò yí òkúta náà kúrò ní ẹnu ibojì fún wa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “wọ́n ń sọ” pa ìrísí yìí mọ́.
- source_word: πρὸς ἑαυτάς
  choice: fún ara wọn
  rationale: Ní ọ̀pọ̀ ènìyàn, gbólóhùn náà ní ìtumọ̀ pé àwọn obìnrin náà ń bá ara wọn sọ̀rọ̀; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ “sí ara wọn.”
- source_word: Τίς
  choice: Ta ni
  rationale: Èyí jẹ́ ìbéèrè nípa ẹni tí yóò ṣe iṣẹ́ náà; “Ta ni” ni ìbámu àdánidá.
- source_word: ἀποκυλίσει
  choice: yóò yí ... kúrò
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí yí ohun kan kúrò ní ibi tí ó wà; yíyí òkúta kúrò pa àwòrán gidi inú orísun mọ́.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dátífù náà ń sọ pé ẹnì kan yóò ṣe iṣẹ́ náà ní àǹfààní wọn tàbí dípò wọn.
- source_word: τὸν λίθον
  choice: òkúta náà
  rationale: Orísun sọ “òkúta” láìfi “ńlá” kún un; a kò fi àlàyé tí kò sí nínú ẹsẹ yìí kún ọ̀rọ̀ náà.
- source_word: ἐκ τῆς θύρας
  choice: kúrò ní ẹnu
  rationale: θύρα lè túmọ̀ sí ilẹ̀kùn tàbí ẹnu ọ̀nà. Nípa ibojì àpáta, “ẹnu ibojì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu ju fífi ilẹ̀kùn onígi hàn lọ.
- source_word: τοῦ μνημείου
  choice: ibojì
  rationale: Ní àyíká yìí, μνημεῖον jẹ́ ibi tí a sin òkú sí; “ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A pa ìrísí ọ̀rọ̀-ìṣe àìpé mọ́ pẹ̀lú “ń sọ,” a sì lo “ẹnu ibojì” fún ṣíṣí ibojì láìdá èrò ilẹ̀kùn onígi sí ọ̀rọ̀ náà. Kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún un.
