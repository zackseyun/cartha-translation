  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: yo
  text: Nígbà tí wọ́n sì gbójú sókè, wọ́n rí i pé a ti yí òkúta náà kúrò,[a] nítorí ó tóbi gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kíyè sí i pé a ti yí òkúta náà kúrò.” Ọ̀rọ̀-ìṣe perfect ní Gíríìkì tẹnumọ́ pé òkúta náà ti wà ní ipò tí a ti yí i kúrò nígbà tí wọ́n rí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nígbà tí ... sì
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì jẹ́ kí gbolohun náà ṣàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀναβλέψασαι
  choice: wọ́n gbójú sókè
  rationale: Ó fi hàn pé àwọn obìnrin náà gbé ojú wọn sókè sí ibi ibojì; ìtumọ̀ yìí pa ipa participle náà mọ́ nínú gbólóhùn àkókò Yorùbá.
- source_word: θεωροῦσιν
  choice: wọ́n rí i
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà tọ́ka sí ohun tí wọ́n fi ojú rí, ‘wọ́n rí i’ sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ ohun tí wọ́n rí.
- source_word: ἀποκεκύλισται
  choice: a ti yí ... kúrò
  rationale: 'Fọ́ọ̀mù perfect passive náà fi iṣẹ́ tí a ti ṣe àti ipò tó ń bá a lọ hàn: nígbà tí wọ́n rí òkúta náà, ó ti kúrò ní ẹnu ibojì.'
- source_word: ὁ λίθος
  choice: òkúta náà
  rationale: Ó tọ́ka sí òkúta tí a fi dí ẹnu ibojì; kò pọndandan láti fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: nítorí ó tóbi gidigidi
  rationale: ‘Nítorí’ pa ipa ìṣàlàyé γάρ mọ́, ‘tóbi gidigidi’ sì mú ìtẹnumọ́ σφόδρα jáde ní Yorùbá òde òní.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘a ti yí’ láti fi ohùn aláìsọ ẹni tó ṣe iṣẹ́ àti ipò tó jẹ́ àbájáde perfect passive hàn.
