  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì mọ́ dáadáa: àṣẹ méjèèjì, dídárúkọ Peteru lọ́tọ̀, Jesu tí ó ń lọ ṣáájú wọn sí Galili, àti ìlérí pé wọn yóò rí i. Bí ó tilẹ̀ rí bẹ́ẹ̀, ‘ẹ ó ti rí i’ lè ní ìtumọ̀ ọjọ́-ìwájú-pípé (‘ẹ yóò ti rí i’), níbi tí ὄψεσθε jẹ́ ọjọ́-ìwájú lasan. ‘Ẹ ó rí i’ pa ìtumọ̀ náà mọ́ pẹkipẹki.'
