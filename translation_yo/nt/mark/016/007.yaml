id: MRK.16.7
reference: Mark 16:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: yo
  text: Ṣùgbọ́n ẹ lọ[a], ẹ sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ àti fún Peteru pé, “Ó ń lọ ṣáájú yín sí Galili. Ní ibẹ̀ ni ẹ ó rí i[b], gẹ́gẹ́ bí ó ti sọ fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A dárúkọ Peteru lọ́tọ̀ sí “àwọn ọmọ-ẹ̀yìn rẹ̀.” Èyí lè tẹnumọ́ ìmúpadàbọ̀sípò rẹ̀ lẹ́yìn tí ó sẹ́ Jesu, ṣùgbọ́n èdè Gíríìkì kò sọ ní tààrà pé “pàápàá jù lọ Peteru.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Ní Galili ni ẹ ó rí i.” Ọ̀rọ̀ ìtọ́ka ibi nínú Gíríìkì lè jẹ́ “sí Galili” tàbí “wọ inú Galili” ní àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ohun tó ṣáájú àti àṣẹ tí wọ́n ń fún àwọn obìnrin náà.
- source_word: ὑπάγετε
  choice: ẹ lọ
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni; ọ̀rọ̀ yìí jẹ́ ti àdánidá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: εἴπατε
  choice: ẹ sọ fún
  rationale: Ó bá ọ̀nà Yorùbá ti àdánidá mu fún jíjíṣẹ́ ọ̀rọ̀ kan fún àwọn olùgbà.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀ àti fún Peteru
  rationale: Ó pa ìdásílẹ̀ Peteru lọ́tọ̀ mọ́ láìfi ìtumọ̀ bí ‘ní pàtàkì’ kún ọ̀rọ̀ Gíríìkì.
- source_word: Προάγει ὑμᾶς
  choice: Ó ń lọ síwájú yín
  rationale: Ó sọ ìrìn Jesu tí ó ṣáájú ti àwọn ọmọ-ẹ̀yìn rẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: ‘Sí’ lè túmọ̀ ìlọ sí ibi kan ní ti àdánidá; ó sì pa àfojúsùn ìrìn náà mọ́.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Ní ibẹ̀ ni ẹ ó ti rí i
  rationale: Ìṣètò yìí tẹ ibi tí wọ́n yóò ti rí Jesu mọ́, gẹ́gẹ́ bí ἐκεῖ ṣe wà ní ipò ìtẹnumọ́.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: gẹ́gẹ́ bí ó ti sọ fún yín
  rationale: Ó pa ìbámu pẹ̀lú ohun tí Jesu ti sọ tẹ́lẹ̀ mọ́ ní èdè Yorùbá tó rọrùn.
theological_decisions:
- issue: Dídárúkọ Peteru lọ́tọ̀ lẹ́yìn ‘àwọn ọmọ-ẹ̀yìn rẹ̀’
  choice: Pa ọ̀rọ̀ ìsopọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn ọmọ-ẹ̀yìn rẹ̀ àti Peteru.’
  alternative: àwọn ọmọ-ẹ̀yìn rẹ̀, pàápàá jù lọ Peteru; àwọn ọmọ-ẹ̀yìn rẹ̀, títí kan Peteru
  rationale: Gíríìkì dárúkọ Peteru lọ́tọ̀, ṣùgbọ́n kò sọ ní tààrà pé ‘pàápàá jù lọ’ tàbí ‘títí kan.’ Ìtumọ̀ náà kò pinnu ìdí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ lọ, ẹ sọ’ jẹ́ kedere fún òǹkàwé gbogbogbò, a sì yà ọ̀rọ̀ tí wọ́n ní kí wọ́n jíṣẹ́ sọ́tọ̀ pẹ̀lú àmì àyọlò.
