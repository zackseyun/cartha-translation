base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: yo
  text: Àwọn náà sì kò gbàgbọ́ nígbà tí wọ́n gbọ́ pé ó wà láàyè[a] àti pé obìnrin náà ti rí i[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń bẹ láàyè” tàbí “ó yè.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní àkókò ìsinsìnyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a rí i láti ọwọ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà wà ní ohùn passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Àwọn náà sì
  rationale: Ó pa ìtẹ̀síwájú ìtàn àti ìtọ́ka sí ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ́; “sì” tún gbé agbára καί jáde láìfi ìtumọ̀ kún un.
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Aorist participle náà ń tọ́ka sí àkókò níbí; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí ohun tí wọ́n gbọ́ sílẹ̀ lọ́nà Yorùbá tó ṣe kedere.
- source_word: ζῇ
  choice: ó wà láàyè
  rationale: Ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí, ó sì ń sọ pé Jésù ń bẹ láàyè lẹ́yìn ikú. “Ó wà láàyè” jẹ́ ọ̀nà Yorùbá tó bójú mu, tí kò sọ ìwàláàyè náà di ohun tó ti kọjá.
- source_word: καὶ
  choice: àti pé
  rationale: 'Ó so àwọn ohun méjì tí wọ́n gbọ́ pọ̀: pé ó wà láàyè àti pé obìnrin náà ti rí i.'
- source_word: ἐθεάθη
  choice: obìnrin náà ti rí i
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ passive, Yorùbá máa ń lo gbólóhùn active yìí lọ́nà àdánidá; ó pa ojú-ìwòye pé obìnrin náà rí i mọ́, dípò títúmọ̀ rẹ̀ sí “ó farahàn,” èyí tó lè fi ìtumọ̀ míì kún un.
- source_word: ὑπ’ αὐτῆς
  choice: obìnrin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ abo náà ń tọ́ka padà sí obìnrin tí a mẹ́nu kàn ṣáájú. “Obìnrin náà” mú ìtọ́kasí náà ṣe kedere láìfi orúkọ Màríà kún ẹsẹ yìí.
- source_word: ἠπίστησαν
  choice: wọn kò gbàgbọ́
  rationale: Ó túmọ̀ sí pé wọn kò gba ìròyìn náà gbọ́; yíyan ọ̀rọ̀ yìí kò fi agbára “wọ́n kọ̀ láti gbàgbọ́” kún ohun tí ẹsẹ náà sọ.
theological_decisions:
- issue: Bí a ṣe sọ ìwàláàyè lẹ́yìn àjíǹde
  choice: ó wà láàyè
  alternative: ó ń bẹ láàyè; ó yè
  rationale: Present ζῇ sọ pé ó ń bẹ láàyè. Yorùbá “ó wà láàyè” jẹ́ present ní ti ara rẹ̀, ó sì pa ìtumọ̀ ìwàláàyè tó ń bá a lọ mọ́ láìyanjú ju ohun tí Gíríìkì sọ lọ.
- issue: Passive ἐθεάθη àti ẹni tó rí i
  choice: obìnrin náà ti rí i
  alternative: a ti rí i láti ọwọ́ obìnrin náà; ó farahàn fún obìnrin náà
  rationale: Active jẹ́ ọ̀nà Yorùbá tó rọrùn jù lọ láti sọ passive yìí. A kò yan “ó farahàn” nínú ọ̀rọ̀ àkọ́kọ́, nítorí ó lè yí ojú-ìwòye náà sí ìfarahàn ara ẹni ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo active ní apá kejì fún àdánidá èdè Yorùbá, a sì ṣàkọsílẹ̀ passive Gíríìkì nínú àlàyé ìsàlẹ̀.
