  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: yo
  text: 'Àwọn àmì wọ̀nyí yóò sì bá àwọn tí ó ti gbàgbọ́ lọ[a]: ní orúkọ mi ni wọn yóò fi lé àwọn ẹ̀mí èṣù jáde; wọn yóò sọ̀rọ̀ ní ahọ́n tuntun[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “yóò tẹ̀ lé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé àwọn àmì wọ̀nyí yóò máa wà pẹ̀lú àwọn tí ó ti gbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn èdè tuntun.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn èdè lápapọ̀; “ahọ́n tuntun” pa àìdánilójú ọ̀rọ̀ náà mọ́ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: “Àmì” pa ìtumọ̀ ohun tí ń tọ́ka sí tàbí tí ń jẹ́rìí sí ohun kan mọ́, dípò kí a túmọ̀ rẹ̀ ní pàtó sí iṣẹ́ ìyanu.
- source_word: τοῖς πιστεύσασιν
  choice: àwọn tí ó ti gbàgbọ́
  rationale: Ọ̀rọ̀ yìí fi ìgbàgbọ́ tí wọ́n ti wọ inú rẹ̀ hàn, síbẹ̀ ó ń tọ́ka sí irú àwọn ènìyàn bẹ́ẹ̀ lápapọ̀.
- source_word: ταῦτα
  choice: wọ̀nyí
  rationale: Ọ̀rọ̀ atọ́ka yìí ń tọ́ka sí àwọn àmì tí a bẹ̀rẹ̀ sí í tò lẹ́yìn rẹ̀.
- source_word: παρακολουθήσει
  choice: yóò bá ... lọ
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí pé àwọn àmì náà yóò máa wà pẹ̀lú àwọn onígbàgbọ́, kì í ṣe pé wọn yóò kàn tẹ̀ lé wọn ní ìtẹ̀síwájú àkókò.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi ni ... fi
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a ṣe ohun kan lábẹ́ àṣẹ ẹni tí a dárúkọ.
- source_word: δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere fún àwọn ẹ̀dá ẹ̀mí búburú tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí, láì fi gbólóhùn mìíràn bí “ẹ̀mí àìmọ́” rọ́pò rẹ̀.
- source_word: ἐκβαλοῦσιν
  choice: wọn yóò ... lé ... jáde
  rationale: “Lé ... jáde” fi ipa ìmúkúrò tí ọ̀rọ̀ náà ní nínú àyíká yìí hàn ní Yorùbá àdánidá.
- source_word: γλώσσαις
  choice: àwọn ahọ́n
  rationale: “Ahọ́n” lè tọ́ka sí ẹ̀yà ara tàbí sí èdè/ọ̀nà ọ̀rọ̀, nítorí náà ó pa àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́ ju yíyan “èdè” nìkan lọ.
- source_word: λαλήσουσιν
  choice: wọn yóò sọ̀rọ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe déédéé, tí ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mu.
- source_word: καιναῖς
  choice: tuntun
  rationale: “Tuntun” fi ìtumọ̀ ohun tuntun ní irú tàbí ìwà rẹ̀ hàn láì pinnu síwájú sí i nípa bí àwọn ahọ́n náà ṣe rí.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ahọ́n tuntun”
  choice: A lo “àwọn ahọ́n tuntun” láì sọ pé ó dájú pé àwọn èdè ènìyàn ni tàbí ọ̀rọ̀ amúnisìn ẹ̀mí.
  alternative: “àwọn èdè tuntun” tàbí ọ̀rọ̀ tí ó sọ ọ́ di àsọjáde ẹ̀mí ní pàtó
  rationale: γλώσσαις lè túmọ̀ sí àwọn èdè, ṣùgbọ́n ẹsẹ̀ náà kò ṣàlàyé irú ọ̀rọ̀ yìí ní kíkún. “Àwọn ahọ́n” pa àìdánilójú àti ìfàsẹ́yìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì yan àwọn gbólóhùn àdánidá bí “bá ... lọ” àti “lé ... jáde.”
