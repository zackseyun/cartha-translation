id: MRK.16.9
reference: Mark 16:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: yo
  text: Lẹ́yìn tí ó jíǹde[a], ní kùtùkùtù, ní ọjọ́ kìíní ọ̀sẹ̀, ó kọ́kọ́ farahàn Màríà ará Mágídálà, ẹni tí Jesu ti lé ẹ̀mí èṣù méje jáde lára rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ 9–20 kò sí nínú àwọn ìwé àfọwọ́kọ ìgbàanì kan ti Máàkù; àwọn ìwé àfọwọ́kọ mìíràn ní wọn, nígbà míì pẹ̀lú ìyàtọ̀.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Lẹ́yìn tí ó jíǹde
  rationale: Aorist participle náà ní agbára àkókò ní ìbáṣepọ̀ pẹ̀lú ἐφάνη; gbolohun yìí fi hàn ní Yorùbá àdánidá pé jíjíǹde ṣẹlẹ̀ ṣáájú ìfarahàn.
- source_word: δὲ
  choice: —
  rationale: δέ jẹ́ àsopọ̀ fẹ́ẹ́rẹ́; a kò túmọ̀ rẹ̀ ní ọ̀tọ̀ nítorí ìṣàn gbolohun Yorùbá kò nílò àsopọ̀ míì níbí, bẹ́ẹ̀ ni a kò fẹ́ fi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: πρωῒ
  choice: ní kùtùkùtù
  rationale: Ọ̀rọ̀ náà tọ́ka sí àárọ̀ kutukutu; ‘ní kùtùkùtù’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: πρώτῃ σαββάτου
  choice: ọjọ́ kìíní ọ̀sẹ̀
  rationale: Èyí ni ìtumọ̀ àṣà ọ̀rọ̀ Gíríìkì-Júù fún ọjọ́ àkọ́kọ́ ọ̀sẹ̀; ó ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐφάνη
  choice: ó farahàn
  rationale: Fọ́ọ̀mù yìí ní àyíká ìjíǹde túmọ̀ sí pé ó fi ara rẹ̀ hàn tàbí ó di ẹni tí a rí; ‘farahàn’ jẹ́ ìbámu Yorùbá tó bójú mu.
- source_word: πρῶτον
  choice: ó kọ́kọ́
  rationale: Ó ń tọ́ka sí ìtẹ̀lé àwọn ìfarahàn; ‘kọ́kọ́’ pa agbára yẹn mọ́ ní Yorùbá àdánidá.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: Màríà ará Mágídálà
  rationale: A lo orúkọ Màríà, a sì sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú Mágídálà ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: παρ’ ἧς
  choice: lára rẹ̀
  rationale: Pẹ̀lú ἐκβεβλήκει, ó fi ẹni tí a lé àwọn ẹ̀mí èṣù jáde kúrò lára rẹ̀ hàn; èyí jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἐκβεβλήκει
  choice: ó ti lé ... jáde
  rationale: Pluperfect náà fi iṣẹ́ tó ti ṣẹlẹ̀ ṣáájú ìfarahàn hàn; ‘ó ti lé ... jáde’ pa ìtẹ̀lé àkókò mọ́.
- source_word: ἑπτὰ δαιμόνια
  choice: ẹ̀mí èṣù méje
  rationale: Nínú àyíká ìlé ẹ̀mí jáde nínú àwọn Ìhìn Rere, δαιμόνια tọ́ka sí àwọn ẹ̀mí èṣù; a pa nọ́ńbà méje mọ́ gẹ́gẹ́ bí orísun.
theological_decisions:
- issue: Ipò àríyànjiyàn ti Máàkù 16:9 nínú òpin gígùn ti Máàkù
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ó ṣe wà nínú SBLGNT tí a pèsè, a sì fi àlàyé ìyàtọ̀ inú àwọn ìwé àfọwọ́kọ sí àlàyé ìsàlẹ̀.
  alternative: Àwọn ìwé àfọwọ́kọ ìgbàanì kan parí Máàkù ní 16:8, wọn kò sì ní 16:9–20; àwọn mìíràn ní àwọn ẹsẹ náà, nígbà míì pẹ̀lú ìyàtọ̀.
  rationale: Àkọsílẹ̀ Gíríìkì tí a pèsè ní ẹsẹ náà ṣùgbọ́n ó fi àmì àríyànjiyàn yí i ká. Túmọ̀ rẹ̀, kí a sì sọ ẹ̀rí àfọwọ́kọ ní kedere, ń pa ìṣòro ọ̀rọ̀ mọ́ láìdájọ́ rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘jíǹde,’ ‘farahàn,’ àti ‘lé ẹ̀mí èṣù ... jáde’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Yorùbá tó wọ́pọ̀ nínú àyíká Bíbélì láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
