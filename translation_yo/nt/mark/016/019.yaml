  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí Olúwa Jésù ti sọ̀rọ̀ fún wọn, a gbé e sókè lọ sí ọ̀run, ó sì jókòó ní ọwọ́ ọ̀tún Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ Gíríìkì àtijọ́ kan tí ó ṣe pàtàkì jù lọ kò ní Máàkù 16:9–20; àwọn ẹlẹ́rìí àtijọ́ mìíràn ní àwọn ẹsẹ wọ̀nyí.
    reason: Láti jẹ́ kí òǹkàwé mọ ìyàtọ̀ pàtàkì nínú àwọn ẹ̀rí àfọwọ́kọ nípa ìparí Ìhìn Rere Máàkù.
lexical_decisions:
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń ṣe àmì ìyípadà nínú ìtàn, ó sì tún ní agbára ìparí tàbí àbájáde. “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára náà hàn.
- source_word: κύριος Ἰησοῦς
  choice: Olúwa Jésù
  rationale: “Olúwa” pa ìwúwo κύριος mọ́ gẹ́gẹ́ bí oyè Kristi, “Jésù” sì jẹ́ orúkọ ẹni náà ní Yorùbá.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: lẹ́yìn tí ... ti bá wọn sọ̀rọ̀
  rationale: Ìṣètò μετά pẹ̀lú infinitive oní-àpilẹ̀kọ jẹ́ ti àkókò, ìtumọ̀ rẹ̀ sì ni “lẹ́yìn.” Gbólóhùn Yorùbá yìí sọ ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ náà lọ́nà àdánidá.
- source_word: ἀνελήμφθη
  choice: a gbé e sókè
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ aláìṣe, ó sì túmọ̀ sí pé ẹlòmíràn gbé e sókè. Ìlò “a” aláìsọ ẹni ní pàtó jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára aláìṣe náà mọ́ láìfi ẹni tí ó ṣe é kún ọ̀rọ̀.
- source_word: εἰς τὸν οὐρανόν
  choice: lọ sí ọ̀run
  rationale: Èyí pa ìdarí ìlọ tí εἰς fi hàn mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ἐκάθισεν
  choice: ó sì jókòó
  rationale: “Jókòó” fi ìṣe tí ó parí hàn ní Yorùbá àdánidá, gẹ́gẹ́ bí aorist Gíríìkì ṣe sọ.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti àṣà ọ̀rọ̀ Gíríìkì náà, ó sì pa àwòrán ipò ọlá ní ọwọ́ ọ̀tún Ọlọ́run mọ́.
theological_decisions:
- issue: Bí a ṣe máa sọ nípa gbígbé Jésù lọ sí ọ̀run àti jíjókòó rẹ̀ ní ọwọ́ ọ̀tún Ọlọ́run láìfi ẹ̀kọ́ mìíràn kún un
  choice: a gbé e sókè lọ sí ọ̀run, ó sì jókòó ní ọwọ́ ọ̀tún Ọlọ́run
  alternative: a gbà á lọ sí ọ̀run, ó sì gba ipò rẹ̀ ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: 'Àṣàyàn náà tẹ̀ lé àwọn ìṣe méjèèjì tí ọ̀rọ̀ Gíríìkì sọ ní tààrà: a gbé Jésù lọ sí ọ̀run, ó sì jókòó ní ọwọ́ ọ̀tún Ọlọ́run. Kò ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.'
- issue: Bí a ṣe máa tú κύριος gẹ́gẹ́ bí oyè Kristi
  choice: Olúwa Jésù
  alternative: Ọ̀gá Jésù
  rationale: “Olúwa” pa ìtumọ̀ ẹ̀sìn àti ìwúwo oyè náà mọ́; “Ọ̀gá” lè dín un kù sí oyè àwùjọ lásán.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà pa ìtẹ̀lé àti irú àwọn ìṣe Gíríìkì mọ́ ní Yorùbá àdánidá.
