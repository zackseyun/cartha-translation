id: MRK.16.1
reference: Mark 16:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: yo
  text: Nígbà tí ọjọ́ Ìsinmi sì kọjá, Màríà ará Magdala, Màríà ìyá Jákọ́bù[a], àti Salómè ra àwọn èròjà olóòórùn dídùn, kí wọ́n lè lọ fi kùn ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ní ti gidi, “Màríà ẹni ti Jákọ́bù”; ìyẹn ni pé, a fi ìbátan rẹ̀ pẹ̀lú Jákọ́bù dá a mọ̀. Àṣà ti sábà máa ń lóye rẹ̀ sí ìyá Jákọ́bù.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Nígbà tí ọjọ́ Ìsinmi sì kọjá
  rationale: Gbólóhùn olùní ti Gíríìkì ń tọ́ka sí àkókò tí ó ṣáájú ìṣe pàtàkì náà. Èyí jẹ́ Yorùbá àdánidá fún ‘nígbà tí Sábáàtì parí/kọjá.’
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Màríà ará Magdala
  rationale: Orúkọ ìdámọ̀ náà túmọ̀ sí Màríà tí ó jẹ́ ará Magdala; yíyan ‘ará Magdala’ mú ìtumọ̀ rẹ̀ hàn kedere ní Yorùbá.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Màríà ìyá Jákọ́bù[a]
  rationale: Gbólóhùn Gíríìkì náà fi Màríà mọ̀ nípa ìbátan rẹ̀ pẹ̀lú Jákọ́bù láì sọ irú ìbátan náà ní tààràtà. ‘Ìyá Jákọ́bù’ bá ìlò inú ìtàn Ìhìn Rere mu, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àìdánilójú inú ọ̀rọ̀ Gíríìkì pamọ́.
- source_word: Σαλώμη
  choice: Salómè
  rationale: Ìkọ̀wé orúkọ náà ní Yorùbá pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá.
- source_word: ἠγόρασαν
  choice: ra
  rationale: Ọ̀rọ̀-ìṣe ìtàn aorist rírọrùn ni; ‘ra’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù.
- source_word: ἀρώματα
  choice: àwọn èròjà olóòórùn dídùn
  rationale: Ó ń tọ́ka sí àwọn ohun olóòórùn tí a máa ń lò láti pèsè òkú sílẹ̀. ‘Èròjà olóòórùn dídùn’ yẹra fún dídín ìtumọ̀ náà kù sí turari jíjẹ tàbí lọ́fíńdà nìkan.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: kí wọ́n lè wá fi kùn ún
  rationale: ‘Kí wọ́n lè’ fi ète ἵνα hàn; ‘wá’ pa ìtẹ̀lé ìṣe ἐλθοῦσαι mọ́, ‘fi kùn ún’ sì sọ lílo èròjà náà sí ara rẹ̀ gẹ́gẹ́ bí ἀλείφω ṣe túmọ̀ sí.
theological_decisions:
- issue: Ìbátan Màríà pẹ̀lú Jákọ́bù nínú gbólóhùn elliptical Μαρία ἡ τοῦ Ἰακώβου
  choice: Màríà ìyá Jákọ́bù, pẹ̀lú àmì àlàyé
  alternative: Màríà ẹni ti Jákọ́bù
  rationale: Yorùbá nílò kí a sọ irú ìbátan náà ní kedere kí gbólóhùn lè yéni. Ìtumọ̀ ‘ìyá’ bá ìdámọ̀ inú àṣà Ìhìn Rere mu, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ‘ìyá’ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá. A lo ‘ọjọ́ Ìsinmi’ fún Sábáàtì, ‘ará Magdala’ fún epithet, a sì samisi ìpèsè ‘ìyá’ nítorí àìpé ìbátan tí Gíríìkì fi sílẹ̀.
