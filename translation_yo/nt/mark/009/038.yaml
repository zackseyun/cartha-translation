id: MRK.9.38
reference: Mark 9:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: yo
  text: Johanu sọ fún un pé, “Olùkọ́, a rí ẹni kan tó ń lé àwọn ẹ̀mí èṣù jáde ní orúkọ rẹ, a sì gbìyànjú láti dá a dúró[a], nítorí kò tẹ̀ lé wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì ń dí i lọ́wọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní àkókò imperfect; ó lè ṣàpèjúwe ìṣe tí wọ́n ń ṣe léraléra tàbí ohun tí wọ́n ń gbìyànjú láti ṣe. Nítorí náà, a túmọ̀ ọ́ sí “a sì gbìyànjú láti dá a dúró.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Johanu sọ fún un pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà ìtàn lasan fún sísọ pé Johanu bá a sọ̀rọ̀; ‘sọ fún un pé’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ẹni tó ń sọ̀rọ̀ àti ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí túmọ̀ tààrà sí ẹni tí ń kọ́ni; ‘Olùkọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó péye, tó sì yàgò fún fífi oyè mìíràn kún un.
- source_word: εἴδομέν τινα
  choice: a rí ẹnì kan
  rationale: τινα kò sọ ẹni náà di mímọ̀ ní pàtó; ‘ẹnì kan’ pa àìsọ pàtó yẹn mọ́ ní Yorùbá.
- source_word: ἐν τῷ ὀνόματί σου
  choice: ní orúkọ rẹ
  rationale: Gbólóhùn yìí pa àṣà ọ̀rọ̀ Bíbélì mọ́, ó sì lè tọ́ka sí ṣíṣe ohun kan lábẹ́ àṣẹ tàbí agbára Jésù láìtúmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: tó ń lé àwọn ẹ̀mí èṣù jáde
  rationale: ‘Lé ... jáde’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìṣe yíyọ àwọn ẹ̀mí èṣù kúrò lára ẹni.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: a sì gbìyànjú láti dá a dúró
  rationale: Àkókò imperfect Gíríìkì lè fi ìṣe tó ń lọ tàbí ìgbìyànjú hàn; ‘gbìyànjú láti dá a dúró’ jẹ́ àdánidá, ó sì yàgò fún sísọ pé wọ́n ṣàṣeyọrí dájú.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: nítorí kò tẹ̀ lé wa
  rationale: ‘Wa’ túmọ̀ ἡμῖν ní tààrà, ‘tẹ̀ lé’ sì pa èrò ἀκολουθέω mọ́. Kò sọ ọ̀rọ̀ náà di ‘kò wà lára wa’ tàbí ‘kò tẹ̀ lé ọ,’ èyí sì pa ìforígbárí inú ìtàn mọ́.
theological_decisions:
- issue: Ẹni tàbí ẹgbẹ́ tí ọkùnrin náà kò tẹ̀ lé
  choice: kò tẹ̀ lé wa
  alternative: kò tẹ̀ lé ọ / kò sí lára ẹgbẹ́ wa
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘wa’ ní kedere. Mímú un wá gẹ́gẹ́ bí ‘wa’ pa bí Johanu ṣe gbé ọ̀ràn náà ka ẹgbẹ́ àwọn ọmọ-ẹ̀yìn mọ́, láìṣàtúnṣe rẹ̀ sí ohun tí Jésù yóò sọ lẹ́yìn náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ní orúkọ rẹ’ pa àṣà ọ̀rọ̀ Bíbélì mọ́, ‘kò tẹ̀ lé wa’ sì pa ìtumọ̀ àti ìforígbárí Gíríìkì mọ́.
