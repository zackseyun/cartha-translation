  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: yo
  text: Nítorí ẹni tí kò lòdì sí wa, ó wà fún wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wà ní ìhà wa.” Gbólóhùn Gíríìkì ὑπὲρ ἡμῶν tún lè ní ìtumọ̀ “ní ìhà wa” tàbí “fún àǹfààní wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà ń tọ́ka sí ẹnikẹ́ni lápapọ̀; “ẹni tí” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ gbogbogbò yìí mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ọ̀rọ̀ tó ṣáájú; “Nítorí” fi ìbáṣepọ̀ àlàyé náà hàn ní kedere.
- source_word: οὐκ ἔστιν
  choice: kò bá ... wà
  rationale: A tú ọ̀rọ̀ ìsopọ̀ tí a sẹ́ yìí sí àkójọpọ̀ Yorùbá àdánidá pẹ̀lú “lòdì sí”; àmì “bá” ń jẹ́ kí gbólóhùn gbogbogbò náà ṣàn dáadáa.
- source_word: καθ’ ἡμῶν
  choice: lòdì sí wa
  rationale: κατά pẹ̀lú genitive túmọ̀ sí ìtakò níbí; “lòdì sí wa” jẹ́ ìtumọ̀ tó ṣe kedere, tó sì bójú mu.
- source_word: ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: ὑπέρ pẹ̀lú genitive lè túmọ̀ sí “fún,” “nítorí àǹfààní,” tàbí “ní ìhà”; “fún wa” pa ìfiwéra kúkúrú pẹ̀lú “lòdì sí wa” mọ́.
- source_word: ἐστιν
  choice: ó wà
  rationale: “Ó wà” ṣe iṣẹ́ copula náà ní Yorùbá, ó sì bá àkójọpọ̀ “wà fún wa” mu.
theological_decisions:
- issue: Ìwọ̀n ìfarakanra tí “lòdì sí wa” àti “fún wa” ń sọ
  choice: Pa ọ̀rọ̀ ìbáṣepọ̀ ẹni-kìíní púpọ̀ náà mọ́ gẹ́gẹ́ bí “lòdì sí wa” àti “fún wa.”
  alternative: Ẹni tí kò lòdì sí iṣẹ́ wa wà ní ìhà tiwa; tàbí ẹni tí kò lòdì sí Ọlọ́run wà fún Ọlọ́run.
  rationale: Gíríìkì sọ “wa” ní tààràtà. A kò fẹ̀ ọ́ sí “Ọlọ́run” tàbí “iṣẹ́ ìránṣẹ́ wa,” kí a má bàa fi ìtumọ̀ ẹ̀kọ́ kan kún ohun tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò sọ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ kúkúrú àti ọ̀wọ̀, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ẹni tí kò bá” fún òwe gbogbogbò, a sì pa ìfiwéra “lòdì sí wa / fún wa” mọ́.
