id: MRK.9.12
reference: Mark 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ní tòótọ́, Èlíjà dé ṣáájú, ó sì ń mú ohun gbogbo padà bọ̀ sípò. Báwo sì ni a ṣe kọ ọ́ nípa Ọmọ Ènìyàn pé kí ó jìyà ohun púpọ̀, kí a sì kẹ́gàn rẹ̀[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a sì kà á sí ẹni asán.” Ọ̀rọ̀ Giriki náà túmọ̀ sí pé a wo ẹni náà bí ẹni tí kò ní iyì tàbí tí kò jẹ́ nǹkan kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: wí
  rationale: Ọ̀rọ̀ ìsọ̀rọ̀ ìtàn tí ó ṣe déédé; ‘wí fún wọn pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti mú ẹni tí a ń bá sọ̀rọ̀ àti ọ̀rọ̀ tí a sọ hàn.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: A lo ìrísí orúkọ yìí tí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: ἐλθὼν πρῶτον
  choice: dé ṣáájú
  rationale: Ó pa èrò pé Èlíjà ni ó kọ́kọ́ dé mọ́, ó sì yàgò fún ọ̀rọ̀ tí kò ṣàn déédé ní Yorùbá.
- source_word: ἀποκαθιστάνει
  choice: ń mú … padà bọ̀ sípò
  rationale: Ó sọ ìtumọ̀ mímú ohun padà sí ipò tí ó yẹ ní èdè Yorùbá tí ó ṣe kedere, ó sì pa ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa gbígbòòrò ọ̀rọ̀ Giriki mọ́ láì fi ohun tí ẹsẹ̀ náà kò sọ kún un.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Báwo sì ni a ṣe kọ ọ́ nípa Ọmọ Ènìyàn
  rationale: ‘A ṣe kọ ọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún àfihàn ohun tí Ìwé Mímọ́ kọ, ‘nípa’ sì mú ἐπί jáde láì túmọ̀ rẹ̀ ju bí ó ti wà lọ.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa oyè pàtàkì yìí mọ́ gẹ́gẹ́ bí oyè, láì rọ́pò rẹ̀ pẹ̀lú ‘Mèsáyà’ tàbí àlàyé míì.
- source_word: ἵνα πολλὰ πάθῃ
  choice: pé kí ó jìyà ohun púpọ̀
  rationale: Ìkọ̀lé ‘pé kí’ mú ohun tí a kọ nípa rẹ̀ hàn; ‘ohun púpọ̀’ sì pa ọ̀pọ̀ nọ́ńbà Giriki mọ́.
- source_word: ἐξουδενηθῇ
  choice: kí a sì kẹ́gàn rẹ̀
  rationale: ‘Kẹ́gàn’ sọ pé a wo ẹni náà bí ẹni tí kò ní iyì tàbí tí kò jámọ́ nǹkan kan; ìkọ̀lé ‘a’ tún mú ipò àìṣe ti ọ̀rọ̀ Giriki jáde lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Agbára ìbéèrè Jésù tí ó so iṣẹ́ ìmúpadàbọ̀sípò Èlíjà pọ̀ mọ́ ìjìyà Ọmọ Ènìyàn
  choice: A pa gbólóhùn kejì mọ́ gẹ́gẹ́ bí ìbéèrè gidi, a kò sì fi ‘ṣùgbọ́n’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Ṣíṣe e ní ‘Ṣùgbọ́n báwo nígbà náà…?’ tàbí yíyí i padà sí àlàyé tí ó tú ìforígbárí náà.
  rationale: Giriki ní ìbéèrè πῶς … γέγραπται … ἵνα …; ‘sì’ gba ìsopọ̀ καί là, ó sì jẹ́ kí ìforígbárí láàárín ìmúpadàbọ̀sípò àti ìjìyà dúró.
- issue: Ẹni tí oyè ‘Ọmọ Ènìyàn’ ń tọ́ka sí
  choice: A fi ‘Ọmọ Ènìyàn’ sílẹ̀ láì fi àlàyé míì kún un.
  alternative: ‘Mèsáyà’ tàbí ọ̀rọ̀ àlàyé tí yóò sọ oyè náà di ìtumọ̀ ẹ̀kọ́ kan pàtó.
  rationale: Ọ̀rọ̀ Giriki fúnra rẹ̀ jẹ́ oyè tí ó ní ìtumọ̀ tó jinlẹ̀; fífi àlàyé rọ́pò rẹ̀ yóò dín àyè ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yan ‘mú … padà bọ̀ sípò’ àti ‘kẹ́gàn’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí ó tún sún mọ́ ìtumọ̀ Giriki.
