language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: yo
  text: Ó sì ti sọ ọ́ sínú iná àti sínú omi[a] ní ọ̀pọ̀ ìgbà kí ó lè pa á run. Ṣùgbọ́n bí o bá lè ṣe ohunkóhun, ràn wá lọ́wọ́, ní ìyọ̀nú sí wa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘sínú àwọn omi’; ọ̀rọ̀ Gíríìkì fún ‘omi’ wà ní ọ̀pọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ràn wá lọ́wọ́, ní àánú sí wa,’ tàbí ‘ní ìyọ̀nú sí wa, ràn wá lọ́wọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ léraléra; gbólóhùn yìí jẹ́ Yorùbá àdánidá tí ó sì pa ìtumọ̀ náà mọ́.
- source_word: ἔβαλεν
  choice: ti sọ ọ́ sínú
  rationale: Àkókò ìṣe tí ó ti kọjá ní Gíríìkì ṣàkójọ àwọn ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ léraléra; ‘ti sọ ọ́ sínú’ bá ìròyìn bàbá náà mu ní Yorùbá.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: sínú iná àti sínú omi
  rationale: A tún ‘sínú’ sọ láti pa ìtẹnumọ́ ti àtẹ̀jáde Gíríìkì mọ́. ‘Omi’ ni ọ̀nà Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: láti pa á run
  rationale: Ó ṣe àfihàn ète ìparun láì dín ἀπόλλυμι kù sí ikú ara nìkan.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Ṣùgbọ́n bí o bá lè ṣe ohunkóhun
  rationale: ‘Ohunkóhun’ dúró fún τι, ó sì pa iyèméjì àti ẹ̀bẹ̀ onírẹ̀lẹ̀ bàbá náà mọ́ láì tú ìforígbárí náà.
- source_word: βοήθησον ἡμῖν
  choice: ràn wá lọ́wọ́
  rationale: Ìtumọ̀ rẹ̀ jẹ́ ẹ̀bẹ̀ tààrà fún ìrànlọ́wọ́ kíákíá, tí ọ̀rọ̀ Yorùbá yìí sì sọ ní kedere.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: ṣàánú wa
  rationale: Ó mú ìmọ̀lára àánú jíjinlẹ̀ tí ọ̀rọ̀ náà ní jáde ní Yorùbá àdánidá; a fi àlàyé ìṣètò participle sí àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìró ẹ̀bẹ̀ bàbá náà àti iyèméjì rẹ̀ nípa agbára Jésù
  choice: “bí o bá lè ṣe ohunkóhun”
  alternative: “bí o bá lè ṣe é” tàbí “bí agbára rẹ bá tó”
  rationale: Ọ̀rọ̀ Gíríìkì sọ iyèméjì bàbá náà ní tààrà. A kò rọ ọ́ tàbí yí i padà sí ìjẹ́wọ́ ìgbàgbọ́ tí ó dájú.
- issue: Ìbáṣepọ̀ participle σπλαγχνισθείς pẹ̀lú àṣẹ βοήθησον
  choice: “ṣàánú wa, kí o sì ràn wá lọ́wọ́”
  alternative: “níwọ̀n bí ìwọ ti ṣàánú wa, ràn wá lọ́wọ́”
  rationale: Yorùbá àdánidá lè tú participle náà sí ẹ̀bẹ̀ méjì tí ó so pọ̀, láì sọ pé àánú náà ti ṣẹlẹ̀ tẹ́lẹ̀ tàbí pé ó jẹ́ ìdí pàtó fún ìrànlọ́wọ́.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo ‘sọ ọ́ sínú’ fún ìṣe líle ti ẹ̀mí náà, ‘pa á run’ fún ète ìparun, àti ‘bí o bá lè ṣe ohunkóhun’ láti pa iyèméjì inú ẹ̀bẹ̀ náà mọ́.
