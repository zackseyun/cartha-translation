source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, baba ọmọ náà kígbe, ó sì wí pé,[a] “Mo gbàgbọ́; ràn mí lọ́wọ́ nínú àìgbàgbọ́ mi!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ní “baba ọmọ náà.” Ọ̀rọ̀ παιδίον lè túmọ̀ sí ọmọ tàbí ọmọkùnrin, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ràn mí lọ́wọ́ nínú àìpé ìgbàgbọ́ mi.” Ọ̀rọ̀ Gíríìkì ἀπιστία lè tọ́ka sí àìgbàgbọ́ tàbí àìtó ìgbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé baba náà dáhùn ní kánkán, ó sì pa ìmọ̀lára ìkánjú tí ó wọ́pọ̀ nínú Máàkù mọ́.
- source_word: κράξας
  choice: ké jáde
  rationale: Ó mú ohùn gíga àti ìtara ẹ̀dùn ọkàn inú ọ̀rọ̀ náà jáde láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: baba ọmọ náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn oní-ìní náà; “ọmọ” lè túmọ̀ sí child tàbí boy ní àyíká ọ̀rọ̀.
- source_word: ἔλεγεν
  choice: pé
  rationale: Ní Yorùbá, “ké jáde pé” ni ọ̀nà àdánidá láti ṣáájú ọ̀rọ̀ tààrà, bí ó tilẹ̀ jẹ́ pé ìṣe Gíríìkì náà lè ní ìmọ̀lára ìtẹ̀síwájú.
- source_word: Πιστεύω
  choice: Mo gbàgbọ́
  rationale: Ó ṣe àfihàn ìgbàgbọ́ baba náà ní tààrà, ó sì bá ẹgbẹ́ ọ̀rọ̀ πίστις mu.
- source_word: βοήθει
  choice: ràn … lọ́wọ́
  rationale: Èyí ni ìbéèrè ìrànlọ́wọ́ tí ó ṣe kedere, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: μου τῇ ἀπιστίᾳ
  choice: àìgbàgbọ́ mi
  rationale: Ó pa ìtakora tó mọ̀ọ́mọ̀ wà láàárín ìgbàgbọ́ àti àìgbàgbọ́ mọ́; kò tú un sí ìṣòro ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
theological_decisions:
- issue: Ìforígbárí láàárín Πιστεύω àti ἀπιστίᾳ
  choice: “Mo gbàgbọ́; ràn àìgbàgbọ́ mi lọ́wọ́!”
  alternative: “Mo gbàgbọ́; ràn àìpé ìgbàgbọ́ mi lọ́wọ́!”
  rationale: Ọ̀rọ̀ náà mọ̀ọ́mọ̀ so ìgbàgbọ́ tòótọ́ àti àìgbàgbọ́ tó ṣì kù pọ̀. Ìtumọ̀ pàtàkì náà pa ìforígbárí yìí mọ́ dípò kí ó yanjú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, èdè òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ọmọ” láìfi akọ tàbí abo kún un; àyíká tó tóbi jù lọ ló lè ṣàlàyé pé ọmọkùnrin ni.
