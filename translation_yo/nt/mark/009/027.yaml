  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù di ọwọ́ rẹ̀ mú, ó gbé e dìde[a], ó sì dìde dúró.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jí i dìde”; ọ̀rọ̀ Gíríìkì náà tún lè lò nígbà tí a bá ń sọ nípa jíjí lójú oorun tàbí jíjí ẹni dìde láti inú ikú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín èrò àwọn ènìyàn pé ọmọ náà ti kú àti ohun tí Jésù ṣe lẹ́yìn náà; ‘Ṣùgbọ́n’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: κρατήσας
  choice: di … mú
  rationale: Ọ̀rọ̀ náà tọ́ka sí mímú ohun kan ṣinṣin. ‘Di ọwọ́ rẹ̀ mú’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìṣe fífi ọwọ́ mú un mọ́ láìfi ìwà ipá kún un.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: ọwọ́ rẹ̀
  rationale: Èyí pa ẹ̀yà ara tí Gíríìkì pè ní χείρ mọ́, dípò fífẹ̀ ọ́ sí ‘apá’.
- source_word: ἤγειρεν
  choice: gbé e dìde
  rationale: Nínú àyíká yìí, Jésù mú kí ọmọ náà dìde kúrò níbi tó dùbúlẹ̀. ‘Gbé e dìde’ sọ ìtumọ̀ ojú-ìṣẹ̀lẹ̀ náà ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ ojú-ewé sì pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú jíjí lójú oorun tàbí nínú òkú mọ́.
- source_word: ἀνέστη
  choice: ó sì dìde dúró
  rationale: Ó ṣàpèjúwe ohun tó ṣẹlẹ̀ sí ọmọ náà lẹ́yìn tí Jésù gbé e dìde. ‘Dìde dúró’ ṣe kedere pé ó dé ipò dídúró, ó sì jẹ́ èdè Yorùbá òde òní tó ṣe àdánidá.
theological_decisions:
- issue: Ìró ohùn àjíǹde tó ṣeé ṣe nínú ἤγειρεν àti ἀνέστη
  choice: Lo èdè ìṣe ara lasán nínú ẹsẹ̀ náà—‘gbé e dìde … dìde dúró’—ṣùgbọ́n fi àlàyé hàn pé ἤγειρεν tún lè ní ìtumọ̀ jíjí lójú oorun tàbí nínú òkú.
  alternative: ‘Jí i dìde, ó sì dìde,’ èyí tó lè mú ìró ohùn àjíǹde lágbára sí i.
  rationale: Àyíká náà ń sọ nípa ọmọ tí Jésù mú kúrò níbi tó ṣubú sí lẹ́yìn tí ẹ̀mí àìmọ́ jáde, kì í ṣe pé àkọsílẹ̀ náà sọ ní tààrà pé ó jíǹde kúrò nínú òkú. Síbẹ̀, àwọn ọ̀rọ̀ Gíríìkì náà lè fara hàn nínú ọ̀rọ̀ nípa àjíǹde; nítorí náà, àlàyé náà pa ìró ohùn yẹn mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní gbangba lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó jẹ́ èdè òde òní, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. Ìtòlẹ́sẹẹsẹ náà jẹ́ àdánidá ní Yorùbá, ó sì pa ìyàtọ̀ tó wà láàárín ìṣe Jésù àti ìdáhùn ọmọ náà mọ́.
