source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: yo
  text: Wọ́n sì ń bi í léèrè pé, “Èé ṣe tí àwọn akọ̀wé fi ń sọ pé Èlíjà gbọdọ̀ kọ́kọ́ dé?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ló ṣe jẹ́ pé àwọn akọ̀wé ń sọ pé Èlíjà gbọdọ̀ kọ́kọ́ dé?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ń bi í léèrè
  rationale: Àkókò imperfect fi hàn pé ìbéèrè náà ń lọ lọ́wọ́ tàbí pé wọ́n ń béèrè léraléra; ọ̀rọ̀ yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ló ń ṣe àfihàn àkóónú ìbéèrè náà lọ́nà àdánidá; fífi ‘wọ́n ń sọ pé’ kún un yóò wuwo, ó sì lè mú kí ìbéèrè méjì dà bí ọ̀rọ̀ àsọyé.
- source_word: Ὅτι
  choice: Èé ṣe tí ... fi
  rationale: Nínú àyíká ìbéèrè yìí, ὅτι ní agbára ìbéèrè ‘kí ló dé’ tàbí ‘báwo ló ṣe jẹ́ pé’; ‘Èé ṣe tí ... fi’ jẹ́ Yorùbá àdánidá, ṣùgbọ́n àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: ‘Àwọn akọ̀wé’ pa ipa ìtàn àwọn amòye tí ń kọ àti ṣàlàyé Òfin mọ́ láì fi ìtumọ̀ ìjọ kan kún un.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: Orúkọ náà ni a kọ ní ìrísí tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: ‘Gbọdọ̀’ fi ìdandan tí δεῖ ní hàn ní ṣókí, láì ṣàlàyé orísun ìdandan náà ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἐλθεῖν
  choice: dé
  rationale: Nínú ọ̀rọ̀ àsọtẹ́lẹ̀ yìí, ‘dé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ wíwá ẹni sí ibi tàbí sí àkókò tí a ń retí.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: ‘Kọ́kọ́’ fi ipò àkókò ṣáájú hàn ní tààrà.
theological_decisions:
- issue: Agbára ìbéèrè tí Ὅτι bẹ̀rẹ̀
  choice: 'A túmọ̀ ọ́ sí ìbéèrè tààrà: ‘Èé ṣe tí ... fi ...?’'
  alternative: ‘Báwo ló ṣe jẹ́ pé àwọn akọ̀wé ń sọ pé ...?’
  rationale: Àwọn méjèèjì ṣeé ṣe fún ὅτι nínú àyíká yìí. Ọ̀rọ̀ àkọ́kọ́ ṣe kedere ní Yorùbá, a sì pa èkejì mọ́ nínú àlàyé ìsàlẹ̀ kí àìdánilójú gidi náà má bàa sọnù.
- issue: Irú wíwá Èlíjà
  choice: ‘Èlíjà gbọdọ̀ kọ́kọ́ dé’ láì fi àlàyé míì kún un
  alternative: ‘Èlíjà gbọdọ̀ tún dé’ tàbí ‘Èlíjà gbọdọ̀ dé ṣáájú Mèsáyà’
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé Èlíjà gbọdọ̀ kọ́kọ́ dé nìkan. Fífi ‘tún’ tàbí ‘ṣáájú Mèsáyà’ kún un yóò yan ìtumọ̀ tí ẹsẹ yìí fúnra rẹ̀ kò sọ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘àwọn akọ̀wé’ gẹ́gẹ́ bí ọ̀rọ̀ ìtàn, a sì yàgò fún àfikún ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ orísun.
