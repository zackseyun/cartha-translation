  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: yo
  text: Nígbà tí wọ́n sì dé ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn náà, wọ́n rí ọ̀pọ̀ ènìyàn yí wọn ká, àti àwọn akọ̀wé tí ń bá wọn jiyàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “tí ń bá wọn jíròrò.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìjíròrò tàbí àríyànjiyàn, ṣùgbọ́n nínú àyíká yìí ó dà bíi pé àríyànjiyàn ni a túmọ̀ sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Nígbà tí wọ́n sì dé ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn náà
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá ìtàn Yorùbá mu; “dé ọ̀dọ̀” fi ìṣípò sí ọ̀dọ̀ àwọn ènìyàn hàn lọ́nà àdánidá.
- source_word: εἶδον
  choice: wọ́n rí
  rationale: Èyí ni ìtumọ̀ taara, tó sì yẹ fún aorist inú ìtàn.
- source_word: ὄχλον πολύν
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó sọ bí ogunlọ́gọ̀ náà ṣe pọ̀ ní èdè Yorùbá tó rọrùn, láìfi ìtumọ̀ míì kún un.
- source_word: περὶ αὐτούς
  choice: yí wọn ká
  rationale: Ó pa ìtumọ̀ ibi mọ́ pé àwọn ènìyàn náà wà ní àyíká àwọn ọmọ-ẹ̀yìn.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí pa orúkọ ẹgbẹ́ àwọn amòfin Júù yìí mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí àwọn ìwé Ìhìn Rere sábà máa ń lò.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: tí ń bá wọn jiyàn
  rationale: Nínú àyíká ìforígbárí yìí, ọ̀rọ̀ náà ju ìjíròrò lásán lọ; “jiyàn” fi àríyànjiyàn hàn, “bá wọn” sì tọ́ka sí àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ẹni tí wọ́n ń bá sọ̀rọ̀.
