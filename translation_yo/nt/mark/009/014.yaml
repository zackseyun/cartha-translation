translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe, pẹ̀lú àmì ohùn níbi tó yẹ, ó sì jẹ́ ti ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye. A gbé àmì àlàyé [a] sí lẹ́yìn “jiyàn,” ibi tí àlàyé ọ̀rọ̀ náà ti kan ní tààrà.
