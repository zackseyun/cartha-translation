translation:
  language: yo
  text: Lójijì, nígbà tí wọ́n wo káàkiri, wọ́n kò tún rí ẹnikẹ́ni bí kò ṣe Jésù nìkan pẹ̀lú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: Lójijì
  rationale: Ó fi ìṣẹ̀lẹ̀ òjijì tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí hàn ní Yorùbá àdánidá.
- source_word: περιβλεψάμενοι
  choice: nígbà tí wọ́n wo àyíká
  rationale: Ó mú ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì jáde ní èdè Yorùbá tí ó ṣe kedere.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: wọn kò rí ẹnikẹ́ni mọ́
  rationale: Ó pa ìtumọ̀ pé wọn kò tún rí ẹlòmíràn mọ́ mọ́.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: bí kò ṣe Jesu nìkan pẹ̀lú wọn
  rationale: Ó ṣetọju ìyàsọ́tọ̀ méjèèjì—‘bí kò ṣe Jesu’ àti ‘Jesu nìkan’—pẹ̀lú wíwà rẹ̀ pẹ̀lú wọn.
