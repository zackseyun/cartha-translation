  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: yo
  text: Nítorí kò mọ ohun tí yóò dáhùn[a], nítorí ẹ̀rù gidigidi bà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí yóò sọ ní ìdáhùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: kò mọ
  rationale: Ọ̀rọ̀ náà ń sọ pé kò ní ìmọ̀ tàbí òye nípa ohun tí yóò ṣe; “kò mọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ οἶδα mu.
- source_word: τί ἀποκριθῇ
  choice: ohun tí ó yẹ kí ó dáhùn
  rationale: ἀποκρίνομαι túmọ̀ sí láti dáhùn tàbí fèsì, kì í ṣe láti sọ̀rọ̀ lásán. Ìtumọ̀ yìí tún fi ìṣiyèméjì inú ìbéèrè deliberative náà hàn.
- source_word: ἔκφοβοι
  choice: ẹ̀rù bà wọ́n gidigidi
  rationale: ἔκφοβος fi ẹ̀rù líle hàn ju ìbẹ̀rù lásán lọ; “gidigidi” mú agbára ọ̀rọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἐγένοντο
  choice: ẹ̀rù bà wọ́n
  rationale: Bí ó tilẹ̀ jẹ́ pé γίνομαι tọ́ka sí wíwọ ipò kan, ọ̀rọ̀ Yorùbá “ẹ̀rù bà wọ́n” fi ìṣẹ̀lẹ̀ tí wọ́n wọ ipò ìbẹ̀rù hàn lọ́nà àdánidá ju “wọ́n di ẹni tí ẹ̀rù bà” lọ.
- source_word: γὰρ ... γὰρ
  choice: nítorí ... nítorí
  rationale: Àtúnṣe “nítorí” méjèèjì pa ìlànà àlàyé tí γάρ méjèèjì ní mọ́, láì mú kí gbolohun náà ṣòro láti yé.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀-orúkọ ọ̀pọ̀ n tọ́ka sí
  choice: wọ́n
  alternative: òun nìkan
  rationale: ἔκφοβοι àti ἐγένοντο jẹ́ ọ̀pọ̀, nítorí náà “wọ́n” ni ó bá gírámà Gíríìkì mu. Nínú àyíká ọ̀rọ̀, ó tọ́ka sí Peteru àti àwọn tí ó wà pẹ̀lú rẹ̀, kì í ṣe Peteru nìkan.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A pa γάρ méjèèjì mọ́ gẹ́gẹ́ bí “nítorí,” a sì lo “ẹ̀rù bà wọ́n gidigidi” láti darapọ̀ ìtumọ̀ ìbẹ̀rù líle àti wíwọ ipò náà.
