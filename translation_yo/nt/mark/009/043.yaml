  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: yo
  text: Bí ọwọ́ rẹ bá sì mú ọ kọsẹ̀[a], gé ọwọ́ náà kúrò. Ó sàn fún ọ láti wọ inú ìyè lọ́wọ́kù ju pé kí o ní ọwọ́ méjèèjì kí o sì lọ sínú Gẹhẹ́nà[b], sínú iná tí kò ṣeé pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “mú ọ dẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ẹnì kan kọsẹ̀, ṣubú, tàbí dẹ́ṣẹ̀.'
    reason: lexical_alternative
  - marker: b
    text: Gẹhẹ́nà ni ìrísí Gíríìkì ti orúkọ ibi kan tí a so mọ́ ìdájọ́ Ọlọ́run; “ọ̀run àpáàdì” ni a sábà máa ń fi túmọ̀ rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: mú ọ kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ inú Gíríìkì mọ́, ó sì lè tọ́ka sí dídẹ́ṣẹ̀ tàbí jíjìnnà sí Ọlọ́run láì fi ìtumọ̀ kan ṣoṣo mọ́ ọn.
- source_word: ἀπόκοψον
  choice: gé e kúrò
  rationale: Àṣẹ yìí lágbára, ó sì pa àwòrán gígé ẹ̀yà ara kúrò mọ́ láì rọ ọ̀rọ̀ náà.
- source_word: καλόν
  choice: ó sàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ sí ohun rere, ìfiwéra pẹ̀lú ἢ jẹ́ kí “ó sàn” jẹ́ èdè Yorùbá àdánidá.
- source_word: κυλλόν
  choice: ní aláwọ̀ọ́kù
  rationale: Ó fi ipò ẹni tí ọwọ́ kan ti kù hàn ní pàtó nínú àyíká yìí, ó sì bá ìyàtọ̀ láàárín ọwọ́ kan àti ọwọ́ méjèèjì mu.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: wọ inú ìyè
  rationale: Ó pa ìtumọ̀ ẹ̀sìn ọjọ́ ìkẹyìn àti ìṣọ̀wọ̀n ọ̀rọ̀ náà mọ́, kì í ṣe ìwàláàyè ara lásán.
- source_word: ἀπελθεῖν
  choice: lọ sínú
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìlọsí ibùdó kan, ó sì dúró ní ìtakora sí “wọ inú ìyè.”
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ ibi pàtó ti Gíríìkì mọ́ dípò kí a fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó gbòòrò rọ́pò rẹ̀.
- source_word: ἄσβεστον
  choice: tí kò ṣeé pa
  rationale: Ó sọ ní kedere pé iná náà kò lè ṣeé paná, ní èdè Yorùbá tó wọ́pọ̀, tó sì bójú mu.
- source_word: χεὶρ σου
  choice: ọwọ́ rẹ
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ẹ̀yà ara tó ṣe pàtàkì fún ìkìlọ̀ náà mọ́.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: ní ọwọ́ méjèèjì
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ìtakora pẹ̀lú jíjẹ́ aláwọ̀ọ́kù mọ́.
theological_decisions:
- issue: Ìtumọ̀ γέεννα nínú ọ̀rọ̀ ìdájọ́
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Pípa orúkọ Gẹhẹ́nà mọ́ jẹ́ kí ìtumọ̀ náà fara mọ́ orísun Juu àti àwòrán ìdájọ́ inú ọ̀rọ̀ náà, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn tó gbòòrò ju.
- issue: Agbára àwòrán gígé ọwọ́ kúrò
  choice: A pa èdè ara tó ṣe kedere mọ́
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí yíyẹra fún ẹ̀ṣẹ̀ lásán
  rationale: Ọ̀rọ̀ náà mọ̀ọ́mọ̀ le, ó sì ń tẹnu mọ́ bí ẹ̀ṣẹ̀ àti ìdájọ́ ṣe ṣe pàtàkì; a kò rọ àwòrán yẹn tàbí túmọ̀ rẹ̀ kọjá ohun tí orísun sọ.
translation_notes:
  register: Yorùbá à标准 tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti tó ṣeé lóye fún òǹkàwé òde òní. A lo “aláwọ̀ọ́kù” nítorí àyíká náà sọ ní pàtó nípa ọwọ́ tí a gé kúrò; a sì lo “tí kò ṣeé pa” dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ lítíréṣọ̀ tó ṣòro.
