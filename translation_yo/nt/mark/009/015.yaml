source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, nígbà tí gbogbo ogunlọ́gọ̀ náà rí i, ẹnu yà wọ́n gidigidi[a]; wọ́n sì sáré lọ sọ́dọ̀ rẹ̀, wọ́n sì kí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìyàlẹ́nu ńlá bá wọn,” tàbí “ìpayà bá wọn.” Ọ̀rọ̀ Gíríìkì náà lè fi ìyàlẹ́nu líle, ìyàlẹ́nu, tàbí ìpayà hàn, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìyára ìṣẹ̀lẹ̀ hàn, ó sì pa ìmúnibíni tí ó wọ́pọ̀ nínú ìtàn Máàkù mọ́.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo ogunlọ́gọ̀ náà
  rationale: Èyí túmọ̀ ẹgbẹ́ ènìyàn náà gẹ́gẹ́ bí odindi, ó sì pa ìtumọ̀ πᾶς mọ́ ní Yorùbá àdánidá.
- source_word: ἰδόντες αὐτόν
  choice: nígbà tí ... rí i
  rationale: 'Aorist participle náà ní agbára àsìkò níhìn-ín: rírí Jésù ló fa ìhùwàsí tí ó tẹ̀ lé e.'
- source_word: ἐξεθαμβήθησαν
  choice: ẹnu yà wọ́n gidigidi
  rationale: Àṣàyàn yìí fi ìyàlẹ́nu líle hàn láì pinnu pé ìbẹ̀rù ni, tàbí pé ìmọ́lẹ̀ àrà ọ̀tọ̀ kan ló fà á.
- source_word: προστρέχοντες
  choice: wọ́n sáré tọ̀ ọ́ lọ
  rationale: Ó fi ìṣísẹ̀ kánkán tí ó darí sí ọ̀dọ̀ Jésù hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἠσπάζοντο αὐτόν
  choice: wọ́n kí i
  rationale: Kíkí ni ìtumọ̀ àìṣègbè tí ó bá ἀσπάζομαι mu nínú àyíká yìí; kò fi ìtumọ̀ àfikún sí i.
theological_decisions:
- issue: Ìtumọ̀ ìhùwàsí ogunlọ́gọ̀ nínú ἐξεθαμβήθησαν
  choice: 'Ìyàlẹ́nu líle: “ẹnu yà wọ́n gidigidi”'
  alternative: “ìpayà bá wọn” tàbí pé ìmọ́lẹ̀ bí ti Mósè ló mú kí ẹnu yà wọ́n
  rationale: Ẹsẹ náà sọ pé ìhùwàsí wọn lágbára nígbà tí wọ́n rí Jésù, ṣùgbọ́n kò sọ ohun tí ó fà á ju rírí rẹ̀ lọ. Ìtumọ̀ yìí pa agbára ọ̀rọ̀ náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí ìfojúrí tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tí ó lọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. “Ogunlọ́gọ̀” pa ìtumọ̀ collective crowd mọ́, “ẹnu yà wọ́n gidigidi” sì jẹ́ àdánidá ju ìtumọ̀ líle-lẹ́tà lọ.
