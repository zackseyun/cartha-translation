id: MRK.9.2
reference: Mark 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mẹ́fà[a], Jésù mú Peteru, Jakọbu àti Johanu lọ pẹ̀lú rẹ̀, ó sì mú wọn gòkè lọ sí orí òkè gíga kan ní ìkọ̀kọ̀, àwọn nìkan[b]. Ìrísí rẹ̀ sì yí padà níwájú wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọjọ́ mẹ́fà lẹ́yìn náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ìpamọ́, àwọn nìkan.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀nà méjì láti fi ìyàsọ́tọ̀ hàn, ó ń tẹnumọ́ pé àwọn mẹ́tẹ̀ẹ̀ta yìí nìkan ni Jésù mú lọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “A sì yí i padà níwájú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Ní ọjọ́ mẹ́fà lẹ́yìn náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tó tẹ̀ lé e ṣẹlẹ̀ lẹ́yìn àkókò ọjọ́ mẹ́fà, ó sì pa ìtumọ̀ χρονological μετά mọ́.
- source_word: παραλαμβάνει
  choice: mú ... lọ pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù yan àwọn mẹ́tẹ̀ẹ̀ta, ó sì mú wọn bá ara rẹ̀ lọ; ìṣètò yìí dára ju “mú” lásán lọ ní Yorùbá.
- source_word: ἀναφέρει αὐτοὺς
  choice: mú wọn gòkè lọ
  rationale: Ó pa ìṣípòkè inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: sórí òkè gíga kan
  rationale: “Sórí” ń fi ìlọ sí ibi gíga hàn, “òkè gíga kan” sì túmọ̀ ὄρος ὑψηλόν láì dá òkè náà mọ̀ ní pàtó.
- source_word: κατ’ ἰδίαν μόνους
  choice: àwọn nìkan
  rationale: Èyí ń tẹnumọ́ pé àwọn mẹ́tẹ̀ẹ̀ta nìkan ni Jésù mú lọ, kò sì tún àwọn ọ̀rọ̀ méjì ṣe lọ́nà tí kò bá Yorùbá mu.
- source_word: μετεμορφώθη
  choice: Ìrísí rẹ̀ sì yí padà
  rationale: Ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì sọ ìyípadà tí àwọn ọmọ-ẹ̀yìn rí láì ṣàlàyé ohun tó fà á tàbí bí ó ṣe ṣẹlẹ̀.
- source_word: ἔμπροσθεν αὐτῶν
  choice: níwájú wọn
  rationale: Ó lè túmọ̀ sí ní ojú wọn tàbí níwájú wọn; yíyan “níwájú wọn” pa àwòrán àti ìjẹ́rìí ojú wọn mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ μετεμορφώθη nínú àyíká tó ń sọ nípa Kristi
  choice: Ìrísí rẹ̀ sì yí padà
  alternative: a sì yí i padà níwájú wọn
  rationale: Ìtumọ̀ àkọ́kọ́ sọ ìyípadà tí ó hàn sí àwọn ọmọ-ẹ̀yìn ní kedere, ṣùgbọ́n kò fi kún un pé ẹni kan ló ṣe ìyípadà náà tàbí ohun tí ìṣẹ̀lẹ̀ náà túmọ̀ sí nípa ẹ̀kọ́ ìgbàgbọ́. Àkọsílẹ̀ ìsàlẹ̀ fi ọ̀nà tó sún mọ́ fọ́ọ̀mù àsìkò-àìṣe Gíríìkì hàn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Èdè náà jẹ́ ti ìtàn, ó ní ọlá, ó sì rọrùn fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ ìjọ kan pàtó àti fún ṣíṣàlàyé iṣẹ̀lẹ̀ náà ju ohun tí ẹsẹ náà sọ lọ.
