  source_fidelity: Ìtumọ̀ náà mú ìtàn ìṣẹ̀lẹ̀, àwọn orúkọ, ìgòkè sí òkè gíga, àti ìyípadà tí ó ṣẹlẹ̀ níwájú àwọn ọmọ-ẹ̀yìn mẹ́tẹ̀ẹ̀ta náà hàn dáadáa. Ṣùgbọ́n “Ní ọjọ́ mẹ́fà lẹ́yìn náà” lè túmọ̀ sí ọjọ́ kẹfà lẹ́yìn ìṣẹ̀lẹ̀ kan, dípò ìtumọ̀ μετὰ ἡμέρας ἓξ, “lẹ́yìn ọjọ́ mẹ́fà.” Bákan náà, “àwọn nìkan” nìkan kò sọ apá κατ’ ἰδίαν (“ní ìkọ̀kọ̀/lọ́tọ̀”) di mímú hàn ní kíkún.
  naturalness: Àtúnṣe náà lo Yorùbá boṣewa, ìtàn-ọrọ̀ tó rọrùn, àti àmì ohùn tó yẹ. “Ní ìkọ̀kọ̀, àwọn nìkan” jẹ́ ọ̀nà àdánidá láti pa ìtẹnumọ́ méjèèjì nínú Gíríìkì mọ́ láì tún ọ̀rọ̀ ṣe lọ́nà tí kò wọ́pọ̀.
  terminology: '“Jésù,” “Peteru,” “Jakọbu,” àti “Johanu” jẹ́ àwọn orúkọ tí ó wúlò nínú Yorùbá. “Ìrísí rẹ̀ sì yí padà” jẹ́ ìtumọ̀ tí ó ṣọ́ra fún μετεμορφώθη: ó sọ ìyípadà tí a rí hàn, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.'
