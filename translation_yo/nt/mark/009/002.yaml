- from: Ní ọjọ́ mẹ́fà lẹ́yìn náà[a], Jésù mú Peteru, Jakọbu àti Johanu lọ pẹ̀lú rẹ̀, ó sì mú wọn gòkè lọ sórí òkè gíga kan, àwọn nìkan[b]. Ìrísí rẹ̀ sì yí padà níwájú wọn[c].
  to: Lẹ́yìn ọjọ́ mẹ́fà[a], Jésù mú Peteru, Jakọbu àti Johanu lọ pẹ̀lú rẹ̀, ó sì mú wọn gòkè lọ sí orí òkè gíga kan ní ìkọ̀kọ̀, àwọn nìkan[b]. Ìrísí rẹ̀ sì yí padà níwájú wọn[c].
  rationale: A ṣàtúnṣe ọ̀rọ̀ àkókò náà kí ó lè bá μετὰ ἡμέρας ἓξ mu pẹkipẹki. A tún fi “ní ìkọ̀kọ̀” kún un kí ìtumọ̀ kaτ’ ἰδίαν àti μόνους má bàa dín kù. Àwọn apá mìíràn ni a pa mọ́ nítorí wọ́n jẹ́ olóòtítọ́ sí Gíríìkì, wọ́n sì jẹ́ Yorùbá àdánidá.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:41:34Z'
