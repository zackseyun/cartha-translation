  source_fidelity: Ìtumọ̀ náà ń fi Κἀκεῖθεν ἐξελθόντες hàn dáadáa nínú “Wọ́n sì kúrò níbẹ̀,” ó sì pa ìtẹ̀síwájú ìtàn mọ́. “Wọ́n ń la Gálílì kọjá” ń ṣàfihàn ìrìn gba agbègbè náà kọjá àti ipa imperfect ti παρεπορεύοντο. “Jésù kò sì fẹ́ kí ẹnikẹ́ni mọ̀” jẹ́ ìtumọ̀ tó pé fún οὐκ ἤθελεν ἵνα τις γνοῖ, tí ó sì fi ohun tí a kò sọ lẹ́yìn “mọ̀” sílẹ̀ gẹ́gẹ́ bí orísun ṣe ṣe.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, òde òní, tí ó ní ìgbọ́wọ̀. Ìlò “sì,” “ń,” àti “la … kọjá” dára, àwọn àmì ohùn sì péye níbi tí wọ́n ti yẹ. Orúkọ “Gálílì” àti “Jésù” tún wà ní ìrísí Yorùbá tó wọ́pọ̀.
  terminology: Àwọn ọ̀rọ̀ pàtàkì àti orúkọ ẹni/ibi jẹ́ èyí tó bójú mu. Dídárúkọ Jésù nínú gbólóhùn kejì ń ṣe kedere ẹni tí ọ̀rọ̀-ìṣe ẹyọ náà tọ́ka sí, láìfi ohun kan kún ìtumọ̀ orísun. Àwọn akọsílẹ̀ ẹsẹ̀ náà tún tọ́, wọ́n sì ní ìdákọ̀ró tó yẹ.
