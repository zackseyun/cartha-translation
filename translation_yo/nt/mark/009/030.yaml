  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: yo
  text: Wọ́n sì kúrò níbẹ̀, wọ́n ń la Gálílì kọjá[a]; Jésù kò sì fẹ́ kí ẹnikẹ́ni mọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ ìrìn tí ó ń lọ lọ́wọ́: “wọ́n ń kọjá gba Gálílì.”'
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò sọ ohun tí Jésù kò fẹ́ kí ẹnikẹ́ni mọ̀ ní pàtó; nínú àyíká ọ̀rọ̀, ó lè jẹ́ pé ó ń tọ́ka sí wíwà rẹ̀ níbẹ̀ tàbí ipa ọ̀nà tí wọ́n ń gbà kọjá Gálílì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Wọ́n sì kúrò níbẹ̀
  rationale: “Sì” ń pa ìtẹ̀síwájú ìtàn mọ́, “kúrò níbẹ̀” sì ń fi ìṣípò kúrò ní ibi àkọ́kọ́ hàn ní èdè Yorùbá àdánidá.
- source_word: παρεπορεύοντο
  choice: wọ́n ń la … kọjá
  rationale: Àmì “ń” ń fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì bá ìṣe aláìparí (imperfect) Gíríìkì mu; “la … kọjá” jẹ́ ọ̀nà Yorùbá àdánidá fún ìrìn-àjò gba agbègbè kan kọjá.
- source_word: διὰ τῆς Γαλιλαίας
  choice: la Gálílì kọjá
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ìṣípò gba inú agbègbè kan kọjá; ìṣètò yìí dára ní Yorùbá.
- source_word: οὐκ ἤθελεν
  choice: kò sì fẹ́
  rationale: θέλω níbí ń sọ ìfẹ́ tàbí ìpinnu ẹni; “kò fẹ́” ṣe kedere, ó sì jẹ́ èdè òde òní tí ó ní iyì.
- source_word: ἵνα τις γνοῖ
  choice: kí ẹnikẹ́ni mọ̀
  rationale: Gbólóhùn ἵνα náà sọ ohun tí Jésù fẹ́ dènà. Bí Gíríìkì ṣe fi ohun tí a ó mọ̀ sílẹ̀ láìsọ ọ́ ni Yorùbá náà ṣe pa á mọ́.
theological_decisions:
- issue: Olùṣe tí a kò dárúkọ pẹ̀lú οὐκ ἤθελεν
  choice: Jésù kò sì fẹ́
  alternative: òun kò sì fẹ́
  rationale: Ọ̀rọ̀-ìṣe ẹyọ kan tọ́ka sí Jésù nínú àyíká ìtàn. Dídárúkọ Jésù mú kí ìyàtọ̀ láàárín “wọ́n” àti olùṣe ẹyọ náà ṣe kedere ní Yorùbá, láìfi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Ohun tí γνοῖ ń tọ́ka sí
  choice: A fi ohun tí ẹnikẹ́ni kò gbọdọ̀ mọ̀ sílẹ̀ láìsọ ọ́
  alternative: kí ẹnikẹ́ni mọ̀ pé ó wà níbẹ̀ tàbí mọ ipa ọ̀nà rẹ̀
  rationale: Gíríìkì kò sọ object ọ̀rọ̀-ìṣe “mọ̀”; fífi àlàfo náà sílẹ̀ ń pa àìsọ pàtó inú orísun mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó yẹ, a sì kọ orúkọ ibi náà sí “Gálílì.” Àmì “ń” àti ọ̀rọ̀ “la … kọjá” ń mú ìṣípò tí ó ń lọ lọ́wọ́ hàn ní ọ̀nà àdánidá.
