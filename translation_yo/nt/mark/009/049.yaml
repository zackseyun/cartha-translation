  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: yo
  text: Nítorí a ó fi iná sódùn olúkúlùkù.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó fi iná ṣe olúkúlùkù lóògẹ́gẹ́.” Àwòrán náà lè mú ìdájọ́, ìwẹ̀nùmọ́, tàbí èdè ẹbọ wá sí ọkàn; fi Lefitiku 2:13 wé e.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan fi kún un pé, “a ó sì fi iyọ̀ sódùn gbogbo ẹbọ.”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù akọ ẹyọ kan tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ; nínú àyíká yìí, ó tọ́ka sí ẹnì kọ̀ọ̀kan, kì í ṣe sí ohun gbogbo.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ìkìlọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí fún un.
- source_word: πυρὶ
  choice: fi iná
  rationale: Ọ̀nà yìí lè fi iná hàn gẹ́gẹ́ bí ohun tí a fi ń ṣe iṣẹ́ náà, láìfi tipátipá pinnu gbogbo ìtumọ̀ àwòrán náà.
- source_word: ἁλισθήσεται
  choice: ni a ó ... dùn bí iyọ̀
  rationale: Ó jẹ́ ọ̀rọ̀ ọjọ́ iwájú aláìṣe láti inú ἁλίζω, ‘fi iyọ̀ sí, mú dùn bí iyọ̀.’ Ìtumọ̀ yìí pa àwòrán líle ti ‘iná’ àti ‘iyọ̀’ mọ́, ó sì yàgò fún fífi ìtumọ̀ àlàyé kan rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àfiwé ‘fi iná dùn bí iyọ̀’
  choice: Pa ọ̀rọ̀ àfiwé náà mọ́ láìpinnu bóyá ó ń tọ́ka ní pàtàkì sí ìdájọ́, ìwẹ̀nùmọ́, ẹbọ, tàbí ìdánwò àwọn ọmọ-ẹ̀yìn.
  alternative: Gbogbo ènìyàn ni yóò la ìdájọ́ iná kọjá; tàbí iná ni yóò wẹ gbogbo ènìyàn mọ́; tàbí a ó ya gbogbo ènìyàn sí mímọ́ bí ẹbọ tí a fi iyọ̀ sí.
  rationale: Èdè Gíríìkì náà kúrú, ó sì ní ìtumọ̀ àfiwé tí ó lè tọ́ka sí ọ̀pọ̀ ohun. Gbólóhùn pàtàkì náà kò gbọdọ̀ yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo níbi tí orísun kò ti yan án.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. ‘Fi ... dùn bí iyọ̀’ jẹ́ ọ̀nà àdánidá láti sọ fífi iyọ̀ sí ohun kan, nígbà tí a ṣì pa àwòrán àjèjì àti ìṣòro inú orísun mọ́.
