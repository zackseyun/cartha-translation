  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: yo
  text: Èlíjà sì farahàn sí wọn pẹ̀lú Mósè, àwọn méjèèjì sì ń bá Jésù sọ̀rọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn méjèèjì sì ń bá Jésù jíròrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: fara hàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ẹni náà farahàn tàbí di ẹni tí a lè rí; “fara hàn” jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìfarahàn nínú ìtàn yìí.
- source_word: αὐτοῖς
  choice: wọ́n
  rationale: Aṣọ́rọ̀ arọ́pò-orúkọ yìí tọ́ka sí àwọn tí Èlíjà fara hàn sí; nínú gbólóhùn Yorùbá “fara hàn wọ́n” ni ó ṣe déédé.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Èyí ni ìkọ̀wé orúkọ Elijah tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: σὺν Μωϋσεῖ
  choice: pẹ̀lú Mósè
  rationale: “Pẹ̀lú” fi ìbákẹ́gbẹ́ tí σὺν ń sọ hàn ní kedere, “Mósè” sì ni ìkọ̀wé orúkọ Moses tí ó wọ́pọ̀ ní Yorùbá.
- source_word: συλλαλοῦντες
  choice: ń bá Jésù sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí sísọ̀rọ̀ papọ̀ tàbí ìjíròrò; “bá … sọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìbánisọ̀rọ̀ mọ́.
- source_word: τῷ Ἰησοῦ
  choice: Jésù
  rationale: Dátífù náà darapọ̀ mọ́ συλλαλέω láti fi ẹni tí wọ́n ń bá sọ̀rọ̀ hàn; “bá Jésù sọ̀rọ̀” ni ìtumọ̀ àdánidá jù lọ.
- source_word: ἦσαν συλλαλοῦντες
  choice: ń bá Jésù sọ̀rọ̀
  rationale: Àpapọ̀ ἦσαν àti pàtísípù náà ń fi ìṣe tí ó ń lọ lọ́wọ́ hàn; àmì “ń” ni Yorùbá ń lò láti fi èyí hàn.
theological_decisions:
- issue: Ìdánimọ̀ àti òtítọ́ ìfarahàn Èlíjà àti Mósè níbi ìyípadà-ara Jésù
  choice: A túmọ̀ ìṣẹ̀lẹ̀ náà ní tààràtà gẹ́gẹ́ bí ìfarahàn Èlíjà pẹ̀lú Mósè, tí àwọn méjèèjì sì ń bá Jésù sọ̀rọ̀.
  alternative: Kí a túmọ̀ rẹ̀ sí ìran lásán tàbí àmì àpẹẹrẹ dípò ìfarahàn àwọn ẹni gidi.
  rationale: Ọ̀rọ̀ Gíríìkì gbé Èlíjà àti Mósè kalẹ̀ gẹ́gẹ́ bí àwọn tí ó fara hàn tí wọ́n sì ń bá Jésù sọ̀rọ̀. Ìtumọ̀ kò yẹ kí ó fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un tàbí sọ ìṣẹ̀lẹ̀ náà di àpẹẹrẹ lásán.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì yé àwọn òǹkàwé lásán ni a lò. “Àwọn méjèèjì” mú kí ẹni tí “wọ́n” ń tọ́ka sí ṣe kedere láì yí ìtumọ̀ orísun padà; a sì fi àmì ohùn sí ibi tí ó yẹ.
