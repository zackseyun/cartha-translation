id: MRK.9.17
reference: Mark 9:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: yo
  text: Ẹnì kan lára ọ̀pọ̀ ènìyàn náà sì dá a lóhùn pé, “Olùkọ́, mo mú ọmọkùnrin mi tí ó ní ẹ̀mí kan tí kò lè sọ̀rọ̀ wá sọ́dọ̀ rẹ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “ọmọkùnrin mi, ẹni tí ẹ̀mí kan tí kò lè sọ̀rọ̀ ń bẹ lára rẹ̀.”
    reason: Àṣàyàn míì fún bí a ṣe lè sọ ἔχοντα ní Yorùbá, láì yí ẹni tí ọ̀rọ̀ náà ń ṣàpèjúwe padà.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fèsì sí ẹni tí a ń bá sọ̀rọ̀, ó sì pa ìtumọ̀ ọ̀rọ̀ ìtàn Gíríìkì mọ́.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: Ẹnì kan lára ọ̀pọ̀ ènìyàn náà
  rationale: Èyí pa ìtumọ̀ apá kan nínú àwùjọ mọ́ láì fi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ òde òní tí ó ṣe kedere jù lọ fún ẹni tí ń kọ́ni.
- source_word: ἤνεγκα
  choice: mo mú ... wá
  rationale: Ìṣe tí ó ti ṣẹlẹ̀ ni aorist náà ń tọ́ka sí; gbólóhùn yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: υἱόν
  choice: ọmọkùnrin mi
  rationale: Ó pa ìbátan ọmọ sí baba mọ́, dípò kí a sọ ọ́ di ‘ọmọdé’ lásán.
- source_word: πρὸς σέ
  choice: sọ́dọ̀ rẹ
  rationale: Èyí ni ọ̀nà Yorùbá tí ó bójú mu fún mímú ẹnì kan tọ ẹni mìíràn wá.
- source_word: ἔχοντα
  choice: tí ó ní
  rationale: Ọ̀rọ̀ ìṣe aláìlẹ́ni Gíríìkì náà ń ṣàpèjúwe ọmọkùnrin náà; gbólóhùn alásopọ̀ yìí ṣe bẹ́ẹ̀ ní kedere àti ní àdánidá.
- source_word: πνεῦμα ἄλαλον
  choice: ẹ̀mí kan tí kò lè sọ̀rọ̀
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, kò sì fi ‘ẹ̀mí búburú’ tàbí ‘ẹ̀mí èṣù’ kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nínú àyíká ìtàn yíyọ ẹ̀mí jáde
  choice: ẹ̀mí, pẹ̀lú àyíká ìtàn tí ń tọ́ka sí ẹ̀mí tí ń pọ́n ọmọ náà lójú
  alternative: ẹ̀mí búburú tàbí ẹ̀mí èṣù
  rationale: Àyíká Máàkù fi hàn pé ẹ̀mí kan ń gba ọmọ náà, ṣùgbọ́n ẹsẹ yìí sọ ‘ẹ̀mí’ nìkan; nítorí náà, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ pàtó náà.
- issue: Bóyá ἄλαλον ṣàpèjúwe ẹ̀mí fúnra rẹ̀ tàbí ipa rẹ̀ lórí ọmọ náà
  choice: ẹ̀mí kan tí kò lè sọ̀rọ̀
  alternative: ẹ̀mí kan tí ń mú un má lè sọ̀rọ̀
  rationale: Ìtumọ̀ pàtó náà pa ọ̀nà gbólóhùn Gíríìkì àti àìdánilójú rẹ̀ mọ́; àṣàyàn kejì túmọ̀ ipa ìdí tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ọ̀pọ̀ ènìyàn’ fún ὄχλος, a sì yàgò fún fífi ‘ọkùnrin,’ ‘búburú,’ tàbí ‘ẹ̀mí èṣù’ kún ọ̀rọ̀ orísun.
