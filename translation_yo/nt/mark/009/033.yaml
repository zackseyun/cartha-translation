id: MRK.9.33
reference: Mark 9:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: yo
  text: Wọ́n sì dé Káfáránáúmù. Nígbà tí ó sì wà nínú ilé, ó ń bi wọ́n pé, “Kí ni ẹ̀ ń jíròrò ní ọ̀nà?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni ẹ̀ ń jiyàn lé lórí ní ọ̀nà?” Ọ̀rọ̀-ìṣe náà lè tọ́ka sí ìjíròrò, ìjiyàn, tàbí àríyànjiyàn; ẹsẹ tó tẹ̀ lé e fi hàn pé wọ́n ń sọ nípa ẹni tó tóbi jù lọ láàárín wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Ọ̀rọ̀ náà ń sọ nípa bí gbogbo wọn ṣe dé Kápánáúmù; ‘dé’ jẹ́ ọ̀nà àdánidá láti fi ìparí ìrìnàjò hàn ní Yorùbá.
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: A ṣe àkọsílẹ̀ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà ìkọ̀wé Yorùbá.
- source_word: ἐν τῇ οἰκίᾳ
  choice: nínú ilé
  rationale: Èyí pa ibi pàtó tí àpilẹ̀kọ Gíríìkì tọ́ka sí mọ́, láì túmọ̀ ọ́ sí ‘nílé’ bí ẹni pé ilé tirẹ̀ ni.
- source_word: γενόμενος
  choice: nígbà tí ó ... wà
  rationale: Participle náà ní iṣẹ́ àkókò; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì mú Jésù hàn gẹ́gẹ́ bí ẹni tí ó ń ṣe ìṣe tó tẹ̀ lé e.
- source_word: ἐπηρώτα
  choice: ó ń bi wọ́n pé
  rationale: Àmì imperfect náà lè tọ́ka sí ìṣe tí ń lọ lọ́wọ́; ‘ó ń bi wọ́n pé’ pa ìrísí yẹn mọ́ ní Yorùbá.
- source_word: Τί
  choice: Kí ni
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìbéèrè ohun tí wọ́n ń sọ̀rọ̀ lé lórí.
- source_word: ἐν τῇ ὁδῷ
  choice: ní ọ̀nà
  rationale: Nínú àyíká ìrìnàjò, ‘ní ọ̀nà’ túmọ̀ sí nígbà tí wọ́n wà lójú ọ̀nà.
- source_word: διελογίζεσθε
  choice: ẹ̀ ń jíròrò
  rationale: διαλογίζομαι lè túmọ̀ sí jíjíròrò, jíjàmbá ọ̀rọ̀, tàbí àríyànjiyàn. ‘Jíròrò’ pa ìtumọ̀ gbòòrò náà mọ́, láì fi ìmọ̀ ẹsẹ tó tẹ̀ lé e pinnu bí ìbínú ṣe pọ̀ tó.
theological_decisions:
- issue: Olùṣe ọ̀rọ̀ nínú ἦλθον àti nínú participle àti ọ̀rọ̀-ìṣe ẹyọ kan tó tẹ̀ lé e
  choice: A túmọ̀ dídé náà ní ọ̀pọ̀ ènìyàn—‘wọ́n dé’—ṣùgbọ́n a fi ‘ó’ tọ́ka sí Jésù nínú ilé àti nígbà tó ń bi wọ́n.
  alternative: ‘Wọ́n dé ... lẹ́yìn tí Jésù wọ ilé, ó bi wọ́n.’
  rationale: Èdè Gíríìkì yí padà láti ọ̀pọ̀ sí ẹyọ kan, Jésù sì ni olùṣe tí àyíká ọ̀rọ̀ fi hàn. A kò fi orúkọ rẹ̀ kún un níbi tí kò ti pọndandan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi gbogbo. ‘Ẹ̀ ń’ jẹ́ ọ̀nà àdánidá nínú ọ̀rọ̀ tààrà fún ọ̀pọ̀ ènìyàn; a lo ‘jíròrò’ nínú ẹsẹ, a sì pa ìtumọ̀ líle sí i mọ́ nínú àlàyé ìsàlẹ̀.
