id: MRK.9.35
reference: Mark 9:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: yo
  text: Ó jókòó, ó pe àwọn Méjìlá náà, ó sì sọ fún wọn pé, “Bí ẹnikẹ́ni bá fẹ́ jẹ́ ẹni àkọ́kọ́, yóò jẹ́ ẹni ìkẹyìn nínú gbogbo ènìyàn àti ìránṣẹ́ gbogbo ènìyàn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Ó jókòó
  rationale: Ó mú ìṣe aorist participle náà jáde ní Yorùbá àdánidá gẹ́gẹ́ bí ìṣe tó ṣáájú pípè àwọn méjìlá.
- source_word: ἐφώνησεν
  choice: ó pe
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé ó pè wọ́n wá sọ́dọ̀ rẹ̀.
- source_word: λέγει
  choice: ó sì sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Greek lo present tense ìtàn, Yorùbá àdánidá sábà máa ń bá ìtàn àtijọ́ lọ láìfi present tense yàtọ̀ sílẹ̀.
- source_word: πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Ó pa èrò ipò tàbí ọlá jíjẹ́ ẹni iwájú mọ́.
- source_word: ἔσχατος
  choice: ẹni ìkẹyìn
  rationale: Ó jẹ́ òdì kejì tó ṣe kedere sí ‘ẹni àkọ́kọ́.’
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Ó sọ ipa ẹni tó ń ṣe iṣẹ́ fún àwọn ẹlòmíràn, láìfi oyè ìjọ kan kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín fífẹ́ jẹ́ ẹni àkọ́kọ́ àti jíjẹ́ ẹni ìkẹyìn/ìránṣẹ́
  choice: 'A pa gbólóhùn àsọtẹ́lẹ̀ náà mọ́: ‘yóò jẹ́ ẹni ìkẹyìn ... àti ìránṣẹ́...’'
  alternative: ‘ó gbọ́dọ̀ jẹ́ ẹni ìkẹyìn ... àti ìránṣẹ́...’
  rationale: Greek ἔσται jẹ́ ‘yóò jẹ́,’ kì í ṣe ọ̀rọ̀ àṣẹ tààrà; ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ọ̀rọ̀ náà mọ́ láìyí i sí àṣẹ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘àwọn méjìlá’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ àwọn ọmọ-ẹ̀yìn náà, a sì yàgò fún ‘díákónì’ kí a má bàa fi oyè ìjọ sínú διάκονος.
