  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: yo
  text: níbi tí kòkòrò wọn kì í kú, tí iná náà kì í paná.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù, títí kan Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin, bẹ́ẹ̀ ni kò sí nínú àwọn ìtúmọ̀ Coptic ìgbà àkọ́kọ́. Ṣùgbọ́n ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ ti àṣà Byzantine àti nínú àṣà Latin. Ó ṣeé ṣe kí akọ̀wé kan fi kún un lẹ́yìn náà, nípa títún ọ̀rọ̀ kan náà tó wà ní ẹsẹ 48—àti ní ẹsẹ 44—kọ.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: kòkòrò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí kòkòrò tàbí ìdin tí ń jẹ ohun tí ó ti jẹrà. “Kòkòrò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó tún bá àwòrán inú Aísáyà 66:24 mu, láì fi irú kòkòrò kan pàtó kún ohun tí Gíríìkì sọ.
- source_word: τελευτᾷ
  choice: kì í kú
  rationale: Nínú àyíká yìí, τελευτάω túmọ̀ sí “kú” tàbí “dé òpin.” Ìṣesí àsìkò ìsinsìnyí pẹ̀lú οὐ ni a fi “kì í kú” hàn, èyí tó sọ ìṣe tí kò dáwọ́ dúró.
- source_word: σβέννυται
  choice: kì í kú
  rationale: Nípa iná, Yorùbá máa ń sọ pé iná “kú” níbi tí Gíríìkì ti túmọ̀ sí pé a kò pa á tàbí pé kò lè kú. “Iná náà kì í kú” jẹ́ ọ̀rọ̀ àdánidá, ó sì pa àwòrán iná tí kò lè parun mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtúnsọ “kì í kú” mú ìṣọ̀kan ewì Gíríìkì wá sí Yorùbá, ó sì jẹ́ ọ̀nà àdánidá láti sọ nípa kòkòrò àti iná.
