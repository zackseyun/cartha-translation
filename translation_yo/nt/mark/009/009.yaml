id: MRK.9.9
reference: Mark 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: yo
  text: Bí wọ́n sì ti ń sọ̀ kalẹ̀ láti orí òkè náà, ó pàṣẹ fún wọn pé kí wọ́n má ṣe sọ ohun tí wọ́n ti rí fún ẹnikẹ́ni, àyàfi nígbà[a] tí Ọmọ Ènìyàn bá ti jíǹde kúrò láàárín àwọn òkú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, lọ́nà èdè tí ó wọ́pọ̀ sí i, “títí Ọmọ Ènìyàn yóò fi jíǹde kúrò láàárín àwọn òkú.”
    reason: alternative_reading
  - marker: b
    text: 'Ní Gíríìkì: “kúrò láàárín àwọn òkú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: bí wọ́n ti ń sọ̀ kalẹ̀
  rationale: Ọ̀rọ̀ ìṣe alábápín ìsinsìnyí nínú genitive absolute fi hàn pé ìsọ̀kalẹ̀ náà ń lọ lọ́wọ́ ní àkókò tí Jésù pàṣẹ fún wọn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ὄρους
  choice: òkè
  rationale: “Òkè” ni ọ̀rọ̀ Yorùbá àdánidá fún ὄρος nínú àyíká yìí, ó sì bá ibi ìṣẹ̀lẹ̀ ìyípadà ògo mu.
- source_word: διεστείλατο
  choice: ó pàṣẹ fún wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífúnni ní àṣẹ tàbí ìtọ́nisọ́nà tí ó lágbára; “pàṣẹ” pa agbára ọ̀rọ̀ náà mọ́ láìlo èdè àtijọ́.
- source_word: ἵνα μηδενὶ
  choice: kí wọ́n má ṣe sọ ... fún ẹnikẹ́ni
  rationale: Èyí ṣe àfihàn àkóónú àṣẹ náà ní Yorùbá àdánidá, ó sì pa ìkọ̀sílẹ̀ “fún ẹnikẹ́ni” mọ́.
- source_word: ἃ εἶδον
  choice: ohun tí wọ́n ti rí
  rationale: “Ohun tí” ṣe àfihàn arọ́pò-orúkọ aláìlẹ́mìí púpọ̀ ní ọ̀nà àdánidá; “ti rí” fi hàn pé ìran náà ti ṣẹlẹ̀ ṣáájú àṣẹ yìí.
- source_word: διηγήσωνται
  choice: sọ
  rationale: Nínú àyíká yìí, “sọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún jíjẹ́rìí tàbí ríròyìn ohun tí wọ́n rí, láìfi ìtumọ̀ àfikún kún un.
- source_word: εἰ μὴ ὅταν
  choice: àyàfi nígbà tí
  rationale: Èyí tẹ̀lé ìrísí Gíríìkì “àyàfi nígbà tí” pẹ́kípẹ́kí ju “títí ... fi” lọ, nígbà tí ó ṣì mú ìdíwọ̀ àkókò náà ṣe kedere.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ oyè náà, ó sì pa agbára àpèjúwe rẹ̀ àti ìtọ́kasí rẹ̀ sí ìwé Dáníẹ́lì mọ́.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Gbólóhùn yìí fi hàn pé ó jíǹde kúrò láàárín àwọn ènìyàn tí wọ́n kú, dípò kí a mú un kàn gẹ́gẹ́ bí jíjí kúrò nínú ipò ikú.
- source_word: ἀναστῇ
  choice: bá ti jíǹde
  rationale: Aorist subjunctive lẹ́yìn ὅταν tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú tí yóò ti pé ní àkókò tí àṣẹ náà yóò dópin; “bá ti jíǹde” mú ìbáṣepọ̀ àkókò yìí hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ọmọ ènìyàn
  rationale: Oyè ìbílẹ̀ yìí jẹ́ kedere ní Yorùbá, ó sì pa ọ̀rọ̀ Gíríìkì àti ìṣeéṣe ìtọ́kasí rẹ̀ sí Dáníẹ́lì mọ́ láìsọ ọ́ di ọ̀rọ̀ gbogbogbò nípa ẹ̀dá ènìyàn.
- issue: Agbára àkókò εἰ μὴ ὅταν
  choice: àyàfi nígbà tí Ọmọ Ènìyàn bá ti jíǹde
  alternative: títí Ọmọ Ènìyàn yóò fi jíǹde
  rationale: “Àyàfi nígbà tí” sun mọ́ ìrísí ọ̀rọ̀ Gíríìkì, nígbà tí “títí ... fi” jẹ́ ọ̀nà Yorùbá tí ó rọrùn sí i. A yan èyí àkọ́kọ́ láti pa ìrísí àti ìfọ̀rọ̀wérọ̀ inú orísun mọ́.
translation_notes:
  register: A lo Yorùbá ìwọ̀nba, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; “Ọmọ Ènìyàn” dúró gẹ́gẹ́ bí oyè, “jíǹde” sì jẹ́ ọ̀rọ̀ àdánidá fún àjíǹde. Ìtòlẹ́sẹẹsẹ gbólóhùn náà tẹ̀lé ìṣàn ìtàn Yorùbá láìsọ ìtumọ̀ orísun di mímú ju bó ṣe wà lọ.
