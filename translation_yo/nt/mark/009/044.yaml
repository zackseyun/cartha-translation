source:
  edition: robinson-pierpont-2005-byzantine
  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/044.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: yo
  text: níbi tí kòkòrò wọn kì í kú, tí iná náà kì í sì í pan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì ìjímìjí tó ṣe pàtàkì jù lọ (tó fi mọ́ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin), bẹ́ẹ̀ ni kò sí nínú àwọn ìtumọ̀ Coptic ìjímìjí. Ṣùgbọ́n ó wà nínú Alexandrinus ti ọ̀rúndún karùn-ún, nínú àṣà àfọwọ́kọ Látìn, àti nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ Byzantine tó wá lẹ́yìn náà. Ó ṣeé ṣe pé àfikún akọ̀wé kan nígbà míì ni, tí ó tún gbólóhùn kan náà láti ẹsẹ 48 ṣe.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: kòkòrò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí kòkòrò tàbí ìdin tí ń jẹ ohun jíjẹrà. “Kòkòrò” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì pa àwòrán inú Aísáyà 66:24 mọ́.
- source_word: τελευτᾷ
  choice: kì í kú
  rationale: Nínú ọ̀rọ̀ nípa ẹ̀dá alààyè, “kú” ni ìtumọ̀ àdánidá jù lọ fún ohun tí kò dé òpin ìyè rẹ̀.
- source_word: σβέννυται
  choice: kì í kú
  rationale: Ní Yorùbá, a sábà máa ń sọ pé iná “kú”; gbólóhùn yìí mú ìtumọ̀ pé iná náà kì í parun jáde lọ́nà àdánidá, ó sì pa fọ́ọ̀mù ìṣe aláìṣe ti Gíríìkì mọ́ ní ìtumọ̀.
theological_decisions:
- issue: Bóyá àwòrán kòkòrò àti iná túmọ̀ sí ìjìyà ayérayé tàbí ohun mìíràn
  choice: A fi àwòrán ọ̀rọ̀ náà sílẹ̀ láì ṣàlàyé irú ìjìyà tí ó túmọ̀ sí.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìjìyà ayérayé.
  rationale: Gíríìkì sọ pé kòkòrò náà kì í kú, iná náà kò sì ní pa; kò fúnra rẹ̀ yanju gbogbo ìbéèrè ẹ̀kọ́ ìgbàgbọ́ nípa àwòrán náà.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Kì í kú” jẹ́ àsọyé àdánidá fún kòkòrò àti iná, ó sì pa ìṣọ̀kan àfiwé inú ẹsẹ náà mọ́.
