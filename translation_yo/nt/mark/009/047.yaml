id: MRK.9.47
reference: Mark 9:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: yo
  text: Bí ojú rẹ bá sì ń mú ọ kọsẹ̀, yọ ọ́ jáde. Ó sàn fún ọ láti wọ ìjọba Ọlọ́run pẹ̀lú ojú kan ju kí a sọ ọ́ sínú Gẹhẹ́nà[a] pẹ̀lú ojú méjì lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀run àpáàdì.” Ọ̀rọ̀ Gíríìkì náà ni “Gẹhẹ́nà,” orúkọ kan tí ó ní gbòǹgbò nínú Àfonífojì Hínómù, tí a sì ń lò fún ìdájọ́ ọjọ́ ìkẹyìn.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ń mú ọ kọsẹ̀
  rationale: Èyí pa àwòrán ìkọsẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìtumọ̀ rẹ̀ mọ́ ẹ̀ṣẹ̀ nìkan, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ ìkìlọ̀ náà ní ìtumọ̀ ìwà rere.
- source_word: ἔκβαλε
  choice: yọ ọ́ jáde
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyọ tàbí sísọ ohun kan jáde. Nínú ọ̀rọ̀ nípa ojú, ‘yọ ọ́ jáde’ jẹ́ èdè Yorùbá tó ṣe kedere, tí kò sì fi ọ̀nà pàtó bí ‘fa á tu’ kún ohun tí Gíríìkì sọ.
- source_word: καλόν ... ἢ
  choice: Ó sàn ... ju ... lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé καλόν túmọ̀ ní pàtàkì sí ‘ó dára,’ ìṣètò gbolohun yìí ń ṣe àfiwé; ‘ó sàn ... ju ... lọ’ ni ọ̀nà Yorùbá àdánidá láti fi agbára àfiwé náà hàn.
- source_word: μονόφθαλμον
  choice: pẹ̀lú ojú kan
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún ‘ẹni olójú kan’ nínú ìṣètò gbolohun yìí, ó sì pa àwòrán gidi náà mọ́.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ taara, tí ó ṣe kedere, tí ó sì pa ìwọ̀n ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- source_word: βληθῆναι
  choice: kí a sọ ọ́ sínú
  rationale: Ìṣe aláìlórúkọ náà fi hàn pé a ju tàbí sọ ẹni náà sínú ibì kan; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ohùn àìṣe-tikára ẹni ti Gíríìkì mọ́.
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A ṣe àfọwọ́kọ orúkọ Gíríìkì náà dípò lílo ọ̀rọ̀ gbogbogbò fún ọ̀run àpáàdì, kí ìbáṣepọ̀ rẹ̀ pẹ̀lú Àfonífojì Hínómù àti ìdájọ́ ọjọ́ ìkẹyìn má bàa sọnù.
theological_decisions:
- issue: Bí a ṣe túmọ̀ γέεννα nínú ọ̀rọ̀ ìdájọ́
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Ẹsẹ̀ náà lo ọ̀rọ̀ pàtó γέεννα, kì í ṣe ọ̀rọ̀ gbogbogbò fún ibi àwọn òkú tàbí ìjìyà ìkẹyìn. Pípa ‘Gẹhẹ́nà’ mọ́ kò jẹ́ kí àwọn ọ̀rọ̀ ìdájọ́ inú Bíbélì tí ó yàtọ̀ síra dà pọ̀; àlàyé ìsàlẹ̀ ojú ìwé sì ràn olùkà lọ́wọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún aráàlú láti lóye. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ‘Gẹhẹ́nà,’ ibi tí àlàyé náà ń tọ́ka sí.
