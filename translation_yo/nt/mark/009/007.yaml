  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: yo
  text: Ìkùukùu kan sì wá, ó sì bo wọ́n ní òjìji; ohùn kan sì jáde láti inú ìkùukùu náà, pé, “Èyí ni Ọmọ mi olùfẹ́; ẹ fetí sí i.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ gbọ́ tirẹ̀.” Àṣẹ náà túmọ̀ sí fífetí sí i pẹ̀lú àkíyèsí àti fífi ọ̀rọ̀ rẹ̀ sí ọkàn, kì í ṣe gbígbọ́ ohùn lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: dé / wá
  rationale: Nígbà tí νεφέλη jẹ́ olùṣe, “dé” fi ìṣẹ̀lẹ̀ tàbí dídé òjijì hàn lọ́nà àdánidá; nígbà tí φωνή jẹ́ olùṣe, “wá” bá ọ̀rọ̀ nípa ibi tí ohùn ti jáde mu.
- source_word: νεφέλη
  choice: ìkùukùu
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún “cloud”; a kò fi ìtumọ̀ nípa ìfarahàn Ọlọ́run kún ọ̀rọ̀ náà.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: ó ṣíji bò wọ́n
  rationale: Gbólóhùn yìí pa àwòrán ojú-ọ̀rọ̀ náà mọ́ pé ìkùukùu náà mú òjìji wá sórí wọn, ó sì ṣe kedere ní Yorùbá.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: ohùn kan sì ti inú ìkùukùu náà wá
  rationale: “Ohùn” tọ́ka sí ohùn tó sọ ọ̀rọ̀, “ti inú” sì pa agbára ibi-orísun ἐκ mọ́ láìfi ọ̀rọ̀-ìṣe “sọ” tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Ọmọ mi olùfẹ́
  rationale: “Ọmọ mi” túmọ̀ ọ̀rọ̀ ìbátan náà tààrà, “olùfẹ́” sì pa ìtumọ̀ ẹni tí a fẹ́ràn gidigidi mọ́ láìyí i sí “àyànfẹ́,” èyí tó lè tẹnu mọ́ yíyan ju fífẹ́ràn lọ.
- source_word: ἀκούετε αὐτοῦ
  choice: ẹ fetí sí i
  rationale: Àṣẹ yìí ní ìtumọ̀ gbígbọ́ pẹ̀lú àkíyèsí àti títẹ̀lé ohun tí a gbọ́. “Ẹ fetí sí i” jẹ́ ọ̀nà àdánidá láti pa agbára méjèèjì mọ́ láìdín in kù sí gbígbọ́ ohùn lásán tàbí túmọ̀ rẹ̀ sí ìgbọràn nìkan.
theological_decisions:
- issue: Ìkéde Ọlọ́run nípa ẹni tí Jésù jẹ́
  choice: “Èyí ni Ọmọ mi olùfẹ́”
  alternative: “Èyí ni Ọmọ mi, ẹni tí mo fẹ́ràn”
  rationale: Ìtúmọ̀ tí a yàn pa ìkéde tààrà pé Jésù ni Ọmọ Ọlọ́run mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- issue: Agbára àṣẹ ἀκούετε αὐτοῦ
  choice: “ẹ fetí sí i”
  alternative: “ẹ gbọ́ tirẹ̀” tàbí “ẹ ṣègbọràn sí i”
  rationale: Ọ̀rọ̀ Gíríìkì náà ní gbígbọ́ pẹ̀lú fífi ọkàn sí ohun tí a gbọ́ nínú; “fetí sí” pa ìmọ̀ yìí mọ́ láìsọ pé ọ̀rọ̀ náà túmọ̀ sí ìgbọràn nìkan.
translation_notes:
  register: A lo Yorùbá ìṣedéédé òde òní pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé lasán, ó sì pa àwòrán ìkùukùu tó ṣíji bo àwọn ọmọ-ẹ̀yìn mọ́.
