source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé Èlíjà pàápàá ti dé[a], wọ́n sì ṣe gbogbo ohun tí wọ́n fẹ́ sí i, gẹ́gẹ́ bí a ti kọ nípa rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, Èlíjà ti wá tẹ́lẹ̀ nínú Jòhánù Onítẹ̀bọmi àti iṣẹ́-ìránṣẹ́ rẹ̀; wo Máàkù 9:11–12, kí o sì fi wé Mátíù 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ohun tí àwọn ọmọ-ẹ̀yìn ń retí nípa Èlíjà àti ohun tí Jésù ń sọ; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé níbí.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa àgbékalẹ̀ ọ̀rọ̀ tààrà àti ẹni tí a ń bá sọ mọ́ ní Yorùbá àdánidá.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: pé, Èlíjà pàápàá ti dé
  rationale: “Ti dé” fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí ó sì tún ní ìtumọ̀ nísinsìnyí hàn. “Pàápàá” ṣe àfihàn καὶ gẹ́gẹ́ bí ìtẹnumọ́ pé Èlíjà náà ti dé, láìfi ìtumọ̀ míì kún un.
- source_word: ἐποίησαν αὐτῷ
  choice: wọ́n sì ṣe sí i
  rationale: Ìtumọ̀ yìí pa ọ̀nà gbòòrò àti agbára ọ̀rọ̀ Gíríìkì mọ́, kí gbólóhùn tó tẹ̀ lé e lè sọ bí ohun tí wọ́n ṣe náà ti pọ̀ tó.
- source_word: ὅσα ἤθελον
  choice: gbogbo ohun tí wọ́n fẹ́
  rationale: 'Ó túmọ̀ ààyè aláìlópin ti ὅσα ní Yorùbá àdánidá: ohunkóhun tí wọ́n bá fẹ́.'
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání fún àgbékalẹ̀ ìtọ́kasí Ìwé Mímọ́, ó sì pa ìtumọ̀ perfect passive mọ́ ní ọ̀nà àdánidá.
- source_word: ἐπ’ αὐτόν
  choice: nípa rẹ̀
  rationale: Pẹ̀lú γράφω ní àyíká ìtọ́kasí Ìwé Mímọ́, “nípa rẹ̀” ni ìtumọ̀ tó ṣeé ṣe jù; kò fi ìtumọ̀ “lòdì sí i” tí kò dájú wọ inú ẹsẹ náà.
theological_decisions:
- issue: Ta ni Èlíjà nínú ọ̀rọ̀ yìí?
  choice: A pa orúkọ “Èlíjà” mọ́ nínú ẹsẹ náà láìṣàlàyé rẹ̀ sí i.
  alternative: Kí a sọ ní tààrà nínú ẹsẹ pé Èlíjà túmọ̀ sí Jòhánù Onítẹ̀bọmi.
  rationale: Ẹsẹ náà fúnra rẹ̀ dárúkọ Èlíjà. Àyíká ọ̀rọ̀ tọ́ka sí Jòhánù Onítẹ̀bọmi gẹ́gẹ́ bí ẹni tó wá ní ipa Èlíjà, ṣùgbọ́n ìdánimọ̀ yẹn jẹ́ àlàyé tó yẹ fún àlàyé ìsàlẹ̀, kì í ṣe ohun tí a ó fi kún ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
