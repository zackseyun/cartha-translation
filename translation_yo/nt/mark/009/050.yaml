  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: yo
  text: Iyọ̀ dára; ṣùgbọ́n bí iyọ̀ bá di aláìníadùn[a], kí ni ẹ ó fi fún un ní adùn? Ẹ ní iyọ̀ nínú yín[b], kí ẹ sì máa bá ara yín gbé ní àlàáfíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí iyọ̀ bá pàdánù adùn rẹ̀” tàbí “bí iyọ̀ kò bá ní iyọ̀ mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà pa àkàwé náà mọ́ pé, “Ẹ ní iyọ̀ nínú yín.” Ó ṣeé ṣe kí àkàwé náà tọ́ka sí ìwà mímọ́, ọgbọ́n, ìṣòtítọ́ sí májẹ̀mú, tàbí ipa ìdábòbò, ṣùgbọ́n ẹsẹ̀ náà kò yan ìtumọ̀ kan ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: dára
  rationale: “Dára” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìdájọ́ rere tí καλός ń sọ níbí, láìfi ìtumọ̀ ‘wúlò’ nìkan mọ́ ọn.
- source_word: ἅλας / ἅλα
  choice: iyọ̀
  rationale: A lo “iyọ̀” ní gbogbo ibi méjèèjì láti pa àkàwé àti ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἄναλον γένηται
  choice: bá di aláìníadùn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé iyọ̀ di èyí tí kò ní iyọ̀ tàbí tí kò ní adùn. “Di aláìníadùn” jẹ́ èdè Yorùbá tó ṣe kedere, ó sì pa ìyípadà ipò tí γένηται ń fi hàn mọ́.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: kí ni ẹ ó fi fún un ní adùn?
  rationale: Èyí fi ọ̀nà tàbí ohun èlò tí a ó fi mú iyọ̀ náà ní adùn hàn, ó sì pa àwòrán sísọ oúnjẹ di adùn mọ́.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: Ẹ máa ní iyọ̀ nínú ara yín
  rationale: A pa àkàwé ‘iyọ̀’ mọ́ láìṣàlàyé rẹ̀ sínú ẹsẹ̀ náà. “Ẹ máa ní” tún fi àṣẹ tí ó ń bá a lọ hàn.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: kí ẹ sì máa wà ní àlàáfíà pẹ̀lú ara yín
  rationale: Ìtumọ̀ yìí sọ àṣẹ láti máa gbé ní àlàáfíà gẹ́gẹ́ bí ìwà tí ó ń bá a lọ, “pẹ̀lú ara yín” sì fi ìbáṣepọ̀ alábàápín hàn.
theological_decisions:
- issue: Ìtumọ̀ àkàwé ‘iyọ̀’ nínú àṣẹ náà
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘Ẹ máa ní iyọ̀ nínú ara yín.’
  alternative: Ṣí i túmọ̀ sí ìwà mímọ́, ọgbọ́n, ìṣòtítọ́ sí májẹ̀mú, tàbí ipa ìdábòbò.
  rationale: Ẹsẹ̀ náà kò sọ pàtó ohun tí iyọ̀ dúró fún; fífi àkàwé náà sílẹ̀ ń pa àìdánilójú àti agbára ẹ̀kọ́ inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- issue: Àṣẹ ìkẹyìn nípa àlàáfíà
  choice: kí ẹ sì máa wà ní àlàáfíà pẹ̀lú ara yín
  alternative: kí àlàáfíà sì wà láàárín yín
  rationale: Àṣàyàn náà tẹ̀ lé ọ̀rọ̀-ìṣe εἰρηνεύετε, ó sì fi ìṣe tí ó yẹ kí ó máa bá a lọ hàn láìfi ẹ̀kọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá àkókò yìí tí ó mọ́gbọ́n dání, tí ó ní àmì ohùn ní kíkún. Èdè náà rọrùn fún òǹkàwé lásán, ṣùgbọ́n ó pa ọ̀wọ̀, ìṣọ̀kan àkàwé, àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
