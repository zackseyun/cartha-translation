  to: Níbi gbogbo tí ó bá ti mú un, ó máa ń ju u ṣánlẹ̀; ọmọ náà sì máa ń yọ fófó lẹ́nu, ó máa ń payín, ara rẹ̀ sì máa ń le.[a] Mo sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ pé kí wọn lé e jáde, ṣùgbọ́n wọn kò lè lé e jáde.
