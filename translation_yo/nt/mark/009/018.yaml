id: MRK.9.18
reference: Mark 9:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: yo
  text: Níbi gbogbo tí ó bá ti mú un, ó máa ń ju u ṣánlẹ̀; ọmọ náà sì máa ń yọ fófó lẹ́nu, ó máa ń payín, ara rẹ̀ sì máa ń le.[a] Mo sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ pé kí wọn lé e jáde, ṣùgbọ́n wọn kò lè lé e jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó máa ń rẹ̀” tàbí “ó máa ń gbẹ”; ní ìtumọ̀ gidi, “ó máa ń gbẹ.”
    reason: Agbára pàtó ọ̀rọ̀ Gíríìkì ξηραίνεται ní ibí yìí kò dájú. Ó lè tọ́ka sí gbígbẹ, rírẹ̀/wíwọ̀, tàbí, ní àyíká àwọn àmì ara wọ̀nyí, líle ara.
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: Ní gbogbo ibi tí ó bá ti
  rationale: This naturally expresses the indefinite and recurring sense, “wherever/whenever,” without flattening the contingency marked by ἐὰν.
- source_word: καταλάβῃ
  choice: gbá a mú
  rationale: “Gbá … mú” vividly conveys the hostile spirit seizing or taking hold of the boy.
- source_word: ῥήσσει
  choice: gbé e ṣánlẹ̀
  rationale: This communicates violent throwing to the ground in natural Yoruba and avoids suggesting literal bodily tearing.
- source_word: ἀφρίζει
  choice: yọ ìfófó lẹ́nu
  rationale: The idiomatic Yoruba expression explicitly locates the foam at the mouth, as naturally required for clarity.
- source_word: τρίζει τοὺς ὀδόντας
  choice: payín
  rationale: “Payín” is the concise, current Yoruba expression for grinding or gnashing the teeth.
- source_word: ξηραίνεται
  choice: ara rẹ̀ … le koko
  rationale: In the symptom sequence, this naturally conveys the probable sense of the body becoming stiff or rigid; the verb’s more literal senses are retained in a footnote.
- source_word: εἶπα τοῖς μαθηταῖς σου
  choice: Mo sọ fún àwọn ọmọ-ẹ̀yìn rẹ
  rationale: A direct and dignified rendering of “I said/told your disciples.”
- source_word: ἐκβάλωσιν
  choice: lé e jáde
  rationale: This is the standard natural expression for driving or casting an indwelling spirit out, while retaining the Greek pronoun rather than replacing it with an explicit noun.
- source_word: οὐκ ἴσχυσαν
  choice: wọn kò lè ṣe é
  rationale: This clearly expresses their inability without specifying the reason for their failure.
theological_decisions:
- issue: Referent of αὐτό in ἵνα αὐτὸ ἐκβάλωσιν
  choice: The Yoruba pronoun “e” refers contextually to the hostile spirit.
  alternative: It could be understood more generally as the affliction.
  rationale: The surrounding narrative presents a spirit that seizes the boy and is to be expelled. Retaining a pronoun preserves the Greek wording and does not over-specify the referent.
- issue: Meaning of ξηραίνεται
  choice: Rendered contextually as the boy’s body becoming rigid.
  alternative: It may mean “dries up,” “withers,” or “wastes away.”
  rationale: The immediate sequence is a description of seizure-like bodily symptoms, but the Greek verb’s lexical ambiguity is genuine and is therefore preserved in a footnote.
translation_notes:
  register: Standard Yorùbá with full tone marks, using dignified but current idiom. The habitual marker “máa ń/a máa” reflects the repeated contingency of the father’s description. The noun “ọmọ náà” is supplied after the semicolon to prevent ambiguity between the spirit and the boy in the symptom sequence.
