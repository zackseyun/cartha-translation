id: MRK.9.42
reference: Mark 9:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá mú ọ̀kan nínú àwọn ẹni kéékèèké wọ̀nyí tí wọ́n gbà mí gbọ́ kọsẹ̀, ó sàn fún un ju kí a so òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí[a] mọ́ ọrùn rẹ̀, kí a sì jù ú sínú òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘òkúta ọlọ kẹ́tẹ́kẹ́tẹ́’; ìyẹn ni òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: mú ... kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè ní ìtumọ̀ mímú ẹni ṣubú sínú ẹ̀ṣẹ̀ tàbí kúrò nínú ìgbàgbọ́, láì dín ìtumọ̀ náà kù sí ọ̀kan ṣoṣo.
- source_word: μικρῶν τούτων
  choice: àwọn ẹni kéékèèké wọ̀nyí
  rationale: Ìtumọ̀ yìí kò fi ọ̀rọ̀ náà mọ́ àwọn ọmọ kékeré nìkan; ó tún lè tọ́ka sí àwọn onírẹ̀lẹ̀, aláìlágbára, tàbí ẹni tí a kò kà sí pàtàkì.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: tí wọ́n gbà mí gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá gbólóhùn Gíríìkì mu fún ìgbàgbọ́ nínú Jesu.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: yóò sàn fún un
  rationale: Ó fi agbára ìfiwéra àti ìkìlọ̀ líle inú gbólóhùn náà hàn ní Yorùbá àdánidá.
- source_word: μύλος ὀνικός
  choice: òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí
  rationale: Ó ṣàlàyé pé òkúta ọlọ ńlá ni, irú èyí tí ẹranko ń yí, kì í ṣe òkúta ọlọ kékeré tí ọwọ́ ènìyàn ń yí.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: so ... mọ́ ọn lọ́rùn
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún fífi ohun kan yí ọrùn ẹni ká tàbí so ó mọ́ ọrùn rẹ̀.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: a sì jù ú sínú òkun
  rationale: Ó mú àbájáde líle tí ọ̀rọ̀ Gíríìkì ń yà sílẹ̀ hàn ní kedere àti ní èdè Yorùbá tó rọrùn.
theological_decisions:
- issue: Ẹni tí ‘àwọn ẹni kéékèèké wọ̀nyí’ ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ ní ọ̀nà tó lè gba àwọn onígbàgbọ́ aláìlágbára tàbí ẹni tí a kà sí kékeré, pẹ̀lú àwọn ọmọde.
  alternative: Kí a túmọ̀ rẹ̀ sí àwọn ọmọ kékeré nìkan, tàbí sí gbogbo ọmọ-ẹ̀yìn onírẹ̀lẹ̀.
  rationale: Àfikún ‘tí wọ́n gbà mí gbọ́’ mú kí ọ̀rọ̀ náà kọjá ọjọ́-orí nìkan; ìtumọ̀ yìí pa ààyè ìtumọ̀ náà mọ́ láì fipá yan ọ̀kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A yan ‘àwọn ẹni kéékèèké’ dípò ‘àwọn ọmọ kékeré’ láti pa fífẹ̀ ìtọ́kasí Gíríìkì mọ́; a sì ṣàlàyé irú òkúta ọlọ náà nínú ọ̀rọ̀ àti àlàyé ìsàlẹ̀.
