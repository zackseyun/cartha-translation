source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ pé, “Ẹ má ṣe dá a lẹ́kun, nítorí kò sí ẹnikẹ́ni tí yóò ṣe iṣẹ́ agbára kan[a] ní orúkọ mi, tí yóò sì lè sọ̀rọ̀ búburú nípa mi láìpẹ́.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “iṣẹ́ ìyanu kan” tàbí “iṣẹ́ alágbára kan”; ní Gíríìkì, “iṣẹ́/agbara” (δύναμιν).
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “kẹ́gàn mi” tàbí “fi ọ̀rọ̀ búburú kàn mi”; ní Gíríìkì, “sọ̀rọ̀ búburú nípa mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: Ẹ má ṣe dá a lẹ́kun
  rationale: Àṣẹ ìdènà pẹ̀lú μή ni a túmọ̀ sí ọ̀rọ̀ àṣẹ àìṣe. ‘Dá a lẹ́kun’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n má ṣe ṣèdíwọ́ fún un tàbí dá ohun tí ó ń ṣe dúró.
- source_word: δύναμιν
  choice: iṣẹ́ agbára kan
  rationale: δύναμις túmọ̀ sí agbára, ó sì lè tọ́ka sí iṣẹ́ alágbára tàbí iṣẹ́ ìyanu nínú àwọn Ìhìn Rere. ‘Iṣẹ́ agbára’ pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú agbára láì dín ìtumọ̀ rẹ̀ kù sí ‘iṣẹ́ ìyanu’ nìkan.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún ìṣe tí a ṣe nípa pípe orúkọ Jésù tàbí lábẹ́ àṣẹ rẹ̀, láì fi ìtumọ̀ mìíràn kún ọ̀rọ̀ náà.
- source_word: ταχὺ
  choice: láìpẹ́
  rationale: Adverb náà tọ́ka sí bí àkókò ṣe sún mọ́lé, kì í ṣe bí a ṣe ṣe ohun kan ní kíákíá; ‘láìpẹ́’ mú ìtumọ̀ àkókò yìí jáde ní Yorùbá àdánidá.
- source_word: κακολογῆσαί με
  choice: sọ ohun búburú nípa mi
  rationale: Èyí pa ìtumọ̀ gbooro ti sísọ ohun búburú nípa ẹnì kan mọ́, láì fi dandan sọ pé ẹ̀gàn, èébú, tàbí ọ̀rọ̀ ìbanilórúkọjẹ́ ní pàtó ni.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: nítorí kò sí ẹnikẹ́ni tí
  rationale: Ó tẹ̀ lé ìṣètò àti ìtẹnumọ́ Gíríìkì, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: δυνήσεται
  choice: yóò sì lè
  rationale: Ọ̀nà yìí pa àkókò ọjọ́ iwájú àti ìtumọ̀ agbára tàbí àǹfààní láti ṣe ohun kan mọ́.
theological_decisions:
- issue: Irú iṣẹ́ tí a ṣe ní orúkọ Jésù
  choice: A túmọ̀ δύναμιν sí ‘iṣẹ́ agbára kan.’
  alternative: ‘iṣẹ́ ìyanu kan’ tàbí ‘iṣẹ́ alágbára kan’
  rationale: ‘Iṣẹ́ agbára’ pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ orísun mọ́, kò sì fi dandan sọ pé iṣẹ́ ìyanu nìkan ni, bó tilẹ̀ jẹ́ pé iṣẹ́ àrà ọ̀tọ̀ ni àyíká ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Ohun tí lílo orúkọ Jésù túmọ̀ sí nípa ẹni náà
  choice: A sọ gbólóhùn Jésù gẹ́gẹ́ bí ìdí tí ó fi yẹ kí wọ́n má ṣe dá ọkùnrin náà lẹ́kun, láì sọ ju ohun tí ẹsẹ náà sọ lọ.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹ̀rí pé ẹni náà jẹ́ ọmọ-ẹ̀yìn tòótọ́, tàbí pé kò ní ìgbàgbọ́ rárá
  rationale: Ẹsẹ náà sọ pé ẹni tí ó ṣe iṣẹ́ agbára ní orúkọ Jésù kò ní lè sọ ohun búburú nípa rẹ̀ láìpẹ́; kò dá ìdájọ́ tó gbooro sí i lórí ipò ẹ̀mí ẹni náà.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti kíkà-rọrùn. ‘Ẹ má ṣe’ bá àṣẹ tí Jésù ń fún ẹgbẹ́ ọmọ-ẹ̀yìn mu; a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan tàbí ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà.
