id: MRK.9.37
reference: Mark 9:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá gba ọ̀kan nínú irú àwọn ọmọ kékeré bẹ́ẹ̀ nítorí orúkọ mi[a], ó gba mí[b]; ẹni tí ó bá sì gba mí, kì í ṣe èmi ni ó ń gbà, bí kò ṣe ẹni tí ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘ọmọ kékeré kan irú bẹ́ẹ̀.’ Gíríìkì sọ ní tààrà pé ‘ọ̀kan nínú irú àwọn ọmọ kékeré,’ ó ń tẹnumọ́ ọmọ kan tí ó jẹ́ irú bẹ́ẹ̀, kì í ṣe pé ó ń tọ́ka sí àwọn ọmọ pàtó.
    reason: lexical_alternative
  - marker: b
    text: A tún lè lo ‘tẹ́wọ́ gba’ dípò ‘gba’ ní gbogbo ẹsẹ yìí; ọ̀rọ̀ Gíríìkì kan náà ni a tún lò ní gbogbo àwọn apá rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àpapọ̀ ọ̀rọ̀ arọ́pò-orúkọ àti ἄν ń fi ipò gbogbogbò tí kò dá lórí ẹni kan hàn; ‘Ẹnikẹ́ni tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: ọ̀kan lára irú àwọn ọmọ kékeré yìí
  rationale: ‘Ọ̀kan lára’ pa ìtumọ̀ partitive mọ́, ‘irú’ sì fi agbára qualitative τοιούτων hàn; ‘yìí’ so ọ̀rọ̀ náà mọ́ ọmọ tí Jésù gbé kalẹ̀ ní àyíká ẹsẹ̀ náà láì sọ ọ́ di àwọn ọmọ pàtó nìkan.
- source_word: δέξηται / δέχεται / δέχηται
  choice: gba
  rationale: ‘Gba’ lè túmọ̀ sí gbà ẹni wọlé tàbí tẹ́wọ́ gbà á, ó sì jẹ́ kí àtúnṣe ọ̀rọ̀ Gíríìkì kan náà dún kedere ní gbogbo àwọn gbólóhùn.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nítorí orúkọ mi
  rationale: Ní ibí yìí, gbolohun náà tọ́ka sí gbígba ọmọ náà nítorí ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ àti ọlá-àṣẹ Jésù; ‘nítorí orúkọ mi’ sọ ìdí yìí ní Yorùbá àdánidá.
- source_word: ἐμὲ
  choice: èmi
  rationale: Fọ́ọ̀mù tí a tẹnumọ́ nínú Gíríìkì ni a fi ‘èmi’ hàn gẹ́gẹ́ bí object, dípò ‘mi’ tí kò ní ìtẹnumọ́ tó pọ̀.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: kì í ṣe èmi ni ó gbà, bí kò ṣe
  rationale: Ìṣètò yìí pa ìtakora οὐκ…ἀλλά mọ́ ní Yorùbá tó ṣe kedere, láì túmọ̀ rẹ̀ sí ‘kì í ṣe èmi nìkan’ tí kò sí ní tààrà nínú orísun.
- source_word: τὸν ἀποστείλαντά με
  choice: ẹni tí ó rán mi
  rationale: Ọ̀rọ̀ participle olówó article náà ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni; ‘ẹni tí ó rán mi’ jẹ́ Yorùbá àdánidá, ó sì pa èdè iṣẹ́-ìránṣẹ́ mọ́.
theological_decisions:
- issue: Agbára ìtakora ìkẹyìn, ‘kì í ṣe èmi…bí kò ṣe ẹni tí ó rán mi’
  choice: A pa ìtakora náà mọ́ gẹ́gẹ́ bí ó ṣe rí, láì fi ‘èmi nìkan’ kún un.
  alternative: ‘Kì í ṣe èmi nìkan ni ó gbà, ṣùgbọ́n ó tún gba ẹni tí ó rán mi.’
  rationale: Orísun Gíríìkì ní ìtakora tààrà οὐκ…ἀλλά. Àyíká ọ̀rọ̀ fi hàn pé kò ń sẹ́ pé ẹni náà gba Jésù; dípò bẹ́ẹ̀, ó tẹnumọ́ pé gbígba Jésù dé ọ̀dọ̀ Ẹni tí ó rán an. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ láì ṣàlàyé rẹ̀ kúrò nínú ọ̀rọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ọmọ kékeré’ ṣe kedere ju ‘ọmọ’ lọ fún παιδίον. Àtúnṣe ‘gba’ ni a pa mọ́ láti jẹ́ kí ìsopọ̀ ọmọ—Jésù—Ẹni tí ó rán an dún kedere.
