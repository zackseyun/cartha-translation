  to: Ẹnikẹ́ni tí ó bá gba ọ̀kan nínú irú àwọn ọmọ kékeré bẹ́ẹ̀ nítorí orúkọ mi[a], ó gba mí[b]; ẹni tí ó bá sì gba mí, kì í ṣe èmi ni ó ń gbà, bí kò ṣe ẹni tí ó rán mi.
