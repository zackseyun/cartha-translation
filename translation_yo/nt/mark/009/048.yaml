  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: yo
  text: níbi tí kòkòrò wọn kì í kú[a][b], tí iná náà kò sì í kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘kòkòrò wọn kì í dópin, a kò sì í pa iná náà.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí ń ṣe ìtọ́kasí sí Aísáyà 66:24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó túmọ̀ sí ibi tí àwòrán ìdájọ́ náà ti wà; ‘níbi tí’ jẹ́ ọ̀nà Yorùbá àdánidá láti bẹ̀rẹ̀ gbólóhùn ìbátan yìí.
- source_word: σκώληξ
  choice: kòkòrò
  rationale: ‘Kòkòrò’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè dúró fún kòkòrò tó ń jẹ òkú láì fi irú rẹ̀ múlẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: αὐτῶν
  choice: wọn
  rationale: A lo ‘wọn’ gẹ́gẹ́ bí arọ́pò-orúkọ ohun-ìní nínú ‘kòkòrò wọn,’ èyí tó pa ìbáṣepọ̀ ara ẹni inú Gíríìkì mọ́.
- source_word: οὐ τελευτᾷ
  choice: kì í kú
  rationale: Pẹ̀lú kòkòrò gẹ́gẹ́ bí olùṣe, ‘kì í kú’ jẹ́ àdánidá, ó sì mú àwòrán líle náà àti ìró Aísáyà 66:24 mọ́.
- source_word: πῦρ
  choice: iná
  rationale: Ìtumọ̀ tààrà àti àdánidá ni ‘iná.’
- source_word: οὐ σβέννυται
  choice: kò sì í kú
  rationale: Ní Yorùbá, ‘iná kú’ ni ọ̀nà àdánidá láti sọ pé iná ti parun; ìṣètò ‘kò sì í kú’ fi ipò tí kò dáwọ́ dúró hàn, bó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀ aláìṣe.
theological_decisions:
- issue: Irú àwòrán ìdájọ́ náà
  choice: Pa àwòrán gidi ti kòkòrò àti iná mọ́ láì ṣàlàyé rẹ̀ nínú ìtumọ̀ gẹ́gẹ́ bí ìparun pátápátá, ìjìyà aláìnípẹ̀kun, tàbí àkàwé nìkan.
  alternative: A lè túmọ̀ àwòrán náà gẹ́gẹ́ bí ìjìyà tí ẹni mọ̀ pé òun ń jẹ, ìparun tí kò ṣeé yí padà, tàbí àkàwé ìtìjú àti ẹ̀gbin.
  rationale: Ẹsẹ̀ náà ń lo àwòrán ìdájọ́ tó lágbára, ó sì ń sọ̀rọ̀ bí Aísáyà 66:24; ṣùgbọ́n kò dá aríyànjiyàn ẹ̀kọ́ nípa irú ìdájọ́ náà parí. Nítorí náà, ìtumọ̀ náà pa ìforígbárí inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè tó ṣeé lóye, tó sì ní iyì. ‘Kì í’ ń fi ohun tí ó máa ń bá a lọ tàbí tí kò dáwọ́ dúró hàn; ‘iná kú’ jẹ́ àsọyé Yorùbá àdánidá.
