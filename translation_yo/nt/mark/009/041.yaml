    rationale: ‘Ní orúkọ pé’ kì í ṣe ìṣọ̀kan gbolóhùn Yorùbá tó rọrùn. Àlàyé náà yẹ kí ó sọ pé ìtumọ̀ àkọ́kọ́ tó rọrùn ń gba ‘nítorí pé ẹ jẹ́ ti Mèsáyà’ gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ náà, nígbà tí ìtumọ̀ àkọ́kọ́ nínú ẹsẹ̀ ń pa ‘ní orúkọ’ mọ́.
