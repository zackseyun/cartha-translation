id: MRK.9.41
reference: Mark 9:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá fún yín ní ife omi kan láti mu ní orúkọ, nítorí pé ẹ jẹ́ ti Mèsáyà,[a] lóòótọ́ ni mo wí fún yín, dájúdájú kò ní pàdánù èrè rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé ẹ jẹ́ ti Mèsáyà”; ọrọ̀ náà “ní orúkọ” lè tọ́ka sí ìdí tí a fi fún wọn ní omi.
    reason: Ìbáṣepọ̀ gangan láàárín “ní orúkọ” àti “nítorí pé ẹ jẹ́ ti Mèsáyà” kò ṣe kedere pátápátá nínú Greek; àlàyé náà ń fi ìtumọ̀ Yorùbá tó rọrùn hàn láì pa ọ̀rọ̀ ìpilẹ̀ mọ́lẹ̀.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Nítorí ẹnikẹ́ni tí ó bá
  rationale: Ó fi γάρ hàn gẹ́gẹ́ bí ìsopọ̀ mọ́ ọ̀rọ̀ tó ṣáájú, ó sì tú ìkọ̀ indefinite relative náà sí Yorùbá àdánidá.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: fún yín ní ife omi kan láti mu
  rationale: Ó mú ìtumọ̀ ‘fún ẹni ní ohun mímu’ jáde ní Yorùbá tó ṣe kedere, tí ó sì pa àwòrán ife omi mọ́.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: nítorí pé ẹ jẹ́ ti Mèsáyà
  rationale: Ní àyíká yìí, gbólóhùn náà tọ́ka sí fífún wọn ní omi lórí ìdí ìdánimọ̀ wọn pẹ̀lú Mèsáyà. Yorùbá yìí jẹ́ àdánidá, kò sì fi ‘orúkọ mi’ kún ẹsẹ̀ náà níbi tí Greek kò ti ní ‘mi’ ní kedere.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: lóòótọ́ ni mo wí fún yín
  rationale: Ìtumọ̀ ọlọ́wọ̀ àti ọ̀wọ̀ fún ọ̀rọ̀ ìmúdájú pàtàkì tí Jésù máa ń lò.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: dájúdájú kò ní pàdánù
  rationale: Dájúdájú mú ìkìlọ̀ ìkọ̀ olójúméjì οὐ μή jáde kedere.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: èrè rẹ̀
  rationale: Èrè bá ọ̀rọ̀ ìsanpadà rere mu ju ‘owó iṣẹ́’ lọ ní àyíká ẹ̀kọ́ ìwà àti ìdájọ́ yìí.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ọ̀rọ̀ jíjẹ́ ti ẹnì kan
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ pa ìtumọ̀ ẹni tí a fòróró yàn mọ́, láì sọ ọ́ di orúkọ lásán.
- issue: Ìbáṣepọ̀ ἐν ὀνόματι àti ὅτι χριστοῦ ἐστε
  choice: nítorí pé ẹ jẹ́ ti Mèsáyà
  alternative: ní orúkọ pé ẹ jẹ́ ti Mèsáyà
  rationale: Ìtumọ̀ àkọ́kọ́ ń sọ ìdí iṣẹ́ náà ní Yorùbá àdánidá. Àmọ́ ìtumọ̀ tó tẹ̀ lé ìṣètò ọ̀rọ̀ Greek ní pẹ́kípẹ́kí wà nínú àlàyé ìsàlẹ̀ nítorí pé ìbáṣepọ̀ ọ̀rọ̀ náà ní ìṣòro díẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A lo ‘ẹ/yín’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμᾶς/ὑμῖν, a sì yan ‘ife’ gẹ́gẹ́ bí ọ̀rọ̀ ojoojúmọ́ tó yé kedere fún ποτήριον.
