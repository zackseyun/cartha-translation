    issue: ἐν ὀνόματι kò wà nínú ìtumọ̀ àkọ́kọ́.
    rationale: Àkọ́kọ́ náà yí ‘ní orúkọ’ padà sí ‘nítorí pé’ nìkan. Bí ó tilẹ̀ jẹ́ pé ìbáṣepọ̀ ‘ní orúkọ’ àti ‘nítorí pé ẹ jẹ́ ti Mèsáyà’ lè ní ìtumọ̀ tó jọra ní àyíká, ìtumọ̀ optimal-equivalence gbọ́dọ̀ ṣàfihàn ọ̀rọ̀ náà nínú ẹsẹ̀ fúnra rẹ̀.
  - severity: low
