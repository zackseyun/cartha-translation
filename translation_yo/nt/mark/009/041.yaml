revisions:
- from: Nítorí ẹnikẹ́ni tí ó bá fún yín ní ife omi kan láti mu nítorí pé ẹ jẹ́ ti Mèsáyà,[a] lóòótọ́ ni mo wí fún yín, dájúdájú kò ní pàdánù èrè rẹ̀.
  to: Nítorí ẹnikẹ́ni tí ó bá fún yín ní ife omi kan láti mu ní orúkọ, nítorí pé ẹ jẹ́ ti Mèsáyà,[a] lóòótọ́ ni mo wí fún yín, dájúdájú kò ní pàdánù èrè rẹ̀.
  rationale: Àtúnṣe náà tún fi ἐν ὀνόματι (‘ní orúkọ’) sínú ẹsẹ̀ àkọ́kọ́, nígbà tí ó pa ὅτι χριστοῦ ἐστε mọ́ gẹ́gẹ́ bí ‘nítorí pé ẹ jẹ́ ti Mèsáyà.’ A kò fi ‘mi’ tàbí ẹni tí orúkọ náà jẹ́ kún un, nítorí ọrọ̀ Greek tí a fi fún àyẹ̀wò kò sọ ọ́ ní kedere. Àlàyé ìsàlẹ̀ tuntun ṣàfihàn ìtumọ̀ tó rọrùn àti àìdájú ìṣọ̀kan ọ̀rọ̀ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:41:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ èrò ẹsẹ̀ náà dáadáa: ìṣe fífún wọn ní ife omi, ìdí jíjẹ́ ti Mèsáyà, ìfọ̀kànbalẹ̀ ìlérí náà, àti èrè ẹni tí ó fúnni. Ṣùgbọ́n ọ̀rọ̀ pàtàkì ἐν ὀνόματι (''ní orúkọ'') ti sọnù nínú ẹsẹ̀ àkọ́kọ́; a kò gbọ́dọ̀ fi í sí àlàyé ìsàlẹ̀ nìkan.'
  naturalness: ‘Fún yín ní ife omi kan láti mu,’ ‘ẹ jẹ́ ti Mèsáyà,’ àti ‘dájúdájú kò ní pàdánù èrè rẹ̀’ jẹ́ Yorùbá boṣewa tó yé kedere. Fífi ‘ní orúkọ’ sílẹ̀ nínú gbólóhùn àkọ́kọ́, pẹ̀lú ìdákẹ́jẹ̀ kékeré, ń pa ìṣètò Greek mọ́ láì fi ‘orúkọ mi’ kún un.
  terminology: ‘Mèsáyà’ yẹ fún Χριστός gẹ́gẹ́ bí oyè nínú àyíká yìí. ‘Èrè’ tún bá μισθός mu dáadáa níbí.
  issues:
