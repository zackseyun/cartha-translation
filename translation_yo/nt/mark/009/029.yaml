  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Irú yìí kò lè jáde nípasẹ̀ ohunkóhun bí kò ṣe àdúrà.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan tó wá lẹ́yìn ní, “àdúrà àti ààwẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Irú yìí
  rationale: γένος túmọ̀ sí ẹ̀yà tàbí irú kan níbí. Àyíká ọ̀rọ̀ fi hàn pé ẹ̀mí àìmọ́ ni a ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n Gíríìkì kò tún ọ̀rọ̀ ‘ẹ̀mí’ sọ; ‘Irú yìí’ pa ìsọ̀rọ̀ kúkúrú àti àìsọ pàtó náà mọ́.
- source_word: ἐν οὐδενὶ
  choice: nípasẹ̀ ohunkóhun
  rationale: Gbólóhùn yìí tọ́ka sí ọ̀nà tàbí ohun èlò tí a fi ń ṣe ohun kan. ‘Nípasẹ̀ ohunkóhun’ jẹ́ Yorùbá àdánidá tí ó bá ìtumọ̀ náà mu nínú gbólóhùn òdì.
- source_word: δύναται ἐξελθεῖν
  choice: kò lè jáde
  rationale: δύναται pẹ̀lú ἐξελθεῖν fi àìlágbára láti jáde hàn. ‘Kò lè jáde’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ó sì bá àyíká ìlépa ẹ̀mí èṣù jáde mu.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: εἰ μὴ ń fi ohun kan ṣoṣo tí ó yàtọ̀ sí òfin òdì náà hàn. ‘Bí kò ṣe’ jẹ́ ọ̀nà àdánidá láti sọ ìyàsọ́tọ̀ yìí ní Yorùbá.
- source_word: ἐν προσευχῇ
  choice: àdúrà
  rationale: 'Gbólóhùn náà ń tọ́ka sí ọ̀nà: àdúrà nìkan ni ohun tí a yà sọ́tọ̀. Nínú ‘nípasẹ̀ ohunkóhun bí kò ṣe àdúrà,’ ìtumọ̀ ohun èlò náà ṣì ṣe kedere láìsí àfikún tí kò pọndandan.'
theological_decisions:
- issue: Bóyá kí a fi ‘àti ààwẹ̀’ kún un
  choice: àdúrà
  alternative: àdúrà àti ààwẹ̀
  rationale: Ọ̀rọ̀ SBLGNT ní προσευχῇ (‘àdúrà’) nìkan. Àwọn ìwé àfọwọ́kọ kan tí ó wá lẹ́yìn fi ‘àti ààwẹ̀’ kún un. Nítorí pé ẹ̀rí èdè ìpilẹ̀ṣẹ̀ ni a kọ́kọ́ tẹ̀ lé, ‘àdúrà’ nìkan ló wà nínú ẹsẹ̀, a sì tọ́ka sí àyípadà ìwé àfọwọ́kọ náà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A kò fi ‘ẹ̀mí’ kún ‘Irú yìí,’ kí àìsọ pàtó inú Gíríìkì lè dúró.
