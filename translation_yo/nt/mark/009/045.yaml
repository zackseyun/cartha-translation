  to: Bí ẹsẹ̀ rẹ bá sì mú ọ kọsẹ̀, gé e kúrò. Ó sàn fún ọ láti wọ inú ìyè gẹ́gẹ́ bí arọ ju pé kí a sọ ọ́ sínú Gẹhẹ́nà[a] nígbà tí o ní ẹsẹ̀ méjèèjì.
  rationale: Àtúnṣe náà ń ṣètò ìfiwéra náà ní Yorùbá tó dára, ó sì so ‘ní ẹsẹ̀ méjèèjì’ mọ́ ìṣẹ̀lẹ̀ ìsọ sínú Gẹhẹ́nà, gẹ́gẹ́ bí Gíríìkì ṣe ṣe. Ó tún lo ìlò tó rọrùn fún ‘lame’ àti àfidípò tó péye síi fún ‘hell,’ láì yí ìtumọ̀ tàbí ìwúwo ọ̀rọ̀ orísun padà.
