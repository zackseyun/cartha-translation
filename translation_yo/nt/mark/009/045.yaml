  source_fidelity: Ìtumọ̀ náà pa àwòrán σκανδαλίζῃ (‘mú ọ kọsẹ̀’), àṣẹ líle ἀπόκοψον (‘gé e kúrò’), ìfẹ̀hàn ìfiwéra, ‘ìyè,’ àti Gẹhẹ́nà mọ́ dáadáa. Ṣùgbọ́n ìṣọ̀kan gbolohun ìfiwéra ní apá kejì nílò àtúnṣe kékeré kí ó lè fi ìbáṣepọ̀ participle ‘ní ẹsẹ̀ méjèèjì’ pẹ̀lú ‘kí a sọ ọ́’ hàn ní kedere.
  naturalness: ‘Ní arọ’ lè yé ẹni, ṣùgbọ́n ‘gẹ́gẹ́ bí arọ’ jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n-dání láti ṣàpèjúwe bí ẹni ṣe ń wọ ìyè. Fífún ‘pé’ sílẹ̀ lẹ́yìn ‘ju’ tún mú ìfiwéra náà rọrùn, ó sì yọ ìdàrúdàpọ̀ kúrò.
  terminology: Gẹhẹ́nà yẹ kí ó wà nínú ọ̀rọ̀ àkọ́kọ́, gẹ́gẹ́ bí γέεννα. Nínú àlàyé ìsàlẹ̀, ‘àpáàdì’ sún mọ́ ‘hell’ ju ‘ọ̀run àpáàdì’ lọ, nítorí ‘ọ̀run’ lè mú ìtumọ̀ tí kò wà nínú ọ̀rọ̀ Gíríìkì wọlé.
