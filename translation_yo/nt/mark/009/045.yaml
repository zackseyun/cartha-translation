language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: yo
  text: Bí ẹsẹ̀ rẹ bá sì mú ọ kọsẹ̀, gé e kúrò. Ó sàn fún ọ láti wọ inú ìyè gẹ́gẹ́ bí arọ ju pé kí a sọ ọ́ sínú Gẹhẹ́nà[a] nígbà tí o ní ẹsẹ̀ méjèèjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “àpáàdì.” Ọ̀rọ̀ Gíríìkì náà ni Gẹhẹ́nà, tó ń mú Àfonífojì Hínómù àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìdájọ́ Ọlọ́run wá sí ọkàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: mú ọ kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ inú Gíríìkì mọ́, ó sì lè túmọ̀ sí ohun tó ń mú ènìyàn ṣubú sínú ẹ̀ṣẹ̀ láì fi ìtumọ̀ yẹn nìkan dí ọ̀rọ̀ náà mọ́.
- source_word: ἀπόκοψον
  choice: gé e kúrò
  rationale: Ó fi àṣẹ líle, tó ṣe kedere, tí ọ̀rọ̀ Gíríìkì ní hàn, láì rọ àwòrán àsọdùn náà.
- source_word: καλόν ἐστίν
  choice: Ó sàn
  rationale: Nínú ìfiwéra pẹ̀lú ἢ, gbólóhùn náà túmọ̀ sí pé ohun kan sàn ju èkejì lọ; èyí sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: láti wọ inú ìyè
  rationale: Ó pa àwòrán wíwọ inú ìyè mọ́, kò sì fi “ayérayé” kún ζωή, nítorí ọ̀rọ̀ náà nìkan ni orísun sọ.
- source_word: χωλὸν
  choice: ní arọ
  rationale: Ó tọ́ka pàtó sí àìlera tó kan rírìn, ó sì bá ọ̀rọ̀ ẹsẹ̀ mu.
- source_word: βληθῆναι
  choice: kí a sì sọ ọ́ sínú
  rationale: Ó fi ìṣe àìsọ ẹni tó ṣe é hàn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ pàtó inú Gíríìkì mọ́, nítorí ó ní ìbáṣepọ̀ pẹ̀lú Àfonífojì Hínómù àti ìdájọ́ Ọlọ́run; a fi ìtumọ̀ àṣà sí àlàyé ìsàlẹ̀.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: kí o ní ẹsẹ̀ méjèèjì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìyàtọ̀ tó wà láàárín níní ẹsẹ̀ méjèèjì àti wíwọ inú ìyè ní arọ hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ γέεννα nínú ọ̀rọ̀ ìdájọ́
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ orúkọ pàtó Gẹhẹ́nà, kì í ṣe ọ̀rọ̀ gbogbogbò fún ibi àwọn òkú. Dídá orúkọ náà dúró ń pa ìtàn àti àwòrán ìdájọ́ rẹ̀ mọ́; àlàyé ìsàlẹ̀ sì fúnni ní ìtumọ̀ tí ọ̀pọ̀ ènìyàn mọ̀.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tó lọ́wọ́lọ́wọ́, tó níyì, tí ó sì ṣeé yé fún òǹkàwé lásán. Gbólóhùn náà pa àsọdùn líle, àwòrán ìkọsẹ̀, àti ìtumọ̀ ọjọ́ iwájú ti “ìyè” mọ́ láì ṣàlàyé wọn ju orísun lọ.
