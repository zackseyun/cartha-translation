source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: yo
  text: Ó sì béèrè lọ́wọ́ baba ọmọ náà pé, “Ó ti pẹ́ tó tí èyí ti ń ṣẹlẹ̀ sí i?” Ó sì wí pé, “Láti ìgbà ọmọdé.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Láti ìgbà tí ó jẹ́ ọmọdé.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún Ἐκ παιδιόθεν; ó pa ìtumọ̀ ìbẹ̀rẹ̀ ní ìgbà ọmọdé mọ́.
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: béèrè lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan béèrè ohun kan lọ́wọ́ ẹlòmíràn, láìfi ìfọ̀rọ̀wánilẹ́nuwò líle kún ìtumọ̀ Gíríìkì.
- source_word: τὸν πατέρα αὐτοῦ
  choice: baba rẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ arọ́pò-orúkọ inú Gíríìkì ní ṣókí; nínú àyíká ẹsẹ̀ náà, ‘rẹ̀’ tọ́ka sí baba ọmọ tí àìsàn ń ṣe.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Ó ti pẹ́ tó tí
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere láti béèrè bí ohun kan ti ṣe pẹ́ tó láti ìbẹ̀rẹ̀ rẹ̀ títí di ìsinsìnyí.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: èyí ti ń ṣẹlẹ̀ sí i
  rationale: Àkójọpọ̀ àkókò pípé γέγονεν àti àyíká ọ̀rọ̀ fi ipò tí ó ń bá a lọ hàn; ‘ti ń ṣẹlẹ̀ sí i’ pa ìtẹ̀síwájú náà mọ́ láìsọ ohun tí ‘èyí’ jẹ́ ní pàtó.
- source_word: ὁ δὲ εἶπεν
  choice: Baba náà sì dáhùn pé
  rationale: ‘Dáhùn’ bá ipò ìbéèrè àti ìdáhùn mu, ‘sì’ sì ń gbé ìtàn lọ síwájú láìfi ìtakora tí kò pọndandan kún un.
- source_word: Ἐκ παιδιόθεν
  choice: Láti ìgbà tí ó ti jẹ́ ọmọdé
  rationale: Ó sọ ìpilẹ̀ àkókò láti ìgbà èwe ní Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún òǹkàwé òde òní.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ní ìforúkọsílẹ̀ tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A pa ‘èyí’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àìsọ pàtó, bí τοῦτο ṣe rí nínú orísun.
