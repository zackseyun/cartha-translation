  terminology: A ti pa ‘èyí’ mọ́ gẹ́gẹ́ bí ohun tí a kò sọ ní pàtó, gẹ́gẹ́ bí τοῦτο. ‘Baba ọmọ náà’ jẹ́ ìtúmọ̀ àlàyé kékeré tí àyíká fi hàn, láti yẹra fún ìdààmú arọ́pò-orúkọ nínú Yorùbá.
