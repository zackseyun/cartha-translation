  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n dákẹ́, nítorí ní ọ̀nà ni wọ́n ti bá ara wọn jiyàn nípa ẹni tí ó ga ju ẹlòmíràn lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ẹni tí ó ga jù lọ.” Ọ̀rọ̀ Gíríìkì náà jẹ́ afiwéra: “ga ju.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: wọ́n dákẹ́
  rationale: Ìṣe aláìpé náà fi ìdákẹ́jẹ́ tí ó ń bá a lọ hàn; ní Yorùbá, “wọ́n dákẹ́” jẹ́ ọ̀nà àdánidá láti sọ pé wọn kò dáhùn.
- source_word: διελέχθησαν
  choice: wọ́n ti ń bá ara wọn jiyàn
  rationale: Àyíká ọ̀rọ̀ nípa ipò ẹni tí ó ga jù fi hàn pé kì í ṣe ìjíròrò lásán, ṣùgbọ́n àríyànjiyàn; “ti ń” tún jẹ́ kí ìṣe tí ó ṣáájú ìdákẹ́ wọn hàn.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Ó pa ìtumọ̀ ìṣe láàárín ara wọn mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τῇ ὁδῷ
  choice: ní ọ̀nà
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún ohun tí ó ṣẹlẹ̀ nígbà tí wọ́n wà lójú ìrìnàjò.
- source_word: τίς μείζων
  choice: ẹni tí ó pọ̀jù
  rationale: “Pọ̀jù” lè sọ ìfiwéra nípa ipò tàbí ọlá láìfi ọ̀rọ̀ míì kún orísun; ìṣètò gbolohun Yorùbá yìí jẹ́ àdánidá fún ìbéèrè ẹni tó ju àwọn yòókù lọ.
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: “Ṣùgbọ́n” mú ìtakora pẹ̀lẹ́ sí ìbéèrè Jésù tó ṣáájú jáde, “wọ́n” sì tọ́ka sí àwọn ọmọ-ẹ̀yìn.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó sọ ìdí tí wọ́n fi dákẹ́ ní kedere.
theological_decisions:
- issue: Ìfiwéra μείζων àti ìtumọ̀ bí ohun tó ga jù lọ
  choice: ẹni tí ó pọ̀jù
  alternative: ẹni tí ó tóbi jù lọ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ afiwéra, Yorùbá sì sábà ń lo “jù” ní àkójọpọ̀ láti fi ìdíje ipò hàn. “Pọ̀jù” yẹra fún ìtumọ̀ ìwọ̀n ara tí “tóbi” lè mú wá, ó sì bá àríyànjiyàn wọn nípa ọlá mu.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbo.
