  verdict: revise
  source_fidelity: Àrọ́pò-orúkọ αὐτό jẹ́ akọ̀-abo àárín, ó sì ń tọ́ka sí ẹ̀mí náà ní àyíká ọ̀rọ̀ yìí ní ti ẹ̀dá; ìtumọ̀ àkọ́kọ́ náà pa èyí mọ́ nípasẹ̀ ‘lé e jáde.’ Ṣùgbọ́n àlàyé ìsàlẹ̀ tó wà lọwọlọwọ sọ ‘lé ọmọkùnrin náà jáde,’ èyí tí ó lè dà bí ẹni pé àwọn ọmọ-ẹ̀yìn fẹ́ lé ọmọkùnrin náà fúnra rẹ̀ jáde. A tún un ṣe kí ó ṣàlàyé àṣàyàn ìtọ́kasí náà láì yi iṣẹ́-ìṣe ‘lé ... jáde’ sí ọmọkùnrin náà ní kedere.
  naturalness: Ìtumọ̀ náà jẹ́ Yorùbá òde òní tí ó dára, ó sì ní àmì ohùn tó yẹ. Yíyọ ‘sì’ kúrò lẹ́yìn ‘Nígbà tí’ jẹ́ kí ìbẹ̀rẹ̀ gbolohun náà rọrùn díẹ̀, láì pàdánù ìsopọ̀ καί.
  terminology: ‘Àwọn ọmọ-ẹ̀yìn rẹ̀,’ ‘ń bi í léèrè,’ àti ‘lé e jáde’ bá ìforúkọsílẹ̀ ìhìnrere mu. ‘Ní ìkọ̀kọ̀’ lè túmọ̀ sí ní àṣírí, ṣùgbọ́n ó tún lè ṣiṣẹ́ níbí fún ìbéèrè ní ìpamọ́; kò nílò ìyípadà fipá.
  issues:
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ náà túmọ̀ àṣàyàn ìtọ́kasí sí ‘lé ọmọkùnrin náà jáde.’
