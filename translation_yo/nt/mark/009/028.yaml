  to: Nígbà tí ó wọ inú ilé, àwọn ọmọ-ẹ̀yìn rẹ̀ ń bi í léèrè ní ìkọ̀kọ̀ pé, “Èé ṣe tí àwa kò fi lè lé e jáde[a]?”
  rationale: A ṣe àtúnṣe kékeré sí ìbẹ̀rẹ̀ gbolohun fún sísàn Yorùbá, ṣùgbọ́n ìyípadà pàtàkì ni àlàyé ìsàlẹ̀. Ó pa àìdánilójú ìtọ́kasí arọ́pò-orúkọ mọ́ gẹ́gẹ́ bí audit trail ṣe béèrè, nígbà tí ó yàgò fún ìmọ̀ pé ọmọkùnrin náà fúnra rẹ̀ ni a ń lé jáde.
  reviewer_model: gpt-5.6-terra
