id: MRK.9.28
reference: Mark 9:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: yo
  text: Nígbà tí ó wọ inú ilé, àwọn ọmọ-ẹ̀yìn rẹ̀ ń bi í léèrè ní ìkọ̀kọ̀ pé, “Èé ṣe tí àwa kò fi lè lé e jáde[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lé e jáde,” bí a bá gbà pé arọ́pò-orúkọ náà ń tọ́ka sí ọmọkùnrin náà dípò ẹ̀mí náà. Arọ́pò-orúkọ Gíríìkì náà jẹ́ ti akọ̀-abo àárín, èyí tí ó tọ́ka sí ẹ̀mí náà lọ́nà tí ó ṣe déédéé jù.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ εἰς οἶκον
  choice: nígbà tí ó wọ inú ilé
  rationale: Gbólóhùn yìí fi ìṣe tí ó ṣẹlẹ̀ ṣáájú ìbéèrè àwọn ọmọ-ẹ̀yìn hàn ní ọ̀nà tí ó ṣe déédéé ní Yorùbá; ‘inú ilé’ kò fi dandan mú un jẹ́ ilé tirẹ̀ tàbí ilé kan tí a kò mọ̀.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń kọ́ lábẹ́ olùkọ́ tí ó sì ń tẹ̀ lé e.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó sọ pé wọn bi í níbi tí àwọn ẹlòmíràn kò ti gbọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘privately’ ní Yorùbá.
- source_word: ἐπηρώτων
  choice: ń bi í léèrè
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ ń ṣàfihàn àbájáde imperfect Gíríìkì láì sọ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: Ὅτι
  choice: Èé ṣe
  rationale: Nínú ìbéèrè yìí, ὅτι túmọ̀ sí ìdí tí ohun kan fi rí bẹ́ẹ̀; ‘Èé ṣe’ jẹ́ ìbéèrè Yorùbá tí ó ṣe déédéé.
- source_word: οὐκ ἠδυνήθημεν
  choice: àwa kò fi lè
  rationale: Ó pa ìtumọ̀ àìlágbára tàbí àìní agbára láti ṣe ohun náà mọ́, ìtẹnumọ́ ‘àwa’ sì bá ἡμεῖς mu.
- source_word: ἐκβαλεῖν αὐτό
  choice: lé e jáde
  rationale: ‘Lé … jáde’ ni ọ̀nà Yorùbá tí ó ṣe déédéé fún yíyọ ẹ̀mí àìmọ́ kúrò; ‘e’ pa fọ́ọ̀mù arọ́pò-orúkọ orísun mọ́ láì fi orúkọ kan kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ αὐτό ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí arọ́pò-orúkọ ‘e,’ pẹ̀lú àlàyé pé ẹ̀mí àìmọ́ ni ó ṣeé ṣe jù lọ pé ó ń tọ́ka sí.
  alternative: Kí a ka arọ́pò-orúkọ náà sí ohun tí ó ń tọ́ka sí ọmọkùnrin náà.
  rationale: αὐτό jẹ́ arọ́pò-orúkọ akọ̀-abo àárín ní Gíríìkì, nítorí náà ó bá ẹ̀mí náà mu ju ọmọkùnrin akọ lọ. Síbẹ̀, arọ́pò-orúkọ Yorùbá kò fi ìyàtọ̀ akọ, abo, tàbí akọ̀-abo àárín hàn, nítorí náà àkọsílẹ̀ ìsàlẹ̀ ni ó ṣàlàyé ìyàtọ̀ inú Gíríìkì láì yanjú gbogbo àìdánilójú ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àfẹnusọ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ń bi í léèrè ní ìkọ̀kọ̀’ jẹ́ ọ̀rọ̀ tí òǹkàwé lasán lè lóye, ‘lé e jáde’ sì pa àwòrán àti ìtumọ̀ iṣẹ́ ìléjáde ẹ̀mí mọ́.
