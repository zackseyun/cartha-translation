  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: yo
  text: Ó sì béèrè lọ́wọ́ wọn pé, “Kí ni ẹ ń jíròrò láàárín ara yín?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Kí ni ẹ ń jiyàn lé lórí láàárín ara yín?” Ọ̀rọ̀ ìṣe náà lè túmọ̀ sí ìjíròrò tàbí ìjiyàn, gẹ́gẹ́ bí ọ̀rọ̀ tó yí i ká ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: béèrè lọ́wọ́
  rationale: Ọ̀rọ̀ yìí ń sọ ní ọ̀nà àdánidá pé ó béèrè ìbéèrè lọ́wọ́ wọn, láìfi ìtumọ̀ líle tàbí ìlànà ọ̀rọ̀ kun un.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ni Gíríìkì lò láìdárúkọ àwọn ẹni náà ní pàtó; “wọn” pa àìsọ pàtó yẹn mọ́.
- source_word: Τί
  choice: Kí ni
  rationale: Ó béèrè nípa kókó tàbí ohun tí wọ́n ń sọ̀rọ̀ lé lórí, kì í ṣe ìdí tí wọ́n fi ń ṣe bẹ́ẹ̀.
- source_word: συζητεῖτε
  choice: ẹ ń jíròrò
  rationale: “Jíròrò” lè túmọ̀ sí fífi ọ̀rọ̀ wé ọ̀rọ̀ tàbí ìjiyàn, nítorí náà ó pa ìtumọ̀ gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láìfi dandan sọ pé ìjà ọ̀rọ̀ líle ni.
- source_word: πρὸς αὑτούς
  choice: láàárín ara yín
  rationale: Gbólóhùn yìí ń fi ìṣe alábàápín láàárín àwọn tó wà nínú ẹgbẹ́ náà hàn ní Yorùbá àdánidá.
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” so ìṣe yìí mọ́ ìtàn tó ṣáájú bí καί ṣe rí, láìfi ìtumọ̀ àkókò míì kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àkọ́ṣe tó ní àmì ohùn ní kíkún, ní èdè àdánidá, ọ̀wọ̀, tí òǹkàwé òde òní lè lóye. Ìtumọ̀ náà pa arọ́pò-orúkọ “wọn” mọ́ láìsọ àwọn ẹni tí ó ń tọ́ka sí ní pàtó, ó sì fi àṣàyàn ìtumọ̀ tó túbọ̀ ní ìmọ̀lára ìjiyàn sínú àlàyé ìsàlẹ̀.
