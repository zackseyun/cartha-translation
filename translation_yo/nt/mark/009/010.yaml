id: MRK.9.10
reference: Mark 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: yo
  text: Wọ́n sì pa ọ̀rọ̀ náà mọ́ fún ara wọn[a], wọ́n ń jíròrò ohun tí “jíǹde kúrò láàárín àwọn òkú”[b] túmọ̀ sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àsọyé náà” tàbí “ọ̀rọ̀ tí ó sọ.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ gangan, “jíǹde kúrò láàárín àwọn tí ó ti kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: The phrase refers to Jesus’ preceding statement. “Ọ̀rọ̀ náà” is natural Yoruba and retains the semantic range of λόγος without reducing it to a single lexical word.
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: pa … mọ́ sí àárín ara wọn
  rationale: This idiomatic Yoruba expression conveys that they retained the statement within their own circle and did not make it public.
- source_word: συζητοῦντες
  choice: wọ́n ń jíròrò
  rationale: “Jíròrò” expresses active mutual discussion without implying the sharper conflict that “jiyàn” could suggest.
- source_word: τί ἐστιν
  choice: ohun tí … túmọ̀ sí
  rationale: This naturally expresses their attempt to understand the meaning of Jesus’ words while preserving their uncertainty.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: jí dìde kúrò láàárín àwọn òkú
  rationale: This rendering preserves the articular infinitive’s content and the force of ἐκ νεκρῶν, literally movement out from among dead people.
theological_decisions:
- issue: Resurrection language in the disciples’ discussion
  choice: jí dìde kúrò láàárín àwọn òkú
  alternative: jí dìde kúrò nínú ikú
  rationale: The chosen wording preserves the source phrase’s concrete sense, “rise from among the dead,” and leaves the disciples’ puzzlement unresolved rather than importing later explanation.
translation_notes:
  register: Standard contemporary Yorùbá with full tone marks; dignified but readily understandable. The quoted expression marks the precise phrase the disciples were trying to understand.
