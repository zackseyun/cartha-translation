reference: Mark 9:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: yo
  text: Ó sì dá wọn[c] lóhùn, ó ní, “Ìran aláìgbàgbọ́[a]! Yóò pẹ́ tó ni èmi yóò fi wà pẹ̀lú yín? Yóò pẹ́ tó ni èmi yóò fi faradà yín[b]? Ẹ mú un wá sọ́dọ̀ mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìran aláìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì ἄπιστος lè tọ́ka sí àìní ìgbàgbọ́ tàbí àìṣòtítọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “máa mú sùúrù pẹ̀lú yín.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé-àfọwọ́kọ Gíríìkì kan kò ní “wọn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Ó sì dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìdáhùn àti ọ̀rọ̀ tí ó tẹ̀ lé e hàn; ó tún pa ìṣísẹ̀ ìtàn mọ́ láìjẹ́ kí gbolohun le.
- source_word: γενεὰ ἄπιστος
  choice: Ìran aláìgbàgbọ́ yìí
  rationale: “Aláìgbàgbọ́” fi àìní ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé inú ọ̀rọ̀ yìí hàn ní kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ “aláìṣòótọ́” mọ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí.
- source_word: ἕως πότε
  choice: Yóò ti pẹ́ tó
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún bí ohun kan yóò ṣe gùn tó ní àkókò, ó sì pa agbára ìkùnà-ọkàn inú ọ̀rọ̀ náà mọ́.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: tí èmi yóò fi wà pẹ̀lú yín
  rationale: Ó sọ ìwàníhìn-ín Jesu pẹ̀lú wọn ní ọ̀nà tó mọ́gbọ́n dání, ó sì lo “èmi” láti fi ìtẹnumọ́ ìbéèrè náà hàn.
- source_word: ἀνέξομαι ὑμῶν
  choice: tí èmi yóò fi máa fara dà yín
  rationale: “Fara dà” lè túmọ̀ sí gbígbà tàbí rírú ẹnì kan mọ́ra lábẹ́ ipò tó nira; ó pa ìbínú àti ìrẹ̀wẹ̀sì inú ọ̀rọ̀ Jesu mọ́ láìdi ọ̀rọ̀ náà sí ìtumọ̀ kan ṣoṣo.
- source_word: φέρετε αὐτὸν πρός με
  choice: Ẹ mú un wá sọ́dọ̀ mi
  rationale: Àṣẹ yìí jẹ́ àdánidá, kedere, ó sì tọ́ka sí mímú ọmọkùnrin náà dé ibi tí Jesu wà.
theological_decisions:
- issue: Agbára ìtumọ̀ ἄπιστος nínú ọ̀rọ̀ tí Jesu fi bá wọn wí
  choice: aláìgbàgbọ́
  alternative: aláìṣòótọ́
  rationale: Àyíká ọ̀rọ̀ náà tẹnumọ́ àìní ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé; síbẹ̀, ἄπιστος tún lè ní agbára ìtumọ̀ àìṣòótọ́. A kò pinnu ariyanjiyan ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀, nítorí náà a fi àṣàyàn kejì sínú àlàyé.
- issue: Agbára ìtumọ̀ ἀνέξομαι
  choice: máa fara dà yín
  alternative: máa mú sùúrù fún yín / máa gbà yín mọ́ra
  rationale: “Fara dà” pa ìmọ̀lára wíwúwo àti ìrẹ̀wẹ̀sì Jesu mọ́, nígbà tí àlàyé fi àwọn ojú ìtumọ̀ míì hàn láìrọ̀ ọ́ di ọ̀rọ̀ onírẹ̀lẹ̀ ju ti orísun lọ.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọlọ́wọ̀ àti ọ̀rọ̀ àdánidá fún òǹkàwé òde òní. “Ìran … yìí!” mú ìpè taara Ὦ γενεὰ hàn, “Ó sì … pé” sì jẹ́ àṣà ìtàn Yorùbá tó bá historical present ti Máàkù mu láìfi àkókò ọ̀rọ̀ tí kò bá Yorùbá mu lé e lórí.
