  to: Ó sì dá wọn[c] lóhùn, ó ní, “Ìran aláìgbàgbọ́[a]! Yóò pẹ́ tó ni èmi yóò fi wà pẹ̀lú yín? Yóò pẹ́ tó ni èmi yóò fi faradà yín[b]? Ẹ mú un wá sọ́dọ̀ mi.”
