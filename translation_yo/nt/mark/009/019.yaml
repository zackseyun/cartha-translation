review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ gbogbogbò jẹ́ olóòótọ́ sí Gíríìkì: ìbéèrè méjèèjì, ìbànújẹ́ inú ìbáwí Jesu, àti àṣẹ láti mú ọmọkùnrin náà wá wà níbẹ̀. Síbẹ̀, αὐτοῖς wà nínú akọsílẹ̀ SBLGNT pẹ̀lú àmì ìyàtọ̀ ẹ̀rí; àlàyé ìsàlẹ̀ ojú-ewé yẹ kí ó fi ìyàtọ̀ ẹ̀rí yìí hàn. Àtúnṣe náà tún mú ἀνέξομαι hàn ní kedere sí i pẹ̀lú ''faradà.'''
  naturalness: ‘Yóò ti pẹ́ tó tí èmi yóò fi ...’ kò rọrùn gẹ́gẹ́ bí ìbéèrè Yorùbá òde òní. ‘Yóò pẹ́ tó ni èmi yóò fi ...?’ jẹ́ àdánidá, ó sì pa ìbéèrè ọjọ́-ọ́la Gíríìkì mọ́. ‘Faradà yín’ ni ọ̀rọ̀ boṣewa tó dára ju ‘fara dà yín’ lọ níbí.
  terminology: ‘Ìran aláìgbàgbọ́’ yẹ, ó sì bá ἄπιστος mu dáadáa nínú àyíká yìí. Àṣàyàn àlàyé ‘aláìṣòótọ́’ yẹ kí a ṣàtúnṣe sí ‘aláìṣòtítọ́,’ nítorí èyí ni ó sun mọ́ ‘faithless/unfaithful’; ‘aláìṣòótọ́’ lè túmọ̀ sí aláìní òtítọ́ tàbí aláìṣòótọ́ ní ọ̀nà tí kò péye níbí. ‘Gbà yín mọ́ra’ kò yẹ gẹ́gẹ́ bí àṣàyàn fún ἀνέξομαι, nítorí ó túmọ̀ sí fífamọ́ra/embrace.
  issues:
  - severity: medium
    issue: Ìrísí ‘fara dà’ àti àṣàyàn ‘gbà yín mọ́ra’ fún ἀνέξομαι
    rationale: Ní ìtumọ̀ yìí, ἀνέξομαι jẹ́ ‘endure/bear with.’ ‘Faradà yín’ ni ìṣọ̀kan ọ̀rọ̀ Yorùbá tó péye; ‘gbà yín mọ́ra’ yí ìtumọ̀ padà sí fífamọ́ra ẹni.
  - severity: medium
    issue: Gbolohun ‘Yóò ti pẹ́ tó tí ...’ kò dára tó ní Yorùbá
    rationale: ‘Ti’ ń fi ìpè tẹlẹ̀ hàn, ó sì ń dá ìbéèrè ọjọ́-ọ́la rú. Ìkọ́ ‘Yóò pẹ́ tó ni ...?’ dára, ó sì bá ἕως πότε ... ἔσομαι/ἀνέξομαι mu.
  - severity: low
    issue: Àlàyé ‘aláìṣòótọ́’
    rationale: Àmì ohùn àti ọ̀rọ̀ náà yẹ kí ó jẹ́ ‘aláìṣòtítọ́’ fún ìmọ̀ ‘unfaithful/faithless,’ kí ó má bàa dá a pọ̀ mọ́ ‘òótọ́’ (truth).
  - severity: medium
    issue: Ìyàtọ̀ ẹ̀rí nínú αὐτοῖς (‘wọn’) kò ní àlàyé
    rationale: SBLGNT fi αὐτοῖς sínú àmì ìyàtọ̀ ẹ̀rí. Níwọ̀n bí ìtumọ̀ ti ní ‘wọn,’ àlàyé kékeré yẹ kí ó sọ pé àwọn ìwé-àfọwọ́kọ kan kò ní ọ̀rọ̀ náà, láìfẹ̀sùn kàn án sí ìtumọ̀ kan.
