  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: yo
  text: Lẹ́yìn tí ẹ̀mí náà ké jáde, tí ó sì mú ọmọ náà gbọ̀n gidigidi[a], ó jáde kúrò lára rẹ̀. Ọmọ náà sì dà bí òkú[b], tí ó fi jẹ́ pé ọ̀pọ̀ ènìyàn ń sọ pé, “Ó ti kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó sì sọ ọ́ sínú ìgbọ̀n-ara líle.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó dà bí ẹni tó kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: ké jáde
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe náà mọ́ láìfi irú ohùn tí a kò sọ nínú Gíríìkì kún un; àkópọ̀ pẹ̀lú ọ̀rọ̀-ìṣe tó tẹ̀ lé e fi hàn pé ó ṣẹlẹ̀ ṣáájú jíjáde.
- source_word: πολλὰ σπαράξας
  choice: mú kí ara ọmọ náà gbọ̀n gidigidi
  rationale: Nínú àyíká yìí, σπαράσσω tọ́ka sí mímú ara ẹni gbọ̀n tàbí dìde-dìde, kì í ṣe yíya ara ní ti gidi; πολλὰ jẹ́ ọ̀rọ̀ amúnibíni tó túmọ̀ sí “gidigidi.” A mú “ọmọ náà” wá láti inú àyíká ọ̀rọ̀.
- source_word: ἐξῆλθεν
  choice: ó jáde kúrò lára rẹ̀
  rationale: Ẹ̀mí náà ni kókó ọ̀rọ̀ tí a lóye láti inú àyíká; “jáde kúrò lára rẹ̀” jẹ́ ọ̀nà Yorùbá adayébá fún jíjáde ẹ̀mí kúrò lára ọmọ náà.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Ọmọ náà sì dà bí òkú
  rationale: “Dà bí” pa ìfiwéra ὡσεὶ mọ́, kò sì sọ pé ó kú ní ti gidi.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: tó bẹ́ẹ̀ tí ọ̀pọ̀ ènìyàn fi ń sọ pé
  rationale: “Ọ̀pọ̀ ènìyàn” fi τοὺς πολλούς hàn láìsọ ọ́ di “ọ̀pọ̀ jù lọ”; “ń sọ” mú ìṣe tó ń lọ nínú λέγειν jáde.
- source_word: ὅτι ἀπέθανεν
  choice: “Ó ti kú.”
  rationale: Ọ̀rọ̀ tààrà jẹ́ adayébá ní Yorùbá; “ó ti kú” sọ ìpinnu àwọn tó ń wò ó pé ikú ti ṣẹlẹ̀, kì í ṣe ìjẹ́rìí akọ̀ròyìn pé ọmọ náà kú ní ti gidi.
theological_decisions:
- issue: Bóyá ọmọ náà kú ní ti gidi tàbí pé ó kan dà bí ẹni tó kú
  choice: Akọ̀ròyìn sọ pé ọmọ náà dà bí òkú, nígbà tí àwọn ènìyàn sọ pé ó ti kú.
  alternative: Kí a sọ pé ọmọ náà kú fún ìgbà díẹ̀, tàbí kí a sọ ní pàtó pé kò kú rárá.
  rationale: Ọ̀rọ̀ ìfiwéra ὡσεὶ àti èrò àwọn ènìyàn tí wọ́n ń wò ó yàtọ̀ sí ìjẹ́rìí pé ikú ṣẹlẹ̀. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́, kò sì fi àjíǹde tí ẹsẹ yìí kò sọ kún un.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tó sì ṣeé lóye ni a lò. A tún “ẹ̀mí náà” àti “ọmọ náà” sọ níbi tí arọ́pò-orúkọ Yorùbá “ó” lè fa àìmọ̀ ẹni tí a ń tọ́ka sí; àwọn àmì ohùn wà ní kíkún níbi tí wọ́n ti jẹ́ adayébá.
