  to: Wọ́n sì mú un wá sọ́dọ̀ rẹ̀. Nígbà tí ẹ̀mí náà rí i, lẹ́sẹ̀kẹsẹ̀ ni ó mú un gbọ̀n tìtì[a]; ó sì ṣubú sílẹ̀, ó ń lùgbàdùgbà, ó sì ń yọ ìfófó.
