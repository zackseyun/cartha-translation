  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: yo
  text: Wọ́n sì mú un wá sọ́dọ̀ rẹ̀. Nígbà tí ẹ̀mí náà rí i, lẹ́sẹ̀kẹsẹ̀ ni ó mú un gbọ̀n tìtì[a]; ó sì ṣubú sílẹ̀, ó ń lùgbàdùgbà, ó sì ń yọ ìfófó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fa ìgbọn líle bá a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: wọ́n mú un ... wá
  rationale: Ó sọ pé wọ́n mú ọmọ náà tọ Jesu wá, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìṣípò sí ọ̀dọ̀ ẹnì kan ní Yorùbá.
- source_word: πρὸς αὐτόν
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìlọsíwájú sí ọ̀dọ̀ Jesu hàn láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ἰδὼν αὐτόν
  choice: nígbà tí ẹ̀mí náà rí i
  rationale: Ìtumọ̀ àsìkò yìí mú ipa participle aorist náà jáde ní Yorùbá tó ṣe kedere.
- source_word: τὸ πνεῦμα
  choice: ẹ̀mí náà
  rationale: Ẹsẹ yìí sọ 'ẹ̀mí' nìkan; a kò fi 'àìmọ́' tàbí 'ẹ̀mí èṣù' kún ọ̀rọ̀ orísun.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa agbára adverb náà mọ́ ní èdè Yorùbá òde òní.
- source_word: συνεσπάραξεν
  choice: ó mú kí ara rẹ̀ gbọ̀n tìtì
  rationale: Ó ṣàpèjúwe ìgbọ̀n ara líle tí ẹ̀mí náà fa, láìlo ọ̀rọ̀ tó lè túmọ̀ sí yíya ara.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: ó sì ṣubú lulẹ̀
  rationale: Ìlànà gbolohun yìí mú kó ṣe kedere pé ọmọ náà ni ó ṣubú, ó sì ṣàfihàn ìṣẹ̀lẹ̀ tó tẹ̀ lé e lọ́nà àdánidá.
- source_word: ἐκυλίετο
  choice: ó ń yí ara rẹ̀ ká
  rationale: Àmì 'ń' fi ìṣe tí ó ń bá a lọ hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: ἀφρίζων
  choice: tí ó sì ń yọ ìfófó
  rationale: Ó sọ pé ìfófó ń jáde láìfi 'lẹ́nu' kún un, nítorí èyí kò hàn gbangba nínú Gíríìkì.
theological_decisions:
- issue: Ìdánimọ̀ τὸ πνεῦμα
  choice: ẹ̀mí náà
  alternative: ẹ̀mí àìmọ́ náà; ẹ̀mí èṣù náà
  rationale: Àyíká ẹsẹ náà fi hàn pé ẹ̀mí àìmọ́ ni, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ 'ẹ̀mí' nìkan; nítorí náà a pa àìpéye ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti ìtàn, ó níyì, ó sì ṣe kedere fún òǹkàwé òde òní. A yàgò fún fífi 'àìmọ́' tàbí 'ẹ̀mí èṣù' kún ẹsẹ yìí.
