id: MRK.9.31
reference: Mark 9:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: yo
  text: Nítorí ó ń kọ́ àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì ń sọ fún wọn pé, “A ó fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́[a], wọn yóò sì pa á; lẹ́yìn tí wọ́n bá sì ti pa á, lẹ́yìn ọjọ́ mẹ́ta[b], yóò dìde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “sínú ọwọ́ àwọn ènìyàn.” Gbólóhùn náà túmọ̀ sí fífi í sábẹ́ agbára tàbí ìṣàkóso wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọjọ́ mẹ́ta.” Gíríìkì níhìn-ín ní “lẹ́yìn ọjọ́ mẹ́ta,” gbólóhùn tí a tún ń lò níbòmíràn lẹ́gbẹ̀ẹ́ “ní ọjọ́ kẹta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ó ń kọ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ó ń bá a lọ hàn; ‘ó ń kọ́’ jẹ́ Yorùbá àdánidá fún ìkọ́ni tí ó ń tẹ̀ síwájú.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àyíká rẹ̀ gẹ́gẹ́ bí àlàyé ìdí; ‘Nítorí’ pa agbára àsopọ̀ náà mọ́.
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tí ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e.
- source_word: ἔλεγεν
  choice: ó sì ń sọ fún wọn
  rationale: Fífi ‘ń’ lò tún fi ìṣe tí ó ń bá a lọ hàn, ó sì bá ìṣètò ἐδίδασκεν mu.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ ìtọ́kasí náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwòrán inú Dáníẹ́lì mọ́ láìṣe àlàyé rẹ̀ sí ohun mìíràn.
- source_word: παραδίδοται
  choice: A ó fi ... lé ... lọ́wọ́
  rationale: Ìtumọ̀ yìí pa ààyè ìtumọ̀ gbígbòòrò ti fífi ẹnì kan sábẹ́ agbára ẹlòmíràn mọ́; kò dín un kù sí ‘dà’ nìkan, kò sì sọ ẹni tó ń ṣe e ní pàtó.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: lé àwọn ènìyàn lọ́wọ́
  rationale: Èdè Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán ‘ọwọ́’ gẹ́gẹ́ bí agbára tàbí ìṣàkóso mọ́.
- source_word: ἀποκτενοῦσιν
  choice: wọn yóò sì pa á
  rationale: Ó túmọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní tààràtà, tí àwọn aṣojú rẹ̀ kò sì ní orúkọ pàtó.
- source_word: ἀποκτανθεὶς
  choice: lẹ́yìn tí wọ́n bá sì ti pa á
  rationale: Ó fi hàn gbangba pé pípa náà ṣẹlẹ̀ ṣáájú dídìde, bí àpólà aláìṣe ti Gíríìkì ṣe ń tọ́ka.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: lẹ́yìn ọjọ́ mẹ́ta
  rationale: μετά pẹ̀lú accusative túmọ̀ sí ‘lẹ́yìn’; a pa ọ̀rọ̀ ẹsẹ yìí mọ́ láìṣe é ní ‘ní ọjọ́ kẹta.’
- source_word: ἀναστήσεται
  choice: yóò dìde
  rationale: Ọ̀nà àárín ọjọ́ iwájú náà ṣe àtìlẹ́yìn fún ọ̀rọ̀-ìṣe aláìgba ohun ‘dìde,’ láìyí i sí passive ‘a ó jí i dìde.’
theological_decisions:
- issue: Ìyàtọ̀ láàárín Ὁ υἱὸς τοῦ ἀνθρώπου àti ἀνθρώπων
  choice: Ọmọ Ènìyàn ... àwọn ènìyàn
  alternative: Ọmọ Ènìyàn ... ọwọ́ ẹ̀dá ènìyàn
  rationale: Yorùbá ‘ènìyàn/àwọn ènìyàn’ pa àtúnṣe ọ̀rọ̀ inú Gíríìkì mọ́ ní kedere, láìfi akọ nìkan sí ἀνθρώπων, èyí tí ó lè túmọ̀ sí àwọn ènìyàn lápapọ̀.
- issue: Ohùn àti ìtumọ̀ παραδίδοται
  choice: A ó fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́
  alternative: A ó da Ọmọ Ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ aṣojú náà, ó sì lè ní fífi léni lọ́wọ́, ìdà, ìmú, àti ààyè Ọlọ́run nínú rẹ̀. Ìtumọ̀ tí a yàn kò yanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà láìnídìí.
- issue: Ọ̀nà dídìde nínú ἀναστήσεται
  choice: yóò dìde
  alternative: a ó jí i dìde
  rationale: A tẹ̀ lé ọ̀nà àárín/intransitive ti ẹsẹ yìí, dípò fífi passive tí àwọn ẹsẹ mìíràn lò wọ̀ ọ́.
- issue: Àkókò μετὰ τρεῖς ἡμέρας
  choice: lẹ́yìn ọjọ́ mẹ́ta
  alternative: ní ọjọ́ kẹta
  rationale: A pa gbólóhùn Gíríìkì ẹsẹ yìí mọ́, bó tilẹ̀ jẹ́ pé àwọn ibi mìíràn lè sọ ‘ní ọjọ́ kẹta’; a kò ṣe ìbámu ọ̀rọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo àmì ohùn ní kíkún, a sì lo àkópọ̀ ‘ń’ láti fi ìṣe tí ó ń bá a lọ hàn. ‘Lé ... lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa àwòrán ọwọ́ àti agbára inú Gíríìkì mọ́.
