  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: yo
  text: 'Ó sì mú ọmọ kan, ó sì fi í dúró láàárín wọn[a]; ó sì gbá a mọ́ra[b], ó sọ fún wọn pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fi í sí àárín wọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “ó mú kí ó dúró,” ṣùgbọ́n a tún lè sọ ọ́ ní Yorùbá gẹ́gẹ́ bí fífi ẹnì kan sí ibì kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó gbé e sínú apá rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbé ẹnì kan sínú apá tàbí gbígbá a mọ́ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: mú
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist yìí ṣàfihàn ìṣe tí ó ṣáájú ἔστησεν. “Mú” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìtẹ̀lé ìṣe inú Gíríìkì mu.
- source_word: παιδίον
  choice: ọmọ kan
  rationale: παιδίον túmọ̀ sí ọmọ, tí ó sábà máa ń jẹ́ ọmọ kékeré; ṣùgbọ́n kò pọndandan láti fi ìtumọ̀ kékeré kún un níhìn-ín.
- source_word: ἔστησεν
  choice: gbé e dúró
  rationale: ἔστησεν jẹ́ causative níhìn-ín, ìyẹn “mú kí ó dúró.” “Gbé e dúró” pa ìṣe gidi náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐν μέσῳ αὐτῶν
  choice: láàárín wọn
  rationale: Ó tọ́ka sí ibi tí ọmọ náà wà ní àárín ẹgbẹ́ náà; “láàárín wọn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ ibi mọ́.
- source_word: ἐναγκαλισάμενος
  choice: gbé e sí apá rẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí gbígbé ẹnì kan sínú apá tàbí gbígbá a mọ́ra. “Gbé e sí apá rẹ̀” mú ìfarahàn ara náà hàn kedere láìfi ìtumọ̀ míì kún un.
- source_word: εἶπεν αὐτοῖς
  choice: ó wí fún wọn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, aláìṣègbè ti λέγω pẹ̀lú ẹni tí a bá sọ̀rọ̀ sí.
