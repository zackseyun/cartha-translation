id: MRK.9.1
reference: Mark 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Lóòótọ́ ni mo sọ fún yín, àwọn kan nínú àwọn tí wọ́n dúró níhìn-ín[a] kì yóò tọ́ ikú wò rárá[b] títí wọ́n yóò fi rí ìjọba Ọlọ́run tí ó ti dé pẹ̀lú agbára[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “àwọn kan tó dúró níhìn-ín.”'
    reason: lexical_alternative
  - marker: b
    text: “Tọ́ ikú wò” jẹ́ àkànlò èdè tí ó túmọ̀ sí láti ní ìrírí ikú, tàbí láti kú.
    reason: lexical_alternative
  - marker: c
    text: “Ìjọba Ọlọ́run tí ó ti dé pẹ̀lú agbára” lè ní ìbáṣepọ̀ pẹ̀lú ìyípadà àwòrán Jésù, àjíǹde rẹ̀, Pẹ́ńtíkọ́stì, ìdájọ́ Jerúsálẹ́mù, tàbí ìmúṣẹ ìjọba náà ní ọjọ́ iwájú; ẹsẹ yìí fúnra rẹ̀ kò sọ èyí tí ó ní lọ́kàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect nínú èdè Gíríìkì ń fi ìṣe tí ó ń lọ hàn; ‘ń sọ’ pa ìrísí yìí mọ́ ní Yorùbá láì mú kí gbolohun le.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ọlọ́lá láti sọ ìfọ̀rọ̀wérọ̀ pàtàkì tí ἀμήν ń ṣí sílẹ̀ nínú àwọn Ìhìn Rere.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: àwọn kan wà lára àwọn tí wọ́n dúró níhìn-ín
  rationale: '‘Lára’ mú ìtumọ̀ partitive náà ṣe kedere: kì í ṣe gbogbo àwọn tó wà níbẹ̀, bí kò ṣe àwọn kan nínú wọn.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: kì yóò tọ́ ikú wò rárá
  rationale: ‘Kì yóò … rárá’ fi ìkọ̀ tí ó lágbára ti οὐ μή hàn, ‘tọ́ ikú wò’ sì pa àkàwé Gíríìkì mọ́.
- source_word: ἕως ἂν ἴδωσιν
  choice: títí wọn yóò fi rí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ààlà àkókò ọjọ́ iwájú, ‘títí … yóò fi’ sì jẹ́ ọ̀nà Yorùbá tí ó bá a mu.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Yorùbá tí a mọ̀ dáadáa, ó sì lè gba ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run.
- source_word: ἐληλυθυῖαν ἐν δυνάμει
  choice: tí ó ti dé pẹ̀lú agbára
  rationale: ‘Ó ti dé’ pa abajade ìṣe pípé ti perfect participle mọ́; ‘pẹ̀lú agbára’ jẹ́ Yorùbá àdánidá tí kò sọ irú ìṣẹ̀lẹ̀ tí agbára náà tọ́ka sí ní pàtó.
theological_decisions:
- issue: Àkókò àti ìṣẹ̀lẹ̀ tí ‘ìjọba Ọlọ́run tí ó ti dé pẹ̀lú agbára’ ń tọ́ka sí
  choice: A túmọ̀ ọ̀rọ̀ náà láì dá ìṣẹ̀lẹ̀ kan pàtó mọ́ ọn.
  alternative: Ó lè jẹ́ ìyípadà àwòrán Jésù, àjíǹde àti ìgbéga rẹ̀, Pẹ́ńtíkọ́stì, ìdájọ́ Jerúsálẹ́mù, tàbí ìmúṣẹ ìjọba náà ní ọjọ́ iwájú.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìṣẹ̀lẹ̀ tí ó ní lọ́kàn ní pàtó; ìtumọ̀ náà nítorí náà pa àìdánilójú àti ìfọ̀rọ̀wánilẹ́nuwò ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa onílùú pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àkàwé ‘tọ́ ikú wò’ mọ́, ṣùgbọ́n a ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
