source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: yo
  text: Àwọn aṣọ rẹ̀ sì di dídán, wọ́n sì funfun gidigidi, débi pé kò sí ẹni tó ń fọ aṣọ lórí ilẹ̀ ayé tí ó lè sọ wọ́n di funfun tó bẹ́ẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: àwọn aṣọ
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ gbogbogbò fún ohun ìwọ̀; “àwọn aṣọ” jẹ́ Yorùbá àdánidá, kò sì fi irú aṣọ kan pàtó kún un.
- source_word: ἐγένετο
  choice: ń ... wọ́n sì
  rationale: Nínú àyíká ìtàn yìí, ó ṣàpèjúwe ìyípadà sí ipò tuntun; ìṣọ̀kan gbólóhùn Yorùbá fi ìyípadà náà hàn nípa “ń dán, wọ́n sì funfun.”
- source_word: στίλβοντα
  choice: ń dán
  rationale: Ó fi ìmọ́lẹ̀ tó ń kọ́ yanranyanran hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: λευκὰ λίαν
  choice: funfun gidigidi
  rationale: “Gidigidi” mú agbára λίαν jáde ní Yorùbá tó ṣe déédéé, nígbà tí “funfun” pa ìtumọ̀ àwọ̀ náà mọ́.
- source_word: γναφεύς
  choice: ẹni tó ń fọ aṣọ
  rationale: Ó túmọ̀ iṣẹ́ ẹni tó ń fọ, tó ń tún aṣọ ṣe, tó sì ń sọ ọ́ di funfun; àpèjúwe yìí yé òǹkàwé òde òní ju lílo orúkọ iṣẹ́ àtijọ́ tí kò wọ́pọ̀ lọ.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó pa àfikún pé agbára ènìyàn ní ayé ni àfiwé náà ń tọ́ka sí mọ́.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: kò ... lè sọ wọ́n di funfun tó bẹ́ẹ̀
  rationale: Ó ṣàfihàn àìlèṣe náà àti ìwọ̀n àfiwé οὕτως lọ́nà Yorùbá àdánidá; “wọ́n” tọ́ka padà sí àwọn aṣọ.
theological_decisions:
- issue: Àpèjúwe ohun tí a rí nígbà ìyípadà àwọ̀ Jesu
  choice: Ṣàpèjúwe àwọn aṣọ náà gẹ́gẹ́ bí ohun tó ń dán, tó sì funfun ju ohun tí agbára ènìyàn lè ṣe lọ.
  alternative: Láti fi ọ̀rọ̀ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un, bí “wọ́n ń tan ògo Ọlọ́run.”
  rationale: Ẹsẹ̀ náà ṣàpèjúwe ohun tí ojú rí, kò sì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ ní tààrà; ìtumọ̀ náà kò gbọdọ̀ fi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ẹni tó ń fọ aṣọ” dípò ọ̀rọ̀ iṣẹ́ àtijọ́ tí ọ̀pọ̀ ènìyàn lè má mọ̀; nítorí náà kò sí àlàyé ìsàlẹ̀ ojú ewé tó pọndandan.
