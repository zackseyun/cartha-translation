  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: yo
  text: 'Pétérù sì dáhùn, ó sọ fún Jésù pé, “Rábì, ó dára kí a wà níbí. Ẹ jẹ́ kí a ṣe àgọ́ mẹ́ta[a]: ọ̀kan fún ọ, ọ̀kan fún Mósè, àti ọ̀kan fún Èlíjà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùgbé onígbà díẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àgọ́, ibùgbé ewé, tàbí ibi ààbò onígbà díẹ̀; ẹsẹ yìí kò sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú àjọyọ̀ tàbí àgọ́ ìjọsìn ní kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dáhùn
  rationale: Ó pa àṣà ìsọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé kò sí ìbéèrè tí a sọ ní kedere ṣáájú rẹ̀.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí Gíríìkì ṣe lo àsìkò ìsinsìnyí nínú ìtàn ni a túmọ̀ sí àsìkò tí ó kọjá, èyí tí ó bá ìtàn Yorùbá àdánidá mu.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa orúkọ oyè Sémítì yìí mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ sí olùkọ́, dípò fífi ìtumọ̀ rẹ̀ nìkan sí i.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ó dára kí àwa wà níbí
  rationale: Ó ṣàfihàn ìdájọ́ Pétérù pé wíwà wọn níbẹ̀ dára, ó sì pa ìtẹnumọ́ ‘àwa’ mọ́ lọ́nà àdánidá.
- source_word: ποιήσωμεν
  choice: Ẹ jẹ́ kí a ṣe
  rationale: Ó fi ìṣírí ẹni àkọ́kọ́ ọ̀pọ̀ hàn ní kedere, láìfi ìtumọ̀ ‘kọ́ ilé’ tí ó le ju ọ̀rọ̀ ποιέω lọ kún un.
- source_word: σκηνάς
  choice: àgọ́
  rationale: ‘Àgọ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi ìgbé onígbà díẹ̀ bíi tenti tàbí booth; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́ láìfi ìbáṣepọ̀ àjọyọ̀ tàbí ibi mímọ́ lé ẹsẹ náà lórí.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: ọ̀kan fún ọ, ọ̀kan fún Mósè, àti ọ̀kan fún Èlíjà
  rationale: Ó pa àtúnsọ μίαν àti ìṣọ̀kan ìtòlẹ́sẹẹsẹ Gíríìkì mọ́.
theological_decisions:
- issue: Àwọn ìtumọ̀ ẹ̀sìn tàbí àjọyọ̀ tí σκηνάς lè ní
  choice: Lo ‘àgọ́’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì ṣàlàyé pé ó lè túmọ̀ sí ibùgbé onígbà díẹ̀.
  alternative: Àgọ́ Àjọyọ̀, àgọ́ ìjọsìn, tàbí ibùgbé ewé
  rationale: Ẹsẹ náà kò sọ ní kedere pé Àjọyọ̀ Àgọ́ tàbí àgọ́ ìjọsìn ni Pétérù ní lọ́kàn. Ìtumọ̀ yìí yàgò fún fífi ẹ̀kọ́ tí ó lágbára ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Rábì’ pa àyíká Sémítì mọ́; ‘Ẹ jẹ́ kí a ṣe’ jẹ́ ìṣírí àdánidá, ‘àgọ́’ sì jẹ́ ọ̀rọ̀ tí òǹkàwé lasán lè lóye.
