  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa: Pétérù dáhùn sí Jésù, ó pè é ní Rábì, ó sọ pé ó dára kí wọ́n wà níbẹ̀, ó sì dámọ̀ràn kí a ṣe àgọ́ mẹ́ta pẹ̀lú ìpín kan fún ọkọọkan. Ṣùgbọ́n ‘àwa’ nínú ‘ó dára kí àwa wà níbí’ lè fún ἡμᾶς ní ìtẹnumọ́ àfiwéra tí kò hàn ní pàtàkì nínú Gíríìkì. ‘Kí a wà níbí’ pa ìtumọ̀ náà mọ́ ní kíkún, ó sì jẹ́ ti ara Yorùbá sí i.'
