  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún un pé, “‘Bí o bá lè ṣe é?’[a] Ohun gbogbo ṣeé ṣe fún ẹni tí ó gbàgbọ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì: “‘Bí o bá lè ṣe é?’” Jésù tún ọ̀rọ̀ bàbá náà nínú ẹsẹ̀ tó ṣáájú ṣe, ó sì fi í béèrè ní ọ̀nà ìpèníjà.'
    reason: lexical_alternative
  - marker: b
    text: “Ẹni tí ó gbàgbọ́” tún lè jẹ́ “ẹni tí ó ní ìgbàgbọ́.” Ọ̀rọ̀-ìṣe náà tún lè ní ìtumọ̀ “gbẹ́kẹ̀ lé,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘Bí ìwọ bá lè ṣe é’ ni o wí?
  rationale: Ọ̀rọ̀ atọ́ka neuter Τὸ mú kí gbólóhùn tí bàbá náà ṣẹ̀ṣẹ̀ sọ di ohun tí Jésù tún fa yọ ní ọ̀nà ìbéèrè àti ìjàníyàn. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: δύνῃ
  choice: ìwọ bá lè ṣe é
  rationale: δύναμαι túmọ̀ sí ní agbára tàbí lè ṣe; ‘lè ṣe é’ bá ọ̀rọ̀ tààrà yìí mu ní Yorùbá.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: ‘Ohun gbogbo’ pa ìwọ̀n gbólóhùn Gíríìkì àti agbára ọ̀rọ̀ náà mọ́.
- source_word: δυνατὰ
  choice: ṣeé ṣe
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, δυνατός túmọ̀ sí ohun tí ó ṣeé ṣe.
- source_word: τῷ πιστεύοντι
  choice: fún ẹni tí ó gbàgbọ́
  rationale: Ọ̀rọ̀ aláìpé tí a lò gẹ́gẹ́ bí orúkọ náà tọ́ka sí ẹnikẹ́ni tí ó ń gbàgbọ́; ‘ẹni tí ó gbàgbọ́’ pa ìtumọ̀ yẹn mọ́ láì sọ ọ́ di àmì ìdánimọ̀ kan ṣoṣo.
- source_word: πιστεύοντι
  choice: gbàgbọ́
  rationale: ‘Gbàgbọ́’ ni ìtumọ̀ Yorùbá tí ó ṣe déédé fún πιστεύω níbí; ‘gbẹ́kẹ̀ lé’ tún lè fi apá ìtumọ̀ ìgbẹ́kẹ̀lé hàn.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn ‘ohun gbogbo ṣeé ṣe’
  choice: A pa gbólóhùn tó dà bí èyí tí kò ní ààlà mọ́, láì fi àlàyé kún un nínú ẹsẹ̀ náà.
  alternative: ‘Pẹ̀lú Ọlọ́run, ohun gbogbo ṣeé ṣe fún ẹni tí ó gbàgbọ́,’ tàbí fífi ààlà ọ̀rọ̀ yìí mọ agbára Ọlọ́run hàn gbangba.
  rationale: Gíríìkì kò fi ‘pẹ̀lú Ọlọ́run’ sínú ẹsẹ̀ yìí. Fífi kún un yóò yanjú ìfúnra ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọrọ̀ náà fúnra rẹ̀ fi sílẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tí ó bójú mu, tí ó ní iyì, tí ó sì yé òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó jẹ́ àdánidá; a sì yà ọ̀rọ̀ tí Jésù tún fa yọ sí inú àmì àyọlò láti mú ìtẹnumọ́ orísun hàn.
