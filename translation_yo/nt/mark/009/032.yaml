  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: yo
  text: Ṣùgbọ́n wọn kò lóye ọ̀rọ̀ náà,[a] ẹ̀rù sì ń bà wọ́n láti béèrè lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àsọjáde náà.” Ọ̀rọ̀ Gíríìkì ῥῆμα lè tọ́ka sí ọ̀rọ̀ tí a sọ, àsọjáde, tàbí ọ̀rọ̀ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọn
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó fi ìyàtọ̀ hàn sí àsọtẹ́lẹ̀ Jésù tí ó ṣáájú; ‘wọn’ ń tọ́ka sí àwọn ọmọ-ẹ̀yìn.
- source_word: ἠγνόουν
  choice: wọn kò yé
  rationale: ἀγνοέω níbí túmọ̀ sí pé wọn kò lóye ohun tí Jésù sọ; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì lè fi ipò àìlóye tí ó ń bá a lọ hàn.
- source_word: τὸ ῥῆμα
  choice: ọ̀rọ̀ náà
  rationale: ῥῆμα tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ. ‘Ọ̀rọ̀ náà’ jẹ́ àfihàn Yorùbá tí ó wọ́pọ̀, ó sì pa ààyè ìtumọ̀ ‘àsọjáde’ tàbí ‘ọ̀rọ̀ tí a sọ’ mọ́.
- source_word: ἐφοβοῦντο
  choice: ẹ̀rù sì ń bà wọ́n
  rationale: Fọ́ọ̀mù imperfect náà fi ipò ìbẹ̀rù tí ó ń bá a lọ hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: αὐτὸν
  choice: í
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọn ì bá béèrè lọ́wọ́ rẹ̀.
- source_word: ἐπερωτῆσαι
  choice: láti bi í léèrè
  rationale: ἐπερωτάω túmọ̀ sí láti béèrè tàbí láti fi ìbéèrè wádìí ohun kan; ‘bi í léèrè’ jẹ́ èdè Yorùbá tí ó ṣe kedere ní àyíká yìí.
