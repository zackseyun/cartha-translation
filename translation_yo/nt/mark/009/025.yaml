  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtàn Gíríìkì dáadáa ní gbogbogbò: Jésù rí ogunlọ́gọ̀ tí ń kóra jọ, ó bá ẹ̀mí àìmọ́ wí, ó sì pàṣẹ fún un láti jáde kí ó má wọ ọmọ náà mọ́. Síbẹ̀, “ẹ̀mí odi” lè jẹ́ aláìlójú tàbí má ṣe hàn gbangba gẹ́gẹ́ bí ἄλαλον (“tí kò lè sọ̀rọ̀”).'
