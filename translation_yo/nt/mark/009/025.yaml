id: MRK.9.25
reference: Mark 9:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: yo
  text: 'Ṣùgbọ́n nígbà tí Jésù rí i pé ogunlọ́gọ̀ ènìyàn ń yára kóra jọ[a], ó bá ẹ̀mí àìmọ́ náà wí, ó sì sọ fún un pé, “Ìwọ ẹ̀mí tí kò lè sọ̀rọ̀, tí kò sì gbọ́, èmi pàṣẹ fún ọ: jáde kúrò nínú rẹ̀, má sì tún wọ inú rẹ̀ mọ́ rárá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ogunlọ́gọ̀ ènìyàn ń sáré kóra wọn jọ.” Ọ̀rọ̀-ìṣe Gíríìkì náà fi hàn pé àwọn ènìyàn ń yára kóra jọ sí ibi kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ṣùgbọ́n nígbà tí ... rí i
  rationale: Aorist participle náà fi ipò ìṣẹ̀lẹ̀ tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ àkókò àti ìyípadà ìtàn mọ́.
- source_word: ἐπισυντρέχει ὄχλος
  choice: ogunlọ́gọ̀ ń yára péjọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé àwọn ènìyàn ń sáré tàbí ń kóra jọ sí ibi kan; “ń yára péjọ” mú ìkánjú àti ìṣe tí ń lọ lọ́wọ́ hàn ní Yorùbá àdánidá.
- source_word: ἐπετίμησεν
  choice: ó bá ... wí
  rationale: “Bá ... wí” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìbáwí aláṣẹ, ó sì bá bí a ṣe ń lo ἐπιτιμάω sí àwọn ẹ̀mí búburú nínú àwọn Ìhìn Rere mu.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ẹ̀mí àìmọ́ náà
  rationale: “Ẹ̀mí àìmọ́” pa èdè ìwé mímọ́ nípa àìmọ́ mọ́, láì sọ ọ́ di àìsàn lásán tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Ìwọ ẹ̀mí odi àti adití
  rationale: “Odi” túmọ̀ sí ẹni tí kò lè sọ̀rọ̀, “adití” sì túmọ̀ sí ẹni tí kò gbọ́; yíyan ọ̀rọ̀ méjèèjì pa ìyàtọ̀ tí Gíríìkì ṣe mọ́, “Ìwọ” sì jẹ́ ìpè tààrà ní Yorùbá.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: èmi pàṣẹ fún ọ
  rationale: “Èmi” ṣe àfihàn ìtẹnumọ́ arọ́pò-orúkọ ἐγώ, “pàṣẹ fún ọ” sì fi àṣẹ tààrà hàn láì fi nǹkan kún ọ̀rọ̀ náà.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: jáde kúrò lára rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ẹ̀mí náà fi ọkùnrin náà sílẹ̀, ó sì pa agbára àṣẹ náà mọ́.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: má sì wọ inú rẹ̀ mọ́ láéláé
  rationale: μηκέτι pẹ̀lú àṣẹ ìdènà fi hàn pé kò gbọdọ̀ tún wọ inú rẹ̀ mọ́ rárá; “láéláé” mú ìdènà ọjọ́ iwájú náà lágbára ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ẹ̀mí búburú àti àṣẹ Jésù
  choice: Lo “ẹ̀mí àìmọ́,” “ó bá ... wí,” àti “èmi pàṣẹ fún ọ.”
  alternative: “ẹ̀mí búburú” tàbí ọ̀rọ̀ tí yóò sọ ìṣẹ̀lẹ̀ náà di àìsàn lásán
  rationale: Ẹsẹ̀ náà fi ẹ̀mí náà hàn gẹ́gẹ́ bí ẹni tí Jésù ń bá sọ̀rọ̀ tààrà, tí ó sì wà lábẹ́ àṣẹ rẹ̀. Ìtumọ̀ náà kò rọ ẹ̀mí náà di àrùn lásán, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìsìn míràn kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo “ogunlọ́gọ̀” fún ọ̀pọ̀ ènìyàn, “ẹ̀mí àìmọ́” fún àṣà ọ̀rọ̀ Ìhìn Rere, àti gbólóhùn àṣẹ kúkúrú láti pa agbára ọ̀rọ̀ Jésù mọ́.
