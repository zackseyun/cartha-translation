revisions:
- from: 'Ṣùgbọ́n nígbà tí Jésù rí i pé ogunlọ́gọ̀ ń yára péjọ[a], ó bá ẹ̀mí àìmọ́ náà wí, ó sì wí fún un pé, “Ìwọ ẹ̀mí odi àti adití, èmi pàṣẹ fún ọ: jáde kúrò lára rẹ̀, má sì wọ inú rẹ̀ mọ́ láéláé.”'
  to: 'Ṣùgbọ́n nígbà tí Jésù rí i pé ogunlọ́gọ̀ ènìyàn ń yára kóra jọ[a], ó bá ẹ̀mí àìmọ́ náà wí, ó sì sọ fún un pé, “Ìwọ ẹ̀mí tí kò lè sọ̀rọ̀, tí kò sì gbọ́, èmi pàṣẹ fún ọ: jáde kúrò nínú rẹ̀, má sì tún wọ inú rẹ̀ mọ́ rárá.”'
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó lè ṣàìlójú, “odi,” pẹ̀lú gbólóhùn tó ṣe kedere fún ìdákẹ́jẹ nínú ọ̀rọ̀, nígbà tí ó pa “kò gbọ́” mọ́ gẹ́gẹ́ bí àbùdá kejì. Ó tún mú ìtumọ̀ kíkóra-jọ pẹ̀lú ìkánjú hàn kedere. Àṣẹ pé kí ẹ̀mí náà má tún wọ inú ọmọ náà mọ́ ni a pa mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
