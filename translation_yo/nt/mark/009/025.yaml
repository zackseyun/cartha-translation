  terminology: “Ẹ̀mí àìmọ́,” “ó bá ... wí,” àti “èmi pàṣẹ fún ọ” yẹ, wọ́n sì pa ọ̀rọ̀ ìjọba Jésù àti ẹ̀ka ọ̀rọ̀ Ìhìn Rere mọ́. A yẹ kí a máa yà “kò lè sọ̀rọ̀” sọ́tọ̀ kúrò ní “kò gbọ́,” bí Gíríìkì ṣe yà wọ́n sọ́tọ̀.
