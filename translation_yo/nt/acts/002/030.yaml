id: ACT.2.30
reference: Acts 2:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí ó ti jẹ́ wòlíì, tí ó sì mọ̀ pé Ọlọ́run ti fi ìbúra búra fún un pé yóò mú ọ̀kan lára àwọn àtọmọdọ́mọ rẹ̀[a] jókòó lórí ìtẹ́ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “ọ̀kan láti inú èso ìbàdí rẹ̀.”
    reason: Ọ̀rọ̀ Gíríìkì lo àwòrán ara fún àtọmọdọ́mọ tàbí ìran ẹ̀jẹ̀; àlàyé yìí pa àwòrán gangan náà mọ́.
lexical_decisions:
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ẹni tí ń sọ ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde tàbí ìtumọ̀ ohun tí a ṣẹ̀ṣẹ̀ sọ nípa Dáfídì.
- source_word: ὑπάρχων
  choice: níwọ̀n bí ó ti jẹ́
  rationale: Ó mú ipò àti ìdí tí participle náà ń tọ́ka sí jáde ní Yorùbá àdánidá.
- source_word: εἰδὼς
  choice: tí ó sì mọ̀
  rationale: Ó pa ìbáṣepọ̀ participle kejì mọ́, ó sì so ó mọ́ jíjẹ́ wòlíì lọ́nà tó ṣe kedere.
- source_word: ὅρκῳ ὤμοσεν
  choice: ti fi ìbúra búra fún un
  rationale: Ó pa ìtẹnumọ́ àti ọlá àdéhùn inú ọ̀rọ̀ orísun mọ́ nípa mímú orúkọ àti ọ̀rọ̀-ìṣe ìbúra jáde.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: ọ̀kan lára àwọn àtọmọdọ́mọ rẹ̀
  rationale: Èyí sọ ìtumọ̀ ìran ẹ̀jẹ̀ náà ní Yorùbá òde òní tí gbogbo ènìyàn lè lóye; àwòrán gangan inú Gíríìkì wà nínú àlàyé ìsàlẹ̀.
- source_word: καθίσαι
  choice: òun yóò fi ... jókòó
  rationale: 'Ìkọ́lé yìí pa agbára causative mọ́: Ọlọ́run ni yóò gbé àtọmọdọ́mọ náà kalẹ̀ sí orí ìtẹ́, kì í ṣe pé ẹni náà yóò kàn jókòó fúnra rẹ̀.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: lórí ìtẹ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ ìgbékalẹ̀ ọba; arọ́pò-orúkọ náà ni a fi sílẹ̀ gẹ́gẹ́ bí ó ti rí nínú orísun, pẹ̀lú Dáfídì gẹ́gẹ́ bí ẹni tí ó ṣeé ṣe jù lọ tí ó ń tọ́ka sí.
theological_decisions:
- issue: Ìlérí ìjọba tí Ọlọ́run ṣe fún Dáfídì
  choice: A pa èdè àtọmọdọ́mọ àti ìtẹ́ mọ́ láì fi ọ̀rọ̀ “Mèsáyà” kún ẹsẹ yìí.
  alternative: “pé Mèsáyà yóò jókòó lórí ìtẹ́ rẹ̀”
  rationale: Àyíká ọ̀rọ̀ fi ìlérí náà kan Jésù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ nípa àtọmọdọ́mọ Dáfídì àti ìtẹ́ rẹ̀. Ìtumọ̀ náà jẹ́ kí àyíká ọ̀rọ̀ ṣe àlàyé ìṣe Kristi láì fi ohun tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àtọmọdọ́mọ” dípò gbólóhùn ara tí kò wọ́pọ̀ nínú ọ̀rọ̀ ojoojúmọ́, ṣùgbọ́n a fi ìtumọ̀ gangan sínú àlàyé ìsàlẹ̀. Kọ́mà ìparí pa ìṣàn gbólóhùn tí ó ń bá ẹsẹ tó tẹ̀ lé e lọ mọ́.
