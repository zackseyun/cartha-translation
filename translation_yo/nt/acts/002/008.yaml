  - severity: low
    issue: Gbólóhùn ìbí wà nínú ‘ìbílẹ̀’ nìkan, àlàyé ìsàlẹ̀ sì ní ìsọ̀rọ̀ tí kò rọrùn.
    rationale: Ó dára kí ìtumọ̀ àkọ́kọ́ fi ‘láti ìbí’ hàn kedere; ìtumọ̀ ìsàlẹ̀ àtijọ́ ‘èyí tí a bí olúkúlùkù wa sí’ kò rọrùn ní Yorùbá.
