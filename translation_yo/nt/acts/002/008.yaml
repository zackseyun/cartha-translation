translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní ọlá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Ìtumọ̀ náà lo ìbéèrè ìyàlẹ́nu àdánidá, ó sì pa àṣàyàn ‘èdè’ tàbí ‘ẹ̀ka èdè’ mọ́ nínú àlàyé ìsàlẹ̀.
