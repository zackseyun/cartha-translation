  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: yo
  text: Báwo sì ni olúkúlùkù wa ṣe ń gbọ́ ní èdè wa gan-an láti ìbí?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ẹ̀ka èdè wa gan-an láti ìbí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Èé sì ti ṣe tí ... fi
  rationale: Ọ̀nà ìbéèrè Yorùbá yìí fi ìyàlẹ́nu tí ọ̀rọ̀ Gíríìkì ní hàn ní èdè àdánidá.
- source_word: ἡμεῖς ... ἕκαστος
  choice: olúkúlùkù wa
  rationale: Ó pa ìtumọ̀ pínpín ἕκαστος mọ́, ó sì fi gbogbo àwọn olùsọ̀rọ̀ sínú rẹ̀ gẹ́gẹ́ bí ἡμεῖς ṣe tẹnumọ́.
- source_word: ἀκούομεν
  choice: ń gbọ́ wọn
  rationale: Àkókò ìṣe tí ń lọ ni ọ̀rọ̀ náà fi hàn nínú àyíká yìí; a fi ‘wọn’ kún un gẹ́gẹ́ bí ohun tí a ń gbọ́, èyí tí àyíká ẹsẹ tó ṣáájú mú kedere.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: ní èdè ìbílẹ̀ tirẹ̀
  rationale: ‘Èdè’ lè dúró fún διάλεκτος láì mú kí ọ̀rọ̀ náà dà bí ọ̀rọ̀ ìmọ̀-ẹ̀dá-èdè tóóró; ‘ìbílẹ̀’ ṣàkópọ̀ ìtumọ̀ gbólóhùn tó tẹ̀ lé e, ‘nínú èyí tí a bí wa.’ ‘Tirẹ̀’ pa ìtumọ̀ ἰδίᾳ mọ́.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: ìbílẹ̀
  rationale: Ìtumọ̀ àdánidá yìí sọ pé èdè tí ó jẹ́ ti ibi ìbí àti ìdàgbàsókè wọn ni, láì ṣe gbólóhùn Yorùbá ní líle.
