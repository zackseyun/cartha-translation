- from: Èé sì ti ṣe tí olúkúlùkù wa fi ń gbọ́ wọn ní èdè ìbílẹ̀ tirẹ̀?[a]
  to: Báwo sì ni olúkúlùkù wa ṣe ń gbọ́ ní èdè wa gan-an láti ìbí?[a]
  rationale: A yọ ohun-ìṣe àfikún ‘wọn’ kúrò kí ìtumọ̀ má bàa ju ohun tí Gíríìkì sọ lọ. A tún sọ ìtumọ̀ ‘èdè tiwa’ àti ìsopọ̀ rẹ̀ pẹ̀lú ìbí ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ẹ̀ka èdè/dialect’ mọ́.
