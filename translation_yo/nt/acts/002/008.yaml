review_pass:
  verdict: revise
  source_fidelity: Àfikún ‘wọn’ nínú ìtumọ̀ àwòkọ́ṣe kò sí nínú Gíríìkì; bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè jẹ́ kó ṣeé lóye, ó fi ohun-ìṣe kan kún ẹsẹ̀ náà. Síwájú sí i, ‘ìbílẹ̀’ nikan ṣàkópọ̀ gbólóhùn ‘nínú èyí tí a bí wa’ dáradára, ṣùgbọ́n ìtumọ̀ tó túnṣe sọ ìsopọ̀ rẹ̀ pẹ̀lú ìbí ní kedere. Ìbéèrè ìyàlẹ́nu, ìtumọ̀ pínpín ‘olúkúlùkù wa,’ àti èrò ‘èdè tiwa’ bá Gíríìkì mu.
  naturalness: ‘Báwo sì ni olúkúlùkù wa ṣe ń gbọ́ ní èdè wa gan-an láti ìbí?’ jẹ́ Yorùbá àdánidá, ó sì yẹ fún ìbéèrè ìyàlẹ́nu. ‘Èdè wa gan-an’ ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà àdánidá láti fi ìtẹnumọ́ ἰδίᾳ hàn, láì mú ìtúmọ̀ ìní-ẹni-kọọkan dà rú.
  terminology: A lo ‘èdè’ fún διαλέκτῳ, gẹ́gẹ́ bí a ṣe ń lò ó ní Yorùbá òde òní. Àlàyé ìsàlẹ̀ ń pa aṣàyàn ‘ẹ̀ka èdè’ (dialect) mọ́. ‘Láti ìbí’ ń ṣàfihàn ἐν ᾗ ἐγεννήθημεν ní ọ̀nà Yorùbá tó rọrùn.
  issues:
  - severity: medium
    issue: ‘wọn’ ni a fi kún ‘ń gbọ́ wọn.’
