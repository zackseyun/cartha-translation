translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àwọn orúkọ ilẹ̀ ni a kọ ní ọ̀nà tí ó rọrùn fún olùkà Yorùbá láti pè. A tún gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tó ní í ṣe pẹ̀lú Líbíà àti Kírénè, kì í ṣe lẹ́yìn Pámfílíà.
