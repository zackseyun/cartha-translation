  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: yo
  text: Fírígíà àti Pámfílíà, Íjíbítì àti àwọn apá Líbíà ní ìhà Kírénè[a], àti àwọn ará Róòmù tí wọ́n wá ṣe àlejò[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn agbègbè Líbíà ní àyíká Kírénè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ará Róòmù tí wọ́n dúró níbí fún ìgbà díẹ̀” tàbí “àwọn àlejò láti Róòmù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: Fírígíà àti Pámfílíà
  rationale: A lo ìkọ̀wé orúkọ agbègbè méjèèjì ní ìbámu pẹ̀lú bí a ṣe ń pe wọ́n ní Yorùbá; ‘àti’ sì mú ìsopọ̀ τε καὶ jáde lọ́nà àdánidá nínú àkójọ.
- source_word: Αἴγυπτον
  choice: Íjíbítì
  rationale: Èyí ni orúkọ orílẹ̀-èdè náà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: àwọn apá Líbíà
  rationale: ‘Àwọn apá’ pa ìtumọ̀ μέρη mọ́ gẹ́gẹ́ bí àwọn ẹ̀ka tàbí agbègbè inú Líbíà, láì sọ ààlà ìṣèlú kan tí Gíríìkì kò sọ.
- source_word: τῆς κατὰ Κυρήνην
  choice: ní ìhà Kírénè
  rationale: Ọ̀rọ̀ yìí fi ibi tí apá Líbíà náà wà hàn ní ìbáṣepọ̀ pẹ̀lú Kírénè. ‘Ní ìhà’ pa ìtumọ̀ ibi tàbí ìtọ́sọ́nà mọ́ láì fi dandan túmọ̀ ọ́ sí àyíká ìlú náà.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: àwọn ará Róòmù tí wọ́n wá ṣe àlejò
  rationale: Ẹ̀ka ọ̀rọ̀ ἐπιδημοῦντες tọ́ka sí àwọn tí wọ́n dúró sí ibì kan fún ìgbà díẹ̀ tàbí tí wọ́n wá bẹ̀ ẹ́ wò; ‘wá ṣe àlejò’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò sọ pé ibẹ̀ ni wọ́n ń gbé títí láé.
