  verdict: revise
  source_fidelity: The draft correctly renders God as the explicit agent of Jesus' resurrection, retains the demonstrative force in “Jésù yìí,” and expresses the collective witness statement. “Ẹlẹ́rìí rẹ̀” is an acceptable Yoruba genitive-style rendering of οὗ with μάρτυρες.
  naturalness: “Gbogbo wa sì ni” is understandable, but “àwa gbogbo ni” more naturally carries the Greek emphasis on the witnesses themselves. The added connective “sì” is not required by the Greek asyndetic clause and can be omitted without loss.
  terminology: “Jí … dìde” is clear, idiomatic Standard Yoruba resurrection language and appropriately avoids reducing the event to merely lifting Jesus upward. “Ẹlẹ́rìí” is the established and fitting term for μάρτυρες.
  issues:
  - severity: low
    issue: The emphatic witness phrase is slightly weakened and an unnecessary connective is added.
    rationale: πάντες ἡμεῖς is emphatic (“all of us/we all”), which “àwa gbogbo” conveys directly. The Greek joins the clauses without a stated conjunction; Yoruba need not supply “sì.”
  revised_text: Ọlọ́run jí Jésù yìí dìde[a]; àwa gbogbo ni ẹlẹ́rìí rẹ̀.
