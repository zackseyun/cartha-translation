id: ACT.2.32
reference: Acts 2:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: yo
  text: Ọlọ́run jí Jésù yìí dìde[a]; àwa gbogbo ni ẹlẹ́rìí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run gbé Jésù yìí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà níbí ń tọ́ka sí àjíǹde kúrò nínú òkú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Jésù yìí
  rationale: ‘Yìí’ pa agbára ìtọ́kasí τοῦτον mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka pàtó sí Jésù tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἀνέστησεν
  choice: jí … dìde
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí àjíǹde; ‘jí … dìde’ fi Ọlọ́run hàn gẹ́gẹ́ bí olùṣe, ó sì ṣe kedere pé ó jí Jésù kúrò nínú òkú.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: A pa olùṣe tí Gíríìkì sọ ní kedere mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: οὗ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò orúkọ oníjẹnítífù náà so àwọn ẹlẹ́rìí mọ́ Jésù yìí àti àjíǹde rẹ̀; ‘ẹlẹ́rìí rẹ̀’ jẹ́ ìtumọ̀ Yorùbá tó ṣàdánidá, tí kò sì pa ìbáṣepọ̀ náà rẹ́.
- source_word: πάντες ἡμεῖς
  choice: gbogbo wa
  rationale: Èyí pa ìtẹnumọ́ Gíríìkì mọ́ ní ọ̀nà tó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: ἐσμεν μάρτυρες
  choice: ni ẹlẹ́rìí
  rationale: ‘Ni ẹlẹ́rìí’ pa àkópọ̀ orúkọ Gíríìkì mọ́, dípò yíyí i padà sí ọ̀rọ̀-ìṣe, ó sì bá ìlò Yorùbá mu.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àjíǹde
  choice: Ọlọ́run jí Jésù yìí dìde
  alternative: Ọlọ́run gbé Jésù yìí dìde
  rationale: ‘Jí … dìde’ sọ ní tààrà pé Ọlọ́run ló jí Jésù kúrò nínú òkú, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe béèrè. ‘Gbé … dìde’ lè tún ṣeé lò, ṣùgbọ́n ó lè túmọ̀ sí gbígbé ènìyàn sókè lásán ní Yorùbá òde òní.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì fi ‘sì’ hàn láti so gbólóhùn ẹlẹ́ẹ̀kejì mọ́ ti àkọ́kọ́ lọ́nà àdánidá.
