id: ACT.2.4
reference: Acts 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: yo
  text: Gbogbo wọn sì kún fún Ẹ̀mí Mímọ́, wọ́n sì bẹ̀rẹ̀ sí í sọ̀rọ̀ ní àwọn ahọ́n mìíràn[a], gẹ́gẹ́ bí Ẹ̀mí ti ń fún wọn ní ọ̀rọ̀ láti sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn èdè mìíràn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; àwọn ẹsẹ tó tẹ̀ lé fi hàn pé àwọn olùgbọ́ lóye ọ̀rọ̀ náà gẹ́gẹ́ bí èdè àwọn ènìyàn gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: kún fún
  rationale: Ọ̀rọ̀ yìí sọ pé Ẹ̀mí Mímọ́ kún inú wọn tàbí pé wọ́n gba ẹ̀kúnrẹ́rẹ́ ìfúnni Ẹ̀mí; “kún fún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Ó tẹnumọ́ pé gbogbo àwọn tó wà níbẹ̀ ló ní ìrírí náà, láìyọ ẹnikẹ́ni sílẹ̀.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú ìtàn Ìṣe 2, èyí ń tọ́ka sí Ẹ̀mí Ọlọ́run tí Jesu ṣèlérí, kì í ṣe ìwà tàbí ẹ̀mí mímọ́ lásán.
- source_word: ἤρξαντο λαλεῖν
  choice: wọ́n sì bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe náà mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἑτέραις γλώσσαις
  choice: ní àwọn èdè mìíràn[a]
  rationale: γλῶσσα lè túmọ̀ sí “ahọ́n” tàbí “èdè.” “Àwọn èdè mìíràn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, àyíká Ìṣe 2:6–11 sì fi hàn pé àwọn olùgbọ́ mọ àwọn èdè náà. Àkọ́lé ìsàlẹ̀ ojú ìwé pa àṣàyàn “ahọ́n” mọ́.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ọ̀nà tí wọ́n gbà sọ̀rọ̀ bá ohun tí Ẹ̀mí ń fún wọn mu.
- source_word: ἐδίδου
  choice: ti ń fún
  rationale: Ìṣe aláìparí nínú Gíríìkì fi ìfúnni tó ń lọ lọ́wọ́ hàn; “ti ń fún” mú ìtumọ̀ yẹn jáde.
- source_word: ἀποφθέγγεσθαι αὐτοῖς
  choice: fún wọn ní ọ̀rọ̀ láti sọ
  rationale: Ó sọ ìfúnni Ẹ̀mí di Yorùbá àdánidá, ó sì pa èrò pé Ẹ̀mí ló ń jẹ́ kí wọ́n sọ ọ̀rọ̀ jáde mọ́ láìdín un kù sí àsọtẹ́lẹ̀ nìkan.
theological_decisions:
- issue: Bóyá πνεύματος ἁγίου jẹ́ Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni tàbí “ẹ̀mí mímọ́” lásán.
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àyíká Ìṣe 2 tọ́ka sí Ẹ̀mí tí a ṣèlérí, ẹni tó sì ń ṣiṣẹ́ gẹ́gẹ́ bí olùfún wọn ní ọ̀rọ̀ láti sọ.
- issue: Bóyá γλώσσαις yẹ kí a túmọ̀ sí “ahọ́n” tàbí “èdè.”
  choice: àwọn èdè mìíràn
  alternative: àwọn ahọ́n mìíràn
  rationale: Ọ̀rọ̀ Gíríìkì gba ìtumọ̀ méjèèjì, ṣùgbọ́n “èdè” jẹ́ Yorùbá tó ṣe kedere jù lọ nínú gbólóhùn yìí, àwọn ẹsẹ tó tẹ̀ lé sì sọ pé àwọn olùgbọ́ gbọ́ èdè ìbílẹ̀ wọn. Àkọ́lé ìsàlẹ̀ ojú ìwé jẹ́ kí àṣàyàn míì hàn, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ní ọ̀rọ̀ láti sọ” jẹ́ gbólóhùn àdánidá fún ìfúnni ọ̀rọ̀ ẹnu, láìfi èrò àsọtẹ́lẹ̀ tàbí ẹ̀kọ́ ìjọ kan kún orísun.
