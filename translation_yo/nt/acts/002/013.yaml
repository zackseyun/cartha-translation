  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn mìíràn ń ṣe wọ́n ní ẹlẹ́yà, wọ́n sì ń sọ pé, “Wọ́n kún fún wáìnì dídùn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wáìnì tuntun.” Ọ̀rọ̀ Gíríìkì náà, γλεῦκος, ń tọ́ka sí wáìnì tútù tí ó dùn; ìtumọ̀ àṣà náà, “wáìnì tuntun,” tún ṣeé ṣe ṣùgbọ́n kò ṣe pàtó tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: àwọn mìíràn
  rationale: Ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ mìíràn láàárín ọ̀pọ̀ ènìyàn; “àwọn mìíràn” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ìyàlẹ́nu àti ìbéèrè àwọn tó ṣáájú, nítorí náà “ṣùgbọ́n” mú ìtakora náà jáde.
- source_word: διαχλευάζοντες
  choice: ń fi wọ́n ṣẹ̀sín
  rationale: Ó túmọ̀ sí ṣíṣe ẹlẹ́yà pẹ̀lú ẹ̀gàn; gbólóhùn yìí ṣe kedere, ó sì pa ìwà ẹ̀gàn náà mọ́.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àkókò imperfect fi ọ̀rọ̀ tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra hàn; àmì “ń” pa ìtumọ̀ yẹn mọ́ ní Yorùbá.
- source_word: ὅτι
  choice: pé, “Wọ́n…
  rationale: Ó ṣí ọ̀rọ̀ tí wọ́n sọ sílẹ̀; ọ̀rọ̀ taara jẹ́ àdánidá ní Yorùbá níbí.
- source_word: Γλεύκους
  choice: ọtí wáìnì dídùn
  rationale: γλεῦκος tọ́ka sí wáìnì tuntun tó ṣì dùn; “ọtí wáìnì dídùn” mú apá pàtàkì ti ìtumọ̀ náà jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa “wáìnì tuntun” mọ́ gẹ́gẹ́ bí òmíràn.
- source_word: μεμεστωμένοι
  choice: kún fún
  rationale: Perfect passive participle náà ṣàpèjúwe ipò tí wọ́n ní pé ohun mímu ti kún inú wọn; “kún fún” jẹ́ àdánidá, ó sì bá àkópọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: εἰσίν
  choice: wọ́n kún
  rationale: Ọ̀rọ̀ ìṣe yìí parí gbólóhùn tó ń ṣàpèjúwe ipò wọn; Yorùbá fi kókó ọ̀rọ̀ “wọ́n” àti “kún” sọ ọ́ ní ti ara.
