  register: A lo Yorùbá àgbàlódé tó mọ́gbọ́n dání, tó sì ní iyì. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; “ń fi wọ́n ṣẹ̀sín” pa ìṣe ẹ̀gàn tó ń lọ lọ́wọ́ mọ́, “wọ́n sì ń sọ” sì fi apá imperfect hàn.
