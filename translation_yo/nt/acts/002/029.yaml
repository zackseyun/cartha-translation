id: ACT.2.29
reference: Acts 2:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: yo
  text: “Ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin[a], mo lè fi ìgboyà sọ fún yín nípa baba ńlá ìran náà, Dáfídì, pé ó kú, a sì sin ín, ibojì rẹ̀ sì wà láàárín wa títí di òní yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin ará”; ní ti gidi, Gíríìkì ní “Ọkùnrin, arákùnrin,” ìyẹn ìpè ọ̀wọ̀ sí àwọn ọkùnrin ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀ tí ó péjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin
  rationale: A mú ọ̀rọ̀ ìpè méjèèjì tí ó jẹ́ akọ nínú Gíríìkì jáde, ní èdè Yorùbá tí ó ṣe kedere, bó tilẹ̀ jẹ́ pé àtúnṣe ‘ẹ̀yin’ jẹ́ kí ìpè náà dún ní ti ẹ̀dá.
- source_word: ἐξὸν εἰπεῖν
  choice: mo lè ... sọ
  rationale: Èyí fi òmìnira tàbí àṣẹ láti sọ̀rọ̀ hàn, kì í ṣe agbára láti ṣe nǹkan lásán.
- source_word: μετὰ παρρησίας
  choice: fi ìgboyà
  rationale: Ó mú èrò ọ̀rọ̀ sísọ ní gbangba, láìfòyà àti pẹ̀lú ìfọkànbalẹ̀ jáde.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: nípa baba ńlá náà, Dáfídì
  rationale: ‘Baba ńlá’ jẹ́ ọ̀nà àdánidá láti pe baba ìran olókìkí; fífi Dáfídì ṣe àfikún orúkọ yàgò fún ìtumọ̀ tí ó lè dà bí ẹni pé a ń sọ nípa baba ńlá Dáfídì fúnra rẹ̀.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: ó kú, a sì sin ín
  rationale: Ó sọ ikú àti ìsìnkú méjèèjì ní kedere. Ìṣe aláìlórúkọ nínú Gíríìkì di gbólóhùn àdánidá Yorùbá ‘a sì sin ín’ láìdárúkọ ẹni tó sin ín.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: ibojì rẹ̀
  rationale: ‘Ibojì’ tọ́ka sí ibi ìsìnkú tí a mọ̀, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἔστιν ἐν ἡμῖν
  choice: wà láàárín wa
  rationale: Ó pa èrò pé ibojì náà ṣì wà ní àgbègbè àti láàárín àwùjọ àwọn olùgbọ́ mọ́.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: títí di òní yìí
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún ohun tí ó ń bá a lọ dé ọjọ́ tí olùsọ̀rọ̀ ń sọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìpè akọ méjì ní ìbẹ̀rẹ̀ ẹsẹ
  choice: Ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin
  alternative: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ Gíríìkì ní orúkọ ìpè akọ méjì ní pàtó. A pa àwọn méjèèjì mọ́ nínú ọ̀rọ̀ pàtàkì, dípò kí a sọ ọ́ di ọ̀rọ̀ tí kò fi akọ tàbí abo hàn; àlàyé ìsàlẹ̀ sì ṣàlàyé iṣẹ́ rẹ̀ gẹ́gẹ́ bí ìpè ọ̀wọ̀ sí àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Baba ńlá náà, Dáfídì’ mú oyè πατριάρχης jáde láìfi ‘wa’ kún ohun tí Gíríìkì kò sọ.
