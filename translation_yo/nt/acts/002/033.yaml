id: ACT.2.33
reference: Acts 2:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí a gbé e ga sí ọwọ́ ọ̀tún Ọlọ́run[a], tí ó sì ti gba ìlérí Ẹ̀mí Mímọ́ lọ́dọ̀ Bàbá[b], ó ti tú ohun tí ẹ̀yin fúnra yín ń rí tí ẹ sì ń gbọ́ yìí jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọwọ́ ọ̀tún Ọlọ́run.” Dative Gíríìkì lè tọ́ka sí ibi tàbí ipò tí a gbé e ga sí, ó sì tún lè tọ́ka sí agbára tàbí ọ̀nà tí a fi gbé e ga.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Ẹ̀mí Mímọ́ tí a ṣèlérí.” Gíríìkì lè túmọ̀ sí ìlérí nípa Ẹ̀mí Mímọ́ tàbí Ẹ̀mí Mímọ́ fúnra rẹ̀ gẹ́gẹ́ bí ohun tí a ṣèlérí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: sí ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ipò ọlá ní ọwọ́ ọ̀tún Ọlọ́run, ó sì bá àyíká ọ̀rọ̀ nípa gbígbé Jesu ga àti jíjẹ ọba mu. Àmọ́, dative Gíríìkì tún lè jẹ́ ti irinṣẹ́, èyí tí àlàyé ìsàlẹ̀ fi pamọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ tí Peteru ti sọ ṣáájú hàn, kì í ṣe pé ó kàn tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn náà.
- source_word: ὑψωθεὶς
  choice: nígbà tí a gbé e ga
  rationale: Ìṣe náà wà ní passive, ó sì ń sọ nípa gbígbé Jesu ga sí ipò ọlá; ọ̀rọ̀ Yorùbá yìí dá ìtumọ̀ náà dúró láìsọ olùṣe tí Gíríìkì kò dárúkọ nínú participle náà.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: ìlérí Ẹ̀mí Mímọ́
  rationale: Ìtumọ̀ tó sún mọ́ ìṣètò Gíríìkì ni èyí, ó sì pa àìdánilójú mọ́ láàárín ìlérí nípa Ẹ̀mí àti Ẹ̀mí gẹ́gẹ́ bí ohun tí a ṣèlérí.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: tí ó sì ti gba ... lọ́dọ̀ Baba
  rationale: “Lọ́dọ̀” fi Baba hàn gẹ́gẹ́ bí orísun ohun tí Ọmọ gba; “ti gba” sì fi hàn pé ó gba á kí ó tó tú u jáde.
- source_word: ἐξέχεεν
  choice: ó ti tú ... jáde
  rationale: Àpèjúwe títú jáde bá àwòrán ọ̀rọ̀ Gíríìkì mu, “ó ti” sì sọ ìṣe tó ti ṣẹlẹ̀ tí ẹ̀rí rẹ̀ ṣì ń hàn níwájú àwọn olùgbọ́.
- source_word: τοῦτο
  choice: èyí
  rationale: A kò fi “Ẹ̀mí” tàbí “ẹ̀bùn” kún un, kí ìtọ́ka kúkúrú àti ààyè ìtumọ̀ inú Gíríìkì lè dúró.
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: ẹ̀yin fúnra yín ń rí, tí ẹ sì ń gbọ́
  rationale: “Ẹ̀yin fúnra yín” pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́; “ń rí” àti “ń gbọ́” sì tọ́ka sí ohun tí wọ́n ń ní ìrírí rẹ̀ ní àkókò náà.
theological_decisions:
- issue: Bóyá τῇ δεξιᾷ τοῦ θεοῦ túmọ̀ sí gbígbé e ga “sí” ọwọ́ ọ̀tún Ọlọ́run tàbí “nípasẹ̀” ọwọ́ ọ̀tún Ọlọ́run
  choice: sí ọwọ́ ọ̀tún Ọlọ́run
  alternative: nípasẹ̀ ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ìtumọ̀ ipò bá ọ̀rọ̀ nípa ìgbéga àti jíjókòó ní ìtẹ́ nínú àyíká ẹsẹ náà mu jù; àmọ́ a fi ìtumọ̀ irinṣẹ́ sínú àlàyé ìsàlẹ̀ nítorí pé gírámà Gíríìkì gbà á láàyè.
- issue: Bóyá τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου jẹ́ ìlérí nípa Ẹ̀mí tàbí Ẹ̀mí náà gẹ́gẹ́ bí ohun tí a ṣèlérí
  choice: ìlérí Ẹ̀mí Mímọ́
  alternative: Ẹ̀mí Mímọ́ tí a ṣèlérí
  rationale: Àyànfẹ́ yìí tẹ̀ lé ìṣètò Gíríìkì, ó sì yẹra fún yíyanju ohun tí genitive náà kò pinnu pátápátá. Àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ kejì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìtòlẹ́sẹẹsẹ gbolohun jẹ́ ti ẹnu Yorùbá adayeba, ṣùgbọ́n a pa ìtẹnumọ́, ìṣe tó ṣáájú ìṣe pàtàkì, àti àwọn àìdánilójú méjèèjì inú Gíríìkì mọ́.
