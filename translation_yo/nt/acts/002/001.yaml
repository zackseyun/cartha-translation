id: ACT.2.1
reference: Acts 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: yo
  text: Nígbà tí ọjọ́ Pẹ́ńtíkọ́stì dé[a], gbogbo wọn wà papọ̀ ní ibi kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ọjọ́ Pẹ́ńtíkọ́stì ń dé sí ìmúṣẹ.”
    reason: Àpólà Gíríìkì συμπληροῦσθαι lè tẹnu mọ́ ìlọsíwájú dídé ọjọ́ náà sí ìmúṣẹ, dípò kíkàn dídé rẹ̀.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: ń pé tán
  rationale: Ìṣe aláìparí tí ó wà nínú gbólóhùn àkókò náà fi hàn pé ọjọ́ náà ń dé ìparí tàbí ń pé ní kíkún. “Ń pé tán” pa ìtumọ̀ ìlọsíwájú yìí mọ́ ní Yorùbá tó ṣeé lóye.
- source_word: πεντηκοστῆς
  choice: Pẹ́ńtíkọ́stì
  rationale: Èyí ni orúkọ Gíríìkì tí Majẹmu Tuntun lò fún àjọ̀dún Júù tí ó wáyé ní ọjọ́ àádọ́ta lẹ́yìn Ìrékọjá; fífi orúkọ náà gẹ́gẹ́ bí “Pẹ́ńtíkọ́stì” mọ́ dára jù fún àyíká yìí.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo ẹgbẹ́ tí a mẹ́nu kàn ṣáájú; “gbogbo wọn” mú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ὁμοῦ
  choice: papọ̀
  rationale: “Papọ̀” fi ìwà ní àjọṣepọ̀ tàbí ní ìṣọ̀kan ibi hàn ní Yorùbá àdánidá.
- source_word: ἐπὶ τὸ αὐτό
  choice: ní ibì kan
  rationale: Àpólà yìí lè túmọ̀ sí wíwà ní ibi kan náà tàbí wíwà papọ̀. Níwọ̀n bí “papọ̀” ti túmọ̀ ὁμοῦ, “ní ibì kan” pa ìtumọ̀ ibi mọ́ láìṣe àtúnwí.
theological_decisions:
- issue: Ta ni ἦσαν ń tọ́ka sí bí kò ṣe pé Gíríìkì tún sọ olùṣe náà
  choice: gbogbo wọn wà papọ̀ ní ibì kan
  alternative: gbogbo ènìyàn wà papọ̀ ní ibì kan
  rationale: Gíríìkì gbé olùṣe náà láti inú àyíká ọ̀rọ̀ tó ṣáájú. “Gbogbo wọn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ó sì yẹra fún fífi “gbogbo ènìyàn” kún un, èyí tí ó lè mú kí ẹgbẹ́ náà gbòòrò ju ohun tí àyíká tọ́ka sí lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó lọ́wọ́, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Pẹ́ńtíkọ́stì” gẹ́gẹ́ bí orúkọ àjọ̀dún tí a mọ̀ nínú Majẹmu Tuntun.
