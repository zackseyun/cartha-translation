revisions:
- from: Peteru sì wí fún wọn pé, “Ẹ ronú pìwà dà, kí olúkúlùkù yín sì ṣe ìrìbọmi ní orúkọ Jesu Mèsáyà[a] fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín[b]; ẹ ó sì gba ẹ̀bùn Ẹ̀mí Mímọ́.”
  to: Pétérù sì wí fún wọn pé, “Ẹ ronú pìwà dà, kí a sì bọ olúkúlùkù yín ní omi ní orúkọ Jésù, ẹni tí í ṣe Mèsáyà[a], fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín[b]; ẹ ó sì gba ẹ̀bùn Ẹ̀mí Mímọ́.”
  rationale: A tún gbolohun ìrìbọmi ṣe sí passive Yorùbá (“kí a sì bọ … ní omi”) kí ó lè bá βαπτισθήτω mu. A tún fi “ẹni tí í ṣe Mèsáyà” hàn gẹ́gẹ́ bí oyè fún Jésù, dípò kí “Mèsáyà” dà bí apá orúkọ lasán. Àwọn ìyókù ń tẹ̀ lé Gíríìkì náà, ó sì pa ìfẹ̀sẹ̀mulẹ̀ ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò pinnu mọ́.
