id: ACT.2.38
reference: Acts 2:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: yo
  text: Pétérù sì wí fún wọn pé, “Ẹ ronú pìwà dà, kí a sì bọ olúkúlùkù yín ní omi ní orúkọ Jésù, ẹni tí í ṣe Mèsáyà[a], fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín[b]; ẹ ó sì gba ẹ̀bùn Ẹ̀mí Mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí a lè túmọ̀ sí “Mèsáyà” tàbí “Kristi”; “Mèsáyà” ni a lò níbí láti mú ìtumọ̀ oyè náà jáde nínú ìkéde Pétérù.
    reason: alternative_reading
  - marker: b
    text: “Fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín” túmọ̀ gbólóhùn Gíríìkì náà ní tààràtà. Èrò àwọn atúmọ̀ Bíbélì yàtọ̀ sí ara wọn nípa bí ìrìbọmi ṣe ní í ṣe pẹ̀lú ìdáríjì níbí; ìtumọ̀ yìí kò pinnu àríyànjiyàn náà kọjá ohun tí ọ̀rọ̀ náà sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Ẹ ronú pìwà dà
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ìpè pàṣẹ sí ọ̀pọ̀ ènìyàn láti yí ọkàn àti ìwà wọn padà ní kíkún; ó gbé apá èrò àti apá ìwà inú ọ̀rọ̀ Gíríìkì náà jáde.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: kí olúkúlùkù yín sì ṣe ìrìbọmi
  rationale: Ó pa ìtumọ̀ àṣẹ ẹni-kọ̀ọ̀kan mọ́ nínú ọ̀pọ̀ ènìyàn, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere láti sọ gbólóhùn náà ní Yorùbá.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: ní orúkọ
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún ipò ìrìbọmi yìí, láìfi dandan pinnu bóyá ìtẹnumọ́ náà wà lórí àṣẹ, ìpìlẹ̀ tàbí ìjẹ́wọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Mèsáyà nínú ìkéde Peteru; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò lílò ó bí orúkọ lásán.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín
  rationale: Ó túmọ̀ gbólóhùn Gíríìkì náà ní tààràtà, ó sì pa ìbáṣepọ̀ tí εἰς fi hàn mọ́ láìyanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa bí ìrìbọmi ṣe ní í ṣe pẹ̀lú ìdáríjì.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: ẹ ó sì gba ẹ̀bùn
  rationale: Ó fi ìlérí ọjọ́ iwájú hàn ní Yorùbá òde òní, “ẹ̀bùn” sì tó láti sọ ohun tí a fi fúnni lọ́fẹ̀ẹ́.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá ìgbàlódé tí ó wọ́pọ̀, tí ó sì pa ọlá àti ìtumọ̀ ti Ẹ̀mí Ọlọ́run mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ìrìbọmi àti ìdáríjì nínú εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: “fún ìdáríjì àwọn ẹ̀ṣẹ̀ yín”
  alternative: “kí a lè dárí àwọn ẹ̀ṣẹ̀ yín jì yín” tàbí “nítorí a ti dárí àwọn ẹ̀ṣẹ̀ yín jì yín”
  rationale: Ìtumọ̀ tí a yàn tẹ̀ lé ọ̀rọ̀ Gíríìkì ní gbangba, ṣùgbọ́n kò fi àlàyé kún un tí yóò pinnu bóyá ìrìbọmi jẹ́ ohun èlò, àmì, tàbí ohun tí ó tẹ̀ lé ìdáríjì.
- issue: Ìtumọ̀ Χριστοῦ
  choice: “Mèsáyà”
  alternative: “Kristi”
  rationale: Nínú ọ̀rọ̀ ìkéde Peteru ní Ìṣe 2, oyè ẹni àmì òróró tí Ọlọ́run yàn ṣì hàn gbangba; “Mèsáyà” mú ìtumọ̀ oyè náà jáde.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé gbogbogbò. “Ẹ ronú pìwà dà” jẹ́ gbólóhùn ìjọsìn tí a mọ̀ síbẹ̀ tí ó tún yé ènìyàn; “olúkúlùkù yín” pa ìtẹnumọ́ ẹni-kọ̀ọ̀kan mọ́.
