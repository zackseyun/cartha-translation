source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: yo
  text: Wọ́n sì ń ta dúkìá àti ohun ìní wọn, wọ́n sì ń pín wọn fún gbogbo wọn[a], gẹ́gẹ́ bí ẹnikẹ́ni ṣe ní àìní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ‘ilẹ̀ àti ohun ìní.’ Ó ṣeé ṣe kí àwọn ọ̀rọ̀ Gíríìkì méjèèjì fi oríṣiríṣi ohun tí ènìyàn ní hàn: κτήματα sábà máa ń tọ́ka sí dúkìá, títí kan ilẹ̀ tàbí ohun-ìní tí kò rọrùn láti gbé, nígbà tí ὑπάρξεις ń tọ́ka sí ohun ìní lápapọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: àwọn ilẹ̀
  rationale: Ọ̀rọ̀ náà sábà máa ń tọ́ka sí dúkìá tí a ní, pàápàá ilẹ̀ tàbí ohun ìní tí kò ṣeé gbé; yíyan ‘àwọn ilẹ̀’ jẹ́ kí ìyàtọ̀ rẹ̀ sí ὑπάρξεις hàn.
- source_word: ὑπάρξεις
  choice: ohun ìní
  rationale: Ó ń tọ́ka sí àwọn ohun tí ènìyàn ní lápapọ̀. ‘Ohun ìní’ jẹ́ èdè Yorùbá àdánidá tí ó sì yàtọ̀ díẹ̀ sí ‘àwọn ilẹ̀.’
- source_word: ἐπίπρασκον
  choice: ń ta
  rationale: Àkókò imperfect ń fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn, kì í ṣe ìṣe ẹ̀ẹ̀kan ṣoṣo tí ó parí.
- source_word: διεμέριζον
  choice: ń pín
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pípín ohun tí wọ́n tà tàbí ohun tí ó ti inú rẹ̀ jáde fún àwọn tó nílò, láìfi ọ̀nà pàtó tí wọ́n gbà ṣe é kún ọ̀rọ̀ náà.
- source_word: αὐτά
  choice: wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí àwọn ilẹ̀ àti ohun ìní, tàbí ohun tí wọ́n rí láti inú títà wọn. ‘Wọn’ pa àìsọ pàtó inú Gíríìkì mọ́.
- source_word: πᾶσιν
  choice: fún gbogbo ènìyàn
  rationale: Dative plural náà ń sọ àwọn olùgbà ní gbòòrò nínú àwùjọ àwọn onígbàgbọ́; gbólóhùn yìí ṣe kedere ní Yorùbá.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: gẹ́gẹ́ bí ẹnikẹ́ni bá ṣe nílò rẹ̀
  rationale: Ó fi hàn pé wọ́n ń pín ní ìbámu pẹ̀lú àìní olúkúlùkù, ó sì pa agbára conditional-indefinite ti ἄν τις mọ́.
theological_decisions:
- issue: Irú ìpín ohun ìní tí àwọn onígbàgbọ́ ń ṣe
  choice: Ẹsẹ̀ náà ṣàpèjúwe títà ohun ìní àti pípín rẹ̀ léraléra gẹ́gẹ́ bí àìní ṣe wà, láìsọ pé wọ́n fòpin sí gbogbo ohun-ìní aládàáni gẹ́gẹ́ bí ẹ̀kọ́ pàtó.
  alternative: Kí a ka ẹsẹ̀ náà sí àṣẹ pé gbogbo Kristẹni gbọ́dọ̀ fi gbogbo ohun ìní sí àpapọ̀.
  rationale: Àwọn ọ̀rọ̀-ìṣe imperfect fi àṣà tí wọ́n ń ṣe léraléra hàn. Síbẹ̀, ẹsẹ̀ náà kò sọ ní tààrà pé gbogbo ohun-ìní aládàáni dópin tàbí pé gbogbo Kristẹni ní gbogbo ìgbà gbọ́dọ̀ tẹ̀lé ètò yìí. Ìtumọ̀ náà dúró lórí àpèjúwe inú ọ̀rọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà ní ibi tí ó bá yẹ. Ìlọ́po ‘ń ta’ àti ‘ń pín’ pa ìṣe tí ń lọ tàbí tí a ń ṣe léraléra mọ́; a kò sì tú αὐτά sí ‘owó tí wọ́n rí’ nítorí pé Gíríìkì kò sọ bẹ́ẹ̀ ní pàtó.
