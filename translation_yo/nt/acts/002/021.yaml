id: ACT.2.21
reference: Acts 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: yo
  text: Yóò sì ṣe pé gbogbo ẹni tí ó bá ké pe orúkọ Olúwa ni a ó gbà là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí, ‘ẹnikẹ́ni tí ó bá ké pe orúkọ Olúwa.’ Ọ̀rọ̀ náà ń ṣe ìrántí Jóẹli 2:32, níbi tí ‘Olúwa’ ti ń tọ́ka sí YHWH; nínú Ìṣe Àwọn Aposteli, Pétérù lo àyọlò náà nínú ìkéde rẹ̀ nípa Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: Yóò sì ṣe pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà ìṣílétí àsọtẹ́lẹ̀; ó pa ìforígbárí ọ̀rọ̀ Ìwé Mímọ́ mọ́, ó sì ṣì ṣeé lóye ní Yorùbá òde òní.
- source_word: πᾶς ὃς ἐὰν
  choice: olúkúlùkù ẹni tí ó bá
  rationale: 'Ó fi ipò àìdájú tí ó kan gbogbo ènìyàn hàn: kò sí ẹni tí a yọ sílẹ̀ lára àwọn tí wọ́n bá ṣe ohun tí gbolóhùn náà sọ.'
- source_word: ἐπικαλέσηται
  choice: ké pe
  rationale: Nínú àṣà ọ̀rọ̀ Bíbélì, ó túmọ̀ sí pípe sí ẹni kan fún ìrànlọ́wọ́ tàbí nínú ìgbẹ́kẹ̀lé àti ìjọsìn; ‘ké pe’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìpè bẹ́ẹ̀.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: A pa àwòrán ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ nítorí ‘ké pe orúkọ’ jẹ́ gbólóhùn Bíbélì tí ó ní ìtumọ̀ ìbáṣepọ̀, ìgbẹ́kẹ̀lé, àti ìjọsìn.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níbí; a kò fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí múlẹ̀ ju bí Gíríìkì ṣe sọ lọ.
- source_word: σωθήσεται
  choice: ni a ó gbà là
  rationale: Ìṣe ọjọ́ iwájú aláìṣe-taara ni; ‘a ó gbà là’ pa èrò ìdáǹdè àti ìgbàlà méjèèjì mọ́, ‘ni’ sì fi àbájáde fún olúkúlùkù ẹni náà tẹnumọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú àyọlò Jóẹli bí a ṣe lò ó nínú Ìṣe Àwọn Aposteli
  choice: A tú κύριος sí ‘Olúwa’ láì sọ ẹni tí ó ń tọ́ka sí ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Nínú Jóẹli, ó tọ́ka sí YHWH; nínú ìkéde Pétérù ní Ìṣe Àwọn Aposteli, àyíká ọ̀rọ̀ náà dojú kọ Jésù.
  rationale: Gíríìkì sọ ‘Olúwa’ nìkan. Títúmọ̀ rẹ̀ bẹ́ẹ̀ pa ìtọ́kasí Jóẹli àti ìfọkànsí sí Jésù nínú ọ̀rọ̀ Pétérù mọ́ papọ̀, láì fi ìpinnu ẹ̀kọ́ ìsìn kan sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àṣà, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Yóò sì ṣe pé’ láti pa ìró àsọtẹ́lẹ̀ Ìwé Mímọ́ mọ́, àti ‘ké pe’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìpè ìgbẹ́kẹ̀lé. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
