review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future introductory formula, the universal conditional scope, invocation of the Lord’s name, and the future passive promise of salvation. It appropriately leaves ‘Olúwa’ unspecified, preserving the referential openness of the Greek citation.
  naturalness: ‘Olúkúlùkù ẹni’ is unnecessarily redundant and less idiomatic than a single universal expression. ‘Gbogbo ẹni tí ó bá’ is clear, natural Standard Yoruba and supports the footnoted alternative ‘ẹnikẹ́ni.’ The traditional biblical idiom ‘ké pe orúkọ Olúwa’ and ‘a ó gbà là’ is retained.
  terminology: ‘Olúwa,’ ‘orúkọ,’ ‘ké pe,’ and ‘gbà là’ are suitable biblical Yoruba terms. The revised note retains YHWH in Joel and Peter’s Jesus-centered proclamation without forcing the referent of ‘Olúwa’ in the verse.
  issues:
  - severity: medium
    issue: Redundant universal expression in the main text
    rationale: ‘Olúkúlùkù ẹni’ duplicates the sense of ‘each/every person.’ Replacing it with ‘gbogbo ẹni’ yields natural Yoruba while retaining πᾶς ὃς ἐὰν and allowing ‘ẹnikẹ́ni’ to function as a meaningful alternative in the footnote.
  revised_text: Yóò sì ṣe pé gbogbo ẹni tí ó bá ké pe orúkọ Olúwa ni a ó gbà là.[a]
