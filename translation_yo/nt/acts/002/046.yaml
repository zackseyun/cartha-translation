  source_fidelity: Àwọn èrò pàtàkì nínú ẹsẹ̀ náà wà nínú àkọ́pamọ́, ṣùgbọ́n “àkàrà” kì í ṣe bread ní Yorùbá; ó ń tọ́ka sí oúnjẹ ẹ̀wà tí a ṣẹ̀. Èyí yí κλῶντες ἄρτον padà sí oúnjẹ míràn. “Ọkàn tí kò ní àgàbàgebè” sì dín ἀφελότης καρδίας kù sí àìní ẹ̀tàn, níbi tí Gíríìkì náà ti ń tọ́ka sí ìrọ̀rùn/síngleness ọkàn ní ìtumọ̀ gbòòrò.
  naturalness: “Wọ́n ń bá a lọ ní ojoojúmọ́” kò pé ní Yorùbá nítorí ohun tí wọ́n ń bá a lọ nínú rẹ̀ kò hàn. “Wọ́n ń fi ọkàn kan máa lọ sí ... lójoojúmọ́” jẹ́ èdè boṣewa, ó sì mú ìfaradà àti ìṣọ̀kan wọn hàn. “Bù búrẹ́dì” jẹ́ ìtumọ̀ tó tọ́ fún breaking bread, níbi tí “àkàrà” ti jẹ́ bean cake.
  terminology: A lo “búrẹ́dì” fún ἄρτος nínú àyíká yìí, láìpinnu bóyá ìṣe náà jẹ́ oúnjẹ àjọṣe lásán tàbí ó ní ìfarahàn Oúnjẹ Alẹ́ Olúwa. “Ìrọ̀rùn ọkàn” pa ìtumọ̀ ἀφελότης καρδίας mọ́ ní ìṣòtítọ́, ní ìmọ̀lára tí kò ní ìṣekúṣe, tàbí ní ọ̀làwọ́, láìyan ọkan nínú wọn gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
