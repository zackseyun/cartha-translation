source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: yo
  text: Wọ́n ń fi ọkàn kan máa lọ sí àgbàlá tẹ́ńpìlì lójoojúmọ́[a]. Wọ́n ń bù búrẹ́dì ní ilé dé ilé[b], wọ́n sì ń jẹ oúnjẹ[c] pẹ̀lú ayọ̀ ńlá àti ìrọ̀rùn ọkàn[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
  - marker: b
    text: “Bíbú búrẹ́dì” lè tọ́ka sí jíjẹ oúnjẹ papọ̀ lásán, bí ó tilẹ̀ jẹ́ pé àwọn kan gbà pé ó tún lè ní í ṣe pẹ̀lú Oúnjẹ Alẹ́ Olúwa.
    reason: alternative_reading
  - marker: c
    text: 'Tàbí: “oúnjẹ.”'
    reason: lexical_alternative
  - marker: d
    text: 'Tàbí: “ìṣòtítọ́ ọkàn” tàbí “ọ̀làwọ́ ọkàn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ní ojoojúmọ́
  rationale: Ó fi ìṣe tí ń ṣẹlẹ̀ léraléra, ọjọ́ dé ọjọ́, hàn ní Yorùbá àdánidá.
- source_word: προσκαρτεροῦντες
  choice: Wọ́n ń bá a lọ
  rationale: Ìṣe aláìparí náà fi ìfaradà àti ìtẹ̀síwájú wọn hàn láìfi ìtumọ̀ ìfọkànsìn tí ó lágbára jù kún un.
- source_word: ὁμοθυμαδόν
  choice: wọ́n sì wà ní ìṣọ̀kan èrò
  rationale: Ó mú ìṣọ̀kan àti ète àpapọ̀ tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí jáde.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; àgbàlá tẹ́ńpìlì mú ìyàtọ̀ náà hàn.
- source_word: κλῶντές ... ἄρτον
  choice: Wọ́n ń bu àkàrà
  rationale: A pa àwòrán gígé tàbí bíbú àkàrà mọ́, kí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oúnjẹ àjọṣe tàbí Oúnjẹ Alẹ́ Olúwa má bàa di pípa mọ́ sí ọ̀nà kan ṣoṣo.
- source_word: κατ’ οἶκον
  choice: ní ilé dé ilé
  rationale: Ó ṣàfihàn ìṣe tí wọ́n ń ṣe káàkiri onírúurú ilé, kì í ṣe pé olúkúlùkù ń ṣe é ní ilé tirẹ̀ nìkan.
- source_word: μετελάμβανον τροφῆς
  choice: wọ́n sì ń jẹ oúnjẹ
  rationale: Ìṣe aláìparí náà ṣàfihàn jíjẹ oúnjẹ tí ń tẹ̀ síwájú; Yorùbá yìí jẹ́ ti àdánidá, kò sì fi èrò pínpín oúnjẹ tí kò ṣe pàtàkì nínú ọ̀rọ̀ náà kún un.
- source_word: ἐν ἀγαλλιάσει
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: ἀγαλλίασις jẹ́ ayọ̀ lílágbára tàbí ayọ̀ tí ó kún àkúnwọ́sílẹ̀; “ayọ̀ ńlá” ṣe àfihàn agbára rẹ̀ ní èdè òde òní.
- source_word: ἀφελότητι καρδίας
  choice: ọkàn tí kò ní àgàbàgebè
  rationale: Ó sọ ọkàn tí ó mọ́, tí kò ní ẹ̀tàn tàbí ìdí méjì; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ bí ìrọ̀rùn àti ọ̀làwọ́ mọ́.
theological_decisions:
- issue: Bóyá “bíbú àkàrà” jẹ́ Oúnjẹ Alẹ́ Olúwa ní pàtó
  choice: A fi gbólóhùn gbòòrò náà “wọ́n ń bu àkàrà” sílẹ̀ láìsọ pé ó jẹ́ Oúnjẹ Alẹ́ Olúwa ní pàtó.
  alternative: Kí a túmọ̀ ọ́ sí oúnjẹ àjọṣe lásán, tàbí kí a pè é ní Oúnjẹ Alẹ́ Olúwa ní kedere.
  rationale: Àyíká ẹsẹ̀ náà mẹ́nuba oúnjẹ, nítorí náà ó ṣeé ṣe kí ó jẹ́ àsè àjọṣe ojoojúmọ́; síbẹ̀, lílo gbólóhùn náà nínú Lúùkù–Ìṣe àwọn Àpọ́sítélì lè ní ìró ìrántí Oúnjẹ Alẹ́ Olúwa. A kò yanjú ìfọ̀rọ̀wérọ̀ yìí nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A yà ọ̀rọ̀ náà sí gbólóhùn méjì fún ìmúlò Yorùbá àdánidá, ṣùgbọ́n a pa àwọn ìṣe aláìparí àti ìbáṣepọ̀ wọn mọ́.
