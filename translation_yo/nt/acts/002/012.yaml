source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: yo
  text: Ẹnu yà gbogbo wọn, wọ́n sì dàrú[a]. Wọ́n ń sọ fún ara wọn pé, “Kí ni èyí túmọ̀ sí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì wà ní ìdàrúdàpọ̀”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìpò tí wọn kò mọ bí wọ́n ṣe lè lóye ohun tó ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Ẹnu ya gbogbo wọn
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu ńlá àti ipò tí ó ń bá a lọ hàn. ‘Ẹnu ya’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun kan ya ènìyàn lẹ́nu, láìfi ìtumọ̀ tí kò yẹ sí i.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ níhìn-ín; ‘sì’ so ìhùwàpadà méjèèjì pọ̀ lọ́nà àdánidá.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Èyí pa ìtẹnumọ́ pé gbogbo àwọn tí ọ̀rọ̀ náà kàn ló ní ìhùwàpadà yìí mọ́.
- source_word: διηπόρουν
  choice: ọ̀rọ̀ náà dà wọ́n rú
  rationale: Ó túmọ̀ sí pé ọkàn wọn dà rú, wọn kò sì mọ ohun tí wọn yóò rò nípa ohun tó ṣẹlẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìdàrúdàpọ̀ àti àìlóye.
- source_word: ἄλλος πρὸς ἄλλον
  choice: fún ara wọn
  rationale: 'Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìṣe aláràpadà náà hàn: wọ́n ń bá ara wọn sọ̀rọ̀.'
- source_word: λέγοντες
  choice: Wọ́n ń sọ
  rationale: Àpólà alábápín náà ṣàlàyé ohun tí wọ́n ń ṣe nígbà tí ẹnu yà wọ́n tí ọ̀rọ̀ náà sì dà wọ́n rú. ‘Ń sọ’ tún pa ìṣe tí ń bá a lọ mọ́.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Kí ni èyí túmọ̀ sí?
  rationale: 'Èyí mú ìtumọ̀ àṣà èdè Gíríìkì náà jáde ní Yorùbá àdánidá: wọ́n ń béèrè ìtumọ̀ tàbí pàtàkì ohun tí ó ṣẹlẹ̀, kì í ṣe pé ohun náà ní ìfẹ́-ọkàn gangan.'
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ẹnu ya’ àti ‘ọ̀rọ̀ náà dà wọ́n rú’ gẹ́gẹ́ bí àwọn ọ̀nà àdánidá láti yà ìyàlẹ́nu sọ́tọ̀ kúrò nínú ìdàrúdàpọ̀. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
