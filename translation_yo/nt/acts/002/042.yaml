id: ACT.2.42
reference: Acts 2:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: yo
  text: Wọ́n sì ń dúró ṣinṣin nínú ẹ̀kọ́ àwọn àpọ́sítélì àti nínú ìbáṣepọ̀[a], nínú bíbú àkàrà[b] àti nínú àwọn àdúrà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pínpín,” “kíkópa papọ̀,” tàbí “ìrẹ́pọ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Bíbú àkàrà” lè tọ́ka sí jíjẹun papọ̀ lápapọ̀, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ènìyàn gbà pé ó lè ní Oúnjẹ Alẹ́ Olúwa nínú níbí.
    reason: alternative_reading
  - marker: c
    text: Tàbí “àwọn àdúrà tí a ti yàn kalẹ̀”; àmì ìdánimọ̀ nínú èdè Gíríìkì lè fi hàn pé àwọn àkókò tàbí ìlànà àdúrà tí wọ́n mọ̀ ni a ń sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Wọ́n sì ń fi gbogbo ọkàn wọn tẹ̀ síwájú nínú
  rationale: Àkójọpọ̀ ọ̀rọ̀ ìṣe aláìparí ἦσαν pẹ̀lú participle προσκαρτεροῦντες ń fi ìṣe tí wọ́n ń ṣe déédéé, tí wọ́n sì dúró ṣinṣin nínú rẹ̀ hàn. Gbólóhùn Yorùbá yìí mú ìtẹnumọ́ àti ìtẹ̀síwájú náà jáde lọ́nà àdánidá.
- source_word: διδαχῇ
  choice: ẹ̀kọ́
  rationale: “Ẹ̀kọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìkọ́ni tí àwọn aposteli ń fúnni, láìsọ ọ́ di ètò ẹ̀kọ́ ìsìn tí a ti tò lẹ́sẹ̀sẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: τῶν ἀποστόλων
  choice: àwọn aposteli
  rationale: Ìsọ̀rí olówó (genitive) yìí túmọ̀ sí ẹ̀kọ́ tí àwọn aposteli ń kọ́ni. Ìlò “ẹ̀kọ́ àwọn aposteli” jẹ́ àdánidá ní Yorùbá, ó sì pa ìbáṣepọ̀ náà mọ́.
- source_word: κοινωνίᾳ
  choice: ìdàpọ̀
  rationale: “Ìdàpọ̀” lè gbé èrò ìgbésí ayé àjọṣepọ̀, pínpín, àti kíkópa papọ̀ tí κοινωνία ní, láìfi ìtumọ̀ rẹ̀ mọ́ ìpín ohun-ìní tàbí àjọyọ̀ sacramenti nìkan.
- source_word: κλάσει τοῦ ἄρτου
  choice: bíbú àkàrà
  rationale: Ìtumọ̀ yìí tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú mọ́ bóyá ó ń tọ́ka sí jíjẹun papọ̀ lápapọ̀ tàbí sí Oúnjẹ Alẹ́ Olúwa pẹ̀lú.
- source_word: προσευχαῖς
  choice: àwọn àdúrà
  rationale: Ọ̀pọ̀ nọ́ńbà pẹ̀lú article ni a fi “àwọn” hàn; èyí lè tọ́ka sí àwọn àdúrà, àkókò àdúrà, tàbí ìlànà àdúrà tí wọ́n mọ̀ dáadáa, dípò àdúrà lápapọ̀.
theological_decisions:
- issue: Bóyá κλάσει τοῦ ἄρτου yẹ kí a túmọ̀ ní pàtó sí Oúnjẹ Alẹ́ Olúwa tàbí Eucharist
  choice: A túmọ̀ ọ́ ní gbòòrò sí “bíbú àkàrà.”
  alternative: “Oúnjẹ Alẹ́ Olúwa,” “Eucharist,” tàbí jíjẹun àjọṣepọ̀ tó ní Oúnjẹ Alẹ́ Olúwa nínú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí oúnjẹ àjọṣepọ̀, ó sì ṣeé ṣe kó ní oúnjẹ ìrántí Jésù nínú; ṣùgbọ́n ẹsẹ̀ yìí kò fi ìtumọ̀ sacramenti kan ṣoṣo múlẹ̀. Ìtumọ̀ gbooro àti àlàyé ìsàlẹ̀ ojú ìwé ń yẹra fún fífi ẹ̀kọ́ ẹgbẹ́ ìsìn kan lé e lórí.
- issue: Bóyá κοινωνία yẹ kí a dín kù sí pínpín ohun-ìní tàbí communion sacramenti
  choice: A lo “ìdàpọ̀” ní ìtumọ̀ àjọṣepọ̀ tó gbòòrò.
  alternative: “pínpín,” “kíkópa papọ̀,” tàbí “communion”
  rationale: Nínú àkójọ ìṣe ìjọ àkọ́kọ́ yìí, κοινωνία ṣeé ṣe kó ní ìgbésí ayé tí wọ́n jọ ń gbé, ohun tí wọ́n jọ ń pín, àti ìkópa ẹ̀mí papọ̀. Dídín in kù sí ọ̀kan ṣoṣo yóò yanjú àìdánilójú ọ̀rọ̀ náà láìní ẹ̀rí tó pé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Àkàrà” ni a lò fún ἄρτος nínú àṣà ọ̀rọ̀ Bíbélì Yorùbá, kì í ṣe ní dandan àkàrà-ẹ̀wà ti òde òní. Àwọn àmì àlàyé [a], [b], [c] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
