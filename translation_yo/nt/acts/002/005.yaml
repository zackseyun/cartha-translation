language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: yo
  text: Àwọn Júù[a] sì ń gbé ní Jerúsálẹ́m; wọ́n jẹ́ àwọn ọkùnrin olùfọkànsìn láti gbogbo orílẹ̀-èdè lábẹ́ ọ̀run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ará Jùdíà.” Ṣùgbọ́n níhìn-ín, àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìtumọ̀ ẹ̀yà àti ẹ̀sìn tó gbòòrò, nítorí a sọ pé wọ́n wá láti gbogbo orílẹ̀-èdè lábẹ́ ọ̀run.
    reason: alternative_reading
  - marker: b
    text: “Lábẹ́ ọ̀run” jẹ́ àsọyé Bíbélì tó túmọ̀ sí gbogbo agbègbè ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: kan sì ń gbé
  rationale: A lo “kan” láti fi ìtumọ̀ gbólóhùn ìwàláàyè hàn, “sì” sì ń gbé ìtàn náà tẹ̀ síwájú láìfi ìtakora líle kún un.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: ń gbé ní Jerúsálẹ́m
  rationale: “Ń gbé” fi ìgbé ayé tí ó ń bá a lọ hàn, kò sì túmọ̀ sí pé wọ́n kàn ń dúró níbẹ̀ fún ìgbà díẹ̀.
- source_word: Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Àyíká ọ̀rọ̀ tó sọ pé wọ́n wá láti gbogbo orílẹ̀-èdè ṣe àtìlẹ́yìn fún ìtumọ̀ ẹ̀yà àti ẹ̀sìn tó gbòòrò ju “àwọn ará Jùdíà” lọ.
- source_word: ἄνδρες
  choice: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ọkùnrin ní pàtó, nítorí náà a kò sọ ọ́ di ọ̀rọ̀ àpapọ̀ bí “àwọn ènìyàn.”
- source_word: εὐλαβεῖς
  choice: olùfọkànsìn
  rationale: Ó sọ nípa àwọn ẹni tí wọ́n ní ìbẹ̀rù Ọlọ́run tí wọ́n sì fi tọkàntọkàn ṣe ohun ẹ̀sìn; ọ̀rọ̀ yìí bójú mu, ó sì ṣeé yé ní Yorùbá òde òní.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: láti gbogbo orílẹ̀-èdè
  rationale: Ó tọ́ka sí onírúurú orílẹ̀-èdè ayé ní ti ilẹ̀ àti ẹ̀yà.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: lábẹ́ ọ̀run
  rationale: A pa àwòrán àsọyé Bíbélì náà mọ́; nínú àyíká yìí ó túmọ̀ sí gbogbo agbègbè ayé.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖοι
  choice: Àwọn Júù
  alternative: Àwọn ará Jùdíà
  rationale: Nítorí a sọ pé àwọn ẹni náà wá láti gbogbo orílẹ̀-èdè, ìtumọ̀ ẹ̀yà àti ẹ̀sìn ni ó bá àyíká mu jù, kì í ṣe ìtumọ̀ àwọn olùgbé agbègbè Jùdíà nìkan.
- issue: Bí a ṣe túmọ̀ akọ-ǹṣe ἄνδρες
  choice: àwọn ọkùnrin
  alternative: àwọn ènìyàn
  rationale: Orúkọ Gíríìkì náà jẹ́ akọ ní pàtó; títúmọ̀ rẹ̀ sí “àwọn ọkùnrin” pa ìyàtọ̀ inú orísun mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A pín àfikún appositive Gíríìkì sí gbólóhùn méjì tí semicolon so pọ̀, kí ìtumọ̀ rẹ̀ lè mọ́ ní Yorùbá láìsọ ìbáṣepọ̀ àwọn ọ̀rọ̀ náà nù.
