  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: yo
  text: Wọ́n ń yin Ọlọ́run, wọ́n sì ń rí ojúrere lọ́dọ̀ gbogbo ènìyàn. Olúwa sì ń fi àwọn tí a ń gbà là darapọ̀ mọ́ wọn lójoojúmọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “papọ̀” tàbí “ní ibi kan náà” (Gíríìkì: ἐπὶ τὸ αὐτό).'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες
  choice: wọ́n ń yin
  rationale: Ọ̀rọ̀-ìṣe alábápín ní àsìkò ìsinsìnyí fi iṣẹ́ tí ó ń bá a lọ hàn; ‘wọ́n ń yin’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yẹn mọ́.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ó jẹ́ ohun tí ìṣe αἰνοῦντες dojú kọ; ‘Ọlọ́run’ ni ìtumọ̀ Yorùbá tí ó bójú mu.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: gbogbo àwọn ènìyàn sì ń ṣe ojúrere sí wọn
  rationale: Àṣà ọ̀rọ̀ Gíríìkì túmọ̀ sí pé wọ́n ń rí ojúrere tàbí inú rere gbà lọ́dọ̀ gbogbo ènìyàn, kì í ṣe pé àwọn onígbàgbọ́ ló ń ṣe ojúrere sí wọn. Ìṣètò Yorùbá yìí sọ ìbáṣepọ̀ náà ní kedere àti lọ́nà àdánidá.
- source_word: ὁ δὲ κύριος
  choice: Olúwa sì
  rationale: ‘Olúwa’ ni ìtumọ̀ κύριος; ‘sì’ so gbólóhùn náà pọ̀ mọ́ ìtàn tó ṣáájú lọ́nà Yorùbá.
- source_word: προσετίθει
  choice: ń fi ... kún
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ó ń tẹ̀ síwájú tàbí tí a ń ṣe léraléra hàn; àmì ‘ń’ pa ìrísí yẹn mọ́.
- source_word: τοὺς σῳζομένους
  choice: àwọn tí a ń gbà là
  rationale: Alábápín ìsinsìnyí ní ohùn àgbà ṣe àfihàn àwọn tí ìgbàlà ń ṣẹlẹ̀ sí; gbolohun yìí pa ìṣe tó ń lọ àti ohùn àgbà mọ́ láì sọ ẹni tó ń ṣe e ní pàtó.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ìtumọ̀ Yorùbá àdánidá fún ìṣe tí ó ń ṣẹlẹ̀ ní ọjọ́ kọ̀ọ̀kan.
- source_word: ἐπὶ τὸ αὐτό
  choice: kún wọn
  rationale: Nínú àyíká προσετίθει, ó ṣeé lóye gẹ́gẹ́ bí fífi àwọn ènìyàn kún àwùjọ tó wà. ‘Kún wọn’ sún mọ́ ọ̀rọ̀ Gíríìkì ju ṣíṣàlàyé rẹ̀ sí ‘kún iye wọn’ lọ, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
theological_decisions:
- issue: Ìrísí àti ìtumọ̀ ìgbàlà nínú τοὺς σῳζομένους
  choice: àwọn tí a ń gbà là
  alternative: àwọn tí a ti gbà là
  rationale: Ìrísí ìsinsìnyí àti ohùn àgbà Gíríìkì ṣe àfihàn ìgbàlà bí ohun tí ń ṣẹlẹ̀ sí wọn. A kò yí i padà sí ipò tí ó ti parí, bẹ́ẹ̀ ni a kò fi ọ̀rọ̀ kún un láti yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́.
- issue: Ìtọ́kasí ἐπὶ τὸ αὐτό
  choice: kún wọn
  alternative: papọ̀ tàbí ní ibi kan náà
  rationale: Pẹ̀lú προσετίθει, ìtumọ̀ tó ṣeé ṣe jù ni pé Olúwa ń fi wọ́n kún àwùjọ náà. Síbẹ̀, nítorí gbolohun Gíríìkì lè túmọ̀ sí ‘papọ̀’ tàbí ‘ní ibi kan náà,’ a fi ìṣiyèméjì gidi náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A yan ‘gbogbo àwọn ènìyàn sì ń ṣe ojúrere sí wọn’ láti mú ìtumọ̀ idiomu Gíríìkì jáde ní Yorùbá àdánidá.
