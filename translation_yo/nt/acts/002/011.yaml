  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà dá àwọn ẹgbẹ́ ènìyàn, ìgbọ́ wọn, àti ‘àwọn iṣẹ́ agbára Ọlọ́run’ mọ́ ní gbogbogbòò. Ṣùgbọ́n ìṣètò náà ‘wọ́n ń sọ àwọn iṣẹ́ agbára Ọlọ́run’ kò dá ìbáṣepọ̀ λαλοῦντες ... τὰ μεγαλεῖα τοῦ θεοῦ hàn dáadáa ní Yorùbá: a máa ń ‘sọ̀rọ̀ nípa’ àwọn iṣẹ́ bẹ́ẹ̀. ‘Pẹ̀lú’ tún mú ìṣọ̀kan τε καί (‘both ... and’) hàn kedere ju ‘àti’ lásán lọ.'
  naturalness: ‘Àwa ń gbọ́ wọ́n tí wọ́n ń sọ àwọn iṣẹ́...’ wúwo, ó sì lè dà bí ẹni pé wọ́n ‘ń sọ àwọn iṣẹ́’ dípò pé wọ́n ń sọ̀rọ̀ nípa wọn. ‘Àwa ń gbọ́ bí wọ́n ṣe ń sọ̀rọ̀ nípa...’ jẹ́ Yorùbá boṣewa, ó sì jẹ́ kedere. Àmì àlàyé yẹ kí ó wà lẹ́yìn ‘èdè’ tí ó ń túmọ̀.
  terminology: Àwọn Júù, àwọn tí wọ́n ti yí padà sí ẹ̀sìn Júù, àwọn ará Kírétè, àti àwọn ará Árábù yẹ. ‘Àwọn iṣẹ́ agbára Ọlọ́run’ jẹ́ ìtumọ̀ tó yẹ fún τὰ μεγαλεῖα τοῦ θεοῦ. ‘Èdè’ bójú mu fún γλώσσαις nínú àyíká yìí; àlàyé náà ń pa àṣàyàn ‘ahọ́n’ mọ́ láì fi ìtumọ̀ ẹ̀kọ́ kan lórí ẹsẹ náà.
  issues:
