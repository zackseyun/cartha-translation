    rationale: Gíríìkì náà túmọ̀ sí pé àwọn olùgbọ́ ń gbọ́ wọn wọ́n ń sọ̀rọ̀ nípa/tí ń kéde àwọn iṣẹ́ ńlá Ọlọ́run. Ní Yorùbá, ‘sọ àwọn iṣẹ́’ lè dà bí ìfọ̀rọ̀wérọ̀ tí kò pé; ‘sọ̀rọ̀ nípa’ ló dá ìtumọ̀ náà hàn ní ti ẹ̀dá.
  - severity: low
    issue: Àmì àlàyé [a] wà ní òpin ẹsẹ dípò lẹ́gbẹ̀ẹ́ ‘èdè.’
    rationale: Àlàyé náà kan γλώσσαις/‘èdè’ nìkan, nítorí náà ó yẹ kí àmì rẹ̀ tẹ̀ lé ọ̀rọ̀ náà láti jẹ́ kedere.
