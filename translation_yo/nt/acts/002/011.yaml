language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: yo
  text: àwọn Júù pẹ̀lú àwọn tí wọ́n ti yí padà sí ẹ̀sìn Júù, àwọn ará Kírétè àti àwọn ará Árábù—àwa ń gbọ́ bí wọ́n ṣe ń sọ̀rọ̀ nípa àwọn iṣẹ́ agbára Ọlọ́run ní àwọn èdè tiwa fúnra wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ahọ́n tiwa fúnra wa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; níbí, àyíká ọ̀rọ̀ náà tọ́ka sí àwọn èdè ènìyàn tí a lè dá mọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: àwọn Júù
  rationale: Ó tọ́ka sí àwọn ènìyàn Júù gẹ́gẹ́ bí ẹgbẹ́ ẹ̀yà àti ẹ̀sìn nínú àkójọ àwọn tó wá láti ibi púpọ̀, kì í ṣe àwọn olùgbé Jùdíà nìkan.
- source_word: τε καὶ
  choice: àti
  rationale: Ọ̀rọ̀ àsopọ̀ ‘àti’ ló bá èdè Yorùbá mu jù, ó sì pa ìsopọ̀ àwọn Júù mọ́ pọ̀ mọ́ àwọn tí wọ́n gba ẹ̀sìn Júù.
- source_word: προσήλυτοι
  choice: àwọn tí wọ́n yí padà sí ẹ̀sìn Júù
  rationale: Gbólóhùn yìí ṣàlàyé ní kedere fún òǹkàwé òde òní pé àwọn tí kì í ṣe Júù tẹ́lẹ̀, ṣùgbọ́n tí wọ́n gba ẹ̀sìn Júù, ni ọ̀rọ̀ náà túmọ̀ sí.
- source_word: Κρῆτες
  choice: àwọn ará Kírétè
  rationale: Ìtumọ̀ àdánidá fún àwọn olùgbé erékùṣù Kírétè.
- source_word: Ἄραβες
  choice: àwọn ará Árábù
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere láti pe àwọn Arab.
- source_word: ἀκούομεν
  choice: àwa ń gbọ́
  rationale: Ó fi ìṣe tí ń ṣẹlẹ̀ ní àkókò náà hàn, ó sì pa ìtẹnumọ́ ẹni àkọ́kọ́ púpọ̀ mọ́.
- source_word: λαλούντων αὐτῶν
  choice: wọn tí wọ́n ń sọ
  rationale: Ó ṣàfihàn pé àwọn ènìyàn náà ló ń sọ̀rọ̀, láì fi ìtumọ̀ míì tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: ní àwọn èdè tiwa fúnra wa
  rationale: Nínú àyíká Pẹ́ńtíkọ́sì yìí, γλῶσσαι tọ́ka sí àwọn èdè ènìyàn tí àwọn olùgbọ́ mọ̀; ‘tiwa fúnra wa’ sì pa ìtẹnumọ́ ἡμετέραις mọ́.
- source_word: τὰ μεγαλεῖα
  choice: àwọn iṣẹ́ agbára
  rationale: Ó sọ àwọn iṣẹ́ ńlá tí agbára hàn, láì mú kí ọ̀rọ̀ náà túmọ̀ sí iṣẹ́ ìyanu nìkan.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀kan ọ̀rọ̀ náà fi hàn pé àwọn iṣẹ́ agbára yìí jẹ́ ti Ọlọ́run tàbí pé Ọlọ́run ló ṣe wọ́n.
theological_decisions:
- issue: Ìtumọ̀ γλώσσαις nínú àyíká Pẹ́ńtíkọ́sì
  choice: àwọn èdè ènìyàn tí a lè dá mọ̀
  alternative: ọ̀rọ̀ àrà tí kì í ṣe èdè ènìyàn tí a lè dá mọ̀
  rationale: Àyíká tó sún mọ́ ẹsẹ yìí tẹnumọ́ pé ọ̀pọ̀ ènìyàn láti orílẹ̀-èdè ọ̀tọ̀ọ̀tọ̀ ń gbọ́ ọ̀rọ̀ ní èdè ìbílẹ̀ wọn. ‘Àwọn èdè’ tẹ̀ lé ìtumọ̀ àkọ́kọ́ ti ìtàn náà láì fi àríyànjiyàn ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àlàyé ‘àwọn tí wọ́n yí padà sí ẹ̀sìn Júù’ dípò ọ̀rọ̀ àjèjì kan fún ‘proselytes,’ a sì fi àmì àlàyé ẹsẹ sí ibi tí γλώσσαις wà, nítorí pé àlàyé náà jẹ́ ti ‘èdè/ahọ́n.’
