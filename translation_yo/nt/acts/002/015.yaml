source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: yo
  text: Nítorí àwọn wọ̀nyí kò mutí yó, bí ẹ̀yin ṣe rò, nítorí wákàtí kẹta ọjọ́ ni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ní nǹkan bí aago mẹ́sàn-án òwúrọ̀ gẹ́gẹ́ bí ìṣírò àkókò àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: “Nítorí” mú ipa àlàyé γάρ jáde, “kò” sì tako ẹ̀sùn náà ní tààrà.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: bí ẹ̀yin ṣe rò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún “bí ẹ̀yin ṣe lérò,” ó sì pa ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς mọ́ nípasẹ̀ “ẹ̀yin.”
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ó túmọ̀ afihan ọ̀pọ̀ náà ní tààrà láìfi “ọkùnrin” tàbí “ènìyàn” kún ohun tí Gíríìkì kò sọ gbangba.
- source_word: μεθύουσιν
  choice: mutí yó
  rationale: Ọ̀rọ̀ yìí sọ ipò ọ̀mùtí tí wọ́n fi ń fẹ̀sùn kàn wọ́n ní Yorùbá àdánidá.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: nítorí pé wákàtí kẹta ọjọ́ ni èyí
  rationale: Ó pa ìdí tí Peteru fi kọ ẹ̀sùn náà àti ọ̀nà ìṣírò àkókò Júù mọ́ nínú ẹsẹ̀ náà.
- source_word: ὥρα τρίτη
  choice: wákàtí kẹta
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ orísun; àlàyé àkókò òde òní wà nínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àtúnsọ “nítorí” mọ́ láti fi ìṣàn àríyànjiyàn γάρ méjèèjì hàn; àmì àlàyé [a] wà lẹ́yìn gbólóhùn àkókò tí ó ń ṣàlàyé.
