source:
  edition: SBLGNT
  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: yo
  text: Àwọn ahọ́n bí iná, tí a pín ká, fara hàn sí wọn, ó sì bà lé orí ẹnì kọ̀ọ̀kan wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “àwọn ahọ́n bí ẹni pé iná ni tí a pín ká,” tàbí, “àwọn ahọ́n, bí ẹni pé iná ni.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ìfarahàn tí ojú lè rí àti bí a ṣe pín wọn ká sí orí olúkúlùkù wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: fara hàn
  rationale: Ó sọ pé ohun náà di ohun tí wọ́n lè rí, láìfi ọ̀rọ̀ náà hàn bí ẹni pé ẹnì kan ló mú un wá sí ojú wọn.
- source_word: αὐτοῖς
  choice: sí wọn
  rationale: Èyí túmọ̀ dative àwọn ẹni tí ìfarahàn náà ṣẹlẹ̀ sí.
- source_word: διαμεριζόμεναι
  choice: tí wọ́n ń pín ká
  rationale: Ó pa agbára participle mọ́, ó sì fi hàn pé àwọn ahọ́n náà ń pínyà tàbí ń pín sí orí àwọn ẹni náà, láìdá ọ̀nà ìpín náà lójú ju ohun tí Gíríìkì sọ lọ.
- source_word: γλῶσσαι
  choice: àwọn ahọ́n
  rationale: “Ahọ́n” pa àwòrán ohun tí ó dà bí ahọ́n mọ́, ó sì tún ní ìbáṣepọ̀ pẹ̀lú ọ̀rọ̀ sísọ ní àwọn ẹsẹ tó tẹ̀ lé; “ọ̀wọ́ iná” tàbí “èdè” yóò dín ìtumọ̀ méjèèjì kù.
- source_word: ὡσεὶ πυρός
  choice: bí iná
  rationale: “Bí” fi ìfiwé hàn, kì í sì í sọ pé iná gidi ni ohun náà.
- source_word: ἐκάθισεν
  choice: ó sì bà lé
  rationale: Ọ̀rọ̀-ìṣe ẹyọ Gíríìkì ni a pa mọ́ pẹ̀lú “ó”; “bà lé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìfarahàn kan wá dúró lórí ẹnì kan.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: ẹnì kọ̀ọ̀kan wọn
  rationale: Ó tẹnumọ́ pé ìfarahàn náà dé orí olúkúlùkù ẹni tó wà níbẹ̀.
theological_decisions:
- issue: Irú ìfarahàn tó ṣẹlẹ̀ ní Pẹ́ńtíkọ́sì
  choice: “Àwọn ahọ́n bí iná”
  alternative: “Ọ̀wọ́ iná” tàbí “àwọn èdè iná”
  rationale: Gíríìkì lo ọ̀rọ̀ ìfiwé ὡσεὶ àti γλῶσσαι; ìtumọ̀ yìí kò sọ pé iná gidi ni, bẹ́ẹ̀ ni kò sì sọ ọ́ di èdè tí a ń sọ nìkan.
- issue: Ọ̀rọ̀-ìṣe ẹyọ lẹ́yìn “àwọn ahọ́n”
  choice: Pa ẹyọ ἐκάθισεν mọ́ gẹ́gẹ́ bí “ó sì bà lé”
  alternative: Lo ọ̀pọ̀ bí “wọ́n sì bà lé”
  rationale: Ẹyọ inú Gíríìkì lè tọ́ka sí ìfarahàn náà gẹ́gẹ́ bí odindi kan lẹ́yìn tí ó pín ká. A kò yí ìṣòro gírámà yìí padà sí ọ̀pọ̀ láìní dandan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. “Fara hàn,” “pín ká,” àti “bà lé” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye; a fi àmì ohùn sí ibi tí ó bá yẹ.
