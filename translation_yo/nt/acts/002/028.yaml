  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: yo
  text: Ìwọ ti fi àwọn ọ̀nà ìyè hàn mí[a]; ìwọ yóò fi ayọ̀ kún mi níwájú rẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọ̀nà tí ń yọrí sí ìyè.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “pẹ̀lú ojú rẹ”; ìyẹn ni, “níwájú rẹ” tàbí “níbi tí o wà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: O sọ … di mímọ̀ fún mi
  rationale: 'Ọ̀rọ̀ yìí mú ìtumọ̀ ìṣe-aṣeyọrí aorist náà jáde, ó sì pa ìtumọ̀ causative γνωρίζω mọ́: ẹni náà mú kí n mọ̀, tàbí ó sọ ohun náà di mímọ̀ fún mi. “Fún mi” fi iṣẹ́ dative μοι hàn ní Yorùbá àdánidá.'
- source_word: ὁδοὺς ζωῆς
  choice: àwọn ọ̀nà ìyè
  rationale: “Àwọn ọ̀nà” pa plural ὁδούς mọ́, “ìyè” sì jẹ́ ìtumọ̀ ζωῆς. Gbólóhùn náà lè tọ́ka sí àwọn ọ̀nà tí ìyè ń ṣe àfihàn tàbí tí ń yọrí sí ìyè; a kò fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: πληρώσεις με
  choice: ìwọ yóò fi … kún mi
  rationale: “Yóò” fi future indicative hàn, ìṣètò “fi X kún mi” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ohun kan kún ènìyàn.
- source_word: εὐφροσύνης
  choice: ayọ̀
  rationale: “Ayọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bo ìtumọ̀ inú-dídùn àti ìdùnnú tí εὐφροσύνη ní.
- source_word: μετὰ τοῦ προσώπου σου
  choice: níwájú rẹ
  rationale: Ní ti gidi, gbólóhùn náà sọ “pẹ̀lú ojú rẹ,” ṣùgbọ́n ó jẹ́ àpólà tí ń tọ́ka sí wíwà ẹni náà níbẹ̀. “Níwájú rẹ” jẹ́ Yorùbá àdánidá, ó sì pa ìmọ̀lára ìbáṣepọ̀ ojú-ko-ojú mọ́.
theological_decisions:
- issue: Àpólà nípa wíwà Ọlọ́run níbẹ̀ nínú àyọlò Sáàmù tí Peteru lò
  choice: níwájú rẹ
  alternative: pẹ̀lú ojú rẹ
  rationale: Àṣàyàn náà sọ ìtumọ̀ wíwà Ọlọ́run níbẹ̀ ní Yorùbá tó mọ́gbọ́n dání, láì fi ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà. Àlàyé ìsàlẹ̀ ojú-ìwé pa ìtumọ̀ gidi “ojú” mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé òde òní, ó sì bójú tó ìṣọ̀kan àti ìrísí ewì inú àyọlò náà.
