id: ACT.2.9
reference: Acts 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: yo
  text: Àwọn ará Pátíà, àwọn ará Mídíà, àti àwọn ará Élámù, àti àwọn tí ń gbé ní Mesopotámíà, Jùdíà àti Kapadókíà[a], Pọ́ńtù àti Éṣíà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì τε καί lè túmọ̀ sí “àti” lásán, tàbí kí ó ní ìmọ̀lára àfikún díẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni agbègbè ìjọba Róòmù tí a ń pè ní Éṣíà, ní apá ìwọ̀-oòrùn Éṣíà Kékeré; kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: àwọn ará Pátíà
  rationale: Orúkọ yìí ń tọ́ka sí àwọn ènìyàn ilẹ̀ Pátíà; lílo “àwọn ará” mú kí orúkọ ẹgbẹ́ ènìyàn náà ṣe kedere ní Yorùbá.
- source_word: Μῆδοι
  choice: àwọn ará Mídíà
  rationale: Ó pa orúkọ àwọn ènìyàn ilẹ̀ Mídíà mọ́, ó sì tẹ̀ lé ìlànà Yorùbá fún sísọ ọmọ ìlú tàbí ará ilẹ̀ kan.
- source_word: Ἐλαμῖται
  choice: àwọn ará Élámù
  rationale: Ó tú ethnonym náà sí Yorùbá gẹ́gẹ́ bí àwọn ènìyàn tí wọ́n ti Élámù wá.
- source_word: οἱ κατοικοῦντες
  choice: àwọn tí ń gbé ní
  rationale: Àpólà participle yìí ń tọ́ka sí àwọn olùgbé; “àwọn tí ń gbé ní” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ìtumọ̀ rẹ̀ mọ́.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotámíà
  rationale: Àkọsílẹ̀ orúkọ ilẹ̀ náà ni, pẹ̀lú àmì ohùn tó bá ìpè Yorùbá mu.
- source_word: Ἰουδαίαν
  choice: Jùdíà
  rationale: Ó pa ìtumọ̀ rẹ̀ mọ́ gẹ́gẹ́ bí orúkọ agbègbè, láì fi ìtumọ̀ ẹ̀yà tàbí ẹ̀sìn kún un.
- source_word: τε καὶ
  choice: àti ... pẹ̀lú
  rationale: Àkójọpọ̀ yìí ní ìtumọ̀ àsopọ̀ pẹ̀lú ìmọ̀lára àfikún díẹ̀; “àti ... pẹ̀lú” jẹ́ àdánidá ní Yorùbá láì fi agbára tó pọ̀ ju ti Gíríìkì lọ sí i.
- source_word: Καππαδοκίαν
  choice: Kapadókíà
  rationale: Àkọsílẹ̀ Yorùbá fún orúkọ agbègbè náà.
- source_word: Πόντον
  choice: Pọ́ńtù
  rationale: Àkọsílẹ̀ Yorùbá fún orúkọ agbègbè náà.
- source_word: τὴν Ἀσίαν
  choice: Éṣíà
  rationale: A pa orúkọ ilẹ̀ inú ẹsẹ náà mọ́; àlàyé ìsàlẹ̀ ojú ìwé sọ pé agbègbè ìjọba Róòmù ni, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì Éṣíà òde òní.
theological_decisions: []
translation_notes:
  register: 'Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè àdánidá ni a lò. A tún “ní” ṣe níwájú àwọn agbègbè kan láti jẹ́ kí àkójọ gígùn náà ṣe kedere. Àwọn àmì ohùn ni a fi sí orúkọ ibi níbi tí ìpè Yorùbá ti dájú. A ṣe àtúnṣe ìbámu àwọn àmì àlàyé: àlàyé τε καί wà lẹ́yìn Jùdíà àti Kapadókíà, àlàyé Éṣíà sì wà lẹ́yìn Éṣíà.'
