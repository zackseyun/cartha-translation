  text: πάντες δὲ οἱ ⸀πιστεύοντες ⸂ἦσαν ἐπὶ τὸ αὐτὸ καὶ⸃ εἶχον ἅπαντα κοινά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: yo
  text: Gbogbo àwọn onígbàgbọ́ sì wà papọ̀,[a] ohun gbogbo tí wọ́n ní sì jẹ́ ti gbogbo wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n wà ní ibi kan náà.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí pé wọ́n wà papọ̀ tàbí pé wọ́n kóra jọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Gbogbo
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì ń ṣàpèjúwe gbogbo ẹgbẹ́ àwọn onígbàgbọ́.
- source_word: δὲ
  choice: sì
  rationale: “Sì” bá ìtẹ̀síwájú ìtàn mu láì fi ìtakora líle kún ọ̀rọ̀ náà.
- source_word: οἱ πιστεύοντες
  choice: àwọn onígbàgbọ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹgbẹ́ àwọn tí wọ́n gbàgbọ́, ó sì bá participle tí a lò gẹ́gẹ́ bí orúkọ mu.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: wà papọ̀
  rationale: Ó mú ìtumọ̀ pé wọ́n kóra jọ tàbí pé wọ́n wà ní ibi kan náà jáde, láì fi ibi pàtó kan kún un.
- source_word: εἶχον
  choice: ní
  rationale: Ó tú imperfect náà sí ọ̀nà àdánidá ní Yorùbá; àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ ipò tí ó ń bá a lọ.
- source_word: ἅπαντα κοινά
  choice: ohun gbogbo ní àjọṣepọ̀
  rationale: Ó pa èrò pé ohun ìní wọn jẹ́ ohun tí wọ́n ń pín tàbí lò papọ̀ mọ́, láì sọ ọ́ di àṣẹ nípa ètò ọrọ̀ ajé.
theological_decisions:
- issue: Irú ìgbésí ayé àjọṣepọ̀ tí àwọn onígbàgbọ́ ní
  choice: A tú ẹsẹ̀ náà gẹ́gẹ́ bí àpèjúwe pé àwọn onígbàgbọ́ ní àwọn ohun ìní wọn ní àjọṣepọ̀.
  alternative: Kí a tú u bí àṣẹ pé gbogbo ìjọ Kristẹni gbọ́dọ̀ tẹ̀ lé ètò ọrọ̀ ajé kan náà.
  rationale: Gíríìkì ń ròyìn ohun tí wọ́n ń ṣe; kò fi í hàn gẹ́gẹ́ bí àṣẹ tàbí òfin fún gbogbo ìjọ. Ìtumọ̀ náà kò yanjú ìbéèrè ẹ̀kọ́ ìgbàgbọ́ kọjá ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé gbogbogbò.
