  terminology: “Peteru,” “Jùdíà,” àti “Jerúsálẹ́mù” bá ìlò Yorùbá tí ó wọ́pọ̀ mu. “Ó gbé ohùn rẹ̀ sókè,” “ó sì kéde fún wọn,” àti “kí ẹ sì fetí sí àwọn ọ̀rọ̀ mi” jẹ́ yíyan ọ̀rọ̀ tó bójú mu; wọn kò kó ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn wọ inú ẹsẹ náà.
  issues:
