  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì dáadáa: ìtakora δέ, ìdúró Peteru pẹ̀lú àwọn mọ́kànlá, gbígbé ohùn sókè, àti ìpè sí àwọn ọkùnrin Jùdíà àti olùgbé Jerúsálẹ́mù. Ṣùgbọ́n “dìde dúró” tún ìtumọ̀ kan náà ṣe lẹ́ẹ̀mejì, ó sì kún ìṣe orísun náà ju bó ṣe yẹ lọ.'
