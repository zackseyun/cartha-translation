id: ACT.2.14
reference: Acts 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: yo
  text: Ṣùgbọ́n Peteru dúró pẹ̀lú àwọn mọ́kànlá náà, ó gbé ohùn rẹ̀ sókè[a], ó sì kéde fún wọn pé, “Ẹ̀yin ọkùnrin ará Jùdíà àti gbogbo ẹ̀yin tí ń gbé ní Jerúsálẹ́mù, ẹ jẹ́ kí èyí di mímọ̀ fún yín, kí ẹ sì fetí sí àwọn ọ̀rọ̀ mi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sọ̀rọ̀ ní ohùn rara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹ sì tẹ́tí sí àwọn ọ̀rọ̀ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: dìde dúró
  rationale: Àkópọ̀ ọ̀rọ̀ yìí fi hàn pé Peteru gbé ara rẹ̀ kalẹ̀ dúró láti bá àwùjọ náà sọ̀rọ̀; ó jẹ́ èdè Yorùbá àdánidá fún aorist participle náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora sí ẹ̀sùn àwọn ẹlẹ́gàn nínú ẹsẹ tó ṣáájú hàn.
- source_word: σὺν τοῖς ἕνδεκα
  choice: pẹ̀lú àwọn mọ́kànlá náà
  rationale: Ó túmọ̀ accompaniment σύν pẹ̀lú dative ní tààràtà, ó sì tọ́ka sí àwọn aposteli mọ́kànlá yòókù.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: ó gbé ohùn rẹ̀ sókè
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì yé ẹni pé Peteru sọ̀rọ̀ ní ohùn rara sí àwùjọ.
- source_word: ἀπεφθέγξατο
  choice: ó sì kéde fún wọn
  rationale: ‘Kéde’ bá ọ̀rọ̀ gbangba tí a sọ pẹ̀lú ìgboyà àti ìwọ̀n mu, láìfi dandan sọ pé ó jẹ́ àsọtẹ́lẹ̀ tàbí ọ̀rọ̀ tí Ẹ̀mí mí sí.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Ẹ̀yin ọkùnrin ará Jùdíà
  rationale: Ó pa ìbálòpọ̀ akọ tí ἄνδρες sọ ní pàtó mọ́, ó sì fi ìdánimọ̀ àwọn tí a ń bá sọ̀rọ̀ hàn.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: gbogbo ẹ̀yin tí ń gbé ní Jerúsálẹ́mù
  rationale: Ó fi πάντες àti ìṣe tí ń bá a lọ nínú κατοικοῦντες hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ẹ jẹ́ kí èyí di mímọ̀ fún yín
  rationale: Ó pa ìrísí àṣẹ oníwọ̀ntúnwọ̀nsì àti agbára ìkéde gbolohun Gíríìkì mọ́.
- source_word: ἐνωτίσασθε
  choice: kí ẹ sì fetí sí
  rationale: ‘Fetí sí’ túmọ̀ sí fífetí gbọ́ pẹ̀lú àfiyèsí, gẹ́gẹ́ bí aorist middle imperative náà ṣe béèrè.
- source_word: τὰ ῥήματά μου
  choice: àwọn ọ̀rọ̀ mi
  rationale: Èyí jẹ́ ìtumọ̀ tààràtà tí kò fa ìtumọ̀ náà gbòòrò sí ‘iṣẹ́’ tàbí ‘ìhìn iṣẹ́.’
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Ἄνδρες pẹ̀lú ìbálòpọ̀ akọ rẹ̀
  choice: Ẹ̀yin ọkùnrin ará Jùdíà
  alternative: Ẹ̀yin ará Jùdíà; Ẹ̀yin Júù ẹlẹgbẹ́ mi
  rationale: Ọ̀rọ̀ Gíríìkì ἄνδρες jẹ́ akọ ní pàtó. Ìtumọ̀ náà pa èyí mọ́ láìsọ ọ́ di ọ̀rọ̀ tí kò ní ìbálòpọ̀.
- issue: Bóyá ἀπεφθέγξατο gbọ́dọ̀ sọ ìmísí tàbí àsọtẹ́lẹ̀ ní tààràtà
  choice: ó sì kéde fún wọn
  alternative: ó bá wọn sọ̀rọ̀; ó sọ ọ̀rọ̀ tí Ẹ̀mí mí sí wọn
  rationale: ‘Kéde’ fi ìjẹ́pàtàkì àti ìgboyà ọ̀rọ̀ gbangba hàn, ṣùgbọ́n kò fi ẹ̀kọ́ nípa ìmísí kún ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó ní iyì, tó sì yẹ fún ọ̀rọ̀ gbangba. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa àṣẹ, ìtakora, àti ìpè akọ inú orísun Gíríìkì mọ́.
