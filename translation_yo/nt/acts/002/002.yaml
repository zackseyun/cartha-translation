source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: yo
  text: Lójijì, ìró kan wá láti ọ̀run, gẹ́gẹ́ bí ìró ẹ̀fúùfù alágbára tí ń fẹ́[a]; ó sì kún gbogbo ilé tí wọ́n jókòó sínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìró bí ti ẹ̀fúùfù alágbára tí a ń gbé lọ.” Èdè Gíríìkì fi ìró náà wé afẹ́fẹ́ líle tí ń lọ; kò sọ ní pàtó pé ẹ̀fúùfù gidi wà níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ìró kan wá
  rationale: Ọ̀rọ̀ yìí sọ pé ìṣẹ̀lẹ̀ kan ṣẹlẹ̀ tàbí pé ohun kan dé. ‘Ìró kan wá’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti fi ìṣẹ̀lẹ̀ náà hàn nínú àkọsílẹ̀ yìí.
- source_word: ἄφνω
  choice: Lójijì
  rationale: Ó fi hàn pé ohun náà ṣẹlẹ̀ láìròtẹ́lẹ̀, ní kíákíá.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: ‘Ọ̀run’ dá ìtumọ̀ ibi ọ̀run gẹ́gẹ́ bí orísun ohun náà mọ́, dípò kí a dín un kù sí ojú ọ̀run lásán.
- source_word: ἦχος
  choice: ìró
  rationale: ‘Ìró’ jẹ́ ọ̀rọ̀ àpapọ̀ fún ohun tí etí ń gbọ́, láìfi ìtumọ̀ búburú tàbí irú ìró pàtó kún un.
- source_word: ὥσπερ
  choice: bí ti
  rationale: 'Ó pa ìfiwéra inú Gíríìkì mọ́: ìró náà dà bí ti ẹ̀fúùfù, ṣùgbọ́n ẹsẹ náà kò sọ ní tààrà pé ẹ̀fúùfù gidi ni.'
- source_word: φερομένης
  choice: tí ń fẹ́ kánkán
  rationale: Participle náà ń ṣàpèjúwe afẹ́fẹ́ tí ń lọ tàbí tí a ń gbé lọ. Nínú Yorùbá, ‘tí ń fẹ́ kánkán’ fi ìṣípòpadà àti agbára rẹ̀ hàn lọ́nà àdánidá.
- source_word: πνοῆς
  choice: ẹ̀fúùfù
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí afẹ́fẹ́ tí ń fẹ́ ju èémí ènìyàn lọ.
- source_word: βιαίας
  choice: líle
  rationale: ‘Líle’ sọ agbára àti ìkanra afẹ́fẹ́ náà ní Yorùbá tó ṣe déédé, láìmú kí ó dà bí ìwà ipá ènìyàn.
- source_word: ἐπλήρωσεν
  choice: ìró náà sì kún
  rationale: A tún ‘ìró náà’ sọ ní kedere nítorí pé èyí ló jẹ́ olùṣe nínú Gíríìkì, ó sì mú gbolohun Yorùbá yé kedere.
- source_word: ὅλον τὸν οἶκον
  choice: gbogbo ilé
  rationale: Ó pa ìtumọ̀ pé kò sí apá ilé náà tí ìró náà kò dé mọ́.
- source_word: οὗ ἦσαν καθήμενοι
  choice: tí wọ́n jókòó sí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí wọ́n wà ní ipò jíjókòó nígbà náà.
theological_decisions:
- issue: Irú ohun tí a ṣàpèjúwe nípasẹ̀ ìfiwéra pẹ̀lú ẹ̀fúùfù
  choice: 'Ọ̀rọ̀ pàtàkì pa ìfiwéra mọ́: ìró kan bí ti ẹ̀fúùfù líle tí ń fẹ́ kánkán.'
  alternative: Ẹ̀fúùfù líle gidi kan ni ó kún ilé náà.
  rationale: ὥσπερ fi ìfiwéra hàn. Ìtumọ̀ náà kò sọ ìfiwéra di ọ̀rọ̀ pé ẹ̀fúùfù gidi ló wà níbẹ̀, nítorí náà ó pa àìdánilójú tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ mọ́.
translation_notes:
  register: Yorùbá tí a lò jẹ́ èdè ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘ìró’ dípò ọ̀rọ̀ tí yóò fi ìdájọ́ búburú kún ohun náà, a sì tún ‘ìró náà’ sọ láti mú ẹni tí ó kún ilé náà yé kedere.
