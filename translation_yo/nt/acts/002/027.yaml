id: ACT.2.27
reference: Acts 2:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: yo
  text: nítorí ìwọ kì yóò fi ẹ̀mí mi sílẹ̀ ní Hédíìsì[a], bẹ́ẹ̀ ni ìwọ kì yóò jẹ́ kí Ẹni Mímọ́ rẹ[b] rí ìjẹrà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní Ṣéólì,” gẹ́gẹ́ bí ọ̀rọ̀ Hébérù tó wà lẹ́yìn àyọlò yìí; “Hédíìsì” ni ọ̀rọ̀ Gíríìkì níhìn-ín.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ẹni olóòótọ́ rẹ.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, ìjẹrà tàbí dídíbàjẹ́ ara; ìtumọ̀ Gẹ̀ẹ́sì ìbílẹ̀ sábà máa ń lò “corruption.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: kì yóò fi … sílẹ̀
  rationale: Ó túmọ̀ sí pé a kò ní kọ ẹnì kan sílẹ̀ tàbí fi í sí ipò kan. Ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ψυχήν
  choice: ọkàn
  rationale: Ní àyíká ọ̀rọ̀ àyọlò Sáàmù yìí, ψυχή lè túmọ̀ sí ẹ̀mí, ìwàláàyè, tàbí ẹni fúnra rẹ̀. “Ọkàn” pa ìṣòro ìtumọ̀ yẹn mọ́ láì sọ ọ́ di ẹ̀kọ́ pàtó nípa ipò lẹ́yìn ikú.
- source_word: εἰς ᾅδην
  choice: ní Hédíìsì
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe “fi … sílẹ̀,” “ní Hédíìsì” jẹ́ Yorùbá àdánidá. A lo orúkọ Hédíìsì láti pa ọ̀rọ̀ Gíríìkì mọ́, dípò fífi “ọ̀run àpáàdì” tàbí “ibojì” rọ́pò rẹ̀.
- source_word: δώσεις
  choice: jẹ́ kí
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni “fún,” pẹ̀lú ọ̀rọ̀ ìṣe aláìlẹ́ni idiom náà túmọ̀ sí fífàyè gba; “jẹ́ kí” ṣe kedere ní Yorùbá.
- source_word: τὸν ὅσιόν σου
  choice: Ẹni Mímọ́ rẹ
  rationale: ὅσιος lè tọ́ka sí ẹni mímọ́, olóòótọ́, tàbí ẹni tí ó fi ara rẹ̀ fún Ọlọ́run. “Ẹni Mímọ́” pa ìtumọ̀ àti ìtọ́kasí sí Kristi nínú àyíká Ìṣe 2 mọ́.
- source_word: ἰδεῖν διαφθοράν
  choice: rí ìbàjẹ́
  rationale: Èyí tẹ̀lé àpẹẹrẹ ọ̀rọ̀ Gíríìkì “rí ìbàjẹ́,” nígbà tí àlàyé ìsàlẹ̀ ojú ìwé mú kí ó ye ni pé ìjẹrà ara ni àyíká ọ̀rọ̀ ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ ᾅδης nínú àyọlò tó dá lórí àjíǹde
  choice: Hédíìsì
  alternative: Ṣéólì; ilẹ̀ àwọn òkú; ibojì
  rationale: “Hédíìsì” pa ọ̀rọ̀ Gíríìkì àti ìtọ́kasí rẹ̀ sí ibùgbé tàbí agbègbè àwọn òkú mọ́, láì kó èrò ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọlé. Àlàyé [a] pa Ṣéólì, ọ̀rọ̀ Hébérù tó wà lẹ́yìn àyọlò náà, mọ́.
- issue: Ìdánimọ̀ Kristi nínú τὸν ὅσιόν σου
  choice: Ẹni Mímọ́ rẹ
  alternative: ẹni olóòótọ́ rẹ; ẹni tí ó fi ara rẹ̀ fún ọ
  rationale: Pétérù fi Sáàmù náà kan Jésù àti àjíǹde rẹ̀ nínú Ìṣe 2. “Ẹni Mímọ́” pa gbogbo agbègbè ìtumọ̀ tó yẹ àti agbára ìtọ́kasí sí Kristi mọ́ láì fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtẹ̀jáde náà pa ìrísí ewì àyọlò Sáàmù mọ́, ó sì lo “Hédíìsì” gẹ́gẹ́ bí orúkọ ibi láti yẹra fún dídá ᾅδης pọ̀ mọ́ ọ̀run àpáàdì tàbí ibojì.
