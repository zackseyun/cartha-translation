  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: yo
  text: 'Èmi yóò sì fi àwọn iṣẹ́ ìyanu hàn ní ọ̀run lókè, àti àwọn àmì ní ayé nísàlẹ̀: ẹ̀jẹ̀, iná, àti ìkùukùu èéfín.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: Èmi yóò sì fi ... hàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tààrà ni ‘fún,’ èdè Yorùbá máa ń sọ pé ‘fi iṣẹ́ ìyanu hàn’ ní irú àyíká àsọtẹ́lẹ̀ yìí; ó jẹ́ kí ọ̀rọ̀ náà ṣe kedere láì yí ipa Ọlọ́run gẹ́gẹ́ bí ẹni tó mú àwọn àmì náà wá padà.
- source_word: τέρατα
  choice: iṣẹ́ ìyanu
  rationale: Ó túmọ̀ sí àwọn ohun àrà tó ń ru ẹ̀rù tàbí ìyàlẹ́nu; ‘iṣẹ́ ìyanu’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì bá ‘àwọn àmì’ mu.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: ní ọ̀run lókè
  rationale: Ó pa ìyàtọ̀ inaro àti àwòrán àgbáyé inú àsọtẹ́lẹ̀ náà mọ́, ní ìlòdì sí ‘ní ayé nísàlẹ̀.’
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: ‘Àwọn àmì’ fi hàn pé àwọn ìṣẹ̀lẹ̀ wọ̀nyí ní ìtumọ̀, kì í ṣe pé wọ́n kàn jẹ́ ohun àrà lásán.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: ní ayé nísàlẹ̀
  rationale: ‘Ayé’ bá ọ̀run mu nínú ìfìwéra àgbáyé yìí, kò sì dín γῆ kù sí ilẹ̀ agbègbè kan.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààrà tó pa àwòrán àsọtẹ́lẹ̀ náà mọ́.
- source_word: πῦρ
  choice: iná
  rationale: Ìtumọ̀ tààrà tó pa àwòrán ohun àdáyébá alágbára náà mọ́.
- source_word: ἀτμίδα καπνοῦ
  choice: ìkùukùu èéfín
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkójọpọ̀ èéfín tí a lè rí; àlàyé ìsàlẹ̀ fi ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù sílẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn ibi àgbáyé nínú àyọlò Joẹli
  choice: ọ̀run lókè ... ayé nísàlẹ̀
  alternative: ojú ọ̀run lókè ... ilẹ̀ nísàlẹ̀
  rationale: ‘Ọ̀run’ àti ‘ayé’ pa ìwọ̀n àgbáyé àti ìrísí àsọtẹ́lẹ̀ náà mọ́, láì dín un kù sí ojú-ọjọ́ tàbí agbègbè kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lò ‘Èmi’ láti fi ìtẹnumọ́ ẹni àkọ́kọ́ inú ọ̀rọ̀ àsọtẹ́lẹ̀ hàn; àmì ìdádúró méjì ṣáájú àtòjọ náà jẹ́ kí ìbáṣepọ̀ àwọn àmì pẹ̀lú ẹ̀jẹ̀, iná àti èéfín ṣe kedere.
