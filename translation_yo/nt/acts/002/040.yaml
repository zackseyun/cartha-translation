  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: yo
  text: Ó sì fi ọ̀pọ̀ ọ̀rọ̀ mìíràn jẹ́rìí fún wọn gidigidi, ó sì ń rọ̀ wọ́n pé, “Ẹ jẹ́ kí a gbà yín là kúrò lọ́wọ́ ìran aláyídá yìí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ẹ gba ara yín là kúrò lọ́wọ́ ìran aláyídá yìí.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn àgbàwí (“ẹ jẹ́ kí a gbà yín là”), ṣùgbọ́n àwọn ìtumọ̀ kan sọ ọ́ ní ọ̀nà tí ó túbọ̀ fi ìdáhùn tí a ń retí lọ́dọ̀ àwọn olùgbọ́ hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: fi ọ̀pọ̀ ọ̀rọ̀ mìíràn
  rationale: Ó pa ìtumọ̀ ‘ọ̀rọ̀ mìíràn púpọ̀’ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti fi ohun èlò ọ̀rọ̀ hàn ní Yorùbá.
- source_word: διεμαρτύρατο
  choice: jẹ́rìí tọkàntọkàn
  rationale: ‘Jẹ́rìí’ mú èrò fífi ẹ̀rí hàn wá, ‘tọkàntọkàn’ sì fi ìtẹnumọ́ àti ìjẹ́pàtàkì ọ̀rọ̀ náà hàn láì sọ ọ́ di ìkìlọ̀ nìkan.
- source_word: παρεκάλει
  choice: ó sì ń rọ̀ wọ́n
  rationale: Àmì àsìkò imperfect fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ‘ń rọ̀’ mú èyí àti agbára ìṣírí/ìpẹ̀bẹ̀ ọ̀rọ̀ náà pọ̀.
- source_word: Σώθητε
  choice: Ẹ jẹ́ kí a gbà yín là
  rationale: 'Èyí pa ohùn àgbàwí Greek mọ́: àwọn olùgbọ́ ni a ó gbà là, wọn kì í ṣe olùgbàlà ara wọn; síbẹ̀, àṣẹ náà ṣì ń pè wọ́n sí ìdáhùn gidi.'
- source_word: ἀπὸ τῆς γενεᾶς
  choice: kúrò lọ́wọ́ ìran
  rationale: ‘Kúrò lọ́wọ́’ sọ ìyapa tàbí ìdáǹdè kúrò nínú agbára ohun kan ní Yorùbá àdánidá, ‘ìran’ sì pa γενεά mọ́.
- source_word: σκολιᾶς
  choice: oníwà wíwọ́
  rationale: Ó pa àwòrán ohun tí ó wọ́ tàbí tí kò tọ́ mọ́, ó sì mú kí lílo náà gẹ́gẹ́ bí àpèjúwe ìwà burúkú yé òǹkàwé òde òní.
theological_decisions:
- issue: Ohùn àti ẹni tó ń ṣe iṣẹ́ nínú Σώθητε
  choice: Ẹ jẹ́ kí a gbà yín là
  alternative: Ẹ gba ara yín là
  rationale: Ọ̀rọ̀-ìṣe Greek jẹ́ àṣẹ ní ohùn àgbàwí. Ìtumọ̀ yìí kò sọ àwọn olùgbọ́ di ẹni tí wọ́n ń gba ara wọn là, ṣùgbọ́n ó tún pa ìpè pé kí wọ́n dáhùn mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ń rọ̀’ fún ìṣe tí ń bá a lọ, a sì yẹra fún èdè ẹ̀kọ́ ìsìn tí ó lè yanju ìjàkadì tó wà nínú ohùn àgbàwí.
