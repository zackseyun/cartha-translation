id: ACT.2.26
reference: Acts 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: yo
  text: Nítorí èyí, inú ọkàn mi dùn, ahọ́n mi sì yọ̀; bákan náà, ara mi pàápàá yóò gbé nínú ìrètí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ara mi yóò sinmi nínú ìrètí.”
    reason: «Sinmi» jẹ́ àṣàyàn ìtumọ̀ fún κατασκηνώσει nínú àyíká ikú, ṣùgbọ́n «gbé» pa àwòrán ibùgbé inú ọ̀rọ̀ Gíríìkì mọ́ dáadáa sí i.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó sọ ìdí tàbí ìpìlẹ̀ ohun tí ó tẹ̀ lé ní kedere, ó sì bá agbára causal ti διά pẹ̀lú accusative mu.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: inú ọkàn mi dùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọkàn ẹni kún fún ayọ̀, nígbà tí ó ṣì pa àwòrán ‘ọkàn’ mọ́.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: ahọ́n mi sì yọ̀
  rationale: ‘Ahọ́n’ pa àwòrán ewì fún ìyìn tí a fi ohùn sọ mọ́; ‘yọ̀’ sì fi ayọ̀ ńlá tí ọ̀rọ̀-ìṣe náà ní hàn láìsọ ọ́ di àlàyé gígùn.
- source_word: ἔτι δὲ καὶ
  choice: síwájú sí i ... pàápàá
  rationale: 'Àkójọpọ̀ yìí fi ìtẹ̀síwájú àti ìtẹnumọ́ hàn: gbólóhùn náà ń fi kún ohun tí a ti sọ, ó sì tẹnumọ́ ‘ara mi’.'
- source_word: ἡ σάρξ μου
  choice: ara mi
  rationale: Ní àyíká yìí σάρξ ń tọ́ka sí ìwàláàyè ẹni nínú ara, kì í ṣe ‘ìwà ẹlẹ́ṣẹ̀.’ ‘Ara mi’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí kò sì mú ìtumọ̀ ẹ̀kọ́ ìsìn àfikún wọlé.
- source_word: κατασκηνώσει
  choice: yóò máa gbé
  rationale: Ó pa àwòrán gbígbé tàbí pípa ibùgbé sí mọ́, dípò kí a dín ìtumọ̀ náà kù sí ‘sinmi’ nìkan.
- source_word: ἐπ’ ἐλπίδι
  choice: nínú ìrètí
  rationale: Ó sọ ìrètí gẹ́gẹ́ bí ipò tàbí ìpìlẹ̀ ààbò, láìfi àlàyé nípa àjíǹde kún ọ̀rọ̀ ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ tí àyíká rẹ̀ kan àjíǹde
  choice: ara mi
  alternative: ẹran ara mi
  rationale: ‘Ara mi’ tọ́ka sí ẹni gẹ́gẹ́ bí ẹni tí ó ní ara, ó sì yẹ fún Yorùbá òde òní. ‘Ẹran ara mi’ lè túmọ̀ sí àsopọ̀ ara lásán, kí ó sì mú ìtumọ̀ náà há ju ti Gíríìkì lọ.
- issue: Ìtumọ̀ κατασκηνώσει ἐπ’ ἐλπίδι
  choice: yóò máa gbé nínú ìrètí
  alternative: yóò sinmi nínú ìrètí
  rationale: Ìtumọ̀ tí a yàn pa àwòrán ibùgbé tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì jẹ́ kí àyíká ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú ikú àti àjíǹde. Àṣàyàn kejì ṣeé ṣe, ṣùgbọ́n ó dín àwòrán náà kù sí ìsinmi.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. A lo ‘inú ọkàn mi dùn’ gẹ́gẹ́ bí àṣà Yorùbá àdánidá, a sì pa ‘ahọ́n’ àti àwòrán gbígbé nínú ìrètí mọ́.
