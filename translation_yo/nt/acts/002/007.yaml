id: ACT.2.7
reference: Acts 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: yo
  text: Ẹnu sì yà wọ́n, ó sì ya wọ́n lẹ́nu gidigidi, wọ́n ń wí pé, “Wò ó, ṣé gbogbo àwọn tí ń sọ̀rọ̀ wọ̀nyí kò ha jẹ́ ará Gálílì ni?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Ẹnu sì yà wọ́n
  rationale: Ọ̀rọ̀ náà ń fi ìyàlẹ́nu líle hàn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì mú agbára ọ̀rọ̀ Gíríìkì jáde láì lo àkànlò èdè tí kò ṣe kedere.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” bá ìlò Yorùbá mu.
- source_word: καὶ
  choice: ó sì
  rationale: Ó so ìhùwàpadà méjèèjì pọ̀, ó sì pa ìtumọ̀ àkójọpọ̀ wọn mọ́.
- source_word: ἐθαύμαζον
  choice: ó sì ṣe wọ́n ní ìyàlẹ́nu
  rationale: Ó túmọ̀ sí pé ohun tí wọ́n rí yà wọ́n lẹ́nu gidigidi; yíyan ọ̀rọ̀ yìí yàtọ̀ díẹ̀ sí “Ẹnu yà wọ́n” ṣùgbọ́n ó pa ìtẹnumọ́ méjì inú orísun mọ́.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ó ṣe àfihàn ìṣe tí ń lọ lọ́wọ́, ó sì ṣáájú ohun tí wọ́n sọ lọ́nà àdánidá ní Yorùbá.
- source_word: Οὐχ
  choice: ṣé ... kọ́ ni
  rationale: Ìbéèrè òdì náà ń retí ìdáhùn ìfẹ̀sẹ̀múlẹ̀; àgbékalẹ̀ Yorùbá yìí pa ìtọ́kasí yẹn mọ́.
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ ìpe àfiyèsí ni; “Wò ó” jẹ́ ti òde òní, ó sì bá ohùn ọrọ̀ náà mu.
- source_word: πάντες οὗτοί
  choice: gbogbo àwọn ... yìí
  rationale: Ó tọ́ka sí gbogbo ẹgbẹ́ àwọn tí àwùjọ náà ń rí, láì fi “ọkùnrin” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: οἱ λαλοῦντες
  choice: tí ń sọ̀rọ̀
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti dá àwọn olùsọ̀rọ̀ mọ̀ ní Yorùbá.
- source_word: Γαλιλαῖοι
  choice: ará Gálílì
  rationale: Èyí ni orúkọ agbègbè fún àwọn tó ti Gálílì wá; a kò fi àlàyé nípa ohùn, ẹ̀kọ́, tàbí ipò wọn kún un.
theological_decisions:
- issue: Ìtumọ̀ àwùjọ tàbí agbègbè tó lè wà nínú “ará Gálílì”
  choice: A pa orúkọ agbègbè náà mọ́ láì fi àlàyé míì kún un.
  alternative: “àwọn ará Gálílì aláìlẹ́kọ̀ọ́” tàbí àlàyé nípa ìró ohùn wọn
  rationale: Ẹsẹ̀ náà fi hàn pé ìdánimọ̀ wọn gẹ́gẹ́ bí ará Gálílì ya àwọn ènìyàn lẹ́nu, ṣùgbọ́n kò sọ ìdí rẹ̀ ní kedere. Fífi ipò ẹ̀kọ́, ìró ohùn, tàbí ipò àwùjọ kún un yóò túmọ̀ àfojúsùn ọ̀rọ̀ ju bí orísun ṣe sọ lọ.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ẹnu yà wọ́n” gẹ́gẹ́ bí àkànlò Yorùbá tó níyì, a sì pa ìtẹnumọ́ àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́. Kò sí àlàyé ẹsẹ̀ tí ó yẹ fún àṣàyàn “Behold/See,” nítorí àwọn yẹn jẹ́ àṣàyàn Gẹ̀ẹ́sì; “Wò ó” ni ìbámu Yorùbá àdánidá.
