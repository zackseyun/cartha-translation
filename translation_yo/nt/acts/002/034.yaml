id: ACT.2.34
reference: Acts 2:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: yo
  text: Nítorí Dáfídì kò gòkè lọ sí àwọn ọ̀run[a], ṣùgbọ́n òun fúnra rẹ̀ sọ pé, “Olúwa sọ fún Olúwa mi pé, ‘Jókòó ní ọwọ́ ọ̀tún mi,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sáàmù 110:1. Nínú ọ̀rọ̀ Hébérù, ‘Olúwa’ àkọ́kọ́ dúró fún orúkọ Ọlọ́run YHWH; fi wé, ‘OLÚWA sọ fún Olúwa mi.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: gòkè lọ
  rationale: Ọ̀rọ̀ yìí sọ nípa fífi ibi kan sílẹ̀ lọ sí ibi gíga; nínú àyíká yìí, ó túmọ̀ sí gígun lọ sí ọ̀run. ‘Gòkè lọ’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún pa àwòrán ìgòkè mọ́.
- source_word: τοὺς οὐρανούς
  choice: àwọn ọ̀run
  rationale: Èdè Gíríìkì lo ọ̀pọ̀ nọ́ńbà. ‘Àwọn ọ̀run’ pa ìrísí náà àti ìró èdè Ìwé Mímọ́ mọ́ láì sọ ọ́ di ọ̀run kan ṣoṣo.
- source_word: λέγει δὲ αὐτός
  choice: ṣùgbọ́n òun fúnra rẹ̀ sọ pé
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ pẹ̀lẹ́ hàn sí gbólóhùn tó ṣáájú; ‘òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́. ‘Sọ pé’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọ̀rọ̀ Ìwé Mímọ́ hàn.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Olúwa ni ìtumọ̀ Yorùbá tó yẹ fún κύριος ní ọ̀rọ̀ yìí. Bó tilẹ̀ jẹ́ pé orúkọ YHWH ni ọ̀rọ̀ Hébérù tó wà lẹ́yìn ìfarahàn àkọ́kọ́, àkọsílẹ̀ pàtàkì tẹ̀ lé Gíríìkì, tí ó lo κύριος ní ibì méjèèjì.
- source_word: τῷ κυρίῳ μου
  choice: fún Olúwa mi
  rationale: ‘Olúwa mi’ pa ìtumọ̀ àti agbára Mèsáyà inú àríyànjiyàn Pétérù mọ́. ‘Ọ̀gá mi’ lè ṣeé lò ní àwọn àyíká kan, ṣùgbọ́n yóò dín ìgbéga ẹni tí Sáàmù náà ń tọ́ka sí kù níbí.
- source_word: Κάθου
  choice: Jókòó
  rationale: Àṣẹ tààrà ‘Jókòó’ jẹ́ Yorùbá àdánidá, ó sì pa kíkankíkan àṣẹ ìgbéga náà mọ́.
- source_word: ἐκ δεξιῶν μου
  choice: ní ọwọ́ ọ̀tún mi
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ipò ọlá àti àṣẹ tó ga jù lọ hàn, dípò títú ἐκ ní ọ̀rọ̀ sí ọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe tú κύριος méjèèjì nínú àyọlò Sáàmù 110:1
  choice: 'A lo ‘Olúwa’ ní ibì méjèèjì: ‘Olúwa sọ fún Olúwa mi.’'
  alternative: ‘OLÚWA sọ fún Olúwa mi,’ láti fi orúkọ Ọlọ́run YHWH tó wà nínú Hébérù hàn.
  rationale: Ọ̀rọ̀ Gíríìkì tó jẹ́ orísun lo κύριος ní ibì méjèèjì, nítorí náà àkọsílẹ̀ pàtàkì tẹ̀ lé e. Àlàyé ìsàlẹ̀ ojú ewé ni ó tọ́ka sí pé YHWH ni ìfarahàn àkọ́kọ́ dúró fún nínú Hébérù, kí a má bàa fi ohun tí kò fara hàn nínú Gíríìkì sínú àkọsílẹ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A pa ọ̀pọ̀ nọ́ńbà ‘àwọn ọ̀run,’ ìtẹnumọ́ ‘òun fúnra rẹ̀,’ àti ìyàtọ̀ tó wà láàárín Olúwa méjèèjì mọ́.
