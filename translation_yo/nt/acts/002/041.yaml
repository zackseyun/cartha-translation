revisions:
- from: Nítorí náà, àwọn tí wọ́n tẹ́wọ́ gba ọ̀rọ̀ rẹ̀ ni a batisí, a sì ṣàfikún nǹkan bí ẹgbẹ̀rún mẹ́ta ọkàn[a] ní ọjọ́ náà.
  to: Nítorí náà, àwọn tí wọ́n tẹ́wọ́ gba ọ̀rọ̀ rẹ̀ ni a batisí, a sì fi nǹkan bí ẹgbẹ̀rún mẹ́ta ọkàn kún un ní ọjọ́ náà.[a]
  rationale: Àtúnṣe náà ṣe ìṣètò gbolóhùn fífikún náà ní Yorùbá kí ó lè hàn gbangba pé àwọn ènìyàn wọ̀nyí ni a fi kún àwùjọ náà. “Un” jẹ́ aṣojú fún ohun tí àyíká ti fìdí rẹ̀ múlẹ̀, kì í ṣe fífi “ìjọ” tàbí orúkọ àwùjọ kan tí Gíríìkì kò sọ sínú ẹsẹ náà. A tún gbe àmì àlàyé sí ipari gbolóhùn tí “ọkàn” wà, kí ìtọ́kasí rẹ̀ lè mọ́gbọ́n dání.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:41Z'
