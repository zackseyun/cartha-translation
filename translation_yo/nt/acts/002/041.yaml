  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì mọ́ dáadáa: ìtẹ́wọ́gbà ọ̀rọ̀ náà, ìbatisí wọn, àti iye tó sún mọ́ ẹgbẹ̀rún mẹ́ta. Síbẹ̀, gbolóhùn “a sì ṣàfikún nǹkan bí ẹgbẹ̀rún mẹ́ta ọkàn” kò lérò bí Yorùbá tó rọrùn; ó tún lè dà bí pé a fi ohun kan kún iye kan, dípò pé a fi àwọn ènìyàn kún àwùjọ náà. “Fi ... kún un” ni ìlò Yorùbá tó dáa jù lọ fún passive προσετέθησαν ní àyíká yìí. Ọ̀rọ̀ “un” ń tọ́ka sí àwùjọ tí àyíká ti fi hàn, láìdarúkọ ìjọ tàbí ṣàfikún ẹ̀kọ́ ìsìn kan.'
