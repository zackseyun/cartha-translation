  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: yo
  text: Nítorí náà, àwọn tí wọ́n tẹ́wọ́ gba ọ̀rọ̀ rẹ̀ ni a batisí, a sì fi nǹkan bí ẹgbẹ̀rún mẹ́ta ọkàn kún un ní ọjọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ènìyàn” tàbí “àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì náà, “ọkàn,” jẹ́ ọ̀nà tí wọ́n sábà máa ń gbà ka àwọn ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Nítorí náà, àwọn tí
  rationale: Ó so èsì àwọn olùgbọ́ pọ̀ mọ́ ọ̀rọ̀ Pétérù tí ó ṣáájú, ó sì bá ìṣàn ìtàn Yorùbá mu.
- source_word: ἀποδεξάμενοι
  choice: tẹ́wọ́ gba
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n gba iṣẹ́ ìwàásù náà ní ọ̀nà rere; ‘tẹ́wọ́ gba’ jẹ́ èdè Yorùbá àdánidá tí kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: τὸν λόγον αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: ‘Ọ̀rọ̀’ tẹ̀lé λόγος pẹ̀kipẹ̀ki, ó sì lè túmọ̀ sí iṣẹ́ tí Pétérù kéde nínú àyíká yìí.
- source_word: ἐβαπτίσθησαν
  choice: ni a batisí
  rationale: Ìsọ̀rí aláìlórúkọ yìí mú ìṣe tí a ṣe sí wọn jáde láìsọ ọ̀nà batisí tàbí ipa rẹ̀ ní ti ẹ̀kọ́ ìsìn.
- source_word: προσετέθησαν
  choice: a sì ṣàfikún
  rationale: Ó pa èrò pé a fi àwọn ènìyàn wọ inú àwùjọ tí ń pọ̀ sí i mọ́, ṣùgbọ́n kò sọ ohun tí a fi wọ́n kún ní pàtó, nítorí èyí kò hàn gbangba nínú ẹsẹ yìí.
- source_word: ψυχαὶ
  choice: ọkàn
  rationale: ‘Ọkàn’ jẹ́ ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ọ̀nà kíkà ènìyàn ni ó jẹ́ níbí, kì í ṣe dandan ọ̀rọ̀ nípa ẹ̀dá aláìní ara.
- source_word: ὡσεὶ τρισχίλιαι
  choice: nǹkan bí ẹgbẹ̀rún mẹ́ta
  rationale: ‘Nǹkan bí’ fi ìsúnmọ́ iye tí ὡσεί ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ní ọjọ́ náà
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àkókò náà.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí a fi àwọn tuntun náà kún ní pàtó
  choice: 'A fi sílẹ̀ láìsọ ohun tí a fi wọ́n kún: ‘a sì ṣàfikún’'
  alternative: a sì fi wọ́n kún àwùjọ àwọn onígbàgbọ́ / ìjọ
  rationale: Ọ̀rọ̀ Gíríìkì kò darúkọ ohun tí a fi wọ́n kún nínú ẹsẹ yìí. Àyíká tọ́ka sí àwùjọ àwọn onígbàgbọ́, ṣùgbọ́n a kò gbọ́dọ̀ fi ohun tí ẹsẹ náà kò sọ ní gbangba kún un.
- issue: Ìtumọ̀ ψυχαί nípa irú ènìyàn
  choice: ‘ọkàn’ nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè túmọ̀ sí ènìyàn
  alternative: ènìyàn / àwọn ènìyàn
  rationale: Èyí pa ìfarahàn ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àlàyé náà dènà kí a má ka a sí gbólóhùn pàtó nípa ọkàn aláìní ara.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A lo àmì ohùn níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó. ‘Batisí’ jẹ́ ọ̀rọ̀ tí ó ti wọ́pọ̀ nínú èdè ìjọ Yorùbá, ṣùgbọ́n a kò ṣàlàyé ọ̀nà tàbí agbára rẹ̀.
