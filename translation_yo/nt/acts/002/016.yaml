  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: yo
  text: Ṣùgbọ́n èyí ni ohun tí a ti sọ nípasẹ̀ wòlíì Jóẹ́lì:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “láti ọwọ́ wòlíì Jóẹ́lì.” Nínú Giriki, ọ̀rọ̀ náà lè fi Jóẹ́lì hàn gẹ́gẹ́ bí aṣojú; ṣùgbọ́n “nípasẹ̀” túbọ̀ pa ipa rẹ̀ mọ́ gẹ́gẹ́ bí alárinà ọ̀rọ̀ àsọtẹ́lẹ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó jẹ́ àsopọ̀ atako tí ó ń ṣe àtúnṣe sí òye àṣìṣe àwọn ènìyàn nínú ọ̀rọ̀ tí ó ṣáájú.
- source_word: τοῦτό
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí ohun tí ń ṣẹlẹ̀ níwájú wọn; “èyí” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere tí ó sì bá àyíká mu.
- source_word: ἐστιν
  choice: ni
  rationale: Èyí ni ọ̀rọ̀ ìsopọ̀ lasan; kò yẹ kí a túmọ̀ rẹ̀ lọ́nà àlàyé sí “túmọ̀ sí.”
- source_word: τὸ εἰρημένον
  choice: ohun tí a ti sọ
  rationale: Ọ̀rọ̀ aláìlórúkọ pẹ̀lú àbọ̀ ìṣe perfect passive ni; “ohun tí a ti sọ” pa ìṣe àìṣèdárúkọ mọ́, ó sì fi hàn pé ọ̀rọ̀ náà ti wà ní sísọ tẹ́lẹ̀.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú genitive àti ẹni tí ó jẹ́ alárinà, διά lè tọ́ka sí ẹni tàbí ọ̀nà tí a fi sọ ọ̀rọ̀; “nípasẹ̀” pa ipa Jóẹ́lì gẹ́gẹ́ bí alárinà mọ́.
- source_word: τοῦ προφήτου
  choice: wòlíì
  rationale: Ó jẹ́ ohun tí διά ń ṣàkóso, ó sì sọ ipò Jóẹ́lì gẹ́gẹ́ bí wòlíì. Yorùbá kò nílò atọ́ka pàtó kan níbí.
- source_word: Ἰωήλ
  choice: Jóẹ́lì
  rationale: Àkọsílẹ̀ orúkọ yìí tẹ̀ lé bí a ṣe máa ń kọ orúkọ náà ní Yorùbá, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Ìlàárín-à-gbùngbùn wòlíì nínú διὰ τοῦ προφήτου Ἰωήλ
  choice: nípasẹ̀ wòlíì Jóẹ́lì
  alternative: láti ẹnu wòlíì Jóẹ́lì / láti ọwọ́ wòlíì Jóẹ́lì
  rationale: “Nípasẹ̀” fi Jóẹ́lì hàn gẹ́gẹ́ bí alárinà ọ̀rọ̀ àsọtẹ́lẹ̀ láì sọ pé òun ni orísun tó ga jù lọ, bẹ́ẹ̀ ni kò fi èrò ẹ̀kọ́ ìmísí kan tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. “Ṣùgbọ́n èyí ni...” pa ìtẹnumọ́ àti ìṣàtúnṣe inú Giriki mọ́.
