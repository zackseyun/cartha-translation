id: ACT.2.20
reference: Acts 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: yo
  text: 'Oòrùn yóò di òkùnkùn,

    òṣùpá yóò sì di ẹ̀jẹ̀,

    kí ọjọ́ ńlá àti ológo ti Olúwa tó dé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó hàn gbangba,” tàbí “tí ó ṣe pàtàkì gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: yóò di
  rationale: Ọ̀rọ̀ yìí fi ìyípadà sí ipò mìíràn hàn. “Yóò di” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àbájáde ìyípadà náà láìṣe àlàyé ohun tó fà á.
- source_word: εἰς σκότος
  choice: di òkùnkùn
  rationale: εἰς tọ́ka sí ipò tí ìyípadà náà yọrí sí; “di òkùnkùn” sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: εἰς αἷμα
  choice: di ẹ̀jẹ̀
  rationale: A pa àwòrán àsọtẹ́lẹ̀ Gíríìkì mọ́ gẹ́gẹ́ bí “ẹ̀jẹ̀,” dípò ṣíṣe àlàyé rẹ̀ sí “pupa bí ẹ̀jẹ̀.”
- source_word: πρὶν ἢ ἐλθεῖν
  choice: kí ... tó dé
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìṣẹ̀lẹ̀ kan tó máa ṣẹlẹ̀ ṣáájú dídé ìṣẹ̀lẹ̀ mìíràn.
- source_word: ἡμέραν κυρίου
  choice: ọjọ́ Olúwa
  rationale: Èyí pa gbólóhùn àsọtẹ́lẹ̀ tó túmọ̀ sí ọjọ́ ìfarahàn àti ìdájọ́ Ọlọ́run mọ́, kò sì jẹ́ kó dà bí ìtọ́ka sí ọjọ́ Sunday.
- source_word: μεγάλην
  choice: ńlá
  rationale: “Ńlá” ni ìbámu tààrà pẹ̀lú μέγας, ó sì bá ohùn àsọtẹ́lẹ̀ náà mu.
- source_word: ἐπιφανῆ
  choice: ológo
  rationale: “Ológo” bá ọlá gíga ti ọ̀rọ̀ àsọtẹ́lẹ̀ náà mu, ṣùgbọ́n nítorí pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ohun tó hàn gbangba tàbí tó ṣe pàtàkì, a fi àwọn ìtumọ̀ wọ̀nyí sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn àsọtẹ́lẹ̀ ἡμέραν κυρίου nínú ọ̀rọ̀ Joẹli tí Peteru ń fa yọ
  choice: ọjọ́ Olúwa
  alternative: ọjọ́ ti Olúwa
  rationale: “Ọjọ́ Olúwa” pa àṣà ọ̀rọ̀ Bíbélì mọ́ fún ọjọ́ ìbẹ̀wò àti ìdájọ́ Ọlọ́run, ó sì yẹra fún ìtumọ̀ pé ọjọ́ ìjọsìn ọ̀sọ̀ọ̀sẹ̀ ni.
- issue: Ìtumọ̀ ἐπιφανῆ nínú àyíká ọ̀rọ̀ nípa ọjọ́ ìkẹyìn
  choice: ológo
  alternative: tí ó hàn gbangba; tí ó ṣe pàtàkì gidigidi
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ohun tó ṣe kedere tàbí tó yanilẹ́nu, bẹ́ẹ̀ sì ni ó lè ní ìmọ̀lára ọlá. A lo “ológo” nínú ẹsẹ̀, a sì pa ìwọ̀n ìtumọ̀ yòókù mọ́ nínú àlàyé ìsàlẹ̀ láìfi ẹ̀kọ́ ìjọ kan lé e lórí.
translation_notes:
  register: A lo Yorùbá àtijọ́dá díẹ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ ewì àti àwòrán àsọtẹ́lẹ̀ ni a pa mọ́; a fi àmì ohùn síbi tí ó yẹ.
