  to: 'Oòrùn yóò di òkùnkùn,

    òṣùpá yóò sì di ẹ̀jẹ̀,

    kí ọjọ́ ńlá àti ológo ti Olúwa tó dé.[a]'
  rationale: Àtúnṣe náà jẹ́ ti ìṣètò gbolóhùn nìkan. Ó pa ìtumọ̀ ọjọ́ iwájú, ìyípadà sí òkùnkùn àti ẹ̀jẹ̀, ìṣáájú àkókò, àti àwọn àpèjúwe “ńlá” àti “ológo” mọ́. A tún gbe àmì àlàyé ìsàlẹ̀ sí ìparí gbolóhùn tó ní ọ̀rọ̀ ἐπιφανῆ, kí ibi ìtọ́kasí rẹ̀ lè ṣe kedere.
  reviewer_model: gpt-5.6-terra
