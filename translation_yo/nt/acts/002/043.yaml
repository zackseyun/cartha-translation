  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: yo
  text: Ẹ̀rù sì dé bá gbogbo ènìyàn[a], ọ̀pọ̀ iṣẹ́ ìyanu àti àmì sì ń wáyé nípasẹ̀ àwọn àpọ́sítélì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rù dé bá gbogbo ọkàn.” Ní tààrà, Gíríìkì sọ pé, “ẹ̀rù dé bá gbogbo ọkàn.” Nínú àyíká yìí, “ẹ̀rù” tún lè túmọ̀ sí ìbẹ̀rù ọlọ́wọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: Ẹ̀rù sì ń ba
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹ̀rù dé bá àwọn ènìyàn; àmì àkókò “ń” tún fi hàn pé ohun náà ń bá a lọ, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ ń tẹ ìtàn náà síwájú, kò sì fi ìtakora líle hàn. “Sì” bá ìṣàn ìtàn Yorùbá mu.
- source_word: πάσῃ ψυχῇ
  choice: olúkúlùkù
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì túmọ̀ ní tààrà sí “gbogbo ọkàn,” “olúkúlùkù” ni ọ̀nà Yorùbá tó ṣe kedere, tó sì túmọ̀ sí gbogbo ènìyàn láìsí ìdàrúdàpọ̀.
- source_word: φόβος
  choice: ẹ̀rù
  rationale: “Ẹ̀rù” pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ kí ìtumọ̀ náà lè ní ìbẹ̀rù àti ìyanu ọlọ́wọ̀ nínú, láìfi tipátipá yan ọ̀kan ṣoṣo.
- source_word: πολλά
  choice: ọ̀pọ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún iye púpọ̀.
- source_word: τέρατα
  choice: iṣẹ́ ìyanu
  rationale: Ọ̀rọ̀ yìí tẹnu mọ́ bí àwọn ìṣẹ̀lẹ̀ náà ṣe ń ya ènìyàn lẹ́nu; “iṣẹ́ ìyanu” jẹ́ èdè Yorùbá tó mọ́gbọ́n dání fún un.
- source_word: σημεῖα
  choice: àmì
  rationale: “Àmì” pa ipa ohun náà gẹ́gẹ́ bí ohun tó ń tọ́ka sí òtítọ́ mìíràn mọ́, ó sì yàtọ̀ sí “iṣẹ́ ìyanu.”
- source_word: διὰ τῶν ἀποστόλων
  choice: nípasẹ̀ àwọn àpọ́sítélì
  rationale: “Nípasẹ̀” fi àwọn àpọ́sítélì hàn gẹ́gẹ́ bí ọ̀nà tàbí aṣojú tí iṣẹ́ náà fi ń ṣẹlẹ̀, láìsọ wọ́n di olùṣe tó ga jù lọ.
- source_word: ἐγίνετο
  choice: ń wáyé
  rationale: “Ń wáyé” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣẹ̀lẹ̀ tó ń ṣẹlẹ̀ léraléra tàbí tó ń bá a lọ, ó sì bá imperfect Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ φόβος gẹ́gẹ́ bí ìdáhùn sí iṣẹ́ Ọlọ́run nípasẹ̀ àwọn àpọ́sítélì
  choice: ẹ̀rù
  alternative: ìbẹ̀rù ọlọ́wọ̀ tàbí ìyanu tó kún fún ọ̀wọ̀
  rationale: “Ẹ̀rù” pa ìfọ̀kànbalẹ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì kò jẹ́ kí ìtumọ̀ yan ìbẹ̀rù lásán tàbí ọ̀wọ̀ ọlọ́wọ̀ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “olúkúlùkù” dípò “gbogbo ọkàn” nínú àyọkà pàtàkì nítorí pé èyí ló túmọ̀ sí gbogbo ènìyàn lọ́nà àdánidá jù lọ ní Yorùbá; àlàyé ìtumọ̀ tààrà wà ní àlàyé ìsàlẹ̀.
