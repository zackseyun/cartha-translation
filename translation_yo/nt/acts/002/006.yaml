  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: yo
  text: Nígbà tí ìró yìí sì wáyé[a], ogunlọ́gọ̀ ènìyàn náà péjọ, ìdàrúdàpọ̀ sì bá wọn, nítorí pé olúkúlùkù ń gbọ́ wọ́n ń sọ̀rọ̀ ní èdè ìbílẹ̀ tirẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ohùn yìí ṣẹlẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìró, ohùn, tàbí ariwo; níbí, ó ń tọ́ka sí ohun tí àwọn ènìyàn gbọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní èdè tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí èdè lápapọ̀ tàbí sí irú èdè tí àwọn ènìyàn agbègbè kan ń sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: Nígbà tí ìró yìí sì dún
  rationale: Ẹ̀ka ọ̀rọ̀ genitive absolute fi àkókò ìṣẹ̀lẹ̀ hàn. Nínú àyíká yìí, “ìró” sọ ohun tí etí gbọ́ láì pinnu pé ohùn ènìyàn ni; “dún” sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìró kan bẹ̀rẹ̀ sí í gbọ́.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó mú kí ìtàn náà máa bá a lọ ní ọ̀nà àdánidá.
- source_word: συνῆλθε τὸ πλῆθος
  choice: ogunlọ́gọ̀ ènìyàn péjọ
  rationale: “Ogunlọ́gọ̀ ènìyàn” túmọ̀ πλῆθος gẹ́gẹ́ bí àwùjọ ńlá, “péjọ” sì fi ìkó ara wọn jọ sí ibi kan hàn.
- source_word: συνεχύθη
  choice: ìdàrúdàpọ̀ sì bá wọn
  rationale: Ọ̀rọ̀ yìí mú ìdàrúdàpọ̀ àti àìlóye àwùjọ náà jáde ní Yorùbá tó ṣe kedere, láì fi ìtumọ̀ míì kún un.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ṣàlàyé ìdí tí ìdàrúdàpọ̀ fi bá ogunlọ́gọ̀ náà.
- source_word: ἤκουον
  choice: ń gbọ́
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú “ń gbọ́” pa ipa imperfect mọ́, ó sì fi hàn pé ohun tí wọ́n ń gbọ́ ń bá a lọ.
- source_word: εἷς ἕκαστος
  choice: olúkúlùkù
  rationale: “Olúkúlùkù” pa ìtẹnumọ́ distributive mọ́ pé ẹni kọ̀ọ̀kan ló ní ìrírí yìí.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: ní èdè ìbílẹ̀ tirẹ̀
  rationale: διάλεκτος lè jẹ́ èdè tàbí irú èdè agbègbè kan. “Èdè ìbílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa èrò èdè tí ẹni kọ̀ọ̀kan mọ̀ láti ìbílẹ̀ rẹ̀ mọ́.
- source_word: λαλούντων αὐτῶν
  choice: wọn tí wọ́n ń sọ̀rọ̀
  rationale: Ó tọ́ka sí àwọn olùsọ̀rọ̀ tí a ti mẹ́nu kàn tẹ́lẹ̀, láì fi ìdánimọ̀ tóóró tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Ta ni àwọn tó ń sọ̀rọ̀?
  choice: wọn tí wọ́n ń sọ̀rọ̀
  alternative: àwọn aposteli tí wọ́n ń sọ̀rọ̀
  rationale: αὐτῶν jẹ́ arọ́pò-orúkọ tí ó tọ́ka sí àwọn ẹni tí ìtàn ti mú wá sí iwájú; ẹsẹ yìí fúnra rẹ̀ kò dín wọn kù sí àwọn aposteli nìkan, nítorí náà a kò fi ìtumọ̀ tóóró kún un.
- issue: Ìbámu ọ̀rọ̀ olúkúlùkù àti ohun-ìní tirẹ̀
  choice: olúkúlùkù ... tirẹ̀
  alternative: gbogbo wọn ... tiwọn
  rationale: Ìtumọ̀ yìí pa ìpínkiri ẹni kọ̀ọ̀kan nínú εἷς ἕκαστος àti τῇ ἰδίᾳ mọ́, Yorùbá sì lè ṣe bẹ́ẹ̀ láì dá abo tàbí akọ lé ẹni náà lórí.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn Gíríìkì, ṣùgbọ́n a lo àwọn ọ̀nà Yorùbá àdánidá bí “ìdàrúdàpọ̀ bá wọn” àti “èdè ìbílẹ̀ tirẹ̀.”
