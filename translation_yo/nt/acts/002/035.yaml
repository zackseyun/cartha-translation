  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: yo
  text: títí tí èmi yóò fi sọ àwọn ọ̀tá rẹ di àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ̀rọ̀ náà ní tààrà sí i, ‘títí tí èmi yóò fi àwọn ọ̀tá rẹ sí gẹ́gẹ́ bí àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ.’
    reason: lexical_alternative
  - marker: b
    text: Ìlà yìí ń tọ́ka sí Sáàmù 110:1, ọ̀rọ̀ nípa ìfìjókòó ọba lórí ìtẹ́ tí ó ní í ṣe pẹ̀lú Mèsáyà.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: títí èmi yóò fi
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí àkókò ọjọ́ iwájú kan; ìṣọ̀rọ̀ ‘títí ... yóò fi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi agbára àkókò náà hàn.
- source_word: θῶ
  choice: sọ ... di
  rationale: Bí ó tilẹ̀ jẹ́ pé τίθημι túmọ̀ ní pàtàkì sí ‘gbé sí’ tàbí ‘fi sí,’ nínú ìṣọ̀rọ̀ yìí, ‘sọ ... di’ fi ẹ̀ka àfojúsùn náà hàn lọ́nà àdánidá.
- source_word: τοὺς ἐχθρούς σου
  choice: àwọn ọ̀tá rẹ
  rationale: Èyí túmọ̀ ọ̀rọ̀ Gíríìkì náà tààrà, ó sì pa ìtumọ̀ ọ̀tá ẹni àti àwọn alatakò ọba mọ́.
- source_word: ὑποπόδιον
  choice: àpótí ìtìsẹ̀
  rationale: Èyí jẹ́ ohun tí a fi ń gbé ẹsẹ̀ lé, ó sì pa àwòrán ìtẹríba àwọn ọ̀tá mọ́.
- source_word: τῶν ποδῶν σου
  choice: fún ẹsẹ̀ rẹ
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìbáṣepọ̀ tí ọ̀rọ̀ atọ́ka Gíríìkì fi hàn, láì tú àwòrán náà sí ‘lábẹ́ ẹsẹ̀ rẹ.’
theological_decisions:
- issue: Àwòrán ìtẹríba ọba nínú àyọlò Sáàmù 110:1
  choice: Pa àwòrán gidi náà mọ́ pé àwọn ọ̀tá di ‘àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ.’
  alternative: títí èmi yóò fi tẹ gbogbo àwọn ọ̀tá rẹ ba pátápátá lábẹ́ ẹsẹ̀ rẹ
  rationale: Ẹsẹ̀ yìí ń ṣàtúnlò Sáàmù 110:1, ọ̀rọ̀ nípa jíjókòó ọba lórí ìtẹ́ tí ó ní ìjẹ́pàtàkì Mèsáyà. Pípa àkàwé náà mọ́ ń dáàbò bo ìsopọ̀ rẹ̀ pẹ̀lú Sáàmù náà, láì fi ìtumọ̀ àlàyé kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. ‘Àpótí ìtìsẹ̀’ pa ohun èlò àti àwòrán ìtẹríba inú orísun Gíríìkì mọ́.
