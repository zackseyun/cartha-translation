id: ACT.2.18
reference: Acts 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: yo
  text: Àní, ní àwọn ọjọ́ wọ̀nyẹn, èmi yóò tú lára Ẹ̀mí mi sórí àwọn ẹrú mi ọkùnrin àti sórí àwọn ẹrú mi obìnrin[a][b], wọn yóò sì sọ àsọtẹ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ìránṣẹ́ mi ọkùnrin … àwọn ìránṣẹ́ mi obìnrin.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; ‘ẹrú’ níbí ń pa ìtẹnumọ́ ipò àwùjọ kékeré inú ẹsẹ yìí mọ́.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ‘lára Ẹ̀mí mi’; a tún lè sọ pé ‘láti inú Ẹ̀mí mi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Àní
  rationale: Ó fi ìtẹnumọ́ kún ọ̀rọ̀ tó ṣáájú, ó sì mú agbára ‘àní sí… pàápàá’ jáde ní Yorùbá àdánidá.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: sórí àwọn ẹrú mi ọkùnrin àti sórí àwọn ẹrú mi obìnrin
  rationale: ‘Ẹrú’ pa ipò àwùjọ kékeré tí δοῦλος/δούλη ń tọ́ka sí mọ́; ‘ọkùnrin’ àti ‘obìnrin’ sì pa ìyàtọ̀ akọ àti abo inú Gíríìkì mọ́.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó jẹ́ gbólóhùn àkókò tó ṣe kedere, tó sì pa agbára atọ́ka ἐκείναις mọ́.
- source_word: ἐκχεῶ
  choice: èmi yóò tú … sí
  rationale: Ó pa àwòrán ohun tí a ń tú jáde lọ́pọ̀lọpọ̀ mọ́, ‘èmi’ sì mú ẹni tó ń ṣe é tẹnumọ́ bí ìṣètò gbólóhùn Yorùbá ṣe ń béèrè níbí.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: lára Ẹ̀mí mi
  rationale: ‘Lára’ mú ìtumọ̀ ἀπό, ‘láti inú/lára,’ hàn láì sọ ọ́ di pé gbogbo Ẹ̀mí náà ni a tú jáde.
- source_word: προφητεύσουσιν
  choice: wọn yóò sọ àsọtẹ́lẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún iṣẹ́ wòlíì tí fáàbù Gíríìkì náà ń sọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος/δούλη ní àyíká tí a ti ń tẹnumọ́ ipò àwùjọ kékeré
  choice: ẹrú mi ọkùnrin / ẹrú mi obìnrin
  alternative: ìránṣẹ́ mi ọkùnrin / ìránṣẹ́ mi obìnrin
  rationale: ‘Ẹrú’ dá ìtumọ̀ ipò ìdè àti ìrẹ̀lẹ̀ àwùjọ dúró, ó sì mú ìyanu pé ẹ̀bùn Ẹ̀mí dé ọ̀dọ̀ akọ àti abo ní ipò yìí hàn. Àlàyé ìsàlẹ̀ fi ‘ìránṣẹ́’ sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tó ṣeé ṣe.
- issue: Bí a ṣe túmọ̀ ἀπὸ τοῦ πνεύματός μου
  choice: lára Ẹ̀mí mi
  alternative: nínú Ẹ̀mí mi / láti inú Ẹ̀mí mi
  rationale: ‘Lára’ pa ọ̀rọ̀ atọ́ka ἀπό mọ́, ó sì yàgò fún fífi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. Ìtẹnumọ́ ‘Àní’ àti àtúnlò ‘sórí’ pa ìṣọ̀kan àti ìwọ̀n gbólóhùn Gíríìkì mọ́, nígbà tí ìtòlẹ́sẹẹsẹ náà ṣì jẹ́ àdánidá fún olùkà Yorùbá.
