id: ACT.2.24
reference: Acts 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: yo
  text: ẹni tí Ọlọ́run jí dìde, nípa títú àwọn ìrora ikú sílẹ̀[a], nítorí kò ṣeé ṣe kí ikú dì í mú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “àwọn ìrora ìrọbí ikú” tàbí “àwọn ìrora líle ikú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìrora tí obìnrin ń ní nígbà ìrọbí; ó sì lè pa àwòrán ìdìmú ikú tí a ṣẹ́ lulẹ̀ mọ́.
    reason: lexical_alternative
  - marker: b
    text: 'Nínú Gíríìkì, arọ́pò-orúkọ akọ ẹlẹ́yọkan kan wà lẹ́yìn ọ̀rọ̀ tí ó fi ohun tí ń ṣe ìdìmọ́ hàn. Ó ṣeé ṣe jù pé ó ń tọ́ka sí ikú: “kí ikú dì í mú.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: ẹni tí
  rationale: Ó pa ìsopọ̀ gbólóhùn arọ́pò-orúkọ mọ́, ó sì ń tọ́ka padà sí Jésù nínú ẹsẹ tó ṣáájú.
- source_word: ἀνέστησεν
  choice: jí dìde
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run jí Jésù dìde kúrò nínú ikú, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn àfikún sí i.
- source_word: λύσας
  choice: tí ó tú ... sílẹ̀
  rationale: Ó pa àwòrán ohun tí a tú tàbí tí a tú sílẹ̀ mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì λύω ṣe túmọ̀ sí.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: àwọn ìrora ikú
  rationale: ὠδίν lè túmọ̀ sí ìrora líle tàbí ìrora ìrọbí. ‘Àwọn ìrora ikú’ ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ìrora ìrọbí mọ́.
- source_word: καθότι
  choice: nítorí
  rationale: Ó fi ìdí ohun tí Ọlọ́run ṣe hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: οὐκ ἦν δυνατὸν
  choice: kò ṣeé ṣe
  rationale: Ó tẹ̀ lé ìtumọ̀ ìkọ̀sẹ̀ Gíríìkì náà pẹ̀lú ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: κρατεῖσθαι
  choice: máa dì í mú
  rationale: Ó pa àwòrán dídìmú tàbí fífi ẹni kan sábẹ́ agbára mọ́, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὑπ’ αὐτοῦ
  choice: kí ikú máa dì í mú
  rationale: Arọ́pò-orúkọ Gíríìkì náà ṣeéṣe jù láti tọ́ka sí ikú. Fífi ‘ikú’ hàn gbangba mú gbólóhùn Yorùbá ṣe kedere; àlàyé ìsàlẹ̀ ojú ìwé sì ṣàkọsílẹ̀ ìṣe ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ohun tí ὑπ’ αὐτοῦ ń tọ́ka sí
  choice: Arọ́pò-orúkọ náà ń tọ́ka sí ikú.
  alternative: A lè pa á mọ́ gẹ́gẹ́ bí ‘láti ọwọ́ rẹ̀,’ èyí tí ó lè dà bí ẹni pé ó ń tọ́ka sí akọ kan.
  rationale: θανάτου ni orúkọ tó sún mọ́ ọn jù, ìtumọ̀ gbogbo gbólóhùn náà sì ni pé ikú kò lè máa di Jésù mú. Àlàyé ìsàlẹ̀ ojú ìwé ṣì pa ìrísí gangan ti Gíríìkì mọ́.
- issue: Ìtumọ̀ ὠδῖνας
  choice: àwọn ìrora ikú
  alternative: àwọn ìrora ìrọbí ikú
  rationale: Ọ̀rọ̀ náà lè jẹ́ ìrora ìrọbí tàbí ìrora líle. ‘Àwọn ìrora ikú’ dára jù fún àyíká yìí, ṣùgbọ́n a kò fi ìtumọ̀ ìrora ìrọbí pamọ́; a ṣàlàyé rẹ̀ ní ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘jí dìde’ àti ‘dì í mú’ nítorí wọ́n rọrùn fún òǹkàwé lásán, nígbà tí ‘tú ... sílẹ̀’ pa àwòrán orísun Gíríìkì mọ́.
