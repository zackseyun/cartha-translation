id: ACT.2.17
reference: Acts 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: yo
  text: “Yóò sì ṣe ní àwọn ọjọ́ ìkẹyìn,” ni Ọlọ́run wí, “Èmi yóò tú láti inú Ẹ̀mí mi[a] sórí gbogbo ẹran ara[b]. Àwọn ọmọkùnrin yín àti àwọn ọmọbìnrin yín yóò sọ àsọtẹ́lẹ̀; àwọn ọ̀dọ́kùnrin yín yóò rí ìran, àwọn àgbà ọkùnrin yín yóò sì lá àlá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ ọ̀rọ̀ ní tààrà, Gíríìkì sọ pé “láti inú Ẹ̀mí mi,” kì í ṣe “Ẹ̀mí mi” lásán.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “gbogbo ènìyàn.” Gíríìkì sọ ní ti gígùn ọ̀rọ̀ pé “gbogbo ẹran ara,” ó sì pa ọ̀nà ìsọ àsọtẹ́lẹ̀ mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: ní àwọn ọjọ́ ìkẹyìn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbolohun nípa àwọn ọjọ́ tó gbẹ̀yìn, láì fi ìtumọ̀ míì kún àyè rẹ̀.
- source_word: λέγει ὁ θεός
  choice: ni Ọlọ́run wí
  rationale: Ó pa ìlànà ọ̀rọ̀ àsọtẹ́lẹ̀ àti ìṣe àsìkò ìsinsìnyí inú Gíríìkì mọ́ ní Yorùbá tó bójú mu.
- source_word: ἐκχεῶ
  choice: Èmi yóò tú
  rationale: Ó pa àwòrán ohun tí a ń dà jáde mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: lára Ẹ̀mí mi
  rationale: “Lára” fi ἀπό, ìyẹn ‘láti ara’ tàbí ‘nínú orísun kan,’ hàn kedere ju kí a sọ pé ‘Ẹ̀mí mi’ lásán lọ; kò sì fi hàn pé Ẹ̀mí náà pín sí wẹ́wẹ́.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: sórí gbogbo ẹran ara
  rationale: Ó pa àwòrán àsọtẹ́lẹ̀ ‘gbogbo ẹran ara’ mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé gbogbo onírúurú ènìyàn ni a ń tọ́ka sí.
- source_word: προφητεύσουσιν
  choice: yóò sọ àsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì taara fún iṣẹ́ àsọtẹ́lẹ̀.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: àwọn ọmọkùnrin yín àti àwọn ọmọbìnrin yín
  rationale: Ó pa àtúnlò ọ̀rọ̀ àti fífi akọ àti abo hàn ní kedere gẹ́gẹ́ bí Gíríìkì ṣe ṣe é mọ́.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: àwọn ọ̀dọ́kùnrin yín
  rationale: Ó pa akọ àti ìpele ọjọ́ orí tí ọ̀rọ̀ Gíríìkì tọ́ka sí mọ́.
- source_word: ὁράσεις ὄψονται
  choice: yóò rí ìran
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ríran ìran, ó sì pa ìtumọ̀ àkópọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì mú kí gbolohun nira.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: àwọn àgbà ọkùnrin yín
  rationale: Nítorí a fi wọ́n wé àwọn ọ̀dọ́kùnrin, ọ̀rọ̀ yìí ń tọ́ka sí ọjọ́ orí, kì í ṣe ipò olórí ìjọ; ‘ọkùnrin’ sì pa akọ inú Gíríìkì mọ́.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: yóò lá àlá
  rationale: Èyí ni àkópọ̀ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ àti ìbáramu ewì Gíríìkì mu.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘gbogbo ẹran ara’
  choice: Pa ‘gbogbo ẹran ara’ mọ́ nínú ẹsẹ̀ gẹ́gẹ́ bí àwòrán àsọtẹ́lẹ̀ fún gbogbo ènìyàn.
  alternative: gbogbo ènìyàn; gbogbo aráyé
  rationale: Yíyan yìí pa ìsopọ̀ pẹ̀lú àsọtẹ́lẹ̀ Jóẹli àti fífẹ̀ ìlérí náà mọ́, láì dín àwòrán ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kù.
- issue: Ta ni πνεῦμα ń tọ́ka sí nínú ìtújáde Ọlọ́run?
  choice: Ẹ̀mí mi
  alternative: ẹ̀mí mi
  rationale: Àyíká àsọtẹ́lẹ̀ fi hàn pé Ẹ̀mí Ọlọ́run ni a ń sọ̀rọ̀ nípa rẹ̀; lẹ́tà ńlá ń mú ẹni tí ọ̀rọ̀ náà tọ́ka sí ṣe kedere láì fi ẹ̀kọ́ míì kún un.
- issue: Ìtumọ̀ ἀπό nínú ‘ἀπὸ τοῦ πνεύματός μου’
  choice: lára Ẹ̀mí mi
  alternative: Ẹ̀mí mi; lára ẹ̀bùn Ẹ̀mí mi
  rationale: Èyí pa èrò ‘láti ara/orísun’ inú ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n kò sọ pé Ẹ̀mí Ọlọ́run jẹ́ ohun tí a lè pín sí apá.
translation_notes:
  register: A lo Yorùbá àgbéléwò tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A pa ìbáramu àwọn ọmọkùnrin/ọmọbìnrin àti ọ̀dọ́kùnrin/àgbà ọkùnrin mọ́. A tún ṣètò àmì àlàyé [a] àti [b] sí ibi tí ọ̀kọ̀ọ̀kan ń ṣàlàyé gan-an, nítorí àwọn àmì inú ìpele ìmọ̀ràn Gẹ̀ẹ́sì kò bá àkóónú àlàyé wọn mu.
