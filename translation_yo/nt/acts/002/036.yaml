id: ACT.2.36
reference: Acts 2:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: yo
  text: Nítorí náà, kí gbogbo ilé Ísírẹ́lì mọ̀ dájú pé Ọlọ́run ti fi Jésù yìí jẹ́ Olúwa àti Mèsáyà[a]—ẹni tí ẹ̀yin kàn mọ́ àgbélébùú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός (Christos); níhìn-ín, “Mèsáyà” fi ìtumọ̀ oyè náà hàn nínú ọ̀rọ̀ Pétérù sí Ísírẹ́lì.
    reason: alternative_reading
  - marker: b
    text: Gbólóhùn náà, “Ọlọ́run ti fi Jésù yìí jẹ́ Olúwa àti Mèsáyà,” ń tọ́ka, nínú àyíká yìí, sí ìgbéga Jésù àti ìfihàn ipò rẹ̀ ní gbangba. Ọ̀rọ̀ náà fúnra rẹ̀ kò sọ ní pàtó nípa ìyípadà nínú ìwà ìpilẹ̀ṣẹ̀ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: dájúdájú
  rationale: Ó fi ìdánilójú ọ̀rọ̀ Pétérù hàn ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìbáṣepọ̀ ìparí-ẹ̀rí mọ́ pẹ̀lú àríyànjiyàn tó ṣáájú nípa àjíǹde àti ìgbéga Jésù.
- source_word: γινωσκέτω
  choice: kí ... mọ̀
  rationale: Ìṣètò yìí fi agbára àṣẹ ẹni-kẹta hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: gbogbo ilé Ísírẹ́lì
  rationale: Ó pa àpẹẹrẹ Bíbélì tó ń tọ́ka sí gbogbo ènìyàn májẹ̀mú mọ́.
- source_word: κύριον
  choice: Olúwa
  rationale: Ó fi ipò àti àṣẹ gíga hàn, ó sì bá àyíká ẹsẹ Ìwé Mímọ́ tí a ṣẹ̀ṣẹ̀ tọ́ka sí mu.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ní ọ̀rọ̀ Pétérù sí ilé Ísírẹ́lì, ọ̀rọ̀ náà jẹ́ oyè Mèsáyà ní kedere ju bí orúkọ àfikún lọ.
- source_word: ἐποίησεν
  choice: ti fi ... jẹ́
  rationale: Àṣàyàn Yorùbá yìí jẹ́ àdánidá fún fífi ẹnì kan sí ipò tàbí mímú un jẹ́ ohun kan, ó sì pa ipa ọ̀rọ̀ Gíríìkì mọ́ láì sọ pé ìwà àtọ̀runwá rẹ̀ yí padà.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Jésù yìí
  rationale: Ó pa ìtẹnumọ́ àti ìtọ́ka sí Jésù ìtàn náà mọ́.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: ẹni tí ẹ̀yin kàn mọ́ àgbélébùú
  rationale: Ó túmọ̀ ẹ̀sùn tààràtà náà ní Yorùbá tó ṣe kedere, pẹ̀lú ìtẹnumọ́ lórí ‘ẹ̀yin.’
theological_decisions:
- issue: Ìtumọ̀ ‘Ọlọ́run ti fi í jẹ́ Olúwa àti Mèsáyà’ nípa ẹni tí Kristi jẹ́
  choice: A túmọ̀ gẹ́gẹ́ bí ìgbéga àti ìfihàn Jésù ní gbangba nínú àwọn ipò wọ̀nyí, ní lílo ‘ti fi ... jẹ́.’
  alternative: ‘Ọlọ́run ti sọ ọ́ di Olúwa àti Mèsáyà,’ èyí tí a lè ṣì lóye bí ìyípadà nínú ìwà ìpilẹ̀ṣẹ̀ rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì ní agbára ‘ṣe/mú jẹ́,’ ṣùgbọ́n àyíká ń sọ nípa ìgbéga Jésù. Ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ pé ìwà àtọ̀runwá rẹ̀ bẹ̀rẹ̀ tàbí yí padà nígbà náà kún ọ̀rọ̀.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí Pétérù ń bá ‘gbogbo ilé Ísírẹ́lì’ sọ̀rọ̀, ìtumọ̀ oyè ẹni àmì òróró náà ṣe kedere ní ‘Mèsáyà’; àlàyé ìsàlẹ̀ fi àṣàyàn ‘Kristi’ hàn.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà ní ọlá, ó ṣe kedere fún òǹkàwé lásán, ó sì pa ìtẹnumọ́ Pétérù mọ́.
