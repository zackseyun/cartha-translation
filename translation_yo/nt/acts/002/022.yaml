revisions:
- from: '“Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ gbọ́ ọ̀rọ̀ wọ̀nyí: Jésù ará Násárẹ́tì[a], ọkùnrin kan tí Ọlọ́run fi iṣẹ́ agbára, iṣẹ́ ìyanu àti àmì jẹ́rìí rẹ̀ fún yín—àwọn ohun tí Ọlọ́run ṣe nípasẹ̀ rẹ̀ láàárín yín[b], gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ̀—”'
  to: '“Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ gbọ́ ọ̀rọ̀ wọ̀nyí: Jésù ará Násárẹ́tì[a], ọkùnrin kan tí Ọlọ́run fi àwọn iṣẹ́ agbára, iṣẹ́ ìyanu, àti àwọn àmì fi hàn fún yín—àwọn tí Ọlọ́run ṣe nípasẹ̀ rẹ̀ láàárín yín[b], gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ̀—”'
  rationale: The revision replaces only the unclear attestation construction. “Ọlọ́run fi … fi hàn fún yín” conveys that God publicly demonstrated Jesus to the audience by miracles, wonders, and signs. The following relative clause continues to identify God as the one who performed those acts through Jesus. The footnotes are adjusted to match the revised plural wording and to state lexical alternatives without adding interpretive claims.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the masculine direct address, Jesus' Nazarene designation, his identification as a man, God's agency in the works, the threefold works/wonders/signs formulation, the location among the audience, and the emphatic appeal to their own knowledge. However, “fi … jẹ́rìí rẹ̀ fún yín” is not a clear or idiomatic Yoruba expression for God's public attestation of Jesus and can be read awkwardly as testimony concerning him rather than his being demonstrated to the audience.
  naturalness: The overall register is clear Standard Yoruba. Recasting the attestation clause with “fi hàn fún yín” makes the syntax natural and explicitly preserves the sense that God demonstrated/accredited Jesus by the listed acts. Using plural forms for the three acts also reads more smoothly in this enumerated context.
  terminology: “Ẹ̀yin ọkùnrin Ísírẹ́lì,” “Jésù ará Násárẹ́tì,” “ọkùnrin kan,” and “láàárín yín” are suitable. “Àwọn iṣẹ́ agbára, iṣẹ́ ìyanu, àti àwọn àmì” preserves the Greek triad without conflating δύναμις with τέρατα.
  issues:
  - severity: medium
    issue: The phrase “tí Ọlọ́run fi iṣẹ́ agbára, iṣẹ́ ìyanu àti àmì jẹ́rìí rẹ̀ fún yín” is syntactically and idiomatically unclear.
    rationale: ἀποδεδειγμένον means that Jesus was publicly demonstrated or attested by God to the hearers. In Yoruba, “fi … fi hàn fún yín” clearly expresses that God demonstrated him to them by means of these works, while retaining God as agent and the audience-directed force of εἰς ὑμᾶς.
  revised_text: '“Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ gbọ́ ọ̀rọ̀ wọ̀nyí: Jésù ará Násárẹ́tì[a], ọkùnrin kan tí Ọlọ́run fi àwọn iṣẹ́ agbára, iṣẹ́ ìyanu, àti àwọn àmì fi hàn fún yín—àwọn tí Ọlọ́run ṣe nípasẹ̀ rẹ̀ láàárín yín[b], gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ̀—”'
