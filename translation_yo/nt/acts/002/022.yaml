id: ACT.2.22
reference: Acts 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: yo
  text: '“Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ gbọ́ ọ̀rọ̀ wọ̀nyí: Jésù ará Násárẹ́tì[a], ọkùnrin kan tí Ọlọ́run fi àwọn iṣẹ́ agbára, iṣẹ́ ìyanu, àti àwọn àmì fi hàn fún yín—àwọn tí Ọlọ́run ṣe nípasẹ̀ rẹ̀ láàárín yín[b], gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ̀—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “Jésù ọmọ Násárẹ́tì” tàbí “Jésù ará Násárẹ́nì.” Ọ̀rọ̀ Gíríìkì náà, Ναζωραῖος, lè ní àwọn ìtumọ̀ àdánidá wọ̀nyí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé “àwọn iṣẹ́ ìyanu, ohun ìyanu, àti àmì.” Ọ̀rọ̀ Gíríìkì δυνάμεσι lè túmọ̀ ní ti gidi sí “àwọn agbára” tàbí “àwọn iṣẹ́ agbára,” ó sì lè tọ́ka sí iṣẹ́ ìyanu nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin Ísírẹ́lì
  rationale: Ó pa ìpè tààrà àti akọ tí ἄνδρες ní mọ́, ó sì so wọ́n mọ́ Ísírẹ́lì gẹ́gẹ́ bí Ἰσραηλῖται ti ṣe.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: ẹ gbọ́ ọ̀rọ̀ wọ̀nyí
  rationale: Ọ̀rọ̀ àṣẹ náà ń pe àwọn olùgbọ́ láti fiyè sí ohun tí a fẹ́ sọ, nígbà tí ọ̀rọ̀ wọ̀nyí dúró nítòsí λόγους τούτους.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésù ará Násárẹ́tì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánimọ̀ ẹni nípa ìlú rẹ̀; àlàyé ìsàlẹ̀ fi àṣàyàn akọ́lé náà hàn.
- source_word: ἄνδρα
  choice: ọkùnrin kan
  rationale: Ó pa ìtumọ̀ akọ àti ìjẹ́-ènìyàn Jésù tí ọ̀rọ̀ Gíríìkì sọ ní kedere mọ́.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: tí Ọlọ́run ... jẹ́rìí rẹ̀ fún yín
  rationale: Ó ṣàfihàn Ọlọ́run gẹ́gẹ́ bí olùṣe ìjẹ́rìí gbangba náà, ó sì pa ìdarí εἰς ὑμᾶς mọ́ nínú fún yín.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: iṣẹ́ agbára, iṣẹ́ ìyanu àti àmì
  rationale: Iṣẹ́ agbára túmọ̀ δύναμις ní kedere láì sọ ọ́ di iṣẹ́ ìyanu lásán; iṣẹ́ ìyanu àti àmì sì pa àwọn ọ̀rọ̀ mẹ́ta náà sọ́tọ̀.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: àwọn ohun tí Ọlọ́run ṣe nípasẹ̀ rẹ̀
  rationale: Ó jẹ́ kí Ọlọ́run jẹ́ olùṣe, Jésù sì jẹ́ ẹni tí iṣẹ́ náà gba ọ̀dọ̀ rẹ̀ kọjá, gẹ́gẹ́ bí Gíríìkì ṣe sọ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: láàárín yín
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ohun tó ṣẹlẹ̀ ní àárín àwọn olùgbọ́.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ̀
  rationale: Ẹ̀yin fúnra yín pa ìtẹnumọ́ αὐτοὶ mọ́.
theological_decisions:
- issue: Ìtumọ̀ Kristọ́lójì ti ἄνδρα
  choice: Pa “ọkùnrin kan” mọ́ nínú ẹsẹ̀ pàtàkì.
  alternative: ẹni kan
  rationale: Gíríìkì sọ akọ ní kedere, ó sì jẹ́rìí sí ìjẹ́-ènìyàn Jésù; fífi ọ̀rọ̀ tí kò ní akọ rọ́pò rẹ̀ yóò dín agbára gbólóhùn náà kù.
- issue: Ẹni tó ṣe àwọn iṣẹ́ agbára náà
  choice: 'Ṣe Ọlọ́run ní olùṣe: “àwọn ohun tí Ọlọ́run ṣe nípasẹ̀ rẹ̀.”'
  alternative: àwọn ohun tí ó ṣe láàárín yín
  rationale: ὁ θεὸς ni olùṣe tí a dárúkọ, δι’ αὐτοῦ sì fi Jésù hàn gẹ́gẹ́ bí ẹni tí iṣẹ́ náà gba ọ̀dọ̀ rẹ̀ kọjá. Èyí pa ìfihàn àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ̀yin ọkùnrin Ísírẹ́lì” pa ìpè akọ mọ́; “iṣẹ́ agbára, iṣẹ́ ìyanu àti àmì” pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì mẹ́ta mọ́. Àmì gígùn ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ̀ tó tẹ̀ lé e.
