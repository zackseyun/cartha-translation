id: ACT.2.23
reference: Acts 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: yo
  text: Ọkùnrin yìí, ẹni tí a fi lé lọ́wọ́ gẹ́gẹ́ bí ète tí a ti pinnu àti ìmọ̀ ṣáájú Ọlọ́run, ni ẹ̀yin, nípasẹ̀ ọwọ́ àwọn aláìlófin[a], kàn án mọ́ àgbélébùú, tí ẹ sì pa á[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gígùn ọ̀rọ̀: “nípasẹ̀ ọwọ́ àwọn aláìlófin.” Ọ̀rọ̀ Gíríìkì náà lo “ọwọ́” ní ẹyọ. A tún lè sọ pé, “nípasẹ̀ àwọn aláìlófin.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ mú un kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka náà ń tọ́ka sí Jésù nínú ọ̀rọ̀ Pétérù; ‘Ọkùnrin yìí’ jẹ́ Yorùbá àdánidá tí ó sì pa agbára atọ́ka náà mọ́.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: gẹ́gẹ́ bí ète tí Ọlọ́run ti pinnu
  rationale: Ó fi hàn pé ohun náà ṣẹlẹ̀ ní ìbámu pẹ̀lú ète tí a ti fi ìdí rẹ̀ múlẹ̀, láìlo èdè àtijọ́ tàbí láìtúmọ̀ rẹ̀ sí ẹ̀kọ́ ìsìn kan pàtó.
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: àti ìmọ̀tẹ́lẹ̀ rẹ̀
  rationale: ‘Ìmọ̀tẹ́lẹ̀’ sọ ìmọ̀ ṣáájú di mímọ́ ní Yorùbá; arọ́pò-orúkọ ‘rẹ̀’ tọ́ka sí Ọlọ́run, ó sì jẹ́ kí ète àti ìmọ̀tẹ́lẹ̀ jẹ́ tirẹ̀.
- source_word: ἔκδοτον
  choice: ẹni tí a fi lé lọ́wọ́
  rationale: Ó mú ìtumọ̀ fífi ẹni kan lé ẹlòmíràn lọ́wọ́ jáde, ṣùgbọ́n kò fi ẹni tí ó ṣe fífi-lélọ́wọ́ náà kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: διὰ χειρὸς ἀνόμων
  choice: nípasẹ̀ ọwọ́ àwọn aláìlófin
  rationale: ‘Nípasẹ̀’ pa ìtumọ̀ aṣojú tàbí irinṣẹ́ mọ́; ‘ọwọ́’ tẹ̀ lé ẹyọ kan nínú Gíríìkì, ‘àwọn aláìlófin’ sì pa ìṣòro ìtumọ̀ mọ́ láàárín àwọn tí kò tẹ̀ lé òfin àti àwọn tí kò sí lábẹ́ òfin Júù.
- source_word: προσπήξαντες
  choice: ni ẹ kàn mọ́ àgbélébùú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílu tàbí kíkàn mọ́ ohun kan; àyíká ikú Jésù fàyè gba ‘àgbélébùú’ láti mú irú ìkànmọ́ náà ṣe kedere.
- source_word: ἀνείλατε
  choice: tí ẹ sì pa á
  rationale: Ó jẹ́ ọ̀rọ̀ tààrà, tó lágbára, fún ‘ẹ pa á’ tàbí ‘ẹ mú un kú,’ ó sì pa ẹ̀sùn Pétérù mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín àṣẹ Ọlọ́run àti ojúṣe ènìyàn
  choice: A sọ pé fífi Jésù lé lọ́wọ́ wà ní ìbámu pẹ̀lú ète tí Ọlọ́run ti pinnu àti ìmọ̀tẹ́lẹ̀ rẹ̀, síbẹ̀ a fi ‘ẹ̀yin fúnra yín ... ni ẹ ... pa á’ dá àwọn olùgbọ́ lẹ́bi.
  alternative: A lè sọ ọ́ lọ́nà tí yóò dín ìpinnu Ọlọ́run kù, tàbí tí yóò fi gbogbo ẹ̀bi lé àwọn aláìlófin nìkan.
  rationale: 'Gíríìkì fi àwọn méjèèjì múlẹ̀: ète àti ìmọ̀tẹ́lẹ̀ Ọlọ́run, àti ojúṣe àwọn tí Pétérù ń bá sọ̀rọ̀. Ìtumọ̀ náà kò yanju ìforígbárí yìí sí ẹ̀kọ́ ìsìn kan pàtó.'
- issue: Ta ni ‘àwọn aláìlófin’ (ἀνόμων)?
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn aláìlófin.’
  alternative: ‘Àwọn ará Róòmù’ tàbí ‘àwọn Kèfèrí.’
  rationale: Àyíká lè tọ́ka sí àwọn aṣekúpani ará Róòmù tàbí àwọn tí kò sí lábẹ́ òfin Júù, ṣùgbọ́n Gíríìkì kò dárúkọ wọn ní tààrà; nítorí náà, a pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àmì ohùn kún un níbi tí ó bá yẹ. Ẹ̀ka ìtẹnumọ́ ‘ẹ̀yin fúnra yín ... ni ẹ’ ń mú ẹ̀sùn Pétérù hàn kedere, nígbà tí ‘a fi lé lọ́wọ́’ kò sọ ẹni tí ó fi Jésù lé lọ́wọ́ ju ohun tí orísun sọ lọ.
