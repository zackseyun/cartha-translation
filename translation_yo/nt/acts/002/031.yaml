id: ACT.2.31
reference: Acts 2:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: yo
  text: Ó ti rí èyí tẹ́lẹ̀, ó sì sọ̀rọ̀ nípa àjíǹde Mèsáyà[a] náà pé a kò fi í sílẹ̀ ní Hédíìsì,[b] bẹ́ẹ̀ ni ẹran ara rẹ̀ kò rí ìbàjẹ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríki: Christos, ìyẹn ẹni àmì-òróró. A tún máa ń túmọ̀ rẹ̀ sí “Kristi.”'
    reason: alternative_reading
  - marker: b
    text: “Hédíìsì” ni ibùgbé àwọn òkú; kì í ṣe dandan pé ó ń tọ́ka sí ibi ìdájọ́ ìkẹyìn. Gbólóhùn Gíríki náà tún lè jẹ́ “a kò fi í sílẹ̀ sínú Hédíìsì”; èrò rẹ̀ ni pé a kò kọ̀ ọ́ sílẹ̀ ní ibùgbé àwọn òkú.
    reason: cultural_note
  - marker: c
    text: Tàbí “ẹran ara rẹ̀ kò jẹrà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Nítorí ó ti rí èyí tẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó fi hàn pé Dáfídì mọ ohun tí yóò ṣẹlẹ̀ kí ó tó sọ àsọtẹ́lẹ̀ náà. A fi “èyí” kún un láti mú gbolohun Yorùbá ṣe kedere gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń tọ́ka sí.
- source_word: ἐλάλησεν
  choice: ó sọ̀rọ̀
  rationale: Èyí mú ìtumọ̀ λαλέω gẹ́gẹ́ bí ‘sọ̀rọ̀’ dúró, ó sì bá ọ̀rọ̀ àsọtẹ́lẹ̀ mu.
- source_word: περὶ τῆς ἀναστάσεως
  choice: nípa àjíǹde
  rationale: “Nípa” jẹ́ ọ̀nà àdánidá láti túmọ̀ περί pẹ̀lú genitive, “àjíǹde” sì sọ dídìde kúrò nínú òkú ní ṣókí.
- source_word: τοῦ χριστοῦ
  choice: Mèsáyà
  rationale: Ní àyíká ọ̀rọ̀ yìí Χριστός jẹ́ oyè ẹni àmì-òróró tí Ìwé Mímọ́ ti ṣèlérí, kì í ṣe orúkọ lásán.
- source_word: οὔτε ἐγκατελείφθη
  choice: a kò fi í sílẹ̀
  rationale: Èyí túmọ̀ passive ἐγκαταλείπω ní èdè Yorùbá àdánidá, ó sì mú èrò pé a kò kọ̀ ọ́ sílẹ̀ dúró.
- source_word: εἰς ᾅδην
  choice: ní Hédíìsì
  rationale: “Hédíìsì” pa ọ̀rọ̀ Gíríki mọ́ láì da a pọ̀ mọ́ ibi ìdájọ́ ìkẹyìn; “ní” jẹ́ àdánidá ní Yorùbá pẹ̀lú “fi sílẹ̀,” bí ó tilẹ̀ jẹ́ pé εἰς lè ní ìtumọ̀ ‘sí/sínú.’
- source_word: ἡ σὰρξ αὐτοῦ
  choice: ara rẹ̀
  rationale: Níhìn-ín σάρξ ń tọ́ka sí ara Mèsáyà gan-an, kì í ṣe ìwà ẹlẹ́ṣẹ̀. “Ara rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún jíjẹrà òkú.
- source_word: εἶδεν διαφθοράν
  choice: kò rí ìbàjẹ́
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríki ‘rí ìbàjẹ́’ mọ́; “ìbàjẹ́” lè tọ́ka sí jíjẹrà ara nínú àyíká yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àríyànjiyàn Pétérù láti inú Ìwé Mímọ́ mú ìtumọ̀ oyè ẹni àmì-òróró hàn gbangba; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ìbílẹ̀ “Kristi” mọ́.
- issue: Bí a ṣe túmọ̀ ᾅδης
  choice: Hédíìsì
  alternative: ibùgbé àwọn òkú
  rationale: Yíyan “Hédíìsì” pa ọ̀rọ̀ pàtó Gíríki mọ́, ó sì yẹra fún dídá a pọ̀ mọ́ ibi ìyà tàbí ìdájọ́ ìkẹyìn.
- issue: Bí a ṣe túmọ̀ σάρξ
  choice: ara
  alternative: ẹran ara
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti ara gidi. “Ara” ṣe àfihàn èyí ní Yorùbá àdánidá, nígbà tí “ẹran ara” lè dun bí ẹni pé apá kan ara nìkan ni a ń sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́wọ̀, tí ó sì yẹ fún kíkà ní gbangba. A lo “Mèsáyà” láti mú oyè náà hàn, “Hédíìsì” láti pa ìyàtọ̀ ọ̀rọ̀ Gíríki mọ́, àti “ara” gẹ́gẹ́ bí ìtumọ̀ àdánidá fún σάρξ ní àyíká jíjẹrà òkú.
