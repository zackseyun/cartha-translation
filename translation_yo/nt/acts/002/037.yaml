  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, ó gún wọ́n lọ́kàn[a], wọ́n sì sọ fún Peteru àti àwọn àpọ́sítélì yòókù pé, “Kí ni kí a ṣe, ẹ̀yin arákùnrin[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kan wọ́n lọ́kàn gidigidi.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ìdálẹ́bi ọkàn tàbí ìbànújẹ́ inú tó lágbára, bí ohun mímú ṣe gún ẹni.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin,” ìpè àṣà kan tó lè túmọ̀ sí “ẹ̀yin arákùnrin” tàbí “ẹ̀yin arákùnrin àti arábìnrin,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Aorist participle náà fi ìdáhùn wọn sí ọ̀rọ̀ Peteru tó ṣáájú hàn; “èyí” wá láti inú àyíká ọ̀rọ̀. A kò fi àmì ìtẹ̀síwájú míì kún δέ, nítorí ìsopọ̀ gbolohun náà ti ṣe iṣẹ́ rẹ̀ ní Yorùbá.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: ọ̀rọ̀ náà gún wọn lọ́kàn
  rationale: Èyí pa àwòrán ohun mímú tó ń gún ènìyàn mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbànújẹ́ tàbí ìdálẹ́bi ọkàn tó jinlẹ̀.
- source_word: εἶπόν τε
  choice: wọ́n sì sọ
  rationale: “Sì” so ìṣe yìí mọ́ ìṣe tó ṣáájú lọ́nà àdánidá, nígbà tí “sọ” túmọ̀ λέγω láì yí i sí “béèrè.”
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: fún Peteru àti àwọn àpọ́sítélì yòókù
  rationale: “Àwọn ... yòókù” fi hàn pé Peteru ni a mẹ́nu kàn lọ́tọ̀, lẹ́yìn náà ni àwọn àpọ́sítélì tó kù.
- source_word: Τί ποιήσωμεν
  choice: Kí ni kí a ṣe
  rationale: Ilana “kí ... ṣe” sọ ìbéèrè oníṣiyèméjì nípa ohun tó yẹ kí wọ́n ṣe ní Yorùbá òde òní.
- source_word: ἄνδρες ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa ọ̀rọ̀ ìbátan ἀδελφοί àti ìpè ọ̀wọ̀ mọ́, láì ṣe àtúnṣe akọ sí abo nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: 'Ìpè tí ó lo akọ: ἄνδρες ἀδελφοί'
  choice: ẹ̀yin arákùnrin
  alternative: ẹ̀yin arákùnrin àti arábìnrin; ẹ̀yin ọkùnrin arákùnrin
  rationale: Gíríìkì jẹ́ akọ ní ìlànà girama, ṣùgbọ́n ó lè jẹ́ ìpè àṣà fún àwùjọ tí obìnrin wà nínú rẹ̀. Ọ̀rọ̀ pàtàkì pa fọ́ọ̀mù akọ mọ́; àlàyé ìsàlẹ̀ fi àǹfààní ìtumọ̀ tó gbòòrò hàn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye. “Ọ̀rọ̀ náà gún wọn lọ́kàn” jẹ́ àdánidá ju ìtumọ̀ líle bí “a gún wọn sí ọkàn” lọ, síbẹ̀ ó pa àwòrán orísun mọ́.
