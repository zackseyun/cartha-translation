source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: yo
  text: Nítorí Dáfídì sọ nípa rẹ̀ pé, “Mo máa ń rí Olúwa[b] níwájú mi nígbà gbogbo[a], nítorí ó wà ní ẹ̀gbẹ́ ọ̀tún mi, kí n má bàa mì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, ‘Mo rí Olúwa níwájú mi nígbà gbogbo ṣáájú.’ Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ ‘rí ṣáájú’ ní àwọn àyíká kan, ṣùgbọ́n àwọn gbólóhùn tó yí i ká níbí ń ṣe ìtìlẹ́yìn fún ìtumọ̀ rírí, tàbí mímú, Olúwa níwájú ẹni nígbà gbogbo.
    reason: lexical_alternative
  - marker: b
    text: Pétérù ń fa ọ̀rọ̀ Sáàmù 16:8 yọ. Nínú èdè Hébérù ti Sáàmù náà, orúkọ àtọ̀runwá náà ni a máa ń túmọ̀ sí ‘OLÚWA’ nínú àwọn ìtumọ̀ Gẹ̀ẹ́sì.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: sọ nípa rẹ̀
  rationale: Nínú ọ̀nà tí a gbà mú ọ̀rọ̀ àyọlò wọlé níbí, εἰς αὐτόν túmọ̀ sí sísọ nípa ẹni kan, kì í ṣe sísọ tààrà sí i.
- source_word: Προορώμην
  choice: Mo máa ń rí
  rationale: Ìṣe aláìparí náà fi ìṣe tí ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀ hàn. Pẹ̀lú ‘níwájú mi nígbà gbogbo,’ ‘Mo máa ń rí’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìtẹ̀síwájú mọ́ láì sọ ọ́ di àsọtẹ́lẹ̀.
- source_word: κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó yẹ fún κύριος ní àyíká yìí; a kò fi ìdánimọ̀ olùtọ́ka tí a túmọ̀ sí kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐνώπιόν μου
  choice: níwájú mi
  rationale: Ó pa àwòrán ipò àti ìbáṣepọ̀ inú ọ̀rọ̀ Sáàmù mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: διὰ παντός
  choice: nígbà gbogbo
  rationale: Gbólóhùn náà túmọ̀ sí ní gbogbo ìgbà tàbí láìdáwọ́ dúró; ‘nígbà gbogbo’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἐκ δεξιῶν μού
  choice: ní ọwọ́ ọ̀tún mi
  rationale: Ó pa àkàwé ẹni tí ó dúró ní ẹ̀gbẹ́ ọ̀tún ẹni mìíràn, gẹ́gẹ́ bí olùrànlọ́wọ́ àti olùdáàbòbò, mọ́ láì ṣàlàyé àkàwé náà sínú ẹsẹ̀.
- source_word: ἵνα μὴ σαλευθῶ
  choice: kí n má bàa mì
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ète tàbí àbájáde àti àkàwé mímì kúrò ní ìdúróṣinṣin mọ́ ní ọ̀nà Yorùbá tí ó rọrùn.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú àyọlò Sáàmù bí Pétérù ṣe lò ó
  choice: Pa ‘Olúwa’ mọ́ láì ṣe àlàyé ẹni tí ó jẹ́ nínú ẹsẹ̀
  alternative: YHWH tàbí Mèsáyà
  rationale: Pétérù lo Sáàmù náà nípa Kristi, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tí a fa yọ sọ κύριον. Ìtumọ̀ náà pa ọ̀rọ̀ àyọlò àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, kò sì fi ìtumọ̀ onítúmọ̀ rọ́pò rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. ‘Mo máa ń rí’ àti ‘nígbà gbogbo’ jọ pa ìṣe tí ń bá a lọ mọ́; ‘kí n má bàa mì’ sì pa àkàwé ìdúróṣinṣin mọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
