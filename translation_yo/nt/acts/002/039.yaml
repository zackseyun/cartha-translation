revisions:
- from: Nítorí ìlérí náà wà fún yín, fún àwọn ọmọ yín, àti fún gbogbo àwọn tó jìnnà réré[a]—gbogbo ẹni tí Olúwa Ọlọ́run wa bá pè.[b]
  to: Nítorí ìlérí náà wà fún yín, fún àwọn ọmọ yín, àti fún gbogbo àwọn tó jìnnà[a], àní gbogbo àwọn tí Olúwa Ọlọ́run wa bá pè.[b]
  rationale: The revision removes an unwarranted intensifier from “far off,” uses an idiomatic Yorùbá construction that preserves the comprehensive yet qualified scope of ὅσους ἂν προσκαλέσηται, and makes the footnote a closer explanation of the Greek without importing a theological account of the call.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the explanatory force of γάρ, the threefold scope of the promise, and God's calling without adding “to himself.” However, “jìnnà réré” intensifies the Greek “far off” beyond what is stated. The final qualifier is better expressed as a direct qualification of the distant group.
  naturalness: The verse is generally clear Standard Yorùbá. Replacing the dash construction and singular “gbogbo ẹni” with “àní gbogbo àwọn tí … bá pè” gives a more idiomatic, publicly readable rendering.
  terminology: “Ìlérí náà,” “àwọn ọmọ yín,” and “Olúwa Ọlọ́run wa” are appropriate. The footnote on the calling should describe the Greek form rather than paraphrase it as the arrival of a call.
  issues:
  - severity: medium
    issue: “tó jìnnà réré” adds an intensifying sense.
    rationale: μακράν denotes distance/far-off status but does not contain an equivalent of “réré” (“very”).
  - severity: medium
    issue: Footnote b paraphrases the divine call as “àwọn tí ìpè Ọlọ́run bá dé.”
    rationale: The Greek says those whom the Lord our God may call/calls; “ìpè ... bá dé” changes the verbal formulation and can suggest a different nuance.
  - severity: low
    issue: “gbogbo ẹni” is less natural here than a plural relative construction.
    rationale: The referent is a comprehensive, indefinite plural group; “gbogbo àwọn tí” is smoother and corresponds well to the Greek.
  revised_text: Nítorí ìlérí náà wà fún yín, fún àwọn ọmọ yín, àti fún gbogbo àwọn tó jìnnà[a], àní gbogbo àwọn tí Olúwa Ọlọ́run wa bá pè.[b]
