id: ACT.2.39
reference: Acts 2:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: yo
  text: Nítorí ìlérí náà wà fún yín, fún àwọn ọmọ yín, àti fún gbogbo àwọn tó jìnnà[a], àní gbogbo àwọn tí Olúwa Ọlọ́run wa bá pè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn tó wà ní ọ̀nà jíjìn.” Gbólóhùn náà lè tọ́ka sí àwọn tó jìnnà ní ibi, àwọn tó jìnnà nípa ipò májẹ̀mú, tàbí àwọn méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà, “iye àwọn tí Olúwa Ọlọ́run wa bá pè.” Ọ̀rọ̀ náà ń fi àwùjọ tí kò ní iye pàtó hàn: gbogbo àwọn tí Olúwa Ọlọ́run wa bá pè.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία
  choice: ìlérí náà
  rationale: “Ìlérí” túmọ̀ nọ́ńbà náà ní tààrà; àfikún “náà” fi article Gíríìkì hàn, láì sọ ọ́ di “ẹ̀bùn tí a ṣèlérí.”
- source_word: τέκνοις
  choice: àwọn ọmọ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àwọn ọmọ tàbí ìran àwọn olùgbọ́, láì fi ọjọ́-orí kan pàtó sí i.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: gbogbo àwọn tó jìnnà réré
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí jíjìnnà ní ibi tàbí jíjìnnà nípa ipò májẹ̀mú; “tó jìnnà réré” pa ààyè ìtumọ̀ méjèèjì mọ́.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: gbogbo ẹni tí ... bá pè
  rationale: Àkójọpọ̀ “gbogbo ẹni” àti “bá pè” sọ àwùjọ aláìníye pàtó tí gbólóhùn Gíríìkì ń tọ́ka sí, ó sì bá èdè Yorùbá àdánidá mu. A kò ṣàfikún “sí ara rẹ̀,” nítorí kò ṣe kedere nínú ọ̀rọ̀ náà.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Olúwa Ọlọ́run wa
  rationale: Èyí pa orúkọ oyè “Olúwa,” ìdánimọ̀ “Ọlọ́run,” àti arọ́pò-orúkọ “wa” mọ́ ní tààrà.
- source_word: γάρ
  choice: Nítorí
  rationale: “Nítorí” fi ìbáṣepọ̀ ìdí tàbí àlàyé tó so ẹsẹ yìí mọ́ ọ̀rọ̀ Pétérù tó ṣáájú hàn.
theological_decisions:
- issue: Ìtumọ̀ àwọn “tó jìnnà réré”
  choice: A fi gbólóhùn náà sílẹ̀ ní ọ̀nà gbígbòòrò, láì sọ pé àwọn Júù tó wà ní ilẹ̀ òkèèrè nìkan ni tàbí àwọn Kèfèrí nìkan.
  alternative: Ó lè tọ́ka sí àwọn tó jìnnà ní ibi, àwọn tó jìnnà nípa májẹ̀mú, tàbí àwọn méjèèjì.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò fi dandan mú ká yan ọ̀kan ṣoṣo; ìtumọ̀ náà pa àìdánilójú tó wà nínú orísun mọ́.
- issue: Irú ìpè Ọlọ́run nínú προσκαλέσηται
  choice: “tí Olúwa Ọlọ́run wa bá pè”
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìpè tó mú ènìyàn wá dájúdájú tàbí gẹ́gẹ́ bí ìkésíni gbogbogbò.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé Ọlọ́run ń pè, ṣùgbọ́n kò ṣàlàyé bí ìpè náà ṣe ń ṣiṣẹ́ ní ẹsẹ yìí; nítorí náà, a kò fi ẹ̀kọ́ ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu fún kíkà ní gbangba. “Wà fún yín” pa ìṣètò orísun mọ́, nígbà tí “gbogbo ẹni ... bá pè” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn Gíríìkì aláìníye pàtó.
