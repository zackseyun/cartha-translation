  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: yo
  text: Ṣùgbọ́n olórí àlùfáà dìde, pẹ̀lú gbogbo àwọn tí ó wà pẹ̀lú rẹ̀—èyí tí í ṣe ẹgbẹ́ àwọn Sadusí[a]—ìlara sì kún wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀ya àwọn Sadusí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹgbẹ́, ilé-ẹ̀kọ́ èrò, tàbí ẹ̀ya ìsìn kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “owú.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìtara,” ṣùgbọ́n àyíká ọ̀rọ̀ yìí fi ìtumọ̀ búburú hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: dìde
  rationale: Ọ̀rọ̀ náà jẹ́ àpólà ìṣe tí a lò láti bẹ̀rẹ̀ ìgbésẹ̀ pàtàkì; “dìde” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìtàn náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ sí ìtakò hàn lẹ́yìn ìtẹ́wọ́gbà tí àwọn aposteli rí ṣáájú.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ipò àlùfáà gíga jù lọ.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: gbogbo àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Ó pa ìtumọ̀ ìbáṣepọ̀ àti ìfọwọ́sowọ́pọ̀ mọ́ láì sọ ipò wọn ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: èyíinì ni ẹgbẹ́ àwọn Sadusí
  rationale: Àpólà náà ń ṣàlàyé àwọn tí ó wà pẹ̀lú olórí àlùfáà. “Ẹgbẹ́” yẹra fún ìtumọ̀ ẹ̀kọ́ èké tí “ẹ̀ya ìsìn” tàbí ọ̀rọ̀ tó dà bí ‘heresy’ lè mú wọlé.
- source_word: ἐπλήσθησαν
  choice: kún wọn
  rationale: Ìtumọ̀ Yorùbá yìí jẹ́ àdánidá fún èdè Gíríìkì tó túmọ̀ sí pé ìmọ̀lára kan kún ènìyàn.
- source_word: ζήλου
  choice: ìlara
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìtara, nínú àyíká ìtakò yìí ó ní ìtumọ̀ búburú ti owú tàbí ìlara.
theological_decisions:
- issue: Ìtumọ̀ αἵρεσις
  choice: ẹgbẹ́
  alternative: ẹ̀ya ìsìn
  rationale: Níhìn-ín ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ kan láàárín ẹ̀sìn Júù, kì í ṣe dandan pé ó túmọ̀ sí ẹ̀kọ́ èké. “Ẹgbẹ́” pa ìtumọ̀ àwùjọ náà mọ́ láì fi ìdájọ́ ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún un.
- issue: Ìtumọ̀ ζῆλος nínú àyíká yìí
  choice: ìlara
  alternative: ìtara; owú
  rationale: Ìtakò wọn sí àwọn aposteli ń tọ́ka sí ìmọ̀lára búburú. “Ìlara” jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ààyè ìtumọ̀ “ìtara” àti “owú” mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Sadusí” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní Yorùbá.
