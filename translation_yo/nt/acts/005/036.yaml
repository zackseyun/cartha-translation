id: ACT.5.36
reference: Acts 5:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: yo
  text: Nítorí ṣáájú àwọn ọjọ́ wọ̀nyí, Téúdà dìde, ó ń sọ pé ẹni pàtàkì kan ni òun[a]. Àwọn ọkùnrin tó fẹ́rẹ̀ẹ́ jẹ́ irinwó darapọ̀ mọ́ ọn[b]. Wọ́n pa á, gbogbo àwọn tí ó ti mú gbà á gbọ́[c] sì tú ká, wọ́n sì di asán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń sọ pé ẹni ńlá kan ni òun.” Àkànlò-èdè Gíríìkì náà túmọ̀ sí pé ó fi ara rẹ̀ hàn gẹ́gẹ́ bí ẹni tí ó ní pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fi ara mọ́ ọn” tàbí “kóra jọ sọ́dọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà sí i, “gbogbo àwọn tí ó jẹ́ pé ó ti yí wọn lọ́kàn”; tàbí, “gbogbo àwọn tí ó tẹ̀ lé e.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Nítorí ṣáájú àwọn ọjọ́ wọ̀nyí
  rationale: “Ṣáájú” fi àkókò tí πρό pẹ̀lú ọ̀rọ̀ inú genitive tọ́ka sí hàn; “Nítorí” sì pa ipa γάρ mọ́ gẹ́gẹ́ bí àlàyé nínú ìjiyàn Gàmálíẹ́lì.
- source_word: ἀνέστη
  choice: dìde
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí bí olórí tàbí ẹgbẹ́ kan ṣe yọ síta, kì í ṣe àjíǹde kúrò nínú òkú. “Dìde” pa àwòrán àti agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Θευδᾶς
  choice: Téúdà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀, ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: ó ń sọ pé ẹni pàtàkì kan ni òun
  rationale: Àkànlò-èdè Gíríìkì náà túmọ̀ sí pé Téúdà ń fi ara rẹ̀ hàn gẹ́gẹ́ bí ẹni tí ó ní ipò tàbí pàtàkì; yíyàn yìí jẹ́ èdè Yorùbá àdánidá láìsọ irú ipò tí ó ń béèrè fún ara rẹ̀.
- source_word: ᾧ προσεκλίθη
  choice: darapọ̀ mọ́ ọn
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe àwọn ènìyàn tí wọ́n tẹ̀ lé olórí kan, tí wọ́n sì fi ara mọ́ ẹgbẹ́ rẹ̀. “Darapọ̀ mọ́ ọn” ṣe èyí ní kedere àti ní èdè òde òní.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: Iye àwọn ọkùnrin bí irinwó
  rationale: “Àwọn ọkùnrin” pa ìtọ́ka pàtó sí akọ mọ́; “bí irinwó” sì fi hàn pé iye náà jẹ́ àfojúsùn, gẹ́gẹ́ bí ὡς.
- source_word: ὃς ἀνῃρέθη
  choice: Wọ́n pa á
  rationale: ἀναιρέω ní àyíká yìí túmọ̀ sí pípa ẹni. Èdè Yorùbá sábà máa ń lo ẹnì-kẹta ọ̀pọ̀ aláìlórúkọ láti sọ ìṣe tí Gíríìkì gbé kalẹ̀ ní passive.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: gbogbo àwọn tí ó gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: Yíyàn yìí fi hàn pé Téúdà ti yí wọn lọ́kàn, wọ́n sì gba ohun tí ó sọ; àlàyé ìsàlẹ̀ fi ìtumọ̀ passive Gíríìkì hàn ní kíkún.
- source_word: διελύθησαν
  choice: tú ká
  rationale: Ó ṣàpèjúwe bí àwọn ọmọlẹ́yìn náà ṣe fọ́n ká àti bí ẹgbẹ́ náà ṣe tú, ní ọ̀nà tí ó jẹ́ àdánidá ní Yorùbá.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: wọ́n sì wá di asán
  rationale: Àkànlò-èdè yìí fi hàn pé ẹgbẹ́ àti ète wọn já sí asán. Yíyàn náà pa ìṣubú pátápátá tí Gíríìkì sọ mọ́.
theological_decisions:
- issue: Ìròyìn nípa Téúdà nínú ọ̀rọ̀ Gàmálíẹ́lì
  choice: A túmọ̀ ọ́ tààrà gẹ́gẹ́ bí àpẹẹrẹ tí Gàmálíẹ́lì lò nínú ìjiyàn rẹ̀.
  alternative: Láti fi ọ̀rọ̀ àìdánilójú kún un tàbí láti ṣàtúnṣe ìtọ́ka ìtàn náà kí ó lè bá àtúnyẹ̀wò ìtàn láti ibòmíràn mu.
  rationale: Ẹsẹ̀ náà gbé àpẹẹrẹ yìí kalẹ̀ nínú ọ̀rọ̀ Gàmálíẹ́lì. Ìtumọ̀ gbọ́dọ̀ tẹ̀ lé Gíríìkì tí a ní, láìfi ìdájọ́ nípa ìtàn tàbí ìgbìyànjú láti mú àwọn ìròyìn ibòmíràn bára mu sínú ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo gbólóhùn kúkúrú mẹ́ta fún ìṣàn ọ̀rọ̀ tí ó rọrùn, a sì pa ìsopọ̀ àlàyé “Nítorí” mọ́. Àwọn àlàyé ìsàlẹ̀ ṣàfihàn àwọn ìtumọ̀ míì láìdi ọ̀rọ̀ pàtàkì lọ́wọ́.
