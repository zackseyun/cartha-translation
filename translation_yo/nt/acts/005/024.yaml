source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: yo
  text: Nígbà tí olórí ẹ̀ṣọ́ tẹ́ńpìlì àti àwọn olórí àlùfáà gbọ́ ọ̀rọ̀ wọ̀nyí, inú wọn dàrú nípa wọn, wọ́n sì ń ṣe kàyéfì ohun tí èyí lè yọrí sí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí èyí lè wá di.” Gbólóhùn Gíríìkì náà ń béèrè nípa àbájáde tí ọ̀ràn yìí lè ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí
  rationale: Ó fi ìgbésẹ̀ tó tẹ̀ lé e nínú ìtàn hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ lẹ́yìn gbígbọ́ ìròyìn náà; Yorùbá kò nílò àmì àsopọ̀ mìíràn níbí.
- source_word: ἤκουσαν
  choice: gbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún gbígbọ́ ọ̀rọ̀ tàbí ìròyìn ní àyíká yìí.
- source_word: τοὺς λόγους τούτους
  choice: ọ̀rọ̀ wọ̀nyí
  rationale: Ó dúró sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì lè tọ́ka sí ìròyìn tí wọ́n ṣẹ̀ṣẹ̀ gbọ́.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: olórí ẹ̀ṣọ́ tẹ́ńpìlì
  rationale: στρατηγός jẹ́ ọ̀gá tó ń darí àwọn ẹ̀ṣọ́ ní agbègbè tẹ́ńpìlì; yíyan yìí ṣe iṣẹ́ rẹ̀ kedere ní Yorùbá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe dandan pé ọ̀pọ̀ àlùfáà àgbà ló wà lórí ipò kan náà.
- source_word: διηπόρουν
  choice: ọkàn wọn dàrú
  rationale: Ó sọ ipò àìlóye àti ìdàrúdàpọ̀ tó lágbára tí ọ̀rọ̀ náà fà, ó sì bá ìṣe aláìparí nínú Gíríìkì mu.
- source_word: περὶ αὐτῶν
  choice: nípa wọn
  rationale: Ó pa àìdánilójú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí mọ́—ó lè jẹ́ àwọn ọ̀rọ̀/ìṣẹ̀lẹ̀ náà tàbí àwọn ènìyàn tí ìròyìn náà dá lé.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: ohun tí èyí lè yọrí sí
  rationale: ‘Lè’ fi àìdánilójú tí ἄν pẹ̀lú optative ń sọ hàn, ‘yọrí sí’ sì jẹ́ ọ̀nà àdánidá láti sọ àbájáde ọ̀ràn kan ní Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àìdánilójú arọ́pò-orúkọ περὶ αὐτῶν mọ́.
