id: ACT.5.42
reference: Acts 5:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: yo
  text: Lójoojúmọ́, ní tẹ́ńpìlì àti láti ilé dé ilé, wọn kò dẹ́kun kíkọ́ni àti kíkéde ìhìn rere pé Jésù ni Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ gangan, “wọ́n ń kéde ìhìn rere nípa Jésù Mèsáyà” tàbí “wọ́n ń kéde Jésù gẹ́gẹ́ bí Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Lójoojúmọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí ó ń ṣẹlẹ̀ ní gbogbo ọjọ́, ó sì pa ìtumọ̀ àṣà tí ó ń bá a lọ mọ́.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀; gbólóhùn yìí ṣe kúkúrú, ó sì yé àwọn òǹkàwé láì fi ìtumọ̀ míì kún un.
- source_word: κατ’ οἶκον
  choice: láti ilé dé ilé
  rationale: Ó mú agbára pínpín κατά pẹ̀lú οἶκον jáde, ó sì fi hàn pé iṣẹ́ náà ń lọ láti ilé kan sí òmíràn.
- source_word: οὐκ ἐπαύοντο
  choice: wọn kò dẹ́kun
  rationale: Ó fi ìṣe tí ó ń bá a lọ àti pé wọn kò dáwọ́ dúró hàn ní Yorùbá òde òní.
- source_word: διδάσκοντες
  choice: kíkọ́ni
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún iṣẹ́ ìkọ́ni tí ó ń bá a lọ.
- source_word: εὐαγγελιζόμενοι
  choice: kíkéde ìhìn rere
  rationale: Ó mú ìtumọ̀ pípè tàbí pípolongo ìròyìn rere jáde ní èdè tí ó ṣe kedere sí òǹkàwé òde òní.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: pé Jésù ni Mèsáyà
  rationale: Ó fi àkóónú ìkéde náà hàn ní Yorùbá àdánidá, ó sì tú Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà’ dípò lílo rẹ̀ bí orúkọ.
theological_decisions:
- issue: Bí a ṣe tú Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tí ó ń sọ ẹni tí a fi òróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò ṣíṣe é bí orúkọ lásán.
- issue: Agbára gírámà τὸν χριστὸν Ἰησοῦν lẹ́yìn εὐαγγελιζόμενοι
  choice: 'àkóónú ìkéde: ‘pé Jésù ni Mèsáyà’'
  alternative: ‘ìhìn rere nípa Jésù Mèsáyà’ tàbí ‘kéde Jésù gẹ́gẹ́ bí Mèsáyà’
  rationale: Akúsatífù Gíríìkì náà lè dúró gẹ́gẹ́ bí ohun tí wọ́n ń kéde tàbí ohun tí ìhìn rere náà dá lé. Ọ̀rọ̀ inú ẹsẹ̀ yan ìtumọ̀ àkóónú tó ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìṣiyèméjì gidi náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó níyì, tó ṣe kedere, tí ó sì bá ọ̀rọ̀ òde òní mu. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
