language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù sọ pé, “Ananíà, èé ṣe tí Sátánì fi kún ọkàn rẹ láti purọ́ fún Ẹ̀mí Mímọ́[a], àti láti fi apá kan owó tí wọ́n ta ilẹ̀ náà pamọ́[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti tan Ẹ̀mí Mímọ́ jẹ”; ṣùgbọ́n “purọ́ fún” ni ìtumọ̀ tí ó tààrà jù níbí.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “láti fi apá kan nínú iye tí wọ́n ta ilẹ̀ náà pamọ́.” Ọ̀rọ̀ tí a túmọ̀ sí “ilẹ̀” tún lè túmọ̀ sí “oko” tàbí “ohun-ìní ilẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Ṣùgbọ́n Peteru sọ pé
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀, ṣùgbọ́n níbí ó ń yí ìtàn padà sí ìdojúkọ Ananíà; “Ṣùgbọ́n” bá ipò náà mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: διὰ τί
  choice: èé ṣe
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere láti béèrè ìdí.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: tí Sátánì fi kún ọkàn rẹ
  rationale: Ó pa àwòrán ‘kíkún ọkàn’ àti Sátánì gẹ́gẹ́ bí olùṣe mọ́, láì túmọ̀ rẹ̀ sí pé ó gba gbogbo àkóso Ananíà tàbí pé Ananíà kò ní ẹ̀bi.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: láti purọ́ fún Ẹ̀mí Mímọ́
  rationale: “Purọ́ fún” jẹ́ ìtumọ̀ tààrà fún ψεύδομαι pẹ̀lú ẹni tí irọ́ náà dojú kọ; “láti” tún jẹ́ kí ìbáṣepọ̀ infinitive pẹ̀lú ‘kún ọkàn’ hàn láì fi àlàyé púpọ̀ kún un.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀, tí ó bójú mu, fún Holy Spirit.
- source_word: νοσφίσασθαι
  choice: fi apá kan ... pamọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú apá kan sẹ́yìn fún ara ẹni ní ìkọ̀kọ̀; “fi apá kan ... pamọ́” sọ ìtumọ̀ yìí ní Yorùbá àdánidá.
- source_word: ἀπὸ τῆς τιμῆς
  choice: apá kan owó tí wọ́n ta ...
  rationale: ἀπό pẹ̀lú genitive ń tọ́ka sí apá kan láti inú gbogbo iye owó náà; ọ̀nà yìí mú un ṣe kedere pé owó títà ni τιμή túmọ̀ sí ní àyíká yìí.
- source_word: τοῦ χωρίου
  choice: ilẹ̀ náà
  rationale: χωρίον lè túmọ̀ sí ilẹ̀, oko, tàbí ohun-ìní ilẹ̀; “ilẹ̀” jẹ́ ọ̀rọ̀ àdánidá tí kò fi ìtumọ̀ náà há ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Ipa Sátánì nínú kíkún ọkàn Ananíà
  choice: Pa gbólóhùn náà mọ́ pé Sátánì ni ó ‘kún ọkàn rẹ,’ láì ṣàlàyé rẹ̀ sí gbígba gbogbo àkóso rẹ̀.
  alternative: Kí ni ó dé tí o fi jẹ́ kí Sátánì gba àkóso rẹ?
  rationale: Gíríìkì fi Sátánì hàn gẹ́gẹ́ bí olùṣe, síbẹ̀ ìtàn náà ka Ananíà sí ẹni tí ó ní ẹ̀bi. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì yanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Irọ́ tí a pa fún Ẹ̀mí Mímọ́
  choice: purọ́ fún Ẹ̀mí Mímọ́
  alternative: tan Ẹ̀mí Mímọ́ jẹ
  rationale: Ìtumọ̀ tààrà yìí pa ìtọ́kasí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tí irọ́ náà dojú kọ mọ́, láì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ sí ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán Gíríìkì ‘kún ọkàn’ mọ́, bí ó tilẹ̀ jẹ́ pé ó ní ìwọ̀n àjèjì díẹ̀ ní Yorùbá, nítorí pé kò yẹ kí a fi ìtumọ̀ ẹ̀kọ́ míì rọ́pò rẹ̀.
