id: ACT.5.28
reference: Acts 5:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: yo
  text: ó ní pé, “A ti pàṣẹ gidigidi fún yín pé kí ẹ má ṣe kọ́ni ní orúkọ yìí. Ẹ wò ó, ẹ ti fi ẹ̀kọ́ yín kún Jerúsálẹ́mù, ẹ sì fẹ́ mú ẹ̀jẹ̀ ọkùnrin yìí wá sórí wa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, “ẹ fẹ́ fi ẹ̀bi ikú ọkùnrin yìí kàn wá.” Nínú Gíríìkì, mímú “ẹ̀jẹ̀” ẹni kan wá sórí ẹlòmíràn jẹ́ àṣà ọ̀rọ̀ fún fífi ẹ̀bi ikú ẹni náà kàn ẹni tí a mú ẹ̀jẹ̀ náà wá sórí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ó ní pé
  rationale: Ó so participle náà mọ́ ọ̀rọ̀ tó ṣáájú ní Yorùbá àdánidá, ó sì mú ọ̀rọ̀ tí a fa yọ wọlé láìfi ìtumọ̀ míì kún un.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Àwa pàṣẹ kíkankíkan fún yín
  rationale: Àkójọpọ̀ orúkọ àti ọ̀rọ̀-ìṣe oníbátan nínú Gíríìkì ń tẹnumọ́ bí àṣẹ náà ṣe le. “Pàṣẹ kíkankíkan” ń gbé ìtẹnumọ́ yẹn jáde ní Yorùbá tó ṣeé lóye.
- source_word: μὴ διδάσκειν
  choice: kí ẹ má ṣe kọ́ni
  rationale: Èyí ń fi ohun tí àṣẹ ìdènà náà ní hàn, láìsọ ọ́ di “kí ẹ dáwọ́ kọ́ni dúró,” èyí tí yóò jẹ́ àlàyé tó kọjá ohun tí gbolohun náà béèrè.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ní orúkọ yìí
  rationale: Ọ̀rọ̀ yìí pa àwòrán àti ìtumọ̀ ṣíṣe tàbí kíkọ́ni lábẹ́ àṣẹ tí orúkọ náà dúró fún mọ́, gẹ́gẹ́ bí ìlò rẹ̀ nínú Ìṣe àwọn Aposteli.
- source_word: ἰδοὺ
  choice: ẹ wò ó
  rationale: Ó pa agbára ìtọ́ka àti ìdojúkọ ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá òde òní.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: ẹ ti fi ẹ̀kọ́ yín kún Jerúsálẹ́mù
  rationale: “Ẹ ti ... kún” fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì wà nísinsìnyí hàn, ó sì pa àwòrán “kíkún” náà mọ́.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: ẹ̀kọ́ yín
  rationale: “Ẹ̀kọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè túmọ̀ sí ohun tí wọ́n ń kọ́ àwọn ènìyàn láìgbé ìtumọ̀ ẹ̀sìn ẹgbẹ́ kan wọlé.
- source_word: βούλεσθε
  choice: ẹ sì fẹ́
  rationale: Ó fi ìfẹ́-inú tàbí ète àwọn tí a ń bá sọ̀rọ̀ hàn, ó sì bá ohùn ẹ̀sùn inú gbolohun náà mu.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: mú ... wá sórí wa
  rationale: Ó pa àwòrán Gíríìkì ti mímú ohun kan wá sórí ẹnì kan mọ́ dípò ṣíṣàlàyé rẹ̀ tán nínú ọ̀rọ̀ pàtàkì.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: ẹ̀jẹ̀ ọkùnrin yìí
  rationale: Ó pa àpẹẹrẹ ọ̀rọ̀ nípa ẹ̀jẹ̀ àti ọ̀nà àìbọ̀wọ̀ tó fi ń tọ́ka sí Jésù gẹ́gẹ́ bí “ọkùnrin yìí” mọ́.
theological_decisions:
- issue: Ìtumọ̀ “mú ẹ̀jẹ̀ ọkùnrin yìí wá sórí wa”
  choice: A pa àpẹẹrẹ ẹ̀jẹ̀ náà mọ́ nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ẹ̀sùn pé wọ́n fẹ́ fi ẹ̀bi ikú Jésù kàn wọ́n.
  alternative: “Ẹ fẹ́ mú wa jẹ́ ẹni tí ó jẹ̀bi ikú ọkùnrin yìí.”
  rationale: Àṣà ọ̀rọ̀ Gíríìkì ń tọ́ka sí ẹ̀bi ẹ̀jẹ̀ tàbí jíjẹ́ onídùúró fún ikú ẹni. Pípa àwòrán náà mọ́ ń yẹra fún ṣíṣe ìtumọ̀ náà ní pàtó ju orísun lọ; àlàyé ìsàlẹ̀ ojú ìwé sì ń jẹ́ kí òǹkàwé mọ ìtumọ̀ àṣà ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, òde òní, tí ó ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Àwa” tẹnumọ́ olùsọ̀rọ̀ gẹ́gẹ́ bí Gíríìkì ṣe fi ẹni àkọ́kọ́ ọ̀pọ̀ hàn, “ẹ” sì bá ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ mu. A gbe àmì àlàyé [a] sí lẹ́gbẹ̀ẹ́ àṣà ọ̀rọ̀ nípa ẹ̀jẹ̀ tí àlàyé náà ń ṣàlàyé.
