- from: ó ní pé, “Àwa pàṣẹ kíkankíkan fún yín pé kí ẹ má ṣe kọ́ni ní orúkọ yìí. Ṣùgbọ́n ẹ wò ó, ẹ ti fi ẹ̀kọ́ yín kún Jerúsálẹ́mù, ẹ sì fẹ́ mú ẹ̀jẹ̀ ọkùnrin yìí wá sórí wa[a].”
  to: ó ní pé, “A ti pàṣẹ gidigidi fún yín pé kí ẹ má ṣe kọ́ni ní orúkọ yìí. Ẹ wò ó, ẹ ti fi ẹ̀kọ́ yín kún Jerúsálẹ́mù, ẹ sì fẹ́ mú ẹ̀jẹ̀ ọkùnrin yìí wá sórí wa[a].”
