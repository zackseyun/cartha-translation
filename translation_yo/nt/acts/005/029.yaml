id: ACT.5.29
reference: Acts 5:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru àti àwọn aposteli dáhùn pé, “A gbọ́dọ̀ ṣègbọràn sí Ọlọ́run ju àwọn ènìyàn[a] lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ẹ̀dá ènìyàn.” Ọ̀rọ̀ Gíríìkì náà ń fi Ọlọ́run wé àwọn ènìyàn, pàápàá àwọn aláṣẹ ènìyàn nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: dáhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe méjèèjì jẹ́ ọ̀nà ìtàn Gíríìkì fún fífi ìdáhùn hàn. “Dáhùn pé” jẹ́ èdè Yorùbá àdánidá tí kò tún ìtumọ̀ kan náà sọ lẹ́ẹ̀mejì.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tí ó ní ìtakora pẹ̀lẹ́pẹ̀lẹ́ sí ọ̀rọ̀ àwọn aláṣẹ tó ṣáájú hàn.
- source_word: Πέτρος
  choice: Peteru
  rationale: Èyí ni àkọsílẹ̀ orúkọ Peter tí ó ti fìdí múlẹ̀ nínú èdè Yorùbá.
- source_word: οἱ ἀπόστολοι
  choice: àwọn aposteli
  rationale: “Aposteli” ni ọ̀rọ̀ Yorùbá tí a mọ̀ sí rere fún ẹgbẹ́ àwọn tí a rán ní ipò pàtàkì yìí.
- source_word: Πειθαρχεῖν
  choice: ṣègbọràn sí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí títẹ̀lé àṣẹ ẹni tí ó ní ọlá-àṣẹ; “ṣègbọràn sí” sọ èyí ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: δεῖ
  choice: A gbọ́dọ̀
  rationale: Ó fi dandan tàbí ojúṣe hàn. “A” mú ẹni tí ọ̀rọ̀ náà kàn, tí a mọ̀ láti inú àyíká, ṣe kedere.
- source_word: θεῷ
  choice: Ọlọ́run
  rationale: Ó jẹ́ ẹni tí a gbọ́dọ̀ ṣègbọràn sí.
- source_word: μᾶλλον ἢ
  choice: ju ... lọ
  rationale: Ìṣètò afiwéra Yorùbá yìí pa ìtakora àti fífi ìgbọràn sí Ọlọ́run sí ipò àkọ́kọ́ mọ́, láìfi ìtumọ̀ tí ó le ju ti Gíríìkì lọ kún un.
- source_word: ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀dá ènìyàn, pàápàá àwọn aláṣẹ ènìyàn, ní ìtakora sí Ọlọ́run. “Àwọn ènìyàn” jẹ́ àdánidá, ó sì bo gbogbo ènìyàn láìka akọ tàbí abo.
theological_decisions:
- issue: Bí a ṣe máa fi ìgbọràn sí Ọlọ́run àti sí àwọn aláṣẹ ènìyàn wéra
  choice: “ṣègbọràn sí Ọlọ́run ju àwọn ènìyàn lọ”
  alternative: “ṣègbọràn sí Ọlọ́run dípò àwọn ènìyàn”
  rationale: “Ju ... lọ” tẹ̀lé ìṣètò afiwéra μᾶλλον ἢ, ó sì fi ipò gíga jù lọ tí ìgbọràn sí Ọlọ́run ní hàn. A kò lo “dípò” nítorí ó lè dà bí ẹni pé ẹsẹ̀ náà ń kọ gbogbo ìgbọràn sí ènìyàn sílẹ̀ pátápátá, èyí tí ọ̀rọ̀ náà kò sọ ní tààrà.
- issue: Ìtumọ̀ ἀνθρώποις ní ìtakora sí θεῷ
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Níhìn-ín ἀνθρώποις ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò fún ẹ̀dá ènìyàn, pàápàá àwọn aláṣẹ tó ń bá wọn sọ̀rọ̀. “Àwọn ènìyàn” pa ìtakora Ọlọ́run/ẹ̀dá ènìyàn mọ́ láìsọ pé ọkùnrin nìkan ni ọ̀rọ̀ náà kàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu; a sì lo “aposteli” gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tí ó ti wọ́pọ̀.
