  source_fidelity: 'Ìtumọ̀ náà ń mú àwọn èrò pàtàkì Gíríìkì wá: ilé ẹ̀wọ̀n, ipò tí a ti pa á títì pẹ̀lú ìdènà/ààbò, àwọn ẹ̀ṣọ́ tí wọ́n dúró níbi àwọn ilẹ̀kùn, àti pé kò sí ẹni nínú rẹ̀ nígbà tí wọ́n ṣí i. Síbẹ̀, “A bá ilé ẹ̀wọ̀n náà ní títì pa” kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ láti sọ pé wọ́n rí i ní ipò tí a ti pa títì.'
  naturalness: “A rí ilé ẹ̀wọ̀n náà tí a ti pa títì, tí a sì dáàbò bò dáadáa” jẹ́ Yorùbá ìgbàlódé tó túbọ̀ ṣe kedere. “níwájú àwọn ilẹ̀kùn” tún sọ ibi tí àwọn ẹ̀ṣọ́ dúró ní ọ̀nà tí ó rọrùn. A pa “nígbà tí a ṣí i” mọ́, nítorí ohun tí a ṣí kò sọ ní tààrà nínú Gíríìkì, ó sì lè tọ́ka sí ilé ẹ̀wọ̀n náà/ìwọlé rẹ̀ láìfi ohun mìíràn kún un.
  terminology: “Ilé ẹ̀wọ̀n,” “ẹ̀ṣọ́,” àti “ẹnikẹ́ni” dára, wọ́n sì bá àyíká ẹ̀wọ̀n mu. “Dáàbò bò dáadáa” ń ṣàfihàn ìtẹnumọ́ ἐν πάσῃ ἀσφαλείᾳ ní ti ìtumọ̀, bí ó tilẹ̀ jẹ́ pé a kò yẹ kí a ka á sí ìtumọ̀ pé àwọn ẹ̀ṣọ́ nìkan ló ń dáàbò bo ibẹ̀.
