  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: yo
  text: wọ́n wí pé, “A rí ilé ẹ̀wọ̀n náà tí a ti pa títì, tí a sì dáàbò bò dáadáa,[a] àwọn ẹ̀ṣọ́ sì dúró níwájú àwọn ilẹ̀kùn; ṣùgbọ́n nígbà tí a ṣí i, a kò rí ẹnikẹ́ni nínú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti pa títì pẹ̀lú gbogbo ìṣọ́ra.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ọn pé wọ́n rí ilé ẹ̀wọ̀n náà ní ipò tí a ti pa títì, tí a sì dáàbò bò dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: ilé ẹ̀wọ̀n
  rationale: Ó túmọ̀ sí ibi tí a ti ń fi àwọn ẹlẹ́wọ̀n pamọ́; ‘ilé ẹ̀wọ̀n’ ni ọ̀rọ̀ Yorùbá àgbéléwọ̀n tó wọ́pọ̀, tó sì bá àyíká ìtàn mu.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: ní títì pa pẹ̀lú ààbò tó péye
  rationale: ‘ní títì pa’ fi ipò tí ilé ẹ̀wọ̀n wà lẹ́yìn tí a ti tì í pa hàn, ‘pẹ̀lú ààbò tó péye’ sì pa ìtẹnumọ́ ἐν πάσῃ ἀσφαλείᾳ mọ́.
- source_word: φύλακας ἑστῶτας
  choice: àwọn ẹ̀ṣọ́ sì dúró
  rationale: ‘Àwọn ẹ̀ṣọ́’ bá iṣẹ́ ìṣọ́ ilé ẹ̀wọ̀n mu, ‘dúró’ sì pa àwòrán wọn bí wọ́n ṣe wà ní ipò wọn mọ́ láìfi èrò míì kún un.
- source_word: ἐπὶ τῶν θυρῶν
  choice: ní ẹnu àwọn ilẹ̀kùn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ibi tí àwọn ẹ̀ṣọ́ dúró, lẹ́gbẹ̀ẹ́ àwọn ilẹ̀kùn tàbí ní ẹnu ọ̀nà; ‘ní ẹnu àwọn ilẹ̀kùn’ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀνοίξαντες
  choice: nígbà tí a ṣí i
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu. Arọ́pò-orúkọ ‘i’ tọ́ka sí ilé ẹ̀wọ̀n gẹ́gẹ́ bí ohun kan ṣoṣo, bó tilẹ̀ jẹ́ pé ṣíṣí rẹ̀ ṣẹlẹ̀ nípasẹ̀ ilẹ̀kùn rẹ̀.
- source_word: ἔσω
  choice: nínú
  rationale: Ó tọ́ka sí inú ilé ẹ̀wọ̀n; ‘nínú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ṣe àdánidá níbí.
- source_word: οὐδένα
  choice: a kò rí ẹnikẹ́ni
  rationale: Ìkọ̀lù òdì pẹ̀lú ‘ẹnikẹ́ni’ tú οὐδένα ní kedere nínú Yorùbá.
- source_word: λέγοντες ὅτι
  choice: wọ́n wí pé
  rationale: Ó so ẹsẹ yìí mọ́ ìròyìn àwọn ìránṣẹ́ nínú àyíká tó ṣáájú, ó sì ṣí ọ̀rọ̀ tààrà sílẹ̀ lọ́nà Yorùbá tó bójú mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tó ṣe àdánidá ni a lò. A lo ‘a’ nínú ọ̀rọ̀ tààrà láti ṣojú àwọn tó ń ròyìn; a sì pa àwòrán àwọn ẹ̀ṣọ́ tí wọ́n dúró ní ẹnu ilẹ̀kùn mọ́.
