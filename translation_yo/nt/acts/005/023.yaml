    rationale: ἐπὶ τῶν θυρῶν tọ́ka sí ipò àwọn ẹ̀ṣọ́ ní/níwájú àwọn ilẹ̀kùn. “níwájú àwọn ilẹ̀kùn” jẹ́ àṣàyàn tó ṣe kedere ju.
