revisions:
- from: 'Nítorí náà, mo sọ fún yín nísinsìnyí pé: Ẹ kúrò lọ́dọ̀ àwọn ọkùnrin wọ̀nyí, kí ẹ sì fi wọ́n sílẹ̀; nítorí bí ète yìí tàbí iṣẹ́ yìí bá ti ọ̀dọ̀ ènìyàn wá[a], yóò di asán[b].'
  to: 'Báyìí sì ni mo sọ fún yín: Ẹ kúrò lọ́dọ̀ àwọn ọkùnrin wọ̀nyí, kí ẹ sì fi wọ́n sílẹ̀; nítorí bí ètò yìí tàbí iṣẹ́ yìí bá wá láti ọ̀dọ̀ ènìyàn[a], a ó tú u ká[b].'
  rationale: Àtúnṣe náà yọ ìtumọ̀ ìyọrísí tí kò sí nínú καὶ τὰ νῦν kúrò, ó sì lo “Báyìí sì ni” fún ìsọ̀rọ̀ àkókò náà. A tún lo “a ó tú u ká” láti sọ καταλυθήσεται ní ìtumọ̀ ìtúká/ìwópalẹ̀ rẹ̀, láì dárúkọ ẹni tí yóò ṣe é. Àwọn àmì ẹsẹ̀ àti ìtumọ̀ àfidípò wọn wà ní ipò tó tọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:59Z'
