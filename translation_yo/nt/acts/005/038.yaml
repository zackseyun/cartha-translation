language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: yo
  text: 'Báyìí sì ni mo sọ fún yín: Ẹ kúrò lọ́dọ̀ àwọn ọkùnrin wọ̀nyí, kí ẹ sì fi wọ́n sílẹ̀; nítorí bí ètò yìí tàbí iṣẹ́ yìí bá wá láti ọ̀dọ̀ ènìyàn[a], a ó tú u ká[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá jẹ́ ti ẹ̀dá ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “yóò di asán” tàbí “a ó pa á run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: nísinsìnyí
  rationale: Ó jẹ́ ọ̀rọ̀ àkókò tí ó ń fi ìmọ̀ràn Gamalieli fún wọn ní ipò tí wọ́n wà nígbà náà hàn; “nísinsìnyí” jẹ́ Yorùbá àdánidá tí ó bójú mu.
- source_word: ἀπόστητε ἀπὸ
  choice: Ẹ kúrò lọ́dọ̀
  rationale: Àṣẹ náà ń pè fún yíyọ ara wọn kúrò nínú lílo agbára sí àwọn ọkùnrin náà; gbolohun yìí ṣe kedere láì fi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: ἄφετε αὐτούς
  choice: kí ẹ sì fi wọ́n sílẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé kí wọ́n má ṣe dá sí wọn mọ́ tàbí má ṣe bá ìyà jẹ wọ́n; “fi wọ́n sílẹ̀” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì ṣe déédé.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ń ṣàlàyé ìdí tí Gamalieli fi fún wọn ní ìmọ̀ràn náà.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: bí ... bá ti ọ̀dọ̀ ènìyàn wá
  rationale: ἐξ ń tọ́ka sí orísun. “Ti ọ̀dọ̀ ènìyàn wá” pa ìyàtọ̀ mọ́ láàárín ohun tí ó ní orísun ẹ̀dá ènìyàn àti ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá ní ẹsẹ tó tẹ̀ lé e.
- source_word: βουλή
  choice: ète
  rationale: Nínú àyíká yìí, βουλή jẹ́ èrò tàbí ìpinnu tí a gbèrò láti mú ṣẹ; “ète” jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, àdánidá, tí kò sì fi dandan túmọ̀ sí ète búburú.
- source_word: ἔργον
  choice: iṣẹ́
  rationale: “Iṣẹ́” jẹ́ ìtumọ̀ gbooro àti tààrà fún ἔργον, ó sì dára lẹ́gbẹ̀ẹ́ “ète.”
- source_word: καταλυθήσεται
  choice: yóò di asán
  rationale: Ọ̀rọ̀ náà sọ pé ète tàbí iṣẹ́ náà yóò tú ká, yóò sì kùnà. “Yóò di asán” jẹ́ Yorùbá àdánidá tí ó pa àbájáde ìṣe aláìṣiṣẹ́mọ́ náà mọ́ láì pinnu ẹni tí yóò mú un ṣẹ.
theological_decisions:
- issue: Orísun tí ἐξ ἀνθρώπων ń tọ́ka sí
  choice: ti ọ̀dọ̀ ènìyàn wá
  alternative: jẹ́ ti ẹ̀dá ènìyàn
  rationale: Ẹyọ ọ̀rọ̀ ènìyàn ní Yorùbá lè dúró fún gbogbo ẹ̀dá ènìyàn, ó sì pa ìtakora pẹ̀lú “ti ọ̀dọ̀ Ọlọ́run” ní ẹsẹ tó tẹ̀ lé e mọ́, láì sọ pé àwọn ọkùnrin nìkan ni gbolohun náà ń tọ́ka sí.
- issue: Agbára tàbí ẹni tí yóò mú καταλυθήσεται ṣẹ
  choice: yóò di asán
  alternative: a ó pa á run
  rationale: Fífi ọ̀rọ̀ náà sí “yóò di asán” kò sọ ẹni tó fa ìparun náà, nítorí Gíríìkì lo ọ̀rọ̀ ìṣe afagilé (passive) kò sì dárúkọ olùṣe. Èyí yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní tààrà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àwọn àṣẹ “Ẹ kúrò ... kí ẹ sì fi wọ́n sílẹ̀” ṣe kedere fún òǹkàwé lónìí, nígbà tí “ète ... tàbí iṣẹ́” àti “yóò di asán” ń pa ìṣètò àti ìfọ̀rọ̀wérọ̀ orísun Gíríìkì mọ́.
