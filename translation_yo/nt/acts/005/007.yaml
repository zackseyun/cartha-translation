source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: yo
  text: Lẹ́yìn nǹkan bí wákàtí mẹ́ta, aya rẹ̀ wọlé, kò sì mọ ohun tí ó ṣẹlẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Lẹ́yìn
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń darí ìtàn sí ohun tó ṣẹlẹ̀ lẹ́yìn náà. Nínú Yorùbá, gbólóhùn àsìkò “Lẹ́yìn…” ń mú ìlọsíwájú ìtàn náà jáde lọ́nà àdánidá láìfi ọ̀rọ̀ àtijọ́ tàbí àsopọ̀ tí kò pọndandan kún un.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: nǹkan bí wákàtí mẹ́ta
  rationale: ὡς fi hàn pé ìwọ̀n àsìkò náà jẹ́ àfojúsùn, διάστημα sì tọ́ka sí àárín àsìkò. “Nǹkan bí wákàtí mẹ́ta” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ó tó bí wákàtí mẹ́ta.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: aya rẹ̀
  rationale: Nínú àyíká ìtàn yìí, γυνή túmọ̀ sí aya Ananíà, kì í ṣe obìnrin lásán.
- source_word: μὴ εἰδυῖα
  choice: kò sì mọ
  rationale: Ọ̀rọ̀ aláìlópìn yìí ṣàpèjúwe ipò aya náà nígbà tó wọlé. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé kò ní ìmọ̀ nípa ohun tó ṣẹlẹ̀ mọ́.
- source_word: τὸ γεγονὸς
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Perfect participle tí a lò gẹ́gẹ́ bí orúkọ tọ́ka sí ìṣẹ̀lẹ̀ tó ti wáyé ṣáájú. “Ohun tí ó ṣẹlẹ̀” sọ èyí ní kedere.
- source_word: εἰσῆλθεν
  choice: wọlé
  rationale: εἰσέρχομαι túmọ̀ sí láti wọ inú ibi kan. “Wọlé” bá ìṣẹ̀lẹ̀ náà mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn àti àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ; kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn àrà ọ̀tọ̀ tàbí àlàyé tí a fi kún orísun.
