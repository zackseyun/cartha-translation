revisions:
- from: Nítorí náà, àwọn ènìyàn tilẹ̀ ń gbé àwọn aláìsàn jáde sí àwọn òpópónà[a], wọ́n sì ń tẹ́ wọn sí orí àwọn àkéte àti àwọn ẹní[b], kí ó lè jẹ́ pé bí Peteru ti ń kọjá lọ, kí òjìji rẹ̀ tilẹ̀ ṣíji bo àwọn kan lára wọn.[c]
  to: Tó bẹ́ẹ̀ tí àwọn ènìyàn tilẹ̀ ń gbé àwọn aláìsàn jáde sí àwọn òpópónà[a], wọ́n sì ń fi wọ́n dùbúlẹ̀ sórí àwọn ibùsùn kéékèèké àti àwọn àkéte[b], kí, nígbà tí Peteru bá ń kọjá lọ, kódà òjìji rẹ̀ lè bo ẹnikan nínú wọn.[c]
  rationale: A tún gbolohun náà ṣe láti jẹ́ kí ìbáṣepọ̀ àbájáde ὥστε àti ète ἵνα rọrùn nínú Yorùbá. “Kódà” ń ṣàfihàn ìtẹnumọ́ κἄν; “lè bo” sì pa ìfẹ́/ìrètí tí a kò fìdí ìṣẹ̀lẹ̀ rẹ̀ múlẹ̀ nínú ẹsẹ̀ yìí mọ́. A tún ṣe τινὶ αὐτῶν sí ẹni-ẹyọ̀ kan, a sì ṣàtúnṣe àlàyé ohun ìsùn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:45Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gbé ìtumọ̀ àpapọ̀ ẹsẹ̀ náà kalẹ̀ dáadáa, ṣùgbọ́n “àwọn kan lára wọn” yí τινὶ αὐτῶν, ẹni kan lára wọn, padà sí ọ̀pọ̀ ènìyàn. Àtúnṣe náà tún mú ipa àbájáde ὥστε, ète ἵνα, àti ìṣeeṣe inú ἄν pẹ̀lú subjunctive hàn kedere.
  naturalness: “Kí ó lè jẹ́ pé ... kí” jẹ́ ìtẹ̀síwájú tí kò rọrùn nínú Yorùbá, “ń tẹ́ wọn sí orí” kò dára bí ọ̀nà ìsọ̀rọ̀ fún fífi aláìsàn dùbúlẹ̀ sórí ibùsùn, àti “ohun ìtẹ́wọ́gbà” nínú àlàyé ìsàlẹ̀ kò tọ́ sí ohun ìsùn. A ti lo gbolohun Yorùbá tí ó rọrùn àti tí ó mọ́gbọn dáadáa.
  terminology: “Àwọn ibùsùn kéékèèké àti àwọn àkéte” fi ìyàtọ̀ àwọn ohun ìsùn méjì nínú κλιναρίων καὶ κραβάττων hàn láìjẹ́ pé a sọ ìtumọ̀ imọ̀-ẹ̀rọ tí kò dájú. “Bo” ni ọ̀rọ̀ Yorùbá àdánidá fún ìṣe òjìji nínú àyíká yìí.
