  - severity: medium
    issue: Ìkọ́lé “kí ó lè jẹ́ pé ... kí”
    rationale: Ó jẹ́ ìtúnkí tí kò rọrùn, ó sì ṣókùnfà ìṣàn gbolohun. A lè sọ ète ἵνα pẹ̀lú “kí ... lè ...” ní ti ara Yorùbá.
