id: ACT.5.15
reference: Acts 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: yo
  text: Tó bẹ́ẹ̀ tí àwọn ènìyàn tilẹ̀ ń gbé àwọn aláìsàn jáde sí àwọn òpópónà[a], wọ́n sì ń fi wọ́n dùbúlẹ̀ sórí àwọn ibùsùn kéékèèké àti àwọn àkéte[b], kí, nígbà tí Peteru bá ń kọjá lọ, kódà òjìji rẹ̀ lè bo ẹnikan nínú wọn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àwọn ibi gbangba.” Ọ̀rọ̀ Gíríìkì πλατείας lè túmọ̀ sí àwọn òpópónà fífẹ̀ tàbí àwọn àgbègbè gbangba tí ó ṣí sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ibùsùn àti àwọn àkéte.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀ méjì fún onírúurú ibùsùn tàbí ohun ìsùn.
    reason: lexical_alternative
  - marker: c
    text: 'Ẹsẹ̀ yìí ń sọ ète àwọn ènìyàn: wọ́n fi àwọn aláìsàn dùbúlẹ̀ síbẹ̀ kí kódà òjìji Peteru lè bo ẹnikan nínú wọn; kò sọ ní pàtó níbí pé òjìji náà fúnra rẹ̀ mú ẹnikẹ́ni lára dá.'
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde ohun tí a sọ ṣáájú hàn ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: καὶ εἰς τὰς πλατείας
  choice: tilẹ̀ ... jáde sí àwọn òpópónà
  rationale: “Tilẹ̀” mú ìtẹnumọ́ καί jáde; “àwọn òpópónà” jẹ́ ìtumọ̀ àkọ́kọ́ tí ó bá ibi tí Peteru yóò ti kọjá mu, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘gbangba’ pamọ́.
- source_word: ἐκφέρειν
  choice: ń gbé ... jáde
  rationale: Ó sọ ní kedere pé wọ́n ń gbé àwọn aláìsàn láti inú ilé lọ síta.
- source_word: τοὺς ἀσθενεῖς
  choice: àwọn aláìsàn
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí àìsàn ń ṣe.
- source_word: τιθέναι
  choice: ń tẹ́ wọn sí orí
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n fi ẹni tí ó dùbúlẹ̀ sí orí ohun ìtẹ́wọ́gbà.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: sí orí àwọn àkéte àti àwọn ẹní
  rationale: Àwọn ọ̀rọ̀ méjèèjì tọ́ka sí oríṣìíríṣìí ohun ìtẹ́wọ́gbà tàbí ohun ìsùn; yíyan ọ̀rọ̀ méjì yìí pa ìyàtọ̀ náà mọ́ láìfi ìtumọ̀ ìmọ̀-ẹ̀rọ tí kò dájú kún un.
- source_word: ἵνα
  choice: kí ó lè jẹ́ pé
  rationale: Ó fi ète tàbí àbájáde tí àwọn ènìyàn ń retí hàn, kò sì sọ ọ́ di ohun tí ó ṣẹlẹ̀ dandan.
- source_word: ἐρχομένου Πέτρου
  choice: bí Peteru ti ń kọjá lọ
  rationale: Ó mú ìṣe tí ó ń lọ lọ́wọ́ àti èrò pé Peteru ń kọjá lẹ́gbẹ̀ẹ́ wọn jáde.
- source_word: κἂν
  choice: tilẹ̀
  rationale: Ó tẹnumọ́ ohun díẹ̀ tí wọ́n retí—pé òjìji Peteru nìkan pàápàá lè bò wọ́n.
- source_word: σκιὰ
  choice: òjìji
  rationale: Ìtumọ̀ gangan ni; kò sí àmì pé àpẹẹrẹ ni.
- source_word: ἐπισκιάσῃ
  choice: ṣíji bo
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún bí òjìji ṣe ń bo ènìyàn, ó sì pa àwòrán gangan mọ́.
- source_word: τινὶ αὐτῶν
  choice: àwọn kan lára wọn
  rationale: Ó tọ́ka sí ẹni kan tàbí díẹ̀ lára ọ̀pọ̀ àwọn aláìsàn náà, láìsọ pé gbogbo wọn ni.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà sọ pé òjìji Peteru fúnra rẹ̀ ní agbára ìwòsàn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ète àti ìrètí àwọn ènìyàn, kì í ṣe gẹ́gẹ́ bí ìjẹ́rìí pé òjìji náà fúnra rẹ̀ mú wọn lára dá.
  alternative: Ṣíṣe ọ̀rọ̀ náà bí ẹni pé òjìji Peteru ní agbára iṣẹ́ ìyanu nínú ara rẹ̀.
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́lẹ̀ ἐπισκιάσῃ fi ohun tí wọ́n ń fẹ́ tàbí retí hàn. Ẹsẹ̀ yìí fúnra rẹ̀ kò sọ pé òjìji náà mú ẹnikẹ́ni lára dá, bí ó tilẹ̀ jẹ́ pé àyíká tó yí i ká sọ nípa ọ̀pọ̀ ìwòsàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtumọ̀ náà pa ìṣàn gbolohun Gíríìkì àti àìdájú inú ἵνα pẹlu subjunctive mọ́, láìsọ ìrètí àwọn ènìyàn di ìṣẹ̀lẹ̀ tí ẹsẹ̀ náà kò fìdí rẹ̀ múlẹ̀.
