revisions:
- from: Nítorí náà, wọ́n kúrò níwájú ìgbìmọ̀ náà, wọ́n ń yọ̀ pé a ti kà wọ́n sí ẹni tí ó yẹ láti di ẹni tí a tàbùkù sí nítorí Orúkọ náà.[a]
  to: Nítorí náà, wọ́n kúrò níwájú ìgbìmọ̀ náà, wọ́n sì ń yọ̀ pé a kà wọ́n sí ẹni tí ó yẹ láti gba ìtìjú nítorí Orúkọ náà.[a]
  rationale: Àtúnṣe náà yí ọ̀rọ̀ kan ṣoṣo tí kò dára ní èdè Yorùbá padà sí “láti gba ìtìjú.” Èyí ń mú ìtumọ̀ ἀτιμασθῆναι—gbigba ìtìjú tàbí àbùkù—jáde ní kedere, láìfi ìtumọ̀ ẹ̀kọ́-ìsìn míì kún un. “Orúkọ náà” àti àìsọ ẹni tí a ń tọ́ka sí ní gbangba ni a ti pa mọ́ gẹ́gẹ́ bí ti orísun náà.
