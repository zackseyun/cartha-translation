  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: yo
  text: Nítorí náà, wọ́n kúrò níwájú ìgbìmọ̀ náà, wọ́n sì ń yọ̀ pé a kà wọ́n sí ẹni tí ó yẹ láti gba ìtìjú nítorí Orúkọ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “orúkọ Jésù.” Ní Gíríìkì: “Orúkọ náà,” ọ̀nà ọ̀wọ̀ tí a fi ń tọ́ka sí Jésù láìdárúkọ rẹ̀ ní tààrà.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: wọ́n kúrò
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ṣàpèjúwe bí wọ́n ṣe ń lọ kúrò níbẹ̀; “wọ́n kúrò” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìlọkúrò wọn nínú ìtàn.
- source_word: χαίροντες
  choice: wọ́n ń yọ̀
  rationale: Ọ̀rọ̀-ẹni tí ó wà ní àsìkò ìsinsìnyí fi hàn pé ayọ̀ wọn ń bá ìlọkúrò wọn lọ lẹ́sẹ̀ kan náà.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: níwájú ìgbìmọ̀ náà
  rationale: “Níwájú” mú èrò ìpilẹ̀ṣẹ̀ nípa kíkúrò ní ojú tàbí níwájú ìgbìmọ̀ náà wá sí Yorùbá àdánidá.
- source_word: συνεδρίου
  choice: ìgbìmọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìgbìmọ̀ alákóso; títúmọ̀ rẹ̀ dípò lílo orúkọ àyálò “Sàhẹ́ndírínì” mú kí ó rọrùn fún òǹkàwé òde òní.
- source_word: κατηξιώθησαν
  choice: a ti kà wọ́n sí ẹni tí ó yẹ
  rationale: Ìṣe àìṣe-láti-ọ̀dọ̀ ẹni náà fi hàn pé a ṣe ìdájọ́ pé wọ́n yẹ; ọ̀nà yìí pa ìtumọ̀ ìdáwọ̀n yẹn mọ́.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Níhìn-ín ọ̀rọ̀ náà tọ́ka sí ìdí tàbí ohun tí àbùkù náà ní í ṣe pẹ̀lú; “nítorí” jẹ́ kedere, ó sì bá Yorùbá mu.
- source_word: τοῦ ὀνόματος
  choice: Orúkọ náà
  rationale: Gíríìkì fi “Orúkọ náà” nìkan sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀, láì sọ Jésù ní tààrà; ìtumọ̀ yìí pa ìfipamọ́ àti ìtẹnumọ́ rẹ̀ mọ́.
- source_word: ἀτιμασθῆναι
  choice: láti di ẹni tí a tàbùkù sí
  rationale: Ọ̀nà yìí fi ìṣe àìṣe-láti-ọ̀dọ̀ ẹni hàn, ó sì mú èrò yíyọ ọlá kúrò lára wọn tàbí títì wọ́n sí ojú hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Lílo “Orúkọ náà” láìfi ẹni tí ó ń tọ́ka sí hàn gbangba
  choice: Orúkọ náà
  alternative: orúkọ Jésù; orúkọ rẹ̀
  rationale: Gíríìkì ní τοῦ ὀνόματος, “Orúkọ náà,” láìsọ ẹni tí ó ń tọ́ka sí ní tààrà. Àyíká fi hàn pé Jésù ni, ṣùgbọ́n fífi èyí sílẹ̀ gẹ́gẹ́ bí orísun ṣe ṣe ń pa agbára ọ̀rọ̀ ọ̀wọ̀ náà àti àìsọ-gbangba rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá. A lo “ìgbìmọ̀” fún ohun tí a tún lè pè ní Sàhẹ́ndírínì, a sì pa “Orúkọ náà” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ inú orísun.
