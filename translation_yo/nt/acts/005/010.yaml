  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó ṣubú sí ẹsẹ̀ rẹ̀, ó sì kú. Nígbà tí àwọn ọ̀dọ́kùnrin náà wọlé, wọ́n bá a ní òkú; wọ́n sì gbé e jáde, wọ́n sin ín lẹ́gbẹ̀ẹ́ ọkọ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Lójú ẹsẹ̀ náà
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἐξέψυξεν
  choice: ó sì kú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó dá ẹ̀mí jáde, ìyẹn ni pé ó kú; yíyan ọ̀rọ̀ yìí jẹ́ kedere, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: sí ẹsẹ̀ rẹ̀
  rationale: Ó pa ìtumọ̀ ibi tí obìnrin náà ṣubú sí mọ́ láìfi ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí kún un.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: lẹ́gbẹ̀ẹ́ ọkọ rẹ̀
  rationale: Nínú àyíká ìsìnkú, πρός ń tọ́ka sí sísin ín nítòsí tàbí lẹ́gbẹ̀ẹ́ ọkọ rẹ̀.
