language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: yo
  text: “Ẹ lọ, ẹ sì dúró ní àgbàlá tẹ́ńpìlì[a], ẹ sì sọ gbogbo ọ̀rọ̀ ìyè yìí[b] fún àwọn ènìyàn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà, ἱερόν, ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú un sí “gbogbo ọ̀rọ̀ nípa ìyè yìí” tàbí “gbogbo ọ̀rọ̀ nípa ọ̀nà ìgbésí ayé yìí.” Ó ṣeé ṣe kí “ìyè” tọ́ka sí ìyè tí ìhìn rere ń kéde.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Ẹ lọ
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí wọ́n lọ láti ṣe ohun tí a pàṣẹ; ‘Ẹ lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé, tó sì bá ọ̀pọ̀ ènìyàn mu.
- source_word: σταθέντες
  choice: ẹ sì dúró
  rationale: Bó tilẹ̀ jẹ́ pé participle ni ní Gíríìkì, ó ń tẹ̀ lé àṣẹ ‘lọ’ gẹ́gẹ́ bí ìgbésẹ̀ tó bá a rìn; fífi ọ̀rọ̀-ìṣe àṣẹ méjì ṣọ̀kan jẹ́ èdè Yorùbá àdánidá.
- source_word: λαλεῖτε
  choice: kí ẹ sì sọ
  rationale: λαλεῖτε jẹ́ àṣẹ láti sọ̀rọ̀; ‘sọ’ pa ìtumọ̀ gbòòrò rẹ̀ mọ́ láìfi ìtumọ̀ ‘kéde’ kún un.
- source_word: ἐν τῷ ἱερῷ
  choice: ní àgbàlá tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. ‘Àgbàlá tẹ́ńpìlì’ mú ibi tí àwọn ènìyàn lè péjọ sí hàn ní Yorùbá tó mọ́gbọ́n dání.
- source_word: τῷ λαῷ
  choice: fún àwọn ènìyàn
  rationale: λαός níbí tọ́ka sí àwọn ènìyàn tí ó wà níbẹ̀; a kò fi àlàyé ẹ̀yà tàbí orílẹ̀-èdè tí ẹsẹ̀ náà kò sọ kún un.
- source_word: πάντα τὰ ῥήματα
  choice: gbogbo ọ̀rọ̀
  rationale: Èyí pa πάντα àti ῥήματα mọ́ ní kíkún, dípò yíyí wọn padà sí ‘gbogbo iṣẹ́ ìránṣẹ́’ tàbí àlàyé mìíràn.
- source_word: τῆς ζωῆς ταύτης
  choice: ìyè yìí
  rationale: 'Gbólóhùn náà pa ìbáṣepọ̀ genitive àti àìdánilójú Gíríìkì mọ́: ó lè jẹ́ ìyè tí ìhìn rere ń kéde, ìgbésí ayé tuntun, tàbí ọ̀rọ̀ tó ń fúnni ní ìyè.'
theological_decisions:
- issue: Ìtumọ̀ τῆς ζωῆς ταύτης (‘ìyè yìí’)
  choice: Pa gbólóhùn kúkúrú ‘ìyè yìí’ mọ́ láìṣàlàyé rẹ̀ sínú ẹsẹ̀.
  alternative: ‘ìyè tuntun yìí,’ ‘ọ̀nà ìgbésí ayé yìí,’ tàbí ‘ìhìn iṣẹ́ tó ń fúnni ní ìyè’
  rationale: Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ìyè tó so mọ́ ìhìn rere àti ìgbàlà nínú Jésù, ṣùgbọ́n Gíríìkì kò yan ìtumọ̀ kan ṣoṣo. Ìtumọ̀ Yorùbá náà ní láti pa ìjìnlẹ̀ àti àìdánilójú yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo ọ̀rọ̀ ọ̀wọ̀/plural ‘ẹ’ fún àwọn àpọ́sítélì. ‘Àgbàlá tẹ́ńpìlì’ ṣàfihàn ìtumọ̀ agbègbè ἱερόν, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn tó sún mọ́ fọ́ọ̀mù Gíríìkì hàn.
