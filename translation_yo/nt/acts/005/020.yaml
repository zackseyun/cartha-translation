  source_fidelity: 'Ìtumọ̀ náà ń gbé gbogbo àwọn ẹ̀yà pàtàkì ti Gíríìkì náà kalẹ̀ dáadáa: àṣẹ láti lọ, láti dúró, láti sọ fún àwọn ènìyàn, àti ‘gbogbo ọ̀rọ̀ ìyè yìí.’ ‘Àgbàlá tẹ́ńpìlì’ jẹ́ ìtumọ̀ tó dára fún ἱερόν, èyí tí ó tọ́ka sí agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé nìkan. Síbẹ̀, ‘kí ẹ sì sọ’ lè dà bí gbólóhùn ìfẹ́/ìpinnu tí ó wà lábẹ́ ìṣàkóso àṣẹ tó ṣáájú rẹ̀, níbi tí λαλεῖτε jẹ́ àṣẹ tààrà. Àwọn ọ̀rọ̀-ìṣe àṣẹ tí a so pọ̀ dára jù fún ìlànà Gíríìkì náà.'
