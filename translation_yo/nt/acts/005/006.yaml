  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: “dìde,” “fi aṣọ dì í,” “gbé e jáde,” àti “sin ín” ń ṣàfihàn àwọn ìṣe tí ó wà nínú ἀναστάντες, συνέστειλαν, ἐξενέγκαντες, àti ἔθαψαν dáadáa. Àfikún “náà” jẹ́ àfihàn adayeba ti article οἱ, kò sì yí ìtumọ̀ padà.'
  naturalness: Ọ̀rọ̀ àkọ́kọ́ náà ṣàn dáadáa ní Yorùbá boṣewa. A tún ìtumọ̀ akọsílẹ̀ ìsàlẹ̀ ṣe kí ó má ṣe lo ọrọ̀ Gẹ̀ẹ́sì “comparative,” kí ó sì lo ìkọ̀wé Yorùbá tó dára jù.
