  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: yo
  text: Nígbà náà ni àwọn ọ̀dọ́kùnrin náà dìde, wọ́n sì fi aṣọ dì í. Wọ́n gbé e jáde, wọ́n sì sin ín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: dìde
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist ti ἀνίστημι, ó sì ń tọ́ka sí bí wọ́n ṣe dìde láti ṣe ohun tí ó tẹ̀ lé; “dìde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: δὲ ń mú ìtàn tẹ̀ síwájú níbí; “Nígbà náà ni” fi ìtẹ̀síwájú iṣẹlẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: οἱ νεώτεροι
  choice: àwọn ọ̀dọ́kùnrin
  rationale: νεώτεροι jẹ́ comparative ní ìrísí, ó lè túmọ̀ sí àwọn ọkùnrin tí wọ́n kéré ní ọjọ́ orí tàbí àwọn ọ̀dọ́kùnrin lápapọ̀. “Àwọn ọ̀dọ́kùnrin” jẹ́ èdè Yorùbá tó ṣe àdánidá; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì mọ́.
- source_word: συνέστειλαν
  choice: fi aṣọ dì í
  rationale: Nínú àyíká yìí, συστέλλω ń tọ́ka sí dídì òkú náà fún gbígbé jáde àti ìsìnkú. “Fi aṣọ dì í” sọ iṣẹ́ ara tí ó ṣeé ṣe kí wọ́n ṣe, láì gbòòrò sí “pèsè rẹ̀ fún ìsìnkú.”
- source_word: αὐτὸν
  choice: í / e
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ananíà; Yorùbá lo “í” lẹ́yìn “dì” àti “e” lẹ́yìn “gbé” gẹ́gẹ́ bí ìlànà ohùn àti ìkọ̀wé.
- source_word: ἐξενέγκαντες
  choice: gbé e jáde
  rationale: ἐκφέρω túmọ̀ sí gbígbé ẹni tàbí ohun jáde; “gbé e jáde” bá ọ̀rọ̀ òkú àti ìsìnkú mu dáadáa.
- source_word: ἔθαψαν
  choice: sin ín
  rationale: θάπτω túmọ̀ sí sínsin òkú; “sin ín” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí kò sì ní ìforúkọsílẹ̀ gíga jù.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti ìtàn mímọ́ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pín àwọn participle Gíríìkì sí àwọn gbólóhùn kúkúrú láti jẹ́ kí Yorùbá ṣàn lọ́nà àdánidá.
