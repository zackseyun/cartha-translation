source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: yo
  text: Ṣùgbọ́n ní òru, áńgẹ́lì Olúwa kan ṣí àwọn ilẹ̀kùn ilé ẹ̀wọ̀n, ó mú wọn jáde, ó sì wí pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: áńgẹ́lì kan
  rationale: Orúkọ náà kò ní atọ́ka nínú Gíríìkì; “áńgẹ́lì kan” kò fi ìdánimọ̀ pàtó kún un, ó sì bá iṣẹ́ agbára àrà ọ̀tọ̀ inú àyíká ọ̀rọ̀ mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí pa gbólóhùn Bíbélì tí ó wọ́pọ̀, “áńgẹ́lì Olúwa,” mọ́, ó sì tú κύριος ní ọ̀nà tó yẹ nínú àyíká yìí.
- source_word: διὰ νυκτός
  choice: ní òru
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àkókò tí ìṣẹ̀lẹ̀ náà ṣẹlẹ̀; “ní òru” jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ náà jáde kedere.
- source_word: ἤνοιξε
  choice: ṣí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣí; a kò lò “tú kọ́kọ́rọ́” nítorí pé ìyẹn yóò fi àlàyé tí Gíríìkì kò sọ kún un.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: àwọn ilẹ̀kùn ọgbà ẹ̀wọ̀n
  rationale: “Àwọn ilẹ̀kùn” pa nọ́ńbà púpọ̀ mọ́, “ọgbà ẹ̀wọ̀n” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ibi ìhámọ́.
- source_word: ἐξαγαγών
  choice: ó mú wọn jáde
  rationale: Èyí sọ pé áńgẹ́lì náà mú kí wọ́n jáde láìfi èrò ìtọ́sọ́nà kan tí kò ṣe pàtàkì kún ọ̀rọ̀ náà.
- source_word: τε
  choice: ó sì
  rationale: Asopọ̀ “sì” ń so mímú wọn jáde mọ́ ọ̀rọ̀ tí ó tẹ̀ lé e lọ́nà àdánidá ní Yorùbá.
- source_word: εἶπεν
  choice: wí pé
  rationale: “Wí pé” jẹ́ ọ̀nà ọlọ́lá, àdánidá láti ṣí ọ̀rọ̀ tààrà tí ẹsẹ tó tẹ̀ lé e yóò sọ.
theological_decisions:
- issue: Irú ẹni tí ἄγγελος ń tọ́ka sí
  choice: áńgẹ́lì ọ̀run
  alternative: òjíṣẹ́ ènìyàn
  rationale: Ṣíṣí ilẹ̀kùn ọgbà ẹ̀wọ̀n àti mímú àwọn àpọ́sítélì jáde nínú àyíká yìí tọ́ka sí iṣẹ́ agbára àrà ọ̀tọ̀; nítorí náà, “áńgẹ́lì” yẹ ju “òjíṣẹ́” lọ.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú gbólóhùn “áńgẹ́lì Olúwa,” “Olúwa” pa ìlò Bíbélì àti ìtumọ̀ ẹ̀sìn ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé. A tẹ̀ lé ìṣètò ìtàn Gíríìkì ní ti ìtumọ̀, ṣùgbọ́n a tún un ṣe díẹ̀ sí ìṣàn Yorùbá àdánidá.
