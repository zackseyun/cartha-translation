translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “Ẹ” fún ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀. Àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé ìwọ̀n ìtumọ̀ ἱερόν láìfi ìtumọ̀ tóóró kan lé ẹsẹ náà lórí.
