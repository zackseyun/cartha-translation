  to: 'Ṣùgbọ́n ẹnì kan dé, ó sì ròyìn fún wọn pé: “Ẹ wò ó, àwọn ọkùnrin tí ẹ fi sẹ́wọ̀n náà dúró ní tẹ́ńpìlì[a], wọ́n sì ń kọ́ àwọn ènìyàn.”'
