source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹnì kan dé, ó sì ròyìn fún wọn pé: “Ẹ wò ó, àwọn ọkùnrin tí ẹ fi sẹ́wọ̀n náà dúró ní tẹ́ńpìlì[a], wọ́n sì ń kọ́ àwọn ènìyàn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní àgbàlá tẹ́ńpìlì”; ọ̀rọ̀ Gíríìkì náà, ἱερόν, ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: dé
  rationale: Ọ̀rọ̀ yìí ṣàfihàn pé ẹni náà kọ́kọ́ dé kí ó tó ròyìn; “dé” jẹ́ ọ̀nà àdánidá àti ṣókí ní Yorùbá.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ tàbí ìtakora nínú ìtàn hàn, ní ìbámu pẹ̀lú ìṣẹ̀lẹ̀ tó ṣáájú.
- source_word: τις
  choice: ẹnì kan
  rationale: Ó pa ẹni náà mọ́ gẹ́gẹ́ bí ẹni tí a kò dá mọ̀, láìfi akọ tàbí abo kún un.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: ó sì ròyìn fún wọn
  rationale: “Ròyìn” bá fífi ìsọfúnni pàtàkì dé ọ̀dọ̀ àwọn aláṣẹ mu; “fún wọn” pa arọ́pò-orúkọ orísun mọ́.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ṣí ọ̀rọ̀ tí ẹni náà ròyìn sílẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ó pe àfiyèsí àwọn olùgbọ́ sí ìròyìn ìyàlẹ́nu náà, láìlo èdè àtijọ́.
- source_word: οἱ ἄνδρες
  choice: àwọn ọkùnrin
  rationale: Ó tọ́ka sí àwọn ọkùnrin kan pàtó tí a ti fi sẹ́wọ̀n tẹ́lẹ̀.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: tí ẹ fi sínú ẹ̀wọ̀n
  rationale: Ó tú ìṣe fífi wọn sí ibi ìhámọ́ kalẹ̀ ní Yorùbá àdánidá, ó sì pa ìtọ́kasí sí ẹ̀wọ̀n mọ́.
- source_word: εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες
  choice: wà ní tẹ́ńpìlì, wọ́n dúró
  rationale: Ó pa ìtumọ̀ ìwà-níbẹ̀ àti ìdúró tí ọ̀rọ̀ Gíríìkì méjèèjì ní mọ́.
- source_word: διδάσκοντες τὸν λαόν
  choice: wọ́n sì ń kọ́ àwọn ènìyàn
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú “ń kọ́” bá participle present mu; “àwọn ènìyàn” dúró fún λαός nínú àyíká yìí.
