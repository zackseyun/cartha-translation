id: ACT.5.40
reference: Acts 5:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: yo
  text: Wọ́n sì pe àwọn aposteli wọlé; wọ́n nà wọ́n, wọ́n pàṣẹ fún wọn pé kí wọ́n má ṣe sọ̀rọ̀ ní orúkọ Jésù,[a] wọ́n sì dá wọn sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nípa orúkọ Jésù” tàbí “lórí ìpìlẹ̀ orúkọ Jésù.” Àkànlò Gíríìkì náà lè ní sísọ nípa Jésù àti sísọ lábẹ́ àṣẹ rẹ̀ nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: pe … wọlé
  rationale: Ó fi hàn pé wọ́n kọ́kọ́ pe àwọn aposteli wá sí iwájú wọn kí àwọn ìṣe tó kàn tó ṣẹlẹ̀; ọ̀rọ̀ yìí sì já geere ní Yorùbá.
- source_word: ἀποστόλους
  choice: àwọn aposteli
  rationale: “Aposteli” ni ọ̀rọ̀ tí a ti mọ̀ dáadáa ní Yorùbá fún àwọn ẹlẹ́rìí tí a rán lọ ní ọ̀nà pàtàkì; “àwọn ońṣẹ́” tàbí “àwọn aṣojú” lè gbòòrò jù ní àyíká yìí.
- source_word: δείραντες
  choice: wọ́n nà wọ́n
  rationale: δέρω túmọ̀ sí lílu tàbí nínà; “nà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì fi irú ìjìyà pàtó kan kún ohun tí Gíríìkì sọ.
- source_word: παρήγγειλαν
  choice: wọ́n pàṣẹ fún wọn
  rationale: Ó ṣàfihàn àṣẹ líle, kì í ṣe ìmọ̀ràn lásán, ó sì bá ipò ìgbìmọ̀ àti ìdásílẹ̀ wọn mu.
- source_word: μὴ λαλεῖν
  choice: kí wọ́n má ṣe sọ̀rọ̀
  rationale: Ìlò “kí … má ṣe” ni ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí a fi òfin dè; “sọ̀rọ̀” sì bá ọ̀rọ̀ gbangba nípa Jésù mu.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: ní orúkọ Jésù
  rationale: Ó pa àkànlò èdè Bíbélì tí a mọ̀ mọ́, ó sì lè ní ìtumọ̀ sísọ nípa Jésù àti sísọ lábẹ́ àṣẹ rẹ̀ láì dín gbólóhùn náà sí ìtumọ̀ kan ṣoṣo.
- source_word: ἀπέλυσαν
  choice: wọ́n dá wọn sílẹ̀
  rationale: Ó túmọ̀ sí pé wọ́n tú wọn kúrò ní àhámọ́ tàbí ní àkóso wọn; èyí jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ipò òfin yìí.
theological_decisions:
- issue: Ìtumọ̀ àkànlò ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: ní orúkọ Jésù
  alternative: nípa orúkọ Jésù; lórí ìpìlẹ̀ orúkọ Jésù
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí jíjẹ́rìí nípa Jésù àti sísọ lábẹ́ àṣẹ rẹ̀. “Ní orúkọ Jésù” pa ìwọ̀n ìtumọ̀ yẹn mọ́, kò sì yan ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ kan ní pàtó.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìtẹ̀lé àwọn ìṣe inú ẹsẹ náà mọ́.
