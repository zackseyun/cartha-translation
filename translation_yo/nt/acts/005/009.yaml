id: ACT.5.9
reference: Acts 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù sọ fún un pé, “Kí ló dé tí ẹ̀yin méjèèjì fi fohùn ṣọ̀kan[a] láti dán Ẹ̀mí Olúwa[b] wò? Wò ó, ẹsẹ̀ àwọn tí wọ́n sin ọkọ rẹ wà ní ẹnu-ọ̀nà, wọn yóò sì gbé ọ jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi dìtẹ̀ pọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Ẹ̀mí Olúwa”; nínú àyíká yìí, ó ń tọ́ka sí Ẹ̀mí Mímọ́, ṣùgbọ́n ọ̀rọ̀ “mímọ́” kò sí nínú ẹsẹ yìí.
    reason: source_clarity
lexical_decisions:
- source_word: συνεφωνήθη ὑμῖν
  choice: tí ẹ̀yin méjèèjì fi fohùn ṣọ̀kan
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àdéhùn tí Sáfírà àti ọkọ rẹ ṣe pọ̀. ‘Fohùn ṣọ̀kan’ jẹ́ èdè Yorùbá àdánidá tó pa ìtumọ̀ àdéhùn mọ́, láìfi ìtumọ̀ ‘dìtẹ̀’ tí ó lágbára sí i sínú ọ̀rọ̀ náà.
- source_word: πειράσαι
  choice: láti dán ... wò
  rationale: ‘Dán ... wò’ sọ ìṣe fífi Ẹ̀mí Olúwa sínú àdánwò ní kedere; kò sì ní ìtumọ̀ ṣíṣe ìdẹwò sí ẹ̀ṣẹ̀ tí ‘tempt’ lè ní.
- source_word: τὸ πνεῦμα κυρίου
  choice: Ẹ̀mí Olúwa
  rationale: Èyí tẹ̀ lé ìbáṣepọ̀ orúkọ inú Gíríìkì ní ṣókí, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘the Spirit of the Lord’ tàbí ‘the Lord’s Spirit’ ní Yorùbá, láìfikún ‘Mímọ́’ tí kò sí ní gbólóhùn náà.
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ àmì ọ̀rọ̀ tó ń pe àfiyèsí sí ohun tó dé lójijì, ó sì bá èdè Yorùbá òde òní mu.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: ẹsẹ̀ àwọn tí wọ́n sin
  rationale: A pa àwòrán gidi ti Gíríìkì, ‘ẹsẹ̀,’ mọ́ dípò yíyí i sí ‘ìró ìṣísẹ̀’; ‘àwọn tí wọ́n sin’ kò fikún pé ọkùnrin ni wọ́n.
- source_word: τὸν ἄνδρα σου
  choice: ọkọ rẹ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἀνήρ ń tọ́ka sí ọkọ Sáfírà, kì í ṣe ọkùnrin lásán.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: wà lẹ́nu ọ̀nà
  rationale: Ọ̀rọ̀ Yorùbá yìí fi hàn pé àwọn náà ti dé sí ibi ẹnu-ọ̀nà gan-an.
- source_word: ἐξοίσουσίν σε
  choice: wọn yóò sì gbé ọ jáde
  rationale: Ó pa ọ̀rọ̀ ìkìlọ̀ náà mọ́ ní tààràtà, láìfikún ‘òkú rẹ’ bí ó tilẹ̀ jẹ́ pé ikú ni àyíká ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: Τί ὅτι
  choice: Kí ló dé tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè ìbáwí tó ń béèrè ìdí.
theological_decisions:
- issue: Ohun tí ‘Ẹ̀mí Olúwa’ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘Ẹ̀mí Olúwa,’ èyí tó ṣeé lóye ní àyíká Ìṣe 5 gẹ́gẹ́ bí Ẹ̀mí Mímọ́.
  alternative: Kí a túmọ̀ ọ́ ní tààràtà sí ‘Ẹ̀mí Mímọ́.’
  rationale: Ìṣe 5:3 mú kí ìtọ́kasí sí Ẹ̀mí Mímọ́ lágbára, ṣùgbọ́n Gíríìkì ẹsẹ yìí kò lo ọ̀rọ̀ ‘mímọ́.’ Títọ́jú ‘Ẹ̀mí Olúwa’ kò kọjá ohun tí orísun sọ.
- issue: Bí ẹ̀sùn Pétérù ṣe lágbára tó
  choice: ‘Fohùn ṣọ̀kan’ ni a lò, nígbà tí àyíká ọ̀rọ̀ fi hàn pé àdéhùn búburú ni.
  alternative: ‘Dìtẹ̀ pọ̀.’
  rationale: συμφωνέω túmọ̀ sí fífohùn ṣọ̀kan tàbí ṣíṣe àdéhùn. ‘Dìtẹ̀ pọ̀’ bá àyíká mu, ṣùgbọ́n ó fi ìdájọ́ ọ̀rọ̀ tó lágbára ju ohun tí fáàbù náà fúnra rẹ sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀n ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye ní òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ẹ̀yin méjèèjì’ mú ìtumọ̀ àdéhùn láàárín Sáfírà àti ọkọ rẹ hàn, nígbà tí ‘ẹsẹ̀ ... wà lẹ́nu ọ̀nà’ pa àwòrán lílágbára ti orísun Gíríìkì mọ́.
