id: ACT.5.11
reference: Acts 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: yo
  text: Ẹ̀rù ńlá sì bá gbogbo ìjọ àti gbogbo àwọn tí ó gbọ́ nǹkan wọ̀nyí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ìjọ” (ἐκκλησία) sí “àpéjọ” tàbí “àwùjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ba
  rationale: Nínú ọ̀rọ̀ ‘ẹ̀rù ... ba’ ni Yorùbá fi ń sọ lọ́nà àdánidá pé ẹ̀rù dé bá àwọn ènìyàn; èyí pa agbára ìṣẹ̀lẹ̀ inú γίνομαι mọ́ láì túmọ̀ ọ́ ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀.
- source_word: φόβος μέγας
  choice: ẹ̀rù ńlá
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìbẹ̀rù líle lẹ́yìn ìdájọ́ tó dé bá Ananíà àti Sáfírà; ‘ńlá’ sì pa ìtẹnumọ́ μέγας mọ́.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: gbogbo ìjọ
  rationale: ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́; ‘gbogbo’ fi hàn pé ipa náà dé bá gbogbo àwùjọ náà. Ìṣe ọ̀rọ̀ ‘ẹ̀rù ... ba’ ti sọ ìtumọ̀ ἐπί jáde.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: gbogbo àwọn tí ó gbọ́ nǹkan wọ̀nyí
  rationale: Èyí pa ‘gbogbo’ àti ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì sọ participle náà ní Yorùbá àdánidá gẹ́gẹ́ bí ‘àwọn tí ó gbọ́.’
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία
  choice: ìjọ
  alternative: àpéjọ tàbí àwùjọ
  rationale: Nínú Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́. ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún àwùjọ yìí, láìfi ètò ìjọ tàbí ẹ̀kọ́ ẹ̀sìn kan kun ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àkópọ̀ ‘ẹ̀rù ńlá ... ba’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ àti ìṣẹ̀lẹ̀ inú Gíríìkì mọ́.
