  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: yo
  text: Ọ̀pọ̀ àmì àti iṣẹ́ ìyanu ni a ń ṣe láàárín àwọn ènìyàn nípasẹ̀ ọwọ́ àwọn aposteli; gbogbo wọn sì wà papọ̀[a] ní Ìloro Solomoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ọkàn kan.” Ọ̀rọ̀ Gíríìkì náà ń fi ìṣọ̀kan wọn hàn, pẹ̀lú pé wọ́n péjọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Àgbàlá òpó Solomoni.” Èyí jẹ́ ibi tí a bò, tí àwọn òpó sì tò lẹ́gbẹ̀ẹ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: nípasẹ̀ ọwọ́ àwọn aposteli
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé àwọn aposteli ni Ọlọ́run lò gẹ́gẹ́ bí irinṣẹ́, láìsọ ọ̀rọ̀ náà di ohun tí ó túmọ̀ sí ju bí orísun ṣe sọ lọ.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kì í ṣe pé ó ń fi ìtakora líle hàn. ‘Sì’ jẹ́ àsopọ̀ àdánidá ní Yorùbá, a sì gbé e sí abala kejì láti bá ìṣàn gbolóhùn mu.
- source_word: ἐγίνετο
  choice: ni a ń ṣe
  rationale: Àkókò imperfect náà ń tọ́ka sí iṣẹ́ tí ń bá a lọ tàbí tí a ń ṣe léraléra ní àkókò ìtàn náà.
- source_word: σημεῖα καὶ τέρατα
  choice: àmì àti iṣẹ́ ìyanu
  rationale: ‘Àmì’ pa ìtumọ̀ iṣẹ́ tí ń tọ́ka sí ohun kan mọ́; ‘iṣẹ́ ìyanu’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún τέρατα láìfi àlàyé ‘àgbàyanu’ kún orísun.
- source_word: πολλὰ
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ó ṣàpẹẹrẹ iye púpọ̀, ó sì kan ‘àmì’ àti ‘iṣẹ́ ìyanu’ papọ̀.
- source_word: ἐν τῷ λαῷ
  choice: láàárín àwọn ènìyàn
  rationale: Ó fi ààyè tàbí àwùjọ tí iṣẹ́ náà ti ń ṣẹlẹ̀ hàn, láìfi kún un pé àwọn ènìyàn Ísírẹ́lì nìkan ni.
- source_word: ὁμοθυμαδὸν
  choice: papọ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìpéjọpọ̀; àlàyé ìṣọ̀kan èrò inú ọ̀rọ̀ Gíríìkì wà nínú àkọsílẹ̀ ẹsẹ̀.
- source_word: ἅπαντες
  choice: gbogbo wọn
  rationale: Ó pa ìtumọ̀ tó kárí gbogbo ẹgbẹ́ tí a ń tọ́ka sí mọ́, ṣùgbọ́n kò pinnu pé àwọn aposteli nìkan tàbí gbogbo àwọn onígbàgbọ́ ni.
- source_word: Στοᾷ Σολομῶντος
  choice: Ìloro Solomoni
  rationale: ‘Ìloro’ jẹ́ ọ̀rọ̀ Yorùbá fún ibi ìrìn tí a bò, tí àwọn òpó sì tò lẹ́gbẹ̀ẹ́ rẹ̀; ó bá irú ilé tí στοά ń tọ́ka sí mu.
theological_decisions:
- issue: Ẹni tí ‘gbogbo wọn’ ń tọ́ka sí
  choice: A fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sílẹ̀ láìdín in kù sí àwọn aposteli nìkan tàbí láti sọ pé gbogbo àwọn onígbàgbọ́ ni.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ‘gbogbo àwọn aposteli’ tàbí ‘gbogbo àwọn onígbàgbọ́.’
  rationale: Gíríìkì kò sọ ẹni tí ἅπαντες ń tọ́ka sí ní tààràtà. Ìtumọ̀ náà pa àìdánilójú gidi yìí mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Aposteli’ jẹ́ ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀; ‘Ìloro’ pa àwòrán ibi ìkọ́lé náà mọ́.
