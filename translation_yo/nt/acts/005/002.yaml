source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: yo
  text: Ó sì fi díẹ̀ nínú iye owó títà náà pamọ́ fún ara rẹ̀[a], aya rẹ̀ náà sì mọ̀ nípa èyí; lẹ́yìn náà, ó mú apá kan wá, ó sì gbé e kalẹ̀ lẹ́bàá ẹsẹ̀ àwọn àpọ́sítélì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fi díẹ̀ nínú iye owó títà náà pamọ́ ní ìkọ̀kọ̀”; ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ohun kan pamọ́ tàbí yíyà á sọ́tọ̀ fún ara ẹni ní ọ̀nà àìṣòótọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “lẹ́bàá ẹsẹ̀ àwọn àpọ́sítélì”; èyí jẹ́ ọ̀nà gidi láti sọ pé ó gbé owó náà síwájú wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: fi apá kan ... pa mọ́ fún ara rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ fífi ohun kan pamọ́ tàbí yíyà á sọ́tọ̀ fún ara ẹni ní ọ̀nà àìṣòótọ́; gbólóhùn Yorùbá yìí pa agbára ìtumọ̀ búburú náà mọ́ láìfi èdè òfin kún un.
- source_word: ἀπὸ τῆς τιμῆς
  choice: nínú owó tí ó tà á
  rationale: τιμή níbí tọ́ka sí iye owó tí ó rí gbà láti inú ohun tí ó tà; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘nínú iye owó títà náà.’
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: aya rẹ̀ sì mọ̀ nípa rẹ̀ pẹ̀lú
  rationale: Èyí fi ipò tó bá ìṣe náà rìn hàn pé aya rẹ̀ mọ ohun tí ó ṣe; ‘pẹ̀lú’ ṣàfihàn καί.
- source_word: ἐνέγκας μέρος τι
  choice: ó sì mú apá kan wá
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe tó tẹ̀ lé ara rẹ̀ ní Yorùbá; ‘apá kan’ pa àìdánimọ̀ μέρος τι mọ́.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: ó gbé e sí ẹsẹ̀ àwọn aposteli
  rationale: Èyí pa àwòrán gidi inú ọ̀rọ̀ Gíríìkì àti ọ̀nà ìsọ̀rọ̀ tí Ìṣe Àwọn Aposteli máa ń lò mọ́.
theological_decisions:
- issue: Agbára ìwà búburú nínú ìṣe Ananíà
  choice: Fi hàn pé ó pa apá owó náà mọ́ fún ara rẹ̀ ní ọ̀nà àìṣòótọ́.
  alternative: Ó dá apá kan nínú owó náà dúró.
  rationale: νοσφίζομαι àti àyíká ìtàn náà fi ìfipamọ́ ẹ̀tàn hàn, kì í ṣe pé ó kàn fi apá tirẹ̀ sílẹ̀ lọ́nà tí kò ní ẹ̀bi.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A pa ìtẹ̀síwájú àwọn ọ̀rọ̀-ìṣe mọ́ ní ọ̀nà àdánidá, a sì lo ‘aposteli’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀.
