id: ACT.5.37
reference: Acts 5:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: yo
  text: Lẹ́yìn èyí, Júdásì ará Gálílì dìde ní àwọn ọjọ́ ìkànìyàn[a], ó sì mú kí àwọn ènìyàn yapa láti tẹ̀ lé e[b]. Òun náà ṣègbé, gbogbo àwọn tí ó sì gba ọ̀rọ̀ rẹ̀ gbọ́ ni a tú ká.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò ìforúkọsílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìkànìyàn tàbí ìforúkọsílẹ̀ tí ìjọba pàṣẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó mú kí àwọn ènìyàn fi ohun tí wọ́n ti ń tẹ̀ lé sílẹ̀, kí wọ́n sì tẹ̀ lé e.” Ọ̀rọ̀-ìṣe náà lè ní ìtumọ̀ mímú kí ènìyàn yapa kúrò nínú ìfaramọ́ rẹ̀ tẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Lẹ́yìn èyí
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ohun tàbí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ, ó sì fi ìtẹ̀lé àkókò hàn; kò pọndandan pé kí ó túmọ̀ sí ‘lẹ́yìn ọkùnrin yìí.’
- source_word: ἀνέστη
  choice: dìde
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé olórí kan yọjú tàbí gbé ara rẹ̀ dìde, kì í ṣe àjíǹde kúrò nínú òkú.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Júdásì ará Gálílì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni àti ibi tí ó ti wá.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: ní àwọn ọjọ́ ìkànìyàn
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì ‘ní àwọn ọjọ́’ mọ́, ‘ìkànìyàn’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún census.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: ó sì mú kí àwọn ènìyàn yapa láti tẹ̀ lé e
  rationale: ‘Mú kí ... yapa’ fi ipa causative ἀπέστησε hàn, ‘láti tẹ̀ lé e’ sì ṣàfihàn ὀπίσω αὐτοῦ láìfi ọ̀rọ̀ ìṣọ̀tẹ̀ tí kò farahàn ní tààrà sínú ẹsẹ náà.
- source_word: λαὸν
  choice: àwọn ènìyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé λαός jẹ́ ẹyọ ní Gíríìkì, ó ní ìtumọ̀ àkójọpọ̀; ‘àwọn ènìyàn’ jẹ́ àdánidá ní Yorùbá, kò sì túmọ̀ sí gbogbo orílẹ̀-èdè náà.
- source_word: κἀκεῖνος
  choice: Òun náà
  rationale: Ó pa ìtẹnumọ́ àti ìtẹ̀síwájú inú ‘àti ẹni náà pẹ̀lú’ mọ́ ní Yorùbá tó rọrùn.
- source_word: ἀπώλετο
  choice: ṣègbé
  rationale: Ó sọ pé ó kú tàbí parun láìsọ ọ̀nà pàtó tí ikú rẹ̀ gbà dé, gẹ́gẹ́ bí Gíríìkì ṣe fi sílẹ̀.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: gbogbo àwọn tí ó sì gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: Gbólóhùn náà fi hàn pé ọ̀rọ̀ rẹ̀ yí wọn lérò tàbí pé wọ́n gba ohun tí ó ń sọ; kò tún lo ọ̀rọ̀ ‘tẹ̀ lé’ tí a ṣẹ̀ṣẹ̀ lò nínú abala tó ṣáájú.
- source_word: διεσκορπίσθησαν
  choice: ni a tú ká
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tí ó tún pa ohùn ìṣe àfaragà Gíríìkì mọ́.
theological_decisions:
- issue: Àpèjúwe ìgbìmọ̀ Júdásì nípa ìṣèlú àti ìtàn
  choice: A sọ pé ó mú kí àwọn ènìyàn yapa kí wọ́n sì tẹ̀ lé e, láìpe ìgbésẹ̀ náà ní ìṣọ̀tẹ̀ ní tààrà.
  alternative: ‘Ó darí àwọn ènìyàn sínú ìṣọ̀tẹ̀ láti tẹ̀ lé e.’
  rationale: Bí ìtàn ṣe lè so Júdásì pọ̀ mọ́ ìṣọ̀tẹ̀, ọ̀rọ̀ Gíríìkì ẹsẹ yìí fúnra rẹ̀ tẹnumọ́ yíyapa àti títẹ̀lé e, kò sì lo ọ̀rọ̀-orúkọ pàtó fún ìṣọ̀tẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Júdásì’ àti ‘Gálílì’ tẹ̀ lé ìrísí orúkọ tí ó wọ́pọ̀ nínú Yorùbá; ‘ìkànìyàn,’ ‘ṣègbé,’ àti ‘a tú ká’ jẹ́ ọ̀rọ̀ àdánidá tí kò wuwo jù.
