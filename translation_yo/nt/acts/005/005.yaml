source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Ananíà gbọ́ ọ̀rọ̀ wọ̀nyí, ó ṣubú lulẹ̀, ó sì kú.[a] Ẹ̀rù ńlá sì bá gbogbo àwọn tí ó gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ gidi sí i: “ó mí èémí ìkẹyìn” tàbí “ó mí ẹ̀mí jáde.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: nígbà tí ... gbọ́
  rationale: Ọ̀rọ̀ aláṣe tó wà ní àkókò ìsinsìnyí ní Gíríìkì ń tọ́ka sí àkókò ìṣẹ̀lẹ̀ níbí; èdè yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà ìtàn àti ìyàtọ̀ díẹ̀ hàn lẹ́yìn ọ̀rọ̀ Peteru.
- source_word: λόγους τούτους
  choice: ọ̀rọ̀ wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ọ̀rọ̀ tí Peteru ṣẹ̀ṣẹ̀ sọ, èyí sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πεσὼν
  choice: ó ṣubú lulẹ̀
  rationale: Ó pa àwòrán ìṣe ara tí Gíríìkì ní mọ́, láì túmọ̀ sí ohun tó ju ọ̀rọ̀ náà lọ.
- source_word: ἐξέψυξεν
  choice: ó sì kú
  rationale: Ìtumọ̀ rẹ̀ nínú ìtàn yìí ni pé ó kú; àlàyé ìtumọ̀ gidi tó ní í ṣe pẹ̀lú mímí ìkẹyìn wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐγένετο φόβος μέγας ἐπὶ πάντας
  choice: Ẹ̀rù ńlá sì ba gbogbo
  rationale: ‘Ẹ̀rù ... ba’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbẹ̀rù tó dé bá ènìyàn, ó sì mú agbára gbólóhùn Gíríìkì jáde.
- source_word: τοὺς ἀκούοντας
  choice: àwọn tí ó gbọ́
  rationale: Ó pa àìsọ ohun pàtó tí wọ́n gbọ́ mọ́, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: Ἁνανίας
  choice: Ananíà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Irú ikú Ananíà àti ohun tó fa á
  choice: A sọ ìṣẹ̀lẹ̀ náà ní tààrà pé ó ṣubú, ó sì kú, láì sọ ọ̀nà pàtó tí ikú náà gbà ṣẹlẹ̀.
  alternative: Kí a sọ pé ìpayà ló pa á, tàbí pé Ọlọ́run kọlù ú pa ní tààrà.
  rationale: Gíríìkì sọ pé ó ṣubú, ó sì kú, ṣùgbọ́n kò ṣàlàyé ohun tó fa ikú náà tàbí ọ̀nà tí ó gbà ṣẹlẹ̀. Ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ó ṣubú lulẹ̀’ láti pa àwòrán orísun mọ́, àti ‘ẹ̀rù ńlá ... ba’ gẹ́gẹ́ bí àṣà ọ̀rọ̀ Yorùbá àdánidá.
