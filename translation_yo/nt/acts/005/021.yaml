id: ACT.5.21
reference: Acts 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, wọ́n wọ inú àgbègbè tẹ́ńpìlì ní kùtùkùtù òwúrọ̀, wọ́n sì ń kọ́ni. Nígbà tí olórí àlùfáà àti àwọn tí ó wà pẹ̀lú rẹ̀ dé, wọ́n pe Sànhẹ́dírìn àti àjọ gbogbo àwọn àgbààgbà ọmọ Ísírẹ́lì[a] jọ, wọ́n sì ránṣẹ́ lọ sí ilé ẹ̀wọ̀n láti mú wọn wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ìgbìmọ̀ Ísírẹ́lì” tàbí “gbogbo àjọ àwọn àgbààgbà Ísírẹ́lì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Ọ̀rọ̀ participle aorist náà tọ́ka sí àṣẹ áńgẹ́lì nínú ẹsẹ tó ṣáájú, ó sì fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Ó túmọ̀ sí àkókò ìdájí òwúrọ̀; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá tí ó ṣe kedere.
- source_word: ἱερόν
  choice: àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; ‘àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ náà hàn.
- source_word: ἐδίδασκον
  choice: wọ́n sì ń kọ́ àwọn ènìyàn
  rationale: Àmì imperfect fi iṣẹ́ tí ń lọ lọ́wọ́ hàn; fífi ‘ń’ lò pa ìtumọ̀ yẹn mọ́. ‘Àwọn ènìyàn’ jẹ́ àfikún tí ọ̀rọ̀-ìṣe Yorùbá ń fẹ́ ní àyíká yìí, láì pinnu ẹgbẹ́ kan pàtó.
- source_word: Παραγενόμενος
  choice: nígbà tí ... dé
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní ọ̀nà àkókò tí ó ṣe kedere.
- source_word: οἱ σὺν αὐτῷ
  choice: àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Ó pa àìsọ pàtó ẹni tí ẹgbẹ́ náà jẹ́ mọ́, gẹ́gẹ́ bí Gíríìkì.
- source_word: συνεκάλεσαν
  choice: wọ́n pe ... jọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún pípe ìgbìmọ̀ kan láti péjọ.
- source_word: συνέδριον
  choice: Sàhẹ́́ńdírìn
  rationale: Orúkọ ìtàn fún ìgbìmọ̀ alákòóso àwọn Júù ni àyíká yìí, ó sì pa ìtọ́kasí pàtó náà mọ́.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: gbogbo ìgbìmọ̀ àwọn àgbààgbà ọmọ Ísírẹ́lì
  rationale: γερουσία jẹ́ ara ìgbìmọ̀ àwọn àgbààgbà; ‘ọmọ Ísírẹ́lì’ pa àpèjúwe ìdílé-orílẹ̀-èdè náà mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
- source_word: δεσμωτήριον
  choice: ọgbà ẹ̀wọ̀n
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ibi ìhámọ́ mu.
- source_word: ἀχθῆναι αὐτούς
  choice: pé kí a mú àwọn aposteli náà wá
  rationale: Infinitive passive náà sọ ète ìránṣẹ́ wọn; ìṣètò ‘pé kí a mú ... wá’ jẹ́ àdánidá ní Yorùbá. ‘Àwọn aposteli’ mú ẹni tí arọ́pò-orúkọ náà tọ́ka sí ṣe kedere láti àyíká.
theological_decisions:
- issue: Ìtumọ̀ τῶν υἱῶν Ἰσραήλ
  choice: ọmọ Ísírẹ́lì
  alternative: àwọn ọmọ Ísírẹ́lì / ti Ísírẹ́lì
  rationale: Àpèjúwe ìdílé-orílẹ̀-èdè tí ó wà nínú Gíríìkì ni a pa mọ́, láì sọ ọ́ di ẹ̀kọ́ ìjọ kan; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé ọ̀nà àdánidá mìíràn.
- issue: Ìbáṣepọ̀ συνέδριον àti πᾶσαν τὴν γερουσίαν
  choice: Sàhẹ́́ńdírìn àti gbogbo ìgbìmọ̀ àwọn àgbààgbà
  alternative: Sàhẹ́́ńdírìn, ìyẹn gbogbo ìgbìmọ̀ àwọn àgbààgbà
  rationale: καί lè fi ẹgbẹ́ méjì tàbí àlàyé tó gbòòrò sí i hàn. A pa ìṣọ̀kan ‘àti’ Gíríìkì mọ́, láì pinnu bóyá gbólóhùn kejì jẹ́ apposition pátápátá.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘tẹ́ńpìlì,’ ‘Sàhẹ́́ńdírìn,’ àti ‘aposteli’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìtàn tí ó ti wọ́pọ̀; a sì fi àmì ohùn sí ibi tí ó bá àdánidá mu.
