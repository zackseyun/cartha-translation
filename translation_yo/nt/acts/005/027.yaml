  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n mú wọn dé, wọ́n sì mú wọn dúró níwájú ìgbìmọ̀ náà[a]. Olórí àlùfáà sì bi wọ́n léèrè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Sànhẹ́dírìn.” Ọ̀rọ̀ Gíríìkì συνέδριον tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Nígbà tí wọ́n sì mú wọn dé
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́gbẹ́ aorist yìí ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì fi hàn pé wọ́n kọ́kọ́ mú àwọn aposteli dé; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” mú iṣẹ́ yẹn ṣẹ ní Yorùbá láìfi ìtakò tí kò sí sínú rẹ̀.
- source_word: ἔστησαν
  choice: wọ́n mú wọn dúró níwájú
  rationale: ἵστημι níbí túmọ̀ sí láti mú ẹnì kan dúró tàbí gbé e kalẹ̀ níwájú ẹgbẹ́ adájọ́; gbolohun yìí pa àwòrán ìgbẹ́jọ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τῷ συνεδρίῳ
  choice: níwájú ìgbìmọ̀ náà
  rationale: συνέδριον tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù. Pẹ̀lú ọ̀rọ̀-ìṣe “mú ... dúró,” “níwájú” sọ ipò ìgbẹ́jọ́ náà ní kedere.
- source_word: ἐπηρώτησεν
  choice: bi wọ́n léèrè
  rationale: ἐπερωτάω túmọ̀ sí bí léèrè tàbí fọ̀rọ̀ wáni lẹ́nu wò; ní àyíká ìgbẹ́jọ́ yìí, “bi wọ́n léèrè” jẹ́ ọ̀rọ̀ tó bójú mu láìmú agbára rẹ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: ὁ ἀρχιερεὺς
  choice: Àlùfáà Àgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún olórí àlùfáà àwọn Júù ní àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ συνέδριον
  choice: ìgbìmọ̀ náà
  alternative: Sànhẹ́dírìn
  rationale: A túmọ̀ ọ̀rọ̀ Gíríìkì náà gẹ́gẹ́ bí orúkọ àpapọ̀ dípò lílo orúkọ ìbílẹ̀ tí a yá. Àlàyé ìsàlẹ̀ fi ẹni tí ìgbìmọ̀ náà jẹ́ hàn láìfi ìtumọ̀ tóóró sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
