  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ Gíríìkì dáadáa: wọ́n kọ́kọ́ mú wọn wọlé, wọ́n sì mú wọn dúró níwájú ìgbìmọ̀ náà; lẹ́yìn náà olórí àlùfáà béèrè lọ́wọ́ wọn. “Mú ... dúró níwájú” jẹ́ ìtumọ̀ tó péye fún ἔστησαν ní àyíká ìgbẹ́jọ́. Àtúnṣe náà kan ipò àsopọ̀ δέ àti ìtumọ̀ ὁ ἀρχιερεύς nìkan.'
