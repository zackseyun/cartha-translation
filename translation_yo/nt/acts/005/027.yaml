  terminology: “Ìgbìmọ̀ náà” pa ìtumọ̀ gbogbogbò συνέδριον mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé pé Sànhẹ́dírìn ni ìgbìmọ̀ yẹn. “Olórí àlùfáà” yẹ fún ὁ ἀρχιερεύς; “Àlùfáà Àgbà” lè túmọ̀ sí àlùfáà tí ó dàgbà tàbí àlùfáà àgbà kan, kì í sì jẹ́ ọ̀rọ̀ ìdúróṣinṣin tó dára jù lọ fún ọ́fíìsì pàtó yìí.
