translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘aposteli’ fún ìtọ́kasí arọ́pò-orúkọ kí gbolohun má bà a dàrú.
