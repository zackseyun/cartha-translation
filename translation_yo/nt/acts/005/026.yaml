source:
  edition: SBLGNT
  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: yo
  text: Nígbà náà ni olórí ẹ̀ṣọ́ tẹ́ńpìlì[a] bá àwọn olùṣọ́ lọ, ó sì mú àwọn aposteli wá láìlo ipá, nítorí wọ́n bẹ̀rù àwọn ènìyàn, kí a má bàa sọ wọ́n ní òkúta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá ẹ̀ṣọ́.” Ọ̀rọ̀ Gíríìkì στρατηγός níbí ń tọ́ka sí olórí ẹ̀ṣọ́ tẹ́ńpìlì, òṣìṣẹ́ tó ń bójú tó ètò àti ààbò ní tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: olórí ẹ̀ṣọ́ tẹ́ńpìlì
  rationale: Nínú ìṣẹ̀lẹ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí òṣìṣẹ́ tó ń ṣàkóso ààbò àti ètò ní tẹ́ńpìlì, kì í ṣe ọ̀gágun Róòmù. Fífi ‘tẹ́ńpìlì’ kún un mú ẹni tí a ń sọ̀rọ̀ rẹ̀ ṣe kedere.
- source_word: ὑπηρέταις
  choice: àwọn ọlọ́pàá
  rationale: Àwọn wọ̀nyí ni àwọn òṣìṣẹ́ abẹ́ olórí ẹ̀ṣọ́ tí wọ́n ń mú òfin àti ètò tẹ́ńpìlì ṣẹ; ‘àwọn ọlọ́pàá’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó yé kedere nínú àyíká yìí.
- source_word: ἤγαγεν αὐτούς
  choice: ó sì mú àwọn aposteli wá
  rationale: ἄγω lè túmọ̀ sí ‘darí,’ ‘mú,’ tàbí ‘mú wá.’ Àyíká fi hàn pé wọ́n ń mú àwọn aposteli lọ síwájú ìgbìmọ̀; pípa orúkọ wọn mọ́ ṣe àfihàn ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní Yorùbá.
- source_word: οὐ μετὰ βίας
  choice: ṣùgbọ́n kì í ṣe pẹ̀lú ipá
  rationale: 'Èyí pa ọ̀nà tí wọ́n gbà mú wọn láṣẹ̀ mọ́: wọn kò lo agbára tàbí ìwà ipá.'
- source_word: ἐφοβοῦντο
  choice: wọ́n bẹ̀rù
  rationale: Ọ̀rọ̀-ìṣe àìpé Gíríìkì ń ṣàpèjúwe ìbẹ̀rù tí ó wà lásìkò náà; ‘wọ́n bẹ̀rù’ jẹ́ àdánidá ní Yorùbá.
- source_word: τὸν λαόν
  choice: àwọn ènìyàn
  rationale: λαός níbí tọ́ka sí àwọn ènìyàn tí ó péjọ, kì í ṣe dandan sí ogunlọ́gọ̀ aláriwo; ‘àwọn ènìyàn’ pa ìtumọ̀ gbòòrò náà mọ́.
- source_word: μὴ λιθασθῶσιν
  choice: pé wọ́n lè sọ wọ́n ní òkúta
  rationale: μή pẹ̀lú subjunctive lẹ́yìn ọ̀rọ̀ ìbẹ̀rù ń sọ ohun tí wọ́n ń bẹ̀rù pé ó lè ṣẹlẹ̀. Ìtumọ̀ yìí pa ìṣe aláìlórúkọ mọ́, láì sọ ta ni yóò sọ wọ́n ní òkúta.
- source_word: τότε ἀπελθὼν
  choice: Nígbà náà ni ... bá ... lọ
  rationale: Participle náà ń bá ìṣe pàtàkì lọ nínú ìtẹ̀síwájú ìtàn; ìṣètò yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ‘nígbà náà’ mọ́.
