id: ACT.5.4
reference: Acts 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: yo
  text: Nígbà tí a kò tíì tà á, ṣé kì í ṣe pé ó ṣì jẹ́ tìrẹ? Lẹ́yìn tí a tà á, ṣé owó títà á kò wà lábẹ́ àṣẹ rẹ̀[a]? Èé ṣe tí o fi pinnu ọ̀ràn yìí nínú ọkàn rẹ? Kì í ṣe àwọn ènìyàn ni o purọ́ fún, bí kò ṣe Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣé kò sí ní ìkáwọ́ rẹ?” tàbí “ṣé o kò lágbára lórí rẹ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: nígbà tí ilẹ̀ náà kò tíì tà, ṣé kì í ṣe tìrẹ ni?
  rationale: Ọ̀rọ̀ náà tọ́ka sí ipò ohun-ìní náà kí a tó tà á. Ìtumọ̀ yìí pa ìtẹnumọ́ pé ó ṣì jẹ́ ti Ananíà mọ́, bó tilẹ̀ jẹ́ pé àtúnṣe gbolohun jẹ́ dandan fún Yorùbá àdánidá.
- source_word: σοὶ
  choice: tìrẹ
  rationale: Dative náà ní ìtumọ̀ ohun-ìní ní àyíká yìí; “tìrẹ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ohun náà jẹ́ tirẹ̀.
- source_word: πραθέν
  choice: lẹ́yìn tí ó tà
  rationale: Ó pa ohùn àìṣe-ẹni-mọ̀ (passive) mọ́ ní Yorùbá àdánidá, láì fi ẹni tó tà á kun ọ̀rọ̀ náà.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: owó náà kò wà lábẹ́ àṣẹ rẹ̀
  rationale: “Lábẹ́ àṣẹ rẹ̀” ṣàfihàn ẹ̀tọ́ àti agbára láti pinnu ohun tí yóò ṣe pẹ̀lú owó náà. Fífi “owó náà” hàn jẹ́ ohun tí àyíká àti ìtumọ̀ títà ń béèrè fún ní Yorùbá.
- source_word: τί ὅτι
  choice: Èé ṣe tí
  rationale: Ìbéèrè yìí ní agbára ìbáwí àti ìwádìí; “Èé ṣe tí” jẹ́ ọ̀nà Yorùbá àdánidá tó pa agbára náà mọ́.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: o fi pinnu ... nínú ọkàn rẹ
  rationale: Ìfihàn náà túmọ̀ sí ìpinnu inú tàbí ète tí ẹni gbà kalẹ̀. “Pinnu ... nínú ọkàn” pa èdè ọkàn mọ́, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ọ̀ràn yìí
  rationale: πρᾶγμα gbooro sí ọ̀ràn, ohun, tàbí ìṣe. “Ọ̀ràn yìí” kò fi ìtumọ̀ àfikún bí “ète búburú” sínú ọrọ̀ náà.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Kì í ṣe fún àwọn ènìyàn ni o purọ́, bí kò ṣe fún Ọlọ́run
  rationale: Ó pa ìtakora tó lágbára láàárín ènìyàn àti Ọlọ́run mọ́. “Àwọn ènìyàn” jẹ́ ìtumọ̀ Yorùbá tó pé fún ἀνθρώποις, tí ó ń tọ́ka sí gbogbo ènìyàn, kì í ṣe ọkùnrin nìkan.
theological_decisions:
- issue: Ìtumọ̀ nípa ìwà Ọlọ́run ti Ẹ̀mí Mímọ́ nínú àyíká ẹsẹ 3
  choice: Túmọ̀ τῷ θεῷ ní tààràtà sí “fún Ọlọ́run,” láì fi àlàyé kún un.
  alternative: “Fún Ọlọ́run, ìyẹn ni, fún Ẹ̀mí Mímọ́.”
  rationale: Ẹsẹ yìí fúnra rẹ̀ sọ “Ọlọ́run.” Àyíká ẹsẹ 3 ṣe pàtàkì fún ẹ̀kọ́ nípa Ẹ̀mí Mímọ́, ṣùgbọ́n kò yẹ kí ìtumọ̀ fi àlàyé tí kò sí nínú ẹsẹ náà kún ọ̀rọ̀ rẹ̀.
- issue: Ẹ̀tọ́ Ananíà lórí ilẹ̀ àti owó títà rẹ̀
  choice: Ṣàfihàn pé ohun-ìní náà jẹ́ tirẹ̀ àti pé owó náà wà lábẹ́ àṣẹ rẹ̀.
  alternative: Ṣàfihàn pé ó kàn ní ohun-ìní náà láì tẹnumọ́ òmìnira rẹ̀ láti pinnu ohun tó máa ṣe pẹ̀lú rẹ̀.
  rationale: Àríyànjiyàn Peteru ni pé ẹ̀ṣẹ̀ náà kì í ṣe àìfi gbogbo ohun-ìní fún wọn, bí kò ṣe irọ́ àti ẹ̀tàn. “Lábẹ́ àṣẹ rẹ̀” pa kókó náà mọ́.
- issue: Ìtumọ̀ ἀνθρώποις
  choice: Lo “àwọn ènìyàn.”
  alternative: Lo “àwọn ọkùnrin.”
  rationale: Nínú Gíríìkì, ἀνθρώποις ń tọ́ka sí àwọn ẹ̀dá ènìyàn lápapọ̀, kì í ṣe akọ nìkan. “Àwọn ènìyàn” jẹ́ deede, ó sì pa ìtakora ènìyàn—Ọlọ́run mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ìbéèrè “ṣé ...?” fún ìbéèrè àsọyé méjèèjì, a sì lo “àwọn ènìyàn” dípò ọ̀rọ̀ tó lè dà bí ẹni pé ọkùnrin nìkan ni a ń tọ́ka sí.
