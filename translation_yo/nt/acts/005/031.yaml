language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: yo
  text: Ọlọ́run gbé ẹni yìí ga ní ọwọ́ ọ̀tún rẹ̀ gẹ́gẹ́ bí Olórí àti Olùgbàlà[a], láti fún Ísírẹ́lì ní ìrònúpìwàdà àti ìdáríjì ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run fi ọwọ́ ọ̀tún rẹ̀ gbé ẹni yìí ga gẹ́gẹ́ bí Olórí àti Olùgbàlà.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọwọ́ ọ̀tún Ọlọ́run gẹ́gẹ́ bí ohun èlò ìgbéga, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó ṣeé ṣe kó túmọ̀ sí pé Ọlọ́run gbé Jésù ga sí ipò ọlá tó ga jù lọ ní ọwọ́ ọ̀tún rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: ẹni yìí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ní ìtẹnumọ́, ó sì ń tọ́ka sí Jésù ní pàtó; “ẹni yìí” pa agbára yẹn mọ́.
- source_word: ἀρχηγὸν
  choice: Olórí
  rationale: Ó lè túmọ̀ sí ẹni tí ó ń darí tàbí ẹni tí ó wà ní ipò iwájú. Ní ọ̀rọ̀ ìgbéga yìí, “Olórí” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì fi ipò àṣẹ hàn láìfi ìtumọ̀ àfikún kún un.
- source_word: σωτῆρα
  choice: Olùgbàlà
  rationale: Èyí ni ìtumọ̀ Yorùbá tó mọ́gbọ́n dání fún ẹni tí ń gbà là, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàlà inú ọ̀rọ̀ náà mọ́.
- source_word: ὕψωσεν
  choice: gbé ... ga
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń sọ nípa fífi Jésù sí ipò ọlá àti àṣẹ, kì í ṣe àjíǹde nìkan.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: sí ọwọ́ ọ̀tún rẹ̀
  rationale: 'Èyí fi ìtumọ̀ ipò hàn: Ọlọ́run gbé Jésù ga sí ipò ọlá tó ga jù lọ ní ọwọ́ ọ̀tún rẹ̀. Bí ó tilẹ̀ jẹ́ pé gírámà Gíríìkì tún lè túmọ̀ sí ohun èlò, a pa ìtumọ̀ yẹn mọ́ nínú àlàyé ìsàlẹ̀.'
- source_word: τοῦ δοῦναι
  choice: láti fi ... fún
  rationale: Infinitive náà ń sọ ète; “láti fi ... fún” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète àti ẹni tí a fún hàn.
- source_word: μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: “Ìrònúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ sí yíyí ọkàn àti ìgbésí ayé padà sí Ọlọ́run, kì í ṣe àtúnrò lasán.
- source_word: τῷ Ἰσραὴλ
  choice: fún Ísírẹ́lì
  rationale: Dative náà tọ́ka sí Ísírẹ́lì gẹ́gẹ́ bí ẹni tí a fún ní ìrònúpìwàdà àti ìdáríjì.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: ìdáríjì ẹ̀ṣẹ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún ìdáríjì àwọn ẹ̀ṣẹ̀, ó sì bá ìtumọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ ìgbéga Jésù ní ọwọ́ ọ̀tún Ọlọ́run
  choice: Ẹsẹ náà sọ pé Ọlọ́run gbé Jésù ga sí ipò ọlá àti àṣẹ tó ga jù lọ ní ọwọ́ ọ̀tún rẹ̀.
  alternative: A tún lè ka gbólóhùn náà gẹ́gẹ́ bí “Ọlọ́run fi ọwọ́ ọ̀tún rẹ̀ gbé e ga.”
  rationale: Àyíká ọ̀rọ̀ àti àṣà ọ̀rọ̀ Majẹ̀mú Tuntun nípa jíjókòó ní ọwọ́ ọ̀tún Ọlọ́run ṣe àtìlẹ́yìn fún ìtumọ̀ ipò; síbẹ̀, dative Gíríìkì lè jẹ́ ohun èlò, nítorí náà a kò pa ìtumọ̀ kejì rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; “Olórí” àti “Olùgbàlà” jẹ́ ọ̀rọ̀ tó mọ́ ní àyíká Bíbélì, “ìrònúpìwàdà” sì pa ìtumọ̀ yíyí padà sí Ọlọ́run mọ́.
