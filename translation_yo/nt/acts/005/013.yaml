  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: yo
  text: Ṣùgbọ́n nínú àwọn yòókù, kò sí ẹnì kankan tó láyà láti dara pọ̀ mọ́ wọn; kàkà bẹ́ẹ̀, àwọn ènìyàn ń bu ọlá fún wọn gidigidi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Ṣùgbọ́n nínú àwọn yòókù
  rationale: Ó pa ìtumọ̀ ẹgbẹ́ àwọn tó ṣẹ́ kù mọ́, láì sọ ní pàtó ẹni tí wọ́n jẹ́ níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- source_word: ἐτόλμα
  choice: tó láyà
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìgboyà láti ṣe ohun tí ó lèwu tàbí tí ń bani lẹ́rù.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: láti dara pọ̀ mọ́ wọn
  rationale: Ó mú èrò fífi ara mọ́ ẹgbẹ́ wọn hàn ní Yorùbá òde òní, láì fi ìtumọ̀ tí ó ju ti orísun lọ kún un.
- source_word: ἀλλ’
  choice: kàkà bẹ́ẹ̀
  rationale: Ní àyíká yìí, ó fi ìyàtọ̀ láàárín àìgboyà àwọn yòókù àti ọlá tí gbogbo ènìyàn ń fún wọn hàn.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: àwọn ènìyàn ń bu ọlá fún wọn gidigidi
  rationale: Ó tú ìtumọ̀ fífi wọ́n ga tàbí kà wọ́n sí ẹni ńlá jáde ní ọ̀nà Yorùbá tí ó mọ́gbọ́n dání; àìpé ἐμεγάλυνεν tún lè fi ìṣe tí ń lọ lọ́wọ́ hàn.
theological_decisions:
- issue: Àwọn tí ọ̀rọ̀ náà pè ní ‘àwọn yòókù’
  choice: Fi sílẹ̀ gẹ́gẹ́ bí ‘àwọn yòókù’
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí àwọn aláìgbàgbọ́ tàbí àwọn tó kù nínú ìjọ
  rationale: Orísun kò dá ẹgbẹ́ náà mọ̀ ní kedere, nítorí náà a kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí kò sí nínú rẹ̀ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
