  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n gbọ́ ọ̀rọ̀ yìí, inú bí wọn gidigidi,[a] wọ́n sì fẹ́ pa àwọn aposteli náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀: “a gé wọn kọjá” tàbí “a gé wọn dé ibi tí ó jinlẹ̀”; èyí ń ṣàfihàn ìdààmú ọkàn àti ìbínú ọ̀tá líle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ṣùgbọ́n ... wọ́n
  rationale: A lo “Ṣùgbọ́n” fún agbára ìyípadà kékeré tí δέ ní, “wọ́n” sì ń tọ́ka sí ẹgbẹ́ tí a ti mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́ ọ̀rọ̀ yìí
  rationale: Ọ̀rọ̀ àpọ́nlé aorist náà ń tọ́ka sí àkókò; “ọ̀rọ̀ yìí” mú ohun tí wọ́n gbọ́, èyí tí àyíká ọ̀rọ̀ fi hàn, ṣe kedere ní Yorùbá.
- source_word: διεπρίοντο
  choice: inú bí wọn gidigidi
  rationale: Ọ̀rọ̀ náà ní àwòrán gígé tàbí rírun wọ inú, ṣùgbọ́n níbí ó ṣàpèjúwe ìbínú oníjà líle. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún ìtumọ̀ pé ẹ̀rí-ọkàn ń dá wọn lẹ́bi.
- source_word: ἐβούλοντο
  choice: wọ́n sì fẹ́
  rationale: Imperfect náà ń fi ìfẹ́ tàbí ète tí ó ń bá a lọ hàn; “fẹ́” jẹ́ ọ̀nà àdánidá láti sọ ọ́.
- source_word: ἀνελεῖν
  choice: pa
  rationale: Nínú àyíká yìí, ἀναιρέω túmọ̀ sí mímú ẹ̀mí ẹni kúrò; “pa” jẹ́ tààrà, ó sì ṣe kedere.
- source_word: αὐτούς
  choice: àwọn aposteli náà
  rationale: Dípò ọ̀rọ̀ arọ́pò orúkọ tí ìtọ́kasí rẹ̀ lè má ṣe kedere nínú ẹsẹ tí ó dá dúró, a sọ àwọn tí ọ̀rọ̀ náà ń tọ́ka sí, ìyẹn àwọn aposteli.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ διεπρίοντο láì jẹ́ kí ó dà bí ìrònúpìwàdà tàbí ìdálẹ́bi ọkàn
  choice: inú bí wọn gidigidi
  alternative: ọ̀rọ̀ náà gún wọn lọ́kàn / ó gé wọn dé inú ọkàn
  rationale: Àyíká—ìfẹ́ wọn láti pa àwọn aposteli—fi hàn pé ìhùwàpadà ọ̀tá àti ìbínú líle ni, kì í ṣe dandan pé wọ́n ronúpìwàdà. Àlàyé ẹsẹ̀ ìsàlẹ̀ pa àwòrán gígé inú ọrọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A yan “inú bí wọn gidigidi” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ pa àwòrán ìpilẹ̀ Gíríìkì mọ́.
