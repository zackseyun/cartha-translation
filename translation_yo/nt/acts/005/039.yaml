  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá ti ọ̀dọ̀ Ọlọ́run wá, ẹ̀yin kò ní lè mú wọn ṣubú[a][c]. Kí a má bàa rí i pé ẹ̀yin tilẹ̀ ń bá Ọlọ́run jà[b].” Wọ́n sì gba ọ̀rọ̀ rẹ̀ gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pa wọ́n run” tàbí “mú wọn ṣubú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a rí i pé ẹ̀yin jẹ́ alátakò Ọlọ́run”; ní tààràtà, “àwọn tí ń bá Ọlọ́run jagun.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe jù pé “wọ́n” ń tọ́ka sí àwọn aposteli, ṣùgbọ́n àwọn kan gbà pé ó tún lè tọ́ka sí ìgbòkègbodò tàbí iṣẹ́ wọn lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ọ̀rọ̀ yìí fi orísun tàbí ìpilẹ̀ṣẹ̀ hàn; ‘ti ọ̀dọ̀ Ọlọ́run wá’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: δυνήσεσθε
  choice: ẹ̀yin kò ní lè
  rationale: Ó pa ìtumọ̀ agbára àti àkókò ọjọ́ iwájú mọ́, ó sì tẹnu mọ́ àwọn tí Gamalieli ń bá sọ̀rọ̀.
- source_word: καταλῦσαι
  choice: bi wọ́n ṣubú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípa àwọn ènìyàn tàbí iṣẹ́ wọn run, tàbí mímú wọn kúrò lójú ọ̀nà; ‘bi wọ́n ṣubú’ jẹ́ àwòrán Yorùbá tó bójú mu láì sọ ìtumọ̀ náà di pípá ju ti Gíríìkì lọ.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Arọ́pò-orúkọ Gíríìkì jẹ́ akọ púpọ̀, ó sì ṣeé ṣe jù pé àwọn aposteli ni ó ń tọ́ka sí.
- source_word: μήποτε
  choice: Kí ó má bàa jẹ́ pé
  rationale: Ó gbé ìkìlọ̀ nípa ohun búburú tó lè ṣẹlẹ̀ jáde ní Yorùbá àdánidá.
- source_word: θεομάχοι
  choice: ẹ̀yin tilẹ̀ ń bá Ọlọ́run jà
  rationale: Ó pa ìtumọ̀ gidi náà—àwọn tí ń bá Ọlọ́run jagun—mọ́ ní ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: εὑρεθῆτε
  choice: a rí i pé ẹ̀yin
  rationale: Ó fi èrò jíjẹ́ ẹni tí a ṣàwárí tàbí tí ó hàn pé ó wà ní ipò kan hàn.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Wọ́n sì gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: Èyí sọ ní Yorùbá àdánidá pé ìgbìmọ̀ náà tẹ́wọ́ gba ìmọ̀ràn Gamalieli, láì sọ pé wọ́n gba gbogbo ohun tó gbà gbọ́.
theological_decisions:
- issue: Ohun tí αὐτούς (‘wọ́n’) ń tọ́ka sí
  choice: Àwọn aposteli, ìyẹn àwọn ọkùnrin tó wà níwájú ìgbìmọ̀
  alternative: Ìgbòkègbodò wọn tàbí iṣẹ́ wọn lápapọ̀
  rationale: Arọ́pò-orúkọ náà jẹ́ akọ púpọ̀, nítorí náà àwọn ènìyàn ni ó tọ́ka sí ní tààràtà jù; àlàyé ìsàlẹ̀ ojú ìwé sì pa ìtumọ̀ kejì tó ṣeé ṣe mọ́.
- issue: Ìkìlọ̀ tí θεομάχοι εὑρεθῆτε ń sọ
  choice: Ó lè hàn pé wọ́n ń bá Ọlọ́run jà
  alternative: A lè rí wọn gẹ́gẹ́ bí alátakò Ọlọ́run
  rationale: Ìtumọ̀ yìí pa agbára ìkìlọ̀ àti àìdánilójú μήποτε mọ́; kò sọ ọ́ di ìdájọ́ tó ti parí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ̀yin’ mú ẹni tí a ń bá sọ̀rọ̀ ṣe kedere, ‘gba ọ̀rọ̀ rẹ̀ gbọ́’ sì jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n tẹ́wọ́ gba ìmọ̀ràn rẹ̀.
