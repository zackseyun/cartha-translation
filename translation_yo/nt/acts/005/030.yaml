id: ACT.5.30
reference: Acts 5:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: yo
  text: Ọlọ́run àwọn baba wa gbé Jésù dìde[a], ẹni tí ẹ̀yin pa nípa gbígbé e kọ́ sórí igi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jí Jésù dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí àjíǹde níbí, bí ó tilẹ̀ jẹ́ pé ẹsẹ yìí kò sọ ní tààrà pé “kúrò nínú òkú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “lórí àgbélébùú.” Gíríìkì sọ pé “sórí igi,” ó sì ṣeé ṣe kí èyí máa tọ́ka sí Diutarónómì 21:23.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Ọlọ́run àwọn baba wa
  rationale: Ó pa ọ̀rọ̀ májẹ̀mú nípa Ọlọ́run àwọn baba Ísírẹ́lì mọ́, ó sì tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì láì fi àlàyé míì kún un.
- source_word: ἤγειρεν
  choice: gbé ... dìde
  rationale: Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì lè tọ́ka sí àjíǹde nínú àyíká ọ̀rọ̀ náà láì fi ‘kúrò nínú òkú’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni bí a ṣe ń kọ orúkọ náà ní Yorùbá.
- source_word: διεχειρίσασθε
  choice: ẹ̀yin pa
  rationale: Ọ̀rọ̀ náà ń sọ ìwà ipá tí ó yọrí sí ikú; ‘pa’ ṣe kedere, ó sì bá gbólóhùn tó ṣàlàyé ọ̀nà ikú náà mu.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: nípa gbígbé e kọ́ sórí igi
  rationale: Ó fi iṣẹ́ tí participle náà ń ṣe gẹ́gẹ́ bí ọ̀nà tí wọ́n fi pa á hàn, ó sì pa ‘igi’ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ‘àgbélébùú’ nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Bóyá ἤγειρεν yẹ kí a túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí àjíǹde kúrò nínú òkú
  choice: gbé Jésù dìde
  alternative: jí Jésù dìde kúrò nínú òkú
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí àjíǹde, ṣùgbọ́n ẹsẹ yìí kò sọ ‘kúrò nínú òkú’ ní tààrà; ìtumọ̀ tí a yàn pa ìwọ̀ntúnwọ̀nsì yìí mọ́.
- issue: Bóyá ξύλου yẹ kí a túmọ̀ sí ‘àgbélébùú’
  choice: sórí igi
  alternative: lórí àgbélébùú
  rationale: Gíríìkì lo ξύλον (‘igi’ tàbí ‘ohun igi’), kì í ṣe σταυρός; ‘igi’ tún pa ìṣàpẹẹrẹ tó ṣeé ṣe sí Diutarónómì 21:23 mọ́.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ni a lò. Èdè náà jẹ́ ọlọ́wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; a pa ọ̀rọ̀ Bíbélì ‘àwọn baba wa’ àti àwòrán ‘igi’ mọ́ láì mú kí ó di èdè ìjọ kan pàtó.
