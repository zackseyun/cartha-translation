  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ẹ̀ṣọ́ náà dé, wọn kò rí wọn nínú ilé ẹ̀wọ̀n náà; wọ́n sì padà, wọ́n ròyìn pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: nígbà tí ... dé
  rationale: Ọ̀rọ̀ alábápín náà fi ìgbà tí àwọn ẹ̀ṣọ́ dé hàn; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ àsìkò mọ́.
- source_word: ὑπηρέται
  choice: àwọn ẹ̀ṣọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àwọn òṣìṣẹ́ aláṣẹ tí a rán láti mú àwọn aposteli, kì í ṣe ìránṣẹ́ ilé. “Àwọn ẹ̀ṣọ́” bá iṣẹ́ wọn mu láì fi “ẹ̀ṣọ́ tẹ́ńpìlì” kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
- source_word: οὐχ εὗρον αὐτούς
  choice: wọn kò bá wọn
  rationale: “Bá” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọn kò rí àwọn ènìyàn náà ní ibi tí wọ́n retí pé kí wọ́n wà.
- source_word: ἐν τῇ φυλακῇ
  choice: nínú ẹ̀wọ̀n
  rationale: “Ẹ̀wọ̀n” túmọ̀ sí ibi ìhámọ́ tí a ti mẹ́nu kàn tẹ́lẹ̀; àyíká ọ̀rọ̀ mú ìdánimọ̀ ibi pàtó náà hàn bí ó tilẹ̀ jẹ́ pé Yorùbá kò nílò atúmọ̀ pàtó bíi ti Gíríìkì.
- source_word: ἀναστρέψαντες
  choice: wọ́n padà lọ
  rationale: Ó fi hàn pé wọ́n yí padà láti ibi ẹ̀wọ̀n, wọ́n sì lọ sí ọ̀dọ̀ àwọn tí ó rán wọn.
- source_word: ἀπήγγειλαν
  choice: ròyìn pé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìròyìn ohun tí wọ́n rí mú padà; “ròyìn” bá àyíká iṣẹ́ aláṣẹ mu. “Pé” mú kí ìtẹ̀síwájú sí ẹsẹ tó tẹ̀ lé e dùn-ún-kà.
- source_word: δέ
  choice: Ṣùgbọ́n / nítorí náà
  rationale: δέ àkọ́kọ́ fi ìyàtọ̀ sí ohun tí wọ́n retí hàn, nítorí náà “Ṣùgbọ́n” yẹ. Ìsopọ̀ kejì jẹ́ àbájáde ìṣẹ̀lẹ̀ náà ní Yorùbá àdánidá, èyí tí “nítorí náà” mú jáde.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì bá ìtàn aláṣẹ mu. A lo “àwọn ẹ̀ṣọ́” dípò ọ̀rọ̀ tó túmọ̀ sí “ọlọ́pàá tẹ́ńpìlì,” nítorí Gíríìkì ẹsẹ yìí kò sọ ibi iṣẹ́ wọn ní pàtó.
