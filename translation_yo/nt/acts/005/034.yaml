id: ACT.5.34
reference: Acts 5:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: yo
  text: Ṣùgbọ́n Farisí kan, tí orúkọ rẹ̀ ń jẹ́ Gamalieli, dìde nínú ìgbìmọ̀ náà[a]; olùkọ́ Òfin ni, ẹni tí gbogbo ènìyàn bọ̀wọ̀ fún. Ó pàṣẹ pé kí wọ́n mú àwọn ọkùnrin náà jáde fún ìgbà díẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìgbìmọ̀ náà” ni ìgbìmọ̀ alákòóso àwọn Júù, tí a ń pè ní Sanhedrini.
    reason: cultural_note
  - marker: b
    text: Ní ìtumọ̀ gangan, èdè Gíríìkì ní pé, “kí wọ́n fi àwọn ọkùnrin náà síta fún ìgbà díẹ̀”; àkànlò èdè ni fún yíyọ wọn kúrò níbẹ̀ fún ìgbà díẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ó fi ìṣe Gamalieli hàn ní gbangba nínú àpéjọ; ‘dìde’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ ara mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó ń fi ìyípadà kékeré tàbí ìtakora nínú ìtàn hàn bí Gamalieli ṣe dá sí ọ̀rọ̀ náà.
- source_word: τις
  choice: kan
  rationale: Ó fi ẹni tuntun tí a kò tíì dárúkọ wọ inú ìtàn lọ́nà àdánidá ní Yorùbá.
- source_word: συνεδρίῳ
  choice: ìgbìmọ̀ náà
  rationale: Ìtumọ̀ tààrà, tó sì ṣe kedere; àlàyé ìṣe àti orúkọ ìgbìmọ̀ Júù yìí wà ní àlàyé ìsàlẹ̀.
- source_word: Φαρισαῖος
  choice: Farisí
  rationale: Èyí ni ìtumọ̀ orúkọ ẹgbẹ́ náà tí a sábà máa ń lò ní Yorùbá.
- source_word: ὀνόματι Γαμαλιήλ
  choice: tí orúkọ rẹ̀ ń jẹ́ Gamalieli
  rationale: Ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni tí a ṣẹ̀ṣẹ̀ mú wọ inú ìtàn.
- source_word: νομοδιδάσκαλος
  choice: Olùkọ́ Òfin
  rationale: Ó túmọ̀ sí ẹni tó ń kọ́ àwọn ẹlòmíràn ní Òfin; lílo lẹ́tà ńlá fún ‘Òfin’ ń tọ́ka sí Òfin Mósè nínú àyíká yìí.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: gbogbo àwọn ènìyàn sì bọ̀wọ̀ fún un
  rationale: Ó sọ ní Yorùbá àdánidá pé gbogbo àwọn ènìyàn ka Gamalieli sí ẹni ọ̀wọ̀.
- source_word: ἐκέλευσεν
  choice: Ó pàṣẹ
  rationale: Ó pa agbára àṣẹ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́ nínú àyíká ìdájọ́.
- source_word: ἔξω ... ποιῆσαι
  choice: kí wọ́n mú ... jáde
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún àkànlò èdè Gíríìkì náà, ìyẹn pé kí a yọ wọ́n kúrò níbẹ̀ fún ìgbà díẹ̀.
- source_word: βραχύ
  choice: fún ìgbà díẹ̀
  rationale: Ó pa ìtumọ̀ iye àkókò kúkúrú mọ́.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú τοὺς ἀνθρώπους
  choice: àwọn ọkùnrin náà
  alternative: àwọn ènìyàn náà
  rationale: Nínú àyíká yìí, àwọn aposteli ọkùnrin tó dúró níwájú ìgbìmọ̀ ni ọ̀rọ̀ náà ń tọ́ka sí; a kò sọ ọ́ di ọ̀rọ̀ gbogbogbò fún gbogbo ènìyàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn síbi tó yẹ, a sì yan gbólóhùn àdánidá dípò títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì lọ́nà líle. A tún fi àmì àlàyé sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé gan-an.
