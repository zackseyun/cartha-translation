  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: yo
  text: Wọ́n sì fi ọwọ́ mú àwọn aposteli, wọ́n sì fi wọ́n sí àhámọ́ ìjọba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì fi wọ́n sí ibi ìhámọ́ gbogbogbò.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìhámọ́ tàbí ìdádúró lábẹ́ àṣẹ ní gbogbogbò, kì í ṣe ilé ẹ̀wọ̀n pàtó nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: na ọwọ́ mú
  rationale: Ọ̀rọ̀ àpèjúwe Gíríìkì náà túmọ̀ sí fífi ọwọ́ lé ẹnì kan ní ọ̀nà ọ̀tá láti mú un. ‘Na ọwọ́ mú’ jẹ́ èdè Yorùbá àdánidá tí ó pa àwòrán ọwọ́ mọ́, tí ó sì fi ìmúni hàn nínú àyíká yìí.
- source_word: ἀποστόλους
  choice: àwọn aposteli
  rationale: Nínú Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà jẹ́ orúkọ àwọn tí Jésù rán ní àṣẹ, kì í ṣe ‘àwọn ońṣẹ́’ lásán. ‘Aposteli’ jẹ́ ọ̀rọ̀ tí a mọ̀ gbòòrò nínú Yorùbá.
- source_word: ἔθεντο
  choice: fi wọ́n sí
  rationale: Èyí sọ τίθημι ní ọ̀nà Yorùbá tí ó rọrùn, tí ó sì bá gbólóhùn tó tẹ̀ lé e mu.
- source_word: ἐν τηρήσει
  choice: sí àhámọ́
  rationale: τήρησις lè tọ́ka sí ipò títọ́jú ẹni lábẹ́ àṣẹ tàbí sí ìhámọ́, láìfi dandan sọ pé ilé ẹ̀wọ̀n kan pàtó ni. ‘Àhámọ́’ pa ìtumọ̀ gbígbé wọn dúró lábẹ́ àṣẹ mọ́.
- source_word: δημοσίᾳ
  choice: ìjọba
  rationale: Nínú àkópọ̀ τηρήσει δημοσίᾳ, ọ̀rọ̀ náà ń tọ́ka sí àhámọ́ gbogbogbò tàbí ti aláṣẹ, kì í ṣe ìhámọ́ ìkọ̀kọ̀. ‘Àhámọ́ ìjọba’ sọ ìyàtọ̀ yìí ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo ‘na ọwọ́ mú’ láti pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láìjẹ́ kí ó dà bí fífi ọwọ́ léni fún ìbùkún; ‘àhámọ́ ìjọba’ sì yàgò fún dídi τηρήσει mọ́ ilé ẹ̀wọ̀n kan pàtó.
