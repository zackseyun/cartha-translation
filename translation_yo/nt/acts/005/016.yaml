id: ACT.5.16
reference: Acts 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: yo
  text: Bákan náà, ọ̀pọ̀ ènìyàn láti àwọn ìlú tí ó yí Jerúsálẹ́mù ká ń kóra jọ[a], wọ́n sì ń mú àwọn aláìsàn àti àwọn tí àwọn ẹ̀mí àìmọ́ ń yọ lẹ́nu[b] wá; a sì ń wo gbogbo wọn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń péjọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí àwọn ẹ̀mí àìmọ́ ń dá lóró.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: ń kóra jọ
  rationale: Fọ́ọ̀mù imperfect náà ń tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra ní àkókò tí ó kọjá; ọ̀rọ̀ Yorùbá ‘ń kóra jọ’ pa ìtumọ̀ yìí mọ́ lọ́nà àdánidá.
- source_word: τὸ πλῆθος
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó tọ́ka sí àwùjọ ènìyàn púpọ̀. ‘Ọ̀pọ̀ ènìyàn’ ṣe kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: láti àwọn ìlú tí ó yí Jerúsálẹ́mù ká
  rationale: Èyí fi hàn pé àwọn ìlú náà wà ní agbègbè Jerúsálẹ́mù, láìfi ìtumọ̀ tí kò bójú mu pé wọ́n jẹ́ apá kan Jerúsálẹ́mù kún un.
- source_word: φέροντες
  choice: wọ́n ń mú ... wá
  rationale: Participle yìí ṣàlàyé ohun tí àwọn ènìyàn náà ń ṣe bí wọ́n ṣe ń kóra jọ; ‘ń mú ... wá’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀσθενεῖς
  choice: àwọn aláìsàn
  rationale: Nínú àyíká ìwòsàn, ọ̀rọ̀ náà túmọ̀ sí àwọn tí ara wọn kò dá, kì í ṣe àwọn aláìlágbára ní gbogbogbòò.
- source_word: ὀχλουμένους
  choice: àwọn tí ... ń yọ lẹ́nu
  rationale: Èyí pa ìtumọ̀ ìpọ́njú tàbí ìdààmú mọ́ láìfi agbára ọ̀rọ̀ náà ga ju bí Gíríìkì ṣe béèrè lọ; àṣàyàn tó lágbára sí i wà nínú àlàyé ìsàlẹ̀.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: àwọn ẹ̀mí àìmọ́
  rationale: Ó pa gbólóhùn Bíbélì fún àwọn ẹ̀mí búburú tó jẹ́ ẹni gidi mọ́, pẹ̀lú èrò àìmọ́ tó wà nínú ἀκάθαρτος.
- source_word: ἐθεραπεύοντο ἅπαντες
  choice: gbogbo wọn sì ń rí ìwòsàn
  rationale: ‘Gbogbo wọn’ pa ìtẹnumọ́ ἅπαντες mọ́, ‘ń rí ìwòsàn’ sì fi ìṣe tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn gẹ́gẹ́ bí imperfect passive ṣe rí.
theological_decisions:
- issue: Ìtumọ̀ πνευμάτων ἀκαθάρτων
  choice: àwọn ẹ̀mí àìmọ́
  alternative: àwọn ẹ̀mí búburú
  rationale: ‘Àwọn ẹ̀mí àìmọ́’ tẹ̀lé ọ̀rọ̀ orísun, ó sì pa ìtumọ̀ pé àwọn ẹ̀mí ibi tó jẹ́ ẹni gidi ni mọ́, láìsọ ọ́ di àpèjúwe ìṣòro ọpọlọ nìkan.
- issue: Ìwọ̀n tí ἅπαντες kàn
  choice: gbogbo wọn sì ń rí ìwòsàn
  alternative: a sì wo gbogbo wọn sàn
  rationale: Ọ̀rọ̀ náà kàn gbogbo àwọn aláìsàn àti àwọn tí àwọn ẹ̀mí àìmọ́ ń yọ lẹ́nu tí a mú wá nínú ìṣẹ̀lẹ̀ yìí; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá àfẹnusọ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Àní ... náà’ mú ìtẹnumọ́ δὲ καὶ jáde; ìtòlẹ́sẹẹsẹ gbólóhùn náà sì jẹ́ kí ìṣe tí ń bá a lọ hàn ní kedere.
