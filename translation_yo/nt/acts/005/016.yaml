  to: Bákan náà, ọ̀pọ̀ ènìyàn láti àwọn ìlú tí ó yí Jerúsálẹ́mù ká ń kóra jọ[a], wọ́n sì ń mú àwọn aláìsàn àti àwọn tí àwọn ẹ̀mí àìmọ́ ń yọ lẹ́nu[b] wá; a sì ń wo gbogbo wọn sàn.
