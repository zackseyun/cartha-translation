  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù dá a lóhùn pé, “Sọ fún mi, ṣé ẹ ta ilẹ̀ náà ní iye yìí?” Ó sì dáhùn pé, “Bẹ́ẹ̀ ni, iye yìí ni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: Ṣùgbọ́n Peteru dá a lóhùn pé
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà inú ìtàn hàn; ‘dá a lóhùn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Peteru fèsì sí i.
- source_word: Εἰπέ μοι
  choice: Sọ fún mi
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti àṣẹ náà pẹ̀lú arọ́pò-orúkọ ẹni àkọ́kọ́.
- source_word: εἰ
  choice: ṣé ... ni
  rationale: Nínú ọ̀rọ̀ yìí, εἰ bẹ̀rẹ̀ ìbéèrè tí ìdáhùn rẹ̀ lè jẹ́ bẹ́ẹ̀ ni tàbí bẹ́ẹ̀ kọ́; ‘ṣé ... ni’ sọ irú ìbéèrè bẹ́ẹ̀ ní Yorùbá àdánidá.
- source_word: τοσούτου
  choice: iye yìí
  rationale: Ó tọ́ka sí iye owó tí a ti mẹ́nu kàn, ó sì pa agbára ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὸ χωρίον
  choice: ilẹ̀ náà
  rationale: χωρίον lè túmọ̀ sí ilẹ̀ kan, oko, tàbí dúkìá; ‘ilẹ̀ náà’ bá àyíká títà ohun-ìní mu láì fi ìtumọ̀ tóóró tí ọ̀rọ̀ náà kò béèrè kún un.
- source_word: ἀπέδοσθε
  choice: ẹ ta
  rationale: Nínú àyíká ọjà yìí, ἀποδίδωμι túmọ̀ sí ‘tà’; ‘ẹ’ tún jẹ́ ọ̀rọ̀ ọ̀wọ̀ àdánidá sí ẹni kan nínú Yorùbá.
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ìdáhùn ìfọwọ́sí tó rọrùn, tó sì bá Yorùbá mu.
- source_word: τοσούτου
  choice: iye yìí ni
  rationale: A tún gbólóhùn pàtàkì inú ìbéèrè náà ṣe nínú ìdáhùn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ṣe.
theological_decisions: []
translation_notes:
  register: 'Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye ni a lò. A lo ‘ẹ’ fún Safira gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀wọ̀ sí ẹni kan; a sì lo ‘ó’ nínú àlàyé ìtàn. Orúkọ Peteru tẹ̀ lé ìlò Bíbélì Yorùbá tó wọ́pọ̀. Kò sí àmì àlàyé ẹsẹ̀ nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè pè ní [a] kò bá àmì rẹ̀ nínú ọ̀rọ̀ Gẹ̀ẹ́sì mu: ó wà lẹ́yìn ‘her’ ṣùgbọ́n ó ṣàlàyé χωρίον; ìtumọ̀ Yorùbá yan ‘ilẹ̀ náà’ láì nílò àlàyé.'
