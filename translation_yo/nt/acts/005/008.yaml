  source_fidelity: Ìtumọ̀ náà mú ìbéèrè Pétérù àti ìdáhùn ìfẹ́sẹ̀múlẹ̀ obìnrin náà dáadáa. Síbẹ̀, ìṣètò “ṣé iye yìí ni ẹ ta ilẹ̀ náà?” lè dà bí ìbéèrè tó ń tẹnu mọ́ iye náà ju bí Gíríìkì ṣe ń béèrè pé bóyá iye náà ni iye tí wọ́n fi ta ilẹ̀ náà. Fífi “ní” hàn yóò sọ ìbáṣepọ̀ iye/títà náà di mímọ́.
  naturalness: “Dá a lóhùn” àti “Bẹ́ẹ̀ ni” jẹ́ Yorùbá ìgbàlódé tó dára. “Ṣé ẹ ta ilẹ̀ náà ní iye yìí?” jẹ́ ìṣètò tó rọrùn sí i, tó sì jẹ́ kedere pé iye náà ni iye ìtajà.
  terminology: “Pétérù” ni ọ̀nà tí ó wọ́pọ̀ nínú àwọn ìtumọ̀ Bíbélì Yorùbá alákọ̀ọ́lẹ̀; a lò ó fún ìbámu pẹ̀lú ìlò náà. “Ilẹ̀” jẹ́ ìtumọ̀ tó bójú mu fún χωρίον nínú àyíká yìí. Kò nílò àlàyé ẹsẹ̀, nítorí ìtumọ̀ náà kò fi ìtumọ̀ tóóró kan le χωρίον.
  issues:
