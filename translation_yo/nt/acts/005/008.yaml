  to: Ṣùgbọ́n Pétérù dá a lóhùn pé, “Sọ fún mi, ṣé ẹ ta ilẹ̀ náà ní iye yìí?” Ó sì dáhùn pé, “Bẹ́ẹ̀ ni, iye yìí ni.”
  rationale: A tún ìṣètò ìbéèrè náà ṣe, a sì fi “ní” kún un kí iye tí wọ́n fi ta ilẹ̀ náà hàn ní kedere. A tún kọ orúkọ náà sí “Pétérù,” gẹ́gẹ́ bí ìlò Bíbélì Yorùbá tó wọ́pọ̀. Ìdáhùn ellipítíkì náà wà ní ìbámu pẹ̀lú Ναί, τοσούτου.
