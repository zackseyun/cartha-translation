source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: yo
  text: Ṣùgbọ́n ọkùnrin kan tí a ń pè ní Ananíà, pẹ̀lú Sáfírà, aya rẹ̀, ta ohun-ìní kan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun-ìní ní gbogbogbò tàbí dúkìá gidi kan, bí ilẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ṣùgbọ́n ọkùnrin kan
  rationale: “Ọkùnrin kan” fi ìtumọ̀ àìdánimọ̀ τις hàn lọ́nà àdánidá, “Ṣùgbọ́n” sì pa ìyàtọ̀ pẹ̀lú àpẹẹrẹ Bánábà tó ṣáájú mọ́.
- source_word: Ἁνανίας ὀνόματι
  choice: tí a ń pè ní Ananíà
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ọ̀rọ̀ ìdánimọ̀ ẹni “by name,” pẹ̀lú àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: pẹ̀lú Sáfírà aya rẹ̀
  rationale: “Pẹ̀lú” fi ìbákẹ́gbẹ́ σύν hàn, “aya rẹ̀” sì ni ìtumọ̀ γυνή tí àyíká ọ̀rọ̀ ìgbéyàwó yìí béèrè.
- source_word: ἐπώλησεν
  choice: ta
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé ó tà á; ìṣètò gbólóhùn Yorùbá fi ìṣe tó ti ṣẹlẹ̀ hàn láìní àmì àsìkò mìíràn.
- source_word: κτῆμα
  choice: ohun-ìní kan
  rationale: κτῆμα lè jẹ́ ohun-ìní tàbí dúkìá gidi bí ilẹ̀. “Ohun-ìní kan” pa ìtumọ̀ gbígbòòrò náà mọ́ láìfi “ilẹ̀” kún ohun tí Gíríìkì kò sọ ní pàtó.
theological_decisions:
- issue: Ìyàtọ̀ ìtàn náà sí àpẹẹrẹ Bánábà tó ṣáájú
  choice: Túmọ̀ δέ sí “Ṣùgbọ́n.”
  alternative: “Nígbà náà” tàbí “Àti” gẹ́gẹ́ bí ìyípadà ìtàn tó rọrùn.
  rationale: Àyíká ọ̀rọ̀ fi ìṣe Bánábà wé ìṣe Ananíà àti Sáfírà. “Ṣùgbọ́n” fi ìyàtọ̀ kékeré tí δέ ní hàn láìṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì gbé àmì àlàyé [a] lé “ohun-ìní kan” tí àlàyé náà ń ṣàlàyé.
