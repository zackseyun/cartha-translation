  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ ṣọ́ra nípa ohun tí ẹ fẹ́ ṣe sí àwọn ọkùnrin wọ̀nyí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kíyè sí ara yín ní ti àwọn ọkùnrin wọ̀nyí àti ohun tí ẹ fẹ́ ṣe sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε
  choice: Ó sì sọ
  rationale: τέ jẹ́ àsopọ̀ ìtàn tí kò lágbára; “sì” so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú láì fi ìtẹnumọ́ àkókò tàbí ìyọrísí kún un.
- source_word: πρὸς αὐτούς
  choice: fún wọn
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe “sọ,” πρός àti ọ̀rọ̀-afọwọ́ṣe tọ́ka sí àwọn tí a ń bá sọ̀rọ̀; “fún wọn” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin ọmọ Ísírẹ́lì
  rationale: Èyí pa ìpè akọ tí ó wà nínú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ ìkíni ológo tí ó yé àwọn òǹkàwé Yorùbá.
- source_word: προσέχετε ἑαυτοῖς
  choice: ẹ ṣọ́ra
  rationale: Àṣẹ náà ń ké sí ìṣọ́ra àti ṣíṣọ ara ẹni; “ẹ ṣọ́ra” mú agbára ìkìlọ̀ náà jáde ní Yorùbá òde òní.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: sí àwọn ọkùnrin wọ̀nyí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἐπί pẹ̀lú dátífù tọ́ka sí àwọn tí ìgbésẹ̀ tí wọ́n ń rò yóò kàn. “Sí” jẹ́ àdánidá, kò sì fi ìkọlù tí Gíríìkì kò sọ ní tààràtà kún un.
- source_word: τί μέλλετε πράσσειν
  choice: ohun tí ẹ fẹ́ ṣe
  rationale: μέλλω pẹ̀lú infinitive lè tọ́ka sí ohun tí ó fẹ́ ṣẹlẹ̀ tàbí ohun tí a pinnu. “ohun tí ẹ fẹ́ ṣe” sọ èrò ìgbésẹ̀ tó ń bọ̀ ní kedere láì sọ pé ó ti dájú.
