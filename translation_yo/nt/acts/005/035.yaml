translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé òde òní, ṣùgbọ́n ó pa ìkìlọ̀ àti ìpè akọ inú orísun Gíríìkì mọ́.
