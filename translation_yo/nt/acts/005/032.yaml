source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: yo
  text: 'Àwa sì ni ẹlẹ́rìí àwọn nǹkan wọ̀nyí[a]; Ẹ̀mí Mímọ́ náà sì jẹ́ ẹlẹ́rìí[b], ẹni[c] tí Ọlọ́run ti fi fún àwọn tí ń ṣègbọràn sí i.


    [a] A tún lè túmọ̀ rẹ̀ sí “àwọn ọ̀rọ̀ wọ̀nyí” tàbí “àwọn ọ̀ràn wọ̀nyí.”

    [b] Ní Gíríìkì, ó jẹ́ “àti Ẹ̀mí Mímọ́”; ọ̀rọ̀ ìṣe inú gbólóhùn tó ṣáájú ló tún ń ṣiṣẹ́ níhìn-ín, ìtumọ̀ rẹ̀ sì ni pé: “Ẹ̀mí Mímọ́ náà sì jẹ́ ẹlẹ́rìí.”

    [c] Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní ìrísí akọ tàbí abo kọ́, nítorí pé ó bá πνεῦμα (“ẹ̀mí”), orúkọ tí kì í ṣe akọ tàbí abo, mu ní gírámà. Yorùbá lo “ẹni” níhìn-ín láti tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ọ̀rọ̀ wọ̀nyí” tàbí “àwọn ọ̀ràn wọ̀nyí.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, ó jẹ́ “àti Ẹ̀mí Mímọ́”; ọ̀rọ̀ ìṣe inú gbólóhùn tó ṣáájú ló tún ń ṣiṣẹ́ níhìn-ín, ìtumọ̀ rẹ̀ sì ni pé: “Ẹ̀mí Mímọ́ náà sì jẹ́ ẹlẹ́rìí.”'
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní ìrísí akọ tàbí abo kọ́, nítorí pé ó bá πνεῦμα (“ẹ̀mí”), orúkọ tí kì í ṣe akọ tàbí abo, mu ní gírámà. Yorùbá lo “ẹni” níhìn-ín láti tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: ẹlẹ́rìí
  rationale: “Ẹlẹ́rìí” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ipò jíjẹ́rìí nípa ohun tí ẹni mọ̀ tàbí rí mu.
- source_word: ῥημάτων
  choice: àwọn nǹkan
  rationale: Nínú àyíká yìí, “àwọn nǹkan wọ̀nyí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkóónú ẹ̀rí àwọn aposteli; àkọsílẹ̀ ìsàlẹ̀ fi “àwọn ọ̀rọ̀” àti “àwọn ọ̀ràn” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá òde òní tó ṣe kedere, tó sì wọ́pọ̀ fún orúkọ yìí.
- source_word: ὃ
  choice: ẹni
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà tẹ̀ lé ìbámu gírámà pẹ̀lú πνεῦμα, “ẹni” ni ọ̀nà Yorùbá àdánidá fún ẹni tí gbólóhùn náà ń tọ́ka sí.
- source_word: ἔδωκεν
  choice: ti fi fún
  rationale: “Ti fi fún” fi hàn pé Ọlọ́run ti fi Ẹ̀mí náà fún wọn, ìṣe náà sì ní ìbáṣepọ̀ pẹ̀lú ipò tí a ń sọ̀rọ̀ rẹ̀ báyìí.
- source_word: πειθαρχοῦσιν
  choice: ń ṣègbọràn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbọ́ tàbí ṣíṣe ohun tí ẹni tó ní àṣẹ pàṣẹ; “ṣègbọràn” bá ìtumọ̀ yẹn àti àyíká Ìṣe 5:29 mu.
- source_word: αὐτῷ
  choice: sí i
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí Ọlọ́run; “sí i” pa ìsopọ̀ arọ́pò-orúkọ inú Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá a gbé Ẹ̀mí Mímọ́ kalẹ̀ gẹ́gẹ́ bí ẹlẹ́rìí pẹ̀lú àwọn aposteli
  choice: Ẹ̀mí Mímọ́ náà sì jẹ́ ẹlẹ́rìí
  alternative: àti Ẹ̀mí Mímọ́ [jẹ́ ẹlẹ́rìí]
  rationale: Abala kejì kò ní ọ̀rọ̀ ìṣe tí a kọ sílẹ̀ ní Gíríìkì, ṣùgbọ́n ó gba ọ̀rọ̀ ìṣe inú abala àkọ́kọ́. Ṣíṣe é ní kedere ní Yorùbá mú kí gbólóhùn náà jẹ́ àdánidá láìfi èrò tuntun kún un.
- issue: Ọ̀nà ìtọ́ka sí Ẹ̀mí Mímọ́ nínú gbólóhùn àlàyé
  choice: ẹni
  alternative: èyí tí
  rationale: “Ẹni” jẹ́ ìtọ́ka Yorùbá tó bójú mu sí Ẹ̀mí Mímọ́ nínú àyíká yìí. Ó tẹ̀ lé ẹni tí ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe ìrísí gírámà ọ̀rọ̀ Gíríìkì nìkan.
translation_notes:
  register: A lo Yorùbá ìwọ̀n-gbòòrò tó ní àmì ohùn, ní èdè òde òní tó ní ọlá, tó sì ṣeé lóye. “Àwa sì ni ẹlẹ́rìí” àti “ń ṣègbọràn sí i” jẹ́ ọ̀nà àdánidá; a ṣe ọ̀rọ̀ ìṣe tí Gíríìkì fi sílẹ̀ láìsọ ní kedere nínú abala Ẹ̀mí Mímọ́.
