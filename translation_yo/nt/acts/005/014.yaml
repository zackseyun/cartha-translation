  terminology: “gba Olúwa gbọ́” jẹ́ ọ̀nà àdánidá láti sọ πιστεύειν τῷ κυρίῳ; “Olúwa” pa κύριος mọ́ láì sọ “Jésù” sínú ọ̀rọ̀ níbi tí Gíríìkì kò ti sọ ọ́. “ọ̀pọ̀lọpọ̀ ọkùnrin àti obìnrin” pa πλήθη àti τε καί mọ́.
