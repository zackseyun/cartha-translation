  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ yí ìbáṣepọ̀ gírámà Gíríìkì padà: ó sọ pé àwọn onígbàgbọ́ náà ń pọ̀ sí i, lẹ́yìn náà ó sì sọ pé a ń fi ọkùnrin àti obìnrin kún wọn. Ní Gíríìkì, "ọ̀pọ̀lọpọ̀ ọkùnrin àti obìnrin" ni ó ń ṣàlàyé àwọn tí a ń fi kún ẹgbẹ́ àwọn onígbàgbọ́. Ìtúnṣe náà mú ìbáṣepọ̀ yìí hàn, ó sì pa ìṣe tí ń bá a lọ mọ́.'
