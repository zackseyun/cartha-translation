source:
  edition: SBLGNT
  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: yo
  text: Àwọn tí wọ́n gba Olúwa gbọ́ sì ń di púpọ̀ sí i—ìyẹn ni, ọ̀pọ̀lọpọ̀ ọkùnrin àti obìnrin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń fi ọ̀pọ̀lọpọ̀ ọkùnrin àti obìnrin tí wọ́n gba Olúwa gbọ́ kún ẹgbẹ́ náà,” tàbí “wọ́n ń darapọ̀ mọ́ ẹgbẹ́ náà.” Ọ̀rọ̀ ìṣe Gíríìkì náà ń fi ìṣe tí ń bá a lọ hàn, ó sì lè ní ohùn àfipamọ́ tó lè fi hàn pé Ọlọ́run ni ẹni tí ń fi wọn kún ẹgbẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: ń pọ̀ sí i
  rationale: Ó fi hàn pé iye wọn ń tẹ̀ síwájú láti máa pọ̀ sí i; ọ̀rọ̀ yìí sì bá èdè Yorùbá àdánidá mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakora líle hàn; “sì” ń so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá.
- source_word: προσετίθεντο
  choice: ni a ń fi kún wọn
  rationale: Ìtumọ̀ yìí pa ohùn àfipamọ́ àti ìṣe tó ń bá a lọ mọ́, láì sọ taara ẹni tó ń fi wọ́n kún ìjọ.
- source_word: πιστεύοντες
  choice: àwọn tí ó gba … gbọ́
  rationale: Participle náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ẹni tí ìgbàgbọ́ ń dá mọ̀; gbólóhùn yìí jẹ́ Yorùbá tó ṣe kedere.
- source_word: τῷ κυρίῳ
  choice: gba Olúwa gbọ́
  rationale: Dative náà tọ́ka sí Olúwa gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ wọn dojú kọ; “gba … gbọ́” ni ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: κύριος
  choice: Olúwa
  rationale: Ó pa oyè ọ̀wọ̀ àti agbára Kristi mọ́, láì túmọ̀ rẹ̀ sí orúkọ “Jésù” nínú ẹsẹ náà.
- source_word: πλήθη
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ó sọ bí iye àwọn tí a ń fi kún wọn ṣe pọ̀ tó ní Yorùbá tó rọrùn láti lóye.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: ọkùnrin àti obìnrin
  rationale: Ó pa mímú àwọn ẹ̀yà méjèèjì—ọkùnrin àti obìnrin—wọ inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A pa “Olúwa” mọ́; nínú àyíká Ìṣe àwọn Àpọ́sítélì, ó ṣeé ṣe jù pé Jésù ni ó ń tọ́ka sí.
  alternative: A lè gbọ́ “Olúwa” gẹ́gẹ́ bí Ọlọ́run lápapọ̀.
  rationale: Àyíká àwọn àkótán ìwàásù inú Ìṣe sábà máa ń lo κύριος fún Jésù tó jíǹde, ṣùgbọ́n ìtumọ̀ kò fi “Jésù” rọ́pò oyè tí Gíríìkì lò.
- issue: Ohùn àti ìrísí ìṣe προσετίθεντο
  choice: 'Ìṣe tó ń bá a lọ ní ohùn àfipamọ́: “ni a ń fi kún wọn.”'
  alternative: 'Ìtumọ̀ àárín tàbí aláìní olùṣe: “wọ́n ń darapọ̀ mọ́ wọn.”'
  rationale: Ohùn àfipamọ́ pa àbá pé Ọlọ́run lè jẹ́ ẹni tó ń fi wọ́n kún ìjọ mọ́, ṣùgbọ́n kò sọ Ọlọ́run di olùṣe ní gbangba ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A yà “ọ̀pọ̀lọpọ̀ ọkùnrin àti obìnrin” sí apá ìtẹnumọ́ láti pa ìwọ̀n πλήθη àti τε καί mọ́.
