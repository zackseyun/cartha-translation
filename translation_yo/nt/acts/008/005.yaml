id: ACT.8.5
reference: Acts 8:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: yo
  text: Fílípì sì sọ̀ kalẹ̀ lọ sí ìlú Samáríà[a][b], ó ń kéde Mèsáyà náà fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú kan ní Samáríà.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìlú pàtó kan ní Samáríà, tàbí sí ọ̀kan lára àwọn ìlú tó wà ní agbègbè àwọn ará Samáríà.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “sí ìlú Samáríà.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Àsopọ̀ onírẹ̀lẹ̀ ni δὲ níbí, tó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi hàn ní Yorùbá láì sọ ọ́ di ìtakora tó lágbára.
- source_word: κατελθὼν
  choice: sọ̀ kalẹ̀ lọ
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ ìrìn sí ibi tí ó rẹ̀ sílẹ̀. Ìṣe alábápín aorist náà di ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì nínú Yorùbá àdánidá.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: ìlú Samáríà
  rationale: Èyí tẹ̀ lé ìsọ pàtó tó wà nínú Gíríìkì, ṣùgbọ́n kò fi tipátipá pinnu bóyá Samáríà jẹ́ orúkọ ìlú náà tàbí agbègbè tí ìlú náà wà; àlàyé ìsàlẹ̀ ojú ìwé pa àìdájú náà mọ́.
- source_word: ἐκήρυσσεν
  choice: ń kéde
  rationale: “Kéde” mú èrò ìkéde ní gbangba inú κηρύσσω jáde, “ń” sì bá irú ìṣe tí imperfect ń ṣàpèjúwe mu ní àyíká yìí.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí fi àwọn olùgbọ́ tí Fílípì ń bá sọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: τὸν χριστόν
  choice: Mèsáyà náà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn, kì í ṣe gẹ́gẹ́ bí orúkọ lásán. “Mèsáyà” jẹ́ oyè tí àwọn òǹkàwé Yorùbá mọ̀, “náà” sì fi ìsọ pàtó inú Gíríìkì hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà náà
  alternative: Kristi náà; Ẹni tí a fòróró yàn náà
  rationale: Nínú àyíká ìkéde yìí, ọ̀rọ̀ náà jẹ́ oyè Mèsáyà. Yíyan “Mèsáyà” pa ìtumọ̀ oyè àti ìpìlẹ̀ Júù rẹ̀ mọ́, dípò kí a lò “Kristi” bí ẹni pé orúkọ ẹni ni.
- issue: Bóyá πόλις túmọ̀ sí ìlú pàtó tàbí ìlú kan nínú agbègbè Samáríà
  choice: ìlú Samáríà
  alternative: ìlú kan ní Samáríà
  rationale: Àpilẹ̀kọ pàtó τὴν ṣètìlẹ́yìn fún ìtumọ̀ pàtó, ṣùgbọ́n ọ̀rọ̀ Gíríìkì ṣì lè tọ́ka sí ìlú kan nínú agbègbè náà; nítorí náà, a kò pa ìtumọ̀ kejì rẹ́, a fi sí àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ìtẹ̀síwájú gbolohun náà jẹ́ ti ìtàn àdánidá, “Mèsáyà” sì dúró gẹ́gẹ́ bí oyè.
