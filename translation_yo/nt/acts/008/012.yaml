id: ACT.8.12
reference: Acts 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n gba Fílípì gbọ́ bí ó ti ń kéde ìhìn rere nípa ìjọba Ọlọ́run àti orúkọ Jésù Mèsáyà[a], wọ́n sì ń gba ìrìbọmi, àwọn ọkùnrin àti àwọn obìnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “orúkọ Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè, a sì túmọ̀ ọ́ sí “Mèsáyà” níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅτε fi àkókò hàn, δέ sì ṣe ìyípadà kékeré tàbí ìtakora pẹ̀lẹ́ nínú ìtàn; ọ̀rọ̀ yìí mú méjèèjì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: wọ́n gba ti Fílípì gbọ́
  rationale: Dátífù náà túmọ̀ sí pé wọ́n gba Fílípì gbọ́ gẹ́gẹ́ bí ẹni tó ń sọ ìhìn náà, kì í ṣe pé wọ́n fi ìgbàgbọ́ ìgbàlà sínú Fílípì.
- source_word: εὐαγγελιζομένῳ
  choice: bí ó ti ń kéde ìhìn rere
  rationale: Partisípọ̀ ọ̀rọ̀-ìṣe àkókò ìsinsìnyí ṣàlàyé ohun tí Fílípì ń ṣe nígbà tí wọ́n gbà á gbọ́; “kéde ìhìn rere” pa ìtumọ̀ ajíhìnrere mọ́ ní èdè tí ó ṣe kedere.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: nípa ìjọba Ọlọ́run
  rationale: περί pẹ̀lú jenítífù tọ́ka sí kókó ìkéde náà; “ìjọba Ọlọ́run” jẹ́ ìtumọ̀ tí ó ṣe kedere, tí ó sì mọ́gbọ́n dání.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: orúkọ Jésù Mèsáyà
  rationale: A pa “orúkọ” mọ́ nítorí ó lè dúró fún ẹni náà, àṣẹ rẹ̀, tàbí ìdánimọ̀ rẹ̀. Mèsáyà fi ipò oyè Χριστός hàn ní àyíká yìí.
- source_word: ἐβαπτίζοντο
  choice: a ń ṣe ìrìbọmi fún wọn
  rationale: Àìpé pàsífù náà fi ìṣe tí ń lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn bí àwọn ènìyàn ti ń dáhùn sí ìkéde náà.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: àti àwọn ọkùnrin àti àwọn obìnrin
  rationale: τε ... καὶ so ẹgbẹ́ méjèèjì pọ̀, ó sì pa ìtẹnumọ́ Lúùkù pé ọkùnrin àti obìnrin wà lára wọn mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè mèsáyà níbí; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ láìsọ ọ́ di orúkọ ìdílé. Àkọlé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ Yorùbá tí ó wọ́pọ̀ sí i hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìlọsíwájú ìtàn àti apá ìṣe tí ń lọ nínú Gíríìkì mọ́.
