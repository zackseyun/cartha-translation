  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọkùnrin olùfọkànsìn sin Sítéfánù,[a] wọ́n sì ṣe ìṣọ̀fọ̀ ńlá lórí rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “pèsè òkú Sítéfánù sílẹ̀ fún ìsìnkú” tàbí “gbé Sítéfánù lọ fún ìsìnkú”; ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí wọ́n ṣe bójú tó òkú náà, kì í ṣe ìsìnkú nìkan.
    reason: lexical_alternative
  - marker: b
    text: “Ìṣọ̀fọ̀ ńlá” lè ní ẹkún àti ìfihàn ìbànújẹ́ ní gbangba, kì í ṣe ìbànújẹ́ inú ọkàn nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: sin
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí bí wọ́n ṣe bójú tó òkú Sítéfánù lẹ́yìn ikú rẹ̀, pẹ̀lú ìsìnkú gẹ́gẹ́ bí àbájáde iṣẹ́ náà. “Sin” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè tẹnu mọ́ gbígbé òkú náà lọ tàbí mímúra rẹ̀ sílẹ̀ fún ìsìnkú.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyípadà kékeré tàbí ìyàtọ̀ hàn láàárín ìṣẹ̀lẹ̀ yìí àti ohun tó ṣáájú; “Ṣùgbọ́n” mú ìyípadà ìtàn náà hàn kedere.
- source_word: ἄνδρες εὐλαβεῖς
  choice: àwọn ọkùnrin olùfọkànsìn
  rationale: ἄνδρες jẹ́ ọ̀pọ̀ akọ ní pàtó, nítorí náà “àwọn ọkùnrin” ni a lò. “Olùfọkànsìn” sọ ìwà ìbẹ̀rù Ọlọ́run àti ìfọkànsìn ẹ̀sìn tí εὐλαβεῖς ní lọ́nà àdánidá.
- source_word: ἐποίησαν
  choice: wọ́n sì ṣọ̀fọ̀
  rationale: ἐποίησαν jẹ́ ọ̀rọ̀-ìṣe tó fẹ́rẹ̀ẹ́ má ní ìtumọ̀ lọ́tọ̀ nínú gbólóhùn yìí, ó sì para pọ̀ mọ́ κοπετόν. Ní Yorùbá, fífi èrò náà hàn pẹ̀lú ọ̀rọ̀-ìṣe “ṣọ̀fọ̀” dára ju títúmọ̀ rẹ̀ ní ọ̀rọ̀ fún ọ̀rọ̀ lọ.
- source_word: κοπετὸν μέγαν
  choice: ṣọ̀fọ̀ ńlá
  rationale: κοπετός túmọ̀ sí ọ̀fọ̀ tàbí ẹkún ìbànújẹ́, tí ó sábà máa ń ní ìfarahàn gbangba tàbí ohùn; “ṣọ̀fọ̀ ńlá” pa ìwọ̀n líle tí μέγαν fi hàn mọ́.
- source_word: ἐπ’ αὐτῷ
  choice: lórí rẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀ tó ní í ṣe pẹ̀lú ọ̀fọ̀, ἐπί pẹ̀lú dátífù túmọ̀ sí ṣíṣọ̀fọ̀ nítorí ẹni náà; “lórí rẹ̀” jẹ́ ìsọ̀rọ̀ Yorùbá tó bójú mu.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. A yí idiom ἐποίησαν κοπετὸν padà sí “wọ́n sì ṣọ̀fọ̀” kí ó lè dun gẹ́gẹ́ bí Yorùbá àdánidá, láì sọ agbára μέγαν nù.
