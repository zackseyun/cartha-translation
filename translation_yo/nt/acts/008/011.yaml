source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: yo
  text: Wọ́n sì ń fiyè sí i, nítorí pé ó ti fi àwọn iṣẹ́ idán rẹ̀ ya wọ́n lẹ́nu fún ìgbà pípẹ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àkókò gígùn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú iṣẹ́ òṣó rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: ń fetí sí i
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ń darí àfiyèsí wọn sí Simoni, wọ́n sì ń gba ọ̀rọ̀ rẹ̀ gbọ́; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì mú ìṣe tí ó ń bá a lọ nínú imperfect jáde.
- source_word: αὐτῷ
  choice: sí i
  rationale: Dative náà tọ́ka sí Simoni gẹ́gẹ́ bí ẹni tí wọ́n ń fetí sí.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: nítorí pé ... fún àkókò gígùn
  rationale: διά pẹ̀lú articular infinitive sọ ìdí tí wọ́n fi ń fetí sí i; ἱκανῷ χρόνῳ túmọ̀ sí àkókò tí ó pọ̀ tàbí tí ó gùn tó.
- source_word: ταῖς μαγείαις
  choice: fi iṣẹ́ idán rẹ̀
  rationale: μαγεία tọ́ka sí lílo idán tàbí àwọn iṣẹ́ idán. Fífi ‘rẹ̀’ kún un wá láti inú àyíká ọ̀rọ̀, ó sì mú gbolóhùn náà ṣe kedere ní Yorùbá.
- source_word: ἐξεστακέναι
  choice: ó ti ... ya wọ́n lẹ́nu
  rationale: Perfect infinitive náà sọ ipa ìyàlẹ́nu tí ó ti dá sílẹ̀ tí ó sì ń ṣàlàyé ìdí tí wọ́n fi ń bá a lọ ní fífetí sí Simoni; ‘ya wọ́n lẹ́nu’ kò túmọ̀ rẹ̀ ju bí Gíríìkì ṣe sọ lọ.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn ènìyàn tí a mẹ́nu kàn ṣáájú gẹ́gẹ́ bí ẹni tí iṣẹ́ Simoni yà lẹ́nu.
theological_decisions:
- issue: Irú iṣẹ́ tí μαγείαις ń tọ́ka sí
  choice: iṣẹ́ idán
  alternative: oògùn ìṣe / iṣẹ́ òṣó
  rationale: Ẹsẹ̀ náà sọ pé Simoni ń ṣe μαγεία, ṣùgbọ́n kò pinnu ní kíkún bóyá ẹ̀tàn lasán ni, iṣẹ́ agbára òkùnkùn ni, tàbí àpapọ̀ méjèèjì. ‘Iṣẹ́ idán’ pa àìdánilójú yẹn mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ń fetí sí i’ fún ìṣe tí ó ń bá a lọ, ‘ya wọ́n lẹ́nu’ fún ipa ἐξίστημι, àti ‘iṣẹ́ idán’ láti yẹra fún ṣíṣe àlàyé irú agbára náà ju ohun tí ẹsẹ̀ sọ lọ. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
