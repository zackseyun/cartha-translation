  source_fidelity: Ìtumọ̀ náà mú ìdí-ọrọ̀ διὰ τὸ, ìṣe imperfect ti προσεῖχον, àti ipa tí ó ti wà tẹ́lẹ̀ nínú perfect infinitive ἐξεστακέναι jáde dáadáa. Síbẹ̀, ‘àkókò gígùn’ kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ fún ἱκανῷ χρόνῳ, àti àlàyé ìsàlẹ̀ (a), ‘fún àkókò tí ó tó,’ kò jẹ́ àtúnmọ̀ tó pé fún ‘for a long time.’
