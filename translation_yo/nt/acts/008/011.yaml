  terminology: ‘Àwọn iṣẹ́ idán rẹ̀’ pa ọ̀pọ̀ μαγείαις mọ́, láìpinnu bóyá ẹ̀tàn tàbí agbára ìkọ̀kọ̀ ni wọ́n jẹ́. ‘Ya wọ́n lẹ́nu’ bá ἐξεστακέναι mu, kò sì túmọ̀ rẹ̀ sí ìfọwọ́sowọ́pọ̀ ìbùkún tàbí ìṣàkóso ẹ̀mí.
