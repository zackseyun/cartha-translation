  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: yo
  text: Ó sì wí pé, “Báwo ni mo ṣe lè ṣe é, bí ẹnì kan kò bá tọ́ mi sọ́nà[a]?” Nígbà náà, ó rọ̀[b] Fílípì pé kí ó gòkè wá, kí ó sì jókòó pẹ̀lú òun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “bí ẹnì kan kò bá ṣamọ̀nà mi.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí dídarí ẹni ní ọ̀nà gangan àti sí ṣíṣe ìtọ́sọ́nà fún un láti lóye ohun kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ó pe Fílípì pé kí ó gòkè wá, kí ó sì jókòó pẹ̀lú òun.” Ọ̀rọ̀ náà lè túmọ̀ sí ìbéèrè onítara tàbí ìpè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Báwo ni mo ṣe lè ṣe é
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ agbára tí ó sinmi lórí ipò kan jáde, láì fi ọ̀rọ̀ bí ‘lóye’ kún ohun tí Gíríìkì kò sọ ní tààràtà.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: bí ẹnì kan kò bá tọ́ mi sọ́nà
  rationale: ‘Tọ́ mi sọ́nà’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó lè túmọ̀ sí dídarí ẹni ní ọ̀nà gangan tàbí ríràn án lọ́wọ́ láti lóye ohun kan; ó tipa bẹ́ẹ̀ pa ìtumọ̀ méjèèjì ti ὁδηγέω mọ́.
- source_word: παρεκάλεσέν
  choice: ó rọ̀
  rationale: ‘Rọ̀’ lè fi ìbéèrè tí ó ní ìtara hàn láì mú un le débi ‘ṣagbe,’ ó sì bá àyè yìí mu ju ‘béèrè’ lásán lọ.
- source_word: τε
  choice: Nígbà náà
  rationale: Ó so ìṣẹ̀lẹ̀ kejì mọ́ ti àkọ́kọ́ ní ọ̀nà ìtàn Yorùbá tí ó rọrùn, ó sì fi ìtẹ̀síwájú ìtàn hàn.
- source_word: ἀναβάντα
  choice: kí ó gòkè wá
  rationale: Ó pa àwòrán gígòkè sínú kẹ̀kẹ́ mọ́ dípò lílo ọ̀rọ̀ tí yóò kàn túmọ̀ sí wíwọlé.
- source_word: καθίσαι σὺν αὐτῷ
  choice: kí ó sì jókòó pẹ̀lú òun
  rationale: Èyí ni ìtumọ̀ àdánidá ti jíjókòó pẹ̀lú ẹnì kan, láì pinnu ní pàtó pé lẹ́gbẹ̀ẹ́ rẹ̀ ni.
- source_word: Φίλιππον
  choice: Fílípì
  rationale: A kọ orúkọ náà ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘òun’ ní ìparí láti mú kí ó ṣe kedere pé ọkùnrin náà ni Fílípì yóò jókòó pẹ̀lú, a sì pa àìsọ ohun tí δύναμαι ń tọ́ka sí ní tààràtà mọ́ ní ‘ṣe é.’
