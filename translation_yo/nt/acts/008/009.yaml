source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: yo
  text: Ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Símónì ti wà ní ìlú náà ṣáájú, ó ń ṣe iṣẹ́ idán[a], ó sì ń jẹ́ kí àwọn ènìyàn Samáríà yà á lẹ́nu. Ó ń sọ pé òun fúnra rẹ̀ jẹ́ ẹni ńlá kan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń ṣe iṣẹ́ oṣó.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka sí ṣíṣe iṣẹ́ idán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń sọ pé ẹni pàtàkì kan ni òun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ọkùnrin kan wà
  rationale: “Ọkùnrin” pa ìtọ́kasí akọ ti ἀνήρ mọ́; “kan” fi àìdá ẹni tí τις ń tọ́ka sí hàn. A kò fi δέ ṣe “nísinsìnyí,” ṣùgbọ́n a jẹ́ kí ìtẹ̀síwájú ìtàn hàn nípa ìṣètò gbólóhùn.
- source_word: ὀνόματι Σίμων
  choice: orúkọ rẹ̀ sì ń jẹ́ Símónì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni, a sì ṣe àkọsílẹ̀ orúkọ Gíríìkì náà gẹ́gẹ́ bí Símónì.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: Ó ti wà ní ìlú náà ṣáájú
  rationale: “Ti wà ... ṣáájú” mú ìtumọ̀ wíwà tẹ́lẹ̀ ti προϋπῆρχεν jáde; “ìlú náà” tọ́ka sí ìlú tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
- source_word: μαγεύων
  choice: ó ń ṣe iṣẹ́ idán
  rationale: “Ṣe iṣẹ́ idán” sọ ìṣe iṣẹ́ àràmàǹdà/mágìkì ní Yorùbá òde òní láìfi kún un pé agbára ẹ̀mí búburú ni tàbí pé ẹ̀tàn lásán ni.
- source_word: ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας
  choice: ó sì ń fi ìyàlẹ́nu bá àwọn ará Samáríà
  rationale: “Fi ìyàlẹ́nu bá” mú ipa causative ἐξιστάνων hàn, “àwọn ará Samáríà” sì jẹ́ ọ̀nà àdánidá fún àwọn ènìyàn Samáríà gẹ́gẹ́ bí àwùjọ.
- source_word: λέγων εἶναί τινα ἑαυτὸν μέγαν
  choice: Ó ń sọ pé ẹni ńlá kan ni òun fúnra rẹ̀
  rationale: “Ó ń sọ” pa λέγων mọ́ láìyí i sí ẹ̀sùn; “òun fúnra rẹ̀” tẹnu mọ́ ἑαυτόν, “ẹni ńlá kan” sì pa ìtumọ̀ τινα ... μέγαν àti ìgbéraga ara ẹni mọ́.
theological_decisions:
- issue: Ìṣàpèjúwe iṣẹ́ Símónì
  choice: ṣe iṣẹ́ idán
  alternative: ṣe iṣẹ́ oṣó
  rationale: Ẹsẹ̀ náà sọ pé Símónì ń ṣe iṣẹ́ mágìkì, ṣùgbọ́n kò ṣàlàyé níbi yìí bóyá agbára ẹ̀mí búburú, ẹ̀tàn, tàbí ohun mìíràn ni orísun rẹ̀. “Iṣẹ́ idán” pa àìmọ̀ yẹn mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò sọ kún un.
- issue: Ìgbéraga ara Símónì
  choice: ẹni ńlá kan ni òun fúnra rẹ̀
  alternative: ẹni pàtàkì kan ni òun
  rationale: “Ẹni ńlá” sún mọ́ μέγαν, “òun fúnra rẹ̀” sì pa ìtẹnumọ́ ara ẹni mọ́ láìṣàlàyé irú ọlá tàbí ipò tí ó ní lọ́kàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pín gbólóhùn Gíríìkì gígùn náà sí àwọn gbólóhùn Yorùbá kéékèèké fún ìṣàn àdánidá, láìsọ ìtumọ̀ tàbí ìforígbárí inú ọ̀rọ̀ nù.
