  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: Símónì jẹ́ ọkùnrin kan, ó ti wà ní ìlú náà ṣáájú, ó ń ṣe idán, ó ń ya àwọn ènìyàn Samáríà lẹ́nu, ó sì ń polongo ìtóbi ara rẹ̀. Síbẹ̀, ìbẹ̀rẹ̀ náà náà “Ọkùnrin kan wà ... Ó ti wà” tún ìṣe wíwà kan ṣe, ó sì mú ìṣàn προϋπῆρχεν kéré síi. Àtúnṣe náà so orúkọ, wíwà-tẹ́lẹ̀, àti àwọn ìṣe participle pọ̀ mọ́ ara wọn bí ọ̀rọ̀ ìpilẹ̀ ṣe ṣe.'
