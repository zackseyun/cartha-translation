source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: yo
  text: Ó sì pàṣẹ pé kí kẹ̀kẹ́ náà dúró; àwọn méjèèjì náà, Fílípì àti ìwẹ̀fà náà, sì sọ̀ kalẹ̀ sínú omi[a], Fílípì sì ṣe ìbatisí fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ibi omi”; ṣùgbọ́n ọ̀rọ̀-ìsọ̀rọ̀ Gíríìkì náà sábà ń fi ìṣíkiri wọ inú omi hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Ó sì pàṣẹ
  rationale: ‘Pàṣẹ’ fi agbára ọ̀rọ̀ κέλευω hàn ní Yorùbá àdánidá láì di ọ̀rọ̀ líle jù.
- source_word: στῆναι τὸ ἅρμα
  choice: pé kí kẹ̀kẹ́ náà dúró
  rationale: Fún ọkọ̀, ‘kí ... dúró’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ó dá ìrìn rẹ̀ dúró.
- source_word: ἅρμα
  choice: kẹ̀kẹ́
  rationale: ‘Kẹ̀kẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye fún ọkọ̀ ẹṣin irú èyí; ó yẹra fún fífi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: κατέβησαν
  choice: sọ̀ kalẹ̀
  rationale: Ó tọ́ka sí ìṣíkiri sísàlẹ̀ gẹ́gẹ́ bí καταβαίνω ṣe túmọ̀ sí.
- source_word: ἀμφότεροι
  choice: àwọn méjèèjì
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé àwọn ènìyàn méjèèjì ló ṣe ìṣe náà.
- source_word: εἰς τὸ ὕδωρ
  choice: sínú omi
  rationale: ‘Sínú’ pa ìtọ́sọ́nà εἰς mọ́, èyí tí ó sábà ń tọ́ka sí ìṣíkiri wọ inú ohun kan.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Fílípì àti ìwẹ̀fà náà
  rationale: Ó dárúkọ àwọn méjèèjì ní kedere, ó sì pa ìtẹnumọ́ ètò τε ... καί mọ́.
- source_word: εὐνοῦχος
  choice: ìwẹ̀fà
  rationale: ‘Ìwẹ̀fà’ ni ọ̀rọ̀ Yorùbá tí a ti mọ̀ fún eunuch, ó sì pa ìtumọ̀ tààrà àti ìbámu pẹ̀lú àyíká ìtàn mọ́.
- source_word: ἐβάπτισεν αὐτόν
  choice: Fílípì sì bamitiisi rẹ̀
  rationale: Dídárúkọ Fílípì mú olùṣe ìṣe náà ṣe kedere ní Yorùbá; ‘bamitiisi’ jẹ́ ọ̀rọ̀ ìtumọ̀ Bíbélì tí kò fi ọ̀nà ìbatisí kan pàtó lé ọ̀rọ̀ náà lórí.
theological_decisions:
- issue: Bóyá ìtumọ̀ yóò pinnu ọ̀nà tí a fi ṣe ìbatisí
  choice: Lo ‘sọ̀ kalẹ̀ sínú omi’ àti ‘bamitiisi’ láì fi àlàyé míì kún ọ̀nà ìbatisí náà.
  alternative: Túmọ̀ βαπτίζω sí ‘rì sínú omi,’ tàbí dín agbára εἰς kù sí ‘dé ibi omi.’
  rationale: Gíríìkì sọ pé àwọn méjèèjì sọ̀ kalẹ̀ sínú omi àti pé Fílípì bamitiisi ọkùnrin náà. Ìtumọ̀ náà pa àwọn kókó wọ̀nyí mọ́ láì yan ẹ̀kọ́ ẹgbẹ́ ìjọ kan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu.
