id: ACT.8.22
reference: Acts 8:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: yo
  text: Nítorí náà, ronú pìwà dà kúrò nínú ìwà búburú rẹ yìí, kí o sì gbàdúrà sí Olúwa, bóyá a ó dárí èrò inú ọkàn rẹ jì ọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrònú ọkàn rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανόησον
  choice: ronú pìwà dà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìpè pàtó sí ìrònúpìwàdà; ó ní agbára ìwà rere àti ti ẹ̀mí ju ‘yí èrò rẹ padà’ lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ìbáwí Pétérù tí ó ṣáájú.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: kúrò nínú ìwà búburú rẹ yìí
  rationale: ‘Kúrò nínú’ pa ìtumọ̀ ἀπό mọ́, ‘ìwà búburú’ sì ṣàfihàn ibi nípa ìwà, kì í ṣe ìkórìíra lásán.
- source_word: δεήθητι
  choice: bẹ
  rationale: ‘Bẹ’ ń sọ ìrawọ́ ẹ̀bẹ̀ tọkàntọkàn, ó sì bá àyíká àdúrà mu.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó dúró ṣinṣin fún κύριος; a kò fi kún un pé bóyá Jésù tàbí Ọlọ́run ni a ń tọ́ka sí ní pàtó.
- source_word: εἰ ἄρα
  choice: bóyá
  rationale: ‘Bóyá’ pa àìdánilójú àti ìṣeéṣe tí gbólóhùn Gíríìkì náà ní mọ́, láì sọ ìdáríjì di ohun tí ó dájú tàbí tí kò ṣeé ṣe.
- source_word: ἀφεθήσεταί σοι
  choice: a ó dárí … jì ọ́
  rationale: Ọ̀nà àìsọ ẹni tó ṣe iṣẹ́ náà ní pàtó yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ohùn àfarawà Gíríìkì àti ìtumọ̀ ìdáríjì láti ọ̀dọ̀ Ọlọ́run mọ́.
- source_word: ἡ ἐπίνοια τῆς καρδίας σου
  choice: èrò inú ọkàn rẹ
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí èrò, ète, tàbí ohun tí ènìyàn pinnu; ‘èrò inú ọkàn’ pa àìdánilójú yẹn mọ́ láì fi ète búburú tí ó lágbára jù sínú ẹsẹ náà.
theological_decisions:
- issue: Ìwọ̀n ìdánilójú nípa bóyá a ó dárí jì í
  choice: 'A mú ‘bóyá’ lò, kí ọ̀rọ̀ Pétérù lè dúró gẹ́gẹ́ bí ọ̀rọ̀ oníwọ̀n: ó pàṣẹ ìrònúpìwàdà àti àdúrà, ṣùgbọ́n kò sọ àbájáde di ohun tí ó dájú.'
  alternative: Kí a túmọ̀ rẹ̀ bí ìlérí pé a ó dárí jì í dájúdájú, tàbí bí ìtọ́kasí pé ìdáríjì kò ṣeé ṣe.
  rationale: εἰ ἄρα pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú ní ohùn àfarawà pa ìṣeéṣe àti àìdánilójú mọ́; ìtumọ̀ kò gbọ́dọ̀ yanjú ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí lọ́nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘ronú pìwà dà’ gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tí ó wọ́pọ̀, ṣùgbọ́n a fi ‘kúrò nínú’ kún un láti pa ìtọ́sọ́nà ἀπό mọ́.
