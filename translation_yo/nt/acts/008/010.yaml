source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: yo
  text: Gbogbo wọn, láti ẹni kékeré dé ẹni ńlá, ń tẹ́tí sí i, wọ́n sì ń sọ pé, “Ọkùnrin yìí ni agbára Ọlọ́run tí a ń pè ní Ńlá.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọkùnrin yìí ni ẹni tí a ń pè ní Agbára Ńlá Ọlọ́run.” Èdè Gíríìkì lè jẹ́ ìsọ̀rọ̀ kúkúrú bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: ń fiyè sí i
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ń darí àfiyèsí wọn sí Símónì, wọ́n sì ń gba ohun tí ó ń sọ tàbí ṣe ní pàtàkì. ‘Ń fiyè sí i’ jẹ́ èdè Yorùbá àdánidá tí kò fi ìfọkànsìn tàbí ìgbọ́ràn tí ó pọ̀ ju ohun tí Gíríìkì sọ lọ sí i.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Èyí fi hàn gbangba pé gbogbo àwọn ènìyàn tí a mẹ́nu kàn ni ó wà nínú ọ̀rọ̀ náà.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: láti ẹni kékeré dé ẹni ńlá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí tọ́ka sí gbogbo ẹ̀ka àwọn ènìyàn, láti àwọn tí kò lókìkí tàbí kò ní ipò dé àwọn olókìkí tàbí aláṣẹ. Ìtumọ̀ yìí pa àwòrán ‘kékeré sí ńlá’ mọ́.
- source_word: λέγοντες
  choice: wọ́n sì ń sọ pé
  rationale: Ọ̀rọ̀ aláìparí náà ń ṣàpèjúwe ohun tí wọ́n ń sọ ní àkókò kan náà tí wọ́n ń fiyè sí Símónì.
- source_word: Οὗτός
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí Símónì gẹ́gẹ́ bí ènìyàn; ‘Ọkùnrin yìí’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: agbára Ọlọ́run
  rationale: Èyí pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́, ó sì jẹ́ kí gbolohun náà lè ṣiṣẹ́ gẹ́gẹ́ bí ohun tí ogunlọ́gọ̀ fi ń pe Símónì.
- source_word: ἡ καλουμένη Μεγάλη
  choice: tí a ń pè ní ‘Ńlá’
  rationale: καλουμένη sọ nípa orúkọ tàbí oyè tí a ń fi pe agbára náà. Àmì ìfọ̀rọ̀wérọ̀ kékeré yí ‘Ńlá’ ká láti fi iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè hàn, láìjẹ́ kí asọyé Lúùkù dà bí ẹni pé ó fọwọ́ sí i.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ ogunlọ́gọ̀ jẹ́ oyè ìtọ́kasí sí agbára àtọ̀runwá tàbí àpèjúwe ohun tí wọ́n gbà pé Símónì jẹ́
  choice: “Ọkùnrin yìí ni agbára Ọlọ́run tí a ń pè ní ‘Ńlá.’”
  alternative: “Èyí ni ohun tí a ń pè ní Agbára Ńlá Ọlọ́run.”
  rationale: Gíríìkì ròyìn ohun tí àwọn ènìyàn ń sọ nípa Símónì; kò sọ pé akọ̀ròyìn fọwọ́ sí ìgbàgbọ́ wọn. Ìtumọ̀ àkọ́kọ́ pa ìdánimọ̀ tí wọ́n fi fún un àti ìtumọ̀ oyè Μεγάλη mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà oyè tí ó há pọ̀ sí i hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún ọ̀pọ̀ ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ. ‘Ẹni kékeré dé ẹni ńlá’ pa àkójọpọ̀ Gíríìkì mọ́, ‘ń fiyè sí i’ sì yẹra fún fífi ìfọkànsìn tí ọ̀rọ̀ orísun kò sọ kún un.
