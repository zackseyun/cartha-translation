id: ACT.8.1
reference: Acts 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: yo
  text: Ṣọ́ọ̀lù sì ń fọwọ́ sí pípa rẹ̀. Ní ọjọ́ náà, inúnibíni ńlá kan sì wáyé lòdì sí ìjọ tí ó wà ní Jerusalẹmu; gbogbo wọn sì fọ́n ká sí àwọn agbègbè ilẹ̀ Jùdíà àti Samáríà, àyàfi àwọn aposteli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Ṣọ́ọ̀lù
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe sábà ń kọ orúkọ Saulu ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: συνευδοκῶν
  choice: ń fi ìtẹ́wọ́gbà rẹ̀ hàn sí
  rationale: Ìṣe aláìparí pẹ̀lú ἦν fi ìtẹ́wọ́gbà tí ó ń bá a lọ nígbà ìṣẹ̀lẹ̀ náà hàn; ọ̀rọ̀ yìí kò sọ pé Ṣọ́ọ̀lù fúnra rẹ̀ ló ṣe pípa náà.
- source_word: ἀναιρέσει αὐτοῦ
  choice: pípa tí wọ́n pa á
  rationale: Ó tọ́ka sí ìṣe mímú ẹni kúrò láàyè, láìfi ẹ̀tọ́ òfin sí i bí ‘ìdájọ́ ikú’ tàbí fi ìtumọ̀ tó lágbára ju ọ̀rọ̀ Gíríìkì náà lọ sí i bí ‘ìpànìyàn.’
- source_word: Ἐγένετο
  choice: bẹ̀rẹ̀ sí í dé bá
  rationale: Nínú àyíká yìí, ó fi ìbẹ̀rẹ̀ inúnibíni náà hàn ní èdè Yorùbá adayeba.
- source_word: διωγμὸς μέγας
  choice: inúnibíni ńlá
  rationale: Ó pa orúkọ àti ìtẹnumọ́ μέγας mọ́ ní ọ̀nà tó ṣe kedere.
- source_word: ἐπὶ τὴν ἐκκλησίαν
  choice: dé bá ìjọ
  rationale: Ó fi hàn pé ìjọ ni inúnibíni náà dojú kọ, ní ọ̀nà tí ó bá gbolohun Yorùbá mu.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó pa agbára ‘gbogbo’ mọ́, nígbà tí àyíká àti gbólóhùn ‘àyàfi àwọn aposteli’ ń ṣàlàyé àwọn tí ọ̀rọ̀ náà kàn.
- source_word: διεσπάρησαν
  choice: fọ́n ká
  rationale: Ọ̀rọ̀ Yorùbá adayeba fún fífi àwọn ènìyàn tú ká sí onírúurú ibi.
- source_word: κατὰ τὰς χώρας
  choice: sí àwọn agbègbè
  rationale: Ó mú ìtumọ̀ àwọn ilẹ̀ tàbí ẹkùn tí wọ́n tú ká sí jáde kedere.
- source_word: πλὴν τῶν ἀποστόλων
  choice: àyàfi àwọn aposteli
  rationale: ‘Àyàfi’ fi ìyọkúrò tí πλήν sọ hàn ní tààràtà.
theological_decisions:
- issue: Ìtumọ̀ ἀναιρέσει αὐτοῦ nípa ikú Stefanu
  choice: pípa tí wọ́n pa á
  alternative: ìdájọ́ ikú rẹ̀; ikú rẹ̀; ìpànìyàn rẹ̀
  rationale: Aṣàyàn yìí tẹnumọ́ ìṣe pípa ènìyàn láìsọ pé ó jẹ́ ìdájọ́ òfin tó lẹ́tọ̀ọ́ tàbí láìfi ẹ̀sùn òfin tó lágbára ju ọ̀rọ̀ ìpilẹ̀ṣẹ̀ lọ kún un.
- issue: Ìwọ̀n πάντες (‘gbogbo’)
  choice: gbogbo wọn ... àyàfi àwọn aposteli
  alternative: gbogbo àwọn onígbàgbọ́; gbogbo ènìyàn
  rationale: Èdè náà pa ọ̀nà tí orísun gbà sọ ‘gbogbo’ mọ́, ó sì jẹ́ kí ìyọkúrò àwọn aposteli àti àyíká ìjọ Jerusalẹmu pinnu ìwọ̀n rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, adayeba, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ìjọ,’ ‘inúnibíni,’ àti ‘aposteli’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí òǹkàwé Yorùbá òde òní mọ̀. A kò fi àmì àlàyé ẹsẹ̀ sí ọ̀rọ̀ nítorí pé àlàyé Gẹ̀ẹ́sì tí a pèsè kò bá ibi àmì [a] rẹ̀ mu, aṣàyàn Yorùbá náà sì ti pa ìtumọ̀ orísun mọ́ láìní àlàyé míì.
