revisions:
- from: Ṣọ́ọ̀lù sì ń fi ìtẹ́wọ́gbà rẹ̀ hàn sí pípa tí wọ́n pa á. Ní ọjọ́ náà, inúnibíni ńlá bẹ̀rẹ̀ sí í dé bá ìjọ tí ó wà ní Jerusalẹmu; gbogbo wọn sì fọ́n ká sí àwọn agbègbè Judea àti Samaria, àyàfi àwọn aposteli.
  to: Ṣọ́ọ̀lù sì ń fọwọ́ sí pípa rẹ̀. Ní ọjọ́ náà, inúnibíni ńlá kan sì wáyé lòdì sí ìjọ tí ó wà ní Jerusalẹmu; gbogbo wọn sì fọ́n ká sí àwọn agbègbè ilẹ̀ Jùdíà àti Samáríà, àyàfi àwọn aposteli.
  rationale: A tún gbolohun àkọ́kọ́ ṣe kí ó lè sọ ìfọwọ́sí Ṣọ́ọ̀lù sí ìṣe pípa náà ní tààràtà, láìtún ‘pípa’ ṣe. A sì rọ́pò ‘bẹ̀rẹ̀ sí í dé bá’ pẹ̀lú ‘wáyé lòdì sí’ fún ìbámu tó súnmọ́ ἐγένετο ... ἐπὶ. A fi ‘ilẹ̀’ kún ‘àwọn agbègbè ilẹ̀ Jùdíà àti Samáríà’ láti mú ìtumọ̀ χώρας hàn dáadáa. Kò sí ẹsẹ̀-àlàyé Yorùbá tí a nílò, nítorí ‘pípa rẹ̀’ ti pa àìdánilójú ìwà/òfin tí ọrọ̀ Gíríìkì náà ní mọ́.
