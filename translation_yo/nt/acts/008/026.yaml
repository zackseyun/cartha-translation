id: ACT.8.26
reference: Acts 8:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: yo
  text: Áńgẹ́lì Olúwa kan sì sọ fún Fílípì pé, “Dìde, kí o sì lọ sí apá gúúsù[a], sí ojú ọ̀nà tí ó sọ̀kalẹ̀ láti Jerúsálẹ́mù lọ sí Gásà.” Ojú ọ̀nà ahoro ni èyí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ọ̀sán gangan.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ibi (“sí apá gúúsù”) tàbí sí àsìkò (“ní ọ̀sán”).
    reason: alternative_reading
  - marker: b
    text: Tàbí “Aṣálẹ̀ ni èyí,” èyí tí ó lè túmọ̀ sí pé ọ̀nà náà gba agbègbè aṣálẹ̀ kọjá, kì í ṣe pé ojú ọ̀nà náà fúnra rẹ̀ ni ahoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Áńgẹ́lì Olúwa kan sì
  rationale: “Áńgẹ́lì ... kan” fi àìní atókùn pàtó hàn ní èdè Yorùbá, “Olúwa” sì pa ìtumọ̀ àṣẹ Ọlọ́run mọ́. “Sì” mú ipa àsopọ̀ δὲ jáde láìfi ọ̀rọ̀ àsìkò tí kò sí nínú orísun kún un.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: sọ fún Fílípì pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti darapọ̀ ọ̀rọ̀-ìṣe àti participle náà kí ó sì ṣí ọ̀rọ̀ tààrà sílẹ̀ láìsọ gbolohun di líle.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Dìde, kí o sì lọ
  rationale: Ó pa àṣẹ méjèèjì àti ìgbésẹ̀ lẹ́sẹ̀kẹsẹ̀ mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: κατὰ μεσημβρίαν
  choice: sí apá gúúsù[a]
  rationale: Pẹ̀lú ọ̀rọ̀ ìrìn-àjò, ìtumọ̀ ibi, “sí apá gúúsù,” ló ṣeé ṣe jù; ṣùgbọ́n ìtumọ̀ àsìkò, “ní ọ̀sán gangan,” jẹ́ ojúlówó àṣàyàn, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- source_word: ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: sí ojú ọ̀nà tí ó sọ̀kalẹ̀ láti Jerúsálẹ́mù lọ sí Gásà
  rationale: “Sọ̀kalẹ̀” pa àwòrán ilẹ̀ àti ìlò ọ̀rọ̀ nípa fífi Jerúsálẹ́mù sílẹ̀ mọ́; “láti ... lọ sí ...” sì jẹ́ ìtumọ̀ Yorùbá tí ó rọrùn.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Ojú ọ̀nà ahoro ni èyí.[b]
  rationale: Ìbámu abo nínú Gíríìkì lè tọ́ka sí ὁδός, nítorí náà a tún “ojú ọ̀nà” sọ fún ìmọ̀ kedere. “Ahoro” fi hàn pé ibi náà dá wà tàbí pé ènìyàn kò pọ̀ níbẹ̀, ṣùgbọ́n a pa ìtumọ̀ “aṣálẹ̀” mọ́ nínú àlàyé.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú “áńgẹ́lì Olúwa”
  choice: A túmọ̀ gbólóhùn náà ní tààrà gẹ́gẹ́ bí iṣẹ́ aṣojú Ọlọ́run, láìdá irú ẹni tí áńgẹ́lì náà jẹ́ ní pàtó.
  alternative: “Áńgẹ́lì kan tí Ọlọ́run rán” tàbí kíkà á gẹ́gẹ́ bí ẹni ìfihàn pàtó kan.
  rationale: Ọ̀rọ̀ orísun sọ pé áńgẹ́lì náà jẹ́ ti Olúwa tàbí pé ó wá láti ọ̀dọ̀ rẹ̀, ṣùgbọ́n kò fi dandan mú ìdánimọ̀ ẹ̀kọ́ ìsìn tó jinlẹ̀ sí i wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò Yorùbá mu, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
