  text: And there was great joy in that city.
translation:
  language: yo
  text: Ayọ̀ ńlá sì wà ní ìlú náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: wà
  rationale: Nínú ìṣètò ọ̀rọ̀ yìí, ἐγένετο ń sọ pé ipò kan bẹ̀rẹ̀ sí í wà tàbí pé ó wà níbẹ̀. “Wà” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìtumọ̀ existential yìí láì mú kí gbólóhùn náà le.
- source_word: δὲ
  choice: sì
  rationale: δὲ ń tẹ ìtàn náà síwájú, kò sì pọn dandan kí ó fi ìtakora hàn. “Sì” bá ìṣàn ìtàn Yorùbá mu.
- source_word: πολλὴ χαρά
  choice: ayọ̀ ńlá
  rationale: πολλή ń mú bí ayọ̀ náà ti pọ̀ tó hàn. “Ayọ̀ ńlá” jẹ́ ọ̀rọ̀ àdáyébá, ó sì pa agbára gbólóhùn Gíríìkì mọ́.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: ní ìlú náà
  rationale: “Ní ìlú náà” tọ́ka sí ìlú pàtó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé fún gbólóhùn náà.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ; gbólóhùn náà rọrùn, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “sì” lẹ́yìn kókó gbólóhùn gẹ́gẹ́ bí ìlànà àdáyébá Yorùbá.
