source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: yo
  text: Nígbà náà, Fílípù la ẹnu rẹ̀[a] sílẹ̀, ó sì bẹ̀rẹ̀ pẹ̀lú Ìwé Mímọ́ yìí, ó kéde ìhìn rere nípa Jésù fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ìtumọ̀ mìíràn: “bẹ̀rẹ̀ sí í sọ̀rọ̀.”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà fi Jésù hàn gẹ́gẹ́ bí àkóónú ìhìn rere tí Fílípù kéde fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: la ẹnu rẹ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó bójú mu láti sọ pé ẹni kan bẹ̀rẹ̀ sí í sọ̀rọ̀ ní ọ̀nà pàtàkì.
- source_word: δὲ
  choice: sì
  rationale: “Sì” ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì fi ìtẹ̀síwájú ìtàn hàn láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: bẹ̀rẹ̀ láti inú Ìwé Mímọ́ yìí
  rationale: Ó fi Ìwé Mímọ́ yìí hàn gẹ́gẹ́ bí ibi tí Fílípù ti bẹ̀rẹ̀ àlàyé rẹ̀, ó sì tẹ̀lé agbára ἀπό ní ọ̀nà Yorùbá àdánidá.
- source_word: γραφῆς
  choice: Ìwé Mímọ́
  rationale: Nínú àyíká yìí, γραφή ń tọ́ka sí ìkọ̀wé mímọ́ tí ọkùnrin náà ń kà, kì í ṣe ìkọ̀wé lásán.
- source_word: εὐηγγελίσατο
  choice: kéde ìhìn rere
  rationale: Gbólóhùn yìí sọ ìṣe pípolongo ìròyìn ayọ̀ ní kedere, ó sì yàgò fún èrò pé ó ní láti jẹ́ ìwàásù inú àpéjọ.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó tú ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní tààrà, láì tún fi orúkọ ẹni náà kún ẹsẹ yìí.
- source_word: τὸν Ἰησοῦν
  choice: nípa Jésù
  rationale: Pẹ̀lú εὐαγγελίζομαι, Jésù ni àkóónú àti àárín ìhìn rere náà; “nípa Jésù” mú ìtumọ̀ yẹn ṣe kedere ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Fílípù kéde ìhìn rere nípa Jésù fún un.
  alternative: Fílípù kéde Jésù fún un.
  rationale: Ìṣètò Gíríìkì lè sọ Jésù di àkóónú ohun tí a kéde. Àṣàyàn náà mú un yé kedere ní Yorùbá, láì dín Jésù kù sí ọ̀rọ̀ ìránṣẹ́ lásán tàbí fi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé. A pa àwòrán “la ẹnu rẹ̀” mọ́, ṣùgbọ́n àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
