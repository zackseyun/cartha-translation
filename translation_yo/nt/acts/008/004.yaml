  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: yo
  text: Nítorí náà, àwọn tí a ti tú ká náà lọ káàkiri, wọ́n sì ń kéde ọ̀rọ̀ náà gẹ́gẹ́ bí ìhìn rere.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń wàásù ìhìn rere.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ọ̀rọ̀ náà”; ìyẹn ni ìhìn náà nípa Jésù.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Nítorí náà, àwọn
  rationale: “Nítorí náà” fi ipa ìyọrísí οὖν hàn, ó sì so ohun tí ẹsẹ̀ yìí sọ mọ́ inúnibíni àti ìtúká tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; μέν ń ṣètò ìtàn náà, kò sì nílò ọ̀rọ̀ míì lọ́tọ̀ ní Yorùbá.
- source_word: διασπαρέντες
  choice: tí a ti tú ká
  rationale: Ọ̀rọ̀ ìṣe aláìṣe yìí tọ́ka sí àwọn onígbàgbọ́ tí àwọn ẹlòmíràn tú ká nítorí inúnibíni. “A ti tú ká” fi hàn pé ìtúká náà ti ṣẹlẹ̀ ṣáájú bí wọ́n ṣe lọ káàkiri.
- source_word: διῆλθον
  choice: lọ káàkiri
  rationale: Ó túmọ̀ sí pé wọ́n ń lọ láti ibì kan sí ibòmíràn. “Lọ káàkiri” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi agbègbè kan tí Gíríìkì kò dárúkọ kún un.
- source_word: εὐαγγελιζόμενοι
  choice: ń kéde ... bí ìhìn rere
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípolongo ohun kan gẹ́gẹ́ bí ìhìn rere. Ìtumọ̀ yìí pa agbára ọ̀rọ̀ ìṣe náà mọ́, ó sì fi hàn pé bí wọ́n ti ń lọ ni wọ́n ń kéde.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” pa ọ̀nà kúkúrú tí Lúùkù gbà sọ λόγος mọ́. Nínú àyíká ọ̀rọ̀, ó jẹ́ iṣẹ́ ìránṣẹ́ nípa Jésù, ṣùgbọ́n a kò fi “Ọlọ́run” kún ohun tí Gíríìkì kò sọ níbí.
theological_decisions:
- issue: Ìtumọ̀ εὐαγγελιζόμενοι τὸν λόγον
  choice: ń kéde ọ̀rọ̀ náà bí ìhìn rere
  alternative: ń kéde ọ̀rọ̀ náà; ń wàásù ọ̀rọ̀ ìhìn rere
  rationale: 'Nínú Gíríìkì, τὸν λόγον ni àfojúsùn tààrà fún εὐαγγελιζόμενοι: wọ́n ń kéde “ọ̀rọ̀ náà” gẹ́gẹ́ bí ìhìn rere. Ìtumọ̀ yìí pa ọ̀rọ̀ méjèèjì mọ́ láì dá àjọṣe oní “ti” tí kò sí nínú Gíríìkì, bẹ́ẹ̀ ni kò sọ “ọ̀rọ̀ náà” di ohun tí ìhìn rere ti inú rẹ̀ jáde.'
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Kéde” rọrùn ju ọ̀rọ̀ ṣọ́ọ̀ṣì kan lọ, “lọ káàkiri” sì mú ìrìn láti ibì kan sí ibòmíràn hàn láì fi alaye tí kò sí nínú orísun kún un.
