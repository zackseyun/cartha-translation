id: ACT.8.18
reference: Acts 8:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Símónì rí i pé nípasẹ̀ gbígbé ọwọ́ àwọn aposteli léni lórí ni a ti ń fi Ẹ̀mí[a] fúnni, ó fi owó fún wọn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹ̀mí Mímọ́.” Ọ̀rọ̀ Gíríìkì sọ “Ẹ̀mí” nìkan, ṣùgbọ́n àyíká fi hàn pé Ẹ̀mí Mímọ́ ni ó ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ... rí i
  rationale: Ọ̀rọ̀ participle aorist yìí ń tọ́ka sí àkókò nínú ìtàn; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn láti inú ìṣẹ̀lẹ̀ tó ṣáájú sí ohun tí Simoni ṣe.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: nípasẹ̀ gbígbé ọwọ́ ... léni lórí
  rationale: διά pẹ̀lú genitive ń sọ ọ̀nà tàbí ohun èlò tí ìṣe fi ṣẹlẹ̀; gbólóhùn yìí ṣe kedere ní Yorùbá, kò sì dá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: τῶν ἀποστόλων
  choice: àwọn aposteli
  rationale: Ó pa ìbáṣepọ̀ genitive mọ́ nínú gbólóhùn Yorùbá pé ọwọ́ àwọn aposteli ni wọ́n gbé léni lórí.
- source_word: δίδοται
  choice: a ti ń fi ... fúnni
  rationale: Ó ṣàfihàn ìṣe passive nínú ìtàn láì sọ pé àwọn aposteli gan-an ni orísun Ẹ̀mí; àmì ‘ti ń’ tún bá ìwòye Simoni nípa ohun tó ń ṣẹlẹ̀ mu.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì tó sọ ‘Ẹ̀mí’ ní ṣókí, nígbà tí àyíká ẹsẹ náà fi hàn pé Ẹ̀mí Mímọ́ ni.
- source_word: προσήνεγκεν
  choice: fi ... fún
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi tàbí gbígbé ohun kan kalẹ̀ gẹ́gẹ́ bí ohun tí a ń fún ẹlòmíràn; ọ̀nà yìí jẹ́ Yorùbá tó rọrùn.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ó tọ́ka padà sí àwọn aposteli gẹ́gẹ́ bí àwọn tí Simoni fún ní owó.
- source_word: χρήματα
  choice: owó
  rationale: Èyí ni ìtumọ̀ tó tààrà, tó sì bá àyíká ìdúnàádúrà Simoni mu jù lọ.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí, tó ń tọ́ka sí Ẹ̀mí Mímọ́
  alternative: Ẹ̀mí Mímọ́
  rationale: Àkọsílẹ̀ Gíríìkì sọ ‘Ẹ̀mí’ ní ṣókí, ṣùgbọ́n àyíká tó sún mọ́ ọn fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn kedere. Àkọsílẹ̀ pàtàkì pa fọ́ọ̀mù orísun mọ́, àlàyé ìsàlẹ̀ sì mú un ṣe kedere.
- issue: Ọ̀nà tí a fi ń fúnni ní Ẹ̀mí
  choice: nípasẹ̀ gbígbé ọwọ́ àwọn aposteli léni lórí ni a ti ń fi Ẹ̀mí fúnni
  alternative: àwọn aposteli ń fi Ẹ̀mí fúnni nígbà tí wọ́n bá gbé ọwọ́ léni lórí
  rationale: Yíyan yìí pa passive àti ìtumọ̀ διά gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò mọ́, láì sọ pé àwọn aposteli ni orísun tó ga jù lọ ti Ẹ̀mí tàbí láì fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan kún ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘léni lórí’ láti sọ ìṣe gbígbé ọwọ́ lé ènìyàn lórí láì fi olùgbà kan tí Gíríìkì kò dárúkọ kún un. Àmì ohùn kún àwọn ọ̀rọ̀ Yorùbá níbi tó yẹ; ‘aposteli’ jẹ́ ọ̀rọ̀ Bíbélì tó ti wọ́pọ̀.
