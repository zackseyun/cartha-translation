  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: yo
  text: Ó sì ń padà lọ, ó wà ní ìjókòó nínú kẹ̀kẹ́ ẹṣin rẹ̀, ó sì ń ka ìwé wòlíì Aísáyà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè tún sọ ọ́ ní ‘ìwé Aísáyà, wòlíì náà.’ Ètò ọ̀rọ̀ Gíríìkì jẹ́ ‘wòlíì Aísáyà.’
    reason: lexical_alternative
  - marker: b
    text: Ní ayé àtijọ́, àwọn ènìyàn sábà máa ń ka ìwé ní ohùn rara. Nítorí náà, ‘ó ń kà á ní ohùn rara’ ṣeé ṣe, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà fúnra rẹ̀ kò sọ èyí ní kedere níbí.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Ó sì ń padà lọ
  rationale: Àkójọpọ̀ ἦν pẹ̀lú ọ̀rọ̀-ìṣe aláìparí ὑποστρέφων fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn. ‘Ń padà lọ’ pa ìtumọ̀ yìí mọ́ láìfi ibi tí ó ń padà sí kún un; τέ sì jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́ tí ‘sì’ dúró fún.
- source_word: καθήμενος
  choice: ó jókòó
  rationale: Ó ṣàpèjúwe bí ó ṣe wà lórí ìrìn-àjò náà. ‘Ó jókòó’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa ìtumọ̀ ipò rẹ̀ mọ́.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: nínú kẹ̀kẹ́ ẹṣin rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐπί pẹ̀lú genitive lè túmọ̀ sí ‘lórí,’ ‘nínú kẹ̀kẹ́ ẹṣin rẹ̀’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún jíjókòó nínú ọkọ̀ irú èyí. ‘Kẹ̀kẹ́ ẹṣin’ mú àwòrán ἅρμα hàn ní èdè òde òní.
- source_word: ἀνεγίνωσκεν
  choice: ó sì ń ka
  rationale: Imperfect náà tọ́ka sí ìṣe tí ó ń bá a lọ. ‘Ń ka’ pa apá yìí mọ́; a kò fi ‘ní ohùn rara’ sínú ọ̀rọ̀ pàtàkì nítorí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ bẹ́ẹ̀ ní kedere.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: ìwé wòlíì Aísáyà
  rationale: Nínú àyíká yìí, ẹni náà ń ka ohun tí wòlíì Aísáyà kọ, kì í ṣe pé ó ń ka ẹni náà. Fífi ‘ìwé’ hàn jẹ́ ìṣàlàyé àdánidá ní Yorùbá, nígbà tí ‘wòlíì Aísáyà’ tẹ̀lé ọ̀nà ìsọ̀rọ̀ Yorùbá tí ó wọ́pọ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún níbi tí ó ti yẹ, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ewé wà nínú ọ̀rọ̀ pàtàkì.
