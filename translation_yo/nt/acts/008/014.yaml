id: ACT.8.14
reference: Acts 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: yo
  text: Nígbà tí àwọn àpọ́sítélì tó wà ní Jerusalẹmu gbọ́ pé Samaria ti gba ọ̀rọ̀ Ọlọ́run, wọ́n rán Peteru àti Johanu sí wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Nígbà tí ... gbọ́
  rationale: Aorist participle náà fi ipò àkókò tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: kò ní ìtumọ̀ ọ̀tọ̀ nínú gbolohun náà
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ ìtàn tó rọ̀, kì í ṣe ìtakora; ìṣàn gbolohun Yorùbá kò nílò kí a fi ọ̀rọ̀ míì kún un.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: àwọn aposteli tí ó wà ní Jerusalẹmu
  rationale: Ó sọ ní tààrà pé àwọn aposteli náà wà ní Jerusalẹmu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: δέδεκται
  choice: ti gba
  rationale: Perfect tense náà tọ́ka sí ìgbà tí Samaria ti gba ọ̀rọ̀ náà, pẹ̀lú àbájáde tó ṣì dúró; ‘ti gba’ mú èyí jáde lọ́nà àdánidá.
- source_word: ἡ Σαμάρεια
  choice: Samaria
  rationale: A pa orúkọ ibi náà mọ́ gẹ́gẹ́ bí Gíríìkì, níbi tí ó ti dúró fún àwọn ènìyàn ibẹ̀ lápapọ̀.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí pa àwòrán ọ̀rọ̀ inú Gíríìkì àti ìtumọ̀ rẹ̀ gẹ́gẹ́ bí iṣẹ́ ìwàásù Ọlọ́run mọ́.
- source_word: ἀπέστειλαν
  choice: wọ́n rán
  rationale: Ìtumọ̀ àdánidá àti tààrà fún aorist main verb náà.
- source_word: πρὸς αὐτοὺς
  choice: sí wọn
  rationale: Ó fi ìtọ́sọ́nà sí àwọn ará Samaria tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn hàn.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Peteru àti Johanu
  rationale: Àwọn fọ́ọ̀mù orúkọ Bíbélì wọ̀nyí ti wọ́pọ̀, wọ́n sì bá ìró Yorùbá mu.
theological_decisions:
- issue: Lílo ‘Samaria’ gẹ́gẹ́ bí orúkọ ibi tó dúró fún àwọn ènìyàn rẹ̀
  choice: Samaria ti gba ọ̀rọ̀ Ọlọ́run
  alternative: àwọn ará Samaria ti gba ọ̀rọ̀ Ọlọ́run
  rationale: Gíríìkì lo orúkọ ibi náà ní ọ̀nà àpẹẹrẹ fún àwọn olùgbé rẹ̀. Pípa ‘Samaria’ mọ́ sún mọ́ orísun, kò sì dín ìtumọ̀ rẹ̀ kù.
- issue: Ìtumọ̀ λόγος
  choice: ọ̀rọ̀ Ọlọ́run
  alternative: ìránṣẹ́ Ọlọ́run
  rationale: ‘Ọ̀rọ̀ Ọlọ́run’ pa ọ̀rọ̀ orísun àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tọ́ka sí ìránṣẹ́ tí a ń kéde.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yàgò fún àsopọ̀ ìbẹ̀rẹ̀ tí kò ṣe pàtàkì.
