  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: yo
  text: Nígbà náà ni wọ́n gbé ọwọ́ lé wọn, wọ́n sì ń gba Ẹ̀mí Mímọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tí ó fara mọ́ Gíríìkì síi: “Nígbà náà ni wọ́n ń gbé ọwọ́ lé wọn, wọ́n sì ń gba Ẹ̀mí Mímọ́.” Àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì wà ní ìrísí àìpé.'
    reason: Àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì jẹ́ imperfect, nítorí náà àlàyé yìí pa ìtumọ̀ míì tó ṣeé ṣe mọ́.
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní ọ̀nà tó bá Yorùbá àdánidá mu.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: wọ́n gbé ọwọ́ lé wọn
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún fífi ọwọ́ lé ènìyàn; ‘ọwọ́’ lè dúró láìsí àmì ọ̀pọ̀ nítorí bí orúkọ ṣe ń ṣiṣẹ́ ní Yorùbá.
- source_word: ἐλάμβανον
  choice: wọ́n sì ń gba
  rationale: Àmì ‘ń’ ń fi ìṣe tó ń lọ hàn, ó sì pa apá àìpé (imperfect) ti ọ̀rọ̀ Gíríìkì mọ́ láìfi ìbẹ̀rẹ̀ ìṣe kún un.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká Lúùkù–Ìṣe, gbólóhùn náà tọ́ka sí Ẹ̀mí Ọlọ́run; Yorùbá kò nílò atókùn pàtó tó bá ‘the’ mu níbí.
theological_decisions:
- issue: Bóyá πνεῦμα ἅγιον jẹ́ Ẹ̀mí Mímọ́ ti Ọlọ́run tàbí ẹ̀mí mímọ́ kan láìsí ìdánimọ̀
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ àti lílo rẹ̀ jákèjádò Lúùkù–Ìṣe fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí; ìtumọ̀ yìí kò fi ẹ̀kọ́ mìíràn tí kò sí nínú ẹsẹ náà kún un.
- issue: Bí a ṣe lè fi apá àìpé ti àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì hàn
  choice: A lo ìṣe tó dà bí ohun tó parí fún fífi ọwọ́ lé wọn, ṣùgbọ́n a lo ‘ń gba’ fún gbígba Ẹ̀mí Mímọ́.
  alternative: wọ́n ń gbé ọwọ́ lé wọn, wọ́n sì ń gba Ẹ̀mí Mímọ́
  rationale: Èyí ń mú kí Yorùbá ṣàn dáadáa, ó sì tún fi ìṣe tó ń lọ nínú ἐλάμβανον hàn; àlàyé ìsàlẹ̀ ojú ewé pa àṣàyàn tó túmọ̀ àwọn méjèèjì ní ọ̀nà àìpé mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán láti lóye.
