id: ACT.8.13
reference: Acts 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: yo
  text: Símónì tìkára rẹ̀ náà sì gbàgbọ́; lẹ́yìn tí a ti baptisi rẹ̀, ó sì ń dúró lẹ́gbẹ̀ẹ́ Fílípì. Bí ó ti ń rí àwọn àmì àti àwọn iṣẹ́ agbára ńlá[a] tí ń ṣẹlẹ̀, ó sì ń yà á lẹ́nu gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ ìyanu ńlá.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìfihàn agbára tàbí sí iṣẹ́ ìyanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: fúnra rẹ̀ pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ αὐτός àti ìtumọ̀ àfikún καί mọ́, ó sì fi hàn pé Símónì náà dáhùn sí ìhìn rere.
- source_word: ἐπίστευσεν
  choice: gbàgbọ́
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì bójú mu fún πιστεύω; kò fi kún un pé ìgbàgbọ́ náà jẹ́ ojúlówó tàbí pé kì í ṣe ojúlówó.
- source_word: βαπτισθεὶς
  choice: lẹ́yìn tí a ti baptisi rẹ̀
  rationale: Ó sọ ìṣe aorist passive participle náà ní Yorùbá àdánidá, ó sì mú kí ó ṣe kedere pé ìbatisí ṣáájú bí ó ṣe ń bá Fílípì lọ.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ó ń bá Fílípì lọ
  rationale: Àmì “ń” fi ìṣe tí ó ń bá a lọ hàn, “bá … lọ” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó dúró tì Fílípì, láì sọ ìtumọ̀ náà ju ohun tí Gíríìkì wí lọ.
- source_word: θεωρῶν
  choice: bí ó ti ń rí
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì so ìyàlẹ́nu Símónì mọ́ ohun tí ó ń rí.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: “Àwọn àmì” pa ìtumọ̀ ohun tí ń tọ́ka sí tàbí jẹ́rìí sí iṣẹ́ Ọlọ́run mọ́.
- source_word: δυνάμεις μεγάλας
  choice: àwọn iṣẹ́ agbára ńlá
  rationale: Ìtumọ̀ yìí dúró nítòsí Gíríìkì, ó sì lè gba ìtumọ̀ ìfihàn agbára àti iṣẹ́ ìyanu láì dín ọ̀rọ̀ náà kù sí ọ̀kan ṣoṣo.
- source_word: γινομένας
  choice: tí ń ṣẹlẹ̀
  rationale: Ó fi àwọn àmì àti iṣẹ́ agbára náà hàn gẹ́gẹ́ bí ohun tí ń ṣẹlẹ̀ níwájú Símónì.
- source_word: ἐξίστατο
  choice: ẹnu ń yà á gidigidi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi ìyàlẹ́nu ńlá tí ó ń bá a lọ hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
theological_decisions:
- issue: Bóyá ìgbàgbọ́ Símónì jẹ́ ìyípadà ọkàn ojúlówó
  choice: A túmọ̀ ἐπίστευσεν ní ṣókí sí “gbàgbọ́,” láì fi àlàyé kún un.
  alternative: “gbàgbọ́ tọkàntọkàn” tàbí “sọ pé òun gbàgbọ́”
  rationale: Ẹsẹ náà sọ pé Símónì gbàgbọ́, ṣùgbọ́n ìtàn tó tẹ̀ lé e fa ìbéèrè ìtumọ̀ kan. Ìtumọ̀ náà kò yẹ kí ó pinnu ohun tí Gíríìkì kò sọ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè àdánidá mu. A lo “baptisi” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì lo àwọn àmì ìṣe “ń” láti pa ìṣe tí ó ń bá a lọ mọ́.
