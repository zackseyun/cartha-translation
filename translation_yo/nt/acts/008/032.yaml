  to: 'Apá Ìwé Mímọ́ tí ó ń kà ni èyí: “Gẹ́gẹ́ bí àgùntàn, a mú un lọ sí ibi pípa[a]; àti gẹ́gẹ́ bí ọmọ àgùntàn tí ó dákẹ́ níwájú ẹni tí ń gé irun rẹ̀[b], bẹ́ẹ̀ ni kì í la ẹnu rẹ̀.”'
