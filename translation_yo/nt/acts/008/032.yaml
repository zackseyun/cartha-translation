id: ACT.8.32
reference: Acts 8:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: yo
  text: 'Apá Ìwé Mímọ́ tí ó ń kà ni èyí: “Gẹ́gẹ́ bí àgùntàn, a mú un lọ sí ibi pípa[a]; àti gẹ́gẹ́ bí ọmọ àgùntàn tí ó dákẹ́ níwájú ẹni tí ń gé irun rẹ̀[b], bẹ́ẹ̀ ni kì í la ẹnu rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ sí pípa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “níwájú olùgé-irun”; èdè Gíríìkì sọ ní tààrà pé, “níwájú ẹni tí ń gé irun rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ
  choice: Apá
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí apá kan pàtó nínú Ìwé Mímọ́ tí wọ́n ń kà; “apá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: γραφῆς
  choice: Ìwé Mímọ́
  rationale: Ní Ìṣe Àwọn Aposteli, γραφή ń tọ́ka sí Ìwé Mímọ́, kì í ṣe sí ìwé lásán.
- source_word: ἀνεγίνωσκεν
  choice: tí ó ń kà
  rationale: Àkókò imperfect fi hàn pé ìṣe kíkà náà ń lọ lọ́wọ́ nígbà náà; “ń kà” pa ìtumọ̀ yẹn mọ́.
- source_word: Ὡς πρόβατον
  choice: Gẹ́gẹ́ bí àgùntàn
  rationale: Ó pa àfiwé ὡς mọ́, ó sì lo ọ̀rọ̀ àpapọ̀ fún sheep láì dà á pọ̀ mọ́ ọmọ àgùntàn.
- source_word: ἐπὶ σφαγὴν
  choice: sí ibi pípa
  rationale: Ó fi ìlọsíwájú síbi tí a ó ti pa ẹran hàn ní Yorùbá àdánidá; àfikún ìsàlẹ̀ ojú-ìwé pa ìtumọ̀ kúkúrú mìíràn mọ́.
- source_word: ἤχθη
  choice: a mú un lọ
  rationale: Ìṣètò aláìlórúkọ “a mú un lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ passive náà láì sọ ẹni tó mú un lọ.
- source_word: ἀμνὸς
  choice: ọmọ àgùntàn
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ἀμνός, ọmọ àgùntàn, àti πρόβατον, àgùntàn, mọ́.
- source_word: κείραντος αὐτὸν
  choice: ẹni tí ń gé irun rẹ̀
  rationale: Ó tú participle náà sí Yorùbá tó yé ni kedere, ó sì sọ iṣẹ́ gígé irun ẹran náà dípò lílo orúkọ iṣẹ́ tí kò wọ́pọ̀.
- source_word: ἄφωνος
  choice: tí ó dákẹ́
  rationale: “Dákẹ́” sọ ìtumọ̀ pé ọmọ àgùntàn náà kò pariwo tàbí sọ ohunkóhun ní Yorùbá àdánidá.
- source_word: οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: kò la ẹnu rẹ̀
  rationale: Ó pa present inú àyọlò náà mọ́, “la ẹnu” sì jẹ́ gbólóhùn Yorùbá àdánidá fún ṣíṣí ẹnu láti sọ̀rọ̀.
theological_decisions:
- issue: Àyọlò Mèsáyà láti Aísáyà 53 tí àyíká ọ̀rọ̀ fi kan Jésù
  choice: A fi àfiwé àyọlò náà sílẹ̀ gẹ́gẹ́ bí ó ṣe wà, láì fi orúkọ Jésù sínú ẹsẹ yìí.
  alternative: Kí a túmọ̀ ọ́ lọ́nà àlàyé tí yóò sọ Jésù tàbí ìránṣẹ́ tó ń jìyà ní tààrà.
  rationale: Àyíká tó tẹ̀ lé e ló ṣàlàyé ẹni tí àyọlò náà ń tọ́ka sí; ẹsẹ yìí fúnra rẹ̀ ń gbé ọ̀rọ̀ Ìwé Mímọ́ kalẹ̀, nítorí náà ìtumọ̀ náà kò yẹ kí ó yanjú ìtọ́kasí náà ní àfikún.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá bá àṣà kikọ mu. Ìlà àyọlò náà ní ìró ọ̀rọ̀ tó yẹ fún kíkà ní gbangba, láì lo ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
