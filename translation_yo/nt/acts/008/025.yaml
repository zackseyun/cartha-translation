id: ACT.8.25
reference: Acts 8:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí wọ́n ti jẹ́rìí gidigidi, tí wọ́n sì ti sọ ọ̀rọ̀ Olúwa, wọ́n ń padà sí Jerúsálẹ́mù, wọ́n sì ń kéde ìhìn rere ní ọ̀pọ̀ abúlé àwọn ará Samáríà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: jẹ́rìí gidigidi
  rationale: Èyí mú ìtumọ̀ jíjẹ́rìí pẹ̀lú ìtẹnumọ́ àti ìwúwo jáde, láì fi èrò ìkìlọ̀ tí kò ṣe pàtàkì jù lọ nínú àyíká yìí kún un.
- source_word: λαλήσαντες
  choice: sọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí sísọ; ohun tí wọ́n sọ, ‘ọ̀rọ̀ Olúwa,’ sì tẹ̀ lé e ní tààrà, nítorí náà kò nílò àlàyé àfikún.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: ‘Ọ̀rọ̀’ jẹ́ ìtumọ̀ tí ó mọ́, tí ó sì pa ìró ẹ̀kọ́ ìgbàgbọ́ inú λόγος mọ́; ‘Olúwa’ sì jẹ́ ìtumọ̀ Yorùbá tí ó yẹ fún κύριος.
- source_word: ὑπέστρεφον
  choice: wọ́n ń padà
  rationale: Ìṣe aláìparí náà fi ìṣe tí ó ń lọ lọ́wọ́ hàn; ‘wọ́n ń padà’ pa apá yìí mọ́ ju ọ̀rọ̀ ìṣe àtẹ̀yìnwá lásán lọ.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni orúkọ ìlú náà ní ìkọ̀wé Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: ní ọ̀pọ̀ abúlé àwọn ará Samáríà
  rationale: Èyí fi hàn pé àwọn abúlé náà jẹ́ ti àwọn ará Samáríà tàbí pé àwọn ará Samáríà ń gbé ibẹ̀, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εὐηγγελίζοντο
  choice: wọ́n sì ń kéde ìhìn rere
  rationale: ‘Kéde ìhìn rere’ ṣàlàyé ìṣe náà ní Yorùbá òde òní, ‘ń’ sì pa ìṣe tí ó ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ta ni kókó ọ̀rọ̀ tí a kò dárúkọ ní tààrà?
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘wọ́n.’
  alternative: Kí a fi ‘Pétérù àti Jòhánù’ sí i ní tààrà.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí Pétérù àti Jòhánù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo kókó ọ̀rọ̀ ọ̀pọ̀ tí a kò dárúkọ. Ìtumọ̀ náà kò fi orúkọ tí kò sí nínú ẹsẹ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá òde òní mu. A lo ‘lẹ́yìn tí wọ́n ti…’ fún àwọn participle aorist, àti ‘ń’ fún àwọn imperfect méjèèjì, kí ìbáṣepọ̀ àkókò àti apá ìṣe inú Gíríìkì lè hàn.
