  source_fidelity: 'Ìtumọ̀ náà ń fi ìtumọ̀ pàtàkì Gíríìkì hàn dáadáa: a pa εὑρέθη mọ́ gẹ́gẹ́ bí ìṣe aláìṣe, ìkéde ìhìn rere náà ń bá a lọ, ó sì dé Kesaria ní òpin. Síbẹ̀, “agbègbè náà” ṣàfikún ohun tí Gíríìkì kò sọ ní pàtó, orúkọ “Asótù” sì yẹ kí a tún un ṣe kí ó sún mọ́ Ἄζωτον.'
