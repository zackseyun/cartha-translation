language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: yo
  text: Ṣùgbọ́n, a rí Fílípì ní Ásótù[a]. Bí ó ṣe ń rìn kọjá, ó ń kéde ìhìn rere ní gbogbo ìlú títí ó fi dé Kesaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Fílípì farahàn ní Ásótù.” Ní tààràtà, èdè Gíríìkì sọ pé, “a rí Fílípì ní Ásótù”; nínú àyíká ìtàn yìí, èyí lè fi hàn pé a gbé e lọ síbẹ̀ lójijì, ṣùgbọ́n kò sọ bẹ́ẹ̀ ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré àti ìyàtọ̀ ìtàn hàn lẹ́yìn bí Ẹ̀mí ti mú Fílípì kúrò ní ojú ìwòye ọkùnrin náà.
- source_word: εὑρέθη
  choice: a rí Fílípì
  rationale: A pa ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣe náà mọ́ gẹ́gẹ́ bí ‘a rí i,’ láì sọ ní pàtó pé ó farahàn lójijì tàbí láì ṣàlàyé ọ̀nà tí ó gbà dé ibẹ̀.
- source_word: εἰς Ἄζωτον
  choice: ní Asótù
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ‘a rí,’ εἰς ń tọ́ka sí ibi tí Fílípì wà lẹ́yìn ìṣẹ̀lẹ̀ náà; ‘ní Asótù’ jẹ́ èdè Yorùbá àdánidá.
- source_word: διερχόμενος
  choice: bí ó sì ti ń la agbègbè náà kọjá
  rationale: Ó fi ìrìn-àjò tí ó ń lọ ní àkókò kan náà pẹ̀lú ìkéde hàn, ó sì jẹ́ kó ṣe kedere pé ó ń kọjá láti ibì kan sí ibòmíràn.
- source_word: εὐηγγελίζετο
  choice: ó ń kéde ìhìn rere
  rationale: Àmì àkókò imperfect fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ‘ń kéde ìhìn rere’ jẹ́ èdè òde òní tí gbogbo ènìyàn lè lóye.
- source_word: τὰς πόλεις πάσας
  choice: ní gbogbo àwọn ìlú
  rationale: Ó tọ́ka sí gbogbo ìlú tí ó ń bá pàdé ní ọ̀nà rẹ̀, ní ìbámu pẹ̀lú ìṣe ìkéde.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: títí ó fi dé
  rationale: Ó sọ òpin ìrìn-àjò àti ìṣe tí ó ń bá a lọ ní Yorùbá àdánidá.
- source_word: εἰς Καισάρειαν
  choice: dé Kesaria
  rationale: Pẹ̀lú ‘dé,’ orúkọ ibùdó náà ń sọ ibi tí ìrìn-àjò parí láì nílò ọ̀rọ̀ àsopọ̀ míì.
theological_decisions:
- issue: Bóyá kí εὑρέθη túmọ̀ ní ọ̀nà tí yóò sọ ní pàtó pé ìfarahàn tàbí ìgbé-kúrò lọ́nà ìyanu ló ṣẹlẹ̀
  choice: A pa ọ̀nà àìdásí ‘a rí Fílípì’ mọ́ nínú ẹsẹ̀ náà.
  alternative: ‘Fílípì farahàn ní Asótù’ tàbí ‘Fílípì bá ara rẹ̀ ní Asótù.’
  rationale: Àyíká ẹsẹ̀ náà ń tọ́ka sí iṣẹ́ Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ pé ‘a rí i.’ Ìtumọ̀ náà kò fi ẹ̀kọ́ tí ọ̀rọ̀ náà kò sọ ní gbangba kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti yékéyéké fún òǹkàwé òde òní. A lo ‘ìhìn rere’ dípò ọ̀rọ̀ ṣọ́ọ̀ṣì tó lè nira, a sì pa ìṣàn ìtàn àti ìṣe tí ń bá a lọ mọ́.
