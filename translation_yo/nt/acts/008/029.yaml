  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: yo
  text: Nígbà náà ni Ẹ̀mí náà sọ fún Fílípì pé, “Lọ sún mọ́ kẹ̀kẹ́ yìí, kí o sì máa bá a lọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lọ sún mọ́ kẹ̀kẹ́ yìí, kí o sì lẹ̀ mọ́ ọn.”
    reason: Àṣàyàn ìtumọ̀ fún κολλήθητι, tó lè fi ìmọ̀ dídarapọ̀ mọ́ tàbí wíwà ní súnmọ́ kẹ̀kẹ́ náà hàn.
lexical_decisions:
- source_word: εἶπεν
  choice: sọ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣàyàn àdánidá fún λέγω nínú ìtàn nígbà tí ọ̀rọ̀ tààrà ń tẹ̀ lé e.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń mú ìtàn tẹ̀ síwájú, kò sì fi ìtakora líle hàn.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́ láì fi “Mímọ́” kún un; nínú àyíká Ìṣe Àwọn Àpọ́sítélì, ẹni tí a ń tọ́ka sí ni Ẹ̀mí Mímọ́.
- source_word: τῷ Φιλίππῳ
  choice: fún Fílípì
  rationale: Dátífù náà fi ẹni tí a bá sọ̀rọ̀ hàn; “fún Fílípì” jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: Πρόσελθε
  choice: Lọ sún mọ́
  rationale: Àṣẹ náà ń béèrè pé kí Fílípì lọ sí ibi tí kẹ̀kẹ́ náà wà, kí ó sì sún mọ́ ọn.
- source_word: κολλήθητι
  choice: dúró tì í
  rationale: Ó mú ìtumọ̀ sísún mọ́ ohun kan àti dídúró lẹ́gbẹ̀ẹ́ rẹ̀ jáde ní Yorùbá àdánidá, ó sì bá kẹ̀kẹ́ tí ń lọ mu.
- source_word: τῷ ἅρματι τούτῳ
  choice: kẹ̀kẹ́ yìí
  rationale: “Kẹ̀kẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọkọ ἅρμα nínú àyíká yìí; “yìí” pa ìtókasí proximal τούτῳ mọ́.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí náà, tí àyíká fi hàn pé Ẹ̀mí Mímọ́ ni
  alternative: ìmísí tàbí ìtọ́nisọ́nà ẹ̀mí tí a kò sọ ní pàtó
  rationale: Ìṣe Àwọn Àpọ́sítélì sábà máa ń lo “Ẹ̀mí” gẹ́gẹ́ bí ẹni Ọlọ́run tó ń darí àwọn onígbàgbọ́. Síbẹ̀, a kò fi “Mímọ́” kún ẹsẹ náà, nítorí ἅγιον kò sí nínú orísun.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “kẹ̀kẹ́” dípò gbólóhùn àlàyé gígùn, nítorí àyíká ẹsẹ tó yí i ká ń fi irú ọkọ náà hàn.
