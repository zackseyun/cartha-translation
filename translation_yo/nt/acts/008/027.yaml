id: ACT.8.27
reference: Acts 8:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: yo
  text: Ó sì dìde, ó sì lọ. Sì kíyèsí i, ọkùnrin ará Etiópíà kan, ìwẹ̀fà[a], ìjòyè aláṣẹ gíga ti Kándákè[b], ayaba àwọn ará Etiópíà, ẹni tí ó ń ṣe àbójútó gbogbo ìṣúra rẹ̀, ti wá sí Jerúsálẹ́mù láti jọ́sìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “òṣìṣẹ́ ààfin.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí òṣìṣẹ́ ọba ní àwọn àyíká kan, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí ìtumọ̀ gangan, “ìwẹ̀fà,” ni a ní lọ́kàn níbí.
    reason: lexical_alternative
  - marker: b
    text: “Kándákè” lè jẹ́ oyè tí àwọn ayaba ìran ọba ń jẹ́ dípò kí ó jẹ́ orúkọ ẹni kan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς … ἐπορεύθη
  choice: Ó sì dìde, ó sì lọ
  rationale: 'Ó pa ìtẹ̀lé àwọn ìṣe méjèèjì mọ́ ní Yorùbá àdánidá: ó kọ́kọ́ dìde, lẹ́yìn náà ó lọ.'
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ọ̀rọ̀ ìfa-àfiyèsí Lúùkù mọ́ ní èdè ọ̀wọ̀ tí òǹkàwé òde òní lè lóye.
- source_word: ἀνὴρ Αἰθίοψ
  choice: ọkùnrin ará Etiópíà kan
  rationale: Ó ṣètumọ̀ ἀνήρ ní kedere gẹ́gẹ́ bí ‘ọkùnrin,’ ó sì fi ìdánimọ̀ orílẹ̀-èdè rẹ̀ hàn.
- source_word: εὐνοῦχος
  choice: ìwẹ̀fà
  rationale: Ìtumọ̀ gangan yìí pa ipò ara àti ti àwùjọ ọkùnrin náà mọ́; ọ̀rọ̀ náà tún lè túmọ̀ sí òṣìṣẹ́ ààfin ní àwọn àyíká kan, èyí tí àlàyé ìsàlẹ̀ sọ.
- source_word: δυνάστης
  choice: ìjòyè aláṣẹ gíga
  rationale: Ó fi hàn pé ó jẹ́ ẹni ipò àti agbára láì sọ ọ́ di ọba tàbí alákòóso olómìnira.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: ti Kándákè, ayaba àwọn ará Etiópíà
  rationale: Ó tẹ̀lé ìbáṣepọ̀ gírámà Gíríìkì, ó sì pa ọ̀pọ̀ ‘àwọn ará Etiópíà’ mọ́; àlàyé ìsàlẹ̀ jẹ́ kí ó ṣeé ṣe pé Kándákè jẹ́ oyè ìran àwọn ayaba.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: ẹni tí ó ń ṣe àbójútó gbogbo ìṣúra rẹ̀
  rationale: Gbólóhùn yìí sọ ojúṣe ìṣàkóso rẹ̀ lórí gbogbo ìṣúra ayaba ní Yorùbá tí ó mọ́gbọ́n dání.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: ti wá sí Jerúsálẹ́mù láti jọ́sìn
  rationale: ‘Ti wá’ fi ìṣe tí ó ti ṣẹlẹ̀ ṣáájú àkókò ìtàn hàn, ‘láti jọ́sìn’ sì pa ète tí participle ọjọ́ iwájú Gíríìkì ń sọ mọ́.
theological_decisions:
- issue: Bóyá kí εὐνοῦχος jẹ́ ‘ìwẹ̀fà’ tàbí kí a sọ ọ́ ní gbogbogbòò pé ‘òṣìṣẹ́ ààfin’
  choice: A lo ‘ìwẹ̀fà’ nínú ọ̀rọ̀ pàtàkì.
  alternative: òṣìṣẹ́ ààfin
  rationale: ‘Ìwẹ̀fà’ ni ìtumọ̀ àkọ́kọ́ tí ó sì lè ṣe pàtàkì sí ipò ara àti ti àwùjọ ọkùnrin náà. Pẹ̀lú èyí, δυνάστης ti fi ipò rẹ̀ gẹ́gẹ́ bí ìjòyè aláṣẹ hàn, nítorí náà fífi ‘òṣìṣẹ́ ààfin’ sí àkọ́kọ́ lè pa ìyàtọ̀ náà rẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọpọ̀ tó ní àmì ohùn níbi tí ó bá yẹ, ó ní ọ̀wọ̀ ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa ‘Sì kíyèsí i’ mọ́ gẹ́gẹ́ bí àmì ìfa-àfiyèsí ìtàn, a sì yàgò fún èdè ẹ̀kọ́ ìsìn ẹlẹ́gbẹ́ kan.
