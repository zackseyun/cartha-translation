  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: ó pa ìtẹ̀lé “dìde… lọ” mọ́, ó dá àmì ìfa-àfiyèsí ἰδοὺ silẹ̀, ó sọ ἀνὴρ Αἰθίοψ di “ọkùnrin ará Etiópíà,” ó sì pa ipò ìwẹ̀fà, ọlá/agbára ìjòyè náà, ojúṣe rẹ̀ lórí ìṣúra ayaba, àti ìṣe tí ó ti ṣẹlẹ̀ ṣáájú nínú “ti wá” mọ́. “Láti jọ́sìn” ń sọ ète προσκυνήσων ní kedere.'
  naturalness: Yorùbá náà jẹ́ àpéjọpọ̀, ó sì wúlò fún ìtàn mímọ́ ní ìforúkọsílẹ̀ ọ̀wọ̀ ṣugbọn tí òde òní lè lóye. “Sì kíyèsí i” jẹ́ ọ̀nà ìtàn tí a ti mọ̀ nínú Yorùbá Bíbélì fún ἰδοὺ, ó sì ba àyíká ìtàn mu. Àmì ohùn wà níbi tí ó yẹ.
  terminology: “Ìwẹ̀fà” jẹ́ ìtumọ̀ gangan tó bójú mu fún εὐνοῦχος; àlàyé ìsàlẹ̀ náà dá àǹfààní ìtumọ̀ “òṣìṣẹ́ ààfin” sílẹ̀ láì mú un rọ́pò ìtumọ̀ pàtàkì. “Ìjòyè aláṣẹ gíga” ń fi δυνάστης hàn láì pe ọkùnrin náà ní ọba. “Kándákè” àti “ayaba àwọn ará Etiópíà” ń pa orúkọ/oyè àti ọ̀pọ̀ ethnonym Gíríìkì mọ́.
