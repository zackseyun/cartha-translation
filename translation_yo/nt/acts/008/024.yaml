id: ACT.8.24
reference: Acts 8:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: yo
  text: Ṣùgbọ́n Símónì dáhùn pé, “Ẹ̀yin fúnra yín, ẹ gbàdúrà sí Olúwa fún mi, kí ohunkóhun nínú àwọn ohun tí ẹ ti sọ má bàa dé bá mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ohunkóhun lára àwọn ohun tí ẹ ti sọ má bàa ṣẹlẹ̀ sí mi.”
    reason: Ọ̀nà míì tó ṣeé gbà láti túmọ̀ μηδὲν ... ὧν εἰρήκατε àti ἐπέλθῃ ἐπ’ ἐμὲ ní Yorùbá, ní lílo ‘lára’ àti ‘ṣẹlẹ̀ sí mi’ dípò ‘nínú’ àti ‘dé bá mi.’
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Ṣùgbọ́n ... dáhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà àdáyébá láti fi ìdáhùn bẹ̀rẹ̀. ‘Dáhùn pé’ jẹ́ Yorùbá tó ṣe kedere, ‘Ṣùgbọ́n’ sì fi ìyípadà láti inú ìbáwí Pétérù sí ìdáhùn Símónì hàn.
- source_word: Δεήθητε
  choice: ẹ gbàdúrà
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ láti bẹ Ọlọ́run tàbí láti gbàdúrà. Nínú àyíká yìí, Símónì ń bẹ Pétérù àti Jòhánù pé kí wọ́n bẹ̀bẹ̀ fún un, nítorí náà ‘ẹ gbàdúrà’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìtumọ̀ mu.
- source_word: ὑμεῖς
  choice: Ẹ̀yin fúnra yín
  rationale: Arọ́pò-orúkọ tí a sọ ní gbangba nínú Gíríìkì tẹnu mọ́ àwọn tí Símónì ń bá sọ̀rọ̀. ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ náà mọ́ láìsọ ọ́ di ohun tí kò bójú mu.
- source_word: ὑπὲρ ἐμοῦ
  choice: fún mi
  rationale: ὑπέρ pẹ̀lú ọ̀rọ̀-orúkọ onígbọ̀wọ̀ nibi yìí túmọ̀ sí ìbẹ̀bẹ̀ ní ipò ẹlòmíràn. ‘Fún mi’ jẹ́ ọ̀nà àdáyébá láti sọ èyí ní Yorùbá.
- source_word: πρὸς τὸν κύριον
  choice: sí Olúwa
  rationale: πρός fi ẹni tí àdúrà ń lọ sí hàn. ‘Sí Olúwa’ jẹ́ àdáyébá lẹ́yìn ‘gbàdúrà,’ ó sì pa κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa.’
- source_word: ὅπως μηδὲν ... ὧν εἰρήκατε
  choice: kí ohunkóhun nínú àwọn ohun tí ẹ ti sọ má bàa
  rationale: ‘Kí ... má bàa’ fi ète tàbí àbájáde tí wọ́n ń fẹ́ hàn. ‘Ohunkóhun nínú àwọn ohun’ ń ṣàfihàn ìbátan genitive náà, εἰρήκατε sì ní ìtumọ̀ ọ̀rọ̀ tí wọ́n ti sọ tí ó ṣì wúlò ní àkókò yẹn.
- source_word: ἐπέλθῃ ἐπ’ ἐμὲ
  choice: dé bá mi
  rationale: Gbólóhùn Gíríìkì náà ṣàpèjúwe ohun kan, pàápàá ìyà tàbí ìdájọ́, tó dé lu ènìyàn. ‘Dé bá mi’ jẹ́ Yorùbá àdáyébá tó pa ìrísí ohun tó ń bọ̀ sórí ẹni mọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ (τὸν κύριον) ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí ‘Olúwa’ láìsọ pé Ọlọ́run tàbí Jésù ni ní pàtó.
  alternative: ‘Ọlọ́run’ tàbí ‘Jésù Olúwa’
  rationale: Ẹ̀dà Gíríìkì sọ ‘Olúwa’ nìkan. Nínú Ìṣe Àwọn Àpọ́sítélì, κύριος lè tọ́ka sí Ọlọ́run tàbí Jésù tó jíǹde gẹ́gẹ́ bí àyíká ṣe rí; ẹsẹ yìí kò pinnu rẹ̀ ní kedere. Fífi ‘Olúwa’ sílẹ̀ pa àìdánilójú inú orísun náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
