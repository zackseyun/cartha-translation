revisions:
- from: Nítorí pé àwọn ẹ̀mí àìmọ́ ń ké ní ohùn rara bí wọ́n ti ń jáde lára ọ̀pọ̀ àwọn tí wọ́n ní wọn,[a] ọ̀pọ̀ àwọn tí ara wọn rọ àti àwọn tí wọ́n yarọ ni a sì mú láára dá.
  to: Nítorí ọ̀pọ̀ ẹ̀mí àìmọ́ ni ń ké ní ohùn gíga, tí wọ́n sì ń jáde lára ọ̀pọ̀ ènìyàn tí wọ́n ní wọn; a sì mú ọ̀pọ̀ àwọn tí ara wọn rọ àti àwọn arọ láradá.[a]
  rationale: A tún gbolohun náà ṣe kí ó fi hàn kedere pé àwọn ẹ̀mí àìmọ́ ni wọ́n ń ké tí wọ́n sì ń jáde, ní ìbámu pẹ̀lú gírámà Gíríìkì. A ṣàtúnṣe àwọn ọ̀rọ̀ fún paralysis àti lameness kí a má bà a darapọ̀, a sì lo ọ̀rọ̀ Yorùbá boṣewa tó dára jù. Àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn ìmọ̀-ọrọ̀ tí ó lè wà mọ́ láìfi ẹ̀kọ́ ìjọ kankan kún un.
  reviewer_model: gpt-5.6-terra
