  source_fidelity: Ìtumọ̀ náà tọ́ka ẹni tí participle βοῶντα ń ṣàpèjúwe sí àwọn ẹ̀mí àìmọ́, ó sì pa ìbáṣepọ̀ ìtújáde wọn lára àwọn ènìyàn mọ́. Ṣùgbọ́n ìṣètò gbolohun lọwọlọwọ lè jẹ́ kí ‘wọ́n’ dà bí àwọn ènìyàn, ‘ara wọn rọ’ kò péye tó fún παραλελυμένοι, ‘yarọ’ sì kì í ṣe ọ̀rọ̀ boṣewa tó dára jù fún χωλοί nínú ọ̀rọ̀ yìí.
  naturalness: Àtúnṣe náà fi koko-ọrọ àwọn ẹ̀mí sí iwájú, ó lo ‘ní ohùn gíga’ àti ‘àwọn arọ,’ ó sì jẹ́ kí apá ìwòsàn dùn mọ́ etí nínú Yorùbá boṣewa.
  terminology: ‘Àwọn ẹ̀mí àìmọ́’ yẹ fún πνεύματα ἀκάθαρτα. ‘Àwọn tí ara wọn rọ’ ṣe ìyàtọ̀ tí ó yẹ fún àwọn aláìlera-paralysis, nígbà tí ‘àwọn arọ’ ń tú χωλοί. ‘A mú ... láradá’ dá ohùn passive ti ἐθεραπεύθησαν sílẹ̀ láìsọ olùṣe náà.
  issues:
  - severity: medium
    issue: Ìtọ́kasí ‘wọ́n’ nínú gbolohun àkọ́kọ́ kò mọ́ tó.
