  - severity: medium
    issue: ‘Àwọn tí ara wọn rọ’ àti ‘àwọn tí wọ́n yarọ’ kò yà àwọn ọ̀rọ̀ Gíríìkì méjèèjì sọ́tọ̀ dáadáa.
    rationale: παραλελυμένοι ń tọ́ka sí ipò paralysis, ṣùgbọ́n χωλοί jẹ́ àwọn arọ. ‘Yarọ’ kì í ṣe àṣàyàn boṣewa tí ó rọrùn jù, nígbà tí ‘àwọn arọ’ ṣe kedere.
