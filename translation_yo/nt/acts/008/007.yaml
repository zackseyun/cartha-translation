id: ACT.8.7
reference: Acts 8:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ẹ̀mí àìmọ́ ni ń ké ní ohùn gíga, tí wọ́n sì ń jáde lára ọ̀pọ̀ ènìyàn tí wọ́n ní wọn; a sì mú ọ̀pọ̀ àwọn tí ara wọn rọ àti àwọn arọ láradá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ọ̀rọ̀ náà tí a tú sí “ń ké” bá “àwọn ẹ̀mí àìmọ́” mu ní gírámà; nítorí náà, àwọn ẹ̀mí ni a lóye pé wọ́n ń ké bí wọ́n ti ń jáde. A tún lè lóye pé àwọn ènìyàn náà ń ké nígbà tí àwọn ẹ̀mí ń jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Nítorí pé … lára ọ̀pọ̀ àwọn tí wọ́n ní wọn
  rationale: “Nítorí pé” pa ìbáṣepọ̀ àlàyé γάρ mọ́; “ọ̀pọ̀ àwọn tí wọ́n ní wọn” sì fi àwọn ènìyàn tí àwọn ẹ̀mí náà wà lára wọn hàn ní èdè Yorùbá àdánidá.
- source_word: πνεύματα ἀκάθαρτα
  choice: àwọn ẹ̀mí àìmọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ ẹ̀mí búburú nínú Lúùkù–Ìṣe mu láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: ń ké ní ohùn rara
  rationale: Ó pa ìṣe títẹ̀síwájú àti bí ohùn náà ṣe ga mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe é lóye.
- source_word: ἐξήρχοντο
  choice: ń jáde lára
  rationale: “Jáde lára” bá àyíká yíyọ ẹ̀mí jáde mu; àmì ìṣe “ń” tún ṣojú ìṣe tí ó ń lọ lọ́wọ́ nínú imperfect náà.
- source_word: παραλελυμένοι
  choice: àwọn tí ara wọn rọ
  rationale: Ó ṣàlàyé ipò paralysis ní ọ̀nà tí àwọn òǹkàwé Yorùbá òde òní lè lóye láìlo ọ̀rọ̀ ẹ̀gàn.
- source_word: χωλοὶ
  choice: àwọn tí wọ́n yarọ
  rationale: Ó tọ́ka sí àwọn tí kò lè rìn dáadáa, ó sì yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ àwọn tí gbogbo ara wọn rọ.
- source_word: ἐθεραπεύθησαν
  choice: ni a … mú láára dá
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá fún ìwòsàn, ó sì pa ohùn àìsọ ẹni tó ṣe iṣẹ́ náà mọ́.
theological_decisions:
- issue: Ẹni tí ó ń ké tí ó sì ń jáde
  choice: Àwọn ẹ̀mí àìmọ́ ni wọ́n ń ké ní ohùn rara bí wọ́n ti ń jáde lára àwọn ènìyàn.
  alternative: Àwọn ènìyàn tí ẹ̀mí àìmọ́ wà lára wọn ni wọ́n ń ké nígbà tí àwọn ẹ̀mí náà ń jáde.
  rationale: Participle neuter plural βοῶντα bá πνεύματα ἀκάθαρτα mu ní gírámà Gíríìkì, nítorí náà àwọn ẹ̀mí ni ó ṣeé ṣe jù pé a ń ṣàpèjúwe gẹ́gẹ́ bí ẹni tí ń ké.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní ọlá ni a lò. A tún àwọn gbolohun Gíríìkì tò díẹ̀ kí ẹni tí “wọ́n” ń tọ́ka sí lè ṣe kedere, láìyí ìtumọ̀ tàbí ìbáṣepọ̀ àwọn ìṣe náà padà.
