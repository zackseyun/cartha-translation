  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: yo
  text: Àwọn náà, lẹ́yìn tí wọ́n sọ̀kalẹ̀, gbàdúrà fún wọn kí wọ́n lè gba Ẹ̀mí Mímọ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí wọ́n sọ̀kalẹ̀, wọ́n gbàdúrà fún wọn kí wọ́n lè gba Ẹ̀mí Mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Àwọn náà, lẹ́yìn tí wọ́n sọ̀kalẹ̀, gbàdúrà fún wọn.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn tí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn ìbátan tí ó ń tọ́ka sí Peteru àti Johanu nínú ẹsẹ tó ṣáájú; ‘Àwọn tí’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: καταβάντες
  choice: wọ́n sọ̀kalẹ̀
  rationale: Aorist participle náà ń fi ìṣe tó ṣáájú àdúrà hàn. Àtẹ̀lé ‘wọ́n sì’ pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: προσηύξαντο
  choice: wọ́n sì gbàdúrà
  rationale: Ó túmọ̀ sí pé wọ́n gbàdúrà; kò sí ìtumọ̀ pàtàkì míì láti fi kún middle form náà níbí.
- source_word: περὶ αὐτῶν
  choice: fún wọn
  rationale: Pẹ̀lú ọ̀rọ̀ àdúrà, περί àti genitive fi àdúrà nítorí tàbí ní ipò àwọn ẹni náà hàn; ‘fún wọn’ jẹ́ Yorùbá tó ṣe kedere.
- source_word: ὅπως
  choice: kí
  rationale: Ó ń tọ́ka sí ète àdúrà; ìṣètò ‘kí ... lè’ ń sọ ète náà ní Yorùbá àdánidá.
- source_word: λάβωσιν
  choice: wọn lè gba
  rationale: Aorist subjunctive lẹ́yìn ὅπως ni a túmọ̀ pẹ̀lú ‘lè’ láti pa ète mọ́ láìfi àìdánilójú tí kò sí nínú Gíríìkì kún un.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká ìtàn Ìṣe àwọn Aposteli, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Ọlọ́run; ‘Ẹ̀mí Mímọ́’ ni ọ̀nà Yorùbá tí a mọ̀, láìfi àpilẹ̀kọ tí Gíríìkì kò ní hàn.
theological_decisions:
- issue: Bóyá πνεῦμα ἅγιον ń tọ́ka sí ẹ̀mí mímọ́ kan lápapọ̀ tàbí sí Ẹ̀mí Ọlọ́run
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Àyíká Ìṣe 8 ń sọ̀rọ̀ nípa Ẹ̀mí tí àwọn onígbàgbọ́ ń gbà. Lílo orúkọ ‘Ẹ̀mí Mímọ́’ dá ẹni tí ọ̀rọ̀ náà ń tọ́ka sí mọ̀, láìfikún ẹ̀kọ́ ìsìn tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘sọ̀kalẹ̀ ... sì gbàdúrà’ láti jẹ́ kí gbólóhùn náà ṣàn dáadáa, nígbà tí àwọn àlàyé ìsàlẹ̀ ojú ewé ń pa ìtumọ̀ participle náà mọ́.
