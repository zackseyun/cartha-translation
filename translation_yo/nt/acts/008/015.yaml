  terminology: “Gbàdúrà fún wọn,” “kí wọ́n lè gba,” àti “Ẹ̀mí Mímọ́” jẹ́ yíyan ọ̀rọ̀ tó pé, tó jẹ́ àdánidá, tí ó sì bá àyíká Ìṣe 8 mu. “Ẹ̀mí Mímọ́” ń tọ́ka sí ẹni tí πνεῦμα ἅγιον ń tọ́ka sí nínú àyíká náà, láìfikún èrò ẹ̀kọ́ ìsìn mìíràn.
