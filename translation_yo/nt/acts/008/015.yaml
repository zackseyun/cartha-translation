  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà wá dáadáa: ìsọ̀kalẹ̀ ṣáájú àdúrà, àdúrà fún àwọn ará Samaria náà, àti ète pé kí wọ́n gba Ẹ̀mí Mímọ́. Síbẹ̀, ìkọ́lé “Àwọn tí wọ́n sọ̀kalẹ̀, wọ́n sì gbàdúrà” dà bí gbolohun ìbátan tí a fi kúrò lọ́tọ̀; kò rọrùn gẹ́gẹ́ bí ọ̀nà láti tọ́ka sẹ́yìn sí Peteru àti Johanu. Lílo “Àwọn náà, lẹ́yìn tí wọ́n sọ̀kalẹ̀, ...” ń mú iṣẹ́ οἵτινες hàn ní kedere, ó sì pa ìtẹ̀lé participle καταβάντες mọ́.'
