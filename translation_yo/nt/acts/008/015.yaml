revisions:
- from: Àwọn tí wọ́n sọ̀kalẹ̀, wọ́n sì gbàdúrà fún wọn, kí wọn lè gba Ẹ̀mí Mímọ́.[a][b]
  to: Àwọn náà, lẹ́yìn tí wọ́n sọ̀kalẹ̀, gbàdúrà fún wọn kí wọ́n lè gba Ẹ̀mí Mímọ́.[a][b]
  rationale: Àtúnṣe náà ṣe “Àwọn náà” ní ọ̀nà tó tọ́ka sẹ́yìn sí àwọn aṣojú méjèèjì nínú ẹsẹ tó ṣáájú, ó sì tú καταβάντες sí “lẹ́yìn tí wọ́n sọ̀kalẹ̀” láti fi hàn pé ìsọ̀kalẹ̀ wá ṣáájú àdúrà. Ó pa ète ὅπως λάβωσιν (“kí wọ́n lè gba”) àti ìtọ́kasí sí Ẹ̀mí Mímọ́ mọ́. Àwọn àmì ìsàlẹ̀ ojú ewé náà wà lẹ́yìn ẹsẹ náà gẹ́gẹ́ bí ìṣètò ìwọle, wọ́n sì jẹ́ kí àwọn ìyípadà tí wọ́n yẹ hàn ní kedere.
