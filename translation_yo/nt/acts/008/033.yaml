language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: yo
  text: '“Nínú ìrẹ̀sílẹ̀ rẹ̀, a mú ìdájọ́ òdodo kúrò lọ́wọ́ rẹ̀.[a]


    Ta ni yóò ròyìn ìran rẹ̀?[b]


    Nítorí a mú ìyè rẹ̀ kúrò ní ilẹ̀ ayé.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a mú ìdájọ́ rẹ̀ kúrò lọ́wọ́ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ìran” tún lè túmọ̀ sí “àwọn ọmọ-ọmọ rẹ̀” tàbí “àwọn ènìyàn ìgbà ayé rẹ̀.” Ọ̀rọ̀ Gíríìkì náà pa àìdánilójú inú àyọlò Aísáyà 53 mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ταπεινώσει
  choice: ìrẹ̀sílẹ̀
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ipò tí a ti rẹ ẹnì kan sílẹ̀ tàbí ti a ti tàbùkù sí i. “Ìrẹ̀sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tí kò sì fi ìtumọ̀ míì kún ọ̀rọ̀ Gíríìkì.
- source_word: κρίσις
  choice: ìdájọ́ òdodo
  rationale: Ní àyíká ọ̀rọ̀ yìí, κρίσις lè túmọ̀ sí ìdájọ́ tàbí òdodo tí ó yẹ kí ẹni náà rí gbà. “Ìdájọ́ òdodo” mú apá òfin àti fífi òdodo ṣe hàn, láìsọ pé kìkì ìdájọ́ tí a dá ni ọ̀rọ̀ náà túmọ̀ sí.
- source_word: ἤρθη
  choice: a mú ... kúrò lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ ìṣe aláìṣe yìí fi hàn pé a mú ohun kan kúrò tàbí pé a fi ẹni náà dù ú. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa èrò ìpàdánù mọ́.
- source_word: γενεὰν
  choice: ìran
  rationale: “Ìran” lè tọ́ka sí àwọn ọmọ-ọmọ ẹni tàbí sí àwọn ènìyàn ìgbà ayé rẹ̀; nítorí náà, ó pa àìdánilójú inú àyọlò Aísáyà mọ́.
- source_word: διηγήσεται
  choice: yóò sọ nípa
  rationale: Gbólóhùn yìí túmọ̀ sí láti ròyìn tàbí sọ ohun kan ní ẹ̀kúnrẹ́rẹ́. “Yóò sọ nípa” jẹ́ kedere, ó sì bá ìbéèrè àsọyé mu.
- source_word: αἴρεται
  choice: a mú ... kúrò
  rationale: Ìṣe aláìṣe yìí ń sọ nípa mímú ohun kan kúrò. Ìtumọ̀ náà pa àwòrán yìí mọ́ ní Yorùbá tó ṣe kedere.
- source_word: γῆς
  choice: ilẹ̀ ayé
  rationale: Nínú gbólóhùn yìí, γῆ túmọ̀ sí ilẹ̀ ayé gẹ́gẹ́ bí ibi tí ènìyàn ń gbé, kì í ṣe ilẹ̀ agbègbè kan pàtó.
- source_word: ζωὴ
  choice: ìyè
  rationale: “Ìyè” ni ìtumọ̀ tààrà fún ìwàláàyè ara nínú àyíká ikú ìránṣẹ́ náà.
theological_decisions:
- issue: Ìtumọ̀ γενεὰν αὐτοῦ (“ìran rẹ̀”)
  choice: A fi “ìran rẹ̀” sí ọ̀rọ̀ pàtàkì láti pa àìdánilójú rẹ̀ mọ́.
  alternative: “àwọn ọmọ-ọmọ rẹ̀” tàbí “àwọn ènìyàn ìgbà ayé rẹ̀”
  rationale: Àyọlò láti inú Aísáyà 53 yìí ṣòro láti pinnu sí ìtumọ̀ kan ṣoṣo. Ó lè tọ́ka sí irú-ọmọ rẹ̀ tàbí àwọn tí wọ́n jọ wà láàyè nígbà kan náà; àlàyé ìsàlẹ̀ ni a fi àwọn méjèèjì sí.
- issue: Ìtumọ̀ κρίσις
  choice: ìdájọ́ òdodo
  alternative: ìdájọ́
  rationale: Àyíká ọ̀rọ̀ náà lè túmọ̀ sí pé a fi òdodo tí ó yẹ kí ó rí gbà dù ú. Síbẹ̀, a pa “ìdájọ́” nìkan mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. Ìlà mẹ́ta náà tún pa ìrísí ewì inú àyọlò mọ́.
