source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: yo
  text: Ìwẹ̀fà náà sì dá Fílípì lóhùn pé, “Mo bẹ̀ ọ́, nípa ta ni wòlíì náà ń sọ̀rọ̀ yìí—nípa ara rẹ̀ ni tàbí nípa ẹlòmíràn?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Nígbà náà ni ... dá ... lóhùn pé
  rationale: δέ ń tẹ ìtàn náà síwájú, ἀποκριθείς sì jẹ́ ọ̀nà ìtàn Gíríìkì tí ó bá gbólóhùn ọ̀rọ̀ tí ó tẹ̀ lé mu. Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa iṣẹ́ ìdáhùn mọ́.
- source_word: ὁ εὐνοῦχος
  choice: ìwẹ̀fà náà
  rationale: “Ìwẹ̀fà” ni ọ̀rọ̀ Yorùbá fún ọkùnrin tí a ti sọ di àgàn; ó pa ìdánimọ̀ ẹni náà gẹ́gẹ́ bí Lúùkù ṣe pè é mọ́, dípò lílọ sí ọ̀rọ̀ gbogbogbò bí “òṣìṣẹ́ ìjọba.”
- source_word: τῷ Φιλίππῳ
  choice: Fílípì
  rationale: Dátífù náà fi ẹni tí a ń bá sọ̀rọ̀ hàn. Àkópọ̀ “dá Fílípì lóhùn” jẹ́ èdè Yorùbá àdánidá.
- source_word: Δέομαί σου
  choice: Mo bẹ̀ ọ́
  rationale: δέομαι jẹ́ ìbéèrè ọlọ́wọ̀ àti tọwọ́tọwọ́, ó sì lè ní ìkanra díẹ̀. “Mo bẹ̀ ọ́” mú agbára yẹn jáde lọ́nà Yorùbá àdánidá láì sọ ọ́ di ẹ̀bẹ̀ àpọ̀jù.
- source_word: περὶ τίνος
  choice: nípa ta
  rationale: περί pẹ̀lú jenitífù ń tọ́ka sí ẹni tí ọ̀rọ̀ náà dá lé; “nípa ta” jẹ́ ìbéèrè Yorùbá tó ṣe kedere.
- source_word: ὁ προφήτης
  choice: wòlíì náà
  rationale: Àpèjúwe náà dájú, ó sì tọ́ka sí wòlíì inú ẹsẹ Ìwé Mímọ́ tí wọ́n ṣẹ̀ṣẹ̀ kà.
- source_word: λέγει τοῦτο
  choice: ń sọ èyí
  rationale: Àkókò ìsinsìnyí ń mú ọ̀rọ̀ inú Ìwé Mímọ́ wá síwájú gẹ́gẹ́ bí ohun tí wòlíì náà ń sọ; “èyí” tọ́ka sí ẹsẹ tí a ṣẹ̀ṣẹ̀ kà.
- source_word: περὶ ἑαυτοῦ
  choice: nípa ara rẹ̀
  rationale: Arọ́pò-orúkọ afara-ẹni náà tọ́ka padà sí wòlíì náà, bẹ́ẹ̀ ni “ara rẹ̀” ṣe pa ìtumọ̀ náà mọ́.
- source_word: περὶ ἑτέρου τινός
  choice: nípa ẹlòmíràn
  rationale: ἕτερος τις túmọ̀ sí ẹnì kan mìíràn; “ẹlòmíràn” mú ìyàtọ̀ rẹ̀ sí “ara rẹ̀” hàn ní ṣókí.
theological_decisions:
- issue: Ẹni tí àsọtẹ́lẹ̀ náà ń tọ́ka sí
  choice: 'A fi sílẹ̀ gẹ́gẹ́ bí ìbéèrè ṣíṣí: “nípa ara rẹ̀ ... tàbí nípa ẹlòmíràn?”'
  alternative: Láti sọ ẹni tí àsọtẹ́lẹ̀ náà ń tọ́ka sí nínú ìtumọ̀ ẹsẹ yìí
  rationale: Ọ̀rọ̀ Gíríìkì fi àṣàyàn méjèèjì sílẹ̀ nínú ìbéèrè ìwẹ̀fà náà; ìtumọ̀ kò gbọ́dọ̀ yanjú ohun tí ìtàn yóò ṣàlàyé lẹ́yìn náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe é lóye fún òǹkàwé òde òní. A lo “ìwẹ̀fà” láti pa pàtó ọ̀rọ̀ Gíríìkì mọ́, àti “Mo bẹ̀ ọ́” fún ìbéèrè tọwọ́tọwọ́. Kò sí àmì àlàyé ìsàlẹ̀ nítorí àṣàyàn pàtàkì náà ti hàn taara nínú ọ̀rọ̀.
