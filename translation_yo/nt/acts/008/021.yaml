id: ACT.8.21
reference: Acts 8:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: yo
  text: Ìwọ kò ní ìpín tàbí ogún kankan nínú ọ̀rọ̀ yìí, nítorí ọkàn rẹ kò tọ́ níwájú Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: ìpín
  rationale: Ó túmọ̀ sí apá tàbí ìpín tí ẹnì kan ní nínú ohun kan; ‘ìpín’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa àwòrán orísun mọ́.
- source_word: κλῆρος
  choice: ogún
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó jẹ́ ìpín ẹnì kan tàbí ohun tí ó bá a; ‘ogún’ pa ìyàtọ̀ díẹ̀ mọ́ láàárín rẹ̀ àti μερίς, láìfi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: nínú ọ̀rọ̀ yìí
  rationale: λόγος lè túmọ̀ sí ọ̀rọ̀, ọ̀ràn, tàbí iṣẹ́ tí a ń sọ̀rọ̀ rẹ̀. ‘Nínú ọ̀rọ̀ yìí’ jẹ́ àfihàn adayeba tí ó tún jẹ́ kí ìtumọ̀ náà má ṣe há sí ọ̀nà kan ṣoṣo.
- source_word: ἡ καρδία σου
  choice: ọkàn rẹ
  rationale: ‘Ọkàn’ jẹ́ ìbámu Yorùbá tó wọ́pọ̀ fún καρδία gẹ́gẹ́ bí àárín èrò, ìfẹ́, àti ète ènìyàn.
- source_word: οὐκ ἔστιν εὐθεῖα
  choice: kò dúró ṣánṣán
  rationale: εὐθεῖα túmọ̀ ní ti gidi sí ohun tó tọ́ tàbí tó gún régé. ‘Kò dúró ṣánṣán’ jẹ́ ọ̀nà Yorùbá adayeba láti sọ pé ipò inú ẹni kò tọ́, ó sì pa àwòrán ìdúró níwájú Ọlọ́run mọ́.
- source_word: ἔναντι τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ìtumọ̀ taara àti adayeba ni èyí fún jíjẹ́ tàbí dídúró ní ojú Ọlọ́run.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín μερίς àti κλῆρος
  choice: ìpín tàbí ogún
  alternative: ìpín tàbí àǹfààní
  rationale: A pa ìṣọ̀kan ọ̀rọ̀ méjèèjì àti ìyàtọ̀ kékeré wọn mọ́; ‘ogún’ lè gbé èrò ohun tí ó jẹ́ ti ẹnì kan jáde, láìpinnu bóyá ọ̀rọ̀ náà ń tọ́ka sí ìgbàlà, ipò iṣẹ́, tàbí ìkópa nínú iṣẹ́ ìhìn rere.
- issue: Ìtumọ̀ ‘ọkàn ... kò tọ́ níwájú Ọlọ́run’
  choice: ọkàn rẹ kò dúró ṣánṣán níwájú Ọlọ́run
  alternative: ọkàn rẹ kò tọ́ níwájú Ọlọ́run
  rationale: Àṣàyàn náà pa àwòrán εὐθεῖα mọ́, ṣùgbọ́n kò ṣàlàyé ju ohun tí ẹsẹ̀ sọ lọ nípa ìdálẹ́bi tàbí ipò ìgbàlà Símónì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn alájọ-ẹ̀sìn àti fún ṣíṣe ìtumọ̀ ‘ọ̀rọ̀ yìí’ ní pàtó ju orísun lọ.
