source:
  edition: SBLGNT
  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: yo
  text: Àwọn ogunlọ́gọ̀ ènìyàn náà sì fi ọkàn kan[b] tẹ́tí sí[a] àwọn ohun tí Fílípù ń sọ, bí wọ́n ti ń gbọ́ ọ́, tí wọ́n sì ń rí àwọn àmì tí ó ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fiyè sí” tàbí “fi etí sí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ìṣọ̀kan” tàbí “papọ̀”; Gíríìkì tẹnu mọ́ pé gbogbo wọn ní èrò kan, wọ́n sì fèsì papọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: tẹ́tí sí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí yí àfiyèsí sí ohun kan tàbí fetí sí i gidigidi. “Tẹ́tí sí” jẹ́ èdè Yorùbá àdánidá, ó sì lè fi ìfiyèsí tí ó ń bá a lọ hàn nínú àyíká yìí.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú ìtàn; “sì” so ẹsẹ yìí mọ́ ohun tó ṣáájú láìfi ìtakora líle kún un.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀ náà
  rationale: ὄχλοι jẹ́ ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì wà ní ọ̀pọ̀ nínú Gíríìkì. “Àwọn ogunlọ́gọ̀ náà” pa ọ̀pọ̀ náà mọ́.
- source_word: τοῖς λεγομένοις
  choice: àwọn ohun tí Fílípù ń sọ
  rationale: Àpólà alábápín náà ń tọ́ka sí àkóónú ọ̀rọ̀ Fílípù. Ìtumọ̀ yìí jẹ́ àdánidá, kò sì yí i padà sí ọ̀rọ̀ ìtumọ̀ bí “ìhìn iṣẹ́.”
- source_word: ὑπὸ τοῦ Φιλίππου
  choice: tí Fílípù ń sọ
  rationale: ὑπό pẹ̀lú ọ̀rọ̀-orúkọ ní genitive fi ẹni tó ń ṣe iṣẹ́ hàn. A ti sọ ìṣe aláìṣe Gíríìkì náà di ìṣe tí Fílípù ń ṣe ní tààràtà, bí Yorùbá ṣe máa ń sọ ọ́.
- source_word: ὁμοθυμαδὸν
  choice: fi ọkàn kan
  rationale: Ó ń fi ìṣọ̀kan èrò àti ìdáhùn gbogbo wọn hàn, kì í ṣe pé wọ́n wà papọ̀ nìkan.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: bí wọ́n ti ń gbọ́, tí wọ́n sì ń rí
  rationale: Ètò ἐν τῷ pẹ̀lú infinitive jẹ́ ti àkókò tàbí ipò níbí. αὐτούς jẹ́ accusative plural, ó sì bá àwọn ogunlọ́gọ̀ mu gẹ́gẹ́ bí olùṣe àwọn infinitive méjèèjì; nítorí náà, Yorùbá náà sọ “wọ́n” láìfi “Fílípù” kún un gẹ́gẹ́ bí ohun tí wọ́n gbọ́.
- source_word: τὰ σημεῖα
  choice: àwọn iṣẹ́ àmì
  rationale: “Àwọn iṣẹ́ àmì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ σημεῖα gẹ́gẹ́ bí iṣẹ́ tí ń tọ́ka sí ìtumọ̀ tàbí agbára kan, láìfi àlàyé “iṣẹ́ ìyanu” kún orísun.
- source_word: ἃ ἐποίει
  choice: tí ó ń ṣe
  rationale: Àmì àkókò aláìpé ἐποίει fi iṣẹ́ tó ń bá a lọ hàn; “ń ṣe” pa ìrísí yẹn mọ́.
