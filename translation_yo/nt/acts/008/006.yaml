translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkọ́tọ́ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Fi ọkàn kan” jẹ́ ọ̀rọ̀ àdánidá fún ìṣọ̀kan àwọn ènìyàn, “tẹ́tí sí” sì rọrùn fún òǹkàwé gbogbo.
