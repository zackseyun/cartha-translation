id: ACT.8.36
reference: Acts 8:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: yo
  text: Bí wọ́n sì ti ń lọ ní ọ̀nà, wọ́n dé ibi tí omi wà. Ìwẹ̀fà náà sì ní pé, “Wò ó, omi nìyí! Kí ni ó dí mi lọ́wọ́ láti gba ìrìbọmi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: ìwẹ̀fà
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ọkùnrin tí a ti sọ di àgàn, ó sì bá ipa ẹni náà mu nínú àyíká ìtàn yìí.
- source_word: Ἰδοὺ
  choice: Wò ó, omi nìyí!
  rationale: Ó mú ìpè láti kíyè sí ohun tí ó ṣẹ̀ṣẹ̀ hàn jáde ní ọ̀nà àdánidá ní Yorùbá.
- source_word: τί κωλύει με
  choice: Kí ni ó dí mi lọ́wọ́
  rationale: Ó pa ìtumọ̀ ìbéèrè nípa ohun tí ó lè dá ìṣe náà dúró mọ́.
- source_word: βαπτισθῆναι
  choice: láti ṣe ìrìbọmi
  rationale: Ó fi ìṣe ìrìbọmi hàn láì fi ọ̀nà tàbí ẹ̀kọ́ ìjọ kan pàtó kún un.
- source_word: φησιν
  choice: wí pé
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ti ìtàn, Yorùbá àdánidá sábà máa ń tẹ̀ lé ìtàn àtijọ́ pẹ̀lú ‘wí pé’; ìtumọ̀ iṣẹ́ ọ̀rọ̀ náà kò yí padà.
theological_decisions:
- issue: Ohun tí ó lè dí ìrìbọmi lọ́wọ́
  choice: 'A pa ìbéèrè náà mọ́ gẹ́gẹ́ bí ìbéèrè ṣíṣí: “Kí ni ó dí mi lọ́wọ́…?”'
  alternative: Ṣíṣe àfikún àlàyé nípa àwọn ohun tí ẹni gbọ́dọ̀ ṣe kí a tó baptisi rẹ̀
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ìdáhùn tàbí àwọn àdéhùn mìíràn; àfikún bẹ́ẹ̀ yóò yanju ìṣòro ẹ̀kọ́-ìgbàgbọ́ tí orísun kò yanju.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìsọ̀rọ̀ náà jẹ́ títọ́, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní.
