id: ACT.8.37
reference: Acts 8:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: yo
  text: Fílípì sì wí pé, “Bí ìwọ bá fi gbogbo ọkàn rẹ gbàgbọ́, a gbà ọ́ láyè.” Ó sì dáhùn pé, “Mo gbàgbọ́ pé Jésù Kristi ni Ọmọ Ọlọ́run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì ìjímìjí jù lọ, títí kan àwọn páìpírù ti ọ̀rúndún kẹta àti àwọn àfọwọ́kọ Sínáítíkù àti Vátíkánù ti ọ̀rúndún kẹrin; kò sì sí nínú àwọn ìtumọ̀ Kọ́pítì ìjímìjí. Ṣùgbọ́n ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ nínú àṣà Bísántíònù àti nínú àṣà Látìn, àwọn baba ìjọ ìjímìjí bí Irenaeus àti Cyprian sì tọ́ka sí i ní apá ìparí ọ̀rúndún kejì. Ọ̀pọ̀ àwọn ọ̀mọ̀wé ka a sí ọ̀rọ̀ ìjẹ́wọ́ ìgbàgbọ́ tí a máa ń lò níbi ìrìbọmi ní ìjọ ìjímìjí, tí a sì fi kún ìtàn Ìṣe àwọn Àpọ́sítélì lẹ́yìn náà.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: ó ṣe é
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ohun náà ní àṣẹ tàbí ó bófin mu láti ṣe; nínú àyíká yìí, “ó ṣe é” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó lè ṣe ìrìbọmi.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: fi gbogbo ọkàn rẹ
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ àṣàyàn Yorùbá tí ó wọ́pọ̀ fún ìgbàgbọ́ tòótọ́ àti ìfọkànsìn pípé.
- source_word: Πιστεύω
  choice: Mo gbàgbọ́
  rationale: Nínú ìjẹ́wọ́ yìí, “gbàgbọ́” dá ìtumọ̀ ìfọkàntán àti ìjẹ́wọ́ ẹni tí Jésù jẹ́ dúró.
- source_word: ὁ Ἰησοῦς Χριστός
  choice: Jésù ni Kristi náà
  rationale: Ìṣètò yìí fi Χριστός hàn gẹ́gẹ́ bí oyè—Kristi, ẹni àmì òróró náà—gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń jẹ́wọ́ ẹni tí Jésù jẹ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìjẹ́wọ́ náà
  choice: Kristi náà
  alternative: Mèsáyà náà
  rationale: “Kristi” jẹ́ ọ̀rọ̀ Bíbélì tí ó ti fìdí múlẹ̀ ní Yorùbá, ó sì pa ìbáṣepọ̀ taara mọ́ pẹ̀lú Χριστός láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní; a pa àtúnsọ ìṣe ọ̀rọ̀ Gíríìkì (“ó sì dáhùn pé”) mọ́ ní ọ̀nà tí kò le ní Yorùbá. Àmì àlàyé [a] wà lẹ́yìn gbogbo ẹsẹ nítorí pé àlàyé náà kan wíwà gbogbo ẹsẹ náà nínú àwọn àfọwọ́kọ.
