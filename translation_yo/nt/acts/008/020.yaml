language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru sọ fún un pé, “Kí fàdákà rẹ ṣègbé pẹ̀lú rẹ,[a] nítorí ìwọ rò pé o lè fi owó gba[b] ẹ̀bùn Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí owó rẹ lọ sínú ìparun pẹ̀lú rẹ.” Ọ̀rọ̀ Gíríìkì náà níhìn-ín jẹ́ “fàdákà,” èyí tí wọ́n sábà máa ń lò fún owó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jèrè” tàbí “ní ní ìní.” Èrò náà ni pé Simoni rò pé ó lè gba ẹ̀bùn Ọlọ́run nípa owó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: fàdákà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fàdákà tàbí owó fàdákà. “Fàdákà” pa àwòrán gidi ti Gíríìkì mọ́, ó sì yàtọ̀ sí χρημάτων, tí a túmọ̀ sí “owó” ní apá ìkẹyìn.
- source_word: σὺν σοὶ
  choice: pẹ̀lú rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi hàn pé ìparun tí a ń ké sí fàdákà náà kan ẹni tó ni ín pẹ̀lú.
- source_word: εἴη εἰς ἀπώλειαν
  choice: Kí ... ṣègbé
  rationale: Fọ́ọ̀mù optative náà jẹ́ ìkéde ìfẹ́ tàbí èébú líle, kì í ṣe àsọtẹ́lẹ̀ lasán. “Kí ... ṣègbé” pa agbára ọ̀rọ̀ náà mọ́ láì fi èrò pàtó nípa ìdálẹ́bi ayérayé kún un.
- source_word: δωρεὰν
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a fi fúnni, ó sì dúró ní ìtakò kedere sí ohun tí a ń rà.
- source_word: ἐνόμισας
  choice: ìwọ rò
  rationale: Ó túmọ̀ sí láti rò tàbí láti gbà pé ohun kan rí bẹ́ẹ̀. Fífún “ìwọ” ní ipò yìí mú ìbáwí Peteru lágbára ní Yorùbá.
- source_word: διὰ χρημάτων
  choice: fi owó
  rationale: διά pẹ̀lú genitive fi ohun èlò tàbí ọ̀nà hàn; “fi owó” ni ọ̀nà Yorùbá tó wọ́pọ̀ jù láti sọ ọ́.
- source_word: κτᾶσθαι
  choice: ra
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbígba tàbí rí ohun kan ní ìní. Nítorí pé owó ni ọ̀nà tí Simoni fẹ́ lò, “ra” sọ ìtumọ̀ ọ̀rọ̀ inú àyíká yìí ní kedere; àlàyé ìsàlẹ̀ tọ́ka sí àwọn ìtumọ̀ tó gbòòrò sí i.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìtakò hàn sí ìbéèrè Simoni nínú ẹsẹ tó ṣáájú; “Ṣùgbọ́n” ni ìbámu àdánidá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Peteru sí Simoni àti owó rẹ
  choice: 'Ìkéde ìfẹ́ ìparun tàbí èébú: “Kí fàdákà rẹ ṣègbé pẹ̀lú rẹ”'
  alternative: Àsọtẹ́lẹ̀ pé wọn yóò ṣègbé, tàbí gbólóhùn tó túmọ̀ sí ìdálẹ́bi ayérayé ní pàtó
  rationale: εἴη jẹ́ optative, nítorí náà a gbé e jáde gẹ́gẹ́ bí ìkéde ìfẹ́ tàbí èébú, kì í ṣe àsọjáde òtítọ́ lasán. “Ṣègbé” pa líle ìbáwí náà mọ́, ṣùgbọ́n kò pinnu pé ἀπώλεια gbọ́dọ̀ túmọ̀ sí ìdálẹ́bi ayérayé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “Kí ... ṣègbé” láti mú ìkéde líle náà jáde ní ọ̀nà àdánidá, a sì pa ìyàtọ̀ láàárín “fàdákà” àti “owó” mọ́.
