source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: yo
  text: Nígbà náà ni Fílípì sáré lọ sí ọ̀dọ̀ rẹ̀, ó sì gbọ́ ọ́ ń ka ìwé wòlíì Aísáyà. Ó ní, “Ṣé o lóye ohun tí o ń kà gan-an?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé o lóye ohun tí o ń kà ní tòótọ́?” Àwọn patikulu Gíríìkì náà fi ìtẹnumọ́ kún ìbéèrè Fílípì.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: sáré tọ̀ ọ́ lọ
  rationale: Ó fi ìṣísẹ̀ yíyára sí ọ̀dọ̀ ẹni náà hàn, ó sì pa àwòrán alààyè inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń mú ìtàn tẹ̀ síwájú; gbólóhùn yìí jẹ́ ọ̀nà àdánidá láti so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: ó sì gbọ́ tí ó ń ka
  rationale: Ìṣètò ọ̀rọ̀ náà túmọ̀ sí pé Fílípì gbọ́ ọkùnrin náà bó ṣe ń kà; kò fi kún un pé ó ń kà sókè, nítorí èyí kò fara hàn gbangba nínú Gíríìkì.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: Aísáyà wòlíì
  rationale: Ó dá orúkọ Aísáyà àti ipò rẹ̀ gẹ́gẹ́ bí wòlíì dúró ní ọ̀nà tó ṣe àdánidá ní Yorùbá.
- source_word: εἶπεν
  choice: Ó ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe àdánidá fún fífi ọ̀rọ̀ tààrà bẹ̀rẹ̀.
- source_word: Ἆρά γε
  choice: Ṣé lóòótọ́ ni
  rationale: Ó mú agbára ìbéèrè onítẹnumọ́ àwọn patikulu Gíríìkì náà jáde láì sọ ìdáhùn tí a retí di pàtó.
- source_word: γινώσκεις
  choice: o lóye
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí mímú ìtumọ̀ ohun tí a ń kà, kì í ṣe mímọ̀ lasán.
- source_word: ἃ ἀναγινώσκεις
  choice: ohun tí o ń kà
  rationale: Ó tọ́ka sí àkóónú tí ọkùnrin náà ń kà, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣe àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A gbé àmì àlàyé [a] sí ìparí ìbéèrè nítorí pé àlàyé náà kan agbára Ἆρά γε, kì í ṣe orúkọ Aísáyà.
