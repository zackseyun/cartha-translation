id: ACT.8.3
reference: Acts 8:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: yo
  text: Ṣùgbọ́n Saulu ń ba ìjọ jẹ́ gidigidi[a]. Ó ń wọ ilé kọ̀ọ̀kan[b], ó ń fa àwọn ọkùnrin àti àwọn obìnrin lọ, ó sì ń fi wọ́n sínú ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ń ṣe ìparun fún ìjọ.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘láti ilé dé ilé.’ Ọ̀rọ̀ Gíríìkì náà lè gba ọ̀nà méjèèjì; ‘ilé kọ̀ọ̀kan’ tẹnu mọ́ pé ó ń wọ ilé kan lẹ́yìn òmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: ń ba ... jẹ́ gidigidi
  rationale: Ọ̀rọ̀ yìí fi ìṣe búburú tó le, tó sì ń bá a lọ hàn; gbólóhùn Yorùbá yìí lágbára ju ‘ń ṣe inúnibíni sí’ lọ, ṣùgbọ́n kò sọ pé ó ti pa ìjọ run pátápátá.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: Nínú Ìṣe Àwọn Aposteli, ó tọ́ka sí àwùjọ àwọn onígbàgbọ́, ‘ìjọ’ sì ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bá àyíká mu.
- source_word: κατὰ τοὺς οἴκους
  choice: ilé kọ̀ọ̀kan
  rationale: 'Ó mú ìtumọ̀ pínpín κατά pẹ̀lú ọ̀pọ̀ orúkọ jáde: Saulu ń wọ ilé kan lẹ́yìn òmíràn.'
- source_word: εἰσπορευόμενος
  choice: Ó ń wọ
  rationale: Ó ṣàlàyé bí Saulu ṣe ń ba ìjọ jẹ́, ó sì pa ìṣe tó ń bá a lọ mọ́.
- source_word: σύρων
  choice: ń wọ́ ... lọ
  rationale: ‘Wọ́ ... lọ’ fi hàn pé ó ń fi ipá fà àwọn ènìyàn kúrò níbi tí wọ́n wà.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: àwọn ọkùnrin àti àwọn obìnrin
  rationale: Ó pa bí ìṣe náà ṣe kan ọkùnrin àti obìnrin láìṣe àṣàyàn mọ́.
- source_word: παρεδίδου
  choice: ń fi wọ́n sínú
  rationale: Ìlò àmì àkókò ‘ń’ pa ìṣe àsọtúnṣe tó ń bá a lọ mọ́; gbólóhùn náà jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó fà wọ́n lé àhámọ́.
- source_word: εἰς φυλακήν
  choice: ẹ̀wọ̀n
  rationale: Níhìn-ín φυλακή túmọ̀ sí ibi àhámọ́ tàbí ipò jíjẹ́ ẹlẹ́wọ̀n; ‘ẹ̀wọ̀n’ ṣe kedere fún òǹkàwé òde òní.
theological_decisions:
- issue: Bí a ṣe lè fi bí ìṣe Saulu ṣe le tó hàn kí ó tó yí padà
  choice: ń ba ìjọ jẹ́ gidigidi
  alternative: ń ṣe inúnibíni sí ìjọ; ń pa ìjọ run
  rationale: Èdè tí ó lágbára bá λυμαίνομαι mu, ó sì fi ìpalára oníwà-ipá hàn láìrọ̀ ọ́ sílẹ̀ sí inúnibíni lásán tàbí sọ pé ó ṣàṣeyọrí láti pa ìjọ run pátápátá.
translation_notes:
  register: 'A lo Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. Àtúnṣe ìṣe pẹ̀lú ‘ń’ pa àbùdá imperfect Gíríìkì mọ́. Àwọn àmì àlàyé ni a so mọ́ ibi tí wọ́n ń ṣàlàyé ní tòótọ́: [a] mọ́ ọ̀rọ̀ ìparun, [b] sì mọ́ ‘ilé kọ̀ọ̀kan.’'
