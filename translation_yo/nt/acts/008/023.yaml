  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: yo
  text: Nítorí mo rí i pé o wà nínú oró kíkorò àti ìdè àìṣòdodo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀wọ̀n àìṣòdodo” tàbí “ìdè ìwà búburú.”
    reason: lexical_alternative
  - marker: b
    text: “Oró kíkorò” jẹ́ àpèjúwe tó lágbára; ó ṣeé ṣe kó ń tọ́ka sí ọ̀rọ̀ inú Májẹ̀mú Láéláé nípa oró àti ìkórò (fi Diuuteronomi 29:18 nínú Septuagint wé e).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: nínú
  rationale: Nínú gbé ipò tàbí ààyè àpèjúwe tí Peteru rí Simoni wà jáde; ó bá àkópọ̀ ὁρῶ σε ὄντα mu ju ìtumọ̀ ìṣípò lọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ ìbáwí tó ṣáájú hàn, ó sì pa agbára àsopọ̀ γάρ mọ́.
- source_word: χολὴν πικρίας
  choice: oró kíkorò
  rationale: χολή lè tọ́ka sí omi-oró inú ẹ̀dọ̀ tàbí oró; ‘oró kíkorò’ jẹ́ àpèjúwe tó ṣeé lóye ní Yorùbá, ó sì pa ìfarahàn oró àti kíkorò mọ́ láì sọ ọ́ di ‘ìbínú’ lásán.
- source_word: σύνδεσμον ἀδικίας
  choice: ìdè àìṣòdodo
  rationale: ‘Ìdè’ ṣàfihàn ohun tó dè ènìyàn; ‘àìṣòdodo’ pa ìbòòrò ἀδικία mọ́, tó lè kan ìwà búburú tàbí ìṣe tí kò tọ́.
- source_word: ὁρῶ
  choice: mo rí i
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìríran tàbí ìfòye nípa ipò ẹnì kan.
- source_word: σε ὄντα
  choice: pé o wà
  rationale: A tú àkópọ̀ arọ́pò-orúkọ olùgbà àti participle náà sí gbólóhùn àkóónú Yorùbá tó ṣeé lóye, láì yí ìtumọ̀ padà.
theological_decisions:
- issue: Àpèjúwe ipò ẹ̀mí àti ìwà Simoni
  choice: A pa àpèjúwe méjèèjì mọ́ gẹ́gẹ́ bí ‘nínú oró kíkorò àti ìdè àìṣòdodo.’
  alternative: ‘O kún fún oró kíkorò, ẹ̀ṣẹ̀ sì ti dè ọ́.’
  rationale: Gíríìkì lo àwọn àpèjúwe ṣókí, kò sì ṣàlàyé ẹ̀kọ́ ìgbàgbọ́ kan ní kíkún. Mímú àpèjúwe náà mọ́ dáàbò bo líle ọ̀rọ̀ náà àti ìtumọ̀ rẹ̀ tó gbòòrò, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘oró kíkorò’ dípò àkójọpọ̀ ọ̀rọ̀ tí kò wọ́pọ̀ fún gall, kí àpèjúwe má bàa sọnù. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
