id: ACT.8.19
reference: Acts 8:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: yo
  text: Ó wí pé, “Ẹ fún mi náà ní àṣẹ yìí, kí ẹnikẹ́ni tí mo bá gbé ọwọ́ lé lè gba Ẹ̀mí Mímọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: Ó wí pé
  rationale: Ọ̀rọ̀ aláìparí yìí ń ṣí ọ̀rọ̀ Símónì sílẹ̀; ‘Ó wí pé’ jẹ́ ọ̀nà àdánidá nínú ìtàn Yorùbá, ó sì so ọ̀rọ̀ náà mọ́ ohun tó ṣáájú.
- source_word: Δότε
  choice: Ẹ fún
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn; ‘Ẹ fún’ ṣe àfihàn nọ́ńbà púpọ̀ inú Gíríìkì, ó sì bá ọ̀rọ̀ Yorùbá mu.
- source_word: κἀμοί
  choice: èmi náà
  rationale: Àpapọ̀ καί àti ἐμοί tẹnu mọ́ pé Símónì fẹ́ kí òun náà ní ohun tí àwọn aposteli ní; ‘èmi náà’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ἐξουσία lè túmọ̀ sí àṣẹ, ẹ̀tọ́, tàbí agbára tí a fi léni lọ́wọ́. ‘Àṣẹ’ pa ìyàtọ̀ rẹ̀ mọ́ sí àwọn ọ̀rọ̀ Gíríìkì míì tí ìtumọ̀ wọn jẹ́ agbára ní tààràtà, bí ó tilẹ̀ jẹ́ pé agbára láti ṣe ohun kan wà nínú àyíká ọ̀rọ̀ yìí.
- source_word: ταύτην
  choice: yìí
  rationale: Ó tọ́ka sí àṣẹ pàtó tí Símónì ṣẹ̀ṣẹ̀ rí.
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ fi ète tàbí àbájáde tí Símónì ń fẹ́ hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ᾧ ἐὰν
  choice: ẹnikẹ́ni tí ... bá
  rationale: Àkópọ̀ arọ́pò-orúkọ ìbátan àti ἐάν ń fi ipò gbogbogbò tí kò ní ẹni pàtó hàn; ‘ẹnikẹ́ni tí ... bá’ mú èyí jáde lọ́nà àdánidá.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: mo bá gbé ọwọ́ lé
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún fífi ọwọ́ lé ènìyàn; bí Gíríìkì ṣe lo ‘àwọn ọwọ́’ ní púpọ̀ kò béèrè fífi ‘ọwọ́ méjèèjì’ kún un.
- source_word: λαμβάνῃ
  choice: lè gba
  rationale: ‘Lè gba’ bá ọ̀rọ̀ ìfẹ́/àbájáde lẹ́yìn ‘kí’ mu, láìfi ìtumọ̀ àkókò tàbí ìṣe tí Gíríìkì kò sọ kún un.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú ìtàn Ìṣe àwọn Aposteli, gbólóhùn yìí ń tọ́ka sí Ẹ̀mí Ọlọ́run. Yorùbá kò nílò àpilẹ̀kọ bí ‘the,’ nítorí náà ‘Ẹ̀mí Mímọ́’ jẹ́ kedere, ó sì jẹ́ àdánidá.
theological_decisions:
- issue: Bóyá πνεῦμα ἅγιον, tí kò ní àpilẹ̀kọ nínú Gíríìkì, yẹ kí a túmọ̀ rẹ̀ bí ẹ̀mí mímọ́ kan tàbí Ẹ̀mí Mímọ́.
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Àyíká ọ̀rọ̀ inú Ìṣe 8 ń tọ́ka sí Ẹ̀mí Ọlọ́run, kì í ṣe ọ̀kan lára àwọn ẹ̀mí mímọ́. Àìsí àpilẹ̀kọ nínú Gíríìkì kò sọ ọ́ di aláìlópin, Yorùbá náà kò sì ní àpilẹ̀kọ pàtó tó bá ‘the’ mu.
- issue: Bóyá ἐξουσία yẹ kí a túmọ̀ sí ‘àṣẹ’ tàbí ‘agbára.’
  choice: àṣẹ
  alternative: agbára
  rationale: ‘Àṣẹ’ tẹ̀ lé ààyè ìtumọ̀ ἐξουσία gẹ́gẹ́ bí ẹ̀tọ́ tàbí agbára tí a fi léni lọ́wọ́, ó sì yẹra fún pípa ìyàtọ̀ rẹ̀ rẹ́ pẹ̀lú δύναμις. Àyíká ọ̀rọ̀ ṣì jẹ́ kedere pé àṣẹ náà ní ipa gidi.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò. A lo ‘Ẹ’ fún àṣẹ nọ́ńbà púpọ̀ sí àwọn aposteli, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ sí ẹni kan. ‘Gbé ọwọ́ lé’ jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé lásán lè lóye. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí ‘àṣẹ’ dá ìtumọ̀ ἐξουσία dúró dáadáa nínú Yorùbá.
