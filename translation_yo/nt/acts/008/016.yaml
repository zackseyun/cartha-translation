id: ACT.8.16
reference: Acts 8:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: yo
  text: Nítorí Ẹ̀mí Mímọ́ kò tíì sọ̀ kalẹ̀ sórí ẹnikẹ́ni nínú wọn[a]; wọ́n kàn ti gba ìrìbọmi ní orúkọ Olúwa Jésù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò tíì wá sórí ẹnikẹ́ni nínú wọn.”
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, ní ìtumọ̀ gangan: “wọ́n kàn ti gba ìrìbọmi sínú orúkọ Olúwa Jésù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: kò tíì
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà kò tíì ṣẹlẹ̀ títí dé àkókò yẹn; èyí ni ọ̀nà àdánidá láti sọ ‘not yet’ ní Yorùbá.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: lé ẹnikẹ́ni nínú wọn
  rationale: Ó pa àwòrán pé Ẹ̀mí ń bà lé ènìyàn mọ́, ó sì sọ ‘any of them’ ní kedere.
- source_word: ἐπιπεπτωκός
  choice: bà lé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣubú tàbí bíbọ̀ sórí ẹni; ‘bà lé’ jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μόνον
  choice: kàn
  rationale: 'Ó fi ààlà àti ìyàtọ̀ hàn: ìrìbọmi ni wọ́n ti gbà, ṣùgbọ́n Ẹ̀mí kò tíì bà lé wọn.'
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: wọ́n ti gba ìrìbọmi
  rationale: Ó sọ ìṣe tí ó ti ṣẹlẹ̀ tẹ́lẹ̀ tí ipò rẹ̀ sì ṣì wà, ní èdè Yorùbá tó rọrùn láti lóye.
- source_word: εἰς τὸ ὄνομα
  choice: ní orúkọ
  rationale: Èyí ni gbólóhùn Yorùbá tó jẹ́ àdánidá jù lọ nípa ìrìbọmi; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ‘sínú orúkọ’ pamọ́.
- source_word: κυρίου Ἰησοῦ
  choice: Olúwa Jesu
  rationale: Ó túmọ̀ κύριος gẹ́gẹ́ bí ‘Olúwa’ ó sì pa orúkọ àti oyè náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
theological_decisions:
- issue: Olùṣe tí a kò dárúkọ nínú ‘kò tíì bà lé’
  choice: Ẹ̀mí Mímọ́
  alternative: Kí a lo arọ́pò-orúkọ nìkan tàbí kí a fi olùṣe náà sílẹ̀ láìsọ
  rationale: Gíríìkì kò tún dárúkọ olùṣe náà, ṣùgbọ́n ẹsẹ tó ṣáájú sọ Ẹ̀mí Mímọ́ ní kedere. Dídárúkọ rẹ̀ mú Yorùbá yé kedere láìfi ìtumọ̀ tuntun kún ọ̀rọ̀ náà.
- issue: Ọ̀rọ̀ tí a lò fún ìrìbọmi pẹ̀lú εἰς τὸ ὄνομα
  choice: ní orúkọ Olúwa Jesu
  alternative: sínú orúkọ Olúwa Jesu
  rationale: ‘Ní orúkọ’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, nígbà tí ‘sínú orúkọ’ tẹ̀ lé àpèjúwe ibi inú ọ̀rọ̀ Gíríìkì ní pẹkipẹki. Àlàyé ìsàlẹ̀ pa ìyàtọ̀ náà mọ́, láìdájọ́ àríyànjiyàn ẹ̀kọ́ nípa àgbékalẹ̀ ọ̀rọ̀ ìrìbọmi.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Bà lé’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ‘gba ìrìbọmi’ sì jẹ́ ọ̀nà àdánidá tí òǹkàwé Yorùbá lásán lè lóye.
