  to: Nítorí Ẹ̀mí Mímọ́ kò tíì sọ̀ kalẹ̀ sórí ẹnikẹ́ni nínú wọn[a]; wọ́n kàn ti gba ìrìbọmi ní orúkọ Olúwa Jésù.[b]
  rationale: Àtúnṣe náà rọ́pò “bà lé” pẹ̀lú “sọ̀ kalẹ̀ sórí” kí ìtumọ̀ ἐπιπεπτωκός—ìṣubú tàbí bíbọ̀ sórí—lè hàn ní kedere ní Yorùbá. Ó tún ṣe àmì ohùn “Jésù” ní ìbámu pẹ̀lú Standard Yorùbá. Ìtumọ̀ ìrìbọmi àti àlàyé ìsàlẹ̀ ń pa ìyàtọ̀ láàárín ọ̀nà Yorùbá tó wọ́pọ̀ “ní orúkọ” àti εἰς tó túmọ̀ sí “sínú” mọ́.
