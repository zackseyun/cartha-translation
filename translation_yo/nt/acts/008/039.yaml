id: ACT.8.39
reference: Acts 8:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: yo
  text: Nígbà tí wọ́n sì gòkè láti inú omi, Ẹ̀mí Olúwa gbé Fílípù lọ[a], ìwẹ̀fà náà kò sì tún rí i mọ́; nítorí ó ń lọ ní ọ̀nà rẹ̀ pẹ̀lú ayọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fà Fílípù lọ lójijì.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ mímú ẹni kúrò lójijì àti pẹ̀lú agbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: wọ́n gòkè jáde kúrò nínú omi
  rationale: Ó pa ìṣípò sókè àti jíjáde kúrò nínú omi mọ́, láì fi èrò kan kún ọ̀nà tí ìbatisí náà gbà wáyé.
- source_word: πνεῦμα κυρίου
  choice: Ẹ̀mí Olúwa
  rationale: Nínú Lúùkù–Ìṣe, gbólóhùn yìí sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni tó ń ṣiṣẹ́; ‘Olúwa’ sì jẹ́ ìtumọ̀ àdánidá fún κύριος.
- source_word: ἥρπασεν
  choice: gbé Fílípù lọ
  rationale: Ọ̀rọ̀ yìí sọ pé Ẹ̀mí Olúwa mú Fílípù kúrò níbẹ̀. Ìtumọ̀ yìí jẹ́ èdè Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi agbára àti ìjafafa tó lè wà nínú ọ̀rọ̀ Gíríìkì hàn.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: kò sì rí i mọ́
  rationale: Ó sọ ní ṣókí àti ní èdè Yorùbá àdánidá pé láti ìgbà náà lọ, ìwẹ̀fà náà kò tún rí Fílípù.
- source_word: ὁ εὐνοῦχος
  choice: ìwẹ̀fà náà
  rationale: ‘Ìwẹ̀fà’ ni ọ̀rọ̀ Yorùbá tó bá orúkọ Gíríìkì mu, ó sì pa ìdánimọ̀ ẹni náà mọ́ nínú ìtàn.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: ó ń bá ọ̀nà rẹ̀ lọ
  rationale: Ìṣe tó ń bá a lọ nínú ọ̀rọ̀ Gíríìkì fara hàn nínú ‘ń bá … lọ,’ ‘ọ̀nà rẹ̀’ sì lè túmọ̀ sí ipa ọ̀nà àti ìrìn àjò rẹ̀.
- source_word: χαίρων
  choice: ó sì ń yọ̀
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe participle mọ́, ó sì fi hàn pé ayọ̀ náà ń bá ìrìn rẹ̀ lọ.
theological_decisions:
- issue: Bóyá πνεῦμα κυρίου ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí agbára kan tí kì í ṣe ẹni
  choice: Ẹ̀mí Olúwa gẹ́gẹ́ bí aṣojú Ọlọ́run tó ń ṣiṣẹ́
  alternative: ẹ̀mí kan láti ọ̀dọ̀ Olúwa tàbí agbára àìlẹ́ni
  rationale: Ìlò gbólóhùn náà nínú Lúùkù–Ìṣe sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run. Lílò lẹ́tà ńlá bá òye yìí mu láì fi ohun tí kò sí nínú ẹsẹ náà kún un.
- issue: Bóyá ἥρπασεν gbọ́dọ̀ tẹnu mọ́ ìmúkúrò lójijì àti pẹ̀lú agbára
  choice: Ọ̀rọ̀ inú ẹsẹ ni ‘gbé Fílípù lọ,’ pẹ̀lú àṣàyàn tó lágbára sí i nínú àlàyé ìsàlẹ̀
  alternative: já Fílípù gbà lọ
  rationale: Àyíká ìtàn fi iṣẹ́ àgbàyanu Ọlọ́run hàn. Ọ̀rọ̀ àkọ́kọ́ rọrùn láti lóye, àlàyé ìsàlẹ̀ sì pa agbára àti ìjafafa ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ìwẹ̀fà’ gẹ́gẹ́ bí ọ̀rọ̀ tó péye fún ẹni tí ẹsẹ náà ń pè ní eunuch, a sì pa ìsopọ̀ ‘nítorí’ (γάρ) mọ́ láì ṣe àtúnṣe ìtumọ̀ ìbáṣepọ̀ rẹ̀.
