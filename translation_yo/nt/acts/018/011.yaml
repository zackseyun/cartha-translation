  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: yo
  text: Ó sì dúró níbẹ̀ fún ọdún kan àti oṣù mẹ́fà, ó ń kọ́ni ní ọ̀rọ̀ Ọlọ́run láàárín wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: ó dúró níbẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gidi ọ̀rọ̀ náà ni ‘ó jókòó,’ ní àyíká ìtàn yìí ó túmọ̀ sí pé Pọ́ọ̀lù dúró tàbí gbé ní ibi náà fún àkókò kan. ‘Ó dúró níbẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: δὲ
  choice: Nítorí náà
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀. Ní ìbámu pẹ̀lú ọ̀rọ̀ ìṣírí Ọlọ́run nínú ẹsẹ tó ṣáájú, ‘Nítorí náà’ fi ìṣàn ìtàn àti ìbáṣepọ̀ ìdí sí ìṣe hàn láìfi agbára ju ti Gíríìkì lọ.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: fún ọdún kan àti oṣù mẹ́fà
  rationale: Gbólóhùn náà tọ́ka sí iye àkókò. Fífikun ‘fún’ jẹ́ àdánidá ní Yorùbá, ‘ọdún kan àti oṣù mẹ́fà’ sì pa iye àkókò orísun mọ́.
- source_word: διδάσκων
  choice: ó ń kọ́ wọn
  rationale: Àpólà aláìparí yìí fi ìṣe tó ń bá a lọ ní gbogbo àkókò tí ó dúró hàn. ‘Ó ń kọ́ wọn’ sọ ìṣe ìkọ́ni tó ń tẹ̀ síwájú ní Yorùbá àdánidá.
- source_word: ἐν αὐτοῖς
  choice: wọn
  rationale: Níhìn-ín ἐν αὐτοῖς ní ìtumọ̀ pé ó ń ṣiṣẹ́ láàárín àwọn ènìyàn náà. Nínú Yorùbá, ‘ó ń kọ́ wọn’ sọ ìbáṣepọ̀ yìí ní kedere, láìlo gbólóhùn líle bí ‘nínú wọn.’
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: ‘Ọ̀rọ̀ Ọlọ́run’ jẹ́ gbólóhùn Bíbélì tí a mọ̀ dáadáa, ó sì pa ìtumọ̀ λόγος gẹ́gẹ́ bí ìhìn tí ó wá láti ọ̀dọ̀ Ọlọ́run mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo ‘ó ń kọ́ wọn’ dípò ‘ó ń kọ́ni láàárín wọn’ nítorí pé ó jẹ́ àdánidá sí i ní Yorùbá, bó tilẹ̀ jẹ́ pé ó sọ ohun tí ἐν αὐτοῖς tọ́ka sí ní tààrà.
