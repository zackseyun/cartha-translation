  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìlànà ẹsẹ̀ náà dáadáa, ṣùgbọ́n ‘ẹ̀ṣẹ̀’ lè darí ìtumọ̀ ἀδίκημα sí ẹ̀ṣẹ̀ ìsìn dípò ìwà àìtọ́/ìwà tí ó lòdì sí òfin. Pẹ̀lú náà, ‘fi sùúrù gbọ́ ti yín’ ṣàfikún èrò gbígbọ́ ẹjọ́ wọn tí kò wà ní ọ̀rọ̀ Gíríìkì; ἀνεσχόμην ὑμῶν sọ pé yóò fara dà wọ́n. A tún ṣe orúkọ Gallio sí ìkọ̀wé tó sún mọ́ Gálíò.
  naturalness: Àkọsílẹ̀ náà jẹ́ Yorùbá boṣewa tí ó ye ẹni. ‘Ìbá jẹ́ pé’ àti ‘ó bá ìdí mu’ jẹ́ àdánidá; ‘kí n fara dà yín’ sì ń mú ìtumọ̀ ọrọ̀ náà hàn láìfi àlàyé àyíká kún un.
