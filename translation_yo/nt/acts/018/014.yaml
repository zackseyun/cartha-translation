  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù fẹ́ bẹ̀rẹ̀ sí í sọ̀rọ̀[a], Gálíò sọ fún àwọn Júù pé, “Ẹ̀yin Júù, ìbá jẹ́ pé ìwà àìtọ́ kan tàbí ìwà ọ̀daràn búburú ni ọ̀ràn náà, ó bá ìdí mu kí n fara dà yín[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “fẹ́ ṣí ẹnu rẹ̀”; àṣà ọ̀rọ̀ Gíríìkì ni fún bíbẹ̀rẹ̀ sí í sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó bá ìdí mu kí n faradà yín.” Ọ̀rọ̀ náà lè túmọ̀ sí fífaradà wọn; àyíká ilé-ẹjọ́ náà lè fi hàn pé ó ń tọ́ka sí sísọ ẹjọ́ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: bí Pọ́ọ̀lù ti fẹ́ bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Àkójọpọ̀ μέλλω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ń tọ́ka sí ohun tí ó fẹ́ ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀. Gbólóhùn Gíríìkì túmọ̀ ní tààrà sí ‘ṣí ẹnu,’ ṣùgbọ́n ‘bẹ̀rẹ̀ sí í sọ̀rọ̀’ ni àṣà ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó fi ìyípadà ìtàn àti ìtakora kékeré hàn: Pọ́ọ̀lù fẹ́ dáhùn, ṣùgbọ́n Gálíónì kọ́kọ́ sọ̀rọ̀.'
- source_word: Γαλλίων
  choice: Gálíónì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà kíkọ orúkọ àjèjì ní Yorùbá.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: sọ fún àwọn Júù
  rationale: Nínú ọ̀rọ̀-ìṣe sísọ, πρός ń tọ́ka sí àwọn tí a ń bá sọ̀rọ̀. ‘Àwọn Júù’ pa fífi ẹgbẹ́ náà hàn gẹ́gẹ́ bí Gíríìkì ṣe wí, láìfi ‘olùfisùn’ kún un.
- source_word: Εἰ μὲν ἦν
  choice: ìbá ṣe pé ... ni
  rationale: Èyí ń gbé àníyàn àìṣẹ̀lẹ̀ kalẹ̀ ní ọ̀nà àdánidá Yorùbá; μέν kò nílò ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: ἀδίκημά τι
  choice: ẹ̀ṣẹ̀ kan
  rationale: ἀδίκημα lè túmọ̀ sí àìṣòdodo, ìwà àìtọ́, tàbí ẹ̀ṣẹ̀ lábẹ́ òfin. ‘Ẹ̀ṣẹ̀ kan’ jẹ́ gbígbòòrò tó, ó sì bá àyíká ilé-ẹjọ́ mu láìsọ irú ẹ̀ṣẹ̀ náà pàtó.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: ìwà ọ̀daràn búburú
  rationale: Gbólóhùn náà darapọ̀ ìwà ọdaran tàbí ìṣe búburú mọ́ àpèjúwe ohun ibi. Yíyan yìí pa agbára òfin àti ìwà búburú rẹ̀ mọ́ láìdín un sí ‘ẹ̀ṣẹ̀ ńlá’ nìkan.
- source_word: ὦ Ἰουδαῖοι
  choice: Ẹ̀yin Júù
  rationale: ‘Ẹ̀yin’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìpè tààrà tí ó tún fi ohùn àsọyé ὦ hàn.
- source_word: κατὰ λόγον
  choice: ó bá ìdí mu
  rationale: Àṣà ọ̀rọ̀ náà túmọ̀ sí ‘pẹ̀lú ìdí tó yẹ’ tàbí ‘lọ́nà tó bófin mu.’ ‘Ó bá ìdí mu’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdáláre náà.
- source_word: ἀνεσχόμην ὑμῶν
  choice: kí n fi sùúrù gbọ́ ti yín
  rationale: ἀνέχομαι lè túmọ̀ sí fara dà tàbí mú sùúrù. Nínú àyíká adájọ́ yìí, ohun tí Gálíónì yóò fara dà ni gbígbọ́ ẹjọ́ wọn; yíyan yìí mú ìtumọ̀ náà ṣe kedere, bí ó tilẹ̀ jẹ́ pé ó túmọ̀ àyíká náà díẹ̀.
