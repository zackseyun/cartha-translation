translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; a sì tú àṣà ọ̀rọ̀ Gíríìkì sí Yorùbá àdánidá, pẹ̀lú àlàyé ìtumọ̀ tààrà nínú àlàyé ìsàlẹ̀.
