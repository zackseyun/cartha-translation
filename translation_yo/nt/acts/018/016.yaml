translation:
  language: yo
  text: Ó sì lé wọn kúrò níwájú ìtẹ́ ìdájọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ilé-ẹjọ́” tàbí “pèpéle ìdájọ́”; ọ̀rọ̀ Gíríìkì náà, βῆμα, ń tọ́ka sí ìtẹ́ tàbí pèpéle tí aláṣẹ ń lò fún ìdájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ní ìtẹ̀síwájú ìtàn yìí, καί jẹ́ àsopọ̀ ìtàn tó rọrùn; “sì” jẹ́ ọ̀nà àdánidá láti so ìṣe yìí mọ́ ohun tó ṣáájú.
- source_word: ἀπήλασεν
  choice: lé ... kúrò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílé ẹni kúrò pẹ̀lú agbára tàbí àṣẹ; “lé ... kúrò” mú ìṣe aláṣẹ náà hàn ju “rán wọn lọ” lọ.
- source_word: αὐτοὺς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn ẹni tí ọ̀rọ̀ wọn wà níwájú Gálíónì, láì fi àlàyé tí Gíríìkì kò sọ kún un.
- source_word: ἀπὸ τοῦ βήματος
  choice: kúrò níbi ìjókòó ìdájọ́
  rationale: Ní àyíká ẹjọ́ yìí, βῆμα ni ibi gíga tàbí ìjókòó onídàájọ́ tí a ti ń gbọ́ ẹjọ́; gbolohun yìí fi hàn pé ó lé wọn kúrò ní agbègbè ilé-ẹjọ́ náà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “ìjókòó ìdájọ́” láti pa àyíká òfin mọ́, a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
