review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣe ἀπήλασεν (“lé ... kúrò”) àti ẹni tí a lé (“wọn”) hàn dáadáa. Ṣùgbọ́n “níbi ìjókòó ìdájọ́” túmọ̀ sí ibi tí ìjókòó náà wà, ó sì gùn díẹ̀ ju bí ἀπὸ τοῦ βήματος ṣe rí. “Kúrò níwájú ìtẹ́ ìdájọ́” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì pa àyíká ilé-ẹjọ́ àti ìtumọ̀ βῆμα mọ́.
  naturalness: “Ìtẹ́ ìdájọ́” jẹ́ àsàyàn tó múlò, tó sì rọrùn nínú Yorùbá boṣewa fún ibi-ìjókòó/ibi-gíga tí adájọ́ ti ń gbọ́ ẹjọ́. Gbólóhùn tí a ṣàtúnṣe náà jẹ́ kúkúrú, ó sì ń lọ dáadáa nínú ìtẹ̀síwájú ìtàn.
  terminology: A rọ́pò “ìjókòó ìdájọ́” pẹ̀lú “ìtẹ́ ìdájọ́,” èyí tí ó dára fún βῆμα nínú àyíká ìdájọ́. Àlàyé ìsàlẹ̀ ń pa àwọn ìtumọ̀ “ilé-ẹjọ́” àti “pèpéle ìdájọ́” mọ́ láì jẹ́ kí ọ̀kan nínú wọn dá bí ẹni pé ó jẹ́ ìtumọ̀ kan ṣoṣo.
