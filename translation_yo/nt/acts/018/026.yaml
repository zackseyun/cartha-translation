id: ACT.18.26
reference: Acts 18:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: yo
  text: Ó sì bẹ̀rẹ̀ sí í sọ̀rọ̀ pẹ̀lú ìgboyà nínú sínágọ́gù. Ṣùgbọ́n nígbà tí Pírísílà àti Ákílà gbọ́ ọ́, wọ́n mú un lọ sí ẹ̀gbẹ́ kan[a], wọ́n sì ṣàlàyé ọ̀nà Ọlọ́run fún un lọ́nà tí ó péye sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “wọ́n mú un lọ pẹ̀lú wọn,” tàbí, “wọ́n gbà á tọ̀wọ̀tọ̀wọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹnì kan tọ̀wọ̀tọ̀wọ̀, ó sì tún lè túmọ̀ sí mímú un lọ sí ẹ̀gbẹ́ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: Ó sì bẹ̀rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “ó” tọ́ka sí Àpólò nínú ẹsẹ tó ṣáájú; “sì” mú ìsopọ̀ pẹ̀lẹ́ tí τέ ní wá, “bẹ̀rẹ̀” sì pa ìtumọ̀ ἤρξατο mọ́.
- source_word: παρρησιάζεσθαι
  choice: sí í sọ̀rọ̀ pẹ̀lú ìgboyà
  rationale: Èyí fi ọ̀rọ̀ sísọ ní gbangba, láìbẹ̀rù, àti pẹ̀lú ìgboyà hàn ní Yorùbá àdánidá.
- source_word: ἐν τῇ συναγωγῇ
  choice: nínú sínágọ́gù
  rationale: “Sínágọ́gù” jẹ́ ọ̀rọ̀ tí a mọ̀ fún ibi ìpàdé àti ìjọsìn àwọn Júù, “nínú” sì pa ipò ibi náà mọ́.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Ṣùgbọ́n nígbà tí ... gbọ́ ọ̀rọ̀ rẹ̀
  rationale: A mú participle náà gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ nígbà kan; “gbọ́ ọ̀rọ̀ rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n gbọ́ ẹni náà.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Pírísílà àti Ákílà
  rationale: Àwọn wọ̀nyí jẹ́ ìkọ̀wé orúkọ náà ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: προσελάβοντο αὐτὸν
  choice: wọ́n mú un lọ sí ẹ̀gbẹ́ kan
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí gbígba ẹni tọ̀wọ̀tọ̀wọ̀ tàbí mímú ẹni lọ pẹ̀lú ara wọn. Ní àyíká yìí, ìtọnisọ́nà tó tẹ̀ lé mú “mú un lọ sí ẹ̀gbẹ́ kan” bá ìtàn náà mu, ṣùgbọ́n a pa àwọn ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἐξέθεντο
  choice: wọ́n sì ṣàlàyé
  rationale: “Ṣàlàyé” sọ ìtumọ̀ ọ̀rọ̀ náà kedere ní èdè Yorùbá òde òní láìfi ìforúkọsílẹ̀ àtijọ́ kún un.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ọ̀nà Ọlọ́run
  rationale: Èyí pa àwòrán “ọ̀nà” àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run mọ́, láìsọ pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀκριβέστερον
  choice: lọ́nà tí ó péye sí i
  rationale: 'Èyí pa agbára afiwéra adverb náà mọ́: àlàyé náà ní ìpéye tó pọ̀ sí ti ìmọ̀ tí Àpólò ti ní tẹ́lẹ̀.'
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí wọ́n ṣàlàyé ọ̀rọ̀ náà fún.
theological_decisions:
- issue: Irú ohun tí Pírísílà àti Ákílà ṣe sí Àpólò
  choice: Wọ́n mú un lọ sí ẹ̀gbẹ́ kan láti fún un ní àlàyé tó péye sí i.
  alternative: Wọ́n gbà á tọ̀wọ̀tọ̀wọ̀ tàbí wọ́n mú un lọ pẹ̀lú wọn.
  rationale: Àlàyé tó tẹ̀ lé fi hàn pé ìjíròrò ìkọ́nilẹ́kọ̀ọ́ kan wáyé láàárín wọn. Síbẹ̀, nítorí ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ gbígba ẹni tọ̀wọ̀tọ̀wọ̀, àlàyé ìsàlẹ̀ pa àìdánilójú yẹn mọ́, kò sì fi ìbáwí ní gbangba tàbí àṣẹ ìjọ tí ẹsẹ náà kò sọ kún un.
- issue: Ìtumọ̀ “ọ̀nà Ọlọ́run”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ọ̀nà Ọlọ́run.”
  alternative: Ìlànà ìwà rere Ọlọ́run lápapọ̀, tàbí orúkọ pàtó fún gbogbo ìgbàgbọ́ Kristẹni.
  rationale: Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ọ̀nà tàbí iṣẹ́ ìgbàlà Ọlọ́run, ṣùgbọ́n ìtumọ̀ náà kò sọ ohun tó ju ọ̀rọ̀ ìpilẹ̀ṣẹ̀ lọ, ó sì pa ìfọ̀rọ̀wérọ̀ ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó ní iyì, tí ó sì yẹ kí ó yé òǹkàwé lásán. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá, a sì lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn àti ẹ̀sìn tí a mọ̀.
