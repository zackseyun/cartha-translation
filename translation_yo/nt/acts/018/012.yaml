id: ACT.18.12
reference: Acts 18:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Gálíónì jẹ́ alákòóso àgbà ilẹ̀ Ákáíà, àwọn Júù[a] dìde sí Paulu ní ìṣọ̀kan, wọ́n sì mú un wá síwájú ilé ẹjọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní “àwọn Júù.” Níhìn-ín, ó ń tọ́ka sí ẹgbẹ́ àwọn Júù agbègbè náà tí wọ́n gbé ìgbésẹ̀ sí Paulu, kì í ṣe gbogbo Júù níbi gbogbo.
    reason: cultural_note
  - marker: b
    text: Tàbí “síwájú ìjókòó ìdájọ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí pẹpẹ tàbí ìjókòó òṣìṣẹ́ ìjọba níbi tí a ti ń gbọ́ ẹjọ́, tí a sì ti ń dájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Gálíónì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń kọ àwọn orúkọ Gíríìkì sí Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn nínú ìtàn, ó sì darí sí àtakò tí ó tẹ̀ lé.
- source_word: ἀνθυπάτου ὄντος
  choice: nígbà tí ... jẹ́ alákòóso àgbà
  rationale: Èyí mú ìtumọ̀ àkókò inú gbólóhùn Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἀνθύπατος
  choice: alákòóso àgbà
  rationale: Ó tọ́ka sí oyè pàtó ti Róòmù fún ẹni tó ń ṣàkóso ẹkùn kan; ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá, bí ó tilẹ̀ jẹ́ pé kò ní ọ̀rọ̀ Yorùbá kan ṣoṣo tó bá oyè náà mu pátápátá.
- source_word: Ἀχαΐας
  choice: ilẹ̀ Ákáíà
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹkùn Róòmù náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: κατεπέστησαν
  choice: dìde sí
  rationale: Ó fi ìgbésẹ̀ ọ̀tá sí Paulu hàn láìfi ipá ara kún ohun tí ẹsẹ náà sọ.
- source_word: ὁμοθυμαδὸν
  choice: ní ìṣọ̀kan
  rationale: Ó pa èrò ìgbésẹ̀ àpapọ̀ tí ẹgbẹ́ náà gbé mọ́.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù ibẹ̀
  rationale: “Àwọn Júù” ni Gíríìkì sọ ní tààrà, ṣùgbọ́n “ibẹ̀” jẹ́ kí àyíká ìtàn fi hàn pé ẹgbẹ́ Júù agbègbè náà ni, kì í ṣe gbogbo Júù níbi gbogbo.
- source_word: τῷ Παύλῳ
  choice: sí Paulu
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe náà, ó tọ́ka sí ẹni tí ìgbésẹ̀ ọ̀tá náà dojú kọ.
- source_word: ἤγαγον αὐτὸν
  choice: wọ́n sì mú un wá
  rationale: Ó bá ipò ẹjọ́ mu, kò sì fi èrò pé wọ́n fà á lọ tàbí lò ó ní ipá kún ọrọ̀ náà.
- source_word: ἐπὶ τὸ βῆμα
  choice: síwájú ilé ẹjọ́
  rationale: Ó sọ ipò ìdájọ́ osìṣẹ́ ìjọba di mímọ̀ ní Yorùbá òde òní; àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán ìjókòó tàbí pẹpẹ ìdájọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ οἱ Ἰουδαῖοι nínú ìtàn ìjà
  choice: àwọn Júù ibẹ̀
  alternative: àwọn Júù; àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì sọ “àwọn Júù,” kò sì sọ pé àwọn olórí nìkan ni. Fífi “ibẹ̀” kún un kò yí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí padà, ṣùgbọ́n ó dènà ìtumọ̀ àgbáyé tí yóò ka gbogbo Júù sí ẹni tí ó ṣe ìgbésẹ̀ náà.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. “Alákòóso àgbà” jẹ́ ọ̀nà tó ṣeé lóye fún oyè Róòmù ἀνθύπατος, nígbà tí àyíká fi hàn pé oyè ìṣàkóso ẹkùn ni.
