id: ACT.18.18
reference: Acts 18:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: yo
  text: Pọ́ọ̀lù sì dúró fún ọ̀pọ̀ ọjọ́ sí i. Lẹ́yìn náà, ó dágbére fún àwọn ará[a], ó sì wọ ọkọ̀ ojú omi lọ sí Síríà; Pírísílà àti Ákúlà sì bá a lọ. Ní Kẹ́ńkíréà, ó gé irun orí rẹ̀[b][c], nítorí ó ti ṣe ìlérí kan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “àwọn arákùnrin” ní ti gírámà, ṣùgbọ́n níbí ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé túmọ̀ sí pé, “ó fá irun orí rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gígé tàbí fífá irun; kò fi dandan hàn pé ó fá a tán pátápátá.
    reason: lexical_alternative
  - marker: c
    text: Gírámà Gíríìkì tọ́ka sí Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tí ó gé irun rẹ̀. Síbẹ̀, àwọn kan gbà pé Ákúlà ni ọ̀rọ̀ náà ń tọ́ka sí.
    reason: alternative_reading
  - marker: d
    text: Ẹsẹ yìí sọ pé “ìlérí kan” nìkan; kò sọ ní pàtó pé ìlérí Nasírì ni.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: dúró fún ọ̀pọ̀ ọjọ́ sí i
  rationale: “Dúró” conveys remaining or staying, while “ọ̀pọ̀ ọjọ́ sí i” naturally expresses ἔτι ... ἱκανὰς, a considerable number of additional days.
- source_word: τοῖς ἀδελφοῖς
  choice: àwọn ará
  rationale: In current Yoruba Christian usage, “àwọn ará” is a natural familial designation for the community of believers and does not unnecessarily restrict the group to men.
- source_word: ἀποταξάμενος
  choice: ó dágbére fún
  rationale: “Dágbére fún” naturally conveys taking leave of or saying farewell to someone.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: ó wọ ọkọ̀ ojú omi lọ sí Síríà
  rationale: This clearly and idiomatically communicates departure by ship toward Syria.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: Pírísílà àti Ákúlà sì bá a lọ
  rationale: This preserves Priscilla and Aquila as Paul’s traveling companions in natural Yoruba.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: ó gé irun orí rẹ̀
  rationale: κείρω can denote cutting or shearing hair and does not by itself require complete shaving. The Yoruba wording preserves that lexical breadth.
- source_word: εἶχεν γὰρ εὐχήν
  choice: nítorí ẹ̀jẹ́ kan wà lórí rẹ̀
  rationale: This idiomatic Yoruba wording presents the vow as an obligation resting on him, while retaining the source’s nonspecific “a vow.”
theological_decisions:
- issue: Referent of κειράμενος
  choice: The haircut is attributed to Paul.
  alternative: Some interpreters attribute it to Aquila.
  rationale: The masculine singular participle most naturally continues the sentence’s controlling subject, Paul. The less likely alternative is retained in a footnote.
- issue: Nature of εὐχή
  choice: Rendered only as “ẹ̀jẹ́ kan” (a vow).
  alternative: A Nazirite-type vow.
  rationale: The verse does not identify the vow as Nazirite, so no particular ritual category is imported into the main text.
- issue: Scope of ἀδελφοί
  choice: Rendered “àwọn ará,” naturally inclusive in Yoruba.
  alternative: “Àwọn arákùnrin,” a formally masculine rendering.
  rationale: Here the Greek familial plural designates the believing community; “àwọn ará” communicates that corporate sense without adding a gender restriction.
translation_notes:
  register: Standard Yoruba with full tone marks, contemporary and dignified. The sentence is divided for readability while preserving the sequence of Paul’s remaining, farewell, voyage, haircut, and vow. Proper names are transliterated as Pọ́ọ̀lù, Síríà, Pírísílà, Ákúlà, and Kẹ́ńkíréà.
