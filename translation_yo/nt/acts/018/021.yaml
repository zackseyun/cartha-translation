source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí ó ti dágbére fún wọn, ó sì sọ pé[a], “Èmi yóò tún padà tọ̀ yín wá, bí Ọlọ́run bá fẹ́”[b], ó wọ ọkọ̀ ojú omi kúrò ní Éfésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kò ní ọ̀rọ̀ náà, ‘ó sì sọ pé, “Èmi yóò tún padà tọ̀ yín wá, bí Ọlọ́run bá fẹ́.”’
    reason: textual_variant
  - marker: b
    text: Tàbí, “Ọlọ́run bá fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ẹsẹ yìí àti ẹ̀bẹ̀ wọn ṣáájú pé kí ó dúró pẹ́ sí i.
- source_word: ἀποταξάμενος
  choice: lẹ́yìn tí ó dágbére fún wọn
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀-àṣe aláìlópìn àárín náà jáde ní Yorùbá àdánidá, ó sì fi hàn pé dídágbére ṣáájú lílọ rẹ̀.
- source_word: καὶ εἰπών
  choice: ó sì sọ pé
  rationale: Ó pa ìtẹ̀lé ọ̀rọ̀-àṣe kejì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti mú ọ̀rọ̀ tí a fa yọ wọlé.
- source_word: Πάλιν
  choice: tún
  rationale: ‘Tún’ ni ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan yóò ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: ἀνακάμψω
  choice: Èmi yóò padà
  rationale: Ó túmọ̀ ọ̀rọ̀-àṣe ọjọ́ iwájú náà ní tààràtà, ìfihàn ‘Èmi’ sì bá ìtẹnumọ́ inú ọ̀rọ̀ tí Pọ́ọ̀lù sọ mu.
- source_word: πρὸς ὑμᾶς
  choice: tọ̀ yín wá
  rationale: Ó sọ ìdarí ìpadà náà ní Yorùbá àdánidá láìfi ìtumọ̀ míì kún un.
- source_word: τοῦ θεοῦ θέλοντος
  choice: bí Ọlọ́run bá fẹ́
  rationale: Ó pa ìgbẹ́kẹ̀lé ètò náà lé ìfẹ́ Ọlọ́run mọ́, ó sì tẹ̀lé ọ̀rọ̀-àṣe θέλω dípò yíyí i padà sí orúkọ ọ̀rọ̀.
- source_word: ἀνήχθη
  choice: ó ṣíkọ̀
  rationale: Nínú àyíká ìrìn-àjò ojú omi, ọ̀rọ̀ náà túmọ̀ sí pé ó gbéra lọ lórí omi; ‘ṣíkọ̀’ jẹ́ ọ̀nà Yorùbá ṣókí àti àdánidá fún un.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: láti Éfésù
  rationale: Ó fi ibi tí ó ti gbéra hàn ní tààràtà, pẹ̀lú àkọtọ̀ Yorùbá fún orúkọ ìlú náà.
theological_decisions:
- issue: Ìfẹ́ Ọlọ́run gẹ́gẹ́ bí ohun tí ìrìn-àjò Pọ́ọ̀lù sinmi lé
  choice: bí Ọlọ́run bá fẹ́
  alternative: bí Olúwa bá fẹ́
  rationale: Ẹ̀rí Gíríìkì ní τοῦ θεοῦ, ìyẹn ‘Ọlọ́run,’ kì í ṣe ‘Olúwa.’ Ìtumọ̀ náà pa bí ètò Pọ́ọ̀lù ṣe wà lábẹ́ ìfẹ́ Ọlọ́run mọ́ láìyí ọ̀rọ̀ orísun padà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbò. A fi àmì ohùn sí ibi tó yẹ, a sì yan ‘dágbére’ àti ‘ṣíkọ̀’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí ó bá ìtàn ìrìn-àjò Lúùkù mu.
