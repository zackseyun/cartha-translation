id: ACT.18.8
reference: Acts 18:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: yo
  text: Ṣùgbọ́n Kírísípù, olórí sínágọ́gù, gba Olúwa gbọ́ pẹ̀lú gbogbo agbo ilé rẹ̀. Ọ̀pọ̀ lára àwọn ará Kọ́ríńtì sì, bí wọ́n ti ń gbọ́, ń gbàgbọ́, a sì ń ṣe ìrìbọmi fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà tó rọrùn sí i pé, “ọ̀pọ̀ lára àwọn ará Kọ́ríńtì, nígbà tí wọ́n gbọ́, gba ìgbàgbọ́, a sì ṣe ìrìbọmi fún wọn.” Àwọn ìrísí ọ̀rọ̀-ìṣe Gíríìkì ṣàpèjúwe ìdáhùn náà bí ohun tó ń ṣẹlẹ̀ lọ́wọ́ tàbí tó ń tẹ̀ síwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: Kírísípù
  rationale: Orúkọ ẹni ni; a ṣe àkọsílẹ̀ ìró rẹ̀ ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: ἀρχισυνάγωγος
  choice: olórí sínágọ́gù
  rationale: Ó tọ́ka sí ẹni tó jẹ́ aṣáájú tàbí olórí nínú sínágọ́gù, láì fi kún un nípa bí iṣẹ́ ìṣàkóso rẹ̀ ṣe rí.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: gba Olúwa gbọ́
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan ní ìgbàgbọ́ nínú ẹni kan; a pa oyè κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa’ láì ṣàfikún ‘Jésù.’
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: pẹ̀lú gbogbo agbo ilé rẹ̀
  rationale: ‘Agbo ilé’ túmọ̀ sí gbogbo àwọn tó wà nínú ìdílé tàbí ilé ẹni, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: ọ̀pọ̀ lára àwọn ará Kọ́ríńtì
  rationale: ‘Lára’ ṣe àfihàn ìtumọ̀ partitive genitive, ìyẹn ọ̀pọ̀ ènìyàn láàárín àwọn ará Kọ́ríńtì.
- source_word: ἀκούοντες
  choice: bí wọ́n ti ń gbọ́
  rationale: Ó pa ìṣe tó ń lọ lọ́wọ́ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú gbígbàgbọ́ mọ́, nígbà tí ohun tí wọ́n gbọ́ ṣì wà ní àìsọ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ἐπίστευον
  choice: ń gbàgbọ́
  rationale: Àmì ìṣe aláìparí nínú Gíríìkì fi ìdáhùn àwọn ènìyàn hàn bí ohun tó ń ṣẹlẹ̀ lọ́wọ́ tàbí léraléra; ‘ń gbàgbọ́’ pa ìrísí yẹn mọ́.
- source_word: ἐβαπτίζοντο
  choice: a sì ń ṣe ìrìbọmi fún wọn
  rationale: Ìkọ̀wé aláìlẹ́ni-pàtó ‘a’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ohùn ìṣe àgbàṣe àti ìṣe tó ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ìwọ̀n gbígbàgbọ́ gbogbo agbo ilé Kírísípù
  choice: A túmọ̀ gbólóhùn náà ní tààràtà pé Kírísípù gba Olúwa gbọ́ pẹ̀lú gbogbo agbo ilé rẹ̀, láì ṣàlàyé bí olúkúlùkù ṣe kópa.
  alternative: Láti sọ ní pàtó pé gbogbo ọmọ ilé kọ̀ọ̀kan lo fi ìgbàgbọ́ ara rẹ̀ hàn, tàbí pé agbo ilé náà nìkan ni a ṣàpèjúwe lápapọ̀.
  rationale: Gíríìkì kò ṣàlàyé bí ìgbàgbọ́ olúkúlùkù nínú agbo ilé ṣe rí, bẹ́ẹ̀ ni kò yẹ kí ìtumọ̀ yanjú ọ̀ràn ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò yanjú.
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì mú kí Jésù ṣeé ṣe kedere gẹ́gẹ́ bí ẹni tí a ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí sọ κύριος nìkan; nítorí náà a kò fi orúkọ kún un.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, àdánidá, àti òde òní pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Sínágọ́gù’ jẹ́ ọ̀rọ̀ àyálò tó wọ́pọ̀ nínú èdè ìwé mímọ́, ‘agbo ilé’ sì dáàbò bo ìtumọ̀ ẹgbẹ́ ènìyàn inú ilé ju ilé gbígbé lọ. Ìtòlẹ́sẹẹsẹ gbólóhùn kejì mọ̀ọ́mọ̀ pa ìṣe tó ń lọ lọ́wọ́ nínú àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àlàyé ẹsẹ̀ ìsàlẹ̀ pèsè ọ̀nà Yorùbá tó rọrùn sí i.
