translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ, ó sì ní ìwọ̀ntúnwọ̀nsì àti ọlá tó bá ìtàn Ìwé Mímọ́ mu. A lo “sínágọ́gù,” ọ̀rọ̀ tí ó wọ́pọ̀ fún ilé ìpéjọsìn àwọn Júù. Gbogbo àmì àlàyé [a], [b], àti [c] wà nínú ọ̀rọ̀ pàtàkì, wọ́n sì tẹ̀ lé ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
