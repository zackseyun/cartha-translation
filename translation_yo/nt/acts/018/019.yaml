  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: yo
  text: Wọ́n dé Éfésù[a], ó sì fi wọ́n sílẹ̀ níbẹ̀[b]. Ṣùgbọ́n òun fúnra rẹ̀ wọ inú sínágọ́gù, ó sì bá àwọn Júù fọ̀rọ̀ wérọ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n dé sí Éfésù.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, ó fi àwọn ẹlẹgbẹ́ rẹ̀, Pírísílà àti Ákúílà tí a dárúkọ nínú ẹsẹ tó ṣáájú, sílẹ̀ níbẹ̀.
    reason: cross_reference
  - marker: c
    text: Tàbí, “ó bá àwọn Júù jíròrò.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìjíròrò tí a fi èrò àti ìdí ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: Wọ́n dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n dé ibi tí wọ́n ń lọ; “wọ́n dé” jẹ́ ọ̀nà Yorùbá àdánidá, ó sì bá ìṣàn ìtàn mu.
- source_word: δὲ
  choice: sì / Ṣùgbọ́n
  rationale: δὲ àkọ́kọ́ ń tẹ̀síwájú nínú ìtàn, nítorí náà “sì” yẹ; èkejì fi ohun tí Pọ́ọ̀lù ṣe yàtọ̀ sí ti àwọn ẹlẹgbẹ́ rẹ̀, nítorí náà “ṣùgbọ́n” mú ìyàtọ̀ náà hàn.
- source_word: κἀκείνους
  choice: àwọn yòókù
  rationale: Ó tọ́ka sí àwọn tí ó bá a rìn tí ẹsẹ tó ṣáájú ti dárúkọ. “Àwọn yòókù” pa ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́ láì fi orúkọ wọn kún ẹsẹ yìí.
- source_word: κατέλιπεν ... αὐτοῦ
  choice: fi ... sílẹ̀ níbẹ̀
  rationale: Àpapọ̀ yìí sọ pé ó fi wọ́n sílẹ̀ ní ibi náà; “níbẹ̀” mú ìtumọ̀ ibi tí αὐτοῦ ní hàn ní Yorùbá àdánidá.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, ó sì ń fi ohun tí òun ṣe yàtọ̀ sí àwọn tí ó fi sílẹ̀.
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: wọ inú sínágọ́gù
  rationale: Ìṣe aláìlẹ́ni náà ṣètò ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; Yorùbá àdánidá lè so àwọn ìṣe náà pọ̀ pẹ̀lú “ó sì.” “Sínágọ́gù” tọ́ka sí ibi ìpéjọsìn àwọn Júù ní àyíká yìí.
- source_word: διελέξατο
  choice: bá ... jíròrò
  rationale: διαλέγομαι níbí ń tọ́ka sí ìjíròrò tí a fi èrò àti ìdí ṣe, kì í ṣe dandan pé wọ́n ń bá ara wọn jà. “Bá ... jíròrò” jẹ́ èdè Yorùbá tó ṣe kedere, ó sì pa ànímọ́ ìfọ̀rọ̀wérọ̀ náà mọ́.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà fún àpèjúwe ẹ̀yà àti ẹ̀sìn náà; kò sí ẹ̀rí nínú gbolohun pé àwọn olórí nìkan ni.
