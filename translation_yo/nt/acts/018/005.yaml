id: ACT.18.5
reference: Acts 18:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Sílà àti Tímótì sọ̀kalẹ̀ láti Makedóníà, Pọ́ọ̀lù tẹra mọ́ ọ̀rọ̀ náà pátápátá[a], ó ń fi ìdánilójú jẹ́rìí fún àwọn Júù pé Jésù ni Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ọ̀rọ̀ náà ń rọ̀ ọ́’ tàbí ‘ọ̀rọ̀ náà gba gbogbo ọkàn rẹ̀.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ohun kan gba ènìyàn lọ́kàn pátápátá, ń rọ̀ ọ́, tàbí pé ó fi gbogbo ara rẹ̀ fún un.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘Kristi.’ Níhìn-ín, oyè ni ọ̀rọ̀ náà, torí náà a lo ‘Mèsáyà’ láti pa ìtumọ̀ ẹni àmì òróró tí a ṣèlérí mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì mú ìtumọ̀ àkókò ὡς jáde ní Yorùbá àdánidá.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: sọ̀kalẹ̀ láti Makedóníà
  rationale: Ó pa àwòrán ìrìn-àjò inú κατέρχομαι mọ́ láìfi ìtumọ̀ mìíràn kún un.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Sílà àti Tímótì
  rationale: Àwọn orúkọ méjèèjì ni ìkọ̀lé τε ... καί so pọ̀; ọ̀nà yìí jẹ́ kedere, ó sì bá Yorùbá òde òní mu.
- source_word: συνείχετο
  choice: tẹra mọ́ ... pátápátá
  rationale: Ó fi hàn pé iṣẹ́ náà gba Pọ́ọ̀lù lọ́kàn, ó sì ń fi ara rẹ̀ fún un gidigidi. Àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì—bí fífúnni ní ìkìmọ́lẹ̀ tàbí gbígba gbogbo ọkàn ẹni—mọ́.
- source_word: τῷ λόγῳ
  choice: ọ̀rọ̀ náà
  rationale: Ó pa λόγος mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀,’ èyí tí Lúùkù sábà máa ń lò fún ìhìn rere, dípò fífi àlàyé tí ó pọ̀ ju orísun lọ kún un.
- source_word: διαμαρτυρόμενος
  choice: ó ń fi ìdánilójú jẹ́rìí
  rationale: Ó pa èrò ìjẹ́rìí tí ó lágbára, tí ó sì ṣe pàtàkì, mọ́ nínú ọ̀rọ̀ Yorùbá tó ṣeé lóye.
- source_word: τοῖς Ἰουδαίοις
  choice: fún àwọn Júù
  rationale: Nínú àyíká Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà tọ́ka sí àwọn Júù gẹ́gẹ́ bí ẹgbẹ́ ẹ̀yà àti ẹ̀sìn, kì í ṣe àwọn ará Jùdíà nìkan.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: pé Jésù ni Mèsáyà
  rationale: Χριστός jẹ́ oyè nínú gbólóhùn àsọtẹ́lẹ̀ yìí; ìtumọ̀ náà jẹ́ pé Jésù ni ẹni àmì òróró tí a ṣèlérí.
theological_decisions:
- issue: Ṣíṣe Χριστός gẹ́gẹ́ bí oyè tàbí apá kan orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ní article, ó sì dúró gẹ́gẹ́ bí àpèjúwe ìdánimọ̀ nínú ìjẹ́rìí tí Pọ́ọ̀lù ń ṣe fún àwọn Júù. Nítorí náà, ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni àmì òróró tí a ṣèlérí jáde láìsọ ọ́ di orúkọ lásán.
translation_notes:
  register: A lo Yorùbá ìwòde tí ó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. ‘Tẹra mọ́ ... pátápátá’ yàgò fún èdè ẹ̀kọ́ ìsìn àkànṣe, nígbà tí àlàyé [a] pa àìdánilójú lexical inú συνείχετο mọ́.
