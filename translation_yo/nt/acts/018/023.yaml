id: ACT.18.23
reference: Acts 18:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: yo
  text: Lẹ́yìn tí ó lo àkókò díẹ̀ níbẹ̀, ó sì kúrò, ó ń gba agbègbè Gálátíà àti Fríjíà kọjá ní ìtẹ̀lé-tẹ̀lé, ó ń fún gbogbo àwọn ọmọ-ẹ̀yìn ní okun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń gba agbègbè Gálátíà àti Fríjíà kọjá lọ́nà tí ó tẹ̀lé ara wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: lẹ́yìn tí ó lo àkókò díẹ̀ níbẹ̀
  rationale: Àṣà ọ̀rọ̀ ποιέω + χρόνον túmọ̀ sí lílo àkókò kan. A fi “níbẹ̀” kún un láti inú àyíká ọ̀rọ̀, ìyẹn ibi tí a mẹ́nu kàn ṣáájú.
- source_word: ἐξῆλθεν
  choice: ó kúrò
  rationale: Nínú ìtàn ìrìn-àjò, ọ̀rọ̀ náà túmọ̀ sí pé ó fi ibi kan sílẹ̀ láti bẹ̀rẹ̀ ìrìn-àjò.
- source_word: διερχόμενος καθεξῆς
  choice: ó ń rin ìrìn-àjò láti ibì kan dé ibòmíràn káàkiri
  rationale: Àpapọ̀ yìí fi ìrìn-àjò tí ń tẹ̀ síwájú ní ìtẹ̀lé-tẹ̀lé hàn. Ọ̀rọ̀ Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìtumọ̀ ìlọ láti ibi kan sí òmíràn mọ́.
- source_word: τὴν Γαλατικὴν χώραν
  choice: agbègbè Gálátíà
  rationale: χώρα ń tọ́ka sí agbègbè tàbí ilẹ̀, kì í ṣe dandan pé ó jẹ́ orúkọ ìpínlẹ̀ Róòmù ní ìtumọ̀ ìmọ̀-ẹ̀rọ.
- source_word: καὶ Φρυγίαν
  choice: àti Fríjíà
  rationale: A ṣe àfọwọ́kọ orúkọ ibi náà ní ọ̀nà tó bá ìró Gíríìkì mu; ìtumọ̀ “agbègbè” tún kan Fríjíà nínú gbólóhùn náà.
- source_word: στηρίζων
  choice: ó ń fún ... lókun
  rationale: στηρίζω túmọ̀ sí fífúnni lókun tàbí mímú ẹni dúró ṣinṣin. Àṣàyàn yìí yẹ fún iṣẹ́ ìtọ́jú àwọn ọmọ-ẹ̀yìn láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
- source_word: πάντας τοὺς μαθητάς
  choice: gbogbo àwọn ọmọ-ẹ̀yìn
  rationale: “Àwọn ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn tí ń tẹ̀lé Jésù, “gbogbo” sì pa πάντας mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá àṣà mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “Fríjíà” láti sún mọ́ ìpè Gíríìkì Φρυγία.
