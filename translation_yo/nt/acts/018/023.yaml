- from: Lẹ́yìn tí ó sì lo àkókò díẹ̀ níbẹ̀, ó kúrò, ó ń rin ìrìn-àjò láti ibì kan dé ibòmíràn káàkiri agbègbè Gálátíà àti Fríjíà,[a] ó sì ń fún gbogbo àwọn ọmọ-ẹ̀yìn lókun.
  to: Lẹ́yìn tí ó lo àkókò díẹ̀ níbẹ̀, ó sì kúrò, ó ń gba agbègbè Gálátíà àti Fríjíà kọjá ní ìtẹ̀lé-tẹ̀lé, ó ń fún gbogbo àwọn ọmọ-ẹ̀yìn ní okun.[a]
