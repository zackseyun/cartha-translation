id: ACT.18.10
reference: Acts 18:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: yo
  text: nítorí èmi wà pẹ̀lú rẹ, kò sì sí ẹni tí yóò kọlu ọ láti ṣe ọ́ nípalára,[a] nítorí ọ̀pọ̀ ènìyàn ni mo ní ní ìlú yìí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sí ẹni tí yóò gbé ọwọ́ lé ọ láti ṣe ọ́ nípalára.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ọ̀pọ̀ ènìyàn ni mo ní ní ìlú yìí” túmọ̀ sí ọ̀pọ̀ ènìyàn ní Kọ́ríńtì tí wọ́n jẹ́ ti Olúwa, títí kan àwọn tí yóò ṣì gbàgbọ́.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀, ó sì tún bẹ̀rẹ̀ ìdí fún ìlérí náà ní apá ìkẹyìn ẹsẹ̀ yìí.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: èmi wà pẹ̀lú rẹ
  rationale: Fífi “èmi” hàn ní tààrà ń pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, nígbà tí gbólóhùn náà ṣì jẹ́ Yorùbá àdánidá.
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: kò sì sí ẹni tí yóò kọlu ọ
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ìgbésẹ̀ ọ̀tá sí Paulu; “kọlu ọ” sọ èyí ní kedere láì fi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: τοῦ κακῶσαί σε
  choice: láti ṣe ọ́ ní ibi
  rationale: Ó pa ìtumọ̀ ète tàbí àbájáde ìkọlù náà mọ́, ó sì gbòòrò tó láti ní ìpalára tàbí ìhùwàsí búburú sí Paulu nínú.
- source_word: λαός
  choice: ènìyàn
  rationale: Nínú “ọ̀pọ̀ ènìyàn,” ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àwùjọ àwọn ẹni tí Olúwa pè ní tirẹ̀.
- source_word: ἐστί μοι
  choice: ni mo ní
  rationale: Dátífù pẹ̀lú ọ̀rọ̀-ìṣe “wà” ń fi jíjẹ́ ohun-ìní hàn; “mo ní” ni ìtumọ̀ Yorùbá tí ó ṣe déédé jù.
- source_word: πολὺς
  choice: ọ̀pọ̀
  rationale: Ó tú ìwọ̀n púpọ̀ náà jáde ní ṣókí, ní tààrà.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: ní ìlú yìí
  rationale: “Ìlú” bá πόλις mu fún Kọ́ríńtì, “yìí” sì pa agbára atọ́ka ταύτῃ mọ́.
theological_decisions:
- issue: Ìtumọ̀ “ọ̀pọ̀ ènìyàn” ní ìlú náà
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ọ̀pọ̀ ènìyàn ni mo ní,” tí ó lè tọ́ka sí àwọn ará Kọ́ríńtì tí wọ́n jẹ́ ti Olúwa, títí kan àwọn tí yóò ṣì gbàgbọ́.
  alternative: Ó lè túmọ̀ sí ọ̀pọ̀ ènìyàn tí wọ́n ti wà ní ìlú náà tí wọ́n sì ṣe ojú rere sí Paulu.
  rationale: Àkọlé pàtàkì kò pinnu bí àwọn ènìyàn náà ṣe di ti Olúwa tàbí ìgbà tí wọ́n di tirẹ̀. Ìtumọ̀ náà pa ẹ̀tọ́ jíjẹ́ ti Olúwa àti ẹdọfu ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì fi èrò ẹ̀sìn kan pàtó kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti èyí tí ó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Èmi” ń gbé ìtẹnumọ́ orísun Gíríìkì jáde; “ṣe ọ́ ní ibi” sì pa ìtumọ̀ ìpalára mọ́ láì dín in kù sí ìfarapa ara nìkan. A gbe àmì àlàyé [a] sí ọ̀dọ̀ gbólóhùn tí àṣàyàn ọ̀rọ̀ rẹ̀ ń ṣàlàyé, àti [b] sí ọ̀dọ̀ “ọ̀pọ̀ ènìyàn.”
