  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n bẹ̀ ẹ́ pé kí ó dúró pẹ́ sí i, kò gbà sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “kò fọwọ́ sí i” tàbí “kò tẹ̀lé ìbéèrè náà.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ìfọwọ́sí sí ìbéèrè kan tàbí gbígba a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: nígbà tí wọ́n bẹ̀ ẹ́
  rationale: Ìṣe alábápín ọ̀rọ̀ àsìkò nínú genitive absolute ni a tú sí gbólóhùn àsìkò; ‘bẹ̀ ẹ́’ fi hàn pé ìbéèrè tàbí ẹ̀bẹ̀ ni wọ́n ń ṣe fún Pọ́ọ̀lù.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín bí wọ́n ṣe fẹ́ kí ó dúró àti bí kò ṣe gba ìbéèrè náà.
- source_word: αὐτῶν
  choice: wọ́n … ẹ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ará Éfésù gẹ́gẹ́ bí àwọn tó bẹ Pọ́ọ̀lù; èdè Yorùbá nílò kí ẹni tó ṣe ìṣe àti ẹni tí wọ́n ṣe é sí fara hàn kedere.
- source_word: ἐπὶ πλείονα χρόνον
  choice: fún àkókò gígùn sí i
  rationale: Ó pa ìtumọ̀ afiwéra πλείονα mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé kí ó lo àkókò púpọ̀ sí i níbẹ̀.
- source_word: μεῖναι
  choice: kí ó dúró
  rationale: Nínú ìtàn ìrìnàjò yìí, ‘dúró’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwà ní ibì kan fún àkókò díẹ̀ sí i.
- source_word: οὐκ ἐπένευσεν
  choice: kò gbà sí i
  rationale: ἐπινεύω túmọ̀ sí gbígba tàbí fífi ìfọwọ́sí sí ìbéèrè; ‘kò gbà sí i’ jẹ́ èdè Yorùbá tó ṣe kedere láìfi agbára ìkọ̀sílẹ̀ líle kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yan ‘bẹ̀ ẹ́’ àti ‘kò gbà sí i’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ àdánidá tí kò mú ìtumọ̀ orísun le ju bó ṣe rí lọ.
