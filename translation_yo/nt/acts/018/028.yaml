id: ACT.18.28
reference: Acts 18:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: yo
  text: Nítorí ó fi agbára ṣẹ́gun àwọn Júù nínú àríyànjiyàn ní gbangba, ó ń fi Ìwé Mímọ́ hàn pé Jésù ni Mèsáyà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé Mèsáyà náà ni Jésù.” Gbólóhùn èdè Gíríìkì lè gba ìtòlẹ́sẹẹsẹ ọ̀rọ̀ méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: Ní èdè Gíríìkì, “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: fi agbára
  rationale: Ó sọ bí àríyànjiyàn Ápólò ṣe lágbára tó, àti bí ẹ̀rí rẹ̀ ṣe munadoko, láìfi ìtumọ̀ kún ọ̀rọ̀ náà.
- source_word: διακατηλέγχετο
  choice: ṣẹ́gun ... nínú àríyànjiyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀rí tako ẹni débi pé a fi hàn pé ọ̀rọ̀ rẹ̀ kò dúró. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àtakò àti ìjẹ́rìí mọ́. Fífi “ó ń” sí apá kejì àti ìṣètò gbólóhùn náà ń jẹ́ kí ìṣe tí ó ń bá a lọ hàn.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà; ní àyíká ẹsẹ yìí, ó ń tọ́ka sí àwọn Júù tí Ápólò ń bá ṣe àríyànjiyàn.
- source_word: δημοσίᾳ
  choice: ní gbangba
  rationale: Ó sọ pé níwájú àwọn ènìyàn ni àríyànjiyàn náà ti wáyé.
- source_word: ἐπιδεικνὺς
  choice: ó ń ... fi ... hàn
  rationale: Ó fi ìṣe tí Ápólò ń ṣe láti mú ẹ̀rí rẹ̀ fìdí múlẹ̀ hàn, ó sì bá lílo Yorùbá mu.
- source_word: διὰ τῶν γραφῶν
  choice: fi Ìwé Mímọ́
  rationale: διά pẹ̀lú ọ̀rọ̀ inú genitive ń fi ohun èlò tàbí ọ̀nà hàn; Ìwé Mímọ́ ni ohun tí Ápólò fi mú ẹ̀rí rẹ̀ kalẹ̀.
- source_word: τὸν χριστὸν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí, ó ń tọ́ka sí ẹni àmì òróró tí Ìwé Mímọ́ ṣèlérí; “Mèsáyà” jẹ́ kí àyíká Júù àti oyè náà ṣe kedere.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí a sábà ń gbà kọ orúkọ Ἰησοῦς ní Yorùbá.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: pé Jésù ni Mèsáyà
  rationale: Èyí jẹ́ ìtòlẹ́sẹẹsẹ ọ̀rọ̀ tó ṣe àdánidá jù ní Yorùbá, ṣùgbọ́n èdè Gíríìkì lè gba ìtúmọ̀ “pé Mèsáyà náà ni Jésù” pẹ̀lú.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, kì í ṣe bí apá kan orúkọ. “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró tí àwọn Júù ń retí mọ́ nínú àríyànjiyàn láti inú Ìwé Mímọ́.
- issue: Ìtòlẹ́sẹẹsẹ ẹnìkan àti oyè nínú εἶναι τὸν χριστὸν Ἰησοῦν
  choice: Jésù ni Mèsáyà
  alternative: Mèsáyà náà ni Jésù
  rationale: Ìkọ̀wé Gíríìkì lè fara mọ́ méjèèjì. A yan èyí tó ṣe àdánidá ní Yorùbá, a sì pa òmìnira ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ṣeé lóye fún gbogbo ènìyàn. “Ṣẹ́gun ... nínú àríyànjiyàn” jẹ́ ọ̀nà àdánidá láti sọ ìtakò tó dá lórí ẹ̀rí, láìsọ pé Ápólò fi ipá ti ara ṣẹ́gun wọn. Àmì ohùn wà níbi tí ó bá yẹ.
