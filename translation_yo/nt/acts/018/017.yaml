id: ACT.18.17
reference: Acts 18:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: yo
  text: Nígbà náà ni gbogbo wọn gbá Sọ́síténè[a], olórí sínágọ́gù, mú; wọ́n sì ń lù ú níwájú ìtẹ́ ìdájọ́. Ṣùgbọ́n Gálíónì kò bìkítà nípa nǹkan wọ̀nyí rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “gbogbo àwọn Gíríìkì” dípò “gbogbo wọn” nìkan. Ìwé-ẹ̀rí àfọwọ́kọ ìbẹ̀rẹ̀ jù lọ ní ọ̀rọ̀ kúkúrú náà, kò sì sọ irú ẹgbẹ́ àwọn ènìyàn náà.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: mú
  rationale: Nínú àyíká ìwà ipá yìí, “mú” túmọ̀ sí pé wọ́n dì í mú tàbí wọ́n gbá a mú; ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ṣàn déédéé.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó pa agbára ọ̀rọ̀ tó túmọ̀ sí “gbogbo” mọ́, kò sì fi irú ẹgbẹ́ tí wọ́n jẹ́ kún ohun tí Gíríìkì kò sọ.
- source_word: ἀρχισυνάγωγον
  choice: olórí sínágọ́gù
  rationale: Ó fi ipò Sọ́síténè gẹ́gẹ́ bí olórí tàbí aláṣẹ sínágọ́gù hàn ní èdè tí òǹkàwé òde òní lè lóye.
- source_word: ἔτυπτον
  choice: wọ́n sì ń lù ú
  rationale: Ìṣe aláìpé Gíríìkì náà lè fi ìṣe tó ń lọ tàbí ìlù léraléra hàn; “ń lù ú” pa ìtumọ̀ yìí mọ́ lọ́nà àdánidá.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: níwájú ìtẹ́ ìdájọ́
  rationale: βῆμα níbí ni ibi gíga tí adájọ́ ti ń gbọ́ ẹjọ́; “ìtẹ́ ìdájọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àyíká òfin náà.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: kò ka nǹkan wọ̀nyí sí
  rationale: Gbólóhùn Yorùbá yìí sọ àìbìkítà Gálíónì jáde láìfi ìmọ̀lára tàbí ìdájọ́ míì tí kò sí nínú orísun kún un.
- source_word: δέ
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú ìtàn hàn lọ́nà Yorùbá tó ṣàn.
- source_word: καί
  choice: Ṣùgbọ́n
  rationale: Bó tilẹ̀ jẹ́ pé καί sábà máa ń túmọ̀ sí “àti,” ó fi ìyàtọ̀ tó wà láàárín ìwà ipá àwọn ènìyàn náà àti àìbìkítà Gálíónì hàn níbí.
theological_decisions:
- issue: Ta ni πάντες (“gbogbo wọn”) ń tọ́ka sí?
  choice: A kò dá irú ẹgbẹ́ náà mọ̀ nínú ọ̀rọ̀ pàtàkì; a túmọ̀ rẹ̀ sí “gbogbo wọn.”
  alternative: “gbogbo àwọn Gíríìkì” tàbí “gbogbo àwọn Júù”
  rationale: Ọ̀rọ̀ Gíríìkì SBLGNT ní πάντες nìkan, kò sì dárúkọ ẹgbẹ́ náà. Àwọn àfọwọ́kọ kan fi “àwọn Gíríìkì” kún un, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ yanjú ohun tí orísun fi sílẹ̀ láìdámọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ, a sì pa orúkọ àti ọ̀rọ̀ àṣà bí “Sọ́síténè,” “Gálíónì,” àti “sínágọ́gù” mọ́ ní ìrísí Yorùbá tó rọrùn láti kà.
