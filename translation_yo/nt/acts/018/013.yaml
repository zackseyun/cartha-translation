  terminology: “Òfin” yẹ kí ó dúró nínú àkọsílẹ̀ pàtàkì, nítorí τὸν νόμον kò sọ ní pàtó pé òfin àwọn Júù ni. Àlàyé ìsàlẹ̀ lè ṣàfihàn àyíká yẹn. Àmì àlàyé gbọdọ̀ wà lẹ́gbẹ̀ẹ́ gbolohun “lòdì sí òfin,” kì í ṣe lẹ́yìn “pé,” kí àwọn mejeeji lè tọ́ka sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
