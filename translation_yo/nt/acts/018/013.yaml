  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: yo
  text: wọ́n ń wí pé, “Ọkùnrin yìí ń yí àwọn ènìyàn lọ́kàn láti jọ́sìn fún Ọlọ́run lòdì sí òfin.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí àwọn tó ń fẹ̀sùn kàn án náà máa tọ́ka sí òfin àwọn Júù, bí ó tilẹ̀ jẹ́ pé “òfin” lásán ni ọ̀rọ̀ Gíríìkì sọ.
    reason: cultural_note
  - marker: b
    text: Tàbí “tí ó tako òfin” tàbí “tí ó rú òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ ìṣe aláìparí náà ń ṣe àfihàn ọ̀rọ̀ ẹ̀sùn tí wọ́n ń sọ; “wọ́n ń wí pé” jẹ́ Yorùbá àdánidá tó sì mú ọ̀rọ̀ tí ó tẹ̀ lé wọlé dáadáa.
- source_word: Παρὰ τὸν νόμον
  choice: ní ọ̀nà tí ó lòdì sí òfin
  rationale: παρά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative túmọ̀ sí ohun tó lòdì sí tàbí tó rú òfin; gbolohun yìí jẹ́ kedere ní Yorùbá, ó sì pa ìrísí ẹ̀sùn ní ilé-ẹjọ́ mọ́.
- source_word: ἀναπείθει
  choice: ń yí … lọ́kàn
  rationale: Ó túmọ̀ sí rírọ ẹnì kan tàbí àwọn ènìyàn láti gba ọ̀nà kan; yí … lọ́kàn kò fi ìtumọ̀ búburú bí “ń tàn wọ́n jẹ” kún ọ̀rọ̀ Gíríìkì.
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka náà mọ́ nínú ẹ̀sùn, láì sọ ọ́ di ọ̀rọ̀ ẹ̀gàn.
- source_word: τοὺς ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: ἀνθρώπους jẹ́ ọ̀rọ̀ gbogbogbò fún ènìyàn níbí, kì í ṣe fún àwọn ọkùnrin nìkan.
- source_word: σέβεσθαι τὸν θεόν
  choice: láti máa sin Ọlọ́run
  rationale: Nínú àyíká ẹ̀sìn yìí, σέβομαι ń tọ́ka sí jíjọ́sìn tàbí sísin Ọlọ́run; “sin Ọlọ́run” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì yé gbogbo ènìyàn.
- source_word: τὸν νόμον
  choice: òfin
  rationale: A kò fi “òfin àwọn Júù” tàbí “òfin wa” sínú àyọkà, nítorí Gíríìkì sọ “òfin” nìkan.
theological_decisions:
- issue: Ohun tí “òfin” ń tọ́ka sí nínú ẹ̀sùn náà
  choice: Fi “òfin” sílẹ̀ láì sọ pé ó jẹ́ òfin àwọn Júù nínú àyọkà pàtàkì.
  alternative: òfin àwọn Júù; òfin wa
  rationale: Àyíká fi hàn pé ó ṣeé ṣe kí àwọn olùfisùn máa tọ́ka sí òfin àwọn Júù, ṣùgbọ́n Gíríìkì kò sọ bẹ́ẹ̀ ní tààrà; àlàyé náà wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἀνθρώπους tó jẹ́ ọ̀rọ̀ gbogbogbò
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ náà kó gbogbo ènìyàn sínú, kì í ṣe akọ nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní ibi tó yẹ. “ń yí àwọn ènìyàn lọ́kàn” pa ìtumọ̀ ìrọ̀gbọ̀kú persuasion mọ́, “máa sin Ọlọ́run” sì jẹ́ ọ̀nà àdánidá láti sọ ìjọsìn ẹ̀sìn. Àwọn àmì àlàyé [a] àti [b] wà nínú àyọkà; [a] tẹ̀ lé “òfin” ní ìtumọ̀ rẹ̀, [b] sì tọ́ka sí àwọn yíyan míì fún gbolohun òfin náà.
