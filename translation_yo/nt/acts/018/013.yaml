  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: ẹ̀sùn ni pé ọkùnrin náà ń yí àwọn ènìyàn lọ́kàn láti bọ̀wọ̀ fún Ọlọ́run ní ọ̀nà tó lòdì sí òfin. Ṣùgbọ́n “ní ọ̀nà tí ó lòdì sí” gùn ju ohun tí Παρὰ τὸν νόμον sọ lọ, “máa” sì lè fi ìmọ̀ ìṣe àṣà tí kò wà nínú infinitive Gíríìkì kún un.'
