source:
  edition: SBLGNT
  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: yo
  text: Ó sì máa ń jíròrò nínú sínágọ́gù ní ọjọ́ ìsinmi gbogbo, ó sì máa ń rọ àwọn Júù àti àwọn Gíríìkì lójú[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ó máa ń bá wọn sọ̀rọ̀” tàbí “ó máa ń jiyàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìjíròrò tí a fi ìdí múlẹ̀ tàbí àríyànjiyàn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ó máa ń gbìyànjú láti rọ wọn lójú.” Fífi ọ̀rọ̀-ìṣe náà sí imperfect lè tẹnu mọ́ ìsapá tí ó ń bá a lọ.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, ó ṣeé ṣe kí wọ́n jẹ́ àwọn Gíríìkì tí ó ní ìbáṣepọ̀ pẹ̀lú sínágọ́gù; àwọn mìíràn lóye rẹ̀ ní ọ̀nà gbígbòòrò sí i gẹ́gẹ́ bí àwọn tí kì í ṣe Júù.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: máa ń bá àwọn ènìyàn jíròrò
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìjíròrò tàbí àríyànjiyàn tí a fi ìdí múlẹ̀; imperfect náà sì fi hàn pé ó jẹ́ iṣẹ́ tí ó ń ṣe léraléra.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ pẹ̀lẹ́ ni δέ níbí, kì í ṣe ìtakora líle; “sì” ń tẹ ìtàn náà síwájú lọ́nà àdánidá.
- source_word: ἐν τῇ συναγωγῇ
  choice: nínú sínágọ́gù
  rationale: Ìtumọ̀ ibi tí ἐν pẹ̀lú dative ní níbí ni a mú jáde ní tààrà.
- source_word: κατὰ πᾶν σάββατον
  choice: ní gbogbo ọjọ́ ìsinmi
  rationale: Èyí fi ìtumọ̀ pínpín ti κατά πᾶν hàn, ó sì bá ìṣe tí ń ṣẹlẹ̀ léraléra mu.
- source_word: ἔπειθέν
  choice: ń yí … lọ́kàn padà
  rationale: πείθω túmọ̀ sí rírọ̀ tàbí yíyan ènìyàn lọ́kàn padà. Imperfect náà ń fi ìṣe tí ń lọ lọ́wọ́ hàn, ṣùgbọ́n kò fúnra rẹ̀ fi dandan sọ pé ìgbìyànjú tí kò yọrí sí rere nìkan ni.
- source_word: Ἰουδαίους
  choice: àwọn Júù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn Júù gẹ́gẹ́ bí ẹgbẹ́ ẹ̀yà àti ẹ̀sìn.
- source_word: Ἕλληνας
  choice: àwọn Gíríìkì
  rationale: A pa ìtumọ̀ pàtó “Gíríìkì” mọ́, dípò fífẹ̀ ẹ́ sí “àwọn Kèfèrí,” nítorí èyí ni ọ̀rọ̀ Gíríìkì náà sọ.
theological_decisions:
- issue: Ta ni Ἕλληνας ń tọ́ka sí ní àyíká sínágọ́gù?
  choice: àwọn Gíríìkì
  alternative: àwọn Kèfèrí; àwọn Gíríìkì tí ń bọ̀wọ̀ fún Ọlọ́run
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ pè wọ́n ní Gíríìkì. Ó ṣeé ṣe kí wọ́n jẹ́ àwọn aláìnídọ̀bálẹ̀ Júù tí wọ́n ní ìbáṣepọ̀ pẹ̀lú sínágọ́gù, ṣùgbọ́n a kò fi ẹ̀ka ẹ̀sìn pàtó kan kún ohun tí ẹsẹ̀ náà sọ.
- issue: Bóyá ἔπειθέν túmọ̀ sí àṣeyọrí tàbí ìgbìyànjú
  choice: ń yí … lọ́kàn padà
  alternative: ń gbìyànjú láti yí … lọ́kàn padà
  rationale: Imperfect ń ṣàpèjúwe ìṣe tí ń tẹ̀ síwájú tàbí tí ń ṣẹlẹ̀ léraléra; kò dandan túmọ̀ sí pé kò ṣàṣeyọrí. Àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ àṣàyàn kejì láìfi í sínú ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. “Máa ń” àti “ń” ń fi ìṣe léraléra/tí ń bá a lọ hàn. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀, àti “ọjọ́ ìsinmi” fún Sabbath.
