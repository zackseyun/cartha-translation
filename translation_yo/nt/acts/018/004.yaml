  naturalness: “Ó sì máa ń jíròrò” jẹ́ Yorùbá ìgbàlódé, ó sì yẹ fún διελέγετο láìfi olùgbọ́ kan tí ẹsẹ̀ náà kò mẹ́nu kàn síi. “Máa ń rọ ... lójú” jẹ́ ọ̀nà adayeba láti sọ ìfẹ́ láti yí ènìyàn lójú.
  terminology: A pa “sínágọ́gù,” “àwọn Júù,” àti “àwọn Gíríìkì” mọ́. A yí “àwọn Kèfèrí” nínú àlàyé ìsàlẹ̀ padà sí “àwọn tí kì í ṣe Júù,” èyí tí ó jẹ́ ọ̀rọ̀ ìgbàlódé tí kì í ní ìró àbùkù, láìfẹ̀ ẹ̀rí ẹsẹ̀ náà.
