id: ACT.18.15
reference: Acts 18:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: yo
  text: Ṣùgbọ́n bí àwọn wọ̀nyí bá jẹ́ ìbéèrè nípa ọ̀rọ̀ kan[a], àwọn orúkọ, àti òfin yín fúnra yín, ẹ̀yin fúnra yín ni kí ẹ bójú tó wọn; èmi kò fẹ́ ṣe onídàájọ́ àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn kan” tàbí “ẹ̀kọ́.” Ọ̀rọ̀ Giriki náà, λόγος, ní ìtumọ̀ gbòòrò, ó sì lè tọ́ka sí ẹ̀kọ́ tí àríyànjiyàn wà lórí rẹ̀ tàbí sí ọ̀nà tí a fi ń pe ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: ìbéèrè
  rationale: Ó túmọ̀ sí àwọn ọ̀ràn tí a ń wádìí tàbí tí àríyànjiyàn wà lórí wọn. “Ìbéèrè” pa ìrísí ọ̀ràn ìdájọ́ náà mọ́ láì fi dandan sọ pé wọ́n jẹ́ awuyewuye líle.
- source_word: περὶ λόγου
  choice: nípa ọ̀rọ̀ kan
  rationale: λόγος ní ìtumọ̀ gbòòrò, ó lè tọ́ka sí ọ̀rọ̀, ìhìn, ẹ̀kọ́, tàbí ọ̀nà ìsọ̀rọ̀. “Ọ̀rọ̀ kan” sún mọ́ Giriki, ó sì pa àìdánilójú rẹ̀ mọ́; àlàyé ẹsẹ̀ fi àwọn ìtumọ̀ míì hàn.
- source_word: ὀνομάτων
  choice: àwọn orúkọ
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì jẹ́ kí ohun tí àwọn orúkọ tàbí oyè náà ń tọ́ka sí ṣì ṣí sílẹ̀ bí ó ti rí nínú Giriki.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: òfin tiyín fúnra yín
  rationale: Ó fi hàn pé Gálíónì ka òfin náà sí ti àwọn Júù, kì í ṣe ọ̀ràn abẹ́ òfin Róòmù. “Tiyín fúnra yín” tún mú ìjìnnà tí ó fi sí ọ̀ràn náà jáde.
- source_word: ὄψεσθε αὐτοί
  choice: ẹ̀yin fúnra yín ni kí ẹ bójú tó wọn
  rationale: Ọ̀rọ̀ náà jẹ́ ìlò àṣà fún “ẹ bójú tó” tàbí “ẹ ṣe ìtọ́jú ọ̀ràn náà”; “ẹ̀yin fúnra yín” pa ìtẹnumọ́ αὐτοί mọ́. Ìtumọ̀ Yorùbá yìí lo àṣẹ oníwà pẹ̀lẹ́ nítorí pé èyí ni ipa ọjọ́-ọ̀la Giriki náà nínú àyíká yìí.
- source_word: κριτὴς
  choice: onídàájọ́
  rationale: Ó bá àyíká ilé-ẹjọ́ mu, ó sì túmọ̀ ipa ẹni tí ń dá ọ̀ràn bẹ́ẹ̀ lájọ́.
- source_word: τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí gbogbo àwọn ọ̀ràn tí a ṣẹ̀ṣẹ̀ dárúkọ, láì dín ìtúmọ̀ rẹ̀ kù.
- source_word: οὐ βούλομαι εἶναι
  choice: èmi kò fẹ́ ṣe
  rationale: Ó sọ ìfẹ́ tàbí àìfẹ́ ẹni náà ní èdè Yorùbá àdánidá, láì mú un le ju Giriki lọ bí ẹni pé ó ṣe ìkéde òfin gidi kan.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ λόγος nínú bí Gálíónì ṣe kọ̀ láti dá ọ̀ràn náà
  choice: “ọ̀rọ̀ kan” ni a lò, pẹ̀lú àlàyé ẹsẹ̀ fún àwọn ìtumọ̀ míì.
  alternative: “ìhìn kan,” “ẹ̀kọ́,” tàbí “ìlànà ẹ̀kọ́”
  rationale: Àyọkà kò ṣàlàyé ohun pàtó tí λόγος ń tọ́ka sí. Yíyan ọ̀rọ̀ gbòòrò àti àlàyé ẹsẹ̀ pa àìdánilójú àti ìfẹ̀sùn tó wà láàárín àwọn Júù mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀, nítorí Gálíónì ń bá ẹgbẹ́ àwọn olùfisùn sọ̀rọ̀; “ẹ̀yin fúnra yín” pa ìtẹnumọ́ orísun mọ́.
