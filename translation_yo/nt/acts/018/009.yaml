id: ACT.18.9
reference: Acts 18:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: yo
  text: Olúwa sì sọ fún Paulu ní òru nípasẹ̀ ìran[a] pé, “Má bẹ̀rù, ṣùgbọ́n máa sọ̀rọ̀, má sì dákẹ́,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ìran.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà pé “nípasẹ̀ ìran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Orúkọ oyè Yorùbá yìí bá ‘the Lord’ mu, ó sì pa ìtọ́kasí Gíríìkì mọ́ láì fi ‘Jésù’ kún un.
- source_word: ἐν νυκτὶ
  choice: ní òru
  rationale: Ó jẹ́ gbólóhùn àkókò tí ó ṣe déédéé àti ti ẹ̀dá ní Yorùbá.
- source_word: δι’ ὁράματος
  choice: nípasẹ̀ ìran
  rationale: ‘Nípasẹ̀’ ṣe àfihàn διά pẹ̀lú ọ̀rọ̀-orúkọ olùní gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; ‘ìran’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ὅραμα.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Èèwọ̀ yìí jẹ́ ti ẹ̀dá, ó sì ṣe àfihàn ìtumọ̀ pé kí Paulu má ṣe wà nínú ìbẹ̀rù.
- source_word: ἀλλὰ λάλει
  choice: ṣùgbọ́n máa sọ̀rọ̀
  rationale: ‘Máa sọ̀rọ̀’ mú ìṣe tí ń bá a lọ nínú àṣẹ alásìkò-ìsinsìnyí λάλει jáde.
- source_word: καὶ μὴ σιωπήσῃς
  choice: má sì dákẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì lágbára láti sọ èèwọ̀ náà, ó sì bá àṣẹ tó ṣáájú mu.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A túmọ̀ ὁ κύριος sí ‘Olúwa’ nìkan.
  alternative: ‘Jésù Olúwa’ tàbí ‘Olúwa Jésù’
  rationale: Nínú Ìṣe Àwọn Aposteli, ó ṣeé ṣe gidigidi kí ó tọ́ka sí Jésù tó jíǹde, ṣùgbọ́n Gíríìkì kò fi orúkọ Jésù kún un níbí. Fífi oyè náà sílẹ̀ bó ṣe rí ń pa ìwọ̀n ọ̀rọ̀ àti agbára ẹ̀kọ́ nípa Kristi mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn kíkún níbi tí ó ti bá ẹ̀dá mu; èdè náà lọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. ‘Nípasẹ̀ ìran’ pa ìtumọ̀ ọ̀nà ohun èlò mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní àṣàyàn ‘nínú ìran.’
