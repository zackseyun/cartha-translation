translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. A lo “iṣẹ́ ọwọ́” fún iṣẹ́ ọnà/òòjọ́, “ṣíṣe àgọ́” sì pa ìtumọ̀ àkọ́kọ́ mọ́; àlàyé ìsàlẹ̀ ojú ìwé ni ó tọ́ka sí ìtumọ̀ tó gbòòrò sí i.
