base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: yo
  text: Níwọ̀n bí iṣẹ́ ọwọ́ wọn ṣe jọra, ó ń gbé lọ́dọ̀ wọn, ó sì ń ṣiṣẹ́; nítorí iṣẹ́ ṣíṣe àgọ́ ni iṣẹ́ ọwọ́ wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe kí ọ̀rọ̀ náà túmọ̀ sí àwọn tí ń ṣiṣẹ́ pẹ̀lú awọ ẹran; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn tó ń ṣe àgọ́ tàbí àwọn tó ń ṣiṣẹ́ nínú iṣẹ́ awọ tí ó ní í ṣe pẹ̀lú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: Níwọ̀n bí òun náà ti ń ṣe irú iṣẹ́ ọwọ́ kan náà
  rationale: Ìtumọ̀ yìí fi ìdí tí Paulu fi dúró lọ́dọ̀ wọn hàn, ó sì pa èrò pé iṣẹ́ ọwọ́ kan náà ni wọ́n mọ̀ mọ́ láì sọ irú iṣẹ́ náà ṣáájú àkókò.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: ó dúró lọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún gbígbé tàbí ṣíṣe àtìpó pẹ̀lú ẹnì kan ní àyíká ìtàn yìí.
- source_word: ἠργάζετο
  choice: ó sì ń ṣiṣẹ́ pẹ̀lú wọn
  rationale: Àmì “ń” fi ìṣe tí ó ń bá a lọ hàn gẹ́gẹ́ bí imperfect Gíríìkì; “pẹ̀lú wọn” ṣe àjọṣe iṣẹ́ náà kedere nínú èdè Yorùbá.
- source_word: σκηνοποιοὶ
  choice: iṣẹ́ ṣíṣe àgọ́
  rationale: Èyí ni ìtumọ̀ tí ó wọ́pọ̀ jù lọ fún σκηνοποιός, ó sì yàgò fún ọ̀rọ̀ àjèjì tí òǹkàwé lasán lè má lóye.
- source_word: τῇ τέχνῃ
  choice: iṣẹ́ ... ni wọ́n ń ṣe
  rationale: Ìṣètò yìí sọ pé èyí ni iṣẹ́-òòjọ́ wọn ní Yorùbá àdánidá, kì í ṣe ohun tí wọ́n ṣe lẹ́ẹ̀kan ṣoṣo.
