  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: yo
  text: Júù kan tí orúkọ rẹ̀ ń jẹ́ Àpólò, ọmọ ìbílẹ̀ Alẹkisáńdíríà, jẹ́ ọkùnrin tó jáfáfá nínú ọ̀rọ̀ sísọ̀[a]. Ó dé Éfésù, ó sì ní ìmọ̀ Ìwé Mímọ́ tó jinlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin onímọ̀.” Ọ̀rọ̀ Gíríìkì λόγιος lè túmọ̀ sí ẹni tó jáfáfá nínú ọ̀rọ̀ sísọ tàbí ẹni tó ní ẹ̀kọ́ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹ̀yà àti ẹ̀sìn Àpólò, kì í ṣe pé ó kàn jẹ́ ọmọ ilẹ̀ Jùdíà.
- source_word: δέ
  choice: A kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀; ìbẹ̀rẹ̀ gbólóhùn tuntun ló gbé ìyípadà ìtàn náà
  rationale: δέ jẹ́ àmì ìyípadà nínú ìtàn níbí; fífi “nígbà náà” tàbí “ṣùgbọ́n” kún un lè fi ìtumọ̀ àkókò tàbí ìtakora tí kò lágbára nínú Gíríìkì wọlé.
- source_word: τις
  choice: kan
  rationale: “Júù kan” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ẹni tuntun tí a kò tíì dá mọ̀ dáadáa hàn.
- source_word: Ἀπολλῶς ὀνόματι
  choice: tí orúkọ rẹ̀ ń jẹ́ Àpólò
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún fífi orúkọ ẹni tí ìtàn ṣẹ̀ṣẹ̀ mẹ́nu kàn hàn.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: Ọmọ ìbílẹ̀ Alẹkisáńdíríà
  rationale: Ó sọ ibi ìbí tàbí ìpilẹ̀ṣẹ̀ rẹ̀ láì lo ọ̀rọ̀ tó lè dà bí ìpín ẹ̀yà-ara ní èdè òde òní.
- source_word: ἀνὴρ λόγιος
  choice: ọkùnrin tó já fáfá nínú ọ̀rọ̀ sísọ̀
  rationale: “Ọkùnrin” pa ìtọ́kasí akọ mọ́; gbolohun yòókù gbé ìtumọ̀ “olóhùn-ún-sọ” ti λόγιος jáde, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ “onímọ̀” mọ́.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: Ó dé Éfésù
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé ó dé ibi tí ó ń lọ; èyí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: ó sì ní ìmọ̀ Ìwé Mímọ́ tó jinlẹ̀
  rationale: Èyí sọ agbára àti ìjáfáfá rẹ̀ nínú àwọn Ìwé Mímọ́ ní Yorùbá tó ṣe kedere, dípò gbolohun líle bí “ó lágbára nínú Ìwé Mímọ́.”
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pín ọ̀rọ̀ náà sí gbólóhùn mẹ́ta kí àkójọpọ̀ àpèjúwe Gíríìkì lè ṣe kedere fún òǹkàwé Yorùbá, láì yí ìbáṣepọ̀ àwọn èrò inú ẹsẹ náà padà.
