id: ACT.18.22
reference: Acts 18:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ̀ kalẹ̀ sí Kesarea,[a] ó gòkè lọ, ó sì kí ìjọ náà; lẹ́yìn náà, ó sọ̀ kalẹ̀ sí Antioku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí “ìjọ náà” túmọ̀ sí ìjọ tó wà ní Jerusalẹmu. Ọ̀pọ̀ ìtumọ̀ Bíbélì sọ Jerusalẹmu ní gbangba níbí, ṣùgbọ́n a kò dárúkọ rẹ̀ nínú ọ̀rọ̀ Gíríìkì.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: Lẹ́yìn tí ó sọ̀ kalẹ̀
  rationale: Ó fi hàn pé ìṣe yìí ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì pa èdè ìrìn-àjò àti ìtọ́sọ́nà Luku mọ́.
- source_word: Καισάρειαν
  choice: Kesarea
  rationale: Ìkọ̀wé orúkọ ibìkan náà ní ọ̀nà tí ó bá ìlò Yorùbá mu; ọ̀rọ̀ yìí ń tọ́ka sí Kesarea etíkun.
- source_word: ἀναβὰς
  choice: ó gòkè lọ
  rationale: Ó pa ìtumọ̀ ìtọ́sọ́nà mọ́ láì fi Jerusalẹmu kún ọ̀rọ̀ Gíríìkì, nítorí a kò dárúkọ ibi tí ó gòkè lọ sí.
- source_word: ἀσπασάμενος
  choice: ó sì kí
  rationale: Ìtumọ̀ tààrà, tí ó sì bá àyíká ìbẹ̀wò sí àwùjọ àwọn onígbàgbọ́ mu.
- source_word: τὴν ἐκκλησίαν
  choice: ìjọ náà
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwùjọ Kristẹni mu; àmì ìdámọ̀ náà fi hàn pé ìjọ kan pàtó ni.
- source_word: κατέβη
  choice: ó sọ̀ kalẹ̀
  rationale: Ó pa èdè ìtọ́sọ́nà àti àwòrán ilẹ̀ inú ìtàn Luku mọ́.
- source_word: Ἀντιόχειαν
  choice: Antioku
  rationale: Ìkọ̀wé orúkọ ibìkan náà gẹ́gẹ́ bí ó ṣe wọ́pọ̀ ní Yorùbá; ní àyíká yìí, Antioku ti Siria ni.
theological_decisions:
- issue: Bóyá kí a sọ Jerusalẹmu ní gbangba gẹ́gẹ́ bí ibi tí ó “gòkè lọ” sí
  choice: A kò sọ ibi náà ní gbangba nínú ọ̀rọ̀ pàtàkì.
  alternative: “ó gòkè lọ sí Jerusalẹmu”
  rationale: Ìtòlẹ́sẹẹsẹ ìrìn-àjò náà lè tọ́ka sí Jerusalẹmu, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò dárúkọ rẹ̀. Ìtumọ̀ náà pa àìsọ pàtó inú orísun mọ́, ó sì ṣàlàyé ohun tí ó ṣeé ṣe jù lọ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóore-ọ̀fẹ́, tó ṣe kedere fún òǹkàwé òde òní. A pa ọ̀rọ̀ ìtọ́sọ́nà “sọ̀ kalẹ̀/gòkè lọ” mọ́, a sì fi àmì ohùn sí ibi tí ó bá ìlò àdánidá mu.
