  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: yo
  text: Nígbà tí ó sì fẹ́ láti kọjá lọ sí Akaia, àwọn arákùnrin[a] fún un níṣìírí, wọ́n sì kọ̀wé sí àwọn ọmọ-ẹ̀yìn pé kí wọ́n tẹ́wọ́ gbà á. Nígbà tí ó dé, ó ran àwọn tí wọ́n ti gbàgbọ́ nípasẹ̀ oore-ọ̀fẹ́ lọ́wọ́ gidigidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” lè tọ́ka sí àwùjọ àwọn onígbàgbọ́ lápapọ̀, títí kan àwọn obìnrin, bó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀ akọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ oore-ọ̀fẹ́, ó ran àwọn tí wọ́n ti gbàgbọ́ lọ́wọ́ gidigidi.” A lè so gbólóhùn Gíríìkì náà, “nípasẹ̀ oore-ọ̀fẹ́,” mọ́ ìrànlọ́wọ́ Apọ́lọ́sì dípò fífi í mọ́ bí àwọn ènìyàn náà ṣe wá gbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Nígbà tí ó sì fẹ́
  rationale: Ó sọ ipò ìfẹ́ Apọ́lọ́sì ní ọ̀nà Yorùbá tó ṣe déédé, ó sì pa ìtumọ̀ voluntive ti βούλομαι mọ́.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: rékọjá lọ sí Akaia
  rationale: “Rékọjá lọ” fi ìrìnàjò láti Ẹ́fésù kọjá sí agbègbè Akaia hàn, dípò “lọ” lásán.
- source_word: προτρεψάμενοι
  choice: fún un níṣìírí
  rationale: Ìsọ yìí dára fún ìṣírí àti ìtìlẹ́yìn rere tí ọ̀rọ̀ náà túmọ̀ sí ní àyíká yìí.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Ó pa ọ̀rọ̀ akọ púpọ̀ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí pé ó lè ní gbogbo àwùjọ àwọn onígbàgbọ́ nínú.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: wọ́n sì kọ̀wé sí àwọn ọmọ-ẹ̀yìn
  rationale: Ó túmọ̀ γράφω pẹ̀lú dative ní tààrà, ó sì pa μαθηταί mọ́ gẹ́gẹ́ bí “àwọn ọmọ-ẹ̀yìn.”
- source_word: ἀποδέξασθαι αὐτόν
  choice: pé kí wọ́n kí i káàbọ̀
  rationale: Ìsọ Yorùbá yìí sọ ìtẹ́wọ́gbà àti àlejò rere tí ἀποδέχομαι ní ní àyíká náà.
- source_word: ὃς παραγενόμενος
  choice: Nígbà tí ó dé
  rationale: Ó ṣe àfihàn ìbátan àkókò náà ní Yorùbá adayeba, ẹni tí a ń tọ́ka sí sì ṣì jẹ́ Apọ́lọ́sì.
- source_word: συνεβάλετο πολὺ
  choice: ó ran ... lọ́wọ́ gidigidi
  rationale: Ó sọ ìrànlọ́wọ́ tó pọ̀ tí Apọ́lọ́sì ṣe ní ọ̀nà tó ṣe kedere, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: τοῖς πεπιστευκόσιν
  choice: àwọn tí ó ti gbàgbọ́
  rationale: “Ó ti gbàgbọ́” pa perfect aspect mọ́, ó ń tọ́ka sí ìgbàgbọ́ tí wọ́n ti dé sí tẹ́lẹ̀.
- source_word: διὰ τῆς χάριτος
  choice: nípa oore-ọ̀fẹ́
  rationale: Ó pa ọ̀nà tàbí ohun èlò tí διά pẹ̀lú genitive ń tọ́ka sí mọ́, láì fi “Ọlọ́run” kún ọ̀rọ̀ tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Ohun tí διὰ τῆς χάριτος so mọ́
  choice: A so “nípa oore-ọ̀fẹ́” mọ́ “àwọn tí ó ti gbàgbọ́.”
  alternative: 'A lè so ó mọ́ ìrànlọ́wọ́ Apọ́lọ́sì: “nípa oore-ọ̀fẹ́, ó ran àwọn tí ó ti gbàgbọ́ lọ́wọ́ gidigidi.”'
  rationale: Ìtò ọ̀rọ̀ àti àyíká ṣe àtìlẹ́yìn díẹ̀ sí i fún pé oore-ọ̀fẹ́ ni ọ̀nà tí wọ́n fi wá gbàgbọ́. Síbẹ̀, Gíríìkì ní àìdánilójú gidi, nítorí náà a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tó bá yẹ. “Kí i káàbọ̀” jẹ́ ọ̀nà adayeba fún ìtẹ́wọ́gbà, “fún un níṣìírí” sì yẹra fún èdè ìlànà tó le ju àyíká náà lọ.
