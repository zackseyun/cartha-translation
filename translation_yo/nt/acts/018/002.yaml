  terminology: ‘Júù/àwọn Júù’ bá àyíká ẹ̀yà-ẹ̀sìn mu. ‘Ọmọ ìbílẹ̀ Pọ́ńtù,’ ‘ti pàṣẹ,’ àti ‘ó lọ bá wọn’ jẹ́ àwọn yíyan tó péye. Àlàyé ẹsẹ̀ náà tọ́jú aṣayan ‘lé ... jáde’ gẹ́gẹ́ bí ìtumọ̀ mìíràn, kò sì gbé e kalẹ̀ gẹ́gẹ́ bí ìtumọ̀ pàtàkì.
