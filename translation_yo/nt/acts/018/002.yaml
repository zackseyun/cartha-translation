id: ACT.18.2
reference: Acts 18:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: yo
  text: Ó sì rí Júù kan tí orúkọ rẹ̀ ń jẹ́ Ákílà, ọmọ ìbílẹ̀ Pọ́ńtù, ẹni tí ó ṣẹ̀ṣẹ̀ dé láti Ítálì pẹ̀lú Pírísílà aya rẹ̀, nítorí pé Kíláúdíù ti pàṣẹ fún gbogbo àwọn Júù láti kúrò ní Róòmù[a]; ó sì lọ bá wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lé gbogbo àwọn Júù jáde kúrò ní Róòmù.” Ọ̀rọ̀ Gíríìkì náà, ní tààrà, ń sọ pé kí wọn yapa kúrò ní Róòmù; ọ̀rọ̀ inú ẹsẹ̀ lo Yorùbá àdánidá, “láti kúrò ní Róòmù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: rí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Pọ́ọ̀lù rí ẹni náà, ó sì ṣí ọ̀nà fún ìṣe tó tẹ̀ lé e nínú ìtàn.
- source_word: τινα Ἰουδαῖον
  choice: Júù kan
  rationale: Èyí fi ọkùnrin kan hàn gẹ́gẹ́ bí ọmọ ẹgbẹ́ àwọn Júù, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ àìlópin τις.
- source_word: ὀνόματι Ἀκύλαν
  choice: tí orúkọ rẹ̀ ń jẹ́ Ákílà
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún fífi orúkọ ẹni kan hàn.
- source_word: Ποντικὸν τῷ γένει
  choice: ọmọ ìbílẹ̀ Pọ́ńtù
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí ibi tí Ákílà ti wá tàbí ibi ìbí rẹ̀; ‘ọmọ ìbílẹ̀’ sọ èyí ní kedere.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: ẹni tí ó ṣẹ̀ṣẹ̀ dé láti Ítálì
  rationale: ‘Ṣẹ̀ṣẹ̀ dé’ pa ìtumọ̀ dídé láìpẹ́ mọ́, nígbà tí gbólóhùn àsopọ̀ náà mú ìbáṣepọ̀ rẹ̀ pẹ̀lú Ákílà ṣe kedere.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: pẹ̀lú Pírísílà aya rẹ̀
  rationale: ‘Pẹ̀lú’ fi hàn lọ́nà àdánidá pé Pírísílà bá Ákílà dé láti Ítálì.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: nítorí pé Kíláúdíù ti pàṣẹ
  rationale: διά pẹ̀lú infinitive oní article ń sọ ìdí; διατάσσω níbí jẹ́ àṣẹ olórí ìjọba.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: fún gbogbo àwọn Júù láti kúrò ní Róòmù
  rationale: ‘Kúrò ní Róòmù’ jẹ́ Yorùbá tó ṣe kedere, ó sì pa èrò ìyapa kúrò ní Róòmù mọ́ láìfi ìtumọ̀ lílé wọn jáde kún ọ̀rọ̀ Gíríìkì.
- source_word: προσῆλθεν αὐτοῖς
  choice: ó sì lọ bá wọn
  rationale: Èyí sọ ìlọsí-ọ̀dọ̀ wọn ní Yorùbá ìtàn tó rọrùn, tó sì bá ìṣípò nínú àyíká ọ̀rọ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖον / Ἰουδαίους
  choice: Júù / àwọn Júù
  alternative: ọmọ Jùdíà / àwọn ọmọ Jùdíà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn Júù tó ń gbé ní Róòmù, kì í ṣe kìkì àwọn olùgbé ilẹ̀ Jùdíà.
- issue: Bí a ṣe túmọ̀ χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: láti kúrò ní Róòmù
  alternative: kí a lé wọn jáde kúrò ní Róòmù
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìyapa kúrò ní Róòmù ní tààrà; lílé wọn jáde ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ àṣẹ náà, ṣùgbọ́n ó lágbára ju ọ̀rọ̀ inú ẹsẹ̀ lọ.
translation_notes:
  register: 'Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo àwọn fọ́ọ̀mù orúkọ tó wọ́pọ̀ nínú Yorùbá: Ákílà, Pọ́ńtù, Ítálì, Pírísílà, Kíláúdíù, àti Róòmù. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé, kì í ṣe lẹ́yìn orúkọ Ákílà.'
