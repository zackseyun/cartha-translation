translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ìtòlẹ́sẹẹsẹ gbólóhùn tó jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìrísí Gíríìkì tó ṣe gẹ́gẹ́ bí ọ̀rọ̀ mọ́.
