  text: After this[a], he left Athens and went to Corinth.
translation:
  language: yo
  text: Lẹ́yìn èyí[a], ó kúrò ní Atẹni, ó sì lọ sí Kọ́rinti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ ìrísí Gíríìkì: “Lẹ́yìn àwọn nǹkan wọ̀nyí, lẹ́yìn tí ó ti kúrò ní Atẹni, ó wá sí Kọ́rinti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn èyí
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì pa ìtẹ̀síwájú àkókò inú Gíríìkì mọ́.
- source_word: χωρισθεὶς
  choice: ó kúrò
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist passive ní ìrísí, ṣùgbọ́n níbí ó túmọ̀ sí kíkúrò ní ibi kan. ‘Ó kúrò’ sọ ìtumọ̀ náà ní Yorùbá tó ṣe kedere láìfi passive tí kò bá èdè mu wọ̀ ọ́.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: ní Átẹ́nsì
  rationale: 'ἐκ fi ibi tí ó ti kúrò hàn. Pẹ̀lú ‘kúrò,’ Yorùbá máa ń lo ‘ní’ fún ibi náà: ‘kúrò ní Átẹ́nsì.’'
- source_word: ἦλθεν
  choice: ó lọ
  rationale: Bó tilẹ̀ jẹ́ pé ἔρχομαι lè túmọ̀ sí ‘wá,’ ojú ìwòye ìrìn-àjò inú ìtàn yìí mú kí ‘lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó bá àyíká mu jù.
- source_word: εἰς Κόρινθον
  choice: sí Kọ́ríńtì
  rationale: εἰς tọ́ka sí ibi tí ìrìn-àjò ń lọ; ‘sí Kọ́ríńtì’ ni ìtumọ̀ Yorùbá tó ṣe déédéé.
