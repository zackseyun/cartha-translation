  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n ń tako, tí wọ́n sì ń sọ̀rọ̀-òdì,[a] ó gbọn aṣọ rẹ̀, ó sì wí fún wọn pé, “Ẹ̀jẹ̀ yín wà lórí orí yín![b] Èmi kò jẹ̀bi. Láti ìsinsìnyí lọ, èmi yóò lọ sọ́dọ̀ àwọn tí kì í ṣe Júù.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n sì ń sọ̀rọ̀ ẹ̀gàn” tàbí “tí wọ́n sì ń sọ̀rọ̀ tí ń tàbùkù sí ohun mímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ búburú sí ènìyàn tàbí sí ohun mímọ́.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ̀jẹ̀ yín wà lórí orí yín” jẹ́ òwe tó túmọ̀ sí pé àwọn fúnra wọn ni yóò ru ojúṣe àbájáde ohun tí wọ́n ṣe.
    reason: cultural_note
  - marker: c
    text: Ní ti gidi, “àwọn orílẹ̀-èdè”; níhìn-ín ó ń tọ́ka sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: ń tako ọ̀rọ̀ rẹ̀
  rationale: Ó fi ìtakò wọn sí iṣẹ́ ìwàásù Paulu hàn ní Yorùbá àdánidá; ‘ọ̀rọ̀ rẹ̀’ ṣàlàyé ohun tí wọ́n ń tako láì sọ pé Paulu fúnra rẹ̀ nìkan ni wọ́n dojú kọ.
- source_word: βλασφημούντων
  choice: ń sọ̀rọ̀-òdì
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ tó ń tàbùkù sí ohun mímọ́. ‘Sọ̀rọ̀-òdì’ pa ààyè ìtumọ̀ náà mọ́ láì fi ohun tí a kò sọ ní Gíríìkì kún un.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: ó gbọn aṣọ rẹ̀ sí wọn
  rationale: Ó pa ìṣe àmì ìyapa àti ẹ̀rí sí wọn mọ́, ó sì jẹ́ ọ̀nà tí ó ṣeé lóye ní Yorùbá.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Ẹ̀jẹ̀ yín wà lórí yín fúnra yín
  rationale: Ó ṣe àfihàn òwe ìdájọ́ náà ní Yorùbá tí ó ṣeé lóye, tí ó sì tọ́ka pé ojúṣe àbájáde wà lọ́wọ́ wọn.
- source_word: καθαρὸς ἐγώ
  choice: Èmi kò jẹ̀bi
  rationale: ‘Kò jẹ̀bi’ mú ìtumọ̀ àfiwé ti jíjẹ́ mímọ́ kúrò nínú ẹ̀bi tàbí ojúṣe jáde lọ́nà àdánidá.
- source_word: ἀπὸ τοῦ νῦν
  choice: Láti ìsinsìnyí lọ
  rationale: Ó fi ìyípadà pàtàkì láti àkókò yìí lọ hàn ní Yorùbá òde òní.
- source_word: εἰς τὰ ἔθνη
  choice: sọ́dọ̀ àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká sínágọ́gù yìí, ἔθνη ń tọ́ka sí àwọn aláìní ìran Júù; gbolohun yìí ṣe kedere ju ‘àwọn orílẹ̀-èdè’ lọ.
- source_word: πορεύσομαι
  choice: èmi yóò lọ
  rationale: Ó túmọ̀ èrò ìrìn-àjò àti iṣẹ́ Paulu lọ́nà tó rọrùn, tó sì bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ gbolohun ojúṣe pé ‘Ẹ̀jẹ̀ yín wà lórí yín fúnra yín’
  choice: Ìkéde pé àwọn olùgbọ́ ni yóò ru ojúṣe àbájáde ìkọ̀sílẹ̀ ìhìn náà, kì í ṣe Paulu.
  alternative: Kí a kà á sí ègún líle tí Paulu ń pè sórí wọn.
  rationale: Gbolohun náà bá èdè Bíbélì nípa olùṣọ́ àti ojúṣe mu. A pa òwe náà mọ́ láì sọ ọ́ di ègún tó lágbára ju ohun tí ọ̀rọ̀ Gíríìkì ń béèrè lọ.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, òde òní, tí ó ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa ìdíwọ̀n ọ̀rọ̀ Gíríìkì mọ́ ní βλασφημούντων nípasẹ̀ àlàyé ẹsẹ̀ ìsàlẹ̀, a sì yàgò fún fífi ohun tí ọ̀rọ̀ náà kò sọ ní kedere kún un.
