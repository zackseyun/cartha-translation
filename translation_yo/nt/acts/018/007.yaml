  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: yo
  text: Ó sì kúrò níbẹ̀, ó wọ ilé ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Títíù Jústù, ẹni tí ó ń jọ́sìn Ọlọ́run[a]. Ilé rẹ̀ sì kàn mọ́ sínágọ́gù náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ẹni tí ó bẹ̀rù Ọlọ́run” tàbí “olùjọ́sìn Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ẹni tí ó ń bọ̀wọ̀ fún Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí, “ilé rẹ̀ wà lẹ́gbẹ̀ẹ́ sínágọ́gù náà” tàbí “ilé rẹ̀ àti sínágọ́gù náà pín ààlà kan náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Ó sì kúrò níbẹ̀
  rationale: Ó sọ ìṣípò kúrò ní ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì mú ìtẹ̀lé ìṣẹ̀lẹ̀ inú participle aorist náà jáde ní Yorùbá àdánidá.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: ó wọ ilé ọkùnrin kan
  rationale: ‘Wọ ilé’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún lílọ sínú ilé; ‘ọkùnrin kan’ sì fi àìdánimọ̀ τινός hàn láìlo ọ̀rọ̀ líle.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: tí orúkọ rẹ̀ ń jẹ́ Títíù Jústù
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni, pẹ̀lú àkọsílẹ̀ ohùn Yorùbá fún orúkọ Gíríìkì náà.
- source_word: σεβομένου τὸν θεόν
  choice: ẹni tí ó ń jọ́sìn Ọlọ́run
  rationale: ‘Ń jọ́sìn Ọlọ́run’ sọ ìfọkànsìn rẹ̀ sí Ọlọ́run Ísírẹ́lì ní kedere láìfi orúkọ ẹ̀ka àwùjọ kan tí Gíríìkì kò sọ ní tààrà kún un.
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: ilé rẹ̀ sì wà lẹ́gbẹ̀ẹ́ sínágọ́gù náà
  rationale: Ó jẹ́ Yorùbá tó rọrùn, tó sì dá ìsúnmọ́ra tàbí ààlà tí àwọn ilé méjèèjì pín hàn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó péye jù mọ́.
theological_decisions:
- issue: Ìtumọ̀ σεβόμενος τὸν θεόν nípa Títíù Jústù
  choice: ẹni tí ó ń jọ́sìn Ọlọ́run
  alternative: ẹni tí ó bẹ̀rù Ọlọ́run; olùjọ́sìn Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ẹni aláìnílàárí Júù tó fi ara rẹ̀ fún Ọlọ́run Ísírẹ́lì, ṣùgbọ́n kò pọn dandan kí a sọ ọ́ di orúkọ ẹ̀ka ìsìn kan nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì yà àwọn gbolohun méjì pẹ̀lú àmì àbọ̀-dáwọ́-dúró láti jẹ́ kí ìbátan ‘ilé rẹ̀’ mọ́ Títíù Jústù ṣe kedere.
