id: ACT.18.25
reference: Acts 18:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: yo
  text: A ti kọ́ ọkùnrin yìí ní ọ̀nà Olúwa, ó sì ń sọ̀rọ̀ pẹ̀lú ìtara nínú ẹ̀mí[a], ó sì ń kọ́ni ní ìpéye nípa àwọn ohun tó kan Jésù, ó mọ̀ nípa ìbatisí Jòhánù nìkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “pẹ̀lú ìtara nínú Ẹ̀mí Mímọ́.” Ní ìtumọ̀ yìí, ‘ẹ̀mí’ lè tọ́ka sí Ẹ̀mí Mímọ́ dípò ẹ̀mí inú Apọ́lọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: ti gba ẹ̀kọ́
  rationale: Ó fi hàn pé a ti kọ́ ọ ní ẹ̀kọ́ tẹ́lẹ̀, tí àbájáde ẹ̀kọ́ náà sì ń bá a lọ; ó tún yẹra fún lílo ọ̀rọ̀ ìjọ tó ní ìtumọ̀ àkànṣe.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: ọ̀nà Olúwa
  rationale: Ó pa àkànlò èdè àwọn Kristẹni ìjímìjí, ‘ọ̀nà,’ mọ́, ó sì tú κύριος sí ‘Olúwa.’
- source_word: ζέων τῷ πνεύματι
  choice: ń fi ẹ̀mí onítara
  rationale: ‘Onítara’ sọ agbára ìtara tí ζέων ní jáde lọ́nà Yorùbá àdánidá; ‘ẹ̀mí’ kò pinnu bóyá ẹ̀mí inú Apọ́lọ̀ ni tàbí Ẹ̀mí Mímọ́.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: ń sọ̀rọ̀, ó sì ń kọ́ni
  rationale: Àmì ‘ń’ méjèèjì fi ìṣe tí ń bá a lọ nínú àwọn imperfect Greek hàn.
- source_word: ἀκριβῶς
  choice: ní pípéye
  rationale: Ó tú ìtumọ̀ ìpéye àti àìṣìṣe nínú ẹ̀kọ́ náà jáde lọ́nà tó ṣe kedere.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: àwọn ohun tó kan Jésù
  rationale: Ó pa ìtẹ̀sí gbooro ti gbolohun Greek mọ́ láì dín ohun tí ó ń kọ́ni nípa rẹ̀ kù.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: bí ó tilẹ̀ jẹ́ pé ìbatisí Jòhánù nìkan ni ó mọ̀
  rationale: Ó fi ìyàtọ̀ tó wà nínú àyíká ọ̀rọ̀ hàn láàárín ẹ̀kọ́ rẹ̀ tó péye àti ààlà ìmọ̀ rẹ̀, bó tilẹ̀ jẹ́ pé participle Greek fúnra rẹ̀ lè jẹ́ aláìṣe pàtó sí i.
theological_decisions:
- issue: Ìtumọ̀ τῷ πνεύματι nínú ζέων τῷ πνεύματι
  choice: ẹ̀mí inú Apọ́lọ̀ / ìtara inú
  alternative: Ẹ̀mí Mímọ́
  rationale: Greek lè tọ́ka sí ẹ̀mí inú Apọ́lọ̀ tàbí sí Ẹ̀mí Mímọ́. Ọ̀rọ̀ àkọ́kọ́ kò fi ọ̀kan múlẹ̀ pátápátá; àlàyé ìsàlẹ̀ pa òmíràn mọ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìbatisí’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀; a sì fi àmì ohùn sí ibi tí ó bá jẹ́ àdánidá.
