  - severity: medium
    issue: “bí ó tilẹ̀ jẹ́ pé” ṣàfikún ìtẹnumọ́ concessive.
    rationale: ἐπιστάμενος jẹ́ participle tí ó ṣàlàyé ààlà ìmọ̀ rẹ̀; ọ̀rọ̀ Yorùbá náà lè fi ‘bí ó tilẹ̀ jẹ́ pé’ kún ìyàtọ̀ tí a kò nílò láti sọ ní gbangba.
