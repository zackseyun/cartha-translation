  to: A ti kọ́ ọkùnrin yìí ní ọ̀nà Olúwa, ó sì ń sọ̀rọ̀ pẹ̀lú ìtara nínú ẹ̀mí[a], ó sì ń kọ́ni ní ìpéye nípa àwọn ohun tó kan Jésù, ó mọ̀ nípa ìbatisí Jòhánù nìkan.
  rationale: 'A tún gbolohun náà ṣe kí ó jẹ́ Yorùbá ìwé mímọ́ tó dáa, nígbà tí a ń pa ìtumọ̀ Greek mọ́: a fi passive perfect ti κατηχημένος hàn ní “A ti kọ́...,” a pa ‘ọ̀nà Olúwa’ mọ́, a fi ìtara τῷ πνεύματι hàn láìpinnu bóyá ẹ̀mí ènìyàn tàbí Ẹ̀mí Mímọ́ ni, a sì yọ concessive tí kò wà ní gbolohun Greek kúrò. Àmì àlàyé ìsàlẹ̀ wà níbi gbolohun τῷ πνεύματι.'
