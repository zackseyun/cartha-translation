    rationale: Ó lè túmọ̀ sí pé ẹ̀mí kan jẹ́ ‘onítara,’ dípò kí ó fi hàn pé Apọ́lọ̀ ń ṣiṣẹ́ pẹ̀lú ìtara nínú ẹ̀mí; ó tún jẹ́ ìṣọ̀kan gbolohun tí kò rọrùn.
