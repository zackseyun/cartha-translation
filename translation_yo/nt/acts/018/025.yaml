  source_fidelity: Àwọn ọ̀rọ̀ pàtàkì ti wà nínú ìtumọ̀ àkọ́kọ́, ṣùgbọ́n “ń fi ẹ̀mí onítara sọ̀rọ̀” kò dá ìtumọ̀ ζέων τῷ πνεύματι hàn lọ́nà Yorùbá tó mọ́gbọ́n dání, ó sì lè dà bí ẹni pé ‘ẹ̀mí’ náà ni onítara. “Bí ó tilẹ̀ jẹ́ pé” sì fi ìbáṣepọ̀ concessive kan kún participle ἐπιστάμενος. Àtúnṣe náà pa àìdánilójú nípa τῷ πνεύματι mọ́, ó sì fi participle ìkẹyìn hàn láìfi ìtumọ̀ àfikún kún un.
  naturalness: “A ti kọ́ ọ ní ọ̀nà Olúwa” jẹ́ Yorùbá àdánidá síi fún κατηχημένος. “pẹ̀lú ìtara nínú ẹ̀mí” àti “ní ìpéye” mú gbolohun náà rọrùn, ó sì bojú mu nínú ìforúkọsílẹ̀ Bíbélì òde òní.
  terminology: “Olúwa,” “Jésù,” “ìbatisí,” àti “Jòhánù” bá ìlò Yorùbá Bíbélì mu. A pa ‘ọ̀nà Olúwa’ mọ́ gẹ́gẹ́ bí ìsọ̀rọ̀ tó sun mọ́ τὴν ὁδὸν τοῦ κυρίου, a kò sì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan lé τῷ πνεύματι.
