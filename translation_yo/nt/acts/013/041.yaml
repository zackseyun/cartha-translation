  verdict: revise
  source_fidelity: Àwọn àṣẹ, ìkìlọ̀ ìparun, ìtẹnumọ́ ‘èmi,’ àti ìkọ̀ líle nínú οὐ μή ni a pa mọ́. Ṣùgbọ́n ‘kí ẹ sì yà á lẹ́nu’ yí ipa ọ̀rọ̀ θαυμάσατε padà sí bí ẹni pé àwọn olùgbọ́ ni wọ́n máa ń fa ìyàlẹ́nu; a tún gbọdọ̀ tún ‘rò ó’ ṣe, nítorí kò túmọ̀ sí ìtàn-sísọ kúnrẹ́rẹ́. ‘Àwọn ọjọ́ yín’ ń pa ọ̀pọ̀ ‘days’ nínú orísun mọ́ dáadáa.
  naturalness: 'Àtúnṣe náà lo Yorùbá òde òní tó mọ́: ‘Ẹ sì kàyéfì’ jẹ́ ìpè tó ṣàfihàn ìyàlẹ́nu sí àwọn olùgbọ́, ‘gbàgbọ́’ ni ọ̀nà ìkọ̀wé tó yẹ, àti ‘sọ ọ́ fún yín ní ẹ̀kúnrẹ́rẹ́’ jẹ́ adayébá ju ‘rò ó fún yín’ lọ.'
  terminology: ‘Ẹlẹ́gàn’ bá καταφρονηταί mu ní àyíká ìkìlọ̀ yìí; ‘ṣègbé’ dá agbára ìkìlọ̀ ἀφανίσθητε sílẹ̀; ‘iṣẹ́’ sì pa ìtumọ̀ gbòòrò ἔργον mọ́. Àwọn akọ́sẹ̀múlẹ̀ ẹsẹ̀-ìsàlẹ̀ ti wà ní ibi tí ó yẹ.
  issues:
  - severity: medium
    issue: ‘kí ẹ sì yà á lẹ́nu’ fún θαυμάσατε
    rationale: Nínú Yorùbá, ‘X yà Y lẹ́nu’ sábà máa ń jẹ́ pé X ni ohun tó ń fa ìyàlẹ́nu sí Y. Nítorí náà, ọ̀rọ̀ náà lè sọ pé àwọn olùgbọ́ ni kí wọ́n yà ‘ó’ lẹ́nu, kì í ṣe pé kí ìyàlẹ́nu bá wọn.
  - severity: high
    issue: ‘rò ó fún yín ní ẹ̀kúnrẹ́rẹ́’ fún ἐκδιηγῆται
    rationale: ‘Rò’ ní Yorùbá jẹ́ ‘think/consider,’ kò sì ṣe afihan ìtàn-sísọ tàbí ìròyìn kíkún. Ἐκδιηγέομαι níbí jẹ́ sísọ tàbí ríròyìn iṣẹ́ náà ní ẹ̀kúnrẹ́rẹ́.
  - severity: low
    issue: ‘ní ọjọ́ yín’ àti ‘gbà gbọ́’
    rationale: Orísun náà ní ‘ní àwọn ọjọ́ yín’ ní ọ̀pọ̀; ‘gbàgbọ́’ sì ni ìkọ̀wé Yorùbá tí a máa ń lò fún ‘believe.’
