id: ACT.13.41
reference: Acts 13:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: yo
  text: Ẹ wò, ẹ̀yin ẹlẹ́gàn[a], ẹ sì kàyéfì, ẹ sì ṣègbé[b]; nítorí èmi ń ṣe iṣẹ́ kan ní àwọn ọjọ́ yín, iṣẹ́ tí ẹ̀yin kì yóò gbàgbọ́ rárá bí ẹnì kan bá sọ ọ́ fún yín ní ẹ̀kúnrẹ́rẹ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin tí ń fojú kéré.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn tí ń fi ìkórìíra tàbí àìbọ̀wọ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ sì parẹ́” tàbí “kí a pa yín run.” Àyọlò yìí ń ṣe àtúnmọ̀ Hábákúkù 1:5 nínú ìtumọ̀ Gíríìkì, ó sì ní ìkìlọ̀ líle nípa ìparun.
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ròyìn iṣẹ́ náà ní ẹ̀kúnrẹ́rẹ́” tàbí “sọ ọ́ ní ẹ̀kúnrẹ́rẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Ẹ wò ó
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn láti fiyè sí ohun tí ó tẹ̀ lé; ó jẹ́ ọ̀rọ̀ Yorùbá adayébá, ó sì mú ìpè láti kíyè sí ohun náà jáde.
- source_word: καταφρονηταί
  choice: ẹlẹ́gàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ń fi ẹ̀gàn àti àìbọ̀wọ̀ hàn, kì í ṣe àwọn tí kò kàn fiyè sí nìkan.
- source_word: θαυμάσατε
  choice: kí ẹ sì yà á lẹ́nu
  rationale: Ó fi ìyàlẹ́nu líle tó wà nínú ọ̀rọ̀ àsọtẹ́lẹ̀ hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ἀφανίσθητε
  choice: kí ẹ sì ṣègbé
  rationale: Ó pa ìkìlọ̀ líle nípa ìparun mọ́, bí ọ̀rọ̀ náà ṣe ń ṣiṣẹ́ nínú àyọlò yìí.
- source_word: ἔργον
  choice: iṣẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ gbòòrò, adayébá fún iṣẹ́ pàtàkì tí Ọlọ́run ń ṣe.
- source_word: ἐργάζομαι ἐγώ
  choice: èmi ń ṣe
  rationale: ‘Èmi’ pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ‘ń ṣe’ sì fi iṣẹ́ tó ń lọ lọ́wọ́ hàn.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: ní ọjọ́ yín
  rationale: Ó pa ìtọ́kasí sí àkókò àwọn olùgbọ́ mọ́ ní ọ̀nà ṣókí àti adayébá.
- source_word: οὐ μὴ πιστεύσητε
  choice: ẹ̀yin kì yóò gbà gbọ́ rárá
  rationale: ‘Rárá’ mú ìkọ̀ líle méjì οὐ μή jáde, ‘ẹ̀yin’ sì ń tẹ àwọn olùgbọ́ náà mọ́lẹ̀.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: bí ẹnì kan tilẹ̀ bá rò ó fún yín ní ẹ̀kúnrẹ́rẹ́
  rationale: ‘Rò ó fún yín ní ẹ̀kúnrẹ́rẹ́’ mú ìtumọ̀ sísọ tàbí ṣíṣe àlàyé ohun kan kúnrẹ́rẹ́ jáde; ‘tilẹ̀’ ń bá ìkọ̀ líle tó ṣáájú mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìkìlọ̀ àsọtẹ́lẹ̀ láti Hábákúkù gẹ́gẹ́ bí a ti fa á yọ nínú Ìṣe àwọn Àpọ́sítélì
  choice: Lo ọ̀rọ̀ ìdájọ́ tààrà ‘ṣègbé,’ kí a sì pa ìkọ̀ gbígbàgbọ́ tó lágbára mọ́.
  alternative: Lo ‘parẹ́’ láti tẹ̀ lé ìrísí LXX pẹ̀lú ìtumọ̀ gígún ju bẹ́ẹ̀ lọ.
  rationale: Àyọlò náà jẹ́ ìkìlọ̀ ọ̀wọ̀ nípa kíkọ iṣẹ́ Ọlọ́run sílẹ̀. ‘Ṣègbé’ pa agbára ìdájọ́ mọ́ láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn àṣẹ ọ̀pọ̀ ènìyàn àti ìtẹnumọ́ ‘èmi’ ni a pa mọ́; ìkìlọ̀ náà kò rọ̀, a kò sì fi èrò ẹ̀kọ́ ìjọ kan kún un.
