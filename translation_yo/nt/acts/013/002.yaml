  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìṣe méjèèjì tí ń lọ pọ̀ mọ́ra, ó fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí ẹni tí ó sọ̀rọ̀, ó sì dá ìpè tí ó ti wà tẹ́lẹ̀ nínú ‘mo ti pè’ sílẹ̀. ‘Ẹ ya ... sọ́tọ̀ fún mi fún iṣẹ́’ tún ń ṣètọ́jú ìtumọ̀ ἀφορίσατε ... μοι ... εἰς τὸ ἔργον láì fi ipò ìjọ tàbí ìfẹ̀sípò kún un.'
