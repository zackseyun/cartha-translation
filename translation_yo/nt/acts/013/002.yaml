  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: yo
  text: Nígbà tí wọ́n ń ṣe iṣẹ́ ìsìn fún Olúwa[a], tí wọ́n sì ń gbààwẹ̀, Ẹ̀mí Mímọ́ sọ pé, “Ẹ ya Bánábà àti Sáùlù sọ́tọ̀ fún mi, fún iṣẹ́ tí mo ti pè wọ́n sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n ń jọ́sìn Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ ìránṣẹ́ tí ó ní ìtumọ̀ ìjọsìn tàbí àwọn ìṣe ìjọsìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: ń ṣe iṣẹ́ ìsìn
  rationale: Gbólóhùn yìí fi iṣẹ́ tí a ń ṣe fún Ọlọ́run hàn, ó sì tún lè ní ìtumọ̀ ìjọsìn; kò fi ọ̀rọ̀ náà mọ́ iṣẹ́ ìlànà ìjọ kan ṣoṣo.
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: Dátífù náà tọ́ka sí ẹni tí iṣẹ́ ìsìn náà ń lọ fún; ‘fún Olúwa’ jẹ́ èdè Yorùbá àdánidá.
- source_word: νηστευόντων
  choice: ń gbààwẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ṣíṣe ààwẹ̀, ó sì dúró gẹ́gẹ́ bí ìṣe tí ó ń lọ lẹ́gbẹ̀ẹ́ iṣẹ́ ìsìn wọn.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni àkọlé Yorùbá tí ó ṣe kedere, ó sì pa Ẹ̀mí mọ́ gẹ́gẹ́ bí olùṣe tí ó sọ̀rọ̀.
- source_word: Ἀφορίσατε
  choice: Ẹ ya ... sọ́tọ̀
  rationale: Ó túmọ̀ sí yíyan ẹni kúrò fún ète pàtó; kò fi èrò ìfinisípò sí ipò ìjọ kan kún ọ̀rọ̀ náà.
- source_word: δή
  choice: —
  rationale: Agbára ìkìlọ̀ tàbí ìmúrasílẹ̀ rẹ̀ wà nínú àṣẹ tààrà náà; fífi ọ̀rọ̀ míì kún un yóò mú kí Yorùbá náà le.
- source_word: μοι
  choice: fún mi
  rationale: Ó fi ẹni tí a yà wọ́n sọ́tọ̀ fún àti ète rẹ̀ hàn lọ́nà àdánidá.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Bánábà àti Sáùlù
  rationale: A kọ àwọn orúkọ náà ní ìbámu pẹ̀lú ìró àti àmì ohùn Yorùbá.
- source_word: εἰς τὸ ἔργον
  choice: fún iṣẹ́
  rationale: ‘Iṣẹ́’ pa ìtumọ̀ gbòòrò ἔργον mọ́ láì sọ ọ́ di ipò ìjọ tàbí irú iṣẹ́ kan pàtó.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: tí mo ti pè wọ́n sí
  rationale: ‘Mo ti pè’ fi ìpè tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí ipa rẹ̀ ṣì wà hàn, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ λειτουργούντων nínú àyíká ìfọkànsìn àti ìránṣẹ́
  choice: ń ṣe iṣẹ́ ìsìn fún Olúwa
  alternative: ń jọ́sìn Olúwa; ń sin Olúwa
  rationale: Ìtumọ̀ yìí mú iṣẹ́ ìránṣẹ́ àti ìjọsìn pọ̀ láì sọ pé ó jẹ́ ìlànà ìjọ kan pàtó.
- issue: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùsọ̀rọ̀
  choice: Ẹ̀mí Mímọ́ sọ pé
  alternative: —
  rationale: Gíríìkì fi Ẹ̀mí Mímọ́ hàn ní tààrà gẹ́gẹ́ bí ẹni tí ó sọ̀rọ̀; a pa èyí mọ́ láì sọ ọ́ di agbára aláìlẹ́ni.
- issue: Agbára ἀφορίσατε ... εἰς τὸ ἔργον
  choice: Ẹ ya ... sọ́tọ̀ ... fún iṣẹ́
  alternative: Ẹ fi ... sípò fún iṣẹ́ òjíṣẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ yíyan wọn sọ́tọ̀ fún iṣẹ́ pàtó, ṣùgbọ́n kò sọ ní pàtó pé ìfinisípò sí ipò ìjọ kan ni.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ ya ... sọ́tọ̀’ láti bá fọ́ọ̀mù Gíríìkì mu.
