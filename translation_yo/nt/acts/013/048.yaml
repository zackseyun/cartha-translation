  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń fi àwọn ìṣe imperfect méjèèjì hàn dáadáa: ayọ̀ àwọn tí kì í ṣe Júù àti fífi ọ̀rọ̀ Olúwa lógo. ‘Tí a ti yàn’ ń pa perfect passive τεταγμένοι mọ́, ó sì yẹ kí a má sọ ẹni tí ó yàn wọn. Àmì ìsàlẹ̀ náà, bí ó ti wà, sọ ‘tí ọkàn wọn ti tẹ̀ sí,’ èyí tí ó ṣàfikún ‘ọkàn’ tí kò sí nínú Gíríìkì, tí ó sì lè ṣí ìtumọ̀ náà sí ìtẹ̀sí àdáni ju ìtumọ̀ àfidípò tí a fẹ́ tọ́ka sí lọ.'
