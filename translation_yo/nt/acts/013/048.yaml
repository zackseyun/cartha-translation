id: ACT.13.48
reference: Acts 13:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: yo
  text: Nígbà tí àwọn tí kì í ṣe Júù gbọ́ èyí, wọ́n bẹ̀rẹ̀ sí í yọ̀, wọ́n sì ń yin ọ̀rọ̀ Olúwa lógo; gbogbo àwọn tí a ti yàn fún ìyè àìnípẹ̀kun[a] sì gbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ti ní ìtẹ̀sí sí ìyè àìnípẹ̀kun.” Àwọn atúmọ̀ kan lè lóye ọ̀rọ̀ Gíríìkì náà ní ọ̀nà mìíràn, ṣùgbọ́n ìtumọ̀ pé “a ti yàn” ni ó bá ìlò ohùn ìṣiṣẹ́ nínú gírámà náà mu ní tààrà jù lọ níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Nígbà tí ... gbọ́ èyí
  rationale: A lo gbólóhùn àkókò láti fi ipa adverbial participle náà hàn; “èyí” ń tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ẹsẹ náà.
- source_word: τὰ ἔθνη
  choice: àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká Ìṣe àwọn Aposteli, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Gbólóhùn yìí ṣe kedere, ó sì yẹra fún ìtumọ̀ “àwọn orílẹ̀-èdè” tí ó lè ṣókùnkùn ní Yorùbá.
- source_word: ἔχαιρον
  choice: wọ́n bẹ̀rẹ̀ sí í yọ̀
  rationale: Èyí fi ipa imperfect tí ó lè tọ́ka sí ìbẹ̀rẹ̀ àti ìtẹ̀síwájú ìṣe hàn ní Yorùbá àdánidá.
- source_word: ἐδόξαζον
  choice: wọ́n sì ń fi ... lógo
  rationale: “Fi ... lógo” pa ìtumọ̀ δοξάζω mọ́, àmì “ń” sì fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: “Ọ̀rọ̀” pa àṣà èdè Bíbélì àti ìtumọ̀ iṣẹ́ ìwàásù mọ́; “Olúwa” jẹ́ ìtumọ̀ àdánidá fún κύριος.
- source_word: ἐπίστευσαν
  choice: gbàgbọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ aorist náà ní tààrà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Èyí fi ipa iye tí ὅσοι ní hàn ní Yorùbá tó ṣe kedere.
- source_word: τεταγμένοι
  choice: tí a ti yàn
  rationale: Perfect passive participle náà dára jù lọ gẹ́gẹ́ bí ìyàn tàbí ìpinnu tí a ti ṣe. A pa ohùn passive mọ́ láìsọ ẹni tó ṣe ìyàn náà ní kedere ju Gíríìkì lọ.
- source_word: εἰς ζωὴν αἰώνιον
  choice: fún ìyè àìnípẹ̀kun
  rationale: “Fún” fi ipa ìdí tàbí ibi tí ohun náà ń lọ hàn ní Yorùbá àdánidá; “ìyè àìnípẹ̀kun” jẹ́ gbólóhùn Bíbélì tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ τεταγμένοι nípa ìyàn àti ìdáhùn ènìyàn
  choice: tí a ti yàn fún ìyè àìnípẹ̀kun
  alternative: tí ọkàn wọn ti tẹ̀ sí ìyè àìnípẹ̀kun
  rationale: Ìtumọ̀ passive pé “a ti yàn” ni èyí tí gírámà náà ń tọ́ka sí ní tààrà jù lọ. Síbẹ̀, nítorí àwọn atúmọ̀ kan lóye participle náà gẹ́gẹ́ bí ìtẹ̀sí inú ènìyàn, a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀ láti pa àríyànjiyàn àti ìfẹ̀ẹ́nú ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣe kedere fún òǹkàwé lásán. A lo “àwọn tí kì í ṣe Júù” dípò “àwọn Kèfèrí” láti mú ìtumọ̀ àyíká náà ṣe kedere, kí a sì yẹra fún ọ̀rọ̀ tí ó lè ní ìró ẹ̀gàn ní lílo òde òní.
