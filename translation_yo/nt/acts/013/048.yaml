  terminology: ‘Àwọn tí kì í ṣe Júù,’ ‘ọ̀rọ̀ Olúwa,’ ‘ìyè àìnípẹ̀kun,’ àti ‘gbàgbọ́’ yẹ fún àyíká Ìṣe àwọn Aposteli àti fún ìforúkọsílẹ̀ Bíbélì Yorùbá òde òní. ‘Tí a ti yàn’ jẹ́ ìtumọ̀ aláìṣàfikún-ẹ̀kọ́ fún τεταγμένοι. Àlàyé ìsàlẹ̀ tún gbọ́dọ̀ fi hàn pé ìtumọ̀ míràn jẹ́ ohun tí àwọn atúmọ̀ kan ń dabaa, kì í ṣe ìtumọ̀ tí a fi dájú.
