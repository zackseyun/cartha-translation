base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: yo
  text: Nígbà náà[a], lẹ́yìn tí wọ́n ti gbààwẹ̀, tí wọ́n sì gbàdúrà, tí wọ́n sì gbé ọwọ́ lé wọn, wọ́n rán wọn lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ́n tú wọn sílẹ̀” tàbí “wọ́n jẹ́ kí wọn lọ.” Nínú àyíká yìí, èrò náà ni pé wọ́n jẹ́ kí Bánábà àti Sóòlù lọ fún iṣẹ́ ìránṣẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìgbésẹ̀ tó tẹ̀ lé ìtọ́sọ́nà Ẹ̀mí Mímọ́ hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: νηστεύσαντες
  choice: lẹ́yìn tí wọ́n ti gbààwẹ̀
  rationale: Aorist participle náà tọ́ka sí ohun tí wọ́n ṣe ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí mú ìtẹ̀lé iṣẹlẹ̀ náà ṣe kedere.
- source_word: προσευξάμενοι
  choice: tí wọ́n sì gbàdúrà
  rationale: Ó pa ìsopọ̀ àwọn iṣẹ́ ìmúrasílẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: tí wọ́n sì gbé ọwọ́ lé wọn
  rationale: Ó pa ìṣe gidi tí Gíríìkì sọ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
- source_word: ἀπέλυσαν
  choice: wọ́n rán wọn lọ
  rationale: Nínú àyíká iṣẹ́ ìránṣẹ́ yìí, ó túmọ̀ sí pé wọ́n jẹ́ kí Bárínábà àti Sóòlù lọ fún iṣẹ́ náà; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Bárínábà àti Sóòlù nínú gbólóhùn gbígbé ọwọ́ lé wọn àti rírán wọn lọ.
theological_decisions:
- issue: Ìtumọ̀ ìṣe gbígbé ọwọ́ lé wọn
  choice: Ṣàpèjúwe ìṣe náà gẹ́gẹ́ bí ó ṣe wà, láìpe e ní ìfiyansípò tàbí ṣíṣe àṣẹ ìjọ kan.
  alternative: Ìfiyansípò, ìbùkún, tàbí ìránni lọ ní ìlànà pàtó.
  rationale: Ẹsẹ náà mẹ́nu kan ààwẹ̀, àdúrà, gbígbé ọwọ́ lé wọn, àti rírán wọn lọ, ṣùgbọ́n kò sọ pàtó irú ipò ìjọ tàbí ìtumọ̀ sakiramenti tí ìṣe náà ní.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé yé fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
