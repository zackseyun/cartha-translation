id: ACT.13.11
reference: Acts 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: yo
  text: Àti nísinsìnyí, wò ó, ọwọ́ Olúwa wà lórí rẹ[a]; ìwọ yóò di afọ́jú, tí kò ní rí oòrùn fún ìgbà díẹ̀. Lójú ẹsẹ̀, ìkùùkùù àti òkùnkùn ṣubú lù ú; bí ó sì ti ń lọ káàkiri, ó ń wá àwọn ẹni tí yóò darí i nípa mímú ọwọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọwọ́ Olúwa” jẹ́ àkànlò inú Bíbélì fún agbára Olúwa tí ń ṣiṣẹ́; níbí, ó ń ṣiṣẹ́ nínú ìdájọ́.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ọ̀rọ̀ yìí pe olùgbọ́ láti fiyè sí ohun tí ó fẹ́ ṣẹlẹ̀; “wò ó” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ìkìlọ̀ náà mọ́.
- source_word: χεὶρ κυρίου
  choice: ọwọ́ Olúwa
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ dípò kí a túmọ̀ rẹ̀ sí ìdájọ́ tàbí ìjìyà ní tààràtà.
- source_word: ἔσῃ τυφλὸς
  choice: ìwọ yóò fọ́jú
  rationale: Èyí sọ ìyípadà sí ipò afọ́jú ní Yorùbá àdánidá, ó sì bá ọ̀rọ̀ ọjọ́ iwájú inú Gíríìkì mu.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: ìwọ kì yóò sì rí oòrùn
  rationale: A pa ìtọ́ka pàtó sí oòrùn mọ́, dípò gbolohun gbogbogbò bí “ìmọ́lẹ̀ ọ̀sán.”
- source_word: ἄχρι καιροῦ
  choice: fún ìgbà díẹ̀
  rationale: Ó fi hàn pé afọ́jú náà kì í ṣe títí láé, ṣùgbọ́n Gíríìkì kò sọ bí àsìkò náà yóò ti gùn tó.
- source_word: παραχρῆμα
  choice: Lójú ẹsẹ̀
  rationale: Ó mú ìṣẹ̀lẹ̀ òjijì àti àìfàsẹ́yìn náà jáde ní Yorùbá tó wọ́pọ̀.
- source_word: ἀχλὺς
  choice: ìkùukùu biribiri
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìrí tàbí ìṣú tí ń bo ojú, tí ó ń mú kí ìríran ṣú; gbolohun yìí pa àwòrán náà mọ́.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Èyí ni ìtumọ̀ Yorùbá tààràtà tó sì pa agbára búburú ọ̀rọ̀ náà mọ́.
- source_word: περιάγων
  choice: bí ó sì ti ń lọ káàkiri
  rationale: A túmọ̀ participle náà ní pẹ̀lẹ́pẹ̀lẹ́ gẹ́gẹ́ bí lílọ káàkiri, láìfi èrò “fífọ́wọ́ rìn” kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà.
- source_word: ἐζήτει χειραγωγούς
  choice: ó ń wá àwọn tí yóò di ọwọ́ rẹ̀ mú láti darí rẹ̀
  rationale: 'Èyí pa ìtumọ̀ pàtó ti χειραγωγός mọ́: ẹni tí ń darí afọ́jú nípa dídì í mú lọ́wọ́.'
theological_decisions:
- issue: Ìtumọ̀ “ọwọ́ Olúwa”
  choice: A pa àkànlò èdè náà mọ́ gẹ́gẹ́ bí “ọwọ́ Olúwa wà lórí rẹ.”
  alternative: “Ìdájọ́ Olúwa dé bá ọ” tàbí “Olúwa yóò lù ọ́.”
  rationale: Nínú àyíká ọ̀rọ̀, àkànlò náà fi iṣẹ́ agbára Ọlọ́run nínú ìdájọ́ hàn, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ rọ́pò àwòrán ìpilẹ̀ṣẹ̀ pẹ̀lú àlàyé ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu; a sì pa àwòrán àti àìsọ pàtó inú Gíríìkì mọ́.
