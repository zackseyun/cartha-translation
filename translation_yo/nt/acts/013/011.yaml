- from: Àti nísinsìnyí, wò ó, ọwọ́ Olúwa wà lórí rẹ[a]; ìwọ yóò fọ́jú, ìwọ kì yóò sì rí oòrùn fún ìgbà díẹ̀. Lójú ẹsẹ̀, ìkùukùu biribiri àti òkùnkùn ṣubú lù ú; bí ó sì ti ń lọ káàkiri, ó ń wá àwọn tí yóò di ọwọ́ rẹ̀ mú láti darí rẹ̀.
  to: Àti nísinsìnyí, wò ó, ọwọ́ Olúwa wà lórí rẹ[a]; ìwọ yóò di afọ́jú, tí kò ní rí oòrùn fún ìgbà díẹ̀. Lójú ẹsẹ̀, ìkùùkùù àti òkùnkùn ṣubú lù ú; bí ó sì ti ń lọ káàkiri, ó ń wá àwọn ẹni tí yóò darí i nípa mímú ọwọ́ rẹ̀.
