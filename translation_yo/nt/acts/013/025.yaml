id: ACT.13.25
reference: Acts 13:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: yo
  text: Bí Jòhánù sì ti ń parí eré ìje rẹ̀[a], ó máa ń sọ pé, “Kí ni ẹ rò pé èmi jẹ́? Èmi kì í ṣe òun. Ṣùgbọ́n wò ó, ẹni kan ń bọ̀ lẹ́yìn mi[b], ẹni tí èmi kò yẹ láti tú bàtà rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí Jòhánù sì ti ń parí ipa iṣẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì fi iṣẹ́ ìránṣẹ́ rẹ̀ wé eré ìje.
    reason: alternative_reading
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ àti àwọn ìtumọ̀ kan sọ ọ́ ní pàtó sí i pé, “láti tú okùn bàtà rẹ̀,” ṣùgbọ́n ẹ̀dà Gíríìkì tí a tẹ̀ níbí kàn sọ pé, “láti tú bàtà rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: ti ń parí eré ìje rẹ̀
  rationale: Ọ̀rọ̀ náà fi iṣẹ́ ìránṣẹ́ tàbí ipa tí a yàn fún Jòhánù wé eré ìje; “ń parí” tún pa ìṣe tí ó ń lọ lọ́wọ́ inú imperfect mọ́.
- source_word: ἔλεγεν
  choice: ó máa ń sọ
  rationale: Ìṣàpẹẹrẹ imperfect lè tọ́ka sí ọ̀rọ̀ tí Jòhánù ń sọ léraléra tàbí ní gbogbo ìgbà iṣẹ́ rẹ̀.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Kí ni ẹ rò pé èmi jẹ́?
  rationale: Ó jẹ́ Yorùbá àdánidá fún ìbéèrè nípa irú ẹni tàbí ìdánimọ̀ tí àwọn olùgbọ́ ń fi fún Jòhánù, ó sì pa τί (“kí ni”) mọ́.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Èmi kì í ṣe òun
  rationale: Ó pa gbolohun Gíríìkì tí kò sọ ẹni tí a ń tọ́ka sí ní kedere mọ́, pẹ̀lú ìtẹnumọ́ lórí “èmi.”
- source_word: ἀλλ’ ἰδοὺ
  choice: Ṣùgbọ́n, ẹ wò ó
  rationale: “Ẹ wò ó” jẹ́ ọ̀nà Yorùbá òde òní láti fa àfiyèsí sí ohun tí ó tẹ̀ lé, láì lo èdè àtijọ́.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: ẹnì kan ń bọ̀ lẹ́yìn mi
  rationale: Ó mú ìṣe àsìkò ìsinsìnyí àti ẹni tí a kò tíì dárúkọ ní kedere jáde lọ́nà àdánidá.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: ẹni tí èmi kò yẹ láti tú bàtà ẹsẹ̀ rẹ̀
  rationale: “Bàtà ẹsẹ̀” tẹ̀ lé ὑπόδημα τῶν ποδῶν, “tú” sì jẹ́ ìtumọ̀ àdánidá fún λύω ní àyíká yìí; a kò fi “okùn” kún ọ̀rọ̀ pàtàkì nítorí kò sí nínú ẹ̀dà Gíríìkì tí a tẹ̀.
- source_word: ἄξιος
  choice: yẹ
  rationale: Ní gbolohun ìrẹ̀lẹ̀ yìí, “kò yẹ láti” sọ àìní ìtóótun tàbí ìyì tó yẹ lọ́nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ tí Jòhánù sẹ́ nínú οὐκ εἰμὶ ἐγώ
  choice: Èmi kì í ṣe òun
  alternative: Èmi kì í ṣe Mèsáyà náà
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí Jòhánù máa sẹ́ pé òun ni Mèsáyà, ṣùgbọ́n Gíríìkì kò dárúkọ Mèsáyà ní kedere. Ọ̀rọ̀ pàtàkì pa àìsọ-kedere náà mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé ohun tí àyíká tọ́ka sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A lo “eré ìje” láti pa àkàwé δρόμος mọ́, “ó máa ń sọ” láti fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn, àti “ẹ wò ó” gẹ́gẹ́ bí ìkìlọ̀ àfiyèsí àdánidá. Gbogbo àmì ohùn àti àmì ìsàlẹ̀ lẹ́tà ni a fi síbi tí ó yẹ.
