revisions:
- from: Bí Jòhánù sì ti ń parí eré ìje rẹ̀[a], ó máa ń sọ pé, “Kí ni ẹ rò pé èmi jẹ́? Èmi kì í ṣe òun. Ṣùgbọ́n, ẹ wò ó, ẹnì kan ń bọ̀ lẹ́yìn mi[b], ẹni tí èmi kò yẹ láti tú bàtà ẹsẹ̀ rẹ̀.”
  to: Bí Jòhánù sì ti ń parí eré ìje rẹ̀[a], ó máa ń sọ pé, “Kí ni ẹ rò pé èmi jẹ́? Èmi kì í ṣe òun. Ṣùgbọ́n wò ó, ẹni kan ń bọ̀ lẹ́yìn mi[b], ẹni tí èmi kò yẹ láti tú bàtà rẹ̀.”
  rationale: A tún un ṣe fún ìròrùn àti ìlò Yorùbá boṣewa nìkan. “Bàtà rẹ̀” jẹ́ ìsọ̀rọ̀ àdánidá fún bàtà tí a tú, ó sì pa ìtumọ̀ gbogbogbò ti ὑπόδημα mọ́. A tún ṣe àmì ἰδού sí “Ṣùgbọ́n wò ó,” láì fi olùgbọ́ púpọ̀ sínú ọ̀rọ̀ tí Gíríìkì kò sọ. Àmì ìsàlẹ̀ a àti b ṣì wà níbi tí ó yẹ, àwọn àlàyé ìsàlẹ̀ náà sì bá ọ̀rọ̀ tí a ṣe àtúnṣe mu.
