base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n gbọn eruku ẹsẹ̀ wọn sí wọn, wọ́n sì lọ sí Ikoniomu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìṣe gbigbọn eruku kúrò ní ẹsẹ̀ ẹni jẹ́ àmì ìyàsọ́tọ̀, ó sì jẹ́ ẹ̀rí lòdì sí àwọn tí wọ́n kọ ọ̀rọ̀ náà.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: δέ ń fi ìyàtọ̀ díẹ̀ tàbí ìyípadà nínú ìtàn hàn; ‘Ṣùgbọ́n’ pa ìtumọ̀ ìyàtọ̀ náà mọ́, ‘wọ́n’ sì tọ́ka sí Pọ́ọ̀lù àti Bánábà.
- source_word: ἐκτιναξάμενοι
  choice: wọ́n gbọn ...
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi agbára gbọn ohun kan kúrò; lílo ọ̀rọ̀-ìṣe aláṣẹ pẹ̀lú ìṣẹ̀lẹ̀ tó tẹ̀ lé e jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: ekuru ẹsẹ̀ wọn
  rationale: κονιορτός jẹ́ ekuru ilẹ̀, genitive τῶν ποδῶν sì fi hàn pé ekuru náà wà lára ẹsẹ̀ wọn; gbólóhùn yìí ṣe kedere ní Yorùbá.
- source_word: ἐπ’ αὐτοὺς
  choice: sí wọn
  rationale: ἐπί pẹ̀lú accusative níbí ń darí àmì ìṣe náà sí àwọn tó kọ ọ̀rọ̀ náà; ‘sí wọn’ pa ìtọ́sọ́nà àti agbára ẹ̀rí/òdì mọ́ láì ṣàlàyé rẹ̀ jù nínú ọ̀rọ̀ pàtàkì.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: wọ́n sì lọ sí Ikóníónì
  rationale: ἦλθον ṣàpèjúwe ìrìn wọn lọ sí ibi tí a dárúkọ, εἰς sì fi ibi-àfojúsùn hàn; ‘lọ sí’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìṣe àmì fífi ekuru ẹsẹ̀ gbọn
  choice: A túmọ̀ ìṣe náà ní tààràtà gẹ́gẹ́ bí fífi ekuru ẹsẹ̀ wọn gbọn sí wọn.
  alternative: gẹ́gẹ́ bí ẹ̀rí sí wọn; gẹ́gẹ́ bí àmì ìdájọ́ sí wọn
  rationale: Gíríìkì sọ ìṣe náà àti ẹni tí ìṣe náà dojú kọ, ṣùgbọ́n kò ṣàlàyé gbogbo ìtumọ̀ rẹ̀ nínú ẹsẹ yìí. Nítorí náà, a pa àìṣedéédé ìtumọ̀ náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi àlàyé àṣà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì kọ orúkọ ìlú náà sí ‘Ikóníónì’ láti tẹ̀ lé ìpè Gíríìkì.
