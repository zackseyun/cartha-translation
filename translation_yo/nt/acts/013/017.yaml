  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: yo
  text: Ọlọ́run àwọn ènìyàn yìí, Israẹli, yan àwọn baba wa[a]. Ó sì mú kí àwọn ènìyàn náà di ńlá ní ìgbà tí wọ́n ń gbé ní ilẹ̀ Ejibiti gẹ́gẹ́ bí àjèjì[b], ó sì fi apá gíga[c] mú wọn jáde kúrò níbẹ̀[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “àwọn baba ńlá wa.” Gíríìkì: “àwọn baba wa.”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí pé ó gbé àwọn ènìyàn náà ga tàbí pé ó mú wọn pọ̀ sí i.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “pẹ̀lú apá gíga”; èyí jẹ́ ọ̀nà ọ̀rọ̀ nínú ìtàn Ìjáde fún ìgbàlà alágbára Ọlọ́run.
    reason: cultural_note
  - marker: d
    text: Tàbí, “ó ṣamọ̀nà wọn jáde kúrò níbẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Ọlọ́run àwọn ènìyàn yìí, Israẹli
  rationale: Ó pa ìtumọ̀ pé Ọlọ́run tí àwọn ènìyàn Israẹli ń sìn mọ́, ó sì mú apposition ‘Israẹli’ hàn ní Yorùbá àdánidá.
- source_word: ἐξελέξατο
  choice: yan
  rationale: ‘Yan’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún yíyan pẹ̀lú ète; kò pọndandan láti sọ ìtumọ̀ middle voice ní ọ̀tọ̀.
- source_word: τοὺς πατέρας ἡμῶν
  choice: àwọn baba wa
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì πατέρας, ó sì yẹ fún ọ̀rọ̀ nípa àwọn baba ńlá nínú ìtàn májẹ̀mú.
- source_word: ὕψωσεν
  choice: mú kí àwọn ènìyàn náà di ńlá
  rationale: Ó dá àìdánilójú tó wà láàárín gbígbé wọn ga àti mímú wọn pọ̀ sí i mọ́, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: nígbà tí wọ́n ń gbé gẹ́gẹ́ bí àjèjì ní ilẹ̀ Ejibiti
  rationale: Ó sọ ipò wọn gẹ́gẹ́ bí àwọn àlejò tàbí àjèjì ní ilẹ̀ mìíràn ní kedere, ó sì pa ‘ilẹ̀ Ejibiti’ mọ́.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: fi apá tí a gbé sókè
  rationale: Ó pa àwòrán ọ̀rọ̀ Eksodu mọ́ dípò yíyí i padà sí ‘agbára’ nìkan.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: mú wọn jáde kúrò níbẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún mímú wọn jáde láti Ejibiti; ‘níbẹ̀’ tọ́ka padà sí ilẹ̀ náà láìsí ìdàrúdàpọ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn baba Israẹli
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa / àwọn ìran wa àtijọ́
  rationale: Gíríìkì lo πατέρας ní pàtó; ‘àwọn baba wa’ pa ìfarahàn akọ àti ìsopọ̀ pẹ̀lú ìtàn májẹ̀mú mọ́.
- issue: Ìtumọ̀ ὕψωσεν ní Ejibiti
  choice: mú kí àwọn ènìyàn náà di ńlá
  alternative: gbé àwọn ènìyàn náà ga / mú àwọn ènìyàn náà pọ̀ sí i
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí gbígbé ga tàbí sí ìdàgbàsókè ní iye àti ipò; àyànfẹ́ yìí kò fi òye kan ṣoṣo mú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘apá tí a gbé sókè’ àti àìdánilójú ὕψωσεν mọ́ nípasẹ̀ àkọsílẹ̀ ìsàlẹ̀.
