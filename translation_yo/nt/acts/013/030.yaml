  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run jí i dìde kúrò láàárín àwọn òkú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níhìn-ín, δέ fi ohun tí Ọlọ́run ṣe ṣe ìyàtọ̀ sí ohun tí àwọn ènìyàn ṣe ṣáájú; “Ṣùgbọ́n” sọ ìtakora yìí ní Yorùbá àdánidá.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Ọ̀rọ̀ náà tọ́ka tààrà sí Ọlọ́run gẹ́gẹ́ bí ẹni tó ṣe iṣẹ́ náà.
- source_word: ἤγειρεν
  choice: jí i dìde
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde, ἐγείρω túmọ̀ sí jí ẹni dìde; gbólóhùn Yorùbá yìí ṣe kedere pé Ọlọ́run ló jí Jesu dìde.
- source_word: αὐτὸν
  choice: i
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Jesu nínú àyíká ọ̀rọ̀, Yorùbá sì fi “i” hàn gẹ́gẹ́ bí olùgbà iṣẹ́ náà.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ẹ̀ka ọ̀rọ̀ yìí túmọ̀ sí jíjáde kúrò láàárín àwọn ẹni tí ó ti kú; ìtumọ̀ yìí pa àwòrán orísun mọ́, ó sì ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àjíǹde
  choice: Ọlọ́run jí i dìde kúrò láàárín àwọn òkú.
  alternative: Ọlọ́run jí i dìde kúrò nínú ikú.
  rationale: Àṣàyàn náà sọ ní kedere pé Ọlọ́run ni olùṣe, Jesu sì ni ẹni tí a jí dìde. “Láàárín àwọn òkú” tún pa ìtumọ̀ ἐκ νεκρῶν mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì yẹ fún kíkà ní gbangba. Kò sí àlàyé ẹ̀sìn àfikún tàbí àmì àlàyé ìsàlẹ̀ ojú ìwé.
