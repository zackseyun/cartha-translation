base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: yo
  text: 'Nítorí náà, ẹ ṣọ́ra[a] kí ohun tí a ti sọ nínú àwọn ìwé àwọn wòlíì má bàa dé bá yín:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kíyèsára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni, ó sì ń jẹ́ ìkìlọ̀ pàjáwìrì. “Ẹ ṣọ́ra” jẹ́ Yorùbá àdánidá tó mú agbára ìkìlọ̀ náà jáde.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìkìlọ̀ yìí mọ́ ohun tí a ṣẹ̀ṣẹ̀ kéde, ó sì fi hàn pé ìkìlọ̀ náà jẹ́ àbájáde ohun tó ṣáájú.
- source_word: μὴ ἐπέλθῃ
  choice: kí ... má bàa ṣẹlẹ̀ sí yín
  rationale: Ìṣètò μή pẹ̀lú aorist subjunctive lẹ́yìn ọ̀rọ̀ àṣẹ ń sọ ìkìlọ̀ pé kí ohun kan má ṣẹlẹ̀. “Má bàa ṣẹlẹ̀ sí yín” jẹ́ ọ̀nà Yorùbá àdánidá fún ewu ìdájọ́ tó lè dé bá wọn.
- source_word: τὸ εἰρημένον
  choice: ohun tí a ti sọ
  rationale: Ó pa ìtumọ̀ participle aláìlórúkọ tó dúró gẹ́gẹ́ bí nọ́ọ̀nù mọ́, “a ti sọ” sì tún fi ipa perfect náà hàn pé ọ̀rọ̀ náà ṣì dúró.
- source_word: ἐν τοῖς προφήταις
  choice: nínú àwọn wòlíì
  rationale: Ó tẹ̀ lé ἐν ní pẹkipẹki, ó sì lè tọ́ka sí apá Ìwé Mímọ́ tí a ń pè ní àwọn Wòlíì, níbi tí ìkìlọ̀ náà wà, láì sọ ọ́ di “láti ẹnu àwọn wòlíì” nìkan.
theological_decisions:
- issue: Ohun tí “àwọn wòlíì” ń tọ́ka sí
  choice: Àwọn ìwé àwọn wòlíì gẹ́gẹ́ bí apá kan nínú Ìwé Mímọ́
  alternative: Àwọn ènìyàn tó jẹ́ wòlíì gẹ́gẹ́ bí olùsọ̀rọ̀
  rationale: Pọ́ọ̀lù fẹ́ fa ọ̀rọ̀ láti inú Hábákúkù yọ lẹ́sẹ̀kẹsẹ̀; nítorí náà, gbólóhùn náà ń tọ́ka ní pàtàkì sí ohun tí a kọ sínú àwọn ìwé àsọtẹ́lẹ̀. “Nínú àwọn wòlíì” jẹ́ kí ìtumọ̀ yìí dúró láì pa àǹfààní ìtumọ̀ pé àwọn wòlíì ni Ọlọ́run fi sọ ọ́ rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” nítorí pé ọ̀rọ̀ Gíríìkì náà jẹ́ fún ọ̀pọ̀ ènìyàn. Kólọ́nù ní òpin fi hàn pé ọ̀rọ̀ àsọtẹ́lẹ̀ tí a ń tọ́ka sí ń bẹ̀rẹ̀ ní ẹsẹ tó tẹ̀ lé.
