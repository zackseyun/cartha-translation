  source_fidelity: Ìtumọ̀ náà mú ìkìlọ̀ ti βλέπετε, ìsopọ̀ οὖν, àti ètò ìkìlọ̀ μή ... ἐπέλθῃ dáadáa. Síbẹ̀, “ṣẹlẹ̀ sí yín” kò mú àwòrán ἐπέλθῃ—ohun kan tí ó ‘dé bá’ ẹni—jáde pẹ̀lú agbára tó. “Nínú àwọn wòlíì” lè dà bí ẹni pé àwọn ènìyàn ni a ń tọ́ka sí; nínú àyíká ìtọ́kasí sí Hábákúkù, àwọn ìwé àsọtẹ́lẹ̀ ni ìtumọ̀ tó hàn gedegbe.
