    issue: Àlàyé-ẹsẹ̀ a ní ‘fún àwa, ọmọ wọn.’
    rationale: ‘Fún àwa’ jẹ́ àṣìṣe gírámà lẹ́yìn ìṣáájú ‘fún.’ A tún nílò láti sọ ìbátan ‘us, their children’ ní kedere.
  - severity: low
    issue: Ìṣètò ‘a ti kọ ọ́ pẹ̀lú nínú Sáàmù kejì’ kò rọrùn.
    rationale: Gíríìkì καί lè wà nínú Yorùbá gẹ́gẹ́ bí ‘tún’; ìṣètò tuntun ń jẹ́ kó hàn gbangba síi láì yí ìtumọ̀ padà.
  - severity: low
    issue: Orúkọ náà jẹ́ ‘Jesu’ láìsí àmì ohùn.
    rationale: ‘Jésù’ ni ọ̀nà ìkọ Yorùbá boṣewa, ó sì bá ìbéèrè fún àmì ohùn kíkún mu.
