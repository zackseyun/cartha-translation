id: ACT.13.33
reference: Acts 13:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: yo
  text: "pé Ọlọ́run ti mú èyí ṣẹ fún àwọn ọmọ wa[a] nípa gbígbé Jésù dìde[b], gẹ́gẹ́ bí a ti tún kọ ọ́ nínú Sáàmù kejì pé:\n\n“Ìwọ ni Ọmọ mi;\n    èmi ti bí ọ lónìí.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “fún àwa tí í ṣe ọmọ wọn.” Àwọn ìwé àfọwọ́kọ kan ní “fún àwọn ọmọ wa,” àwọn mìíràn sì ṣe àtìlẹ́yìn fún “fún àwa tí í ṣe ọmọ wọn.”
    reason: textual_variant
  - marker: b
    text: Àbí, “nípa jíjí Jésù dìde kúrò nínú òkú.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé Ọlọ́run gbé e dìde ní ìtumọ̀ mímú un jáde wá tàbí yíyàn án.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: ti mú ... ṣẹ
  rationale: Ọ̀rọ̀ yìí sọ pé Ọlọ́run ti mú ohun tí ó ṣèlérí ṣẹ pátápátá, ìmúṣẹ náà sì ṣì ní ipa nísinsìnyí; ‘mú ... ṣẹ’ jẹ́ ọ̀nà Yorùbá àdánidá fún èdè ìmúṣẹ ìlérí.
- source_word: ταύτην
  choice: èyí
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ láì fi ‘ìlérí’ kún ọ̀rọ̀ pàtó, bí ó tilẹ̀ jẹ́ pé ohun tí ó ń tọ́ka sí nínú àyíká ni ìlérí.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: fún àwọn ọmọ wa
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ inú SBLGNT tí a pèsè. ‘Àwọn ọmọ’ lè túmọ̀ sí ọmọ tàbí ìran, àyíká sì ń fi àwọn baba wé àwọn tó wá lẹ́yìn wọn.
- source_word: ἀναστήσας Ἰησοῦν
  choice: nípa gbígbé Jesu dìde
  rationale: Gbólóhùn náà fi iṣẹ́ yìí hàn gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run fi mú èyí ṣẹ. ‘Gbí ... dìde’ sun mọ́ Gíríìkì, ó sì jẹ́ kí àjọṣe rẹ̀ pẹ̀lú àjíǹde dúró, láì fi ‘kúrò nínú òkú’ kún ọ̀rọ̀ pàtó.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàfihàn ọ̀rọ̀ Ìwé Mímọ́ tí a kọ sílẹ̀, tí ó sì ṣì dúró.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: nínú Sáàmù kejì
  rationale: Ó tẹ̀ lé nọ́ńbà Sáàmù tí Gíríìkì sọ ní tààrà, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: Υἱός μου εἶ σύ
  choice: Ìwọ ni Ọmọ mi
  rationale: Ètò ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìdánimọ̀ Ọmọ náà mọ́.
- source_word: σήμερον γεγέννηκά σε
  choice: èmi ti bí ọ lónìí
  rationale: ‘Bí’ jẹ́ ìtumọ̀ tààrà fún γεννάω ní Yorùbá; lílo ‘èmi’ pa ìtẹnumọ́ olùsọ̀rọ̀ mọ́, láì ṣàlàyé ọ̀rọ̀ Sáàmù náà ní ọ̀nà ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ἀναστήσας Ἰησοῦν nínú àyíká yìí
  choice: A túmọ̀ rẹ̀ sí ‘gbígbé Jesu dìde,’ láì fi ‘kúrò nínú òkú’ sínú ẹsẹ̀ pàtó.
  alternative: Ọlọ́run jí Jesu dìde kúrò nínú òkú; tàbí Ọlọ́run gbé Jesu dìde ní ìtumọ̀ mímú un jáde wá tàbí yíyàn án.
  rationale: Àwọn ẹsẹ̀ tó tẹ̀ lé e sọ ní kedere nípa àjíǹde, ṣùgbọ́n ἀνίστημι tún lè tọ́ka sí gbígbé olùdáǹdè kan dìde. A kò yanjú ẹ̀dọ̀fu ìtumọ̀ náà ní ìkọ̀kọ̀.
- issue: Agbára ẹ̀kọ́ ní ‘èmi ti bí ọ lónìí’
  choice: A pa ọ̀rọ̀ àyọlò Sáàmù 2:7 mọ́ ní tààrà.
  alternative: Ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí ìgbéga sí oyè, ìfihàn gẹ́gẹ́ bí Ọmọ, tàbí ìjẹ́rìí nípasẹ̀ àjíǹde.
  rationale: Ìtumọ̀ kò gbọ́dọ̀ fi àlàyé kan sínú àyọlò náà láti yanjú àwọn ìjíròrò ẹ̀kọ́ nípa Kristi tí ọ̀rọ̀ fúnra rẹ̀ kò ṣàlàyé níbí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn kíkún níbi tí ó ti yẹ, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Sáàmù kejì’ dípò fọ́ọ̀mù ìtọ́kasí kúkúrú, a sì ṣe àyọlò ewì náà ní ìlà méjì.
