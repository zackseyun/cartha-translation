  to: "pé Ọlọ́run ti mú èyí ṣẹ fún àwọn ọmọ wa[a] nípa gbígbé Jésù dìde[b], gẹ́gẹ́ bí a ti tún kọ ọ́ nínú Sáàmù kejì pé:\n\n“Ìwọ ni Ọmọ mi;\n    èmi ti bí ọ lónìí.”"
