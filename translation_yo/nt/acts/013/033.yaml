  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: ó pa ‘èyí’ mọ́ láì ṣàfikún ‘ìlérí,’ ó sì fi ‘nípa gbígbé Jésù dìde’ sílẹ̀ ní ọ̀nà tí kò yanjú ìfẹ̀sẹ̀mulẹ̀ ìtumọ̀ ἀναστήσας. Àyọlò Sáàmù 2:7 náà jẹ́ tààrà. Àmọ́, gbolohun tí ó ṣàfihàn ìkọ̀wé nínú Sáàmù lè jẹ́ àdánidá síi, àti pé a yẹ kí a lo ọ̀nà ìkọ orúkọ Jésù tí ó bá Yorùbá boṣewa mu.'
  naturalness: ‘gẹ́gẹ́ bí a ti kọ ọ́ pẹ̀lú nínú Sáàmù kejì’ kò rọrùn tó nínú Yorùbá òde òní; ‘gẹ́gẹ́ bí a ti tún kọ ọ́ nínú Sáàmù kejì’ jẹ́ àdánidá, ó sì ń ṣàfihàn καί. Nínú àlàyé-ẹsẹ̀ akọkọ, ‘fún àwa’ kò pé nínú ètò gírámà Yorùbá; ‘fún àwa tí í ṣe ọmọ wọn’ ṣe kedere, ó sì dára.
  terminology: ‘Ọlọ́run,’ ‘Ọmọ,’ àti ‘Sáàmù kejì’ bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu. ‘Jésù’ yẹ kí ó ní àmì ohùn gẹ́gẹ́ bí ìlànà Yorùbá boṣewa. ‘Bí’ nínú àyọlò Sáàmù ń pa ìtumọ̀ γεννάω mọ́, láì fi ìtúmọ̀ ẹ̀kọ́ ìjọ kún un.
  issues:
