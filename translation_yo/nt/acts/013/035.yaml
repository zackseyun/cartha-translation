source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: yo
  text: Nítorí náà, ó tún sọ nínú sáàmù mìíràn[a] pé, “Ìwọ kì yóò jẹ́ kí Ẹni Mímọ́ rẹ[b] rí ìbàjẹ́.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ibòmíràn” tàbí “nínú ẹsẹ Ìwé Mímọ́ mìíràn”; Gíríìkì kàn sọ pé “nínú òmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹni olóòótọ́ rẹ.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “jìjẹrà” tàbí “ìdíbàjẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Nítorí náà
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń fi ìparí èrò kan hàn láti inú ẹsẹ tó ṣáájú, kì í ṣe pé ó kàn ń fúnni ní ìdí.
- source_word: καὶ
  choice: tún
  rationale: Ó fi ẹ̀rí Ìwé Mímọ́ mìíràn kún èyí tí a ṣẹ̀ṣẹ̀ sọ; “tún” jẹ́ ọ̀nà àdánidá láti fi agbára àfikún náà hàn ní Yorùbá.
- source_word: ἐν ἑτέρῳ
  choice: nínú sáàmù mìíràn
  rationale: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ sí “nínú òmíràn,” tí orúkọ ohun tí a ń tọ́ka sí kò hàn gbangba. Níwọ̀n bí àyọlò náà ti wá láti inú Sáàmù 16, fífi “sáàmù” kún un ń mú ọ̀rọ̀ náà ṣe kedere láìyí ìtumọ̀ rẹ̀ padà.
- source_word: λέγει
  choice: ó sọ
  rationale: A pa ìṣe ọ̀rọ̀ ìsinsìnyí ti ọ̀nà ìtọ́kasí Ìwé Mímọ́ mọ́ ní ìtumọ̀ Yorùbá; ẹni tí “ó” ń tọ́ka sí lè jẹ́ Ọlọ́run gẹ́gẹ́ bí ẹni tó ń sọ̀rọ̀ nínú Ìwé Mímọ́.
- source_word: Οὐ δώσεις
  choice: Ìwọ kì yóò jẹ́ kí
  rationale: Bí ó tilẹ̀ jẹ́ pé δίδωμι sábà máa ń túmọ̀ sí “fún,” pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni nínú gbólóhùn yìí ó túmọ̀ sí fífi àṣẹ tàbí ààyè sílẹ̀; “jẹ́ kí” ni Yorùbá àdánidá fún un.
- source_word: τὸν ὅσιόν σου
  choice: Ẹni Mímọ́ rẹ
  rationale: ὅσιος lè ṣàpèjúwe ẹni mímọ́, olùfọkànsìn, tàbí olóòótọ́ sí Ọlọ́run. Ní àyíká ọ̀rọ̀ Ìṣe 13, Pọ́ọ̀lù ń lo ẹsẹ yìí fún Jésù, nítorí náà “Ẹni Mímọ́ rẹ” bá àyíká náà mu, ó sì tún pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ἰδεῖν
  choice: rí
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì, ó sì pa àwòrán ọ̀rọ̀ inú Sáàmù mọ́.
- source_word: διαφθοράν
  choice: ìdíbàjẹ́
  rationale: Nínú àríyànjiyàn nípa àjíǹde yìí, ọ̀rọ̀ náà ń tọ́ka sí jíjẹrà tàbí ìbàjẹ́ ara lẹ́yìn ikú. “Ìdíbàjẹ́” pa fífẹ̀ ìtumọ̀ Gíríìkì mọ́, ó sì bá gbólóhùn “rí ìdíbàjẹ́” mu.
theological_decisions:
- issue: Ìtọ́kasí τὸν ὅσιόν σου sí Mèsáyà/Kristi
  choice: Ẹni Mímọ́ rẹ
  alternative: ẹni mímọ́ rẹ; ẹni olóòótọ́ rẹ
  rationale: Nínú Ìṣe 13, Pọ́ọ̀lù fi Sáàmù yìí kan àjíǹde Jésù ní tààrà. Lílo lẹ́tà ńlá fún “Ẹni Mímọ́” ń fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká yìí hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ “ẹni olóòótọ́” mọ́.
- issue: Fífi orúkọ tí kò hàn lẹ́yìn ἐν ἑτέρῳ kún ọ̀rọ̀
  choice: nínú sáàmù mìíràn
  alternative: ní ibòmíràn; nínú ẹsẹ Ìwé Mímọ́ mìíràn
  rationale: Gíríìkì sọ ní ṣókí pé “nínú òmíràn.” Nítorí àyọlò náà wá láti Sáàmù 16, “sáàmù” ń mú un yé òǹkàwé láìfi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn náà pa ìrísí àyọlò Sáàmù mọ́, ṣùgbọ́n “sáàmù” ni a fi kún ἐν ἑτέρῳ láti mú ohun tí Gíríìkì fi sílẹ̀ láìsọ ṣe kedere.
