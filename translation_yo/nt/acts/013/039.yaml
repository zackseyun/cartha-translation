  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: yo
  text: Nínú rẹ̀ ni a dá olúkúlùkù ẹni tí ó gbàgbọ́ láre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípasẹ̀ ẹni yìí ni a dá olúkúlùkù ẹni tí ó gbàgbọ́ láre.” A lè tú gbólóhùn Gíríìkì ἐν τούτῳ ní ọ̀nà tó túbọ̀ tẹ̀lé ọ̀rọ̀ rẹ̀ pé “nínú/nípasẹ̀ ẹni yìí”; ó ń tọ́ka sí Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí Jésù nínú àyíká ọ̀rọ̀, “Nínú rẹ̀” sì jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ìbáṣepọ̀ ἐν mọ́ láìfi ìtumọ̀ tuntun kún un.
- source_word: πᾶς ὁ πιστεύων
  choice: olúkúlùkù ẹni tí ó gbàgbọ́
  rationale: Èyí fi hàn pé ọ̀rọ̀ náà kan gbogbo ẹni kọ̀ọ̀kan tí ó gbàgbọ́, ó sì sọ ipa àkókò-ìsinsìnyí ti participle náà ní Yorùbá àdánidá.
- source_word: δικαιοῦται
  choice: a ti dá ... láre
  rationale: “Dá ... láre” pa ìtumọ̀ ilé-ẹjọ́ ti δικαιόω mọ́. Ìlò “a” aláìdárúkọ ṣe iṣẹ́ passive ní Yorùbá, “ti” sì fi ipò ìdáláre tí ẹni náà wà nínú rẹ̀ hàn láìsọ ọ́ di ìyípadà ìwà.
theological_decisions:
- issue: Ohun tí ἐν τούτῳ ń tọ́ka sí
  choice: 'Ó tọ́ka sí Jésù gẹ́gẹ́ bí ẹni: “Nínú rẹ̀”'
  alternative: “Nípasẹ̀ ẹni yìí” tàbí “Nínú ẹni yìí”
  rationale: Àyíká ọ̀rọ̀ tó ṣáájú ń sọ nípa Jésù gẹ́gẹ́ bí ẹni tí a fi ń kéde ìdáríjì. Síbẹ̀, àlàyé ìsàlẹ̀ ojú-ewé pa ọ̀nà ìtumọ̀ irinṣẹ́ “nípasẹ̀” mọ́.
- issue: Ìtumọ̀ δικαιοῦται nínú àyíká ọ̀rọ̀ Páùlù
  choice: 'ìtumọ̀ ilé-ẹjọ́: “a ti dá ... láre”'
  alternative: “a ti kéde rẹ̀ ní olódodo” tàbí “a ti mú un padà sí ipò tó tọ́”
  rationale: “Dá ... láre” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́ nípa ìdájọ́, ó sì pa ìyàtọ̀ tó wà láàárín ìdáláre àti ìyípadà ìwà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “dá ... láre” fún àwòrán ilé-ẹjọ́, a sì fi àmì ohùn kún ọ̀rọ̀ níbi tí ó ti yẹ.
