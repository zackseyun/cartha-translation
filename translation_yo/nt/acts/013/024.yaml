id: ACT.13.24
reference: Acts 13:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: yo
  text: Ṣáájú dídé rẹ̀[a], Jòhánù ti kéde ìbatisí ìrònúpìwàdà[b] fún gbogbo ènìyàn Ísírẹ́lì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣáájú ìwàlẹ̀ rẹ̀.” Ní ọ̀rọ̀ gangan, Gíríìkì ní, “níwájú ìwọlé rẹ̀”; àpólà náà túmọ̀ sí ṣáájú dídé ẹnì kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìbatisí fún ìrònúpìwàdà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: ti kéde
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìkéde ní gbangba tí Jòhánù ṣe ṣáájú; ‘ti kéde’ jẹ́ èdè Yorùbá àdánidá, nígbà tí gbólóhùn ‘Kí ó tó dé’ ti fi bí ìṣẹ̀lẹ̀ náà ṣe ṣáájú hàn.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: Kí ó tó dé
  rationale: Èyí mú ìtumọ̀ àpólà Gíríìkì náà jáde gẹ́gẹ́ bí ṣíṣe ohun kan ṣáájú dídé ẹnì kan, láì tú u ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ tí kò ní dùn bí Yorùbá.
- source_word: εἰσόδου
  choice: dé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí dídé tàbí wíwọlé ẹni tí a ń retí; ‘dé’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àyíká mu.
- source_word: βάπτισμα μετανοίας
  choice: ìbatisí ìrònúpìwàdà
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ ọ̀rọ̀ orúkọ méjèèjì mọ́, kò sì pinnu bóyá ìrònúpìwàdà ni ìbatisí náà ń fi hàn tàbí bóyá ó ń darí sí i.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: fún gbogbo ènìyàn Ísírẹ́lì
  rationale: Ó pa ìtumọ̀ ‘gbogbo’ àti ti Ísírẹ́lì gẹ́gẹ́ bí ènìyàn kan mọ́, ó sì jẹ́ àdánidá lẹ́yìn ‘kéde’ ní Yorùbá.
- source_word: Ἰωάννου
  choice: Jòhánù
  rationale: Èyí ni àkọsílẹ̀ orúkọ John tí ó wọ́pọ̀ nínú Yorùbá Bíbélì.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ αὐτοῦ (‘ó’) ń tọ́ka sí nínú ‘Kí ó tó dé’
  choice: A pa arọ́pò-orúkọ ‘ó’ mọ́; nínú àyíká Ìṣe 13:23–25, ó ń tọ́ka sí Jésù, Olùgbàlà láti inú ìran Dáfídì.
  alternative: Kí a fi orúkọ ‘Jésù’ kún un ní tààrà.
  rationale: Gíríìkì kò tún orúkọ Jésù sọ nínú ẹsẹ yìí. Arọ́pò-orúkọ Yorùbá pa ìtọ́kasí inú àyíká àti ìṣọ́ra ọ̀rọ̀ orísun mọ́ láì fi àlàyé kún ẹsẹ náà.
- issue: Ìbáṣepọ̀ nínú βάπτισμα μετανοίας
  choice: ìbatisí ìrònúpìwàdà
  alternative: ìbatisí fún ìrònúpìwàdà
  rationale: Ẹ̀yà genitive Gíríìkì lè jẹ́ kí ìbáṣepọ̀ náà ní ìtumọ̀ tó ju ọ̀kan lọ. Ìtumọ̀ àkọ́kọ́ pa ìbáṣepọ̀ yẹn mọ́; àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kéde’ mú ìtumọ̀ ìpolongo ní gbangba jáde; a pa arọ́pò-orúkọ mọ́ dípò fífi ‘Jésù’ kún ọ̀rọ̀ orísun.
