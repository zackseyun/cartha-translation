- from: Nítorí àwọn tí ń gbé ní Jerúsálẹ́mù àti àwọn olórí wọn kò mọ ẹni yìí, nípa dídá a lẹ́bi, wọ́n sì mú ohùn àwọn wòlíì tí a ń kà ní gbogbo ọjọ́ Ìsinmi ṣẹ̀,[a]
  to: Nítorí àwọn tí ń gbé ní Jerúsálẹ́mù àti àwọn olórí wọn kò mọ ẹni yìí; nípa dídá a lẹ́bi, wọ́n mú ohùn àwọn wòlíì tí a ń kà ní gbogbo ọjọ́ Ìsinmi ṣẹ̀,[a]
  rationale: A tún ṣètò gbolohun náà kí ìṣe àkọ́kọ́, ‘wọ́n mú ... ṣẹ̀,’ lè tẹ̀lé ìdámọ̀-kò-mọ̀ wọn ní kedere, àti kí ‘nípa dídá a lẹ́bi’ máa ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà tí wọ́n fi mú ohùn àwọn wòlíì ṣẹ̀. Ìtumọ̀, ìtọ́ka sí Jésù, àti ìbáṣepọ̀ ìmúṣẹ náà kò yí. A tún ṣàtúnṣe gbolohun footnote sí Yorùbá tó péye.
