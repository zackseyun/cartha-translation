  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń gbé àwọn apá pàtàkì Gíríìkì kalẹ̀ dáadáa: γάρ, àwọn olùgbé Jerúsálẹ́mù àti àwọn olórí wọn, atọ́ka náà ‘ẹni yìí,’ àìdámọ̀, ìdájọ́, àti ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀. Síbẹ̀, ìṣètò gbolohun lọwọ́lọwọ̀—‘kò mọ ..., nípa dídá a lẹ́bi, wọ́n sì mú ...’—ní ìfarapa ìṣọ̀kan kókó-ọrọ̀ àti ìbáṣepọ̀ participle sí ìṣe àkọ́kọ́. Àtúnṣe náà jẹ́ kí ‘nípa dídá a lẹ́bi’ ṣe kedere gẹ́gẹ́ bí ọ̀nà ìmúṣẹ náà.'
  naturalness: Àtúnṣe pẹ̀lú àmi ìdádúró-lẹ́ẹ̀mejì (;) jẹ́ Yorùbá òde òní tí ó rọrùn láti ka, ó sì jẹ́ kí ‘wọ́n’ tó ń ṣe ìṣe àkọ́kọ́ ‘mú ... ṣẹ̀’ hàn kedere. A tún ṣe àtúnṣe gbolohun àlàyé ẹsẹ̀-àlàyé láti jẹ́ Yorùbá àdánidá.
  terminology: ‘Àwọn olórí wọn,’ ‘ẹni yìí,’ ‘ọjọ́ Ìsinmi,’ àti ‘mú ... ṣẹ̀’ yẹ. A lo ‘ohùn àwọn wòlíì’ gẹ́gẹ́ bí ọ̀rọ̀ apapọ̀ tí ó lè ṣojú àwọn φωναί, nígbà tí ẹsẹ̀-àlàyé ń fún ‘ọ̀rọ̀’ ní yíyàn àdánidá. ‘Ní ti gidi’ dára ju ‘Ní gígún’ lọ fún ìtọ́kasí ìtumọ̀ tààrà.
