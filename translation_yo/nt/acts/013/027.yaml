id: ACT.13.27
reference: Acts 13:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: yo
  text: Nítorí àwọn tí ń gbé ní Jerúsálẹ́mù àti àwọn olórí wọn kò mọ ẹni yìí; nípa dídá a lẹ́bi, wọ́n mú ohùn àwọn wòlíì tí a ń kà ní gbogbo ọjọ́ Ìsinmi ṣẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ àwọn wòlíì.” Ní ti gidi, “ohùn àwọn wòlíì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: àwọn tí ń gbé ní Jerúsálẹ́mù
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹgbẹ́ àwọn olùgbé, ó sì pa ìtumọ̀ κατοικέω mọ́.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: àwọn olórí wọn
  rationale: “Àwọn olórí” lè tọ́ka sí àwọn aṣáájú àti àwọn aláṣẹ ìjọba tàbí ìdájọ́ ní àyíká ọ̀rọ̀ yìí.
- source_word: τοῦτον
  choice: ẹni yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka Gíríìkì mọ́, tí ó ń tọ́ka sí Jésù ní pàtó, dípò lílo arọ́pò-orúkọ lásán.
- source_word: ἀγνοήσαντες
  choice: kò mọ ẹni yìí
  rationale: Nínú àyíká ọ̀rọ̀ náà, ó túmọ̀ sí pé wọn kò mọ ẹni tí Jésù jẹ́ ní tòótọ́; kò fi dandan sọ pé wọn kò mọ̀ pé ó wà.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: ohùn àwọn wòlíì
  rationale: “Ohùn” pa àwòrán gidi φωνάς mọ́, ó sì lè dúró fún ẹ̀rí tàbí ọ̀rọ̀ àwọn wòlíì tí a ń gbọ́ nígbà kíkà Ìwé Mímọ́.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: tí a ń kà ní gbogbo ọjọ́ Ìsinmi
  rationale: Ó jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún àṣà kíkà ọ̀rọ̀ àwọn wòlíì ní Sábáàtì kọ̀ọ̀kan.
- source_word: κρίναντες
  choice: nípa dídá a lẹ́bi
  rationale: Níbí, κρίναντες ń tọ́ka sí ìdájọ́ tí ó dá Jésù lẹ́bi, “nípa” sì mú ìbáṣepọ̀ ọ̀nà tí ìmúṣẹ náà gbà ṣẹlẹ̀ hàn.
- source_word: ἐπλήρωσαν
  choice: wọ́n sì mú ... ṣẹ̀
  rationale: “Mú ... ṣẹ̀” ni ọ̀nà Yorùbá àdánidá fún ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń ṣàlàyé gbólóhùn tí ó ṣáájú.
theological_decisions:
- issue: Irú àìmọ̀ tí a sọ nípa Jésù
  choice: kò mọ ẹni yìí
  alternative: wọn kò mọ̀ ọ́n / wọn jẹ́ aláìmọ̀ nípa rẹ̀
  rationale: 'Yíyan yìí pa ìforígbárí inú ọ̀rọ̀ mọ́: wọn mọ Jésù gẹ́gẹ́ bí ẹni tí ó wà, ṣùgbọ́n wọn kò dá ẹni tí ó jẹ́ mọ̀; kò sọ àìmọ̀ pátápátá tàbí yọ ẹ̀bi wọn kúrò.'
- issue: Ìbáṣepọ̀ ìdájọ́ wọn sí ìmúṣẹ ọ̀rọ̀ àwọn wòlíì
  choice: nípa dídá a lẹ́bi ... wọ́n sì mú ... ṣẹ̀
  alternative: wọ́n dá a lẹ́bi, wọ́n sì mú ... ṣẹ̀
  rationale: '“Nípa” pa agbára ohun èlò tàbí ọ̀nà tí participle κρίναντες lè ní mọ́: ìdájọ́ wọn gan-an ló mú ọ̀rọ̀ àwọn wòlíì ṣẹ̀.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “ọjọ́ Ìsinmi” fún Sábáàtì, “ẹni yìí” láti pa atọ́ka mọ́, àti “ohùn” láti tọ́jú àwòrán Gíríìkì. Àmì ìdákẹ́jẹ ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
