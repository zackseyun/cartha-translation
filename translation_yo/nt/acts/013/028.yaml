  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé wọn kò rí ẹ̀sùn kankan tí ó yẹ fún ìdájọ́ ikú[a], wọ́n bẹ Pílátù pé kí a pa á[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpìlẹ̀ òfin kankan fún ìdájọ́ ikú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a fi ikú pa á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: ẹ̀sùn kankan tí ó yẹ fún ikú
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, αἰτία lè túmọ̀ sí ẹ̀sùn tàbí ìpìlẹ̀ òfin fún ìdájọ́. Gbólóhùn yìí sọ ní Yorùbá àdánidá pé wọn kò rí ẹ̀sùn tí ó tó láti dá ẹni náà lẹ́bi ikú.
- source_word: εὑρόντες
  choice: Bí ó tilẹ̀ jẹ́ pé wọn kò rí
  rationale: 'Ọ̀rọ̀ aláìlópìn aorist náà ṣáájú ìṣe pàtàkì, ó sì ní agbára ìyàtọ̀ nínú àyíká ọ̀rọ̀: bó tilẹ̀ jẹ́ pé wọn kò rí ẹ̀sùn tó yẹ, síbẹ̀ wọn béèrè ikú rẹ̀.'
- source_word: ᾐτήσαντο
  choice: wọn bẹ
  rationale: Bẹ̀ nínú àyíká yìí túmọ̀ sí ṣíṣe ìbéèrè sí aláṣẹ; ó jẹ́ Yorùbá àdánidá, ó sì yẹ fún ìtàn náà.
- source_word: Πιλᾶτον
  choice: Pílátù
  rationale: A kọ orúkọ ẹni náà ní ìrísí tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: pé kí a pa á
  rationale: Nínú àyíká ìdájọ́ yìí, ἀναιρέω túmọ̀ sí pípa ẹni tàbí mímú kí a pa á. Ìṣètò aláìdárúkọ ‘kí a pa á’ pa passive Gíríìkì mọ́, kò sì sọ ẹni tó máa ṣe e ní pàtó.
- source_word: καὶ
  choice: —
  rationale: A kò fi ọ̀rọ̀ asopọ̀ ọ̀tọ̀ sí iwájú ẹsẹ yìí; ìṣètò ‘Bí ó tilẹ̀ jẹ́ pé …, wọn …’ ń bá ìtàn lọ ní Yorùbá àdánidá, ó sì gbé ìyàtọ̀ inú καὶ àti participle náà hàn.
theological_decisions:
- issue: Bóyá kí a sọ agbára ìyọ̀ǹda inú participle náà ní kedere
  choice: Bí ó tilẹ̀ jẹ́ pé wọn kò rí …, wọn bẹ …
  alternative: Wọn kò rí …, wọ́n sì bẹ …
  rationale: 'Gíríìkì fi participle àyíká lò, ṣùgbọ́n àyíká ọ̀rọ̀ fi ìtakora hàn: wọn béèrè pé kí a pa á láìrí ẹ̀sùn tó yẹ fún ikú. Ìtumọ̀ yìí pa ìtakora ìtàn àti ìwà náà mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀sùn tí ó yẹ fún ikú’ láti mú àyíká òfin hàn, a sì lo ‘kí a pa á’ láti pa ìrísí passive àti ìtumọ̀ ikú mọ́.
