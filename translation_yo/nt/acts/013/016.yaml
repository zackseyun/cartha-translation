id: ACT.13.16
reference: Acts 13:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: yo
  text: Pọ́ọ̀lù sì dìde, ó fi ọwọ́ ṣe àmì, ó ní, “Ẹ̀yin ọkùnrin Ísírẹ́lì àti ẹ̀yin tí ẹ ń bẹ̀rù Ọlọ́run[a], ẹ gbọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ̀yin olùbẹ̀rù Ọlọ́run.” Ó ṣeé ṣe kí gbólóhùn yìí tọ́ka sí àwọn Kèfèrí tó ń sin Ọlọ́run tí wọ́n sì ń dara pọ̀ mọ́ sínágọ́gù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe bí Pọ́ọ̀lù ṣe dìde ní ti ara kí ó tó bẹ̀rẹ̀ sí í sọ̀rọ̀; “dìde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe náà mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kò sì fi ìtakò líle hàn; “sì” ni ọ̀nà Yorùbá àdánidá láti so ìṣe yìí mọ́ ohun tó ṣáájú.
- source_word: κατασείσας τῇ χειρὶ
  choice: fi ọwọ́ ṣe àmì
  rationale: Gbólóhùn náà ń tọ́ka sí àmì tí a fi ọwọ́ ṣe láti pe àfiyèsí tàbí láti mú kí àwọn ènìyàn dákẹ́; ìtumọ̀ yìí kò fi kún un pé ó ń ju ọwọ́ kiri.
- source_word: εἶπεν
  choice: ó ní
  rationale: “Ó ní” jẹ́ ọ̀nà Yorùbá àdánidá àti ọ̀wọ̀ láti ṣáájú ọ̀rọ̀ tí a fa yọ tààrà.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin ọmọ Ísírẹ́lì
  rationale: Ìtumọ̀ yìí pa ìpè akọ ἄνδρες àti ìdánimọ̀ àwọn ọmọ Ísírẹ́lì mọ́ láì sọ ọ́ di ọ̀rọ̀ gbogbogbò.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: ẹ̀yin tí ẹ̀ ń bẹ̀rù Ọlọ́run
  rationale: Ìtumọ̀ yìí pa ìṣe tí participle náà ń sọ mọ́, ó sì ṣe kedere fún òǹkàwé; ó tún yẹra fún lílo orúkọ ẹgbẹ́ kan gẹ́gẹ́ bí ẹni pé Gíríìkì fi dandan sọ bẹ́ẹ̀.
- source_word: ἀκούσατε
  choice: ẹ fetí sílẹ̀
  rationale: Àṣẹ yìí ń pè fún gbígbọ́ pẹ̀lú àfiyèsí; “ẹ fetí sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ní ìwọ̀ntúnwọ̀nsì.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìpè sí àwọn ọmọ Ísírẹ́lì àti ẹgbẹ́ kejì tí wọ́n ń bẹ̀rù Ọlọ́run nínú sínágọ́gù
  choice: “Ẹ̀yin ọkùnrin ọmọ Ísírẹ́lì àti ẹ̀yin tí ẹ̀ ń bẹ̀rù Ọlọ́run”
  alternative: “Ẹ̀yin ọkùnrin ọmọ Ísírẹ́lì àti ẹ̀yin olùbẹ̀rù Ọlọ́run”
  rationale: Gíríìkì ya àwọn ọmọ Ísírẹ́lì sọ́tọ̀ sí ẹgbẹ́ kan, ó sì ṣàpèjúwe ẹgbẹ́ kejì gẹ́gẹ́ bí àwọn tí wọ́n ń bẹ̀rù Ọlọ́run. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́, ṣùgbọ́n kò fi dandan pinnu nínú ọ̀rọ̀ pàtàkì pé gbogbo ẹgbẹ́ kejì jẹ́ Kèfèrí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ gbólóhùn tí ó ń ṣàlàyé, dípò lẹ́gbẹ̀ẹ́ “dìde.”
