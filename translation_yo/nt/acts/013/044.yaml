source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: yo
  text: Ní ọjọ́ Ìsinmi tó tẹ̀ lé e[a], ó fẹ́rẹ̀ẹ́ jẹ́ pé gbogbo àwọn ará ìlú náà péjọ láti gbọ́ ọ̀rọ̀ Olúwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọjọ́ Ìsinmi tó ń bọ̀,” tàbí “Ní ọjọ́ Ìsinmi tí ó tẹ̀ lé e.”
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀rọ̀ Olúwa” tún lè túmọ̀ sí “ìhìn iṣẹ́ Olúwa” tàbí, gẹ́gẹ́ bí àyíká ọ̀rọ̀, “ìhìn iṣẹ́ nípa Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Ní ọjọ́ Ìsinmi tó tẹ̀ lé e
  rationale: Gbólóhùn dátífù pẹ̀lú ἐρχομένῳ ń tọ́ka sí àkókò, ìyẹn ọjọ́ Ìsinmi tó ń bọ̀ tàbí tó tẹ̀ lé e. Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì bá ọ̀rọ̀ inú àyíká mu.
- source_word: σχεδὸν
  choice: ó fẹ́rẹ̀ẹ́ jẹ́ pé
  rationale: σχεδόν túmọ̀ sí ‘ó fẹ́rẹ̀ẹ́’ tàbí ‘ó kù díẹ̀ ká tó lè sọ pé’; ọ̀nà yìí mú kí ìsọ pé gbogbo ìlú péjọ má dà bí ohun tí ó kan olúkúlùkù láìsí àyọkúrò.
- source_word: πᾶσα ἡ πόλις
  choice: gbogbo àwọn ará ìlú náà
  rationale: Ìtumọ̀ náà ń tọ́ka sí àwọn olùgbé ìlú, kì í ṣe àwọn ilé tàbí agbègbè ìlú fúnra rẹ̀. Fífi ‘àwọn ará ìlú’ hàn jẹ́ kedere àti àdánidá ní Yorùbá.
- source_word: συνήχθη
  choice: péjọ
  rationale: Ọ̀rọ̀ náà níhìn-ín túmọ̀ sí pé àwọn ènìyàn kóra jọ sí ibi kan. ‘Péjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì pa ìtumọ̀ àpapọ̀ mọ́.
- source_word: ἀκοῦσαι
  choice: láti gbọ́
  rationale: Infinitive náà sọ ète ìpéjọpọ̀ wọn. ‘Láti gbọ́’ ni ìtumọ̀ tààrà tó bójú mu.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀
  rationale: λόγος lè túmọ̀ sí ọ̀rọ̀ tàbí ìhìn iṣẹ́. ‘Ọ̀rọ̀’ pa ọ̀nà ìlò tí Lúùkù máa ń lò fún ìkéde ìhìn rere mọ́ láìtúmọ̀ rẹ̀ ju bó ṣe wà lọ.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Genitive náà di ‘ọ̀rọ̀ Olúwa’ ní Yorùbá, ó sì pa àjọṣe tó lè túmọ̀ sí ọ̀rọ̀ tí ó jẹ́ ti Olúwa, tí ó wá láti ọ̀dọ̀ rẹ̀, tàbí tó jẹ mọ́ ọn mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀, tó ní iyì, tí kò sì dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù ju ohun tí ẹsẹ̀ náà sọ lọ.
- issue: Ìtumọ̀ ‘τὸν λόγον τοῦ κυρίου’
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀ Olúwa’
  alternative: ìhìn iṣẹ́ Olúwa; ìhìn iṣẹ́ nípa Olúwa
  rationale: Genitive Gíríìkì náà lè ní àwọn ìtumọ̀ tó yí ara wọn ká. ‘Ọ̀rọ̀ Olúwa’ pa àìdánilójú tòótọ́ àti ìlò ẹ̀kọ́ ìgbàgbọ́ Lúùkù mọ́, dípò yíyan ìtumọ̀ kan ṣoṣo fún un.
translation_notes:
  register: Yorùbá àpéwọ̀n, tó ní àmì ohùn níbi tó yẹ, tí ó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Àwọn ará ìlú’ mú ẹni tí πᾶσα ἡ πόλις ń tọ́ka sí hàn kedere; ‘péjọ’ sì jẹ́ ọ̀rọ̀ àdánidá fún συνήχθη.
