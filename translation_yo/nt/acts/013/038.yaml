  source_fidelity: Àwòkọ́ṣe náà ṣàfihàn ìkéde ìdáríjì nípasẹ̀ Jésù dáadáa, ṣùgbọ́n ‘a kò lè dá yín láre’ yí olùfaragba passive Gíríìkì padà sí ẹni-ṣe (‘we could not justify you’). Ìtúnṣe náà lo ‘ẹ kò lè rí ìdáláre,’ èyí tí ó pa ìtumọ̀ passive mọ́. A kò fi gbolóhùn ìbẹ̀rẹ̀ Ìṣe 13:39 kún ẹsẹ̀ náà, nítorí kò sí nínú ọ̀rọ̀ SBLGNT tí a pèsè fún ìfẹ̀sẹ̀mulẹ̀ yìí, bí ó tilẹ̀ jẹ́ pé ó wà nínú ìtẹ̀síwájú Gẹ̀ẹ́sì.
  naturalness: ‘Ẹ̀yin ará’ jẹ́ ìpè Yorùbá tó rọrùn, tó ní iyì, tí ó sì dára ju ‘ẹ̀yin ará ọkùnrin’ lọ, èyí tí kò wọ́pọ̀ nínú Yorùbá òde òní. A tún yọ ìtúnsọ ‘kúrò nínú’ tí ó jẹ́ àjẹkù nínú gbolóhùn Yorùbá.
  terminology: ‘Ìdáríjì ẹ̀ṣẹ̀’ àti ‘ìdáláre’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún ἄφεσις ἁμαρτιῶν àti δικαιωθῆναι. ‘Ìdáláre’ dá ìtumọ̀ ìdájọ́/ìkéde olódodo mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan lélẹ̀.
