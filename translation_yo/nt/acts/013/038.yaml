  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará[a], ẹ jẹ́ kí ó di mímọ̀ fún yín pé nípasẹ̀ ẹni yìí[b] ni a ń kéde ìdáríjì ẹ̀ṣẹ̀ fún yín; àti nínú gbogbo ohun tí ẹ kò lè rí ìdáláre[c] nípasẹ̀ òfin Mósè…[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ìpè náà jẹ́ ‘ẹ̀yin ọkùnrin, ará.’ ‘Ẹ̀yin ará’ jẹ́ ìpè Yorùbá àdánidá; ó lè kan gbogbo àwùjọ tí a ń bá sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni Jésù, ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
    reason: cross_reference
  - marker: c
    text: Tàbí, ‘jẹ́ ẹni tí a kéde pé ó jẹ́ olódodo.’
    reason: lexical_alternative
  - marker: d
    text: Ìkọ́lé Gíríìkì ń bá a lọ sí Ìṣe 13:39. Ọ̀rọ̀ ìtẹ̀síwájú náà kò sí nínú àyọkà orísun tí a pèsè fún ẹsẹ̀ yìí.
    reason: source_boundary
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Nítorí náà, ẹ jẹ́ kí ó di mímọ̀ fún yín
  rationale: Ó pa οὖν mọ́ gẹ́gẹ́ bí ìsopọ̀ ìparí, ó sì fi agbára ọ̀rọ̀ àṣẹ aláìlẹ́ni-pàtó γνωστὸν ... ἔστω hàn ní Yorùbá àdánidá.
- source_word: ἄνδρες ἀδελφοί
  choice: ẹ̀yin ará ọkùnrin
  rationale: Ó pa ìpe ọ̀rọ̀ àti àpẹẹrẹ akọ nínú Gíríìkì mọ́. Àkọsílẹ̀ ìsàlẹ̀ fi àǹfààní ìtumọ̀ tí ó lè kan gbogbo àwùjọ hàn.
- source_word: διὰ τούτου
  choice: nípasẹ̀ ẹni yìí
  rationale: ‘Ẹni yìí’ tọ́ka sí ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ìyẹn Jésù, láìfi ọ̀rọ̀ ‘ọkùnrin’ kún Gíríìkì.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: ìdáríjì àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ jù lọ láti sọ ìdáríjì ẹ̀ṣẹ̀.
- source_word: καταγγέλλεται
  choice: ni a ń kéde ... fún yín
  rationale: Ìkọ́lé aláìlẹ́ni-pàtó ‘a ń kéde’ jẹ́ ọ̀nà Yorùbá àdánidá fún passive, ó sì pa ìtumọ̀ ìkéde ní gbangba mọ́.
- source_word: ἀπὸ πάντων ὧν
  choice: kúrò nínú gbogbo ohun ... kúrò nínú wọn
  rationale: Àtúnlò ‘kúrò nínú’ pa àjọṣe ἀπό ... ὧν mọ́, bí ó tilẹ̀ jẹ́ pé àyọkà orísun tí a pèsè dá dúró láàárín gbólóhùn.
- source_word: οὐκ ἠδυνήθητε
  choice: a kò lè ... yín
  rationale: Ìkọ́lé yìí sọ àìlera tàbí àìṣeéṣe tí δύναμαι ń fi hàn ní Yorùbá tó ṣe kedere.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: nípasẹ̀ òfin Mósè
  rationale: ‘Nípasẹ̀’ fi ipa ohun èlò tàbí ọ̀nà tí ἐν ní nínú àyíká yìí hàn, dípò ìtumọ̀ ibi lasán.
- source_word: δικαιωθῆναι
  choice: dá yín láre
  rationale: ‘Dá ... láre’ pa agbára ìdájọ́ àti ẹ̀kọ́ ìgbàgbọ́ ti δικαιόω mọ́, láìdín un kù sí yíyí ìwà ẹni padà nìkan.
theological_decisions:
- issue: Ìtumọ̀ δικαιωθῆναι ní ìbáṣepọ̀ pẹ̀lú òfin Mósè
  choice: dá yín láre
  alternative: kéde pé ẹ jẹ́ olódodo
  rationale: ‘Dá ... láre’ jẹ́ ọ̀rọ̀ Yorùbá tó lè gbé ìtumọ̀ ìdájọ́ àti ìtẹ́wọ́gbà Ọlọ́run, láìyanju gbogbo àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà.
- issue: Àpẹẹrẹ akọ nínú ἄνδρες ἀδελφοί
  choice: ẹ̀yin ará ọkùnrin
  alternative: ẹ̀yin ará
  rationale: Ọ̀rọ̀ pàtàkì pa àpẹẹrẹ akọ Gíríìkì mọ́; àkọsílẹ̀ ṣàlàyé pé ìpe náà lè ní gbogbo àwọn tó péjọ nínú.
- issue: Ààlà ẹsẹ àti gbólóhùn nínú orísun tí a pèsè
  choice: Fi àmì gígùn hàn pé gbólóhùn náà kò parí
  alternative: Fi gbólóhùn ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται tí kò sí nínú àyọkà Gíríìkì tí a pèsè kún un
  rationale: Kí ìtumọ̀ má bàa gbé ọ̀rọ̀ tí kò sí nínú ẹ̀rí orísun tí a fi ránṣẹ́ wọlé. Àkọsílẹ̀ sọ gbangba pé èrò náà ń bá a lọ ní 13:39.
translation_notes:
  register: 'Yorùbá ìpele àárín tó ní iyì ni a lò: ó yẹ fún kíkà ní gbangba, ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ. Ìkọ́lé apá ìkẹyìn mọ̀ọ́mọ̀ dúró gẹ́gẹ́ bí àyọkà orísun tí a pèsè, dípò fífi gbólóhùn tí kò sí nínú rẹ̀ kún un.'
