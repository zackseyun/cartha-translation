id: ACT.13.46
reference: Acts 13:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: yo
  text: Nígbà náà ni Pọ́ọ̀lù àti Bánábà fi ìgboyà sọ pé, “Ó jẹ́ dandan kí a kọ́kọ́ sọ ọ̀rọ̀ Ọlọ́run fún yín. Níwọ̀n bí ẹ ń kọ̀ ọ́ sílẹ̀, tí ẹ sì ń dá ara yín lẹ́jọ́ pé ẹ kò yẹ fún ìyè àìnípẹ̀kun, ẹ wò ó, à ń yí padà sí àwọn tí kì í ṣe Júù[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn orílẹ̀-èdè.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù, ní ìyàtọ̀ sí àwọn olùgbọ́ inú sínágọ́gù.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: fi ìgboyà sọ
  rationale: Ó fi ìgboyà àti ọ̀rọ̀ sísọ ní gbangba hàn, ó sì so participle náà pọ̀ mọ́ ọ̀rọ̀-ìṣe pàtàkì ní Yorùbá àdánidá.
- source_word: ἀναγκαῖον
  choice: pọndandan
  rationale: Ó sọ pé ohun náà ṣe pàtàkì tó bẹ́ẹ̀ tí kò fi yẹ kí a yàgò fún un; ó bá ìtumọ̀ necessity mu.
- source_word: πρῶτον λαληθῆναι
  choice: kí a kọ́kọ́ sọ
  rationale: Ìlò ẹni tí a kò dárúkọ nínú Yorùbá jẹ́ ọ̀nà àdánidá láti fi passive infinitive hàn, nígbà tí ‘kọ́kọ́’ pa ìṣáájú nínú ìtẹ̀lé mọ́.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa gbólóhùn Bíbélì tí a mọ̀ mọ́, ó sì túmọ̀ sí iṣẹ́ Ọlọ́run tí a ń kéde.
- source_word: ἀπωθεῖσθε αὐτὸν
  choice: ẹ ti ń kọ̀ ọ́ sílẹ̀
  rationale: Ó fi ìkọ̀sílẹ̀ tí ń lọ lọ́wọ́ hàn, pronoun náà sì tọ́ka padà sí ọ̀rọ̀ Ọlọ́run.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: ẹ sì ń dá ara yín lẹ́jọ́ pé ẹ kò yẹ
  rationale: Ó pa agbára reflexive àti àwọ̀ ìdájọ́ inú κρίνετε mọ́; àwọn olùgbọ́ fúnra wọn ni ìṣe náà ń tọ́ka sí.
- source_word: τῆς αἰωνίου ζωῆς
  choice: fún ìyè àìnípẹ̀kun
  rationale: ‘Yẹ fún’ jẹ́ ìsopọ̀ Yorùbá àdánidá, ‘ìyè àìnípẹ̀kun’ sì jẹ́ ìtumọ̀ kedere fún eternal life.
- source_word: ἰδοὺ
  choice: ẹ wò ó
  rationale: Ó pa ìpè láti kíyè sí ìyípadà pàtàkì tí ń bọ̀ mọ́.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: à ń yíjú sí àwọn Kèfèrí
  rationale: Present náà di ‘à ń yíjú’; ‘àwọn Kèfèrí’ fi ìyàtọ̀ láàárín àwọn Júù inú sínágọ́gù àti àwọn tí kì í ṣe Júù hàn.
theological_decisions:
- issue: Ìtumọ̀ τὰ ἔθνη nínú àyíká ìtàn ìgbàlà
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ fi àwọn olùgbọ́ Júù inú sínágọ́gù wé àwọn tí kì í ṣe Júù; àṣàyàn yìí pa ìyàtọ̀ ẹ̀yà náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan míì hàn.
- issue: Agbára οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: ẹ ń dá ara yín lẹ́jọ́ pé ẹ kò yẹ fún ìyè àìnípẹ̀kun
  alternative: Paulu ń kéde pé wọn kò yẹ fún ìyè àìnípẹ̀kun
  rationale: Gíríìkì fi ìṣe ìdájọ́ náà lé àwọn olùgbọ́ fúnra wọn lórí ní kedere; a kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ó kọjá ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò Yorùbá àdánidá mu, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan pàtó.
