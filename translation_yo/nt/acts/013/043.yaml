id: ACT.13.43
reference: Acts 13:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: yo
  text: Nígbà tí ìpàdé sínágọ́gù náà tú ká[a], ọ̀pọ̀ lára àwọn Júù àti àwọn tí wọ́n yí padà sí ẹ̀sìn Júù tí wọ́n jẹ́ olùfọkànsìn tẹ̀ lé Paulu àti Banaba. Bí àwọn méjèèjì sì ti ń bá wọn sọ̀rọ̀, wọ́n ń rọ̀ wọ́n[b] pé kí wọ́n máa bá a lọ nínú oore-ọ̀fẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí wọ́n tú àpéjọ sínágọ́gù náà ká.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn ènìyàn tí wọ́n péjọ, kì í ṣe ilé náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń yí wọn lọ́kàn pé kí wọ́n dúró nínú oore-ọ̀fẹ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Nígbà tí ìpàdé sínágọ́gù náà tú ká
  rationale: Ó fi hàn pé ìpàdé àwọn ènìyàn ló parí, kì í ṣe pé ilé sínágọ́gù ni a tú; gbólóhùn náà sì jẹ́ Yorùbá àdánidá fún bí àpéjọ ṣe parí.
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé
  rationale: Ó lè túmọ̀ sí lílọ tẹ̀ lé ẹnì kan ní ti ara tàbí ní ìtumọ̀ fífẹ̀; níbí, àwọn ènìyàn náà lọ tẹ̀ lé Paulu àti Banaba lẹ́yìn ìpàdé.
- source_word: τῶν σεβομένων προσηλύτων
  choice: àwọn aláwọ̀ṣe Júù olùfọkànsìn
  rationale: προσήλυτος ń tọ́ka sí àwọn tí wọ́n yí padà sí ẹ̀sìn Júù ní kíkún, kì í ṣe àwọn tó kàn nífẹ̀ẹ́ sí i; “olùfọkànsìn” sì ṣe àfihàn σεβομένων.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: Bí àwọn méjèèjì sì ti ń bá wọn sọ̀rọ̀
  rationale: Ó fi iṣẹ́ tí ń lọ lọ́wọ́ hàn, ó sì jẹ́ kedere pé Paulu àti Banaba ni olùsọ̀rọ̀.
- source_word: ἔπειθον
  choice: wọ́n ń rọ̀ wọ́n
  rationale: Àkókò imperfect fi ìṣe tí ń bá a lọ hàn; “ń rọ̀” bá ọ̀rọ̀ ìṣírí tàbí ìgbìyànjú láti yí wọn lọ́kàn mu ní àyíká yìí.
- source_word: αὐτοὺς προσμένειν
  choice: kí wọ́n máa bá a lọ
  rationale: Ó mú ìtumọ̀ títẹ̀síwájú tàbí dídúró ṣinṣin mú láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: nínú oore-ọ̀fẹ́ Ọlọ́run
  rationale: Ó pa àwòrán Gíríìkì ti wíwà tàbí títẹ̀síwájú nínú oore-ọ̀fẹ́ Ọlọ́run mọ́, láìdín ìtumọ̀ náà kù sí ẹ̀kọ́ pàtó kan.
theological_decisions:
- issue: Ìtumọ̀ τῇ χάριτι τοῦ θεοῦ nínú ìṣírí àwọn aposteli
  choice: kí wọ́n máa bá a lọ nínú oore-ọ̀fẹ́ Ọlọ́run
  alternative: kí wọ́n dúró nínú ojúrere Ọlọ́run; kí wọ́n máa tẹ̀síwájú nínú ìhìn iṣẹ́ nípa oore-ọ̀fẹ́ Ọlọ́run
  rationale: Gbólóhùn Gíríìkì lè gba iṣẹ́ oore-ọ̀fẹ́ Ọlọ́run àti ìgbésí ayé tí oore-ọ̀fẹ́ náà ń darí mọ́ra. Ìtumọ̀ yìí pa ìfẹ̀ tó wà nínú rẹ̀ mọ́ láìyanju rẹ̀ sí ẹ̀kọ́ ẹ̀sìn kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. “Sínágọ́gù” àti “aláwọ̀ṣe Júù” ń sọ àwọn ọ̀rọ̀ àṣà Júù di mímọ̀ fún òǹkàwé òde òní.
