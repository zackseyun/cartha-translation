id: ACT.13.1
reference: Acts 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: yo
  text: 'Ní Áńtíókù, nínú ìjọ tí ó wà níbẹ̀, àwọn wòlíì àti olùkọ́ni wà: Bárínábà, Síméónì ẹni tí wọ́n ń pè ní Niger[a], Lúkíù ará Kírénè[c], Mánáẹ́nì, alábàákẹ́gbẹ́ tímọ́tímọ́ Hẹ́rọ́dù olùṣàkóso agbègbè[b], àti Sáùlù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Niger” jẹ́ orúkọ Látìnì tí ó túmọ̀ sí “dúdú.” A pa á mọ́ gẹ́gẹ́ bí orúkọ dípò kí a túmọ̀ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí “ọmọ ìtọ́jú pẹ̀lú Hẹ́rọ́dù olùṣàkóso agbègbè” tàbí “ẹni tí a tọ́ dàgbà pọ̀ pẹ̀lú Hẹ́rọ́dù olùṣàkóso agbègbè.”
    reason: alternative_reading
  - marker: c
    text: Èyí túmọ̀ sí pé Lúkíù wá láti Kírénè ní Àríwá Áfíríkà.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: àwọn ... wà
  rationale: A lo ọ̀rọ̀ ìwàláàyè Yorùbá “wà” láti túmọ̀ ἦσαν. A kò fi δέ hàn lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ ọ̀rọ̀ kékeré tí ìṣàn gbólóhùn Yorùbá ti gbé jáde láìfi ìtakora kún un.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Ní Áńtíókù, nínú ìjọ tí ó wà níbẹ̀
  rationale: Èyí sọ ibi náà àti ìjọ àdúgbò náà ní Yorùbá àdánidá, ó sì pa ipa οὖσαν mọ́ nípasẹ̀ “tí ó wà níbẹ̀.”
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà tọ́ka sí àwùjọ àwọn onígbàgbọ́; “ìjọ” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ ní àyíká yìí.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: àwọn wòlíì àti olùkọ́ni
  rationale: Ìtumọ̀ tààrà yìí pa àwọn ipa iṣẹ́ méjèèjì mọ́ láìfi ètò ipò ìjọ ti ẹ̀sìn kan kún un.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Síméónì ẹni tí wọ́n ń pè ní Nígerì
  rationale: “Síméónì” tẹ̀lé orúkọ Gíríìkì, “ẹni tí wọ́n ń pè ní” sì fi participle καλούμενος hàn ní ọ̀nà Yorùbá àdánidá. A pa Nígerì mọ́ gẹ́gẹ́ bí orúkọ.
- source_word: Νίγερ
  choice: Nígerì
  rationale: Orúkọ àpèlé Látìnì ni; a kọ ọ́ ní ìrísí tó rọrùn fún olùkà Yorùbá dípò kí a túmọ̀ rẹ̀ sí “Dúdú” nínú àkọsílẹ̀ pàtàkì.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lúkíù ará Kírénè
  rationale: “Ará Kírénè” sọ ní kedere pé ẹni tí ó wá láti Kírénè ni, ó sì jẹ́ Yorùbá àdánidá ju títẹ̀lé àpèjúwe Gíríìkì lọ ní líle.
- source_word: Μαναήν
  choice: Mánáénì
  rationale: Àkọtọ̀ orúkọ náà ni a mú bá ìró Yorùbá mu.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Hẹ́rọ́dù olùṣàkóso agbègbè
  rationale: “Olùṣàkóso agbègbè” sọ iṣẹ́ oyè τετραάρχης ní ọ̀nà tí òǹkà Yorùbá òde òní lè lóye, láìfi orúkọ ìtàn “Antípà” tí kò sí nínú ẹsẹ náà kún un.
- source_word: σύντροφος
  choice: alábàákẹ́gbẹ́ tímọ́tímọ́
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ẹni tí a tọ́ dàgbà pọ̀ pẹ̀lú ẹlòmíràn tàbí alábàákẹ́gbẹ́ tímọ́tímọ́. Yíyan ọ̀rọ̀ tó gbòòrò yìí kò fi ìbátan pàtó tí ẹsẹ náà kò fìdí rẹ̀ múlẹ̀ kún un.
- source_word: Σαῦλος
  choice: Ṣọ́ọ̀lù
  rationale: Èyí ni ìrísí Yorùbá tó bá ìró orúkọ náà mu, ó sì yà á sọ́tọ̀ kedere sí Páùlù tí a máa ń pè é nígbà tó yá.
theological_decisions:
- issue: Irú ipa iṣẹ́ tí “àwọn wòlíì àti olùkọ́ni” ní nínú ìjọ Áńtíókù
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà tààrà gẹ́gẹ́ bí ipa iṣẹ́ tí a mọ̀ nínú ìjọ àdúgbò náà.
  alternative: Kí a fi wọ́n hàn gẹ́gẹ́ bí àwọn ipò àṣẹ ìjọ tí ó ní ìtumọ̀ imọ̀-ẹ̀sìn ti àkókò tó késí.
  rationale: Ẹsẹ náà dá àwọn ènìyàn kan mọ̀ sí wòlíì àti olùkọ́ni, ṣùgbọ́n kò ṣàlàyé ètò ipò ìjọ kan. Ìtumọ̀ náà kò gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan wọ inú rẹ̀.
- issue: Ìtumọ̀ σύντροφος nípa ìbátan Mánáénì àti Hẹ́rọ́dù
  choice: alábàákẹ́gbẹ́ tímọ́tímọ́
  alternative: ará ìtọ́jú kan náà; ẹni tí a tọ́ dàgbà pọ̀ pẹ̀lú Hẹ́rọ́dù
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà túmọ̀ sí pé a tọ́ àwọn méjèèjì dàgbà pọ̀, ṣùgbọ́n irú ìbátan pàtó náà kò dájú tó láti fi múlẹ̀ nínú àkọsílẹ̀ pàtàkì. Àlàyé ìsàlẹ̀ ojú ewé pa àwọn àṣàyàn náà mọ́.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkà òde òní, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A yan àwọn ọ̀rọ̀ bí “ìjọ,” “wòlíì,” àti “olùkọ́ni” tí wọ́n wọ́pọ̀, a sì yàgò fún èdè ẹgbẹ́ ẹ̀sìn kan pàtó. A gbé àmì àlàyé kọ̀ọ̀kan sí ọ̀rọ̀ tí ó ń ṣàlàyé.
