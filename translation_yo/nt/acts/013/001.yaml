  to: 'Ní Áńtíókù, nínú ìjọ tí ó wà níbẹ̀, àwọn wòlíì àti olùkọ́ni wà: Bárínábà, Síméónì ẹni tí wọ́n ń pè ní Niger[a], Lúkíù ará Kírénè[c], Mánáẹ́nì, alábàákẹ́gbẹ́ tímọ́tímọ́ Hẹ́rọ́dù olùṣàkóso agbègbè[b], àti Sáùlù.'
