id: ACT.13.52
reference: Acts 13:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì ń kún fún ayọ̀ àti Ẹ̀mí Mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Àwọn ọmọ-ẹ̀yìn náà sì kún fún ayọ̀ àti Ẹ̀mí Mímọ́.” Ọ̀rọ̀-ìṣe Gíríìkì lè fi ìkún tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε
  choice: náà sì
  rationale: Ìsopọ̀ yìí ń tẹ ìtàn tí ó ṣáájú lọ; ‘náà sì’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé àwọn ọmọ-ẹ̀yìn náà wà nínú ohun tí ìtàn ń sọ síwájú.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tí wọ́n ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀lé e; níbí, ó tọ́ka sí àwọn onígbàgbọ́.
- source_word: ἐπληροῦντο
  choice: ń kún fún
  rationale: Àpẹẹrẹ aláìpé àti ohùn ìfaragà Gíríìkì fi ìṣe tàbí ipò tí ó ń bá a lọ hàn. ‘Ń kún fún’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìkún tí ń tẹ̀ síwájú mọ́ láìfi dandan sọ bóyá ó jẹ́ lemọ́lemọ́ tàbí àtúnsẹ.
- source_word: χαρᾶς
  choice: fún ayọ̀
  rationale: Lẹ́yìn ‘kún,’ Yorùbá máa ń lo ‘fún’ láti sọ ohun tí ó kún inú ẹni; ‘ayọ̀’ ni ìtumọ̀ tààrà àti àdánidá ti χαρά.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Ní Ìṣe Àwọn Àpọ́sítélì, gbólóhùn náà sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run tó ń ṣiṣẹ́ nínú iṣẹ́ ìránṣẹ́ ìjọ. Àkọlé-nlá náà mú ìtọ́kasí ẹni pàtó yìí hàn ní ìlànà ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Bóyá πνεύματος ἁγίου yẹ kí ó túmọ̀ sí agbára tàbí ìwà mímọ́ lásán, tàbí sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni pàtó
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Lílo ọ̀rọ̀ náà káàkiri Ìṣe Àwọn Àpọ́sítélì àti àyíká iṣẹ́ ìránṣẹ́ níhìn-ín ń ṣètìlẹ́yìn fún ìtọ́kasí Ẹ̀mí Ọlọ́run, kì í ṣe ipò ẹ̀mí mímọ́ lásán.
- issue: Bóyá a ó sọ ìkún náà bí ìṣẹ̀lẹ̀ kan ṣoṣo tàbí bí ohun tí ń bá a lọ
  choice: ń kún fún
  alternative: kún fún
  rationale: Fọ́ọ̀mù aláìpé ἐπληροῦντο ń jẹ́ kí ìtumọ̀ ìṣe tàbí ipò tí ń bá a lọ ṣeé ṣe; ‘ń kún fún’ pa ìfarahàn yẹn mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àmi ohùn ní kíkún níbi tí ó ti yẹ. ‘Ń kún fún’ mú àpẹẹrẹ aláìpé Gíríìkì jáde ní ọ̀nà àdánidá.
