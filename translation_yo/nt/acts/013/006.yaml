id: ACT.13.6
reference: Acts 13:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti rìn gba gbogbo erékùṣù náà títí dé Páfọ̀, wọ́n rí ọkùnrin kan níbẹ̀, ẹni tí í ṣe onídán, wòlíì èké, àti Júù kan, tí orúkọ rẹ̀ ń jẹ́ Bárì-Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè kọ Bárì-Jésù sí Bárìjésù. Ó ṣeé ṣe kí orúkọ ilẹ̀ Sémítì yìí túmọ̀ sí ‘ọmọ Jésù’ tàbí ‘ọmọ Jóṣúà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες δὲ
  choice: Wọ́n sì la … kọjá
  rationale: Àkópọ̀ yìí mú ìtẹ̀síwájú ìtàn tí δέ ń fi hàn àti ìtumọ̀ διελθόντες gẹ́gẹ́ bí líla agbègbè kan kọjá. Ó tún jẹ́ kí ó yé akẹ́kọ̀ọ́ pé ìrìn-àjò náà ṣáájú rírí ọkùnrin náà.
- source_word: ὅλην τὴν νῆσον
  choice: gbogbo erékùṣù náà
  rationale: Èyí túmọ̀ gbólóhùn Gíríìkì náà ní tààrà, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n rin gba erékùṣù náà kọjá.
- source_word: ἄχρι Πάφου
  choice: títí dé Páfọ̀
  rationale: ἄχρι ń tọ́ka sí ibi tí ìrìn-àjò náà dé; ‘títí dé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ èyí.
- source_word: εὗρον ἄνδρα τινὰ
  choice: níbi tí wọ́n ti rí ọkùnrin kan
  rationale: ‘rí ọkùnrin kan’ pa ìtumọ̀ ìṣe εὗρον àti àìdánimọ̀ tí τινά ń fi hàn mọ́, láìfi ìtẹnumọ́ àjèjì kún un.
- source_word: μάγον
  choice: onídán
  rationale: Nínú àyíká ọ̀rọ̀ yìí, μάγος ń tọ́ka sí ẹni tó ń ṣe iṣẹ́ agbára òkùnkùn tàbí idán. ‘Onídán’ jẹ́ ọ̀rọ̀ tó ṣeé lóye, kò sì fi ìtumọ̀ tó ju ti Gíríìkì lọ kún un.
- source_word: ψευδοπροφήτην
  choice: wòlíì èké
  rationale: 'Èyí pa àlàyé méjèèjì mọ́: ọkùnrin náà ń pe ara rẹ̀ ní wòlíì, ṣùgbọ́n èké ni.'
- source_word: Ἰουδαῖον
  choice: Júù ni
  rationale: Ọ̀rọ̀ náà ń dá ọkùnrin náà mọ̀ gẹ́gẹ́ bí Júù; kò sí ohun nínú àyíká ọ̀rọ̀ tó béèrè ìtumọ̀ tó dín mọ́ olùgbé Jùdíà nìkan.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: orúkọ rẹ̀ sì ń jẹ́ Bárì-Jésù
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún gbólóhùn orúkọ náà. A kọ orúkọ náà ní ìró Yorùbá dípò títúmọ̀ àwọn apá inú rẹ̀.
theological_decisions:
- issue: Bí a ṣe máa kọ Βαριησοῦ
  choice: Bárì-Jésù
  alternative: Ọmọ Jésù; Bárìjésù
  rationale: Nínú ẹsẹ yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni. Nítorí náà, a ṣe àfọwọ́kọ ìró rẹ̀ dípò títúmọ̀ rẹ̀ sí ‘Ọmọ Jésù.’ Àmì àsopọ̀ náà ń ran òǹkàwé lọ́wọ́ láti rí ìṣètò orúkọ Semitic náà, ṣùgbọ́n àkọsílẹ̀ tí kò ní àmì àsopọ̀ tún ṣeé lò.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A yà àwọn àpèjúwe ọkùnrin náà sí gbólóhùn méjì kí àkójọ apposition Gíríìkì lè ṣe kedere, láìyí ìbáṣepọ̀ àwọn àpèjúwe náà padà.
