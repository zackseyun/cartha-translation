revisions:
- from: Wọ́n sì la gbogbo erékùṣù náà kọjá títí dé Páfọ̀, níbi tí wọ́n ti rí ọkùnrin kan tí ó jẹ́ onídán àti wòlíì èké. Júù ni, orúkọ rẹ̀ sì ń jẹ́ Bárì-Jésù.[a]
  to: Lẹ́yìn tí wọ́n ti rìn gba gbogbo erékùṣù náà títí dé Páfọ̀, wọ́n rí ọkùnrin kan níbẹ̀, ẹni tí í ṣe onídán, wòlíì èké, àti Júù kan, tí orúkọ rẹ̀ ń jẹ́ Bárì-Jésù.[a]
  rationale: Àtúnṣe náà ń pa ìtẹ̀lé ìṣe participle διελθόντες mọ́ nípa ‘Lẹ́yìn tí wọ́n ti...,’ ó sì darapọ̀ onídán, wòlíì èké, àti Júù gẹ́gẹ́ bí àwọn àpèjúwe kan náà ti ọkùnrin kan náà. A pa orúkọ Bárì-Jésù mọ́ gẹ́gẹ́ bí orúkọ ẹni, a sì ṣe àtúnṣe kékeré sí gbolohun àlàyé àkọsílẹ̀ kí ó lè jẹ́ Yorùbá adayeba.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:05Z'
review_pass:
