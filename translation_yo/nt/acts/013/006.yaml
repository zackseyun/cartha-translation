  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìrìn gba erékùṣù náà, ibi-ìparí Páfọ̀, àti ìdánimọ̀ ọkùnrin náà gẹ́gẹ́ bí onídán, wòlíì èké, àti Júù. Ṣùgbọ́n ‘níbi tí wọ́n ti rí’ ṣe ìgbékalẹ̀ gbolohun alátakò tí kò pọndandan, ‘Júù ni’ sì kàn dà bí àsọyé tó yà kúrò nínú àkójọ àwọn àpèjúwe ọkùnrin náà. Àtúnṣe náà mú gbogbo àwọn àpèjúwe wọ̀nyí padà sí ipò apposition wọn nínú èdè ìpilẹ̀.'
