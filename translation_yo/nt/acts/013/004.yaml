id: ACT.13.4
reference: Acts 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: yo
  text: Nítorí náà, àwọn náà, tí Ẹ̀mí Mímọ́ rán jáde, sọ̀kalẹ̀ lọ sí Sẹ́lẹ́úkíà; láti ibẹ̀ sì ni wọ́n ti wọ ọkọ̀ ojú omi lọ sí Kípírọ́sì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹ̀mí mímọ́.’ Ní Gíríìkì, gbólóhùn náà ní tààràtà ni ‘ẹ̀mí mímọ́’; ṣùgbọ́n nínú Ìṣe Àwọn Àpọ́sítélì, a sábà máa ń túmọ̀ rẹ̀ sí ‘Ẹ̀mí Mímọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: àwọn méjèèjì
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ní ìtẹnumọ́ díẹ̀. Nínú àyíká ẹsẹ tó ṣáájú, ó tọ́ka sí Bánábà àti Sáùlù; ‘àwọn méjèèjì’ mú ìtẹnumọ́ náà hàn ní Yorùbá àdánidá.
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Ó so ìránṣẹ́ tí a ṣe ní ẹsẹ tó ṣáájú pọ̀ mọ́ ìgbésẹ̀ wọn, ó sì tún mú ìtàn tẹ̀ síwájú.
- source_word: ἐκπεμφθέντες
  choice: tí ... rán jáde
  rationale: Ó pa ohùn àìṣe mọ́, ó sì fi hàn pé ìránṣẹ́ náà ṣẹlẹ̀ ṣáájú bí wọ́n ṣe sọ̀kalẹ̀.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: ὑπό pẹ̀lú ọ̀rọ̀-orúkọ ní genitive fi aṣojú tó ṣe iṣẹ́ náà hàn; nínú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn yìí tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí aṣojú Ọlọ́run tó ń ṣiṣẹ́.
- source_word: κατῆλθον
  choice: sọ̀kalẹ̀ lọ
  rationale: Ó pa ìtumọ̀ gidi ti ìsọ̀kalẹ̀ sí etíkun mọ́, Yorùbá náà sì jẹ́ ti àdánidá.
- source_word: εἰς Σελεύκειαν
  choice: sí Sẹ́lẹ́úkíà
  rationale: ‘sí’ fi ibi tí wọ́n ń lọ hàn; a kọ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: ἐκεῖθεν τε
  choice: láti ibẹ̀ ni wọ́n sì ti
  rationale: Ó ṣopọ̀ ibi ìbẹ̀rẹ̀ ìrìn ọkọ̀ ojú omi mọ́ ìgbésẹ̀ tó ṣáájú ní ọ̀nà Yorùbá tó mọ́gbọ́n dání.
- source_word: ἀπέπλευσαν
  choice: wọ ọkọ̀ ojú omi lọ
  rationale: Ó sọ ìrìn àjò ojú omi àti kíkúrò níbi ìbẹ̀rẹ̀ di mímọ́, láìbéèrè pé kí ọkọ̀ náà jẹ́ ọkọ̀ atukọ̀ ní pàtó.
- source_word: εἰς Κύπρον
  choice: sí Kípírọ́sì
  rationale: ‘sí’ fi ibi tí wọ́n ń lọ hàn; a ṣe àfọwọkọ orúkọ erékùṣù náà sí ìró Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì fi í hàn gẹ́gẹ́ bí aṣojú Ọlọ́run tó rán wọn jáde. Lílò lẹ́tà ńlá jẹ́ àṣà Yorùbá fún orúkọ ẹni, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí a ṣe kọ ọ́ ní Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn méjèèjì’ láti jẹ́ kí ìtẹnumọ́ Αὐτοὶ àti ìtọ́kasí sí Bánábà àti Sáùlù ṣe kedere; a sì lo ‘wọ ọkọ̀ ojú omi lọ’ dípò ọ̀rọ̀ tó lè túmọ̀ sí ọkọ̀ atukọ̀ nìkan.
