language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: yo
  text: Ó gba nǹkan bí irinwó ó lé àádọ́ta ọdún[a]. Lẹ́yìn nǹkan wọ̀nyí, ó sì fún wọn ní àwọn onídàájọ́ títí di Sámúẹ́lì wòlíì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, gẹ́gẹ́ bí àwọn ìtumọ̀ kan ṣe so ìtọ́ka àkókò náà lọ́nà mìíràn: “Ó fún wọn ní àwọn onídàájọ́ fún nǹkan bí irinwó ó lé àádọ́ta ọdún, títí di Sámúẹ́lì wòlíì.” Ìṣètò ọ̀rọ̀ àti àmì ìdádúró nínú Gíríìkì níbí jẹ́ ohun àríyànjiyàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: tó bí
  rationale: Níwájú iye ọdún, ὡς fi hàn pé iye náà jẹ́ àfojúsùn, kì í ṣe iye pàtó; “tó bí” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: irinwó ọdún ó lé àádọ́ta
  rationale: Ó pa iye ọdún 450 mọ́ ní ọ̀rọ̀ Yorùbá tí ó ṣe kedere, ó sì bá gbolohun ìwọ̀n “tó bí” mu.
- source_word: καὶ μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí, ó sì
  rationale: Ó pa ìtẹ̀síwájú ìtàn àti àfihàn ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ní ọ̀nà tí ó ṣàn dáadáa ní Yorùbá.
- source_word: ἔδωκεν
  choice: ó fún wọn ní
  rationale: “Fún ... ní” pa ìtumọ̀ gangan δίδωμι mọ́; “wọn” jẹ́ ohun tí àyíká ọ̀rọ̀ ń tọ́ka sí, àwọn ọmọ Ísírẹ́lì.
- source_word: κριτὰς
  choice: àwọn onídàájọ́
  rationale: Ó tọ́ka sí àwọn aṣáájú Ísírẹ́lì ní àkókò àwọn Onídàájọ́, ó sì yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ adájọ́ ilé-ẹjọ́ lasán.
- source_word: ἕως
  choice: títí di
  rationale: Ó fi òpin àkókò àwọn onídàájọ́ hàn ní tààràtà.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Sámúẹ́lì wòlíì
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tí ó pa orúkọ àti ipò Sámúẹ́lì gẹ́gẹ́ bí wòlíì mọ́.
theological_decisions:
- issue: Ibi tí gbólóhùn “tó bí irinwó ọdún ó lé àádọ́ta” so mọ́ nínú ẹsẹ tí ìtumọ̀ ìṣètò ọ̀rọ̀ rẹ̀ ń fa àríyànjiyàn
  choice: A mú iye ọdún náà gẹ́gẹ́ bí gbólóhùn àkókò tí ó dúró ní òpin ohun tí a sọ ṣáájú, a sì bẹ̀rẹ̀ ìṣẹ̀lẹ̀ tó tẹ̀ lé e pẹ̀lú “Lẹ́yìn nǹkan wọ̀nyí.”
  alternative: A lè so iye 450 ọdún náà mọ́ àkókò tí Ọlọ́run fi àwọn onídàájọ́ fún wọn, títí di Sámúẹ́lì wòlíì.
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè gbé gbólóhùn iye ọdún síwájú “καὶ μετὰ ταῦτα,” ṣùgbọ́n ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn gbólóhùn tó yí i ká kò ṣe kedere pátápátá. A tẹ̀ lé ìṣètò orísun náà, a sì fi ọ̀nà mìíràn sínú àlàyé ìsàlẹ̀ dípò kí a pinnu àríyànjiyàn náà ní ìdákẹ́jẹ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “onídàájọ́” fún ipò ìtàn Ísírẹ́lì, kì í ṣe “adájọ́” ilé-ẹjọ́ lasán.
