  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtàn Gíríìkì dáadáa ní pàtàkì: yíyọ Saulu kúrò, gbígbé Dáfídì dìde fún Ísírẹ́lì gẹ́gẹ́ bí ọba, ẹ̀rí Ọlọ́run nípa Dáfídì, àti ọ̀pọ̀ inú θελήματά. Ṣùgbọ́n “tí ó bá ọkàn mi mu” ń fi ìtumọ̀ ìfẹ́/ìtẹ́lọ́rùn hàn ju ìbámu “gẹ́gẹ́ bí ọkàn mi” ti κατά + accusative lọ. Àmì ẹsẹ̀ akọ́kọ́ tún ń tọ́ka sí ibì kan tí kì í bá àlàyé àpèjúwe Gíríìkì mu ní kíkún.'
  naturalness: Yorùbá náà jẹ́ àdánidá, ó sì ní àmì ohùn tó yẹ. “Nípa Dáfídì, ó tún jẹ́rìí” jẹ́ ọ̀nà kedere láti sọ pé ẹ̀rí náà jẹ́ nípa Dáfídì. “Gbogbo àwọn ohun tí mo fẹ́” dáa, ṣùgbọ́n “gbogbo ìfẹ́-inú mi” jẹ́ kúkúrú, adayeba, ó sì lè gbé ọ̀pọ̀ àwọn ìfẹ́/èro tí Gíríìkì náà ní hàn nínú àyíká yìí.
