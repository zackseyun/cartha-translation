id: ACT.13.22
reference: Acts 13:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: yo
  text: Lẹ́yìn tí ó sì yọ ọ́ kúrò, ó gbé Dáfídì dìde fún wọn láti jẹ́ ọba. Nípa Dáfídì, ó tún jẹ́rìí, ó sì wí pé, “Mo ti rí Dáfídì ọmọ Jésè, ọkùnrin kan gẹ́gẹ́ bí ọkàn mi,[a] ẹni tí yóò ṣe gbogbo ìfẹ́-inú mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà sí i, Gíríìkì ní, “gẹ́gẹ́ bí ọkàn mi.” A tún lè túmọ̀ ọ̀rọ̀ náà ní ọ̀nà àṣà pé, “ẹni tí ó tẹ́ ọkàn mi lọ́rùn.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “ìfẹ́-inú mi” wà ní ọ̀pọ̀; ó ń tọ́ka sí gbogbo àwọn ìfẹ́, ète, tàbí ohun tí Ọlọ́run fẹ́ kí ó ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: lẹ́yìn tí ó yọ ọ́ kúrò
  rationale: Ó sọ ní gbangba pé Ọlọ́run mú ẹni tí a mẹ́nu kàn ṣáájú, ìyẹn Saulu, kúrò ní ipò ọba, láì fi ìtumọ̀ òṣèlú tó le ju ti Gíríìkì lọ kún un.
- source_word: ἤγειρεν
  choice: ó gbé Dáfídì dìde
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé Ọlọ́run mú Dáfídì jáde gẹ́gẹ́ bí aṣáájú; ‘láti jẹ́ ọba’ mú kí ó ṣe kedere pé kì í ṣe àjíǹde òkú ni.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: fún wọn láti jẹ́ ọba
  rationale: ‘Fún wọn’ fi ipa dátífù tó ń tọ́ka sí àǹfààní Ísírẹ́lì hàn, ‘láti jẹ́ ọba’ sì sọ ipa tí Dáfídì gbà.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Nípa Dáfídì, ó tún jẹ́rìí, ó sì wí pé
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ẹ̀rí tí Ọlọ́run jẹ́ nípa Dáfídì, ó sì yẹra fún gbolohun tí yóò dà bí ẹni pé Ọlọ́run ń bá Dáfídì fúnra rẹ̀ sọ̀rọ̀.
- source_word: Εὗρον
  choice: Mo ti rí
  rationale: Àkókò ìṣe tí ó ti parí ṣùgbọ́n tí àbájáde rẹ̀ ṣì wúlò ni ‘Mo ti rí’ ń fi hàn ní Yorùbá.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: Dáfídì ọmọ Jésè
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá láti sọ ìbátan ọmọ sí baba.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: ọkùnrin kan tí ó bá ọkàn mi mu
  rationale: Ó pa àkóónú ‘gẹ́gẹ́ bí/ní ìbámu pẹ̀lú ọkàn mi’ mọ́ ní Yorùbá àdánidá, láì sọ ọ́ di ìmọ̀lára ìfẹ́ lásán.
- source_word: ὃς ποιήσει
  choice: ẹni tí yóò ṣe
  rationale: Ó fi ọjọ́ iwájú àti ìṣe tó rọrùn ti ποιέω hàn tààrà.
- source_word: πάντα τὰ θελήματά μου
  choice: gbogbo àwọn ohun tí mo fẹ́
  rationale: Ó mú ọ̀pọ̀ nǹkan tí orúkọ Gíríìkì tó wà ní ọ̀pọ̀ ṣe tọ́ka sí jáde ní Yorùbá tó mọ́gbọ́n dání, dípò gbólóhùn àjèjì bí ‘gbogbo àwọn ìfẹ́ mi.’
theological_decisions:
- issue: Ìtumọ̀ àpèjúwe Dáfídì gẹ́gẹ́ bí ẹni ‘κατὰ τὴν καρδίαν μου’
  choice: tí ó bá ọkàn mi mu
  alternative: ẹni tí ó tẹ́ ọkàn mi lọ́rùn; gẹ́gẹ́ bí ọkàn mi
  rationale: Yíyan yìí fi ìbámu Dáfídì pẹ̀lú ète Ọlọ́run hàn, ó sì pa àìdánilójú àpèjúwe ‘ọkàn’ mọ́ láì sọ pé ó jẹ́ ìmọ̀lára tàbí àìlábùkù ìwà pátápátá.
- issue: Bóyá ‘ἤγειρεν’ túmọ̀ sí àjíǹde tàbí mímú aṣáájú kan dìde
  choice: ó gbé Dáfídì dìde fún wọn láti jẹ́ ọba
  alternative: ó yan Dáfídì sípò ọba fún wọn
  rationale: Ọ̀rọ̀ yìí pa àwòrán ìpilẹ̀ṣẹ̀ Gíríìkì mọ́, nígbà tí àfikún ‘láti jẹ́ ọba’ dá ìtumọ̀ rẹ̀ mọ́ sí mímú Dáfídì wá sí ipò ọba, kì í ṣe àjíǹde.
- issue: Ọ̀pọ̀ inú θελήματά
  choice: gbogbo àwọn ohun tí mo fẹ́
  alternative: gbogbo ìfẹ́ mi
  rationale: Gíríìkì lo ọ̀pọ̀, nítorí náà Yorùbá náà sọ àwọn ohun tàbí ète Ọlọ́run ní ọ̀pọ̀ láì dá ẹ̀kọ́ ìsìn mìíràn lé e lórí.
translation_notes:
  register: A lo Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A ya gbólóhùn ẹ̀rí nípa Dáfídì sọ́tọ̀ díẹ̀ kí ìbáṣepọ̀ àwọn ọ̀rọ̀ má bà a rú, láì yí ìtumọ̀ Gíríìkì padà.
