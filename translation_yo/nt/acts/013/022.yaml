- from: Lẹ́yìn tí ó sì yọ ọ́ kúrò, ó gbé Dáfídì dìde fún wọn láti jẹ́ ọba. Nípa Dáfídì, ó tún jẹ́rìí, ó sì wí pé, “Mo ti rí Dáfídì ọmọ Jésè, ọkùnrin kan tí ó bá ọkàn mi mu,[a] ẹni tí yóò ṣe gbogbo àwọn ohun tí mo fẹ́.”[b]
  to: Lẹ́yìn tí ó sì yọ ọ́ kúrò, ó gbé Dáfídì dìde fún wọn láti jẹ́ ọba. Nípa Dáfídì, ó tún jẹ́rìí, ó sì wí pé, “Mo ti rí Dáfídì ọmọ Jésè, ọkùnrin kan gẹ́gẹ́ bí ọkàn mi,[a] ẹni tí yóò ṣe gbogbo ìfẹ́-inú mi.”[b]
  rationale: A ṣàtúnṣe àpèjúwe Dáfídì sí “gẹ́gẹ́ bí ọkàn mi” kí ìtumọ̀ Yorùbá lè fara mọ́ κατά τὴν καρδίαν μου dáadáa, nígbà tí a fi ìtumọ̀ àṣà sí àlàyé ẹsẹ̀. A tún fi “ìfẹ́-inú” rọ́pò “àwọn ohun tí mo fẹ́” láti jẹ́ kúkúrú àti adayeba, pẹ̀lú àlàyé pé orúkọ Gíríìkì náà wà ní ọ̀pọ̀. Àwọn ìyókù ń ṣetọ́jú ìtumọ̀ àti ìforúkọsílẹ̀ ìpilẹ̀ṣẹ̀.
