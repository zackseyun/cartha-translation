  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì náà dáadáa: Elimasì ń tako àwọn míṣọ́nnárì náà, ó sì fẹ́ yí aṣojú-alákóso náà kúrò nínú ìgbàgbọ́. Síbẹ̀, “baálẹ̀ ìjọba náà” kò ṣe kedere gẹ́gẹ́ bí akọ́lé ἀνθύπατος, nítorí ó lè túmọ̀ sí olórí ìjọba ju alákóso ilẹ̀ kan lọ.'
  naturalness: Èdè náà ní ìrọ̀rùn, àmì ohùn sì wà dáadáa. “Ń tako wọn” jẹ́ ọ̀nà tó rọrùn àti tó ṣe kedere ju “dúró lòdì sí wọn” lọ fún àtakò tí ń tẹ̀síwájú. “Baálẹ̀ ilẹ̀ náà” sì jẹ́ àdánidá ju “baálẹ̀ ìjọba náà” lọ nínú àyíká yìí.
  terminology: “Onídán” jẹ́ ìtumọ̀ tó bójú mu fún μάγος níbí. “Ìgbàgbọ́ náà” ń fi article nínú τῆς πίστεως hàn láìpa ìtumọ̀ míì mọ́. Àlàyé ìsàlẹ̀ (a) yẹ kí ó sọ ìyàtọ̀ náà ní Yorùbá tó dáa ju kí ó máa sọ “níní ìgbàgbọ́,” èyí tí kò rọrùn.
