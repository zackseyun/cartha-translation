source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n Elimasì onídán náà ń tako wọn—nítorí báyìí ni a ṣe túmọ̀ orúkọ rẹ̀—ó ń gbìyànjú láti yí baálẹ̀ ilẹ̀ náà kúrò nínú ìgbàgbọ́ náà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kúrò nínú ìgbàgbọ́.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìgbàgbọ́ Kristẹni ní pàtó, tàbí sí ìgbàgbọ́ gẹ́gẹ́ bí ìdáhùn sí ìhìn rere ní gbogbogbòò.'
    reason: alternative_reading
  - marker: b
    text: A ṣàlàyé “Elimasì” gẹ́gẹ́ bí orúkọ tí a túmọ̀ tàbí tí a ṣàlàyé ìtumọ̀ rẹ̀; ìpilẹ̀ orúkọ náà gan-an kò dájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: dúró lòdì sí
  rationale: Ó fi àtakò tí ń bá a lọ hàn gẹ́gẹ́ bí imperfect Gíríìkì, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Ἐλύμας
  choice: Elimasì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: ὁ μάγος
  choice: onídán
  rationale: Ó jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye, ó sì fi iṣẹ́ μάγος hàn láìfi ìtumọ̀ ẹ̀sìn kan tí ó le jù kún un.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: nítorí báyìí ni a ṣe túmọ̀ orúkọ rẹ̀
  rationale: Ó pa àlàyé àárín gbólóhùn mọ́, ó sì fi mejeeji ìtumọ̀ àti ìtúmọ̀ èdè inú μεθερμηνεύεται hàn.
- source_word: ζητῶν
  choice: ó ń gbìyànjú
  rationale: Ó fi ète àti ìsapá tí ń lọ lọ́wọ́ hàn ní Yorùbá àdánidá.
- source_word: διαστρέψαι
  choice: láti yí ... kúrò
  rationale: Pẹ̀lú ẹni gẹ́gẹ́ bí object àti ἀπό, ọ̀rọ̀ náà túmọ̀ sí yí ẹnì kan kúrò lọ́dọ̀ ohun kan.
- source_word: τὸν ἀνθύπατον
  choice: baálẹ̀ ìjọba náà
  rationale: Ó jẹ́ àkọlé Yorùbá tí ó ṣeé lóye fún alákóso ilẹ̀ Róòmù yìí; 'náà' tọ́ka sí ẹni tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀.
- source_word: ἀπὸ τῆς πίστεως
  choice: kúrò nínú ìgbàgbọ́
  rationale: Ó pa 'ìgbàgbọ́' mọ́ fún πίστις, nígbà tí àyíká ọ̀rọ̀ lè tọ́ka sí ìgbàgbọ́ Kristẹni ní pàtó tàbí sí fífi ìgbàgbọ́ dáhùn lápapọ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις pẹ̀lú article
  choice: ìgbàgbọ́
  alternative: níní ìgbàgbọ́
  rationale: Àyíká ọ̀rọ̀ àti article lè tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí Elimasì fẹ́ yí baálẹ̀ náà kúrò nínú rẹ̀; síbẹ̀, Gíríìkì tún lè túmọ̀ sí dídènà fún un láti gba ohun tí ó gbọ́ gbọ́. Àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa gbólóhùn àlàyé inú dásì mọ́ gẹ́gẹ́ bí ó ṣe wà nínú orísun.
