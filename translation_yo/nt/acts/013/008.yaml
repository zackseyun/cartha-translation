  to: Ṣùgbọ́n Elimasì onídán náà ń tako wọn—nítorí báyìí ni a ṣe túmọ̀ orúkọ rẹ̀—ó ń gbìyànjú láti yí baálẹ̀ ilẹ̀ náà kúrò nínú ìgbàgbọ́ náà[a][b].
