source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí Ọlọ́run jí dìde kò rí ìbàjẹ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìjẹrà.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí bí ara ṣe ń bàjẹ́ tàbí ń jẹrà lẹ́yìn ikú; ‘ìbàjẹ́’ tún pa ọ̀rọ̀ tí a mú wá láti inú Sáàmù 16:10 nínú Ìwé Mímọ́ ní èdè Gíríìkì mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan náà ń tọ́ka sí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀, ìyẹn Jésù; ‘ẹni tí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé òun ni Ọlọ́run jí dìde.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ hàn láàárín Dáfídì, ẹni tí ó rí ìbàjẹ́, àti Jésù; ‘Ṣùgbọ́n’ pa agbára ìtakora náà mọ́.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún θεός níbi tí ó ti jẹ́ olùṣe iṣẹ́ náà.
- source_word: ἤγειρεν
  choice: jí dìde
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἐγείρω ń tọ́ka sí jíjí Jésù dìde kúrò nínú òkú. ‘Jí dìde’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tí kò sì fi àlàyé míì kún ọ̀rọ̀ náà.
- source_word: οὐκ εἶδεν
  choice: kò rí
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì ‘kò rí’ mọ́, ó sì tún pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú Sáàmù 16:10.
- source_word: διαφθοράν
  choice: ìbàjẹ́
  rationale: ‘Ìbàjẹ́’ lè sọ nípa bí ara ṣe ń bàjẹ́ lẹ́yìn ikú, ó sì pa ìtumọ̀ àti ìró ọ̀rọ̀ inú Sáàmù mọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ ara tó ń jẹrà hàn kedere.
theological_decisions:
- issue: Ìtumọ̀ àjíǹde nínú ἤγειρεν
  choice: ‘jí dìde,’ ní ìtumọ̀ pé Ọlọ́run jí Jésù dìde kúrò nínú òkú
  alternative: ‘gbé dìde’ ní ìtumọ̀ yíyan ẹni kan tàbí mímú un wá síwájú
  rationale: Àyíká ọ̀rọ̀ náà fi Dáfídì, ẹni tí ó kú tí ara rẹ̀ sì bàjẹ́, wé Jésù, ẹni tí Ọlọ́run jí dìde tí kò sì rí ìbàjẹ́. Nítorí náà, àjíǹde kúrò nínú òkú ni ìtumọ̀ tó lágbára níbí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kò rí ìbàjẹ́’ láti pa àwòrán àti ìtọ́kasí Sáàmù mọ́, bí ó tilẹ̀ jẹ́ pé ‘ara rẹ̀ kò jẹrà’ lè jẹ́ àlàyé tó túbọ̀ ṣe kedere.
