id: ACT.13.50
reference: Acts 13:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Júù ru àwọn obìnrin olùfọkànsìn ọlọ́lá[a] àti àwọn ọkùnrin aṣáájú ìlú náà sókè. Wọ́n sì dá inúnibíni sí Pọ́ọ̀lù àti Bánábà sílẹ̀, wọ́n sì lé wọn jáde kúrò ní agbègbè wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn obìnrin olùbẹ̀rù Ọlọ́run.” Ọ̀rọ̀ náà lè tọ́ka sí àwọn obìnrin tí wọ́n ń sin Ọlọ́run Ísírẹ́lì, ó sì ṣeé ṣe kí wọ́n jẹ́ àwọn tí kì í ṣe Júù tí wọ́n ní ìbáṣepọ̀ pẹ̀lú sínágọ́gù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kúrò ní ilẹ̀ wọn” tàbí “kúrò ní ààlà ilẹ̀ wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ààlà ilẹ̀ tàbí agbègbè tí ààlà náà yí ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώτρυναν
  choice: ru ... sókè
  rationale: Ó fi ìmúnibínú àti ìdánilẹ́kọ̀ọ́ láti gbé ìgbésẹ̀ hàn ní Yorùbá àdánidá.
- source_word: σεβομένας γυναῖκας
  choice: àwọn obìnrin olùfọkànsìn
  rationale: Ó pa ìtumọ̀ ìbẹ̀rù àti ìjọsìn Ọlọ́run mọ́ láì sọ ipò wọn nínú ẹ̀sìn Júù di ohun tí ó dájú jù.
- source_word: εὐσχήμονας
  choice: tí ó jẹ́ ọlọ́lá
  rationale: Ó ṣàfihàn ipò gíga àti iyì wọn láwùjọ.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: àwọn olórí ọkùnrin ìlú náà
  rationale: Ó mú ipò aṣáájú àti ìtọ́kasí akọ tí ọ̀rọ̀ Gíríìkì ní jáde kedere.
- source_word: ἐπήγειραν διωγμὸν
  choice: dá inúnibíni ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n fa inúnibíni náà láti bẹ̀rẹ̀, ó sì jẹ́ Yorùbá tí ó ṣe déédé.
- source_word: ἐξέβαλον
  choice: lé ... jáde
  rationale: Ó pa agbára àti ìfipámúni inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: kúrò ní agbègbè wọn
  rationale: ὅρια lè tọ́ka sí ààlà tàbí gbogbo ilẹ̀ tí ààlà náà yí ká; ‘agbègbè’ bá ọ̀rọ̀ ìlú mu láì dín àìdánilójú náà kù.
theological_decisions:
- issue: Ìdánimọ̀ àwọn obìnrin σεβόμεναι
  choice: àwọn obìnrin olùfọkànsìn
  alternative: àwọn obìnrin olùbẹ̀rù Ọlọ́run
  rationale: ‘Olùfọkànsìn’ pa ìfọkànsìn ẹ̀sìn mọ́, ṣùgbọ́n kò fi dandan sọ pé wọ́n jẹ́ ọmọ orílẹ̀-èdè mìíràn tí wọ́n darapọ̀ mọ́ sínágọ́gù.
- issue: Ìtọ́kasí akọ nínú τοὺς πρώτους τῆς πόλεως
  choice: àwọn olórí ọkùnrin ìlú náà
  alternative: àwọn olórí ìlú náà
  rationale: Ìtumọ̀ náà pa ìtọ́kasí akọ ọ̀pọ̀ nínú Gíríìkì mọ́, láì fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A pín gbólóhùn náà sí méjì fún ìṣàn Yorùbá tó rọrùn, láì yí ìbáṣepọ̀ àwọn ìṣe inú Gíríìkì padà.
