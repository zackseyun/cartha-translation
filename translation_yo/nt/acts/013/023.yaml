id: ACT.13.23
reference: Acts 13:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: yo
  text: Láti inú àtọmọdọ́mọ ọkùnrin yìí[a] ni Ọlọ́run ti mú Olùgbàlà kan, Jesu, wá fún Ísírẹ́lì, ní ìbámu pẹ̀lú ìlérí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láti inú irúgbìn ẹni yìí”; níhìn-ín, “àtọmọdọ́mọ” ń tọ́ka sí ìran Dáfídì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gẹ́gẹ́ bí ó ti ṣèlérí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ń tọ́ka padà sí Dáfídì nínú ẹsẹ tó ṣáájú. “Ọkùnrin yìí” mú ẹni tí a ń tọ́ka sí hàn kedere láì fi orúkọ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: láti inú irú-ọmọ
  rationale: Níhìn-ín, σπέρμα túmọ̀ sí ìran tàbí àtọmọdọ́mọ, kì í ṣe irúgbìn ní ìtumọ̀ gidi. “Irú-ọmọ” jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ ìran Dáfídì mọ́.
- source_word: κατ’ ἐπαγγελίαν
  choice: ní ìbámu pẹ̀lú ìlérí
  rationale: Ó fi hàn pé ohun tí Ọlọ́run ṣe bá ìlérí mu, láì sọ ìlérí pàtó tí gbólóhùn Gíríìkì fúnra rẹ̀ kò dárúkọ.
- source_word: ἤγαγεν
  choice: ti mú ... wá
  rationale: ἄγω túmọ̀ sí “mú wá” tàbí “darí wá.” Yíyan èyí yẹra fún lílo ọ̀rọ̀ tó lè dà bí ẹni pé àjíǹde ni a ń sọ̀rọ̀ rẹ̀.
- source_word: τῷ Ἰσραήλ
  choice: fún Ísírẹ́lì
  rationale: Dátífù náà lè ní ìtumọ̀ pé “sí Ísírẹ́lì” tàbí “fún Ísírẹ́lì.” “Fún” jẹ́ èdè Yorùbá àdánidá, ó sì mú ipa Olùgbàlà fún àwọn ènìyàn náà hàn.
- source_word: σωτῆρα
  choice: Olùgbàlà kan
  rationale: “Olùgbàlà” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún σωτήρ, ó sì pa ìtumọ̀ ẹni tó ń gbani tàbí dáni nídè mọ́. “Kan” ń ṣiṣẹ́ gẹ́gẹ́ bí àfihàn aláìdá pàtó, kì í ṣe láti dín ipò Jesu kù.
- source_word: Ἰησοῦν
  choice: Jesu
  rationale: A lo ọ̀nà ìkọ orúkọ yìí gẹ́gẹ́ bí ó ti fìdí múlẹ̀ nínú Yorùbá.
theological_decisions:
- issue: Ìbáṣepọ̀ Jesu pẹ̀lú ìran Dáfídì àti ìlérí Ọlọ́run
  choice: A sọ pé Ọlọ́run mú Jesu wá láti inú irú-ọmọ ọkùnrin yìí ní ìbámu pẹ̀lú ìlérí.
  alternative: A lè túmọ̀ ọ́ ní kedere sí i pé Ọlọ́run mú Jesu wá láti mú ìlérí rẹ̀ fún Dáfídì ṣẹ.
  rationale: Àyọkà Gíríìkì so ìran Dáfídì, Jesu, àti ìlérí pọ̀, ṣùgbọ́n kò sọ ní gbangba nínú ẹsẹ yìí pé “ìlérí fún Dáfídì.” Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó ju ọ̀rọ̀ inú àyọkà lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtòlẹ́sẹẹsẹ ìtumọ̀ orísun mọ́ ní ọ̀nà àdánidá.
