id: ACT.13.36
reference: Acts 13:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: yo
  text: Nítorí Dáfídì, lẹ́yìn tí ó ti ṣe iṣẹ́ fún ète Ọlọ́run ní ìran tirẹ̀[a], ó sùn[b], a sì fi í kún àwọn baba ńlá rẹ̀[c], ó sì rí ìdíbàjẹ́[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “lẹ́yìn tí Dáfídì ti ṣe iṣẹ́ fún ìran tirẹ̀ gẹ́gẹ́ bí ète Ọlọ́run.” Ìtò ọ̀rọ̀ Gíríìkì lè gba ìtumọ̀ yìí náà láàyè.
    reason: lexical_alternative
  - marker: b
    text: “Ó sùn” jẹ́ àkànlò èdè Bíbélì fún pé ó kú.
    reason: cultural_note
  - marker: c
    text: Ní tààrà, “a fi í kún àwọn baba rẹ̀”; àkànlò èdè Hébérù ni fún pé ó darapọ̀ mọ́ àwọn baba ìran rẹ̀ nínú ikú.
    reason: lexical_alternative
  - marker: d
    text: Ìyẹn ni pé ara rẹ̀ jẹrà; wo ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé e fi hàn.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: ní ìran tirẹ̀
  rationale: Gbólóhùn dátífù yìí lè tọ́ka sí àkókò tàbí àyíká tí Dáfídì ti ṣe iṣẹ́ rẹ̀. ‘Ní ìran tirẹ̀’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún fífi ìtumọ̀ ‘fún ìran tirẹ̀’ múlẹ̀ gẹ́gẹ́ bí ohun tí kò ṣeé yí padà.
- source_word: ὑπηρετήσας
  choice: lẹ́yìn tí ... ti sin
  rationale: Partísípù aórístì náà ṣáájú àwọn ọ̀rọ̀-ìṣe pàtàkì. ‘Lẹ́yìn tí ... ti sin’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn kedere, ó sì pa ìtumọ̀ iṣẹ́ ìránṣẹ́ mọ́ láìsọ ọ́ di iṣẹ́ àlùfáà tàbí ti ìjọ nìkan.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: ète Ọlọ́run
  rationale: βουλή lè túmọ̀ sí ète, ìpinnu, tàbí ìmọ̀ràn. ‘Ète Ọlọ́run’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí kò sì fi ètò ẹ̀kọ́ ìsìn kan lé ẹsẹ náà lórí.
- source_word: ἐκοιμήθη
  choice: ó sùn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àkànlò èdè fún ikú. Títúmọ̀ rẹ̀ sí ‘ó sùn’ pa àwòrán inú orísun àti ìró Bíbélì mọ́.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: a sì fi í kún àwọn baba ńlá rẹ̀
  rationale: Èyí tẹ̀lé àkànlò èdè Semítíkì náà pé a fi ẹni náà kún àwọn baba rẹ̀ nínú ikú. ‘Àwọn baba ńlá’ jẹ́ kedere ní Yorùbá pé àwọn baba ìran rẹ̀ ni a ń sọ.
- source_word: εἶδεν διαφθοράν
  choice: ó sì rí ìdíbàjẹ́
  rationale: Ìtumọ̀ tààrà yìí pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú Sáàmù tí a tọ́ka sí àti ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé e fi hàn. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé ara rẹ̀ ni ó jẹrà.
theological_decisions:
- issue: Àkànlò èdè oorun fún ikú Dáfídì
  choice: ó sùn
  alternative: ó kú
  rationale: Orísun lo κοιμάομαι dípò ọ̀rọ̀ tààrà fún ikú. Pípa àkànlò ‘ó sùn’ mọ́ kò fi ẹ̀kọ́ àkànṣe kún un, àyíká ọ̀rọ̀ sì mú kí ìtumọ̀ ikú ṣe kedere.
- issue: Ìtumọ̀ βουλή nípa ìfẹ́-inú Ọlọ́run
  choice: ète Ọlọ́run
  alternative: ìmọ̀ràn Ọlọ́run; ètò Ọlọ́run
  rationale: ‘Ète’ sọ ìfẹ́-inú àti ohun tí Ọlọ́run pinnu di mímọ̀ ní èdè Yorùbá tó wọ́pọ̀, láìfi ètò ẹ̀kọ́ ìsìn tóóró kan lé ọ̀rọ̀ náà lórí.
- issue: Ìsopọ̀ àwọn dátífù ἰδίᾳ γενεᾷ àti τῇ τοῦ θεοῦ βουλῇ
  choice: Dáfídì sin ète Ọlọ́run ní ìran tirẹ̀
  alternative: Dáfídì sin ìran tirẹ̀ gẹ́gẹ́ bí ète Ọlọ́run
  rationale: Ìtò ọ̀rọ̀ Gíríìkì gba ìtumọ̀ méjèèjì láàyè. Ọ̀rọ̀ inú ẹsẹ yan ìtumọ̀ àkókò/àyíká tí ó bá ìpele ìtàn mu, ṣùgbọ́n àlàyé [a] pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tí ó ní iyì ṣùgbọ́n tí àwọn òǹkàwé òde òní lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá; orúkọ Dáfídì àti àwọn àkànlò Bíbélì ni a ṣe ní ọ̀nà tó mọ́gbọ́n dání.
