  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: yo
  text: Ó sì fara da wọ́n fún nǹkan bí ogójì ọdún ní aginjù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kà á pé, “ó tọ́jú wọn,” dípò “ó fara da wọ́n.”
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: Ó sì
  rationale: ‘Sì’ so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú; fífi ‘Ó’ kún un jẹ́ kí gbolohun Yorùbá pé, ó sì ń tọ́ka sí Ọlọ́run.
- source_word: ὡς
  choice: nǹkan bí
  rationale: Nígbà tí ὡς bá wà pẹ̀lú ìwọ̀n àkókò, ó ń fi ìsúnmọ́ hàn; ‘nǹkan bí’ jẹ́ ọ̀nà àdánidá láti sọ pé kì í ṣe dandan pé iye náà pé pérépéré.
- source_word: τεσσερακονταετῆ χρόνον
  choice: ogójì ọdún
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí àkókò ọdún ogójì; èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì ṣe kedere.
- source_word: ἐτροποφόρησεν
  choice: fi ara da wọ́n
  rationale: Ọ̀rọ̀ inú SBLGNT túmọ̀ sí láti fara da ìwà tàbí ìṣòro ẹnì kan. ‘Fi ara da wọ́n’ dá ìtumọ̀ yìí dúró láì sọ ọ́ di èrò ìtọ́jú nìkan.
- source_word: αὐτοὺς
  choice: wọ́n
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ọmọ Ísírẹ́lì.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi aṣálẹ̀ tí àwọn ọmọ Ísírẹ́lì ti rìn kiri, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ìtàn Májẹ̀mú Láéláé mọ́.
theological_decisions:
- issue: Ìtumọ̀ ohun tí Ọlọ́run ṣe sí Ísírẹ́lì ní aginjù
  choice: Ó fi ara da wọ́n
  alternative: Ó tọ́jú wọn
  rationale: Ẹ̀dà Gíríìkì tí a pèsè ní ἐτροποφόρησεν, èyí tó ṣe àtìlẹ́yìn fún ‘fara da.’ A kò rọ ìtumọ̀ náà sí ti ìtọ́jú nìkan; síbẹ̀, a fi ẹ̀dà àfọwọ́kọ míì tó ní ìtumọ̀ ‘tọ́jú’ sínú àlàyé ìsàlẹ̀ láti jẹ́ olóòtítọ́ sí ẹ̀rí àfọwọ́kọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbolohun náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. ‘Fi ara da’ mú ìtumọ̀ ìfaradà ọ̀rọ̀ Gíríìkì jáde, nígbà tí àlàyé ìsàlẹ̀ pa ìyàtọ̀ àfọwọ́kọ mọ́.
