language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: yo
  text: Bí wọ́n sì ti ń jáde lọ[b][a], wọ́n ń bẹ̀bẹ̀ pé kí a sọ àwọn ọ̀rọ̀ wọ̀nyí fún wọn ní ọjọ́ Ìsinmi tí ń bọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé afọwọ́kọ kan sọ ọ́ ní kedere sí i pé, “Bí Pọ́ọ̀lù àti Bánábà ti ń jáde lọ, àwọn ènìyàn ń bẹ̀bẹ̀ pé kí a sọ àwọn ọ̀rọ̀ wọ̀nyí fún wọn ní ọjọ́ Ìsinmi tí ń bọ̀.”
    reason: textual_variant
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “Bí wọ́n ti ń kúrò, wọ́n ń béèrè pé kí a sọ àwọn nǹkan wọ̀nyí fún wọn ní ọjọ́ Ìsinmi tí ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: Bí wọ́n sì ti ń jáde lọ
  rationale: Gbólóhùn àkókò ni genitive absolute yìí; ‘bí ... ti ń’ fi ìṣe tí ó ń lọ hàn, ‘wọ́n’ sì pa àìdájú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí mọ́.
- source_word: παρεκάλουν
  choice: wọ́n ń rọ̀ wọ́n
  rationale: Imperfect náà fi ìbéèrè tí wọ́n ń bá a lọ tàbí tí wọ́n ń ṣe léraléra hàn; ‘rọ̀’ mú ìtara inú παρακαλέω jáde ju ‘béèrè’ lọ ní ibi yìí.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: ní ọjọ́ Ìsinmi tí ń bọ̀
  rationale: Ọ̀rọ̀ àkànlò yìí tọ́ka sí ọjọ́ Sábáàtì tí ó tẹ̀ lé e; èyí jẹ́ ọ̀nà Yorùbá adayébá láti sọ ọ́.
- source_word: λαληθῆναι
  choice: kí a tún sọ
  rationale: Ìtumọ̀ passive infinitive náà ni a fi gbólóhùn ‘kí a ... sọ’ hàn. ‘Tún’ ṣe kedere pé wọ́n ń béèrè kí ọ̀rọ̀ tí wọ́n ṣẹ̀ṣẹ̀ gbọ́ náà jẹ́ sísọ lẹ́ẹ̀kan sí i, gẹ́gẹ́ bí àyíká ṣe fi hàn.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dative indirect object náà jẹ́ adayébá ní Yorùbá gẹ́gẹ́ bí ‘fún wọn.’
- source_word: τὰ ῥήματα ταῦτα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Èyí fara mọ́ ìtumọ̀ ῥήματα gẹ́gẹ́ bí àwọn ọ̀rọ̀ tí a sọ, kò sì túmọ̀ ọ́ sí ‘ìhìn’ lọ́nà tí ó túbọ̀ ṣàlàyé.
theological_decisions:
- issue: Ẹni tí àwọn arọ́pò-orúkọ inú ẹsẹ yìí ń tọ́ka sí
  choice: A fi ‘wọ́n’ sílẹ̀ nínú ẹsẹ láì sọ ní pàtó ẹni tí ó ń jáde tàbí àwọn tí ń bẹ̀bẹ̀.
  alternative: Àwọn ènìyàn rọ Pọ́ọ̀lù àti Bánábà; tàbí kí a ka ọ̀rọ̀ náà gẹ́gẹ́ bí Pọ́ọ̀lù àti Bánábà ṣe ń jáde.
  rationale: Ẹ̀dà Gíríìkì yìí lo arọ́pò-orúkọ, ìyàtọ̀ sì wà nínú àwọn ìwé afọwọ́kọ nípa àwọn ẹni tí a dárúkọ. Ìtumọ̀ àkọ́kọ́ kò yẹ kí ó yanjú àìdájú tí orísun kò yanjú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì pa àìdájú arọ́pò-orúkọ inú Gíríìkì mọ́. ‘Ọjọ́ Ìsinmi’ ni a lò fún σάββατον nítorí pé ó ṣeé lóye fún òǹkàwé Yorùbá òde òní.
