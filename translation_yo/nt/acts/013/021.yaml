id: ACT.13.21
reference: Acts 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: yo
  text: Lẹ́yìn náà[a], wọ́n béèrè fún ọba kan, Ọlọ́run sì fún wọn ní Saulu ọmọ Kiṣi, ọkùnrin kan láti inú ẹ̀yà Bẹ́ńjámínì, fún ogójì ọdún.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Láti ibẹ̀, wọ́n béèrè fún ọba kan.” Ọ̀rọ̀ ìbẹ̀rẹ̀ náà tún lè ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ tó ń fi ìgbésẹ̀ tó tẹ̀ lé e hàn nínú ìtẹ̀síwájú ìtàn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn òǹkàwé kan ṣàkíyèsí pé “fún ogójì ọdún” lè gbé ìbéèrè dìde nípa ìṣirò àkókò nígbà tí a bá fi wé àwọn ìsọfúnni inú Májẹ̀mú Láéláé; ìtumọ̀ yìí pa ọ̀rọ̀ Lúùkù mọ́ bí ó ṣe wà.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Lẹ́yìn náà
  rationale: Ọ̀rọ̀ yìí so ìṣẹ̀lẹ̀ náà mọ́ ìtàn tó ṣáájú gẹ́gẹ́ bí ìgbésẹ̀ tó tẹ̀ lé e. “Lẹ́yìn náà” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi agbára àsopọ̀ àti ìtẹ̀síwájú ìtàn náà hàn.
- source_word: ᾐτήσαντο
  choice: wọ́n béèrè fún
  rationale: Ọ̀rọ̀-ìṣe náà sọ pé àwọn ènìyàn náà béèrè ohun kan fún ara wọn. “Béèrè fún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, kò sì fi agbára ìtumọ̀ “wọ́n fi tipátipá béèrè” kún ọ̀rọ̀ Gíríìkì.
- source_word: βασιλέα
  choice: ọba kan
  rationale: Ó ń tọ́ka sí irú olórí tí wọ́n fẹ́, kì í ṣe ọba kan tí a ti dárúkọ tẹ́lẹ̀; “kan” mú èyí ṣe kedere ní Yorùbá.
- source_word: ἔδωκεν
  choice: fún
  rationale: Èyí pa ìtumọ̀ gbòòrò ti “fún” mọ́ láì dín in kù sí “yàn sí ipò” tàbí fi àlàyé míì kún un.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: A pa olùṣe tí ọ̀rọ̀ Gíríìkì dárúkọ ní kedere mọ́.
- source_word: τὸν Σαοὺλ
  choice: Saulu
  rationale: A lo ìkọ̀wé orúkọ ẹni tó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: υἱὸν Κίς
  choice: ọmọ Kiṣi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn tó ń sọ orúkọ baba ẹni.
- source_word: ἄνδρα
  choice: ọkùnrin kan
  rationale: ἀνήρ ń tọ́ka sí akọ tó ti dàgbà; “ọkùnrin kan” pa ìtọ́kasí náà mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐκ φυλῆς Βενιαμίν
  choice: láti inú ẹ̀yà Bẹ́ńjámínì
  rationale: “Láti inú” pa agbára ἐκ mọ́, “ẹ̀yà” sì jẹ́ ọ̀rọ̀ tó bójú mu fún ìpín ìran Ísírẹ́lì.
- source_word: ἔτη τεσσεράκοντα
  choice: fún ogójì ọdún
  rationale: Gbólóhùn akúsatífù náà ń sọ bí àkókò ṣe gùn. “Fún ogójì ọdún” fi ìtumọ̀ àkókò náà hàn ní kedere, ó sì so mọ́ bí Ọlọ́run ṣe fún wọn ní Saulu nínú ìṣàn gbólóhùn náà.
theological_decisions:
- issue: Ìbáṣepọ̀ gbólóhùn ἔτη τεσσεράκοντα pẹ̀lú ohun tó ṣáájú rẹ̀
  choice: A so “fún ogójì ọdún” mọ́ àkókò tí Ọlọ́run fi Saulu fún wọn gẹ́gẹ́ bí ọba.
  alternative: A lè ka gbólóhùn náà lọ́nà tó túbọ̀ fẹ̀ ní àkótán ìtàn náà, pàápàá nítorí àwọn ìbéèrè nípa bí ó ṣe bá àkókò inú Májẹ̀mú Láéláé mu.
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì fi hàn lọ́nà tó ṣeé ṣe jù pé àkókò náà so mọ́ gbólóhùn tó wà lẹ́sẹ̀kẹsẹ̀ ṣáájú rẹ̀ nípa fífún wọn ní Saulu. A pa ọ̀rọ̀ Lúùkù mọ́ láì gbìyànjú láti mú ìṣirò àkókò náà bára mu tàbí láti yanjú ìṣòro náà fún òǹkàwé.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó péye, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tó bá yẹ; a sì lo àwọn ìkọ̀wé orúkọ Bíbélì Yorùbá tí ó wọ́pọ̀, bí “Saulu,” “Kiṣi,” àti “Bẹ́ńjámínì.”
