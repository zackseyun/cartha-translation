id: ACT.13.13
reference: Acts 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: yo
  text: Lẹ́yìn tí àwọn tí ó wà pẹ̀lú Pọ́ọ̀lù[a] fi ọkọ̀ ojú omi kúrò ní Páfọ̀, wọ́n dé Pẹ́gà ní Pamfílíà. Ṣùgbọ́n Jòhánù kúrò lọ́dọ̀ wọn, ó sì padà sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Pọ́ọ̀lù àti àwọn alábàákẹ́gbẹ́ rẹ̀”; ní tààràtà, “àwọn tí ó yí Pọ́ọ̀lù ká.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Nígbà tí ... ṣí ọkọ̀ ojú omi
  rationale: Nínú àkọsílẹ̀ ìrìn-àjò, ἀνάγω túmọ̀ sí ṣí ọkọ̀ ojú omi kúrò ní èbúté. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìrìn-àjò lórí omi mọ́.
- source_word: οἱ περὶ Παῦλον
  choice: àwọn tí ó wà pẹ̀lú Pọ́ọ̀lù
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí àwọn alábàákẹ́gbẹ́ ẹni kan. Ìtumọ̀ yìí dúró nítòsí Gíríìkì, kò sì sọ Pọ́ọ̀lù di ẹni tí ó ṣe iṣẹ́-ìṣe náà ní tààràtà ju bí ọ̀rọ̀ orísun ṣe sọ lọ.
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Nínú ìtàn ìrìn-àjò Yorùbá, “dé” sọ dídé ibi tí a ń lọ ní kedere, ó sì jẹ́ àdánidá ju “wá” lọ ní àyíká yìí.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Pẹ́gà ní Pamfílíà
  rationale: Ọ̀rọ̀ ìní náà fi agbègbè tí Pẹ́gà wà hàn; “ní Pamfílíà” ni ọ̀nà Yorùbá àdánidá láti sọ ibùdó yẹn.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: fi wọ́n sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkúrò lọ́dọ̀ wọn tàbí fífi wọ́n sílẹ̀. Ìtumọ̀ yìí sọ ìṣe náà láìfi ète tàbí ìdájọ́ ìwà kún un.
- source_word: ὑπέστρεψεν
  choice: padà
  rationale: ὑποστρέφω túmọ̀ sí láti padà sí ibi kan; “padà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí ó sì bá ìtàn mu.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọtọ̀ Yorùbá tí a mọ̀ fún orúkọ ìlú náà.
theological_decisions:
- issue: Ohun tí kíkúrò Jòhánù lè túmọ̀ sí nípa ìwà rẹ̀
  choice: A sọ ọ́ láìṣe ìdájọ́ pé Jòhánù “fi wọ́n sílẹ̀” ó sì padà.
  alternative: A lè sọ pé ó “kọ̀ wọ́n sílẹ̀” tàbí pé ó “yapa kúrò lọ́dọ̀ wọn.”
  rationale: Ẹsẹ yìí kò sọ ìdí tí Jòhánù fi kúrò, bẹ́ẹ̀ ni kò pe ìṣe náà ní ìṣọ̀tẹ̀ tàbí ìkọ̀sílẹ̀ ojúṣe. Nítorí náà, a pa ìfọ̀kànbalẹ̀ ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: 'Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A ṣe àtúnṣe ìpo àmì àlàyé Gẹ̀ẹ́sì: nínú ẹ̀rí tí a fún wa, àlàyé [a] bá οἱ περὶ Παῦλον mu, nígbà tí àlàyé tí a pè ní [b] ń ṣàlàyé Ἀναχθέντες; nítorí pé “ṣí ọkọ̀ ojú omi” ti ṣe ìtumọ̀ ọ̀rọ̀ yẹn ní kedere, a kò fi àlàyé kejì tí kò ṣe pàtàkì sí i.'
