  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: yo
  text: Àwa sì ń kéde ìhìn rere fún yín nípa ìlérí náà tí a ṣe fún àwọn baba,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn baba ńlá.” Gíríìkì lò ọ̀rọ̀ fún “àwọn baba,” èyí tí ń tọ́ka nínú ìtàn májẹ̀mú sí àwọn baba ńlá Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” so gbólóhùn náà mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Lílo ọ̀rọ̀ arọ́pò-orúkọ olómìnira “Àwa” fi ìtẹnumọ́ tó wà nínú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá; kò pọn dandan láti fi “fúnra wa” kún un.
- source_word: ὑμᾶς
  choice: fún yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe “kéde ìhìn rere,” “fún yín” ni ọ̀nà àdánidá láti sọ àwọn tí a ń bá sọ̀rọ̀ ní Yorùbá.
- source_word: εὐαγγελιζόμεθα
  choice: ń kéde ìhìn rere
  rationale: Ó pa èrò ìkéde ìròyìn rere mọ́, ó sì yẹra fún ọ̀rọ̀ ẹ̀sìn àkànṣe tí ó lè ṣókùnkùn sí òǹkàwé òde òní.
- source_word: τὴν ... ἐπαγγελίαν
  choice: ìlérí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ìlérí pàtó; àmì àfòmọ́ tó tẹ̀ lé ìhìn rere fi hàn pé ìlérí náà ni ohun tí ìkéde náà dá lé.
- source_word: πρὸς τοὺς πατέρας
  choice: fún àwọn baba
  rationale: “Fún” fi àwọn tí ìlérí náà tọ̀ sí hàn, “àwọn baba” sì pa ọ̀rọ̀ ìbátan akọ nínú Gíríìkì mọ́ láìfi “wa” tí kò sí nínú orísun kún un.
- source_word: γενομένην
  choice: tí a ṣe
  rationale: Ẹ̀yà ọ̀rọ̀ yìí ṣàpèjúwe ìlérí náà gẹ́gẹ́ bí èyí tí a ṣe fún àwọn baba; kò túmọ̀ sí pé a ti mú un ṣẹ, èyí tí ẹsẹ tó tẹ̀ lé yóò sọ.
theological_decisions:
- issue: Ìtumọ̀ πατέρες
  choice: àwọn baba
  alternative: àwọn baba ńlá / àwọn baba ìran wọn
  rationale: “Àwọn baba” tẹ̀ lé ọ̀rọ̀ ìbátan akọ nínú Gíríìkì, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí ìtọ́ka ìtàn májẹ̀mú sí àwọn baba Ísírẹ́lì. Àlàyé ìsàlẹ̀ fi ìtumọ̀ “àwọn baba ńlá” hàn láìyí ọ̀rọ̀ inú ẹsẹ padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Àwa” gba ìtẹnumọ́ ἡμεῖς; àmì àfòmọ́ jẹ́ kí “ìlérí” dúró gẹ́gẹ́ bí àkóónú ìhìn rere láìfi àlàyé tí kò sí nínú orísun kún un.
