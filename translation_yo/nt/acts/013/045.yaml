  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn Júù[a] rí ọ̀pọ̀ ènìyàn náà, ìlara[b] kún wọn, wọ́n sì bẹ̀rẹ̀ sí í tako ohun tí Paulu ń sọ[c], nípa sísọ̀rọ̀-òdì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ẹgbẹ́ àwọn Júù agbègbè tí ń tako Paulu nínú ìṣẹ̀lẹ̀ yìí, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: cultural_note
  - marker: b
    text: Ó tún lè jẹ́, “ìtara kún wọn”; ṣùgbọ́n àyíká ọ̀rọ̀ yìí ṣe àtìlẹ́yìn fún ìtumọ̀ búburú náà, “ìlara.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààràtà: “ohun tí Paulu ń sọ.” Gíríìkì fi í sí ọ̀nà passive: “ohun tí a ń sọ láti ẹnu Paulu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: Ṣùgbọ́n nígbà tí ... rí
  rationale: A tú participle aorist náà gẹ́gẹ́ bí gbólóhùn àkókò ní Yorùbá, δέ sì fi ìyípadà onítakora nínú ìtàn hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì láì dín un kù sí àwọn aṣáájú; àkọ́silẹ̀ ìsàlẹ̀ ṣàlàyé pé ẹgbẹ́ agbègbè kan nínú ìṣẹ̀lẹ̀ yìí ni.
- source_word: τοὺς ὄχλους
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: Ọ̀rọ̀ náà jẹ́ plural ó sì tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá.
- source_word: ἐπλήσθησαν ζήλου
  choice: ìlara kún wọn
  rationale: ζῆλος lè túmọ̀ sí ìtara tàbí ìlara, ṣùgbọ́n àyíká ọ̀rọ̀ ọ̀tá yìí ṣe àtìlẹ́yìn fún ìlara; ọ̀rọ̀ Yorùbá náà tún pa àwòrán ‘kún’ mọ́.
- source_word: ἀντέλεγον
  choice: wọ́n bẹ̀rẹ̀ sí í tako
  rationale: Imperfect náà lè fi ìbẹ̀rẹ̀ àti ìtẹ̀síwájú ìṣe hàn; ‘bẹ̀rẹ̀ sí í tako’ bá ìṣàn ìtàn mu.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: ohun tí Paulu ń sọ
  rationale: Ìtumọ̀ adayeba yìí mú akoonu ọ̀rọ̀ Paulu àti ìṣe tí ń lọ lọ́wọ́ hàn, bí ó tilẹ̀ jẹ́ pé ó yí passive Gíríìkì padà sí active Yorùbá.
- source_word: βλασφημοῦντες
  choice: wọ́n sì ń sọ̀rọ̀-òdì sí i
  rationale: Nínú àyíká yìí ó túmọ̀ sí sísọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ àbùkù; a kò sọ ohun tí ọ̀rọ̀ náà dojú kọ ní pàtó ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Kí ‘àwọn Júù’ má bàa di ìdálẹ́bi gbogbo àwọn Júù
  choice: àwọn Júù[a]
  alternative: àwọn aṣáájú Júù
  rationale: Gíríìkì sọ ‘àwọn Júù’ ní gbangba, kò sì sọ pé àwọn aṣáájú nìkan ni. Àkọ́silẹ̀ fi hàn pé ẹgbẹ́ Júù agbègbè tí ń tako Paulu nínú ìṣẹ̀lẹ̀ yìí ni, kì í ṣe gbogbo àwọn Júù.
- issue: Ìtumọ̀ ζῆλος
  choice: ìlara
  alternative: ìtara
  rationale: Rírí ọ̀pọ̀ ènìyàn, títako ọ̀rọ̀ Paulu, àti sísọ̀rọ̀-òdì mú kí ìtumọ̀ búburú ‘ìlara’ bá àyíká mu jù, bí ó tilẹ̀ jẹ́ pé a pa àṣàyàn lexical mọ́ nínú àkọ́silẹ̀.
- issue: Ohun tí βλασφημοῦντες dojú kọ
  choice: wọ́n ń sọ̀rọ̀-òdì sí i
  alternative: wọ́n ń sọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Gíríìkì kò sọ object náà ní pàtó; nítorí náà a yẹra fún fífi Ọlọ́run tàbí Paulu sí i gẹ́gẹ́ bí ohun tí ọ̀rọ̀ náà dojú kọ láìsí ẹ̀rí tó ṣe kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá ṣe ti ẹ̀dá. Èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo ‘sọ̀rọ̀-òdì’ fún βλασφημέω láti pa agbára ọ̀rọ̀ náà mọ́ láì pinnu object tí Gíríìkì kò sọ.
