id: ACT.13.47
reference: Acts 13:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: yo
  text: 'Nítorí bẹ́ẹ̀ ni Olúwa ti pàṣẹ fún wa pé: “Mo ti fi ọ́ ṣe ìmọ́lẹ̀ fún àwọn orílẹ̀-èdè[a], kí ìwọ lè jẹ́ ìgbàlà dé òpin ayé[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmọ́lẹ̀ fún àwọn Kèfèrí.” Ọ̀rọ̀ Gíríìkì ἐθνῶν lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn Kèfèrí,” ìyẹn àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “dé àwọn ìpẹ̀kun ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: báyìí
  rationale: Ó ń tọ́ka sí bí àṣẹ Olúwa ṣe dúró gẹ́gẹ́ bí ìdí fún ohun tí Pọ́ọ̀lù àti Bánábà ń ṣe; ‘báyìí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐντέταλται
  choice: ti pàṣẹ
  rationale: Àkókò perfect fi hàn pé àṣẹ náà ti jẹ́ fífún, ó sì ṣì ní agbára; ‘ti pàṣẹ’ pa ọlá-àṣẹ àti ipa tó ń bá a lọ mọ́.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ẹni Ọlọ́run tó sọ ọ̀rọ̀ Ìwé Mímọ́ yìí.
- source_word: Τέθεικά σε
  choice: Mo ti fi ọ́ ṣe
  rationale: Ó sọ ìyàn tàbí ìgbékalẹ̀ tó ti fìdí múlẹ̀; ọ̀rọ̀ yìí jẹ́ àdánidá ju ‘Mo ti gbé ọ kalẹ̀’ lọ nínú àyíká yìí.
- source_word: εἰς φῶς ἐθνῶν
  choice: ṣe ìmọ́lẹ̀ fún àwọn orílẹ̀-èdè
  rationale: ‘Ìmọ́lẹ̀’ pa àkàwé náà mọ́, ‘fún’ sì sọ ipa tàbí ète náà ní Yorùbá tó ṣe kedere. ‘Àwọn orílẹ̀-èdè’ pa ìtumọ̀ gbòòrò ἐθνῶν mọ́.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: kí ìwọ lè mú ìgbàlà dé
  rationale: Articular infinitive náà ń fi ète tàbí àbájáde hàn. Yorùbá yìí ṣe kedere, ṣùgbọ́n kò sọ pé ẹni náà fúnra rẹ̀ ni ìgbàlà; ó jẹ́ ọ̀nà tí ìgbàlà fi dé.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: dé òpin ayé
  rationale: Ó tẹ̀lé singular ἐσχάτου, ó sì jẹ́ gbólóhùn Yorùbá tó ṣeé lóye fún ibi tó jìnnà jù lọ lórí ilẹ̀ ayé.
theological_decisions:
- issue: Bí àsọtẹ́lẹ̀ Aísáyà nípa ìránṣẹ́ ṣe kan iṣẹ́ Pọ́ọ̀lù àti Bánábà
  choice: Pa ọ̀rọ̀ àyọlò náà mọ́ ní ẹnìkejì ẹyọ (‘ọ́/ìwọ’), láì ṣàlàyé ẹni tí ó ń tọ́ka sí.
  alternative: Ṣàtúnkọ ọ́ ní ọ̀pọ̀ tàbí sọ ní tààrà pé àwọn aposteli ni àsọtẹ́lẹ̀ náà ń sọ̀rọ̀ nípa wọn.
  rationale: Gíríìkì fi àyọlò náà sílẹ̀ ní ẹyọ, kò sì tú ìbáṣepọ̀ láàárín ìránṣẹ́ inú Aísáyà àti iṣẹ́ àwọn aposteli. Ìtumọ̀ náà gbọ́dọ̀ pa ìfúnpá ẹ̀kọ́-ìgbàgbọ́ yìí mọ́.
- issue: Agbára εἰς σωτηρίαν
  choice: ‘mú ìgbàlà dé’
  alternative: ‘jẹ́ ìgbàlà’ tàbí ‘wà fún ìgbàlà’
  rationale: Yíyan yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún fífi ìdánimọ̀ ẹni náà pẹ̀lú ìgbàlà múlẹ̀ ju bí Gíríìkì ṣe mú un dandan lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè mu. Gbólóhùn àyọlò náà pa ẹnìkejì ẹyọ ti Gíríìkì mọ́, kò sì yanjú ẹni tí ‘ọ́/ìwọ’ ń tọ́ka sí. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
