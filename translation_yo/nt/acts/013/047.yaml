  to: 'Nítorí bẹ́ẹ̀ ni Olúwa ti pàṣẹ fún wa pé: “Mo ti fi ọ́ ṣe ìmọ́lẹ̀ fún àwọn orílẹ̀-èdè[a], kí ìwọ lè jẹ́ ìgbàlà dé òpin ayé[b].”'
