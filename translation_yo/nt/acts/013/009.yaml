  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: yo
  text: Ṣùgbọ́n Saulu, ẹni tí a tún ń pè ní Paulu, nígbà tí Ẹ̀mí Mímọ́ kún inú rẹ̀, ó tẹjú mọ́ ọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìlànà ìpè Yorùbá tí ó wọ́pọ̀ fún orúkọ Bíbélì.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ tàbí ìtakora inú ìtàn hàn bí ìtàn ṣe yí sí ìdáhùn Saulu.
- source_word: ὁ καὶ Παῦλος
  choice: ẹni tí í ṣe Paulu pẹ̀lú
  rationale: Ó fi Paulu hàn gẹ́gẹ́ bí orúkọ kejì tí Saulu tún ní, láìsọ ìdí tí a fi mú orúkọ náà wọ inú ìtàn.
- source_word: πλησθεὶς
  choice: kún fún
  rationale: Ọ̀rọ̀ náà jẹ́ participle passive; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa èrò pé a fi Ẹ̀mí kún un mọ́.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká ìwé Ìṣe, ó tọ́ka sí Ẹ̀mí Ọlọ́run; lílo lẹ́tà ńlá ń jẹ́ kí ìtọ́kasí náà ṣe kedere.
- source_word: ἀτενίσας
  choice: ó tẹjú mọ́
  rationale: Ó túmọ̀ sí wíwo ẹnìkan dáadáa láìyí ojú kúrò; èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere àti ti ẹ̀dá.
- source_word: εἰς αὐτόν
  choice: ọ́ ọn
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe tẹjú mọ́, arọ́pò-orúkọ ohun 'ọ́ ọn' ń tọ́ka sí Elima gẹ́gẹ́ bí ẹni tí Saulu ń wò.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Àyíká ìwé Ìṣe àti bí Luku ṣe máa ń lo gbólóhùn náà fi hàn pé Ẹ̀mí Mímọ́ Ọlọ́run ni, kì í ṣe ẹ̀mí mímọ́ kan lásán.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A kò fi àmì àlàyé [a] sí 'Saulu' nítorí àlàyé Gẹ̀ẹ́sì náà tún sọ ohun tí ọ̀rọ̀ pàtàkì ti sọ, tí kò sì fi yíyan ọ̀rọ̀ Gíríìkì mìíràn hàn.
