  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: yo
  text: Nígbà tí wọ́n dé Sálámì[a], wọ́n ń kéde ọ̀rọ̀ Ọlọ́run nínú àwọn sínágọ́gù àwọn Júù; wọ́n sì tún ní Jòhánù gẹ́gẹ́ bí olùrànlọ́wọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n ti dé Sálámì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí olùṣèrànṣẹ́” tàbí “gẹ́gẹ́ bí ẹni tí ń ṣiṣẹ́ ràn wọ́n lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι
  choice: Nígbà tí wọ́n dé
  rationale: Ọ̀rọ̀ náà, pẹ̀lú ἐν àti orúkọ ibi, ń tọ́ka sí dídé sí ibì kan; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò ti participle mọ́.
- source_word: Σαλαμῖνι
  choice: Sálámì
  rationale: Ìkọ̀wé orúkọ ìlú Σαλαμίς ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà Yorùbá.
- source_word: κατήγγελλον
  choice: wọ́n ń kéde
  rationale: Fọ́ọ̀mù imperfect náà fi iṣẹ́ tí wọ́n ń ṣe hàn; “kéde” mú ìtumọ̀ ìpolongo ní gbangba jáde láì dín un kù sí ìwàásù nìkan.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa ìsopọ̀ genitive àti ìtumọ̀ ọ̀rọ̀ tàbí iṣẹ́ Ọlọ́run mọ́ láì fi àlàyé míì kún un.
- source_word: συναγωγαῖς
  choice: àwọn sínágọ́gù
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó dájú fún ibi ìpéjọsìn àwọn Júù nínú àyíká yìí.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Níhìn-ín ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn Júù ní ti ẹ̀sìn àti ẹ̀yà, kì í ṣe àwọn ará Jùdíà nìkan.
- source_word: εἶχον δὲ καὶ
  choice: wọ́n sì tún ní
  rationale: “sì” mú ìyípadà kékeré tí δέ ń ṣe jáde, “tún” sì pa agbára àfikún καί mọ́.
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Ìkọ̀wé orúkọ Ἰωάννης tí ó ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: ὑπηρέτην
  choice: gẹ́gẹ́ bí olùrànlọ́wọ́
  rationale: Ó ṣàfihàn ẹni tó ń ṣe ìrànlọ́wọ́ tàbí iṣẹ́ abẹ́ àṣẹ láì mú èrò ẹrú wọ inú ọ̀rọ̀ náà.
