id: ACT.13.29
reference: Acts 13:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti mú gbogbo ohun tí a ti kọ nípa rẹ̀ ṣẹ, wọ́n sọ ọ́ kalẹ̀ láti orí igi[a], wọ́n sì gbé e sínú ibojì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àgbélébùú.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “igi”; a tún máa ń lò ó fún ohun èlò onígi tí wọ́n fi ń pa ènìyàn, ó sì ṣeé ṣe kó ń tọ́ka sí Diutarónómì 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí ... sì
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ lẹ́yìn tí wọ́n parí ohun tí a sọ tẹ́lẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú ìtàn Yorùbá.
- source_word: ἐτέλεσαν
  choice: ti mú ... ṣẹ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ohun kan dé òpin tàbí ṣíṣe àṣeparí rẹ̀. ‘Mú ... ṣẹ’ bá àyíká yìí mu, níbi tí àwọn ènìyàn fi ìṣe wọn mú ohun tí a kọ nípa Jesu ṣẹ.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: gbogbo ohun tí a ti kọ nípa rẹ̀
  rationale: Ó pa ìtumọ̀ gbooro ti πάντα mọ́, ó sì fi hàn pé àwọn ohun náà ti wà ní àkọsílẹ̀ ṣáájú ìṣẹ̀lẹ̀ yìí.
- source_word: καθελόντες
  choice: wọ́n sọ ọ́ kalẹ̀
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe tó tẹ̀ lé ara wọn lọ́nà àdánidá ní Yorùbá, pẹ̀lú ìtumọ̀ mímú òkú rẹ̀ sọ̀ kalẹ̀ láti ibi tí wọ́n kàn án mọ́.
- source_word: ἀπὸ τοῦ ξύλου
  choice: kúrò lórí igi
  rationale: ‘Igi’ pa ìtumọ̀ gangan ξύλον mọ́, ó sì lè pa ìró àfihàn sí Diutarónómì 21:23 mọ́ láìfi ‘àgbélébùú’ sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ìtumọ̀ tí a ti pinnu tẹ́lẹ̀.
- source_word: ἔθηκαν
  choice: wọ́n sì gbé e
  rationale: τίθημι ní ìtumọ̀ fífi tàbí gbígbé ohun kan sí ibì kan. Gbólóhùn yìí jẹ́ èdè Yorùbá tó ṣe kedere fún gbígbé òkú sínú ibojì, láìfi àlàyé míì kún un.
- source_word: εἰς μνημεῖον
  choice: sínú ibojì
  rationale: Nínú àyíká ìsìnkú yìí, μνημεῖον jẹ́ ibi tí a gbé òkú sí; ‘ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ξύλον nínú àkọsílẹ̀ ikú Jesu
  choice: igi
  alternative: àgbélébùú
  rationale: Ọ̀rọ̀ Gíríìkì náà ni ξύλον, kì í ṣe σταυρός. ‘Igi’ pa àṣàyàn ọ̀rọ̀ orísun àti àfihàn tó ṣeé ṣe sí ègún ẹni tí a so mọ́ igi mọ́; àkọ́lé ìsọdipúpọ̀ ‘àgbélébùú’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tó bá yẹ, a sì pa ìtẹ̀síwájú ìtàn àti ọ̀rọ̀-orísun ‘igi’ mọ́.
