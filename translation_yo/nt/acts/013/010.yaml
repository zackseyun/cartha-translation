id: ACT.13.10
reference: Acts 13:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: yo
  text: Ó sì wí pé, “Ìwọ tí o kún fún onírúurú ẹ̀tàn àti gbogbo ìwà ìbàjẹ́, ọmọ Èṣù, ọ̀tá gbogbo òdodo,[a] ṣé ìwọ kì yóò dáwọ́ yíyí àwọn ọ̀nà Olúwa tí ó tọ́ padà bí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀tá gbogbo ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: tí o kún fún onírúurú ẹ̀tàn
  rationale: ‘Kún fún’ ṣàfihàn πλήρης pẹ̀lú ohun tí ó tẹ̀ lé e; ‘onírúurú ẹ̀tàn’ mú agbára παντός jáde ní Yorùbá àdánidá, nígbà tí ‘ẹ̀tàn’ bá δόλος mu.
- source_word: πάσης ῥᾳδιουργίας
  choice: gbogbo ìwà búburú
  rationale: ῥᾳδιουργία tọ́ka sí ìwà aláìlábùkù àti ìṣe burúkú tí kò ní ìdúróṣinṣin; ‘gbogbo ìwà búburú’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì da a pọ̀ mọ́ ‘ẹ̀tàn.’
- source_word: υἱὲ διαβόλου
  choice: ọmọ Èṣù
  rationale: ‘Ọmọ’ pa àwòrán ìbátan tàbí ìfarajọ ìwà inú υἱέ mọ́; ‘Èṣù’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún διάβολος.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: ọ̀tá gbogbo òdodo
  rationale: ‘Òdodo’ ṣàfihàn δικαιοσύνη gẹ́gẹ́ bí ohun tí ó tọ́ níwà àti níṣe; ìtumọ̀ ‘ìdájọ́ òdodo’ ṣì ṣeé ṣe, a sì fi í sí àlàyé ìsàlẹ̀.
- source_word: οὐ παύσῃ
  choice: ìwọ kò ha ní dáwọ́ ... dúró
  rationale: Ìbéèrè àsọyé yìí jẹ́ ìbáwí líle; ‘kò ha ní dáwọ́ ... dúró’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ẹni náà ṣíwọ́ ìṣe kan.
- source_word: διαστρέφων
  choice: yíyí ... po
  rationale: ‘Yí ... po’ pa àwòrán yíyí ohun tí ó tọ́ kúrò ní ipò rẹ̀ mọ́, ó sì bá ‘àwọn ọ̀nà ... tí ó tọ́’ ṣiṣẹ́ dáadáa.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: àwọn ọ̀nà Olúwa tí ó tọ́
  rationale: ‘Àwọn ọ̀nà’ gba ìtumọ̀ gidi àti àkàwé ὁδοί; ‘tí ó tọ́’ fi εὐθείας hàn láìsọ ìtumọ̀ rẹ̀ di ẹ̀kọ́ mìíràn; ‘Olúwa’ ni ìtumọ̀ κύριος.
- source_word: Ὦ
  choice: Ìwọ tí o
  rationale: Ọ̀nà yìí mú ìpè tààrà àti ìtẹnumọ́ Ὦ jáde ní Yorùbá òde òní láìlo ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ní pàtàkì túmọ̀ sí gbogbo ohun tí ó tọ́ níwà àti níṣe. Síbẹ̀, ó tún lè ní ìtumọ̀ ìdájọ́ tí ó tọ́, nítorí náà a pa àṣàyàn náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì pa líle ìbáwí inú ẹsẹ náà mọ́. Àmì àlàyé [a] wà lẹ́yìn ‘òdodo,’ ibi tí àṣàyàn ìtumọ̀ náà kan.
