id: ACT.13.12
reference: Acts 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: yo
  text: Nígbà náà, nígbà tí gómìnà-àgbà náà rí ohun tí ó ṣẹlẹ̀, ó gbàgbọ́, ó sì yà á lẹ́nu nípa ẹ̀kọ́ Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀kọ́ Olúwa” tún lè túmọ̀ sí “ẹ̀kọ́ tí Olúwa ń kọ́” tàbí “ẹ̀kọ́ nípa Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ju ọ̀kan lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ nínú ìtàn hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἰδὼν
  choice: nígbà tí ... rí
  rationale: Gbólóhùn àsìkò yìí tú participle aorist náà jáde lọ́nà Yorùbá tó ṣe kedere, láìsọ ìbáṣepọ̀ àsìkò rẹ̀ nù.
- source_word: ὁ ἀνθύπατος
  choice: aṣojú gómìnà Róòmù
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ìṣàkóso Róòmù pàtó fún proconsul; ìtumọ̀ yìí yà á sọ́tọ̀ sí gómìnà lásán, ó sì rọrùn fún òǹkàwé Yorùbá òde òní.
- source_word: τὸ γεγονός
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún participle perfect tí a lò gẹ́gẹ́ bí nọ́ọ̀nù, ó sì tọ́ka sí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ tán.
- source_word: ἐπίστευσεν
  choice: ó gbàgbọ́
  rationale: A kò fi ohun tí ó gbàgbọ́ lé e lórí nítorí Gíríìkì kò sọ object kan ní kedere.
- source_word: ἐκπλησσόμενος
  choice: yà á lẹ́nu
  rationale: Àpólà yìí fi ìyàlẹ́nu líle hàn ní Yorùbá àdánidá, ó sì pa iṣẹ́ participle gẹ́gẹ́ bí ipò tó bá ìgbàgbọ́ náà lọ mọ́.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: ẹ̀kọ́ ... sì yà á lẹ́nu
  rationale: Ìṣètò Yorùbá yìí sọ ẹ̀kọ́ náà di ohun tó fa ìyàlẹ́nu, bí ἐπί pẹ̀lú dative ṣe ń ṣiṣẹ́ níbí.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: A fi genitive náà hàn nípasẹ̀ àkójọpọ̀ nọ́ọ̀nù Yorùbá ‘ẹ̀kọ́ Olúwa,’ èyí tí ó lè túmọ̀ sí ẹ̀kọ́ tí Olúwa ní, tí ó ti ọ̀dọ̀ rẹ̀ wá, tàbí tí ó jẹ́ nípa rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω láìsí object tí a sọ jáde
  choice: ó gbàgbọ́
  alternative: ó gba Olúwa gbọ́; ó gba ìhìn rere náà gbọ́
  rationale: Àyíká fi ìgbàgbọ́ Kristẹni hàn, ṣùgbọ́n Gíríìkì kò sọ object náà; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ orísun.
- issue: Ìtumọ̀ genitive nínú τοῦ κυρίου
  choice: ẹ̀kọ́ Olúwa
  alternative: ẹ̀kọ́ tí Olúwa ń kọ́; ẹ̀kọ́ nípa Olúwa
  rationale: Àkójọpọ̀ Yorùbá náà pa àìdánilójú mọ́ bóyá Olúwa ni orísun tàbí ẹni tí ẹ̀kọ́ náà dá lé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo àlàyé oyè Róòmù dípò àyálò-ọ̀rọ̀ tí ọ̀pọ̀ ènìyàn lè má mọ̀.
