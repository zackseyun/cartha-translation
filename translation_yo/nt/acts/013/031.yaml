id: ACT.13.31
reference: Acts 13:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: yo
  text: Ó farahàn[a] sí àwọn tí wọ́n ti bá a gòkè láti Galili lọ sí Jerusalẹmu fún ọ̀pọ̀ ọjọ́; àwọn wọ̀nyí sì ni àwọn ẹlẹ́rìí rẹ̀ nísinsìnyí sí àwọn ènìyàn náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a rí i fún ọ̀pọ̀ ọjọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ títúmọ̀ lọ́nà yìí tó tẹ̀lé ìrísí rẹ̀ pẹkipẹki, pàápàá nínú àyíká ìfarahàn lẹ́yìn ìjíǹde.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe gidigidi pé “àwọn ènìyàn náà” ń tọ́ka ní pàtó sí àwọn Júù, ìyẹn àwọn ènìyàn Israẹli, nínú àyíká ọ̀rọ̀ yìí.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jesu nínú ẹsẹ tó ṣáájú; lílo “Ó” jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn tuntun ní Yorùbá.
- source_word: ὤφθη
  choice: farahàn
  rationale: Ní àyíká ìjíǹde, ọ̀rọ̀ náà sábà máa ń túmọ̀ sí pé ẹni náà farahàn sí àwọn ẹlẹ́rìí. “Farahàn” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́; àṣàyàn tó tẹ̀lé ìrísí gírámà Gíríìkì pẹkipẹki ni “wọ́n rí i.”
- source_word: ἐπὶ ἡμέρας πλείους
  choice: fún ọ̀pọ̀ ọjọ́
  rationale: Gbólóhùn náà ń sọ bí àkókò náà ṣe gùn; “fún ọ̀pọ̀ ọjọ́” ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: sí àwọn tí wọ́n ti bá a gòkè
  rationale: Ó ń tọ́ka sí àwọn tí wọ́n bá a rìn ìrìnàjò lọ sí Jerusalẹmu. “Ti bá a gòkè” fi hàn pé ìrìnàjò náà ti ṣẹlẹ̀ ṣáájú àwọn ìfarahàn, ó sì pa èrò gíga lọ sí Jerusalẹmu mọ́.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: láti Galili lọ sí Jerusalẹmu
  rationale: Èyí sọ ìbẹ̀rẹ̀ àti ibi tí ìrìnàjò náà ń lọ ní tààràtà.
- source_word: οἵτινες
  choice: àwọn wọ̀nyí
  rationale: Ọ̀rọ̀ náà ń dá ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ̀ gẹ́gẹ́ bí àwọn ẹlẹ́rìí; “àwọn wọ̀nyí” mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó fi ipò àwọn ẹlẹ́rìí ní àkókò tí a ń sọ̀rọ̀ yàtọ̀ sí àwọn ìfarahàn tó ti kọjá.
- source_word: μάρτυρες αὐτοῦ
  choice: ẹlẹ́rìí rẹ̀
  rationale: 'Ó fi ìbáṣepọ̀ wọn pẹ̀lú Jesu hàn: wọ́n jẹ́ ẹlẹ́rìí tó ń jẹ́rìí nípa rẹ̀.'
- source_word: πρὸς τὸν λαόν
  choice: fún àwọn ènìyàn náà
  rationale: πρός pẹ̀lú accusative níbí ń tọ́ka sí àwọn tí ẹ̀rí wọn ń lọ bá; “fún” sọ ipa àwọn olùgbọ́ ẹ̀rí náà ní Yorùbá àdánidá.
- source_word: λαόν
  choice: àwọn ènìyàn náà
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí àwọn Júù tàbí Israẹli, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò fi orúkọ yẹn kún un; ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
theological_decisions:
- issue: Irú èdè tí a lò fún ìfarahàn lẹ́yìn ìjíǹde
  choice: Ó farahàn
  alternative: Wọ́n rí i
  rationale: “Ó farahàn” sọ ìṣẹ̀lẹ̀ náà ní èdè Yorùbá àdánidá láì dín ìjẹ́rìí ìtàn nípa ìjíǹde kù. Àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ tó tẹ̀lé passive Gíríìkì mọ́.
- issue: Àwọn wo ni “àwọn ènìyàn náà” ń tọ́ka sí?
  choice: àwọn ènìyàn náà
  alternative: àwọn ènìyàn Israẹli / àwọn Júù
  rationale: Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka gidigidi sí Israẹli, λαός fúnra rẹ̀ kò sọ “Israẹli” tàbí “Júù” ní tààràtà. A kò fẹ́ yanjú ohun tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò sọ ní kedere sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Bá a gòkè” pa àwòrán ìrìnàjò lọ sí Jerusalẹmu mọ́, nígbà tí ìtòlẹ́sẹẹsẹ gbólóhùn kejì mú ẹni tí “àwọn wọ̀nyí” ń tọ́ka sí ṣe kedere fún òǹkàwé òde òní.
