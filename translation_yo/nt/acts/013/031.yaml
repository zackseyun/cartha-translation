  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì Gíríìkì mọ́: Jesu farahàn fún àkókò gígùn sí àwọn tó bá a lọ láti Galili sí Jerusalẹmu, tí wọ́n sì jẹ́ ẹlẹ́rìí rẹ̀ báyìí. Ṣùgbọ́n ìṣọ̀kan ''fún ... sí'' lẹ́yìn ''farahàn'' kò dára nínú Yorùbá, àti ''náà'' ní ''àwọn ènìyàn náà'' fi ìtọ́ka àfihàn kún λαόν tí kò sí nínú ìpilẹ̀ṣẹ̀.'
  naturalness: 'A tún ọ̀rọ̀ náà ṣe sí ìtòlẹ́sẹẹsẹ Yorùbá tó rọrùn: ''Ó farahàn sí àwọn ... fún ọ̀pọ̀ ọjọ́.'' Lílo ''àwọn ẹlẹ́rìí rẹ̀'' tún jẹ́ kí ọ̀pọ̀ ẹni nínú μάρτυρες hàn gbangba.'
  terminology: '''Farahàn,'' ''ẹlẹ́rìí,'' ''Galili,'' àti ''Jerusalẹmu'' yẹ fún Yorùbá boṣewa àti fún àyíká ìjíǹde. ''Sí àwọn ènìyàn'' ń ṣàfihàn ìhùwàsí ìtọ́sọ́nà ti πρὸς τὸν λαόν láì sọ pé Israẹli ni ní ọ̀rọ̀ pàtàkì.'
