revisions:
- from: Ó farahàn[a] fún ọ̀pọ̀ ọjọ́ sí àwọn tí wọ́n ti bá a gòkè láti Galili lọ sí Jerusalẹmu; àwọn wọ̀nyí sì ni ẹlẹ́rìí rẹ̀ nísinsìnyí fún àwọn ènìyàn náà.[b]
  to: Ó farahàn[a] sí àwọn tí wọ́n ti bá a gòkè láti Galili lọ sí Jerusalẹmu fún ọ̀pọ̀ ọjọ́; àwọn wọ̀nyí sì ni àwọn ẹlẹ́rìí rẹ̀ nísinsìnyí sí àwọn ènìyàn náà.[b]
  rationale: Àtúnṣe náà ṣàtúnṣe ìṣọ̀kan ọ̀rọ̀ 'farahàn sí,' ó gbe gbolóhùn àkókò sí ibi tí ó dára nínú Yorùbá, ó sì mú ọ̀pọ̀ 'ẹlẹ́rìí' hàn. A yọ 'náà' kúrò nínú ọ̀rọ̀ pàtàkì kí a má bàa fi àfihàn tí Gíríìkì kò sọ kún un. Àkọsílẹ̀ b ń tọ́ka sí gbolóhùn tuntun náà ('àwọn ènìyàn'), nítorí náà a tún un ṣe bákan náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:27Z'
