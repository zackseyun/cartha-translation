id: ACT.13.49
reference: Acts 13:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: yo
  text: Ọ̀rọ̀ Olúwa sì ń tàn káàkiri gbogbo agbègbè náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìhìn Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: ń tàn ká
  rationale: Ọ̀rọ̀-ìṣe aláìpé ní ohùn àfaradà fi ìṣe tí ó ń bá a lọ ní àkókò ìtàn hàn. Ní Yorùbá, “ń tàn ká” jẹ́ ọ̀nà àdánidá láti sọ pé a ń mú ìhìn náà dé ibi gbogbo, láìfi ẹni tó ń tan án sí iwájú.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ̀síwájú nínú ìtàn; “sì” bá iṣẹ́ yìí mu ní Yorùbá láìfi ìtakora líle kún un.
- source_word: ὁ λόγος
  choice: Ọ̀rọ̀
  rationale: Nínú Ìṣe àwọn Àpọ́sítélì, λόγος sábà ń tọ́ka sí ìhìn tí a ń kéde. “Ọ̀rọ̀” pa àṣà ọ̀rọ̀ inú ìwé náà mọ́, ó sì lè ru ìtumọ̀ “ìhìn” nínú àyíká yìí.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος, ó sì pa ìró ìgbàgbọ́ àti lítíréṣọ̀ “ọ̀rọ̀ Olúwa” mọ́ láìdín rẹ̀ kù sí ọ̀rọ̀ àṣẹ nìkan.
- source_word: δι’ ὅλης τῆς χώρας
  choice: ká gbogbo agbègbè náà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìtànkálẹ̀ náà dé gbogbo àgbègbè tó wà ní àyíká; “ká gbogbo agbègbè náà” jẹ́ Yorùbá àdánidá, kò sì tú χώρα sí orílẹ̀-èdè òde òní.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ àṣẹ, ìbáṣepọ̀ Kristi, àti ìró Májẹ̀mú tí ọ̀rọ̀ náà lè ní nínú Ìṣe àwọn Àpọ́sítélì mọ́; “Ọ̀gá” yóò dín ìtumọ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìtúmọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán; “ń tàn ká” yàgò fún àfaradà aláìdánidá ní Yorùbá ṣùgbọ́n ó pa ìṣe tí ń bá a lọ mọ́.
