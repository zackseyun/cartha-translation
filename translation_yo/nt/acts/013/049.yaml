revisions:
- from: Ọ̀rọ̀ Olúwa sì ń tàn ká gbogbo agbègbè náà.[a]
  to: Ọ̀rọ̀ Olúwa sì ń tàn káàkiri gbogbo agbègbè náà.[a]
  rationale: The revision changes only the manner-and-extent expression from ‘ń tàn ká’ to the more natural ‘ń tàn káàkiri.’ It preserves the source’s imperfect passive sense without imposing a marked passive form in Yoruba, and it retains the same referent, register, and footnote alternative.
  reviewer_model: gpt-5.6-terra
