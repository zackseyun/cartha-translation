  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: yo
  text: Ẹ̀yin ará[a], ẹ̀yin ọmọ ìran Abrahamu, àti ẹ̀yin tí ń bẹ̀rù Ọlọ́run láàárín yín[b], sí wa ni a rán ọ̀rọ̀ ìgbàlà yìí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘Ẹ̀yin ọkùnrin ará.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà; ó sì lè jẹ́ ìkíni sí àwùjọ tó gbòòrò.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí ‘ẹ̀yin olùbẹ̀rù Ọlọ́run láàárín yín’; ó ṣeé ṣe kí ó tọ́ka sí àwọn Kèfèrí tí wọ́n ń jọ́sìn Ọlọ́run Israẹli, tí wọ́n sì ń dara pọ̀ mọ́ sínágọ́gù.
    reason: cultural_note
  - marker: c
    text: Tàbí ‘ìhìn-iṣẹ́ ìgbàlà yìí ni a rán sí wa.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ó jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún pípe àwọn olùgbọ́ ní Yorùbá. Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n ‘ará’ lè bá àwùjọ tí ó gbòòrò mu láì fi ‘arákùnrin àti arábìnrin’ kún ohun tí orísun kò sọ ní tààrà.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: ẹ̀yin ọmọ ìran Abrahamu
  rationale: ‘Ọmọ ìran’ pa ìtumọ̀ ìbátan àti ìran-ìdílé mọ́ ní Yorùbá àdánidá; fífi akọ ‘ọmọkùnrin’ hàn níbí yóò dun bí ìtọ́ka sí akọ nìkan ju ìdí ọ̀rọ̀ náà lọ.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: ẹ̀yin tí ó wà láàárín yín tí ẹ̀ ń bẹ̀rù Ọlọ́run
  rationale: Ìtumọ̀ àpèjúwe yìí pa ‘bẹ̀rù Ọlọ́run’ mọ́, kò sì sọ ọ́ di orúkọ ẹgbẹ́ pàtó, bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí àwọn Kèfèrí tí wọ́n ń dara pọ̀ mọ́ sínágọ́gù.
- source_word: ἡμῖν
  choice: àwa ni ... sí
  rationale: Ìṣètò ‘àwa ni a rán ... sí’ fi ìtọ́sọ́nà dative náà hàn ní Yorùbá kedere, ó sì tẹ ‘sí wa’ mọ́lẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe gbé ἡμῖν síwájú.
- source_word: ὁ λόγος
  choice: iṣẹ́ ìròyìn
  rationale: Ní àyíká ìwàásù yìí, ‘iṣẹ́ ìròyìn’ sọ ìtumọ̀ λόγος gẹ́gẹ́ bí ọ̀rọ̀ tí a kéde ní Yorùbá òde òní; ‘ọ̀rọ̀’ tún ṣeé ṣe.
- source_word: τῆς σωτηρίας ταύτης
  choice: ìgbàlà yìí
  rationale: A pa ìbáṣepọ̀ genitive mọ́ nínú ‘iṣẹ́ ìròyìn ìgbàlà yìí,’ láì pinnu bóyá ó jẹ́ iṣẹ́ ìròyìn nípa ìgbàlà tàbí èyí tí ó ń mú ìgbàlà wá.
- source_word: ἐξαπεστάλη
  choice: a rán ... sí
  rationale: Ìṣe aláìṣe (passive) aorist náà ni a fi hàn pẹ̀lú ìṣètò Yorùbá ‘a rán ... sí’; kò ṣe dandan láti fi ẹni tí ó rán án hàn.
theological_decisions:
- issue: Ìdánimọ̀ àwọn φοβούμενοι τὸν θεόν
  choice: A túmọ̀ ọ́ ní àpèjúwe pé ‘ẹ̀yin ... tí ẹ̀ ń bẹ̀rù Ọlọ́run.’
  alternative: ‘ẹ̀yin olùbẹ̀rù Ọlọ́run’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ àwọn Kèfèrí tó sún mọ́ sínágọ́gù
  rationale: Gíríìkì lè jẹ́ àpèjúwe tàbí ọ̀rọ̀ tó fẹ́rẹ̀ẹ́ di orúkọ ẹgbẹ́. Ọ̀rọ̀ inú ẹsẹ̀ pa àìdánilójú náà mọ́, àlàyé ìtàn sì wà ní àlàyé ìsàlẹ̀.
- issue: Èdè akọ nínú ìkíni Ἄνδρες ἀδελφοί àti υἱοὶ
  choice: ‘Ẹ̀yin ará ... ẹ̀yin ọmọ ìran Abrahamu.’
  alternative: ‘Ẹ̀yin ọkùnrin ará ... ẹ̀yin ọmọkùnrin ìran Abrahamu’
  rationale: Àwọn fọ́ọ̀mù Gíríìkì jẹ́ akọ, ṣùgbọ́n wọ́n ń ṣiṣẹ́ gẹ́gẹ́ bí ìkíni gbangba àti ìtọ́ka sí ìran. Èdè Yorùbá tí kò fi akọ hàn níbí pa iṣẹ́ ọ̀rọ̀ náà mọ́ láì sọ pé àwọn obìnrin kò sí nínú àwùjọ.
- issue: Ẹni tí ‘ἡμῖν’ ń tọ́ka sí
  choice: A pa ‘àwa’ mọ́ ní kedere, láì ṣàlàyé ẹni gbogbo tí ó wà nínú rẹ̀.
  alternative: Yí i sí ‘ẹ̀yin’ tàbí sọ pé àwọn olùgbọ́ nìkan ni
  rationale: Ẹ̀rí ọ̀rọ̀ SBLGNT tí a fún ní ἡμῖν (‘sí wa’), nítorí náà a kò yí pronoun náà padà tàbí pinnu ààlà rẹ̀ ní ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó yẹ fún kíkà ní gbangba. A lo ‘ẹ̀yin’ fún ìbáṣepọ̀ ọ̀wọ̀ pẹ̀lú àwùjọ, a sì fi àmì ohùn sí ibi tí ó yẹ. ‘Iṣẹ́ ìròyìn’ jẹ́ ọ̀rọ̀ tó ṣe kedere fún ìkéde, nígbà tí àlàyé ìsàlẹ̀ pa ‘ọ̀rọ̀’ mọ́ gẹ́gẹ́ bí àṣàyàn tó sún mọ́ fọ́ọ̀mù Gíríìkì.
