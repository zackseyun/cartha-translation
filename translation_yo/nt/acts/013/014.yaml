  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n tẹ̀ síwájú láti Pẹ́gà, wọ́n sì dé Áńtíókù ní Písídíà[a]. Ní ọjọ́ Sábáàtì, wọ́n wọ sínágọ́gù, wọ́n sì jókòó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Áńtíókù ti Písídíà.” Gíríìkì ní, “Áńtíókù ní Písídíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Ṣùgbọ́n àwọn náà
  rationale: δέ ń tẹ ìtàn náà síwájú pẹ̀lú ìyàtọ̀ díẹ̀; αὐτοὶ jẹ́ arọ́pò-orúkọ tí a sọ ní kedere, nítorí náà “àwọn náà” fi ìtẹnumọ́ kékeré rẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: tẹ̀ síwájú láti Pẹ́gà
  rationale: διέρχομαι nínú àkọsílẹ̀ ìrìn-àjò yìí túmọ̀ sí pé wọ́n ń bá ìrìn-àjò wọn lọ láti ibì kan; “tẹ̀ síwájú láti” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láìfi ọ̀nà ìrìn wọn kún ohun tí Gíríìkì sọ.
- source_word: παρεγένοντο
  choice: wọ́n sì dé
  rationale: παραγίνομαι nínú ọ̀rọ̀ ìrìn-àjò túmọ̀ sí dídé ibi kan; “dé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Áńtíókù ní Písídíà
  rationale: Gbólóhùn náà dá Áńtíókù yìí mọ̀ nípa agbègbè Písídíà. “Ní Písídíà” tẹ̀ lé ìtumọ̀ ojúlówó Gíríìkì, ó sì yẹra fún yíyí orúkọ agbègbè náà di àpèjúwe tí ó lè túmọ̀ sí ohun mìíràn.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: wọ́n wọ inú sínágọ́gù
  rationale: A tú participle náà sí ọ̀rọ̀-ìṣe pípé fún Yorùbá àdánidá; “wọ inú” sọ ìwọlé sí sínágọ́gù ní kedere.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Ní ọjọ́ Ìsinmi
  rationale: Ìlò Gíríìkì yìí tọ́ka sí Sábáàtì àwọn Júù. “Ọjọ́ Ìsinmi” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì pa ìtumọ̀ ọjọ́ náà mọ́.
- source_word: ἐκάθισαν
  choice: wọ́n sì jókòó
  rationale: Aorist náà sọ ìṣe jíjókòó lasán; “jókòó” jẹ́ ìtumọ̀ Yorùbá àdánidá tí ó fi ìgbésẹ̀ náà hàn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ tí a yá láti dá ilé ìjọsìn Júù mọ̀ ní pàtó.
