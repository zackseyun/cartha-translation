id: ACT.13.15
reference: Acts 13:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ka Òfin àti àwọn Wòlíì tán, àwọn olórí sínágọ́gù ránṣẹ́ sí wọn pé, “Ẹ̀yin arákùnrin[b], bí ẹnikẹ́ni nínú yín bá ní ọ̀rọ̀ ìṣírí[a] fún àwọn ènìyàn, ẹ sọ ọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ ìyànjú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìṣírí tàbí ìyànjú.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Ẹ̀yin ọkùnrin arákùnrin,” ìpè tó fi ọ̀wọ̀ àti ìbátan hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: tí wọ́n ka ... tán
  rationale: Ó sọ iṣẹ́ kíkà Ìwé Mímọ́ ní gbangba ní sínágọ́gù ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣe kíkà mọ́.
- source_word: νόμου καὶ τῶν προφητῶν
  choice: Òfin àti àwọn Wòlíì
  rationale: Àwọn ọ̀rọ̀ náà ń tọ́ka sí ìpín méjì nínú Ìwé Mímọ́ àwọn Júù, kì í ṣe òfin kan tàbí àwọn wòlíì gẹ́gẹ́ bí ènìyàn lásán.
- source_word: ἀρχισυνάγωγοι
  choice: àwọn olórí sínágọ́gù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn tó ń bójú tó ìjọsìn sínágọ́gù, láì fi ìṣàkóso ìlú kún un.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: ránṣẹ́ sí wọn pé
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí fi hàn pé wọ́n fi iṣẹ́ ránṣẹ́ sọ ọ̀rọ̀ sí wọn; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin arákùnrin
  rationale: Ó pa ìpè akọ tó ní ọ̀wọ̀ àti ìbátan mọ́, ó sì bá àwọn ọkùnrin àlejò tí wọ́n ń pè láti sọ̀rọ̀ mu.
- source_word: λόγος παρακλήσεως
  choice: ọ̀rọ̀ ìṣírí
  rationale: παράκλησις lè túmọ̀ sí ìṣírí tàbí ìyànjú; “ìṣírí” jẹ́ àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
- source_word: πρὸς τὸν λαόν
  choice: fún àwọn ènìyàn
  rationale: Ó fi àwọn ènìyàn tí ọ̀rọ̀ náà wà fún hàn ní kedere.
- source_word: λέγετε
  choice: ẹ sọ ọ́
  rationale: Àṣẹ náà jẹ́ ìpè kedere pé kí wọ́n sọ ọ̀rọ̀ náà fún ìpéjọ.
theological_decisions:
- issue: Ìpè tó ní akọ níbi ìjọsìn sínágọ́gù
  choice: Ẹ̀yin arákùnrin
  alternative: Ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ἄνδρες ἀδελφοί jẹ́ akọ ní pàtó, ó sì ń bá Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ sọ̀rọ̀; a kò sọ ọ́ di ìpè tó kó gbogbo akọ àti abo.
- issue: Ìtumọ̀ παράκλησις
  choice: ìṣírí
  alternative: ìyànjú
  rationale: Àyíká ọ̀rọ̀ gba ìṣírí àti ìyànjú méjèèjì; a yan ọ̀rọ̀ tó gbòòrò, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ ìgbàlódé tó wọ́pọ̀. Àmì àlàyé [a] tẹ̀ lé ọ̀rọ̀ tó ń ṣàlàyé, [b] sì wà lẹ́yìn gbólóhùn láti ṣàlàyé ìpè “Ẹ̀yin arákùnrin.”
