revisions:
- from: ẹni tí ó wà pẹ̀lú pírónsùlù náà, Sẹ́gíọ̀sì Pọ́lọ̀, ọkùnrin olóye kan[a]. Ọkùnrin yìí pe Bánábà àti Sáùlù wá sí ọ̀dọ̀ rẹ̀, ó sì fẹ́ gidigidi láti gbọ́ ọ̀rọ̀ Ọlọ́run[b].
  to: ẹni tí ó wà pẹ̀lú pírónsùlù náà, Sẹ́gíọ̀sì Pọ́lù, ọkùnrin ọlọ́gbọ́n kan[a]. Ọkùnrin yìí pe Bánábà àti Sáùlù wá sí ọ̀dọ̀ rẹ̀, ó sì fẹ́ gidigidi láti gbọ́ ọ̀rọ̀ Ọlọ́run[b].
  rationale: 'The revision replaces a socially ambiguous term with «ọlọ́gbọ́n», which naturally describes the intelligence/discernment denoted by συνετός without adding a chiefly rank. It also regularizes Paulus as «Pọ́lù». The footnote anchors remain correctly placed: [a] follows the description of Sergius Paulus, and [b] follows «ọ̀rọ̀ Ọlọ́run».'
  reviewer_model: gpt-5.6-terra
