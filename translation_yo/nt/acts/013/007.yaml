id: ACT.13.7
reference: Acts 13:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: yo
  text: ẹni tí ó wà pẹ̀lú pírónsùlù náà, Sẹ́gíọ̀sì Pọ́lù, ọkùnrin ọlọ́gbọ́n kan[a]. Ọkùnrin yìí pe Bánábà àti Sáùlù wá sí ọ̀dọ̀ rẹ̀, ó sì fẹ́ gidigidi láti gbọ́ ọ̀rọ̀ Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin olóye” tàbí “ọkùnrin tó ní ìfòyemọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìn Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: pírónsùlù
  rationale: Ó jẹ́ oyè pàtó fún alákòóso ìgbèríko Romu kan; lílo ọ̀rọ̀ àyálò yìí pa ìtumọ̀ ìtàn náà mọ́ ju ‘gómìnà’ gbogbogbò lọ.
- source_word: σὺν
  choice: wà pẹ̀lú
  rationale: Ó fi hàn pé ẹni náà wà ní ẹgbẹ́ tàbí ní ìbáṣepọ̀ pẹ̀lú pírónsùlù; gbólóhùn yìí ṣe déédé pẹ̀lú èdè Yorùbá àdánidá.
- source_word: ἀνδρὶ συνετῷ
  choice: ọkùnrin olóye kan
  rationale: ‘Olóye’ lè tọ́ka sí ẹni tó ní òye, ìfòyemọ̀ àti ìṣọ́ra, láìsọ ọ́ di ìwà rere ní pàtó.
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa ìtẹnumọ́ àti ìpadà tọ́ka ti ọ̀rọ̀ atọ́ka Gíríìkì mọ́, ó sì mú kó ṣe kedere pé Sẹ́gíọ̀sì Pọ́lọ̀ ni a ń sọ̀rọ̀ rẹ̀.
- source_word: προσκαλεσάμενος
  choice: pe ... wá sí ọ̀dọ̀ rẹ̀
  rationale: Ó túmọ̀ sí pé ó pè wọ́n sí ara rẹ̀; èyí jẹ́ àdánidá ní Yorùbá, ó sì pa ìgbésẹ̀ alákòóso náà mọ́ láìfi tipátipá kún un.
- source_word: ἐπεζήτησεν
  choice: fẹ́ gidigidi
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ wíwá tàbí fífẹ́ ohun kan pẹ̀lú ìtara; ‘fẹ́ gidigidi’ sọ ìtara náà di mímọ̀ ní Yorùbá.
- source_word: ἀκοῦσαι
  choice: láti gbọ́
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì bá àyíká gbígbọ́ ìhìn tí a ń kéde mu.
- source_word: λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa àwòrán àti ìsọ̀rọ̀ orísun náà mọ́, nígbà tó tún lè túmọ̀ sí ìhìn tí Ọlọ́run fi ránṣẹ́.
- source_word: Σεργίῳ Παύλῳ
  choice: Sẹ́gíọ̀sì Pọ́lọ̀
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Bánábà àti Sáùlù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  alternative: ìhìn Ọlọ́run
  rationale: ‘Ọ̀rọ̀ Ọlọ́run’ sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú tó wà láàárín ọ̀rọ̀ tí Ọlọ́run sọ àti ìhìn nípa Ọlọ́run mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìtumọ̀ συνετῷ nípa Sẹ́gíọ̀sì Pọ́lọ̀
  choice: olóye
  alternative: ọlọ́gbọ́n; ẹni tó ní ìfòyemọ̀
  rationale: ‘Olóye’ fi ìmòye àti agbára láti lóye hàn, ṣùgbọ́n kò fi dandan sọ pé ọkùnrin náà pé ní ìwà rere tàbí nípa ẹ̀mí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn níbi tó yẹ. ‘Pírónsùlù’ jẹ́ ọ̀rọ̀ àyálò fún oyè Romu pàtó, dípò kí a sọ ọ́ di ‘gómìnà’ gbogbogbò. Àwọn àmì àlàyé [a] àti [b] ni a gbé sí ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé; èyí tún ìṣòro àtòjọ àmì inú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì ṣe.
