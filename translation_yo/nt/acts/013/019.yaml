  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: καθελὼν ni a ti túmọ̀ sí ‘pa ... run’; ἔθνη ἑπτὰ sí ‘orílẹ̀-èdè méje’; ilẹ̀ Kénáánì wà ní kedere; ilẹ̀ àwọn orílẹ̀-èdè náà sì ni a fi fún Ísírẹ́lì gẹ́gẹ́ bí ogún. Sísọ ‘àwọn ọmọ Ísírẹ́lì’ kedere jẹ́ ìtúmọ̀ àlàyé tí àyíká gbéyìn, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ẹni tí ó gba ogún náà sílẹ̀ láìsọ.'
