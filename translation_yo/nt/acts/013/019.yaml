  to: Lẹ́yìn tí ó ti pa orílẹ̀-èdè méje run ní ilẹ̀ Kénáánì, ó sì fi ilẹ̀ wọn fún àwọn ọmọ Ísírẹ́lì gẹ́gẹ́ bí ogún.[a]
  rationale: A tún ipò ‘sì’ ṣe fún ìṣàn Yorùbá, a sì ṣàtúnṣe àlàyé ìsàlẹ̀ kí ó lè fi ìtumọ̀ pípín/fífún ní ogún ti κατακληρονομέω hàn dáadáa. Ìtumọ̀ ẹsẹ náà àti ìtọ́kasí sí àwọn ọmọ Ísírẹ́lì kò yí padà.
