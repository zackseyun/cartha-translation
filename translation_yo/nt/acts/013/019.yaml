    issue: Ipo ‘sì’ nínú gbolohun akọkọ
    rationale: ‘Lẹ́yìn tí ó sì ti...’ lóye, ṣùgbọ́n ‘Lẹ́yìn tí ó ti..., ó sì...’ jẹ́ ìṣàn Yorùbá tó dára sí i, ó sì ń so àwọn ìṣe méjèèjì pọ̀.
  - severity: medium
    issue: ‘yíyan ilẹ̀ náà gẹ́gẹ́ bí ogún’ nínú àlàyé ìsàlẹ̀
    rationale: κατακληρονομέω ní ibi yìí ń tọ́ka sí pípín tàbí fífún ní ìpín ogún, kì í ṣe yíyan ilẹ̀. Àlàyé náà yẹ kí ó pa ìyàtọ̀ ọ̀rọ̀ náà mọ́ láì fi ìtumọ̀ àṣàyàn kún un.
