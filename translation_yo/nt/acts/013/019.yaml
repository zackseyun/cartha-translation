  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti pa orílẹ̀-èdè méje run ní ilẹ̀ Kénáánì, ó sì fi ilẹ̀ wọn fún àwọn ọmọ Ísírẹ́lì gẹ́gẹ́ bí ogún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó pín ilẹ̀ wọn fún àwọn ọmọ Ísírẹ́lì gẹ́gẹ́ bí ogún.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ fífún tàbí pípín ilẹ̀ náà nípasẹ̀ ogún.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: lẹ́yìn tí ó ti pa ... run
  rationale: Ọ̀rọ̀ yìí sọ nípa bí Ọlọ́run ṣe ṣẹ́gun tí ó sì mú àwọn orílẹ̀-èdè Kénáánì kúrò; ‘pa ... run’ fi agbára ìtumọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: ἔθνη ἑπτὰ
  choice: orílẹ̀-èdè méje
  rationale: Nínú àyíká ìtàn ìṣẹ́gun ilẹ̀ Kénáánì, ‘orílẹ̀-èdè’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti túmọ̀ ἔθνη.
- source_word: ἐν γῇ Χανάαν
  choice: ní ilẹ̀ Kénáánì
  rationale: Ó pa γῇ (‘ilẹ̀’) mọ́, kò sì ṣe gbólóhùn náà kúkúrú sí ‘ní Kénáánì’ nìkan.
- source_word: κατεκληρονόμησεν
  choice: ó fi ... fún ... gẹ́gẹ́ bí ogún
  rationale: Ìṣe náà lè túmọ̀ sí fífi ilẹ̀ pín tàbí yàn fún ẹnì kan gẹ́gẹ́ bí ogún. Gbólóhùn yìí pa èrò ogún mọ́, ó sì dára ní Yorùbá òde òní.
- source_word: τὴν γῆν αὐτῶν
  choice: ilẹ̀ wọn
  rationale: ‘Wọn’ tọ́ka tààrà sí àwọn orílẹ̀-èdè méje tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Ẹni tó ṣe àwọn ìṣe náà àti àwọn tó gba ilẹ̀ náà ní ogún
  choice: Ọlọ́run ni ẹni tó pa àwọn orílẹ̀-èdè náà run, ó sì fi ilẹ̀ wọn fún àwọn ọmọ Ísírẹ́lì.
  alternative: Ọlọ́run pín ilẹ̀ wọn; tàbí ó yàn ilẹ̀ wọn gẹ́gẹ́ bí ogún, láì sọ ẹni tó gbà á ní tààrà.
  rationale: Àyíká ẹsẹ náà ń ṣe àkọsílẹ̀ àwọn ohun tí Ọlọ́run ṣe nínú ìtàn Ísírẹ́lì. Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ẹni tí ó gba ilẹ̀ náà ní tààrà, àyíká ìtàn fi hàn pé àwọn ọmọ Ísírẹ́lì ni; ṣíṣe èyí kedere jẹ́ àlàyé èdè, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó ti yẹ; ‘gẹ́gẹ́ bí ogún’ pa àkòrí ogún inú Gíríìkì mọ́.
