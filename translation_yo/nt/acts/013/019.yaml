  terminology: ‘Orílẹ̀-èdè,’ ‘ilẹ̀,’ àti ‘ogún’ yẹ, wọ́n sì pa ìtumọ̀ ìtàn àti ọ̀rọ̀ ogún inú κατακληρονομέω mọ́. Ṣùgbọ́n ‘yíyan’ nínú àlàyé ìsàlẹ̀ lè yí ìtumọ̀ sí yíyan/àṣàyàn, dipo pípín tàbí pínpín nípasẹ̀ ogún; ó yẹ kí a tún un ṣe.
  issues:
