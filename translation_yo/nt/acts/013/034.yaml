id: ACT.13.34
reference: Acts 13:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: yo
  text: 'Ní ti bí ó ṣe jí i dìde kúrò nínú àwọn òkú, tí kò ní padà sí ìbàjẹ́ mọ́, ó ti sọ báyìí pé: “Èmi yóò fún yín ní àwọn ìbùkún mímọ́ ti Dáfídì, àwọn tí ó dájú.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “àwọn àánú tí ó dájú ti Dáfídì.” Gbólóhùn Gíríìkì náà ń ṣe ìrántí Aísáyà 55:3, ó sì ń tọ́ka sí àwọn ìlérí májẹ̀mú mímọ́, tí ó ṣeé gbẹ́kẹ̀ lé, tí ó ní í ṣe pẹ̀lú Dáfídì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: ó jí i dìde kúrò nínú àwọn òkú
  rationale: Ọ̀rọ̀ yìí tọ́ka sí jíjí Jesu dìde ní kedere; ‘jí i dìde’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì fi hàn pé Ọlọ́run ló ṣe iṣẹ́ náà.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: kí ó má ṣe padà ... mọ́
  rationale: Èyí mú ìtumọ̀ pé kì yóò tún padà sí ipò náà wá, ní Yorùbá tí ó ṣe kedere, láìfi èrò àfikún kún un.
- source_word: διαφθοράν
  choice: ìbàjẹ́
  rationale: Nínú àyíká ọ̀rọ̀ àjíǹde yìí, ‘ìbàjẹ́’ túmọ̀ sí jíjẹrà tàbí díbàjẹ́ ara, kì í ṣe ìwà búburú.
- source_word: οὕτως εἴρηκεν
  choice: ó ti sọ báyìí pé
  rationale: ‘Ó ti sọ’ ṣàfihàn pé ọ̀rọ̀ Ìwé Mímọ́ náà ṣì dúró, ‘báyìí pé’ sì ṣe àgbékalẹ̀ àyọlò náà lọ́nà àdánidá.
- source_word: Δώσω ὑμῖν
  choice: Èmi yóò fún yín
  rationale: Ìtumọ̀ tààrà fún ìlérí ọjọ́ iwájú ni; fífi ‘Èmi’ hàn bá ìtẹnumọ́ inú àyọlò mu.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: àwọn ìbùkún mímọ́ àti èyí tí ó dájú ti Dáfídì
  rationale: Gbólóhùn Gíríìkì náà ṣòro, ó sì ń tọ́ka sí àwọn ohun mímọ́ tí ó ṣeé gbẹ́kẹ̀ lé, tí ó ní í ṣe pẹ̀lú ìlérí májẹ̀mú Dáfídì. ‘Àwọn ìbùkún’ jẹ́ Yorùbá tí ó yéni, nígbà tí ‘mímọ́’ àti ‘tí ó dájú’ ń pa àwọn àpèjúwe méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ àyọlò Aísáyà 55:3, τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: àwọn ìbùkún mímọ́ àti èyí tí ó dájú ti Dáfídì
  alternative: àwọn àánú Dáfídì tí ó dájú; àwọn ìlérí mímọ́ tí a ṣe fún Dáfídì
  rationale: Àṣàyàn yìí pa ìtumọ̀ májẹ̀mú àti àìṣòro gbolohun Gíríìkì mọ́, láìfi ẹ̀kọ́ ìjọ kan pàtó kún ọ̀rọ̀ náà. Àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ ìbílẹ̀ àti ìtumọ̀ ìlérí hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ; àyọlò náà pa ìdíwọ̀n àti àìṣòro ọ̀rọ̀ orísun mọ́.
