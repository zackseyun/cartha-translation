revisions:
- from: 'Ní ti pé ó jí i dìde kúrò nínú àwọn òkú, kí ó má ṣe padà sínú ìbàjẹ́ mọ́, ó ti sọ báyìí pé: “Èmi yóò fún yín ní àwọn ìbùkún mímọ́ àti èyí tí ó dájú ti Dáfídì.”[a]'
  to: 'Ní ti bí ó ṣe jí i dìde kúrò nínú àwọn òkú, tí kò ní padà sí ìbàjẹ́ mọ́, ó ti sọ báyìí pé: “Èmi yóò fún yín ní àwọn ìbùkún mímọ́ ti Dáfídì, àwọn tí ó dájú.”[a]'
  rationale: The revision replaces the potentially purposive clause with a declarative permanent-future expression, improves the topical introduction, and repairs plural agreement in the Isaiah quotation. It preserves the source’s syntactic ambiguity concerning the precise nuance of μέλλοντα while communicating that Jesus will not return to bodily decay. The footnote remains anchored to the difficult Davidic phrase and retains the traditional alternative without treating it as the only possible rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies resurrection, bodily decay, the continuing force of the scriptural citation, and the Davidic covenantal reference. However, “kí ó má ṣe padà” is a purposive/subjunctive construction (“so that he might not return”), whereas μηκέτι μέλλοντα ὑποστρέφειν describes the raised one as no longer returning/destined to return. The quotation also has a grammatical mismatch: plural “àwọn ìbùkún” is coordinated with singular “èyí tí ó dájú.”'
  naturalness: “Ní ti pé” is stiff in this context. “Ní ti bí ó ṣe…” is more idiomatic Yoruba for the Greek topical clause. “tí kò ní padà sí ìbàjẹ́ mọ́” is natural and clearly expresses the permanent non-return to decay.
  terminology: “jí i dìde kúrò nínú àwọn òkú,” “ìbàjẹ́,” and “Dáfídì” are suitable. The revised rendering retains “ìbùkún” as an idiomatic contextual rendering of the difficult plural τὰ ὅσια, while making both descriptors agree with the plural noun.
  issues:
  - severity: medium
    issue: Purposive verb form in “kí ó má ṣe padà … mọ́”
    rationale: This can imply that the raising happened in order to prevent a return to decay. The Greek instead predicates permanent non-return to decay of the one raised.
  - severity: medium
    issue: Number disagreement in “àwọn ìbùkún mímọ́ àti èyí tí ó dájú”
    rationale: The singular relative expression “èyí tí ó dájú” does not grammatically modify the plural “àwọn ìbùkún.”
  - severity: low
    issue: Stilted topical opening “Ní ti pé”
    rationale: “Ní ti bí ó ṣe” is more natural Standard Yoruba while retaining the topical force of ὅτι δέ.
  revised_text: 'Ní ti bí ó ṣe jí i dìde kúrò nínú àwọn òkú, tí kò ní padà sí ìbàjẹ́ mọ́, ó ti sọ báyìí pé: “Èmi yóò fún yín ní àwọn ìbùkún mímọ́ ti Dáfídì, àwọn tí ó dájú.”[a]'
  revised_footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “àwọn àánú tí ó dájú ti Dáfídì.” Gbólóhùn Gíríìkì náà ń ṣe ìrántí Aísáyà 55:3, ó sì ń tọ́ka sí àwọn ìlérí májẹ̀mú mímọ́, tí ó ṣeé gbẹ́kẹ̀ lé, tí ó ní í ṣe pẹ̀lú Dáfídì.
    reason: alternative_reading
  revision_rationale: The revision replaces the potentially purposive clause with a declarative permanent-future expression, improves the topical introduction, and repairs plural agreement in the Isaiah quotation. It preserves the source’s syntactic ambiguity concerning the precise nuance of μέλλοντα while communicating that Jesus will not return to bodily decay. The footnote remains anchored to the difficult Davidic phrase and retains the traditional alternative without treating it as the only possible rendering.
