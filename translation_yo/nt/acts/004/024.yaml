id: ACT.4.24
reference: Acts 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, wọ́n gbé ohùn wọn sókè sí Ọlọ́run ní ìṣọ̀kan[a], wọ́n sì wí pé, “Aláṣẹ[b], ìwọ ni ẹni tí ó dá ọ̀run àti ayé àti òkun, àti ohun gbogbo tí ó wà nínú wọn,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ọkàn kan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Olúwa Aláṣẹ.” Ọ̀rọ̀ Gíríìkì náà ni Δέσποτα, orúkọ oyè tí ó tẹnumọ́ àṣẹ pípé; ó yàtọ̀ sí κύριος (“Olúwa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist náà ní agbára àkókò nínú àyíká yìí. A fi “èyí” kún un láti tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ gbọ́, kí gbolohun náà sì ṣe kedere ní Yorùbá.
- source_word: ὁμοθυμαδόν
  choice: ní ìṣọ̀kan
  rationale: Ó fi hàn pé gbogbo wọn darapọ̀ ní èrò àti ìṣe kan; “ní ìṣọ̀kan” jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere, láìsọ ọ̀rọ̀ náà di ìdìbò tàbí ìpinnu àjọ.
- source_word: ἦραν φωνήν
  choice: wọ́n gbé ohùn wọn sókè
  rationale: Bí ó tilẹ̀ jẹ́ pé “ohùn” wà ní ẹyọ kan ní Gíríìkì, ọ̀nà Yorùbá yìí jẹ́ àdánidá fún àwùjọ tí ó gbàdúrà papọ̀, ó sì pa ìtumọ̀ ohùn ìṣọ̀kan mọ́.
- source_word: πρὸς τὸν θεόν
  choice: sí Ọlọ́run
  rationale: Nínú ọ̀rọ̀ àdúrà, πρός tọ́ka sí ẹni tí wọ́n darí ọ̀rọ̀ sí; “sí Ọlọ́run” ni ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: Δέσποτα
  choice: Aláṣẹ
  rationale: Δέσποτα jẹ́ orúkọ oyè fún ẹni tí ó ní àṣẹ gíga tàbí àṣẹ pípé. “Aláṣẹ” pa ìtumọ̀ yìí mọ́, ó sì yẹra fún lílo “Olúwa,” èyí tí a sábà máa ń lò fún κύριος.
- source_word: σὺ ὁ ποιήσας
  choice: ìwọ ni ẹni tí ó dá
  rationale: Arọ́pò-orúkọ náà àti ọ̀rọ̀-ìṣe alábápín tí ó ní atíkù tẹnumọ́ Ọlọ́run gẹ́gẹ́ bí Ẹlẹ́dàá; ọ̀nà yìí mú ìtẹnumọ́ náà jáde ní Yorùbá àdánidá.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: ọ̀run àti ayé àti òkun
  rationale: Èyí pa àgbékalẹ̀ ọ̀rọ̀ ìṣẹ̀dá inú Ìwé Mímọ́ mọ́, pẹ̀lú ìsopọ̀ ohun mẹ́tẹ̀ẹ̀ta bí ó ṣe wà ní orísun.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: ohun gbogbo tí ó wà nínú wọn
  rationale: Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì kó gbogbo ohun tí a dá nínú ọ̀run, ayé àti òkun sínú ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ Δέσποτα gẹ́gẹ́ bí orúkọ oyè Ọlọ́run
  choice: Aláṣẹ
  alternative: Olúwa Aláṣẹ; Olúwa; Ọ̀gá
  rationale: “Aláṣẹ” fi àṣẹ gíga tí Δέσποτα túmọ̀ sí hàn láìfi “Olúwa” kún ọ̀rọ̀ Gíríìkì tàbí mú un dàpọ̀ mọ́ κύριος. “Ọ̀gá” lè dà bí ọ̀rọ̀ ojoojúmọ́ fún ènìyàn, nítorí náà kò ní ìyì tó yẹ fún àdúrà yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Èdè náà ní ìyì tó bá àdúrà mu, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. A pa àtúnṣe ìṣẹ̀dá mẹ́tẹ̀ẹ̀ta—ọ̀run, ayé àti òkun—àti ìtẹnumọ́ Ọlọ́run gẹ́gẹ́ bí Ẹlẹ́dàá mọ́.
