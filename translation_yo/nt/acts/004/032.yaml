revisions:
- from: Ọ̀pọ̀ ènìyàn tí wọ́n ti gbàgbọ́ sì jẹ́ ọkàn kan àti ẹ̀mí kan[a]. Kò tilẹ̀ sí ẹnì kan nínú wọn tí ó sọ pé ohunkóhun nínú àwọn ohun-ìní tí ó ní jẹ́ tirẹ̀ fúnra rẹ̀[b]; dípò bẹ́ẹ̀, ohun gbogbo jẹ́ ohun àjọnílò láàárín wọn.
  to: Ọ̀pọ̀ ènìyàn tí wọ́n ti gbàgbọ́ jẹ́ ọkàn kan àti ẹ̀mí kan, kò sì tilẹ̀ sí ẹnì kan nínú wọn tí ó sọ pé ohunkóhun nínú ohun-ìní tí ó ní jẹ́ tirẹ̀ fúnra rẹ̀; ṣùgbọ́n ohun gbogbo wọ́pọ̀ fún gbogbo wọn.[a][b]
  rationale: A pa ìtẹ̀síwájú gbolóhùn Gíríìkì mọ́, a sì rọ́pò ọ̀rọ̀ tí ó lè dà bí ‘ohun èlò àjùmòlò’ pẹ̀lú ìsọ̀rọ̀ Yorùbá tí ó fi hàn pé ohun gbogbo wọ́pọ̀ fún ẹgbẹ́ náà. A tún ṣàtúnṣe àlàyé-ẹsẹ a kí ó ṣàlàyé ìsọ̀rọ̀ ‘ọkàn kan àti ẹ̀mí kan’ láì rọ́pò rẹ̀ pátápátá pẹ̀lú ìtumọ̀ tí ó gbooro ju.
