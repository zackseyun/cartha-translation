source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn tí wọ́n ti gbàgbọ́ jẹ́ ọkàn kan àti ẹ̀mí kan, kò sì tilẹ̀ sí ẹnì kan nínú wọn tí ó sọ pé ohunkóhun nínú ohun-ìní tí ó ní jẹ́ tirẹ̀ fúnra rẹ̀; ṣùgbọ́n ohun gbogbo wọ́pọ̀ fún gbogbo wọn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n jẹ́ ọkàn kan àti ẹ̀mí kan,” ìyẹn ni pé wọ́n wà ní ìṣọ̀kan jinlẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì lo arọ́pò-orúkọ ẹyọ, èyí tí ó ń tọ́ka sí ẹnì kọ̀ọ̀kan nínú wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Èyí ń fi hàn pé àwọn tí a ń sọ̀rọ̀ nípa wọn pọ̀, láì sọ wọ́n di ẹgbẹ́ kékeré tàbí ètò kan pàtó.
- source_word: τῶν πιστευσάντων
  choice: tí wọ́n ti gbàgbọ́
  rationale: Fọ́ọ̀mù aorist participle náà tọ́ka sí ìgbàgbọ́ tí ó ti ṣẹlẹ̀ ṣáájú àpèjúwe ìgbésí ayé wọn níbí.
- source_word: καρδία καὶ ψυχὴ μία
  choice: jẹ́ ọkàn kan àti ẹ̀mí kan
  rationale: Ìtumọ̀ yìí pa àwọn ọ̀rọ̀ méjèèjì, ‘ọkàn’ àti ‘ẹ̀mí,’ mọ́, ó sì fi ìṣọ̀kan jinlẹ̀ wọn hàn láì sọ ìtumọ̀ náà di ohun kan ṣoṣo tí kò sí nínú orísun.
- source_word: οὐδὲ εἷς
  choice: Kò tilẹ̀ sí ẹnì kan nínú wọn
  rationale: ‘Tilẹ̀’ mú ìtẹnumọ́ οὐδέ jáde, nígbà tí ‘ẹnì kan nínú wọn’ bá ìtumọ̀ ẹnì kọ̀ọ̀kan mu.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: ohunkóhun nínú àwọn ohun-ìní tí ó ní
  rationale: Gbólóhùn náà túmọ̀ sí ohunkóhun lára ohun tí ó jẹ́ ti ẹnì kọ̀ọ̀kan, pàápàá ohun-ìní tàbí dúkìá rẹ̀.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: sọ pé ... jẹ́ tirẹ̀ fúnra rẹ̀
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì pé ẹnì kan kò ka ohun náà sí ohun tirẹ̀ nìkan, láì fi èrò ètò ọrọ̀-ajé kan kún un.
- source_word: πάντα κοινά
  choice: ohun gbogbo jẹ́ ohun àjọnílò láàárín wọn
  rationale: ‘Ohun àjọnílò’ ń sọ pé ohun gbogbo wà fún lílò àti àǹfààní gbogbo àwùjọ, ó sì yẹra fún fífi ọ̀rọ̀ náà hàn bí ìlànà òṣèlú tàbí bí ẹni pé a pa ẹ̀tọ́ ohun-ìní rẹ́ patapata.
theological_decisions:
- issue: Bí a ṣe lè ṣàpèjúwe ohun-ìní tí ìjọ Jerusalẹmu fi ṣe àjọnílò
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí àpèjúwe ìṣọ̀kan àti fífi ohun-ìní ṣe àjọnílò láàárín àwọn onígbàgbọ́.
  alternative: Kí a sọ pé wọ́n fagi lé gbogbo ohun-ìní ẹnì kọ̀ọ̀kan, tàbí kí a sọ ọ́ lọ́nà tí yóò dín àjọpín wọn kù.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé kò sí ẹni tí ó ka ohun tí ó ní sí tirẹ̀ nìkan, àti pé ohun gbogbo jẹ́ κοινά láàárín wọn. Ìtumọ̀ náà pa ìwọ̀ntúnwọ̀nsì yìí mọ́ láì sọ ọ́ di ẹ̀kọ́ ètò ọrọ̀-ajé tàbí ẹ̀sìn kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. ‘Àjọnílò’ pa ìtumọ̀ κοινά mọ́ láì gbé ẹ̀kọ́ ẹgbẹ́ ìsìn tàbí ètò òṣèlú kan wọ inú ẹsẹ náà.
