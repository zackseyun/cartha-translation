  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì ní pàtàkì: ó ṣàfihàn ọ̀pọ̀ àwọn tí wọ́n ti gbàgbọ́, ìṣọ̀kan wọn, ìkọ̀ láti pe ohun ẹni ní tirẹ̀ nìkan, àti bí ohun gbogbo ṣe wọ́pọ̀ fún wọn. Síbẹ̀, “ohun àjọnílò” lè túmọ̀ sí ohun èlò tí a ń lò papọ̀, kì í sì ṣe ìpò κοινά ní kedere. Àtúnṣe náà ń sọ ìtumọ̀ ìní àpapọ̀/ohun tí ó wọ́pọ̀ di kedere láì kó ẹ̀kọ́ ètò ọrọ̀-ajé wọ inú ẹsẹ náà.'
  naturalness: Ọ̀rọ̀ náà dáa ní Yorùbá òde òní, ṣùgbọ́n ìpín sí gbolóhùn méjì níbi tí orísun ti so gbogbo ìròyìn pọ̀ dín ìṣàn rẹ̀ kù díẹ̀. “Ọkàn kan àti ẹ̀mí kan” jẹ́ ìsọ̀rọ̀ tí ó bojú mu, “Kò tilẹ̀ sí ẹnì kan” sì jẹ́ ìtẹnumọ́ àdánidá.
