  - severity: low
    issue: Ọ̀rọ̀ ìsàlẹ̀ ṣàfikún “ipò aláṣẹ.”
    rationale: Gíríìkì náà tọ́ka sí ipò ẹni lasan, tí kì í ṣe amọ̀ṣẹ́ tàbí ẹni tó ní ìdánilẹ́kọ̀ọ́ ọ̀mọ̀wé; kò sọ ipò aláṣẹ ní pàtó.
