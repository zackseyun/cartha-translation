revisions:
- from: Bí wọ́n ti ń kíyè sí ìgboyà Peteru àti Johanu, tí wọ́n sì wá mọ̀ pé ọkùnrin tí kò ní ẹ̀kọ́ ọ̀mọ̀wé, tí wọ́n sì jẹ́ ará ìlú lásán ni wọ́n,[a] ẹnu yà wọ́n; wọ́n sì mọ̀ pé wọ́n ti wà pẹ̀lú Jésù.
  to: Bí wọ́n ti ń kíyè sí ìgboyà Peteru àti Johanu, tí wọ́n sì wá mọ̀ pé àwọn jẹ́ ènìyàn tí kò gba ẹ̀kọ́ ọ̀mọ̀wé, tí wọ́n sì jẹ́ ènìyàn lásán,[a] ẹnu yà wọ́n; wọ́n sì dá wọn mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n ti wà pẹ̀lú Jésù.
  rationale: Àtúnṣe náà mú àwọn àpèjúwe Gíríìkì ἀγράμματοι καὶ ἰδιῶται bá iye púpọ̀ Peteru àti Johanu mu, ó sì yà àìní ẹ̀kọ́ ọ̀mọ̀wé sí àìní ipò amọ̀ṣẹ́ sọ́tọ̀. A lo “dá wọn mọ̀” fún ἐπεγίνωσκον láti tọju èrò ìdánimọ̀. A pa ìtumọ̀ aṣàwárí àti ìfẹ̀sẹ̀mulẹ̀ ọrọ̀ ìsàlẹ̀ mọ́ láìsọ pé wọn kò lè kàwé tàbí pé wọn òmùgọ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtòlẹ́sẹẹsẹ àti ìtumọ̀ pàtàkì ti Gíríìkì náà ní ọ̀pọ̀lọpọ̀: ìkíyèsí ìgboyà wọn, ìmọ̀ pé wọn kò gba ẹ̀kọ́ ọ̀mọ̀wé, ìyàlẹ́nu, àti ìdánimọ̀ ìbáṣepọ̀ wọn pẹ̀lú Jésù. Ṣùgbọ́n “ọkùnrin tí kò ní ... tí wọ́n sì jẹ́” kò bá iye púpọ̀ àwọn ẹni méjì mu dáadáa, ó sì lè mú kí ìbáṣepọ̀ àwọn àpèjúwe méjèèjì ṣókùnkùn. “Dá wọn mọ̀” ṣàfihàn ἐπεγίνωσκον gẹ́gẹ́ bí ìdánimọ̀ ní kedere ju “mọ̀” lásán lọ.'
  naturalness: Akọ́bẹ̀rẹ̀ náà ní ìrísí Yorùbá tó dára, ṣùgbọ́n a nílò kí a tún gbolohun àpèjúwe àwọn ọkùnrin méjèèjì náà ṣe sí ọ̀nà púpọ̀ tó rọrùn. “Àwọn ènìyàn lásán” jẹ́ ọ̀nà ìgbàlódé tó hàn gbangba fún ἰδιῶται ní àyíká yìí.
  terminology: “Ìgboyà,” “ẹ̀kọ́ ọ̀mọ̀wé,” “ẹnu yà wọ́n,” àti “Jésù” yẹ. A tún ọ̀rọ̀ ìsàlẹ̀ ṣe kí ó má ṣe sọ ní pàtó pé wọn kò ní “ipò aláṣẹ,” nítorí èyí kọjá ohun tí ἰδιῶται fúnra rẹ̀ sọ; ìyàtọ̀ náà jẹ́ sí àwọn amọ̀ṣẹ́/àwọn tó ní ìdánilẹ́kọ̀ọ́, kì í ṣe ìjọba tàbí àṣẹ ní pàtó.
  issues:
  - severity: medium
    issue: Àìfarakọ iye nínú “ọkùnrin tí kò ní ẹ̀kọ́ ọ̀mọ̀wé, tí wọ́n sì jẹ́ ará ìlú lásán ni wọ́n.”
