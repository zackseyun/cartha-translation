id: ACT.4.13
reference: Acts 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: yo
  text: Bí wọ́n ti ń kíyè sí ìgboyà Peteru àti Johanu, tí wọ́n sì wá mọ̀ pé àwọn jẹ́ ènìyàn tí kò gba ẹ̀kọ́ ọ̀mọ̀wé, tí wọ́n sì jẹ́ ènìyàn lásán,[a] ẹnu yà wọ́n; wọ́n sì dá wọn mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n ti wà pẹ̀lú Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn tí kò gba ẹ̀kọ́ akọ̀wé, tí wọ́n sì jẹ́ ènìyàn lásán.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí kò ní ìdánilẹ́kọ̀ọ́ ọ̀mọ̀wé tàbí ipò amọ̀ṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Bí wọ́n ti ń kíyè sí
  rationale: Ó fi hàn pé àwọn olórí náà ń wo Peteru àti Johanu dáadáa, wọ́n sì ń gbé ohun tí wọ́n rí yẹ̀ wò; ó ju ‘rí’ lásán lọ.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Nínú Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà sábà ń tọ́ka sí sísọ̀rọ̀ ní gbangba pẹ̀lú ìgboyà àti àìbẹ̀rù.
- source_word: καταλαβόμενοι
  choice: tí wọ́n sì wá mọ̀
  rationale: Ó sọ pé wọ́n dé orí òye kan nípa Peteru àti Johanu lẹ́yìn àkíyèsí wọn.
- source_word: ἄνθρωποι ἀγράμματοί
  choice: ọkùnrin tí kò ní ẹ̀kọ́ ọ̀mọ̀wé
  rationale: Peteru àti Johanu ni a ń tọ́ka sí, àwọn ọkùnrin méjì; ἀγράμματοι níbí túmọ̀ sí pé wọn kò gba ìdánilẹ́kọ̀ọ́ onímọ̀wé tàbí ti àwọn akọ̀wé, kì í ṣe dandan pé wọn kò lè kà tàbí kọ.
- source_word: ἰδιῶται
  choice: ará ìlú lásán
  rationale: Ó fi ipò wọn gẹ́gẹ́ bí ẹni tí kì í ṣe òṣìṣẹ́ amọ̀ṣẹ́ tàbí olórí ẹ̀sìn hàn, láìsọ pé wọn ò ní làákàyè.
- source_word: ἐθαύμαζον
  choice: ẹnu yà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàlẹ́nu tó lágbára; àkókò ọ̀rọ̀ Gíríìkì náà tún lè fi ìhùwàsí tí ó ń bá a lọ hàn.
- source_word: ἐπεγίνωσκόν
  choice: wọ́n sì mọ̀
  rationale: Ó sọ ìdánimọ̀ tàbí mímọ ohun kan dájú; gbólóhùn tó tẹ̀ lé e ṣàlàyé ohun tí wọ́n mọ̀.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: wọ́n ti wà pẹ̀lú Jésù
  rationale: ‘Ti wà’ fi hàn ní Yorùbá pé ìbáṣepọ̀ yìí ti wáyé ṣáájú ìṣẹ̀lẹ̀ tí a ń sọ.
theological_decisions:
- issue: Bí a ṣe ṣe àpèjúwe ipò Peteru àti Johanu láwùjọ
  choice: “ọkùnrin tí kò ní ẹ̀kọ́ ọ̀mọ̀wé, tí wọ́n sì jẹ́ ará ìlú lásán”
  alternative: “ọkùnrin aláìmọ̀wé àti ènìyàn gbáàtúù”
  rationale: Àwọn olórí ń wo wọn bí ẹni tí kò gba ẹ̀kọ́ akọ̀wé tàbí ti àwọn rábì, tí wọn kò sì ní ipò amọ̀ṣẹ́. Ìtumọ̀ yìí kò fi wọ́n hàn bí ẹni tí kò lè kàwé tàbí bí òmùgọ̀, ohun tí Gíríìkì kò fi dandan sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. “Ẹ̀kọ́ ọ̀mọ̀wé” àti “ará ìlú lásán” yà àìní ìdánilẹ́kọ̀ọ́ gíga àti àìní ipò amọ̀ṣẹ́ sọ́tọ̀, láìfi ẹ̀gàn tàbí ìtumọ̀ pé wọn kò mọ̀ọ́kọ-mọ̀ọ́kà kún ọ̀rọ̀ náà.
