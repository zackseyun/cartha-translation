source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: yo
  text: Níwọ̀n bí ó ti ní oko kan[a], ó tà á, ó sì mú owó náà[b] wá, ó sì gbé e kalẹ̀ ní ẹsẹ̀ àwọn àpọ́sítélì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ní oko kan,” tàbí, “ó ní oko kan.” Èdè Gíríìkì lo genitive absolute láti fi ipò abẹ́lẹ̀ ìṣẹ̀lẹ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “owó tí ó rí nínú títà á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Níwọ̀n bí ó ti ní oko kan
  rationale: Ọ̀rọ̀ yìí jẹ́ genitive absolute tí ó ń fi ipò abẹ́lẹ̀ ìṣẹ̀lẹ̀ hàn. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ pé oko náà jẹ́ tirẹ̀ mọ́.
- source_word: ἀγροῦ
  choice: oko kan
  rationale: ‘Oko’ lè túmọ̀ sí pápá tàbí ilẹ̀ tí ẹnì kan ní, láìfi dandan sọ pé ó jẹ́ ilé iṣẹ́ àgbẹ̀ ńlá.
- source_word: πωλήσας
  choice: ó tà á
  rationale: Aorist participle náà tọ́ka sí ohun tí ó kọ́kọ́ ṣẹlẹ̀. Lílo ọ̀rọ̀-ìṣe aláṣẹ ní Yorùbá mú ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà ṣe kedere.
- source_word: ἤνεγκεν
  choice: ó mú ... wá
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ pé ẹnì kan gbé ohun kan wá sí ibi tàbí sọ́dọ̀ àwọn ènìyàn kan.
- source_word: τὸ χρῆμα
  choice: owó náà
  rationale: χρῆμα níbí ń tọ́ka sí owó tí ó wá láti inú títà oko náà. ‘Owó náà’ jẹ́ tààrà, ó sì yẹra fún fífi àlàyé tí ó pọ̀ ju ti orísun lọ sínú ọ̀rọ̀.
- source_word: ἔθηκεν
  choice: ó gbé e kalẹ̀
  rationale: Gbólóhùn yìí túmọ̀ τίθημι lọ́nà àdánidá, ó sì pa àwòrán fífi ohun kan sílẹ̀ mọ́.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: lẹ́bàá ẹsẹ̀ àwọn àpọ́sítélì
  rationale: Èyí pa àwòrán ara gidi inú Gíríìkì mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ‘ó fi fún àwọn àpọ́sítélì’ nìkan.
theological_decisions:
- issue: Bóyá kí a pa àwòrán fífi owó náà sí ẹsẹ̀ àwọn àpọ́sítélì mọ́
  choice: A pa gbólóhùn gidi náà mọ́ pé ó ‘gbé e kalẹ̀ lẹ́bàá ẹsẹ̀ àwọn àpọ́sítélì.’
  alternative: Kí a sọ ìtumọ̀ rẹ̀ nìkan pé ‘ó fi fún àwọn àpọ́sítélì.’
  rationale: Àkọsílẹ̀ náà ṣàpèjúwe ìṣe gidi kan, ó sì tún lè fi hàn pé ó fi ẹ̀bùn náà sí abẹ́ ìtọ́jú àwọn àpọ́sítélì. Pípa àwòrán náà mọ́ kò fi ẹ̀kọ́ ìjọ kan tí orísun kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún èdè ẹ̀kọ́ ìjọ kan pàtó.
