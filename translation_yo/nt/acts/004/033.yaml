id: ACT.4.33
reference: Acts 4:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: yo
  text: Àwọn àpọ́sítélì sì ń fi agbára ńlá jẹ́rìí nípa àjíǹde Olúwa Jésù, ojúrere ńlá sì wà lórí gbogbo wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oore-ọ̀fẹ́ ńlá sì wà lórí gbogbo wọn.” Ọ̀rọ̀ Gíríìkì χάρις lè túmọ̀ sí “oore-ọ̀fẹ́” tàbí “ojúrere”; ó lè ní àwọn ìtumọ̀ méjèèjì wọ̀nyí nínú—wíwà Ọlọ́run pẹ̀lú wọn nínú oore rẹ̀ àti ojúrere tí àwọn onígbàgbọ́ rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: pẹ̀lú agbára ńlá / fi agbára ńlá
  rationale: Dátífù náà fi ọ̀nà tàbí ohun èlò tí wọ́n fi ń jẹ́rìí hàn. ‘Agbára’ bá ìlò δύναμις nínú Lúùkù–Ìṣe mu, láì fi dandan sọ pé iṣẹ́ ìyanu nìkan ni.
- source_word: ἀπεδίδουν
  choice: ń ... jẹ́rìí
  rationale: Àkókò imperfect fi iṣẹ́ tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ìtumọ̀ àdàpọ̀ ἀποδίδωμι pẹ̀lú μαρτύριον ni fífi ẹ̀rí hàn.
- source_word: τὸ μαρτύριον
  choice: jẹ́rìí
  rationale: Ọ̀rọ̀ Yorùbá ‘jẹ́rìí’ jẹ́ ọ̀nà àdánidá láti sọ fífi ẹ̀rí tàbí testimony hàn, ó sì yẹra fún gbolohun tí yóò le ju bí ó ṣe yẹ lọ.
- source_word: τῆς ἀναστάσεως
  choice: nípa àjíǹde
  rationale: Genitive náà ń tọ́ka sí ohun tí ẹ̀rí náà dá lé; ‘nípa’ sọ ìbáṣepọ̀ yìí ní kedere ní Yorùbá òde òní.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jésù
  rationale: ‘Olúwa’ ni ìtumọ̀ κύριος, àjíǹde náà sì jẹ́ ti Jésù ní pàtó.
- source_word: χάρις μεγάλη
  choice: ojúrere ńlá
  rationale: ‘Ojúrere’ lè tọ́ka sí inú rere Ọlọ́run tàbí ìtẹ́wọ́gbà lọ́dọ̀ àwọn ènìyàn, ó sì pa àìdánilójú orísun χάρις mọ́.
- source_word: ἐπὶ πάντας αὐτούς
  choice: wà lórí gbogbo wọn
  rationale: Èyí pa àwòrán ohun tí ó bà lé gbogbo àwùjọ náà mọ́, ó sì tẹnu mọ́ pé kò sí ẹni tí a yọ sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká ọ̀rọ̀ yìí
  choice: ojúrere tí ó wà lórí gbogbo àwùjọ náà
  alternative: oore-ọ̀fẹ́ Ọlọ́run ní ìtumọ̀ ẹ̀kọ́ ìgbàlà tó ṣe pàtó, tàbí ìtẹ́wọ́gbà láti ọ̀dọ̀ àwọn ènìyàn nìkan
  rationale: Ẹsẹ̀ náà kò sọ ẹni tí χάρις ti ọ̀dọ̀ rẹ̀ wá. ‘Ojúrere’ jẹ́ kí ó lè ní í ṣe pẹ̀lú inú rere Ọlọ́run àti ìtẹ́wọ́gbà ènìyàn, láì fi ipa yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘àwọn aposteli’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, ‘àjíǹde’ fún resurrection, àti ‘ojúrere’ láti pa ìtumọ̀ χάρις tí kò dá orísun rẹ̀ lójú mọ́.
