source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: yo
  text: Jósẹ́fù[a], ẹni tí àwọn aposteli pe ní Bánábà—èyí tí ìtumọ̀ rẹ̀ jẹ́ ọmọ ìṣírí—ọmọ ẹ̀yà Léfì kan, ará Kípírọ̀ nípa ìbílẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọ ìyànjú,” “ọmọ ìtùnú,” tàbí “ọmọ ìfọ̀kànbalẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìṣírí, ìyànjú, tàbí ìtùnú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: δὲ
  choice: A kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Ó jẹ́ àmì ìyípadà pẹ̀lẹ́ nínú ìtàn; ìṣàn gbólóhùn Yorùbá kò nílò kí a fi ọ̀rọ̀ bí ‘Ǹjẹ́’ tàbí ‘Ṣùgbọ́n’ kún un níbí.
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: ẹni tí àwọn aposteli pe ní Bánábà
  rationale: Ó sọ ní kedere pé àwọn aposteli ni orísun orúkọ tí wọ́n ń pè é, láìfi ‘pẹ̀lú’ kún ohun tí Gíríìkì kò sọ.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: èyí tí ìtumọ̀ rẹ̀ jẹ́
  rationale: Ọ̀nà Yorùbá tó ṣe déédéé láti ṣàlàyé ìtumọ̀ orúkọ kan.
- source_word: υἱὸς παρακλήσεως
  choice: ọmọ ìṣírí
  rationale: ‘Ìṣírí’ gba ìtumọ̀ gbígbé ọkàn ẹni sókè àti fífi agbára fún un; àlàyé ìsàlẹ̀ ṣètọ́jú àwọn ìtumọ̀ míì tí παράκλησις lè ní.
- source_word: Λευίτης
  choice: ẹni Léfì kan
  rationale: Ó jẹ́ àpèjúwe ìran àti ipò ẹ̀sìn rẹ̀ ní ọ̀nà tó yé àwọn òǹkàwé Yorùbá.
- source_word: Κύπριος τῷ γένει
  choice: ọmọ ìbílẹ̀ Kípírọ̀
  rationale: Ó fi hàn pé Kípírọ̀ ni ibi ìbí tàbí ibi ìpilẹ̀ṣẹ̀ rẹ̀, gẹ́gẹ́ bí τῷ γένει ṣe túmọ̀ sí níbí.
theological_decisions:
- issue: Ìtumọ̀ παράκλησις nínú àlàyé orúkọ Bánábà
  choice: ọmọ ìṣírí
  alternative: ọmọ ìkìlọ̀, ọmọ ìtùnú, tàbí ọmọ ìfọ̀kànbalẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ṣíṣírí, rírí ẹnì kan níyànjú, tàbí títù ú nínú. Ẹsẹ̀ náà kò fi dandan mú ìtumọ̀ kan ṣoṣo, nítorí náà a lo ìtumọ̀ gbòòrò nínú ọ̀rọ̀ pàtàkì, a sì pa àwọn àṣàyàn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa oníyì pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘aposteli’ àti ‘ẹni Léfì’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀, ṣùgbọ́n a jẹ́ kí ìtòlẹ́sẹẹsẹ gbólóhùn náà rọrùn fún òǹkàwé òde òní. A pa àmì kọ́mà ìparí mọ́ nítorí ẹsẹ̀ yìí ń bá a lọ sínú ẹsẹ̀ 37.
