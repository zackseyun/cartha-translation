source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: yo
  text: Bí wọ́n bá ń yẹ̀ wá wò lónìí ní ti iṣẹ́ rere tí a ṣe fún ọkùnrin aláìlera kan, nípasẹ̀ kí ni a ti mú ọkùnrin yìí láradá[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti gbà ọkùnrin yìí là,” tàbí “ara ọkùnrin yìí ti dá.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí gbígbà là tàbí sí ìwòsàn; níbí, àyíká ọ̀rọ̀ tọ́ka ní pàtàkì sí ìwòsàn ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: a bá ń wádìí wa lẹ́jọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwádìí tàbí ìbéèrè ní ipò ìdájọ́. Gbólóhùn yìí mú ìtumọ̀ òfin náà jáde láì sọ pé wọ́n ti dá wọn lẹ́bi tàbí pé ìgbẹ́jọ́ pípé ti bẹ̀rẹ̀.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: nítorí iṣẹ́ rere
  rationale: ἐπί pẹ̀lú dátífù níbí sọ ìdí tàbí ohun tí ìwádìí náà dá lé; εὐεργεσία jẹ́ iṣẹ́ àánú tàbí ohun rere tí a ṣe fún ẹlòmíràn. ‘Nítorí iṣẹ́ rere’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìyàlẹ́nu ọ̀rọ̀ náà mọ́.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: fún ọkùnrin aláìlera kan
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ọkùnrin tí ara rẹ̀ kò dá, pàápàá ẹni tí kò lè rìn. ‘Aláìlera’ gbòòrò tó láti bo ipò ara rẹ̀ láì fi àlàyé tí Gíríìkì kò sọ kún un.
- source_word: ἐν τίνι
  choice: nípasẹ̀ kí ni
  rationale: Ìbéèrè náà lè tọ́ka sí ọ̀nà, ohun èlò, tàbí aṣojú tí ìmúláradá fi ṣẹlẹ̀. ‘Nípasẹ̀ kí ni’ pa ìṣípayá yẹn mọ́, kí ìdáhùn ẹsẹ tó tẹ̀ lé lè sọ ẹni náà ní pàtó.
- source_word: σέσωσται
  choice: rí ìwòsàn gbà
  rationale: Fáàbù σῴζω lè túmọ̀ sí gbà là, mú láradá, tàbí mú ara dá. Ní àyíká yìí, ìwòsàn ara ni ó hàn gbangba jù; àlàyé ìsàlẹ̀ pa ìtumọ̀ gbígbàlà rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ σέσωσται nínú àyíká ìwòsàn
  choice: rí ìwòsàn gbà
  alternative: a ti gbà á là; ara rẹ̀ ti dá
  rationale: Ìtàn náà ń sọ ní tààrà nípa ọkùnrin tí a mú láradá kúrò nínú àìlera ara. Síbẹ̀, nítorí σῴζω tún lè ní ìtumọ̀ gbígbàlà, a kò pa ìbáṣepọ̀ ẹ̀kọ́ ìgbàgbọ́ yẹn rẹ́; a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Wádìí wa lẹ́jọ́’ fi àyíká òfin hàn; ìlà gígùn ní òpin fi hàn pé gbólóhùn Peteru ń bá a lọ sí ẹsẹ tó tẹ̀ lé.
