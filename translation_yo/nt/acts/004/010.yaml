id: ACT.4.10
reference: Acts 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: yo
  text: Kí ó di mímọ̀ fún gbogbo yín àti fún gbogbo ènìyàn Ísírẹ́lì pé ní orúkọ Jésù, Mèsáyà náà, ará Násárẹ́tì[a]—ẹni tí ẹ̀yin kàn mọ́ orí àgbélébùú, ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú—nípasẹ̀ rẹ̀[b] ni ọkùnrin yìí fi dúró níwájú yín, tí ara rẹ̀ dá ṣáṣá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi ará Násárẹ́tì.” Oyè Gíríìkì náà, Χριστός, lè jẹ́ “Mèsáyà” tàbí, níbi tí ó ti dà bí apá orúkọ, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nípasẹ̀ orúkọ yìí.” Àpólà Gíríìkì náà lè tọ́ka sí Jésù fúnra rẹ̀ gẹ́gẹ́ bí ẹni tí ìwòsàn náà tipasẹ̀ rẹ̀ wá, tàbí ní pàtó sí orúkọ rẹ̀ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó yá,” tàbí “ara rẹ̀ pé.” Ọ̀rọ̀ Gíríìkì ὑγιής túmọ̀ sí pé ara ẹni dá ṣáṣá tàbí pé ìlera rẹ̀ ti padà bọ̀ sípò.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: Kí ó di mímọ̀
  rationale: Ó pa agbára ọ̀rọ̀ àṣẹ ìkéde Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu láti kéde ohun kan ní gbangba.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: fún gbogbo yín àti fún gbogbo ènìyàn Ísírẹ́lì
  rationale: Ó ya àwọn olùgbọ́ tó wà níbẹ̀ sọ́tọ̀ kúrò lọ́dọ̀ gbogbo ènìyàn Ísírẹ́lì, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe rí.
- source_word: ἐν τῷ ὀνόματι
  choice: ní orúkọ
  rationale: Ó pa àpólà Gíríìkì mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí; nínú àyíká yìí, orúkọ náà ń tọ́ka sí agbára tàbí àṣẹ ẹni náà.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró, kì í ṣe orúkọ ìdílé; “Mèsáyà” mú ipa oyè náà hàn ní kedere.
- source_word: τοῦ Ναζωραίου
  choice: ará Násárẹ́tì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà jẹ́ Násárénì, ẹni tó ti Násárẹ́tì wá.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: ẹni tí ẹ̀yin kàn mọ́ àgbélébùú
  rationale: Ó pa ẹ̀sùn tààrà sí àwọn olùgbọ́ mọ́, pẹ̀lú “ẹ̀yin” tó tẹnumọ́ ẹni tó ṣe iṣẹ́ náà.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú
  rationale: Ó fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tó ṣe iṣẹ́ náà, ó sì pa èdè àjíǹde kúrò láàárín àwọn òkú mọ́.
- source_word: ἐν τούτῳ
  choice: nípasẹ̀ rẹ̀
  rationale: Èyí jẹ́ Yorùbá tó mọ́gbọ́n dání fún ìtumọ̀ ohun èlò tàbí agbára, ó sì tọ́ka padà sí Jésù; àṣàyàn “nípasẹ̀ orúkọ yìí” wà nínú àlàyé ìsàlẹ̀.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: ni ọkùnrin yìí fi dúró níwájú yín
  rationale: Ó fi ẹni tí a mú lára dá hàn gẹ́gẹ́ bí ọkùnrin tó wà níwájú ìgbìmọ̀ ní báyìí, ó sì mú ipò tó ń bá a lọ nínú perfect Gíríìkì jáde.
- source_word: ὑγιής
  choice: tí ara rẹ̀ dá ṣáṣá
  rationale: Gbólóhùn Yorùbá yìí sọ ìlera ara tó padà bọ̀ sípò ní kedere, láì fi ìtumọ̀ ẹ̀mí tí kò sí nínú ọ̀rọ̀ náà kún un.
theological_decisions:
- issue: Bóyá a ó tú Χριστός gẹ́gẹ́ bí oyè tàbí ká lò ó bí apá orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níwájú àwọn aṣáájú Ísírẹ́lì, agbára oyè náà ṣì ṣe pàtàkì. “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́, nígbà tí “Kristi” lè dà bí apá orúkọ lásán fún ọ̀pọ̀ olùkà.
- issue: Ìtọ́kasí ἐν τούτῳ
  choice: nípasẹ̀ rẹ̀
  alternative: nípasẹ̀ orúkọ yìí
  rationale: Fọ́ọ̀mù Gíríìkì lè tọ́ka sí Jésù fúnra rẹ̀ tàbí sí orúkọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. Ọ̀rọ̀ pàtàkì yan ìtọ́kasí sí ẹni náà, àlàyé ìsàlẹ̀ sì pa àṣàyàn orúkọ mọ́.
- issue: Ọ̀rọ̀ àjíǹde
  choice: ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú
  alternative: ẹni tí Ọlọ́run jí dìde kúrò nínú òkú
  rationale: Ìtumọ̀ náà pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe, ó sì ṣàfihàn àjíǹde Jésù láì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Àwọn ìlà àárín gbólóhùn ya àwọn gbólóhùn ìbátan méjì sọ́tọ̀, kí ìkéde pàtàkì náà lè hàn kedere láì sọ ìṣòro ìtumọ̀ ἐν τούτῳ di ohun kan ṣoṣo.
