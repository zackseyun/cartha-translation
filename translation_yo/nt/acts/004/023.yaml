  to: Lẹ́yìn tí wọ́n dá wọn sílẹ̀, wọ́n lọ sí ọ̀dọ̀ àwọn tiwọn[a], wọ́n sì ròyìn gbogbo ohun tí àwọn olórí àlùfáà àti àwọn àgbà ti sọ fún wọn.
