  source_fidelity: Ìtumọ̀ náà ṣàfihàn ìtúsílẹ̀, lílọ, ríròyìn gbogbo ọ̀rọ̀ náà, àti àwọn olórí àlùfáà pẹ̀lú àwọn àgbà. Ṣùgbọ́n “àwọn ènìyàn wọn” lè fi ìtumọ̀ ẹgbẹ́-ẹ̀yà tàbí àwọn ènìyàn tí wọ́n ń darí hàn; τοὺς ἰδίους sì fi ẹni tí a kò sọ ní kedere—“àwọn tiwọn”—sílẹ̀, tí ó ṣeé lóye gẹ́gẹ́ bí àwọn alábàákẹ́gbẹ́ wọn.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé, ó sì rọrùn láti ka. “Lọ sí ọ̀dọ̀ àwọn tiwọn” jẹ́ ọ̀nà àdánidá tí ó pa àìdánilójú ti Gíríìkì mọ́. “Àwọn àgbà” dára jù “àwọn àgbààgbà” lọ ní àyíká ìjọba/ìgbìmọ̀, nítorí ó lè tọ́ka sí àwọn aṣáájú tí a mọ̀ sí àgbà.
  terminology: “Àwọn olórí àlùfáà” bá οἱ ἀρχιερεῖς mu dáadáa. “Àwọn àgbà” ń tọ́ka sí πρεσβύτεροι gẹ́gẹ́ bí àwọn aṣáájú ìgbìmọ̀, kì í ṣe àwọn arúgbó lásán. Àkọsílẹ̀ ìsàlẹ̀ náà ń pa yíyàn ìtumọ̀ πρὸς τοὺς ἰδίους mọ́.
