language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n dá wọn sílẹ̀, wọ́n lọ sí ọ̀dọ̀ àwọn tiwọn[a], wọ́n sì ròyìn gbogbo ohun tí àwọn olórí àlùfáà àti àwọn àgbà ti sọ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn alábàákẹ́gbẹ́ wọn”; ní ìtumọ̀ tààrà, “àwọn tiwọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Lẹ́yìn tí wọ́n dá wọn sílẹ̀
  rationale: Aorist passive participle náà fi ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn. Ọ̀rọ̀ yìí bá àyíká ìtúsílẹ̀ kúrò ní àhámọ́ mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: δὲ
  choice: wọ́n sì
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ fẹ́ẹ́rẹ́. Àkópọ̀ ‘Lẹ́yìn tí…’ àti ‘wọ́n sì’ mú ìṣàn ìtàn náà ṣe kedere ní Yorùbá láìfi ìtumọ̀ tuntun kún un.
- source_word: ἦλθον
  choice: wọ́n lọ bá
  rationale: ἔρχομαι lè túmọ̀ sí wá tàbí lọ gẹ́gẹ́ bí ojú-ìwòye. ‘Lọ bá’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún lílọ sí ọ̀dọ̀ ẹgbẹ́ ènìyàn.
- source_word: πρὸς τοὺς ἰδίους
  choice: bá àwọn ènìyàn wọn
  rationale: τοὺς ἰδίους túmọ̀ ní tààrà sí ‘àwọn tiwọn,’ ó sì ń tọ́ka sí àwọn alábàákẹ́gbẹ́ tàbí àwùjọ wọn. ‘Àwọn ènìyàn wọn’ ṣe kedere láìdín ìtumọ̀ náà mọ́ ẹgbẹ́ pàtó kan.
- source_word: ἀπήγγειλαν
  choice: ròyìn
  rationale: ἀπαγγέλλω túmọ̀ sí jíṣẹ́ tàbí sọ ohun tó ṣẹlẹ̀ padà. ‘Ròyìn’ bá fífi gbogbo ọ̀rọ̀ àwọn aláṣẹ tó wọn létí mu.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ó pa ìtumọ̀ kíkún ὅσα mọ́, pé wọn kò yọ apá kan nínú ohun tí wọ́n gbọ́ sílẹ̀.
- source_word: πρὸς αὐτοὺς
  choice: fún wọn
  rationale: Pẹ̀lú λέγω, πρός + accusative sábà máa ń tọ́ka sí ẹni tí a bá sọ̀rọ̀. ‘Fún wọn’ jẹ́ ọ̀nà Yorùbá àdánidá ní àyíká yìí, láìfi ìtumọ̀ ‘lòdì sí wọn’ kún un.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí àwọn aṣáájú àlùfáà, kì í ṣe ọ̀pọ̀ ẹni tó di ipò àlùfáà àgbà kan náà mú.
- source_word: οἱ πρεσβύτεροι
  choice: àwọn àgbààgbà
  rationale: Ní àyíká ìgbìmọ̀ àwọn Júù, ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tí a dá mọ̀, kì í ṣe àwọn arúgbó lásán.
- source_word: εἶπαν
  choice: ti sọ
  rationale: ‘Ti sọ’ fi hàn ní Yorùbá pé sísọ náà ti ṣẹlẹ̀ ṣáájú bí Pétérù àti Jòhánù ṣe ròyìn rẹ̀.
