  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: yo
  text: 'Nígbà náà ni Pétérù, tí ó kún fún Ẹ̀mí Mímọ́, sọ fún wọn pé: “Ẹ̀yin aláṣẹ àwọn ènìyàn àti ẹ̀yin àgbààgbà,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìṣẹ̀lẹ̀ tó tẹ̀ lé e ní Yorùbá.
- source_word: Πέτρος
  choice: Pétérù
  rationale: Èyí ni ìkọ̀wé orúkọ Peter tí ó ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: πλησθεὶς
  choice: tí ó kún fún
  rationale: Ó tú participle aorist passive náà sí Yorùbá tó ṣe é lóye, nígbà tí ó ń pa èrò pé Ẹ̀mí Mímọ́ ni ó fi agbára kún Pétérù mọ́.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tó sì yẹ fún Ẹ̀mí Mímọ́ Ọlọ́run nínú ìwé Ìṣe àwọn Àpọ́sítélì.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sọ fún wọn pé
  rationale: Ó jẹ́ ìtumọ̀ àdánidá ti ọ̀rọ̀ ìtàn tí ń mú ọ̀rọ̀ tí ẹni kan sọ wọlé ní Yorùbá.
- source_word: Ἄρχοντες
  choice: aláṣẹ
  rationale: Ó tọ́ka sí àwọn tí wọ́n ní ipò àṣẹ ìṣàkóso tàbí ìdájọ́, kì í ṣe àwọn aṣáájú lásán.
- source_word: τοῦ λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó pa ìtumọ̀ gbooro ti λαός mọ́ nínú àyíká àwọn ènìyàn Ísírẹ́lì láì fi àlàyé mìíràn kún un.
- source_word: πρεσβύτεροι
  choice: àgbààgbà
  rationale: Nínú àyíká yìí, ó túmọ̀ sí àwọn àgbà tí a mọ̀ sí olórí láwùjọ, kì í ṣe àwọn ọkùnrin arúgbó lásán.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Nínú ìwé Ìṣe àwọn Àpọ́sítélì, gbólóhùn yìí ń tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run tí ń fún ẹni jẹ́rìí ní agbára; lílo lẹ́tà ńlá ń fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láì fi ẹ̀kọ́ tuntun kún ẹsẹ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé lásán ni a lò. Àtúnṣe gbolohun náà pa ìtẹ̀sí ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n ó yàgò fún Yorùbá tí ó le tàbí tí ó dà bí ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀.
