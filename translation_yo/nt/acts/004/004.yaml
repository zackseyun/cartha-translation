  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ nínú àwọn tí ó gbọ́ ọ̀rọ̀ náà[a] gbàgbọ́, iye àwọn ọkùnrin[b] náà sì di nǹkan bí ẹgbẹ̀rún márùn-ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn náà.” Níhìn-ín, λόγος ń tọ́ka sí ìkéde tàbí ìwàásù àwọn apọ́sítélì.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní, “iye àwọn ọkùnrin.” Ó ṣeé ṣe kí èyí jẹ́ ìṣírò àwọn akọ nìkan, kì í ṣe gbogbo àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀
  rationale: Ó pa ìtumọ̀ iye ńlá tí a kò sọ ní pàtó mọ́, láìfi ọ̀rọ̀ míì kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àtakò àti ìmúni tí ó ṣáájú, àti ìgbàgbọ́ ọ̀pọ̀ ènìyàn.
- source_word: ἀκουσάντων τὸν λόγον
  choice: àwọn tí ó gbọ́ ọ̀rọ̀ náà
  rationale: Ó tú participle náà sí Yorùbá àdánidá, ó sì pa λόγος mọ́ gẹ́gẹ́ bí “ọ̀rọ̀,” èyí tí ó lè tọ́ka sí ìkéde àwọn aposteli.
- source_word: ἐπίστευσαν
  choice: gbàgbọ́
  rationale: Ó tú ọ̀rọ̀-ìṣe náà ní tààrà, láìfi ẹni tàbí ohun tí wọ́n gbàgbọ́ lé e lórí ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: iye ... sì di
  rationale: Ó ṣàfihàn ipò tuntun tí iye náà dé sí, ó sì bá ìtòlẹ́sẹẹsẹ Yorùbá mu.
- source_word: τῶν ἀνδρῶν
  choice: àwọn ọkùnrin
  rationale: ἀνήρ sábà máa ń tọ́ka sí ọkùnrin, kì í ṣe ènìyàn lápapọ̀; nítorí náà, a pa ìtọ́kasí akọ mọ́.
- source_word: ὡς χιλιάδες πέντε
  choice: nǹkan bí ẹgbẹ̀rún márùn-ún
  rationale: “Nǹkan bí” fi hàn pé iye náà jẹ́ àfojúsùn, gẹ́gẹ́ bí ὡς ṣáájú nọ́ńbà ṣe túmọ̀ sí.
theological_decisions:
- issue: Ìṣírò tí τῶν ἀνδρῶν fi mọ́ ọkùnrin ní pàtó
  choice: àwọn ọkùnrin
  alternative: àwọn ènìyàn; àwọn onígbàgbọ́
  rationale: Gíríìkì lo ἀνδρῶν, èyí tí ó sábà túmọ̀ sí àwọn ọkùnrin. Ìtumọ̀ yìí kò pinnu pé àwọn obìnrin kò sí lára gbogbo àwùjọ; ó kàn pa bí ẹsẹ náà ṣe sọ ìṣírò mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Nǹkan bí” jẹ́ ọ̀nà àdánidá láti sọ iye àfojúsùn, “gbàgbọ́” sì pa ìrọ̀rùn ọ̀rọ̀ Gíríìkì mọ́.
