id: ACT.4.16
reference: Acts 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: yo
  text: wọ́n ń wí pé, “Kí ni kí a ṣe sí àwọn ọkùnrin wọ̀nyí? Nítorí pé dájúdájú, àmì tí a mọ̀ dáadáa ti ṣẹlẹ̀ nípasẹ̀ wọn; ó sì hàn gbangba sí gbogbo àwọn tí ń gbé ní Jerusalẹmu, a kò sì lè sẹ́ ẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ àbọ̀ ìsinsìnyí yìí so ohun tí ìgbìmọ̀ náà sọ mọ́ àyíká ẹsẹ tó ṣáájú; ọ̀nà yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Τί ποιήσωμεν
  choice: Kí ni kí a ṣe
  rationale: Ìbéèrè oníṣiyèméjì pẹ̀lú aorist subjunctive ni; ìtumọ̀ yìí mú ìrònú wọn lórí ohun tí ó yẹ kí wọ́n ṣe jáde ní Yorùbá.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: sí àwọn ọkùnrin wọ̀nyí
  rationale: Dative náà tẹ̀ lé ποιέω, ó sì túmọ̀ sí ohun tí wọ́n yóò ṣe sí wọn; ọkùnrin ni Peteru àti Johanu nínú àyíká yìí.
- source_word: ὅτι μὲν γὰρ
  choice: Nítorí
  rationale: Ó ṣe àlàyé ìdí tí wọ́n fi wà nínú ìṣòro náà; agbára ìtẹnumọ́ inú gbólóhùn náà tún farahàn nínú ‘ó hàn gbangba’.
- source_word: γνωστὸν σημεῖον
  choice: àmì kan tí gbogbo ènìyàn mọ̀ dáadáa
  rationale: γνωστός túmọ̀ sí ohun tí a mọ̀ tàbí tí ó di mímọ̀ káàkiri; àyíká náà tẹnumọ́ pé gbogbo àwọn olùgbé Jerusalẹmu mọ̀ ọ́n.
- source_word: γέγονεν
  choice: ti ṣẹlẹ̀
  rationale: Perfect náà tọ́ka sí ìṣẹ̀lẹ̀ tí ó ti wáyé tí àbájáde rẹ̀ sì ṣì hàn.
- source_word: δι’ αὐτῶν
  choice: nípasẹ̀ wọn
  rationale: διά pẹ̀lú genitive fi ọ̀nà tàbí aṣojú hàn, láìsọ pé agbára náà ti ọ̀dọ̀ àwọn aposteli fúnra wọn wá.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: ó hàn gbangba sí gbogbo àwọn tí ń gbé ní Jerusalẹmu
  rationale: Ó pa ìtumọ̀ pé ohun náà jẹ́ mímọ̀ ní gbangba mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: a kò sì lè sẹ́ ẹ
  rationale: ἀρνέομαι níbí túmọ̀ sí láti sẹ́ ohun náà; arọ́pò-orúkọ ‘ẹ’ tọ́ka sí àmì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Ìtumọ̀ σημεῖον nínú àyíká iṣẹ́ ìyanu ní gbangba
  choice: àmì
  alternative: iṣẹ́ ìyanu
  rationale: ‘Àmì’ pa àṣàyàn ọ̀rọ̀ Luku àti ìtumọ̀ ẹ̀kọ́ pé ìṣẹ̀lẹ̀ náà ń tọ́ka kọjá ara rẹ̀ mọ́; àyíká fúnra rẹ̀ fi hàn pé iṣẹ́ ìyanu ni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye lójoojúmọ́; a lo àmì ohùn ní kíkún níbi tí ó bá bá àdánidá mu. A kò fi àlàyé ẹ̀kọ́ ìjọ kan kun ọ̀rọ̀ náà.
