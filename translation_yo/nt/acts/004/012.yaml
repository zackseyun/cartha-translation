language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: yo
  text: Kò sì sí ìgbàlà nínú ẹnikẹ́ni mìíràn, nítorí kò sí orúkọ mìíràn lábẹ́ ọ̀run tí a ti fi sí àárín aráyé[a], ẹni tí ó jẹ́ pé nípasẹ̀ rẹ̀ ni a gbọ́dọ̀ gbà wá là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, ἀνθρώποις, ń tọ́ka sí gbogbo aráyé, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρία
  choice: ìgbàlà
  rationale: “Ìgbàlà” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìdálà àti ìgbàlà ní ìtumọ̀ ẹ̀sìn; ó sì bá σωθῆναι tó tẹ̀ lé e mu.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: nínú ẹnikẹ́ni mìíràn
  rationale: Ó pa ìtumọ̀ ẹni àti ìyàsọ́tọ̀ ọ̀rọ̀ Gíríìkì mọ́, dípò kí ó sọ ọ́ di “ọ̀nà mìíràn” lásán.
- source_word: ὄνομα
  choice: orúkọ
  rationale: A pa àwòrán “orúkọ” mọ́, nítorí nínú àṣà Bíbélì ó lè ní ìtumọ̀ ẹni, àṣẹ àti ìdánimọ̀ láìjẹ́ pé a ṣàlàyé gbogbo rẹ̀ sínú ẹsẹ̀ náà.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: lábẹ́ ọ̀run
  rationale: Èyí pa ọ̀nà ìsọ̀rọ̀ Bíbélì àti ìwọ̀n gbogbo ayé tí gbólóhùn náà ní mọ́.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: tí a ti fi fúnni láàárín àwọn ènìyàn
  rationale: Ìtumọ̀ yìí pa iṣẹ́ àìsọ ẹni tó ṣe é àti ìtumọ̀ “láàárín aráyé” mọ́; kò sọ ἐν di “sí” nìkan.
- source_word: ἐν ᾧ
  choice: èyí tí a ... fi
  rationale: Ìlò “fi” ní Yorùbá fi hàn pé orúkọ náà ni ọ̀nà tàbí ohun èlò ìgbàlà, ó sì ń tọ́ka padà sí “orúkọ.”
- source_word: δεῖ σωθῆναι ἡμᾶς
  choice: a gbọ́dọ̀ fi gba wa là
  rationale: “Gbọ́dọ̀” pa agbára δεῖ mọ́, “gba wa là” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe ìgbàlà tí ó dé bá “wa.”
theological_decisions:
- issue: Ìyàsọ́tọ̀ ìgbàlà nínú Jésù
  choice: “Ìgbàlà kò sì sí nínú ẹnikẹ́ni mìíràn”
  alternative: “Kò sí ọ̀nà ìgbàlà mìíràn”
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí ẹni mìíràn, kì í ṣe ọ̀nà lásán. Ìtumọ̀ náà pa ìfẹ̀sùn ìyàsọ́tọ̀ inú ẹsẹ̀ mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- issue: Ìtumọ̀ ἀνθρώποις gẹ́gẹ́ bí gbogbo aráyé
  choice: “láàárín àwọn ènìyàn” pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé
  alternative: “láàárín aráyé”
  rationale: “Àwọn ènìyàn” jẹ́ ọ̀rọ̀ àpapọ̀ tó bó gbogbo ènìyàn mu ní Yorùbá; àlàyé náà mú ìwọ̀n Gíríìkì ṣe kedere láìyi ọ̀rọ̀ pàtàkì padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa àwọn ọ̀nà ìsọ̀rọ̀ Bíbélì “nínú ẹnikẹ́ni mìíràn,” “orúkọ,” àti “lábẹ́ ọ̀run” mọ́.
