  source_fidelity: Ìtumọ̀ náà ń pa ìyàsọ́tọ̀ tó wà nínú ἐν ἄλλῳ οὐδενί, àwòrán “orúkọ,” “lábẹ́ ọ̀run,” àti ìfẹ́kùn-ún δεῖ σωθῆναι ἡμᾶς mọ́ dáadáa. Síbẹ̀, “tí a ti fi fúnni” kò ṣe kedere gẹ́gẹ́ bí àtúnṣe δεδομένον ἐν ἀνθρώποις; a tún ṣe gbolohun ìbátan ìkẹyìn kí “orúkọ” hàn gbangba gẹ́gẹ́ bí ọ̀nà ìgbàlà.
