  to: Kò sì sí ìgbàlà nínú ẹnikẹ́ni mìíràn, nítorí kò sí orúkọ mìíràn lábẹ́ ọ̀run tí a ti fi sí àárín aráyé[a], ẹni tí ó jẹ́ pé nípasẹ̀ rẹ̀ ni a gbọ́dọ̀ gbà wá là.
