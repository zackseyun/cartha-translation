id: ACT.4.31
reference: Acts 4:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti gbàdúrà tán, ibi tí wọ́n péjọ sí mì tìtì; gbogbo wọn sì kún fún Ẹ̀mí Mímọ́, wọ́n sì ń sọ ọ̀rọ̀ Ọlọ́run pẹ̀lú ìgboyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú ìgbẹ́kẹ̀lé” tàbí “ní gbangba láìbẹ̀rù.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí sísọ̀rọ̀ ní gbangba, ní òmìnira, láìsí ìbẹ̀rù.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: nígbà tí wọ́n ti gbàdúrà tán
  rationale: Ọ̀rọ̀ àpọnlé aorist inú genitive absolute fi ìgbà tó ṣáájú ìṣẹ̀lẹ̀ pàtàkì hàn; gbolohun yìí jẹ́ Yorùbá àdánidá fún ‘lẹ́yìn tí wọ́n gbàdúrà.’
- source_word: ἐσαλεύθη
  choice: mì tìtì
  rationale: Ó pa agbára ìṣíkiri ibi náà mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé ibi kan mì gidigidi.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: tí wọ́n péjọ sí
  rationale: Ó fi ibi tí wọ́n wà ní ipò ìpéjọ hàn ní Yorùbá tó rọrùn, láìfi kún un pé àwọn fúnra wọn ló dá ìpéjọ náà sílẹ̀.
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: gbogbo wọn kún fún Ẹ̀mí Mímọ́
  rationale: Ó pa passive àti ìtumọ̀ pé gbogbo ẹgbẹ́ náà ni ó ní ìrírí yìí mọ́, ó sì tẹ̀lé àṣà gbolohun Lúùkù nípa kíkún fún Ẹ̀mí.
- source_word: ἐλάλουν
  choice: wọ́n ń sọ
  rationale: Àmì ‘ń’ fi ìṣe tó ń bá a lọ hàn, gẹ́gẹ́ bí imperfect Gíríìkì, láìṣàfikún ìtumọ̀ pé wọ́n ṣẹ̀ṣẹ̀ bẹ̀rẹ̀.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Bíbélì tó mọ́gbọ́n dání fún ìhìn Ọlọ́run tí wọ́n ń kéde.
- source_word: μετὰ παρρησίας
  choice: pẹ̀lú ìgboyà
  rationale: Ó mú ọ̀rọ̀ sísọ ní gbangba láìbẹ̀rù jáde; àlàyé ìsàlẹ̀ fi àwọn ojú ìtumọ̀ tó sún mọ́ ọn hàn.
theological_decisions:
- issue: Ọ̀nà tí a fi sọ kíkún fún Ẹ̀mí
  choice: gbogbo wọn kún fún Ẹ̀mí Mímọ́
  alternative: Ẹ̀mí Mímọ́ kún gbogbo wọn
  rationale: Yíyan yìí pa irú ìsọ̀rọ̀ passive inú Gíríìkì àti àṣà Lúùkù mọ́, láìsọ pé ẹsẹ̀ náà ń kọ́ ẹ̀kọ́ ẹ̀sìn pàtó kan nípa ìrírí kejì.
- issue: Ìrísí ìṣe ἐλάλουν
  choice: wọ́n ń sọ
  alternative: wọ́n sọ; wọ́n bẹ̀rẹ̀ sí í sọ
  rationale: Imperfect náà tọ́ka sí ìkéde tó ń bá a lọ; a kò fi ìtumọ̀ ìbẹ̀rẹ̀ sí i tí Gíríìkì kò fi dandan sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. A lo ‘mì tìtì’ fún ìṣíkiri tó ṣe kedere, ‘péjọ sí’ fún ipò ìpéjọ, àti ‘wọ́n ń sọ’ láti pa imperfect mọ́. Àmì ìsàlẹ̀ [a] wà lẹ́yìn ‘ìgboyà,’ ibi tí àlàyé náà jẹ mọ́.
