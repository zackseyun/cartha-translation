id: ACT.4.11
reference: Acts 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: yo
  text: Òun yìí ni òkúta tí ẹ̀yin, àwọn tí ń kọ́ ilé, kọ̀ sílẹ̀, tí ó sì ti di òkúta pàtàkì igun ilé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “òkúta orí ilé”; ní tààrà, “orí igun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Òun yìí
  rationale: Ọ̀rọ̀ atọ́ka yìí ń tọ́ka sí Jésù pẹ̀lú ìtẹnumọ́ nínú àyíká ọ̀rọ̀ náà; “Òun yìí” jẹ́ ọ̀nà àdánidá láti fi ìdánimọ̀ tààrà hàn ní Yorùbá.
- source_word: λίθος
  choice: òkúta
  rationale: Èyí ni ìtumọ̀ àkọ́kọ́ ọ̀rọ̀ náà, ó sì pa àwòrán inú Sáàmù 118:22 mọ́.
- source_word: ἐξουθενηθεὶς
  choice: kọ̀ sílẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ohun kan ṣe aláìníyelórí tàbí kíkọ̀ ọ́. Nínú àwòrán iṣẹ́ ìkọ́lé yìí, “kọ̀ sílẹ̀” sọ àbájáde náà ní kedere láìsọ ìtumọ̀ ẹ̀gàn rẹ̀ di asán.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: ẹ̀yin akọ́lé
  rationale: Ó pa ẹ̀sùn tààrà sí àwọn tí Pétérù ń bá sọ̀rọ̀ mọ́, ó sì tún pa àkàwé àwọn akọ́lé mọ́.
- source_word: γενόμενος
  choice: tí ó sì ti di
  rationale: “Ti di” fi ìyípadà tí ó ti ṣẹlẹ̀, tí ipa rẹ̀ sì ṣì wà nísinsìnyí, hàn lọ́nà àdánidá.
- source_word: κεφαλὴν γωνίας
  choice: òkúta pàtàkì igun ilé
  rationale: Gbólóhùn náà jẹ́ àkànlò-èdè iṣẹ́ ìkọ́lé láti inú Sáàmù 118:22. Ìtumọ̀ yìí ṣe kedere fún òǹkàwé òde òní, ó sì yẹra fún fífi dájú pé òkúta ìpìlẹ̀ nìkan tàbí òkúta orí ilé nìkan ni a ní lọ́kàn.
theological_decisions:
- issue: Àwòrán ọ̀rọ̀ tí a fa yọ láti Sáàmù 118:22
  choice: òkúta pàtàkì igun ilé
  alternative: òkúta orí ilé; ní tààrà, “orí igun”
  rationale: Ẹsẹ̀ náà dá Jésù mọ̀ pẹ̀lú òkúta tí àwọn akọ́lé kọ̀, ṣùgbọ́n tí a gbé sí ipò ọlá. Nítorí pé irú òkúta pàtó tí àwòrán náà ń tọ́ka sí ṣì lè jẹ́ kókó àríyànjiyàn, a lo ọ̀rọ̀ àárín tí ó pa àwòrán náà mọ́, a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpéwọ̀, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ẹ̀yin akọ́lé” pa ìtẹnumọ́ àti ẹ̀sùn tààrà inú ọ̀rọ̀ Gíríìkì mọ́; àmì [a] wà lẹ́yìn gbólóhùn tí àlàyé náà kan.
