id: ACT.4.22
reference: Acts 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: yo
  text: Nítorí pé ọkùnrin náà, ẹni tí àmì ìwòsàn yìí ti ṣẹlẹ̀ sí, ti lé ní ogójì ọdún[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àmì yìí tí ó mú ìwòsàn wá” tàbí “iṣẹ́ ìyanu ìwòsàn yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: ti lé ní ogójì ọdún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ọjọ́-orí ẹni náà ju ogójì ọdún lọ.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí fún ohun tí a sọ ṣáájú.
- source_word: ὁ ἄνθρωπος
  choice: ọkùnrin náà
  rationale: Ó tọ́ka sí ọkùnrin kan pàtó tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà.
- source_word: ἐφ’ ὃν
  choice: ẹni tí ... ṣẹlẹ̀ sí
  rationale: Ìtumọ̀ yìí fi ọkùnrin náà hàn gẹ́gẹ́ bí ẹni tí ìṣẹ̀lẹ̀ náà kan, láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: γεγόνει
  choice: ti ṣẹlẹ̀
  rationale: Ó pa ìdojúkọ sí ìṣẹ̀lẹ̀ náà mọ́, kò sì sọ olùṣe kan ní pàtó níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- source_word: τὸ σημεῖον τοῦτο
  choice: àmì ... yìí
  rationale: “Àmì” pa ìtumọ̀ iṣẹ́ náà gẹ́gẹ́ bí ohun tí ń tọ́ka sí agbára àti iṣẹ́ Ọlọ́run mọ́; “iṣẹ́ ìyanu” nìkan lè pàdánù ìtumọ̀ yẹn.
- source_word: τῆς ἰάσεως
  choice: ìwòsàn
  rationale: “Ìwòsàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún mímú ẹni láradá, ó sì bá ìtumọ̀ ἴασις mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ σημεῖον níbi iṣẹ́ ìyanu
  choice: àmì
  alternative: iṣẹ́ ìyanu
  rationale: “Àmì” pa ipa iṣẹ́ náà gẹ́gẹ́ bí ẹ̀rí tó ní ìtumọ̀ mọ́, láìdín un kù sí ohun àgbàyanu lásán.
- issue: Olùṣe tí γεγόνει lè dà bí ẹni pé ó ń tọ́ka sí
  choice: ti ṣẹlẹ̀ sí
  alternative: tí a ṣe fún
  rationale: Gíríìkì dojú kọ ìṣẹ̀lẹ̀ náà, kò sì sọ olùṣe ní tààrà; ìtumọ̀ yìí yẹra fún fífi olùṣe kan kún ẹsẹ náà, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ṣàlàyé orísun ìwòsàn náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ṣeé lóye. Gbólóhùn àfikún “ẹni tí ...” mú ètò ọ̀rọ̀ náà rọrùn, ó sì pa ìbáṣepọ̀ tí Gíríìkì fi ἐφ’ ὃν hàn mọ́.
