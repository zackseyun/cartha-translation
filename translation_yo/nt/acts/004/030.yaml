id: ACT.4.30
reference: Acts 4:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: yo
  text: nígbà tí o bá ń na ọwọ́ rẹ jáde fún ìwòsàn, tí àwọn àmì àti iṣẹ́ ìyanu sì ń ṣẹlẹ̀ nípasẹ̀ orúkọ Jesu, ìránṣẹ́ mímọ́ rẹ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jesu, ọmọ mímọ́ rẹ.” Ọ̀rọ̀ Gíríìkì náà, pais, lè túmọ̀ sí “ọmọ” tàbí “ìránṣẹ́.” Níhìn-ín, “ìránṣẹ́” ni a yàn nítorí Ìṣe Àwọn Àpọ́sítélì ń fi èdè Aísáyà nípa Ìránṣẹ́ Ọlọ́run ṣe àfihàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: bí ìwọ ti ń na ... jáde
  rationale: Èyí fi ìṣe méjèèjì tí ń lọ ní àkókò kan náà hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: χεῖρά σου
  choice: ọwọ́ rẹ
  rationale: Ó pa àwòrán Bíbélì nípa ọwọ́ Ọlọ́run gẹ́gẹ́ bí àmì agbára àti iṣẹ́ rẹ mọ́ láìfi àlàyé kún un.
- source_word: εἰς ἴασιν
  choice: láti mú ìwòsàn wá
  rationale: Ó sọ ète nínà ọwọ́ náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìwòsàn mọ́.
- source_word: σημεῖα καὶ τέρατα
  choice: àwọn àmì àti iṣẹ́ ìyanu
  rationale: Èyí jẹ́ ọ̀rọ̀ méjì tí ó ṣe kedere ní Yorùbá, tí kò sì fi ọ̀rọ̀ ìtumọ̀ míì kún gbólóhùn Gíríìkì.
- source_word: γίνεσθαι
  choice: ń ṣẹlẹ̀
  rationale: γίνομαι níbí túmọ̀ sí pé àwọn ìṣẹ̀lẹ̀ náà ń wáyé; ‘ń ṣẹlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, ó sì bá ìṣe tí ń lọ mu.
- source_word: διὰ τοῦ ὀνόματος
  choice: nípasẹ̀ orúkọ
  rationale: Ó pa ìtumọ̀ irinṣẹ́ tàbí aṣojú ti διά pẹ̀lú genitive mọ́, láìṣàlàyé ‘orúkọ’ sí ‘àṣẹ’ nínú ọ̀rọ̀ pàtàkì.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: Jesu, ìránṣẹ́ mímọ́ rẹ
  rationale: παῖς lè jẹ́ ‘ọmọ’ tàbí ‘ìránṣẹ́’; ‘ìránṣẹ́’ bá ìtumọ̀ Ìránṣẹ́ inú Aísáyà tí Ìṣe Àwọn Àpọ́sítélì ń tọ́ka sí mu. Ìṣètò ọ̀rọ̀ Yorùbá yìí mú kí ẹni tí ‘rẹ’ ń tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ παῖς fún Jesu
  choice: ìránṣẹ́
  alternative: ọmọ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ méjèèjì, ṣùgbọ́n bí a ṣe lò ó ní Ìṣe 3:13, 3:26 àti níbí bá èdè nípa Ìránṣẹ́ Ọlọ́run nínú Aísáyà mu. A pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
