id: ACT.4.35
reference: Acts 4:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: yo
  text: wọ́n sì ń gbé wọn kalẹ̀ síbi ẹsẹ̀ àwọn àpọ́sítélì[b][a]; a sì ń pín in fún olúkúlùkù gẹ́gẹ́ bí àìní olúkúlùkù ṣe rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘níwájú àwọn àpọ́sítélì.’ Gíríìkì sọ ní tààrà pé ‘ní ẹsẹ̀/lẹ́gbẹ̀ẹ́ ẹsẹ̀ àwọn àpọ́sítélì,’ ó sì pa àwòrán fífi ohun tí wọ́n rí sí abẹ́ àbójútó àwọn àpọ́sítélì mọ́.
    reason: lexical_alternative
  - marker: b
    text: 'Ohun tí ‘wọ́n ń gbé kalẹ̀’ àti ‘a ń pín’ ń tọ́ka sí wà nínú ẹsẹ̀ tó ṣáájú: owó tí wọ́n rí nínú àwọn ohun ìní tí wọ́n tà.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: wọ́n sì máa ń kó
  rationale: Àìpé (imperfect) náà fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn; ‘máa ń kó’ sọ ìṣe àṣà yìí ní Yorùbá àdánidá.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: sí ẹsẹ̀ àwọn aposteli
  rationale: Èyí pa àwòrán gidi ti fífi ohun sí ẹsẹ̀ àwọn aposteli mọ́, nígbà tí ó tún lè túmọ̀ sí fífi í sábẹ́ àbójútó wọn.
- source_word: διεδίδετο
  choice: a sì máa ń pín in
  rationale: Ìtumọ̀ aláìdárúkọ ẹni tó ṣe ìṣe (‘a …’) pa ohùn passive/impersonal mọ́ ní Yorùbá, ‘máa ń’ sì fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn.
- source_word: ἑκάστῳ
  choice: fún olúkúlùkù
  rationale: ‘Olúkúlùkù’ fi ìpín fún ẹnì kọ̀ọ̀kan hàn kedere.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: gẹ́gẹ́ bí ẹnikẹ́ni bá ṣe nílò rẹ̀
  rationale: Gbólóhùn yìí fi hàn pé iye tí a pín bá ìlò ẹni kọ̀ọ̀kan mu, láìfi ìtumọ̀ míì kún un.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ọ̀rọ̀ náà jẹ́ aláìnídìí fún gbogbo ènìyàn, kì í ṣe fún ọkùnrin nìkan.
- source_word: χρείαν
  choice: nílò
  rationale: ‘Nílò’ jẹ́ ọ̀nà Yorùbá àdánidá àti kedere láti sọ pé ẹnì kan ní àìní.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí wọ́n kó tí a sì pín ní kedere
  choice: Lo arọ́pò-orúkọ ‘wọn’ àti ‘in,’ kí ẹsẹ tó ṣáájú ṣàlàyé ohun náà.
  alternative: Sọ ní tààrà pé ‘owó náà’ tàbí ‘owó tí wọ́n rí nínú ohun tí wọ́n tà.’
  rationale: Gíríìkì kò tún dárúkọ ohun náà; ó gbẹ́kẹ̀ lé àyíká ẹsẹ 34. Arọ́pò-orúkọ pa ìṣàn àti àìsọ̀rọ̀-pọ̀ ọrọ̀ ìpilẹ̀ṣẹ̀ mọ́ láìfi àlàyé àfikún sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọ ‘aposteli’ jẹ́ èyí tí ó wọ́pọ̀, ó sì yé òǹkàwé òde òní; ìlò ‘máa ń’ méjèèjì pa apá àìpé àti ìṣe àṣà inú ìtàn mọ́.
