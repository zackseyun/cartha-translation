  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: yo
  text: Nítorí àwa kò lè ṣàì sọ̀rọ̀ nípa ohun tí a ti rí tí a sì ti gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà àdánidá pé, “Nítorí a kò lè dáwọ́ sísọ̀rọ̀ nípa ohun tí a ti rí tí a sì ti gbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: àwa kò lè ṣàìsọ̀rọ̀
  rationale: Èyí pa ìtumọ̀ àìlè dáwọ́ sísọ̀rọ̀ mọ́, ó sì fi ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ ἡμεῖς hàn nípasẹ̀ “àwa.” Ọ̀rọ̀ “ṣàìsọ̀rọ̀” jẹ́ ọ̀nà Yorùbá tí ó ṣedéédé fún ìṣètò Gíríìkì náà láì sọ ọ́ di ìpinnu lásán.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ἃ
  choice: ohun tí
  rationale: Ó tọ́ka sí àkóónú ẹ̀rí wọn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: a ti rí, tí a sì ti gbọ́
  rationale: Àmì “ti” fi hàn pé ìrírí náà ti ṣẹlẹ̀ ṣùgbọ́n ó ṣì ṣe pàtàkì sí ẹ̀rí wọn; “sì” mú ìsopọ̀ àwọn ìṣe méjèèjì ṣe kedere.
- source_word: λαλεῖν
  choice: sọ̀rọ̀ nípa
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí jíjẹ́rìí nípa ohun tí wọ́n rí tí wọ́n sì gbọ́; “nípa” mú ohun tí ọ̀rọ̀ náà dá lé ṣe kedere.
theological_decisions:
- issue: Ṣé ọ̀rọ̀ náà ń sọ àìlè dákẹ́ tàbí ìpinnu líle lásán?
  choice: Ó sọ pé àwọn aposteli kò lè ṣàìsọ̀rọ̀.
  alternative: Wọ́n pinnu gidigidi pé àwọn kì yóò dákẹ́.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν sọ àìlè yàgò fún sísọ̀rọ̀ ní tààrà; ìtumọ̀ náà kò rọ ọ́ sí ìfẹ́ tàbí ìpinnu lásán.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “àwa” láti fi ìtẹnumọ́ ἡμεῖς hàn, ṣùgbọ́n a lo “a” nínú gbólóhùn abẹ́ láti yẹra fún ìwúwo tí kò pọndandan.
