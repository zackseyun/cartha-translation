  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: yo
  text: Nítorí ní tòótọ́, nínú ìlú yìí ni Hẹ́rọ́dù àti Pọ́ńtíù Pílátù, pẹ̀lú àwọn Kèfèrí àti àwọn ènìyàn Ísírẹ́lì, kóra jọ lòdì sí Jésù, ìránṣẹ́ mímọ́ rẹ[a], ẹni tí ìwọ fi òróró yàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù ọmọ mímọ́ rẹ.” Ọ̀rọ̀ Gíríìkì παῖς lè túmọ̀ sí “ìránṣẹ́” tàbí “ọmọ”; “ìránṣẹ́” ló bá àyíká ọ̀rọ̀ mu jù níbí, nítorí ó jọ èdè nípa Ìránṣẹ́ nínú Aísáyà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí fífi òróró yàn. Èyí ń pa ìró Mèsáyà àti yíyan fún iṣẹ́ kan mọ́.
    reason: translation_clarity
lexical_decisions:
- source_word: συνήχθησαν
  choice: kóra jọ
  rationale: Ó sọ ìpéjọpọ̀ tí ó ti ṣẹlẹ̀; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì fi ohun tó fa ìpéjọpọ̀ náà kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé àdúrà àti àyọlò tó ṣáájú.
- source_word: ἐπ’ ἀληθείας
  choice: ní tòótọ́
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: nínú ìlú yìí
  rationale: Ó pa ìtọ́ka sí ìlú tí àwọn olùgbọ́ mọ̀ mọ́ láì fi orúkọ Jerúsálẹ́mù kún ọ̀rọ̀.
- source_word: ἐπὶ τὸν
  choice: láti dojú kọ
  rationale: Nínú àyíká ìpéjọpọ̀ ọ̀tá, gbólóhùn náà túmọ̀ sí ìtakò sí Jésù.
- source_word: ἅγιον
  choice: mímọ́
  rationale: Ó fi ìyàsọ́tọ̀ fún Ọlọ́run àti ìwà mímọ́ hàn.
- source_word: παῖδά σου
  choice: ìránṣẹ́ ... rẹ
  rationale: παῖς lè jẹ́ ọmọ tàbí ìránṣẹ́, ṣùgbọ́n àyíká Ìṣe àti ìró èdè Ìránṣẹ́ inú Aísáyà ṣe àtìlẹ́yìn fún “ìránṣẹ́”; àlàyé ẹsẹ̀ pa ìtumọ̀ mìíràn mọ́.
- source_word: ὃν ἔχρισας
  choice: ẹni tí ìwọ fi àmì òróró yàn
  rationale: Ó pa àwòrán ìfòróróyàn àti ìtumọ̀ Mèsáyà mọ́ láì yí ọ̀rọ̀-ìṣe náà sí oyè.
- source_word: ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Ní ìtakora pẹ̀lú Ísírẹ́lì, ó tọ́ka sí àwọn tí kì í ṣe Júù; “Kèfèrí” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa.
- source_word: λαοῖς Ἰσραήλ
  choice: àwọn ènìyàn Ísírẹ́lì
  rationale: Ó tẹ̀ lé ọ̀pọ̀ nǹkan λαοῖς níwọ̀n bí Yorùbá ti ń fi “àwọn” samisi ọ̀pọ̀, ó sì yẹra fún gígbe ìtumọ̀ òṣèlú wọlé.
theological_decisions:
- issue: Ìtumọ̀ παῖς fún Jésù
  choice: ìránṣẹ́
  alternative: ọmọ
  rationale: Àdúrà náà ń dun bí èdè Ìránṣẹ́ Aísáyà, àti lílo ọ̀rọ̀ náà ní Ìṣe 3:13, 26; 4:27, 30 ń ṣètìlẹ́yìn fún “ìránṣẹ́.” Èyí kò tako jíjẹ́ Ọmọ Ọlọ́run, ṣùgbọ́n ẹsẹ yìí kò fi ìtumọ̀ yẹn sí iwájú.
- issue: Ìtumọ̀ ἔθνεσιν ní ìbáṣepọ̀ pẹ̀lú Ísírẹ́lì
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká náà ń fi àwọn tí kì í ṣe Júù wé àwọn ènìyàn Ísírẹ́lì; “àwọn Kèfèrí” mú ìyàtọ̀ ẹ̀yà-ẹ̀sìn náà hàn kedere.
- issue: Ìfòróróyan Jésù
  choice: fi àmì òróró yàn
  alternative: yàn sípò
  rationale: Ìtumọ̀ gangan χρίω ni fífi òróró yàn; yíyan èdè yìí pa ìró Mèsáyà àti iṣẹ́ tí Ọlọ́run yàn án sí mọ́ láì sọ ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A lò “Kèfèrí” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀; a pa orúkọ ara Róòmù mọ́ ní ìkọ̀wé Yorùbá.
