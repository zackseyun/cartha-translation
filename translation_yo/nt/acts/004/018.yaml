id: ACT.4.18
reference: Acts 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: yo
  text: Nígbà tí wọ́n pè wọ́n wọlé, wọ́n pàṣẹ fún wọn pé kí wọ́n má ṣe sọ̀rọ̀ rárá, tàbí kí wọ́n má ṣe kọ́ni ní orúkọ Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n má ṣe sọ ohunkóhun rárá tàbí kí wọ́n má ṣe kọ́ni ní orúkọ Jésù.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún μὴ φθέγγεσθαι àti bí τὸ καθόλου ṣe ń mú ìfòfindè náà lágbára.
lexical_decisions:
- source_word: καλέσαντες
  choice: Nígbà tí wọ́n sì pè wọ́n wọlé
  rationale: Ọ̀rọ̀-ìṣe àfikún aorist náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì ní ìtumọ̀ àkókò níbí. “Pè wọ́n wọlé” bá àyíká ìgbẹ́jọ́ mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: παρήγγειλαν
  choice: wọ́n pàṣẹ fún wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àṣẹ tí ẹni aláṣẹ fi fún ẹlòmíràn; “pàṣẹ” pa agbára àṣẹ náà mọ́ ní kedere.
- source_word: τὸ καθόλου
  choice: rárá
  rationale: “Rárá” mú ìtẹnumọ́ ìfòfindè pátápátá náà jáde ní èdè Yorùbá àdánidá.
- source_word: μὴ φθέγγεσθαι
  choice: kí wọ́n má ṣe sọ̀rọ̀
  rationale: φθέγγομαι túmọ̀ sí sísọ tàbí pípe ọ̀rọ̀ jáde. “Sọ̀rọ̀” jẹ́ ọ̀nà àdánidá láti sọ ọ́, nígbà tí “rárá” fi ìfòfindè náà tẹnumọ́.
- source_word: μηδὲ διδάσκειν
  choice: bẹ́ẹ̀ ni kí wọ́n má ṣe kọ́ni
  rationale: Gbólóhùn yìí so ìfòfindè kejì mọ́ ti àkọ́kọ́. “Bẹ́ẹ̀ ni … má ṣe” fi ìbáṣepọ̀ μηδέ hàn ní kedere, láì sọ ìṣe méjèèjì di ohun kan náà.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: ní orúkọ Jésù
  rationale: Ní inú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn yìí sábà ń tọ́ka sí sísọ tàbí ṣíṣe ohun kan ní ìbáṣepọ̀ pẹ̀lú Jésù tàbí lábẹ́ àṣẹ orúkọ rẹ̀. “Ní orúkọ Jésù” jẹ́ èdè Yorùbá tí ó mọ́, tí kò sì fi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A kọ orúkọ ẹni náà gẹ́gẹ́ bí ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìwọ̀n ìfòfindè nípa jíjẹ́rìí sí Jésù
  choice: Àṣẹ náà fòfin de sísọ̀rọ̀ àti kíkọ́ni ní ìbáṣepọ̀ pẹ̀lú orúkọ Jésù pátápátá.
  alternative: Kí a ka á sí ìfòfindè ìwàásù ní gbangba nìkan, kì í ṣe gbogbo ọ̀rọ̀.
  rationale: Àpapọ̀ τὸ καθόλου, μὴ φθέγγεσθαι, àti μηδὲ διδάσκειν fi ìfòfindè tó lágbára àti tó gbòòrò hàn. Ìtumọ̀ náà kò dín un kù sí ìwàásù ní gbangba nìkan, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn síbi tí ó yẹ; “pè wọ́n wọlé” mú àyíká ìgbẹ́jọ́ hàn, “wọ́n pàṣẹ” sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
