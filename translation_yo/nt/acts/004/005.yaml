  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ kejì pé a kó àwọn olórí wọn, àwọn àgbà, àti àwọn akọ̀wé jọ ní Jerusalẹmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “péjọ” tàbí “kóra jọ.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí passive, ìyẹn ni, “a kó wọn jọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó sì ṣẹlẹ̀ jẹ́ ọ̀nà Yorùbá àdánidá láti tẹ ìtàn náà síwájú, ó sì pa ìtumọ̀ ọ̀rọ̀ ìṣẹ̀lẹ̀ náà mọ́ láìlo èdè àtijọ́.
- source_word: ἐπὶ τὴν αὔριον
  choice: ní ọjọ́ kejì
  rationale: Gbólóhùn yìí túmọ̀ sí ọjọ́ tí ó tẹ̀ lé e; “ní ọjọ́ kejì” ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: συναχθῆναι
  choice: a kó ... jọ
  rationale: Ìkọ́lé aláìdárúkọ ẹni tí ó ṣe iṣẹ́ náà fi ìrísí àìṣe-taara ti ọ̀rọ̀ Gíríìkì hàn, nígbà tí “kó ... jọ” ń sọ pé a mú ẹgbẹ́ náà péjọ.
- source_word: αὐτῶν
  choice: wọn
  rationale: “Wọn” pa ìbátan tí arọ́pò-orúkọ Gíríìkì fi hàn mọ́, láìsọ ẹni tí ó ń tọ́ka sí ní pàtó ju bí ẹsẹ náà ti ṣe lọ.
- source_word: τοὺς ἄρχοντας
  choice: àwọn olórí
  rationale: “Àwọn olórí” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún àwọn aláṣẹ tàbí aṣáájú ìjọba ní àyíká yìí.
- source_word: τοὺς πρεσβυτέρους
  choice: àwọn àgbààgbà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn olórí tí àwùjọ mọ̀ sí ipò, kì í ṣe àwọn àgbàlagbà lásán.
- source_word: τοὺς γραμματεῖς
  choice: àwọn akọ̀wé òfin
  rationale: “Àwọn akọ̀wé òfin” sọ ẹgbẹ́ àwọn amòye akọ̀wé àti òfin Júù ní kedere, láìfi ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἐν Ἰερουσαλήμ
  choice: ní Jerúsálẹ́mù
  rationale: Èyí jẹ́ ìtumọ̀ ibi tí ìpéjọ náà ti wáyé, pẹ̀lú ọ̀nà tí orúkọ ìlú náà gbà wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ohun tí αὐτῶν ń tọ́ka sí nínú àpèjúwe àwọn aláṣẹ tí a kó jọ
  choice: A túmọ̀ rẹ̀ sí “wọn” nínú “àwọn olórí wọn.”
  alternative: Láti yọ arọ́pò-orúkọ náà kúrò, tàbí láti sọ ní pàtó pé “àwọn olórí àwọn Júù.”
  rationale: Gíríìkì ní arọ́pò-orúkọ náà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ẹni tí ó ń tọ́ka sí ní pàtó. Nítorí náà, “wọn” pa ìbátan àti àìṣe-kedere náà mọ́ láìfi ìtumọ̀ tóóró kún ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìkọ́lé “a kó ... jọ” ń pa ìrísí àìṣe-taara mọ́, bí ó tilẹ̀ jẹ́ pé “péjọ” lè dún bí èdè ojoojúmọ́ sí i.
