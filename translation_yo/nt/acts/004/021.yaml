  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí wọ́n tún halẹ̀ mọ́ wọn sí i[a], wọ́n dá wọn sílẹ̀, níwọ̀n bí wọn kò ti rí ọ̀nà bí wọ́n ṣe lè jẹ wọ́n níyà nítorí àwọn ènìyàn; nítorí gbogbo ènìyàn ń fi ògo fún Ọlọ́run nítorí ohun tí ó ṣẹlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “lẹ́yìn tí wọ́n halẹ̀ mọ́ wọn lẹ́ẹ̀kan sí i,” tàbí “lẹ́yìn tí wọ́n fi ìhalẹ̀ míì kún un.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé wọ́n fi ìhalẹ̀ míì kún àwọn ìhalẹ̀ tí wọ́n ti ṣe tẹ́lẹ̀, tàbí pé wọ́n mú ìhalẹ̀ náà le sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: lẹ́yìn tí wọ́n tún halẹ̀ mọ́ wọn sí i
  rationale: Ó mú ìtumọ̀ ìhalẹ̀ àfikún tàbí ìhalẹ̀ tí a mú le sí i jáde, ó sì bá Yorùbá àdánidá mu.
- source_word: ἀπέλυσαν
  choice: wọ́n dá wọn sílẹ̀
  rationale: Ó tọ́ka sí dídá wọn sílẹ̀ kúrò ní àhámọ́ àwọn aláṣẹ.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: Wọn kò rí ọ̀nà tí wọn ì bá fi jẹ wọ́n níyà
  rationale: Ó pa ìtumọ̀ ‘wọn kò rí bí wọn yóò ṣe’ mọ́, pẹ̀lú agbára ìṣe aláìdájú inú subjunctive.
- source_word: διὰ τὸν λαόν
  choice: nítorí àwọn ènìyàn
  rationale: διά pẹ̀lú accusative ní agbára ìdí níbí; λαός túmọ̀ sí àwọn ènìyàn ní gbogbogbò, kì í ṣe ogunlọ́gọ̀ nìkan.
- source_word: πάντες ἐδόξαζον τὸν θεόν
  choice: gbogbo wọn ń fi ògo fún Ọlọ́run
  rationale: ‘ń fi ògo fún’ pa èdè ọlá tí δοξάζω ní mọ́, ‘ń’ sì fi ìṣe tí ń lọ lọ́wọ́ inú imperfect hàn.
- source_word: ἐπὶ τῷ γεγονότι
  choice: nítorí ohun tí ó ṣẹlẹ̀
  rationale: Ó fi ohun tí ó ti ṣẹlẹ̀ gẹ́gẹ́ bí ìdí tí wọ́n fi ń fi ògo fún Ọlọ́run hàn ní Yorùbá tí ó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘jẹ ... níyà’ fún ìjìyà láti ọwọ́ aláṣẹ, àti ‘fi ògo fún Ọlọ́run’ láti pa èdè ẹ̀sìn Lúùkù–Ìṣe mọ́.
