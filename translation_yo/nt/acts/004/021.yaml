  to: Ṣùgbọ́n lẹ́yìn tí wọ́n tún halẹ̀ mọ́ wọn sí i[a], wọ́n dá wọn sílẹ̀, níwọ̀n bí wọn kò ti rí ọ̀nà bí wọ́n ṣe lè jẹ wọ́n níyà nítorí àwọn ènìyàn; nítorí gbogbo ènìyàn ń fi ògo fún Ọlọ́run nítorí ohun tí ó ṣẹlẹ̀.
  rationale: A rọ́pò àsopò ìbẹ̀rẹ̀ kí ó má ṣe fi ìtumọ̀ ìyọrísí tí kò sí nínú δέ kún ọ̀rọ̀ náà. A tún ṣàtúnṣe ìkọ̀lé ‘bí wọ́n ṣe lè’ fún τὸ πῶς κολάσωνται, a sì sọ πάντες di ‘gbogbo ènìyàn’ kí ìtọ́kasí rẹ̀ le kedere. Àlàyé abẹ́lẹ̀ náà túnṣe àpèjúwe ‘fi ìhalẹ̀ kún un’ kí aṣojú-ọrọ náà má bàa dáni lójú.
