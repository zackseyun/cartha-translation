  source_fidelity: Ìtumọ̀ náà mú ìhalẹ̀ àfikún, ìtúsílẹ̀, àìrí ọ̀nà ìjìyà, ìdí tí àwọn ènìyàn fi dá àwọn aláṣẹ dúró, àti fífi ògo fún Ọlọ́run nítorí ìṣẹ̀lẹ̀ náà hàn dáadáa. Síbẹ̀, “Nítorí náà” ń sọ ìpèníjà/ìyọrísí tó lágbára ju δέ (“ṣùgbọ́n/nígbà náà”) lọ, àti “gbogbo wọn” lè ṣàìní ìtọ́kasí kedere sí gbogbo ènìyàn.
