  source_fidelity: 'Ìtumọ̀ náà ń fi àwọn èrò pàtàkì Gíríìkì hàn dáadáa: Pétérù àti Jòhánù dáhùn sí wọn, ìwọ̀n ohun tí ó tọ́ níwájú Ọlọ́run, ìfiwéra fífetí sí wọn pẹ̀lú fífetí sí Ọlọ́run, àti àṣẹ láti dájọ́. Síbẹ̀, “Ẹ fúnra yín ṣe ìdájọ́ bóyá...” yí ìpìlẹ̀ ọ̀rọ̀ àídájú Gíríìkì náà (“Bí ... bá ...”) padà sí ìbéèrè bóyá, ó sì dín ìpè ìjàm̀bá-ọrọ̀ rẹ̀ kù díẹ̀.'
