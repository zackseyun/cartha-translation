source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù àti Jòhánù dá wọn lóhùn pé, “Bí ó bá tọ́ níwájú Ọlọ́run láti fetí sí yín ju Ọlọ́run lọ, ẹ fúnra yín ṣe ìdájọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Ṣùgbọ́n Pétérù àti Jòhánù
  rationale: “Ṣùgbọ́n” fi ìyípadà onírúurú ìtakora tí δέ ní hàn; àwọn orúkọ náà ni a kọ ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: dá wọn lóhùn pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn Gíríìkì tí ó ní ‘dáhùn ... sọ fún wọn’; ó pa gbogbo iṣẹ́ ìdáhùn àti ọ̀rọ̀ tí ó tẹ̀ lé mọ́ láì jẹ́ kí èdè le.
- source_word: δίκαιόν
  choice: ó tọ́
  rationale: “Ó tọ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tí ó yẹ tàbí tí ó dúró gẹ́gẹ́ bí ohun òdodo ní ìwòye Ọlọ́run.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó pa àwòrán ohun tí ó wà níwájú Ọlọ́run fún ìdájọ́ tàbí ìwòye rẹ̀ mọ́.
- source_word: ἀκούειν
  choice: láti fetí sí
  rationale: “Fetí sí” pa ìtumọ̀ ìpilẹ̀ ti gbígbọ́ tàbí fífetí sí mọ́, nígbà tí àyíká ọ̀rọ̀ náà tún jẹ́ kí ìtumọ̀ títẹ̀lé àṣẹ hàn.
- source_word: μᾶλλον ἢ
  choice: ju ... lọ
  rationale: Èyí jẹ́ ìṣètò ìfiwéra Yorùbá tó bá ìyàtọ̀ láàárín fífetí sí àwọn aláṣẹ àti fífetí sí Ọlọ́run mu.
- source_word: κρίνατε
  choice: Ẹ fúnra yín ṣe ìdájọ́
  rationale: Ó pa àṣẹ náà mọ́, ó sì mú kedere pé àwọn olùgbọ́ ni a pè láti ṣe àyẹ̀wò kí wọ́n sì dá ọ̀ràn náà fúnra wọn.
theological_decisions:
- issue: Bóyá kí ἀκούειν jẹ́ ‘gbọ́ràn sí’ ní pàtó nítorí pé ọ̀rọ̀ náà kan títẹ̀lé àṣẹ àwọn aláṣẹ tàbí ti Ọlọ́run
  choice: A lo “fetí sí” nínú ọ̀rọ̀ pàtàkì.
  alternative: gbọ́ràn sí yín dípò Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ náà ní ìtumọ̀ ìgbọ́ràn nínú, ṣùgbọ́n Gíríìkì lo ἀκούω, kì í ṣe ọ̀rọ̀ kan tí ó sọ ìgbọ́ràn ní pàtó. “Fetí sí” pa ọ̀rọ̀ orísun àti ìfàsẹ́yìn inú rẹ̀ mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àyíká hàn.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Dá wọn lóhùn pé” jẹ́ àdánidá ju ṣíṣe àdàkọ ‘dáhùn, ó sì sọ’ lọ; “Ẹ fúnra yín ṣe ìdájọ́” pa ìpè taara sí àwọn olùgbọ́ mọ́.
