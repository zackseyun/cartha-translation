id: ACT.4.25
reference: Acts 4:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: yo
  text: 'ẹni tí ó[a], tipasẹ̀ Ẹ̀mí Mímọ́, fi ẹnu Dáfídì ìránṣẹ́ rẹ sọ pé: “Èé ṣe tí àwọn orílẹ̀-èdè fi ru gùdù, tí àwọn ènìyàn sì fi pète[b] ohun asán?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan kà á sí “Dáfídì baba wa, ìránṣẹ́ rẹ,” tó mú kí ọ̀rọ̀ ìṣáájú náà jẹ́: “ẹni tí ó tipasẹ̀ Ẹ̀mí Mímọ́ fi ẹnu Dáfídì baba wa, ìránṣẹ́ rẹ, sọ pé.”'
    reason: textual_variant
  - marker: b
    text: Tàbí “ronú jinlẹ̀ lórí ohun asán.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríronú jinlẹ̀, ṣùgbọ́n nínú àyíká yìí ó tún lè túmọ̀ sí ṣíṣe ète.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: ẹni tí ó
  rationale: Ó so gbólóhùn náà mọ́ Ọlọ́run tí a ń bá sọ̀rọ̀ ní ẹsẹ 24. Gbólóhùn ‘baba wa’ jẹ́ ọ̀rọ̀ tí àwọn ẹ̀dà ìwé àtijọ́ yà síra lé lórí, nítorí náà a fi sí àlàyé ìsàlẹ̀.
- source_word: διὰ πνεύματος ἁγίου
  choice: tipasẹ̀ Ẹ̀mí Mímọ́
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive ń tọ́ka sí ohun èlò tàbí aṣojú; ‘tipasẹ̀’ pa ìtumọ̀ yẹn mọ́.
- source_word: στόματος Δαυὶδ
  choice: fi ẹnu Dáfídì
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé Ọlọ́run sọ̀rọ̀ nípasẹ̀ Dáfídì, ó sì jẹ́ èdè Yorùbá tí ó ṣeé lóye.
- source_word: παιδός σου
  choice: ìránṣẹ́ rẹ
  rationale: παῖς lè túmọ̀ sí ọmọ tàbí ìránṣẹ́; nípa Dáfídì nínú ọ̀rọ̀ àsọtẹ́lẹ̀ yìí, ‘ìránṣẹ́’ ni ó bá àyíká mu jù.
- source_word: εἰπών
  choice: sọ pé
  rationale: Participle aorist náà ń ṣí ọ̀rọ̀ àyọlò sílẹ̀; fífi í ṣe ọ̀rọ̀-ìṣe kíkún jẹ́ èdè Yorùbá àdánidá.
- source_word: Ἱνατί
  choice: Èé ṣe
  rationale: Ìbéèrè tààrà ni; ‘Èé ṣe’ jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ìdí.
- source_word: ἐφρύαξαν
  choice: ń ru gùdù
  rationale: Ọ̀rọ̀ náà ń fi ìrúkèrúdò àti ìṣọ̀tẹ̀ alágídí hàn. ‘Ru gùdù’ mú agbára àwòrán náà jáde.
- source_word: ἔθνη
  choice: àwọn orílẹ̀-èdè
  rationale: Ó tọ́ka sí àwọn orílẹ̀-èdè lápapọ̀ nínú Sáàmù, kì í ṣe àwọn Kèfèrí gẹ́gẹ́ bí ẹ̀ka ẹ̀sìn nìkan.
- source_word: λαοὶ
  choice: àwọn ènìyàn
  rationale: Ó pa ìfararọ̀ Sáàmù mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá kì í sábà fi àmi ọ̀pọ̀ sí orúkọ ‘ènìyàn’ fúnra rẹ̀.
- source_word: ἐμελέτησαν
  choice: ń pète
  rationale: Bí ó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ‘ronú jinlẹ̀,’ àyíká ìṣọ̀tẹ̀ yìí ń tọ́ka sí ṣíṣe ète.
- source_word: κενά
  choice: ohun asán
  rationale: Ó fi òfo àti àìní èso àwọn ète náà hàn ní èdè Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀ ìṣáájú àyọlò nínú àwọn ẹ̀dà ìwé
  choice: A kò fi ‘baba wa’ sínú ọ̀rọ̀ pàtàkì; a túmọ̀ ìsopọ̀ náà sí ‘ẹni tí ó’ a sì tọ́ka sí àyípadà náà ní àlàyé ìsàlẹ̀.
  alternative: Kí a ka a sí ‘Dáfídì baba wa, ìránṣẹ́ rẹ,’ tàbí ‘nípasẹ̀ ẹnu Dáfídì baba wa, ìránṣẹ́ rẹ.’
  rationale: Ọ̀rọ̀ τοῦ πατρὸς ἡμῶν kò dúró bákan náà nínú gbogbo ẹ̀dà, ó sì nira nínú ìṣètò SBLGNT. Ìtumọ̀ yìí kò fi ìpinnu tí kò dájú lé òǹkàwé lórí, ṣùgbọ́n ó pa ẹ̀rí àyípadà náà mọ́ ní àlàyé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè àdánidá. A lo ‘tipasẹ̀’ àti ‘fi ẹnu Dáfídì’ láti pa ìlànà aṣojú méjèèjì mọ́. Àmi [a] wà lẹ́yìn gbogbo àyọlò nítorí ó ṣàlàyé ìṣáájú gbólóhùn náà; [b] tẹ̀ lé ọ̀rọ̀ tí ó ní àṣàyàn ìtumọ̀.
