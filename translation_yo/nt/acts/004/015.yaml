  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí wọ́n pàṣẹ fún wọn pé kí wọ́n jáde kúrò níwájú ìgbìmọ̀ náà[a], wọ́n ń jíròrò láàárín ara wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n jáde kúrò níbi ìpàdé Sànhẹ́dírìnì.” Ọ̀rọ̀ Gíríìkì náà, συνέδριον, lè tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù tàbí sí ìpàdé tí ìgbìmọ̀ náà ń ṣe.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń bá ara wọn sọ̀rọ̀” tàbí “wọ́n ń gbèrò pọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: lẹ́yìn tí wọ́n pàṣẹ
  rationale: Ọ̀rọ̀ alábápín aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; ọ̀nà yìí sì jẹ́ Yorùbá àdánidá tí ó pa agbára àṣẹ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn nínú ìtàn, láti ọ̀rọ̀ ní gbangba sí ìjíròrò ìkọ̀kọ̀ ti ìgbìmọ̀.
- source_word: αὐτοὺς
  choice: wọn
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Peteru àti Johanu, kò sì pọn dandan láti tún orúkọ wọn sọ.
- source_word: ἔξω τοῦ συνεδρίου
  choice: jáde kúrò níwájú ìgbìmọ̀ náà
  rationale: Gbólóhùn náà lè túmọ̀ sí pé kí wọ́n kúrò níbi tí ìgbìmọ̀ ti péjọ tàbí níwájú àwọn ọmọ ìgbìmọ̀; yíyan yìí yẹra fún fífi ara kan ṣoṣo lélẹ̀.
- source_word: ἀπελθεῖν
  choice: kí wọ́n jáde
  rationale: Ó pé àṣẹ náà, ó sì bá ἔξω mu ní Yorùbá àdánidá.
- source_word: συνέβαλλον
  choice: wọ́n bẹ̀rẹ̀ sí í jíròrò
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ hàn; nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìfọ̀rọ̀wérọ̀ tàbí ìgbìmọ̀ pọ̀.
- source_word: πρὸς ἀλλήλους
  choice: láàárín ara wọn
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá fún ìjíròrò tí àwọn ènìyàn ń bá ara wọn ṣe.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ìgbìmọ̀” mú ìtumọ̀ συνεδρίου yé òǹkàwé lasán, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àṣàyàn “Sànhẹ́dírìnì” àti àìdánilójú nípa ara ìjọba tàbí ìpàdé rẹ̀ mọ́.
