id: ACT.4.17
reference: Acts 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: yo
  text: Ṣùgbọ́n, kí ọ̀rọ̀ yìí má bàa tàn kálẹ̀ ju bẹ́ẹ̀ lọ láàárín àwọn ènìyàn, ẹ jẹ́ kí a halẹ̀ mọ́ wọn pé kí wọn má tún bá ẹnikẹ́ni sọ̀rọ̀ ní orúkọ yìí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διανεμηθῇ
  choice: tàn kálẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípin tàbí títàn ká; ní àyíká yìí, “tàn kálẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìròyìn tàbí ẹ̀kọ́ náà ń dé ọ̀dọ̀ àwọn ènìyàn púpọ̀ sí i.
- source_word: ἐπὶ πλεῖον
  choice: síwájú
  rationale: 'Ó pa agbára afiwéra náà mọ́: kí ohun tí ó ti bẹ̀rẹ̀ má ṣe tẹ̀ síwájú tàbí gbilẹ̀ ju bí ó ti rí lọ.'
- source_word: λαός
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí gbogbo ará ìlú tàbí àwùjọ ní gbogbogbòò, kì í ṣe ogunlọ́gọ̀ kan pàtó nìkan.
- source_word: ἀπειλησώμεθα
  choice: ẹ jẹ́ kí a halẹ̀ mọ́ wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ìhalẹ̀ hàn, pàápàá láti ọ̀dọ̀ àwọn aláṣẹ. “Halẹ̀ mọ́” jẹ́ Yorùbá àdánidá, ó sì pa agbára ìfipámúni ọ̀rọ̀ náà mọ́.
- source_word: μηκέτι λαλεῖν
  choice: kí wọn má ṣe ... sọ̀rọ̀ mọ́
  rationale: Ó pa ìtumọ̀ ìdálẹ́kun láti àkókò yẹn lọ mọ́, ní Yorùbá tí ó rọrùn láti lóye.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ní orúkọ yìí
  rationale: Ó pa gbólóhùn orísun náà mọ́ láì pinnu bóyá ìtumọ̀ rẹ̀ ní pàtàkì ni ‘nípasẹ̀ àṣẹ orúkọ yìí’ tàbí ‘nípa orúkọ yìí.’
- source_word: μηδενὶ ἀνθρώπων
  choice: ẹnikẹ́ni
  rationale: Ọ̀rọ̀ náà jẹ́ ti gbogbo ènìyàn láìka akọ tàbí abo sí, “ẹnikẹ́ni” sì bá àṣẹ òdì náà mu ní Yorùbá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ἀπειλησώμεθα nínú ìdáhùn ìgbìmọ̀
  choice: halẹ̀ mọ́ wọn
  alternative: kìlọ̀ fún wọn gidigidi
  rationale: Ìṣẹ̀lẹ̀ náà jẹ́ ti ìgbìmọ̀ aláṣẹ tí ń fi ipá dí àwọn aposteli lẹ́nu; nítorí náà, “halẹ̀ mọ́” fi agbára ọ̀rọ̀ Gíríìkì hàn dáadáa ju “kìlọ̀” lasán lọ. Àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó tún lè ní ìrísí ìkìlọ̀ líle láti ọ̀dọ̀ aláṣẹ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Ọ̀rọ̀ yìí” jẹ́ kókó-ọrọ̀ tí àyíká fí hàn fún ọ̀rọ̀-ìṣe Gíríìkì tí kò sọ kókó-ọrọ̀ náà ní gbangba; ó ń tọ́ka sí ìròyìn tàbí ẹ̀kọ́ nípa iṣẹ́ àwọn aposteli. Gbólóhùn “ní orúkọ yìí” pa ìmọ̀lára ìbátan tàbí àṣẹ orúkọ náà mọ́ láì túmọ̀ rẹ̀ ju ohun tí orísun sọ lọ.
