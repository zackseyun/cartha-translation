id: ACT.4.6
reference: Acts 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: yo
  text: àti Ánásì olórí àlùfáà, àti Káíáfà, àti Jòhánù, àti Alẹkisáńdà, àti gbogbo àwọn tí wọ́n jẹ́ ti ìran olórí àlùfáà[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “tí wọ́n jẹ́ ọmọ ìran olórí àlùfáà” tàbí “tí wọ́n wá láti inú ìran olórí àlùfáà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἅννας
  choice: Ánásì
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń sọ orúkọ Gíríìkì náà ní Yorùbá, láìtumọ̀ ìtumọ̀ orúkọ náà.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Ó pa oyè tí ọ̀rọ̀ Gíríìkì fi fún Ánásì mọ́, láìfi ìtumọ̀ míì kún un nítorí ìbéèrè nípa ẹni tó ń ṣe iṣẹ́ náà ní àkókò yẹn.
- source_word: Καϊάφας
  choice: Káíáfà
  rationale: Ìkọ orúkọ ẹni náà ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún orúkọ náà, ó sì bá ìṣe ìkọ orúkọ Bíbélì mu.
- source_word: Ἀλέξανδρος
  choice: Alẹkisáńdà
  rationale: Ìkọ orúkọ Gíríìkì náà ní ọ̀nà tí òǹkà Yorùbá lè ka ní ìrọ̀rùn.
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Ó sọ ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní Yorùbá àdánidá.
- source_word: ἦσαν
  choice: wọ́n jẹ́
  rationale: Ìṣe àtẹ̀yìnwá εἰμί ni a sọ ní ọ̀nà Yorùbá tó bá àkójọ àwọn ẹni náà mu.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: jẹ́ ara ìdílé àwọn olórí àlùfáà
  rationale: γένος lè túmọ̀ sí ìdílé tàbí ìran; gbólóhùn yìí fi hàn pé àwọn náà jẹ́ ọmọ ẹgbẹ́ ìdílé tàbí ìran tó ní ìbáṣepọ̀ pẹ̀lú ipò olórí àlùfáà, kì í ṣe pé gbogbo wọn ń di oyè náà mú.
theological_decisions:
- issue: Pípe Ánásì ní “olórí àlùfáà” bó tilẹ̀ jẹ́ pé ìbéèrè ìtàn wà nípa ẹni tó di ipò náà mú nígbà yẹn
  choice: 'A pa oyè inú ẹsẹ náà mọ́ tààrà: “Ánásì olórí àlùfáà.”'
  alternative: “Ánásì, ẹni tó ti jẹ́ olórí àlùfáà tẹ́lẹ̀” tàbí “Ánásì, àlùfáà àgbà”
  rationale: Ọ̀rọ̀ Gíríìkì pe Ánásì ní ὁ ἀρχιερεύς ní tààrà. Kí ìtumọ̀ má bàa mú ìforígbárí ìtàn kúrò tàbí fi àlàyé tí kò sí nínú ẹsẹ náà kún un, a pa oyè náà mọ́ gẹ́gẹ́ bí a ti kọ ọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣe kedere fún òǹkà gbogbogbò. A tún “àti” ṣe gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń tò àwọn orúkọ náà, a sì fi àmì ohùn sí ibi tí ó bá èdè Yorùbá mu.
