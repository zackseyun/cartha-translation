id: ACT.4.29
reference: Acts 4:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: yo
  text: Nísinsìnyí, Olúwa, kíyè sí àwọn ìhalẹ̀ wọn, kí o sì fún àwọn ìránṣẹ́ rẹ[a] láti fi gbogbo ìgboyà sọ ọ̀rọ̀ rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹrú rẹ.” Ọ̀rọ̀ Gíríìkì doulos lè tọ́ka sí ẹni tí ó jẹ́ ti ọ̀gá kan. A lo “ìránṣẹ́” níbí nítorí pé àyíká àdúrà náà tẹnumọ́ iṣẹ́ ìsìn onírẹ̀lẹ̀ sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Nísinsìnyí
  rationale: Gbólóhùn yìí ń yí àdúrà náà láti inú àyọlò Ìwé Mímọ́ sí ohun tí ó ń ṣẹlẹ̀ ní àkókò náà. ‘Nísinsìnyí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ní báyìí’ tàbí ‘gẹ́gẹ́ bí ọ̀ràn ṣe rí nísinsìnyí’; kò pọn dandan láti túmọ̀ καί lọ́tọ̀ níbi yìí.
- source_word: κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè tààrà sí Ọlọ́run nínú àdúrà ni; ‘Olúwa’ bá ìforúkọsílẹ̀ ọ̀wọ̀ àti ìlò Majẹmu Tuntun mu.
- source_word: ἔπιδε ἐπὶ
  choice: kíyè sí
  rationale: Àṣẹ ẹ̀bẹ̀ ni pé kí Ọlọ́run wo ohun náà, kí ó sì fiyè sí i. ‘Kíyè sí’ jẹ́ àdánidá ní Yorùbá, ó sì pa èrò pé kí Ọlọ́run yí ojú sí ìhalẹ̀ náà mọ́.
- source_word: ἀπειλὰς
  choice: àwọn ìhalẹ̀
  rationale: Ó túmọ̀ nọ́ńbà ọ̀pọ̀ orúkọ náà ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀.
- source_word: δὸς
  choice: fún
  rationale: Ìtumọ̀ pàtàkì rẹ̀ ni ‘fún’; pẹ̀lú àpólà ‘láti máa … sọ,’ ó ń fi ẹ̀bẹ̀ fún agbára tàbí ààyè láti ṣe ohun kan hàn ní Yorùbá àdánidá.
- source_word: τοῖς δούλοις σου
  choice: àwọn ìránṣẹ́ rẹ
  rationale: Nínú àdúrà yìí, ọ̀rọ̀ náà ń tẹnumọ́ pé wọ́n jẹ́ ti Ọlọ́run, wọ́n sì ń sìn ín. ‘Àwọn ìránṣẹ́ rẹ’ jẹ́ àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ líle sí i ti δοῦλος mọ́.
- source_word: μετὰ παρρησίας πάσης
  choice: fi gbogbo ìgboyà
  rationale: παρρησία níbí ni ọ̀rọ̀ sísọ ní gbangba láìbẹ̀rù; ‘gbogbo’ pa agbára πάσης mọ́.
- source_word: λαλεῖν
  choice: láti máa … sọ
  rationale: Ó jẹ́ ọ̀rọ̀-àìṣe tí ó sinmi lé ‘fún,’ ó sì sọ ohun tí wọ́n ń bẹ Ọlọ́run pé kí ó mú wọn lágbára láti ṣe. ‘Sọ’ kò fi ìtumọ̀ ‘kéde’ tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: τὸν λόγον σου
  choice: ọ̀rọ̀ rẹ
  rationale: Ó pa àwòrán àti ìró ẹ̀kọ́ ìgbàgbọ́ ti ‘ọ̀rọ̀ Ọlọ́run’ mọ́, láìfi ‘ìhìn rere’ tàbí ‘iṣẹ́’ tí ó túmọ̀ sí i sí i.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nígbà tí a ń sọ nípa ìbáṣepọ̀ pẹ̀lú Ọlọ́run
  choice: àwọn ìránṣẹ́ rẹ
  alternative: àwọn ẹrú rẹ; àwọn ẹrú iṣẹ́ rẹ
  rationale: Àyíká àdúrà náà tẹnumọ́ ìrẹ̀lẹ̀, jíjẹ́ ti Ọlọ́run, àti iṣẹ́ ìsìn. ‘Ìránṣẹ́’ jẹ́ èdè Yorùbá àdánidá fún àyíká yìí, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ìtumọ̀ jíjẹ́ ohun ìní ọ̀gá kan má bàjẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá fún àdúrà. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún èdè ìjọ kan pàtó tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
