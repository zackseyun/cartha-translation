id: ACT.4.1
reference: Acts 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: yo
  text: Bí wọ́n ti ń bá àwọn ènìyàn sọ̀rọ̀, àwọn àlùfáà, olórí ẹ̀ṣọ́ tẹ́ńpìlì[b] àti àwọn Sadusí sì dé bá wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘wọ́n súnmọ́ wọn’ tàbí ‘wọ́n dé sí ọ̀dọ̀ wọn.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí dídé lójijì tàbí sísúnmọ́; àyíká ọ̀rọ̀ fi hàn pé àwọn aláṣẹ dá ọ̀rọ̀ wọn dúró.
    reason: lexical_alternative
  - marker: b
    text: ‘Olórí ẹ̀ṣọ́ tẹ́ńpìlì’ ni òṣìṣẹ́ tó ń bójú tó ètò àti ààbò ní agbègbè tẹ́ńpìlì.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Bí wọ́n ti ń ... sọ̀rọ̀ ... sì
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ genitive absolute tí ó ń fi àkókò hàn; ‘Bí wọ́n ti ń’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìṣẹ̀lẹ̀ kejì ṣẹlẹ̀ nígbà tí wọ́n ń sọ̀rọ̀. ‘sì’ ń gbé ipa ìtẹ̀síwájú ìtàn tí δέ ní.
- source_word: πρὸς τὸν λαὸν
  choice: bá àwọn ènìyàn sọ̀rọ̀
  rationale: Ní Yorùbá, ‘bá ... sọ̀rọ̀’ ni ọ̀nà àdánidá fún sísọ̀rọ̀ sí àwọn ènìyàn; ‘àwọn ènìyàn’ pa ìtumọ̀ λαός mọ́ láì fi ‘ogunlọ́gọ̀’ kún un.
- source_word: ἐπέστησαν αὐτοῖς
  choice: dé bá wọn
  rationale: ‘Dé bá wọn’ lè túmọ̀ sí wíwá síbi tí wọ́n wà tàbí sísúnmọ́ wọn, ó sì yẹra fún fífi ìtumọ̀ ìkọlù tàbí ìdojúkọ tí ọ̀rọ̀ Gíríìkì kò fi dandan sọ kún un.
- source_word: οἱ ἱερεῖς
  choice: àwọn àlùfáà
  rationale: Gíríìkì sọ ‘àwọn àlùfáà,’ kì í ṣe ‘àwọn olórí àlùfáà’; ìtumọ̀ yìí pa ìyàtọ̀ ipò náà mọ́.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: olórí ẹ̀ṣọ́ tẹ́ńpìlì
  rationale: στρατηγός níhìn-ín tọ́ka sí ọ̀gá tó ń bójú tó ètò àti ààbò ní agbègbè tẹ́ńpìlì. Ọ̀rọ̀ yìí ṣe kedere ní Yorùbá, nígbà tí àlàyé ìṣe ipò náà wà nínú àlàyé ìsàlẹ̀.
- source_word: οἱ Σαδδουκαῖοι
  choice: àwọn Sadusí
  rationale: ‘Sadusí’ ni àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní ìbámu pẹ̀lú ìró Yorùbá.
theological_decisions:
- issue: Bóyá dídé àwọn aláṣẹ náà ní ìtumọ̀ ìdojúkọ tàbí ìṣọ̀tá nínú ọ̀rọ̀ náà fúnra rẹ̀
  choice: dé bá wọn
  alternative: dojú kọ wọ́n
  rationale: Àyíká tó tẹ̀ lé e fi àtakò hàn, ṣùgbọ́n ἐπέστησαν fúnra rẹ̀ lè sọ dídé tàbí sísúnmọ́. Ìtumọ̀ aláìṣègbè yìí pa ìfọ̀kànbalẹ̀ àti ìnira ìtàn náà mọ́ láì kọjá ẹ̀rí ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá bá èdè mu. A gbe àmì [b] lẹ́gbẹ̀ẹ́ ọ̀rọ̀ ipò tí ó ń ṣàlàyé, a sì gbe [a] lẹ́yìn ‘dé bá wọn,’ nítorí pé àwọn àlàyé tí a pèsè ní Gẹ̀ẹ́sì dà bí ẹni pé a pààrọ̀ àwọn àmì wọn.
