id: ACT.4.2
reference: Acts 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: yo
  text: Inú bí wọn gidigidi nítorí àwọn méjèèjì ń kọ́ àwọn ènìyàn, wọ́n sì ń kéde àjíǹde kúrò láàárín àwọn òkú nínú Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń kéde àjíǹde kúrò láàárín àwọn òkú ní ti ọ̀ràn Jésù.” Gbólóhùn Gíríìkì náà, “nínú Jésù,” lè tọ́ka ní pàtó sí àjíǹde gẹ́gẹ́ bí a ti fihàn nínú ìjíǹde Jésù fúnra rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: Inú bí wọn gidigidi
  rationale: Ọ̀rọ̀ náà ń fi ìbínú tàbí ìdààmú ọkàn líle hàn. ‘Inú bí wọn gidigidi’ jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di ohun tó le jù.
- source_word: διὰ τὸ διδάσκειν
  choice: nítorí pé ... ń kọ́
  rationale: διά pẹ̀lú infinitive tó ní article ń sọ ìdí; gbólóhùn ‘nítorí pé’ mú ìtumọ̀ ìdí náà jáde ní Yorùbá àdánidá.
- source_word: αὐτοὺς
  choice: àwọn méjèèjì
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Pétérù àti Jòhánù nínú àyíká ọ̀rọ̀ tó ṣáájú. ‘Àwọn méjèèjì’ mú ìtọ́kasí náà ṣe kedere láì pe wọn ní ‘àwọn aposteli,’ ohun tí ẹsẹ yìí fúnra rẹ̀ kò sọ.
- source_word: τὸν λαὸν
  choice: àwọn ènìyàn
  rationale: λαός ń tọ́ka sí àwọn ènìyàn gẹ́gẹ́ bí àwùjọ, kì í ṣe ogunlọ́gọ̀ aláìlétò nìkan.
- source_word: καταγγέλλειν
  choice: ń kéde
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pípolongo ohun kan ní gbangba; ‘kéde’ bá ìlò náà mu ní èdè Yorùbá òde òní.
- source_word: ἐν τῷ Ἰησοῦ
  choice: nínú Jésù
  rationale: 'Ìtumọ̀ tààrà yìí pa àyè sílẹ̀ fún àwọn ìtumọ̀ tó ṣeé ṣe: àjíǹde tí a fi hàn nínú Jésù, èyí tó dá lé ọ̀ràn Jésù, tàbí èyí tó ní Jésù gẹ́gẹ́ bí àárín rẹ̀.'
- source_word: ἀνάστασιν
  choice: àjíǹde
  rationale: ‘Àjíǹde’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún jíjí dìde padà sí ìyè, ó sì bójú mu fún òṣùwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà.
- source_word: τὴν ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ìtumọ̀ yìí mú ἐκ àti ọ̀pọ̀ νεκρῶν jáde gẹ́gẹ́ bí jíjí dìde kúrò láàárín àwọn tí ó kú, dípò gbolohun tí ó lè dà bí ẹni pé ‘òkú’ jẹ́ ipò àfojúrí nìkan.
theological_decisions:
- issue: Ìtumọ̀ ἐν τῷ Ἰησοῦ ní ìbáṣepọ̀ pẹ̀lú ìkéde àjíǹde
  choice: A túmọ̀ ọ́ sí ‘nínú Jésù,’ kí ìṣípayá, ìfọkànsí, tàbí ìfihàn àjíǹde nínú Jésù lè dúró láì pinnu ọ̀kan ṣoṣo.
  alternative: ‘nípa Jésù’ tàbí ‘ní ti ọ̀ràn Jésù’
  rationale: ἐν lè ní àwọn ìtumọ̀ tó sún mọ́ra níbí. Fífi ‘nínú Jésù’ sí ọ̀rọ̀ pàtàkì pa àìdánilójú gidi ti Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ míì hàn.
- issue: Ìwọ̀n ìtọ́kasí ‘àjíǹde kúrò láàárín àwọn òkú’
  choice: Ọ̀rọ̀ náà lè tọ́ka sí àjíǹde Jésù fúnra rẹ̀, ó sì tún lè tọ́ka sí ìkéde àjíǹde gbogbogbò tí àjíǹde rẹ̀ fi hàn.
  alternative: Kí a fi mọ́ àjíǹde Jésù nìkan tàbí àjíǹde ìkẹyìn nìkan
  rationale: Ọ̀rọ̀ Lúùkù kò fi dandan yan ọ̀kan lára àwọn ìtọ́kasí wọ̀nyí; ìtumọ̀ náà kò dín ààyè rẹ̀ kù.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá. A lo ‘àwọn méjèèjì’ láti so ẹsẹ náà mọ́ Pétérù àti Jòhánù nínú àyíká rẹ̀; a sì pa ‘nínú Jésù’ mọ́ láti má ṣe yanjú àìdánilójú Gíríìkì lákọjá.
