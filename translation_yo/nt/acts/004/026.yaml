id: ACT.4.26
reference: Acts 4:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: yo
  text: Àwọn ọba ayé dìde dúró, àwọn alákòóso sì péjọ pọ̀ lòdì sí Olúwa àti lòdì sí Mèsáyà rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi”; èdè Gíríìkì ní “Kristi rẹ̀,” ìyẹn ni, “Ẹni tí a fi àmì òróró yàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: dìde dúró
  rationale: Ọ̀rọ̀ yìí kò túmọ̀ sí dídúró lásán; nínú àyọlò Sáàmù 2:2, ó fi hàn pé àwọn ọba mọ̀ọ́mọ̀ gbé ara wọn kalẹ̀ fún àtakò. ‘Dìde dúró’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdúró àtakò yìí hàn.
- source_word: βασιλεῖς
  choice: àwọn ọba
  rationale: Orúkọ náà ń tọ́ka pàtó sí àwọn ọba, ó sì pa ìbáradọ́gba ọ̀rọ̀ inú Sáàmù 2 mọ́.
- source_word: τῆς γῆς
  choice: ayé
  rationale: Nínú ọ̀rọ̀ àyọlò yìí, γῆ ní ìtumọ̀ gbígbòòrò sí gbogbo ayé, kì í ṣe ilẹ̀ agbègbè kan ṣoṣo.
- source_word: ἄρχοντες
  choice: àwọn alákòóso
  rationale: ‘Àwọn alákòóso’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere fún àwọn tó ní àṣẹ ìṣàkóso, ó sì bá ‘àwọn ọba’ ṣe àfiwé.
- source_word: συνήχθησαν
  choice: péjọ pọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìrísí àìṣe, ‘péjọ pọ̀’ ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ pé a rí wọn papọ̀ ní àpéjọ kan; kò fi olùkójọ tí orísun kò dárúkọ kún ọ̀rọ̀ náà.
- source_word: ἐπὶ τὸ αὐτό
  choice: pọ̀
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí wíwà papọ̀ tàbí ní ibi kan náà; ‘pọ̀’ mú èrò ìfọwọ́sowọ́pọ̀ wọn jáde ní ṣókí.
- source_word: κατὰ
  choice: lòdì sí
  rationale: Àṣesílẹ̀ náà ń fi ìṣọ̀tá àti àtakò hàn ní ibi méjèèjì; ‘lòdì sí’ ni ìtumọ̀ Yorùbá tààrà tó bójú mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Nínú àyọlò Ìwé Mímọ́ yìí, κύριος ń tọ́ka sí Ọlọ́run; ‘Olúwa’ pa ìwọ̀n àti agbára ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- source_word: χριστοῦ
  choice: Mèsáyà
  rationale: Nítorí pé èyí jẹ́ àyọlò Sáàmù 2:2, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi àmì òróró yàn. ‘Mèsáyà’ pa ìpìlẹ̀ àyíká Májẹ̀mú Láéláé mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi ‘Kristi’ àti ìtumọ̀ rẹ̀ hàn.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka padà sí Olúwa, ó sì pa ìbáṣepọ̀ inú ‘Mèsáyà rẹ̀’ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àyọlò Sáàmù 2
  choice: Mèsáyà
  alternative: Kristi; Ẹni tí a fi àmì òróró yàn
  rationale: Níbí, Χριστός jẹ́ oyè ẹni tí Olúwa fi àmì òróró yàn, kì í ṣe orúkọ lásán. ‘Mèsáyà’ jẹ́ kí ìsopọ̀ pẹ̀lú Sáàmù 2 àti ìrètí Mèsáyà hàn, láìpa ‘Kristi’ rẹ́ gẹ́gẹ́ bí ọ̀nà míì tí a lè gbà sọ ọ́.
translation_notes:
  register: A lo èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Dìde dúró’ ń mú ìdúró àtakò jáde, ‘péjọ pọ̀’ sì jẹ́ gbólóhùn àdánidá láìfi olùṣe tí Gíríìkì kò sọ kún un. A fi àmì ohùn sí ibi tí ó yẹ.
