  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: yo
  text: Wọ́n sì gbé ọwọ́ lé wọn[a], wọ́n sì dá wọn dúró lábẹ́ ìṣọ́ títí di ọjọ́ kejì[b], nítorí ìrọ̀lẹ́ ti wọlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n mú wọn.” Àṣà ọ̀rọ̀ Gíríìkì náà ní tààrà ni pé “wọ́n gbé ọwọ́ lé wọn,” ṣùgbọ́n nínú àyíká ìbínú yìí ó túmọ̀ sí mímú wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi wọ́n sínú àtìmọ́lé” tàbí “wọ́n fi wọ́n sábẹ́ ìṣọ́.” Ọ̀rọ̀ Gíríìkì náà sọ pé wọ́n dá wọn dúró ní ìkáwọ́, ṣùgbọ́n kò sọ irú ibi tí wọ́n fi wọ́n sí ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: fi ọwọ́ mú wọn
  rationale: Àṣà ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà pé wọ́n gbé ọwọ́ lé wọn, ṣùgbọ́n nínú ipò ọ̀tá àti òfin yìí ó ń sọ nípa mímú wọn. “Fi ọwọ́ mú wọn” pa àwòrán ọwọ́ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí Peteru àti Johanu; “wọn” bá gbólóhùn náà mu ní Yorùbá.
- source_word: ἔθεντο εἰς τήρησιν
  choice: fi wọ́n sábẹ́ àbójútó
  rationale: τήρησις ń tọ́ka sí dídá ènìyàn dúró lábẹ́ ìṣọ́ tàbí àbójútó. Yíyan yìí kò fi kún un pé wọ́n fi wọn sínú ilé ẹ̀wọ̀n pàtó.
- source_word: εἰς τὴν αὔριον
  choice: títí di ọjọ́ kejì
  rationale: Gbólóhùn náà jẹ́ ti àkókò, ó sì túmọ̀ sí pé àtìmọ́lé náà lọ títí di ọjọ́ tí ó tẹ̀ lé e.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: nítorí ó ti di ìrọ̀lẹ́
  rationale: Èyí sọ ìdí tí wọ́n fi dá wọn dúró títí di ọjọ́ kejì, ó sì pa ìtọ́kasí Gíríìkì sí ìrọ̀lẹ́ mọ́ láì túmọ̀ rẹ̀ sí “ó ti pẹ́” nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A pa àwòrán àṣà ọ̀rọ̀ Gíríìkì mọ́ nínú “fi ọwọ́ mú,” nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ ń fi ìtumọ̀ rẹ̀ hàn.
