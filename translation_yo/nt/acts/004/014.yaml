  source_fidelity: 'Ìtumọ̀ náà fi àwọn ẹ̀yà pàtàkì Gíríìkì náà hàn dáadáa: ọkùnrin kan pàtó, ẹni tí a ti mú lára dá, wà ní ipò dídúró pẹ̀lú àwọn aposteli, àti pé àwọn olórí náà kò ní ìdáhùn ìtakò. Síbẹ̀, aṣojú náà “lòdì sí i” nínú ìtumọ̀ àkọ́kọ́ lè dà bí ẹni pé wọ́n ń tako ọkùnrin tí a mú lára dá, nígbà tí ἀντειπεῖν kò sọ ohun tàbí ẹni tí a ń tako ní kedere.'
