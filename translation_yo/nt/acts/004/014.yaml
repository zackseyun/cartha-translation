  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: yo
  text: Nígbà tí wọ́n sì rí ọkùnrin tí a ti mú lára dá náà tí ó dúró pẹ̀lú wọn, wọn kò ní ohun kankan láti sọ láti tako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò lè sọ ohunkóhun lòdì sí i”; tàbí, “wọn kò ní ohunkóhun láti fi tako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: sì
  rationale: Patikulu náà so gbólóhùn yìí mọ́ ìtàn tó ṣáájú; “sì” jẹ́ àsopọ̀ àdánidá ní Yorùbá láìfi ìtumọ̀ tí kò sí kún un.
- source_word: ἄνθρωπον
  choice: ọkùnrin
  rationale: Ó tọ́ka sí ọkùnrin kan pàtó tí a mú lára dá nínú àyíká ọ̀rọ̀ náà.
- source_word: βλέποντες
  choice: nígbà tí wọ́n rí
  rationale: Ó fi hàn pé rírí náà ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú àìní ohun tí wọn yóò sọ; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá.
- source_word: σὺν αὐτοῖς
  choice: pẹ̀lú wọn
  rationale: Ó túmọ̀ sí pé ọkùnrin náà wà ní ẹgbẹ́ wọn.
- source_word: ἑστῶτα
  choice: dúró
  rationale: Perfect participle náà ṣàpèjúwe ọkùnrin náà gẹ́gẹ́ bí ẹni tó wà ní ipò dídúró.
- source_word: τεθεραπευμένον
  choice: tí a ti mú lára dá
  rationale: Ó pa ohùn àìṣe mọ́, ó sì fi ìwòsàn tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì dúró hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: οὐδὲν
  choice: kò ní ohunkóhun
  rationale: Ó sọ àìsí ohun kankan pátápátá tí wọn lè fi dáhùn.
- source_word: εἶχον ἀντειπεῖν
  choice: kò ní ohunkóhun láti sọ lòdì sí i
  rationale: Ó pa agbára ìtakò inú ἀντειπεῖν mọ́, nígbà tí ó tún jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere; àfikún ẹsẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ tó ṣeé ṣe míì mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àjùmọ̀lò, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Mú lára dá” jẹ́ ọ̀rọ̀ ìwòsàn tó wọ́pọ̀, tí kò ní ìró ìṣègùn àkànṣe.
