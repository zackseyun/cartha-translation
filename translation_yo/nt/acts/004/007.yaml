id: ACT.4.7
reference: Acts 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: yo
  text: Nígbà tí wọ́n sì mú wọn dúró ní àárín[a], wọ́n bẹ̀rẹ̀ sí í béèrè pé, “Nípa agbára wo, tàbí ní orúkọ wo ni ẹ̀yin fi ṣe èyí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń béèrè” tàbí “wọ́n wádìí lọ́wọ́ wọn.” Fíìlì Gíríìkì náà lè tẹnumọ́ pé ìbéèrè náà ń bá a lọ dípò pé ó ń tọ́ka sí ìbẹ̀rẹ̀ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: Nígbà tí wọ́n sì mú wọn dúró
  rationale: Aorist participle náà ṣàpèjúwe ohun tí wọ́n ṣe ṣáájú ìbéèrè náà. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú àkókò mọ́.
- source_word: ἐν τῷ μέσῳ
  choice: ní àárín
  rationale: Èyí túmọ̀ sí pé wọ́n gbé àwọn aposteli náà sí àárín ìpéjọ, láì túmọ̀ ọ́ lọ́nà tí ó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐπυνθάνοντο
  choice: wọ́n bẹ̀rẹ̀ sí í béèrè
  rationale: Imperfect náà lè fi ìbẹ̀rẹ̀ tàbí ìtẹ̀síwájú ìbéèrè hàn. Àṣàyàn yìí tẹ̀ lé ìtumọ̀ inceptive, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn ongoing pamọ́.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Nípa agbára wo
  rationale: “Agbára” jẹ́ ìbámu taara fún δύναμις, “nípa” sì mú ipa ohun èlò tí ἐν ní níbí jáde ní Yorùbá àdánidá.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: tàbí ní orúkọ wo
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì ti ṣíṣe ohun kan “ní orúkọ” ẹnì kan mọ́, èyí tí ó lè ní ìtumọ̀ aṣojú àti àṣẹ.
- source_word: ἐποιήσατε τοῦτο
  choice: ni ... fi ṣe èyí
  rationale: Ó fi aorist náà hàn gẹ́gẹ́ bí ìṣe tí ó ti ṣẹlẹ̀, ó sì jẹ́ kí “èyí” tọ́ka sí ìwòsàn tàbí àmì náà láì fi àlàyé kún ọ̀rọ̀.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́; “ẹ̀yin” mú ìtẹnumọ́ yẹn hàn ní Yorùbá.
theological_decisions:
- issue: Bóyá a ó túmọ̀ δύναμις sí “agbára” tàbí kí a ṣàlàyé rẹ̀ sí “àṣẹ”
  choice: agbára
  alternative: àṣẹ
  rationale: δύναμις sábà túmọ̀ sí “agbára,” nígbà tí gbólóhùn kejì, “ní orúkọ wo,” ti lè gbé èrò aṣojú tàbí àṣẹ. “Agbára” pa ìyàtọ̀ inú ìbéèrè Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè àdánidá ni a lò. A pa àwòrán ìgbẹ́jọ́ “ní àárín” mọ́, a sì lò “ẹ̀yin” láti fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn.
