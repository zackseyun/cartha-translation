  edition: SBLGNT
  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: yo
  text: láti ṣe gbogbo ohun tí ọwọ́ rẹ àti ète rẹ ti pinnu tẹ́lẹ̀ pé yóò ṣẹlẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti pinnu ṣáájú” tàbí “ti yàn tẹ́lẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń fi ìpinnu tí a ṣe ṣáájú hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: láti ṣe
  rationale: Aorist infinitive náà ń tẹ̀ síwájú láti inú àyíká ọ̀rọ̀ tó ṣáájú; ‘láti ṣe’ jẹ́ ìtumọ̀ tààrà, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ neuter plural yìí ní ìtumọ̀ tó gbòòrò; ‘gbogbo ohun tí’ mú ìpéye àti àpapọ̀ rẹ̀ jáde lọ́nà àdánidá.
- source_word: χείρ
  choice: ọwọ́
  rationale: Ìtumọ̀ gangan ni ‘ọwọ́.’ Bí ó tilẹ̀ jẹ́ àpẹẹrẹ fún agbára tàbí iṣẹ́ Ọlọ́run níbí, pípa àwòrán Bíbélì náà mọ́ kò fi ìtumọ̀ ẹ̀kọ́ kan lé e lórí.
- source_word: βουλή
  choice: ète
  rationale: βουλή tọ́ka sí ìrònú tàbí ìpinnu tí a mọ̀ọ́mọ̀ gbé kalẹ̀. ‘Ète’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì mú ìmọ̀lára èrò àti ìdí tí a pinnu jáde.
- source_word: προώρισεν
  choice: ti pinnu tẹ́lẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí láti pinnu ohun kan ṣáájú. ‘Ti pinnu tẹ́lẹ̀’ pa agbára àti àkókò ṣáájú inú Gíríìkì mọ́, láìfi èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
- source_word: γενέσθαι
  choice: pé kí ó ṣẹlẹ̀
  rationale: Infinitive γίνομαι níbí ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ tó wáyé. ‘Pé kí ó ṣẹlẹ̀’ jẹ́ Yorùbá òde òní tó bá àkópọ̀ gírámà pẹ̀lú ‘pinnu tẹ́lẹ̀’ mu.
theological_decisions:
- issue: Ìtumọ̀ προώρισεν ní àyíká ọ̀rọ̀ nípa ọba aláṣẹ Ọlọ́run àti ojúṣe ènìyàn
  choice: ti pinnu tẹ́lẹ̀
  alternative: ti yàn tẹ́lẹ̀ / ti gbèrò ṣáájú
  rationale: Gíríìkì náà fi ìpinnu ṣáájú hàn ní kedere. Ìtumọ̀ yìí jẹ́ kí gbólóhùn náà dúró lagbara nípa ète Ọlọ́run sí ìjìyà Jésù, ṣùgbọ́n kò gbìyànjú láti yanjú bí ète Ọlọ́run àti ojúṣe àwọn ènìyàn ṣe jọ ń ṣiṣẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àwòrán ‘ọwọ́ rẹ’ mọ́ gẹ́gẹ́ bí àṣà ọ̀rọ̀ Bíbélì.
