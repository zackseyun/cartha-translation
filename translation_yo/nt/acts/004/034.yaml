  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn èrò pàtàkì inú ọ̀rọ̀ Gíríìkì mọ́: ìtumọ̀ àlàyé àti ìtẹnumọ́ ti γάρ/οὐδέ, àìsí ẹni aláìní, àwọn oní ilẹ̀ tàbí ilé, ìṣe títà àti mímú owó wá tí ń ṣẹlẹ̀ léraléra, àti owó tí a gba nínú ohun tí a tà. Àmọ́, “owó tí wọ́n fi ta ohun tí wọ́n tà” lè túmọ̀ ní kíkún pé owó ni wọ́n lò láti ta ohun náà, tàbí owó tí a fi san; a tún un ṣe kí ó túmọ̀ sí owó tí wọ́n gba fún ohun tí wọ́n tà ní kedere.'
