source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: yo
  text: Nítorí kò tilẹ̀ sí ẹnikẹ́ni aláìní láàárín wọn; nítorí gbogbo àwọn tí wọ́n ní ilẹ̀ tàbí ilé máa ń tà wọ́n, wọ́n sì máa ń mú owó tí wọ́n gba fún ohun tí wọ́n tà wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìye owó àwọn ohun tí wọ́n tà.” Ọ̀rọ̀ Gíríìkì túmọ̀ ní ti gidi sí “àwọn iye owó,” ṣùgbọ́n “owó tí wọ́n gba fún ohun tí wọ́n tà” sọ ìtumọ̀ rẹ̀ ní Yorùbá àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Nítorí kò tilẹ̀
  rationale: “Nítorí” pa ipa àlàyé γάρ mọ́, “kò tilẹ̀” sì fi ìtẹnumọ́ οὐδέ hàn ní Yorùbá àdánidá.
- source_word: ἐνδεής
  choice: aláìní
  rationale: “Aláìní” túmọ̀ sí ẹni tí ohun kò tó fún, láìfi ọ̀rọ̀ náà mọ́ ipò òṣì nípa ọrọ̀ ajé nìkan.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: sí ẹnikẹ́ni ... láàárín wọn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn tó ń sọ pé irú ẹni bẹ́ẹ̀ wà tàbí kò sí nínú ẹgbẹ́ kan.
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Ó kó gbogbo àwọn tó wà nínú ẹ̀ka tí a ṣàpèjúwe jọ, láìsọ ohun tó kọjá ààlà ẹgbẹ́ náà.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: àwọn tí wọ́n ní ilẹ̀ tàbí ilé
  rationale: Ó sọ ìní ilẹ̀ tàbí ilé ní kedere àti ní Yorùbá tí ó rọrùn; “ilẹ̀” lè tọ́ka sí pápá tàbí abala ilẹ̀ gẹ́gẹ́ bí χωρίον.
- source_word: πωλοῦντες ἔφερον
  choice: máa ń tà wọ́n, wọ́n sì máa ń mú ... wá
  rationale: Àtúnsọ “máa ń” fi ìṣe àṣà tàbí ìṣe tí ń ṣẹlẹ̀ léraléra tí imperfect ἔφερον ń tọ́ka sí hàn, ó sì so participle πωλοῦντες mọ́ ọ̀nà Yorùbá tó dán mọ́rán.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: owó tí wọ́n fi ta ohun tí wọ́n tà
  rationale: Ní àyíká yìí, “owó tí wọ́n fi ta” jẹ́ ọ̀nà Yorùbá àdánidá fún iye owó tí títà mú wá, bó tilẹ̀ jẹ́ pé τιμάς túmọ̀ ní ti gidi sí “iye owó.”
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń sọ pé gbogbo ẹni tó ní ohun-ìní tà á ní ẹ̀ẹ̀kan ṣoṣo
  choice: Lo “gbogbo àwọn tí wọ́n ní ... máa ń tà” láti fi ìṣe ẹgbẹ́ àwọn onílé tàbí onílẹ̀ hàn gẹ́gẹ́ bí ìṣe tí ń ṣẹlẹ̀ léraléra.
  alternative: “Gbogbo wọn ta gbogbo ilẹ̀ àti ilé wọn.”
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ “gbogbo ohun-ìní wọn,” kò sì yẹ kí a sọ ọ́ di àṣẹ pé gbogbo ọmọ ìjọ ta gbogbo ohun tí wọ́n ní. Àwọn fọ́ọ̀mù participle àti imperfect fi ìṣe tí ń lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Máa ń” jẹ́ kí ìṣe léraléra hàn; a yẹra fún ọ̀rọ̀ amọ̀-ẹ̀sìn tàbí ìtumọ̀ tó lè sọ pé títà gbogbo ohun-ìní jẹ́ dandan.
