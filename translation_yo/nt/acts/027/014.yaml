  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: yo
  text: Ṣùgbọ́n kò pẹ́ lẹ́yìn náà, ẹ̀fúùfù ìjì líle kan tí a ń pè ní Eúrákúlónì[b][a] já bọ̀ láti erékùṣù náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘Eúróklúdónì’ dípò ‘Eúrákúlónì.’
    reason: textual_variant
  - marker: b
    text: Tàbí, ‘ẹ̀fúùfù líle láti àríwá ìlà-oòrùn’; ó ṣeé ṣe kí orúkọ náà tọ́ka sí ẹ̀fúùfù ìjì láti àríwá ìlà-oòrùn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbé e kalẹ̀ gẹ́gẹ́ bí orúkọ pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: kò pẹ́ lẹ́yìn náà
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní àkókò díẹ̀ lẹ́yìn èyí tó ṣáájú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó lòdì sí ohun tó ń lọ tẹ́lẹ̀ hàn nínú ìtàn.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: bẹ́ sílẹ̀ láti erékùṣù náà
  rationale: Nínú àyíká ọ̀rọ̀, αὐτῆς ṣeé lóye gẹ́gẹ́ bí erékùṣù náà, κατά sì lè tọ́ka sí ibi tí ẹ̀fúùfù náà ti bẹ́ sílẹ̀; èyí yàgò fún ọ̀rọ̀ Yorùbá tí kò ṣe kedere bí ‘kọlu sí i.’
- source_word: ἄνεμος τυφωνικὸς
  choice: ẹ̀fúùfù líle bí ìjì líle
  rationale: Ó mú agbára àti ìwà ìjì yíyí ti τυφωνικός jáde ní èdè Yorùbá tó ṣe kedere, láìfi ẹ̀ka ìmọ̀ ojú-ọjọ́ òde òní kan lé e lórí.
- source_word: ὁ καλούμενος
  choice: tí a ń pè ní
  rationale: Ọ̀nà Yorùbá àdánidá fún fífi orúkọ tàbí àpèjúwe tí a mọ ohun kan sí hàn.
- source_word: Εὐρακύλων
  choice: Ẹurákúlónì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìró tó bá èdè Yorùbá mu dípò kí a túmọ̀ rẹ̀ sí ‘ẹ̀fúùfù àríwá ìlà-oòrùn.’
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa ìtumọ̀ méjì tó ṣeé ṣe fún κατ’ αὐτῆς mọ́ ní ìṣọ́ra, a sì yan ìtọ́kasí sí erékùṣù náà nítorí àyíká ọ̀rọ̀. Àwọn àmì àlàyé [b][a] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn orúkọ tí àwọn àlàyé náà kan.
