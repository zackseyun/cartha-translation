  source_fidelity: Ìtumọ̀ náà mú ìsọ̀rí àsìkò, ìwà ìjì líle, àti fífi orúkọ náà hàn dáadáa. Síbẹ̀, “bẹ́ sílẹ̀ láti erékùṣù náà” kò ṣe kedere gẹ́gẹ́ bí ìṣísẹ̀ ẹ̀fúùfù tí ó sọ̀ kalẹ̀/jáde láti erékùṣù náà. “Já bọ̀ láti erékùṣù náà” jẹ́ ọ̀nà Yorùbá tó ṣe kedere síi fún ìtumọ̀ κατ’ αὐτῆς nínú àyíká Acts 27:14, láìpa ìtọ́kasí erékùṣù náà mọ́.
  naturalness: “Ẹ̀fúùfù líle bí ìjì líle” tún ọ̀rọ̀ “líle” ṣe, ó sì dùn bí ìtúmọ̀-ṣọ̀rọ̀. “Ẹ̀fúùfù ìjì líle” jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn, tó sì bójú mu. A tún ṣàtúnṣe ìkọ̀wé orúkọ náà sí “Eúrákúlónì,” kí ó sún mọ́ ìró Gíríìkì náà dáadáa ní ìlànà òtítọ́ Yorùbá.
  terminology: A pa Εὐρακύλων mọ́ gẹ́gẹ́ bí orúkọ pàtó, a kò túmọ̀ ọ́ sí orúkọ ẹ̀fúùfù. Àlàyé yíyàtọ̀ ìwé àfọwọ́kọ àti àlàyé ìtumọ̀ “ẹ̀fúùfù líle láti àríwá ìlà-oòrùn” wà ní ipò tó tọ́, ó sì bá àwọn àmì [b][a] mu.
