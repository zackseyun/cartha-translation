  terminology: ‘Áńgẹ́lì,’ ‘Ọlọ́run,’ ‘jẹ́ tirẹ̀,’ àti ‘ń sìn’ yẹ fún ìforúkọsílẹ̀ ìtàn ìwé mímọ́ náà. ‘Ń sìn’ pa ìtumọ̀ ìsìn mímọ́ ti λατρεύω mọ́; àlàyé ìsàlẹ̀ ń fúnni ní ‘ń jọ́sìn’ gẹ́gẹ́ bí àṣàyàn.
