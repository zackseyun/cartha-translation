    rationale: Láìsí àmì ìdákẹ́gbẹ́ àti ‘ẹni,’ òǹkàwé kan lè gbà pé ‘tí mo jẹ́ tirẹ̀’ ń tọ́ka sí áńgẹ́lì dípò Ọlọ́run. Gíríìkì náà tọ́ka sí θεός.
