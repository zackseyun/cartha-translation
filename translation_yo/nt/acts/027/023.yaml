revisions:
- from: Nítorí ní òru yìí gan-an, áńgẹ́lì Ọlọ́run tí mo jẹ́ tirẹ̀[a], tí mo sì ń sìn[b], dúró lẹ́gbẹ̀ẹ́ mi.
  to: Nítorí, ní òru yìí gan-an, áńgẹ́lì Ọlọ́run, ẹni tí mo jẹ́ tirẹ̀ tí mo sì tún ń sìn, dúró lẹ́gbẹ̀ẹ́ mi[a][b].
  rationale: A tún gbólóhùn náà ṣe kí àwọn ọ̀rọ̀ ‘ẹni tí mo jẹ́ tirẹ̀’ àti ‘tí mo sì tún ń sìn’ lè tọ́ka sí Ọlọ́run láìsí ìdààmú, gẹ́gẹ́ bí àwọn ọrọ̀ arọ́pọ̀ Gíríìkì ṣe ń ṣe. A fi ‘tún’ kún un láti pa ipa καί mọ́. A tún gbe àwọn àmì àlàyé ìsàlẹ̀ sí òpin gbolóhùn kí wọ́n lè ba àwọn apá méjèèjì tí a ṣàlàyé mu, láìba ìtumọ̀ ẹsẹ náà jẹ́.
