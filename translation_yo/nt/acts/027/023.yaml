  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: yo
  text: Nítorí, ní òru yìí gan-an, áńgẹ́lì Ọlọ́run, ẹni tí mo jẹ́ tirẹ̀ tí mo sì tún ń sìn, dúró lẹ́gbẹ̀ẹ́ mi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹni tí mo jẹ́ tirẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹni tí mo sì tún ń jọ́sìn”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ ìsìn mímọ́ tàbí ìjọsìn tí a ń fi fún Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: dúró lẹ́gbẹ̀ẹ́ mi
  rationale: Ó pa ìtumọ̀ ibi tí áńgẹ́lì náà wà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ṣíṣàlàyé rẹ̀ sí ‘farahàn sí mi’ lọ.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí fún ìgboyà Pọ́ọ̀lù.
- source_word: ταύτῃ τῇ νυκτί
  choice: ní òru yìí gan-an
  rationale: ‘Gan-an’ mú ìtẹnumọ́ àti ìsúnmọ́ àkókò inú gbólóhùn Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: τοῦ θεοῦ
  choice: áńgẹ́lì Ọlọ́run
  rationale: Èyí fi hàn pé áńgẹ́lì náà jẹ́ ti Ọlọ́run, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìsopọ̀ genitive náà.
- source_word: οὗ εἰμι
  choice: tí mo jẹ́ tirẹ̀
  rationale: Ó sún mọ́ ọ̀rọ̀ gangan ‘ẹni tí èmi jẹ́ tirẹ̀,’ ó sì sọ jíjẹ́ ti Ọlọ́run ní kedere láìfi ẹ̀kọ́ míì kún un.
- source_word: ᾧ καὶ λατρεύω
  choice: tí mo sì ń sìn
  rationale: ‘Sìn’ lè túmọ̀ sí iṣẹ́ ìsìn mímọ́ tàbí ìjọsìn sí Ọlọ́run, ó sì pa ìwọ̀n ìtumọ̀ λατρεύω mọ́; àlàyé ìsàlẹ̀ fi ‘jọsìn’ hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: ἄγγελος
  choice: áńgẹ́lì
  rationale: Àyíká ìtàn náà tọ́ka sí aṣojú ọ̀run, kì í ṣe ońṣẹ́ ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ οὗ εἰμι
  choice: tí mo jẹ́ tirẹ̀
  alternative: ẹni tí mo jẹ́ ti
  rationale: Àṣàyàn náà sọ jíjẹ́ ti Ọlọ́run àti ìfaramọ́ Pọ́ọ̀lù ní kedere, láìmú ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ Gíríìkì kò sọ wọlé.
- issue: Ìtumọ̀ λατρεύω
  choice: ń sìn
  alternative: ń jọ́sìn
  rationale: ‘Sìn’ pa ààyè ìtumọ̀ iṣẹ́ ìsìn mímọ́ àti ìjọsìn mọ́. Nítorí ‘jọ́sìn’ náà ṣeé ṣe, a fi sí àlàyé ìsàlẹ̀ kí àìdánilójú ojúlówó má bàa sọnù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. A lo ‘áńgẹ́lì’ gẹ́gẹ́ bí ọ̀rọ̀ tí gbogbo ènìyàn mọ̀, ‘gan-an’ fún ìtẹnumọ́, àti ‘dúró lẹ́gbẹ̀ẹ́ mi’ láti pa àwòrán ibi inú Gíríìkì mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ṣàlàyé.
