  source_fidelity: 'Ìtumọ̀ náà gba gbogbo àwọn ẹ̀yà pàtàkì inú Gíríìkì wọlé: ìsopọ̀ ìdí γάρ, ìtẹnumọ́ àkókò, áńgẹ́lì Ọlọ́run, jíjẹ́ ti Ọlọ́run, iṣẹ́ ìsìn sí i, àti ìdúró lẹ́gbẹ̀ẹ́ Pọ́ọ̀lù. Àtúnṣe náà jẹ́ kí ‘Ọlọ́run’ hàn gbangba gẹ́gẹ́ bí ẹni tí àwọn gbolóhùn ìbátan méjèèjì ń tọ́ka sí, ó sì fi ‘tún’ hàn fún καί.'
