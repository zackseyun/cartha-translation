source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: yo
  text: Nígbà tí ó di alẹ́ kẹrìnlá, bí ìjì ṣe ń lé wa lọ kiri ní Òkun Ádíríà[a], ní nǹkan bí àárín òru, àwọn atukọ̀ bẹ̀rẹ̀ sí í fura pé ilẹ̀ kan ń sún mọ́ wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ayé àtijọ́, orúkọ “Ádíríà” lè tọ́ka sí agbègbè omi tó gbòòrò sí i ní àárín Òkun Mẹditaréníà, kì í ṣe Òkun Ádíríà ti òde òní nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “pé àwọn ń sún mọ́ ilẹ̀ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: ó di alẹ́ kẹrìnlá
  rationale: Ọ̀rọ̀ yìí fi hàn pé alẹ́ kẹrìnlá nínú àkókò ìjì náà ti dé; “ó di” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ dídé àkókò kan.
- source_word: διαφερομένων ἡμῶν
  choice: bí a ti ń gbé wa lọ kiri
  rationale: Ó pa ìṣe tí ó ń bá a lọ àti àìní ìdarí àwọn arìnrìn-àjò mọ́, láìfi “afẹ́fẹ́” kún ọ̀rọ̀ Gíríìkì ní tààrà.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: lórí Òkun Ádíríà
  rationale: Ó jẹ́ orúkọ ilẹ̀-omi tí ó ṣe kedere fún òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ pé ìtumọ̀ rẹ̀ ní ayé àtijọ́ gbòòrò ju Òkun Ádíríà ti òde òní lọ.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: ní nǹkan bí àárín òru
  rationale: “Ní nǹkan bí” pa ìtumọ̀ ìsúnmọ́ àkókò mọ́, dípò kí ó mú un dà bí àkókò gangan pátápátá.
- source_word: ὑπενόουν οἱ ναῦται
  choice: àwọn atukọ̀ bẹ̀rẹ̀ sí í fura
  rationale: “Bẹ̀rẹ̀ sí í” mú ìṣe tí ó ń bẹ̀rẹ̀ tàbí tí ó ń dàgbà nínú imperfect hàn, “fura” sì pa àìdánilójú ọ̀rọ̀ náà mọ́.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: pé àwọn ti ń sún mọ́ ilẹ̀ kan
  rationale: Ìtúmọ̀ yìí jẹ́ Yorùbá àdánidá fún ohun tí àwọn atukọ̀ rí i pé ó ń ṣẹlẹ̀; “ilẹ̀ kan” pa àìmọ̀ pàtó tí τινά fi hàn mọ́. Àlàyé ìsàlẹ̀ ṣàfihàn ìgbékalẹ̀ ọ̀rọ̀ Gíríìkì ní tààrà.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìgbékalẹ̀ gbolohun jẹ́ àdánidá fún òǹkàwé Yorùbá, ṣùgbọ́n àwọn àlàyé ìsàlẹ̀ pa ìtàn ilẹ̀-omi àti ìrísí ọ̀rọ̀ Gíríìkì mọ́.
