id: ACT.27.33
reference: Acts 27:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: yo
  text: Títí di ìgbà tí ọjọ́ fẹ́rẹ̀ẹ́ máa mọ́, Pọ́ọ̀lù ń rọ gbogbo wọn léraléra pé kí wọ́n jẹ oúnjẹ díẹ̀. Ó ní, “Òní ni ọjọ́ kẹrìnlá tí ẹ ti ń dúró ní ìfojúsọ́nà[a] láìjẹun, tí ẹ kò sì tíì jẹ ohunkóhun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ẹ ti ń dúró pẹ̀lú ìdààmú ọkàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí dídúró ní ìfojúsọ́nà; nínú àyíká ìjì yìí, ó lè ní ìmọ̀lára àníyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: Títí di ìgbà tí
  rationale: Ó fi ààlà àkókò hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé ìrọ̀ Pọ́ọ̀lù ń bá a lọ títí ilẹ̀ fi fẹ́rẹ̀ẹ́ mọ́.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: ilẹ̀ fẹ́rẹ̀ẹ́ máa mọ́
  rationale: Èyí sọ ìtumọ̀ gangan pé ọ̀sán fẹ́rẹ̀ẹ́ dé ní èdè Yorùbá àdánidá, láìfi àlàyé míì kún un.
- source_word: παρεκάλει
  choice: ń rọ ... léraléra
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ọ̀rọ̀ yìí mú agbára ìrọ̀ náà jáde.
- source_word: ἅπαντας
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn tó wà nínú ọkọ̀, kò sì yọ ẹnikẹ́ni sílẹ̀.
- source_word: μεταλαβεῖν τροφῆς
  choice: kí wọ́n jẹ oúnjẹ díẹ̀
  rationale: Ó túmọ̀ sí láti gba oúnjẹ tàbí ohun ìtọ́jú ara; ‘oúnjẹ díẹ̀’ tún fi ipa partitive genitive hàn ní ọ̀nà tó ṣe kedere.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Òní ni ọjọ́ kẹrìnlá
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé ọjọ́ òní gan-an ni ọjọ́ kẹrìnlá.
- source_word: προσδοκῶντες
  choice: tí ẹ ti ń dúró de ohun tí yóò ṣẹlẹ̀
  rationale: Participle náà sọ ìfojúsọ́nà tàbí dídúró de ohun kan; níwọ̀n bí ohun tí wọ́n ń retí kò ṣe fara hàn nínú Gíríìkì, gbolohun yìí jẹ́ kó yé ni Yorùbá láìdá ohun pàtó kan lé e lórí.
- source_word: ἄσιτοι διατελεῖτε
  choice: láìjẹun
  rationale: Èyí fi ipò tí wọ́n ti wà fún àkókò kan hàn, ó sì yẹra fún ‘ààwẹ̀,’ èyí tí ó lè dà bí ààwẹ̀ ẹ̀sìn tí wọ́n mọ̀ọ́mọ̀ gbà.
- source_word: μηθὲν προσλαβόμενοι
  choice: tí ẹ kò sì jẹ ohunkóhun
  rationale: Ó pa ìtẹnumọ́ gbolohun Gíríìkì mọ́ pé wọn kò gba ohunkóhun jẹ, ní Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘Pọ́ọ̀lù’ gẹ́gẹ́ bí ìkọ̀wé orúkọ tó bá ìró Yorùbá mu, a sì fi àmì ohùn sí ibi tí ó yẹ.
