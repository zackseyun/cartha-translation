revisions:
- from: Títí di ìgbà tí ilẹ̀ fẹ́rẹ̀ẹ́ máa mọ́, Pọ́ọ̀lù ń rọ gbogbo wọn léraléra pé kí wọ́n jẹ oúnjẹ díẹ̀. Ó ní, “Òní ni ọjọ́ kẹrìnlá tí ẹ ti ń dúró de ohun tí yóò ṣẹlẹ̀[a] láìjẹun, tí ẹ kò sì jẹ ohunkóhun.”
  to: Títí di ìgbà tí ọjọ́ fẹ́rẹ̀ẹ́ máa mọ́, Pọ́ọ̀lù ń rọ gbogbo wọn léraléra pé kí wọ́n jẹ oúnjẹ díẹ̀. Ó ní, “Òní ni ọjọ́ kẹrìnlá tí ẹ ti ń dúró ní ìfojúsọ́nà[a] láìjẹun, tí ẹ kò sì tíì jẹ ohunkóhun.”
  rationale: A rọ́pò “ilẹ̀” pẹ̀lú “ọjọ́” láti bá ἡμέρα mu. A sì yọ “ohun tí yóò ṣẹlẹ̀” kúrò nítorí pé kò sí nínú orísun, a fi “ní ìfojúsọ́nà” sí i láti pa ìtumọ̀ προσδοκῶντες mọ́ láìfi ohun pàtó kan kún un. “Kò sì tíì jẹ ohunkóhun” fi ipa ìṣe tí kò tíì ṣẹlẹ̀ títí dé àkókò tí Pọ́ọ̀lù ń sọ hàn.
