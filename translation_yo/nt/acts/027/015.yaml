  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: yo
  text: Nígbà tí ẹ̀fúùfù gbá ọkọ̀ náà lọ, tí kò sì lè kọjú sí ẹ̀fúùfù náà, a fi ọkọ̀ náà sílẹ̀ fún un[a], ẹ̀fúùfù sì ń gbé wa lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a jẹ́ kí ẹ̀fúùfù náà gbé wa lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντος
  choice: ẹ̀fúùfù sì gbá ọkọ̀ náà lọ
  rationale: “Gbá ... lọ” fi hàn pé agbára òde ló mú ọkọ̀ náà lójijì; fífi “ẹ̀fúùfù” ṣe olùṣe jẹ́ èdè Yorùbá àdánidá, àyíká ẹsẹ náà sì mú un dájú.
- source_word: πλοίου
  choice: ọkọ̀
  rationale: “Ọkọ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọkọ̀ ojú omi ní àyíká yìí.
- source_word: μὴ δυναμένου
  choice: kò sì lè
  rationale: Ó sọ àìlágbára náà ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: ἀντοφθαλμεῖν
  choice: kọjú sí
  rationale: “Kọjú sí ẹ̀fúùfù” pa àwòrán ìpilẹ̀ṣẹ̀ ti fífi ojú do ohun kan mọ́, ó sì bá bí ọkọ̀ ṣe ń dojú kọ ẹ̀fúùfù mu.
- source_word: ἀνέμῳ
  choice: ẹ̀fúùfù náà
  rationale: Orúkọ náà túmọ̀ sí “ẹ̀fúùfù”; àfikún “náà” tọ́ka sí ẹ̀fúùfù ìjì tí a ti ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἐπιδόντες
  choice: a juwọ́ sí i
  rationale: Ó túmọ̀ sí pé àwọn atukọ̀ dáwọ́ dídènà agbára ẹ̀fúùfù dúró, wọ́n sì jẹ́ kí ó darí ọkọ̀; àfikún [a] ṣàfihàn pé gbolohun náà lè so mọ́ ohun tó tẹ̀ lé e.
- source_word: ἐφερόμεθα
  choice: ó sì ń gbé wa lọ
  rationale: Ìṣe aláìparí oníṣe-àfaradà náà ń fi ìrìn tí agbára òde ń fa tẹ̀ síwájú hàn; “ń gbé wa lọ” jẹ́ àdánidá, ó sì pa ìtumọ̀ àfaradà mọ́.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bá ìtẹ̀síwájú tí δέ ń tọ́ka sí mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àwòrán “kọjú sí ẹ̀fúùfù” láì fi ọ̀rọ̀ amọ̀-ọkọ̀ ojú omi tí kò wọ́pọ̀ kún un; a sì fi àmì ohùn sí ibi tó yẹ.
