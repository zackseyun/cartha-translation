  source_fidelity: 'Ìtumọ̀ náà gba ìlànà ẹsẹ̀ Gíríìkì mọ́: ọkọ̀ náà ni agbára ẹ̀fúùfù mú, kò lè dojú kọ ẹ̀fúùfù náà, àwọn atukọ̀ sì juwọ́, wọ́n sì ń lọ lábẹ́ agbára ẹ̀fúùfù. Ṣùgbọ́n “a juwọ́ sí i, ó sì ń gbé wa lọ” ní ìtọ́kasí arọ́pò-orúkọ tí kò dájú: “ó” lè tọ́ka sí ẹ̀fúùfù tàbí sí ohun mìíràn, àti pé ìbáṣepọ̀ rẹ̀ pẹ̀lú “a” lè ṣòro fún òǹkàwé. Àtúnṣe náà sọ olùṣe náà di mímọ́ láì yí ìtumọ̀ pada.'
