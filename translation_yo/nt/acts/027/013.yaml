  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ Gíríìkì dáadáa ní pàtàkì: afẹ́fẹ́ gúúsù fẹ́ pẹ̀lẹ́, wọ́n rò pé ète wọn ti ṣẹ, wọ́n sì gbé ìdákọ̀ró. Ṣùgbọ́n “wọ́n wọ ọkọ̀ lọ ní etíkun” lè túmọ̀ sí pé wọ́n wọ ọkọ̀ (boarded a boat), kì í ṣe pé wọ́n wakọ̀/sá ọkọ̀ ojú omi lẹ́gbẹ̀ẹ́ etíkun. A tún ṣe àtúnṣe sí ìṣọ̀kan ìtumọ̀ ἆσσον gẹ́gẹ́ bí “ní tòsí sí etíkun rẹ̀.”'
