translation_notes:
  register: Èdè Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò. A tú ọ̀rọ̀ ìrìn ọkọ̀ ojú omi sí èdè tí òǹkàwé gbogbo lè lóye, a sì fi àmì ohùn sí ibi tí ó yẹ.
