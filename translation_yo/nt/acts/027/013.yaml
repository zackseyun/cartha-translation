source:
  edition: SBLGNT
  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: yo
  text: Nígbà tí afẹ́fẹ́ gúúsù bẹ̀rẹ̀ sí í fẹ́ jẹ́ẹ́jẹ́, wọ́n rò pé àwọn ti mú ète wọn ṣẹ. Nítorí náà, wọ́n gbé ìdákọ̀ró sókè[a], wọ́n sì fi ọkọ̀ ojú omi lọ lẹ́gbẹ̀ẹ́ Kírétè, ní tòsí sí etíkun rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “wọ́n gbé sókè”; nínú àyíká ọkọ̀ ojú omi, ìtumọ̀ náà ni gbígbé ìdákọ̀ró sókè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń tẹ̀ lé etíkun Kírétè, ní tòsí sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: bẹ̀rẹ̀ sí í fẹ́ jẹ́ẹ́jẹ́
  rationale: Ó fi hàn pé atẹ́gùn náà fẹ́ pẹ̀lẹ́pẹ̀lẹ́, ó sì bá ìbẹ̀rẹ̀ ìṣẹ̀lẹ̀ náà mu ní Yorùbá àdánidá.
- source_word: νότου
  choice: atẹ́gùn gúúsù
  rationale: νότος túmọ̀ sí atẹ́gùn tí ń fẹ́ láti gúúsù.
- source_word: δόξαντες
  choice: wọ́n rò pé
  rationale: Ó sọ ìdájọ́ tàbí ìrònú àwọn atukọ̀, kì í ṣe pé ohun kan kàn dà bí ẹni pé ó rí bẹ́ẹ̀.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: àwọn ti mú ète àwọn ṣẹ
  rationale: Àkópọ̀ ọ̀rọ̀ náà túmọ̀ sí pé wọ́n rò pé wọ́n ti ṣàṣeyọrí nínú ohun tí wọ́n pinnu láti ṣe.
- source_word: ἄραντες
  choice: wọ́n fa ìdákọ̀ró sókè
  rationale: Nínú ọ̀rọ̀ ọkọ̀ ojú omi, ó ń tọ́ka sí gbígbé ìdákọ̀ró sókè kí ọkọ̀ lè ṣí.
- source_word: ἆσσον
  choice: ní sísún mọ́ etíkun
  rationale: Adverb náà túmọ̀ sí ‘ní tòsí sí i’; àyíká ọ̀rọ̀ fi hàn pé etíkun ni ọkọ̀ ń sún mọ́.
- source_word: παρελέγοντο
  choice: wọ́n wọ ọkọ̀ lọ ní etíkun
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìrìn ọkọ̀ ojú omi tó túmọ̀ sí rírìn ọkọ̀ lọ lẹ́gbẹ̀ẹ́ etíkun.
- source_word: τὴν Κρήτην
  choice: Kírétè
  rationale: Orúkọ erékùṣù náà ni; ọ̀rọ̀-ìṣe tó ṣáájú ti fi hàn pé etíkun rẹ̀ ni wọ́n ń tẹ̀ lé.
