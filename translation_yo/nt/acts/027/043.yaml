source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: yo
  text: Ṣùgbọ́n balógun ọgọ́rùn-ún náà, nífẹ̀ẹ́ láti gba Pọ́ọ̀lù là, dá wọn dúró láti mú èrò wọn ṣẹ[a], ó sì pàṣẹ fún àwọn tí ó lè lúwẹ̀ẹ́ pé kí wọ́n kọ́kọ́ ju ara wọn sínú omi, kí wọ́n sì dé ilẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ó ṣèdíwọ́ fún wọn láti mú ète wọn ṣẹ.” Èyí ń tọ́ka sí ète àwọn ọmọ ogun tí a mẹ́nu kàn nínú ẹsẹ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “lẹ́yìn tí wọ́n ti ju ara wọn sílẹ̀, kí wọ́n kọ́kọ́ jáde sí orí ilẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Ó jẹ́ orúkọ ipò ọ̀gá ọmọ ogun Róòmù tí ó máa ń ṣe àkóso ẹgbẹ́ ọmọ ogun tí a kà sí ọgọ́rùn-ún; ìtumọ̀ yìí ṣe kedere ní Yorùbá.
- source_word: βουλόμενος
  choice: fẹ́
  rationale: Ó fi ìfẹ́ tàbí ète balógun náà hàn láìfi ìpinnu tí ó le ju ti Gíríìkì lọ kún un.
- source_word: διασῶσαι
  choice: gba ... là
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípa Pọ́ọ̀lù mọ́ láàyè kúrò nínú ewu; ‘gba là’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: dá wọn dúró láti mú èrò wọn ṣẹ
  rationale: Gbólóhùn náà sọ pé ó ṣèdíwọ́ fún àwọn ọmọ ogun láti ṣe ohun tí wọ́n pinnu nínú ẹsẹ tó ṣáájú.
- source_word: ἐκέλευσέν τε
  choice: Ó pàṣẹ
  rationale: κελεύω ń tọ́ka sí àṣẹ tí ẹni aláṣẹ fi fún àwọn tí ó wà lábẹ́ rẹ̀.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: àwọn tí ó lè lúwẹ̀ẹ́
  rationale: Ó dá ẹgbẹ́ àwọn tí wọ́n mọ bí a ṣe ń lúwẹ̀ẹ́ yà sọ́tọ̀ lára gbogbo ẹni inú ọkọ̀.
- source_word: ἀπορίψαντας
  choice: bẹ́ sí inú omi láti inú ọkọ̀
  rationale: Ìṣe náà jẹ́ jíju ara ẹni kúrò lórí ọkọ̀ sínú omi; yíyan ọ̀rọ̀ yìí jẹ́ kedere, ó sì bá àyíká òkun mu.
- source_word: πρώτους
  choice: kọ́kọ́
  rationale: Ó fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn pé àwọn olùwẹ̀ ni yóò lọ ṣáájú àwọn yòókù.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: dé ilẹ̀
  rationale: Ó pa ìdarí ìrìn láti inú omi sí ilẹ̀ mọ́ ní ọ̀nà tí ó rọrùn, tí ó sì ṣe kedere ní Yorùbá.
