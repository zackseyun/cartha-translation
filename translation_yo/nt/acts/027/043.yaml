translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Balógun ọ̀rún’ ṣàlàyé ipò ọmọ ogun Róòmù láìlo ọ̀rọ̀ àjèjì; àmì àlàyé [a] ni a so mọ́ gbólóhùn tí ó ń ṣàlàyé ní tòótọ́.
