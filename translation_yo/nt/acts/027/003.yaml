  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ ọjọ́ tí ó tẹ̀ lé e, dídúró ọkọ̀ ní Sídónì, ìwà onínúure Júlíọ̀sì, ìyọ̀ǹda rẹ̀, àti gbígba ìtọ́jú látọ̀dọ̀ àwọn ọ̀rẹ́ Pọ́ọ̀lù hàn dáadáa. Síbẹ̀, ìkọ̀lé ‘kí ó lè’ lè fi èrò ìdí kan kún un díẹ̀, níbi tí Gíríìkì ti ń sọ ohun méjèèjì tí a fún Pọ́ọ̀lù láyè láti ṣe: lọ, kí ó sì gba ìtọ́jú.'
  naturalness: ‘Fi inú rere bá Pọ́ọ̀lù lò’ ṣeé lóye, ṣùgbọ́n kò rọrùn bí ‘hùwà onínúure sí Pọ́ọ̀lù’ nínú Yorùbá òde òní. Ìkọ̀lé tuntun náà jẹ́ àdánidá, ó sì bá φιλανθρώπως ... χρησάμενος mu dáadáa.
  terminology: ‘Ìtọ́jú’ jẹ́ ọ̀rọ̀ tó yẹ fún ἐπιμελείας; àlàyé rẹ̀ yẹ kí ó pa ààyè ‘àfiyèsí’ àti ìrànlọ́wọ́ tó nílò mọ́. ‘Onínúure’ ṣàfihàn ìwà rere/humane treatment láì fi ẹ̀kọ́ ìjọ kan kún un.
  issues:
  - severity: medium
    issue: Ìkọ̀lé ‘kí ó lè gba ìtọ́jú’
