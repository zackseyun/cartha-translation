    rationale: Ìsọ̀rọ̀ náà kò ní ìṣàn Yorùbá tó pọ̀ tó. ‘Hùwà onínúure sí Pọ́ọ̀lù’ jẹ́ ọ̀nà tó wúlò, tó sì ṣetán láti fi ìtumọ̀ φιλανθρώπως ... χρησάμενος hàn.
