  to: Ní ọjọ́ kejì, a wọ èbúté Sídónì. Júlíọ̀sì hùwà onínúure sí Pọ́ọ̀lù[b], ó sì yọ̀ǹda fún un láti lọ sọ́dọ̀ àwọn ọ̀rẹ́ rẹ̀ kí ó sì gba ìtọ́jú lọ́wọ́ wọn[a].
