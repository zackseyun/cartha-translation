  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: yo
  text: Ní ọjọ́ kejì, a wọ èbúté Sídónì. Júlíọ̀sì hùwà onínúure sí Pọ́ọ̀lù[b], ó sì yọ̀ǹda fún un láti lọ sọ́dọ̀ àwọn ọ̀rẹ́ rẹ̀ kí ó sì gba ìtọ́jú lọ́wọ́ wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘gba àfiyèsí’ tàbí ‘rí ìtọ́jú gbà’; gbólóhùn Gíríìkì náà lè tọ́ka ní gbòòrò sí gbígba ìrànlọ́wọ́ tí ó nílò lọ́wọ́ àwọn ọ̀rẹ́ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘hùwà onínúure sí Pọ́ọ̀lù’ sí ‘hùwà pẹ̀lú ẹ̀mí omonìyàn sí Pọ́ọ̀lù,’ èyí tí ó tẹnumọ́ ìwà rere Júlíọ̀sì sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Ní ọjọ́ kejì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ọjọ́ tí ó tẹ̀ lé e nínú ìtàn náà; ọ̀nà yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: a wọ èbúté Sídónì
  rationale: Nínú àyíká ìrìnàjò ojú omi, ọ̀rọ̀ náà túmọ̀ sí pé ọkọ̀ wọ èbúté kan, kì í ṣe pé wọ́n kàn dé ibẹ̀ lásán.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: fi inú rere bá Pọ́ọ̀lù lò
  rationale: Èyí sọ ìwà rere àti ìṣe onínúure Júlíọ̀sì sí ẹlẹ́wọ̀n náà ní èdè Yorùbá tí ó ṣe déédé.
- source_word: ἐπέτρεψεν
  choice: yọ̀ǹda fún un
  rationale: Ó túmọ̀ sí fífún ẹnì kan ní àṣẹ tàbí ààyè láti ṣe ohun kan.
- source_word: πρὸς τοὺς φίλους
  choice: sọ́dọ̀ àwọn ọ̀rẹ́ rẹ̀
  rationale: Àwọn ọ̀rẹ́ tí Pọ́ọ̀lù ní ní Sídónì ni ọ̀rọ̀ náà ṣeé ṣe kí ó ń tọ́ka sí; arọ́pò-orúkọ náà mú ìbátan yìí ṣe kedere ní Yorùbá.
- source_word: πορευθέντι
  choice: láti lọ
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ aorist yìí sin ọ̀rọ̀ fífúnni láàyè, nítorí náà ‘láti lọ’ jẹ́ ìtumọ̀ Yorùbá àdánidá.
- source_word: ἐπιμελείας τυχεῖν
  choice: kí ó lè gba ìtọ́jú lọ́wọ́ wọn
  rationale: Gbólóhùn Gíríìkì náà ní ìtumọ̀ gbígbà ìtọ́jú, àfiyèsí, tàbí ìrànlọ́wọ́ tí a nílò; ‘ìtọ́jú’ pa ìtumọ̀ gbòòrò náà mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. ‘A wọ èbúté’ pa àkóónú ìrìnàjò ojú omi mọ́, ‘fi inú rere ... lò’ sì jẹ́ ọ̀nà àdánidá láti sọ ìṣe rere sí ẹnì kan. A gbe àmì àlàyé [a] sí ‘ìtọ́jú’ àti [b] sí ‘inú rere’ kí wọ́n lè bá kókó àlàyé kọ̀ọ̀kan mu.
