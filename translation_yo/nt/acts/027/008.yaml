revisions:
- from: Pẹ̀lú ìṣòro ni a fi ń lọ lẹ́gbẹ̀ẹ́ etíkun rẹ̀[a] títí a fi dé ibi kan tí a ń pè ní Èbúté Rere; ìlú kan tí orúkọ rẹ̀ ń jẹ́ Lasea sì wà nítòsí ibẹ̀.
  to: Pẹ̀lú ìṣòro ni a fi ọkọ̀ lọ lẹ́gbẹ̀ẹ́ etíkun rẹ̀, a sì dé ibi kan tí a ń pè ní Àwọn Èbúté Rere; ìlú kan tí a ń pè ní Lasea wà nítòsí rẹ̀.
  rationale: Àtúnṣe náà lo ọ̀nà ìtàn pípé (‘a fi ọkọ̀ lọ … a sì dé’) láti bá participle Gíríìkì àti aorist ἤλθομεν mu. Ó yọ ‘títí’ kúrò láti má ṣe fi ìbáṣepọ̀ àkókò kún un, ó pa ọ̀pọ̀ nínú orúkọ ibi Καλοὺς Λιμένας mọ́, ó sì tún ẹsẹ̀ abẹ́lẹ̀ ṣe kí ó má ṣe ní ìṣòro ìtumọ̀ ti ‘ṣẹ̀ṣẹ̀’.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:08Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣòro ìrìn-àjò náà, lílọ lẹ́gbẹ̀ẹ́ etíkun Kírétè, dídé ibi kan, àti ìlú Lasea tó wà nítòsí rẹ̀ hàn dáadáa. Síbẹ̀, ‘ń lọ’ jẹ́ àfihàn ìṣe tí ń lọ lọ́wọ́, nígbà tí ἤλθομεν jẹ́ ìṣe ìtàn tí ó ti ṣẹlẹ̀; a tún lè jẹ́ kí ọ̀nà ìrìn-àjò ojú omi hàn kedere síi.
  naturalness: Àkọsílẹ̀ Yorùbá náà rọrùn láti ka, ṣùgbọ́n ‘títí a fi dé’ lè yí ìbáṣepọ̀ participle àti ọ̀rọ̀-ìṣe pàtàkì sí ìtumọ̀ ‘títí di ìgbà,’ èyí tí kò ṣe pàtàkì nínú Gíríìkì. ‘Àwọn Èbúté Rere’ ń pa ọ̀pọ̀ nínú Λιμένας mọ́, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ibi.
  terminology: ‘Lasea’ yẹ, ‘ètíkun rẹ̀’ ń tọ́ka dáadáa sí Kírétè, àti ‘ìlú kan’ ń pa àìní árítíkù nínú πόλις mọ́. Àlàyé ẹsẹ̀ abẹ́lẹ̀ yẹ kí ó máa sọ ìtumọ̀ ‘barely’ ní kedere láì fi ìtumọ̀ ‘laipẹ́’ tí ‘ṣẹ̀ṣẹ̀’ lè ní sí i.
  issues:
