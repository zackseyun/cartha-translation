    rationale: Àlàyé yíyàn ọ̀rọ̀ yẹ kí ó sọ ‘pẹ̀lú ìṣòro’ tàbí ‘kò fẹ́rẹ̀ẹ́ ṣee ṣe’ ní kedere.
