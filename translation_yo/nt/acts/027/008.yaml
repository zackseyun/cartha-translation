source:
  edition: SBLGNT
  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: yo
  text: Pẹ̀lú ìṣòro ni a fi ọkọ̀ lọ lẹ́gbẹ̀ẹ́ etíkun rẹ̀, a sì dé ibi kan tí a ń pè ní Àwọn Èbúté Rere; ìlú kan tí a ń pè ní Lasea wà nítòsí rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόλις
  choice: Pẹ̀lú ìṣòro
  rationale: Ó fi hàn pé ìrìn-àjò náà ṣòro gidigidi, wọ́n sì ṣẹ̀ṣẹ̀ lè tẹ̀ síwájú.
- source_word: τε
  choice: ni ... sì
  rationale: Ìṣọ̀kan gbólóhùn Yorùbá yìí so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú láì fi kún ìtumọ̀ patikulu náà.
- source_word: παραλεγόμενοι
  choice: ń lọ lẹ́gbẹ̀ẹ́ etíkun
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò ojú omi, ọ̀rọ̀ náà túmọ̀ sí lílọ pẹ̀lú etíkun; àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ojú omi mọ́ nínú àyíká.
- source_word: αὐτὴν
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Kírétè nínú ẹsẹ tó ṣáájú, ní pàtó sí etíkun rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ παραλεγόμενοι ṣe béèrè.
- source_word: ἤλθομεν
  choice: a fi dé
  rationale: Ó túmọ̀ ìṣe dé ibi tí wọ́n ń lọ, ó sì bá ìtàn ìrìn-àjò mu lọ́nà àdánidá.
- source_word: εἰς τόπον τινά
  choice: ibi kan
  rationale: Ó pa àìdánimọ̀ τινά mọ́, ó sì jẹ́ ọ̀nà tí Yorùbá máa ń gbà sọ ọ́.
- source_word: καλούμενον
  choice: tí a ń pè ní
  rationale: Ìtumọ̀ àdánidá fún ṣíṣe àfihàn orúkọ ibi ni Yorùbá.
- source_word: Καλοὺς Λιμένας
  choice: Èbúté Rere
  rationale: Orúkọ Gíríìkì náà ní ìtumọ̀ ‘Àwọn Èbúté Rere’; ‘Èbúté Rere’ ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ibi tó ṣe kedere ní Yorùbá láì gbẹ́kẹ̀ lé fọ́ọ̀mù Gẹ̀ẹ́sì.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: ìlú kan tí orúkọ rẹ̀ ń jẹ́ Lasea sì wà nítòsí ibẹ̀
  rationale: Ó pa πόλις tí kò ní árítíkù mọ́ gẹ́gẹ́ bí ‘ìlú kan,’ ó sì sọ ìbátan ibi ἐγγύς ní Yorùbá tó mọ́gbọ́n dání.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘a’ fún ẹni àkọ́kọ́ ọ̀pọ̀ nínú ìtàn, a sì fi àmì ohùn sí ibi tí ó bá yẹ. ‘Lasea’ ni a kọ gẹ́gẹ́ bí orúkọ àdúgbò láì ṣe àfikún àmì ohùn tí kò dá lórí ẹ̀rí.
