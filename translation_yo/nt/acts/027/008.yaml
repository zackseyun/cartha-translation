    issue: ‘a fi ń lọ’ fi ìṣe tí ń lọ lọ́wọ́ hàn
    rationale: Nínú àyíká ìtàn, Gíríìkì ἤλθομεν jẹ́ aorist (‘a dé’). Ìtumọ̀ pípé yẹ kí ó lo ọ̀nà ìtàn tí ó ti ṣẹlẹ̀, kì í ṣe ‘ń lọ’.
  - severity: low
    issue: ‘títí a fi dé’ lè fi ìtumọ̀ àfikún ‘títí di ìgbà’ kún un
    rationale: Gíríìkì ní participle ‘ní fífi ìṣòro kọjá lẹ́gbẹ̀ẹ́ etíkun’ àti ọ̀rọ̀-ìṣe pàtàkì ‘a dé’; kò béèrè ìfihàn àkókò ‘títí’.
  - severity: low
    issue: ‘Èbúté Rere’ kò hàn ọ̀pọ̀ nínú Καλοὺς Λιμένας
    rationale: Bí ó tilẹ̀ jẹ́ orúkọ ibi, ‘Àwọn Èbúté Rere’ lè pa fọ́ọ̀mù ọ̀pọ̀ orísun mọ́ láì bà ìsọ̀rọ̀ Yorùbá jẹ́.
