review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀, ìkọ̀kọ̀ ọkọ̀ kékeré sókè, fífi okùn fún ọkọ̀ ńlá lókun, àti àìdájú ti τὸ σκεῦος hàn dáadáa. Síbẹ̀, “afẹ́fẹ́ sì ń gbé wọn lọ” fi afẹ́fẹ́ kun un gẹ́gẹ́ bí kókó-ọrọ̀, níbi tí Gíríìkì ti lo ìṣe aláìṣiṣẹ́ tí kò sọ ohun tí ń gbé wọn lọ. “lọ kọ́ sí Sírítì” tún kéré ní ìbámu pẹ̀lú ewu pé ọkọ̀ lè ṣubú sínú tàbí kí a gbé e lọ sórí àwọn etí-iyanrìn Sírítì.
  naturalness: “Fi àmùrè yí ọkọ̀ náà ká láti abẹ́” kò rọrùn ní Yorùbá òde òní. “Fi okùn yí ọkọ̀ náà ká láti mú un lágbára” sọ ìṣe fífi okùn yí ọkọ̀ ká (frapping/undergirding) ní kedere àti ní èdè àdánidá. Àtúnṣe sí “a sì ń gbé wọn lọ” tún dá ìṣàn gbólóhùn náà sí rere.
  terminology: “Àwọn okùn ìtìlẹ́yìn” yẹ fún βοηθείαις nínú àyíká iṣẹ́ ojú omi. “Ohun èlò ọkọ̀” pa àìdájú τὸ σκεῦος mọ́, láì fi ìdákọ̀ró inú omi ṣe ìtumọ̀ pàtó nínú ọ̀rọ̀ àkọ́kọ́.
  issues:
  - severity: medium
    issue: A fi “afẹ́fẹ́” kun un gẹ́gẹ́ bí ohun tí ń gbé wọn lọ.
    rationale: οὕτως ἐφέροντο jẹ́ imperfect passive; kò sọ afẹ́fẹ́ ní pàtó. Àyíká lè jẹ́ kí afẹ́fẹ́ ṣeé ṣe, ṣùgbọ́n ìtumọ̀ yẹ kí ó pa ìṣòro-ọrọ̀ náà mọ́.
  - severity: medium
    issue: “Ọkọ̀ náà lè lọ kọ́ sí Sírítì” kò ṣe aṣojú ewu ἐκπέσωσιν dáadáa.
