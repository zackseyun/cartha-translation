- from: Lẹ́yìn tí wọ́n gbé e sókè, wọ́n lo àwọn okùn ìrànwọ́ láti fi àmùrè yí ọkọ̀ náà ká láti abẹ́; nítorí ẹ̀rù pé ọkọ̀ náà lè lọ kọ́ sí Sírítì[b], wọ́n sọ ohun èlò ọkọ̀ náà kalẹ̀[a], bẹ́ẹ̀ ni afẹ́fẹ́ sì ń gbé wọn lọ.
  to: Lẹ́yìn tí wọ́n gbé e sókè, wọ́n lo àwọn okùn ìtìlẹ́yìn láti fi yí ọkọ̀ náà ká kí wọ́n lè mú un lágbára; wọ́n sì bẹ̀rù pé ọkọ̀ wọn lè lọ sínú Sírítì[b]. Nítorí náà, wọ́n sọ ohun èlò ọkọ̀ kalẹ̀[a], a sì ń gbé wọn lọ bẹ́ẹ̀.
