source:
  edition: SBLGNT
  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n gbé e sókè, wọ́n lo àwọn okùn ìtìlẹ́yìn láti fi yí ọkọ̀ náà ká kí wọ́n lè mú un lágbára; wọ́n sì bẹ̀rù pé ọkọ̀ wọn lè lọ sínú Sírítì[b]. Nítorí náà, wọ́n sọ ohun èlò ọkọ̀ kalẹ̀[a], a sì ń gbé wọn lọ bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sọ àwọn ohun èlò ọkọ̀ kalẹ̀,” tàbí “wọ́n sọ ìdákọ̀ró inú omi kalẹ̀.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ohun èlò,” kò sì dájú ohun èlò ojú omi pàtó tí ó ń tọ́ka sí níbí.
    reason: lexical_alternative
  - marker: b
    text: Sírítì jẹ́ agbègbè olókìkí fún ibi tí omi kò jin àti àwọn òkítì yanrìn ní etíkun Àríwá Áfíríkà.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Lẹ́yìn tí wọ́n gbé e sókè
  rationale: Orúkọ arọ́pò ‘e’ tọ́ka sí ọkọ̀ kékeré inú ẹsẹ tó ṣáájú; gbólóhùn náà tún fi hàn pé wọ́n kọ́kọ́ gbé e sókè.
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: wọ́n lo àwọn okùn ìrànwọ́ láti fi àmùrè yí ọkọ̀ náà ká láti abẹ́
  rationale: Ní àyíká iṣẹ́ ojú omi, βοηθείαι jẹ́ ohun ìrànwọ́ bí okùn tí a fi ń fún ara ọkọ̀ lókun; ọ̀rọ̀ yìí ṣàlàyé iṣẹ́ náà ní Yorùbá tó ṣeé lóye.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: pé ọkọ̀ náà lè lọ kọ́ sí Sírítì
  rationale: ἐκπίπτω ní àyíká yìí ń tọ́ka sí lílọ kọ́ sí ibi yanrìn tàbí ibi tí omi kò jin; a pa orúkọ ilẹ̀ náà mọ́ gẹ́gẹ́ bí Sírítì.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: wọ́n sọ ohun èlò ọkọ̀ náà kalẹ̀
  rationale: σκεῦος túmọ̀ sí ohun èlò tàbí ẹ̀rọ ní gbogbogbòò. Ohun pàtó tí wọ́n sọ kalẹ̀ kò dájú, nítorí náà a kò fi ìtumọ̀ ‘ìdákọ̀ró inú omi’ mú un dandan.
- source_word: οὕτως ἐφέροντο
  choice: bẹ́ẹ̀ ni afẹ́fẹ́ sì ń gbé wọn lọ
  rationale: Ìṣe aláìpé fínnífínní náà fi ìṣípòpadà tí agbára òde ń fa hàn; àyíká náà fi hàn pé ìjì tàbí afẹ́fẹ́ ló ń gbé ọkọ̀ lọ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àdáni, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A ṣàlàyé ọ̀nà tí wọ́n fi okùn fún ọkọ̀ lókun dípò lílo ọ̀rọ̀ iṣẹ́ ojú omi tí kò wọ́pọ̀. A tún pa àìdájú χαλάσαντες τὸ σκεῦος mọ́ nínú ẹsẹ àti àlàyé ìsàlẹ̀.
