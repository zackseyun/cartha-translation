id: ACT.27.12
reference: Acts 27:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: yo
  text: Nítorí èbúté náà kò bójú mu fún lílo ìgbà òtútù níbẹ̀, ọ̀pọ̀ jù lọ nínú wọn pinnu láti ṣíkọ̀ kúrò níbẹ̀,[a] bí ó bá ṣeé ṣe kí wọn dé Fíníksì[b] láti lo ìgbà òtútù níbẹ̀—èbúté kan ní Kírétè tí ó kọjú sí gúúsù ìwọ̀ oòrùn àti àríwá ìwọ̀ oòrùn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti gbé ọkọ̀ ojú omi kúrò níbẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ọ̀rọ̀ àwọn atukọ̀ fún jíjáde lọ sí òkun.
    reason: lexical_alternative
  - marker: b
    text: Fíníksì jẹ́ èbúté kan ní erékùṣù Kírétè.
    reason: cultural_note
  - marker: c
    text: Gbólóhùn ìkẹyìn tó sọ àwọn ìhà tí èbúté náà kọjú sí ṣòro láti túmọ̀ dájú. Lọ́nà àṣà, a máa ń túmọ̀ rẹ̀ sí “gúúsù ìwọ̀ oòrùn àti àríwá ìwọ̀ oòrùn”; àwọn kan lóye ìhà kejì ní pàtó sí i gẹ́gẹ́ bí “ìwọ̀ oòrùn-àríwá ìwọ̀ oòrùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: kò bójú mu
  rationale: Ó fi hàn pé èbúté náà kò yẹ dáadáa fún ète tí a ní lọ́kàn, ìyẹn lílo gbogbo ìgbà òtútù níbẹ̀.
- source_word: λιμένος
  choice: èbúté
  rationale: Èbúté jẹ́ ọ̀rọ̀ Yorùbá tó bá ibi tí ọkọ̀ ojú omi ti ń gúnlẹ̀ tàbí ti ń forí pamọ́ mu.
- source_word: πρὸς παραχειμασίαν
  choice: fún lílo ìgbà òtútù níbẹ̀
  rationale: Ó sọ ète dídúró ní ibi kan jálẹ̀ àkókò òtútù ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: οἱ πλείονες
  choice: ọ̀pọ̀ jù lọ wọn
  rationale: Ó túmọ̀ sí apá tó pọ̀ jù nínú ẹgbẹ́ náà, láìfi ẹni tí 'wọn' ń tọ́ka sí kún ohun tí orísun kò sọ.
- source_word: ἔθεντο βουλήν
  choice: pinnu
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ṣíṣe ìpinnu tàbí gbígba èrò kan pọ̀.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: láti ṣíkọ̀ kúrò níbẹ̀
  rationale: Nínú èdè ọkọ̀ ojú omi, ọ̀rọ̀-ìṣe náà túmọ̀ sí fífi ọkọ̀ jáde sí òkun tàbí bẹ̀rẹ̀ ìrìn ọkọ̀ ojú omi.
- source_word: εἴ πως δύναιντο
  choice: bí ó bá ṣeé ṣe kí wọn
  rationale: Ó pa àìdánilójú àti ìrètí pé bóyá wọn yóò lè ṣe é mọ́.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: kí wọn dé Fíníksì
  rationale: Ó ṣàpèjúwe dídé ibi tí wọ́n ń lọ ní ọ̀nà àdánidá.
- source_word: Φοίνικα
  choice: Fíníksì
  rationale: Ìkọ̀wé orúkọ èbúté Kírétè náà ni a mú bá ìró rẹ̀ mu ní Yorùbá.
- source_word: παραχειμάσαι
  choice: láti lo ìgbà òtútù níbẹ̀
  rationale: Ó tún èrò dídúró jálẹ̀ ìgbà òtútù sọ, ní báyìí ní ibi tí wọ́n fẹ́ dé.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: tí ó kọjú sí gúúsù ìwọ̀ oòrùn àti àríwá ìwọ̀ oòrùn
  rationale: “Kọjú sí” jẹ́ ọ̀nà àdánidá láti sọ bí èbúté ṣe yí sí àwọn ìhà wọ̀nyí; àlàyé ìsàlẹ̀ ṣí àìdánilójú ọ̀rọ̀ ìhà kejì sílẹ̀.
