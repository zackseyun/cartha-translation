  terminology: “Èbúté,” “ṣíkọ̀,” “Fíníksì,” àti “Kírétè” bá àyíká ìrìn ọkọ̀ ojú omi mu. “Kò bójú mu” jẹ́ ìtumọ̀ ti ara fún ἀνευθέτου. Àwọn àmì ìsàlẹ̀ [a]–[c] wà níbi tó yẹ, a sì pa àìdánilójú ìhà kejì mọ́ nínú akọsílẹ̀ [c].
