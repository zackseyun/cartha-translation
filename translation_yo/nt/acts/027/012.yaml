  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: èbúté náà kò yẹ fún ìgbà òtútù, ọ̀pọ̀ jù lọ ṣe ìpinnu láti ṣíkọ̀, wọ́n sì ní ìrètí aláìdánilójú láti dé Fíníksì kí wọ́n lo ìgbà òtútù níbẹ̀. Àwọn ìhà ‘gúúsù ìwọ̀ oòrùn’ àti ‘àríwá ìwọ̀ oòrùn’ pa ìtumọ̀ àṣà ti gbolóhùn ìṣòro náà mọ́, pẹ̀lú àlàyé ìsàlẹ̀.'
