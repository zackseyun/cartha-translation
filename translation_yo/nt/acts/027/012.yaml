translation_notes:
  register: Yorùbá àkànṣe tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A yan “ṣíkọ̀” gẹ́gẹ́ bí ọ̀rọ̀ ṣókí fún bẹ̀rẹ̀ ìrìn ọkọ̀ ojú omi, a sì pa ìtumọ̀ àìdánilójú εἴ πως mọ́ pẹ̀lú “bí ó bá ṣeé ṣe.” Gbogbo àmì ìsàlẹ̀ [a]–[c] wà nínú ẹsẹ̀ náà.
