  source_fidelity: The draft accurately conveys the prolonged absence of sun and stars, the severe maritime storm, the transition expressed by λοιπὸν, and the progressive loss of all hope of survival. However, “ìjì líle sì ń rọ̀ mọ́ wa” portrays rain falling on them rather than a storm pressing upon/battering them, and so does not adequately render ἐπικειμένου in this context.
  naturalness: The revised wording uses clear, contemporary Standard Yorùbá. “Ń kọlù wá” naturally depicts the storm's sustained assault without introducing a different event.
  terminology: “Là á já” appropriately conveys physical survival in this shipwreck narrative. The footnote is retained but corrects “gbà sílẹ̀” to the more appropriate “gbà là” for rescue/deliverance.
