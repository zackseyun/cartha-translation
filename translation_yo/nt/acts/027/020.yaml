    issue: “ń rọ̀ mọ́ wa” does not accurately describe the storm’s action.
    rationale: Rọ̀ refers to falling/pouring, especially of rain. The Greek ἐπικειμένου depicts the severe storm as lying upon, pressing upon, or bearing down on the travelers.
  - severity: low
    issue: The footnote’s “gbà sílẹ̀” is not the best Yoruba equivalent for rescue in this context.
    rationale: “Gbà là” more directly expresses rescue or deliverance and better supports the stated lexical alternative.
