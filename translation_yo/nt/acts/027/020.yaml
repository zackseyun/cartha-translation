  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: yo
  text: Oòrùn kò farahàn, bẹ́ẹ̀ ni àwọn ìràwọ̀ kò farahàn fún ọ̀pọ̀ ọjọ́; ìjì líle sì ń kọlù wá. Láti ìgbà náà lọ, gbogbo ìrètí pé a ó là á já[a] ni ó ń pòórá díẹ̀díẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé a ó yè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “là” tàbí “gbà là”; níhìn-ín, ó ń sọ nípa lílà kúrò nínú ewu ìjì náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων
  choice: Oòrùn kò farahàn, bẹ́ẹ̀ ni àwọn ìràwọ̀ kò farahàn
  rationale: “Farahàn” conveys the heavenly bodies becoming visible without insisting only on their shining; the paired clauses naturally preserve the Greek “neither … nor.”
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: fún ọ̀pọ̀ ọjọ́
  rationale: This naturally expresses duration over an extended number of days.
- source_word: χειμῶνός τε οὐκ ὀλίγου
  choice: ìjì líle
  rationale: In this maritime setting χειμών denotes stormy weather. Yoruba expresses the force of the Greek litotes οὐκ ὀλίγου more naturally and clearly with “líle” than with a wooden “tí kò kéré.”
- source_word: ἐπικειμένου
  choice: ń rọ̀ mọ́ wa
  rationale: The expression depicts the storm as continuing to press heavily upon them and preserves the ongoing force of the participle.
- source_word: λοιπὸν
  choice: Láti ìgbà náà lọ
  rationale: This marks the resulting stage reached in the narrative, not merely a discourse conclusion.
- source_word: περιῃρεῖτο
  choice: ń pòórá díẹ̀díẹ̀
  rationale: The imperfect passive presents hope as being progressively removed; this Yoruba wording naturally communicates its gradual disappearance.
- source_word: ἐλπὶς πᾶσα
  choice: gbogbo ìrètí
  rationale: This preserves the totality expressed by πᾶσα in idiomatic Yoruba.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: pé a ó là á já
  rationale: The articular infinitive gives the content of their hope. In this shipwreck context, “là á já” naturally denotes surviving or being delivered from mortal danger.
theological_decisions:
- issue: Meaning of σῴζεσθαι in the maritime narrative
  choice: pé a ó là á já
  alternative: pé a ó yè; pé a ó rí ìgbàlà
  rationale: The immediate issue is physical preservation from the storm and death at sea, not spiritual salvation. “Là á já” states that contextual sense while the footnote records a natural alternative.
translation_notes:
  register: Standard Yorùbá with full tone marks, using clear contemporary narrative language. The semicolon keeps the prolonged lack of visibility and the continuing storm closely linked, while the second sentence marks the resulting loss of hope.
