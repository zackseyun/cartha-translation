language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: yo
  text: àti àwọn yòókù náà, àwọn kan wà lórí àwọn pákó, àwọn mìíràn sì wà lórí àwọn ohun kan láti inú ọkọ̀ náà. Báyìí sì ni gbogbo wọn ṣe dé ilẹ̀ láìléwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo wọn ni a gbà là sí ilẹ̀” tàbí “gbogbo wọn bó dé etíkun láìléwu.” Ọ̀rọ̀-ìṣe Gíríìkì níbí ń tọ́ka sí yíyè bó nínú ewu ìjàmbá ọkọ̀ ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: àwọn yòókù
  rationale: Ó ń tọ́ka sí àwọn ènìyàn tó ṣẹ́ kù lẹ́yìn àwọn tí ẹsẹ tó ṣáájú ti mẹ́nu kàn; ọ̀rọ̀ yìí ṣe déédé pẹ̀lú ìtumọ̀ Gíríìkì, ó sì jẹ́ Yorùbá àdánidá.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: àwọn kan ... àwọn mìíràn sì
  rationale: Èyí pín àwọn tó ṣẹ́ kù sí ẹgbẹ́ méjì, ó sì fi ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì hàn ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἐπὶ σανίσιν
  choice: lórí àwọn pákó
  rationale: σανίς túmọ̀ sí pákó tàbí àwo igi; ‘pákó’ bá àyíká ọkọ̀ tó rì mu, ó sì ṣe kedere.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: lórí àwọn ohun kan láti inú ọkọ̀ náà
  rationale: Gíríìkì kò sọ irú àwọn ohun náà ní pàtó. Ìtumọ̀ yìí pa àìsọ pàtó náà mọ́, kò sì fi kún ohun tí orísun kò sọ.
- source_word: οὕτως
  choice: Nípa bẹ́ẹ̀
  rationale: Ó ṣàkópọ̀ ọ̀nà tí àwọn ènìyàn náà gbà dé ilẹ̀ gẹ́gẹ́ bí a ti ṣàlàyé rẹ̀ ṣáájú.
- source_word: ἐγένετο
  choice: ó ṣẹlẹ̀ pé
  rationale: Ó fi àbájáde ìṣẹ̀lẹ̀ náà hàn ní ọ̀nà ìtàn tó ṣe déédé pẹ̀lú Gíríìkì.
- source_word: πάντας διασωθῆναι
  choice: gbogbo wọn dé ... láìléwu
  rationale: Nínú àyíká ọkọ̀ tó rì yìí, διασῴζω ń sọ nípa yíyè bó nínú ewu nípa ti ara. ‘Dé ... láìléwu’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún fífi ìtumọ̀ ìgbàlà nípa ẹ̀mí sínú ọ̀rọ̀ náà.
- source_word: ἐπὶ τὴν γῆν
  choice: dé ilẹ̀
  rationale: Nínú àyíká ìrìn-àjò ojú omi, γῆ ni ilẹ̀ ní ìyàtọ̀ sí òkun; ‘dé ilẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí διασωθῆναι lè dà bí ẹni pé ó ní
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí yíyè bó nínú ewu ọkọ̀ tó rì: ‘gbogbo wọn dé ilẹ̀ láìléwu.’'
  alternative: ‘gbogbo wọn ni a gbà là dé ilẹ̀’ tàbí ‘gbogbo wọn sá àsálà dé etíkun’
  rationale: Àyíká náà jẹ́ ti ìdáǹdè kúrò nínú ewu nípa ti ara, kì í ṣe gbólóhùn nípa ìgbàlà ẹ̀mí. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ọ̀nà mìíràn tí a lè gbà túmọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó sì ní iyì. A pa ìṣàn gbólóhùn tó ń bá ẹsẹ tó ṣáájú lọ mọ́ pẹ̀lú ‘àti àwọn yòókù,’ a sì fi àmì ohùn sí ibi tí ó bá ti jẹ́ àdánidá.
