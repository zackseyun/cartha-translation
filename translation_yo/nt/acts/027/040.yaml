id: ACT.27.40
reference: Acts 27:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: yo
  text: Wọ́n tú àwọn ìdákọ̀ró náà kúrò, wọ́n sì fi wọ́n sílẹ̀ nínú òkun. Ní àkókò kan náà, wọ́n tú àwọn okùn tí a fi dì àwọn ọ̀pá ìdarí ọkọ̀[a], wọ́n gbé ìgbòkun iwájú sókè sí afẹ́fẹ́[b], wọ́n sì darí ọkọ̀ náà lọ sí etí iyanrìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìdè” tàbí “àwọn ohun àmúró àwọn ọ̀pá ìdarí ọkọ̀”; ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìrìn-omi tí kò wọ́pọ̀ fún ohun tí a fi mú ohun èlò ìdarí ọkọ̀ dúró.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbòkun òkè” tàbí “ìgbòkun tó wà ní iwájú ọkọ̀”; ìgbòkun pàtó tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí kò dájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες τὰς ἀγκύρας
  choice: wọ́n tú àwọn ìdákọ̀ró náà kúrò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyọ tàbí títú àwọn ìdákọ̀ró kúrò; ‘tú ... kúrò’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n dá wọn sílẹ̀ kúrò lára ọkọ̀.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: wọ́n sì fi wọ́n sílẹ̀ nínú òkun
  rationale: Èyí pa ìtumọ̀ náà mọ́ pé wọ́n kọ àwọn ìdákọ̀ró náà sílẹ̀ nínú òkun, wọn kò sì tún mú wọn wọ ọkọ̀.
- source_word: ἅμα
  choice: Lẹ́sẹ̀ kan náà
  rationale: Ó fi hàn pé àwọn ìgbésẹ̀ wọ̀nyí ń ṣẹlẹ̀ ní àkókò kan náà.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: wọ́n tú àwọn okùn tí a fi dì àwọn ọ̀pá ìdarí ọkọ̀
  rationale: ζευκτηρίας jẹ́ ọ̀rọ̀ ìrìn-omi tí kò wọ́pọ̀ fún ohun ìdè tàbí ohun àmúró; ‘àwọn okùn tí a fi dì’ ṣe kedere fún òǹkàwé òde òní. πηδάλια tọ́ka sí àwọn ohun èlò ìdarí ọkọ̀, ó sì ṣeé ṣe kí ó jẹ́ ọ̀pá ìdarí méjì lórí ọkọ̀ ayé àtijọ́.
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: wọ́n gbé ìgbòkun iwájú sókè
  rationale: ἐπάραντες sọ nípa gbígbé ohun sókè. ἀρτέμων jẹ́ ọ̀rọ̀ ìrìn-omi tí ìtumọ̀ rẹ̀ pàtó kò dájú; ‘ìgbòkun iwájú’ jẹ́ ìtumọ̀ tó ṣeé ṣe, a sì pa àìdájú náà mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: τῇ πνεούσῃ
  choice: sí afẹ́fẹ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí afẹ́fẹ́ tí ń fẹ́, èyí tí wọ́n gbé ìgbòkun sí láti mú ọkọ̀ lọ.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: wọ́n sì darí ọkọ̀ náà lọ sí etí iyanrìn
  rationale: κατέχω níhìn-ín jẹ́ ọ̀rọ̀ ìrìn-omi fún dídarí tàbí mímú ipa ọ̀nà kan; αἰγιαλός tọ́ka sí etí omi oníyanrìn, kì í ṣe etíkun ní ìtumọ̀ gbogbogbò nìkan.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbàṣe tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn ọ̀rọ̀ ìrìn-omi ni a túmọ̀ ní ọ̀nà tó rọrùn láti lóye, ṣùgbọ́n a fi àwọn àṣàyàn sí àlàyé ìsàlẹ̀ níbi tí Gíríìkì kò ti dájú. A gbé àmì [a] sí lẹ́yìn gbolohun tó túmọ̀ ζευκτηρίας, nítorí ibẹ̀ ni àìdájú ọ̀rọ̀ náà wà nínú orísun Gíríìkì.
