  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: yo
  text: Nítorí náà, ẹ mú ọkàn le, ẹ̀yin ọkùnrin, nítorí mo gba Ọlọ́run gbọ́[a] pé yóò rí gẹ́gẹ́ bí a ti sọ fún mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo gbẹ́kẹ̀ lé Ọlọ́run.” Ìṣètò ọ̀rọ̀ Gíríìkì lè tẹnu mọ́ fífi ara le Ọlọ́run tàbí gbígba ohun tí Ọlọ́run sọ gbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ìdánilójú tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ.
- source_word: εὐθυμεῖτε
  choice: ẹ mú ọkàn le
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pè wọ́n láti ní ìgboyà láàárín ewu; gbólóhùn náà jẹ́ Yorùbá àdánidá tí ó sì ṣe kedere.
- source_word: ἄνδρες
  choice: ẹ̀yin ọkùnrin
  rationale: Ó pa àdírẹ́sì akọ ní ọ̀pọ̀ mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: πιστεύω τῷ θεῷ
  choice: mo gba Ọlọ́run gbọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí gbígbà Ọlọ́run gbọ́, ìyẹn ni fífi ara le Ọlọ́run àti mímú ọ̀rọ̀ rẹ̀ ní òtítọ́; Yorùbá yìí pa ipa ti ẹni àti ti ohun tí a sọ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí Pọ́ọ̀lù gbà gbọ́ sílẹ̀, kì í ṣe ìdí tí ó fi gbà á gbọ́.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: yóò rí gẹ́gẹ́ bí
  rationale: Ó sọ ìbámu pípé láàárín ohun tí yóò ṣẹlẹ̀ àti ọ̀rọ̀ tí a sọ fún un ní Yorùbá tó ṣeé lóye.
- source_word: λελάληταί μοι
  choice: a ti sọ fún mi
  rationale: Ó pa ohùn àìsọ ẹni tó ṣe é mọ́, ó sì fi hàn pé ọ̀rọ̀ náà ti wáyé tẹ́lẹ̀ ṣùgbọ́n ó ṣì ní ipa nísinsin yìí.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω τῷ θεῷ
  choice: mo gba Ọlọ́run gbọ́
  alternative: mo gbẹ́kẹ̀ lé Ọlọ́run
  rationale: Dátífù pẹ̀lú πιστεύω lè tẹnu mọ́ gbígba Ọlọ́run gbọ́ tàbí fífi ara le e. Ọ̀rọ̀ inú àyíká náà tún kan gbígba ohun tí Ọlọ́run sọ ní òtítọ́, nítorí náà a fi àlàyé mìíràn sí àkọsílẹ̀ ìsàlẹ̀ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. “Ẹ mú ọkàn le” jẹ́ ìṣírí àdánidá; “ẹ̀yin ọkùnrin” pa ìdánimọ̀ akọ ti àwùjọ inú ọkọ̀ mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá bá Yorùbá àdánidá mu.
