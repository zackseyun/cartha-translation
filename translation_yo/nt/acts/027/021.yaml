review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: Pọ́ọ̀lù dìde láàárín wọn, ìbáwí náà, ìkìlọ̀ pé kí wọ́n má ṣíkọ̀ láti Kírétè, àti ìpalára pẹ̀lú àdánù ni a pa mọ́. Síbẹ̀, ìṣípayá ìbẹ̀rẹ̀ náà dára kó jẹ́ ipò/àkókò kan ju ‘lẹ́yìn’ lọ, àti ìtumọ̀ ìṣe ìbáṣepọ̀ ní òpin nílò àmì ìṣèjọba àìníṣe tó pé.'
  naturalness: ‘Nígbà tí wọ́n ti pẹ́ láìjẹun’ jẹ́ Yorùbá àdánidá, ó sì mú agbára genitive absolute náà dáadáa. ‘Ẹ̀yin ìbá ti yẹra’ ni ìṣèjọba àìníṣe tó pé ju ‘ẹ ì bá yẹra’ lọ.
  terminology: ‘ṣíkọ̀,’ ‘ìpalára,’ àti ‘àdánù’ bá àyíká ìrìn ojú omi mu. Àlàyé akọsílẹ̀ c gbọdọ̀ má ṣe sọ pé ìpalára náà jẹ́ sí ènìyàn; ọ̀rọ̀ Gíríìkì kò sọ ìyàtọ̀ náà ní kedere, bí ó tilẹ̀ jẹ́ pé ó lè yà ìbàjẹ́ kúrò nínú àdánù.
  issues:
  - severity: medium
    issue: Ìtumọ̀ ‘Lẹ́yìn tí’ fún Πολλῆς τε ἀσιτίας ὑπαρχούσης
    rationale: Genitive absolute náà ń ṣàfihàn ipò tàbí àyíká tó wà nígbà tí Pọ́ọ̀lù sọ̀rọ̀. ‘Nígbà tí wọ́n ti pẹ́ láìjẹun’ pa ìbáṣepọ̀ àkókò yìí mọ́ láìfi ìtẹ̀lé ìṣẹ̀lẹ̀ tó le ju sí i.
  - severity: medium
    issue: ‘ẹ ì bá yẹra’
    rationale: 'Ìpèníjà àìníṣe ní Yorùbá nílò ‘ìbá’ àti ‘ti’ níhìn-ín: ‘ẹ̀yin ìbá ti yẹra.’'
  - severity: medium
    issue: Àkọsílẹ̀ c sọ pé ìpalára jẹ́ sí ènìyàn tàbí ohun-ìní
    rationale: ὕβρις àti ζημία kò fi ohun tí ìpalára náà kan hàn ní kedere. Àkọsílẹ̀ náà yẹ kí ó ní ìyàtọ̀ tó lè wà láàárín ìbàjẹ́/ìpalára àti àdánù, láìsọ pàtó pé ìpalára náà kan ènìyàn.
