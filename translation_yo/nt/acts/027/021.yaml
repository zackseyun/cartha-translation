translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ; “ṣíkọ̀” jẹ́ ọ̀rọ̀ ojú omi tó ṣe déédéé, “ẹ ì bá” sì pa ìtumọ̀ ohun tí ì bá ṣẹlẹ̀ mọ́.
