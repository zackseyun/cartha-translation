  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: yo
  text: Nígbà tí wọ́n ti pẹ́ láìjẹun,[a] Pọ́ọ̀lù dìde láàárín wọn, ó sì sọ pé, “Ẹ̀yin ọkùnrin, ó yẹ kí ẹ ti fetí sí mi[b] kí ẹ má sì ṣíkọ̀ láti Kírétè; nípa bẹ́ẹ̀, ẹ̀yin ìbá ti yẹra fún ìpalára yìí àti àdánù náà.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Nígbà tí ààwẹ̀ ti pẹ́.” Ọ̀rọ̀ Gíríìkì ἀσιτία lè tọ́ka sí àìní oúnjẹ tàbí fífi ara mọ́ra láti má jẹun; nínú àyíká ìjì yìí, ó ṣeé ṣe jù pé ó ń sọ nípa àìjẹun tó pẹ́.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, “ṣègbọ́ràn sí mi.” Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣe ohun tí ìtọ́ni tàbí ẹni tó ní àṣẹ sọ; níhìn-ín, ó ń tọ́ka sí títẹ̀lé ìmọ̀ràn Pọ́ọ̀lù.
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí àpapọ̀ ọ̀rọ̀ “ìpalára àti àdánù” yà ìbàjẹ́ tàbí ìpalára sọ́tọ̀ kúrò nínú àdánù ohun-ìní.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Lẹ́yìn tí wọ́n ti wà láìjẹun fún ìgbà pípẹ́
  rationale: Gbólóhùn olùnípò ọ̀rọ̀ yìí ṣàlàyé ipò tó wà ṣáájú ọ̀rọ̀ Pọ́ọ̀lù. ἀσιτία lè túmọ̀ sí àìrí oúnjẹ jẹ tàbí fífi ara mọ́ra láti má jẹun; nínú ọ̀rọ̀ ìjì yìí, àìjẹun fún ìgbà pípẹ́ ló bá àyíká mu jù.
- source_word: σταθεὶς
  choice: dìde
  rationale: Ọ̀rọ̀ náà fi hàn pé Pọ́ọ̀lù gbé ara rẹ̀ dúró láti bá gbogbo wọn sọ̀rọ̀; “dìde” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìṣe náà.
- source_word: ἐν μέσῳ αὐτῶν
  choice: láàárín wọn
  rationale: Èyí pa ìtumọ̀ pé ó dúró ní àárín àwùjọ náà mọ́ ní Yorùbá àdánidá.
- source_word: Ἔδει μέν
  choice: ó yẹ kí ẹ ti
  rationale: Àkókò ọ̀rọ̀ δεῖ ń tọ́ka sí ohun tó yẹ kí wọ́n ṣe ṣùgbọ́n tí wọn kò ṣe; ìtumọ̀ yìí pa ìbáwí pẹ̀lẹ́ Pọ́ọ̀lù mọ́.
- source_word: ὦ ἄνδρες
  choice: Ẹ̀yin ọkùnrin
  rationale: ἄνδρες ń bá àwọn ọkùnrin inú ọkọ̀ náà sọ̀rọ̀ ní tààrà; “Ẹ̀yin ọkùnrin” pa ìtọ́kasí akọ mọ́.
- source_word: πειθαρχήσαντάς μοι
  choice: fetí sí mi
  rationale: πειθαρχέω lè túmọ̀ sí ṣègbọ́ràn tàbí tẹ̀lé ìtọ́ni. Níhìn-ín, Pọ́ọ̀lù ń tọ́ka sí ìmọ̀ràn rẹ̀ tí ó yẹ kí wọ́n tẹ̀lé, nítorí náà “fetí sí mi” jẹ́ adayeba láìfi àṣẹ pàtó kún un.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: kí ẹ má sì ṣíkọ̀ láti Kírétè
  rationale: ἀνάγω jẹ́ ọ̀rọ̀ ìrìn omi fún fífi ọkọ̀ sí ojú omi tàbí ṣíkọ̀; “ṣíkọ̀ láti Kírétè” ṣe kedere ní Yorùbá.
- source_word: κερδῆσαί τε
  choice: nípa bẹ́ẹ̀, ẹ ì bá yẹra fún
  rationale: κερδαίνω níhìn-ín ní agbára ìtumọ̀ jíjàǹfààní nípa yíyẹra fún ohun búburú; ọ̀nà yìí sọ ìtumọ̀ àyíká náà di mímọ́.
- source_word: τὴν ὕβριν ταύτην
  choice: ìpalára yìí
  rationale: Bí ó tilẹ̀ jẹ́ pé ὕβρις sábà máa ń túmọ̀ sí ìwà ipá tàbí ẹ̀gàn, nínú ìrìn ọkọ̀ ojú omi yìí ó tọ́ka sí ìpalára tí ìjì mú wá.
- source_word: τὴν ζημίαν
  choice: àdánù náà
  rationale: ζημία túmọ̀ sí àdánù tàbí ohun tí a pàdánù. “Àdánù” yà á sọ́tọ̀ díẹ̀ kúrò nínú “ìpalára,” ó sì pa àpapọ̀ ọ̀rọ̀ Gíríìkì mọ́.
