    rationale: Ní àyíká ọkọ̀ ojú omi, ἐκτείνειν ἀγκύρας ń tọ́ka sí fífi tàbí títú àwọn ìdákọ̀ró síta; ìtúnṣe náà ń sọ ìṣe náà ní Yorùbá ìgbàlódé láì fi ìtumọ̀ míì kún un.
