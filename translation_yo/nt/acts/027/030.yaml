  terminology: “Àwọn atukọ̀,” “ọkọ̀ kékeré,” “òkun,” àti “àwọn ìdákọ̀ró” yẹ. Àlàyé ẹsẹ̀-àlàyé tó wà tẹlẹ̀ ní “láti orí ọkọ̀” lè dà bíi pé ó túmọ̀ sí òkè ọkọ̀; a ti ṣàlàyé kedere pé ìtumọ̀ rẹ̀ níbí ni apá iwájú ọkọ̀ ojú omi.
  issues:
