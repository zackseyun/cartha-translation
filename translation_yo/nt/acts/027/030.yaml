- from: Àwọn atukọ̀ sì ń wá ọ̀nà láti sá kúrò nínú ọkọ̀ náà. Wọ́n ti sọ ọkọ̀ kékeré náà kalẹ̀ sínú òkun, wọ́n sì ṣe bí ẹni pé àwọn fẹ́ na àwọn ìdákọ̀ró jáde láti iwájú ọkọ̀[a],
