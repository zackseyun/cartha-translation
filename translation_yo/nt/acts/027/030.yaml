  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì láti inú rẹ̀ dáadáa: àwọn atukọ̀ ń gbìyànjú láti sá, wọ́n sì ti sọ ọkọ̀ kékeré sínú òkun ní àwáwí pé wọ́n fẹ́ fi àwọn ìdákọ̀ró síta láti apá iwájú ọkọ̀. Síbẹ̀, ìsọ̀rọ̀ náà yẹ kí ó máa bá gbolohun tó ń tẹ̀ lé lọ, gẹ́gẹ́ bí gbolohun Gíríìkì ṣe rí, kì í ṣe gbólóhùn méjì tó yà pátápátá.'
