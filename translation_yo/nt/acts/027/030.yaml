source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: yo
  text: Nígbà tí àwọn atukọ̀ ń wá ọ̀nà láti sá kúrò nínú ọkọ̀ náà, tí wọ́n sì ti sọ ọkọ̀ kékeré náà kalẹ̀ sínú òkun ní àwáwí pé wọ́n fẹ́ fi àwọn ìdákọ̀ró síta láti apá iwájú ọkọ̀ náà[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti orí ọkọ̀ náà”; ìyẹn ni apá iwájú ọkọ̀ ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: àwọn atukọ̀
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn tó ń ṣiṣẹ́ lórí ọkọ̀ ojú omi.
- source_word: ζητούντων φυγεῖν
  choice: ń wá ọ̀nà láti sá
  rationale: Ó fi ìgbìyànjú àti ète wọn hàn ní èdè Yorùbá àdánidá, láì sọ pé wọ́n ti sá.
- source_word: ἐκ τοῦ πλοίου
  choice: kúrò nínú ọkọ̀ náà
  rationale: Ìtumọ̀ àdánidá ti kíkúrò nínú ọkọ̀ ojú omi náà.
- source_word: χαλασάντων τὴν σκάφην
  choice: wọ́n ti sọ ọkọ̀ kékeré náà kalẹ̀
  rationale: σκάφη jẹ́ ọkọ̀ kékeré tí ọkọ̀ ńlá gbé; yíyan ọ̀rọ̀ yìí yẹra fún fífi iṣẹ́ pàtó bí ‘ọkọ̀ ìgbàlà’ kún orísun.
- source_word: εἰς τὴν θάλασσαν
  choice: sínú òkun
  rationale: Ìtumọ̀ tààrà tí ó sì ṣe déédé ní Yorùbá.
- source_word: προφάσει ὡς
  choice: wọ́n sì ṣe bí ẹni pé
  rationale: Ó sọ àwáwí èké tí wọ́n fi bo ète gidi wọn ní ọ̀nà tó ṣe kedere àti àdánidá.
- source_word: ἐκ πρῴρης
  choice: láti iwájú ọkọ̀
  rationale: Ó mú apá ọkọ̀ tí a ń pè ní bow/prow yé òǹkàwé Yorùbá lásán láì lo ọ̀rọ̀ iṣẹ́-omi tí kò wọ́pọ̀.
- source_word: ἀγκύρας
  choice: àwọn ìdákọ̀ró
  rationale: Ọ̀rọ̀ Yorùbá tó pé fún anchors, pẹ̀lú ọ̀pọ̀ nǹkan gẹ́gẹ́ bí Gíríìkì.
- source_word: μελλόντων ἐκτείνειν
  choice: fẹ́ na ... jáde
  rationale: Ó pa ète tí wọ́n ń díbọ́n pé wọ́n ní mọ́, ó sì tẹ̀ lé àwòrán ἐκτείνω ti nínà ohun jáde; nínú àyíká yìí, ó túmọ̀ sí fífi àwọn ìdákọ̀ró síta.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò. A tú gbolohun Gíríìkì gígùn náà sí gbólóhùn méjì fún ìmúlòye, ṣùgbọ́n a fi àmì kọ́ńmá sí òpin láti fi hàn pé ẹsẹ náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá àdánidá Yorùbá mu.
