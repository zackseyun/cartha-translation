  to: Ṣùgbọ́n lẹ́yìn tí a gba abẹ́ ààbò erékùṣù kékeré kan tí a ń pè ní Kauda[a], a fẹ́rẹ̀ẹ́ má lè gba ọkọ̀ kékeré ti ọkọ̀ ojú omi náà mọ́ ọwọ́.
