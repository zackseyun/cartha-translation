id: ACT.27.16
reference: Acts 27:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí a gba abẹ́ ààbò erékùṣù kékeré kan tí a ń pè ní Kauda[a], a fẹ́rẹ̀ẹ́ má lè gba ọkọ̀ kékeré ti ọkọ̀ ojú omi náà mọ́ ọwọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí a kọjá sí ẹ̀gbẹ́ erékùṣù kékeré kan tí a ń pè ní Kauda, ní ibi tí ó dáàbò bo wa lọ́wọ́ afẹ́fẹ́.” Èdè Gíríìkì lo ọ̀rọ̀ iṣẹ́ atukọ̀ fún rírìn ọkọ̀ wọ ibi ààbò erékùṣù kúrò ní afẹ́fẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: erékùṣù kékeré kan
  rationale: Ọ̀rọ̀ νησίον jẹ́ ọ̀rọ̀ tí ó ń tọ́ka sí erékùṣù tí ó kéré; yíyan ‘erékùṣù kékeré kan’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí ó fi ìyípadà tàbí ìyàtọ̀ kékeré hàn; ‘Ṣùgbọ́n’ bá ìṣàn ọ̀rọ̀ mu níbí.
- source_word: ὑποδραμόντες
  choice: nígbà tí a sáré gba ibi ààbò ẹ̀gbẹ́
  rationale: Nínú èdè àwọn atukọ̀, ọ̀rọ̀ náà túmọ̀ sí fífi ọkọ̀ gba ẹ̀gbẹ́ ibi kan tí ó dáàbò bo ọkọ̀ lọ́wọ́ afẹ́fẹ́. Gbólóhùn yìí mú ìtumọ̀ náà yé òǹkàwé láìlo ọ̀rọ̀ iṣẹ́ atukọ̀ tí ó ṣòro.
- source_word: καλούμενον Καῦδα
  choice: tí a ń pè ní Kauda
  rationale: Ó jẹ́ gbólóhùn tí ó sọ orúkọ erékùṣù náà ní tààrà; ‘Kauda’ ń tẹ̀ lé àkọsílẹ̀ orúkọ ibi nínú ẹ̀dà Gíríìkì yìí.
- source_word: ἰσχύσαμεν μόλις
  choice: ó ṣòro fún wa gan-an
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi hàn pé iṣẹ́ náà fẹ́rẹ̀ẹ́ kọjá agbára wọn, tàbí pé pẹ̀lú ìṣòro ńlá ni wọ́n fi ṣe é.
- source_word: περικρατεῖς γενέσθαι
  choice: láti mú ... dúró ṣinṣin
  rationale: Gbólóhùn náà túmọ̀ sí láti rí ohun mú tàbí láti gba àkóso rẹ̀. Ní àyíká ọkọ̀ ojú omi yìí, ‘mú ... dúró ṣinṣin’ fi hàn pé wọ́n rí ọkọ̀ kékeré náà mú, wọ́n sì dá a sí ipò ààbò.
- source_word: τῆς σκάφης
  choice: ọkọ̀ kékeré ti ọkọ̀ ojú omi náà
  rationale: σκάφη ni ọkọ̀ kékeré tí ó jẹ́ ti ọkọ̀ ojú omi ńlá, ó sì ṣeé ṣe kí wọ́n máa fà á lẹ́yìn ọkọ̀ náà. Ìtumọ̀ yìí ṣe kedere ní Yorùbá ju ‘ọkọ̀’ lásán lọ.
