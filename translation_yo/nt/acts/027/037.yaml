base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: yo
  text: Àpapọ̀ gbogbo wa tí a wà nínú ọkọ̀ náà jẹ́ igba ó lé mẹ́rìndínlógójì ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘Àwa, gbogbo ọkàn nínú ọkọ̀ náà, jẹ́ igba ó lé mẹ́rìndínlógójì.’ Níhìn-ín, ‘ọkàn’ túmọ̀ sí ‘ènìyàn’ tàbí ‘àwọn ènìyàn,’ kì í ṣe ọkàn tí kò ní ara ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: wa ... jẹ́
  rationale: Ọ̀rọ̀-ìṣe náà wà ní ẹni àkọ́kọ́ ọ̀pọ̀ (‘a jẹ́’ tàbí ‘wa jẹ́’). Èdè Yorùbá adayébá fún kíkà iye gbogbo àwọn ènìyàn ni ‘Gbogbo wa ... jẹ́ ... ènìyàn,’ èyí sì pa ẹni àkọ́kọ́ ọ̀pọ̀ mọ́.
- source_word: δὲ
  choice: (kò farahàn ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: δὲ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ níbí. Kíkó ‘ṣùgbọ́n’ tàbí ‘nígbà náà’ wọlé lè mú ìyàtọ̀ tàbí àkókò tí Gíríìkì kò tẹnumọ́; ìtẹ̀síwájú ọ̀rọ̀ náà hàn láìsí àsopọ̀ ọ̀tọ̀ ní Yorùbá.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: Gbogbo wa ... ènìyàn
  rationale: ψυχαί túmọ̀ sí àwọn ènìyàn tàbí ẹ̀mí alààyè ní ọ̀rọ̀ kíkà àwọn tó wà lórí ọkọ̀, kì í ṣe ẹ̀mí aláìlérò ara ní pàtó. ‘Gbogbo wa ... ènìyàn’ ṣe àfihàn πᾶσαι àti ìtumọ̀ àyíká náà lọ́nà adayébá.
- source_word: ἐν τῷ πλοίῳ
  choice: tí ó wà nínú ọkọ̀ náà
  rationale: Àṣàyàn yìí tú ‘nínú ọkọ̀ náà’ ní tààrà, ó sì bá èdè Yorùbá mu fún àwọn tó wà nínú ọkọ̀ ojú omi.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: igba ó lé mẹ́rìndínlógójì
  rationale: 'Eyi ni ìṣírò Yorùbá fún 276: igba (200) ó lé mẹ́rìndínlógójì (76), tí ó pa iye Gíríìkì mọ́.'
theological_decisions:
- issue: Ìtumọ̀ ψυχαί
  choice: ènìyàn
  alternative: ọkàn
  rationale: Nínú àyíká kíkà àwọn tó wà nínú ọkọ̀, ψυχαί ń tọ́ka sí àwọn ènìyàn lápapọ̀. ‘Ọkàn’ lè mú kí òǹkàwé rò pé apá aláìlérò ara ènìyàn nìkan ni a ń sọ.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ adayébá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ọkọ̀’ gẹ́gẹ́ bí ọkọ̀ ojú omi nítorí àyíká ìtàn.
