id: ACT.27.42
reference: Acts 27:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: yo
  text: Àwọn ọmọ ogun sì gbèrò láti pa àwọn ẹlẹ́wọ̀n, kí ẹnikẹ́ni má bàa lúwẹ̀ẹ́ kúrò, kí ó sì sá àsálà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: gbèrò
  rationale: Ó sọ ní Yorùbá àdánidá pé èrò tàbí ìpinnu bẹ̀rẹ̀ láàárín àwọn ọmọ ogun, láìfi kún ìtumọ̀ orísun.
- source_word: τοὺς δεσμώτας
  choice: àwọn ẹlẹ́wọ̀n
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ àwọn tí a dè tàbí fi sínú àhámọ́ mu.
- source_word: ἀποκτείνωσιν
  choice: pa
  rationale: Ìtumọ̀ tààrà, kedere fún pípa ènìyàn.
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: lúwẹ̀ẹ́ sá àsálà
  rationale: 'Ó pa méjèèjì mọ́: lílúwẹ̀ẹ́ kúrò ní ibi náà àti yíyọ lọ láìjẹ́ kí a mú ẹni náà.'
theological_decisions:
- issue: Agbára gbolohun μή τις
  choice: kí ẹnikẹ́ni má bàa
  alternative: nítorí ẹ̀rù pé ẹnikẹ́ni lè
  rationale: Àṣàyàn yìí pa ète ìdènà tí gbolohun Gíríìkì ń fi hàn mọ́, láìsọ ó di ìdánilójú tàbí àṣẹ.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì; a lo “sì” gẹ́gẹ́ bí àmì ìtẹ̀síwájú ìtàn fún δέ, kì í ṣe ọ̀rọ̀ àkókò bí “nígbà náà.”
