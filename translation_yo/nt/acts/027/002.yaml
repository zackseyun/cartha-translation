reference: Acts 27:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: yo
  text: Nígbà náà, a wọ ọkọ̀ ojú omi kan láti Adramítíọ̀mù, tí yóò lọ sí àwọn ibi ní etíkun Éṣíà,[a][b] a sì ṣíkọ̀ sí òkun; Aristákù, ará Makedóníà kan láti Tẹsalóníkà, sì wà pẹ̀lú wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éṣíà níhìn-ín ni ẹkùn ìjọba Róòmù ní ìwọ̀-oòrùn Éṣíà Kékeré, kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà òde òní.
    reason: cultural_note
  - marker: b
    text: Tàbí, “sí àwọn ibi lẹ́gbẹ̀ẹ́ Éṣíà,” tàbí “sí àwọn èbúté ní etíkun Éṣíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: a wọ ọkọ̀ ojú omi
  rationale: Ó túmọ̀ sí wíwọ inú ọkọ̀ ojú omi; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi ìṣe tó ṣáájú fífi ọkọ̀ sí òkun hàn.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kì í ṣe pé ó ń fi ìtakora líle hàn.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: ọkọ̀ ojú omi kan láti Adramítíọ̀mù
  rationale: Àpèjúwe Gíríìkì tọ́ka sí ìlú tí ọkọ̀ náà ti wá tàbí èbúté rẹ̀; fífi orúkọ ìlú náà hàn ṣe kedere ju dídá ajẹtífù tuntun ní Yorùbá lọ.
- source_word: μέλλοντι πλεῖν
  choice: tí ó fẹ́ lọ
  rationale: μέλλω pẹ̀lú infinitive lè tọ́ka sí ohun tí ó fẹ́ ṣẹlẹ̀ tàbí ète; ‘tí ó fẹ́ lọ’ bá àyíká ìrìn-àjò náà mu láìfi ìtumọ̀ àkókò tí ó le jù kún un.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: sí àwọn ibi ní etíkun Éṣíà
  rationale: κατά pẹ̀lú accusative níhìn-ín ní agbára ìpínlẹ̀/àgbègbè, ó ń tọ́ka sí àwọn ibi lẹ́gbẹ̀ẹ́ Éṣíà; àyíká ọkọ̀ ojú omi mú kí ‘ní etíkun’ jẹ́ ìtumọ̀ àdánidá, ṣùgbọ́n àkọ́silẹ̀ ẹsẹ̀ fi yíyan tó sún mọ́ ọ̀rọ̀ Gíríìkì sílẹ̀.
- source_word: Ἀσίαν
  choice: Éṣíà
  rationale: A pa orúkọ tó mọ̀ mọ́, ṣùgbọ́n àkọ́silẹ̀ ṣàlàyé pé ó jẹ́ ẹkùn ìjọba Róòmù nígbà náà, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì òde òní.
- source_word: ἀνήχθημεν
  choice: a sì ṣíkọ̀ sí òkun
  rationale: Èyí jẹ́ gbólóhùn ọkọ̀ ojú omi fún kíkúrò ní èbúté lọ sí òkun; ‘ṣíkọ̀ sí òkun’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́.
- source_word: ὄντος σὺν ἡμῖν
  choice: wà pẹ̀lú wa
  rationale: A sọ genitive absolute náà di gbólóhùn Yorùbá tó rọrùn láti kà, nígbà tí a pa ìtumọ̀ ipò alábàáṣiṣẹ́ mọ́.
- source_word: Ἀριστάρχου
  choice: Aristákù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Μακεδόνος
  choice: ará Makedóníà kan
  rationale: Ó fi ẹ̀yà tàbí agbègbè Aristákù hàn ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: Θεσσαλονικέως
  choice: láti Tẹsalóníkà
  rationale: Ó sọ ìlú rẹ̀ di mímọ̀ láìto àwọn orúkọ ìbílẹ̀ méjì jọ ní ọ̀nà tí kò rọrùn.
