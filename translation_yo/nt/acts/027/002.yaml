translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè ìtàn tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kikún níbi tó bá jẹ́ àdánidá, a sì tú àwọn àpèjúwe ibi àti ènìyàn sí ọ̀nà tí Yorùbá fi ń sọ̀rọ̀.
