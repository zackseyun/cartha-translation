    issue: “etíkun omi kan” fún κόλπον
    rationale: Etíkun omi jẹ́ coast/shore; κόλπος ní àyíká yìí jẹ́ bay tàbí inlet. Ìtumọ̀ àlàyé ló yẹ kí ó fi hàn pé omi wọ inú ilẹ̀.
  - severity: low
    issue: “ibi tí yanrìn wà” fún αἰγιαλόν
    rationale: Ó lè túmọ̀ sí ibi tí yanrìn wà lásán, nígbà tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí etí omi/beach. “Etí omi” pa ìtumọ̀ náà mọ́ láì sọ pé yanrìn ni etíkun náà.
  - severity: low
