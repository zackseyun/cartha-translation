source:
  edition: SBLGNT
  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́, wọn kò dá ilẹ̀ náà mọ̀; ṣùgbọ́n wọ́n ṣàkíyèsí ibi kan tí omi òkun wọ inú ilẹ̀, tí ó ní etí omi. Wọ́n pinnu, bí wọ́n bá lè ṣe é, láti mú ọkọ̀ náà wọ etí omi náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti mú ọkọ̀ náà gún sí etí omi.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi agbára darí ọkọ̀ náà sí etí omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Ọ̀nà Yorùbá àdánidá fún dídé ìmọ́lẹ̀ òwúrọ̀ ni èyí; ó sì pa gbólóhùn àkókò Gíríìkì mọ́ láì fi àmì àsọyé mìíràn kún un.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: wọn kò dá ilẹ̀ náà mọ̀
  rationale: “Dá ... mọ̀” túmọ̀ sí mímọ̀ tàbí dídámọ̀ ohun tí a rí; “ilẹ̀” pa ìtumọ̀ gbòòrò γῆ mọ́, bí ó tilẹ̀ jẹ́ pé etí ilẹ̀ lẹ́bàá òkun ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: κόλπον δέ τινα κατενόουν
  choice: ṣùgbọ́n wọ́n ṣàkíyèsí etíkun omi kan
  rationale: “Ṣàkíyèsí” fi ìwòye pẹ̀lú àfiyèsí hàn. “Etíkun omi kan” jẹ́ ọ̀nà tí òǹkàwé Yorùbá lè fi lóye κόλπος gẹ́gẹ́ bí ibi tí omi òkun wọ inú ilẹ̀, nígbà tí “kan” pa àìsọ pàtó τινα mọ́.
- source_word: ἔχοντα αἰγιαλὸν
  choice: tí ó ní ibi tí yanrìn wà
  rationale: Ọ̀rọ̀ náà tọ́ka sí etí omi tàbí ibi tí ọkọ̀ lè gún sí; gbolohun yìí jẹ́ kó ṣe kedere ní Yorùbá láì sọ pé gbogbo etíkun náà jẹ́ yanrìn pátápátá.
- source_word: εἰς ὃν ἐβουλεύοντο εἰ δύναιντο ἐξῶσαι τὸ πλοῖον
  choice: wọ́n sì pinnu láti darí ọkọ̀ náà dé orí ibẹ̀ bí wọ́n bá lè ṣe é
  rationale: “Pinnu” mú èrò tàbí ìpinnu βουλεύομαι jáde; “bí wọ́n bá lè ṣe é” pa àìdánilójú εἰ δύναιντο mọ́. “Darí ọkọ̀ ... dé orí ibẹ̀” jẹ́ èdè Yorùbá àdánidá fún fífi agbára mú ọkọ̀ gún sí etí omi.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àtẹ̀jáde tí ó níyì, tí ó sì ṣeé lóye ni a lò. A yan ọ̀rọ̀ ojoojúmọ́ bí “ilẹ̀ mọ́,” “dá ... mọ̀,” àti “ṣàkíyèsí,” a sì yẹra fún àfikún ẹ̀kọ́ ìsìn tàbí ìsọ pàtó tí orísun kò sọ.
