  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìlànà gbogbogbò rẹ̀ dáadáa: òwúrọ̀ dé, wọn kò dá ilẹ̀ náà mọ̀, wọ́n rí ibi omi kan, wọ́n sì pinnu láti mú ọkọ̀ náà wọ ibẹ̀ bí ó bá ṣeé ṣe. Ṣùgbọ́n “etíkun omi kan” túmọ̀ sí etí òkun/etí omi ju “bay” lọ, “ibi tí yanrìn wà” sì lè dín αἰγιαλός kù sí ibi tí yanrìn wà ní gbogbogbò, kì í ṣe etí omi tí ọkọ̀ lè balẹ̀ sí.'
  naturalness: “Nígbà tí ilẹ̀ mọ́” jẹ́ ìlò Yorùbá tó ṣeé gbà, ṣùgbọ́n ìtẹ̀lé “ilẹ̀ náà” lè dà bíi pé ọ̀rọ̀ kan náà ni a ń tún sọ ní ìtumọ̀ méjì. Ìtúnṣe náà ń ṣe kedere pé ibi náà jẹ́ ààyè tí omi òkun wọ inú ilẹ̀, ní èdè àdánidá.
  terminology: A túmọ̀ κόλπος ní ọ̀nà àlàyé, “ibi kan tí omi òkun wọ inú ilẹ̀,” láti pa ìtumọ̀ “bay” mọ́ láì fi ọ̀rọ̀ etíkun rọ́pò rẹ̀. A túmọ̀ αἰγιαλός sí “etí omi,” a sì pa agbára/ìfẹ́ láti mú ọkọ̀ wọ etí omi mọ́ nínú àlàyé ẹsẹ̀ ìsàlẹ̀.
