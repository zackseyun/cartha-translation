revisions:
- from: Nígbà tí ilẹ̀ mọ́, wọn kò dá ilẹ̀ náà mọ̀, ṣùgbọ́n wọ́n ṣàkíyèsí etíkun omi kan tí ó ní ibi tí yanrìn wà; wọ́n sì pinnu láti darí ọkọ̀ náà dé orí ibẹ̀ bí wọ́n bá lè ṣe é.[a]
  to: Nígbà tí ilẹ̀ mọ́, wọn kò dá ilẹ̀ náà mọ̀; ṣùgbọ́n wọ́n ṣàkíyèsí ibi kan tí omi òkun wọ inú ilẹ̀, tí ó ní etí omi. Wọ́n pinnu, bí wọ́n bá lè ṣe é, láti mú ọkọ̀ náà wọ etí omi náà[a].
  rationale: 'A ṣàtúnṣe ìtumọ̀ “bay” àti “beach” kí ó sún mọ́ Gíríìkì: bay jẹ́ ibi tí omi òkun wọ inú ilẹ̀, etí omi sì jẹ́ ibi ìbalẹ̀ ọkọ̀. A tún gbe àmì ẹsẹ̀ ìsàlẹ̀ sún mọ́ ọ̀rọ̀ ἐξῶσαι τὸ πλοῖον. Ìtumọ̀ náà ṣì pa ìpinnu tí ó ní àìdánilójú, “bí wọ́n bá lè ṣe é,” mọ́.'
