id: ACT.27.22
reference: Acts 27:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: yo
  text: Nísinsìnyí, mo rọ̀ yín pé kí ẹ ní ìgboyà[a], nítorí kò sí ẹnikẹ́ni nínú yín tí yóò pàdánù ìwàláàyè rẹ̀[b]; ọkọ̀ ojú omi náà nìkan ni yóò sọnù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí inú yín le” tàbí “ẹ má ṣe rẹ̀wẹ̀sì.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ìpàdánù ìwàláàyè.” Níhìn-ín, ψυχή túmọ̀ sí ìwàláàyè ti ara, kì í ṣe ọkàn ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: Nísinsìnyí
  rationale: Ó jẹ́ gbólóhùn àkókò tí ó fi ìṣírí Pọ́ọ̀lù fún wọn ní ipò tí wọ́n wà nígbà náà hàn ní Yorùbá àdánidá.
- source_word: παραινῶ
  choice: mo rọ̀ yín
  rationale: ‘Rọ̀’ mú agbára ìṣírí àti ìmọ̀ràn pàtàkì tí ọ̀rọ̀ Gíríìkì ní jáde láì di ọ̀rọ̀ líle tàbí àjèjì.
- source_word: εὐθυμεῖν
  choice: kí ẹ ní ìgboyà
  rationale: Ó sọ jíjẹ́ aláyọ̀ ní ọkàn àti dídúró ṣinṣin nínú ewu; ‘ní ìgboyà’ bá ipò ìjì lórí òkun mu ní Yorùbá òde òní.
- source_word: ἀποβολὴ
  choice: ìpàdánù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí a pàdánù, kì í ṣe fífi ohun kan sọ nù ní ti gidi.
- source_word: ψυχῆς
  choice: ẹ̀mí
  rationale: Nínú àyíká yìí, ‘ẹ̀mí’ ń tọ́ka sí ìwàláàyè ènìyàn tí ikú lè mú kúrò, kì í ṣe dandan apá aláìrí tí a ń pè ní ọkàn.
- source_word: οὐδεμία ἔσται
  choice: kò ní sí ... kankan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìsọnú ọjọ́ iwájú àti ìtẹnumọ́ òdì mọ́.
- source_word: ἐξ ὑμῶν
  choice: láàárín yín
  rationale: Ó fi hàn pé kò sí ẹnì kankan nínú gbogbo àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ tí yóò kú.
- source_word: πλὴν τοῦ πλοίου
  choice: ọkọ̀ ojú omi náà nìkan ni yóò sọnù
  rationale: Gíríìkì jẹ́ kúkúrú níbí, ṣùgbọ́n ó ṣe kedere pé ọkọ̀ ni ohun tí yóò sọnù, kì í ṣe ẹ̀mí; gbolohun yìí mú ìyàtọ̀ náà ṣe kedere ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ìlérí pé kò sí ẹni tí yóò kú
  choice: A túmọ̀ ọ́ sí ‘ẹ̀mí’ ní ìtumọ̀ ìwàláàyè ti ara, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
  alternative: ‘ọkàn’ gẹ́gẹ́ bí apá ènìyàn tí kì í ṣe ara
  rationale: Àyíká ìjàmbá ọkọ̀ ojú omi ń sọ nípa bóyá àwọn ènìyàn yóò kú tàbí yóò yè; kò ń kọ́ni ní ẹ̀kọ́ pàtó nípa ìyàtọ̀ láàárín ara àti ọkàn.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn kejì tú ìsọ̀rí Gíríìkì tí ó kúkúrú sí ọ̀nà Yorùbá àdánidá, láì yí ìtumọ̀ rẹ̀ padà.
