revisions:
- from: Nítorí náà, mo rọ̀ yín pé kí ẹ jẹ oúnjẹ díẹ̀, nítorí èyí wà fún ìgbàlà yín[a]; nítorí kò sí irun kan láti orí ẹnikẹ́ni nínú yín tí yóò ṣègbé.
  to: Nítorí náà, mo rọ̀ yín pé kí ẹ jẹ oúnjẹ díẹ̀, nítorí ó ṣe pàtàkì fún ìlàájá yín[a]; nítorí kò sì ní sí irun kan ní orí ẹnikẹ́ni nínú yín tí yóò ṣègbé.
  rationale: 'The revision gives σωτηρία its contextually required physical sense in clear modern Standard Yoruba and preserves its broader lexical alternative in the footnote. It also recasts the final idiom into natural Yoruba without reducing its comprehensive force: no one will lose even a hair.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the exhortation to eat and the assurance that everyone will survive. However, the main-text “ìgbàlà” can naturally be heard as spiritual salvation in Yoruba despite the explicitly physical maritime context. A contextual physical rendering is safer, while retaining “ìgbàlà” as a footnoted lexical alternative.
  naturalness: “Kí ẹ jẹ oúnjẹ díẹ̀” and “kò sí irun kan láti orí…” are understandable, but the latter is stiff Yoruba. “Kò sì ní sí irun kan ní orí ẹnikẹ́ni nínú yín tí yóò ṣègbé” is more idiomatic and retains the Greek’s emphatic assurance.
  terminology: Render σωτηρία as “ìlàájá” in the text for physical preservation/survival, with a footnote preserving “ìgbàlà” as an alternative. This neither suppresses the Greek lexical range nor imports a soteriological sense into this context.
  issues:
  - severity: medium
    issue: “Ìgbàlà yín” in the main text is potentially misleading in this context.
    rationale: Although ìgbàlà can denote rescue, its dominant biblical usage readily suggests spiritual salvation. The immediate context and the source phrase concern survival of the shipwreck.
  - severity: low
    issue: The hair idiom is too literal in the draft.
    rationale: “Irun kan láti orí ẹnikẹ́ni…” is grammatical but less natural than expressing the hair as being on a person’s head.
  revised_text: Nítorí náà, mo rọ̀ yín pé kí ẹ jẹ oúnjẹ díẹ̀, nítorí ó ṣe pàtàkì fún ìlàájá yín[a]; nítorí kò sì ní sí irun kan ní orí ẹnikẹ́ni nínú yín tí yóò ṣègbé.
  revised_footnotes:
  - marker: a
    text: Tàbí, “fún ìgbàlà yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbàlà,” “ìdáǹdè,” tàbí “ìlàájá”; níhìn-ín, ó ń tọ́ka sí bí wọn yóò ṣe yè nínú ewu náà.
    reason: lexical_alternative
  revision_rationale: 'The revision gives σωτηρία its contextually required physical sense in clear modern Standard Yoruba and preserves its broader lexical alternative in the footnote. It also recasts the final idiom into natural Yoruba without reducing its comprehensive force: no one will lose even a hair.'
