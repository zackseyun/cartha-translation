id: ACT.27.34
reference: Acts 27:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: yo
  text: Nítorí náà, mo rọ̀ yín pé kí ẹ jẹ oúnjẹ díẹ̀, nítorí ó ṣe pàtàkì fún ìlàájá yín[a]; nítorí kò sì ní sí irun kan ní orí ẹnikẹ́ni nínú yín tí yóò ṣègbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìgbàlà yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbàlà,” “ìdáǹdè,” tàbí “ìlàájá”; níhìn-ín, ó ń tọ́ka sí bí wọn yóò ṣe yè nínú ewu náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí Pọ́ọ̀lù ti sọ ṣáájú.
- source_word: παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Ó sọ ìrọ̀lẹ́kún tí ó lágbára, ṣùgbọ́n tí ó tún jẹ́ ọ̀rọ̀ ìṣírí.
- source_word: μεταλαβεῖν τροφῆς
  choice: kí ẹ jẹ oúnjẹ díẹ̀
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí jíjẹ tàbí gbígba oúnjẹ; èyí jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: nítorí èyí wà fún ìgbàlà yín
  rationale: Ó pa ọ̀rọ̀ σωτηρία mọ́ gẹ́gẹ́ bí ‘ìgbàlà,’ nígbà tí àlàyé ìsàlẹ̀ fi hàn pé nínú àyíká yìí ó ń tọ́ka sí pípa ẹ̀mí wọn mọ́ nínú ewu òkun.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Ó pa ìtumọ̀ pínpín náà mọ́, pé ìlérí náà kan olúkúlùkù wọn.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: irun kan láti orí
  rationale: Ó tẹ̀lé àwòrán èdè orísun ní kíkún, ó sì ń fi ààbò pípé hàn.
- source_word: ἀπολεῖται
  choice: yóò ṣègbé
  rationale: Ó pa agbára ọ̀rọ̀ ἀπόλλυμι mọ́, bí ó tilẹ̀ jẹ́ pé lílò rẹ̀ fún irun jẹ́ àwòrán èdè tí ń tẹnumọ́ pé kò sí ìpalára kankan tí yóò dé bá wọn.
theological_decisions:
- issue: Ìtumọ̀ σωτηρία nínú àyíká ọ̀rọ̀
  choice: ìgbàlà, pẹ̀lú àlàyé pé ó túmọ̀ sí pípa ẹ̀mí mọ́ nínú ewu yìí
  alternative: ààbò tàbí pípa ẹ̀mí yín mọ́
  rationale: Àyíká ìjì àti ìparun ọkọ̀ fi hàn pé ìgbàlà ti ara ni a ń sọ̀rọ̀ nípa rẹ̀. Síbẹ̀, fífi ‘ìgbàlà’ sínú ọ̀rọ̀ pàtàkì pa ìbú semantic σωτηρία mọ́, àlàyé ìsàlẹ̀ sì dènà ìtumọ̀ rẹ̀ sí ìgbàlà ẹ̀mí nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ fún ẹnìkan ṣoṣo.
