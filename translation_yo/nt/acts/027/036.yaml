  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: yo
  text: Nígbà náà, gbogbo wọn gba ìgboyà[a], wọ́n pẹ̀lú sì jẹ oúnjẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “wọ́n wà ní ẹ̀mí rere” tàbí “inú wọn dùn.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “àwọn fúnra wọn pẹ̀lú gba oúnjẹ,” èyí tó tẹnumọ́ pé àwọn yòókù náà tẹ̀ lé àpẹẹrẹ Pọ́ọ̀lù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: ní ìgboyà
  rationale: Ó ṣàfihàn pé ọkàn wọn balẹ̀, ìgboyà sì wọ inú wọn lẹ́yìn ìbẹ̀rù; ó bá àyíká ìtàn náà mu ju ọ̀rọ̀ tí yóò túmọ̀ sí pé inú wọn kàn dùn lọ.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kì í ṣe pé ó ń fi ìyàtọ̀ líle hàn.
- source_word: γενόμενοι
  choice: ní
  rationale: Pẹ̀lú εὔθυμοι, ó tọ́ka sí wíwọ ipò tuntun kan; gbolohun Yorùbá “ní ìgboyà” sọ ìyípadà yìí ní ọ̀nà àdánidá.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tẹnumọ́ gbogbo àwọn ènìyàn inú ọkọ̀ náà lápapọ̀.
- source_word: καὶ αὐτοὶ
  choice: àwọn náà sì
  rationale: Ó pa agbára ìtẹnumọ́ àti àfikún mọ́ pé àwọn yòókù náà tẹ̀ lé àpẹẹrẹ Pọ́ọ̀lù.
- source_word: προσελάβοντο
  choice: jẹ
  rationale: Ní ìsopọ̀ pẹ̀lú τροφῆς, ìtumọ̀ àdánidá ní Yorùbá ni pé wọ́n jẹ oúnjẹ; èyí yẹra fún gbólóhùn líle “mú oúnjẹ.”
- source_word: τροφῆς
  choice: oúnjẹ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ohun tí ènìyàn ń jẹ láti gba okun.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tó níyì tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ní ìgboyà” láti pa ìyípadà sí ọkàn rere mọ́ láì sọ ọ́ di ayọ̀ fẹ́rẹ́fẹ́; “àwọn náà sì” sì pa ìtẹnumọ́ καὶ αὐτοὶ mọ́.
