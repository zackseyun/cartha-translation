  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: yo
  text: Ní ibẹ̀ náà, balógun ọgọ́rùn-ún náà rí ọkọ̀ ojú omi Alẹkisáńdíríà kan tí ń lọ sí Ítálì, ó sì mú wa gun ọkọ̀ náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Ní bẹ̀
  rationale: Ó tọ́ka sí ibi tí ìtàn dé, nígbà tí ‘ó sì’ lórí gbólóhùn kejì ń jẹ́ kí ìṣàn ìtàn Gíríìkì hàn lọ́nà àdánidá ní Yorùbá.
- source_word: εὑρὼν
  choice: rí
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; lílo ọ̀rọ̀-ìṣe tí ó pé jẹ́ àdánidá ní Yorùbá, ó sì pa tẹ̀lé-tẹ̀lé ìṣe náà mọ́.
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Èyí túmọ̀ ipò ológun Róòmù tó ń ṣàkóso nǹkan bí ọgọ́rùn-ún ọmọ ogun, ó sì ṣe kedere fún òǹkàwé Yorùbá.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: ọkọ̀ ojú omi kan láti Alẹkisáńdíríà
  rationale: Àpèjúwe Ἀλεξανδρῖνον lè tọ́ka sí ìpilẹ̀ tàbí ibi ìforúkọsílẹ̀ ọkọ̀ náà; ‘láti Alẹkisáńdíríà’ sọ ìbátan ibi náà ní kedere láì fi ohun tí ẹsẹ̀ kò sọ kún un.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: tí ó ń lọ sí Ítálì
  rationale: Present participle náà fi ìrìn ọkọ̀ ojú omi àti ibi tí ó ń lọ hàn; gbólóhùn yìí jẹ́ ti àdánidá, ó sì pa ìtumọ̀ ọ̀nà tàbí ibi-àfojúsùn mọ́.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: ó sì mú wa wọ inú rẹ̀
  rationale: 'Ọ̀rọ̀-ìṣe náà jẹ́ causative: balógun náà mú kí wọ́n wọ ọkọ̀. ‘Mú wa wọ inú rẹ̀’ jẹ́ Yorùbá àdánidá tí ó pa agbára ìtumọ̀ yẹn mọ́.'
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún ìtàn. A tú ‘centurion’ sí ‘balógun ọ̀rún’ dípò yíyá ọ̀rọ̀ Gẹ̀ẹ́sì wọlé.
