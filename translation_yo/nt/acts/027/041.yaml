  source_fidelity: 'Ìtumọ̀ náà mú ìṣẹ̀lẹ̀ pàtàkì náà dáadáa: ọkọ̀ náà gúnlẹ̀, iwájú rẹ̀ dì mọ́lẹ̀, ẹ̀yìn rẹ̀ sì ń fọ́. Ṣùgbọ́n “agbára omi” fi “omi” kún ὑπὸ τῆς βίας, níbi tí Gíríìkì ti fi aṣojú agbára náà sílẹ̀ ní gbogbogbò. Pẹ̀lú èyí, gbolohun nípa iwájú ọkọ̀ yẹ kí ó sọ ìdìmú rẹ̀ hàn ní tààrà.'
