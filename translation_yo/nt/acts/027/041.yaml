id: ACT.27.41
reference: Acts 27:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n wọ ibi kan tí omi méjì ti pàdé[a], wọ́n sì fi ọkọ̀ náà gúnlẹ̀; iwájú ọkọ̀ náà di mọ́lẹ̀, ó sì dúró ṣinṣin láìyí, ṣùgbọ́n ẹ̀yìn ọkọ̀ náà ń fọ́ túútúú nítorí agbára náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi kan láàárín omi méjì.” Ọ̀rọ̀ Gíríìkì náà ṣọ̀wọ́n; ó lè tọ́ka sí ọ̀nà omi, bèbè iyanrìn, tàbí ibi tí ìṣàn omi méjì tàbí àgbègbè omi méjì ti pàdé.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: wọ́n wọ
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ọkọ̀ náà dé ibi eléwu náà hàn láìsọ ọ́ di pé ó kọlu ohun kan.
- source_word: τόπον διθάλασσον
  choice: ibi kan tí omi méjì ti pàdé
  rationale: Ó pa àwòrán ohun méjì ti omi mọ́, nígbà tí kò sọ ibi náà ní pàtó ju Gíríìkì lọ.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: wọ́n fi ọkọ̀ náà gúnlẹ̀
  rationale: Ọ̀rọ̀ ojú omi náà túmọ̀ sí fífi ọkọ̀ gún ilẹ̀ tàbí etíkun; yíyan yìí ṣe kedere ní Yorùbá.
- source_word: πρῷρα
  choice: iwájú ọkọ̀
  rationale: Ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé gbogbo ju lílo ọ̀rọ̀ amọ̀ṣẹ́ ojú omi lọ.
- source_word: ἐρείσασα ἔμεινεν ἀσάλευτος
  choice: dúró ṣinṣin láìṣeéṣí
  rationale: Ó ṣọ̀kan ìtumọ̀ pé iwájú ọkọ̀ náà di mọ́lẹ̀, kò sì lè yí.
- source_word: πρύμνα
  choice: ẹ̀yìn rẹ̀
  rationale: Ó ń tọ́ka sí ẹ̀yìn ọkọ̀ náà ní èdè adayébá.
- source_word: ἐλύετο
  choice: ń fọ́ ... túútúú
  rationale: Àmì àkókò aláìpé náà fi ìfọ́nká tí ń bá a lọ hàn.
- source_word: ὑπὸ τῆς βίας
  choice: agbára omi
  rationale: βία túmọ̀ sí agbára tàbí ìwà ipá; àyíká ọkọ̀ ojú omi mú kí ‘omi’ jẹ́ àlàyé adayébá, láìfi ‘ìgbì’ tí kò fara hàn ní Gíríìkì kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ọ̀wọ̀, adayébá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘iwájú ọkọ̀’ àti ‘ẹ̀yìn ọkọ̀’ dípò àwọn ọ̀rọ̀ amọ̀ṣẹ́ tí kò wọ́pọ̀; a sì pa àìdánilójú διθάλασσος mọ́ nínú àkọ́kọ́ àti àlàyé ìsàlẹ̀.
