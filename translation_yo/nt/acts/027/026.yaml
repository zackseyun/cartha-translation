  text: But we must run aground on some island[a].
translation:
  language: yo
  text: Ṣùgbọ́n ó pọn dandan kí a gbá ọkọ̀ wa mọ́lẹ̀ sí erékùṣù kan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí afẹ́fẹ́ gbé wa lọ sí etí erékùṣù kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn sí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì bá ọ̀rọ̀ náà lọ lọ́nà àdánidá.
- source_word: εἰς νῆσον
  choice: sí erékùṣù kan
  rationale: “Erékùṣù” túmọ̀ νῆσος ní tààrà, “kan” sì pa àìsọ pàtó tí τινα ní mọ́; “sí” fi ìtọ́sọ́nà ìṣípò hàn.
- source_word: δεῖ ἡμᾶς
  choice: ó pọn dandan kí a
  rationale: Èyí fi agbára ìdandan δεῖ hàn ní Yorùbá àdánidá, nígbà tí “a” dúró fún ἡμᾶς.
- source_word: ἐκπεσεῖν
  choice: lọ kọ́
  rationale: Nínú ọ̀rọ̀ ìrìn omi, ọ̀rọ̀ náà lè túmọ̀ sí kí ọkọ̀ lọ kọ́ sí etí ilẹ̀; yíyan yìí jẹ́ kíkúrú, ó sì bójú mu ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa ìtumọ̀ àìsọ pàtó ti τινα àti agbára ìdandan ti δεῖ mọ́.
