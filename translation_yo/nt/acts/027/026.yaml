  terminology: “Erékùṣù” yẹ fún νῆσος; “ó pọn dandan” fi δεῖ hàn dáadáa. “Gbá ọkọ̀ mọ́lẹ̀” jẹ́ ọ̀nà tí ó ṣe kedere láti fi ìtumọ̀ ojú omi ti ἐκπεσεῖν hàn láì sọ ohun tí Gíríìkì kò sọ nípa ìdí tí ọkọ̀ fi dé ibẹ̀.
