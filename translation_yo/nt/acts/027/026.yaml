  source_fidelity: Ìtumọ̀ náà pa ìdandan (δεῖ), ẹni àkọ́kọ́ púpọ̀ (ἡμᾶς), àti erékùṣù tí a kò sọ pàtó (νῆσον τινα) mọ́. Ṣùgbọ́n “a lọ kọ́” lè túmọ̀ sí ‘a lọ́ọ̀ kọ́ ẹ̀kọ́’ ní Yorùbá, nítorí náà kò ṣe kedere ní àyíká ọkọ̀ ojú omi pé ọkọ̀ ni yóò gbá mọ́lẹ̀/ṣègbé sí etí ilẹ̀.
