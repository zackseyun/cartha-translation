  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti jẹun yó[a], wọ́n bẹ̀rẹ̀ sí í mú kí ọkọ̀ náà fẹ́rẹ̀[b] nípa títu àlìkámà náà[c] sínú òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí oúnjẹ ti tẹ́ wọn lọ́rùn” tàbí “nígbà tí inú wọn ti kún fún oúnjẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń mú kí ọkọ̀ náà fẹ́rẹ̀” tàbí “wọ́n mú kí ọkọ̀ náà fẹ́rẹ̀.” Imperfect Gíríìkì náà lè tẹnu mọ́ ìṣe tí ń lọ lọ́wọ́ tàbí ìbẹ̀rẹ̀ ìṣe náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ọkà.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ tó gbòòrò sí i, ṣùgbọ́n ó ṣeé ṣe kó tọ́ka sí àlìkámà níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: tí wọ́n … ti jẹ oúnjẹ yó
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé oúnjẹ ti kún inú wọn tàbí pé wọ́n ti jẹun débi tí ebi kò fi pa wọ́n mọ́. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ àkókò ti participle náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” bá iṣẹ́ yẹn mu ní Yorùbá.
- source_word: ἐκούφιζον
  choice: wọ́n bẹ̀rẹ̀ sí í mú … fúyẹ́
  rationale: Imperfect náà lè tọ́ka sí ìṣe tí ń lọ lọ́wọ́ tàbí sí ìbẹ̀rẹ̀ ìṣe náà. Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìtumọ̀ inceptive, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn ongoing náà hàn.
- source_word: τὸ πλοῖον
  choice: ọkọ̀ náà
  rationale: “Ọkọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọkọ̀ ojú omi ńlá inú àyíká ìrìn-àjò yìí mu.
- source_word: ἐκβαλλόμενοι
  choice: nípa sísọ
  rationale: Participle náà ṣàlàyé ọ̀nà tí wọ́n gbà mú ọkọ̀ náà fúyẹ́; “nípa sísọ” sọ ìtumọ̀ ohun èlò tàbí ọ̀nà náà jáde lọ́nà àdánidá.
- source_word: τὸν σῖτον
  choice: àlìkámà
  rationale: σῖτος lè túmọ̀ sí irúgbìn oúnjẹ ní gbogbogbòò, ṣùgbọ́n ó sábà máa ń tọ́ka sí àlìkámà, èyí sì bá ẹrù ọkọ̀ inú àyíká yìí mu.
- source_word: εἰς τὴν θάλασσαν
  choice: sínú òkun
  rationale: Èyí pa ìtọ́sọ́nà àti àyíká ọkọ̀ ojú omi inú ọ̀rọ̀ Gíríìkì mọ́ lọ́nà Yorùbá tó ṣe kedere.
