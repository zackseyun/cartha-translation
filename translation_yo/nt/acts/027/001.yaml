id: ACT.27.1
reference: Acts 27:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: yo
  text: Nígbà tí wọ́n pinnu pé kí a wọ ọkọ̀ ojú omi lọ sí Ítálíà, wọ́n fi Pọ́ọ̀lù àti àwọn ẹlẹ́wọ̀n mìíràn lé ọ̀gágun ọgọ́rùn-ún kan, tí orúkọ rẹ̀ ń jẹ́ Júlíọ̀sì, lọ́wọ́; ó jẹ́ ti Ẹgbẹ́ ọmọ-ogun Ágọ́sítọ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹgbẹ́ ọmọ-ogun ti Olúọba”; ó tún lè jẹ́ “ẹgbẹ́ ọmọ-ogun Sebaste.” Ọ̀rọ̀ Gíríìkì Σεβαστῆς ní ìbáṣepọ̀ pẹ̀lú oyè Ágọ́sítọ̀ tàbí olúọba, ṣùgbọ́n a kò mọ ẹgbẹ́ ọmọ ogun pàtó tí a ń tọ́ka sí dájú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: wọ́n pinnu
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive tí a lò láì sọ ẹni tó ṣe ìpinnu náà ní pàtó. Èdè Yorùbá máa ń lo ‘wọ́n’ fún irú ẹni tí a kò dárúkọ yìí; ‘pinnu’ sì pa ìtumọ̀ ìpinnu oníṣẹ́-ìṣàkóso mọ́.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: pé kí a wọ ọkọ̀ ojú omi lọ
  rationale: Èyí sọ ohun tí wọ́n pinnu, ó sì fi ìrìnàjò lórí omi àti ọ̀rọ̀ ẹni-àkọ́kọ́ púpọ̀ ‘a’ hàn kedere.
- source_word: παρεδίδουν
  choice: wọ́n fi ... lé ... lọ́wọ́
  rationale: Àpólà Yorùbá yìí sọ ìgbéjọ́wọ́ àwọn ẹlẹ́wọ̀n sínú àbójútó ẹni mìíràn ní ọ̀nà àdánidá.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Pọ́ọ̀lù àti àwọn ẹlẹ́wọ̀n mìíràn
  rationale: ‘Àti’ dá ìsopọ̀ τε…καί dúró, ‘àwọn ... mìíràn’ sì túmọ̀ τινας ἑτέρους láì fi iye tí kò sí nínú Gíríìkì kún un.
- source_word: ἑκατοντάρχῃ
  choice: ọ̀gágun ọgọ́rùn-ún kan
  rationale: Èyí jẹ́ àkọlé olórí ọmọ ogun Róòmù tó ń darí nǹkan bí ọgọ́rùn-ún ọmọ ogun; ‘kan’ fi hàn pé a ṣẹ̀ṣẹ̀ ń darúkọ rẹ̀.
- source_word: ὀνόματι Ἰουλίῳ
  choice: tí orúkọ rẹ̀ ń jẹ́ Júlíọ̀sì
  rationale: Ọ̀nà àdánidá ní Yorùbá láti fi ẹni tuntun àti orúkọ rẹ̀ hàn ni èyí.
- source_word: σπείρης Σεβαστῆς
  choice: Ẹgbẹ́ Ọmọ Ogun Ọba Olú-ọba
  rationale: σπεῖρα jẹ́ ẹ̀ka tàbí ẹgbẹ́ ọmọ ogun; Σεβαστή sì ní ìbáṣepọ̀ pẹ̀lú oyè Augustus/ọba olú-ọba. Àkọlé yìí sọ ìtumọ̀ tó ṣeé lóye, nígbà tí àlàyé ìsàlẹ̀ pa àìdánilójú nípa orúkọ ẹgbẹ́ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ σπείρης Σεβαστῆς, orúkọ ẹgbẹ́ ọmọ ogun kan tí ìdánimọ̀ rẹ̀ kò dájú pátápátá
  choice: Ẹgbẹ́ Ọmọ Ogun Ọba Olú-ọba
  alternative: Ẹgbẹ́ Ọmọ Ogun Ágọ́sítọ̀; tàbí ẹgbẹ́ ọmọ ogun Sebaste
  rationale: Kì í ṣe ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́, ṣùgbọ́n ó ní ìṣòro ìtàn. Àyànfẹ́ náà mú ìbáṣepọ̀ rẹ̀ pẹ̀lú olú-ọba hàn ní èdè Yorùbá tó ṣeé lóye, àlàyé ìsàlẹ̀ sì tọ́ka sí àwọn ìtumọ̀ tó sun mọ́ ọ̀rọ̀ Gíríìkì jù.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní ọlá, tí ó sì ṣeé lóye ni a lò. A lo àmì ohùn níbi tó bá jẹ́ ti àdánidá, a sì pín gbólóhùn náà sí méjì láti yẹra fún ìkọ̀lé tó wuwo, láì yí ìbáṣepọ̀ àwọn gbólóhùn Gíríìkì padà.
