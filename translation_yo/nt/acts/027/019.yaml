  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: yo
  text: Ní ọjọ́ kẹta, wọ́n fi ọwọ́ ara wọn ju ohun èlò ọkọ̀ náà sínú òkun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọjọ́ kẹta, àwọn fúnra wọn ju ohun èlò ọkọ̀ náà síta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: Ní ọjọ́ kẹta
  rationale: Dátífù pẹ̀lú nọ́ńbà ìtẹ̀lé níbí ń tọ́ka sí àkókò; fífi ‘ọjọ́’ hàn mú ọ̀rọ̀ náà ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: αὐτόχειρες
  choice: àwọn fúnra wọn fi ọwọ́ ara wọn
  rationale: Ọ̀rọ̀ náà tẹnumọ́ pé àwọn tó wà nínú ọkọ̀ náà ló fi ọwọ́ ara wọn ṣe iṣẹ́ náà; gbolohun yìí pa ìtumọ̀ àti ìtẹnumọ́ Gíríìkì mọ́.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: ohun èlò ọkọ̀ náà
  rationale: Nínú àyíká ọkọ̀ ojú omi, σκευή túmọ̀ sí àwọn ohun èlò tàbí ẹ̀rọ tí ọkọ̀ náà ń lò, kì í ṣe ohun ọ̀ṣọ́ tàbí ohun inú ilé.
- source_word: ἔρριψαν
  choice: ju ... sínú òkun
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ‘ju’; àyíká ìtàn fi hàn pé wọ́n ju ohun èlò náà kúrò lórí ọkọ̀ sínú òkun, nítorí náà ìtumọ̀ yìí jẹ́ kedere àti àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo. Ìtumọ̀ náà pa ìtẹnumọ́ αὐτόχειρες mọ́ láì fi èrò ẹ̀kọ́ ìsìn kún un.
