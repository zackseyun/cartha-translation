id: ACT.27.10
reference: Acts 27:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ̀yin ọkùnrin, mo rí i pé ìrìnàjò ojú omi yìí yóò wá pẹ̀lú ìpalára àti òfò púpọ̀[a], kì í ṣe fún ẹrù àti ọkọ̀ ojú omi nìkan, ṣùgbọ́n fún ìwàláàyè wa pẹ̀lú[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìpalára àti ìbàjẹ́ púpọ̀.” Gbólóhùn Gíríìkì náà lè tẹnu mọ́ ìpọ́njú líle tàbí ìbàjẹ́ tí yóò bá ìrìnàjò náà dé.
    reason: lexical_alternative
  - marker: b
    text: Ní ti ọ̀rọ̀ gangan, “ẹ̀mí wa”; ṣùgbọ́n níbí ó túmọ̀ sí ìwàláàyè wa, nítorí ewu ọkọ̀ rì àti ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Ó mú gbólóhùn alábápín náà wá sínú Yorùbá àdánidá gẹ́gẹ́ bí ìṣe tó ń tẹ̀ lé ìtàn, láìfi ìtumọ̀ míì kún un.
- source_word: Ἄνδρες
  choice: Ẹ̀yin ọkùnrin
  rationale: Ó pa ìpè akọ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹ fún Pọ́ọ̀lù tó ń bá àwọn tó wà nínú ọkọ̀ sọ̀rọ̀.
- source_word: θεωρῶ
  choice: mo kíyè sí i
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdájọ́ tí ó wá láti inú àkíyèsí, kì í ṣe rírí ojú lásán.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: yóò yọrí sí ìjàmbá àti òfò púpọ̀
  rationale: ‘Ìjàmbá’ mú agbára ìpalára tàbí ìpọ́njú líle inú ὕβρις jáde nínú àyíká ìrìnàjò ojú omi; ‘òfò púpọ̀’ sì dúró fún ζημία πολλή ní Yorùbá tó ṣe kedere.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: kì í ṣe ti ẹrù àti ọkọ̀ ojú omi nìkan, bí kò ṣe ... pẹ̀lú
  rationale: Ìṣètò yìí pa ìfiwéra ‘kì í ṣe ... nìkan, bí kò ṣe ... pẹ̀lú’ mọ́, àwọn ọ̀rọ̀ onítọ̀hún sì ṣì so mọ́ òfò tí a mẹ́nu kàn.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: ẹ̀mí wa
  rationale: Nínú ewu ọkọ̀ rì àti ikú, ψυχή túmọ̀ sí ìwàláàyè àwọn ènìyàn. ‘Ẹ̀mí wa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹ̀mí wọn lè lọ.
- source_word: μέλλειν ἔσεσθαι
  choice: yóò yọrí sí
  rationale: Ó sọ ìfojúsọ́nà tó sún mọ́lé di Yorùbá àdánidá, ó sì bá θεωρῶ mu gẹ́gẹ́ bí ìkìlọ̀ tí Pọ́ọ̀lù ń ṣe.
- source_word: τὸν πλοῦν
  choice: ìrìnàjò ojú omi yìí
  rationale: Ó túmọ̀ πλοῦς ní pàtó gẹ́gẹ́ bí ìrìnàjò lórí omi, ‘yìí’ sì tọ́ka sí ìrìnàjò tí wọ́n ń gbèrò láti tẹ̀ síwájú.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ewu ọkọ̀ rì
  choice: ẹ̀mí wa, ní ìtumọ̀ ìwàláàyè wa
  alternative: ọkàn wa
  rationale: Àyíká náà jẹ́ ti ikú nípa ọkọ̀ rì, nítorí náà kì í ṣe ẹ̀kọ́ nípa apá àìrí ènìyàn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ‘ọkàn/ẹ̀mí’ mọ́ láìyí kókó ẹsẹ náà padà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣe kedere fún òǹkàwé gbogbogbò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ. Ìṣètò gbólóhùn jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n a pa ìkìlọ̀, ìfojúsọ́nà, àti ìtẹnumọ́ ‘kì í ṣe ... nìkan’ inú orísun Gíríìkì mọ́.
