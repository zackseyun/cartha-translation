  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: yo
  text: Lẹ́yìn tí a ti fi ọkọ̀ ojú omi kọjá òkun gbangba lẹ́gbẹ̀ẹ́ Kilikíà àti Pamfílíà[a], a sọ̀kalẹ̀ dé Mírà ní Líkíà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní etí Kilikíà àti Pamfílíà,” èyí tó ń tọ́ka sí ipa ọ̀nà inú òkun lẹ́gbẹ̀ẹ́ etíkun àwọn agbègbè náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a dé Mírà ní Líkíà.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní tààràtà sí “a sọ̀kalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: òkun gbalasa
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí apá òkun tó ṣí sílẹ̀, kì í ṣe òkun lásán; ‘òkun gbalasa’ jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ yìí ní Yorùbá.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: lẹ́gbẹ̀ẹ́ Kilikíà àti Pamfílíà
  rationale: Κατά pẹ̀lú accusative nínú gbólóhùn ibi yìí ṣàpèjúwe ipa ọ̀nà inú òkun tó wà lẹ́gbẹ̀ẹ́ tàbí ní etí àwọn agbègbè náà, láìsọ pé wọ́n gba orí ilẹ̀ kọjá.
- source_word: διαπλεύσαντες
  choice: Lẹ́yìn tí a fi ọkọ̀ ojú omi la ... kọjá
  rationale: Aorist participle náà fi ìṣe tó ti parí ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn. ‘Lẹ́yìn tí’ pa ìtẹ̀lé àkókò náà mọ́, ‘fi ọkọ̀ ojú omi la ... kọjá’ sì mú ọ̀nà ìrìn-àjò náà ṣe kedere.
- source_word: κατήλθομεν
  choice: a sọ̀kalẹ̀ dé
  rationale: Èyí pa ìtumọ̀ ìtọ́sọ́nà ‘sọ̀kalẹ̀’ mọ́, nígbà tó tún fi hàn ní Yorùbá àdánidá pé wọ́n dé ibi tí wọ́n ń lọ.
- source_word: Μύρα τῆς Λυκίας
  choice: Mírà ní Líkíà
  rationale: Genitive náà ń fi agbègbè tí Mírà wà hàn; ‘ní Líkíà’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere jù lọ.
- source_word: τε
  choice: asopọ̀ tí kò fara hàn lọ́tọ̀
  rationale: τε jẹ́ asopọ̀ fẹ́lẹ́fẹ́lẹ́ mọ́ ìtàn tó ṣáájú; ìṣàn gbólóhùn Yorùbá ti gbé iṣẹ́ rẹ̀, kò sì nílò ọ̀rọ̀ àfikún lọ́tọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó lọ́wọ́lọ́wọ́, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tó bá bá èdè mu, a sì ṣàkọsílẹ̀ orúkọ ibi ní ọ̀nà tó ṣeé kà ní Yorùbá.
