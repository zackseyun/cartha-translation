  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ ogun gé àwọn okùn ọkọ̀ ojú omi kékeré náà, wọ́n sì jẹ́ kí ó lọ kúrò[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ sí “ọkọ̀ kékeré” tàbí “ọkọ̀ kékeré ti ọkọ̀ ńlá” (Gíríìkì: skaphē), èyí tí ó ń tọ́ka sí ọkọ̀ kékeré tí a so mọ́ ọkọ̀ ńlá.'
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, a tún lè lóye ọ̀rọ̀-ìṣe náà sí “ṣàn lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀπέκοψαν
  choice: gé
  rationale: Ó sọ ìṣe gígé àwọn okùn náà kúrò ní kedere láìfi ìtumọ̀ mìíràn kún un.
- source_word: οἱ στρατιῶται
  choice: àwọn ọmọ ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún àwọn jagunjagun.
- source_word: τὰ σχοινία
  choice: àwọn okùn
  rationale: “Okùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn okùn tí a fi so ọkọ̀ kékeré mọ́ ọkọ̀ ńlá.
- source_word: τῆς σκάφης
  choice: ọkọ̀ ojú omi kékeré náà
  rationale: Ó ya σκάφη sọ́tọ̀ kúrò lára ọkọ̀ ńlá, ó sì ṣàlàyé irú ọkọ̀ tí a ń tọ́ka sí ní èdè tí òǹkàwé òde òní lè lóye.
- source_word: εἴασαν
  choice: wọ́n sì jẹ́ kí
  rationale: Ó ṣe àfihàn ìtumọ̀ “jẹ́ kí” tàbí “gbà láàyè” nínú ìṣètò ọ̀rọ̀ Gíríìkì.
- source_word: αὐτὴν
  choice: ó
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí ọkọ̀ ojú omi kékeré náà lọ́nà àdánidá ní Yorùbá.
- source_word: ἐκπεσεῖν
  choice: lọ sílẹ̀
  rationale: Ó pa àwòrán ohun tí ó ya kúrò tí ó sì ń lọ mọ́, láìpinnu bóyá ó ṣubú tàbí ó sú lọ nítorí omi.
theological_decisions: []
translation_notes:
  register: Yorùbá àṣàṣe, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo “ọkọ̀ ojú omi kékeré” láti yà á sọ́tọ̀ kúrò lára ọkọ̀ ńlá, a sì fi àwọn àṣàyàn ìtumọ̀ ἐκπεσεῖν pamọ́ sínú àkọsílẹ̀ ìsàlẹ̀.
