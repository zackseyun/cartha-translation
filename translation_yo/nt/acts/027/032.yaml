  source_fidelity: Ìtumọ̀ náà tọ́ka sí àwọn ọmọ ogun, gígé okùn ọkọ̀ kékeré náà, àti jíjẹ́ kí ọkọ̀ náà ya kúrò. Ṣùgbọ́n “lọ sílẹ̀” máa ń túmọ̀ sí ìlọ sí ìsàlẹ̀, èyí tí kò fi ìtumọ̀ ἐκπεσεῖν hàn dáadáa nínú àyíká ọkọ̀ ojú omi yìí, níbi tí ọkọ̀ kékeré náà ti ń yà tàbí ń ṣàn kúrò lẹ́yìn tí wọ́n gé okùn rẹ̀.
