id: ACT.27.31
reference: Acts 27:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: yo
  text: Pọ́ọ̀lù sọ fún balógun ọgọ́rùn-ún náà àti àwọn ọmọ ogun pé, “Bí àwọn ọkùnrin wọ̀nyí kò bá wà nínú ọkọ̀ ojú omi náà, ẹ̀yin kò lè là.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin kò lè yè.” Ọ̀rọ̀ Gíríìkì náà ní “là”; níhìn-ín, ó ń tọ́ka sí jíjà bọ́ nínú ewu ikú lórí òkun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: balógun ọ̀rún
  rationale: Èyí ni ọ̀nà kúkúrú, tí ó sì ti wọ́pọ̀ ní èdè Yorùbá láti pe ipò ológun Róòmù tí ó ń darí ẹgbẹ́ ọmọ ogun kan.
- source_word: οὗτοι
  choice: àwọn ọkùnrin wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka náà ń tọ́ka sí àwọn atukọ̀ tí wọ́n fẹ́ fi ọkọ̀ sílẹ̀; fífi “àwọn ọkùnrin” kún un mú ẹni tí a ń sọ̀rọ̀ rẹ̀ ṣe kedere ní Yorùbá.
- source_word: μείνωσιν
  choice: dúró
  rationale: “Dúró” níhìn-ín túmọ̀ sí kí wọ́n má lọ kúrò, kí wọ́n sì wà nínú ọkọ̀ náà; ó jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún μένω nínú àyíká yìí.
- source_word: πλοίῳ
  choice: ọkọ̀ ojú omi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọkọ̀ ńlá tí ń rin ìrìn-àjò lórí òkun, kì í ṣe ọkọ̀ kékeré; “ọkọ̀ ojú omi” ṣe èyí kedere fún òǹkàwé Yorùbá.
- source_word: σωθῆναι
  choice: là
  rationale: “Là” lè túmọ̀ sí jíjàbọ́ tàbí pípa ẹ̀mí mọ́ nínú ewu, ó sì pa ìtumọ̀ gbòòrò ti σῴζω mọ́ láì fi èrò nípa ìgbàlà ayérayé kún àyíká ìjì àti ìrì ọkọ̀ yìí.
- source_word: οὐ δύνασθε
  choice: ẹ̀yin kò lè
  rationale: Èyí túmọ̀ ìkìlọ̀ nípa àìlágbára náà ní tààràtà, ó sì tẹnumọ́ “ẹ̀yin” gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ti ṣe.
theological_decisions:
- issue: Bóyá kí σωθῆναι jẹ́ ọ̀rọ̀ tó ń tọ́ka kedere sí pípa ẹ̀mí mọ́ nìkan tàbí kí a lo ọ̀rọ̀ tó ní ìtumọ̀ gbòòrò ti “jíjà là.”
  choice: là
  alternative: yè tàbí rí ìgbàlà kúrò nínú ewu
  rationale: Àyíká náà fi hàn pé jíjàbọ́ nínú ewu ikú lórí òkun ni a ń sọ, kì í ṣe ìgbàlà ayérayé. Síbẹ̀, “là” pa agbára ọ̀rọ̀ Gíríìkì tó wọ́pọ̀ fún “gbà là” mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń sọ irú ìgbàlà tí a ní lọ́kàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. “Balógun ọ̀rún” pa àwọ̀ ìtàn Róòmù mọ́, “dúró sínú ọkọ̀” sì gbé ìkìlọ̀ Pọ́ọ̀lù kalẹ̀ ní ọ̀nà àdánidá.
