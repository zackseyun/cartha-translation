  to: Pọ́ọ̀lù sọ fún balógun ọgọ́rùn-ún náà àti àwọn ọmọ ogun pé, “Bí àwọn ọkùnrin wọ̀nyí kò bá wà nínú ọkọ̀ ojú omi náà, ẹ̀yin kò lè là.”[a]
  rationale: A ti ṣàtúnṣe orúkọ ipò ológun náà sí “balógun ọgọ́rùn-ún,” a sì rọ́pò ìṣọ̀kan ọrọ̀ tí kò ṣẹ̀dá “dúró sínú” pẹ̀lú “wà nínú.” A pa “là” mọ́ gẹ́gẹ́ bí ìtumọ̀ kúkúrú tó bá σωθῆναι mu, a sì ṣàtúnṣe àlàyé ìsàlẹ̀ ojú ewé kí ó ṣe àfihàn ìtumọ̀ ti ara nínú àyíká ìjì náà láì sọ pé Gíríìkì náà ní ìtumọ̀ míràn tí kò wà níbẹ̀.
