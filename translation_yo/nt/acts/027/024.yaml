  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìtẹ̀síwájú ọ̀rọ̀ áńgẹ́lì, àṣẹ “má bẹ̀rù,” ìjẹ́dandan δεῖ, ìfarahàn Paulu níwájú Kesari, àti ẹ̀bùn Ọlọ́run fún gbogbo àwọn tí wọ́n ń bá a rìnrìn-àjò lórí omi mọ́. Síbẹ̀, ìkọ̀wé ọ̀rọ̀ ìfọ́kànsí ἰδού àti gbolohun κεχάρισταί σοι nílò àtúnṣe kékeré kí ó lè jẹ́ Yorùbá boṣewa àti kedere.
  naturalness: “Kíyè sí i” kì í ṣe ìkọ̀wé boṣewa; “Kíyèsí i” ni ìkọ̀wé tó yẹ. “Fi ... ṣe ọ́ lọ́rẹ” sì dùn bí ìlò ọrọ̀ tí kò rọrùn, tí ó lè jẹ́ kó dà bí pé a ń sọ nípa ìbáṣepọ̀ ọ̀rẹ́. “Ti fi ... fún ọ” jẹ́ kedere, ó sì gbé ìtumọ̀ “has granted” dáadáa.
  terminology: “Paulu” àti “Kesari” jẹ́ ìlò tí a lè gbà nínú àfọwọ́kọ yìí. A pa “ní láti” mọ́ fún δεῖ, láì sọ ìdí ìjẹ́dandan náà ju ohun tí Gíríìkì sọ lọ.
  issues:
