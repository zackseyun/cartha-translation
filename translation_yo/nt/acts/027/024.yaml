  to: Ó wí pé, “Má bẹ̀rù, Paulu. Ó ní láti dúró níwájú Kesari; kíyèsí i, Ọlọ́run ti fi gbogbo àwọn tí wọ́n ń bá ọ wọ ọkọ̀ ojú omi lọ fún ọ.”
