    rationale: Àpẹẹrẹ yìí kò rọrùn nínú Yorùbá òde òní, ó sì lè yí ìtumọ̀ sí ìbáṣepọ̀ ọ̀rẹ́. “Ọlọ́run ti fi ... fún ọ” ń fi ìṣe ẹ̀bùn/ìfúnni Ọlọ́run hàn láì kún ìtumọ̀ mìíràn.
  - severity: low
