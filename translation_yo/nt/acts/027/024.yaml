  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: yo
  text: Ó wí pé, “Má bẹ̀rù, Paulu. Ó ní láti dúró níwájú Kesari; kíyèsí i, Ọlọ́run ti fi gbogbo àwọn tí wọ́n ń bá ọ wọ ọkọ̀ ojú omi lọ fún ọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: Ó wí pé
  rationale: Ó ń so ọ̀rọ̀ áńgẹ́lì tí ẹsẹ tó ṣáájú mẹ́nu kàn pọ̀ mọ́ àyọkà yìí ní Yorùbá àdánidá.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Àṣẹ òdì tó ń sọ pé kí Paulu dáwọ́ ìbẹ̀rù dúró tàbí kí ó má bẹ̀rù.
- source_word: δεῖ
  choice: ní láti
  rationale: Ó pa ìtumọ̀ ìjẹ́dandan mọ́ láì ṣàlàyé orísun ìjẹ́dandan náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: παραστῆναι
  choice: dúró níwájú
  rationale: Ó bá àyíká fífi Paulu hàn níwájú Kesari fún ìgbẹ́jọ́ mu.
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó jẹ́ ìkìlọ̀ àfiyèsí tó ṣe kedere ní Yorùbá òde òní, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κεχάρισταί σοι
  choice: ti fi ... ṣe ọ́ lọ́rẹ
  rationale: Ọ̀rọ̀ náà ń fi ìṣe oore-ọ̀fẹ́ tí Ọlọ́run ti ṣe fún Paulu hàn, kì í ṣe ìní àwọn ènìyàn fúnra rẹ̀.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: gbogbo àwọn tí wọ́n ń bá ọ wọ ọkọ̀ ojú omi lọ
  rationale: Ó túmọ̀ ìṣe ìrìn-àjò lórí omi pẹ̀lú Paulu ní ọ̀nà tó ṣe kedere àti àdánidá.
theological_decisions:
- issue: Ìtumọ̀ pé Ọlọ́run ‘fi’ àwọn arìnrìn-àjò náà fún Paulu
  choice: fi gbogbo àwọn ... ṣe ọ́ lọ́rẹ
  alternative: fi ẹ̀mí gbogbo àwọn ... fún ọ
  rationale: Aṣàyàn náà pa ìfọkànsìn κεχάρισταί mọ́, kò sì fi ‘ẹ̀mí’ kún ọ̀rọ̀ tí kò sí nínú Gíríìkì; ohun tí ẹ̀bùn náà túmọ̀ sí gan-an ni àyíká ìgbàlà wọn yóò mú kedere.
- issue: Ìjẹ́dandan kí Paulu dúró níwájú Kesari
  choice: O ní láti dúró níwájú Kesari
  alternative: Ìwọ yóò dúró níwájú Kesari
  rationale: Èyí pa agbára δεῖ, ìyẹn ìjẹ́dandan, mọ́ dípò yíyí i padà sí àsọtẹ́lẹ̀ lásán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Kesari” gẹ́gẹ́ bí oyè ọba Romu, àti “Paulu” gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ nínú Yorùbá Bíbélì.
