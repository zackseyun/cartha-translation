source:
  edition: SBLGNT
  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: yo
  text: Lẹ́yìn tí ìgbà pípẹ́ ti kọjá, tí ìrìnàjò ojú omi sì ti di èyí tó léwu tẹ́lẹ̀[b], nítorí pé Ààwẹ̀ náà pàápàá ti kọjá tán[a], Pọ́ọ̀lù ń fún wọn ní ìmọ̀ràn pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ààwẹ̀ Ọjọ́ Ètùtù.” Gíríìkì sọ pé “Ààwẹ̀ náà.” Ó ṣeé ṣe kó ń tọ́ka sí ààwẹ̀ ọdọọdún àwọn Júù, èyí tí ó fi hàn pé àsìkò ríré ọkọ̀ ojú omi tí ó léwu ti dé.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ríré ọkọ̀ ojú omi sì ti di èyí tó léwu tẹ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Nígbà tí àkókò púpọ̀ ti kọjá
  rationale: Èyí fi hàn pé àkókò tó pọ̀ tó ti kọjá, ó sì mú ìtumọ̀ genitive absolute náà jáde ní Yorùbá àdánidá.
- source_word: ὄντος ἤδη ἐπισφαλοῦς
  choice: sì ti léwu báyìí
  rationale: “Léwu” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò tí kò ní ààbò; “báyìí” mú ἤδη, ìyẹn “ní àkókò yẹn,” jáde láì sọ pé ewu náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀.
- source_word: τοῦ πλοὸς
  choice: ìrìn-àjò ojú omi
  rationale: πλοῦς níbí ń tọ́ka sí ìrìn-àjò tàbí ríré lórí omi, kì í ṣe ọkọ̀ náà fúnra rẹ̀.
- source_word: διὰ τὸ ... παρεληλυθέναι
  choice: nítorí pé ... ti kọjá
  rationale: “Nítorí pé” pa agbára ìdí tí διά pẹ̀lú articular infinitive ní mọ́, “ti kọjá” sì fi hàn pé ó ti ṣẹlẹ̀ tán.
- source_word: καὶ τὴν νηστείαν
  choice: Ààwẹ̀ náà pàápàá
  rationale: “Ààwẹ̀ náà” pa ìtọ́kasí pàtó ṣùgbọ́n tí a kò ṣàlàyé nínú Gíríìkì mọ́; “pàápàá” mú καί tó ní agbára “àní/even” jáde.
- source_word: παρῄνει
  choice: ń fún wọn ní ìmọ̀ràn
  rationale: Ìṣe tí ń lọ lọ́wọ́ bá imperfect náà mu, “fún ... ní ìmọ̀ràn” sì sọ ìmọ̀ràn tàbí ìkìlọ̀ ọlọ́gbọ́n láì fi agbára tó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní ọ̀wọ̀ ni a lò. A pa ìtẹ̀síwájú gbolohun náà mọ́ pẹ̀lú àmì kọ́má, nítorí ẹsẹ yìí ń ṣí ọ̀nà sí ọ̀rọ̀ Pọ́ọ̀lù nínú ẹsẹ tó tẹ̀ lé e. Àmì ìdákẹ́jẹ àti àmì ohùn ni a fi sí ibi tí ó yẹ.
