  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: yo
  text: Ní ìbẹ̀rù pé ọkọ̀ náà lè lọ kọlu àwọn ibi àpáta,[a] wọ́n ju ìdákọ̀ró mẹ́rin sílẹ̀ láti ẹ̀yìn ọkọ̀, wọ́n sì ń gbàdúrà pé kí ilẹ̀ mọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé ọkọ̀ náà lè lọ wọ́ sórí ibi àpáta gírí-gírí,” tàbí “lè gúnlẹ̀ sí ibi rírorò.”
    reason: lexical_alternative
  - marker: b
    text: Ní gangan, “pé kí ọjọ́ dé”; ìyẹn ni pé, wọ́n ń retí kí ìmọ́lẹ̀ òwúrọ̀ dé.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί τε
  choice: Níwọ̀n bí wọ́n sì ti ń bẹ̀rù
  rationale: Ó fi ìbẹ̀rù hàn gẹ́gẹ́ bí ìdí tí wọ́n fi ju àwọn ìdákọ̀ró sílẹ̀, ó sì pa ìsopọ̀ ìtàn tí participle Gíríìkì dá mọ́.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: pé ọkọ̀ náà lè lọ kọlu àwọn ibi àpáta
  rationale: Ọ̀rọ̀ náà sọ ìbẹ̀rù pé ọkọ̀ lè dé sí ibi etíkun tàbí àpáta eléwu. Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, kò sì sọ irú ibi náà ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐκπέσωμεν
  choice: lè lọ kọlu
  rationale: Nínú ọ̀rọ̀ ìrìn omi, ọ̀rọ̀-ìṣe náà túmọ̀ sí pé afẹ́fẹ́ tàbí ìgbì lè gbé ọkọ̀ dé orí ilẹ̀, àpáta tàbí ibi tí omi kò jin.
- source_word: ἐκ πρύμνης
  choice: láti ẹ̀yìn ọkọ̀
  rationale: πρύμνα ni apá ẹ̀yìn ọkọ̀ ojú omi; ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá lásán.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: wọ́n ju ìdákọ̀ró mẹ́rin sílẹ̀
  rationale: Ó fi ìṣe tí ó ṣáájú àdúrà wọn hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ bí a ṣe ń sọ ìdákọ̀ró ọkọ̀ sí omi.
- source_word: ηὔχοντο
  choice: wọ́n sì ń gbàdúrà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, εὔχομαι lè tọ́ka sí àdúrà, imperfect náà sì fi ìṣe tí ń bá a lọ hàn.
- source_word: ἡμέραν γενέσθαι
  choice: pé kí ilẹ̀ mọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń retí kí òru kọjá, kí ìmọ́lẹ̀ òwúrọ̀ sì dé.
