translation_notes:
  register: A lo Yorùbá tó ṣe kedere, tó níyì, tí ó sì bá ìtàn mu. “Ẹ̀yìn ọkọ̀” yàgò fún ọ̀rọ̀ iṣẹ́ ọkọ̀ ojú omi tí ọ̀pọ̀ ènìyàn kò mọ̀, nígbà tí “ìdákọ̀ró” pa ohun èlò ọkọ̀ náà mọ́ ní pàtó. Àwọn àmì ohùn ni a lò ní kíkún níbi tí wọ́n ti jẹ́ ti àdánidá.
