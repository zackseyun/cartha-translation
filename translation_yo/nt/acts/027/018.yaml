  register: Yorùbá àjùmọ̀lò tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Gbá wa kiri’ mú agbára ìjì àti ìtumọ̀ passive χειμαζομένων hàn; ‘ẹrù inú ọkọ̀’ ṣàlàyé ohun tí ọ̀rọ̀ ọkọ̀ ojú omi ἐκβολή túmọ̀ sí nínú àyíká yìí.
