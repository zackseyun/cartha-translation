  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: yo
  text: Nígbà tí ìjì náà ń fi agbára gbá wa kiri, ní ọjọ́ kejì wọ́n ń ju ẹrù inú ọkọ̀ sínú òkun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “wọ́n ṣe jíju nǹkan síta.” Èyí jẹ́ ọ̀rọ̀ ọkọ̀ ojú omi fún jíju ẹrù kúrò nínú ọkọ̀ ojú omi kí ọkọ̀ náà lè fúyẹ́.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: fi agbára
  rationale: Ó fi bí ìjì náà ṣe le tó hàn ní Yorùbá àdánidá, láì sọ ọ́ di ọ̀rọ̀ àsọdùn.
- source_word: χειμαζομένων
  choice: ìjì náà ti ń ... gbá wa kiri
  rationale: Ó pa ìtumọ̀ ẹni tí ìjì ń ṣe ní nǹkan mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe àpèjúwe ọkọ̀ tí ìjì ń gbá kiri.
- source_word: ἡμῶν
  choice: wa
  rationale: Ẹni àkọ́kọ́ ọ̀pọ̀ nínú genitive absolute ni a tú sí gbólóhùn abẹ́lẹ̀ Yorùbá.
- source_word: τῇ ἑξῆς
  choice: ní ọjọ́ kejì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ‘ní ọjọ́ tí ó tẹ̀ lé e.’
- source_word: ἐκβολὴν
  choice: ju ẹrù inú ọkọ̀ sínú òkun
  rationale: Nínú àyíká ọ̀rọ̀ ọkọ̀ ojú omi, orúkọ náà tọ́ka sí jíju ẹrù síta láti mú kí ọkọ̀ fúyẹ́; ‘ẹrù’ jẹ́ ohun tí àyíká ọ̀rọ̀ fi hàn.
- source_word: ἐποιοῦντο
  choice: wọ́n bẹ̀rẹ̀ sí í ju
  rationale: Ó mú ìṣe tí ó ń lọ nínú imperfect náà jáde, ó sì fi ìbẹ̀rẹ̀ ìgbésẹ̀ tuntun ní ọjọ́ kejì hàn lọ́nà àdánidá.
