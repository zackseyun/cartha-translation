id: ACT.27.35
reference: Acts 27:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí, ó mú búrẹ́dì, ó sì dúpẹ́ lọ́wọ́ Ọlọ́run níwájú gbogbo wọn[a]. Lẹ́yìn tí ó bù ú, ó bẹ̀rẹ̀ sí í jẹ ẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú gbogbo ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; ‘Lẹ́yìn tí’ mú ìtẹ̀síwájú ìtàn náà hàn ní Yorùbá àdánidá. A fi δέ sínú ìṣàn ọ̀rọ̀ dípò fífi ìtakora tí kò sí nínú rẹ̀ kún un.
- source_word: λαβὼν ἄρτον
  choice: ó mú búrẹ́dì
  rationale: ‘Búrẹ́dì’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ἄρτος. A kò fi ‘kan’ tàbí ‘díẹ̀’ kún un, kí a má bàa sọ bóyá odindi ìṣù búrẹ́dì ni tàbí apá kan.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: ó dúpẹ́ lọ́wọ́ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan fi ọpẹ́ fún Ọlọ́run, ó sì pa ẹni tí a dúpẹ́ lọ́wọ́ rẹ̀ mọ́ kedere.
- source_word: ἐνώπιον πάντων
  choice: níwájú gbogbo wọn
  rationale: Gbólóhùn yìí pa ìtumọ̀ pé ìṣe náà ṣẹlẹ̀ ní gbangba, níbi tí gbogbo àwọn tí ó wà níbẹ̀ ti rí i, mọ́.
- source_word: κλάσας
  choice: Lẹ́yìn tí ó bù ú
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ bù búrẹ́dì náà kí ó tó bẹ̀rẹ̀ sí í jẹ. Arọ́pò-orúkọ ‘ú’ tọ́ka padà sí búrẹ́dì láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἤρξατο ἐσθίειν
  choice: ó bẹ̀rẹ̀ sí í jẹ ẹ́
  rationale: Èyí pa ìtumọ̀ ingressive ti ἄρχομαι pẹ̀lú infinitive mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ó ṣeé ṣe kí ìtẹ̀lé ‘mú búrẹ́dì—dúpẹ́—bù ú—jẹ’ mú Oúnjẹ Alẹ́ Olúwa wá sí ọkàn.
  choice: A túmọ̀ àwọn ìṣe náà gẹ́gẹ́ bí ìtàn jíjẹun lórí ọkọ̀ ojú omi, láìsọ pé ó jẹ́ àjọ Oúnjẹ Alẹ́ Olúwa.
  alternative: A lè lo èdè ìjọsìn àṣà tí yóò mú ìbáṣepọ̀ rẹ̀ pẹ̀lú Oúnjẹ Alẹ́ Olúwa lágbára sí i.
  rationale: Ọ̀rọ̀ Gíríìkì lè rántí àwọn ìtàn jíjẹ búrẹ́dì míì, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò pe ìṣe náà ní Oúnjẹ Alẹ́ Olúwa. Ìtumọ̀ náà kò gbé ẹ̀kọ́ ìsìn tí ẹsẹ náà kò sọ wọlé, kò sì dí àfihàn ìbáṣepọ̀ tí òǹkàwé lè rí.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. ‘Búrẹ́dì’ yàgò fún ìdàrúdàpọ̀ tí ‘àkàrà’ lè dá sílẹ̀ fún àwọn òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bójú mu, a sì pa ìtẹ̀lé àwọn ìṣe inú orísun mọ́ ní ọ̀nà Yorùbá àdánidá.
