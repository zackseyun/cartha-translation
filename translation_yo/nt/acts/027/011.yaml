id: ACT.27.11
reference: Acts 27:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: yo
  text: Ṣùgbọ́n balógun ọ̀rún náà gba ọ̀rọ̀ awakọ̀ ọkọ̀ ojú omi àti olówó ọkọ̀ náà gbọ́ ju ohun tí Paulu sọ lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “balógun ọ̀rún náà jẹ́ kí ọ̀rọ̀ awakọ̀ ọkọ̀ ojú omi àti olówó ọkọ̀ náà dá a lójú ju ọ̀rọ̀ Paulu lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọ̀gá ọmọ-ogun Romu tí ó ń darí ọgọ́rùn-ún ọmọ-ogun, ó sì yẹra fún lílo ọ̀rọ̀ àjèjì.
- source_word: κυβερνήτῃ
  choice: awakọ̀ ọkọ̀ ojú omi
  rationale: Nínú àyíká ìrìn ọkọ̀ ojú omi, ó tọ́ka sí ẹni tó ń darí tàbí tó ń wakọ̀ ọkọ̀ náà; yíyan yìí tún mú ipa rẹ̀ yàtọ̀ sí ti ναύκληρος.
- source_word: ναυκλήρῳ
  choice: olówó ọkọ̀
  rationale: Ó ṣàfihàn ẹni tó ni ọkọ̀ ojú omi tàbí olùdarí pàtàkì rẹ̀, ó sì pa ìyàtọ̀ ipa rẹ̀ mọ́ sí awakọ̀ ọkọ̀.
- source_word: μᾶλλον ἐπείθετο
  choice: gba ọ̀rọ̀ ... gbọ́ ju ... lọ
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì mú ìtumọ̀ fífi ìgbẹ́kẹ̀lé tàbí jíjẹ́ kí ọ̀rọ̀ ẹnì kan yí ìpinnu ẹni padà hàn, pẹ̀lú agbára ìfiwéra μᾶλλον.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: ohun tí Paulu sọ
  rationale: Ó tọ́ka ní ṣókí sí ọ̀rọ̀ ìkìlọ̀ tàbí ìmọ̀ràn Paulu. Yorùbá kò nílò kí a fi ìṣe tí ń lọ lọ́wọ́ hàn níbi yìí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora sí ìkìlọ̀ Paulu nínú ẹsẹ tó ṣáájú hàn.
- source_word: ἢ
  choice: ju ... lọ
  rationale: Èyí ni ìṣètò ìfiwéra Yorùbá tó bá μᾶλλον ... ἢ mu.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàlágbà tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo “balógun ọ̀rún” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn tó ṣe àlàyé ipò ọ̀gá ọmọ-ogun Romu; a sì yà “awakọ̀ ọkọ̀ ojú omi” sọ́tọ̀ kúrò lọ́dọ̀ “olówó ọkọ̀.”
