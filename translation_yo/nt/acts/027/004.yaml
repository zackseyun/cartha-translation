source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: yo
  text: Láti ibẹ̀ sì, lẹ́yìn tí a ti gbéra lọ sí òkun, a fi ọkọ̀ gba ìhà Kípírù tí ó ṣíji lọ, nítorí àwọn ẹ̀fúùfù ń fẹ́ lòdì sí wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a fi ọkọ̀ rìn lẹ́gbẹ̀ẹ́ ìhà Kípírù tí erékùṣù náà dáàbò bo kúrò lọ́wọ́ ẹ̀fúùfù.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ atukọ̀ fún wíwọ ọkọ̀ ní ìhà erékùṣù tí ó wà ní ìbòji kúrò ní ẹ̀fúùfù.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Láti ibẹ̀ sì
  rationale: Ó fi καί àti ἐκεῖθεν hàn ní ọ̀nà àdánidá, ó sì so ìtàn náà pọ̀ mọ́ ohun tí ó ṣáájú.
- source_word: ἀναχθέντες
  choice: lẹ́yìn tí a gbéra sí òkun
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò ojú omi, ἀνάγω túmọ̀ sí láti gbéra kúrò ní èbúté lọ sí òkun; gbólóhùn yìí tún fi hàn pé ìṣe náà ṣáájú.
- source_word: ὑπεπλεύσαμεν
  choice: a gba ìhà ... tí ó ní ààbò lọ
  rationale: Ọ̀rọ̀ atukọ̀ yìí ń tọ́ka sí lílọ ní ìhà erékùṣù tí ó ṣíji fún ẹ̀fúùfù, kì í ṣe pé a wà ‘ní abẹ́’ rẹ̀ ní ti àyè lásán.
- source_word: τὴν Κύπρον
  choice: Kípírù
  rationale: Èyí ni àkọsílẹ̀ orúkọ erékùṣù Kύπρος ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: διὰ τὸ ... εἶναι
  choice: nítorí pé
  rationale: διά pẹ̀lú articular infinitive ń sọ ìdí; ‘nítorí pé’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: τοὺς ἀνέμους
  choice: àwọn ẹ̀fúùfù
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ orísun mọ́, ó sì jẹ́ ìtumọ̀ tààrà.
- source_word: ἐναντίους
  choice: ń kọjú sí wa
  rationale: Ó sọ pé ẹ̀fúùfù náà lòdì sí ipa ọ̀nà ọkọ̀ wọn; ‘sí wa’ mú ohun tí ọ̀rọ̀ náà túmọ̀ sí nínú àyíká yìí ṣe kedere láì yí èrò rẹ̀ padà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì yẹ fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ atukọ̀ àjèjì tí ọ̀pọ̀ ènìyàn kò ní lóye, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ pàtó ti ὑποπλέω pamọ́.
