source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: yo
  text: Ọ̀pọ̀ ọjọ́ ni a fi ń lọ lọ́ra nínú ọkọ̀ ojú omi, pẹ̀lú ìṣòro ni a fi dé sí ìhà Knídù. Níwọ̀n bí afẹ́fẹ́ kò ti jẹ́ kí a tẹ̀ síwájú[a], a fi ọkọ̀ lọ ní abẹ́ ààbò Kírétè, ní ìhà Sálímónè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “afẹ́fẹ́ kò fún wa láyè” tàbí “afẹ́fẹ́ kò jẹ́ kí a máa lọ síwájú.” Gbólóhùn Gíríìkì náà ṣàlàyé ìdí tí wọ́n fi gba ipa ọ̀nà yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “a lọ ní abẹ́ Kírétè”—èyí ni pé, wọ́n lọ ní ìhà erékùṣù náà tí ó dáàbò bo ọkọ̀ lọ́wọ́ afẹ́fẹ́, ní ìhà Sálímónè.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Ọ̀pọ̀ ọjọ́ ni a fi
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìrìn ọkọ̀ náà gùn ju bí a ti retí lọ; gbólóhùn Yorùbá yìí sọ iye àkókò náà ní ọ̀nà àdánidá.
- source_word: βραδυπλοοῦντες
  choice: ń tukọ̀ lọ́ra
  rationale: Ó pa àwòrán ìrìn ọkọ̀ ojú omi mọ́, ó sì yàtọ̀ sí μόλις, èyí tí a túmọ̀ sí pé ìṣòro ni wọ́n fi dé.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: ìṣòro sì ni a fi dé sí ibi tó dojú kọ Kínídù
  rationale: μόλις ń fi ìṣòro ńlá hàn, κατά sì ń tọ́ka sí ibi tí ó dojú kọ́ tàbí tí ó wà ní òdìkejì Kínídù nínú ìrìn ojú omi.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Níwọ̀n bí afẹ́fẹ́ kò ti jẹ́ kí a tẹ̀ síwájú
  rationale: Genitive absolute yìí ṣàlàyé ìdí tí wọ́n fi yí ipa ọ̀nà wọn padà. “Tẹ̀ síwájú” sọ ìdènà ìrìn náà ní Yorùbá àdánidá, láì fi ìtumọ̀ kan ṣoṣo kan ọ̀rọ̀-ìṣe náà mọ́lẹ̀.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: a tukọ̀ gba ẹ̀gbẹ́ Kírétè tó ní ààbò lọ
  rationale: ὑποπλέω ní èdè ìrìn ojú omi túmọ̀ sí lílọ ní ẹ̀gbẹ́ erékùṣù tí ó dáàbò bo ọkọ̀ lọ́wọ́ afẹ́fẹ́.
- source_word: κατὰ Σαλμώνην
  choice: ní agbègbè Sálímónè
  rationale: κατά pẹ̀lú àmì ilẹ̀ etíkun ń tọ́ka sí ibi tí ọkọ̀ wà lẹ́gbẹ̀ẹ́ tàbí ní agbègbè àmì ilẹ̀ náà; yíyan yìí kò sọ pé wọ́n dúró níbẹ̀.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Kínídù / Kírétè / Sálímónè
  rationale: A ṣe àkọsílẹ̀ orúkọ àwọn ibi náà ní ìró tí ó bá èdè Yorùbá mu, pẹ̀lú àmì ohùn níbi tí ó ti rọrùn láti kà.
