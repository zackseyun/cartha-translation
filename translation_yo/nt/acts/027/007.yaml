translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Tukọ̀” pa àyíká ọkọ̀ ojú omi mọ́; “ẹ̀gbẹ́… tó ní ààbò” sì ṣe kedere ju lílo ọ̀rọ̀ amọ̀ṣẹ́dunjú ti àwọn atukọ̀ lọ. Àmì [a] wà lẹ́yìn gbólóhùn tí àlàyé rẹ̀ kan, dípò lẹ́yìn “lọ́ra,” nítorí akọsilẹ̀ náà ń ṣàlàyé μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου.
