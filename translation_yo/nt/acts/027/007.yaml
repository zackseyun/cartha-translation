review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtàn Gíríìkì dáadáa ní gbogbogbò: ìlọra fún ọjọ́ púpọ̀, dídé sí ìhà Knídù pẹ̀lú ìṣòro, ìdènà afẹ́fẹ́, àti lílọ ní abẹ́ ààbò Kírétè. Ṣùgbọ́n “tukọ̀” kì í ṣe ọ̀rọ̀ Yorùbá ìgbàlódé tí ó wọ́pọ̀ tàbí tí ó ṣe kedere fún ìrìn ọkọ̀ ojú omi nínú àyíká yìí.'
  naturalness: A tún ṣe àwọn gbólóhùn kan kí wọ́n lè rọrùn, kí wọ́n sì dára ní Yorùbá ìgbàlódé. “Pẹ̀lú ìṣòro ni a fi dé sí ìhà Knídù” jẹ́ ìsọ̀rọ̀ adayeba ju “ìṣòro sì ni a fi dé sí ibi tó dojú kọ Kínídù.” “Ní abẹ́ ààbò Kírétè” fi ìtumọ̀ ọ̀rọ̀ ọkọ̀ ojú omi náà hàn ní kedere.
  terminology: A pa ìtumọ̀ ὑπεπλεύσαμεν mọ́ gẹ́gẹ́ bí lílọ ní ìhà erékùṣù tí ó dáàbò bo ọkọ̀ kúrò ní afẹ́fẹ́. Orúkọ ibi náà ni a ṣe sí “Knídù,” “Kírétè,” àti “Sálímónè,” ní ìbámu pẹ̀lú ìlànà fífi orúkọ àjèjì wọ Yorùbá.
  issues:
  - severity: medium
    issue: “tukọ̀” nínú ọ̀rọ̀ àkọ́kọ́ àti ní gbolohun ìkẹyìn kò ṣe kedere gẹ́gẹ́ bí ọ̀rọ̀ ìrìn ọkọ̀ ojú omi.
    rationale: Ó lè dá òǹkàwé lójú tàbí dà bí ọ̀rọ̀ tí a ṣe tuntun. Lílo “a ń lọ lọ́ra nínú ọkọ̀ ojú omi” àti “a fi ọkọ̀ lọ” jẹ́ kedere, ó sì pa àyíká ọkọ̀ ojú omi mọ́.
  - severity: low
    issue: “Ìṣòro sì ni a fi dé sí ibi tó dojú kọ Kínídù” dùn bí ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀.
    rationale: “Pẹ̀lú ìṣòro ni a fi dé sí ìhà Knídù” ń sọ μόλις àti κατὰ τὴν Κνίδον ní Yorùbá tó rọrùn, láì sọ ju ohun tí ọrọ̀ náà ní lọ.
  - severity: low
    issue: Àlàyé [a] ní “a sún mọ́ ọn” ní aṣojú-ọrọ̀ tí kò ní ohun tí ó tọ́ka sí kedere.
