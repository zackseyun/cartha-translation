- from: Ọ̀pọ̀ ọjọ́ ni a fi ń tukọ̀ lọ́ra, ìṣòro sì ni a fi dé sí ibi tó dojú kọ Kínídù. Níwọ̀n bí afẹ́fẹ́ kò ti jẹ́ kí a tẹ̀ síwájú[a], a tukọ̀ gba ẹ̀gbẹ́ Kírétè tó ní ààbò lọ, ní agbègbè Sálímónè[b].
  to: Ọ̀pọ̀ ọjọ́ ni a fi ń lọ lọ́ra nínú ọkọ̀ ojú omi, pẹ̀lú ìṣòro ni a fi dé sí ìhà Knídù. Níwọ̀n bí afẹ́fẹ́ kò ti jẹ́ kí a tẹ̀ síwájú[a], a fi ọkọ̀ lọ ní abẹ́ ààbò Kírétè, ní ìhà Sálímónè[b].
  rationale: Àtúnṣe náà mú ọ̀rọ̀ ọkọ̀ ojú omi di kedere síi láì fi ohun tí kò sí nínú Gíríìkì kún un. Ó tún pa ìyàtọ̀ mọ́ láàárín βραδυπλοοῦντες (“ń lọ lọ́ra”) àti μόλις (“pẹ̀lú ìṣòro”), ó sì fi ìtumọ̀ ìhà tí afẹ́fẹ́ kì í gbóná sí nínú ὑπεπλεύσαμεν hàn.
