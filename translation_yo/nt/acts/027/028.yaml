  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: yo
  text: Wọ́n sì fi okùn ìwọ̀n wọ̀n ìjìnlẹ̀ omi náà[a], wọ́n sì rí i pé ó jẹ́ ogún ìwọ̀n apá[b]. Lẹ́yìn tí wọ́n lọ síwájú díẹ̀, wọ́n tún wọ̀n ọn, wọ́n sì rí i pé ó jẹ́ mẹ́ẹ̀ẹ́dógún ìwọ̀n apá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “wọ́n ju ohun èlò wíwọ̀n sílẹ̀.” Wọ́n máa ń so ohun tó wúwo mọ́ okùn láti fi mọ bí omi ṣe jìn tó.
    reason: lexical_alternative
  - marker: b
    text: Ìwọ̀n apá kan jẹ́ nǹkan bíi mítà 1.8 (ẹsẹ̀ bàtà mẹ́fà); ó fẹ́rẹ̀ẹ́ dọ́gba pẹ̀lú fathom kan.
    reason: measurement_clarification
lexical_decisions:
- source_word: βολίσαντες
  choice: fi okùn ìwọ̀n wọ́n ìjìnlẹ̀ omi náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi okùn tí ohun èlò wíwọ̀n wà ní ìsàlẹ̀ rẹ̀ wọ́n bí omi ṣe jìn tó. Ìtumọ̀ yìí ṣe kedere ní Yorùbá òde òní, ó sì pa iṣẹ́ pàtó náà mọ́.
- source_word: εὗρον
  choice: wọ́n sì rí i pé ó jẹ́
  rationale: Èyí sọ àbájáde tí wọ́n rí gbà lẹ́yìn wíwọ̀n náà ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ὀργυιὰς
  choice: ìwọ̀n apá
  rationale: ὀργυιά jẹ́ ìwọ̀n gígùn láti orí ìka ọwọ́ kan dé èkejì nígbà tí a na apá méjèèjì, ó sì jẹ́ nǹkan bí ẹsẹ̀ bàtà mẹ́fà. ‘Ìwọ̀n apá’ pa àwòrán ìwọ̀n Gíríìkì mọ́ láì fi ọ̀rọ̀ àjèjì tí kò wọ́pọ̀ sínú ẹsẹ náà.
- source_word: εἴκοσι
  choice: ogún
  rationale: Ìtumọ̀ tààrà fún nọ́ńbà náà.
- source_word: βραχὺ διαστήσαντες
  choice: Lẹ́yìn tí wọ́n lọ síwájú díẹ̀
  rationale: Nínú àyíká ìrìn ọkọ̀ ojú omi yìí, gbólóhùn náà túmọ̀ sí pé wọ́n tẹ̀ síwájú fún ọ̀nà kúkúrú kí wọ́n tó tún wọ̀n.
- source_word: πάλιν βολίσαντες
  choice: wọ́n tún wọ̀n ọn
  rationale: ‘Tún’ fi hàn pé wọ́n ṣe iṣẹ́ wíwọ̀n ìjìnlẹ̀ náà lẹ́ẹ̀kan sí i, bí πάλιν ṣe sọ.
- source_word: δεκαπέντε
  choice: mẹ́ẹ̀ẹ́dógún
  rationale: Ìtumọ̀ tààrà fún nọ́ńbà náà.
- source_word: καὶ ... δὲ ... καὶ
  choice: Wọ́n sì ... Lẹ́yìn ... wọ́n tún ... wọ́n sì
  rationale: Àwọn àsopọ̀ náà ń ṣe iṣẹ́ ìtẹ̀síwájú ìtàn ní pàtàkì, kì í ṣe ìtakora líle; ìṣètò yìí jẹ́ ti Yorùbá àdánidá.
