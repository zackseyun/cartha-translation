translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Okùn ìwọ̀n’ mú iṣẹ́ àwọn atukọ̀ ojú omi yé ẹni tí kò mọ èdè iṣẹ́ ọkọ̀ ojú omi, nígbà tí ‘ìwọ̀n apá’ àti àlàyé ìsàlẹ̀ ojú ìwé pa ìwọ̀n ayé àtijọ́ mọ́.
