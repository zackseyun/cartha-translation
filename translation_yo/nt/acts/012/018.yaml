source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́,[a] ìdàrúdàpọ̀ tí kò kéré ṣẹlẹ̀ láàárín àwọn ọmọ ogun nípa ohun tí ó ṣẹlẹ̀ sí Peteru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí ilẹ̀ mọ́, ìdàrúdàpọ̀ ńlá wà láàárín àwọn ọmọ ogun nípa ohun tí ó ṣẹlẹ̀ sí Peteru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Gbólóhùn yìí jẹ́ genitive absolute tí ó tọ́ka sí àkókò; “nígbà tí ilẹ̀ mọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún bí ọjọ́ ṣe bẹ̀rẹ̀, δέ sì ń so ìṣẹ̀lẹ̀ tuntun mọ́ ohun tó ṣáájú láìjẹ́ pé a fi ọ̀rọ̀ àfikún bí “nísinsin yìí” sí i.
- source_word: τάραχος οὐκ ὀλίγος
  choice: ìdàrúdàpọ̀ tí kò kéré
  rationale: Ó pa litotes Gíríìkì “tí kò kéré” mọ́, èyí tó túmọ̀ sí ìdàrúdàpọ̀ púpọ̀, nígbà tó sì ṣì ṣeé lóye ní Yorùbá.
- source_word: ἐν τοῖς στρατιώταις
  choice: láàárín àwọn ọmọ ogun
  rationale: στρατιώταις túmọ̀ sí “àwọn ọmọ ogun”; “láàárín” sì fi hàn pé inú ẹgbẹ́ wọn ni ìdàrúdàpọ̀ náà ti wáyé, láìdín ìtumọ̀ rẹ̀ kù sí àwọn olùṣọ́ nìkan.
- source_word: τί ἄρα
  choice: nípa ohun tí
  rationale: Nínú ìbéèrè àìtààrà yìí, ἄρα ní ìmọ̀lára ìyàlẹ́nu tàbí wíwá ohun tó ṣẹlẹ̀; “nípa ohun tí” bá ìṣètò gbolohun Yorùbá mu láìfi ìtumọ̀ àfikún kan sí i.
- source_word: ὁ Πέτρος
  choice: Peteru
  rationale: Orúkọ ẹni náà ni a kọ ní ìrísí tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: ἐγένετο
  choice: ó ṣẹlẹ̀ sí
  rationale: Nínú àkópọ̀ τί ... ἐγένετο pẹ̀lú ẹni, ìtumọ̀ rẹ̀ ni “ohun tí ó ṣẹlẹ̀ sí” tàbí “ohun tí ó di”; yíyan yìí jẹ́ Yorùbá àdánidá, ó sì bá àyíká ọ̀rọ̀ mu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A pa ọ̀nà àsọyé litotes inú Gíríìkì mọ́ nínú “tí kò kéré,” nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fúnni ní àṣàyàn tó túbọ̀ túmọ̀ ìtẹnumọ́ náà.
