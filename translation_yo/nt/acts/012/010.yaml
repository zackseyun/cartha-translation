revisions:
- from: Nígbà tí wọ́n ti kọjá ibi ìṣọ́ àkọ́kọ́ àti èkejì, wọ́n dé ẹnubodè irin tí ó lọ sí inú ìlú. Ẹnubodè náà fúnra rẹ̀ ṣí sílẹ̀ fún wọn[a]. Nígbà tí wọ́n jáde, wọ́n tẹ̀ síwájú gba òpópónà kan[b]; lẹ́sẹ̀kẹsẹ̀ ni áńgẹ́lì náà sì kúrò lọ́dọ̀ rẹ̀.
  to: Nígbà tí wọ́n ti kọjá ibi ìṣọ́ àkọ́kọ́ àti ibi ìṣọ́ kejì, wọ́n dé ẹnubodè irin tó jẹ́ ọ̀nà wọ ìlú. Ẹnubodè náà fúnra rẹ̀ ṣí sílẹ̀ fún wọn[a]. Nígbà tí wọ́n jáde, wọ́n gba òpópónà kan lọ[b]; lẹ́sẹ̀kẹsẹ̀ ni áńgẹ́lì náà sì kúrò lọ́dọ̀ rẹ̀.
  rationale: The revision makes the gate's function as access into the city idiomatic in Yoruba, removes anthropomorphic language from the αὐτομάτη alternative, and smooths the movement and guard-station expressions while retaining the Greek narrative sequence and the singular pronoun referring to Peter.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence: passing two guard stations, reaching the iron gate, its self-opening, proceeding one street, and the angel''s immediate departure from Peter. However, the gate is described as ''tí ó lọ sí inú ìlú'' (''that goes into the city''), which is less idiomatic and does not naturally express that it provided entry into the city.'
  naturalness: The prose is generally clear Standard Yoruba, but explicitly repeating 'ibi ìṣọ́' for the second station improves clarity, and 'wọ́n gba òpópónà kan lọ' is a more natural expression for proceeding along a street. The alternative footnote's wording 'láti inú ìfẹ́ tirẹ̀' wrongly suggests volition or desire on the gate's part.
  terminology: ‘Ibi ìṣọ́,’ ‘ẹnubodè irin,’ and ‘áńgẹ́lì’ are suitable. ‘Fúnra rẹ̀’ accurately conveys αὐτομάτη without importing a mechanistic sense.
  issues:
  - severity: medium
    issue: The gate is said to be 'tí ó lọ sí inú ìlú.'
    rationale: In Yoruba this more naturally attributes movement to the gate itself. The Greek participle φέρουσαν means that the gate led/provided access into the city; ‘tó jẹ́ ọ̀nà wọ ìlú’ states this naturally.
  - severity: medium
    issue: Footnote a renders the alternative as acting ‘láti inú ìfẹ́ tirẹ̀.’
    rationale: This introduces an unwarranted notion of the gate's will or desire. αὐτομάτη means ‘of its own accord/by itself’; the note should retain that non-volitional sense.
  - severity: low
    issue: The second guard station is left elliptically as ‘àti èkejì.’
    rationale: Though understandable, repeating ‘ibi ìṣọ́’ is clearer and more natural in this formal narrative context.
  revised_text: Nígbà tí wọ́n ti kọjá ibi ìṣọ́ àkọ́kọ́ àti ibi ìṣọ́ kejì, wọ́n dé ẹnubodè irin tó jẹ́ ọ̀nà wọ ìlú. Ẹnubodè náà fúnra rẹ̀ ṣí sílẹ̀ fún wọn[a]. Nígbà tí wọ́n jáde, wọ́n gba òpópónà kan lọ[b]; lẹ́sẹ̀kẹsẹ̀ ni áńgẹ́lì náà sì kúrò lọ́dọ̀ rẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ó ṣí sílẹ̀ fún wọn fúnra rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Òpópónà kan” lè túmọ̀ sí pé wọ́n lọ ní jíjìn tí ó tó òpópónà kan kí áńgẹ́lì náà tó kúrò lọ́dọ̀ rẹ̀.
    reason: cultural_note
  revision_rationale: The revision makes the gate's function as access into the city idiomatic in Yoruba, removes anthropomorphic language from the αὐτομάτη alternative, and smooths the movement and guard-station expressions while retaining the Greek narrative sequence and the singular pronoun referring to Peter.
