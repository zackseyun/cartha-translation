id: ACT.12.10
reference: Acts 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: yo
  text: Nígbà tí wọ́n ti kọjá ibi ìṣọ́ àkọ́kọ́ àti ibi ìṣọ́ kejì, wọ́n dé ẹnubodè irin tó jẹ́ ọ̀nà wọ ìlú. Ẹnubodè náà fúnra rẹ̀ ṣí sílẹ̀ fún wọn[a]. Nígbà tí wọ́n jáde, wọ́n gba òpópónà kan lọ[b]; lẹ́sẹ̀kẹsẹ̀ ni áńgẹ́lì náà sì kúrò lọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ṣí sílẹ̀ fún wọn fúnra rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Òpópónà kan” lè túmọ̀ sí pé wọ́n lọ ní jíjìn tí ó tó òpópónà kan kí áńgẹ́lì náà tó kúrò lọ́dọ̀ rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Nígbà tí wọ́n ti kọjá
  rationale: Ó fi hàn pé kí wọ́n tó dé ẹnubodè ni wọ́n ti kọjá àwọn ibi ìṣọ́ méjèèjì; ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀lé ìṣẹ̀lẹ̀ ní Yorùbá.
- source_word: φυλακὴν ... πρώτην ... καὶ δευτέραν
  choice: ibi ìṣọ́ àkọ́kọ́ àti èkejì
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ibi tí àwọn ẹ̀ṣọ́ dúró, kì í ṣe sí ẹ̀wọ̀n méjì tàbí àkókò ìṣọ́ lásán.
- source_word: πύλην τὴν σιδηρᾶν
  choice: ẹnubodè irin
  rationale: Ó pa ìtumọ̀ ohun tí wọ́n fi ṣe ẹnubodè náà mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: tí ó lọ sí inú ìlú
  rationale: Ó sọ ní ṣókí àti ní àdánidá pé ẹnubodè náà ni ọ̀nà àbáwọlé sí inú ìlú.
- source_word: αὐτομάτη
  choice: fúnra rẹ̀
  rationale: Ó fi ìyàlẹ́nu pé ẹnubodè náà ṣí láìsí ẹni tí ó fọwọ́ ṣí i hàn, láìlo ọ̀rọ̀ ìgbàlódé kan tí ó lè mú ẹ̀rọ aládàáṣiṣẹ́ wá sí ọkàn.
- source_word: ῥύμην μίαν
  choice: gba òpópónà kan
  rationale: ῥύμη lè túmọ̀ sí òpópónà tàbí ọ̀nà kékeré; gbólóhùn yìí tún lè tọ́ka sí jíjìn tí ó tó òpópónà kan, nítorí náà àlàyé wà ní àkọsílẹ̀ ìsàlẹ̀.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ kíákíá lẹ́yìn èyí tí ó ṣáájú rẹ̀ hàn ní kedere.
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: áńgẹ́lì náà ... kúrò lọ́dọ̀ rẹ̀
  rationale: Ó pa arọ́pò-orúkọ inú orísun mọ́, ó sì fi hàn pé áńgẹ́lì náà pínyà kúrò lọ́dọ̀ ẹni tí ó ń bá lọ.
theological_decisions:
- issue: Bí ẹnubodè náà ṣe ṣí
  choice: Ẹnubodè náà fúnra rẹ̀ ṣí sílẹ̀ fún wọn
  alternative: Ẹnubodè náà ṣí sílẹ̀ fún wọn láìsí ẹni tí ó ṣí i
  rationale: Ìtumọ̀ yìí pa ìṣẹ̀lẹ̀ àrà náà mọ́ gẹ́gẹ́ bí orísun ṣe sọ ọ́, láìfi àlàyé nípa ohun tó fà á kún un.
- issue: Ohun tí φυλακή ń tọ́ka sí
  choice: ibi ìṣọ́
  alternative: ẹ̀ṣọ́; àkókò ìṣọ́
  rationale: Àyíká ìsálọ Pétérù fi hàn pé wọ́n ń kọjá àwọn ibi ààbò lẹ́sẹẹsẹ; ‘ibi ìṣọ́’ mú èyí yé ni kedere láìsọ pé ẹ̀wọ̀n méjì ni.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yà àwọn ìṣe lẹ́sẹẹsẹ sí gbólóhùn kúkúrú kí ìtàn náà lè ṣàn dáadáa.
