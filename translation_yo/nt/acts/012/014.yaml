translation_notes:
  register: A lo Yorùbá boṣewa tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹ̀sí ìtàn náà mọ́ pẹ̀lú ‘ó sáré wọlé,’ a sì lo ‘bí kò ṣe pé’ láti fi ìyípadà láti ohun tí ẹni lè retí sí ohun tí ó ṣe gan-an hàn.
