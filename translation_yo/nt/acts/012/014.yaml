source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: yo
  text: Nígbà tí ó dá ohùn Peteru mọ̀, nítorí ayọ̀ rẹ̀, kò ṣí ẹnu-ọ̀nà àgbàlá náà[a], ṣùgbọ́n ó sáré wọlé, ó sì ròyìn pé Peteru ń dúró níwájú ẹnu-ọ̀nà náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹnu-ọ̀nà òde” tàbí “ọ̀nà àbáwọlé”; πυλών ń tọ́ka sí ibi tí a ti ń wọ láti ojú pópó sínú ilẹ̀ ilé.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ó ròyìn pé Peteru ń dúró níwájú ẹnu-ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: dá ... mọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí pé ó mọ ẹni náà nígbà tí ó gbọ́ ohùn rẹ̀, ó sì bá ìtumọ̀ participle aorist mu.
- source_word: φωνὴν
  choice: ohùn
  rationale: Nínú àyíká yìí, φωνή ń tọ́ka sí ohùn Peteru tí a gbọ́, kì í ṣe ariwo lásán.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: nítorí ayọ̀ rẹ̀
  rationale: Àpólà yìí ń fi ìdí tàbí ohun tó fà á hàn; ìtumọ̀ yìí ṣe kedere ní Yorùbá òde òní.
- source_word: οὐκ ἤνοιξεν
  choice: kò ṣí
  rationale: ἀνοίγω túmọ̀ sí ‘ṣí’; kò sí ẹ̀rí nínú ọ̀rọ̀ Gíríìkì láti sọ pé ó tú kọ́kọ́rọ́.
- source_word: πυλῶνα / πυλῶνος
  choice: ẹnu-ọ̀nà àgbàlá
  rationale: πυλών lè jẹ́ ẹnu-ọ̀nà tàbí ẹnu-ọ̀nà òde láti ojú pópó wọ inú ilẹ̀ ilé; ‘ẹnu-ọ̀nà àgbàlá’ mú àyíká ilé náà hàn ní Yorùbá àdánidá.
- source_word: εἰσδραμοῦσα
  choice: ó sáré wọlé
  rationale: Ó pa ìṣípòpadà kíákíá sí inú mọ́, ó sì mú kí ìtàn náà máa lọ kánkán.
- source_word: ἀπήγγειλεν
  choice: ó sì ròyìn
  rationale: ἀπαγγέλλω túmọ̀ sí jíṣẹ́ tàbí ròyìn ohun kan; ‘ròyìn’ bá ìforúkọsílẹ̀ ìtàn mu.
- source_word: ἑστάναι
  choice: dúró
  rationale: Perfect infinitive náà ń fi ipò tí Peteru wà nínú rẹ̀ hàn; ‘dúró’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: πρὸ τοῦ πυλῶνος
  choice: níwájú ẹnu-ọ̀nà náà
  rationale: Èyí pa ìtumọ̀ πρό pẹ̀lú genitive mọ́ ní kíkún ju ‘ní ẹnu-ọ̀nà’ lọ.
