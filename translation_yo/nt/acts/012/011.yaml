id: ACT.12.11
reference: Acts 12:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: yo
  text: Nígbà tí Pétérù sì wá sí ara rẹ̀[a], ó sọ pé, “Nísinsìnyí ni mo mọ̀ dájúdájú pé Olúwa rán áńgẹ́lì rẹ̀, ó sì gbà mí kúrò lọ́wọ́ Hẹ́rọ́dù[b] àti kúrò nínú gbogbo ohun tí àwọn ènìyàn Júù ń retí pé yóò ṣẹlẹ̀ sí mi[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “nígbà tí Pétérù padà wá mọ ohun tó ń ṣẹlẹ̀” tàbí “nígbà tí Pétérù wá mọ ara rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “lọ́wọ́ Hẹ́rọ́dù,” túmọ̀ sí pé ó bọ́ kúrò lábẹ́ agbára tàbí ìkáwọ́ Hẹ́rọ́dù.
    reason: cultural_note
  - marker: c
    text: Ní tààràtà, “kúrò nínú gbogbo ìrètí àwọn ènìyàn Júù”; ìyẹn ni gbogbo ohun tí wọ́n ń retí pé yóò ṣẹlẹ̀ sí Pétérù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: wá sí ara rẹ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì ń fi hàn pé Pétérù padà ní òye kíkún nípa ohun tó ń ṣẹlẹ̀ lẹ́yìn ìrírí tó dà bí ìran.
- source_word: ἀληθῶς
  choice: dájúdájú
  rationale: Ó fi ìdánilójú tó lágbára tí Pétérù ní hàn ní Yorùbá àdánidá.
- source_word: ἐξαπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ yìí sọ iṣẹ́ rírán jáde ní kedere láì mú kí gbolohun le tàbí di àjèjì.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí pa àìsọ pàtó ẹni tí κύριος ń tọ́ka sí mọ́, bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
- source_word: ἄγγελον
  choice: áńgẹ́lì
  rationale: Àyíká ìtàn náà fi hàn gbangba pé ẹ̀dá ọ̀run ni, kì í ṣe ońṣẹ́ ènìyàn lásán.
- source_word: ἐξείλατό με
  choice: gbà mí kúrò
  rationale: Ó sọ ìgbàlà kúrò nínú ewu tàbí ìkáwọ́ ní Yorùbá òde òní tó ṣe kedere.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: lọ́wọ́ Hẹ́rọ́dù
  rationale: ‘Lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa àwòrán ‘ọwọ́’ mọ́, ó sì tún lè túmọ̀ sí agbára tàbí ìkáwọ́.
- source_word: πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων
  choice: gbogbo ohun tí àwọn ènìyàn Júù ń retí pé yóò ṣẹlẹ̀ sí mi
  rationale: Ó mú ìtumọ̀ pé ohun tí àwọn Júù ń retí kí ó ṣẹlẹ̀ sí Pétérù ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ìrísí ọ̀rọ̀ Gíríìkì tó túmọ̀ sí ‘gbogbo ìrètí’ hàn.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Ọlọ́run; Jésù tó jíǹde
  rationale: Ẹ̀dà Gíríìkì kò sọ ẹni náà ní pàtó. ‘Olúwa’ pa ọ̀rọ̀ orísun àti àìsọ pàtó rẹ̀ mọ́, láì pinnu pé Ọlọ́run tàbí Jésù ni ní ibi yìí.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn síbi tí ó bá jẹ́ àdánidá, a sì lo ‘lọ́wọ́’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó lè gbé àwòrán ọwọ́ àti ìtumọ̀ agbára papọ̀.
