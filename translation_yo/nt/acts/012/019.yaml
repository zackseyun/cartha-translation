id: ACT.12.19
reference: Acts 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: yo
  text: Ṣùgbọ́n Hẹ́rọ́dù, lẹ́yìn tí ó wá a tí kò sì rí i, fọ̀rọ̀ wá àwọn ẹ̀ṣọ́ wò, ó sì pàṣẹ pé kí a mú wọn lọ.[a] Lẹ́yìn náà, ó sọ̀ kalẹ̀ láti Jùdíà lọ sí Kesaréà, ó sì lo àkókò kan níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ó pàṣẹ pé kí a mú wọn lọ.” Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe gidigidi pé a mú wọn lọ láti pa wọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: lẹ́yìn tí ó wá a
  rationale: Ó fi hàn pé Hẹ́rọ́dù mọ̀ọ́mọ̀ wá Pétérù, ìṣe náà sì ṣáájú fífi àwọn ẹ̀ṣọ́ wádìí.
- source_word: μὴ εὑρὼν
  choice: tí kò sì rí i
  rationale: Ọ̀rọ̀ yìí mú àbájáde ìwá kiri náà—pé kò rí Pétérù—hàn ní Yorùbá àdánidá.
- source_word: ἀνακρίνας
  choice: fi ìbéèrè wádìí ọ̀rọ̀ lọ́wọ́
  rationale: Ó ṣàfihàn ìfọ̀rọ̀wánilẹ́nuwò onídàájọ́ tàbí ìwádìí aláṣẹ, kì í ṣe ìbéèrè lásán.
- source_word: φύλακας
  choice: àwọn ẹ̀ṣọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí a yàn láti ṣọ́ Pétérù.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: ó pàṣẹ pé kí a mú wọn lọ pa
  rationale: ἀπαχθῆναι túmọ̀ ní tààrà sí mímú wọn lọ, ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí ó ṣeé ṣe gidigidi pé ìpànìyàn ni àṣẹ náà ń tọ́ka sí; àlàyé ìsàlẹ̀ pa ìtumọ̀ tààrà mọ́.
- source_word: κατελθὼν
  choice: ó sọ̀ kalẹ̀
  rationale: Ó pa èdè ìrìn-àjò oníjìọ́gráfì Gíríìkì mọ́ láti Jùdíà tó ga sí Kesaria etíkun.
- source_word: Ἰουδαίας
  choice: Jùdíà
  rationale: Orúkọ agbègbè náà ní ìkọ̀wé Yorùbá tó wọ́pọ̀.
- source_word: Καισάρειαν
  choice: Kesaria
  rationale: Àkọsílẹ̀ orúkọ ìlú náà ní ọ̀nà tó rọrùn fún olùkà Yorùbá.
- source_word: διέτριβεν
  choice: ó sì dúró níbẹ̀
  rationale: Ó fi ìṣe tó ń bá a lọ hàn, ìyẹn pé ó lo àkókò kan níbẹ̀.
theological_decisions:
- issue: Bóyá kí ἀπαχθῆναι dúró gẹ́gẹ́ bí ‘kí a mú wọn lọ’ tàbí kí ìjìyà tí ọ̀rọ̀ náà ń tọ́ka sí hàn gbangba
  choice: kí a mú wọn lọ pa
  alternative: kí a mú wọn lọ
  rationale: Gíríìkì kò lo ọ̀rọ̀ pàtó fún pípa níbí, ṣùgbọ́n àyíká ìtàn àti ìjìyà àwọn ẹ̀ṣọ́ tí ẹlẹ́wọ̀n sá lọ ń tọ́ka gidigidi sí ìpànìyàn. Àlàyé ìsàlẹ̀ jẹ́ kí àìdánilójú inú ọ̀rọ̀ ìpilẹ̀ má bàjẹ́.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Fi ìbéèrè wádìí ọ̀rọ̀ lọ́wọ́’ mú ìwádìí aláṣẹ hàn; ‘sọ̀ kalẹ̀’ sì pa àwòrán ìrìn-àjò inú Gíríìkì mọ́.
