id: ACT.12.23
reference: Acts 12:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, áńgẹ́lì Olúwa kan lù ú, nítorí kò fi ògo náà fún Ọlọ́run[a]; ó sì di ẹni tí àwọn ìdin ń jẹ[b], ó sì kú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fi ògo fún Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdin jẹ ẹ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó mí ẹ̀mí rẹ̀ jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ láìjáfara, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐπάταξεν
  choice: lù ú
  rationale: Ó túmọ̀ sí pé áńgẹ́lì náà kọlu un; a kò fi “pa á” sí i, nítorí ọ̀rọ̀ nípa ikú rẹ̀ wá lẹ́yìn náà.
- source_word: ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa kan
  rationale: Orúkọ náà kò ní àpilẹ̀kọ ní Gíríìkì; “kan” mú ìtumọ̀ aláìdánimọ̀ náà jáde ní Yorùbá.
- source_word: ἀνθ’ ὧν
  choice: nítorí
  rationale: Ó sọ ìdí ìdájọ́ náà ní Yorùbá tí ó ṣe kedere.
- source_word: ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: kò fi ògo náà fún Ọlọ́run
  rationale: “Ògo náà” pa àpilẹ̀kọ Gíríìkì mọ́, ó sì tọ́ka sí ọlá tí ó yẹ kí ó fi fún Ọlọ́run.
- source_word: γενόμενος σκωληκόβρωτος
  choice: ìdin sì jẹ ẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó di ẹni tí àwọn ìdin ń jẹ, láìṣe àfikún àlàyé ìṣègùn tàbí bí àkókò náà ṣe gùn tó.
- source_word: ἐξέψυξεν
  choice: ó sì kú
  rationale: Èyí ni ìtumọ̀ àdánidá jù lọ ní Yorùbá; àṣàyàn “ó mí èémí ìkẹyìn” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú ìdájọ́ tí ẹsẹ yìí ṣàpèjúwe
  choice: Ẹsẹ náà sọ pé ikú Hẹ́rọ́dù jẹ́ ìdájọ́ Ọlọ́run tí áńgẹ́lì Olúwa mú ṣẹ, nítorí kò fi ògo fún Ọlọ́run.
  alternative: Kí a ka a sí ikú àdánidá lásán tí a ṣàpèjúwe ní èdè ẹ̀sìn, tàbí kí a sọ pé ó kú ní ìṣẹ́jú kan náà tí áńgẹ́lì náà lù ú.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìkọlù náà lé áńgẹ́lì Olúwa lọ́wọ́, ó sì sọ ìdí rẹ̀ ní kedere. Síbẹ̀, ìtumọ̀ náà kò pinnu àkókò tàbí ìlànà ìṣègùn tí ọ̀rọ̀ náà fúnra rẹ̀ kò ṣàlàyé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “áńgẹ́lì Olúwa kan” láti fi àìdánimọ̀ inú Gíríìkì hàn, a sì lo “ìdin sì jẹ ẹ́” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún àwòrán líle tí σκωληκόβρωτος gbé kalẹ̀.
