source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n sọ fún un pé, “Orí rẹ̀ ti dàrú.” Ṣùgbọ́n ó ń tẹnumọ́ pé bẹ́ẹ̀ ni ó rí. Wọ́n sì ń sọ pé, “Áńgẹ́lì rẹ̀ ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí bóyá, “áńgẹ́lì olùṣọ́ rẹ̀,” “áńgẹ́lì aṣojú rẹ̀,” tàbí, gẹ́gẹ́ bí àwọn atúmọ̀ kan ṣe wí, “ẹ̀mí rẹ̀.” Gíríìkì kàn sọ pé, “áńgẹ́lì rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Orí rẹ ti dàrú
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi ẹ̀sùn pé ẹni náà kò ronú lọ́nà tí ó tọ́ hàn, láìlo ọ̀rọ̀ ìṣègùn tàbí ọ̀rọ̀ àtijọ́ tí ó le jù.
- source_word: διϊσχυρίζετο
  choice: ó ń tẹnumọ́ ọn
  rationale: Àmì àkókò imperfect àti agbára ọ̀rọ̀ Gíríìkì náà fi ìtẹnumọ́ tí ó ń bá a lọ hàn; “ń tẹnumọ́ ọn” mú méjèèjì jáde.
- source_word: οὕτως ἔχειν
  choice: pé bẹ́ẹ̀ ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun tí a sọ rí bẹ́ẹ̀ gan-an.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Ìlò imperfect náà tọ́ka sí ọ̀rọ̀ tí wọ́n ń sọ lọ́wọ́ tàbí léraléra, èyí tí “ń sọ” pa mọ́.
- source_word: ἄγγελός
  choice: áńgẹ́lì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kó jẹ́ ẹ̀dá ọ̀run ju ońṣẹ́ ènìyàn lọ; “áńgẹ́lì” sì ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìtumọ̀ yẹn.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ oníhun Yorùbá yìí tú genitive náà lọ́nà àdánidá nínú gbólóhùn “áńgẹ́lì rẹ̀.”
theological_decisions:
- issue: Ìtumọ̀ “áńgẹ́lì rẹ̀”
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí “áńgẹ́lì rẹ̀,” láìfi àlàyé ìtumọ̀ kan kún un nínú ẹsẹ̀.
  alternative: Áńgẹ́lì olùṣọ́ rẹ̀; áńgẹ́lì aṣojú rẹ̀; ẹ̀mí rẹ̀.
  rationale: Gíríìkì sọ ní ṣókí pé “áńgẹ́lì rẹ̀” kò sì ṣàlàyé ohun tí àwọn olùsọ náà gbà gbọ́. Ìtumọ̀ tààrà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹ̀sí imperfect mọ́ nípasẹ̀ “ń tẹnumọ́” àti “ń sọ.”
