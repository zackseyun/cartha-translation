id: ACT.12.7
reference: Acts 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: yo
  text: Wò ó, angẹli Olúwa kan dúró lẹ́gbẹ̀ẹ́ rẹ̀,[a] ìmọ́lẹ̀ sì tàn nínú yàrá ẹ̀wọ̀n náà.[b] Ó lu Pétérù ní ẹ̀gbẹ́, ó jí i, ó sì wí pé, “Dìde kíákíá!” Àwọn ẹ̀wọ̀n rẹ̀ sì bọ́ kúrò ní ọwọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “farahàn lójijì.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ ìfarahàn ní òjijì pẹ̀lú dídúró nítòsí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nínú yàrá náà” tàbí “nínú iyẹ̀wù náà.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ gbogbogbò, ṣùgbọ́n “yàrá ẹ̀wọ̀n” bá àyíká ìtàn náà mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa agbára ọ̀rọ̀ amúnisí-ọkàn náà mọ́, ó sì bá ọ̀nà ìtàn Lúùkù mu ní èdè Yorùbá ọlọ́lá tí ó ṣeé lóye.
- source_word: ἄγγελος κυρίου
  choice: angẹli Olúwa kan
  rationale: Ó túmọ̀ ìsopọ̀ genitive náà ní ti ẹ̀dá, ó sì fi hàn pé angẹli náà jẹ́ ti Olúwa tàbí pé Olúwa ni ó rán an.
- source_word: ἐπέστη
  choice: dúró lẹ́gbẹ̀ẹ́ rẹ̀ lójijì
  rationale: Ó ṣàfihàn ìsúnmọ́ ẹni náà àti ìfarahàn rẹ̀ ní òjijì, méjèèjì tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí.
- source_word: φῶς ἔλαμψεν
  choice: ìmọ́lẹ̀ sì tàn
  rationale: Ìtumọ̀ tààrà, tí ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìmọ́lẹ̀ tí ń ràn.
- source_word: ἐν τῷ οἰκήματι
  choice: nínú yàrá ẹ̀wọ̀n náà
  rationale: οἴκημα jẹ́ ọ̀rọ̀ gbogbogbò fún yàrá tàbí ibùgbé; àyíká ẹ̀wọ̀n mú kí “yàrá ẹ̀wọ̀n” ṣe kedere láì dín ìtumọ̀ náà kù sí irú sẹ́ẹ̀lì kan pàtó.
- source_word: πατάξας τὴν πλευρὰν
  choice: Ó lu Pétérù ní ẹ̀gbẹ́
  rationale: “Lu” pa agbára πατάσσω mọ́ ju “fọwọ́ kàn” tàbí “ti” lọ, “ní ẹ̀gbẹ́” sì jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἤγειρεν αὐτὸν
  choice: ó jí i
  rationale: Nínú àyíká yìí, ἐγείρω ń tọ́ka sí jíjí Pétérù kúrò lójú oorun, kì í ṣe ìgbékalẹ̀ ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- source_word: Ἀνάστα ἐν τάχει
  choice: Dìde kíákíá
  rationale: Ó jẹ́ àṣẹ Yorùbá kedere, ó sì pa ìkánjú inú gbolohun Gíríìkì mọ́.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: Ẹ̀wọ̀n rẹ̀ sì jábọ́ kúrò ní ọwọ́ rẹ̀
  rationale: “Jábọ́” ṣàfihàn pé àwọn ìdè náà bọ́ sílẹ̀ lójijì; “ọwọ́” sì tẹ̀lé χείρ láì yí i padà sí “ọ̀wọ́-ọwọ́” tàbí “ọwọ́-ìkáwọ́” tí ó túmọ̀ sí pàtó jù.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ἄγγελος κυρίου
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí a mọ̀ sí rere fún κύριος nínú lílo Májẹ̀mú Tuntun; kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìgbésẹ̀ ìtàn àti ìkánjú ẹsẹ náà mọ́.
