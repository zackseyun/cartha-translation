  to: Wò ó, angẹli Olúwa kan dúró lẹ́gbẹ̀ẹ́ rẹ̀,[a] ìmọ́lẹ̀ sì tàn nínú yàrá ẹ̀wọ̀n náà.[b] Ó lu Pétérù ní ẹ̀gbẹ́, ó jí i, ó sì wí pé, “Dìde kíákíá!” Àwọn ẹ̀wọ̀n rẹ̀ sì bọ́ kúrò ní ọwọ́ rẹ̀.
