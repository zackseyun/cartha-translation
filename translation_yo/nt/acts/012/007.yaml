review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main actions accurately, but it makes the possible suddenness of ἐπέστη explicit in the main text through “lójijì.” The Greek can carry that nuance, yet the English audit appropriately retains it as an alternative; the Yoruba main text should likewise preserve the less interpretive sense of standing near. The plural αἱ ἁλύσεις should also be represented explicitly.
  naturalness: “Wò ó” is a more natural, concise Yoruba narrative equivalent for ἰδού than “Sì wò ó.” The revised chain clause is also clearer with an explicit plural subject.
  terminology: “angẹli Olúwa,” “ìmọ́lẹ̀,” “yàrá ẹ̀wọ̀n,” “lu ... ní ẹ̀gbẹ́,” and “Dìde kíákíá” are appropriate Standard Yoruba renderings in this context. Footnote b is adjusted to begin naturally with “Tàbí,” rather than “Ní ṣókí.”
  issues:
  - severity: medium
    issue: The main text adds “lójijì” to ἐπέστη.
    rationale: Sudden appearance is a possible lexical nuance, but it is not necessary in the Greek and is treated as an alternative in the audit trail. Keeping it in the footnote avoids over-specifying the main translation.
  - severity: low
    issue: “Ẹ̀wọ̀n rẹ̀” is grammatically/formally singular for plural αἱ ἁλύσεις.
    rationale: The Greek explicitly refers to Peter’s chains in the plural; “Àwọn ẹ̀wọ̀n rẹ̀” preserves this detail.
  - severity: low
    issue: Footnote b opens with “Ní ṣókí,” which does not idiomatically introduce lexical alternatives.
    rationale: “Tàbí” directly and naturally introduces the alternatives.
  revised_text: Wò ó, angẹli Olúwa kan dúró lẹ́gbẹ̀ẹ́ rẹ̀,[a] ìmọ́lẹ̀ sì tàn nínú yàrá ẹ̀wọ̀n náà.[b] Ó lu Pétérù ní ẹ̀gbẹ́, ó jí i, ó sì wí pé, “Dìde kíákíá!” Àwọn ẹ̀wọ̀n rẹ̀ sì bọ́ kúrò ní ọwọ́ rẹ̀.
