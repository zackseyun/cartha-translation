  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní ọ̀pọ̀ ibi: Pétérù ń sùn láàárín ọmọ ogun méjì, ó wà ní ìdè pẹ̀lú ẹ̀wọ̀n méjì, àwọn ẹ̀ṣọ́ sì wà níwájú ilẹ̀kùn. Ṣùgbọ́n ‘fẹ́ mú un jáde’ sábà máa ń túmọ̀ sí pé Hẹ́rọ́dù fẹ́/ní èrò láti mú un jáde; kò sọ ìsúnmọ́ ìṣe tí ἤμελλεν (‘was about to’) ní kedere. ‘Fẹ́rẹ̀ẹ́ mú un jáde’ dá ìsúnmọ́ náà padà láì sọ ohun tí ìmújáde náà jẹ́ pàtó ju orísun lọ.'
  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé tó mọ́, ó sì ní àmì ohùn tó yẹ. ‘Ilé ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ gbooro tó dára ju ‘ọgbà ẹ̀wọ̀n’ lọ níbí, nítorí φυλακή ń tọ́ka sí ibi ìhámọ́/prison, kì í ṣe pàtó sí àgbàlá rẹ̀.
  terminology: ‘Hẹ́rọ́dù,’ ‘Pétérù,’ ‘àwọn ọmọ ogun,’ ‘ẹ̀wọ̀n,’ àti ‘àwọn ẹ̀ṣọ́’ yẹ. A tún gbe àmì akọ́sọ [b] sí ibìkan tó bá àlàyé rẹ̀ mu—lẹ́yìn gbolóhùn nípa ṣíṣọ́ ilé ẹ̀wọ̀n—dípò lẹ́yìn ‘ẹ̀wọ̀n méjì,’ níbi tí ó ti lè dà bíi pé ó ń ṣàlàyé àwọn ẹ̀wọ̀n.
