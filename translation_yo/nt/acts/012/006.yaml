language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: yo
  text: Nígbà tí Hẹ́rọ́dù fẹ́rẹ̀ẹ́ mú un jáde[a], ní òru yẹn gan-an ni Pétérù ń sùn láàárín àwọn ọmọ ogun méjì, a sì fi ẹ̀wọ̀n méjì dè é; àwọn ẹ̀ṣọ́ tí ó wà níwájú ilẹ̀kùn sì ń ṣọ́ ilé ẹ̀wọ̀n náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú un wá síwájú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídarí ẹnì kan jáde fún ìfarahàn ní gbangba tàbí fún ìgbẹ́jọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ń dáàbò bo ilé ẹ̀wọ̀n náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: fẹ́
  rationale: Nínú àyíká yìí, ó fi ìṣe tí ó sún mọ́lé hàn; ‘fẹ́’ nínú gbólóhùn ‘nígbà tí ... fẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó fẹ́rẹ̀ẹ́ ṣẹlẹ̀.
- source_word: προαγαγεῖν αὐτόν
  choice: mú un jáde
  rationale: Ó pa ìtumọ̀ yíyọ Pétérù kúrò ní àhámọ́ mọ́, láì pinnu bóyá fún ìgbẹ́jọ́ tàbí ìfarahàn ní gbangba ni.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: ní òru yẹn gan-an
  rationale: ‘Gan-an’ mú ìtẹnumọ́ tí ἐκείνῃ ní nínú ìtàn náà jáde ní Yorùbá àdánidá.
- source_word: κοιμώμενος
  choice: ń sùn
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí participle náà ṣe rí.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: láàárín àwọn ọmọ ogun méjì
  rationale: Èyí jẹ́ ọ̀rọ̀ àdánidá, ó sì tọ́ka sí ipò rẹ̀ láàárín ènìyàn méjì.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: a sì fi ẹ̀wọ̀n méjì dè é
  rationale: Ó sọ ipò ìdè àti ohun èlò ìdè náà ní kedere, ní ìlànà Yorùbá tí ó rọrùn.
- source_word: φύλακές
  choice: àwọn ẹ̀ṣọ́
  rationale: Ọ̀rọ̀ yìí wọ́pọ̀, ó sì bá àwọn olùṣọ́ ọgbà ẹ̀wọ̀n mu.
- source_word: πρὸ τῆς θύρας
  choice: tí ó wà níwájú ilẹ̀kùn
  rationale: Ó pa ìtumọ̀ àyè ‘ní iwájú’ mọ́ ju fífi hàn pé ẹnu ọ̀nà lásán ni wọ́n wà.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: ń ṣọ́ ọgbà ẹ̀wọ̀n náà
  rationale: Ó jẹ́ Yorùbá tó ṣe kedere fún ṣíṣọ́ ibi àhámọ́; ‘ọgbà ẹ̀wọ̀n’ túmọ̀ φυλακή sí ibi tí a ti ń fi ènìyàn pamọ́ sí.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. A mú ìtẹnumọ́ ìtàn náà jáde ní ‘òru yẹn gan-an,’ a sì yàgò fún ọ̀rọ̀ ìbẹ̀rẹ̀ tí kò ní ohun tí ó bá a mu nínú Gíríìkì. Àmì àlàyé [b] inú English POB kò bá àlàyé rẹ̀ mu, nítorí náà a kò fi í sínú ọ̀rọ̀ Yorùbá; àlàyé yẹn jẹ́ àṣàyàn ìtumọ̀ fún ἐτήρουν τὴν φυλακήν, ṣùgbọ́n àkọ́kọ́ àti àṣàyàn rẹ̀ kò yàtọ̀ ní ìtumọ̀ Yorùbá tó yẹ.
