    rationale: φυλακή nínú gbolóhùn yìí ni ọgbà/ilé ìhámọ́ lápapọ̀; ‘ilé ẹ̀wọ̀n’ jẹ́ ìtumọ̀ tó gbooro, tó sì dájú.
  - severity: low
