translation_notes:
  register: A lo Yorùbá tí ó bójú mu, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A yàgò fún ọ̀rọ̀ ààfin àtijọ́ tí ọ̀pọ̀ ènìyàn lè má lóye, a sì ṣàlàyé ojúṣe Bílásítù nínú àlàyé ìsàlẹ̀.
