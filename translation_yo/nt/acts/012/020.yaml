id: ACT.12.20
reference: Acts 12:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: yo
  text: Ó bínú gidigidi sí àwọn ará Tírè àti Sídónì.[a] Ṣùgbọ́n wọ́n wá sọ́dọ̀ rẹ̀ ní ọkàn kan. Lẹ́yìn tí wọ́n ti rọ Bílásítù, ẹni tí ó ń bójú tó iyàrá ìbusùn ọba,[b] wọ́n ń tọrọ àlàáfíà, nítorí pé ilẹ̀ wọn ń gba ìpèsè oúnjẹ láti ilẹ̀ ọba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó bá àwọn ará Tírè àti Sídónì ní ọ̀tá.” Ọ̀rọ̀ Gíríìkì θυμομαχῶν lè sọ ìbínú líle tàbí ìṣọ̀tá gbígbóná.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹni tí ó wà lórí iyàrá ìbusùn ọba”; ó ṣeé ṣe kí ó jẹ́ òṣìṣẹ́ ààfin kan tí ó ní àyè sí agbègbè àdáni ọba.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nítorí pé agbègbè wọn ń gba ìpèsè oúnjẹ láti ilẹ̀ ọba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: bínú gidigidi sí
  rationale: Ọ̀rọ̀ náà ń sọ ìbínú líle tàbí ìṣọ̀tá gbígbóná. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa líle ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: àwọn ará Tírè àti Sídónì
  rationale: Àwọn ọ̀rọ̀ náà ń tọ́ka sí àwọn olùgbé Tírè àti Sídónì; lílo ‘àwọn ará’ jẹ́ kedere, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ὁμοθυμαδόν
  choice: gbogbo wọn fi ìmọ̀ kan
  rationale: Èyí fi hàn pé wọ́n ní ète kan náà, kì í ṣe pé wọ́n kàn péjọ pọ̀ ní ibi kan.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: wá sọ́dọ̀ rẹ̀
  rationale: Ìtumọ̀ náà ni pé wọ́n tọ̀ ọ́ wá tàbí wọ́n farahàn níwájú rẹ̀; yíyan yìí jẹ́ ti Yorùbá òde òní.
- source_word: πείσαντες
  choice: lẹ́yìn tí wọ́n ti rọ
  rationale: Aorist participle náà fi hàn pé rírọ Bílásítù ṣẹlẹ̀ ṣáájú bí wọ́n ṣe bẹ̀rẹ̀ sí í tọrọ àlàáfíà.
- source_word: Βλάστον
  choice: Bílásítù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ètò ìró àti àkọtọ̀ Yorùbá.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: ẹni tó ń ṣe olórí iyàrá ọba
  rationale: Gbólóhùn Gíríìkì túmọ̀ ní tààrà sí ẹni tí ó wà lórí iyàrá ìbusùn ọba, ìyẹn òṣìṣẹ́ ààfin kan tó ní ojúṣe ní agbègbè àdáni ọba.
- source_word: ᾐτοῦντο εἰρήνην
  choice: wọ́n ń tọrọ àlàáfíà
  rationale: Fáwẹ́lì aláìpé náà lè fi ìtẹ̀síwájú tàbí ìsapá nínú ẹ̀bẹ̀ hàn; ‘ń tọrọ’ pa apá yìí mọ́, ‘àlàáfíà’ sì bá ọ̀rọ̀ ìbágbépọ̀ láàárín àwọn ìjọba mu.
- source_word: διὰ τὸ τρέφεσθαι
  choice: nítorí pé ... ń rí oúnjẹ
  rationale: Articular infinitive pẹ̀lú διά ń sọ ìdí; passive τρέφεσθαι níhìn-ín ń tọ́ka sí gbígba oúnjẹ tàbí ìpèsè oúnjẹ.
- source_word: αὐτῶν τὴν χώραν
  choice: ilẹ̀ wọn
  rationale: χώρα lè túmọ̀ sí ilẹ̀, agbègbè, tàbí orílẹ̀-èdè. ‘Ilẹ̀ wọn’ jẹ́ kedere láì fi ìtumọ̀ òṣèlú tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: láti ilẹ̀ ọba
  rationale: Adjective βασιλικῆς dúró gẹ́gẹ́ bí nọ́ọ̀nù, ó sì ṣeé ṣe kí ó túmọ̀ sí ilẹ̀ tàbí agbègbè tí ó jẹ́ ti ọba.
