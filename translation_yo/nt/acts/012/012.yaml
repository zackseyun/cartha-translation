id: ACT.12.12
reference: Acts 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: yo
  text: Nígbà tí ó sì wá lóye, ó lọ sí ilé Màríà, ìyá Jòhánù tí a ń pè ní Máàkù,[a] níbi tí ọ̀pọ̀ ènìyàn ti péjọ tí wọ́n sì ń gbàdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “Jòhánù tí a tún ń pè ní Máàkù.” Ọ̀rọ̀ Gíríìkì fi Máàkù hàn gẹ́gẹ́ bí orúkọ mìíràn fún Jòhánù, ṣùgbọ́n kò pọn dandan kí a fi ọ̀rọ̀ “tún” kún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Nígbà tí ó mọ ohun tí ó ṣẹlẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí bí Pétérù ṣe wá lóye ipò rẹ̀ ní kíkún lẹ́yìn tí áńgẹ́lì fi í sílẹ̀. Fifi “ohun tí ó ṣẹlẹ̀” kún un mú ohun tí àyíká ẹsẹ̀ ṣáájú ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: τε
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn tí kò lágbára púpọ̀, ó sì bá ipa τέ mu láìfi ìtumọ̀ àfikún sí i.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ó lọ sí ilé
  rationale: Gbólóhùn náà fi ìrìn sí ibi kan hàn; “lọ sí ilé” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá láti ojú ìwòye ìtàn náà.
- source_word: τῆς Μαρίας
  choice: Màríà
  rationale: A kọ orúkọ Μαρία ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: ìyá Jòhánù
  rationale: Ó pa ìbátan tí ọ̀rọ̀ Gíríìkì sọ mọ́, ó sì fi hàn kedere Màríà wo ni a ń sọ̀rọ̀ rẹ̀.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: ẹni tí a ń pè ní Máàkù
  rationale: Ìtumọ̀ yìí fi orúkọ àfikún tí wọ́n fi ń dá Jòhánù mọ̀ hàn, láìfi ọ̀rọ̀ “pẹ̀lú” kún Gíríìkì ní dandan.
- source_word: οὗ
  choice: níbi tí
  rationale: Ó tọ́ka sí ilé Màríà gẹ́gẹ́ bí ibi tí àwọn ènìyàn ti péjọ.
- source_word: ἱκανοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ní ọ̀pọ̀ nǹkan, ἱκανοί túmọ̀ sí iye ènìyàn tí ó pọ̀ tàbí tí ó tóbi; “ọ̀pọ̀ ènìyàn” jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: συνηθροισμένοι
  choice: ti péjọ
  rationale: Ó fi ipò tí ó jẹ́ àbájáde pé àwọn ènìyàn ti kóra jọ hàn, gẹ́gẹ́ bí àkójọpọ̀ ἦσαν àti perfect participle ṣe ń fi hàn.
- source_word: καὶ προσευχόμενοι
  choice: tí wọ́n sì ń gbàdúrà
  rationale: “Ń” fi iṣẹ́ tí ń lọ lọ́wọ́ hàn, bí participle náà ṣe ṣàpèjúwe ohun tí wọ́n ń ṣe nígbà tí wọ́n péjọ.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀n, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa ìṣàn ìtàn àti iṣẹ́ àdúrà tí ń lọ lọ́wọ́ mọ́.
