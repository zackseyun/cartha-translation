id: ACT.12.9
reference: Acts 12:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: yo
  text: Ó sì jáde, ó sì ń tọ̀ ọ́ lẹ́yìn; kò sì mọ̀ pé ohun tí ń ṣẹlẹ̀ nípasẹ̀ áńgẹ́lì náà jẹ́ ohun gidi, ṣùgbọ́n ó rò pé òun ń rí ìran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Ó sì jáde
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe àkọ́kọ́; fífi í ṣe ọ̀rọ̀-ìṣe aláìlẹ́gbẹ̀ pẹ̀lú àsopọ̀ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ mọ́.
- source_word: ἠκολούθει
  choice: ó sì ń tọ̀ ọ́ lẹ́yìn
  rationale: Àmì àkókò imperfect fi ìṣe tó ń lọ hàn. “Ń tọ̀ ọ́ lẹ́yìn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé Peteru ń tẹ̀lé áńgẹ́lì náà.
- source_word: οὐκ ᾔδει
  choice: kò sì mọ̀
  rationale: Ó túmọ̀ sí àìmọ̀ tàbí àìfiyèsí; “kò mọ̀” jẹ́ gígùn-kúrú, ó sì ṣe kedere.
- source_word: ἀληθές
  choice: jẹ́ òtítọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń fi ohun tó ṣẹlẹ̀ ní ti gidi wé ìran. “Jẹ́ òtítọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí kì í ṣe àlá tàbí ìran lásán.
- source_word: τὸ γινόμενον
  choice: ohun tí ń ṣẹlẹ̀
  rationale: Articular present participle náà tọ́ka sí ìṣẹ̀lẹ̀ tó ń lọ lọ́wọ́; “ohun tí ń ṣẹlẹ̀” pa ìtumọ̀ yẹn mọ́.
- source_word: διὰ τοῦ ἀγγέλου
  choice: nípasẹ̀ áńgẹ́lì náà
  rationale: διά pẹ̀lú genitive lè fi aṣojú tàbí ọ̀nà tí ìṣe gbà ṣẹlẹ̀ hàn. “Nípasẹ̀” pa ìtumọ̀ alárinà mọ́ láìsọ pé áńgẹ́lì náà ló ní agbára olómìnira.
- source_word: ἐδόκει
  choice: ó rò pé
  rationale: Nínú àyíká yìí, ó ń sọ ohun tí Peteru gbà pé òun ń ní ìrírí rẹ̀; “ó rò pé” jẹ́ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: ὅραμα
  choice: ìran
  rationale: “Ìran” ni ọ̀rọ̀ Yorùbá tó yẹ fún ohun àràmàǹdà tàbí ìfihàn tí ènìyàn rí.
- source_word: βλέπειν
  choice: òun ń rí
  rationale: Infinitive náà sin ἐδόκει; “òun ń rí” fi hàn pé èyí ni ohun tí Peteru fúnra rẹ̀ rò pé ó ń ṣẹlẹ̀ sí òun.
theological_decisions:
- issue: Irú ipa tí áńgẹ́lì náà kó nínú ìṣẹ̀lẹ̀
  choice: nípasẹ̀ áńgẹ́lì náà
  alternative: láti ọwọ́ áńgẹ́lì náà / tí áńgẹ́lì náà ṣe
  rationale: “Nípasẹ̀” pa agbára διά pẹ̀lú genitive mọ́ gẹ́gẹ́ bí aṣojú tàbí ọ̀nà àlárinà, láìyanju ju ohun tí Gíríìkì sọ lọ nípa orísun tàbí òmìnira agbára áńgẹ́lì.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún òǹkàwé gbogbogbò. Àwọn àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá. “Áńgẹ́lì” ni a yàn fún ἄγγελος, “ìran” sì ni a yàn fún ὅραμα. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan nítorí “nípasẹ̀” ti pa ìtumọ̀ mediated agency mọ́ nínú ọ̀rọ̀ pàtàkì.
