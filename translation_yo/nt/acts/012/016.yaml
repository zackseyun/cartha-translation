  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: yo
  text: Ṣùgbọ́n Peteru ń tẹ̀ síwájú ní kíkàn ilẹ̀kùn[a]. Nígbà tí wọ́n sì ṣí i[b], wọ́n rí i, ẹnu sì yà wọ́n gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń bá a lọ ní kíkàn ilẹ̀kùn,” tàbí “kò jáwọ́ nínú kíkàn ilẹ̀kùn.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ní ṣíṣí, wọ́n rí i, ẹnu sì yà wọ́n gidigidi.” Gíríìkì náà kò sọ ohun tí wọ́n ṣí ní pàtó; “ilẹ̀kùn” wá láti inú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: ń bá a lọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí fi hàn pé ìṣe náà ń bá a lọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá fún ìṣe tí kò dáwọ́ dúró.
- source_word: κρούων
  choice: ní kíkànkùn sílẹ̀
  rationale: Nínú àyíká yìí, κρούω túmọ̀ sí kíkànkùn ilẹ̀kùn; fífi “sílẹ̀” kún un fi ìtẹ̀síwájú ìṣe náà hàn lọ́nà àdánidá.
- source_word: ἀνοίξαντες
  choice: nígbà tí wọ́n ṣí ilẹ̀kùn
  rationale: A tú participle aorist náà sí gbólóhùn àkókò fún Yorùbá tó rọrùn. “Ilẹ̀kùn” jẹ́ ohun tí a fi kún un láti inú àyíká ọ̀rọ̀.
- source_word: εἶδαν αὐτόν
  choice: wọ́n rí i
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá ti gbólóhùn náà nínú ìtàn.
- source_word: ἐξέστησαν
  choice: ẹnu sì yà wọ́n gidigidi
  rationale: Ọ̀nà Yorùbá àdánidá yìí sọ ìyàlẹ́nu líle tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí, láìfi àlàyé míì kún un.
- source_word: δὲ
  choice: ṣùgbọ́n / sì
  rationale: δὲ àkọ́kọ́ fi ìyàtọ̀ sí ohun tó ṣáájú hàn, nítorí náà “ṣùgbọ́n” bá a mu; èkejì ń so ìṣẹ̀lẹ̀ náà pọ̀ mọ́ èyí tó tẹ̀ lé e, a sì lo “sì.”
- source_word: Πέτρος
  choice: Peteru
  rationale: A lo ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú Yorùbá.
