translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè ìtàn àdánidá ni a lò. Gbólóhùn “ń bá a lọ ní kíkànkùn sílẹ̀” pa agbára ìṣe tó ń tẹ̀ síwájú mọ́; “ẹnu yà wọ́n gidigidi” sì jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere fún ìyàlẹ́nu líle.
