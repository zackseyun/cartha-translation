id: ACT.12.5
reference: Acts 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: yo
  text: Nítorí náà, wọ́n ń pa Peteru mọ́ nínú ọgbà ẹ̀wọ̀n, ṣùgbọ́n ìjọ ń fi taratara[a] gbàdúrà sí Ọlọ́run fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìtara láìdábọ̀”; ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ bí àdúrà náà ṣe kankíkan tàbí bí wọ́n ṣe ń tẹ̀ síwájú nínú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: wọ́n ń pa ... mọ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé tí a ṣe sí ẹni náà fi hàn pé pípa Peteru mọ́ sílẹ̀ ń bá a lọ; ìtumọ̀ yìí kò fi ọ̀nà tí wọ́n gbà ṣọ́ ọ kún ohun tí Gíríìkì sọ.
- source_word: φυλακῇ
  choice: nínú ọgbà ẹ̀wọ̀n
  rationale: Ó tọ́ka sí ibi tí a fi Peteru sẹ́wọ̀n; ‘ọgbà ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìtàn ọlọ́lá.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: ìjọ ń ... gbàdúrà
  rationale: Ìṣètò ἦν pẹ̀lú ọ̀rọ̀-ìṣe aláìparí ń fi ìṣe tí ń bá a lọ hàn; ‘ń gbàdúrà’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἐκτενῶς
  choice: fi taratara
  rationale: Ó lè tẹnumọ́ bí àdúrà náà ṣe le koko tàbí bí wọ́n ṣe ń tẹ̀ síwájú nínú rẹ̀; ‘fi taratara’ jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: ìjọ
  rationale: Ní àyíká yìí, ἐκκλησία ni àwùjọ àwọn onígbàgbọ́; lílo ‘ìjọ’ kò fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan pàtó kún un.
- source_word: πρὸς τὸν θεὸν
  choice: sí Ọlọ́run
  rationale: πρός fi ẹni tí àdúrà náà darí sí hàn; ‘sí Ọlọ́run’ ni ọ̀nà Yorùbá tó wọ́pọ̀.
- source_word: περὶ αὐτοῦ
  choice: fún un
  rationale: Nínú àyíká àdúrà àtọrọ fún ẹlòmíràn, ó túmọ̀ sí pé wọ́n ń gbàdúrà nítorí Peteru tàbí ní ipò rẹ̀; ‘fún un’ jẹ́ kedere, ó sì ṣe àdánidá.
- source_word: μὲν οὖν ... δὲ
  choice: Nítorí náà ... ṣùgbọ́n ...
  rationale: Àwọn patíkù náà ń tẹ ìtàn síwájú, wọ́n sì fi ìyàtọ̀ hàn láàárín ìhámọ́ Peteru àti àdúrà ìjọ.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία
  choice: ìjọ
  alternative: àpéjọ àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwùjọ Kristẹni tí ń gbàdúrà fún Peteru. ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa, kò sì béèrè pé kí a ka ètò ilé-ẹ̀sìn ìgbà tó tẹ̀ lé e sínú ẹsẹ yìí.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘wọ́n ń pa ... mọ́’ láti gbé ìṣe tí ń bá a lọ jáde, àti ‘ìjọ ń ... gbàdúrà’ dípò ìṣètò palolo tí kò ní jẹ́ àdánidá ní Yorùbá.
