source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: yo
  text: Nígbà tí ó sì rí i pé ó wù àwọn Júù[a], ó tẹ̀ síwájú láti mú Peteru náà. (Àwọn ọjọ́ Àkàrà Aláìwú[b] sì ni ìgbà náà.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “àwọn ará Jùdíà” tàbí, bí a bá mú ìtumọ̀ náà dín kù nítorí àyíká, “àwọn aṣáájú Júù.” Ọ̀rọ̀ Gíríìkì lè ní àwọn ìtumọ̀ wọ̀nyí ní àwọn àyíká kan, ṣùgbọ́n níbí, ohun tí ẹsẹ náà sọ ní tààrà ni “àwọn Júù.”
    reason: lexical_alternative
  - marker: b
    text: Èyí ni àkókò ayẹyẹ tó tẹ̀ lé Ìrékọjá, nígbà tí wọ́n máa ń jẹ àkàrà tí kò ní ìwú.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nígbà tí ó sì rí i
  rationale: A tú participle aorist náà gẹ́gẹ́ bí gbólóhùn àkókò, nítorí ó fi ohun tí Herodu ṣàkíyèsí ṣáájú ìgbésẹ̀ rẹ̀ tó tẹ̀ lé e hàn; “sì” tún pa ipa δέ mọ́.
- source_word: ἀρεστόν ἐστιν
  choice: èyí dùn mọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun tí ó tẹ́ni lọ́rùn tàbí tí ó jẹ́ ìtẹ́wọ́gbà; “dùn mọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Gíríìkì sọ “àwọn Júù” ní tààrà; bí ó tilẹ̀ jẹ́ pé àyíká lè tọ́ka pàápàá sí àwọn Júù ní Jùdíà tàbí àwọn aṣáájú wọn, ẹsẹ náà kò fi ìtumọ̀ náà mọ́ sí wọn nìkan.
- source_word: προσέθετο
  choice: ó tẹ̀ síwájú
  rationale: Pẹ̀lú infinitive, προστίθημι lè túmọ̀ sí pé ẹnì kan tún tẹ̀ síwájú láti ṣe ohun mìíràn; yíyan yìí yẹra fún títú u ní líle gẹ́gẹ́ bí “ó fi kún un.”
- source_word: συλλαβεῖν
  choice: láti mú
  rationale: Nínú àyíká ìjọba àti ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí mímú ẹni kan sí àhámọ́; “mú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: καὶ Πέτρον
  choice: Peteru pẹ̀lú
  rationale: καί fi Peteru kún Jákọ́bù gẹ́gẹ́ bí ẹni mìíràn tí Herodu fẹ́ mú; “pẹ̀lú” pa ipa àfikún náà mọ́.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Àwọn ọjọ́ Àkàrà Aláìwú sì ni ìgbà náà
  rationale: A pa ọ̀rọ̀ ayẹyẹ Júù náà mọ́ ní tòsí Gíríìkì, dípò fífi “Ìrékọjá” rọ́pò rẹ̀; gbólóhùn náà sì ṣiṣẹ́ gẹ́gẹ́ bí àlàyé àkókò.
theological_decisions:
- issue: Bí a ṣe tú Ἰουδαίοις nínú Ìṣe àwọn Aposteli
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn aṣáájú Júù
  rationale: A tẹ̀ lé ìtumọ̀ ọ̀rọ̀ náà ní tààrà, nítorí ẹsẹ náà kò sọ kedere pé àwọn aṣáájú nìkan ni tàbí pé ìtumọ̀ rẹ̀ jẹ́ ti agbègbè Jùdíà nìkan. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn láìfi wọ́n sínú ọ̀rọ̀ ẹsẹ.
- issue: Bí a ṣe tú τῶν ἀζύμων
  choice: Àkàrà Aláìwú
  alternative: Ìrékọjá
  rationale: Gíríìkì dárúkọ àwọn ọjọ́ Àkàrà Aláìwú ní pàtó, kì í ṣe Ìrékọjá ní tààrà. A pa ìyàtọ̀ tó wà láàárín àwọn àkókò ayẹyẹ tó jọra wọ̀nyí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Peteru” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ Bíbélì tó wọ́pọ̀; àkíyèsí tó wà nínú àkámọ́ ni a pa mọ́.
