  text: But the word of God continued to grow and multiply[a].
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀rọ̀ Ọlọ́run ń dàgbà, ó sì ń pọ̀ sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìhìn Ọlọ́run ń dàgbà, ó sì ń pọ̀ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀ Ọlọ́run” pa gbólóhùn tí Lúùkù sábà máa ń lò mọ́, ó sì lè túmọ̀ sí ọ̀rọ̀ tàbí ìhìn tí a ń kéde láti ọ̀dọ̀ Ọlọ́run; àlàyé ìsàlẹ̀ fi yíyan mìíràn hàn.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Àpapọ̀ náà, “ọ̀rọ̀ Ọlọ́run,” fi hàn pé ọ̀rọ̀ náà jẹ́ ti Ọlọ́run tàbí pé ó ti ọ̀dọ̀ rẹ̀ wá.
- source_word: ηὔξανεν
  choice: ń bá a lọ láti máa dàgbà
  rationale: Ìṣe aláìparí Gíríìkì fi ìlọsíwájú tó ń tẹ̀ síwájú hàn; yíyan yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἐπληθύνετο
  choice: ń pọ̀ sí i
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín dídàgbà àti pípọ̀ sí i, ó sì tọ́ka sí bí ọ̀rọ̀ Ọlọ́run ṣe ń tàn ká àti bí ipa rẹ̀ ṣe ń gbòòrò.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora ìtàn hàn láàárín ikú Hẹ́rọ́dù nínú ẹsẹ tó ṣáájú àti ìlọsíwájú ọ̀rọ̀ Ọlọ́run.
theological_decisions:
- issue: Bóyá kí λόγος τοῦ θεοῦ jẹ́ “ọ̀rọ̀ Ọlọ́run” tàbí “ìhìn Ọlọ́run”
  choice: ọ̀rọ̀ Ọlọ́run
  alternative: ìhìn Ọlọ́run
  rationale: “Ọ̀rọ̀ Ọlọ́run” pa ọ̀nà tí Lúùkù ń gbà sọ ọ́ léraléra mọ́, kò sì fi dandan dín λόγος kù sí kìkì àkóónú ìhìn; “ìhìn Ọlọ́run” ṣì jẹ́ ìtumọ̀ tó ṣeé ṣe ní àyíká yìí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. Ìtumọ̀ náà pa àwòrán ìlọsíwájú méjèèjì nínú àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́.
