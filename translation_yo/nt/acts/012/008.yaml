revisions:
- from: Angẹli náà sì sọ fún un pé, “Di àmùrè rẹ mọ́ra[a], kí o sì wọ bàtà àtẹ́lẹsẹ̀ rẹ.” Ó sì ṣe bẹ́ẹ̀. Ó sì wí fún un pé[b], “Fi aṣọ ìlekè rẹ bo ara rẹ[c], kí o sì máa tọ̀ mí lẹ́yìn.”
  to: Áńgẹ́lì náà sì sọ fún un pé, “Di àmùrè rẹ mọ́ra[a], kí o sì wọ bàtà rẹ.” Ó sì ṣe bẹ́ẹ̀. Ó sì wí fún un pé[b], “Wọ aṣọ òde rẹ[c], kí o sì tẹ̀lé mi.”
  rationale: Àtúnṣe náà ṣe pàtàkì láti ṣàtúnṣe “aṣọ ìlekè,” èyí tí kò bá ἱμάτιον mu, sí “aṣọ òde.” A tún mú ọ̀rọ̀ àṣẹ ìkẹyìn wá sí ìlò Yorùbá tó rọrùn (“tẹ̀lé mi”) nígbà tí a pa ìyàtọ̀ historical present ti λέγει mọ́ nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:49Z'
