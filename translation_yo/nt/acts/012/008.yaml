  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò. Ṣùgbọ́n “aṣọ ìlekè” túmọ̀ sí aṣọ tàbí ohun ọ̀ṣọ́ ilẹ̀kẹ̀, kì í ṣe ἱμάτιον, tí ó jẹ́ aṣọ òde/cloak. A ti rọ́pò ó pẹ̀lú “aṣọ òde.”
  naturalness: “Wọ aṣọ òde rẹ” jẹ́ ọ̀nà Yorùbá òde òní tí ó rọrùn, tí ó sì bá àṣẹ Περιβαλοῦ mu. “Tẹ̀lé mi” jẹ́ ìtumọ̀ àdánidá fún ἀκολούθει μοι; “bàtà rẹ” sì lè tọ́ka sí sandals ní àyíká yìí láìfi ìtumọ̀ mìíràn kún un.
  terminology: A ti pa “Áńgẹ́lì,” “àmùrè,” àti “aṣọ òde” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó yẹ fún angel, belt, àti outer garment. “Aṣọ ìlekè” kò yẹ níhìn-ín nítorí pé ó yí irú aṣọ náà padà.
