source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: yo
  text: Áńgẹ́lì náà sì sọ fún un pé, “Di àmùrè rẹ mọ́ra[a], kí o sì wọ bàtà rẹ.” Ó sì ṣe bẹ́ẹ̀. Ó sì wí fún un pé[b], “Wọ aṣọ òde rẹ[c], kí o sì tẹ̀lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Di ara rẹ ní àmùrè.” Àṣẹ Gíríìkì náà ń tọ́ka sí dídì àmùrè mọ́ra láti múra sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ó ń wí”; ọ̀rọ̀ ìṣe ìsinsìnyí ni a lò láti mú kí ìtàn náà hàn gbangba bí ohun tó ń ṣẹlẹ̀ lójú ẹni.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Fi aṣọ òde rẹ yí ara rẹ ká.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: Angẹli
  rationale: Nínú àyíká ìtàn yìí, ẹni ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe òjíṣẹ́ ènìyàn lásán.
- source_word: Ζῶσαι
  choice: Di àmùrè rẹ mọ́ra
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí dídì àmùrè mọ́ ara ẹni láti múra sílẹ̀; gbólóhùn yìí ṣe kedere ní Yorùbá òde òní.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: wọ bàtà àtẹ́lẹsẹ̀ rẹ
  rationale: Èyí sọ ìṣe wíwọ bàtà tí kò bo ẹsẹ̀ mọ́lẹ̀ ní ọ̀nà àdánidá.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Ó sì ṣe bẹ́ẹ̀
  rationale: Ó ṣókí, ó sì fi ìgbọ́ràn Pétérù sí àwọn àṣẹ tó ṣáájú hàn.
- source_word: λέγει
  choice: Ó sì wí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí historical present, ìtàn Yorùbá máa ń lo ọ̀nà àtẹ̀yìnwá ní àdánidá; àlàyé ìsàlẹ̀ pa ìyàtọ̀ náà mọ́.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Fi aṣọ ìlekè rẹ bo ara rẹ
  rationale: ἱμάτιον jẹ́ aṣọ òde, Περιβαλοῦ sì ní èrò fífi aṣọ náà yí tàbí bo ara; yíyan yìí pa ìṣe àti irú aṣọ náà mọ́.
- source_word: ἀκολούθει μοι
  choice: máa tọ̀ mí lẹ́yìn
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún títẹ̀lé ẹni, ó sì pa ìtumọ̀ gangan ti ἀκολουθέω mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Bàtà àtẹ́lẹsẹ̀” àti “aṣọ ìlekè” ni a lò fún sandal àti outer cloak, nígbà tí àwọn àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
