  - severity: low
    issue: “Màa tọ̀ mí lẹ́yìn” kéré sí ìtumọ̀ àdánidá ju “tẹ̀lé mi” lọ nínú àṣẹ yìí.
    rationale: “Tẹ̀lé mi” jẹ́ ìlò Yorùbá tó wọ́pọ̀, ó sì pa ìtumọ̀ ἀκολούθει mọ́.
