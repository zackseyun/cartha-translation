source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: yo
  text: Ní nǹkan bí ìgbà yẹn[a], ọba Hẹ́rọ́dù na ọwọ́ rẹ̀ sí àwọn kan nínú ìjọ[b], láti ṣe wọ́n ní ibi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ní ìgbà yẹn” tàbí “Ní àyíká ìgbà yẹn.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “na ọwọ́ rẹ̀ sí.” Níhìn-ín, gbólóhùn náà túmọ̀ sí gbígbé ìgbésẹ̀ ọ̀tá sí àwọn kan nínú ìjọ.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “láti pa wọ́n lára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Ní nǹkan bí àkókò yẹn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkókò tí ó sún mọ́ ìgbà yẹn; “ní nǹkan bí” fi ìtumọ̀ “about/around” hàn ní Yorùbá àdánidá. A kò fi δέ ṣe ọ̀rọ̀ ìbẹ̀rẹ̀ lọ́tọ̀, nítorí agbára rẹ̀ níbí jẹ́ ti yíyí ìtàn síwájú.
- source_word: Ἡρῴδης ὁ βασιλεὺς
  choice: Hẹ́rọ́dù ọba
  rationale: Èyí tẹ̀lé ìtẹ̀lé orúkọ àti àkọ́lé inú Gíríìkì, ó sì ṣeé lóye dáadáa ní Yorùbá.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: na ọwọ́ sí
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n ní àyíká yìí ó túmọ̀ sí pé Hẹ́rọ́dù gbé ìgbésẹ̀ ọ̀tá sí wọn, kì í ṣe fífi ọwọ́ kàn wọ́n lásán. Kíkọ ọ́ sí “mú” nìkan lè dín ìtumọ̀ rẹ̀ kù sí ìmúṣẹ tàbí ìfìṣẹ̀wọ̀n.
- source_word: κακῶσαί
  choice: láti ṣe wọ́n ní ibi
  rationale: Gbólóhùn yìí fi ìṣe búburú tàbí ìpalára sí ènìyàn hàn láìfi ìtumọ̀ ìṣe inúnibíni ẹ̀sìn tí ọ̀rọ̀ náà fúnra rẹ̀ kò fi dandan béèrè kún un.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: àwọn kan lára ìjọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé àwọn ènìyàn díẹ̀ nínú àwùjọ àwọn onígbàgbọ́ ni a ń sọ̀rọ̀ nípa wọn.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία
  choice: ìjọ
  alternative: àpéjọ; àwùjọ àwọn onígbàgbọ́
  rationale: Nínú Ìṣe àwọn Aposteli, ọ̀rọ̀ náà sábà ń tọ́ka sí àwùjọ àwọn Kristẹni. “Ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ìtumọ̀ yìí, láìdín un kù sí ilé ìjọsìn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán “na ọwọ́ sí” mọ́, a sì ṣàlàyé agbára ọ̀tá rẹ̀ nínú àlàyé ìsàlẹ̀.
