  source_fidelity: 'Ìtumọ̀ náà jẹ́ olóòtítọ́ sí Gíríìkì lápapọ̀: ó pa ìfarahàn àmì ọwọ́ fún ìdákẹ́jẹ́, ìròyìn Peteru nípa bí Olúwa ṣe mú un jáde nínú ọgbà ẹ̀wọ̀n, àṣẹ láti ròyìn fún Jakọbu àti àwọn arákùnrin, àti lílọ rẹ̀ sí ibòmíràn mọ́. Síbẹ̀, àmì ìsàlẹ̀ gbọdọ̀ wà lẹ́yìn «àwọn arákùnrin», kì í ṣe lẹ́yìn «dákẹ́», nítorí ìyẹn ni ọ̀rọ̀ tí àlàyé ìsàlẹ̀ ń ṣàlàyé. «Ilé ẹ̀wọ̀n» sì ṣàlàyé φυλακή gẹ́gẹ́ bí ibi ìhámọ́ dáadáa ju «ẹ̀wọ̀n» nìkan lọ, èyí tí ó lè túmọ̀ sí irin ìdè.'
