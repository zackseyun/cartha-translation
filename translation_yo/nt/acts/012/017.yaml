id: ACT.12.17
reference: Acts 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: yo
  text: Ṣùgbọ́n ó fi ọwọ́ ṣe àmì sí wọn láti dákẹ́, ó sì ṣàlàyé fún wọn bí Olúwa ṣe mú un jáde kúrò nínú ilé ẹ̀wọ̀n. Ó ní, “Ẹ ròyìn nǹkan wọ̀nyí fún Jakọbu àti àwọn arákùnrin[a].” Ó kúrò níbẹ̀, ó sì lọ sí ibòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin”; Gíríìkì ní “àwọn arákùnrin,” èyí tí ó lè tọ́ka sí àwùjọ àwọn onígbàgbọ́ lápapọ̀, bí ọ̀rọ̀ tó yí i ká bá ṣe fi hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας … τῇ χειρὶ σιγᾶν
  choice: ó fi ọwọ́ ṣe àmì sí wọn láti dákẹ́
  rationale: Èyí sọ ìṣe ọwọ́ tí ó ní ète láti mú kí àwùjọ dákẹ́ ní Yorùbá àdánidá, láì sọ irú àmì pàtó tí Gíríìkì kò sọ.
- source_word: διηγήσατο
  choice: ó ṣàlàyé fún wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísọ ìṣẹ̀lẹ̀ ní ọ̀nà àlàyé; yíyan yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: πῶς
  choice: bí
  rationale: Ó ṣe àgbékalẹ̀ ohun tí Peteru ṣàlàyé—ọ̀nà tí Olúwa gbà mú un jáde.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος, ó sì pa àìdánilójú nípa ẹni tí orúkọ oyè náà ń tọ́ka sí mọ́.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: ti mú òun jáde kúrò nínú ẹ̀wọ̀n
  rationale: “Mú … jáde” fi ìdáǹdè hàn ní kedere; “ẹ̀wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi ìhámọ́.
- source_word: Ἀπαγγείλατε
  choice: Ẹ ròyìn
  rationale: Àṣẹ náà ni pé kí wọ́n fi ìròyìn pàtàkì náà tó àwọn mìíràn létí; “ẹ ròyìn” pa agbára ìtumọ̀ yẹn mọ́.
- source_word: Ἰακώβῳ
  choice: Jakọbu
  rationale: Èyí ni ìkọ orúkọ Ἰακώβ tí ó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: τοῖς ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: Ó tẹ̀ lé ọ̀rọ̀ akọ ọ̀pọ̀ Gíríìkì ní tààrà; àlàyé ìsàlẹ̀ fi hàn pé ó lè ní ìtumọ̀ tó kan gbogbo àwọn onígbàgbọ́.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ó jáde, ó sì lọ
  rationale: Ó pa ìṣe méjèèjì mọ́—jíjáde kúrò níbẹ̀ àti lílọ sí ibòmíràn—ní Yorùbá tó rọrùn.
- source_word: εἰς ἕτερον τόπον
  choice: sí ibòmíràn
  rationale: Ó pa àìsọ pàtó ibi tí ó lọ mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jesu ní pàtó, tàbí Ọlọ́run ní ìtumọ̀ gbogbogbò
  rationale: Àyọkà náà kò ṣàlàyé ẹni tí κύριος ń tọ́ka sí. “Olúwa” pa ọ̀rọ̀ orísun àti ìṣòro ìtumọ̀ rẹ̀ mọ́ láìfi èrò ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àmì àlàyé [a] wà lẹ́yìn “dákẹ́” nítorí ìbéèrè náà, bí ó tilẹ̀ jẹ́ pé àkóónú àlàyé náà ń ṣàlàyé “àwọn arákùnrin.”
