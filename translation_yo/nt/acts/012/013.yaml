translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tó bá yẹ, a sì lo ‘Ródà’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ Gíríìkì Ῥόδη.
