  text: κρούσαντος δὲ ⸀αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθε παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: yo
  text: Nígbà tí ó sì kan ilẹ̀kùn ẹnu-ọ̀nà náà, ọmọbìnrin ìránṣẹ́ kan[a] tí orúkọ rẹ̀ ń jẹ́ Ródà wá láti dá a lóhùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹrúbìnrin.’ Ọ̀rọ̀ Gíríìkì παιδίσκη lè tọ́ka sí ọmọbìnrin tó jẹ́ ìránṣẹ́ ilé tàbí ẹrú.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Nígbà tí ó sì kan
  rationale: Ọ̀rọ̀ aṣáájú aorist pẹ̀lú δέ ń tẹ ìtàn náà síwájú, ó sì fi hàn pé kíkàn ilẹ̀kùn ni ó ṣáájú wíwá ọmọbìnrin náà. ‘Nígbà tí ó sì kan’ jẹ́ Yorùbá àdánidá tó pa ìtẹ̀síwájú ìtàn àti ìtumọ̀ àkókò mọ́.
- source_word: θύραν τοῦ πυλῶνος
  choice: ilẹ̀kùn ẹnu ọ̀nà àgbà
  rationale: θύρα túmọ̀ sí ‘ilẹ̀kùn,’ πυλών sì ń tọ́ka sí ẹnu ọ̀nà tàbí ibi ìwọlé ńlá. Gbólóhùn yìí pa èrò ọ̀rọ̀ méjèèjì mọ́ láì fi ‘àgbàlá’ tàbí àlàyé míì tí kò sí nínú Gíríìkì kún un.
- source_word: προσῆλθε
  choice: wá
  rationale: Nínú àyíká ilé yìí, ‘wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó sún mọ́ ibi tí wọ́n ti kan ilẹ̀kùn; ọ̀rọ̀ tó tẹ̀ lé e sọ ète wíwá náà.
- source_word: παιδίσκη
  choice: ọmọbìnrin ìránṣẹ́
  rationale: παιδίσκη lè jẹ́ ọ̀dọ́bìnrin tó ń ṣiṣẹ́ gẹ́gẹ́ bí ìránṣẹ́ tàbí ẹrú. ‘Ọmọbìnrin ìránṣẹ́’ bá ipa rẹ̀ nínú agbo ilé mu, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ‘ẹrúbìnrin’ mọ́.
- source_word: ὑπακοῦσαι
  choice: láti dáhùn
  rationale: Bí ó tilẹ̀ jẹ́ pé ὑπακούω lè túmọ̀ sí gbígbọ́ tàbí ṣíṣègbọràn, níbi ilẹ̀kùn tí ẹnì kan ń kàn án, ó túmọ̀ sí wíwá láti dá ẹni náà lóhùn.
- source_word: ὀνόματι Ῥόδη
  choice: tí orúkọ rẹ̀ ń jẹ́ Ródà
  rationale: Dative ὀνόματι fi orúkọ ẹni náà hàn. Gbólóhùn Yorùbá yìí jẹ́ kedere, a sì ṣe àkọsílẹ̀ Ῥόδη gẹ́gẹ́ bí ‘Ródà’ ní ìbámu pẹ̀lú ìró Yorùbá.
