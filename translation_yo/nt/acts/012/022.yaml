id: ACT.12.22
reference: Acts 12:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: yo
  text: Àwọn ènìyàn náà sì ń ké jáde pé, “Ohùn ọlọ́run ni èyí, kì í ṣe ti ènìyàn!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohùn Ọlọ́run ni èyí, kì í ṣe ti ènìyàn!” Gíríìkì lè ní ìtumọ̀ yìí, ṣùgbọ́n nínú àyíká ọ̀rọ̀ náà, ó ṣeé ṣe jù pé “ohùn ọlọ́run kan” ni wọ́n ní lọ́kàn, bí àwọn abọ̀rìṣà ṣe ń fi ọlá ọlọ́run fún Hẹ́rọ́dù.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: àwọn ènìyàn náà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí ó péjọ síbẹ̀, kì í ṣe ẹgbẹ́ ìṣèlú kan. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìjọ ènìyàn níbi ìṣẹ̀lẹ̀ náà.
- source_word: ἐπεφώνει
  choice: ń ké jáde
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé ìké náà ń bá a lọ tàbí pé wọ́n ń tún un ṣe; “ń ké jáde” pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: Θεοῦ
  choice: ti ọlọ́run
  rationale: Nínú àyíká àwọn abọ̀rìṣà tí wọ́n ń fi ọlá ọlọ́run fún Hẹ́rọ́dù, genitive tí kò ní article yìí ṣeé lóye jù lọ gẹ́gẹ́ bí “ti ọlọ́run kan,” kì í ṣe dandan Ọlọ́run Ísírẹ́lì. Yorùbá kò fi article àìdánimọ̀ hàn lójú ọ̀rọ̀ náà, nítorí náà àlàyé ẹsẹ̀-isalẹ̀ ṣàlàyé àìdánilójú náà.
- source_word: φωνὴ
  choice: ohùn
  rationale: “Ohùn” ni ìbámu tààrà pẹ̀lú φωνή, ó sì pa ìrísí ọ̀rọ̀-orúkọ inú ìké náà mọ́.
- source_word: ἀνθρώπου
  choice: ti ènìyàn
  rationale: Ó pa ìyàtọ̀ tààrà tó wà láàárín ọlọ́run àti ènìyàn mọ́ láì sọ ọ́ di àlàyé bí “ohùn ènìyàn lásán.”
theological_decisions:
- issue: Bóyá Θεοῦ túmọ̀ sí “ti Ọlọ́run” tàbí “ti ọlọ́run kan”
  choice: ti ọlọ́run
  alternative: ti Ọlọ́run
  rationale: Àyíká náà jẹ́ ti ọ̀pọ̀ ènìyàn abọ̀rìṣà tí wọ́n ń yin Hẹ́rọ́dù bí ẹni tó ní ìwà ọlọ́run. Lílò “Ọlọ́run” lè mú kí ó dà bí ẹni pé wọ́n ń tọ́ka sí Ọlọ́run kan ṣoṣo ti Ísírẹ́lì. Síbẹ̀, Gíríìkì lè gba ìtumọ̀ yẹn, nítorí náà a pa á mọ́ sínú àlàyé ẹsẹ̀-isalẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. “Ń ké jáde” fi ìṣe tí ń bá a lọ hàn; “olọ́run” pẹ̀lú lẹ́tà kékeré yà á sọ́tọ̀ sí “Ọlọ́run,” nígbà tí àlàyé ẹsẹ̀-isalẹ̀ pa àṣàyàn Gíríìkì kejì mọ́.
