  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: yo
  text: Ó sì fi idà pa Jákọ́bù[a], arákùnrin Jòhánù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fi Jákọ́bù sí ikú,” tàbí “ó pa Jákọ́bù gẹ́gẹ́ bí ìdájọ́.” Ọ̀rọ̀ Gíríìkì náà sọ pé ó fa ikú Jákọ́bù; àyíká ọ̀rọ̀ lè fi hàn pé ìpaniyan tí ìjọba pa láṣẹ ni, ṣùgbọ́n ẹsẹ̀ náà fúnra rẹ̀ kò sọ èyí ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: fi idà pa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó fa ikú Jákọ́bù; fífi ‘pa’ ṣe àfihàn ìṣe náà ní kedere láì fi èrò ìdájọ́ òfin kún un. A so ọ́ mọ́ ‘fi idà’ gẹ́gẹ́ bí Gíríìkì ṣe sọ ohun èlò tí a lò.
- source_word: δὲ
  choice: sì
  rationale: δέ ń tẹ ìtàn náà síwájú níbí; ‘sì’ jẹ́ àsopọ̀ Yorùbá tó bá ọ̀nà ìtàn mu, láì dá ìtakora líle sílẹ̀.
- source_word: Ἰάκωβον
  choice: Jákọ́bù
  rationale: A lo ìrísí orúkọ Bíbélì tí ó ti wọ́pọ̀ ní Yorùbá fún Ἰάκωβος.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: arákùnrin Jòhánù
  rationale: Gbólóhùn àfikún yìí ń dá Jákọ́bù tí a ń sọ̀rọ̀ rẹ̀ mọ̀; ìtumọ̀ yìí jẹ́ adayébá, ó sì tẹ̀ lé ìtumọ̀ Gíríìkì.
- source_word: μαχαίρῃ
  choice: fi idà
  rationale: Dative náà ń tọ́ka sí ohun èlò tí a fi ṣe ìṣe náà. ‘Fi idà’ jẹ́ ọ̀nà Yorùbá adayébá láti pa àwòrán ohun èlò náà mọ́.
theological_decisions:
- issue: Irú ìṣe Hẹ́rọ́dù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí pípa Jákọ́bù, láì sọ ní pàtó pé ìpaniyan lábẹ́ àṣẹ ìjọba ni.
  alternative: Ó pa Jákọ́bù lábẹ́ àṣẹ / ó dá Jákọ́bù lẹ́bi ikú.
  rationale: ἀνεῖλεν sọ pé ó fa ikú Jákọ́bù, μαχαίρῃ sì sọ ohun èlò tí a lò. Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè tọ́ka sí ìpaniyan tí ìjọba pa láṣẹ, ẹsẹ yìí fúnra rẹ̀ kò fi ètò òfin hàn ní pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àtòjọ ọ̀rọ̀ Yorùbá adayébá ‘fi idà pa’ dípò lílo ọ̀rọ̀ tí yóò fi ètò ìdájọ́ òfin kún Gíríìkì.
