source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: yo
  text: Ní ọjọ́ tí a ti yàn, Hẹ́rọ́dù wọ aṣọ ọba[a], ó jókòó lórí pèpéle ìjọba[b], ó sì ń sọ àsọyé sí wọn ní gbangba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ẹ̀wù ọba.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aṣọ ọlọ́lá ní ìtumọ̀ gboòrò.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ìtẹ́ ìdájọ́” tàbí “ibi gíga.” Ọ̀rọ̀ Gíríìkì βῆμα sábà máa ń tọ́ka sí ìtẹ́ aláṣẹ tàbí pèpéle gíga.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: Ní ọjọ́ kan tí a ti yàn sílẹ̀
  rationale: Èyí fi hàn pé ọjọ́ náà jẹ́ ọjọ́ tí a ti pinnu tàbí yàn tẹ́lẹ̀, láìfi dandan sọ pé ọjọ́ kan ṣoṣo tí gbogbo ènìyàn mọ̀ ni.
- source_word: ἐνδυσάμενος
  choice: wọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist middle, ó sì tọ́ka sí pé Hẹ́rọ́dù kọ́kọ́ wọ aṣọ náà; ìtúmọ̀ Yorùbá yìí jẹ́ kúkúrú, ó sì tẹ̀ lé bí àwọn ìṣe náà ṣe ń ṣẹlẹ̀ tẹ̀ léra.
- source_word: ἐσθῆτα βασιλικὴν
  choice: aṣọ ọba
  rationale: ἐσθής lè túmọ̀ sí aṣọ tàbí ohun ìmúra ológo ní gbogbogbòò; ‘aṣọ ọba’ jẹ́ èdè àdánidá tí kò fi dandan sọ pé ọ̀pọ̀ ẹ̀wù ni.
- source_word: καθίσας
  choice: ó jókòó
  rationale: Èyí mú ìṣe kejì nínú ìtẹ̀lé ìṣẹ̀lẹ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἐπὶ τοῦ βήματος
  choice: lórí pèpéle ìjọba
  rationale: βῆμα lè jẹ́ ìjókòó onídàájọ́ tàbí ibi gíga tí aláṣẹ ti ń ṣe iṣẹ́ ìjọba. ‘Pèpéle ìjọba’ pa ìtumọ̀ ibi gíga àti ti iṣẹ́ aláṣẹ mọ́ láìsọ pé ẹjọ́ kan ń lọ níbẹ̀.
- source_word: ἐδημηγόρει
  choice: ó sì ń bá wọn sọ̀rọ̀ ní gbangba
  rationale: δημηγορέω túmọ̀ sí sísọ̀rọ̀ sí àwùjọ ní gbangba; àmì imperfect náà wà nínú ‘ń ... sọ̀rọ̀,’ tó fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́.
- source_word: πρὸς αὐτούς
  choice: bá wọn sọ̀rọ̀
  rationale: Èyí fi hàn pé àwọn náà ni Hẹ́rọ́dù ń darí ọ̀rọ̀ rẹ̀ sí.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé lásán. A fi àmì ohùn sí ibi tí ó bá yẹ. A fi [a] mọ́ ‘aṣọ ọba,’ nítorí àlàyé yẹn jẹ mọ́ ἐσθῆτα βασιλικὴν, kì í ṣe gbolohun ọjọ́ tí a yàn.
