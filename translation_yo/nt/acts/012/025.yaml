id: ACT.12.25
reference: Acts 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: yo
  text: Ṣùgbọ́n Bánábà àti Sọ́ọ̀lù padà sí Jerúsálẹ́mù[a] lẹ́yìn tí wọ́n parí iṣẹ́ ìránṣẹ́ náà; wọ́n sì mú Jòhánù, ẹni tí a ń pè ní Máàkù, lọ pẹ̀lú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “láti Jerúsálẹ́mù” dípò “sí Jerúsálẹ́mù.”
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: padà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti padà tàbí lọ padà; “padà” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àkópọ̀ gbolohun náà mu.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́mù
  rationale: εἰς sábà máa ń tọ́ka sí ibi tí ẹnì kan ń lọ, nítorí náà “sí Jerúsálẹ́mù” ni ìtumọ̀ tààrà fún ọ̀rọ̀ inú SBLGNT tí a pèsè.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: lẹ́yìn tí wọ́n parí iṣẹ́ ìránṣẹ́ náà
  rationale: Ìtumọ̀ náà fi hàn pé wọ́n kọ́kọ́ parí iṣẹ́ tí a fi lé wọn lọ́wọ́, ó sì sọ ìṣe aláìlẹ́gbẹ̀ náà ní Yorùbá àdánidá.
- source_word: διακονίαν
  choice: iṣẹ́ ìránṣẹ́
  rationale: “Iṣẹ́ ìránṣẹ́” pa ìtumọ̀ gbígbòòrò ti iṣẹ́ ìsìn tàbí iṣẹ́ ìrànlọ́wọ́ mọ́ láì sọ ọ́ di iṣẹ́ pípín ìrànlọ́wọ́ nìkan.
- source_word: συμπαραλαβόντες
  choice: wọ́n sì mú ... lọ pẹ̀lú wọn
  rationale: Gbólóhùn yìí sọ ní Yorùbá àdánidá pé wọ́n mú Jòhánù bá ara wọn lọ gẹ́gẹ́ bí alábàágbépọ̀.
- source_word: ἐπικληθέντα Μᾶρκον
  choice: ẹni tí a ń pè ní Máàkù
  rationale: Èyí túmọ̀ ọ̀rọ̀ àìṣe náà ní tààrà pé Máàkù ni orúkọ tí a fi ń pe Jòhánù, láì fi “pẹ̀lú” kún ohun tí Gíríìkì kò sọ ní kedere.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa ibi tí wọ́n padà sí tàbí ibi tí wọ́n ti padà wá
  choice: sí Jerúsálẹ́mù
  alternative: láti Jerúsálẹ́mù
  rationale: SBLGNT tí a pèsè ní εἰς Ἰερουσαλήμ, “sí Jerúsálẹ́mù.” A tẹ̀ lé ẹ̀rí orísun yẹn nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a pa ìtumọ̀ àfọwọ́kọ mìíràn tó ní ìyàtọ̀ pàtàkì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A yan “iṣẹ́ ìránṣẹ́” láti jẹ́ kí ìtumọ̀ διακονία dúró ní fífẹ̀, a sì lo àkópọ̀ “wọ́n sì mú ... lọ pẹ̀lú wọn” fún ìṣàn ọ̀rọ̀ Yorùbá tó rọrùn láti lóye.
