id: ACT.12.4
reference: Acts 12:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti mú un, ó fi í sẹ́wọ̀n, ó sì fi í lé ẹgbẹ́ ọmọ-ogun mẹ́rin lọ́wọ́ kí wọ́n lè ṣọ́ ọ́.[a] Ó ní èrò láti mú un jáde síwájú àwọn ènìyàn lẹ́yìn Àjọ Ìrékọjá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹgbẹ́ mẹ́rin ti mẹ́rin àwọn ọmọ-ogun,” ìyẹn ni, ẹgbẹ́ mẹ́rin tí ọmọ-ogun mẹ́rin wà nínú ẹgbẹ́ kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì πάσχα túmọ̀ sí “Àjọ Ìrékọjá”; àwọn ìtumọ̀ Bíbélì Gẹ̀ẹ́sì àtijọ́ kan pè é ní “Easter” níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: nígbà tí ó sì ti mú un
  rationale: Aorist participle náà fi hàn pé mímú Pétérù ṣẹlẹ̀ ṣáájú fífi í sínú ẹ̀wọ̀n; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá fún ìtẹ̀lé ìṣẹ̀lẹ̀ náà.
- source_word: ἔθετο εἰς φυλακήν
  choice: ó fi í sínú ẹ̀wọ̀n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún fífi ẹni kan sẹ́wọ̀n.
- source_word: παραδοὺς
  choice: ó sì fi í lé ... lọ́wọ́
  rationale: Ó pa ìtumọ̀ fífi Pétérù sí abẹ́ àṣẹ àti àbójútó àwọn ọmọ-ogun mọ́.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: ẹgbẹ́ ọmọ-ogun mẹ́rin
  rationale: Ó jẹ́ èdè Yorùbá tó rọrùn láti lóye; àlàyé ìsàlẹ̀ ojú ìwé sọ pé ọmọ-ogun mẹ́rin ló wà nínú ẹgbẹ́ kọ̀ọ̀kan.
- source_word: φυλάσσειν αὐτόν
  choice: láti máa ṣọ́ ọ́
  rationale: Infinitive náà ń sọ ète fífi í lé àwọn ọmọ-ogun lọ́wọ́, ìyẹn láti ṣọ́ ọ́.
- source_word: βουλόμενος
  choice: ó ní lọ́kàn
  rationale: Ó fi ète tí Hẹ́rọ́dù ti pinnu hàn láìfi ìmọ̀lára tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: μετὰ τὸ πάσχα
  choice: lẹ́yìn Àjọ Ìrékọjá
  rationale: πάσχα ń tọ́ka sí Àjọ Ìrékọjá àwọn Júù, kì í ṣe ayẹyẹ Easter ti ìṣe Kristẹni tó wá lẹ́yìn náà.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: láti mú un jáde wá fún àwọn ènìyàn
  rationale: Ó pa èrò mímú Pétérù jáde sí gbangba fún àwọn ènìyàn mọ́, láìsọ pé ìdájọ́ pàtó kan ni, nítorí ọ̀rọ̀ Gíríìkì kò sọ bẹ́ẹ̀ ní tààrà.
- source_word: λαῷ
  choice: àwọn ènìyàn
  rationale: Yíyan yìí jẹ́ ti àdánidá, ó sì lè tọ́ka sí gbogbo ènìyàn gẹ́gẹ́ bí àwùjọ ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ πάσχα
  choice: Àjọ Ìrékọjá
  alternative: Easter
  rationale: Ìtumọ̀ pàtó ti πάσχα ni Àjọ Ìrékọjá. Èyí tẹ̀lé ẹ̀rí èdè ìpilẹ̀ dípò àṣà àwọn ìtumọ̀ Gẹ̀ẹ́sì àtijọ́ kan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ, a sì gbe àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
