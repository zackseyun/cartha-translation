  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “tẹjú mọ́” fún àfiyèsí tí ó tẹ̀ síwájú; àmì àlàyé [a] pa àwọn ìtumọ̀ tó ṣeé ṣe mọ́.
