  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: yo
  text: Ó sì ń tẹjú mọ́ wọn,[a] ó ń retí láti gba ohun kan lọ́wọ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì ń fi gbogbo àfiyèsí rẹ̀ sí wọn” tàbí “ó sì ń wò wọ́n gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: ὁ tọ́ka sí ọkùnrin arọ náà, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “Ó sì” jẹ́ èdè Yorùbá àdánidá níhìn-ín.
- source_word: ἐπεῖχεν
  choice: tẹjú mọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi àfiyèsí dúró lórí ẹnì kan. “Tẹjú mọ́” mú ìwòye àti àfiyèsí tí ó tẹ̀ síwájú jáde, gẹ́gẹ́ bí ìṣe aláìparí náà ṣe fi hàn.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ó tọ́ka sí Peteru àti Johanu; pẹ̀lú “tẹjú mọ́,” àfikún ọ̀rọ̀ mìíràn kò pọndandan ní Yorùbá.
- source_word: προσδοκῶν
  choice: ó ń retí
  rationale: Ó ṣàlàyé ohun tí ó bá fífi àfiyèsí rẹ̀ sí wọn lọ, ó sì fi ìfojúsọ́nà rẹ̀ hàn.
- source_word: τι
  choice: ohun kan
  rationale: Ó jẹ́ ohun tí a kò sọ pàtó, ṣùgbọ́n tí ọkùnrin náà ń retí pé yóò gbà.
- source_word: παρ’ αὐτῶν
  choice: lọ́wọ́ wọn
  rationale: παρά pẹ̀lú ẹ̀yà ìbílẹ̀ ń tọ́ka sí orísun; “lọ́wọ́ wọn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun náà yóò ti ọ̀dọ̀ wọn wá.
- source_word: λαβεῖν
  choice: láti rí … gbà
  rationale: “Rí … gbà” bá àyíká fífúnni ní àánú mu, ó sì yẹra fún ìtumọ̀ pé ó ń fi agbára mú ohun náà.
theological_decisions: []
