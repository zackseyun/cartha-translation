  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: yo
  text: Ó sì di ọwọ́ ọ̀tún rẹ̀ mú, ó gbé e dìde; lẹ́sẹ̀kẹsẹ̀, àwọn ẹsẹ̀ rẹ̀ àti àwọn kókósẹ̀ rẹ̀[a] sì lágbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn egungun kókósẹ̀ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιάσας
  choice: di … mú
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó fi ọwọ́ di ẹni náà mú. “Di … mú” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì bá ìṣe rere inú àyíká ọ̀rọ̀ náà mu láìsọ ọ́ di líle bí “gbá mú.”
- source_word: τῆς δεξιᾶς χειρός
  choice: ọwọ́ ọ̀tún rẹ̀
  rationale: Ẹ̀ka ọ̀rọ̀ oníbátan lẹ́yìn πιάσας túmọ̀ sí dí ẹni náà ní ọwọ́ ọ̀tún. Bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lo article dípò ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní, “rẹ̀” ṣe kedere ẹni tí ọwọ́ náà jẹ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἤγειρεν αὐτόν
  choice: ó gbé e dìde
  rationale: “Gbé … dìde” pa ìṣe ti ara mọ́, ó sì bá ìtumọ̀ ἐγείρω mu láìfi àlàyé míì kún un pé ó kan ràn án lọ́wọ́.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó sọ bí ìyípadà náà ṣe ṣẹlẹ̀ lójijì, láìsí ìdádúró; “lẹ́sẹ̀kẹsẹ̀” jẹ́ gbólóhùn Yorùbá tó mọ́gbọ́n dání fún ìtumọ̀ yìí.
- source_word: ἐστερεώθησαν
  choice: lágbára
  rationale: Nínú gbólóhùn “ni … lágbára,” ó fi hàn pé àwọn ẹ̀yà ara náà di alágbára ní ojú ẹsẹ̀. Ìtúmọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, kò sì sọ ẹni tó fún wọn ní agbára ní pàtó níbi tí ẹsẹ Bíbélì náà kò ti sọ ọ́.
- source_word: αἱ βάσεις αὐτοῦ
  choice: ẹsẹ̀ rẹ̀
  rationale: βάσεις tọ́ka sí àwọn apá ìsàlẹ̀ tí ara fi dúró. “Ẹsẹ̀ rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ ju ìtumọ̀ gangan bí “ìpìlẹ̀ ẹsẹ̀” lọ.
- source_word: τὰ σφυδρά
  choice: àwọn kókósẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí agbègbè tàbí oríkèé kókósẹ̀. “Àwọn kókósẹ̀ rẹ̀” jẹ́ ọ̀nà àdánidá tí kò fi ìtumọ̀ tóóró bí “egungun kókósẹ̀” lé ọ̀rọ̀ Gíríìkì náà lórí.
theological_decisions:
- issue: Irú àlàyé tí a ṣe nípa ìwòsàn náà
  choice: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí agbára tó dé bá ẹsẹ̀ àti kókósẹ̀ ọkùnrin náà lẹ́sẹ̀kẹsẹ̀, láìfi ọ̀rọ̀ àlàyé nípa bí iṣẹ́ ìyanu náà ṣe ṣẹlẹ̀ kún un.
  alternative: Láti túmọ̀ ọ́ sí “a mú wọn láradá” tàbí láti dárúkọ Ọlọ́run gẹ́gẹ́ bí olùṣe nínú gbólóhùn yìí.
  rationale: Ẹsẹ náà ṣàpèjúwe ohun tó ṣẹlẹ̀ nípa bí àwọn ẹ̀yà ara ṣe lágbára. Ìtumọ̀ náà pa àpèjúwe yẹn mọ́, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé iṣẹ́ ìyanu ni, dípò fífi ẹ̀kọ́ tàbí aṣojú iṣẹ́ tí a kò dárúkọ sínú gbólóhùn náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. A gbé àmì àlàyé [a] sí lẹ́yìn “kókósẹ̀,” nítorí pé àṣàyàn “egungun kókósẹ̀” jẹ́ ti τὰ σφυδρά, kì í ṣe ti “ọwọ́ ọ̀tún.”
