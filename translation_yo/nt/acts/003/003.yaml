  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: yo
  text: Nígbà tí ó rí Pétérù àti Jòhánù tí wọ́n fẹ́rẹ̀ẹ́ wọ inú àgbègbè tẹ́ńpìlì[a], ó ń béèrè fún owó àánú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, ἱερόν, ń tọ́ka sí àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Nígbà tí ó rí
  rationale: A tú ẹ̀ka alábápín aorist náà sí gbólóhùn àkókò ní Yorùbá, èyí tó jẹ́ ọ̀nà àdánidá láti fi hàn pé rírí wọn ló ṣáájú ìbéèrè rẹ̀.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pétérù àti Jòhánù
  rationale: Àwọn wọ̀nyí ni ọ̀nà tí a sábà ń kọ orúkọ àwọn ẹni náà ní Yorùbá.
- source_word: μέλλοντας εἰσιέναι
  choice: tí wọ́n fẹ́ wọ inú
  rationale: Nínú àyíká ìtàn yìí, μέλλω pẹ̀lú ọ̀rọ̀-ìṣe àìlẹ́ni fi hàn pé wọ́n ti fẹ́rẹ̀ẹ́ wọlé; ọ̀rọ̀ Yorùbá yìí sọ ìṣe tó sún mọ́lé lọ́nà àdánidá.
- source_word: εἰς τὸ ἱερόν
  choice: wọ inú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. Fífi “àgbàlá” kún un mú ìtumọ̀ yìí ṣe kedere.
- source_word: ἠρώτα
  choice: ó bẹ̀rẹ̀ sí í tọrọ
  rationale: Àkókò imperfect lè fi ìṣe tó ń bá a lọ tàbí tí a ń ṣe léraléra hàn. Nínú iṣẹ́ alágbe yìí, “bẹ̀rẹ̀ sí í tọrọ” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ìbéèrè tó ń lọ lọ́wọ́, bó tilẹ̀ jẹ́ pé “ó tọrọ” tún ṣeé ṣe.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: àánú lọ́wọ́ wọn
  rationale: Nínú àyíká yìí, ἐλεημοσύνη túmọ̀ sí owó tàbí ẹ̀bùn tí a ń fún aláìní. Yorùbá sábà máa ń sọ “tọrọ àánú,” “lọ́wọ́ wọn” sì mú ẹni tí ó ń béèrè lọ́wọ́ rẹ̀ ṣe kedere láì yí ìtumọ̀ padà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. “Àgbàlá tẹ́ńpìlì” ni a lò láti ṣàfihàn ìtumọ̀ gbooro ti ἱερόν; “tọrọ àánú” sì jẹ́ gbólóhùn Yorùbá àdánidá fún bí aláìní ṣe ń béèrè ẹ̀bùn.
