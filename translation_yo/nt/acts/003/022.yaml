id: ACT.3.22
reference: Acts 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: yo
  text: Mósè nítòótọ́ sọ pé, “Olúwa Ọlọ́run yóò gbé wòlíì kan dìde fún yín láti àárín àwọn arákùnrin yín[a], gẹ́gẹ́ bí èmi[b]. Ẹ ó fetí sí i nínú gbogbo ohun tí ó bá sọ fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “láti àárín àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ yín.” Ọ̀rọ̀ Gíríìkì náà sọ ní ti gidi pé, “láti àárín àwọn arákùnrin yín”; ó lo ọ̀rọ̀ ìbátan akọ ní ọ̀nà tí ó ń tọ́ka sí gbogbo àwọn ènìyàn májẹ̀mú.
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, ìwé Ìṣe fa ọ̀rọ̀ Deuteronomi 18:15 yọ pẹ̀lú ìyàtọ̀ díẹ̀; ní pàtàkì, ọ̀rọ̀ Gíríìkì inú Ìṣe sọ pé, “Olúwa Ọlọ́run,” kì í ṣe, “Olúwa Ọlọ́run yín.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν ὅτι
  choice: Mósè sì sọ pé
  rationale: “Mósè” ni ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá. “Sì” ń fi ìtẹnumọ́ àti ìtẹ̀síwájú ọ̀rọ̀ μέν hàn lọ́nà àdánidá, “sọ pé” sì ṣí ọ̀rọ̀ àyọlò tààrà sílẹ̀.
- source_word: Προφήτην
  choice: wòlíì kan
  rationale: “Wòlíì kan” fi àìní àfihàn pàtó nínú ọ̀rọ̀ Gíríìkì hàn, láì fi “Mèsáyà” tàbí oyè míràn kún un.
- source_word: ἀναστήσει
  choice: yóò gbé ... dìde
  rationale: Èyí pa àwòrán ọ̀rọ̀ ìpilẹ̀ mọ́, ṣùgbọ́n kò fi dandan túmọ̀ rẹ̀ sí àjíǹde nínú àyíká yìí.
- source_word: κύριος ὁ θεὸς
  choice: Olúwa Ọlọ́run
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì inú Ìṣe, tí kò ní ọ̀rọ̀ arọ́pò-orúkọ “yín,” dípò kí a mú un bá ọ̀rọ̀ Deuteronomi mu.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: láti àárín àwọn arákùnrin yín
  rationale: “Láti àárín” mú ἐκ jáde lọ́nà kedere; “àwọn arákùnrin yín” sì pa èdè ìbátan akọ ti orísun àti ìtumọ̀ rẹ̀ fún àwọn ọmọ Ísírẹ́lì mọ́.
- source_word: ὡς ἐμέ
  choice: ẹni tí ó dà bí èmi
  rationale: Èyí sọ ìfiwéra pẹ̀lú Mósè ní Yorùbá tí ó ṣe kedere, láì ṣàfikún ìtumọ̀ mìíràn.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Ẹ ó fetí sí i
  rationale: “Fetí sí” ju gbígbọ́ ohùn lásán lọ, ó sì lè ní agbára pé kí wọ́n gba ọ̀rọ̀ rẹ̀ gbọ́; fọ́ọ̀mù ọjọ́ iwájú pa ìrísí àti agbára májẹ̀mú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: nínú gbogbo ohun tí ó bá sọ fún yín
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ gbogbo ohun tí wòlíì náà bá sọ mọ́.
theological_decisions:
- issue: Àyọlò Deuteronomi 18 àti ìdámọ̀ Mèsáyà
  choice: A túmọ̀ Προφήτην sí “wòlíì kan,” láì fi “Mèsáyà” tàbí “Wòlíì náà” sínú ọ̀rọ̀.
  alternative: “Wòlíì náà” tàbí fífi hàn ní tààrà pé Mèsáyà ni.
  rationale: Pétérù ń lo àyọlò náà sí Jésù nínú àyíká Ìṣe, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ “wòlíì kan.” Ìtumọ̀ kò yẹ kí ó yanjú ohun tí ọ̀rọ̀ náà fi sílẹ̀ fún àyíká rẹ̀.
- issue: Ìtumọ̀ ἀδελφῶν
  choice: àwọn arákùnrin yín
  alternative: àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ yín
  rationale: Orísun náà lo ọ̀rọ̀ ìbátan akọ ní ọ̀pọ̀; àlàyé ìsàlẹ̀ ojú ìwé ni ó sọ pé ó dúró fún àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn ní èrò májẹ̀mú.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà jẹ́ kíkà fún òǹkàwé lásán, ṣùgbọ́n ó tún pa àwòrán “gbé ... dìde,” èdè ìbátan “arákùnrin,” àti agbára májẹ̀mú “Ẹ ó fetí sí i” mọ́.
