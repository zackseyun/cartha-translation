id: ACT.3.23
reference: Acts 3:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: yo
  text: Yóò sì jẹ́ pé, ẹnikẹ́ni tí kò bá fetí sí wòlíì náà, a ó pa á run pátápátá kúrò láàárín àwọn ènìyàn náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘a ó gé e kúrò láàárín àwọn ènìyàn náà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: Ẹnikẹ́ni
  rationale: Ọ̀rọ̀ náà túmọ̀ sí olúkúlùkù ènìyàn nínú àṣà èdè yìí, kì í ṣe ‘ọkàn’ gẹ́gẹ́ bí apá kan tí a yà sọ́tọ̀ kúrò lára ènìyàn. ‘Ẹnikẹ́ni’ jẹ́ Yorùbá àdánidá tí ó bá gbólóhùn aláìnípàtó tó tẹ̀ lé e mu.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: tí kò bá fetí sí
  rationale: ‘Fetí sí’ kọjá gbígbọ́ ohùn lásán; ó fi hàn pé kí ẹni náà tẹ́tí sí i kí ó sì gba ọ̀rọ̀ wòlíì náà, láìfi ìtumọ̀ ìgbọ́ràn kún un ju ohun tí ọ̀rọ̀ Gíríìkì lè gbà lọ.
- source_word: τοῦ προφήτου ἐκείνου
  choice: wòlíì náà
  rationale: Àpólà náà ń tọ́ka sí wòlíì pàtó tí ẹsẹ tó ṣáájú mẹ́nu kàn. ‘Náà’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka padà sí i, láìsọ ọ́ di orúkọ oyè lọ́nà tí Gíríìkì kò fi dandan béèrè.
- source_word: ἐξολεθρευθήσεται
  choice: ni a ó parun pátápátá
  rationale: Ọ̀rọ̀-ìṣe náà ní agbára ju yíyọ ẹnì kan sílẹ̀ lásán lọ, ó sì lè tọ́ka sí ìparun tàbí ìmúkúrò pátápátá. ‘Parun pátápátá’ pa líle ìkìlọ̀ náà mọ́; ìtumọ̀ ‘gé kúrò’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐκ τοῦ λαοῦ
  choice: kúrò láàárín àwọn ènìyàn náà
  rationale: Èyí fi hàn pé a mú ẹni náà kúrò nínú àwùjọ àwọn ènìyàn náà. A kò fi ọ̀rọ̀ oníhun bí ‘àwọn ènìyàn rẹ̀’ kún un, nítorí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Irú ìdájọ́ tí ìkìlọ̀ náà ń tọ́ka sí
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìparun àti mímúkúrò láàárín àwọn ènìyàn, láìsọ àkókò tàbí ọ̀nà ìdájọ́ náà ní pàtó.
  alternative: Kí a túmọ̀ ọ́ sí yíyọ ẹni náà kúrò nínú àwùjọ májẹ̀mú nìkan, tàbí sí ìdájọ́ ìkẹyìn nìkan.
  rationale: Ẹsẹ náà kéde ìdájọ́ líle fún ẹni tí kò fetí sí wòlíì náà, ṣùgbọ́n kò ṣàlàyé ní kíkún bóyá ìdájọ́ náà jẹ́ ti ayé yìí, ti àwùjọ májẹ̀mú, tàbí ti ọjọ́ ìkẹyìn. Ìtumọ̀ náà pa líle àti àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Fetí sí’ àti ‘láàárín àwọn ènìyàn náà’ jẹ́ àdánidá fún òǹkàwé gbogbo ènìyàn, nígbà tí ‘parun pátápátá’ pa agbára ọ̀rọ̀ Gíríìkì mọ́.
