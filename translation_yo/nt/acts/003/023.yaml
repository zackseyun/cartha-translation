  rationale: Àtúnṣe náà ṣàtúnṣe gírámà Yorùbá nípasẹ̀ fífi ‘á’ hàn gẹ́gẹ́ bí ohun-ìṣe ‘pa ... run,’ láìyí ìtumọ̀ ìkìlọ̀ náà padà. Ó tún mú ìsopọ̀ ἔσται δὲ hàn ní ìbẹ̀rẹ̀ gbolóhùn, ó sì dá ìyà tó líle àti àìpẹ̀kun nípa irú tàbí àkókò ìdájọ́ náà dúró.
