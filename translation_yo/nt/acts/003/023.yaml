review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú ‘ẹnikẹ́ni,’ ‘fetí sí,’ wòlíì pàtó náà, ìparun líle, àti yíyọ kúrò láàárín àwọn ènìyàn náà wá dáadáa. Ṣùgbọ́n ìkọ́lé ‘Ẹnikẹ́ni ... ni a ó parun’ kò tọ́ ní Yorùbá: ó mú kí ẹni tí a ń tọ́ka sí dà bí ẹni tó ń ṣe ìparun náà, dípò ẹni tí ìparun yóò ṣẹlẹ̀ sí.'
  naturalness: 'A nílò láti tún gbolóhùn náà kọ́ kí aṣojú ẹni náà hàn ní kedere: ‘a ó pa á run.’ Fífi ‘Yóò sì jẹ́ pé’ hàn tún ń ṣàfihàn ἔσται δὲ ní ọ̀nà Yorùbá tí ó dára.'
  terminology: ‘Wòlíì náà,’ ‘fetí sí,’ àti ‘pa á run pátápátá’ yẹ, wọ́n sì pa ìtọ́kasí sí wòlíì náà àti agbára ἐξολεθρευθήσεται mọ́. Àlàyé ‘gé e kúrò’ jẹ́ àṣàyàn tó yẹ fún ìtumọ̀ ìpilẹ̀ ọrọ̀ náà.
