    rationale: ἔσται δὲ bẹ̀rẹ̀ gbolóhùn náà. ‘Yóò sì jẹ́ pé’ jẹ́ ìkọ́lé tó rọrùn, ó sì dá ìsopọ̀ náà sí ipò tí ó yẹ.
