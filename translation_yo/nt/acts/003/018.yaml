id: ACT.3.18
reference: Acts 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: yo
  text: 'Ṣùgbọ́n ní ọ̀nà yìí ni Ọlọ́run fi mú ohun tí ó ti kéde ṣáájú nípasẹ̀ ẹnu gbogbo àwọn wòlíì[a] ṣẹ: pé Mèsáyà rẹ̀[b] yóò jìyà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “nípasẹ̀ gbogbo àwọn wòlíì.” Ọ̀rọ̀ Gíríìkì náà ní tààràtà, “nípasẹ̀ ẹnu gbogbo àwọn wòlíì.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní, “Kristi rẹ̀”; a túmọ̀ rẹ̀ sí “Mèsáyà rẹ̀” níhìn-ín nítorí pé Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìṣe Ọlọ́run ṣe ìyàtọ̀ sí ohun tí àwọn olùgbọ́ ṣe nínú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìyàtọ̀ yìí.
- source_word: προκατήγγειλεν
  choice: tí ó ti kéde ṣáájú
  rationale: “Kéde” pa agbára ìpolongo ọ̀rọ̀ náà mọ́, “ṣáájú” sì fi ìtumọ̀ pé ó ti sọ ọ́ tẹ́lẹ̀ hàn.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: láti ẹnu gbogbo àwọn wòlíì
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì, “láti ẹnu,” mọ́, ó sì ṣe kedere pé Ọlọ́run ló sọ̀rọ̀ nípasẹ̀ àwọn wòlíì.
- source_word: παθεῖν
  choice: yóò jìyà
  rationale: Ó sọ àkóónú ohun tí a kéde tẹ́lẹ̀ ní Yorùbá àdánidá láìfi ìtumọ̀ dandan kún infinitive náà.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: Mèsáyà rẹ̀
  rationale: Χριστός jẹ́ oyè níhìn-ín; “Mèsáyà” pa àyíká ìrètí ẹni àmì-ọ̀róró Júù mọ́, “rẹ̀” sì dúró fún αὐτοῦ.
- source_word: ἐπλήρωσεν
  choice: mú ... ṣẹ
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ pé Ọlọ́run mú ohun tí a ti kéde tẹ́lẹ̀ dé ìmúṣẹ.
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó fi ọ̀nà tí Ọlọ́run gbà mú àsọtẹ́lẹ̀ náà ṣẹ hàn, ìyẹn nípasẹ̀ ìjìyà Mèsáyà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín, kì í ṣe bí orúkọ lásán; “Mèsáyà” pa ìtumọ̀ ẹni tí Ọlọ́run yàn tí a sì fi àmì-ọ̀róró sí mọ́.
- issue: Agbára παθεῖν nínú àsọtẹ́lẹ̀
  choice: pé Mèsáyà rẹ̀ yóò jìyà
  alternative: pé Mèsáyà rẹ̀ gbọ́dọ̀ jìyà
  rationale: “Yóò jìyà” sọ ohun tí àwọn wòlíì kéde láìfi ìtumọ̀ dandan tí ọ̀rọ̀ Gíríìkì yìí nìkan kò sọ ní kedere kún un.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti jẹ́ ti ẹ̀dá; a pa àwòrán Bíbélì “láti ẹnu” mọ́, pẹ̀lú àlàyé àṣàyàn nínú àlàyé ìsàlẹ̀.
