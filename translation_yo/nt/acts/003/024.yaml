source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: yo
  text: Àti gbogbo àwọn wòlíì, láti Sámúẹ́lì àti àwọn tí wọ́n tẹ̀ lé e[a]—gbogbo àwọn tí wọ́n sọ̀rọ̀—wọ́n sì kéde nípa àwọn ọjọ́ wọ̀nyí[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tó wà ní ìtẹ̀lera lẹ́yìn rẹ̀” tàbí “àwọn tó tẹ̀ lé e.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kéde ní gbangba” tàbí, ní ìtumọ̀ tó túbọ̀ ṣàlàyé àyíká ọ̀rọ̀, “sọ tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn àkókò wọ̀nyí.” Gbólóhùn náà ń tọ́ka sí àkókò ìmúṣẹ tó wà nígbà ọ̀rọ̀ Pétérù.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Bẹ́ẹ̀ sì ni gbogbo àwọn wòlíì
  rationale: “Sì” fi ìsopọ̀ onírẹ̀lẹ̀ tí δέ ní hàn láìsọ ọ́ di àtakò; “gbogbo àwọn wòlíì” sì túmọ̀ πάντες οἱ προφῆται ní tààrà.
- source_word: ἀπὸ Σαμουὴλ
  choice: láti Sámúẹ́lì
  rationale: “Láti” fi Sámúẹ́lì hàn gẹ́gẹ́ bí ìbẹ̀rẹ̀ ìtẹ̀lé àwọn wòlíì, bí ἀπό ṣe túmọ̀ sí níbí.
- source_word: τῶν καθεξῆς
  choice: àwọn tí ó tẹ̀ lé e
  rationale: Ọ̀rọ̀ yìí ṣàfihàn àwọn tó wà lẹ́yìn Sámúẹ́lì ní ìtẹ̀lera; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìtẹ̀lé mọ́.
- source_word: ὅσοι ἐλάλησαν
  choice: gbogbo àwọn tí ó sọ̀rọ̀
  rationale: Ó pa agbára àkópọ̀ ὅσοι mọ́, ó sì mú ἐλάλησαν jáde ní ìtumọ̀ rẹ̀ tó rọrùn, “sọ̀rọ̀.”
- source_word: καὶ κατήγγειλαν
  choice: pẹ̀lú kéde
  rationale: “Kéde” bá ìtumọ̀ ìpìlẹ̀ καταγγέλλω gẹ́gẹ́ bí fífi ohun kan hàn ní gbangba mu; “pẹ̀lú” sì ṣàfihàn καί láìfi ìtumọ̀ àsọtẹ́lẹ̀ kún un.
- source_word: τὰς ἡμέρας ταύτας
  choice: àwọn ọjọ́ wọ̀nyí
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ, ó sì jẹ́ kí àyíká ọ̀rọ̀ Pétérù fúnra rẹ̀ fi hàn pé àkókò ìmúṣẹ tó wà níwájú wọn ni ó ń tọ́ka sí.
theological_decisions:
- issue: Ìtọ́kasí àwọn wòlíì sí àkókò ìmúṣẹ tó wà nígbà ọ̀rọ̀ Pétérù
  choice: àwọn ọjọ́ wọ̀nyí
  alternative: àwọn àkókò wọ̀nyí
  rationale: A pa àwòrán “ọjọ́” inú Gíríìkì mọ́, láìṣàlàyé ìtumọ̀ ìgbà ìgbàlà tàbí ìkẹyìn ju bí ẹsẹ̀ náà fúnra rẹ̀ ti ṣe lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tó yẹ. Àwọn àmì gígùn yà gbólóhùn àfikún “gbogbo àwọn tí ó sọ̀rọ̀” sọ́tọ̀, kí ìṣètò gírámà Gíríìkì má bà a dàrú ní Yorùbá.
