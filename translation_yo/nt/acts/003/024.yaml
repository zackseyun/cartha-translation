revisions:
- from: Bẹ́ẹ̀ sì ni gbogbo àwọn wòlíì láti Sámúẹ́lì àti àwọn tí ó tẹ̀ lé e[a]—gbogbo àwọn tí ó sọ̀rọ̀—pẹ̀lú kéde[b] àwọn ọjọ́ wọ̀nyí[c].
  to: Àti gbogbo àwọn wòlíì, láti Sámúẹ́lì àti àwọn tí wọ́n tẹ̀ lé e[a]—gbogbo àwọn tí wọ́n sọ̀rọ̀—wọ́n sì kéde nípa àwọn ọjọ́ wọ̀nyí[c][b].
  rationale: Àtúnṣe náà ṣètò gbolohun náà kí ó pé ní Yorùbá, nípasẹ̀ fífi ‘wọ́n sì kéde’ ṣe ọ̀rọ̀-ìṣe àkọ́kọ́. ‘Nípa’ jẹ́ kí ohun tí a kéde hàn ní ìtumọ̀ àdánidá, láìfi èrò ìtúmọ̀ mìíràn kún ọ̀rọ̀ Gíríìkì. A tún ṣàtúnṣe àwọn àkọsílẹ̀-ẹsẹ̀ láti jẹ́ olóòtítọ́ sí àwọn àṣàyàn ìtumọ̀ wọn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà wá: gbogbo àwọn wòlíì, Sámúẹ́lì gẹ́gẹ́ bí ìbẹ̀rẹ̀, àwọn tó tẹ̀ lé e, ìsọ̀rọ̀ wọn, àti ìkéde nípa ‘àwọn ọjọ́ wọ̀nyí.’ Ṣùgbọ́n ‘pẹ̀lú kéde’ kò ní ọ̀rọ̀-ìṣe tó parí, nítorí náà ó nílò àtúnṣe gírámà. ‘Kéde nípa àwọn ọjọ́ wọ̀nyí’ jẹ́ ọ̀nà Yorùbá tó hàn gbangba láti sọ pé àwọn ọjọ́ wọ̀nyí ni ohun tí wọ́n kéde.'
  naturalness: 'Àtúnṣe náà ń lo ìṣètò Yorùbá boṣewa tó dáa: kókó-ọrọ náà tún fara hàn pẹ̀lú ‘wọ́n sì kéde,’ àti àfikún ‘gbogbo àwọn tí wọ́n sọ̀rọ̀’ wà ní ipò tó ṣeé lóye. A yí ‘Bẹ́ẹ̀ sì ni’ padà sí ‘Àti,’ nítorí èyí bá ìsopọ̀ onírẹ̀lẹ̀ δέ mu dáadáa láìjẹ́ ọ̀rọ̀ ìfọwọ́sí tó le jù.'
  terminology: ‘Wòlíì,’ ‘Sámúẹ́lì,’ ‘kéde,’ àti ‘àwọn ọjọ́ wọ̀nyí’ jẹ́ àwọn ọ̀rọ̀ boṣewa tó yẹ. Àkọsílẹ̀-ẹsẹ̀ b ti tún un ṣe sí ‘kéde ní gbangba,’ nítorí ‘pàrọ̀ọ̀’ kò yẹ gẹ́gẹ́ bí àṣàyàn fún καταγγέλλω. Àkọsílẹ̀-ẹsẹ̀ a tún yọ àṣàyàn tí ó lè túmọ̀ sí ‘advance from him’ kúrò.
  issues:
  - severity: medium
    issue: ‘pẹ̀lú kéde’ jẹ́ gbolohun aláìpé.
    rationale: Ní Yorùbá, ‘pẹ̀lú’ kò lè di ọ̀rọ̀-ìṣe ‘kéde’ mọ́ níbí láìsí ọ̀rọ̀-ìṣe tó fi hàn pé àwọn wòlíì náà ló ṣe ìkéde náà. ‘wọ́n sì kéde’ mú ìbáṣepọ̀ καὶ κατήγγειλαν hàn ní kedere.
  - severity: medium
    issue: Àkọsílẹ̀-ẹsẹ̀ b ní ‘pàrọ̀ọ̀’ gẹ́gẹ́ bí àṣàyàn.
    rationale: ‘Pàrọ̀ọ̀’ túmọ̀ sí ìjíròrò tàbí ìbánisọ̀rọ̀, kì í sì jẹ́ àṣàyàn tó bá καταγγέλλω (‘kéde/proclaim/announce’) mu.
  - severity: low
    issue: Àṣàyàn kejì nínú àkọsílẹ̀-ẹsẹ̀ a, ‘àwọn tó tẹ̀ síwájú láti ọ̀dọ̀ rẹ̀,’ kò ṣe kedere.
    rationale: Ó lè sọ ìlọsíwájú láti ọ̀dọ̀ ẹni kan, dípò àwọn wòlíì tí wọ́n tẹ̀ lé Sámúẹ́lì ní ìtẹ̀lera.
