id: ACT.3.21
reference: Acts 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: yo
  text: Ẹni tí ó yẹ kí ọ̀run gbà títí di àwọn àkókò ìmúpadàbọ̀sípò ohun gbogbo tí Ọlọ́run ti sọ láti ẹnu àwọn wòlíì mímọ́ rẹ̀ láti ìgbà àtijọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Jésù nínú ẹsẹ tó ṣáájú; “Ẹni tí” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìbáṣepọ̀ gbólóhùn náà hàn.
- source_word: δεῖ ... δέξασθαι
  choice: ó yẹ kí ... gbà
  rationale: Ó pa ìtumọ̀ dandan tàbí ohun tí a yàn kalẹ̀ mọ́, láìfi agbára ìtumọ̀ míì kún un.
- source_word: οὐρανὸν
  choice: ọ̀run
  rationale: A pa ọ̀run mọ́ gẹ́gẹ́ bí olùṣe nínú gbólóhùn, bí Gíríìkì ṣe gbé e kalẹ̀.
- source_word: ἄχρι χρόνων
  choice: títí di àwọn àkókò
  rationale: “Àwọn àkókò” pa ọ̀pọ̀ nọ́ńbà χρόνοι mọ́, “títí di” sì fi ààlà àkókò hàn.
- source_word: ἀποκαταστάσεως πάντων
  choice: ìmúpadàbọ̀sípò ohun gbogbo
  rationale: Ìtumọ̀ yìí gbé èrò ìmú-padà-sí-ipò kalẹ̀, ó sì pa ìwọ̀n gbòòrò πάντων mọ́ láìṣàlàyé ohun tí “gbogbo” kàn ju orísun lọ.
- source_word: διὰ στόματος
  choice: láti ẹnu
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tí ó ṣeé lóye, ó sì túmọ̀ sí pé àwọn wòlíì ni Ọlọ́run fi sọ̀rọ̀.
- source_word: ἀπ’ αἰῶνος
  choice: láti ìgbà àtijọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí a ti ń sọ láti ìgbà pípẹ́ sẹ́yìn.
theological_decisions:
- issue: Ìbáṣepọ̀ ὧν pẹ̀lú πάντων
  choice: “ohun gbogbo tí Ọlọ́run ti sọ”
  alternative: “ohun gbogbo, èyí tí Ọlọ́run ti sọ̀rọ̀ nípa rẹ̀”
  rationale: A pa àìdánilójú gírámà Gíríìkì mọ́ ní ìtumọ̀ tó sún mọ́ fọ́ọ̀mù orísun àti àtúnyẹ̀wò POB, láìfi “nípa” kún un láti yan ìtumọ̀ kan ṣoṣo.
- issue: Ìtúmọ̀ “ìmúpadàbọ̀sípò ohun gbogbo”
  choice: A kò ṣe àlàyé síwájú nípa bí “ohun gbogbo” ṣe gbòòrò tó.
  alternative: Ṣí i túmọ̀ sí ìgbàlà gbogbo ènìyàn tàbí sí ìmúbọ̀sípò gbogbo ìṣẹ̀dá nìkan.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò tú ìwọ̀n gbólóhùn náà yanjú; ìtumọ̀ náà yẹ kí ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìfi ẹ̀kọ́ ẹgbẹ́ kan wọ̀ ọ́.
translation_notes:
  register: Yorùbá àkànṣe pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọlọ́lá, kedere, ó sì bójú mu fún kíkà ní gbangba. A lo “wòlíì” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún προφήτης.
