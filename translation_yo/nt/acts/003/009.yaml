source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: yo
  text: Gbogbo àwọn ènìyàn sì rí i tí ó ń rìn, tí ó sì ń yin Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Àsopọ̀ ìtàn ni καὶ jẹ́ níbí; “sì” so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú láì fi agbára àkókò kún un.
- source_word: εἶδεν
  choice: rí i
  rationale: Ọ̀rọ̀ náà sọ pé àwọn ènìyàn fi ojú rí ọkùnrin tí a mú láradá; “rí i” jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: πᾶς ὁ λαὸς
  choice: Gbogbo àwọn ènìyàn
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí gbogbo àwọn ènìyàn gẹ́gẹ́ bí àwùjọ kan; èyí dá ìtumọ̀ àpapọ̀ náà dúró ní Yorùbá.
- source_word: αὐτὸν
  choice: i
  rationale: Arọ́pò-orúkọ yìí ń tọ́ka sí ọkùnrin tí a mú láradá nínú ọ̀rọ̀ tó ṣáájú.
- source_word: περιπατοῦντα
  choice: tí ó ń rìn
  rationale: Ọ̀rọ̀ àbọ̀ tó wà ní àsìkò ìsinsìnyí ṣàpèjúwe ohun tí wọ́n rí i tí ó ń ṣe; “ń rìn” tẹnumọ́ àmì ìwòsàn náà.
- source_word: καὶ αἰνοῦντα
  choice: tí ó sì ń yin
  rationale: αἰνέω túmọ̀ sí fífi ìyìn fún ẹnì kan, pàápàá ní ọ̀nà ìjọsìn; “ń yin” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ọlọ́run ni ẹni tí ọkùnrin náà ń yìn; “Ọlọ́run” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ àti tó yẹ níbí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì pa ìṣọ̀kan gírámà àwọn ọ̀rọ̀ àbọ̀ méjèèjì mọ́ pẹ̀lú “tí ó ń …, tí ó sì ń …”.
