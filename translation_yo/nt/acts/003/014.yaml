  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin sẹ́ Ẹni Mímọ́ àti Olódodo, ẹ sì béèrè pé kí a fi apànìyàn kan fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní kedere sí i gẹ́gẹ́ bí àyíká ọ̀rọ̀ náà: “kí a tú apànìyàn kan sílẹ̀ fún yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn, “ẹ̀yin” sì pa ìtẹnumọ́ arọ́pò-orúkọ tó wà nínú Gíríìkì mọ́.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: Ẹni Mímọ́ àti Olódodo
  rationale: Àwọn ajẹtífù méjèèjì dúró bí orúkọ oyè fún Jésù; “Ẹni” mú ìtumọ̀ substantival náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἠρνήσασθε
  choice: kọ
  rationale: “Kọ” níbí túmọ̀ sí pé wọ́n ṣàìgbọ́wọ́ fún un, wọ́n sì sẹ́ pé àwọn mọ̀ ọ́n; ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀρνέομαι nínú àyíká yìí.
- source_word: ᾐτήσασθε
  choice: béèrè pé
  rationale: Ó pa ìtumọ̀ ìbéèrè tàbí ìrawọ́ ẹ̀bẹ̀ mọ́, ó sì so mọ́ gbólóhùn “kí a fi ... fún yín” lọ́nà tó bá èdè Yorùbá mu.
- source_word: ἄνδρα φονέα
  choice: apànìyàn kan
  rationale: “Apànìyàn” fúnra rẹ̀ ń tọ́ka sí ènìyàn tó ń pani; fifi “ọkùnrin” kún un yóò le, kò sì ṣe pàtàkì fún Yorùbá àdánidá.
- source_word: χαρισθῆναι ὑμῖν
  choice: kí a fi ... fún yín
  rationale: Ìkọ́lé yìí pa ìtumọ̀ pé kí aláṣẹ fi ẹni náà fún wọn gẹ́gẹ́ bí ohun tí wọ́n béèrè mọ́, láì fi “tú sílẹ̀” sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Agbára oyè Kristi nínú τὸν ἅγιον καὶ δίκαιον
  choice: Ẹni Mímọ́ àti Olódodo
  alternative: ẹni mímọ́ àti olódodo
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ bí àpèjúwe-orúkọ oyè fún Jésù, kì í ṣe bí àwọn ajẹtífù lásán; lílo lẹ́tà ńlá ń fi èyí hàn láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Ìtumọ̀ ọ̀rọ̀ ìdájọ́ nínú χαρισθῆναι
  choice: kí a fi ... fún yín
  alternative: kí a tú ... sílẹ̀ fún yín
  rationale: Ọ̀rọ̀ Gíríìkì gbòòrò ju “tú sílẹ̀” lọ, bí ó tilẹ̀ jẹ́ pé àyíká Bárábà ń tọ́ka sí ìtúsílẹ̀. Ọ̀rọ̀ pàtàkì pa ìtumọ̀ gbòòrò mọ́, àlàyé ìsàlẹ̀ sì sọ ìtumọ̀ àyíká.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. “Ẹni Mímọ́ àti Olódodo” jẹ́ àdánidá gẹ́gẹ́ bí oyè, “apànìyàn kan” sì yẹra fún gbólóhùn líle tí yóò tún ìtumọ̀ ènìyàn ṣe.
