id: ACT.3.10
reference: Acts 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: yo
  text: Wọ́n sì dá a mọ̀ pé òun ni ọkùnrin tí ó máa ń jókòó ní Ẹnubodè Ẹlẹ́wà ti tẹ́ńpìlì[b] láti gba ẹ̀bùn àánú[a]; ìyàlẹ́nu àti ìjìnnìjìnnì sì kún inú wọn nítorí ohun tí ó ṣẹlẹ̀ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì pẹ́kípẹ́kí: ‘ẹni tí ó jókòó láti gba ẹ̀bùn àánú.’ ‘Tí ó máa ń jókòó’ mú kí ó ṣe kedere pé èyí ni ohun tí ọkùnrin náà sábà máa ń ṣe.'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú tẹ́ńpìlì náà (ναός) nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: Wọ́n sì dá a mọ̀
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi hàn pé àwọn ènìyàn náà ń mọ ẹni tí ọkùnrin náà jẹ́; ‘dá a mọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìdánimọ̀ yìí.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘sì’ bá ìṣàn èdè Yorùbá mu láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: οὗτος ἦν
  choice: òun ni
  rationale: ‘Òun ni’ tẹnu mọ́ pé ọkùnrin tí a mú lára dá náà gan-an ni alágbe tí wọ́n ti mọ̀ tẹ́lẹ̀.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: ọkùnrin tí ó máa ń jókòó ... láti gba ẹ̀bùn àánú
  rationale: ‘Máa ń jókòó’ mú ìṣe àṣà rẹ̀ ní àkókò àtijọ́ jáde, ‘ẹ̀bùn àánú’ sì sọ ohun tí a ń fún aláìní ní kedere.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: ní Ẹnubodè Ẹlẹ́wà
  rationale: Ὡραίᾳ jẹ́ orúkọ tàbí àmì ìdánimọ̀ ẹnubodè náà; ‘Ẹnubodè Ẹlẹ́wà’ jẹ́ ìtumọ̀ tó ṣe kedere tí ó sì bójú mu gẹ́gẹ́ bí orúkọ ibi.
- source_word: τοῦ ἱεροῦ
  choice: ti tẹ́ńpìlì
  rationale: ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn lóye; àlàyé ìsàlẹ̀ sọ pé ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
- source_word: ἐπλήσθησαν θάμβους καὶ ἐκστάσεως
  choice: ìyàlẹ́nu àti ìjìnnìjìnnì sì kún inú wọn
  rationale: Gbólóhùn yìí pa àwòrán ‘kíkún’ mọ́, ó sì fi ìyàlẹ́nu líle àti bí ìṣẹ̀lẹ̀ náà ṣe dá wọn lójú rú hàn, láìsọ ἔκστασις di ìrírí ìmísí ẹ̀sìn.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: nítorí ohun tí ó ṣẹlẹ̀ sí i
  rationale: Ìtumọ̀ yìí fi ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ sí ọkùnrin náà, tí ipa rẹ̀ sì ṣì hàn, ṣe ìdí ìyàlẹ́nu àwọn ènìyàn.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbà lónìí tí ó ní ọlá, tí ó sì rọrùn fún òǹkàwé gbogbo. A fi àmì ohùn sí ibi tí ó yẹ. ‘Ẹ̀bùn àánú’ ṣe kedere ju ‘àánú’ nìkan lọ fún ohun tí alágbe ń gbà, ‘ìyàlẹ́nu àti ìjìnnìjìnnì’ sì pa agbára àwọn ọ̀rọ̀ ìmọ̀lára méjèèjì nínú Gíríìkì mọ́.
