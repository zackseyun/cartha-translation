  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: yo
  text: Pétérù àti Jòhánù ń gòkè lọ sí tẹ́ńpìlì ní wákàtí àdúrà[a], ní wákàtí kẹ́sàn-án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn jẹ́ nǹkan bí aago mẹ́ta ọ̀sán ní ìlànà kíkà àkókò òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: kò ṣe àfihàn rẹ̀ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle. Ìṣàn gbólóhùn Yorùbá kò béèrè fún ‘ṣùgbọ́n’ tàbí àsopọ̀ ọ̀tọ̀.
- source_word: ἀνέβαινον
  choice: ń gòkè lọ
  rationale: Àkókò imperfect ń fi ìṣe tí ó ń lọ lọ́wọ́ nígbà àtijọ́ hàn. ‘Ń gòkè lọ’ pa ìrísí ìṣe yìí mọ́, ó sì dá ìtumọ̀ gòkè nínú ἀναβαίνω sí.
- source_word: ἱερόν
  choice: tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere ní àyíká yìí.
- source_word: ἐπὶ τὴν ὥραν
  choice: ní wákàtí
  rationale: Gbólóhùn àsìkò yìí tọ́ka sí àkókò tí a yàn sílẹ̀; ‘ní wákàtí’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τῆς προσευχῆς
  choice: àdúrà
  rationale: Genitive náà dá àpólà ‘wákàtí àdúrà’ sílẹ̀, èyí tí ó ṣe kedere, tí ó sì bá ìṣètò orísun mu.
- source_word: τὴν ἐνάτην
  choice: wákàtí kẹ́sàn-án
  rationale: A pa ìlànà kíkà àkókò Júù inú orísun mọ́ nínú ọ̀rọ̀ pàtàkì; àlàyé nípa àkókò òde òní wà ní àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Èyíinì ni’ mú apposition orísun hàn láì yí ‘wákàtí kẹ́sàn-án’ padà sí àkókò òde òní nínú ọ̀rọ̀ pàtàkì.
