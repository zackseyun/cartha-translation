id: ACT.3.16
reference: Acts 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: yo
  text: Nítorí ìgbàgbọ́ nínú orúkọ rẹ̀[a], orúkọ rẹ̀ gan-an[c] ló sọ ọkùnrin yìí tí ẹ̀yin rí tí ẹ sì mọ̀ di alágbára; ìgbàgbọ́ nípasẹ̀ rẹ̀ sì ti fún un ní ìlera pípé yìí[b] níwájú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé nínú orúkọ rẹ̀.” Ọ̀rọ̀ Gíríìkì pistis lè túmọ̀ sí “ìgbàgbọ́,” “ìgbẹ́kẹ̀lé,” tàbí, ní àwọn àyíká kan, “ìṣòtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìlera tí ó péye” tàbí “ìlera kíkún.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ ọ́ pé, “orúkọ rẹ̀ ló sọ ọ́ di alágbára,” láìlo “gan-an.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: Nítorí ìgbàgbọ́
  rationale: ἐπί pẹ̀lú ọ̀rọ̀-orúkọ inú dative lè tọ́ka sí ìpìlẹ̀ tàbí ìdí. “Nítorí ìgbàgbọ́” sọ ìtumọ̀ ìdí náà ní Yorùbá àdánidá láìsọ ọ́ di ohun èlò nìkan.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: Ní àyíká yìí, πίστις túmọ̀ sí gbígbẹ́kẹ̀lé Jésù nípasẹ̀ orúkọ rẹ̀. “Ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, nígbà tí àlàyé ìsàlẹ̀ fi “ìgbẹ́kẹ̀lé” hàn gẹ́gẹ́ bí òmíràn.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: nínú orúkọ rẹ̀
  rationale: Pẹ̀lú πίστις, genitive yìí ń fi ẹni tàbí ohun tí ìgbàgbọ́ darí sí hàn. “Nínú orúkọ rẹ̀” tún pa lílo “orúkọ” gẹ́gẹ́ bí ohun tí ó dúró fún ẹni àti àṣẹ Jésù mọ́.
- source_word: ἐστερέωσεν
  choice: sọ ... di alágbára
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun dúró ṣinṣin tàbí mímú un lágbára. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì bá ìmúláradá ara ọkùnrin náà mu.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: tí ẹ̀yin rí tí ẹ sì mọ̀
  rationale: Ó pa ìríran àti ìmọ̀ àwọn olùgbọ́ méjèèjì mọ́, ó sì tẹnumọ́ pé ọkùnrin náà jẹ́ ẹni tí wọ́n lè dá mọ̀ ní gbangba.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: orúkọ rẹ̀ gan-an
  rationale: A pa “orúkọ rẹ̀” mọ́ gẹ́gẹ́ bí olùṣe nínú gbólóhùn, “gan-an” sì mú àtúnsọ àti ìtẹnumọ́ Gíríìkì hàn ní Yorùbá tó ṣàn déédé.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: ìgbàgbọ́ nípasẹ̀ rẹ̀
  rationale: Ìtúmọ̀ ṣókí yìí pa àìdánilójú Gíríìkì mọ́ nípa bóyá Jésù ni alárinà, orísun, tàbí ẹni tí ìgbàgbọ́ náà gbà ṣiṣẹ́, láìyan ẹni tí ìgbàgbọ́ náà jẹ́ tirẹ̀.
- source_word: ἔδωκεν αὐτῷ
  choice: ti fún un
  rationale: Fọ́ọ̀mù “ti fún un” fi ìṣe tí ó ti ṣẹlẹ̀ àti àbájáde rẹ̀ tí gbogbo ènìyàn ń rí lọ́wọ́ hàn.
- source_word: ὁλοκληρίαν
  choice: ìlera pípé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ pípé, ara líle, tàbí ìlera kíkún. Nínú àyíká ìwòsàn yìí, “ìlera pípé” ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: níwájú gbogbo yín
  rationale: Ó fi hàn pé ìwòsàn náà ṣẹlẹ̀ ní gbangba níbi tí gbogbo wọn ti lè jẹ́rìí sí i.
theological_decisions:
- issue: Ìtumọ̀ ìgbàgbọ́ nínú orúkọ rẹ̀ àti ìgbàgbọ́ nípasẹ̀ rẹ̀
  choice: A kò sọ ẹni tí ìgbàgbọ́ náà jẹ́ tirẹ̀; a pa ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ Jésù àti gbígbà á kọjá nípasẹ̀ rẹ̀ mọ́.
  alternative: A lè sọ pé ìgbàgbọ́ ọkùnrin tí a mú láradá ni, ìgbàgbọ́ àwọn aposteli ni, tàbí ìgbàgbọ́ tí Jésù fúnni.
  rationale: Gíríìkì kò dárúkọ ẹni tí ó ní ìgbàgbọ́ náà ní kedere. Yíyan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí nínú àyọkà yóò tú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí orísun fi sílẹ̀.
- issue: Agbára ìtumọ̀ “orúkọ” gẹ́gẹ́ bí ohun tí ó dúró fún ẹni
  choice: A pa “orúkọ rẹ̀” mọ́, a sì fi í ṣe olùṣe nínú gbólóhùn.
  alternative: “Jésù fúnra rẹ̀ ló sọ ọkùnrin náà di alágbára” tàbí “agbára orúkọ rẹ̀ ló sọ ọ́ di alágbára.”
  rationale: Ìwé Ìṣe ń lo “orúkọ” lọ́nà pàtàkì láti dúró fún ẹni àti àṣẹ Jésù. Ṣíṣàlàyé rẹ̀ sí “Jésù” tàbí “agbára” nìkan yóò dín ọ̀nà tí Lúùkù gbà sọ ọ́ kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a lo “ẹ̀yin” àti “yín” láti pa ọ̀pọ̀ ènìyàn tí Gíríìkì ń bá sọ̀rọ̀ mọ́.
