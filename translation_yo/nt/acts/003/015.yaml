id: ACT.3.15
reference: Acts 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin pa Olùpilẹ̀ṣẹ̀ ìyè[a], ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú; àwa sì jẹ́ ẹlẹ́rìí rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Olórí ìyè,” “Aṣáájú ìyè,” tàbí “Ẹni tí ó dá ìyè sílẹ̀.” Ọ̀rọ̀ Gíríìkì ἀρχηγός lè túmọ̀ sí ẹni tí ohun kan ti pilẹ̀ láti ọ̀dọ̀ rẹ̀, ẹni tí ó ń ṣáájú, tàbí ẹni tí ó ga jù lọ.
    reason: lexical_alternative
  - marker: b
    text: “Rẹ̀” lè túmọ̀ sí pé àwa jẹ́ ẹlẹ́rìí nípa ẹni tí Ọlọ́run jí dìde, tàbí pé àwa jẹ́ ẹlẹ́rìí sí òtítọ́ àjíǹde rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ní ọ̀rọ̀ yìí, δέ ń fi ìṣe àwọn olùgbọ́—pé wọ́n pa ẹni tí ó jẹ́ orísun ìyè—ṣe ìyàtọ̀ pẹ̀lú ohun tí Ọlọ́run ṣe ní jíjí i dìde. “Ṣùgbọ́n” mú ìyàtọ̀ náà jáde láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ἀρχηγὸν
  choice: Olùpilẹ̀ṣẹ̀
  rationale: 'ἀρχηγός lè tọ́ka sí ẹni tí ó dá ohun kan sílẹ̀ tàbí bẹ̀rẹ̀ rẹ̀, ẹni tí ó ń ṣáájú, tàbí olórí. “Olùpilẹ̀ṣẹ̀” bá àkópọ̀ τῆς ζωῆς mu, ó sì pa ìtakora ọ̀rọ̀ náà mọ́: wọ́n pa ẹni tí ìyè ti ní ìpilẹ̀ṣẹ̀ nínú rẹ̀. Àwọn ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.'
- source_word: τῆς ζωῆς
  choice: ìyè
  rationale: “Ìyè” ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún ζωή, àkópọ̀ “Olùpilẹ̀ṣẹ̀ ìyè” sì pa agbára orúkọ oyè náà mọ́.
- source_word: ἀπεκτείνατε
  choice: ẹ̀yin pa
  rationale: Aoristi náà sọ ìṣe náà ní tààràtà. “Ẹ̀yin pa” ṣe kedere, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς tí ó wà nínú ìparí ọ̀rọ̀-ìṣe Gíríìkì mọ́.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: jí dìde kúrò láàárín àwọn òkú
  rationale: Ìtumọ̀ yìí sọ èdè àjíǹde ní kedere, “láàárín àwọn òkú” sì fi agbára ἐκ νεκρῶν hàn ní Yorùbá àdánidá.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: àwa sì jẹ́ ẹlẹ́rìí rẹ̀
  rationale: “Rẹ̀” lè tọ́ka sí ẹni tí Ọlọ́run jí dìde tàbí sí ìṣẹ̀lẹ̀ àjíǹde náà, nítorí náà ó pa àìdánilójú tó wà nínú οὗ mọ́. “Àwa” tún pa ìtẹnumọ́ ἡμεῖς mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀρχηγός gẹ́gẹ́ bí orúkọ oyè Kristi
  choice: Olùpilẹ̀ṣẹ̀ ìyè
  alternative: Olórí ìyè; Aṣáájú ìyè; Ẹni tí ó dá ìyè sílẹ̀
  rationale: “Olùpilẹ̀ṣẹ̀” mú ìtumọ̀ orísun tàbí ìbẹ̀rẹ̀ jáde, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ aṣáájú àti ipò ọlá. Báyìí, a kò fi ẹ̀kọ́ ìjọ kan pàtó sí ọ̀rọ̀ náà.
- issue: Ohun tí οὗ ń tọ́ka sí nínú gbólóhùn nípa ẹlẹ́rìí
  choice: àwa sì jẹ́ ẹlẹ́rìí rẹ̀
  alternative: àwa sì jẹ́ ẹlẹ́rìí sí àjíǹde yìí; àwa sì jẹ́ ẹlẹ́rìí nípa ẹni náà
  rationale: Arọ́pò-orúkọ Yorùbá “rẹ̀” gba ìtọ́kasí sí ẹni tí ó jí dìde tàbí sí àjíǹde rẹ̀ láàyè. Èyí pa ìtumọ̀ méjèèjì tí ọ̀rọ̀ Gíríìkì lè gbà mọ́ dípò yíyan ọ̀kan ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún. “Olùpilẹ̀ṣẹ̀ ìyè” ní agbára orúkọ oyè láìgbọ́ bí èdè àtijọ́; “ẹ̀yin pa” sì jẹ́ tààràtà gẹ́gẹ́ bí ẹ̀sùn Pétérù. Àmì àárín-gbólóhùn ṣopọ̀ ẹ̀sùn, àjíǹde, àti ẹ̀rí gẹ́gẹ́ bí ìṣàn ọ̀rọ̀ Gíríìkì.
