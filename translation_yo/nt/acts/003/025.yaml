  to: Ẹ̀yin ni ọmọ àwọn wòlíì àti ọmọ májẹ̀mú tí Ọlọ́run dá pẹ̀lú àwọn baba ńlá yín, nígbà tí ó sọ fún Ábúráhámù pé, “Nínú irú-ọmọ[b] rẹ ni gbogbo ìdílé ayé yóò ti rí ìbùkún.”
  rationale: A tún gbolohun náà ṣe kí “ọmọ” lè so mọ́ àwọn wòlíì àti májẹ̀mú lọ́tọ̀ọ̀tọ̀, gẹ́gẹ́ bí Gíríìkì. A sì ṣe ìṣàtúnṣe kékeré sí ìtumọ̀ ìbùkún láti jẹ́ Yorùbá tó rọrùn, nígbà tí a pa agbára “nínú irú-ọmọ rẹ” mọ́. Àmì ìsàlẹ̀ a wà nínú ẹ̀kúnrẹ́rẹ́ àtòjọ àmì ìsàlẹ̀, ṣùgbọ́n kò sí ibi ìtọ́kasí rẹ̀ nínú ọ̀rọ̀ àtúnṣe nítorí “ọmọ” fúnra rẹ̀ ni a lò níbi “àwọn ọmọ.”
