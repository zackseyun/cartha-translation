id: ACT.3.25
reference: Acts 3:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: yo
  text: Ẹ̀yin ni ọmọ àwọn wòlíì àti ọmọ májẹ̀mú tí Ọlọ́run dá pẹ̀lú àwọn baba ńlá yín, nígbà tí ó sọ fún Ábúráhámù pé, “Nínú irú-ọmọ[b] rẹ ni gbogbo ìdílé ayé yóò ti rí ìbùkún.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “irúgbìn.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn àtọmọdọ́mọ Ábúráhámù lápapọ̀, ó sì tún lè ní ìtumọ̀ ẹni kan tó dúró gẹ́gẹ́ bí aṣojú wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: àwọn ọmọ
  rationale: “Ọmọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọmọ àti ajogún; ó lè dúró fún akọ àti abo, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí. Ní àyíká yìí, ó ń tọ́ka sí àwọn tó jẹ́ ajogún tàbí alábàápín nínú ìlérí àwọn wòlíì àti májẹ̀mú, kì í ṣe dandan ọmọ wọn nípa ẹ̀jẹ̀.
- source_word: προφητῶν
  choice: àwọn wòlíì
  rationale: Ìtumọ̀ genitive náà ni a pa mọ́ nínú “ọmọ àwọn wòlíì,” èyí tó túmọ̀ sí àwọn tó dúró nínú ogún ìlérí àwọn wòlíì.
- source_word: διαθήκης
  choice: májẹ̀mú
  rationale: “Májẹ̀mú” ni ọ̀rọ̀ Yorùbá tó bójú mu fún àjọṣe ìlérí tí Ọlọ́run dá pẹ̀lú Ábúráhámù àti àwọn baba ńlá.
- source_word: διέθετο
  choice: dá
  rationale: Gbólóhùn “bá ... dá májẹ̀mú” jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá láti sọ pé Ọlọ́run ṣe tàbí fi májẹ̀mú múlẹ̀.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: bá àwọn baba ńlá yín
  rationale: “Bá ... dá” fi ìbáṣepọ̀ inú dídá májẹ̀mú hàn, “àwọn baba ńlá yín” sì tọ́ka sí àwọn baba ìran wọn.
- source_word: σπέρματί
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” lè ní ìtumọ̀ àpapọ̀ fún àwọn àtọmọdọ́mọ, ó sì tún lè gba ìtumọ̀ ẹni kan tó dúró fún gbogbo wọn; nítorí náà, ó pa ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐνευλογηθήσονται
  choice: a ó ... bù kún
  rationale: 'Ìkọ̀lé aláìdárúkọ ẹni tó ṣe iṣẹ́ náà jẹ́ ọ̀nà Yorùbá àdánidá láti fi passive ọjọ́ iwájú hàn: gbogbo ìdílé ni yóò gba ìbùkún.'
- source_word: πατριαὶ τῆς γῆς
  choice: gbogbo ìdílé ayé
  rationale: “Ìdílé” bo ẹgbẹ́ ìbátan tàbí ẹ̀yà-ìdílé, “ayé” sì fi bí ìlérí náà ṣe kan gbogbo ilẹ̀ ayé hàn.
theological_decisions:
- issue: Ọ̀rọ̀ akọ aṣojú nínú υἱοὶ
  choice: àwọn ọmọ
  alternative: àwọn ọmọkùnrin
  rationale: Bí Gíríìkì ṣe lo ọ̀rọ̀ akọ “ọmọkùnrin,” “ọmọ” ni Yorùbá máa ń lò lọ́nà àdánidá fún ọmọ tàbí ajogún láìfi akọ tàbí abo múlẹ̀. Àlàyé ìsàlẹ̀ fi irisi orísun náà àti agbára ọ̀rọ̀ ajogún májẹ̀mú hàn.
- issue: Ìtumọ̀ ìlérí Ábúráhámù nínú σπέρμα
  choice: irú-ọmọ
  alternative: àtọmọdọ́mọ; irúgbìn
  rationale: “Irú-ọmọ” kò fi tipátipá yàn láàárín gbogbo àwọn àtọmọdọ́mọ Ábúráhámù àti ẹni kan tó lè dúró gẹ́gẹ́ bí aṣojú wọn; ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Agbára ἐν nínú ìlérí
  choice: Nínú irú-ọmọ rẹ ni ... ti
  alternative: Nípasẹ̀ irú-ọmọ rẹ
  rationale: “Nínú ... ni ... ti” tẹ̀lé ἐν pẹ̀lú ìṣọ́ra, ó sì yàgò fún fífi ìtumọ̀ ohun-èlò “nípasẹ̀” nìkan lé e lórí, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè ní agbára bẹ́ẹ̀ nínú àyíká.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọlọ́lá, tó sì ṣe kedere ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Baba ńlá,” “dá májẹ̀mú,” àti ìkọ̀lé “a ó bù kún” jẹ́ èdè òde òní tó rọrùn fún òǹkàwé gbogbogbò láìsọ ìtumọ̀ orísun di pẹlẹbẹ.
