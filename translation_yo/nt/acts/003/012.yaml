id: ACT.3.12
reference: Acts 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pétérù rí i, ó dá àwọn ènìyàn lóhùn pé, “Ẹ̀yin ọkùnrin Ísírẹ́lì, kí nìdí tí ẹ fi ń ṣe kàyéfì sí èyí, tàbí kí nìdí tí ẹ fi ń tẹjú mọ́ wa[a], bí ẹni pé agbára tàbí ìwà-bí-Ọlọ́run tiwa fúnra wa[b] ni a fi mú ọkùnrin yìí rìn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, “kí nìdí tí ẹ fi ń wò wá ṣinṣin?” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí wíwo ẹnì kan tàbí ohun kan láìyí ojú kúrò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwà-ẹ̀sìn” tàbí “ìwà olùfọkànsìn sí Ọlọ́run.” Pétérù ń sẹ́ pé agbára tàbí ìwà ẹ̀mí ti àwọn aposteli fúnra wọn ló mú kí ọkùnrin náà rìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Ṣùgbọ́n nígbà tí Peteru rí èyí
  rationale: A tú participle aorist ἰδών sí ọ̀rọ̀ àsìkò ní Yorùbá àdánidá; “èyí” ń tọ́ka sí ìhùwàpadà àwọn ènìyàn nínú àyíká ẹsẹ̀ náà. δέ jẹ́ ìyípadà ọ̀rọ̀ pẹ̀lú ìtakora díẹ̀.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ó dá àwọn ènìyàn lóhùn
  rationale: Bí kò tilẹ̀ sí ìbéèrè tààrà, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídáhùn sí ohun tó ṣẹlẹ̀; gbólóhùn Yorùbá yìí dá àwòrán ìdáhùn náà sí.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin Israẹli
  rationale: Ó pa ọ̀rọ̀ ìpè akọ ἄνδρες mọ́, ó sì jẹ́ ọ̀nà ọ̀wọ̀ fún sísọ̀rọ̀ sí àwùjọ ní Yorùbá.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: èé ṣe tí ẹ fi ń ṣe kàyéfì sí èyí
  rationale: “Ṣe kàyéfì” jẹ́ Yorùbá àdánidá fún ìyàlẹ́nu tàbí ìyanilẹ́nu tí θαυμάζω ń sọ.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: tàbí tí ẹ fi ń tẹjú mọ́ wa
  rationale: ἀτενίζω ń fi wíwo pẹ̀lú ojú tí a gbé lé ohun kan hàn; “tẹjú mọ́” mú agbára ọ̀rọ̀ náà jáde lọ́nà àdánidá.
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: bí ẹni pé agbára ... tiwa fúnra wa
  rationale: ὡς ń mú èrò tí Peteru kọ̀ sílẹ̀ wọlé, ἰδίᾳ sì tẹnumọ́ ohun tí ó jẹ́ ti àwọn aposteli fúnra wọn.
- source_word: εὐσεβείᾳ
  choice: ìfọkànsìn
  rationale: Ní àyíká yìí, εὐσέβεια ń tọ́ka sí ìfọkànsìn tàbí ìwà olùfọkànsìn sí Ọlọ́run; yíyan ọ̀rọ̀ yìí kò fi kún un pé ìwà rere wọn ló tọ́ sí iṣẹ́ ìyanu náà.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: ni a fi mú kí ọkùnrin yìí máa rìn
  rationale: Ìtumọ̀ causative “mú kí ... máa rìn” sọ àbájáde tí a rò pé àwọn aposteli fa ní Yorùbá tó ṣe kedere; “ọkùnrin yìí” mú antecedent αὐτόν hàn ní kedere.
theological_decisions:
- issue: Bóyá εὐσεβείᾳ yẹ kí ó dà bí ohun tí ó fún àwọn aposteli ní ẹ̀tọ́ sí iṣẹ́ ìyanu
  choice: ìfọkànsìn
  alternative: ìwà-bí-Ọlọ́run; ìfọkànsìn ẹ̀sìn
  rationale: Peteru ń sẹ́ pé agbára tàbí ipò ẹ̀mí tiwọn fúnra wọn ló wo ọkùnrin náà sàn. “Ìfọkànsìn” pa ìtumọ̀ ẹ̀sìn mọ́ láìgbé ẹ̀kọ́ nípa ẹ̀tọ́ tàbí iṣẹ́ rere wọ inú ẹsẹ̀ náà.
- issue: Ọ̀rọ̀ ìpè akọ Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin Israẹli
  alternative: Ẹ̀yin ọmọ Israẹli; Ẹ̀yin ará Israẹli
  rationale: Ìtumọ̀ náà pa akọ tí ἄνδρες sọ ní pàtó mọ́, láìsọ pé gbogbo àwọn tó wà níbẹ̀ jẹ́ ọkùnrin nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀, tó sì ṣe kedere ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Ẹ̀yin” àti ẹ̀yà gbólóhùn ìbéèrè pa ìró ọ̀rọ̀ Peteru sí àwùjọ mọ́.
