source:
  edition: SBLGNT
  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: yo
  text: Nítorí náà, ẹ ronúpìwàdà, kí ẹ sì yípadà, kí a lè pa àwọn ẹ̀ṣẹ̀ yín rẹ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lè nu àwọn ẹ̀ṣẹ̀ yín kúrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανοήσατε
  choice: ẹ ronú pìwà dà
  rationale: Ọ̀rọ̀ àṣẹ aorist yìí ń ké sí ìrònúpìwàdà tó ṣe pàtàkì. Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, ó sì ní agbára ìwà rere àti ìbáṣepọ̀ pẹ̀lú Ọlọ́run ju ‘ẹ yí èrò yín padà’ lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ọ̀rọ̀ tí ó ṣáájú.
- source_word: ἐπιστρέψατε
  choice: ẹ yí padà
  rationale: Ó pa ìtumọ̀ ìpadàbọ̀ mọ́, ó sì yàtọ̀ sí ‘ẹ ronú pìwà dà’ láìfi ‘sí Ọlọ́run’ kún ọ̀rọ̀ Gíríìkì ní tààràtà.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: kí a lè pa ... rẹ́
  rationale: Ìṣètò yìí fi ète tàbí àbájáde hàn ní Yorùbá àdánidá, bí ìkọ̀wé Gíríìkì náà ti ṣe, láìsọ ọ̀nà ẹ̀kọ́ ìgbàlà kan pàtó.
- source_word: ἐξαλειφθῆναι
  choice: pa ... rẹ́
  rationale: Ó mú àwòrán pípa ohun tí a kọ sílẹ̀ rẹ́ tàbí ìmúkúrò rẹ̀ jáde ní kedere; a fi ọ̀nà mìíràn sí àlàyé ìsàlẹ̀.
- source_word: ἁμαρτίας
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì gbòòrò, fún ọ̀rọ̀ ọ̀pọ̀ ἁμαρτίας.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìrònúpìwàdà, yíyípadà, àti ìmúkúrò ẹ̀ṣẹ̀
  choice: 'A túmọ̀ gẹ́gẹ́ bí ète tàbí àbájáde: ‘kí a lè pa àwọn ẹ̀ṣẹ̀ yín rẹ́.’'
  alternative: ‘fún pípa àwọn ẹ̀ṣẹ̀ yín rẹ́’ tàbí lílo ọ̀rọ̀ tó túmọ̀ sí ‘kí a sọ yín di ẹni ìyípadà.’
  rationale: Ẹsẹ náà so ìrònúpìwàdà àti yíyípadà pọ̀ mọ́ ìmúkúrò ẹ̀ṣẹ̀, ṣùgbọ́n kò ṣàlàyé gbogbo ètò ìgbàlà tàbí ọ̀nà pàtó tí ìbáṣepọ̀ náà gbà ń ṣiṣẹ́. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ọ̀pọ̀ ènìyàn ọlọ́wọ̀ ‘ẹ’ gẹ́gẹ́ bí àṣẹ tí a sọ fún àwùjọ.
