  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: yo
  text: Ó sì fò sókè, ó dúró, ó sì rìn; ó sì wọ inú tẹ́ńpìlì pẹ̀lú wọn, ó ń rìn, ó ń fò, ó sì ń yin Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: fò sókè
  rationale: Ó fi ìṣe fífò tí ó gbé e dìde lójijì hàn, ó sì bá àwòrán ọ̀rọ̀ Gíríìkì mu ní èdè Yorùbá àdánidá.
- source_word: περιεπάτει
  choice: bẹ̀rẹ̀ sí í rìn
  rationale: Fọ́ọ̀mù aláìpé Gíríìkì tọ́ka sí ìṣe tí ó ń bẹ̀rẹ̀ sí í tẹ̀ síwájú; yíyàn yìí mú ìtumọ̀ náà jáde ní kedere.
- source_word: τὸ ἱερόν
  choice: tẹ́ńpìlì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí agbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
- source_word: ἁλλόμενος
  choice: ń fò
  rationale: Ó pa àwòrán ìdùnnú àti agbára tuntun ọkùnrin náà mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: αἰνῶν τὸν θεόν
  choice: ń yin Ọlọ́run
  rationale: Ìtumọ̀ tààrà, àdánidá, tí ó sì pa ẹni tí ìyìn náà ń lọ sí mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn pípé níbi tí ó bá yẹ, tí ó níyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A pín gbólóhùn Gíríìkì gígùn náà sí gbólóhùn méjì fún ìṣàn èdè Yorùbá tó dára, láìyí ìtẹ̀síwájú àwọn ìṣe padà.
