id: ACT.3.20
reference: Acts 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: yo
  text: kí àwọn àkókò ìtura lè dé láti iwájú Olúwa, kí ó sì rán Jésù, Mèsáyà tí a ti yàn fún yín[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “tí a yàn sí yín”; tàbí: “tí a ti yàn tẹ́lẹ̀ fún yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: kí ... lè
  rationale: Ọ̀nà yìí fi ète tàbí àbájáde tí ó so mọ́ ìpè ìrònúpìwàdà inú ẹsẹ tó ṣáájú hàn, láì sọ àìdánilójú ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: ἔλθωσιν
  choice: dé
  rationale: “Dé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún dídé àkókò, ó sì bá subjunctive tí “lè” ń ṣàfihàn mu.
- source_word: καιροὶ
  choice: àwọn àkókò
  rationale: Ó pa ìtumọ̀ àkókò tàbí sáà pàtàkì mọ́ láì fi ìtumọ̀ nípa ìṣètò ọjọ́ ìkẹyìn kún un.
- source_word: ἀναψύξεως
  choice: ìtura
  rationale: “Ìtura” lè túmọ̀ sí ìtura, ìdẹ̀rùn, tàbí ìsọ̀tun, ó sì jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: láti iwájú Olúwa
  rationale: “Iwájú” jẹ́ ọ̀nà Yorùbá tó níyì láti sọ nípa ojú tàbí wíwàníhìn-ín ẹni; ó pa àwòrán πρόσωπον mọ́ ju “láti ọ̀dọ̀” lọ.
- source_word: ἀποστείλῃ
  choice: kí ó sì rán
  rationale: Ó pa ìṣọ̀kan gírámà pẹ̀lú gbólóhùn ète àkọ́kọ́ mọ́, “sì” sì so àwọn ìṣe méjèèjì pọ̀ lọ́nà àdánidá.
- source_word: προκεχειρισμένον
  choice: tí a ti yàn
  rationale: Ó sọ ipò ẹni tí a ti yan tàbí pín sí iṣẹ́ kan hàn. “Ti” tún jẹ́ kí ìṣe tí ó ti wáyé ṣáájú hàn láì tẹnumọ́ “tẹ́lẹ̀” ju bó ṣe yẹ lọ.
- source_word: ὑμῖν
  choice: fún yín
  rationale: “Fún yín” fi hàn pé yíyan náà jẹ́ fún àwọn olùgbọ́ tàbí ní àǹfààní wọn; àṣàyàn “sí yín” wà nínú àlàyé ìsàlẹ̀.
- source_word: χριστὸν
  choice: Mèsáyà
  rationale: Níbí, χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a ṣèlérí, kì í ṣe bí apá orúkọ lásán; “Mèsáyà” pa àyíká Júù rẹ̀ mọ́.
- source_word: Ἰησοῦν
  choice: Jesu
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí àwọn òǹkàwé Yorùbá sì mọ̀ dáadáa.
theological_decisions:
- issue: 'Bí a ó ṣe tú χριστὸν: oyè tàbí fọ́ọ̀mù àṣà “Kristi”'
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè Mèsáyà ní àyíká yìí. Yíyan “Mèsáyà” jẹ́ kí ìtumọ̀ oyè náà hàn gbangba láì sọ Jesu di ẹni mìíràn.
- issue: Ìtumọ̀ προκεχειρισμένον ὑμῖν
  choice: tí a ti yàn fún yín
  alternative: tí a yàn sí yín; tí a ti yàn tẹ́lẹ̀ fún yín
  rationale: Àṣàyàn pàtàkì pa ìtumọ̀ yíyan àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn olùgbọ́ mọ́, ṣùgbọ́n kò mú ìṣáájú àkókò náà le ju bí participle Gíríìkì ṣe béèrè lọ. Àwọn ìtumọ̀ míì tí ó ṣeé gbà wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἀπὸ προσώπου τοῦ κυρίου
  choice: láti iwájú Olúwa
  alternative: láti ọ̀dọ̀ Olúwa
  rationale: “Láti iwájú Olúwa” pa ìtumọ̀ wíwàníhìn-ín àti àwòrán “ojú” mọ́; “láti ọ̀dọ̀ Olúwa” dára ní Yorùbá ṣùgbọ́n ó lè sọ àwòrán náà di fífẹ̀ sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún. A yí ètò apposition Gíríìkì padà sí “Jesu, Mèsáyà ...” kí gbólóhùn náà lè ṣàn lọ́nà àdánidá ní Yorùbá, láì yí ìtumọ̀ oyè àti orúkọ padà. A pa àmì kọ́mà ìparí mọ́ nítorí ẹsẹ náà ń bá ọ̀rọ̀ inú ẹsẹ tó tẹ̀ lé e lọ.
