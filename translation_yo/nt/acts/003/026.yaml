id: ACT.3.26
reference: Acts 3:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: yo
  text: Ọlọ́run, lẹ́yìn tí ó gbé Ìránṣẹ́[b] rẹ̀ dìde[a], rán an sí yín ní àkọ́kọ́ láti bù kún yín, nípa yíyí olúkúlùkù yín kúrò nínú àwọn ìwà búburú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘mú Ìránṣẹ́ rẹ̀ dìde.’ Gbólóhùn náà lè túmọ̀ sí pé Ọlọ́run mú un jáde tàbí yàn án fún iṣẹ́, kì í sì í ṣe dandan pé ó jí i dìde kúrò nínú òkú.
    reason: alternative_reading
  - marker: b
    text: Tàbí, ‘ọmọ rẹ̀’; ọ̀rọ̀ Gíríìkì παῖς lè túmọ̀ sí ‘ìránṣẹ́’ tàbí ‘ọmọ,’ ṣùgbọ́n ‘ìránṣẹ́’ lè tọ́ka sí àyíká Ìránṣẹ́ nínú Aísáyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: ó sì kọ́kọ́ rán an sí yín
  rationale: Èyí fi hàn pé àwọn tí Peteru ń bá sọ̀rọ̀ ni Ọlọ́run kọ́kọ́ rán Ìránṣẹ́ náà sí; ó pa ìtumọ̀ àkọ́ṣe nínú πρῶτον mọ́ ní Yorùbá àdánidá.
- source_word: ἀναστήσας
  choice: gbé ... dìde
  rationale: Ọ̀rọ̀ Yorùbá yìí lè tọ́ka sí jíjí dìde kúrò nínú òkú, ó sì tún lè ní ìtumọ̀ mímú ẹni kan dìde tàbí yíyan an fún iṣẹ́ kan; nítorí náà, ó pa àìdánilójú Gíríìkì mọ́.
- source_word: τὸν παῖδα αὐτοῦ
  choice: Ìránṣẹ́ rẹ̀
  rationale: ‘Ìránṣẹ́’ bá àyíká ọ̀rọ̀ Ìránṣẹ́ inú Aísáyà mu ju ‘ọmọ’ lọ, kò sì fi ìtumọ̀ ‘Ọmọ’ tí ọ̀rọ̀ Gíríìkì mìíràn lè sọ kún ẹsẹ yìí.
- source_word: ἀπέστειλεν
  choice: rán an sí yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé Ọlọ́run ni ó rán an sí àwọn olùgbọ́.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: láti bù kún un yín
  rationale: Ìtumọ̀ ète iṣẹ́ tí rírán an ní ni a sọ ní Yorùbá àdánidá.
- source_word: ἐν τῷ ἀποστρέφειν
  choice: nípa yíyí ... padà
  rationale: ‘Nípa’ fi hàn pé yíyí wọn padà ni ọ̀nà tí ìbùkún náà gbà dé bá wọn, láìsọ ọ̀rọ̀ náà di ìpinnu ara ẹni nìkan.
- source_word: ἕκαστον
  choice: olúkúlùkù yín
  rationale: Èyí pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ẹni kọ̀ọ̀kan lára àwọn olùgbọ́ ni a ń tọ́ka sí.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: kúrò nínú àwọn ìwà búburú yín
  rationale: ‘Àwọn ìwà búburú’ jẹ́ Yorùbá tí ó yé ni fún ọ̀pọ̀ nǹkan búburú tí wọ́n ń ṣe tàbí ọ̀nà búburú tí wọ́n ń gbà.
theological_decisions:
- issue: Ìtumọ̀ ἀναστήσας nípa Jésù
  choice: gbé ... dìde, láìsọ ní pàtó pé ó jí i dìde kúrò nínú òkú tàbí pé ó mú un dìde fún iṣẹ́
  alternative: jí i dìde kúrò nínú òkú; tàbí mú un dìde/yàn án
  rationale: Gíríìkì lè jẹ́ kí olùgbọ́ ronú nípa àjíǹde, ṣùgbọ́n ó tún lè sọ nípa bí Ọlọ́run ṣe mú wòlíì tàbí ìránṣẹ́ kan dìde. A kò yanju ìfọ̀rọ̀wérọ̀ yìí ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ Kristi nínú παῖς
  choice: Ìránṣẹ́
  alternative: ọmọ; Ọmọ
  rationale: ‘Ìránṣẹ́’ pa ìsopọ̀ pẹ̀lú Ìránṣẹ́ Aísáyà mọ́, kò sì fi ẹ̀kọ́ nípa jíjẹ́ Ọmọ tí ọ̀rọ̀ yìí kò sọ ní tààrà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A yan ìṣètò gbólóhùn tí ó jẹ́ àdánidá ní Yorùbá, nígbà tí a pa àkọ́ṣe rírán sí àwọn Júù, ipa Ọlọ́run, àti àìdánilójú ‘gbé dìde’ mọ́.
