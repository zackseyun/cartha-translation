id: ACT.3.13
reference: Acts 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: yo
  text: Ọlọ́run Ábúráhámù àti Ísáákì àti Jékọ́bù, Ọlọ́run àwọn baba wa, ti fi ògo fún Jésù, ìránṣẹ́ rẹ̀[a], ẹni tí ẹ̀yin fi lé lọ́wọ́, tí ẹ sì sẹ́ ẹ níwájú Pílátù, nígbà tí Pílátù ti pinnu láti dá a sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù, ọmọ rẹ̀.” Ọ̀rọ̀ Gíríìkì παῖς lè túmọ̀ sí “ọmọ” tàbí “ìránṣẹ́”; a yan “ìránṣẹ́” níbí nítorí ó ṣeé ṣe kí ọ̀rọ̀ náà ń tọ́ka sí Ìránṣẹ́ Olúwa nínú Aísáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Ọlọ́run Ábúráhámù àti Ísáákì àti Jékọ́bù
  rationale: Ó pa àgbékalẹ̀ májẹ̀mú náà mọ́, ó sì tún àsopọ̀ ‘àti’ ṣe gẹ́gẹ́ bí Gíríìkì, láì sọ ọ́ di àtòjọ lásán.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Ọlọ́run àwọn baba wa
  rationale: ‘Àwọn baba wa’ jẹ́ èdè àdúrà àti ìtàn májẹ̀mú tí ó bá πατέρων mu, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ἐδόξασεν
  choice: ti fi ògo fún
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run gbé Jésù ga nínú ògo; ‘ti’ tún fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: Jésù, ìránṣẹ́ rẹ̀
  rationale: ‘Ìránṣẹ́’ bá àfihàn Ìránṣẹ́ Olúwa nínú Aísáyà mu jù, ṣùgbọ́n a pa ìtumọ̀ mìíràn, ‘ọmọ’, mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: παρεδώκατε
  choice: ẹ̀yin fi lé wọn lọ́wọ́
  rationale: Ó sọ fífi Jésù lé ọwọ́ àwọn aláṣẹ lọ́nà Yorùbá tí ó ṣe kedere, láì fi ìtumọ̀ ‘dalẹ̀’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἠρνήσασθε
  choice: ẹ kọ̀ ọ́
  rationale: Nínú àyíká ìdájọ́ yìí, ‘kọ̀ ọ́’ sọ ìkọ̀sílẹ̀ tàbí àìgbà Jésù ní gbangba lọ́nà àdánidá; ó yẹra fún gbolohun tí yóò fi ọ̀rọ̀ tí wọn kò sọ sínú ẹnu wọn.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: níwájú Pílátù
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìtumọ̀ ‘níwájú ojú Pílátù’ nínú àyíká ìdájọ́.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: nígbà tí Pílátù ti pinnu láti dá a sílẹ̀
  rationale: A tú genitive absolute náà sí gbólóhùn àsìkò. Ṣíṣe orúkọ Pílátù ní kedere mú kí ẹni tí ó pinnu má ṣe rú òǹkàwé lójú.
theological_decisions:
- issue: Ìtumọ̀ παῖς fún Jésù
  choice: ìránṣẹ́
  alternative: ọmọ
  rationale: Àyíká ọ̀rọ̀ náà ṣeé ṣe kí ó ń tọ́ka sí Ìránṣẹ́ Olúwa nínú Aísáyà. Síbẹ̀, παῖς lè túmọ̀ sí ‘ọmọ’, nítorí náà a kò pa àṣàyàn yẹn rẹ́, a fi sínú àlàyé ìsàlẹ̀.
- issue: Ìrísí àsìkò ἐδόξασεν
  choice: ti fi ògo fún
  alternative: fi ògo fún
  rationale: Aorist Gíríìkì kò fipá mú perfect, ṣùgbọ́n ‘ti fi ògo fún’ jẹ́ àdánidá nínú àsọyé Yorùbá, ó sì fi ìṣe tí ó ti ṣẹlẹ̀ hàn láì sọ ìlànà ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. A pa àsopọ̀ ‘àti’ tí a tún sọ nínú àgbékalẹ̀ májẹ̀mú mọ́; a sì lo àwọn orúkọ Bíbélì Yorùbá tí a mọ̀ dáadáa.
