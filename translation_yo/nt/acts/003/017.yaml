source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: yo
  text: Nísinsìnyí náà, ẹ̀yin arákùnrin[a], mo mọ̀ pé nínú àìmọ̀ ni ẹ ṣe é, gẹ́gẹ́ bí àwọn olórí yín pẹ̀lú ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ẹ̀yin arákùnrin àti arábìnrin”; ọ̀rọ̀ Gíríìkì náà ní “arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀nà aṣojú láti bá gbogbo àwùjọ, pẹ̀lú àwọn obìnrin, sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Àti nísinsìnyí
  rationale: Ó pa ìsopọ̀ καί àti ìtumọ̀ àkókò νῦν mọ́, ó sì jẹ́ ọ̀nà àdánidá láti yí ọ̀rọ̀ padà láti ẹ̀sùn tó ṣáájú sí ẹ̀bẹ̀ tó tẹ̀ lé.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Èyí túmọ̀ ọ̀rọ̀ ìpè akọ púpọ̀ náà ní tààràtà; nínú àyíká yìí ó tún lè dúró fún gbogbo àwùjọ àwọn ọmọ Ísírẹ́lì tí Pétérù ń bá sọ̀rọ̀.
- source_word: οἶδα
  choice: mo mọ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó wọ́pọ̀, fún ìjẹ́wọ́ Pétérù pé òun ní ìmọ̀ nípa ohun tí wọ́n ṣe.
- source_word: κατὰ ἄγνοιαν
  choice: nínú àìmọ̀
  rationale: Ó fi hàn pé àìní ìmọ̀ ló bá ìṣe wọn lọ, láì sọ pé wọn kò jẹ̀bi rárá tàbí pé àìmọ̀ náà dá wọn láre.
- source_word: ἐπράξατε
  choice: ẹ̀yin ṣe ohun tí ẹ ṣe
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ìṣe wọn lápapọ̀ láì sọ ohun tí wọ́n ṣe ní pàtó nínú ẹsẹ yìí; gbolohun Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìtumọ̀ gbogbogbò náà mọ́.
- source_word: ὥσπερ καὶ
  choice: gẹ́gẹ́ bí ... pẹ̀lú
  rationale: 'Ó pa ìfiwéra àti àfikún mọ́: àwọn ènìyàn ṣe bẹ́ẹ̀ nínú àìmọ̀, àwọn olórí wọn sì ṣe bákan náà.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: àwọn olórí yín
  rationale: “Àwọn olórí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tó ní àṣẹ ìṣèlú àti ẹ̀sìn ní Jerúsálẹ́mù, láì dín ìtumọ̀ náà kù sí ipò kan ṣoṣo.
theological_decisions:
- issue: Bóyá àìmọ̀ wọn yẹ kí a túmọ̀ rẹ̀ lọ́nà tó mú ẹ̀bi wọn kúrò
  choice: nínú àìmọ̀ ni ẹ̀yin ṣe ohun tí ẹ ṣe
  alternative: ẹ̀yin ṣe é láìmọ̀ọ́mọ̀
  rationale: Ìtumọ̀ yìí jẹ́wọ́ pé àìmọ̀ wà nínú ìṣe wọn, ṣùgbọ́n kò tú wọn sílẹ̀ kúrò nínú ẹ̀bi; èyí pa ìforígbárí tó wà pẹ̀lú ìpè sí ìrònúpìwàdà ní ẹsẹ 19 mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. Lílo “ẹ̀yin” mú kí ìpè àti ọ̀rọ̀ ẹni kejì púpọ̀ hàn gbangba.
