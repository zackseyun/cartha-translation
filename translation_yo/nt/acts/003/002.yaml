translation_notes:
  register: 'Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìtumọ̀ náà jẹ́ ti ìbámu tó dára jù lọ: ó pa àwòrán “láti inú ìyá” àti ìṣe àṣà ojoojúmọ́ mọ́, ṣùgbọ́n ó lo ìtòlẹ́sẹẹsẹ gbólóhùn Yorùbá àdánidá. Àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ ní ibi tí wọ́n tọ́ka sí.'
