id: ACT.3.2
reference: Acts 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: yo
  text: Wọ́n sì ń gbé ọkùnrin kan tí ó jẹ́ arọ láti inú ìkùn ìyá rẹ̀. Ojoojúmọ́ ni wọ́n máa ń gbé e kalẹ̀ sí ẹnu-ọ̀nà àgbàlá tẹ́ńpìlì[a] tí à ń pè ní “Ẹlẹ́wà”[b], kí ó lè tọrọ ìrànlọ́wọ́ lọ́wọ́ àwọn tí ń wọ inú àgbàlá tẹ́ńpìlì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan (ναός).
    reason: cultural_note
  - marker: b
    text: Orúkọ ẹnu-ọ̀nà náà túmọ̀ ní tààrà sí “Ẹlẹ́wà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: ọkùnrin kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni kan tí a kò tíì dárúkọ ṣùgbọ́n tí ìtàn náà dá lé lórí hàn.
- source_word: χωλὸς
  choice: tí ó ti yarọ
  rationale: “Yarọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe àpèjúwe àìlera rírìn láìlo ọ̀rọ̀ ẹ̀gàn.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: láti inú ìyá rẹ̀
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì túmọ̀ sí pé ipò náà ti wà láti ìgbà ìbí.
- source_word: ἐβαστάζετο
  choice: wọ́n sì ń gbé ... wá
  rationale: Ìṣe aláìparí nínú èdè Gíríìkì fi ìgbé tí ń lọ lọ́wọ́ tàbí tí a máa ń ṣe hàn; “ń gbé ... wá” jẹ́ àdánidá nínú Yorùbá.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: Ojoojúmọ́ ni wọ́n máa ń gbé e kalẹ̀
  rationale: “Máa ń” sọ ìṣe àṣà tí a ń tún ṣe, “ojoojúmọ́” sì mú ìtumọ̀ καθ’ ἡμέραν jáde kedere.
- source_word: θύραν τοῦ ἱεροῦ
  choice: ẹnu-ọ̀nà àgbàlá tẹ́ńpìlì
  rationale: “Ẹnu-ọ̀nà” bá ibi ìwọlé ńlá mu, “àgbàlá tẹ́ńpìlì” sì yà ἱερόν sí mímọ́ kúrò nínú ibi mímọ́ inú ilé gan-an.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: tí à ń pè ní “Ẹlẹ́wà”
  rationale: Ó pa orúkọ ẹnu-ọ̀nà náà mọ́ gẹ́gẹ́ bí àpèjúwe tí a lò bí orúkọ, ó sì dúró sún mọ́ Gíríìkì.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: kí ó lè tọrọ àánú
  rationale: “Kí ó lè” fi ète hàn; “tọrọ àánú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún bíbẹ̀bẹ̀ fún ohun tí a ń fún aláìní.
- source_word: παρὰ τῶν εἰσπορευομένων
  choice: lọ́wọ́ àwọn tí ń wọ
  rationale: “Lọ́wọ́” jẹ́ àmì orísun tó yẹ fún ohun tí a tọrọ, “tí ń wọ” sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
