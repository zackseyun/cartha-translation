revisions:
- from: Wọ́n sì ń gbé ọkùnrin kan tí ó ti yarọ láti inú ìyá rẹ̀ wá. Ojoojúmọ́ ni wọ́n máa ń gbé e kalẹ̀ sí ẹnu-ọ̀nà àgbàlá tẹ́ńpìlì[a] tí à ń pè ní “Ẹlẹ́wà”[b], kí ó lè tọrọ àánú lọ́wọ́ àwọn tí ń wọ inú àgbàlá tẹ́ńpìlì náà.
  to: Wọ́n sì ń gbé ọkùnrin kan tí ó jẹ́ arọ láti inú ìkùn ìyá rẹ̀. Ojoojúmọ́ ni wọ́n máa ń gbé e kalẹ̀ sí ẹnu-ọ̀nà àgbàlá tẹ́ńpìlì[a] tí à ń pè ní “Ẹlẹ́wà”[b], kí ó lè tọrọ ìrànlọ́wọ́ lọ́wọ́ àwọn tí ń wọ inú àgbàlá tẹ́ńpìlì náà.
  rationale: Àtúnṣe náà ṣe “arọ láti inú ìkùn ìyá rẹ̀” kedere fún χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ, ó sì rọ́pò “àánú” pẹ̀lú “ìrànlọ́wọ́” kí ìtumọ̀ ἐλεημοσύνη—ohun ìfúnni fún aláìní—má bàa ṣòfò. A pa ìṣe aláìparí àti àṣà ojoojúmọ́ mọ́, a kò sì ṣàfikún ìtumọ̀ ẹ̀sìn kankan.
