source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: yo
  text: Nígbà tí ọkùnrin náà sì ń di Peteru àti Johanu mú[a], gbogbo àwọn ènìyàn, tí ẹnu yà gidigidi, sáré péjọ sọ́dọ̀ wọn ní ọ̀nà abẹ́ òrùlé tí a ń pè ní ti Solomoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Nígbà tí ó rọ̀ mọ́ Peteru àti Johanu.” Ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ dídì mú ṣinṣin tàbí rírò mọ́ ẹnì kan.
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀nà abẹ́ òrùlé” yìí jẹ́ ọ̀nà tí òrùlé bò, tí àwọn ọ̀wọ̀n sì tò lẹ́gbẹ̀ẹ́ rẹ̀, láàárín àgbègbè tẹ́ńpìlì. A sì máa ń pè é ní Ọ̀nà Abẹ́ Òrùlé Solomoni.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Bí ọkùnrin náà sì ti di ... mú
  rationale: Ẹ̀ka ọ̀rọ̀ olùṣe inú genitive pẹ̀lú present participle fi hàn pé ìṣe yìí ń lọ ní àkókò kan náà pẹ̀lú ìṣe pàtàkì. “Di ... mú” jẹ́ Yorùbá àdánidá fún mímú ẹni lágbára, láìfi ìmọ̀lára tàbí ète tí Gíríìkì kò sọ kún un.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Peteru àti Johanu
  rationale: Àwọn orúkọ ẹni ni a kọ ní ìrísí tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: συνέδραμεν
  choice: sáré péjọ
  rationale: 'Ó pa méjèèjì mọ́: yíyára sáré àti pípéjọ sí ibi kan.'
- source_word: πᾶς ὁ λαὸς
  choice: gbogbo àwọn ènìyàn
  rationale: Ó tẹ̀lé ìtumọ̀ λαός ní pẹkipẹki, láìdín wọn kù sí ‘ogunlọ́gọ̀’ nìkan.
- source_word: πρὸς αὐτούς
  choice: sọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìlọ sí ibi tí àwọn ènìyàn wà.
- source_word: ἐπὶ τῇ στοᾷ
  choice: ní ọ̀nà abẹ́ òrùlé
  rationale: στοά jẹ́ ọ̀nà fífẹ̀ tí òrùlé bò, tí ọ̀wọ̀n sì sábà máa ń gbé ró; yíyan yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: tí a ń pè ní ti Solomoni
  rationale: Ó pa ìṣe καλουμένῃ àti orúkọ ibi náà mọ́ láìṣe àfikún pé Solomoni fúnra rẹ̀ ló kọ́ ọ.
- source_word: ἔκθαμβοι
  choice: tí ẹnu yà gidigidi
  rationale: Ó fi agbára ìyàlẹ́nu inú ἔκθαμβοι hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A sọ “ọkùnrin náà” dípò àrọ́pò-orúkọ nìkan kí ẹni tí αὐτοῦ ń tọ́ka sí lè ṣe kedere ní Yorùbá. Àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
