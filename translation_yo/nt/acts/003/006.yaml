source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: yo
  text: 'Ṣùgbọ́n Pétérù sọ pé, “Fàdákà àti wúrà kò sí lọ́wọ́ mi, ṣùgbọ́n ohun tí mo ní, èyí ni mo fún ọ: ní orúkọ Jésù Mèsáyà[a] ará Násárétì[b], rìn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí “Mèsáyà,” ìyẹn Ẹni Àmì Òróró.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, ọ̀rọ̀ Gíríìkì náà lè jẹ́ “Násárénì”; ìtumọ̀ rẹ̀ ni ẹni ará Násárétì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: Fàdákà àti wúrà
  rationale: A tú àwọn irin méjèèjì ní tààràtà, kí àkójọpọ̀ ọ̀rọ̀ Gíríìkì tó ń tọ́ka sí owó tàbí ọrọ̀ ayé lè dúró.
- source_word: οὐχ ὑπάρχει μοι
  choice: kò sí lọ́wọ́ mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ènìyàn kò ní ohun kan, ó sì bá ìtumọ̀ gbólóhùn Gíríìkì mu.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ṣùgbọ́n ohun tí mo ní, èyí ni mo fi fún ọ
  rationale: A pa ìtakora àti ìtẹnumọ́ τοῦτο mọ́ nípasẹ̀ “èyí ni,” láì mú kí gbólóhùn náà le fún òǹkàwé Yorùbá.
- source_word: ἐν τῷ ὀνόματι
  choice: ní orúkọ
  rationale: Ìtumọ̀ yìí pa àwòrán ọ̀rọ̀ Gíríìkì àti ìtumọ̀ rẹ̀ nípa àṣẹ tàbí aṣojú mọ́ láì pinnu ọ̀kan ṣoṣo nínú wọn.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” ń fi ìtumọ̀ oyè náà hàn dípò kí a kàn lò ó bí apá orúkọ.
- source_word: τοῦ Ναζωραίου
  choice: ará Násárétì
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ “Násárénì,” ẹni tí ó wá láti Násárétì, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì ní ìrísí oyè.
- source_word: περιπάτει
  choice: máa rìn
  rationale: Àṣẹ yìí tú ìṣe tí a ń béèrè pé kí ó bẹ̀rẹ̀ tàbí kí ó máa bá a lọ ní Yorùbá àdánidá, láì fi “dìde” kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú gbólóhùn orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìkéde ìwòsàn yìí, ọ̀rọ̀ náà ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Ẹni Àmì Òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, nígbà tí àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ agbára nínú ἐν τῷ ὀνόματι
  choice: ní orúkọ
  alternative: nípasẹ̀ àṣẹ
  rationale: A kò sọ ìtumọ̀ náà di “àṣẹ” nìkan, nítorí gbólóhùn Gíríìkì lè ní ìtumọ̀ orúkọ, àṣẹ, àti aṣojú papọ̀.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ; a sì lo “kò sí lọ́wọ́ mi” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún àìní ohun kan. A kò fi “dìde” kún àṣẹ ìkẹyìn, nítorí kò sí nínú ọ̀rọ̀ SBLGNT.
