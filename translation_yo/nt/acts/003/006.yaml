revisions:
- from: 'Ṣùgbọ́n Pétérù sọ pé, “Fàdákà àti wúrà kò sí lọ́wọ́ mi, ṣùgbọ́n ohun tí mo ní, èyí ni mo fi fún ọ: ní orúkọ Jésù Mèsáyà[a], ará Násárétì[b], máa rìn.”'
  to: 'Ṣùgbọ́n Pétérù sọ pé, “Fàdákà àti wúrà kò sí lọ́wọ́ mi, ṣùgbọ́n ohun tí mo ní, èyí ni mo fún ọ: ní orúkọ Jésù Mèsáyà[a] ará Násárétì[b], rìn.”'
  rationale: 'A ṣe àtúnṣe kékeré mẹ́ta fún ìfẹ̀sí tó sunmọ́ Gíríìkì àti Yorùbá: a lo àṣẹ tààrà ‘rìn’; a mú ìfúnni ‘èyí ni mo fún ọ’ wá ní kedere; a sì so gbogbo gbólóhùn orúkọ Jésù pọ̀. Àwọn ìpinnu ìtumọ̀ nípa Mèsáyà, ará Násárétì, àti ‘ní orúkọ’ wà láìyípadà.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa: ó pa ìyàtọ̀ fáàdákà/wúrà mọ́, ó tú οὐχ ὑπάρχει μοι lọ́nà Yorùbá àdánidá, ó sì jẹ́ kí ‘ní orúkọ’ wà ní ìfẹ̀sí rẹ̀ tí kò fi ìtumọ̀ ‘àṣẹ’ di dandan. Síbẹ̀, ‘máa rìn’ kì í ṣe àṣẹ tó fẹsẹ̀ múlẹ̀ bí περιπάτει nínú ọ̀rọ̀ yìí; ‘rìn’ ni àṣẹ tààrà, tí kò fi ìtumọ̀ ìṣe-ìwájú tàbí ìṣe-àṣà kún un.'
  naturalness: ‘Fàdákà àti wúrà kò sí lọ́wọ́ mi’ àti ‘ohun tí mo ní’ jẹ́ Yorùbá àdánidá. A tún ṣe ‘èyí ni mo fi fún ọ’ sí ‘èyí ni mo fún ọ’ kí ìtumọ̀ ‘this I give you’ hàn ní tààrà, kí ‘fi’ má bàa dà bí ohun èlò tàbí ọ̀nà tí a fi ń ṣe nǹkan. A yọ àmì ìdákẹ́jẹ láàárín ‘Mèsáyà’ àti ‘ará Násárétì’ nítorí wọ́n jọ jẹ́ apá kan nínú gbólóhùn orúkọ náà.
  terminology: ‘Mèsáyà’ jẹ́ ìtumọ̀ tó yẹ fún Χριστοῦ gẹ́gẹ́ bí oyè, pẹ̀lú ‘Kristi’ nínú àlàyé ìsàlẹ̀. ‘ará Násárétì’ jẹ́ ìtumọ̀ Yorùbá tó rọrùn fún τοῦ Ναζωραίου, nígbà tí àlàyé ìsàlẹ̀ ń pa aṣàyàn ‘Násárénì’ mọ́. ‘Ẹni Àmì Òróró’ jẹ́ àlàyé tó bá ìtumọ̀ Mèsáyà mu.
  issues:
  - severity: medium
    issue: ‘máa rìn’ fún περιπάτει
    rationale: ‘Máa rìn’ lè ní ìtumọ̀ ọjọ́ iwájú, ìṣe tí ń tẹ̀síwájú, tàbí ìṣe àṣà ní Yorùbá. Gíríìkì náà jẹ́ àṣẹ tààrà; ‘rìn’ ń fi àṣẹ náà hàn láì ṣàfikún apá ìtumọ̀ míì.
  - severity: low
    issue: ‘èyí ni mo fi fún ọ’
    rationale: Ó lè jẹ́ ìlò tí a gbọ́ nínú ọ̀rọ̀, ṣùgbọ́n ‘fi’ lè túmọ̀ sí ‘lo’ tàbí ‘nípasẹ̀.’ ‘Èyí ni mo fún ọ’ kedere síi fún τοῦτό σοι δίδωμι.
  - severity: low
    issue: Àmì ìdákẹ́jẹ lẹ́yìn ‘Mèsáyà’
    rationale: Kò sí ìfọ̀kànsìn pàtàkì nínú Gíríìkì tó yẹ kí ó ya oyè Mèsáyà àti ‘ará Násárétì’ sí ọ̀tọ̀; pípa wọ́n pọ̀ ń jẹ́ kí gbólóhùn orúkọ náà rọrùn síi.
