  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: yo
  text: Pétérù sì tẹjú mọ́ ọn[a] pẹ̀lú Jòhánù, ó sì ní, “Wò wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wo ọ́ fínnífínní.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwò tí a dojúkọ gidigidi, kì í ṣe wíwo lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: tẹjú mọ́ ọn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí wíwo ẹnì kan pẹ̀lú àkíyèsí kíkún, kì í ṣe wíwo lásán. “Tẹjú mọ́ ọn” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi agbára ìtumọ̀ yìí hàn.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ń mú ìtàn tẹ̀ síwájú; “sì” bá iṣẹ́ yìí mu láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: pẹ̀lú Jòhánù
  rationale: σύν pẹ̀lú ọ̀rọ̀ inú dative ń fi ìbákẹ́gbẹ́ hàn. “Pẹ̀lú Jòhánù” sọ pé Jòhánù wà papọ̀ mọ́ Pétérù nínú ìṣẹ̀lẹ̀ náà.
- source_word: εἶπεν
  choice: ó sì ní
  rationale: Ní Yorùbá ìtàn, “ó ní” jẹ́ ọ̀nà àdánidá àti tààrà fún fífi ọ̀rọ̀ tí ẹni kan sọ bẹ̀rẹ̀.
- source_word: Βλέψον
  choice: Wò
  rationale: Àṣẹ aorist náà jẹ́ àṣẹ tààrà sí ẹni kan pé kí ó darí ojú rẹ̀ sí àwọn aposteli; “Wò” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì bá àyíká mu.
- source_word: εἰς ἡμᾶς
  choice: wá
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe wíwo, εἰς ń tọ́ka sí ibi tí ojú darí sí. Yorùbá sọ èyí ní ti ẹ̀dá gẹ́gẹ́ bí “wò wá.”
- source_word: εἰς αὐτόν
  choice: mọ́ ọn
  rationale: εἰς ń samisi ẹni tí Pétérù tẹjú sí; “mọ́ ọn” lẹ́yìn “tẹjú” fi ìdojúkọ náà hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Tẹjú mọ́ ọn” pa agbára ἀτενίσας mọ́, nígbà tí “Wò wá” jẹ́ àṣẹ kúkúrú, tààrà, tí ó sì yàtọ̀ sí ọ̀rọ̀ ìṣe àkọ́kọ́ gẹ́gẹ́ bí Gíríìkì ṣe rí.
