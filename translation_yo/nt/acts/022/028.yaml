revisions:
- from: Ṣùgbọ́n olórí ẹgbẹ́ ọmọ ogun náà dáhùn pé,[a] “Owó púpọ̀ ni mo ná láti gba ẹ̀tọ́ ọmọ ìlú Róòmù yìí.” Ṣùgbọ́n Paulu sọ pé,[b] “Àní, láti ìgbà ìbí mi ni mo ti jẹ́ ọmọ ìlú Róòmù.”
  to: Ṣùgbọ́n olórí ẹgbẹ́ ọmọ ogun náà dáhùn pé, “Mo fi owó púpọ̀ gba ẹ̀tọ́ ọmọ ìlú Róòmù yìí.” Ṣùgbọ́n Paulu sọ pé, “Àní, láti ìgbà ìbí mi ni mo ti jẹ́ ọmọ ìlú Róòmù.”
  rationale: A rọ́pò ọ̀nà tí a gbà sọ ἐκτησάμην pẹ̀lú gbolohun Yorùbá tó pa ìtumọ̀ ‘gba/ní nípa sísan owó’ mọ́ dáadáa. A pa ìtumọ̀ ìbí Paulu, ìtẹnumọ́ ‘àní,’ àti ìtọ́kasí sí ọmọ ìlú Róòmù mọ́; ìtọ́kasí náà wà ní ìbámu pẹ̀lú àyíká tó súnmọ́ ọrọ̀ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:23Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìyàtọ̀ tó wà láàárín rí ẹ̀tọ́ ọmọ ìlú nípa owó àti jíjẹ́ ọmọ ìlú nípasẹ̀ ìbí hàn dáadáa. Síbẹ̀, ‘Owó púpọ̀ ni mo ná láti gba’ lè dín ἐκτησάμην kù sí ‘ná owó’; ‘mo fi owó púpọ̀ gba’ sún mọ́ ìṣe ‘ra/ní fún ara ẹni’ nínú gbolohun Gíríìkì náà, láì sọ ju ohun tí orísun sọ lọ.
  naturalness: Yorùbá náà jẹ́ èdè òde òní, ó sì ní àmì ohùn tó yẹ. Àtúnṣe kékeré náà mú gbolohun olórí ọmọ ogun náà rọrùn sí i, ó sì yọ àmì ìdákẹ́jẹ tí kò pọndandan kúrò lẹ́yìn ‘pé’.
  terminology: ‘Olórí ẹgbẹ́ ọmọ ogun’ jẹ́ ìtumọ̀ tí ó lóye fún χιλίαρχος, bí ó tilẹ̀ jẹ́ pé kò lo oyè Róòmù ‘tribune’. ‘Ẹ̀tọ́ ọmọ ìlú Róòmù’ fi πολιτεία hàn gẹ́gẹ́ bí ipò/ẹ̀tọ́ òfin, kì í ṣe ìṣàkóso ìlú. ‘Àní’ pa ìtẹnumọ́ καί mọ́.
  issues:
  - severity: low
    issue: ‘Owó púpọ̀ ni mo ná láti gba’
    rationale: Ó jẹ́ Yorùbá tó ṣeé lóye, ṣùgbọ́n ‘ná’ lè dojú kọ́ ìnáwó dípò ìgbọ́wọ́/ìní tí ἐκτησάμην ń sọ. ‘Mo fi owó púpọ̀ gba’ dá ìbáṣepọ̀ owó àti ìgbọ́wọ́ náà hàn pẹ̀lú ìfararọ́ tó dára jù.
