source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: yo
  text: Ṣùgbọ́n olórí ẹgbẹ́ ọmọ ogun náà dáhùn pé, “Mo fi owó púpọ̀ gba ẹ̀tọ́ ọmọ ìlú Róòmù yìí.” Ṣùgbọ́n Paulu sọ pé, “Àní, láti ìgbà ìbí mi ni mo ti jẹ́ ọmọ ìlú Róòmù.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: olórí ẹgbẹ́ ọmọ ogun
  rationale: Ó tọ́ka sí ọ̀gá ọmọ ogun Róòmù tó ń darí ẹgbẹ́ ńlá kan; ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá láì fi oyè Róòmù tí kò wọ́pọ̀ sílẹ̀.
- source_word: πολλοῦ κεφαλαίου
  choice: Owó púpọ̀ ni mo ná
  rationale: Gbólóhùn náà túmọ̀ sí iye owó ńlá tí a san; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa èrò iye ńlá mọ́.
- source_word: πολιτείαν
  choice: ẹ̀tọ́ ọmọ ìlú Róòmù
  rationale: Ní àyíká yìí, ó jẹ́ ipò àti ẹ̀tọ́ òfin ọmọ ìlú Róòmù, kì í ṣe ìwà tàbí ìṣàkóso ìlú lásán.
- source_word: ἐκτησάμην
  choice: mo ... gba
  rationale: Ìṣe náà túmọ̀ sí rí ohun kan gbà tàbí ní i fún ara ẹni; ‘gba’ pa ìtumọ̀ gbòòrò náà mọ́, nígbà tí ‘owó ... ná’ fi ọ̀nà tí ó gbà ṣe é hàn.
- source_word: καὶ γεγέννημαι
  choice: Àní, láti ìgbà ìbí mi ni mo ti jẹ́ ọmọ ìlú Róòmù
  rationale: Ó fi ìtẹnumọ́ καί àti abajade ìbí tí ó ṣì dúró hàn, ó sì sọ ohun tí àyíká gbólóhùn fi sílẹ̀—ẹ̀tọ́ ọmọ ìlú—ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó wà láàárín ọ̀rọ̀ olórí ọmọ ogun àti ti Paulu hàn ní ọ̀nà tó rọrùn.
- source_word: ἔφη
  choice: sọ pé
  rationale: Ìtumọ̀ speech verb náà ní ti ẹ̀dá Yorùbá láì fi agbára àsọjáde tí kò sí nínú Gíríìkì kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ọ̀rọ̀ ọlọ́lá tó ṣeé lóye. A tú χιλίαρχος ní ọ̀nà iṣẹ́ rẹ̀ dípò lílo oyè Róòmù àjèjì; a tún sọ ‘Róòmù’ ní gbangba láti mú irú ẹ̀tọ́ ọmọ ìlú tí àyíká ń tọ́ka sí ṣe kedere.
