  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa àpèjúwe mẹ́tẹ̀ẹ̀ta náà mọ́, ó sì tú ἀκούσατε, ἀπολογία, πρὸς ὑμᾶς, àti νυνί sí Yorùbá ní ìbámu pẹ̀lú ìtumọ̀ wọn. “Tí mo ń sọ fún yín nísinsìnyí” ṣàlàyé ìgbẹ́jà Pọ́ọ̀lù tí a darí sí àwọn olùgbọ́, láìfi ìtumọ̀ mìíràn kún un.'
