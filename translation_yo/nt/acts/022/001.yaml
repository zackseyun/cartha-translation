id: ACT.22.1
reference: Acts 22:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: yo
  text: Ẹ̀yin ọkùnrin, ará àti baba, ẹ gbọ́ ọ̀rọ̀ ìgbèjà tí mo ń sọ fún yín nísinsìnyí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ẹ̀yin ọkùnrin
  rationale: Ọ̀rọ̀ àpèjúwe yìí ń bá àwọn ọkùnrin sọ ní tààrà; “ẹ̀yin ọkùnrin” jẹ́ Yorùbá àdánidá tó sì pa ìtọ́kasí akọ mọ́.
- source_word: ἀδελφοὶ
  choice: ará
  rationale: Nínú ọ̀rọ̀ ìkíni gbangba, “ará” fi ìbátan ẹgbẹ́ hàn ní Yorùbá láìjẹ́ kí gbólóhùn náà le; àyíká àti “ẹ̀yin ọkùnrin” ti fi hàn pé àwọn ọkùnrin ni a ń bá sọ.
- source_word: πατέρες
  choice: baba
  rationale: “Baba” pa ìtumọ̀ gangan àti ọ̀wọ̀ fún àwọn àgbà tàbí ẹni ọlá mọ́, láìtúmọ̀ rẹ̀ sí ipò iṣẹ́ bí “àwọn alàgbà.”
- source_word: ἀκούσατέ
  choice: ẹ gbọ́
  rationale: Àṣẹ ẹni kejì ọ̀pọ̀ ni; “ẹ gbọ́” bá ìbéèrè ọ̀wọ̀ nínú àsọyé gbangba mu.
- source_word: μου
  choice: tí mo ń sọ
  rationale: A tú ìbáṣepọ̀ oníhun “ìgbèjà mi” sí ọ̀nà Yorùbá tó ṣe kedere pé Pọ́ọ̀lù fúnra rẹ̀ ni ó ń gbé ọ̀rọ̀ náà kalẹ̀.
- source_word: ἀπολογίας
  choice: ọ̀rọ̀ ìgbèjà
  rationale: Ó túmọ̀ sí ọ̀rọ̀ tí ènìyàn fi dá ara rẹ̀ láre tàbí fi dáhùn ẹ̀sùn, kì í ṣe ìtọrọ̀ àforíjìn.
- source_word: πρὸς ὑμᾶς
  choice: fún yín
  rationale: Ó fi hàn pé àwọn olùgbọ́ ni a darí ọ̀rọ̀ ìgbèjà náà sí; “fún yín” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀.
- source_word: νυνὶ
  choice: nísinsìnyí
  rationale: Ó pa ìtumọ̀ ìjẹ́kánjú àti àkókò ìsinsìnyí mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún àsọyé gbangba. A lo ẹyọ ọ̀rọ̀ “ará” àti “baba” lẹ́yìn “ẹ̀yin ọkùnrin,” gẹ́gẹ́ bí Yorùbá ti sábà ń ṣe nínú àpèjúwe ọ̀pọ̀ ènìyàn.
