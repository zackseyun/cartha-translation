  to: Olórí ẹgbẹ́ ọmọ ogun náà pàṣẹ pé kí wọ́n mú un wọ inú ibùdó àwọn ọmọ ogun[a]. Ó ní kí wọ́n fi pàṣán nà án láti fọ̀rọ̀ wá a lẹ́nu wò[b], kí olórí náà lè mọ ìdí tí àwọn ènìyàn fi ń pariwo lòdì sí i lọ́nà yìí.
