language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: yo
  text: Olórí ẹgbẹ́ ọmọ ogun náà pàṣẹ pé kí wọ́n mú un wọ inú ibùdó àwọn ọmọ ogun[a]. Ó ní kí wọ́n fi pàṣán nà án láti fọ̀rọ̀ wá a lẹ́nu wò[b], kí olórí náà lè mọ ìdí tí àwọn ènìyàn fi ń pariwo lòdì sí i lọ́nà yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àgọ́ àwọn ọmọ ogun” tàbí “ilé olódi.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ibi tí àwọn ọmọ ogun Róòmù wà ní Jerúsálẹ́mù.
    reason: cultural_note
  - marker: b
    text: Tàbí “kí wọ́n fi fífi pàṣán nà án fọ̀rọ̀ wá a lẹ́nu wò.” Ọ̀rọ̀ Gíríìkì so fífọ̀rọ̀ wáni lẹ́nu wò pọ̀ mọ́ ọ̀nà tí wọn yóò gbà ṣe é, ìyẹn fífi pàṣán nà án.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: Olórí ẹgbẹ́ ọmọ ogun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan. Àyànfẹ́ yìí ṣe kedere fún òǹkàwé Yorùbá láìfi oyè Róòmù tí ó lè ṣòro lóye sínú ọ̀rọ̀ náà.
- source_word: παρεμβολή
  choice: ibùdó àwọn ọmọ ogun
  rationale: Ní àyíká Jerúsálẹ́mù yìí, ó ń tọ́ka sí ibi tí àwọn ọmọ ogun Róòmù ń gbé, tí ó tún jẹ́ apá ibi olódi wọn.
- source_word: εἰσάγεσθαι αὐτὸν
  choice: kí wọ́n mú un wọ inú
  rationale: 'Èyí pa ìtumọ̀ aláìṣe ti Gíríìkì mọ́: àwọn ẹlòmíràn ni yóò mú Pọ́ọ̀lù wọ ibẹ̀.'
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: kí wọ́n fi pàṣán nà án láti fọ̀rọ̀ wá a lẹ́nu wò
  rationale: 'Gbólóhùn yìí pa méjèèjì mọ́: fífi pàṣán nà án ni ọ̀nà tí wọn yóò fi fọ̀rọ̀ wá a lẹ́nu wò.'
- source_word: ἐπιγνῷ
  choice: kí òun lè mọ
  rationale: Ó sọ ète olórí ọmọ ogun náà, ìyẹn láti ṣàwárí ohun tó fa ariwo náà.
- source_word: δι’ ἣν αἰτίαν
  choice: ìdí tí
  rationale: Èyí túmọ̀ ìdí tàbí ohun tó fa ìṣẹ̀lẹ̀ náà láìfi èrò pé ẹ̀sùn òfin kan wà kún un.
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: ń pariwo lòdì sí i lọ́nà yìí
  rationale: Àyànfẹ́ yìí fi hàn pé ariwo náà ń lọ lọ́wọ́, ó sì jẹ́ ti ìkọlù sí Pọ́ọ̀lù.
theological_decisions: []
translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A yà àwọn àmì àlàyé ẹsẹ̀ sí ibi tí wọ́n bá ọ̀rọ̀ inú ẹsẹ̀ mu: [a] fún ibùdó ọmọ ogun, [b] fún fífọ̀rọ̀ wáni lẹ́nu wò nípasẹ̀ fífi pàṣán nà án.'
