  to: Ananíà sì jẹ́ ọkùnrin kan, ẹni tí ó jẹ́ olùfọkànsìn ní ìbámu pẹ̀lú Òfin, tí gbogbo àwọn Júù[a] tí ń gbé níbẹ̀ ń jẹ́rìí rere sí i.
