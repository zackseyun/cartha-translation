id: ACT.22.12
reference: Acts 22:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: yo
  text: Ananíà sì jẹ́ ọkùnrin kan, ẹni tí ó jẹ́ olùfọkànsìn ní ìbámu pẹ̀lú Òfin, tí gbogbo àwọn Júù[a] tí ń gbé níbẹ̀ ń jẹ́rìí rere sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará Jùdíà,” bí a bá gbà á gẹ́gẹ́ bí ọ̀rọ̀ tó ń tọ́ka sí àwọn ènìyàn láti ilẹ̀ Jùdíà, dípò àwùjọ ẹlẹ́sin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananíà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń kọ àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: δέ
  choice: sì
  rationale: Ọ̀rọ̀ náà jẹ́ àmì ìyípadà kékeré nínú ìtàn; “sì” mú ìsopọ̀ náà hàn láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: τις ἀνὴρ
  choice: Ọkùnrin kan
  rationale: Èyí pa ìtumọ̀ ọkùnrin kan pàtó tí a kò tíì dárúkọ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εὐλαβής
  choice: olùfọkànsìn
  rationale: Ọ̀rọ̀ yìí fi ẹni tó ní ọ̀wọ̀ fún Ọlọ́run, tó sì ń fi tọkàntọkàn ṣe ẹ̀sìn rẹ̀ hàn ní èdè Yorùbá òde òní.
- source_word: κατὰ τὸν νόμον
  choice: ní ìbámu pẹ̀lú Òfin
  rationale: Èyí pa ìbáṣepọ̀ ìfọkànsìn Ananíà pẹ̀lú Òfin Mósè mọ́ láìsọ ọ́ di ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
- source_word: μαρτυρούμενος
  choice: ń jẹ́rìí rere sí i
  rationale: Passive participle náà túmọ̀ sí pé àwọn ẹlòmíràn ń sọ ẹ̀rí rere nípa Ananíà; gbolohun yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ὑπὸ πάντων
  choice: gbogbo àwọn
  rationale: Èyí pa agbára àkópọ̀ πάντων mọ́.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: àwọn Júù[a] tí ń gbé níbẹ̀
  rationale: κατοικούντων tọ́ka sí àwọn olùgbé ibi tí àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ Damásíkù; “níbẹ̀” mú èyí ṣe kedere. “Àwọn Júù” dá lórí ìdánimọ̀ ẹ̀sìn àti àwùjọ wọn níbí.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ní àyíká ọ̀rọ̀ yìí, àwọn tí a ń tọ́ka sí ni àwùjọ àwọn Júù tó ń gbé ní Damásíkù, kì í ṣe dandan àwọn tó wá láti agbègbè Jùdíà. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ẹ̀yà-ilẹ̀ náà dúró gẹ́gẹ́ bí ohun tó ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A fi àmì ìsàlẹ̀ [a] sí “àwọn Júù,” ibi tí ó bá ọ̀rọ̀ Ἰουδαίων mu. A lo gbólóhùn tó pé ní Yorùbá, bó tilẹ̀ jẹ́ pé Gíríìkì ń tẹ̀ síwájú pẹ̀lú àwọn participle sínú ẹsẹ tó tẹ̀ lé.
