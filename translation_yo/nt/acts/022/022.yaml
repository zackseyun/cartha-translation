source:
  edition: SBLGNT
  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: yo
  text: Wọ́n sì ń fetí sí i títí di ọ̀rọ̀ yìí. Nígbà náà ni wọ́n gbé ohùn wọn sókè, wọ́n ní, “Yọ irú ẹni bẹ́ẹ̀ kúrò láyé![a] Nítorí kò yẹ kí ó wà láàyè.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó túbọ̀ jẹ́ ti ẹ̀dá: “Kúrò láyé pẹlu irú ẹni bẹ́ẹ̀!”'
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé wọ́n ń béèrè ikú rẹ̀; tàbí, “Nítorí kò yẹ kí ó wà láàyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: wọ́n ń fetí sí i
  rationale: Àkókò imperfect fi hàn pé fífetí sílẹ̀ náà ń lọ lọ́wọ́ nígbà tí Pọ́ọ̀lù ń sọ̀rọ̀.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: títí ó fi sọ ọ̀rọ̀ yìí
  rationale: λόγος níhìn-ín tọ́ka sí kókó tàbí gbólóhùn kan nínú ọ̀rọ̀ rẹ̀; ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì fi hàn pé kókó yìí ló ru ìhùwàpadà wọn sókè.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: wọ́n gbé ohùn wọn sókè
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì túmọ̀ sí pé wọ́n ké ní ohùn rara.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ó ṣàgbékalẹ̀ ohun tí wọ́n ń ké jáde ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: Αἶρε
  choice: Mú ... kúrò
  rationale: Nínú ọ̀rọ̀ ìkórìíra yìí, ọ̀rọ̀ náà túmọ̀ sí yíyọ ẹni náà kúrò, kì í ṣe gbígbé e sókè.
- source_word: ἀπὸ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: γῆ lè túmọ̀ sí ilẹ̀ tàbí ayé; níhìn-ín gbólóhùn náà ń béèrè pé kí a yọ Pọ́ọ̀lù kúrò láàárín àwọn alààyè.
- source_word: τὸν τοιοῦτον
  choice: irú ẹni bẹ́ẹ̀
  rationale: Ó pa ẹ̀gàn inú gbólóhùn náà mọ́ láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ aláìlọ́wọ́.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Nítorí kò yẹ kí ó wà láàyè
  rationale: καθῆκεν sọ ohun tí ó yẹ tàbí tó bójú mu; ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa agbára ìdájọ́ wọn mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “wọ́n ń fetí sí i” fún ìṣe tó ń lọ lọ́wọ́, àti “gbé ohùn wọn sókè” láti pa àwòrán Gíríìkì mọ́. Gbogbo àmì ìsàlẹ̀ ìwé wà nínú ọ̀rọ̀ àkọ́kọ́.
