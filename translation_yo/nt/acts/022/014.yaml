id: ACT.22.14
reference: Acts 22:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: yo
  text: Ó sì wí pé, “Ọlọ́run àwọn baba wa ti yàn ọ́[a] láti mọ ìfẹ́ rẹ̀, láti rí Ẹni Olódodo[b], àti láti gbọ́ ohùn kan láti ẹnu rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti pèsè ọ́ fún iṣẹ́ kan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíyan tàbí pípa ènìyàn sípò fún iṣẹ́ kan.
    reason: lexical_alternative
  - marker: b
    text: “Ẹni Olódodo” jẹ́ orúkọ oyè fún Jésù; a tún lè túmọ̀ rẹ̀ sí “Ẹni Títọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: ti yàn ọ́ sílẹ̀
  rationale: Ọ̀rọ̀ yìí sọ nípa yíyan ènìyàn fún iṣẹ́ tàbí ète kan. ‘Yàn ọ́ sílẹ̀’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ yíyan àti yíyan fún iṣẹ́ mọ́, láìfi dandan sọ pé ó ṣẹlẹ̀ ṣáájú àkókò.
- source_word: γνῶναι
  choice: láti mọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àwọn ọ̀rọ̀ ìdí mẹ́ta tó tẹ̀ lé ara wọn mu.
- source_word: θέλημα
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá Bíbélì tó wọ́pọ̀ fún ohun tí Ọlọ́run fẹ́ tàbí pinnu; ó pa fífẹ̀ ìtumọ̀ Gíríìkì mọ́ ju ‘ète’ nìkan lọ.
- source_word: ἰδεῖν
  choice: láti rí
  rationale: ‘Láti rí’ jẹ́ ìtumọ̀ tààrà, tó sì jẹ́ èdè òde òní tó ṣe kedere.
- source_word: τὸν δίκαιον
  choice: Ẹni Olódodo
  rationale: Gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè fún Jésù nínú Ìṣe Àwọn Àpọ́sítélì. ‘Ẹni Olódodo’ pa ìtumọ̀ δικαιος mọ́, ó sì yé àwọn òǹkàwé Yorùbá.
- source_word: ἀκοῦσαι φωνὴν
  choice: láti gbọ́ ohùn kan
  rationale: ‘Ohùn kan’ pa àìní àmì pàtó lórí φωνή mọ́, kò sì sọ ọ́ di ‘ohùn náà’ láìní ẹ̀rí nínú orísun.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: láti ẹnu rẹ̀
  rationale: Ìtumọ̀ yìí pa àwòrán gidi ti Gíríìkì mọ́, ó sì tẹnu mọ́ pé ọ̀rọ̀ náà jáde ní tààrà láti ẹnu ẹni náà.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Ọlọ́run àwọn baba wa
  rationale: Èyí pa ọ̀rọ̀ májẹ̀mú tó so Pọ́ọ̀lù mọ́ ogún Ísírẹ́lì mọ́, ó sì tẹ̀ lé πατέρων ní pẹkipẹki.
theological_decisions:
- issue: Bóyá τὸν δίκαιον jẹ́ orúkọ oyè nípa Kristi tàbí àpèjúwe lásán
  choice: Ẹni Olódodo, gẹ́gẹ́ bí orúkọ oyè tó ń tọ́ka sí Jésù
  alternative: ẹni olódodo; Ẹni Ìdájọ́ Òdodo
  rationale: Nínú Ìṣe 3:14 àti 7:52, gbólóhùn yìí tún ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè nípa Kristi. Lílò lẹ́tà ńlá ń fi iṣẹ́ oyè náà hàn láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Bóyá πατέρων yẹ kí a túmọ̀ sí ‘baba’ tàbí ọ̀rọ̀ gbogbogbò fún àwọn baba ńlá
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa; àwọn àgbà wa ìgbàanì
  rationale: Orísun Gíríìkì lo ọ̀rọ̀ akọ πατέρων, ‘àwọn baba wa’ sì pa ìtumọ̀ àti ìró májẹ̀mú náà mọ́. Ní àyíká yìí, ó ń tọ́ka sí àwọn baba ìgbàanì ti Ísírẹ́lì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa ìṣètò àwọn ọ̀rọ̀ ìdí mẹ́ta—láti mọ, láti rí, àti láti gbọ́—mọ́, bákan náà ni a pa àwòrán ‘láti ẹnu rẹ̀’ mọ́.
