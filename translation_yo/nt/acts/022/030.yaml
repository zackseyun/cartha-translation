id: ACT.22.30
reference: Acts 22:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: yo
  text: Ṣùgbọ́n ní ọjọ́ kejì, nífẹ̀ẹ́ láti mọ̀ dájúdájú ohun tí àwọn Júù[a] fi ń fẹ̀sùn kàn án, ó tú ìdè rẹ̀, ó sì pàṣẹ fún àwọn olórí àlùfáà àti gbogbo ìgbìmọ̀ náà[b] láti péjọ; ó mú Páùlù sọ̀ kalẹ̀, ó sì mú un dúró níwájú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì sọ “àwọn Júù”; nínú àyíká yìí, ó ń tọ́ka sí àwọn tí wọ́n ń fẹ̀sùn kan Páùlù, kì í ṣe gbogbo Júù láìsí ìyàtọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Ìgbìmọ̀” yìí ni Sanhedrini, ìgbìmọ̀ aláṣẹ àwọn Júù ní Jerusalẹmu.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ṣùgbọ́n ní ọjọ́ kejì
  rationale: “Ní ọjọ́ kejì” fi ìtumọ̀ àkókò náà hàn ní Yorùbá àdánidá; “Ṣùgbọ́n” sì ń tọ́ka sí ìyípadà díẹ̀ nínú ìtàn láìsọ ìtakò náà di ohun tí ó lágbára jù.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: nítorí ó fẹ́ mọ̀ dájúdájú
  rationale: Ọ̀rọ̀ olùṣe náà ṣàlàyé ète olórí ọmọ ogun; “mọ̀ dájúdájú” mú èrò ìdánilójú tàbí òtítọ́ tí a lè gbára lé jáde.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: ohun tí àwọn Júù fi ń fẹ̀sùn kàn án
  rationale: Ìtumọ̀ yìí pa ìbéèrè nípa ohun tí ẹ̀sùn náà jẹ́ mọ́, ó sì sọ ọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere. “Àwọn Júù” tẹ̀ lé ọ̀rọ̀ Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi ààlà ọ̀rọ̀ náà nínú àyíká hàn.
- source_word: ἔλυσεν αὐτόν
  choice: ó tú ìdè rẹ̀
  rationale: λύω lè túmọ̀ sí títú ohun tí a fi dè ènìyàn. Ní àyíká yìí, Páùlù ṣì wà lábẹ́ àṣẹ Róòmù, nítorí náà “tú ìdè rẹ̀” yẹra fún fífi hàn pé wọ́n dá a sílẹ̀ kúrò ní àhámọ́ pátápátá.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: ó sì pàṣẹ ... láti péjọ
  rationale: Èyí fi àṣẹ oníṣẹ́ ìjọba tí κελεύω ní hàn, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédéé.
- source_word: τοὺς ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún àwọn aláṣẹ àlùfáà, láìdámọ̀ràn pé ọ̀pọ̀ àlùfáà àgbà ló ń ṣiṣẹ́ ní ipò kan náà.
- source_word: πᾶν τὸ συνέδριον
  choice: gbogbo ìgbìmọ̀ náà
  rationale: “Gbogbo” dúró fún πᾶν, “ìgbìmọ̀” sì túmọ̀ συνέδριον ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye; àlàyé ìsàlẹ̀ ojú ewé dá ìgbìmọ̀ náà mọ̀ sí Sanhedrini.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: Ó mú Páùlù sọ̀ kalẹ̀
  rationale: Ìtumọ̀ náà pa ìṣípò lọ sí ibi tí ó wà ní ìsàlẹ̀ mọ́, ó sì fi hàn pé olórí ọmọ ogun ló mú un lọ.
- source_word: ἔστησεν εἰς αὐτούς
  choice: ó sì gbé e dúró níwájú wọn
  rationale: Èyí fi ìṣe mímú ẹni kan dúró níwájú àwùjọ fún ìgbéjọ́ tàbí ìfọ̀rọ̀wánilẹ́nuwò hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú àyíká ẹ̀sùn yìí
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì sọ “àwọn Júù,” a sì pa ìtumọ̀ gbooro yẹn mọ́ láìfi ìtumọ̀ àyíká rọ́pò rẹ̀ nínú ẹsẹ̀. Síbẹ̀, àyíká ń tọ́ka sí àwọn tí wọ́n ń fẹ̀sùn kan Páùlù, kì í ṣe gbogbo Júù láìsí ìyàtọ̀; àlàyé ìsàlẹ̀ ojú ewé sọ èyí kedere.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “Páùlù” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tí ó bá ìró Yorùbá mu. A pín gbólóhùn gígùn Gíríìkì sí gbólóhùn méjì fún ìtẹ̀síwájú ìtàn tí ó rọrùn láti kà, láìyí ìbáṣepọ̀ àwọn ìṣe náà padà.
