  to: Nígbà náà ni olórí ọmọ ogun náà[a] sún mọ́ ọn, ó sì wí fún un pé, “Sọ fún mi, ará Róòmù[b] ni ìwọ?” Ó sì wí pé, “Bẹ́ẹ̀ ni.”
  rationale: A rọ́pò ọ̀nà ìsọ tí kò rọrùn (“tọ Pọ́ọ̀lù wá”) pẹ̀lú “sún mọ́ ọn” láti fi προσελθών hàn ní Yorùbá àdánidá. A tún rọ́pò “bi í pé” pẹ̀lú “wí fún un pé” láti tẹ̀lé εἶπεν αὐτῷ ní tààràtà, a sì mú ìtẹnumọ́ σὺ hàn pẹ̀lú “ìwọ.” A gbe àmì [b] sí ọ̀rọ̀ tí àlàyé rẹ̀ ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:24Z'
