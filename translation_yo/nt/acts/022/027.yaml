  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ náà gba ìlọsíwájú ìtàn, ìsúnmọ́ olórí ọmọ-ogun náà, ìbéèrè rẹ̀, àti ìdáhùn ìjẹ́rìí kúkúrú náà dáadáa. Ṣùgbọ́n “tọ Pọ́ọ̀lù wá” kì í jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dandan fún προσελθών; “sún mọ́ ọn” fi ìtumọ̀ náà hàn kedere. Bákan náà, εἶπεν yẹ kí a túmọ̀ sí “wí/sọ,” kì í ṣe “bi,” bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ tó tẹ̀lé e.
  naturalness: “Sún mọ́ ọn” àti “ó sì wí fún un pé” jẹ́ ìlànà Yorùbá àpapọ̀ tó rọrùn, tó sì bá ọ̀rọ̀ ìtàn mu. “Ará Róòmù ni ìwọ?” tún mú ìtẹnumọ́ arọ́pò-orúkọ σὺ hàn ní ọ̀nà àdánidá.
  terminology: “Olórí ọmọ ogun” jẹ́ ìtumọ̀ tó ṣe é lóye fún χιλίαρχος, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń ṣètò ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ipò olórí ọmọ ogun Róòmù. “Ará Róòmù” lè dúró fún Ῥωμαῖος, pẹ̀lú àlàyé pé ẹ̀tọ́ ọmọ ìlú Róòmù lábẹ́ òfin ni àyíká ń tọ́ka sí.
