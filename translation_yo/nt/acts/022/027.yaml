  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: yo
  text: Nígbà náà ni olórí ọmọ ogun náà[a] sún mọ́ ọn, ó sì wí fún un pé, “Sọ fún mi, ará Róòmù[b] ni ìwọ?” Ó sì wí pé, “Bẹ́ẹ̀ ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá ọmọ ogun.” Ọ̀rọ̀ Gíríìkì χιλίαρχος ń tọ́ka sí olórí ọmọ ogun Róòmù kan; nínú ìjọba Róòmù, ipò náà sábà máa ń jẹ́ ti olórí ẹgbẹ́ ọmọ ogun kan.
    reason: lexical_alternative
  - marker: b
    text: “Ará Róòmù” níbí túmọ̀ sí ọmọ ìlú Róòmù lábẹ́ òfin, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: tọ Pọ́ọ̀lù wá
  rationale: Ó fi ìṣípò sún mọ́ ẹni tí a ń bá sọ̀rọ̀ hàn ní èdè Yorùbá àdánidá; orúkọ Pọ́ọ̀lù mú ẹni tí ọ̀rọ̀ náà tọ́ka sí ṣe kedere láti inú àyíká.
- source_word: δὲ
  choice: Nígbà náà ni ... ó sì
  rationale: δὲ àkọ́kọ́ ń tẹ ìtàn náà síwájú, èkejì sì ń so ìdáhùn mọ́ ìbéèrè; àwọn àsopọ̀ wọ̀nyí jẹ́ ti ìtàn Yorùbá àdánidá, wọn kò sì fi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: χιλίαρχος
  choice: olórí ọmọ ogun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan; ‘olórí ọmọ ogun’ yé òǹkàwé Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ ìtàn rẹ̀ mọ́.
- source_word: εἶπεν αὐτῷ
  choice: bi í pé
  rationale: Nítorí pé ọ̀rọ̀ tó tẹ̀ lé e jẹ́ ìbéèrè, ‘bi í pé’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ‘ó sọ fún un pé’ láìyí agbára gbólóhùn náà padà.
- source_word: Λέγε μοι
  choice: Sọ fún mi
  rationale: Ó túmọ̀ àṣẹ náà ní tààràtà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: σὺ
  choice: ni ọ́
  rationale: Ìbéèrè oníṣàpẹẹrẹ ‘X ni ọ́?’ mú ẹni tí a ń béèrè lọ́wọ́ hàn gbangba, ó sì lè gbé ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà láìlo gbólóhùn àjèjì.
- source_word: Ῥωμαῖος
  choice: ará Róòmù
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ. ‘Ará Róòmù’ pa ọ̀nà ìsọ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé ipò ọmọ ìlú Róòmù lábẹ́ òfin ni a ń sọ.
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ìdáhùn ìjẹ́rìí kúkúrú, tààrà, tí kò fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
