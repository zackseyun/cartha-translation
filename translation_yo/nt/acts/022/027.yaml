translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìlànà ọ̀rọ̀ tó bá ìtàn òde òní mu, ṣùgbọ́n tó ní iyì. A lo ‘Pọ́ọ̀lù’ dípò arọ́pò-orúkọ nínú apá àkọ́kọ́ láti yẹra fún àìmọ̀ ẹni tí ‘tọ̀ ọ́ wá’ ń tọ́ka sí; èyí wá láti àyíká ẹsẹ̀ náà. Àwọn àmì ìsàlẹ̀ ojú ewé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
