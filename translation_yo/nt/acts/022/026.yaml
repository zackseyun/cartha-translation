id: ACT.22.26
reference: Acts 22:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: yo
  text: Nígbà tí balógun ọgọ́rùn-ún náà gbọ́ èyí, ó lọ sọ fún olórí ẹgbẹ́ ọmọ ogun náà pé, “Kí ni o fẹ́ ṣe?”[a] Nítorí ọkùnrin yìí jẹ́ ọmọ ìlú Róòmù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni o fẹ́rẹ̀ẹ́ ṣe?” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí ẹni kan pinnu láti ṣe tàbí ohun tí ó fẹ́rẹ̀ẹ́ ṣe.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ará Róòmù ni ọkùnrin yìí.” Nínú àyíká yìí, ìtumọ̀ rẹ̀ ni pé ó ní ẹ̀tọ́ ọmọ ìlú Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nígbà tí ... gbọ́ èyí
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist náà fi ohun tí ó kọ́kọ́ ṣẹlẹ̀ hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò mọ́.
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Ó ń tọ́ka sí ọ̀gá ọmọ ogun Róòmù tí ó wà lórí ẹgbẹ́ tí a kà sí ọgọ́rùn-ún; yíyan yìí ṣe kedere ju ọ̀rọ̀ gbogbogbò bí ‘ọ̀gá ọmọ ogun’ lọ.
- source_word: προσελθὼν
  choice: ó lọ sọ fún
  rationale: Alábápín náà fi ìlọsíwájú sọ́dọ̀ ọ̀gá rẹ̀ hàn; a so ó mọ́ ọ̀rọ̀-ìṣe àkọ́kọ́ ní Yorùbá àdánidá.
- source_word: χιλιάρχῳ
  choice: olórí ẹgbẹ́ ọmọ ogun
  rationale: Χιλίαρχος jẹ́ ọ̀gá ọmọ ogun Róòmù onípò gíga tí ó ń darí ẹgbẹ́ ọmọ ogun; yíyan àlàyé yìí ṣeé lóye fún òǹkàwé òde òní láì lo ọ̀rọ̀ àyálò tí kò wọ́pọ̀.
- source_word: ἀπήγγειλεν
  choice: sọ fún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíṣẹ́ tàbí ròyìn ìsọfúnni; ‘sọ fún’ bá ìṣàn ìtàn Yorùbá mu, ẹni tí a sọ fún sì hàn gbangba.
- source_word: λέγων
  choice: pé
  rationale: Yorùbá máa ń lo ‘pé’ láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni kan sọ; èyí mú ìsopọ̀ alábápín náà jáde lọ́nà àdánidá.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Kí ni o fẹ́ ṣe?
  rationale: Μέλλω pẹ̀lú infinitive lè tọ́ka sí ète tàbí ohun tí ó fẹ́rẹ̀ẹ́ ṣẹlẹ̀. ‘Fẹ́ ṣe’ jẹ́ Yorùbá tó wọ́pọ̀, ó sì fi ète hàn láì sọ pé ìṣe náà ti bẹ̀rẹ̀.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Nítorí ọkùnrin yìí
  rationale: Ἄνθρωπος ń tọ́ka sí ọkùnrin pàtó nínú àyíká yìí, γάρ sì fúnni ní ìdí ìkìlọ̀ náà.
- source_word: Ῥωμαῖός ἐστιν
  choice: jẹ́ ọmọ ìlú Róòmù
  rationale: Nínú àyíká òfin yìí, Ῥωμαῖος ń sọ ipò ẹni tó ní ẹ̀tọ́ ọmọ ìlú Róòmù, kì í ṣe ibi tí ó ń gbé tàbí ẹ̀yà rẹ̀ nìkan.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Balógun ọ̀rún’ pa ipò ἑκατοντάρχης mọ́, nígbà tí ‘olórí ẹgbẹ́ ọmọ ogun’ yà á sọ́tọ̀ kúrò lọ́dọ̀ ọ̀gá rẹ̀ onípò gíga. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti jẹ́ àdánidá.
