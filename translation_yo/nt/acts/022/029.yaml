source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: yo
  text: Nítorí náà, lẹ́sẹ̀kẹsẹ̀ ni àwọn tí wọ́n fẹ́ fọ̀rọ̀ wá a lẹ́nu wò[b] yà kúrò lọ́dọ̀ rẹ̀; olórí ẹgbẹ̀rún ọmọ ogun náà[a] sì bẹ̀rù nígbà tí ó mọ̀ pé ọmọ ìlú Róòmù ni Paulu, àti pé òun ti dè é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, orúkọ ipò náà túmọ̀ sí ọ̀gá ọmọ ogun Róòmù kan tí ipò rẹ̀ ní ìbámu pẹ̀lú àṣẹ lórí nǹkan bí ẹgbẹ̀rún ọmọ ogun, bí ó tilẹ̀ jẹ́ pé iye àwọn tó wà lábẹ́ rẹ̀ lè yàtọ̀.
    reason: cultural_note
  - marker: b
    text: Tàbí, ní kíkún sí i gẹ́gẹ́ bí ẹsẹ tó ṣáájú ṣe fi hàn, “àwọn tí wọ́n fẹ́ fọ̀rọ̀ wá a lẹ́nu wò nípa fífi pàṣán lù ú.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àyẹ̀wò ìjọba, ẹsẹ tó ṣáájú sì sọ ọ̀nà tí wọ́n fẹ́ gbà ṣe é.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Nítorí náà, lẹ́sẹ̀kẹsẹ̀
  rationale: “Nítorí náà” fi ìsopọ̀ àbájáde sí ẹsẹ tó ṣáájú hàn, “lẹ́sẹ̀kẹsẹ̀” sì mú ìyára ìhùwàpadà náà jáde.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: fi í sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n yà kúrò lọ́dọ̀ rẹ̀, wọ́n sì dá ohun tí wọ́n fẹ́ ṣe dúró.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: àwọn tí wọ́n fẹ́ bẹ̀rẹ̀ sí í fọ̀rọ̀ wá a lẹ́nu wò
  rationale: Ó pa èrò ohun tí wọ́n fẹ́ ṣe láìpẹ́ mọ́, ó sì tú ìtumọ̀ àyẹ̀wò ìjọba tàbí ìfọ̀rọ̀wánilẹ́nuwò jáde, láìfi lílù pàṣán sínú ọ̀rọ̀ pàtàkì níbi tí Gíríìkì kò ti sọ ọ́ ní tààrà.
- source_word: χιλίαρχος
  choice: olórí ẹgbẹ̀ ọmọ ogun
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan; ìtumọ̀ iṣẹ́ rẹ̀ yìí ṣe kedere sí òǹkàwé Yorùbá ju lílo orúkọ ipò Róòmù tí kò wọ́pọ̀ lọ.
- source_word: ἐφοβήθη
  choice: bẹ̀rù
  rationale: Ó sọ ìbẹ̀rù tí ó dé bá ọ̀gá náà nígbà tí ó mọ ipò Paulu.
- source_word: ἐπιγνοὺς
  choice: nígbà tí ó mọ̀
  rationale: Ó mú ìtumọ̀ pé òye náà ṣẹ̀ṣẹ̀ yé e, pẹ̀lú ìbáṣepọ̀ àkókò àti ìdí.
- source_word: Ῥωμαῖός ἐστιν
  choice: ará Róòmù ni Paulu
  rationale: Ní àyíká yìí, “ará Róòmù” tọ́ka sí ẹni tó ní ẹ̀tọ́ ọmọ ìlú Róòmù; fífi “Paulu” hàn mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: òun ti dè é
  rationale: Ó pa ìṣe tí a ti parí ṣùgbọ́n tí àbájáde rẹ̀ ṣì wà mọ́; “òun” tún tẹnumọ́ pé ọ̀gá náà fúnra rẹ̀ ló jẹ́ ẹni tó ní ojúṣe.
