translation_notes:
  register: Yorùbá boṣewa, olóhùn, ọ̀wọ̀, àti èdè ìsinsìnyí ni a lò. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn Gíríìkì, ṣùgbọ́n a ṣe àtúnṣe díẹ̀ fún àdánidá Yorùbá. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì, wọ́n sì bá àlàyé ìsàlẹ̀ mu.
