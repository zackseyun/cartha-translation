id: ACT.22.10
reference: Acts 22:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: yo
  text: Nígbà náà ni mo wí pé, “Kí ni kí n ṣe[a], Olúwa?” Olúwa sì wí fún mi pé, “Dìde, kí o sì lọ sí Damásíkù; níbẹ̀ ni a ó sọ fún ọ nípa gbogbo ohun tí a ti yàn kalẹ̀ fún ọ láti ṣe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni èmi yóò ṣe, Olúwa?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo ohun tí a ti fi lé ọ lọ́wọ́ láti ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Kí ni kí n ṣe
  rationale: Ìbéèrè oníṣubúńkítífù yìí ń béèrè ìtọ́sọ́nà nípa ohun tí ó yẹ kí ẹni náà ṣe lẹ́yìn náà. Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹnu lásán, ó sì pa ìtumọ̀ ìtọ́sọ́nà tàbí ojúṣe mọ́.
- source_word: κύριε / ὁ ... κύριος
  choice: Olúwa / Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ ní àyíká ìtàn ọ̀nà Damásíkù, níbi tí Pọ́ọ̀lù ti ń bá Jésù sọ̀rọ̀, tí ìtàn náà sì fi orúkọ oyè náà dá a mọ̀.
- source_word: Ἀναστὰς
  choice: Dìde
  rationale: Pátísípù náà ní agbára àṣẹ, ó sì ṣáájú àṣẹ láti lọ. “Dìde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtẹ̀síwájú ìṣe náà mu.
- source_word: πορεύου εἰς Δαμασκόν
  choice: kí o sì lọ sí Damásíkù
  rationale: Èyí sọ ìrìn sí inú ìlú náà ní Yorùbá àdánidá; “sí” lè gba ìtumọ̀ ìlọ sí ibi kan láìsí àfikún tí kò pọndandan.
- source_word: κἀκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ yìí tú καὶ ἐκεῖ sí Yorùbá ṣókí, ó sì pa ibi tí ìṣẹ̀lẹ̀ tó tẹ̀ lé yóò ti ṣẹlẹ̀ mọ́.
- source_word: λαληθήσεται
  choice: a ó ti sọ fún ọ
  rationale: Fọ́ọ̀mù ọjọ́ iwájú aláìṣe náà kò dárúkọ ẹni tí yóò sọ̀rọ̀. Ìtumọ̀ aláìdárúkọ “a ó ... sọ fún ọ” jẹ́ ti Yorùbá àdánidá, ó sì pa àìdárúkọ olùsọ̀rọ̀ mọ́.
- source_word: περὶ πάντων
  choice: nípa gbogbo ohun
  rationale: “Nípa” fi àkóónú ohun tí a ó sọ hàn, “gbogbo ohun” sì gbé ìwọ̀n πάντων jáde.
- source_word: τέτακταί σοι ποιῆσαι
  choice: tí a ti yàn kalẹ̀ fún ọ láti ṣe
  rationale: '“A ti yàn kalẹ̀” fi pípé aláìṣe hàn: a ti ṣètò àwọn ohun náà tẹ́lẹ̀, ìpinnu náà sì ṣì dúró. Ó pa èrò ìyàn tàbí ìfìṣètò Ọlọ́run mọ́ láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.'
theological_decisions:
- issue: Agbára τέτακταί nípa ìtọ́sọ́nà Ọlọ́run àti iṣẹ́ tí a yàn fún Pọ́ọ̀lù
  choice: a ti yàn kalẹ̀ fún ọ láti ṣe
  alternative: a ti fi lé ọ lọ́wọ́ láti ṣe
  rationale: Àṣàyàn náà fi hàn pé àwọn iṣẹ́ Pọ́ọ̀lù ti wà lábẹ́ ìṣètò tàbí ìyàn kan, ṣùgbọ́n kò túmọ̀ rẹ̀ sí àṣẹ líle tàbí ẹ̀kọ́ nípa àyànmọ́ ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ àdánidá ṣùgbọ́n ọlọ́lá. “A ó ... sọ” àti “a ti yàn kalẹ̀” pa ìṣe aláìdárúkọ inú Gíríìkì mọ́, wọn kò sì dárúkọ olùṣe níbi tí orísun kò ti ṣe bẹ́ẹ̀.
