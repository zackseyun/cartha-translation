id: ACT.22.8
reference: Acts 22:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: yo
  text: Èmi sì dáhùn pé, “Ta ni ìwọ, Olúwa[a]?” Ó sì wí fún mi pé, “Èmi ni Jésù ará Násárẹ́tì[b], ẹni tí ìwọ ń ṣe inúnibíni sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ fún ẹni tí a ń bá sọ̀rọ̀, ó sì tún lè jẹ́ akọ́lé “Olúwa.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “Jésù ti Násárẹ́tì” tàbí “Jésù Násárénì.” Ọ̀rọ̀ Gíríìkì náà jẹ́ àpèlé fún Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ẹni náà dá èsì sí ohun tí a sọ tàbí béèrè; “dáhùn” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá aorist náà mu.
- source_word: Τίς εἶ
  choice: Ta ni ìwọ?
  rationale: Èyí jẹ́ ìbéèrè tààrà nípa ẹni tí olùsọ̀rọ̀ náà jẹ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: κύριε
  choice: Olúwa
  rationale: “Olúwa” pa akọ́lé κύριος mọ́, ṣùgbọ́n nítorí pé ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ bí “ọ̀gá,” a fi ìtumọ̀ kejì náà sínú àlàyé ìsàlẹ̀.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Ó sì wí fún mi
  rationale: “Wí fún mi” sọ λέγω πρὸς ἐμέ ní Yorùbá tó bójú mu, “sì” sì ń gbé ipa àsopọ̀ τε jáde.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Èyí ni ọ̀nà Yorùbá tààrà fún ìdánimọ̀ ẹni, ó sì pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: A lo ọ̀nà ìkọ orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ὁ Ναζωραῖος
  choice: ará Násárẹ́tì
  rationale: “Ará Násárẹ́tì” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ó jẹ́ ti Násárẹ́tì, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àpèlé “Nazarene/Nazorean.”
- source_word: ὃν σὺ διώκεις
  choice: ẹni tí ìwọ ń ṣe inúnibíni sí
  rationale: Ní àyíká yìí διώκω túmọ̀ sí lílépa ẹni pẹ̀lú ìkórìíra àti fífi ìyà jẹ ẹ́; àmì “ń” pa ìṣe tí ń lọ lọ́wọ́ mọ́, “ìwọ” sì gbé ìtẹnumọ́ σὺ jáde.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ Sáùlù
  choice: Olúwa
  alternative: ọ̀gá
  rationale: A pa “Olúwa” mọ́ gẹ́gẹ́ bí akọ́lé κύριος àti nítorí àyíká ìtàn náà, ṣùgbọ́n Sáùlù kò tíì mọ ẹni tó ń bá a sọ̀rọ̀ ní kíkún; nítorí náà “ọ̀gá” gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ ṣì ṣeé ṣe, a sì pa àìdánilójú náà mọ́ nínú àlàyé.
translation_notes:
  register: A lo Yorùbá àkókò-òde tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ó sì wí” ní ìrísí Bíbélì díẹ̀ ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé lónìí; “ṣe inúnibíni sí” jẹ́ gbólóhùn tó ṣe kedere fún ìlépa ọ̀tá àti ìyà tí διώκω ń tọ́ka sí.
