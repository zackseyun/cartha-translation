  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ‘Ọ̀nà yìí,’ ìṣe inúnibíni, àti ìwọ̀n ‘títí dé ikú’ hàn dáadáa. Ṣùgbọ́n ‘ẹ̀wọ̀n’ nínú Yorùbá sábà ń túmọ̀ sí ṣẹ́ǹsì/ìdè (chains), kì í ṣe φυλακαί, ìyẹn àwọn ilé tí a ti ń dá ènìyàn mọ́. Àtúnṣe náà tún ń jẹ́ kí ‘dè’ àti ‘fi ... sí’ ṣiṣẹ́ gẹ́gẹ́ bí àwọn participle tí ń ṣàlàyé ọ̀nà inúnibíni náà, dípò kí ‘mo ń’ dà bí ìṣe tí ń lọ lọ́wọ́ ní àkókò ìsọ̀rọ̀.
  naturalness: ‘Àwọn ilé-ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó mọ́, tó sì dájú fún prisons. Ìkọ́ ‘nípa dídè ... àti fífi wọ́n sínú ...’ jẹ́ adayeba, ó sì bá ìsopọ̀ gírámà Gíríìkì mu.
  terminology: A pa ‘Ọ̀nà’ mọ́ gẹ́gẹ́ bí àmì-orúkọ fún ẹgbẹ́ àwọn ọmọlẹ́yìn Jésù nínú Ìṣe. ‘Inúnibíni,’ ‘dídè,’ àti ‘àwọn ilé-ẹ̀wọ̀n’ mú ἐδίωξα, δεσμεύων, àti φυλακάς hàn láìfi ìtumọ̀ ẹ̀sìn tàbí ìtumọ̀ tó ju ọ̀rọ̀ náà lọ kún un.
