    rationale: Àwọn participle náà ń ṣàpèjúwe bí Pọ́ọ̀lù ṣe ṣe inúnibíni ní ìgbà àtijọ́. ‘Nípa dídè ... àti fífi ...’ pa ìbáṣepọ̀ yẹn mọ́ ní Yorùbá.
