id: ACT.22.4
reference: Acts 22:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: yo
  text: Mo ṣe inúnibíni sí Ọ̀nà yìí[a] títí dé ikú[b], nípa dídè ọkùnrin àti obìnrin, àti fífi wọ́n sínú àwọn ilé-ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà yìí” tàbí “ẹgbẹ́ yìí.” Gíríìkì sọ ní tààrà pé “Ọ̀nà yìí,” ṣùgbọ́n nínú ìwé Ìṣe, ọ̀rọ̀ náà sábà máa ń jẹ́ orúkọ tí a fi ń pe ìgbàgbọ́ àti ẹgbẹ́ àwọn Kristẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “dé ibi ikú.” Gbólóhùn náà fi bí inúnibíni náà ṣe le tó hàn, ṣùgbọ́n kò fi hàn ní pàtó pé Pọ́ọ̀lù fúnra rẹ̀ pa àwọn tí ó ṣe inúnibíni sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: Ọ̀nà yìí
  rationale: Ọ̀nà ni ìtumọ̀ gangan ὁδός, ó sì tún ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tí ìwé Ìṣe ń fi pe ẹgbẹ́ àwọn ọmọlẹ́yìn Kristi. Lílo lẹ́tà ńlá fún Ọ̀nà ń tọ́ka sí ìtumọ̀ yẹn láìfi ọ̀rọ̀ ẹ̀sìn mìíràn kún un.
- source_word: ἐδίωξα
  choice: Mo ṣe inúnibíni sí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, διώκω túmọ̀ sí lílépa àwọn ènìyàn pẹ̀lú ìkórìíra àti fífi ìyà jẹ wọ́n; ‘ṣe inúnibíni sí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ mu.
- source_word: ἄχρι θανάτου
  choice: títí dé ikú
  rationale: 'Ó pa agbára gbólóhùn Gíríìkì mọ́, ó sì ṣì jẹ́ kí àìdánilójú rẹ̀ wà: ó lè tọ́ka sí bí inúnibíni náà ṣe le tó tàbí sí àbájáde ikú, láìsọ pé Pọ́ọ̀lù fúnra rẹ̀ pa gbogbo wọn.'
- source_word: δεσμεύων
  choice: mo ń dè
  rationale: Èyí pa àwòrán gangan ti dídè ènìyàn mọ́ dípò fífi ìtumọ̀ ìmúṣẹ òfin bí ‘mú’ nìkan sí i.
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: mo sì ń fi wọ́n sínú àwọn ẹ̀wọ̀n
  rationale: Gbólóhùn yìí sọ fífi àwọn tí a dè lé ibi àhámọ́ lọ́wọ́ ní Yorùbá àdánidá, ó sì pa ọ̀pọ̀ φυλακάς (‘àwọn ẹ̀wọ̀n’) mọ́.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: àwọn ọkùnrin àti àwọn obìnrin
  rationale: Ó sọ ẹgbẹ́ méjèèjì ní kedere gẹ́gẹ́ bí Gíríìkì ṣe tẹnumọ́ pé inúnibíni náà kan ọkùnrin àti obìnrin.
theological_decisions:
- issue: Bóyá ἡ ὁδός jẹ́ ọ̀rọ̀ lásán fún ọ̀nà tàbí orúkọ tí a fi ń pe ìgbàgbọ́ àti ẹgbẹ́ àwọn Kristẹni
  choice: Ọ̀nà yìí
  alternative: ọ̀nà yìí; ìgbàgbọ́ yìí; ẹgbẹ́ yìí
  rationale: Nínú ìwé Ìṣe, ἡ ὁδός sábà máa ń jẹ́ àmì-orúkọ fún ìgbàgbọ́ àti àwùjọ àwọn ọmọlẹ́yìn Jésù. ‘Ọ̀nà’ dúró sún mọ́ ọ̀rọ̀ Gíríìkì, lẹ́tà ńlá sì ń fi lílo rẹ̀ gẹ́gẹ́ bí àmì-orúkọ hàn láìyanju gbogbo ìtumọ̀ rẹ̀.
- issue: Bí a ṣe yẹ kí a lóye ἄχρι θανάτου
  choice: títí dé ikú
  alternative: títí tí wọ́n fi kú; pẹ̀lú ète láti pa wọ́n
  rationale: Gíríìkì sọ bí inúnibíni náà ṣe dé góńgó ikú, ṣùgbọ́n kò sọ ní pàtó pé Pọ́ọ̀lù fúnra rẹ̀ pa àwọn ènìyàn tàbí pé gbogbo ẹni tí ó ṣe inúnibíni sí kú. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àtúnṣe ‘mo ń … mo sì ń …’ láti fi ìṣe tó ń bá a lọ hàn nínú àwọn participle Gíríìkì, a sì lo àmì olójú méjì láti ya gbólóhùn àkọ́kọ́ sí ọ̀nà tó ṣe kedere.
