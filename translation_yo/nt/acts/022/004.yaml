- from: Mo ṣe inúnibíni sí Ọ̀nà yìí[a] títí dé ikú[b]; mo ń dè àwọn ọkùnrin àti àwọn obìnrin, mo sì ń fi wọ́n sínú àwọn ẹ̀wọ̀n.
  to: Mo ṣe inúnibíni sí Ọ̀nà yìí[a] títí dé ikú[b], nípa dídè ọkùnrin àti obìnrin, àti fífi wọ́n sínú àwọn ilé-ẹ̀wọ̀n.
  rationale: A rọ́pò ‘àwọn ẹ̀wọ̀n’ pẹ̀lú ‘àwọn ilé-ẹ̀wọ̀n’ nítorí pé èyí ni ìtumọ̀ tó yẹ fún φυλακάς. A tún ṣe àtúnṣe ìkọ́ àwọn participle méjèèjì kí wọ́n lè ṣàlàyé ìṣe inúnibíni tó ṣẹlẹ̀ ní àtijọ́, láìsọ pé ìṣe náà ń lọ lọ́wọ́ báyìí. Àwọn àmì ẹsẹ̀ àti ìtumọ̀ ‘títí dé ikú’ ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:23:38Z'
