  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: yo
  text: Mo sì wí pé, “Olúwa, àwọn fúnra wọn mọ̀ pé láti sínágọ́gù kan dé òmíràn ni mo máa ń fi àwọn tí ó gbà ọ́ gbọ́ sẹ́wọ̀n, tí mo sì máa ń lù wọ́n.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní sínágọ́gù kọ̀ọ̀kan ni mo máa ń fi àwọn tí ó gbà ọ́ gbọ́ sẹ́wọ̀n, tí mo sì máa ń lù wọ́n.” Gbólóhùn Gíríìkì náà ń tọ́ka sí ìṣe tí ó ṣẹlẹ̀ léraléra ní ọ̀pọ̀ sínágọ́gù.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: Mo sì wí pé
  rationale: κἀγώ jẹ́ àkójọpọ̀ καὶ ἐγώ; ‘Mo sì’ ṣe àfihàn ìtẹ̀síwájú ọ̀rọ̀ náà ní Yorùbá àdánidá, ‘wí pé’ sì ṣí ọ̀rọ̀ tààrà.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè κύριε tọ́ka sí Jésù nínú ìran náà; ‘Olúwa’ pa ọ̀wọ̀ àti ìwúwo Kristẹni ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: αὐτοὶ ἐπίστανται
  choice: àwọn fúnra wọn mọ̀
  rationale: ‘Àwọn fúnra wọn’ pa ìtẹnumọ́ αὐτοί mọ́, ‘mọ̀’ sì jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ἐπίστανται.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: ni mo ti máa ń fi … sẹ́wọ̀n, tí mo sì ń lù wọ́n
  rationale: Ìṣètò periphrastic imperfect náà ń tọ́ka sí ìṣe àṣà tí ó ń ṣẹlẹ̀ léraléra ní àkókò àtijọ́; ‘ti máa ń’ àti ‘ń’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: κατὰ τὰς συναγωγάς
  choice: láti sínágọ́gù kan dé òmíràn
  rationale: κατά pẹ̀lú accusative níhìn-ín ní agbára pínpín, ó ń fi hàn pé ìṣe náà wáyé léraléra káàkiri ọ̀pọ̀ sínágọ́gù.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: àwọn tí ó gbà ọ́ gbọ́
  rationale: ‘Gbà ọ́ gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí a darí sí ẹni kan, ó sì pa ìdarí ἐπὶ σέ mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí Pọ́ọ̀lù ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ọ̀wọ̀ àti ìwúwo tí àyíká ọ̀rọ̀ fi fún Jésù tí ó jíǹde mọ́; kò sì mú ìtumọ̀ tó ju ohun tí ẹsẹ̀ náà sọ lọ wọ inú rẹ̀.
- issue: Ìhùwàsí àkókò nínú ἤμην φυλακίζων καὶ δέρων
  choice: ni mo ti máa ń fi … sẹ́wọ̀n, tí mo sì ń lù wọ́n
  alternative: ni mo ń fi … sẹ́wọ̀n, tí mo sì ń lù wọ́n
  rationale: ‘Ti máa ń’ mú ìṣe àṣà àti ìṣe léraléra ní àtijọ́ hàn kedere ju ‘ń’ nìkan lọ, ní ìbámu pẹ̀lú periphrastic imperfect Gíríìkì.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Sínágọ́gù’ jẹ́ ọ̀rọ̀ ìjọsìn tó wọ́pọ̀; ‘sẹ́wọ̀n’ àti ‘lù’ jẹ́ kedere láìṣe àfikún irú ìjìyà tí Gíríìkì kò sọ ní pàtó. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
