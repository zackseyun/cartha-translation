source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: yo
  text: Àti nígbà tí a ń da ẹ̀jẹ̀ Stefanu, ẹlẹ́rìí rẹ̀, sílẹ̀[a], èmi fúnra mi wà níbẹ̀, mo sì ń fọwọ́ sí i, mo sì ń ṣọ́ aṣọ àwọ̀lékè àwọn tí ń pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ajẹ́rìíkú rẹ̀”: ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹlẹ́rìí; ní ìlò Kristẹni, ó wá ní ìbáṣepọ̀ pàtàkì pẹ̀lú ẹni tí a pa nítorí ẹ̀rí rẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: wọ́n ń da ... sílẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ aláìpé ní ìṣe àfaragbà, ó sì fi ìṣe tí ń lọ lọ́wọ́ hàn. Ìtumọ̀ yìí pa àwòrán mímú ẹ̀jẹ̀ dà sílẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààrà tí ó bójú mu ní àyíká ọ̀rọ̀ yìí.
- source_word: μάρτυρός
  choice: ẹlẹ́rìí
  rationale: Ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ Gíríìkì ni ẹni tí ń jẹ́rìí. Bí ó tilẹ̀ jẹ́ pé ikú Stefanu mú ìtumọ̀ ‘ajẹ́rìíkú’ wá sí ọkàn, a pa ‘ẹlẹ́rìí’ mọ́ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐφεστὼς
  choice: dúró níbẹ̀
  rationale: Ó fi hàn pé Paulu wà níbi náà, ó sì dúró nítòsí; gbolohun yìí jẹ́ èdè Yorùbá tí ó ṣe kedere láìfi ipa míì kún un.
- source_word: συνευδοκῶν
  choice: fara mọ́ ohun tí wọ́n ń ṣe
  rationale: Ó túmọ̀ sí ìfọwọ́sí tàbí gbígbà pẹ̀lú ìṣe náà; yíyan yìí jẹ́ kedere, ó sì fi ìfọwọ́sí tí ó lágbára hàn.
- source_word: φυλάσσων
  choice: ń ṣọ́
  rationale: Ó dá ìtumọ̀ pípa ohun mọ́ tàbí ṣíṣọ́ ohun bo ní ọ̀nà àdánidá.
- source_word: ἱμάτια
  choice: aṣọ àwọ̀lékè
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí aṣọ òde tí a wọ lórí aṣọ mìíràn; yíyan yìí ṣe pàtó ju ‘aṣọ’ lásán lọ.
- source_word: ἀναιρούντων
  choice: ń pa
  rationale: Ní àyíká yìí ó túmọ̀ sí pípa ènìyàn. Yíyan yìí jẹ́ ti òde òní, ó sì yẹra fún fífi ìdájọ́ àfikún bí ‘ń paniyan’ sínú ọ̀rọ̀ náà.
- source_word: αὐτὸς
  choice: èmi fúnra mi
  rationale: Arọ́pò-orúkọ náà ní ìtẹnumọ́; ‘èmi fúnra mi’ pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ μάρτυς nípa Stefanu
  choice: ẹlẹ́rìí
  alternative: ajẹ́rìíkú
  rationale: ‘Ẹlẹ́rìí’ ni ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ Gíríìkì, ó sì yẹ kí ọ̀rọ̀ pàtàkì má ṣe gbé èdè ìjọ tí ó wá lẹ́yìn wọlé láìṣe dandan. Síbẹ̀, ikú nítorí ẹ̀rí ẹni jẹ́ kí ‘ajẹ́rìíkú’ jẹ́ àṣàyàn tó ṣe pàtàkì, nítorí náà a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A lo àmì ohùn ní ibi tí ó yẹ, a sì yan gbolohun tí òǹkàwé lásán lè lóye. Àwọn ìṣe aláìpé ‘wọ́n ń da,’ ‘wọ́n ń ṣe,’ ‘mo sì ń ṣọ́,’ àti ‘wọ́n ń pa’ pa ìlọsíwájú ìṣe inú Gíríìkì mọ́.
