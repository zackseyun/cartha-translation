id: ACT.22.2
reference: Acts 22:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: yo
  text: 'Ṣùgbọ́n nígbà tí wọ́n gbọ́ pé ó ń bá wọn sọ̀rọ̀ ní èdè Hébérù[a], wọ́n túbọ̀ dákẹ́ jẹ́ẹ́. Ó sì wí pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ó ṣeé ṣe, “ní èdè Árámáíkì”; Gíríìkì sọ pé “ní èdè Hébérù,” ṣùgbọ́n nínú àyíká yìí ó lè tọ́ka sí èdè Semitic tí àwọn ará Jùdíà ń sọ ní àdúgbò wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Ọ̀rọ̀ àbọ̀ aorist náà fi ipò àkókò tí ìṣe pàtàkì ṣẹlẹ̀ hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘when they heard’ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré nínú ìtàn hàn, níbi tí ìhùwàsí ogunlọ́gọ̀ ti yí padà.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ní èdè Hébérù
  rationale: Gíríìkì náà sọ ní tààrà nípa èdè tàbí ọ̀nà-èdè Hébérù. A pa ‘Hébérù’ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé seése pé Árámáíkì ni ó ń tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: προσεφώνει αὐτοῖς
  choice: ó ń bá wọn sọ̀rọ̀
  rationale: Imperfect náà tọ́ka sí ọ̀rọ̀ tí ó ń lọ lọ́wọ́, tí a sì darí sí wọn. Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ sí ogunlọ́gọ̀ mu.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: wọ́n túbọ̀ dákẹ́ jẹ́ẹ́
  rationale: Èyí tú idiom Gíríìkì ‘wọ́n pèsè ìdákẹ́jẹ́ púpọ̀ sí i’ sí Yorùbá àdánidá, ó sì pa agbára afiwéra μᾶλλον mọ́.
- source_word: καὶ φησίν
  choice: 'Ó sì wí pé:'
  rationale: Bí ó tilẹ̀ jẹ́ pé φησίν jẹ́ present ìtàn, àsìkò tí ó kọjá jẹ́ àdánidá nínú ìtàn Yorùbá; àmì oníṣàmì méjì sì ṣí ọ̀rọ̀ Pọ́ọ̀lù tí ń tẹ̀ lé.
theological_decisions:
- issue: Ohun tí ‘èdè Hébérù’ ń tọ́ka sí
  choice: Pa ‘Hébérù’ mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: Lóye rẹ̀ gẹ́gẹ́ bí Árámáíkì, èdè Semitic tí àwọn ará ibẹ̀ ń sọ
  rationale: Ọ̀ràn èdè àti ìtàn ni èyí ní pàtàkì, kì í ṣe yíyan ojú ìgbàgbọ́ kan. Nítorí Gíríìkì sọ ‘Hébérù’ ní tààrà, a pa á mọ́ nínú ọ̀rọ̀ pàtàkì, láìfi tipátipá yanjú àìdánilójú ohun tí ó tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Dákẹ́ jẹ́ẹ́’ jẹ́ ọ̀rọ̀ àdánidá fún ìdákẹ́jẹ́ ogunlọ́gọ̀; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
