  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n na án sílẹ̀ pẹ̀lú àwọn okùn awọ, Pọ́ọ̀lù sọ fún balógun ọgọ́rùn-ún tí ó dúró níbẹ̀ pé, “Ǹjẹ́ ó bófin mu fún yín láti fi pàṣán nà ọmọ ìlú Róòmù kan tí a kò tíì dá lẹ́bi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: wọ́n na án sílẹ̀, tí wọ́n sì fi àwọn okùn awọ dè é
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí wọ́n ṣe na Pọ́ọ̀lù sílẹ̀, tí wọ́n sì fi okùn awọ mú un dúró de lílù; ìtumọ̀ yìí mú ìṣe méjèèjì hàn ní Yorùbá àdánidá.
- source_word: ἑστῶτα
  choice: tí ó dúró níbẹ̀
  rationale: Ó fi hàn pé balógun náà dúró nítòsí, ó sì wà níbi ìṣẹ̀lẹ̀ náà.
- source_word: ἑκατόνταρχον
  choice: balógun ọ̀rún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ipò ọmọ-ogun Róòmù tí ń ṣàkóso nǹkan bí ọgọ́rùn-ún ọmọ-ogun.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: ọmọ ìlú Róòmù kan
  rationale: Nínú ọ̀rọ̀ òfin yìí, gbolohun Gíríìkì náà ń tọ́ka sí ipò ẹni gẹ́gẹ́ bí ará ìlú Róòmù; ‘ọmọ ìlú Róòmù’ jẹ́ kedere, ó sì bá Yorùbá mu.
- source_word: ἀκατάκριτον
  choice: tí a kò tíì dá lẹ́bi
  rationale: Ó túmọ̀ sí ẹni tí ilé ẹjọ́ kò tíì dá lẹ́bi; yíyan ‘kò tíì’ tún bá ipò Pọ́ọ̀lù mu láìsọ pé ìdájọ́ kan yóò ṣẹlẹ̀ dandan.
- source_word: ἔξεστιν
  choice: ó bófin mu fún yín
  rationale: Ìbéèrè náà jẹ́ nípa ohun tí òfin fàyè gbà, nítorí náà ọ̀rọ̀ òfin tó ṣe kedere ni a lò.
- source_word: μαστίζειν
  choice: láti nà
  rationale: Nínú àyíká yìí, ‘nà’ túmọ̀ sí lílù ènìyàn gẹ́gẹ́ bí ìjìyà; ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lágbára tó.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó ṣe kedere fún òǹkàwé gbogbo; a lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Balógun ọ̀rún’ ṣetọju ipò ἑκατόνταρχος, ‘ọmọ ìlú Róòmù’ sì mú ìtumọ̀ òfin ti ἄνθρωπον Ῥωμαῖον jáde láìfi ẹ̀kọ́ ẹ̀sìn kankan kún un.
