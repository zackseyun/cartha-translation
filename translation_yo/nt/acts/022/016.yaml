id: ACT.22.16
reference: Acts 22:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: yo
  text: Ǹjẹ́ nísinsìnyí, kí ló dé tí o fi ń dúró? Dìde, kí a sì batisí rẹ, kí o sì wẹ àwọn ẹ̀ṣẹ̀ rẹ nù ní pípe orúkọ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn náà sí, “nípa pípe orúkọ rẹ̀.” Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó bóyá pípe orúkọ rẹ̀ jẹ́ ìṣe tó ń bá àwọn àṣẹ náà lọ tàbí ọ̀nà tí a fi ń wẹ ẹ̀ṣẹ̀ nù.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: kí ló dé tí o fi ń dúró?
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè tó ń bá ẹni wí nítorí ìjáfara, kì í ṣe ìbéèrè nípa ohun tó fẹ́ ṣe lọ́jọ́ iwájú.
- source_word: ἀναστὰς
  choice: Dìde
  rationale: Participle aorist náà bá àwọn àṣẹ tó tẹ̀ lé e lọ; àṣẹ kúkúrú yìí pa ìkánjú ọ̀rọ̀ náà mọ́.
- source_word: βάπτισαι
  choice: kí a sì batisí rẹ
  rationale: Middle imperative náà túmọ̀ sí pé kí ó gba ìbatisí; ìṣètò yìí jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi olùbatisí tí a kò dárúkọ kún ọ̀rọ̀.
- source_word: ἀπόλουσαι
  choice: kí o sì wẹ àwọn ẹ̀ṣẹ̀ rẹ nù
  rationale: Ó pa àwòrán ìwẹ̀nùmọ́ àti ìmúkúrò ohun ẹlẹ́gbin tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: τὰς ἁμαρτίας σου
  choice: àwọn ẹ̀ṣẹ̀ rẹ
  rationale: Ìtumọ̀ tààrà yìí pa ìtumọ̀ gbogbogbò ti ἁμαρτία mọ́ láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἐπικαλεσάμενος
  choice: bí o ti ń ké pe
  rationale: Ọ̀nà yìí so participle náà mọ́ àwọn àṣẹ, ṣùgbọ́n kò pinnu bóyá ó ń tọ́ka sí àkókò, ìṣe tó ń bá a lọ, tàbí ọ̀nà tí ìwẹ̀nùmọ́ fi ṣẹlẹ̀.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: orúkọ rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lo arọ́pò-orúkọ, kì í ṣe oyè ‘Olúwa’; ìtumọ̀ náà kò fi ohun tí kò sí nínú ẹsẹ yìí kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìbatisí, wíwẹ ẹ̀ṣẹ̀ nù, àti kíké pe orúkọ rẹ̀
  choice: A pa ìtẹ̀lé àwọn àṣẹ àti participle Gíríìkì mọ́, láìsọ pàtó èyí tí ó jẹ́ ọ̀nà ìmúkúrò ẹ̀ṣẹ̀.
  alternative: A lè so ìwẹ ẹ̀ṣẹ̀ nù mọ́ ìbatisí ní pàtó, tàbí mọ́ kíké pe orúkọ rẹ̀ gẹ́gẹ́ bí ọ̀nà, tàbí ka gbogbo wọn sí àkójọpọ̀ ìṣe ìbẹ̀rẹ̀ ìgbàgbọ́.
  rationale: Gíríìkì fi àwọn àṣẹ méjì àti participle kan hàn, ṣùgbọ́n gírámà náà kò fipá mú onítumọ̀ láti yanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́. ‘Bí o ti ń ké pe’ mọ ìsopọ̀ náà sílẹ̀ láìdì í mọ́ ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye, ni a lò. ‘Batisí’ jẹ́ ọ̀rọ̀ Kristẹni tó wọ́pọ̀. Ìbéèrè ìbẹ̀rẹ̀ mú ìbániwí àti ìkánjú τί μέλλεις jáde. A fi àmì ìsàlẹ̀ ìwé [a] sí ibi tí àìdánilójú gírámà wà.
