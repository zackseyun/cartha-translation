id: ACT.22.18
reference: Acts 22:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: yo
  text: mo sì rí i, ó ń sọ fún mi pé, “Yára, kí o sì jáde kúrò ní Jerúsálẹ́mù ní kíákíá, nítorí wọn kì yóò gba ẹ̀rí rẹ nípa mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì yóò fi ojú rere gba ẹ̀rí rẹ nípa mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεῖν αὐτὸν λέγοντά μοι
  choice: mo sì rí i, ó ń sọ fún mi
  rationale: Àkópọ̀ ọ̀rọ̀ yìí bá ìtẹ̀síwájú ìròyìn ìran Pọ́ọ̀lù mu. Fífi ọ̀rọ̀ náà ṣe gbólóhùn aláìlẹ́gbẹ́ ní Yorùbá jẹ́ àdánidá, ó sì pa ìtumọ̀ pé ó rí ẹni náà tí ó ń bá a sọ̀rọ̀ mọ́.
- source_word: Σπεῦσον
  choice: Yára
  rationale: Ọ̀rọ̀ àṣẹ náà fi ìkánjú hàn; “Yára” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere tí kò sì jẹ́ ti àtijọ́.
- source_word: ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ
  choice: kí o sì jáde kúrò ní Jerúsálẹ́mù ní kíákíá
  rationale: “Jáde kúrò ní” pa agbára ìtọ́sọ́nà ἐξ mọ́, “ní kíákíá” sì tún fi ìkánjú tí ἐν τάχει ní hàn, láìpa ìtẹnumọ́ méjì inú Gíríìkì rẹ́.
- source_word: οὐ παραδέξονταί
  choice: wọn kì yóò gba
  rationale: Nínú àyíká yìí, παραδέχομαι túmọ̀ sí gbígba tàbí fífi ojú rere gba ẹ̀rí; “gba” jẹ́ ọ̀rọ̀ tó bá “ẹ̀rí” mu lọ́nà àdánidá.
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: ẹ̀rí rẹ nípa mi
  rationale: “Ẹ̀rí” sọ μαρτυρία di Yorùbá tó ṣe kedere, “nípa mi” sì fi ohun tí ẹ̀rí náà dá lé hàn.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ αὐτόν ń tọ́ka sí nínú ìran Pọ́ọ̀lù
  choice: A pa á mọ́ gẹ́gẹ́ bí “i,” láìfi “Olúwa” tàbí “Jésù” kún ẹsẹ yìí.
  alternative: Láti sọ ní tààrà pé “mo rí Olúwa” tàbí “mo rí Jésù.”
  rationale: Àyíká ẹsẹ tó ṣáájú fi ẹni tí ó ń sọ̀rọ̀ hàn, ṣùgbọ́n Gíríìkì ẹsẹ yìí lo ọ̀rọ̀ arọ́pò-orúkọ. Èyí yàgò fún fífi ọ̀rọ̀ ìtumọ̀ àfikún sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Yára” àti “ní kíákíá” pa ìtẹnumọ́ ìkánjú méjì inú orísun mọ́. A kọ orúkọ ìlú náà sí “Jerúsálẹ́mù,” gẹ́gẹ́ bí ìlò Yorùbá tó wọ́pọ̀.
