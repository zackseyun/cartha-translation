  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn èrò pàtàkì nínú Gíríìkì mọ́: ìsọ̀rọ̀ sí Paulu, àṣẹ “Lọ,” ìdí àṣẹ náà, ìtẹnumọ́ “èmi,” ìránṣẹ́ ọjọ́ iwájú, jíjìnnà, àti àwọn ἔθνη gẹ́gẹ́ bí àwọn Kèfèrí. “Rán ọ lọ” bá ἐξαποστελῶ mu dáadáa, láìfi ìtumọ̀ ìjọsìn tàbí ìtumọ̀ ìmọ̀-ẹ̀sìn kún un.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó mọ́gbọ́n dání. “Ó sì sọ fún mi pé” àti “Lọ, nítorí èmi yóò rán ọ lọ” jẹ́ ọ̀nà ìtúmọ̀ tí ó ṣàlàyé tí ó sì yẹ fún ìtàn Bíbélì. “Ní ibi jíjìnnà” lè jẹ́ ọ̀nà tí ó ní ìrísí ìtúmọ̀ díẹ̀, ṣùgbọ́n ó ṣì ṣe kedere, ó sì bá ìtumọ̀ μακράν mu.
  terminology: “Àwọn Kèfèrí” jẹ́ ọ̀rọ̀ ìtàn-Bíbélì tí a ti mọ̀ dáadáa fún ἔθνη nínú àyíká Júù àti aláìní-Júù. Àlàyé ìsàlẹ̀ “àwọn orílẹ̀-èdè” dáàbò bo aṣàyàn lexical gbooro náà. A kò rí ìdí tó dájú láti rọ́pò ọ̀rọ̀ ìtàn-Bíbélì yìí nínú ẹsẹ̀ yìí.
