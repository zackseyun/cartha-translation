id: ACT.22.21
reference: Acts 22:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: yo
  text: Ó sì sọ fún mi pé, “Lọ, nítorí èmi yóò rán ọ lọ sí ọ̀dọ̀ àwọn Kèfèrí ní ibi jíjìnnà.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sí ọ̀dọ̀ àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: Ó sì sọ fún mi pé
  rationale: Ọ̀rọ̀ yìí ń fi ọ̀rọ̀ tí a sọ tààrà sí ẹni kan hàn; “sọ fún mi pé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi gbé ọ̀rọ̀ tààrà wọlé.
- source_word: Πορεύου
  choice: Lọ
  rationale: Àṣẹ yìí túmọ̀ sí kí ẹni náà lọ tàbí kúrò; “Lọ” ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὅτι
  choice: nítorí
  rationale: 'Níhìn-ín, ὅτι ń ṣàlàyé ìdí àṣẹ náà: kí Paulu lọ nítorí ẹni tó ń sọ̀rọ̀ yóò rán an lọ.'
- source_word: ἐγὼ
  choice: èmi
  rationale: A lo “èmi” dípò “mo” láti pa ìtẹnumọ́ arọ́pò-orúkọ tí a kọ ní kedere nínú Gíríìkì mọ́.
- source_word: εἰς ἔθνη
  choice: sí ọ̀dọ̀ àwọn Kèfèrí
  rationale: Nínú ọ̀rọ̀ iṣẹ́ ìránṣẹ́ yìí, ἔθνη tọ́ka sí àwọn tí kì í ṣe Júù. “Àwọn Kèfèrí” ń pa ìyàtọ̀ Júù àti aláìní-Júù mọ́; “àwọn orílẹ̀-èdè” ṣì jẹ́ ìtumọ̀ ọ̀rọ̀ tí ó ṣeé ṣe.
- source_word: μακρὰν
  choice: ní ibi jíjìnnà
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ jíjìnnà ibi tí a ó rán Paulu sí; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐξαποστελῶ
  choice: yóò rán ọ lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí rírán ẹni jáde tàbí lọ; “rán ọ lọ” mú ìṣípò àti ìránṣẹ́ náà hàn láìfi àlàyé tí kò sí nínú ẹsẹ̀ kún un.
- source_word: σε
  choice: ọ
  rationale: Ó jẹ́ arọ́pò-orúkọ ẹni kejì ẹyọ gẹ́gẹ́ bí ẹni tí a ń rán.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú ọ̀rọ̀ iṣẹ́ ìránṣẹ́ aposteli
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká Ìṣe Àwọn Aposteli ń tọ́ka sí ìránṣẹ́ Paulu sí àwọn tí kì í ṣe Júù. “Àwọn Kèfèrí” pa ìyàtọ̀ ìtàn náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro “àwọn orílẹ̀-èdè” pamọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “Kèfèrí” ní ìtumọ̀ ìtàn-Bíbélì fún àwọn tí kì í ṣe Júù, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó kan.
