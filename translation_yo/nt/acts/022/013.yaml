  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ̀ Gíríìkì dáadáa: Ananíà wá sọ́dọ̀ Sọ́ọ̀lù, ó dúró lẹ́gbẹ̀ẹ́ rẹ̀, ó bá a sọ̀rọ̀, ìríran Sọ́ọ̀lù sì padà ní àkókò kan náà, ó sì wo Ananíà. Ṣùgbọ́n ‘ríran padà’ kò jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó pé fún ‘ríran padà gba’ nínú gbolohun yìí; ‘Kí ojú rẹ tún rí’ àti ‘ojú mi tún rí’ sọ ìmúpadàbọ̀sípò ìríran náà ní kedere.'
  naturalness: ‘Kí ojú rẹ tún rí’ jẹ́ Yorùbá boṣewa, tí ó mọ́gbọ́n dání, fún àṣẹ ìwòsàn náà. ‘Ojú mi tún rí’ tún jẹ́ ọ̀nà àdánidá láti sọ pé ìríran ẹni padà. Àmì ìpè lẹ́yìn ‘Sọ́ọ̀lù, arákùnrin’ ń jẹ́ kí ìpè náà rọrùn láti kà.
  terminology: ‘Arákùnrin’ pa ἀδελφέ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìpè ìbáṣepọ̀, láìfi ‘mi’ tàbí ìtumọ̀ ẹ̀kọ́ ìjọ kún un. ‘Ojú’ nínú àwọn gbólóhùn tí a ṣe àtúnṣe náà ń tọ́ka sí agbára ìríran, kì í ṣe ojú ara nìkan.
