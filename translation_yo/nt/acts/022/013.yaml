base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: yo
  text: Ó wá sọ́dọ̀ mi, ó sì dúró lẹ́gbẹ̀ẹ́ mi, ó wí fún mi pé, ‘Sọ́ọ̀lù, arákùnrin, kí ojú rẹ tún rí!’[a] Ní wákàtí náà gan-an ni ojú mi tún rí, mo sì wo ojú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú ἀναβλέπω ní àwọn ibi méjèèjì yìí sí ‘tún rí’ tàbí ‘gba ìríran rẹ padà.’ Ọ̀rọ̀ náà tún lè túmọ̀ sí ‘gbé ojú sókè,’ ṣùgbọ́n àyíká ìfọ́jú àti ìwòsàn níbí fi hàn pé ìmúpadàbọ̀sípò ìríran ni ó túmọ̀ sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Ó wá sọ́dọ̀ mi
  rationale: Èyí sọ ìṣípò tọ Sọ́ọ̀lù lọ ní Yorùbá àdánidá, láìfi ọ̀rọ̀ aláìparí tí yóò mú kí ìtàn nira sílẹ̀.
- source_word: ἐπιστάς
  choice: ó dúró lẹ́gbẹ̀ẹ́ mi
  rationale: Ó pa ìtumọ̀ pé ó dúró ní tòsí Sọ́ọ̀lù mọ́, ó sì bá ìtẹ̀síwájú ọ̀rọ̀ mu.
- source_word: Σαοὺλ ἀδελφέ
  choice: Sọ́ọ̀lù arákùnrin
  rationale: A kọ orúkọ náà ní ìrísí Yorùbá; ‘arákùnrin’ jẹ́ ọ̀rọ̀ ìpè tó pa ìbáṣepọ̀ tí ἀδελφέ ń fi hàn mọ́.
- source_word: ἀνάβλεψον
  choice: ríran padà
  rationale: Nínú àyíká ìfọ́jú àti ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí kí ojú tún rí, kì í ṣe kìkì láti gbé ojú sókè.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: Ní wákàtí náà gan-an
  rationale: Ó pa ìtẹnumọ́ lórí àkókò pàtó náà mọ́ ju bí a bá sọ pé ‘lẹ́sẹ̀kẹsẹ̀’ lọ.
- source_word: ἀνέβλεψα
  choice: mo ríran padà
  rationale: A lo ìtumọ̀ kan náà pẹ̀lú àṣẹ tó ṣáájú, nítorí pé àyíká ń sọ nípa ìmúpadàbọ̀sípò ìríran.
- source_word: εἰς αὐτόν
  choice: mo sì wo ojú rẹ̀
  rationale: Àsọyé Yorùbá yìí fi hàn pé Sọ́ọ̀lù darí ojú rẹ̀ sí ọkùnrin náà lẹ́yìn tí ó ríran padà.
- source_word: κἀγώ
  choice: ni mo
  rationale: Ìṣètò ‘Ní ... ni mo’ jẹ́ ọ̀nà Yorùbá àdánidá láti so ìṣẹ̀lẹ̀ náà pọ̀ mọ́ àkókò tí a tẹnumọ́, láìfi ìtẹnumọ́ àfikún tí Gíríìkì kò fi dandan béèrè sí i.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti ìtàn mímọ́ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Sọ́ọ̀lù arákùnrin’ pa irú ìpè Gíríìkì mọ́ láìsọ ọ́ di oyè ẹ̀sìn.
