language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: yo
  text: 'Ó sì ṣẹlẹ̀ pé bí mo ti ń rin ìrìn-àjò, tí mo sì ń sún mọ́ Damásíkù, ní nǹkan bí àárín ọ̀sán, lójijì, ìmọ́lẹ̀ alágbára kan[a] láti ọ̀run tàn yí mi ká.


    [a] Tàbí, “ìmọ́lẹ̀ ńlá kan.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí ìmọ́lẹ̀ náà ti pọ̀ tó tàbí bí ó ti lágbára tó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmọ́lẹ̀ ńlá kan.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí ìmọ́lẹ̀ náà ti pọ̀ tó tàbí bí ó ti lágbára tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Ó sì ṣẹlẹ̀ pé … mo
  rationale: “Ó sì ṣẹlẹ̀ pé” jẹ́ ọ̀nà àdánidá láti gbé ìṣẹ̀lẹ̀ tuntun wọ inú ìtàn, ó sì pa agbára àsopọ̀ δέ mọ́. A fi μοι sínú gbólóhùn ẹni-kìíní “mo” dípò títúmọ̀ rẹ̀ lọ́nà líle gẹ́gẹ́ bí “sí mi.”
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: bí mo ti ń rin ìrìn-àjò, tí mo sì ń sún mọ́ Damásíkù
  rationale: Ìṣẹ̀dá “ń …” fi hàn pé ìrìn àti sísún mọ́ ibi náà ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ náà; “sún mọ́ Damásíkù” sì ṣe àfihàn ibi tí ó ń tọ̀ sí.
- source_word: περὶ μεσημβρίαν
  choice: ní nǹkan bí ọ̀sán gangan
  rationale: “Ní nǹkan bí” pa ìtumọ̀ àkókò tí kò pé gangan mọ́, “ọ̀sán gangan” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àárín ọ̀sán.
- source_word: ἐξαίφνης
  choice: lójijì
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ó dé láìròtẹ́lẹ̀ hàn ní kedere.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: “Ọ̀run” pa ìtumọ̀ orísun òkè tàbí ti Ọlọ́run mọ́ ju “ojú ọ̀run” lọ, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: περιαστράψαι
  choice: tàn yí mi ká
  rationale: Àṣàyàn yìí mú ìmọ́lẹ̀ tí ó tàn ká ẹni náà jáde, ó sì bá ìṣẹ̀lẹ̀ ojijì mu láìjẹ́ ọ̀rọ̀ líle.
- source_word: φῶς ἱκανὸν
  choice: ìmọ́lẹ̀ dídán kan
  rationale: Ní àyíká yìí ἱκανός lè tọ́ka sí bí ìmọ́lẹ̀ ṣe pọ̀ tàbí bí ó ṣe lágbára. “Ìmọ́lẹ̀ dídán” jẹ́ Yorùbá àdánidá tó sọ agbára ìmọ́lẹ̀ náà; àṣàyàn “ìmọ́lẹ̀ ńlá” wà nínú àlàyé ìsàlẹ̀.
- source_word: περὶ ἐμέ
  choice: yí mi ká
  rationale: Ó sọ ipò àyíká ẹni náà ní Yorùbá tó rọrùn, tó sì péye.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  alternative: láti ojú ọ̀run
  rationale: Nítorí lílo ọ̀rọ̀ náà nínú Lúùkù–Ìṣe Àwọn Àpọ́sítélì àti àyíká ìran Páùlù, “ọ̀run” dáàbò bo ìtumọ̀ orísun tó ga ju ti ojú-ọjọ́ lásán lọ, láìfi ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. A gbé àmì [a] lẹ́yìn “ìmọ́lẹ̀ dídán kan,” ibi tí àlàyé ọ̀rọ̀ ἱκανὸν ti jẹ mọ́, dípò lẹ́yìn “Damásíkù.”
