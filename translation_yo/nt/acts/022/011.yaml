id: ACT.22.11
reference: Acts 22:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: yo
  text: Níwọ̀n bí n kò ti lè ríran nítorí ìtànṣán ìmọ́lẹ̀ náà[a], mo dé Damásíkù nígbà tí àwọn tí ó wà pẹ̀lú mi ń darí mi nípa ọwọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan, “nítorí ògo ìmọ́lẹ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: mi ò lè ríran
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí àìlè ríran lẹ́yìn ìmọ́lẹ̀ ọ̀run náà, kì í ṣe àìlè tẹjú mọ́ ọn lásán.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: nítorí ìmọ́lẹ̀ dídán yẹn
  rationale: δόξα níbí ṣàpèjúwe bí ìmọ́lẹ̀ náà ṣe ń dán gidigidi tó fi mú kí Pọ́ọ̀lù má lè ríran; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gangan sí ‘ògo’ mọ́.
- source_word: χειραγωγούμενος
  choice: dì mí lọ́wọ́, wọ́n sì fà mí lọ
  rationale: Gbólóhùn Yòrùbá yìí fi ìtọ́sọ́nà nípa dídì ẹni lọ́wọ́ hàn ní kedere, dípò ọ̀rọ̀ gbogbogbò bí ‘wọ́n mú mi lọ.’
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: àwọn tí ó wà pẹ̀lú mi
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì láì pe àwọn ènìyàn náà ní orúkọ ẹgbẹ́ kan tí orísun kò sọ.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: wọ́n sì fà mí lọ sí Damásíkù
  rationale: ‘Lọ sí Damásíkù’ jẹ́ ọ̀nà àdánidá ní Yòrùbá láti sọ ìrìn sí inú ìlú náà; àkópọ̀ rẹ̀ pẹ̀lú gbólóhùn ṣáájú mú ipa aláìṣe ti participle àti iṣe pàtàkì náà hàn.
- source_word: ὡς δὲ
  choice: Nígbà tí … sì
  rationale: ὡς lè jẹ́ ti àkókò tàbí ti ìdí níbí. ‘Nígbà tí … nítorí’ jẹ́ kí ìṣẹ̀lẹ̀ àti ìdí rẹ̀ hàn láì fi agbára kan ojútùú kan ṣoṣo lé àìṣedéédé náà lórí.
theological_decisions:
- issue: Ìtumọ̀ δόξα nínú àyíká ìfarahàn ọ̀run
  choice: ìmọ́lẹ̀ dídán
  alternative: ògo ìmọ́lẹ̀ náà
  rationale: Nínú gbólóhùn yìí, δόξα ń ṣiṣẹ́ gẹ́gẹ́ bí ìtànṣán tí ó mú àìríran wá. ‘Ìmọ́lẹ̀ dídán’ sọ ipa ara náà ní èdè Yòrùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ‘ògo’ mọ́ gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ ọ̀rọ̀ orísun.
translation_notes:
  register: Èdè Yòrùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘mi ò’ nínú ọ̀rọ̀ tí ẹni náà ń sọ fúnra rẹ̀, èyí tó jẹ́ àdánidá nínú ìtàn ẹnu; a sì fi àmì ohùn sí ibi tí ó yẹ.
