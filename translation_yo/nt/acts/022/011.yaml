revisions:
- from: Nígbà tí mi ò sì lè ríran nítorí ìmọ́lẹ̀ dídán yẹn[a], àwọn tí ó wà pẹ̀lú mi dì mí lọ́wọ́, wọ́n sì fà mí lọ sí Damásíkù.
  to: Níwọ̀n bí n kò ti lè ríran nítorí ìtànṣán ìmọ́lẹ̀ náà[a], mo dé Damásíkù nígbà tí àwọn tí ó wà pẹ̀lú mi ń darí mi nípa ọwọ́.
  rationale: The revision retains the physical sense of δόξα as radiant brightness and preserves the literal “glory” in the footnote. It restores Paul as the subject of “I came/arrived,” and renders χειραγωγούμενος without adding binding or dragging. The causal wording reflects the contextual force of ὡς while remaining natural Yoruba.
  reviewer_model: gpt-5.6-terra
