  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ sí mi pé, lẹ́yìn tí mo padà sí Jerúsálẹ́mù, nígbà tí mo ń gbàdúrà nínú àgbègbè tẹ́ńpìlì[a], mo wọ inú ìfẹ̀sẹ̀mì[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí ọgbà tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “mo wà nínú ìfẹ̀sẹ̀mì.” Ní ti gidi, gbólóhùn Gíríìkì náà sọ pé “mo wá wà nínú ìfẹ̀sẹ̀mì,” ìyẹn ni, mo wọ ipò ìran kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Ó sì ṣẹlẹ̀ sí mi pé
  rationale: Ó pa ìyípadà ìtàn àti ìrírí Pọ́ọ̀lù mọ́ ní Yorùbá àdánidá.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: lẹ́yìn tí mo padà sí Jerúsálẹ́mù
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣáájú ìṣẹ̀lẹ̀ pàtàkì.
- source_word: καὶ προσευχομένου μου
  choice: bí mo sì ti ń gbàdúrà
  rationale: Ó fi hàn pé àdúrà náà ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ náà.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbègbè tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí ọgbà tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: mo bọ́ sínú ìran ojú inú
  rationale: Gbólóhùn náà ṣàpèjúwe wíwọ inú ipò ìran kan; yíyan yìí jẹ́ kíkà Yorùbá tó ṣe kedere láìfi àlàyé nípa bí ìrírí náà ṣe ṣiṣẹ́ kún un.
theological_decisions:
- issue: Irú ìrírí Pọ́ọ̀lù tí ἐκστάσει ń tọ́ka sí
  choice: ìran ojú inú
  alternative: ipò ìran; ojúran àràmàǹdà
  rationale: Ọ̀rọ̀ náà sọ pé Pọ́ọ̀lù wọ ipò ìran nígbà àdúrà, ṣùgbọ́n kò ṣàlàyé ìlànà rẹ̀ tàbí fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “àgbègbè tẹ́ńpìlì” fún ìpéye ἱερόν, àti “ìran ojú inú” láti yẹra fún ìtumọ̀ ẹ̀sìn tí ó ju ohun tí ọ̀rọ̀ náà sọ lọ.
