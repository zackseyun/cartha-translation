id: ACT.22.7
reference: Acts 22:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: yo
  text: Mo sì ṣubú lulẹ̀, mo sì gbọ́ ohùn kan tí ń sọ fún mi pé, “Saulu, Saulu, Èé ṣe tí o fi ń ṣe inúnibíni sí mi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Mo sì ṣubú
  rationale: Aorist náà sọ ìṣẹ̀lẹ̀ tó ṣẹlẹ̀ nígbà kan; “ṣubú” ni ọ̀rọ̀ Yorùbá àdánidá fún πίπτω. “Sì” ń so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú.
- source_word: τε
  choice: sì
  rationale: τε ń so gbólóhùn yìí mọ́ àyíká tó ṣáájú; “sì” fi ìsopọ̀ náà hàn láì mú kí ọ̀rọ̀ le.
- source_word: εἰς τὸ ἔδαφος
  choice: lulẹ̀
  rationale: “Ṣubú lulẹ̀” ni àṣà ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ‘fall to the ground’ mu dáadáa.
- source_word: ἤκουσα
  choice: mo sì gbọ́
  rationale: Aorist active indicative ni; “gbọ́” túmọ̀ sí pé etí ẹni gba ohùn náà, “sì” sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: φωνῆς
  choice: ohùn kan
  rationale: Genitive object lẹ́yìn ἀκούω ni, ṣùgbọ́n Yorùbá máa ń lò ó gẹ́gẹ́ bí ohun tí a gbọ́. “Kan” fi àìdánimọ̀ ohùn náà ní ibi yìí hàn.
- source_word: λεγούσης μοι
  choice: tí ń sọ fún mi pé
  rationale: Present participle náà ń ṣàpèjúwe ohun tí ohùn náà ń ṣe lẹ́sẹ̀ kan náà; “fún mi” pa μοι mọ́, “pé” sì ṣí ọ̀rọ̀ tààrà.
- source_word: Σαοὺλ Σαούλ
  choice: Saulu, Saulu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó wọ́pọ̀ ní Yorùbá, a sì pa àtúnwí náà mọ́ fún ìtẹnumọ́ àti ìpè tààrà.
- source_word: τί
  choice: èé ṣe tí
  rationale: Nínú ìbéèrè yìí, τί béèrè ìdí; “èé ṣe tí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘why.’
- source_word: με
  choice: mi
  rationale: A pa arọ́pò-orúkọ ẹni àkọ́kọ́ gẹ́gẹ́ bí ohun tí ìṣe náà kàn mọ́.
- source_word: διώκεις
  choice: ìwọ fi ń ṣe inúnibíni sí
  rationale: Nínú àyíká ìkọlù sí àwọn onígbàgbọ́, διώκω túmọ̀ sí ṣíṣe inúnibíni. “Ń” pa agbára ìṣe tó ń bá a lọ mọ́, “ìwọ” sì mú ẹni tí a ń bá sọ ṣe kedere fún ìtẹnumọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹni tó ń sọ̀rọ̀ pẹ̀lú inúnibíni Saulu sí àwọn onígbàgbọ́
  choice: 'Pa ọ̀rọ̀ ẹni àkọ́kọ́ tààrà náà mọ́: “sí mi.”'
  alternative: Ṣàlàyé rẹ̀ sí i gẹ́gẹ́ bí “sí àwọn ènìyàn mi” tàbí “sí àwọn ọmọlẹ́yìn mi.”
  rationale: Gbólóhùn Gíríìkì sọ με, ‘mi,’ ní tààrà. Ìtumọ̀ náà gbọ́dọ̀ pa ìdánimọ̀ líle yìí mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un tàbí yanjú ìfẹ́sẹ̀mulẹ̀ rẹ̀.
translation_notes:
  register: Yorùbá ìpele boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá; ìṣètò ọ̀rọ̀ náà pa àtúnwí, ọ̀rọ̀ tààrà, àti ìtẹ̀síwájú ìṣe inú ìbéèrè mọ́.
