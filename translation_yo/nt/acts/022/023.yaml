  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: yo
  text: Bí wọ́n sì ti ń pariwo, tí wọ́n ń ju aṣọ wọn sílẹ̀,[a] tí wọ́n sì ń ju erùpẹ̀ sínú afẹ́fẹ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ń ju aṣọ wọn káàkiri,” tàbí “tí wọ́n ń bọ́ aṣọ wọn sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé wọ́n ń ju aṣọ wọn nù tàbí pé wọ́n ń ju aṣọ wọn káàkiri nítorí ìbínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: tí wọ́n ń pariwo
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ń fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń pariwo” jẹ́ èdè Yorùbá àdánidá fún igbe ariwo ọ̀pọ̀ ènìyàn.
- source_word: τε ... καὶ ... καὶ
  choice: sì ... tí ... tí ... sì
  rationale: Àwọn àsopọ̀ náà so àwọn ìṣe tí ń ṣẹlẹ̀ lẹ́ẹ̀kan náà pọ̀; ètò yìí mú gbólóhùn náà ṣàn dáadáa ní Yorùbá.
- source_word: αὐτῶν
  choice: wọ́n
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní genitive, “wọ́n” ni kókó-ọ̀rọ̀ tó ṣe kedere, tó sì bá ìlò Yorùbá mu.
- source_word: ῥιπτούντων
  choice: ń ju ... sílẹ̀
  rationale: ῥιπτέω túmọ̀ sí jíju tàbí sísọ ohun kan nù; “ju ... sílẹ̀” pa ìtumọ̀ náà mọ́ láì pinnu bóyá wọ́n bọ́ aṣọ náà lára tàbí wọ́n ń ju ú káàkiri.
- source_word: τὰ ἱμάτια
  choice: aṣọ wọn
  rationale: ἱμάτια lè tọ́ka sí aṣọ tàbí aṣọ àwọ̀lékè. “Aṣọ wọn” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tí kò sì fi ìtumọ̀ tóóró kan lé ọ̀rọ̀ Gíríìkì lórí.
- source_word: κονιορτόν
  choice: erùpẹ̀
  rationale: “Erùpẹ̀” ni ìtumọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ fún κονιορτός.
- source_word: βαλλόντων
  choice: ń fọ ... sókè
  rationale: Nínú àyíká yìí, “fọ erùpẹ̀ sókè” ṣàpèjúwe jíju erùpẹ̀ sínú afẹ́fẹ́ ní ìbínú, ó sì yẹra fún àtúnlò “ju” lẹ́sẹ̀kẹsẹ̀.
- source_word: εἰς τὸν ἀέρα
  choice: sínú afẹ́fẹ́
  rationale: Ìtumọ̀ yìí tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
