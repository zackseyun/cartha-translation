translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àkójọpọ̀ àwọn ọ̀rọ̀-ìṣe tí “ń” tẹ̀ lé pa ìṣe tí ń lọ lọ́wọ́ àti ìgbóná ọkàn àwọn ènìyàn náà mọ́.
