id: ACT.22.3
reference: Acts 22:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: yo
  text: “Èmi jẹ́ ọkùnrin Júù, tí a bí ní Tásù ti Kìlíḱíà, ṣùgbọ́n tí a tọ́ mi dàgbà ní ìlú yìí ní ẹsẹ̀ Gàmálíẹ́lì,[a] tí a sì kọ́ mi lẹ́kọ̀ọ́ ní ìbámu pẹ̀lú ìlànà líle ti òfin àwọn baba wa,[b] ẹni tí ó ní ìtara fún Ọlọ́run, gẹ́gẹ́ bí gbogbo yín náà ṣe ní ìtara lónìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ní ẹsẹ̀ Gàmálíẹ́lì”; ọ̀nà àsọyé ni èyí fún gbígba ìdánilẹ́kọ̀ọ́ lábẹ́ olùkọ́ kan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “òfin ìbílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ọkùnrin Júù
  rationale: 'Ó pa ìtumọ̀ méjèèjì mọ́: ἀνήρ tọ́ka sí ọkùnrin àgbà, Ἰουδαῖος sì fi ìdánimọ̀ Júù hàn.'
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: tí a bí ní Tásù ti Kìlíḱíà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi ìbí, ó sì pa ìbáṣepọ̀ Tásù pẹ̀lú agbègbè Kìlíḱíà mọ́.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: ṣùgbọ́n tí a tọ́ dàgbà ní ìlú yìí
  rationale: ἀνατρέφω níbí túmọ̀ sí títọ́ ẹni dàgbà; “ṣùgbọ́n” mú ìyàtọ̀ láàárín ibi ìbí àti ibi ìtọ́ dàgbà jáde.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: lẹ́bàá ẹsẹ̀ Gàmálíẹ́lì
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́; ó ń tọ́ka sí jíjókòó gẹ́gẹ́ bí akẹ́kọ̀ọ́ lábẹ́ olùkọ́.
- source_word: πεπαιδευμένος
  choice: tí a sì kọ́ lẹ́kọ̀ọ́
  rationale: Ó sọ ìdánilẹ́kọ̀ọ́ àti ìmúrasílẹ̀ tó jinlẹ̀ jáde ní Yorùbá àdánidá.
- source_word: κατὰ ἀκρίβειαν
  choice: ní ìbámu pẹ̀lú ìlànà pípéye
  rationale: ἀκρίβεια ní èrò ìpéye àti líle mímú ohun ṣẹ; yíyan yìí kò dín ọ̀kan kù sí líle nìkan.
- source_word: τοῦ πατρῴου νόμου
  choice: ti òfin àwọn baba wa
  rationale: “Àwọn baba wa” fi ogún àwọn baba ńlá àti ìṣọ̀kan Pọ́ọ̀lù pẹ̀lú àwọn olùgbọ́ rẹ̀ hàn ní àyíká ọ̀rọ̀ yìí.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: tí mo ní ìtara fún Ọlọ́run
  rationale: Ó pa ìtumọ̀ ìtara tó lágbára mọ́ láìfi ìtumọ̀ ẹgbẹ́ òṣèlú kankan kún un.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: gẹ́gẹ́ bí gbogbo yín ti rí lónìí
  rationale: Ó pa ìfiwéra Pọ́ọ̀lù pẹ̀lú gbogbo àwọn olùgbọ́ rẹ̀ àti àkókò “lónìí” mọ́.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ πατρῴου νόμου kí ìdánimọ̀ Pọ́ọ̀lù pẹ̀lú àwọn Júù ẹlẹgbẹ́ rẹ̀ lè hàn
  choice: òfin àwọn baba wa
  alternative: òfin àtọwọ́dọ́wọ́ àwọn baba ńlá
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí òfin àwọn baba ńlá; “wa” bá ìlò ọ̀rọ̀ Pọ́ọ̀lù mu, nítorí ó ń tẹnu mọ́ ogún tí òun àti àwọn olùgbọ́ rẹ̀ jọ ní.
- issue: Bóyá kí a pa àwòrán ọ̀rọ̀ παρὰ τοὺς πόδας Γαμαλιήλ mọ́
  choice: lẹ́bàá ẹsẹ̀ Gàmálíẹ́lì
  alternative: lábẹ́ ìkọ́ni Gàmálíẹ́lì
  rationale: Àwòrán ọ̀rọ̀ náà ní iye ìtàn àti àṣà; àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ rẹ̀ ṣe kedere láìrọ́pò rẹ̀ nínú ẹsẹ̀.
translation_notes:
  register: Yorùbá Àfẹnukò tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa gbolohun gígùn àti ìtẹ̀síwájú àwọn participle inú Gíríìkì mọ́ dé ìwọ̀n tí Yorùbá lè gbà láìdi líle.
