id: ACT.22.9
reference: Acts 22:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: yo
  text: Àwọn tí ó wà pẹ̀lú mi rí ìmọ́lẹ̀ náà, ṣùgbọ́n wọn kò gbọ́ ohùn ẹni tí ń sọ̀rọ̀ sí mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò lóye ohùn náà.” Fi wé Ìṣe 9:7, níbi tí a ti sọ pé àwọn ẹlẹgbẹ́ Pọ́ọ̀lù gbọ́ ìró tàbí ohùn; ó ṣeé ṣe pé wọ́n gbọ́ ìró, ṣùgbọ́n wọn kò lóye ẹni tó ń sọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Àwọn tí ó wà pẹ̀lú mi
  rationale: Ó tú ọ̀rọ̀ alábápín oníàsọyé náà sí Yorùbá àdánidá, kò sì fi ‘àwọn ọkùnrin’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τὸ μὲν φῶς
  choice: ìmọ́lẹ̀ náà
  rationale: φῶς túmọ̀ sí ‘ìmọ́lẹ̀’; àfikún náà ń tọ́ka sí ìmọ́lẹ̀ tí a ti mẹ́nu kàn nínú ìtàn, nígbà tí ‘ṣùgbọ́n’ fi ìyàtọ̀ μέν…δέ hàn.
- source_word: ἐθεάσαντο
  choice: rí
  rationale: θεάομαι níbí túmọ̀ sí rírí tàbí kíyèsí; ‘rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò fi ìmọ̀lára wíwo pẹ̀lú ète kún un.
- source_word: τὴν δὲ φωνὴν
  choice: ohùn
  rationale: φωνή lè jẹ́ ‘ohùn’ tàbí ‘ìró’; ‘ohùn’ yẹ níbí nítorí pé ẹni kan ni a sọ pé ó ń bá Pọ́ọ̀lù sọ̀rọ̀.
- source_word: οὐκ ἤκουσαν
  choice: wọn kò gbọ́
  rationale: Ìtumọ̀ tààrà ti ἀκούω ni ‘gbọ́’; a kò yí i sí ‘lóye’ nínú ẹsẹ̀ pàtàkì, kí ìṣòro tó wà láàárín ẹsẹ̀ yìí àti Ìṣe 9:7 má bàa parẹ́.
- source_word: τοῦ λαλοῦντός μοι
  choice: ẹni tí ń bá mi sọ̀rọ̀
  rationale: Àpólà alábápín àsìkò ìsinsìnyí λαλοῦντος fi ìṣe tó ń lọ lọ́wọ́ hàn; ‘ẹni tí ń bá mi sọ̀rọ̀’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́.
theological_decisions:
- issue: Ìyàtọ̀ tó dà bí ẹni pé ó wà pẹ̀lú Ìṣe 9:7 lórí bóyá àwọn ẹlẹgbẹ́ Pọ́ọ̀lù gbọ́ ohùn náà
  choice: Fi ‘wọn kò gbọ́ ohùn’ sínú ẹsẹ̀ pàtàkì, kí àlàyé ìtumọ̀ mìíràn sì wà ní àlàyé ìsàlẹ̀.
  alternative: wọn kò lóye ohùn náà; tàbí wọn kò gbọ́ ọ̀rọ̀ náà ní kedere
  rationale: Gíríìkì níbí túmọ̀ sí ‘wọn kò gbọ́ ohùn’ lọ́nà tó ṣe tààrà jù, ṣùgbọ́n ἀκούω àti φωνή lè ní ìtumọ̀ tó gbòòrò. Àlàyé ìsàlẹ̀ jẹ́ kí ó ṣeé ṣe pé wọ́n gbọ́ ìró ṣùgbọ́n wọn kò lóye ẹni tó ń sọ̀rọ̀, láìfi ìtumọ̀ ìbámu náà rọ́pò ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ṣùgbọ́n’ láti fi ìtakora μέν…δέ hàn, láìfi àmì àsọyé bí ‘Nísinsin yìí’ kún un.
