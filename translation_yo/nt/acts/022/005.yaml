id: ACT.22.5
reference: Acts 22:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: yo
  text: Gẹ́gẹ́ bí àlùfáà àgbà àti gbogbo ìgbìmọ̀ àwọn alàgbà pẹ̀lú ṣe lè jẹ́rìí fún mi. Ọ̀dọ̀ wọn ni mo sì ti gba àwọn lẹ́tà sí àwọn arákùnrin ní Damásíkù[a], mo sì ń lọ sí ibẹ̀ láti mú àwọn tí ó wà níbẹ̀ pẹ̀lú ní ìdè lọ sí Jerúsálẹ́mù, kí a lè fìyà jẹ wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àwọn arákùnrin àti arábìnrin.” Gíríìkì ní “àwọn arákùnrin,” ṣùgbọ́n ní àwọn àyíká kan ó lè tọ́ka sí àwùjọ tí ó gbòòrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Gẹ́gẹ́ bí ... pẹ̀lú ṣe
  rationale: Ó pa agbára ìfiwéra àti ìfẹsẹ̀múlẹ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὁ ἀρχιερεύς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ipò àlùfáà tí ó ga jù lọ nínú àyíká ìtàn yìí.
- source_word: μαρτυρεῖ μοι
  choice: ṣe lè jẹ́rìí fún mi
  rationale: Ó fi hàn pé ẹ̀rí ìmúdájú ọ̀rọ̀ Pọ́ọ̀lù wà lárọ̀ọ́wọ́tó, ó sì mú dátífù μοι jáde lọ́nà àdánidá.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: gbogbo ìgbìmọ̀ àwọn alàgbà
  rationale: πρεσβυτέριον túmọ̀ sí ẹgbẹ́ tàbí ìgbìmọ̀ àwọn alàgbà, kì í ṣe àwọn àgbàlagbà lásán.
- source_word: παρ’ ὧν
  choice: Ọ̀dọ̀ wọn
  rationale: Ó tọ́ka padà sí olórí àlùfáà àti gbogbo ìgbìmọ̀ náà gẹ́gẹ́ bí ẹgbẹ́ kan.
- source_word: ἐπιστολάς
  choice: àwọn lẹ́tà
  rationale: Èyí pa ìtumọ̀ ìpilẹ̀ mọ́; àyíká ọ̀rọ̀ fúnra rẹ̀ fi hàn pé lẹ́tà àṣẹ ni wọ́n.
- source_word: πρὸς τοὺς ἀδελφούς
  choice: sí àwọn arákùnrin
  rationale: Ó pa akọ ọ̀pọ̀ nínú Gíríìkì mọ́ láì fi ìdánimọ̀ kan tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἐπορευόμην
  choice: mo sì ń lọ sí ibẹ̀
  rationale: Fọ́ọ̀mù àìpé náà fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn; àyíká ìtàn mú ìtọ́kasí ‘ibẹ̀’ ṣe kedere.
- source_word: ἄξων
  choice: láti mú ... lọ
  rationale: Future participle náà ń sọ ète ìrìn àjò; gbolohun yìí sì jẹ́ àdánidá ní Yorùbá.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: àwọn tí ó wà níbẹ̀
  rationale: Ó tú gbólóhùn participle tí a lò bí orúkọ náà jáde ní kedere.
- source_word: δεδεμένους
  choice: ní ìdè
  rationale: Ó ṣàfihàn ipò wọn gẹ́gẹ́ bí ẹlẹ́wọ̀n láì sọ irú ohun ìdè kan pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἵνα τιμωρηθῶσιν
  choice: kí a lè fìyà jẹ wọ́n
  rationale: Ó sọ ète ìgbésẹ̀ náà ní Yorùbá tí ó ṣe kedere, láì sọ irú ìjìyà tí orísun kò dárúkọ.
theological_decisions:
- issue: Bí a ṣe máa tú ἀδελφοί níbi tí ó ti lè tọ́ka sí àwùjọ tí ó gbòòrò ju àwọn ọkùnrin lọ
  choice: sí àwọn arákùnrin
  alternative: sí àwọn arákùnrin àti arábìnrin; sí àwọn Júù ẹlẹgbẹ́ wọn
  rationale: A pa fọ́ọ̀mù akọ ọ̀pọ̀ Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́. Nítorí ἀδελφοί lè ní ìtumọ̀ àwùjọ tí ó gbòòrò ní àwọn àyíká kan, a fi àṣàyàn náà sínú àlàyé ìsàlẹ̀ dípò kí a pinnu rẹ̀ nínú ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A lo ‘olórí àlùfáà’ àti ‘ìgbìmọ̀ àwọn alàgbà’ láti yẹra fún ọ̀rọ̀ ẹ̀sìn àkànṣe tí kò ṣe kedere.
