revisions:
- from: Gẹ́gẹ́ bí olórí àlùfáà àti gbogbo ìgbìmọ̀ àwọn alàgbà pẹ̀lú ṣe lè jẹ́rìí fún mi. Ọ̀dọ̀ wọn ni mo sì ti gba àwọn lẹ́tà sí àwọn arákùnrin ní Damásíkù[a], mo sì ń lọ sí ibẹ̀ láti mú àwọn tí ó wà níbẹ̀ pẹ̀lú ní ìdè lọ sí Jerúsálẹ́mù, kí a lè fìyà jẹ wọ́n.
  to: Gẹ́gẹ́ bí àlùfáà àgbà àti gbogbo ìgbìmọ̀ àwọn alàgbà pẹ̀lú ṣe lè jẹ́rìí fún mi. Ọ̀dọ̀ wọn ni mo sì ti gba àwọn lẹ́tà sí àwọn arákùnrin ní Damásíkù[a], mo sì ń lọ sí ibẹ̀ láti mú àwọn tí ó wà níbẹ̀ pẹ̀lú ní ìdè lọ sí Jerúsálẹ́mù, kí a lè fìyà jẹ wọ́n.
  rationale: The sole textual revision changes the designation of the high priest to the standard Yoruba term àlùfáà àgbà. The syntax, the deliberately gender-accurate rendering àwọn arákùnrin, the supplied lexical-alternative footnote, and the source’s ambiguity concerning the identity of the detainees and the agent of punishment are retained.
  reviewer_model: gpt-5.6-terra
