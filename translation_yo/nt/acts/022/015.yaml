  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ọjọ́ iwájú náà, ‘ẹlẹ́rìí,’ àwùjọ ‘gbogbo ènìyàn,’ àti ohun tí a ti rí tí a sì ti gbọ́ wà níbẹ̀. ‘Nítorí’ sì yẹ fún ὅτι nínú àyíká àlàyé ìránṣẹ́ yìí.'
