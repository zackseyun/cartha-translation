source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: yo
  text: Nítorí ìwọ yóò jẹ́ ẹlẹ́rìí fún un sí gbogbo ènìyàn nípa ohun tí o ti rí tí o sì ti gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹlẹ́rìí nípa rẹ̀.’ Dátífù Gíríìkì níbí lè tọ́ka sí ẹni tí ẹ̀rí náà jẹ́ nípa rẹ̀, tàbí ẹni tí a ń jẹ́rìí fún.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó mú agbára àlàyé tí ὅτι ní nínú ọ̀rọ̀ ìránṣẹ́ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἔσῃ
  choice: ìwọ yóò jẹ́
  rationale: Ó fi ọjọ́ iwájú hàn kedere, ìtẹnumọ́ ‘ìwọ’ sì bá ìránṣẹ́ tí a ń fún Paulu mu.
- source_word: μάρτυς
  choice: ẹlẹ́rìí
  rationale: Ọ̀rọ̀ Yorùbá tí ó péye fún ẹni tí ń jẹ́rìí sí ohun tí ó rí tàbí tí ó gbọ́.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó sọ pé Paulu yóò jẹ́rìí ní ti ẹni náà tàbí ní ipò rẹ̀, láìfi dandan yanjú gbogbo ìtumọ̀ dátífù náà.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: sí gbogbo ènìyàn
  rationale: Ó fi ìtọ́sọ́nà ẹ̀rí sí gbogbo ènìyàn hàn, ó sì lò ‘ènìyàn’ ní ìtumọ̀ àpapọ̀ tí kò dá lórí akọ nìkan.
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: nípa ohun tí o ti rí tí o sì ti gbọ́
  rationale: ‘Nípa’ so ohun tí Paulu rí àti ohun tí ó gbọ́ mọ́ àkóónú ẹ̀rí rẹ̀; ‘ti rí’ àti ‘ti gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìrírí tí ó ti ṣẹlẹ̀ hàn.
theological_decisions:
- issue: Ìtumọ̀ αὐτῷ nínú ìránṣẹ́ Paulu
  choice: fún un
  alternative: sí i
  rationale: ‘Fún un’ bá ọ̀rọ̀ jíjẹ́ ẹlẹ́rìí ní ti Olúwa/Jésù mu dáadáa; àlàyé ìsàlẹ̀ pa àṣàyàn dátífù ‘sí i’ mọ́ kí a má bàa pa àìdánilójú Gíríìkì rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣe kedere fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
