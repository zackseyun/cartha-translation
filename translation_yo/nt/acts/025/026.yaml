id: ACT.25.26
reference: Acts 25:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: yo
  text: Ní ti ọkùnrin yìí, èmi kò ní ohun tí ó dájú láti kọ sí olúwa mi.[a] Ìdí nìyẹn tí mo fi mú un wá síwájú gbogbo yín, pàápàá jù lọ síwájú rẹ, Ọba Agrippa, kí n lè ní ohun kan láti kọ lẹ́yìn tí a bá ti ṣe ìwádìí ẹjọ́ náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣíṣe kedere sí i, “sí Késárì.” Èdè Gíríìkì ní “sí olúwa mi,” akọ́lé ìbòwọ̀ tí wọ́n máa ń lò fún ọba-ọba ní àyíká yìí.
    reason: alternative_reading
  - marker: b
    text: “Ìwádìí ẹjọ́” tún lè túmọ̀ sí “ìgbọ́ ẹjọ́” tàbí “àyẹ̀wò ẹjọ́”; ó ń tọ́ka sí ìwádìí ìdájọ́ nípa ẹjọ́ Paulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: ohun pàtó kan
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó dájú, tí ó ṣeé gbára lé, tàbí tí ó ṣe kedere. Nínú ọ̀rọ̀ ìṣàkóso àti ẹjọ́ yìí, “ohun pàtó kan” fi hàn pé Festu kò tíì ní ẹ̀sùn tàbí àlàyé tó fẹsẹ̀ múlẹ̀ láti kọ.
- source_word: τῷ κυρίῳ
  choice: sí olúwa mi
  rationale: “Olúwa mi” pa ìtumọ̀ κύριος mọ́ nínú ọ̀rọ̀ ìbòwọ̀ ìṣàkóso; nínú àyíká yìí, olú ọba Róòmù ni ó ń tọ́ka sí, gẹ́gẹ́ bí àlàyé ìsàlẹ̀ ṣe sọ.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: mo fi mú un wá síwájú gbogbo yín
  rationale: Èyí ṣàfihàn mímú Paulu jáde wá síwájú àwùjọ, ó sì pa ọ̀pọ̀-orúkọ ὑμῶν mọ́ nípasẹ̀ “gbogbo yín.”
- source_word: μάλιστα ἐπὶ σοῦ
  choice: pàápàá jù lọ síwájú rẹ
  rationale: Ó ya Agrippa sọ́tọ̀ kúrò lára gbogbo àwùjọ, ó sì fi ìtẹnumọ́ μάλιστα hàn.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: lẹ́yìn tí a bá ti ṣe ìwádìí ọ̀ràn náà
  rationale: ἀνάκρισις jẹ́ ìwádìí, ìgbọ́jọ́, tàbí àyẹ̀wò nípa ẹjọ́. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìṣe tí yóò kọ́kọ́ ṣẹlẹ̀ kí Festu tó rí ohun tí yóò kọ.
- source_word: σχῶ τί γράψω
  choice: kí n lè ní ohun kan láti kọ
  rationale: Ó pa èrò idi ὅπως àti ìtumọ̀ pé kí Festu rí ohun tó yẹ fún ìròyìn rẹ̀ mọ́, ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ κύριος ní àyíká ìjọba, kì í ṣe nípa Ọlọ́run
  choice: olúwa mi
  alternative: Olú Ọba Róòmù
  rationale: Ìtumọ̀ àkọ́kọ́ pa ọ̀rọ̀ orísun náà mọ́ àti ìbòwọ̀ tí Festu fi ń pe alákòóso rẹ̀. Àlàyé ìsàlẹ̀ mú ẹni tí akọ́lé náà ń tọ́ka sí ṣe kedere láì fi ìtumọ̀ ìtúmọ̀-síni sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “gbogbo yín” láti pa ọ̀pọ̀-orúkọ mọ́, lẹ́yìn náà “rẹ” fún Agrippa nìkan. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá.
