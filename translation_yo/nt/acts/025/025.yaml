  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: yo
  text: Ṣùgbọ́n mo rí i pé kò ṣe ohunkóhun tí ó yẹ fún ikú; ṣùgbọ́n níwọ̀n bí òun fúnra rẹ̀ ti pe ẹjọ́ sí Olú Ọba Róòmù[a], mo pinnu láti rán an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gọ́sítọ́sì.” Oyè Gíríìkì náà, Σεβαστός, tọ́ka sí Olú Ọba ilẹ̀ Róòmù níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: mo rí i
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, ó túmọ̀ sí ohun tí Fẹ́sítù rí tàbí parí èrò sí lẹ́yìn àyẹ̀wò; ‘mo rí i’ jẹ́ Yorùbá àdánidá tí kò fi agbára ìpinnu òfin kún ọ̀rọ̀ náà.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: kò ṣe ohunkóhun tí ó yẹ fún ikú
  rationale: Èyí pa ìtumọ̀ pé kò sí ìṣe kankan tí ó tọ́ sí ikú mọ́, láì fi gbólóhùn òfin kan bí ‘ìjìyà ikú’ kún ọ̀rọ̀ Gíríìkì.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: nígbà tí òun fúnra rẹ̀ sì fi ẹjọ́ rẹ̀ pe
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ arọ́pò-orúkọ mọ́; ‘nígbà tí’ fi ipò tí ó yọrí sí ìpinnu Fẹ́sítù hàn láì mú ìdí pàtó ju bí Gíríìkì ṣe sọ lọ.
- source_word: τὸν Σεβαστόν
  choice: Ẹni Ọ̀wọ̀ Jù Lọ
  rationale: A túmọ̀ orúkọ oyè Gíríìkì náà ní ọ̀nà tí ó pa ìtumọ̀ ‘ẹni tí a bọ̀wọ̀ fún jù lọ’ mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó tọ́ka sí Olú Ọba Róòmù.
- source_word: ἔκρινα
  choice: mo pinnu
  rationale: Ọ̀rọ̀ náà ń sọ ìpinnu iṣẹ́ ìjọba Fẹ́sítù; ‘mo pinnu’ jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: πέμπειν
  choice: láti rán an lọ
  rationale: Àfikún arọ́pò-orúkọ ‘an’ wá láti inú àyíká ọ̀rọ̀, ó sì jẹ́ kí gbólóhùn náà pé ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘fi ẹjọ́ rẹ̀ pe’ fún ìpe ẹjọ́ sí aláṣẹ gíga, a sì pa orúkọ oyè Σεβαστός mọ́ ní ara ẹsẹ̀ pẹ̀lú àlàyé ní ìsàlẹ̀ ojú ìwé.
