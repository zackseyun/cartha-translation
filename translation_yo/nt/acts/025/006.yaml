id: ACT.25.6
reference: Acts 25:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti lo ọjọ́ mẹ́jọ tàbí mẹ́wàá péré láàárín wọn, ó sọ̀kalẹ̀ sí Kesaria. Ní ọjọ́ kejì, ó jókòó lórí àga ìdájọ́[a], ó sì pàṣẹ pé kí a mú Paulu wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jókòó lórí ìtẹ́ ìdájọ́.” Ọ̀rọ̀ Gíríìkì βῆμα ń tọ́ka sí àga tàbí pèpéle ìjọba tí aláṣẹ ti ń gbọ́ ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Lẹ́yìn tí ó lo ... láàárín wọn
  rationale: Ìtumọ̀ yìí fi iṣẹ́ tí ó ṣáájú hàn ní Yorùbá àdánidá, ó sì túmọ̀ ἐν αὐτοῖς sí wíwà láàárín àwọn ènìyàn tí a mẹ́nu kàn ṣáájú.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: ọjọ́ tí kò ju mẹ́jọ tàbí mẹ́wàá lọ
  rationale: Ó pa ààlà tí ọ̀rọ̀ Gíríìkì fi lélẹ̀ mọ́, ó sì dá àìdánilójú láàárín mẹ́jọ àti mẹ́wàá dúró láìsọ ọ́ di iye pàtó.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: ó sọ̀ kalẹ̀ lọ sí Kesaria
  rationale: ‘Sọ̀ kalẹ̀’ pa ìtọ́sọ́nà ìrìnàjò láti Jerusalẹmu sí Kesaria mọ́, nígbà tí ‘lọ sí’ mú gbólóhùn náà ṣe kedere ní Yorùbá.
- source_word: τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ọ̀nà Yorùbá tó ṣe kedere àti ti àdánidá fún ọjọ́ tí ó tẹ̀ lé ọjọ́ tí ó dé.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: ó jókòó lórí ìtẹ́ ìdájọ́
  rationale: βῆμα ní àyíká yìí ni ibi ìjókòó aláṣẹ fún ṣíṣe ìdájọ́; ‘ìtẹ́ ìdájọ́’ sọ iṣẹ́ òfin rẹ̀ di mímọ̀ láìfi àlàyé tó pọ̀ kún ọ̀rọ̀ náà.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: ó sì pàṣẹ pé kí wọ́n mú Paulu wá
  rationale: ‘Pàṣẹ’ bá àṣẹ onídàájọ́ mu, ìṣètò ‘kí wọ́n mú ... wá’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ àìṣe-tọ́ka ẹni ti ἀχθῆναι.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbéléwọ̀n tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A gbe àmì àlàyé [a] sí ‘ìtẹ́ ìdájọ́,’ níbi tí àlàyé βῆμα ti jẹ mọ́, dípò lẹ́yìn iye ọjọ́.
