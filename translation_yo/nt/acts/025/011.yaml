id: ACT.25.11
reference: Acts 25:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: yo
  text: Ǹjẹ́ bí mo bá ń ṣe àìṣòdodo, tí mo sì ti ṣe ohun kan tí ó yẹ fún ikú, èmi kò kọ̀ láti kú. Ṣùgbọ́n bí ohun tí àwọn ọkùnrin wọ̀nyí fi ń fẹ̀sùn kàn mí kò bá ní ìpìlẹ̀ kankan, kò sí ẹni tí ó lè fi mí lé wọn lọ́wọ́ gẹ́gẹ́ bí ojúrere.[a] Mo pe ẹjọ́ sí Kesari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sí ẹni tí ó lè fi mí fún wọn láti tẹ́ wọn lọ́rùn.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ fífi ẹnì kan lé ẹlòmíràn lọ́wọ́ gẹ́gẹ́ bí ojúrere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: mo bá ń ṣe àìṣòdodo
  rationale: Fọ́ọ̀mù ìsinsìnyí ń tọ́ka sí ṣíṣe ohun tí kò tọ́ ní ìhà ìwà àti òfin; ‘ń ṣe àìṣòdodo’ pa agbára méjèèjì mọ́.
- source_word: ἄξιον θανάτου
  choice: tí ó yẹ fún ikú
  rationale: Ó fi hàn pé ohun tí a ṣe lè tọ́ sí ìdájọ́ ikú, láìfi èrò òfin mìíràn kún un.
- source_word: πέπραχά τι
  choice: mo sì ti ṣe ohun kan
  rationale: ‘Ti ṣe’ fi ìṣe tí ó ti parí ṣùgbọ́n tí ó ṣì ṣe pàtàkì nísinsìnyí hàn; ‘ohun kan’ pa τι tí kò ṣe pàtó mọ́.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: èmi kò kọ̀ láti kú
  rationale: Ó túmọ̀ παραιτοῦμαι gẹ́gẹ́ bí kíkọ̀ tàbí yíyẹra fún ohun kan, ó sì jẹ́ Yorùbá àdánidá.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: kò bá sí òtítọ́ kankan nínú ohun tí àwọn ọkùnrin wọ̀nyí fi ń fẹ̀sùn kàn mí
  rationale: Gbólóhùn náà sọ pé ẹ̀sùn wọn kò ní ìpìlẹ̀ tàbí òtítọ́; ọ̀nà yìí ṣe kedere ní Yorùbá láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- source_word: χαρίσασθαι
  choice: fi mí lé wọn lọ́wọ́ gẹ́gẹ́ bí ojúrere
  rationale: Ó pa ìtumọ̀ fífi ẹnì kan fún ẹlòmíràn gẹ́gẹ́ bí ojúrere tàbí láti tẹ́ wọn lọ́rùn mọ́.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Mo pe ẹjọ́ kòtẹ́milọ́rùn sí Kesari
  rationale: Ó jẹ́ ọ̀rọ̀ òfin fún kíké sí alákòóso gíga jù lọ pé kí ó tún ẹjọ́ náà gbọ́; ‘ẹjọ́ kòtẹ́milọ́rùn’ mú èyí yé kedere.
- source_word: μὲν οὖν ... δὲ
  choice: Ǹjẹ́ bí ... Ṣùgbọ́n bí
  rationale: Àwọn ọ̀rọ̀ asopọ̀ yìí ṣètò apá àkọ́kọ́ tí Pọ́ọ̀lù gbà gẹ́gẹ́ bí àídájú, wọ́n sì fi í wé apá kejì ní ìtakora.
theological_decisions:
- issue: Ìtumọ̀ ìdájọ́ nínú gbólóhùn Pọ́ọ̀lù nípa ikú àti kòtẹ́milọ́rùn
  choice: Pọ́ọ̀lù sọ lábẹ́ àídájú pé òun kò ní kọ ikú bí òun bá jẹ̀bi ohun tí ó tọ́ sí ikú, ṣùgbọ́n ó sẹ́ pé a lè fi òun lé àwọn olùfisùn lọ́wọ́ láìsí ìdájọ́ òdodo.
  alternative: Kí a ka ọ̀rọ̀ náà sí ọ̀rọ̀ àsọdùn lásán tí kò jẹ́wọ́ bó ṣe yẹ tàbí bó ṣe tọ́ pé ìlànà ìdájọ́ náà lè dá ẹnì kan lẹ́bi.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbé àídájú àti ìtakora méjèèjì kalẹ̀. Ìtumọ̀ náà pa ìfọkànsìn òfin mọ́, láìsọ ọ́ di ẹ̀kọ́ gbogbogbò nípa ìjìyà ikú.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Fẹ̀sùn kàn’ àti ‘ẹjọ́ kòtẹ́milọ́rùn’ mú àyíká òfin hàn gbangba fún òǹkàwé lónìí; ‘Kesari’ jẹ́ akọlé-órúkọ tí ó wọ́pọ̀ nínú ìtumọ̀ Bíbélì Yorùbá.
