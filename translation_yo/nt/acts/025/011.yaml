  source_fidelity: Ìtumọ̀ náà pa ètò àídájú àti ìtakora ti Gíríìkì mọ́, pẹ̀lú ìmúṣẹ́ ìsinsìnyí nínú “ń ṣe,” ìṣe tí ó ti parí nínú “ti ṣe,” àti ìfẹ́ ẹni tó ń ṣe ìpinnu nínú χαρίσασθαι. Síbẹ̀, “òótítọ́ kankan” mú ìdánilójú ‘òtítọ́’ wọlé sí ọ̀rọ̀ tí ó sọ ní pàtàkì pé àwọn ẹ̀sùn náà kò ní nǹkan tàbí ìpìlẹ̀. “Ẹjọ́ kòtẹ́milọ́rùn” sì lè tọ́ka sí ilé-ẹjọ́ kòtẹ́milọ́rùn, nígbà tí Gíríìkì jẹ́ ìkéde ìbẹ̀bẹ̀ òfin taara sí Kesari.
  naturalness: Yorùbá náà rọrùn, ó sì bójú mu fún ìforígbárí òfin. “Fi mí lé wọn lọ́wọ́ gẹ́gẹ́ bí ojúrere” jẹ́ àdánidá, ó sì dá ìtumọ̀ ọ̀rọ̀ náà hàn. “Mo pe ẹjọ́ sí Kesari” jẹ́ kúkúrú, ó sì ṣàfihàn ìbẹ̀bẹ̀ òfin náà láìdárúkọ irú ilé-ẹjọ́ kan tí orísun kò mẹ́nu kàn.
