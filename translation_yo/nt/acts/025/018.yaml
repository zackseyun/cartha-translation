source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: yo
  text: Nípa rẹ̀, nígbà tí àwọn olùfisùn náà dìde, wọn kò mú ẹ̀sùn kankan wá nípa àwọn ohun búburú[a] tí mo ń fura pé ó ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò mú ẹ̀sùn kankan wá nípa àwọn ìwà ọ̀daràn tí mo fura pé ó ṣe.” Ọ̀rọ̀ Gíríìkì náà sọ pé “àwọn ohun búburú,” èyí sì lè tọ́ka sí ìwà àìtọ́ lápapọ̀ ju àwọn ìwà ọ̀daràn tí òfin ṣe àlàyé lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: nípa rẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí tọ́ka sí Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tí ẹjọ́ náà dá lé lórí; ‘nípa rẹ̀’ jẹ́ èdè Yorùbá àdánidá.
- source_word: σταθέντες οἱ κατήγοροι
  choice: nígbà tí àwọn olùfisùn rẹ̀ dìde láti sọ̀rọ̀
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí. Fífi ‘láti sọ̀rọ̀’ kún un mú ìṣe dídìde ní ilé ẹjọ́ yé kedere láì yí kókó rẹ̀ padà.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: wọn kò fi ẹ̀sùn kankan ... kàn án
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún gbígbé ẹ̀sùn wá sí ẹni kan, ó sì pa àyíká ilé ẹjọ́ mọ́.
- source_word: ὧν ἐγὼ ὑπενόουν πονηρῶν
  choice: nípa àwọn ohun búburú tí mo rò pé ó ṣe
  rationale: ‘Àwọn ohun búburú’ pa ìtúmọ̀ πονηρῶν tí kò fi dandan mọ̀ sí ìwà ọ̀daràn nìkan mọ́; ‘tí mo rò pé ó ṣe’ sọ èrò Fẹ́sítọ̀sì ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣe kedere fún òǹkàwé gbogbogbò ni a lò. Ìtumọ̀ náà pa àyíká ilé ẹjọ́ mọ́, ṣùgbọ́n kò sọ πονηρῶν di ‘ìwà ọ̀daràn’ nínú ọ̀rọ̀ pàtàkì.
