  source_fidelity: Ìtumọ̀ yìí tọ́ka sí Pọ́ọ̀lù dáadáa, ó sì pa àyíká ẹjọ́ mọ́. Síbẹ̀, ‘rẹ̀’ nínú ‘àwọn olùfisùn rẹ̀’ àti ìtún ‘nípa rẹ̀’ lẹ́yìn ‘láti sọ̀rọ̀’ jẹ́ àfikún tí kò ṣe pàtàkì. Pàtàkì jù lọ, àlàyé ìsàlẹ̀ atilẹba fi ìtumọ̀ ọjọ́ iwájú (‘wọn yóò fi kàn án’) kún ọrọ̀ náà, nígbà tí Gíríìkì sọ nípa ohun tí Fẹ́sítọ̀sì ti ń fura sí.
  naturalness: ‘Nípa rẹ̀, nígbà tí àwọn olùfisùn náà dìde’ jẹ́ Yorùbá ìgbàlódé, ó sì ń mú ìbẹ̀rẹ̀ gbolóhùn Gíríìkì náà hàn. ‘Mo ń fura pé ó ṣe’ jẹ́ ọ̀nà àdánidá láti sọ ìfura Fẹ́sítọ̀sì, pẹ̀lú ìmọ̀lára imperfect náà.
  terminology: ‘Olùfisùn’ àti ‘mú ẹ̀sùn ... wá’ bá ìlò ilé-ẹjọ́ mu. ‘Àwọn ohun búburú’ ń ṣọ́ra kí πονηρῶν má bàa di ‘ìwà ọ̀daràn’ nìkan; àṣàyàn ‘ìwà ọ̀daràn’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
