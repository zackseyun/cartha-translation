  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: yo
  text: Nítorí náà, nígbà tí wọ́n péjọ síhìn-ín, mi ò ṣe ìdádúró kankan; ní ọjọ́ kejì, mo jókòó lórí ìtẹ́ ìdájọ́[a], mo sì pàṣẹ pé kí a mú ọkùnrin náà wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo gba ipò mi lórí pèpéle ilé ẹjọ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìtẹ́ ìdájọ́ ti ìjọba tàbí pèpéle ilé ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: nígbà tí wọ́n péjọ
  rationale: Ó túmọ̀ àkójọpọ̀ àwọn olùfisùn tàbí àwọn tí ọ̀ràn náà kàn, ó sì fi ìṣe tó ṣáájú ìgbésẹ̀ Fẹ́sítù hàn lọ́nà àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí Fẹ́sítù ṣẹ̀ṣẹ̀ sọ, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn.
- source_word: ἐνθάδε
  choice: síhìn-ín
  rationale: Nínú ọ̀rọ̀ pé wọ́n péjọ, ‘síhìn-ín’ fi ìrìn wá sí ibi tí olùsọ wà hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: n kò jáfara rárá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún àìṣe ìdádúró tàbí àìsun ìgbẹ́jọ́ síwájú, láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: τῇ ἑξῆς
  choice: ní ọjọ́ kejì
  rationale: Ó tọ́ka sí ọjọ́ tó tẹ̀ lé e ní tààràtà.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: mo jókòó lórí ìtẹ́ ìdájọ́
  rationale: Ó pa àyíká iṣẹ́ ìdájọ́ mọ́, ó sì jẹ́ èdè tó ṣe kedere fún ipò ìjókòó aláṣẹ nígbà ìgbẹ́jọ́.
- source_word: ἐκέλευσα
  choice: mo sì pàṣẹ
  rationale: ‘Pàṣẹ’ bá àṣẹ onídàájọ́ tàbí aláṣẹ mu ju ọ̀rọ̀ tí yóò kan túmọ̀ sí ìbéèrè lọ.
- source_word: ἀχθῆναι
  choice: pé kí a mú ... wá
  rationale: Ìṣe afèyinti náà túmọ̀ sí pé kí àwọn ẹlòmíràn mú un dé iwájú Fẹ́sítù; ‘mú ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: τὸν ἄνδρα
  choice: ọkùnrin náà
  rationale: Ó túmọ̀ ọ̀rọ̀ náà ní tààràtà, láìfi ‘ẹlẹ́bi’ tàbí ‘olùjẹ́jọ́’ kún un.
