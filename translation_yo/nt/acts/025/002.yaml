translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A fi àmì ohùn síbi tí ó bá yẹ. ‘Àwọn aṣáájú láàárín àwọn Júù’ yẹra fún ọ̀rọ̀ àtijọ́ tí kò rọrùn, ‘ń rọ̀’ sì pa ìṣe tó ń bá a lọ mọ́.
