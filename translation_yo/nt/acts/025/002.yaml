  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti àwọn Júù ọlọ́lá sì fi ẹ̀sùn kan Paulu fún un[a], wọ́n sì ń rọ̀ ọ́ pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “sọ ọ̀ràn Paulu fún un” tàbí “gbé ẹ̀sùn kan Paulu kalẹ̀ níwájú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ọ̀ràn kan wá sí ìmọ̀ ẹni kan; nínú àyíká yìí, ó ṣeé ṣe kó ní ìtumọ̀ ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: fi ẹ̀sùn tí wọ́n ní sí Paulu tó Fẹ́sítù létí
  rationale: Nínú ọ̀rọ̀ ẹjọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọ̀ràn kan hàn sí aláṣẹ, ó sì lè ní ìtumọ̀ fífi ẹ̀sùn kan ẹni. Ìtumọ̀ yìí mú apá òfin náà jáde láìsọ pé ẹ̀sùn náà jẹ́ ìwé ẹ̀sùn tí a gbé kalẹ̀ lọ́nà pàtó.
- source_word: τέ
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ ìtàn tó ṣáájú rẹ̀ ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: αὐτῷ
  choice: tó Fẹ́sítù létí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Fẹ́sítù; lílo orúkọ rẹ̀ mú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere ní Yorùbá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún ẹgbẹ́ àwọn àlùfáà aláṣẹ ní Jerusalẹmu.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: àwọn aṣáájú láàárín àwọn Júù
  rationale: πρῶτοι ń tọ́ka sí àwọn ẹni pàtàkì tàbí olókìkí nínú àwùjọ; ‘àwọn aṣáájú láàárín àwọn Júù’ jẹ́ àdánidá, ó sì pa ìbáṣepọ̀ gírámà Gíríìkì mọ́.
- source_word: κατὰ τοῦ Παύλου
  choice: ẹ̀sùn tí wọ́n ní sí Paulu
  rationale: κατά pẹ̀lú gẹnitífù níbí fi ìtakò àti ẹ̀sùn hàn, kì í ṣe pé wọ́n kàn ń sọ nípa Paulu.
- source_word: παρεκάλουν
  choice: wọ́n sì ń rọ̀
  rationale: Àkókò imperfect fi ìrọ̀ tí ó ń bá a lọ tàbí tí a tún ṣe hàn; ‘ń rọ̀’ bá agbára ọ̀rọ̀ náà mu láìsọ ọ́ di ẹ̀bẹ̀ onírẹ̀lẹ̀ ju bó ṣe yẹ lọ.
- source_word: αὐτόν
  choice: ọ́
  rationale: Arọ́pò-orúkọ náà tún ń tọ́ka sí Fẹ́sítù gẹ́gẹ́ bí ẹni tí wọ́n ń rọ̀.
