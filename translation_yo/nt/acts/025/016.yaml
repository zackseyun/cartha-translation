id: ACT.25.16
reference: Acts 25:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: yo
  text: Mo sì dá wọn lóhùn pé kì í ṣe àṣà àwọn ará Róòmù láti fi ẹnikẹ́ni lé ọwọ́ wọn[a][b] kí ẹni tí a fẹ̀sùn kàn tó ní àwọn olùfisùn rẹ̀ níwájú rẹ̀, tó sì ní àǹfààní láti gbèjà ara rẹ̀ nípa ẹ̀sùn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti fi ẹnikẹ́ni fún wọn gẹ́gẹ́ bí ojúrere”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan lé àwọn olùfisùn lọ́wọ́ láti tẹ́ ìbéèrè wọn lọ́rùn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ènìyàn kan”; ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, ṣùgbọ́n a lò ó ní ọ̀nà àpapọ̀ nínú àyíká òfin yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: àṣà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìlànà tàbí àṣà tí a ti ń tẹ̀ lé; “àṣà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá àyíká ìdájọ́ mu.
- source_word: Ῥωμαίοις
  choice: àwọn ará Róòmù
  rationale: Dative plural náà ń tọ́ka sí àwọn ará Róòmù gẹ́gẹ́ bí ẹgbẹ́ ènìyàn tí àṣà ìdájọ́ yìí jẹ́ tiwọn.
- source_word: χαρίζεσθαί
  choice: fi … léni lọ́wọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ẹni kan lé ẹlòmíràn lọ́wọ́ gẹ́gẹ́ bí ohun tí a ṣe láti tẹ́ ìbéèrè rẹ̀ lọ́rùn; àlàyé ẹsẹ̀ pa ìtumọ̀ ‘ṣe é gẹ́gẹ́ bí ojúrere’ mọ́.
- source_word: τινα ἄνθρωπον
  choice: ẹnikẹ́ni
  rationale: Gbólóhùn Gíríìkì jẹ́ akọ ní gírámà ṣùgbọ́n ó ń ṣiṣẹ́ ní ọ̀nà àpapọ̀ nínú ọ̀rọ̀ òfin; “ẹnikẹ́ni” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ àpapọ̀ náà mu.
- source_word: ὁ κατηγορούμενος
  choice: ẹni tí a fẹ̀sùn kàn
  rationale: Participulu náà ń tọ́ka sí ẹni tó wà lábẹ́ ẹ̀sùn; gbolohun yìí jẹ́ ti àdánidá, ó sì yé òǹkàwé lónìí.
- source_word: κατὰ πρόσωπον
  choice: dojú kọ
  rationale: Èyí pa èrò ìdojúkọ ara ẹni mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá fún wíwà níwájú àwọn olùfisùn ní tààràtà.
- source_word: τόπον … ἀπολογίας
  choice: ní àǹfààní láti gbèjà ara rẹ̀
  rationale: τόπος túmọ̀ sí àǹfààní níbí, kì í ṣe ibi kan; ἀπολογία jẹ́ ìgbèjà ẹni nínú ọ̀ràn òfin.
- source_word: ἐγκλήματος
  choice: ẹ̀sùn náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹ̀sùn òfin; “ẹ̀sùn” ṣe kedere láì jẹ́ ọ̀rọ̀ amọ̀jù.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ti òfin, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A pa ìtumọ̀ méjì inú χαρίζομαι mọ́ nípasẹ̀ àlàyé ẹsẹ̀.
