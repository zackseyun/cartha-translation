id: ACT.25.24
reference: Acts 25:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: yo
  text: Fẹstusi sì wí pé, “Ọba Àgírípà, àti gbogbo ẹ̀yin ọkùnrin tí ẹ wà pẹ̀lú wa, ẹ rí ọkùnrin yìí, ẹni tí gbogbo ogunlọ́gọ̀ àwọn Júù[a] bẹ̀ mí nípa rẹ̀, ní Jerúsálẹ́mù àti níhìn-ín, tí wọ́n ń ké jáde pé kò yẹ kí ó wà láàyè mọ́.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ọ̀pọ̀ ènìyàn àwọn Júù.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ àkójọpọ̀, ó sì ń fi bí Fẹstusi ṣe ṣàkótán ìtakò náà hàn; kò ṣe dandan kí ó túmọ̀ sí gbogbo Júù kọ̀ọ̀kan láìsí ìyàsọ́tọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “pé kò gbọ́dọ̀ wà láàyè mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: wí pé
  rationale: A lo ọ̀rọ̀ ìṣe ìtàn ní ọ̀nà tí ó bá Yorùbá àdánidá mu, nígbà tí ó ṣì ń pa ìgbésẹ̀ ọ̀rọ̀ Fẹ́sítù mọ́.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: gbogbo ẹ̀yin ọkùnrin tí ẹ wà pẹ̀lú wa
  rationale: Ó tọ́ka sí àwọn ọkùnrin tí wọ́n jọ wà níbi àpéjọ náà pẹ̀lú Fẹ́sítù àti àwọn ẹlẹgbẹ́ rẹ̀.
- source_word: θεωρεῖτε τοῦτον
  choice: ẹ rí ọkùnrin yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fa àfiyèsí àpéjọ sí Páùlù láìlo ọ̀rọ̀ àtijọ́ tàbí àṣẹ tí ó lágbára ju ti Gíríìkì lọ.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: gbogbo àwùjọ àwọn Júù
  rationale: “Àwùjọ” pa ìtumọ̀ ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ẹgbẹ́ kan mọ́, nígbà tí “gbogbo” ń fi ìtẹnumọ́ àsọyé Fẹ́sítù hàn láìjẹ́ kí a fi kún un pé gbogbo Júù kọ̀ọ̀kan ni.
- source_word: ἐνέτυχόν μοι
  choice: bẹ̀ mí nípa rẹ̀
  rationale: Nínú àyíká òfin yìí, gbólóhùn náà túmọ̀ sí pé wọ́n tọ Fẹ́sítù wá pẹ̀lú ẹ̀bẹ̀ tàbí ìbéèrè nípa Páùlù.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: ní Jerúsálẹ́mù àti níhìn-ín
  rationale: Ó pa ìtọ́kasí ibi méjèèjì mọ́; “níhìn-ín” ni Kesaria, ibi tí Fẹ́sítù ti ń sọ̀rọ̀.
- source_word: βοῶντες
  choice: tí wọ́n ń ké jáde
  rationale: Ó fi ohùn gíga àti ìtẹnumọ́ àwọn alatako hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: pé kò yẹ kí ó wà láàyè mọ́
  rationale: Ó pa èrò ìyẹ tàbí dandan inú δεῖ mọ́ láìyí i padà sí àṣẹ ìdájọ́ ikú tí a sọ ní tààrà.
theological_decisions:
- issue: Ìtọ́kasí sí “àwọn Júù” nínú ọ̀rọ̀ ẹ̀sùn òfin
  choice: A pa “àwọn Júù” mọ́ gẹ́gẹ́ bí Gíríìkì ti sọ, ṣùgbọ́n a lo “gbogbo àwùjọ” fún ọ̀rọ̀ ẹgbẹ́ náà.
  alternative: “gbogbo àwọn Júù” tàbí “àwọn olórí Júù”
  rationale: Ọ̀rọ̀ Gíríìkì sọ τῶν Ἰουδαίων ní kedere, nítorí náà kò yẹ kí a dín un kù sí àwọn olórí nìkan. Síbẹ̀, πλῆθος jẹ́ ọ̀rọ̀ àkójọpọ̀, ọ̀rọ̀ Fẹ́sítù sì jẹ́ àkótán ìtakò náà; kò pọndandan kí ó túmọ̀ sí gbogbo Júù kọ̀ọ̀kan láìsí àfiwé.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọlọ́lá tí ó bá àpéjọ ìjọba àti ọ̀rọ̀ òfin mu. A lo “Fẹ́sítù,” “Àgírípà,” àti “Jerúsálẹ́mù” gẹ́gẹ́ bí ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá.
