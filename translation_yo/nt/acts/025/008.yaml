  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ ọ̀rọ̀ Gíríìkì náà dáadáa: Pọ́ọ̀lù ń dá ara rẹ̀ láre nínú ọ̀rọ̀ ilé-ẹjọ́, ó sì sẹ́ pé ó ṣẹ̀ sí òfin àwọn Júù, tẹ́ńpìlì, tàbí Kesari. ‘Rárá’ pa ìfaramọ́ ìkọ̀sílẹ̀ tó pé pátápátá ti τι/ἥμαρτον mọ́.'
