  terminology: ‘Òfin àwọn Júù,’ ‘tẹ́ńpìlì,’ àti ‘Kesari’ dára, wọ́n sì pa orúkọ àti ìtọ́kasí ìtàn mọ́. ‘Dá ara rẹ̀ láre’ ń mú ìtumọ̀ ìgbẹ́jọ́ ti ἀπολογουμένου jáde láì dín un kù sí ọ̀rọ̀ ẹ̀kọ́ ìsìn nìkan.
