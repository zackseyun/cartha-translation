source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: yo
  text: Pọ́ọ̀lù dá ara rẹ̀ láre pé, “N kò ṣẹ̀ sí òfin àwọn Júù, tàbí sí tẹ́ńpìlì, tàbí sí Kesari rárá.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “N kò ṣẹ̀ sí òfin àwọn Júù, tàbí sí tẹ́ńpìlì, tàbí sí Kesari ní ọ̀nà kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: gbèjà ara rẹ̀
  rationale: 'Ó mú ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ náà jáde ní Yorùbá àdánidá: Pọ́ọ̀lù ń sọ̀rọ̀ láti dá ara rẹ̀ láre.'
- source_word: ὅτι
  choice: pé
  rationale: Pé ń ṣàgbékalẹ̀ ohun tí Pọ́ọ̀lù sọ nínú ìgbèjà rẹ̀ lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: νόμον τῶν Ἰουδαίων
  choice: òfin àwọn Júù
  rationale: Ó pa ìṣọ̀kan oníṣúra Gíríìkì mọ́, láì pinnu ju bóyá ìtọ́kasí náà jẹ́ ti ẹ̀yà, ilẹ̀, tàbí ẹ̀sìn.
- source_word: ἱερὸν
  choice: tẹ́ńpìlì
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí tẹ́ńpìlì àti agbègbè rẹ̀ lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
- source_word: Καίσαρά
  choice: Kesari
  rationale: A pa oyè-orúkọ alákòóso Róòmù mọ́ dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí olú ọba.
- source_word: τι
  choice: rárá
  rationale: Rárá ń fi ìkọ̀sílẹ̀ náà tẹnumọ́, ó sì mú ìtumọ̀ pé kò ṣẹ̀ ní ọ̀nà kankan jáde.
- source_word: ἥμαρτον
  choice: kò ṣẹ̀ sí
  rationale: Ṣẹ̀ sí pa ìsopọ̀ pẹ̀lú èrò ẹ̀ṣẹ̀ mọ́, ṣùgbọ́n ó tún bá ọ̀rọ̀ ẹ̀sùn àti ìrúfin mu ní àyíká ilé-ẹjọ́.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: tàbí ... tàbí ... tàbí
  rationale: Lẹ́yìn gbólóhùn ìkọ̀sílẹ̀ ‘kò ṣẹ̀,’ àtúnsọ tàbí yìí jẹ́ Yorùbá àdánidá, ó sì pa ìkọ̀sílẹ̀ mẹ́tẹ̀ẹ̀ta mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἥμαρτον láàárín ẹ̀ṣẹ̀ ìwà àti ẹ̀ṣẹ̀ òfin
  choice: kò ṣẹ̀ sí
  alternative: kò rú òfin sí; kò hu ìwà àìtọ́ sí
  rationale: Àyíká náà jẹ́ ti ilé-ẹjọ́, ṣùgbọ́n ἁμαρτάνω tún ní ìwọ̀n ìtumọ̀ ẹ̀ṣẹ̀. ‘Kò ṣẹ̀ sí’ pa ìfọ̀rọ̀wérọ̀ méjèèjì mọ́ láì sọ ọ́ di ọ̀rọ̀ òfin nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘gbèjà ara rẹ̀’ fún ọ̀rọ̀ ilé-ẹjọ́, ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, àti ‘Kesari’ fún oyè-orúkọ Róòmù.
