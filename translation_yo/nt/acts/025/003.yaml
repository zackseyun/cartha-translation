base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: yo
  text: Wọ́n ń bẹ̀ ẹ́ fún ìyọ̀ǹda kan lòdì sí Pọ́ọ̀lù, kí ó mú un lọ sí Jerúsálẹ́m[a], nígbà tí wọ́n ń ṣètò ìbùba láti pa á lójú ọ̀nà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó ránṣẹ́ pè é kí ó wá sí Jerúsálẹ́m.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ránṣẹ́ pè” tàbí “mú ẹni wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: Wọ́n ń bẹ̀ ẹ́ pé kí ó ṣe ojúrere kan sí wọn nípa Pọ́ọ̀lù
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí bíbéèrè ojúrere tàbí ìyọ̀ǹda kan tí yóò ṣiṣẹ́ lòdì sí Pọ́ọ̀lù. Lílo orúkọ Pọ́ọ̀lù mú ẹni tí àrọ́pò-orúkọ ń tọ́ka sí ṣe kedere nínú ẹsẹ tí ó dúró nikan, láìyí ipa ọ̀tá inú κατ’ αὐτοῦ padà.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: kí ó sì mú un wá sí Jerúsálẹ́m
  rationale: ὅπως pẹ̀lú subjunctive sọ ohun tí wọ́n ń béèrè tàbí ète rẹ̀. μεταπέμπομαι lè túmọ̀ sí ‘ránṣẹ́ pè’ tàbí ‘mú ẹni wá’; ‘mú un wá’ jẹ́ èdè Yorùbá àdánidá fún ṣíṣe ètò kí a gbé e wá, nígbà tí àlàyé ìsàlẹ̀ pa àṣàyàn lexical mọ́.
- source_word: ἐνέδραν ποιοῦντες
  choice: nígbà náà ni wọ́n ń dọdẹ dè é
  rationale: Ó jẹ́ participle tó ń ṣàpèjúwe ìṣe tí wọ́n ń ṣe lẹ́gbẹ̀ẹ́ ìbéèrè náà. ‘Dọdẹ dè é’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pípèsè ibùba fún ẹni kan.
- source_word: ἀνελεῖν αὐτὸν
  choice: láti pa á
  rationale: ἀναιρέω níbí túmọ̀ sí pípa ẹni; ‘pa á’ jẹ́ tààrà, ó sì kò fi ìtumọ̀ òfin tàbí ìdájọ́ míì kún un.
- source_word: κατὰ τὴν ὁδόν
  choice: lójú ọ̀nà
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún ibi tí ìṣẹ̀lẹ̀ yóò ti ṣẹlẹ̀ nígbà ìrìnàjò.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo ‘Pọ́ọ̀lù’ láti mú àtọ́ka ẹni ṣe kedere nítorí ẹsẹ náà dúró lọ́tọ̀.
