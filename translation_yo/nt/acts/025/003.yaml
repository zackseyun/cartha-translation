  to: Wọ́n ń bẹ̀ ẹ́ fún ìyọ̀ǹda kan lòdì sí Pọ́ọ̀lù, kí ó mú un lọ sí Jerúsálẹ́m[a], nígbà tí wọ́n ń ṣètò ìbùba láti pa á lójú ọ̀nà.
  rationale: Àtúnṣe náà mú ìtumọ̀ ‘lòdì sí i’ hàn gbangba, ó tún dá ìṣe ìbùba sípò gẹ́gẹ́ bí ìṣe tí ó ń lọ ní àkókò ìbéèrè náà. A pa àṣàyàn ‘mú un’ fún μεταπέμψηται mọ́, ṣùgbọ́n a lo ‘lọ sí Jerúsálẹ́m’ láti fi ìtọ́sọ́nà hàn ní Yorùbá adayeba. Àlàyé ìsàlẹ̀ pa àṣàyàn ‘ránṣẹ́ pè’ mọ́ láìfi ìtumọ̀ kan múlẹ̀ ju omi lọ.
