  source_fidelity: Ìtumọ̀ náà gba èrò pàtàkì ẹsẹ náà, ṣùgbọ́n “nípa Pọ́ọ̀lù” kò fi agbára κατ’ αὐτοῦ (“lòdì sí i”) hàn. “Nígbà náà” sì yí participle ἐνέδραν ποιοῦντες padà sí ìtọ́kasí àkókò ‘nígbà náà,’ dípò ìṣe ìgbẹ̀yìn tí wọ́n ń ṣe ní àkókò ìbéèrè náà. “Mú un wá sí Jerúsálẹ́m” tún lè dà bí ìṣípadà tó ń bọ̀ sí ibi olùsọ̀rọ̀; “mú un lọ sí” hàn ìtòsọ́nà εἰς Ἰερουσαλήμ kedere.
  naturalness: “Wọ́n ń bẹ̀ ẹ́” àti “láti pa á lójú ọ̀nà” jẹ́ Yorùbá tí ó mọ́. “Ṣètò ìbùba” jẹ́ ọ̀nà ìgbàlódé, tí ó kedere, láti sọ ìmúrasílẹ̀ ìkọlù ìfarapamọ́.
