  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: yo
  text: Nítorí náà, Fẹsitusi dáhùn pé a ń ṣọ́ Pọ́ọ̀lù mọ́ ní Kesarea, àti pé òun fúnra rẹ̀ fẹ́rẹ̀ẹ́ máa jáde lọ láìpẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: a ń ṣọ́ … mọ́
  rationale: Ọ̀rọ̀ náà jẹ́ infinitive passive, ó sì túmọ̀ sí pé a fi Pọ́ọ̀lù sí abẹ́ ìṣọ́; ‘ṣọ́ … mọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìdádúró ẹni ní àtìmọ́lé.
- source_word: εἰς Καισάρειαν
  choice: ní Kesaria
  rationale: Bí ó tilẹ̀ jẹ́ pé preposition εἰς wà nínú ẹ̀rí ìkọ̀wé yìí, pẹ̀lú ọ̀rọ̀ ìṣe τηρεῖσθαι ó ń tọ́ka sí ibi tí wọ́n ti ń pa á mọ́; ‘ní Kesaria’ ni Yorùbá àdánidá.
- source_word: ἑαυτὸν
  choice: òun fúnra rẹ̀
  rationale: Èyí pa ìtẹnumọ́ orísun mọ́ pé Fẹ́sítù fúnra rẹ̀ ni yóò lọ.
- source_word: ἐν τάχει
  choice: láìpẹ́
  rationale: Ó sọ pé ìjáde rẹ̀ yóò ṣẹlẹ̀ ní àkókò tí kò jìnnà, láìfi ìtumọ̀ míì kún un.
- source_word: ἐκπορεύεσθαι
  choice: fẹ́ máa jáde lọ
  rationale: Pẹ̀lú μέλλειν, gbólóhùn náà ń sọ ìpinnu tàbí ohun tó fẹ́ ṣẹlẹ̀ láìpẹ́; ‘fẹ́ máa jáde lọ’ jẹ́ Yorùbá tó rọrùn, ó sì pa ìtumọ̀ ìlọkúrò mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún, a sì kọ orúkọ ilẹ̀ náà sí ‘Kesaria’ gẹ́gẹ́ bí ìpè Yorùbá tó ṣe kedere.
