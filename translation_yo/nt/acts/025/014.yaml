source:
  edition: SBLGNT
  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: yo
  text: Bí wọ́n sì ti lo ọ̀pọ̀ ọjọ́ níbẹ̀, Fẹ́sítù gbé ọ̀ràn nípa Paulu[b] kalẹ̀ fún ọba[a], ó ní, “Ọkùnrin kan wà tí Fẹ́likisi fi sílẹ̀ gẹ́gẹ́ bí ẹlẹ́wọ̀n.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ ọ̀ràn náà fún ọba.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ọ̀ràn kan síwájú ẹnì kan fún àgbéyẹ̀wò, kì í ṣe jíjíṣẹ́ ìròyìn lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbé ẹjọ́ Paulu kalẹ̀.” Gbólóhùn náà lè tọ́ka ní pàtàkì sí ipò ẹjọ́ Paulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: ọ̀pọ̀ ọjọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn afiwéra náà túmọ̀ sí àkókò ọjọ́ púpọ̀ tàbí ọjọ́ mélòó kan; “ọ̀pọ̀ ọjọ́” jẹ́ èdè Yorùbá àdánidá tó sì fi hàn pé wọ́n pẹ́ níbẹ̀.
- source_word: διέτριβον
  choice: wọ́n ... lo ... níbẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí lílo àkókò tàbí dídúró ní ibì kan; “wọ́n lo ọ̀pọ̀ ọjọ́ níbẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἀνέθετο
  choice: gbé ... kalẹ̀ fún
  rationale: Ó túmọ̀ sí fífi ọ̀ràn kan síwájú ẹnì kan fún àgbéyẹ̀wò, kì í ṣe fífi ìròyìn lásán.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: ọ̀ràn nípa Paulu
  rationale: Gbólóhùn náà lè tọ́ka sí gbogbo ohun tó kan Paulu, àti ní pàtàkì sí ẹjọ́ rẹ̀; “ọ̀ràn nípa Paulu” pa ìwọ̀n ìtumọ̀ yẹn mọ́ láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: Ἀνήρ τίς
  choice: Ọkùnrin kan wà
  rationale: Èyí fi ọkùnrin kan tí a kò tíì dárúkọ hàn gẹ́gẹ́ bí ẹni pàtó, ó sì bá ọ̀rọ̀ àsọyé Yorùbá mu.
- source_word: καταλελειμμένος
  choice: fi sílẹ̀
  rationale: 'Àbájáde ìṣe tó ti ṣẹlẹ̀ ṣì ń bá a lọ: Fẹ́likisi ti fi ọkùnrin náà sílẹ̀, ó sì ṣì wà ní ipò yẹn.'
- source_word: δέσμιος
  choice: ní ipò ẹlẹ́wọ̀n
  rationale: Èyí mú ipò rẹ̀ gẹ́gẹ́ bí ẹlẹ́wọ̀n hàn gbangba, láì fi kún un pé a kọ̀ ọ́ sílẹ̀ láìbìkítà.
- source_word: βασιλεῖ
  choice: ọba
  rationale: Orísun Gíríìkì sọ “ọba” nìkan ní ẹsẹ yìí; àyíká ọ̀rọ̀ ti fi hàn pé Àgírípà ni.
