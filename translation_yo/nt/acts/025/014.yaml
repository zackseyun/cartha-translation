translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó ní iyì tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “gbé ọ̀ràn ... kalẹ̀” láti pa ìtumọ̀ fífi ọ̀ràn síwájú ọba fún àgbéyẹ̀wò mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí ọkọọkan ń ṣàlàyé.
