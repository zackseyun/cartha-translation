id: ACT.25.23
reference: Acts 25:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: yo
  text: Nítorí náà, ní ọjọ́ kejì, Àgírípà àti Bẹ̀rẹ́níkè dé pẹ̀lú ọ̀pọ̀ ìṣèhàn[a], wọ́n sì wọ inú gbọ̀ngàn ìgbọ́-ẹjọ́ pẹ̀lú àwọn olórí ọmọ ogun àti àwọn ọkùnrin pàtàkì ìlú náà[b]. Nípa àṣẹ Fẹ́sítù, wọ́n mú Pọ́ọ̀lù wọlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìṣèhàn ńláǹlà” tàbí “pẹ̀lú ìṣèhàn ọlá ńlá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọkùnrin olókìkí ìlú náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Nítorí náà, ní ọjọ́ kejì
  rationale: Ó pa ìtẹ̀síwájú ìtàn tí οὖν ń fi hàn mọ́, ó sì tú gbólóhùn àkókò náà sí Yorùbá àdánidá.
- source_word: ἐλθόντος
  choice: dé
  rationale: Bí ó tilẹ̀ jẹ́ pé participle aorist ni nínú genitive absolute, ọ̀rọ̀-ìṣe aláṣẹ yìí jẹ́ àdánidá ní Yorùbá, ó sì fi ìparí ìrìn-àjò wọn hàn.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Àgírípà àti Bẹ́nííkè
  rationale: A kọ orúkọ àwọn ènìyàn náà ní ìbámu pẹ̀lú ìró wọn, pẹ̀lú àmì ohùn Yorùbá.
- source_word: μετὰ πολλῆς φαντασίας
  choice: pẹ̀lú ìṣafihàn ọlá ńlá
  rationale: φαντασία níbí ń tọ́ka sí ìṣehàn gbangba tó kún fún ọlá, ẹ̀ṣọ́ àti ìgberaga; yíyan yìí mú ìtumọ̀ náà jáde láìdín un kù sí ẹwà lásán.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: wọ inú gbọ̀ngàn ìgbọ́jọ́
  rationale: ἀκροατήριον jẹ́ ibi tí a ti ń gbọ́ ẹjọ́ tàbí ọ̀rọ̀ ní gbangba; ‘gbọ̀ngàn ìgbọ́jọ́’ bá àyíká ìjọba àti ẹjọ́ mu.
- source_word: σύν τε χιλιάρχοις
  choice: pẹ̀lú àwọn olórí ọmọ ogun
  rationale: χιλίαρχοι jẹ́ àwọn ọ̀gá ológun gíga ní ètò Róòmù. Ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá láìlo oyè Róòmù tí kò wọ́pọ̀.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: àwọn ọkùnrin pàtàkì ìlú náà
  rationale: Ó pa ìtọ́kasí sí akọ tí ἀνδράσιν ní mọ́, ó sì sọ ipò ọlá tàbí ọlá-àṣẹ wọn tí κατ’ ἐξοχήν ń tọ́ka sí.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: Nígbà tí Fẹ́sítù pàṣẹ
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tó mọ́ ní Yorùbá, láìsọ pé àkókò gígùn wà láàárín àṣẹ àti ìmú Pọ́ọ̀lù wọlé.
- source_word: ἤχθη ὁ Παῦλος
  choice: wọ́n mú Pọ́ọ̀lù wọlé
  rationale: Ìṣe àìṣe-láti-ọ̀dọ̀ ẹni tí ἤχθη fi hàn ni Yorùbá sábà máa ń sọ pẹ̀lú ‘wọ́n’ aláìlórúkọ; ‘mú ... wọlé’ fi hàn pé àwọn mìíràn ló darí rẹ̀ wọ inú gbọ̀ngàn náà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ìtòlẹ́sẹẹsẹ gbólóhùn Yorùbá àdánidá, a sì pa àyíká ìgbọ́jọ́ àti ìṣehàn ọlá ti ọ̀rọ̀ Gíríìkì mọ́.
