  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ ọ̀rọ̀ Gíríìkì dáadáa ní pàtàkì: ìwọlé Àgírípà àti Bẹ́rẹ́níkè, àwọn olórí ogun, àwọn ọkùnrin olókìkí ìlú, àti fífi Pọ́ọ̀lù wọlé nípa àṣẹ Fẹ́sítù. Síbẹ̀, “ìṣafihàn ọlá ńlá” lè yí φαντασία sí ‘fífi ọlá hàn,’ dípò ìṣèhàn/pageantry tí a hàn ní gbangba. A tún ṣe orúkọ Βερνίκη kí /r/ inú orúkọ Gíríìkì má bàa ṣòfò.'
