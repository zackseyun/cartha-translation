  terminology: A pa ‘àwọn olórí ọmọ ogun’ mọ́ fún χιλιάρχοι, nítorí ó ṣàfihàn ipò ológun gíga láìfi oyè Róòmù tí kò wọ́pọ̀ le òǹkàwé. “Àwọn ọkùnrin pàtàkì ìlú náà” pa akọ àti ipò gíga ἀνδράσιν ... κατ’ ἐξοχὴν mọ́. “Nípa àṣẹ Fẹ́sítù” jẹ́ ìtumọ̀ tó sún mọ́ κελεύσαντος τοῦ Φήστου.
