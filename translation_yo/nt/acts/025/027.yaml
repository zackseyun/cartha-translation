  to: Nítorí ó dà bí ohun tí kò bọ́gbọ́n mu lójú mi láti rán ẹlẹ́wọ̀n kan lọ láì sì sọ àwọn ẹ̀sùn tí wọ́n fi kàn án di mímọ̀.[a]
  rationale: A tún ìṣètò gbolohun náà ṣe kí participle πέμποντα ṣiṣẹ́ bí ayidayida rírán, kí μὴ καί hàn gẹ́gẹ́ bí ‘láì sì,’ kí σημαίνω sì túmọ̀ sí jíjẹ́ kí ẹ̀sùn di mímọ̀. Àlàyé ìsàlẹ̀ pa aṣàyàn ‘ní pàtó’ mọ́.
