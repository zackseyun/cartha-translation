source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: yo
  text: Nítorí ó dà bí ohun tí kò bọ́gbọ́n mu lójú mi láti rán ẹlẹ́wọ̀n kan lọ láì sì sọ àwọn ẹ̀sùn tí wọ́n fi kàn án di mímọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ àwọn ẹ̀sùn tí wọ́n fi kàn án ní pàtó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: ohun tí kò bógbọ́n mu
  rationale: Ọ̀rọ̀ yìí fi ohun tí kò ní ìdí tàbí tí kò bá ìrònú tó tọ́ mu hàn; gbólóhùn Yorùbá yìí jẹ́ adayeba, ó sì bá ìdájọ́ ọ̀rọ̀ ìṣàkóso Fẹ́sítù mu.
- source_word: δοκεῖ μοι
  choice: ó dà ... lójú mi
  rationale: Èyí pa ìtumọ̀ pé bí ọ̀ràn náà ṣe hàn sí olùsọ̀rọ̀ mọ́, láì sọ ìdájọ́ rẹ̀ di ohun tí kò ṣeé yí padà.
- source_word: πέμποντα
  choice: kí n rán ... lọ
  rationale: A tú participle náà sí ọ̀nà adayeba ní Yorùbá, ní ìbámu pẹ̀lú ẹni àkọ́kọ́ tí ọ̀rọ̀ δοκεῖ μοι tọ́ka sí.
- source_word: δέσμιον
  choice: ẹlẹ́wọ̀n kan
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ó wà lábẹ́ àtìmọ́lé tàbí àbójútó òfin.
- source_word: μὴ καὶ
  choice: kí n má sì ... pẹ̀lú
  rationale: Ìtumọ̀ ìfikún καί wà nínú “pẹ̀lú,” ó sì jẹ́ kí ìṣọ̀kan gbólóhùn náà dùn létí ní Yorùbá.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: àwọn ẹ̀sùn tí wọ́n fi kàn án
  rationale: Ní àyíká ìdájọ́, αἰτίαι túmọ̀ sí ẹ̀sùn tàbí ìfisùn; ọ̀nà yìí jẹ́ kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: σημᾶναι
  choice: sọ
  rationale: “Sọ” níbí túmọ̀ sí jíjẹ́ kí ẹ̀sùn náà di mímọ̀ nínú ìwé ìránṣẹ́; ó jẹ́ adayeba ju ìtumọ̀ líle bí “tọ́ka sí” lọ, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà pàtó “sọ ... ní pàtó” pamọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, adayeba, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ohun tí kò bógbọ́n mu” fún ìdájọ́ ìṣàkóso, a sì pa ìrẹ̀lẹ̀ inú δοκεῖ μοι mọ́ pẹ̀lú “ó dà ... lójú mi.”
