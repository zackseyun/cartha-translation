  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: yo
  text: Nígbà náà, Fẹ́sítù, lẹ́yìn tí ó ti jíròrò pẹ̀lú ìgbìmọ̀ náà, dáhùn pé, “O ti pe ẹjọ́ sí Késárì; sí Késárì ni ìwọ yóò lọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwájú Késárì ni ìwọ yóò lọ.” Gbólóhùn náà ní ìtumọ̀ òfin ti lílọ sí ilé-ẹjọ́ Késárì lẹ́yìn tí ẹni kan bá pe ẹjọ́ sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn lọ́nà àdánidá nínú ìtàn Yorùbá.
- source_word: συλλαλήσας
  choice: lẹ́yìn tí ó ti ... gbìmọ̀
  rationale: Ó mú kí ó ṣe kedere pé ìfọ̀rọ̀wérọ̀ náà ṣáájú ìdáhùn Fẹ́sítù, ó sì pa ìtumọ̀ ìgbìmọ̀-pọ̀ mọ́.
- source_word: μετὰ τοῦ συμβουλίου
  choice: bá ìgbìmọ̀ náà
  rationale: “Ìgbìmọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó bá ẹgbẹ́ amòfin tàbí olùdámọ̀ràn mu; a kò fi “tirẹ̀” kún un nítorí kò sí ní pàtó nínú Gíríìkì.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìtàn Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ọ̀rọ̀ ilé-ẹjọ́.
- source_word: Καίσαρα
  choice: Késárì
  rationale: A pa oyè-orúkọ Róòmù náà mọ́ ní ìkọ̀wé tó bá ìró Yorùbá mu.
- source_word: ἐπικέκλησαι
  choice: O ti pe ẹjọ́ rẹ lọ sí ọ̀dọ̀
  rationale: Perfect middle náà ní ìtumọ̀ òfin ti fífi ẹ̀bẹ̀ ẹjọ́ lọ sí ọba; gbólóhùn yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: ἐπὶ Καίσαρα
  choice: ọ̀dọ̀ Késárì
  rationale: Ó fi ìlọsí ibi tàbí àṣẹ ẹni tí a pe ẹjọ́ sí hàn, ṣùgbọ́n ó tún lè ní ìtumọ̀ dídúró níwájú ilé-ẹjọ́ rẹ̀.
- source_word: πορεύσῃ
  choice: ìwọ yóò lọ
  rationale: Ó túmọ̀ future middle gẹ́gẹ́ bí ìlọ tààrà, láìfi èrò passive pé a ó rán án kún ohun tí Gíríìkì sọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo “pe ẹjọ́ rẹ lọ sí ọ̀dọ̀” fún èdè òfin, a sì pa àṣàyàn ìtumọ̀ ἐπὶ mọ́ nínú àlàyé ìsàlẹ̀. Àmì àlàyé [a] wà lẹ́yìn gbogbo ọ̀rọ̀ tí ó kan.
