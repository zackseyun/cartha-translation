id: ACT.25.9
reference: Acts 25:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: yo
  text: Ṣùgbọ́n Fẹ́sítù, nítorí ó fẹ́ ṣe ojúrere fún àwọn Júù[a], dá Pọ́ọ̀lù lóhùn pé, “Ṣé o fẹ́ gòkè lọ sí Jerúsálẹ́mù, kí a sì dá ọ lẹ́jọ́ níbẹ̀ níwájú mi nítorí àwọn ọ̀ràn wọ̀nyí?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn Júù” níhìn-ín ń tọ́ka sí àwọn olùfisùn tàbí aṣáájú Júù tí wọ́n ń tẹ ẹjọ́ náà, kì í ṣe gbogbo Júù láìsí ìyàtọ̀. “Ṣe ojúrere fún” tún lè túmọ̀ sí “fi inú àwọn Júù dùn.”
    reason: Àlàyé àṣà àti àṣàyàn ìtumọ̀ ọ̀rọ̀.
  - marker: b
    text: “Dá ọ lẹ́jọ́ níwájú mi” tún lè jẹ́ “gbọ́ ẹjọ́ rẹ níwájú mi” tàbí “dá ọ lẹ́jọ́ lábẹ́ àṣẹ mi.”
    reason: Àṣàyàn ìtumọ̀ ọ̀rọ̀ òfin àti pípa ìtumọ̀ ἐπ’ ἐμοῦ tí kò ṣe kedere pátápátá mọ́.
lexical_decisions:
- source_word: θέλων
  choice: nítorí ó fẹ́
  rationale: Ó fi ìdí tí Fẹ́sítù fi dáhùn hàn, ó sì pa ìtumọ̀ ìfẹ́ tàbí ìpinnu tí participle náà ní mọ́ ní Yorùbá àdánidá.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; àyíká ìtàn fi hàn pé àwọn olùfisùn tàbí aṣáájú Júù tó ń tẹ ẹjọ́ náà ni a ń tọ́ka sí, kì í ṣe gbogbo Júù.
- source_word: χάριν καταθέσθαι
  choice: ṣe ojúrere fún
  rationale: Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì mú èrò fífi inú àwọn Júù dùn tàbí ṣíṣe ohun rere fún wọn jáde láìfi ète àrékérekè kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀποκριθεὶς
  choice: dá Pọ́ọ̀lù lóhùn pé
  rationale: Ìtumọ̀ Yorùbá tó wọ́pọ̀ fún participle ìtàn tí ó ṣáájú ọ̀rọ̀ tí a sọ.
- source_word: Θέλεις
  choice: Ṣé o fẹ́
  rationale: Ó béèrè ní tààrà nípa ohun tí Pọ́ọ̀lù fẹ́, láìyí i sí ìbéèrè nípa fífàyè gba nìkan.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: gòkè lọ sí Jerúsálẹ́mù
  rationale: Ó pa àwòrán 'gòkè lọ' mọ́, èyí tó bá ilẹ̀ Jerúsálẹ́mù àti ọ̀nà ìsọ̀rọ̀ Bíbélì mu.
- source_word: περὶ τούτων
  choice: nítorí àwọn ọ̀ràn wọ̀nyí
  rationale: Ó tọ́ka sí gbogbo ohun tí ẹjọ́ náà dá lé lórí láìfi ọ̀rọ̀ pàtó bí 'ẹ̀sùn' kún ohun tí Gíríìkì sọ.
- source_word: κριθῆναι
  choice: kí a sì dá ọ lẹ́jọ́
  rationale: Nínú àyíká òfin, èyí jẹ́ Yorùbá àdánidá fún jíjẹ́ ẹni tí a gbọ́ ẹjọ́ rẹ̀ tàbí dá lẹ́jọ́; ó pa àìdánilójú díẹ̀ tó wà láàárín 'try' àti 'judge' mọ́.
- source_word: ἐπ’ ἐμοῦ
  choice: níwájú mi
  rationale: Ó lè túmọ̀ sí níwájú Fẹ́sítù tàbí lábẹ́ àṣẹ rẹ̀; yíyan 'níwájú mi' kò fi dandan sọ pé òun nìkan ni yóò ṣe ìdájọ́.
theological_decisions:
- issue: Ṣíṣe àṣejù ọ̀rọ̀ “àwọn Júù” bí ẹni pé gbogbo Júù ni ó ń tọ́ka sí
  choice: Fi “àwọn Júù” sí ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ ojú ìwé sì sọ ẹni tí àyíká ń tọ́ka sí.
  alternative: àwọn aṣáájú Júù; àwọn olùfisùn Júù
  rationale: Ọ̀rọ̀ Gíríìkì gbòòrò ju àwọn àṣàyàn míì lọ, ṣùgbọ́n àyíká ìtàn dín ẹni tí a ń tọ́ka sí kù. Àlàyé náà dènà ìtumọ̀ tó lè mú ìkórìíra wá láìrọ́pò ọ̀rọ̀ orísun pẹ̀lú ìtumọ̀ tó ti dín kù.
- issue: Bóyá κριθῆναι túmọ̀ sí dídá lẹ́jọ́ tàbí gbígbọ́ ẹjọ́
  choice: kí a sì dá ọ lẹ́jọ́
  alternative: kí a gbọ́ ẹjọ́ rẹ; kí a ṣe ìdájọ́ rẹ
  rationale: Àyíká jẹ́ ti ilé ẹjọ́, ṣùgbọ́n ọ̀rọ̀ náà lè bo gbogbo ìṣe ìgbọ́ àti ìdájọ́ ẹjọ́. Ọ̀rọ̀ pàtàkì àti àlàyé pa ìfàgbárí yìí mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ṣé” nínú ọ̀rọ̀ tí a sọ láti jẹ́ kí ìbéèrè náà dà bí Yorùbá àdánidá; a sì lo “gòkè lọ” láti pa àwòrán orísun mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó bá jẹ́ àdánidá.
