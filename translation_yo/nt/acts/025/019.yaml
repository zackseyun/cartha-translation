  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: yo
  text: Kàkà bẹ́ẹ̀, wọ́n ní àwọn àríyànjiyàn kan pẹ̀lú rẹ̀ nípa ẹ̀sìn tiwọn[a] àti nípa Jésù kan tí ó ti kú, ẹni tí Paulu ń sọ pé ó wà láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ asán tiwọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀sìn láìsí ẹ̀gàn, tàbí kí àjèjì lò ó ní ọ̀nà ẹ̀gàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: àwọn ẹ̀sùn kan
  rationale: Nínú àyíká ọ̀rọ̀ ìgbẹ́jọ́ yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ọ̀ràn tí wọ́n ń jiyàn lórí, ìyẹn àwọn ẹ̀sùn wọn sí Paulu, kì í ṣe ìbéèrè lásán.
- source_word: δέ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ hàn láàárín àwọn ẹ̀sùn ọ̀daràn tí Festu retí àti irú ọ̀ràn tí àwọn olùfisùn mú wá ní ti gidi.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: jẹ mọ́ ẹ̀sìn tiwọn
  rationale: δεισιδαιμονία lè túmọ̀ sí ẹ̀sìn láìsí ẹ̀gàn tàbí sí ìgbàgbọ́ asán pẹ̀lú ìrẹ̀wẹ̀sì. “Ẹ̀sìn tiwọn” jẹ́ àdánidá, ó sì pa ojú ìwòye Festu gẹ́gẹ́ bí àjèjì mọ́.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: àti Jesu kan
  rationale: “Jesu kan” pa ìjìnnà àti àìmọ̀ Festu mọ́, bí τινος ṣe ń ṣiṣẹ́ pẹ̀lú orúkọ náà.
- source_word: τεθνηκότος
  choice: tí ó ti kú
  rationale: Perfect participle náà tọ́ka sí ẹni tí ó ti kú, ó sì pèsè ìyàtọ̀ pẹ̀lú ọ̀rọ̀ Paulu pé ó wà láàyè.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ẹni tí Paulu ń sọ pé ó wà láàyè
  rationale: “Ń sọ pé” ròyìn ohun tí Paulu ń tẹnumọ́ láti ojú Festu láìjẹ́ kí atúmọ̀ fọwọ́ sí i tàbí kọ ọ́ nínú gbólóhùn yìí.
theological_decisions:
- issue: Ìtumọ̀ δεισιδαιμονία nínú ọ̀rọ̀ Festu
  choice: ẹ̀sìn tiwọn
  alternative: ìgbàgbọ́ asán tiwọn
  rationale: “Ẹ̀sìn” kò fi ẹ̀gàn tó lágbára ju èdè Gíríìkì lọ sínú ọ̀rọ̀ Festu; àlàyé ìsàlẹ̀ pa ìtumọ̀ tí ó lè jẹ́ ti ẹ̀gàn mọ́.
- issue: Bí a ṣe ròyìn ọ̀rọ̀ nípa àjíǹde Jesu
  choice: ẹni tí Paulu ń sọ pé ó wà láàyè
  alternative: ẹni tí Paulu sọ pé ó wà láàyè
  rationale: Èyí fi hàn pé Festu ló ń ròyìn ìjẹ́rìí Paulu, kì í ṣe pé akọ̀wé ń ṣe ìjẹ́wọ́ tààrà nínú abala ọ̀rọ̀ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. “Jesu kan” pa ìjìnnà Festu mọ́; àmi ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tó kan ọ̀rọ̀ ẹ̀sìn.
