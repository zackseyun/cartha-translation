  to: Kàkà bẹ́ẹ̀, wọ́n ní àwọn àríyànjiyàn kan pẹ̀lú rẹ̀ nípa ẹ̀sìn tiwọn[a] àti nípa Jésù kan tí ó ti kú, ẹni tí Paulu ń sọ pé ó wà láàyè.
