translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa ìṣòro ìtumọ̀ καὶ αὐτός àti ἀκούσῃ αὐτοῦ mọ́ nípasẹ̀ àwọn akọsilẹ̀ ẹsẹ̀, láìyanjú wọn ní ìkọ̀kọ̀.
