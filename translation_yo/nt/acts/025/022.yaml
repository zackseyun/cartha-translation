  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: yo
  text: Nígbà náà ni Agripa sọ fún Fẹ́sítù pé, “Èmi fúnra mi fẹ́ gbọ́ ọkùnrin náà[a].” “Ọ̀la,” ni ó ní[b], “ìwọ yóò gbọ́ ọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi náà fẹ́ gbọ́ ọkùnrin náà.” Àpólà Gíríìkì καὶ αὐτός lè tẹnu mọ́ “èmi fúnra mi,” tàbí kí ó ní ìtumọ̀ àfikún, “èmi náà.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú ìtàn níbí: “ó ní.” Àwọn ìtumọ̀ kan lè sọ ọ́ di “ó sọ.”'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìwọ yóò gbọ́ láti ọ̀dọ̀ rẹ̀,” ìyẹn ni pé, ìwọ yóò gbọ́ ọ́ sọ̀rọ̀ tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń kọ orúkọ Gíríìkì yìí ní Yorùbá.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ó fi ìtàn náà tẹ̀ síwájú ní ọ̀nà àdánidá, láìfi ìtakora tó lágbára kún un.
- source_word: πρὸς τὸν Φῆστον
  choice: sọ fún Fẹ́sítù pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ẹni tí ọ̀rọ̀ náà ń lọ sí hàn.
- source_word: Ἐβουλόμην
  choice: fẹ́
  rationale: Nínú ọ̀rọ̀ yìí, àìpé ọ̀rọ̀-ìṣe náà fi ìfẹ́ Agripa hàn; ‘fẹ́’ jẹ́ kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: καὶ αὐτὸς
  choice: Èmi fúnra mi pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ αὐτός àti ìtumọ̀ àfikún καί mọ́, nítorí méjèèjì ṣeé gbà nínú Gíríìkì.
- source_word: τοῦ ἀνθρώπου
  choice: ọkùnrin náà
  rationale: Ó tọ́ka sí Pọ́ọ̀lù gẹ́gẹ́ bí ọkùnrin kan pàtó, kì í ṣe sí aráyé lápapọ̀.
- source_word: ἀκοῦσαι
  choice: gbọ́
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tó rọrùn mọ́, tí ó sì lè túmọ̀ sí gbígbọ́ ẹni náà sọ̀rọ̀ tàbí gbígbọ́ ẹjọ́ rẹ̀.
- source_word: Αὔριον
  choice: Ọ̀la
  rationale: Ìtumọ̀ tààrà ti ọ̀rọ̀ àkókò náà.
- source_word: φησίν
  choice: Ó ní
  rationale: Ọ̀nà Yorùbá àdánidá ni láti ṣàfihàn ọ̀rọ̀ tí Fẹ́sítù dáhùn; akọsilẹ̀ ẹsẹ̀ ṣàlàyé pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àsìkò ìsinsìnyí ìtàn.
- source_word: ἀκούσῃ αὐτοῦ
  choice: ìwọ yóò gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Pẹ̀lú àpólà olùní genitive, ó lè túmọ̀ sí gbígbọ́ ẹni náà sọ̀rọ̀ tààrà; èyí jẹ́ Yorùbá àdánidá tí ó bá àyíká ìgbẹ́jọ́ mu.
