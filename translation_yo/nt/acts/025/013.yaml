  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: gbolohun àkókò náà (‘Lẹ́yìn ọjọ́ mélòó kan’) ṣàfihàn genitive absolute náà; ‘Ọba Agrippa’ pa oyè βασιλεύς mọ́; ‘dé Kesarea’ sọ ìrìn-àjò dé ibi àfojúsùn; ‘láti kí Festu’ sì jẹ́ ìtumọ̀ tó bójú mu fún participle ἀσπασάμενοι láìfi ìtumọ̀ àfikún sínú rẹ̀. A kò nílò láti mú δέ jáde gẹ́gẹ́ bí ọ̀rọ̀ àsopọ̀ lọ́tọ̀ nínú Yorùbá.'
  naturalness: Èdè náà rọrùn, ó sì jẹ́ Yorùbá òde òní tó níyì. ‘Lẹ́yìn ọjọ́ mélòó kan’ àti ‘láti kí’ jẹ́ àṣàyàn ẹ̀dá. Àmì ohùn àwọn ọ̀rọ̀ Yorùbá abinibi wà níbi tó yẹ; a fi ìkọ̀wé orúkọ àjèjì sílẹ̀ ní ọ̀nà tó ṣeé kà.
  terminology: ‘Ọba’ fún βασιλεύς jẹ́ ọ̀rọ̀ tó péye. Agrippa, Bẹrenike, Kesarea, àti Festu ni a lò ní ìbámu pẹ̀lú ìṣe ìkọ̀wé orúkọ nínú ìtumọ̀ Yorùbá. Àlàyé ìsàlẹ̀ [a] jẹ́ ìtọ́kasí tó yẹ sí àṣàyàn ìkọ̀wé orúkọ náà, kò sì kan ìtumọ̀ ẹsẹ náà.
