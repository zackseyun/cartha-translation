id: ACT.25.13
reference: Acts 25:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mélòó kan, Ọba Agrippa àti Bẹrenike[a] dé Kesarea láti kí Festu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè kọ orúkọ yìí sí “Bernike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Lẹ́yìn ọjọ́ mélòó kan
  rationale: Ọ̀rọ̀ yìí jẹ́ genitive absolute tó fi àkókò ìṣẹ̀lẹ̀ hàn. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì mú ìtẹ̀síwájú ìtàn δέ wá láìfi ọ̀rọ̀ àsopọ̀ tó lágbára kún un.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: Ọba Agrippa
  rationale: Ó pa oyè βασιλεύς mọ́, ó sì tẹ̀ lé ìṣètò ọ̀rọ̀ Yorùbá tó máa ń fi oyè ṣáájú orúkọ.
- source_word: Βερνίκη
  choice: Bẹrenike
  rationale: Àkọsílẹ̀ yìí tẹ̀ lé bí orúkọ Gíríìkì Βερνίκη ṣe ń dún, ó sì bá ìlànà kíkọ orúkọ àjèjì ní Yorùbá mu.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: dé Kesarea
  rationale: κατήντησαν nínú ọ̀rọ̀ ìrìn-àjò túmọ̀ sí pé wọ́n dé ibi tí wọ́n ń lọ; εἰς sì fi Kesarea hàn gẹ́gẹ́ bí ibi àfojúsùn.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: láti kí Festu
  rationale: Participle náà lè fi ète tàbí ìṣẹ̀lẹ̀ tó tẹ̀ lé dídé wọn hàn. “Láti kí” jẹ́ kíkún, ti ẹ̀dá, kò sì fi ìtumọ̀ àṣà ààfin tí kò ṣe kedere sínú ọ̀rọ̀ náà.
- source_word: Φῆστον
  choice: Festu
  rationale: Àkọsílẹ̀ Yorùbá yìí ṣàfihàn orúkọ Gíríìkì Φῆστος ní ọ̀nà tó rọrùn fún òǹkàwé Yorùbá láti pè.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó péye, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tó yẹ; a sì ṣe àkọsílẹ̀ àwọn orúkọ àjèjì ní ọ̀nà tó ṣeé pè ní Yorùbá.
