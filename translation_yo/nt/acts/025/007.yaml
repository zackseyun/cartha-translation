revisions:
- from: Nígbà tí ó sì dé, àwọn Júù[a] tí wọ́n ti sọ̀kalẹ̀ láti Jerúsálẹ́m dúró yí i ká[b]. Wọ́n fi ọ̀pọ̀ ẹ̀sùn líle koko kàn án, ṣùgbọ́n wọn kò lè fi ẹ̀rí mú wọn múlẹ̀.
