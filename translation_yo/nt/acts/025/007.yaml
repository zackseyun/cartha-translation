  source_fidelity: 'Ìtumọ̀ náà ń pa ìtẹ̀lé àti ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì mọ́: dídé Pọ́ọ̀lù, àwọn Júù tí wọ́n sọ̀kalẹ̀ láti Jerúsálẹ́m, dídúró yí i ká, àti ọ̀pọ̀ ẹ̀sùn tí a kò lè fi ẹ̀rí múlẹ̀. Síbẹ̀, ‘ṣùgbọ́n’ kò sí nínú Gíríìkì, ó sì ń mú ìyàtọ̀ kan hàn ju ohun tí gbolohun àbùdá náà sọ lọ.'
