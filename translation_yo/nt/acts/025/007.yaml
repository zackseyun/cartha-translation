source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: yo
  text: Nígbà tí ó sì dé, àwọn Júù[b] tí wọ́n ti sọ̀kalẹ̀ láti Jerúsálẹ́m dúró yí i ká[a], wọ́n sì ń fi ọ̀pọ̀ ẹ̀sùn tó le koko kàn án, àwọn tí wọn kò lè fi ẹ̀rí múlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘wọ́n yí i ká.’ Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé wọ́n dúró ká a; ìdúró yìí lè fi ìhámọ́ra hàn nínú ọ̀ràn ilé-ẹjọ́ náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ará Jùdíà.’ Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn Júù tí wọ́n fi ẹ̀sùn kan ẹni náà, tí wọ́n wá láti Jerúsálẹ́m, kì í ṣe àwọn olùgbé Jùdíà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Nígbà tí ó sì dé
  rationale: Gbólóhùn olùní-ẹni yìí ń tọ́ka sí àkókò tí ẹni náà dé. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àtẹ̀lé ìṣẹ̀lẹ̀ mọ́ láì fi orúkọ tí Gíríìkì kò sọ kún un.
- source_word: περιέστησαν αὐτὸν
  choice: dúró yí i ká
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí dídúró ká ẹnì kan. Èyí pa àwòrán ibi ìgbẹ́jọ́ mọ́, ó sì yàgò fún mímú ìbínú tàbí ìwà ipá wọ inú ọ̀rọ̀ ju bí orísun ṣe sọ lọ.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: àwọn Júù tí wọ́n ti sọ̀kalẹ̀ láti Jerúsálẹ́m
  rationale: Ἰουδαῖοι lè túmọ̀ sí ‘àwọn Júù’ tàbí ‘àwọn ará Jùdíà.’ Níhìn-ín, àwọn olùfisùn Júù láti Jerúsálẹ́m ni ọ̀rọ̀ ń tọ́ka sí; ‘àwọn Júù’ jẹ́ èyí tó ṣe kedere jù, nígbà tí àlàyé ibi tí wọ́n ti wá ti wà nínú gbólóhùn náà.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: ọ̀pọ̀ ẹ̀sùn líle koko
  rationale: αἰτιώματα jẹ́ àwọn ẹ̀sùn ní ọ̀nà òfin, βαρέα sì fi hàn pé wọ́n le koko tàbí pé wọ́n ṣe pàtàkì gan-an. Gbólóhùn Yorùbá yìí bójú mu èdè ilé-ẹjọ́.
- source_word: καταφέροντες
  choice: fi ... ẹ̀sùn ... kàn án
  rationale: Nínú ọ̀rọ̀ òfin, ọ̀rọ̀ náà túmọ̀ sí gbígbé ẹ̀sùn wá sí ẹnì kan tàbí fífi ẹ̀sùn kàn án. Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe náà.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: wọn kò lè fi ẹ̀rí mú wọn múlẹ̀
  rationale: ἰσχύω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni fi àìlèṣe hàn, ἀποδεῖξαι sì túmọ̀ sí fífi ẹ̀rí mú ohun kan múlẹ̀. Arọ́pò-orúkọ ‘wọn’ tọ́ka sí ọ̀pọ̀ ẹ̀sùn náà, gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ nínú Gíríìkì.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A lo àmi ohùn ní kíkún, a sì pa àwòrán ilé-ẹjọ́ àti àìdánilójú inú Ἰουδαῖοι mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
