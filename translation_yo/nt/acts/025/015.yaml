base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: yo
  text: Ní ti ọkùnrin yìí, nígbà tí mo dé Jerúsálẹ́mù, àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn Júù gbé ọ̀ràn rẹ̀ kalẹ̀ fún mi, wọ́n sì béèrè fún ìdájọ́ ẹ̀bi sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń béèrè pé kí n dá a lẹ́bi”; tàbí, “wọ́n ń béèrè pé kí n kéde pé ó jẹ̀bi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Ní ti ọkùnrin yìí
  rationale: Ọ̀rọ̀ yìí tọ́ka sí Paulu, ó sì mú un wá gẹ́gẹ́ bí ẹni tí ọ̀ràn náà dá lé lórí; ‘ọkùnrin yìí’ jẹ́ kó ṣe kedere ní Yorùbá láì yí ìtumọ̀ padà.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: nígbà tí mo dé Jerúsálẹ́mù
  rationale: Genitive absolute náà ń tọ́ka sí àkókò tí Festu dé Jerúsálẹ́mù; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: ἐνεφάνισαν
  choice: fi ẹ̀sùn rẹ̀ tó mi létí
  rationale: Nínú àyíká ìdájọ́, ọ̀rọ̀ náà túmọ̀ sí fífi ọ̀ràn tàbí ẹ̀sùn kan hàn sí aláṣẹ. Àṣàyàn yìí mú àyíká òfin náà hàn, láì sọ pé Festu ti gba ẹ̀sùn náà gbọ́.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ẹgbẹ́ àwọn aṣáájú àlùfáà, kì í ṣe àlùfáà àgbà kan ṣoṣo.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: àwọn àgbààgbà àwọn Júù
  rationale: Ó pa ìbáṣepọ̀ genitive mọ́, ó sì ń tọ́ka sí àwọn àgbààgbà tí ó wà láàárín àwọn Júù.
- source_word: αἰτούμενοι
  choice: wọ́n sì ń béèrè pé
  rationale: Participle náà fi ìbéèrè wọn hàn gẹ́gẹ́ bí ìṣe tó bá fífi ọ̀ràn náà tó Festu létí lọ.
- source_word: κατ’ αὐτοῦ καταδίκην
  choice: kí n dá a lẹ́bi
  rationale: Gbolohun Yorùbá yìí sọ ìbéèrè fún ìdájọ́ òfin tí yóò kéde ẹni náà ní ẹlẹ́bi; ẹsẹ̀ ìsàlẹ̀ pa àwọn àṣàyàn lexical míì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè òfin tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn Júù’ gẹ́gẹ́ bí ìtọ́ka sí ẹgbẹ́ tí ọ̀rọ̀ Gíríìkì náà dárúkọ, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
