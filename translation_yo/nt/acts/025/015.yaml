  terminology: ‘Àwọn olórí àlùfáà,’ ‘àwọn àgbààgbà àwọn Júù,’ àti ‘ìdájọ́ ẹ̀bi’ yẹ, wọ́n sì pa ìtumọ̀ òfin καταδίκη mọ́. ‘Ọkùnrin yìí’ jẹ́ ìtọ́kasí tó bófin mu sí Paulu nínú àyíká ọrọ̀ náà.
  issues:
