    issue: ‘fi ẹ̀sùn rẹ̀ tó mi létí’
    rationale: Gbólóhùn náà sábà túmọ̀ sí rírántí ẹni nípa ẹ̀sùn kan, kì í ṣe gbígbé ọ̀ràn tàbí ìfìsùn kan kalẹ̀ fún aláṣẹ. Ó tún lè mú kí ‘rẹ̀’ dà bí ẹni pé ẹ̀sùn náà jẹ́ ti Paulu nípasẹ̀ ìjẹ́ẹ́gbẹ́, dípò ọ̀ràn tí a gbé kalẹ̀ lòdì sí i.
