  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àti ìtumọ̀ gbogbogbò ọrọ̀ Gíríìkì náà dáadáa: Festu dé Jerúsálẹ́mù, àwọn olórí àlùfáà àti àgbààgbà Júù sì sọ ọ̀ràn Paulu fún un, wọ́n béèrè fún ìdálẹ́bi rẹ̀. Síbẹ̀, ‘fi ẹ̀sùn rẹ̀ tó mi létí’ túmọ̀ ní ti ìwà èdè sí ‘rán mi létí ẹ̀sùn rẹ̀,’ ó sì lè fi hàn pé ẹ̀sùn náà ti mọ̀ tẹ́lẹ̀; ἐνεφάνισαν níbí jẹ́ gbígbé ọ̀ràn náà kalẹ̀ fún aláṣẹ.'
