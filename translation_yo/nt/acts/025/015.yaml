    rationale: ‘kí n dá ìdájọ́ ẹ̀bi sí i lórí’ kì í ṣe ìṣọ̀kan gbolohun tó dára bí ‘kí n dá a lẹ́bi’ tàbí ‘kí n kéde pé ó jẹ̀bi.’
