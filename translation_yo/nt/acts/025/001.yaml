translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. A pa àmì ohùn mọ́ níbi tí ó yẹ, a sì lò “ó gòkè” láti ṣètìlẹ́yìn fún àṣà ọ̀rọ̀ àti ìtọ́ka ilẹ̀ inú orísun.
