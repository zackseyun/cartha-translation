  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí Fẹ́sítù dé sí agbègbè ìṣàkóso náà[a], ó gòkè lọ láti Kesaria sí Jerusalẹmu lẹ́yìn ọjọ́ mẹ́ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ agbègbè ìṣàkóso náà” tàbí “gba àṣẹ lórí agbègbè ìṣàkóso náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídé Fẹ́sítù sí agbègbè ìṣàkóso rẹ̀, ó sì lè fi hàn ní ìpàrokò pé ó bẹ̀rẹ̀ iṣẹ́ ìṣàkóso rẹ̀ níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìtàn yìí mọ́ ohun tí ó ṣáájú, ó sì pa agbára àsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: lẹ́yìn tí Fẹ́sítù dé sí agbègbè ìṣàkóso náà
  rationale: Ó fi ìṣe tí ó ṣáájú hàn ní èdè Yorùbá àdánidá, láì fi dandan túmọ̀ rẹ̀ sí pé ó ti bẹ̀rẹ̀ sí í ṣe iṣẹ́ gómìnà.
- source_word: ἐπαρχείᾳ
  choice: agbègbè ìṣàkóso
  rationale: Ó tọ́ka sí ẹkùn kan lábẹ́ ìṣàkóso Róòmù, ó sì ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: lẹ́yìn ọjọ́ mẹ́ta
  rationale: Èyí ni ìtumọ̀ àkókò tí ó ṣe tààrà fún μετά pẹ̀lú accusative níbí.
- source_word: ἀνέβη
  choice: ó gòkè
  rationale: Ó pa àṣà ọ̀rọ̀ ìrìn-àjò lọ sí Jerusalẹmu mọ́, ó sì bá ipò ilẹ̀ gíga ìlú náà mu.
- source_word: εἰς Ἱεροσόλυμα
  choice: lọ sí Jerusalẹmu
  rationale: Ó sọ ibi tí ìrìn-àjò náà ń lọ ní Yorùbá àdánidá.
- source_word: ἀπὸ Καισαρείας
  choice: láti Kesaria
  rationale: Ó fi ibi tí Fẹ́sítù ti gbéra hàn ní kedere.
- source_word: Φῆστος
  choice: Fẹ́sítù
  rationale: Àkọsílẹ̀ orúkọ náà ni a mú bá ìró Yorùbá àti àmì ohùn mu.
