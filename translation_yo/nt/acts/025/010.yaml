source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù sọ pé, “Mo dúró níwájú ìtẹ́ ìdájọ́ Kesari[a], níbi tí ó yẹ kí wọ́n dá mi lẹ́jọ́. Èmi kò ṣe ohun búburú kankan sí àwọn Júù[b], gẹ́gẹ́ bí ìwọ náà ti mọ̀ dáadáa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé ẹjọ́ Kesari.” Ọ̀rọ̀ Gíríìkì náà, βῆμα, lè túmọ̀ sí ìjókòó ìdájọ́ aláṣẹ tàbí ilé ẹjọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Èmi kò ṣe ohun àìtọ́ kankan sí àwọn Júù,” tàbí “Èmi kò ṣẹ àwọn Júù rárá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: ìtẹ́ ìdájọ́
  rationale: Ó tọ́ka sí ìjókòó tàbí ilé ẹjọ́ aláṣẹ Róòmù; “ìtẹ́ ìdájọ́” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa àwòrán ìjókòó onídàájọ́ mọ́.
- source_word: Καίσαρος
  choice: Kesari
  rationale: A pa oyè ìjọba Róòmù náà mọ́ gẹ́gẹ́ bí orúkọ oyè, dípò fífi ìtumọ̀ gbogbogbò bí “ọba ńlá” rọ́pò rẹ̀.
- source_word: ἑστώς εἰμι
  choice: Mo dúró
  rationale: Ó mú ipò Pọ́ọ̀lù lọ́wọ́lọ́wọ́ níwájú ẹjọ́ hàn ní èdè Yorùbá àdánidá.
- source_word: οὗ με δεῖ κρίνεσθαι
  choice: níbi tí ó yẹ kí a ti ṣe ìdájọ́ mi
  rationale: Ó fi ibi ẹjọ́ náà hàn gẹ́gẹ́ bí àṣẹ ìdájọ́ tó yẹ, ó sì pa ìtumọ̀ àìṣeṣe/ojúṣe δεῖ àti àkójọpọ̀ aláìṣe κρίνεσθαι mọ́.
- source_word: Ἰουδαίους
  choice: àwọn Júù
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ẹgbẹ́ ènìyàn tí ẹsẹ̀ náà dárúkọ, láìfi ìtumọ̀ tó dín wọn sí àwọn ará Jùdíà nìkan kún un.
- source_word: οὐδὲν ἠδίκησα
  choice: Èmi kò ṣẹ àwọn Júù ní ohunkóhun
  rationale: “Ṣẹ” níbí ní agbára ìwà àti òfin, ó sì bá àkóónú ẹ̀sùn mu; “ní ohunkóhun” ń fi οὐδὲν hàn kedere.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: gẹ́gẹ́ bí ìwọ fúnra rẹ ti mọ̀ dáadáa
  rationale: “Ìwọ fúnra rẹ” ń mú ìtẹnumọ́ καὶ σύ jáde, “mọ̀ dáadáa” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ agbára κάλλιον ἐπιγινώσκεις.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a pa àyíká òfin Róòmù àti ìtẹnumọ́ Pọ́ọ̀lù mọ́.
