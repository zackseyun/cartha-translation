  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: yo
  text: Nítorí náà, kí àwọn alágbára láàárín yín[a] bá mi sọ̀ kalẹ̀, bí ohun àìtọ́ kan bá sì wà lára ọkùnrin náà, kí wọn fẹ̀sùn kàn án.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn aṣáájú láàárín yín,” tàbí “àwọn tó ní àṣẹ láàárín yín,” tàbí “àwọn tó lè ṣe bẹ́ẹ̀ láàárín yín.” Ọ̀rọ̀ Gíríìkì δυνατοί lè tọ́ka sí àwọn alágbára, àwọn olókìkí tàbí àwọn tó ní agbára láti ṣe ohun kan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u pé, “kí wọn gbé ẹ̀sùn kàn án.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Nítorí náà, kí ...
  rationale: οὖν ń fi ìtẹ̀síwájú tàbí àbájáde ọ̀rọ̀ hàn; ‘Nítorí náà’ mú iṣẹ́ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: àwọn alágbára láàárín yín
  rationale: δυνατοί lè túmọ̀ sí àwọn tó lágbára, tó ní ipò tàbí agbára àṣẹ, tàbí tó lè ṣe ohun kan. ‘Àwọn alágbára’ pa ìtumọ̀ náà mọ́ láì fi dandan pinnu pé agbára ìjọba tàbí agbára ara ni.
- source_word: φησίν
  choice: a kò túmọ̀ ọ́ ní ọ̀tọ̀
  rationale: Ọ̀rọ̀ àárín gbólóhùn ni, tó túmọ̀ sí ‘ó ní’; nínú àyíká ọ̀rọ̀ tí a ti sọ pé Fẹ́sítù ló ń sọ̀rọ̀, fífi sílẹ̀ máa jẹ́ kí Yorùbá ṣàn dáadáa láì pàdánù iṣẹ́ rẹ̀.
- source_word: συγκαταβάντες
  choice: bá mi sọ̀ kalẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ lílọ sọ̀ kalẹ̀ papọ̀; ‘bá mi’ mú σύν jáde, ‘sọ̀ kalẹ̀’ sì pa àwòrán ìrìnàjò láti Jerúsálẹ́mù lọ sí Kesaria mọ́.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: bí ohun àìtọ́ kan bá wà lára ọkùnrin náà
  rationale: Èyí pa ipò àìdánilójú εἴ τί mọ́, ó sì tú ἐν ... ἄτοπον sí Yorùbá àdánidá láì sọ ọ́ di ‘ìwà ọ̀daràn,’ èyí tí Gíríìkì kò fi dandan sọ.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: kí wọn fẹ̀sùn kàn án
  rationale: κατηγορέω nínú àyíká òfin túmọ̀ sí fífi ẹ̀sùn kan ẹni; ọ̀rọ̀ Yorùbá yìí ṣókí, ó sì bá àyíká ìgbẹ́jọ́ mu.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ọkùnrin náà’ pa bí Fẹ́sítù ṣe tọ́ka sí Pọ́ọ̀lù ní ọ̀nà jíjìnnà mọ́; ‘ohun àìtọ́’ sì yẹra fún fífi ìtumọ̀ ọ̀daràn tí ἄτοπον kò béèrè kún ọ̀rọ̀.
