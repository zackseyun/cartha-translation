source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí pé ìwádìí nípa àwọn ọ̀ràn wọ̀nyí rú mi lójú[a], mo bi í bóyá ó fẹ́ lọ sí Jerúsálẹ́mù, kí a sì dájọ́ rẹ̀ níbẹ̀ nípa àwọn ọ̀ràn wọ̀nyí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé àríyànjiyàn nípa àwọn ọ̀ràn wọ̀nyí rú mi lójú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo bi í bóyá ó múra tán láti lọ sí Jerúsálẹ́mù, kí wọ́n sì gbọ́ ẹjọ́ rẹ̀ níbẹ̀ nípa àwọn ọ̀ràn wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: rú mi lójú
  rationale: Ọ̀rọ̀ yìí fi hàn pé Fẹ́sítù kò mọ ọ̀nà tí yóò gbà yanjú ọ̀ràn náà, tàbí pé ó dà á láàmú. ‘Rú mi lójú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdàrúdàpọ̀ tàbí àìmọ̀ ohun tí a ó ṣe, láìfi ìtumọ̀ míì kún un.
- source_word: ζήτησιν
  choice: ìwádìí
  rationale: Nínú àyíká ìdájọ́ yìí, ọ̀rọ̀ náà lè túmọ̀ sí ìwádìí, ìbéèrè ọ̀ràn, tàbí àríyànjiyàn. ‘Ìwádìí’ bá iṣẹ́ olùṣàkóso àti adájọ́ mu, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ‘àríyànjiyàn’ mọ́.
- source_word: περὶ τούτων
  choice: nípa àwọn ọ̀ràn wọ̀nyí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti tọ́ka sí gbogbo ohun tí wọ́n ń jíròrò tàbí ẹ̀sùn tí wọ́n ń wádìí.
- source_word: ἔλεγον
  choice: mo bi í
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ tààrà ni ‘mo sọ,’ gbólóhùn àìṣe-taara tí εἰ bẹ̀rẹ̀ fi hàn pé Fẹ́sítù béèrè ìbéèrè kan.
- source_word: εἰ βούλοιτο
  choice: bóyá ó fẹ́
  rationale: ‘Bóyá ó fẹ́’ fi ìfẹ́ tàbí ìmúratán ẹni náà hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àìṣe-taara yìí.
- source_word: πορεύεσθαι
  choice: lọ
  rationale: ‘Lọ’ ni ìtumọ̀ Yorùbá tó rọrùn, tó sì pé fún ọ̀rọ̀ ìrìn-àjò yìí.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọsílẹ̀ orúkọ ìlú náà tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn tó bá ìpè rẹ̀ mu.
- source_word: κἀκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘àti níbẹ̀’; ìṣètò Yorùbá fi ‘níbẹ̀’ sí ẹ̀yìn gbólóhùn ìdájọ́ lọ́nà àdánidá.
- source_word: κρίνεσθαι
  choice: kí a sì dájọ́ rẹ̀
  rationale: Yíyan ‘dájọ́ rẹ̀’ pa ìtumọ̀ ìṣe ìdájọ́ tó gbòòrò mọ́, láìfi dandan mú un jẹ́ ìgbẹ́jọ́ ní ilé ẹjọ́ nìkan.
- source_word: περὶ τούτων
  choice: nípa àwọn ọ̀ràn wọ̀nyí
  rationale: Àtúnlò ọ̀rọ̀ náà pa ìtẹnumọ́ àti ìtọ́kasí Gíríìkì sí àwọn ọ̀ràn kan náà mọ́; kò ṣàfikún pé ẹ̀sùn ni wọ́n ní pàtó.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Gbólóhùn náà pa ohùn ìròyìn Fẹ́sítù àti àìdánilójú tó wà nínú ἀπορούμενος mọ́. A kò fi ẹ̀kọ́ ìsìn tàbí ìtumọ̀ ẹ̀ya ìjọ kankan kún un.
