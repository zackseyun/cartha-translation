id: ACT.25.21
reference: Acts 25:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Paulu fi ẹjọ́ bẹ̀bẹ̀ pé kí a dá a mọ́ sí àhámọ́ fún ìpinnu Olú-ọba[a], mo pàṣẹ pé kí a máa dá a mọ́ sí àhámọ́ títí di ìgbà tí màá rán an lọ sọ́dọ̀ Kesari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ti Sebastosi’ (Σεβαστός) ni; èyí jẹ́ oyè ìjọba Róòmù tí ó bá ‘Augustus’ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: fi ẹjọ́ rẹ̀ lọ Ọ̀dọ̀ Kesari
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹ̀bẹ̀ ẹjọ́ tí a ń fi sílẹ̀ lọ́nà òfin sí aláṣẹ gíga; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá nínú ọ̀rọ̀ ilé-ẹjọ́. Bí ó tilẹ̀ jẹ́ pé ‘Kesari’ kò dúró lẹ́gbẹ̀ẹ́ ọ̀rọ̀ náà nínú Gíríìkì, àyíká ẹsẹ̀ àti ìparí rẹ̀ mú ẹni tí a fi ẹjọ́ lọ sọ́dọ̀ rẹ̀ hàn kedere.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: fi ... sí àhámọ́
  rationale: Ní àyíká yìí, τηρέω túmọ̀ sí dídá ẹni dúró lábẹ́ àṣẹ ìjọba, kì í ṣe ṣíṣọ́ tàbí ààbò lásán. Ìtumọ̀ kan náà ni a lò ní ibi méjèèjì.
- source_word: διάγνωσιν
  choice: ṣe ìdájọ́
  rationale: διάγνωσις níbí jẹ́ ìpinnu aláṣẹ lórí ẹjọ́. ‘Ṣe ìdájọ́’ jẹ́ èdè Yorùbá tí ó ṣe kedere, láìdín ìtumọ̀ náà kù sí ìgbọ́jọ́ nìkan.
- source_word: Σεβαστοῦ
  choice: Olú Ọba
  rationale: Σεβαστός jẹ́ oyè ọba ilẹ̀ Róòmù, èyí tí ‘Augustus’ dúró fún. ‘Olú Ọba’ mú ipò ọba gíga náà yé òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀rọ̀ Gíríìkì àti oyè ìtàn náà hàn.
- source_word: ἀναπέμψω
  choice: rán ... lọ
  rationale: Ó túmọ̀ sí rírán Paulu lọ sí ọ̀dọ̀ aláṣẹ gíga; ‘rán ... lọ’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: πρὸς Καίσαρα
  choice: sọ́dọ̀ Kesari
  rationale: ‘Kesari’ pa oyè/ìlò orúkọ Καίσαρ mọ́, ó sì bá ọ̀rọ̀ ìtàn Róòmù nínú Ìṣe àwọn Aposteli mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘àhámọ́’ fún ìdádúró lábẹ́ àṣẹ òfin, ‘Kesari’ fún oyè Caesar, àti ‘Olú Ọba’ fún Σεβαστός; àmì ìsàlẹ̀ [a] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn oyè náà.
