revisions:
- from: Ṣùgbọ́n nígbà tí Paulu fi ẹjọ́ rẹ̀ lọ Ọ̀dọ̀ Kesari, tí ó sì béèrè pé kí a fi òun sí àhámọ́ títí Olú Ọba[a] yóò fi ṣe ìdájọ́, mo pàṣẹ pé kí a fi í sí àhámọ́ títí èmi yóò fi rán an lọ sọ́dọ̀ Kesari.
  to: Ṣùgbọ́n nígbà tí Paulu fi ẹjọ́ bẹ̀bẹ̀ pé kí a dá a mọ́ sí àhámọ́ fún ìpinnu Olú-ọba[a], mo pàṣẹ pé kí a máa dá a mọ́ sí àhámọ́ títí di ìgbà tí màá rán an lọ sọ́dọ̀ Kesari.
