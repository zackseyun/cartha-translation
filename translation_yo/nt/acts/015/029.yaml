id: ACT.15.29
reference: Acts 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: yo
  text: kí ẹ má ṣe jẹ ohun tí a fi rúbọ sí òrìṣà[a], ẹ̀jẹ̀, tàbí ẹran tí a pa nípa fífún un lọ́rùn[b], kí ẹ sì yẹra fún ìṣekúṣe[c]. Bí ẹ bá pa ara yín mọ́ kúrò nínú àwọn nǹkan wọ̀nyí, ẹ ó ṣe dáadáa. Ẹ máa dáadáa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tí a fi rúbọ sí òrìṣà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹran tí a fún lọ́rùn” tàbí “àwọn ohun tí a fún lọ́rùn.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “ìṣekúṣe” lè ní ìtumọ̀ gbooro; síbẹ̀, àwọn kan lóye rẹ̀ ní pàtó sí i níbí ní ìbámu pẹ̀lú àwọn ìbáṣepọ̀ tí Òfin Lefitiku kà léèwọ̀.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “Ẹ wà láìsàn.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà tí wọ́n máa ń gbà parí lẹ́tà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: kí ẹ má ṣe jẹ … kí ẹ sì yẹra fún
  rationale: Àkójọ náà ní àwọn ohun jíjẹ mẹ́ta àti ìṣekúṣe; lílo ‘má ṣe jẹ’ fún àwọn ohun jíjẹ, àti ‘yẹra fún’ fún ìṣekúṣe, mú ète ọ̀rọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: εἰδωλοθύτων
  choice: ohun tí a fi rúbọ sí òrìṣà
  rationale: Ó pa ìtumọ̀ gbooro ti ohun tí a fi rúbọ sí òrìṣà mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó sábà tọ́ka sí oúnjẹ tàbí ẹran.
- source_word: αἵματος
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààrà ni, láìfi ‘ẹran’ tàbí àlàyé mìíràn kún ohun tí Gíríìkì sọ.
- source_word: πνικτῶν
  choice: ohun tí a fún lọ́rùn
  rationale: Ó tú àpèjúwe tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ sí Yorùbá, ó sì tọ́ka sí ẹranko tí a pa nípa fífún un lọ́rùn.
- source_word: πορνείας
  choice: ìṣekúṣe
  rationale: Ọ̀rọ̀ Yorùbá yìí lè bo ìwà ìbálòpọ̀ tí kò tọ́ ní ọ̀nà gbooro, láìdín un kù sí ẹ̀ṣẹ̀ kan pàtó.
- source_word: ἐξ ὧν
  choice: kúrò nínú àwọn nǹkan wọ̀nyí
  rationale: Ó mú ohun tí ọ̀rọ̀ arọ́pò náà ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: διατηροῦντες ἑαυτούς
  choice: Bí ẹ bá pa ara yín mọ́
  rationale: A tú participle náà gẹ́gẹ́ bí gbólóhùn oníṣ شرط? conditional ní Yorùbá àdánidá, ní ìbámu pẹ̀lú ipa rẹ̀ nínú ọ̀rọ̀ náà.
- source_word: εὖ πράξετε
  choice: ẹ ó ṣe dáadáa
  rationale: Ó pa ọ̀rọ̀ ìyìn àti ìmọ̀ràn pé èyí ni ohun tó tọ́ láti ṣe mọ́, láìfipá túmọ̀ ọ́ sí aásìkí.
- source_word: ἔρρωσθε
  choice: Ẹ kú àlàáfíà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ní iyì láti parí lẹ́tà pẹ̀lú ìkíni àlàáfíà, dípò títú àṣẹ náà ní ti gidi sí ‘ẹ lágbára.’
theological_decisions:
- issue: Ìtumọ̀ πορνεία nínú àṣẹ ìgbìmọ̀ àwọn aposteli
  choice: ìṣekúṣe ní ìtumọ̀ gbooro
  alternative: ìbálòpọ̀ láìsí ìgbéyàwó, tàbí ìgbéyàwó/ìbáṣepọ̀ tí Lefitiku 18 kà léèwọ̀
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò dín ọ̀rọ̀ náà kù sí irú ẹ̀ṣẹ̀ ìbálòpọ̀ kan; nítorí náà, ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ gbooro mọ́, àkọsílẹ̀ sì jẹ́wọ́ ìtumọ̀ tó ṣeé ṣe nínú àyíká Lefitiku.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ. A yà àwọn èèwọ̀ jíjẹ sọ́tọ̀ pẹ̀lú ‘má ṣe jẹ,’ nígbà tí ‘yẹra fún’ dúró fún ìṣekúṣe, kí Yorùbá lè ṣàn dáadáa láìyí ète Gíríìkì padà.
