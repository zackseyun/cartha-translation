id: ACT.15.15
reference: Acts 15:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: yo
  text: 'Àwọn ọ̀rọ̀ àwọn wòlíì sì bá èyí mu, gẹ́gẹ́ bí a ti kọ ọ́ pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹ̀rí àwọn wòlíì mọ́ ọ̀rọ̀ tí Jákọ́bù ń sọ, ó sì jẹ́ àsopọ̀ tó bá èdè Yorùbá mu ní àyíká yìí.
- source_word: τούτῳ
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò afihàn yìí tọ́ka sí ohun tàbí ọ̀rọ̀ tí a ṣẹ̀ṣẹ̀ sọ, láì fi ìtumọ̀ kan pàtó lé e lórí.
- source_word: συμφωνοῦσιν
  choice: bá ... mu
  rationale: Gbólóhùn Yorùbá àdánidá ni fún jíjẹ́ ní ìbámu tàbí fífi ẹ̀rí kan múlẹ̀; ó tún lè gba èyí gẹ́gẹ́ bí ohun tí a bá mu.
- source_word: οἱ λόγοι
  choice: àwọn ọ̀rọ̀
  rationale: Ó túmọ̀ àwọn àsọjáde àwọn wòlíì tí a kọ sílẹ̀ ní tààràtà, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: τῶν προφητῶν
  choice: àwọn wòlíì
  rationale: Ìhun ‘àwọn ọ̀rọ̀ àwọn wòlíì’ fi ìbátan orísun tàbí ohun-ìní tí genitive Gíríìkì sọ hàn lọ́nà àdánidá.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó mú ìbámu pẹ̀lú Ìwé Mímọ́ tí a fẹ́ tọ́ka sí wọlé lọ́nà àdánidá.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ó pa agbára perfect passive mọ́—ohun tí a ti kọ sílẹ̀ tí ó ṣì dúró—nípasẹ̀ gbólóhùn ìtọ́kasí Ìwé Mímọ́ tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ohun tí τούτῳ ń tọ́ka sí nínú ọ̀rọ̀ Jákọ́bù
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘èyí,’ tó ń tọ́ka sí ọ̀rọ̀ tàbí ìṣẹ̀lẹ̀ tó ṣáájú láì sọ ọ́ di ẹ̀kọ́ kan pàtó.
  alternative: Ìyípadà àwọn Kèfèrí; ọ̀rọ̀ Pétérù; ète Ọlọ́run yìí.
  rationale: Gíríìkì kò sọ ohun tí demonstrative náà ń tọ́ka sí ní pàtó. Ìtumọ̀ náà pa ààyè ìtumọ̀ yẹn mọ́, kò sì yan ìlànà ẹ̀kọ́ kan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti bá àṣà mu; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A kò fi àlàyé ìsàlẹ̀ ojú ìwé kún un, nítorí ‘bá èyí mu’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó bo ìbátan dative náà láì dá àṣàyàn Gẹ̀ẹ́sì ‘with/to’ dúró.
