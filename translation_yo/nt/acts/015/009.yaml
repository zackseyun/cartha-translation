  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó ń sọ pé Ọlọ́run kò fi ìyàtọ̀ sílẹ̀ láàárín ẹgbẹ́ méjèèjì, ó sì wẹ ọkàn àwọn kejì náà mọ́ nípasẹ̀/ní ohun èlò ìgbàgbọ́. Ìtumọ̀ ''wẹ ... mọ́'' yẹ fún καθαρίσας, ó sì pa ìbáṣepọ̀ iṣẹ́ participle náà mọ́ láìfẹ́sẹ̀ mú ìlànà àkókò kan.'
