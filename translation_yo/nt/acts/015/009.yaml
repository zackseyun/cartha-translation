source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: yo
  text: Kò sì ṣe ìyàtọ̀ kankan láàárín wa àti wọn; ó fi ìgbàgbọ́ wẹ ọkàn wọn mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wẹ ọkàn wọn mọ́ nípasẹ̀ ìgbàgbọ́.” Dátífù Gíríìkì lè sọ ọ̀nà tàbí ohun èlò tí a fi ṣe ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: kò ṣe ìyàtọ̀ kankan
  rationale: Àkópọ̀ ọ̀rọ̀ yìí túmọ̀ sí pé Ọlọ́run kò ya ẹgbẹ́ méjèèjì sọ́tọ̀ ní ìbámu pẹ̀lú bí ó ṣe bá wọn lò; gbólóhùn Yorùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: láàárín àwa àti àwọn
  rationale: Ó pa ìtọ́kasí sí ẹgbẹ́ àwọn Júù àti ti àwọn Kèfèrí mọ́ láìfi ìtumọ̀ mìíràn kún un.
- source_word: τῇ πίστει
  choice: fi ìgbàgbọ́
  rationale: Dátífù Gíríìkì lè tọ́ka sí ohun èlò tàbí ọ̀nà tí a fi ṣe ohun kan. Ìṣètò ‘fi … wẹ’ jẹ́ Yorùbá àdánidá fún ìtumọ̀ ohun èlò, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ‘nípasẹ̀’ mọ́.
- source_word: καθαρίσας
  choice: ó … wẹ … mọ́
  rationale: ‘Wẹ … mọ́’ pa àwòrán ìwẹ̀nùmọ́ inú ọkàn mọ́. Àmì ìdákẹ́jẹ́ ṣopọ̀ iṣẹ́ yìí mọ́ gbólóhùn àkọ́kọ́ láìfipá pinnu bóyá iṣẹ́ náà ṣáájú rẹ̀ tàbí ó bá a lọ pọ̀.
- source_word: τὰς καρδίας αὐτῶν
  choice: ọkàn wọn
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún inú ènìyàn—èrò, ìfẹ́ àti ìpinnu—kì í ṣe ìmọ̀lára nìkan.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ní àyíká yìí, ‘ìgbàgbọ́’ ni ìtumọ̀ tí ó wọ́pọ̀ jù, kò sì sí ohun tó fi hàn pé ‘ìṣòtítọ́’ ni a ń tẹnumọ́.
- issue: Ìbáṣepọ̀ τῇ πίστει pẹ̀lú ìwẹ̀nùmọ́
  choice: ó fi ìgbàgbọ́ wẹ ọkàn wọn mọ́
  alternative: ó wẹ ọkàn wọn mọ́ nípasẹ̀ ìgbàgbọ́
  rationale: Àwọn méjèèjì lè sọ ìgbàgbọ́ gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ àdánidá ní Yorùbá, àlàyé sì jẹ́ kí àṣàyàn kejì hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘àwọn’ gẹ́gẹ́ bí arọ́pò-orúkọ ẹgbẹ́ ẹni kẹta, gẹ́gẹ́ bí àyíká ẹsẹ̀ ṣe ń tọ́ka sí àwọn Kèfèrí.
