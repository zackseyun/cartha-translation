id: ACT.15.1
reference: Acts 15:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: yo
  text: Àwọn kan sì sọ̀kalẹ̀ láti Jùdíà, wọ́n sì ń kọ́ àwọn arákùnrin[a] pé, “Bí a kò bá kọ yín ní ilà gẹ́gẹ́ bí àṣà Mósè, ẹ kò lè rí ìgbàlà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin”; ọ̀rọ̀ Gíríìkì ní “àwọn arákùnrin,” ó sì ṣeé ṣe kí ó tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: sì
  rationale: Ó pa ìṣàn àsopọ̀ ìtàn Lúùkù mọ́ ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó túmọ̀ ọ̀pọ̀ ẹni tí a kò dárúkọ láìfi akọ tàbí abo kún ohun tí ọ̀rọ̀ Gíríìkì kò mú dájú níhìn-ín.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: sọ̀kalẹ̀ láti Jùdíà
  rationale: Ó pa èrò ìrìn-àjò láti Jùdíà lọ sí ibi ìṣẹ̀lẹ̀ mọ́, pẹ̀lú ọ̀rọ̀ ìtọ́sọ́nà ‘sọ̀kalẹ̀.’
- source_word: ἐδίδασκον
  choice: ń kọ́
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ tàbí tí a ń ṣe léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: τοὺς ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Ó tẹ̀lé akọ ọ̀pọ̀ inú Gíríìkì; àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó kó gbogbo àwùjọ àwọn onígbàgbọ́ sínú.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Bí a kò bá kọ yín ní ilà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn àdéhùn òdì àti passive, tí ó sì pa ìtumọ̀ ìkọlà mọ́.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: gẹ́gẹ́ bí àṣà Mósè
  rationale: ἔθος túmọ̀ sí àṣà tàbí ìṣe tí a ti fi ìdí múlẹ̀; ‘gẹ́gẹ́ bí’ sọ dative náà di Yorùbá tó ṣe kedere láìṣàlàyé ju orísun lọ.
- source_word: οὐ δύνασθε σωθῆναι
  choice: ẹ kò lè rí ìgbàlà
  rationale: Ó sọ àìlè àti agbára soteriological σωθῆναι ní Yorùbá àdánidá, láìdín in kù sí ìdáǹdè ara nìkan.
theological_decisions:
- issue: Ìtumọ̀ σωθῆναι nínú àríyànjiyàn nípa ìkọlà
  choice: rí ìgbàlà
  alternative: jẹ́ dídá sílẹ̀ / rí ìdáǹdè
  rationale: Àyíká Ìṣe 15 dá lórí bóyá ìkọlà ṣe pọndandan fún ìgbàlà; ‘rí ìgbàlà’ pa ìwọ̀n ẹ̀kọ́ ìgbàlà náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Bí a ṣe túmọ̀ ἀδελφοὺς
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin / àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ọ̀pọ̀, ṣùgbọ́n ó ṣeé ṣe kí ó dúró fún gbogbo àwùjọ onígbàgbọ́; a pa irú ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé àkópọ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìṣàn àsopọ̀ àti ìṣe tí ń lọ nínú Gíríìkì mọ́.
