id: ACT.15.36
reference: Acts 15:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ díẹ̀, Paulu sọ fún Banaba pé, “Ẹ jẹ́ kí a padà nísinsìnyí, kí a sì bẹ àwọn arákùnrin[a] wò ní gbogbo ìlú tí a ti kéde ọ̀rọ̀ Olúwa, kí a sì wo bí wọ́n ṣe wà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin”; ọ̀rọ̀ Gíríìkì sọ pé “àwọn arákùnrin,” ṣùgbọ́n ó lè lo ọ̀rọ̀ akọ náà gẹ́gẹ́ bí aṣojú gbogbo ẹgbẹ́ àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Lẹ́yìn ọjọ́ díẹ̀
  rationale: Ó tẹ̀ lé ìtumọ̀ àkókò tí μετά pẹ̀lú accusative ní, ó sì pa àkókò náà mọ́ gẹ́gẹ́ bí ohun tí a kò sọ bí ó ti gùn tó.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Paulu sọ fún Banaba pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni tó sọ̀rọ̀, ẹni tí ó bá sọ̀rọ̀, àti ọ̀rọ̀ tí ó tẹ̀ lé hàn.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Ẹ jẹ́ kí a padà nísinsìnyí, kí a sì bẹ ... wò
  rationale: A fi participle náà àti hortatory subjunctive hàn gẹ́gẹ́ bí ìṣírí apapọ̀; “nísinsìnyí” mú agbára δή jáde, “bẹ ... wò” sì fi àbẹ̀wò tí ó ní ìfẹ́ sí ipò wọn hàn.
- source_word: τοὺς ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Ó pa ọ̀rọ̀ ìbátan akọ tí Gíríìkì lò mọ́; akọsilẹ̀ ṣàlàyé pé ó lè dúró fún gbogbo àwọn onígbàgbọ́, títí kan obìnrin.
- source_word: κατὰ πόλιν πᾶσαν
  choice: ní gbogbo ìlú
  rationale: 'Ó mú ìtumọ̀ distributive náà jáde: ọkọọkan àwọn ìlú tí iṣẹ́ ìránṣẹ́ wọn ti dé.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: tí a ti kéde
  rationale: “Kéde” fi ìpolongo gbangba tí καταγγέλλω ń tọ́ka sí hàn ju ọ̀rọ̀ bí “sọ” lọ.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: Ó jẹ́ ìtumọ̀ tó sún mọ́ orísun, tí ó sì jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó mọ́gbọ́n dání fún ìhìn tí í ṣe ti Olúwa tàbí nípa Olúwa.
- source_word: πῶς ἔχουσιν
  choice: kí a lè mọ bí wọ́n ti wà
  rationale: Ó sọ idi àbẹ̀wò náà ní Yorùbá àdánidá, ó sì pa ìfẹ́ láti mọ ipò wọn mọ́ láìfi àlàyé míì kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nígbà tí ó ṣeé ṣe kí ẹgbẹ́ náà ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: A pa àwòrán ìbátan akọ inú orísun mọ́ nínú ẹsẹ̀, ṣùgbọ́n a fi akọsilẹ̀ hàn pé ọ̀rọ̀ náà lè jẹ́ aṣojú gbogbo ẹgbẹ́ àwọn onígbàgbọ́.
- issue: Bí a ṣe túmọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος ní àyíká Majẹ̀mú Tuntun, ó sì pa ìwọ̀n ọlá àti àìdánilójú ìtọ́kasí inú gbólóhùn náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo “Ẹ jẹ́ kí a” fún ìṣírí apapọ̀ ní ọ̀nà àdánidá, àti “bẹ ... wò” fún àbẹ̀wò tí ó ní àníyàn rere.
