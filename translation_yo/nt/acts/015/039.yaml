  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: yo
  text: Àríyànjiyàn líle kan sì wáyé[a], débi pé wọ́n pínyà kúrò lọ́dọ̀ ara wọn; Báránábà mú Máàkù pẹ̀lú rẹ̀, ó sì wọ ọkọ̀ ojú omi lọ sí Kípírọ́sì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjà líle.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìmúnibínú tó lágbára tàbí ìforígbárí gbígbóná.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: bẹ́ sílẹ̀
  rationale: Ó fi ìṣẹ̀lẹ̀ tuntun kan hàn nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé ipò yìí ṣẹlẹ̀.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ níbí; ‘sì’ ń tẹ̀síwájú nínú ìtàn láì sọ ìtakora di líle jù.
- source_word: παροξυσμὸς
  choice: àríyànjiyàn líle
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìforígbárí tó le láàárín Pọ́ọ̀lù àti Báránábà, kì í ṣe ìbínú inú lásán.
- source_word: ὥστε
  choice: débi pé
  rationale: Ó sọ àbájáde tí bí ìforígbárí náà ṣe le mú wá ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἀποχωρισθῆναι ... ἀπ’ ἀλλήλων
  choice: wọ́n pínyà kúrò lọ́dọ̀ ara wọn
  rationale: Ó pa ìtumọ̀ ìṣe ìpínyà àti ìbáṣepọ̀ alásúnpadà ‘ara wọn’ mọ́.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: mú Máàkù pẹ̀lú rẹ̀
  rationale: Ó fi hàn pé Báránábà mú Máàkù lọ pẹ̀lú ara rẹ̀, láì fi orúkọ ‘Jòhánù’ kún ohun tí Gíríìkì sọ ní ẹsẹ yìí.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: wọ ọkọ̀ ojú omi lọ sí Kípírọ́sì
  rationale: Ó sọ ìrìnàjò wọn nípa òkun àti ibi tí wọ́n ń lọ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ìforígbárí láàárín àwọn alábàáṣiṣẹ́ aposteli
  choice: àríyànjiyàn líle
  alternative: ìjà líle; ìforígbárí gbígbóná
  rationale: A túmọ̀ ìṣẹ̀lẹ̀ náà ní tààrà láì dín bí ó ṣe le kù, láì dá ẹnikẹ́ni lẹ́bi, àti láì sọ ọ́ di ohun tó le ju ẹ̀rí ọ̀rọ̀ Gíríìkì lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa bí ìforígbárí náà ṣe le mọ́ láì fi ìtumọ̀ ẹ̀sìn ẹgbẹ́ kan kún un.
