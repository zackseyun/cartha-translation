language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti lo àkókò díẹ̀ níbẹ̀, àwọn ará[a] sì rán wọn lọ pẹ̀lú àlàáfíà sí ọ̀dọ̀ àwọn tí wọ́n ti rán wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ní “àwọn arákùnrin” ní tààràtà, ṣùgbọ́n ní àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, akọ àti abo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: lẹ́yìn tí wọ́n lo àkókò díẹ̀ níbẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé wọ́n dúró fún àkókò kan. A fi “níbẹ̀” kún un gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn pé wọ́n wà ní Áńtíókù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kò sí ní tààràtà nínú Gíríìkì.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀπελύθησαν
  choice: rán wọn lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí bí ìjọ ṣe jẹ́ kí àwọn aṣojú náà máa lọ pẹ̀lú ìfẹ́ rere, kì í ṣe sí dídá ẹlẹ́wọ̀n sílẹ̀. Ìṣètò gbólóhùn aláṣe jẹ́ èdè Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìṣe àfarajìn.
- source_word: μετ’ εἰρήνης
  choice: fi àlàáfíà
  rationale: Èyí pa ìtumọ̀ ìlọkúrò pẹ̀lú àlàáfíà, ìbùkún àti ìfẹ́ rere mọ́ ní ọ̀nà tí ó bójú mu ní Yorùbá.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: àwọn ará
  rationale: “Àwọn ará” jẹ́ ìtumọ̀ Yorùbá àdánidá fún àwọn ọmọ ìjọ, ó sì lè gba gbogbo àwùjọ àwọn onígbàgbọ́ láìfi akọ tàbí abo sí iwájú.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: sọ́dọ̀ àwọn tí ó ti rán wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe náà ń tọ́ka sí àwọn tí wọ́n kọ́kọ́ rán wọn ní iṣẹ́. “Ó ti rán” fi hàn pé ìránṣẹ́ náà ti ṣẹlẹ̀ ṣáájú ìpadà wọn, láìfi “padà” kún ohun tí Gíríìkì kò sọ ní tààràtà.
theological_decisions:
- issue: Bóyá ἀδελφοί ní agbára ìtumọ̀ tí ó gba akọ àti abo pọ̀
  choice: àwọn ará
  alternative: àwọn arákùnrin; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì wà ní ìrísí akọ ọ̀pọ̀, ṣùgbọ́n nínú àyíká ìjọ ó ṣeé ṣe kí ó dúró fún gbogbo àwùjọ àwọn onígbàgbọ́. “Àwọn ará” pa ìbátan ìdílé ẹ̀mí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí kò dá akọ tàbí abo mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “fi àlàáfíà rán wọn lọ” gẹ́gẹ́ bí gbólóhùn àdánidá fún ìdásílẹ̀ pẹ̀lú ìfẹ́ rere, a sì fi àmì ohùn síbi tí ó yẹ.
