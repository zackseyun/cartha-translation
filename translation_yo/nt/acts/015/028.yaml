id: ACT.15.28
reference: Acts 15:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: yo
  text: Nítorí ó dára lójú Ẹ̀mí Mímọ́ àti lójú wa pé kí a má ṣe gbé ẹrù mìíràn lé yín, àfi àwọn ohun wọ̀nyí tí ó pọn dandan:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀mí Mímọ́ àti àwa ti pinnu.” Àṣà ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ìpinnu ní ọ̀nà yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ohun pàtàkì wọ̀nyí” tàbí “àwọn ìlànà wọ̀nyí tí ó pọn dandan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: ó dára lójú
  rationale: Ó pa àṣà ọ̀rọ̀ Gíríìkì mọ́ pé ohun kan dára lójú ẹni, ó sì lè tọ́ka sí ìpinnu tí a fọwọ́ sí láì sọ ọ́ di èrò lásán.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Ẹ̀mí Mímọ́
  rationale: Dátífù náà bá àṣà ọ̀rọ̀ ‘ó dára lójú’ mu, ó sì fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí ẹni tó ní ìfọwọ́sí, kì í ṣe agbára aláìlẹ́ni.
- source_word: καὶ ἡμῖν
  choice: àti lójú wa
  rationale: Àtúnsọ ‘lójú’ mú ìbáramu dátífù náà àti ìfọwọ́sí papọ̀ ti Ẹ̀mí Mímọ́ àti ìpéjọ náà ṣe kedere.
- source_word: μηδὲν πλέον
  choice: mìíràn tí ó pọ̀ ju ... lọ
  rationale: 'Ìtumọ̀ afiwéra náà ni a pa mọ́: wọn kò ní fi ẹrù míì tí ó ju àwọn ohun tí a dárúkọ lọ kún wọn.'
- source_word: ἐπιτίθεσθαι ὑμῖν βάρος
  choice: gbé ẹrù ... lé yín
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ Yorùbá adayébá fún gbígbé ojúṣe tàbí àṣẹ lé ẹnì kan, ó sì pa àwòrán ẹrù inú Gíríìkì mọ́.
- source_word: πλὴν τούτων τῶν ἐπάναγκες
  choice: ju àwọn ohun tí ó pọndandan wọ̀nyí lọ
  rationale: Ó tọ́ka sí àwọn ìlànà tó tẹ̀ lé e, ó sì dúró sítòsí Gíríìkì láì túmọ̀ irú ìjẹ́pàtàkì wọn kọjá ohun tí ẹsẹ náà sọ.
theological_decisions:
- issue: Ìbáṣepọ̀ Ẹ̀mí Mímọ́ pẹ̀lú ìpinnu ìgbìmọ̀ náà
  choice: “ó dára lójú Ẹ̀mí Mímọ́ àti lójú wa”
  alternative: “Ẹ̀mí Mímọ́ àti àwa pinnu”
  rationale: Ìtumọ̀ yìí pa àṣà ọ̀rọ̀ àti ìfọwọ́sí papọ̀ mọ́, ó sì fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí ẹni tó ń ṣiṣẹ́ láì yí ọ̀rọ̀ náà padà sí ìpinnu ènìyàn nìkan.
- issue: Ipa àṣẹ náà lórí àwọn onígbàgbọ́ aláìkọlà
  choice: Kò sí ẹrù mìíràn tí ó pọ̀ ju àwọn ohun pọndandan tí a sọ lọ.
  alternative: Kò sí ojúṣe kankan rárá, tàbí gbogbo òfin Mósè ni a gbé lé wọn.
  rationale: Ọ̀rọ̀ náà fi ààlà sí ohun tí a gbé lé wọn, ṣùgbọ́n kò fagilé gbogbo ojúṣe tàbí fi gbogbo òfin Mósè lé wọn; a kò sì yanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà kọjá ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ó dára lójú” jẹ́ ọ̀rọ̀ adayébá tí ó pa ìtumọ̀ ìfọwọ́sí àti ìpinnu mọ́; “gbé ẹrù lé yín” sì pa àwòrán Gíríìkì mọ́ ní ọ̀nà tí òǹkàwé òde òní lè lóye.
