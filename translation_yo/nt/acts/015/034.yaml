translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ó dára lójú Sílà” láti pa àpẹẹrẹ Gíríìkì mọ́ láì sọ ọ́ di ìpinnu líle ju ohun tí orísun sọ lọ; àmì àlàyé [a] wà lẹ́yìn gbólóhùn.
