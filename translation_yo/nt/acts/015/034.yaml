translation:
  language: yo
  text: Ṣùgbọ́n ó dára lójú Sílà láti dúró níbẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn ìwé àfọwọ́kọ Gíríìkì tí ó pẹ́ jù lọ, títí kan Papírù 74 ti ọ̀rúndún kẹta àti àwọn ìwé àfọwọ́kọ Sínáítíkù àti Vatíkánù ti ọ̀rúndún kẹrin; bẹ́ẹ̀ ni kò sí nínú àwọn ìtumọ̀ èdè Kọ́pítì ìgbà àtijọ́. Ó wà nínú ọ̀pọ̀ jù lọ àwọn ìwé àfọwọ́kọ àṣà Bísáńtíọ̀mù, nínú àwọn ìwé àfọwọ́kọ Alẹkisáńdíríà àti Ìwọ̀ Oòrùn kan tí ó dé lẹ́yìn náà, àti nínú àṣà èdè Látìn àti Síríákì. Ó ṣeé ṣe kí akọ̀wé kan fi kún un nígbà tó yá láti ṣàlàyé bí Sílà ṣe ṣì wà ní Áńtíókù tó fi lè bá Pọ́ọ̀lù lọ ní ẹsẹ 40, bí ó tilẹ̀ jẹ́ pé ẹsẹ 33 sọ pé Sílà àti Júdà ti lọ.
    reason: textual_critical
lexical_decisions:
- source_word: δοκέω
  choice: ó dára lójú Sílà
  rationale: Ìlò aláìlẹ́ni-pàtó pẹ̀lú dative τῷ Σίλᾳ túmọ̀ sí pé ohun náà dára lójú Sílà tàbí pé ó pinnu bẹ́ẹ̀. Ọ̀rọ̀ yìí pa ìṣètò àti ìtumọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐπιμένω
  choice: láti dúró
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí láti máa bá a lọ ní jíjẹ́ ní ibi kan, ìyẹn láti dúró síbẹ̀.
- source_word: αὐτοῦ
  choice: síbẹ̀
  rationale: A lò ó gẹ́gẹ́ bí ọ̀rọ̀ ibi, ó sì ń tọ́ka sí Áńtíókù.
