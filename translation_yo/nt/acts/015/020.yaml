- from: ṣùgbọ́n kí a kọ̀wé sí wọn pé kí wọn yẹra fún àwọn ohun ìbàjẹ́ tí ó ní í ṣe pẹ̀lú àwọn ère òrìṣà[a], àti fún ìṣekúṣe[b], àti fún ohun tí a fún lọ́rùn pa[c], àti fún ẹ̀jẹ̀.
  to: ṣùgbọ́n kí a kọ̀wé sí wọn pé kí wọn yẹra fún àwọn ohun tí àwọn ère òrìṣà ti sọ di aláìmọ́[a], àti fún ìṣekúṣe[b], àti fún ohun tí a pa nípa fífún un lọ́rùn[c], àti fún ẹ̀jẹ̀.
  rationale: A tún àwọn ọ̀rọ̀ méjì ṣe nìkan fún ìfaramọ́ sí orísun àti Yorùbá àdánidá. “Àwọn ohun tí àwọn ère òrìṣà ti sọ di aláìmọ́” ṣàfihàn àìmọ́ tí ἀλισγημάτων τῶν εἰδώλων ń sọ, láì dín un kù sí oúnjẹ ẹbọ. “Ohun tí a pa nípa fífún un lọ́rùn” jẹ́ ìsọ̀rọ̀ kedere fún τοῦ πνικτοῦ, láì fi “ẹran” sínú ọ̀rọ̀ àkọ́kọ́. Àwọn àlàyé ìsàlẹ̀ ti pa àwọn ìtumọ̀ mìíràn àti àyíká àṣà mọ́.
