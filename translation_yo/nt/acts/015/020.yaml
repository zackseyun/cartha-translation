  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: yo
  text: ṣùgbọ́n kí a kọ̀wé sí wọn pé kí wọn yẹra fún àwọn ohun tí àwọn ère òrìṣà ti sọ di aláìmọ́[a], àti fún ìṣekúṣe[b], àti fún ohun tí a pa nípa fífún un lọ́rùn[c], àti fún ẹ̀jẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àìmọ́ tí ó ní í ṣe pẹ̀lú àwọn ère òrìṣà.” Àwọn ìtumọ̀ kan mú un dín kù sí “oúnjẹ tí a fi rúbọ sí àwọn ère òrìṣà,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí gbòòrò ju bẹ́ẹ̀ lọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwà ìbálòpọ̀ tí kò tọ́ ní gbogbogbòò; àwọn kan sì gbà pé níbí ó ń tọ́ka ní pàtó sí àwọn ìbáṣepọ̀ ìbálòpọ̀ tàbí ìgbéyàwó tí òfin kà léèwọ̀.
    reason: alternative_reading
  - marker: c
    text: Ní tààrà, “ohun tí a fún lọ́rùn pa”; èyí ń tọ́ka sí ẹran láti ara ẹranko tí a kò jẹ́ kí ẹ̀jẹ̀ rẹ̀ tú jáde bí ó ti yẹ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: kí a kọ̀wé sí wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí fífi ìtọ́ni ránṣẹ́ nípasẹ̀ lẹ́tà; “kọ̀wé sí wọn” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ lẹ́tà náà mọ́.
- source_word: ἀπέχεσθαι
  choice: kí wọn yẹra fún
  rationale: “Yẹra fún” sọ ìtumọ̀ dídá ara ẹni dúró kúrò nínú ohun kan ní èdè Yorùbá òde òní, ó sì bá àyíká ìtọ́ni yìí mu.
- source_word: ἀλισγημάτων
  choice: àwọn ohun ìbàjẹ́
  rationale: Àṣàyàn yìí pa èrò ohun tí ó ń sọni di aláìmọ́ tàbí tí ń bà nípa ẹ̀sìn mọ́, láì dín ọ̀rọ̀ náà kù sí oúnjẹ nìkan.
- source_word: τῶν εἰδώλων
  choice: tí ó ní í ṣe pẹ̀lú àwọn ère òrìṣà
  rationale: Gbólóhùn yìí mú ìbáṣepọ̀ àwọn ohun ìbàjẹ́ náà pẹ̀lú ìbọ̀rìṣà hàn ní Yorùbá àdánidá, láì fi hàn pé oúnjẹ ẹbọ nìkan ni.
- source_word: πορνείας
  choice: ìṣekúṣe
  rationale: “Ìṣekúṣe” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà ìbálòpọ̀ tí kò tọ́, ó sì pa ìtẹ̀sí gbooro ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: τοῦ πνικτοῦ
  choice: ohun tí a fún lọ́rùn pa
  rationale: Èyí tẹ̀ lé agbára ọ̀rọ̀ orúkọ Gíríìkì náà, ó sì yẹra fún fífi “ẹran” kún ẹsẹ̀ níbi tí orísun kò ti sọ ọ́ ní tààrà.
- source_word: τοῦ αἵματος
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ ṣókí yìí tẹ̀ lé Gíríìkì, láì ṣàlàyé ju ẹsẹ̀ náà lọ pé jíjẹ ẹ̀jẹ̀ gan-an ni a ń tọ́ka sí.
theological_decisions:
- issue: Ìwọ̀n ohun tí ìfòfin de nípa àwọn ère òrìṣà kárí
  choice: àwọn ohun ìbàjẹ́ tí ó ní í ṣe pẹ̀lú àwọn ère òrìṣà
  alternative: oúnjẹ tí a fi rúbọ sí àwọn ère òrìṣà
  rationale: ἀλισγημάτων τῶν εἰδώλων gbòòrò ju ọ̀rọ̀ pàtó fún oúnjẹ ẹbọ lọ; ìtumọ̀ yìí pa ìwọ̀n rẹ̀ mọ́, kò sì fi ìtumọ̀ tóóró kan lé e lórí.
- issue: Ìtumọ̀ πορνεία nínú àṣẹ àwọn aposteli
  choice: ìṣekúṣe
  alternative: àwọn ìbáṣepọ̀ ìbálòpọ̀ tàbí ìgbéyàwó tí òfin kà léèwọ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí gbogbo ìwà ìbálòpọ̀ tí kò tọ́, tàbí sí àwọn ìbáṣepọ̀ kan pàtó nínú àyíká yìí. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
- issue: Bí àṣẹ nípa oúnjẹ ṣe pé tó
  choice: A pa gbogbo wọn mọ́ gẹ́gẹ́ bí ohun tí wọn gbọ́dọ̀ yẹra fún, láì sọ bí àṣẹ náà ṣe pé tó.
  alternative: Àwọn ìlànà fún ìbára-ẹni-jẹ láàárín Júù àti Kèfèrí fún ìgbà díẹ̀, tàbí àwọn àṣẹ tí ó wà títí láé fún gbogbo onígbàgbọ́.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò ṣàlàyé iye àkókò tí àwọn àṣẹ náà yóò fi wà tàbí gbogbo ìdí ẹ̀kọ́ ìgbàgbọ́ wọn; nítorí náà, a kò yan ìpinnu ẹ̀sìn kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A lo “kí a kọ̀wé sí wọn” fún ìṣàn gbólóhùn àdánidá, “yẹra fún” fún àṣẹ tó ṣe kedere, àti “ère òrìṣà” láti fi hàn pé àwọn ohun ìbọ̀rìṣà ni εἴδωλα, kì í ṣe òrìṣà ní ìtumọ̀ gbooro nìkan. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
