source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: yo
  text: Ọlọ́run, ẹni tí ó mọ ọkàn,[a] sì jẹ́rìí fún wọn nípa fífún wọn ní Ẹ̀mí Mímọ́, gẹ́gẹ́ bí ó ti fún wa náà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run, Olùmọ̀-ọkàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: ẹni tí ó mọ ọkàn ènìyàn
  rationale: Ọ̀rọ̀ àkópọ̀ náà ń tọ́ka sí ẹni tí ó mọ ohun inú ọkàn. Gbólóhùn aláṣepọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ànímọ́ Ọlọ́run náà mọ́.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún θεός níhìn-ín.
- source_word: ἐμαρτύρησεν
  choice: jẹ́rìí sí wọn
  rationale: Ó pa ìtumọ̀ ẹ̀rí tàbí ìmúdájú Ọlọ́run mọ́ nínú àríyànjiyàn ìtàn náà.
- source_word: αὐτοῖς
  choice: sí wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn Kèfèrí ní àyíká ọ̀rọ̀, ṣùgbọ́n a kò fi ìdánimọ̀ yẹn kún ẹsẹ náà.
- source_word: δοὺς
  choice: nípa fífún wọn
  rationale: Ó fi iṣẹ́ participle náà hàn gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run gbà jẹ́rìí sí wọn.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni orúkọ àdánidá àti ọ̀wọ̀ fún Holy Spirit ní Yorùbá òde òní.
- source_word: καθὼς καὶ ἡμῖν
  choice: gẹ́gẹ́ bí ó ti fún àwa náà
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe fífún sílẹ̀ ní òye; Yorùbá tún un sọ láti mú ìfiwéra náà ṣe kedere, nígbà tí “náà” ń gbé καί jáde.
theological_decisions:
- issue: Àìṣe ojúsàájú Ọlọ́run tí ẹ̀bùn Ẹ̀mí sí àwọn Kèfèrí fi hàn
  choice: A pa “wọn” àti “àwa” mọ́, a sì fi hàn pé fífún wọn ní Ẹ̀mí Mímọ́ ni ẹ̀rí Ọlọ́run.
  alternative: Láti sọ “àwọn Kèfèrí” dípò “wọn,” tàbí láti fi àlàyé nípa ipò májẹ̀mú wọn kún un.
  rationale: αὐτοῖς túmọ̀ sí “wọn”; àyíká ọ̀rọ̀ ló ń sọ ẹni tí wọ́n jẹ́. Ìtumọ̀ kò gbọdọ̀ fi ẹ̀kọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. “Ọkàn ènìyàn” ń ṣàlàyé ọkàn gẹ́gẹ́ bí inú ẹni, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó sún mọ́ ọ̀rọ̀ àkópọ̀ Gíríìkì mọ́.
