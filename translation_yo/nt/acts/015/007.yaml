id: ACT.15.7
reference: Acts 15:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: yo
  text: Lẹ́yìn tí ìjíròrò púpọ̀ ti wáyé, Pétérù dìde, ó sì sọ fún wọn pé, “Ẹ̀yin arákùnrin[a], ẹ̀yin mọ̀ pé láti àwọn ọjọ́ ìṣáájú[b], Ọlọ́run ti ṣe àṣàyàn láàárín yín pé kí àwọn tí kì í ṣe Júù[c] gbọ́ ọ̀rọ̀ ìhìn rere nípasẹ̀ ẹnu mi, kí wọ́n sì gbàgbọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “Ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin.” Ìkíni Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀; “Ẹ̀yin arákùnrin” pa ìrísí àti ìmọ̀lára ìbátan rẹ̀ mọ́, bó tilẹ̀ jẹ́ pé irú ìkíni àṣà yìí lè ṣojú àwọn ẹlòmíràn pẹ̀lú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láti àwọn ọjọ́ ìgbàanì.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “àwọn orílẹ̀-èdè.” Níhìn-ín, ó ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Lẹ́yìn tí ìjíròrò púpọ̀ ti wáyé
  rationale: Ó mú gẹ́nítífù aláìdá dúró gẹ́gẹ́ bí ipò tó ṣáájú, ó sì fi hàn pé ìjíròrò líle àti àríyànjiyàn ti pọ̀, láì sọ ọ́ di ìjà.
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ìṣe tó ṣáájú ọ̀rọ̀ Pétérù ni; “dìde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá “stood up” mu.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin arákùnrin
  rationale: Ó pa àpèjúwe ọkùnrin ní ọ̀pọ̀ mọ́, ó sì jẹ́ ìkíni ìbátan tó bójú mu ní Yorùbá, láì fi “arábìnrin” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐπίστασθε
  choice: ẹ̀yin mọ̀
  rationale: Ó túmọ̀ sí ìmọ̀ tàbí ohun tí àwọn olùgbọ́ ti mọ̀ tẹ́lẹ̀; èyí ni gbólóhùn Yorùbá tó rọrùn jù.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: láti àwọn ọjọ́ ìṣáájú
  rationale: Ó tọ́ka sí àsìkò àkọ́kọ́ kan tí àwọn olùgbọ́ mọ̀. Yíyan yìí yẹra fún fífi ìṣẹ̀lẹ̀ náà hàn bí ohun tó ti pé ní ọ̀pọ̀ ọ̀rúndún, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tún lè jẹ́ “ọjọ́ ìgbàanì.”
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó pa ìtumọ̀ yíyan ní àárín ẹgbẹ́ tí Pétérù ń bá sọ̀rọ̀ mọ́, láì pinnu ju bó ṣe yẹ lọ pé “láti inú yín.”
- source_word: ἐξελέξατο
  choice: ti yàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyan tàbí ṣíṣe àṣàyàn; “yàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: διὰ τοῦ στόματός μου
  choice: láti ẹnu mi
  rationale: Ó pa àwòrán ẹnu Pétérù gẹ́gẹ́ bí ọ̀nà tí ìhìn náà gbà jáde mọ́, dípò lílo “nípasẹ̀ mi” nìkan.
- source_word: τὰ ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká Ìṣe 15, ó tọ́ka sí àwọn tí kì í ṣe Júù. “Àwọn Kèfèrí” mú ìyàtọ̀ Júù àti aláìṣe-Júù yẹn hàn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gbòòrò “àwọn orílẹ̀-èdè” pamọ́.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: ọ̀rọ̀ ìhìn rere
  rationale: Ó pa ìsopọ̀ λόγος àti εὐαγγέλιον mọ́ ní Yorùbá adayébá, ó sì ṣe kedere pé ìhìn tí a ń kéde ni.
- source_word: πιστεῦσαι
  choice: gbàgbọ́
  rationale: Ó bá àìlẹ́ni-lórí ọ̀rọ̀-ìṣe Gíríìkì mu, ó sì yẹra fún fífi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
theological_decisions:
- issue: Ìkíni akọ ní ọ̀pọ̀ Ἄνδρες ἀδελφοί nínú àpéjọ tó lè ṣojú àwọn ẹlòmíràn
  choice: Ẹ̀yin arákùnrin
  alternative: Ẹ̀yin ọkùnrin arákùnrin; Ẹ̀yin arákùnrin àti arábìnrin
  rationale: A pa akọ ní ọ̀pọ̀ tí Gíríìkì lò mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí oníkà mọ̀ pé irú ìkíni àṣà yìí lè dúró fún àwùjọ tó gbòòrò.
- issue: Ìtumọ̀ τὰ ἔθνη nínú ọ̀rọ̀ ìgbàlà àti ìgbìmọ̀ Jerúsálẹ́mù
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Ọ̀rọ̀ àyíká ń sọ nípa àwọn onígbàgbọ́ tí kì í ṣe Júù. Yíyan yìí mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò rẹ̀ mọ́.
- issue: Bí a ṣe lóye ἐν ὑμῖν pẹ̀lú ἐξελέξατο
  choice: Ọlọ́run ti yàn láàárín yín pé...
  alternative: Ọlọ́run ti yàn mi láti inú yín pé...
  rationale: Gíríìkì kò fi “mi” sí gẹ́gẹ́ bí ohun tí a yàn ní tààrà. Ìtumọ̀ àkọ́kọ́ pa ìṣètò àti ìṣiyèméjì gíríìkì mọ́, dípò fífi Pétérù kún un gẹ́gẹ́ bí ohun tí a yàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ológo ṣùgbọ́n tó ṣe kedere fún oníkà òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn náà pa ìṣàn ọ̀rọ̀ Lúùkù àti ìtẹnumọ́ “láti ẹnu mi” mọ́, láì fi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kankan kún un.
