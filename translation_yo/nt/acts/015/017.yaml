id: ACT.15.17
reference: Acts 15:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: yo
  text: kí àwọn ènìyàn tí ó ṣẹ́kù lè wá Olúwa, àti gbogbo àwọn tí kì í ṣe Júù[a] tí a ti pe orúkọ mi sórí wọn[b], ni Olúwa wí[c], ẹni tí ń ṣe nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn orílẹ̀-èdè.” Ọ̀rọ̀ Gíríìkì ἔθνη lè túmọ̀ sí “àwọn tí kì í ṣe Júù” tàbí “àwọn orílẹ̀-èdè”; àṣàyàn àkọ́kọ́ bá ọ̀ràn gbígba àwọn tí kì í ṣe Júù wọlé mu níbí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “tí a ń pè ní orúkọ mi.” Ní tààrà, àkànlò Gíríìkì náà ni, “tí a ti pe orúkọ mi sórí wọn.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ yìí ń tún Ámósì 9:12 sọ gẹ́gẹ́ bí ó ṣe fara hàn nínú ẹ̀dà Gíríìkì ti Ìwé Mímọ́, níbi tí ìtẹnumọ́ wà lórí àwọn orílẹ̀-èdè tàbí àwọn tí kì í ṣe Júù tí ń ru orúkọ Olúwa.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: kí ... lè
  rationale: Ó fi ète tàbí àbájáde hàn pẹ̀lú ọ̀rọ̀-ìṣe subjunctive; ‘kí ... lè’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára yìí mọ́.
- source_word: ἐκζητήσωσιν
  choice: wá
  rationale: Ó túmọ̀ sí láti wá tàbí fi taratara wá; ‘wá’ bójú mu ní àyíká yìí láìfi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: àwọn ìyókù aráyé
  rationale: ‘Ìyókù’ pa ìtumọ̀ àwọn tí ó ṣẹ́kù àti ìró àsọtẹ́lẹ̀ mọ́; ‘aráyé’ jẹ́ ọ̀rọ̀ àkójọpọ̀ tí kò tọ́ka sí akọ nìkan.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος nínú ọ̀rọ̀ àsọtẹ́lẹ̀ yìí.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn Kèfèrí
  rationale: Ní àyíká Ìṣe 15, ọ̀ràn pàtàkì ni gbígba àwọn tí kì í ṣe Júù wọlé; ‘Kèfèrí’ mú ìtumọ̀ àyíká náà jáde. A pa ‘àwọn orílẹ̀-èdè’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: tí a ti pe orúkọ mi sórí wọn
  rationale: Ìtumọ̀ yìí dúró sún mọ́ àkànlò èdè Gíríìkì, ó sì pa èrò jíjẹ́ ti Ọlọ́run àti ìdánimọ̀ pẹ̀lú orúkọ rẹ̀ mọ́.
- source_word: λέγει κύριος
  choice: ni Olúwa wí
  rationale: Ó jẹ́ àgbékalẹ̀ àsọtẹ́lẹ̀ tí ó wọ́pọ̀, ó sì bá ìṣàn gbolohun Yorùbá mu.
- source_word: ποιῶν ταῦτα
  choice: ẹni tí ń ṣe nǹkan wọ̀nyí
  rationale: Ó jẹ́ kí participle náà tọ́ka sí Olúwa, ó sì pa ìṣe rẹ̀ tí ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú ọ̀ràn gbígba àwọn tí kì í ṣe Júù wọlé
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Ìpàdé Jerúsálẹ́mù ń jíròrò àwọn tí kì í ṣe Júù, nítorí náà ‘Kèfèrí’ mú ìlò Lúùkù hàn kedere. Síbẹ̀, àsọtẹ́lẹ̀ Ámósì tún lè túmọ̀ sí ‘àwọn orílẹ̀-èdè,’ a sì fi ìyẹn sínú àlàyé ìsàlẹ̀.
- issue: Ọ̀rọ̀ àpapọ̀ ἀνθρώπων
  choice: aráyé
  alternative: ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; ‘aráyé’ jẹ́ àpapọ̀ àdánidá ní Yorùbá.
- issue: Àkànlò orúkọ Ọlọ́run tí a pè sórí àwọn ènìyàn
  choice: tí a ti pe orúkọ mi sórí wọn
  alternative: tí a ń pè ní orúkọ mi
  rationale: Àṣàyàn àkọ́kọ́ pa àwòrán àti àníyàn ọ̀rọ̀ Gíríìkì mọ́ láìdá ìtumọ̀ jíjẹ́ ti Ọlọ́run sí ẹ̀kọ́ ìsìn kan pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ó bójú mu fún kíkà ní gbangba, ó sì lo ‘Kèfèrí’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀, pẹ̀lú àlàyé ‘àwọn tí kì í ṣe Júù’ láti jẹ́ kó ṣe kedere fún òǹkàwé òde òní.
