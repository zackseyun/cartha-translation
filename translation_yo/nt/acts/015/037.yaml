base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: yo
  text: Ṣùgbọ́n Bánábà fẹ́ mú Jòhánù[a], tí a ń pè ní Máàkù, náà lọ pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jòhánù, tí a tún ń pè ní Máàkù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Bánábà
  rationale: Orúkọ ẹni ni; a lo ìrísí Yorùbá tí ó wọ́pọ̀ fún Barnabas.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín ìfẹ́ Bánábà àti àbá Pọ́ọ̀lù nínú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐβούλετο
  choice: fẹ́
  rationale: Ó sọ ìfẹ́ tàbí èrò Bánábà láìfi agbára ìtumọ̀ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: συμπαραλαβεῖν
  choice: mú ... lọ pẹ̀lú wọn
  rationale: Ó mú èrò pé kí ẹnì kan bá ẹgbẹ́ náà lọ jáde ní Yorùbá àdánidá.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: 'A fi sí òpin gbólóhùn láti pa agbára àfikún náà mọ́ ní Yorùbá: Bánábà fẹ́ mú Jòhánù náà lọ.'
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Ìrísí Yorùbá tí ó wọ́pọ̀ fún orúkọ John nínú Bíbélì.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: ẹni tí a ń pè ní Máàkù
  rationale: Ó ṣàlàyé orúkọ kejì rẹ̀ ní kedere, ó sì pa ìtumọ̀ participle náà mọ́.
- source_word: Μᾶρκον
  choice: Máàkù
  rationale: Ìrísí Yorùbá tí ó wọ́pọ̀ fún orúkọ Mark.
