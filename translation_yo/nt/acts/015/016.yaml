id: ACT.15.16
reference: Acts 15:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, èmi yóò padà, èmi yóò sì tún àgọ́ Dáfídì[a] tí ó ti wó lulẹ̀ kọ́; èmi yóò tún àwọn apá rẹ̀ tí a ti wó lulẹ̀ kọ́, èmi yóò sì mú un padà bọ̀ sípò.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘tábánákélì Dáfídì.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘àgọ́’ tàbí ‘tábánákélì.’
    reason: lexical_alternative
  - marker: b
    text: ‘Àgọ́ Dáfídì’ jẹ́ àkàwé àsọtẹ́lẹ̀ nípa ìmúpadàbọ̀ sípò tí ó ní í ṣe pẹ̀lú ìlà ìdílé tàbí ìjọba Dáfídì.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìyípadà àkókò hàn.
- source_word: ἀναστρέψω
  choice: èmi yóò padà
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pípadà; lílo ‘èmi’ tún tẹnu mọ́ ẹni àkọ́kọ́ bí ó ti rí nínú ìlérí náà.
- source_word: ἀνοικοδομήσω
  choice: èmi yóò tún ... kọ́
  rationale: Ó fi kedere hàn pé a ó kọ ohun tí ó ti wó nígbà kejì, ó sì bá àwòrán ìmúpadàbọ̀sípò mu.
- source_word: σκηνὴν Δαυὶδ
  choice: àgọ́ Dáfídì
  rationale: ‘Àgọ́’ pa àwòrán gangan ti σκηνή mọ́, kò sì túmọ̀ àkàwé náà tààrà sí ìlà ìdílé tàbí ìjọba Dáfídì.
- source_word: τὴν πεπτωκυῖαν
  choice: tí ó ti wó lulẹ̀
  rationale: Ìṣe pípé náà ṣàpèjúwe àgọ́ tí ó ṣubú, tí ó sì ṣì wà ní ipò ìwólulẹ̀.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: àwọn apá rẹ̀ tí a ti wó lulẹ̀
  rationale: Èyí fi ọ̀pọ̀ àwọn ohun tí a ti wó hàn ní kedere, dípò ọ̀rọ̀ tí ó lè túmọ̀ sí àwókù lásán.
- source_word: ἀνορθώσω
  choice: mú un padà bọ̀ sípò
  rationale: Ó sọ èrò mímú ohun tí ó ti wó padà sí ipò rere ní Yorùbá àdánidá, ní ìbámu pẹ̀lú àwòrán ìtúnkọ́.
- source_word: αὐτήν
  choice: un
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí ‘àgọ́’ ní ọ̀nà tí ó bá gírámà Yorùbá mu.
theological_decisions:
- issue: Agbára àkàwé inú ‘àgọ́ Dáfídì’
  choice: A pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘àgọ́ Dáfídì.’
  alternative: ìdílé ọba Dáfídì / ìjọba Dáfídì tí ó ti ṣubú
  rationale: Ó ṣeé ṣe kí àsọtẹ́lẹ̀ náà tọ́ka sí ìmúpadàbọ̀sípò ìlà ọba tàbí ìjọba Dáfídì, ṣùgbọ́n Gíríìkì pa àwòrán àgọ́ mọ́. Títú u sí ìtumọ̀ kan pàtó nínú ẹsẹ̀ náà yóò mú àìdánilójú àkàwé náà kúrò.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìtẹnumọ́ ‘èmi’ pa ohùn ìlérí Ọlọ́run mọ́; àtúnsọ ‘èmi yóò tún ... kọ́’ sì tẹ̀ lé ìṣọ̀kan àti àtúnsọ Gíríìkì. A gbé àmì [a] sí ‘àgọ́ Dáfídì,’ ibi tí àlàyé ọ̀rọ̀ náà kan ní tààrà.
