  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: yo
  text: Nítorí náà, a ti rán Júdásì àti Sílà; àwọn fúnra wọn ni yóò fi ẹnu sọ ohun kan náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “nípasẹ̀ ọ̀rọ̀”; ìyẹn ni pé, wọn yóò fi ẹnu sọ ọ́ ní àfikún sí lẹ́tà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: a ti rán
  rationale: Ọ̀rọ̀-ìṣe pípé náà ń tọ́ka sí ohun tí wọ́n ti ṣe tí ó sì ní ìbáṣepọ̀ pẹ̀lú ipò ìsinsìnyí; “a ti rán” jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ yìí mọ́ ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tàbí àbájáde ohun tí a sọ ṣáájú hàn ní kedere.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Júdásì àti Sílà
  rationale: A kọ orúkọ àwọn ẹni náà ní ìbámu pẹ̀lú ìró àti àṣà ìkọ̀wé Yorùbá.
- source_word: αὐτοὺς
  choice: àwọn fúnra wọn
  rationale: Ó pa ìtẹnumọ́ orísun náà mọ́ pé àwọn aṣojú náà fúnra wọn ni yóò fi ẹnu jẹ́rìí sí ohun tí lẹ́tà náà sọ.
- source_word: διὰ λόγου
  choice: fi ẹnu sọ
  rationale: Ó túmọ̀ sí ìbánisọ̀rọ̀ ẹnu, ní ìyàtọ̀ sí lẹ́tà tí a kọ; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ἀπαγγέλλοντας
  choice: yóò sì ... sọ
  rationale: Bí ó tilẹ̀ jẹ́ participle ní Gíríìkì, ó ṣàpèjúwe ohun tí Júdásì àti Sílà yóò ṣe lẹ́yìn tí a rán wọn; ìṣe ọjọ́ iwájú yìí ṣe kedere ní Yorùbá.
- source_word: τὰ αὐτά
  choice: ohun kan náà
  rationale: Ó tọ́ka sí kókó kan náà tí ìwé ìpàdé náà sọ, láì fi ìtumọ̀ míràn kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye ni a lò. “Àwọn fúnra wọn” pa ìtẹnumọ́ Gíríìkì mọ́, “fi ẹnu sọ” sì mú ìyàtọ̀ láàárín ọ̀rọ̀ ẹnu àti lẹ́tà hàn. Àmì àlàyé [a] wà lẹ́yìn gbolohun tí ó kan.
