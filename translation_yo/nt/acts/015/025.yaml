source:
  edition: SBLGNT
  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: yo
  text: Ó dá wa lójú, nígbà tí a ti wá sí ìṣọ̀kan[a], láti yan àwọn ọkùnrin[b], kí a sì rán wọn sí yín pẹ̀lú Bánábà àti Pọ́ọ̀lù tí a fẹ́ràn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nígbà tí gbogbo wa ti ní èrò kan náà” tàbí “ní ìṣọ̀kan.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, àwọn aṣojú ọkùnrin; ọ̀rọ̀ Gíríìkì náà sọ “àwọn ọkùnrin” ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: Ó dára lójú wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdájọ́ tàbí ohun tí ẹgbẹ́ kan fọwọ́ sí, láìsọ ọ́ di àṣẹ líle ju ohun tí Gíríìkì wí lọ.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: nígbà tí a ti wá sí ìṣọ̀kan
  rationale: Ó fi hàn pé wọ́n dé ibi tí gbogbo wọn fohùn ṣọ̀kan; ó sì pa ìmọ̀lára ìlànà tàbí ìyípadà inú γενομένοις mọ́.
- source_word: ἐκλεξαμένοις
  choice: láti yan
  rationale: A so ọ́ mọ́ πέμψαι gẹ́gẹ́ bí ohun tí wọ́n fọwọ́ sí láti ṣe; èyí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ yíyan mọ́.
- source_word: ἄνδρας
  choice: àwọn ọkùnrin
  rationale: ἀνήρ níhìn-ín ń tọ́ka sí àwọn akọ tí ó ti dàgbà, kì í ṣe ènìyàn lápapọ̀; ọ̀rọ̀ tó tẹ̀ lé e tún fi hàn pé Júdásì àti Sílà ni.
- source_word: πέμψαι
  choice: kí a sì rán wọn sí yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “wọn” ń tọ́ka sí àwọn ọkùnrin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì mú gbólóhùn náà ṣàn dáadáa ní Yorùbá.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: Ó sọ ìbákẹ́gbẹ́ tààrà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún ìtumọ̀ yìí.
- source_word: ἀγαπητοῖς ἡμῶν
  choice: àwọn olùfẹ́ wa
  rationale: Ó pa ìfẹ́ àti ọlá inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìforúkọsílẹ̀ tí ó bójú mu mu.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Bánábà àti Pọ́ọ̀lù
  rationale: A kọ orúkọ àwọn ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá tó ti fìdí múlẹ̀.
theological_decisions:
- issue: Ohùn ìgbìmọ̀ apapọ̀ nínú lẹ́tà Jerúsálẹ́mù
  choice: Ó dára lójú wa
  alternative: A pinnu; ìpinnu wa ni
  rationale: Ìkọ̀lé δοκέω sọ ìdájọ́ tàbí ìfọwọ́sí apapọ̀. Yíyan ọ̀rọ̀ yìí kò mú un lágbára bí àṣẹ ju ohun tí gbólóhùn Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé lasán. A pa àkójọpọ̀ gbólóhùn lẹ́tà náà mọ́, títí kan àmì kọ́má ní òpin nítorí ẹsẹ yìí ń bá a lọ sínú ẹsẹ tó tẹ̀ lé e.
