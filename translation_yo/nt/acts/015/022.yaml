id: ACT.15.22
reference: Acts 15:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: yo
  text: Nígbà náà, àwọn àpọ́sítélì àti àwọn alàgbà, pẹ̀lú gbogbo ìjọ, rí i pé ó dára kí wọ́n yan àwọn ọkùnrin láàárín wọn, kí wọ́n sì rán wọn lọ sí Áńtíókù pẹ̀lú Pọ́ọ̀lù àti Bánábà. Àwọn tí wọ́n yàn ni Júdà, ẹni tí a ń pè ní Bársábà, àti Sílà—àwọn ọkùnrin tí wọ́n ń ṣe aṣáájú láàárín àwọn arákùnrin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin tí wọ́n jẹ́ olórí láàárín àwọn arákùnrin.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn arákùnrin” níbí tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: rí i pé ó dára
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdájọ́ tí ẹgbẹ́ kan fohùn ṣọ̀kan lé lórí, láì sọ ọ́ di àṣẹ ìjọba tàbí ìpinnu onílànà ju bí Gíríìkì ṣe sọ lọ.
- source_word: πρεσβυτέροις
  choice: àwọn alàgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún àwọn aṣáájú àgbà nínú ìjọ.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: pẹ̀lú gbogbo ìjọ
  rationale: Ó pa ipa gbogbo àwùjọ onígbàgbọ́ mọ́ nínú ìpinnu náà, láì fi ètò ìṣàkóso ẹ̀sìn kan kún un.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: kí wọ́n yan àwọn ọkùnrin láàárín wọn
  rationale: Ìtumọ̀ yìí fi hàn pé ọkùnrin ni àwọn aṣojú náà, wọ́n sì jẹ́ ara àwùjọ náà fúnra rẹ̀.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: kí wọ́n sì rán wọn lọ sí Áńtíókù
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún fífi àwọn aṣojú ránṣẹ́ sí ibi kan.
- source_word: καλούμενον
  choice: ẹni tí a ń pè ní
  rationale: Ó mú ìṣe àpèjúwe náà jáde ní Yorùbá àdánidá.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: àwọn ọkùnrin tí wọ́n ń ṣe aṣáájú láàárín àwọn arákùnrin
  rationale: Ó pa ìtumọ̀ iṣẹ́ aṣáájú tí a mọ̀ sí wọn mọ́, láì sọ ọ́ di oyè ìjọ pàtó.
- source_word: ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: Ó tẹ̀ lé akọ ọ̀pọ̀ nínú Gíríìkì; àlàyé ìsàlẹ̀ ojú ìwé sì ṣàlàyé pé ó ṣeé ṣe kí ó tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
theological_decisions:
- issue: Ipa gbogbo ìjọ nínú ìpinnu náà
  choice: Gbogbo ìjọ wà pẹ̀lú àwọn aposteli àti àwọn alàgbà nínú rírí i pé ìgbésẹ̀ náà dára.
  alternative: Àwọn aposteli àti àwọn alàgbà nìkan ló ṣe ìpinnu náà, gbogbo ìjọ kàn wà níbẹ̀.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ ní ti ẹ̀dá ọ̀rọ̀ so gbogbo ìjọ pọ̀ mọ́ àwọn aposteli àti àwọn alàgbà; ìtumọ̀ náà kò fi ètò ìṣàkóso ìjọ kan lé ẹsẹ̀ náà lórí.
- issue: Ìwọ̀n àwọn tí ἀδελφοῖς ń tọ́ka sí
  choice: Àwọn arákùnrin nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè kan gbogbo àwùjọ àwọn onígbàgbọ́.
  alternative: Àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́.
  rationale: Akọ ọ̀pọ̀ wà nínú orísun, ṣùgbọ́n lílò rẹ̀ nínú àwùjọ Kristẹni ìgbàanì lè ní agbára aṣojú tó gbòòrò; àlàyé ìsàlẹ̀ ojú ìwé pa méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “àwọn aposteli” gẹ́gẹ́ bí ọ̀rọ̀ ìjọ tí ó ti wọ́pọ̀; a sì ṣètò àfikún orúkọ Júdà àti Sílà sí gbolohun tuntun díẹ̀ kí ìtumọ̀ gígùn Gíríìkì lè ye olùkà Yorùbá kedere.
