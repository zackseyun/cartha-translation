revisions:
- from: Nítorí náà, èmi pinnu pé kí a má ṣe yọ àwọn tí ó wá láàrín àwọn Kèfèrí, tí wọ́n ń yípadà sí Ọlọ́run, lẹ́nu[b][a].
  to: Nítorí náà, èmi rò pé a kò yẹ kí a dá àwọn tí kì í ṣe Júù, tí wọ́n ń yí padà sí Ọlọ́run, láàmú[b][a].
  rationale: The revision corrects the directional error in the rendering of τοῖς ἀπὸ τῶν ἐθνῶν, uses a clear contemporary contextual designation for Gentiles, and renders James’s κρίνω as a considered recommendation rather than an unnecessarily final decree. It preserves the ongoing sense of ἐπιστρέφουσιν with “ń yí padà sí Ọlọ́run.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential διό, James’s explicit first-person judgment, the negative infinitive, and the present movement toward God. However, “àwọn tí ó wá láàrín àwọn Kèfèrí” means people who came among the Gentiles, rather than people from among the Gentiles; it reverses the required relationship.
  naturalness: “Àwọn tí kì í ṣe Júù” is clear, modern Standard Yoruba in this Jewish-contextual sense of ἔθνη. “Dá ... láàmú” is a natural rendering of causing difficulty/trouble. “Èmi rò pé a kò yẹ...” retains James’s personal considered judgment and expresses its practical recommendation idiomatically.
  terminology: The revision avoids “Kèfèrí,” which can be heard in modern Yoruba as a disparaging label or as denoting unbelievers generally. “Àwọn tí kì í ṣe Júù” accurately identifies the contextual referent without adding theological content.
  issues:
  - severity: medium
    issue: The phrase “àwọn tí ó wá láàrín àwọn Kèfèrí” mistranslates τοῖς ἀπὸ τῶν ἐθνῶν.
    rationale: “Wá láàrín” presents the Gentiles as the destination or surrounding group. The Greek identifies the people themselves as originating from among the nations/Gentiles. The revised wording states the contextual referent directly.
  - severity: low
    issue: “Kèfèrí” is potentially pejorative or overly broad in current Yoruba usage.
    rationale: Although traditional in some Bible usage, it may be understood as “heathen/unbeliever,” whereas the source here denotes non-Jewish people turning to God.
  - severity: low
    issue: “Pinnu” may overstate κρίνω as a settled decision.
    rationale: κρίνω expresses James’s considered judgment. “Èmi rò pé a kò yẹ...” better preserves the personal, deliberative force in idiomatic Yoruba.
  revised_text: Nítorí náà, èmi rò pé a kò yẹ kí a dá àwọn tí kì í ṣe Júù, tí wọ́n ń yí padà sí Ọlọ́run, láàmú[b][a].
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹni láti inú àwọn orílẹ̀-èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn orílẹ̀-èdè,” ṣùgbọ́n níbí ó ń tọ́ka sí àwọn tí kì í ṣe Júù tí wọ́n ń yí padà sí Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èmi parí èrò sí i pé a kò yẹ kí a dá ... láàmú” tàbí “ìdájọ́ mi ni pé a má ṣe dá ... láàmú.”
    reason: alternative_reading
  revision_rationale: The revision corrects the directional error in the rendering of τοῖς ἀπὸ τῶν ἐθνῶν, uses a clear contemporary contextual designation for Gentiles, and renders James’s κρίνω as a considered recommendation rather than an unnecessarily final decree. It preserves the ongoing sense of ἐπιστρέφουσιν with “ń yí padà sí Ọlọ́run.”
