  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: yo
  text: Nítorí náà, èmi rò pé a kò yẹ kí a dá àwọn tí kì í ṣe Júù, tí wọ́n ń yí padà sí Ọlọ́run, láàmú[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹni láti inú àwọn orílẹ̀-èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn orílẹ̀-èdè,” ṣùgbọ́n níbí ó ń tọ́ka sí àwọn tí kì í ṣe Júù tí wọ́n ń yí padà sí Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èmi parí èrò sí i pé a kò yẹ kí a dá ... láàmú” tàbí “ìdájọ́ mi ni pé a má ṣe dá ... láàmú.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí Jákọ́bù fà jáde láti inú ọ̀rọ̀ tó ṣáájú hàn.
- source_word: ἐγὼ κρίνω
  choice: èmi pinnu pé
  rationale: Ó pa ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ ἐγώ mọ́, ó sì sọ ìdájọ́ tàbí ìpinnu tí Jákọ́bù gbé kalẹ̀ ní Yorùbá àdánidá.
- source_word: μὴ παρενοχλεῖν
  choice: kí a má ṣe yọ ... lẹ́nu
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti dá ẹni láàmú tàbí mú ìṣòro bá a; ìtumọ̀ yìí tún fi hàn pé Jákọ́bù ń dábàá ohun tí gbogbo àpéjọ yóò ṣe.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: àwọn tí ó wá láàrín àwọn Kèfèrí
  rationale: Ó tọ́ka sí àwọn ènìyàn kan láti inú àwọn tí kì í ṣe Júù, kì í ṣe sí ẹ̀yà àìmọ́ kan lásán.
- source_word: ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Ní àyíká ọ̀rọ̀ Júù àti Kristẹni yìí, ó ń tọ́ka sí àwọn tí kì í ṣe Júù; ‘Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀, ṣùgbọ́n àlàyé ẹsẹ̀ ìsàlẹ̀ fi ‘orílẹ̀-èdè’ gẹ́gẹ́ bí ìtumọ̀ gangan hàn.
- source_word: ἐπιστρέφουσιν
  choice: tí wọ́n ń yípadà
  rationale: Àpólà aláìpé tó wà ní àsìkò ìsinsìnyí fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì pa àwòrán yíyí sí Ọlọ́run mọ́.
- source_word: ἐπὶ τὸν θεόν
  choice: sí Ọlọ́run
  rationale: Ó sọ ibi tí ìyípadà náà dojú kọ ní ọ̀nà tó ṣe àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ náà jẹ́ èrò Jákọ́bù nìkan tàbí ìdájọ́ ara rẹ̀ tí ó tún jẹ́ àbá fún gbogbo àpéjọ
  choice: “èmi pinnu pé kí a má ṣe yọ...”
  alternative: “èmi pinnu láti má ṣe yọ...” tàbí “ìdájọ́ mi ni pé kí a má ṣe yọ...”
  rationale: κρίνω jẹ́ ẹni àkọ́kọ́ ẹyọ, ṣùgbọ́n gbólóhùn infinitive tó tẹ̀ lé e jẹ́ ohun tí ìpinnu náà ní kí àwùjọ ṣe. Ìtumọ̀ yìí pa ohùn Jákọ́bù àti ipa àbá fún àpéjọ mọ́ láì sọ ọ́ di àṣẹ ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Yọ ... lẹ́nu’ jẹ́ ọ̀nà àdánidá láti sọ dídá ẹni láàmú; ‘Kèfèrí’ ní ìtumọ̀ Bíbélì rẹ̀ gẹ́gẹ́ bí ẹni tí kì í ṣe Júù, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn.
