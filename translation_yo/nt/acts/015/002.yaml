id: ACT.15.2
reference: Acts 15:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: yo
  text: Nígbà tí ìforígbárí àti àríyànjiyàn tí kò kéré[a] bẹ̀rẹ̀ láàárín Paulu àti Barnaba àti àwọn ọkùnrin náà, wọ́n yan Paulu àti Barnaba, pẹ̀lú àwọn mìíràn lára wọn, láti lọ gòkè[b] sí ọ̀dọ̀ àwọn àpọ́sítélì àti àwọn alàgbà ní Jerúsálẹ́mù nípa ọ̀ràn yìí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìforígbárí àti àríyànjiyàn tí kì í ṣe kékeré.” Gíríìkì lo ọ̀nà àsọyé “tí kò kéré” láti tẹnu mọ́ bí àríyànjiyàn náà ti le tó.
    reason: lexical_alternative
  - marker: b
    text: “Lọ gòkè” jẹ́ ọ̀nà àsọyé Gíríìkì tí a sábà máa ń lò fún ìrìn àjò sí Jerúsálẹ́mù.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nípa kókó yìí” tàbí “nípa ìbéèrè yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Lẹ́yìn tí ... ní
  rationale: Ó fi ìṣẹ̀lẹ̀ tó ṣáájú ìgbésẹ̀ pàtàkì hàn ní Yorùbá àdánidá, ó sì pa agbára genitive absolute mọ́ gẹ́gẹ́ bí àyíká àkókò.
- source_word: στάσεως καὶ ζητήσεως
  choice: ìforígbárí àti àríyànjiyàn
  rationale: “Ìforígbárí” fi ìtakora tó le hàn láì sọ ọ́ di ìwà ipá, “àríyànjiyàn” sì ṣàfihàn ìjíròrò gbígbóná tó wà nínú ζητήσεως.
- source_word: οὐκ ὀλίγης
  choice: tí kò kéré
  rationale: Èyí pa ọ̀nà àsọyé litotes Gíríìkì mọ́, ó sì tẹnu mọ́ bí ìforígbárí náà ti le tó.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: Paulu àti Barnaba bá àwọn ọkùnrin náà ní
  rationale: Ọ̀nà yìí ṣe kedere pé Paulu àti Barnaba àti àwọn ọkùnrin tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú ni àwọn ẹgbẹ́ inú ìforígbárí náà, láì fi ìtakora tó ju ti Gíríìkì lọ kún un.
- source_word: ἔταξαν
  choice: wọ́n yan
  rationale: “Wọ́n yan” fi hàn pé àwùjọ náà yan àwọn aṣojú fún ìrìn àjò náà; kò sọ ètò ìṣàkóso ìjọ kan pàtó tí ọ̀rọ̀ Gíríìkì kò sọ.
- source_word: ἀναβαίνειν
  choice: láti gòkè lọ
  rationale: Ó pa ọ̀rọ̀ ìrìn àjò Gíríìkì tí a sábà máa ń lò fún lílọ sí Jerusalẹmu mọ́.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: àwọn mìíràn nínú wọn
  rationale: Ó fi hàn pé àwọn aṣojú míì wá láti inú àwùjọ náà, láì fi akọ tàbí iye tí Gíríìkì kò sọ kún un.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: àwọn aposteli àti àwọn alàgbà
  rationale: “Aposteli” jẹ́ orúkọ oyè tí a mọ̀ dáadáa nínú Ìṣe Àwọn Aposteli, “àwọn alàgbà” sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn aṣáájú wọ̀nyí.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: lórí ọ̀ràn yìí
  rationale: “Ọ̀ràn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì gba ìtumọ̀ ohun tí wọ́n ń jiyàn lé lórí láì yanju irú ọ̀ràn náà ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Àwọn ẹgbẹ́ tó wà nínú ìforígbárí
  choice: Paulu àti Barnaba bá “àwọn ọkùnrin náà” ní ìforígbárí; àwọn ọkùnrin náà tọ́ka sí àwọn tó wá láti Judea ní ẹsẹ tó ṣáájú.
  alternative: A lè sọ ọ́ ní ọ̀nà tó túbọ̀ tẹ̀ lé ìṣètò Gíríìkì pé ìforígbárí wà “láàárín Paulu àti Barnaba àti àwọn náà.”
  rationale: Yíyan yìí mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí kedere gẹ́gẹ́ bí àyíká ìtàn ṣe fihàn, láì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ètò àwùjọ nínú ἔταξαν
  choice: “Wọ́n yan” fi yíyan àwọn aṣojú nípasẹ̀ àwùjọ hàn.
  alternative: “Wọ́n pinnu” tàbí “wọ́n ṣètò.”
  rationale: Ọ̀rọ̀ náà fi ìgbésẹ̀ àwùjọ tó létò hàn, ṣùgbọ́n kò sọ irú ìṣàkóso ìjọ kan pàtó.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. Gbólóhùn náà tẹ̀ lé ìtàn lọ́nà àdánidá, ó pa litotes àti ọ̀rọ̀ ìrìn àjò sí Jerusalẹmu mọ́, kò sì fi ètò ìjọ tàbí ẹ̀kọ́ ẹ̀sìn tí orísun kò sọ kún un.
