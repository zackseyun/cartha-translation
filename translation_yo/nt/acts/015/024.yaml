id: ACT.15.24
reference: Acts 15:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: yo
  text: Nítorí a ti gbọ́ pé àwọn kan lára wa ti jáde lọ, wọ́n sì fi ọ̀rọ̀ dá yín láàmú, nípa mímú ọkàn yín rú[a], àwọn tí àwa kò fún ní ìtọ́ni kankan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa mímú inú yín rú.” “Ọkàn yín” níbí tọ́ka sí gbogbo inú-ẹni yín, kì í ṣe ìmọ̀lára nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí àwa kò pàṣẹ fún.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Nítorí
  rationale: Ó ṣe àgbékalẹ̀ ìdí fún ohun tí lẹ́tà náà ń sọ; “Nítorí” jẹ́ ọ̀nà àdánidá láti pa agbára ìdí náà mọ́ ní Yorùbá.
- source_word: ἠκούσαμεν
  choice: a ti gbọ́
  rationale: Ó fi hàn pé ìròyìn náà ti dé etí wọn, ó sì ṣì ṣe pàtàkì ní àkókò tí wọ́n kọ lẹ́tà náà.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: àwọn kan láti ọ̀dọ̀ wa jáde
  rationale: Ó pa ìpilẹ̀ṣẹ̀ wọn láàárín ẹgbẹ́ Jerúsálẹ́mù àti jíjáde wọn mọ́, láì sọ pé a rán wọn.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: wọ́n sì fi ọ̀rọ̀ wọn yọ yín lẹ́nu
  rationale: “Fi ọ̀rọ̀ wọn” ṣàfihàn λόγοις gẹ́gẹ́ bí ohun èlò, “yọ yín lẹ́nu” sì sọ ìdààmú tí wọ́n dá sílẹ̀ ní Yorùbá àdánidá.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: wọ́n ń da ọkàn yín rú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi inú ẹni rú tàbí yí ìdúró inú rẹ̀ po; “ọkàn yín” tọ́ka sí inú-ẹni wọn, kì í ṣe ìmọ̀lára nìkan.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: àwọn ẹni tí àwa kò fún ní ìtọ́ni kankan
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ arọ́pò-orúkọ náà mọ́, ó sì sẹ́ pé àwọn ọkùnrin náà gba àṣẹ tàbí ìtọ́ni lọ́wọ́ àwọn olùkọ lẹ́tà.
theological_decisions:
- issue: Bóyá kí a mú àìní àṣẹ àwọn tó ń dá wọn láàmú hàn gbangba
  choice: àwọn ẹni tí àwa kò fún ní ìtọ́ni kankan
  alternative: àwọn ẹni tí àwa kò pàṣẹ fún
  rationale: Gíríìkì sẹ́ pé ẹgbẹ́ Jerúsálẹ́mù fún wọn ní àṣẹ tàbí ìtọ́ni. Ìtumọ̀ yìí pa kókó náà mọ́ láì fi ọ̀rọ̀ àlékún sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìṣètò gbólóhùn Gíríìkì mọ́ dé ibi tí Yorùbá àdánidá gbà.
