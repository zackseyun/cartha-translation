id: ACT.15.32
reference: Acts 15:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: yo
  text: Júdásì àti Sílà, tí àwọn fúnra wọn jẹ́ wòlíì, fi ọ̀rọ̀ púpọ̀ gba àwọn arákùnrin[a] níyànjú, wọ́n sì mú wọn dúró ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin”; Gíríìkì sọ pé “àwọn arákùnrin,” ó sì lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Júdásì
  rationale: Orúkọ tí a sábà máa ń lò fún Ἰούδας nínú Májẹ̀mú Tuntun ní Yorùbá.
- source_word: τε καὶ
  choice: àti
  rationale: Ó so Júdásì àti Sílà pọ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: Σιλᾶς
  choice: Sílà
  rationale: Ìkọ orúkọ náà ní ọ̀nà tí ó bá ìpè Yorùbá mu.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: àwọn tí àwọn fúnra wọn jẹ́ wòlíì
  rationale: Ó pa ìtẹnumọ́ αὐτοὶ mọ́, ó sì fi ipò wọn gẹ́gẹ́ bí wòlíì hàn gẹ́gẹ́ bí àlàyé ìdí.
- source_word: προφῆται
  choice: wòlíì
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe déédéé fún àwọn tí ń sọ ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run.
- source_word: διὰ λόγου πολλοῦ
  choice: fi ọ̀rọ̀ púpọ̀
  rationale: Ó tẹ̀lé àwòrán Gíríìkì ‘nípasẹ̀ ọ̀rọ̀ púpọ̀,’ ó sì túmọ̀ sí pé wọ́n bá wọn sọ̀rọ̀ ní gígùn.
- source_word: παρεκάλεσαν
  choice: gba ... níyànjú
  rationale: Ó mú ìtumọ̀ ìṣírí àti ìránnilétí alágbára tí παρακαλέω ní nínú àyíká yìí.
- source_word: τοὺς ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Ó pa akọ púpọ̀ inú Gíríìkì mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
- source_word: ἐπεστήριξαν
  choice: mú wọn dúró ṣinṣin
  rationale: Ó sọ ìṣe mímú wọn lágbára tàbí fífi wọn múlẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere, ó sì yàtọ̀ sí ‘gba ... níyànjú.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ τοὺς ἀδελφοὺς níbi tí ó ṣeé ṣe kí gbogbo àwùjọ onígbàgbọ́ wà
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n nínú ìlò Kristẹni ìgbàanì ó lè kó àwọn obìnrin mọ́ra. Ọ̀rọ̀ pàtàkì pa fọ́ọ̀mù orísun mọ́, àkọsílẹ̀ sì fi ìtumọ̀ tí ó lè kó gbogbo àwùjọ mọ́ra hàn.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èyí tí ó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà pa ìtẹnumọ́ ‘àwọn fúnra wọn’ àti ìṣe méjì—ìṣírí àti mímú dúró ṣinṣin—mọ́.
