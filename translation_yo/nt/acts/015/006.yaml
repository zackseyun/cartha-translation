id: ACT.15.6
reference: Acts 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: yo
  text: Àwọn aposteli àti àwọn alàgbà sì péjọ láti gbé ọ̀ràn yìí yẹ̀ wò.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “kóra jọ” tàbí “wá sí àpéjọ.” Ọ̀rọ̀ Gíríìkì náà ní ìrísí passive ní gírámà, ṣùgbọ́n ní àyíká yìí ó sábà máa ń túmọ̀ sí pé ẹgbẹ́ náà péjọ.
    reason: lexical_alternative
  - marker: b
    text: 'Ní gígún gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì: “láti rí nípa ọ̀rọ̀ yìí.” Níhìn-ín, “ọ̀rọ̀” túmọ̀ sí kókó tàbí ọ̀ràn tí wọ́n ń jíròrò.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: péjọ
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive ní ìrísí, ṣùgbọ́n ní àyíká yìí ó ń sọ nípa bí ẹgbẹ́ náà ṣe kóra jọ. “Péjọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtumọ̀ yẹn hàn láìfi passive tí kò rọrùn síwájú.
- source_word: τε
  choice: Nítorí náà
  rationale: Particle náà so ẹsẹ yìí mọ́ ìṣẹ̀lẹ̀ tó ṣáájú, ó sì fi ìtẹ̀síwájú ìtàn hàn. “Nítorí náà” mú ìsopọ̀ yẹn jáde ní Yorùbá.
- source_word: ἀπόστολοι
  choice: àwọn aposteli
  rationale: Ní Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tí a mọ̀ sí aposteli; yíyan ọ̀rọ̀ ìjọsìn Yorùbá tí ó ti wọ́pọ̀ yìí dá ìtumọ̀ náà mọ́.
- source_word: πρεσβύτεροι
  choice: àwọn alàgbà
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí àwọn aṣáájú tí a mọ̀ láàárín ìjọ, kì í ṣe àwọn ọkùnrin àgbà lásán. “Àwọn alàgbà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìgbé ètò ìjọ ẹ̀ya kan wọ inú ẹsẹ náà.
- source_word: ἰδεῖν
  choice: láti gbé ... yẹ̀ wò
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ni “láti rí,” infinitive náà níhìn-ín ń tọ́ka sí ṣíṣe àyẹ̀wò àti ìgbìmọ̀ lórí ọ̀ràn kan. “Gbé ... yẹ̀ wò” sọ ète ìpàdé náà ní Yorùbá àdánidá.
- source_word: περὶ τοῦ λόγου τούτου
  choice: ọ̀ràn yìí
  rationale: λόγος lè túmọ̀ sí ọ̀rọ̀, ìhìn, tàbí ọ̀ràn. Nínú àyíká àríyànjiyàn yìí, ó ń tọ́ka sí kókó tí wọ́n ń jíròrò, nítorí náà “ọ̀ràn yìí” ni ó bá àyíká mu jù.
theological_decisions:
- issue: Ìtumọ̀ ipò πρεσβύτεροι nínú ìpàdé Jerusalẹmu
  choice: “Àwọn alàgbà,” láìfi ètò ipò ìjọ ti ẹ̀ya ìsìn kan kun un.
  alternative: Kí a lò ọ̀rọ̀ amọ̀-iṣẹ́ kan tó so wọn mọ́ ipò ìjọ tí ó dágbà sí i lẹ́yìn náà.
  rationale: Ẹsẹ náà dá wọn mọ̀ gẹ́gẹ́ bí àwọn aṣáájú ìjọ Jerusalẹmu, ṣùgbọ́n kò ṣàlàyé ètò ìṣàkóso ìjọ kan pàtó. “Àwọn alàgbà” pa ìtumọ̀ ìtàn àti ti ọ̀rọ̀ náà mọ́ láìṣe àfikún.
- issue: Ète ìgbìmọ̀ náà
  choice: “Láti gbé ọ̀ràn yìí yẹ̀ wò,” èyí tó fi ìwádìí àti ìgbìmọ̀ hàn.
  alternative: “Láti pinnu ọ̀ràn yìí,” èyí tó lè fi hàn pé wọ́n ti dé ìdájọ́ ní kánkán.
  rationale: ἰδεῖν níhìn-ín ń fi gbígbé ọ̀ràn náà yẹ̀ wò hàn, kì í ṣe pé ẹsẹ yìí fúnra rẹ̀ ti kéde àbájáde tàbí ìpinnu kan.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Aposteli” àti “alàgbà” jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀ nínú èdè ìjọ Yorùbá, nígbà tí “gbé ọ̀ràn yẹ̀ wò” jẹ́ gbólóhùn àdánidá fún ìgbìmọ̀ láìsọ pé wọ́n ti pinnu àbájáde.
