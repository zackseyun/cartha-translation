  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọyé, ìdánwò Ọlọ́run, àti àwòrán àjàgà tí a gbé lé ọrùn àwọn ọmọ-ẹ̀yìn mọ́ dáadáa. Síbẹ̀, «sí ọrùn» kì í sọ ìgbésẹ̀ fífi àjàgà *lé* ọrùn ní kedere bí ἐπὶ τὸν τράχηλον ṣe ń ṣe; «lé ọrùn» dára jù. «Nísinsìnyí náà» tún jẹ́ ìtẹ̀lé Yorùbá tó rọrùn fún νῦν οὖν.
