id: ACT.15.10
reference: Acts 15:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: yo
  text: Nísinsìnyí náà, èé ṣe tí ẹ fi ń dán Ọlọ́run wò[a] nípa fífi àjàgà[b] lé ọrùn àwọn ọmọ-ẹ̀yìn, èyí tí àwọn baba wa[c] kò lè rù, tí àwa náà kò sì lè rù?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ fi Ọlọ́run ṣe àdánwò.”
    reason: lexical_alternative
  - marker: b
    text: “Àjàgà” jẹ́ àpèjúwe ojúṣe tí a fi lé ẹni kan lọ́rùn; nínú àyíká yìí, ó ń tọ́ka sí àwọn ohun tí a ń béèrè lọ́wọ́ àwọn ọmọ-ẹ̀yìn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn baba ńlá wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nítorí náà, nísinsìnyí
  rationale: Ó pa agbára ìyọrísí οὖν àti ìtọ́kasí sí àkókò yìí nínú νῦν mọ́, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: τί πειράζετε τὸν θεόν
  choice: èé ṣe tí ẹ fi ń dán Ọlọ́run wò
  rationale: Nínú ìbéèrè àsọyé yìí, τί túmọ̀ sí ‘èé ṣe,’ πειράζετε sì ń tọ́ka sí fífi Ọlọ́run sí àdánwò.
- source_word: ἐπιθεῖναι
  choice: nípa fífi
  rationale: Ó fi hàn pé gbígbé àjàgà náà sí wọn ni ọ̀nà tí wọ́n fi ń dán Ọlọ́run wò.
- source_word: ζυγὸν
  choice: àjàgà
  rationale: A pa àwòrán ohun tí a fi ń di ẹranko fún iṣẹ́ mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ‘ọ̀ranyàn’ tàbí ‘ẹrù’ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐπὶ τὸν τράχηλον
  choice: sí ọrùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a gbé àjàgà lé ọrùn, ó sì pa àwòrán Gíríìkì mọ́.
- source_word: τῶν μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ μαθηταί mu nínú Ìṣe àwọn Aposteli.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: àwọn baba wa kò lè ru, tí àwa náà kò sì lè ru
  rationale: Àtúnsọ ọ̀rọ̀-ìṣe náà mú ìtumọ̀ ‘bẹ́ẹ̀ kọ́ fún àwọn baba wa, bẹ́ẹ̀ kọ́ fún àwa náà’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: kò lè ru
  rationale: ‘Lè’ sọ agbára tàbí àìní agbára, ‘ru’ sì bá àwòrán àjàgà mu láìyí i padà sí àlàyé lasán.
theological_decisions:
- issue: Ohun tí àpèjúwe ‘àjàgà’ dúró fún
  choice: A pa ‘àjàgà’ mọ́ gẹ́gẹ́ bí àpèjúwe ọ̀ranyàn tí a fẹ́ fi lé àwọn ọmọ-ẹ̀yìn lọ́rùn, láìsọ pàtó ju ohun tí ẹsẹ yìí fúnra rẹ̀ sọ lọ.
  alternative: Kí a túmọ̀ àjàgà náà ní pàtó sí gbogbo Òfin Mósè, tàbí ní ọ̀nà tóóró sí ìdádọ̀dọ́ àti àwọn ohun mìíràn tí a ń béèrè lọ́wọ́ àwọn onígbàgbọ́ aláìkọlà.
  rationale: Àyíká ẹsẹ náà ń sọ nípa àwọn ohun tí a fẹ́ béèrè lọ́wọ́ àwọn onígbàgbọ́ aláìkọlà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo àpèjúwe. Ìtumọ̀ náà kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tóóró kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìbéèrè náà ní agbára àsọyé, àwòrán ‘àjàgà sí ọrùn’ sì dúró ṣinṣin. Àtúnsọ ‘kò lè ru’ fún ẹgbẹ́ méjèèjì mú ìtumọ̀ οὔτε…οὔτε ṣe kedere fún òǹkàwé Yorùbá.
