  terminology: «Àjàgà», «ọmọ-ẹ̀yìn», àti «Ọlọ́run» bá ìlò Yorùbá ìgbàlódé àti ìtumọ̀ ìpìlẹ̀ mu. Àlàyé àkọsílẹ̀ b ni a ṣàtúnṣe sí «ojúṣe tí a fi lé ẹni kan lọ́rùn» kí ó lè jẹ́ Yorùbá tó mọ́, kí ó sì má ṣe sọ ohun tí àpèjúwe náà túmọ̀ sí ní pàtó ju àyíká ẹsẹ lọ.
