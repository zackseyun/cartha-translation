  to: Ṣùgbọ́n a gbàgbọ́ pé nípasẹ̀ oore-ọ̀fẹ́ Olúwa Jésù ni a ó gba ìgbàlà, gẹ́gẹ́ bí àwọn náà pẹ̀lú.[a]
