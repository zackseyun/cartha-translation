  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: yo
  text: Ṣùgbọ́n a gbàgbọ́ pé nípasẹ̀ oore-ọ̀fẹ́ Olúwa Jésù ni a ó gba ìgbàlà, gẹ́gẹ́ bí àwọn náà pẹ̀lú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà sí i: “a gbàgbọ́ láti gba ìgbàlà nípasẹ̀ oore-ọ̀fẹ́ Olúwa Jésù, ní ọ̀nà kan náà bí àwọn náà pẹ̀lú.” Ọ̀rọ̀ Gíríìkì kò tún ọ̀rọ̀-ìṣe náà sọ lẹ́yìn “àwọn náà pẹ̀lú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakò tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: διὰ τῆς χάριτος
  choice: nípasẹ̀ oore-ọ̀fẹ́
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ inú genitive ń tọ́ka sí ọ̀nà tàbí ohun èlò; “nípasẹ̀” pa ìtumọ̀ yìí mọ́.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ oore tí Ọlọ́run ń fi fúnni mu ní àyíká ìgbàlà.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jesu
  rationale: Genitive náà ṣe àlàyé ẹni tí oore-ọ̀fẹ́ náà ti wá; “Olúwa” pa àkọlé κύριος mọ́.
- source_word: πιστεύομεν
  choice: a gbàgbọ́ pé
  rationale: Ó sọ ìdánilójú àwọn olùsọ̀rọ̀, “pé” sì mú gbólóhùn infinitive tó tẹ̀ lé e di Yorùbá àdánidá.
- source_word: σωθῆναι
  choice: a ó fi gbà wá là
  rationale: Aorist passive infinitive náà ni a tú sí ọ̀rọ̀ ọjọ́ iwájú tó mọ́ ní Yorùbá; àkópọ̀ “nípasẹ̀ … ni … fi” fi ọ̀nà ìgbàlà hàn, bí ó tilẹ̀ jẹ́ pé Yorùbá sábà máa ń sọ “gbà … là” ní active.
- source_word: καθ’ ὃν τρόπον
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ìfiwéra ọ̀nà tàbí ìlànà kan náà mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: κἀκεῖνοι
  choice: àwọn náà pẹ̀lú
  rationale: Ó pa καί (“pẹ̀lú/ní tiwọn náà”) àti ἐκεῖνοι (“àwọn náà”) mọ́ láì yí ibi tí ìfiwéra náà ń lọ padà.
theological_decisions:
- issue: Ibi tí ìfiwéra Peteru ń lọ
  choice: “Àwa” (àwọn Júù tó gbàgbọ́) ni a sọ pé a ó gbà là gẹ́gẹ́ bí “àwọn náà pẹ̀lú” (àwọn Kèfèrí).
  alternative: Àwọn Kèfèrí ni a ó gbà là gẹ́gẹ́ bí àwọn Júù.
  rationale: Ìtò ọ̀rọ̀ Gíríìkì fi “a gbàgbọ́ pé a ó gbà wá là” síwájú, ó sì fi κἀκεῖνοι ṣe ẹgbẹ́ ìfiwéra. A kò yí ìtẹnumọ́ pàtàkì yìí padà.
- issue: Ìgbàlà nípasẹ̀ oore-ọ̀fẹ́
  choice: A sọ pé ìgbàlà wá nípasẹ̀ oore-ọ̀fẹ́ Olúwa Jesu, láì fi àlàyé ẹ̀kọ́ ìjọ mìíràn kún un.
  alternative: Fífi àwọn gbólóhùn bí “nípasẹ̀ oore-ọ̀fẹ́ nìkan àti ìgbàgbọ́ nìkan” kún un.
  rationale: Ẹsẹ náà sọ oore-ọ̀fẹ́ àti ìgbàgbọ́, ṣùgbọ́n kò sọ àwọn àfikún ẹ̀kọ́ wọ̀nyẹn ní ọ̀nà yẹn; ìtumọ̀ kò gbọ́dọ̀ fi ohun tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Oore-ọ̀fẹ́” àti “Olúwa Jesu” jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání fún àwọn òǹkàwé lasán. Gbólóhùn pàtàkì ń pa ìdarí ìfiwéra Gíríìkì mọ́, àlàyé ìtò ọ̀rọ̀ tó túbọ̀ sun mọ́ orísun sì wà nínú àlàyé ìsàlẹ̀.
