source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí a rán wọn jáde[a], wọ́n sọ̀kalẹ̀ lọ sí Áńtíókù[b]. Nígbà tí wọ́n ti kó ọ̀pọ̀ ènìyàn náà jọ[c], wọ́n fi lẹ́tà náà lé wọn lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí a dá wọn sílẹ̀” tàbí “lẹ́yìn tí a yọ̀ǹda fún wọn láti lọ.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ríran ènìyàn lọ ní ìlànà tàbí dídá a sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Sọ̀kalẹ̀ lọ” tẹ̀ lé ìtọ́sọ́nà ọ̀rọ̀ Gíríìkì; ó ṣeé ṣe kí ó tọ́ka sí ìsọ̀kalẹ̀ láti ibi gíga Jerúsálẹ́mù lọ sí Áńtíókù.
    reason: cultural_note
  - marker: c
    text: Ní èdè Gíríìkì, “ọ̀pọ̀ ènìyàn náà”; ó tún lè jẹ́ “àwùjọ náà” tàbí “ìjọ náà.” Níhìn-ín, ó tọ́ka sí ẹgbẹ́ tí ó péjọ ní Áńtíókù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: lẹ́yìn tí a rán wọn jáde
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé a dá wọn sílẹ̀ tàbí pé a rán wọn lọ ní ìlànà. Nínú àyíká yìí, ‘rán wọn jáde’ bá ìrìn-àjò tí a fún wọn láṣẹ láti ṣe mu, láìpa àwọn ìtumọ̀ mìíràn rẹ́ run.
- source_word: κατῆλθον
  choice: wọ́n sọ̀kalẹ̀ lọ
  rationale: Èyí pa ìtumọ̀ ìtọ́sọ́nà ọ̀rọ̀ Gíríìkì mọ́, ó sì bá fífi ibi gíga Jerúsálẹ́mù sílẹ̀ lọ sí Áńtíókù mu.
- source_word: συναγαγόντες
  choice: wọ́n pe ... jọ
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé wọ́n kọ́kọ́ kó ẹgbẹ́ náà jọ kí wọ́n tó fi lẹ́tà náà lé wọn lọ́wọ́.
- source_word: τὸ πλῆθος
  choice: gbogbo àwọn onígbàgbọ́
  rationale: Ní àyíká Ìṣe 15, gbólóhùn náà tọ́ka sí àwùjọ àwọn onígbàgbọ́ ní Áńtíókù. ‘Gbogbo àwọn onígbàgbọ́’ ṣe kedere ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro bí ‘àwùjọ’ sílẹ̀.
- source_word: ἐπέδωκαν
  choice: wọ́n fi ... lé wọn lọ́wọ́
  rationale: Ó sọ fífi lẹ́tà náà fún àwùjọ ní ọ̀nà tí ó ní ìlànà, ó sì jẹ́ gbólóhùn Yorùbá tí ó rọrùn láti lóye.
- source_word: ἐπιστολήν
  choice: lẹ́tà náà
  rationale: ‘Lẹ́tà’ ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ìwé tí a kọ ránṣẹ́, láìlo èdè ẹ̀sìn àrà ọ̀tọ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní àmì ohùn níbi tí ó ti yẹ, ni a lò. Ìtumọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì tẹ̀ lé bí àwọn ìṣe ṣe tẹ̀ lé ara wọn nínú Gíríìkì. A yà gbólóhùn náà sí méjì fún ìṣàn Yorùbá àdánidá.
