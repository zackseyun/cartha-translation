source:
  edition: SBLGNT
  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: yo
  text: Nígbà tí wọ́n ka lẹ́tà náà tán,[a] inú wọn dùn nítorí ọ̀rọ̀ ìṣírí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ó tún lè jẹ́: “Nígbà tí wọ́n kà á tán, inú wọn dùn sí ìṣírí náà.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìyanju” tàbí “ìtùnú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Nígbà tí wọ́n ka lẹ́tà náà tán
  rationale: Aorist participle náà ṣàfihàn ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì. A mú ohun tí wọ́n kà, ìyẹn lẹ́tà tí ẹsẹ tó ṣáájú mẹ́nu kàn, hàn gbangba nítorí èdè Yorùbá nílò rẹ̀ fún ìtumọ̀ àdánidá.
- source_word: δὲ
  choice: (a fi hàn nínú ìtẹ̀síwájú gbólóhùn náà)
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; ìtẹ̀síwájú àdánidá láti inú ẹsẹ tó ṣáájú ti fi iṣẹ́ rẹ̀ hàn, láìjẹ́ pé a fi àsopọ̀ tí yóò mú ìtakora tó lágbára wọlé.
- source_word: ἐχάρησαν
  choice: inú wọn dùn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi ayọ̀ tí χαίρω túmọ̀ sí hàn, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐπὶ
  choice: nítorí
  rationale: ἐπί pẹ̀lú dative níbí fi ìdí tàbí ohun tó fa ayọ̀ náà hàn; “nítorí” sọ ìbáṣepọ̀ yẹn ní kedere.
- source_word: τῇ παρακλήσει
  choice: ọ̀rọ̀ ìṣírí rẹ̀
  rationale: παράκλησις lè túmọ̀ sí ìṣírí, ìkìlọ̀/ìyanju, tàbí ìtùnú. “Ọ̀rọ̀ ìṣírí” bá ipa lẹ́tà náà mu ní àyíká yìí, “rẹ̀” sì tọ́ka sí lẹ́tà náà láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìtumọ̀ παράκλησις
  choice: ọ̀rọ̀ ìṣírí
  alternative: ìyanju tàbí ìtùnú
  rationale: Àyíká fi hàn pé lẹ́tà náà fún àwọn onígbàgbọ́ ní agbára àti ayọ̀ lẹ́yìn àríyànjiyàn; síbẹ̀, a pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “lẹ́tà náà” dípò arọ́pò-orúkọ lásán láti mú ohun tí àyíká ń tọ́ka sí ṣe kedere; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó kan.
