source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: yo
  text: àwọn ọkùnrin tí wọ́n ti fi ẹ̀mí wọn wewu[a] nítorí orúkọ Olúwa wa Jésù Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ‘tí wọ́n ti fi ẹ̀mí wọn sílẹ̀’; ọ̀rọ̀ Gíríìkì náà jẹ́ àpèjúwe fún fífi ara ẹni sínú ewu ikú.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní ‘Jésù Kristi’; a túmọ̀ Χριστός sí ‘Mèsáyà’ níbí nítorí pé ó jẹ́ oyè tó túmọ̀ sí ẹni tí a fòróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘àwọn ènìyàn’ ní gbogbogbò, ṣùgbọ́n níbí ó ń tọ́ka sí Bánábà àti Pọ́ọ̀lù ní pàtó; nítorí náà ‘àwọn ọkùnrin’ bá àwọn tí a ń sọ̀rọ̀ nípa wọn mu.
- source_word: παραδεδωκόσι
  choice: tí wọ́n ti ... wewu
  rationale: Perfect participle náà túmọ̀ ní ti gidi sí fífi ohun lé ẹlòmíràn lọ́wọ́ tàbí fífi í sílẹ̀. Pẹ̀lú ‘ẹ̀mí wọn,’ ó jẹ́ ọ̀rọ̀ àpèjúwe fún yíyan láti dojú kọ ewu ikú; ‘fi ẹ̀mí wọn wewu’ sọ ìtumọ̀ náà ní Yorùbá àdánidá láì sọ pé wọ́n ti kú.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ẹ̀mí wọn
  rationale: Nínú àyíká ewu àti ìrúbọ yìí, ψυχή ń tọ́ka sí ìyè ẹni, kì í ṣe kìkì apá àìrí ti ènìyàn. Gbólóhùn Yorùbá ‘fi ẹ̀mí wewu’ túmọ̀ sí fífi ìyè sínú ewu.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Pẹ̀lú genitive níbí, ὑπέρ ń fi ohun tí ó fa ìṣe náà tàbí ohun tí a ṣe é fún hàn. ‘Nítorí’ jẹ́ kedere, ó sì bá Yorùbá mu.
- source_word: τοῦ ὀνόματος
  choice: orúkọ
  rationale: A pa ‘orúkọ’ mọ́, nítorí nínú lílo Bíbélì ó lè kó ẹni náà, ọlá rẹ̀ àti àṣẹ rẹ̀ sínú; títúmọ̀ rẹ̀ sí ‘àṣẹ’ nìkan yóò dín ìtumọ̀ náà kù.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tó yẹ fún κύριος, ó sì pa ìwọ̀n àti ìtumọ̀ oyè Kristi mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Jésù jẹ́ orúkọ, nígbà tí Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, ẹni tí a fòróró yàn. ‘Jésù Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò kí ó dà bí orúkọ ìdílé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn kedere, nígbà tí ‘Kristi’ lè dà bí apá kan nínú orúkọ Jésù fún ọ̀pọ̀ òǹkàwé.
- issue: Bóyá παραδεδωκόσι τὰς ψυχὰς αὐτῶν sọ pé àwọn ọkùnrin náà kú ní ti gidi
  choice: fi ẹ̀mí wọn wewu
  alternative: fi ẹ̀mí wọn sílẹ̀
  rationale: Àwọn ọkùnrin náà ṣì wà láàyè, nítorí náà ọ̀rọ̀ Gíríìkì jẹ́ àpèjúwe ìfarahàn sí ewu ikú, kì í ṣe ìjẹ́rìí pé wọ́n ti kú. Ìtumọ̀ àkọ́kọ́ yẹ kí ó pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Gbólóhùn náà jẹ́ àjákù tó ń bá ẹsẹ 25 lọ, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú ‘àwọn ọkùnrin.’
