revisions:
- from: Ṣùgbọ́n àwọn kan lára àwọn tí ó ti gbàgbọ́, tí wọ́n sì wá láti inú ẹgbẹ́ àwọn Farisí, dìde[a], wọ́n ní, “Ó pọndandan láti kọ àwọn wọ̀nyí ní ilà, kí a sì pàṣẹ fún wọn láti pa òfin Mósè mọ́.”
  to: Ṣùgbọ́n àwọn kan láti inú ẹgbẹ́ àwọn Farisí, tí wọ́n ti gbàgbọ́, dìde[a], wọ́n sì ní, “Ó pọndandan kí a kọ wọn ní ilà, kí a sì pàṣẹ fún wọn pé kí wọ́n pa òfin Mósè mọ́.”
