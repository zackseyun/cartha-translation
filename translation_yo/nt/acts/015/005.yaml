  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ àkọ́kọ́ ń pa ìtumọ̀ gbogbogbò ti Gíríìkì mọ́, ṣùgbọ́n “àwọn wọ̀nyí” fi àmì ìtọ́ka (demonstrative) kún αὐτούς tí kò sí nínú ọ̀rọ̀ ìpilẹ̀. Ìkọ́ ọrọ̀ ‘pàṣẹ fún wọn láti pa òfin ... mọ́’ sì lè túmọ̀ sí pé àwọn yẹn fúnra wọn ni a pàṣẹ fún láti ṣe pàṣẹ. Àtúnṣe náà sọ pé àṣẹ náà ni kí wọ́n pa òfin mọ́ ní kedere.
  naturalness: “Àwọn kan láti inú ẹgbẹ́ àwọn Farisí, tí wọ́n ti gbàgbọ́” jẹ́ ọ̀nà Yorùbá ìgbàlódé tí ó hàn gbangba. “Ó pọndandan kí a kọ wọn ní ilà, kí a sì pàṣẹ fún wọn pé kí wọ́n pa òfin Mósè mọ́” jẹ́ ìṣọ̀kan gbolohun tí ó dáa, ó sì jẹ́ kí ìbáṣepọ̀ láàárín ‘pàṣẹ’ àti ‘pa òfin mọ́’ yege.
