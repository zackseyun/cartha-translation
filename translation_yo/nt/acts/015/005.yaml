id: ACT.15.5
reference: Acts 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan láti inú ẹgbẹ́ àwọn Farisí, tí wọ́n ti gbàgbọ́, dìde[a], wọ́n sì ní, “Ó pọndandan kí a kọ wọn ní ilà, kí a sì pàṣẹ fún wọn pé kí wọ́n pa òfin Mósè mọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú ẹ̀ya àwọn Farisí.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹgbẹ́ tàbí ilé-ẹ̀kọ́ ìrònú tí a mọ̀ sí, kì í ṣe dandan “ẹ̀kọ́ èké” ní ìtumọ̀ àkànṣe tí ó ní nígbà tó yá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: dìde
  rationale: Ó sọ ìṣe jíjí dìde nínú àpéjọ láti sọ̀rọ̀, láìfi ìtumọ̀ míì kún un.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó jẹ́ ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ tí kò sọ iye tàbí akọ-n-bábo; “àwọn kan” jẹ́ Yorùbá àdánidá.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: tí wọ́n sì wá láti inú ẹgbẹ́ àwọn Farisí
  rationale: “Ẹgbẹ́” fi hàn pé αἵρεσις túmọ̀ sí ẹgbẹ́ tàbí ilé-ẹ̀kọ́ ìrònú níbí, kì í ṣe ẹ̀kọ́ èké ní ìtumọ̀ ẹ̀sìn tí ó wá lẹ́yìn náà.
- source_word: πεπιστευκότες
  choice: àwọn tí ó ti gbàgbọ́
  rationale: '“Ó ti gbàgbọ́” pa ipa perfect mọ́: wọ́n ti ṣe ìgbàgbọ́, ipò náà sì ń bá a lọ; kò sọ wọ́n di àmì-orúkọ lásán.'
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ìtumọ̀ àdánidá fún participle tí ń ṣáájú ohun tí wọ́n sọ, láìfi agbára ọ̀rọ̀ tí Gíríìkì kò sọ kún un.
- source_word: δεῖ
  choice: Ó pọndandan
  rationale: Ó pa ìtumọ̀ àìníṣeéṣe tàbí dandan mọ́, ó sì fi orísun àṣẹ náà sílẹ̀ láìṣàlàyé gẹ́gẹ́ bí Gíríìkì.
- source_word: περιτέμνειν αὐτούς
  choice: láti kọ àwọn wọ̀nyí ní ilà
  rationale: “Kọ ... ní ilà” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ṣíṣe ìkọlà, ó sì pa ohun tí ìṣe náà kan mọ́.
- source_word: παραγγέλλειν
  choice: kí a sì pàṣẹ fún wọn
  rationale: “Pàṣẹ” pa agbára àṣẹ ọ̀rọ̀ náà mọ́; àtúnṣe sí “kí a” mú ẹni tí a kò dárúkọ tí yóò pàṣẹ hàn ní Yorùbá láìdá ẹni pàtó sí i.
- source_word: τε τηρεῖν
  choice: láti pa ... mọ́
  rationale: “Pa òfin mọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún títẹ̀lé tàbí ṣíṣe ohun tí òfin wí.
- source_word: τὸν νόμον Μωϋσέως
  choice: òfin Mósè
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tí ó ṣe kedere, tí kò sì lo ọ̀rọ̀ ẹ̀kọ́ àkànṣe.
theological_decisions:
- issue: Ìtumọ̀ αἵρεσις nínú àyíká ẹgbẹ́ àwọn Júù
  choice: ẹgbẹ́
  alternative: ẹ̀ya ìsìn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ Farisí tí a mọ̀ dáadáa láàárín ẹ̀sìn Júù, kì í ṣe dandan sí ẹ̀kọ́ èké ní ìtumọ̀ Kristẹni tí ó wá lẹ́yìn náà.
- issue: Agbára πεπιστευκότες
  choice: àwọn tí ó ti gbàgbọ́
  alternative: àwọn onígbàgbọ́
  rationale: 'Ìtumọ̀ oníṣe yìí pa ìforígbárí inú ìtàn àti ẹ̀kọ́ Ọlọ́run mọ́: àwọn náà ti gbàgbọ́, síbẹ̀ wọ́n ń béèrè ìkọlà àti pípa òfin Mósè mọ́.'
- issue: Ẹni tí yóò pàṣẹ nínú παραγγέλλειν
  choice: kí a sì pàṣẹ fún wọn
  alternative: kí wọ́n sì pàṣẹ fún wọn
  rationale: Gíríìkì kò sọ ẹni tí yóò ṣe ìkọlà tàbí pàṣẹ ní kedere. “Kí a” pa àìdánimọ̀ yẹn mọ́ ju fífi “wọ́n” kan sí ẹgbẹ́ tó ń sọ̀rọ̀ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A lo “àwọn wọ̀nyí” fún αὐτούς láti tọ́ka sí àwọn Kèfèrí tí ọ̀rọ̀ inú àyíká ẹsẹ náà ń sọ, láìfi orúkọ “Kèfèrí” tí kò sí nínú ẹsẹ yìí kún un. A yà ọ̀rọ̀ tí wọ́n sọ sí inú àmì ọ̀rọ̀ fún kíkà tó rọrùn.
