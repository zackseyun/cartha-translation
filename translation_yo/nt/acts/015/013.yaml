source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n dákẹ́[a], Jákọ́bù dáhùn pé, “Ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin[b], ẹ fetí sí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n dá ọ̀rọ̀ dúró.” Gbólóhùn Gíríìkì náà tọ́ka sí àkókò lẹ́yìn tí àwọn tó ń sọ̀rọ̀ tẹ́lẹ̀ ti parí ọ̀rọ̀ wọn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹ̀yin ọkùnrin, ẹ̀yin arákùnrin.” Ó jẹ́ ọ̀rọ̀ ìpè ọkùnrin tí a máa ń lò ní ọ̀nà ìbòwọ̀. Nínú àyíká yìí, ó ń bá àwọn arákùnrin tí wọ́n péjọ sọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé àwọn mìíràn tún wà nínú àpéjọ náà.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Lẹ́yìn tí wọ́n sì dákẹ́
  rationale: Ìtumọ̀ yìí pa ìtẹ̀lé àkókò μετά mọ́, ó sì fi σιγάω hàn gẹ́gẹ́ bí dídákẹ́ tàbí dídá ọ̀rọ̀ dúró.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ‘ó dáhùn/ó fèsì’ nínú ìtẹ̀síwájú ìjíròrò.
- source_word: Ἰάκωβος
  choice: Jákọ́bù
  rationale: Jákọ́bù ni àkọsílẹ̀ orúkọ Ἰάκωβος tí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ tààrà sílẹ̀ lẹ́yìn ọ̀rọ̀-ìṣe bí ‘dáhùn,’ láìfi àkópọ̀ Gíríìkì tí kò bá èdè Yorùbá mu lé e.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ọkùnrin ará
  rationale: Ó dúró fún méjèèjì ἄνδρες (‘ọkùnrin’) àti ἀδελφοί (‘ará/arákùnrin’), nígbà tí ó ṣì jẹ́ ọ̀rọ̀ ìpè tí Yorùbá lè lóye.
- source_word: ἀκούσατέ μου
  choice: ẹ fetí sí mi
  rationale: Ó fi àṣẹ fún gbígbọ́ pẹ̀lú àfiyèsí hàn ní Yorùbá òde òní.
theological_decisions:
- issue: Ọ̀rọ̀ ìpè akọ nínú àpéjọ
  choice: Ẹ̀yin ọkùnrin ará
  alternative: Ẹ̀yin ará
  rationale: Gíríìkì ní ọ̀rọ̀ ìpè akọ méjì, ἄνδρες àti ἀδελφοί. A pa ìfarahàn akọ náà mọ́ nínú àkọ́kọ́, a sì ṣàlàyé àyíká rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ fetí’ láìfi àmì ohùn sí ‘ẹ’ nítorí pé ó jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, kí a má bàa dà á pọ̀ mọ́ ‘ẹ̀yin’ tàbí àmì ọ̀wọ̀.
