id: ACT.15.21
reference: Acts 15:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: yo
  text: Nítorí, láti àwọn ìran ìgbàanì ni Mósè ti ní àwọn tí ń kéde rẹ̀ ní ìlú kọ̀ọ̀kan[a], tí a ń kà á nínú àwọn sínágọ́gù ní gbogbo ọjọ́ Ìsinmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “Mósè … àwọn tí ń kéde rẹ̀ … a ń kà á.” “Mósè” dúró fún àwọn ìwé tàbí òfin tí ó ní í ṣe pẹ̀lú Mósè.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Orúkọ ẹni náà ni a ṣe àkọ̀dá rẹ̀ ní ìbámu pẹ̀lú ìlò Yorùbá tí ó ti fìdí múlẹ̀; a pa ìtọ́kasí ẹni mọ́ bí ó ti rí nínú Gíríìkì.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń ṣàlàyé ìdí fún ìdájọ́ tí ó ṣáájú.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: láti ìran ìgbàanì
  rationale: Ó pa àwòrán àwọn ìran àtijọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ àkókò tí ó bójú mu ní Yorùbá.
- source_word: κατὰ πόλιν
  choice: ní ìlú kọ̀ọ̀kan
  rationale: Κατά pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan ní agbára pínpín; ‘kọ̀ọ̀kan’ mú ìtumọ̀ ‘ní ìlú gbogbo’ jáde lọ́nà àdánidá.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: àwọn tí ń kéde rẹ̀
  rationale: ‘Kéde’ pa èdè ìpolongo κηρύσσω mọ́; ‘rẹ̀’ tọ́ka sí Mósè gẹ́gẹ́ bí ọ̀nà àpèjúwe fún àwọn ìwé tàbí òfin rẹ̀.
- source_word: ἔχει
  choice: ni ... ti ní
  rationale: Ìṣètò ‘láti ... ni ... ti ní’ ṣàfihàn ipò tí ó bẹ̀rẹ̀ láti ìgbàanì tí ó sì ń bá a lọ títí di ìsinsìnyí.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nínú àwọn sínágọ́gù
  rationale: Ó sọ ibi tí kíkà Mósè ti máa ń wáyé déédéé; ‘sínágọ́gù’ jẹ́ àkọ̀dá orúkọ ilé ìjọsìn Júù.
- source_word: κατὰ πᾶν σάββατον
  choice: ní gbogbo ọjọ́ Ìsinmi
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ń tún wáyé ní Sábáàtì kọ̀ọ̀kan hàn ní ọ̀nà tí ó yé àwọn òǹkàwé Yorùbá.
- source_word: ἀναγινωσκόμενος
  choice: a sì ń kà á
  rationale: Ó pa ohùn àìṣe-taara àti ìṣe tí ń ṣẹlẹ̀ déédéé mọ́. ‘Sì’ so gbolohun aláìpé náà mọ́ èyí tí ó ṣáájú láì fi ìtumọ̀ ìdí tí kò ṣe kedere sínú rẹ̀.
theological_decisions:
- issue: Ìtọ́kasí Mósè gẹ́gẹ́ bí àpèjúwe fún àwọn ìwé tàbí òfin rẹ̀
  choice: Pa ‘Mósè’ àti arọ́pò-orúkọ ẹni mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Rọ́pò rẹ̀ pẹ̀lú ‘Òfin Mósè’ tàbí ‘àwọn ìwé Mósè.’
  rationale: Gíríìkì sọ ‘Mósè’ àti ‘rẹ̀/á’ ní tààrà, ó ń lo orúkọ ẹni náà fún àwọn ìwé tàbí òfin tí ó ní í ṣe pẹ̀lú rẹ̀. Pípa àpèjúwe yìí mọ́ ń tẹ̀ lé orísun, kò sì fi àlàyé ìtumọ̀ kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọjọ́ Ìsinmi’ fún Sábáàtì gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, láì ṣàlàyé ẹ̀kọ́ ìjọ kan sínú rẹ̀.
