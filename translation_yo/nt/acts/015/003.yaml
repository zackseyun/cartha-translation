reference: Acts 15:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí ìjọ ti rán wọn lọ, wọ́n la Fòníṣíà àti Samáríà kọjá, wọ́n ń ròyìn ní ẹ̀kúnrẹ́rẹ́ ìyípadà àwọn tí kì í ṣe Júù[a]; wọ́n sì mú ayọ̀ ńlá wá fún gbogbo àwọn arákùnrin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ìyípadà àwọn tí kì í ṣe Júù.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn arákùnrin” níbí túmọ̀ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn lápapọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: lẹ́yìn tí ìjọ ti rán wọn lọ pẹ̀lú ìrànlọ́wọ́ fún ìrìnàjò wọn
  rationale: Ó mú ìtumọ̀ pé ìjọ ran àwọn arìnrìn-àjò náà lọ ní ọ̀nà wọn, ó sì lè pèsè ìrànlọ́wọ́ fún ìrìnàjò, láì fi dandan sọ pé wọ́n bá wọn rìn.
- source_word: ἐκκλησίας
  choice: ìjọ
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́ Kristẹni; “ìjọ” ni ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání jù lọ ní àyíká yìí.
- source_word: διήρχοντο τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: wọ́n la Fòníṣíà àti Samáríà kọjá
  rationale: Ó fi ìrìnàjò tí ó ń bá a lọ gba àwọn agbègbè méjèèjì hàn ní Yorùbá àdánidá.
- source_word: ἐκδιηγούμενοι
  choice: wọ́n ń ròyìn ní ẹ̀kúnrẹ́rẹ́
  rationale: 'Ó pa agbára ọ̀rọ̀ ìṣe náà mọ́: kì í ṣe sísọ lásán, bí kò ṣe jíjẹ́rìí tàbí ríròyìn kíkún.'
- source_word: ἐπιστροφὴν τῶν ἐθνῶν
  choice: bí àwọn Kèfèrí ṣe yípadà sí Ọlọ́run
  rationale: “Yípadà” pa àwòrán ìpilẹ̀ ọ̀rọ̀ náà mọ́, “sí Ọlọ́run” sì jẹ́ ohun tí àyíká iṣẹ́ ìránṣẹ́ nínú Ìṣe ń tọ́ka sí, láì sọ ọ́ di ẹ̀kọ́ ìsìn onímọ̀ ní pàtó.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: èyí sì mú ayọ̀ ńlá wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ ìṣẹ̀lẹ̀ tí ó fa ayọ̀ púpọ̀.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: fún gbogbo àwọn arákùnrin
  rationale: Ó pa àwòrán akọ nínú ọ̀rọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé pé ó ṣeé ṣe kí ó kan gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin.
theological_decisions:
- issue: Ìtumọ̀ ἐπιστροφή nípa bí àwọn Kèfèrí ṣe wọ inú àwùjọ àwọn ènìyàn Ọlọ́run
  choice: yípadà sí Ọlọ́run
  alternative: ìyípadà ẹ̀sìn àwọn Kèfèrí
  rationale: “Yípadà sí Ọlọ́run” jẹ́ èdè àdánidá tí ó sì sún mọ́ àwòrán ọ̀rọ̀ orísun; kò fi ẹ̀kọ́ ìsìn tó wá lẹ́yìn lé ẹsẹ̀ náà lórí.
- issue: Ìtumọ̀ ἀδελφοί ní àwùjọ tí ó ṣeé ṣe kí ó ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: A pa fọ́ọ̀mù akọ ti orísun mọ́ nínú ẹsẹ̀, a sì fi àlàyé sí ìsàlẹ̀ pé ìtọ́kasí náà lè gbòòrò dé ọ̀dọ̀ gbogbo àwọn onígbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn orúkọ ibi ni a kọ sí Fòníṣíà àti Samáríà. Ẹsẹ̀ náà pa ìtẹ̀síwájú ìrìnàjò àti ìròyìn kíkún mọ́, ó sì yà àwọn àlàyé ìtumọ̀ míì sí àwọn àlàyé ìsàlẹ̀.
