  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: yo
  text: Ó sì ń la Síríà àti Kílíkíà kọjá, ó ń mú àwọn ìjọ lágbára.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: ń la ... kọjá
  rationale: Ìṣe aláìpé náà fi hàn pé ìrìn-àjò náà ń bá a lọ káàkiri àwọn agbègbè wọ̀nyí; ọ̀rọ̀ Yòrùbá yìí jẹ́ àdánidá, kò sì fi àkókò tí ó lò kún ohun tí orísun sọ.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” ni àsopọ̀ Yòrùbá tó bá a mu láìfi ìtẹnumọ́ tí kò sí nínú orísun kún un.
- source_word: Συρίαν
  choice: Síríà
  rationale: Àkọ̀túnsọ orúkọ agbègbè Syria ní ìlànà ìkọ̀wé Yòrùbá.
- source_word: Κιλικίαν
  choice: Kílíkíà
  rationale: Àkọ̀túnsọ orúkọ agbègbè Cilicia ní ìlànà ìkọ̀wé Yòrùbá.
- source_word: ἐπιστηρίζων
  choice: ń mú ... lágbára
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìdúróṣinṣin àti agbára kún wọn bí ó ti ń rin ìrìn-àjò; yíyan yìí gbooro ju ìtùnú ọkàn nìkan lọ, kò sì fi ohun tí orísun kò sọ kún un.
- source_word: ἐκκλησίας
  choice: àwọn ìjọ
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn àwùjọ onígbàgbọ́ Kristẹni ní ibi kọ̀ọ̀kan; “àwọn ìjọ” jẹ́ ọ̀rọ̀ Yòrùbá tí ó ṣe kedere tí ó sì wọ́pọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbà lítíréṣọ̀ tí ó bójú mu, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìṣe tí ń bá a lọ nínú διήρχετο àti ἐπιστηρίζων mọ́ nípasẹ̀ “ń ... ó ń ...”, a sì lo “ó” nítorí ẹni tí ẹsẹ̀ ṣáájú ti dárúkọ.
