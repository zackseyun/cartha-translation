  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: yo
  text: 'Wọ́n kọ̀wé, wọ́n sì fi í ránṣẹ́ lọ́wọ́ wọn[a] pé:


    “Àwọn àpọ́sítélì àti àwọn arákùnrin alàgbà[b], sí àwọn arákùnrin[c] láti inú àwọn Kèfèrí tí wọ́n wà ní Áńtíókù, Síríà àti Kílíkíà: Ẹ kú.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, Gíríìkì ní, “nípasẹ̀ ọwọ́ wọn.” Ní àyíká yìí, ó lè túmọ̀ sí pé wọ́n fi lẹ́tà náà lé àwọn aṣojú wọ̀nyí lọ́wọ́ láti gbé e lọ.
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé kà á sí, “àwọn àpọ́sítélì àti àwọn alàgbà, arákùnrin.” Ṣùgbọ́n ìṣètò Gíríìkì lè túmọ̀ sí “àwọn arákùnrin alàgbà” lọ́nà àdánidá jù.
    reason: alternative_reading
  - marker: c
    text: “Àwọn arákùnrin” níbí lè ní gbogbo àwọn onígbàgbọ́ nínú, àwọn ọkùnrin àti àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Wọ́n kọ̀wé
  rationale: Aorist participle náà ń ṣàgbékalẹ̀ kíkọ lẹ́tà náà. Èdè Yorùbá àdánidá kò nílò kí a fi fọ́ọ̀mù aláìlópìn Gíríìkì hàn ní kíkún; ọ̀rọ̀-ìṣe tó tẹ̀ lé e ṣì pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà mọ́.
- source_word: διὰ χειρὸς αὐτῶν
  choice: wọ́n sì fi ránṣẹ́ nípasẹ̀ wọn
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà àṣà láti sọ pé àwọn aṣojú tí a dárúkọ ni wọ́n gbé lẹ́tà náà lọ. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi àwòrán ‘ọwọ́ wọn’ inú Gíríìkì pamọ́.
- source_word: ἀπόστολοι
  choice: àwọn àpọ́sítélì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn aṣojú-aṣáájú tí a mọ̀ sí aposteli.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: àwọn arákùnrin alàgbà
  rationale: Àìsí àtíkù kejì ṣáájú ἀδελφοί mú kí ó ṣeé ṣe jù pé ‘arákùnrin’ ń ṣàlàyé ‘alàgbà,’ kì í ṣe ẹgbẹ́ kẹta. Àlàyé ìsàlẹ̀ mẹ́nu kan ìka ọ̀rọ̀ mìíràn tí ó wọ́pọ̀.
- source_word: ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: A pa ọ̀rọ̀ akọ púpọ̀ inú orísun mọ́; àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: láti inú àwọn Kèfèrí
  rationale: Ó pa èrò ἐξ mọ́, pé àwọn tí a ń kọ sí wá láti inú àwọn orílẹ̀-èdè tàbí àwọn ènìyàn tí kì í ṣe Júù.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: tí wọ́n wà ní Áńtíókù, Síríà àti Kílíkíà
  rationale: κατά pẹ̀lú accusative níbí ń tọ́ka sí ibi tí àwọn olùgbà lẹ́tà wà káàkiri; ‘tí wọ́n wà ní’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: χαίρειν
  choice: Ẹ kú
  rationale: Ní ìbẹ̀rẹ̀ lẹ́tà, χαίρειν jẹ́ ìkíni àṣà, kì í ṣe àṣẹ pé kí wọ́n yọ̀. ‘Ẹ kú’ jẹ́ ìkíni Yorùbá tó ṣókí tí kò fi ‘àlàáfíà’ tàbí èrò mìíràn tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nígbà tí ó ṣeé ṣe kí gbogbo ìjọ, títí kan àwọn obìnrin, wà nínú àwọn tí a ń bá sọ̀rọ̀
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: A pa ìrísí akọ púpọ̀ ti ọ̀rọ̀ Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a ṣàlàyé ìtumọ̀ àpapọ̀ tí ó ṣeé ṣe nínú àlàyé ìsàlẹ̀, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
- issue: Ìbáṣepọ̀ gírámà láàárín πρεσβύτεροι àti ἀδελφοί
  choice: àwọn arákùnrin alàgbà
  alternative: àwọn alàgbà, arákùnrin
  rationale: Ìtumọ̀ pàtàkì gba ἀδελφοί gẹ́gẹ́ bí ọ̀rọ̀ tó ń ṣàlàyé πρεσβύτεροι, èyí tí ìṣètò Gíríìkì ń tì lẹ́yìn. Nítorí ìka ọ̀rọ̀ kejì tún ṣeé ṣe, a fi sí àlàyé ìsàlẹ̀ dípò kí a yanjú àìdánilójú náà ní ìdákẹ́jẹ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìṣètò bí lẹ́tà ṣe bẹ̀rẹ̀ ni a pa mọ́, ṣùgbọ́n a tú διὰ χειρὸς αὐτῶν sí ọ̀nà Yorùbá àdánidá. Orúkọ ibi ni a kọ sí Áńtíókù, Síríà àti Kílíkíà. ‘Ẹ kú’ ń ṣiṣẹ́ gẹ́gẹ́ bí ìkíni lẹ́tà láìkó èrò ‘àlàáfíà’ tí kò sí nínú orísun wọlé.
