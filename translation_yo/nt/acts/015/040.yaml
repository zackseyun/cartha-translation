id: ACT.15.40
reference: Acts 15:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: yo
  text: Ṣùgbọ́n Paulu yan Sila, ó sì jáde lọ, lẹ́yìn tí àwọn arákùnrin[a] ti fi í lé oore-ọ̀fẹ́ Olúwa lọ́wọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: cultural_note
  - marker: b
    text: Tàbí, “lẹ́yìn tí àwọn arákùnrin ti fi í sí abẹ́ oore-ọ̀fẹ́ Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín ohun tí Paulu ṣe àti bí Banaba ṣe lọ ní ẹsẹ tó ṣáájú.
- source_word: ἐπιλεξάμενος
  choice: yan
  rationale: Ó sọ yíyan tí Paulu fúnra rẹ̀ ṣe ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: Σιλᾶν
  choice: Sila
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: ἐξῆλθεν
  choice: ó sì ṣíwájú ọ̀nà rẹ̀
  rationale: Nínú ìtàn ìrìn-àjò, ọ̀rọ̀ náà túmọ̀ sí pé ó gbéra lọ tàbí ó bẹ̀rẹ̀ ìrìn-àjò; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: παραδοθεὶς
  choice: lẹ́yìn tí ... ti fi í lé ... lọ́wọ́
  rationale: Ó pa àwòrán ìfìlé ẹni sínú àbójútó ẹlòmíràn mọ́, láì sọ ìtumọ̀ náà di ìyìn tàbí àdúrà nìkan.
- source_word: τῇ χάριτι
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ χάρις mọ́, dípò yíyí i padà sí ‘àbójútó onínúure.’
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Ó pa àkọlé κύριος àti àìsọ pàtó ẹni tí ó ń tọ́ka sí mọ́.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: àwọn arákùnrin
  rationale: Ó tẹ̀lé ọ̀rọ̀ akọ púpọ̀ inú Gíríìkì; àlàyé ìsàlẹ̀ ojú ìwé sọ pé ó lè kan gbogbo àwùjọ àwọn onígbàgbọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jesu; Ọlọ́run
  rationale: Gíríìkì kò sọ ẹni náà ní pàtó; ìtumọ̀ náà kò yẹ kí ó yanju àìdánilójú tí orísun fi sílẹ̀.
- issue: Ààlà ìtumọ̀ ‘àwọn arákùnrin’
  choice: Àwọn arákùnrin nínú àyọkà, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé
  alternative: Àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Ìtumọ̀ pàtàkì pa ìrísí akọ púpọ̀ mọ́, ṣùgbọ́n àlàyé jẹ́ kó ye ni pé ọ̀rọ̀ náà lè dúró fún gbogbo àwùjọ onígbàgbọ́.
- issue: Ìtumọ̀ παραδοθεὶς nínú ọ̀rọ̀ nípa oore-ọ̀fẹ́
  choice: fi í lé oore-ọ̀fẹ́ Olúwa lọ́wọ́
  alternative: gbàdúrà fún un, kí oore-ọ̀fẹ́ Olúwa máa bá a lọ; fi í sí abẹ́ oore-ọ̀fẹ́ Olúwa
  rationale: Yíyan yìí pa ìtumọ̀ ìfìlé tàbí ìfiṣègbọ́kànlé mọ́, ó sì yẹra fún fífi àṣà ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ṣíwájú ọ̀nà rẹ̀’ mú èrò ìgbéra fún ìrìn-àjò jáde; ‘fi í lé ... lọ́wọ́’ sì pa àwòrán ìfìlé ẹni sínú àbójútó mọ́.
