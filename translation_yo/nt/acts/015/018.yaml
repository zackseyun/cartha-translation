translation:
  language: yo
  text: tí a mọ̀ láti ìgbà àtijọ́ wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ìtẹ̀sí tó kúnrẹ́rẹ́ sí i pé, “tí a mọ̀ láti ayérayé,” tàbí, “ẹni tí ó ń jẹ́ kí a mọ̀ àwọn nǹkan wọ̀nyí láti ìgbà àtijọ́ wá.”
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: tí a ti mọ̀
  rationale: Ọ̀rọ̀ ajẹtífù yìí ń ṣiṣẹ́ gẹ́gẹ́ bí àpólà àsọyé nínú gbólóhùn tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì. ‘Tí a ti mọ̀’ sọ ìtumọ̀ ‘known’ ní Yorùbá àdánidá láìfi èrò ‘sọ di mímọ̀’ kún un.
- source_word: ἀπ’
  choice: láti … wá
  rationale: Ó ń tọ́ka sí ìbẹ̀rẹ̀ àkókò; ìṣọ̀kan ‘láti … wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára àkókò náà mọ́.
- source_word: αἰῶνος
  choice: ìgbà àtijọ́
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ àkókò yìí, ó lè túmọ̀ sí àkókò pípẹ́ ní ayé àtijọ́. ‘Ìgbà àtijọ́’ yẹra fún fífi ìtumọ̀ ‘láéláé’ tí ó lágbára ju ẹ̀rí ọ̀rọ̀ SBLGNT lọ sínú ẹsẹ̀ náà.
theological_decisions:
- issue: Ìwọ̀n àkókò tí gbólóhùn kúkúrú yìí ń tọ́ka sí nípa ohun tí a mọ̀
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ohun tí a ti mọ̀ láti ìgbà àtijọ́ wá, láìfẹ̀ sí i di ẹ̀kọ́ tó túbọ̀ lágbára nípa ìmọ̀ Ọlọ́run láti ayérayé.
  alternative: ‘tí a mọ̀ láti ayérayé’ tàbí ‘ẹni tí ó ń sọ àwọn nǹkan wọ̀nyí di mímọ̀ láti ìgbà àtijọ́ wá’
  rationale: 'Ọ̀rọ̀ SBLGNT kúrú gan-an: γνωστὰ ἀπ’ αἰῶνος. Ìtumọ̀ náà pa kíkúrú àti àìdájú rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi àwọn ẹ̀dà ọ̀rọ̀ tó gùn sí i hàn.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà kúkúrú, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. Fífi ‘a’ aláìní ẹni pàtó ṣe olùṣe ń pa irú àìsọ ẹni tó mọ̀ ọ́n ní Gíríìkì mọ́.
