id: ACT.15.38
reference: Acts 15:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù tẹnumọ́ pé kí wọn má ṣe mú ẹni yìí[a] lọ pẹ̀lú wọn, ẹni tí ó yà kúrò lọ́dọ̀ wọn ní Pamfílíà, tí kò sì bá wọn lọ síbi iṣẹ́ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó kọ̀ wọ́n sílẹ̀ ní Pamfílíà.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ líle yìí, ṣùgbọ́n ẹsẹ̀ pàtàkì lo ọ̀rọ̀ tí kò fi ìdájọ́ púpọ̀ kún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: tẹnumọ́
  rationale: Ọ̀rọ̀ yìí fi ìdájọ́ tí ó lágbára tàbí ìforítì Pọ́ọ̀lù hàn nínú àríyànjiyàn náà; ‘tẹnumọ́’ lágbára ju fífi ìfẹ́ lásán hàn lọ.
- source_word: ἀποστάντα
  choice: ẹni tí ó yà kúrò lọ́dọ̀ wọn
  rationale: Àṣàyàn yìí sọ pé ó kúrò lọ́dọ̀ wọn láìfi ìtumọ̀ líle bí ‘kọ̀ wọ́n sílẹ̀’ sínú ẹsẹ̀ pàtàkì.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: kúrò lọ́dọ̀ wọn ní Pamfílíà
  rationale: Ó pa ìyapa rẹ̀ kúrò lọ́dọ̀ wọn mọ́, ó sì sọ Pamfílíà gẹ́gẹ́ bí ibi tí ìyapa náà ti ṣẹlẹ̀; èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àyíká ìtàn mu.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: tí kò sì bá wọn lọ
  rationale: Ó mú èrò lílọ papọ̀ tàbí títẹ̀lé wọn nínú ìrìnàjò iṣẹ́ náà jáde ní èdè Yorùbá àdánidá.
- source_word: εἰς τὸ ἔργον
  choice: síbi iṣẹ́ náà
  rationale: Ó pa ‘iṣẹ́ náà’ mọ́ dípò lílo ọ̀rọ̀ ìtumọ̀ síi bí ‘iṣẹ́ ìránṣẹ́,’ ó sì jẹ́ kí ọ̀rọ̀ náà ṣe kedere ní Yorùbá.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: kí wọn má ṣe mú ẹni yìí lọ pẹ̀lú wọn
  rationale: Ìtumọ̀ yìí fi ìfòfindè tí Pọ́ọ̀lù tẹnumọ́ hàn, ó sì pa agbára ọ̀rọ̀ atọ́ka τοῦτον mọ́ nípasẹ̀ ‘ẹni yìí.’
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó rọrùn fún gbogbo ènìyàn láti lóye, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Tẹnumọ́’ pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́, nígbà tí ‘yà kúrò lọ́dọ̀ wọn’ kò fi ìtumọ̀ ẹ̀sùn líle kan ohun tí Gíríìkì fi sílẹ̀ ní àyè.
