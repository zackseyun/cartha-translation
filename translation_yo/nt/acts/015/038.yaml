  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa. “Pọ́ọ̀lù tẹnumọ́” mú agbára ἠξίου jáde; “kí wọn má ṣe mú ẹni yìí lọ pẹ̀lú wọn” ṣàfihàn ìfẹ́ Pọ́ọ̀lù pé kí wọn má ṣe συμπαραλαμβάνειν ẹni náà. “Ó yà kúrò lọ́dọ̀ wọn ní Pamfílíà” jẹ́ ìtumọ̀ àìṣèdájọ́ fún ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας, ó sì ń tọ́ka sí Pamfílíà gẹ́gẹ́ bí ibi ìyapa náà. Gbólóhùn “tí kò sì bá wọn lọ síbi iṣẹ́ náà” pa μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον mọ́.
  naturalness: Yorùbá náà rọrùn, ó sì yẹ fún ìwé mímọ́ ìgbàlódé. Ìlò “yà kúrò lọ́dọ̀ wọn,” “bá wọn lọ,” àti “síbi iṣẹ́ náà” jẹ́ èdè àdánidá. Àmì ohùn àti òǹkọ̀wé àwọn orúkọ náà wà ní ipò tó yẹ.
  terminology: “Tẹnumọ́” yẹ fún ìforítì Pọ́ọ̀lù láìkọjá ohun tí ọ̀rọ̀ náà sọ. “Ẹni yìí” pa ìtẹnumọ́ demonstrative τοῦτον mọ́. Àlàyé-ẹsẹ̀ náà pèsè “kọ̀ wọ́n sílẹ̀” gẹ́gẹ́ bí àṣàyàn tó lágbára ju, nígbà tí ẹsẹ̀ pàtàkì kò fi ìdájọ́ àfikún kún un.
