id: ACT.15.4
reference: Acts 15:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: yo
  text: Nígbà tí wọ́n dé Jerúsálẹ́mù, ìjọ àti àwọn àpọ́sítélì àti àwọn alàgbà tẹ́wọ́ gbà wọ́n; wọ́n sì ròyìn gbogbo ohun tí Ọlọ́run ti ṣe pẹ̀lú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí Ọlọ́run ti ṣe nípasẹ̀ wọn,” tàbí “tí Ọlọ́run ti ṣe láàárín wọn.” Ọ̀rọ̀ Gíríìkì náà ní “pẹ̀lú wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Nígbà tí wọ́n dé Jerúsálẹ́mù
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe aorist náà fi ipò àkókò tí ó ṣáájú àwọn ìṣe pàtàkì hàn. “Nígbà tí wọ́n dé” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò náà mọ́; ipa ìsopọ̀ pẹ̀lẹ́ ti δέ wà nínú ìṣètò gbólóhùn náà.
- source_word: παρεδέχθησαν
  choice: tẹ́wọ́ gbà wọ́n
  rationale: Ó sọ nípa gbígba àwọn ènìyàn wọlé pẹ̀lú inú rere. “Tẹ́wọ́ gbà wọ́n” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé wọ́n fi ayọ̀ àti ìtẹ́wọ́gbà gbà wọ́n.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: ìjọ àti àwọn àpọ́sítélì àti àwọn alàgbà
  rationale: Nínú gbólóhùn aláìṣe yìí, ἀπό tọ́ka sí àwọn tí ó ṣe ìtẹ́wọ́gbà náà. “Ìjọ” dúró fún àwùjọ àwọn onígbàgbọ́, “àwọn àpọ́sítélì” sì pa orúkọ iṣẹ́ náà mọ́, nígbà tí “àwọn alàgbà” fi ipò àwọn aṣáájú tí a mọ̀ sílẹ̀ hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: ἀνήγγειλάν τε
  choice: wọ́n sì ròyìn
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí jíjíṣẹ́ tàbí sísọ àlàyé ohun tí ó ṣẹlẹ̀. “Ròyìn” bá àyíká ìròyìn tí wọ́n ń mú wá fún ìjọ àti àwọn aṣáájú mu, “sì” sì so ó mọ́ gbólóhùn tó ṣáájú.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: gbogbo ohun tí Ọlọ́run ti ṣe
  rationale: “Gbogbo ohun tí” mú agbára ὅσα jáde, ìṣètò “ti ṣe” sì fi hàn pé àwọn iṣẹ́ Ọlọ́run yẹn ti ṣẹlẹ̀ kí wọ́n tó ròyìn wọn.
- source_word: μετ’ αὐτῶν
  choice: pẹ̀lú wọn
  rationale: μετά pẹ̀lú genitive sábà máa ń túmọ̀ sí “pẹ̀lú.” Yíyan èyí pa ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́, láìfi dandan sọ pé “nípasẹ̀ wọn” tàbí “láàárín wọn.”
theological_decisions:
- issue: Ipa àwọn ènìyàn nínú iṣẹ́ Ọlọ́run tí μετ’ αὐτῶν ń ṣàpèjúwe
  choice: Ohun tí Ọlọ́run ti ṣe pẹ̀lú wọn
  alternative: Ohun tí Ọlọ́run ti ṣe nípasẹ̀ wọn; tàbí ohun tí Ọlọ́run ti ṣe láàárín wọn
  rationale: Gbólóhùn Gíríìkì náà ní ìtumọ̀ tó ṣí sí ọ̀nà púpọ̀ díẹ̀. “Pẹ̀lú wọn” fi Ọlọ́run hàn gẹ́gẹ́ bí olùṣe àkọ́kọ́, ó sì so Pọ́ọ̀lù àti Bánábà mọ́ iṣẹ́ rẹ̀ láìpinnu bóyá èrò pàtàkì ni jíjẹ́ irinṣẹ́ tàbí ibi tí iṣẹ́ náà ti ṣẹlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Tẹ́wọ́ gbà” àti “ròyìn” jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé lásán lè lóye; àsọtẹ́lẹ̀ náà kò fi èrò ẹ̀sìn ẹgbẹ́ kankan kún orísun.
