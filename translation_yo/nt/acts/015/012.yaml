language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: yo
  text: Gbogbo àpéjọ náà sì dákẹ́, wọ́n sì ń tẹ́tí sí Bánábà àti Pọ́ọ̀lù bí wọ́n ti ń ròyìn àwọn àmì àti àwọn iṣẹ́ ìyanu tí Ọlọ́run ti ṣe láàárín àwọn tí kì í ṣe Júù[a] nípasẹ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn orílẹ̀-èdè.” Ní àyíká ìpàdé Jerúsálẹ́mù yìí, ἔθνεσιν tọ́ka pàtó sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: dákẹ́
  rationale: Ọ̀rọ̀-ìṣe náà fi hàn pé ìjọ náà yí padà sí ipò ìdákẹ́jẹ́ ní àkókò yẹn; “dákẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyípadà náà.
- source_word: πᾶν τὸ πλῆθος
  choice: gbogbo ìjọ náà
  rationale: Nínú àyíká ìpàdé Jerúsálẹ́mù, ó tọ́ka sí gbogbo ẹgbẹ́ àwọn tí ó péjọ, kì í ṣe ogunlọ́gọ̀ lásán.
- source_word: ἤκουον
  choice: wọ́n sì ń tẹ́tí sí
  rationale: Àkókò imperfect ní Gíríìkì fi ìgbọ́ran tí ó ń bá a lọ hàn; “ń tẹ́tí sí” tún fi àfiyèsí wọn hàn.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Bánábà àti Pọ́ọ̀lù
  rationale: Àwọn orúkọ náà ni a kọ ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἐξηγουμένων
  choice: bí wọ́n ti ń ròyìn
  rationale: Ó túmọ̀ sí fífi ìtàn tàbí àlàyé ohun tí ó ṣẹlẹ̀ ṣe ní kíkún; “ń ròyìn” kò fi ìtumọ̀ àlàyé ẹ̀kọ́ kún un.
- source_word: ὅσα
  choice: àwọn ... tí
  rationale: Ìṣètò yìí so ohun tí wọ́n ròyìn mọ́ àwọn iṣẹ́ àmì àti iṣẹ́ ìyanu ní Yorùbá àdánidá, láì fi ìṣe mìíràn tí a kò mẹ́nu kàn sí i.
- source_word: ἐποίησεν ὁ θεὸς
  choice: tí Ọlọ́run ti ṣe
  rationale: Ó pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tí ó ṣe àwọn iṣẹ́ náà; “ti ṣe” bá ìròyìn nípa iṣẹ́ tí ó ti ṣẹlẹ̀ ṣáájú mu.
- source_word: σημεῖα καὶ τέρατα
  choice: àwọn iṣẹ́ àmì àti iṣẹ́ ìyanu
  rationale: “Iṣẹ́ àmì” àti “iṣẹ́ ìyanu” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún àkójọpọ̀ ọ̀rọ̀ Lúùkù yìí, láì fi àlàyé àfikún sí i.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn Kèfèrí
  rationale: Nínú Ìṣe 15, ọ̀rọ̀ náà tọ́ka pàtó sí àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro “àwọn orílẹ̀-èdè” mọ́.
- source_word: δι’ αὐτῶν
  choice: nípasẹ̀ wọn
  rationale: Ó fi hàn pé Ọlọ́run ni olùṣe pàtàkì, Bánábà àti Pọ́ọ̀lù sì ni irinṣẹ́ tí ó fi ṣiṣẹ́.
theological_decisions:
- issue: Ipa Ọlọ́run nínú iṣẹ́ ìránṣẹ́ àwọn aposteli
  choice: Ọlọ́run ni ẹni tí ó ṣe àwọn iṣẹ́ àmì àti iṣẹ́ ìyanu nípasẹ̀ Bánábà àti Pọ́ọ̀lù.
  alternative: Kí a sọ pé Bánábà àti Pọ́ọ̀lù fúnra wọn ni olùṣe pàtàkì.
  rationale: Nínú gírámà Gíríìkì, ὁ θεὸς ni olùṣe ἐποίησεν, δι’ αὐτῶν sì fi àwọn ọkùnrin náà hàn gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run gbà ṣiṣẹ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. Àwọn àmì ohùn ni a fi síbi tí ó bá yẹ; a sì pa ìṣàn ìtàn àti ìtẹnumọ́ lórí ipa Ọlọ́run mọ́.
