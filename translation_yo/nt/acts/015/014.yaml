  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: yo
  text: Síméónì[a] ti ròyìn bí Ọlọ́run ṣe kọ́kọ́ bẹ̀ àwọn aláì-Júù[b] wò, láti mú èèyàn kan láti inú wọn fún orúkọ rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Símónì.” Jákọ́bù lo irú orúkọ náà “Síméónì” níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti inú àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, èèyàn tí ó jẹ́ tirẹ̀, tí ó sì ń rú orúkọ rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Síméónì
  rationale: A ṣe àfọwọkọ irú orúkọ Gíríìkì tí Jákọ́bù lò níbí, dípò kí a mú un bá irú orúkọ Símónì tí ó wọ́pọ̀ mu.
- source_word: ἐξηγήσατο
  choice: ti sọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísọ ìṣẹ̀lẹ̀ kan ní ẹ̀kúnrẹ́rẹ́ tàbí jíjẹ́rìí ohun tí ó ṣẹlẹ̀; ‘ti sọ’ jẹ́ èdè Yorùbá àdánidá fún àkótán ọ̀rọ̀ tí ó ṣẹ̀ṣẹ̀ sọ.
- source_word: καθὼς
  choice: bí ... ṣe
  rationale: Àkójọpọ̀ ‘bí ... ṣe’ fi ọ̀nà àti àkóónú ohun tí Síméónì sọ hàn lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó tọ́ka sí ìbẹ̀rẹ̀ ìgbésẹ̀ Ọlọ́run sí àwọn aláì-Júù.
- source_word: ἐπεσκέψατο
  choice: bẹ ... wò
  rationale: ‘Bẹ ... wò’ pa àwòrán ìbẹ̀wò mọ́, ó sì lè ní ìtumọ̀ yíyíjú sí wọn pẹ̀lú àníyàn àti ète rere, bí ọ̀rọ̀ Gíríìkì náà ti rí.
- source_word: λαβεῖν
  choice: láti mú
  rationale: 'Ó pa ìtumọ̀ ète inú ọ̀rọ̀ náà mọ́: Ọlọ́run bẹ̀ wọ́n wò láti mú àwọn ènìyàn kan láti inú wọn; a kò fi èrò ‘yàn’ tàbí ‘kó jọ’ kún un.'
- source_word: ἐξ ἐθνῶν
  choice: àwọn Kèfèrí ... láti inú wọn
  rationale: Nínú àyíká Ìṣe 15, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù. ‘Láti inú wọn’ mú agbára ἐξ (‘láti inú/láàárín’) hàn.
- source_word: λαὸν
  choice: àwọn ènìyàn kan
  rationale: Ọ̀rọ̀ yìí sọ nípa àwọn ènìyàn tí a dá mọ̀ gẹ́gẹ́ bí ti Ọlọ́run, kì í ṣe ẹ̀yà kan pàtó; gbolohun Yorùbá náà jẹ́ àdánidá, ó sì pa ìtumọ̀ ẹgbẹ́ ènìyàn mọ́.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: fún orúkọ rẹ̀
  rationale: A pa àpólà Bíbélì náà mọ́ láì sọ ọ́ di ‘fún ara rẹ̀’ nìkan; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé ìtumọ̀ jíjẹ́ ti Ọlọ́run àti dídá mọ̀ mọ́ orúkọ rẹ̀.
theological_decisions:
- issue: 'Bí a ó ṣe túmọ̀ ἐξ ἐθνῶν: ‘Kèfèrí’ tàbí ‘orílẹ̀-èdè’'
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àríyànjiyàn inú Ìṣe 15 dá lórí gbígba àwọn tí kì í ṣe Júù sínú àwọn ènìyàn Ọlọ́run. ‘Àwọn Kèfèrí’ mú ìyàtọ̀ Júù àti aláì-Júù náà hàn kedere, nígbà tí àkọsílẹ̀ [b] pa ìtumọ̀ ‘orílẹ̀-èdè’ mọ́.
- issue: 'Bí a ó ṣe túmọ̀ τῷ ὀνόματι αὐτοῦ: ‘fún orúkọ rẹ̀’ tàbí ‘fún ara rẹ̀’'
  choice: fún orúkọ rẹ̀
  alternative: fún ara rẹ̀
  rationale: Gbolohun yìí ní ìwọ̀n èdè májẹ̀mú tí ó ṣe pàtàkì. Pípamọ́ ‘fún orúkọ rẹ̀’ kò sọ ìtumọ̀ rẹ̀ di èyí tí ó rọrùn ju ti orísun lọ, bẹ́ẹ̀ ni kò mú àìdánilójú tó wà nínú àpólà náà kúrò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Bẹ ... wò’ pa àwòrán ìbẹ̀wò oníète mọ́; ‘fún orúkọ rẹ̀’ sì pa èdè ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́, pẹ̀lú àlàyé kúkúrú nínú àkọsílẹ̀.
