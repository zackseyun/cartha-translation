  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù àti Bánábà dúró ní Áńtíókù[a], wọ́n ń kọ́ni, wọ́n sì ń kéde ọ̀rọ̀ Olúwa gẹ́gẹ́ bí ìhìn rere[b][c], pẹ̀lú ọ̀pọ̀ ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n lo àkókò díẹ̀ ní Áńtíókù.” Ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ pé wọ́n wà níbẹ̀ fún àkókò kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń wàásù ìhìn rere.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pípolongo tàbí kíkéde ìròyìn rere.
    reason: lexical_alternative
  - marker: c
    text: “Ọ̀rọ̀ Olúwa” jẹ́ gbólóhùn tí ìwé Ìṣe sábà máa ń lò fún ìhìn-iṣẹ́ Olúwa; “ìhìn-iṣẹ́ Olúwa” tún jẹ́ àṣàyàn ìtumọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: dúró
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà tọ́ka sí pé wọ́n ń bá a lọ láti wà ní Áńtíókù fún àkókò kan. “Dúró” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí, nígbà tí àlàyé ẹsẹ̀ ń fi “lo àkókò díẹ̀” hàn gẹ́gẹ́ bí òmíràn.
- source_word: διδάσκοντες
  choice: wọ́n ń kọ́ni
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún fífi ẹ̀kọ́ kọ àwọn ènìyàn.
- source_word: εὐαγγελιζόμενοι
  choice: ń kéde ... gẹ́gẹ́ bí ìhìn rere
  rationale: Ìtumọ̀ náà pa èrò kíkéde ìròyìn rere mọ́, ó sì jẹ́ kí τὸν λόγον τοῦ κυρίου dúró gẹ́gẹ́ bí ohun tí wọ́n ń kéde.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: pẹ̀lú ọ̀pọ̀ àwọn ẹlòmíràn
  rationale: Èyí fi hàn pé kì í ṣe Pọ́ọ̀lù àti Bánábà nìkan ló ń ṣe iṣẹ́ náà; ọ̀pọ̀ àwọn mìíràn tún wà pẹ̀lú wọn.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” pa àjọṣe pẹ̀lú gbólóhùn Lúùkù “ọ̀rọ̀ Olúwa” mọ́; “iṣẹ́” jẹ́ àṣàyàn Yorùbá tó lè túmọ̀ sí message.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ àkọlé κύριος, láì fi ẹni tí àkọlé náà ń tọ́ka sí hàn ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú “ọ̀rọ̀ Olúwa”
  choice: A túmọ̀ rẹ̀ láì ṣàlàyé síwájú gẹ́gẹ́ bí “Olúwa.”
  alternative: “ọ̀rọ̀ Jésù Olúwa” tàbí iṣẹ́ tí ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Nínú Ìṣe, “Olúwa” lè tọ́ka pàápàá sí Jésù, ṣùgbọ́n Gíríìkì kò sọ orúkọ náà níbí. Ìtumọ̀ náà pa àìdánilójú tó wà nínú orísun mọ́.
- issue: Ìbáṣepọ̀ εὐαγγελιζόμενοι àti τὸν λόγον τοῦ κυρίου
  choice: “ń kéde ọ̀rọ̀ Olúwa gẹ́gẹ́ bí ìhìn rere”
  alternative: “ń kéde ìhìn rere ti ọ̀rọ̀ Olúwa”
  rationale: Àṣàyàn yìí jẹ́ kí “ọ̀rọ̀ Olúwa” jẹ́ ohun tí wọ́n ń kéde ní ọ̀nà ìhìn rere, dípò lílo gbólóhùn Yorùbá tí ó lè dábàá pé ìhìn rere náà wulẹ̀ jẹ́ nípa ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lápapọ̀. A lo “kọ́ni” dípò gbólóhùn ẹ̀sìn tó le, àti “kéde ... gẹ́gẹ́ bí ìhìn rere” láti pa ìtumọ̀ àti ìṣètò Gíríìkì mọ́ ní Yorùbá àdánidá.
