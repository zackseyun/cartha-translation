  verdict: revise
  source_fidelity: Ìtumọ̀ ‘Ó sì kọ lẹ́tà kan’ mú γράψας ἐπιστολήν dáadáa, ó sì bá ìtàn tó ṣáájú mu. Ṣùgbọ́n ‘tí ó ní ìrísí yìí’ lè tọ́ka sí ìrísí ojú tàbí àwò òde lẹ́tà, níbi tí τύπον τοῦτον ti ń tọ́ka sí ọ̀nà/àkóónú ọ̀rọ̀ lẹ́tà tí ó tẹ̀ lé. ‘Tí ọ̀rọ̀ rẹ̀ rí báyìí’ ń tọ́ka síwájú sí ìwé lẹ́tà náà ní kedere.
  naturalness: ‘Ó sì kọ lẹ́tà kan tí ọ̀rọ̀ rẹ̀ rí báyìí:’ jẹ́ Yorùbá boṣewa, ó rọrùn, ó sì yẹ fún ìforúkọsílẹ̀ ìtàn. Àmì ìdásílẹ̀ (:) ń fi hàn pé ọ̀rọ̀ lẹ́tà náà máa tẹ̀ lé.
  terminology: ‘Lẹ́tà’ jẹ́ yíyàn òde òní tó péye fún ἐπιστολήν. A rọ́pò ‘ìrísí,’ tí ó sábà ń túmọ̀ sí ìwòye/àpẹrẹ òde, pẹ̀lú gbolohun tí ó mú τύπος nínú àyíká yìí—ìṣètò tàbí ọ̀rọ̀ lẹ́tà—dáadáa.
  issues:
  - severity: medium
    issue: ‘Ìrísí’ lè yí ìtumọ̀ τύπον sí ìrísí ojú.
    rationale: Nínú gbólóhùn yìí, τύπος ń ṣàfihàn ọ̀nà tàbí ọ̀rọ̀ tí lẹ́tà náà gbà tẹ̀ lé, kì í ṣe ìrísí ohun tí a lè rí níta. Gbolohun ‘tí ọ̀rọ̀ rẹ̀ rí báyìí’ ṣètọ́jú ìtọ́kasí síwájú náà.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ tẹ́lẹ̀ ní ‘Ó sì kọ lẹ́tà kan báyìí,’ èyí tí kò fi hàn ní kedere pé ọ̀rọ̀ lẹ́tà náà ni yóò tẹ̀ lé.
    rationale: A tún un ṣe kí ó jẹ́ àṣàyàn ìtúmọ̀ tí ó ṣì mú ìtọ́kasí sí àkóónú lẹ́tà náà mọ́.
