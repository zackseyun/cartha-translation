translation:
  language: yo
  text: Ó sì kọ lẹ́tà kan tí ọ̀rọ̀ rẹ̀ rí báyìí:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì: “Ó sì kọ lẹ́tà kan tí ó ní ìṣètò yìí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: Ó sì kọ
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist náà ń tọ́ka sí ẹni tí ẹsẹ tó ṣáájú dá lé lórí. Ṣíṣe é ní ọ̀rọ̀ ìṣe pípé jẹ́ èdè Yorùbá àdánidá, ‘sì’ sì so ìṣe náà mọ́ ìtàn tó ṣáájú láìfi ìtumọ̀ míì kún un.
- source_word: ἐπιστολὴν
  choice: lẹ́tà kan
  rationale: Ó túmọ̀ sí ìwé ìbánisọ̀rọ̀ tí a kọ; ‘lẹ́tà’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tí kò sì ní ìró èdè ẹ̀sìn àkànṣe.
- source_word: ἔχουσαν
  choice: tí ó ní
  rationale: Ó jẹ́ ọ̀rọ̀ alábápín tó ń ṣàpèjúwe lẹ́tà náà. ‘Tí ó ní’ pa ìbáṣepọ̀ yẹn mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘having’ ní Yorùbá.
- source_word: τύπον
  choice: ìrísí
  rationale: Nínú àyíká yìí, τύπος lè tọ́ka sí àpẹẹrẹ, ìṣètò, tàbí ọ̀nà tí a gbà gbé ọ̀rọ̀ lẹ́tà náà kalẹ̀. ‘Ìrísí’ pa ìtumọ̀ gbòòrò náà mọ́ láìdín in kù sí àwọn ọ̀rọ̀ inú lẹ́tà nìkan.
- source_word: τοῦτον
  choice: yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka síwájú sí lẹ́tà tí yóò tẹ̀ lé; ‘yìí’ jẹ́ ìtumọ̀ taara tó yẹ.
