  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A pa ìgbékalẹ̀ tó sún mọ́ Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì fi àṣàyàn tó jẹ́ àdánidá síi hàn nínú àlàyé ìsàlẹ̀.
