  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: yo
  text: kí wọ́n sì pèsè àwọn ẹranko tí a máa ń gùn[a], kí wọ́n lè gbé Páùlù gùn àwọn ẹranko náà, kí wọ́n sì mú un dé ọ̀dọ̀ Fẹ́líksì, gómìnà náà, ní àlàáfíà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹranko” tàbí “àwọn ẹranko tí ń rú ẹrù”; ọ̀rọ̀ Gíríìkì náà kò sọ irú ẹranko tí wọ́n jẹ́.
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè túmọ̀ apá yìí sí: “lẹ́yìn tí wọ́n bá gbé Páùlù gùn àwọn ẹranko náà, kí wọ́n mú un dé ọ̀dọ̀ Fẹ́líksì, gómìnà náà, ní àlàáfíà.”'
    reason: previous_rendering
lexical_decisions:
- source_word: κτήνη
  choice: àwọn ẹranko tí a lè gùn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ẹranko tí a ń lò fún rírìn tàbí rírú ẹrù, kò sì sọ irú ẹranko pàtó. Gbólóhùn yìí sọ iṣẹ́ wọn ní èdè Yorùbá àdánidá láì sọ pé ẹṣin ni wọ́n.
- source_word: τε
  choice: sì
  rationale: Níhìn-ín, τε so àṣẹ yìí mọ́ àwọn àṣẹ tó ṣáájú; “sì” ni àsopọ̀ Yorùbá tó bá ọ̀rọ̀ náà mu.
- source_word: παραστῆσαι
  choice: pèsè
  rationale: Nínú àyíká àṣẹ yìí, ọ̀rọ̀ náà túmọ̀ sí kí wọ́n mú àwọn ẹranko náà wà ní ìmúrasílẹ̀; “pèsè” sọ èrò yẹn ní kedere.
- source_word: ἵνα
  choice: kí wọ́n lè
  rationale: ἵνα ń fi ète àṣẹ náà hàn; “kí wọ́n lè” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète náà.
- source_word: ἐπιβιβάσαντες
  choice: gbé Páùlù gùn wọ́n
  rationale: Participle náà túmọ̀ sí mímú kí ẹnì kan gun ẹranko tàbí wọ ohun ìrìn-àjò. Ìtumọ̀ yìí jẹ́ kedere, ó sì pa bí àwọn ìṣe náà ṣe tẹ̀ lé ara wọn mọ́.
- source_word: διασώσωσι
  choice: mú un dé ... láìsí ewu
  rationale: διασῴζω tẹnumọ́ pé ẹni náà dé ibi tí a ń mú un lọ ní àlàáfíà lẹ́yìn ewu; gbólóhùn yìí mú ìrìn àti ààbò pọ̀.
- source_word: πρὸς
  choice: dé ọ̀dọ̀
  rationale: Pẹ̀lú ẹni gẹ́gẹ́ bí ibi tí ìrìn ń lọ, πρός ń tọ́ka sí lílọ dé iwájú tàbí ọ̀dọ̀ ẹni náà.
- source_word: ἡγεμόνα
  choice: gómìnà
  rationale: ἡγεμών jẹ́ olórí ìṣàkóso ìpínlẹ̀ Róòmù; “gómìnà” ni ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere jù fún ipò náà.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá tó wọ́pọ̀, tó ní iyì, tí ó sì ṣe kedere. A yan “àwọn ẹranko tí a lè gùn” dípò “ẹṣin” kí a má bàa fi irú ẹranko kan kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ. Àwọn àmì ohùn wà lórí àwọn ọ̀rọ̀ Yorùbá àti orúkọ tí a ṣe sí ìró Yorùbá.
