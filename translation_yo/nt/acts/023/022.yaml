source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: yo
  text: Nítorí náà, olórí ọmọ ogun náà rán ọ̀dọ́mọkùnrin náà lọ, ó sì pàṣẹ fún un pé, “Má sọ fún ẹnikẹ́ni pé o ti fi àwọn nǹkan wọ̀nyí hàn mí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé o ti sọ àwọn nǹkan wọ̀nyí di mímọ̀ fún mi,” tàbí “pé o ti sọ àwọn nǹkan wọ̀nyí fún mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: olórí ọmọ ogun
  rationale: Ó tọ́ka sí ọ̀gá ológun Róòmù kan. ‘Olórí ọmọ ogun’ ṣe kedere ní Yorùbá òde òní láì lo oyè Róòmù tí ọ̀pọ̀ ènìyàn kò mọ̀.
- source_word: ἀπέλυσε
  choice: ní kí ... máa lọ
  rationale: Ní àyíká yìí, ọ̀gá náà parí ìfọ̀rọ̀wánilẹ́nuwò, ó sì rán ọ̀dọ́mọkùnrin náà lọ; ọ̀rọ̀ yìí kò mú kí ó dà bí ẹni pé ó wà ní àhámọ́.
- source_word: νεανίσκον
  choice: ọ̀dọ́mọkùnrin
  rationale: Ó túmọ̀ sí akọ tí ọjọ́ orí rẹ̀ kéré; ‘ọ̀dọ́mọkùnrin’ jẹ́ ọ̀rọ̀ àdánidá, tí ó sì ní iyì.
- source_word: παραγγείλας
  choice: ó sì pàṣẹ fún un
  rationale: Ẹ̀yà ọ̀rọ̀ náà fi ìtọ́ni aláṣẹ hàn; ‘pàṣẹ’ bá ipò ọ̀gá ológun àti ìfòfindè tó tẹ̀ lé e mu.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Má sọ fún ẹnikẹ́ni
  rationale: Èyí sọ ìfòfindè láti tú ọ̀rọ̀ náà síta ní Yorùbá tí ó ṣe kedere, tí ó sì rọrùn.
- source_word: ἐνεφάνισας
  choice: o ti fi ... tó mi létí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan wá sí ìmọ̀ ẹni, pàápàá jù lọ fífi ìròyìn fún aláṣẹ. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì bá àyíká mu.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìsọ̀rí ọ̀pọ̀ ti ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí ìsọfúnni tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: πρὸς ἐμέ
  choice: tó mi létí
  rationale: Ní ìsopọ̀ pẹ̀lú ἐνεφάνισας, ó fi ẹni tí a sọ ìsọfúnni náà fún hàn; èyí ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, ní èdè òde òní tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ọ̀rọ̀ aláṣẹ ní tààrà nínú àsọyé láti mú ìtàn náà ṣàn lọ́nà àdánidá.
