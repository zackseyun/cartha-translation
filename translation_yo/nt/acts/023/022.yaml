  to: Nítorí náà, olórí ọmọ ogun náà rán ọ̀dọ́mọkùnrin náà lọ, ó sì pàṣẹ fún un pé, “Má sọ fún ẹnikẹ́ni pé o ti fi àwọn nǹkan wọ̀nyí hàn mí.”[a]
