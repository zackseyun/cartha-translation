source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: yo
  text: Nígbà náà ni Paulu sọ fún un pé, “Ọlọ́run fẹ́rẹ̀ẹ́ máa lù ọ́, ìwọ ògiri tí a fọ̀ funfun! Ìwọ sì jókòó láti dá mi lẹ́jọ́ gẹ́gẹ́ bí ohun tí Òfin sọ, ṣùgbọ́n nígbà tí ìwọ ń rú Òfin, o pàṣẹ kí a lù mí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “Ọlọ́run yóò lù ọ́.” Ní tààrà, èdè Gíríìkì ní, “Ọlọ́run fẹ́rẹ̀ẹ́ máa lù ọ́,” èyí tó lè tẹnu mọ́ pé ìṣe náà sún mọ́lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Ọlọ́run fẹ́rẹ̀ẹ́ lù ọ́
  rationale: ‘Fẹ́rẹ̀ẹ́’ pẹ̀lú ọ̀rọ̀-ìṣe náà fi ìṣe tí ó sún mọ́lé hàn, gẹ́gẹ́ bí μέλλει + infinitive; ‘lù’ sì bá τύπτω mu nínú ọ̀rọ̀ yìí.
- source_word: τοῖχε κεκονιαμένε
  choice: ìwọ ògiri tí a rẹ́ funfun
  rationale: Ó pa àwòrán ògiri tí a fi ẹfun tàbí ohun funfun bo mọ́, láìṣàlàyé ẹ̀gàn náà kọjá ohun tí Gíríìkì sọ.
- source_word: κάθῃ
  choice: Ìwọ sì jókòó
  rationale: Ó pa ìtumọ̀ gidi ti ‘jókòó’ àti agbára ìbéèrè ìbáwí Paulu mọ́.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: láti ṣe ìdájọ́ mi gẹ́gẹ́ bí Òfin
  rationale: ‘Gẹ́gẹ́ bí Òfin’ fi Òfin hàn gẹ́gẹ́ bí ìlànà tí ìdájọ́ yẹ kí ó tẹ̀ lé.
- source_word: παρανομῶν
  choice: ní rírú Òfin
  rationale: Ó sọ ìṣe tí ó lòdì sí Òfin, ó sì dá ìyàtọ̀ kedere sí ‘gẹ́gẹ́ bí Òfin.’
- source_word: κελεύεις με τύπτεσθαι
  choice: o pàṣẹ pé kí a lù mí
  rationale: Ó pa ìtumọ̀ àṣẹ àti ìṣe àìṣègbè tí passive infinitive náà ní mọ́ ní Yorùbá àdánidá.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Nígbà náà ni Paulu sọ fún un pé
  rationale: Ìtumọ̀ ìtàn tó ṣe tààrà, láìfi ohun tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Irú gbólóhùn Paulu pé Ọlọ́run fẹ́rẹ̀ẹ́ lù ú
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkéde ìṣe Ọlọ́run tí ó sún mọ́lé
  alternative: ‘Kí Ọlọ́run lù ọ́,’ bí àdúrà ègún tàbí ìfẹ́-ọkàn
  rationale: μέλλει pẹ̀lú infinitive sábà ń tọ́ka sí ìṣe tó ń bọ̀ tí ó sún mọ́lé, kì í ṣe ìfẹ́-ọkàn. Ìtumọ̀ náà kò dájọ́ bóyá ìbáwí Paulu tọ́ tàbí kò tọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A kọ ‘Òfin’ pẹ̀lú lẹ́tà ńlá nítorí pé ó tọ́ka sí Òfin Mósè nínú àyíká yìí. A pa àwòrán ẹ̀gàn ‘ògiri tí a rẹ́ funfun’ mọ́, dípò ṣíṣàlàyé ìtumọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì.
