revisions:
- from: Nígbà náà ni Paulu sọ fún un pé, “Ọlọ́run fẹ́rẹ̀ẹ́ lù ọ́, ìwọ ògiri tí a rẹ́ funfun! Ìwọ sì jókòó láti ṣe ìdájọ́ mi gẹ́gẹ́ bí Òfin, síbẹ̀, ní rírú Òfin, o pàṣẹ pé kí a lù mí?”[a]
  to: Nígbà náà ni Paulu sọ fún un pé, “Ọlọ́run fẹ́rẹ̀ẹ́ máa lù ọ́, ìwọ ògiri tí a fọ̀ funfun! Ìwọ sì jókòó láti dá mi lẹ́jọ́ gẹ́gẹ́ bí ohun tí Òfin sọ, ṣùgbọ́n nígbà tí ìwọ ń rú Òfin, o pàṣẹ kí a lù mí?”[a]
  rationale: Àtúnṣe náà ṣe ìyàtọ̀ pàtàkì láàárín ‘fẹ́rẹ̀ẹ́ lù’ (‘fẹ́rẹ̀ẹ́ ṣẹlẹ̀’) àti ìṣe tí ó fẹ́ bẹ̀rẹ̀, kí ó lè ba μέλλει + infinitive mu. Ó tún mú gbólóhùn ìdájọ́ náà jẹ́ Yorùbá àdánidá sí i, ó sì pa ìyàtọ̀ tí Gíríìkì ṣe láàárín dídájọ́ ní ìbámu pẹ̀lú Òfin àti rírú Òfin mọ́.
