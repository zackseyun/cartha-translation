id: ACT.23.20
reference: Acts 23:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: yo
  text: Ó sì wí pé, “Àwọn Júù[a] ti jọ fohùn ṣọ̀kan láti bẹ̀ ọ́ pé kí o kó Pọ́ọ̀lù sọ̀ kalẹ̀ sí ìgbìmọ̀ Sànhẹ́dírìn[b] ní ọ̀la, bí ẹni pé wọ́n fẹ́ wádìí ohun kan nípa rẹ̀ dáadáa sí i.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú àyíká yìí, “Àwọn Júù” ń tọ́ka sí ẹgbẹ́ àwọn Júù tí ó ń gbìmọ̀ lòdì sí Pọ́ọ̀lù, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: contextual_clarification
  - marker: b
    text: Tàbí, “ìgbìmọ̀.” Ọ̀rọ̀ Gíríìkì συνέδριον níbí ṣeé ṣe kí ó tọ́ka ní pàtó sí Sànhẹ́dírìn, ìgbìmọ̀ alákòóso àwọn Júù.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “bí ẹni pé wọ́n fẹ́ ṣe ìwádìí nípa rẹ̀ pẹkipẹki sí i.”
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέθεντο
  choice: ti jọ fohùn ṣọ̀kan
  rationale: Ó fi hàn pé wọ́n jọ dé sí àdéhùn kan, láì fi ìtumọ̀ ‘dìtẹ̀’ kún ọ̀rọ̀ náà fúnra rẹ̀.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: láti bẹ̀ ọ́ pé
  rationale: Nínú àyíká yìí, ἐρωτάω túmọ̀ sí béèrè tàbí bẹ ẹnì kan pé kí ó ṣe ohun kan; ọ̀nà yìí jẹ́ Yorùbá àdánidá.
- source_word: καταγάγῃς
  choice: kí o kó Pọ́ọ̀lù sọ̀ kalẹ̀ wá
  rationale: Ó pa agbára ìtọ́sọ́nà κατά- mọ́, ìyẹn mímú un sọ̀ kalẹ̀ láti ibi gíga tí àwọn ọmọ ogun wà.
- source_word: συνέδριον
  choice: ìgbìmọ̀ Sànhẹ́dírìn
  rationale: Níbí, ọ̀rọ̀ náà ń tọ́ka sí ìgbìmọ̀ aṣáájú àwọn Júù ní Jerúsálẹ́mù; fífi ‘ìgbìmọ̀’ kún orúkọ náà ń jẹ́ kí ó yé òǹkàwé.
- source_word: ὡς
  choice: bí ẹni pé
  rationale: Ó sọ èrò tí wọ́n fẹ́ fi ṣe àwáwí, láì sọ ọ́ di ìdájọ́ tó kọjá ohun tí Gíríìkì sọ.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: wọ́n fẹ́ wádìí ohun kan ... dáadáa sí i
  rationale: ‘Fẹ́’ mú èrò ohun tí wọ́n pinnu láti ṣe jáde; ‘wádìí’ fi ìbéèrè láti mọ̀ sí i hàn; ‘ohun kan’ pa τι mọ́, ‘dáadáa sí i’ sì pa ìpele àfiwé ἀκριβέστερον mọ́.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá ní Yorùbá.
- source_word: Οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; àlàyé ìsàlẹ̀ fi mọ̀ pé ẹgbẹ́ tí ó wà nínú ìdìtẹ̀ náà ni àyíká ọ̀rọ̀ ń tọ́ka sí.
theological_decisions:
- issue: Àwọn tí ‘Οἱ Ἰουδαῖοι’ ń tọ́ka sí nínú àkọsílẹ̀ ìkọlù yìí
  choice: Àwọn Júù
  alternative: Àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: A kò dín ìtumọ̀ ọ̀rọ̀ Gíríìkì kù nínú ara ẹsẹ̀; síbẹ̀, àlàyé ṣàlàyé pé kì í ṣe gbogbo àwọn Júù ni gbogbo ayé, bí kò ṣe ẹgbẹ́ kan tí ó jọmọ́ ète yìí.
- issue: Bí a ṣe máa túmọ̀ ὡς nínú ète ẹ̀tàn
  choice: bí ẹni pé
  alternative: wọ́n fi ṣe àwáwí pé
  rationale: ‘Bí ẹni pé’ pa àìdánilójú àti ìfarahàn ète náà mọ́, kò sì túmọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ orísun sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Kó ... sọ̀ kalẹ̀ wá’ pa ìtọ́sọ́nà ìrìnàjò orísun mọ́, ‘ìgbìmọ̀ Sànhẹ́dírìn’ sì darapọ̀ ìtumọ̀ iṣẹ́ rẹ̀ mọ́ orúkọ ilé-iṣẹ́ náà.
