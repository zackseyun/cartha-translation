source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: yo
  text: Nígbà tí ó ń sọ èyí, àríyànjiyàn kan bẹ̀rẹ̀ láàárín àwọn Farisí àti àwọn Sadusí, àwọn ènìyàn tí ó péjọ náà sì pínyà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Bí ó sì ti ń sọ èyí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ genitive absolute pẹ̀lú present participle, ó sì fi hàn pé ohun méjèèjì ń ṣẹlẹ̀ ní àkókò kan náà. ‘Bí ó sì ti ń sọ èyí’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yẹn mọ́.
- source_word: ἐγένετο
  choice: bẹ̀rẹ̀
  rationale: Nínú àkójọpọ̀ rẹ̀ pẹ̀lú στάσις, ọ̀rọ̀ náà túmọ̀ sí pé ìjà tàbí ìyapa kan ṣẹ̀ṣẹ̀ dìde. ‘Bẹ̀rẹ̀’ sọ ìbẹ̀rẹ̀ ìṣẹ̀lẹ̀ náà ní èdè Yorùbá tó rọrùn.
- source_word: στάσις
  choice: ìjàmbá ọ̀rọ̀
  rationale: Níbí, στάσις ń tọ́ka sí awuyewuye tàbí ìjà ẹgbẹ́. ‘Ìjàmbá ọ̀rọ̀’ fi hàn pé àríyànjiyàn líle kan bẹ̀rẹ̀ láì sọ pé wọ́n bẹ̀rẹ̀ sí í jagun nípa ti ara.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: láàárín àwọn Farisí àti àwọn Sadusí
  rationale: Bí ó tilẹ̀ jẹ́ pé Greek lo genitive, ‘láàárín’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi àwọn ẹgbẹ́ méjì tí wọ́n dojú kọ ara wọn hàn.
- source_word: ἐσχίσθη
  choice: pínyà sí méjì
  rationale: Passive σχίζω túmọ̀ sí ‘a fà ya’ tàbí ‘a pín.’ Nínú ọ̀rọ̀ nípa àwùjọ, ‘pínyà sí méjì’ sọ ìyapa ẹgbẹ́ náà ní kedere.
- source_word: τὸ πλῆθος
  choice: àwọn ènìyàn tí ó péjọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo àwọn tí ó péjọ níwájú Pọ́ọ̀lù. Ìtumọ̀ yìí yà wọ́n sọ́tọ̀ kúrò nínú ogunlọ́gọ̀ lásán, ó sì bá àyíká ìgbọ́jọ́ mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà jẹ́ ti ìtàn, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Farisí’ àti ‘Sadusí’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ ẹ̀sìn tí ó wọ́pọ̀ nínú ìtumọ̀ Bíbélì Yorùbá.
