id: ACT.23.9
reference: Acts 23:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: yo
  text: Ariwo ńlá kan sì wáyé, àwọn kan nínú àwọn akọ̀wé ti ẹgbẹ́ àwọn Farisí sì dìde, wọ́n ń jiyàn gidigidi pé, “A kò rí ohun búburú kankan nínú ọkùnrin yìí. Ṣùgbọ́n bí ẹ̀mí kan[b] tàbí áńgẹ́lì kan bá ti sọ̀rọ̀ fún un—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gbólóhùn náà dá dúró lójijì nínú ọ̀rọ̀ Gíríìkì: “Ṣùgbọ́n bí ẹ̀mí kan tàbí áńgẹ́lì kan bá ti sọ̀rọ̀ fún un—”'
    reason: textual_variant
  - marker: b
    text: A tún lè lóye “ẹ̀mí” ní gbogbogbò gẹ́gẹ́ bí ẹ̀dá ẹ̀mí. Àwọn kan ka a sí “Ẹ̀mí,” ṣùgbọ́n ìfiwéra rẹ̀ pẹ̀lú “áńgẹ́lì” ṣe atilẹyin fún ìtumọ̀ gbogbogbò níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: Ariwo ńlá
  rationale: Ó fi ìtumọ̀ igbe tàbí ariwo aláriwo àti ìtẹnumọ́ μεγάλη hàn ní Yorùbá àdánidá.
- source_word: ἀναστάντες
  choice: dìde
  rationale: Ó pa ìṣe ti ara mọ́, ó sì bá àyíká ìpéjọ tí àwọn ènìyàn dìde láti sọ̀rọ̀ mu.
- source_word: τινὲς τῶν γραμματέων
  choice: àwọn kan lára àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” ni ìtumọ̀ tààrà fún àwọn amòye òfin Júù nínú àyíká yìí; “àwọn kan lára” pa àìnípàtó τινές mọ́.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: tí ó jẹ́ ti ẹgbẹ́ àwọn Farisí
  rationale: “Ẹgbẹ́” sọ faction tàbí party di mímọ̀ láìfi èrò ẹ̀sìn mìíràn kún un.
- source_word: διεμάχοντο
  choice: wọ́n ń ṣe àríyànjiyàn kíkankíkan
  rationale: Àpẹẹrẹ ìṣe tí ń lọ lọ́wọ́ àti agbára ọ̀rọ̀ náà hàn nínú “ń ṣe” àti “kíkankíkan.”
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: A kò rí ohun búburú kankan nípa ọkùnrin yìí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere nínú àyíká ìdájọ́, ó sì yẹra fún mímú κακόν di “ẹ̀ṣẹ̀” ní pàtó ju orísun lọ.
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó tẹ̀lé ìsopọ̀ àti gbólóhùn oní条件 orísun, ó sì jẹ́ kí gbólóhùn náà lè dá dúró láìparí bí ti Gíríìkì.
- source_word: πνεῦμα
  choice: ẹ̀mí kan
  rationale: Àìní article àti ìyàtọ̀ rẹ̀ sí “áńgẹ́lì” ṣe atilẹyin fún ẹ̀dá ẹ̀mí kan ní gbogbogbò, kì í ṣe dandan Ẹ̀mí Mímọ́.
- source_word: ἐλάλησεν αὐτῷ
  choice: bá a sọ̀rọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sisọ pé ẹnì kan spoke to him; “bá ti” fi iṣẹlẹ̀ tí ó ṣeé ṣe pé ó ti ṣẹlẹ̀ hàn.
- source_word: ἄγγελος
  choice: áńgẹ́lì kan
  rationale: Àyíká ẹ̀dá ọ̀run àti ìfiwéra pẹ̀lú πνεῦμα ń tọ́ka sí áńgẹ́lì, kì í ṣe ońṣẹ́ ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα ní ìfiwéra pẹ̀lú ἄγγελος
  choice: ẹ̀mí kan, ìyẹn ẹ̀dá ẹ̀mí ní gbogbogbò
  alternative: Ẹ̀mí, tí a lè lóye gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  rationale: Ìsopọ̀ “ẹ̀mí kan tàbí áńgẹ́lì kan” àti àìní article ń ṣètìlẹ́yìn fún ìtumọ̀ gbogbogbò; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì mọ́ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
- issue: Gbólóhùn ìkẹyìn tí kò parí
  choice: Pa ìdádúró òjijì mọ́ pẹ̀lú àmì ìdádúró gígùn
  alternative: 'Parí rẹ̀ gẹ́gẹ́ bí ìbéèrè: “Ǹjẹ́ ẹ̀mí kan tàbí áńgẹ́lì kan ti bá a sọ̀rọ̀?”'
  rationale: Ọ̀rọ̀ Gíríìkì dá dúró lójijì; pípa èyí mọ́ kò fi ohun tí orísun kò sọ kún un, ó sì pa ìdààmú inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìtẹ̀sí ìdájọ́, agbára àríyànjiyàn, àti gbólóhùn tí kò parí mọ́.
