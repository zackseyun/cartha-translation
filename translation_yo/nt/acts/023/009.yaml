  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ nínú àwọn ìlànà Gíríìkì mọ́: ìhòòhò/ariwo ńlá, àwọn akọ̀wé kan ti apá àwọn Farisí, àríyànjiyàn tí ń lọ, ìwádìí pé kò sí ohun búburú nínú Pọ́ọ̀lù, àti gbólóhùn ìkẹyìn tí ó dá dúró lójijì. Ṣùgbọ́n “bẹ́ sílẹ̀” kò túmọ̀ sí pé ariwo ‘wáyé/bẹ̀rẹ̀’ ní Yorùbá boṣewa, “nípa ọkùnrin yìí” yí ìtumọ̀ ìdájọ́ ‘nínú ẹni yìí’ sẹ́yìn díẹ̀, àti “bá a sọ̀rọ̀” lè dà bí ìjíròrò pẹ̀lú un ju ‘sọ̀rọ̀ fún un’ lọ.'
