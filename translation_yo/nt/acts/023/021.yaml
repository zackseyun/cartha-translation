translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; a pa àwòrán ibùba, ègún ara ẹni, àti àìmọ̀ pàtó tó wà nínú ‘ìlérí’ mọ́.
