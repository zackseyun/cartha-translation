id: ACT.23.21
reference: Acts 23:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: yo
  text: Nítorí náà, má ṣe jẹ́ kí wọ́n yí ọ lọ́kàn, nítorí àwọn ọkùnrin tí ó lé ní ogójì láti inú wọn ń ba a ní ibùba. Wọ́n ti fi ara wọn sábẹ́ ègún[a] pé wọn kì yóò jẹ tàbí mu títí wọn yóò fi pa á. Ní báyìí, wọ́n ti múra tán, wọ́n sì ń dúró de ìlérí láti ọ̀dọ̀ rẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ti fi ara wọn dè nípa ìbúra”; ọ̀rọ̀ Gíríìkì náà ní èrò pé wọ́n pe ègún sórí ara wọn bí wọn kò bá mú ìbúra náà ṣẹ.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n ń dúró de ìfọwọ́sí tàbí àṣẹ rẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: jẹ́ kí wọ́n yí ọ lọ́kàn
  rationale: 'Ó fi ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣe hàn ní Yorùbá àdánidá: kí má ṣe jẹ́ kí ẹ̀bẹ̀ wọn mú un gba tiwọn.'
- source_word: ἐνεδρεύουσιν
  choice: ti ba ní ibùba dè é
  rationale: Ó pa àwòrán gidi ti dídúró ní ìkọ̀kọ̀ láti kọlu mọ́, dípò ọ̀rọ̀ gbòòrò bí ‘ń dìtẹ̀ sí i.’
- source_word: ἐξ αὐτῶν
  choice: láti inú wọn
  rationale: Ó ṣàlàyé pé àwọn ọkùnrin náà jáde lára ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: àwọn ọkùnrin tí ó lé ní ogójì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ iye tí ó ju ogójì lọ.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: fi ara wọn sábẹ́ ègún
  rationale: 'Ó pa apá ègún ara ẹni mọ́: wọ́n pe ègún sórí ara wọn bí wọn kò bá mú ohun tí wọ́n búra fún ṣẹ.'
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: wọn kì yóò jẹ tàbí mu
  rationale: Ó mú ìdènà méjèèjì—jíjẹ àti mímu—hàn kedere ní Yorùbá.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: títí wọn yóò fi pa á
  rationale: Ní àyíká yìí ἀναιρέω túmọ̀ sí pípa ènìyàn; gbólóhùn náà sì tọ́ka sí ohun tí wọ́n pinnu láti ṣe lọ́jọ́ iwájú.
- source_word: εἰσιν ἕτοιμοι
  choice: wọ́n ti múra tán
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì fi hàn pé gbogbo ohun ti ṣe tán fún ìgbésẹ̀ náà.
- source_word: προσδεχόμενοι
  choice: wọ́n sì ń dúró de
  rationale: Ó fi ìdúró pẹ̀lú ìfojúsọ́nà hàn.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: ìlérí láti ọ̀dọ̀ rẹ
  rationale: Ó tẹ̀ lé ìtumọ̀ pàtàkì ἐπαγγελία gẹ́gẹ́ bí ‘ìlérí,’ láì fi ìtumọ̀ àyíká rẹ̀ sí i ní pàtó nínú ẹsẹ̀.
