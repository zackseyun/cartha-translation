revisions:
- from: Nítorí náà, má ṣe jẹ́ kí wọ́n yí ọ lọ́kàn, nítorí àwọn ọkùnrin tí ó lé ní ogójì láti inú wọn ti ba ní ibùba dè é. Wọ́n ti fi ara wọn sábẹ́ ègún[a] pé wọn kì yóò jẹ tàbí mu títí wọn yóò fi pa á. Ní báyìí, wọ́n ti múra tán, wọ́n sì ń dúró de ìlérí láti ọ̀dọ̀ rẹ[b].
  to: Nítorí náà, má ṣe jẹ́ kí wọ́n yí ọ lọ́kàn, nítorí àwọn ọkùnrin tí ó lé ní ogójì láti inú wọn ń ba a ní ibùba. Wọ́n ti fi ara wọn sábẹ́ ègún[a] pé wọn kì yóò jẹ tàbí mu títí wọn yóò fi pa á. Ní báyìí, wọ́n ti múra tán, wọ́n sì ń dúró de ìlérí láti ọ̀dọ̀ rẹ[b].
  rationale: The sole textual revision replaces the unclear ‘ti ba ní ibùba dè é’ with ‘ń ba a ní ibùba,’ a natural Yoruba expression that accurately represents the Greek present tense and concrete sense of lying in ambush. The rest of the wording and both footnotes are retained because they faithfully preserve the source’s meaning and contextual ambiguity.
