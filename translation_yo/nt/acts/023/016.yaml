id: ACT.23.16
reference: Acts 23:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọmọkùnrin arábìnrin Paulu gbọ́ nípa ìbùba náà[a], ó wá, ó sì wọ inú bárékè àwọn ọmọ ogun[b], ó sì ròyìn rẹ̀ fún Paulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdìtẹ̀ náà.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí ìbùba tàbí dídúró ní ìkọ̀kọ̀ láti kọlu ẹni kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àgọ́ àwọn ọmọ ogun.” Nínú àyíká yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí bárékè àwọn ọmọ ogun Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà ń tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó sì pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'δέ ń fi ìyípadà ìtàn pẹ̀lú ìtakora díẹ̀ hàn: àwọn Júù gbìmọ̀, ṣùgbọ́n ẹnì kan gbọ́ nípa rẹ̀.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: ọmọkùnrin arábìnrin Paulu
  rationale: Èyí tẹ̀ lé ìbátan tí Gíríìkì sọ ní kedere, dípò lílo ọ̀rọ̀ ìbátan kan tó lè ṣókùnkùn sí i.
- source_word: τὴν ἐνέδραν
  choice: bí wọ́n ṣe lúgọ dè é
  rationale: ἐνέδρα túmọ̀ sí dídúró ní ìkọ̀kọ̀ láti kọlu ẹnì kan; 'lúgọ dè é' jẹ́ ọ̀nà Yorùbá àdánidá láti pa àwòrán ìbùba náà mọ́, kì í ṣe ìdìtẹ̀ lásán.
- source_word: παραγενόμενος
  choice: ó wá
  rationale: Participle náà sọ pé ó dé ibẹ̀ kí ó tó wọlé; 'ó wá' mú ìtẹ̀lé ìṣe náà hàn ní ṣókí.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: ó wọ inú ibùdó àwọn ọmọ ogun
  rationale: παρεμβολή lè túmọ̀ sí ibùdó tàbí bárékè; nínú àyíká àwọn ọmọ ogun Róòmù yìí, 'ibùdó àwọn ọmọ ogun' ṣe kedere, ó sì pa àyè ìtumọ̀ náà mọ́.
- source_word: ἀπήγγειλεν
  choice: ó ròyìn rẹ̀
  rationale: ἀπαγγέλλω ní ìtumọ̀ fífi ìròyìn tàbí ọ̀rọ̀ tí a gbọ́ jíṣẹ́; 'ròyìn' bá ìṣe náà mu.
- source_word: τῷ Παύλῳ
  choice: fún Paulu
  rationale: Dative indirect object ni; 'fún Paulu' jẹ́ ìtumọ̀ Yorùbá tààrà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a pa ìtẹ̀lé àwọn participle Gíríìkì mọ́ nípasẹ̀ àwọn ọ̀rọ̀-ìṣe tó tẹ̀ lé ara wọn.
