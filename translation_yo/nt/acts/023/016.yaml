  source_fidelity: Ìtumọ̀ náà ń tẹ̀ lé Gíríìkì dáadáa nípa ìbátan ọmọkùnrin arábìnrin Paulu, ìgbọ́ nípa ìbùba náà, wíwá rẹ̀, lílọ sínú ibi tí àwọn ọmọ ogun wà, àti ríròyìn fún Paulu. Àtúnṣe náà yọ ìlò ọ̀rọ̀ tó fi olùṣe àti ẹni tí ìbùba náà dojú kọ hàn ní kedere ju ti Gíríìkì lọ, ó sì sọ παρεμβολή di “bárékè” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ náà.
  naturalness: “Gbọ́ nípa ìbùba náà” jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn, ó sì sún mọ́ ọ̀rọ̀ Gíríìkì ju “gbọ́ nípa bí wọ́n ṣe lúgọ dè é” lọ. “Bárékè àwọn ọmọ ogun” sì jẹ́ ọ̀rọ̀ kedere fún ibi ìṣọ́ ọmọ ogun Róòmù nínú àyíká ẹsẹ̀ yìí.
  terminology: A pa Paulu mọ́ gẹ́gẹ́ bí ìlò orúkọ nínú àkọsílẹ̀ náà. “Ìbùba” gba ìtumọ̀ ἐνέδρα, àti “bárékè” gba ìtumọ̀ παρεμβολή nínú àyíká ìhámọ́ra Róòmù, pẹ̀lú “àgọ́ àwọn ọmọ ogun” gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
