  to: Ṣùgbọ́n nígbà tí ọmọkùnrin arábìnrin Paulu gbọ́ nípa ìbùba náà[a], ó wá, ó sì wọ inú bárékè àwọn ọmọ ogun[b], ó sì ròyìn rẹ̀ fún Paulu.
