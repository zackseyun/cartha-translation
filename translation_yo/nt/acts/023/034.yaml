source:
  edition: SBLGNT
  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: yo
  text: Lẹ́yìn tí ó ka lẹ́tà náà, ó béèrè pé ìpínlẹ̀ ìṣàkóso wo ni Paulu ti wá,[a] ó sì mọ̀ pé Kilikia ni ó ti wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Lẹ́yìn tí ó ka á, tí ó sì béèrè pé ìpínlẹ̀ ìṣàkóso wo ni ó ti wá, tí ó sì mọ̀ pé Kilikia ni ó ti wá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Lẹ́yìn tí ó ka lẹ́tà náà
  rationale: Aorist participle náà tọ́ka sí kíka lẹ́tà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn nínú àyíká ọ̀rọ̀; fífi “lẹ́tà náà” kún un mú ìtumọ̀ náà ṣe kedere ní Yorùbá.
- source_word: δὲ καὶ ἐπερωτήσας
  choice: ó béèrè
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́, καὶ sì so àwọn ìṣe náà pọ̀; gbólóhùn Yorùbá tí ó tẹ̀ lé ara rẹ̀ ń gbé iṣẹ́ wọn jáde láìjẹ́ kí ọ̀rọ̀ le.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: agbègbè ìṣàkóso wo ni Paulu ti wá
  rationale: ἐπαρχία túmọ̀ sí agbègbè ìṣàkóso Róòmù. “Agbègbè ìṣàkóso” ṣe kedere sí òǹkàwé òde òní, “Paulu” sì mú ẹni tí a ń tọ́ka sí hàn gbangba láti inú àyíká ọ̀rọ̀.
- source_word: πυθόμενος
  choice: ó sì mọ̀
  rationale: Ọ̀rọ̀ náà sọ pé ó rí ìsọfúnni náà gbà lẹ́yìn ìbéèrè; “ó sì mọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àbájáde ìwádìí náà.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: pé Kilikia ni ó ti wá
  rationale: ἀπό pẹ̀lú orúkọ ibi ń tọ́ka sí ibi ìpilẹ̀ṣẹ̀; ìṣètò “X ni ó ti wá” jẹ́ àdánidá, ó sì pa ìtẹnumọ́ ibi náà mọ́.
- source_word: Κιλικίας
  choice: Kilikia
  rationale: Àkọsílẹ̀ Yorùbá tó bá ìró orúkọ agbègbè Róòmù náà mu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tí ó ní àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “agbègbè ìṣàkóso” láti ṣàlàyé ἐπαρχία gẹ́gẹ́ bí ìpínlẹ̀ ìṣàkóso Róòmù, kì í ṣe agbègbè lasán.
