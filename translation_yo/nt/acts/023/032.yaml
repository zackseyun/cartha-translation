source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: yo
  text: Ní ọjọ́ kejì, wọ́n jẹ́ kí àwọn ọmọ ogun ẹlẹ́ṣin tẹ̀ síwájú pẹ̀lú rẹ̀, wọ́n sì padà sí ibùdó àwọn ọmọ ogun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé àwọn ọmọ ogun.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àgọ́ ológun tàbí ibi tí àwọn ọmọ ogun ń gbé; ó ṣeé ṣe kí ó tọ́ka sí ilé olódi àwọn ọmọ ogun Róòmù ní Jerúsálẹ́mù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí ọjọ́ tí ó tẹ̀ lé e. A kò tú δέ sí ọ̀rọ̀ àtakò líle, nítorí pé níbí ó jẹ́ àmì ìyípadà kékeré nínú ìtàn.
- source_word: ἐάσαντες
  choice: wọ́n jẹ́ kí
  rationale: Èyí fi ìtumọ̀ ‘gbà láàyè’ tàbí ‘jẹ́ kí’ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ tí ó ṣáájú pípadà wọn.
- source_word: τοὺς ἱππεῖς
  choice: àwọn ọmọ ogun ẹlẹ́ṣin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ọmọ ogun tí ń gun ẹṣin; yíyan ọ̀rọ̀ yìí ṣe kedere ju ‘àwọn ẹlẹ́ṣin’ lásán lọ.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: tẹ̀ síwájú pẹ̀lú rẹ̀
  rationale: Nínú àyíká ìrìn àjò yìí, àwọn ọmọ ogun ẹlẹ́ṣin ń bá Pọ́ọ̀lù lọ nígbà tí àwọn yòókù padà; ‘tẹ̀ síwájú’ mú ìtẹ̀síwájú ìrìn náà hàn láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ὑπέστρεψαν
  choice: wọ́n sì padà
  rationale: Èyí ni ìtumọ̀ àdánidá ti ‘padà’ tàbí ‘yí padà’ nínú ìtàn yìí.
- source_word: εἰς τὴν παρεμβολήν
  choice: sí ibùdó àwọn ọmọ ogun
  rationale: παρεμβολή lè jẹ́ àgọ́ ológun tàbí ibi tí àwọn ọmọ ogun ń gbé. ‘Ibùdó àwọn ọmọ ogun’ pa ìtumọ̀ gbooro náà mọ́, ó sì bá àyíká àwọn ọmọ ogun Róòmù mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn Gíríìkì, a sì fi àmì àlàyé [a] sí ọ̀rọ̀ tí ó ń ṣàlàyé gan-an.
