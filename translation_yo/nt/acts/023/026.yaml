  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: yo
  text: 'Kíláúdíù Lísíà, sí Fẹ́líìsì, gómìnà ọlọ́lá jù lọ[a]: Ìkíni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí Gómìnà Fẹ́líìsì ọlọ́lá.” Ọ̀rọ̀ Gíríìkì κρατίστῳ jẹ́ oyè ìbọ̀wọ̀ nínú ìkọ̀wé ìjọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Kíláúdíù Lísíà
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn orúkọ Gíríìkì ní Yorùbá.
- source_word: τῷ κρατίστῳ
  choice: ọlọ́lá jù lọ
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ọ̀wọ̀ gíga nínú lẹ́tà ìjọba; ‘ọlọ́lá jù lọ’ pa ìtumọ̀ àti ìforúkọbọ̀ ọ̀wọ̀ náà mọ́ ní Yorùbá.
- source_word: ἡγεμόνι
  choice: Gómìnà
  rationale: Ní àyíká ìṣàkóso Róòmù yìí, ọ̀rọ̀ náà ń tọ́ka sí aláṣẹ ìgbèríko; ‘Gómìnà’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ láì fi oyè pàtó tí Gíríìkì kò sọ kún un.
- source_word: Φήλικι
  choice: Fẹ́líìsì
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: χαίρειν
  choice: Ẹ kú àbọ̀
  rationale: Nínú ìbẹ̀rẹ̀ lẹ́tà, ọ̀rọ̀ náà jẹ́ ìkíni àṣà, kì í ṣe àṣẹ pé kí ẹni náà yọ̀; ‘Ẹ kú àbọ̀’ jẹ́ ìkíni ọlọ́wọ̀ tó bá lẹ́tà mu.
