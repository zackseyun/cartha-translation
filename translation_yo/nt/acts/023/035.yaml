base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: yo
  text: Ó ní, “Èmi yóò gbọ́ ẹjọ́ rẹ[a] nígbà tí àwọn olùfisùn rẹ náà bá dé.” Ó sì pàṣẹ pé kí wọ́n máa ṣọ́ ọ nínú pírétóríọ̀mù Hẹ́rọ́dù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi yóò gbọ́ ọ títí dé òpin.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbigbọ́ ẹni kan títí tí ó fi parí; ní àyíká ìdájọ́ yìí, “gbọ́ ẹjọ́ rẹ” mú ìtumọ̀ náà ṣe kedere.
    reason: lexical_alternative
  - marker: b
    text: Pírétóríọ̀mù ni ibùgbé tàbí ilé-iṣẹ́ ìjọba gómìnà Róòmù; níbí, ó ṣeé ṣe kí ó jẹ́ ààfin Hẹ́rọ́dù ní Kesarea tí gómìnà ń lò.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Èmi yóò gbọ́ ẹjọ́ rẹ
  rationale: διακούω ní ibi ìdájọ́ túmọ̀ sí fífetí sí ẹni tàbí ẹjọ́ rẹ títí dé òpin. Ọ̀rọ̀ Yorùbá “gbọ́ ẹjọ́ rẹ” jẹ́ èdè ìdájọ́ tó ṣe kedere, láìfi “ní kíkún” kún ọ̀rọ̀ pàtó.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: nígbà tí àwọn olùfisùn rẹ bá dé pẹ̀lú
  rationale: ὅταν pẹ̀lú subjunctive tọ́ka sí ohun ọjọ́ iwájú tí a ń retí; “nígbà tí ... bá dé” mú èyí jáde. καί ni a túmọ̀ sí “pẹ̀lú,” ìyẹn pé àwọn olùfisùn náà gbọ́dọ̀ wà níbẹ̀.
- source_word: κελεύσας
  choice: Ó sì pàṣẹ
  rationale: Aorist participle náà ń tẹ̀ lé ọ̀rọ̀ tí ó sọ; gbolohun aláìlórúkọ “Ó sì pàṣẹ” jẹ́ àlàyé Yorùbá tó rọrùn, tó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: nínú pírétóríọ̀mù Hẹ́rọ́dù
  rationale: A pa ọ̀rọ̀ ìṣàkóso Róòmù “pírétóríọ̀mù” mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀ ojú ìwé nítorí pé ó lè tọ́ka sí ibùgbé tàbí olú ilé iṣẹ́ gómìnà.
- source_word: φυλάσσεσθαι αὐτόν
  choice: kí wọ́n máa ṣọ́ ọ
  rationale: Passive infinitive náà sọ pé kí a pa Pọ́ọ̀lù mọ́ lábẹ́ ìṣọ́. “Máa ṣọ́ ọ” fi ìṣọ́ tó ń bá a lọ hàn, láìsọ ọ́ di ìjìyà ẹ̀wọ̀n ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. A lo “gbọ́ ẹjọ́” gẹ́gẹ́ bí àṣà èdè ìdájọ́ Yorùbá, a sì pa ọ̀rọ̀ ìtàn Róòmù “pírétóríọ̀mù” mọ́ pẹ̀lú àlàyé. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
