id: ACT.23.10
reference: Acts 23:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: yo
  text: Nígbà tí ìforígbárí ńlá bá ṣẹlẹ̀[a], olórí ọmọ ogun náà bẹ̀rù pé wọ́n lè fa Paulu ya pẹrẹpẹrẹ[b]. Ó sì pàṣẹ fún àwọn ọmọ ogun láti sọ̀ kalẹ̀, kí wọ́n já a gbà kúrò láàárín wọn, kí wọ́n sì mú un lọ sínú ibùdó àwọn ọmọ ogun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “aríyànjiyàn ńlá,” “ìyapa ńlá,” tàbí “rúdurùdu ńlá.” Ọ̀rọ̀ Gíríìkì στάσις lè tọ́ka sí ìforígbárí líle láàárín àwọn ènìyàn, àti ní àwọn àyíká mìíràn sí ìdàrúdàpọ̀ tàbí ìṣọ̀tẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “fa Paulu ya sí wẹ́wẹ́,” láti fi agbára àwòrán inú ọ̀rọ̀ Gíríìkì διασπασθῇ hàn.
    reason: lexical_alternative
  - marker: c
    text: “Ibùdó àwọn ọmọ ogun” túmọ̀ παρεμβολή, tó lè túmọ̀ ní tààrà sí “àgọ́ ológun”; níbí ó ń tọ́ka sí ibi tí àwọn ọmọ ogun Róòmù ń gbé ní Jerúsálẹ́mù.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: Nígbà tí aríyànjiyàn ńlá sì bẹ́ sílẹ̀
  rationale: Ẹ̀ka ọ̀rọ̀ olóminira nínú Gíríìkì ń fi ipò tí ìṣẹ̀lẹ̀ pàtàkì wáyé hàn. “Aríyànjiyàn ńlá” bá àríyànjiyàn líle tó wà nínú ìgbìmọ̀ mu, láì sọ ọ́ di ìṣọ̀tẹ̀ ní pàtó.
- source_word: φοβηθεὶς
  choice: bẹ̀rù
  rationale: Ó ṣàlàyé ìdí tí olórí ọmọ ogun fi pàṣẹ ohun tó tẹ̀ lé e.
- source_word: ὁ χιλίαρχος
  choice: olórí ọmọ ogun náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan; yíyan ọ̀rọ̀ yìí mú ipò rẹ̀ yé òǹkàwé lónìí láì lo àkọsílẹ̀ orúkọ oyè àjèjì.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: pé wọ́n lè fa Paulu ya sí wẹ́wẹ́
  rationale: “Fa ... ya sí wẹ́wẹ́” pa agbára àti àwòrán ìwà ipá inú διασπάω mọ́, “lè” sì fi hàn pé ohun tí ọ̀gá náà ń bẹ̀rù pé ó ṣeé ṣe ni.
- source_word: ἐκέλευσεν
  choice: ó pàṣẹ
  rationale: Ó jẹ́ ìtumọ̀ tààrà tó bá àyíká iṣẹ́ ológun mu.
- source_word: τὸ στράτευμα
  choice: àwọn ọmọ ogun
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ àkójọpọ̀, Yorùbá máa ń lo “àwọn ọmọ ogun” lọ́nà àdánidá fún ikọ̀ àwọn sójà.
- source_word: καταβὰν
  choice: láti sọ̀ kalẹ̀
  rationale: Ó pa ìṣípò láti ibi gíga ní àgbègbè odi ológun sí ibi ìgbìmọ̀ tó wà nísàlẹ̀ mọ́.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: kí wọ́n já a gbà kúrò láàárín wọn
  rationale: “Já a gbà” fi ìmúni kúrò pẹ̀lú agbára àti kíákíá hàn, “kúrò láàárín wọn” sì tẹ̀ lé ìtumọ̀ ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε
  choice: kí wọ́n sì mú un lọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n darí tàbí kó Paulu lọ sí ibi tí a dárúkọ.
- source_word: παρεμβολήν
  choice: ibùdó àwọn ọmọ ogun
  rationale: παρεμβολή lè túmọ̀ sí ibùdó ológun; níbí ó ń tọ́ka sí ibi tí àwọn ọmọ ogun Róòmù ń gbé ní Jerúsálẹ́mù.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé yé fún gbogbo ènìyàn. Gbólóhùn náà pín sí méjì kí ìtumọ̀ àti ìṣàn ọ̀rọ̀ le ṣe kedere, a sì lo àmì ohùn níbi tó yẹ. “Já a gbà” mú ìgbésẹ̀ ológun tó yára àti tó lágbára hàn láì pinnu pé ìdájọ́ òfin tàbí ìgbàlà ẹ̀sìn ni ọ̀rọ̀ náà ń sọ.
