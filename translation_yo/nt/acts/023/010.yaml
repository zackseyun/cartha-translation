- from: Nígbà tí aríyànjiyàn ńlá sì bẹ́ sílẹ̀[a], olórí ọmọ ogun náà bẹ̀rù pé wọ́n lè fa Paulu ya sí wẹ́wẹ́[b]. Nítorí náà, ó pàṣẹ fún àwọn ọmọ ogun láti sọ̀ kalẹ̀, kí wọ́n já a gbà kúrò láàárín wọn, kí wọ́n sì mú un lọ sínú ibùdó àwọn ọmọ ogun[c].
  to: Nígbà tí ìforígbárí ńlá bá ṣẹlẹ̀[a], olórí ọmọ ogun náà bẹ̀rù pé wọ́n lè fa Paulu ya pẹrẹpẹrẹ[b]. Ó sì pàṣẹ fún àwọn ọmọ ogun láti sọ̀ kalẹ̀, kí wọ́n já a gbà kúrò láàárín wọn, kí wọ́n sì mú un lọ sínú ibùdó àwọn ọmọ ogun[c].
  rationale: The revision makes only idiomatic improvements. It preserves the Greek ambiguity of στάσις as severe internal conflict, maintains the feared possibility that Paul might be torn apart, and retains the military movement and destination. Footnote markers remain correctly anchored to the relevant expressions.
