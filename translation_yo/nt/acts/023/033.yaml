id: ACT.23.33
reference: Acts 23:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: yo
  text: Nígbà tí wọ́n wọ Kesaréà, wọ́n fi lẹ́tà náà lé gómìnà náà lọ́wọ́[a], wọ́n sì mú Pọ́ọ̀lù wá síwájú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi lẹ́tà náà fún gómìnà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi Pọ́ọ̀lù hàn án.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí àwọn ọmọ-ogun tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; ‘wọ́n’ ṣe kedere, ó sì bá ìṣètò gbolohun Yorùbá mu.
- source_word: εἰσελθόντες
  choice: Nígbà tí wọ́n wọ
  rationale: Aorist participle náà fi ìṣe tó ṣáájú ìṣe pàtàkì hàn. Gbólóhùn àkókò yìí jẹ́ ọ̀nà àdánidá láti fi ìbáṣepọ̀ náà hàn ní Yorùbá.
- source_word: Καισάρειαν
  choice: Kesaréà
  rationale: Àkọsílẹ̀ orúkọ ìlú Caesarea ní ìbámu pẹ̀lú ìró Yorùbá, láìfi àlàyé ilẹ̀ míì kún un.
- source_word: ἀναδόντες
  choice: fi … lé … lọ́wọ́
  rationale: Àpólà yìí sọ fífi ìwé ìjọba náà fún aláṣẹ lọ́nà tó ṣe kedere, ó sì pa ìtumọ̀ ‘deliver/hand over’ mọ́.
- source_word: ἐπιστολήν
  choice: lẹ́tà
  rationale: ‘Lẹ́tà’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìwé ìbánisọ̀rọ̀ ìjọba ní àyíká yìí.
- source_word: ἡγεμόνι
  choice: gómìnà
  rationale: ‘Gómìnà’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún aláṣẹ ìpínlẹ̀ Róòmù yìí, láìsọ ipò náà di pàtó ju orísun lọ.
- source_word: παρέστησαν
  choice: mú … wá síwájú
  rationale: Ní àyíká ọ̀ràn òfin, ọ̀rọ̀ náà túmọ̀ sí mímú ẹni kan wá síwájú aláṣẹ; yíyan yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìfihàn ẹni náà mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ìṣe kejì mọ́ ti àkọ́kọ́, ó sì lè fi ìtumọ̀ àfikún hàn ní Yorùbá láìdi gbolohun náà wúwo.
- source_word: Παῦλον
  choice: Pọ́ọ̀lù
  rationale: Èyí ni àkọsílẹ̀ Yorùbá tó wọ́pọ̀ fún orúkọ Παῦλος.
- source_word: αὐτῷ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí gómìnà; ‘síwájú rẹ̀’ bá ọ̀rọ̀-ìṣe tí a yàn mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní ọlá, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn níbi tó bá bá ìlò Yorùbá mu, a sì yan ‘gómìnà’ nítorí pé ó ṣe kedere ju ọ̀rọ̀ gbogbogbò fún olórí lọ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ apá tí ọkọọkan ń ṣàlàyé.
