  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: yo
  text: Àwọn tí wọ́n dá ìdìtẹ̀ yìí sílẹ̀ pọ̀ ju ogójì lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó lé ní ogójì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: pọ̀ ju ogójì lọ
  rationale: Ọ̀rọ̀ ìfiwéra πλείους pẹ̀lú nọ́ńbà τεσσεράκοντα túmọ̀ sí ‘pọ̀ ju ogójì lọ’; èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ iye náà mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: συνωμοσίαν
  choice: dìtẹ̀
  rationale: Nínú àyíká yìí, ‘dìtẹ̀’ sọ àdéhùn ìkọ̀kọ̀ láti ṣe ibi ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún συνωμοσία.
- source_word: ποιησάμενοι
  choice: ó dìtẹ̀
  rationale: Aorist middle participle náà pẹ̀lú συνωμοσίαν ń tọ́ka sí àwọn tí wọ́n dá ìdìtẹ̀ náà sílẹ̀; ìṣe ọ̀rọ̀ Yorùbá ‘dìtẹ̀’ ṣàkópọ̀ ìṣe àti ohun tí wọ́n dá sílẹ̀ lọ́nà àdánidá.
- source_word: ἦσαν δὲ
  choice: Àwọn … pọ̀
  rationale: Ètò gbolohun yìí fi hàn pé ẹgbẹ́ náà wà, bí Gíríìkì ἦσαν ṣe ń ṣe; δέ jẹ́ àsopọ̀ fẹ́rẹ̀ẹ́ tí ìṣàn ọ̀rọ̀ Yorùbá lè gbé láìsí ‘ṣùgbọ́n’ tàbí ‘ǹjẹ́’.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: Àwọn tí ó dìtẹ̀ yìí
  rationale: Article pẹ̀lú participle náà ń dúró fún ‘àwọn tí wọ́n dá ìdìtẹ̀ yìí’; relative clause Yorùbá yìí pa ìtọ́kasí náà mọ́ ní èdè tí ó rọrùn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A yan ‘dìtẹ̀’ dípò gbólóhùn gígùn bí ‘dá ìdìtẹ̀ sílẹ̀’ kí ẹsẹ náà lè ṣàn dáadáa, láìfi ẹ̀jẹ́ tàbí ìbúra inú àyíká àwọn ẹsẹ tó ṣáájú kún ọ̀rọ̀ yìí.
