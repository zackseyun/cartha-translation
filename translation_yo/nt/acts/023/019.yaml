source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: yo
  text: Nígbà náà, olórí ọmọ-ogun náà di ọwọ́ rẹ̀ mú, ó sì mú un yà sí apá kan ní ìkọ̀kọ̀[a]. Ó bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀ pé, “Kí ni ohun tí o ní láti ròyìn fún mi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì yà sí apá kan ní ìkọ̀kọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kí ni o ní láti sọ fún mi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: di ọwọ́ rẹ̀ mú
  rationale: Ọ̀rọ̀ yìí fi ìṣe gidi hàn pé olórí ọmọ-ogun náà mú ọwọ́ rẹ̀; ‘di ọwọ́ rẹ̀ mú’ jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fi agbára líle kún ohun tí Gíríìkì sọ.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Ní àyíká ìtàn yìí, δέ ń tẹ ìṣẹ̀lẹ̀ náà síwájú. ‘Nígbà náà’ jẹ́ àsopọ̀ ìtàn tó ṣe kedere láìsọ pé ìtumọ̀ rẹ̀ ní ìtakora.
- source_word: ὁ χιλίαρχος
  choice: olórí ọmọ-ogun náà
  rationale: Χιλίαρχος jẹ́ ọ̀gá ọmọ-ogun Róòmù. ‘Olórí ọmọ-ogun’ yé òǹkàwé Yorùbá òde òní, ó sì yẹra fún ọ̀rọ̀ àjèjì tàbí oyè tí ó lè fi ipò tó ga jù kún un.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: ó sì lọ sí apá kan ní ìkọ̀kọ̀
  rationale: Ìtumọ̀ náà pa ìṣípò kúrò lọ́dọ̀ àwọn ẹlòmíràn àti ìkọ̀kọ̀ mọ́. Kò fi ohun tí kò hàn gbangba nínú gírámà Gíríìkì kún un, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ọ̀dọ́mọkùnrin náà bá a lọ.
- source_word: ἐπυνθάνετο
  choice: Ó bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀
  rationale: Àkókò imperfect nínú Gíríìkì lè tọ́ka sí ìbẹ̀rẹ̀ tàbí ìtẹ̀síwájú ìbéèrè. ‘Ó bẹ̀rẹ̀ sí í béèrè’ mú ìrísí yìí jáde ní Yorùbá àdánidá.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Kí ni ohun tí o ní láti ròyìn fún mi?
  rationale: ‘Kí ni ohun tí o ní láti…’ pa ìṣètò ìbéèrè náà mọ́, ‘ròyìn’ sì mú ìtumọ̀ fífi ìsọfúnni pàtàkì dé etí ẹni hàn ní àyíká ológun àti ẹjọ́.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìṣe mímú ọwọ́, yíyà sọ́tọ̀ ní ìkọ̀kọ̀, àti ìbéèrè olórí ọmọ-ogun náà mọ́.
