  to: Nígbà náà, olórí ọmọ-ogun náà di ọwọ́ rẹ̀ mú, ó sì mú un yà sí apá kan ní ìkọ̀kọ̀[a]. Ó bẹ̀rẹ̀ sí í béèrè lọ́wọ́ rẹ̀ pé, “Kí ni ohun tí o ní láti ròyìn fún mi?”[b]
