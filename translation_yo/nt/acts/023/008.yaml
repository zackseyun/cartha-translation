id: ACT.23.8
reference: Acts 23:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: yo
  text: Nítorí àwọn Sadusí sọ pé àjíǹde kò sí[a], bẹ́ẹ̀ ni áńgẹ́lì tàbí ẹ̀mí kò sí; ṣùgbọ́n àwọn Farisí jẹ́wọ́ àwọn méjèèjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Farisí jẹ́wọ́ gbogbo àwọn mẹ́tẹ̀ẹ̀ta”—ìyẹn ni, àjíǹde, áńgẹ́lì àti ẹ̀mí. Ọ̀rọ̀ Gíríìkì sọ pé “àwọn méjèèjì,” èyí tó tọ́ka ní tààrà jù lọ sí “áńgẹ́lì” àti “ẹ̀mí”; ṣùgbọ́n àwọn kan lóye rẹ̀ ní ọ̀nà tó gbòòrò sí i láti inú àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: àwọn Sadusí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni a kọ ní ìbámu pẹ̀lú bí Yorùbá ṣe ń pe orúkọ àjèjì.
- source_word: μὲν γὰρ
  choice: Nítorí
  rationale: Ó fi àlàyé ìdí fún ohun tó ṣẹlẹ̀ nínú ọ̀rọ̀ tó ṣáájú; ‘Nítorí’ mú ipa ìṣàlàyé náà jáde lọ́nà àdánidá.
- source_word: λέγουσιν μὴ εἶναι
  choice: sọ pé ... kò sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún gbolohun infinitive lẹ́yìn ọ̀rọ̀ sísọ, tí ó sì pa ìtumọ̀ àìsí mọ́.
- source_word: ἀνάστασιν
  choice: àjíǹde
  rationale: Ó tọ́ka sí jíjí dìde kúrò nínú òkú gẹ́gẹ́ bí ohun tó lè wà, kì í ṣe dandan ìṣẹ̀lẹ̀ kan ṣoṣo.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: bẹ́ẹ̀ ni áńgẹ́lì tàbí ẹ̀mí kò sí
  rationale: Ó pa ìkọ̀sílẹ̀ àwọn ọ̀rọ̀ méjèèjì mọ́ ní Yorùbá àdánidá, láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni a kọ ní ìbámu pẹ̀lú lílò Yorùbá tó wọ́pọ̀.
- source_word: ὁμολογοῦσιν
  choice: jẹ́wọ́
  rationale: Níhìn-ín ó túmọ̀ sí fífi ẹnu sí i pé ohun kan jẹ́ òtítọ́, kì í ṣe jíjẹ́wọ́ ẹ̀ṣẹ̀.
- source_word: τὰ ἀμφότερα
  choice: àwọn méjèèjì
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ‘méjèèjì’ ní pẹkipẹki, ó sì ṣeé ṣe kí ó tọ́ka sí áńgẹ́lì àti ẹ̀mí tí a ṣẹ̀ṣẹ̀ so pọ̀.
theological_decisions:
- issue: Ohun tí ‘àwọn méjèèjì’ n tọ́ka sí nínú ìjẹ́wọ́ àwọn Farisí
  choice: Ọ̀rọ̀ pàtàkì pa ‘àwọn méjèèjì’ mọ́, èyí tó ṣeé ṣe jù lọ láti tọ́ka sí áńgẹ́lì àti ẹ̀mí.
  alternative: 'Àwọn Farisí jẹ́wọ́ gbogbo àwọn mẹ́tẹ̀ẹ̀ta: àjíǹde, áńgẹ́lì àti ẹ̀mí.'
  rationale: Gíríìkì ní τὰ ἀμφότερα, ‘àwọn méjèèjì,’ kì í ṣe ‘gbogbo wọn’ tàbí ‘àwọn mẹ́tẹ̀ẹ̀ta.’ Síbẹ̀, àyíká ọ̀rọ̀ àti ohun tí a mọ̀ nípa ìgbàgbọ́ àwọn Farisí lè mú kí àwọn kan lóye rẹ̀ gẹ́gẹ́ bí gbogbo mẹ́tẹ̀ẹ̀ta; àlàyé ìsàlẹ̀ ojú-ewé ni a fi pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtakora àti àìdánilójú inú Gíríìkì mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
