  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa nípa àkókò ìṣẹ̀lẹ̀, ìdìtẹ̀, ìbúra-ègún tí wọ́n fi sí ara wọn, àti ìpinnu wọn láti má jẹ tàbí mu títí tí wọ́n yóò fi pa Paulu. Àtúnṣe náà mú ìtumọ̀ ποιήσαντες συστροφὴν hàn kedere sí i.
