source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́, àwọn Júù[a] dá ìdìtẹ̀, wọ́n sì fi ara wọn sábẹ́ ègún[b], wọ́n ní pé àwọn kì yóò jẹ tàbí mu títí wọn yóò fi pa Paulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà sọ pé, ‘àwọn Júù’; níhìn-ín, ó ń tọ́ka sí ẹgbẹ́ kan pàtó láàárín àwọn Júù tí wọ́n kópa nínú ìdìtẹ̀ náà, kì í ṣe gbogbo àwọn Júù.
    reason: cultural_note
  - marker: b
    text: Tàbí, ‘wọ́n búra lábẹ́ ègún.’ Gbólóhùn náà ń tọ́ka sí ìbúra tí wọ́n fi ń pe ìdájọ́ sórí ara wọn bí wọn kò bá mú un ṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Gbólóhùn yìí jẹ́ àkókò ìyípadà nínú ìtàn; ‘nígbà tí ilẹ̀ mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọjọ́ dé.
- source_word: ποιήσαντες συστροφὴν
  choice: dìtẹ̀ pọ̀
  rationale: Nínú àyíká ète láti pa Paulu, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n kóra jọ fún ìdìtẹ̀ tí wọ́n gbèrò ní ìkọ̀kọ̀, kì í ṣe ìrúkèrúdò ogunlọ́gọ̀.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; àlàyé ìsàlẹ̀ fi hàn pé ẹgbẹ́ kan pàtó láàárín wọn ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: fi ara wọn sábẹ́ ègún
  rationale: Ọ̀rọ̀ náà ń sọ ìbúra tí ẹni fi ìdájọ́ tàbí ègún pè sórí ara rẹ̀ bí òun kò bá mú un ṣẹ.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: wọ́n ní àwọn kì yóò jẹ bẹ́ẹ̀ ni àwọn kì yóò mu
  rationale: Èyí sọ ohun tí ìbúra wọn ní, ó sì pa ìṣọ̀kan àwọn ọ̀rọ̀ àtakò méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: títí àwọn yóò fi pa Paulu
  rationale: Gbólóhùn náà sọ ibi tí ìdènà jíjẹ àti mímu yóò parí; ó fi ète wọn láti pa Paulu hàn láì fi ìtumọ̀ míì kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtọ́kasí gbooro ‘àwọn Júù’ mọ́ nínú ọ̀rọ̀, a sì ṣàlàyé ààlà rẹ̀ nínú àlàyé ìsàlẹ̀.
