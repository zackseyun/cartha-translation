  terminology: ‘Àwọn Júù’ pa ọ̀rọ̀ Gíríìkì οἱ Ἰουδαῖοι mọ́. ‘Fi ara wọn sábẹ́ ègún’ jẹ́ ìtumọ̀ tí ó yẹ fún ἀνεθεμάτισαν ἑαυτούς; àlàyé ìsàlẹ̀ sì ṣàfihàn yíyàn ‘búra lábẹ́ ègún’ láì tún ọ̀rọ̀ inú ìtẹ̀jáde sọ pátápátá.
