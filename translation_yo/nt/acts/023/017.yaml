id: ACT.23.17
reference: Acts 23:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: yo
  text: Nígbà náà, Pọ́ọ̀lù pe ọ̀kan lára àwọn balógun ọgọ́rùn-ún, ó sì sọ pé, “Mú ọ̀dọ́kùnrin yìí lọ sọ́dọ̀ ọ̀gágun, nítorí ó ní ohun kan láti ròyìn fún un[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti sọ fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí láti ròyìn, kéde, tàbí sọ ohun kan fún ẹnì kan; a lo “ròyìn” nítorí pé àyíká ọ̀rọ̀ náà jẹ́ ti fífi ìsọfúnni pàtàkì kan jíṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé Pọ́ọ̀lù pe ẹni náà wá sọ́dọ̀ ara rẹ̀; “pe” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìṣe náà mu.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kò sì fi ìtakora hàn; “Nígbà náà” mú ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà yé kedere.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: ọ̀kan lára àwọn balógun ọgọ́rùn-ún
  rationale: ἑκατοντάρχης jẹ́ ipò olórí ọmọ ogun Róòmù kan tí ó máa ń darí nǹkan bí ọgọ́rùn-ún ọmọ ogun. “Balógun ọgọ́rùn-ún” ṣàlàyé ipò náà ní Yorùbá tí ó ṣeé lóye.
- source_word: ἔφη
  choice: ó sì sọ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì ṣe déédé láti mú ọ̀rọ̀ ìsọ̀rọ̀ wọlé.
- source_word: νεανίαν
  choice: ọ̀dọ́kùnrin
  rationale: νεανίας tọ́ka sí ọkùnrin tí ọjọ́ orí rẹ̀ ṣì kéré; “ọ̀dọ́kùnrin” jẹ́ ìtumọ̀ Yorùbá àdánidá.
- source_word: ἄπαγε
  choice: Mú ... lọ
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí láti mú tàbí ṣamọ̀nà ẹnì kan lọ sọ́dọ̀ ẹlòmíràn; “Mú ... lọ” bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: πρὸς τὸν χιλίαρχον
  choice: sọ́dọ̀ ọ̀gágun
  rationale: χιλίαρχος ni olórí ọmọ ogun gíga kan, ní àyíká yìí tribune ọmọ ogun Róòmù. “Ọ̀gágun” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣeé lóye, láì lo orúkọ ipò Róòmù tí kò wọ́pọ̀.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: nítorí ó ní ohun kan láti ròyìn fún un
  rationale: Ìṣọ̀kan ἔχει pẹ̀lú infinitive fi hàn pé ó ní ohun kan tí yóò sọ tàbí jíṣẹ́. “Ròyìn” bá àyíká ìsọfúnni pàtàkì náà mu, ṣùgbọ́n a pa ìtumọ̀ gbòòrò “sọ fún un” mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ìtàn tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. “Balógun ọgọ́rùn-ún” àti “ọ̀gágun” ń jẹ́ kí ìyàtọ̀ láàárín ipò àwọn olórí ọmọ ogun méjèèjì hàn.
