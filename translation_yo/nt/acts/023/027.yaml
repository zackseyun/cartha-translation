id: ACT.23.27
reference: Acts 23:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: yo
  text: Àwọn Júù[a] mú ọkùnrin yìí, wọ́n sì fẹ́rẹ̀ẹ́ pa á; mo dé pẹ̀lú àwọn ọmọ-ogun, mo sì gbà á kúrò lọ́wọ́ wọn, lẹ́yìn tí mo ti mọ̀ pé ará Róòmù ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù nípa ẹ̀yà àti ẹ̀sìn tàbí àwọn ènìyàn ilẹ̀ Jùdíà; níbí, ó ṣeé ṣe jù pé ó tọ́ka sí àwọn Júù tí wọ́n wà lára ogunlọ́gọ̀ tàbí àwọn alátakò ní Jerúsálẹ́mù.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: mú
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi agbára mú ẹni; ‘mú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi hàn dandan pé ìmú náà jẹ́ ìmú lábẹ́ òfin.
- source_word: Ἰουδαίων
  choice: Àwọn Júù
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn Júù nípa ẹ̀yà àti ẹ̀sìn tàbí sí àwọn ará Jùdíà; níbí, ó tọ́ka sí ẹgbẹ́ àwọn Júù ní Jerúsálẹ́mù tí wọ́n dojú kọ Pọ́ọ̀lù. A fi ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: wọ́n sì fẹ́ pa á
  rationale: Gbólóhùn Gíríìkì náà fi hàn pé pípa náà ti sún mọ́lé. ‘Wọ́n fẹ́ pa á’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí ó fẹ́ ṣẹlẹ̀ ní kánjú.
- source_word: ἐπιστὰς
  choice: Nígbà náà ni mo dé
  rationale: Ó sọ dídé síbi ìṣẹ̀lẹ̀ náà, pẹ̀lú ìtumọ̀ pé olórí ọmọ-ogun dá sí ọ̀ràn náà. Gbólóhùn yìí mú ìtẹ̀lé ìṣe náà ṣe kedere láìfi ìtumọ̀ àfikún sí i.
- source_word: σὺν τῷ στρατεύματι
  choice: pẹ̀lú àwọn ọmọ-ogun
  rationale: στράτευμα tọ́ka sí ẹgbẹ́ ológun kan; ‘àwọn ọmọ-ogun’ jẹ́ ọ̀rọ̀ tí ó ṣe kedere, tí kò sì sọ bí ẹgbẹ́ náà ti tóbi tó.
- source_word: ἐξειλάμην
  choice: mo sì gbà á sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígba ẹni kúrò nínú ewu. ‘Gbà á sílẹ̀’ bá àyíká ewu pípa mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: μαθὼν
  choice: lẹ́yìn tí mo ti mọ̀
  rationale: Aorist participle náà ṣàfihàn ohun tí ẹni náà sọ pé ó ti mọ̀ ní ìbáṣepọ̀ pẹ̀lú ìgbàlà náà. Ìtumọ̀ yìí pa ìtẹ̀lé tí lẹ́tà náà gbé kalẹ̀ mọ́ láìṣàtúnṣe rẹ̀ sí ìtàn tó wà ní orí 21–22.
- source_word: Ῥωμαῖός ἐστιν
  choice: ará Róòmù ni
  rationale: Èyí ni ìtumọ̀ tààrà Ῥωμαῖος. Nínú àyíká òfin, ó ní ìtumọ̀ jíjẹ́ ọmọ ìlú Róòmù, ṣùgbọ́n a kò fi ọ̀rọ̀ ‘ọmọ ìlú’ kún ohun tí Gíríìkì sọ ní tààrà.
theological_decisions:
- issue: Ọ̀nà tí olórí ọmọ-ogun gbà gbé ìtàn rẹ̀ kalẹ̀ nínú lẹ́tà
  choice: A túmọ̀ ẹ̀sùn rẹ̀ gẹ́gẹ́ bí ó ṣe wà, láìṣe àtúnṣe rẹ̀ kí ó bá àlàyé kíkún inú Ìṣe 21–22 mu.
  alternative: Láti tún gbólóhùn náà ṣe kí ó fi hàn pé ó mọ̀ pé Pọ́ọ̀lù jẹ́ ará Róòmù lẹ́yìn tí ó ti gbà á, tàbí láti dín ìforígbárí inú ìtàn náà kù.
  rationale: Ẹsẹ̀ náà ròyìn ọ̀rọ̀ Kíláúdíù Lísíà fúnra rẹ̀, ẹni tí ó gbé ìṣe rẹ̀ kalẹ̀ lọ́nà rere. Ìtumọ̀ gbọ́dọ̀ pa bí Gíríìkì ṣe gbé ọ̀rọ̀ náà kalẹ̀ mọ́, kó má sì yanju ìforígbárí inú ìtàn nípasẹ̀ àtúnsọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìṣọ̀kan ‘καὶ’ mọ́ nípasẹ̀ ‘sì’ dípò fífi ìtakora tí kò sí nínú orísun kún un.
