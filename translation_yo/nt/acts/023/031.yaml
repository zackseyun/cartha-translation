  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: yo
  text: 'Nítorí náà, àwọn ọmọ ogun náà ṣe gẹ́gẹ́ bí a ti pàṣẹ fún wọn: wọ́n mú Pọ́ọ̀lù, wọ́n sì gbé e lọ sí Áńtípátírì ní òru.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Nítorí náà, àwọn ọmọ ogun náà
  rationale: “Nítorí náà” ń fi ìtẹ̀síwájú àti àbájáde ìtàn hàn fún οὖν; a kò túmọ̀ μέν lọ́tọ̀ nítorí pé ó ń ṣètò ìbáṣepọ̀ gbólóhùn yìí pẹ̀lú èyí tó tẹ̀ lé e.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: ṣe gẹ́gẹ́ bí a ti pàṣẹ fún wọn
  rationale: Èyí pa ohùn àìsọ ẹni tó ṣe iṣẹ́ nínú participle perfect passive mọ́, ó sì fi hàn pé àṣẹ náà ti wáyé ṣáájú.
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: wọ́n mú Pọ́ọ̀lù
  rationale: “Mú” sọ ìgbésẹ̀ tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì náà ní ọ̀nà àdánidá, láìfi èrò “ṣọ́ ọ” tàbí “darí rẹ̀” kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: ἤγαγον ... εἰς τὴν Ἀντιπατρίδα
  choice: wọ́n sì gbé e lọ sí Áńtípátírì
  rationale: “Gbé e lọ sí” bá ìrìn sí ibi tí a dárúkọ mu, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ἄγω nínú àyíká yìí.
- source_word: διὰ νυκτός
  choice: ní òru
  rationale: “Ní òru” túmọ̀ àkókò ìrìn náà ní èdè Yorùbá àdánidá, láìdájọ́ pé ìrìn náà gba gbogbo òru.
- source_word: Ἀντιπατρίδα
  choice: Áńtípátírì
  rationale: A kọ orúkọ ibi náà ní ìbámu pẹ̀lú ìró rẹ̀, ní ọ̀nà tí ó bá ìkọ̀wé Yorùbá mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tí ó ti yẹ, a sì tún ètò gbólóhùn ṣe díẹ̀ kí ìbáṣepọ̀ àṣẹ àti ìṣe àwọn ọmọ ogun náà ṣe kedere láìyí ìtumọ̀ orísun padà.
