id: ACT.23.11
reference: Acts 23:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: yo
  text: Ṣùgbọ́n ní òru tí ó tẹ̀ lé e, Olúwa dúró lẹ́gbẹ̀ẹ́ rẹ̀, ó sì wí pé, “Máa ní ìgboyà[a], nítorí gẹ́gẹ́ bí o ti jẹ́rìí nípa mi ní Jerúsálẹ́mù, bẹ́ẹ̀ náà ni o gbọdọ̀ jẹ́rìí[b] ní Róòmù pẹ̀lú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mú ọkàn le.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jẹ́ ẹlẹ́rìí.” Ọ̀rọ̀-ìṣe méjèèjì fún ohun tí Paulu ti sọ àti ohun tí yóò sọ lọ́jọ́ iwájú wá láti inú ìdílé ọ̀rọ̀ kan náà ní Gíríìkì, èyí tó ní í ṣe pẹ̀lú ẹ̀rí tàbí jíjẹ́rìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Ṣùgbọ́n ní òru tí ó tẹ̀ lé e
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí òru tí ó tẹ̀ lé ọjọ́ náà. “Ṣùgbọ́n” fi ìlọsíwájú ìtàn àti agbára ìsopọ̀ δέ hàn láìsọ ìtakora di líle ju bó ṣe rí lọ.
- source_word: ἐπιστὰς αὐτῷ
  choice: dúró lẹ́gbẹ̀ẹ́ rẹ̀
  rationale: Ó pa àwòrán Olúwa tí ó wá dúró nítòsí Paulu mọ́, ó sì yẹra fún fífi ìtumọ̀ àfikún bí “farahàn” sínú ọ̀rọ̀ náà.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ọ̀nà àdánidá àti ọ̀wọ̀ fún κύριος ní àyíká ìtàn yìí, láìfi “Jésù” kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: Θάρσει
  choice: Máa ní ìgboyà
  rationale: Ó sọ àṣẹ ìṣírí náà ní Yorùbá òde òní tí ó ṣe kedere, ó sì bá ìtumọ̀ pé kí Paulu ní ìgboyà mu.
- source_word: διεμαρτύρω
  choice: o ti jẹ́rìí
  rationale: Àmì “ti” fi iṣẹ́ tí Paulu ti ṣe ní Jerúsálẹ́mù hàn, “jẹ́rìí” sì pa ìbátan rẹ̀ mọ́ pẹ̀lú μαρτυρῆσαι tó wà lẹ́yìn.
- source_word: τὰ περὶ ἐμοῦ
  choice: nípa mi
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn ohun tó kan ẹni tí ń sọ̀rọ̀, láìdi gbólóhùn náà mọ́lẹ̀ ju bó ṣe yẹ lọ.
- source_word: εἰς Ἰερουσαλήμ
  choice: ní Jerúsálẹ́mù
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń tọ́ka sí ìlọ sí ibì kan, níhìn-ín ó tọ́ka sí ibi tí ẹ̀rí tí a ti sọ ti ṣẹlẹ̀; “ní” ni Yorùbá àdánidá.
- source_word: οὕτω
  choice: bẹ́ẹ̀ náà
  rationale: Ó fi ìbámu tó wà láàárín jíjẹ́rìí ní Jerúsálẹ́mù àti jíjẹ́rìí ní Róòmù hàn.
- source_word: σε δεῖ
  choice: o gbọdọ̀
  rationale: Ó fi dandan tí δεῖ ní hàn kedere, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí dandan náà yóò gbà ṣẹ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: καὶ εἰς Ῥώμην
  choice: ní Róòmù pẹ̀lú
  rationale: “Pẹ̀lú” fi Róòmù kún Jerúsálẹ́mù gẹ́gẹ́ bí ibi mìíràn tí Paulu yóò ti jẹ́rìí.
- source_word: μαρτυρῆσαι
  choice: jẹ́rìí
  rationale: Lílo ọ̀rọ̀ kan náà pẹ̀lú διεμαρτύρω mú ìbátan ọ̀rọ̀ ẹ̀rí/jíjẹ́rìí inú Gíríìkì wá sí Yorùbá.
theological_decisions:
- issue: Ta ni ὁ κύριος ń tọ́ka sí nínú ìtàn náà?
  choice: A túmọ̀ ọ́ sí “Olúwa,” ní fífi ọ̀rọ̀ Gíríìkì náà sílẹ̀ gẹ́gẹ́ bí ó ṣe rí.
  alternative: “Olúwa Jésù” lè sọ ẹni tí a ń tọ́ka sí ní pàtó sí i.
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì àti ọ̀rọ̀ “nípa mi” tọ́ka sí Jésù tó jíǹde, ṣùgbọ́n fífi “Jésù” kún un yóò kọjá ohun tí ẹsẹ náà sọ ní tààrà.
- issue: Agbára δεῖ
  choice: “o gbọdọ̀,” èyí tó fi dandan hàn láìsọ ọ̀nà tí dandan náà gbà wá.
  alternative: “ó ṣe pàtàkì pé kí o” tàbí “a ti yàn ọ́ sí i.”
  rationale: Nínú Ìṣe, δεῖ lè fi dandan tó bá ète Ọlọ́run mu hàn. “O gbọdọ̀” pa agbára náà mọ́ láìyí i padà sí ẹ̀kọ́ ayànmọ́ tó lágbára ju ọ̀rọ̀ náà lọ.
translation_notes:
  register: Yorùbá àpéjọ, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìfọ̀rọ̀wérọ̀ ìṣírí mọ́, ó sì lò “jẹ́rìí” ní ìgbà méjèèjì láti fi ìbátan ọ̀rọ̀ inú Gíríìkì hàn.
