  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa nípa ìpín ẹgbẹ́ méjèèjì, ìkéde Pọ́ọ̀lù, ìdílé Farisí, àti ìkọ̀lé passive ti κρίνομαι. Síbẹ̀, “Nítorí” sábà ń fi ìdí tàbí ìfa-hàn sílẹ̀ ní Yorùbá, níbi tí περὶ ti ń ṣàfihàn kókó ẹjọ́ náà: “ní ti.” Bákan náà, ἐν τῷ συνεδρίῳ túmọ̀ sí pé ó wà nínú ìgbìmọ̀ náà, kì í ṣe dandan pé ó wà “ní àárín” rẹ̀.'
