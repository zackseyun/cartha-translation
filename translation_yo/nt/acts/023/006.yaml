  to: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù mọ̀ pé apá kan jẹ́ ti àwọn Sadusí, tí apá kejì sì jẹ́ ti àwọn Farisí, ó ké jáde ní ìgbìmọ̀ náà[a] pé, “Ẹ̀yin ọkùnrin ará mi, Farisí ni mí, ọmọ àwọn Farisí ni mí.[b] Ní ti ìrètí àti àjíǹde àwọn òkú[c] ni a ṣe ń dá mi lẹ́jọ́.”
