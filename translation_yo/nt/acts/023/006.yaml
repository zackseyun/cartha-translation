id: ACT.23.6
reference: Acts 23:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù mọ̀ pé apá kan jẹ́ ti àwọn Sadusí, tí apá kejì sì jẹ́ ti àwọn Farisí, ó ké jáde ní ìgbìmọ̀ náà[a] pé, “Ẹ̀yin ọkùnrin ará mi, Farisí ni mí, ọmọ àwọn Farisí ni mí.[b] Ní ti ìrètí àti àjíǹde àwọn òkú[c] ni a ṣe ń dá mi lẹ́jọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní Sanhedrin.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí ìgbìmọ̀ aláṣẹ àwọn Júù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọmọ àwọn òbí Farisí” tàbí “àtọmọdọ́mọ àwọn Farisí.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “Ní ti ìrètí àjíǹde àwọn òkú ni a ṣe ń dá mi lẹ́jọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: nígbà tí ... mọ̀
  rationale: Ó fi iṣẹ́ àbọ̀ aorist hàn gẹ́gẹ́ bí ipò tó ṣáájú ohun tí Pọ́ọ̀lù ṣe, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: apá kan ... apá kejì
  rationale: Èyí pa àwòrán ìpín inú àpéjọ náà mọ́, ó sì ṣe kedere ní Yorùbá.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: àwọn Sadusí / àwọn Farisí
  rationale: Àwọn wọ̀nyí ni orúkọ tí a sábà máa ń lò ní Yorùbá fún àwọn ẹgbẹ́ Júù méjèèjì.
- source_word: ἔκραζεν
  choice: ó ké jáde
  rationale: Ó fi hàn pé Pọ́ọ̀lù gbé ohùn sókè ní gbangba, láìsọ ọ́ di ọ̀rọ̀ ojoojúmọ́ jù.
- source_word: ἐν τῷ συνεδρίῳ
  choice: ní àárín ìgbìmọ̀ náà
  rationale: Ó tú συνέδριον sí èdè tí òǹkàwé òde òní lè lóye, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí Sanhedrin gẹ́gẹ́ bí orúkọ pàtó.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ọkùnrin ará mi
  rationale: Ó pa ìtọ́kasí ἄνδρες àti ìbátan ἀδελφοί méjèèjì mọ́ ní ọ̀nà tó bá ìpè Yorùbá mu.
- source_word: Φαρισαῖός εἰμι
  choice: Farisí ni mí
  rationale: Ìtumọ̀ tààrà ni fún bí Pọ́ọ̀lù ṣe fi ara rẹ̀ hàn ní àsìkò ìsinsìnyí.
- source_word: υἱὸς Φαρισαίων
  choice: ọmọ àwọn Farisí ni mí
  rationale: Ó pa ọ̀rọ̀ àfiwé ìdílé àti ọ̀pọ̀ Φαρισαίων mọ́, láìfi dandan pinnu bóyá àwọn òbí, àwọn baba ńlá, tàbí ìbátan ẹgbẹ́ ni a ń tọ́ka sí.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: Nítorí ìrètí àti àjíǹde àwọn òkú
  rationale: Ó pa ìsopọ̀ pẹ̀lú καί mọ́, kí ìrètí àti àjíǹde lè dúró gẹ́gẹ́ bí ohun méjì tó sún mọ́ra, láìfipá sọ wọ́n di èrò kan ṣoṣo.
- source_word: κρίνομαι
  choice: ni a ṣe ń dá mi lẹ́jọ́
  rationale: Ìkọ̀lé yìí fi ipò ìdájọ́ tí ó ń lọ lọ́wọ́ àti ohùn àìṣe ti ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù, υἱὸς Φαρισαίων
  choice: “ọmọ àwọn Farisí” ni a fi sí ọ̀rọ̀ pàtàkì.
  alternative: “ọmọ àwọn òbí Farisí” tàbí “àtọmọdọ́mọ àwọn Farisí.”
  rationale: Ọ̀pọ̀ nínú Gíríìkì àti àkànlò ọmọ lè tọ́ka sí òbí tàbí ìran. Ìtumọ̀ pàtàkì kò fi dandan yan ọ̀kan nínú wọn.
- issue: Ìbáṣepọ̀ tó wà láàárín “ìrètí” àti “àjíǹde”
  choice: “ìrètí àti àjíǹde àwọn òkú” ni a lò.
  alternative: “ìrètí àjíǹde àwọn òkú.”
  rationale: Gíríìkì so ἐλπίδος àti ἀναστάσεως pọ̀ pẹ̀lú καί. Ìtumọ̀ yìí pa àìdánilójú mọ́ bóyá ohun méjì tó jọra ni tàbí ìrètí kan tí àjíǹde jẹ́ àfojúsùn rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A pa ìfọ̀rọ̀wérọ̀ ti gbólóhùn Gíríìkì mọ́ níbi tí ó ti ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
