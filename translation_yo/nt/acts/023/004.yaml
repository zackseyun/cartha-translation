  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: yo
  text: Àwọn tí ó dúró nítòsí sì wí pé, “Ṣé o ń gàn[a] olórí àlùfáà Ọlọ́run?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé o ń sọ̀rọ̀ ẹ̀gàn sí olórí àlùfáà Ọlọ́run?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Àwọn tí ó dúró nítòsí sì
  rationale: Ọ̀rọ̀ alábápín tí a fi àpilẹ̀kọ ṣe ń tọ́ka sí àwọn ènìyàn tí wọ́n dúró lẹ́gbẹ̀ẹ́ Pọ́ọ̀lù; ‘dúró nítòsí’ pa ìtumọ̀ ibi tí παρίστημι ní mọ́ ní Yorùbá àdánidá.
- source_word: εἶπαν
  choice: wí pé
  rationale: Aorist indicative náà ń tẹ ìtàn síwájú pẹ̀lú ìṣe tó ṣẹlẹ̀ lẹ́ẹ̀kan; ‘wí pé’ jẹ́ ọ̀nà Yorùbá tó bójú mu láti ṣáájú ọ̀rọ̀ taara.
- source_word: ἀρχιερέα
  choice: olórí àlùfáà
  rationale: Ní àyíká yìí, ἀρχιερεύς ń tọ́ka sí olórí àlùfáà àwọn Júù; èyí ni ìtumọ̀ Yorùbá tó ṣe kedere tí ó sì ti wọ́pọ̀.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀kan genitive náà ń sọ ìbáṣepọ̀ ipò olórí àlùfáà pẹ̀lú Ọlọ́run; ‘olórí àlùfáà Ọlọ́run’ jẹ́ kíkún tó ṣe àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: λοιδορεῖς
  choice: ń gàn
  rationale: λοιδορέω túmọ̀ sí sísọ̀rọ̀ ẹ̀gàn tàbí ìkórìíra sí ẹnì kan. ‘ń gàn’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tó sì bá agbára ìbéèrè ìbáwí náà mu.
theological_decisions:
- issue: Agbára τοῦ θεοῦ nínú ìtọ́ka sí olórí àlùfáà
  choice: olórí àlùfáà Ọlọ́run
  alternative: olórí àlùfáà ti Ọlọ́run
  rationale: Gbólóhùn náà ń dá ipò iṣẹ́ náà mọ̀ ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run, ṣùgbọ́n kò fi dandan sọ pé Ọlọ́run fọwọ́ sí gbogbo ìwà ẹni tó wà ní ipò náà. Ìtumọ̀ náà kò gbé ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ wọlé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; ‘Ṣé … ni?’ mú ìbéèrè ìbáwí inú Gíríìkì jáde lọ́nà àdánidá.
