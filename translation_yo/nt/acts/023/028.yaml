source:
  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: yo
  text: Láti mọ ẹ̀sùn tí wọ́n ń fi kàn án, mo sì mú un sọ̀kalẹ̀ sí ìgbìmọ̀ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Sànhẹ́dírìn wọn.” Ọ̀rọ̀ Gíríìkì συνέδριον túmọ̀ sí ìgbìmọ̀; ní àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí ìgbìmọ̀ alákóso àwọn Júù ní Jerúsálẹ́mù.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: bí mo sì ti fẹ́
  rationale: Ó fi ìfẹ́ àti ète Lísíà hàn lọ́nà àdánidá nínú Yorùbá.
- source_word: τε
  choice: sì
  rationale: Ó so gbólóhùn yìí mọ́ ohun tó ṣáájú rẹ̀ pẹ̀lú àsopọ̀ fẹ́lẹ́fẹ́lẹ́.
- source_word: ἐπιγνῶναι
  choice: mọ
  rationale: Ó sọ ète náà ní kedere láìfi ìtumọ̀ tí kò pọndandan kún un.
- source_word: τὴν αἰτίαν
  choice: ẹ̀sùn
  rationale: Nínú àyíká òfin yìí, ọ̀rọ̀ náà tọ́ka sí ẹ̀sùn tàbí ìpìlẹ̀ tí wọ́n fi ń fẹ̀sùn kàn Pọ́ọ̀lù.
- source_word: δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: tí wọ́n fi ń fẹ̀sùn kàn án
  rationale: Ìtumọ̀ yìí mú ìbáṣepọ̀ ìdí àti ẹ̀sùn jáde, ó sì pa ìṣe tó ń lọ lọ́wọ́ nínú imperfect mọ́.
- source_word: κατήγαγον
  choice: mo mú un sọ̀ kalẹ̀ lọ
  rationale: Ó pa ìtọ́kasí ìrìn sí ibi ìsàlẹ̀ nínú ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ó lè jẹ́ ìsọ̀rọ̀ ibi.
- source_word: συνέδριον
  choice: ìgbìmọ̀
  rationale: Ó túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ẹgbẹ́ alákóso tí ń jókòó láti gbọ́ ọ̀ràn, láìfi orúkọ àṣà kan lé e lórí.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ó tọ́ka tààrà sí ìgbìmọ̀ àwọn olùfisùn tí a ti ń sọ̀rọ̀ nípa wọn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti ìròyìn òfin, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “ìgbìmọ̀” nínú àyọkà, a sì fi “Sànhẹ́dírìn” sí àlàyé ìsàlẹ̀ láti pa ààyè ìtumọ̀ συνέδριον mọ́.
