revisions:
- from: Níwọ̀n bí mo sì ti fẹ́ mọ ẹ̀sùn tí wọ́n fi ń fẹ̀sùn kàn án[a], mo mú un sọ̀ kalẹ̀ lọ sí ìgbìmọ̀ wọn.
  to: Láti mọ ẹ̀sùn tí wọ́n ń fi kàn án, mo sì mú un sọ̀kalẹ̀ sí ìgbìmọ̀ wọn.[a]
  rationale: “Láti mọ” directly expresses the motive/purpose supplied by βουλόμενος ἐπιγνῶναι without adding the causal and prior-completion sense of “Níwọ̀n bí ... ti fẹ́.” “Ẹ̀sùn tí wọ́n ń fi kàn án” keeps the legal force of αἰτία and the imperfect sense of ἐνεκάλουν without the awkward repetition of fẹ̀sùn. “Mú un sọ̀kalẹ̀ sí” is a concise, natural rendering of κατήγαγον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal accusation, the continuing accusations (ń fẹ̀sùn kàn), and the destination as the accusers’ council. However, “Níwọ̀n bí mo sì ti fẹ́ mọ” is causal (“since/because I had wanted to know”) and the particle “ti” can imply prior completion; this does not represent the Greek participle’s contemporaneous motive as well as a purpose construction does. “sọ̀ kalẹ̀ lọ sí” is also unnecessarily cumbersome for κατήγαγον.
  naturalness: The revised wording is idiomatic Standard Yoruba, preserves a formal legal-report register, and avoids the causal and aspectual implications of the opening in the draft.
  terminology: “Ẹ̀sùn” is suitable for αἰτία in this forensic context, while “ìgbìmọ̀ wọn” renders συνέδριον αὐτῶν without over-specifying it. The Sanhedrin alternative is appropriately retained in the footnote.
  issues:
  - severity: medium
    issue: The opening “Níwọ̀n bí mo sì ti fẹ́ mọ” makes Lysias’s desire sound like a causal, prior-completed action.
    rationale: βουλόμενος introduces his motive/purpose in relation to bringing Paul down. A Yoruba purpose expression more faithfully retains that relation.
  - severity: low
    issue: “mo mú un sọ̀ kalẹ̀ lọ sí” is redundant and somewhat awkward.
    rationale: “Mú un sọ̀kalẹ̀ sí” naturally conveys κατήγαγον while retaining the directional ‘down’ element.
  revised_text: Láti mọ ẹ̀sùn tí wọ́n ń fi kàn án, mo sì mú un sọ̀kalẹ̀ sí ìgbìmọ̀ wọn.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “Sànhẹ́dírìn wọn.” Ọ̀rọ̀ Gíríìkì συνέδριον túmọ̀ sí ìgbìmọ̀; ní àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí ìgbìmọ̀ alákóso àwọn Júù ní Jerúsálẹ́mù.
    reason: lexical_alternative
  revision_rationale: “Láti mọ” directly expresses the motive/purpose supplied by βουλόμενος ἐπιγνῶναι without adding the causal and prior-completion sense of “Níwọ̀n bí ... ti fẹ́.” “Ẹ̀sùn tí wọ́n ń fi kàn án” keeps the legal force of αἰτία and the imperfect sense of ἐνεκάλουν without the awkward repetition of fẹ̀sùn. “Mú un sọ̀kalẹ̀ sí” is a concise, natural rendering of κατήγαγον.
