id: ACT.23.14
reference: Acts 23:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: yo
  text: Àwọn ọkùnrin wọ̀nyí lọ bá àwọn olórí àlùfáà àti àwọn àgbààgbà, wọ́n sì wí pé, “Àwa ti fi ara wa sábẹ́ ìbúra ègún[a] pé a kì yóò tọ́ ohun kankan wò títí a ó fi pa Paulu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì, “Àwa ti fi ègún bú ara wa.” Ọ̀rọ̀ Gíríìkì náà ń fi ìbúra tí àwọn tó búra fi ń pe ègún sórí ara wọn hàn bí wọn kò bá mú un ṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn ọkùnrin wọ̀nyí
  rationale: Ó tọ́ka sí àwọn tí wọ́n dìtẹ̀ nínú ẹsẹ tó ṣáájú; ọ̀rọ̀ yìí mú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ hàn kedere ní Yorùbá.
- source_word: προσελθόντες
  choice: tọ ... lọ
  rationale: Aorist participle náà sọ ìṣe tó ṣẹlẹ̀ ṣáájú ‘wọ́n sọ’; ‘tọ ... lọ’ jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n lọ bá àwọn olórí náà.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: àwọn olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹgbẹ́ àwọn aṣáájú àlùfáà Júù, kì í ṣe ọ̀pọ̀ ‘àlùfáà àgbà’ lọ́nà gangan.
- source_word: τοῖς πρεσβυτέροις
  choice: àwọn àgbààgbà
  rationale: Ní àyíká yìí, ó túmọ̀ sí àwọn aṣáájú tí a dá mọ̀, kì í ṣe kìkì àwọn ẹni tó dàgbà.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Àwa ti fi ara wa sábẹ́ ègún
  rationale: Àkópọ̀ orúkọ àti ọ̀rọ̀-ìṣe tó jọ ara wọn ń tẹnu mọ́ ìbúra tí ẹni fi ń pe ègún sórí ara rẹ̀; ìtumọ̀ yìí ṣe kedere láìlo ọ̀rọ̀ ẹ̀kọ́ ìjọ ti ìgbà tó wá lẹ́yìn.
- source_word: μηδενὸς γεύσασθαι
  choice: a kò ní tọ́ ohunkóhun wò
  rationale: Ó pa ìtumọ̀ gangan ‘tọ́ ohunkóhun wò’ mọ́, ó sì fi ìfàsẹ́yìn pátápátá hàn.
- source_word: ἕως οὗ
  choice: títí ... fi
  rationale: Èyí jẹ́ ìsopọ̀ àsìkò Yorùbá tó bá ààlà ìbúra náà mu.
- source_word: ἀποκτείνωμεν
  choice: a ó ... pa
  rationale: Ó sọ ìṣẹ̀lẹ̀ tí wọ́n ń pinnu ní tààrà, láìfi ìdájọ́ òfin tàbí ti ìwà kún ọ̀rọ̀ náà.
- source_word: τὸν Παῦλον
  choice: Paulu
  rationale: Ìkọ̀wé orúkọ Παῦλος ní ìlànà Yorùbá Bíbélì tó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ àgbékalẹ̀ ìbúra Ἀναθέματι ἀνεθεματίσαμεν ἑαυτούς
  choice: Àwa ti fi ara wa sábẹ́ ègún
  alternative: Àwa ti fi ìbúra líle de ara wa
  rationale: Èyí pa agbára ìbúra tí wọ́n fi ń pe ègún sórí ara wọn mọ́, láìyí i sí ‘anathema’ gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ ìjọ ti ìgbà tó wá lẹ́yìn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. A lo ‘àwa’ láti tẹnu mọ́ ẹni tó ń búra, bí àgbékalẹ̀ Gíríìkì ṣe lágbára.
