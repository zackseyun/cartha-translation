id: ACT.23.1
reference: Acts 23:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: yo
  text: Pọ́ọ̀lù sì tẹjú mọ́ ìgbìmọ̀ náà, ó ní, “Ẹ̀yin ará, mo ti hùwà níwájú Ọlọ́run pẹ̀lú ẹ̀rí-ọkàn rere pátápátá títí di òní yìí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ti gbé ìgbé ayé bí ọmọ ìlú níwájú Ọlọ́run,” láti pa ìfarahàn ti ọmọ ìlú inú ọ̀rọ̀ Gíríìkì náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: tẹjú mọ́
  rationale: Ó fi ìwò tí a darí sí ohun kan, tí ó sì dúró ṣinṣin hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ pẹ̀lẹ́ ni δέ níbí, tí ó ń tẹ ìtàn náà síwájú.
- source_word: τῷ συνεδρίῳ
  choice: ìgbìmọ̀ náà
  rationale: Ó tú ọ̀rọ̀ orúkọ àpapọ̀ fún ìgbìmọ̀ aṣáájú àwọn Júù ní àyíká yìí láìfi orúkọ àyálò ‘Sànhẹ́dírìn’ kún un.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ìpè tààrà tí ó bá èdè Yorùbá mu ni; àyíká fi hàn pé àwọn ọkùnrin inú ìgbìmọ̀ ni a ń bá sọ̀rọ̀.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: pẹ̀lú ẹ̀rí-ọkàn rere pátápátá
  rationale: ‘Pátápátá’ pa agbára πάσῃ mọ́, ‘ẹ̀rí-ọkàn rere’ sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún συνείδησις ἀγαθή.
- source_word: πεπολίτευμαι
  choice: mo ti hùwà
  rationale: Ó sọ ìwà àti ìlànà ìgbésí ayé ẹni ní àkókò tí ó kọjá títí dé ìsinsìnyí, láìsọ ọ́ di ẹ̀sùn ìlú tàbí ipò ọmọ ìlú nìkan.
- source_word: τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Ó fi ìgbésí ayé tí a ń gbé lábẹ́ ojú àti ìdájọ́ Ọlọ́run hàn, ó sì bá ọ̀rọ̀ ẹ̀rí-ọkàn mu.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: títí di òní yìí
  rationale: Ó pa ìtẹ̀síwájú láti ìgbà àtijọ́ dé ọjọ́ tí Pọ́ọ̀lù ń sọ̀rọ̀ mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ àpèjúwe ara Pọ́ọ̀lù pẹ̀lú πεπολίτευμαι
  choice: Gbólóhùn nípa bí ó ti ń hùwà níwájú Ọlọ́run pẹ̀lú ẹ̀rí-ọkàn rere
  alternative: “Mo ti gbé ìgbé ayé bí ọmọ ìlú níwájú Ọlọ́run,” tàbí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹ̀sùn pé kò dẹ́ṣẹ̀ rárá
  rationale: Ọ̀rọ̀ náà lè ní ìfarahàn ti ọmọ ìlú, ṣùgbọ́n àyíká tẹnu mọ́ ìwà àti ẹ̀rí-ọkàn. Ìtumọ̀ yìí kò sọ pé Pọ́ọ̀lù ń kéde àìlẹ́ṣẹ̀ pípé, bẹ́ẹ̀ ni kò pa àṣírí ìfarahàn ti ọmọ ìlú rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmi ohùn ní kíkún níbi tí ó yẹ. A yà àmì àlàyé [a] sí òpin gbólóhùn tí ó kan pé kí ó má bà a dà bí ẹni pé ó ń ṣàlàyé orúkọ Pọ́ọ̀lù.
