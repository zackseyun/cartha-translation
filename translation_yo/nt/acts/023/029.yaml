  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ gbogbogbò Gíríìkì náà dáradára: ẹni náà ń gba ẹ̀sùn, ẹ̀sùn náà sì ní í ṣe pẹ̀lú àwọn ọ̀ràn tí wọ́n ń jiyàn lórí òfin wọn; kò sì sí ẹ̀sùn tó yẹ ìjìyà ikú tàbí ìdè. Síbẹ̀, “nítorí” sábà máa ń túmọ̀ sí ‘because of,’ ó sì lè fi ìdí tàbí ohun tí ó fa ẹ̀sùn hàn, dípò ‘concerning/about’ fún περὶ. “Nípa” ni ó tọ́ sí ìbáṣepọ̀ ọ̀rọ̀ náà.'
