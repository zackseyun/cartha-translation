  to: Mo rí i pé wọ́n ń fẹ̀sùn kàn án nípa àwọn ọ̀ràn àríyànjiyàn nípa òfin wọn,[a] ṣùgbọ́n kò sí ẹ̀sùn kankan tí wọ́n fi kàn án tó yẹ fún ikú tàbí ìdè.[b]
  rationale: A rọ́pò “nítorí” pẹ̀lú “nípa” nínú ọ̀rọ̀ àti àlàyé ìsàlẹ̀ a, kí ìtumọ̀ περὶ (‘concerning/about’) má bàa di ìtumọ̀ ìdí (‘because of’). Gbogbo ìyókù ni a dá sílẹ̀ nítorí ó jẹ́ olóòtọ́ sí orísun, ó sì jẹ́ Yorùbá àdánidá.
