  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: yo
  text: Mo rí i pé wọ́n ń fẹ̀sùn kàn án nípa àwọn ọ̀ràn àríyànjiyàn nípa òfin wọn,[a] ṣùgbọ́n kò sí ẹ̀sùn kankan tí wọ́n fi kàn án tó yẹ fún ikú tàbí ìdè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa àwọn ìbéèrè nípa òfin wọn.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “tó yẹ fún ikú tàbí àwọn ìdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: Mo rí i pé
  rationale: Ó sọ ìpinnu tí olórí ogun dé sí lẹ́yìn tó ṣàyẹ̀wò ọ̀ràn náà, ó sì bá ìtumọ̀ εὗρον mu ní èdè Yorùbá àdánidá.
- source_word: ἐγκαλούμενον
  choice: wọ́n ń fẹ̀sùn kàn án
  rationale: Àpólà yìí pa ìṣe tí a ń ṣe sí i mọ́, ó sì fi hàn pé àwọn kan ń mú ẹ̀sùn wá sí i láìsọ pé a ti dá a lẹ́bi.
- source_word: περὶ ζητημάτων
  choice: nítorí àwọn ọ̀ràn àríyànjiyàn nípa
  rationale: ζητήματα lè túmọ̀ sí àwọn ìbéèrè tàbí ọ̀ràn tí àwọn ènìyàn ń jiyàn lé lórí; yíyan yìí pa ìtumọ̀ àríyànjiyàn náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: τοῦ νόμου αὐτῶν
  choice: òfin wọn
  rationale: Ó pa ojú ìwòye olórí ogun Róòmù àti ọ̀rọ̀ arọ́pò-orúkọ αὐτῶν, ‘wọn,’ mọ́.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: kò sí ... kankan ... tó yẹ fún ikú tàbí ìdè
  rationale: ‘Ìdè’ sun mọ́ δεσμῶν, tó túmọ̀ ní tààrà sí ìdè tàbí ẹ̀wọ̀n, ó sì lè tọ́ka sí jíjẹ́ ẹlẹ́wọ̀n nínú ọ̀rọ̀ ìdájọ́.
- source_word: ἔχοντα ἔγκλημα
  choice: ẹ̀sùn ... tí wọ́n fi kàn án
  rationale: Ó sọ ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní Yorùbá àdánidá, láìfi hàn pé a ti dá a lẹ́bi.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá òde òní tó níyì ni a lò, pẹ̀lú àmì ohùn ní ibi tó bá yẹ. A lo ‘àwọn ọ̀ràn àríyànjiyàn’ láti mú agbára ζητήματα jáde, nígbà tí àlàyé ìsàlẹ̀ fún àṣàyàn ‘àwọn ìbéèrè.’ ‘Ìdè’ pa àwòrán δεσμῶν mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé ìtumọ̀ rẹ̀ ní tààrà.
