  to: Nísinsin yìí, nítorí náà, ẹ̀yin pẹ̀lú ìgbìmọ̀ náà, ẹ jẹ́ kí olórí ọmọ ogun náà mọ̀, kí ó mú un sọ̀ kalẹ̀ wá sí ọ̀dọ̀ yín[a], bí ẹni pé ẹ fẹ́ ṣàyẹ̀wò ọ̀ràn rẹ̀ dáadáa sí i[b]. Ṣùgbọ́n àwa ti múra tán láti pa á kí ó tó dé sí ibẹ̀[c].
  rationale: Àtúnṣe náà yọ “wa” kúrò nínú ìpínrẹ́rẹ́ kí ó má bàa fi aláǹfààní tàbí ibi ìsúnmọ́ kan tí Gíríìkì kò sọ kún un. “Dé sí ibẹ̀” ń jẹ́ kí ìtọ́ka ibi náà wà ní àìmọ̀ gẹ́gẹ́ bí ìpilẹ̀ṣẹ̀, nígbà tí àlàyé ẹsẹ̀ isàlẹ̀ ń pa ìmọ̀ “sún mọ́” mọ́. A tún ṣe ìṣètò díẹ̀ fún ìṣàn Yorùbá, láì yi ìtumọ̀ tàbí ìforúkọsílẹ̀ ẹsẹ̀ náà padà.
