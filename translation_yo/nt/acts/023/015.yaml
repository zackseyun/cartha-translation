source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: yo
  text: Nísinsin yìí, nítorí náà, ẹ̀yin pẹ̀lú ìgbìmọ̀ náà, ẹ jẹ́ kí olórí ọmọ ogun náà mọ̀, kí ó mú un sọ̀ kalẹ̀ wá sí ọ̀dọ̀ yín[a], bí ẹni pé ẹ fẹ́ ṣàyẹ̀wò ọ̀ràn rẹ̀ dáadáa sí i[b]. Ṣùgbọ́n àwa ti múra tán láti pa á kí ó tó dé sí ibẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó mú un wá síwájú yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ mímú ẹni kan sọ̀ kalẹ̀ nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí ẹni pé ẹ fẹ́ ṣe ìwádìí ọ̀ràn rẹ̀ dáadáa sí i.” Ọ̀nà tí a gbà sọ ọ́ fi hàn pé wọ́n ń díbọ́n pé wọ́n fẹ́ tún ọ̀ràn náà yẹ̀ wò.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ó tó sún mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: ẹ jẹ́ kí ... mọ̀
  rationale: Ó ṣe àfihàn àṣẹ láti sọ ọ̀rọ̀ náà di mímọ̀ fún aláṣẹ, láì fi kún un pé ìbéèrè lásán ni.
- source_word: χιλιάρχῳ
  choice: olórí ọmọ ogun
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ipò olórí ọmọ ogun Róòmù, láì lo orúkọ ipò àjèjì tó le ṣòro fún òǹkàwé.
- source_word: σὺν τῷ συνεδρίῳ
  choice: pẹ̀lú ìgbìmọ̀ náà
  rationale: “Pẹ̀lú” pa ìtumọ̀ ìbáṣepọ̀ σύν mọ́, “ìgbìmọ̀ náà” sì tọ́ka sí ẹgbẹ́ alákòóso tí a ti mọ̀ nínú àyíká ọ̀rọ̀.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: kí ó mú un sọ̀ kalẹ̀ tọ̀ yín wá
  rationale: Ọ̀rọ̀ yìí pa ìtọ́sọ́nà “sọ̀ kalẹ̀” inú κατάγω mọ́, ó sì sọ ibi tí wọ́n fẹ́ mú un dé kedere.
- source_word: ὡς μέλλοντας
  choice: bí ẹni pé ẹ fẹ́
  rationale: Ó pa ìrísí ète tí wọ́n ń fi hàn mọ́, láì sọ ìtànjẹ náà ní ọ̀nà tó lágbára ju ohun tí Gíríìkì sọ lọ.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: ṣàyẹ̀wò ... dáadáa sí i
  rationale: “Ṣàyẹ̀wò” bá àyíká ìwádìí ọ̀ràn mu, “dáadáa sí i” sì pa ìfiwéra ἀκριβέστερον mọ́ ní Yorùbá àdánidá.
- source_word: τὰ περὶ αὐτοῦ
  choice: ọ̀ràn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún àwọn ohun tó jẹ mọ́ ọ, pàápàá nínú àyíká ìgbẹ́jọ́.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: kí ó tó sún mọ́ wa
  rationale: Ó pa ìtumọ̀ àkókò “kí ... tó” àti ìtumọ̀ àyè “sún mọ́” mọ́.
- source_word: ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν
  choice: àwa ti múra tán láti pa á
  rationale: Ó túmọ̀ ìmúrasílẹ̀ àti ète pípa náà ní tààràtà, láì fi ìdájọ́ ìwà míì kún ọ̀rọ̀-ìṣe náà.
