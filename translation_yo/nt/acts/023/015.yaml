translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìtànjẹ tí gbolohun ὡς μέλλοντας túmọ̀ sí mọ́ láì ṣe àfikún ẹ̀kọ́ ìsìn.
