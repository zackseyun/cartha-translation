id: ACT.23.5
reference: Acts 23:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: yo
  text: Pọ́ọ̀lù sì wí pé, “Èmi kò mọ̀, ẹ̀yin ará, pé òun ni olórí àlùfáà; nítorí a ti kọ ọ́ sílẹ̀ pé, ‘Ìwọ kò gbọdọ̀ sọ̀rọ̀ burúkú nípa olórí àwọn ènìyàn rẹ.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ kò gbọdọ̀ gàn olórí àwọn ènìyàn rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Pọ́ọ̀lù sì wí pé
  rationale: ‘Sì’ fi ìsopọ̀ tẹ́lẹ̀ hàn láì fi agbára tí τέ kò ní kún un; ‘wí pé’ jẹ́ ọ̀nà Yorùbá tí ó bójú mu láti bẹ̀rẹ̀ ọ̀rọ̀ tààrà.
- source_word: Οὐκ ᾔδειν
  choice: Èmi kò mọ̀
  rationale: Ó túmọ̀ ìmọ̀ tàbí àìmọ̀ ní tààrà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ìpè Yorùbá tí ó wọ́pọ̀ fún àwọn tí wọ́n jẹ́ arákùnrin tàbí alábàáṣiṣẹ́pọ̀ nínú àwùjọ; àyíká ìgbìmọ̀ yìí ṣì fi hàn pé àwọn ọkùnrin ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: pé òun ni olórí àlùfáà
  rationale: ‘Ni’ kò ní àkókò gírámà nínú Yorùbá, nítorí náà ó lè ṣàfihàn ἐστίν ní ti ẹ̀dá láì fi ‘jẹ́’ tàbí ‘jẹ́ nígbà náà’ yanju àríyànjiyàn àkókò náà.
- source_word: γέγραπται γὰρ
  choice: nítorí a ti kọ ọ́ pé
  rationale: Ìtumọ̀ yìí pa ọ̀nà ìtọ́kasí ohun tí a kọ sínú Ìwé Mímọ́ mọ́, ó sì fi ipa perfect passive hàn ní Yorùbá tó rọrùn.
- source_word: Ἄρχοντα
  choice: olórí
  rationale: ‘Olórí’ jẹ́ ọ̀rọ̀ Yorùbá gbòòrò fún ẹni tí ó ń ṣàkóso tàbí darí, ó sì yẹ fún ìlànà òfin àti ìwà rere inú àyọlò náà.
- source_word: τοῦ λαοῦ σου
  choice: àwọn ènìyàn rẹ
  rationale: Ó pa ìtumọ̀ λαός gẹ́gẹ́ bí àwọn ènìyàn àwùjọ ẹni mọ́ láì yí i sí ‘orílẹ̀-èdè.’
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Ìwọ kò gbọdọ̀ sọ̀rọ̀ burúkú sí
  rationale: Ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ ìdènà. ‘Kò gbọdọ̀’ fi èyí hàn ní Yorùbá òde òní, ‘sọ̀rọ̀ burúkú sí’ sì pa ìtumọ̀ gbòòrò κακῶς mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin
  rationale: ‘Ẹ̀yin ará’ jẹ́ ìpè Yorùbá àdánidá tí kò sọ pé àwọn obìnrin wà nínú àwùjọ náà; àyíká ìgbìmọ̀ ló ń pinnu ẹni tí a ń bá sọ̀rọ̀. ‘Ẹ̀yin arákùnrin’ lè túmọ̀ sí ìbátan ẹ̀jẹ̀ ju bí Gíríìkì ṣe ní lọ.
- issue: Àkókò inú ἐστὶν ní ọ̀rọ̀ Pọ́ọ̀lù
  choice: pé òun ni olórí àlùfáà
  alternative: pé òun ni olórí àlùfáà nígbà náà
  rationale: Copula ‘ni’ ní Yorùbá kò fi àkókò kan pàtó hàn; èyí pa present Gíríìkì mọ́ ní ọ̀nà àdánidá, kò sì mú kí ìtumọ̀ yí sí ohun tó ti kọjá nìkan.
- issue: Bí a ṣe máa gbé àyọlò Ìwé Mímọ́ kalẹ̀
  choice: nítorí a ti kọ ọ́ pé, ‘Ìwọ kò gbọdọ̀ sọ̀rọ̀ burúkú sí olórí àwọn ènìyàn rẹ.’
  alternative: nítorí a ti kọ ọ́ pé, ‘Ìwọ kò gbọdọ̀ gàn olórí àwọn ènìyàn rẹ.’
  rationale: Àṣàyàn àkọ́kọ́ pa àgbègbè ìtumọ̀ κακῶς mọ́, nígbà tí ‘gàn’ jẹ́ àṣàyàn tó le sí i, tó sì lè dín ìtumọ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘olórí àlùfáà’ fún ἀρχιερεύς àti ‘olórí’ fún ἄρχων kí ìyàtọ̀ àwọn ọ̀rọ̀ méjèèjì lè hàn.
