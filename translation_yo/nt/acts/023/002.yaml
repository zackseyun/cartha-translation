translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì, tó ṣe kedere, tí ó sì yé òǹkàwé òde òní. A lo àmì ohùn níbi tí ó yẹ. “Olórí àlùfáà” pa ìtumọ̀ ipò náà mọ́; “lu” sì pa àìsọ pàtó ọ̀nà ìkọlù náà mọ́.
