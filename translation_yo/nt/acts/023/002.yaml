  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní pàtàkì: Ananíà ni olórí àlùfáà, ó pàṣẹ fún àwọn tí wọ́n wà lẹ́gbẹ̀ẹ́ rẹ̀, kí wọ́n sì lu ẹni náà ní ẹnu. Síbẹ̀, fífi “Pọ́ọ̀lù” kún un jẹ́ ìtúmọ̀ àlàyé ju ọ̀rọ̀ orísun lọ, nítorí Gíríìkì lo arọ́pò-orúkọ “rẹ̀/òun” nìkan.'
  naturalness: “Àwọn tí wọ́n dúró lẹ́gbẹ̀ẹ́ rẹ̀” àti “kí wọ́n lù ú ní ẹnu” jẹ́ Yorùbá àgbàṣe, kedere, àti ti ìforúkọsílẹ̀ tó yẹ. Àmì ìdákẹ́gbẹ́ yí Ananíà àti ipò rẹ̀ ká ń jẹ́ kí gbolóhùn náà rọrùn sí i.
  terminology: “Olórí àlùfáà” jẹ́ ọ̀rọ̀ tó yẹ fún ἀρχιερεύς nínú àyíká yìí. “Lu” pa ìtumọ̀ gbooro ti τύπτειν mọ́. Àkọsílẹ̀ ìsàlẹ̀ àkọ́kọ́ ní “gbá Pọ́ọ̀lù létí ní ẹnu,” èyí tí kò dáa ní Yorùbá, tí ó sì tún fi orúkọ Pọ́ọ̀lù kún ọ̀rọ̀ náà.
