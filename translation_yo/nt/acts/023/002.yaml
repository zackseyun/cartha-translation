base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: yo
  text: Ṣùgbọ́n Ananíà, olórí àlùfáà, pàṣẹ fún àwọn tí wọ́n dúró lẹ́gbẹ̀ẹ́ rẹ̀ pé kí wọ́n lù ú ní ẹnu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fì ọwọ́ gbá a ní ẹnu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí lílu ní gbogbogbòò; ìtumọ̀ náà sọ irú ìlù náà pàtó sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìhùwàpadà Ananíà tí ó yára sí ọ̀rọ̀ Pọ́ọ̀lù hàn, láìmú ìtakora náà le ju bí ó ti wà lọ.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ipò àlùfáà gíga jù lọ nínú àyíká yìí.
- source_word: Ἁνανίας
  choice: Ananíà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti àṣà ìkọ̀wé Yorùbá.
- source_word: ἐπέταξεν
  choice: pàṣẹ
  rationale: Ó pa agbára àṣẹ tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá òde òní.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: àwọn tí ó dúró lẹ́gbẹ̀ẹ́ rẹ̀
  rationale: Ó pa ìtumọ̀ pé àwọn ènìyàn náà wà ní ẹ̀gbẹ́ Ananíà mọ́, láìfi kún un pé wọ́n jẹ́ ìránṣẹ́ rẹ̀.
- source_word: τύπτειν
  choice: kí wọ́n lu
  rationale: “Lu” lè túmọ̀ sí fífi ọwọ́ tàbí ohun mìíràn kọlu ẹnìkan, nítorí náà kò sọ ọ̀nà ìlù náà pàtó ju Gíríìkì lọ.
- source_word: αὐτοῦ τὸ στόμα
  choice: lu Pọ́ọ̀lù ní ẹnu
  rationale: Gíríìkì ní “ẹnu rẹ̀,” ṣùgbọ́n fífi orúkọ Pọ́ọ̀lù hàn mú olùgbà ìṣe náà ṣe kedere ní Yorùbá, “ní ẹnu” sì fi ibi tí wọ́n ní kí wọ́n lù ú hàn lọ́nà àdánidá.
