id: ACT.23.18
reference: Acts 23:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: yo
  text: Nítorí náà, ó mú un lọ sọ́dọ̀ olórí ọmọ ogun náà[a], ó sì sọ pé, “Pọ́ọ̀lù ẹlẹ́wọ̀n pè mí sọ́dọ̀ rẹ̀, ó sì bẹ̀ mí pé kí n mú ọ̀dọ́mọkùnrin yìí[b] wá sọ́dọ̀ rẹ̀, nítorí ó ní ohun kan láti sọ fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì: χιλίαρχος, ọ̀gá ọmọ ogun Róòmù kan; ní ìbílẹ̀, a tún máa ń pè é ní “tribune.”'
    reason: cultural_note
  - marker: b
    text: Tàbí “ọ̀dọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: ó mú un lọ
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi hàn pé ọmọ ogun náà gba ọ̀dọ́mọkùnrin náà, ó sì mú un dé ibi tí olórí ọmọ ogun wà. “Ó mú un lọ” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìṣísẹ̀ náà mọ́.
- source_word: χιλίαρχον
  choice: olórí ọmọ ogun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan. “Olórí ọmọ ogun” ṣe kedere fún òǹkàwé òde òní, láì lo ọ̀rọ̀ àjèjì tàbí láì sọ iye àwọn ọmọ ogun tí ó wà lábẹ́ rẹ̀ di ohun pàtó ju ẹ̀rí ọ̀rọ̀ náà lọ.
- source_word: φησίν
  choice: ó sì sọ pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Pọ́ọ̀lù ẹlẹ́wọ̀n
  rationale: “Ẹlẹ́wọ̀n” túmọ̀ sí ẹni tí wọ́n fi sí àhámọ́ tàbí tí ó wà lábẹ́ ìṣọ́, ó sì bá ipò Pọ́ọ̀lù níhìn-ín mu.
- source_word: προσκαλεσάμενός με
  choice: pè mí sọ́dọ̀ rẹ̀
  rationale: 'Ìtumọ̀ yìí pa ìdarí ìpè náà mọ́: Pọ́ọ̀lù ní kí ọmọ ogun náà wá sí ọ̀dọ̀ òun.'
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: ó sì bẹ̀ mí pé kí n mú ... wá
  rationale: Nínú àyíká yìí, ἐρωτάω jẹ́ ìbéèrè tàbí ẹ̀bẹ̀ fún ohun kan, kì í ṣe fífi ìbéèrè wádìí ọ̀rọ̀. Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ìbéèrè bẹ́ẹ̀.
- source_word: νεανίαν
  choice: ọ̀dọ́mọkùnrin
  rationale: Ó tọ́ka sí ọkùnrin tí ó ṣì jẹ́ ọ̀dọ́; “ọ̀dọ́mọkùnrin” ṣe kedere, ó sì yẹ fún èdè ọ̀wọ̀.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: nítorí ó ní ohun kan láti sọ fún ọ
  rationale: Gbólóhùn aláfarawé náà ṣe àlàyé ìdí tí wọ́n fi ní kí a mú ọ̀dọ́mọkùnrin náà wá. Ìtumọ̀ yìí jẹ́ kedere, kò sì fi ohun tí yóò sọ kún ọ̀rọ̀ orísun.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní ọ̀wọ̀, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “olórí ọmọ ogun” dípò ọ̀rọ̀ oyè àjèjì kí òǹkàwé gbogbo lè lóye rẹ̀; àlàyé ipò Róòmù wà ní àlàyé ìsàlẹ̀.
