id: ACT.23.23
reference: Acts 23:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: yo
  text: Ó sì pe méjì lára àwọn balógun ọgọ́rùn-ún, ó ní, “Ẹ pèsè igba ọmọ ogun, kí wọ́n lè lọ títí dé Kesaríà, àti àádọ́rin ẹlẹ́ṣin àti igba ọmọ ogun ọlọ́kọ̀[a], ní wákàtí kẹta òru[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “igba ẹ̀ṣọ́ apá ọ̀tún”; ìtumọ̀ pàtó ọ̀rọ̀ Gíríìkì ṣọ̀wọ́n tí a túmọ̀ sí “ọmọ ogun ọlọ́kọ̀” kò dájú.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, ní ìwọ̀n wákàtí mẹ́ta lẹ́yìn tí òru bẹ̀rẹ̀, ó fẹ́rẹ̀ẹ́ jẹ́ aago mẹ́sàn-án alẹ́ gẹ́gẹ́ bí ìṣírò àkókò àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: ó sì pe ...
  rationale: Aorist middle participle náà fi ìṣe pípe wọn wá sọ́dọ̀ rẹ̀ ṣáájú ọ̀rọ̀ tí ó sọ. Èdè Yorùbá àdánidá ń so àwọn ìṣe náà pọ̀ pẹ̀lú ‘ó sì ... ó ní.’
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: méjì lára àwọn balógun ọgọ́rùn-ún
  rationale: ‘Méjì lára’ mú ìtumọ̀ pé méjì nínú ẹgbẹ́ àwọn balógun ọgọ́rùn-ún jáde, láìfi ọ̀rọ̀ àfikún tí kò ṣe pàtàkì sí τινας.
- source_word: Ἑτοιμάσατε
  choice: Ẹ pèsè
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; ‘Ẹ pèsè’ jẹ́ kedere, ó sì bá àṣẹ ológun mu.
- source_word: στρατιώτας διακοσίους
  choice: igba ọmọ ogun
  rationale: Ìtumọ̀ tààrà fún iye igba àti àwọn ọmọ ogun tí wọ́n ń fi ẹsẹ̀ rìn.
- source_word: ὅπως πορευθῶσιν
  choice: kí wọ́n lè lọ
  rationale: Ó pa agbára ète tí ὅπως pẹ̀lú subjunctive ní mọ́, ní èdè Yorùbá tó ṣe déédé.
- source_word: ἕως Καισαρείας
  choice: títí dé Kesaríà
  rationale: ‘Títí dé’ pa ìtumọ̀ ibi tí ìrìn-àjò náà dé mọ́, dípò kíkàn sọ ibi àfojúsùn nìkan.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: àádọ́rin ẹlẹ́ṣin
  rationale: ‘Ẹlẹ́ṣin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọmọ ogun tí ó gun ẹṣin.
- source_word: δεξιολάβους διακοσίους
  choice: igba ọmọ ogun ọlọ́kọ̀
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣọ̀wọ́n, ìtumọ̀ rẹ̀ kò sì dájú. ‘Ọmọ ogun ọlọ́kọ̀’ bá àyíká ológun mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdájú àti àṣàyàn mìíràn mọ́.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: ní wákàtí kẹta òru
  rationale: Nínú àṣẹ yìí, ἀπό tọ́ka sí àkókò tí ìrìn-àjò yóò bẹ̀rẹ̀. Gbólóhùn náà pa ìṣírò àkókò ìgbàanì mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé rẹ̀ fún òǹkàwé òde òní.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Balógun ọgọ́rùn-ún’ ṣàlàyé ipò ológun Róòmù lọ́nà tí òǹkàwé Yorùbá lè lóye, nígbà tí orúkọ ibi ‘Kesaríà’ àti ìṣírò wákàtí ìgbàanì wà ní ìbámu pẹ̀lú àyíká ìtàn.
