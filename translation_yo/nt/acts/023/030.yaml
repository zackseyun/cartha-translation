translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A pín ọ̀rọ̀ náà sí gbólóhùn méjì fún kíkà tó rọrùn, nígbà tí ‘sì’ ń pa ìsopọ̀ àwọn ìṣe inú lẹ́tà náà mọ́.
