language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: yo
  text: Nígbà tí a sì sọ fún mi pé ìdìtẹ̀ kan yóò wà lòdì sí ọkùnrin náà, mo rán an sí ọ lẹ́sẹ̀kẹsẹ̀. Mo sì pàṣẹ fún àwọn olùfisùn rẹ̀ pé kí wọ́n sọ ẹ̀sùn wọn lòdì sí i níwájú rẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n gbé ẹjọ́ wọn kalẹ̀ lòdì sí i níwájú rẹ.” Ní Gíríìkì, gbólóhùn náà túmọ̀ ní tààrà sí “láti sọ̀rọ̀ sí i tàbí lòdì sí i níwájú rẹ,” ó sì jẹ́ èdè ilé-ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Nígbà tí a sì sọ fún mi
  rationale: Gbólóhùn àsìkò yìí tú aorist passive genitive absolute náà sí Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ẹlòmíràn ló fi ọ̀rọ̀ náà tó olùkọ̀wé létí mọ́.
- source_word: ἐπιβουλῆς ... ἔσεσθαι
  choice: pé wọ́n yóò dìtẹ̀
  rationale: Ọ̀rọ̀-orúkọ Gíríìkì náà ń tọ́ka sí ète búburú tàbí ìdìtẹ̀, future infinitive náà sì fi hàn pé ohun tí wọ́n rò pé yóò ṣẹlẹ̀ ni; lílo ọ̀rọ̀-ìṣe jẹ́ Yorùbá àdánidá.
- source_word: εἰς τὸν ἄνδρα
  choice: sí ọkùnrin náà
  rationale: ‘Sí’ fi ìdarí ọ̀tá hàn, ‘ọkùnrin náà’ sì tẹ̀ lé àpèjúwe pàtó inú Gíríìkì láì fi orúkọ Pọ́ọ̀lù kún un.
- source_word: ἐξαυτῆς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó sọ ìyára àti àìjáfara tí adverb Gíríìkì náà túmọ̀ sí ní Yorùbá òde òní.
- source_word: ἔπεμψα πρὸς σέ
  choice: mo rán an sí ọ
  rationale: ‘An’ ni a mú wá láti inú àyíká ọ̀rọ̀ gẹ́gẹ́ bí Pọ́ọ̀lù, nítorí èyí ni Yorùbá tó ṣe kedere tí ó sì ṣe àdánidá.
- source_word: παραγγείλας καὶ τοῖς κατηγόροις
  choice: Mo sì pàṣẹ fún àwọn olùfisùn rẹ̀
  rationale: Ó pa ìṣe tó tẹ̀ lé rírán an lọ mọ́, καί sì fara hàn nínú ‘sì’; ‘àwọn olùfisùn rẹ̀’ bá ipò ẹjọ́ mu.
- source_word: λέγειν πρὸς αὐτὸν
  choice: kí wọ́n wá sọ ẹ̀sùn wọn sí i
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí sísọ sí i tàbí lòdì sí i, ṣùgbọ́n ó ní ìtumọ̀ ẹjọ́ ní àyíká yìí; ìtumọ̀ Yorùbá yìí ṣe kedere láì sọ ju orísun lọ.
- source_word: ἐπὶ σοῦ
  choice: níwájú rẹ
  rationale: Ó fi hàn pé kí wọ́n gbé ọ̀rọ̀ náà kalẹ̀ níwájú Fẹlikisi gẹ́gẹ́ bí aláṣẹ tó ń gbọ́ ẹjọ́.
