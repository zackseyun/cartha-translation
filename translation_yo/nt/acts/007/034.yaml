id: ACT.7.34
reference: Acts 7:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: yo
  text: “Dájúdájú, mo ti rí ìfìyàjẹ àwọn ènìyàn mi ní Íjíbítì[a]; mo sì ti gbọ́ ìkérora wọn, mo sì sọ̀kalẹ̀ láti gba wọ́n là[b]. Nísinsìnyí, wá, èmi yóò rán ọ lọ sí Íjíbítì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìpọ́njú’ tàbí ‘ìnilára.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘láti dá wọn nídè’ tàbí ‘láti yọ wọ́n kúrò nínú ewu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Dájúdájú, mo ti rí
  rationale: Ìṣọ̀kan participle àti ọ̀rọ̀-ìṣe tó ní àkókò nínú Gíríìkì ń tẹnumọ́ pé Ọlọ́run rí i ní tòótọ́. Gbólóhùn yìí mú ìtẹnumọ́ náà jáde ní Yorùbá àdánidá láìtumọ̀ ọ́ ní líle gẹ́gẹ́ bí ‘ní ríran, mo rí.’
- source_word: κάκωσιν
  choice: ìpọ́njú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìfìyàjẹ, ìnilára, tàbí ìjìyà tí a ń fi ènìyàn jẹ. ‘Ìpọ́njú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì fi ààyè sílẹ̀ fún ìtumọ̀ gbooro náà.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: àwọn ènìyàn mi tí ó wà ní Íjíbítì
  rationale: Èyí pa ìbáṣepọ̀ tí ‘àwọn ènìyàn mi’ ń fi hàn mọ́, ó sì sọ ibi tí wọ́n wà ní ọ̀nà Yorùbá àdánidá.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: ìkérora wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ Gíríìkì wà ní ẹyọ, ó ń tọ́ka sí gbogbo àwọn ènìyàn náà gẹ́gẹ́ bí ẹgbẹ́ kan. ‘Ìkérora wọn’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ẹ̀dùn tàbí ìmí-ẹ̀dùn wọn.
- source_word: κατέβην
  choice: mo sì sọ̀kalẹ̀
  rationale: Ìtumọ̀ yìí pa àwòrán pé Ọlọ́run sọ̀kalẹ̀ mọ́ láìṣàlàyé rẹ̀ kúrò tàbí dín ìfihàn rẹ̀ kù.
- source_word: ἐξελέσθαι
  choice: láti gbà wọ́n sílẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí láti yọ àwọn ènìyàn kúrò nínú ewu tàbí ìnilára. ‘Gbà wọ́n sílẹ̀’ jẹ́ Yorùbá àdánidá fún ìgbàlà tàbí ìdáǹdè bẹ́ẹ̀.
- source_word: δεῦρο
  choice: wá
  rationale: Ọ̀rọ̀ náà jẹ́ ìpè tààrà sí Mósè pé kí ó sún mọ́ Ọlọ́run tàbí kí ó múra sílẹ̀ fún iṣẹ́ tí a fẹ́ rán an.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: èmi yóò rán ọ lọ sí Íjíbítì
  rationale: Èyí fi ọ̀rọ̀ ọjọ́ iwájú àti iṣẹ́ ìránṣẹ́ Mósè hàn ní kedere. Fífi ‘èmi’ sí i ń bá ìtẹnumọ́ ẹni tó ń rán an mu.
theological_decisions:
- issue: Ọ̀rọ̀ tó sọ pé Ọlọ́run sọ̀kalẹ̀
  choice: mo sì sọ̀kalẹ̀
  alternative: mo sì wá láti dá wọn nídè
  rationale: A pa èdè tó fi ìṣe ènìyàn ṣàpèjúwe ìwọ̀lé Ọlọ́run sínú ọ̀ràn náà mọ́, dípò kí a túmọ̀ rẹ̀ sí ẹ̀kọ́ kan pàtó tàbí kí a mú àwòrán ọ̀rọ̀ náà kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́, àwòrán, àti ìṣòro ìtumọ̀ inú Gíríìkì mọ́.
