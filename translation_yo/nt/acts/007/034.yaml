- from: “Dájúdájú, mo ti rí ìpọ́njú àwọn ènìyàn mi tí ó wà ní Íjíbítì[a]; mo sì ti gbọ́ ìkérora wọn, mo sì sọ̀kalẹ̀ láti gbà wọ́n sílẹ̀[b]. Ǹjẹ́ nísinsìnyí, wá, èmi yóò rán ọ lọ sí Íjíbítì.”
  to: “Dájúdájú, mo ti rí ìfìyàjẹ àwọn ènìyàn mi ní Íjíbítì[a]; mo sì ti gbọ́ ìkérora wọn, mo sì sọ̀kalẹ̀ láti gba wọ́n là[b]. Nísinsìnyí, wá, èmi yóò rán ọ lọ sí Íjíbítì.”
