source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: yo
  text: Àwọn baba wa kò fẹ́ di onígbọràn sí i; ṣùgbọ́n wọ́n kọ̀ ọ́ sílẹ̀[a], wọ́n sì yípadà nínú ọkàn wọn sí Ejibiti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, ‘wọ́n tì í sẹ́gbẹ̀ẹ́ wọn.’ Ọ̀rọ̀ Gíríìkì náà lè ní àwòrán yíyọ Mósè kúrò níwájú wọn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, bí wọ́n tilẹ̀ ṣì wà ní aginjù, inú wọn ń fà sí pípadà sí Ejibiti.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: sí i
  rationale: Ọ̀rọ̀ arọ́pò orúkọ yìí ń tọ́ka sí Mósè nínú ẹsẹ tó ṣáájú, ó sì jẹ́ ẹni tí wọn kò fẹ́ ṣègbọ́ràn sí.
- source_word: οὐκ ἠθέλησαν
  choice: kò fẹ́
  rationale: Ó fi hàn pé wọn kò ní ìfẹ́ tàbí ìmúratán láti ṣègbọ́ràn, kì í ṣe pé wọn kàn ṣàìgbọ́ràn láìmọ̀.
- source_word: ὑπήκοοι γενέσθαι
  choice: di onígbọràn
  rationale: Èyí pa ìtumọ̀ ‘di ẹni tí ó ń ṣègbọ́ràn’ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣàn déédéé.
- source_word: οἱ πατέρες ἡμῶν
  choice: Àwọn baba wa
  rationale: Ìtumọ̀ tààrà yìí bá ọ̀nà tí Sítéfánù gbà ń sọ̀rọ̀ nípa àwọn baba ńlá Ísírẹ́lì mu.
- source_word: ἀπώσαντο
  choice: wọ́n kọ̀ ọ́ sílẹ̀
  rationale: Ó mú ìtumọ̀ kíkọ Mósè àti fífi í sí ẹ̀gbẹ́ hàn ní Yorùbá òde òní; àlàyé ìsàlẹ̀ fi àwòrán títì í sẹ́gbẹ̀ẹ́ hàn.
- source_word: ἐστράφησαν
  choice: wọ́n sì yí ... padà
  rationale: Ọ̀rọ̀ yìí tọ́ka sí yíyípadà sí ohun tí wọn ti fi sílẹ̀, kì í ṣe yíyí lasan.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: ọkàn wọn
  rationale: Ó pa àpèjúwe Bíbélì nípa ìfẹ́ inú, èrò àti ìdúró ẹni mọ́.
- source_word: εἰς Αἴγυπτον
  choice: sí Ejibiti
  rationale: Ó fi ibi tí ìfẹ́ inú wọn dojú kọ hàn láìfi kún ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Irú yíyípadà àwọn ọmọ Ísírẹ́lì sí Ejibiti
  choice: wọ́n sì yí ọkàn wọn padà sí Ejibiti
  alternative: wọ́n padà sí Ejibiti nínú ọkàn wọn
  rationale: Gbólóhùn náà fi yíyípadà inú—ní ìfẹ́ àti ìdúró wọn—hàn, láìsọ pé wọn padà sí Ejibiti nípa ti ara, àti láìsọ àwòrán ọ̀rọ̀ náà di àlàyé lásán.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Di onígbọràn’ pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́ láìdi gbolohun Yorùbá rú; ‘yí ọkàn wọn padà’ sì pa àìdánilójú àti ìforígbárí inú àlàyé náà mọ́.
