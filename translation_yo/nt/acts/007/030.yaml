source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: yo
  text: Nígbà tí ogójì ọdún sì pé[a], áńgẹ́lì kan fara hàn án ní aginjù Òkè Sínáì[c], nínú ọwọ́ iná kan láti inú igbó kan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ogójì ọdún parí.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “nínú ọwọ́ iná ti igbó kan”; ìyẹn ni pé ọwọ́ iná náà ní ìbáṣepọ̀ pẹ̀lú igbó kan, gẹ́gẹ́ bí Ẹ́kísódù 3:2 ṣe sọ.
    reason: cross_reference
  - marker: c
    text: Àwọn atúmọ̀ kan so èyí pọ̀ mọ́ “áńgẹ́lì Olúwa” nínú Ẹ́kísódù 3:2, ṣùgbọ́n ìwé Ìṣe sọ “áńgẹ́lì kan” lásán níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Nígbà tí ogójì ọdún sì pé
  rationale: Gbólóhùn yìí fi ipò àkókò hàn, ó sì pa ìtumọ̀ πληρόω mọ́ pé iye ọdún náà dé òpin, ní èdè Yorùbá àdánidá.
- source_word: ὤφθη αὐτῷ
  choice: fara hàn án
  rationale: ὤφθη sábà máa ń tọ́ka sí ìfarahàn, kì í ṣe pé ẹnì kan kàn rí i; “fara hàn án” ni ọ̀nà Yorùbá àdánidá láti sọ pé ó appeared to him.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: ní aginjù Òkè Sínáì
  rationale: “Aginjù” bá àyíká ìtàn Ẹ́kísódù mu, “Òkè Sínáì” sì ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún orúkọ òkè náà.
- source_word: ἄγγελος
  choice: áńgẹ́lì kan
  rationale: Àyíká náà tọ́ka sí ẹ̀dá ọ̀run, nígbà tí àìní àròkọ pàtó nínú Gíríìkì kò fi dandan jẹ́ pé ká sọ ọ́ di “áńgẹ́lì Olúwa.”
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: nínú ọwọ́ iná láti inú igbó kan
  rationale: Èyí pa àwòrán ọwọ́ iná mọ́, ó sì sọ ìbáṣepọ̀ tí Gíríìkì kó pọ̀ mọ́ra láàárín iná náà àti igbó ní ọ̀nà Yorùbá tí ó ṣe kedere láì sọ ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions:
- issue: Irú ẹni tí ἄγγελος ń tọ́ka sí nínú ìfarahàn yìí
  choice: áńgẹ́lì kan
  alternative: áńgẹ́lì Olúwa
  rationale: Ìwé Ìṣe 7:30 sọ ἄγγελος lásán, kò sọ “áńgẹ́lì Olúwa.” Nítorí náà, ọ̀rọ̀ àkọ́kọ́ kò fi ìdánimọ̀ tí ó lágbára ju ti orísun lọ kún un; àlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú Ẹ́kísódù 3:2 wà nínú àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Fara hàn án” àti “ní aginjù Òkè Sínáì” jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé navẹ́lì lè lóye, nígbà tí “ọwọ́ iná” pa àwòrán orísun mọ́.
