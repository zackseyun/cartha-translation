id: ACT.7.44
reference: Acts 7:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: yo
  text: Àgọ́ ẹ̀rí[a] wà pẹ̀lú àwọn baba wa[b] ní aginjù, gẹ́gẹ́ bí ẹni tí ń bá Mósè sọ̀rọ̀[c] ti pàṣẹ fún un láti ṣe é ní ìbámu pẹ̀lú àpẹẹrẹ tí Mósè ti rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Tábánákìlì ẹ̀rí.” Ọ̀rọ̀ Gíríìkì ní “àgọ́ ẹ̀rí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn baba ńlá wa.” Gíríìkì ní “àwọn baba wa.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí ó bá Mósè sọ̀rọ̀,” tàbí “Ọlọ́run/Olúwa tí ń bá Mósè sọ̀rọ̀.” Gíríìkì kò dárúkọ ẹni tó ń sọ̀rọ̀ ní tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: σκηνὴ
  choice: àgọ́
  rationale: “Àgọ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ilé tí a lè gbé kiri; ó sì bá ìtumọ̀ ipilẹ̀ ọ̀rọ̀ Gíríìkì mu láìfi ọ̀rọ̀ ẹ̀sìn àkànṣe kún un.
- source_word: τοῦ μαρτυρίου
  choice: ẹ̀rí
  rationale: A pa ìsopọ̀ genitive náà mọ́ gẹ́gẹ́ bí “àgọ́ ẹ̀rí,” èyí tí ó tọ́ka sí ibi mímọ́ tí ó ní ìbáṣepọ̀ pẹ̀lú ẹ̀rí májẹ̀mú Ọlọ́run.
- source_word: ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ
  choice: wà pẹ̀lú àwọn baba wa ní aginjù
  rationale: “Wà pẹ̀lú” fi dative náà hàn lọ́nà àdánidá, “àwọn baba wa” sì pa ìsọ̀rí akọ inú Gíríìkì mọ́; “aginjù” ni ìtumọ̀ àyíká ilẹ̀ náà.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu tó wà láàárín àṣẹ tí Mósè gbà àti bí a ṣe ṣe àgọ́ náà hàn.
- source_word: διετάξατο
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ yìí fi agbára àṣẹ inú ìtọ́ni náà hàn ní Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: ẹni tí ń bá Mósè sọ̀rọ̀
  rationale: Èyí pa participle náà àti ẹni tí a kò dárúkọ ní Gíríìkì mọ́, láìfi “Ọlọ́run” tàbí “Olúwa” sínú ẹsẹ náà ní tààrà.
- source_word: ποιῆσαι αὐτὴν
  choice: láti ṣe é
  rationale: Ìtumọ̀ yìí rọrùn, ó sì tọ́ fún ṣíṣe tàbí kíkọ́ àgọ́ náà.
- source_word: κατὰ τὸν τύπον
  choice: ní ìbámu pẹ̀lú àpẹẹrẹ
  rationale: “Àpẹẹrẹ” sọ èrò ohun àwòṣe tí a fi hàn Mósè ní kedere, láìdín in kù sí àwòrán lásán.
- source_word: ὃν ἑωράκει
  choice: tí ó ti rí
  rationale: “Ti rí” mú ìṣe tí ó ti ṣẹlẹ̀ ṣáájú àṣẹ ṣíṣe àgọ́ náà jáde, bí pluperfect Gíríìkì ṣe fi hàn.
theological_decisions:
- issue: Ta ni “ẹni tí ń bá Mósè sọ̀rọ̀” ń tọ́ka sí?
  choice: A fi ẹni náà sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí “ẹni tí ń bá Mósè sọ̀rọ̀.”
  alternative: “Ọlọ́run tí ń bá Mósè sọ̀rọ̀” tàbí “Olúwa tí ń bá Mósè sọ̀rọ̀.”
  rationale: Gíríìkì lo participle gẹ́gẹ́ bí orúkọ láìdárúkọ ẹni náà ní tààrà. Bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí Ọlọ́run, títúmọ̀ rẹ̀ láìfi orúkọ kún un pa bí orísun ṣe sọ ọ́ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Àgọ́ ẹ̀rí” pa àṣà ọ̀rọ̀ Bíbélì mọ́ ṣùgbọ́n ó ṣì ṣeé lóye; gbolohun náà sì tẹ̀lé ìṣàn Yorùbá àdánidá láìyọ àìdánilójú inú Gíríìkì kúrò.
