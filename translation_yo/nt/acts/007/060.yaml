id: ACT.7.60
reference: Acts 7:60
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: yo
  text: Nígbà náà, ó kúnlẹ̀, ó sì ké lóhùn rara pé, “Olúwa, má ṣe ka ẹ̀ṣẹ̀ yìí sí wọn lọ́rùn.” Lẹ́yìn tí ó sọ èyí tán, ó sùn lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “ó sùn”; èyí jẹ́ ọ̀nà tí wọ́n sábà ń gbà sọ pé ẹnì kan kú.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Nígbà náà, ó kúnlẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí fífi eékún lélẹ̀, ṣùgbọ́n ‘ó kúnlẹ̀’ ni ọ̀nà Yorùbá àdánidá tí ó pa ìṣe ara náà mọ́; δέ ń tẹ ìtàn náà síwájú.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ó sì ké ní ohùn rara
  rationale: Ó pa ìtumọ̀ igbe ńlá àti gbólóhùn φωνῇ μεγάλῃ mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni orúkọ oyè tí ó bójú mu fún κύριος nínú àdúrà yìí, tí àyíká ẹsẹ̀ ṣáájú fi hàn pé a ń bá Jésù sọ̀rọ̀.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: má ṣe ka ẹ̀ṣẹ̀ yìí sí wọn lọ́rùn
  rationale: Gbólóhùn Yorùbá yìí pa èrò fífi ẹ̀ṣẹ̀ náà sí àkọọ́lẹ̀ wọn tàbí dí wọn lẹ́bi rẹ̀ mọ́, ó sì jẹ́ kí ταύτην, ‘yìí,’ hàn gbangba.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sì sọ èyí tán
  rationale: Ó fi ìtẹ̀lé àkókò participle Gíríìkì náà hàn ní Yorùbá àdánidá.
- source_word: ἐκοιμήθη
  choice: ó sùn lọ
  rationale: Ó pa àpèjúwe oorun tí Gíríìkì lò fún ikú Sítéfánù mọ́, láì sọ ọ́ di ‘ó kú’ nìkan.
theological_decisions:
- issue: Àpèjúwe ikú nínú ἐκοιμήθη
  choice: ó sùn lọ
  alternative: ó kú
  rationale: Orísun Gíríìkì lo àpèjúwe oorun fún ikú; títọ́jú àpèjúwe náà pa ìró àti ìfọkànsìn ẹsẹ̀ mọ́ láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Ẹni tí Κύριε ń tọ́ka sí nínú àdúrà Sítéfánù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Àyíká ẹsẹ̀ 59 fi hàn pé Sítéfánù ń ké pe Jésù; ‘Olúwa’ pa orúkọ oyè Kristi náà àti ọ̀wọ̀ tó wà nínú ọ̀rọ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ka … sí wọn lọ́rùn’ láti fi ìtumọ̀ ìdájọ́ hàn ní ọ̀nà tí àwọn òǹkàwé òde òní lè lóye.
