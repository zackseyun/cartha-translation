id: ACT.7.55
reference: Acts 7:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: yo
  text: Ṣùgbọ́n Sítéfánù, tí ó kún fún Ẹ̀mí Mímọ́, tẹjú mọ́ ọ̀run[a], ó sì rí ògo Ọlọ́run àti Jésù tí ó dúró ní ọwọ́ ọ̀tún Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wo ọ̀run fínnífínní.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “ní ọwọ́ ọ̀tún Ọlọ́run,” jẹ́ àkànlò èdè Bíbélì fún ipò ọlá àti àṣẹ tí ó ga jù lọ.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: tí ó kún fún
  rationale: Ọ̀rọ̀ náà fi ipò tí Sítéfánù wà nínú rẹ̀ nígbà ìṣẹ̀lẹ̀ náà hàn. Gbólóhùn àpèjúwe yìí jẹ́ èdè Yorùbá àdánidá, kò sì sọ pé ó ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í kún.
- source_word: πλήρης πνεύματος ἁγίου
  choice: kún fún Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere fún ìtumọ̀ pé Ẹ̀mí Mímọ́ ń darí, ó sì ń fún un lágbára; ó tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni, kì í ṣe ìwà mímọ́ lásán.
- source_word: ἀτενίσας
  choice: tẹjú mọ́
  rationale: ‘Tẹjú mọ́’ mú ìtumọ̀ wíwo pẹ̀lú àfiyèsí àti ìmúrasílẹ̀ ọkàn jáde ju ‘wò’ lásán lọ.
- source_word: εἰς τὸν οὐρανόν
  choice: ọ̀run
  rationale: Nínú ìran yìí, οὐρανός ń tọ́ka sí ọ̀run gẹ́gẹ́ bí ibùgbé Ọlọ́run, kì í ṣe ojú ọ̀run tí a ń rí lásán.
- source_word: εἶδεν
  choice: ó sì rí
  rationale: ‘Rí’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìṣe pàtàkì inú gbólóhùn náà mu; ‘sì’ so ohun tí ó rí mọ́ bí ó ṣe tẹjú mọ́ ọ̀run.
- source_word: δόξαν θεοῦ
  choice: ògo Ọlọ́run
  rationale: Àyànfẹ́ yìí pa ìtumọ̀ ìfarahàn ọlá ńlá Ọlọ́run mọ́ ní ọ̀nà tí ó ṣe kedere tí ó sì wọ́pọ̀ nínú èdè Yorùbá.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ jù lọ nínú Bíbélì àti èdè Yorùbá.
- source_word: ἑστῶτα
  choice: tí ó dúró
  rationale: Ó sọ ìdúró Jésù nínú ìran náà ní tààrà, láì fi ìtumọ̀ iṣẹ́ tàbí ìdí tí ó fi dúró kún ọ̀rọ̀ orísun.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Èyí pa àkànlò èdè Bíbélì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí a lè lóye fún ipò ọlá àti àṣẹ tí ó ga jù lọ.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ yìí mú ìyàtọ̀ díẹ̀ láàárín ìbínú àwọn ènìyàn inú ẹsẹ tó ṣáájú àti ipò Sítéfánù jáde.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πνεύματος ἁγίου gẹ́gẹ́ bí ìtọ́kasí Ẹ̀mí Ọlọ́run tí ó jẹ́ ẹni
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Ìlò ọ̀rọ̀ náà nínú Lúùkù àti Ìṣe Àwọn Aposteli, pẹ̀lú àyíká ìtàn yìí, tọ́ka sí Ẹ̀mí Mímọ́, kì í ṣe agbára aláìlẹ́ni tàbí ìwà mímọ́ lásán.
- issue: Ìran Jésù ní ọwọ́ ọ̀tún Ọlọ́run
  choice: Jésù tí ó dúró ní ọwọ́ ọ̀tún Ọlọ́run
  alternative: Jésù tí ó dúró ní ẹ̀gbẹ́ ọ̀tún Ọlọ́run
  rationale: Àyànfẹ́ náà pa ìyàtọ̀ tí ẹsẹ náà ṣe láàárín Ọlọ́run àti Jésù mọ́, ó sì tún dá àwòrán ìgbéga, ọlá àti àṣẹ inú àkànlò náà sí.
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tí ó níyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A fi orúkọ Sítéfánù hàn gẹ́gẹ́ bí ẹni tí ọrọ̀ arọ́pò-orúkọ Gíríìkì ń tọ́ka sí nínú àyíká ẹsẹ tó ṣáájú, kí gbólóhùn Yorùbá lè ṣe kedere. A gbé àmì àlàyé [a] síbi ọ̀rọ̀ ἀτενίσας tí àlàyé náà jẹ mọ́, dípò fífi sí lẹ́yìn ‘Ẹ̀mí Mímọ́.’
