  text: Did not my hand make all these things?[a][b]
translation:
  language: yo
  text: Ṣé ọwọ́ mi kọ́ ni ó dá gbogbo nǹkan wọ̀nyí?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà ìtumọ̀ gbòòrò: “Ṣé kì í ṣe èmi ni mo dá gbogbo nǹkan wọ̀nyí?”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí ń tọ́ka sí Aísáyà 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: kọ́ ... bí?
  rationale: οὐχί fi ìbéèrè àsọyé tí ó ń retí ìdáhùn bẹ́ẹ̀ ni hàn; ìṣètò Yorùbá ‘kọ́ ... bí?’ pa agbára ìbéèrè náà mọ́.
- source_word: ἡ χείρ μου
  choice: ọwọ́ mi
  rationale: Ìtumọ̀ tààrà χείρ ni ‘ọwọ́.’ Àwòrán ara ènìyàn yìí tọ́ka sí iṣẹ́ àti agbára Ọlọ́run, ó sì pa ìró Aísáyà 66:2 mọ́.
- source_word: ἐποίησεν
  choice: ló dá
  rationale: ποιέω níbí túmọ̀ sí mímú ohun wá sí ìwàláàyè tàbí ṣíṣe rẹ̀. ‘Dá’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ ìṣẹ̀dá Ọlọ́run, ìkọ́ ‘ló’ sì fi ‘ọwọ́ mi’ hàn gẹ́gẹ́ bí olùṣe.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ìtumọ̀ yìí pa àfihàn ταῦτα àti ìkúnrẹ́rẹ́ πάντα mọ́.
theological_decisions:
- issue: Lílo ẹ̀yà ara ènìyàn gẹ́gẹ́ bí àpèjúwe Ọlọ́run
  choice: Pa ‘ọwọ́ mi’ mọ́ gẹ́gẹ́ bí ọ̀nà tí olùsọ̀rọ̀ fi ń tọ́ka sí iṣẹ́ ìṣẹ̀dá Ọlọ́run.
  alternative: Túmọ̀ ọ́n ní ọ̀nà ìtumọ̀ gbòòrò sí ‘Èmi kọ́ ló dá gbogbo nǹkan wọ̀nyí bí?’ tàbí ‘Agbára mi kọ́ ló dá wọn bí?’
  rationale: Ẹsẹ̀ náà ń fa ọ̀rọ̀ Aísáyà 66:2 yọ, ó sì lo ‘ọwọ́’ láti ṣàpèjúwe iṣẹ́ Ọlọ́run. Pípa àwòrán náà mọ́ ń dá ìró Ìwé Mímọ́ àti agbára àsọyé rẹ̀ sí.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ọwọ́ mi’ pa àwòrán orísun Gíríìkì mọ́, ‘kọ́ ... bí?’ sì mú ìbéèrè àsọyé tí ń retí ìdáhùn rere jáde lọ́nà àdánidá.
