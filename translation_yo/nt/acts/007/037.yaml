    rationale: Eyi lè dà àwọn òǹkàwé rú. Ó dára kí àlàyé náà fi ìyàtọ̀ ‘àwọn ọmọkùnrin’ (tààrà) hàn, kí ó sì fún ní àṣàyàn Yorùbá tó yàtọ̀ ní tòótọ́.
