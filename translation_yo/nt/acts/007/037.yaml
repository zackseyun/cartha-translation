language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: yo
  text: Èyí ni Mósè náà tí ó sọ fún àwọn ọmọ Ísírẹ́lì[a] pé, “Ọlọ́run yóò gbé wòlíì kan[b] dìde fún yín láti àárín àwọn arákùnrin yín[c], bí èmi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọkùnrin Ísírẹ́lì”; a tún lè tú u sí “àwọn ọmọ Ísírẹ́lì” tàbí “àwọn ọmọ ìran Ísírẹ́lì.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u lọ́nà ìtumọ̀ sí “Wòlíì náà,” ní ìbámu pẹ̀lú ìrètí tí a mọ̀ dáadáa láti Diutarónómì 18:15 àti gẹ́gẹ́ bí a ti lò ó nípa Jésù nínú ìwé Ìṣe.
    reason: alternative_reading
  - marker: c
    text: “Àwọn arákùnrin” níhìn-ín ń tọ́ka sí àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn; ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Èyí ni Mósè náà
  rationale: “Èyí” àti “náà” pa ìtẹnumọ́ àti ìdánimọ̀ pàtó inú ọ̀rọ̀ Gíríìkì mọ́, láì mú kí Yorùbá dà bí èdè àjèjì.
- source_word: εἴπας
  choice: tí ó sọ
  rationale: A tú participle náà sí gbólóhùn ìbátan, èyí tí ó jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: fún àwọn ọmọ Ísírẹ́lì
  rationale: “Àwọn ọmọ Ísírẹ́lì” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn ènìyàn Ísírẹ́lì lápapọ̀; àlàyé ìsàlẹ̀ fi hàn pé υἱοῖς túmọ̀ ní tààrà sí “àwọn ọmọkùnrin.”
- source_word: Προφήτην
  choice: wòlíì kan
  rationale: Ọ̀rọ̀ náà kò ní article ní Gíríìkì; “kan” fi ìtumọ̀ aláìlẹ́gbẹ́ “wòlíì kan” hàn láì fipá mú un di orúkọ oyè.
- source_word: ἀναστήσει
  choice: yóò gbé ... dìde
  rationale: Èyí pa àwòrán ìṣe ἀνίστημι mọ́, ó sì bá ọ̀nà tí Yorùbá ń gbà sọ pé Ọlọ́run mú aṣojú kan jáde mu.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: láti àárín àwọn arákùnrin yín
  rationale: “Láti àárín” fi hàn pé wòlíì náà yóò jáde lára ẹgbẹ́ wọn fúnra wọn; “àwọn arákùnrin” pa ọ̀rọ̀ akọ ní Gíríìkì àti ìtumọ̀ ìbátan orílẹ̀-èdè mọ́.
- source_word: ὡς ἐμέ
  choice: bí èmi
  rationale: Ìtumọ̀ tààrà àti àdánidá ni fún ìfiwéra Mósè pẹ̀lú wòlíì tí a ṣèlérí.
theological_decisions:
- issue: Àsọtẹ́lẹ̀ Diutarónómì 18:15 àti ìtumọ̀ rẹ̀ nípa Mèsáyà
  choice: wòlíì kan
  alternative: Wòlíì náà
  rationale: Bó tilẹ̀ jẹ́ pé ìlò ẹsẹ yìí nínú Ìṣe ní ìtumọ̀ nípa Kristi, Προφήτην kò ní article. Nítorí náà, ọ̀rọ̀ pàtàkì náà dúró gẹ́gẹ́ bí “wòlíì kan,” nígbà tí àlàyé ìsàlẹ̀ mẹ́nu kan ìtumọ̀ míì láì fipá mú un wọ inú ẹsẹ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Mósè náà” ń pa ìtẹnumọ́ Gíríìkì mọ́; “àwọn ọmọ Ísírẹ́lì” sì yàgò fún ìtumọ̀ tí yóò dà bí ẹni pé àwọn ọmọkùnrin kékeré nìkan ni a ń bá sọ.
