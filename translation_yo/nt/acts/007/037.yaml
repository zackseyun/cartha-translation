  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: ìtọ́kasí ìtẹnumọ́ sí Mósè, gbólóhùn ìbátan ‘tí ó sọ,’ ọjọ́ iwájú ‘yóò gbé ... dìde,’ ìpilẹ̀ ‘láti àárín,’ àti ìfiwéra ‘bí èmi’ gbogbo wọn péye. ‘Wòlíì kan’ dájú ju fífi oyè ‘Wòlíì náà’ sínú ẹsẹ̀ lọ, nítorí Προφήτην kò ní article.'
  naturalness: 'Yorùbá ẹsẹ̀ náà jẹ́ ti ara, ó sì yẹ fún àkọsílẹ̀ mímọ́ òde òní. ‘Mósè náà’ ń ṣiṣẹ́ dáadáa láti fi ìtẹnumọ́ hàn. Àwọn àlàyé ìsàlẹ̀ nílò ìṣàtúnṣe kékeré: àlàyé (a) má gbọdọ̀ pe ọ̀rọ̀ tó wà nínú ẹsẹ̀ gan-an ní ‘àṣàyàn’ mìíràn, àti àlàyé (b) lè sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú Ìṣe ní ọ̀nà tí ó rọrùn síi.'
  terminology: ‘Mósè,’ ‘Ísírẹ́lì,’ ‘Ọlọ́run,’ àti ‘wòlíì’ jẹ́ ọ̀rọ̀ boṣewa tó bá ìforúkọsílẹ̀ Yorùbá mu. ‘Àwọn arákùnrin yín’ pa ìtumọ̀ ἀδελφῶν mọ́, nígbà tí àlàyé (c) ṣàlàyé ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ọmọ Ísírẹ́lì ẹlẹgbẹ́.
