  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: yo
  text: Ìyàn sì dé gbogbo ilẹ̀ Ejibiti àti ilẹ̀ Kenaani, ìpọ́njú ńlá sì wà; àwọn baba ńlá wa[a] kò sì lè rí oúnjẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn baba wa.” Gíríìkì ní “àwọn baba wa,” ó ń tọ́ka sí àwọn baba ìran Israẹli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: Ìyàn sì mú
  rationale: Ọ̀rọ̀ yìí sọ ní àdàlù Yorùbá pé ìyàn ṣẹlẹ̀, nígbà tí “sì” ń gbé ìtàn náà síwájú gẹ́gẹ́ bí δέ.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: káàkiri gbogbo ilẹ̀ Ejibiti àti ilẹ̀ Kenaani
  rationale: “Káàkiri” fi hàn pé ìyàn náà dé gbogbo agbègbè méjèèjì; fífi “ilẹ̀” kún orúkọ wọn mú kí Yorùbá náà ṣe kedere, ó sì bá ìtumọ̀ àgbègbè mu.
- source_word: θλῖψις μεγάλη
  choice: ìpọ́njú ńlá
  rationale: “Ìpọ́njú ńlá” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìnira líle tí ìyàn náà fà, láìsọ ọ́ di ọ̀rọ̀ nípa ìpọ́njú ọjọ́ ìkẹyìn.
- source_word: οὐχ ηὕρισκον
  choice: kò sì rí
  rationale: Nínú àyíká ìyàn, èyí sọ àìlè rí ohun tí wọ́n nílò ní ti ara, ó sì jẹ́ Yorùbá àdánidá fún iṣẹ́ tí ó ń bá a lọ ní àsìkò náà.
- source_word: χορτάσματα
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ohun jíjẹ tàbí ìpèsè oúnjẹ; “oúnjẹ” gbooro, ó sì ṣe kedere ju fífi ìtumọ̀ rẹ̀ mọ ọkà tàbí oúnjẹ ẹranko nìkan lọ.
- source_word: οἱ πατέρες ἡμῶν
  choice: àwọn baba ńlá wa
  rationale: “Àwọn baba ńlá wa” pa àwòrán akọ inú Gíríìkì mọ́, ó sì tọ́ka lọ́nà àdánidá sí àwọn baba ìran Israẹli.
theological_decisions:
- issue: Ọ̀rọ̀ akọ fún àwọn baba ìran
  choice: àwọn baba ńlá wa
  alternative: àwọn baba ńlá ìran wa / àwọn àgbà ìran wa
  rationale: Gíríìkì sọ ní pàtó pé “àwọn baba wa,” ó sì ń tọ́ka sí àwọn baba ìran Israẹli. A pa ìtọ́kasí akọ náà mọ́ dípò yíyí i sí ọ̀rọ̀ tí kò fi akọ tàbí abo hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn àti àmì abẹ́ lẹ́tà ni a lò níbi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan, kí ó lè ṣàlàyé “àwọn baba ńlá wa.”
