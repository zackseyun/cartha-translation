source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: yo
  text: Ní àkókò náà ni a bí Mósè,[a] ó sì rẹwà ní ojú Ọlọ́run. Wọ́n tọ́ ọ́ dàgbà fún oṣù mẹ́ta ní ilé baba rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ó rẹwà sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ó dára” tàbí “ó rẹwà ní ìrísí,” ṣùgbọ́n ó mẹ́nuba Ọlọ́run ní kedere, nítorí náà a pa ìtọ́kasí náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Ní àkókò náà
  rationale: Ọ̀rọ̀ àkókò yìí jẹ́ àdàpọ̀ ọ̀rọ̀ Yorùbá tó ṣe déédé, ó sì pa ìtọ́kasí sí àkókò náà mọ́.
- source_word: ἐγεννήθη
  choice: ni a bí
  rationale: Fọ́ọ̀mù àìṣe ti γεννάω ní ọ̀rọ̀ ìbí túmọ̀ sí pé a bí Mósè; ìṣètò ‘ni a bí’ bá ìtẹnumọ́ àkókò mu ní Yorùbá.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ọ̀nà tí orúkọ náà gbà wọ́pọ̀ nínú Yorùbá.
- source_word: ἀστεῖος
  choice: rẹwà
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ẹwà tàbí ìrísí rere; ‘rẹwà’ pa ìtumọ̀ pẹ̀tẹ́lẹ̀ mọ́ láì fi èrò míì kún un.
- source_word: τῷ θεῷ
  choice: ní ojú Ọlọ́run
  rationale: Dátífù náà ń fi ojú ìwòye tàbí ìdájọ́ Ọlọ́run hàn. ‘Ní ojú Ọlọ́run’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì pa ìtọ́kasí kedere sí Ọlọ́run mọ́.
- source_word: ὃς ἀνετράφη
  choice: Wọ́n tọ́ ọ dàgbà
  rationale: Gbolohun tuntun dára ní Yorùbá, ‘tọ́ ọ dàgbà’ sì sọ ìtọ́jú àti ìdàgbàsókè ọmọ ní ilé di mímọ̀.
- source_word: μῆνας τρεῖς
  choice: fún oṣù mẹ́ta
  rationale: ‘Fún’ jẹ́ ọ̀nà àdánidá láti fi iye àkókò hàn ní Yorùbá.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: ní ilé baba rẹ̀
  rationale: Ó pa ìtumọ̀ ilé ìdílé baba rẹ̀ mọ́ ní èdè Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ ἀστεῖος τῷ θεῷ
  choice: ó rẹwà ní ojú Ọlọ́run
  alternative: ó rẹwà sí Ọlọ́run; ó jẹ́ ọmọ rere ní ojú Ọlọ́run
  rationale: Ìtumọ̀ yìí pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tí ojú ìwòye rẹ̀ ń ṣe pàtàkì, láì sọ pé ẹwà ara nìkan ni tàbí láì mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára ju Gíríìkì lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye; a lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá.
