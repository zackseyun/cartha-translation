  source_fidelity: Ìtumọ̀ náà fi ἐν τῷ δευτέρῳ hàn gẹ́gẹ́ bí ìgbà/ìrìnàjò kejì, ó sì pa ìṣe aláìṣe ἀνεγνωρίσθη mọ́ nípa sísọ pé àwọn arákùnrin Jósẹ́fù dá a mọ̀. Gbólóhùn kejì, ‘ìdílé Jósẹ́fù sì di mímọ̀ fún Fáráò,’ bá φανερὸν ἐγένετο τῷ Φαραὼ τὸ γένος Ἰωσήφ mu dáadáa. Fífi ‘tí wọ́n lọ’ kún ‘Ní ìgbà kejì’ jẹ́ ìmúlẹ̀ àyíká tí ó bá ìtàn náà mu, kì í sì yí ìtumọ̀ padà.
  naturalness: Yorùbá náà jẹ́ ti ìlò boṣewa, pẹ̀lú àmì ohùn tó pé. ‘Dá a mọ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n mọ ẹni tí ó jẹ́; ‘di mímọ̀ fún Fáráò’ sì jẹ́ gbolohun tí ó ṣe kedere nínú àkọsílẹ̀ ìtàn mímọ́.
  terminology: ‘Àwọn arákùnrin’ dáa fún àwọn arákùnrin akọ Jósẹ́fù nínú àyíká yìí. ‘Ìdílé’ jẹ́ ìtumọ̀ òde òní tí ó yẹ fún γένος; àlàyé ìsàlẹ̀ rẹ̀ sì ń pèsè ‘àwọn ìbátan’ àti ‘ìran’ láìjẹ́ kí ìtumọ̀ kan ṣoṣo dà bí ẹni pé òun nìkan ló ṣeé ṣe. Orúkọ Jósẹ́fù àti Fáráò wà ní ìbámu pẹ̀lú ìlò Yorùbá.
