id: ACT.7.13
reference: Acts 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: yo
  text: Ní ìgbà kejì tí wọ́n lọ, àwọn arákùnrin Jósẹ́fù dá a mọ̀,[a] ìdílé Jósẹ́fù sì di mímọ̀ fún Fáráò.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jósẹ́fù fi ara rẹ̀ hàn fún àwọn arákùnrin rẹ̀.” Ọ̀rọ̀ Gíríìkì náà jẹ́ aláìṣe ní ìrísí, ṣùgbọ́n nínú àyíká ìtàn náà ó lè tọ́ka sí bí Jósẹ́fù ṣe sọ ẹni tí òun jẹ́ fún wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ìbátan Jósẹ́fù” tàbí “ìran Jósẹ́fù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: Ní ìgbà kejì tí wọ́n lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ní ìgbà kejì’; fífi ‘tí wọ́n lọ’ kún un mú kí ìtọ́kasí sí ìrìnàjò kejì àwọn arákùnrin Jósẹ́fù yé kedere láìkọjá àyíká ìtàn náà.
- source_word: ἀνεγνωρίσθη
  choice: àwọn arákùnrin Jósẹ́fù dá a mọ̀
  rationale: 'Èyí pa ìṣe aláìṣe Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá: Jósẹ́fù ni àwọn arákùnrin rẹ̀ dá mọ̀. Àlàyé ìsàlẹ̀ fi ọ̀nà míì tí ó bá ìtàn Jẹ́nẹ́sísì mu hàn.'
- source_word: ἀδελφοῖς αὐτοῦ
  choice: àwọn arákùnrin Jósẹ́fù
  rationale: Àwọn ọmọkùnrin tí wọ́n jẹ́ arákùnrin rẹ̀ gan-an ni àyíká ìtàn náà ń tọ́ka sí; orúkọ Jósẹ́fù mú ẹni tí ọ̀rọ̀ arọ́pò-orúkọ ń tọ́ka sí ṣe kedere.
- source_word: φανερὸν ἐγένετο
  choice: di mímọ̀
  rationale: Gbólóhùn yìí sọ pé ohun kan dé ipò tí ẹni kan mọ̀ ọ́; ‘di mímọ̀’ jẹ́ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ náà mu.
- source_word: γένος Ἰωσήφ
  choice: ìdílé Jósẹ́fù
  rationale: Níbí, γένος ń tọ́ka sí àwọn ìbátan tàbí ẹbí Jósẹ́fù, kì í ṣe ẹ̀yà tàbí irú ènìyàn; ‘ìdílé’ ló ṣe kedere jù lọ fún òǹkàwé òde òní.
- source_word: τῷ Φαραώ
  choice: fún Fáráò
  rationale: Ọ̀rọ̀ dative náà tọ́ka sí ẹni tí ìdílé Jósẹ́fù di mímọ̀ sí; ‘fún Fáráò’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ yìí.
theological_decisions:
- issue: Bóyá ἀνεγνωρίσθη túmọ̀ sí pé wọ́n dá Jósẹ́fù mọ̀ tàbí pé ó fi ara rẹ̀ hàn sí wọn
  choice: A fi ìṣe aláìṣe orísun náà sínú àkọ́kọ́ pé àwọn arákùnrin rẹ̀ dá a mọ̀.
  alternative: Jósẹ́fù fi ara rẹ̀ hàn fún àwọn arákùnrin rẹ̀.
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ aláìṣe, ṣùgbọ́n ìtàn Jẹ́nẹ́sísì 45:1 sọ pé Jósẹ́fù ló sọ ẹni tí òun jẹ́ fún wọn. Àkọ́kọ́ pa fọ́ọ̀mù orísun mọ́, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ àyíká ìtàn mọ́ láìfi ipinnu kan ṣoṣo lé òǹkàwé lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn. A lo ‘ní ìgbà kejì tí wọ́n lọ’ dípò gbólóhùn líle, a sì pa ìṣe aláìṣe Gíríìkì àti àìdánilójú ìtumọ̀ rẹ̀ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
