  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: yo
  text: 'Ṣùgbọ́n Ọlọ́run yí ẹ̀yìn sí wọn, ó sì fi wọ́n sílẹ̀ láti máa sin ogun ọ̀run[a][b], gẹ́gẹ́ bí a ti kọ ọ́ sínú ìwé àwọn wòlíì[d] pé: “Ẹ̀yin ilé Ísírẹ́lì, ṣé ẹ mú àwọn ẹran ìrúbọ tí a pa àti àwọn ẹbọ wá fún mi fún ogójì ọdún ní aginjù bí?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti máa jọ́sìn ogun ọ̀run.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ìsìn ẹ̀sìn tàbí jíjọ́sìn.
    reason: lexical_alternative
  - marker: b
    text: “Ogun ọ̀run” jẹ́ gbólóhùn Bíbélì fún àwọn ohun ojú ọ̀run, àti ní ìtumọ̀ tó gbòòrò, àwọn agbára ojú ọ̀run tí a ń so mọ́ ìjọsìn òrìṣà.
    reason: cultural_note
  - marker: c
    text: Ọ̀rọ̀ yìí wá láti Ámósì 5:25.
    reason: cross_reference
  - marker: d
    text: Tàbí, “sínú àkájọ ìwé àwọn wòlíì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστρεψεν
  choice: yí ẹ̀yìn sí wọn
  rationale: Gbólóhùn yìí sọ ìyípadà kúrò lọ́dọ̀ wọn àti yíyọ ojú rere kúrò lórí wọn, kì í ṣe yíyí ara lásán; ó sì bá ọ̀rọ̀ ìdájọ́ tí ó tẹ̀ lé e mu.
- source_word: παρέδωκεν αὐτοὺς
  choice: fi wọ́n sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run kọ̀ wọ́n sílẹ̀ sínú ohun tí wọ́n ti yàn gẹ́gẹ́ bí ìdájọ́, láìsọ pé Ọlọ́run ló dá ẹ̀ṣẹ̀ ìbọ̀rìṣà wọn sílẹ̀.
- source_word: λατρεύειν
  choice: láti máa sin
  rationale: ‘Sin’ pa ìtumọ̀ iṣẹ́ ìsìn ẹ̀sìn mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé jíjọ́sìn òrìṣà ni; àṣàyàn ‘jọ́sìn’ wà nínú àlàyé ìsàlẹ̀.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: ẹgbẹ́ ọmọ ogun ọ̀run
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì àti gbólóhùn Bíbélì mọ́, láìfi dandan mú un jẹ́ àwọn áńgẹ́lì tàbí àwọn ìràwọ̀ nìkan.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: sínú ìwé àwọn wòlíì
  rationale: ‘Ìwé’ ṣe kedere fún òǹkàwé òde òní, nígbà tí ‘àkájọ ìwé’ jẹ́ àṣàyàn tó bá ìtàn ìgbà náà mu tí a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: Μὴ … προσηνέγκατέ μοι
  choice: ṣé ẹ mú … wá fún mi … bí?
  rationale: Ìbéèrè Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ìbéèrè àsọyé tí ń retí ìdáhùn òdì mọ́ láìyí i sí gbólóhùn ìjẹ́wọ́.
- source_word: σφάγια καὶ θυσίας
  choice: àwọn ẹran tí a pa fún ọrẹ àti àwọn ẹbọ
  rationale: Apá àkọ́kọ́ pa èrò ẹran ọrẹ tí a pa mọ́, apá kejì sì lo ‘ẹbọ,’ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún sacrifice.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: fún ogójì ọdún ní aginjù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún àkókò ogójì ọdún àti ibi ìrìn-àjò Ísírẹ́lì.
theological_decisions:
- issue: Ìṣe Ọlọ́run nínú ìdájọ́
  choice: “yí ẹ̀yìn sí wọn, ó sì fi wọ́n sílẹ̀” ni a lò fún ìkọ̀sílẹ̀ wọn gẹ́gẹ́ bí ìdájọ́.
  alternative: Kí a sọ pé Ọlọ́run kàn gbà wọ́n láyè, tàbí pé òun ló mú wọn jọ́sìn ẹgbẹ́ ọmọ ogun ọ̀run.
  rationale: Àwọn ọ̀rọ̀-ìṣe méjèèjì fi ìdájọ́ Ọlọ́run sí ìṣọ̀tẹ̀ wọn hàn. Ìtumọ̀ náà kò sọ pé Ọlọ́run ló dá ìbọ̀rìṣà wọn sílẹ̀.
- issue: Ohun tí “ẹgbẹ́ ọmọ ogun ọ̀run” ń tọ́ka sí
  choice: A pa gbólóhùn Bíbélì tó lè tọ́ka sí àwọn ohun ojú ọ̀run tàbí àwọn agbára tí a so mọ́ wọn nínú ìbọ̀rìṣà mọ́.
  alternative: Kí a fi pàtó túmọ̀ rẹ̀ sí àwọn áńgẹ́lì nìkan tàbí àwọn ìràwọ̀ nìkan.
  rationale: Àyíká ọ̀rọ̀ ìbọ̀rìṣà ń tọ́ka sí ìsìn àwọn ohun tàbí agbára ojú ọ̀run, ṣùgbọ́n ọ̀rọ̀ náà kò dín ìtọ́kasí rẹ̀ kù sí ẹ̀ka kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà ní iyì tó bá ọ̀rọ̀ Ìwé Mímọ́ mu, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. ‘Ilé Ísírẹ́lì’ ni a pa mọ́ gẹ́gẹ́ bí ọ̀nà àsọyé Bíbélì fún gbogbo ènìyàn Ísírẹ́lì.
