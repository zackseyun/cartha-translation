id: ACT.7.15
reference: Acts 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: yo
  text: Jákọ́bù sì sọ̀kalẹ̀ lọ sí Ejibiti, ó sì kú, òun àti àwọn baba ńlá wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àgbà ìran wa.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn baba wa,” ó sì ń tọ́ka sí àwọn baba ìran Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: sọ̀kalẹ̀ lọ
  rationale: Ó pa ìtumọ̀ ìtọ́sọ́nà ‘lọ sí ìsàlẹ̀’ mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìrìnàjò lọ sí Ejibiti.
- source_word: Ἰακώβ
  choice: Jákọ́bù
  rationale: Ìkọ orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: εἰς Αἴγυπτον
  choice: sí Ejibiti
  rationale: ‘Sí’ fi ìrìnàjò dé ibi kan hàn ní Yorùbá; ‘Ejibiti’ ni orúkọ ilẹ̀ náà tí ó wọ́pọ̀.
- source_word: ἐτελεύτησεν
  choice: kú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tààrà, tí ó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: αὐτὸς
  choice: òun
  rationale: Ó pa arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì mọ́, ó sì dá Jákọ́bù yà sọ́tọ̀ kí a tó fi àwọn baba ńlá kún un.
- source_word: οἱ πατέρες ἡμῶν
  choice: àwọn baba ńlá wa
  rationale: Ó tọ́ka sí àwọn baba ìran Ísírẹ́lì, ó sì pa àwòrán akọ àti ìtàn ìdílé inú Gíríìkì mọ́ ju ọ̀rọ̀ gbogbogbò fún ‘àwọn àgbà ìran wa’ lọ.
theological_decisions:
- issue: Ìtumọ̀ πατέρες nínú ìtàn àwọn baba ìran Ísírẹ́lì
  choice: àwọn baba ńlá wa
  alternative: àwọn àgbà ìran wa
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ọkùnrin tí ó jẹ́ baba ìran Ísírẹ́lì nínú ìtàn májẹ̀mú; nítorí náà, a pa ìtọ́kasí akọ àti ìbátan ìdílé mọ́ láì sọ ọ́ di ọ̀rọ̀ gbogbogbò.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. ‘Sọ̀kalẹ̀ lọ’ pa ìtọ́sọ́nà inú Gíríìkì mọ́; ‘òun àti’ tún pa ìtẹnumọ́ àti ìṣètò gbolohun orísun mọ́. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ní ‘àwọn baba ńlá wa.’
