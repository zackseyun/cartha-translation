id: ACT.7.56
reference: Acts 7:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: yo
  text: Ó sì wí pé, “Wò ó, mo rí àwọn ọ̀run tí a ti ṣí sílẹ̀[a], àti Ọmọ Ènìyàn[b] tí ó dúró ní ọwọ́ ọ̀tún Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí, “àwọn ọ̀run tí a ti ṣí.” Ó lo perfect passive participle, èyí tí ó tẹnu mọ́ pé a ti ṣí àwọn ọ̀run náà, wọ́n sì wà ní ṣíṣí nínú ìran Stefanu.
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Ènìyàn” jẹ́ oyè Mèsáyà tí a mọ̀ dáadáa, ó sì ń rántí Dáníẹ́lì 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí àwọn olùgbọ́ lẹ́sẹ̀kẹsẹ̀, ó sì bá ìháragàgà ọ̀rọ̀ Stefanu mu ní Yorùbá òde òní.
- source_word: θεωρῶ
  choice: mo rí
  rationale: Ó fi ìríran tí ń lọ lọ́wọ́ hàn ní ọ̀nà àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: τοὺς οὐρανοὺς
  choice: àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́, a kò sì sọ ọ́ di ‘ojú ọ̀run,’ èyí tí ó lè mú kí ìríran náà dà bí ohun tó ṣẹlẹ̀ ní ojú sánmà lásán.
- source_word: διηνοιγμένους
  choice: tí a ti ṣí sílẹ̀
  rationale: Ìṣètò yìí mú ipò tí ó jẹ́ àbájáde ohun tí a ti ṣe tẹ́lẹ̀ jáde, gẹ́gẹ́ bí perfect passive participle Gíríìkì ṣe ń tọ́ka sí i.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa oyè pàtàkì yìí mọ́ ní tààràtà, pẹ̀lú ìbáṣepọ̀ rẹ̀ sí Dáníẹ́lì 7:13 àti lílò rẹ̀ gẹ́gẹ́ bí oyè Mèsáyà.
- source_word: ἐκ δεξιῶν
  choice: ní ọwọ́ ọ̀tún
  rationale: Èyí ni ọ̀nà Bíbélì tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ipò ọlá àti àṣẹ mọ́.
- source_word: ἑστῶτα
  choice: tí ó dúró
  rationale: A pa ìdúró rẹ̀ mọ́ ní kedere, a kò sì mú un bá àwọn ẹsẹ̀ míì tí wọ́n sọ pé ó jókòó mu.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: ‘Ní ọwọ́ ọ̀tún Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìbáṣepọ̀ genitive inú Gíríìkì.
theological_decisions:
- issue: Oyè Kristi, υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ọ̀rọ̀ Gíríìkì àti ìró Dáníẹ́lì 7 mọ́, ó sì jẹ́ oyè tí àwọn òǹkàwé Bíbélì mọ̀; àṣàyàn kejì yóò tú oyè náà sí ìtumọ̀ tí kò pé tó.
- issue: Ìdúró Jésù ẹni tí a gbé ga
  choice: tí ó dúró ní ọwọ́ ọ̀tún Ọlọ́run
  alternative: tí ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ẹsẹ̀ náà sọ ní pàtó pé ó dúró. A kò yí i padà láti mú un bá àwọn ibi tí wọ́n sọ pé Kristi jókòó mu, kí ìpàtó àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ náà lè wà.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, ní ọ̀nà òde òní, tó ṣe kedere, tí ó sì ní iyì. ‘Wò ó’ mú ìháragàgà ọ̀rọ̀ náà jáde; ‘àwọn ọ̀run’ àti ‘Ọmọ Ènìyàn’ pa ìforúkọsílẹ̀ Bíbélì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ̀ míì mọ́.
