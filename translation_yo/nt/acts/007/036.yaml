id: ACT.7.36
reference: Acts 7:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: yo
  text: Ọkùnrin yìí ni ó mú wọn jáde, ó sì ṣe àwọn iṣẹ́ ìyanu àti àwọn àmì ní ilẹ̀ Íjíbítì, ní Òkun Pupa[a], àti ní aginjù fún ogójì ọdún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Òkun Esùsú.’ Síbẹ̀, ọ̀rọ̀ Gíríìkì níhìn-ín ni ‘Òkun Pupa’ (Ἐρυθρὰ Θάλασσα), orúkọ tí Májẹ̀mú Tuntun àti Septuagint sábà máa ń lò fún ibi tí àwọn ọmọ Ísírẹ́lì ti rékọjá.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò afihan náà ní ìtẹnumọ́, ó sì ń tọ́ka padà sí Mósè. ‘Ọkùnrin yìí’ pa agbára ọ̀rọ̀ Stefanu mọ́ ju ‘òun’ tàbí ‘ó’ lọ.
- source_word: ἐξήγαγεν αὐτούς
  choice: ni ó mú wọn jáde
  rationale: ‘Mú ... jáde’ jẹ́ ọ̀nà àdánidá láti sọ pé Mósè ṣamọ̀nà wọn jáde; ‘ni ó’ tún pa ìtẹnumọ́ οὗτος mọ́.
- source_word: ποιήσας
  choice: ó sì ṣe
  rationale: A tú participle aorist náà sí gbólóhùn tó tẹ̀ lé láti mú Yorùbá ṣe kedere, láì yí ìbáṣepọ̀ rẹ̀ pẹ̀lú iṣẹ́ mímú wọn jáde padà.
- source_word: τέρατα καὶ σημεῖα
  choice: iṣẹ́ ìyanu àti iṣẹ́ àmì
  rationale: 'Àwọn ọ̀rọ̀ méjèèjì ni a pa mọ́: τέρατα jẹ́ iṣẹ́ tó ń mú ìyanu bá ènìyàn, σημεῖα sì jẹ́ iṣẹ́ àmì tó ń tọ́ka sí agbára tàbí ìfọwọ́sí Ọlọ́run.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: ní ilẹ̀ Íjíbítì
  rationale: ‘Ilẹ̀ Íjíbítì’ ṣàfihàn γῇ, ó sì pa àtòjọ àwọn ibi mẹ́ta inú ẹsẹ náà mọ́.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: ní Òkun Pupa
  rationale: Èyí ni ìtumọ̀ tààrà ti orúkọ Gíríìkì Ἐρυθρὰ Θάλασσα. ‘Ní’ bá àtúnṣe ἐν mu, ó sì lè tọ́ka sí agbègbè tàbí ibi ìṣẹ̀lẹ̀ náà ní Yorùbá.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀ fún ibi ahoro tí Ísírẹ́lì rìn kiri, láì fi dandan túmọ̀ sí aṣálẹ̀ oníyanrìn nìkan.
- source_word: ἔτη τεσσεράκοντα
  choice: fún ogójì ọdún
  rationale: ‘Fún’ fi iye àkókò hàn ní Yorùbá àdánidá, ‘ogójì ọdún’ sì túmọ̀ iye náà ní pàtó.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ afihan náà ń tọ́ka sí àti ipa rẹ̀ nínú ìjáde kúrò ní Íjíbítì
  choice: A tọ́ka sí Mósè gẹ́gẹ́ bí ẹni tí ó mú Ísírẹ́lì jáde, tí ó sì ṣe àwọn iṣẹ́ ìyanu àti àmì.
  alternative: Lílo ‘ó’ nìkan, èyí tí yóò dín ìtẹnumọ́ Stefanu sí Mósè kù.
  rationale: οὗτος tẹnumọ́ Mósè nínú àsọyé Stefanu. Ìtumọ̀ náà sọ ipa Mósè gẹ́gẹ́ bí aṣojú ènìyàn, ṣùgbọ́n kò sọ pé ó ṣiṣẹ́ láìsí agbára Ọlọ́run tàbí ní òmìnira kúrò lọ́dọ̀ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè ìgbàlódé tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘Ọkùnrin yìí ni ó’ láti pa ìtẹnumọ́ àsọyé mọ́, a sì lo ‘iṣẹ́ ìyanu àti iṣẹ́ àmì’ láti yà àwọn ọ̀rọ̀ Gíríìkì méjèèjì sọ́tọ̀.
