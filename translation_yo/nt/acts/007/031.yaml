id: ACT.7.31
reference: Acts 7:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: yo
  text: 'Nígbà tí Mósè rí i, ẹnu yà á nípa ohun tí ó rí[a]. Bí ó sì ti ń sún mọ́ ọn láti wò ó dáadáa, ohùn Olúwa[b][c] dún pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìran náà.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí ojú rí tàbí sí ìran.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ohùn Olúwa wá.’
    reason: lexical_alternative
  - marker: c
    text: Àwọn kan lè retí ‘OLÚWA’ nítorí ìṣẹ̀lẹ̀ yìí ń tọ́ka sí Ẹ́kísódù 3; ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí ni ‘Olúwa’ (κύριος).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí Mósè rí i
  rationale: Aorist participle náà ń tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘nígbà tí ... rí i’ jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì fi arọ́pò-orúkọ ohun náà hàn láìṣàfikún ìtumọ̀ tí kò sí.
- source_word: ἐθαύμασεν
  choice: ẹnu yà á
  rationale: Ó sọ ìyàlẹ́nu àti ìṣẹ̀nu; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: τὸ ὅραμα
  choice: ohun tí ó rí
  rationale: ὅραμα lè túmọ̀ sí ohun tí ojú rí tàbí ìran. Ní àyíká yìí, Mósè ń fèsì sí ohun tó hàn sí i níta; ‘ohun tí ó rí’ pa ìtumọ̀ fífi-ojú-rí mọ́, kò sì fi dandan sọ pé ìran inú ni.
- source_word: προσερχομένου
  choice: Bí ó sì ti ń sún mọ́ ọn
  rationale: Genitive absolute náà ń fi àkókò àti ìṣe tó ń lọ papọ̀ hàn. Ìtumọ̀ yìí pa ìṣípò Mósè sí ibi náà mọ́ ní Yorùbá àdánidá.
- source_word: κατανοῆσαι
  choice: láti wò ó dáadáa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àfiyèsí wo tàbí ṣàyẹ̀wò ohun pẹ̀lú ìṣọ́ra; yíyan yìí bá àyíká fífi-ojú-wo mu.
- source_word: ἐγένετο φωνὴ
  choice: ohùn ... dún
  rationale: Ìṣàpẹẹrẹ ἐγένετο pẹ̀lú ọ̀rọ̀-orúkọ ń mú ìṣẹ̀lẹ̀ tuntun wọlé. ‘Ohùn ... dún’ jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ pé ohùn kan bẹ̀rẹ̀ sí í jáde, láìsọ ẹni tó gbọ́ ọ́ kún un.
- source_word: κυρίου
  choice: Olúwa
  rationale: Kíkọ κύριος sí ‘Olúwa’ tẹ̀ lé ìtumọ̀ akọ́lé náà ní Yorùbá; a kò yí i sí orúkọ májẹ̀mú YHWH nítorí Gíríìkì ní κύριος.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká ìfarahàn Ọlọ́run
  choice: Olúwa
  alternative: OLÚWA
  rationale: Bí ó tilẹ̀ jẹ́ pé ìṣẹ̀lẹ̀ náà ń tọ́ka padà sí Ẹ́kísódù 3, ibi yìí nínú Gíríìkì ní κύριος, kì í ṣe Tetragrammaton. ‘Olúwa’ dúró mọ́ fọ́ọ̀mù orísun, nígbà tí ‘OLÚWA’ yóò ti yan ìdánimọ̀ pẹ̀lú YHWH ní kedere ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá fún ìtàn. ‘Ẹnu yà á’ àti ‘wò ó dáadáa’ jẹ́ gbólóhùn òde òní tí ó ṣe kedere, nígbà tí ‘Olúwa’ pa ìforúkọsílẹ̀ ẹ̀sìn tó bójú mu mọ́. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti yẹ.
