language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: yo
  text: “Èmi yóò dá orílẹ̀-èdè tí wọn yóò sìn[a] lẹ́jọ́,” ni Ọlọ́run wí, “lẹ́yìn náà, wọn yóò jáde, wọn yóò sì jọ́sìn mi[b] ní ibi yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọn yóò jẹ́ ẹrú fún” tàbí “tí wọn yóò sìn bí ẹrú.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “sìn,” ṣùgbọ́n àyíká ọ̀rọ̀ náà ń tọ́ka sí ìgbèkùn àwọn ọmọ Ísírẹ́lì ní Íjíbítì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sìn mí.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí iṣẹ́ ìsìn mímọ́ tàbí ìjọ́sìn tí a ń ṣe sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: orílẹ̀-èdè
  rationale: Ọ̀rọ̀ náà tọ́ka sí orílẹ̀-èdè tó sọ àwọn ọmọ Ábúráhámù di ẹrú; ‘orílẹ̀-èdè’ jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ìṣèlú yìí mu.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: tí wọn yóò máa sìn
  rationale: ‘Máa sìn’ pa ìtumọ̀ ìṣe δουλεύω mọ́, ó sì lè gbé èrò iṣẹ́ ẹrú nínú àyíká ọ̀rọ̀ náà láìfi ìtumọ̀ tó lágbára ju ọ̀rọ̀ Gíríìkì lọ sínú àyọkà pàtàkì.
- source_word: κρινῶ
  choice: Èmi yóò ... dá ... lẹ́jọ́
  rationale: Èyí pa èrò ìdájọ́ Ọlọ́run mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ κρίνω ní Yorùbá.
- source_word: ὁ θεὸς εἶπεν
  choice: ni Ọlọ́run wí
  rationale: A pa gbólóhùn ìdánimọ̀ ẹni tó ń sọ̀rọ̀ mọ́ ní àárín ọ̀rọ̀ àyọlò, gẹ́gẹ́ bí ó ti rí nínú orísun.
- source_word: μετὰ ταῦτα
  choice: lẹ́yìn èyí
  rationale: Ó fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn ní Yorùbá tó ṣe kedere, ó sì bá ọ̀pọ̀ demonstrative Gíríìkì mu ní ti ìtumọ̀.
- source_word: ἐξελεύσονται
  choice: wọn yóò jáde
  rationale: ‘Jáde’ sọ ìjáde kúrò ní orílẹ̀-èdè ìgbèkùn náà ní ṣókí, ó sì bá àyíká Ìjádelọ mu.
- source_word: λατρεύσουσίν μοι
  choice: wọn yóò sì jọ́sìn fún mi
  rationale: ‘Jọ́sìn’ mú ìtumọ̀ iṣẹ́ ìsìn ẹ̀sìn tí a ń ṣe fún Ọlọ́run jáde dáadáa; ‘fún mi’ tún pa dative μοι mọ́.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: ní ibí yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tó sì péye fún ìtọ́ka sí ibi kan pàtó.
theological_decisions:
- issue: Ìtumọ̀ δουλεύω ní àyíká iṣẹ́ ẹrú
  choice: máa sìn
  alternative: jẹ́ ẹrú fún / sìn bí ẹrú
  rationale: Àyíká náà dájú pé ó ń sọ nípa ìgbèkùn ní Íjíbítì, ṣùgbọ́n àyọkà pàtàkì pa fọ́ọ̀mù ọ̀rọ̀-ìṣe Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ewé fi agbára ìtumọ̀ iṣẹ́ ẹrú hàn.
- issue: Ìtumọ̀ λατρεύω nígbà tí Ọlọ́run ni a ń ṣe é fún
  choice: jọ́sìn fún mi
  alternative: sìn mí
  rationale: ‘Jọ́sìn’ mú iṣẹ́ ìsìn mímọ́ tí a ń ṣe fún Ọlọ́run hàn, láìfi ẹ̀kọ́ ẹ̀sìn àfikún kankan sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹ̀sí ọ̀rọ̀ àyọlò Gíríìkì mọ́.
