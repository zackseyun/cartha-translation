id: ACT.7.10
reference: Acts 7:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: yo
  text: ó sì gbà á kúrò nínú gbogbo ìpọ́njú rẹ̀[a], ó sì fún un ní ojúrere[b] àti ọgbọ́n níwájú Fáráò, ọba Íjíbítì, ó sì fi í jẹ́ olórí[c] lórí Íjíbítì àti gbogbo agbo ilé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ó sì dá a nídè kúrò nínú gbogbo wàhálà rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ojúrere” níbí túmọ̀ sí pé Fáráò tẹ́wọ́ gba Jósẹ́fù, ó sì rí i ní ojú rere; a tún lè lò “oore-ọ̀fẹ́.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ó sì fi í jẹ́ gomina lórí Íjíbítì àti gbogbo agbo ilé rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: gbà á kúrò
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a dá ẹnì kan nídè kúrò nínú ewu tàbí ìnira; ó bá ìtumọ̀ àárín-gbùngbùn ọ̀rọ̀ Gíríìkì mu.
- source_word: θλίψεων
  choice: gbogbo ìpọ́njú rẹ̀
  rationale: “Ìpọ́njú” ní ìwọ̀n àti ìjìnlẹ̀ tó yẹ fún onírúurú ìnira àti ìyà tí Jósẹ́fù fara dà, láìfi ìtumọ̀ àsọtẹ́lẹ̀ ọjọ́ ìkẹyìn kún un.
- source_word: χάριν
  choice: ojúrere
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí bí Fáráò ṣe tẹ́wọ́ gba Jósẹ́fù, kì í ṣe dandan sí ìtumọ̀ ẹ̀kọ́ ìsìn tó gbòòrò ti “oore-ọ̀fẹ́.”
- source_word: σοφίαν
  choice: ọgbọ́n
  rationale: “Ọgbọ́n” sọ ìtumọ̀ ọ̀rọ̀ Gíríìkì ní tààrà, ó sì lè ní ọgbọ́n ìṣe àti ìfòyemọ̀ tí Fáráò rí lára Jósẹ́fù.
- source_word: ἐναντίον
  choice: níwájú
  rationale: “Níwájú Fáráò” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún wíwà ní ojú tàbí níwájú ẹni kan.
- source_word: κατέστησεν
  choice: fi í jẹ́
  rationale: Nínú àyíká yìí, “fi í jẹ́” túmọ̀ sí yíyan tàbí gbígbé ẹni kan sí ipò àṣẹ, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἡγούμενον
  choice: olórí
  rationale: “Olórí” jẹ́ ọ̀rọ̀ gbòòrò tó ń sọ ẹni tó ní àṣẹ ìṣàkóso, láìdín ipò náà kù sí oyè ìjọba kan pàtó.
- source_word: ἐπ’ Αἴγυπτον
  choice: lórí Íjíbítì
  rationale: “Lórí” fi àṣẹ tí Jósẹ́fù ní lórí agbègbè náà hàn ní ṣókí.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: gbogbo agbo ilé rẹ̀
  rationale: “Agbo ilé” níbí kọjá ilé gẹ́gẹ́ bí ilé gbígbé; ó kan àwọn ènìyàn àti ètò ilé ọba tí ó wà lábẹ́ àṣẹ Fáráò.
theological_decisions:
- issue: Ẹni tí ó jẹ́ olùṣe nínú gbogbo ẹsẹ náà
  choice: A fi kókó ọ̀rọ̀ náà hàn pẹ̀lú arọ́pò-orúkọ “ó,” láìfi “Ọlọ́run” kún ọ̀rọ̀ náà ní tààrà.
  alternative: Kí a sọ ní kedere pé “Ọlọ́run sì gbà á...”
  rationale: Ọ̀rọ̀ tó ṣáájú fi hàn pé Ọlọ́run ni ẹni tí a ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n ẹsẹ Gíríìkì yìí kò tún dárúkọ Ọlọ́run. Lílo “ó” pa ìṣọ̀kan àyíká àti ìrísí orísun mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó lọ́lá, tó sì yé òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tó yẹ. “Fáráò, ọba Íjíbítì” pa àkọlé àti orúkọ mọ́, “agbo ilé” sì yẹra fún ìtumọ̀ ilé gbígbé nìkan.
