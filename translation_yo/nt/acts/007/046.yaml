source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: yo
  text: ẹni tí ó rí ojúrere níwájú Ọlọ́run, tí ó sì béèrè láti rí ibùgbé kan fún Ọlọ́run Jékọ́bù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àgọ́ kan fún Ọlọ́run Jékọ́bù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: rí ojúrere
  rationale: Ọ̀rọ̀-àpólà yìí túmọ̀ sí pé ẹni náà gba ojúrere, kì í ṣe pé ó ṣàwárí ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí ohun àìlérò. ‘Rí ojúrere’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìbáṣepọ̀ inú ọ̀rọ̀ náà mọ́.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó ń tọ́ka sí wíwà níwájú tàbí ní ojú ẹni kan; ‘níwájú Ọlọ́run’ jẹ́ kíkún, ó sì bá ọ̀rọ̀ Yorùbá mímọ́ mu.
- source_word: ᾐτήσατο
  choice: bẹ̀bẹ̀
  rationale: Fọ́ọ̀mù àárín náà fi hàn pé ó fi ìbéèrè kan síwájú. ‘Bẹ̀bẹ̀’ fi hàn pé ìbéèrè pàtàkì ni láì sọ ọ́ di ọ̀rọ̀ ìjọba tàbí òfin.
- source_word: εὑρεῖν
  choice: láti rí
  rationale: Èyí pa ìtumọ̀ gangan ‘láti rí’ mọ́. Bó tilẹ̀ jẹ́ pé àyíká lè túmọ̀ sí rí ohun náà gbà tàbí pèsè rẹ̀, a kò yanjú ìtumọ̀ náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: σκήνωμα
  choice: ibùgbé kan
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ibi gbígbé tàbí àgọ́ ìgbé. ‘Ibùgbé kan’ ṣe kedere ní Yorùbá òde òní, kò sì fi tipátipá sọ pé àgọ́ tàbí tẹ́ńpìlì ni.
- source_word: τῷ θεῷ Ἰακώβ
  choice: fún Ọlọ́run Jékọ́bù
  rationale: Dátífù náà bá ‘fún’ mu ní Yorùbá. ‘Ọlọ́run Jékọ́bù’ pa gbólóhùn májẹ̀mú Ìwé Mímọ́ náà mọ́.
theological_decisions:
- issue: Irú ilé tàbí ibi tí Dáfídì béèrè fún nínú àkótán ìtàn Ísírẹ́lì tí Sítéfánù sọ
  choice: A túmọ̀ σκήνωμα sí ‘ibùgbé kan.’
  alternative: ‘àgọ́ kan fún Ọlọ́run Jékọ́bù’ tàbí ‘ilé kan fún Ọlọ́run Jékọ́bù’
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ọ̀rọ̀ pàtó fún tẹ́ńpìlì lọ. ‘Ibùgbé’ pa ìṣòro àti ìdúró de ẹsẹ tó tẹ̀ lé mọ́, níbi tí Sólómọ́nì ti kọ́ ilé náà, dípò kí ìtumọ̀ yan irú ibi náà sílẹ̀ ṣáájú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìbẹ̀rẹ̀ pẹ̀lú ‘ẹni tí’ pa ìbáṣepọ̀ gírámà ẹsẹ yìí mọ́ pẹ̀lú ẹni tí ẹsẹ ṣáájú ń sọ̀rọ̀ nípa rẹ̀.
