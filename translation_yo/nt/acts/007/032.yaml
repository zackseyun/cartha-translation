source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: yo
  text: “Èmi ni Ọlọ́run àwọn baba rẹ, Ọlọ́run Ábúráhámù àti Ísáákì àti Jákọ́bù.” Nígbà náà ni ẹ̀rù bà Mósè gidigidi, kò sì gbójúgbóyà láti wò ó dáadáa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà pé, “láti ṣàyẹ̀wò dáadáa” tàbí “láti kíyè sí i dáadáa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwo pẹ̀lú àkíyèsí tàbí ríronú nípa ohun kan pẹ̀lú àkíyèsí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ gbólóhùn yìí pé, “Nígbà tí ẹ̀rù bà Mósè gidigidi, kò gbójúgbóyà láti wò ó dáadáa.”
    reason: grammatical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: Èmi ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, gbólóhùn ìdánimọ̀ tí kò ní ọ̀rọ̀-ìṣe sì ni èdè Gíríìkì. “Èmi ni” jẹ́ ọ̀nà àdánidá láti sọ ìdánimọ̀ Ọlọ́run ní Yorùbá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá gbólóhùn ìdánimọ̀ pàtó mu.
- source_word: τῶν πατέρων σου
  choice: àwọn baba rẹ
  rationale: “Àwọn baba rẹ” pa àwòrán gangan ti πατέρων mọ́, pẹ̀lú ìtumọ̀ àwọn baba ìran Mósè; a kò sọ ọ́ di ọ̀rọ̀ gbogbogbò bí “àwọn baba ńlá” nìkan.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Ọlọ́run Ábúráhámù àti Ísáákì àti Jákọ́bù
  rationale: Àtúnṣe “Ọlọ́run” pa ìdánimọ̀ kejì mọ́, “àti” tí a tún sọ sì tẹ̀ lé ìlù ọ̀rọ̀ Gíríìkì àti ọ̀rọ̀ tí a fa yọ láti inú Ìwé Mímọ́.
- source_word: ἔντρομος ... γενόμενος
  choice: ẹ̀rù ba Mósè gidigidi
  rationale: Ọ̀rọ̀ yìí fi hàn pé Mósè wọ ipò ìbẹ̀rù líle. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì sọ agbára ìbẹ̀rù náà kedere láìfi dandan mú un jẹ́ ìgbọ̀n ara nìkan.
- source_word: οὐκ ἐτόλμα
  choice: kò gbójúgbóyà
  rationale: Èyí sọ àìní ìgboyà láti ṣe ohun kan ní Yorùbá àdánidá, ó sì bá ìtumọ̀ τολμάω mu.
- source_word: κατανοῆσαι
  choice: láti wò ó dáadáa
  rationale: Nínú àyíká ìran igi tí ń jó, ọ̀rọ̀-ìṣe náà tọ́ka sí wíwo ohun kan pẹ̀lú àkíyèsí. “Wò ó dáadáa” pa ìtumọ̀ ojú mọ́, ó sì ṣeé lóye fún òǹkàwé òde òní.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìdánimọ̀ Ọlọ́run tí a fa yọ láti inú Ẹ́kísódù
  choice: Èmi ni Ọlọ́run àwọn baba rẹ
  alternative: Èmi, Ọlọ́run àwọn baba rẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe tí a kọ sílẹ̀, “Èmi ni” ni Yorùbá àdánidá fún ìdánimọ̀, ó sì pa ìtẹnumọ́ ọ̀rọ̀ Ọlọ́run mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọ̀wọ̀, àti òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A pa àtúnṣe “àti” mọ́ fún ìlù ọ̀rọ̀ àyọkà, a sì lo “àwọn baba rẹ” láti pa ìsúnmọ́ sí ọ̀rọ̀ orísun àti ìmọ̀lára májẹ̀mú rẹ̀ mọ́.
