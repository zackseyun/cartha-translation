id: ACT.7.40
reference: Acts 7:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: yo
  text: wọ́n sọ fún Áárónì pé, “Ṣe àwọn ọlọ́run[a] fún wa tí yóò lọ níwájú wa; nítorí Mósè yìí[b], ẹni tí ó mú wa jáde kúrò ní ilẹ̀ Íjíbítì—a kò mọ ohun tí ó ṣẹlẹ̀ sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ère.” Ní ti gangan, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “àwọn ọlọ́run”; ó tún ọ̀rọ̀ inú ìtàn Eksodu sọ, ó sì pa ohun tí àwọn ènìyàn fúnra wọn pè wọ́n mọ́ dípò fífi ọ̀rọ̀ ìtumọ̀ míì rọ́pò rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí, ní ti Mósè yìí ...”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: wọ́n sọ fún Áárónì pé
  rationale: Aorist participle náà so ọ̀rọ̀ yìí mọ́ ìṣe inú àyíká ẹsẹ̀; gbolohun olódì Yorùbá yìí jẹ́ àdánidá, ó sì fi ẹni tí wọ́n bá sọ̀rọ̀ hàn.
- source_word: Ποίησον ἡμῖν
  choice: Ṣe ... fún wa
  rationale: Ṣe jẹ́ ọ̀rọ̀ àṣẹ tààrà fún ṣíṣe tàbí dídá ohun kan, nígbà tí fún wa fi ἡμῖν hàn kedere.
- source_word: θεοὺς
  choice: àwọn ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ θεός, ‘àwọn ọlọ́run,’ kì í ṣe ọ̀rọ̀ pàtó fún ‘ère.’ Yíyan èyí pa ohùn ẹ̀sùn àwọn ènìyàn àti ìfọ̀rọ̀wérọ̀ rẹ̀ pẹ̀lú ìtàn Eksodu mọ́.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: tí yóò máa lọ níwájú wa
  rationale: Ó pa ìtumọ̀ ‘lọ ṣáájú/níwájú’ mọ́ láìfi ìtumọ̀ àfikún ‘darí wa’ sí i; máa bá ọjọ́ iwájú àti ìṣe tí a ń retí mu ní Yorùbá.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: nítorí Mósè yìí
  rationale: nítorí fi iṣẹ́ ìdí tí γάρ ń ṣe hàn, Mósè yìí sì pa agbára atọ́ka οὗτος mọ́, tó lè ní ìró jíjìnnà tàbí àfojúdi díẹ̀ nínú ọ̀rọ̀ wọn.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: ó mú wa jáde kúrò ní ilẹ̀ Íjíbítì
  rationale: mú ... jáde jẹ́ ọ̀nà àdánidá láti sọ ἐξάγω, ilẹ̀ Íjíbítì sì pa γῆς Αἰγύπτου mọ́ ní kíkún.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: a kò mọ ohun tí ó ṣẹlẹ̀ sí i
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere, tó bá ìforúkọsílẹ̀ ọ̀rọ̀ mu, fún àìmọ̀ ohun tó ṣẹlẹ̀ sí Mósè.
theological_decisions:
- issue: Ṣíṣe θεοὺς ní àyíká ìbọ̀rìṣà
  choice: àwọn ọlọ́run
  alternative: àwọn ère
  rationale: Orísun náà ròyìn ohun tí àwọn ènìyàn fúnra wọn béèrè, ó sì lo θεοὺς, kì í ṣe ọ̀rọ̀ tó túmọ̀ sí ‘àwọn ère’ ní pàtó. ‘Àwọn ọlọ́run’ pa ìtumọ̀ ọ̀rọ̀ náà àti ìdọ̀tí ẹ̀sìn tó wà nínú ìbéèrè wọn mọ́ láìyanju rẹ̀ ní ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Dashi gígùn ya àbájáde ọ̀rọ̀ wọn sọ́tọ̀ lọ́nà àdánidá, láìṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
