    rationale: Ó lè túmọ̀ sí pé ó ń ‘ṣe’ aládùúgbò náà. ‘Ń hùwà àìṣòdodo sí aládùúgbò rẹ̀’ sọ ìfẹ̀hónúhàn ἀδικῶν sí ẹni náà ní Yorùbá tó rọrùn.
