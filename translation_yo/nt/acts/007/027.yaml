    rationale: Fọ́ọ̀mù náà kò fi ọ̀rọ̀-ìṣe ‘tì’ (láti tì ẹni) hàn ní kedere. Fífi àmì ohùn sí i gẹ́gẹ́ bí ‘tì Mósè sẹ́yìn’ ń yọ ìdààmú kúrò, ó sì mú ìṣe aorist náà hàn.
  - severity: low
