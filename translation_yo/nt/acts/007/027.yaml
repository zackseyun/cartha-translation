  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àti èrò Gíríìkì náà dáadáa: ọkùnrin tó ń ṣe ìwà àìṣòdodo sí aládùúgbò rẹ̀ ni ó tì Mósè, lẹ́yìn náà ó bi í nípa àṣẹ rẹ̀. Ṣùgbọ́n ‘ti Mósè sẹ́yìn’ kò ní ọ̀rọ̀-ìṣe ‘tì’ tó yẹ ní kedere, nítorí náà ó lè jẹ́ àìdánilójú.'
