  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: yo
  text: Ṣùgbọ́n ọkùnrin tí ó ń hùwà àìṣòdodo sí aládùúgbò rẹ̀ tì Mósè sẹ́yìn[a], ó ní, ‘Ta ni ó fi ọ́ jẹ́ olórí àti onídàájọ́ lórí wa?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘lé e kúrò.’ Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ títì ẹni kan ní agbára tàbí ìkọ̀sílẹ̀ rẹ̀ pẹ̀lú ẹ̀gàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: tí ó ń ṣe aládùúgbò rẹ̀ ní àìṣòdodo
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ìwà àìṣòdodo mọ́, ó sì fi ipa aláìparí ti participle àsìkò ìsinsìnyí hàn nípasẹ̀ ‘ń ṣe.’
- source_word: πλησίον
  choice: aládùúgbò rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ẹni tí ó sún mọ́ni tàbí aládùúgbò, láìfi ‘ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἀπώσατο
  choice: ti Mósè sẹ́yìn
  rationale: ‘Ti ... sẹ́yìn’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣàfihàn ìṣe ti ara tó lágbára àti ìkọ̀sílẹ̀ ẹnì kan; a mú orúkọ Mósè wá dípò arọ́pò-orúkọ láti yà á kedere sí ọkùnrin méjèèjì.
- source_word: κατέστησεν
  choice: fi ọ́ jẹ́
  rationale: Gbólóhùn Yorùbá ‘fi ẹni jẹ́’ ṣàfihàn yíyan tàbí fífi ẹni sí ipò àṣẹ lọ́nà àdánidá.
- source_word: ἄρχοντα
  choice: olórí
  rationale: ‘Olórí’ mú ìtumọ̀ ẹni tó ní àṣẹ tàbí tó ń ṣàkóso jáde ní èdè Yorùbá tó wọ́pọ̀.
- source_word: δικαστὴν
  choice: onídàájọ́
  rationale: ‘Onídàájọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ẹni tí ń gbọ́ ẹjọ́ tí ó sì ń dá a.
- source_word: ἐφ’ ἡμῶν
  choice: lórí wa
  rationale: ‘Lórí wa’ pa èrò àṣẹ tí a ń lò lórí ẹgbẹ́ ènìyàn mọ́, ó sì bá ìbéèrè atakò náà mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘aládùúgbò’ fún ìsopọ̀ ọ̀rọ̀ πλησίον, a sì lo orúkọ ‘Mósè’ láti mú ẹni tí a tì sẹ́yìn ṣe kedere láìyí ìtumọ̀ orísun padà.
