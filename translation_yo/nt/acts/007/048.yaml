  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: yo
  text: 'Ṣùgbọ́n Ẹni tí ó ga jù lọ kì í gbé inú àwọn ohun tí ọwọ́ ènìyàn ṣe[a], gẹ́gẹ́ bí wòlíì náà ti sọ pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àwọn tẹ́ńpìlì tí a fi ọwọ́ kọ́.” Ọ̀rọ̀ Gíríìkì náà túbọ̀ gbòòrò, ó túmọ̀ sí “nínú àwọn ohun tí ọwọ́ ènìyàn ṣe,” bí ó tilẹ̀ jẹ́ pé tẹ́ńpìlì ni àyíká ọ̀rọ̀ náà ń tọ́ka sí ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí ọ̀rọ̀ tí ó ṣáájú nípa ilé tí Sólómọ́nì kọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìyàtọ̀ yìí ní Yorùbá.
- source_word: οὐχ
  choice: kì í
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe κατοικεῖ, èyí jẹ́ ìkọ̀ tí ó bá gbólóhùn àpapọ̀ àti òtítọ́ tí a ń sọ nípa ìwà Ọlọ́run mu.
- source_word: ὁ ὕψιστος
  choice: Ẹni Gíga Jù Lọ
  rationale: Ó pa ipò ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run, láìfi ọ̀rọ̀ ‘Ọlọ́run’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν χειροποιήτοις
  choice: inú àwọn ohun tí ọwọ́ ènìyàn ṣe
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ náà mọ́ ní fífẹ̀ gẹ́gẹ́ bí àwọn ohun tí ènìyàn fi ọwọ́ ṣe, ó sì tún pa ọ̀pọ̀ nọ́ńbà rẹ̀ mọ́; àyíká ọ̀rọ̀ náà nípa tẹ́ńpìlì ni a ṣàlàyé nínú àlàyé ìsàlẹ̀.
- source_word: κατοικεῖ
  choice: gbé inú
  rationale: Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún gbígbé tàbí níní ibùgbé nínú ohun kan, ó sì yẹ fún ọ̀rọ̀ nípa ibùgbé Ọlọ́run.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu hàn láàárín ọ̀rọ̀ Sítéfánù àti ẹ̀rí Ìwé Mímọ́ tí ó tẹ̀ lé e.
- source_word: ὁ προφήτης
  choice: wòlíì náà
  rationale: Ó tẹ̀ lé Gíríìkì tí ó sọ ‘wòlíì náà’ láìfi orúkọ Aísáyà kún ọ̀rọ̀ pàtàkì.
- source_word: λέγει
  choice: ti sọ
  rationale: Ní Yorùbá, ìlò yìí ń ṣàgbékalẹ̀ ọ̀rọ̀ àyọlò tí ó tẹ̀ lé e lọ́nà àdánidá; ó ń tọ́ka sí ohun tí wòlíì sọ tí Ìwé Mímọ́ sì ń jẹ́rìí sí.
theological_decisions:
- issue: Bóyá kí χειροποιήτοις jẹ́ ‘àwọn tẹ́ńpìlì’ nínú ọ̀rọ̀ pàtàkì
  choice: A pa ọ̀rọ̀ fífẹ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn ohun tí ọwọ́ ènìyàn ṣe.’
  alternative: ‘àwọn tẹ́ńpìlì tí a fi ọwọ́ kọ́’ tàbí ‘àwọn ibi mímọ́ tí a fi ọwọ́ ṣe’
  rationale: Bí ó tilẹ̀ jẹ́ pé tẹ́ńpìlì ni àyíká ọ̀rọ̀ náà dá lé, ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tí ó gbòòrò sí àwọn ohun tí ènìyàn fi ọwọ́ ṣe. Yíyan ọ̀rọ̀ fífẹ̀ náà ń pa agbára àríyànjiyàn ẹ̀kọ́-ìsìn rẹ̀ mọ́ láìdín ìtumọ̀ rẹ̀ kù.
- issue: Bóyá kí ὁ ὕψιστος di ‘Ọlọ́run Ẹni Gíga Jù Lọ’
  choice: ‘Ẹni Gíga Jù Lọ’ nìkan
  alternative: ‘Ọlọ́run Ẹni Gíga Jù Lọ’
  rationale: Ó ṣe kedere pé Ọlọ́run ni oyè náà ń tọ́ka sí, ṣùgbọ́n θεός kò sí nínú Gíríìkì. Ìtumọ̀ náà kò fi ọ̀rọ̀ tí kò sí nínú orísun kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘Ẹni Gíga Jù Lọ’ gẹ́gẹ́ bí oyè ọlọ́lá, a sì pa àfihàn fífẹ̀ ti χειροποιήτοις mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
