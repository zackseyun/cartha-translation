id: ACT.7.53
reference: Acts 7:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: yo
  text: Ẹ̀yin tí ẹ gba òfin náà bí àwọn áńgẹ́lì ti gbé e fún yín[a], ṣùgbọ́n ẹ kò pa á mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nípasẹ̀ ìṣètò àwọn áńgẹ́lì” tàbí “ní ìtọ́sọ́nà àwọn áńgẹ́lì.” Gbólóhùn Gíríìkì náà ṣòro láti túmọ̀ ní pàtó, ṣùgbọ́n ó ń tọ́ka sí ipa àwọn áńgẹ́lì nínú fífi òfin náà fún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ẹ̀yin tí ẹ
  rationale: Ó pa ọ̀rọ̀ ìbáwí tí Sítéfánù ń sọ tààrà sí àwọn olùgbọ́ rẹ̀ mọ́, ó sì tún fi ìṣe ọ̀rọ̀ arọ́pò-orúkọ ìbátan Gíríìkì hàn.
- source_word: ἐλάβετε
  choice: ẹ gba
  rationale: “Gba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígba òfin, láìfi kún un pé wọ́n fi tọkàntọkàn tẹ́wọ́ gbà á.
- source_word: τὸν νόμον
  choice: òfin náà
  rationale: Ó tọ́ka sí òfin Mósè ní ọ̀nà tí ó ṣe kedere, láìfi àmì ìtumọ̀ mìíràn kún ọ̀rọ̀ Gíríìkì.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: bí àwọn áńgẹ́lì ti gbé e fún yín
  rationale: Gbólóhùn Gíríìkì yìí ṣòro, ṣùgbọ́n ó sọ nípa ipa àwọn áńgẹ́lì nínú fífi òfin náà fún wọn. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì ṣe àlàyé ọ̀nà ìlaja náà ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: Ní àyíká ọ̀rọ̀ yìí, àwọn ẹ̀dá ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe àwọn òjíṣẹ́ ènìyàn.
- source_word: οὐκ ἐφυλάξατε
  choice: ẹ kò pa á mọ́
  rationale: “Pa òfin mọ́” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìtumọ̀ ṣíṣe tàbí ṣíṣọ òfin náà mu.
theological_decisions:
- issue: Ìtumọ̀ ipa àwọn áńgẹ́lì nínú εἰς διαταγὰς ἀγγέλων
  choice: Òfin náà dé ọ̀dọ̀ wọn pẹ̀lú ipa àwọn áńgẹ́lì nínú fífi í fún wọn.
  alternative: A lè túmọ̀ rẹ̀ sí “nípasẹ̀ ìṣètò àwọn áńgẹ́lì” tàbí “ní ìtọ́sọ́nà àwọn áńgẹ́lì.”
  rationale: Ọ̀rọ̀ náà fi ipa àwọn áńgẹ́lì nínú fífi òfin hàn, ṣùgbọ́n ìtumọ̀ pàtó ti διαταγαί kò dájú. A pa àìdájú yìí mọ́ nínú àlàyé ìsàlẹ̀, láìyan ọ̀nà ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ṣe kedere, tí ó ní iyì, tí ó sì bá ọ̀rọ̀ ìbáwí tààrà mu. A lo “ẹ̀yin tí ẹ” láti pa ìtẹnumọ́ àti ìbáwí ọ̀rọ̀ Gíríìkì mọ́; a sì lo “pa òfin mọ́” gẹ́gẹ́ bí gbólóhùn Yorùbá àdánidá.
