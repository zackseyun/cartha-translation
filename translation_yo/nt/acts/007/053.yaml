  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé, kedere, ó sì yẹ fún ìbáwí líle tí Sítéfánù ń sọ. “Pa á mọ́” jẹ́ ọ̀nà àdánidá láti sọ pé ẹni kò pa òfin mọ́. Lílò “ṣùgbọ́n” fi ìyàtọ̀ ìbáwí tí ó wà nínú ọ̀rọ̀ náà hàn ní ti ẹ̀dá.
