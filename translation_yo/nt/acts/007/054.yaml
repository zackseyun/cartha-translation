  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí[a], inú wọn ru gidigidi, wọ́n sì ń payín kẹ́kẹ́ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “inú wọn bínú gidigidi”; ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí pé “a gé já nínú ọkàn wọn,” ó sì ń fi ìdàrúdàpọ̀ inú tó lágbára hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ aláìṣe pàtàkì náà ṣàfihàn àkókò tí ìṣe pàtàkì ṣẹlẹ̀; “Nígbà tí wọ́n gbọ́” jẹ́ Yorùbá àdánidá. A kò fi δὲ hàn lọ́tọ̀, nítorí pé ó kàn ń darí ìtàn síwájú níbí, ìbáṣepọ̀ náà sì ti hàn nínú gbólóhùn.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: inú wọn ru gidigidi
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí pé a “gé wọn já” ní ọkàn, ó sì ń ṣàpèjúwe ìdàrúdàpọ̀ àti ìbínú inú tó lágbára. “Inú wọn ru gidigidi” sọ agbára ìmọ̀lára náà ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán gígé náà mọ́.
- source_word: ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν
  choice: wọ́n sì ń payín keke sí i
  rationale: “Payín keke” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pípayín nítorí ìbínú; “sí i” pa ìtọ́sọ́nà ọ̀tá inú ἐπ’ αὐτόν mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo “payín keke” gẹ́gẹ́ bí àpèjúwe Yorùbá àdánidá fún ìbínú líle; àmì ìsàlẹ̀ ṣàfihàn àwòrán gígé inú ọ̀rọ̀ Gíríìkì.
