source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: yo
  text: Nítorí pé wọ́n jowú Jósẹ́fù, àwọn baba ńlá náà ta á sí ilẹ̀ Ejibiti; Ọlọ́run sì wà pẹ̀lú rẹ̀,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: àwọn baba ńlá
  rationale: Nínú ọ̀rọ̀ Sítéfánù, ọ̀rọ̀ náà ń tọ́ka sí àwọn ọmọ Jékọ́bù gẹ́gẹ́ bí àwọn baba ìpilẹ̀ orílẹ̀-èdè Ísírẹ́lì. “Àwọn baba ńlá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ìtàn àti ti ẹ̀sìn mọ́.
- source_word: ζηλώσαντες
  choice: nítorí owú tí wọ́n ní sí Jósẹ́fù
  rationale: Aorist participle náà sọ ìdí tí wọ́n fi ṣe ohun tí ó tẹ̀ lé e. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi agbára ìmọ̀lára ζηλόω hàn.
- source_word: ἀπέδοντο
  choice: ta á
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ta Jósẹ́fù. Arọ́pò-orúkọ “á” ń tọ́ka sí Jósẹ́fù láìṣàfikún ohun tí orísun kò tún sọ.
- source_word: εἰς Αἴγυπτον
  choice: sí ilẹ̀ Ejibiti
  rationale: εἰς ń fi ìlọsí ibi kan hàn. “Sí ilẹ̀ Ejibiti” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣàfihàn ibi tí wọ́n ta Jósẹ́fù sí.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Ọlọ́run wà pẹ̀lú rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì dára ní Yorùbá fún ìwàníhìn-ín Ọlọ́run pẹ̀lú Jósẹ́fù. Arọ́pò-orúkọ náà ṣe kedere nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ìwàníhìn-ín Ọlọ́run nínú ìjìyà Jósẹ́fù
  choice: ṣùgbọ́n Ọlọ́run wà pẹ̀lú rẹ̀
  alternative: àti Ọlọ́run wà pẹ̀lú rẹ̀
  rationale: καί lè túmọ̀ sí “àti” tàbí kí ó ní agbára ìyàtọ̀ nínú àyíká. “Ṣùgbọ́n” mú ìyàtọ̀ tó wà láàárín ìwà búburú àwọn arákùnrin Jósẹ́fù àti ìwàníhìn-ín Ọlọ́run jáde, láìfikún ẹ̀kọ́ nípa ìpèsè Ọlọ́run tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí òǹkàwé lásán lè lóye. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
