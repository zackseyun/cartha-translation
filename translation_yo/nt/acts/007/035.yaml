id: ACT.7.35
reference: Acts 7:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: yo
  text: “Mósè yìí gan-an, ẹni tí wọ́n kọ̀ sílẹ̀, tí wọ́n ní, ‘Ta ni ó fi ọ́ jẹ olórí àti onídàájọ́?’—òun yìí gan-an ni Ọlọ́run rán gẹ́gẹ́ bí olórí àti olùràpadà[a], nípasẹ̀ ọwọ́ áńgẹ́lì tí ó farahàn án nínú igbó náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùgbàlà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí ó mú ìtúsílẹ̀ tàbí ìdáǹdè wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτον ... τοῦτον
  choice: Mósè yìí gan-an ... òun yìí gan-an
  rationale: Àtúnwí ọ̀rọ̀-atọ́ka náà ní ìtẹnumọ́ pàtàkì; ‘gan-an’ mú ìtẹnumọ́ àti ìyàlẹ́nu inú gbolohun Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἠρνήσαντο
  choice: kọ̀ sílẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n kọ Mósè àti àṣẹ rẹ̀, kì í ṣe pé wọ́n kàn sẹ́ pé wọn kò mọ̀ ọ́n.
- source_word: κατέστησεν
  choice: fi ... jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ yíyan tàbí fífi ẹnì kan sí ipò àṣẹ.
- source_word: ἄρχοντα
  choice: olórí
  rationale: ‘Olórí’ sọ ẹni tí ó ń darí tí ó sì ní àṣẹ; ó tún jẹ́ kí àtúnwí ipa Mósè nínú ẹsẹ náà hàn kedere.
- source_word: δικαστήν
  choice: onídàájọ́
  rationale: Ọ̀rọ̀ yìí tọ́ka ní tààrà sí ẹni tí ń ṣe ìdájọ́.
- source_word: λυτρωτὴν
  choice: olùràpadà
  rationale: ‘Olùràpadà’ pa ìtumọ̀ ẹni tí ń mú ìtúsílẹ̀ tàbí ìràpadà wá mọ́, bó tilẹ̀ jẹ́ pé ‘olùgbàlà’ lè jẹ́ àṣàyàn míì ní àyíká yìí.
- source_word: ἀπέσταλκεν
  choice: rán
  rationale: Aorist Yorùbá ‘rán’ bá àkótán ìtàn mu, ó sì fi iṣẹ́ tí Ọlọ́run gbé lé Mósè lọ́wọ́ hàn.
- source_word: σὺν χειρὶ
  choice: nípasẹ̀ ọwọ́
  rationale: Èyí pa àwòrán ìṣe nípasẹ̀ aṣojú mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí ó ṣì yé òǹkà Yorùbá.
- source_word: ἀγγέλου
  choice: áńgẹ́lì
  rationale: Nínú ìtàn igbó tí ń jó, ọ̀rọ̀ náà tọ́ka sí ẹ̀dá ọ̀run tí ó farahàn Mósè.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: tí ó farahàn án nínú igbó náà
  rationale: ‘Farahàn án’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún participle náà; a kò fi ‘tí ń jó’ kún un nítorí pé kò sí nínú ẹsẹ yìí.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: gẹ́gẹ́ bí olórí àti olùràpadà
  rationale: Àtòjọ ipa méjèèjì dúró kedere, ‘gẹ́gẹ́ bí’ sì fi hàn pé Ọlọ́run rán Mósè sínú àwọn ipò wọ̀nyí.
theological_decisions:
- issue: Ìtumọ̀ λυτρωτής níbi tí Mósè ti jẹ́ aṣojú ìtúsílẹ̀ Ọlọ́run
  choice: olùràpadà
  alternative: olùgbàlà
  rationale: ‘Olùràpadà’ pa àwọ̀ ìràpadà àti ìtúsílẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́ láì sọ Mósè di Kristi tàbí láì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘gan-an’ láti pa ìtẹnumọ́ Τοῦτον ... τοῦτον mọ́; a sì pa àwòrán ‘nípasẹ̀ ọwọ́’ mọ́ láì jẹ́ kí gbolohun náà di àjèjì.
