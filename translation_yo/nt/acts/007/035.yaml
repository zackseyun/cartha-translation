  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ó pa ìtẹnumọ́ àtúnwí Τοῦτον ... τοῦτον mọ́, ó tú ἠρνήσαντο gẹ́gẹ́ bí ìkọ̀sílẹ̀ Mósè àti àṣẹ rẹ̀, ó sì ṣètò ipa méjèèjì—olórí àti olùràpadà—gẹ́gẹ́ bí ọ̀rọ̀ ìpilẹ̀ ṣe ń ṣe. “Nípasẹ̀ ọwọ́ áńgẹ́lì” ń pa ìtumọ̀ aṣojú/ọ̀nà ìṣe ti σὺν χειρὶ ἀγγέλου mọ́. “Tí ó farahàn án nínú igbó náà” tún bá ọrọ̀ náà mu láì fi ‘tí ń jó’ kún un.'
  naturalness: Yorùbá náà jẹ́ ohun tí a lè ka ní ìrọ̀rùn, ó sì yẹ fún ìpele ọ̀wọ̀ ti ìtumọ̀ Bíbélì òde òní. “Mósè yìí gan-an … òun yìí gan-an” jẹ́ ọ̀nà àdánidá láti gbé ìtẹnumọ́ Gíríìkì jáde. Àmì ohùn àti ìkọ̀wé àwọn ọ̀rọ̀ pàtàkì wà ní ìbámu pẹ̀lú Standard Yorùbá.
  terminology: “Olórí,” “onídàájọ́,” “olùràpadà,” àti “ángẹ́lì” jẹ́ àwọn ọ̀rọ̀ tó péye nínú àyíká yìí. “Olùràpadà” ń pa àwọ̀ ìtúsílẹ̀/ìràpadà ti λυτρωτής mọ́, nígbà tí àlàyé ẹsẹ̀ fi “olùgbàlà” hàn gẹ́gẹ́ bí àṣàyàn míì láì fipá mú ìtumọ̀ ẹ̀kọ́ kan wá sí inú ẹsẹ̀.
