  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: yo
  text: A sì kọ́ Mósè ní gbogbo ọgbọ́n àwọn ará Ejibiti, ó sì lágbára nínú ọ̀rọ̀ àti iṣẹ́ rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ọ̀rọ̀ sísọ àti ìṣe rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: a kọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìṣe aláìṣe-taara, ó sì tọ́ka sí ẹ̀kọ́ àti ìdánilẹ́kọ̀ọ́ tí Mósè gbà. “A kọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó gba ẹ̀kọ́.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: ní gbogbo ọgbọ́n àwọn ará Ejibiti
  rationale: Èyí pa ìtẹnumọ́ πάσῃ (“gbogbo”) mọ́, ó sì fi hàn pé ọgbọ́n àwọn ará Ejibiti ni àkóónú ẹ̀kọ́ náà.
- source_word: δυνατὸς
  choice: lágbára
  rationale: “Lágbára” mú ìtumọ̀ agbára àti ìmúnáṣẹ δυνατός jáde, ó sì bá ọ̀rọ̀ àti iṣẹ́ tí ó tẹ̀ lé e mu ní Yorùbá.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: nínú ọ̀rọ̀ àti iṣẹ́
  rationale: Ìtumọ̀ yìí dúró sún mọ́ ìṣọ̀kan λόγοις/ἔργοις, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere àti tí ó ní ìwọ̀ntúnwọ̀nsì.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Mósè. Ní gbólóhùn Yorùbá yìí, “rẹ̀” tó wà lẹ́yìn àwọn orúkọ méjèèjì lè kan “ọ̀rọ̀ àti iṣẹ́” lápapọ̀.
theological_decisions:
- issue: Ìwọ̀n agbára Mósè nínú λόγοις
  choice: A túmọ̀ ọ́ pé ó “lágbára nínú ọ̀rọ̀ àti iṣẹ́ rẹ̀,” láì mú un bá Ẹ́kísódù 4:10 mu nípasẹ̀ àlàyé àfikún.
  alternative: A lè túmọ̀ ọ́ ní ìtúmọ̀ fífẹ̀ sí i pé ó lágbára nínú ọ̀rọ̀ sísọ àti ìṣe, tàbí kí a ka agbára náà sí ipa tàbí òkìkí rẹ̀ nìkan.
  rationale: Ọ̀rọ̀ Stefanu níbí yẹ kí ó dúró gẹ́gẹ́ bí ó ti rí. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ tó wà láàárín ẹsẹ yìí àti ọ̀rọ̀ Mósè ní Ẹ́kísódù 4:10 mọ́, láì fipá yanjú rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé lásán. A yan “ará Ejibiti” gẹ́gẹ́ bí orúkọ tí ó wọ́pọ̀ fún àwọn ènìyàn ilẹ̀ Ejibiti, a sì fi àmì ohùn sí ibi tí ó yẹ.
