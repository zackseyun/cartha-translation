id: ACT.7.6
reference: Acts 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run sọ báyìí pé, “Irú-ọmọ rẹ̀ yóò jẹ́ àlejò ní ilẹ̀ àjèjì[a]; wọn yóò sọ ọ́ di ẹrú, wọn yóò sì pọ́n ọn lójú fún irinwó ọdún.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè sọ ọ́ lọ́nà tó wọ́pọ̀ sí i pé, “Àwọn àtọmọdọ́mọ rẹ̀ yóò jẹ́ àlejò ní ilẹ̀ àjèjì; wọn yóò sọ wọ́n di ẹrú, wọn yóò sì pọ́n wọn lójú fún irinwó ọdún.” Nínú Gíríìkì, ọ̀rọ̀ náà wà ní ẹyọ ṣùgbọ́n ó ń tọ́ka sí àpapọ̀: “irú-ọmọ ... ọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Ṣùgbọ́n Ọlọ́run sọ ọ́ báyìí
  rationale: “Ṣùgbọ́n” ń fi ìtẹ̀síwájú pẹ̀lú ìyàtọ̀ kékeré tí δέ ní hàn; “báyìí” sì pa οὕτως mọ́ gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run gbà sọ ọ̀rọ̀ náà.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: irú-ọmọ rẹ̀
  rationale: “Irú-ọmọ” jẹ́ ọ̀rọ̀ àpapọ̀ tó lè dúró ní ẹyọ ṣùgbọ́n tó ń tọ́ka sí gbogbo àwọn ọmọ Abrahamu lẹ́yìn rẹ̀; ó tún pa àwòrán σπέρμα mọ́ láì lo ọ̀rọ̀ tí kò bá èdè Yorùbá òde òní mu.
- source_word: πάροικον
  choice: àlejò
  rationale: Nínú àyíká yìí, “àlejò” ń sọ ẹni tó ń gbé ní ibi tí kì í ṣe ilẹ̀ tirẹ̀, kì í ṣe ẹni tó ṣẹ̀ṣẹ̀ wá bẹ̀ wò nìkan.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: ní ilẹ̀ àjèjì
  rationale: Ó fi hàn pé ilẹ̀ náà kì í ṣe ti irú-ọmọ náà; “ilẹ̀ àjèjì” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá ἀλλοτρίᾳ mu.
- source_word: δουλώσουσιν αὐτὸ
  choice: wọn yóò sọ ọ́ di ẹrú
  rationale: “Sọ ... di ẹrú” túmọ̀ ìṣe δουλόω ní kedere. Arọ́pò-orúkọ ẹyọ “ọ́” tẹ̀ lé irú-ọmọ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀, bí αὐτό ti ṣe nínú Gíríìkì.
- source_word: κακώσουσιν
  choice: wọn yóò sì pọ́n ọn lójú
  rationale: “Pọ́n ... lójú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún fífi ìyà jẹ ènìyàn tàbí ṣíṣe ibi sí i, láì fi irú ìpọ́njú kan pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: ἔτη τετρακόσια
  choice: fún irinwo ọdún
  rationale: “Fún” ń fi iye àkókò hàn lọ́nà àdánidá nínú èdè Yorùbá.
theological_decisions:
- issue: Ẹyọ àpapọ̀ nínú ọ̀rọ̀ nípa irú-ọmọ Abrahamu
  choice: 'A pa ẹyọ àpapọ̀ mọ́: “irú-ọmọ rẹ̀ ... ọ́ ... ọn.”'
  alternative: 'A lè sọ ọ́ ní ọ̀pọ̀: “àwọn àtọmọdọ́mọ rẹ̀ ... wọn.”'
  rationale: σπέρμα àti αὐτό wà ní ẹyọ nínú Gíríìkì, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ènìyàn ni wọ́n ń tọ́ka sí. Mímú ẹyọ àpapọ̀ náà mọ́ kò yanjú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan sí ọ̀nà kan ṣoṣo, ó sì pa ìṣètò ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá yẹ. “Irú-ọmọ” àti àwọn arọ́pò-orúkọ ẹyọ pa ìrísí àpapọ̀ ti Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fúnni ní ọ̀nà ọ̀pọ̀ tó rọrùn sí i.
