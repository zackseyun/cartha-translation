id: ACT.7.49
reference: Acts 7:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: yo
  text: Ọ̀run ni ìtẹ́ mi, ilẹ̀ ayé sì ni àpótí ìtìsẹ̀ mi.[a] Irú ilé wo ni ẹ̀yin yóò kọ́ fún mi, ni Olúwa wí, tàbí ibí wo ni mo ti lè sinmi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀-sí-ọ̀rọ̀: “àpótí fún àwọn ẹsẹ̀ mi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανός
  choice: Ọ̀run
  rationale: Nínú ọ̀rọ̀ àsọtẹ́lẹ̀ yìí, ọ̀run ni agbègbè ọ̀run tí a fi ṣe òdìkejì ilẹ̀ ayé, kì í ṣe ojú ọ̀run lásán.
- source_word: θρόνος
  choice: ìtẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún ìjókòó ọba, ó sì pa àwòrán ìṣàkóso mọ́.
- source_word: γῆ
  choice: ilẹ̀ ayé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gbogbo ayé nítorí a fi í ṣe òdìkejì ọ̀run, kì í ṣe ilẹ̀ kan pàtó.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: àpótí tí mo fi ń ti ẹsẹ̀ mi
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa àwòrán àpótí ìtìsẹ̀ àti fífi ẹsẹ̀ lé e mọ́.
- source_word: ποῖον
  choice: Irú ... wo
  rationale: ποῖον béèrè nípa irú tàbí ẹ̀yà ohun náà, kì í kàn béèrè ohun tí ó jẹ́.
- source_word: οἶκον
  choice: ilé
  rationale: Orísun Gíríìkì sọ ‘ilé’; bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kan tẹ́ńpìlì nínú àyíká rẹ̀, a kò fi ìtumọ̀ yẹn rọ́pò ọ̀rọ̀ orísun.
- source_word: οἰκοδομήσετέ
  choice: ẹ̀yin yóò kọ́
  rationale: Ó ń ṣàfihàn ọ̀rọ̀ ọjọ́ iwájú nínú ìbéèrè àròsọ, ìtumọ̀ náà sì tọ́ ní tààrà.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé fún κύριος nínú ọ̀rọ̀ tí Ọlọ́run sọ.
- source_word: τόπος
  choice: ibí
  rationale: ‘Ibí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi tàbí ààyè kan.
- source_word: καταπαύσεώς
  choice: ìsinmi
  rationale: Ó pa ìtumọ̀ ìsinmi tàbí dídáwọ́ iṣẹ́ dúró mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ Aísáyà tí Ọlọ́run Ísírẹ́lì ń sọ
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ẹ̀dà Májẹ̀mú Tuntun ti Gíríìkì ní κύριος; nítorí náà ‘Olúwa’ ni a lò dípò fífi orúkọ májẹ̀mú tí a máa ń fi gbogbo lẹ́tà ńlá kọ sínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti fi hàn pé ọ̀rọ̀-ìṣe Gíríìkì náà ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀. A tún gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé gan-an, kì í ṣe lẹ́yìn ‘ìtẹ́ mi.’
