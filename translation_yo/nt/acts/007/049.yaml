revisions:
- from: Ọ̀run ni ìtẹ́ mi, ilẹ̀ ayé sì ni àpótí tí mo fi ń ti ẹsẹ̀ mi.[a] Irú ilé wo ni ẹ̀yin yóò kọ́ fún mi, ni Olúwa wí, tàbí ibí wo ni ibi ìsinmi mi?
  to: Ọ̀run ni ìtẹ́ mi, ilẹ̀ ayé sì ni àpótí ìtìsẹ̀ mi.[a] Irú ilé wo ni ẹ̀yin yóò kọ́ fún mi, ni Olúwa wí, tàbí ibí wo ni mo ti lè sinmi?
  rationale: The revision uses the direct, idiomatic Yoruba expression “àpótí ìtìsẹ̀ mi” for “the footstool of my feet,” while retaining a footnote that makes the explicit reference to the speaker’s feet clear. The closing rhetorical question is recast in natural Yoruba without adding a specific theological interpretation.
