source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: yo
  text: Ó sì wí fún un pé, “Jáde kúrò ní ilẹ̀ rẹ àti lọ́dọ̀ àwọn ìbátan rẹ,[a] kí o sì wá sí ilẹ̀ tí èmi yóò fi hàn ọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “àwọn ará rẹ” tàbí “ìdílé rẹ.” Ọ̀rọ̀ Gíríìkì συγγένεια ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn tí ìbátan so pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: Ó sì wí fún un
  rationale: Èyí pa ọ̀nà ìsọ̀rọ̀ elédè Gíríìkì mọ́, ó sì dá orúkọ ẹni tí a ń bá sọ̀rọ̀ padà sí ọ̀rọ̀ arọ́pò-orúkọ bí ó ti rí nínú orísun.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Jáde kúrò ní ilẹ̀ rẹ
  rationale: “Jáde kúrò” fi ìṣípò kúrò ní ibìkan hàn kedere, “ilẹ̀” sì yẹra fún èrò orílẹ̀-èdè òde òní tí kò sí dandan nínú γῆ.
- source_word: ἐκ τῆς συγγενείας σου
  choice: àti láàárín àwọn ìbátan rẹ
  rationale: “Àwọn ìbátan” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹgbẹ́ àwọn ènìyàn tí ìbátan ẹ̀jẹ̀ tàbí ìdílé so pọ̀; “láàárín” mú ìtumọ̀ kíkúrò nínú ẹgbẹ́ náà jáde.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: kí o sì wá sí ilẹ̀
  rationale: “Wá” pa ìtọ́ka δεῦρο mọ́ dípò yíyí i sí “lọ,” “sí ilẹ̀” sì jẹ́ ọ̀nà Yorùbá tí ó rọrùn fún ìṣípò sí ibi kan.
- source_word: ἣν ἄν σοι δείξω
  choice: tí èmi yóò fi hàn ọ́
  rationale: “Yóò fi hàn” sọ ìtọ́ka ọjọ́ iwájú tí àkópọ̀ ἄν àti δείξω ní nínú àṣẹ yìí; “èmi” mú olùṣe náà hàn gedegbe láìfi àìdánilójú kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Jáde kúrò” àti “wá sí” pa àwòrán ìṣípò inú Gíríìkì mọ́, nígbà tí “àwọn ìbátan” jẹ́ kíkà tí ó ṣeé lóye fún òǹkàwé lónìí.
