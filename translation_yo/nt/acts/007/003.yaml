review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìlànà àṣẹ, ìṣípò kúrò nínú ilẹ̀, ìtọ́kasí ọjọ́ iwájú nínú ‘tí èmi yóò fi hàn ọ́,’ àti arọ́pò-orúkọ ‘fún un’ mọ́ dáadáa. Ṣùgbọ́n ‘láàárín àwọn ìbátan rẹ’ túmọ̀ sí wíwà ‘láàárín’ àwọn ìbátan, kì í sì ṣe ibi tí ẹni ń kúrò; nítorí náà kò ṣojú ἐκ τῆς συγγενείας σου ní ìdúróṣinṣin.
  naturalness: ‘Kúrò ní ilẹ̀ rẹ àti lọ́dọ̀ àwọn ìbátan rẹ’ jẹ́ Yorùbá ìgbàlódé tí ó mọ́gbọ́n dání, ó sì mú ìtumọ̀ ‘leave from your land and kindred’ hàn láìjẹ́ kí gbolohun náà dà bí ẹni pé a ń pa á láṣẹ láti dúró láàárín àwọn ìbátan.
  terminology: ‘Àwọn ìbátan’ jẹ́ yíyan tó yẹ fún συγγένεια nínú ẹsẹ̀ yìí, níwọ̀n bí ó ti ń tọ́ka sí ẹgbẹ́ ìbátan/ìdílé. Àlàyé ẹsẹ̀ ìsàlẹ̀ náà dáa, ó sì ń pèsè ‘àwọn ará rẹ’ àti ‘ìdílé rẹ’ gẹ́gẹ́ bí yíyan mìíràn.
