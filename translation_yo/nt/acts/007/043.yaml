id: ACT.7.43
reference: Acts 7:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: yo
  text: Ẹ sì gbé àgọ́ Mólókù àti ìràwọ̀ ọlọ́run náà, Réfánì[a], àwọn àwòrán[c] tí ẹ ṣe láti jọ́sìn wọ́n. Èmi yóò sì kó yín lọ sí ìgbèkùn kọjá Bábílónì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan, tí wọ́n ń tẹ̀ lé orísun Hébérù ní Ámósì 5:26, kà á sí ‘ọlọ́run yín Réfánì’ dípò ‘ọlọ́run náà, Réfánì.’ Ṣùgbọ́n ọ̀rọ̀ Gíríìkì Ìṣe níbí ní ‘ọlọ́run náà, Réfánì.’
    reason: alternative_reading
  - marker: b
    text: Ìṣe ní ‘kọjá Bábílónì.’ Ní Ámósì 5:27, a sábà máa ń tú ọ̀rọ̀ inú ẹsẹ tí a fà yọ náà sí ‘kọjá Damásíkù.’
    reason: cross_reference
  - marker: c
    text: Tàbí ‘àwọn ère’ tàbí ‘àwọn ohun ìṣàpẹẹrẹ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: ẹ gbé
  rationale: Ó túmọ̀ sí pé wọ́n gbé àwọn ohun ìjọsìn náà, wọ́n sì ń rù wọ́n. ‘Ẹ gbé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: σκηνὴν
  choice: àgọ́
  rationale: Ìtumọ̀ pàtó σκηνή ni ‘àgọ́.’ Èyí kò ní mú kí òǹkàwé rò pé àgọ́ mímọ́ Ọlọ́run ni, bí ọ̀rọ̀ kan tó túmọ̀ sí tabernákù ṣe lè rí.
- source_word: Μολὸχ
  choice: Mólókù
  rationale: A kọ orúkọ Gíríìkì náà sílẹ̀ ní ọ̀nà tó bá ìró àti ìkọ̀wé Yorùbá mu.
- source_word: ἄστρον
  choice: ìràwọ̀
  rationale: Ìtumọ̀ tààrà ἄστρον ni ‘ìràwọ̀’; a kò sọ ọ́ di àwòrán ìràwọ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: ọlọ́run Réfánì
  rationale: Èyí tẹ̀ lé Gíríìkì Ìṣe, tó ní ‘ọlọ́run Réfánì,’ kì í ṣe ‘ọlọ́run yín Réfánì.’ Lílò lẹ́tà kékeré fún ‘ọlọ́run’ fi hàn pé òrìṣà ni, kì í ṣe Ọlọ́run tòótọ́.
- source_word: Ῥαιφάν
  choice: Réfánì
  rationale: A ṣe àkọsílẹ̀ orúkọ Ῥαιφάν ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: τύπους
  choice: àwọn ère
  rationale: Nínú ọ̀rọ̀ nípa ìbọ̀rìṣà yìí, ‘àwọn ère’ sọ àwọn ohun tí wọ́n ṣe fún ìjọsìn ní kedere; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ míì mọ́.
- source_word: ἐποιήσατε
  choice: tí ẹ ṣe
  rationale: Ó fi ẹ̀sùn náà hàn ní tààrà pé àwọn fúnra wọn ló ṣe àwọn ohun wọ̀nyí.
- source_word: προσκυνεῖν αὐτοῖς
  choice: láti máa sìn wọ́n
  rationale: Nínú àyíká ẹ̀sìn, ‘sìn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ìjọsìn fún wọn, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè ní ìtumọ̀ foríbalẹ̀.
- source_word: μετοικιῶ
  choice: Èmi yóò sì kó yín lọ sí ìgbèkùn
  rationale: Ọ̀rọ̀ yìí sọ nípa fífi agbára mú àwọn ènìyàn kúrò ní ilẹ̀ wọn lọ sí ìgbèkùn. ‘Èmi’ mú ẹni tó ń sọ̀rọ̀, ìyẹn Ọlọ́run, hàn kedere gẹ́gẹ́ bí Gíríìkì ṣe tẹnu mọ́ ọn.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: ré kọjá Bábílónì
  rationale: ‘Ré kọjá’ mú ìtumọ̀ ἐπέκεινα, ìyẹn sí ìhà kejì tàbí jìnnà kọjá, jáde. ‘Bábílónì’ tẹ̀ lé ọ̀rọ̀ Gíríìkì Ìṣe láì mú un bá Ámósì mu.
theological_decisions:
- issue: Ọ̀rọ̀ tí Sítéfánù fa yàtọ̀ sí Ámósì nípa ibi tí ìgbèkùn yóò kọjá
  choice: ré kọjá Bábílónì
  alternative: ré kọjá Damásíkù
  rationale: Gíríìkì Ìṣe sọ ‘Bábílónì’ ní kedere. A pa ìyàtọ̀ yìí mọ́ dípò lílo ‘Damásíkù’ láti mú un bá Ámósì 5:27 mu.
- issue: Àpèjúwe Réfánì nínú Ìṣe àti nínú orísun Hébérù Ámósì
  choice: ọlọ́run Réfánì
  alternative: ọlọ́run yín Réfánì
  rationale: Ọ̀rọ̀ Gíríìkì Ìṣe ní ‘ọlọ́run Réfánì’; àṣàyàn mìíràn láti Hébérù Ámósì wà nínú àlàyé ìsàlẹ̀ ojú ewé láì yí ọ̀rọ̀ Ìṣe padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ, ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lò ‘àgọ́’ dípò ọ̀rọ̀ ìjọ tó lè tọ́ka sí àgọ́ mímọ́ Ọlọ́run, a sì lò ‘ọlọ́run’ pẹ̀lú lẹ́tà kékeré fún òrìṣà Réfánì.
