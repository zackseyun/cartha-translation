id: ACT.7.14
reference: Acts 7:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: yo
  text: Nígbà náà, Jósẹ́fù ránṣẹ́, ó sì pè Jákọ́bù, baba rẹ̀, àti gbogbo àwọn ìbátan Jósẹ́fù[a] wá—àádọ́rin àti márùn-ún ènìyàn lápapọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ibi kan nínú Májẹ̀mú Láéláé sọ pé àpapọ̀ wọn jẹ́ “àádọ́rin” (fún àpẹẹrẹ, ọ̀rọ̀ Hébérù ti Jẹ́nẹ́sísì 46:27 àti Ẹ́kísódù 1:5); ṣùgbọ́n Ìṣe 7:14 sọ pé “àádọ́rin àti márùn-ún.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: ránṣẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; “ránṣẹ́” sọ ìgbésẹ̀ náà ní Yorùbá àdánidá láì fi ẹni tàbí ohun tí a rán kún ohun tí Gíríìkì kò sọ.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ó ń tẹ ìtàn náà síwájú; “Nígbà náà ni” bá ìṣísẹ̀ ìtàn mu ní Yorùbá.
- source_word: μετεκαλέσατο
  choice: ó sì pe ... wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípe tàbí ránṣẹ́ sí ẹnì kan pé kí ó wá. “Pe ... wá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti òde òní.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Jákọ́bù baba rẹ̀
  rationale: Èyí pa ìtumọ̀ apposition náà mọ́ ní ọ̀nà tó rọrùn ní Yorùbá.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: gbogbo àwọn ìbátan rẹ̀
  rationale: συγγένεια ń tọ́ka sí gbogbo àwọn tó bá ẹni tan; “àwọn ìbátan” ṣe kedere ju ọ̀rọ̀ tí ó lè dín un kù sí àwọn ará ilé nìkan.
- source_word: ἐν ψυχαῖς
  choice: ènìyàn lápapọ̀
  rationale: Níhìn-ín, ψυχαί jẹ́ ọ̀nà ìṣírò ènìyàn, kì í ṣe àlàyé nípa ẹ̀mí. “Ènìyàn lápapọ̀” mú ìtumọ̀ ìṣírò náà jáde lọ́nà àdánidá.
- source_word: ἑβδομήκοντα πέντε
  choice: àádọ́rin-lé márùn-ún
  rationale: Ìtumọ̀ tààrà fún nọ́ńbà márùndínlọ́gọ́rin (75), tí a kọ ní ọ̀nà ọ̀rọ̀ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Àpapọ̀ nọ́ńbà àwọn ará ilé Jákọ́bù ní ìfiwéra pẹ̀lú àwọn ẹsẹ̀ inú Májẹ̀mú Láéláé
  choice: àádọ́rin-lé márùn-ún ènìyàn lápapọ̀
  alternative: àádọ́rin ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì inú Ìṣe 7:14 sọ márùndínlọ́gọ́rin ní kedere. A pa nọ́ńbà yìí mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìyàtọ̀ tó wà nínú àlàyé ìsàlẹ̀ dípò kí a mú àwọn ẹ̀rí ọ̀rọ̀ náà bá ara wọn mu láìsọ.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti ti òde òní. “Pe ... wá” àti “ènìyàn lápapọ̀” jẹ́ àdánidá fún òǹkàwé lásán, nígbà tí a pa ìyàtọ̀ nọ́ńbà inú ẹ̀rí ìwé mímọ́ mọ́.
