source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: yo
  text: Nígbà tí ó sì rí ẹnì kan tí wọ́n ń ṣe àìdájọ́ sí, ó gbèjà rẹ̀, ó sì gbẹ̀san fún ẹni tí wọ́n ń pọ́n lójú náà.[a] Ó ṣe bẹ́ẹ̀ nípa lílu ará Íjíbítì náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó mú ìdájọ́ òdodo wá fún ẹni tí wọ́n ń pọ́n lójú náà.” Gbólóhùn Gíríìkì ἐποίησεν ἐκδίκησιν lè ní ìtumọ̀ gbígbẹ̀san fún ẹnì kan tàbí ìdáláre rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa lílu ará Íjíbítì náà pa.” Ọ̀rọ̀ ìṣe Gíríìkì náà fúnra rẹ̀ lè túmọ̀ sí “lù”; àyíká ìtàn fi hàn pé ìlù náà yọrí sí ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Nígbà tí ó sì rí
  rationale: A tú aorist participle náà sí gbólóhùn àkókò ní Yorùbá àdánidá, láti fi ipò tó ṣáájú àwọn ìṣe pàtàkì hàn.
- source_word: τινα
  choice: ẹnì kan
  rationale: Ó pa àìdánimọ̀ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́ láìfi ‘ọkùnrin’ kún un.
- source_word: ἀδικούμενον
  choice: tí a ń ṣe ní àìtọ́
  rationale: Ó sọ ìwà àìṣòdodo tí ẹni náà ń jìyà rẹ̀ ní èdè Yorùbá tó ṣe kedere, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἠμύνατο
  choice: ó gbèjà rẹ̀
  rationale: Ó mú ìtumọ̀ wíwá sí ìrànlọ́wọ́ tàbí dídáàbò bo ẹni tí wọ́n ń ṣe níbi jáde.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: ó gbẹ̀san fún
  rationale: ‘Gbẹ̀san fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbésẹ̀ ìgbẹ̀san tàbí ìdáláre fún ẹni tí a ń pọ́n lójú; àlàyé ìsàlẹ̀ fi ìtumọ̀ míì hàn.
- source_word: τῷ καταπονουμένῳ
  choice: fún ẹni tí a ń ni lára
  rationale: Ó mú ìpọnjú líle tí ń ṣẹlẹ̀ sí ẹni náà àti dative ti àǹfààní jáde.
- source_word: πατάξας
  choice: nípa lílu
  rationale: Ó tú ìtumọ̀ gangan ti ‘lù’ láìfi ikú sínú ọ̀rọ̀ náà ní tààràtà; àyíká ló fi hàn pé ìlù náà yọrí sí ikú.
- source_word: τὸν Αἰγύπτιον
  choice: ará Íjíbítì náà
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání fún substantive ẹ̀yà-orílẹ̀-èdè náà.
theological_decisions:
- issue: Ìtumọ̀ ἐκδίκησιν nínú ìṣe Mósè
  choice: ó gbẹ̀san fún ẹni tí a ń ni lára
  alternative: ó mú ìdájọ́ òdodo wá fún ẹni tí a ń ni lára
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìgbẹ̀san tàbí ìdáláre. ‘Gbẹ̀san fún’ pa agbára gbolohun Gíríìkì mọ́, ṣùgbọ́n kò sọ pé Ìwé Mímọ́ ń fọwọ́ sí ìgbẹ̀san ara ẹni; àlàyé ìsàlẹ̀ pa ìtumọ̀ ìdájọ́ òdodo mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì àlàyé [a][b] sí lẹ́yìn gbogbo gbólóhùn tí àwọn àlàyé méjèèjì ń ṣàlàyé, láti yẹra fún fífi [b] mọ́ ἀδικούμενον ní àṣìṣe.
