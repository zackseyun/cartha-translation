  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: yo
  text: Ṣùgbọ́n Sólómọ́nì kọ́ ilé kan fún un[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́ńpìlì kan”; ní Gíríìkì, “ilé kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Sólómọ́n
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí Standard Yorùbá ṣe ń pe orúkọ Solomoni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ náà fi ìyàtọ̀ kékeré hàn, ó sì so ìtàn yìí pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú nípa ibùgbé Ọlọ́run.
- source_word: οἰκοδόμησεν
  choice: kọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí kíkọ́ ilé gidi; “kọ́” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Ọlọ́run; “fún un” jẹ́ ọ̀nà àdánidá láti sọ pé a kọ́ ilé náà fún ìlò tàbí ọlá rẹ̀.
- source_word: οἶκον
  choice: ilé kan
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “ilé.” Yíyan èyí dípò “tẹ́ńpìlì” pa àsọyé Sítéfánù àti ìforígbárí ọ̀rọ̀ tó wà ní àyíká ẹsẹ náà mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ οἶκον sí “ilé” tàbí “tẹ́ńpìlì”
  choice: ilé kan
  alternative: tẹ́ńpìlì kan
  rationale: Orísun Gíríìkì lo ọ̀rọ̀ gbogbogbò fún “ilé,” kì í ṣe ọ̀rọ̀ pàtó fún tẹ́ńpìlì. “Ilé” tún pa ìforígbárí ẹ̀kọ́ ọ̀rọ̀ náà mọ́, níwọ̀n bí ẹsẹ tó tẹ̀ lé e ti sọ pé Ẹni Gíga Jù Lọ kì í gbé inú ohun tí ọwọ́ ènìyàn kọ́.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó mọ́gbọ́n dání, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó bá yẹ.
