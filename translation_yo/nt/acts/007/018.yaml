  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: yo
  text: títí di ìgbà tí ọba mìíràn fi dìde lórí ilẹ̀ Ejibiti[a], ẹni tí kò mọ Jósẹ́fù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọba mìíràn kan dé ipò ìjọba lórí ilẹ̀ Ejibiti.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní tààrà sí “dìde.”
    reason: lexical_alternative
  - marker: b
    text: “Kò mọ Jósẹ́fù” tún lè túmọ̀ sí pé kò jẹ́wọ́ Jósẹ́fù tàbí pé kò ka Jósẹ́fù sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: títí di ìgbà tí
  rationale: Ó fi ààlà àkókò hàn ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ó ń bá a lọ títí iṣẹ̀lẹ̀ tuntun fi ṣẹlẹ̀.
- source_word: ἀνέστη
  choice: dìde láti jọba
  rationale: “Dìde” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, nígbà tí “láti jọba” mú ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ìfarahàn ọba tuntun ṣe kedere ní Yorùbá.
- source_word: βασιλεὺς ἕτερος
  choice: ọba mìíràn
  rationale: “Ọba” ni ìbámu tààrà fún βασιλεύς, “mìíràn” sì ya ọba yìí sọ́tọ̀ sí ẹni tí ó ṣáájú.
- source_word: ἐπ’ Αἴγυπτον
  choice: lórí Ejibiti
  rationale: Ó ṣàfihàn àṣẹ ìjọba lórí ilẹ̀ Ejibiti, kì í ṣe pé ọba náà wà níbẹ̀ lásán tàbí pé ó dojú kọ ilẹ̀ náà.
- source_word: οὐκ ᾔδει
  choice: kò mọ
  rationale: Ó pa ìtumọ̀ tààrà ti οἶδα mọ́, láìfi dandan pinnu bóyá àìmọ̀ ojú ẹni ni tàbí àìjẹ́wọ́ àti àìkà á sí.
- source_word: τὸν Ἰωσήφ
  choice: Jósẹ́fù
  rationale: Ìkọ̀wé orúkọ náà tẹ̀ lé àṣà Yorùbá tí ó wọ́pọ̀ fún orúkọ Bíbélì yìí.
theological_decisions:
- issue: Ìtumọ̀ “kò mọ Jósẹ́fù”
  choice: 'A pa ọ̀rọ̀ náà mọ́ ní fífẹ̀ rẹ̀: “kò mọ Jósẹ́fù.”'
  alternative: “Kò jẹ́wọ́ Jósẹ́fù” tàbí “kò ka Jósẹ́fù sí.”
  rationale: Gíríìkì lè ní ìtumọ̀ àìmọ̀ tàbí àìjẹ́wọ́/àìbọ̀wọ̀ fún ipa Jósẹ́fù. Kí a má bàa yan ọ̀kan ní dandan, a fi ọ̀rọ̀ gbooro náà sí inú ẹsẹ̀, a sì ṣàlàyé àwọn ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó rọrùn fún gbogbo ènìyàn láti lóye. A lo “dìde láti jọba” láti pa àwòrán Gíríìkì mọ́, kí ìtumọ̀ ìṣèlú rẹ̀ sì ṣe kedere; àwọn àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
