id: ACT.7.2
reference: Acts 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: yo
  text: 'Ó sì wí pé, “Ẹ̀yin arákùnrin àti àwọn baba, ẹ fetí sílẹ̀: Ọlọ́run ògo farahàn Ábúráhámù baba wa nígbà tí ó wà ní Mesopotámíà, kí ó tó gbé ní Háránì.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Ó sì wí pé
  rationale: ‘Sì’ fi ìbáṣepọ̀ ọ̀rọ̀ δέ hàn láìfi ìtakò tí kò pọndandan kún un; ‘wí pé’ jẹ́ ọ̀nà àtọwọ́dọ́wọ́, oníyì fún ìṣáájú ọ̀rọ̀.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Ẹ̀yin arákùnrin àti baba
  rationale: Ó pa ìtumọ̀ akọ àti ìbáṣepọ̀ ọ̀wọ̀ ti ìpè náà mọ́. Nínú Yorùbá, ‘ẹ̀yin’ àti àyíká ọ̀rọ̀ náà gbé ipa ἄνδρες, nítorí náà fífi ‘ọkùnrin’ sí i lọ́tọ̀ yóò le dà bí àkójọ ẹgbẹ́ mẹ́ta.
- source_word: ἀκούσατε
  choice: ẹ fetí sílẹ̀
  rationale: Àṣẹ taara tí ó ń pe àwùjọ láti fiyè sí ohun tí yóò sọ; ó jẹ́ Yorùbá àdánidá.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Ọlọ́run ògo
  rationale: Ó pa àkójọpọ̀ genitive náà àti ìró èdè Ìwé Mímọ́ mọ́, dípò yíyí i sí ‘Ọlọ́run ológo,’ èyí tí yóò mú un dà bí ajẹtífù nìkan.
- source_word: ὤφθη
  choice: farahàn
  rationale: Ó bá ìtumọ̀ passive ti ὁράω nínú àyíká ìfarahàn Ọlọ́run mu, láìṣàlàyé rẹ̀ sí ‘fi ara rẹ̀ hàn’ tàbí ‘ṣí ara rẹ̀ payá.’
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: Ábúráhámù baba wa
  rationale: Ètò ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìdánimọ̀ àjọṣe àwọn olùgbọ́ pẹ̀lú Ábúráhámù mọ́.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: nígbà tí ó wà ní Mesopotámíà
  rationale: Ó sọ ipa àsìkò/circumstantial ti participle náà di mímọ́ ní Yorùbá tó rọrùn.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: kí ó tó tẹ̀dó sí Háránì
  rationale: κατοικέω lè túmọ̀ sí gbé tàbí tẹ̀dó; ‘tẹ̀dó sí’ mú ìwọ̀n ìgbé ní ibì kan hàn, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìkíni akọ sí àwùjọ
  choice: Ẹ̀yin arákùnrin àti baba
  alternative: Ẹ̀yin ọkùnrin, arákùnrin àti baba
  rationale: A kò sọ ìpè akọ náà di aláìṣàkóso akọ; síbẹ̀, ‘ẹ̀yin ọkùnrin’ lọ́tọ̀ lè dà bí ẹni pé Gíríìkì ń dárúkọ ẹgbẹ́ mẹ́ta, nígbà tí ἄνδρες jẹ́ apá ìlànà ìpè oníyì.
- issue: Orúkọ oyè θεὸς τῆς δόξης
  choice: Ọlọ́run ògo
  alternative: Ọlọ́run ológo
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìṣètò genitive àti àṣà ọ̀rọ̀ Bíbélì mọ́, láìdín ọ̀rọ̀ náà kù sí àpèjúwe ajẹtífù.
- issue: Ìṣe κατοικέω ní Háránì
  choice: tẹ̀dó sí Háránì
  alternative: gbé ní Háránì
  rationale: Àwọn méjèèjì ṣeé ṣe; ‘tẹ̀dó sí’ mú ìwọ̀n ìdúróṣinṣin nínú κατοικέω hàn, ṣùgbọ́n kò fi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀rọ̀ oníyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘baba’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ lẹ́yìn ‘ẹ̀yin,’ èyí tí Yorùbá lè lò láìfi àmì ọ̀pọ̀ míì kún un.
