  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: yo
  text: Wọ́n sì ń sọ Stẹ́fánù ní òkúta, bí ó ti ń pè é, tí ó sì ń wí pé,[a] “Olúwa Jésù, gba ẹ̀mí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ti ń ké pe ẹni kan, tí ó sì ń wí pé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípè ẹni kan tàbí kíké pè é nínú àdúrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: ń sọ Stẹ́fánù ní òkúta
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ìsọni-lókùúta náà ń bá a lọ; “ń sọ ... ní òkúta” jẹ́ ọ̀nà àdánidá láti sọ ìṣe tó ń lọ lọ́wọ́ ní Yorùbá.
- source_word: ἐπικαλούμενον
  choice: bí ó ti ń ké pe Olúwa
  rationale: Participle náà lè túmọ̀ sí kíké pe ẹnì kan tàbí pípè é nínú àdúrà. Ọ̀rọ̀ yìí jẹ́ kí ó ṣe kedere pé Stẹ́fánù ń ké pe Jésù, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún ohun tí Gíríìkì sọ.
- source_word: λέγοντα
  choice: tí ó sì ń wí pé
  rationale: Èyí so ọ̀rọ̀ tí Stẹ́fánù sọ mọ́ kíké rẹ̀ ní ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: Κύριε Ἰησοῦ
  choice: Olúwa Jésù
  rationale: “Olúwa” jẹ́ ìtumọ̀ tó yẹ fún κύριος nínú ìpè tààrà sí Jésù, ó sì pa ọ̀wọ̀ àti ìjẹ́pàtàkì ọ̀rọ̀ náà mọ́.
- source_word: δέξαι
  choice: gba
  rationale: Àṣẹ aorist náà jẹ́ ẹ̀bẹ̀ pàtó; “gba” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì yẹ nínú àdúrà yìí.
- source_word: τὸ πνεῦμά μου
  choice: ẹ̀mí mi
  rationale: Nínú àyíká ikú yìí, “ẹ̀mí mi” ni ìtumọ̀ Yorùbá tó ṣe kedere jù fún ẹ̀mí ẹni tí ó fi lé Jésù lọ́wọ́.
theological_decisions:
- issue: Bóyá kí ìtumọ̀ náà fi hàn gbangba pé Stẹ́fánù ń ké pe Jésù gẹ́gẹ́ bí àdúrà tàbí ìpè ẹ̀bẹ̀
  choice: “bí ó ti ń ké pe Olúwa ... ‘Olúwa Jésù’”
  alternative: “bí ó ti ń pè é, tí ó sì ń wí pé”
  rationale: Gíríìkì fi Jésù hàn gẹ́gẹ́ bí ẹni tí Stẹ́fánù ń bá sọ̀rọ̀ tààrà. “Ń ké pe Olúwa” pa ìtumọ̀ ìpè tàbí àdúrà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ààyè sílẹ̀ fún ìtumọ̀ gbooro ti participle náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Sọ ... ní òkúta” jẹ́ gbólóhùn àdánidá fún ìsọni-lókùúta, “ń” sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
