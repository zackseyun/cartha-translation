  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n ké ní ohùn rara, wọ́n dí etí wọn, wọ́n sì fi ọkàn kan wọ́ ọ́ lórí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “papọ̀.” Ọ̀rọ̀ adáverbù Gíríìkì náà, ὁμοθυμαδόν, tẹnumọ́ pé wọ́n gbé ìgbésẹ̀ náà ní ìṣọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: wọ́n ké
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe igbe ńlá; ‘wọ́n ké’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe náà láìfi irú ìmọ̀lára kan kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó ní ìtakora díẹ̀ hàn láàárín ìran Sítéfánù àti ìhùwàsí ọ̀tá àwọn olùgbọ́ rẹ̀.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa àwòrán ohùn ńlá inú Gíríìkì mọ́.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: wọ́n dí etí wọn
  rationale: 'Èyí sọ àṣà-ọrọ Gíríìkì náà ní Yorùbá àdánidá: wọ́n mọ̀ọ́mọ̀ ṣe etí wọn kí wọ́n má bàa gbọ́.'
- source_word: ὥρμησαν
  choice: ró gìrì
  rationale: ‘Ró gìrì’ mú ìṣíkiri òjijì àti alágbára tí ọ̀rọ̀ Gíríìkì náà ní jáde, láìsọ ju ohun tí ọ̀rọ̀ náà wí lọ.
- source_word: ὁμοθυμαδὸν
  choice: jùmọ̀
  rationale: ‘Jùmọ̀’ fi hàn pé gbogbo wọn gbé ìgbésẹ̀ náà papọ̀; àlàyé ìṣọ̀kan èrò wọn wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐπ’ αὐτόν
  choice: sí i
  rationale: Lẹ́yìn ‘ró gìrì,’ ‘sí i’ fi ìdarí ìṣíkiri wọn sí ọ̀dọ̀ Sítéfánù hàn lọ́nà Yorùbá tó wọ́pọ̀, nígbà tí àyíká ọ̀rọ̀ fi ìwà ọ̀tá náà hàn.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ró gìrì sí i’ jẹ́ ọ̀nà àdánidá láti ṣàfihàn bí wọ́n ṣe sáré tọ̀ ọ́ lọ lójijì àti pẹ̀lú agbára; a kò fi ọ̀rọ̀ bí ‘kọlù’ kún un, kí ìtumọ̀ má bàa kọjá Gíríìkì.
