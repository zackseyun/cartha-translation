revisions:
- from: Ní ọjọ́ kejì, ó farahàn sí wọn nígbà tí wọ́n ń bá ara wọn jà, ó sì ń gbìyànjú láti mú kí wọ́n padà sí àlàáfíà[a]. Ó ní, “Ẹ̀yin ọkùnrin, ará ni yín[b]; èé ṣe tí ẹ fi ń ṣe ara yín ní ibi?”
  to: Ní ọjọ́ tó tẹ̀ lé e, ó farahàn sí wọn nígbà tí wọ́n ń bá ara wọn jà, ó sì ń gbìyànjú láti mú wọn làjà[a], ó ní, “Ẹ̀yin ọkùnrin, ará ni yín[b]; èé ṣe tí ẹ fi ń ṣe ara yín ní ibi?”
  rationale: Àtúnṣe náà mú ìtọ́kasí àkókò Gíríìkì náà pé ọjọ́ tó tẹ̀ lé e hàn kedere, ó sì rọ́pò ìmọ̀ “padà” tí kò hàn ní kedere nínú orísun pẹ̀lú ọ̀rọ̀ Yorùbá àdánidá “mú wọn làjà.” Àmì akọ́sẹ̀mọsẹ̀ méjèèjì wà ní ibi wọn, a sì tún ṣe àlàyé wọn kí wọ́n bá ìtumọ̀ tí a ṣàtúnṣe mu.
