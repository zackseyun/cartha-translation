id: ACT.7.26
reference: Acts 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: yo
  text: Ní ọjọ́ tó tẹ̀ lé e, ó farahàn sí wọn nígbà tí wọ́n ń bá ara wọn jà, ó sì ń gbìyànjú láti mú wọn làjà[a], ó ní, “Ẹ̀yin ọkùnrin, ará ni yín[b]; èé ṣe tí ẹ fi ń ṣe ara yín ní ibi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń mú wọn làjà.” Àkókò imperfect nínú èdè Gíríìkì lè tọ́ka sí ìṣe tí ó ń lọ lọ́wọ́; ṣùgbọ́n níbí, ó ṣeé ṣe kí ó túmọ̀ sí ìgbìyànjú Mósè láti mú wọn làjà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ jẹ́ arákùnrin.” Níbí, ọ̀rọ̀ náà ń tẹnumọ́ ìbátan wọn gẹ́gẹ́ bí ọmọ Ísírẹ́lì ẹlẹgbẹ́ ara wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Ní ọjọ́ kejì
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ọjọ́ tí ó tẹ̀ lé e; ‘ní ọjọ́ kejì’ jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́.
- source_word: ὤφθη
  choice: ó farahàn sí wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ ti ìṣe àgbàwí, ó sábà máa ń ní ìtumọ̀ aláìgbàwí pé ẹni kan farahàn; èyí sì bá ìtàn náà mu.
- source_word: αὐτοῖς μαχομένοις
  choice: sí wọn nígbà tí wọ́n ń bá ara wọn jà
  rationale: Ọ̀rọ̀ àfikún náà fi ìṣe tí ó ń lọ lọ́wọ́ hàn ní àkókò tí Mósè farahàn.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: ó ń gbìyànjú láti mú kí wọ́n padà sí àlàáfíà
  rationale: Àkókò imperfect àti àyíká ẹsẹ tó tẹ̀ lé e fi hàn pé Mósè ń ṣe ìgbìyànjú tí kò parí; ‘padà sí àlàáfíà’ sọ ìṣípò sí ipò àlàáfíà ní Yorùbá àdánidá.
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: Ẹ̀yin ọkùnrin, ará ni yín
  rationale: ‘Ẹ̀yin ọkùnrin’ pa ìpè Ἄνδρες mọ́, ‘ará ni yín’ sì fi ìbátan wọn gẹ́gẹ́ bí ọmọ Ísírẹ́lì ẹlẹgbẹ́ ara wọn hàn láìlo èdè àtijọ́.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: èé ṣe tí ẹ fi ń ṣe ara yín ní ibi?
  rationale: Èyí jẹ́ ìbéèrè nípa ìdí tí wọ́n fi ń ṣe ohun tí kò tọ́ sí ara wọn; gbólóhùn Yorùbá náà jẹ́ kedere, ó sì bójú mu ìtumọ̀ ìwà àìtọ́ tàbí ìpalára.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye. ‘Àlàáfíà’ àti ‘ará ni yín’ jẹ́ ọ̀rọ̀ àdánidá; a yẹra fún ìtumọ̀ líle tí yóò sọ συνήλλασσεν di ohun tí Mósè ṣàṣeyọrí, nígbà tí àyíká fi ìkọ̀sílẹ̀ ìgbìyànjú rẹ̀ hàn.
