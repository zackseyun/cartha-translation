id: ACT.7.4
reference: Acts 7:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: yo
  text: Nígbà náà, lẹ́yìn tí ó jáde kúrò ní ilẹ̀ àwọn ará Kálídíà, ó tẹ̀dó sí Háránì. Láti ibẹ̀ náà, lẹ́yìn tí baba rẹ̀ kú[b], Ọlọ́run[a] mú un kó wá sí ilẹ̀ yìí, níbi tí ẹ̀yin ń gbé nísinsin yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó mú un kó wá”; Gíríìkì kò sọ olùṣe náà ní pàtó, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Sítéfánù sọ pé Ọlọ́run mú un kó wá sí ilẹ̀ yìí lẹ́yìn tí baba rẹ̀ kú. Wo Gẹnẹ́sísì 11:32 àti 12:4 fún ìfiwéra nípa ìtẹ̀lé àkókò náà.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó ń ṣàfihàn ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú àtúnsọ Sítéfánù.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: lẹ́yìn tí ó jáde kúrò ní ilẹ̀ àwọn ará Kálídíà
  rationale: Ọ̀rọ̀ yìí pa ìtẹ̀lé àkókò mọ́, ó sì ṣetọju gbólóhùn kíkún náà, ‘ilẹ̀ àwọn ará Kálídíà.’
- source_word: κατῴκησεν
  choice: ó tẹ̀dó
  rationale: ‘Tẹ̀dó’ fi hàn pé ó lọ gbé ibẹ̀ gẹ́gẹ́ bí olùgbé, kì í ṣe pé ó wà níbẹ̀ fúngbà díẹ̀ nìkan.
- source_word: ἐν Χαρράν
  choice: sí Háránì
  rationale: Ìlò ‘sí’ bá ọ̀rọ̀-ìṣe ‘tẹ̀dó’ mu ní Yorùbá àdánidá; Háránì ni àkọtọ orúkọ ibẹ̀ tó wọ́pọ̀ ní Yorùbá.
- source_word: κἀκεῖθεν
  choice: Láti ibẹ̀
  rationale: Ó ṣetọju ìsopọ̀ ìtàn àti ìṣípadà láti Háránì.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: lẹ́yìn tí baba rẹ̀ kú
  rationale: Ó tú ìtumọ̀ àkókò inú articular infinitive náà jáde ní Yorùbá tó ṣe kedere.
- source_word: μετῴκισεν αὐτὸν
  choice: Ọlọ́run mú un kó wá
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí mímú ẹnì kan ṣí ibùgbé. A fi ‘Ọlọ́run’ hàn fún ìmọ̀ye gẹ́gẹ́ bí olùṣe tí àyíká ọ̀rọ̀ tọ́ka sí, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ olùṣe náà ní tààrà.
- source_word: εἰς τὴν γῆν ταύτην
  choice: sí ilẹ̀ yìí
  rationale: Ó pa ìtọ́kasí sí ilẹ̀ tí Sítéfánù àti àwọn olùgbọ́ rẹ̀ wà mọ́.
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: níbi tí ẹ̀yin ń gbé nísinsin yìí
  rationale: Èyí jẹ́ Yorùbá àdánidá fún gbígbé inú ilẹ̀ náà, ó sì tẹnu mọ́ ‘ẹ̀yin’ àti ‘nísinsin yìí.’
theological_decisions:
- issue: Olùṣe ọ̀rọ̀-ìṣe μετῴκισεν
  choice: A sọ olùṣe náà di ‘Ọlọ́run’ nínú àyọkà, pẹ̀lú àlàyé ẹsẹ̀ ìsàlẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní ‘ó mú un kó wá,’ láì sọ ta ni ‘ó’ ń tọ́ka sí.
  rationale: Gíríìkì kò sọ olùṣe náà ní orúkọ, ṣùgbọ́n àyíká ọ̀rọ̀ ṣáájú tọ́ka sí Ọlọ́run. Àlàyé ẹsẹ̀ ìsàlẹ̀ pa àìsọ-ní-pàtó inú Gíríìkì mọ́.
- issue: Ìtẹ̀lé àkókò ikú Térà àti ìṣí Abramu
  choice: 'A túmọ̀ ọ̀rọ̀ Sítéfánù gẹ́gẹ́ bí ó ṣe wà: ìṣí náà ṣẹlẹ̀ lẹ́yìn ikú baba rẹ̀.'
  alternative: Kí a tún gbólóhùn náà ṣe láti mú un bá ìṣírò àkókò kan nínú Gẹnẹ́sisi mu.
  rationale: Ìtumọ̀ kò gbọ́dọ̀ mú ìforígbárí tí ó lè hàn dẹ́rọ̀ nípasẹ̀ àtúnṣe; ó yẹ kí ó pa ọ̀rọ̀ àti ìtẹ̀lé ìtàn inú Ìṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Tẹ̀dó’ àti ‘ń gbé’ yà ìpilẹ̀ ibùgbé tuntun sọ́tọ̀ kúrò nínú gbígbé ní ilẹ̀ kan.
