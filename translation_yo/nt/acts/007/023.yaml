  to: Nígbà tí ó pé ọmọ ọdún ogójì,[a] ó wá sí ọkàn rẹ̀[b] láti lọ bẹ àwọn arákùnrin rẹ̀ wò, ìyẹn àwọn ọmọ Ísírẹ́lì.[c]
