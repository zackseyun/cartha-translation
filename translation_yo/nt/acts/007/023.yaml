source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: yo
  text: Nígbà tí ó pé ọmọ ọdún ogójì,[a] ó wá sí ọkàn rẹ̀[b] láti lọ bẹ àwọn arákùnrin rẹ̀ wò, ìyẹn àwọn ọmọ Ísírẹ́lì.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gígùn-ọ̀rọ̀: ‘nígbà tí àkókò ogójì ọdún ń pé fún un.’'
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gígùn-ọ̀rọ̀: ‘ó gòkè wá sí ọkàn rẹ̀.’ Èyí jẹ́ ọ̀nà àkànṣe fún èrò tàbí ìpinnu tó dìde nínú rẹ̀.'
    reason: lexical_alternative
  - marker: c
    text: ‘Àwọn arákùnrin rẹ̀’ níhìn-ín ni àwọn ọmọ ẹ̀yà rẹ̀, ìyẹn àwọn ọmọ Ísírẹ́lì; a tún lè túmọ̀ ọ́ sí ‘àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀.’
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nígbà tí ... sì
  rationale: Èyí fi ìyípadà sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn, ó sì pa ìtumọ̀ àkókò àti àsopọ̀ δὲ mọ́ ní Yorùbá àdánidá.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: ọjọ́ orí rẹ̀ ... fẹ́ pé ogójì ọdún
  rationale: Gbólóhùn Gíríìkì jẹ́ ọ̀nà àkànṣe láti sọ pé àkókò ogójì ọdún rẹ̀ ń sún mọ́ ìparí; ‘fẹ́ pé’ mú ìlọsíwájú inú ọ̀rọ̀-ìṣe náà jáde láì jẹ́ kí Yorùbá le.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: ó wá sí ọkàn rẹ̀
  rationale: Èyí pa àwòrán inú ọ̀rọ̀ orísun mọ́, ó sì lè túmọ̀ sí èrò tàbí ìpinnu tó dìde nínú ẹni.
- source_word: ἐπισκέψασθαι
  choice: láti lọ bẹ ... wò
  rationale: ‘Bẹ̀ ... wò’ jẹ́ ọ̀nà Yorùbá àdánidá fún lílọ ṣèbẹ̀wò; ọ̀rọ̀ orísun tún lè ní ìtumọ̀ yíyẹ ipò wọn wò tàbí bíbójútó wọn.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ ìbátan akọ ní Gíríìkì, ṣùgbọ́n àfikún tó tẹ̀ lé e fi hàn pé àwọn ọmọ orílẹ̀-èdè rẹ̀ ni a ń tọ́ka sí.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: ‘Àwọn ọmọ Ísírẹ́lì’ pa àṣà ọ̀rọ̀ Bíbélì mọ́, ó sì yàgò fún ‘àwọn ọmọkùnrin’ tí ó lè mú kí òǹkàwé rò pé àwọn ọkùnrin nìkan ni.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ àti ìdánimọ̀ ẹ̀yà
  choice: àwọn arákùnrin rẹ̀, ìyẹn àwọn ọmọ Ísírẹ́lì
  alternative: àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀
  rationale: Àṣàyàn náà pa èdè ìbátan inú Gíríìkì mọ́, nígbà tí ‘ìyẹn àwọn ọmọ Ísírẹ́lì’ ṣàlàyé pé àwọn ọmọ ẹ̀yà Mósè lápapọ̀ ni, kì í ṣe àwọn arákùnrin inú ilé rẹ̀ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún, a sì pa àwòrán ‘ọkàn’ àti èdè ìbátan orísun mọ́ láì mú kí gbólóhùn náà di líle.
