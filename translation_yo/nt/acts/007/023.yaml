  source_fidelity: Àkọsílẹ̀ náà túmọ̀ ọ̀pọ̀ èrò Gíríìkì náà dáadáa, pàápàá jù lọ ọ̀rọ̀ àkànṣe ‘ó wá sí ọkàn rẹ̀’ àti ìdánimọ̀ àwọn arákùnrin náà gẹ́gẹ́ bí ọmọ Ísírẹ́lì. Ṣùgbọ́n ‘ọjọ́ orí rẹ̀ ... fẹ́ pé ogójì ọdún’ sọ pé Mósè ṣì kù díẹ̀ kí ó pé ogójì, nígbà tí ἐπληροῦτο ... τεσσερακονταετὴς χρόνος ń tọ́ka sí ìmúṣẹ/ìpéye àkókò ogójì ọdún fún un. A kò gbọ́dọ̀ fi ìtumọ̀ ‘fẹ́rẹ̀ẹ́ pé’ sínú ọ̀rọ̀ àkọ́kọ́.
  naturalness: Yorùbá ìtumọ̀ yòókù dára, ó sì ní àmì ohùn tó yẹ. ‘Nígbà tí ó pé ọmọ ọdún ogójì’ jẹ́ ọ̀nà ìgbàlódé, kedere, àti àdánidá ju ‘ọjọ́ orí rẹ̀ ... fẹ́ pé ogójì ọdún’ lọ. ‘Lọ bẹ ... wò’ jẹ́ ọ̀nà tí a lè lò fún ṣíṣèbẹ̀wò.
  terminology: ‘Àwọn arákùnrin rẹ̀, ìyẹn àwọn ọmọ Ísírẹ́lì’ pa ìbátan àti àpèjúwe ẹ̀yà inú Gíríìkì mọ́. ‘Àwọn ọmọ Ísírẹ́lì’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó dára, kò sì dín un kù sí àwọn ọmọkùnrin nìkan.
