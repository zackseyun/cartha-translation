source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: yo
  text: Ọkùnrin yìí[a] fi ọgbọ́n àrékérekè hùwà sí àwọn ènìyàn wa, ó sì hùwà ìkà sí àwọn baba wa[c], ó mú kí wọ́n kọ àwọn ọmọ kékeré wọn sílẹ̀ níta[b], kí a má bàa jẹ́ kí àwọn ọmọ náà wà láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ẹ̀tàn hùwà sí àwọn ènìyàn wa.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ lílo ọgbọ́n àrékérekè tàbí ẹ̀tàn sí wọn.
    reason: lexical_alternative
  - marker: b
    text: Èyí túmọ̀ sí pé kí wọ́n fi àwọn ọmọ wọn sílẹ̀ níta láìtọ́jú wọn, pẹ̀lú ète pé kí àwọn ọmọ náà kú.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn baba ńlá wa.” Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀ ìbátan ìdílé ìbílẹ̀ fún àwọn baba ńlá Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-atọ́ka náà mọ́, ó sì tọ́ka sí ọba tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, dípò lílo ‘ó’ lásán.
- source_word: κατασοφισάμενος
  choice: fi ọgbọ́n àrékérekè bá ... lò
  rationale: Ó fi ọgbọ́n tí ẹ̀tàn àti ète búburú wà nínú rẹ̀ hàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ ṣe ń béèrè.
- source_word: τὸ γένος ἡμῶν
  choice: àwọn ènìyàn wa
  rationale: Níhìn-ín, γένος ń tọ́ka sí àwọn ènìyàn Ísírẹ́lì gẹ́gẹ́ bí ẹ̀yà kan; ìtumọ̀ yìí jẹ́ ti èdè Yorùbá àdánidá, kò sì dá a mọ́ ọ̀rọ̀ nípa ìran ẹ̀jẹ̀ nìkan.
- source_word: ἐκάκωσεν
  choice: hùwà ìkà sí
  rationale: Ó sọ ìpalára àti ìlòkulò tí ọ̀rọ̀-ìṣe náà túmọ̀ sí ní èdè Yorùbá tó ṣe kedere, láìfi irú ìnilára pàtó kan kún un.
- source_word: τοὺς πατέρας
  choice: àwọn baba wa
  rationale: Ó pa àwòrán ìbátan ìdílé inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká fi hàn pé àwọn baba ńlá Ísírẹ́lì ni.
- source_word: τοῦ ποιεῖν
  choice: ó mú kí wọ́n
  rationale: Ìtúmọ̀ olùfa yìí bá ìsopọ̀ infinitive náà mu, kò sì fi agbára ìfipámú tí ó lágbára ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ kún un.
- source_word: τὰ βρέφη
  choice: àwọn ọmọ ọwọ́ wọn
  rationale: ‘Ọmọ ọwọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọmọ kékeré gan-an tàbí ìkókó, ó sì bá βρέφη mu.
- source_word: ἔκθετα
  choice: kọ ... sílẹ̀ níta
  rationale: Ó ṣàfihàn fífi àwọn ọmọ síta àti fífi wọ́n sílẹ̀, ìyẹn àṣà ìkọ̀sílẹ̀ tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: kí a má bàa jẹ́ kí àwọn ọmọ náà wà láàyè
  rationale: Ó pa ète tàbí àbájáde àti ìtumọ̀ passive ti ‘má ṣe pa mọ́ láàyè’ mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Ọgbọ́n àrékérekè’ pa ìtumọ̀ ẹ̀tàn mọ́; ‘kọ ... sílẹ̀ níta’ mú àṣà exposure yé ni kúkúrú, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
