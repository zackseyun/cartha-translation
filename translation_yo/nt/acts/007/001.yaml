  text: Then the high priest said[a], “Are these things so?”
translation:
  language: yo
  text: Nígbà náà, olórí àlùfáà náà wí pé,[a] “Ǹjẹ́ bẹ́ẹ̀ ni àwọn nǹkan wọ̀nyí rí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ǹjẹ́ bẹ́ẹ̀ ni?” tàbí, ní ṣíṣàlàyé sí i, “Ǹjẹ́ òótọ́ ni àwọn ẹ̀sùn wọ̀nyí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ aorist ti λέγω, ó sì túmọ̀ sí ‘wí’ tàbí ‘sọ’; ‘wí pé’ bá ìtàn Yorùbá mu nígbà tí ọ̀rọ̀ tààrà ń tẹ̀ lé e, láì sọ ọ́ di ‘béèrè’ lásán.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń mú ìtàn lọ síwájú láti inú ẹ̀sùn tí a ṣẹ̀ṣẹ̀ sọ; ‘Nígbà náà ni’ jẹ́ àsopọ̀ ìtàn tó ṣe kedere ní Yorùbá.
- source_word: ἀρχιερεύς
  choice: àlùfáà àgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó yẹ fún olórí àlùfáà kan ṣoṣo tó ń darí ìgbẹ́jọ́ náà; kò túmọ̀ sí àwùjọ àwọn olórí àlùfáà.
- source_word: Εἰ
  choice: Ǹjẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰ sábà máa ń túmọ̀ sí ‘bí,’ ó ń ṣí ìbéèrè bẹ́ẹ̀-ni/bẹ́ẹ̀-kọ́ sílẹ̀ níhìn-ín; ‘Ǹjẹ́’ ni ìbámu Yorùbá tó bá a mu.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ẹ̀sùn tí a ṣẹ̀ṣẹ̀ gbé kalẹ̀. ‘Àwọn nǹkan wọ̀nyí’ pa ìtumọ̀ gbooro rẹ̀ mọ́; ‘àwọn ẹ̀sùn wọ̀nyí’ yóò jẹ́ ìtumọ̀ àlàyé sí i.
- source_word: οὕτως
  choice: bẹ́ẹ̀
  rationale: Ní inú ọ̀rọ̀ àsọyé οὕτως ἔχει, οὕτως túmọ̀ sí pé nǹkan rí gẹ́gẹ́ bí a ti sọ ọ́; ‘bẹ́ẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἔχει
  choice: rí
  rationale: Nínú àsọyé οὕτως ἔχει, ἔχει túmọ̀ sí ‘rí bẹ́ẹ̀’ tàbí ‘jẹ́ òótọ́ bí a ti sọ’; ‘rí bẹ́ẹ̀’ mú ìtumọ̀ ọ̀rọ̀ náà jáde lọ́nà àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa fọ́ọ̀mù ‘wí pé’ mọ́ dípò yíyí rẹ̀ sí ‘béèrè,’ a sì fi ìtumọ̀ àlàyé ‘ẹ̀sùn’ sínú àlàyé ìsàlẹ̀ nìkan.
