id: ACT.7.5
reference: Acts 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: yo
  text: Kò sì fún un ní ogún kankan nínú ilẹ̀ náà[a], àní ibi tí ó tó fún ẹsẹ̀ kan pàápàá. Ṣùgbọ́n ó ṣèlérí láti fi ilẹ̀ náà fún un gẹ́gẹ́ bí ohun ìní, àti fún irú-ọmọ rẹ̀ lẹ́yìn rẹ̀[b], bí ó tilẹ̀ jẹ́ pé kò tíì ní ọmọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àní ẹsẹ̀ ilẹ̀ kan pàápàá.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àkànlò èdè fún apá ilẹ̀ tí ó kéré jù lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí, “nígbà tí kò tíì ní ọmọ.” Ìṣètò ọ̀rọ̀ Gíríìkì lè tọ́ka sí àkókò, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi agbára sí ìtumọ̀ náà pé Ọlọ́run ṣèlérí láìka àìní ọmọ rẹ̀ sí.
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: ogún
  rationale: “Ogún” pa ìtumọ̀ ìpín ilẹ̀ tí a jogún mọ́, ó sì bá àyíká májẹ̀mú Ọlọ́run pẹ̀lú Ábúráhámù mu ju ọ̀rọ̀ gbogbogbò bí “dúkìá” lọ.
- source_word: οὐδὲ βῆμα ποδός
  choice: àní ibi tí ó tó fún ẹsẹ̀ kan pàápàá
  rationale: Èyí jẹ́ ọ̀nà àkànlò èdè fún apá ilẹ̀ tí ó kéré jù lọ; ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì pa àwòrán ẹsẹ̀ inú Gíríìkì mọ́.
- source_word: ἐπηγγείλατο
  choice: ṣèlérí
  rationale: “Ṣèlérí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìlérí tí Ọlọ́run dá, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: εἰς κατάσχεσιν
  choice: gẹ́gẹ́ bí ohun ìní
  rationale: Ó sọ pé ilẹ̀ náà yóò di ohun tí Ábúráhámù àti irú-ọmọ rẹ̀ ní, ó sì mú ipa àbájáde εἰς κατάσχεσιν jáde ní kedere.
- source_word: σπέρματι
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” lè jẹ́ àkójọpọ̀ àwọn àtọmọdọ́mọ, ó sì pa èdè ìlérí Ábúráhámù mọ́ láìdín un kù sí ọmọ kan ṣoṣo.
- source_word: μετ’ αὐτόν
  choice: lẹ́yìn rẹ̀
  rationale: Ìtumọ̀ tààrà yìí tọ́ka sí irú-ọmọ tí yóò tẹ̀ lé Ábúráhámù.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: bí ó tilẹ̀ jẹ́ pé kò tíì ní ọmọ
  rationale: 'Ó mú ipa ìyàlẹ́nu àti ìtakora tó wà nínú àyíká ọ̀rọ̀ jáde: Ọlọ́run ṣe ìlérí náà nígbà tí Ábúráhámù kò tíì ní ọmọ.'
- source_word: τέκνου
  choice: ọmọ
  rationale: τέκνον túmọ̀ sí ọmọ láìfi àkọ tàbí abo hàn; “ọmọ” ni Yorùbá tó pé jù lọ níbí.
theological_decisions:
- issue: Ìtumọ̀ àyídá ti àìní ọmọ Ábúráhámù nígbà ìlérí
  choice: bí ó tilẹ̀ jẹ́ pé kò tíì ní ọmọ
  alternative: nígbà tí kò tíì ní ọmọ
  rationale: Genitive absolute náà lè jẹ́ ti àkókò, ṣùgbọ́n àyíká ọ̀rọ̀ tẹnumọ́ pé Ọlọ́run ṣe ìlérí náà láìka àìní ọmọ Ábúráhámù sí. A fi àṣàyàn ti àkókò sínú àlàyé ìsàlẹ̀ láti pa àìdánilójú gírámà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ilẹ̀ náà” ní ìbẹ̀rẹ̀ àti lẹ́yìn náà láti mú atọ́ka ἐν αὐτῇ / αὐτήν ṣe kedere ní Yorùbá. “Kò tíì ní ọmọ” fi hàn pé àìní ọmọ náà jẹ́ ipò ní àkókò ìlérí, kì í ṣe àìní ọmọ títí láé.
