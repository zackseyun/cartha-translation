  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìṣètò ẹsẹ̀ Gíríìkì dáadáa, ó sì dá Mósè mọ́ gẹ́gẹ́ bí ẹni tí áńgẹ́lì sọ̀rọ̀ fún ní Sínáì. Ṣùgbọ́n “ń bá a sọ̀rọ̀” lè túmọ̀ sí ìjíròrò láàárín méjèèjì, nígbà tí λαλοῦντος αὐτῷ sọ pé áńgẹ́lì ń sọ̀rọ̀ fún un. Bákan náà, “ọ̀rọ̀ àṣẹ” dín λόγια kù sí àwọn àṣẹ, níbi tí ọ̀rọ̀ náà ti túmọ̀ sí àwọn ọ̀rọ̀ ìṣípayá Ọlọ́run ní fífẹ̀.
