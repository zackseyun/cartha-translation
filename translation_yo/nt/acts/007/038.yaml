id: ACT.7.38
reference: Acts 7:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: yo
  text: Èyí ni ẹni tí ó wà nínú àpéjọ ní aginjù, pẹ̀lú áńgẹ́lì tí ń sọ̀rọ̀ fún un lórí Òkè Sínáì, àti pẹ̀lú àwọn baba wa.[a] Òun ni ó gba àwọn ọ̀rọ̀ ìṣípayá alààyè[b] láti fi fún wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn baba wa” ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì; a tún lè túmọ̀ rẹ̀ sí “àwọn baba ńlá wa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ọ̀rọ̀ alààyè,” tàbí “àwọn ọ̀rọ̀ ìṣípayá tí ń fúnni ní ìyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ìjọ ènìyàn
  rationale: Ó túmọ̀ sí àpéjọ àwọn ènìyàn Ísírẹ́lì ní aginjù, láì fi ìtumọ̀ ilé-iṣẹ́ ‘ṣọ́ọ̀ṣì’ ti ìgbà tó tẹ̀ lé e wọ inú ẹsẹ náà.
- source_word: ἐρήμῳ
  choice: aginjù
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bá àyíká ìrìn-àjò Ísírẹ́lì mu jù lọ.
- source_word: ἀγγέλου
  choice: áńgẹ́lì
  rationale: Nínú àyíká Sínáì yìí, ẹni ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe òjíṣẹ́ ènìyàn.
- source_word: λαλοῦντος
  choice: tí ń bá a sọ̀rọ̀
  rationale: Ìtumọ̀ yìí pa ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ὄρει Σινᾶ
  choice: Òkè Sínáì
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún orúkọ ibi náà.
- source_word: πατέρων ἡμῶν
  choice: àwọn baba wa
  rationale: Ó pa àwòrán akọ inú Gíríìkì mọ́, ó sì ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì.
- source_word: ἐδέξατο
  choice: gba
  rationale: Ó fi Mósè hàn gẹ́gẹ́ bí ẹni tó gba ìṣípayá Ọlọ́run.
- source_word: λόγια
  choice: àwọn ọ̀rọ̀ àṣẹ
  rationale: λόγια jẹ́ àwọn ọ̀rọ̀ tí Ọlọ́run sọ; ‘ọ̀rọ̀ àṣẹ’ pa ìwúwo ìṣípayá mímọ́ náà mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ζῶντα
  choice: alààyè
  rationale: Ó pa ìtumọ̀ tààrà ‘tí ó wà láàyè’ àti ìjinlẹ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì sọ ọ́ di ‘tí ń fúnni ní ìyè’ nìkan.
- source_word: δοῦναι
  choice: láti fi fún
  rationale: Ó ṣàfihàn ète tí Mósè fi gba àwọn ọ̀rọ̀ náà.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó pa bí Sítéfánù ṣe dá ara rẹ̀ àti àwọn olùgbọ́ rẹ̀ mọ́ ìtàn májẹ̀mú Ísírẹ́lì mọ́.
- source_word: ὁ γενόμενος
  choice: ẹni tí ó wà
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ẹni tó wà ní àyíká náà; ‘ẹni tí ó di’ yóò le jù níbí.
theological_decisions:
- issue: Bóyá kí ἐκκλησίᾳ túmọ̀ sí ‘ìjọ’ ní ìtumọ̀ ṣọ́ọ̀ṣì tàbí àpéjọ Ísírẹ́lì
  choice: ìjọ ènìyàn
  alternative: ìjọ; àpéjọ
  rationale: ‘Ìjọ ènìyàn’ fi hàn pé àwọn ènìyàn Ísírẹ́lì tí ó péjọ ni a ń sọ̀rọ̀ nípa wọn, láì fipá mú ìtumọ̀ rẹ̀ sí ṣọ́ọ̀ṣì májẹ̀mú tuntun.
- issue: Bóyá kí λόγια ζῶντα túmọ̀ ní ọ̀nà ìtumọ̀ sí ‘àwọn ọ̀rọ̀ tí ń fúnni ní ìyè’
  choice: àwọn ọ̀rọ̀ àṣẹ alààyè
  alternative: àwọn ọ̀rọ̀ alààyè; àwọn ọ̀rọ̀ àṣẹ tí ń fúnni ní ìyè
  rationale: 'Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì tó ṣókí àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́: àwọn ọ̀rọ̀ náà jẹ́ alààyè, ṣùgbọ́n a kò dín ìtumọ̀ náà kù sí pé wọ́n ń fúnni ní ìyè nìkan.'
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìjọ ènìyàn’ láti yà àpéjọ Ísírẹ́lì ní aginjù sọ́tọ̀ kúrò nínú ìtumọ̀ ṣọ́ọ̀ṣì gẹ́gẹ́ bí ilé-iṣẹ́. Gbogbo àmì ìsàlẹ̀-ìwé inú àkọọ́lẹ̀ fara hàn nínú ẹsẹ.
