revisions:
- from: Èyí ni ẹni tí ó wà nínú ìjọ ènìyàn ní aginjù, pẹ̀lú áńgẹ́lì tí ń bá a sọ̀rọ̀ lórí Òkè Sínáì, àti pẹ̀lú àwọn baba wa.[a] Ó gba àwọn ọ̀rọ̀ àṣẹ alààyè[b] láti fi fún wa.
  to: Èyí ni ẹni tí ó wà nínú àpéjọ ní aginjù, pẹ̀lú áńgẹ́lì tí ń sọ̀rọ̀ fún un lórí Òkè Sínáì, àti pẹ̀lú àwọn baba wa.[a] Òun ni ó gba àwọn ọ̀rọ̀ ìṣípayá alààyè[b] láti fi fún wa.
  rationale: Àtúnṣe náà mú ìtọ́kasí “sọ̀rọ̀ fún un” bá ìdarí αὐτῷ mu, ó lo “àpéjọ” fún ἐκκλησίᾳ ní ọ̀nà tí kò ní èrò ṣọ́ọ̀ṣì àfikún, ó sì gbòòrò “λόγια” kúrò ní àwọn àṣẹ nìkan sí àwọn ọ̀rọ̀ ìṣípayá. A pa ìṣòro ìtumọ̀ ζῶντα mọ́ nípasẹ̀ “alààyè,” àti àwọn àmì ìsàlẹ̀-ìwé ṣì wà ní ibi tí ó yẹ.
