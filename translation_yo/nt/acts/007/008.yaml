id: ACT.7.8
reference: Acts 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: yo
  text: Ó sì fún un ní májẹ̀mú ìkọlà. Báyìí ni Abrahamu ṣe bí Isaaki, ó sì kọ ọ́ ní ilà ní ọjọ́ kẹjọ; Isaaki sì bí Jakọbu, Jakọbu sì bí àwọn baba ńlá méjìlá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: májẹ̀mú ìkọlà
  rationale: “Májẹ̀mú” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún διαθήκη nínú ìtàn ìbáṣepọ̀ Ọlọ́run pẹ̀lú Abrahamu; “ìkọlà” ń ṣàpèjúwe májẹ̀mú tí àmì rẹ̀ jẹ́ kíkọ ilà.
- source_word: οὕτως
  choice: Nípa bẹ́ẹ̀
  rationale: Ó pa ìsopọ̀ ìtẹ̀síwájú tàbí àbájáde mọ́ láàárín fífún Abrahamu ní májẹ̀mú àti ohun tó tẹ̀ lé e.
- source_word: ἐγέννησεν
  choice: bí
  rationale: “Bí” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún jíjẹ́ baba ọmọ kan, ó sì bá ìlà ìran akọ tó wà nínú ẹsẹ náà mu láì lo èdè àtijọ́.
- source_word: περιέτεμεν
  choice: kọ ọ́ ní ilà
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí ṣíṣe ìkọlà fún ẹni kan, ó sì ṣe kedere nínú àyíká yìí.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ní ọjọ́ kẹjọ
  rationale: Èyí ni ìtumọ̀ àkókò tó ṣe déédé pẹ̀lú Gíríìkì, láì fi “lẹ́yìn ìbí” kún ohun tí kò hàn gbangba nínú ẹsẹ náà.
- source_word: πατριάρχας
  choice: àwọn baba ńlá
  rationale: Nínú àyíká ìtàn Ísírẹ́lì, ọ̀rọ̀ náà tọ́ka sí àwọn baba olùdásílẹ̀ ẹ̀yà méjìlá; “àwọn baba ńlá” jẹ́ èdè Yorùbá tó yé àwọn òǹkàwé òde òní.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaaki / Jakọbu
  rationale: Àwọn ìrísí orúkọ wọ̀nyí jẹ́ èyí tí a mọ̀ dáadáa nínú ìlò Bíbélì Yorùbá, tí a sì kọ pẹ̀lú ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ májẹ̀mú Abrahamu
  choice: “májẹ̀mú ìkọlà” gẹ́gẹ́ bí májẹ̀mú pàtó tí a ti mọ̀
  alternative: “májẹ̀mú kan nípa ìkọlà”
  rationale: Àyíká Jẹ́nẹ́sísì 17 àti ìtàn tí Stefanu ń sọ fi hàn pé májẹ̀mú pàtó tí Ọlọ́run fún Abrahamu ni a ń tọ́ka sí; èdè Yorùbá kò nílò àmì ọ̀rọ̀ tó bá “the” mu láti fi ìpàtó yìí hàn.
- issue: Ìtumọ̀ γεννάω nínú ìlà ìran
  choice: “bí” fún gbogbo ìlà ìran
  alternative: “di baba” tàbí “jẹ́ baba”
  rationale: “Bí” pa ìtumọ̀ ìbímọ akọ àti ìtẹ̀síwájú ìran mọ́ ní ọ̀nà kúkúrú, àdánidá, láì mú ẹ̀kọ́ ìsìn míì wọlé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A fi “Abrahamu” sínú gbolohun kejì dípò arọ́pò-orúkọ nítorí Yorùbá lè mú “ó” dà bí ẹni pé Ọlọ́run ni ó bí Isaaki; ìmúlẹ̀ orúkọ náà mú ẹni tí ó ṣe iṣẹ́ náà ṣe kedere láì yí ìtumọ̀ orísun padà. A yà iṣẹ́-ìṣe méjèèjì sí “Abrahamu bí Isaaki, ó sì kọ ọ́ ní ilà” kí ẹni tí a kọ ní ilà má bà a dàrú.
