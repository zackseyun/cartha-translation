source:
  edition: SBLGNT
  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: yo
  text: Ṣé o fẹ́ pa mí bí o ti pa ará Ejibiti náà lánàá?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: Ṣé o fẹ́
  rationale: Ìbéèrè yìí ń retí ìdáhùn òdì; ‘Ṣé o fẹ́’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá láìfi ìtumọ̀ míì kún un.
- source_word: ἀνελεῖν
  choice: pa
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípa ènìyàn, kì í ṣe yíyọ ohun kan kúrò lásán.
- source_word: ὃν τρόπον
  choice: bí
  rationale: 'Ó fi ọ̀nà tàbí ìfarajọ hàn: ‘bí o ti ...’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá èdè ìpilẹ̀ mu.'
- source_word: τὸν Αἰγύπτιον
  choice: ará Ejibiti náà
  rationale: Ó tọ́ka sí ọmọ orílẹ̀-èdè Ejibiti kan pàtó tí a ti mẹ́nu kàn.
- source_word: ἐχθὲς
  choice: lánàá
  rationale: Ìtumọ̀ tààrà ni ‘ní ọjọ́ tó ṣáájú òní.’
theological_decisions: []
translation_notes:
  register: Yorùbá àkókò-òní tó ṣe kedere, tó níyì, tí ó sì jẹ́ àdánidá fún ọ̀rọ̀ ẹnu. A pa ìbéèrè tó ń retí ìdáhùn òdì mọ́ nípasẹ̀ ‘Ṣé,’ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
