id: ACT.7.45
reference: Acts 7:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: yo
  text: Àgọ́ náà ni àwọn baba ńlá wa, lẹ́yìn tí wọ́n gbà á lọ́wọ́ àwọn tó ṣáájú wọn[b], mú wọ ilẹ̀ náà pẹ̀lú Jóṣúà[a], nígbà tí wọ́n gba ilẹ̀ àwọn orílẹ̀-èdè tí Ọlọ́run lé kúrò níwájú àwọn baba ńlá wa. Àgọ́ náà sì wà títí di ọjọ́ Dafidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orúkọ náà ní Gíríìkì ni Ἰησοῦς, ẹni tí a lè pè ní Jésù tàbí Jóṣúà. Níhìn-ín, Jóṣúà ọmọ Nún ni a ń tọ́ka sí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “lẹ́yìn tí àwọn baba ńlá wa gba á ní ìtẹ̀lé, wọ́n mú un wọ ilẹ̀ náà.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé a gba àgọ́ náà lọ́wọ́ ìran tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Àgọ́ yìí ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ abo náà ń tọ́ka sí àgọ́ ẹ̀rí tí ẹsẹ tó ṣáájú mẹ́nu kàn. Títún orúkọ náà sọ mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: εἰσήγαγον
  choice: mú wọ ilẹ̀ náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘mú wọ inú’ tàbí ‘kó wọ inú.’ ‘Mú wọ ilẹ̀ náà’ bá àgọ́ àti ọ̀rọ̀ nípa wíwọ ilẹ̀ Kénáánì mu lọ́nà àdánidá.
- source_word: διαδεξάμενοι
  choice: tí wọ́n gbà á lọ́wọ́ àwọn tó ṣáájú wọn
  rationale: Ó fi hàn pé wọ́n gba àgọ́ náà gẹ́gẹ́ bí ogún tàbí ohun tí a ń fi lé ìran tó tẹ̀ lé lọ́wọ́; ó ṣàfihàn ìtẹ̀síwájú láti ìran dé ìran.
- source_word: οἱ πατέρες ἡμῶν
  choice: àwọn baba ńlá wa
  rationale: Èyí pa èdè ìtàn àwọn baba ìran Ísírẹ́lì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu láti sọ ‘our fathers’ nínú àyíká yìí.
- source_word: μετὰ Ἰησοῦ
  choice: pẹ̀lú Jóṣúà
  rationale: Ἰησοῦ lè jẹ́ Jésù tàbí Jóṣúà ní Gíríìkì, ṣùgbọ́n àyíká ìtàn wíwọ ilẹ̀ náà lẹ́yìn Mósè fi hàn pé Jóṣúà ọmọ Nún ni a ń tọ́ka sí.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: nígbà tí wọ́n gba ilẹ̀ àwọn orílẹ̀-èdè
  rationale: κατάσχεσις ń tọ́ka sí gbígba ohun kan ní ìní tàbí gbígba ilẹ̀. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì jẹ́ kedere pé ilẹ̀ àwọn orílẹ̀-èdè Kénáánì ni ọ̀rọ̀ náà dá lé.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: tí Ọlọ́run lé kúrò
  rationale: ἐξωθέω túmọ̀ sí lé jáde tàbí lé kúrò; ‘lé kúrò’ ṣe àfihàn ìgbésẹ̀ yíyọ àwọn orílẹ̀-èdè náà kúrò ní ilẹ̀ náà.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: níwájú àwọn baba ńlá wa
  rationale: Èyí pa àwòrán gbolohun orísun náà mọ́ ní Yorùbá tó ṣeé lóye, pé Ọlọ́run lé wọn kúrò níwaju àwọn baba ńlá Ísírẹ́lì.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: títí di ìgbà Dafidi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ààlà àkókò náà, ó sì so ẹsẹ yìí mọ́ ohun tí ẹsẹ tó tẹ̀ lé sọ nípa Dafidi.
theological_decisions:
- issue: Ẹni tí Ἰησοῦ ń tọ́ka sí
  choice: Jóṣúà
  alternative: Jésù
  rationale: Bí ó tilẹ̀ jẹ́ pé orúkọ Gíríìkì kan náà ni a lè lò fún Jésù àti Jóṣúà, ìtàn wíwọ ilẹ̀ Kénáánì lẹ́yìn Mósè fi hàn gbangba pé Jóṣúà ọmọ Nún ni ẹni tí a ń tọ́ka sí.
- issue: Ìtumọ̀ διαδεξάμενοι nípa àgọ́ náà
  choice: Àwọn baba ńlá gba àgọ́ náà lọ́wọ́ àwọn tó ṣáájú wọn, wọ́n sì mú un wọ ilẹ̀ náà
  alternative: Àwọn baba ńlá mú un wọ ilẹ̀ náà ní ọ̀kọ̀ọ̀kan tàbí ní ìtẹ̀lé
  rationale: Participle náà tẹnumọ́ gbígbà ohun kan lọ́wọ́ ẹni tó ṣáájú àti ìtẹ̀síwájú láti ìran dé ìran; a pa àwọn méjèèjì mọ́ nínú ọ̀rọ̀ àti àlàyé ìsàlẹ̀.
- issue: Agbára gbolohun ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: Nígbà tí àwọn baba ńlá gba ilẹ̀ àwọn orílẹ̀-èdè náà
  alternative: Ní àkókò tí a lé àwọn orílẹ̀-èdè náà kúrò ní ilẹ̀ wọn
  rationale: Ọ̀rọ̀-orúkọ κατάσχεσις túmọ̀ sí gbígba ní ìní, kì í ṣe ọ̀rọ̀ tó túmọ̀ ní tààràtà sí fífi ẹlòmíràn sílẹ̀ láìní ohun-ìní. Àyíká àti relative clause tó tẹ̀ lé fìdí rẹ múlẹ̀ pé gbígba ilẹ̀ àti lílé àwọn orílẹ̀-èdè náà kúrò jọ wà nínú ìṣẹ̀lẹ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àwọn baba ńlá wa’ pa àsọyé ìran àti ìtàn májẹ̀mú Sítéfánù mọ́. A tún ‘àgọ́’ sọ láti mú antecedent ἣν ṣe kedere, a sì pín gbólóhùn gígùn náà sí méjì fún kíkà tó rọrùn láìyí ìtumọ̀ rẹ̀ padà.
