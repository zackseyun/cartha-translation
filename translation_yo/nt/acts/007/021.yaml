  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n gbé e síta, ọmọbìnrin Fáráò mú un[a], ó sì tọ́ ọ dàgbà gẹ́gẹ́ bí ọmọkùnrin tirẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbé e sókè.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí gbígbé ọmọ ọwọ́ kan tí a gbé síta.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “fún ara rẹ̀ gẹ́gẹ́ bí ọmọkùnrin,” tàbí “gẹ́gẹ́ bí ọmọkùnrin fún ara rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: lẹ́yìn tí a gbé e síta
  rationale: Ọ̀rọ̀ náà jẹ́ àpólà aláìṣe ti ìṣe tó ti ṣẹlẹ̀, ó sì ń sọ pé a gbé ọmọ ọwọ́ náà síta. Èyí pa ìtumọ̀ ìṣe náà mọ́ láìfi kún un pé àwọn tó ṣe bẹ́ẹ̀ pinnu láti kọ̀ ọ́ sílẹ̀ pátápátá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora díẹ̀ hàn láàárín fífi Mósè síta àti bí ọmọbìnrin Fáráò ṣe gbà á.
- source_word: ἀνείλατο
  choice: gbé e
  rationale: Nínú ọ̀rọ̀ nípa ọmọ ọwọ́ tí a gbé síta, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbígbé ọmọ náà tàbí mímú un. A kò lò ‘sọ ọ́ di ọmọ’ nítorí gbólóhùn tó tẹ̀ lé e ló sọ ipò ọmọkùnrin rẹ̀ ní kedere.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ọmọbìnrin Fáráò
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìbátan náà.
- source_word: ἀνεθρέψατο
  choice: tọ́ ọ dàgbà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí títọ́ ọmọ àti mímú un dàgbà; gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì ṣe kedere.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: gẹ́gẹ́ bí ọmọkùnrin tirẹ̀
  rationale: Àpapọ̀ ọ̀rọ̀ náà fi hàn pé ó tọ́ ọ fún ara rẹ̀ ní ipò ọmọkùnrin. ‘Tirẹ̀’ mú ìbátan pẹ̀lú ara obìnrin náà hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tó yẹ. A pa ìṣe gbígbé ọmọ náà mọ́ yàtọ̀ sí títọ́ ọ dàgbà ní ipò ọmọkùnrin, gẹ́gẹ́ bí ìṣètò ọ̀rọ̀ Gíríìkì.
