id: ACT.7.17
reference: Acts 7:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: yo
  text: Ṣùgbọ́n bí àkókò ìlérí tí Ọlọ́run ti ṣe fún Ábúráhámù ṣe ń sún mọ́lé, àwọn ènìyàn náà pọ̀ sí i, wọ́n sì di púpọ̀ ní Íjíbítì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi ìtumọ̀ àkókò hàn, “ṣùgbọ́n” sì ń so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú pẹ̀lú ìyípadà díẹ̀ láìfi ìtakora líle kún un.
- source_word: ἤγγιζεν
  choice: ti ń sún mọ́lé
  rationale: Ìṣe aláìparí nínú Gíríìkì fi ìlọsíwájú hàn; “ti ń sún mọ́lé” sọ pé àkókò náà ń bọ̀ súnmọ́ díẹ̀díẹ̀.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: àkókò ìlérí
  rationale: Èyí túmọ̀ χρόνος ní ọ̀nà gbogbogbò gẹ́gẹ́ bí “àkókò,” kò sì fi èrò “àkókò tí a yàn” tí kò hàn gbangba sínú rẹ̀; ìbáṣepọ̀ genitive náà jẹ́ ti ara ní Yorùbá.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: tí Ọlọ́run ti ṣe fún Ábúráhámù
  rationale: Ní àyíká ọ̀rọ̀ ìlérí, ὡμολόγησεν ń tọ́ka sí ìfihàn tàbí ṣíṣe àdéhùn ìlérí. “Ìlérí tí ... ti ṣe” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, kò sì gbé e ga sí ìbúra.
- source_word: ηὔξησεν ὁ λαὸς
  choice: àwọn ènìyàn náà ń pọ̀ sí i
  rationale: λαός ń tọ́ka sí àwọn ọmọ Ísírẹ́lì gẹ́gẹ́ bí ẹgbẹ́ ènìyàn kan; “ń pọ̀ sí i” pa ìtumọ̀ ìdàgbàsókè iye wọn mọ́.
- source_word: καὶ ἐπληθύνθη
  choice: wọ́n sì ń di púpọ̀
  rationale: Èyí pa ìyàtọ̀ ọ̀rọ̀ mọ́ láàárín ηὔξησεν àti ἐπληθύνθη, bó tilẹ̀ jẹ́ pé àwọn méjèèjì ń tẹnu mọ́ bí iye àwọn ènìyàn ṣe ń pọ̀.
- source_word: ἐν Αἰγύπτῳ
  choice: ní Íjíbítì
  rationale: Gbólóhùn ibi tó rọrùn ni; “Íjíbítì” ni orúkọ Yorùbá tí a sábà lò fún Egypt.
theological_decisions:
- issue: Ìtumọ̀ ὡμολόγησεν nípa ìlérí Ọlọ́run fún Ábúráhámù
  choice: “ìlérí tí Ọlọ́run ti ṣe fún Ábúráhámù”
  alternative: “ìlérí tí Ọlọ́run ti ṣèlérí fún Ábúráhámù” tàbí “ìlérí tí Ọlọ́run ti fi dá Ábúráhámù lójú”
  rationale: “Ti ṣe” bá àṣà ọ̀rọ̀ Yorùbá “ṣe ìlérí” mu, ó sì fi ìdúróṣinṣin ohun tí Ọlọ́run sọ hàn láìyí ọ̀rọ̀ náà sí ìbúra, èyí tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní èdè ọ̀wọ̀, adayeba, àti èyí tí òǹkàwé òde òní lè lóye. A lo àwọn ìṣe onítẹ̀síwájú láti ṣàfihàn apá imperfect ti Gíríìkì; a sì pa àtúnṣe ọ̀rọ̀ méjì tó jọra mọ́ láìjẹ́ kí gbólóhùn náà dà bí èdè àtijọ́.
