  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: yo
  text: Nígbà náà ni Olúwa sọ fún un pé, “Bọ́ bàtà rẹ[a] ní ẹsẹ̀ rẹ, nítorí ibi tí o dúró sí jẹ́ ilẹ̀ mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ tó sún mọ́ èdè ìpilẹ̀ṣẹ̀ jù, “Tú bàtà rẹ kúrò ní ẹsẹ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Ó tẹ̀ lé ìtumọ̀ àkọ́kọ́ fún κύριος gẹ́gẹ́ bí orúkọ oyè ọlọ́wọ̀, ó sì pa ọ̀wọ̀ àti ìbámu pẹ̀lú èdè Bíbélì mọ́ láì fi ìtumọ̀ Tẹ́tírágírámatọ̀n kún ọ̀rọ̀ Gíríìkì.
- source_word: Λῦσον
  choice: Tú
  rationale: λύω túmọ̀ sí láti tú ohun tí a dè; nípa bàtà, “tú” jẹ́ ọ̀rọ̀ Yorùbá adayébá tí ó tún pa àwòrán ìpilẹ̀ṣẹ̀ mọ́.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: bàtà ẹsẹ̀ rẹ
  rationale: Ọ̀rọ̀ Gíríìkì fi ὑπόδημα sí ẹyọ ṣùgbọ́n “ẹsẹ̀” jẹ́ ọ̀pọ̀; gbolohun Yorùbá yìí lè tọ́ka sí ohun ìbòjú ẹsẹ̀ gẹ́gẹ́ bí odindi láì fi ọ̀pọ̀ tí kò ṣe kedere sínú rẹ̀.
- source_word: ὁ γὰρ τόπος
  choice: nítorí ibi
  rationale: “Nítorí” mú iṣẹ́ àlàyé γάρ jáde, “ibi” sì jẹ́ ìtumọ̀ adayébá fún τόπος.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: tí o dúró sí
  rationale: Ó sọ ipò tí Mósè wà ní àkókò náà ní Yorùbá adayébá, ó sì pa ipa ἐπί mọ́ nípasẹ̀ “sí.”
- source_word: γῆ ἁγία
  choice: ilẹ̀ mímọ́
  rationale: Ní àyíká ibi kékeré yìí, “ilẹ̀” bá γῆ mu, “mímọ́” sì fi ìyàsọ́tọ̀ ibi náà hàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò ìfarahàn Ọlọ́run láti inú Ẹ́kísódù
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ẹsẹ̀ Gíríìkì ní κύριος, kì í ṣe Orúkọ Ọlọ́run ní àwọn lẹ́tà Hébérù. “Olúwa” pa ọ̀wọ̀ àti ìtẹ̀síwájú ọ̀rọ̀ Bíbélì mọ́ láì gbe ìlànà lẹ́tà ńlá ti Májẹ̀mú Láéláé wọ inú ẹsẹ̀ Gíríìkì.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́wọ̀, tí ó sì ṣeé yé ni a lò. Àmì ohùn kún ibí tí ó yẹ. “Tú bàtà ẹsẹ̀ rẹ” pa ìtumọ̀ gangan mọ́, nígbà tí àlàyé ìsàlẹ̀ fi “kúrò ní” hàn kedere.
