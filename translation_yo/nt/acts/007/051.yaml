id: ACT.7.51
reference: Acts 7:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: yo
  text: “Ẹ̀yin ọlọ́rùn líle, aláìkọlà ní ọkàn àti etí! Ẹ ń tako Ẹ̀mí Mímọ́ nígbà gbogbo. Bí àwọn baba yín[a] ti ṣe, bẹ́ẹ̀ náà ni ẹ̀yin ń ṣe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “àwọn baba ńlá yín.” Gíríìkì: “àwọn baba yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: ọlọ́rùn líle
  rationale: Ó pa àwòrán Gíríìkì ti ‘ọrùn líle’ mọ́, èyí tí ó ń fi agídí àti àìgbọ́ràn hàn, dípò kí a túmọ̀ rẹ̀ sí ‘agídí’ lásán.
- source_word: ἀπερίτμητοι
  choice: aláìkọlà
  rationale: Ó pa ọ̀rọ̀ májẹ̀mú nípa ìkọlà mọ́, nítorí ẹsẹ̀ náà ń lo àwòrán àwọn wòlíì fún ìṣọ̀tẹ̀ inú, kì í ṣe àìmọ́ lásán.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: ní ọkàn àti etí
  rationale: Ó fi ọkàn àti etí hàn gẹ́gẹ́ bí ibi tí àìkọlà àpẹẹrẹ náà wà, ní èdè Yorùbá tó ṣàn dáadáa láìṣe àfikún ohun tí kò sí nínú orísun.
- source_word: ἀεὶ
  choice: Nígbà gbogbo … máa ń
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìṣe tí wọ́n ń ṣe léraléra àti láìyẹsẹ̀ hàn.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bá àyíká Ìṣe Àwọn Àpọ́sítélì mu fún Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni.
- source_word: ἀντιπίπτετε
  choice: ẹ máa ń kọjú ìjà sí
  rationale: Ó sọ ìtakò alágbára àti ìdojúkọ tí ọ̀rọ̀ Gíríìkì túmọ̀ sí, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: οἱ πατέρες ὑμῶν
  choice: àwọn baba yín
  rationale: Ó pa ọ̀rọ̀ ìbátan akọ nínú Gíríìkì àti agbára ẹ̀sùn Stefanu mọ́; àlàyé ìsàlẹ̀ fúnni ní ‘àwọn baba ńlá yín’ gẹ́gẹ́ bí òmíràn.
- source_word: ὡς … καὶ ὑμεῖς
  choice: Bí … ti ṣe, bẹ́ẹ̀ náà ni ẹ̀yin ń ṣe
  rationale: Ó mú ìfiwéra tí Gíríìkì ṣe jáde ní Yorùbá àdánidá, nípa pípa ọ̀rọ̀ ìṣe tí a ti sọ tẹ́lẹ̀ mọ́ ní ìtumọ̀.
theological_decisions:
- issue: Ohun tí ‘Ẹ̀mí Mímọ́’ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni ti Ọlọ́run
  alternative: ẹ̀mí mímọ́ gẹ́gẹ́ bí agbára tàbí ìwà rere kan lásán
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn Gíríìkì yìí sábà ń tọ́ka sí Ẹ̀mí Mímọ́ fúnra rẹ̀; lílo lẹ́tà ńlá bá àyíká náà mu láìfi èrò tuntun kún un.
- issue: Àwòrán ẹ̀gàn tó ní í ṣe pẹ̀lú májẹ̀mú
  choice: pa ‘aláìkọlà ní ọkàn àti etí’ mọ́
  alternative: túmọ̀ rẹ̀ ní ṣókí bí ‘ọkàn yín ti sé, etí yín sì dí’
  rationale: Àwòrán náà mọ̀ọ́mọ̀ ń rántí èdè májẹ̀mú àti ọ̀rọ̀ àwọn wòlíì; títú u sí àlàyé lásán yóò dín ìsopọ̀ yẹn kù.
- issue: Ọ̀rọ̀ akọ fún àwọn ìran àtijọ́
  choice: àwọn baba yín
  alternative: àwọn baba ńlá yín / àwọn àgbà yín àtijọ́
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ‘baba’; a pa á mọ́ nínú ara ẹsẹ̀, a sì tọ́ka sí ìtumọ̀ gbòòrò rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àwọn àwòrán Bíbélì ‘ọlọ́rùn líle’ àti ‘aláìkọlà’ mọ́, ṣùgbọ́n a ṣètò gbólóhùn náà ní ọ̀nà tó ṣe kedere fún olùkà Yorùbá lasán.
