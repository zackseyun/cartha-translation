id: ACT.7.52
reference: Acts 7:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: yo
  text: Èwo nínú àwọn wòlíì ni àwọn baba yín[c] kò ṣe inúnibíni sí? Wọ́n sì pa àwọn tí wọ́n ti kéde ṣáájú nípa bíbọ̀ Olódodo náà[a], ẹni tí ẹ̀yin ti di àwọn olùdàlẹ̀ rẹ̀ àti àwọn apànìyàn rẹ̀ nísinsìnyí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni Tí Ó Tọ́ náà.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “olùdàlẹ̀” sí “ọ̀dàlẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ “àwọn baba yín” sí “àwọn baba ńlá yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Èwo nínú àwọn wòlíì
  rationale: 'Ó pa ìtumọ̀ ìpín nínú ọ̀pọ̀ mọ́, ó sì mú agbára ìbéèrè àsọyé náà jáde: kò sí wòlíì kan tí wọn kò ṣe inúnibíni sí.'
- source_word: ἐδίωξαν
  choice: ṣe inúnibíni sí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí lílépa àti ṣíṣe ibi sí àwọn wòlíì, kì í ṣe lílépa lásán.
- source_word: οἱ πατέρες ὑμῶν
  choice: àwọn baba yín
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, ó sì pa ìsopọ̀ ẹ̀sùn tí Stefanu ń ṣe mọ́; àlàyé ìsàlẹ̀ fi ‘àwọn baba ńlá yín’ hàn gẹ́gẹ́ bí ìtumọ̀ àdánidá míì.
- source_word: ἀπέκτειναν
  choice: pa
  rationale: ‘Pa’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí ó sì fi ìṣe pípa ènìyàn hàn láìfi àlàyé kún un.
- source_word: τοὺς προκαταγγείλαντας
  choice: àwọn tí wọ́n ti kéde ṣáájú
  rationale: ‘Kéde’ pa èrò ìpolongo mọ́, ‘ṣáájú’ sì fi ìṣáájú tí προ- ń tọ́ka sí hàn.
- source_word: περὶ τῆς ἐλεύσεως
  choice: nípa bíbọ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ohun tí wọ́n kéde ni wíwá ẹni náà.
- source_word: τοῦ δικαίου
  choice: Olódodo náà
  rationale: ‘Olódodo’ fi ẹni tí ó jẹ́ olóòótọ́ àti ẹni tí ìwà rẹ̀ tọ́ hàn; ‘náà’ sì mú agbára àpilẹ̀kọ pàtó Gíríìkì jáde, bí oyè tí ń tọ́ka sí Jésù.
- source_word: οὗ
  choice: ẹni tí ... rẹ̀
  rationale: Àkójọpọ̀ ‘ẹni tí’ àti ‘rẹ̀’ so Olódodo náà mọ́ àwọn orúkọ àpèjúwe ‘olùdàlẹ̀’ àti ‘apànìyàn,’ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ oníran Gíríìkì ṣe rí.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó pa ìyàtọ̀ àkókò mọ́ láàárín ohun tí àwọn baba ṣe àti ẹ̀bi àwọn olùgbọ́ Stefanu ní àkókò náà.
- source_word: προδόται
  choice: olùdàlẹ̀
  rationale: Ọ̀rọ̀ yìí dá lórí ìṣe dídà ẹnì kan, ó sì yẹra fún ìtumọ̀ òṣèlú tó lè wà nínú ‘ọ̀dàlẹ̀.’
- source_word: φονεῖς
  choice: apànìyàn
  rationale: ‘Apànìyàn’ fi ẹ̀bi ìwà ọ̀daràn nínú pípa ènìyàn hàn ju ọ̀rọ̀ gbogbogbò fún ẹni tí ó pa lọ.
- source_word: ἐγένεσθε
  choice: ti di
  rationale: Ó fi ìyípadà sí ipò tuntun àti ipò tí ó ṣì ń bá a lọ hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ṣíṣe τοῦ δικαίου gẹ́gẹ́ bí oyè tó ń tọ́ka sí Kristi
  choice: Olódodo náà
  alternative: ẹni olódodo náà
  rationale: Nínú ọ̀rọ̀ Stefanu, ẹni pàtó tí àwọn wòlíì kéde bíbọ̀ rẹ̀ ni ọ̀rọ̀ náà ń tọ́ka sí. Ṣíṣe e bí oyè pa agbára àpilẹ̀kọ Gíríìkì mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Bí a ṣe ń fi ẹ̀sùn οὗ ... προδόται καὶ φονεῖς hàn
  choice: ẹni tí ẹ̀yin ti di àwọn olùdàlẹ̀ àti apànìyàn rẹ̀
  alternative: ẹni tí ẹ̀yin ti dà, tí ẹ sì pa
  rationale: A pa àwọn orúkọ ẹ̀sùn méjèèjì mọ́, dípò yíyí wọn padà sí àwọn ọ̀rọ̀ ìṣe; bẹ́ẹ̀ ni a kò dín agbára ẹ̀sùn Gíríìkì kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìbéèrè àsọyé àti líle ẹ̀sùn Stefanu mọ́.
