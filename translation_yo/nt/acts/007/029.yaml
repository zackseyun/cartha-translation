base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: yo
  text: Mósè sì sá lọ nígbà tí a sọ ọ̀rọ̀ yìí[a], ó sì di àlejò ní ilẹ̀ Mídíánì[b], níbi tí ó ti bí ọmọkùnrin méjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ọ̀rọ̀ yìí.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ yìí gẹ́gẹ́ bí ohun tó fa Mósè láti sá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń gbé níbẹ̀ gẹ́gẹ́ bí àjèjì.” Ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ń gbé ní ilẹ̀ tí kì í ṣe ilẹ̀ tirẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: sá lọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé Mósè sá kúrò níbẹ̀ nítorí ewu; ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: δὲ
  choice: Nítorí
  rationale: Ní àyíká ọ̀rọ̀ yìí, δέ so ìsá Mósè mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ; ‘Nítorí’ mú ìbáṣepọ̀ ìdí náà jáde lọ́nà àdánidá.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: nítorí ọ̀rọ̀ yìí
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ọ̀rọ̀ náà gẹ́gẹ́ bí ohun tó fa ìsá Mósè. Èyí jẹ́ Yorùbá àdánidá, láìfi ohun tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἐγένετο πάροικος
  choice: di àlejò
  rationale: πάροικος túmọ̀ sí ẹni tó ń gbé ní ilẹ̀ tí kì í ṣe ilẹ̀ tirẹ̀. ‘Di àlejò’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ àjèjì mọ́.
- source_word: ἐν γῇ Μαδιάμ
  choice: ní ilẹ̀ Mídíánì
  rationale: ‘Ní ilẹ̀ Mídíánì’ ṣe àfihàn γῇ ní kíkún, ó sì jẹ́ gbólóhùn àdánidá ní Yorùbá.
- source_word: οὗ
  choice: níbi tí
  rationale: Ó tọ́ka padà sí ilẹ̀ Mídíánì gẹ́gẹ́ bí ibi tí ìṣẹ̀lẹ̀ tó tẹ̀ lé ti ṣẹlẹ̀.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Ní Yorùbá, a lè sọ pé ọkùnrin ‘bí ọmọ’ láti túmọ̀ sí pé ó di baba wọn; èyí jẹ́ àdánidá ju gbólóhùn onítumọ̀-lẹ́tà bí ‘sọ ọmọ di mímọ́lẹ̀’ lọ.
- source_word: υἱοὺς δύο
  choice: ọmọkùnrin méjì
  rationale: Èyí ni ìtumọ̀ tààrà, tó ṣe kedere ti gbólóhùn Gíríìkì náà.
