id: ACT.7.25
reference: Acts 7:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: yo
  text: Ó rò pé àwọn arákùnrin rẹ̀[b] lóye pé Ọlọ́run ń fún wọn ní ìdáǹdè[a] nípasẹ̀ ọwọ́ òun, ṣùgbọ́n wọn kò lóye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàlà” tàbí “gbígbàlà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàlà, ìdáǹdè, tàbí gbígbàlà kúrò nínú ewu; níbí, àyíká ọ̀rọ̀ tọ́ka sí ìdáǹdè Ísírẹ́lì nípasẹ̀ Mósè.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin rẹ̀” níbí ni àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ Mósè; ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìbátan akọ ní ọ̀pọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: Ó rò pé
  rationale: Ọ̀rọ̀ yìí sọ èrò tàbí ìfojúsọ́nà Mósè ní abẹ́lẹ̀ ìtàn; “ó rò pé” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ náà mọ́.
- source_word: συνιέναι / συνῆκαν
  choice: mọ̀ / kò mọ̀
  rationale: “Mọ̀” níbí túmọ̀ sí lílóye ìtumọ̀ ohun tí ń ṣẹlẹ̀. Àtúnsọ ọ̀rọ̀ kan náà pa ìtakora inú Gíríìkì mọ́.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin rẹ̀
  rationale: Èyí pa èdè ìbátan akọ púpọ̀ inú Gíríìkì mọ́; ní àyíká ọ̀rọ̀, àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ Mósè ni wọ́n.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: ń fi ọwọ́ òun
  rationale: Ó pa àwòrán “nípasẹ̀ ọwọ́ rẹ̀” mọ́ ní ọ̀nà Yorùbá tí ó ṣe àdánidá, ó sì fi Mósè hàn gẹ́gẹ́ bí ẹni tí Ọlọ́run ń lò.
- source_word: δίδωσιν σωτηρίαν αὐτοῖς
  choice: ń gba wọ́n là
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìgbàlà tàbí ìdáǹdè tí Ọlọ́run ń fún wọn hàn. Fáàlì Yorùbá “gba ... là” jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà, ó sì bá àkókò ìtàn mu.
theological_decisions:
- issue: Ìtumọ̀ σωτηρία nínú àyíká ìtàn Mósè
  choice: gba wọ́n là
  alternative: dá wọn nídè; fún wọn ní ìgbàlà
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí bí Ọlọ́run ṣe ń gba Ísírẹ́lì kúrò nínú ìnilára nípasẹ̀ Mósè. “Gba wọ́n là” gba ìtumọ̀ ìdáǹdè àti ìgbàlà láàyè láì dín ọ̀rọ̀ náà kù sí ìtumọ̀ ẹ̀mí nìkan.
- issue: Ẹni tí αὐτοῦ ń tọ́ka sí nínú “nípasẹ̀ ọwọ́ rẹ̀”
  choice: ọwọ́ òun
  alternative: ọwọ́ rẹ̀
  rationale: “Òun” mú kí ó ṣe kedere pé ọwọ́ Mósè ni a ń sọ, láì yí ìtumọ̀ pé Ọlọ́run ni olùṣe ìgbàlà padà.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún. A lo “fi ọwọ́ òun” láti pa àwòrán orísun mọ́, àti “gba wọ́n là” fún ìtumọ̀ àdánidá tí kò pa ìfẹ̀ ìtumọ̀ σωτηρία run.
