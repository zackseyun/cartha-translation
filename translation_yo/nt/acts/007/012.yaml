source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Jákọ́bù gbọ́ pé ọkà wà ní Íjíbítì[a], ó rán àwọn baba wa lọ ní ìgbà àkọ́kọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìpèsè oúnjẹ wà ní Íjíbítì.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìpèsè oúnjẹ lápapọ̀, bí ó tilẹ̀ jẹ́ pé ‘ọkà’ ló ṣeé ṣe kí ó túmọ̀ sí ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ... gbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tí ó ń tọ́ka sí àkókò; ‘nígbà tí ... gbọ́’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn nínú ìtàn Stefanu láìsọ ìtakora náà di ohun tí ó lágbára jù.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: pé ọkà wà ní Íjíbítì
  rationale: A tú ìṣètò accusative àti participle lẹ́yìn ἀκούω sí ọ̀rọ̀ àròsọ aláìṣe tààrà tí ó bá Yorùbá mu. ‘Ọkà’ bá àyíká ìyàn àti ìtàn Jósẹ́fù mu.
- source_word: σιτία
  choice: ọkà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọkà tàbí ìpèsè oúnjẹ lápapọ̀; ní àyíká yìí, ọkà ni ìtumọ̀ tí ó ṣeé ṣe jù.
- source_word: ἐξαπέστειλεν
  choice: rán ... lọ
  rationale: ‘Rán ... lọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a rán àwọn ènìyàn jáde sí ìrìn-àjò, ó sì gbé agbára ἐξ- jáde dáadáa.
- source_word: τοὺς πατέρας ἡμῶν
  choice: àwọn baba wa
  rationale: Èyí pa èdè ìbátan ọkùnrin inú Gíríìkì mọ́, ó sì bá bí Stefanu ṣe ń sọ̀rọ̀ láti inú ìtàn Ísírẹ́lì mu.
- source_word: πρῶτον
  choice: ní ìgbà àkọ́kọ́
  rationale: Ó fi hàn pé èyí ni ìrìn-àjò àkọ́kọ́ nínú ọ̀pọ̀ ìrìn-àjò, ó sì pèsè ọ̀nà fún ìgbà kejì tí ìtàn yóò mẹ́nu kàn.
theological_decisions:
- issue: Ìtumọ̀ τοὺς πατέρας ἡμῶν
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa; àwọn baba ìran wa
  rationale: A pa ọ̀rọ̀ ìbátan ọkùnrin náà mọ́ nítorí pé níbí ó ń tọ́ka sí àwọn ọmọkùnrin Jákọ́bù tí wọ́n jẹ́ baba ìran Ísírẹ́lì; a kò sọ ọ́ di ọ̀rọ̀ gbogbogbò fún gbogbo àwọn baba ńlá ọkùnrin àti obìnrin.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó ti jẹ́ àdánidá, a sì lo àwọn orúkọ ‘Jákọ́bù’ àti ‘Íjíbítì’ ní ìbámu pẹ̀lú ìsọ̀rí Yorùbá.
