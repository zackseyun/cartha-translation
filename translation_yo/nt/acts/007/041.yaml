  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: yo
  text: Ní ọjọ́ wọ̀nyẹn, wọ́n sì ṣe ọmọ màlúù kan[a], wọ́n rú ẹbọ sí ère òrìṣà náà, wọ́n sì ń yọ̀ nínú àwọn iṣẹ́ ọwọ́ wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n mọ́ ọmọ màlúù kan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń yọ̀ lórí ohun tí ọwọ́ wọn ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: wọ́n ṣe ọmọ màlúù kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe tàbí mọ́ ọmọ màlúù kan. Gbólóhùn yìí ṣe kedere, ó sì jẹ́ kí ìtọ́kasí tó tẹ̀ lé sí òrìṣà náà fi hàn pé ère ìbọ̀rìṣà ni.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Ní ọjọ́ wọ̀nyẹn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àsọyé àkókò Gíríìkì náà.
- source_word: ἀνήγαγον θυσίαν
  choice: wọ́n rú ẹbọ
  rationale: Nínú ọ̀rọ̀ ìjọsìn, ‘rú ẹbọ’ ni gbólóhùn Yorùbá tó ṣe kedere jù fún fífi ẹbọ rú.
- source_word: τῷ εἰδώλῳ
  choice: sí òrìṣà náà
  rationale: Àtẹnumọ́ náà tọ́ka sí ọmọ màlúù tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn gẹ́gẹ́ bí ohun tí wọ́n ń bọ; ‘òrìṣà’ mú ìtumọ̀ ohun ìbọ̀rìṣà jáde ní Yorùbá, dípò ‘ère’ tí ó lè jẹ́ aláìdásí-tọ̀túntòsì.
- source_word: εὐφραίνοντο
  choice: wọ́n ń yọ̀
  rationale: Àmì ìṣe aláìparí nínú Gíríìkì fi ìṣe tó ń lọ hàn; ‘ń yọ̀’ pa abala yìí mọ́.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: nínú iṣẹ́ ọwọ́ wọn
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ yìí pa àwòrán àti agbára àríwísí ìbọ̀rìṣà mọ́, bó tilẹ̀ jẹ́ pé ‘lórí ohun tí ọwọ́ wọn ṣe’ tún ṣeé ṣe.
theological_decisions:
- issue: Èdè ìbọ̀rìṣà àti agbára àríwísí rẹ̀
  choice: Lo ‘òrìṣà náà’ kí a sì pa ‘iṣẹ́ ọwọ́ wọn’ mọ́.
  alternative: ‘ère náà’ àti ‘ohun tí ọwọ́ wọn ṣe’
  rationale: Ọ̀rọ̀ Stefanu ń dá ìbọ̀rìṣà Ísírẹ́lì lẹ́bi, ó sì ń lo èdè tó bá àríwísí ìbọ̀rìṣà nínú Ìwé Mímọ́ mu. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ọ́ di ọ̀rọ̀ iṣẹ́ ọnà lásán.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Rú ẹbọ’ jẹ́ ọ̀rọ̀ ìjọsìn àdánidá; ‘iṣẹ́ ọwọ́ wọn’ sì pa ìró àsọtẹ́lẹ̀ àti àríwísí ìbọ̀rìṣà inú ọ̀rọ̀ Gíríìkì mọ́.
