revisions:
- from: Ní ọjọ́ wọ̀nyẹn, wọ́n sì ṣe ọmọ màlúù kan[a], wọ́n rú ẹbọ sí òrìṣà náà, wọ́n sì ń yọ̀ nínú iṣẹ́ ọwọ́ wọn[b].
  to: Ní ọjọ́ wọ̀nyẹn, wọ́n sì ṣe ọmọ màlúù kan[a], wọ́n rú ẹbọ sí ère òrìṣà náà, wọ́n sì ń yọ̀ nínú àwọn iṣẹ́ ọwọ́ wọn[b].
  rationale: A ti rọ́pò «òrìṣà náà» pẹ̀lú «ère òrìṣà náà» láti jẹ́ kí εἴδωλον, ohun-ìbọ̀rìṣà tí wọ́n ṣe, hàn kedere. A tún lo «àwọn iṣẹ́ ọwọ́ wọn» láti pa ọ̀pọ̀ nínú τοῖς ἔργοις mọ́. Àwọn àmì ìsàlẹ̀ dúró níbi tó yẹ, wọ́n sì ń fúnni ní àwọn yíyan ọ̀rọ̀ tó bá ìtumọ̀ Gíríìkì mu.
