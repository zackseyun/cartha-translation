  verdict: revise
  source_fidelity: Ìtumọ̀ náà tẹ̀lé ìṣètò Gíríìkì àti ìṣe aláìparí nínú «wọ́n ń yọ̀» dáadáa. Síbẹ̀, «òrìṣà náà» lè tọ́ka sí ọlọ́run/ẹ̀dá tí a ń bọ́ gan-an, níbi tí εἴδωλον ti ń tọ́ka sí ohun-ìbọ̀rìṣà tàbí ère. Àtúnṣe náà jẹ́ kí ìyàtọ̀ yìí hàn.
  naturalness: «Rú ẹbọ» àti «ń yọ̀» jẹ́ Yorùbá àdánidá, tó sì bá ọ̀rọ̀ ìjọsìn mu. «Àwọn iṣẹ́ ọwọ́ wọn» tún pa ọ̀pọ̀ «ἔργοις» mọ́ ní kedere.
