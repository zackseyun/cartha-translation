  to: Lẹ́yìn tí wọ́n lé e jáde kúrò nínú ìlú, wọ́n ń lù ú ní òkúta. Àwọn ẹlẹ́rìí sì fi aṣọ òde wọn[a] sílẹ̀ lẹ́bàá ẹsẹ̀ ọ̀dọ́mọkùnrin kan tí a ń pè ní Sáúlù.
