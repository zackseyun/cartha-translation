source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n lé e jáde kúrò nínú ìlú, wọ́n ń lù ú ní òkúta. Àwọn ẹlẹ́rìí sì fi aṣọ òde wọn[a] sílẹ̀ lẹ́bàá ẹsẹ̀ ọ̀dọ́mọkùnrin kan tí a ń pè ní Sáúlù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ wọn” tàbí “ẹ̀wù wọn”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí onírúurú aṣọ òde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Lẹ́yìn tí wọ́n lé e jáde
  rationale: Ó fi hàn pé fífi agbára lé e jáde ṣẹlẹ̀ ṣáájú iṣẹ́ lílu u ní òkúta; ìtumọ̀ yìí sì bá ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: ἔξω τῆς πόλεως
  choice: kúrò nínú ìlú
  rationale: Ó ṣàfihàn ìṣípò láti inú ìlú sí òde rẹ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ní.
- source_word: ἐλιθοβόλουν
  choice: wọ́n ń sọ òkúta lù ú
  rationale: Àmì “ń” pa apá ìṣe tí ó ń lọ lọ́wọ́ mọ́, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: οἱ μάρτυρες
  choice: Àwọn ẹlẹ́rìí
  rationale: Ní àyíká ìdájọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn tó jẹ́rìí, kì í ṣe àwọn ajẹ́rìíkú.
- source_word: ἀπέθεντο τὰ ἱμάτια αὐτῶν
  choice: fi aṣọ àwọ̀lékè wọn sílẹ̀
  rationale: Ó sọ ìgbékalẹ̀ aṣọ náà kalẹ̀ ní ọ̀nà àdánidá, ó sì fi hàn pé aṣọ òde ni ἱμάτια sábà ń tọ́ka sí.
- source_word: παρὰ τοὺς πόδας
  choice: lẹ́gbẹ̀ẹ́ ẹsẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún fífi nǹkan sí tòsí ẹsẹ̀ ẹnì kan.
- source_word: νεανίου καλουμένου Σαύλου
  choice: ọ̀dọ́mọkùnrin kan tí a ń pè ní Sáúlù
  rationale: Ó túmọ̀ ọjọ́-orí àti orúkọ ẹni náà ní ọ̀nà Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìdánimọ̀ οἱ μάρτυρες nínú àyíká ìdájọ́ àti pípa ènìyàn
  choice: Àwọn ẹlẹ́rìí ní ìtumọ̀ òfin
  alternative: Àwọn ajẹ́rìíkú
  rationale: Ìtàn náà ń tọ́ka sí àwọn tó jẹ́rìí nínú ìdájọ́ tí wọ́n sì kópa nínú lílu Sítéfánù ní òkúta. Ìtumọ̀ “ajẹ́rìíkú” yóò fi ìtumọ̀ ìjọ tí ó wáyé lẹ́yìn náà kún ẹsẹ̀ yìí láìní ẹ̀rí láti inú àyíká rẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A pa ìtẹ̀síwájú ìṣe inú imperfect mọ́ nípasẹ̀ “ń,” a sì yẹra fún ọ̀rọ̀ ìjọ àkànṣe.
