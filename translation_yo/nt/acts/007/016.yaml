id: ACT.7.16
reference: Acts 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: yo
  text: Wọ́n sì gbé wọ́n lọ sí Ṣékémù, a sì sin wọ́n sínú ibojì tí Ábúráhámù ti rà fún iye fàdákà lọ́wọ́ àwọn ọmọ Hámórì ní Ṣékémù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Sítéfánù kó àwọn kúlẹ̀kúlẹ̀ jọ tí àwọn òǹkàwé lè fi wé Jẹ́nẹ́sísì 23, níbi tí Ábúráhámù ti ra ibi ìsìnkú lọ́wọ́ Éfúrónì ní Mákípélà, àti Jẹ́nẹ́sísì 33:19, níbi tí Jékọ́bù ti ra ilẹ̀ kan nítòsí Ṣékémù lọ́wọ́ àwọn ọmọ Hámórì.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: wọ́n gbé wọn lọ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí gbigbe òkú àwọn baba ńlá kúrò ní ibì kan lọ sí ibòmíràn; gbólóhùn náà jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ àyípadà ibi mọ́.
- source_word: Συχὲμ / Συχέμ
  choice: Ṣékémù
  rationale: Àkọ̀ọ́lẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tó ṣeé kà ní Yorùbá.
- source_word: ἐτέθησαν
  choice: wọ́n tẹ́ wọn sínú
  rationale: Nínú ọ̀rọ̀ ìsìnkú, ‘tẹ́ ... sínú ibojì’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún fífi òkú sí ibi ìsìnkú.
- source_word: μνήματι
  choice: ibojì
  rationale: Ó túmọ̀ sí ibi tí a sin òkú sí; ‘ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ᾧ
  choice: tí
  rationale: Ọ̀rọ̀ àsopọ̀ ‘tí’ so ibojì mọ́ gbólóhùn tó ṣàlàyé rẹ̀ láìfi ìtumọ̀ míì kún un.
- source_word: ὠνήσατο
  choice: ti rà
  rationale: Ó sọ pé Ábúráhámù ra ibojì náà ṣáájú ìsìnkú; ‘ti rà’ ṣe àfihàn ìṣe tó ti ṣẹlẹ̀ ṣáájú nínú Yorùbá àdánidá.
- source_word: τιμῆς ἀργυρίου
  choice: pẹ̀lú iye fàdákà
  rationale: Èyí pa èrò iye owó tí a san ní fàdákà mọ́, láìyí i sí ‘owó’ lásán.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: lọ́wọ́ àwọn ọmọ Hámórì
  rationale: ‘Lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí a rà nǹkan lọ́wọ́ rẹ̀, ó sì pa ‘àwọn ọmọ Hámórì’ mọ́ gẹ́gẹ́ bí ó ṣe wà nínú Gíríìkì.
- source_word: ἐν Συχέμ
  choice: ní Ṣékémù
  rationale: A túmọ̀ gbólóhùn ìparí náà ní tààràtà, láìfi tipátipá pinnu bóyá ó ń ṣàlàyé Hámórì tàbí ibi tí ìrajà náà ti wáyé.
theological_decisions:
- issue: Àìbáramu tí ó dà bí ẹni pé ó wà láàárín ọ̀rọ̀ Sítéfánù àti ìròyìn rírà ibi ìsìnkú nínú Jẹ́nẹ́sísì
  choice: 'A pa ọ̀rọ̀ Sítéfánù mọ́ bí Gíríìkì ṣe gbé e kalẹ̀: Ábúráhámù ra ibojì lọ́wọ́ àwọn ọmọ Hámórì ní Ṣékémù.'
  alternative: Kí a mú un bá Jẹ́nẹ́sísì 33:19 mu nípa yíyàn Jékọ́bù gẹ́gẹ́ bí ẹni tó rà ilẹ̀ náà, tàbí kí a mú un bá Jẹ́nẹ́sísì 23 mu nípa tọ́ka sí ibi ìsìnkú Ábúráhámù ní Mákípélà.
  rationale: Ìtumọ̀ náà gbọ́dọ̀ ṣojú ọ̀rọ̀ Gíríìkì bí ó ṣe wà, kì í ṣe láti yanjú ìṣòro ìtàn nípasẹ̀ àtúnṣe inú ẹsẹ̀. Àlàyé ìfiwéra wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘tẹ́ wọn sínú ibojì’ gẹ́gẹ́ bí àṣà èdè ìsìnkú Yorùbá, a sì pa ìṣòro ìtàn inú ọ̀rọ̀ náà mọ́ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
