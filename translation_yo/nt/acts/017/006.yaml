source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọn kò rí wọn, wọ́n fi ipá fà Jásónì àti àwọn ará kan[a] lọ síwájú àwọn aláṣẹ ìlú[b], wọ́n ń pariwo pé, “Àwọn tó ti da gbogbo ayé[c] rú wọ̀nyí ti dé síbí pẹ̀lú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àwọn onígbàgbọ́ ẹlẹgbẹ́. Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “àwọn arákùnrin,” ṣùgbọ́n ó lè tọ́ka sí àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni “politarchs,” orúkọ ipò pàtó kan fún àwọn òṣìṣẹ́ ìjọba ìlú ní Makedóníà.
    reason: cultural_note
  - marker: c
    text: Tàbí, “gbogbo ilẹ̀ tí ènìyàn ń gbé”; gbólóhùn náà lè tọ́ka sí ayé tí wọ́n mọ̀ nígbà náà, ní pàtàkì ilẹ̀ tó wà lábẹ́ Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: nígbà tí wọn kò rí wọn
  rationale: Ó fi ipò àkókò tí ó ṣáájú ìṣe pàtàkì hàn ní Yorùbá àdánidá, láì fi ìtumọ̀ míì kún un.
- source_word: ἔσυρον
  choice: wọ́n wọ́ ... lọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi ipá fa ẹnì kan lọ; ‘wọ́ ... lọ’ pa agbára àti ìfipámúni inú èdè Gíríìkì mọ́.
- source_word: τινας ἀδελφοὺς
  choice: àwọn ará kan
  rationale: Nínú àyíká yìí, ἀδελφοί ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́. ‘Àwọn ará’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì lè gba ìlò ọ̀rọ̀ Gíríìkì fún àwùjọ mọ́.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: síwájú àwọn aláṣẹ ìlú
  rationale: Ó sọ iṣẹ́ àwọn òṣìṣẹ́ ìjọba ìlú Makedóníà yìí ní kedere, ó sì pa èrò mímú àwọn ẹni náà wá síwájú wọn mọ́.
- source_word: βοῶντες
  choice: wọ́n ń pariwo
  rationale: ‘Pariwo’ fi ohùn rara àti ariwo gbangba tí participle náà túmọ̀ sí hàn.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: Àwọn tó ti da gbogbo ayé rú
  rationale: ‘Da ... rú’ fi ìdàrúdàpọ̀ àti ìrúkèrúdò inú ἀναστατόω hàn ní ọ̀nà Yorùbá àdánidá; ‘gbogbo ayé’ dúró fún οἰκουμένη ní ọ̀rọ̀ ẹ̀sùn yìí.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: wọ̀nyí ti dé síbí pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ demonstrative náà àti èrò pé wọ́n ti dé, wọ́n sì wà níbẹ̀ mọ́; ‘pẹ̀lú’ túmọ̀ καί ní ipò yìí.
