translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. Gbólóhùn inú àmì àsọyé dúró gẹ́gẹ́ bí ẹ̀sùn àwọn tó ń pariwo, kì í ṣe ìdájọ́ akọ̀wé ìtàn.
