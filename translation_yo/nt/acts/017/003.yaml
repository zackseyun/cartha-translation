id: ACT.17.3
reference: Acts 17:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: yo
  text: ó ń ṣàlàyé, ó sì ń fi ẹ̀rí hàn pé Mèsáyà ní láti jìyà, kí ó sì dìde kúrò nínú àwọn òkú,[a] àti pé, “Jésù yìí tí èmi ń kéde fún yín ni Mèsáyà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “Mèsáyà” ní ibi méjèèjì sí “Kristi.” A sì tún lè túmọ̀ “kí ó dìde kúrò nínú àwọn òkú” sí “kí a jí i dìde kúrò nínú àwọn òkú.” Ọ̀rọ̀ Gíríìkì níbí lo fọ́ọ̀mù aláṣe, ìyẹn “dìde,” bí ó tilẹ̀ jẹ́ pé Májẹ̀mú Tuntun sọ ní àwọn ibi mìíràn pé Ọlọ́run jí Jésù dìde.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: ń ṣàlàyé
  rationale: Ọ̀rọ̀ náà tọ́ka sí ṣíṣí ìtumọ̀ Ìwé Mímọ́ sílẹ̀ kí ó lè yé àwọn olùgbọ́; ‘ṣàlàyé’ jẹ́ Yorùbá àdánidá tó bá àyíká ọ̀rọ̀ mu.
- source_word: παρατιθέμενος
  choice: ń fi ẹ̀rí hàn
  rationale: Ó ṣàfikún èrò pé Pọ́ọ̀lù ń gbé ẹ̀rí àti ìdí ọ̀rọ̀ rẹ̀ kalẹ̀, láì sọ pé ó ń ṣe ìmúdájú ọgbọ́n tí kò ṣeé tako.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níbí fún ẹni àmì òróró tí a ń retí, kì í ṣe apá kan orúkọ Jésù.
- source_word: ἔδει
  choice: ó yẹ kí
  rationale: Ó fi àìní tí ète Ọlọ́run àti Ìwé Mímọ́ gbé kalẹ̀ hàn; ọ̀rọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì pa ìtumọ̀ dandan mọ́ nínú àyíká náà.
- source_word: παθεῖν
  choice: jìyà
  rationale: Èyí ni ìtumọ̀ tààrà ní àyíká ìjìyà Mèsáyà.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: dìde kúrò láàárín àwọn òkú
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ ọ̀rọ̀-ìṣe aláṣe, ‘dìde’; ‘kúrò láàárín àwọn òkú’ tún pa àwòrán ἐκ νεκρῶν mọ́.
- source_word: καταγγέλλω ὑμῖν
  choice: ń kéde fún yín
  rationale: ‘Kéde’ pa ìtumọ̀ ìpolongo ní gbangba mọ́, kò sì fi mọ́ ìwàásù nìkan.
theological_decisions:
- issue: Ìtumọ̀ Χριστός ní ibi méjèèjì
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àríyànjiyàn ẹsẹ̀ náà ni pé ẹni àmì òróró tí a ń retí gbọ́dọ̀ jìyà, kí ó sì dìde, àti pé Jésù ni ẹni náà. ‘Mèsáyà’ mú àyíká Júù àti Ìwé Mímọ́ yìí hàn kedere.
- issue: Ohùn ọ̀rọ̀-ìṣe ἀναστῆναι
  choice: dìde kúrò láàárín àwọn òkú
  alternative: a jí i dìde kúrò láàárín àwọn òkú
  rationale: Gíríìkì lo infinitive aláṣe, nítorí náà ‘dìde’ ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ jù. Èyí kò tako àwọn ibi mìíràn tí Májẹ̀mú Tuntun ti sọ pé Ọlọ́run jí Jésù dìde.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lasán. Àwọn participle méjèèjì ni a ṣe ní ọ̀nà ìṣe tó ń lọ (‘ó ń …, ó sì ń …’), tí ó bá ìtàn ẹsẹ̀ tó ṣáájú mu.
