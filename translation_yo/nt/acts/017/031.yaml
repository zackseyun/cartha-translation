id: ACT.17.31
reference: Acts 17:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: yo
  text: Nítorí ó ti yan ọjọ́ kan tí yóò dá gbogbo ayé tí ènìyàn ń gbé lẹ́jọ́ ní òdodo[a] nípasẹ̀ ọkùnrin kan tí ó ti yàn. Ó ti fi ẹ̀rí hàn fún gbogbo ènìyàn[b] nípa jíjí ọkùnrin náà dìde kúrò nínú àwọn òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò dá gbogbo ayé tí ènìyàn ń gbé lẹ́jọ́ pẹ̀lú ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ti fi ìdánilójú fún gbogbo ènìyàn”; ní tààràtà, “ó ti fi ìgbàgbọ́ fún gbogbo ènìyàn.” Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀rí tàbí ìdánilójú tí àjíǹde pèsè.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: nítorí
  rationale: Ó mú ìtumọ̀ ìdí tí ọ̀rọ̀ náà ń fi hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἔστησεν ἡμέραν
  choice: ó ti yan ọjọ́ kan
  rationale: Ó fi hàn pé Ọlọ́run ti pinnu ọjọ́ náà dájú; ‘yan ọjọ́’ jẹ́ àsọyé Yorùbá tí ó ṣe kedere.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: tí yóò fi ìdájọ́ ... ṣe
  rationale: Ó tọ́ka sí ìṣe ọjọ́ iwájú tí a ti pinnu, láìfi ìtumọ̀ pé ó fẹ́rẹ̀ẹ́ ṣẹlẹ̀ kún un ju bí ọ̀rọ̀ inú àyíká ṣe béèrè lọ.
- source_word: τὴν οἰκουμένην
  choice: gbogbo ayé tí ènìyàn ń gbé
  rationale: Ó pa ìtumọ̀ ‘ayé tí a ń gbé’ mọ́, ó sì mú àfojúsùn gbogbo ènìyàn hàn.
- source_word: ἐν δικαιοσύνῃ
  choice: ìdájọ́ òdodo
  rationale: Nínú àyíká ìdájọ́, àsọyé yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtumọ̀ òdodo àti ìṣe tí ó tọ́ mọ́.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: nípasẹ̀ ọkùnrin kan tí ó ti yàn
  rationale: ‘Ọkùnrin’ pa ìyàtọ̀ akọ ti ἀνήρ mọ́; ‘kan’ sì tẹ̀lé àìsí àrítíkù nínú Gíríìkì.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Ó sì ti fi ẹ̀rí hàn sí gbogbo ènìyàn
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, πίστις túmọ̀ sí ìdánilójú tàbí ẹ̀rí fún gbogbo ènìyàn, kì í ṣe ìgbàgbọ́ tí a fi sínú wọn.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: nípa jíjí ọkùnrin náà dìde kúrò láàárín àwọn òkú
  rationale: Ó fi àjíǹde hàn gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run fi pèsè ẹ̀rí náà, ó sì pa ọ̀rọ̀ púpọ̀ ‘àwọn òkú’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: ìdájọ́ òdodo
  alternative: ní òdodo
  rationale: Àyíká náà jẹ́ ti ìdájọ́, nítorí náà ‘ìdájọ́ òdodo’ jẹ́ Yorùbá àdánidá; àṣàyàn tó sún mọ́ ìṣètò Gíríìkì ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πίστις nínú πίστιν παρασχὼν πᾶσιν
  choice: fi ẹ̀rí hàn sí gbogbo ènìyàn
  alternative: fi ìdánilójú fún gbogbo ènìyàn; ní tààràtà, fi ìgbàgbọ́ fún gbogbo ènìyàn
  rationale: Àkójọpọ̀ παρέχω + πίστις níbí tọ́ka sí ẹ̀rí tàbí ìdánilójú tí àjíǹde pèsè; àlàyé ìsàlẹ̀ pa ọ̀rọ̀ tààràtà àti àṣàyàn mìíràn mọ́.
- issue: Ìtumọ̀ ἀνδρί
  choice: ọkùnrin kan
  alternative: ọkùnrin náà
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní pàtó, kò sì ní àrítíkù; bí ó tilẹ̀ jẹ́ pé ẹni tí a ń tọ́ka sí ṣe kedere nínú àyíká, a kò fi orúkọ tàbí ìdánimọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo ‘ìdájọ́ òdodo ṣe’ gẹ́gẹ́ bí àsọyé Yorùbá àdánidá, a sì fi àmì ohùn sí gbogbo ọ̀rọ̀ níbi tí ó yẹ.
