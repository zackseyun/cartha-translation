  source_fidelity: 'Ìtumọ̀ náà mú gbogbo àwọn èrò pàtàkì Gíríìkì náà wá: ìdí, ọjọ́ tí a ti yàn, ìdájọ́ gbogbo ayé, òdodo, ọkùnrin tí a yàn, ẹ̀rí/ìdánilójú fún gbogbo ènìyàn, àti àjíǹde. Ṣùgbọ́n ‘ìdájọ́ òdodo ṣe fún’ kò ṣe kedere tó bí ọ̀nà Yorùbá tí ó bá ìṣètò ‘judge ... in righteousness’ mu; ‘dá ... lẹ́jọ́ ní òdodo’ sun mọ́ orísun síi.'
  naturalness: ‘Dá gbogbo ayé tí ènìyàn ń gbé lẹ́jọ́ ní òdodo’ jẹ́ Yorùbá ìgbàlódé, kedere, ó sì ní ìwọ̀n ọ̀wọ̀ tí ó yẹ fún ọ̀rọ̀ mímọ́. ‘Fi ẹ̀rí hàn fún gbogbo ènìyàn’ tún bá ìlò παρέχειν πίστιν mu dáadáa ju ‘sí gbogbo ènìyàn’ lọ ní àyíká yìí.
  terminology: A pa ‘òdodo’ mọ́ fún δικαιοσύνῃ, pẹ̀lú ‘ìdájọ́ pẹ̀lú ìdájọ́ òdodo’ gẹ́gẹ́ bí àṣàyàn ìsàlẹ̀. ‘Ẹ̀rí’ jẹ́ ìtumọ̀ tó dára fún πίστιν παρασχών níbí; a pa ‘ìdánilójú’ àti ìtumọ̀ tààràtà ‘ìgbàgbọ́’ mọ́ nínú àlàyé ìsàlẹ̀. ‘Ọkùnrin kan’ tọ́ka ní pàtó sí ἀνήρ láìfi ìdánimọ̀ ẹ̀kọ́ ìsìn kún un.
