revisions:
- from: Nígbà náà, Pọ́ọ̀lù dúró láàárín Àréópágù, ó sì wí pé, “Ẹ̀yin ọkùnrin ará Áténì, mo rí i pé ní gbogbo ọ̀nà, ẹ máa ń fi taratara ṣe ohun ẹ̀sìn gidigidi.[a]”
  to: Pọ́ọ̀lù sì dúró ní àárín Àréópágù, ó sì wí pé, “Ẹ̀yin ọkùnrin ará Áténì, mo rí i pé ní gbogbo ọ̀nà ẹ jẹ́ ènìyàn tí ẹ̀sìn wọ́ lọ́kàn gidigidi.[a]”
  rationale: A yọ àmì àkókò tí kò ṣe kókó kúrò, a sì rọ́pò gbólóhùn habitual tó gùn pẹ̀lú ìsọ̀rọ̀ Yorùbá aláìdájọ́ ní gbangba. Èyí ń fi Paul hàn gẹ́gẹ́ bí ẹni tí ó ń sọ àkíyèsí nígbà kan náà, ó sì pa ìfarahàn rere tàbí odi ti δεισιδαιμονεστέρους sílẹ̀ fún akọ̀sílẹ̀ ìsàlẹ̀.
