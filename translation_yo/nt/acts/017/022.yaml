language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: yo
  text: Pọ́ọ̀lù sì dúró ní àárín Àréópágù, ó sì wí pé, “Ẹ̀yin ọkùnrin ará Áténì, mo rí i pé ní gbogbo ọ̀nà ẹ jẹ́ ènìyàn tí ẹ̀sìn wọ́ lọ́kàn gidigidi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ jẹ́ alágbọ̀n-ọgbọ̀n ẹ̀sìn jù,” tàbí, “ẹ ní ìfarajìn sí ẹ̀sìn ju àwọn ẹlòmíràn lọ.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ odi tàbí rere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: dúró
  rationale: Ó gbé ìdúró Pọ́ọ̀lù kalẹ̀ gẹ́gẹ́ bí àyíká ọ̀rọ̀, láìfi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: δὲ
  choice: Nígbà náà … ó sì
  rationale: Ó fi ìyípadà pẹ̀lẹ́ nínú ìtàn hàn ní Yorùbá àdánidá, dípò lílo ọ̀rọ̀ atako líle.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: láàárín Àréópágù
  rationale: Ó pa ìtumọ̀ ibi náà mọ́ ní tààrà, kò sì túmọ̀ ọ́ sí pé ó dúró níwájú ìgbìmọ̀ nìkan.
- source_word: Ἀρείου Πάγου
  choice: Àréópágù
  rationale: A kọ orúkọ Gíríìkì náà ní ọ̀nà tó bá ìró Yorùbá mu, dípò orúkọ àṣà Látìnì ‘Òkè Mars.’
- source_word: ἔφη
  choice: ó sì wí pé
  rationale: Ìfihàn ọ̀rọ̀ ẹni ní ọ̀nà ọ̀wọ̀, tó sì yẹ fún ìforúkọsílẹ̀ Bíbélì ní Yorùbá.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Ẹ̀yin ọkùnrin ará Áténì
  rationale: Ó pa ìpè tààrà àti ìtọ́ka akọ nínú ἄνδρες mọ́, nígbà tó ṣì jẹ́ Yorùbá àdánidá.
- source_word: κατὰ πάντα
  choice: ní gbogbo ọ̀nà
  rationale: Ó sọ bí àkíyèsí Pọ́ọ̀lù ṣe kan gbogbo apá ìwà wọn.
- source_word: ὡς
  choice: pé
  rationale: Ó ṣe àgbékalẹ̀ ohun tí Pọ́ọ̀lù rí ní ọ̀nà tó wọ́pọ̀ nínú Yorùbá.
- source_word: δεισιδαιμονεστέρους
  choice: ẹ máa ń fi taratara ṣe ohun ẹ̀sìn gidigidi
  rationale: Gbólóhùn yìí lè jẹ́ ìyìn tàbí àkíyèsí tí kò dá lẹ́bi ní gbangba; ó yẹra fún fífi ìtumọ̀ odi lé ọ̀rọ̀ Gíríìkì tó ní ìtumọ̀ méjì náà lórí.
- source_word: θεωρῶ
  choice: mo rí i
  rationale: Ó mú ìtumọ̀ àkíyèsí àti òye jáde ní Yorùbá tó rọrùn, tó sì ṣe déédé.
theological_decisions:
- issue: Ohùn tí Pọ́ọ̀lù fi ṣàpèjúwe ẹ̀sìn àwọn ará Áténì nínú δεισιδαιμονεστέρους
  choice: A lo gbólóhùn aláìdáni lẹ́bi ní gbangba, ‘ẹ máa ń fi taratara ṣe ohun ẹ̀sìn gidigidi.’
  alternative: ‘ẹ gba ohun asán gbọ́ jù’ tàbí ‘ẹ ní ìfọkànsìn ẹ̀sìn ju àwọn ẹlòmíràn lọ’
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ rere, odi, tàbí ọgbọ́n ọ̀rọ̀ tí ó mọ̀ọ́mọ̀ ṣí sí ìtumọ̀ méjèèjì. Yíyan ìtumọ̀ odi nìkan yóò parí àìdánilójú inú ọ̀rọ̀ náà láìnídìí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìlànà ọ̀rọ̀ ìbánisọ̀rọ̀ Pọ́ọ̀lù mọ́ ní ọ̀nà tí òǹkàwé lásán lè lóye.
