id: ACT.17.10
reference: Acts 17:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀ ni àwọn arákùnrin náà[a] rán àwọn méjèèjì náà, Paulu àti Sila, lọ ní òru[b] sí Bèríà. Nígbà tí wọ́n dé ibẹ̀, wọ́n lọ sínú sínágọ́gù àwọn Júù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “àwọn arákùnrin,” ṣùgbọ́n ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láàárín òru.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “sínágọ́gù Júù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Èyí pa ìrísí ọ̀pọ̀ akọ àti èrò ìbátan inú àwùjọ onígbàgbọ́ mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè kan gbogbo àwùjọ, títí kan àwọn obìnrin.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìyára àti àìjáfara hàn ní èdè òde òní.
- source_word: διὰ νυκτός
  choice: ní òru
  rationale: Ó sọ pé ìránṣẹ́ wọn lọ wáyé láàárín òru, bí gbólóhùn Gíríìkì ṣe túmọ̀ sí.
- source_word: ἐξέπεμψαν
  choice: rán ... lọ
  rationale: Ó mú èrò fífi wọn jáde kúrò níbẹ̀ hàn láìfi ìtumọ̀ tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paulu àti Sila àwọn méjèèjì
  rationale: “Àwọn méjèèjì” ṣàfihàn agbára ìsopọ̀ τε ... καί pé àwọn méjèèjì ni wọ́n rán lọ.
- source_word: Βέροιαν
  choice: Bèróyà
  rationale: Àkọtọ̀ yìí mú orúkọ ibìkan Gíríìkì Βέροια wọ ètò ìró àti ìkọ̀wé Yorùbá lọ́nà tó ṣeé kà.
- source_word: οἵτινες παραγενόμενοι
  choice: Nígbà tí wọ́n dé ibẹ̀
  rationale: Ó sọ ìṣe participle náà gẹ́gẹ́ bí àsìkò, ó sì mú ìtẹ̀síwájú ìtàn náà rọrùn ní Yorùbá.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: sínágọ́gù àwọn Júù
  rationale: Ó pa ìbáṣepọ̀ genitive náà mọ́, ó sì tọ́ka sí sínágọ́gù ti àwùjọ Júù láìfi ìdájọ́ ẹ̀sìn kún un.
- source_word: ἀπῄεσαν
  choice: wọ́n lọ sínú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ ìlọ sí inú ibi kan; ó gbé ìṣe àkọ́kọ́ ti imperfect náà jáde láìfipá pinnu nuance rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοὶ níbi tí ó ṣeé ṣe kí gbogbo àwùjọ onígbàgbọ́ wà
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ inú ẹsẹ̀ pa ọ̀pọ̀ akọ inú Gíríìkì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ tó lè gba gbogbo àwùjọ mọ́ láìdá a láàmú.
- issue: Bí a ṣe túmọ̀ τῶν Ἰουδαίων
  choice: àwọn Júù
  alternative: ti Júù
  rationale: Èyí ṣàfihàn pé sínágọ́gù náà jẹ́ ti àwùjọ Júù ní Bèróyà; kì í ṣe ọ̀rọ̀ ẹ̀gàn tàbí ìdájọ́ nípa wọn.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó bá yẹ, pẹ̀lú èdè ìtàn tó mọ́, tó níyì, tó sì yé òǹkàwé òde òní. A pa ìtẹ̀síwájú ìṣe inú Gíríìkì mọ́ ní gbólóhùn méjì kí ẹsẹ̀ náà má bàa le láti kà.
