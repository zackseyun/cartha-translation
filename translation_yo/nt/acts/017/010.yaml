  to: Lẹ́sẹ̀kẹsẹ̀ ni àwọn arákùnrin náà[a] rán àwọn méjèèjì náà, Paulu àti Sila, lọ ní òru[b] sí Bèríà. Nígbà tí wọ́n dé ibẹ̀, wọ́n lọ sínú sínágọ́gù àwọn Júù[c].
