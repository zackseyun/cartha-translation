source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: yo
  text: Nítorí náà, Ọlọ́run ti fojú fo àwọn àkókò àìmọ̀kan náà, ṣùgbọ́n nísinsìnyí ó ń pàṣẹ fún gbogbo ènìyàn níbi gbogbo pé kí wọ́n ronúpìwàdà[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ronúpìwàdà” lè ní ìtumọ̀ yíyí èrò àti ìwà padà, pẹ̀lú yíyípadà sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: Nítorí náà, ... àwọn àkókò àìmọ̀kan
  rationale: “Nítorí náà” fi ìyípadà ọ̀rọ̀ μὲν οὖν hàn, “àwọn àkókò àìmọ̀kan” sì pa ìtumọ̀ gangan mọ́ láìfi “nípa Ọlọ́run” kún un.
- source_word: ὑπεριδὼν
  choice: lẹ́yìn tí Ọlọ́run ti fojú fo
  rationale: “Fojú fo” jẹ́ ọ̀nà Yorùbá àdánidá fún fífaradà tàbí lílọ kọjá ohun kan láìdájọ́ rẹ̀ lẹ́sẹ̀kẹsẹ̀; kì í túmọ̀ sí pé Ọlọ́run fọwọ́ sí àìmọ̀kan náà.
- source_word: τὰ νῦν παραγγέλλει
  choice: ní báyìí ó pàṣẹ
  rationale: Ó pa ìyàtọ̀ àkókò láàárín ohun tí ó ti kọjá àti ohun tí Ọlọ́run ń ṣe nísinsìnyí mọ́, ó sì fi agbára àṣẹ παραγγέλλει hàn.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: fún gbogbo ènìyàn níbi gbogbo
  rationale: ἄνθρωποι jẹ́ gbogbo ẹ̀dá ènìyàn níbí, kì í ṣe àwọn ọkùnrin nìkan; πάντας πανταχοῦ tẹnu mọ́ pé àṣẹ náà kan gbogbo ènìyàn ní gbogbo ibi.
- source_word: μετανοεῖν
  choice: láti ronúpìwàdà
  rationale: “Ronúpìwàdà” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, tó sì gba ìyípadà inú àti yíyípadà kúrò nínú ẹ̀ṣẹ̀ pọ̀, dípò kíkó ìtumọ̀ náà mọ́ sí yíyí èrò padà nìkan.
theological_decisions:
- issue: Ìtumọ̀ ohun tí Ọlọ́run ṣe sí “àwọn àkókò àìmọ̀kan”
  choice: Ọlọ́run “fojú fo” wọn ní ìtumọ̀ fífaradà àti àìdájọ́ lẹ́sẹ̀kẹsẹ̀.
  alternative: Ọlọ́run kò ka ẹ̀ṣẹ̀ sí tàbí ó fọwọ́ sí àìmọ̀kan wọn.
  rationale: ὑπεριδών àti àṣẹ ìrònúpìwàdà tó tẹ̀ lé e pa ìforítì Ọlọ́run àti ojúṣe ènìyàn mọ́ papọ̀, láìyanjú ẹdọfu náà nípa fífi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
- issue: Àwọn tí àṣẹ ìrònúpìwàdà kàn
  choice: Gbogbo ènìyàn níbi gbogbo.
  alternative: Àwọn ọkùnrin nìkan tàbí àwọn Kèfèrí nìkan.
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ ní ìwọ̀n tó kárí gbogbo ẹ̀dá ènìyàn.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ronúpìwàdà” nítorí ìfarajọ rẹ̀ pẹ̀lú μετανοεῖν àti bí ó ṣe mọ́ àwọn òǹkàwé Yorùbá lára.
