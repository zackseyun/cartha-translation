  to: Nítorí náà, Ọlọ́run ti fojú fo àwọn àkókò àìmọ̀kan náà, ṣùgbọ́n nísinsìnyí ó ń pàṣẹ fún gbogbo ènìyàn níbi gbogbo pé kí wọ́n ronúpìwàdà[a],
