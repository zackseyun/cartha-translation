id: ACT.17.32
reference: Acts 17:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ nípa àjíǹde àwọn òkú, àwọn kan ń ṣe ẹ̀gàn, ṣùgbọ́n àwọn mìíràn sọ pé, “A ó fetí sí ọ nípa èyí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A ó fetí sí ọ nípa èyí lẹ́ẹ̀kan sí i,” láti fi agbára ọ̀rọ̀ Gíríìkì καὶ πάλιν (“lẹ́ẹ̀kan sí i”) hàn ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́
  rationale: Ọ̀rọ̀ ìṣe aorist participle yìí fi àkókò ìṣe pàtàkì hàn; ‘Nígbà tí wọ́n gbọ́’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ àkókò mọ́.
- source_word: δὲ
  choice: (kò ní ọ̀rọ̀ ọ̀tọ̀ ní ìbẹ̀rẹ̀)
  rationale: δὲ ń darí ìtàn lọ síwájú ní ọ̀nà pẹ̀lẹ́; Yorùbá kò nílò ọ̀rọ̀ bí ‘nísinsin yìí’ níhìn-ín, nígbà tí ‘ṣùgbọ́n’ sì ń fi ìyàtọ̀ inú gbólóhùn hàn.
- source_word: ἀνάστασιν νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Ó sọ ní tààrà nípa jíjí àwọn ẹni tí ó kú dìde gẹ́gẹ́ bí ẹ̀ka kan, láìyí i sí ‘jí dìde kúrò láàárín àwọn òkú’ tàbí fi ẹ̀kọ́ mìíràn kún un.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: àwọn kan ... ṣùgbọ́n àwọn mìíràn
  rationale: Èyí mú ìpín àti ìtakora àwọn ẹgbẹ́ méjèèjì jáde ní Yorùbá tí ó ṣe kedere.
- source_word: ἐχλεύαζον
  choice: ń ṣẹ̀sín
  rationale: Àmì ‘ń’ bá imperfect mu, ó sì fi ìṣe ẹ̀gàn tí ń lọ lọ́wọ́ hàn láìfi ìtumọ̀ ‘wọ́n bẹ̀rẹ̀’ kún un.
- source_word: εἶπαν
  choice: sọ pé
  rationale: Aorist yìí jẹ́ ìròyìn ìdáhùn wọn ní ọ̀nà tààrà; ‘sọ pé’ ni ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ.
- source_word: Ἀκουσόμεθά σου
  choice: A ó ... fetí sí ọ
  rationale: Future middle pẹ̀lú genitive ẹni ń tọ́ka sí fífetí sí ẹni náà; ‘A ó fetí sí ọ’ jẹ́ kedere, àdánidá, ó sì yẹ fún ọ̀rọ̀ tí wọ́n ń gbọ́ láti ẹnu Pọ́ọ̀lù.
- source_word: περὶ τούτου καὶ πάλιν
  choice: tún ... nípa èyí
  rationale: ‘tún’ pa agbára καὶ πάλιν mọ́, ‘nípa èyí’ sì túmọ̀ περὶ τούτου. Ìṣètò Yorùbá yìí ń fi hàn pé wọ́n fẹ́ fetí sí i lẹ́ẹ̀kan sí i nípa ọ̀ràn náà.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ àjíǹde níwájú àwùjọ àwọn tí kò ní ìpìlẹ̀ Júù
  choice: àjíǹde àwọn òkú
  alternative: àjíǹde kúrò nínú òkú
  rationale: Greek ἀνάστασιν νεκρῶν ń tọ́ka sí àjíǹde tí ó kan àwọn òkú gẹ́gẹ́ bí ẹ̀ka; a kò sọ ọ́ di àjíǹde ẹni kan pàtó tàbí pinnu ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò yanjú.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ń ṣẹ̀sín’ fún ẹ̀gàn tó ń lọ lọ́wọ́, a sì lo ‘fetí sí ọ’ dípò gbólóhùn líle bí ‘gbọ́ ọ’ nìkan. Àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti yẹ.
