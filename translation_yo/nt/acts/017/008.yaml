  source_fidelity: 'Àtúnṣe pọ̀ndandan nítorí pé àkọ́kọ́ ìtumọ̀ náà yí ipa-ìṣe Gíríìkì náà padà: ἐτάραξαν jẹ́ ìṣe tí olùṣe rẹ̀ jẹ́ ẹni tí a ti mẹ́nuba nínú àyíká ọ̀rọ̀, wọ́n sì ni wọ́n dá ogunlọ́gọ̀ ènìyàn àti àwọn aláṣẹ ìlú náà láàmú. Gbólóhùn akọ́kọ́ náà, “ọkàn wọn kò balẹ̀,” jẹ́ kí ogunlọ́gọ̀ ènìyàn àti àwọn aláṣẹ di olùṣe ìpò náà, ó sì pa olùṣe ìṣe Gíríìkì náà rẹ́. Àtúnṣe náà tún jẹ́ kí ἀκούοντας ταῦτα kan ẹgbẹ́ méjèèjì ní kedere.'
