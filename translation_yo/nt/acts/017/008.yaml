- from: Nígbà tí àwọn ènìyàn àti àwọn aláṣẹ ìlú gbọ́ nǹkan wọ̀nyí, ọkàn wọn kò balẹ̀.[a]
  to: Wọ́n sì da ogunlọ́gọ̀ ènìyàn náà àti àwọn aláṣẹ ìlú náà láàmú nígbà tí ogunlọ́gọ̀ ènìyàn náà àti àwọn aláṣẹ ìlú náà gbọ́ nǹkan wọ̀nyí.[a]
  rationale: A tún gbólóhùn náà kọ́ kí “wọ́n” jẹ́ olùṣe ἐτάραξαν, kí ogunlọ́gọ̀ ènìyàn àti àwọn aláṣẹ ìlú jẹ́ ẹni tí ìdàrúdàpọ̀ náà kan, àti kí ó hàn gbangba pé àwọn méjèèjì ló gbọ́ nǹkan wọ̀nyí. “Sì” ń gbé ipa asopọ̀ pẹ̀lẹ́ ti δέ wá. Àlàyé ìsàlẹ̀ ojú-ewé ni a sọ di Yorùbá tó rọrùn síi.
