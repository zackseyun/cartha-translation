  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: yo
  text: Wọ́n sì da ogunlọ́gọ̀ ènìyàn náà àti àwọn aláṣẹ ìlú náà láàmú nígbà tí ogunlọ́gọ̀ ènìyàn náà àti àwọn aláṣẹ ìlú náà gbọ́ nǹkan wọ̀nyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì: “àwọn politarki,” oyè ìjọba ìlú kan tí a máa ń lò ní Makedóníà.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: ọkàn wọn kò balẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìdàrúdàpọ̀ tàbí ìdààmú inú àti ti àwùjọ hàn. Gbólóhùn Yorùbá yìí jẹ́ èdè àdánidá, ó sì bá àwọn ènìyàn àti àwọn aláṣẹ ìlú mu láì sọ ipa náà di líle ju ti Gíríìkì lọ.
- source_word: δὲ
  choice: Nígbà tí
  rationale: δὲ jẹ́ asopọ̀ pẹ̀lẹ́ nínú ìtàn. Nínú àtúntò gbólóhùn Yorùbá, ìtumọ̀ ìlọsíwájú náà wà nínú gbólóhùn àkókò ‘Nígbà tí,’ nítorí náà kò pọndandan láti fi ‘àti’ tàbí ‘ṣùgbọ́n’ kún un lọ́tọ̀.
- source_word: ὄχλον
  choice: àwọn ènìyàn
  rationale: Nínú àyíká yìí ὄχλος túmọ̀ sí àwùjọ ènìyàn tí ó péjọ. ‘Àwọn ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹra fún ìtumọ̀ ìwà ọ̀tá tí ‘agbo ọlọ́tẹ̀’ lè fi kún un.
- source_word: πολιτάρχας
  choice: àwọn aláṣẹ ìlú
  rationale: πολιτάρχης jẹ́ orúkọ ipò ìṣàkóso ìlú ní Makedóníà. ‘Àwọn aláṣẹ ìlú’ sọ iṣẹ́ wọn di mímọ̀ fún òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìpé orúkọ ipò náà mọ́.
- source_word: ἀκούοντας ταῦτα
  choice: Nígbà tí ... gbọ́ nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ aláìlópìn náà kan àwọn ènìyàn àti àwọn aláṣẹ ìlú méjèèjì. Ìtumọ̀ àkókò yìí jẹ́ Yorùbá àdánidá, ‘nǹkan wọ̀nyí’ sì pa ọ̀pọ̀-orúkọ ταῦτα mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àtòjọ ọ̀rọ̀ Yorùbá àdánidá láti jẹ́ kí ẹni tí ó gbọ́ àti ipa ohun tí wọ́n gbọ́ hàn kedere, láì yí ìtumọ̀ orísun padà.
