source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: yo
  text: Nítorí náà, ọ̀pọ̀ nínú wọn gbàgbọ́, pẹ̀lú ọ̀pọ̀ àwọn obìnrin Gíríìkì tí ipò wọn ga láwùjọ[a] àti ọkùnrin tí kò kéré ní iye[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a bọ̀wọ̀ fún.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “kì í ṣe díẹ̀”; àkànlò èdè ni tó túmọ̀ sí iye tó pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Nítorí náà, ọ̀pọ̀
  rationale: “Nítorí náà” fi ìyọrísí àti ìyípadà ọ̀rọ̀ tí μὲν οὖν ń tọ́ka sí hàn, nígbà tí “ọ̀pọ̀” túmọ̀ πολλοί ní èdè Yorùbá àdánidá.
- source_word: ἐξ αὐτῶν
  choice: nínú wọn
  rationale: Ó pa ìtumọ̀ apá nínú gbogbo ènìyàn mọ́, ó sì tọ́ka padà sí àwọn ará Bèróíà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐπίστευσαν
  choice: gbàgbọ́
  rationale: Èyí ni ìtumọ̀ tààrà fún πιστεύω; kò fi ohun tí wọ́n gbàgbọ́ lé e lórí ju ohun tí ẹsẹ náà sọ lọ.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: àwọn obìnrin Gíríìkì
  rationale: Ἑλληνίδων ń ṣe àpèjúwe àwọn obìnrin náà gẹ́gẹ́ bí Gíríìkì; kò sí ohun nínú ọ̀rọ̀ yìí tó béèrè pé kí γυναικῶν jẹ́ “àwọn aya.”
- source_word: τῶν εὐσχημόνων
  choice: olókìkí
  rationale: Nínú àyíká yìí, εὐσχήμων ń tọ́ka sí àwọn tí a mọ̀ sí ẹni pàtàkì tàbí ẹni ipò rere láwùjọ. “Olókìkí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, pẹ̀lú àlàyé ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: àti àwọn ọkùnrin tí kò kéré ní iye
  rationale: Ó pa àkànlò èdè οὐκ ὀλίγοι (“kò kéré”) mọ́ dípò kí ó sọ ọ́ di “ọ̀pọ̀” lásán, ó sì dúró gẹ́gẹ́ bí Yorùbá tó ṣeé yé.
- source_word: καὶ
  choice: pẹ̀lú / àti
  rationale: Àwọn ọ̀rọ̀ asopọ̀ yìí so àwọn ẹgbẹ́ míì tí wọ́n gbàgbọ́ mọ́ ẹgbẹ́ àkọ́kọ́ lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἐπίστευσαν pẹ̀lú èdè ẹ̀kọ́ Kristẹni tó túbọ̀ ṣe pàtó
  choice: gbàgbọ́
  alternative: wọ́n gba Mèsáyà gbọ́; wọ́n gba iṣẹ́ náà gbọ́
  rationale: Ẹsẹ náà kò sọ ohun tí wọ́n gbàgbọ́ ní tààrà; ó jẹ́ kí àyíká ọ̀rọ̀ ṣàlàyé rẹ̀. “Gbàgbọ́” pa ìṣiyèméjì tó wà nínú ọ̀rọ̀ orísun mọ́ láìfi ẹ̀kọ́ tí a kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àkànlò èdè “tí kò kéré” mọ́, a sì lo àlàyé ìsàlẹ̀ láti mú ìtumọ̀ rẹ̀ yé kedere. Gbogbo àmì àlàyé ìsàlẹ̀ [a], [b] farahàn nínú ọ̀rọ̀ pàtàkì.
