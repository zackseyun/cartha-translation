id: ACT.17.25
reference: Acts 17:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: yo
  text: A kò sì fi ọwọ́ ènìyàn sìn ín[a], bí ẹni pé ó nílò ohunkóhun, nítorí òun fúnra rẹ̀ ni ó ń fún gbogbo wọn ní ìyè, èémí àti ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò fi ọwọ́ ènìyàn jọ́sìn rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ ìránṣẹ́ tàbí àbójútó tí a ń ṣe nínú ọ̀rọ̀ ẹ̀sìn; níbí, kókó ọ̀rọ̀ ni pé Ọlọ́run kò gbára lé iṣẹ́ tí ènìyàn ń ṣe fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: a ... sìn ín
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí iṣẹ́ ìránṣẹ́ tàbí àbójútó tí a ń ṣe fún ẹnì kan, pàápàá nínú ọ̀rọ̀ ẹ̀sìn; kì í ṣe ìwòsàn. “Sìn ín” jẹ́ èdè Yorùbá àdánidá tó sì lè gba ìtumọ̀ iṣẹ́ ìsìn ẹ̀sìn láì sọ ọ́ di ọ̀rọ̀ ìjọsìn nìkan.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: fi ọwọ́ ènìyàn
  rationale: Ó pa àwòrán gidi ti Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún iṣẹ́ tí ènìyàn ń fi ọwọ́ ṣe.
- source_word: προσδεόμενός τινος
  choice: bí ẹni pé ó nílò ohunkóhun
  rationale: 'Ó mú agbára àríyànjiyàn náà jáde: Ọlọ́run kì í gba iṣẹ́ lọ́wọ́ ènìyàn bí ẹni aláìní. “Ohunkóhun” fi àìní tí kò ní ààlà hàn gẹ́gẹ́ bí τινος.'
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́, ní fífi Ọlọ́run, ẹni tí ń fúnni, yàtọ̀ sí àwọn ẹ̀dá tí ń gbà.
- source_word: διδοὺς
  choice: ni ó ń fún
  rationale: Ìṣètò yìí sọ participle náà di gbólóhùn àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìdí tó tẹ̀ lé “nítorí” mọ́.
- source_word: πᾶσι
  choice: gbogbo wọn
  rationale: Ó jẹ́ kí ààlà rẹ̀ gbòòrò láì fi “ènìyàn” kún ohun tí Gíríìkì kò sọ; arọ́pò-orúkọ náà tọ́ka sí gbogbo àwọn tí ń gba ìyè àti èémí.
- source_word: ζωὴν
  choice: ìyè
  rationale: Èyí ni ìtumọ̀ Yorùbá tó dúró ṣinṣin fún ìyè, ó sì bá èémí ṣiṣẹ́ pọ̀ láti fi ìgbẹ́kẹ̀lé ẹ̀dá hàn.
- source_word: πνοὴν
  choice: èémí
  rationale: Nínú àkójọpọ̀ pẹ̀lú “ìyè,” “èémí” ni ìtumọ̀ àdánidá; “ẹ̀mí” lè mú ìtumọ̀ míì tí ọ̀rọ̀ náà kò béèrè wọlé.
- source_word: καὶ τὰ πάντα
  choice: àti ohun gbogbo
  rationale: Ó pa agbára àkópọ̀ tó kún fún gbogbo nǹkan mọ́, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ... kò
  rationale: Ó tẹ̀ síwájú láti inú ìsẹ̀ tí ó ṣáájú gẹ́gẹ́ bí àfikún àìmọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “nor.”
theological_decisions:
- issue: Bóyá kí θεραπεύεται jẹ́ ọ̀rọ̀ ìjọsìn ní pàtó tàbí iṣẹ́ ìránṣẹ́ ní ìtumọ̀ gbòòrò
  choice: a kò fi ọwọ́ ènìyàn sìn ín
  alternative: a kò fi ọwọ́ ènìyàn jọ́sìn rẹ̀; a kò fi ọwọ́ ènìyàn ṣe iṣẹ́ fún un
  rationale: Àríyànjiyàn Pọ́ọ̀lù dá lórí pé Ọlọ́run kò gbára lé iṣẹ́ ẹ̀sìn tàbí àbójútó ènìyàn. “Sìn ín” gba àyíká ẹ̀sìn náà wọlé, ṣùgbọ́n kò dín ọ̀rọ̀ Gíríìkì kù sí ìjọsìn inú ọkàn nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a pa àwòrán “ọwọ́ ènìyàn” àti ìtẹnumọ́ “òun fúnra rẹ̀” mọ́.
