id: ACT.17.13
reference: Acts 17:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn Júù láti Tẹsalóníkà gbọ́ pé Pọ́ọ̀lù ti kéde ọ̀rọ̀ Ọlọ́run ní Bèróà pẹ̀lú,[a] wọ́n tún wá síbẹ̀,[b] wọ́n sì ń ru ọ̀pọ̀ ènìyàn sókè, wọ́n sì ń dá wọn láàmú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Pọ́ọ̀lù kéde ọ̀rọ̀ Ọlọ́run ní Bèróà pẹ̀lú.” Aorist Gíríìkì lè jẹ́ kí a sọ ìṣe náà gẹ́gẹ́ bí ohun tí ó ti ṣẹlẹ̀ tàbí kí a kàn sọ pé ó ṣẹlẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ apá ìkẹyìn sí “wọ́n ń ru àwọn ènìyàn sókè, wọ́n sì ń da ìdàrúdàpọ̀ sílẹ̀ láàárín wọn.” Àwọn ọ̀rọ̀ ìṣe méjèèjì sún mọ́ra ní ìtumọ̀, ṣùgbọ́n ó ṣeé ṣe kí wọ́n jọ mú bí ìrúkèrúdò náà ti lágbára tó hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó fi ìyípadà ìtàn àti ìyàtọ̀ kékeré sí ìtẹ́wọ́gbà rere tí ó wà ní Bèróà hàn, ní èdè Yorùbá àdánidá.
- source_word: ἔγνωσαν
  choice: gbọ́ pé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n rí ìròyìn kan gbọ́ tàbí wọ́n mọ̀ nípa rẹ̀, kì í ṣe pé wọ́n kàn ní ìmọ̀ tẹ́lẹ̀.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: àwọn Júù láti Tẹsalóníkà
  rationale: Ó dá ẹgbẹ́ náà mọ̀ nípasẹ̀ ibi tí wọ́n ti wá, láì sọ ọ́ di gbogbo àwọn Júù lápapọ̀.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: pé ... ní Bèróà pẹ̀lú
  rationale: “Pẹ̀lú” fi hàn pé Bèróà jẹ́ ibòmíràn tí ìkéde náà dé, gẹ́gẹ́ bí ó ti dé Tẹsalóníkà.
- source_word: κατηγγέλη
  choice: ti kéde
  rationale: Ìṣe aláìṣe tí aorist Gíríìkì fi hàn ni a túmọ̀ sí ọ̀nà àdánidá Yorùbá; “kéde” tẹnumọ́ fífi ìhìn náà hàn ní gbangba.
- source_word: ὑπὸ τοῦ Παύλου
  choice: Pọ́ọ̀lù ti kéde
  rationale: Yorùbá máa ń lo gbólóhùn oníṣe ní ti ẹ̀dá ju gbólóhùn aláìṣe lọ; ìtumọ̀ pé Pọ́ọ̀lù ni aṣojú ìkéde náà dúró ṣinṣin.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa àfihàn Bíbélì tó mọ̀ sílẹ̀ fún ìhìn tí ó ti ọ̀dọ̀ Ọlọ́run wá, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἦλθον κἀκεῖ
  choice: wọ́n tún wá síbẹ̀
  rationale: “Tún ... síbẹ̀” fi ìtumọ̀ pé wọ́n fa àtakò wọn dé Bèróà pẹ̀lú hàn ní Yorùbá àdánidá.
- source_word: σαλεύοντες
  choice: wọ́n sì ń ru ọ̀pọ̀ ènìyàn sókè
  rationale: Ó fi ìmúnibínú àti dídá ìrúkèrúdò sílẹ̀ láàárín àwọn ènìyàn hàn.
- source_word: καὶ ταράσσοντες
  choice: wọ́n sì ń dá wọn láàmú
  rationale: Ó pa ìṣe kejì mọ́, èyí tí ó fi ìdàrúdàpọ̀ tàbí ìyọnu tí wọ́n ń dá sílẹ̀ hàn.
- source_word: τοὺς ὄχλους
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún àwùjọ ènìyàn, láì sọ wọ́n di agbo onírúkèrúdò ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  alternative: ìhìn Ọlọ́run
  rationale: “Ọ̀rọ̀ Ọlọ́run” pa ìró ẹ̀kọ́ ìgbàgbọ́ àti ọ̀nà ìsọ Bíbélì mọ́, ṣùgbọ́n nínú àyíká yìí ó ṣì túmọ̀ sí ìhìn Ọlọ́run tí a kéde, láì fipá mú un wọ inú ìtumọ̀ imọ̀-ẹ̀kọ́ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A lo gbólóhùn oníṣe fún ὑπὸ τοῦ Παύλου nítorí pé ó jẹ́ àdánidá ní Yorùbá, láì yí ẹni tó ṣe ìkéde náà padà.
