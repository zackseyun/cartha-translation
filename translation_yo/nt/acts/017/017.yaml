  to: Nítorí náà, ó ń bá àwọn Júù àti àwọn tí ń sin Ọlọ́run[a] jíròrò nínú sínágọ́gù; ní ibi ọjà[b] náà, ó ń bá àwọn tí ó kàn wà níbẹ̀ jíròrò lójoojúmọ́.
