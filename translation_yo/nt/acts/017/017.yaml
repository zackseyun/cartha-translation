reference: Acts 17:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: yo
  text: Nítorí náà, ó ń bá àwọn Júù àti àwọn tí ń sin Ọlọ́run[a] jíròrò nínú sínágọ́gù; ní ibi ọjà[b] náà, ó ń bá àwọn tí ó kàn wà níbẹ̀ jíròrò lójoojúmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn olùbẹ̀rù Ọlọ́run”; ìyẹn ni, àwọn Kèfèrí tí wọ́n ní ìbáṣepọ̀ pẹ̀lú ìjọsìn àwọn Júù.
    reason: lexical_alternative
  - marker: b
    text: “Ibi ọjà” náà tún jẹ́ gbàgede ìlú tí àwọn ènìyàn ti máa ń péjọ; kì í ṣe ibi tí wọ́n ti ń tà àti rà nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: ó ń bá ... jíròrò
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn. “Bá ... jíròrò” jẹ́ èdè Yorùbá àdánidá tí ó tún mú ìtumọ̀ ìfọ̀rọ̀wérọ̀ àti fífi èrò múlẹ̀ jáde.
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe Pọ́ọ̀lù mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu láti tẹ ìtàn náà síwájú.
- source_word: συναγωγῇ
  choice: sínágọ́gù
  rationale: Níhìn-ín, ó tọ́ka sí ilé ìjọsìn àwọn Júù gẹ́gẹ́ bí ibi àti ètò tí a mọ̀ dáadáa.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí àwọn ọmọ ìjọ Júù tí ó wà nínú sínágọ́gù, kì í ṣe àwọn ará Jùdíà nìkan.
- source_word: τοῖς σεβομένοις
  choice: àwọn tí ń sin Ọlọ́run
  rationale: Gbólóhùn yìí ṣe kedere fún òǹkàwé òde òní, ó sì fi ìfọkànsìn wọn sí Ọlọ́run hàn. “Ọlọ́run” ni a fi kún un gẹ́gẹ́ bí ohun tí àyíká sínágọ́gù àti lílo ọ̀rọ̀ náà nínú Ìṣe àwọn Àpọ́sítélì ń tọ́ka sí.
- source_word: ἀγορᾷ
  choice: ibi ọjà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àgbègbè ìlú tí ìṣòwò àti ìpéjọpọ̀ gbogbo ènìyàn ti ń wáyé. “Ibi ọjà” jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn lè lóye, nígbà tí àlàyé ìsàlẹ̀ fi iṣẹ́ rẹ̀ gẹ́gẹ́ bí gbàgede ìlú hàn.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó fi hàn pé ìṣe náà máa ń ṣẹlẹ̀ ní gbogbo ọjọ́, kì í ṣe lẹ́ẹ̀kan ṣoṣo.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: ó ń bá àwọn tí ó bá pàdé níbẹ̀
  rationale: Ó pa ìtumọ̀ àwọn ènìyàn tí ó ṣẹlẹ̀ pé wọ́n wà níbẹ̀ tàbí tí Pọ́ọ̀lù bá pàdé mọ́, láì dín wọn kù sí àwọn arìnrìn-àjò tí ń kọjá nìkan.
theological_decisions:
- issue: Ìdánimọ̀ τοῖς σεβομένοις
  choice: Àwọn tí ń sin Ọlọ́run, pẹ̀lú àlàyé pé wọ́n jẹ́ àwọn Kèfèrí tó ní ìbáṣepọ̀ pẹ̀lú ìjọsìn Júù
  alternative: Àwọn olùbẹ̀rù Ọlọ́run
  rationale: Ìtumọ̀ pàtàkì náà yàgò fún àmì-orúkọ ìmọ̀-ẹ̀sìn tí òǹkàwé lè má mọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìdánimọ̀ ẹgbẹ́ náà mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹ̀ya kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní iyì ṣùgbọ́n tí ó rọrùn láti lóye. A lo “ó ń bá ... jíròrò” láti fi ìṣe tí ó ń bá a lọ hàn, a sì tún un ṣe lẹ́ẹ̀kejì kí gbolóhùn náà lè ṣàn lọ́nà àdánidá. Àmì ìsàlẹ̀ [a] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tó ń ṣàlàyé, [b] sì wà lẹ́gbẹ̀ẹ́ “ibi ọjà.”
