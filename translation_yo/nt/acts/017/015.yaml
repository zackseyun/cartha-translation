translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní ọlá, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Sin ... lọ” àti “mú ... dé” mú ìrìn-àjò àti ìrànlọ́wọ́ àwọn olùbá Pọ́ọ̀lù lọ hàn ní ọ̀nà tí òǹkàwé Yorùbá lè lóye ní rọ́rùn.
