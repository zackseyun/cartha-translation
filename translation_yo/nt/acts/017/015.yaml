  source_fidelity: 'Ìtumọ̀ náà mú ìlànà ìṣẹ̀lẹ̀ Gíríìkì náà hàn dáadáa: àwọn kan bá Pọ́ọ̀lù lọ dé Átẹ́ńsì, wọ́n gba ìtọ́ni fún Sílà àti Tímótì, lẹ́yìn náà wọ́n kúrò. Ṣùgbọ́n ọrọ̀ “sin Pọ́ọ̀lù lọ” lè túmọ̀ sí sísìn ín, kì í ṣe rírìn tàbí mímú un lọ; pẹ̀lú bẹ́ẹ̀, arọ́pò-orúkọ “wọ́n” nínú àkóónú ìtọ́ni kò ṣe kedere ẹni tí ó yẹ kí ó wá.'
  naturalness: Àtúnyẹ̀wò náà lo Yorùbá boṣewa ti òde òní. “Àwọn tí wọ́n ń bá Pọ́ọ̀lù lọ” ṣàlàyé ìbáṣiṣẹ́ ìrìn-àjò náà láìní ìtumọ̀ ‘sìn’; “kí Sílà àti Tímótì wá sọ́dọ̀ rẹ̀” sì jẹ́ kedere, ó sì dáa ní èdè Yorùbá.
  terminology: Àwọn orúkọ náà—Pọ́ọ̀lù, Átẹ́ńsì, Sílà, àti Tímótì—wà ní ìrísí Yorùbá tí ó yẹ. “Ìtọ́ni” jẹ́ ìtumọ̀ tó dáa fún ἐντολή nínú àyíká yìí, nígbà tí àfikún ẹsẹ̀ ń pa aṣayan “àṣẹ” mọ́.
  issues:
