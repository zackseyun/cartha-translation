source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: yo
  text: Àwọn tí wọ́n ń bá Pọ́ọ̀lù lọ mú un dé Átẹ́ńsì[a]. Lẹ́yìn tí wọ́n sì gba ìtọ́ni fún Sílà àti Tímótì pé kí Sílà àti Tímótì wá sọ́dọ̀ rẹ̀ ní kíákíá bí ó ti ṣeé ṣe[b], wọ́n kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “mú un lọ sí Átẹ́ńsì.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé wọ́n bá Pọ́ọ̀lù lọ títí ó fi dé ibẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gba àṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àṣẹ tí ó lágbára tàbí ìtọ́ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: àwọn tí wọ́n ń sin Pọ́ọ̀lù lọ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwọn tí wọ́n bá Pọ́ọ̀lù rin ìrìn-àjò náà, tí wọ́n sì mú un dé ibi tí ó ń lọ; “sin ... lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń bá a lọ láti dáàbò bò ó àti láti mú un dé.
- source_word: ἤγαγον
  choice: mú un dé
  rationale: Ó sọ ìṣe tí ó parí, ìyẹn pé wọ́n mú Pọ́ọ̀lù dé Átẹ́ńsì; yíyan yìí bá ọ̀rọ̀ ìrìn-àjò mu ní Yorùbá.
- source_word: ἕως Ἀθηνῶν
  choice: dé Átẹ́ńsì
  rationale: ἕως fi ààlà ìrìn-àjò hàn, dé ibi tí wọ́n sin Pọ́ọ̀lù lọ; “dé Átẹ́ńsì” jẹ́ àdánidá, ó sì pa ìtumọ̀ ibi tí ìrìn náà parí mọ́.
- source_word: λαβόντες ἐντολήν
  choice: lẹ́yìn tí wọ́n gba ìtọ́ni
  rationale: A tú participle náà sí gbólóhùn àkókò ní Yorùbá. “Ìtọ́ni” lè gba ìtumọ̀ àṣẹ tàbí ìlànà láìfi agbára ọ̀rọ̀ náà hàn ju bí àyíká ṣe béèrè lọ.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: fún Sílà àti Tímótì
  rationale: πρός níbí fi àwọn tí a fẹ́ fi ìtọ́ni náà ránṣẹ́ sí hàn; “fún” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere tí ó sì rọrùn.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: pé kí wọ́n tọ̀ ọ́ wá ní kíákíá bí ó ti lè ṣeé ṣe
  rationale: Ó pa àkóónú ìtọ́ni àti ìkánjú ὡς τάχιστα mọ́. “tọ̀ ọ́ wá” sọ pé kí wọ́n wá sọ́dọ̀ ẹni tí a mẹ́nu kàn, láìrọ́pò arọ́pò-orúkọ náà pẹ̀lú “Pọ́ọ̀lù.”
- source_word: ἐξῄεσαν
  choice: wọ́n bá kúrò níbẹ̀
  rationale: Ó jẹ́ ọ̀nà ìtàn Yorùbá àdánidá fún bí àwọn olùsin náà ṣe fi ibẹ̀ sílẹ̀ lẹ́yìn tí wọ́n gba ìtọ́ni.
