  rationale: A rọ́pò ọ̀rọ̀ tí ó lè dà bí sísìn Pọ́ọ̀lù pẹ̀lú ọ̀rọ̀ tó fi ìbáṣiṣẹ́ ìrìn-àjò hàn. A tún dárúkọ Sílà àti Tímótì nínú gbólóhùn ìfẹ́kùfẹ̀ náà kí olùkà má bà a nínú ẹni tí a pàṣẹ fún láti wá. Àtúnṣe náà pa ìkánjú, ìtọ́kasí sí Pọ́ọ̀lù nípa “rẹ̀,” àti ìpele ìtàn orísun Gíríìkì mọ́.
