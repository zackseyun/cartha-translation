id: ACT.17.27
reference: Acts 17:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: yo
  text: kí wọn lè wá Ọlọ́run, bóyá wọ́n lè fi ọwọ́ ṣàwárí rẹ̀[a] kí wọ́n sì rí i—bí ó tilẹ̀ jẹ́ pé ní tòótọ́, kò jìnnà sí ẹnì kọ̀ọ̀kan wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘fi ọwọ́ tọ̀ ọ́ wá.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí wíwá ohun kan nípa fífi ọwọ́ kàn án, bí ẹni tí ìríran rẹ̀ ní ààlà tàbí tí ó wà nínú òkùnkùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: kí wọn lè wá
  rationale: Ọ̀rọ̀ àìlẹ́ni Gíríìkì náà sinmi lé gbólóhùn tó ṣáájú, ó sì ń sọ ète tàbí àbájáde. ‘Kí wọn lè wá’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ ète náà mọ́.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Orúkọ ‘Ọlọ́run’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí God nínú àyíká ọ̀rọ̀ yìí; kò yẹ kí a fi àmì pàtó orúkọ Gíríìkì hàn lọ́nà tí kò bá ìlò Yorùbá mu.
- source_word: εἰ ἄρα γε
  choice: bí ó bá ṣeé ṣe
  rationale: Àkójọpọ̀ patíkù yìí fi àìdánilójú àti ìfojúsọ́nà kékeré hàn. ‘Bí ó bá ṣeé ṣe’ pa ìdíwọ̀n àti àìdánilójú náà mọ́ láì sọ pé rírí Ọlọ́run dájú tàbí pé kò ṣeé ṣe.
- source_word: ψηλαφήσειαν
  choice: fi ọwọ́ ṣàwárí rẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà ń mú àwòrán ẹni tó ń fi ìfọwọ́kan wá nǹkan nínú òkùnkùn tàbí nígbà tí ìríran rẹ̀ ní ààlà wá. Ìtumọ̀ yìí mú àwòrán náà hàn ní Yorùbá àdánidá.
- source_word: αὐτόν
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Ọlọ́run; ‘rẹ̀’ bá ìṣètò ọ̀rọ̀ ‘ṣàwárí’ mu ní Yorùbá.
- source_word: καὶ εὕροιεν
  choice: kí wọn sì rí i
  rationale: Ọ̀rọ̀-ìṣe yìí bá ψηλαφήσειαν dọ́gba nínú ìṣesí optative. Àtúnlò ‘kí wọn’ jẹ́ kó ṣe kedere pé ìṣe méjèèjì wà lábẹ́ ìfojúsọ́nà kan náà.
- source_word: καί γε
  choice: ṣùgbọ́n ní tòótọ́
  rationale: Níhìn-ín, gbólóhùn náà ń fi òtítọ́ ìsúnmọ́ Ọlọ́run ṣe àtakò sí àìdánilójú ìṣàwárí ènìyàn. ‘Ṣùgbọ́n ní tòótọ́’ mú agbára ìyípadà àti ìtẹnumọ́ náà hàn.
- source_word: οὐ μακρὰν
  choice: kò jìnnà
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: sí ẹnì kọ̀ọ̀kan wa
  rationale: ‘Ẹnì kọ̀ọ̀kan wa’ pa ìtẹnumọ́ alápínpin ἑνὸς ἑκάστου mọ́. Yorùbá máa ń sọ ‘jìnnà sí’ dípò títẹ̀lé preposition Gíríìkì ní tààrà.
- source_word: ὑπάρχοντα
  choice: kò jìnnà
  rationale: Participle náà sọ ipò gidi Ọlọ́run. Nínú Yorùbá, àpólà ‘kò jìnnà’ ti gbé ìtumọ̀ wíwà rẹ̀ ní tòsí jáde láì nílò ọ̀rọ̀-ìṣe míì.
theological_decisions:
- issue: Ìṣàwárí ènìyàn àti bí Ọlọ́run ṣe ṣeé sún mọ́
  choice: Pa àìdánilójú ìṣàwárí ènìyàn mọ́ pẹ̀lú ‘bí ó bá ṣeé ṣe’ àti àwòrán ‘fi ọwọ́ ṣàwárí,’ nígbà tí a tún fi ìsúnmọ́ gidi Ọlọ́run múlẹ̀ pẹ̀lú ‘ṣùgbọ́n ní tòótọ́, kò jìnnà.’
  alternative: Ṣe ìtumọ̀ náà ní ọ̀nà tó rọrùn sí i, bí ‘kí wọn wá a, kí wọn sì rí i,’ tí yóò dín àwòrán ìfọwọ́wá àti àìdánilójú kù.
  rationale: Gíríìkì mú ààlà ìmọ̀ ènìyàn àti ìsúnmọ́ Ọlọ́run dúró papọ̀. A kò gbọ́dọ̀ sọ ìṣàwárí náà di ohun tó dájú tàbí ohun asán, bẹ́ẹ̀ ni a kò gbọ́dọ̀ dín ìjẹ́rìí pé Ọlọ́run wà ní tòsí kù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tó yẹ, a sì lo ‘fi ọwọ́ ṣàwárí’ láti pa àwòrán orísun mọ́ láì jẹ́ kí gbólóhùn náà di àjèjì.
