source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: yo
  text: Àwọn wọ̀nyí tí Jásónì ti gbà sí ilé rẹ̀ náà, gbogbo wọn ń ṣe lòdì sí àwọn àṣẹ Késárì[b], wọ́n ń sọ pé ọba mìíràn kan wà—ẹni náà sì ni Jésù[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti gbà wọ́n” tàbí “ti gba wọ́n gẹ́gẹ́ bí àlejò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba àlejò tàbí fífi inú rere gba ẹnì kan sí ilé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn òfin ìjọba.” Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìpinnu tàbí àṣẹ tí aláṣẹ gbé kalẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ọba kan tó yàtọ̀.” Gíríìkì sọ “ọba mìíràn,” ó sì fi ẹ̀sùn náà hàn gẹ́gẹ́ bí ìkéde pé Jésù jẹ́ ọba kan tí ó ń bá Késárì díje fún ipò ọba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: ti gbà sí ilé rẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí gbígba àlejò tàbí fífi inú rere gba ẹnì kan sí ilé. Àkókò perfect fi hàn pé Jásónì ti gbà wọ́n, ìṣe náà sì dúró gẹ́gẹ́ bí ìpìlẹ̀ ẹ̀sùn náà.
- source_word: ἀπέναντι
  choice: lòdì sí
  rationale: Níbi tí ọ̀rọ̀ náà ti bá genitive lọ, ó ń fi àtakò tàbí ìṣe tí kò bá ohun kan mu hàn. “Lòdì sí” ṣe kedere nínú ẹ̀sùn òfin yìí.
- source_word: δογμάτων
  choice: àwọn àṣẹ
  rationale: Nínú àyíká ìṣàkóso Róòmù, ọ̀rọ̀ náà ń tọ́ka sí àwọn ìpinnu tàbí àṣẹ oníṣẹ́. “Àwọn àṣẹ” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì ní ìwọ̀ntúnwọ̀nsì ìlànà.
- source_word: πράσσουσι
  choice: ń ṣe
  rationale: Present tense náà fi ìṣe tó ń lọ lọ́wọ́ hàn. “Ń ṣe” jẹ́ ọ̀nà àdánidá láti sọ ìwà tí wọ́n fẹ̀sùn kàn wọ́n pé wọ́n ń hù.
- source_word: βασιλέα ἕτερον
  choice: ọba mìíràn
  rationale: βασιλεύς túmọ̀ sí “ọba” ní pàtó, ἕτερον sì ń fi ọba mìíràn tó yàtọ̀ sí Késárì hàn. Èyí pa agbára òṣèlú inú ẹ̀sùn náà mọ́.
- source_word: λέγοντες
  choice: wọ́n ń sọ pé
  rationale: Participle náà ṣàlàyé bí wọ́n ṣe ń hùwà lòdì sí àwọn àṣẹ náà àti ohun tí wọ́n ń kéde. “Wọ́n ń sọ pé” kò fi agbára tó ju ti orísun lọ kún un.
- source_word: εἶναι Ἰησοῦν
  choice: wà—Jésù
  rationale: Ìṣètò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹnumọ́ orúkọ Jésù ní òpin gbólóhùn mọ́.
- source_word: οὗτοι πάντες
  choice: Gbogbo àwọn wọ̀nyí
  rationale: Èyí pa demonstrative àti ìtẹnumọ́ pé gbogbo wọn ni ẹ̀sùn náà kàn mọ́.
theological_decisions:
- issue: Agbára òṣèlú inú ẹ̀sùn pé Jésù jẹ́ ọba
  choice: A túmọ̀ ẹ̀sùn náà ní tààrà pé wọ́n ń sọ pé Jésù ni ọba mìíràn.
  alternative: Lílo “olórí” tàbí “alákòóso” dípò “ọba,” èyí tí yóò dín ìtumọ̀ òṣèlú rẹ̀ kù.
  rationale: Ọ̀rọ̀ náà so ẹ̀sùn náà mọ́ àwọn àṣẹ Késárì, ó sì lo βασιλεύς, “ọba,” ní kedere. Ìtumọ̀ yìí pa ìforígbárí ìtàn, òṣèlú àti ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ láì sọ pé ìjọba Jésù jẹ́ ti ẹ̀mí nìkan tàbí láì fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe òde òní, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tó bá yẹ. Bí ẹsẹ yìí ṣe bẹ̀rẹ̀ pẹ̀lú “àwọn tí” pa ìbáṣepọ̀ relative clause rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀ ẹsẹ tó ṣáájú; àmì àkámọ́ em dash sì tẹnumọ́ pé Jésù ni “ọba mìíràn” náà.
