  source_fidelity: 'Ìtumọ̀ náà fi àwọn èrò pàtàkì Gíríìkì náà hàn dáadáa: Jásónì ti gba àwọn ènìyàn náà gẹ́gẹ́ bí àlejò, ẹ̀sùn àtakò sí àwọn àṣẹ Késárì, àti ìkéde pé Jésù jẹ́ ọba mìíràn. Ṣùgbọ́n ìbẹ̀rẹ̀ rẹ̀ jẹ́ gbolóhùn àjẹkù ní Yorùbá òmìnira, nítorí “àwọn tí Jásónì ti gbà sí ilé rẹ̀” kò ní ìṣe-àsọtẹ́lẹ̀ rẹ̀. A tún lè sọ ìdánimọ̀ Jésù gẹ́gẹ́ bí ọba mìíràn náà ní kedere sí i.'
