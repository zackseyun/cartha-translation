id: ACT.17.24
reference: Acts 17:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: yo
  text: Ọlọ́run tí ó dá ayé àti ohun gbogbo tí ó wà nínú rẹ̀ jẹ́ Olúwa ọ̀run àti ilẹ̀ ayé; kò sì gbé inú àwọn tẹ́ńpìlì tí ọwọ́ ènìyàn ṣe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn tẹ́ńpìlì tí ọwọ́ ṣe”; ìtumọ̀ rẹ̀ ni àwọn tẹ́ńpìlì tí àwọn ènìyàn kọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: tí ó dá
  rationale: Ọ̀rọ̀ yìí jẹ́ àpólà-ìṣe aorist tí ó ń ṣàlàyé Ọlọ́run. “Tí ó dá” jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ pé Ọlọ́run ni Ẹlẹ́dàá hàn láìfi ohun mìíràn kún ọ̀rọ̀ Gíríìkì.
- source_word: κόσμον
  choice: ayé
  rationale: Níhìn-ín, κόσμος ń tọ́ka sí gbogbo ètò ìṣẹ̀dá. “Ayé” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè gbé ìtumọ̀ gbooro yìí nínú àyíká ẹsẹ̀ náà.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: ohun gbogbo tí ó wà nínú rẹ̀
  rationale: Èyí pa agbára gbogbo-gbòò πάντα mọ́, ó sì ṣàlàyé pé gbogbo ohun inú ayé ló wà ní àfojúsùn.
- source_word: ὑπάρχων κύριος
  choice: ẹni tí í ṣe Olúwa
  rationale: Àyànfẹ́ yìí fi ipò tí Ọlọ́run wà gẹ́gẹ́ bí Olúwa hàn, ó sì yẹra fún yíyí participle náà sí ọ̀rọ̀ okùnfà bí “nítorí tí ó jẹ́ Olúwa.”
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, ó sì fi ọlá-àṣẹ rẹ̀ lórí ọ̀run àti ilẹ̀ ayé hàn.
- source_word: οὐρανοῦ καὶ γῆς
  choice: ọ̀run àti ilẹ̀ ayé
  rationale: “Ọ̀run àti ilẹ̀ ayé” jẹ́ àsọyé Yorùbá àdánidá fún àpapọ̀ àwọn ọ̀rọ̀ Gíríìkì yìí, ó sì fi gbogbo ìṣẹ̀dá hàn.
- source_word: χειροποιήτοις
  choice: tí ọwọ́ ènìyàn ṣe
  rationale: Èyí sọ ìtumọ̀ ọ̀rọ̀ náà ní kedere pé ènìyàn ni ó kọ́ wọn, nígbà tí ó tún pa àwòrán “ọwọ́” inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ναοῖς
  choice: àwọn tẹ́ńpìlì
  rationale: ναός túmọ̀ sí ilé mímọ́ tàbí tẹ́ńpìlì tí a kà sí ibùgbé òrìṣà kan. “Àwọn tẹ́ńpìlì” ṣe kedere nínú àyíká Árẹ́ópágù, kò sì mú un di ilé ìjọsìn lásán.
- source_word: κατοικεῖ
  choice: kò gbé inú
  rationale: κατοικέω túmọ̀ sí gbígbé tàbí ṣíṣe ibùgbé. “Kò gbé inú” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé tẹ́ńpìlì kì í ṣe ibùgbé Ọlọ́run.
theological_decisions:
- issue: Gíga Ọlọ́run ju ìṣẹ̀dá lọ àti fífi ibùgbé rẹ̀ mọ́ tẹ́ńpìlì
  choice: Ẹsẹ̀ náà sọ ní tààrà pé Ẹlẹ́dàá àti Olúwa ọ̀run àti ilẹ̀ ayé kò gbé inú tẹ́ńpìlì tí ènìyàn kọ́.
  alternative: A lè túmọ̀ rẹ̀ ní ọ̀nà àlàyé pé a kò lè fi Ọlọ́run sé sínú tẹ́ńpìlì.
  rationale: A pa gbólóhùn tààrà inú Gíríìkì mọ́, láìfẹ̀ sí i sí ẹ̀kọ́ ìsìn gbooro pé a “kò lè fi Ọlọ́run sé” bí ó tilẹ̀ jẹ́ pé èyí lè jẹ́ ohun tí ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Tẹ́ńpìlì” dá ìtumọ̀ ilé mímọ́ inú àyíká Árẹ́ópágù dúró ju “ilé ìjọsìn” lọ. A fi [a] sí lẹ́yìn gbólóhùn tí àlàyé ìsàlẹ̀ ìwé ń ṣàlàyé.
