language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọkùnrin kan fi ara wọn mọ́ ọn[a], wọ́n sì gbàgbọ́; lára wọn ni Dionisiusi ará Áréópágù[b], obìnrin kan tí orúkọ rẹ̀ ń jẹ́ Damarisi, àti àwọn ẹlòmíràn pẹ̀lú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dì mọ́ ọn” tàbí “faramọ́ ọn”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìbáṣepọ̀ tímọ́tímọ́ pẹ̀lú Pọ́ọ̀lù.
    reason: lexical_alternative
  - marker: b
    text: “Ará Áréópágù” lè túmọ̀ sí ọmọ ẹgbẹ́ ìgbìmọ̀ Áréópágù tàbí ẹni tó ní ìbáṣepọ̀ pẹ̀lú ìgbìmọ̀ náà.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Ṣùgbọ́n àwọn ọkùnrin kan
  rationale: “Àwọn ọkùnrin kan” pa ìtọ́kasí akọ ọ̀pọ̀ nínú ἄνδρες mọ́, δὲ sì fi ìyàtọ̀ kékeré hàn sí àwọn ìhùwàpadà inú ẹsẹ tó ṣáájú.
- source_word: κολληθέντες αὐτῷ
  choice: dara pọ̀ mọ́ ọn
  rationale: Ó sọ ìsopọ̀ tímọ́tímọ́ àti dídarapọ̀ mọ́ Pọ́ọ̀lù lọ́nà Yorùbá àdánidá, láìsọ ọ́ di ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò fi dandan múlẹ̀.
- source_word: ἐπίστευσαν
  choice: wọ́n sì gbàgbọ́
  rationale: Ìtumọ̀ tààrà fún πιστεύω ni; kò fi Pọ́ọ̀lù hàn gẹ́gẹ́ bí ẹni tí wọ́n gbàgbọ́ lé lórí, nítorí ohun tí wọ́n gbàgbọ́ ni a fi sílẹ̀ láìsọ ní Gíríìkì.
- source_word: ἐν οἷς καὶ
  choice: Lára wọn ni
  rationale: Ó ṣàfihàn pé àwọn tí a dárúkọ jẹ́ apá kan lára àwọn tó gbàgbọ́, ní èdè Yorùbá tó rọrùn.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionisiusi ará Áréópágù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìró Yorùbá, “ará Áréópágù” sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Areopagus mọ́ láìdá irú ìbáṣepọ̀ náà dájú ju ti orísun lọ.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: obìnrin kan tí orúkọ rẹ̀ ń jẹ́ Damarisi
  rationale: Ìtumọ̀ Yorùbá àdánidá tó pa akọ-ǹlá obìnrin àti orúkọ ẹni náà mọ́.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: àwọn ẹlòmíràn pẹ̀lú wọn
  rationale: Ó sọ pé àwọn míì tún wà yàtọ̀ sí àwọn méjèèjì tí a dárúkọ, ó sì pa ìtumọ̀ ìbákẹ́gbẹ́ σύν mọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω nínú àyíká ọ̀rọ̀ yìí
  choice: wọ́n sì gbàgbọ́
  alternative: wọ́n wá sínú ìgbàgbọ́
  rationale: Gíríìkì sọ ìgbàgbọ́ wọn ní ṣókí, kò sì ṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ní kíkún tàbí sọ ẹni tí ọ̀rọ̀-ìṣe náà darí sí. “Wọ́n sì gbàgbọ́” pa àìsọ pàtó yẹn mọ́.
- issue: Ìdánimọ̀ Dionisiusi gẹ́gẹ́ bí Ἀρεοπαγίτης
  choice: ará Áréópágù
  alternative: ọ̀kan lára ìgbìmọ̀ Áréópágù
  rationale: Orúkọ oyè náà lè tọ́ka sí ọmọ ẹgbẹ́ ìgbìmọ̀ Areopagus tàbí ẹni tó ní ìbáṣepọ̀ pẹ̀lú rẹ̀. Ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A yan gbolohun tó ṣe kedere fún òǹkàwé gbogbogbò, nígbà tí àwọn àlàyé ìsàlẹ̀ pa ìwọ̀n ìtumọ̀ Gíríìkì àti àìdánilójú oyè Ἀρεοπαγίτης mọ́.
