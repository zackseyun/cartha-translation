revisions:
- from: Lẹ́yìn tí wọ́n la Ámfípólì àti Apólóníà kọjá, wọ́n dé Tẹsalóníkà, níbi tí sínágọ́gù àwọn Júù kan wà.[a]
  to: Lẹ́yìn tí wọ́n gba Ámfípólì àti Apólóníà kọjá, wọ́n dé Tẹsalóníkà, níbi tí sínágọ́gù kan ti àwọn Júù wà.[a]
  rationale: Àtúnṣe náà ń yanjú ìdààmú syntactic tí ‘sínágọ́gù àwọn Júù kan’ dá sílẹ̀, nípa fífi ‘kan’ kún ‘sínágọ́gù’ ní kedere àti lílo ‘ti’ fún ‘τῶν Ἰουδαίων.’ Ó tún mú ọ̀rọ̀ ìrìnàjò náà rọrùn sí i, láìyí ìtumọ̀ Gíríìkì padà. Àkọsílẹ̀ náà pa àṣàyàn Yorùbá tí kò lo ‘kan’ mọ́, níwọ̀n bí àìní article Gíríìkì kò ṣe dandan láti jẹ́ aláìlópin nínú Yorùbá.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:23Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́jú ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀ nínú Διοδεύσαντες ... ἦλθον, àwọn orúkọ ibi, àti ìtọ́kasí sí sínágọ́gù àwọn Júù. Ṣùgbọ́n ipò ‘kan’ nínú ‘sínágọ́gù àwọn Júù kan’ lè túmọ̀ sí pé ‘àwọn Júù kan’ ni, kì í ṣe pé sínágọ́gù náà jẹ́ aláìlópin.
  naturalness: ‘Gba ... kọjá’ jẹ́ ìlò Yorùbá tó rọrùn fún rírìn gba ibi kan kọjá. Ìṣètò ‘sínágọ́gù kan ti àwọn Júù’ jẹ́ kedere, ó sì yẹra fún ìdààmú ìbáṣepọ̀ ‘kan’ pẹlu ‘àwọn Júù.’
  terminology: ‘Sínágọ́gù’ àti ‘àwọn Júù’ yẹ, wọ́n sì bá àyíká ìjọ àwọn Júù ní Tẹsalóníkà mu. A kò yẹ kí a ka àìní article Gíríìkì gẹ́gẹ́ bí ẹ̀rí dandan fún ‘kan’; ṣùgbọ́n bí a bá lò ó ní Yorùbá, ó gbọ́dọ̀ so mọ́ ‘sínágọ́gù’ ní kedere.
  issues:
  - severity: medium
    issue: ‘kan’ wà lẹ́yìn ‘àwọn Júù’ nínú gbólóhùn àkọ́kọ́.
    rationale: Ní Yorùbá, ‘àwọn Júù kan’ sábà máa ń túmọ̀ sí ‘some Jews.’ Èyí lè yí ìtumọ̀ padà láti ‘a synagogue of the Jews’ sí ohun tí ó jọ ‘a synagogue of some Jews.’ Gbé ‘kan’ sún mọ́ ‘sínágọ́gù,’ kí a sì lo ‘ti’ láti fi ìbáṣepọ̀ genitive hàn.
  - severity: low
    issue: Àkọsílẹ̀ ẹsẹ̀ abẹ́lẹ̀ sọ ‘article’ ní Gẹ̀ẹ́sì.
    rationale: ‘Àfọwọ́kọ’ tàbí ‘àmì pàtó’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere jù fún grammatical article; a tún ṣàtúnṣe ọ̀rọ̀ àyípadà náà kí ó bá ìtumọ̀ àkọ́kọ́ mu.
  revised_text: Lẹ́yìn tí wọ́n gba Ámfípólì àti Apólóníà kọjá, wọ́n dé Tẹsalóníkà, níbi tí sínágọ́gù kan ti àwọn Júù wà.[a]
