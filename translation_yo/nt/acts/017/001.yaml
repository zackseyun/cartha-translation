id: ACT.17.1
reference: Acts 17:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n gba Ámfípólì àti Apólóníà kọjá, wọ́n dé Tẹsalóníkà, níbi tí sínágọ́gù kan ti àwọn Júù wà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ pé, “níbi tí sínágọ́gù àwọn Júù wà.” Ọ̀rọ̀ Gíríìkì náà kò ní àfọwọ́kọ níwájú “sínágọ́gù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Lẹ́yìn tí wọ́n la ... kọjá
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ἦλθον. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé wọ́n gba inú àwọn ìlú náà kọjá.
- source_word: δὲ
  choice: —
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ ìtàn tí kò ní ìtakora pàtàkì; Yorùbá kò nílò kí a túmọ̀ rẹ̀ ní gbangba.
- source_word: Ἀμφίπολιν καὶ Ἀπολλωνίαν
  choice: Ámfípólì àti Apólóníà
  rationale: Àwọn orúkọ ibì kan ni; a ṣe àkọsílẹ̀ ìró wọn ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ‘wọ́n wá’ tàbí ‘wọ́n lọ,’ ‘wọ́n dé’ jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n parí ìrìnàjò wọn sí ibi tí a dárúkọ.
- source_word: εἰς Θεσσαλονίκην
  choice: Tẹsalóníkà
  rationale: Pẹ̀lú ‘wọ́n dé,’ orúkọ ibi náà fúnra rẹ̀ ń fi ibi tí wọ́n ń lọ hàn láìfi àfikún ọ̀rọ̀ sí i.
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn abẹ́lẹ̀ tó ń ṣàlàyé ibi.
- source_word: συναγωγὴ
  choice: sínágọ́gù kan
  rationale: Ọ̀rọ̀ Gíríìkì náà kò ní article; ‘kan’ ń fi ìtumọ̀ aláìlópin hàn, bí ó tilẹ̀ jẹ́ pé Yorùbá lè fi sílẹ̀ láìsọ ọ́.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó ń tọ́ka sí àwùjọ ẹ̀yà àti ẹ̀sìn àwọn Júù tí sínágọ́gù náà jẹ́ tiwọn; ‘àwọn Júù’ jẹ́ ìtumọ̀ tààrà tí kò mú kí a rò pé àwọn ará Jùdíà nìkan ni.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἰουδαίων nínú ìtàn yìí
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí àwùjọ àwọn Júù ní Tẹsalóníkà, kì í ṣe àwọn olùgbé Jùdíà ní pàtó; nítorí náà, ‘àwọn ará Jùdíà’ lè ṣì ni òye ibi.
- issue: Bí a ṣe mú àìní article pẹ̀lú συναγωγή hàn
  choice: sínágọ́gù àwọn Júù kan
  alternative: sínágọ́gù àwọn Júù náà
  rationale: SBLGNT kò ní article níwájú συναγωγή. ‘Kan’ ń tọ́jú ìtumọ̀ aláìlópin, nígbà tí ‘náà’ yóò sọ ọ́ di pàtó ju ẹ̀rí ọ̀rọ̀ Gíríìkì lọ.
translation_notes:
  register: A lo Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn orúkọ ibi ni a kọ ní ìbámu pẹ̀lú ìró Yorùbá. Gbólóhùn náà rọrùn fún òǹkàwé òde òní, ó sì pa ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀ àti àìní article nínú Gíríìkì mọ́.
