id: ACT.17.2
reference: Acts 17:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: yo
  text: Gẹ́gẹ́ bí àṣà Paulu[a], ó wọlé sí ọ̀dọ̀ wọn, ó sì bá wọn jíròrò[c] láti inú Ìwé Mímọ́ ní ọjọ́ Ìsinmi mẹ́ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí Paulu ti máa ń ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ọjọ́ Ìsinmi mẹ́ta.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó bá wọn ṣe ìjíròrò” tàbí “ó bá wọn ṣe àríyànjiyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Gẹ́gẹ́ bí àṣà Paulu
  rationale: Gbólóhùn yìí fi ohun tí Paulu máa ń ṣe déédéé hàn; èdè yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ àṣà tí ó ti fìdí múlẹ̀ mọ́.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: ó wọlé tọ̀ wọ́n lọ
  rationale: Èyí pa ìrìn wọlé inú ibi ìpéjọ àti ìtọ́sọ́nà sí ọ̀dọ̀ wọn mọ́, láì fi ọ̀rọ̀ ‘sínágọ́gù’ kún ẹsẹ yìí.
- source_word: ἐπὶ σάββατα τρία
  choice: ní ọjọ́ Ìsinmi mẹ́ta
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìṣẹ̀lẹ̀ lórí ọjọ́ Ìsinmi mẹ́ta; ‘ní’ bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ àkókò míì sílẹ̀.
- source_word: διελέξατο
  choice: ó bá wọn fi … ṣe àlàyé
  rationale: διαλέγομαι níbí ní èrò ìjíròrò tí ó ní ìdí àti ẹ̀rí; ‘bá wọn … ṣe àlàyé’ jẹ́ èdè Yorùbá tó ṣe kedere, tí kò sì fi ìjà tàbí awuyewuye ọ̀rọ̀ kún un.
- source_word: ἀπὸ τῶν γραφῶν
  choice: fi Ìwé Mímọ́
  rationale: Ọ̀pọ̀ γραφαί tọ́ka sí àkójọpọ̀ àwọn ìwé mímọ́ tí a gbà pé wọ́n ní ọlá àṣẹ; ‘Ìwé Mímọ́’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àkójọpọ̀ yẹn.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ ‘wọn’ ń tọ́ka sí nínú iṣẹ́ Paulu ní sínágọ́gù
  choice: A pa ‘wọn’ mọ́ láì sọ pé ‘àwọn Júù’ tàbí ‘àwọn tó wà ní sínágọ́gù.’
  alternative: ó wọ sínágọ́gù; ó tọ àwọn Júù lọ
  rationale: Àyíká ẹsẹ náà ṣàlàyé ibi tí wọ́n wà, ṣùgbọ́n Gíríìkì ẹsẹ yìí fúnra rẹ̀ lo ọ̀rọ̀ arọ́pò-orúkọ. Pípa èyí mọ́ kò jẹ́ kí ìtumọ̀ fi ohun tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá àpéjọ tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì lo ‘ọjọ́ Ìsinmi’ fún σάββατα àti ‘Ìwé Mímọ́’ fún γραφαί. Àwọn àmì ìsàlẹ̀ [a], [b], àti [c] farahàn nínú ọ̀rọ̀ pàtàkì.
