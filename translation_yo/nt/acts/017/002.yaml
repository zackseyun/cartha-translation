revisions:
- from: Gẹ́gẹ́ bí àṣà Paulu[a], ó wọlé tọ̀ wọ́n lọ, ó sì bá wọn fi Ìwé Mímọ́ ṣe àlàyé ní ọjọ́ Ìsinmi mẹ́ta[b][c].
  to: Gẹ́gẹ́ bí àṣà Paulu[a], ó wọlé sí ọ̀dọ̀ wọn, ó sì bá wọn jíròrò[c] láti inú Ìwé Mímọ́ ní ọjọ́ Ìsinmi mẹ́ta[b].
  rationale: A tún un ṣe nítorí ìṣọ̀kan ọ̀rọ̀ Yorùbá àti ìfaradà sí ìtọ́ka Gíríìkì. Àtúnṣe náà kò fi ‘sínágọ́gù,’ ‘àwọn Júù,’ tàbí ìtumọ̀ ẹ̀kọ́ ìjọ kún ẹsẹ náà; ó pa arọ́pò-orúkọ ‘wọn’ mọ́. A tún ṣètò àwọn àmì ìsàlẹ̀ kí ọ̀kọ̀ọ̀kan lè dì mọ́ ọ̀rọ̀ tó yẹ.
