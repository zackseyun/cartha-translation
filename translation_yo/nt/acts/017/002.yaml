review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gbé àṣà Paulu, lílọ rẹ̀ sí ọ̀dọ̀ wọn, ìtẹ̀síwájú náà lórí ọjọ́ Ìsinmi mẹ́ta, àti ìjíròrò rẹ̀ láti inú Ìwé Mímọ́ kalẹ̀ dáadáa. Síbẹ̀, ‘ó wọlé tọ̀ wọ́n lọ’ kì í ṣe ọ̀nà Yorùbá tí ó rọrùn tàbí tí ó péye fún εἰσῆλθεν πρὸς αὐτούς. ‘Ó wọlé sí ọ̀dọ̀ wọn’ pa ìwọlé àti ìtọ́ka sí wọn mọ́ láì sọ sínágọ́gù tàbí ẹgbẹ́ kan pàtó. ‘Láti inú Ìwé Mímọ́’ tún sọ ἀπὸ τῶν γραφῶν hàn kedere ju ‘fi Ìwé Mímọ́’ lọ.
  naturalness: Àtúnṣe náà mú ìgbólóhùn náà rọrùn sí i nínú Yorùbá ìgbàlódé tí ó ní iyì. ‘Ó bá wọn jíròrò láti inú Ìwé Mímọ́’ jẹ́ ọ̀nà àdánidá fún ìjíròrò/ìrònú-ìdí tí ó dá lórí Ìwé Mímọ́.
  terminology: ‘àṣà Paulu,’ ‘ọjọ́ Ìsinmi,’ àti ‘Ìwé Mímọ́’ bá ìlò Yorùbá ìjọsìn tó wọ́pọ̀ mu. A gbe àmì [c] sí ‘jíròrò,’ ibi tí διελέξατο wà, àti [b] sí ‘ọjọ́ Ìsinmi mẹ́ta,’ kí àwọn àmì ìsàlẹ̀ lè bá àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
  issues:
  - severity: medium
    issue: ‘ó wọlé tọ̀ wọ́n lọ’ kò jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá tó dára.
    rationale: Ó dà bí ìpapọ̀ ‘wọlé’ àti ‘tọ̀ ... lọ’ tí kò wọ́pọ̀. ‘Ó wọlé sí ọ̀dọ̀ wọn’ jẹ́ ìtumọ̀ tó mọ́gbọ́n dání fún εἰσῆλθεν πρὸς αὐτούς.
  - severity: medium
    issue: ‘fi Ìwé Mímọ́ ṣe àlàyé’ ṣí ìtumọ̀ ἀπὸ (‘láti inú/from’) sí ìlò irinṣẹ́ (‘pẹ̀lú/by means of’), ó sì lè sọ διελέξατο di àlàyé ẹnìkan ṣoṣo.
    rationale: ‘Ó bá wọn jíròrò láti inú Ìwé Mímọ́’ pa ìbáṣepọ̀ ìjíròrò náà àti ìpìlẹ̀ rẹ̀ nínú Ìwé Mímọ́ mọ́.
  - severity: low
