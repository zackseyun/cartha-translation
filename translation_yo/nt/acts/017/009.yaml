  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n gba ìdánilójú lọ́wọ́ Jásónì àti àwọn yòókù[a], wọ́n dá wọn sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iye tó tó”; ó ṣeé ṣe kí ó jẹ́ ìlérí òfin tàbí owó ìdánilójú tí wọ́n fi rí i dájú pé wọn yóò hùwà ní àlàáfíà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Lẹ́yìn tí wọ́n gba
  rationale: Ọ̀rọ̀-ìṣe aláìpé aorist yìí ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì fi hàn pé gbígba náà ṣẹlẹ̀ kí wọ́n tó dá wọn sílẹ̀.
- source_word: τὸ ἱκανὸν
  choice: ìdánilójú
  rationale: Nínú àyíká òfin yìí, gbólóhùn náà tọ́ka sí ohun tí a gbà gẹ́gẹ́ bí ẹ̀rí tàbí ìlérí tó péye. ‘Ìdánilójú’ pa ìtumọ̀ òfin àti ti owó mọ́ láì sọ ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: lọ́wọ́ Jásónì àti àwọn yòókù
  rationale: παρά pẹ̀lú genitive túmọ̀ sí orísun ohun tí a gbà; ‘lọ́wọ́’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá. ‘Àwọn yòókù’ tọ́ka sí àwọn mìíràn tí wọ́n wà pẹ̀lú Jásónì.
- source_word: ἀπέλυσαν
  choice: wọ́n dá wọn sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìjọba tàbí òfin, ἀπολύω túmọ̀ sí dídá àwọn tí a dì mú sílẹ̀.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí tọ́ka sí Jásónì àti àwọn yòókù tí wọ́n mú.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìdánilójú’ láti pa àìdánilójú tó wà nínú τὸ ἱκανὸν mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ iye owó àti ohun ìdógò hàn.
