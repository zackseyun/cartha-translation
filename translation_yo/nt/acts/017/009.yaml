review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń fi ìtẹ̀lé ìṣe ti λαβόντες hàn dáadáa, ó sì túmọ̀ τὸ ἱκανὸν gẹ́gẹ́ bí ìdánilójú/ààbò òfin láì fi ìtumọ̀ ‘bẹ́ẹ̀lì’ tàbí iye owó kan pàtó kún un. ‘Wọ́n dá wọn sílẹ̀’ bá ἀπέλυσαν mu dáadáa nínú àyíká ìjọba-òfin.
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tó hàn gbangba, tó sì ní àmì ohùn tó yẹ. Àwọn yòókù jẹ́ ìtumọ̀ tó ṣeé gbà fún τῶν λοιπῶν, bí ó tilẹ̀ jẹ́ pé ‘àwọn ẹlòmíràn’ tún lè ṣee lò.
  terminology: ‘Ìdánilójú’ yẹ fún ìpìlẹ̀ òfin tàbí ìlérí ìdúró tí τὸ ἱκανὸν ń tọ́ka sí. Ṣùgbọ́n ‘ohun ìdógò’ nínú àlàyé ìsàlẹ̀ lè dámọ̀ràn ìfowópamọ́ nínú eré ìdógò dípò ìlérí òfin tàbí ìdúró; a tún un ṣe kí ó jẹ́ kedere.
  issues:
  - severity: low
    issue: Ọ̀rọ̀ ‘ohun ìdógò’ nínú àlàyé ìsàlẹ̀
    rationale: Nínú lílò Yorùbá òde òní, ìdógò sábà ń tọ́ka sí eré ìdógò/wager. Ó lè má sọ ìlérí òfin tàbí ìdúró (legal pledge/bond) tí àlàyé Gẹ̀ẹ́sì ń ṣàlàyé ní kedere.
