source:
  edition: SBLGNT
  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: yo
  text: Gbogbo àwọn ará Áténì àti àwọn àlejò tí wọ́n ń gbé níbẹ̀ kì í fi àkókò wọn ṣe ohun mìíràn ju láti máa sọ tàbí gbọ́ ohun tí ó tún jẹ́ tuntun sí i[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “ohun tuntun.” Ọ̀rọ̀ Gíríìkì náà lo ìpele afiwéra, “ohun tí ó tún jẹ́ tuntun sí i,” ó sì lè fi ìfẹ́ wọn sí ohun tuntun tí ó ṣẹ̀ṣẹ̀ dé hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Gbogbo àwọn ará Áténì
  rationale: “Àwọn ará Áténì” jẹ́ ọ̀nà Yorùbá àdánidá fún àwọn ènìyàn Áténì; “gbogbo” túmọ̀ πάντες. A kò fi δὲ ṣe ọ̀rọ̀ ìbẹ̀rẹ̀ lọ́tọ̀, nítorí pé ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí àyíká ọ̀rọ̀ lè gbé.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: àwọn àlejò tí wọ́n ń gbé níbẹ̀
  rationale: “Àlejò” fi hàn pé wọn kì í ṣe ọmọ ìlú náà; “tí wọ́n ń gbé níbẹ̀” mú ìtumọ̀ wíwà tàbí dídúró ní ibẹ̀ jáde láì sọ pé ibẹ̀ ni ibùgbé wọn títí láé.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: kì í fi àkókò wọn ṣe ohun mìíràn
  rationale: Ọ̀rọ̀ yìí mú àṣà tí ó ń ṣẹlẹ̀ léraléra nínú imperfect ηὐκαίρουν jáde, ó sì jẹ́ Yorùbá tó ṣe kedere fún lílo àkókò lórí ohun kan.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: ju láti máa sọ tàbí gbọ́ ohun
  rationale: Ilana “kì í… ju láti…” bá ìtumọ̀ ìyàsọ́tọ̀ ἢ mu; “sọ tàbí gbọ́” pa ìbáramu àwọn infinitive méjèèjì mọ́.
- source_word: καινότερον
  choice: tuntun jù lọ
  rationale: Comparative náà ní ìtumọ̀ ohun tí ó tún tuntun sí i—ìfẹ́ sí ohun àtẹ̀yìnwá jù lọ. “Tuntun jù lọ” jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn “ohun tuntun” hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ìṣe àṣà “kì í… máa…” láti mú imperfect Gíríìkì jáde, a sì pa àkíyèsí ìpele afiwéra καινότερον mọ́ nínú ọ̀rọ̀ àti àlàyé ìsàlẹ̀.
