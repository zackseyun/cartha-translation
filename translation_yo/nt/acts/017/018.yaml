id: ACT.17.18
reference: Acts 17:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: yo
  text: Àwọn kan nínú àwọn onímọ̀ ọgbọ́n orí Epikúríà àti Sítọ́íkì bá a ṣe ìjíròrò[a]. Àwọn kan ń sọ pé, “Kí ni aláṣọ̀rọ̀ asán yìí ń gbìyànjú láti sọ?”[b] Ṣùgbọ́n àwọn mìíràn sọ pé, “Ó dà bí ẹni pé ó ń kéde àwọn òrìṣà àjèjì,”[c][d] nítorí pé ó ń kéde ìhìn rere nípa Jésù àti àjíǹde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá a ṣe àríyànjiyàn” tàbí “bá a sọ̀rọ̀”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìjíròrò tàbí àríyànjiyàn.
    reason: lexical_alternative
  - marker: b
    text: “Aláṣọ̀rọ̀ asán” túmọ̀ ọ̀rọ̀ ẹ̀gàn kan tí ìtumọ̀ rẹ̀ ní ti gidi ní í ṣe pẹ̀lú “ẹni tí ń ṣa irúgbìn”; wọ́n máa ń lò ó fún ẹni tí wọ́n kà sí ẹni tí ń kó èérún èrò ká, tí ó sì ń tún un sọ.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn ẹ̀mí àjèjì” tàbí “àwọn ọlọ́run àjèjì.” Ó ṣeé ṣe kí àwọn olùsọ̀rọ̀ náà ní àwọn ẹ̀dá ọ̀run tí wọn kò mọ̀ lọ́kàn gẹ́gẹ́ bí èrò ìsìn abọ̀rìṣà wọn, kì í ṣe dandan àwọn ẹ̀mí búburú ní ìtumọ̀ Kristẹni tí ó wá lẹ́yìn náà.
    reason: alternative_reading
  - marker: d
    text: Àwọn kan rò pé ó ṣeé ṣe kí àwọn ará Átẹ́nsì ti gbà pé “àjíǹde” jẹ́ òrìṣà mìíràn, nítorí Pọ́ọ̀lù ń kéde Jésù àti àjíǹde.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: bá a jíròrò
  rationale: Ó fi ìbáṣepọ̀ nínú ìfọ̀rọ̀wérọ̀ hàn, ó sì lè ní ìtumọ̀ àríyànjiyàn láìfi dandan mú un pé ìjà ọ̀rọ̀ ni.
- source_word: σπερμολόγος
  choice: alágbáṣọ̀rọ̀
  rationale: Ọ̀rọ̀ ẹ̀gàn ni fún ẹni tí ó ń kó èérún èrò àwọn ẹlòmíràn jọ, tí ó sì ń tún wọn sọ; yíyan yìí sọ ẹ̀gàn náà di ohun tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Kí ni ... ń gbìyànjú láti sọ?
  rationale: Ó mú ìfojúsùn aláìdánilójú àti ẹ̀gàn inú optative pẹ̀lú ἄν jáde ní èdè Yorùbá àdánidá.
- source_word: Ξένων δαιμονίων
  choice: àwọn òrìṣà àjèjì
  rationale: Nínú ọ̀rọ̀ àwọn ará Átẹ́nsì abọ̀rìṣà, ó tọ́ka sí àwọn ẹ̀dá ọ̀run tàbí òrìṣà tí wọn kò mọ̀, kì í ṣe dandan àwọn ẹ̀mí búburú gẹ́gẹ́ bí ìlò Kristẹni lẹ́yìn náà.
- source_word: καταγγελεὺς
  choice: ẹni tí ó ń kéde
  rationale: Ó túmọ̀ sí ẹni tí ń kéde ohun kan ní gbangba; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá àdánidá mu.
- source_word: εὐηγγελίζετο
  choice: ó ń kéde ìhìn rere
  rationale: Ó pa ìtumọ̀ pàtó ti pípolongo ìròyìn rere mọ́ ju ọ̀rọ̀ gbogbogbò bíi wíwàásù lọ.
- source_word: ἀνάστασιν
  choice: àjíǹde
  rationale: Ó tọ́ka sí ohun tí Pọ́ọ̀lù ń kéde; a kò sọ ọ́ di orúkọ ẹni nínú àkọsílẹ̀ pàtàkì, ṣùgbọ́n a pa ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: àwọn onímọ̀ ọgbọ́n orí Epikúríà àti Sítọ́íkì
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti darúkọ àwọn ọmọ ilé-ẹ̀kọ́ ọgbọ́n orí méjèèjì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δαιμόνια nínú ọ̀rọ̀ àwọn abọ̀rìṣà
  choice: àwọn òrìṣà àjèjì
  alternative: àwọn ẹ̀mí èṣù àjèjì; àwọn ọlọ́run àjèjì
  rationale: Yíyan ‘òrìṣà’ fi ojú ìwòye àwọn olùsọ̀rọ̀ ará Átẹ́nsì hàn, kò sì fi ìtumọ̀ ẹ̀mí búburú ti èdè ẹ̀kọ́ Kristẹni tí ó wá lẹ́yìn náà lé ọ̀rọ̀ wọn lórí.
- issue: Bóyá kí a fi ἀνάστασιν hàn bí orúkọ òrìṣà kan
  choice: àjíǹde gẹ́gẹ́ bí orúkọ ohun tí ìhìn rere sọ nípa rẹ̀
  alternative: Àjíǹde gẹ́gẹ́ bí orúkọ ara ẹni tàbí òrìṣà
  rationale: Àlàyé Lúùkù sọ ohun tí Pọ́ọ̀lù ń kéde; ó dára láti pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àjíǹde, nígbà tí àlàyé ìsàlẹ̀ ń jẹ́ kí àǹfààní ìgbọ́ye àwọn ará Átẹ́nsì náà wà ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. A yan ‘onímọ̀ ọgbọ́n orí’ fún philosopher, a sì ṣe àfọwọkọ orúkọ àwọn ilé-ẹ̀kọ́ Gíríìkì sí Epikúríà àti Sítọ́íkì. Gbogbo àmì ohùn ni a fi síbi tí ó bá èdè àdánidá mu.
