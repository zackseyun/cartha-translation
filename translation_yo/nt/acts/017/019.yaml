source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: yo
  text: Nígbà náà, wọ́n mú un, wọ́n sì darí rẹ̀ lọ sí Áréópágù[b], wọ́n ń sọ pé, “Ǹjẹ́ a lè mọ kí ni ẹ̀kọ́ tuntun yìí tí ìwọ ń sọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí o ń sọ.” Ní ọ̀nà déédé, Gíríìkì ní, “ẹ̀kọ́ tí a ń sọ nípasẹ̀ rẹ.”
    reason: lexical_alternative
  - marker: b
    text: “Áréópágù” lè tọ́ka sí òkè náà fúnra rẹ̀ tàbí sí ìgbìmọ̀ tó ní í ṣe pẹ̀lú rẹ̀; orúkọ ìbílẹ̀ mìíràn ni “Òkè Máàsì.”
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: wọ́n mú un
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí dí mú, gbá mú, tàbí mú lọ. ‘Wọ́n mú un’ fi hàn pé àwọn ni wọ́n gbé ìgbésẹ̀ láti mú Pọ́ọ̀lù lọ, láì sọ ọ́ di ìmúṣẹ tàbí ìkóni lọ́wọ́ bí ẹni pé wọ́n ti dá a lẹ́bi.
- source_word: τε
  choice: Nítorí náà
  rationale: Asopọ̀ kékeré yìí ń tẹ ìtàn ẹsẹ̀ tó ṣáájú lọ; ‘Nítorí náà’ jẹ́ ọ̀nà àdánidá láti fi ìtẹ̀síwájú náà hàn ní Yorùbá.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: sí Áréópágù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní èdè Yorùbá, láì pinnu bóyá ó ń tọ́ka sí òkè náà, ìgbìmọ̀ tó ń péjọ níbẹ̀, tàbí àwọn méjèèjì.
- source_word: ἤγαγον
  choice: wọ́n sì mú un lọ
  rationale: ‘Mú ... lọ’ bá ìtumọ̀ ἄγω mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún mímú ẹnì kan dé ibi kan.
- source_word: λέγοντες
  choice: wọ́n ń sọ pé
  rationale: Ìṣe yìí ń lọ lẹ́gbẹ̀ẹ́ ìṣe pàtàkì náà; ‘wọ́n ń sọ pé’ pa ìbáṣepọ̀ participle náà mọ́ ní ọ̀nà tó ṣe kedere.
- source_word: Δυνάμεθα γνῶναι
  choice: Ǹjẹ́ a lè mọ
  rationale: Gbólóhùn náà jẹ́ ìbéèrè ọlọ́wọ̀, kì í ṣe ìwádìí agbára lásán. ‘Ǹjẹ́ a lè mọ’ jẹ́ àdánidá, ó sì pa ìrísí ìbéèrè Gíríìkì mọ́.
- source_word: καινὴ
  choice: tuntun
  rationale: ‘Tuntun’ jẹ́ ìtumọ̀ tó ṣe kedere fún ohun tí ó jẹ́ tuntun ní irú tàbí tí àwọn olùgbọ́ kò tíì mọ̀.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: tí ìwọ ń sọ
  rationale: Yorùbá máa ń fi gbólóhùn olùṣe hàn ní ọ̀nà yìí dípò passive tí yóò le. Àfikún ‘ìwọ’ pa ìtẹnumọ́ orísun ọ̀rọ̀ náà mọ́; àlàyé ìsàlẹ̀ fi ìrísí Gíríìkì tó túbọ̀ ṣe déédé hàn.
- source_word: διδαχή
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún teaching; kò ní ìró ìmọ̀ ẹ̀sìn onímọ̀ tó lè wà nínú ‘doctrine.’
theological_decisions:
- issue: Bí wọ́n ṣe mú Pọ́ọ̀lù lọ sí Áréópágù
  choice: Ìmú-lọ tí ó lè jẹ́ líle díẹ̀, ṣùgbọ́n tí a kò pè ní ìmúṣẹ
  alternative: Wọ́n gbá a mú bí ẹlẹ́wọ̀n; tàbí wọ́n kàn pè é tọ̀wọ̀tọ̀wọ̀
  rationale: ἐπιλαμβάνομαι lè ní agbára ju ìpè lásán lọ, ṣùgbọ́n àyíká ẹsẹ̀ náà fi ìfẹ́ láti gbọ́ ẹ̀kọ́ rẹ̀ hàn ju ìtakò ìdájọ́ lọ. ‘Wọ́n mú un’ kò dín ìgbésẹ̀ wọn kù, bẹ́ẹ̀ ni kò sọ ọ́ di ìmúṣẹ.
- issue: Ìtumọ̀ Ἄρειος Πάγος
  choice: Áréópágù, láì sọ bóyá ibi tàbí ìgbìmọ̀ ni pàtó
  alternative: Òkè Máàsì; tàbí ìgbìmọ̀ Áréópágù
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí òkè náà tàbí sí ìgbìmọ̀ tó ní í ṣe pẹ̀lú rẹ̀. Àkọsílẹ̀ orúkọ náà pa àìdánilójú ìtàn yìí mọ́.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá èdè àkọsílẹ̀ mu, a sì yẹra fún ọ̀rọ̀ tó lè sọ ìṣẹ̀lẹ̀ náà di ìmúṣẹ tàbí ìdájọ́ láìsí ẹ̀rí tó pé.
