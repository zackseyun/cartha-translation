source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti jẹ́ ọmọ Ọlọ́run, kò yẹ kí a rò pé ohun àtọ̀runwá[a] dàbí wúrà, fàdákà, tàbí òkúta, tàbí ohun gbígbẹ́[b] tí ènìyàn fi ọgbọ́n iṣẹ́ ọnà àti èrò inú rẹ̀ ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ọlọ́run,” “ìwà àtọ̀runwá,” tàbí “Ẹni Àtọ̀runwá.” Ọ̀rọ̀ Gíríìkì náà, τὸ θεῖον, jẹ́ ọ̀rọ̀ gbòòrò fún ohun tí ó jẹ́ àtọ̀runwá; nínú àríyànjiyàn Pọ́ọ̀lù níhìn-ín, ó ń tọ́ka sí Ọlọ́run tòótọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ère gbígbẹ́” tàbí “ohun tí a fín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: ọmọ
  rationale: Nínú ọ̀rọ̀ yìí, ó ń tọ́ka sí ìbátan àti jíjẹ́ ẹni tí ó ti ọ̀dọ̀ Ọlọ́run wá; “ọmọ Ọlọ́run” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, láìsọ ọ́ di ọ̀rọ̀ ẹ̀yà tàbí ìran ènìyàn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń fa ìparí ọ̀rọ̀ yọ láti inú ohun tí ó ṣẹ̀ṣẹ̀ sọ.
- source_word: ὑπάρχοντες
  choice: níwọ̀n bí a ti jẹ́
  rationale: 'Ọ̀rọ̀ aláìpin yìí ní agbára ìdí nínú àyíká ọ̀rọ̀: nítorí pé a jẹ́ ọmọ Ọlọ́run, ohun kan yẹ kí ó tẹ̀ lé e.'
- source_word: οὐκ ὀφείλομεν
  choice: kò yẹ kí a
  rationale: Ó sọ ojúṣe àti ohun tí kò bójú mu, kì í ṣe pé ohun náà kò ṣeé ṣe nìkan.
- source_word: νομίζειν
  choice: rò
  rationale: Ó jẹ́ ọ̀rọ̀ ìrònú gbòòrò, “rò” sì jẹ́ èdè Yorùbá adayeba ní àkópọ̀ yìí.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: wúrà tàbí fàdákà tàbí òkúta
  rationale: Ó pa gbogbo ohun èlò mẹ́tẹ̀ẹ̀ta tí Gíríìkì dárúkọ mọ́, pẹ̀lú àsopọ̀ ‘tàbí’ náà.
- source_word: χαράγματι
  choice: ohun gbígbẹ́
  rationale: Ó ń tọ́ka sí ohun tí a gbẹ́ tàbí tí a kọ àmì sí; yíyan yìí pa ìtumọ̀ iṣẹ́ ọwọ́ tí a dá mọ́.
- source_word: τέχνης
  choice: ọgbọ́n iṣẹ́ ọnà
  rationale: τέχνη lè túmọ̀ sí iṣẹ́ ọnà, ọgbọ́n iṣẹ́, tàbí iṣẹ́ ọwọ́; gbólóhùn yìí mú agbára iṣẹ́-ṣíṣe rẹ̀ jáde ní Yorùbá.
- source_word: ἐνθυμήσεως
  choice: èrò inú
  rationale: Ó ń tọ́ka sí ohun tí ènìyàn gbèrò tàbí dá nínú ọkàn rẹ̀; “èrò inú” ṣe kedere, ó sì bá ọ̀rọ̀ ṣíṣe ère mu.
- source_word: ἀνθρώπου
  choice: ènìyàn
  rationale: Ẹyọ ọ̀rọ̀ Gíríìkì náà dúró fún ènìyàn lápapọ̀; “ènìyàn” pa agbára gbogbo ènìyàn mọ́ láìdín in sí ọkùnrin kan.
- source_word: τὸ θεῖον
  choice: Ẹni Àtọ̀runwá
  rationale: Ó pa ìforúkọsílẹ̀ ọ̀rọ̀ Gíríìkì tó gbòòrò fún ohun tàbí ẹni tí ó jẹ́ ti Ọlọ́run mọ́, ṣùgbọ́n ó tún bá ìtọ́kasí Pọ́ọ̀lù sí Ọlọ́run tòótọ́ mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τὸ θεῖον nínú ọ̀rọ̀ tó jẹ́ ti Ọlọ́run kan ṣoṣo, tí a sì gbé kalẹ̀ ní èdè ìmọ̀-ọgbọ́n
  choice: Ẹni Àtọ̀runwá
  alternative: ìwà àtọ̀runwá; Ọlọ́run; ohun àtọ̀runwá
  rationale: “Ẹni Àtọ̀runwá” mú kí olùkà mọ̀ pé Pọ́ọ̀lù ń sọ̀rọ̀ nípa Ọlọ́run tòótọ́, síbẹ̀ kò yí τὸ θεῖον padà sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tó dín ìtumọ̀ rẹ̀ kù. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gbòòrò rẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. Àmì ohùn ni a lò níbi tí ó bá yẹ. Àmì gígùn (—) jẹ́ kí “ohun gbígbẹ́” ṣàlàyé àkójọ wúrà, fàdákà àti òkúta ní ọ̀nà tó bá ìṣètò Gíríìkì mu.
