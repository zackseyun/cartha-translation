id: ACT.17.23
reference: Acts 17:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: yo
  text: Nítorí bí mo ti ń kọjá lọ, tí mo sì ń ṣàkíyèsí àwọn ohun ìjọsìn yín, mo tilẹ̀ rí pẹpẹ kan tí a kọ sí i pé, “Sí ọlọ́run kan tí a kò mọ̀.”[a] Nítorí náà, ohun[b] tí ẹ ń sìn láìmọ̀, òun ni mo ń kéde fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Sí ọlọ́run tí a kò mọ̀.” Àkọlé náà ní èdè Gíríìkì kò ní atọ́ka pàtó; nítorí náà, ó lè túmọ̀ sí ọlọ́run kan tí a kò mọ̀, tàbí sí ọlọ́run tí a kò mọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “ẹni tí ẹ ń sìn láìmọ̀.” Ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ aláìlẹ́mìí, ìyẹn “ohun,” kì í ṣe “ẹni.”
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: bí mo ti ń kọjá lọ
  rationale: Ó sọ ìṣe tí ó ń lọ lọ́wọ́ gẹ́gẹ́ bí àkókò tí Pọ́ọ̀lù fi ń ṣàkíyèsí ìlú náà.
- source_word: ἀναθεωρῶν
  choice: ń ṣàkíyèsí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwo ohun dáadáa pẹ̀lú àfiyèsí, kì í ṣe wíwo lásán.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: àwọn ohun ìjọsìn yín
  rationale: Ó gba gbogbo ohun ẹ̀sìn tí wọ́n ń fi ọ̀wọ̀ àti ìfọkànsìn sí, láì dín ìtumọ̀ rẹ̀ kù sí ojúbọ nìkan.
- source_word: βωμόν
  choice: pẹpẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi tí a ti ń rú ẹbọ tàbí ṣe ìjọsìn.
- source_word: ἐπεγέγραπτο
  choice: tí a kọ ọ́ sí
  rationale: Ó fi hàn pé a ti kọ àkọlé náà sí ara pẹpẹ; ọ̀nà yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Ἀγνώστῳ θεῷ
  choice: Fún ọlọ́run kan tí a kò mọ̀
  rationale: ‘Kan’ fi àìní atọ́ka pàtó nínú Gíríìkì hàn ní ọ̀nà tí ó ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ọ̀nà ìtumọ̀ mìíràn mọ́.
- source_word: ὃ οὖν
  choice: Nítorí náà, ohun
  rationale: ‘Ohun’ pa irú ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ti Gíríìkì mọ́, ‘nítorí náà’ sì mú ìbáṣepọ̀ àbájáde οὖν jáde.
- source_word: ἀγνοοῦντες εὐσεβεῖτε
  choice: tí ẹ ń sìn láìmọ̀
  rationale: Ó sọ pé wọ́n ń ṣe ìfọkànsìn ẹ̀sìn sí ohun náà láì ní ìmọ̀ nípa rẹ̀, ó sì pa eré ọ̀rọ̀ tó ní í ṣe pẹ̀lú ‘tí a kò mọ̀’ mọ́.
- source_word: καταγγέλλω
  choice: mo ń kéde
  rationale: Ó bá ìkéde ní gbangba àti pẹ̀lú àṣẹ mu.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ aláìlẹ́mìí ὃ ń tọ́ka sí
  choice: ohun tí ẹ ń sìn láìmọ̀
  alternative: ẹni tí ẹ ń sìn láìmọ̀
  rationale: Gíríìkì lo arọ́pò-orúkọ aláìlẹ́mìí, nítorí náà a kò sọ ọ́ di ‘ẹni’ láìsí ìdí, a sì pa bí Pọ́ọ̀lù ṣe bẹ̀rẹ̀ láti ara ohun ìjọsìn wọn mọ́.
- issue: Bí a ṣe máa lóye Ἀγνώστῳ θεῷ
  choice: Fún ọlọ́run kan tí a kò mọ̀
  alternative: Fún ọlọ́run tí a kò mọ̀ náà
  rationale: Àkọlé Gíríìkì kò ní atọ́ka pàtó. Ìtumọ̀ àkọ́kọ́ fi èyí hàn, ṣùgbọ́n a jẹ́ kí àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí ìtumọ̀ pàtó tí ó tún ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, “ń ṣàkíyèsí” fún wíwo pẹ̀lú àfiyèsí, àti “ń kéde” fún ọ̀rọ̀ gbangba Pọ́ọ̀lù. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
