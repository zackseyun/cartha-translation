language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: yo
  text: Ọ̀rọ̀ náà sì dá àwọn kan nínú wọn lójú, wọ́n sì dara pọ̀ mọ́ Páùlù àti Sílà[a]; bẹ́ẹ̀ náà ni ọ̀pọ̀lọpọ̀ àwọn ará Gíríìkì tí wọ́n ń bẹ̀rù Ọlọ́run àti àwọn obìnrin pàtàkì tí kì í ṣe díẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì so ara wọn mọ́ Páùlù àti Sílà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: àwọn kan lára wọn
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtumọ̀ apá kan nínú gbogbo ẹgbẹ́ hàn, ó sì tọ́ka sí àwọn tó wà ní sínágọ́gù nínú ẹsẹ tó ṣáájú.
- source_word: ἐπείσθησαν
  choice: Ọ̀rọ̀ náà sì dá ... lójú
  rationale: Gbólóhùn yìí sọ àbájáde ìyípadà-ọkàn tí ọ̀rọ̀ ìṣe pàṣẹ́fù Gíríìkì náà ní, láì lo ọ̀rọ̀ tó túmọ̀ sí ‘gbọ́gbọ́’ ní tààràtà.
- source_word: προσεκληρώθησαν
  choice: wọ́n sì dara pọ̀ mọ́
  rationale: Ọ̀rọ̀ ìṣe tó ṣọ̀wọ́n yìí fi hàn pé wọ́n so ara wọn mọ́ Páùlù àti Sílà tàbí pé wọ́n wá wà ní ìrẹ́pọ̀ pẹ̀lú wọn. ‘Dara pọ̀ mọ́’ ṣe kedere ní Yorùbá òde òní, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ pa àwòrán ọ̀rọ̀ gangan mọ́.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: àwọn ará Gíríìkì tí wọ́n ń bẹ̀rù Ọlọ́run
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn náà sábà ń tọ́ka sí àwọn Kèfèrí tó ń bọ̀wọ̀ fún Ọlọ́run Ísírẹ́lì tí wọ́n sì ní ìbáṣepọ̀ pẹ̀lú ìjọsìn àwọn Júù. Ìtumọ̀ yìí mú ohun tí àyíká ọ̀rọ̀ ń sọ yéni.
- source_word: πλῆθος πολὺ
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ iye ńlá ní ṣókí àti ní ọ̀nà àdánidá.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: àwọn obìnrin ọlọ́lá
  rationale: Níhìn-ín, πρῶτος ń tọ́ka sí ipò gíga tàbí ọlá láwùjọ, kì í ṣe ẹni tó kọ́kọ́ wà ní ìtẹ̀lé àkókò.
- source_word: οὐκ ὀλίγαι
  choice: tí kì í ṣe díẹ̀
  rationale: Èyí pa ọ̀nà àsọyé onírẹ̀lẹ̀ tí Lúùkù lò mọ́, dípò kí a sọ ọ́ di ‘ọ̀pọ̀’ lásán.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ tó túmọ̀ sí ìgbàgbọ́ tààràtà tú ἐπείσθησαν
  choice: Ọ̀rọ̀ náà sì dá àwọn kan lára wọn lójú
  alternative: Àwọn kan lára wọn sì gbàgbọ́
  rationale: Gíríìkì lo πείθω, kì í ṣe πιστεύω. Yíyan ‘dá ... lójú’ pa ìyàtọ̀ ọ̀rọ̀ náà mọ́, ó sì jẹ́ kí àyíká ìwàásù ihinrere dúró láìfi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára ju ti orísun lọ kún un.
- issue: Bí a ṣe máa sọ irú ìdánimọ̀ ẹ̀sìn tí σεβομένων Ἑλλήνων ní
  choice: àwọn ará Gíríìkì tí wọ́n ń bẹ̀rù Ọlọ́run
  alternative: àwọn ará Gíríìkì olùfọkànsìn
  rationale: Nítorí bí Ìṣe Àwọn Àpọ́sítélì ṣe máa ń lo gbólóhùn yìí fún àwọn Kèfèrí tó ní ìbáṣepọ̀ pẹ̀lú ìjọsìn àwọn Júù, ‘tí wọ́n ń bẹ̀rù Ọlọ́run’ mú ìtumọ̀ ìtàn àti ẹ̀sìn rẹ̀ hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó mọ́, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó bá yẹ, a sì pa ọ̀nà àsọyé ‘kì í ṣe díẹ̀’ àti àìdánilójú díẹ̀ inú ọ̀rọ̀ ìṣe προσεκληρώθησαν mọ́ nípasẹ̀ àlàyé ẹsẹ̀ ìsàlẹ̀.
