revisions:
- from: Àwọn wọ̀nyí ní èrò inú tí ó yẹ fún ìyìn ju àwọn ará Tẹsalóníkà lọ[a], nítorí wọ́n fi gbogbo ìtara gba ọ̀rọ̀ náà[b], wọ́n sì ń yẹ Ìwé Mímọ́ wò lójoojúmọ́ láti mọ̀ bóyá àwọn nǹkan wọ̀nyí rí bẹ́ẹ̀.
  to: Àwọn wọ̀nyí ní ìwà ọlọ́lá jù àwọn ará Tẹsalóníkà lọ[a], nítorí wọ́n fi gbogbo ìtara gba ọ̀rọ̀ náà[b], wọ́n sì ń yẹ Ìwé Mímọ́ wò lójoojúmọ́ láti rí i bóyá àwọn nǹkan wọ̀nyí rí bẹ́ẹ̀.
  rationale: Àtúnṣe náà ní í ṣe pẹ̀lú ìsọ̀rọ̀ Yorùbá àti ìtọ́kasí kedere. ‘Ìwà ọlọ́lá’ ń sọ εὐγενέστεροι nípa ìhùwàsí tí ẹsẹ̀ náà fúnra rẹ̀ ṣàlàyé nípasẹ̀ ìtara wọn àti àyẹ̀wò Ìwé Mímọ́ wọn; àmì ìsàlẹ̀ ṣì pa ìtumọ̀ ipò àwùjọ tó ṣeé ṣe mọ́. A tún yí ‘láti mọ̀ bóyá’ sí ‘láti rí i bóyá’ láti ṣe ìbéèrè ìwádìí náà ní Yorùbá àdánidá. Kò sí ìyípadà sí ìtumọ̀ ẹsẹ̀ náà tàbí sí àwọn àmì ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gbé èrò pàtàkì ẹsẹ̀ náà kalẹ̀ dáadáa: ìfiwéra àwọn ará Bẹ́rèà pẹ̀lú àwọn tó wà ní Tẹsalóníkà, ìtẹ́wọ́gbà ọ̀rọ̀ náà pẹ̀lú ìtara, àti àyẹ̀wò Ìwé Mímọ́ lójoojúmọ́ láti wádìí bóyá ohun tí a sọ rí bẹ́ẹ̀. Àmì ìsàlẹ̀ méjèèjì sì dúró níbi tó yẹ. Síbẹ̀, ‘ní èrò inú tí ó yẹ fún ìyìn’ kò jẹ́ ọ̀nà tó rọrùn jù lọ láti sọ εὐγενέστεροι ní Yorùbá, ó sì lè dà bí ìyìn fún ‘èrò’ kan dípò ìwà àwọn ènìyàn náà.'
  naturalness: Àtúnṣe kékeré sí ‘ní ìwà ọlọ́lá jù’ mú gbolóhùn ìbẹ̀rẹ̀ rọrùn, ó sì fi ìtumọ̀ ìwà/ìwà-ọkàn tí àyíká ẹsẹ̀ náà ń tẹnumọ́ hàn. ‘láti rí i bóyá’ jẹ́ ìsọ̀rọ̀ Yorùbá tó dára fún ìbéèrè àìṣe-taara náà.
  terminology: ‘ọ̀rọ̀ náà,’ ‘Ìwé Mímọ́,’ ‘ìtara,’ àti ‘yẹ̀ ... wò’ bá ìlò Yorùbá Kristẹni òde òní mu, wọ́n sì jẹ́ olóòtọ́ sí λόγος, γραφάς, προθυμία, àti ἀνακρίνοντες. ‘Ìwà ọlọ́lá’ ṣe ìyàtọ̀ láàárín ìtumọ̀ ìwà tí a yàn ní ọ̀rọ̀ àkọ́kọ́ àti ìtumọ̀ ipò àwùjọ tí àmì ìsàlẹ̀ ń ṣàlàyé.
  issues:
  - severity: medium
    issue: ‘ní èrò inú tí ó yẹ fún ìyìn’ kò dára tó gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ fún εὐγενέστεροι.
    rationale: Ó ṣeé lóye, ṣùgbọ́n ìṣọ̀kan ‘èrò inú tí ó yẹ fún ìyìn’ kò wọ́pọ̀, ó sì lè mú kí olùkà ronú pé ‘èrò’ dípò ìwà àwọn ènìyàn ni a ń fi wé. ‘Ìwà ọlọ́lá’ jẹ́ ìsọ̀rọ̀ tó dájú síi, ó sì pa ìtumọ̀ ìwà rere/híhùwà lọ́lá mọ́ láìsọ pé wọ́n jẹ́ aristocrats.
  - severity: low
    issue: ‘láti mọ̀ bóyá’ le jẹ́ kedere síi gẹ́gẹ́ bí ‘láti rí i bóyá.’
    rationale: Mejèèjì lè túmọ̀ εἰ ἔχοι ταῦτα οὕτως, ṣùgbọ́n ‘rí i bóyá’ ń bá ìtumọ̀ ‘to see whether’ àti ìwádìí Ìwé Mímọ́ wọn mu dáadáa.
