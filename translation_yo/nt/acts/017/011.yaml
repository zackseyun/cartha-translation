source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: yo
  text: Àwọn wọ̀nyí ní ìwà ọlọ́lá jù àwọn ará Tẹsalóníkà lọ[a], nítorí wọ́n fi gbogbo ìtara gba ọ̀rọ̀ náà[b], wọ́n sì ń yẹ Ìwé Mímọ́ wò lójoojúmọ́ láti rí i bóyá àwọn nǹkan wọ̀nyí rí bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn wọ̀nyí jẹ́ ọlọ́lá ju àwọn ará Tẹsalóníkà lọ.” Ọ̀rọ̀ Giriki lè tọ́ka sí ìwà rere tí ó yẹ fún ìyìn tàbí, bó tilẹ̀ jẹ́ pé ìtumọ̀ yẹn kò fi bẹ́ẹ̀ ṣeé ṣe níhìn-ín, sí ipò àwùjọ tí ó ga.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi gbogbo ìtara tẹ́wọ́ gba ìhìn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: ní èrò inú tí ó yẹ fún ìyìn ju ... lọ
  rationale: Ní ìbámu pẹ̀lú àlàyé tí ó tẹ̀ lé e, ọ̀rọ̀ náà ń tọ́ka sí ìwà àti ìtẹ́wọ́gbà wọn tí ó yẹ fún ìyìn, kì í ṣe ipò ìdílé ọlọ́lá; ìtumọ̀ yìí sì yẹra fún ọ̀rọ̀ àjèjì tí kò mọ́gbọ́n dání ní Yorùbá.
- source_word: οἵτινες
  choice: nítorí wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà bẹ̀rẹ̀ àlàyé ohun tí ó mú kí a ka wọ́n sí ẹni tí ó yẹ fún ìyìn.
- source_word: ἐδέξαντο τὸν λόγον
  choice: gba ọ̀rọ̀ náà
  rationale: Ó pa àwòrán λόγος mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀,’ ó sì túmọ̀ ìtẹ́wọ́gbà wọn ní Yorùbá àdánidá.
- source_word: μετὰ πάσης προθυμίας
  choice: fi gbogbo ìtara
  rationale: ‘Gbogbo ìtara’ fi ipa πάσης hàn, ó sì mú ìmúratán àti ìfẹ́ inú ti προθυμία jáde.
- source_word: τὸ καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó sọ ìṣe tí wọ́n ń ṣe ní gbogbo ọjọ́ ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: ἀνακρίνοντες
  choice: ń yẹ ... wò
  rationale: ‘Yẹ̀ wò’ túmọ̀ ìwádìí àti àyẹ̀wò pẹ̀lẹ́pẹ̀lẹ́, láìfi ìtumọ̀ ìdájọ́ kún ọ̀rọ̀ náà.
- source_word: τὰς γραφὰς
  choice: Ìwé Mímọ́
  rationale: Ní àyíká Lúùkù–Ìṣe, ọ̀rọ̀ náà ń tọ́ka sí àwọn Ìwé Mímọ́ àwọn Júù; èyí ni ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti pè wọ́n.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: láti mọ̀ bóyá àwọn nǹkan wọ̀nyí rí bẹ́ẹ̀
  rationale: Ó pa ìbéèrè aláìṣe-taara náà mọ́, láìsọ ọ́ di ìdánilójú tàbí fi ‘òtítọ́’ kún ibi tí Giriki sọ pé bóyá àwọn nǹkan náà rí bẹ́ẹ̀.
theological_decisions:
- issue: Ìtumọ̀ εὐγενέστεροι ní àyíká ẹsẹ yìí
  choice: ìwà tàbí èrò inú tí ó yẹ fún ìyìn
  alternative: ọlọ́lá nípa ìbí tàbí ipò àwùjọ
  rationale: Gbólóhùn tó tẹ̀ lé e ṣàlàyé ìyìn wọn nípa bí wọ́n ṣe fi ìtara gba ọ̀rọ̀ náà, tí wọ́n sì yẹ Ìwé Mímọ́ wò. Síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ ipò àwùjọ tí ọ̀rọ̀ Giriki tún lè ní sílẹ̀.
- issue: Ìtumọ̀ λόγος
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà
  rationale: ‘Ọ̀rọ̀’ pa ìsopọ̀ ọ̀rọ̀ yìí mọ́ pẹ̀lú bí Lúùkù ṣe ń lo λόγος, láìfi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá bá àṣà ìkọ̀wé mu. A lo ‘Àwọn wọ̀nyí’ láìfi àmì àsọyé àkókò bí ‘Nígbà náà’ kún un, nítorí kò sí ọ̀rọ̀ bẹ́ẹ̀ ní orísun Giriki. ‘Ìwé Mímọ́’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lóde òní mọ̀, nígbà tí ‘ń yẹ ... wò’ ń sọ àyẹ̀wò ojoojúmọ́ wọn ní kedere.
