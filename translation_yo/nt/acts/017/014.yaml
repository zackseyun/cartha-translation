id: ACT.17.14
reference: Acts 17:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: yo
  text: Nígbà náà ni àwọn ará[a] rán Pọ́ọ̀lù lọ lẹ́sẹ̀kẹsẹ̀, kí ó lọ títí dé etí òkun[b]; ṣùgbọ́n Sílà àti Tímótì, àwọn méjèèjì, dúró síbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin” tàbí “àwọn arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “àwọn arákùnrin,” ṣùgbọ́n ó lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “lọ sí òkun” tàbí “lọ sí ọ̀nà etí òkun.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìrìn títí dé etíkun, láìsọ ohun tó ṣẹlẹ̀ lẹ́yìn náà ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé wọ́n gbé ìgbésẹ̀ náà láìjáfara, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: δὲ τότε
  choice: Nígbà náà ni
  rationale: Ó tọ́ka sí ìtẹ̀síwájú ìtàn àti àkókò ìṣẹ̀lẹ̀ náà láìfi agbára tí kò sí nínú àwọn patikulu Gíríìkì kún un.
- source_word: ἐξαπέστειλαν
  choice: rán ... lọ
  rationale: Ó sọ pé wọ́n mú kí Pọ́ọ̀lù kúrò níbẹ̀, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ ju ìtumọ̀ líle lọ.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn ará
  rationale: “Àwọn ará” bá àwòrán ìbátan tó wà nínú ἀδελφοί mu, ó sì lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀ ní Yorùbá; àlàyé ìtumọ̀ yìí wà ní àlàyé ìsàlẹ̀.
- source_word: πορεύεσθαι
  choice: kí ó lọ
  rationale: Ó mú ète tí infinitive náà ní lẹ́yìn ọ̀rọ̀ rírán hàn ní Yorùbá àdánidá.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: títí dé etí òkun
  rationale: Ó pa èrò ìrìn dé etíkun mọ́, láìpinnu bóyá Pọ́ọ̀lù kan lọ sí etíkun tàbí pé ó tẹ̀ síwájú lórí òkun.
- source_word: ὑπέμεινάν
  choice: dúró síbẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ṣì wà ní ibi náà, kì í ṣe pé wọ́n fara da ìpọ́njú.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Sílà àti Tímótì, àwọn méjèèjì
  rationale: “Àwọn méjèèjì” pa ìtẹnumọ́ ìsopọ̀ τε ... καὶ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐκεῖ
  choice: síbẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ àdánidá fún ibi tí wọ́n ti wà nínú ìtàn náà.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί fún àwùjọ àwọn onígbàgbọ́
  choice: àwọn ará
  alternative: àwọn arákùnrin; àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: “Àwọn ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó lè gba àwùjọ àwọn onígbàgbọ́ lápapọ̀, síbẹ̀ ó pa ìtumọ̀ ìbátan ẹbí ti ọ̀rọ̀ Gíríìkì mọ́. Àlàyé ìsàlẹ̀ ń jẹ́ kí ìwọ̀n ìtumọ̀ náà hàn gbangba láìfi èrò ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “rán ... lọ” àti “dúró síbẹ̀” fún ìṣàn ọ̀rọ̀ àdánidá, a sì fi “àwọn méjèèjì” pa ìtẹnumọ́ Sílà àti Tímótì mọ́.
