  text: So Paul went out from among them[a].
translation:
  language: yo
  text: Bẹ́ẹ̀ ni Pọ́ọ̀lù jáde kúrò láàárín wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípa bẹ́ẹ̀, Pọ́ọ̀lù fi àárín wọn sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ ni
  rationale: Níhìn-ín, ọ̀rọ̀ náà so ìparí ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì túmọ̀ sí ‘bẹ́ẹ̀ ni’ tàbí ‘nípa bẹ́ẹ̀.’ ‘Bẹ́ẹ̀ ni’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ìtàn náà mọ́.
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀ fún Paul.
- source_word: ἐξῆλθεν
  choice: jáde kúrò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘jáde,’ ‘lọ kúrò,’ tàbí ‘fi ibẹ̀ sílẹ̀.’ ‘Jáde kúrò’ pa ìrìn kúrò ní àárín àwùjọ náà mọ́.
- source_word: ἐκ μέσου αὐτῶν
  choice: láàárín wọn
  rationale: Pẹ̀lú ‘jáde kúrò,’ gbólóhùn yìí fi hàn pé Pọ́ọ̀lù kúrò ní àárín àwọn ènìyàn tí ó péjọ.
