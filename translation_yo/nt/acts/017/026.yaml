id: ACT.17.26
reference: Acts 17:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: yo
  text: Ó sì dá gbogbo orílẹ̀-èdè ènìyàn láti ara ọkùnrin kan, kí wọ́n lè gbé lórí gbogbo ojú ilẹ̀ ayé,[a] nípa títí pinnu àwọn àkókò tí a ti yàn kalẹ̀ fún wọn àti ààlà ibùgbé wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “láti inú ẹ̀jẹ̀ kan” dípò “láti ọ̀dọ̀ ẹnì kan.” Àkọ́kọ́ yìí tẹ̀ lé SBLGNT, tó ní “láti ọ̀dọ̀ ẹnì kan”; a fi “ọkùnrin” kún un nínú ìtumọ̀ láti mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere.
    reason: textual_variant
  - marker: b
    text: Tàbí “àwọn àkókò tí ó yàn fún wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: dá
  rationale: “Dá” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìṣe Ọlọ́run ní mímú àwọn orílẹ̀-èdè wá láti orísun kan, láìfi dandan sọ pé ẹsẹ̀ yìí ń ṣàlàyé ìṣẹ̀dá láti inú òfo.
- source_word: τε
  choice: sì
  rationale: “Sì” so gbólóhùn yìí mọ́ àríyànjiyàn tó ṣáájú rẹ̀ lọ́nà àdánidá nínú Yorùbá.
- source_word: ἐξ ἑνὸς
  choice: láti ara ọkùnrin kan
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “láti ọ̀dọ̀/ara ẹnì kan.” Fífi “ọkùnrin” kún un mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá, ní ìbámu pẹ̀lú ọ̀rọ̀ “ènìyàn” tó tẹ̀ lé e, láìgba àyípadà “ẹ̀jẹ̀ kan” wọ inú àkọ́kọ́.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: gbogbo orílẹ̀-èdè ènìyàn
  rationale: “Orílẹ̀-èdè” ṣàfihàn àwọn ènìyàn gẹ́gẹ́ bí ẹgbẹ́ orílẹ̀ tàbí ẹ̀yà, “ènìyàn” sì fi hàn pé gbogbo àwọn orílẹ̀ wọ̀nyí jẹ́ ti ìran ènìyàn.
- source_word: κατοικεῖν
  choice: kí wọ́n lè máa gbé
  rationale: Èyí fi ìtumọ̀ àbájáde tàbí ète inú infinitive náà hàn ní Yorùbá tó ṣe kedere.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: káàkiri gbogbo ojú ilẹ̀ ayé
  rationale: “Ojú ilẹ̀ ayé” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, “káàkiri gbogbo” sì sọ ìtànkálẹ̀ wọn ní gbogbo ilẹ̀ ayé lọ́nà àdánidá.
- source_word: ὁρίσας
  choice: ó ti pinnu
  rationale: Ọ̀rọ̀ yìí fi hàn pé Ọlọ́run ni ó fi ìdí àsìkò àti ààlà wọ̀nyí múlẹ̀.
- source_word: προστεταγμένους καιροὺς
  choice: àwọn àsìkò tí a yàn kalẹ̀ fún wọn
  rationale: “Àsìkò” lè tọ́ka sí àkókò pàtàkì tàbí sáà; “tí a yàn kalẹ̀” sì pa ìtumọ̀ pé a ti ṣètò wọn mọ́.
- source_word: ὁροθεσίας
  choice: ààlà
  rationale: “Ààlà” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ fún ibi tí a fi òpin sí ilẹ̀ tàbí agbègbè.
- source_word: τῆς κατοικίας αὐτῶν
  choice: ibi tí wọn yóò máa gbé
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ibùgbé wọn, ó sì pa ìtumọ̀ àpapọ̀ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe lè sọ ẹni tí ἐξ ἑνὸς ń tọ́ka sí ní kedere
  choice: láti ara ọkùnrin kan
  alternative: láti ara ẹnì kan
  rationale: Àkọ́kọ́ SBLGNT kò ní “ẹ̀jẹ̀.” Síbẹ̀, “láti ara ọkùnrin kan” mú ẹni tí a ń tọ́ka sí ṣe kedere, ó sì pa kókó Pọ́ọ̀lù nípa orísun kan ṣoṣo fún gbogbo ènìyàn mọ́.
- issue: Bí a ṣe lè túmọ̀ ἀνθρώπων láìdín ìtumọ̀ rẹ̀ kù sí akọ nìkan
  choice: ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Níhìn-ín ἀνθρώπων dúró fún gbogbo ìran ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; “ènìyàn” ni ìtumọ̀ àpapọ̀ tó bójú mu.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó níyì, tó ṣe kedere sí òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Ojú ilẹ̀ ayé” pa àwòrán Bíbélì mọ́, nígbà tí “ibi tí wọn yóò máa gbé” yàgò fún ọ̀rọ̀ àtijọ́ tàbí èdè tó le.
