  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: yo
  text: Nítorí o ń mú àwọn ohun àjèjì kan[a] wá sí etí wa. Nítorí náà, a fẹ́ mọ ohun tí àwọn nǹkan wọ̀nyí túmọ̀ sí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ohun láti òkèèrè” tàbí “àwọn ohun tí a kò mọ̀ rí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí ó dà bí àjèjì nítorí pé ó jẹ́ tuntun tàbí pé ó wá láti òkèèrè fún àwọn olùgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ohun tí àwọn nǹkan wọ̀nyí fẹ́ jẹ́,” àkànlò kan tó túmọ̀ sí “ohun tí àwọn nǹkan wọ̀nyí túmọ̀ sí” tàbí “ìjẹ́pàtàkì tí wọ́n ní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: àjèjì
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí ó dà bí tuntun, àjèjì tàbí ohun tí àwọn olùgbọ́ kò mọ̀ tẹ́lẹ̀. “Àjèjì” pa ìtumọ̀ yìí mọ́ láìfi ìyàlẹ́nu tó lágbára kún un.
- source_word: τινα
  choice: àwọn ohun ... kan
  rationale: Àpólà yìí fi hàn pé àwọn ohun tí a ń sọ kò ní ìdánimọ̀ pàtó; “kan” mú àìsọ pàtó náà jáde ní Yorùbá àdánidá.
- source_word: εἰσφέρεις
  choice: o ń mú ... wá
  rationale: Èyí pa àwòrán ìṣe mímú ohun kan wọlé mọ́, ó sì fi ìṣe tí ń lọ lọ́wọ́ hàn ní èdè Yorùbá.
- source_word: εἰς τὰς ἀκοὰς ἡμῶν
  choice: sí etí wa
  rationale: Àkànlò èdè Yorùbá yìí ṣe kedere, ó sì pa àwòrán etí inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: βουλόμεθα
  choice: a fẹ́
  rationale: “A fẹ́” jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere láti sọ ìfẹ́-inú wọn.
- source_word: γνῶναι
  choice: mọ
  rationale: Ó sọ ohun tí wọ́n fẹ́ ṣe ní tààràtà, bí èdè Gíríìkì ṣe rí.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: ohun tí àwọn nǹkan wọ̀nyí túmọ̀ sí
  rationale: Àkànlò Gíríìkì náà ń béèrè ìtumọ̀ tàbí pàtàkì ọ̀rọ̀ Paulu, kì í ṣe ìdánimọ̀ àwọn ohun náà lásán.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ ìdí tí γάρ ní mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìpinnu tí ó jáde láti inú gbólóhùn àkọ́kọ́ hàn kedere.
