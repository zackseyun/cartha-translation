  source_fidelity: Ìtumọ̀ náà gba ìṣe ìdúró-de Paulu, ìhùwàsí inú rẹ̀, àti ìlú tí ó kún fún ìbọ̀rìṣà. Síbẹ̀, “inú rẹ̀ korò” kò túmọ̀ τὸ πνεῦμα αὐτοῦ ... ἐν αὐτῷ ní kíkún, ó sì lè dín ìmúnilára líle παρωξύνετο kù sí ìkorò lásán. “Àwọn ère òrìṣà” sì mú κατείδωλον hàn ní pàtó ju “òrìṣà” lọ, nítorí ọ̀rọ̀ náà ń tọ́ka sí àwọn ère/ohun ìjọ́sìn nínú ìlú.
