source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: yo
  text: Nígbà tí Paulu ń dúró de wọn ní Atẹni, ẹ̀mí rẹ̀ ru sókè nínú rẹ̀[a] bí ó ti ń wo pé ìlú náà kún fún àwọn ère òrìṣà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “inú rẹ̀ bàjẹ́ gidigidi” tàbí “inú rẹ̀ bínú gidigidi”; ọ̀rọ̀ Gíríìkì náà fi ìmúnilára inú tí ó lágbára hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìlú náà ti di ti òrìṣà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: ń dúró de
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Paulu ń retí àwọn ẹlẹgbẹ́ rẹ̀.
- source_word: παρωξύνετο
  choice: inú rẹ̀ korò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìdàrúdàpọ̀ tàbí ìbínú líle nínú ẹni; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ìmọ̀lára inú náà mọ́.
- source_word: τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ
  choice: inú rẹ̀
  rationale: Ní àyíká yìí, ó ń tọ́ka sí ẹ̀mí tàbí ọkàn inú Paulu. Yorùbá àdánidá lè ṣàkójọpọ̀ ìtumọ̀ náà sí ‘inú rẹ̀’ láì tọ́ka sí Ẹ̀mí Mímọ́.
- source_word: θεωροῦντος
  choice: bí ó ti rí i
  rationale: Ó fi hàn pé ìhùwàsí inú Paulu ṣẹlẹ̀ nígbà tí ó ń wo ipò ìlú náà.
- source_word: κατείδωλον
  choice: kún fún òrìṣà
  rationale: Ó mú ìtumọ̀ pé àwọn ère tàbí ohun ìbọ̀rìṣà pọ̀ káàkiri ìlú náà jáde ní Yorùbá tí ó ṣe kedere.
- source_word: πόλιν
  choice: ìlú náà
  rationale: Ó pa ọ̀rọ̀ orísun mọ́, tí ó sì ń tọ́ka padà sí Atẹni.
theological_decisions:
- issue: Ẹni tí ‘ẹ̀mí rẹ̀’ ń tọ́ka sí
  choice: Ìhùwàsí inú Paulu fúnra rẹ̀
  alternative: Ìṣiṣẹ́ tàbí ìmísí Ẹ̀mí Mímọ́
  rationale: Àrọ́pò ohun-ìní αὐτοῦ àti ἐν αὐτῷ tọ́ka sí ohun tí ń ṣẹlẹ̀ nínú Paulu. Ẹsẹ̀ náà kò sọ ní tààrà pé Ẹ̀mí Mímọ́ ló ru u sókè, nítorí náà a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ yẹn kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘inú rẹ̀ korò’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìmúnibínú inú, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àwọn àṣàyàn tó sún mọ́ ìṣètò Gíríìkì mọ́.
