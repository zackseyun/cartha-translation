id: ACT.17.28
reference: Acts 17:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: yo
  text: Nítorí nínú rẹ̀ ni àwa ń wà láàyè, tí a sì ń rìn kiri, tí a sì wà, gẹ́gẹ́ bí àwọn kan nínú àwọn akéwì tiyín náà ti sọ pé, “Nítorí ìran rẹ̀ ni àwa pẹ̀lú jẹ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: inú rẹ̀ ni
  rationale: Ó pa àwòrán Gíríìkì ‘nínú rẹ̀’ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé nínú ọ̀rọ̀ yìí.
- source_word: ζῶμεν
  choice: àwa ti ń wà láàyè
  rationale: Ó túmọ̀ ìṣe tí ń bá a lọ, ‘a ń gbé láàyè,’ ní èdè Yorùbá adayeba.
- source_word: κινούμεθα
  choice: a sì ń rìn
  rationale: ‘Rìn’ níbí ní ìtumọ̀ gbígbéra tàbí ṣíṣípò; ó jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ κινούμεθα láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: ἐσμέν
  choice: a sì wà
  rationale: Ó pa ìyàtọ̀ láàárín ‘wà láàyè’ àti ‘wà’ mọ́, ó sì sọ ìwàláàyè tàbí ìwà-nílépa ní ṣókí bí Gíríìkì.
- source_word: ποιητῶν
  choice: akéwì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn tí ń dá ewì.
- source_word: γένος
  choice: irú-ọmọ
  rationale: Ó gba ìtumọ̀ ìran, ìdílé, tàbí ọmọ tí ọ̀rọ̀ Gíríìkì lè ní ní àyíká yìí, láì sọ ọ́ di ‘àwọn ọmọ’ ní ọ̀nà tó lè mú ẹ̀kọ́ ìsìn pàtó wọlé.
theological_decisions:
- issue: Ìtumọ̀ ἐσμέν gẹ́gẹ́ bí ìwà tàbí ìwàláàyè
  choice: a sì wà
  alternative: a sì ń bẹ / a sì ní ìwàláàyè
  rationale: ‘A sì wà’ pa gbolohun Gíríìkì tó rọrùn àti tó jinlẹ̀ mọ́, láì ṣàlàyé irú ìwà tí Pọ́ọ̀lù ní lọ́kàn ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìbáṣepọ̀ ènìyàn sí Ọlọ́run nínú γένος
  choice: irú-ọmọ rẹ̀
  alternative: ọmọ rẹ̀ / ìran rẹ̀
  rationale: ‘Irú-ọmọ’ fi ìbátan orísun tàbí ẹ̀dá hàn, ṣùgbọ́n kò fi dandan sọ pé gbogbo ènìyàn jẹ́ ọmọ Ọlọ́run ní ìtumọ̀ ìgbàlà tàbí ìgbàgbọ́.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ adayeba, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. A pa ìtẹ̀síwájú mẹ́ta ‘wà láàyè—rìn—wà’ mọ́ àti àyọkà akéwì náà ní ṣókí.
