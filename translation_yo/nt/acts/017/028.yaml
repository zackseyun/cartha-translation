revisions:
- from: Nítorí pé inú rẹ̀ ni àwa ti ń wà láàyè, tí a sì ń rìn, tí a sì wà; gẹ́gẹ́ bí àwọn kan lára àwọn akéwì tiyín pẹ̀lú ti sọ pé, “Nítorí àwa pẹ̀lú jẹ́ irú-ọmọ rẹ̀.”
  to: Nítorí nínú rẹ̀ ni àwa ń wà láàyè, tí a sì ń rìn kiri, tí a sì wà, gẹ́gẹ́ bí àwọn kan nínú àwọn akéwì tiyín náà ti sọ pé, “Nítorí ìran rẹ̀ ni àwa pẹ̀lú jẹ́.”
  rationale: A yọ ‘ti’ kúrò láti fi present ζῶμεν hàn dáadáa; a ṣe κινούμεθα ní ‘ń rìn kiri’ láti má dín un kù sí rírìn ẹsẹ̀ lásán; a sì rọ́pò ‘irú-ọmọ’ pẹ̀lú ‘ìran’ fún γένος nítorí ìbámu rẹ̀ pẹ̀lú àyọkà akéwì àti lílo Yorùbá adayeba. A pa ìtẹ̀síwájú ‘wà láàyè—rìn kiri—wà,’ ìtọ́kasí sí ‘àwọn kan,’ àti ‘àwa pẹ̀lú’ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú èrò pàtàkì ẹsẹ̀ náà wá: ìgbẹ́kẹ̀lé ìyè, ìrìn/ìṣípayá, àti ìwà ènìyàn nínú Ọlọ́run, pẹ̀lú ìtọ́kasí sí àwọn akéwì àwọn olùgbọ́. Síbẹ̀, “a ti ń wà láàyè” ń fi ‘ti’ tí kò sí nínú Gíríìkì kún ìṣe tí ń lọ, “a ń rìn” lè dín κινούμεθα kù sí rírìn lọ́nà ẹsẹ̀, àti “irú-ọmọ” kì í ṣe ọ̀nà tó rọrùn jù lọ láti sọ γένος nínú ìtàn yìí.'
  naturalness: Ọ̀rọ̀ náà lóye, ṣùgbọ́n “àwọn akéwì tiyín pẹ̀lú” kò rọrùn bí “àwọn akéwì tiyín náà,” “irú-ọmọ rẹ̀” sì lè dà bí irú ẹ̀dá tàbí ẹ̀yà ọmọ, kì í ṣe ìbátan ìran tí àyọkà akéwì ń sọ. Àtúnṣe náà ń pa ìlànà gbolohun mẹ́ta náà mọ́ ní Yorùbá tó dára.
  terminology: '“Ìran rẹ̀” jẹ́ ìbámu tó dára fún γένος níbí: ó lè túmọ̀ sí ìran tàbí ọmọ ìran, ó sì yẹ fún àyọkà ewì tí Pọ́ọ̀lù fa. Kò yẹ kí a sọ ọ́ di “àwọn ọmọ rẹ̀,” nítorí èyí lè ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn kan.'
  issues:
  - severity: medium
    issue: Àsìṣe aspect nínú “àwa ti ń wà láàyè”
    rationale: ζῶμεν jẹ́ present tense; ‘ti ń’ sábà ń tọ́ka sí ohun tí ó ti bẹ̀rẹ̀ tàbí ìtẹ̀síwájú tó ní ìdí àkókò. ‘Àwa ń wà láàyè’ ń sọ present náà ní tààrà.
  - severity: medium
    issue: “A ń rìn” dín κινούμεθα kù
    rationale: κινούμεθα túmọ̀ sí ‘a ń sún/ṣípayá’ tàbí ‘a ń rìn’ ní ìmọ̀ gbooro. Fífi ‘rìn kiri’ hàn ń yà á kúrò nínú rírìn ẹsẹ̀ lásán láì sọ ìtumọ̀ àfikún.
  - severity: medium
    issue: “Irú-ọmọ rẹ̀” kò dára gẹ́gẹ́ bí ìtumọ̀ γένος ní ayọkà ewì
    rationale: Ní Yorùbá, ‘irú-ọmọ’ lè túmọ̀ sí kind/species of offspring. ‘Ìran rẹ̀’ sọ ìbátan ìran/ìdílé tó wà nínú γένος ní ti ara, ó sì pa àìdánilójú ẹ̀kọ́ ìsìn mọ́.
  - severity: low
    issue: Ìṣọ̀kan gbolohun ‘àwọn akéwì tiyín pẹ̀lú’
    rationale: ‘Àwọn kan nínú àwọn akéwì tiyín náà’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν.
