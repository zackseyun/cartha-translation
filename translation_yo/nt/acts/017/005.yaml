id: ACT.17.5
reference: Acts 17:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: yo
  text: Ṣùgbọ́n, níwọ̀n bí owú ti bẹ̀rẹ̀ sí í pa àwọn Júù, wọ́n mú àwọn ọkùnrin búburú kan lára àwọn tí wọ́n wà ní ọjà dáràpọ̀ mọ́ ara wọn; wọ́n kó ogunlọ́gọ̀ jọ, wọ́n sì ń dá ìlú rú. Wọ́n dé ilé Jásónì, wọ́n sì ń gbìyànjú láti mú wọn jáde wá sí ìpéjọ àwọn ará ìlú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sí ìpéjọ gbogbogbò” tàbí “síwájú àwọn ará ìlú.” Ọ̀rọ̀ Gíríìkì δῆμος ń tọ́ka sí ara àwọn ará ìlú tí wọ́n péjọ ní gbangba, kì í ṣe ogunlọ́gọ̀ tí kò ní ìdánimọ̀ lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: owú bẹ̀rẹ̀ sí í pa
  rationale: Ó fi ìtumọ̀ ìṣe tí ó bẹ̀rẹ̀ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé owú mú wọn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì láì dín un kù sí àwọn olórí Júù tàbí gbòòrò rẹ̀ ju bí ọ̀rọ̀ náà ti rí lọ; àyíká fi hàn pé ẹgbẹ́ kan ní Tẹsalóníkà ni.
- source_word: προσλαβόμενοι
  choice: wọ́n fa ... mọ́ ara wọn
  rationale: Ó sọ pé wọ́n mú àwọn ẹlòmíràn darapọ̀ mọ́ ara wọn, láì fi èrò pé wọ́n yá wọn sí iṣẹ́ kún un.
- source_word: τῶν ἀγοραίων
  choice: lára àwọn tí wọ́n wà ní ọjà
  rationale: Ó pa ìbáṣepọ̀ wọn pẹ̀lú ibi ọjà mọ́ láì pe wọn ní ọ̀lẹ tàbí aláìníṣẹ́, èyí tí yóò jẹ́ àlàyé àfikún.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: àwọn ọkùnrin búburú kan
  rationale: Ó pa ìtọ́kasí sí ọkùnrin àti ìdájọ́ ìwà búburú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὀχλοποιήσαντες
  choice: wọ́n kó ogunlọ́gọ̀ jọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkó ọ̀pọ̀ ènìyàn jọ; àyíká rúkèrúdò mú kí ‘ogunlọ́gọ̀’ bá a mu.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: wọ́n ń dá ìlú rú
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì sọ rúkèrúdò náà ní Yorùbá àdánidá.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: wọ́n dé ilé Jásónì
  rationale: Nínú ìtẹ̀síwájú ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí dídé ibi náà; ‘kọlu’ yóò lágbára ju ẹ̀rí ọ̀rọ̀ lọ.
- source_word: ἐζήτουν
  choice: wọ́n ń wá ọ̀nà
  rationale: Ó pa ìsapá tí ó ń bá a lọ mọ́, ó sì bá ọ̀rọ̀ àfojúsùn tí ó tẹ̀ lé e mu ní Yorùbá.
- source_word: αὐτοὺς
  choice: wọn
  rationale: A pa arọ́pò-orúkọ orísun mọ́ dípò fífi Pọ́ọ̀lù àti Sílà sínú ọ̀rọ̀ ní tààrà.
- source_word: προαγαγεῖν
  choice: láti mú wọn jáde wá síwájú
  rationale: Ó kó ìtumọ̀ mímú wọn jáde kúrò ní ilé àti mímú wọn wá síwájú àwọn ẹlòmíràn pọ̀.
- source_word: εἰς τὸν δῆμον
  choice: síwájú ìpéjọ àwọn ará ìlú
  rationale: δῆμος níbí ń tọ́ka sí ara ìlú tí ó péjọ ní gbangba, kì í ṣe ogunlọ́gọ̀ tí kò ní ìdánimọ̀ lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ οἱ Ἰουδαῖοι nínú ìtàn ìforígbárí
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘àwọn Júù’ ní tààrà. A kò fi ohun tí kò sí nínú rẹ̀ dín ìtọ́kasí náà kù sí àwọn olórí, bẹ́ẹ̀ ni a kò túmọ̀ rẹ̀ sí gbogbo Júù ní gbogbo ibi; àyíká ni ó fi ẹgbẹ́ tí ó wà ní Tẹsalóníkà hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo àwọn gbólóhùn àdánidá bí ‘owú bẹ̀rẹ̀ sí í pa’ àti ‘dá ìlú rú,’ ṣùgbọ́n a pa ìtẹ̀síwájú àwọn ìṣe àti ìtumọ̀ ìpéjọ ara ìlú mọ́.
