  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí àwọn nǹkan wọ̀nyí kò ṣeé tako[a], ó jẹ́ dandan kí ẹ farabalẹ̀[b], kí ẹ má sì ṣe ohunkóhun ní kánjú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò ṣeé já ní ọ̀rọ̀” tàbí “kò sí àríyànjiyàn sí wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ dákẹ́” tàbí “ẹ máa pa ọkàn yín balẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ẹ má ṣe ohunkóhun láìronú dáadáa” tàbí “kí ẹ má ṣe ohunkóhun ní ìfẹ̀fẹ̀ẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: kò ṣe ṣeé já ní ọ̀rọ̀
  rationale: Ó túmọ̀ sí ohun tí kò ṣeé tako tàbí ṣe àríyànjiyàn sí; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára gbólóhùn Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọgbọ́n tí ó jáde láti inú ọ̀rọ̀ tí ó ṣáájú hàn.
- source_word: ὄντων τούτων
  choice: níwọ̀n bí àwọn nǹkan wọ̀nyí ... ṣe
  rationale: Àyọkà yìí fi ìpìlẹ̀ tàbí ìdí fún ìkìlọ̀ náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δέον ἐστίν
  choice: ó yẹ
  rationale: Ó ṣàfihàn dandan tàbí ojúṣe, láìjẹ́ kí èdè náà le jù fún òǹkàwé lónìí.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: kí ẹ fara balẹ̀
  rationale: Ó ṣàpèjúwe jíjẹ́ ẹni tí ọkàn rẹ̀ balẹ̀, kì í ṣe dídákẹ́ lasán.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: kí ẹ má ... ṣe ohunkóhun láìronú jinlẹ̀
  rationale: Ó pa ìkìlọ̀ mọ́ pé wọn kò gbọdọ̀ ṣe ohun kan ní kánjú tàbí láìgbé àbájáde rẹ̀ yẹ̀ wò.
