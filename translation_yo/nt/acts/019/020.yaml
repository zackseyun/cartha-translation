  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: yo
  text: Bẹ́ẹ̀ ni ọ̀rọ̀ Olúwa ń dàgbà, ó sì ń borí pẹ̀lú agbára.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ Olúwa ń dàgbà gidigidi, ó sì ń borí.” Gbólóhùn κατὰ κράτος lè túmọ̀ sí “gidigidi” tàbí “pẹ̀lú agbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ ni
  rationale: Ó fi àbájáde àwọn ìṣẹ̀lẹ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: κατὰ κράτος
  choice: lọ́nà alágbára
  rationale: Ó mú ìtumọ̀ agbára àti ipa tó lágbára jáde, ó sì lè bá ìṣe ìdàgbàsókè náà lọ ní Yorùbá.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: A pa oyè Gíríìkì náà mọ́ láì sọ ní pàtó pé Jésù, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí i.
- source_word: ὁ λόγος
  choice: ọ̀rọ̀
  rationale: Ó pa ọ̀rọ̀ ìlò Lúùkù mọ́, ó sì ń tọ́ka sí ìhìn tí wọ́n ń kéde.
- source_word: ηὔξανεν
  choice: ń dàgbà
  rationale: Àmì ‘ń’ fi ìṣe tó ń bá a lọ nínú imperfect hàn.
- source_word: ἴσχυεν
  choice: ń borí
  rationale: Nínú àyíká yìí, ó sọ bí ọ̀rọ̀ náà ṣe ń ní ipa, tí kò sì jẹ́ kí ohun tó dojú kọ ọ́ dá a dúró.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ nínú τοῦ κυρίου ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì fi hàn pé ó ṣeé ṣe kó jẹ́ Jésù, ṣùgbọ́n Gíríìkì sọ ‘Olúwa’ nìkan; ìtumọ̀ náà kò fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tó yé àwọn òǹkàwé lasán; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
