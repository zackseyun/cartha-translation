id: ACT.19.37
reference: Acts 19:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: yo
  text: Nítorí ẹ̀yin ti mú àwọn ọkùnrin wọ̀nyí wá síbí; wọn kì í ṣe àwọn olè tẹ́ńpìlì, bẹ́ẹ̀ ni wọn kì í sọ ọ̀rọ̀ ẹ̀gàn sí òrìṣà obìnrin wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “ọlọ́run wa”; Átẹ́mísì ni ọ̀rọ̀ náà ń tọ́ka sí, nítorí náà “òrìṣà obìnrin wa” ló mú ìtumọ̀ inú àyíká náà hàn kedere ní Yorùbá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: ẹ̀yin ti mú ... wá síbí
  rationale: Aorist ἄγω ń tọ́ka sí ìṣe tí wọ́n ti parí ní ojú ìṣẹ̀lẹ̀ náà; ‘ti mú ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà, ‘síbí’ sì mú agbára ìtọ́ka τούτους hàn nínú àpéjọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ṣe àfihàn ìdí tàbí àlàyé tí ó ń ṣètìlẹ́yìn fún ọ̀rọ̀ olùsọ.
- source_word: τοὺς ἄνδρας τούτους
  choice: àwọn ọkùnrin wọ̀nyí
  rationale: ἀνήρ túmọ̀ sí àwọn ọkùnrin níbí, τούτους sì jẹ́ ọ̀rọ̀ ìtọ́ka sí àwọn tí ó wà níwájú àpéjọ.
- source_word: οὔτε ... οὔτε
  choice: bí ó tilẹ̀ jẹ́ pé ... kì í ṣe ..., bẹ́ẹ̀ ni ... kò
  rationale: Ìṣètò yìí sọ ìkọ̀ méjèèjì ní Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ οὔτε ... οὔτε mọ́.
- source_word: ἱεροσύλους
  choice: àwọn olè tẹ́ńpìlì
  rationale: Ọ̀rọ̀ náà tọ́ka ní pàtó sí àwọn tí ń jí ohun inú tẹ́ńpìlì tàbí tí ń ba ohun mímọ́ jẹ́; ‘olè tẹ́ńpìlì’ ṣe kedere fún òǹkàwé òde òní.
- source_word: βλασφημοῦντας
  choice: sọ̀rọ̀-òdì sí
  rationale: Participle náà ń sọ̀rọ̀ nípa ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ àbùkù sí òrìṣà; gbolohun yìí jẹ́ kíkà Yorùbá tí ó ṣe kedere ju lílo ọ̀rọ̀ ẹ̀sìn tí kò wọ́pọ̀ lọ.
- source_word: τὴν θεὸν ἡμῶν
  choice: abo òrìṣà wa
  rationale: Ohun tí θεός ń tọ́ka sí ní àyíká yìí ni Átẹ́mísì, abo òrìṣà àwọn ará Éfésù. ‘Abo òrìṣà’ jẹ́ kí akọ tàbí abo ẹni tí a ń tọ́ka sí ṣe kedere láì mú un dà bí Ọlọ́run tòótọ́.
theological_decisions:
- issue: Ìtumọ̀ θεὸν ἡμῶν nígbà tí ó ń tọ́ka sí Átẹ́mísì
  choice: abo òrìṣà wa
  alternative: ọlọ́run wa
  rationale: Olùsọ jẹ́ aṣojú ará Éfésù abọ̀rìṣà, Átẹ́mísì sì ni ó ń tọ́ka sí. ‘Abo òrìṣà wa’ ń pa ìtọ́kasí gidi mọ́, kò sì jẹ́ kí òǹkàwé rò pé Ọlọ́run tòótọ́ ni a ń sọ. Èyí jẹ́ ìpinnu ọ̀rọ̀ àti àyíká, kì í ṣe ìfọwọ́sí ìjọsìn òrìṣà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tí ó ṣe kedere fún òǹkàwé òde òní. ‘Tẹ́ńpìlì’ ni a lò fún ἱερόν láti yà ilé ìjọsìn abọ̀rìṣà yìí sọ́tọ̀ kúrò ní ‘tẹ́ńpìlì’ bí ọ̀rọ̀ àṣà Bíbélì; ‘abo òrìṣà’ sì ń pa ìtọ́kasí Átẹ́mísì mọ́.
