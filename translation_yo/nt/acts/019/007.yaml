lexical_decisions:
- source_word: ἦσαν
  choice: jẹ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ‘wọ́n jẹ́’; ní Yorùbá, ‘Gbogbo wọn jẹ́...’ jẹ́ ọ̀nà àdánidá láti sọ iye àwọn ènìyàn náà.
- source_word: δὲ
  choice: —
  rationale: δέ jẹ́ asopọ̀ pẹ̀lẹ́ tí kò fi ìtakora pàtàkì hàn níbí; fífi sílẹ̀ láìtumọ̀ rẹ̀ jẹ́ Yorùbá àdánidá, kò sì dín ìtumọ̀ kù.
- source_word: οἱ πάντες
  choice: Gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo ẹgbẹ́ náà, ó sì pa agbára ìṣirò àpapọ̀ mọ́.
- source_word: ἄνδρες
  choice: ọkùnrin
  rationale: ἀνήρ níbí tọ́ka sí àwọn ọkùnrin, kì í ṣe àwọn ènìyàn lápapọ̀; ‘ọkùnrin’ pa ìyàtọ̀ akọ mọ́.
- source_word: ὡσεὶ
  choice: bíi
  rationale: ὡσεὶ fi hàn pé iye náà jẹ́ àfojúsùn, ‘bíi’ sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìsúnmọ́ iye.
- source_word: δώδεκα
  choice: méjìlá
  rationale: Èyí ni nọ́ńbà kádínà Yorùbá tó bá ‘méjìlá’ mu.
