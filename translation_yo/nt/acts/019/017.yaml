id: ACT.19.17
reference: Acts 19:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: yo
  text: Ọ̀ràn yìí sì di mímọ̀ fún gbogbo àwọn Júù àti àwọn Gíríìkì tí ń gbé ní Éfésù. Ẹ̀rù sì ba gbogbo wọn[a], a sì ń gbé orúkọ Olúwa Jésù ga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìbẹ̀rù sì dé bá gbogbo wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “orúkọ Olúwa Jésù sì ń di ńlá,” tàbí, “orúkọ Olúwa Jésù sì ń gba ọlá púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Ọ̀ràn yìí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ ṣáájú; ‘ọ̀ràn yìí’ ṣe kedere ní Yorùbá láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: ἐγένετο γνωστὸν
  choice: di mímọ̀
  rationale: 'Èyí pa ìtumọ̀ ìbẹ̀rẹ̀ ipò tuntun mọ́: ọ̀ràn náà bẹ̀rẹ̀ sí í di ohun tí àwọn ènìyàn mọ̀.'
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: fún gbogbo àwọn Júù àti àwọn Gíríìkì
  rationale: ‘Fún’ fi ipa dátífù hàn, ‘gbogbo’ sì kan àwọn ẹgbẹ́ méjèèjì gẹ́gẹ́ bí gbolohun orísun.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: tí ń gbé ní Éfésù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn náà ń gbé ibẹ̀, ó sì ṣàpèjúwe Júù àti Gíríìkì papọ̀.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Ẹ̀rù sì ba gbogbo wọn
  rationale: Àpólà Yorùbá yìí jẹ́ àdánidá, ó sì fi ìbẹ̀rù tó dé bá gbogbo wọn lójijì hàn, bí ìṣípò ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: φόβος
  choice: Ẹ̀rù
  rationale: ‘Ẹ̀rù’ lè gba ìbẹ̀rù, ìpayà, tàbí ìbẹ̀rù ọlọ́wọ̀ọ̀wọ̀ wọlé láì fi dandan pinnu irú ìmọ̀lára náà ju orísun lọ.
- source_word: ἐμεγαλύνετο
  choice: a sì ń gbé ... ga
  rationale: Ìlò aṣojú aláìlórúkọ ‘a’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe aláìṣe pàtó; ‘ń’ sì pa ìṣe tí ń bá a lọ nínú àkókò aláìparí mọ́.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: A pa ‘orúkọ’ mọ́ dípò fífi ‘òkìkí’ rọ́pò rẹ̀, kí ìtumọ̀ nípa ẹni, ọlá, àti àṣẹ má bà a dín kù.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jésù
  rationale: ‘Olúwa’ tú κύριος gẹ́gẹ́ bí oyè Kristi, gẹ́gẹ́ bí gbolohun náà ṣe fi hàn.
theological_decisions:
- issue: Bí a ṣe tú κύριος nígbà tí ó ń tọ́ka sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Níbí, κύριος jẹ́ oyè Kristi; ‘Olúwa’ pa ìwọ̀n ẹ̀kọ́-ìgbàgbọ́ àti ìlò Bíbélì mọ́ láì sọ ọ́ di àlàyé ẹ̀ya ìjọ kan.
- issue: Bí a ṣe tú τὸ ὄνομα gẹ́gẹ́ bí ‘orúkọ’ tàbí ‘òkìkí’
  choice: orúkọ Olúwa Jésù
  alternative: òkìkí Olúwa Jésù
  rationale: Orísun sọ ‘orúkọ’ ní tààrà; pípa ọ̀rọ̀ náà mọ́ jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹni Jésù, ọlá rẹ̀, àti àṣẹ rẹ̀ wà ní ṣíṣí.
- issue: Bí a ṣe fi ohùn àìṣe ἐμεγαλύνετο hàn
  choice: a sì ń gbé orúkọ Olúwa Jésù ga
  alternative: orúkọ Olúwa Jésù sì ń di ńlá
  rationale: Ọ̀nà tí a yàn jẹ́ Yorùbá àdánidá fún olùṣe tí a kò dárúkọ, ó sì pa ìtumọ̀ pé àwọn ènìyàn ń bu ọlá fún orúkọ náà mọ́; àṣàyàn kejì lè dà bí ẹni pé orúkọ náà ń tóbi nípa ìwọ̀n.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo ‘Júù,’ ‘Gíríìkì,’ àti ‘Éfésù’ gẹ́gẹ́ bí orúkọ tí ó wọ́pọ̀ ní Yorùbá. Ìlò ‘a’ jẹ́ aṣojú aláìlórúkọ, kì í ṣe ‘àwa,’ ó sì mú ohùn àìṣe Gíríìkì jẹ́ àdánidá ní Yorùbá.
