revisions:
- from: Nígbà tí Paulu sì gbé ọwọ́ lé wọn, Ẹ̀mí Mímọ́ bà lé wọn, wọ́n sì ń fi ahọ́n sọ̀rọ̀[a], wọ́n sì ń sọ àsọtẹ́lẹ̀.
  to: Nígbà tí Pọ́ọ̀lù gbé ọwọ́ lé wọn, Ẹ̀mí Mímọ́ sì wá sórí wọn; wọ́n sì ń sọ̀rọ̀ ní ahọ́n[a], wọ́n sì ń sọ àsọtẹ́lẹ̀.
  rationale: The revision replaces an imprecise idiom for the Spirit’s coming with wá sórí wọn, adopts the conventional Yorùbá form Pọ́ọ̀lù, and adjusts the tongue-speech expression so that it is less liable to be understood as ordinary speech. It preserves the Greek temporal sequence, ongoing imperfect aspect, paired manifestations, and the lexical ambiguity of γλώσσαις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:16Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal clause and the ongoing force of the two imperfect verbs are represented well. However, “bà lé wọn” ordinarily means ‘encounter/reach them’ and does not clearly convey the Spirit’s coming upon them (ἦλθε ... ἐπ’ αὐτούς). “wá sórí wọn” directly and naturally preserves the Greek expression.
  naturalness: The revision uses conventional Standard Yorùbá biblical phrasing, including the established name Pọ́ọ̀lù. “sọ̀rọ̀ ní ahọ́n” is preferable to “fi ahọ́n sọ̀rọ̀,” which can sound like the ordinary physical use of one’s tongue rather than a marked kind of speech.
  terminology: Ẹ̀mí Mímọ́ and sọ àsọtẹ́lẹ̀ are appropriate. The main text retains ahọ́n, with a footnote giving èdè as the lexical alternative, without deciding whether the speech was known human languages or another kind of tongue-speech.
  issues:
  - severity: medium
    issue: “Ẹ̀mí Mímọ́ bà lé wọn”
    rationale: Bà lé generally denotes meeting, catching up with, or reaching someone. It is not the clearest natural equivalent of ἦλθε ... ἐπ’ αὐτούς (‘came upon them’) in this Spirit-arrival context.
  - severity: low
    issue: “fi ahọ́n sọ̀rọ̀”
    rationale: This wording may be read as simply speaking with one’s physical tongue. “sọ̀rọ̀ ní ahọ́n” more clearly functions as the marked expression corresponding to Greek λαλεῖν γλώσσαις while retaining lexical ambiguity.
  - severity: low
    issue: Name form “Paulu”
    rationale: Pọ́ọ̀lù is the conventional fully marked Standard Yorùbá biblical form of Paul and better matches the requested orthography.
  revised_text: Nígbà tí Pọ́ọ̀lù gbé ọwọ́ lé wọn, Ẹ̀mí Mímọ́ sì wá sórí wọn; wọ́n sì ń sọ̀rọ̀ ní ahọ́n[a], wọ́n sì ń sọ àsọtẹ́lẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń sọ̀rọ̀ ní àwọn èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; ọ̀rọ̀ pàtàkì náà pa àìdánilójú yìí mọ́.
    reason: lexical_alternative
  revision_rationale: The revision replaces an imprecise idiom for the Spirit’s coming with wá sórí wọn, adopts the conventional Yorùbá form Pọ́ọ̀lù, and adjusts the tongue-speech expression so that it is less liable to be understood as ordinary speech. It preserves the Greek temporal sequence, ongoing imperfect aspect, paired manifestations, and the lexical ambiguity of γλώσσαις.
