id: ACT.19.6
reference: Acts 19:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: yo
  text: Nígbà tí Pọ́ọ̀lù gbé ọwọ́ lé wọn, Ẹ̀mí Mímọ́ sì wá sórí wọn; wọ́n sì ń sọ̀rọ̀ ní ahọ́n[a], wọ́n sì ń sọ àsọtẹ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń sọ̀rọ̀ ní àwọn èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; ọ̀rọ̀ pàtàkì náà pa àìdánilójú yìí mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος ... τοῦ Παύλου χεῖρας
  choice: Nígbà tí Paulu sì gbé ọwọ́ lé wọn
  rationale: A tú participle aorist inú genitive absolute sí gbólóhùn àkókò ní Yorùbá; ‘gbé ọwọ́ lé’ jẹ́ ọ̀nà àdánidá láti pa àwòrán ìṣe Gíríìkì mọ́.
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: bà lé wọn
  rationale: ‘Bà lé’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún wíwá Ẹ̀mí sórí wọn, ó sì pa ipa ìtọ́sọ́nà ἐπί mọ́ láìfi èrò ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì yẹ nípa ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἐλάλουν
  choice: wọ́n sì ń ... sọ̀rọ̀
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ hàn, ó sì bá imperfect Gíríìkì mu láìfi ‘bẹ̀rẹ̀’ kún ohun tí kò hàn gbangba nínú ọ̀rọ̀ náà.
- source_word: γλώσσαις
  choice: fi ahọ́n sọ̀rọ̀
  rationale: ‘Ahọ́n’ pa ìtumọ̀ gangan γλῶσσα àti àìdánilójú rẹ̀ mọ́; ó lè tọ́ka sí ahọ́n tàbí èdè, láìyanju àríyànjiyàn náà nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐπροφήτευον
  choice: wọ́n sì ń sọ àsọtẹ́lẹ̀
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ọ̀rọ̀ àsọtẹ́lẹ̀, àmì ‘ń’ sì pa abala imperfect mọ́.
- source_word: τε ... καί
  choice: wọ́n sì ... wọ́n sì
  rationale: Àtúnṣe ‘wọ́n sì’ so àwọn ìfarahàn méjèèjì pọ̀ ní Yorùbá tó rọrùn, ó sì ṣàfihàn ìbáṣepọ̀ tímọ́tímọ́ wọn.
theological_decisions:
- issue: Ìtumọ̀ γλώσσαις nínú Ìṣe 19:6
  choice: Fi ‘ahọ́n’ sí ọ̀rọ̀ pàtàkì, láìsọ bóyá ó jẹ́ àwọn èdè ènìyàn tí a mọ̀ tàbí irú ọ̀rọ̀ míì.
  alternative: Túmọ̀ ọ́ sí ‘àwọn èdè’ láti tẹnu mọ́ èdè ènìyàn tí a lè lóye.
  rationale: γλώσσαις lè túmọ̀ sí ‘ahọ́n’ tàbí ‘èdè’; ẹsẹ yìí nìkan kò yanju ìbéèrè náà, nítorí náà a pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
- issue: Bí a ṣe túmọ̀ wíwá Ẹ̀mí
  choice: Ẹ̀mí Mímọ́ bà lé wọn
  alternative: Ẹ̀mí Mímọ́ wá sórí wọn
  rationale: Èyí sọ ìṣẹ̀lẹ̀ tí Luku ròyìn, ṣùgbọ́n kò fi ètò ẹ̀kọ́ ìgbàgbọ́ nípa ìtẹ̀lé àkókò tàbí ohun tó fa a kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìpele àárín, tó bójú mu fún ìtẹ̀jáde Bíbélì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘gbé ọwọ́ lé,’ ‘Ẹ̀mí Mímọ́,’ àti ‘sọ àsọtẹ́lẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ tó mọ́gbọ́n dání, tó sì ṣeé lóye fún òǹkàwé òde òní.
