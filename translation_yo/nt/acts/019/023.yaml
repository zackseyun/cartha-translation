  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: yo
  text: Ní àkókò náà, ìrúkèrúdò tí kò kéré ṣẹlẹ̀ nípa Ọ̀nà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà náà.” Níhìn-ín, ó ń tọ́ka sí àwọn ọmọlẹ́yìn Jésù, gẹ́gẹ́ bí ọ̀nà ìdámọ̀ tí a ń lò léraléra nínú Ìṣe àwọn Àpọ́sítélì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bẹ̀rẹ̀
  rationale: Ọ̀rọ̀ náà fi ìṣẹ̀lẹ̀ tuntun hàn; “bẹ̀rẹ̀” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìrúkèrúdò náà dìde tàbí ṣẹlẹ̀.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀
  rationale: δέ jẹ́ àsopọ̀ ìtàn pẹ̀lẹ́; ìtẹ̀síwájú ìtàn náà hàn gbangba láìfi “ṣùgbọ́n” tàbí àsopọ̀ míì kun un.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Ní àkókò náà
  rationale: Ó túmọ̀ sí ní tàbí láàárín àkókò tí a ń tọ́ka sí, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: τάραχος
  choice: ìrúkèrúdò
  rationale: Ó ń tọ́ka sí ìdàrúdàpọ̀ àti ariwo láàárín àwọn ènìyàn, láìsọ ọ́ di “rògbòdìyàn” tàbí ìṣọ̀tẹ̀ ní kíkún kí ìtàn tó ṣàlàyé sí i.
- source_word: οὐκ ὀλίγος
  choice: tí kò kéré
  rationale: Èyí pa àfiwé ìkọ̀sẹ̀ Luke mọ́ dípò lílo “ńlá” nìkan.
- source_word: περὶ
  choice: nítorí
  rationale: Nínú àyíká yìí, ó fi ohun tí ìrúkèrúdò dá lé lórí hàn; “nítorí” jẹ́ àdánidá ní Yorùbá, bó tilẹ̀ jẹ́ pé kò gbọdọ̀ túmọ̀ sí pé Ọ̀nà náà ló jẹ̀bi.
- source_word: τῆς ὁδοῦ
  choice: Ọ̀nà náà
  rationale: Nínú Ìṣe àwọn Àpọ́sítélì, gbólóhùn náà jẹ́ orúkọ ìdámọ̀ fún ẹgbẹ́ àwọn tó tẹ̀ lé Jésù; lẹ́tà ńlá ń ràn òǹkàwé lọ́wọ́ láti mọ ìtumọ̀ yìí.
theological_decisions:
- issue: Ṣíṣe τῆς ὁδοῦ bí orúkọ ìdámọ̀ ẹgbẹ́ kan
  choice: Ọ̀nà náà
  alternative: ọ̀nà náà
  rationale: Lílo lẹ́tà ńlá fi hàn pé ó ń tọ́ka sí ẹgbẹ́ àwọn onígbàgbọ́ nínú Jésù, gẹ́gẹ́ bí lílo ọ̀rọ̀ náà léraléra nínú Ìṣe, láìfi ẹ̀kọ́ ìjọ kan kun ọ̀rọ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa ọ̀nà àfiwé “tí kò kéré” mọ́, a sì lo “Ọ̀nà” gẹ́gẹ́ bí orúkọ ìdámọ̀.
