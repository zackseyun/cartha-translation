id: ACT.19.28
reference: Acts 19:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, tí inú sì bí wọn gidigidi[a], wọ́n ń ké jáde pé, “Atẹ́mísì ti àwọn ará Éfésù tóbi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìbínú kún wọn,” “wọ́n bínú gidigidi,” tàbí “wọ́n ru sókè fún ìbínú.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí, “wọ́n di ẹni tí ìbínú kún”; ọ̀rọ̀ náà ni ὁ θυμός, ẹni tí ó ń tọ́ka sí ìbínú líle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Aorist participle náà fi ipò tó ṣáájú ìṣe pàtàkì hàn; “èyí” mú ohun tí a gbọ́, tí àyíká ọ̀rọ̀ tọ́ka sí, ṣe kedere láìṣàlàyé ju.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ asopọ̀ fẹ́ẹ́rẹ́ níbí; “sì” bá ìṣàn gbólóhùn Yorùbá mu láìfi ìtakora líle kún un.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: tí inú sì bí wọn gidigidi
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí pé wọ́n di ẹni tí θυμός kún; gbolohun Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìbínú náà mọ́.
- source_word: ἔκραζον
  choice: wọ́n ń ké jáde
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; àmì “ń” pa ìtẹ̀síwájú yẹn mọ́.
- source_word: λέγοντες
  choice: pé
  rationale: “Pé” ṣe àgbékalẹ̀ ohun tí wọ́n ń ké jáde ní Yorùbá lọ́nà àdánidá, láìní láti tún “wí pé” ṣe.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Atẹ́mísì ti àwọn ará Éfésù tóbi!
  rationale: Ó pa ìkéde ayẹyẹ ogunlọ́gọ̀ náà àti genitive tó so òrìṣà náà mọ́ àwọn ará Éfésù mọ́; àtòjọ ọ̀rọ̀ náà jẹ́ ti Yorùbá àdánidá.
- source_word: Ἄρτεμις
  choice: Atẹ́mísì
  rationale: A kọ orúkọ òrìṣà náà ní ìbámu pẹ̀lú ìró rẹ̀, pẹ̀lú àmì ohùn Yorùbá.
- source_word: Ἐφεσίων
  choice: ti àwọn ará Éfésù
  rationale: Genitive plural substantival náà ń tọ́ka sí àwọn ènìyàn Éfésù, kì í ṣe ibi náà nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìkéde fún òrìṣà àwọn abọ̀rìṣà láìjẹ́ kí ó dà bí ìfọwọ́sí onítumọ̀
  choice: “Atẹ́mísì ti àwọn ará Éfésù tóbi!”
  alternative: “Atẹ́mísì, òrìṣà àwọn ará Éfésù, tóbi!”
  rationale: A fi ọ̀rọ̀ náà sí ẹnu ogunlọ́gọ̀ gẹ́gẹ́ bí ìròyìn ọ̀rọ̀ wọn, láìrọ̀ ọ́ sílẹ̀ tàbí fi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, èdè òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “ń ké jáde” láti fi imperfect hàn, a sì lo ọ̀rọ̀ ìbínú tó ṣeé lóye fún gbogbo ènìyàn.
