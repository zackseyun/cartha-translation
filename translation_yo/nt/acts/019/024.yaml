source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: yo
  text: Nítorí ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Demetiriusi, oníṣẹ́ fàdákà, ẹni tí ó máa ń ṣe àwọn ojúbọ fàdákà ti Atemisi[a], ń mú òwò tí kò kéré wá fún àwọn oníṣẹ́ ọwọ́ náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ilé òrìṣà fàdákà ti Atemisi” tàbí “àwọn àwòrán fàdákà ti ilé òrìṣà Atemisi.” Ọ̀rọ̀ Gíríìkì náà, naous (“àwọn ojúbọ” tàbí “àwọn ilé òrìṣà”), ṣeé ṣe kí ó tọ́ka sí àwọn ohun kéékèèké tí a fi ọwọ́ ṣe tí ó ní í ṣe pẹ̀lú ìjọsìn Atemisi.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “òwò tí kò kéré”; ọ̀nà àfiwé yìí túmọ̀ sí òwò tàbí èrè púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa agbára àsopọ̀ tó ń ṣàlàyé ìdí ìrúkèrúdò inú ẹsẹ tó ṣáájú mọ́.
- source_word: Δημήτριος ... ὀνόματι
  choice: orúkọ rẹ̀ ń jẹ́ Demetiriusi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹni tuntun àti orúkọ rẹ̀ hàn; a ṣe àfọ̀rọ̀kọ orúkọ Gíríìkì náà dípò títúmọ̀ rẹ̀.
- source_word: ἀργυροκόπος
  choice: alágbẹ̀dẹ fàdákà
  rationale: Ó túmọ̀ sí oníṣẹ́ tó ní ọgbọ́n iṣẹ́ fífi fàdákà ṣe nǹkan, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ποιῶν
  choice: ẹni tí ó máa ń ṣe
  rationale: Àmì ‘máa ń’ fi iṣẹ́ tí ó jẹ́ àṣà tàbí òwò rẹ̀ hàn, ní ìbámu pẹ̀lú participle àti imperfect inú gbólóhùn náà.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: àwọn ojúbọ fàdákà ti Atemisi
  rationale: ‘Ojúbọ’ bá àyíká ìjọsìn òrìṣà mu, ó sì pa àìdánilójú mọ́ nípa bóyá wọ́n jẹ́ ojúbọ kéékèèké tàbí àwòrán ilé òrìṣà.
- source_word: παρείχετο
  choice: ó ń mú ... wá
  rationale: Ó fi ìṣe tí ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀ hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: τοῖς τεχνίταις
  choice: àwọn oníṣẹ́-ọnà náà
  rationale: Ó tọ́ka sí àwọn òṣìṣẹ́ ọlọ́gbọ́n inú iṣẹ́ ọnà yìí, láìfi akọ nìkan sí i.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: òwò ńlá
  rationale: Ó sọ litotes Gíríìkì náà ní Yorùbá àdánidá, nígbà tí àkọ́lẹ̀ ìsàlẹ̀ pa ọ̀nà ìtúmọ̀ gangan rẹ̀ mọ́.
