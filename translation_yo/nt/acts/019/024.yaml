  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún òǹkàwé òde òní. ‘Oníṣẹ́-ọnà’ yẹra fún ìdènà akọ tí ‘craftsmen’ lè mú wá, nígbà tí ó ṣì dúró fún τεχνῖται.
