  to: Ó sì wí pé, “Ǹjẹ́, sínú kí ni a ṣe ìbatisí yín?” Wọ́n sì wí pé, “Sínú ìbatisí Jòhánù.”
  rationale: 'The revision preserves the Greek discourse linkage and the repeated “sínú” in question and answer. It replaces the less precise use of the borrowed form “batisí” with the established noun “ìbatisí” for βάπτισμα, and uses an idiomatic Yoruba passive expression in the question. No footnote is needed: Yoruba “ìbatisí Jòhánù” naturally expresses the same genitive relation represented by the English alternative “the baptism of John.”'
