id: ACT.19.3
reference: Acts 19:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: yo
  text: Ó sì wí pé, “Ǹjẹ́, sínú kí ni a ṣe ìbatisí yín?” Wọ́n sì wí pé, “Sínú ìbatisí Jòhánù.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Ó sì wí pé
  rationale: “Wí” túmọ̀ λέγω ní tààrà; “sì” ń so gbólóhùn náà mọ́ ohun tó ṣáájú láìfi agbára tí τε kò ní kún un.
- source_word: Εἰς τί οὖν
  choice: Ǹjẹ́, sínú kí ni
  rationale: “Ǹjẹ́” fi ìgbésẹ̀ ìbéèrè tó tẹ̀ lé àbájáde ọ̀rọ̀ ṣáájú hàn fún οὖν; “sínú kí” pa εἰς τί mọ́, ó sì mú ìbáramu pẹ̀lú èsì náà dúró.
- source_word: ἐβαπτίσθητε
  choice: a batisí yín
  rationale: 'Ìsọ̀rọ̀ yìí jẹ́ àṣà Yorùbá tó ṣe kedere fún aorist passive: àwọn mìíràn ni ó ṣe ìbatisí náà sí wọn, kì í ṣe pé wọ́n batisí ara wọn.'
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Sínú batisí Jòhánù
  rationale: A tún εἰς ṣe ní “sínú” láti pa ìbáramu ìbéèrè àti èsì mọ́; “batisí Jòhánù” jẹ́ ọ̀nà àdánidá láti túmọ̀ genitive Ἰωάννου tó ń ṣàpèjúwe βάπτισμα.
- source_word: βάπτισμα
  choice: batisí
  rationale: “Batisí” ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún βάπτισμα, ó sì dárúkọ ìṣe náà láìsọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́ kan.
theological_decisions:
- issue: Bóyá a ó pa εἰς tí a tún lò nínú ìbéèrè àti èsì mọ́
  choice: Lo “sínú” nínú méjèèjì
  alternative: “Batisí wo ni a fi batisí yín?” / “Batisí Jòhánù.”
  rationale: Ṣíṣe “sínú” ní méjèèjì ń pa ọ̀rọ̀ Gíríìkì àti ìbáramu àsọyé rẹ̀ mọ́, láìfi ẹ̀kọ́ ìbatisí ẹ̀ya ìjọ kan sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “wí” gẹ́gẹ́ bí èdè Ìwé Mímọ́ tó ṣì yé òǹkàwé òde òní, àti “ǹjẹ́” láti fi ìtumọ̀ ìyọrísí οὖν hàn.
