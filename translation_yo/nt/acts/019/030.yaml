  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù fẹ́ wọ àárín àpéjọ náà[a], àwọn ọmọ-ẹ̀yìn kò gbà á láyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ inú àpéjọ náà” tàbí “wọ àárín ogunlọ́gọ̀ náà.” Ọ̀rọ̀ Gíríìkì δῆμος lè tọ́ka sí gbogbo ènìyàn tí ó péjọ gẹ́gẹ́ bí ara ìlú nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: Pọ́ọ̀lù
  rationale: Àkọsílẹ̀ orúkọ Παῦλος ní ọ̀nà tí ó bá ìró àti ìlò Yorùbá mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tó ní ìtakora hàn láti inú ìṣe ogunlọ́gọ̀ sí ohun tí Pọ́ọ̀lù pinnu láti ṣe.
- source_word: βουλομένου
  choice: nígbà tí Pọ́ọ̀lù fẹ́
  rationale: Ó sọ ìfẹ́ tàbí èrò Pọ́ọ̀lù ní Yorùbá àdánidá, ó sì mú iṣẹ́ genitive absolute jáde gẹ́gẹ́ bí gbólóhùn àkókò.
- source_word: εἰσελθεῖν
  choice: wọ
  rationale: Ó túmọ̀ ìwọlé sínú ibi tàbí àárín àwọn ènìyàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: εἰς τὸν δῆμον
  choice: wọ àárín àpéjọ náà
  rationale: δῆμος lè tọ́ka sí gbogbo ènìyàn tí ó péjọ gẹ́gẹ́ bí ara ìlú ní àyíká yìí; ‘wọ àárín’ jẹ́ kí ìlọ sínú ẹgbẹ́ tí ó péjọ ṣe kedere láì pinnu ju orísun lọ.
- source_word: οὐκ εἴων
  choice: kò gbà á láyè
  rationale: Ó fi ìdènà àti àìfúnni láyè hàn ní Yorùbá tó wọ́pọ̀; àyíká náà jẹ́ kí ìtẹ̀síwájú ìdènà inú imperfect ṣe kedere.
- source_word: αὐτὸν
  choice: á
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ohun tí ó tọ́ka padà sí Pọ́ọ̀lù.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ó pa ìtumọ̀ ẹni tí ń kọ́ lẹ́sẹ̀ ẹni tí ó ń tẹ̀ lé mọ́, láì fi ‘tirẹ̀’ kún ohun tí Gíríìkì kò sọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ‘àpéjọ’ láti pa ìtumọ̀ ara ìlú tí ó péjọ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú-ìwé fi ‘ogunlọ́gọ̀’ hàn gẹ́gẹ́ bí òmíràn.
