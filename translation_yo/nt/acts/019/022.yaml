id: ACT.19.22
reference: Acts 19:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: yo
  text: Lẹ́yìn tí ó rán méjì lára àwọn tí ń ṣe ìránṣẹ́ fún un—Timotiu àti Erastu—lọ sí Makedonia, òun fúnra rẹ̀ sì dúró ní Asia fún ìgbà díẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni ẹkùn ìṣàkóso Romu tí a ń pè ní Asia, ní apá ìwọ̀-oòrùn Asia Kékeré; kì í ṣe kọ́ńtínẹ́ǹtì Asia ti òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: lẹ́yìn tí ó rán ... lọ
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtumọ̀ yìí mú bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn hàn ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Nítorí náà
  rationale: δέ jẹ́ àsopọ̀ tútù tí ń tẹ ìtàn síwájú níbí, kì í ṣe àmì ìtakora líle.
- source_word: εἰς τὴν Μακεδονίαν
  choice: lọ sí Makedonia
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘rán,’ ‘lọ sí’ sọ ìdarí sí agbègbè tí wọ́n ń lọ ní Yorùbá àdánidá.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: méjì lára àwọn tí ń ṣe ìránṣẹ́ fún un
  rationale: Ìtumọ̀ yìí pa èrò iṣẹ́ ìránṣẹ́ mọ́ láì sọ ọ́ di ipò tàbí oyè pàtó tí Gíríìkì kò fi dandan hàn.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timotiu àti Erastu
  rationale: Àwọn orúkọ náà ni a kọ ní ìbámu pẹ̀lú bí a ṣe máa ń ṣàkọsílẹ̀ wọn ní Yorùbá.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ náà mọ́, ó sì fi Paulu yàtọ̀ sí àwọn méjì tí ó rán.
- source_word: ἐπέσχεν χρόνον
  choice: dúró fún ìgbà díẹ̀
  rationale: Àpólà náà túmọ̀ sí pé ó wà níbẹ̀ fún àkókò kan; gbolohun yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: εἰς τὴν Ἀσίαν
  choice: ní Asia
  rationale: 'Bó tilẹ̀ jẹ́ pé εἰς sábà ń tọ́ka sí ìdarí, pẹ̀lú ἐπέσχεν χρόνον ìtumọ̀ ibi ni ó ní: ó dúró ní Asia.'
theological_decisions: []
translation_notes:
  register: Yorùbá tí ó bófin mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó bá yẹ; àwọn orúkọ ibi àti ènìyàn ni a ṣàkọsílẹ̀ ní fọ́ọ̀mù Yorùbá tí ó ṣe kedere.
