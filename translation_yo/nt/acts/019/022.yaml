- from: Nítorí náà, lẹ́yìn tí ó rán méjì lára àwọn tí ń ṣe ìránṣẹ́ fún un—Timotiu àti Erastu—lọ sí Makedonia, òun fúnra rẹ̀ dúró fún ìgbà díẹ̀ ní Asia[a].
  to: Lẹ́yìn tí ó rán méjì lára àwọn tí ń ṣe ìránṣẹ́ fún un—Timotiu àti Erastu—lọ sí Makedonia, òun fúnra rẹ̀ sì dúró ní Asia fún ìgbà díẹ̀.[a]
  rationale: The revision replaces the stronger inferential connective with the neutral narrative connective “sì,” retaining the Greek contrast between those sent and Paul himself. It also places the duration after the location for natural Yoruba flow, without changing the meaning. The footnote is retained unchanged.
