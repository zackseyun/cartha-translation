    rationale: φωνὴ ἐγένετο μία ἐκ πάντων ní ìtẹnumọ́ lórí ohùn kan tí ó dìde láti ọ̀dọ̀ gbogbo ènìyàn. Àtúnṣe náà pa ìtẹnumọ́ yìí mọ́ ní Yorùbá láì sọ ọ́ di èdè àjèjì.
