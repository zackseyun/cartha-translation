  source_fidelity: 'Ìtumọ̀ náà gbé gbogbo èrò pàtàkì inú Gíríìkì náà kalẹ̀ dáadáa: ìdánimọ̀ ẹni náà gẹ́gẹ́ bí Júù, ìṣọ̀kan ohùn ogunlọ́gọ̀, àkókò tó fẹ́rẹ̀ẹ́ tó wákàtí méjì, àti ìkéde fún Átẹ́mísì. Àmọ́, ṣíṣe ìpè náà ní ọ̀nà “ohùn kan sì jáde látọ̀dọ̀ gbogbo wọn” sún mọ́ φωνὴ ἐγένετο μία ἐκ πάντων ju “gbogbo wọn fi ohùn kan kígbe” lọ, níwọ̀n bí Gíríìkì ti ń ṣe àfihàn ohùn kan tí ó dìde láti ọ̀dọ̀ gbogbo wọn.'
