id: ACT.19.34
reference: Acts 19:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n mọ̀ pé Júù ni òun[a], ohùn kan sì jáde látọ̀dọ̀ gbogbo wọn, wọ́n sì ń kígbe fún nǹkan bí wákàtí méjì pé, “Ńlá ni Átẹ́mísì àwọn ará Éfésù!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí Júù tàbí ẹni tí ó wá láti Jùdíà; níhìn-ín, ó ṣeé ṣe jù pé ó ń tọ́ka sí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: nígbà tí wọ́n mọ̀
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ó ṣáájú ìkéde wọn hàn ní ọ̀nà Yorùbá tí ó ṣe déédé, ó sì túmọ̀ sí pé àwọn ènìyàn náà dá ẹni tí ó jẹ́ mọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà alátakò hàn lẹ́yìn ìgbìyànjú Alẹkisáńdérì láti bá ogunlọ́gọ̀ náà sọ̀rọ̀.
- source_word: Ἰουδαῖός
  choice: Júù
  rationale: Nínú àyíká Éfésù, ọ̀rọ̀ náà ṣeé ṣe kí ó tọ́ka sí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn ju ibi ìbí ní Jùdíà lọ.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: gbogbo wọn fi ohùn kan kígbe
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa àwòrán ohùn kan àti ìṣọ̀kan ogunlọ́gọ̀ mọ́.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: fún nǹkan bí wákàtí méjì
  rationale: “Nǹkan bí” pa ìtumọ̀ ìṣirò àfojúsùn inú ὡς mọ́.
- source_word: κραζόντων
  choice: kígbe
  rationale: Ó fi ìké rara tí ó ń bá a lọ hàn; àkókò gígùn rẹ̀ sì hàn nínú gbólóhùn “fún nǹkan bí wákàtí méjì.”
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Ńlá ni Átẹ́mísì ti àwọn ará Éfésù!
  rationale: Ó pa ìtẹnumọ́ ìkéde náà àti ìbáṣepọ̀ Átẹ́mísì pẹ̀lú àwọn ará Éfésù mọ́ ní ọ̀nà Yorùbá tí ó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖος
  choice: Júù
  alternative: ará Jùdíà
  rationale: Ìdáhùn ogunlọ́gọ̀ ní Éfésù dá lórí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn Alẹkisáńdérì; “Júù” bá àyíká náà mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ààyè mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “Átẹ́mísì” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ Gíríìkì Ἄρτεμις dípò orúkọ Róòmù rẹ̀.
