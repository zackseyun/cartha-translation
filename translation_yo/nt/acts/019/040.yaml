  source_fidelity: Ìtumọ̀ náà ń pa ọ̀pọ̀ èrò Gíríìkì mọ́, pẹ̀lú ìyàtọ̀ láàárín στάσις, συστροφή, àti ἐκκλησία. Síbẹ̀, ‘a ó fi ẹ̀sùn rúkèrúdò lónìí kàn wá’ lè dà bí pé ọjọ́ tí wọ́n máa fi ẹ̀sùn kàn wọ́n ni lónìí, dípò rúkèrúdò tí ó ṣẹlẹ̀ lónìí. Bákan náà, gbolóhùn nípa àìsí ìdí àti jíhìn kò ṣàfihàn ìbáṣepọ̀ ‘ìdí tí a lè fi ṣàlàyé ìpéjọpọ̀ yìí’ kedere tó.
