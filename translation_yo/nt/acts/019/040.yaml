id: ACT.19.40
reference: Acts 19:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: yo
  text: Nítorí pé, lóòótọ́, a wà nínú ewu pé a ó fi ẹ̀sùn pé a dá rúkèrúdò ọjọ́ òní sílẹ̀ kàn wá,[a] níwọ̀n bí kò ti sí ìdí kankan tí a lè fi ṣàlàyé ìpéjọpọ̀ onírúkèrúdò yìí.[b] Lẹ́yìn tí ó sì ti sọ nǹkan wọ̀nyí, ó tú àpéjọ náà ká.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘ìṣọ̀tẹ̀’ tàbí ‘ìdìtẹ̀ sí ìjọba.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdìde àwọn ará ìlú tó le gan-an, ṣùgbọ́n ‘rúkèrúdò’ bá ariwo ní gbangba tí ó ṣẹlẹ̀ níhìn-ín mu jù.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí ‘ìdàrúdàpọ̀’ tàbí ‘ẹgbẹ́ àwọn ènìyàn onírúkèrúdò.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìpéjọpọ̀ aláriwo yìí, ó sì yàtọ̀ sí ọ̀rọ̀ tí a túmọ̀ sí ‘àpéjọ’ ní ìparí ẹsẹ náà.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí ‘àpéjọ’ ni a sábà máa ń túmọ̀ sí ‘ìjọ’ ní àwọn ibòmíràn, ṣùgbọ́n níhìn-ín ó ń tọ́ka sí àpéjọ ará ìlú Éfésù.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: a wà nínú ewu
  rationale: Ó fi ipò ewu tí ó wà lọ́wọ́lọ́wọ́ hàn ní Yorùbá àdánidá.
- source_word: ἐγκαλεῖσθαι
  choice: a ó fi ẹ̀sùn ... kàn wá
  rationale: Ó pa agbára ọ̀rọ̀ òfin àti ìgbẹ́jọ́ mọ́ nínú àyíká ìkìlọ̀ akọ̀wé ìlú.
- source_word: στάσεως
  choice: rúkèrúdò
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdàrúdàpọ̀ ńlá ní gbangba tí aláṣẹ Róòmù lè ka sí ẹ̀ṣẹ̀ sí àlàáfíà ìlú; ‘rúkèrúdò’ kò fi dandan túmọ̀ rẹ̀ sí ìṣọ̀tẹ̀ olóṣèlú.
- source_word: περὶ τῆς σήμερον
  choice: rúkèrúdò lónìí
  rationale: Ìtumọ̀ yìí so στάσεως mọ́ ohun tí ó ṣẹlẹ̀ ní ọjọ́ náà, ó sì jẹ́ Yorùbá tí ó ṣàn déédéé.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: nítorí kò sí ìdí kankan fún un
  rationale: Ó ṣàfihàn pé kò sí ìdí tàbí ẹ̀rí tó bófin mu fún rúkèrúdò náà.
- source_word: ἀποδοῦναι λόγον
  choice: lè jíhìn
  rationale: ‘Jíhìn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún dídáhùn tàbí fífún aláṣẹ ní àlàyé.
- source_word: συστροφῆς
  choice: ìpéjọpọ̀ onírúkèrúdò
  rationale: Ó tọ́ka sí ìpéjọpọ̀ aláriwo yìí, ó sì yà á sọ́tọ̀ kúrò nínú ἐκκλησία, àpéjọ tí a tú ká ní ìparí.
- source_word: ἐκκλησίαν
  choice: àpéjọ
  rationale: Níhìn-ín ó jẹ́ àpéjọ ará ìlú, kì í ṣe ìjọ Kristẹni.
- source_word: ἀπέλυσεν
  choice: ó tú ... ká
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni tó ń darí ìpàdé dá a parí, ó sì ní kí àwọn ènìyàn lọ.
- source_word: καὶ γὰρ
  choice: Nítorí pé, lóòótọ́
  rationale: Ó pa ìsopọ̀ ìdí àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èyí tí ó yé àwọn òǹkàwé òde òní. A lo ‘rúkèrúdò’ fún agbára ọ̀rọ̀ òfin στάσις, ‘ìpéjọpọ̀ onírúkèrúdò’ fún συστροφή, àti ‘àpéjọ’ fún ἐκκλησία láti pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́. Àwọn àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
