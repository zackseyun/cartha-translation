revisions:
- from: Nítorí pé, lóòótọ́, a wà nínú ewu pé a ó fi ẹ̀sùn rúkèrúdò lónìí kàn wá,[a] nítorí kò sí ìdí kankan fún un, bẹ́ẹ̀ ni a kò ní lè jíhìn nípa ìpéjọpọ̀ onírúkèrúdò yìí.[b] Lẹ́yìn tí ó sì ti sọ nǹkan wọ̀nyí, ó tú àpéjọ náà ká.[c]
  to: Nítorí pé, lóòótọ́, a wà nínú ewu pé a ó fi ẹ̀sùn pé a dá rúkèrúdò ọjọ́ òní sílẹ̀ kàn wá,[a] níwọ̀n bí kò ti sí ìdí kankan tí a lè fi ṣàlàyé ìpéjọpọ̀ onírúkèrúdò yìí.[b] Lẹ́yìn tí ó sì ti sọ nǹkan wọ̀nyí, ó tú àpéjọ náà ká.[c]
  rationale: Àtúnṣe náà jẹ́ kí ‘ọjọ́ òní’ ṣàlàyé rúkèrúdò náà kedere, ó sì so àìsí ìdí mọ́ àìní ìdáhùn/àlàyé fún ìpéjọpọ̀ náà, gẹ́gẹ́ bí ìtọ́kasí ìbátan nínú Gíríìkì. A pa ìyàtọ̀ ọ̀rọ̀ àti àwọn àmì àlàyé mọ́.
