revisions:
- from: Ọkùnrin náà tí ẹ̀mí búburú náà ń gbé inú rẹ̀ sì fò mọ́ wọn lára[a]; lẹ́yìn tí ó sì borí àwọn méjèèjì[b], ó ṣẹ́gun wọn, débi pé wọ́n sá jáde kúrò ní ilé náà ní ìhòòhò, tí wọ́n sì fara gbọgbẹ́.
  to: Ọkùnrin náà tí ẹ̀mí búburú náà wà nínú rẹ̀ fò lé wọn lórí[a]; lẹ́yìn tí ó ti gba agbára lórí àwọn méjèèjì[b], ó sì borí wọn, débi pé wọ́n sá jáde láti ilé náà ní ìhòòhò, wọ́n sì fara gbọgbẹ́.
  rationale: The revision more closely reflects the stative Greek clause (“the evil spirit was in him”), employs idiomatic Yoruba for the sudden assault, and preserves the deliberate source distinction between gaining mastery over both and prevailing against them. The explicit ambiguity/tension of “both” remains untouched.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the man as the agent, the evil spirit’s presence in him, the explicit “both,” the subsequent prevailing over the group, and the result that they escaped naked and wounded. However, “ń gbé inú rẹ̀” is unnecessarily progressive for ἦν (“was”), and “fò mọ́ wọn lára” is less idiomatic and less precise for a forceful pounce upon them.
  naturalness: A more natural Standard Yoruba rendering is “fò lé wọn lórí” for a sudden physical leap upon people. “wà nínú rẹ̀” is direct and natural for the Greek relative clause. The revised wording also avoids an awkward accumulation of “sì” around the opening clause.
  terminology: “Ẹ̀mí búburú” is appropriate and established. “Àwọn méjèèjì” correctly retains the source’s explicit numerical wording without resolving the contextual tension. “Gba agbára lórí” and “borí” retain the Greek’s two related but distinct expressions of domination and prevailing.
  issues:
  - severity: medium
    issue: The opening relative clause uses progressive “ń gbé inú rẹ̀.”
    rationale: The Greek ἦν simply states that the evil spirit was in the man; progressive “was living” adds aspect not expressed by the source.
  - severity: medium
    issue: “Fò mọ́ wọn lára” is not the clearest idiomatic rendering of ἐφαλόμενος in this violent context.
    rationale: “Fò lé wọn lórí” naturally conveys leaping/pouncing upon them and preserves the physical attack.
  - severity: low
    issue: The distinction between κατακυριεύσας and ἴσχυσεν can be expressed more clearly.
    rationale: “Gba agbára lórí” for the former and “borí” for the latter avoids merely repeating the same verb while maintaining the source sequence.
  revised_text: Ọkùnrin náà tí ẹ̀mí búburú náà wà nínú rẹ̀ fò lé wọn lórí[a]; lẹ́yìn tí ó ti gba agbára lórí àwọn méjèèjì[b], ó sì borí wọn, débi pé wọ́n sá jáde láti ilé náà ní ìhòòhò, wọ́n sì fara gbọgbẹ́.
  revised_footnotes:
  - marker: a
    text: Tàbí, “fo sí wọn lórí” tàbí “fẹ́rẹ̀ sí wọn lórí.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “àwọn méjèèjì.” Bí ó tilẹ̀ jẹ́ pé àyíká tó gbòòrò mẹ́nu kan àwọn ọmọ Síkéfà tó ju méjì lọ, ọ̀rọ̀ níbí sọ “méjèèjì” ní tààrà; nítorí náà, ìtumọ̀ yìí pa ọ̀rọ̀ náà mọ́.
    reason: alternative_reading
  revision_rationale: The revision more closely reflects the stative Greek clause (“the evil spirit was in him”), employs idiomatic Yoruba for the sudden assault, and preserves the deliberate source distinction between gaining mastery over both and prevailing against them. The explicit ambiguity/tension of “both” remains untouched.
