id: ACT.19.16
reference: Acts 19:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: yo
  text: Ọkùnrin náà tí ẹ̀mí búburú náà wà nínú rẹ̀ fò lé wọn lórí[a]; lẹ́yìn tí ó ti gba agbára lórí àwọn méjèèjì[b], ó sì borí wọn, débi pé wọ́n sá jáde láti ilé náà ní ìhòòhò, wọ́n sì fara gbọgbẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fo sí wọn lórí” tàbí “fẹ́rẹ̀ sí wọn lórí.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “àwọn méjèèjì.” Bí ó tilẹ̀ jẹ́ pé àyíká tó gbòòrò mẹ́nu kan àwọn ọmọ Síkéfà tó ju méjì lọ, ọ̀rọ̀ níbí sọ “méjèèjì” ní tààrà; nítorí náà, ìtumọ̀ yìí pa ọ̀rọ̀ náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: fò mọ́ wọn lára
  rationale: Ó fi ìfò lójijì tí ó sì jẹ́ ìkọlù hàn ní Yorùbá àdánidá, ní ìbámu pẹ̀lú àwòrán ἐφάλλομαι.
- source_word: ὁ ἄνθρωπος
  choice: Ọkùnrin náà
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹ̀dá àti ní àyíká ìtàn, nítorí náà ‘ọkùnrin’ yẹ.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: tí ẹ̀mí búburú náà ń gbé inú rẹ̀
  rationale: Èyí sọ pé ẹ̀mí náà wà nínú ọkùnrin náà láì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó túmọ̀ sí ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ẹ̀mí búburú náà
  rationale: ‘Ẹ̀mí búburú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ẹ̀mí apanilára nínú àyíká yìí.
- source_word: κατακυριεύσας
  choice: lẹ́yìn tí ó ... borí
  rationale: Ó fi hàn pé ọkùnrin náà gba agbára lórí wọn; ìtòlẹ́sẹẹsẹ yìí tún pa ìṣe yìí mọ́ yàtọ̀ sí ἴσχυσεν.
- source_word: ἀμφοτέρων
  choice: àwọn méjèèjì
  rationale: Gíríìkì sọ ‘méjèèjì’ ní tààrà, nítorí náà a pa ọ̀rọ̀ yẹn mọ́ bí ó tilẹ̀ jẹ́ pé àyíká tó gbòòrò mẹ́nu kan àwọn ọmọ tó ju méjì lọ.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: ó ṣẹ́gun wọn
  rationale: Èyí túmọ̀ agbára rẹ̀ tí ó borí tiwọn, láì da gbólóhùn náà pọ̀ pátápátá mọ́ ìṣe κατακυριεύσας.
- source_word: γυμνούς
  choice: ní ìhòòhò
  rationale: Ó túmọ̀ ipò àìní aṣọ ní tààrà, láì fi kún un pé a fa aṣọ wọn ya.
- source_word: τετραυματισμένους
  choice: tí wọ́n sì fara gbọgbẹ́
  rationale: Ó fi ipò àwọn tí a ti ṣe lọ́gbẹ́ hàn ní Yorùbá tó ṣe kedere.
- source_word: ἐκφυγεῖν
  choice: wọ́n sá jáde
  rationale: Ó pa ìtumọ̀ sísá àsálà àti ìrìn jáde mọ́.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: kúrò ní ilé náà
  rationale: Ó tọ́ka sí jíjáde kúrò ní ilé pàtó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Bí a ṣe máa sọ pé ẹ̀mí búburú wà nínú ọkùnrin náà
  choice: ọkùnrin náà tí ẹ̀mí búburú náà ń gbé inú rẹ̀
  alternative: ọkùnrin náà tí ẹ̀mí búburú ní
  rationale: Àṣàyàn náà dúró mọ́ ìtumọ̀ Gíríìkì pé ẹ̀mí náà wà nínú rẹ̀, kò sì fi èdè ìmọ̀-ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìbáṣepọ̀ ἀμφοτέρων pẹ̀lú iye àwọn ọmọ Síkéfà nínú àyíká ìtàn
  choice: àwọn méjèèjì
  alternative: gbogbo wọn
  rationale: A pa ‘méjèèjì’ tí ọ̀rọ̀ Gíríìkì sọ mọ́, a kò sì mú ìdọ̀gba bá ìṣòro tó wà láàárín ẹsẹ yìí àti àyíká rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘fò mọ́ wọn lára’ fún ìkọlù lójijì, ‘àwọn méjèèjì’ sì pa ìfojúdi ọrọ̀ Gíríìkì mọ́.
