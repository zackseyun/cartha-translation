  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: yo
  text: Ìlú náà sì kún fún ìdàrúdàpọ̀[a]; gbogbo wọn sì lọ papọ̀ sínú ilé ìtàgé, wọ́n fi ipá mú Gáyù àti Aristarku, wọ́n sì kó wọn lọ. Àwọn méjèèjì jẹ́ ará Makedóníà, wọ́n sì jẹ́ alábàá-ìrìn-àjò Pọ́ọ̀lù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìrúdurù” tàbí “ariwo àti ìdàrúdàpọ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò àìníètò àti ìdàrúdàpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη
  choice: kún fún
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìṣe àìṣe-mímọ̀ náà mọ́, láì fi ẹni tó fa ìṣẹ̀lẹ̀ náà kún un.
- source_word: πόλις
  choice: ìlú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún πόλις, ó sì bá Éfésù mu nínú àyíká ọ̀rọ̀ yìí.
- source_word: συγχύσεως
  choice: ìrúdurù
  rationale: Ó fi ipò ìdàrúdàpọ̀ àti àìníètò inú ìlú hàn, láì dín un kù sí ariwo nìkan.
- source_word: ὥρμησάν
  choice: ró lọ
  rationale: Ó mú ìṣísẹ̀ òjijì, líle, tí ọ̀pọ̀ ènìyàn ṣe pọ̀ hàn ní Yorùbá àdánidá.
- source_word: ὁμοθυμαδόν
  choice: papọ̀
  rationale: Nínú ìrúdurù yìí, ọ̀rọ̀ náà ń tẹnumọ́ ìgbésẹ̀ àpapọ̀, kì í ṣe ìṣọ̀kan rere tàbí ti ẹ̀mí.
- source_word: θέατρον
  choice: ilé ìtàgé
  rationale: Ó jẹ́ ìtumọ̀ tó ṣe déédéé, tó sì yàgò fún ṣíṣe ibi náà ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: συναρπάσαντες
  choice: wọ́n wọ́ ... lọ pẹ̀lú wọn
  rationale: Ó sọ bí wọ́n ṣe fi ipá mú àwọn ọkùnrin náà, tí wọ́n sì ń kó wọn lọ sínú ilé ìtàgé.
- source_word: Γάϊον
  choice: Gáyù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìró Gíríìkì ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: Ἀρίσταρχον
  choice: Aristákù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìró Gíríìkì ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: Μακεδόνας
  choice: Àwọn ará Makedóníà
  rationale: Ó sọ ìbílẹ̀ tàbí agbègbè tí àwọn méjèèjì ti wá ní èdè Yorùbá tó ṣe kedere.
- source_word: συνεκδήμους Παύλου
  choice: alábàáṣírìn Páùlù
  rationale: Ó fi hàn pé wọ́n jẹ́ àwọn tí ń bá Páùlù rìnrìn àjò kúrò ní ilé, ní gbólóhùn Yorùbá tó rọrùn.
- source_word: τε
  choice: sì
  rationale: Asopọ̀ yìí so ìgbésẹ̀ kejì mọ́ ohun tó ṣáájú rẹ̀ lọ́nà àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àfẹnusọ, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn kejì pín àfikún Gíríìkì sí ọ̀nà tó ṣe kedere fún òǹkàwé Yorùbá, láì pàdánù ìbáṣepọ̀ Gáyù àti Aristákù pẹ̀lú Makedóníà àti Páùlù.
