id: ACT.19.21
reference: Acts 19:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: yo
  text: Lẹ́yìn tí àwọn nǹkan wọ̀nyí parí, Pọ́ọ̀lù pinnu nínú Ẹ̀mí[a] láti gba Makedóníà àti Akaia kọjá, kí ó sì lọ sí Jerúsálẹ́mù. Ó ní, “Lẹ́yìn tí mo bá ti wà níbẹ̀, mo tún gbọ́dọ̀ rí Róòmù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “nínú ẹ̀mí ara rẹ̀.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìpinnu inú Pọ́ọ̀lù fúnra rẹ̀ tàbí sí ìtọ́sọ́nà Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: parí
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ dé òpin, kì í ṣe pé àsọtẹ́lẹ̀ kan ní ìmúṣẹ.
- source_word: ἔθετο
  choice: pinnu
  rationale: Ìlò àárín ọ̀rọ̀-ìṣe τίθημι níbí fi ìpinnu tí ènìyàn fi ara rẹ̀ ṣe hàn; “pinnu” jẹ́ Yorùbá àdánidá tó sì dá agbára ìpinnu náà mọ́.
- source_word: ἐν τῷ πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Gíríìkì náà lè tọ́ka sí ìtọ́sọ́nà Ẹ̀mí Mímọ́ tàbí sí ìpinnu inú Pọ́ọ̀lù fúnra rẹ̀. A yan “Ẹ̀mí” nínú ọ̀rọ̀ pàtàkì nítorí bí Lúùkù ṣe sábà so iṣẹ́ ìránṣẹ́ mọ́ ìtọ́sọ́nà Ẹ̀mí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: διελθὼν
  choice: láti gba Makedóníà àti Akaia kọjá
  rationale: Aorist participle náà sọ pé Pọ́ọ̀lù yóò kọ́kọ́ gba àwọn agbègbè méjèèjì kọjá ní ọ̀nà rẹ̀, kí ó tó lọ sí Jerúsálẹ́mù. Ìṣètò gbolohun Yorùbá yìí mú ìtẹ̀lé náà ṣe kedere.
- source_word: πορεύεσθαι
  choice: lọ
  rationale: “Lọ” jẹ́ ọ̀rọ̀ ìrìn-àjò gbogbogbò tó bá ìtumọ̀ Gíríìkì mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọsílẹ̀ orúkọ ìlú náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Lẹ́yìn tí mo bá ti wà níbẹ̀
  rationale: Ìtumọ̀ yìí pa èrò pé Pọ́ọ̀lù yóò kọ́kọ́ dé sí ibi náà, yóò sì ti wà níbẹ̀ kí ìgbésẹ̀ tó tẹ̀ lé e tó ṣẹlẹ̀ mọ́.
- source_word: δεῖ
  choice: mo tún gbọ́dọ̀
  rationale: “Gbọdọ̀” fi dandan tàbí ète tó ń lé ènìyàn lọ hàn, bí δεῖ ṣe máa ń rí nínú Lúùkù–Ìṣe.
- source_word: ἰδεῖν
  choice: rí
  rationale: “Rí Róòmù” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé nínú ọ̀rọ̀ ìrìn-àjò ó tún ní ìtumọ̀ lílọ bẹ ìlú náà wò.
theological_decisions:
- issue: Ohun tí ἐν τῷ πνεύματι ń tọ́ka sí
  choice: nínú Ẹ̀mí
  alternative: nínú ẹ̀mí ara rẹ̀
  rationale: Kò sí arọ́pò-orúkọ ohun-ìní nínú Gíríìkì, nítorí náà ó lè jẹ́ ìtọ́sọ́nà Ẹ̀mí Mímọ́ tàbí ìpinnu inú Pọ́ọ̀lù. Ọ̀rọ̀ pàtàkì yan “Ẹ̀mí,” ṣùgbọ́n àlàyé ìsàlẹ̀ kò jẹ́ kí àìdánilójú tòótọ́ náà sọnù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì lo àwọn orúkọ ibi tí ó ti wọ́pọ̀ nínú Yorùbá.
