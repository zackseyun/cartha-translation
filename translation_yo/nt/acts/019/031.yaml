  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ gbogbogbòò ẹsẹ náà dáadáa: àwọn olórí kan ní Éṣíà tí wọ́n jẹ́ ọ̀rẹ́ Pọ́ọ̀lù ránṣẹ́ sí i, wọ́n sì bẹ̀ ẹ́ pé kí ó má lọ sí ilé eré. Síbẹ̀, gbolohun “fi ara rẹ̀ sínú ewu” fi ‘ewu’ tí kò wà ní tààrà nínú ọ̀rọ̀ Gíríìkì kún un, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè túmọ̀ sí ewu.'
  naturalness: Èdè Yorùbá náà rọrùn, ó sì ní àmì ohùn tó yẹ. “Ìgbèríko” kò bá ‘province’ mu dáadáa nínú Yorùbá òde òní, nítorí ó sábà ń tọ́ka sí ìgbèrí ilẹ̀ tàbí àgbègbè ìgbàgùdà; “Éṣíà” pẹ̀lú àkíyèsí ìsàlẹ̀ jẹ́ mímọ́ síi.
  terminology: Ἀσιαρχῶν jẹ́ oyè pàtó. “Àwọn olórí Éṣíà” jẹ́ ìtúmọ̀ tó ṣeé lóye, nígbà tí àkíyèsí ìsàlẹ̀ ń ṣàlàyé pé wọ́n jẹ́ àwọn olórí/òṣìṣẹ́ pàtàkì tí ó ní í ṣe pẹ̀lú ìpínlẹ̀ Róòmù ti Éṣíà. “Gbọ̀ngàn eré” dá ìtumọ̀ θέατρον dúró dáadáa nínú àyíká ìtàn yìí.
  issues:
  - severity: medium
    issue: “fi ara rẹ̀ sínú ewu”
    rationale: Èyí sọ ‘ewu’ di apá ìtumọ̀ àkọ́kọ́, ṣùgbọ́n Gíríìkì náà sọ ní tààrà pé kí ó má ṣe ‘fún ara rẹ̀ sí/nínú’ ilé eré. Kí ìtumọ̀ má fi ìtumọ̀ àyíká kún ọ̀rọ̀ orísun, ó dára láti lo ‘kí ó má ṣe wọ gbọ̀ngàn eré náà,’ kí a sì pa àwọn àṣàyàn míì mọ́ nínú àkíyèsí.
  - severity: low
    issue: “olórí ìgbèríko Éṣíà”
    rationale: “Ìgbèríko” lè dà bí agbègbè igberiko/rúral rather than Roman province. “Àwọn olórí Éṣíà,” pẹ̀lú ìtumọ̀ oyè náà nínú àkíyèsí, jẹ́ èdè àdánidá àti pé ó yàgò fún ìtúmọ̀ ìṣàkóso tó le ju.
