id: ACT.19.31
reference: Acts 19:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: yo
  text: Àní, àwọn kan lára àwọn olórí Éṣíà[a], tí wọ́n jẹ́ ọ̀rẹ́ Pọ́ọ̀lù, ránṣẹ́ sí i, wọ́n sì bẹ̀ ẹ́ pé kí ó má ṣe wọ gbọ̀ngàn eré náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn “olórí Éṣíà” wọ̀nyí jẹ́ àwọn òṣìṣẹ́ tàbí olórí pàtàkì tí ó ní í ṣe pẹ̀lú ìpínlẹ̀ Róòmù ti Éṣíà.
    reason: cultural_note
  - marker: b
    text: Ó tún lè jẹ́, “kí ó má ṣe fi ara rẹ̀ hàn ní gbọ̀ngàn eré náà,” tàbí “kí ó má ṣe lọ sínú gbọ̀ngàn eré náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Àní, àwọn kan lára
  rationale: “Àwọn kan lára” pa àìsọ iye pàtó mọ́; “Àní” sì fi ìtẹnumọ́ καί hàn pé ó yani lẹ́nu pé àwọn ẹni pàtàkì wọ̀nyí náà dúró ti Pọ́ọ̀lù.
- source_word: Ἀσιαρχῶν
  choice: àwọn olórí ìgbèríko Éṣíà
  rationale: Àkíyèsí yìí tú oyè ìṣàkóso pàtó náà sí Yorùbá tí òǹkàwé òde òní lè lóye, láì mú kí “Éṣíà” dà bí gbogbo kọ́ńtínẹ́ǹtì.
- source_word: ὄντες αὐτῷ φίλοι
  choice: tí wọ́n jẹ́ ọ̀rẹ́ Pọ́ọ̀lù
  rationale: Ó sọ ìbáṣepọ̀ φίλοι ní kedere; lílo orúkọ Pọ́ọ̀lù dípò arọ́pò-orúkọ yọ ìṣiyèméjì kúrò lọ́nà àdánidá ní Yorùbá.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: ránṣẹ́ sí i
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ohun tí wọ́n rán ní tààrà; “ránṣẹ́ sí i” jẹ́ àfihàn Yorùbá àdánidá tí kò fi ohun tí kò sí nínú orísun kún un.
- source_word: παρεκάλουν
  choice: wọ́n sì rọ̀ ọ́
  rationale: “Rọ̀” mú ìṣílétí onítara ti παρακαλέω jáde; ìrísí imperfect náà lè túmọ̀ sí ìrọ̀rọ̀ tí ń tẹ̀ síwájú, ṣùgbọ́n ọ̀rọ̀ Yorùbá yìí kò fi dandan pinnu bóyá ó ṣẹlẹ̀ lẹ́ẹ̀kan tàbí léraléra.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: kí ó má ṣe fi ara rẹ̀ sínú ewu nípa lílọ sínú gbọ̀ngàn eré náà
  rationale: Ìtumọ̀ àkópọ̀ náà ni pé kí Pọ́ọ̀lù má ṣe fi ara rẹ̀ hàn sí ewu níbi ìpéjọpọ̀ náà; “lílọ sínú” tún pa ìtọ́sọ́nà εἰς mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti ìtàn, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. “Gbọ̀ngàn eré” níbí ni ibi ìpéjọpọ̀ ńlá ti ìlú, kì í ṣe ilé ìṣeré òde òní nìkan.
