revisions:
- from: Àní, àwọn kan lára àwọn olórí ìgbèríko Éṣíà[a], tí wọ́n jẹ́ ọ̀rẹ́ Pọ́ọ̀lù, ránṣẹ́ sí i, wọ́n sì rọ̀ ọ́ pé kí ó má ṣe fi ara rẹ̀ sínú ewu nípa lílọ sínú gbọ̀ngàn eré náà.[b]
  to: Àní, àwọn kan lára àwọn olórí Éṣíà[a], tí wọ́n jẹ́ ọ̀rẹ́ Pọ́ọ̀lù, ránṣẹ́ sí i, wọ́n sì bẹ̀ ẹ́ pé kí ó má ṣe wọ gbọ̀ngàn eré náà.[b]
  rationale: Àtúnṣe náà yọ ìfikún ‘ewu’ kúrò nínú ìtumọ̀ àkọ́kọ́ kí ó lè fara mọ́ μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον pẹkipẹki, nígbà tí ó ṣì jẹ́ Yorùbá àdánidá. Ó tún rọ́pò “ìgbèríko” pẹ̀lú “Éṣíà,” tí àkíyèsí ìsàlẹ̀ sì ṣàlàyé oyè Ἀσιαρχῶν láì sọ ju ohun tí orísun fìdí múlẹ̀ lọ.
