language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: yo
  text: Nítorí náà, àwọn kan ń ké ohun kan, àwọn mìíràn sì ń ké ohun mìíràn,[a] nítorí ìpéjọ náà wà nínú ìdàrúdàpọ̀, ọ̀pọ̀ jù lọ lára wọn kò sì mọ ìdí tí wọ́n fi péjọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn kan ń ké nǹkan kan, àwọn mìíràn sì ń ké nǹkan mìíràn.” Ọ̀rọ̀ Gíríìkì fún “ìpéjọ” níbí ni ἐκκλησία; àpéjọ àwọn ará ìlú ni ó ń tọ́ka sí, kì í ṣe ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Nítorí náà, àwọn kan ń ké ohun kan, àwọn mìíràn sì ń ké ohun mìíràn
  rationale: 'Ọ̀rọ̀ yìí fi ìyàtọ̀ àwọn ẹgbẹ́ hàn: àwọn kan ń ké ohun kan, àwọn mìíràn sì ń ké ohun mìíràn. “Ń ké” mú iṣẹ́ tí ó ń lọ lọ́wọ́ nínú ἔκραζον jáde lọ́nà àdánidá.'
- source_word: ἐκκλησία
  choice: ìpéjọ
  rationale: Ní àyíká ìṣẹ̀lẹ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí àpéjọ àwọn ará ìlú, kì í ṣe ìjọ àwọn onígbàgbọ́. “Ìpéjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó péye, tí kò sì gbé ìtumọ̀ ti ẹ̀sìn wọlé.
- source_word: συγκεχυμένη
  choice: wà nínú rúdurùdu
  rationale: Perfect participle náà ṣàpèjúwe ipò ìdàrúdàpọ̀ tí ó ti dé bá ìpéjọ náà; “wà nínú rúdurùdu” sọ ipò yẹn ní Yorùbá àdánidá.
- source_word: οἱ πλείους
  choice: ọ̀pọ̀ jù lọ lára wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí púpọ̀ jù lọ nínú àwọn tí ó péjọ, a sì tọ́ka sí wọn kedere pẹ̀lú “lára wọn.”
- source_word: τίνος ἕνεκα
  choice: ìdí tí
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí “nítorí ìdí wo”; ìṣètò “ìdí tí wọ́n fi...” jẹ́ Yorùbá àdánidá.
- source_word: συνεληλύθεισαν
  choice: wọ́n fi péjọ
  rationale: Ọ̀rọ̀-ìṣe náà sọ pé wọ́n ti kóra jọ ṣáájú àkókò ìtàn náà. Nínú gbólóhùn “ìdí tí wọ́n fi péjọ,” Yorùbá fi ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ hàn láìlo àgbékalẹ̀ àjèjì.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία nínú àyíká yìí
  choice: ìpéjọ àwọn ará ìlú
  alternative: ìjọ
  rationale: Àyíká rúdurùdu ará Éfésù fi hàn pé àpéjọ ìlú ni a ń sọ, kì í ṣe ìjọ Kristẹni; nítorí náà a yẹra fún “ìjọ,” èyí tí ó lè mú òye ti ẹ̀sìn tí kò sí nínú ẹsẹ yìí wọlé.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. “Rúdurùdu” mú ariwo àti àìṣètò àpéjọ náà jáde ní ṣókí.
