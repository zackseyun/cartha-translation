  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, wọ́n sì gba ìrìbọmi sínú orúkọ Olúwa Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “ní orúkọ Olúwa Jésù.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Ọ̀rọ̀ ìṣe aláìlópìn aorist participle náà ń tọ́ka sí àkókò. “Èyí” mú ohun tí wọ́n gbọ́ láti inú ọ̀rọ̀ tó ṣáájú wá sí gbangba ní Yorùbá.
- source_word: δὲ
  choice: kò ṣe é túmọ̀ lọ́tọ̀ nínú gbólóhùn náà
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́. Ìtẹ̀síwájú ìtàn hàn kedere nínú Yorùbá láìfi “ṣùgbọ́n” kún un, èyí tí ì bá mú ìtakora tó lágbára wọlé.
- source_word: ἐβαπτίσθησαν
  choice: wọ́n gba ìrìbọmi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ṣe ìrìbọmi fún wọn, ó sì pa wọ́n mọ́ gẹ́gẹ́ bí ẹni tí ìṣe náà ṣẹlẹ̀ sí.
- source_word: εἰς τὸ ὄνομα
  choice: sínú orúkọ
  rationale: “Sínú” pa ìtọ́sọ́nà àti ìdámọ̀/ìsopọ̀ tí εἰς lè ní mọ́, dípò kí a sọ ọ́ di gbólóhùn àṣà ìjọsìn kan ṣoṣo.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Nínú àyíká yìí, κύριος jẹ́ oyè Jésù; “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ Ἰησοῦς tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ọ̀rọ̀ tí a lò fún ìbáṣepọ̀ ìrìbọmi pẹ̀lú orúkọ Jésù
  choice: sínú orúkọ Olúwa Jésù
  alternative: ní orúkọ Olúwa Jésù
  rationale: Gíríìkì ní εἰς τὸ ὄνομα, tí “sínú orúkọ” ń tẹ̀lé pẹ́kípẹ́kí, ó sì pa agbára ìtọ́sọ́nà tàbí ìdámọ̀ rẹ̀ mọ́. “Ní orúkọ” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ti wọ́pọ̀; a fi sí àlàyé ìsàlẹ̀ láìfipá yan ìtumọ̀ ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún òǹkàwé gbogbogbò. “Gba ìrìbọmi” jẹ́ àdánidá ju àkópọ̀ ọ̀rọ̀ palolo tí kò wọ́pọ̀ lọ.
