    text: Tàbí “àwọn agbègbè òkè” tàbí “àwọn agbègbè gíga”; ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ọ̀nà inú ilẹ̀ tó gba ilẹ̀ gíga kọjá dípò ọ̀nà etíkun.
    reason: lexical_alternative
  - marker: b
    text: A kò sọ níhìn-ín ẹni tí àwọn “ọmọ-ẹ̀yìn” wọ̀nyí jẹ́ ọmọ-ẹ̀yìn rẹ̀; àwọn ẹsẹ̀ tó tẹ̀ lé fi hàn pé ìbatisí Jòhánù ni wọ́n ti gbà.
    reason: cross_reference
  revision_rationale: The revision adopts the contextually best Yoruba geographical expression for the inland route while preserving ‘upper/high regions’ as alternatives in the footnote. It also clarifies the disciples footnote grammatically and keeps the verse itself neutral about their identity.
