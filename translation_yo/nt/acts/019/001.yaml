revisions:
- from: Ó sì ṣẹlẹ̀ pé nígbà tí Àpólò wà ní Kọ́ríńtì, Pọ́ọ̀lù gba àwọn agbègbè òkè[a] kọjá, ó dé Éfésù, ó sì rí àwọn ọmọ-ẹ̀yìn kan[b].
  to: Ó sì ṣẹlẹ̀ pé nígbà tí Àpólò wà ní Kọ́ríńtì, Pọ́ọ̀lù gba àwọn agbègbè inú ilẹ̀[a] kọjá, ó dé Éfésù, ó sì rí àwọn ọmọ-ẹ̀yìn kan[b].
