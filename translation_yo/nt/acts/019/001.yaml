id: ACT.19.1
reference: Acts 19:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé nígbà tí Àpólò wà ní Kọ́ríńtì, Pọ́ọ̀lù gba àwọn agbègbè inú ilẹ̀[a] kọjá, ó dé Éfésù, ó sì rí àwọn ọmọ-ẹ̀yìn kan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn agbègbè òkè” tàbí “àwọn agbègbè gíga”; ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ọ̀nà inú ilẹ̀ tó gba ilẹ̀ gíga kọjá dípò ọ̀nà etíkun.
    reason: lexical_alternative
  - marker: b
    text: A kò sọ níhìn-ín ẹni tí àwọn “ọmọ-ẹ̀yìn” wọ̀nyí jẹ́ ọmọ-ẹ̀yìn rẹ̀; àwọn ẹsẹ̀ tó tẹ̀ lé fi hàn pé ìbatisí Jòhánù ni wọ́n ti gbà.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Àpólà ìtàn yìí fi ìṣẹ̀lẹ̀ tuntun mọ́ ohun tó ṣáájú; “Ó sì ṣẹlẹ̀ pé” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ipa δέ mọ́ láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: nígbà tí Àpólò wà ní Kọ́ríńtì
  rationale: Gbólóhùn infinitive pẹ̀lú ἐν τῷ ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ méjì tó ń lọ ní àkókò kan náà; èyí jẹ́ Yorùbá tó ṣe kedere.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: gba àwọn agbègbè òkè kọjá
  rationale: ἀνωτερικά túmọ̀ ní ìpilẹ̀ sí ohun tó wà lókè; nípa ilẹ̀ níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí agbègbè òkè inú ilẹ̀, ní ìyàtọ̀ sí ọ̀nà etíkun. A pa àwòrán “òkè” mọ́, a sì ṣàlàyé àṣàyàn mìíràn ní àlàyé ìsàlẹ̀.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: ó dé Éfésù
  rationale: Èyí sọ ìrìn-àjò sí ìlú náà ní Yorùbá àdánidá, ó sì tẹ̀ lé participle tó ṣáájú gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó tẹ̀ lé e.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: ó sì rí àwọn ọmọ-ẹ̀yìn kan
  rationale: τινας jẹ́ aláìnídìí, nítorí náà “kan” yẹ; “ọmọ-ẹ̀yìn” pa ìtumọ̀ μαθητής mọ́ láìsọ ẹni tí wọ́n jẹ́ ọmọ-ẹ̀yìn rẹ̀.
theological_decisions:
- issue: Ta ni “μαθητάς” ń tọ́ka sí?
  choice: àwọn ọmọ-ẹ̀yìn kan
  alternative: àwọn ọmọ-ẹ̀yìn Jòhánù kan; àwọn ọmọ-ẹ̀yìn Jésù kan
  rationale: Ẹsẹ yìí kò sọ ẹni tí wọ́n jẹ́ ọmọ-ẹ̀yìn rẹ̀. Àwọn ẹsẹ tó tẹ̀ lé ni yóò ṣàlàyé ìbáṣepọ̀ wọn pẹ̀lú ìbatisí Jòhánù; nítorí náà a kò yanjú àìdánilójú náà ṣáájú Lúùkù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. Orúkọ ilẹ̀ àti ènìyàn ni a kọ ní ìbámu pẹ̀lú ìró Yorùbá.
