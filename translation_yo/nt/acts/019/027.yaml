id: ACT.19.27
reference: Acts 19:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: yo
  text: Kì í ṣe pé iṣẹ́ òwò wa yìí nìkan ló wà nínú ewu pé yóò di ohun ẹ̀gàn, ṣùgbọ́n a tún lè ka tẹ́ńpìlì Átẹ́mísì, òrìṣàbìnrin ńlá náà, sí ohun asán, a sì lè mú ọlá ńlá rẹ̀[b] wó lulẹ̀—ẹni tí gbogbo Éṣíà àti gbogbo ayé tí ènìyàn ń gbé[a] ń bọ̀wọ̀ fún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ayé.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń tọ́ka sí ayé tí ènìyàn ń gbé, ní pàtàkì ayé Róòmù tí wọ́n mọ̀ nígbà náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìtẹ́wọ́gbà rẹ̀” tàbí “gíga rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ọlá, ipò gíga, tàbí ìmọ́lẹ̀-ọlá Átẹ́mísì tí a ń sọ pé a lè mú wó lulẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: ló wà nínú ewu
  rationale: Ó sọ ewu tàbí ṣíṣeéṣe ohun búburú ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: τὸ μέρος
  choice: iṣẹ́ òwò wa yìí
  rationale: Nínú ọ̀rọ̀ yìí, ó tọ́ka sí iṣẹ́ àti òwò àwọn oníṣẹ́ ọnà náà, kì í ṣe ‘apá’ lásán.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: pé yóò di ohun ẹ̀gàn
  rationale: Ó pa ìtumọ̀ dídé sí ipò àbùkù tàbí àìníyì mọ́ ní èdè Yorùbá àdánidá.
- source_word: ἱερὸν
  choice: tẹ́ńpìlì
  rationale: Ó ṣe kedere pé ibi ìjọsìn olókìkí Átẹ́mísì ní Éfésù ni a ń sọ̀rọ̀ rẹ̀.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: kí a ka ... sí ohun asán
  rationale: Ó pa àwòrán Gíríìkì ti kíkà ohun kan sí ohun tí kò níye mọ́ láìṣe àlàyé ju orísun lọ.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: kí a sì sọ ọ́ kalẹ̀ kúrò nínú ọlá ńlá rẹ̀
  rationale: Gbólóhùn Gíríìkì náà díjú; ìtumọ̀ yìí fi ìbẹ̀rù pé ipò gíga àti ọlá rẹ̀ yóò rẹ̀ sílẹ̀ hàn, láìfi dájú ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ὅλη ἡ Ἀσία
  choice: gbogbo Éṣíà
  rationale: Ó pa gbígbòòrò ọ̀rọ̀ Demetiriusi mọ́; Éṣíà níbí jẹ́ agbègbè ìṣàkóso Róòmù.
- source_word: ἡ οἰκουμένη
  choice: gbogbo ayé tí ènìyàn ń gbé
  rationale: Ó mú ìtumọ̀ gangan ti ayé olùgbé jáde, ní pàtàkì ayé tí wọ́n mọ̀ ní àkókò Róòmù.
- source_word: σέβεται
  choice: ń bọ̀wọ̀ fún
  rationale: Ó lè túmọ̀ sí ọ̀wọ̀ ẹ̀sìn tàbí ìjọsìn; ‘bọ̀wọ̀ fún’ pa ìwọ̀nyí mọ́ láìsọ ìtumọ̀ rẹ̀ di tóóró jù.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ èdè ẹ̀sìn abọ̀rìṣà láìdín un kù tàbí fọwọ́ sí i
  choice: Átẹ́mísì, òrìṣàbìnrin ńlá náà ... ẹni tí gbogbo Éṣíà àti gbogbo ayé tí ènìyàn ń gbé ń bọ̀wọ̀ fún
  alternative: Átẹ́mísì, ẹni tí wọ́n ń pè ní òrìṣàbìnrin ńlá ... tí gbogbo Éṣíà àti ayé ń sìn
  rationale: Ẹsẹ̀ náà ń ròyìn ọ̀rọ̀ Demetiriusi láti ojú ìwòye rẹ̀. A kò fi ọ̀rọ̀ ìyàtọ̀ tí kò sí nínú Gíríìkì kún un, bẹ́ẹ̀ ni a kò sọ pé olùkọ̀wé fọwọ́ sí ohun tí Demetiriusi gbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘òrìṣàbìnrin’ fún θεά láti fi abo ọ̀rọ̀ náà hàn, ‘tẹ́ńpìlì’ fún ibi ìjọsìn náà, àti àtẹ̀jáde olóhùn kíkún níbi tí ó ti bá ìlò àdánidá mu.
