id: ACT.19.26
reference: Acts 19:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: yo
  text: Ẹ sì rí, ẹ sì ń gbọ́ pé kì í ṣe ní Éfésù nìkan, ṣùgbọ́n ní fẹ́rẹ̀ẹ́ jẹ́ gbogbo Éṣíà, Pọ́ọ̀lù yìí ti yí ọ̀pọ̀ ènìyàn lọ́kàn, ó sì ti fa wọn kúrò, nípa sísọ pé àwọn ohun tí a fi ọwọ́ ṣe kì í ṣe ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ní tààràtà, “àwọn tí a ń ṣe nípasẹ̀ ọwọ́”; ọ̀rọ̀ náà ń tọ́ka sí àwọn ère òrìṣà tí iṣẹ́ ọwọ́ ènìyàn ṣe.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: Ẹ̀yin fúnra yín sì rí, ẹ sì ń gbọ́
  rationale: Ó pa ìpè méjèèjì sí ẹ̀rí tí àwọn olùgbọ́ ń rí tí wọ́n sì ń gbọ́ mọ́; “fúnra yín” mú agbára ọ̀rọ̀ ìyanilójú náà hàn láì fi èrò tuntun kún un.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: kì í ṣe ní Éfésù nìkan, ṣùgbọ́n ní ó fẹ́rẹ̀ẹ́ jẹ́ gbogbo Éṣíà
  rationale: A tú ìtumọ̀ ibi tí gírámà Gíríìkì ń tọ́ka sí jáde ní Yorùbá; “ó fẹ́rẹ̀ẹ́ jẹ́” fi σχεδόν hàn láì sọ pé gbogbo agbègbè náà pátápátá.
- source_word: ὁ Παῦλος οὗτος
  choice: Pọ́ọ̀lù yìí
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́kasí οὗτος mọ́, pẹ̀lú ìró àfojúdi díẹ̀ nínú ọ̀rọ̀ Dèmétíríù, láì ṣe àfikún ẹ̀gàn tí kò sí nínú ọ̀rọ̀.
- source_word: πείσας μετέστησεν
  choice: ti yí ... lọ́kàn, tí ó sì ti mú wọn yí padà
  rationale: 'Ó yà ìṣe méjèèjì sọ́tọ̀: Pọ́ọ̀lù kọ́kọ́ yí wọn lọ́kàn, ó sì fa ìyípadà kúrò ní ipò tàbí ìṣe wọn tẹ́lẹ̀. A kò fi “tàn wọ́n jẹ” sí i, nítorí ìyẹn yóò túmọ̀ ọ̀rọ̀ ju bó ṣe wà lọ.'
- source_word: ἱκανὸν ὄχλον
  choice: ogunlọ́gọ̀ ènìyàn kan tí ó pọ̀
  rationale: Ìtumọ̀ náà ni ogunlọ́gọ̀ tó pọ̀ tó láti jẹ́ ohun pàtàkì; gbolohun yìí jẹ́ èdè Yorùbá tí ó ṣe kedere fún ènìyàn gbogbo.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: àwọn ohun tí a fi ọwọ́ ṣe kì í ṣe ọlọ́run
  rationale: Ó pa ìkọ̀sílẹ̀ ipò òrìṣà ti ohun tí ènìyàn ṣe mọ́. “Àwọn ohun” mú olùṣe tí a sọ di orúkọ nínú Gíríìkì hàn ní Yorùbá láì fi “gan-an” tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
theological_decisions:
- issue: Bí a ṣe máa sọ ìkọ̀sílẹ̀ Pọ́ọ̀lù pé ohun tí ọwọ́ ènìyàn ṣe kì í ṣe ọlọ́run
  choice: àwọn ohun tí a fi ọwọ́ ṣe kì í ṣe ọlọ́run
  alternative: àwọn ọlọ́run tí ọwọ́ ènìyàn ṣe kì í ṣe ọlọ́run
  rationale: Àṣàyàn náà tẹ̀ lé àkópọ̀ ọ̀rọ̀ Gíríìkì, ó sì sẹ́ ipò ọlọ́run fún àwọn ère tí ènìyàn ṣe. Ó yẹra fún gbólóhùn tí ó lè dà bí ẹni pé ọ̀rọ̀ náà kọ́kọ́ jẹ́wọ́ pé àwọn ohun náà jẹ́ ọlọ́run ní tòótọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. A pa ìró ọ̀rọ̀ ẹ̀sùn Dèmétíríù mọ́, ṣùgbọ́n a kò fi ẹ̀gàn tàbí ẹ̀kọ́ ẹ̀sìn tí kò sí nínú orísun kún un.
