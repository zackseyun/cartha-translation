id: ACT.19.2
reference: Acts 19:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: yo
  text: Ó sì bi wọ́n pé,[a] “Ṣé ẹ gba Ẹ̀mí Mímọ́ nígbà tí ẹ gbàgbọ́?” Wọ́n sì dá a lóhùn pé, “Rárá,[b] àní a kò tilẹ̀ gbọ́ pé Ẹ̀mí Mímọ́ wà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹ gba Ẹ̀mí Mímọ́ lẹ́yìn tí ẹ gbàgbọ́?” Ọ̀rọ̀-ìṣe alábápín náà nínú èdè Gíríìkì lè ní ìbòji àkókò tó yàtọ̀ díẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kò tilẹ̀ gbọ́ bóyá Ẹ̀mí Mímọ́ wà”; tàbí, pẹ̀lú ìtumọ̀ àlàyé sí i, “a kò tilẹ̀ gbọ́ pé a ti fi Ẹ̀mí Mímọ́ fúnni.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Ó sì bi wọ́n pé
  rationale: τέ so ọ̀rọ̀ yìí mọ́ ìtàn tó ṣáájú lọ́nà pẹ̀lẹ́; “sì” jẹ́ ọ̀nà àdánidá láti fi ìsopọ̀ náà hàn. Ní Yorùbá, “bi wọ́n pé” mú ìṣe sísọ tí ó jẹ́ ìbéèrè jáde ní kedere.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Ṣé ẹ gba ... nígbà tí ẹ gba ìgbàgbọ́?
  rationale: Aorist participle πιστεύσαντες ní ìbáṣepọ̀ àkókò pẹ̀lú ἐλάβετε. “Nígbà tí ẹ gba ìgbàgbọ́” pa ìrọ̀rùn ìtumọ̀ àkókò Gíríìkì mọ́, láìfi dandan sọ pé gbígba Ẹ̀mí ṣẹlẹ̀ lẹ́yìn náà tàbí ní ìṣẹ́jú kan náà gan-an.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run gẹ́gẹ́ bí ẹni, kì í ṣe ẹ̀mí mímọ́ kan lásán. Ọ̀rọ̀ orúkọ náà kò nílò article ní Yorùbá.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Wọ́n sì dá a lóhùn pé
  rationale: δέ jẹ́ ìtẹ̀síwájú tàbí ìyàtọ̀ kékeré. “Sì” fi èyí hàn lọ́nà àdánidá, “dá a lóhùn” sì yẹ fún ìdáhùn sí ìbéèrè bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà jẹ́ àfikún láti inú àyíká Gíríìkì.
- source_word: Ἀλλ’ οὐδ’
  choice: Rárá, àní ... kò tilẹ̀
  rationale: Àkójọpọ̀ ἀλλά àti οὐδέ mú ìkọ̀sílẹ̀ náà lágbára. “Rárá” àti “àní ... kò tilẹ̀” mú agbára ìdáhùn náà jáde ní Yorùbá àdánidá.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: àní a kò tilẹ̀ gbọ́ pé Ẹ̀mí Mímọ́ kan wà
  rationale: εἰ lè jẹ́ “pé” tàbí “bóyá” nínú àkójọpọ̀ yìí. Ìtumọ̀ inú ẹsẹ̀ tẹ̀lé ọ̀nà tààrà pé wọn kò gbọ́ pé Ẹ̀mí Mímọ́ wà, láìṣàfikún pé a ti fi í fúnni. “Kan” bá ìtumọ̀ existential ἔστιν mu, kì í sì í sọ Ẹ̀mí di ọ̀kan lára ọ̀pọ̀ ẹ̀mí mímọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ àkókò láàárín gbígba ìgbàgbọ́ àti gbígba Ẹ̀mí Mímọ́
  choice: “nígbà tí ẹ gba ìgbàgbọ́”
  alternative: “lẹ́yìn tí ẹ gba ìgbàgbọ́” tàbí “ní kété tí ẹ gba ìgbàgbọ́”
  rationale: πιστεύσαντες kò dá ẹ̀kọ́ nípa bí àwọn ìṣẹ̀lẹ̀ méjèèjì ṣe jìnnà sí ara wọn múlẹ̀. Ìtumọ̀ tí a yàn pa ìṣòro àti ìrọ̀rùn ọ̀rọ̀ Gíríìkì mọ́ láìyanju àríyànjiyàn ẹ̀kọ́ ìsìn.
- issue: Ohun tí àìmọ̀ àwọn ọmọ-ẹ̀yìn nípa Ẹ̀mí Mímọ́ túmọ̀ sí
  choice: “a kò tilẹ̀ gbọ́ pé Ẹ̀mí Mímọ́ kan wà”
  alternative: “a kò tilẹ̀ gbọ́ bóyá Ẹ̀mí Mímọ́ wà” tàbí “a kò tilẹ̀ gbọ́ pé a ti fi Ẹ̀mí Mímọ́ fúnni”
  rationale: Ọ̀rọ̀ Gíríìkì ṣeé túmọ̀ sí “pé” tàbí “bóyá,” ṣùgbọ́n kò sọ “a ti fi ... fúnni” ní tààrà. Ìtumọ̀ inú ẹsẹ̀ tẹ̀lé ọ̀rọ̀ tó hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ọ̀nà míì mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, ní èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo “ẹ” fún ọ̀pọ̀ ènìyàn tí Paulu ń bá sọ̀rọ̀; a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí yóò fi dandan pinnu bóyá gbígba Ẹ̀mí Mímọ́ ṣẹlẹ̀ lẹ́yìn ìgbàgbọ́ tàbí lẹ́sẹ̀kẹsẹ̀.
