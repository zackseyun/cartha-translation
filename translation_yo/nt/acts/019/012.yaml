id: ACT.19.12
reference: Acts 19:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: yo
  text: Tó bẹ́ẹ̀ tí a fi máa ń gbé àwọn aṣọ ìnúsẹ́ tàbí àwọn àpárọ̀nù iṣẹ́[b] láti ara rẹ̀[a] lọ sí ọ̀dọ̀ àwọn aláìsàn; àwọn àrùn náà sì ń fi wọ́n sílẹ̀, àwọn ẹ̀mí búburú sì ń jáde kúrò lára wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, ‘láti awọ ara rẹ̀.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àpárọ̀nù tàbí aṣọ iṣẹ́ tí a máa ń lò nínú iṣẹ́ ọwọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Tó bẹ́ẹ̀ tí ... fi
  rationale: Ó fi àbájáde àwọn iṣẹ́ agbára àrà ọ̀tọ̀ tí ẹsẹ tó ṣáájú sọ hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: lọ sọ́dọ̀ àwọn aláìsàn
  rationale: Àpólà yìí túmọ̀ sí àwọn tí ara wọn kò le; ‘lọ sọ́dọ̀’ bá ìṣípò tí ọ̀rọ̀-ìṣe ἀποφέρεσθαι ní mu.
- source_word: ἀποφέρεσθαι
  choice: àwọn ènìyàn fi máa ń gbé ... lọ
  rationale: Ìṣe aláìlórúkọ Gíríìkì ni a sọ di gbólóhùn oníṣe gbogbogbò ní Yorùbá, láì sọ ẹni pàtó tí ó gbé wọn; ‘máa ń’ tún fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: tí ó ti kan ara rẹ̀
  rationale: χρώς tọ́ka ní pàtó sí awọ ara, ṣùgbọ́n ‘kan ara rẹ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn aṣọ náà wà lára Paulu; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan pamọ́.
- source_word: σουδάρια
  choice: aṣọ ìnúsẹ́
  rationale: Ó jẹ́ aṣọ kékeré fún pípa ojú tàbí òógùn; ‘aṣọ ìnúsẹ́’ yé òǹkàwé Yorùbá òde òní.
- source_word: σιμικίνθια
  choice: aṣọ ìdábùú iṣẹ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí aṣọ tí òṣìṣẹ́ máa ń dá bo ara nígbà iṣẹ́ ọwọ́; fífi ‘iṣẹ́’ kún un mú irú aṣọ náà ṣe kedere.
- source_word: ἀπαλλάσσεσθαι
  choice: àwọn àrùn náà sì ń fi wọ́n sílẹ̀
  rationale: Ó pa àwòrán pé àrùn ń kúrò lára àwọn aláìsàn mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: νόσους
  choice: àwọn àrùn náà
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà àti ìsọ pàtó inú Gíríìkì mọ́ láì fi ọ̀rọ̀ onínǹkan tí kò sí nínú orísun kún un.
- source_word: πνεύματα τὰ πονηρά
  choice: àwọn ẹ̀mí búburú
  rationale: Ó túmọ̀ ọ̀rọ̀ náà ní tààrà gẹ́gẹ́ bí àwọn ẹ̀dá ẹ̀mí ọ̀tá, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἐκπορεύεσθαι
  choice: ń jáde kúrò lára wọn
  rationale: ‘Jáde kúrò lára’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ẹ̀mí tí ń fi ẹni tí ó wà lára rẹ̀ sílẹ̀.
theological_decisions:
- issue: Irú ìwòsàn àti ìlépa ẹ̀mí búburú tí ó ní í ṣe pẹ̀lú àwọn aṣọ tí ó kan Paulu
  choice: A sọ ìṣẹ̀lẹ̀ náà ní tààrà gẹ́gẹ́ bí Luku ṣe ròyìn rẹ̀, láì ṣàlàyé ọ̀nà tí iṣẹ́ ìyanu náà gbà ṣẹlẹ̀.
  alternative: Kí a sọ ọ́ bí ìfọwọ́sí ìbọ̀wọ̀ fún ohun ìrántí ẹni mímọ́, tàbí kí a dín iṣẹ́ ìyanu náà kù sí àmì lásán.
  rationale: Orísun sọ pé àwọn àrùn fi àwọn aláìsàn sílẹ̀, àwọn ẹ̀mí búburú sì jáde nígbà tí a gbé àwọn aṣọ tí ó ti kan ara Paulu dé ọ̀dọ̀ wọn. Ìtumọ̀ kò gbọ́dọ̀ fi ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn náà kún un, bẹ́ẹ̀ ni kò gbọ́dọ̀ mú àlàyé iṣẹ́ ìyanu náà di ohun ìṣàpẹẹrẹ lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Tó bẹ́ẹ̀ tí ... fi’ ṣe àfihàn àbájáde; ‘máa ń’ àti ‘ń’ fi ìṣe tí a ròyìn gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ hàn. A yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn àkànṣe, a sì fi àmì ìsàlẹ̀ [a] àti [b] sí ibi tí ọ̀kọ̀ọ̀kan wọn ń ṣàlàyé.
