  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀mí búburú náà dá wọn lóhùn pé, “Jésù ni mo mọ̀, mo sì mọ̀ nípa Paulu[a]; ṣùgbọ́n ẹ̀yin, ta ni yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “mo sì mọ ẹni tí Paulu jẹ́.” Gíríìkì lo ọ̀rọ̀-ìṣe méjì ọ̀tọ̀ fún “mọ̀” níbí: γινώσκω àti ἐπίσταμαι; ó ṣeé ṣe kí ìtumọ̀ wọn yàtọ̀ díẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν δὲ ... εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n ... dá wọn lóhùn pé
  rationale: A so àkópọ̀ participle àti ọ̀rọ̀-ìṣe àkóso náà di gbolohun Yorùbá adayébá kan, nígbà tí a pa ìtumọ̀ ìdáhùn àti àwọn tí a ń bá sọ mọ́.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ẹ̀mí búburú náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ nípa ẹ̀dá ẹ̀mí oníbúburú mu.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Jésù ni mo mọ̀
  rationale: Ìgbé Jésù sí iwájú nínú Gíríìkì ní ìtẹnumọ́; ìṣètò ‘Jésù ni mo mọ̀’ pa ìtẹnumọ́ yẹn mọ́ lọ́nà adayébá.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: mo sì mọ ẹni tí Paulu jẹ́
  rationale: Ọ̀rọ̀ yìí mú ìyàtọ̀ díẹ̀ wà láàárín ἐπίσταμαι àti γινώσκω láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: ṣùgbọ́n ẹ̀yin, ta ni yín?
  rationale: ‘Ẹ̀yin’ fi ọ̀pọ̀ ènìyàn àti ìtẹnumọ́ hàn; ‘ta ni yín?’ jẹ́ ìbéèrè Yorùbá adayébá nípa ẹni tí ẹgbẹ́ ènìyàn jẹ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín γινώσκω àti ἐπίσταμαι nínú ọ̀rọ̀ ẹ̀mí búburú náà
  choice: “Jésù ni mo mọ̀, mo sì mọ ẹni tí Paulu jẹ́”
  alternative: “Jésù ni mo mọ̀, mo sì mọ̀ nípa Paulu” tàbí “Jésù ni mo mọ̀, Paulu náà sì jẹ́ ẹni tí mo mọ̀”
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe méjì ọ̀tọ̀. Àyànfẹ́ náà fi ìyàtọ̀ ìró àti ìtumọ̀ díẹ̀ hàn, ṣùgbọ́n kò pinnu bóyá ìmọ̀ kejì jinlẹ̀ tàbí kéré ju ti àkọ́kọ́ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní; a lo ‘ẹ̀yin’ láti pa ọ̀pọ̀ ẹni inú Gíríìkì mọ́.
