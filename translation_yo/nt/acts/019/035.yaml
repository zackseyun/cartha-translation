language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí akọ̀wé ìlú ti mú kí ogunlọ́gọ̀ náà dákẹ́, ó wí pé, “Ẹ̀yin ọkùnrin ará Éfésù, ta ni ó wà láàárín ènìyàn tí kò mọ̀ pé ìlú àwọn ará Éfésù ni olùtọ́jú tẹ́ńpìlì Átẹ́mísì ńlá[a], àti ère tí ó jábọ́ láti ọ̀run[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùṣọ́ tẹ́ńpìlì Átẹ́mísì ńlá.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìlú tí a mọ̀ sí alábòójútó tẹ́ńpìlì tàbí ìjọsìn kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí ó jábọ́ láti ọ̀run.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a gbà pé ó jábọ́ láti ojú ọ̀run; níbí, ó ṣeé ṣe kí ó túmọ̀ sí ère ìjọsìn tí ó ní í ṣe pẹ̀lú Átẹ́mísì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: lẹ́yìn tí ... ti mú ... dákẹ́
  rationale: Ó fi hàn pé ìṣe mímú ogunlọ́gọ̀ dákẹ́ ṣẹlẹ̀ ṣáájú ọ̀rọ̀ tí akọ̀wé ìlú sọ, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ὁ γραμματεὺς
  choice: akọ̀wé ìlú
  rationale: Nínú àyíká ìṣàkóso ìlú yìí, ọ̀rọ̀ náà ń tọ́ka sí òṣìṣẹ́ pàtàkì ti ìjọba ìlú, kì í ṣe akọ̀wé ẹ̀sìn Júù.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: Ó bá àwùjọ ènìyàn púpọ̀ tí ó ń pariwo nínú ìṣẹ̀lẹ̀ náà mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Ẹ̀yin ọkùnrin ará Éfésù
  rationale: Ó pa ìpè akọ tí ó hàn gbangba nínú Gíríìkì mọ́, ó sì bá ọ̀rọ̀ ìkéde onípò mu.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: ta ni ó wà láàárín ènìyàn tí kò mọ̀
  rationale: Ó pa agbára ìbéèrè àsọyé náà mọ́ láì mú un di ọ̀rọ̀ tí kò wọ́pọ̀ ní Yorùbá.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: ìlú àwọn ará Éfésù
  rationale: Ó tẹ̀lé ìtumọ̀ genitive Gíríìkì ní kedere, dípò yíyí i sí ‘ìlú Éfésù’ nìkan.
- source_word: νεωκόρον
  choice: olùtọ́jú tẹ́ńpìlì
  rationale: Ó sọ ipa ìlú náà gẹ́gẹ́ bí olùṣọ́ tàbí alábòójútó ibi ìjọsìn náà ní Yorùbá tí ó yé ni.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: Átẹ́mísì ńlá
  rationale: Ó pa orúkọ òrìṣà náà àti oyè ìyìn ‘ńlá’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ olùsọ.
- source_word: τοῦ διοπετοῦς
  choice: ère tí ó jábọ́ láti ọ̀run
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a gbà pé ó ti ọ̀run jábọ́; ‘ère’ jẹ́ ohun tí àyíká ọ̀rọ̀ ṣeé ṣe kí ó ń tọ́ka sí, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú lexical mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìjẹ́wọ́ ẹ̀sìn abọ̀rìṣà nípa Átẹ́mísì àti ohun διοπετές
  choice: A gbé ọ̀rọ̀ ìṣògo ìlú àti ẹ̀sìn náà kalẹ̀ tààrà gẹ́gẹ́ bí olùsọ ṣe sọ ọ́, láì fi hàn pé akọ̀wé Ìwé Mímọ́ fọwọ́ sí i.
  alternative: ‘òkúta mímọ́ tí ó jábọ́ láti ojú ọ̀run’ tàbí ‘ohun tí ó jábọ́ láti ọ̀dọ̀ Zeus’
  rationale: Ẹsẹ náà ń ròyìn ọ̀rọ̀ akọ̀wé ìlú, kì í ṣe ìmúdájú pé ère náà jábọ́ láti ọ̀run ní tòótọ́. ‘Ère’ ṣàlàyé ohun tí ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí, ṣùgbọ́n àlàyé [b] jẹ́ kí òǹkàwé mọ àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Akọ̀wé ìlú’ yà ipa ìṣàkóso náà sọ́tọ̀ kúrò nínú ìtumọ̀ akọ̀wé ẹ̀sìn; ‘Ẹ̀yin ọkùnrin’ sì pa ìpè akọ inú orísun mọ́.
