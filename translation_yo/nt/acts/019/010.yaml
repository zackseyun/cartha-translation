id: ACT.19.10
reference: Acts 19:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: yo
  text: Èyí sì ń bá a lọ fún ọdún méjì, tó fi jẹ́ pé gbogbo àwọn tó ń gbé ní Éṣíà[a] gbọ́ ọ̀rọ̀ Olúwa, àwọn Júù àti àwọn Gíríìkì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni ẹkùn ìṣàkóso Róòmù ti Éṣíà ní apá ìwọ̀-oòrùn Éṣíà Kékeré, kì í ṣe ilẹ̀ ńlá Éṣíà ti òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Èyí sì ń bá a lọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ètò ìkọ́ni tó ń lọ nínú ẹsẹ tó ṣáájú; gbólóhùn yìí fi hàn lọ́nà àdánidá pé ó tẹ̀ síwájú fún àkókò kan.
- source_word: ἐπὶ ἔτη δύο
  choice: fún ọdún méjì
  rationale: ἐπί pẹ̀lú ọ̀rọ̀ àkókò níbí ń sọ bí ìṣe náà ṣe pé tó; ‘fún ọdún méjì’ ni ọ̀nà Yorùbá tó ṣe kedere jù.
- source_word: ὥστε
  choice: tó fi jẹ́ pé
  rationale: Ó mú àbájáde ohun tó ṣáájú wọlé, ó sì bá ìtumọ̀ resultative ti ὥστε mu.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: gbogbo àwọn tó ń gbé ní Éṣíà
  rationale: Ó pa ìtẹnumọ́ πάντας mọ́, ó sì tú participle κατοικοῦντας sí Yorùbá àdánidá.
- source_word: ἀκοῦσαι
  choice: gbọ́
  rationale: Ìtumọ̀ tààrà ti ọ̀rọ̀ náà ni ‘gbọ́’; kò fi àlàyé míì tí kò sí nínú Gíríìkì kún un.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀
  rationale: ‘Ọ̀rọ̀’ pa àṣà ọ̀rọ̀ Lúùkù mọ́, níbi tí λόγος ti ń tọ́ka sí iṣẹ́ ìkéde ìhìn rere.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Genitive náà ń ṣàlàyé ẹni tí ọ̀rọ̀ náà jẹ́ tirẹ̀; ‘ọ̀rọ̀ Olúwa’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì níyì.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: àwọn Júù àti àwọn Gíríìkì
  rationale: Ó pa ìṣọ̀kan àwọn ẹgbẹ́ méjèèjì tí τε καὶ fi hàn mọ́ láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘Éṣíà’
  choice: Ẹkùn ìṣàkóso Róòmù ti Éṣíà ní apá ìwọ̀-oòrùn Éṣíà Kékeré
  alternative: Ilẹ̀ ńlá Éṣíà ti òde òní
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, Ἀσία sábà máa ń tọ́ka sí ẹkùn ìṣàkóso Róòmù. A pa orúkọ náà mọ́ nínú ẹsẹ, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì níyì. A gbé àmì àlàyé [a] lẹ́yìn ‘Éṣíà,’ nítorí ibẹ̀ ni àlàyé náà kan.
