  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan pẹ̀lú lára àwọn Júù tí ń rìn káàkiri láti máa lé ẹ̀mí búburú jáde gbìyànjú láti pe orúkọ Olúwa Jésù sórí àwọn tí ó ní àwọn ẹ̀mí búburú[a]. Wọ́n wí pé, “Mo fi Jésù, ẹni tí Páùlù ń kéde, bù yín[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní gígùn: “àwọn tí ó ní àwọn ẹ̀mí búburú”; èyí ni àwọn ènìyàn tí àwọn ẹ̀mí búburú ń darí tàbí ń pọ́n lójú.'
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Mo fi Jésù dè yín nípa ìbúra” tàbí “Mo fi Jésù pàṣẹ fún yín lọ́nà mímọ́.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ “ń kéde” sí “ń wàásù nípa rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: gbìyànjú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n dáwọ́ lé iṣẹ́ náà tàbí wọ́n gbìyànjú láti ṣe é; ‘gbìyànjú’ jẹ́ èdè Yorùbá àdánidá, ó sì kò sọ pé wọ́n ṣàṣeyọrí.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: àwọn kan pẹ̀lú lára àwọn Júù tí ń rìn káàkiri láti máa lé ẹ̀mí búburú jáde
  rationale: ‘Àwọn kan pẹ̀lú’ pa ìtumọ̀ τινες καὶ mọ́; ‘tí ń rìn káàkiri’ ṣàfihàn περιερχομένων, gbolohun ‘láti máa lé ẹ̀mí búburú jáde’ sì ṣàlàyé ἐξορκιστῶν ní Yorùbá òde òní láìlo orúkọ iṣẹ́ tí kò wọ́pọ̀.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: pe orúkọ ... sórí
  rationale: Nínú àyíká yìí, kì í ṣe kíkàn dárúkọ Jésù lásán, bí kò ṣe lílo orúkọ rẹ̀ gẹ́gẹ́ bí ọ̀nà láti lé ẹ̀mí jáde. ‘Pe orúkọ ... sórí’ pa àwòrán àti ìtumọ̀ Gíríìkì mọ́.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: àwọn tí ó ní àwọn ẹ̀mí búburú
  rationale: Èyí tẹ̀ lé ìtumọ̀ gígùn pé ‘àwọn tí ó ní àwọn ẹ̀mí búburú,’ láìfi ọ̀rọ̀ tó lágbára jù ú bí ‘àwọn tí ẹ̀mí búburú ti gbà ní ìkápá’ kún un.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: orúkọ Olúwa Jésù
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ κύριος tó yẹ nínú àkọlé Kristi yìí, gbolohun náà sì jẹ́ mímọ́ àti àdánidá ní Yorùbá.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: Mo fi Jésù ... mú yín búra
  rationale: ὁρκίζω níbí jẹ́ fífi ẹni tí a ń bá sọ̀rọ̀ sábẹ́ ìbúra tàbí àṣẹ mímọ́ nípasẹ̀ orúkọ Jésù. ‘Mo fi Jésù mú yín búra’ pa ìrísí ìbúra náà mọ́ ju ‘mo pàṣẹ fún yín’ lọ.
- source_word: ὃν Παῦλος κηρύσσει
  choice: tí Páùlù ń kéde
  rationale: κηρύσσει túmọ̀ sí pípolongo ní gbangba; ‘ń kéde’ jẹ́ kedere, ó sì gbòòrò ju ọ̀rọ̀ tó lè tọ́ka sí ìwàásù inú ìjọ nìkan lọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jésù
  alternative: Ọ̀gá Jésù
  rationale: ‘Olúwa’ pa ọlá àti ìwọ̀n ẹ̀kọ́ nípa Kristi tí àkọlé náà ní nínú Ìṣe àwọn Aposteli mọ́; ‘Ọ̀gá’ kò tó ìwọ̀n yẹn ní àyíká yìí.
- issue: Bóyá kí a sọ ìgbàlódé ẹ̀mí búburú ní pàtó nínú τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: àwọn tí ó ní àwọn ẹ̀mí búburú
  alternative: àwọn tí ẹ̀mí búburú ti gbà ní ìkápá
  rationale: Gíríìkì sọ ní gígùn pé wọ́n ‘ní’ ẹ̀mí búburú. Ìtumọ̀ àkọ́kọ́ pa àìsọ pàtó yẹn mọ́, kò sì fi àlàyé ẹ̀kọ́ tàbí ìṣàpèjúwe tó lágbára jù orísun lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó níyì, tó ṣe kedere fún òǹkàwé lasán. A lo àlàyé àdánidá fún ἐξορκισταί dípò ọ̀rọ̀ iṣẹ́ àjèjì tàbí ọ̀rọ̀ ẹ̀sìn tó ṣòro. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì pa ìrísí ìbúra àti àìsọ pàtó nípa ipò àwọn tó ní ẹ̀mí búburú mọ́.
