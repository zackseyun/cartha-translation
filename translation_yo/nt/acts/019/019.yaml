- from: Ọ̀pọ̀ lára àwọn tí wọ́n ti ń ṣe iṣẹ́ idán sì kó àwọn ìwé wọn jọ, wọ́n sì ń sun wọ́n níwájú gbogbo ènìyàn[a]. Wọ́n sì ṣírò iye owó wọn, wọ́n rí i pé ó jẹ́ ẹgbàárùn-ún owó fàdákà[b].
  to: Ọ̀pọ̀ lára àwọn tí wọ́n ti ń ṣe iṣẹ́ idán sì kó àwọn ìwé wọn jọ, wọ́n sì ń sun wọ́n níwájú gbogbo ènìyàn[a]; wọ́n sì ṣírò iye owó àwọn ìwé náà, wọ́n rí i pé ó jẹ́ àádọ́ta ẹgbẹ̀rún owó fàdákà[b].
