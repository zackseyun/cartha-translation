source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: yo
  text: Ọ̀pọ̀ lára àwọn tí wọ́n ti ń ṣe iṣẹ́ idán sì kó àwọn ìwé wọn jọ, wọ́n sì ń sun wọ́n níwájú gbogbo ènìyàn[a]; wọ́n sì ṣírò iye owó àwọn ìwé náà, wọ́n rí i pé ó jẹ́ àádọ́ta ẹgbẹ̀rún owó fàdákà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ òkùnkùn.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí àwọn ohun “àràmàǹdà” tàbí “àkànṣe,” ṣùgbọ́n nínú àyíká yìí ó ń tọ́ka sí iṣẹ́ idán.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹgbẹ̀rún mẹ́wàá márùn-ún ti fàdákà,” ìyẹn àádọ́ta ẹgbẹ̀rún owó fàdákà. A kò sọ irú ẹyọ owó náà pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: Ọ̀pọ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí iye ènìyàn tí ó pọ̀, kì í ṣe pé wọ́n kàn tó fún ohun kan.
- source_word: τὰ περίεργα πραξάντων
  choice: àwọn tí wọ́n ti ń ṣe iṣẹ́ idán
  rationale: Nínú àyíká ẹsẹ̀ yìí, gbólóhùn náà túmọ̀ sí ṣíṣe idán tàbí iṣẹ́ òkùnkùn, kì í ṣe ìṣe àjèjì lásán.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: kó àwọn ìwé wọn jọ
  rationale: Èyí fi hàn pé wọ́n mú àwọn ìwé náà wá sí ibi kan kí wọ́n tó sun wọ́n; ‘wọn’ jẹ́ àfikún tí àyíká ọ̀rọ̀ fi yé wa.
- source_word: κατέκαιον
  choice: wọ́n sì ń sun wọ́n
  rationale: Àkókò imperfect Gíríìkì fi ìṣe tí ó ń lọ lọ́wọ́ hàn, èyí tí ‘ń sun’ mú jáde ní Yorùbá.
- source_word: ἐνώπιον πάντων
  choice: níwájú gbogbo ènìyàn
  rationale: Ó tẹnumọ́ pé wọ́n ṣe é ní gbangba, ní ojú gbogbo ènìyàn.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: Wọ́n sì ṣírò iye owó wọn
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ṣíṣírò àpapọ̀, τιμή sì ń tọ́ka sí iye owó àwọn ìwé náà.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: ẹgbàárùn-ún owó fàdákà
  rationale: Mυριάδας πέντε jẹ́ ẹgbẹ̀rún mẹ́wàá ní ìgbà márùn-ún, ìyẹn ẹgbàárùn-ún; ‘owó fàdákà’ kò sọ irú ẹyọ owó kan pàtó, bí Gíríìkì náà kò ṣe sọ ọ́.
theological_decisions:
- issue: Ìtumọ̀ τὰ περίεργα nínú àyíká Éfésù
  choice: iṣẹ́ idán
  alternative: iṣẹ́ òkùnkùn; àwọn iṣẹ́ àràmàǹdà
  rationale: Àyíká tó sún mọ́ ẹsẹ̀ náà sọ̀rọ̀ nípa àwọn olùlé ẹ̀mí búburú, àwọn ẹ̀mí búburú, àti àwọn ìwé idán olówó iyebíye. ‘Iṣẹ́ idán’ sọ ìṣe ìtàn-ẹ̀sìn náà ní kedere láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè àdánidá, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A pa àwòrán ìṣe tó ń lọ nínú κατέκαιον mọ́ pẹ̀lú ‘ń sun,’ a sì yẹra fún fífi orúkọ ẹyọ owó kan tí orísun kò sọ kún un.
