  verdict: revise
  source_fidelity: The draft accurately conveys the substantial number of former practitioners, the public gathering and burning of the books, and the stated total. However, ‘iye owó wọn’ can naturally mean the people’s own amount of money rather than the monetary value of the books. The numerical expression should be made unambiguously fifty thousand.
  naturalness: The Yoruba is generally natural and well marked for tone. ‘Ṣírò iye owó àwọn ìwé náà’ is clearer and more idiomatic in this context, and ‘àádọ́ta ẹgbẹ̀rún’ plainly expresses 50,000.
  terminology: ‘Iṣẹ́ idán’ is a suitable, neutral rendering of τὰ περίεργα in this context. ‘Owó fàdákà’ appropriately avoids specifying an unstated denomination.
  issues:
  - severity: medium
    issue: Ambiguous antecedent in ‘Wọ́n sì ṣírò iye owó wọn.’
    rationale: The Greek αὐτῶν refers to the books, whose prices/value were calculated. In Yoruba, ‘owó wọn’ may be read as the practitioners’ money. Naming the books preserves the source sense.
  - severity: medium
    issue: ‘Ẹgbàárùn-ún’ is not a sufficiently transparent rendering of the stated total.
    rationale: The source explicitly gives five myriads, namely 50,000. ‘Àádọ́ta ẹgbẹ̀rún’ is clear Standard Yoruba and retains the exact total.
