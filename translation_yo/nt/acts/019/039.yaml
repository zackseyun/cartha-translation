id: ACT.19.39
reference: Acts 19:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá ń wá ohunkóhun sí i, a óò yanjú rẹ̀ ní àpéjọ tí ó bá òfin mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àpéjọ tí òfin fọwọ́ sí,” tàbí “ní àpéjọ tí a máa ń ṣe déédéé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìpéjọ ará ìlú tí a dá sílẹ̀ ní ìbámu pẹ̀lú òfin, kì í ṣe ìjọ àwọn Kristẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: sí i
  rationale: Ó tọ́ka sí ohun àfikún tàbí ohun tí ó kọjá ọ̀ràn tó wà lọ́wọ́; ‘sí i’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtumọ̀ ìfiwéra náà mọ́.
- source_word: ἐπιζητεῖτε
  choice: ẹ bá ń wá
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí wíwá, wíwádìí nípa, tàbí lílépa ọ̀ràn kan. ‘Ń wá’ pa ìtumọ̀ rẹ̀ gbooro mọ́ láìfi agbára tàbí ìtumọ̀ òfin tí kò ṣe dandan kún un.
- source_word: ἐννόμῳ
  choice: tí ó bá òfin mu
  rationale: Ó túmọ̀ sí ohun tí ó wà ní ìbámu pẹ̀lú òfin; gbólóhùn yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ἐκκλησίᾳ
  choice: àpéjọ
  rationale: Ní àyíká yìí, ó ń tọ́ka sí ìpéjọ ará ìlú tí a dá sílẹ̀ gẹ́gẹ́ bí òfin, kì í ṣe ìjọ àwọn Kristẹni. ‘Àpéjọ’ pa ìtumọ̀ ìkójọpọ̀ àwọn ènìyàn mọ́ láìmú ìtumọ̀ ṣọ́ọ̀ṣì wọlé.
- source_word: ἐπιλυθήσεται
  choice: a óò yanjú rẹ̀
  rationale: Ọ̀rọ̀ ọjọ́ iwájú tí ó ní ìtumọ̀ pé a óò mú ọ̀ràn náà dé òpin tàbí yanju rẹ̀. Ìtumọ̀ Yorùbá yìí jẹ́ àdánidá nínú àyíká ìlànà ìjọba àti òfin.
- source_word: τι
  choice: ohunkóhun
  rationale: Arọ́pò-orúkọ àìsọ pàtó nínú gbólóhùn oníṣ条件; ‘ohunkóhun’ fi ọ̀nà sílẹ̀ fún ọ̀ràn àfikún èyíkéyìí.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία ní àyíká tí kì í ṣe ti ìjọ Kristẹni
  choice: àpéjọ
  alternative: ìjọ; ìpàdé
  rationale: Ohun tí ọ̀rọ̀ náà ń tọ́ka sí níbí ni ìpéjọ ará ìlú Éfésù tí òfin fọwọ́ sí, kì í ṣe àwùjọ àwọn Kristẹni. ‘Àpéjọ’ yẹ fún àyíká náà, ó sì yẹra fún ìtumọ̀ ẹ̀sìn tí kò sí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí olùkọ̀wé ń bá sọ̀rọ̀, a sì lo ‘àpéjọ’ láti yà ìpéjọ ará ìlú sọ́tọ̀ kúrò nínú ìjọ Kristẹni.
