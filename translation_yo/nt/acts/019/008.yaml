id: ACT.19.8
reference: Acts 19:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: yo
  text: Ó sì wọ inú sínágọ́gù, ó ń fi ìgboyà sọ̀rọ̀ fún oṣù mẹ́ta, ó ń bá wọn jíròrò, ó sì ń yí wọn lójú[a] nípa ìjọba Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń gbìyànjú láti yí wọn lójú nípa ìjọba Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: Ó sì wọ inú
  rationale: Aorist participle náà ń fi ìṣẹ̀lẹ̀ yíyọ wọlé ṣe àyíká fún ọ̀rọ̀-ìṣe pàtàkì; “Ó sì wọ inú” jẹ́ ọ̀nà Yorùbá àdánidá láti tẹ̀síwájú nínú ìtàn.
- source_word: τὴν συναγωγήν
  choice: sínágọ́gù
  rationale: Ọ̀rọ̀ náà tọ́ka sí ibi ìpàdé àti ìjọsìn àwọn Júù; lílo ọ̀rọ̀ tí a ti mọ̀ yìí pa ìtumọ̀ pàtó rẹ̀ mọ́.
- source_word: ἐπαρρησιάζετο
  choice: ó ń fi ìgboyà sọ̀rọ̀
  rationale: Imperfect náà fi hàn pé ó ń bá a lọ láti sọ̀rọ̀ ní gbangba, láìbẹ̀rù; àmì “ń” pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: fún oṣù mẹ́ta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún àkókò tí ìṣe kan fi ń lọ.
- source_word: διαλεγόμενος
  choice: ó ń bá wọn jíròrò
  rationale: “Jíròrò” mú ìfọ̀rọ̀wérọ̀, àlàyé, àti fífi ẹ̀rí ronú pọ̀, láìsọ ọ́ di àríyànjiyàn líle.
- source_word: πείθων
  choice: ó sì ń parí wọn lọ́kàn
  rationale: Gbólóhùn yìí sọ ìsapá láti mú àwọn olùgbọ́ gbà ohun tí a ń sọ, ó sì jẹ́ Yorùbá àdánidá; a fi ẹni tí ìṣe náà kan, “wọn,” hàn bí àyíká ṣe ń béèrè.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: nípa ìjọba Ọlọ́run
  rationale: “Nípa” bá περί pẹ̀lú genitive mu, “ìjọba Ọlọ́run” sì pa gbólóhùn ẹ̀kọ́ pàtàkì náà mọ́ láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
theological_decisions:
- issue: Ohun tí πείθων ń ṣe sí ni a kò sọ ní gbangba nínú Gíríìkì.
  choice: 'A fi “wọn” sínú ọ̀rọ̀ náà: “ó sì ń parí wọn lọ́kàn.”'
  alternative: “ó sì ń parí lọ́kàn nípa ìjọba Ọlọ́run”
  rationale: Èdè Yorùbá máa ń fẹ́ kí ẹni tí a ń parí lọ́kàn hàn; àwọn olùgbọ́ inú sínágọ́gù ni àyíká ń tọ́ka sí, nítorí náà èyí kì í fi èrò tuntun kún ẹsẹ̀ náà.
- issue: πείθων lè tẹnumọ́ ìṣe ìparíni-lọ́kàn láìjẹ́rìí pé gbogbo wọn gba ọ̀rọ̀ náà.
  choice: “ó sì ń parí wọn lọ́kàn” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
  alternative: “ó sì ń gbìyànjú láti mú wọn gbàgbọ́”
  rationale: A kò gbọdọ̀ sọ pé ó ṣàṣeyọrí sí gbogbo wọn, bẹ́ẹ̀ ni a kò gbọdọ̀ fi ọ̀rọ̀ “gbìyànjú” sínú Gíríìkì bí ẹni pé àìṣeyọrí ni a tẹnumọ́; àlàyé ìsàlẹ̀ pa ìyàtọ̀ náà mọ́.
- issue: βασιλεία τοῦ θεοῦ lè túmọ̀ sí ìjọba, ìṣàkóso, tàbí ìjọba-aláṣẹ Ọlọ́run.
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” jẹ́ ìtumọ̀ tí ó péye, tí ó sì mọ̀ọ́mọ̀ gbòòrò tó láti gba ìṣàkóso àti agbára ọba Ọlọ́run, láìdín ọ̀rọ̀ Gíríìkì náà kù sí apá kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì pa ìṣàn imperfect Gíríìkì mọ́ nípasẹ̀ “ń” nínú àwọn ìṣe tí ó ń bá a lọ.
