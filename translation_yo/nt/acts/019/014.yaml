source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: yo
  text: Àwọn ọmọkùnrin méje ti Síkéfà kan, olórí àlùfáà Júù, sì wà tí wọ́n ń ṣe èyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àlùfáà Àgbà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí Àlùfáà Àgbà, tàbí ní ìtumọ̀ gbooro sí olórí àlùfáà tàbí ọ̀kan nínú àwọn olórí àlùfáà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Àwọn ... sì wà
  rationale: Ó tú imperfect εἰμί pẹ̀lú δέ gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn, láìfi ìtakò tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τινος Σκευᾶ
  choice: ọmọ Síkéfà ni wọ́n
  rationale: Genitive náà fi hàn pé àwọn méje náà jẹ́ ọmọ ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Síkéfà; àtòjọ gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, nígbà tí àìsọ pàtó τινος tún fara hàn nínú ‘... kan.’
- source_word: Ἰουδαίου
  choice: Júù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn, kì í ṣe ibi tí ẹni náà ti wá nìkan.
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Ó pa ìtumọ̀ gbooro ti ẹni pàtàkì nínú ẹgbẹ́ àwọn àlùfáà mọ́, láìjẹ́rìí dájú pé Síkéfà ni Àlùfáà Àgbà kan ṣoṣo ní Jerúsálẹ́mù.
- source_word: ἑπτὰ υἱοὶ
  choice: Àwọn ọmọkùnrin méje
  rationale: Ìtumọ̀ tààrà tí ó sì bójú mu ní Yorùbá fún nọ́ńbà àti ìbátan ẹbí náà.
- source_word: τοῦτο ποιοῦντες
  choice: tí wọ́n ń ṣe èyí
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn, ‘èyí’ sì pa demonstrative singular τοῦτο mọ́, ó ń tọ́ka sí ìṣe tí ẹsẹ tó ṣáájú sọ.
theological_decisions:
- issue: Ìtumọ̀ ἀρχιερεύς nípa Síkéfà
  choice: olórí àlùfáà
  alternative: Àlùfáà Àgbà
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí Àlùfáà Àgbà tàbí ẹni kan nínú àwọn olórí ẹgbẹ́ àlùfáà. Nítorí a kò mọ Síkéfà gẹ́gẹ́ bí Àlùfáà Àgbà kan ṣoṣo ní Jerúsálẹ́mù, ‘olórí àlùfáà’ yẹra fún fífi ipò pàtó tí ẹ̀rí kò fi múlẹ̀ lé e lórí, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé lasán. Semicolon náà yà ìṣe àwọn ọmọ náà sílẹ̀ kúrò nínú ìdánimọ̀ baba wọn, kí gbólóhùn má bàa dà bí ẹni pé Síkéfà fúnra rẹ̀ ni ó ń ṣe ìṣe náà.
