  source_fidelity: Ìtumọ̀ náà pa iye púpọ̀, perfect participle náà (‘àwọn tí ó ti gbàgbọ́’), àti ìṣe imperfect ‘ń bọ̀’ mọ́ dáadáa. Ṣùgbọ́n ‘ní gbangba’ jẹ́ àfikún tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà; bí ó tilẹ̀ jẹ́ pé ἀναγγέλλω lè ní ìmọ̀lára ìkéde, àfikún náà mú kí ìtumọ̀ náà ní ìdíwọ̀n pàtó ju ohun tí a kọ sílẹ̀ lọ. ‘Àwọn ìṣe wọn’ sì jẹ́ ìbámu tó sunmọ̀ sí τὰς πράξεις αὐτῶν ju ‘àwọn ohun tí wọ́n ti ń ṣe’ lọ, èyí tí ó fi ìṣe tí ń lọ lọwọ̀ kún un láìsí dandan.
