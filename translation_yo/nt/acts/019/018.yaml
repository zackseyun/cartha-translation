id: ACT.19.18
reference: Acts 19:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: yo
  text: Ọ̀pọ̀ àwọn tí ó ti gbàgbọ́ sì ń bọ̀, wọ́n ń jẹ́wọ́, wọ́n sì ń sọ̀rọ̀ nípa àwọn ìṣe wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ohun tí wọ́n ti ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί
  choice: Ọ̀pọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣókí láti fi iye púpọ̀ hàn.
- source_word: τε
  choice: sì
  rationale: “Sì” so gbólóhùn náà mọ́ ìtàn tó ṣáájú pẹ̀lú agbára ìtẹ̀síwájú kékeré.
- source_word: τῶν πεπιστευκότων
  choice: àwọn tí ó ti gbàgbọ́
  rationale: '“Ó ti gbàgbọ́” pa ìtumọ̀ perfect participle mọ́: ìgbàgbọ́ ti bẹ̀rẹ̀ ṣáájú, ipò rẹ̀ sì ń bá a lọ.'
- source_word: ἤρχοντο
  choice: ń bọ̀
  rationale: Àmì “ń” fi ìṣe tí ń lọ lọ́wọ́ tàbí tí ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: ἐξομολογούμενοι
  choice: wọ́n ń jẹ́wọ́
  rationale: “Jẹ́wọ́” túmọ̀ sí gbígbà tàbí jíjẹ́wọ́ ohun kan láìfi kún un pé ẹ̀ṣẹ̀ nìkan ni wọ́n ń jẹ́wọ́.
- source_word: ἀναγγέλλοντες
  choice: wọ́n sì ń sọ ... ní gbangba
  rationale: Gbólóhùn yìí fi ìtumọ̀ sísọ ohun kan di mímọ̀ tàbí ṣíṣí i payá hàn, ó sì yàtọ̀ lọ́nà àdánidá sí “jẹ́wọ́.”
- source_word: τὰς πράξεις αὐτῶν
  choice: àwọn ohun tí wọ́n ti ń ṣe
  rationale: Ó pa ààyè ìtumọ̀ πρᾶξις mọ́ láàárín àwọn ìṣe àti àwọn àṣà ìṣe tí wọ́n ti máa ń ṣe, láìdín un kù sí “ẹ̀ṣẹ̀” tàbí iṣẹ́ oṣó nìkan.
theological_decisions:
- issue: Bóyá πεπιστευκότων yẹ kí ó jẹ́ orúkọ ẹgbẹ́ kan (“àwọn onígbàgbọ́”) tàbí àpèjúwe ìṣe tó ti ṣẹlẹ̀ ṣáájú tí ipa rẹ̀ ń bá a lọ.
  choice: àwọn tí ó ti gbàgbọ́
  alternative: àwọn onígbàgbọ́; àwọn tí ó gbàgbọ́
  rationale: Ìtumọ̀ yìí tẹ̀ lé perfect participle, kò sì sọ ọ́ di orúkọ ìjọ tàbí ẹgbẹ́ lọ́nà tí Gíríìkì kò fi dandan béèrè.
- issue: Bóyá τὰς πράξεις αὐτῶν tọ́ka sí ẹ̀ṣẹ̀, iṣẹ́ oṣó, tàbí àwọn ìṣe wọn ní gbogbogbòò.
  choice: àwọn ohun tí wọ́n ti ń ṣe
  alternative: àwọn ìṣe wọn; àwọn àṣà ìṣe wọn; àwọn ẹ̀ṣẹ̀ wọn
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí iṣẹ́ idán, ṣùgbọ́n πρᾶξις gbòòrò ju “ẹ̀ṣẹ̀” tàbí “iṣẹ́ oṣó” lọ; ìtumọ̀ yìí pa ìmọ̀lára àyíká àti àìdánilójú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn ìṣe tí ń lọ lọ́wọ́ ni “ń bọ̀,” “ń jẹ́wọ́,” àti “ń sọ” fi hàn.
