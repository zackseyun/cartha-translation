  to: Ọ̀pọ̀ àwọn tí ó ti gbàgbọ́ sì ń bọ̀, wọ́n ń jẹ́wọ́, wọ́n sì ń sọ̀rọ̀ nípa àwọn ìṣe wọn[a].
