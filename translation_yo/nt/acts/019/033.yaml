translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A pa ìyàtọ̀ ὄχλος/δῆμος mọ́ gẹ́gẹ́ bí ‘ogunlọ́gọ̀’ àti ‘ìpéjọpọ̀.’
