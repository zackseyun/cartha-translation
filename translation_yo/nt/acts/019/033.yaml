  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: yo
  text: Wọ́n sì mú Alẹkisáńdà wá síwájú láti inú ogunlọ́gọ̀ náà[a], níwọ̀n bí àwọn Júù ti mú un wá síwájú; Alẹkisáńdà sì fi ọwọ́ rẹ̀ ṣe àmì, ó fẹ́ sọ ọ̀rọ̀ àgbèjà sí ìpéjọpọ̀ náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n gbé Alẹkisáńdà síwájú ... àwọn Júù ti gbé e síwájú.” Ọ̀rọ̀-ìṣe méjì tí ó jọra ni èdè Gíríìkì lò fún mímú Alẹkisáńdà wá sí iwájú ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí àwọn ará ìlú náà.” Ọ̀rọ̀ tí a lò níhìn-ín ní ìtumọ̀ àwọn ará ìlú tí ó péjọ ní gbangba, ó sì yàtọ̀ sí “ogunlọ́gọ̀” ní ìbẹ̀rẹ̀ ẹsẹ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: mú ... wá síwájú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí mímú Alẹkisáńdà jáde láti inú ogunlọ́gọ̀ wá sí iwájú ní gbangba, kì í ṣe sí kíkọ́ni tàbí fífúnni ní ìmọ̀ràn.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: nítorí àwọn Júù ti ti í síwájú
  rationale: Gbólóhùn olùrànlọ́wọ́ yìí ṣàlàyé bí Alẹkisáńdà ṣe dé iwájú. ‘Ti í síwájú’ fi ipa ìṣẹ̀lẹ̀ gbangba hàn láì sọ pé wọ́n fi ipá líle ṣe é.
- source_word: κατασείσας τὴν χεῖρα
  choice: ṣàpẹẹrẹ pẹ̀lú ọwọ́ rẹ̀
  rationale: Èyí jẹ́ ìfarahàn ọwọ́ láti gba àfiyèsí àwọn ènìyàn; a kò fi ‘kí wọ́n dákẹ́’ kún un, nítorí bí ó tilẹ̀ ṣe ṣeé ṣe, kò fara hàn gbangba nínú Gíríìkì.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: ó fẹ́ sọ ọ̀rọ̀ àgbèjà
  rationale: ‘Ó fẹ́’ pa èrò tàbí ìfẹ́ mọ́, kì í sọ pé ó parí ọ̀rọ̀ náà; ‘ọ̀rọ̀ àgbèjà’ sì bá ìtumọ̀ ìdáhùn gbangba tàbí ti ẹjọ́ mu.
- source_word: τῷ δήμῳ
  choice: fún ìpéjọpọ̀ náà
  rationale: δῆμος ní ìtumọ̀ àwọn ará ìlú tí ó péjọ ní gbangba; ‘ìpéjọpọ̀’ yà á sọ́tọ̀ kúrò lọ́dọ̀ ὄχλος, ‘ogunlọ́gọ̀,’ ní ìbẹ̀rẹ̀ ẹsẹ náà.
- source_word: ὄχλου
  choice: ogunlọ́gọ̀
  rationale: Èyí túmọ̀ sí ọ̀pọ̀ ènìyàn tí ó kóra jọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘crowd.’
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alẹkisáńdà
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró àti àkọtọ̀ Yorùbá.
