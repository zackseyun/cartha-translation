revisions:
- from: Àwọn kan láti inú ogunlọ́gọ̀ náà sì mú Alẹkisáńdà wá síwájú[a], nítorí àwọn Júù ti ti í síwájú; Alẹkisáńdà sì ṣàpẹẹrẹ pẹ̀lú ọwọ́ rẹ̀, ó fẹ́ sọ ọ̀rọ̀ àgbèjà fún ìpéjọpọ̀ náà.[b]
  to: Wọ́n sì mú Alẹkisáńdà wá síwájú láti inú ogunlọ́gọ̀ náà[a], níwọ̀n bí àwọn Júù ti mú un wá síwájú; Alẹkisáńdà sì fi ọwọ́ rẹ̀ ṣe àmì, ó fẹ́ sọ ọ̀rọ̀ àgbèjà sí ìpéjọpọ̀ náà.[b]
  rationale: Àtúnṣe náà yọ ìfikún olùṣe tí kò sí nínú orísun kúrò, ó rọ́pò ọ̀rọ̀ tí kò tọ́ fún ìfarahàn ọwọ́, ó sì gbe àmì ẹsẹ̀-àlàyé b sí ibi tí ó bá ọ̀rọ̀ δῆμος mu. A tún lo ‘níwọ̀n bí’ láti fi ipa àlàyé ti genitive absolute hàn láì sọ pé ìṣẹ̀lẹ̀ náà jẹ́ ìpìlẹ̀ àkókò nìkan.
