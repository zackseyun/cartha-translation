revisions:
- from: Paulu sì wí pé, “Jòhánù ṣe ìrìbọmi ìrònúpìwàdà fún àwọn ènìyàn,[a] ó sì sọ fún wọn pé kí wọ́n gba ẹni tí ń bọ̀ lẹ́yìn òun gbọ́—ìyẹn ni Jésù.”
  to: Paulu sì wí pé, “Jòhánù ṣe ìrìbọmi ìrònúpìwàdà[a], ó ń sọ fún àwọn ènìyàn pé kí wọ́n gba ẹni tí ń bọ̀ lẹ́yìn rẹ̀ gbọ́—ìyẹn ni, Jésù.”
