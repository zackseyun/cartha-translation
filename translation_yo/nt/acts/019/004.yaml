  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ̀ náà wá dáadáa: ìrìbọmi Jòhánù jẹ́ ti ìrònúpìwàdà, ó sì kéde pé kí àwọn ènìyàn gba ẹni tó ń bọ̀ lẹ́yìn rẹ̀ gbọ́; ẹni náà ni Jésù. Síbẹ̀, ‘fún àwọn ènìyàn’ nínú gbolohun ìrìbọmi lè dà bí apá kan ti ìkọ́sẹ̀ Gíríìkì, nígbà tí τῷ λαῷ jẹ́ alágbàṣe ọrọ̀-ìṣe λέγων (‘ó ń sọ fún àwọn ènìyàn’). Àlàyé ìsàlẹ̀ náà tún fi ‘àwọn ènìyàn’ kún ìtumọ̀ pẹ́kípẹ́kí, bí kò tilẹ̀ sí nínú ìkọ́sẹ̀ cognate náà.'
  naturalness: Ẹ̀dà tí a ṣàtúnṣe jẹ́ Yorùbá boṣewa, ó sì ṣàn dáadáa. ‘Ó ń sọ fún àwọn ènìyàn’ fi ipa participle λέγων hàn ní ti ẹ̀dá Yorùbá. ‘Lẹ́yìn rẹ̀’ jẹ́ ọ̀nà tí ó rọrùn, tí ó sì ṣe kedere ju ‘lẹ́yìn òun’ lọ nínú àyíká yìí.
  terminology: ‘Ìrìbọmi,’ ‘ìrònúpìwàdà,’ àti ‘gba … gbọ́’ bá ọ̀rọ̀ ẹ̀sìn Yorùbá boṣewa mu, wọ́n sì bójú mu pẹ̀lú βάπτισμα, μετανοία, àti πιστεύω εἰς. A kò fi ‘Kristi’ tàbí oyè mìíràn kún orúkọ Jésù, nítorí kò sí nínú Gíríìkì.
