id: ACT.19.4
reference: Acts 19:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: yo
  text: Paulu sì wí pé, “Jòhánù ṣe ìrìbọmi ìrònúpìwàdà[a], ó ń sọ fún àwọn ènìyàn pé kí wọ́n gba ẹni tí ń bọ̀ lẹ́yìn rẹ̀ gbọ́—ìyẹn ni, Jésù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, “Jòhánù ṣe ìrìbọmi ìrònúpìwàdà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: ṣe ìrìbọmi ìrònúpìwàdà fún àwọn ènìyàn
  rationale: Èyí sọ ọ̀rọ̀ ìpilẹ̀ ní Yorùbá àdánidá, ó sì pa ìrìbọmi mọ́ gẹ́gẹ́ bí èyí tí ìrònúpìwàdà ń ṣàpèjúwe; àlàyé ìsàlẹ̀ fi ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì pẹ́kípẹ́kí hàn.
- source_word: τῷ λαῷ
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ àkójọpọ̀ gbogbogbò; ‘àwọn ènìyàn’ kò fi kún un pé àwọn ọmọ Ísírẹ́lì nìkan ni.
- source_word: λέγων
  choice: ó sì sọ fún wọn pé
  rationale: Èyí fi hàn pé ìkéde Jòhánù bá iṣẹ́ ìrìbọmi rẹ̀ lọ, ó sì jẹ́ ọ̀nà àdánidá láti mú ọ̀rọ̀ tí ó tẹ̀ lé wọlé ní Yorùbá.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: gba ẹni tí ń bọ̀ lẹ́yìn òun gbọ́
  rationale: ‘Gba … gbọ́’ ni ọ̀nà Yorùbá àdánidá fún písteúō eis; ‘lẹ́yìn òun’ tọ́ka sí ẹni tí yóò tẹ̀ lé Jòhánù.
- source_word: ἵνα πιστεύσωσιν
  choice: pé kí wọ́n … gbọ́
  rationale: Ìṣètò yìí lè sọ àkóónú ìkìlọ̀ tàbí ète rẹ̀; Yorùbá yìí pa agbára ìtọ́ni náà mọ́ láìdi gbolohun náà rú.
- source_word: τοῦτ’ ἔστιν
  choice: ìyẹn ni
  rationale: Ọ̀nà Yorùbá tó ṣe kedere àti àdánidá fún gbólóhùn àlàyé tí ń dá ẹni tí a mẹ́nu kàn mọ̀.
- source_word: εἰς τὸν Ἰησοῦν
  choice: Jésù
  rationale: Ọ̀rọ̀-ìṣe ‘gba … gbọ́’ ṣì ń ṣiṣẹ́ nínú gbólóhùn; Gíríìkì pe orúkọ Jésù nìkan, kò sì fi oyè ‘Kristi’ kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ ìrìbọmi Jòhánù pẹ̀lú ìgbàgbọ́ nínú Jésù
  choice: A ṣàpèjúwe ìrìbọmi Jòhánù gẹ́gẹ́ bí ìrìbọmi ìrònúpìwàdà, nígbà tí ó ń sọ fún àwọn ènìyàn kí wọ́n gba ẹni tí ń bọ̀ lẹ́yìn rẹ̀ gbọ́, ẹni tí a dá mọ̀ sí Jésù.
  alternative: Kí a sọ pé ìrìbọmi Jòhánù fúnra rẹ̀ ló mú ìgbàgbọ́ Kristẹni wá, tàbí kí a má dá ẹni tí ń bọ̀ náà mọ̀.
  rationale: Ìṣètò Gíríìkì ya ìrìbọmi àti ìkéde tó bá a lọ sọ́tọ̀, nígbà tí ‘ìyẹn ni Jésù’ dá ẹni tí ń bọ̀ náà mọ̀ ní kedere. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn míì tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó yẹ. ‘Òun’ mú kí ẹni tí ‘lẹ́yìn rẹ̀’ ń tọ́ka sí—Jòhánù—ṣe kedere láìfi ohun tí orísun kò sọ kún un.
