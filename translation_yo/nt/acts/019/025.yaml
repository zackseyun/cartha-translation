  source_fidelity: Ìtumọ̀ náà mú ìtumọ̀ gbogbogbò ẹsẹ náà dáadáa, ṣùgbọ́n ìpínrọ̀ àkọ́kọ́ náà nílò kí ó fi hàn kedere pé ó kó àwọn ẹgbẹ́ méjèèjì jọ. Pẹ̀lú èyí, “ọ̀rọ̀ ajé wa” sábà máa ń tọ́ka sí ètò tàbí ipò ọrọ̀ ajé, kì í sì í fi εὐπορία, ìyẹn aásìkí/ọ̀rọ̀ ẹni, hàn dáadáa.
