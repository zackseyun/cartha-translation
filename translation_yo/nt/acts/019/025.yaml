  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: yo
  text: Lẹ́yìn tí ó kó wọ́n jọ pẹ̀lú àwọn òṣìṣẹ́ tí ń ṣiṣẹ́ nínú irú nǹkan bẹ́ẹ̀, ó sọ pé, “Ẹ̀yin ọkùnrin, ẹ mọ̀ pé láti inú iṣẹ́ òwò yìí ni a ti ní aásìkí wa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Láti inú òwò yìí ni ọrọ̀ wa ti ń wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: Ó kó wọn jọ
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist participle tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtumọ̀ yìí fi hàn ní èdè Yorùbá àdánidá pé ó kọ́kọ́ kó wọn jọ, lẹ́yìn náà ni ó bá wọn sọ̀rọ̀.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: àwọn òṣìṣẹ́ tó ń ṣe irú àwọn nǹkan bẹ́ẹ̀
  rationale: Èyí pa ìtumọ̀ gbogbogbò ti ἐργάτας mọ́ gẹ́gẹ́ bí ‘àwọn òṣìṣẹ́,’ kò sì fi kún un pé àwọn oníṣẹ́-ọnà ibùjọ ni wọ́n, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ náà fi bẹ́ẹ̀ hàn.
- source_word: Ἄνδρες
  choice: Ẹ̀yin ọkùnrin
  rationale: Àpèjúwe yìí tọ́ka sí àwọn ọkùnrin tí Demeteriu ń bá sọ̀rọ̀, ó sì bá ìtumọ̀ vocative plural ti ἀνήρ mu.
- source_word: ἐπίστασθε
  choice: ẹ mọ̀
  rationale: Ó sọ ní ọ̀nà tó ṣe déédéé ní Yorùbá pé ìmọ̀ náà ti wà lọ́wọ́ àwọn olùgbọ́.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: iṣẹ́ òwò yìí ni orísun
  rationale: Nínú àyíká ọrọ̀ ajé yìí, ἐργασία túmọ̀ sí iṣẹ́ tàbí òwò tí wọ́n fi ń jẹun; ‘iṣẹ́ òwò’ mú ìtumọ̀ náà ṣe kedere láì dín un kù sí iṣẹ́ ọwọ́ nìkan.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: ọrọ̀ ajé wa
  rationale: εὐπορία lè túmọ̀ sí ọrọ̀, aásìkí, tàbí ìrọ̀rùn nípa owó. ‘Ọrọ̀ ajé wa’ jẹ́ èdè Yorùbá tó bójú mu, tó sì pa ìtumọ̀ ìlọsíwájú nípa ọrọ̀ mọ́.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘iṣẹ́ òwò’ àti ‘ọrọ̀ ajé’ láti mú àyíká ìṣòwò hàn, nígbà tí a kò sọ irú iṣẹ́ ọnà pàtó ju ohun tí Gíríìkì ẹsẹ yìí sọ lọ.
