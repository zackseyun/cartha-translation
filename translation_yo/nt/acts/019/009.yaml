id: ACT.19.9
reference: Acts 19:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: yo
  text: 'Ṣùgbọ́n nígbà tí àwọn kan ń di ọkàn wọn le, tí wọ́n sì ń kọ̀ láti gbàgbọ́[a], tí wọ́n ń sọ ohun búburú nípa Ọ̀nà náà[b] níwájú ọ̀pọ̀ ènìyàn, Pọ́ọ̀lù kúrò lọ́dọ̀ wọn. Ó ya àwọn ọmọ-ẹ̀yìn sọ́tọ̀, ó sì ń jíròrò lójoojúmọ́ nínú gbọ̀ngàn ìkọ́nilẹ́kọ̀ọ́ Tíránù[c].


    [a] Tàbí, “tí wọ́n jẹ́ aláìgbọ́ràn,” tàbí “tí wọ́n kò gbà á gbọ́.”


    [b] “Ọ̀nà náà” ni ọ̀kan lára àwọn orúkọ tí wọ́n fi ń pe ẹgbẹ́ àwọn tó ń tẹ̀ lé Kristi ní ìgbà ìbẹ̀rẹ̀ nínú Ìṣe Àwọn Àpọ́sítélì.


    [c] Tàbí, “ilé-ẹ̀kọ́ Tíránù.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n jẹ́ aláìgbọ́ràn,” tàbí “tí wọ́n kò gbà á gbọ́.”
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀nà náà” ni ọ̀kan lára àwọn orúkọ tí wọ́n fi ń pe ẹgbẹ́ àwọn tó ń tẹ̀ lé Kristi ní ìgbà ìbẹ̀rẹ̀ nínú Ìṣe Àwọn Àpọ́sítélì.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ilé-ẹ̀kọ́ Tíránù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: ń sé ọkàn wọn le
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ ni imperfect náà fi hàn. Ọ̀rọ̀ yìí sọ pé ìdènà inú wọn ń le sí i, láìpinnu ní pàtó bóyá àwọn fúnra wọn ni wọ́n fa á tàbí ohun mìíràn.
- source_word: ἠπείθουν
  choice: kọ̀ láti gba ọ̀rọ̀ náà gbọ́
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti kíkọ̀ láti gba ìwàásù Pọ́ọ̀lù. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì dá ìtumọ̀ ‘refusing to be persuaded’ dúró; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ ‘aláìgbọ́ràn’ àti ‘kò gbàgbọ́’ mọ́.
- source_word: κακολογοῦντες
  choice: ń sọ ohun búburú nípa
  rationale: Ó ṣàpèjúwe ọ̀rọ̀ ọ̀tá tí wọ́n ń sọ ní gbangba, láìfi ìtumọ̀ òfin bí ẹ̀sùn èké kún un.
- source_word: τὴν ὁδὸν
  choice: Ọ̀nà náà
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn yìí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tí a fi mọ ẹgbẹ́ àwọn tó ń tẹ̀ lé Jésù. Lílò lẹ́tà ńlá àti àlàyé [b] jẹ́ kí iṣẹ́ rẹ̀ gẹ́gẹ́ bí orúkọ hàn.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: níwájú ọ̀pọ̀ ènìyàn
  rationale: Ó mú ìtumọ̀ pé ìtakò náà wáyé ní gbangba jáde ní Yorùbá tó ṣe kedere.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: fi wọ́n sílẹ̀
  rationale: Ó fi ìgbésẹ̀ pàtó Pọ́ọ̀lù láti kúrò lọ́dọ̀ ẹgbẹ́ alátakò náà hàn ní èdè Yorùbá àdánidá.
- source_word: ἀφώρισεν
  choice: ya ... sọ́tọ̀
  rationale: Ó pa ìtumọ̀ ìyàsọ́tọ̀ tí a mọ̀ọ́mọ̀ ṣe mọ́, dípò kí ó dà bí ìyípadà ibi nìkan.
- source_word: τοὺς μαθητάς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn olùkọ́kọ̀ọ́ tí wọ́n tún jẹ́ olùtẹ̀lé olùkọ́ wọn.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó sọ ìṣe tí ó máa ń wáyé ní gbogbo ọjọ́ ní ṣókí àti ní àdánidá.
- source_word: διαλεγόμενος
  choice: ń bá wọn fèrò wérò
  rationale: Ó fi ìjíròrò onírònú àti ìṣàlàyé tó ń gbìyànjú láti yí ọkàn ènìyàn padà hàn, láìsọ ọ́ di àríyànjiyàn líle nìkan.
- source_word: σχολῇ
  choice: gbọ̀ngàn ìkọ́nilẹ́kọ̀ọ́
  rationale: Nínú àyíká yìí, ó tọ́ka sí ibi tí olùkọ́ ti ń kọ́ni tàbí ti ń sọ àsọyé. Àlàyé [c] pa ìtumọ̀ ‘ilé-ẹ̀kọ́’ mọ́.
- source_word: Τυράννου
  choice: Tíránù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìbámu pẹ̀lú ìró àti àkọtọ̀ Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ‘Ọ̀nà náà’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ kan
  choice: A kọ ‘Ọ̀nà’ pẹ̀lú lẹ́tà ńlá, a sì ṣàlàyé rẹ̀ gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ àwọn tó ń tẹ̀ lé Kristi.
  alternative: Kí a kọ ‘ọ̀nà náà’ gẹ́gẹ́ bí ọ̀nà tàbí ẹ̀kọ́ lásán.
  rationale: Bí Lúùkù ṣe ń lo gbólóhùn náà níbi púpọ̀ nínú Ìṣe Àwọn Àpọ́sítélì fi hàn pé ó ti di orúkọ ìdánimọ̀ fún ẹgbẹ́ ìgbàgbọ́ náà; síbẹ̀, a kò fi ẹ̀kọ́ ìsìn míì tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Àìdánilójú inú ἠπείθουν
  choice: A lo ‘kọ̀ láti gba ọ̀rọ̀ náà gbọ́,’ a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé [a].
  alternative: ‘jẹ́ aláìgbọ́ràn’ tàbí ‘kò gbàgbọ́.’
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní agbára ìtumọ̀ àìgbọ́ràn, àìgbàgbọ́, tàbí kíkọ̀ láti jẹ́ kí ẹlòmíràn yí ẹni lérò padà. Ìtumọ̀ inú ẹsẹ yìí kò yẹ kí ó pa àìdánilójú yẹn rẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. A yà gbolohun gígùn Gíríìkì sí gbólóhùn méjì láti jẹ́ kí ó rọrùn láti ka, láìyí ìtẹ̀síwájú ìṣe náà padà. Gbogbo àmì àlàyé [a], [b], àti [c] wà níbi tó bá ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
