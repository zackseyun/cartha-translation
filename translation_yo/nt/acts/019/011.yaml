  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: yo
  text: Ọlọ́run sì ń ṣe àwọn iṣẹ́ ìyanu àrà ọ̀tọ̀ nípasẹ̀ ọwọ́ Pọ́ọ̀lù,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “àwọn iṣẹ́ agbára tí kì í ṣe irú èyíkéyìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: àwọn iṣẹ́ agbára
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìṣe tí agbára Ọlọ́run hàn nínú wọn. ‘Àwọn iṣẹ́ agbára’ pa ìtumọ̀ gangan mọ́, ó sì bá àlàyé pé wọn kì í ṣe iṣẹ́ lásán mu.
- source_word: τε
  choice: sì
  rationale: Patikulu náà so gbólóhùn yìí mọ́ ìtàn tó ṣáájú; ‘sì’ jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: οὐ τὰς τυχούσας
  choice: tí kò wọ́pọ̀
  rationale: Gbólóhùn náà túmọ̀ sí àwọn tí kì í ṣe irú èyí tí a sábà máa ń rí. ‘Tí kò wọ́pọ̀’ jẹ́ ti ẹ̀dá, ó sì pa ìtẹnumọ́ rẹ̀ mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ọlọ́run ni olùṣe tí gírámà Gíríìkì fi hàn kedere.
- source_word: ἐποίει
  choice: ń ... ṣe
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; ‘ń ṣe’ mú abala yẹn jáde nínú àyíká ìtàn àtijọ́.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: fi ọwọ́ Paulu
  rationale: Àpólà yìí fi Paulu hàn gẹ́gẹ́ bí ohun èlò tí Ọlọ́run fi ń ṣiṣẹ́, ó sì pa àwòrán ‘ọwọ́’ inú orísun mọ́.
- source_word: Παύλου
  choice: Paulu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ẹni tó ń ṣe iṣẹ́ agbára
  choice: Ọlọ́run ni ẹni tó ń ṣe àwọn iṣẹ́ agbára, ó sì ń fi ọwọ́ Paulu ṣe wọn.
  alternative: Paulu fúnra rẹ̀ ni ó ń ṣe àwọn iṣẹ́ agbára.
  rationale: ὁ θεὸς ni kókó-ọrọ̀ ἐποίει, nígbà tí διὰ τῶν χειρῶν Παύλου fi Paulu hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn iṣẹ́ agbára’ láti pa ìtumọ̀ δύναμις mọ́, àti ‘tí kò wọ́pọ̀’ láti sọ ọ̀rọ̀ Gíríìkì náà ní Yorùbá àdánidá.
