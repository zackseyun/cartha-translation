translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àwọn ọ̀rọ̀ òfin bí “ẹ̀sùn,” “ìgbẹ́jọ́,” àti “gbé ẹ̀sùn kalẹ̀,” ṣùgbọ́n a yẹra fún ọ̀rọ̀ amọ̀ṣẹ́ tí kò wọ́pọ̀. A fi àmì ohùn síbi tí ó bá yẹ.
