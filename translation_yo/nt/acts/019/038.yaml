  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: yo
  text: Nítorí náà, bí Demetiriusi àti àwọn oníṣẹ́ ọnà tí ó wà pẹ̀lú rẹ̀ bá ní ẹ̀sùn kan lòdì sí ẹnikẹ́ni, àwọn ìgbẹ́jọ́ ń wáyé[a], àwọn gómìnà agbègbè Róòmù sì wà[b]; kí wọ́n gbé ẹ̀sùn kalẹ̀ lòdì sí ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ilé ẹjọ́ ń jókòó.” Ọ̀rọ̀ Gíríìkì ἀγοραῖοι ἄγονται ń tọ́ka sí àwọn ìgbẹ́jọ́ tí àwọn aláṣẹ pè sílẹ̀ lọ́nà òfin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn gómìnà agbègbè Róòmù wà níbẹ̀.” Lílo ọ̀pọ̀ nọ́mbà náà lè tọ́ka sí ipò ìṣàkóso agbègbè náà lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Nítorí náà, bí ... bá
  rationale: Ó mú ìtumọ̀ ìyọrísí οὖν àti ọ̀nà gbólóhùn oníṣ شرط εἰ jáde ní Yorùbá àdánidá; μέν kò nílò ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: Δημήτριος
  choice: Demetiriusi
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn orúkọ Gíríìkì ní Yorùbá.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: àwọn oníṣẹ́ ọnà tí ó wà pẹ̀lú rẹ̀
  rationale: “Oníṣẹ́ ọnà” túmọ̀ sí òṣìṣẹ́ ọlọ́gbọ́n tàbí artisan; “tí ó wà pẹ̀lú rẹ̀” pa ìtumọ̀ σὺν αὐτῷ mọ́ láì sọ irú ìbáṣepọ̀ tí Gíríìkì kò sọ.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: ní ẹ̀sùn kan lòdì sí ẹnikẹ́ni
  rationale: 'Àpólà náà ní agbára òfin: ní àríyànjiyàn tàbí ẹ̀sùn tí a lè gbé lọ sí ilé ẹjọ́.'
- source_word: ἀγοραῖοι ἄγονται
  choice: àwọn ìgbà ìgbẹ́jọ́ ń lọ lọ́wọ́
  rationale: Ó tọ́ka sí àwọn àkókò ìgbẹ́jọ́ tí a pè sílẹ̀ lọ́nà ìjọba, kì í ṣe ọjọ́ ọjà lásán; ọ̀rọ̀ yìí tún pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἀνθύπατοί εἰσιν
  choice: àwọn gómìnà agbègbè Róòmù sì wà
  rationale: ἀνθύπατοι jẹ́ àwọn aláṣẹ agbègbè Róòmù tí a ń pè ní proconsuls. A pa ọ̀pọ̀ nọ́mbà inú Gíríìkì mọ́, a sì lo àlàyé tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: kí wọ́n gbé ẹ̀sùn kalẹ̀ lòdì sí ara wọn
  rationale: Ó pa ìtumọ̀ òfin ti ἐγκαλέω àti ìtumọ̀ ìfèsì ara-ẹni ti ἀλλήλοις mọ́, láì sọ pé kí wọ́n kan máa bá ara wọn jà.
