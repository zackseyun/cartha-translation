id: ACT.10.23
reference: Acts 10:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: yo
  text: Nítorí náà, ó pè wọ́n wọlé, ó sì fún wọn ní ibùgbé[a]. Ní ọjọ́ kejì, ó dìde, ó sì bá wọn jáde lọ; àwọn arákùnrin[b] kan láti Jópà sì bá a lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó gbà wọ́n sílé lálejò.” Ọ̀rọ̀ Gíríìkì náà tọ́ka ní pàtó sí fífi àlejò sílẹ̀ ní ilé ẹni nípa pípèsè ibi tí wọn yóò gbé.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” ni a fi tú akọ-ọ̀pọ̀ ἀδελφῶν. Nínú ìlò àwọn Kristẹni ìgbà àkọ́kọ́, ọ̀rọ̀ yìí lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀, ìyẹn, “àwọn arákùnrin àti arábìnrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: ó pè wọ́n wọlé
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pétérù ní kí wọ́n wọ ibi tí ó wà; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìṣe pípe wọn wọlé mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe Pétérù pọ̀ mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ gẹ́gẹ́ bí àbájáde rẹ̀, láìfi agbára ìtumọ̀ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐξένισεν
  choice: ó sì gbà wọ́n sí àlejò
  rationale: Ní àyíká yìí, ξενίζω túmọ̀ sí fífi inú rere gba àwọn àlejò àti pípèsè ibùgbé fún wọn. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì mú apá ìtẹ́wọ́gbà àti ibùgbé náà pọ̀.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ṣíṣe àfihàn ọjọ́ tí ó tẹ̀ lé e.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Ó pa ìtumọ̀ ìpilẹ̀ rẹ̀ mọ́ láìyí i sí ‘ó múra ìrìnàjò,’ èyí tí yóò fi ohun tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἐξῆλθεν σὺν αὐτοῖς
  choice: ó sì bá wọn jáde lọ
  rationale: Gbólóhùn yìí fi ìjáde àti jíjẹ́ pé ó lọ pẹ̀lú wọn hàn ní èdè Yorùbá tí ó rọrùn.
- source_word: τινες τῶν ἀδελφῶν
  choice: àwọn arákùnrin kan
  rationale: ‘Kan’ ṣe aṣojú àìdánimọ̀ τινες, ‘àwọn arákùnrin’ sì tẹ̀ lé akọ-ọ̀pọ̀ ἀδελφῶν ní kíkún.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: láti Jópà
  rationale: Ó fi ibi tí àwọn arákùnrin náà ti wá hàn ní ṣókí àti ní ti ẹ̀dá Yorùbá.
- source_word: συνῆλθον αὐτῷ
  choice: sì bá a lọ
  rationale: Ní àyíká ìrìnàjò yìí, συνέρχομαι túmọ̀ sí pé wọ́n tẹ̀ lé e tàbí wọ́n rin ìrìnàjò pẹ̀lú rẹ̀; ‘bá a lọ’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφῶν ní àwùjọ àwọn onígbàgbọ́ tí ó lè ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ-ọ̀pọ̀, nítorí náà a pa ‘àwọn arákùnrin’ mọ́ nínú ẹsẹ̀. Síbẹ̀, nínú ìlò àwọn Kristẹni ìgbà àkọ́kọ́, ọ̀rọ̀ náà lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀; àlàyé ìsàlẹ̀ ni ó tọ́ láti pa àǹfààní ìtumọ̀ yìí mọ́ láìyanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. ‘Gbà wọ́n sí àlejò’ jẹ́ àṣà èdè Yorùbá tó dára fún ìtẹ́wọ́gbà àti pípèsè ibùgbé; a sì pa ìyàtọ̀ láàárín ‘ó dìde’ àti ‘ó jáde lọ’ mọ́.
