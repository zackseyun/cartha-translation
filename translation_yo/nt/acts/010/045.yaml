  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: yo
  text: Ẹnu ya àwọn onígbàgbọ́ tí a kọ ní ilà[a], àwọn tí wọ́n bá Pétérù wá, gidigidi, nítorí a ti tú ẹ̀bùn Ẹ̀mí Mímọ́ jáde[c] sórí àwọn Kèfèrí pàápàá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn onígbàgbọ́ onílà.’ Ní gígúnlẹ̀, ‘àwọn onígbàgbọ́ láti inú ìkọlà.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘sórí àwọn Kèfèrí pẹ̀lú.’ Ọ̀rọ̀ Gíríìkì lè fi àfikún hàn, ṣùgbọ́n níbí ó ṣeé ṣe kí ó tẹnu mọ́ ìyàlẹ́nu náà pé, ‘sórí àwọn Kèfèrí pàápàá.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘a ti tú ... jáde, ó sì ṣì wà bẹ́ẹ̀.’ Perfect Gíríìkì tẹnu mọ́ ìṣe tí ó ti ṣẹ̀ tán tí àbájáde rẹ̀ sì ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: Ẹnu ya ... gidigidi
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu ńlá hàn. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: àwọn onígbàgbọ́ onílà
  rationale: Ó tọ́ka sí àwọn onígbàgbọ́ Júù tí ìkọlà dá mọ̀ gẹ́gẹ́ bí ẹgbẹ́ kan. ‘Onílà’ jẹ́ kedere, ó sì yẹra fún gbólóhùn tí kò bá etí Yorùbá mu.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: tí wọ́n bá Pétérù wá
  rationale: Ó sọ pé àwọn wọ̀nyí ni àwọn tí wọ́n bá Pétérù rìnrìn àjò wá; ìtumọ̀ yìí jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: sórí àwọn Kèfèrí pàápàá
  rationale: Nínú àyíká Ìṣe 10, ἔθνη túmọ̀ sí àwọn tí kì í ṣe Júù. ‘Pàápàá’ mú ìtumọ̀ àfikún tí ó ní ìyàlẹ́nu nínú καὶ jáde.
- source_word: ἡ δωρεὰ
  choice: ẹ̀bùn
  rationale: ‘Ẹ̀bùn’ sọ ohun tí a fi fúnni ní kedere láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó wọ́pọ̀, tí ó sì bójú mu láti pe Holy Spirit.
- source_word: ἐκκέχυται
  choice: a ti tú ... jáde
  rationale: Àpẹẹrẹ ‘a ti’ fi ìṣe tí ó ti ṣẹ̀ tí àbájáde rẹ̀ ṣì wà hàn, nígbà tí ìṣe aláìlórúkọ náà pa ohùn àfarawà Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú àyíká ìtàn ìgbàlà
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Ìyàtọ̀ nínú Ìṣe 10 wà láàárín àwọn onígbàgbọ́ Júù àti àwọn tí kì í ṣe Júù; ‘àwọn Kèfèrí’ sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní pàtó.
- issue: Ìrísí ìṣe ἐκκέχυται
  choice: a ti tú ... jáde
  alternative: a tú ... jáde
  rationale: Perfect Gíríìkì tẹnu mọ́ ìṣe tí ó ti parí pẹ̀lú àbájáde tí ó ń bá a lọ. ‘A ti tú’ pa méjèèjì mọ́ láìdá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn sí i.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Kèfèrí’ ni a lò ní ìtumọ̀ ìtàn pé àwọn tí kì í ṣe Júù, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn.
