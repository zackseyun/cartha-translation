source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: yo
  text: Ní báyìí, rán àwọn ọkùnrin sí Jópà, kí o sì ránṣẹ́ pe Símónì kan tí a ń pè ní Pétérù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘kí o sì ránṣẹ́ fún ẹni kan tí orúkọ rẹ̀ ń jẹ́ Símónì, ẹni tí a mọ̀ sí Pétérù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Àti nísinsìnyí
  rationale: Ó pa ìsopọ̀ καί àti ìtọ́ka àkókò νῦν mọ́, ó sì bá ọ̀rọ̀ tí ó ṣáájú mu lọ́nà àdánidá.
- source_word: πέμψον
  choice: rán
  rationale: Ọ̀rọ̀ àṣẹ ẹni kejì ẹyọ ni; ‘rán’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: ἄνδρας
  choice: àwọn ọkùnrin
  rationale: Ó pa ìtumọ̀ akọ ní pàtó ti ἀνήρ mọ́, láì fi iṣẹ́ ‘ìránṣẹ́’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: εἰς Ἰόππην
  choice: sí Jópà
  rationale: ‘sí’ sọ ìdarí sí ibi kan ní Yorùbá àdánidá.
- source_word: μετάπεμψαι
  choice: ránṣẹ́ pe
  rationale: Ó mú ìtumọ̀ pé kí a rán ènìyàn lọ pe ẹlòmíràn wá; kò fi agbára tàbí ìfipámúni tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: Σίμωνά τινα
  choice: Símónì kan
  rationale: ‘kan’ pa ipa τινα mọ́ gẹ́gẹ́ bí ẹni kan tí a ń dá mọ̀ sílẹ̀ fún àkọ́kọ́ nínú ìtàn.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: tí à ń pè ní Pétérù
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ tí a fi ń pe ẹni náà, ó sì pa ìṣe tí ń lọ lọ́wọ́ ti fọ́ọ̀mù Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ránṣẹ́ pe’ dípò ọ̀rọ̀ tó lè túmọ̀ sí fífi agbára pe ènìyàn wá.
