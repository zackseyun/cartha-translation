id: ACT.10.8
reference: Acts 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: yo
  text: Lẹ́yìn tí ó sì ti ṣàlàyé ohun gbogbo fún wọn, ó rán wọn lọ sí Jópà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: lẹ́yìn tí ó ti ṣàlàyé
  rationale: Ọ̀rọ̀ alábápín aorist yìí tọ́ka sí ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtumọ̀ yìí tún fi hàn pé Kọ̀nílíù sọ gbogbo ọ̀ràn náà di mímọ̀ fún wọn ní ẹ̀kúnrẹ́rẹ́.
- source_word: ἅπαντα
  choice: ohun gbogbo
  rationale: Àpólà ọ̀rọ̀ yìí túmọ̀ sí gbogbo ohun tàbí gbogbo ọ̀ràn tí ó yẹ kí wọn mọ̀; “ohun gbogbo” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà fi àwọn tí a ṣàlàyé ọ̀ràn fún hàn; “fún wọn” ni ìsọ̀rọ̀ Yorùbá tó bá ọ̀rọ̀-ìṣe “ṣàlàyé” mu.
- source_word: ἀπέστειλεν
  choice: ó rán wọn lọ
  rationale: Àkópọ̀ “rán ... lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ní kí àwọn mìíràn lọ sí ibi kan fún iṣẹ́ kan, láìfi ìkánjú tí kò sí nínú Gíríìkì kún un.
- source_word: εἰς τὴν Ἰόππην
  choice: sí Jópà
  rationale: εἰς fi ìlọsí ibi àfojúsùn hàn; “sí Jópà” ni ìtumọ̀ Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéwọ̀n, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa ìtẹ̀lé àkókò ìṣe inú Gíríìkì mọ́ ní ọ̀nà àdánidá.
