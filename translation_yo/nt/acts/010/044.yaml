id: ACT.10.44
reference: Acts 10:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: yo
  text: Bí Peteru ti ń sọ àwọn ọ̀rọ̀ wọ̀nyí lọ́wọ́, Ẹ̀mí Mímọ́ bà lé gbogbo àwọn tí ń gbọ́ ọ̀rọ̀ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀mí Mímọ́ wá sórí gbogbo àwọn tí ń gbọ́ ọ̀rọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Bí Peteru sì ti ń sọ … lọ́wọ́
  rationale: Ọ̀nà yìí tú genitive absolute pẹ̀lú participle ìsinsìnyí sí gbólóhùn àkókò Yorùbá, ó sì fi hàn pé Peteru kò tíì dáwọ́ ọ̀rọ̀ dúró nígbà tí ìṣẹ̀lẹ̀ pàtàkì náà ṣẹlẹ̀.
- source_word: τὰ ῥήματα ταῦτα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: ῥήματα tọ́ka sí àwọn ohun tí Peteru ń sọ; ‘àwọn ọ̀rọ̀ wọ̀nyí’ jẹ́ ìtumọ̀ tààrà, ó sì bá Yorùbá mu.
- source_word: ἐπέπεσε
  choice: bà lé
  rationale: ‘Bà lé’ pa àwòrán alágbára inú ἐπιπίπτω mọ́, dípò fífi ọ̀rọ̀ tó tútù bí ‘wá sórí’ rọ́pò rẹ̀.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó wọ́pọ̀, tí ó sì yẹ fún orúkọ yìí.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: lé gbogbo àwọn tí ń gbọ́
  rationale: Ó pa ìtumọ̀ gbogbo ènìyàn tí ó wà níbẹ̀ àti iṣẹ́ tí wọ́n ń ṣe ní àkókò náà mọ́.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: ‘Ọ̀rọ̀ náà’ tẹ̀lé λόγος ní pẹkipẹki, ó sì lè túmọ̀ sí ìhìn tí Peteru ń kéde ní àyíká yìí láì fi àlàyé míì kún un.
theological_decisions:
- issue: Ìṣe Ẹ̀mí nínú ἐπέπεσε
  choice: Ẹ̀mí Mímọ́ bà lé gbogbo àwọn tí ń gbọ́
  alternative: Ẹ̀mí Mímọ́ wá sórí gbogbo àwọn tí ń gbọ́
  rationale: A pa ọ̀rọ̀ àwòrán Luku mọ́ láì fi èrò ẹ̀kọ́ ìjọ kan nípa ìrírí Ẹ̀mí kún ohun tí ẹsẹ náà sọ.
- issue: Ìtumọ̀ λόγος níbi ìkéde
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà
  rationale: ‘Ọ̀rọ̀ náà’ pa ìbámu ọ̀rọ̀ Gíríìkì àti ìṣòro ìtumọ̀ rẹ̀ mọ́, nígbà tí àyíká fi hàn pé ó jẹ́ ìhìn tí Peteru ń kéde.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Bí … ti ń … lọ́wọ́’ jẹ́ ọ̀nà àdánidá láti fi ìṣẹ̀lẹ̀ méjì tó ń ṣẹlẹ̀ lẹ́ẹ̀kan náà hàn; ‘bà lé’ sì pa agbára àwòrán ọ̀rọ̀ orísun mọ́.
