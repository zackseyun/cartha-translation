revisions:
- from: Nítorí náà, ó pàṣẹ pé kí a batisí wọn ní orúkọ Jésù Mèsáyà[a]. Nígbà náà ni wọ́n bẹ̀ ẹ́ pé kí ó dúró lọ́dọ̀ wọn fún ọjọ́ mélòó kan.
  to: Nígbà náà, ó pàṣẹ pé kí a batisí wọn ní orúkọ Jésù Mèsáyà[a]. Lẹ́yìn náà, wọ́n bẹ̀ ẹ́ pé kí ó dúró lọ́dọ̀ wọn fún ọjọ́ díẹ̀.
  rationale: The revision removes an unwarranted consequential nuance from the first connective and makes the final time expression idiomatic while retaining its indefinite sense. The baptismal formula, passive construction, title “Mèsáyà,” and traditional-form footnote are retained.
