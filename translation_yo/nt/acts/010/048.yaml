id: ACT.10.48
reference: Acts 10:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: yo
  text: Nígbà náà, ó pàṣẹ pé kí a batisí wọn ní orúkọ Jésù Mèsáyà[a]. Lẹ́yìn náà, wọ́n bẹ̀ ẹ́ pé kí ó dúró lọ́dọ̀ wọn fún ọjọ́ díẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: ó pàṣẹ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífúnni ní àṣẹ pẹ̀lú ọlá-àṣẹ; ‘ó pàṣẹ’ jẹ́ èdè Yorùbá àdánidá tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín δέ ń mú ìtàn tẹ̀ síwájú, ó sì ní ìṣàn ìyọrísí láti inú ohun tó ṣáájú; ‘Nítorí náà’ bá ìbáṣepọ̀ yìí mu láìsọ ọ́ di ìtakora.
- source_word: ἐν τῷ ὀνόματι
  choice: ní orúkọ
  rationale: Ó pa àwòrán àti àìmọ̀ọ́kan gbolohun Gíríìkì mọ́, èyí tó lè ní ìtumọ̀ ọlá-àṣẹ, ìfarajìn, tàbí ìpè orúkọ, láìdín in kù sí ọ̀kan ṣoṣo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστοῦ jẹ́ akọ́lé ní àyíká ọ̀rọ̀ yìí; ‘Mèsáyà’ fi ìtumọ̀ akọ́lé náà hàn dípò kí ó dà bí orúkọ ìdílé.
- source_word: βαπτισθῆναι
  choice: kí a batisí wọn
  rationale: Ìṣe náà wà ní fọ́ọ̀mù àìṣe-aláṣẹ (passive); ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ‘kí wọ́n gba batisí’ ó sì ṣàfihàn pé ẹlòmíràn ni yóò ṣe ìṣe náà sí wọn.
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní kedere, ní ọ̀nà ìtàn Yorùbá tó wọ́pọ̀.
- source_word: ἠρώτησαν
  choice: wọ́n bẹ̀ ẹ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí béèrè tàbí bẹ ẹnìkan; ‘bẹ̀ ẹ́’ dára fún ìbéèrè pé kí ó dúró láìfi ìrọ́nilétí tó lágbára kún un.
- source_word: ἐπιμεῖναι
  choice: kí ó dúró lọ́dọ̀ wọn
  rationale: Ó sọ ìtumọ̀ dídúró síwájú fún àkókò kan ní Yorùbá tó ṣe kedere, ‘lọ́dọ̀ wọn’ sì mú ẹni tí ó ń bá gbé yé láti inú àyíká ọ̀rọ̀.
- source_word: ἡμέρας τινάς
  choice: fún ọjọ́ mélòó kan
  rationale: Ó pa iye ọjọ́ náà mọ́ gẹ́gẹ́ bí ohun tí a kò sọ ní pàtó; kò fi dandan sọ pé ọjọ́ díẹ̀ tàbí púpọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú gbólóhùn batisí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí akọ́lé ìjẹ́wọ́ fún Jésù. ‘Mèsáyà’ fi ìtumọ̀ akọ́lé náà hàn; a fi ‘Kristi’ sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà ìbílẹ̀ láìyanju ìṣòro náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ìtàn tó ṣe kedere ni a lò. A yan ‘batisí’ nítorí pé ó jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa, láìfi ọ̀nà ìṣe batisí kan pàtó lé ẹsẹ náà lórí. Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
