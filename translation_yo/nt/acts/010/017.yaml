id: ACT.10.17
reference: Acts 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: yo
  text: Bí Pétérù sì ti ń dààmú nínú ara rẹ̀ nípa ohun tí ìran tí ó rí náà lè túmọ̀ sí[a], kíyè sí i, àwọn ọkùnrin tí Kọ̀nélíù rán, lẹ́yìn tí wọ́n ti béèrè ibi tí ilé Símónì wà, dúró ní ẹnu ibodè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ìran tí ó rí náà lè jẹ́.” Báyìí ni a ṣe lè tú Gíríìkì náà ní ọ̀nà tí ó túbọ̀ sún mọ́ ọ̀rọ̀ rẹ̀ gan-an, ṣùgbọ́n níbí ó ṣeé ṣe kí ó ń tọ́ka sí ìtumọ̀ tàbí pàtàkì ìran náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní agbègbè ẹnu ọ̀nà àbáwọlé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibodè tàbí agbègbè ẹnu ọ̀nà ilé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Bí ... sì ti ń
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun méjèèjì ń ṣẹlẹ̀ ní àkókò kan náà, ó sì tún so ìtàn náà pọ̀ mọ́ ohun tí ó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν ἑαυτῷ
  choice: nínú ara rẹ̀
  rationale: Ó tọ́ka sí ìrònú àti ìdààmú inú Pétérù, kì í ṣe ohun tí ó sọ jáde.
- source_word: διηπόρει
  choice: ń dààmú
  rationale: Ìṣe aláìparí náà fi ìdààmú ọkàn tí ó ń bá a lọ hàn; ‘ń dààmú’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lágbára ju ‘ń ṣe kàyéfì’ lọ.
- source_word: τί ἂν εἴη
  choice: ohun tí ... lè túmọ̀ sí
  rationale: Ní àyíká ọ̀rọ̀ yìí, Pétérù ń wá ìtumọ̀ tàbí pàtàkì ìran náà. A fi àlàyé ìtumọ̀ gangan sí àlàyé ìsàlẹ̀.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: ìran tí ó rí náà
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: A pa àmì ìtàn yìí mọ́ láti fa àfiyèsí sí ìṣẹ̀lẹ̀ tuntun tí ó ṣe pàtàkì.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: àwọn ọkùnrin tí Kọ̀nélíù rán
  rationale: Ó pa ìtumọ̀ pé ọkùnrin ni wọ́n àti pé Kọ̀nélíù ni ó rán wọn mọ́ ní ọ̀nà kúkúrú, àdánidá.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: lẹ́yìn tí wọ́n ti béèrè ibi tí ilé Símónì wà
  rationale: Èyí mú kí ìṣe tí ó ṣáájú dúró hàn kedere, ó sì sọ ìbéèrè wọn nípa bí wọn ṣe lè rí ilé náà ní Yorùbá àdánidá.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: dúró ní ẹnu ibodè
  rationale: ‘Dúró’ pa àwòrán àwọn ọkùnrin náà níbi àbáwọlé mọ́; ‘ẹnu ibodè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹnu ọ̀nà ilé.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní; ‘kíyè sí i’ pa ìmúnilójú ἰδοὺ mọ́ láìlo ọ̀rọ̀ àtijọ́ tí ó ṣòro.
