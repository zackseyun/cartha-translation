  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: yo
  text: Ó ń gbé lọ́dọ̀ Símónì kan, aláwọ̀, [a] ẹni tí ilé rẹ̀ wà létí òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ń dúró gẹ́gẹ́ bí àlejò lọ́dọ̀ Símónì kan, aláwọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζεται
  choice: ń ṣe àlejò lọ́dọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé a gba ẹni náà sílé gẹ́gẹ́ bí àlejò, ó sì ń dúró lọ́dọ̀ ẹni mìíràn; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ àlejò mọ́.
- source_word: παρά τινι
  choice: lọ́dọ̀ ọkùnrin kan
  rationale: παρά pẹ̀lú dative fi ìbáṣepọ̀ tàbí ibi tí ẹni wà hàn, τις sì jẹ́ aláìlópin; ‘lọ́dọ̀ ọkùnrin kan’ sọ èyí ní Yorùbá kedere láìfikún ohun tí kò sí nínú Gíríìkì.
- source_word: Σίμωνι
  choice: Símónì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìlò àti ìpè Yorùbá tó wọ́pọ̀.
- source_word: βυρσεῖ
  choice: aláwọ̀
  rationale: βυρσεύς ń tọ́ka sí ẹni tó ń ṣiṣẹ́ awọ ẹranko, ní pàtàkì ẹni tó ń ṣe awọ tútù di awọ lílò; ‘aláwọ̀’ ni ọ̀rọ̀ Yorùbá ṣókí tó bá iṣẹ́ yìí mu.
- source_word: ᾧ ἐστιν οἰκία
  choice: ilé rẹ̀ sì wà
  rationale: Ìtumọ̀ gangan ni pé ilé jẹ́ ti Símónì, ṣùgbọ́n ìṣọ̀kan gbólóhùn Yorùbá jẹ́ kí ‘ilé rẹ̀ sì wà’ ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: παρὰ θάλασσαν
  choice: létí òkun
  rationale: παρά pẹ̀lú accusative níbí ń fi ìsúnmọ́ ibi hàn; ‘létí òkun’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ilé náà wà lẹ́gbẹ̀ẹ́ òkun.
- source_word: οὗτος
  choice: Ó
  rationale: οὗτος ń tọ́ka padà sí Pétérù nínú àyíká ọ̀rọ̀; arọ́pò-orúkọ ‘Ó’ jẹ́ àdánidá ju ‘ọkùnrin yìí’ lọ ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ń ṣe àlejò lọ́dọ̀’ pa èrò pé a gba Pétérù sílé mọ́; àlàyé ìsàlẹ̀ ojú ewé sì fúnni ní ọ̀nà míì tó tẹnumọ́ dídúró fún ìgbà díẹ̀.
