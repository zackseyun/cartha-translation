  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: yo
  text: Ṣùgbọ́n ní gbogbo orílẹ̀-èdè, ẹni tí ó bẹ̀rù rẹ̀, tí ó sì ń ṣe ohun tí ó tọ́, ni ó jẹ́ ẹni ìtẹ́wọ́gbà lọ́dọ̀ rẹ̀[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó sì ń ṣe òdodo” tàbí “tí ó sì ń gbé ìgbé ayé òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni δικαιοσύνην, tí a sábà máa ń túmọ̀ sí “òdodo”; ní àwọn àyíká kan, ó tún lè túmọ̀ sí “ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ni a tẹ́wọ́ gbà lọ́dọ̀ rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tó ṣáájú pé Ọlọ́run kì í ṣe ojúsàájú; ‘Ṣùgbọ́n’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàtọ̀ yìí.
- source_word: ἐν παντὶ ἔθνει
  choice: ní gbogbo orílẹ̀-èdè
  rationale: Ó pa ìtumọ̀ pẹ̀tẹ́lẹ̀ ti gbólóhùn náà mọ́, láì fi èrò òde òní nípa ẹ̀yà kún un.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: ẹni tí ó bẹ̀rù rẹ̀
  rationale: ‘Ẹni tí’ kò fi akọ tàbí abo sí ọ̀rọ̀ náà, ó sì pa ìtumọ̀ ìbẹ̀rù ọlọ́wọ̀ fún Ọlọ́run mọ́.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: tí ó sì ń ṣe ohun tí ó tọ́
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìwà tí ènìyàn ń hù nígbà gbogbo, ó sì pa ipa ìṣe ti ἐργαζόμενος mọ́.
- source_word: δικαιοσύνην
  choice: ohun tí ó tọ́
  rationale: Nínú àpapọ̀ ọ̀rọ̀ yìí, gbólóhùn náà túmọ̀ sí ṣíṣe ohun tó bá ìwà òdodo mu. Àlàyé ìsàlẹ̀ pa ‘òdodo’ àti ‘ìdájọ́ òdodo’ mọ́ gẹ́gẹ́ bí àwọn ọ̀nà mìíràn.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: ni ó ṣe ìtẹ́wọ́gbà lọ́dọ̀ rẹ̀
  rationale: Ó tẹ̀lé ànímọ́-orúkọ δεκτός, ó sì yẹra fún fífi ìtumọ̀ pé ẹni náà fi iṣẹ́ jèrè ìgbàlà kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń kọ́ni pé iṣẹ́ ni a fi ń jèrè ìgbàlà, tàbí pé ó ń ṣàpèjúwe ẹni tí Ọlọ́run tẹ́wọ́ gbà láìwo orílẹ̀-èdè rẹ̀
  choice: A pa gbólóhùn náà mọ́ pé ẹni tí ó bẹ̀rù Ọlọ́run, tí ó sì ń ṣe ohun tí ó tọ́, ṣe ìtẹ́wọ́gbà lọ́dọ̀ rẹ̀.
  alternative: ‘Ó fi iṣẹ́ rẹ̀ jèrè ìtẹ́wọ́gbà Ọlọ́run’ tàbí ‘ó fi ẹ̀rí ìgbàgbọ́ ìgbàlà hàn.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìtẹ́wọ́gbà Ọlọ́run ní ìbáṣepọ̀ pẹ̀lú ìbẹ̀rù Ọlọ́run àti ṣíṣe òdodo, nínú àyíká pé Ọlọ́run kì í ṣe ojúsàájú. Ìtumọ̀ náà kò dá awuyewuye ẹ̀kọ́ ìgbàgbọ́ yìí parí ní ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘ẹni tí’ láti yẹra fún ìdènà akọ tàbí abo.
