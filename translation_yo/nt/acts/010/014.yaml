id: ACT.10.14
reference: Acts 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru wí pé, “Rárá o, Olúwa, nítorí èmi kò jẹ ohunkóhun tí kò mọ́ àti tí ó jẹ́ ẹlẹ́gbin rí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Rárá o
  rationale: Ó fi ìkọ̀ líle hàn ní Yorùbá àdánidá, ó sì bá ìdáhùn Peteru sí àṣẹ náà mu.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ ìpè ní κύριε mọ́ láì pinnu ju ọ̀rọ̀ náà lọ bóyá ó jẹ́ ìbòwọ̀ lásán tàbí ìdánimọ̀ ẹni tó ń sọ̀rọ̀.
- source_word: κοινὸν
  choice: tí a kà sí aláìmọ́
  rationale: Nínú ọ̀rọ̀ oúnjẹ Júù, κοινός túmọ̀ sí ohun tí kò yẹ fún lílò mímọ́ tàbí tí a sọ di aláìmọ́; gbolohun yìí yà á sọ́tọ̀ sí ἀκάθαρτος.
- source_word: ἀκάθαρτον
  choice: ẹlẹ́gbin
  rationale: Ó dúró fún ohun tí kò mọ́ nípa ìlànà ẹ̀sìn, ó sì pa ìyàtọ̀ rẹ̀ sí κοινός mọ́ ní Yorùbá tí ó ṣeé lóye.
- source_word: καὶ
  choice: àti
  rationale: A tẹ̀lé ẹ̀rí ọ̀rọ̀ orísun tí a pèsè, èyí tí ó so àwọn àpèjúwe méjèèjì pọ̀ pẹ̀lú ‘àti,’ kì í ṣe ‘tàbí.’
- source_word: ὅτι
  choice: nítorí
  rationale: Ó sọ ìdí tí Peteru fi kọ̀ láti ṣe ohun tí a pa láṣẹ, gẹ́gẹ́ bí àtúnyẹ̀wò POB ṣe tẹnumọ́.
- source_word: οὐδέποτε ἔφαγον
  choice: èmi kò jẹ ... rí
  rationale: Ìlànà ‘kò ... rí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun náà kò ṣẹlẹ̀ nígbà kankan títí di àkókò yìí.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ìran náà
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ pa ọ̀wọ̀ àti àìdánilójú ìtọ́kasí Giriki mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Ìbáṣepọ̀ κοινόν àti ἀκάθαρτον
  choice: aláìmọ́ àti ẹlẹ́gbin
  alternative: aláìmọ́ tàbí ẹlẹ́gbin
  rationale: Ẹ̀dà SBLGNT tí a pèsè ní καὶ (‘àti’); a kò yí i sí ‘tàbí,’ bí ó tilẹ̀ jẹ́ pé àwọn ẹ̀rí àfọwọ́kọ kan ní ìyàtọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Peteru’ ni ọ̀nà orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá.
