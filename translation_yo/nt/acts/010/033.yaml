id: ACT.10.33
reference: Acts 10:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: yo
  text: Nítorí náà, mo ránṣẹ́ pè ọ́ lẹ́sẹ̀kẹsẹ̀[a], ìwọ náà sì ṣe dáadáa pé o wá. Nísinsin yìí, gbogbo wa wà níhìn-ín níwájú Ọlọ́run láti gbọ́ gbogbo ohun tí Olúwa[b] ti pàṣẹ fún ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní kíákíá” tàbí “láìsí ìdádúró.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Olúwa.” Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe gan-an pé Jésù ni ó ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé àwọn kan lóye rẹ̀ ní gbogbogbòò gẹ́gẹ́ bí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe ohun kan kíákíá láìjáfara. “Lẹ́sẹ̀kẹsẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìkánjú iṣẹ́ Kọ̀nẹ́líù hàn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí Kọ̀nẹ́líù ṣe pọ̀ mọ́ ohun tí ó ṣẹlẹ̀ ṣáájú, ó sì fi àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn.
- source_word: ἔπεμψα πρὸς σέ
  choice: mo ránṣẹ́ pè ọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní tààràtà ni “mo ránṣẹ́ sí ọ,” àyíká ọ̀rọ̀ fi hàn pé Kọ̀nẹ́líù rán àwọn ìránṣẹ́ láti lọ pè Pétérù. Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: σύ τε
  choice: ìwọ náà sì
  rationale: Ó so ìṣe Pétérù mọ́ ìṣe Kọ̀nẹ́líù, ó sì pa ìtẹnumọ́ orúkọ arọ́pò-orúkọ náà mọ́.
- source_word: καλῶς ἐποίησας
  choice: ṣe dáadáa
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹ́wọ́gbà hàn, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: παραγενόμενος
  choice: pé o wá
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí dídé Pétérù; gbólóhùn yìí jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: νῦν οὖν
  choice: Ní báyìí
  rationale: Ó samisi ìyípadà sí ìdí tí gbogbo wọn fi péjọ, láìfi ọ̀rọ̀ tí kò ṣe pàtàkì kún un.
- source_word: πάντες ἡμεῖς
  choice: gbogbo wa
  rationale: Ó pa ìtẹnumọ́ pé gbogbo àwọn tí ó péjọ ló wà níbẹ̀ mọ́.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó fi ìmọ̀ pé wọ́n wà níwájú Ọlọ́run àti ìwọ̀n ọ̀wọ̀ tó bá àkókò náà mu hàn.
- source_word: πάρεσμεν
  choice: wà níhìn-ín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tó ṣe àdánidá fún “a wà níbẹ̀/a péjọ síhìn-ín.”
- source_word: ἀκοῦσαι
  choice: láti gbọ́
  rationale: Ó pa ète ìpéjọpọ̀ náà mọ́ ní tààràtà.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: gbogbo ohun tí ... ti pàṣẹ fún ọ
  rationale: Ó pa ìtumọ̀ gbogbo rẹ̀ àti agbára àṣẹ inú προστάσσω mọ́; lílo gbólóhùn oníṣe jẹ́ àdánidá jù lọ ní Yorùbá.
theological_decisions:
- issue: Ẹni tí “Olúwa” (τοῦ κυρίου) ń tọ́ka sí
  choice: A lo “Olúwa” láìfi orúkọ “Jésù” kún un.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí Ọlọ́run nítorí gbólóhùn “níwájú Ọlọ́run” tó ṣáájú rẹ̀; ní àyíká ìtàn náà, ó tún ṣeé ṣe gan-an pé ó ń tọ́ka sí Jésù.
  rationale: Ẹ̀dà Gíríìkì sọ “Olúwa” nìkan. Títọ́jú ọ̀rọ̀ náà báyìí kò fi ìtumọ̀ tí ẹsẹ̀ náà kò sọ ní gbangba kún un, ó sì pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé lásán. Àmì ohùn wà níbi tí ó ti yẹ. Gbólóhùn náà ṣàn lọ́nà àdánidá, ṣùgbọ́n ó pa ìtẹnumọ́, ìlànà ọ̀rọ̀, àti àìdánilójú nípa ẹni tí “Olúwa” ń tọ́ka sí mọ́.
