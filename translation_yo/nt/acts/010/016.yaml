id: ACT.10.16
reference: Acts 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: yo
  text: Èyí sì ṣẹlẹ̀ lẹ́ẹ̀mẹ́ta, lẹ́sẹ̀kẹsẹ̀ ni a sì gbé ohun èlò náà[a] sókè lọ sí ọ̀run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ náà.” Ọ̀rọ̀ Gíríìkì túmọ̀ sí “ohun èlò” tàbí “ohun ìkó-nǹkan,” ṣùgbọ́n àyíká ẹsẹ̀ 11 fi hàn pé ó dà bí aṣọ ńlá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ojú ọ̀run tàbí ọ̀run; àyíká ìran yìí mú kí “ọ̀run” bójú mu dáadáa.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí gbogbo ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìran náà; “Èyí” jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ níbí; “sì” mú ìtàn náà tẹ̀ síwájú láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Èyí ṣàfihàn ìṣẹ̀lẹ̀ kan tí ó wáyé, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bójú mu fún ìtàn.
- source_word: ἐπὶ τρίς
  choice: lẹ́ẹ̀mẹ́ta
  rationale: Ó túmọ̀ sí pé ìṣẹ̀lẹ̀ náà tún ara rẹ̀ ṣe nígbà mẹ́ta; “lẹ́ẹ̀mẹ́ta” jẹ́ ọ̀nà Yorùbá tí ó rọrùn tí ó sì ṣe kedere.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ ìyára àti àìsí ìdádúró mọ́ nínú ìtẹ̀síwájú ìtàn Lúùkù.
- source_word: ἀνελήμφθη
  choice: ni a sì gbé ... sókè lọ
  rationale: Ìkọ̀wé aláìlórúkọ “a gbé” pa ohùn àìṣe Gíríìkì mọ́ láìsọ ẹni tó ṣe é; “sókè lọ” sì ṣàfihàn ìdarí ìgbé ohun náà.
- source_word: τὸ σκεῦος
  choice: ohun èlò náà
  rationale: σκεῦος jẹ́ ọ̀rọ̀ gbòòrò fún ohun èlò tàbí ohun tí a fi ń kó nǹkan; “ohun èlò” kò fi dandan sọ pé aṣọ ni, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ̀ 11 fi í wé aṣọ ńlá.
- source_word: εἰς τὸν οὐρανόν
  choice: sí ọ̀run
  rationale: “sí” ṣàfihàn ìdarí tí εἰς ní, “ọ̀run” sì bá àyíká ìran tí ohun náà ti sọ̀kalẹ̀ wá tí ó sì padà sókè mu; ọ̀rọ̀ náà tún lè ní ìtumọ̀ ojú ọ̀run.
theological_decisions:
- issue: Ohun tí οὐρανός ń tọ́ka sí nínú ìran Pétérù
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: Nínú àyíká ìran ìfihàn yìí, “ọ̀run” dára jù fún ibi tí ohun náà ti wá tí ó sì padà sí; àlàyé ìsàlẹ̀ ojú ìwé ṣì pa àṣàyàn “ojú ọ̀run” mọ́ nítorí pé οὐρανός lè túmọ̀ sí méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tí ó ní iyì, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A lo “ohun èlò” láti pa ọ̀rọ̀ Gíríìkì tí ó gbòòrò mọ́, a sì fi “aṣọ” sí àlàyé dípò fífi ìtumọ̀ àyíká rọ́pò ọ̀rọ̀ pàtó inú ẹsẹ̀.
