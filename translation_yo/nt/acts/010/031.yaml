id: ACT.10.31
reference: Acts 10:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: yo
  text: Ó sì wí pé, “Korneliu, a ti gbọ́ àdúrà rẹ, a sì ti rántí àwọn ìtọrẹ rẹ fún àwọn aláìní[a] níwájú Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ àánú rẹ” tàbí “àwọn ẹ̀bùn àánú rẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìfúnni tàbí àwọn ìṣe àánú fún àwọn aláìní.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: ó sì wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí nínú ìtàn, lílo àkókò tí ó kọjá bá èdè Yorùbá àdánidá mu ní àyíká yìí.
- source_word: Κορνήλιε
  choice: Kọnẹliu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti àṣà kíkọ orúkọ Bíbélì ní Yorùbá.
- source_word: εἰσηκούσθη
  choice: a ti gbọ́
  rationale: Ọ̀nà àìdárúkọ olùṣe yìí fi ohùn àìṣe Gíríìkì hàn ní Yorùbá àdánidá, ó sì sọ pé àdúrà náà ti gba etígbọ́.
- source_word: προσευχὴ
  choice: àdúrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐλεημοσύναι
  choice: àwọn ìtọrẹ àánú
  rationale: Ọ̀rọ̀ náà tọ́ka sí fífúnni tàbí ṣíṣe àánú sí àwọn aláìní; ‘ìtọrẹ àánú’ jẹ́ kedere, ó sì pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́.
- source_word: ἐμνήσθησαν
  choice: a sì ti rántí
  rationale: Ìtumọ̀ yìí pa èrò ìrántí mọ́, ó sì lo ọ̀nà àìdárúkọ olùṣe láti ṣàfihàn ohùn àìṣe Gíríìkì láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún gbólóhùn Gíríìkì, ó ń tọ́ka sí wíwà àti àkíyèsí Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ àwọn ìṣe àánú Kọnẹliu
  choice: àwọn ìtọrẹ àánú
  alternative: àwọn iṣẹ́ àánú; àwọn ẹ̀bùn fún aláìní
  rationale: Ìtumọ̀ yìí fi hàn pé ó jẹ́ fífún àwọn aláìní nítorí àánú, ṣùgbọ́n kò sọ pé àwọn ìtọrẹ náà fi ẹ̀tọ́ ìgbàlà tàbí èrè kan fún un.
- issue: Èdè nípa ìrántí níwájú Ọlọ́run
  choice: a sì ti rántí … níwájú Ọlọ́run
  alternative: Ọlọ́run ti kíyè sí …; Ọlọ́run ti fiyè sí …
  rationale: A pa àwòrán ìrántí inú ọ̀rọ̀ Gíríìkì mọ́, dípò yíyí rẹ̀ padà sí àlàyé tí yóò dín agbára èdè Bíbélì náà kù tàbí pinnu ohun tí ẹsẹ náà kò sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àwòrán ‘ìrántí níwájú Ọlọ́run’ mọ́.
