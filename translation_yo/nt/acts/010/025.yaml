  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: yo
  text: Nígbà tí Pétérù sì wọlé, Kọ́nẹ́líù pàdé rẹ̀, ó sì wólẹ̀ lẹ́sẹ̀ rẹ̀, ó sì tẹrí ba fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jọ́sìn fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìjọsìn tàbí ìforíbalẹ̀/ìbọ̀wọ̀ jinlẹ̀, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: Nígbà tí ... sì wọlé
  rationale: Èyí sọ ìṣẹ̀lẹ̀ àkókò náà ní Yorùbá àdánidá, ó sì pa ipa ìsopọ̀ δέ mọ́ nípasẹ̀ ‘sì,’ láìtú ọ̀rọ̀ Gíríìkì náà ní líle koko.
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: Peteru ... wọlé
  rationale: Aoristi infinitifi náà tọ́ka sí ìṣẹ̀lẹ̀ kan ṣoṣo; ‘wọlé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ ìtàn mu.
- source_word: συναντήσας αὐτῷ
  choice: Kọ̀nélíù pàdé rẹ̀
  rationale: ‘Pàdé rẹ̀’ fi ìṣe Kọ̀nélíù hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: ó wólẹ̀ lẹ́sẹ̀ rẹ̀
  rationale: Gbólóhùn yìí pa ìfarahàn ti ara àti ìrẹ̀lẹ̀ tó pọ̀ nínú ìṣe náà mọ́.
- source_word: προσεκύνησεν
  choice: ó sì tẹríba fún un
  rationale: ‘Tẹríba fún un’ lè sọ ìbọ̀wọ̀ tó jinlẹ̀ tàbí ìṣe ìforíbalẹ̀ láìdá a lójú pé ìjọsìn sí Ọlọ́run nìkan ni a túmọ̀ sí; àṣàyàn ‘jọ́sìn fún un’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí Peteru
  choice: tẹríba fún un
  alternative: jọ́sìn fún un
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìforíbalẹ̀ tàbí ìbọ̀wọ̀, ó sì tún lè túmọ̀ sí ìjọsìn, gẹ́gẹ́ bí ọ̀rọ̀ tó yí i ká. Níhìn-ín, ìtumọ̀ àkọ́kọ́ pa bí ìṣe náà ṣe lágbára mọ́ láìfi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò fi dandan mú wá; ẹsẹ tó tẹ̀ lé e fi hàn pé Peteru kọ ìṣe náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tó yẹ. Àmì ìsàlẹ̀ [a] wà lẹ́yìn ‘wọlé’; ó yẹ kí [b] wà lẹ́yìn ‘tẹríba fún un’ nínú ẹ̀dà ìkẹyìn.
