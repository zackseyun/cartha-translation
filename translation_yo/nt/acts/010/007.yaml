language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: yo
  text: Nígbà tí áńgẹ́lì tí ń bá a sọ̀rọ̀ náà ti lọ, ó pe méjì lára àwọn ìránṣẹ́ ilé rẹ̀[a], àti ọmọ-ogun kan tí ó jẹ́ olùfọkànsìn lára àwọn tí ń ṣe iṣẹ́ fún un déédéé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “méjì lára àwọn ẹrú ilé rẹ̀.” Ọ̀rọ̀ Gíríìkì οἰκέται ń tọ́ka sí àwọn ènìyàn inú ilé tí wọ́n ń ṣiṣẹ́ gẹ́gẹ́ bí ẹrú; a lo “ìránṣẹ́ ilé” nínú ẹsẹ yìí gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá, nígbà tí a ṣì pa àyíká ilé náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí … sì
  rationale: Ó fi àkókò ìṣẹ̀lẹ̀ náà hàn, ó sì pa ìtẹ̀síwájú ìtàn tí δέ ń tọ́ka sí mọ́ ní Yorùbá àdánidá.
- source_word: ἀπῆλθεν
  choice: ti lọ
  rationale: Ó fi hàn pé áńgẹ́lì náà ti lọ kí Kọ̀nẹ́líù tó pe àwọn ọkùnrin náà.
- source_word: ὁ ἄγγελος
  choice: áńgẹ́lì
  rationale: Nínú ọ̀rọ̀ yìí, ẹni tí Kọ̀nẹ́líù rí nínú ìran jẹ́ aṣojú ọ̀run, kì í ṣe òjíṣẹ́ ènìyàn lásán.
- source_word: ὁ λαλῶν αὐτῷ
  choice: tí ń bá a sọ̀rọ̀
  rationale: Gbólóhùn yìí dá áńgẹ́lì náà mọ̀ gẹ́gẹ́ bí ẹni tó ń bá Kọ̀nẹ́líù sọ̀rọ̀, ó sì pa ìtumọ̀ ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: φωνήσας
  choice: ó pe
  rationale: Ìtumọ̀ yìí ṣe kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé participle Gíríìkì náà ń darí sí ìṣe tó tẹ̀ síwájú ní ẹsẹ tó kàn.
- source_word: δύο τῶν οἰκετῶν
  choice: méjì lára àwọn ìránṣẹ́ ilé rẹ̀
  rationale: οἰκέτης ń tọ́ka sí ẹni tó ń ṣe iṣẹ́ ìsìn lábẹ́ ilé kan. ‘Ìránṣẹ́ ilé’ jẹ́ èdè Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ẹrú ilé’ hàn.
- source_word: στρατιώτην εὐσεβῆ
  choice: ọmọ-ogun kan tí ó jẹ́ olùfọkànsìn
  rationale: ‘Ọmọ-ogun’ túmọ̀ στρατιώτης ní tààrà, ‘olùfọkànsìn’ sì fi ìfọkànsìn àti ìbẹ̀rù Ọlọ́run tó wà nínú εὐσεβής hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: lára àwọn tí wọ́n máa ń wà lẹ́gbẹ̀ẹ́ rẹ̀
  rationale: Ó pa ìtumọ̀ pé ọmọ-ogun náà jẹ́ ọ̀kan lára àwọn tó máa ń dúró tì í, tí wọ́n sì ń ṣe iṣẹ́ fún un déédéé mọ́.
theological_decisions:
- issue: Irú ẹni tí ἄγγελος ń tọ́ka sí
  choice: áńgẹ́lì ọ̀run
  alternative: òjíṣẹ́
  rationale: Àyíká Ìṣe 10 sọ pé Kọ̀nẹ́líù rí aṣojú Ọlọ́run nínú ìran; nítorí náà, ‘áńgẹ́lì’ ni ìtumọ̀ tí àyíká béèrè.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, ọ̀wọ̀, àti èdè tí òǹkàwé òde òní lè lóye. Àmì ohùn wà níbi tí wọ́n ti yẹ, a sì lo àtúnṣe gbolohun tó bá ìṣàn Yorùbá mu láìyí ìtumọ̀ orísun padà.
