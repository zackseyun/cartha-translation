revisions:
- from: Nígbà tí áńgẹ́lì tí ń bá a sọ̀rọ̀ náà sì ti lọ, ó pe méjì lára àwọn ìránṣẹ́ ilé rẹ̀[a], àti ọmọ-ogun kan tí ó jẹ́ olùfọkànsìn lára àwọn tí wọ́n máa ń wà lẹ́gbẹ̀ẹ́ rẹ̀.
  to: Nígbà tí áńgẹ́lì tí ń bá a sọ̀rọ̀ náà ti lọ, ó pe méjì lára àwọn ìránṣẹ́ ilé rẹ̀[a], àti ọmọ-ogun kan tí ó jẹ́ olùfọkànsìn lára àwọn tí ń ṣe iṣẹ́ fún un déédéé.
  rationale: The revision replaces an expression of mere proximity with one that communicates the sustained service or attendance in προσκαρτερούντων. It also makes the lexical footnote’s slavery alternative explicit, while retaining the readable main-text term “ìránṣẹ́ ilé.” No theological or interpretive expansion has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:32Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, angel, two household servants, and one devout soldier are conveyed accurately. However, “àwọn tí wọ́n máa ń wà lẹ́gbẹ̀ẹ́ rẹ̀” primarily means people who are regularly beside him and does not adequately express προσκαρτερούντων, which denotes those who continued in attendance/service to him.
  naturalness: The draft is generally fluent Standard Yorùbá with appropriate tone marking. “Àwọn tí ń ṣe iṣẹ́ fún un déédéé” is both natural and more precise for the final participial phrase.
  terminology: “Áńgẹ́lì,” “ìránṣẹ́ ilé,” and “ọmọ-ogun” are suitable. “Olùfọkànsìn” acceptably renders εὐσεβῆ as ‘devout’ without imposing a more specific label. The footnote should state plainly that the alternative denotes household slaves, rather than obscuring that social status.
  issues:
  - severity: medium
    issue: The rendering of τῶν προσκαρτερούντων αὐτῷ is too weak.
    rationale: “Wọ́n máa ń wà lẹ́gbẹ̀ẹ́ rẹ̀” conveys physical proximity, whereas προσκαρτερούντων expresses sustained attendance or service. “Àwọn tí ń ṣe iṣẹ́ fún un déédéé” preserves both the service relationship and continuing aspect.
  - severity: low
    issue: The footnote's explanation of οἰκέται is overly euphemistic.
    rationale: Describing them merely as household members ‘in a service position’ does not clearly communicate the lexical alternative ‘household slaves.’ A direct but careful explanation improves lexical transparency.
  revised_text: Nígbà tí áńgẹ́lì tí ń bá a sọ̀rọ̀ náà ti lọ, ó pe méjì lára àwọn ìránṣẹ́ ilé rẹ̀[a], àti ọmọ-ogun kan tí ó jẹ́ olùfọkànsìn lára àwọn tí ń ṣe iṣẹ́ fún un déédéé.
  revised_footnotes:
  - marker: a
    text: Tàbí, “méjì lára àwọn ẹrú ilé rẹ̀.” Ọ̀rọ̀ Gíríìkì οἰκέται ń tọ́ka sí àwọn ènìyàn inú ilé tí wọ́n ń ṣiṣẹ́ gẹ́gẹ́ bí ẹrú; a lo “ìránṣẹ́ ilé” nínú ẹsẹ yìí gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá, nígbà tí a ṣì pa àyíká ilé náà mọ́.
    reason: lexical_alternative
  revision_rationale: The revision replaces an expression of mere proximity with one that communicates the sustained service or attendance in προσκαρτερούντων. It also makes the lexical footnote’s slavery alternative explicit, while retaining the readable main-text term “ìránṣẹ́ ilé.” No theological or interpretive expansion has been introduced.
