id: ACT.10.28
reference: Acts 10:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ̀yin fúnra yín mọ̀ pé kò bófin mu fún ọkùnrin Júù kan láti bá ọmọ ẹ̀yà mìíràn ṣe àjọṣepọ̀ tàbí láti lọ bẹ̀ ẹ́ wò[a]. Ṣùgbọ́n Ọlọ́run ti fi hàn mí pé kí n má pe ẹnikẹ́ni ní ẹni tí a kò yà sí mímọ́[b] tàbí ẹni aláìmọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kèfèrí”; ἀλλόφυλος túmọ̀ ní tààrà sí ẹni tí ó jẹ́ ti àwọn ènìyàn tàbí ẹ̀yà mìíràn.
    reason: lexical_alternative
  - marker: b
    text: “Ẹni tí a kò yà sí mímọ́” ni a fi túmọ̀ κοινός, ọ̀rọ̀ tí ó yàtọ̀ sí “aláìmọ́” (ἀκάθαρτος). Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ tó wà nínú èdè ìwẹ̀nùmọ́ Júù mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε
  choice: Ó sì wí
  rationale: Ó jẹ́ ọ̀nà àlàyé ìtàn tó rọrùn; “sì” ń pa ìsopọ̀ fẹ́ẹ́rẹ́ tí τέ ní mọ́ láìfi ìtẹ̀lé àkókò kun un.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ẹ̀yin fúnra yín mọ̀
  rationale: Ẹ̀yin tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́; “fúnra yín” ń gbé ìtẹnumọ́ náà jáde lọ́nà àdánidá.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: pé kò bófin mu
  rationale: Ó fi ohun tí a kò gbà láàyè lábẹ́ òfin tàbí àṣà hàn, kì í ṣe àìbójúmu láwùjọ nìkan.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: fún ọkùnrin Júù kan
  rationale: Ó pa ẹyọ ọ̀rọ̀ àti ìtọ́kasí sí akọ tí Gíríìkì ní mọ́.
- source_word: κολλᾶσθαι
  choice: láti bá ... kẹ́gbẹ́
  rationale: Nínú ọ̀rọ̀ ìbáṣepọ̀ láwùjọ yìí, ó túmọ̀ sí dídarapọ̀ mọ́ ẹnì kan tàbí bíbá a ṣe ẹgbẹ́; yíyan yìí ṣe kedere ní Yorùbá.
- source_word: ἢ προσέρχεσθαι
  choice: tàbí láti lọ bẹ̀ ẹ́ wò
  rationale: Ó sọ ìṣe lílọ sí ọ̀dọ̀ ẹni náà tàbí ilé rẹ̀ lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἀλλοφύλῳ
  choice: ọmọ ẹ̀yà mìíràn
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí ẹni láti inú àwọn ènìyàn tàbí ẹ̀yà mìíràn; yíyan yìí yẹra fún fífi ìtumọ̀ ẹ̀sìn tó ju ti ọ̀rọ̀ náà lọ kún un.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Ṣùgbọ́n Ọlọ́run ti fi hàn mí
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ láàárín ohun tí wọ́n mọ̀ tẹ́lẹ̀ àti ìṣípayá Ọlọ́run hàn; “ti fi hàn mí” sì sọ ipa tó ṣì wà nísinsìnyí.
- source_word: μηδένα ... ἄνθρωπον
  choice: ẹnikẹ́ni
  rationale: ἄνθρωπος níbí ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe akọ nìkan.
- source_word: κοινὸν
  choice: ẹni tí a kò yà sí mímọ́
  rationale: Nínú èdè ìwẹ̀nùmọ́ Júù, κοινός lè túmọ̀ sí ohun tí ó wọ́pọ̀ tàbí tí a kò yà sí mímọ́; gbolohun yìí pa ìyàtọ̀ rẹ̀ sí ἀκάθαρτος mọ́.
- source_word: ἢ ἀκάθαρτον
  choice: tàbí ẹni aláìmọ́
  rationale: “Aláìmọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ìwẹ̀nùmọ́ ti ἀκάθαρτος mu, láìdapọ̀ mọ́ κοινός.
theological_decisions:
- issue: Ìbáṣepọ̀ èdè ààlà Júù pẹ̀lú ìṣípayá Ọlọ́run
  choice: A sọ ọ́ gẹ́gẹ́ bí ohun tí kò bófin mu fún ọkùnrin Júù kan, lẹ́yìn náà a pa àtúnṣe Ọlọ́run mọ́ pé kí a má pe ẹnikẹ́ni ní ẹni tí a kò yà sí mímọ́ tàbí ẹni aláìmọ́.
  alternative: Láti sọ ἀθέμιτον di àìbójúmu láwùjọ lásán, tàbí láti pa ìyàtọ̀ àwọn ọ̀rọ̀ ìwẹ̀nùmọ́ méjèèjì rẹ́.
  rationale: Ẹsẹ̀ náà sọ bí Pétérù ṣe lóye àṣà ìyapa Júù, ó sì fi hàn pé ìṣípayá Ọlọ́run tún òye rẹ̀ ṣe. Ìtumọ̀ náà kò gbọ́dọ̀ sọ apá àkọ́kọ́ di ìwà ọmọlúwàbí lásán, bẹ́ẹ̀ ni kò gbọ́dọ̀ ré kọjá ohun tí ọ̀rọ̀ náà sọ. Ohun tí Ọlọ́run fi hàn kan “ẹnikẹ́ni,” nítorí náà a pa lílo ìran náà sí ènìyàn mọ́.
translation_notes:
  register: A lo Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Bá ... kẹ́gbẹ́” yẹra fún àìyédè tí “ṣe pọ̀” lè dá sílẹ̀, “ọmọ ẹ̀yà mìíràn” sì jẹ́ adayeba ju ọ̀rọ̀ àjèjì lọ ní àyíká yìí. A gbe àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ tó bá ἀλλόφυλος mu, àti [b] lẹ́yìn gbolohun tó túmọ̀ κοινός.
