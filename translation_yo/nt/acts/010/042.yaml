language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: yo
  text: Ó sì pàṣẹ fún wa pé kí a kéde fún àwọn ènìyàn, kí a sì fi ìtẹnumọ́ jẹ́rìí pé òun ni ẹni tí Ọlọ́run yàn gẹ́gẹ́ bí onídàájọ́ àwọn alààyè àti àwọn òkú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí Ọlọ́run yàn kalẹ̀ gẹ́gẹ́ bí onídàájọ́ àwọn alààyè àti àwọn òkú.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὁ ὡρισμένος; ó lè túmọ̀ sí ẹni tí Ọlọ́run yàn tàbí yàn kalẹ̀.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àṣẹ aláṣẹ, kì í ṣe ìtọ́ni lásán; “pàṣẹ” mú agbára rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: κηρύξαι
  choice: láti kéde
  rationale: “Kéde” fi ìtumọ̀ ìkéde ní gbangba hàn láì fi í mọ́ ìwàásù inú ìjọ nìkan.
- source_word: τῷ λαῷ
  choice: fún àwọn ènìyàn
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì fi “Ísírẹ́lì” kún un, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí àwọn Júù.
- source_word: διαμαρτύρασθαι
  choice: láti jẹ́rìí tọkàntọkàn
  rationale: “Jẹ́rìí” mú apá ẹ̀rí jáde, “tọkàntọkàn” sì fi bí ẹ̀rí náà ti ṣe pàtàkì tó hàn.
- source_word: οὗτός
  choice: òun
  rationale: Ní àyíká yìí, “òun” tọ́ka sí Jésù pẹ̀lú ìtẹnumọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá ju “èyí” lọ fún ẹni.
- source_word: ὁ ὡρισμένος
  choice: ẹni tí Ọlọ́run yàn sípò
  rationale: “Yàn sípò” ṣàfihàn ìyàn láṣẹ àti ipò tí ó ń bá a lọ, láì gbé ìtumọ̀ ẹ̀sìn míì wọ ọ̀rọ̀ náà.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: tí Ọlọ́run yàn
  rationale: Ìṣètò yìí fi Ọlọ́run hàn kedere gẹ́gẹ́ bí olùṣe ìyàn náà, ó sì bá ìrísí Yorùbá mu.
- source_word: κριτὴς
  choice: onídàájọ́
  rationale: “Onídàájọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ó ní àṣẹ láti dájọ́.
- source_word: ζώντων καὶ νεκρῶν
  choice: àwọn alààyè àti àwọn òkú
  rationale: Ìtumọ̀ yìí pa ìwọ̀n gbogbo ènìyàn tí gbólóhùn Gíríìkì náà ní mọ́, pẹ̀lú ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ rẹ̀.
theological_decisions:
- issue: Agbára ìyàn Jésù láti ṣe ìdájọ́
  choice: ẹni tí Ọlọ́run yàn sípò láti ṣe onídàájọ́ àwọn alààyè àti àwọn òkú
  alternative: ẹni tí Ọlọ́run fi jẹ́ onídàájọ́ àwọn alààyè àti àwọn òkú
  rationale: 'Ìtumọ̀ náà sọ ohun tí ẹsẹ náà sọ ní tààrà: Ọlọ́run ló yan Jésù sí ipò onídàájọ́ gbogbo ènìyàn. Kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó kọjá ọ̀rọ̀ orísun kún un.'
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo “kéde” fún ìpolongo ní gbangba, “jẹ́rìí tọkàntọkàn” fún ẹ̀rí líle koko, àti “yàn sípò” fún ìyàn aláṣẹ.
