revisions:
- from: Ohùn kan sì tún tọ̀ ọ́ wá ní ìgbà kejì pé, “Ohun tí Ọlọ́run ti sọ di mímọ́[a] ni kí ìwọ má ṣe pè ní ohun àìmọ́.”
  to: Ohùn kan sì tún tọ̀ ọ́ wá ní ìgbà kejì pé, “Ohun tí Ọlọ́run ti sọ di mímọ́[a], ìwọ má ṣe kà sí ohun tí kò yẹ ní ti ìsìn.”
  rationale: Àtúnṣe náà dáàbò bo ìyàtọ̀ ọ̀rọ̀ Gíríìkì láàárín καθαρίζω àti κοινόω. ‘Kà sí ohun tí kò yẹ ní ti ìsìn’ jẹ́ ìtumọ̀ tí ó ṣàlàyé ẹ̀ka ìwẹ̀numọ́ ti ‘common/profane’ ní Yorùbá ode òní, nígbà tí àlàyé ìsàlẹ̀ ń pa ‘àìmọ́’ àti ‘ẹlẹ́gbin’ mọ́ gẹ́gẹ́ bí àwọn àṣàyàn ìtumọ̀.
  reviewer_model: gpt-5.6-terra
