id: ACT.10.15
reference: Acts 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: yo
  text: Ohùn kan sì tún tọ̀ ọ́ wá ní ìgbà kejì pé, “Ohun tí Ọlọ́run ti sọ di mímọ́[a], ìwọ má ṣe kà sí ohun tí kò yẹ ní ti ìsìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun tí Ọlọ́run ti sọ di mímọ́, ìwọ má ṣe pè ní ohun àìmọ́,” tàbí, “má ṣe hùwà sí i bí ohun ẹlẹ́gbin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Ohùn kan
  rationale: Ọ̀rọ̀ náà kò ní article ní Gíríìkì; ‘ohùn kan’ jẹ́ àdámọ̀ Yorùbá, ó sì dojú kọ ọ̀rọ̀ tí a gbọ́ láti ọ̀run láì fi orúkọ ẹni tó ń sọ ọ́ kún un.
- source_word: πάλιν ἐκ δευτέρου
  choice: tún ... ní ìgbà kejì
  rationale: Èyí pa méjèèjì mọ́—ìtúnwá àti pé ó ṣẹlẹ̀ ní ìgbà kejì—gẹ́gẹ́ bí ìtẹnumọ́ inú Gíríìkì.
- source_word: πρὸς αὐτόν
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀nà Yorùbá tó bójú mu láti sọ pé a darí ọ̀rọ̀ náà sí i.
- source_word: Ἃ
  choice: Ohun tí
  rationale: Ó ṣàkójọ ohun gbogbo tí ọ̀rọ̀ náà ń tọ́ka sí ní ọ̀nà àdámọ̀ Yorùbá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ọ̀rọ̀ Yorùbá tí a sábà lò fún Ọlọ́run kan ṣoṣo.
- source_word: ἐκαθάρισεν
  choice: ti sọ di mímọ́
  rationale: Ó fi ìṣe Ọlọ́run tó ti ṣẹlẹ̀ hàn, ó sì pa ìtumọ̀ ìwẹ̀numọ́ tàbí yíyọ kúrò nínú àìmọ́ mọ́.
- source_word: σὺ
  choice: ìwọ
  rationale: Fífi arọ́pò-orúkọ alágbára ‘ìwọ’ sí i pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: μὴ κοίνου
  choice: má ṣe pè ní ohun àìmọ́
  rationale: Nínú àyíká èdè ìwẹ̀numọ́, κοινόω túmọ̀ sí kíkà ohun sí ohun tí kò yẹ fún lílò mímọ́ tàbí ohun ẹlẹ́gbin. ‘Àìmọ́’ jẹ́ ọ̀nà Yorùbá tó yé kedere, bí ó tilẹ̀ jẹ́ pé kò fi ìyàtọ̀ ọ̀rọ̀ Gíríìkì láàárín κοινός àti ἀκάθαρτος hàn ní kíkún; àlàyé ìsàlẹ̀ pa àṣàyàn yòókù mọ́.
theological_decisions:
- issue: Ìtumọ̀ èdè ìwẹ̀numọ́ nínú ìran Peteru
  choice: Lo ‘ohun àìmọ́’ nínú ọ̀rọ̀ àkọ́kọ́, kí àlàyé ìsàlẹ̀ sì fi ‘ohun tí kò mọ́’ àti ‘ohun ẹlẹ́gbin’ hàn.
  alternative: ‘ohun lásán’ tàbí ‘ohun tí kò mọ́’
  rationale: Yorùbá ‘ohun lásán’ kò fi ìtumọ̀ àìyẹ nípa ìlànà ìwẹ̀numọ́ hàn dáadáa, ó sì lè dà bí ẹni pé ohun tí kò ṣe pàtàkì ni. ‘Ohun àìmọ́’ jẹ́ kedere sí òǹkàwé òde òní, ṣùgbọ́n àlàyé náà jẹ́wọ́ pé κοινόω ní ìtumọ̀ kíkà tàbí hùwà sí ohun bí ohun tí kò mọ́ tàbí ohun ẹlẹ́gbin.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà pa ìtẹnumọ́ ‘tún ... ní ìgbà kejì’ àti ‘ìwọ’ mọ́.
