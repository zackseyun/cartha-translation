source:
  edition: SBLGNT
  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: yo
  text: Nítorí náà, nígbà tí a ránṣẹ́ pè mí, mo wá láìtakò[a]. Nísinsìnyí, mo béèrè pé, “Kí ni ìdí tí ẹ fi ránṣẹ́ pè mí?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “láìṣiyèméjì.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “láìtakò” tàbí “láìjiyàn.”
    reason: lexical_alternative
  - marker: b
    text: Àbí, “Nítorí ìdí wo ni ẹ ṣe ránṣẹ́ pè mí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò hàn láti inú ohun tí Pétérù ṣẹ̀ṣẹ̀ ṣàlàyé. Agbára kékeré tí καὶ fi kún un wà nínú bí gbólóhùn náà ṣe ń ṣàn, láìfi ọ̀rọ̀ àfikún tí kò bá Yorùbá mu sí i.
- source_word: ἀναντιρρήτως
  choice: láìtakò
  rationale: Ó túmọ̀ sí pé kò sọ̀rọ̀ lòdì sí ìpè náà, kò sì kọ̀ láti wá; èyí sún mọ́ ìtumọ̀ Gíríìkì ju ‘láìṣiyèméjì’ lọ.
- source_word: ἦλθον
  choice: mo wá
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἦλθον.
- source_word: μεταπεμφθείς
  choice: nígbà tí a ránṣẹ́ pè mí
  rationale: Ó pa ìṣe aláìdárúkọ olùṣe tí participle passive náà ní mọ́, ó sì sọ ìtumọ̀ ‘ránṣẹ́ pè’ ní Yorùbá àdánidá.
- source_word: πυνθάνομαι οὖν
  choice: Ǹjẹ́ mo béèrè pé
  rationale: ‘Ǹjẹ́’ ń ṣiṣẹ́ gẹ́gẹ́ bí àmì ìyípadà sí ìbéèrè, ‘mo béèrè’ sì mú ìtumọ̀ ìwádìí ọ̀rọ̀ náà jáde ní èdè òde òní.
- source_word: τίνι λόγῳ
  choice: Kí ni ìdí tí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè ‘fún ìdí wo,’ ó sì pa èrò ìdí tàbí ìdílé ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μετεπέμψασθέ με
  choice: ẹ fi ránṣẹ́ pè mí
  rationale: Ó bá gbólóhùn àkọ́kọ́ mu, ó sì tọ́ka sí àwọn ẹni púpọ̀ tí Pétérù ń bá sọ̀rọ̀, gẹ́gẹ́ bí ọ̀rọ̀-ìṣe Gíríìkì ṣe fi hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó ṣe kedere, tí ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Pétérù ń bá sọ̀rọ̀, a sì pa ìtumọ̀ ìtakò nínú ἀναντιρρήτως mọ́.
