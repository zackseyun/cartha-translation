source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: yo
  text: Nítorí náà, ránṣẹ́ sí Jópà, kí o sì pe Símónì wá[a], ẹni tí a ń pè ní Pétérù. Ó ń gbé gẹ́gẹ́ bí àlejò[b] ní ilé Símónì aláwọ̀, lẹ́gbẹ̀ẹ́ òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí o sì ránṣẹ́ pe Símónì”; ọ̀rọ̀ Gíríìkì náà túmọ̀ sí mímú kí a pe ẹnì kan wá sọ́dọ̀ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń gbé níbẹ̀”; ọ̀rọ̀ Gíríìkì náà fi hàn pé Pétérù ń gbé ní ilé náà gẹ́gẹ́ bí àlejò.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Nítorí náà, ránṣẹ́ sí Jópà
  rationale: “Nítorí náà” fi ìbáṣepọ̀ ọ̀rọ̀ yìí pẹ̀lú ìfihàn tó ṣáájú hàn; “ránṣẹ́ sí” sì jẹ́ ọ̀nà Yorùbá àdánidá fún àṣẹ láti fi àwọn ìránṣẹ́ lọ sí ibì kan.
- source_word: μετακάλεσαι
  choice: kí o sì pe … wá
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí mímú kí a pe ẹnì kan wá sọ́dọ̀ ẹni tó ń pàṣẹ. “Pe … wá” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa agbára àṣẹ náà mọ́.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Símónì, ẹni tí a ń pè ní Pétérù
  rationale: Ó fi orúkọ mìíràn tí a fi mọ Símónì hàn láìfi ìtumọ̀ míì kún un.
- source_word: ξενίζεται
  choice: Ó ń ṣe àlejò
  rationale: Fọ́ọ̀mù ọ̀rọ̀ náà tọ́ka sí pé Pétérù ń gbé níbẹ̀ gẹ́gẹ́ bí àlejò tí wọ́n gbà sí ilé, kì í ṣe pé ilé náà jẹ́ tirẹ̀.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: ní ilé Símónì aláwọ̀
  rationale: “Ilé” dúró fún οἰκία, “aláwọ̀” sì jẹ́ ọ̀nà kúkúrú àti èyí tí a mọ̀ ní Yorùbá láti sọ iṣẹ́ ẹni tó ń ṣe awọ ẹranko.
- source_word: παρὰ θάλασσαν
  choice: lẹ́gbẹ̀ẹ́ òkun
  rationale: Ó fi hàn pé ilé náà wà lẹ́bàá tàbí nítòsí etí òkun.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àwọn orúkọ mọ́ ní ìrísí Yorùbá tí ó wọ́pọ̀.
