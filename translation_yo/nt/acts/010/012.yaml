  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: yo
  text: Nínú rẹ̀ ni gbogbo àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin, àwọn ohun alààyè tí ń rákò lórí ilẹ̀[a], àti àwọn ẹyẹ ojú ọ̀run[b] wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tí ń rákò lórí ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹyẹ ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ohun bí aṣọ ńlá tí Peteru rí. “Nínú rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ ibi tí wọ́n wà hàn.
- source_word: ὑπῆρχεν
  choice: ni ... wà
  rationale: Ọ̀rọ̀-ìṣe náà fi hàn pé àwọn ẹ̀dá náà wà nínú ohun tí Peteru rí; àkójọpọ̀ “ni ... wà” jẹ́ èdè Yorùbá tó ṣe kedere láìfi ìtumọ̀ “ó kó wọn sínú” kún un.
- source_word: πάντα
  choice: gbogbo
  rationale: Èyí pa ìtẹnumọ́ tó gbòòrò mọ́ láìsọ ọ́ di “onírúurú gbogbo,” èyí tí yóò fi ìtumọ̀ míì kún ọ̀rọ̀ Gíríìkì.
- source_word: τὰ τετράποδα
  choice: àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin
  rationale: Ìtumọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá òde òní, ó sì dúró pẹ̀lú ìtumọ̀ tààrà pé ẹranko tí ó ní ẹsẹ̀ mẹ́rin.
- source_word: ἑρπετὰ τῆς γῆς
  choice: àwọn ohun alààyè tí ń rákò lórí ilẹ̀
  rationale: ἑρπετά lè ní ìtumọ̀ tó gbòòrò ju àwọn ẹranko afàyàfà lọ; “ohun alààyè tí ń rákò” pa ìwọ̀n ìtumọ̀ yẹn mọ́, “lórí ilẹ̀” sì ṣàfihàn τῆς γῆς lọ́nà àdánidá.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: “Àwọn ẹyẹ” jẹ́ ìtumọ̀ tó ṣe kedere ní àkójọ àwọn ẹ̀dá yìí, “ojú ọ̀run” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ojú sánmà níbi yìí.
- source_word: καὶ ... καὶ
  choice: '..., ... àti ...'
  rationale: Àtòjọ Yorùbá àdánidá fi àmì kọ́má àti “àti” ṣọ̀kan àwọn ẹ̀ka mẹ́tẹ̀ẹ̀ta, bó tilẹ̀ jẹ́ pé Gíríìkì tún καί ṣe.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojú, ọ̀wọ̀, àti èyí tí ó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yẹra fún ọ̀rọ̀ ìmọ̀-ẹranko tó le tàbí èdè ẹ̀sìn ẹlẹ́gbẹ́ kan.
