source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru gbé e dìde[a], ó ní, “Dìde[b]; èmi fúnra mi náà jẹ́ ènìyàn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbé e sókè” tàbí “ràn án lọ́wọ́ láti dìde.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Dúró sókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: gbé e dìde
  rationale: Ọ̀rọ̀ yìí ṣàfihàn pé Peteru mú Kọneliu kúrò ní ipò ìdọ̀bálẹ̀ rẹ̀, láìfi kún ọ̀nà pàtó tí ó gbà ràn án lọ́wọ́.
- source_word: Ἀνάστηθι
  choice: Dìde
  rationale: Àṣẹ kúkúrú yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fún ẹni tí ó wà nílẹ̀ pé kí ó dìde sí ẹsẹ̀ rẹ̀.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: èmi fúnra mi pẹ̀lú
  rationale: 'Ó pa ìtẹnumọ́ àti ìfaramọ́ mọ́: Peteru fúnra rẹ̀ náà wà lára àwọn ènìyàn.'
- source_word: ἄνθρωπός εἰμι
  choice: jẹ́ ènìyàn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì bójú mu ní Yorùbá; kò fi ọ̀rọ̀ bí ‘lásán’ kún ohun tí Gíríìkì sọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín ìdọ̀bálẹ̀ Kọneliu ní ẹsẹ̀ Peteru àti ìṣe àtúnṣe Peteru.
theological_decisions:
- issue: Ìdáhùn Peteru sí ìdọ̀bálẹ̀ Kọneliu níwájú rẹ̀
  choice: A pa ọ̀rọ̀ Peteru mọ́ gẹ́gẹ́ bí ìkọ̀sílẹ̀ ọlá tí ń gbé e ga ju ipò ènìyàn lọ, nípa fífi ìjọra ènìyàn wọn hàn.
  alternative: A lè ka ọ̀rọ̀ náà gẹ́gẹ́ bí ìrẹ̀lẹ̀ Peteru lásán, láìfa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò jáde.
  rationale: ‘Dìde; èmi fúnra mi pẹ̀lú jẹ́ ènìyàn’ pa ìtumọ̀ gbangba àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́, láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Peteru’ gẹ́gẹ́ bí ìkọ̀wé orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá.
