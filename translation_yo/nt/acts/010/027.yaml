revisions:
- from: Ó sì bá a sọ̀rọ̀ bí ó ti ń wọlé[a], ó sì rí ọ̀pọ̀ ènìyàn tí wọ́n ti péjọ.
  to: Bí ó ti ń bá a sọ̀rọ̀, ó wọlé, ó sì rí ọ̀pọ̀ ènìyàn tí wọ́n ti péjọ.[a]
  rationale: A tún ìṣètò gbolóhùn náà ṣe kí participle present συνομιλῶν lè hàn ní kedere gẹ́gẹ́ bí ìṣe tó ń lọ nígbà ìwọlé. A pa aorist “ó wọlé,” historical present tí a túmọ̀ sí ìtàn-ìṣẹ̀lẹ̀ ti ìgbàanì nínú Yorùbá ní “ó sì rí,” àti ìtumọ̀ perfect participle náà ní “tí wọ́n ti péjọ” mọ́. A tún gbe àmì àlàyé sí òpin gbolóhùn kí ó má bà ìṣètò ìṣe náà jẹ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì ní pàtàkì: ìbánisọ̀rọ̀ ń lọ nígbà tí Peteru wọlé; ó sì rí ọ̀pọ̀ ènìyàn tí wọ́n ti péjọ. Ṣùgbọ́n ìṣètò gbolóhùn nínú àkọsílẹ̀ lọwọlọwọ—“Ó sì bá a sọ̀rọ̀ bí ó ti ń wọlé”—le jẹ́ kí ó dà bí ẹni pé ìwọlé ni ìṣẹ̀lẹ̀ abẹ́lẹ̀, dípò kí ìbánisọ̀rọ̀ jẹ́ ìṣe tó ń lọ pẹ̀lú ìwọlé, gẹ́gẹ́ bí participle náà ṣe hàn.'
