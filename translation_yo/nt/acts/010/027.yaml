  terminology: Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí orúkọ tó nílò àtúnṣe. “wọlé,” “rí,” àti “ọ̀pọ̀ ènìyàn” bá ìtumọ̀ orísun mu.
