source:
  edition: SBLGNT
  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: yo
  text: Bí ó ti ń bá a sọ̀rọ̀, ó wọlé, ó sì rí ọ̀pọ̀ ènìyàn tí wọ́n ti péjọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó wọlé nígbà tí ó ń bá a sọ̀rọ̀, ó sì rí ọ̀pọ̀ ènìyàn tí wọ́n ti péjọ.” Èdè Gíríìkì náà lo ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí fún “ó sì rí” láti mú kí ìtàn náà hàn bí ohun tó ń ṣẹlẹ̀ lójú ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: bá a sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ present participle, ó sì fi hàn pé ìbánisọ̀rọ̀ náà ń lọ lọ́wọ́ nígbà tí ó wọlé. ‘Bá a sọ̀rọ̀’ jẹ́ èdè Yorùbá àdánidá tí ó tún pa ìtumọ̀ ìjíròrò mọ́.
- source_word: αὐτῷ
  choice: a
  rationale: Dative náà tọ́ka sí ẹni tí Peteru ń bá sọ̀rọ̀; nínú ‘bá a sọ̀rọ̀,’ ọ̀rọ̀ arọ́pò-orúkọ ‘a’ túmọ̀ sí ‘pẹ̀lú rẹ̀/òun’ ní ọ̀nà àdánidá.
- source_word: εἰσῆλθεν
  choice: wọlé
  rationale: Aorist main verb náà sọ ìṣẹ̀lẹ̀ tó tẹ̀ lé e. ‘Wọlé’ ṣe kedere, ó sì bá ìṣísẹ̀ wọn sínú ilé mu.
- source_word: εὑρίσκει
  choice: rí
  rationale: Bí ó tilẹ̀ jẹ́ pé Greek lo historical present fún ìtàn alárinrin, past narrative ni Yorùbá àdánidá nínú àyíká yìí; ‘ó sì rí’ jẹ́ kíkà tó rọrùn.
- source_word: συνεληλυθότας
  choice: tí wọ́n ti péjọ
  rationale: Perfect participle náà fi hàn pé àwọn ènìyàn náà ti kóra jọ, wọ́n sì wà ní ipò yẹn nígbà tí Peteru dé. ‘Tí wọ́n ti péjọ’ pa ìṣe tó ti ṣẹlẹ̀ àti àbájáde rẹ̀ mọ́.
- source_word: πολλούς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ fún ọ̀pọ̀ ènìyàn. Fífi ‘ènìyàn’ kún un mú kí Yorùbá ṣe kedere, kí ó sì dun mọ́ni létí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘bí ó ti ń wọlé’ láti so ìbánisọ̀rọ̀ tó ń lọ lọ́wọ́ mọ́ ìwọlé, láì sọ ohun tí Greek kò sọ ní pàtó.
