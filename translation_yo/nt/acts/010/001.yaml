  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: yo
  text: Ọkùnrin kan[a] wà ní Kesaria, ẹni tí orúkọ rẹ̀ ń jẹ́ Kọneliusi. Ó jẹ́ balógun ọgọ́rùn-ún nínú ẹgbẹ́ ọmọ ogun tí a ń pè ní Ẹgbẹ́ ọmọ ogun Ítálì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọkùnrin kan pàtó wà ní Kesaria.” Gíríìkì náà lo ọ̀nà kan láti fi ẹni tuntun kan tí ìtàn ṣẹ̀ṣẹ̀ ń mú wọlé hàn.
    reason: lexical_alternative
  - marker: b
    text: ‘Ẹgbẹ́ ọmọ ogun’ jẹ́ ẹ̀ka kan nínú àwọn ọmọ ogun ilẹ̀ Róòmù. Ó ṣeé ṣe kí ‘Ẹgbẹ́ ọmọ ogun Ítálì’ tọ́ka sí ẹgbẹ́ tí ó ní ìbáṣepọ̀ pẹ̀lú Ítálì tàbí tí àwọn ọmọ ogun ará Ítálì wà nínú rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ … τις
  choice: Ọkùnrin kan
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ọkùnrin àgbà kan tí ìtàn ṣẹ̀ṣẹ̀ ń mú wọlé hàn láì sọ pé ẹni pàtó tí a ti mọ̀ tẹ́lẹ̀ ni; ‘Ọkùnrin kan’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: δέ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò lágbára bí ìtakora; ‘sì’ mú ìṣàn gbólóhùn náà lọ láì fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν Καισαρείᾳ
  choice: ní Kesaria
  rationale: Ó jẹ́ gbólóhùn ibi; ‘Kesaria’ jẹ́ àkọsílẹ̀ orúkọ ibùdó náà ní ọ̀nà tó bá ìró rẹ̀ mu ní Yorùbá.
- source_word: ὀνόματι Κορνήλιος
  choice: orúkọ rẹ̀ sì ń jẹ́ Kọneliusi
  rationale: Ìtumọ̀ àdánidá fún ọ̀nà Gíríìkì tí ó túmọ̀ sí ‘ẹni tí orúkọ rẹ̀ ń jẹ́’; a kọ orúkọ ẹni náà gẹ́gẹ́ bí ìró Yorùbá.
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Ó tọ́ka sí ọ̀gá ọmọ ogun Róòmù tí ó jẹ́ centurion; ‘balógun ọ̀rún’ jẹ́ kíkún ní ṣókí, ó sì rọrùn fún òǹkàwé Yorùbá.
- source_word: ἐκ σπείρης
  choice: nínú ẹgbẹ́ ọmọ ogun
  rationale: σπεῖρα jẹ́ ẹ̀ka ọmọ ogun Róòmù; ‘ẹgbẹ́ ọmọ ogun’ sọ iṣẹ́ rẹ̀ di mímọ̀ láì lo ọ̀rọ̀ àjèjì.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: tí a ń pè ní Ẹgbẹ́ Itali
  rationale: Ó pa ìtumọ̀ ‘tí a ń pè ní’ mọ́, ó sì fi Itali hàn gẹ́gẹ́ bí orúkọ tàbí àpèjúwe ẹgbẹ́ náà.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Balógun ọ̀rún’ àti ‘ẹgbẹ́ ọmọ ogun’ jẹ́ ọ̀rọ̀ tí òǹkàwé gbogbogbò lè lóye, nígbà tí àlàyé ìtàn Róòmù wà ní àlàyé ìsàlẹ̀.
