    rationale: Bí ó tilẹ̀ jẹ́ pé a lè ló ó gẹ́gẹ́ bí ìfojúsùn ìtàn ní àwọn àyíká kan, níbí ó mú gbolohun náà dùn bí ẹni pé a ti mọ ohun tí ó rí. Orísun náà sọ ní kedere pé angẹli ni ohun tí ó rí; fífi í hàn nínú gbolohun Yorùbá mú ìtumọ̀ náà yéye.
