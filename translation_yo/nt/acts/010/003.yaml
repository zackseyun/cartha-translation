revisions:
- from: Ó rí i ní kedere[b] nínú ìran, ní nǹkan bí wákàtí kẹ́sàn-án ọjọ́[a], pé angẹli Ọlọ́run kan wọlé tọ̀ ọ́ wá, ó sì wí fún un pé, “Kọ̀nẹ́líù.”
  to: Nínú ìran, ó rí angẹli Ọlọ́run kan ní kedere[b], ní nǹkan bí wákàtí kẹ́sàn-án ọjọ́[a], bí angẹli náà ṣe wọlé sí ọ̀dọ̀ rẹ̀, tí ó sì sọ fún un pé, “Kọ̀nẹ́líù.”
  rationale: A tún ọ̀rọ̀ náà ṣe kí ohun tí Kọ̀nẹ́líù rí—“angẹli Ọlọ́run kan”—farahàn láìsí aṣojú-ọ̀rọ̀ àìlótọ́ka. A tún “wọlé tọ̀ ọ́ wá” ṣe sí “wọlé sí ọ̀dọ̀ rẹ̀” fún ìtẹ̀síwájú Yorùbá tí ó ṣe kedere. Àmì [a] àti [b] wà níbi tí ó bá àlàyé ìsàlẹ̀ kọ̀ọ̀kan mu, àti pé ìtumọ̀ ẹsẹ náà kò yípadà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:35Z'
