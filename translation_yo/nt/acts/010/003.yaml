id: ACT.10.3
reference: Acts 10:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: yo
  text: Nínú ìran, ó rí angẹli Ọlọ́run kan ní kedere[b], ní nǹkan bí wákàtí kẹ́sàn-án ọjọ́[a], bí angẹli náà ṣe wọlé sí ọ̀dọ̀ rẹ̀, tí ó sì sọ fún un pé, “Kọ̀nẹ́líù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni nǹkan bí aago mẹ́ta ọ̀sán gẹ́gẹ́ bí ìṣírò àkókò òde òní.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ní gbangba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Ó rí i
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣà ìtàn ní àsìkò àtijọ́, ó sì ń sọ ní tààrà pé ó rí ohun kan; “Ó rí i” jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν ὁράματι
  choice: nínú ìran
  rationale: “Ìran” ń tọ́ka sí ohun àrà tí a fi hàn ènìyàn, láìfikún àlàyé nípa bí ìran náà ṣe ṣẹlẹ̀.
- source_word: φανερῶς
  choice: ní kedere
  rationale: Ó fi hàn pé ìran náà ṣe kedere, kì í ṣe ohun tí kò dá a lójú. A fi àṣàyàn “ní gbangba” sínú àlàyé ìsàlẹ̀.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: ní nǹkan bí wákàtí kẹ́sàn-án ọjọ́
  rationale: A pa ìṣírò wákàtí inú orísun mọ́, a sì lo “ní nǹkan bí” fún ìtumọ̀ ὡσεὶ περὶ. Àkókò òde òní wà nínú àlàyé ìsàlẹ̀.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: angẹli Ọlọ́run kan
  rationale: Nínú ìran yìí, ἄγγελος túmọ̀ sí ẹ̀dá ọ̀run tí Ọlọ́run rán, “angẹli” sì jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn mọ̀ fún un.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: wọlé tọ̀ ọ́ wá
  rationale: Ó pa ìṣípò wọlé àti wíwá sí ọ̀dọ̀ Kọ̀nẹ́líù méjèèjì mọ́ ní èdè Yorùbá àdánidá.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: ó sì wí fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé participle ni Gíríìkì lò, gbolohun ọ̀rọ̀-ìṣe yìí dára sí i ní Yorùbá, ó sì pa ìtẹ̀síwájú ìṣe náà mọ́.
- source_word: Κορνήλιε
  choice: Kọ̀nẹ́líù
  rationale: Èyí jẹ́ ìpè tààrà sí Kọ̀nẹ́líù; fọ́ọ̀mù ìpè Gíríìkì kò nílò àmì gírámà ọ̀tọ̀ ní Yorùbá.
theological_decisions:
- issue: Irú ẹni tí ἄγγελος jẹ́ nínú àyíká ọ̀rọ̀ yìí
  choice: angẹli, ìyẹn ẹ̀dá ọ̀run tí Ọlọ́run rán
  alternative: òjíṣẹ́ ènìyàn
  rationale: Ìṣẹ̀lẹ̀ náà wáyé nínú ìran, ó sì pe ẹni náà ní “ti Ọlọ́run”; nítorí náà, ẹ̀dá ọ̀run ni ìtumọ̀ tó ṣe kedere jù láìfikún ẹ̀kọ́ ẹ̀sìn tí kò sí nínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A gbé àmì [a] lẹ́gbẹ̀ẹ́ ìṣírò wákàtí tí àlàyé rẹ̀ ń ṣàlàyé, a sì gbé [b] lẹ́gbẹ̀ẹ́ “ní kedere,” dípò fífi àwọn àmì náà sí ibi tí kò bá àkóónú àlàyé wọn mu.
