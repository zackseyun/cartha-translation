    rationale: “Tọ̀ ọ́ wá” lè jẹ́ ìsọ̀rọ̀ ọlọ́rọ̀, ṣùgbọ́n “wọlé sí ọ̀dọ̀ rẹ̀” jẹ́ kedere, ó sì pa ìṣísẹ̀ wíwọlé àti ìdarí sí Kọ̀nẹ́líù mọ́.
