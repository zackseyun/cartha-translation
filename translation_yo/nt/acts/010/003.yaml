  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú àwọn kókó Gíríìkì náà wá: ìran, ìfarahàn tó ṣe kedere, àkókò wákàtí kẹ́sàn-án, angẹli Ọlọ́run, wíwọlé sí Kọ̀nẹ́líù, àti ìpè orúkọ rẹ̀. Síbẹ̀, “Ó rí i” ní ìbẹ̀rẹ̀ fi aṣojú-ọ̀rọ̀ tí kò tíì ní ohun tí ó ń tọ́ka sí hàn, ó sì lè dà bí ẹni pé ohun mìíràn ni ó rí. Àtúnṣe náà sọ angẹli náà di ohun tí ó rí ní kedere, láìfi ìtumọ̀ kún orísun.'
  naturalness: “Nínú ìran, ó rí angẹli Ọlọ́run kan ní kedere” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì yéye ju “Ó rí i ní kedere nínú ìran” lọ. “Wọlé sí ọ̀dọ̀ rẹ̀” tún ṣàfihàn εἰσελθόντα πρὸς αὐτόν ní kedere, láìlo “tọ̀ ọ́ wá,” èyí tí ó lè ní ìmọ̀ ‘wá a’ tàbí ‘lọ sí ibi rẹ̀’ tí kò péye.
  terminology: “Ìran,” “angẹli Ọlọ́run,” àti “Kọ̀nẹ́líù” yẹ, wọ́n sì bá ìforúkọsílẹ̀ ìjọsìn Yorùbá àti ọ̀rọ̀ orísun mu. A pa “wákàtí kẹ́sàn-án ọjọ́” mọ́ nínú ara ẹsẹ náà; àlàyé [a] ń fún ni ní ìṣírò òde òní.
  issues:
