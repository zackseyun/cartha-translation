  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: yo
  text: Ó sì rí ọ̀run tí ó ṣí sílẹ̀[a], àti ohun kan[b] tí ó dà bí aṣọ ńlá, tí ń sọ̀ kalẹ̀, tí a ń fi igun rẹ̀ mẹ́rin[c] sọ̀ kalẹ̀ sí ilẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ojú ọ̀run tí ó ṣí sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀run tàbí ojú ọ̀run; a yan “ọ̀run” níbí nítorí pé ìṣẹ̀lẹ̀ náà jẹ́ ìran ìfihàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun èlò kan” tàbí “ohun ìkó-nǹkan kan.” Ọ̀rọ̀ Gíríìkì σκεῦός τι kò sọ irú ohun náà ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí a ń fi òpin rẹ̀ mẹ́rin sọ̀ kalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: Ó sì rí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú ìtàn Gíríìkì, ó sì ń mú ìran náà hàn bí ohun tó ń ṣẹlẹ̀ lójú ẹni; ‘rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì taara.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: ọ̀run tí ó ṣí sílẹ̀
  rationale: ‘Ọ̀run’ lè dúró fún heaven tàbí sky ní Yorùbá bí οὐρανός ṣe lè rí; nínú ìran ìfihàn yìí, ó pa agbára ìtumọ̀ ọ̀run mọ́ láì dí ìtumọ̀ mìíràn mọ́lẹ̀.
- source_word: καταβαῖνον
  choice: ń sọ̀ kalẹ̀
  rationale: Ó fi ìṣípò ohun náà sí ìsàlẹ̀ hàn ní ọ̀nà tó jẹ́ ti Yorùbá àdánidá.
- source_word: σκεῦός τι
  choice: ohun kan
  rationale: σκεῦος ní ìtumọ̀ gbòòrò bí ohun èlò tàbí ohun ìkó-nǹkan; ‘ohun kan’ pa àìdájú τι mọ́, kò sì fi irú ohun náà múlẹ̀ ju bí orísun ṣe ṣe lọ.
- source_word: ὡς ὀθόνην μεγάλην
  choice: bí aṣọ ńlá
  rationale: ‘Bí’ pa àfiwé ὡς mọ́; ‘aṣọ ńlá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ aṣọ gbígbòòrò láì fi ohun tí a fi ṣe é kún ọ̀rọ̀.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: ní igun rẹ̀ mẹ́rẹ̀ẹ̀rin
  rationale: ἀρχή túmọ̀ sí àwọn òpin níbí; fún ohun tó dà bí aṣọ, ‘igun’ ni ọ̀rọ̀ Yorùbá tó bójú mu jù, ‘rẹ̀’ sì ń tọ́ka sí ohun náà lọ́nà àdánidá.
- source_word: καθιέμενον
  choice: tí a ń fi ... sọ̀ kalẹ̀
  rationale: Ìṣẹ̀lẹ̀ aláìlórúkọ nínú Yorùbá pa ohùn àìṣe olùṣe pàtó ti participle náà mọ́, ó sì yà á sọ́tọ̀ kúrò nínú ‘ń sọ̀ kalẹ̀’ tó ṣáájú.
- source_word: ἐπὶ τῆς γῆς
  choice: sí ilẹ̀
  rationale: Pẹ̀lú ìṣípò sí ìsàlẹ̀, ‘sí ilẹ̀’ fi ibi tí ohun náà ń lọ hàn lọ́nà Yorùbá tó rọrùn, ó sì lè túmọ̀ sí earth tàbí ground gẹ́gẹ́ bí àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú ìran ìfihàn
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: ‘Ọ̀run’ bójú mu fún ìran tí ohun kan ti ń sọ̀ kalẹ̀ láti ibi tí ó ṣí, ó sì pa agbára ìfihàn Ọlọ́run mọ́. Àmì ẹsẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ‘ojú ọ̀run’ tún ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ó sì rí’ fún ìtẹ̀síwájú ìtàn, ‘ohun kan’ láti pa àìdájú orísun mọ́, àti ‘tí a ń fi ... sọ̀ kalẹ̀’ láti fi ohùn àìṣe hàn láì dá ẹni tó ń ṣe é mọ̀.
