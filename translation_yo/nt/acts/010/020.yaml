  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: yo
  text: 'Ṣùgbọ́n dìde, sọ̀kalẹ̀, kí o sì bá wọn lọ láìṣiyèméjì rárá,[a] nítorí èmi ni mo ti rán wọn.


    [a] Tàbí “láìṣe ìyàtọ̀ kankan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé kí o má ṣe ṣiyèméjì tàbí kí o má ṣe ṣe ìyàtọ̀ kankan. Ìtumọ̀ kejì yìí lè ní í ṣe pẹ̀lú ọ̀rọ̀ nípa àwọn Júù àti àwọn Kèfèrí nínú orí yìí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láìṣe ìyàtọ̀ kankan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé kí o má ṣe ṣiyèméjì tàbí kí o má ṣe ṣe ìyàtọ̀ kankan. Ìtumọ̀ kejì yìí lè ní í ṣe pẹ̀lú ọ̀rọ̀ nípa àwọn Júù àti àwọn Kèfèrí nínú orí yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ìdàrúdàpọ̀ Pétérù tẹ́lẹ̀ àti àṣẹ Ẹ̀mí pé kí ó gbé ìgbésẹ̀ nísinsìnyí.
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ọ̀rọ̀ àdàpọ̀ aorist yìí ń ṣiṣẹ́ bí àṣẹ nínú ìtẹ̀lé àwọn àṣẹ; “dìde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì fi ìgbésẹ̀ kíákíá hàn.
- source_word: κατάβηθι
  choice: sọ̀kalẹ̀
  rationale: Ó pa ìtọ́sọ́nà ìṣípò láti ibi gíga tí Pétérù wà mọ́ láìfi àfikún sí i.
- source_word: πορεύου σὺν αὐτοῖς
  choice: kí o sì bá wọn lọ
  rationale: “Bá wọn lọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kí ó rin ìrìn àjò pẹ̀lú wọn.
- source_word: μηδὲν διακρινόμενος
  choice: láìṣiyèméjì rárá
  rationale: Nínú àyíká ẹsẹ̀ náà, ó ṣeé ṣe jù pé ó ń tọ́ka sí pé kí Pétérù má ṣe ṣiyèméjì tàbí lọ́ tìkọ̀. “Rárá” ń mú agbára μηδέν jáde. Ìtumọ̀ mìíràn pé kí ó má ṣe fi ìyàtọ̀ sí ènìyàn wà nínú àlàyé ìsàlẹ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí Pétérù fi gbọ́dọ̀ tẹ̀ lé àṣẹ náà.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: èmi ni mo rán wọn
  rationale: Ìṣètò “èmi ni” fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ἐγώ hàn. Yorùbá kò nílò àmì àsìkò ọ̀rọ̀-ìṣe ọ̀tọ̀ fún perfect; gbólóhùn yìí ṣàfihàn iṣẹ́ tí a ti ṣe tí àbájáde rẹ̀ sì wà níwájú Pétérù.
theological_decisions:
- issue: Ìtumọ̀ μηδὲν διακρινόμενος ní ìbámu pẹ̀lú gbígba àwọn Kèfèrí wọlé
  choice: A lò “láìṣiyèméjì rárá” nínú ọ̀rọ̀ pàtàkì, èyí tó tẹnumọ́ pé Pétérù kò gbọ́dọ̀ lọ́ tìkọ̀.
  alternative: “láìṣe ìyàtọ̀ kankan,” èyí tó lè tọ́ka sí ṣíṣe àìyatọ̀ láàárín Júù àti Kèfèrí.
  rationale: Ìṣẹ̀lẹ̀ tó sún mọ́ ọn ni ìdàrúdàpọ̀ Pétérù nípa ìran náà àti àṣẹ Ẹ̀mí pé kí ó bá àwọn ọkùnrin náà lọ; ṣùgbọ́n gbogbo orí náà tún ń sọ nípa àìfi ìyàtọ̀ sí Júù àti Kèfèrí. A pa ìtumọ̀ méjèèjì mọ́ nípa fífi èkejì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tó ṣe déédéé, tó lọ́lá, tí ó sì yé òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Kí o sì bá wọn lọ” mú ìtẹ̀lé àṣẹ náà dun bí Yorùbá àdánidá, nígbà tí “èmi ni” pa ìtẹnumọ́ orísun Gíríìkì mọ́.
