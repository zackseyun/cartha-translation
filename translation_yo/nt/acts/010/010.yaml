  to: Ebi sì bẹ̀rẹ̀ sí í pa á gidigidi, ó sì fẹ́ jẹun[a]. Ṣùgbọ́n bí wọ́n ti ń pèsè oúnjẹ, ìfẹ́sí-ọkàn kan bá a[b].
  rationale: Àtúnṣe náà mú ἔκστασις padà sí ìfẹ́sí-ọkàn (trance/ecstasy), dipo kí ó pè é ní ojú-rírí tàbí kí ó fi àlàyé ìwà ẹni kún un. A tún yọ “náà” kúrò nínú “oúnjẹ náà,” nítorí Gíríìkì kò sọ ohun tí wọ́n ń pèsè ní kedere, bí ó tilẹ̀ jẹ́ pé àyíká ń fi oúnjẹ hàn. Gbogbo ìyókù ń pa agbára πρόσπεινος, ìtumọ̀ jíjẹ fún γεύσασθαι, àti ìṣe tó ń lọ nígbà kan náà nínú genitive absolute mọ́.
