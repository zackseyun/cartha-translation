  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: yo
  text: Ebi sì bẹ̀rẹ̀ sí í pa á gidigidi, ó sì fẹ́ jẹun[a]. Ṣùgbọ́n bí wọ́n ti ń pèsè oúnjẹ, ìfẹ́sí-ọkàn kan bá a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì fẹ́ tọ́ nǹkan kan wò”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí “tọ́ wò,” ṣùgbọ́n níbí ó ń tọ́ka sí jíjẹ oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ipò ìfẹ̀sùn kan bá a.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ipò ìrírí tó yàtọ̀ sí ìmọ̀ ojoojúmọ́, tó sì ṣàjọṣepọ̀ níbí pẹ̀lú ìfihàn; kì í ṣe ìyàlẹ́nu lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: Ebi sì bẹ̀rẹ̀ sí í pa á gidigidi
  rationale: 'Ọ̀rọ̀ yìí fi hàn pé ipò tuntun bẹ̀rẹ̀: ebi líle bẹ̀rẹ̀ sí í pa Pétérù. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára πρόσπεινος mọ́.'
- source_word: ἤθελεν γεύσασθαι
  choice: ó sì fẹ́ jẹun
  rationale: Bí ó tilẹ̀ jẹ́ pé γεύομαι lè túmọ̀ ní tààrà sí ‘tọ́ ohun wò,’ ní àyíká ọ̀rọ̀ yìí ó ń tọ́ka sí jíjẹ oúnjẹ.
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: Ṣùgbọ́n bí wọ́n ti ń pèsè oúnjẹ náà lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ genitive absolute náà fi ìṣe tó ń lọ ní àkókò kan náà hàn. ‘Oúnjẹ náà’ sọ ohun tí wọ́n ń pèsè di mímọ̀ láì kọjá àyíká ẹsẹ náà.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: bá a
  rationale: Nínú àkójọpọ̀ yìí, γίνομαι ἐπί ń fi ìrírí kan tí ó dé bá ẹni hàn. ‘Bá a’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ ìṣẹ̀lẹ̀ bẹ́ẹ̀.
- source_word: ἔκστασις
  choice: ojú-rírí bí ẹni tí kò mọ ohun tó ń ṣẹlẹ̀ ní àyíká rẹ̀
  rationale: ἔκστασις níbí jẹ́ ipò ìmọ̀lára tó yàtọ̀ sí ti ojoojúmọ́, tí ó ní í ṣe pẹ̀lú ìfihàn nínú ojú-rírí. Gbólóhùn náà yé òǹkàwé Yorùbá lónìí, kò sì dín ọ̀rọ̀ náà kù sí ìyàlẹ́nu lásán.
theological_decisions:
- issue: Irú ipò tí ἔκστασις ń tọ́ka sí nínú ìrírí Pétérù
  choice: ojú-rírí bí ẹni tí kò mọ ohun tó ń ṣẹlẹ̀ ní àyíká rẹ̀
  alternative: ìran; ipò ìgbésókè ọkàn; ìyàlẹ́nu
  rationale: Àyíká ọ̀rọ̀ tó tẹ̀ lé e sọ nípa ìfihàn nínú ojú-rírí, nítorí náà kì í ṣe ìyàlẹ́nu lásán. Síbẹ̀, a kò fi èrò ẹ̀kọ́ ìsìn kan pàtó kún irú ìrírí náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lasán lè lóye. A lo àpẹẹrẹ ọ̀rọ̀ Yorùbá àdánidá fún ebi líle àti fún ἔκστασις, pẹ̀lú àlàyé ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
