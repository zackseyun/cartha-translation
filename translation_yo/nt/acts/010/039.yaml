  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Àwa sì ni ẹlẹ́rìí” ń ṣàfihàn καὶ ἡμεῖς μάρτυρες; “gbogbo ohun tí ó ṣe” ń pa πάντων ὧν ἐποίησεν mọ́; àti “ní ilẹ̀ àwọn Júù àti ní Jerusalẹmu” ń ṣàfihàn ibi méjèèjì láì dín χώρα kù sí ìpínlẹ̀ kan. “Wọ́n sì pa á nípa gbígbé e kọ́ sórí igi” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου, ó sì pa “igi” mọ́ dípò fífi “àgbélébùú” rọ́pò ọ̀rọ̀ orísun.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó rọrùn, tí ó sì yẹ fún ìtàn Peteru nínú ìwàásù. Àmì ohùn àti ìkọ̀wé ọ̀rọ̀ pàtàkì níbi yìí dára. Àkànlò “gbígbé e kọ́ sórí igi” jẹ́ àkànlò Bíbélì/Yorùbá tó bójú mu fún ìpaniyan nípasẹ̀ ìkànsí/ìgbélẹ̀ sórí igi.
  terminology: “Ẹlẹ́rìí,” “ilẹ̀ àwọn Júù,” “pa á,” àti “igi” jẹ́ àwọn ọ̀rọ̀ tó péye. “Igi” dáàbò bo ìyàtọ̀ ọ̀rọ̀ ξύλον (‘igi/ohun igi’) pẹ̀lú ìtọ́kasí tí ó ṣeé ṣe sí Diutarónómì 21:23; àlàyé ìsàlẹ̀ ojú-ewé náà ń fi “àgbélébùú” hàn gẹ́gẹ́ bí ìtumọ̀ àlàyé nìkan, kì í ṣe bí ìtumọ̀ pàtàkì.
