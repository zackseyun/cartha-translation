id: ACT.10.39
reference: Acts 10:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: yo
  text: Àwa sì ni ẹlẹ́rìí gbogbo ohun tí ó ṣe ní ilẹ̀ àwọn Júù àti ní Jerusalẹmu. Wọ́n sì pa á nípa gbígbé e kọ́ sórí igi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sórí ohun igi”; ní ìtumọ̀ àlàyé, “sórí àgbélébùú.” Ọ̀rọ̀ Gíríìkì ní “igi,” ó sì ṣeé ṣe kí ó ń tọ́ka sí Diutarónómì 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: ẹlẹ́rìí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá ọ̀rọ̀ ẹni tí ó rí ohun kan tí ó ń jẹ́rìí sí i mu.
- source_word: πάντων ὧν ἐποίησεν
  choice: gbogbo ohun tí ó ṣe
  rationale: Ó pa agbára πάντων mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: ní ilẹ̀ àwọn Júù
  rationale: “Ilẹ̀” lè túmọ̀ χώρα gẹ́gẹ́ bí agbègbè tàbí ilẹ̀ àwọn ènìyàn kan láì fi dandan sọ pé ó jẹ́ ìpínlẹ̀ Róòmù ti Jùdíà.
- source_word: καὶ Ἰερουσαλήμ
  choice: àti ní Jerusalẹmu
  rationale: A tún “ní” sọ fún ìtumọ̀ tí ó ṣe kedere, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò tún preposition náà sọ.
- source_word: ἀνεῖλαν
  choice: wọ́n pa á
  rationale: Ìtumọ̀ tààrà ἀναιρέω níbí ni pípa; ọ̀nà yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κρεμάσαντες
  choice: nípa gbígbé e kọ́
  rationale: Ó fi participle náà hàn gẹ́gẹ́ bí ọ̀nà tí wọ́n gbà pa á, ó sì bá ìlò Yorùbá mu.
- source_word: ἐπὶ ξύλου
  choice: sórí igi
  rationale: “Igi” pa àṣàyàn ọ̀rọ̀ ξύλον mọ́, dípò yíyí i padà sí “àgbélébùú,” ó sì lè mú àtọ́ka sí Diutarónómì 21:23 wá sí ọkàn.
theological_decisions:
- issue: Ìtumọ̀ ξύλου nínú ọ̀rọ̀ ìkànmọ́ àgbélébùú
  choice: sórí igi
  alternative: sórí àgbélébùú; sórí ohun igi
  rationale: Gíríìkì lo ξύλον, kì í ṣe σταυρός. “Igi” pa ọ̀rọ̀ orísun àti àtọ́ka tí ó ṣeé ṣe sí Diutarónómì 21:23 mọ́, láì yanju ìtumọ̀ náà sí “àgbélébùú” ní kedere ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé gbogbo ènìyàn. A lo “Júù” fún Ἰουδαίων, ṣùgbọ́n “ilẹ̀” pa ìtumọ̀ agbègbè náà mọ́.
