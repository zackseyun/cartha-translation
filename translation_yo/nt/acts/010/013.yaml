  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: yo
  text: Ohùn kan sì wá sọ fún un pé, “Dìde, Pétérù; pa ẹran[a], kí o sì jẹ ẹ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ẹran rú ẹbọ, kí o sì jẹ.” Ọ̀rọ̀-ìṣe tí a túmọ̀ sí “pa ẹran” tún lè túmọ̀ sí “rú ẹbọ,” ṣùgbọ́n nínú àyíká ìran yìí, ó ṣeé ṣe jù pé ó ń tọ́ka sí pípa ẹran fún jíjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο φωνὴ πρὸς αὐτόν
  choice: Ohùn kan sì sọ fún un
  rationale: Gbólóhùn yìí fi hàn ní Yorùbá àdánidá pé ohùn kan bẹ̀rẹ̀ sí í bá Pétérù sọ̀rọ̀, ó sì ń bá ìtẹ̀síwájú ìtàn mu.
- source_word: Ἀναστάς
  choice: Dìde
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ tó ṣáájú àwọn àṣẹ tó tẹ̀ lé e; “Dìde” jẹ́ ọ̀nà kedere, àdánidá láti sọ ọ́.
- source_word: Πέτρε
  choice: Pétérù
  rationale: Èyí ni ìkọ̀wé orúkọ Πέτρος tí ó ti fìdí múlẹ̀ ní Yorùbá, ní ipò àpèjúwe ẹni tí a ń bá sọ̀rọ̀.
- source_word: θῦσον
  choice: pa ẹran
  rationale: Nínú ìran yìí, àṣẹ náà dá lórí pípa ẹran fún jíjẹ. Fífi “ẹran” hàn mú àṣẹ náà ṣe kedere àti àdánidá ní Yorùbá, láìfi ìtumọ̀ ìrúbọ sínú ọ̀rọ̀ pàtàkì.
- source_word: φάγε
  choice: jẹ ẹ́
  rationale: Àṣẹ tààrà ni; arọ́pò-orúkọ “ẹ́” tọ́ka sí ẹran tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ kí gbolóhùn náà dùn mọ́ etí ní Yorùbá.
- source_word: καὶ
  choice: sì / kí o sì
  rationale: “Sì” ń so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú, “kí o sì” sì ń so àwọn àṣẹ méjèèjì pọ̀ lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá kí θῦσον ní èdè ìrúbọ nínú ọ̀rọ̀ pàtàkì
  choice: A túmọ̀ ọ́ sí “pa ẹran” nínú ọ̀rọ̀ pàtàkì.
  alternative: “fi ẹran rú ẹbọ”
  rationale: Àyíká ọ̀rọ̀ jẹ́ ìran nípa àwọn ẹranko àti jíjẹ, kì í ṣe àṣẹ láti ṣe ìrúbọ ìsìn. Síbẹ̀, nítorí ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípa ẹran fún ìrúbọ, a pa ìtumọ̀ yẹn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà ṣe kedere, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A yàgò fún èdè ẹ̀kọ́ ìsìn tó lè pinnu ìtumọ̀ θῦσον ju bí orísun ṣe pinnu rẹ̀ lọ.
