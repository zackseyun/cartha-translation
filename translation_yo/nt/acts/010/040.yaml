  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: yo
  text: Ọlọ́run jí ẹni yìí[a] dìde ní ọjọ́ kẹta, ó sì jẹ́ kí ó farahàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “òun” tàbí “ọkùnrin yìí”; ọ̀rọ̀ atọ́ka Gíríìkì náà ní ìtẹnumọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ó sì mú kí ó farahàn” tàbí “ó sì fi i hàn.” Ní tààrà, Gíríìkì náà sọ pé, “ó sì fún un láti di ẹni tí a lè rí.”
