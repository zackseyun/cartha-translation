lexical_decisions:
- source_word: τοῦτον
  choice: ẹni yìí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà wà níwájú fún ìtẹnumọ́, ó sì ń tọ́ka sí Jésù tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. “Ẹni yìí” pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni olùṣe ìṣe nínú gbólóhùn náà, ó sì jẹ́ ọ̀nà àdánidá láti túmọ̀ rẹ̀ sí Yorùbá.
- source_word: ἤγειρεν
  choice: jí ... dìde
  rationale: Nínú àyíká ọ̀rọ̀ àjíǹde, “jí ... dìde” sọ ìṣe Ọlọ́run ní kedere láìfi àlàyé mìíràn kún un.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún dative of time, láìṣàfikún bí a ṣe ń ka àwọn ọjọ́ náà.
- source_word: ἔδωκεν
  choice: jẹ́ kí
  rationale: Pẹ̀lú infinitive tó tẹ̀ lé e, “jẹ́ kí” mú èrò fífún tàbí mímú kí ohun kan ṣẹlẹ̀ jáde, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: αὐτὸν
  choice: ó
  rationale: Arọ́pò orúkọ náà ń tọ́ka sí Jésù; nínú ìṣètò Yorùbá “jẹ́ kí ó,” arọ́pò olùṣe yìí ni ó bá a mu.
- source_word: ἐμφανῆ
  choice: farahàn
  rationale: “Farahàn” mú ìtumọ̀ jíjẹ́ ẹni tí a lè rí tàbí ẹni tí a fihàn jáde, láìdín ọ̀rọ̀ náà kù sí wíwo lasán.
- source_word: γενέσθαι
  choice: kí ó farahàn
  rationale: Ìṣètò yìí pa ìtumọ̀ wíwá sí ipò fífarahàn mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àjíǹde
  choice: Ọlọ́run jí ẹni yìí dìde ní ọjọ́ kẹta
  alternative: Ọlọ́run jí i dìde ní ọjọ́ kẹta
  rationale: Ìtumọ̀ yìí sọ ìṣe Ọlọ́run ní tààrà, ó sì pa ìtẹnumọ́ demonstrative τοῦτον mọ́ láìfi ẹ̀kọ́ mìíràn kún ẹsẹ náà.
- issue: Fífarahàn lẹ́yìn àjíǹde
  choice: ó sì jẹ́ kí ó farahàn
  alternative: ó sì mú kí a rí i
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín jíjí Jésù dìde àti fífarahàn rẹ̀ mọ́. “Jẹ́ kí” tún yàgò fún dídá ìtumọ̀ ἔδωκεν sí causation líle nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Ẹni yìí” jẹ́ ìtẹnumọ́ díẹ̀ ju arọ́pò orúkọ lasán lọ, bí Gíríìkì ṣe rí; “jẹ́ kí ó farahàn” sì jẹ́ àdánidá láìpa àìdánilójú tó wà nínú ìṣètò Gíríìkì run.
