source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: yo
  text: ìhìn tí ó rán sí àwọn ọmọ Ísírẹ́lì[a], nípa bí ó ti ń kéde ìhìn rere àlàáfíà nípasẹ̀ Jésù Mèsáyà[b]—Jésù yìí ni Olúwa ohun gbogbo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ọ̀rọ̀ tí ó rán sí àwọn ọmọ Ísírẹ́lì.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Jésù Kristi”; a túmọ̀ Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “Jésù yìí ni Olúwa gbogbo ènìyàn.” Ọ̀rọ̀ Gíríìkì οὗτός tẹnumọ́ Jésù fúnra rẹ̀, àti πάντων lè túmọ̀ sí gbogbo ènìyàn tàbí ohun gbogbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ìhìn
  rationale: Nínú àyíká yìí, λόγος túmọ̀ sí ohun tí Ọlọ́run fi ránṣẹ́, kì í ṣe ọ̀rọ̀ kan ṣoṣo. “Ìhìn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ message, nígbà tí àlàyé ìsàlẹ̀ fi “ọ̀rọ̀” hàn gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ fọ́ọ̀mù Gíríìkì.
- source_word: ὃν ἀπέστειλεν
  choice: tí ó rán
  rationale: Ó pa ìbátan gbólóhùn mọ́ láì fi orúkọ Ọlọ́run kún ẹsẹ náà; ẹni tí “ó” ń tọ́ka sí hàn nínú àyíká gbólóhùn tó tóbi.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: sí àwọn ọmọ Ísírẹ́lì
  rationale: “Àwọn ọmọ Ísírẹ́lì” jẹ́ ọ̀nà Yorùbá tó ṣe déédé pẹ̀lú gbólóhùn Gíríìkì, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àpapọ̀ fún àwọn ènìyàn Ísírẹ́lì.
- source_word: εὐαγγελιζόμενος εἰρήνην
  choice: ó sì ń kéde ìhìn rere àlàáfíà
  rationale: “Kéde ìhìn rere” mú agbára εὐαγγελίζομαι jáde, “àlàáfíà” sì jẹ́ ìbámu tààrà fún εἰρήνη. “Ó sì ń” so participle náà mọ́ ẹni tó rán ìhìn náà ní Yorùbá àdánidá.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: “Nípasẹ̀” pa ipa Jésù gẹ́gẹ́ bí ẹni tí àlàáfíà ti ọ̀dọ̀ rẹ̀ wá mọ́. Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà “Mèsáyà” ló yẹ dípò kí a kan kọ “Kristi” gẹ́gẹ́ bí orúkọ.
- source_word: οὗτός
  choice: Jésù yìí
  rationale: Ṣíṣe orúkọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí lẹ́ẹ̀kan sí i jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ demonstrative οὗτός mọ́ ju “òun” nìkan lọ.
- source_word: πάντων κύριος
  choice: Olúwa gbogbo ènìyàn
  rationale: “Olúwa” pa ìtumọ̀ àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ κύριος mọ́. Nínú ọ̀rọ̀ Pétérù sí àwọn ènìyàn, “gbogbo ènìyàn” jẹ́ Yorùbá tó ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò jù—“ohun gbogbo”—mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró ní àyíká yìí. “Mèsáyà” mú iṣẹ́ oyè náà hàn, láì sọ ọ́ di orúkọ kejì lásán.
- issue: Ìtumọ̀ κύριος nínú πάντων κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ọlá, àṣẹ, àti ìwúwo gbólóhùn nípa Jésù mọ́; “Ọ̀gá” lè dín un kù sí ipò àwùjọ lásán.
- issue: Ìtẹnumọ́ οὗτός ἐστιν πάντων κύριος
  choice: Jésù yìí ni Olúwa gbogbo ènìyàn
  alternative: òun ni Olúwa gbogbo ènìyàn
  rationale: “Jésù yìí” ń fi ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ tẹnumọ́ gẹ́gẹ́ bí Gíríìkì ṣe rí, láì ṣàfikún ẹ̀kọ́ mìíràn.
- issue: Ààlà πάντων
  choice: gbogbo ènìyàn
  alternative: ohun gbogbo
  rationale: Nítorí àyíká ọ̀rọ̀ náà ń dojú kọ àwọn Júù àti àwọn kèfèrí, ìtọ́ka sí gbogbo ènìyàn bá àyíká mu. Síbẹ̀, Gíríìkì lè gbòòrò dé “ohun gbogbo,” nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ìhìn rere” láti mú ìtumọ̀ εὐαγγελίζομαι jáde, “Jésù yìí” láti pa ìtẹnumọ́ Gíríìkì mọ́, a sì fi gbogbo àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
