  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: yo
  text: Ó jẹ́ ẹni tí ó ní ìfọkànsìn, ó sì ń bẹ̀rù Ọlọ́run pẹ̀lú gbogbo àwọn ará ilé rẹ̀[a]. Ó máa ń ṣe ọ̀pọ̀ iṣẹ́ àánú fún àwọn ènìyàn, ó sì máa ń gbàdúrà sí Ọlọ́run nígbà gbogbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jẹ́ ẹni tí ó ní ìfọkànsìn àti ẹni tí ń bẹ̀rù Ọlọ́run, pẹ̀lú gbogbo àwọn ará ilé rẹ̀.” Àpólà náà tún lè jẹ́ àpèjúwe tí a mọ̀ fún ẹni tí kì í ṣe Júù tó ń sin Ọlọ́run Ísírẹ́lì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń fún àwọn aláìní ní ọ̀pọ̀ ọrẹ àánú.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń tọ́ka pàtó sí ẹ̀bùn àánú fún àwọn aláìní.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: olùfọkànsìn
  rationale: Ó ṣàpèjúwe ẹni tí ó fi ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run hàn nínú ìgbésí ayé ẹ̀sìn rẹ̀; ọ̀rọ̀ yìí jẹ́ adayébá, ó sì ní iyì ní Yorùbá òde òní.
- source_word: φοβούμενος τὸν θεὸν
  choice: ó bẹ̀rù Ọlọ́run
  rationale: Èyí pa ìrísí ọ̀rọ̀-ìṣe Gíríìkì àti àṣà ọ̀rọ̀ Bíbélì mọ́, níbi tí ‘bíbẹ̀rù Ọlọ́run’ ti túmọ̀ sí fífi ọ̀wọ̀ jíjinlẹ̀ fún un, láì sọ ìtumọ̀ náà di èyí tí kò ní agbára.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: pẹ̀lú gbogbo agbo ilé rẹ̀
  rationale: οἶκος ń tọ́ka sí gbogbo àwọn tó wà lábẹ́ agbo ilé rẹ̀, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
- source_word: ποιῶν
  choice: ó máa ń ṣe
  rationale: Ìlò ‘máa ń’ fi ìṣe tí ó ń ṣẹlẹ̀ déédéé hàn, ó sì bá participle present Gíríìkì mu ní Yorùbá adayébá.
- source_word: ἐλεημοσύνας πολλὰς
  choice: ọ̀pọ̀ iṣẹ́ àánú
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka pàtó sí fífún àwọn aláìní ní ọrẹ àánú; ‘ọ̀pọ̀ iṣẹ́ àánú’ ṣe àfihàn ọ̀pọ̀ àti ìwà-rere náà ní èdè tí gbogbo ènìyàn lè lóye.
- source_word: τῷ λαῷ
  choice: fún àwọn ènìyàn
  rationale: Dative náà fi àwọn tí iṣẹ́ àánú náà ṣe fún hàn; ‘fún’ jẹ́ ọ̀nà Yorùbá adayébá láti sọ ìbùkún ẹni tí ó gba ohun náà.
- source_word: δεόμενος τοῦ θεοῦ
  choice: ó máa ń gbàdúrà sí Ọlọ́run
  rationale: δέομαι lè túmọ̀ sí bẹ̀bẹ̀ tàbí gbàdúrà; ní àyíká ìfọkànsìn Kọ̀nẹ́líù, ‘gbàdúrà sí Ọlọ́run’ ṣe kedere jù lọ.
- source_word: διὰ παντός
  choice: nígbà gbogbo
  rationale: Àpólà yìí ń tọ́ka sí ìṣe tí ó ń bá a lọ déédéé, kì í ṣe dandan pé kò dáwọ́ dúró fún ìṣẹ́jú kan rí.
theological_decisions:
- issue: Bí a ṣe máa tú èdè tó ṣàpèjúwe Kọ̀nẹ́líù gẹ́gẹ́ bí ẹni tó bẹ̀rù Ọlọ́run
  choice: ó bẹ̀rù Ọlọ́run
  alternative: olùbẹ̀rù Ọlọ́run; ó ń bọ̀wọ̀ fún Ọlọ́run
  rationale: Àyànfẹ́ yìí pa ìrísí ọ̀rọ̀-ìṣe àti àṣà ọ̀rọ̀ Bíbélì mọ́. Ó lè túmọ̀ sí ìfọkànsìn ní gbogbogbòò, ó sì tún lè jẹ́ àpèjúwe tí a mọ̀ fún Kèfèrí kan tó ń sin Ọlọ́run Ísírẹ́lì; a kò fi ipa mú ẹsẹ náà yan ọ̀kan ṣoṣo nínú méjèèjì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ọ̀nà àpèjúwe tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn gbólóhùn ‘ó máa ń’ mú ìṣe déédéé tí àwọn participle Gíríìkì fi hàn jáde lọ́nà adayébá.
