  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: yo
  text: 'Nítorí wọ́n ń gbọ́ wọn ń sọ̀rọ̀ ní ahọ́n, tí wọ́n sì ń gbé Ọlọ́run ga[a]. Nígbà náà ni Peteru dáhùn pé:'
