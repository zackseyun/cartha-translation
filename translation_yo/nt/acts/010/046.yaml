lexical_decisions:
- source_word: ἤκουον
  choice: wọ́n ń gbọ́
  rationale: Ìṣe aláìpé náà fi hàn pé gbígbọ́ náà ń lọ lọ́wọ́; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀ gẹ́gẹ́ bí àlàyé.
- source_word: αὐτῶν
  choice: àwọn náà
  rationale: Ó pa ìtọ́kasí sí àwọn ènìyàn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ́ láì fi orúkọ ìtumọ̀ míì kún un.
- source_word: λαλούντων
  choice: ń sọ̀rọ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe sísọ tí a ń gbọ́.
- source_word: γλώσσαις
  choice: ní ahọ́n
  rationale: Ahọ́n lè túmọ̀ sí ẹ̀yà ara tàbí èdè, ó sì pa àìdánilójú inú Gíríìkì mọ́; àṣàyàn ‘ní àwọn èdè’ wà nínú àlàyé ìsàlẹ̀.
- source_word: μεγαλυνόντων
  choice: ń gbé Ọlọ́run ga
  rationale: Àpólà Yorùbá yìí fi ìtumọ̀ ‘sọ di ńlá, gbé ga, yìn’ hàn lọ́nà àdánidá àti ọlọ́lá.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ó jẹ́ àfojúsùn tààrà ti μεγαλυνόντων.
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó samisi ìṣẹ̀lẹ̀ tó tẹ̀ lé e.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ó tẹ̀ lé ìtumọ̀ ‘fèsì’ tàbí ‘dáhùn,’ bí ó tilẹ̀ jẹ́ pé kò sí ìbéèrè gbangba níwájú rẹ̀.
- source_word: Πέτρος
  choice: Peteru
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ γλώσσαις nínú àyíká ọ̀rọ̀ nípa iṣẹ́ Ẹ̀mí
  choice: ní ahọ́n
  alternative: ní àwọn èdè
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ahọ́n tàbí èdè. Lílo ‘ní ahọ́n’ pa àṣà ọ̀rọ̀ inú Ìṣe àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ mọ́, nígbà tí àlàyé ìsàlẹ̀ sì fi àṣàyàn kejì hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘wọ́n ń gbọ́ tí...’ pa ìṣe tó ń lọ lọ́wọ́ mọ́, ‘gbé Ọlọ́run ga’ sì jẹ́ àpólà ìyìn tó wọ́pọ̀ àti àdánidá.
