    text: Tàbí, “ní àwọn èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; gbolohun náà níbí kò sọ irú ọ̀rọ̀ tí wọ́n ń sọ di pàtó.
