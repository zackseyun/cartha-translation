id: ACT.10.43
reference: Acts 10:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: yo
  text: Gbogbo àwọn wòlíì jẹ́rìí nípa rẹ̀[a] pé gbogbo ẹni tí ó bá gbà á gbọ́ ń gba ìdáríjì ẹ̀ṣẹ̀ nípasẹ̀ orúkọ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́rìí sí i.”
    reason: Dátífù τούτῳ lè jẹ́ kí a túmọ̀ ìbáṣepọ̀ ẹ̀rí náà bí ‘nípa rẹ̀’ tàbí, ní ọ̀nà tí ó sún mọ́ dátífù, ‘sí i’; àyíká ọ̀rọ̀ ń fẹ́ ‘nípa rẹ̀.’
lexical_decisions:
- source_word: τούτῳ
  choice: nípa rẹ̀
  rationale: Dátífù náà bá μαρτυροῦσιν ṣiṣẹ́ láti fi ẹni tí ẹ̀rí náà dá lé hàn. ‘Nípa rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn wòlíì jẹ́rìí nípa Jesu, láì túmọ̀ ọ́ sí àlàyé tó ju ti orísun lọ.
- source_word: πάντες οἱ προφῆται
  choice: Gbogbo àwọn wòlíì
  rationale: Èyí pa ìtẹnumọ́ gbogbo àwọn wòlíì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: μαρτυροῦσιν
  choice: ló jẹ́rìí
  rationale: ‘Jẹ́rìí’ pa agbára ọ̀rọ̀ ẹ̀rí inú ọ̀rọ̀ Gíríìkì mọ́, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: ìdáríjì ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu fún ìdáríjì àwọn ẹ̀ṣẹ̀, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: λαβεῖν
  choice: ń rí ... gbà
  rationale: Ìsọ̀rọ̀ yìí mú ìtumọ̀ ‘gbà’ gẹ́gẹ́ bí ohun tí olùgbàgbọ́ ń rí gbà jáde ní Yorùbá àdánidá, ó sì fi gbólóhùn gbogbogbò tó ń ṣiṣẹ́ ní gbogbo ìgbà hàn.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: nípasẹ̀ orúkọ rẹ̀
  rationale: Èyí pa àwòrán àti ọ̀nà ìsọ̀rọ̀ Gíríìkì mọ́ pé ìdáríjì wá nípasẹ̀ orúkọ Jesu, láì ṣàlàyé ‘orúkọ’ sí ‘àṣẹ’ nínú ọ̀rọ̀ pàtàkì.
- source_word: πάντα τὸν πιστεύοντα
  choice: gbogbo ẹni tó bá ... gbọ́
  rationale: Ìtumọ̀ yìí jẹ́ ti gbogbo ènìyàn, kì í ṣe ti ọkùnrin nìkan, ó sì pa ìtumọ̀ pínpín fún olúkúlùkù mọ́.
- source_word: εἰς αὐτόν
  choice: gbà á gbọ́
  rationale: ‘Gbà á gbọ́’ ni ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ tí a darí sí ènìyàn kan; nínú àyíká yìí, ó túmọ̀ sí fífi ìgbàgbọ́ sínú Jesu, kì í ṣe gbígbọ́ àsọjáde kan nìkan.
theological_decisions:
- issue: Ìwọ̀n àti ipò ìdáríjì
  choice: Gbogbo ẹni tó bá gba Jesu gbọ́ ń rí ìdáríjì ẹ̀ṣẹ̀ gbà nípasẹ̀ orúkọ rẹ̀.
  alternative: A lè ṣàlàyé ìbáṣepọ̀ ìgbàgbọ́, orúkọ Jesu àti ìdáríjì pẹ̀lú èdè ẹ̀kọ́ ìsìn tó jinlẹ̀ sí i.
  rationale: A pa ìbáṣepọ̀ tí ẹsẹ náà fúnra rẹ̀ sọ mọ́ láì fi èrò ẹ̀ka ìsìn kankan nípa bí ìgbàlà ṣe ń ṣiṣẹ́ kún un.
- issue: Partísípù akọ tó dúró fún gbogbo ènìyàn
  choice: gbogbo ẹni tó bá gbà á gbọ́
  alternative: gbogbo ọkùnrin tó bá gbà á gbọ́
  rationale: Fọ́ọ̀mù akọ ẹyọ kan nínú Gíríìkì jẹ́ ti gbogbo ènìyàn níbí, kì í ṣe pé ó yọ àwọn obìnrin sílẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán; a lo ‘tó bá’ gẹ́gẹ́ bí ìkópọ̀ àdánidá ti ‘tí ó bá.’
