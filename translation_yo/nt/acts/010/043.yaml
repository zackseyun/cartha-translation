  source_fidelity: Ìtumọ̀ náà ń pa ẹ̀rí gbogbo àwọn wòlíì nípa Jesu, ìgbàgbọ́ nínú rẹ̀, àti ìdáríjì ẹ̀ṣẹ̀ nípasẹ̀ orúkọ rẹ̀ mọ́. Síbẹ̀, àṣàyàn ‘ń rí ìdáríjì ẹ̀ṣẹ̀ gbà’ jẹ́ àtúnlò ìṣe méjì tí kò fi ìṣe λαβεῖν hàn ní ọ̀nà Yorùbá tó mọ́ julọ. ‘Ń gba ìdáríjì ẹ̀ṣẹ̀’ jẹ́ ìtumọ̀ tààrà, tí ó sì jẹ́ àdánidá. Àlàyé ìsàlẹ̀ ‘jẹ́rìí fún un’ lè túmọ̀ sí jíjẹ́rìí ní ìfẹ́ ẹni náà tàbí ní àtìlẹ́yìn rẹ̀, èyí tí ó lè fi agbára míì kún dátífù náà.
  naturalness: ‘Gbogbo àwọn wòlíì jẹ́rìí nípa rẹ̀’ jẹ́ Yorùbá rọrùn àti tó bá ìforúkọsílẹ̀ mímọ́ mu. ‘Gbogbo ẹni tí ó bá gbà á gbọ́ ń gba ìdáríjì ẹ̀ṣẹ̀’ ń dun ní ti ẹ̀dá ju ‘ń rí ... gbà’ lọ. Fọ́ọ̀mù ‘tí ó bá’ jẹ́ ìlò Bíbélì Yorùbá tó wọ́pọ̀ fún ìpò gbogbogbò ẹni tó bá ní ìgbàgbọ́.
