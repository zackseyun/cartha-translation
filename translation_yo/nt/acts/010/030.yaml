id: ACT.10.30
reference: Acts 10:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: yo
  text: Kọ̀nẹ́líù sì wí pé, “Ní ọjọ́ mẹ́rin sẹ́yìn, ní àkókò yìí gan-an, mo ń gbàdúrà ní ilé mi ní wákàtí kẹ́sàn-án[a]; wò ó, ọkùnrin kan dúró níwájú mi nínú aṣọ dídán.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ní nǹkan bí agogo mẹ́ta ọ̀sán.
    reason: Àlàyé àṣà nípa bí wọ́n ṣe ń ka wákàtí ọjọ́.
lexical_decisions:
- source_word: ἔφη
  choice: wí pé
  rationale: Ọ̀nà àdánidá àti ọ̀wọ̀ fún fífi ọ̀rọ̀ ẹni sínú ìtàn ni ‘wí pé’; ó ṣàfihàn aorist gẹ́gẹ́ bí ìṣẹ̀lẹ̀ ìtàn kan.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Ọjọ́ mẹ́rin sẹ́yìn, ní wákàtí yìí gan-an
  rationale: Gbólóhùn Gíríìkì tọ́ka sí ọjọ́ mẹ́rin ṣáájú ní àkókò kan náà. Ìtumọ̀ yìí yẹra fún èrò àṣìṣe pé Kọ̀nẹ́líù ń gbàdúrà láìdúró fún ọjọ́ mẹ́rin, ó sì pa ìtọ́kasí sí wákàtí yìí mọ́.
- source_word: ἤμην ... προσευχόμενος
  choice: mo ń gbàdúrà
  rationale: Àkópọ̀ imperfect yìí fi ìṣe tí ń lọ lọ́wọ́ ní àkókò tí ó kọjá hàn; ‘mo ń gbàdúrà’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé.
- source_word: τὴν ἐνάτην
  choice: ní wákàtí kẹ́sàn-án
  rationale: Ó pa ìṣírò àkókò inú àṣà orísun mọ́; àlàyé agogo òde òní wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν τῷ οἴκῳ μου
  choice: ní ilé mi
  rationale: ‘Ilé mi’ jẹ́ ìtumọ̀ tó ṣe tààrà tí ó sì bá ibi tí ìṣẹ̀lẹ̀ ti ṣẹlẹ̀ mu.
- source_word: ἰδοὺ
  choice: sì kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ tó ń pe àfiyèsí sí ohun àjèjì tàbí òjijì mọ́ ní èdè Yorùbá tó ní iyì.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni akọ tí ó farahàn bí ènìyàn; ‘ọkùnrin kan’ ni ìbámu àdánidá.
- source_word: ἔστη ἐνώπιόν μου
  choice: dúró níwájú mi
  rationale: Ó pa ìtumọ̀ gangan pé ẹni náà gbé ara rẹ̀ dúró níwájú Kọ̀nẹ́líù mọ́.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: nínú aṣọ dídán
  rationale: ‘Aṣọ dídán’ mú ìmọ́lẹ̀ tàbí ìtànṣán λαμπρός jáde láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τὴν ἐνάτην, ìyẹn ìṣírò wákàtí ayé àtijọ́
  choice: ní wákàtí kẹ́sàn-án
  alternative: ní agogo mẹ́ta ọ̀sán
  rationale: Ọ̀rọ̀ pàtàkì pa ìṣírò wákàtí inú àṣà orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ fún òǹkàwé ní ìbámu rẹ̀ pẹ̀lú agogo òde òní.
translation_notes:
  register: Yorùbá àkànṣe tó ní àmì ohùn kíkún, tó bójú mu, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. ‘Sì kíyèsí i’ pa ìrísí ìtàn ἰδοὺ mọ́; a lo ‘nínú aṣọ dídán’ láìsọ ẹni náà di áńgẹ́lì nínú ẹsẹ yìí, nítorí orísun sọ pé ‘ọkùnrin kan.’
