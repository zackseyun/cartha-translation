source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: yo
  text: Ẹ̀yin fúnra yín mọ̀ ohun tí ó ṣẹlẹ̀ káàkiri gbogbo Jùdíà[a], tí ó bẹ̀rẹ̀ láti Gálílì lẹ́yìn ìbatisí tí Jòhánù kéde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀/ìhìn tí ó tàn káàkiri gbogbo Jùdíà.” Ọ̀rọ̀ Gíríìkì ῥῆμα lè túmọ̀ sí “ọ̀rọ̀,” “ìhìn,” tàbí “ọ̀ràn.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “tí ó bẹ̀rẹ̀” kò bá ìṣètò gírámà mu pátápátá, ṣùgbọ́n ó fi hàn kedere pé Gálílì ni ibi tí ọ̀ràn náà ti bẹ̀rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Ẹ̀yin fúnra yín mọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς jẹ́ ti ìtẹnumọ́; “Ẹ̀yin fúnra yín” mú ìtẹnumọ́ náà jáde ní Yorùbá àdánidá, nígbà tí οἴδατε ní ìtumọ̀ ìsinsìnyí “mọ.”
- source_word: τὸ γενόμενον ῥῆμα
  choice: ohun tí ó ṣẹlẹ̀
  rationale: ῥῆμα lè túmọ̀ sí ọ̀rọ̀, iṣẹ́lẹ̀, tàbí ọ̀ràn; pẹ̀lú γενόμενον, “ohun tí ó ṣẹlẹ̀” jẹ́ àdánidá, ó sì yàgò fún dídín ìtumọ̀ rẹ̀ kù sí ọ̀rọ̀ tí a sọ nìkan.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: káàkiri gbogbo Jùdíà
  rationale: κατά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive fi hàn pé ohun náà tàn dé gbogbo agbègbè; “káàkiri gbogbo” pa ìtẹnumọ́ ὅλης mọ́.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: tí ó bẹ̀rẹ̀ láti Gálílì
  rationale: Ìsọ̀rọ̀ participle náà kò wọ́pọ̀ ní gírámà Gíríìkì ibí yìí, ṣùgbọ́n ó fi ibi ìbẹ̀rẹ̀ hàn kedere; gbolohun Yorùbá yìí jẹ́ mímọ́ láìfi ẹni tàbí ohun mìíràn kun un.
- source_word: μετὰ τὸ βάπτισμα
  choice: lẹ́yìn ìbatisí
  rationale: μετά pẹ̀lú accusative níbí jẹ́ ti àkókò, “lẹ́yìn”; “ìbatisí” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún βάπτισμα, láìyanju ọ̀nà ìbatisí náà.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: tí Jòhánù kéde
  rationale: κηρύσσω ní agbára ìkéde gbangba; “kéde” jẹ́ àdánidá, ó sì gbòòrò ju ìwàásù inú ilé ìjọsìn lọ.
theological_decisions:
- issue: Ìtumọ̀ ῥῆμα nínú àkótán Pétérù
  choice: “ohun” láti gba iṣẹ́lẹ̀ àti ìròyìn nípa rẹ̀ pọ̀
  alternative: “ọ̀rọ̀” tàbí “ìhìn”
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ohun tí àwọn olùgbọ́ mọ̀ pé ó ṣẹlẹ̀ ní Jùdíà, tí ó bẹ̀rẹ̀ ní Gálílì. “Ohun” pa ààyè ìtumọ̀ náà mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ohun tí ἀρξάμενος ń tọ́ka sí
  choice: A so ìbẹ̀rẹ̀ mọ́ “ohun tí ó ṣẹlẹ̀” ní Yorùbá
  alternative: Kí a fi sílẹ̀ gẹ́gẹ́ bí participle tí kò ní ohun tí ó ń tọ́ka sí ní kedere
  rationale: Bí ó tilẹ̀ jẹ́ pé ìbámu gírámà participle Gíríìkì náà le koko, ìtumọ̀ ibi ìbẹ̀rẹ̀ rẹ̀ ṣe kedere. Ìtumọ̀ Yorùbá mú un rọrùn láìyanju ìdí ìṣòro gírámà náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lò “ìbatisí” gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀ ní èdè Bíbélì Yorùbá, a sì kọ orúkọ ibi àti ènìyàn gẹ́gẹ́ bí Jùdíà, Gálílì, àti Jòhánù.
