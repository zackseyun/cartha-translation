revisions:
- from: Nígbà náà, Peteru sọ̀kalẹ̀ tọ àwọn ọkùnrin náà lọ, ó sì sọ pé, “Wò ó, èmi ni ẹni tí ẹ̀ ń wá. Kí ni ìdí tí ẹ fi wà níhìn-ín?”
  to: Nígbà náà, Pétérù sọ̀kalẹ̀ lọ sọ́dọ̀ àwọn ọkùnrin náà, ó sì sọ pé, “Ẹ wò ó, èmi ni ẹni tí ẹ̀ ń wá. Kí ni ìdí tí ẹ fi wà níhìn-ín?”
  rationale: The revision preserves the source meaning while replacing an awkward movement phrase with idiomatic Standard Yoruba, adopting the conventional biblical form of Peter’s name, and making the attention marker natural in direct address. The question remains explicit about both the reason and the men’s presence, so no lexical-alternative footnote is needed.
