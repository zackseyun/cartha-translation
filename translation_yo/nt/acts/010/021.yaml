  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: yo
  text: Nígbà náà, Pétérù sọ̀kalẹ̀ lọ sọ́dọ̀ àwọn ọkùnrin náà, ó sì sọ pé, “Ẹ wò ó, èmi ni ẹni tí ẹ̀ ń wá. Kí ni ìdí tí ẹ fi wà níhìn-ín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: sọ̀kalẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ aorist participle tí ó fi hàn pé Peteru sọ̀kalẹ̀ láti ibi gíga tí ó wà sí ibi tí àwọn àlejò náà wà; ‘sọ̀kalẹ̀’ pa ìtọ́sọ́nà náà mọ́ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú ju pé ó ń fi ìtakora hàn; ‘Nígbà náà’ bá ìṣàn ìtàn Yorùbá mu.
- source_word: πρὸς τοὺς ἄνδρας
  choice: tọ àwọn ọkùnrin náà lọ
  rationale: πρός pẹ̀lú accusative tọ́ka sí lílọ sí ọ̀dọ̀ wọn; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣípò mọ́.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: ἰδού jẹ́ àmì ọ̀rọ̀ tí ń pe àfiyèsí olùgbọ́; ‘Wò ó’ jẹ́ ọ̀nà òde òní tí ó ní agbára náà láìjẹ́ ti èdè àtijọ́.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: èmi ni ẹni tí ẹ̀ ń wá
  rationale: Ó dá Peteru mọ̀ gẹ́gẹ́ bí ẹni tí wọ́n ń wá. ‘Èmi’ pa ìtẹnumọ́ ἐγώ mọ́, ‘ẹni tí ẹ̀ ń wá’ sì tú relative clause náà sí Yorùbá tó ṣe kedere.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Kí ni ìdí tí ẹ fi wà níhìn-ín?
  rationale: ‘Ìdí’ pa orúkọ αἰτία (‘ìdí/okùnfà’) mọ́, ‘ẹ fi wà níhìn-ín’ sì fi ìpo wíwà tí πάρεστε sọ hàn, dípò yíyí i padà sí ‘ẹ fi wá.’
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. Àmì ohùn wà níbi tí ó yẹ. A lo ‘ẹ̀/ẹ’ fún ọ̀pọ̀ ènìyàn nítorí Peteru ń bá àwọn ọkùnrin náà sọ̀rọ̀; kò sí àfikún ẹ̀kọ́ ìsìn tàbí ìtúmọ̀ ẹlẹ́gbẹ́ kan.
