review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all principal elements of the Greek: Peter’s descent, his approach to the men, the emphatic self-identification, and his question concerning the reason for their presence. The rendering of τίς ἡ αἰτία δι’ ἣν πάρεστε as “Kí ni ìdí tí ẹ fi wà níhìn-ín?” appropriately retains both ‘reason’ and the sense of being present.'
  naturalness: “sọ̀kalẹ̀ tọ àwọn ọkùnrin náà lọ” is not the most idiomatic or well-ordered Standard Yoruba expression for descending and going to persons. “sọ̀kalẹ̀ lọ sọ́dọ̀ àwọn ọkùnrin náà” is clear and natural. “Ẹ wò ó” is also a more natural direct-discourse equivalent of Ἰδού in this setting than the bare “Wò ó.”
  terminology: Pétérù is the established Standard Yoruba biblical form of Peter and should be used. No theological terminology is at issue. The English audit footnote need not be reproduced, since the Yoruba main text already explicitly renders the reason/presence phrasing that the English footnote supplies as an alternative.
  issues:
  - severity: medium
    issue: Unidiomatic construction for Peter’s movement toward the men
    rationale: The phrase “sọ̀kalẹ̀ tọ àwọn ọkùnrin náà lọ” has awkward word order and an unclear combination of directional elements. “sọ̀kalẹ̀ lọ sọ́dọ̀ àwọn ọkùnrin náà” naturally expresses καταβὰς ... πρὸς τοὺς ἄνδρας.
  - severity: low
    issue: Proper-name orthography
    rationale: “Pétérù” is the conventional Standard Yoruba biblical spelling and is preferable to the unmarked “Peteru.”
  - severity: low
    issue: Attention-getting interjection
    rationale: “Ẹ wò ó” supplies a natural plural imperative to the men and conveys the discourse force of Ἰδού.
  revised_text: Nígbà náà, Pétérù sọ̀kalẹ̀ lọ sọ́dọ̀ àwọn ọkùnrin náà, ó sì sọ pé, “Ẹ wò ó, èmi ni ẹni tí ẹ̀ ń wá. Kí ni ìdí tí ẹ fi wà níhìn-ín?”
