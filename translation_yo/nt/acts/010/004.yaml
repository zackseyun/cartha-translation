id: ACT.10.4
reference: Acts 10:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: yo
  text: Ṣùgbọ́n Kọ̀nẹ́líù tẹjú mọ́ ọn, ẹ̀rù sì bà á, ó ní, “Kí ni, Olúwa?” Ó sì sọ fún un pé, “Àwọn àdúrà rẹ àti àwọn iṣẹ́ àánú rẹ[a] ti gòkè lọ sí iwájú Ọlọ́run gẹ́gẹ́ bí ohun ìrántí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ọrẹ fún àwọn aláìní.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtàkì sí fífún àwọn aláìní ní ìrànlọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: tẹjú mọ́ ọn
  rationale: Ó fi ojú tí a gbé lé ohun kan hàn, ìyẹn wíwo ẹni náà dáadáa láìyí ojú kúrò; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ἔμφοβος γενόμενος
  choice: ẹ̀rù sì bà á
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé ó wọ ipò ìbẹ̀rù ní àkókò náà, láìsọ pé ìbẹ̀rù náà le débi àníyàn tó pọ̀ jù.
- source_word: Τί ἐστιν
  choice: Kí ni
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe tààrà àti tó bá àyíká ọ̀rọ̀ mu fún bíbéèrè ohun tó ṣẹlẹ̀ tàbí ohun tí òjíṣẹ́ náà fẹ́.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó pa ìforúkọsílẹ̀ ọlọ́lá àti ìbọ̀wọ̀ mọ́. Nínú àyíká yìí, ó lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ sí òjíṣẹ́ ọ̀run, kì í ṣe dandan pé ó jẹ́ ìjẹ́wọ́ nípa Jésù.
- source_word: προσευχαί
  choice: àwọn àdúrà
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ọ̀rọ̀ náà.
- source_word: ἐλεημοσύναι
  choice: àwọn iṣẹ́ àánú
  rationale: Ó mú èrò àánú àti ṣíṣe rere fún àwọn aláìní jáde, ó sì yé òǹkàwé òde òní.
- source_word: ἀνέβησαν
  choice: ti gòkè lọ
  rationale: Ó pa àwòrán ìlọ sókè mọ́, èyí tó lè rántí àdúrà tàbí ọrẹ tí ń gòkè síwájú Ọlọ́run.
- source_word: εἰς μνημόσυνον
  choice: bí ohun ìrántí
  rationale: Ó fi iṣẹ́ gẹ́gẹ́ bí ohun tó mú ẹni wá sí ìrántí hàn, láìfi ìtumọ̀ ìrúbọ pàtó kún ohun tí Gíríìkì sọ.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ìtumọ̀ tààrà ni, ó sì lè túmọ̀ sí ní iwájú tàbí ní ojú Ọlọ́run.
theological_decisions:
- issue: Agbára κύριε nínú ọ̀rọ̀ Kọ̀nẹ́líù sí ẹni ọ̀run náà
  choice: Olúwa, gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ sí òjíṣẹ́ ọ̀run
  alternative: Ọ̀gá; aláṣẹ
  rationale: “Olúwa” pa ọlá inú ọ̀rọ̀ náà àti ìbámu pẹ̀lú κύριος mọ́, ṣùgbọ́n àyíká náà kò fipá mú wa láti ka a sí ìjẹ́wọ́ Kírísítì.
- issue: Ìtumọ̀ ìgbàlà nínú àdúrà àti iṣẹ́ àánú tí ó gòkè bí ohun ìrántí
  choice: Pa àwòrán ohun ìrántí níwájú Ọlọ́run mọ́ láìsọ pé àwọn iṣẹ́ náà ni ó fi gba ìgbàlà
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀san tàbí ohun tí ó fi yẹ fún ìgbàlà
  rationale: Ẹsẹ̀ náà sọ bí Ọlọ́run ṣe rí àdúrà àti iṣẹ́ àánú rẹ̀; kò ṣàlàyé níbí pé àwọn iṣẹ́ náà jẹ́ ìpìlẹ̀ ìdáláre tàbí ìgbàlà.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “tẹjú mọ́ ọn” fún ìwòye tó jinlẹ̀, “ẹ̀rù bà á” fún ìwọlé sí ipò ìbẹ̀rù, àti “ohun ìrántí” láti pa àwòrán orísun mọ́ láìfikún ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò sọ.
