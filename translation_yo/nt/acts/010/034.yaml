id: ACT.10.34
reference: Acts 10:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: yo
  text: Nígbà náà, Peteru la ẹnu rẹ̀, ó sì wí pé, “Nítòótọ́, mo mọ̀ dájú pé Ọlọ́run kì í ṣe ojúsàájú[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “Ọlọ́run kì í ṣe ẹni tí ń gba ojú ènìyàn”; ìyẹn ni pé, kì í ṣe ojú ẹni kan ju ẹlòmíràn lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: la ẹnu rẹ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣeé lóye láti fi hàn pé Peteru bẹ̀rẹ̀ ọ̀rọ̀ pàtàkì kan.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú ìtàn hàn lọ́nà àdánidá nínú Yorùbá.
- source_word: Ἐπ’ ἀληθείας
  choice: Nítòótọ́
  rationale: Ó sọ ìdánilójú àti òtítọ́ ohun tí Peteru ṣẹ̀ṣẹ̀ lóye jáde ní ṣókí.
- source_word: καταλαμβάνομαι
  choice: mo ti mọ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé Peteru ti wá lóye tàbí ti rí òtítọ́ kan dájú; ‘mo ti mọ̀’ jẹ́ èdè Yorùbá àdánidá láì fi ‘ní báyìí’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: προσωπολήμπτης
  choice: kì í ṣe ojúsàájú
  rationale: Ó mú ìtumọ̀ ẹni tí ń ṣe ojúsàájú tàbí tí ń ṣe ojú ẹni kan ju ẹlòmíràn lọ jáde kedere ní Yorùbá òde òní.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún θεός.
theological_decisions:
- issue: Bí a ṣe máa sọ ìwà Ọlọ́run láì fi ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn kún un
  choice: Ọlọ́run kì í ṣe ojúsàájú
  alternative: Ọlọ́run kì í ṣe ojú ẹni kan ju ẹlòmíràn lọ
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ nípa àìṣojúsàájú Ọlọ́run mọ́, láì dín un kù sí ètò ẹ̀kọ́ ìsìn kan pàtó tàbí yanju bí àyíká ẹsẹ tó tẹ̀ lé e ṣe bá àwọn ẹ̀kọ́ míì mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A pa àwòrán ‘la ẹnu rẹ̀’ mọ́ nítorí ìwọ̀n ọ̀rọ̀ rẹ̀, ṣùgbọ́n a tú àkànlò προσωπολήμπτης sí Yorùbá tó ṣeé lóye. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
