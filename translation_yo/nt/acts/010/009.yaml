  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: yo
  text: Ní ọjọ́ kejì, bí àwọn ọkùnrin náà ti ń rin ìrìn-àjò tí wọ́n sì ń sún mọ́ ìlú náà, Pétérù gun orí òrùlé ilé lọ láti gbàdúrà, ní nǹkan bí wákàtí kẹfà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ní nǹkan bí ọ̀sán, gẹ́gẹ́ bí ìṣírò wákàtí ọ̀sán ti àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tọ́ka sí àkókò, ‘ní ọjọ́ kejì.’ A kò fi δέ hàn pẹ̀lú àsopọ̀ ọ̀rọ̀ ọ̀tọ̀, nítorí ìṣàn ìtàn Yorùbá kò béèrè rẹ̀ níbí.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: bí àwọn ọkùnrin náà ti ń rin ìrìn-àjò
  rationale: Ó jẹ́ genitive absolute tó fi ìṣe tó ń lọ ní àkókò kan náà hàn. ‘Àwọn ọkùnrin náà’ ń tọ́ka sí àwọn aṣojú Kọ̀nẹ́líù ní ọ̀nà tó ṣe kedere, ‘ń rin ìrìn-àjò’ sì mú ìtumọ̀ ὁδοιπορέω jáde.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: tí wọ́n sì ń sún mọ́ ìlú náà
  rationale: Ìṣe kejì yìí ń lọ lẹ́gbẹ̀ẹ́ ìrìn-àjò wọn; ‘ń sún mọ́’ dá ìtumọ̀ ἐγγίζω dúró láì sọ pé wọ́n ti dé.
- source_word: ἀνέβη
  choice: gun ... lọ
  rationale: Ọ̀rọ̀ ìṣe aorist yìí túmọ̀ sí pé Pétérù lọ sókè; ‘gun ... lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìlọ sókè sórí òrùlé.
- source_word: ἐπὶ τὸ δῶμα
  choice: orí òrùlé ilé
  rationale: δῶμα ní àyíká yìí ni òrùlé pẹlẹbẹ ilé tí ènìyàn lè gùn sí. ‘Orí òrùlé ilé’ ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: Infinitive yìí sọ ète tí Pétérù fi gun orí òrùlé; ‘láti gbàdúrà’ jẹ́ ìkọ́lé ète tó bójú mu ní Yorùbá.
- source_word: περὶ ὥραν ἕκτην
  choice: ní nǹkan bí wákàtí kẹfà
  rationale: ‘Ní nǹkan bí’ pa ìwọ̀n àfojúsùn περὶ mọ́, ‘wákàtí kẹfà’ sì pa ọ̀nà ìṣírò àkókò inú àṣà orísun mọ́; àlàyé pé ó tó ọ̀sán wà nínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àṣà tó ní iyì, tó sì ṣeé yé fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá; a tún pa ọ̀nà ìṣírò àkókò ti ayé inú ẹsẹ náà mọ́, pẹ̀lú àlàyé àṣà ní ìsàlẹ̀.
