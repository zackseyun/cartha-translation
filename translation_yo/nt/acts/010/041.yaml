id: ACT.10.41
reference: Acts 10:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: yo
  text: Kì í ṣe fún gbogbo ènìyàn, bí kò ṣe fún àwọn ẹlẹ́rìí tí Ọlọ́run ti yàn tẹ́lẹ̀—èyíinì ni àwa[a] tí a jẹ, tí a sì mu pẹ̀lú rẹ̀ lẹ́yìn tí ó jí dìde kúrò nínú òkú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ ‘àwa’ ń dá àwọn ẹlẹ́rìí tí Ọlọ́run ti yàn mọ̀ sí ẹgbẹ́ Peteru.
    reason: appositional_clarification
  - marker: b
    text: Tàbí, “lẹ́yìn tí a jí i dìde kúrò nínú òkú.” Síbẹ̀, ọ̀nà àdánidá láti tú Greek níbí ni “lẹ́yìn tí ó jí dìde kúrò nínú òkú.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: kì í ṣe fún gbogbo àwọn ènìyàn
  rationale: Ó pa ìwọ̀n àwọn tí Jesu farahàn sí mọ́, ó sì mú ìyàtọ̀ rẹ̀ pẹ̀lú ẹgbẹ́ àwọn ẹlẹ́rìí tí a yàn hàn ní Yorùbá àdánidá.
- source_word: μάρτυσι
  choice: àwọn ẹlẹ́rìí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tí wọ́n rí ohun tó ṣẹlẹ̀, tí wọ́n sì ń jẹ́rìí sí i; ‘àwọn ẹlẹ́rìí’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: προκεχειροτονημένοις
  choice: tí Ọlọ́run ti yàn tẹ́lẹ̀
  rationale: Ó fi hàn pé Ọlọ́run ti yan wọn ṣáájú, ìyàn náà sì ṣì ní ipa; ọ̀nà yìí dára ní Yorùbá, ó sì fi aṣojú gbolohun aláìṣe Greek hàn lọ́nà àdánidá.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: tí Ọlọ́run ti yàn
  rationale: Ọlọ́run ni olùṣe nínú gbolohun Greek; Yorùbá máa ń sọ irú èyí lọ́nà aṣéṣe fún ìtumọ̀ tó ṣe kedere.
- source_word: ἡμῖν
  choice: àní fún àwa
  rationale: Ó ń ṣàlàyé pé àwọn ‘ẹlẹ́rìí’ náà ni àwa; ‘àní’ àti àmì gígùn mú àfikún ìdánimọ̀ yìí hàn.
- source_word: οἵτινες
  choice: tí
  rationale: Ó ṣí gbólóhùn ìbátan tó ṣàpèjúwe àwọn ẹlẹ́rìí náà; ‘tí’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: tí a bá a jẹ, tí a sì bá a mu
  rationale: Ó pa ìtumọ̀ jíjẹ àti mímu papọ̀ mọ́, ó sì tẹnumọ́ ìdàpọ̀ wọn pẹ̀lú Jesu lẹ́yìn àjíǹde.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: lẹ́yìn tí ó jí dìde kúrò láàárín àwọn òkú
  rationale: Ìṣe ἀναστῆναι jẹ́ aláìrékọjá níbí, nítorí náà ‘ó jí dìde’ tẹ̀ lé ìṣètò Greek; ‘kúrò láàárín àwọn òkú’ pa àwòrán ἐκ νεκρῶν mọ́.
theological_decisions:
- issue: Ọ̀nà sísọ àjíǹde nínú ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: lẹ́yìn tí ó jí dìde kúrò láàárín àwọn òkú
  alternative: lẹ́yìn tí a jí i dìde kúrò láàárín àwọn òkú
  rationale: Fọ́ọ̀mù Greek ní ẹsẹ yìí bá ‘ó jí dìde’ mu lọ́nà àdánidá. Èyí kò sẹ́ iṣẹ́ Ọlọ́run nínú àjíǹde ní àwọn ibòmíràn; ó kàn ń pa ọ̀nà tí ẹsẹ yìí gbà sọ ọ́ mọ́.
translation_notes:
  register: Yorùbá ìṣàkóso tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. ‘Bá a jẹ… bá a mu’ jẹ́ ọ̀nà àdánidá láti sọ ìdàpọ̀ oúnjẹ àti ohun mímu; a kò fi èrò ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
