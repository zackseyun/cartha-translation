revisions:
- from: 'Jésù ará Násárẹ́tì: bí Ọlọ́run ṣe fi Ẹ̀mí Mímọ́ àti agbára fòróró yàn án[a]; ó ń lọ káàkiri, ó ń ṣe rere, ó sì ń wo gbogbo àwọn tí ó wà lábẹ́ ìnilára Èṣù sàn, nítorí Ọlọ́run wà pẹ̀lú rẹ̀.[b]'
  to: Jésù ará Násárẹ́tì—bí Ọlọ́run ṣe fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án[a]—ní ẹni tí ó lọ káàkiri, tí ó ń ṣe rere, tí ó sì ń wo gbogbo àwọn tí Èṣù ń ni lára sàn, nítorí Ọlọ́run wà pẹ̀lú rẹ̀.[b]
  rationale: 'A revised complete text is warranted because the original wording of the anointing clause is syntactically awkward in Yoruba. The revision preserves the Greek structure and theological restraint: it retains anointing, distinguishes the Holy Spirit from power, preserves the devil as agent of oppression, and renders ὅτι causally. Footnote markers remain correctly anchored and the notes correspond to the revised wording.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft communicates the verse’s principal assertions: God anointed Jesus of Nazareth with the Holy Spirit and power; Jesus did good and healed those oppressed by the devil; and God was with him. However, the construction “fi Ẹ̀mí Mímọ́ àti agbára fòróró yàn án” is not a clear, natural Yoruba way to express anointing with these two instruments. The revision keeps the anointing image while making the instrumental relation explicit. “Àwọn tí Èṣù ń ni lára” more directly and naturally represents those being oppressed by the devil.'
  naturalness: The colon and semicolon are serviceable, but the sentence reads more naturally as a unified Yoruba report introduced by “bí.” “Ó lọ káàkiri” fits the completed narrative reference, while the following progressive verbs describe his characteristic ministry. Replacing the abstract “wà lábẹ́ ìnilára Èṣù” with “Èṣù ń ni lára” improves contemporary clarity without weakening the oppression sense.
  terminology: “Jésù ará Násárẹ́tì,” “Ẹ̀mí Mímọ́,” “Èṣù,” and “Ọlọ́run wà pẹ̀lú rẹ̀” are appropriate. The revision retains explicit anointing language rather than reducing χρίω to empowerment or appointment.
  issues:
  - severity: medium
    issue: Awkward instrumental construction for anointing
    rationale: “Fi Ẹ̀mí Mímọ́ àti agbára fòróró yàn án” can imply that the Holy Spirit and power are oil or can otherwise obscure the grammatical relationship. “Fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án” clearly presents them as the means/endowment while retaining the oil-anointing idiom.
  - severity: low
    issue: Oppression expression is overly abstract
    rationale: “Àwọn tí ó wà lábẹ́ ìnilára Èṣù” is understandable but less idiomatic and makes the devil’s agency less immediate. “Àwọn tí Èṣù ń ni lára” is natural Yoruba and preserves the ongoing passive sense.
  revised_text: Jésù ará Násárẹ́tì—bí Ọlọ́run ṣe fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án[a]—ní ẹni tí ó lọ káàkiri, tí ó ń ṣe rere, tí ó sì ń wo gbogbo àwọn tí Èṣù ń ni lára sàn, nítorí Ọlọ́run wà pẹ̀lú rẹ̀.[b]
  revised_footnotes:
  - marker: a
    text: Ní tààràtà, “fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án.”
    reason: Ìtumọ̀ náà pa àwòrán ìfọ̀róróyàn mọ́, ó sì fi Ẹ̀mí Mímọ́ àti agbára hàn gẹ́gẹ́ bí ohun tí Ọlọ́run fi yan án.
  - marker: b
    text: Tàbí, “nítorí pé Ọlọ́run wà pẹ̀lú rẹ̀.”
    reason: Àwọn ìhun méjèèjì ń fi ipa ìdí tí ὅτι ní hàn.
  revision_rationale: 'A revised complete text is warranted because the original wording of the anointing clause is syntactically awkward in Yoruba. The revision preserves the Greek structure and theological restraint: it retains anointing, distinguishes the Holy Spirit from power, preserves the devil as agent of oppression, and renders ὅτι causally. Footnote markers remain correctly anchored and the notes correspond to the revised wording.'
