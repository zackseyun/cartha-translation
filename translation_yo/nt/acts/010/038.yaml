id: ACT.10.38
reference: Acts 10:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: yo
  text: Jésù ará Násárẹ́tì—bí Ọlọ́run ṣe fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án[a]—ní ẹni tí ó lọ káàkiri, tí ó ń ṣe rere, tí ó sì ń wo gbogbo àwọn tí Èṣù ń ni lára sàn, nítorí Ọlọ́run wà pẹ̀lú rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “fi Ẹ̀mí Mímọ́ àti agbára fọ̀róró yàn án.”
    reason: Ìtumọ̀ náà pa àwòrán ìfọ̀róróyàn mọ́, ó sì fi Ẹ̀mí Mímọ́ àti agbára hàn gẹ́gẹ́ bí ohun tí Ọlọ́run fi yan án.
  - marker: b
    text: Tàbí, “nítorí pé Ọlọ́run wà pẹ̀lú rẹ̀.”
    reason: Àwọn ìhun méjèèjì ń fi ipa ìdí tí ὅτι ní hàn.
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Jésù ará Násárẹ́tì
  rationale: “Ará Násárẹ́tì” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìlú ìbílẹ̀ tàbí ibi tí ènìyàn ti wá hàn, ó sì mú ìtumọ̀ ἀπό jáde láìdà bí èdè àjèjì.
- source_word: ὡς
  choice: bí ... ṣe
  rationale: Ìhun “bí ... ṣe” fi àlàyé nípa ohun tí Ọlọ́run ṣe sí Jésù hàn, ó sì bá ìlò ὡς nínú gbólóhùn yìí mu ju ìtumọ̀ afiwe lọ.
- source_word: ἔχρισεν
  choice: fòróró yàn án
  rationale: Ọ̀rọ̀ yìí pa àwòrán ìfòróróyàn mọ́, pẹ̀lú ìtumọ̀ yíyan ẹni sí iṣẹ́ pàtàkì, láìfi orúkọ oyè “Mèsáyà” kún ẹsẹ náà.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: fi Ẹ̀mí Mímọ́ àti agbára
  rationale: “Fi” mú ipa ohun èlò inú dátífù méjèèjì hàn; a sì ya Ẹ̀mí Mímọ́ sọ́tọ̀ kúrò lára “agbára,” gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: διῆλθεν
  choice: ó ń lọ káàkiri
  rationale: Ó sọ ìrìn-àjò Jésù láti ibì kan dé ibòmíràn gẹ́gẹ́ bí ara iṣẹ́ ìránṣẹ́ rẹ̀ ní èdè Yorùbá tó ṣe déédéé.
- source_word: εὐεργετῶν
  choice: ó ń ṣe rere
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa ìwọ̀n gbígbòòrò iṣẹ́ àǹfààní fún ẹlòmíràn mọ́.
- source_word: ἰώμενος
  choice: ó ń wo ... sàn
  rationale: “Wo ... sàn” ni ọ̀nà Yorùbá àdánidá fún ìmúláradá nínú àyíká yìí.
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: gbogbo àwọn tí ó wà lábẹ́ ìnilára Èṣù
  rationale: Ó pa ìtumọ̀ ìṣàkóso líle tàbí ìnilára tí participle náà ní mọ́, ó sì sọ Èṣù di olùṣe gẹ́gẹ́ bí ὑπό ṣe fi hàn.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: nítorí Ọlọ́run wà pẹ̀lú rẹ̀
  rationale: “Nítorí” mú ipa ìdí tí ὅτι ní hàn kedere, láìsọ ohun tó ju gbólóhùn Gíríìkì lọ.
theological_decisions:
- issue: Ìfòróróyàn Jésù àti iṣẹ́ rẹ̀
  choice: Pa èdè ìfòróróyàn mọ́ nínú “fòróró yàn án.”
  alternative: “Fi agbára fún un” tàbí “yàn án gẹ́gẹ́ bí Mèsáyà.”
  rationale: Àkọ́kọ́ lè sọ ìfòróróyàn di agbára lásán; èkejì sì lè fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún ibi tí akọle Χριστός kò ti fara hàn.
- issue: Ẹni tí “Ẹ̀mí Mímọ́” ń tọ́ka sí
  choice: Lo “Ẹ̀mí Mímọ́” gẹ́gẹ́ bí ìtọ́kasí sí Ẹ̀mí Ọlọ́run, kí a sì yà á sọ́tọ̀ kúrò lára agbára.
  alternative: “ẹ̀mí mímọ́” gẹ́gẹ́ bí agbára tàbí ìwà kan lásán.
  rationale: Ọ̀rọ̀ náà nínú Ìṣe Àwọn Àpọ́sítélì sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́, àti pé καί ya Ẹ̀mí Mímọ́ àti agbára sọ́tọ̀ nínú ẹsẹ yìí.
- issue: Ìdí tí iṣẹ́ ìwòsàn Jésù fi ní agbára
  choice: 'Pa ìtumọ̀ ìdí náà mọ́: “nítorí Ọlọ́run wà pẹ̀lú rẹ̀.”'
  alternative: “Ọlọ́run sì wà pẹ̀lú rẹ̀,” tí kò fi ìbáṣepọ̀ ìdí hàn kedere.
  rationale: ὅτι ń fúnni ní ìdí tàbí ìpìlẹ̀ fún iṣẹ́ rere àti ìwòsàn náà; ìtumọ̀ náà kò yẹ kí ó dín tàbí kí ó túbọ̀ ṣàlàyé ẹni tí Jésù jẹ́ ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àmì àdádúró méjì àti àmì olóṣùwọ̀n ń pa ìhun Gíríìkì tó bẹ̀rẹ̀ pẹ̀lú Jésù, tí ó tẹ̀ lé e pẹ̀lú àlàyé iṣẹ́ Ọlọ́run àti iṣẹ́ Jésù, mọ́ láìjẹ́ kí gbólóhùn náà le láti kà.
