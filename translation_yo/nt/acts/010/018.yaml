source:
  edition: SBLGNT
  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: yo
  text: Wọ́n sì ké pè, wọ́n béèrè bóyá Símónì, ẹni tí a ń pè ní Pétérù, ń gbé níbẹ̀ gẹ́gẹ́ bí àlejò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ń dúró níbẹ̀’ tàbí ‘jẹ́ àlejò níbẹ̀.’ Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ pé ẹni náà ń gbé ní ilé ẹlòmíràn gẹ́gẹ́ bí àlejò.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: wọ́n sì ké
  rationale: Ó fi hàn pé wọ́n gbé ohùn sókè láti pe àwọn tó wà ní ilé kí wọ́n tó béèrè; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ìtumọ̀ gígùn bí ‘lẹ́yìn tí wọ́n ké pè’ lọ.
- source_word: ἐπυνθάνοντο
  choice: wọ́n béèrè
  rationale: Ó túmọ̀ ìwádìí tàbí ìbéèrè wọn ní ọ̀nà tó ṣe kedere. Bí ó tilẹ̀ jẹ́ pé imperfect lè fi ìṣe tó ń lọ hàn, àkópọ̀ ìtàn náà ti jẹ́ kí ọ̀rọ̀ rí bẹ́ẹ̀ láìfi àlàyé kún un.
- source_word: εἰ
  choice: bóyá
  rationale: ‘Bóyá’ ni ọ̀nà Yorùbá tó bójú mu fún ìbéèrè tí a ń ròyìn láìsọ ọ́ ní tààràtà.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Símónì, ẹni tí a ń pè ní Pétérù
  rationale: Ó pa orúkọ méjèèjì mọ́, ó sì fi ìbáṣepọ̀ wọn hàn ní èdè Yorùbá tó ṣe kedere àti àdánidá.
- source_word: ἐνθάδε
  choice: níbẹ̀
  rationale: Nínú ìròyìn ìbéèrè wọn, ‘níbẹ̀’ ń tọ́ka sí ilé tí wọ́n dúró sí, ó sì bá ìrísí ọ̀rọ̀ Yorùbá mu.
- source_word: ξενίζεται
  choice: ń ṣe àlejò
  rationale: Ó mú èrò pàtàkì inú ọ̀rọ̀ Gíríìkì jáde pé ẹni náà ń gbé lọ́dọ̀ ẹlòmíràn gẹ́gẹ́ bí àlejò, kì í ṣe pé ó kàn wà níbẹ̀ lasán.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ń ṣe àlejò’ láti pa àbá ìtẹ́wọ́gbà àlejò inú ξενίζεται mọ́; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
