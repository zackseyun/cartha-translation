id: ACT.10.47
reference: Acts 10:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: yo
  text: “Ǹjẹ́ ẹnikẹ́ni lè dá omi náà dúró kí a má bàa ṣe ìrìbọmi fún àwọn wọ̀nyí[a], àwọn tí wọ́n ti gba Ẹ̀mí Mímọ́ gẹ́gẹ́ bí àwa náà ti gbà á?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ǹjẹ́ ẹnikẹ́ni lè dí àwọn wọ̀nyí lọ́wọ́ omi, kí a má bàa ṣe ìrìbọmi fún wọn?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Ǹjẹ́ ẹnikẹ́ni lè ...?
  rationale: Μήτι mú ìbéèrè àsọgbọ́n tí a ń retí ìdáhùn òdì wá. Èdè Yorùbá adayeba lè fi ‘Ǹjẹ́ ...?’ hàn láìfi ọ̀rọ̀ àfikún tí yóò mú ìtumọ̀ le ju ti Gíríìkì lọ.
- source_word: τὸ ὕδωρ
  choice: omi náà
  rationale: A pa article Gíríìkì mọ́ pẹ̀lú ‘náà’; omi ìrìbọmi tí ọ̀rọ̀ yìí ń tọ́ka sí ni, kì í ṣe omi lápapọ̀.
- source_word: δύναται κωλῦσαί τις
  choice: ẹnikẹ́ni lè kọ̀ láti fi
  rationale: κωλύω níbí túmọ̀ sí dídènà tàbí kíkọ̀ ohun tí a nílò fún ìrìbọmi. ‘Kọ̀ láti fi omi náà ṣe’ jẹ́ àdáni Yorùbá tó bá ohun tí omi jẹ́ nínú gbólóhùn náà mu.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: ṣe ìrìbọmi fún àwọn wọ̀nyí
  rationale: Articular infinitive pẹ̀lú μή sọ nípa dídènà kí a má ṣe baptisi wọn. Ìtúmọ̀ yìí sọ ìṣe náà ní Yorùbá adayeba, nígbà tí àlàyé ẹsẹ̀ fi ọ̀nà tó sún mọ́ ìlànà Gíríìkì hàn.
- source_word: τούτους
  choice: àwọn wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ènìyàn tó wà níwájú Pétérù láìfi kún un pé ọkùnrin nìkan ni gbogbo wọn.
- source_word: οἵτινες
  choice: àwọn tí
  rationale: A pa ìbátan gbólóhùn náà mọ́; ó dá àwọn ènìyàn náà mọ̀ nípasẹ̀ gbígba Ẹ̀mí Mímọ́ wọn, tí ó tún jẹ́ ìdí ọ̀rọ̀ Pétérù.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì yẹ fún akọlé ẹni Ọlọ́run yìí.
- source_word: ἔλαβον
  choice: wọ́n ti gba
  rationale: Aorist náà jẹ́ ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣe pàtàkì sí ìjiyàn lọ́wọ́lọ́wọ́; ‘ti gba’ mú èyí hàn dáadáa.
- source_word: ὡς καὶ ἡμεῖς
  choice: gẹ́gẹ́ bí àwa náà ti gbà á
  rationale: Ó pa ìfiwéra tó ṣe kedere mọ́ láàárín àwọn wọ̀nyí àti Pétérù pẹ̀lú àwọn onígbàgbọ́ Júù mìíràn.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín gbígba Ẹ̀mí Mímọ́ àti ìrìbọmi omi
  choice: A sọ pé wọ́n ti gba Ẹ̀mí Mímọ́ tẹ́lẹ̀, èyí sì ni ìpìlẹ̀ ìbéèrè Pétérù pé kí a má ṣe dá ìrìbọmi omi wọn dúró.
  alternative: Ìtumọ̀ kan tí yóò ṣókùnkùn pé gbígba Ẹ̀mí Mímọ́ ti ṣáájú ìrìbọmi nínú ìtàn yìí.
  rationale: Ìtòlẹ́sẹẹsẹ àti ìjiyàn Gíríìkì fi hàn pé wọ́n gba Ẹ̀mí Mímọ́ ṣáájú ìrìbọmi omi. A pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú ìtàn náà mọ́ láìfi èrò ẹ̀sìn ìjọ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, adayeba, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìrìbọmi’ nínú ọ̀rọ̀ pàtàkì, nígbà tí àlàyé ẹsẹ̀ lo ‘baptisi’ láti pa àṣàyàn ọ̀rọ̀ míì mọ́.
