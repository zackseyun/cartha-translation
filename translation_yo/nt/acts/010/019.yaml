id: ACT.10.19
reference: Acts 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: yo
  text: Nígbà tí Pétérù sì ń ronú jinlẹ̀ nípa ìran náà, Ẹ̀mí náà sọ fún un pé, “Wò ó, àwọn ọkùnrin kan ń wá ọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń wá ọ kiri.”
    reason: ζητέω lè ní ìtumọ̀ “wá” tàbí “wá kiri”; àfikún yìí pa ààyè ìtumọ̀ ọ̀rọ̀ náà mọ́.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ń ronú jinlẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ríronú inú tí ó tẹ̀ síwájú, tí ó sì jinlẹ̀; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá tí ó pa agbára participle náà mọ́.
- source_word: περὶ τοῦ ὁράματος
  choice: nípa ìran náà
  rationale: “Nípa ìran náà” sọ ohun tí Pétérù ń rò lé lórí ní kedere, ó sì bá ìṣètò ọ̀rọ̀ Yorùbá mu.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Nínú àyíká ìtàn Ìṣe 10, Ẹ̀mí Ọlọ́run ni ẹni tí ń darí Pétérù; “Ẹ̀mí náà” dúró ṣinṣin lẹ́gbẹ̀ẹ́ Gíríìkì, tí kò fi ἅγιον (“Mímọ́”) kún un níbí.
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún sísọ pé ẹnì kan bá ẹlòmíràn sọ̀rọ̀.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Àṣẹ àfiyèsí yìí fa ọkàn sí ohun tí ó tẹ̀ lé, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ní iyì.
- source_word: ἄνδρες
  choice: àwọn ọkùnrin kan
  rationale: ἀνήρ ń tọ́ka sí àwọn ọkùnrin ní pàtó; “kan” jẹ́ kí gbolohun náà dùn bí Yorùbá àdánidá láì yí iye tí a kò sọ pàtó padà.
- source_word: ζητοῦντές σε
  choice: ń wá ọ
  rationale: ζητέω níbí túmọ̀ sí pé wọ́n ń gbìyànjú láti rí Pétérù; “ń wá ọ” jẹ́ kedere, àdánidá, ó sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí náà, ìyẹn Ẹ̀mí Ọlọ́run tó ń bá Pétérù sọ̀rọ̀
  alternative: ẹ̀mí kan tàbí ìmọ̀lára inú tí kò ní ẹni pàtó
  rationale: Àyíká Ìṣe 10 fi hàn pé Ẹ̀mí Ọlọ́run ni ó ń darí iṣẹ́ ìránṣẹ́ sí àwọn Kèfèrí; síbẹ̀, a kò fi “Mímọ́” kún ọ̀rọ̀ náà nítorí pé kò sí nínú Gíríìkì ní ẹsẹ yìí.
- issue: Ìtumọ̀ akọ ti ἄνδρες
  choice: àwọn ọkùnrin kan
  alternative: àwọn ènìyàn kan tàbí àwọn àlejò kan
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ akọ ní pàtó, nítorí náà a kò sọ ọ́ di ọ̀rọ̀ tí ó lè túmọ̀ sí akọ tàbí abo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “Wò ó” dípò ọ̀rọ̀ àtijọ́ kan, a sì fi ìlọsíwájú iṣẹ́ hàn nípasẹ̀ “ń ronú” láì fi ọ̀rọ̀ míì tí kò sí nínú Gíríìkì kún un.
