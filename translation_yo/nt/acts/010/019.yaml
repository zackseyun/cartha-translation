  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Nígbà tí Pétérù sì ń ronú jinlẹ̀ nípa ìran náà” ń mú participle tí ó ń lọ lọ́wọ́ (διενθυμουμένου) àti ohun tí ó ń rò lé lórí (περὶ τοῦ ὁράματος) hàn. “Ẹ̀mí náà sọ fún un” ń pa article náà àti ìṣe sísọ mọ́ láì fi “Mímọ́” kún un. “Wò ó” ṣiṣẹ́ gẹ́gẹ́ bí àmì ìfàyèsí fún Ἰδού, àti “àwọn ọkùnrin kan ń wá ọ” ń pa akọ-pàtó ἄνδρες àti ìṣe ζητοῦντες tí ó ń lọ lọ́wọ́ mọ́.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó ní àmì ohùn tó yẹ, ó sì ṣàn dáadáa. “ń ronú jinlẹ̀,” “nípa ìran náà,” àti “sọ fún un” jẹ́ ọ̀nà ìsọ̀rọ̀ òde òní tó yẹ fún register ìtàn mímọ́. “Wò ó” jẹ́ ìpè ìfàyèsí àdánidá nínú àyíká yìí.
  terminology: “Pétérù,” “ìran,” “Ẹ̀mí náà,” àti “àwọn ọkùnrin” bá ìlò Bíbélì Yorùbá mu. Lílo “Ẹ̀mí náà” dájú ní àyíká Ìṣe 10, ṣùgbọ́n kò ju ohun tí Gíríìkì sọ lọ. “Àwọn ọkùnrin kan” jẹ́ ìlò Yorùbá àdánidá fún plural aláìlédè nínú àyíká yìí, láì sọ iye kan pàtó.
