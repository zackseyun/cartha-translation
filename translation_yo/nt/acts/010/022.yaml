id: ACT.10.22
reference: Acts 10:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: yo
  text: Wọ́n sì wí pé, “Kọ̀nẹ́líù, balógun ọgọ́rùn-ún kan, jẹ́ ọkùnrin olódodo tí ó sì bẹ̀rù Ọlọ́run. Gbogbo àwọn Júù ń jẹ́rìí rere sí i.[a] Áńgẹ́lì mímọ́ kan fún un ní ìtọ́ni pé kí ó ránṣẹ́ pè ọ́ wá sí ilé rẹ̀,[b] kí ó sì gbọ́ ọ̀rọ̀ láti ẹnu rẹ.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “láti ọ̀dọ̀ gbogbo orílẹ̀-èdè àwọn Júù.” Níhìn-ín, “orílẹ̀-èdè” ń tọ́ka sí gbogbo ẹgbẹ́ ènìyàn náà, kì í ṣe dandan orílẹ̀-èdè òṣèlú òde òní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “áńgẹ́lì mímọ́ kan rán ọ̀rọ̀ láti ọ̀run sí i pé kí ó ránṣẹ́ pè ọ́.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí gbígba ìbánisọ̀rọ̀ tàbí ìtọ́ni láti ọ̀run; ní àwọn àyíká mìíràn, ó lè túmọ̀ sí “kìlọ̀ fún.”
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “kí ó sì gbọ́ àwọn ọ̀rọ̀ láti ọ̀dọ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ọ̀gágun ọ̀rún kan
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣàlàyé ipò olórí ọmọ ogun Róòmù tí a ń pè ní centurion, láì sọ pé iye àwọn ọmọ ogun rẹ̀ gbọ́dọ̀ jẹ́ ọgọ́rùn-ún ní gbogbo ìgbà.
- source_word: ἀνὴρ δίκαιος
  choice: ọkùnrin olódodo
  rationale: “Olódodo” pa ìtumọ̀ ìwà rere àti ti ẹ̀sìn inú δίκαιος mọ́, nígbà tí “ọkùnrin” dúró fún ἀνήρ ní kedere.
- source_word: φοβούμενος τὸν θεόν
  choice: tí ó sì bẹ̀rù Ọlọ́run
  rationale: Ó pa àkànlò èdè Bíbélì àti agbára ọ̀rọ̀-ìṣe Gíríìkì mọ́, láì pinnu ipò Kọ̀nẹ́líù nínú májẹ̀mú tàbí nípa ìgbàlà.
- source_word: μαρτυρούμενος
  choice: ń jẹ́rìí rere sí i
  rationale: Ẹ̀yà ọ̀rọ̀ náà túmọ̀ sí pé àwọn ẹlòmíràn ń sọ ẹ̀rí rere nípa rẹ̀; àyànfẹ́ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: Gbogbo àwọn Júù
  rationale: Ó mú ìtumọ̀ pé gbogbo ẹgbẹ́ àwọn Júù jáde ní Yorùbá tó rọrùn, láì mú ἔθνος dà bí orílẹ̀-èdè òṣèlú òde òní.
- source_word: ἐχρηματίσθη
  choice: Ó gba ìtọ́ni
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí gbígba ìsọfúnni tàbí ìtọ́ni láti ọ̀run; ẹni tí ìtọ́ni náà ti ọ̀dọ̀ rẹ̀ wá ni a sọ lẹ́yìn rẹ̀.
- source_word: ἀγγέλου ἁγίου
  choice: láti ọ̀dọ̀ áńgẹ́lì mímọ́ kan
  rationale: Ó pa àpèjúwe ἁγίου mọ́, ó sì fi áńgẹ́lì hàn gẹ́gẹ́ bí ẹni tí ó mú ìtọ́ni náà wá.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: kí ó ránṣẹ́ pè ọ́ sí ilé rẹ̀
  rationale: “Ránṣẹ́ pè” túmọ̀ μεταπέμπομαι lọ́nà àdánidá, “sí ilé rẹ̀” sì pa ibi tí a fẹ́ kí Pétérù lọ mọ́.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: kí ó sì gbọ́ ọ̀rọ̀ láti ẹnu rẹ
  rationale: Ó pa “gbọ́ ọ̀rọ̀ láti ọ̀dọ̀ rẹ” mọ́, ṣùgbọ́n “láti ẹnu rẹ” jẹ́ àkànlò Yorùbá àdánidá tí kò sọ ọ̀rọ̀ náà di ìwàásù tàbí ẹ̀kọ́ pàtó.
theological_decisions:
- issue: Bí a ṣe máa sọ ìwà-ìfọkànsìn Kọ̀nẹ́líù láì fi ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò sọ kún un
  choice: ọkùnrin olódodo tí ó sì bẹ̀rù Ọlọ́run
  alternative: ọkùnrin olùfọkànsìn
  rationale: Àyànfẹ́ náà pa àwọn àpèjúwe méjèèjì nínú Gíríìkì mọ́, kò sì pinnu bóyá àpèjúwe yìí fúnra rẹ̀ túmọ̀ sí pé ó ti rí ìgbàlà tàbí pé ó ti di ara àwọn ènìyàn májẹ̀mú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì yé òǹkàwé òde òní. A lo “ọ̀gágun ọ̀rún” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn tó ṣe kedere; a yà gbolóhùn gígùn Gíríìkì sí méjì fún ìṣàn Yorùbá tó dára, láì yí ìbáṣepọ̀ àwọn èrò inú ẹsẹ náà padà.
