id: ACT.10.24
reference: Acts 10:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: yo
  text: Ní ọjọ́ kejì, ó wọ Kesaria[a]. Kọ̀nẹ́líù sì ń retí wọn; ó ti pe àwọn ìbátan rẹ̀ àti àwọn ọ̀rẹ́ tímọ́tímọ́ rẹ̀ jọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ẹyọ, “ó wọ,” ṣùgbọ́n arọ́pò-orúkọ tó tẹ̀ lé e jẹ́ ọ̀pọ̀, “wọn.” Ó ṣeé ṣe kí ìtàn náà ń dojú kọ Pétérù gẹ́gẹ́ bí ẹni pàtàkì jù, nígbà tí Kọ̀nẹ́líù ń retí òun àti àwọn ẹlẹgbẹ́ rẹ̀.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó jẹ́ gbólóhùn àkókò tó bá Yorùbá mu, ó sì pa ìtẹ̀síwájú ìtàn náà mọ́ láìfi ìtumọ̀ líle kún δέ.
- source_word: εἰσῆλθεν
  choice: ó wọ
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ẹyọ; a pa ẹyọ náà mọ́, ó sì ṣeé ṣe kó ń gbé Pétérù kalẹ̀ gẹ́gẹ́ bí olórí àwọn tí wọ́n ń bọ̀.
- source_word: Καισάρειαν
  choice: Kesaria
  rationale: Àkọtọ̀ orúkọ ìlú náà ní ọ̀nà tó bá ìró Yorùbá mu.
- source_word: ὁ δὲ Κορνήλιος
  choice: Kọ̀nẹ́líù sì
  rationale: “Sì” fi ìyípadà ibi tí ìtàn dojú kọ hàn láìdá ìtakora líle sílẹ̀.
- source_word: ἦν προσδοκῶν
  choice: ń retí
  rationale: Ó fi ìṣe tó ń lọ lọ́wọ́ àti ìfojúsọ́nà hàn bí àkópọ̀ ọ̀rọ̀-ìṣe àìpé Gíríìkì ṣe rí.
- source_word: αὐτούς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀, ó ń tọ́ka sí Pétérù àti àwọn tí wọ́n bá a rìn.
- source_word: συγκαλεσάμενος
  choice: ó ti pe ... jọ
  rationale: Ìlò “ti” fi hàn pé Kọ̀nẹ́líù ti pe wọn jọ ṣáájú àkókò tí ó ń retí àwọn àlejò náà.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: àwọn ìbátan rẹ̀
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá òde òní fún àwọn ará tàbí mọ̀lẹ́bí.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: àwọn ọ̀rẹ́ rẹ̀ tímọ́tímọ́
  rationale: Nínú àkópọ̀ yìí, ἀναγκαῖος túmọ̀ sí ọ̀rẹ́ tímọ́tímọ́ tàbí ọ̀rẹ́ tí ó sún mọ́ni, kì í ṣe “ọ̀rẹ́ tí ó ṣe pàtàkì dandan” ní ìtumọ̀ gígùn.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ọ̀rọ̀-ìṣe ẹyọ εἰσῆλθεν àti arọ́pò-orúkọ ọ̀pọ̀ αὐτούς
  choice: A túmọ̀ ọ̀rọ̀-ìṣe náà ní ẹyọ (“ó wọ”), a sì túmọ̀ arọ́pò-orúkọ náà ní ọ̀pọ̀ (“wọn”).
  alternative: Láti sọ “wọ́n wọ” kí iye àwọn méjèèjì lè dọ́gba.
  rationale: Mímú ẹyọ àti ọ̀pọ̀ inú orísun Gíríìkì mọ́ ń pa ìfojúsùn ìtàn sí Pétérù àti wíwà àwọn ẹlẹgbẹ́ rẹ̀ mọ́, láìyanjú àìbáramu náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá; a sì yan “tímọ́tímọ́” láti sọ ìsúnmọ́ àwọn ọ̀rẹ́ náà lọ́nà tó wọ́pọ̀.
