  terminology: Àwọn orúkọ ibi àti àwọn ọ̀rọ̀ ìṣàpèjúwe ènìyàn yẹ. Ṣùgbọ́n orúkọ Τρόφιμος ní /r/ lẹ́yìn fawẹ́lì àkọ́kọ́, èyí tí ‘Tófímù’ kò dúró fún un; ‘Tírófímù’ ń pa ìró orúkọ Gíríìkì náà mọ́ dáadáa ní ìkọ̀wé Yorùbá.
