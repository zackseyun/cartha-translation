id: ACT.20.4
reference: Acts 20:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: yo
  text: Sópátérì ọmọ Pírúsì, ará Bèróà, sì bá a lọ; àti Àrísítákù àti Sẹ́kúńdù láti Tẹsalóníkà; àti Gáyù ará Déríbè, àti Tímótì; àti Tíkíkù àti Tírófímù láti Éṣíà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éṣíà níhìn-ín ni agbègbè ìṣàkóso Róòmù tí orúkọ rẹ̀ ń jẹ́ Éṣíà, kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: bá a lọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí túmọ̀ sí pé ẹni náà ń bá ẹlòmíràn rìnrìn-àjò; “bá a lọ” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: αὐτῷ
  choice: a
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ yìí tọ́ka sí Pọ́ọ̀lù; nínú gbólóhùn “bá a lọ,” ó jẹ́ àfihàn àdánidá fún “pẹ̀lú rẹ̀.”
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sópátérì ọmọ Pírúsì, ará Bèróà
  rationale: Πύρρου jẹ́ gẹnitífù tí ó ṣeé gbà gẹ́gẹ́ bí orúkọ baba, nígbà tí Βεροιαῖος fi ìlú ìbílẹ̀ rẹ̀ hàn.
- source_word: Θεσσαλονικέων
  choice: láti Tẹsalóníkà
  rationale: Gẹnitífù ọ̀pọ̀ yìí kó Àrísítákù àti Sẹ́kúńdù pọ̀ gẹ́gẹ́ bí àwọn ènìyàn láti inú àwọn ará Tẹsalóníkà; “láti Tẹsalóníkà” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: Àrísítákù àti Sẹ́kúńdù
  rationale: Àwọn orúkọ ẹni ni a kọ ní ìbámu pẹ̀lú ìró wọn ní Yorùbá.
- source_word: Γάϊος Δερβαῖος
  choice: Gáyù ará Déríbè
  rationale: Δερβαῖος jẹ́ àpèjúwe ibi tí ẹni náà ti wá; “ará Déríbè” jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: Τιμόθεος
  choice: Tímótì
  rationale: Ìkọ̀wé orúkọ náà tẹ̀lé ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: Ἀσιανοὶ
  choice: láti Éṣíà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn láti agbègbè ìṣàkóso Róòmù tí a ń pè ní Éṣíà, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì Éṣíà òde òní.
- source_word: Τυχικὸς καὶ Τρόφιμος
  choice: Tíkíkù àti Tófímù
  rationale: Àwọn orúkọ ẹni ni a kọ ní ìbámu pẹ̀lú ìró wọn ní Yorùbá.
- source_word: δέ ... δέ ... δέ
  choice: sì ... àti ... àti
  rationale: Àwọn patíkù wọ̀nyí ń fi àwọn ẹgbẹ́ mìíràn kún àtòjọ náà; “sì” àti “àti” mú ìṣọ̀kan àtòjọ náà dúró láìfi ìtumọ̀ tí kò sí nínú orísun kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀, tí ó ṣeé yé fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò Yorùbá mu. A pa ìtẹ̀síwájú àtòjọ Gíríìkì mọ́ ní ọ̀nà àdánidá.
