  source_fidelity: Ìtumọ̀ náà ń ṣàfihàn gbogbo àwọn ọmọ ẹgbẹ́ àtòjọ Gíríìkì, ìbátan Sópátérì pẹ̀lú Pírúsì, ìpilẹ̀ Bèróà, Tẹsalóníkà, Déríbè, àti Éṣíà, àti ìṣe ‘bá a lọ’ fún συνείπετο. Ìtúmọ̀ ‘láti Tẹsalóníkà’ àti ‘láti Éṣíà’ jẹ́ ìmúpadà sí Yorùbá tí ó ṣe kedere fún àwọn àpèjúwe ẹgbẹ́ náà.
