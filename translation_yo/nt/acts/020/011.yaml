  source_fidelity: Àtúnṣe jẹ́ dandan nítorí “àkàrà” kì í ṣe ìtumọ̀ tó yẹ fún ἄρτος nínú àyíká yìí; ó sábà ń túmọ̀ sí oúnjẹ ẹ̀wà tí a din. “Búrẹ́dì” ń tọ́ka sí búrẹ́dì ní kedere. A tún yọ “wọn” àti “níbẹ̀” kúrò, nítorí kò sí ní ọ̀rọ̀ Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká lè jẹ́ kí wọ́n ṣeé lóye. “Ó sì jẹun” ń mú γευσάμενος hàn gẹ́gẹ́ bí jíjẹ/kíkópa nínú oúnjẹ, láì dín un sí ìtọ́wọ́ díẹ̀.
  naturalness: 'Ìtumọ̀ àtúnṣe náà jẹ́ Yorùbá boṣewa, ó sì ń lo ọ̀rọ̀ tó wọ́pọ̀ àti tó péye: “bù búrẹ́dì náà,” “jẹun,” “sọ̀rọ̀ fún ìgbà pípẹ́,” àti “títí di àfẹ̀mọ́jú.” Ìpò àmì ìsàlẹ̀ b ti yí padà sí lẹ́yìn “jẹun,” níbi tí ọ̀rọ̀ tí àlàyé rẹ̀ kan wà.'
