id: ACT.20.11
reference: Acts 20:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: yo
  text: Nígbà náà, ó gòkè lọ, ó bù búrẹ́dì náà[a], ó sì jẹun[b]. Lẹ́yìn tí ó sọ̀rọ̀ fún ìgbà pípẹ́ títí di àfẹ̀mọ́jú, bẹ́ẹ̀ ni ó kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ṣẹ búrẹ́dì.” Gbólóhùn Gíríìkì náà lè tọ́ka sí pínpín oúnjẹ; àwọn kan sì gbà pé ó lè ní í ṣe pẹ̀lú Oúnjẹ Alẹ́ Olúwa.
    reason: alternative_reading
  - marker: b
    text: Ní ti gangan, ọ̀rọ̀ Gíríìkì tó wà fún “jẹun” tún lè túmọ̀ sí “tọ́wọ́” tàbí “kópa nínú oúnjẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: ó gòkè lọ
  rationale: Ó ṣàfihàn ìlọ sókè padà sí yàrá òkè láì fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: κλάσας τὸν ἄρτον
  choice: ó bù àkàrà náà
  rationale: Àpilẹ̀kọ τὸν jẹ́ kí ‘àkàrà náà’ bá ìtumọ̀ pàtó mu; ‘bù’ sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a ṣẹ àkàrà sí wẹ́wẹ́, láì pinnu bóyá oúnjẹ lásán ni tàbí Oúnjẹ Alẹ́ Olúwa.
- source_word: γευσάμενος
  choice: ó sì jẹ ẹ́
  rationale: Nínú àyíká oúnjẹ, γεύομαι lè túmọ̀ sí jíjẹ tàbí kíkópa nínú oúnjẹ, kì í ṣe fífi ẹnu kan án díẹ̀ nìkan.
- source_word: ἐφ’ ἱκανόν
  choice: fún ìgbà pípẹ́
  rationale: Ó mú ìtumọ̀ àkókò gígùn tàbí àkókò tó pọ̀ jáde ní Yorùbá tó ṣe kedere.
- source_word: ὁμιλήσας
  choice: tí ó ti bá wọn sọ̀rọ̀
  rationale: Ó ṣàfihàn ìjíròrò tàbí ọ̀rọ̀ pípẹ́; ‘wọn’ wúlò ní Yorùbá láti sọ ẹni tí a ń bá sọ̀rọ̀, gẹ́gẹ́ bí àyíká ìtàn ṣe fi hàn.
- source_word: ἄχρι αὐγῆς
  choice: títí di àfẹ̀mọ́jú
  rationale: ‘Àfẹ̀mọ́jú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbẹ̀rẹ̀ òwúrọ̀ nígbà tí ilẹ̀ ń mọ́.
- source_word: οὕτως ἐξῆλθεν
  choice: ó sì kúrò níbẹ̀
  rationale: Ó sọ ìparí ìṣẹ̀lẹ̀ náà ní èdè Yorùbá tó rọrùn; οὕτως ń so ìkúrò rẹ̀ mọ́ gbogbo ohun tó ṣẹlẹ̀ ṣáájú.
theological_decisions:
- issue: Bóyá κλάσας τὸν ἄρτον tọ́ka ní pàtó sí Oúnjẹ Alẹ́ Olúwa
  choice: 'A túmọ̀ ọ́ láì dá ìtumọ̀ ẹ̀sìn kan pàtó lé e: ‘ó bù àkàrà náà.’'
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí oúnjẹ àjọṣe lásán, tàbí gẹ́gẹ́ bí ohun tó ní í ṣe pẹ̀lú Oúnjẹ Alẹ́ Olúwa.
  rationale: Gbólóhùn náà lè ní ìbáṣepọ̀ pẹ̀lú Oúnjẹ Alẹ́ Olúwa nínú Ìṣe àwọn Aposteli, ṣùgbọ́n ẹsẹ yìí kò pinnu ìtumọ̀ náà láìsí àní-àní. Ìtumọ̀ náà pa àìdájú tó wà nínú ọ̀rọ̀ ìpilẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè pinnu ohun tí Gíríìkì fi sílẹ̀ ní àìdájú.
