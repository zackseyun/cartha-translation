id: ACT.20.24
reference: Acts 20:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: yo
  text: Ṣùgbọ́n èmi kò ka ìyè mi sí ohun tí ó níye lójú mi[a], àfi kí n lè parí eré-ìje mi[b] àti iṣẹ́ ìránṣẹ́ tí mo gbà lọ́wọ́ Olúwa Jésù—èyí ni láti jẹ́rìí[c] sí ìhìn rere oore-ọ̀fẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn mi sí ohun iyebíye fún ara mi.” A yan “ìyè” nítorí pé níbí Pọ́ọ̀lù múra tán láti dojú kọ ikú kí ó lè parí iṣẹ́ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, δρόμος lè túmọ̀ sí ipa tí a ń sáré tàbí eré-ìje tí a gbọ́dọ̀ parí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “láti fi ẹ̀rí hàn,” tàbí “láti jẹ́rìí tọkàntọkàn” sí ìhìn rere oore-ọ̀fẹ́ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: èmi kò ka ... sí ohun tí ó níye lójú mi
  rationale: Èyí sọ àṣà-ọrọ Gíríìkì náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ dídiwọ̀n iye ohun kan mọ́.
- source_word: ψυχήν
  choice: ìyè
  rationale: Ní àyíká ọ̀rọ̀ yìí, Pọ́ọ̀lù ń sọ nípa fífi ìyè rẹ̀ sínú ewu ikú, kì í ṣe nípa yíya ọkàn tàbí ẹ̀mí sọ́tọ̀ kúrò lára.
- source_word: ὡς τελειῶσαι
  choice: àfi kí n lè parí
  rationale: Ìtumọ̀ yìí fi hàn pé píparí iṣẹ́ náà ni ohun tó ga jù lọ lójú Pọ́ọ̀lù, láìfi ọ̀rọ̀ náà ṣe gẹ́gẹ́ bí gbólóhùn ète lásán.
- source_word: δρόμον
  choice: eré-ìje mi
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ipa tí asáré ń sáré títí dé òpin; ‘eré-ìje’ jẹ́ àwòrán tó ṣe kedere, tó sì bá Yorùbá mu.
- source_word: διακονίαν
  choice: iṣẹ́ ìránṣẹ́
  rationale: Èyí ṣàfihàn iṣẹ́ tí a fi lé Pọ́ọ̀lù lọ́wọ́ láti ṣe, láìdín ọ̀rọ̀ náà mọ́ ipò àlùfáà tàbí ẹ̀sìn kan pàtó.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: tí mo gbà lọ́wọ́ Jésù Olúwa
  rationale: ‘Gbà lọ́wọ́’ sọ orísun iṣẹ́ náà ní Yorùbá àdánidá, ó sì pa oyè κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa.’
- source_word: διαμαρτύρασθαι
  choice: láti jẹ́rìí
  rationale: ‘Jẹ́rìí’ mú ìtumọ̀ fífi ẹ̀rí sọ jáde mú; àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì tún lè ní agbára ìjẹ́rìí tọkàntọkàn tàbí ọ̀wọ̀.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: ìhìn rere oore-ọ̀fẹ́ Ọlọ́run
  rationale: Èyí pa ìsopọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́, kí ó má bàa pinnu bóyá ìhìn rere náà jẹ́ ti oore-ọ̀fẹ́ Ọlọ́run ní ìwà rẹ̀ tàbí pé oore-ọ̀fẹ́ Ọlọ́run ni kókó rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ Pọ́ọ̀lù nípa ara rẹ̀
  choice: ìyè
  alternative: ọkàn
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ nípa ìmúrasílẹ̀ Pọ́ọ̀lù láti fara da ìjìyà àti ikú nítorí iṣẹ́ rẹ̀; ‘ìyè’ yẹra fún fífi ẹ̀kọ́ ìpín ara àti ọkàn tí kò ṣe pàtàkì níbí wọ ọ̀rọ̀ náà.
- issue: Agbára ὡς τελειῶσαι
  choice: àfi kí n lè parí
  alternative: kí n lè parí; kí n lè fi parí
  rationale: Èyí mú ìfẹ́ Pọ́ọ̀lù tó ju gbogbo nǹkan lọ hàn, ṣùgbọ́n kò sọ ìbáṣepọ̀ gírámà náà di ẹ̀kọ́ ìgbàgbọ́ tí ó dín mọ́ ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi gbogbo tí ó bá yẹ. Gbólóhùn náà jẹ́ ti ọ̀wọ̀, ó ṣeé yé fún òǹkàwé òde òní, ó sì pa àwòrán eré-ìje àti ìsopọ̀ ‘oore-ọ̀fẹ́ Ọlọ́run’ mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
