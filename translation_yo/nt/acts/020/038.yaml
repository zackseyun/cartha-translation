translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye. A lo ‘bà wọ́n nínú jẹ́’ fún ìrora ọkàn, a sì pa àwòrán ‘rí ojú rẹ̀’ mọ́. Àwọn àmì ohùn ni a lò níbi tí ó bá yẹ; àwọn àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì àti ìfarahàn μέλλω hàn láì dá àìmọye Gíríìkì dúró sí ọ̀nà kan ṣoṣo.
