source:
  edition: SBLGNT
  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: yo
  text: Inú wọn sì bàjẹ́ jù lọ nítorí ọ̀rọ̀ tí ó ti sọ[a], pé wọn kì yóò rí ojú rẹ̀ mọ́[b][d]. Wọ́n sì bá a lọ sí ọkọ̀ ojú omi náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ohun tí ó ti sọ.” Ní ti gidi, Gíríìkì ní, “lórí ọ̀rọ̀ tí ó ti sọ.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “kì yóò tún rí ojú rẹ̀ mọ́”; ọ̀nà ti ara ẹni ni èyí láti sọ pé wọn kì yóò tún rí i.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Wọ́n sì ń tẹ̀ lé e lọ” tàbí “Wọ́n sì ń sin ín lọ.” Ọ̀rọ̀ ìṣe náà lè túmọ̀ sí bíbá ẹnì kan lọ láti dágbére fún un pẹ̀lú ọlá.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “pé wọn fẹ́rẹ̀ẹ́ má tún rí ojú rẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὀδυνώμενοι μάλιστα
  choice: Ohun tí ó sì bà wọ́n nínú jẹ́ jù lọ
  rationale: Ọ̀rọ̀ yìí fi ìrora ọkàn wọn hàn, ó sì pa μάλιστα mọ́ gẹ́gẹ́ bí ohun pàtàkì jù lọ tó fa ìbànújẹ́ wọn. Ìtumọ̀ náà jẹ́ èdè Yorùbá àdánidá, kì í sì í fi agbára kún ọ̀rọ̀ Gíríìkì ju bó ṣe yẹ lọ.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: ni ọ̀rọ̀ tí ó ti sọ
  rationale: Ó pa λόγος mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀,’ ó sì lo ‘ti sọ’ láti fi hàn pé Pọ́ọ̀lù ti sọ ọ́ ṣáájú ìbànújẹ́ wọn.
- source_word: οὐκέτι μέλλουσιν
  choice: wọn kì yóò ... mọ́
  rationale: Àkójọpọ̀ ‘kì yóò ... mọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ọjọ́ iwájú láti ojú ìṣẹ̀lẹ̀ tó ti kọjá àti ìtumọ̀ οὐκέτι, láì mú un lágbára sí ‘láéláé.’
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: rí ojú rẹ̀
  rationale: Ó pa àwòrán ara ẹni inú Gíríìkì mọ́ dípò fífi í rọ̀ sí ‘rí i’ nìkan.
- source_word: προέπεμπον
  choice: Wọ́n sì bá a lọ dé
  rationale: Ó sọ ìṣe tí ó ń lọ lọ́wọ́ ti bíbá ẹni rìn gẹ́gẹ́ bí ìdágbére ọlọ́lá, láì mú ìtumọ̀ náà di ti ẹgbẹ́ aláàbò.
- source_word: εἰς τὸ πλοῖον
  choice: ibi ọkọ̀ ojú omi
  rationale: ‘Ibi ọkọ̀ ojú omi’ jẹ́ ọ̀nà Yorùbá àdánidá fún ibi tí ọkọ̀ náà wà; ‘ọkọ̀ ojú omi’ sì bá ọ̀rọ̀ ìrìn-àjò inú Ìṣe àwọn Aposteli mu.
