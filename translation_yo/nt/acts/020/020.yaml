  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò pàtàkì ẹsẹ̀ náà wá: Pọ́ọ̀lù kò fà sẹ́yìn nínú kéde ohun tó ṣàǹfààní, ó sì kọ́ wọn ní gbangba àti láti ilé dé ilé. Ṣùgbọ́n “tí ó lè ṣe yín láǹfààní fún yín” tún “fún yín” ṣe lẹ́ẹ̀mejì, ó sì fi agbára ìṣeéṣe (“lè”) kún συμφερόντων láìsí ìdí nínú orísun. Àtúnṣe náà yọ àwọn nǹkan wọ̀nyí kúrò nígbà tó ń pa ìtumọ̀ gbooro mọ́.'
