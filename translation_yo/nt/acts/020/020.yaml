id: ACT.20.20
reference: Acts 20:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: yo
  text: bí mi kò ṣe fà sẹ́yìn láti kéde ohunkóhun tó ṣàǹfààní fún yín àti láti kọ́ yín ní gbangba àti láti ilé dé ilé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí mi kò ṣe dá ara mi dúró láti kéde ohunkóhun tó wúlò fún yín.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὑπεστειλάμην àti τῶν συμφερόντων, láti fi ìtumọ̀ “kò dá ara rẹ̀ dúró” àti “ohun tó wúlò” hàn.
lexical_decisions:
- source_word: ὡς
  choice: bí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ὡς ń mú àlàyé ohun tí Pọ́ọ̀lù fẹ́ kí àwọn olùgbọ́ rẹ̀ rántí wọlé; “bí” bá ìsopọ̀ yẹn mu ní Yorùbá.
- source_word: ὑπεστειλάμην
  choice: kò ṣe fà sẹ́yìn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Pọ́ọ̀lù kò yẹra tàbí dá ara rẹ̀ dúró láti ṣe ohun tó yẹ; “fà sẹ́yìn” pa àwòrán àti agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῶν συμφερόντων
  choice: ohunkóhun tí ó lè ṣe yín láǹfààní fún yín
  rationale: συμφέρω tọ́ka sí ohun tó ṣàǹfààní tàbí tó wúlò. Àtúmọ̀ yìí jẹ́ kó ṣe kedere pé kì í ṣe èrè owó, kò sì dín ìtumọ̀ rẹ̀ kù sí ẹ̀kọ́ ẹ̀sìn nìkan.
- source_word: ἀναγγεῖλαι
  choice: láti kéde
  rationale: ἀναγγέλλω túmọ̀ sí láti kéde, sọ di mímọ̀, tàbí ròyìn; “kéde” bá iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù mu, ó sì yàtọ̀ díẹ̀ sí “kọ́.”
- source_word: διδάξαι
  choice: láti kọ́ yín
  rationale: διδάσκω túmọ̀ ní tààrà sí kíkọ́ni; a pa àfikún “yín” mọ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí.
- source_word: δημοσίᾳ
  choice: ní gbangba
  rationale: Èyí ń tọ́ka sí ibi tàbí ọ̀nà tí gbogbo ènìyàn lè rí tàbí gbọ́; “ní gbangba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: κατ’ οἴκους
  choice: láti ilé dé ilé
  rationale: κατά pẹ̀lú ọ̀pọ̀ oἴκους ní agbára pínpín, ó ń tọ́ka sí iṣẹ́ tí a ṣe ní ilé kọ̀ọ̀kan; “láti ilé dé ilé” pa ìtumọ̀ yìí mọ́.
theological_decisions:
- issue: Ìtumọ̀ ohun tó “ṣe láǹfààní”
  choice: Ohun gbogbo tó lè ṣe àwọn olùgbọ́ láǹfààní, pẹ̀lú àǹfààní ẹ̀mí nínú àyíká iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù
  alternative: Àǹfààní ẹ̀mí nìkan tàbí àǹfààní ní gbogbo ọ̀nà láìsí ìtọ́kasí àyíká
  rationale: Àyíká náà jẹ́ ti iṣẹ́ olùṣọ́-àgùntàn àti ìkọ́ni Pọ́ọ̀lù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbooro. Àtúmọ̀ náà kò fi ẹ̀kọ́ ìsìn àfikún sínú rẹ̀, kò sì mú kí ó dà bí èrè owó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn ní kíkún. “Fà sẹ́yìn,” “ní gbangba,” àti “láti ilé dé ilé” jẹ́ àwọn gbólóhùn tí òǹkàwé Yorùbá lásán lè lóye, tí wọ́n sì pa àwòrán àti ìṣètò orísun Gíríìkì mọ́.
