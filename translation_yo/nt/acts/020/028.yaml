id: ACT.20.28
reference: Acts 20:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: yo
  text: Ẹ máa kíyè sí ara yín dáadáa àti gbogbo agbo, láàárín èyí tí Ẹ̀mí Mímọ́ ti fi yín ṣe àwọn alábòójútó, láti máa ṣe olùṣọ́ àgùntàn fún ìjọ Ọlọ́run[a], èyí tí ó rà fún ara rẹ̀ nípasẹ̀ ẹ̀jẹ̀ Ọmọ tirẹ̀[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘ìjọ Olúwa’ dípò ‘ìjọ Ọlọ́run.’
    reason: textual_variant
  - marker: b
    text: Tàbí, ‘èyí tí ó rà fún ara rẹ̀ nípasẹ̀ ẹ̀jẹ̀ ẹni tirẹ̀.’
    reason: alternative_reading
  - marker: c
    text: 'Ní ìtumọ̀ ìbílẹ̀: ‘èyí tí ó rà pẹ̀lú ẹ̀jẹ̀ tirẹ̀.’'
    reason: previous_rendering
lexical_decisions:
- source_word: προσέχετε
  choice: Ẹ máa kíyè sí ... dáadáa
  rationale: Àṣẹ ìsinsìnyí ń béèrè fún ìṣọ́ra tí ń bá a lọ; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì kan ara àwọn olórí àti ojúṣe wọn.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: gbogbo agbo
  rationale: Ó pa àpẹẹrẹ agbo ẹran mọ́, ó sì fi παντί hàn gẹ́gẹ́ bí ‘gbogbo.’
- source_word: ἐν ᾧ
  choice: láàárín èyí tí
  rationale: Nítorí agbo jẹ́ àkójọpọ̀ àwọn ènìyàn, ‘láàárín’ fi hàn pé àwọn alábòójútó náà wà nínú agbo, kì í ṣe lókè rẹ̀ tàbí lẹ́yìn rẹ̀.
- source_word: ἔθετο
  choice: ti fi yín ṣe
  rationale: Nínú àyíká yìí τίθημι túmọ̀ sí yíyan tàbí fífi ènìyàn sí ipò iṣẹ́ kan.
- source_word: ἐπισκόπους
  choice: àwọn alábòójútó
  rationale: Ó túmọ̀ ipa ìtọ́jú àti àbójútó láìfi ìtumọ̀ ipò ṣọ́ọ̀ṣì ti àkókò tó tẹ̀ lé e kún un.
- source_word: ποιμαίνειν
  choice: láti máa ṣe olùṣọ́ àgùntàn fún
  rationale: Ó pa àpẹẹrẹ iṣẹ́ olùṣọ́ àgùntàn mọ́, ó sì fi iṣẹ́ ìtọ́jú tí ń bá a lọ hàn.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: Níbí, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn ènìyàn Ọlọ́run; ‘ìjọ’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Èyí tẹ̀ lé SBLGNT, tí ó ka θεοῦ; àyípadà ‘Olúwa’ wà ní àlàyé ìsàlẹ̀.
- source_word: περιεποιήσατο
  choice: rà fún ara rẹ̀
  rationale: Ìṣe àárín gbólóhùn náà ní ìtumọ̀ pé ó ní tàbí gba ohun náà fún ara rẹ̀. ‘Rà fún ara rẹ̀’ jẹ́ Yorùbá tó ṣe kedere, ó sì bá ọ̀nà ẹ̀jẹ̀ tí a mẹ́nu kàn mu.
- source_word: διὰ τοῦ αἵματος
  choice: nípasẹ̀ ẹ̀jẹ̀
  rationale: διά pẹ̀lú ẹ̀yà olùní fi ọ̀nà tàbí ohun èlò iṣẹ́ hàn; ‘nípasẹ̀’ pa ìtumọ̀ yẹn mọ́.
- source_word: τοῦ ἰδίου
  choice: Ọmọ tirẹ̀
  rationale: ἴδιος lè dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ fún ‘ẹni tirẹ̀,’ tí a sábà lóye sí Ọmọ rẹ̀. Fífi ‘Ọmọ’ sínú ọrọ̀ pàtàkì mú Yorùbá jẹ́ àdánidá; àlàyé ìsàlẹ̀ pa ìkìmọ́ àti àwọn òye míì mọ́.
theological_decisions:
- issue: Ìtọ́kasí àti ipa τοῦ αἵματος τοῦ ἰδίου
  choice: nípasẹ̀ ẹ̀jẹ̀ Ọmọ tirẹ̀
  alternative: nípasẹ̀ ẹ̀jẹ̀ ẹni tirẹ̀; tàbí ‘pẹ̀lú ẹ̀jẹ̀ tirẹ̀’
  rationale: Gíríìkì jẹ́ kúkúrú, ἴδιος sì lè jẹ́ ọ̀rọ̀-orúkọ fún ‘ẹni tirẹ̀,’ tí ọ̀pọ̀ ènìyàn lóye sí Ọmọ. Yorùbá nílò ohun tí ‘tirẹ̀’ ń ṣàpèjúwe kí gbólóhùn lè ṣe kedere; ṣùgbọ́n àwọn àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan àti ìtumọ̀ àṣà hàn, kí a má bà a dákẹ́ yanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà.
- issue: Àyípadà ìwé-kíkà τοῦ θεοῦ / τοῦ κυρίου
  choice: ìjọ Ọlọ́run
  alternative: ìjọ Olúwa
  rationale: Ọ̀rọ̀ pàtàkì tẹ̀ lé SBLGNT (θεοῦ), nígbà tí àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ ẹ̀rí àfọwọ́kọ míì.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹ máa...’ fi àṣẹ fún ọ̀pọ̀ ènìyàn àti ìṣe tí ń bá a lọ hàn. Àwọn ọ̀rọ̀ ‘agbo,’ ‘olùṣọ́ àgùntàn,’ àti ‘alábòójútó’ pa àwòrán iṣẹ́ olùṣọ́ àti ojúṣe àwọn olórí mọ́ láìgbé ètò ìjọ ẹ̀ya kan wọ inú ẹsẹ náà.
