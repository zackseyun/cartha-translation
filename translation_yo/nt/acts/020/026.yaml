  source_fidelity: Ìtumọ̀ náà dá ìsopọ̀ ìpinnu ti διότι, ìjẹ́rìí ọlọ́wọ̀ ti μαρτύρομαι, àti àwòrán ẹ̀bi ẹ̀jẹ̀ nínú ἀπὸ τοῦ αἵματος πάντων mọ́. Ṣùgbọ́n ‘mo mọ́ nípa ẹ̀jẹ̀’ kò jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘aláìlẹ́bi nínú/ní ti ẹ̀jẹ̀’; ó lè dà bí ‘I know about blood.’
