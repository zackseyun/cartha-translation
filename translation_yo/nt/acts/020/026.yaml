  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: yo
  text: Nítorí náà, mo jẹ́rìí fún yín lónìí pé mo jẹ́ aláìlẹ́bi ní ti ẹ̀jẹ̀ gbogbo ènìyàn[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀jẹ̀ gbogbo ènìyàn kò wà lára mi”; àkànlò Gíríìkì náà túmọ̀ sí pé kò ní ẹ̀bi tàbí ojúṣe ní ti ìparun àwọn ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ọ̀rọ̀ yìí tún àwòrán olùṣọ́ nínú Ìsíkíẹ́lì sọ, níbi tí a ti ń sọ̀rọ̀ nípa ẹ̀bi ẹ̀jẹ̀ (fún àpẹẹrẹ, Ìsíkíẹ́lì 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Nítorí náà
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń fa ìparí ọ̀rọ̀ yìí jáde láti inú ohun tó ṣẹ̀ṣẹ̀ sọ nípa bí kò ṣe fà sẹ́yìn.
- source_word: μαρτύρομαι
  choice: mo jẹ́rìí fún yín
  rationale: Ọ̀rọ̀ náà jẹ́ ìjẹ́rìí ẹni fúnra rẹ̀ tí ó ní ìwọ̀n àti ìdúróṣinṣin; gbólóhùn Yorùbá yìí dá ìtumọ̀ náà mọ́.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: ní ọjọ́ òní
  rationale: Ó pa ìrísí ọ̀rọ̀ ọlọ́wọ̀ àti ọ̀wọ̀ pàtàkì inú Gíríìkì mọ́ ju ‘lónìí’ lọ, síbẹ̀ ó jẹ́ èdè Yorùbá àdánidá.
- source_word: καθαρός
  choice: mọ́
  rationale: ‘Mọ́’ ni ìtumọ̀ gígùn ti καθαρός, ó sì bá àwòrán Bíbélì ti mímọ́ kúrò nínú ẹ̀bi ẹ̀jẹ̀ mu; àlàyé ìsàlẹ̀ ojú-ewé ṣàlàyé ìtumọ̀ àkànlò náà.
- source_word: ἀπὸ τοῦ αἵματος πάντων
  choice: nípa ẹ̀jẹ̀ gbogbo ènìyàn
  rationale: ‘Mọ́ nípa ẹ̀jẹ̀’ jẹ́ àkànlò Yorùbá tó lè gbé èrò àìní ẹ̀bi tàbí ojúṣe nínú ẹ̀jẹ̀ ẹlòmíràn, láìsọ àwòrán orísun di àlàyé lásán.
theological_decisions:
- issue: Ìtumọ̀ ‘mímọ́ nípa ẹ̀jẹ̀ gbogbo ènìyàn’
  choice: Àkànlò tó túmọ̀ sí pé Pọ́ọ̀lù kò ní ẹ̀bi tàbí ojúṣe nípa ìparun àwọn ẹlòmíràn, nítorí ó ti ṣe ojúṣe rẹ̀ láti kìlọ̀ àti láti kọ́ wọn.
  alternative: Kí ó tọ́ka sí pé Pọ́ọ̀lù kò lọ́wọ́ nínú ikú ara ẹnikẹ́ni nìkan.
  rationale: Ọ̀rọ̀ náà fara jọ àwòrán olùṣọ́ nínú Ìsíkíẹ́lì, àyíká Ìṣe 20 sì ń sọ nípa bí Pọ́ọ̀lù ṣe kéde gbogbo ète Ọlọ́run. A fi àkànlò náà sílẹ̀ láìdín ìtumọ̀ rẹ̀ kù sí ikú ara nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. ‘Ní ọjọ́ òní’ pa ìwọ̀n ọ̀rọ̀ ìjẹ́rìí mọ́; ‘mo mọ́ nípa ẹ̀jẹ̀’ sì pa àwòrán ẹ̀jẹ̀ àti àìní ẹ̀bi orísun mọ́, pẹ̀lú àlàyé ní ìsàlẹ̀ ojú-ewé.
