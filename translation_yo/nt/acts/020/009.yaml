revisions:
- from: Ọ̀dọ́kùnrin kan tí orúkọ rẹ̀ ń jẹ́ Eutiku sì jókòó ní ẹnu fèrèsé. Bí Paulu ti ń sọ̀rọ̀ pẹ́, oorun àsùnwọra ńlá bẹ̀rẹ̀ sí í mú un; nígbà tí oorun sì borí rẹ̀, ó jábọ́ láti òkè ilẹ̀ kẹta sí ìsàlẹ̀, wọ́n sì gbé e dìde ní òkú.[a]
