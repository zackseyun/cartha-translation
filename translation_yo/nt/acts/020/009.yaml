id: ACT.20.9
reference: Acts 20:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: yo
  text: Ọ̀dọ́kùnrin kan tí orúkọ rẹ̀ ń jẹ́ Eutiku sì jókòó ní ẹnu fèrèsé. Bí Paulu ti ń sọ̀rọ̀ pẹ́, oorun jíjin ń borí rẹ̀; nígbà tí oorun sì borí rẹ̀ pátápátá, ó jábọ́ láti ilẹ̀ kẹta sí ìsàlẹ̀, wọ́n sì gbé e sókè, ó sì ti kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n gbé e lọ, ó sì ti kú.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “gbé e sókè” tàbí “gbé e lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος
  choice: jókòó
  rationale: Ó ṣàpèjúwe ipò tí Eutiku wà nígbà ìṣẹ̀lẹ̀ náà; ‘jókòó’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τις νεανίας
  choice: ọ̀dọ́kùnrin kan
  rationale: ‘Kan’ pa àìdánimọ̀ τις mọ́, ‘ọ̀dọ́kùnrin’ sì túmọ̀ νεανίας ní èdè òde òní.
- source_word: ὀνόματι Εὔτυχος
  choice: tí orúkọ rẹ̀ ń jẹ́ Eutiku
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni; a ṣe àkọsílẹ̀ orúkọ Gíríìkì náà gẹ́gẹ́ bí Eutiku.
- source_word: ἐπὶ τῆς θυρίδος
  choice: ní ẹnu fèrèsé
  rationale: Ó fi hàn pé ó jókòó ní àyè tí fèrèsé ṣí sí, èyí tó bá ìjábọ́ náà mu.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: oorun àsùnwọra ńlá bẹ̀rẹ̀ sí í mú un
  rationale: Ó pa ìlọsíwájú bí oorun jíjìn ṣe ń borí rẹ̀ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: bí Paulu ti ń sọ̀rọ̀ pẹ́
  rationale: Ó túmọ̀ àkókò gígùn tí Paulu fi ń sọ̀rọ̀ láìfi dandan sọ pé ìjíròrò alágbàwí ni.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: nígbà tí oorun sì borí rẹ̀
  rationale: Ó fi ìṣẹ́gun oorun ní àkókò pàtó hàn, lẹ́yìn ìlọsíwájú tí gbolohun àkọ́kọ́ ṣàpèjúwe.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: ó jábọ́ láti òkè ilẹ̀ kẹta sí ìsàlẹ̀
  rationale: ‘Ilẹ̀ kẹta’ fi τρίστεγον hàn, ‘sí ìsàlẹ̀’ sì pa ìtọ́sọ́nà κάτω mọ́.
- source_word: ἤρθη νεκρός
  choice: wọ́n sì gbé e dìde ní òkú
  rationale: ‘Gbé e dìde’ bá ìgbé ẹni sókè láti ibi tó ṣubú mu; ‘ní òkú’ sọ νεκρός ní tààrà láìrọ̀ ọ́.
theological_decisions:
- issue: Bóyá kí νεκρός túmọ̀ sí pé ó kú ní tòótọ́ tàbí pé ó dà bí ẹni tó kú
  choice: ní òkú
  alternative: bí ẹni pé ó kú
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ó jẹ́ òkú ní tààrà, kò sì ní àmì àìdánilójú; ìtumọ̀ kò gbọ́dọ̀ rọ ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. A pa ìtàn náà mọ́ ní ọ̀nà tó yára, a sì yẹra fún fífi àlàyé ẹ̀kọ́ ìsìn kún un.
