id: ACT.20.31
reference: Acts 20:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: yo
  text: Nítorí náà, ẹ máa ṣọ́ra, kí ẹ sì máa rántí pé, fún ọdún mẹ́ta, ní òru àti ní ọ̀sán, mi ò dáwọ́ dúró láti máa kìlọ̀ fún olúkúlùkù[a] pẹ̀lú omijé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti máa tọ́ni sí ọ̀nà fún olúkúlùkù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìkìlọ̀ àtúnṣe àti ìtọ́ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí ó jáde láti inú ìkìlọ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: γρηγορεῖτε
  choice: ẹ máa ṣọ́ra
  rationale: Àṣẹ ìsinsìnyí ń béèrè fún ìṣọ́ra tí yóò máa bá a lọ; gbólóhùn yìí ṣe kedere, ó sì bójú mu èrò jíjíròrò.
- source_word: μνημονεύοντες
  choice: kí ẹ sì máa rántí
  rationale: Ó pa ìbáṣepọ̀ pẹ̀lú àṣẹ àkọ́kọ́ mọ́, ó sì fi ìrántí àpẹẹrẹ Pọ́ọ̀lù hàn gẹ́gẹ́ bí ohun tó ń bá ìṣọ́ra wọn lọ.
- source_word: τριετίαν
  choice: fún ọdún mẹ́ta
  rationale: Ó túmọ̀ àkókò gígùn tí accusative náà ń tọ́ka sí ní Yorùbá àdánidá.
- source_word: νύκτα καὶ ἡμέραν
  choice: ní òru àti ní ọ̀sán
  rationale: Ó pa ètò ọ̀rọ̀ Gíríìkì, ‘òru àti ọ̀sán,’ mọ́, ó sì sọ iṣẹ́ tí kò dáwọ́ dúró di mímọ̀.
- source_word: οὐκ ἐπαυσάμην
  choice: èmi kò dáwọ́ ... dúró
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún iṣẹ́ tí Pọ́ọ̀lù kò dáwọ́ rẹ̀ dúró.
- source_word: μετὰ δακρύων
  choice: pẹ̀lú omijé
  rationale: Ó pa ìtumọ̀ accompaniment àti ìmọ̀lára líle tó wà nínú iṣẹ́ Pọ́ọ̀lù mọ́.
- source_word: νουθετῶν
  choice: dídánilẹ́kọ̀ọ́
  rationale: ‘Dánilẹ́kọ̀ọ́’ lè gbé ìtọ́nisọ́nà tó ní àtúnṣe àti ìkìlọ̀ nínú, láì sọ ọ́ di ìkọ́ni lásán.
- source_word: ἕνα ἕκαστον
  choice: olúkúlùkù yín
  rationale: Ó fi ìtọju ẹni-kọ̀ọ̀kan hàn; ‘yín’ jẹ́ ohun tí àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń bá àwọn alàgbà náà sọ̀rọ̀.
theological_decisions:
- issue: Agbára iṣẹ́ olùṣọ́-àgùntàn nínú νουθετῶν
  choice: dídánilẹ́kọ̀ọ́
  alternative: kíkìlọ̀ fún
  rationale: Yíyan ‘dídánilẹ́kọ̀ọ́’ pa ìtọ́nisọ́nà, àtúnṣe, àti ìkìlọ̀ onífẹ̀ẹ́ mọ́; àlàyé ìsàlẹ̀ sì fi àṣàyàn tó tẹnumọ́ ìkìlọ̀ hàn láì fi agbára kan ṣoṣo lé ọ̀rọ̀ Gíríìkì náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. A lo àṣẹ ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì pa ìtẹnumọ́ iṣẹ́ ẹni-kọ̀ọ̀kan àti omijé Pọ́ọ̀lù mọ́.
