id: ACT.20.32
reference: Acts 20:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: yo
  text: Ní báyìí, mo fi yín lé Ọlọ́run lọ́wọ́ àti ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀[a], èyí tí ó ní agbára láti mú yín dàgbà àti láti fún yín ní ogún pẹ̀lú gbogbo àwọn tí a ti sọ di mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Ọlọ́run, ẹni tí ó ní agbára,’ bí a bá mú gbólóhùn náà tọ́ka ní pàtàkì sí Ọlọ́run dípò sí ‘ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀.’
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: mo fi yín lé Ọlọ́run lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pọ́ọ̀lù ń fi àwọn olùgbọ́ rẹ̀ sí abẹ́ àbójútó Ọlọ́run; ‘fi ... lé ... lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbẹ́kẹ̀lé irú èyí.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: àti ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀
  rationale: Ó pa ìṣètò gírámà Gíríìkì àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ λόγος mọ́; ‘ọ̀rọ̀’ tún lè tọ́ka sí iṣẹ́ ìwàásù tàbí ìhìn tí a kéde.
- source_word: τῷ δυναμένῳ
  choice: èyí tí ó lágbára
  rationale: ‘Èyí’ tọ́ka ní àkọ́kọ́ sí ‘ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀,’ tó jẹ́ ohun tó sún mọ́ ọ jù; síbẹ̀, gírámà náà tún lè tọ́ka sí Ọlọ́run, nítorí náà a fi àṣàyàn yẹn sínú àlàyé ìsàlẹ̀.
- source_word: οἰκοδομῆσαι
  choice: láti gbé ró
  rationale: ‘Gbé ró’ sọ àpẹẹrẹ iṣẹ́ ìkọ́lé ní ọ̀nà àdánidá, ó sì lè túmọ̀ sí mímú ènìyàn dàgbà tàbí dúró ṣinṣin nípa tẹ̀mí láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: láti fi ogún náà fúnni
  rationale: Ó pa ‘ogún’ gẹ́gẹ́ bí ohun tí a fi fúnni mọ́, nígbà tí ‘fúnni’ kò sọ ẹni tí ó gbà á ní pàtó ju bí Gíríìkì ṣe sọ lọ.
- source_word: κληρονομίαν
  choice: ogún náà
  rationale: ‘Ogún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìpín tàbí ohun ìní tí a jogún, ó sì pa ìtumọ̀ Bíbélì rẹ̀ mọ́.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: láàrín gbogbo àwọn tí a ti sọ di mímọ́
  rationale: 'Ìtumọ̀ ọ̀rọ̀-ìṣe yìí pa àkókò pípé àti ohùn àgbàgbọ́ Gíríìkì mọ́: a ti sọ wọ́n di mímọ́, ipò náà sì ń bá a lọ.'
theological_decisions:
- issue: Ohun tí τῷ δυναμένῳ ń tọ́ka sí
  choice: 'A mú un tọ́ka sí ‘ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀’ nínú ọ̀rọ̀ pàtàkì: ‘èyí tí ó lágbára.’'
  alternative: 'Ó lè tọ́ka ní pàtàkì sí Ọlọ́run: ‘ẹni tí ó lágbára.’'
  rationale: Gírámà Gíríìkì gba méjèèjì láàyè. ‘Ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀’ ni ohun tó sún mọ́ ọ jù, ṣùgbọ́n Ọlọ́run fúnra rẹ̀ lè jẹ́ olùṣe tó ń gbé ró tí ó sì ń fúnni ní ogún. A pa àìdánilójú tòótọ́ náà mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àwùjọ tí ó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá, a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
