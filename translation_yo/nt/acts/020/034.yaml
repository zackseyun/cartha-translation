  text: αὐτοὶ γινώσκετε ὅτι ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ ὑπηρέτησαν αἱ χεῖρες αὗται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: yo
  text: Ẹ̀yin fúnra yín mọ̀ pé ọwọ́ wọ̀nyí ti pèsè fún àìní mi àti ti àwọn tí ó wà pẹ̀lú mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọwọ́ wọ̀nyí ti ṣe ìrànlọ́wọ́ fún àìní mi àti ti àwọn tí ó wà pẹ̀lú mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ iṣẹ́ ìrànlọ́wọ́ tí ó yọrí sí ìpèsè ohun ìní.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Ẹ̀yin fúnra yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́; “Ẹ̀yin fúnra yín” pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá àdánidá.
- source_word: γινώσκετε
  choice: mọ̀
  rationale: Ó ṣàfihàn pé àwọn olùgbọ́ ní ìmọ̀ tààrà nípa ìwà àti iṣẹ́ Pọ́ọ̀lù.
- source_word: ταῖς χρείαις μου
  choice: àwọn ohun tí èmi ... nílò
  rationale: χρεία tọ́ka sí àwọn ohun ìṣe-ayé tí ó ṣe pàtàkì; ọ̀nà yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: àwọn tí ó wà pẹ̀lú mi
  rationale: Ó tẹ̀lé ìtumọ̀ àkójọpọ̀ alábápín Gíríìkì láì sọ irú ìbáṣepọ̀ wọn ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ὑπηρέτησαν
  choice: ṣiṣẹ́ láti pèsè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe iṣẹ́ tàbí ìrànlọ́wọ́; nínú àyíká ọwọ́ àti àìní, “ṣiṣẹ́ láti pèsè” mú iṣẹ́ ọwọ́ tí ó yọrí sí ìpèsè ohun ìní hàn ní Yorùbá àdánidá.
- source_word: αἱ χεῖρες αὗται
  choice: ọwọ́ wọ̀nyí
  rationale: Ó pa àwòrán àti ìtẹnumọ́ àsọjáde Gíríìkì mọ́, bí Pọ́ọ̀lù ṣe ń tọ́ka sí ọwọ́ rẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A pa àwòrán “ọwọ́ wọ̀nyí” mọ́, ṣùgbọ́n a lo “ṣiṣẹ́ láti pèsè” láti jẹ́ kí ìbáṣepọ̀ ọwọ́ náà pẹ̀lú àwọn àìní wọn ṣàn dáadáa ní Yorùbá.
