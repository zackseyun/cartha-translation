  source_fidelity: Ìtumọ̀ náà gbé ìtẹnumọ́ “Ẹ̀yin fúnra yín,” àwòrán “ọwọ́ wọ̀nyí,” àti ìtumọ̀ ìpèsè fún àìní kalẹ̀ dáadáa. Ṣùgbọ́n “níló” lè hàn gẹ́gẹ́ bí àkókò ìsinsìnyí, níbi tí ὑπηρέτησαν jẹ́ aoristi tí ó tọ́ka sí ohun tí ó ti ṣẹlẹ̀. Àtúnṣe náà lo “ti pèsè” láti fi èyí hàn, ó sì sọ pé ìpèsè náà kan àìní Pọ́ọ̀lù àti ti àwọn ẹlẹgbẹ́ rẹ̀.
