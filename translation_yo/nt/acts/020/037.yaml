translation:
  language: yo
  text: Gbogbo wọn sì sọkún gidigidi; wọ́n sì fi apá dì mọ́ ọrùn Pọ́ọ̀lù, wọ́n sì ń fi ẹnu kò ó léraléra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: Gbogbo wọn sì sọkún gidigidi
  rationale: Èyí sọ ní èdè Yorùbá àdánidá pé gbogbo àwọn tó wà níbẹ̀ sunkún púpọ̀, ó sì pa okun ìmọ̀lára inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: wọ́n dì mọ́ Pọ́ọ̀lù ní ọrùn
  rationale: Ọ̀rọ̀ yìí fi ìgbámọ́ra onífẹ̀ẹ́ hàn, ó sì pa àwòrán ọrùn tí orísun Gíríìkì sọ ní pàtó mọ́ láì lo ìtumọ̀ aláìdánidá.
- source_word: κατεφίλουν αὐτόν
  choice: wọ́n sì ń fi ẹnu kò ó léraléra
  rationale: Àkókò imperfect nínú Gíríìkì tọ́ka sí ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra; gbólóhùn yìí mú ìtumọ̀ méjèèjì jáde ní kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. A yan ọ̀rọ̀ àdánidá fún ẹkún, ìgbámọ́ra ní ọrùn, àti fífi ẹnu kọni léraléra, nígbà tí a pa líle àti ìtẹ̀síwájú àwọn ìṣe inú Gíríìkì mọ́.
