base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: yo
  text: Àwọn fìtílà púpọ̀ sì wà nínú yàrá òkè níbi tí a ti péjọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ògùṣọ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí oríṣiríṣi ohun èlò ìmọ́lẹ̀ tí a lè gbé kiri, ṣùgbọ́n “fìtílà” ló ṣeé ṣe jù lọ nínú yàrá ilé yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Àsopọ̀ onírẹ̀lẹ̀ ni δέ; “sì” jẹ́ ọ̀nà àdánidá láti so àpèjúwe yìí mọ́ ohun tó ṣáájú láì fi ìtakora líle kún un.
- source_word: λαμπάδες
  choice: àwọn fìtílà
  rationale: λαμπάς lè túmọ̀ sí fìtílà tàbí ògùṣọ̀; nínú yàrá ilé, “fìtílà” ni ó ṣeé ṣe jù lọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní mọ̀.
- source_word: ἱκαναὶ
  choice: púpọ̀
  rationale: Níhìn-ín ἱκανός ń tọ́ka sí iye tí ó pọ̀, kì í ṣe pé wọ́n kàn tó; “púpọ̀” sọ ìtumọ̀ náà ní kedere.
- source_word: ἐν τῷ ὑπερῴῳ
  choice: nínú yàrá òkè
  rationale: ὑπερῷον jẹ́ yàrá tó wà ní apá òkè ilé; “yàrá òkè” ṣe kedere, ó sì jẹ́ èdè àdánidá.
- source_word: οὗ
  choice: níbi tí
  rationale: Ọ̀rọ̀ ìbátan ibi οὗ ni a túmọ̀ lọ́nà àdánidá sí “níbi tí.”
- source_word: ἦμεν συνηγμένοι
  choice: a ti péjọ sí
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ẹgbẹ́ náà gẹ́gẹ́ bí àwọn tí wọ́n ti kóra jọ tí wọ́n sì wà níbẹ̀; “a ti péjọ sí” pa ìtumọ̀ àjọṣepọ̀ àti ipò tí ó ń bá a lọ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún àwọn òǹkàwé gbogbogbò. A fi “sì” mú agbára àsopọ̀ δέ jáde láì ṣàfikún ọ̀rọ̀ àkókò bí “nígbà náà.”
