    issue: Unnecessary postverbal “sí” in the relative clause
    rationale: In this locative relative clause, “a ti péjọ” already means “we had gathered/were gathered.” Adding “sí” is not needed and is less idiomatic; removing it does not alter the source meaning.
  revised_text: Àwọn fìtílà púpọ̀ sì wà nínú yàrá òkè níbi tí a ti péjọ[a].
