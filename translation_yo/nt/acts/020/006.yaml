id: ACT.20.6
reference: Acts 20:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: yo
  text: Ṣùgbọ́n àwa ṣíkọ̀ láti Fílípì lẹ́yìn àwọn ọjọ́ Àjọ̀dún Àkàrà Aláìwú, a sì dé ọ̀dọ̀ wọn ní Tíróásì ní ọjọ́ márùn-ún,[a] níbi tí a dúró níbẹ̀ fún ọjọ́ méje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín ọjọ́ márùn-ún.” Gbólóhùn Gíríìkì náà ń sọ iye àkókò tí ìrìn-àjò náà fi pẹ́ títí wọ́n fi dé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: ṣíkọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ọkọ̀ ojú omi kúrò ní ibi kan; “ṣíkọ̀ láti” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n gbéra lọ lórí omi.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: lẹ́yìn àwọn ọjọ́ Àkàrà Aláìwú
  rationale: Èyí tẹ̀ lé ìtumọ̀ gígún Gíríìkì pé ‘lẹ́yìn àwọn ọjọ́ [àkàrà] aláìwú,’ ó sì tọ́ka sí àkókò àjọ̀dún àwọn Júù láìfi ọ̀rọ̀ ‘Àjọ̀dún’ kún un.
- source_word: ἀπὸ Φιλίππων
  choice: láti Fílípì
  rationale: “Láti” ni ìbámu àdánidá fún ἀπό níhìn-ín; Fílípì ni àkọsílẹ̀ orúkọ ìlú náà ní Yorùbá.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: a sì dé ọ̀dọ̀ wọn
  rationale: “Dé ọ̀dọ̀ wọn” sọ ìrìn sí ibi tí àwọn ènìyàn náà wà, láìfi èrò míì bí ‘darapọ̀ mọ́ wọn’ kún ọ̀rọ̀ orísun.
- source_word: εἰς τὴν Τρῳάδα
  choice: ní Tíróásì
  rationale: Nítorí pé “dé ọ̀dọ̀ wọn” ti sọ ìlọsíwájú, “ní Tíróásì” fi ibi tí wọ́n dé hàn ní Yorùbá tí ó rọrùn.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: ní ọjọ́ márùn-ún
  rationale: Gbólóhùn Gíríìkì fi gígùn àkókò ìrìn títí wọ́n fi dé hàn. Yorùbá “ní ọjọ́ márùn-ún” jẹ́ àdánidá, ṣùgbọ́n ó lè ní ìtumọ̀ díẹ̀ ju ọ̀kan lọ; àlàyé ìsàlẹ̀ ojú ìwé mú èyí ṣe kedere.
- source_word: οὗ
  choice: níbi tí
  rationale: Ọ̀rọ̀ ìbátan ibi yìí ń tọ́ka padà sí Tíróásì; “níbi tí” ni ìtumọ̀ Yorùbá tó yẹ.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: a gbé dúró fún ọjọ́ méje
  rationale: διατρίβω ní àyíká ìrìn-àjò túmọ̀ sí dídúró tàbí lílo àkókò ní ibì kan; “gbé dúró fún ọjọ́ méje” jẹ́ èdè Yorùbá òde òní tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo “àwa” láti pa ìtẹnumọ́ ἡμεῖς mọ́, lẹ́yìn náà a lo “a” gẹ́gẹ́ bí ó ti jẹ́ àdánidá ní Yorùbá.
