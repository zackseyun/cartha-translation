review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń gbé èrò Giriki náà kalẹ̀ ní pàtàkì: Paulù mọ̀ pé gbogbo àwọn tí ó ti ń lọ káàkiri láàárín wọn nígbà tó ń kéde ìjọba náà kò ní rí i mọ́. Ṣùgbọ́n ìṣọ̀kan kókó-ọrọ àti ọ̀rọ̀-ìṣe nínú ìpín gbólóhùn ìkẹyìn nílò àtúnṣe: «gbogbo yín ... kì yóò rí» kò bá ẹni kejì púpọ̀ ὑμεῖς πάντες mu dáadáa nínú Yorùbá.'
  naturalness: «Àti nísinsin yìí» kò rọrùn bí «Báyìí» nínú Yorùbá òde òní. «Ẹ wò ó» lè ṣiṣẹ́ gẹ́gẹ́ bí àmì ìfiyèsí fún ἰδού, bí ó tilẹ̀ jẹ́ pé ó ní ìró àṣẹ díẹ̀. «Rìn káàkiri láàárín yín» sì dáa ju «rìn káàárín yín» lọ fún διῆλθον nínú àyíká iṣẹ́ ìrìn ìwàásù.
  terminology: «Kéde ìjọba náà» jẹ́ ìtumọ̀ tó péye fún κηρύσσων τὴν βασιλείαν. A kò fi «Ọlọ́run» kún «ìjọba náà», nítorí ọ̀rọ̀ Giriki ìpìlẹ̀ kò sọ bẹ́ẹ̀ ní ẹsẹ yìí. «Rí ojú mi mọ́» pa ọ̀nà ìsọ̀rọ̀ τὸ πρόσωπόν μου àti οὐκέτι mọ́.
  issues:
