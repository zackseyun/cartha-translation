  to: Báyìí, ẹ wò ó, mo mọ̀ pé ẹ̀yin gbogbo tí mo ti rìn káàkiri láàárín yín, nígbà tí mo ń kéde ìjọba náà, kò ní rí ojú mi mọ́.
  rationale: Àtúnṣe náà mú ọ̀rọ̀-ìṣe ìjẹ́kù bá ẹni kejì púpọ̀ «ẹ̀yin gbogbo» mu, ó sì jẹ́ kí ìbẹ̀rẹ̀ ẹsẹ àti ìtumọ̀ ìrìn Paulù rọrùn síi nínú Yorùbá boṣewa. Ó pa ìtumọ̀ orísun, ìtẹnumọ́ gbogbo ẹgbẹ́ náà, àti àìsọ ìdánimọ̀ ìjọba náà mọ́.
