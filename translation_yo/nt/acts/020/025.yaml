  revised_text: Báyìí, ẹ wò ó, mo mọ̀ pé ẹ̀yin gbogbo tí mo ti rìn káàkiri láàárín yín, nígbà tí mo ń kéde ìjọba náà, kò ní rí ojú mi mọ́.
