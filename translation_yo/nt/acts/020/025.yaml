id: ACT.20.25
reference: Acts 20:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: yo
  text: Báyìí, ẹ wò ó, mo mọ̀ pé ẹ̀yin gbogbo tí mo ti rìn káàkiri láàárín yín, nígbà tí mo ń kéde ìjọba náà, kò ní rí ojú mi mọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: Àti nísinsin yìí, ẹ wò ó
  rationale: Ó pa ìtẹ̀síwájú ọ̀rọ̀ náà àti àmì ìfiyèsí ἰδοὺ mọ́ ní Yorùbá àdánidá.
- source_word: διῆλθον
  choice: mo ti rìn káàárín yín
  rationale: Ó fi ìrìn Paulù láti ibì kan dé ibòmíràn láàárín àwọn olùgbọ́ hàn, láìfi ìtumọ̀ míì kún un.
- source_word: κηρύσσων
  choice: tí mo ń kéde
  rationale: “Kéde” bá ìṣe ìpolongo ní gbangba mu, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: τὴν βασιλείαν
  choice: ìjọba náà
  rationale: Àpilẹ̀kọ pàtó náà ni a fi “náà” hàn; ẹsẹ yìí kò sọ “ti Ọlọ́run” ní gbangba, nítorí náà a kò fi kún un.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: kì yóò rí ojú mi mọ́
  rationale: Ìṣàpẹẹrẹ Semitic-Giriki “rí ojú mi” ni a pa mọ́; “mọ́” fi οὐκέτι, ìyẹn ‘kò tún ... mọ́,’ hàn.
theological_decisions:
- issue: Ẹni tí kò ní rí Paulù mọ́
  choice: gbogbo yín ... kì yóò rí ojú mi mọ́
  alternative: kò sí ẹnikẹ́ni nínú yín ... tí yóò rí ojú mi mọ́
  rationale: Giriki ὑμεῖς πάντες lè túmọ̀ sí “gbogbo yín”; ìṣètò yìí pa ìtẹnumọ́ gbogbo ẹgbẹ́ náà mọ́ láìdá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun sílẹ̀.
- issue: Ìdánimọ̀ ìjọba náà
  choice: ìjọba náà
  alternative: ìjọba Ọlọ́run
  rationale: SBLGNT ní βασιλείαν nìkan níbí. Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè tọ́ka sí ìjọba Ọlọ́run, a kò sọ ohun tí kò sí nínú ẹ̀rí ọ̀rọ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ara ọ̀rọ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. A lò “ẹ” fún ọ̀pọ̀ ènìyàn, a sì pa “ẹ wò ó” mọ́ gẹ́gẹ́ bí àmì ìfiyèsí, kì í ṣe àṣẹ láti wo ohun kan ní ti ara.
