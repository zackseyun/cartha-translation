    rationale: ὑμεῖς πάντες jẹ́ ẹni kejì púpọ̀. Nínú ìtumọ̀ náà, «gbogbo yín ... kì yóò rí» lo àmì ìjẹ́kù ẹni kẹta «kì yóò». «Ẹ̀yin gbogbo ... kò ní ... mọ́» jẹ́ Yorùbá tó dájú, ó sì pa ìtẹnumọ́ «gbogbo yín» mọ́.
  - severity: low
