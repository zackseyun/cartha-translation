  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: yo
  text: Ó ń fi ìtẹnumọ́ jẹ́rìí fún àwọn Júù àti àwọn Gíríìkì nípa ìrònúpìwàdà sí Ọlọ́run àti ìgbàgbọ́ nínú Olúwa wa Jésù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé nínú Olúwa wa Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: Ó ń fi ìdí rẹ̀ múlẹ̀ gidigidi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́rìí tàbí ìkéde tí a fi ìtẹnumọ́ àti ọ̀wọ̀ ṣe; yíyan yìí pa agbára ìjẹ́rìí náà mọ́ ní Yorùbá àdánidá.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: fún àwọn Júù àti àwọn Gíríìkì
  rationale: Èyí pa ìsọ̀rí méjèèjì tí Lúùkù dárúkọ mọ́, láì sọ Ἕλλησιν di gbogbo àwọn Kèfèrí.
- source_word: μετάνοιαν
  choice: ronú pìwà dà
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ ìyípadà inú àti yíyí kúrò nínú ẹ̀ṣẹ̀; kò dín ọ̀rọ̀ náà kù sí yíyí èrò lásán.
- source_word: εἰς θεόν
  choice: sí Ọlọ́run
  rationale: εἰς ń fi ibi tí ìrònúpìwàdà náà dojú kọ hàn; “sí Ọlọ́run” jẹ́ kedere, ó sì bá Yorùbá mu.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, Jésù ni ẹni tí ìgbàgbọ́ náà dojú kọ; “ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìtumọ̀ πίστις.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: nínú Olúwa wa Jésù
  rationale: Pẹ̀lú πίστιν, εἰς ń sọ ẹni tí a gbẹ́kẹ̀ lé; “nínú Olúwa wa Jésù” pa àkọlé κύριος àti ìtọ́kasí ohun tí ìgbàgbọ́ dojú kọ mọ́.
- source_word: κύριον
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος, ó sì pa ìwọ̀n àti ìtumọ̀ Kristẹni inú àkọlé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nígbà tí Jésù jẹ́ ẹni tí ó dojú kọ
  choice: ìgbàgbọ́ nínú Olúwa wa Jésù
  alternative: ìgbẹ́kẹ̀lé nínú Olúwa wa Jésù
  rationale: Ẹ̀dà Gíríìkì sọ Jésù ní kedere gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ dojú kọ; “ìgbàgbọ́” ni a lò nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n “ìgbẹ́kẹ̀lé” jẹ́ àṣàyàn gidi tí àlàyé ìsàlẹ̀ pa mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì yan “ronú pìwà dà” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìrònúpìwàdà tó dojú kọ Ọlọ́run.
