id: ACT.20.19
reference: Acts 20:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: yo
  text: nígbà tí mo ń sin Olúwa pẹ̀lú gbogbo ìrẹ̀lẹ̀, pẹ̀lú omijé àti àwọn ìdánwò[a] tí ó ṣẹlẹ̀ sí mi nípasẹ̀ àwọn ìdìtẹ̀ àwọn Júù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “àwọn ìdẹwò” tàbí “àwọn àyẹ̀wò”; níbí, ó ń tọ́ka sí ìpọ́njú tí ìtakò àwọn alátakò fà.
    reason: lexical_alternative
  - marker: b
    text: Èyí tọ́ka sí àwọn Júù kan pàtó tí wọ́n ṣe ìdìtẹ̀ sí Pọ́ọ̀lù, kì í ṣe gbogbo àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: tí mo ń ... sin
  rationale: Ọ̀rọ̀ aláìparí yìí ṣàpèjúwe bí Pọ́ọ̀lù ṣe ń bá iṣẹ́ ìránṣẹ́ rẹ̀ lọ; “ń sin” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ iṣẹ́ ìfọkànsìn mọ́.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: Èyí pa oyè inú Gíríìkì mọ́ láì fi ẹni tí oyè náà tọ́ka sí hàn ju bí orísun ṣe ṣe lọ.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: pẹ̀lú gbogbo ìrẹ̀lẹ̀
  rationale: “Gbogbo” pa agbára πάσης mọ́, “ìrẹ̀lẹ̀” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ταπεινοφροσύνη.
- source_word: δακρύων
  choice: omijé
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ìmọ̀lára inú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: πειρασμῶν
  choice: àwọn ìdánwò
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìpọ́njú tàbí àdánwò láti ọ̀dọ̀ àwọn alátakò, kì í ṣe ìdẹwò sí ẹ̀ṣẹ̀ ní pàtó; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì mọ́.
- source_word: τῶν συμβάντων μοι
  choice: tí ó dé bá mi
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún àwọn ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ sí Pọ́ọ̀lù.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: nítorí ìdìtẹ̀
  rationale: “Nítorí” mú ipa okùnfà ἐν hàn nínú àyíká yìí, níbi tí ìdìtẹ̀ náà ti fa àwọn ìdánwò náà.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà fún Ἰουδαίων; àlàyé ìsàlẹ̀ ojú ìwé fi hàn pé àwọn Júù kan pàtó tí wọ́n dìtẹ̀ sí Pọ́ọ̀lù ni, kì í ṣe gbogbo Júù.
theological_decisions:
- issue: Ó ṣeé ṣe kí a ka “àwọn Júù” bí ẹ̀sùn sí gbogbo àwọn Júù.
  choice: Pa “àwọn Júù” mọ́ nínú ọ̀rọ̀, kí àlàyé sì sọ pé àwọn alátakò Pọ́ọ̀lù kan pàtó ni.
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Gíríìkì sọ Ἰουδαίων ní tààrà, kò sì dín wọn kù sí àwọn olórí. Àlàyé náà ṣe ìdíwọ́ fún ìtumọ̀ gbogbogbò láì yí ọ̀rọ̀ orísun padà.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo “nígbà tí mo ń” láti jẹ́ kí àkójọpọ̀ participle tó ń tẹ̀ sí ẹsẹ tó ṣáájú hàn, a sì pa àìdánilójú πειρασμῶν mọ́ nípasẹ̀ àlàyé.
