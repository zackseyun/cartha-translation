id: ACT.20.1
reference: Acts 20:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: yo
  text: Lẹ́yìn tí rúkèrúdò náà parí, Paulu ránṣẹ́ pe àwọn ọmọ-ẹ̀yìn. Ó fún wọn ní ìṣírí, ó sì dágbére fún wọn.[a] Lẹ́yìn náà, ó gbéra láti lọ sí Makedóníà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì kí wọn”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkíni tàbí, nígbà tí ẹnì kan ń lọ, dídágbére.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: Lẹ́yìn tí ... parí
  rationale: 'Ìtumọ̀ àkókò ni μετά pẹ̀lú infinitive olóhun-ìṣàpèjúwe níbí: ohun tó tẹ̀ lé e ṣẹlẹ̀ lẹ́yìn tí ìṣẹ̀lẹ̀ àkọ́kọ́ dópin.'
- source_word: θόρυβον
  choice: rúkèrúdò náà
  rationale: Ọ̀rọ̀ náà tọ́ka sí ariwo àti ìdàrúdàpọ̀ gbogbogbò ní Efesu; “rúkèrúdò” mú agbára ìṣẹ̀lẹ̀ náà jáde ní Yorùbá àdánidá.
- source_word: μεταπεμψάμενος
  choice: ránṣẹ́ pe
  rationale: Middle participle náà túmọ̀ sí pé ó ránṣẹ́ kí àwọn ènìyàn wá bá a; “ránṣẹ́ pe” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: τοὺς μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ó pa ọ̀rọ̀ Luku fún àwọn ọmọlẹ́yìn Jésù mọ́, dípò ọ̀rọ̀ gbòòrò bí “àwọn onígbàgbọ́.”
- source_word: παρακαλέσας
  choice: fún wọn ní ìṣírí
  rationale: παρακαλέω lè ní ìtumọ̀ ìgbani-níyànjú, ìṣírí tàbí ìtùnú; nínú àyíká yìí “fún wọn ní ìṣírí” kò fi ìtumọ̀ náà sí apá kan ṣoṣo.
- source_word: ἀσπασάμενος
  choice: dágbére fún wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà sábà túmọ̀ sí kíni, nínú àyíká ìlọkúrò ó lè túmọ̀ sí dídágbére; ìtumọ̀ yìí bá ìtàn ìrìnàjò mu.
- source_word: ἐξῆλθεν
  choice: ó gbéra
  rationale: Nínú ìtàn ìrìnàjò, ọ̀rọ̀ náà ṣiṣẹ́ gẹ́gẹ́ bí ìfihàn pé ẹnì kan kúrò láti bẹ̀rẹ̀ ìrìnàjò; “gbéra” jẹ́ Yorùbá àdánidá.
- source_word: πορεύεσθαι εἰς Μακεδονίαν
  choice: láti lọ sí Makedóníà
  rationale: Infinitive náà ṣàlàyé ète ìlọkúrò Paulu, ó sì pa ibi tí ó ń lọ mọ́ ní kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá tó bójú mu, tó lọ́wọ́lọ́wọ́, tí ó sì ṣeé yé fún òǹkàwé gbogbogbò ni a lò. A pín gbolóhùn Gíríìkì gígùn náà sí gbolóhùn Yorùbá mẹ́ta fún ìṣàn àdánidá, láìyí ìtẹ̀lé àwọn ìṣe padà. Àmì ohùn ni a fi sí ibi tí ó yẹ.
