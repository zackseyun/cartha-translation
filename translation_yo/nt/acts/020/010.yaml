id: ACT.20.10
reference: Acts 20:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù sọ̀kalẹ̀, ó wólẹ̀ lórí rẹ̀, ó sì gbá a mọ́ra. Ó ní, “Ẹ má ṣe dààmú,[b] nítorí ìyè rẹ̀[a] ń bẹ nínú rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn rẹ̀ ń bẹ nínú rẹ̀.” Ọ̀rọ̀ Gíríìkì ψυχή lè túmọ̀ sí “ìyè,” “ẹni fúnra rẹ̀,” tàbí “ọkàn”; níbí, “ìyè” bá ọ̀rọ̀ tó ń lọ mu jù nítorí ohun tí wọ́n ń wádìí ni bóyá ó ti kú tàbí ó ṣì wà láàyè.
    reason: lexical_alternative
  - marker: b
    text: A lè lóye ọ̀rọ̀ Pọ́ọ̀lù pé ọ̀dọ́mọkùnrin náà kò kú rárá, tàbí pé a ti mú un padà sí ìyè. Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ èyí tó jẹ́ ní kedere.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: sọ̀kalẹ̀
  rationale: Ó pa ìtumọ̀ ìtọ́sọ́nà ọ̀rọ̀ náà mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ìṣe tó ṣẹlẹ̀ lẹ́yìn ìṣe mìíràn mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn láti inú ìròyìn nípa ìṣubú ọ̀dọ́mọkùnrin náà sí ohun tí Pọ́ọ̀lù ṣe.
- source_word: ἐπέπεσεν αὐτῷ
  choice: ó bẹ́ lé e
  rationale: Ìtumọ̀ yìí pa ìṣe ara mọ́, ó sì tún jẹ́ kí ìfarajọ́ tó lè wà pẹ̀lú àwọn ìtàn àwọn wòlíì nípa ìmúpadàbọ̀sípò dúró láìṣàlàyé rẹ̀ ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ.
- source_word: συμπεριλαβὼν
  choice: ó sì gbá a mọ́ra
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún fífi apá yí ẹnì kan ká tàbí dídi ẹni náà mọ́ra.
- source_word: Μὴ θορυβεῖσθε
  choice: Ẹ má ṣe dààmú
  rationale: Ó mú ìdààmú àti ìrúkèrúdò àwọn tó péjọ nítorí ìṣubú náà jáde ní èdè Yorùbá tó wọ́pọ̀.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: nítorí ìyè rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ nípa bóyá ọ̀dọ́mọkùnrin náà ti kú tàbí ó ṣì wà láàyè, ‘ìyè’ ló mú ìtumọ̀ ψυχή jáde dáadáa jù láìfi ẹ̀kọ́ pàtó nípa ọkàn tàbí ẹ̀mí kún un.
- source_word: ἐν αὐτῷ ἐστιν
  choice: ń bẹ nínú rẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹ̀kipẹ̀ki, ó sì fi sílẹ̀ láìyanju bóyá ìyè náà kò fi í sílẹ̀ rí tàbí ó ti padà sínú rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú àyíká ọ̀rọ̀ nípa ìyè àti ikú
  choice: A túmọ̀ rẹ̀ sí ‘ìyè.’
  alternative: ‘ẹ̀mí’ tàbí ‘ọkàn’
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ipò ara Eutiku lẹ́yìn tó ṣubú. ‘Ìyè’ yẹra fún fífi ẹ̀kọ́ nípa bí ọkàn ṣe lè yà kúrò lára ènìyàn sínú ẹsẹ tí kò sọ ọ́ ní tààrà.
- issue: Bóyá Eutiku kò kú rárá tàbí a mú un padà sí ìyè
  choice: 'Ọ̀rọ̀ pàtàkì náà wà ní àárín gbùngbùn: ‘ìyè rẹ̀ ń bẹ nínú rẹ̀.’'
  alternative: ‘ó wà láàyè’ tàbí ‘ìyè rẹ̀ ti padà sínú rẹ̀’
  rationale: Gíríìkì kò sọ ní kedere bóyá kò kú rárá tàbí Ọlọ́run mú un padà sí ìyè nípasẹ̀ ohun tí Pọ́ọ̀lù ṣe; nítorí náà a kò yanju ohun tí ọ̀rọ̀ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá, a sì pa ìṣe ara àti àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́.
