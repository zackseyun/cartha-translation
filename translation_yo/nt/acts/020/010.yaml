revisions:
- from: Ṣùgbọ́n Pọ́ọ̀lù sọ̀kalẹ̀, ó bẹ́ lé e, ó sì gbá a mọ́ra. Ó ní, “Ẹ má ṣe dààmú,[b] nítorí ìyè rẹ̀[a] ń bẹ nínú rẹ̀.”
  to: Ṣùgbọ́n Pọ́ọ̀lù sọ̀kalẹ̀, ó wólẹ̀ lórí rẹ̀, ó sì gbá a mọ́ra. Ó ní, “Ẹ má ṣe dààmú,[b] nítorí ìyè rẹ̀[a] ń bẹ nínú rẹ̀.”
  rationale: The revision corrects the rendering of Paul’s physical action to a clear Standard Yoruba expression while preserving the Greek sequence and its possible resonance with prophetic restoration scenes. It retains “ìyè rẹ̀ ń bẹ nínú rẹ̀,” which does not decide whether life had never departed or had been restored. The lexical footnote is tightened to distinguish the ‘soul’ alternative without importing a ‘spirit’ reading.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:47Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering preserves the descent, Paul's physical response, the command not to be distressed, and the deliberately noncommittal statement that the young man's life is in him. However, “ó bẹ́ lé e” does not naturally convey ἐπέπεσεν αὐτῷ (“he fell/lay upon him”) in Standard Yoruba and should be replaced by an unambiguous physical expression.
  naturalness: The verse is otherwise clear, idiomatic, and appropriately dignified. “Ó wólẹ̀ lórí rẹ̀” is a natural, explicit rendering of the physical action and works well before “ó sì gbá a mọ́ra.”
  terminology: “Ìyè” is the appropriate contextual rendering of ψυχή. The lexical note should offer “ọkàn” as the direct Yoruba equivalent for the ‘soul’ alternative rather than “ẹ̀mí,” which can introduce a distinct ‘spirit’ sense. The ambiguity about whether Eutiku had not died or was restored is properly retained.
  issues:
  - severity: medium
    issue: “Ó bẹ́ lé e” is not an accurate natural rendering of ἐπέπεσεν αὐτῷ.
    rationale: The Greek describes Paul falling or laying upon the young man. The proposed Yoruba phrase is not a clear idiomatic expression for this bodily action and can be misunderstood. “Ó wólẹ̀ lórí rẹ̀” conveys the action directly without interpreting its result.
  - severity: low
    issue: The lexical footnote gives “ẹ̀mí” as the alternative for ψυχή (‘soul’).
    rationale: In this context, “ọkàn” is the closer Yoruba lexical alternative for ‘soul’; “ẹ̀mí” more readily denotes ‘spirit’ and may add an unneeded semantic distinction.
  revised_text: Ṣùgbọ́n Pọ́ọ̀lù sọ̀kalẹ̀, ó wólẹ̀ lórí rẹ̀, ó sì gbá a mọ́ra. Ó ní, “Ẹ má ṣe dààmú,[b] nítorí ìyè rẹ̀[a] ń bẹ nínú rẹ̀.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọkàn rẹ̀ ń bẹ nínú rẹ̀.” Ọ̀rọ̀ Gíríìkì ψυχή lè túmọ̀ sí “ìyè,” “ẹni fúnra rẹ̀,” tàbí “ọkàn”; níbí, “ìyè” bá ọ̀rọ̀ tó ń lọ mu jù nítorí ohun tí wọ́n ń wádìí ni bóyá ó ti kú tàbí ó ṣì wà láàyè.
