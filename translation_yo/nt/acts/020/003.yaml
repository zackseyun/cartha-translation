  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: yo
  text: Lẹ́yìn tí ó lo oṣù mẹ́ta níbẹ̀, nígbà tí ìdìtẹ̀ kan[b] dìde sí i láti ọ̀dọ̀ àwọn Júù[a], bí ó ti fẹ́rẹ̀ máa gbéra lójú omi lọ sí Síríà[c], ó pinnu láti padà gba ọ̀nà Makedóníà.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “àwọn Júù.” Nínú Ìṣe Àwọn Àpọ́sítélì, èyí sábà máa ń tọ́ka sí ẹgbẹ́ kan tó ń tako Pọ́ọ̀lù nínú àyíká ọ̀rọ̀, kì í ṣe gbogbo àwọn Júù láìyàtọ̀.
    reason: cultural_note
  - marker: b
    text: Tàbí, “nígbà tí ìdìtẹ̀ kan wà sí i.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “bí ó ti fẹ́rẹ̀ máa ṣíkọ̀ lọ sí Síríà.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ó pinnu láti padà gba ọ̀nà Makedóníà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Lẹ́yìn tí ó lo oṣù mẹ́ta níbẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí lílo àkókò kan; “níbẹ̀” wá láti inú àyíká ẹsẹ tó ṣáájú, ó sì mú kí Yorùbá ṣàn dáadáa.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: nígbà tí ... dìtẹ̀ mọ́ ọn
  rationale: Ẹ̀ka ọ̀rọ̀ yìí fi ipò tó ṣẹlẹ̀ hàn, ἐπιβουλή sì jẹ́ ète ọ̀tá tàbí ìdìtẹ̀. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Èdè Gíríìkì sọ ní pàtó pé “àwọn Júù.” A pa ọ̀rọ̀ náà mọ́ nínú ẹsẹ, a sì ṣàlàyé ààlà ìtọ́kasí rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: bí ó ti fẹ́ ṣíkọ̀
  rationale: μέλλω fi ohun tó fẹ́ ṣẹlẹ̀ láìpẹ́ hàn, ἀνάγεσθαι sì túmọ̀ sí ṣíkọ̀ tàbí gbéra lọ lójú omi ní àyíká ìrìn-àjò.
- source_word: εἰς τὴν Συρίαν
  choice: lọ sí Síríà
  rationale: εἰς tọ́ka sí ibi tí ìrìn-àjò ń lọ; “lọ sí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐγένετο γνώμης
  choice: ó pinnu
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí dídé orí ìpinnu kan; “ó pinnu” jẹ́ kedere, ó sì jẹ́ ti Yorùbá àkókò yìí.
- source_word: τοῦ ὑποστρέφειν
  choice: láti padà
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́ni yìí sọ ohun tí ìpinnu náà dá lé lórí, ὑποστρέφειν sì túmọ̀ sí padà.
- source_word: διὰ Μακεδονίας
  choice: gba Makedóníà kọjá
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ oníran-ajẹmọ̀ níbí ń tọ́ka sí ipa ọ̀nà; “gba ... kọjá” sọ pé Makedóníà ni ipa ọ̀nà ìpadà.
theological_decisions:
- issue: Ìtọ́kasí “àwọn Júù” nínú ìtàn ìtakora
  choice: Pa “àwọn Júù” mọ́ nínú ẹsẹ, kí àlàyé ìsàlẹ̀ sọ pé ẹgbẹ́ kan tó ń tako Pọ́ọ̀lù nínú àyíká ọ̀rọ̀ ni a ń tọ́ka sí.
  alternative: àwọn Júù kan; àwọn Júù tó ń tako Pọ́ọ̀lù
  rationale: τῶν Ἰουδαίων wà ní kedere nínú orísun. Ṣíṣe àtúnṣe rẹ̀ sí “àwọn kan” nínú ẹsẹ lè fi ohun tí Gíríìkì kò sọ ní tààrà kún un; síbẹ̀, àlàyé yẹ kí ó dènà fífi ẹ̀sùn kan gbogbo àwọn Júù láìyàtọ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó bá bá ìlò ẹ̀dá mu; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ṣíkọ̀” fún ìrìn-àjò lójú omi, “dìtẹ̀ mọ́” fún ète ọ̀tá, àti “gba ... kọjá” láti fi ipa ọ̀nà hàn.
