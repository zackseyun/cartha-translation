  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbò: ó sọ oṣù mẹ́ta, ìdìtẹ̀ sí Pọ́ọ̀lù láti ọ̀dọ̀ àwọn Júù, ìfẹ́rẹ̀ẹ́ ìgbèrú lójú omi sí Síríà, àti ìpinnu láti padà gba Makedóníà. Síbẹ̀, “àwọn Júù dìtẹ̀ mọ́ ọn” kì í jẹ́ ọ̀nà Yorùbá tó péye tàbí tó ṣàn jù lọ láti gbé γενομένης ἐπιβουλῆς αὐτῷ ὑπὸ τῶν Ἰουδαίων; ìdìtẹ̀ ni ó yẹ kí a sọ pé ó dìde sí i, pẹ̀lú àwọn Júù gẹ́gẹ́ bí ẹni tí ó ti ọ̀dọ̀ wọn wá.'
