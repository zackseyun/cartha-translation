source:
  edition: SBLGNT
  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: yo
  text: Nígbà tí ó sì pàdé wa ní Ásósì[a], a gbé e wọ ọkọ̀ ojú omi, a sì dé Mítílénè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “darapọ̀ mọ́ wa ní Ásósì,” tàbí, “pàdé pọ̀ mọ́ wa ní Ásósì.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípàdé tàbí pípapọ̀; níbí, ìtumọ̀ rẹ̀ ni pé Pọ́ọ̀lù tún darapọ̀ mọ́ ẹgbẹ́ náà níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: pàdé
  rationale: Nínú àyíká ìrìn-àjò yìí, ọ̀rọ̀ náà túmọ̀ sí pé Pọ́ọ̀lù pàdé ẹgbẹ́ náà ní Ásósì. ‘Pàdé’ jẹ́ èdè Yorùbá àdánidá, ó sì fi àìdánilójú díẹ̀ sílẹ̀ láì sọ pé wọ́n ti ṣètò ìpàdé náà tẹ́lẹ̀.
- source_word: ἡμῖν
  choice: wa
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ẹni yìí ń tọ́ka sí ẹgbẹ́ àwọn arìnrìn-àjò inú ọkọ̀ ojú omi.
- source_word: εἰς τὴν Ἆσσον
  choice: ní Ásósì
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń tọ́ka sí ibi tí a ń lọ, pẹ̀lú ọ̀rọ̀ ìṣe ‘pàdé,’ ‘ní Ásósì’ ni Yorùbá àdánidá fún ibi tí ìpàdé náà ti ṣẹlẹ̀.
- source_word: ἀναλαβόντες
  choice: a gbà á sínú ọkọ̀ ojú omi
  rationale: Ọ̀rọ̀ alábápín náà ń fi hàn pé wọ́n gba Pọ́ọ̀lù wọ ọkọ̀ ojú omi. Ìtumọ̀ yìí mú àyíká ọkọ̀ ojú omi tí ọ̀rọ̀ Gíríìkì fi lélẹ̀ hàn kedere.
- source_word: αὐτόν
  choice: á
  rationale: Ó ń tọ́ka sí Pọ́ọ̀lù, ẹni tí àyíká ẹsẹ tó ṣáájú ti mú kí ó ṣe kedere.
- source_word: ἤλθομεν
  choice: a dé
  rationale: Nínú àlàyé ìrìn-àjò Yorùbá, ‘dé’ jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n dé ibi tí wọ́n ń lọ, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: εἰς Μιτυλήνην
  choice: Mítílénè
  rationale: Orúkọ ibi náà tẹ̀ lé ọ̀rọ̀ ìṣe ‘dé’ ní tààrà, gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo ‘ọkọ̀ ojú omi’ láti mú àyíká ìrìn-àjò lórí omi hàn kedere; àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá àti àwọn orúkọ ibi níbi tó bá yẹ.
