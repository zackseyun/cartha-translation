id: ACT.20.18
reference: Acts 20:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: yo
  text: Nígbà tí wọ́n dé ọ̀dọ̀ rẹ̀, ó sọ fún wọn pé, “Ẹ̀yin fúnra yín mọ̀ bí mo ṣe gbé láàárín yín ní gbogbo àkókò náà, láti ọjọ́ àkọ́kọ́ tí mo tẹ ẹsẹ̀ sí Éṣíà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éṣíà níbí tọ́ka sí ìpínlẹ̀ Róòmù ti Éṣíà, ní apá ìwọ̀-oòrùn Asia Kékeré; kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà ti òde òní.
    reason: cultural_note
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: wọ́n dé ọ̀dọ̀ rẹ̀
  rationale: Ó fi ìrìn sí ọ̀dọ̀ Pọ́ọ̀lù àti dídé sí iwájú rẹ̀ hàn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ẹ̀yin fúnra yín mọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní Gíríìkì ní ìtẹnumọ́; ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: láti ọjọ́ àkọ́kọ́ tí mo ti tẹ ẹsẹ̀ sí
  rationale: ‘Tẹ ẹsẹ̀ sí’ pa àwòrán gbígbé ẹsẹ̀ dé ibi kan nínú ἐπέβην mọ́, ó sì bá èdè Yorùbá mu.
- source_word: εἰς τὴν Ἀσίαν
  choice: sí Éṣíà
  rationale: Orúkọ ibi náà ni a pa mọ́ nínú ọ̀rọ̀ pàtàkì, nígbà tí àlàyé pé agbègbè ìjọba Róòmù ni ó ń tọ́ka sí wà ní àlàyé ìsàlẹ̀.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: bí mo ṣe gbé láàárín yín ní gbogbo àkókò náà
  rationale: Ó sọ ìwàláàyè àti ìṣe Pọ́ọ̀lù láàárín wọn lọ́nà àdánidá, nígbà tí ‘ní gbogbo àkókò náà’ fi ìtẹ̀síwájú gbogbo àsìkò hàn.
theological_decisions:
- issue: Bóyá ἐγενόμην tẹnumọ́ ọ̀nà ìgbésí ayé Pọ́ọ̀lù tàbí wíwà rẹ̀ pẹ̀lú wọn
  choice: bí mo ṣe gbé láàárín yín
  alternative: bí mo ṣe wà pẹ̀lú yín
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìgbésí ayé àti iṣẹ́ Pọ́ọ̀lù, ṣùgbọ́n Gíríìkì lè tún tẹnumọ́ wíwà rẹ̀ pẹ̀lú wọn; ìtumọ̀ àkọ́kọ́ dára ní Yorùbá láìsọ ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan sínú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ẹ̀yin fúnra yín’ fún ìtẹnumọ́, ‘tẹ ẹsẹ̀ sí’ fún àwòrán Gíríìkì, àti ‘gbé láàárín yín’ fún ọ̀nà ìgbésí ayé Pọ́ọ̀lù. Àmì àlàyé [a] wà lẹ́yìn ‘Éṣíà,’ ibi tí ó yẹ fún àlàyé ilẹ̀-àyé.
