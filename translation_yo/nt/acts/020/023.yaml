  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: yo
  text: àfi pé Ẹ̀mí Mímọ́ ń jẹ́rìí fún mi ní ìlú kan lẹ́yìn ìlú mìíràn[a], ó ń sọ pé àwọn ẹ̀wọ̀n[b] àti àwọn ìpọ́njú ń dúró de mi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘láti ìlú kan dé òmíràn’ tàbí ‘ní gbogbo ìlú.’ Àṣà ọ̀rọ̀ Gíríìkì náà fi hàn pé ẹ̀rí yìí ń wáyé léraléra ní àwọn ìlú tí ó ń tẹ̀ lé ara wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ìdè.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní tààrà sí ohun tí a fi ń dè ènìyàn, ó sì tún lè túmọ̀ sí wíwà nínú ẹ̀wọ̀n.
    reason: lexical_alternative
  - marker: c
    text: Àwọn àfọwọ́kọ kan yà díẹ̀ síra nípa ibi tí ọ̀rọ̀ ‘mi’ wà tàbí bóyá ó wà pẹ̀lú ‘àwọn ìpọ́njú’; síbẹ̀, ìtumọ̀ náà ṣì jẹ́ pé àwọn ẹ̀wọ̀n àti ìpọ́njú ń dúró de Pọ́ọ̀lù.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: àfi pé
  rationale: Ó mú agbára ọ̀rọ̀ ìyàtọ̀ tàbí ohun kan ṣoṣo tí ó yàtọ̀ nínú gbólóhùn tí ó ṣáájú wá, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá ìgbàlódé tí ó wọ́pọ̀, tí ó sì bá gbólóhùn pàtó Gíríìkì mu.
- source_word: κατὰ πόλιν
  choice: ní ìlú kan sí òmíràn
  rationale: Ó fi ìtumọ̀ pínpín ọ̀rọ̀ Gíríìkì hàn—ẹ̀rí náà ń ṣẹlẹ̀ léraléra ní àwọn ìlú tí ó ń tẹ̀ lé ara wọn—láì sọ dandan pé gbogbo ìlú pátápátá ni.
- source_word: διαμαρτύρεταί μοι
  choice: ń jẹ́rìí fún mi
  rationale: Ó pa èrò jíjẹ́rìí ní ọ̀nà tí ó lágbára mọ́, ó sì fi hàn pé Pọ́ọ̀lù ni ẹni tí Ẹ̀mí ń sọ ẹ̀rí náà fún; ‘ń kìlọ̀ fún mi’ yóò túmọ̀ ọ̀rọ̀ náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: λέγον
  choice: ó ń sọ pé
  rationale: Ó ṣe àgbékalẹ̀ ohun tí ẹ̀rí Ẹ̀mí náà ní nínú ní ọ̀nà tààrà àti àdánidá.
- source_word: δεσμὰ
  choice: àwọn ẹ̀wọ̀n
  rationale: Ó pa àwòrán gidi ti ohun ìdè mọ́, nígbà tí ó tún lè tọ́ka sí fífi ènìyàn sínú ẹ̀wọ̀n.
- source_word: θλίψεις
  choice: àwọn ìpọ́njú
  rationale: Ọ̀rọ̀ náà sọ nípa ìnira, ìtẹ̀sí àti ìjìyà tó lágbára; ‘ìpọ́njú’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ní ìwọ̀n ọlá tó yẹ.
- source_word: με
  choice: mi
  rationale: Ó tẹ̀ lé ẹ̀dà SBLGNT, ó sì sọ Pọ́ọ̀lù di ẹni tí àwọn ẹ̀wọ̀n àti ìpọ́njú náà ń dúró de.
- source_word: μένουσιν
  choice: ń dúró de
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé àwọn nǹkan wọ̀nyí wà níwájú Pọ́ọ̀lù; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí Mímọ́’ ń tọ́ka sí
  choice: Ẹni àtọ̀runwá tí ó ń jẹ́rìí, tí ó sì ń sọ̀rọ̀ fún Pọ́ọ̀lù
  alternative: Agbára ẹ̀mí kan tí kì í ṣe ẹni
  rationale: Gbólóhùn náà fi iṣẹ́ jíjẹ́rìí àti sísọ ọ̀rọ̀ lé Ẹ̀mí Mímọ́ lọ́wọ́, nítorí náà ó yẹ kí ìtumọ̀ náà pa ìṣe ẹni yìí mọ́ láì fi ẹ̀kọ́ mìíràn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. ‘Ní ìlú kan sí òmíràn’ jẹ́ àdánidá ju títẹ̀ lé ìṣètò Gíríìkì lọ ní tààrà, ṣùgbọ́n ó pa ìtumọ̀ léraléra mọ́. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ.
