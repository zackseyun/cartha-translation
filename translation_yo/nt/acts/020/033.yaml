  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: yo
  text: Èmi kò ṣojúkòkòrò fàdákà, wúrà, tàbí aṣọ ẹnikẹ́ni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi kò fẹ́ fàdákà, wúrà, tàbí aṣọ ẹnikẹ́ni.”
    reason: Àṣàyàn ìtumọ̀ míì fún ἐπεθύμησα, èyí tí ó lè túmọ̀ sí “fẹ́,” bí ó tilẹ̀ jẹ́ pé “ṣojúkòkòrò” mú ìhà ìwà rere inú àyíká ọ̀rọ̀ náà hàn síi.
lexical_decisions:
- source_word: ἀργυρίου
  choice: fàdákà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fàdákà ní pàtó; ní àkójọ pẹ̀lú wúrà àti aṣọ, ó ń tọ́ka sí ohun ìní olówó iyebíye.
- source_word: χρυσίου
  choice: wúrà
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀rọ̀ náà, ó sì bá àkójọ fàdákà àti aṣọ mu.
- source_word: ἱματισμοῦ
  choice: aṣọ
  rationale: Ó ń tọ́ka sí aṣọ tí a ń wọ̀; “aṣọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó sì yé òǹkàwé òde òní.
- source_word: οὐδενὸς
  choice: ẹnikẹ́ni
  rationale: Ìrísí gírámà rẹ̀ fi hàn pé fàdákà, wúrà, tàbí aṣọ náà jẹ́ ti ẹlòmíràn; “ẹnikẹ́ni” mú ìbáṣepọ̀ ohun-ìní yìí hàn ní ti ẹ̀dá Yorùbá.
- source_word: ἐπεθύμησα
  choice: ṣàníyàn láti ní
  rationale: Nínú ọ̀rọ̀ yìí, ó túmọ̀ sí fífẹ́ ohun ìní ẹlòmíràn lọ́nà tí kò tọ́; gbólóhùn yìí jẹ́ àdánidá, ó sì mú agbára ìwà rere inú ọ̀rọ̀ náà hàn.
- source_word: ἢ ... ἢ ... ἢ
  choice: tàbí ... tàbí ... tàbí
  rationale: Àtúnṣe “tàbí” pa ìṣọ̀kan àti ìtòlẹ́sẹẹsẹ àwọn ohun mẹ́tẹ̀ẹ̀ta inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìwà rere inú ἐπιθυμέω nípa ohun ìní
  choice: “kò ṣàníyàn láti ní” láti fi ìfẹ́ ohun ẹlòmíràn tí kò tọ́ hàn
  alternative: “kò fẹ́”
  rationale: Àyíká ọ̀rọ̀ jẹ́ ìjẹ́rìí Pọ́ọ̀lù pé kò ṣe ojúkòkòrò ohun ìní àwọn ẹlòmíràn. Ìtumọ̀ tí a yàn mú ìhà ìwà rere náà hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye.
