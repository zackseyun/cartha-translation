  source_fidelity: Àtúnṣe kékeré ló yẹ. Ìtumọ̀ àkọ́kọ́ mú ìlànà ìrìn-àjò, ìyàtọ̀ Pọ́ọ̀lù sí ẹgbẹ́ ‘àwa,’ àti ìtumọ̀ ọkọ̀ ojú omi hàn dáadáa. Ṣùgbọ́n διατεταγμένος ἦν jẹ́ ìrísí aláìṣe; ọrọ̀ àkọ́kọ́ ‘ó ti ṣètò rẹ̀’ sọ Pọ́ọ̀lù di ẹni tó ṣe ètò náà ní tààrà, nígbà tí Gíríìkì fi ẹni náà sílẹ̀ láìsọ ẹni tó ṣe é. ‘Gba orí ilẹ̀ lọ’ kò wọ́pọ̀ nínú Yorùbá òde òní fún ìrìn lórí ilẹ̀ tàbí ní ẹsẹ̀.
  naturalness: ‘Àwa sì lọ síwájú, a wọ ọkọ̀ ojú omi, a sì ṣíkọ̀ lọ’ jẹ́ Yorùbá tó rọrùn tí ó sì fi ìtẹ̀lé ìṣe participle náà hàn. ‘Lọ nípasẹ̀ ilẹ̀’ jẹ́ àdánidá ju ‘gba orí ilẹ̀ lọ’ lọ, ó sì tún pa ìyàtọ̀ sí ìrìn lórí omi mọ́.
  terminology: ‘Ọkọ̀ ojú omi,’ ‘ṣíkọ̀,’ ‘gba Pọ́ọ̀lù sínú ọkọ̀,’ àti ‘Pọ́ọ̀lù’ bá ọ̀rọ̀ ìrìn-àjò náà mu. A ti gbe àmì [a] sí ibi gangan tí àlàyé rẹ̀ kan, ìyẹn gbolóhùn nípa lílọ nípasẹ̀ ilẹ̀.
