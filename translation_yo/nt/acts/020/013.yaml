source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: yo
  text: Ṣùgbọ́n àwa sì lọ síwájú, a wọ ọkọ̀ ojú omi, a sì ṣíkọ̀ lọ sí Ásósì. A ní èrò láti gba Pọ́ọ̀lù sínú ọkọ̀ láti ibẹ̀, nítorí a ti ṣètò ètò náà bẹ́ẹ̀, níwọ̀n bí òun fúnra rẹ̀ ti pinnu láti lọ nípasẹ̀ ilẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwọ̀n bí òun fúnra rẹ̀ ti pinnu láti rin ní ẹsẹ̀.” Ọ̀rọ̀ Gíríìkì πεζεύειν ń fi ìrìn lórí ilẹ̀, pàápàá ìrìn ní ẹsẹ̀, yàtọ̀ sí ìrìn ẹgbẹ́ náà nínú ọkọ̀ ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: lọ síwájú
  rationale: Ó fi ìṣe tí ó ṣáájú ṣíkọ̀ hàn, ó sì tọ́ka pé ẹgbẹ́ akọ̀wé lọ ṣáájú Pọ́ọ̀lù.
- source_word: ἐπὶ τὸ πλοῖον
  choice: dé inú ọkọ̀ ojú omi
  rationale: Ní ọ̀rọ̀ ìrìn-àjò, gbólóhùn yìí túmọ̀ sí lílọ sínú ọkọ̀; ‘dé inú ọkọ̀ ojú omi’ jẹ́ Yorùbá àdánidá.
- source_word: ἀνήχθημεν
  choice: a sì ṣíkọ̀ lọ
  rationale: Ní àyíká ọ̀rọ̀ ọkọ̀ ojú omi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ọkọ̀ kúrò ní èbúté láti lọ sí òkun.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: sí Ásósì
  rationale: Ó sọ ibi tí ọkọ̀ ń lọ; ‘Ásósì’ jẹ́ àkọsílẹ̀ orúkọ Ἆσσος ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: Èrò wa ni láti gba ... sínú ọkọ̀
  rationale: μέλλω ń fi èrò tàbí ìpinnu hàn níbí, ἀναλαμβάνω sì túmọ̀ sí gbígba ẹnì kan wọ ọkọ̀ nínú àyíká ìrìn-àjò yìí.
- source_word: ἐκεῖθεν
  choice: láti ibẹ̀
  rationale: Ó ní ìtumọ̀ ibi ìbẹ̀rẹ̀, ìyẹn ibi tí wọn yóò ti gba Pọ́ọ̀lù sínú ọkọ̀.
- source_word: διατεταγμένος ἦν
  choice: ó ti ṣètò rẹ̀
  rationale: Ìtumọ̀ yìí bá àyíká ọ̀rọ̀ mu pé Pọ́ọ̀lù ti ṣe ètò náà tẹ́lẹ̀, bó tilẹ̀ jẹ́ pé ìrísí Gíríìkì jẹ́ aláìṣe.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: òun fúnra rẹ̀ ti pinnu láti gba orí ilẹ̀ lọ
  rationale: πεζεύειν ṣe ìyàtọ̀ sí ìrìn-àjò wọn lórí omi, ó sì lè tọ́ka sí ìrìn ní ẹsẹ̀ tàbí ìrìn lórí ilẹ̀; ‘gba orí ilẹ̀ lọ’ pa ìtẹnumọ́ pàtàkì yẹn mọ́ láì dín ìtumọ̀ rẹ̀ kù.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ kékeré láàárín ohun tí ẹgbẹ́ náà ṣe àti ohun tí Pọ́ọ̀lù ṣe hàn.
theological_decisions:
- issue: Ẹni tó ṣe ètò náà nínú διατεταγμένος ἦν
  choice: Pọ́ọ̀lù ni ó ti ṣètò rẹ̀
  alternative: A ti ṣètò rẹ̀ bẹ́ẹ̀
  rationale: Àyíká ọ̀rọ̀ àti αὐτός tó tẹ̀ lé e ń tọ́ka sí Pọ́ọ̀lù, ṣùgbọ́n ìrísí aláìṣe Gíríìkì jẹ́ kí ìtumọ̀ àìdárúkọ ẹni tó ṣètò rẹ̀ tún ṣeé ṣe; àlàyé [b] pa àṣàyàn yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ọkọ̀ ojú omi’ mú ọ̀nà ìrìn-àjò náà ṣe kedere; ‘gba orí ilẹ̀ lọ’ sì pa àfojúsùn Gíríìkì mọ́ láì fi dandan sọ pé gbogbo ọ̀nà náà ni Pọ́ọ̀lù yóò fi ẹsẹ̀ rìn.
