  to: Ṣùgbọ́n àwa sì lọ síwájú, a wọ ọkọ̀ ojú omi, a sì ṣíkọ̀ lọ sí Ásósì. A ní èrò láti gba Pọ́ọ̀lù sínú ọkọ̀ láti ibẹ̀, nítorí a ti ṣètò ètò náà bẹ́ẹ̀, níwọ̀n bí òun fúnra rẹ̀ ti pinnu láti lọ nípasẹ̀ ilẹ̀[a].
  rationale: A tún ìtumọ̀ náà ṣe láti pa passive Gíríìkì ti διατεταγμένος ἦν mọ́ nínú ọ̀rọ̀ àkọ́kọ́, nígbà tí ìsàlẹ̀ [b] ń fi ìtumọ̀ ti Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tó ṣètò rẹ̀ sílẹ̀. A tún gbe [a] sí gbolóhùn πεζεύειν, a sì rọ́pò ọ̀nà-ọrọ̀ tí kò wọ́pọ̀ pẹ̀lú Yorùbá tó dáa síi. A fi ìsàlẹ̀ [b] pamọ́ gẹ́gẹ́ bí a ti béèrè fún, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ àkọ́kọ́ kò lo àmì rẹ̀, nítorí ìtumọ̀ passive rẹ̀ ni a ti yan gẹ́gẹ́ bí ọ̀rọ̀ àkọ́kọ́.
