  source_fidelity: Ìtumọ̀ náà fi ìpinnu Paulu tí ó ti wà tẹ́lẹ̀, ìrìn ojú omi rẹ̀ kọjá Éfésù, ìkánjú rẹ̀, àti ète rẹ̀ láti wà ní Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì hàn dáadáa. Síbẹ̀, “kí ó má bàa lo àkókò” lè dà bí ètò lasan ju ìtumọ̀ ìdíwọ́/ìdádúró tí ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ń sọ lọ; “kí ó má bàa ní láti lo àkókò” mú ìtumọ̀ náà sun mọ́ orísun.
