  to: Nítorí Paulu ti pinnu láti gba Éfésù kọjá lójú omi, kí ó má bàa ní láti lo àkókò ní Éṣíà[a]; nítorí ó ń kánjú láti wà ní Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì, bí ó bá ṣeé ṣe[b].
  rationale: A ṣí àṣìṣe ibi àmì ìsàlẹ̀ [a] síbi “Éṣíà,” a sì tún ọ̀rọ̀ ìrìn ojú omi àti ìdí Paulu fún yíyẹra fún ìdádúró ní Éṣíà ṣe kí wọ́n lè bá Gíríìkì mu dáadáa. Àwọn ìtúnṣe kò yí ìtumọ̀ tàbí àìdájú tó wà nínú gbolóhùn nipa dídé/wíwà ní Jerúsálẹ́mù padà.
