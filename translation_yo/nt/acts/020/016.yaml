id: ACT.20.16
reference: Acts 20:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: yo
  text: Nítorí Paulu ti pinnu láti gba Éfésù kọjá lójú omi, kí ó má bàa ní láti lo àkókò ní Éṣíà[a]; nítorí ó ń kánjú láti wà ní Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì, bí ó bá ṣeé ṣe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éṣíà” níhìn-ín ń tọ́ka sí ìpínlẹ̀ Róòmù tí a ń pè ní Éṣíà ní apá ìwọ̀ oòrùn Éṣíà Kékeré, kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà ti òde òní.
    reason: cultural_note
  - marker: b
    text: Tàbí, “láti dé Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì.” Ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ yálà wíwà níbẹ̀ nígbà tí ọjọ́ náà bá dé tàbí dídé síbẹ̀ ní ọjọ́ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: ti pinnu
  rationale: Ó fi ìṣe tí Paulu ti pinnu tẹ́lẹ̀ hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: παραπλεῦσαι
  choice: láti fi ọkọ̀ ojú omi kọjá
  rationale: Ó pa ìtumọ̀ pé ó kọjá lẹ́gbẹ̀ẹ́ ibẹ̀ lójú omi mọ́, láìdúró sí Éfésù.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: kí ó má bàa lo àkókò
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ète rẹ̀ láti yẹra fún lílo àkókò ní agbègbè náà.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ní Éṣíà
  rationale: A pa orúkọ ilẹ̀ ìgbà Róòmù mọ́ nínú ẹsẹ, a sì ṣàlàyé ìtọ́kasí rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ἔσπευδεν
  choice: ó ń yára
  rationale: Ó fi ìṣe tó ń lọ lọ́wọ́ àti ìkánjú ìrìn àjò Paulu hàn.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: bí ó bá ṣeé ṣe
  rationale: Ó sọ àídájú inú gbólóhùn Gíríìkì ní ṣókí àti ní Yorùbá àdánidá.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: ní ọjọ́ Pẹ́ńtíkọ́sì
  rationale: Ó lo orúkọ àjọyọ̀ tí a mọ̀ dáadáa, ó sì pa ìtọ́kasí ọjọ́ náà mọ́.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: láti wà ní Jerúsálẹ́mù
  rationale: Ó tẹnumọ́ àbájáde tí Paulu fẹ́, ìyẹn, pé kó wà níbẹ̀ ní ọjọ́ náà; àlàyé ìsàlẹ̀ pa ìtumọ̀ dídé mọ́ gẹ́gẹ́ bí àṣàyàn.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà tí ó wọ́pọ̀ láti kọ orúkọ ìlú náà ní Yorùbá.
- source_word: πεντηκοστῆς
  choice: Pẹ́ńtíkọ́sì
  rationale: Èyí ni orúkọ àjọyọ̀ náà tí ó wọ́pọ̀ nínú Yorùbá Kristẹni, ó sì bá lílo ọ̀rọ̀ náà gẹ́gẹ́ bí orúkọ pàtó mu.
theological_decisions:
- issue: Bóyá γενέσθαι εἰς Ἱεροσόλυμα túmọ̀ sí wíwà ní Jerúsálẹ́mù nígbà ọjọ́ náà tàbí dídé síbẹ̀ ní ọjọ́ náà
  choice: láti wà ní Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì
  alternative: láti dé Jerúsálẹ́mù ní ọjọ́ Pẹ́ńtíkọ́sì
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ àdánidá, ó sì fi ète wíwà níbẹ̀ hàn; ṣùgbọ́n a pa ìtumọ̀ dídé tí Gíríìkì tún lè gbà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “fi ọkọ̀ ojú omi kọjá” láti mú ìtumọ̀ ojú omi jáde ní kedere.
