source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: yo
  text: Ní báyìí, ẹ wò ó, a dè mí mọ́ nínú ẹ̀mí[a], mo sì ń lọ sí Jerúsálẹ́mù, láìmọ̀ ohun tí yóò ṣẹlẹ̀ sí mi níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘a dè mí mọ́ nípa ẹ̀mí.’ Gbólóhùn Gíríìkì náà lè tọ́ka sí ẹ̀mí Pọ́ọ̀lù fúnra rẹ̀ tàbí sí Ẹ̀mí Mímọ́. Ó tún lè túmọ̀ sí pé, ‘Ẹ̀mí ń fi dandan mú mi.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa ipá ọ̀rọ̀ ìkìlọ̀ tàbí ìyípadà ọ̀rọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí ó ní ìwọ̀ntúnwọ̀nsì.
- source_word: δεδεμένος
  choice: ti dè mí mọ́
  rationale: Ó pa àwòrán ìdè inú ọ̀rọ̀ Gíríìkì mọ́, dípò fífi ìtumọ̀ rẹ̀ sí ‘fi dandan mú’ nìkan.
- source_word: τῷ πνεύματι
  choice: Ẹ̀mí
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì mú kí Ẹ̀mí Mímọ́ jẹ́ ẹni tí ó ṣeé ṣe jù lọ; síbẹ̀, àlàyé ìsàlẹ̀ pa àìdánilójú gírámà Gíríìkì mọ́.
- source_word: πορεύομαι
  choice: mo sì ń lọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe tí ń lọ lọ́wọ́ tàbí ìrìnàjò tí Pọ́ọ̀lù ti pinnu láti ṣe.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: ohun tí yóò ṣẹlẹ̀ sí mi níbẹ̀
  rationale: Èyí sọ ìtumọ̀ ‘àwọn ohun tí yóò pàdé mi níbẹ̀’ ní Yorùbá àdánidá láìyí kókó ọ̀rọ̀ padà.
- source_word: μὴ εἰδώς
  choice: láìmọ
  rationale: Ìtumọ̀ kíkún, ṣókí, àti àdánidá fún gbólóhùn alábápín Gíríìkì.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Orúkọ ìlú náà ní ìkọ̀wé Yorùbá tí a mọ̀ sí rere.
theological_decisions:
- issue: Ohun tí τῷ πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ ni àkọ́kọ́ ìtumọ̀, tí a fi ‘Ẹ̀mí ti dè mí mọ́’ hàn.
  alternative: Ó lè tọ́ka sí ẹ̀mí Pọ́ọ̀lù fúnra rẹ̀, tàbí kí a lóye rẹ̀ pé Ẹ̀mí ń fi dandan mú un.
  rationale: Lílo πνεῦμα nínú Ìṣe àti ẹsẹ tó tẹ̀ lé e ṣe atilẹyin fún Ẹ̀mí Mímọ́, ṣùgbọ́n ọ̀nà tí ọ̀rọ̀ Gíríìkì gbà dúró kò mú ìtumọ̀ yẹn di dandan; nítorí náà, a tọ́ka sí àwọn ìtumọ̀ mìíràn nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún kíkà ní gbangba. ‘Wò ó’ pa ìtẹnumọ́ ἰδοὺ mọ́, nígbà tí ‘ti dè mí mọ́’ pa àwòrán orísun mọ́.
