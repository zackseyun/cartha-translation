  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí, ó kúnlẹ̀ pẹ̀lú gbogbo wọn, ó sì gbàdúrà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lẹ́yìn tí
  rationale: Àsopọ̀ Καὶ bẹ̀rẹ̀ ìgbésẹ̀ tó tẹ̀ lé e; ní Yorùbá, ìtumọ̀ àkókò tí aorist participle εἰπών ní mú kí “Lẹ́yìn tí” jẹ́ ọ̀nà àdánidá láti so àwọn ìṣẹ̀lẹ̀ náà pọ̀.
- source_word: ταῦτα εἰπὼν
  choice: tí ó sọ nǹkan wọ̀nyí
  rationale: εἰπών jẹ́ aorist participle tó tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; àkópọ̀ “Lẹ́yìn tí ó sọ nǹkan wọ̀nyí” fi ìtẹ̀lé àkókò náà hàn ní Yorùbá àdánidá.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ó kúnlẹ̀
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí fífi eékún lélẹ̀, ṣùgbọ́n ó jẹ́ àpólà fún kíkúnlẹ̀. “Ó kúnlẹ̀” sọ ìtumọ̀ náà ní kedere láìfi ìṣubú sí eékún kún un.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: pẹ̀lú gbogbo wọn
  rationale: σύν pẹ̀lú dative fi ìbákẹ́gbẹ́ hàn, πᾶσιν sì tẹnu mọ́ pé gbogbo ẹgbẹ́ náà wà pẹ̀lú rẹ̀.
- source_word: προσηύξατο
  choice: ó sì gbàdúrà
  rationale: προσεύχομαι jẹ́ ọ̀rọ̀-ìṣe tó wọ́pọ̀ fún gbígbàdúrà; “gbàdúrà” ni ìtumọ̀ Yorùbá tó ṣe tààrà, tó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún bí ó ṣe yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A pa ìtẹnumọ́ “gbogbo wọn” mọ́.
