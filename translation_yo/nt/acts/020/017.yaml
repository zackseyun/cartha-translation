  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: yo
  text: Láti Mílétù, ó ránṣẹ́ sí Éfésù, ó sì pe àwọn alàgbà ìjọ náà wá sí ọ̀dọ̀ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ránṣẹ́ pe àwọn alàgbà ìjọ náà.” Ní èdè Gíríìkì, ‘ránṣẹ́ sí Éfésù’ àti ‘pe’ jọ fi hàn pé ó rán ọ̀rọ̀ tàbí àwọn ènìyàn láti pè wọ́n wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Láti Mílétù
  rationale: ἀπό pẹ̀lú ọ̀rọ̀-orúkọ ní ìwòyí ń fi ibi tí ìṣe ti bẹ̀rẹ̀ hàn. A kò túmọ̀ δέ lọ́tọ̀ ní ìbẹ̀rẹ̀, nítorí pé ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ìṣàn ọ̀rọ̀ Yorùbá lè gbé láìfi ọ̀rọ̀ míì kún un.
- source_word: πέμψας εἰς Ἔφεσον
  choice: ó ránṣẹ́ sí Éfésù
  rationale: Ẹ̀yà-ìṣe aorist náà ṣáájú ìṣe pàtàkì, ó sì túmọ̀ sí pé Pọ́ọ̀lù fi ìránṣẹ́ tàbí ìṣẹ̀ ranṣẹ́ sí Éfésù; ‘ránṣẹ́ sí’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: μετεκαλέσατο
  choice: ó sì pe ... pé kí wọ́n wá sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípe àwọn ènìyàn wá sí ọ̀dọ̀ ẹni. Ìtumọ̀ yìí mú ìtọ́sọ́nà ìṣe náà hàn kedere láìsọ pé ó fi agbára mú wọn wá.
- source_word: τοὺς πρεσβυτέρους
  choice: àwọn àgbà
  rationale: Nínú àyíká ìjọ àkọ́kọ́, πρεσβύτεροι tọ́ka sí àwọn olórí tí ìjọ mọ̀ sípò, kì í ṣe àwọn àgbàlagbà lásán. ‘Àwọn àgbà’ pa ìtumọ̀ ìpilẹ̀ mọ́ láìgbé ètò ìjọ ẹ̀sìn kan wọ inú rẹ̀.
- source_word: τῆς ἐκκλησίας
  choice: ìjọ náà
  rationale: ἐκκλησία níbí ni àwùjọ àwọn onígbàgbọ́ ní Éfésù. ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí kò sì fi ẹ̀ka ẹ̀sìn kan pàtó hàn.
theological_decisions:
- issue: Ìtumọ̀ πρεσβυτέρους nínú àyíká ìjọ
  choice: àwọn olórí ìjọ tí a ń pè ní ‘àwọn àgbà’
  alternative: àwọn ọkùnrin àgbà nínú ìjọ; tàbí títú ohùn ọ̀rọ̀ náà jáde gẹ́gẹ́ bí ‘presbítérì’
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì fi hàn pé àwọn aṣáájú ìjọ tí a mọ̀ sípò ni Pọ́ọ̀lù pè. ‘Àwọn àgbà’ pa èrò ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìṣètò ẹ̀ka ìjọ kan tí ó wá lẹ́yìn náà lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ‘pé kí wọ́n wá sọ́dọ̀ rẹ̀’ ṣàlàyé ìdarí pípe náà láìfi ohun tí orísun kò sọ kún un.
