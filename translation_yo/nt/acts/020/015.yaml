language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: yo
  text: A sì fi ọkọ̀ ojú omi kúrò níbẹ̀; ní ọjọ́ kejì, a dé sí ìhà òdìkejì Kíósì[a]. Ní ọjọ́ tí ó tẹ̀ lé e, a dúró ní Sámósì[b]; ní ọjọ́ tí ó tẹ̀ lé e, a dé Mílétù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìhà òdìkejì Kíósì” tàbí “ní etí òkun Kíósì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò kan ní ìhà òdìkejì erékùṣù náà; kò fi dandan hàn pé wọ́n dúró síbẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a gúnlẹ̀ ní Sámósì.” Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀rọ̀ ìrìn-àjò ojú omi fún mímú ọkọ̀ sún mọ́ etí ibùdó tàbí dídúró níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Láti ibẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ àkópọ̀ καί àti ἐκεῖθεν. Nínú Yorùbá, ìbẹ̀rẹ̀ gbólóhùn tuntun àti tẹ̀síwájú ìtàn ti mú kí ‘Láti ibẹ̀’ dára láìfi ‘àti’ tí kò ṣe pàtàkì kún un.
- source_word: ἀποπλεύσαντες
  choice: lẹ́yìn tí a gbé ọkọ̀ ojú omi kúrò
  rationale: Ó fi ìṣe tó ṣáájú dídé hàn, ó sì pa ìtumọ̀ ìrìn-àjò lórí omi mọ́ ní èdè Yorùbá àdánidá.
- source_word: τῇ ἐπιούσῃ
  choice: ní ọjọ́ kejì
  rationale: Gbólóhùn àkókò náà túmọ̀ sí ọjọ́ tó tẹ̀ lé ọjọ́ ìgbéra ọkọ̀.
- source_word: κατηντήσαμεν
  choice: a dé
  rationale: Nínú àkọsílẹ̀ ìrìn-àjò, ọ̀rọ̀ náà ń tọ́ka sí dídé tàbí dé ibi kan.
- source_word: ἄντικρυς Χίου
  choice: sí òdìkejì Kíósì
  rationale: ἄντικρυς ń tọ́ka sí ipò ní òdìkejì erékùṣù náà, kì í sì í fi dandan hàn pé wọ́n gúnlẹ̀ níbẹ̀.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Ní ọjọ́ tí ó tẹ̀ lé e
  rationale: Ó samisi ọjọ́ tó tẹ̀ lé e nínú ìtẹ̀lé ìrìn-àjò náà.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: a wọ èbúté ní Sámósì
  rationale: Ní àyíká ọkọ̀ ojú omi, παραβάλλω lè túmọ̀ sí mímú ọkọ̀ dé etí èbúté tàbí dídúró níbẹ̀; ‘wọ èbúté’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: τῇ δὲ ἐχομένῃ
  choice: ní ọjọ́ tí ó sì tún tẹ̀ lé e
  rationale: Ó pa ìtẹ̀lé ọjọ́ kẹta mọ́, ó sì yà á sọ́tọ̀ kedere kúrò nínú ọjọ́ tó ṣáájú.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: a dé Mílétù
  rationale: Ìtumọ̀ taara àti àdánidá fún ọ̀rọ̀ ìrìn-àjò pẹ̀lú ibi tí wọ́n ń lọ.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Kíósì / Sámósì / Mílétù
  rationale: A kọ àwọn orúkọ ibi náà ní ìbámu pẹ̀lú ìró wọn àti ìlànà ìkọ̀wé Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún àwọn òǹkàwé òde òní. A lo ọ̀rọ̀ ìrìn-àjò ojú omi tí gbogbo ènìyàn lè lóye, láìsọ pé wọ́n gúnlẹ̀ ní Kíósì.
