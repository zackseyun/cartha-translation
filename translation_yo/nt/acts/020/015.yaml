    rationale: παρεβάλομεν jẹ́ ọ̀rọ̀ ìrìn-àjò ojú omi fún dídúró tàbí sísún mọ́ etí ibùdó; ṣùgbọ́n ọ̀rọ̀ náà kò darúkọ èbúté. “A dúró ní Sámósì” jẹ́ ìtumọ̀ tí ó dáa tí kò fi ohun míì kún un.
