  to: Mo mọ̀ pé lẹ́yìn tí mo bá kúrò lọ́dọ̀ yín[b], àwọn ìkookò òǹrorò[a] yóò wọ àárín yín, wọn kì yóò sì ṣàánú agbo náà.
