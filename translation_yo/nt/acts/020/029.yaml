id: ACT.20.29
reference: Acts 20:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: yo
  text: Mo mọ̀ pé lẹ́yìn tí mo bá kúrò lọ́dọ̀ yín[b], àwọn ìkookò òǹrorò[a] yóò wọ àárín yín, wọn kì yóò sì ṣàánú agbo náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ìkookò búburú gidigidi.’ Ọ̀rọ̀ ajẹtífù Gíríìkì náà lè sọ ìwà líle, ìnilára, tàbí ìwà ipá.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ‘lẹ́yìn wíwá tàbí dídé mi’; ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ìtumọ̀ rẹ̀ ni ‘lẹ́yìn tí mo bá kúrò.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Mo mọ̀
  rationale: Ó fi ìmọ̀ tí ó dá Pọ́ọ̀lù lójú hàn, kì í ṣe èrò lásán; èyí sì jẹ́ ọ̀nà àdánidá àti tààrà ní Yorùbá.
- source_word: εἰσελεύσονται
  choice: yóò wọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí wíwọ inú àwùjọ; ‘yóò wọ àárín yín’ mú ìṣípò wọ inú wọn hàn ní kedere.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: lẹ́yìn tí mo bá kúrò lọ́dọ̀ yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄφιξις sábà máa ń túmọ̀ sí wíwá tàbí dídé, àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń sọ ohun tí yóò ṣẹlẹ̀ nígbà tí òun kò bá sí pẹ̀lú wọn mọ́.
- source_word: λύκοι βαρεῖς
  choice: àwọn ìkookò òǹrorò
  rationale: βαρεῖς ní ìtumọ̀ líle, ìwà ipá tàbí ewu nínú àpèjúwe yìí. ‘Òǹrorò’ sọ ewu àwọn ìkookò náà di mímọ̀ láì tú àpèjúwe náà sí irú ènìyàn kan pàtó.
- source_word: εἰς ὑμᾶς
  choice: wọ àárín yín
  rationale: Èyí mú àwòrán àwọn ìkookò tí ń wọ inú agbo tàbí àwùjọ hàn ní Yorùbá àdánidá.
- source_word: μὴ φειδόμενοι
  choice: wọn kì yóò sì dá ... sí
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí pé wọn kò ní ṣàánú tàbí yàgò fún ṣíṣe agbo náà ní ibi, ó sì sún mọ́ ìtumọ̀ Gíríìkì.
- source_word: τοῦ ποιμνίου
  choice: agbo náà
  rationale: Ó pa àpèjúwe olùṣọ́-àgùntàn mọ́, ó sì bá àwòrán ìkookò mu.
theological_decisions:
- issue: Agbára àpèjúwe ‘ìkookò’
  choice: A pa ọ̀rọ̀ àpèjúwe náà mọ́ gẹ́gẹ́ bí ‘àwọn ìkookò òǹrorò.’
  alternative: Àwọn olùkọ́ èké; àwọn apanirun; àwọn aninilára.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ẹni tí àwọn ìkookò náà dúró fún ní pàtó. Pípa àpèjúwe náà mọ́ ń yẹra fún fífi ìtumọ̀ tóóró kan lé e lórí.
- issue: Ìtumọ̀ ἄφιξις nínú àyíká ọ̀rọ̀
  choice: lẹ́yìn tí mo bá kúrò lọ́dọ̀ yín
  alternative: lẹ́yìn dídé mi; lẹ́yìn wíwá mi
  rationale: Bí ìtumọ̀ ọ̀rọ̀ náà ṣe lè jẹ́ ‘dídé’ tàbí ‘wíwá’ nìkan kò bá ìṣàn ọ̀rọ̀ mu dáadáa; Pọ́ọ̀lù ń kìlọ̀ nípa ohun tí yóò ṣẹlẹ̀ lẹ́yìn tí ó bá fi wọn sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa àwòrán ìkookò àti agbo mọ́, a sì lo ‘dá ... sí’ gẹ́gẹ́ bí ọ̀nà Yorùbá tó ṣe déédéé fún ṣíṣàánú tàbí yíyẹra fún pípa ní lára.
