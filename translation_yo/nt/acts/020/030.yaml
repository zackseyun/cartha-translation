source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: yo
  text: Àti láàárín ẹ̀yin tìkára yín, àwọn ọkùnrin kan yóò dìde, wọ́n yóò máa sọ ọ̀rọ̀ tí ó yà kúrò ní òtítọ́, láti mú àwọn ọmọ ẹ̀yìn tẹ̀ lé ara wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ aṣòdì” tàbí “ọ̀rọ̀ tí a ti yí kúrò ní títọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: láàárín ẹ̀yin fúnra yín
  rationale: Ó pa ìtẹnumọ́ mọ́ pé ewu náà yóò jáde láti inú àwùjọ wọn fúnra wọn.
- source_word: ἀναστήσονται
  choice: yóò ... dìde
  rationale: Ó fi ìsọtẹ́lẹ̀ ọjọ́ iwájú hàn, ó sì túmọ̀ sí pé àwọn ọkùnrin bẹ́ẹ̀ yóò farahàn láàárín wọn.
- source_word: ἄνδρες
  choice: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí akọ ní pàtó, nítorí náà a kò sọ ọ́ di ọ̀rọ̀ àpapọ̀ fún ènìyàn.
- source_word: λαλοῦντες
  choice: tí wọn yóò máa sọ
  rationale: Àpólà náà ṣàpèjúwe ìṣe sísọ tí ń bá a lọ.
- source_word: διεστραμμένα
  choice: àwọn ohun tí a ti yí po
  rationale: Ó pa àwòrán ohun tí a ti yí kúrò ní títọ́ mọ́, láì dín ìtumọ̀ náà kù sí ẹ̀kọ́ èké kan pàtó.
- source_word: τοῦ ἀποσπᾶν
  choice: láti fa ... lọ
  rationale: Ó fi ète hàn, ó sì pa àwòrán fífa àwọn ènìyàn kúrò lọ́dọ̀ ẹgbẹ́ wọn mọ́.
- source_word: τοὺς μαθητὰς
  choice: àwọn ọmọ ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún àwọn ọmọ ẹ̀yìn Jésù nínú Ìṣe Àwọn Aposteli.
- source_word: ὀπίσω ἑαυτῶν
  choice: lọ sẹ́yìn ara wọn
  rationale: Ó fi hàn pé àwọn ọkùnrin náà fẹ́ kí àwọn ọmọ ẹ̀yìn di olùtẹ̀lé tiwọn fúnra wọn.
theological_decisions:
- issue: Irú ọ̀rọ̀ tí àwọn olùkọ́ èké yóò sọ
  choice: àwọn ohun tí a ti yí po
  alternative: àwọn ohun àyídáyidà; àwọn ohun tí ó yà kúrò ní òtítọ́
  rationale: Gíríìkì náà lè tọ́ka sí ohun tí a ti yí tàbí bàjẹ́; ìtumọ̀ yìí pa ìkìlọ̀ gbòòrò náà mọ́ láì sọ pé ẹ̀kọ́ èké kan pàtó ni.
- issue: Ìtúmọ̀ akọ ti ἄνδρες
  choice: àwọn ọkùnrin
  alternative: àwọn ènìyàn
  rationale: Nítorí ọ̀rọ̀ orísun náà jẹ́ akọ ní pàtó, a pa akọ náà mọ́.
translation_notes:
  register: Yorùbá àjọṣe òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìtẹnumọ́ orísun inú àwùjọ, ìṣe sísọ tí ń bá a lọ, àti ète láti kó àwọn ọmọ ẹ̀yìn tẹ̀ lé ara wọn mọ́.
