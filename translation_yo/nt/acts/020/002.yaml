  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀, ‘àwọn agbègbè wọ̀nyẹn,’ àti ìdé ẹni náà sí ilẹ̀ Gíríìsì. Ṣùgbọ́n ìṣọ̀kan ‘fi ọ̀rọ̀ púpọ̀ fún wọn ní ìṣírí’ kò dáa gẹ́gẹ́ bí Yorùbá àdánidá, ó sì lè mú kí ‘ọ̀rọ̀’ dà bí ohun tí a fún wọn. ‘Gba wọn níyànjú pẹ̀lú ọ̀rọ̀ púpọ̀’ sọ παρακαλέσας αὐτούς λόγῳ πολλῷ ní kedere, láì dín ìtumọ̀ παρακαλέω kù sí ìtumọ̀ kan ṣoṣo.
