  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: yo
  text: Lẹ́yìn tí ó la àwọn agbègbè wọ̀nyẹn kọjá, tí ó sì gba wọn níyànjú pẹ̀lú ọ̀rọ̀ púpọ̀[a], ó dé ilẹ̀ Gíríìsì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìgbà pípẹ́,” tàbí, “pẹ̀lú ìyanjú púpọ̀.” Ní tààrà, èdè Gíríìkì sọ pé, “pẹ̀lú ọ̀rọ̀ púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Lẹ́yìn tí ó la ... kọjá
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì ἦλθεν; ìtumọ̀ yìí pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: τὰ μέρη ἐκεῖνα
  choice: àwọn agbègbè wọ̀nyẹn
  rationale: μέρη túmọ̀ sí àwọn apá tàbí agbègbè; ‘àwọn agbègbè wọ̀nyẹn’ bá ọ̀rọ̀ nípa ibi mu, ó sì tọ́ka padà sí àwọn ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: παρακαλέσας
  choice: fún ... ní ìṣírí
  rationale: παρακαλέω lè túmọ̀ sí fífún ní ìṣírí, ìyanjú, tàbí ìtùnú. Ní àyíká ìbẹ̀wò Pọ́ọ̀lù sí àwọn onígbàgbọ́, ‘fún ... ní ìṣírí’ gbòòrò tó láì dín ìtumọ̀ rẹ̀ kù sí ìkìlọ̀ nìkan.
- source_word: αὐτοὺς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn onígbàgbọ́ tàbí ọmọ-ẹ̀yìn ní àwọn agbègbè tí a mẹ́nu kàn.
- source_word: λόγῳ πολλῷ
  choice: pẹ̀lú ọ̀rọ̀ púpọ̀
  rationale: Gbólóhùn náà túmọ̀ ní tààrà sí ‘pẹ̀lú ọ̀rọ̀ púpọ̀.’ Nínú gbólóhùn Yorùbá, a lò ó gẹ́gẹ́ bí ‘fi ọ̀rọ̀ púpọ̀ ... ní ìṣírí,’ tí ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ àdánidá mìíràn hàn.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ó dé ilẹ̀ Gíríìsì
  rationale: ἔρχομαι pẹ̀lú εἰς fi ìrìn dé inú agbègbè kan hàn. ‘Ó dé ilẹ̀ Gíríìsì’ jẹ́ Yorùbá àdánidá tí ó sọ ibi ìrìn náà dé kedere.
- source_word: δὲ
  choice: a fi ipa ìsopọ̀ rẹ̀ sínú ‘Lẹ́yìn tí’
  rationale: δέ jẹ́ asopọ̀ pẹ̀lẹ́; ìtumọ̀ Yorùbá gba ipa ìyípadà rẹ̀ sínú ìṣètò àkókò ‘Lẹ́yìn tí,’ láì fi ọ̀rọ̀ asopọ̀ tí yóò wuwo kún un.
