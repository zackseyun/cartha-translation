translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A pa àìdánilójú παρακαλέω mọ́ nípa yíyan ‘ìṣírí,’ a sì fi ‘ìyanjú’ sí àlàyé ìsàlẹ̀. Àmì ohùn àti àmì abẹ́lẹ̀ ni a lò níbi tí ó bá yẹ.
