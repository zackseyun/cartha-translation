- from: Àwọn ọkùnrin wọ̀nyí ti lọ ṣáájú, wọ́n sì ń dúró dè wá ní Tírówásì.[a]
  to: Àwọn ọkùnrin wọ̀nyí ti lọ ṣáájú, wọ́n sì ń dúró de wá ní Tíròásì.[a]
  rationale: Àtúnṣe náà ṣàtúnṣe ọ̀rọ̀ ìṣe «dúró de» sí ìkọ̀wé Yorùbá tó tọ́, ó sì mú ìkọ̀wé orúkọ Troas bára mu pẹ̀lú ìlò Yorùbá. Kò yí ìtumọ̀ tàbí ìbáṣepọ̀ àwọn ìṣe nínú ọ̀rọ̀ Gíríìkì náà padà.
  reviewer_model: gpt-5.6-terra
