review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tọ́ka tọ́na sí àwọn alábàákẹ́gbẹ́ tí a mẹ́nu kàn tẹ́lẹ̀, ó sì pa ìlànà ìṣe náà mọ́: wọ́n lọ ṣáájú ẹgbẹ́ akọ̀ròyìn, wọ́n sì ń dúró de wọn ní Troas. Àmọ́, «dúró dè» kò tọ́ ní ìkọ̀wé Yorùbá níbí; «dúró de» ni ọ̀rọ̀ ìṣe tó túmọ̀ sí ‘wait for.’'
  naturalness: Gbolóhùn náà jẹ́ Yorùbá boṣewa tó yege, pẹ̀lú ìfarahàn imperfect nínú «ń dúró de». A tún ṣe orúkọ ibi náà sí ìtúmọ̀-orúkọ Yorùbá tí ó wọ́pọ̀, «Tíròásì».
  terminology: «Àwọn ọkùnrin wọ̀nyí», «lọ ṣáájú», àti «dúró de wá» jẹ́ àwọn yíyan ọ̀rọ̀ tí ó bá àyíká ìrìn-àjò náà mu. «Sì» ń ṣàfihàn δέ ní ìwọ̀ntúnwọ̀nsì, láìfi ìtakora kún un.
  issues:
  - severity: medium
    issue: «dúró dè» yẹ kí ó jẹ́ «dúró de».
    rationale: Nínú Yorùbá boṣewa, «dúró de ẹni» ni ọ̀rọ̀ ìṣe fún ‘wait for someone’; àmì ohùn kíkù sí «dè» yí ìtumọ̀/ìkọ̀wé ọ̀rọ̀ náà padà.
  - severity: low
    issue: Ìkọ̀wé orúkọ ibi «Tírówásì» kò fara mọ́ ìlò Yorùbá tí ó wọ́pọ̀ fún Troas.
    rationale: «Tíròásì» jẹ́ ìtúmọ̀-orúkọ Yorùbá tó sún mọ́ Troas/Τρῳάς, ó sì yẹ fún ìlò ìtumọ̀ Bíbélì Yorùbá.
  revised_text: Àwọn ọkùnrin wọ̀nyí ti lọ ṣáájú, wọ́n sì ń dúró de wá ní Tíròásì.[a]
