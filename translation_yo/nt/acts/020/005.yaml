  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: yo
  text: Àwọn ọkùnrin wọ̀nyí ti lọ ṣáájú, wọ́n sì ń dúró de wá ní Tíròásì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Àwọn wọ̀nyí, lẹ́yìn tí wọ́n lọ ṣáájú, ń dúró de wá ní Tíròásì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Àwọn ọkùnrin wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka yìí jẹ́ akọ ní ọ̀pọ̀, ó sì ń tọ́ka sí àwọn alábàákẹ́gbẹ́ tí a ṣẹ̀ṣẹ̀ dárúkọ; fífi “àwọn ọkùnrin” kún un mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “sì” so ìṣe kejì mọ́ ti àkọ́kọ́ lọ́nà àdánidá láìfi ìtakora tí kò sí sínú ọ̀rọ̀ náà.
- source_word: προσελθόντες
  choice: ti lọ ṣáájú
  rationale: Nínú àyíká ìrìn-àjò yìí, ọ̀rọ̀ aláìlópìn náà fi hàn pé wọ́n ṣáájú ẹgbẹ́ akọ̀ròyìn; “ti lọ ṣáájú” sọ ìṣe tó ṣẹlẹ̀ ṣáájú dídúró dè wọ́n ní kedere.
- source_word: ἔμενον
  choice: ń dúró dè
  rationale: Bó tilẹ̀ jẹ́ pé μένω lè túmọ̀ sí “dúró” tàbí “wà,” pẹ̀lú ἡμᾶς gẹ́gẹ́ bí ẹni tí ìṣe náà kàn nínú àyíká yìí, ó túmọ̀ sí dídúró de bí wọ́n ṣe ń bọ̀. “Ń dúró dè” tún pa ìṣe tó ń bá a lọ nínú imperfect mọ́.
- source_word: ἡμᾶς
  choice: wá
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ ní ọ̀pọ̀ gẹ́gẹ́ bí olùgbà ìṣe; “wá” ni ìtumọ̀ Yorùbá tó tọ́.
- source_word: ἐν Τρῳάδι
  choice: ní Tírówásì
  rationale: ἐν pẹ̀lú orúkọ ibi ní dative jẹ́ ìtọ́kasí ibi; “ní Tírówásì” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó mọ́ tónì, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ń dúró dè” fún ìṣe tó ń bá a lọ, a sì fi àlàyé ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì sí àlàyé ìsàlẹ̀.
