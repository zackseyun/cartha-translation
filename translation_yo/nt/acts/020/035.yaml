  verdict: revise
  source_fidelity: 'Àwọn apá pàtàkì ti ẹsẹ náà wà ní ìbámu pẹ̀lú Gíríìkì: πάντα/ὑπέδειξα ni a gbé kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ Pọ́ọ̀lù ní gbogbo ọ̀nà; κοπιῶντας, δεῖ, àti ἀντιλαμβάνεσθαι ni a túmọ̀ ní ìfẹ̀sẹ̀mulẹ̀. ‘Àwọn aláìlera’ dá ìwọ̀n gíga ἀσθενούντων dúró, láìdín un kù sí ìsàn, òṣì, tàbí àìlera ẹ̀mí. Àmì ìtẹnumọ́ nínú αὐτὸς wà nínú ‘òun fúnra rẹ̀.’ Àmọ́ gbolohun àsọyé nínú ìsọ̀rí ni a lè ṣe kedere sí i fún μακάριον ... μᾶλλον: ‘ní ìbùkún púpọ̀’ lè dà bí iye àwọn ìbùkún dípò ìfiwéra pé fífúnni jẹ́ ohun ìbùkún jù.'
  naturalness: Ọ̀rọ̀ Yorùbá náà jẹ́ ti ìpele àárín tó yẹ, ó sì ní àmì ohùn tó dára. Àtúnṣe kékeré nínú àsọyé Jésù ń mú un jẹ́ ìsọ̀rọ̀ Yorùbá tó wúlò, tó sì sún mọ́ ìtumọ̀ Gíríìkì.
  terminology: ‘Olúwa Jésù,’ ‘ran ... lọ́wọ́,’ àti ‘àwọn aláìlera’ yẹ, wọ́n sì yẹra fún ìtumọ̀ ẹ̀kọ́ ìsìn tó dín ọ̀rọ̀ kù. Àlàyé ìsàlẹ̀ fún ἀντιλαμβάνεσθαι jẹ́ ìrànlọ́wọ́ tó bá ìtumọ̀ ọ̀rọ̀ náà mu.
  issues:
  - severity: low
    issue: Àsọyé ‘Fífúnni ní ìbùkún púpọ̀ ju gbígbà lọ’ kò sọ ìfiwéra μακάριον (‘jẹ́ ohun ìbùkún jù’) ní tààrà.
    rationale: ‘Ní ìbùkún púpọ̀’ lè yọrí sí ìgbọ́ pé fífúnni ní iye ìbùkún púpọ̀, dípò pé fífúnni fúnra rẹ̀ ni a pè ní ohun ìbùkún jù gbígbà lọ. Àtúnṣe náà jẹ́ kékeré, ó sì pa ìtumọ̀ àti ìfiwéra Gíríìkì mọ́.
