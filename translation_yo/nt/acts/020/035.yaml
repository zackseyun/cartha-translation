id: ACT.20.35
reference: Acts 20:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: yo
  text: Nínú ohun gbogbo, mo fi hàn yín pé nípa ṣíṣiṣẹ́ kára báyìí, a gbọ́dọ̀ ran àwọn aláìlera lọ́wọ́[a], kí a sì máa rántí àwọn ọ̀rọ̀ Olúwa Jésù, bí òun fúnra rẹ̀ ti sọ pé, “Ìbùkún ni láti fi fúnni ju láti gbà lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbé àwọn aláìlera ró.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ìrànwọ́ tí a ń ṣe fún wọn déédéé, kì í ṣe ìrànwọ́ ìgbà díẹ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Nínú ohun gbogbo
  rationale: A lò ó gẹ́gẹ́ bí ọ̀rọ̀ tó ń ṣàlàyé bí Pọ́ọ̀lù ṣe fi àpẹẹrẹ hàn ní gbogbo ọ̀nà, dípò kí a ya á sọ́tọ̀ gẹ́gẹ́ bí ohun tí ìṣe náà kàn.
- source_word: ὑπέδειξα
  choice: mo fi hàn
  rationale: Ó lè túmọ̀ sí fífi ohun kan hàn tàbí fífi àpẹẹrẹ hàn; gbólóhùn tó tẹ̀ lé mú ipa àpẹẹrẹ náà ṣe kedere.
- source_word: οὕτως κοπιῶντας
  choice: nípa ṣíṣiṣẹ́ kára báyìí
  rationale: Èyí tọ́ka sí irú iṣẹ́ líle tí Pọ́ọ̀lù ṣe, ó sì pa agbára ìsapá tó wà nínú κοπιάω mọ́.
- source_word: δεῖ
  choice: a gbọ́dọ̀
  rationale: Ó fi dandan tàbí ojúṣe hàn ní Yorùbá àdánidá, láìfi ẹni pàtó tí kò sí nínú Gíríìkì kun ọ̀rọ̀ náà.
- source_word: ἀντιλαμβάνεσθαι
  choice: ran … lọ́wọ́
  rationale: Ó túmọ̀ sí láti ṣèrànwọ́ tàbí láti gbé ẹnì kan ró; ìtumọ̀ kejì tí ó lè fi ìrànwọ́ tí ń bá a lọ hàn wà nínú àlàyé ìsàlẹ̀.
- source_word: τῶν ἀσθενούντων
  choice: àwọn aláìlera
  rationale: Ọ̀rọ̀ náà lè kan àwọn tí ara wọn kò le, àwọn aláìní, tàbí àwọn tí ipò wọn jẹ́ aláìlágbára; a kò dín ìtumọ̀ rẹ̀ kù sí ọ̀kan ṣoṣo.
- source_word: μνημονεύειν τε
  choice: kí a sì máa rántí
  rationale: Ó pa ìsopọ̀ mọ́ ojúṣe tó ṣáájú mọ́, ó sì fi ìrántí tí ń bá a lọ hàn lọ́nà àdánidá.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: àwọn ọ̀rọ̀ Olúwa Jésù
  rationale: ‘Àwọn ọ̀rọ̀’ jẹ́ ìtumọ̀ tààrà fún λόγων níhìn-ín, ‘Olúwa’ sì pa oyè κύριος mọ́.
- source_word: αὐτὸς εἶπεν
  choice: òun fúnra rẹ̀ ti sọ pé
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́ pé Jésù fúnra rẹ̀ ni ó sọ ọ̀rọ̀ náà.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Fífúnni ní ìbùkún púpọ̀ ju gbígbà lọ
  rationale: Ìtumọ̀ yìí pa ìfiwéra ‘ju … lọ’ àti èrò μακάριον mọ́ ní Yorùbá tó ṣe kedere, láìfi ẹni tí ń fún tàbí ẹni tí ń gbà kun ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘àwọn aláìlera’
  choice: A fi í sílẹ̀ ní gbòòrò gẹ́gẹ́ bí ‘àwọn aláìlera.’
  alternative: Àwọn tálákà; àwọn aláìsàn; àwọn aláìlera nípa ẹ̀mí.
  rationale: ἀσθενούντων ní ìtumọ̀ tó gbòòrò. Bí ó tilẹ̀ jẹ́ pé iṣẹ́ àti fífúnni nínú àyíká ọ̀rọ̀ náà lè tọ́ka sí àwọn tí wọ́n nílò ìrànwọ́, ẹsẹ náà kò yan irú àìlera kan pàtó.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
