  to: Nínú ohun gbogbo, mo fi hàn yín pé nípa ṣíṣiṣẹ́ kára báyìí, a gbọ́dọ̀ ran àwọn aláìlera lọ́wọ́[a], kí a sì máa rántí àwọn ọ̀rọ̀ Olúwa Jésù, bí òun fúnra rẹ̀ ti sọ pé, “Ìbùkún ni láti fi fúnni ju láti gbà lọ.”
