source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: yo
  text: Ní ọjọ́ kìíní ọ̀sẹ̀, nígbà tí a péjọ láti bú àkàrà[a], Pọ́ọ̀lù ń bá wọn sọ̀rọ̀; níwọ̀n bí ó ti fẹ́ lọ ní ọjọ́ kejì[b], ó sì fa ọ̀rọ̀ náà gùn títí di ọ̀gànjọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún bíbú àkàrà.” Gbólóhùn náà lè tọ́ka sí jíjẹun papọ̀, ó sì tún lè ní ìtumọ̀ Oúnjẹ Alẹ́ Olúwa.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Pọ́ọ̀lù ń bá wọn sọ̀rọ̀, ó ń fẹ́ lọ ní ọjọ́ kejì, ó sì fa ọ̀rọ̀ náà gùn títí di ọ̀gànjọ́.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Ní ọjọ́ kìíní ọ̀sẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ àṣà-ọrọ fún ọjọ́ kìíní ọ̀sẹ̀; δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò pọn dandan láti túmọ̀ lọ́tọ̀ ní Yorùbá.
- source_word: συνηγμένων ἡμῶν
  choice: nígbà tí a péjọ
  rationale: Ó fi ipò tí ìṣe pàtàkì ti ṣẹlẹ̀ hàn, ó sì pa ojú-ìwòye ẹni-kìíní ọ̀pọ̀ mọ́.
- source_word: κλάσαι ἄρτον
  choice: láti bú àkàrà
  rationale: Ìtumọ̀ yìí pa àkànlò-èdè orísun mọ́ láì pinnu bóyá àsè àjọṣe lasan ni tàbí bóyá ó ní ìtumọ̀ Oúnjẹ Alẹ́ Olúwa.
- source_word: διελέγετο αὐτοῖς
  choice: ń bá wọn sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi ìṣe tí ń bá a lọ hàn, ‘bá wọn sọ̀rọ̀’ sì pa ìmọ̀ pé ìbánisọ̀rọ̀ lè wà mọ́ ju ‘wàásù fún wọn’ lọ.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Ó ní lọ lọ́jọ́ kejì
  rationale: Ó sọ pé ìlọ náà sún mọ́lé, ní èdè Yorùbá àdánidá, láì fi ìdí ìbáṣepọ̀ gírámà rẹ̀ múlẹ̀ ju bí orísun ṣe ṣe lọ.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: ó sì mú ọ̀rọ̀ rẹ̀ gùn
  rationale: Ó túmọ̀ sí pé Pọ́ọ̀lù tẹ̀ síwájú ní sísọ̀rọ̀ fún ìgbà pípẹ́; ‘ọ̀rọ̀ rẹ̀’ jẹ́ èdè Yorùbá àdánidá fún λόγος ní àyíká yìí.
- source_word: μέχρι μεσονυκτίου
  choice: títí di ọ̀gànjọ́ òru
  rationale: Ìtumọ̀ àkókò náà ṣe kedere pé ọ̀rọ̀ náà tẹ̀ síwájú títí di àárín òru.
theological_decisions:
- issue: Ìtumọ̀ ‘láti bú àkàrà’ nínú àpéjọ àwọn Kristẹni àkọ́kọ́
  choice: A pa àkànlò-èdè náà mọ́ gẹ́gẹ́ bí ‘láti bú àkàrà.’
  alternative: ‘láti jẹ Oúnjẹ Alẹ́ Olúwa’ tàbí ‘láti jẹun papọ̀’
  rationale: Gbólóhùn náà lè tọ́ka sí oúnjẹ àjọṣe, ó sì tún lè ní ìtumọ̀ Oúnjẹ Alẹ́ Olúwa. Orísun kò fi ọ̀kan ṣoṣo múlẹ̀, nítorí náà a kò yanjú ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà fi sílẹ̀ ní gbangba.
- issue: Ìbáṣepọ̀ μέλλων ἐξιέναι pẹ̀lú gbólóhùn pàtàkì
  choice: A fi gbolohun ominira ‘Ó ní lọ lọ́jọ́ kejì’ hàn.
  alternative: ‘nítorí pé ó fẹ́ lọ lọ́jọ́ kejì’ tàbí ‘tí ó ń pète láti lọ lọ́jọ́ kejì’
  rationale: Participle náà lè ṣàlàyé èrò ìlọ tàbí ìdí tí Pọ́ọ̀lù fi mú ọ̀rọ̀ gùn. Ìtúmọ̀ àkọ́kọ́ kò fi ìbáṣepọ̀ ọgbọ́n yẹn múlẹ̀ ju orísun lọ; àlàyé ẹsẹ̀ ìsàlẹ̀ sì pa àṣàyàn kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, olóhùn níbi tí ó ti yẹ, ní ọ̀nà ọ̀wọ̀ àti èdè òde òní tí ó rọrùn fún òǹkàwé gbogbogbò. A lo ‘Pọ́ọ̀lù’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tó wọ́pọ̀ ní Yorùbá, ‘bú àkàrà’ sì pa àwòrán ọrọ̀ Gíríìkì mọ́.
