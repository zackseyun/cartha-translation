revisions:
- from: Ní ọjọ́ kìíní ọ̀sẹ̀, nígbà tí a péjọ láti bú àkàrà[a], Pọ́ọ̀lù ń bá wọn sọ̀rọ̀. Ó ní lọ lọ́jọ́ kejì[b], ó sì mú ọ̀rọ̀ rẹ̀ gùn títí di ọ̀gànjọ́ òru.
  to: Ní ọjọ́ kìíní ọ̀sẹ̀, nígbà tí a péjọ láti bú àkàrà[a], Pọ́ọ̀lù ń bá wọn sọ̀rọ̀; níwọ̀n bí ó ti fẹ́ lọ ní ọjọ́ kejì[b], ó sì fa ọ̀rọ̀ náà gùn títí di ọ̀gànjọ́.
  rationale: Àtúnṣe náà rọ́pò ìsọ̀rọ̀ tí kò ṣe kedere, ‘Ó ní lọ,’ pẹ̀lú ‘níwọ̀n bí ó ti fẹ́ lọ,’ láti fi ìfẹ́/ètò ìlọ tí μέλλων ἐξιέναι ń tọ́ka sí hàn, nígbà tí ó ń jẹ́ kí ìbáṣepọ̀ ìdí tí participle náà lè ní wa ní gbangba. A tún ṣàtúnṣe ọ̀rọ̀ ìṣe náà sí ‘fa ọ̀rọ̀ náà gùn’ fún Yorùbá àdánidá. Àkànlò ‘bú àkàrà’ àti àìdájú rẹ̀ nípa oúnjẹ àjọṣe tàbí Oúnjẹ Alẹ́ Olúwa ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
