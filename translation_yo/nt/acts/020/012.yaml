  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: yo
  text: Wọ́n sì mú ọmọkùnrin náà lọ láàyè, wọ́n sì rí ìtùnú gidigidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “a kò tù wọ́n nínú níwọ̀n díẹ̀”; èyí jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó túmọ̀ sí pé wọ́n rí ìtùnú gidigidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον
  choice: mú ... wá
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dídarí tàbí mímú ẹnì kan wá/lọ. Ní àyíká ọ̀rọ̀ yìí, “mú ... wá” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé wọ́n mú Eutiku dé sí ọ̀dọ̀ àwọn tó péjọ.
- source_word: παῖδα
  choice: ọmọkùnrin
  rationale: παῖς lè jẹ́ ọmọ, ọmọkùnrin, tàbí ìránṣẹ́; níbí ó ń tọ́ka sí Eutiku, ẹni tí ẹsẹ̀ 9 pè ní ọ̀dọ́mọkùnrin, nítorí náà “ọmọkùnrin” bá àyíká ọ̀rọ̀ mu láìfi ìránṣẹ́ hàn.
- source_word: ζῶντα
  choice: láàyè
  rationale: Ọ̀rọ̀ alábápín náà sọ ipò tí ọmọkùnrin náà wà nígbà tí wọ́n mú un wá; “láàyè” jẹ́ gbólóhùn Yorùbá tó ṣe kedere jù lọ.
- source_word: παρεκλήθησαν
  choice: rí ìtùnú
  rationale: Nínú àyíká ikú tí wọ́n rò pé ó ṣẹlẹ̀ àti ìpadà sí ìyè, “rí ìtùnú” mú ìtùnú àti ìfọkànbalẹ̀ tí ọ̀rọ̀ náà ń sọ jáde.
- source_word: οὐ μετρίως
  choice: púpọ̀
  rationale: Èyí jẹ́ ọ̀nà àsọyé ìdínkù tí ó túmọ̀ sí ‘gidigidi’ tàbí ‘púpọ̀.’ “Púpọ̀” sọ ìtumọ̀ náà ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan pamọ́.
