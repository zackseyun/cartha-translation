  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: yo
  text: Nítorí èmi kò fà sẹ́yìn láti kéde gbogbo ìmọ̀ràn Ọlọ́run fún yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ète Ọlọ́run,” “gbogbo ètò Ọlọ́run,” tàbí “gbogbo ohun tí Ọlọ́run fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé, ní èdè Yorùbá àdánidá.
- source_word: οὐ ὑπεστειλάμην
  choice: èmi kò fà sẹ́yìn
  rationale: Ọ̀rọ̀ yìí pa àwòrán yíyọ ara ẹni sẹ́yìn mọ́, ó sì lè ní ìtumọ̀ pé Pọ́ọ̀lù kò bẹ̀rù tàbí fawọ́ ohun tó yẹ kí ó kéde sẹ́yìn.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: láti kéde
  rationale: Ó sọ ohun tí Pọ́ọ̀lù kò fà sẹ́yìn láti ṣe; ‘kéde’ bá ipò ìkọ́ni àti ìjẹ́rìí ọ̀wọ̀ yìí mu.
- source_word: πᾶσαν
  choice: gbogbo
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan, ó tẹnumọ́ ìkúnrẹ́rẹ́ ohun tí a kéde.
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: ìmọ̀ràn Ọlọ́run
  rationale: ‘Ìmọ̀ràn’ jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò, tó lè gba èrò, ète, ìpinnu tàbí ìfẹ́ Ọlọ́run láàyè láì dín ọ̀rọ̀ Gíríìkì náà sí ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó tọ́ka sí àwọn tí a ń bá sọ̀rọ̀. Pẹ̀lú ‘kéde,’ ‘fún yín’ jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ βουλὴ τοῦ θεοῦ
  choice: gbogbo ìmọ̀ràn Ọlọ́run
  alternative: gbogbo ète Ọlọ́run; gbogbo èrò Ọlọ́run; gbogbo ìfẹ́ Ọlọ́run
  rationale: βούλη ní ààyè ìtumọ̀ tó lè jẹ́ ìmọ̀ràn, ète, ìpinnu, tàbí ìfẹ́. ‘Ìmọ̀ràn’ pa ìfẹ̀hónúhàn yìí mọ́, láì fi ẹsẹ̀ náà ṣètìlẹ́yìn fún ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘fà sẹ́yìn’ láti pa àwòrán inú ὑποστέλλω mọ́, a sì lo ‘ìmọ̀ràn’ fún βουλή nítorí ìtumọ̀ rẹ̀ tó gbòòrò.
