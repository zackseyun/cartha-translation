  naturalness: Gbolohun náà jẹ́ Yorùbá boṣewa, ó sì ní àmì-ohùn tó pé. «Èmi» jẹ́ ìtẹnumọ́ tí kò sí ní pàtó nínú Gíríìkì, ṣùgbọ́n ó bá ọ̀rọ̀ Pọ́ọ̀lù mu, kò sì yí ìtumọ̀ padà.
