    rationale: Nínú Yorùbá, ìfẹ́ Ọlọ́run sábà máa ń túmọ̀ sí ‘God’s love.’ «Gbogbo ohun tí Ọlọ́run fẹ́» ń mú ‘will’ hàn láì dá ìdààmú sílẹ̀.
