id: ACT.1.16
reference: Acts 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: yo
  text: “Ẹ̀yin ọkùnrin, ẹ̀yin ará, ó pọndandan kí Ìwé Mímọ́ náà ṣẹ, èyí tí Ẹ̀mí Mímọ́ ti sọ tẹ́lẹ̀[a] láti ẹnu Dáfídì[b] nípa Júdásì, ẹni tí ó di amọ̀nà fún àwọn tí wọ́n mú Jésù[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti sọ àsọtẹ́lẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “sọ ṣáájú” tàbí “sọ àsọtẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní gangan, “láti ẹnu Dáfídì”; èyí jẹ́ ọ̀nà ìsọ̀rọ̀ fún ọ̀rọ̀ tí Ẹ̀mí Mímọ́ sọ nípasẹ̀ Dáfídì.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn tí wọ́n dì Jésù mú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ẹ̀yin ọkùnrin, ẹ̀yin ará
  rationale: Ó pa àwọn ọ̀rọ̀ ìpè méjèèjì mọ́—‘ọkùnrin’ àti ‘ará’—gẹ́gẹ́ bí Gíríìkì ṣe sọ, ní ọ̀nà tí ó ṣeé lóye gẹ́gẹ́ bí ọ̀rọ̀ ìkíni sí àwùjọ.
- source_word: ἔδει
  choice: ó pọndandan
  rationale: Ó fi ìjẹ́pàtàkì tí δεῖ ń tọ́ka sí hàn láì ṣàlàyé ohun tí ẹsẹ̀ náà kò sọ nípa bí ìpinnu Ọlọ́run ṣe ṣiṣẹ́.
- source_word: πληρωθῆναι τὴν γραφήν
  choice: kí Ìwé Mímọ́ náà ṣẹ
  rationale: ‘Ṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìmúṣẹ ọ̀rọ̀ Ìwé Mímọ́, ó sì pa ìtumọ̀ àṣeparí ohun tí a ti sọ tẹ́lẹ̀ mọ́.
- source_word: προεῖπε
  choice: ti sọ tẹ́lẹ̀
  rationale: Ó tẹ̀lé ìtumọ̀ gangan ‘sọ ṣáájú’ láì fi ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ àsọtẹ́lẹ̀ kún un ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá ìgbàlódé tí ó wọ́pọ̀, tí ó sì bójú mu fún ẹni tí Gíríìkì sọ pé ó ń sọ̀rọ̀.
- source_word: διὰ στόματος Δαυὶδ
  choice: nípasẹ̀ ẹnu Dáfídì
  rationale: 'Ó pa àwòrán àti ìgbékalẹ̀ Gíríìkì mọ́: Ẹ̀mí Mímọ́ ni olùsọ̀rọ̀, Dáfídì sì ni aṣojú ènìyàn tí ọ̀rọ̀ náà gba ẹnu rẹ̀ jáde.'
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: ẹni tí ó di amọ̀nà
  rationale: ‘Di amọ̀nà’ ṣàfihàn γενομένου àti ὁδηγοῦ láì sọ pé òun nìkan ni amọ̀nà náà.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: fún àwọn tí wọ́n mú Jésù
  rationale: ‘Mú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹni sábẹ́ àṣẹ tàbí mímú un ní ipá; àlàyé ìsàlẹ̀ fi yíyan ‘dì mú’ hàn.
theological_decisions:
- issue: Ìjẹ́pàtàkì ìmúṣẹ Ìwé Mímọ́
  choice: ó pọndandan kí Ìwé Mímọ́ náà ṣẹ
  alternative: ó ní láti ṣẹ nítorí àyànmọ́ Ọlọ́run
  rationale: Gíríìkì sọ pé ó pọndandan, ṣùgbọ́n kò ṣàlàyé gbogbo ìbáṣepọ̀ tó wà láàárín ìmọ̀-tẹ́lẹ̀ Ọlọ́run, ìmísí Ìwé Mímọ́, àti ojúṣe ènìyàn. Ìtumọ̀ náà kò yanjú ìjà-ẹ̀kọ́ tí ẹsẹ̀ náà kò yanjú.
- issue: Aṣojú Ọlọ́run àti aṣojú ènìyàn nínú ìmísí
  choice: Ẹ̀mí Mímọ́ ti sọ tẹ́lẹ̀ nípasẹ̀ ẹnu Dáfídì
  alternative: Dáfídì sọ ọ́ nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: Ìṣètò Gíríìkì fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí olùsọ̀rọ̀, ó sì fi Dáfídì hàn gẹ́gẹ́ bí ẹni tí ọ̀rọ̀ náà gba ẹnu rẹ̀ jáde; a pa méjèèjì mọ́.
translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìpè ‘Ẹ̀yin ọkùnrin, ẹ̀yin ará’ pa àfihàn akọ nínú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó ní ìrísí ọ̀rọ̀ àsọyé díẹ̀. A lo àwọn orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá: Dáfídì, Júdásì, àti Jésù.'
