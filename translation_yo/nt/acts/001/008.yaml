id: ACT.1.8
reference: Acts 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin yóò gba agbára nígbà tí Ẹ̀mí Mímọ́ bá ti bà lé yín, ẹ̀yin yóò sì jẹ́ ẹlẹ́rìí mi ní Jerusalẹmu, ní gbogbo Judea àti ní Samaria, àti títí dé òpin ayé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí dé àwọn òpin ayé.” Nínú Gíríìkì, “òpin” náà wà ní ẹyọ (“òpin ayé”), ṣùgbọ́n ọ̀rọ̀ náà lè jẹ́ àpólà ọ̀rọ̀ fún ibi jíjìnnà jù lọ lórí ilẹ̀ ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ohun tí Jesu sọ níbí ṣe ìyàtọ̀ sí ọ̀rọ̀ ẹsẹ̀ 7, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: λήμψεσθε δύναμιν
  choice: ẹ̀yin yóò gba agbára
  rationale: “Gba” fi hàn pé agbára náà ni a fi fún wọn; “agbára” sì pa ìtumọ̀ fífúnni-lágbára mọ́ láì dín in kù sí okun ara nìkan.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: nígbà tí Ẹ̀mí Mímọ́ bá bà lé yín
  rationale: Gbólóhùn àsìkò yìí tú genitive absolute náà sí Yorùbá àdánidá; “bà lé yín” pa ìrìn sí orí ẹni tí ἐπί ń tọ́ka sí mọ́.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: ẹ̀yin yóò sì jẹ́ ẹlẹ́rìí mi
  rationale: “Ẹlẹ́rìí” túmọ̀ sí ẹni tí ń jẹ́rìí nípa ohun tí ó mọ̀; “mi” pa ìbáṣepọ̀ genitive náà mọ́, láì sọ ọ́ di “ajẹ́rìí fún mi” nìkan.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: ní Jerusalẹmu, ní gbogbo Judea àti Samaria
  rationale: Ó pa àwọn ibi gidi àti ìtẹ̀síwájú láti Jerusalẹmu sí àwọn agbègbè tó yí i ká mọ́, ní ìṣètò Yorùbá tó ṣe kedere.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: títí dé òpin ayé
  rationale: Ó tẹ̀ lé singular Gíríìkì ní pẹkipẹki, ó sì ṣì jẹ́ gbólóhùn Yorùbá tó lè tọ́ka sí ibi jíjìnnà jù lọ lórí ilẹ̀ ayé.
theological_decisions:
- issue: Ìtọ́kasí πνεῦμα sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àpilẹ̀kọ àti àyíká ọ̀rọ̀ tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni Ọlọ́run; lílo lẹ́tà ńlá jẹ́ àṣà Yorùbá Kristẹni tó ṣe kedere láì fi ẹ̀kọ́ àfikún sínú ẹsẹ̀ náà.
- issue: Ìbòòrò iṣẹ́ jíjẹ́rìí
  choice: àwọn ibi gidi láti Jerusalẹmu títí dé òpin ayé
  alternative: àwòrán ilẹ̀ ẹ̀mí nìkan
  rationale: Ọ̀rọ̀ náà dárúkọ àwọn ibi gidi, ó sì parí pẹ̀lú ìwọ̀n tó dé ibi jíjìnnà jù lọ; ìtumọ̀ náà kò fi ètò ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Ẹ̀yin” jẹ́ kí plural ẹni kejì hàn gbangba; a ṣètò clitic “sì” ní ọ̀nà Yorùbá àdánidá.
