  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ náà mọ́: ìyàtọ̀ náà, ìlérí agbára, Ẹ̀mí Mímọ́, jíjẹ́ ẹlẹ́rìí Jesu, àti ìtẹ̀síwájú àwọn ibi náà. Síbẹ̀, a tún gbé àsìkò genitive absolute náà kalẹ̀ kedere pẹ̀lú ‘bá ti bà lé yín,’ kí ó túmọ̀ sí pé Ẹ̀mí náà ti dé sórí wọn nígbà tí wọ́n gba agbára náà.'
  naturalness: ‘Bá bà lé’ lè jẹ́ gírámà, ṣùgbọ́n ó lè dà bí ìtúnṣe ‘bá’ méjì láìní ‘ti,’ ó sì kéré sí ìlò Bíbélì Yorùbá tí ó mọ́gbọ́n dání. ‘Bá ti bà lé yín’ jẹ́ kedere, ó sì rọrùn fún kíkà ní gbangba. Àtúnsọ ‘ní Samaria’ tún jẹ́ kí ‘gbogbo’ má ṣe dà bí ẹni pé ó ń kàn sí Samaria pẹ̀lú.
  terminology: ‘Ẹ̀mí Mímọ́,’ ‘agbára,’ àti ‘ẹlẹ́rìí mi’ bá ọ̀rọ̀ Kristẹni Yorùbá boṣewa mu, wọ́n sì bá ìtumọ̀ Gíríìkì mu. Jerusalẹmu, Judea, àti Samaria ni a pa mọ́ gẹ́gẹ́ bí orúkọ ibi.
  issues:
  - severity: medium
    issue: Gbólóhùn àsìkò náà ní ‘nígbà tí Ẹ̀mí Mímọ́ bá bà lé yín.’
    rationale: Fífi ‘ti’ kún un—‘bá ti bà lé yín’—ń sọ ìṣẹ̀lẹ̀ tí participle aorist náà fi hàn ní kedere (‘nígbà tí ... bá ti dé/bà lé yín’), ó sì yọ ìdààmú kúrò nínú ìtẹ̀lé ‘bá bà’.
  - severity: low
    issue: A kò tún ‘ní’ ṣe ṣáájú Samaria.
    rationale: Gíríìkì ní ἐν pẹ̀lú Judea, a sì lóye rẹ̀ pẹ̀lú Samaria. ‘Ní gbogbo Judea àti ní Samaria’ jẹ́ ìtúmọ̀ Yorùbá tó mọ́gbọ́n dání, ó sì dá ààlà ‘gbogbo’ sí Judea nìkan.
  - severity: low
    issue: Àlàyé ẹsẹ̀ ìsàlẹ̀ sọ pé gbólóhùn Gíríìkì ‘jẹ́ ẹyọ.’
    rationale: Ó dára kí a sọ pé ‘ìṣọ̀kan ọ̀rọ̀ náà jẹ́ ẹyọ’ tàbí pé ‘“òpin” náà wà ní ẹyọ,’ nítorí pé gbolohun fúnra rẹ̀ kì í ṣe ‘ẹyọ’ ní ọ̀nà gírámà yẹn.
