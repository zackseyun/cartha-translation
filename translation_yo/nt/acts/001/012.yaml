base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: yo
  text: Nígbà náà, wọ́n padà sí Jerúsálẹ́mù láti òkè tí a ń pè ní Òkè Ólífì[a], èyí tí ó wà nítòsí Jerúsálẹ́mù, ní ìjìnnà ìrìn ọjọ́ Ìsinmi kan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orúkọ náà ní ìtumọ̀ “òkè àwọn igi ólífì.”
    reason: lexical_alternative
  - marker: b
    text: “Ìrìn ọjọ́ Ìsinmi” ni ìjìnnà tí àṣà Júù fi mọ́ gẹ́gẹ́ bí ìwọ̀n ìrìn ní ọjọ́ Ìsinmi.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àsopọ̀ àkókò tí ó ń tẹ̀síwájú nínú ìtàn; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn.
- source_word: ὑπέστρεψαν
  choice: wọ́n padà
  rationale: Ó túmọ̀ sí pé wọ́n padà sí ibi tí wọ́n ti wá; gbolohun yìí ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: εἰς Ἰερουσαλὴμ
  choice: sí Jerúsálẹ́mù
  rationale: εἰς fi ìlọsí ibi kan hàn; ‘sí’ ni ọ̀nà Yorùbá tó bá a mu.
- source_word: ἀπὸ ὄρους
  choice: láti orí òkè
  rationale: ἀπό tọ́ka sí ibi tí ìrìn bẹ̀rẹ̀, ὄρος sì jẹ́ òkè; ‘láti orí òkè’ jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n sọ̀ kalẹ̀ láti ibẹ̀.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: tí a ń pè ní Òkè Ólífì
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ ibi tí ó ní ìbáṣepọ̀ pẹ̀lú igi ólífì. ‘Òkè Ólífì’ jẹ́ orúkọ ṣókí, tó ṣe kedere ní Yorùbá; àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: èyí tí ó wà nítòsí Jerúsálẹ́mù
  rationale: Ó pa ìbátan ibi náà mọ́, ó sì sọ ìsúnmọ́ rẹ̀ sí Jerúsálẹ́mù ní Yorùbá tó rọrùn.
- source_word: σαββάτου ἔχον ὁδόν
  choice: ní ìjìnnà ìrìn ọjọ́ Ìsinmi
  rationale: Èyí pa àṣà ìwọ̀n ìrìn àwọn Júù ní ọjọ́ Ìsinmi mọ́ láì sọ ọ́ di ìwọ̀n òde òní tí orísun kò sọ.
theological_decisions:
- issue: Ìtumọ̀ àṣà Júù nínú σαββάτου ἔχον ὁδόν
  choice: ní ìjìnnà ìrìn ọjọ́ Ìsinmi
  alternative: ìrìn ọjọ́ Ìsinmi kan sí ibẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ àṣà ju ẹ̀kọ́ ìgbàgbọ́ lọ. Ìtumọ̀ tí a yàn pa ìtọ́kasí sí ọjọ́ Ìsinmi àti èrò ìjìnnà mọ́, láì fi iye pàtó kún orísun.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ọ̀rọ̀ àṣà Júù mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
