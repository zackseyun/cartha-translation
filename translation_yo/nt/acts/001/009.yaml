id: ACT.1.9
reference: Acts 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: yo
  text: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí, bí wọ́n ti ń wò ó, a gbé e sókè,[a] ìkùukùu kan sì mú un kúrò ní ojú wọn.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a mú un lọ sókè.”
    reason: lexical_alternative
  - marker: b
    text: Ìkùukùu lè máa rán ènìyàn létí àwọn ìṣẹ̀lẹ̀ inú Ìwé Mímọ́ níbi tí ó ti jẹ́ àmì wíwà Ọlọ́run, ṣùgbọ́n ẹsẹ̀ yìí kò sọ èyí ní gbangba.
    reason: cross_reference
  - marker: c
    text: Tàbí, “ìkùukùu kan sì gbà á kúrò ní ojú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí
  rationale: “Sì” ń pa ìṣàn ìtàn tí καὶ ń so mọ́ ọ̀rọ̀ tó ṣáájú mọ́; “nígbà tí ... ti sọ” sì fi hàn pé ọ̀rọ̀ náà ti parí kí ìgbé sókè tó ṣẹlẹ̀.
- source_word: βλεπόντων αὐτῶν
  choice: bí wọ́n ti ń wò ó
  rationale: Ó sọ ìṣe tí ó ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ náà, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé àwọn ọmọ-ẹ̀yìn rí ohun tó ṣẹlẹ̀.
- source_word: ἐπήρθη
  choice: a gbé e sókè
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣe aláìṣe-taara, ó sì tọ́ka sí ìgbé sókè tí wọ́n rí; ìtumọ̀ yìí kò sọ ẹni tó gbé e ju bí Gíríìkì ṣe sọ lọ.
- source_word: νεφέλη
  choice: ìkùukùu kan
  rationale: Orúkọ náà kò ní àtẹnumọ́ ọ̀rọ̀ ìdámọ̀; “kan” fi àìdánimọ̀ náà hàn láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ὑπέλαβεν αὐτὸν
  choice: mú un
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ ìṣe náà lè túmọ̀ sí gbígbà tàbí mímú ẹnì kan; “mú un” jẹ́ èdè Yorùbá tó ṣe kedere fún ipa ìkùukùu náà.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: kúrò ní ojú wọn
  rationale: Ó pa àwòrán “ojú” inú Gíríìkì mọ́, ó sì sọ ní ọ̀nà Yorùbá tó yé ṣe pé wọn kò lè rí i mọ́.
theological_decisions:
- issue: Bóyá kí ἐπήρθη di gbólóhùn ẹ̀kọ́ nípa ìgòkè re ọ̀run
  choice: a gbé e sókè
  alternative: a mú un lọ sókè
  rationale: Àṣàyàn náà dúró mọ́ ìṣípò sókè tí ẹsẹ̀ náà ṣàpèjúwe, kò sì fi “sí ọ̀run” kún ohun tí ẹsẹ̀ yìí fúnra rẹ̀ kò sọ.
- issue: Bóyá kí νεφέλη jẹ́ ìkùukùu tí a dá mọ̀ gẹ́gẹ́ bí àmì wíwà Ọlọ́run
  choice: ìkùukùu kan
  alternative: ìkùukùu náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ìkùukùu sábà máa ń bá ìfarahàn Ọlọ́run pọ̀ nínú Ìwé Mímọ́, ẹsẹ̀ náà kò sọ ìtumọ̀ àmì yìí ní gbangba; àlàyé ìsàlẹ̀ ojú ìwé ló yẹ fún ìṣọ̀kan yẹn.
- issue: Bóyá kí ὑπέλαβεν túmọ̀ sí “gbà á” tàbí “mú un”
  choice: mú un
  alternative: gbà á
  rationale: “Mú un” dára sí etí Yorùbá nígbà tí ìkùukùu ni olùṣe, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn, “gbà á,” mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, tó ṣe kedere, tó sì ní ọlá. A lo “a gbé e” láti pa ìṣe aláìṣe-taara Gíríìkì mọ́, a sì yẹra fún fífi “sí ọ̀run” tàbí ìdánimọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ ẹsẹ̀ náà.
