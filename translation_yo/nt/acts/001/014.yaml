id: ACT.1.14
reference: Acts 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: yo
  text: Gbogbo àwọn wọ̀nyí ń dúró ṣinṣin nínú àdúrà pẹ̀lú ọkàn kan[a], pẹ̀lú àwọn obìnrin[b], Màríà, ìyá Jésù, àti pẹ̀lú àwọn arákùnrin rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí ‘ní ìṣọ̀kan’ tàbí ‘pẹ̀lú ọkàn kan’; ọ̀rọ̀ Gíríìkì tẹnu mọ́ ète tí wọ́n jọ ní, kì í ṣe pé wọ́n kàn péjọ sí ibi kan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí ‘pẹ̀lú obìnrin.’ Àpilẹ̀kọ kò sí nínú Gíríìkì, ṣùgbọ́n gbólóhùn náà lè tọ́ka sí ẹgbẹ́ obìnrin tí a mọ̀ tí ó wà pẹ̀lú àwọn ọmọ-ẹ̀yìn.
    reason: lexical_alternative
  - marker: c
    text: ‘Àwọn arákùnrin’ ni a fi tú ọ̀rọ̀ Gíríìkì adelphoi. Àwọn kan gbà pé ó lè ní ìtumọ̀ gbígbòòrò sí àwọn ìbátan tímọ́tímọ́; ẹsẹ̀ yìí fúnra rẹ̀ kò ṣàlàyé síwájú sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Gbogbo àwọn wọ̀nyí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka οὗτοι àti ìtumọ̀ gbogbo-gbòò πάντες mọ́ ní Yorùbá àdánidá.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: ń fi ara wọn fún ... nígbà gbogbo
  rationale: Àkójọpọ̀ ọ̀rọ̀-ìṣe àìpé àti ọ̀rọ̀-ìṣe aláìlẹ́gbẹ̀ fi ìṣe tí ó ń bá a lọ àti ìforítì hàn; gbólóhùn Yorùbá yìí mú àwọn méjèèjì jáde.
- source_word: ὁμοθυμαδόν
  choice: pẹ̀lú èrò kan náà
  rationale: Ó tẹnu mọ́ ìṣọ̀kan ète àti ọkàn, kì í ṣe pé wọ́n kàn wà ní ibi kan ṣoṣo.
- source_word: τῇ προσευχῇ
  choice: fún àdúrà
  rationale: Pẹ̀lú προσκαρτερέω, dátífù náà jẹ́ ohun tí wọ́n fi ara wọn fún; àtúmọ̀ yìí jẹ́ Yorùbá àdánidá.
- source_word: σὺν γυναιξίν
  choice: papọ̀ pẹlu àwọn obìnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé àpilẹ̀kọ kò sí nínú Gíríìkì, ‘àwọn obìnrin’ bá Yorùbá mu, ó sì lè tọ́ka sí ẹgbẹ́ obìnrin tí a mọ̀ ní àyíká ọ̀rọ̀.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Màríà ìyá Jésù
  rationale: Ó lo orúkọ tí ó wọ́pọ̀ ní Yorùbá, ó sì tú ìsọ̀rí àfikún náà ní tààràtà.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: àti àwọn arákùnrin rẹ̀
  rationale: ἀδελφοί jẹ́ ọ̀pọ̀ akọ, ‘àwọn arákùnrin rẹ̀’ sì pa ìtumọ̀ ojú-ọ̀rọ̀ mọ́ láì pinnu irú ìbátan pàtó tí ẹsẹ̀ náà kò ṣàlàyé.
theological_decisions:
- issue: Ìtọ́kasí ἀδελφοί Jésù
  choice: àwọn arákùnrin rẹ̀
  alternative: àwọn ìbátan rẹ̀ tàbí àwọn ọmọ ìyá rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì sábà máa ń túmọ̀ sí ‘arákùnrin,’ ṣùgbọ́n ẹsẹ̀ yìí kò sọ bóyá wọ́n jẹ́ arákùnrin nípa ẹ̀jẹ̀, ọmọ ìyá tàbí bàbá mìíràn, tàbí ìbátan tímọ́tímọ́. Àtúmọ̀ náà kò yan ìpinnu ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Àtúmọ̀ náà pa ìṣe tí ó ń bá a lọ, ìforítì nínú àdúrà, àti ìṣọ̀kan ète mọ́.
