  to: Gbogbo àwọn wọ̀nyí ń dúró ṣinṣin nínú àdúrà pẹ̀lú ọkàn kan[a], pẹ̀lú àwọn obìnrin[b], Màríà, ìyá Jésù, àti pẹ̀lú àwọn arákùnrin rẹ̀[c].
