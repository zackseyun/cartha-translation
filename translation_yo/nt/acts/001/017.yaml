source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: yo
  text: Nítorí a ti kà á mọ́ wa, ó sì gba ìpín nínú iṣẹ́ ìránṣẹ́ yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì gba kèké—ìpín tí a yàn fún un—nínú iṣẹ́ ìránṣẹ́ yìí.” Ọ̀rọ̀ Gíríìkì κλῆρος lè túmọ̀ sí “kèké” tàbí “ìpín tí a pín tàbí yàn fún ẹni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ní agbára ìdí tàbí àlàyé ní àyíká yìí; “Nítorí” so ẹsẹ̀ náà mọ́ ìdí tí Peteru ń sọ̀rọ̀ nípa Júdásì.
- source_word: κατηριθμημένος ἦν
  choice: a ti ka a
  rationale: 'Ìtumọ̀ yìí pa ìṣe aláìṣe àti ipò tí ó ti wà tẹ́lẹ̀ mọ́: Júdásì jẹ́ ẹni tí a ti kà sí ara ẹgbẹ́ náà.'
- source_word: ἐν ἡμῖν
  choice: mọ́ wa
  rationale: “Ka a mọ́ wa” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ó wà lára iye wọn, kì í ṣe pé ó kàn wà lẹ́gbẹ̀ẹ́ wọn.
- source_word: ἔλαχεν
  choice: gba
  rationale: λαγχάνω lè túmọ̀ sí gbígba ohun tí a pín tàbí tí a yàn fún ẹni; “gba” jẹ́ èdè àdánidá, nígbà tí “ìpín” ń pa ìtumọ̀ pípín mọ́.
- source_word: τὸν κλῆρον
  choice: ìpín
  rationale: κλῆρος lè jẹ́ kèké tí a fi ń yan ẹni tàbí ìpín tí ó dé bá ẹni. “Ìpín” bá àyíká iṣẹ́ ìránṣẹ́ mu, ó sì yẹra fún fífi dandan sọ pé wọ́n ṣẹ̀ṣẹ̀ ṣẹ kèké níbi yìí.
- source_word: τῆς διακονίας ταύτης
  choice: nínú iṣẹ́ ìránṣẹ́ yìí
  rationale: διακονία níbí tọ́ka sí iṣẹ́ tí àwọn aposteli ń ṣe. “Iṣẹ́ ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní iyì.
theological_decisions:
- issue: Ìbáṣepọ̀ Júdásì pẹ̀lú ipò àti iṣẹ́ àwọn aposteli
  choice: Ẹsẹ̀ náà sọ pé a ka Júdásì mọ́ àwọn aposteli, ó sì ní ìpín gidi nínú iṣẹ́ wọn.
  alternative: A lè sọ ọ́ ní ọ̀nà tí ó rọrùn sí i bí ẹni pé ó kàn bá ẹgbẹ́ náà rìn láìjẹ́ ọmọ ẹgbẹ́ gidi.
  rationale: κατηριθμημένος ἦν ἐν ἡμῖν àti ἔλαχεν τὸν κλῆρον fi ìkópa gidi hàn. A kò fi èyí sọ pé Ọlọ́run fọwọ́ sí gbogbo ìṣe rẹ̀ tàbí pé ó dúró ṣinṣin títí dé òpin; a fi ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà jẹ́ àdánidá, ó ní iyì, ó sì pa ìtumọ̀ pé Júdásì jẹ́ ara ẹgbẹ́ náà àti pé ó ní ìpín nínú iṣẹ́ wọn mọ́.
