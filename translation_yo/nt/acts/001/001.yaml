id: ACT.1.1
reference: Acts 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: yo
  text: Nípa ìtàn àkọ́kọ́ náà[a], Teofilu, mo kọ̀wé nípa gbogbo ohun tí Jesu bẹ̀rẹ̀ sí í ṣe àti sí í kọ́ni,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtàn ìṣáájú” tàbí “ìwé àkọ́kọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Nínú ìtàn àkọ́kọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, λόγος ń tọ́ka sí àkọsílẹ̀ tàbí ìtàn tí a kọ, kì í ṣe ‘ọ̀rọ̀’ kan ṣoṣo. ‘Ìtàn àkọ́kọ́’ jẹ́ Yorùbá àdánidá, ó sì pa agbára πρῶτον mọ́; [a] fi àwọn ìtumọ̀ mìíràn tó ṣeé ṣe hàn.
- source_word: ἐποιησάμην
  choice: mo kọ̀wé
  rationale: Pẹ̀lú λόγος, ọ̀rọ̀ náà túmọ̀ sí kíkọ tàbí ṣíṣe àkójọpọ̀ iṣẹ́ ìkọ̀wé; ‘mo kọ̀wé’ ló ṣe kedere jù ní Yorùbá.
- source_word: περὶ πάντων
  choice: nípa gbogbo ohun
  rationale: περί pẹ̀lú genitive ń fi kókó tí a ń sọ̀rọ̀ nípa rẹ̀ hàn. Àyọkà yìí so ọ̀rọ̀ náà mọ́ gbólóhùn ìbátan tó tẹ̀ lé láì sọ pé àkọsílẹ̀ náà parí gbogbo kúlẹ̀kúlẹ̀.
- source_word: ὦ Θεόφιλε
  choice: ìwọ Teofilu
  rationale: ὦ jẹ́ àmì ìpè tààrà. ‘Ìwọ Teofilu’ mú ìpè náà hàn ní Yorùbá láì fi ìfẹ́ni tí kò sí nínú Giriki kún un.
- source_word: ὧν
  choice: ohun tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan náà tọ́ka padà sí πάντων; ‘gbogbo ohun tí’ ni ìhun Yorùbá tó bójú mu.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀
  rationale: Èyí pa ìtumọ̀ ‘bẹ̀rẹ̀’ mọ́, ó sì jẹ́ kí ìmọ̀ràn pé iṣẹ́ Jesu ń bá a lọ dúró láì sọ ọ́ di mímọ́ ju bí orísun ṣe sọ lọ.
- source_word: ὁ Ἰησοῦς
  choice: Jesu
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: sí ṣe àti láti kọ́ni
  rationale: Ìhun yìí pa ìbáṣepọ̀ τε καί mọ́, ó sì yà àwọn iṣẹ́ Jesu àti ẹ̀kọ́ rẹ̀ sọ́tọ̀ ní ọ̀nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἤρξατο (‘bẹ̀rẹ̀’) nípa bí iṣẹ́ Jesu ṣe lè máa bá a lọ nínú Ìṣe Àwọn Aposteli
  choice: Pa ‘bẹ̀rẹ̀’ mọ́ nínú àyọkà láì ṣàlàyé bí iṣẹ́ náà ṣe ń bá a lọ.
  alternative: Túmọ̀ ọ́ sí ‘gbogbo ohun tí Jesu ṣe tí ó sì kọ́ni’ tàbí sọ ní kedere pé ó ń bá iṣẹ́ náà lọ nípasẹ̀ àwọn aposteli.
  rationale: Giriki sọ ‘bẹ̀rẹ̀’ ní tààrà. Ó lè túmọ̀ sí pé Ìṣe Àwọn Aposteli ń sọ bí iṣẹ́ Jesu ṣe ń bá a lọ, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ yanjú ìdíjú ẹ̀kọ́ ìgbàgbọ́ náà nípasẹ̀ àlàyé àfikún.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó bójú mu fún ìwé mímọ́, ó sì ṣeé yé fún òǹkàwé òde òní. A lo ‘Teofilu’ gẹ́gẹ́ bí ìkọ̀wé orúkọ náà ní Yorùbá.
