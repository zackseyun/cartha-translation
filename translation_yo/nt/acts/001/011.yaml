revisions:
- from: Àwọn náà sì wí pé, “Ẹ̀yin ọkùnrin ará Gálílì, èé ṣe tí ẹ fi dúró, tí ẹ ń wo ojú ọ̀run? Jésù yìí[a], ẹni tí a gbé sókè kúrò lọ́dọ̀ yín lọ sí ọ̀run, yóò padà wá lọ́nà kan náà tí ẹ ti rí i tí ó ń lọ sí ọ̀run.”
  to: Àwọn náà sì wí pé, “Ẹ̀yin ọkùnrin ará Gálílì, èé ṣe tí ẹ fi dúró, tí ẹ ń wo ojú ọ̀run? Jésù yìí[a], ẹni tí a gbé sókè kúrò lọ́dọ̀ yín sí ọ̀run, yóò wá lọ́nà kan náà tí ẹ rí i tí ó ń lọ sí ọ̀run.”
  rationale: Àtúnṣe náà yọ ìmúgbòòrò “padà” kúrò kí ìtumọ̀ “yóò wá” lè tẹ̀lé ἐλεύσεται ní tààrà. Ó tún yọ “lọ” tó tún wáyé kúrò nínú gbólóhùn ìgbé-sókè, láìyí ìtumọ̀ ẹsẹ̀ náà padà. Àlàyé ìsàlẹ̀ ni a dá sílẹ̀ nítorí ó ṣàfihàn àṣàyàn ìbílẹ̀ láìfi ìtumọ̀ rẹ̀ kún ọ̀rọ̀ pàtàkì.
