id: ACT.1.11
reference: Acts 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: yo
  text: Àwọn náà sì wí pé, “Ẹ̀yin ọkùnrin ará Gálílì, èé ṣe tí ẹ fi dúró, tí ẹ ń wo ojú ọ̀run? Jésù yìí[a], ẹni tí a gbé sókè kúrò lọ́dọ̀ yín sí ọ̀run, yóò wá lọ́nà kan náà tí ẹ rí i tí ó ń lọ sí ọ̀run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù yìí kan náà.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “Jésù yìí”; fífi “kan náà” kún un ń tẹnu mọ́ pé òun náà ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Ẹ̀yin ọkùnrin ará Gálílì
  rationale: Ó pa ìpè tààrà sí àwọn ọkùnrin mọ́, ó sì sọ ìbílẹ̀ wọn ní Yorùbá àdánidá.
- source_word: τί ἑστήκατε βλέποντες
  choice: èé ṣe tí ẹ fi dúró, tí ẹ ń wo
  rationale: “Dúró” fi ipò tí perfect ἑστήκατε ń tọ́ka sí hàn, “tí ẹ ń wo” sì pa iṣẹ́ tí participle βλέποντες ń ṣàpèjúwe mọ́ láìfi agbára “tẹjú mọ́” kún un.
- source_word: εἰς τὸν οὐρανόν
  choice: ojú ọ̀run / sí ọ̀run
  rationale: Ní ìbéèrè náà, “wo ojú ọ̀run” jẹ́ àdánidá fún ìdarí ojú; ní ìlọsíwájú àti ìgòkè, “sí ọ̀run” bá àyíká ìgòkè Jésù mu.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Jésù yìí
  rationale: Ó túmọ̀ demonstrative οὗτος ní tààrà, láìfi ọ̀rọ̀ tó túmọ̀ sí “kan náà” kún ọ̀rọ̀ Gíríìkì.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: ẹni tí a gbé sókè kúrò lọ́dọ̀ yín
  rationale: “A gbé sókè” pa passive àti ìdarí òkè ti ἀναλαμβάνω mọ́; “kúrò lọ́dọ̀ yín” sọ ìyapa kúrò níwájú àwọn ọmọ-ẹ̀yìn ní Yorùbá àdánidá.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: yóò padà wá lọ́nà kan náà tí
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ni pé yóò wá ní irú ọ̀nà tí wọ́n rí i lọ; “padà wá” jẹ́ Yorùbá àdánidá fún wíwá ẹni tí ó ti lọ, kì í sì í pinnu ju ìpadà tí àyíká sọ lọ.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: ẹ ti rí i tí ó ń lọ
  rationale: Ó pa ìríran àwọn ẹlẹ́rìí àti ìṣe tí ń lọ lọ́wọ́ mọ́ ní èdè tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú àyíká ìgòkè àti ìpadà Jésù
  choice: ọ̀run
  alternative: ojú sánmà
  rationale: Bí οὐρανός tilẹ̀ lè túmọ̀ sí ojú sánmà, àyíká ìgòkè Jésù àti ìlérí pé yóò tún wá ṣe àtìlẹ́yìn fún “ọ̀run,” láìfikún ẹ̀kọ́ tí ẹsẹ̀ náà kò sọ.
- issue: Bóyá a ó túmọ̀ οὗτος ὁ Ἰησοῦς sí “Jésù yìí” tàbí “Jésù yìí kan náà”
  choice: Jésù yìí
  alternative: Jésù yìí kan náà
  rationale: Ọ̀rọ̀ Gíríìkì ní demonstrative “yìí” ní kedere, ṣùgbọ́n kò ní ọ̀rọ̀ míì fún “kan náà.” A pa àṣàyàn ìbílẹ̀ mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin” fún ìpè tààrà, “ẹ” fún ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn síbi tí ó yẹ. Gbólóhùn náà tẹ̀lé ìṣètò orísun ní pẹkipẹki, ṣùgbọ́n ó lo àwọn ìsọ̀rọ̀ Yorùbá àdánidá bí “wo ojú ọ̀run” àti “kúrò lọ́dọ̀ yín.”
