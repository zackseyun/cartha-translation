source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: yo
  text: láti gba ipò iṣẹ́ ìránṣẹ́ àti iṣẹ́ àpọ́sítélì yìí[a], èyí tí Júdásì yà kúrò nínú rẹ̀ láti lọ sí ibi tirẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ ìránṣẹ́ àti ipò àpọ́sítélì yìí.”
    reason: lexical_alternative
  - marker: b
    text: “Ibi tirẹ̀” lè túmọ̀ sí ibi tí ó jẹ́ ti Júdásì, tàbí, lọ́nà tí ó lágbára sí i, ibi ìdájọ́ tí ó yẹ fún un.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν τὸν τόπον
  choice: láti gba ipò
  rationale: ‘Gba ipò’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún gbígba ojúṣe tàbí ipò tí ó ṣófo; ‘ipò’ sì mú ìtumọ̀ àpẹẹrẹ τόπος hàn ní àyíká yìí.
- source_word: διακονίας
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ó sọ iṣẹ́ tí a fi lé ẹni lọ́wọ́, ó sì yàgò fún fífi ìtumọ̀ ẹ̀sìn kan pàtó kún ọ̀rọ̀ náà.
- source_word: ἀποστολῆς
  choice: iṣẹ́ àpọ́sítélì
  rationale: Ó tọ́ka sí iṣẹ́ àti ojúṣe àpọ́sítélì, kì í ṣe ìrìn-iṣẹ́ lásán.
- source_word: ἀφ’ ἧς παρέβη
  choice: èyí tí Júdásì yà kúrò nínú rẹ̀
  rationale: ‘Yà kúrò’ mú èrò yíyapa tàbí kíkúrò nínú iṣẹ́ náà hàn láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó lágbára ju Gíríìkì lọ.
- source_word: πορευθῆναι
  choice: láti lọ
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: sí ipò tirẹ̀
  rationale: Ọ̀rọ̀ yìí pa àìdájú inú Gíríìkì mọ́, kò sì pinnu bóyá ibi ikú, ibi ìdájọ́, tàbí ibi tí ó yẹ fún Júdásì ni.
theological_decisions:
- issue: Ìtumọ̀ ‘ipò tirẹ̀’ nípa ibi tí Júdásì lọ
  choice: A pa ọ̀rọ̀ tí kò pinnu rẹ̀ dénú, ‘ipò tirẹ̀,’ mọ́ nínú ẹsẹ̀.
  alternative: Ibojì tàbí ikú; ibi ìdájọ́; tàbí ibi tí ó yẹ fún Júdásì.
  rationale: Gbólóhùn Gíríìkì kò sọ ibi náà ní pàtó. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ fúnra rẹ̀ fi sílẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ipò’ fún τόπος ní ìbẹ̀rẹ̀ àti ní òpin láti pa ìfarawe ọ̀rọ̀ Gíríìkì mọ́; àlàyé àfikún ni a fi sí àlàyé ìsàlẹ̀ dípò kí a yanjú àìdájú náà nínú ẹsẹ̀.
