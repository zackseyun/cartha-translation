  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ tó wà láàárín ìbatisí Jòhánù pẹ̀lú omi àti ìbatisí ọjọ́ iwájú nínú Ẹ̀mí Mímọ́ mọ́, ó sì dá ìṣe ọjọ́ iwájú aláìlórúkọ ti βαπτισθήσεσθε sílẹ̀. Síbẹ̀, “ní ọjọ́ díẹ̀ sí i” kò fi ọ̀rọ̀ ìdínkù οὐ ... πολλὰς (“kì í ṣe ọjọ́ púpọ̀”) hàn ní kedere.
