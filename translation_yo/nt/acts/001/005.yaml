  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: yo
  text: Nítorí Jòhánù fi omi batisí, ṣùgbọ́n a ó batisí yín nínú Ẹ̀mí Mímọ́ láìpẹ́—kò ní pé ọjọ́ púpọ̀ láti ìsinsìnyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “pẹ̀lú Ẹ̀mí Mímọ́.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà lè túmọ̀ sí “nínú” tàbí “pẹ̀lú.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ múlẹ̀; “Nítorí” jẹ́ ọ̀nà àdánidá láti so ó mọ́ ọ̀rọ̀ ṣáájú.
- source_word: ἐβάπτισεν / βαπτισθήσεσθε
  choice: batisí / a ó batisí yín
  rationale: Ọ̀rọ̀ ìsìn tí ó ti fìdí múlẹ̀ ni “batisí”; ó pa ìsopọ̀ ọ̀rọ̀-ìṣe méjèèjì mọ́, kò sì pinnu ọ̀nà tí a gbà ṣe ìbatisí. “A ó batisí yín” tún pa ìṣe aláìlórúkọ ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὕδατι
  choice: fi omi
  rationale: Àmì ohun èlò nínú dative náà fara hàn dáadáa pẹ̀lú “fi omi,” èyí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: “Nínú” ń pa ìtumọ̀ ibi tàbí àyíká ti ἐν mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi ìtumọ̀ ohun èlò mìíràn hàn. “Ẹ̀mí Mímọ́” jẹ́ orúkọ pàtó tí ó bójú mu ní àyíká yìí.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: ní ọjọ́ díẹ̀ sí i
  rationale: 'Èyí sọ ìtumọ̀ àkókò náà ní Yorùbá òde òní tó ṣe kedere: kò ní pé ọjọ́ púpọ̀ láti ìsinsìnyí.'
theological_decisions:
- issue: Ìtumọ̀ ἐν nínú gbólóhùn ìbatisí Ẹ̀mí Mímọ́
  choice: nínú Ẹ̀mí Mímọ́
  alternative: pẹ̀lú Ẹ̀mí Mímọ́ / nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: ἐν lè tọ́ka sí àyíká tí ìṣe náà ti ṣẹlẹ̀ tàbí ohun èlò tí a fi ṣe é. Ọ̀rọ̀ inú ẹsẹ̀ náà lo “nínú” láti pa ìṣòro ìtumọ̀ Gíríìkì mọ́, àlàyé ìsàlẹ̀ ojú ewé sì tọ́ka sí ìtumọ̀ kejì láìfi ẹ̀kọ́ ìsìn kan múlẹ̀.
translation_notes:
  register: Yorùbá ìwọ̀nṣe, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “batisí” dípò “rì bọ inú omi” kí a má bàa pinnu ọ̀nà ìbatisí ju ohun tí Gíríìkì sọ lọ.
