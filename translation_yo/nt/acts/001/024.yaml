id: ACT.1.24
reference: Acts 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n gbàdúrà, wọ́n ní, “Ìwọ, Olúwa, ẹni tí ó mọ ọkàn gbogbo ènìyàn, fi ẹni tí ìwọ ti yàn láàárín àwọn méjèèjì yìí hàn[a],”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “yan sí ipò” tàbí “tọ́ka sí”; ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi ẹni kan hàn tàbí yíyan ẹni náà ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: A lè lóye pé Ọlọ́run ni wọ́n ń pè ní “Olúwa” lápapọ̀, tàbí pé Jésù ni wọ́n ń pè ní pàtó; Gíríìkì kò sọ ẹni tí wọ́n ń tọ́ka sí ní kedere níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: Lẹ́yìn tí wọ́n sì gbàdúrà
  rationale: Aorist participle náà tọ́ka sí ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: Σὺ κύριε
  choice: Ìwọ, Olúwa
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ Σὺ ní ìtẹnumọ́; “Ìwọ, Olúwa” pa ìtẹnumọ́ àti ìpè tààrà mọ́.
- source_word: καρδιογνῶστα πάντων
  choice: ẹni tí ó mọ ọkàn gbogbo ènìyàn
  rationale: Èyí tú ìtumọ̀ orúkọ àkópọ̀ καρδιογνώστης jáde ní Yorùbá tó ṣe kedere, ó sì pa πάντων mọ́ gẹ́gẹ́ bí “gbogbo ènìyàn.”
- source_word: ἀνάδειξον
  choice: fi ... hàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà béèrè pé kí Olúwa jẹ́ kí ẹni tí ó ti yàn di mímọ̀; “fi hàn” kò fi dandan túmọ̀ rẹ̀ sí ìyàn sí ipò ní gbangba.
- source_word: ὃν ἐξελέξω
  choice: ẹni tí ìwọ ti yàn
  rationale: Middle verb náà tọ́ka sí ẹni tí Olúwa fúnra rẹ̀ ti yàn tẹ́lẹ̀; “ti yàn” fi ìṣe tó ti ṣẹlẹ̀ tí ó sì ṣe pàtàkì báyìí hàn.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: ẹni ... nínú àwọn méjèèjì yìí
  rationale: Èyí fi hàn pé ẹni kan ni a óò dá mọ̀ lára àwọn olùdíje méjì, láìfi “ọkùnrin” kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ẹni tí wọ́n ń pè ní “Olúwa” nínú àdúrà náà
  choice: A fi “Olúwa” sílẹ̀ láìsọ bóyá Ọlọ́run Bàbá tàbí Jésù ni wọ́n ń bá sọ̀rọ̀.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí Ọlọ́run lápapọ̀, tàbí ní pàtó gẹ́gẹ́ bí Jésù tó jíǹde.
  rationale: Gíríìkì sọ pé “Ìwọ, Olúwa” nìkan; kò dá ẹni tí àdúrà náà ń tọ́ka sí mọ́ ní kedere, nítorí náà ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan ọ̀rọ̀ àdánidá láìsọ àìdánilójú inú Gíríìkì di ohun tó dájú.
