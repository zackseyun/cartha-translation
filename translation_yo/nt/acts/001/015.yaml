id: ACT.1.15
reference: Acts 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, Peteru dìde láàárín àwọn ará[a], ó sì sọ pé (àwọn ènìyàn tí ó péjọ pọ̀ sì tó bí ọgọ́fà).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí “àwọn arákùnrin,” ṣùgbọ́n níbí ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ọ̀rọ̀ yìí fi ìṣe Peteru hàn ní kedere bí ó ṣe dìde láti bá àwùjọ sọ̀rọ̀.
- source_word: ἐν μέσῳ
  choice: láàárín
  rationale: “Láàárín” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Peteru wà ní àárín àwùjọ náà.
- source_word: ἀδελφῶν
  choice: àwọn ará
  rationale: “Àwọn ará” bá ìtumọ̀ àwọn ọmọ ìdílé tàbí àwọn onígbàgbọ́ ẹlẹgbẹ́ mu, ó sì lè tọ́ka sí ọkùnrin àti obìnrin ní Yorùbá láìfi akọ tàbí abo kún un.
- source_word: ὄχλος ὀνομάτων
  choice: àwọn ènìyàn
  rationale: Gbólóhùn Gíríìkì náà, ní ti gidi “àwùjọ àwọn orúkọ,” jẹ́ ọ̀rọ̀ àpèjúwe fún àwùjọ àwọn ènìyàn; “àwọn ènìyàn” mú ìtumọ̀ rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: ἐπὶ τὸ αὐτό
  choice: tí ó péjọ pọ̀
  rationale: Ó fi hàn pé àwọn ènìyàn náà kóra jọ sí àwùjọ kan.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: bí ọgọ́fà
  rationale: “Bí” pa ìsúnmọ́ iye tí ὡς ní mọ́, “ọgọ́fà” sì ni ọ̀nà Yorùbá àdánidá fún ọgọ́fà, ìyẹn 120.
theological_decisions:
- issue: Bóyá ἀδελφῶν tọ́ka sí àwọn ọkùnrin nìkan tàbí sí gbogbo àwọn onígbàgbọ́ tí ó péjọ
  choice: àwọn ará
  alternative: àwọn arákùnrin
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n ní àyíká yìí ó lè ní gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin, nínú. “Àwọn ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu láìyanjú àìdánilójú ọ̀rọ̀ náà lọ́nà ẹ̀kọ́ ìsìn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu fún kíkà ní gbangba. “Àwọn ará” jẹ́ ọ̀rọ̀ àdánidá, ọlọ́lá, tí kò fi akọ tàbí abo pàtó hàn; “ọgọ́fà” sì jẹ́ ìṣírò Yorùbá tí a mọ̀ fún 120.
