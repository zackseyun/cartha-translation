language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: yo
  text: Nígbà tí ó sì wà pẹ̀lú wọn,[a] ó pàṣẹ fún wọn pé kí wọn má ṣe kúrò ní Jerusalẹmu, ṣùgbọ́n kí wọn dúró de ìlérí Baba, èyí tí ẹ̀yin gbọ́ láti ọ̀dọ̀ mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà tí ó ń péjọ pẹ̀lú wọn”; àwọn kan lóye gbólóhùn náà sí “nígbà tí ó ń jẹun pẹ̀lú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: nígbà tí ó sì wà pẹ̀lú wọn
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣòro ní ti ìtumọ̀ rẹ̀. Ìtumọ̀ yìí sọ ohun tí ó dájú nínú àyíká ọ̀rọ̀ náà—pé Jesu wà papọ̀ pẹ̀lú àwọn aposteli—láì fi dandan sọ pé ó ń jẹun tàbí pé ó ń pe ìpàdé.
- source_word: παρήγγειλεν
  choice: ó pàṣẹ fún wọn
  rationale: ‘Pàṣẹ’ pa agbára àṣẹ tí ọ̀rọ̀ Gíríìkì náà ní mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: kí wọn má ṣe kúrò ní Jerusalẹmu
  rationale: Gbólóhùn yìí fi hàn pé wọn kò gbọ́dọ̀ fi ìlú náà sílẹ̀; ‘kúrò ní’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: περιμένειν
  choice: kí wọn dúró de
  rationale: ‘Dúró de’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún fífi ìrètí dúró de ohun tí ń bọ̀.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: ìlérí Baba
  rationale: Ìtumọ̀ tààrà yìí pa ìsopọ̀ tí ọ̀rọ̀ Gíríìkì fi hàn mọ́, láì fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἣν ἠκούσατέ μου
  choice: èyí tí ẹ̀yin ti gbọ́ láti ọ̀dọ̀ mi
  rationale: ‘Láti ọ̀dọ̀ mi’ ṣe àfihàn genitive pronoun náà lọ́nà tó ṣe kedere, ó sì pa ọ̀rọ̀ Jesu mọ́ ní ẹni àkọ́kọ́.
theological_decisions:
- issue: Ìtumọ̀ συναλιζόμενος nípa ohun tí Jesu ń ṣe lẹ́yìn àjíǹde rẹ̀
  choice: A túmọ̀ rẹ̀ ní gbogbogbòò pé Jesu ‘wà pẹ̀lú wọn.’
  alternative: ‘Ó ń péjọ pẹ̀lú wọn’ tàbí ‘ó ń jẹun pẹ̀lú wọn.’
  rationale: Ọ̀rọ̀ náà kò dá lórí ìtumọ̀ pàtó kan ṣoṣo. Yíyan ọ̀rọ̀ gbogbogbòò yìí kò fi èrò ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ náà lórí, ó sì jẹ́ kí àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí àwọn ìtumọ̀ míì.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti fi hàn pé ọ̀pọ̀ ènìyàn ni Jesu ń bá sọ̀rọ̀, a sì pa ọ̀rọ̀ rẹ̀ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tààrà.
