id: ACT.1.2
reference: Acts 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: yo
  text: títí dé ọjọ́ tí a gbé e sókè, lẹ́yìn tí ó ti pàṣẹ nípasẹ̀ Ẹ̀mí Mímọ́ fún àwọn àpọ́sítélì tí ó yàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè túmọ̀ ọ̀rọ̀ Gíríìkì náà sí “nípasẹ̀ Ẹ̀mí Mímọ́” tàbí “pẹ̀lú Ẹ̀mí Mímọ́”; ó ń fi ọ̀nà tàbí agbára tí Jésù fi pàṣẹ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: títí dé ọjọ́ tí
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi òpin àkókò tí ọ̀rọ̀ náà dé hàn.
- source_word: ἐντειλάμενος
  choice: lẹ́yìn tí ó ti pàṣẹ
  rationale: Ó fi hàn pé pípàṣẹ náà ti ṣẹlẹ̀ ṣáájú gbígbé Jésù sókè, ó sì pa agbára ìtumọ̀ ‘pàṣẹ’ mọ́ ju ‘kọ́ni’ lọ.
- source_word: τοῖς ἀποστόλοις
  choice: fún àwọn àpọ́sítélì
  rationale: ‘Àpọ́sítélì’ ni ọ̀rọ̀ tí a ti mọ̀, tí ó sì bá ẹgbẹ́ àwọn tí Jésù rán mu nínú Lúùkù–Ìṣe.
- source_word: διὰ πνεύματος ἁγίου
  choice: nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: ‘Nípasẹ̀’ lè fi ọ̀nà tàbí aṣojú hàn láì fi ìtumọ̀ kan ṣoṣo lé gbolohun Gíríìkì náà lórí.
- source_word: οὓς ἐξελέξατο
  choice: tí ó yàn
  rationale: Ó dá ìṣe yíyan àwọn àpọ́sítélì sí Jésù, bí gbólóhùn ìbátan Gíríìkì náà ti ṣe.
- source_word: ἀνελήμφθη
  choice: a gbé e sókè
  rationale: Èyí pa ohùn àìṣe Gíríìkì mọ́, kò sì fi ‘sí ọ̀run’ kún ẹsẹ yìí níbi tí orísun kò ti sọ ọ́ ní tààrà.
theological_decisions:
- issue: Ìbáṣepọ̀ àṣẹ Jésù pẹ̀lú Ẹ̀mí Mímọ́
  choice: Jésù pàṣẹ fún àwọn àpọ́sítélì nípasẹ̀ Ẹ̀mí Mímọ́ kí a tó gbé e sókè.
  alternative: Jésù pàṣẹ fún àwọn àpọ́sítélì, Ẹ̀mí Mímọ́ sì ni aṣojú tàbí ọ̀nà ìpàṣẹ náà.
  rationale: A so ‘nípasẹ̀ Ẹ̀mí Mímọ́’ mọ́ ‘pàṣẹ’ gẹ́gẹ́ bí ìṣètò ọ̀rọ̀ Gíríìkì ṣe ń tọ́ka sí, ṣùgbọ́n a kò pinnu bóyá ìtẹnumọ́ wà lórí ọ̀nà tàbí aṣojú.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A ṣètò gbólóhùn náà ní ọ̀nà àdánidá fún Yorùbá, a sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ àti àìṣe inú ọ̀rọ̀ Gíríìkì mọ́.
