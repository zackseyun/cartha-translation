source:
  edition: SBLGNT
  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: yo
  text: 'Wọ́n sì mú àwọn méjì wá síwájú[a]: Jósẹ́fù, ẹni tí a ń pè ní Barsábásì, tí a tún ń pè ní Jústù, àti Mátíásì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “wọ́n yan àwọn méjì” tàbí “wọ́n gbé àwọn méjì kalẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú àwọn ènìyàn wá síwájú ẹgbẹ́ kan; ó sì ṣeé ṣe kí ó tọ́ka sí fífi wọn hàn gẹ́gẹ́ bí ẹni tí a lè yàn níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: mú ... wá síwájú
  rationale: Nínú ọ̀rọ̀ yíyan ẹni, gbólóhùn yìí túmọ̀ sí pé wọ́n mú àwọn ọkùnrin náà wá síwájú ẹgbẹ́ gẹ́gẹ́ bí ẹni tí a lè yàn; kò kan túmọ̀ sí mímú wọn dúró ní ti ara.
- source_word: δύο
  choice: àwọn méjì
  rationale: Ó tọ́ka ní tààrà sí àwọn ọkùnrin méjì tí wọ́n mú wá síwájú.
- source_word: καλούμενον
  choice: ẹni tí a ń pè ní
  rationale: Ó fi orúkọ mìíràn tí a fi ń pe Jósẹ́fù hàn ní èdè Yorùbá àdánidá.
- source_word: Βαρσαββᾶν
  choice: Barsábásì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń mú àwọn orúkọ Gíríìkì wọ èdè Yorùbá.
- source_word: ἐπεκλήθη
  choice: tí a tún ń pè ní
  rationale: Ó mú kí ó ṣe kedere pé Jústù jẹ́ orúkọ mìíràn tí a fi ń pe ẹni kan náà, láìfi ìtumọ̀ tuntun kún ọ̀rọ̀ náà.
- source_word: Ἰοῦστος
  choice: Jústù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti àṣà ìkọ̀wé Yorùbá.
- source_word: Μαθθίαν
  choice: Mátíásì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti àṣà ìkọ̀wé Yorùbá.
- source_word: καὶ ... καὶ
  choice: sì ... àti
  rationale: “Sì” so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú, “àti” sì so orúkọ àwọn ẹni méjèèjì pọ̀.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. “Mú ... wá síwájú” pa ìtumọ̀ ìlànà yíyan ẹni mọ́ láìsọ pé wọ́n ti yan wọn sí ipò náà ní ìkẹyìn.
