source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: yo
  text: Bí wọ́n ṣe ń tẹjú mọ́ ọ̀run bí ó ti ń lọ[a], wò ó, ọkùnrin méjì dúró lẹ́gbẹ̀ẹ́ wọn nínú aṣọ funfun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run”; a yan “ọ̀run” nítorí àyíká ìgòkè lọ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nínú aṣọ funfun” tàbí “nínú ẹ̀wù funfun.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí aṣọ lápapọ̀; kò sọ irú aṣọ pàtó kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: ń tẹjú mọ́
  rationale: Ọ̀rọ̀ yìí fi wíwo tí ó dúró ṣinṣin, tí ó sì ní ìfọkànsìn hàn, kì í ṣe wíwo lásán.
- source_word: οὐρανόν
  choice: ọ̀run
  rationale: Ní Yorùbá, “ọ̀run” lè tọ́ka sí ojú ọ̀run tàbí ibùgbé ọ̀run; ó bá àyíká ìgòkè lọ yìí mu, ó sì pa ìtumọ̀ méjèèjì mọ́ dé ìwọ̀n kan.
- source_word: πορευομένου αὐτοῦ
  choice: nígbà tí ó ń lọ
  rationale: Ó pa ìṣe méjì tí ń ṣẹlẹ̀ ní àkókò kan náà mọ́, láìfi ibi tí ó ń lọ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἰδοὺ
  choice: sì kíyè sí i
  rationale: Ó fa àfiyèsí sí ohun tí ó tẹ̀ lé e ní ọ̀nà tí ó bójú mu nínú Yorùbá òde òní, láìfi ìtumọ̀ “lójijì” kún un.
- source_word: ἄνδρες δύο
  choice: ọkùnrin méjì
  rationale: ἀνήρ túmọ̀ sí ọkùnrin ní pàtó níbí; a kò pe wọ́n ní áńgẹ́lì nítorí ẹsẹ yìí fúnra rẹ̀ kò sọ bẹ́ẹ̀.
- source_word: παρειστήκεισαν
  choice: dúró lẹ́gbẹ̀ẹ́ wọn
  rationale: Ó sọ pé àwọn ọkùnrin náà wà ní ẹ̀gbẹ́ wọn; kò fi ìfarahàn àràmàǹdà tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἐσθήσεσι λευκαῖς
  choice: nínú aṣọ funfun
  rationale: ἐσθής jẹ́ ọ̀rọ̀ gbòòrò fún aṣọ; ìtumọ̀ yìí kò sọ irú aṣọ pàtó kan tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú àyíká ìgòkè lọ
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: “Ọ̀run” bá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú àyíká náà mu, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ “ojú ọ̀run” hàn kí a má bàa pa àìdánilójú ọ̀rọ̀ Gíríìkì rẹ́.
- issue: Ta ni ọkùnrin méjì náà
  choice: ọkùnrin méjì
  alternative: áńgẹ́lì méjì
  rationale: Ẹsẹ náà pè wọ́n ní ọkùnrin méjì, kò sì sọ ní tààrà pé áńgẹ́lì ni wọ́n; a fi ìdánimọ̀ tí àyíká lè mú wá sílẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ń tẹjú mọ́” fún wíwo pẹ̀lú ìfọkànsìn, “sì kíyè sí i” gẹ́gẹ́ bí àmì àfiyèsí ìtàn, a sì yẹra fún fífi áńgẹ́lì tàbí ìfarahàn àràmàǹdà sínú ọ̀rọ̀ tí Gíríìkì kò sọ ní tààrà.
