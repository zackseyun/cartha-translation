translation_notes:
  register: Yorùbá Àfẹnusọ boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A kọ Akeldamaki ní ọ̀nà tó bá ìró Gíríìkì Ἁκελδαμάχ mu díẹ̀, dípò fífi àṣà akọtọ̀ Gẹ̀ẹ́sì wọ Yorùbá.
