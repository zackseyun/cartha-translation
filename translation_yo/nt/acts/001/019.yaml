  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: yo
  text: Èyí sì di mímọ̀ fún gbogbo àwọn tí ń gbé ní Jerúsálẹ́mù, tó fi jẹ́ pé wọ́n pe pápá náà, ní èdè tiwọn, ní Hakeldamaki[a], èyí ni, Pápá Ẹ̀jẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orúkọ yìí ni a sábà máa ń kọ sí “Akeldama” nínú ọ̀pọ̀ ìtumọ̀. Ìrísí Gíríìkì nínú ẹsẹ yìí ni Ἁκελδαμάχ.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní ẹ̀ka èdè tiwọn.” Ọ̀rọ̀ Gíríìkì διάλεκτος lè tọ́ka sí ẹ̀ka èdè agbègbè kan tàbí sí èdè ní ìtumọ̀ tó gbòòrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: Ọ̀rọ̀ yìí sì di mímọ̀
  rationale: Ìtumọ̀ yìí mú ìṣètò aláìlẹ́ni Gíríìkì jáde ní Yorùbá àdánidá, ó sì fi hàn pé ohun tí a ṣẹ̀ṣẹ̀ sọ di ohun tí gbogbo ènìyàn mọ̀.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: fún gbogbo àwọn tí ń gbé ní Jerúsálẹ́mù
  rationale: Ó pa ìtumọ̀ participle κατοικοῦσιν mọ́ gẹ́gẹ́ bí àwọn olùgbé ibẹ̀, ní èdè Yorùbá tó ṣe kedere.
- source_word: ὥστε
  choice: tó bẹ́ẹ̀ tí ... fi
  rationale: Àpẹẹrẹ Yorùbá yìí ń tọ́ka sí àbájáde, bí ὥστε ṣe rí nínú gbólóhùn náà, kì í ṣe ìparí èrò lásán.
- source_word: κληθῆναι
  choice: wọ́n pe
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo passive, ìlò aláìsọ ẹni pàtó ‘wọ́n pe’ jẹ́ àdánidá ní Yorùbá, kò sì sọ àwọn tó fún un ní orúkọ di ẹni pàtó.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ilẹ̀ náà
  rationale: χωρίον lè túmọ̀ sí ilẹ̀ kan tàbí pápá; ‘ilẹ̀ náà’ bá àyíká mu, ó sì yàtọ̀ sí àlàyé orúkọ ibẹ̀, ‘Pápá Ẹ̀jẹ̀.’
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: ní èdè tiwọn
  rationale: διάλεκτος lè jẹ́ èdè tàbí ẹ̀ka èdè. ‘Èdè tiwọn’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, ó sì pa àìdánilójú náà mọ́ pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
- source_word: Ἁκελδαμάχ
  choice: Akeldamaki
  rationale: A ṣe àkọsílẹ̀ ohùn orúkọ Gíríìkì náà ní ọ̀nà tó ṣeé pè ní Yorùbá, pẹ̀lú kọ́ńsónántì ìkẹyìn χ.
- source_word: τοῦτ’ ἔστιν
  choice: èyíinì ni
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti mú àlàyé tàbí ìtumọ̀ orúkọ wọlé.
- source_word: Χωρίον Αἵματος
  choice: Pápá Ẹ̀jẹ̀
  rationale: Ó pa ìtumọ̀ gangan ti àlàyé Gíríìkì mọ́, ó sì dá a sílẹ̀ gẹ́gẹ́ bí orúkọ ibi.
