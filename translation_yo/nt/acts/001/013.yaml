id: ACT.1.13
reference: Acts 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: yo
  text: 'Nígbà tí wọ́n sì wọlé, wọ́n gòkè lọ sí yàrá òkè, níbi tí wọ́n ń gbé. Àwọn tí wọ́n ń gbé níbẹ̀ ni wọ̀nyí: Peteru, Johanu, Jakọbu àti Anderu; Filippu àti Tomasi; Bartolomeu àti Matteu; Jakọbu ọmọ Alfeu, Simoni Olùtara, àti Judasi ọmọ Jakọbu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Judasi arákùnrin Jakọbu.” Gíríìkì sọ pé “Judasi ti Jakọbu” nìkan, kò sì sọ irú ìbátan wọn ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: wọ́n wọlé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n wọ inú ibi náà; nínú gbólóhùn àkókò Yorùbá, “Nígbà tí wọ́n wọlé” fi ìṣe tó ṣáájú gígun wọn sókè hàn lọ́nà àdánidá.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: wọ́n gòkè lọ sí yàrá òkè
  rationale: “Gòkè lọ” pa ìṣísẹ̀ sókè mọ́, “sí yàrá òkè” sì fi ibi tí wọ́n ń lọ hàn kedere.
- source_word: ὑπερῷον
  choice: yàrá òkè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún yàrá tó wà ní òkè ilé, láìfi ìtumọ̀ ẹ̀sìn àfikún sí i.
- source_word: οὗ ἦσαν καταμένοντες
  choice: tí wọ́n ń gbé
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí dídúró tàbí gbígbé níbẹ̀ fún àkókò kan; “ń gbé” mú ìṣe tó ń bá a lọ yẹn jáde ní Yorùbá.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας
  choice: Àwọn tó wà níbẹ̀ ni Peteru, Johanu, Jakọbu àti Anderu
  rationale: Ọ̀nà yìí ṣàfihàn pé orúkọ àwọn tó ń gbé níbẹ̀ ló tẹ̀ lé e, ó sì jẹ́ àdánidá ju lílo “àti” ṣáájú gbogbo orúkọ lọ.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Jakọbu ọmọ Alfeu
  rationale: Ẹ̀yà oníhun náà dára jù lọ gẹ́gẹ́ bí orúkọ baba nínú àkójọ àwọn ọkùnrin, Yorùbá sì máa ń sọ ọ́ ní “ọmọ Alfeu.”
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simoni Olùtara
  rationale: ζηλωτής jẹ́ àpèlé tó ń dá Simoni yìí mọ̀; “Olùtara” pa ìtumọ̀ ẹni tó ní ìtara gidigidi mọ́ láìkó àpèlé kan láti inú ẹsẹ̀ mìíràn wọlé.
- source_word: Ἰούδας Ἰακώβου
  choice: Judasi ọmọ Jakọbu
  rationale: Nínú àkójọ irú èyí, ìbátan ọmọ sí baba ni ó ṣeé ṣe jù; síbẹ̀, Gíríìkì kò sọ irú ìbátan náà ní pàtó, nítorí náà a pa àṣàyàn mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìbátan tí Ἰούδας Ἰακώβου ń tọ́ka sí
  choice: Judasi ọmọ Jakọbu
  alternative: Judasi arákùnrin Jakọbu
  rationale: Ẹ̀yà oníhun Gíríìkì nìkan ni ọ̀rọ̀ náà lò, kò sì sọ “ọmọ” tàbí “arákùnrin.” “Ọmọ Jakọbu” ló ṣeé ṣe jù nínú àkójọ tí a ti ń fi orúkọ baba dá àwọn ọkùnrin mọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú inú orísun náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “yàrá òkè” fún ìtumọ̀ ààyè ilé tó ṣe kedere, a sì ṣètò àwọn orúkọ ní àwọn ẹgbẹ́ gẹ́gẹ́ bí ìlù gbólóhùn Gíríìkì ṣe ń fi hàn.
