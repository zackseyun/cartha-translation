  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: yo
  text: Nítorí náà, ọkùnrin yìí gba ilẹ̀ kan láti inú owó-iṣẹ́ àìṣòdodo[a][c]. Nígbà tí ó sì ṣubú forí gbalẹ̀[b], ara rẹ̀ ya ní àárín, gbogbo ìfun rẹ̀ sì tú jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘láti inú ẹ̀san ìwà búburú’ tàbí ‘láti inú owó tí a san fún ìwà àìṣòdodo.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ Gíríìkì náà sí ‘nígbà tí ó wà ní ìdojúbolẹ̀’ tàbí ‘nígbà tí ó ṣubú dojúbolẹ̀.’ Ó ṣeé ṣe kó ń ṣàpèjúwe ìṣubú tí orí ń ṣáájú.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà sọ pé ó ‘gba’ ilẹ̀ kan. Èyí lè túmọ̀ sí pé ilẹ̀ náà di ohun-ìní rẹ̀ nípasẹ̀ owó tí ó ní í ṣe pẹ̀lú Júdásì; kò fi dandan sọ pé òun fúnra rẹ̀ ló lọ rà á.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Nítorí náà, ọkùnrin yìí
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí Júdásì, ó sì ń tẹ ìtàn náà síwájú pẹ̀lú ìtumọ̀ ìyọrísí. ‘Nítorí náà’ mú ipa àsopọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἐκτήσατο
  choice: gba ... fún ara rẹ̀
  rationale: Èyí túmọ̀ sí jíjẹ́ kí ohun kan di ti ẹni tàbí gbígba ohun-ìní. Àṣàyàn yìí kò fi dandan mú un pé Júdásì fúnra rẹ̀ ló ra ilẹ̀ náà.
- source_word: χωρίον
  choice: ilẹ̀ kan
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí pápá tàbí apá ilẹ̀ kan; ‘ilẹ̀ kan’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ibi yìí mu.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: láti inú èrè àìṣòdodo
  rationale: ‘Láti inú’ pa ìtumọ̀ orísun tí ἐκ ní mọ́; ‘èrè’ sì lè jẹ́ owó iṣẹ́, ẹ̀san, tàbí ohun tí ènìyàn rí gbà nítorí ìwà búburú. ‘Àìṣòdodo’ pa àwọ̀ ìwà rere àti ẹ̀sìn inú gbólóhùn Gíríìkì mọ́.
- source_word: πρηνὴς γενόμενος
  choice: ṣubú forí gbalẹ̀
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣubú tí orí ń ṣáájú, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè ṣàpèjúwe jíjẹ́ ní ìdojúbolẹ̀.
- source_word: ἐλάκησεν μέσος
  choice: ara rẹ̀ ya ní àárín
  rationale: λακάω ń sọ fífọ́ tàbí yíyà ṣí, μέσος sì ń tọ́ka sí àárín. Ìtumọ̀ yìí ṣe kedere, ó sì pa àwòrán líle inú ìtàn náà mọ́.
- source_word: ἐξεχύθη
  choice: tú jáde
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ohun inú tí ó dà tàbí tú síta; ‘tú jáde’ jẹ́ Yorùbá tó wọ́pọ̀, tó sì bá ìṣẹ̀lẹ̀ náà mu.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: gbogbo ìfun rẹ̀
  rationale: Ní àyíká yìí, σπλάγχνα ń tọ́ka sí àwọn ẹ̀yà inú, pàápàá ìfun. ‘Gbogbo ìfun rẹ̀’ jẹ́ kedere fún òǹkàwé òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ Júdásì pẹ̀lú gbígba ilẹ̀ náà
  choice: Lo ‘gba ilẹ̀ kan fún ara rẹ̀’ dípò sísọ pé ó ‘ra’ ilẹ̀ náà.
  alternative: Júdásì fúnra rẹ̀ ra ilẹ̀ náà; tàbí àwọn ẹlòmíràn ra ilẹ̀ náà ní orúkọ rẹ̀ pẹ̀lú owó tó ní í ṣe pẹ̀lú rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ilẹ̀ náà di ohun-ìní rẹ̀, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí ìyẹn gbà ṣẹlẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìfọ̀rọ̀wérọ̀ pẹ̀lú Mátíù 27:5–8 láìjẹ́ pé ẹsẹ̀ yìí fúnra rẹ̀ ṣe bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A pa líle àwòrán ìṣẹ̀lẹ̀ náà mọ́ láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
