id: ACT.1.20
reference: Acts 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: yo
  text: Nítorí a ti kọ ọ́ nínú ìwé Sáàmù pé, “Kí ibùgbé rẹ̀ di ahoro,[a] kí ẹnikẹ́ni má sì gbé inú rẹ̀,”[b] àti pé, “Kí ẹlòmíràn gba ipò àbójútó rẹ̀.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ilé rẹ̀ di ahoro.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kí olùgbé kankan má ṣe wà nínú rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: “Ipò àbójútó” túmọ̀ ἐπισκοπή; a tún lè túmọ̀ rẹ̀ sí “iṣẹ́ àbójútó” tàbí “ipò iṣẹ́.” Ọ̀rọ̀ náà kò fi dandan tọ́ka sí oyè ìjọ kan tí a dá sílẹ̀ ní àkókò tó tẹ̀ lé e.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ perfect passive tí a sábà lò láti tọ́ka sí Ìwé Mímọ́; ‘a ti kọ ọ́’ pa ìtumọ̀ ohun tí a kọ sílẹ̀ tí ó sì ṣì dúró mọ́.
- source_word: βίβλῳ ψαλμῶν
  choice: inú ìwé Sáàmù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtọ́kasí sí àkójọpọ̀ Sáàmù mu.
- source_word: Γενηθήτω
  choice: Kí ... di
  rationale: Ó mú agbára aorist imperative jussive jáde ní Yorùbá láì sọ ọ́ di àsọtẹ́lẹ̀ lasan.
- source_word: ἔπαυλις
  choice: ibùgbé
  rationale: ‘Ibùgbé’ túmọ̀ sí ibi tí ènìyàn ń gbé, ó sì gbòòrò tó láti bo habitation tàbí homestead nínú àyọlò yìí.
- source_word: ἔρημος
  choice: ahoro
  rationale: ‘Ahoro’ fi ibi tí a ti kọ̀ sílẹ̀, tí kò sí olùgbé hàn, ó sì pa ìró ọ̀wọ̀ ti ọ̀rọ̀ Ìwé Mímọ́ mọ́.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: kí ẹnikẹ́ni má sì gbé inú rẹ̀
  rationale: Ó jẹ́ Yorùbá àdánidá fún ìfòfin-de pẹ̀lú participle olùgbé, ó sì pa ìtumọ̀ pé kí olùgbé kankan má ṣe wà níbẹ̀ mọ́.
- source_word: ἐπισκοπή
  choice: ipò àbójútó
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ojúṣe tàbí iṣẹ́ àbójútó tí Júdásì ní; gbolohun yìí yẹra fún fífi orúkọ ipò ìjọ ti àkókò tó tẹ̀ lé e sínú ẹsẹ náà.
- source_word: λαβέτω ἕτερος
  choice: Kí ẹlòmíràn gba
  rationale: Ó pa imperative àti èrò pé ẹlòmíràn yóò gba ipò náà mọ́ ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ ἐπισκοπή nípa ipò Júdásì láàárín àwọn aposteli
  choice: ipò àbójútó
  alternative: ipò iṣẹ́; iṣẹ́ alábòójútó
  rationale: ‘Ipò àbójútó’ fi ojúṣe tí a lè fi fún ẹlòmíràn hàn, ṣùgbọ́n kò gbé ètò ìjọ tàbí orúkọ oyè ti ìgbà tó tẹ̀ lé e wọ inú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; àyọlò Sáàmù jẹ́ mímú pẹ̀lú ‘Kí ...’ láti fi agbára jussive hàn.
