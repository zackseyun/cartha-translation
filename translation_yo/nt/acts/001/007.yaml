  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Kì í ṣe tiyín láti mọ àwọn àkókò tàbí àwọn ìgbà pàtó[a] tí Baba ti ṣètò nípasẹ̀ àṣẹ tirẹ̀[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí “àwọn àkókò tàbí àwọn ìgbà tí a yàn,” tàbí “àwọn sáà tàbí àwọn ìgbà.” Gíríìkì lo ọ̀rọ̀ méjì tó jọra: χρόνοι fún àkókò tàbí sáà, àti καιροί fún ìgbà tó yẹ tàbí tí a yàn.'
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “nínú àṣẹ tirẹ̀.” Ìtumọ̀ rẹ̀ ni pé Baba ti ṣètò àwọn ọ̀ràn wọ̀nyí gẹ́gẹ́ bí ohun tí ó wà lábẹ́ àṣẹ tirẹ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tó ní ìtakò hàn láti inú ìbéèrè àwọn ọmọ-ẹ̀yìn sí ìdáhùn àtúnṣe Jésù.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Kì í ṣe tiyín láti mọ
  rationale: Èyí pa àṣà ọ̀rọ̀ Gíríìkì mọ́ pé ìmọ̀ yìí kì í ṣe ohun tó wà ní ìkáwọ́ tàbí ní ẹ̀tọ́ wọn, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: χρόνους
  choice: àwọn àkókò
  rationale: χρόνος lè tọ́ka sí àkókò gẹ́gẹ́ bí iye tàbí sáà tó ń gùn; ‘àwọn àkókò’ jẹ́ ọ̀rọ̀ àgbáyé tó yẹ níbí.
- source_word: καιροὺς
  choice: àwọn ìgbà pàtó
  rationale: καιρός sábà ń tọ́ka sí ìgbà tó yẹ, tí a yàn, tàbí tó ṣe pàtàkì; ‘ìgbà pàtó’ mú ìtumọ̀ yẹn jáde láìsọ ìyàtọ̀ náà di ètò ìmọ̀ tó le.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: A pa orúkọ oyè tó wà nínú Gíríìkì mọ́ láìfi ‘Baba mi’ kún un.
- source_word: ἔθετο
  choice: ti fi sí
  rationale: τίθημι níbí túmọ̀ sí fífi ohun kan sí ipò, píparí rẹ̀, tàbí yíyan rẹ̀; gbólóhùn yìí bá àkópọ̀ ‘abẹ́ àṣẹ’ mu lọ́nà àdánidá.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: sí abẹ́ àṣẹ tirẹ̀
  rationale: Ó sọ pé àwọn ọ̀ràn wọ̀nyí wà lábẹ́ ẹ̀tọ́ àti ìkáwọ́ Baba fúnra rẹ̀, ní Yorùbá tó ṣe kedere, bó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní ti gidi sí ‘nínú.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ χρόνους / καιρούς
  choice: àwọn àkókò tàbí àwọn ìgbà pàtó
  alternative: àwọn àkókò tàbí àwọn ìgbà; àwọn sáà tàbí àwọn ìgbà tí a yàn
  rationale: Èyí pa ìbátan àti ìyàtọ̀ tó wà láàárín ọ̀rọ̀ méjèèjì mọ́, láìfi ètò àsọtẹ́lẹ̀ tàbí ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- issue: Ìtumọ̀ ἐξουσία nípa Baba
  choice: sí abẹ́ àṣẹ tirẹ̀
  alternative: nínú àṣẹ tirẹ̀; nípasẹ̀ àṣẹ tirẹ̀
  rationale: Ó ṣàfihàn pé yíyan àwọn àkókò náà jẹ́ ẹ̀tọ́ àti ìkáwọ́ Baba fúnra rẹ̀, láìgbé àlàyé ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò sọ wọlé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Tiyín’ pa ìtẹnumọ́ ὑμῶν mọ́; ‘ìgbà pàtó’ yà καιροί sí ọ̀tọ̀ díẹ̀ sí χρόνους láìfi ìtumọ̀ tó le jù kún un.
