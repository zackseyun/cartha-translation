id: ACT.1.3
reference: Acts 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti jìyà, ó tún fi ara rẹ̀ hàn sí wọn pé ó wà láàyè, pẹ̀lú ọ̀pọ̀ ẹ̀rí[a]. Fún ogójì ọjọ́[b], ó ń fara hàn sí wọn, ó sì ń sọ̀rọ̀ nípa ìjọba Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nípasẹ̀ ọ̀pọ̀ ẹ̀rí’ tàbí ‘pẹ̀lú ọ̀pọ̀ ẹ̀rí tó dáni lójú.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹ̀rí tí ó fi ohun kan múlẹ̀ dájú.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ní gbogbo ogójì ọjọ́’ tàbí ‘fún ogójì ọjọ́.’ Gbólóhùn náà fi hàn pé ó ń fara hàn sí wọn ní onírúurú ìgbà jálẹ̀ àkókò náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: sí wọn
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ nínú ọ̀ràn ìfúnni tọ́ka sí àwọn aposteli inú ẹsẹ tó ṣáájú; ‘sí wọn’ bá Gíríìkì mu láìfi ‘ọkùnrin’ kún un.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: ó fi ara rẹ̀ hàn sí wọn pé òun wà láàyè
  rationale: Gbólóhùn yìí sọ pé Jésù fi ara rẹ̀ hàn, ipò tí ó sì wà nígbà náà ni pé ó wà láàyè. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹnumọ́ àjíǹde mọ́.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: lẹ́yìn tí ó ti jìyà
  rationale: μετά pẹ̀lú infinitive olóhùn-ọrọ túmọ̀ sí àkókò ‘lẹ́yìn’; ‘ti jìyà’ fi hàn pé ìjìyà náà ti ṣẹlẹ̀ kí ìfarahàn tó bẹ̀rẹ̀.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: pẹ̀lú ọ̀pọ̀ ẹ̀rí tí ó fi òtítọ́ náà múlẹ̀
  rationale: τεκμήριον kì í ṣe ẹ̀rí lásán, bí kò ṣe ẹ̀rí tó ń fi ohun kan múlẹ̀ dájú. ‘Pẹ̀lú’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ἐν oníṣe níbí.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: láàárín ogójì ọjọ́
  rationale: διά pẹ̀lú genitive tọ́ka sí ìfarahàn tó wáyé ní onírúurú ìgbà jálẹ̀ àkókò ogójì ọjọ́, kì í ṣe dandan pé ó ń fara hàn láìdáwọ́ dúró.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: ó ń fara hàn wọ́n
  rationale: Ọ̀rọ̀ náà sábà túmọ̀ sí ‘fara hàn’ nínú àyíká àjíǹde; ìṣe tí ń lọ ní Yorùbá bá àwọn ìfarahàn léraléra jálẹ̀ àkókò náà mu.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ó ń sọ̀rọ̀ nípa ìjọba Ọlọ́run
  rationale: τὰ περὶ jẹ́ àsọyé ohun tí ọ̀rọ̀ dá lé; ‘sọ̀rọ̀ nípa’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ gbólóhùn Yorùbá tí a mọ̀ dáadáa, ó sì lè gba èrò ìṣàkóso Ọlọ́run àti ìjọba rẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ àjíǹde àti agbára ẹ̀rí
  choice: A sọ ní tààrà pé lẹ́yìn ìjìyà Jésù, ó fi ara rẹ̀ hàn pé òun wà láàyè, pẹ̀lú ẹ̀rí tó fi òtítọ́ náà múlẹ̀.
  alternative: Ó fi ara rẹ̀ hàn lẹ́yìn ìjìyà rẹ̀ nípasẹ̀ ọ̀pọ̀ ẹ̀rí aláìlábùkù.
  rationale: Gíríìkì jẹ́rìí sí pé ó wà láàyè lẹ́yìn ìjìyà àti pé àwọn ìfarahàn náà ní agbára ẹ̀rí. A kò lo ọ̀rọ̀ tó le ju τεκμήριον lọ bí ‘aláìlábùkù.’
- issue: Bí a ṣe túmọ̀ ẹni tí οἷς ń tọ́ka sí
  choice: sí wọn
  alternative: sí àwọn ọkùnrin wọ̀nyí
  rationale: Àwọn aposteli ni ọ̀rọ̀ náà tọ́ka sí nínú àyíká, ṣùgbọ́n οἷς fúnra rẹ̀ kò ní ọ̀rọ̀ ‘ọkùnrin’; nítorí náà ‘sí wọn’ sún mọ́ ìpilẹ̀ṣẹ̀ jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún níbi tí ó ti yẹ, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A pín gbolohun Gíríìkì gígùn sí gbólóhùn méjì kí ó lè ṣàn dáadáa ní Yorùbá, láìyí ìbáṣepọ̀ àwọn ìṣe náà padà.
