  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀lọpọ̀ ìtumọ̀ Gíríìkì mọ́: ìfarahàn Jésù lẹ́yìn ìjìyà rẹ̀, ipò rẹ̀ gẹ́gẹ́ bí ẹni tí ó wà láàyè, ọ̀pọ̀ ẹ̀rí, àkókò ogójì ọjọ́, àti ẹ̀kọ́ nípa ìjọba Ọlọ́run. Ṣùgbọ́n “láàárín ogójì ọjọ́” kì í sọ ìtẹ̀síwájú jálẹ̀ àkókò náà kedere bí δι’ ἡμερῶν τεσσεράκοντα; “fún ogójì ọjọ́” dáa jù lọ nínú àyíká yìí.'
  naturalness: '“Ó ń fara hàn wọ́n” nílò “sí”: ní Yorùbá boṣewa, a máa ń sọ pé “ó ń fara hàn sí wọn.” Ìtúnṣe náà tún jẹ́ kí ìpín gbólóhùn náà ṣàn lọ́nà àdánidá.'
  terminology: “Ìjọba Ọlọ́run” yẹ, “fi ara rẹ̀ hàn” sì jẹ́ ọ̀nà àdánidá fún παρέστησεν ἑαυτόν/ὀπτανόμενος nínú àyíká àjíǹde. A yọ “tí ó fi òtítọ́ náà múlẹ̀” kúrò nínú ọ̀rọ̀ àkọ́kọ́ nítorí ó ṣàlàyé ju ohun tí τεκμήρια sọ lọ díẹ̀; “ọ̀pọ̀ ẹ̀rí” ti tó, a sì pa ìtumọ̀ ìmúdájú mọ́ nínú àlàyé ìsàlẹ̀.
