    issue: “Òtítọ́ náà” jẹ́ àfikún ìtumọ̀ nínú gbolohun àkọ́kọ́.
    rationale: τεκμήρια ń sọ nípa ẹ̀rí ìmúdájú, ṣùgbọ́n kò dárúkọ “òtítọ́ náà.” Kí ìtumọ̀ le sún mọ́ ìpilẹ̀ṣẹ̀, “pẹ̀lú ọ̀pọ̀ ẹ̀rí” yẹ.
