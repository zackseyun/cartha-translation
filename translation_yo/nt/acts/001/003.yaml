revisions:
- from: Lẹ́yìn tí ó ti jìyà, ó tún fi ara rẹ̀ hàn sí wọn pé òun wà láàyè, pẹ̀lú ọ̀pọ̀ ẹ̀rí tí ó fi òtítọ́ náà múlẹ̀[a]. Ó ń fara hàn wọ́n láàárín ogójì ọjọ́[b], ó sì ń sọ̀rọ̀ nípa ìjọba Ọlọ́run.
  to: Lẹ́yìn tí ó ti jìyà, ó tún fi ara rẹ̀ hàn sí wọn pé ó wà láàyè, pẹ̀lú ọ̀pọ̀ ẹ̀rí[a]. Fún ogójì ọjọ́[b], ó ń fara hàn sí wọn, ó sì ń sọ̀rọ̀ nípa ìjọba Ọlọ́run.
  rationale: 'A ṣe ìtúnṣe kékeré méjì fún ìṣètò Yorùbá àti ìtumọ̀ àkókò: a fi “sí” sí ibi tí ó yẹ lẹ́yìn “fara hàn,” a sì rọ́pò “láàárín ogójì ọjọ́” pẹ̀lú “fún ogójì ọjọ́.” A tún mú gbolohun ẹ̀rí sún mọ́ Gíríìkì nípa fífi àfikún “òtítọ́ náà” sílẹ̀. Àwọn àmì ìsàlẹ̀ àti ìtumọ̀ wọn bá àwọn ibi tí wọ́n so mọ́ mu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:56Z'
