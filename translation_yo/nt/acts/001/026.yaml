  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: yo
  text: Wọ́n sì ṣẹ́ kèké fún wọn,[a] kèké náà sì kan Mátíásì; wọ́n sì kà á pọ̀ mọ́ àwọn aposteli mọ́kànlá náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “wọ́n fi àwọn kèké fún wọn.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n sì ka á sí ara àwọn aposteli mọ́kànlá náà”; tàbí, “wọ́n sì fi í kún àwọn aposteli mọ́kànlá náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: wọ́n ṣẹ kèké fún àwọn méjèèjì
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí ‘wọ́n fi àwọn kèké fún wọn,’ ṣùgbọ́n ó jẹ́ ọ̀nà àkànlò èdè fún lílo kèké láti yan ọ̀kan lára àwọn olùdíje méjì tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú. ‘Ṣẹ kèké’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ‘àwọn méjèèjì’ sì mú ẹni tí ‘wọn’ ń tọ́ka sí hàn láì yí ìtumọ̀ padà.
- source_word: κλήρους / ὁ κλῆρος
  choice: kèké / kèké náà
  rationale: Ní àyíká ìtàn yìí, κλῆρος jẹ́ ohun tí a lò láti yan ẹni, kì í ṣe ìpín ogún. ‘Kèké’ pa àwòrán ìlànà yíyan náà mọ́.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: kèké náà sì kan Mátíásì
  rationale: ‘Kàn’ jẹ́ ọ̀nà àkànlò èdè Yorùbá tó bá àbájáde ṣíṣẹ kèké mu, ó sì pa ìtumọ̀ Gíríìkì pé kèké náà tọ́ka sí Mátíásì mọ́.
- source_word: Μαθθίαν
  choice: Mátíásì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìlànà kíkọ orúkọ àjèjì ní Yorùbá.
- source_word: συγκατεψηφίσθη
  choice: wọ́n sì kà á mọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé a ka ẹnì kan pọ̀ mọ́ ẹgbẹ́ kan tàbí pé a fi í sínú iye wọn. ‘Kà á mọ́’ sún mọ́ Gíríìkì, ó sì yẹra fún fífi ìtumọ̀ ìfiṣẹ́ àkànṣe kan kún ohun tí ẹsẹ náà sọ.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: àwọn aposteli mọ́kànlá náà
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive túmọ̀ sí ‘pẹ̀lú.’ Nínú àkànlò Yorùbá ‘kà á mọ́ àwọn aposteli mọ́kànlá’ fi hàn pé a ka Mátíásì pọ̀ mọ́ ẹgbẹ́ tí ó ti wà tẹ́lẹ̀.
theological_decisions:
- issue: Bóyá kí a túmọ̀ συγκατεψηφίσθη lọ́nà tí yóò fi ìfiṣẹ́ láti ọ̀dọ̀ Ọlọ́run hàn ju ohun tí ìtàn náà sọ lọ
  choice: wọ́n sì kà á mọ́ àwọn aposteli mọ́kànlá náà
  alternative: wọ́n sì fi í kún àwọn aposteli mọ́kànlá náà
  rationale: Àṣàyàn yìí ròyìn ipò Mátíásì lẹ́yìn tí kèké kan án, láì sọ ju Gíríìkì lọ nípa irú tàbí ìtumọ̀ ìfiṣẹ́ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo ‘ṣẹ kèké’ gẹ́gẹ́ bí àkànlò èdè Yorùbá fún yíyan nípa kèké; a sì lo ‘aposteli’ nítorí pé ó jẹ́ ọ̀rọ̀ tí ó ti wọ́pọ̀ nínú èdè ìjọ àti ìtumọ̀ Bíbélì Yorùbá.
