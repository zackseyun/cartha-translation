review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal span, the passive and upward sense of ἀνελήμφθη, the carried-over necessity from verse 21, and the appointment of one person as a witness alongside the existing apostles. The opening bare verb bẹ̀rẹ̀, however, is not an idiomatic Yoruba equivalent of the Greek participial temporal construction in this verse-fragment context.
  naturalness: The principal clause is clear and appropriately formal. Recasting the opening as a Yoruba temporal phrase removes the dangling, activity-unspecified bẹ̀rẹ̀ while preserving the source’s intended span in the syntax inherited from verse 21.
  terminology: Ìrìbọmi, ẹlẹ́rìí, and àjíǹde are established, clear Standard Yoruba biblical terms. A gbé e sókè retains the passive ascension reference without adding “heaven.” The footnote for the alternate witness expression is adjusted to a natural Yoruba verbal expression.
  issues:
  - severity: medium
    issue: The initial “bẹ̀rẹ̀ láti ìgbà …” is syntactically dangling and leaves unspecified what began.
    rationale: ἀρξάμενος is a participial temporal qualifier whose understood activity is supplied by the preceding context. In Yoruba, a bare bẹ̀rẹ̀ at the start is less natural and can suggest an unexpressed activity. “Láti ìgbà … títí dé …” idiomatically conveys the temporal extent without creating that problem.
  - severity: low
    issue: The b footnote’s proposed “ẹlẹ́rìí sí àjíǹde rẹ̀” is less idiomatic Yoruba.
    rationale: A verbal alternative, “ẹni tí ń jẹ́rìí sí àjíǹde rẹ̀,” naturally expresses the possible English-like sense “a witness to his resurrection,” while the main text remains closer to the Greek genitive.
  revised_text: Láti ìgbà ìrìbọmi Jòhánù[a] títí dé ọjọ́ tí a gbé e sókè kúrò lọ́dọ̀ wa, ọ̀kan lára àwọn wọ̀nyí gbọdọ̀ di ẹlẹ́rìí nípa àjíǹde rẹ̀[b] pẹ̀lú wa.
  revised_footnotes:
