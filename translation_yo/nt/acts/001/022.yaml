id: ACT.1.22
reference: Acts 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: yo
  text: Láti ìgbà ìrìbọmi Jòhánù[a] títí dé ọjọ́ tí a gbé e sókè kúrò lọ́dọ̀ wa, ọ̀kan lára àwọn wọ̀nyí gbọdọ̀ di ẹlẹ́rìí nípa àjíǹde rẹ̀[b] pẹ̀lú wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ìgbà ìrìbọmi tí Jòhánù ń ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ẹlẹ́rìí àjíǹde rẹ̀”; a tún lè sọ pé, “ẹni tí ń jẹ́rìí sí àjíǹde rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: bẹ̀rẹ̀ láti ìgbà ìrìbọmi Jòhánù
  rationale: Ó pa agbára participle náà àti ààlà àkókò ‘láti … títí dé’ mọ́. ‘Ìgbà ìrìbọmi Jòhánù’ kò fi tipátipá pinnu bóyá genitive náà túmọ̀ sí ìrìbọmi tí Jòhánù ń ṣe tàbí ìrìbọmi tí a fi mọ̀ ọ́n.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: títí dé ọjọ́ tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ òpin àkókò tí relative clause náà ń tọ́ka sí.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: tí a gbé e sókè kúrò lọ́dọ̀ wa
  rationale: Ó pa passive àti ìtumọ̀ ìgbé-sókè tí ọ̀rọ̀ Gíríìkì ní mọ́, láì fi ọ̀rọ̀ bí ‘sí ọ̀run’ kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: ẹlẹ́rìí nípa àjíǹde rẹ̀
  rationale: ‘Ẹlẹ́rìí nípa’ jẹ́ Yorùbá tó ṣe kedere fún genitive náà, ó sì fi àjíǹde rẹ̀ hàn gẹ́gẹ́ bí kókó ẹ̀rí náà.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: di ẹlẹ́rìí … pẹ̀lú wa
  rationale: ‘Di’ túmọ̀ γενέσθαι, ‘pẹ̀lú wa’ sì fi hàn pé ẹni tuntun náà yóò dara pọ̀ mọ́ ẹgbẹ́ àwọn ẹlẹ́rìí tó ti wà.
- source_word: ἕνα τούτων
  choice: ọ̀kan lára àwọn wọ̀nyí
  rationale: Ó tẹ̀ lé Gíríìkì láì fi ‘ọkùnrin’ kún un; àyíká ẹsẹ tó ṣáájú ló ń ṣàlàyé àwọn tí a ń tọ́ka sí.
theological_decisions:
- issue: Ìfihàn dandan tí δεῖ inú ẹsẹ 21 ń darí
  choice: A lo ‘gbọ́dọ̀’ nínú ‘ọ̀kan lára àwọn wọ̀nyí gbọdọ̀ di…’
  alternative: Kí a sọ ‘láti di’ nìkan, tí gbólóhùn náà yóò sì dúró gẹ́gẹ́ bí àjákù.
  rationale: Gíríìkì ẹsẹ 22 sinmi lórí δεῖ (‘ó pọndandan’) inú ẹsẹ 21. Fífi ‘gbọ́dọ̀’ hàn jẹ́ mímú syntax gangan wá sí Yorùbá tó pé, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
- issue: Ìtọ́ka sí ìgòkè Jesu
  choice: ‘a gbé e sókè kúrò lọ́dọ̀ wa’
  alternative: ‘ó gòkè lọ sí ọ̀run’ tàbí ‘a mú un kúrò lọ́dọ̀ wa’
  rationale: Àṣàyàn náà pa ìtumọ̀ passive àti ìtọ́ka sókè mọ́, ṣùgbọ́n kò ṣàfikún ibi tí ẹsẹ yìí kò dárúkọ tàbí sọ ọ́ di ìkúrò lásán.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. Àmì gígùn (—) ń ya àlàyé àkókò tí ó tẹ̀ sí ẹsẹ tó ṣáájú kúrò lọ́dọ̀ gbólóhùn pàtàkì, láì pa ìgbẹ́kẹ̀lé syntax náà run.
