revisions:
- from: bẹ̀rẹ̀ láti ìgbà ìrìbọmi Jòhánù[a] títí dé ọjọ́ tí a gbé e sókè kúrò lọ́dọ̀ wa—ọ̀kan lára àwọn wọ̀nyí gbọdọ̀ di ẹlẹ́rìí nípa àjíǹde rẹ̀[b] pẹ̀lú wa.
  to: Láti ìgbà ìrìbọmi Jòhánù[a] títí dé ọjọ́ tí a gbé e sókè kúrò lọ́dọ̀ wa, ọ̀kan lára àwọn wọ̀nyí gbọdọ̀ di ẹlẹ́rìí nípa àjíǹde rẹ̀[b] pẹ̀lú wa.
  rationale: The revision makes the temporal opening idiomatic Standard Yoruba while retaining its dependence on the preceding verse’s description of the qualified candidates. No theological expansion is introduced; “must” continues to represent the governing δεῖ in verse 21, and the passive upward departure remains explicit. Footnote anchors and markers are retained.
  reviewer_model: gpt-5.6-terra
