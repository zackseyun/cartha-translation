id: ACT.1.21
reference: Acts 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: yo
  text: Nítorí náà, ó pọndandan kí ọ̀kan lára àwọn ọkùnrin tí wọ́n ti bá wa wà[a] ní gbogbo àkókò tí Olúwa Jesu ń wọlé, tí ó sì ń jáde láàárín wa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin tí wọ́n bá wa kóra jọ”; ní ìtumọ̀ gangan, “àwọn ọkùnrin tí wọ́n jọ wá papọ̀ pẹ̀lú wa.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “ń wọlé, tí ó sì ń jáde láàárín wa,” jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó ń tọ́ka sí ìgbésí ayé àti iṣẹ́ Jesu ní gbangba, nígbà tí ó wà pẹ̀lú àwọn ọmọ-ẹ̀yìn.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: ó pọndandan
  rationale: Ó jẹ́ ọ̀rọ̀ aláìlẹ́ni kan pàtó tí ó ń fi dandan hàn; ó tún jẹ́ kí ìtumọ̀ náà má ṣe parí èrò tí ẹsẹ tó tẹ̀ lé yóò máa bá lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí Peteru fà jáde láti inú ọ̀rọ̀ tó ṣáájú hàn ní kedere.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: ọ̀kan lára àwọn ọkùnrin tí wọ́n wà pẹ̀lú wa
  rationale: ἀνήρ tọ́ka sí ọkùnrin ní pàtó. Ní àyíká ọ̀rọ̀ yìí, συνέρχομαι ń sọ nípa àwọn tí wọ́n bá àwọn aposteli ṣe ẹgbẹ́ fún àkókò gígùn; ‘wà pẹ̀lú wa’ jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan sílẹ̀.
- source_word: ἐν παντὶ χρόνῳ
  choice: ní gbogbo àkókò
  rationale: Ó tọ́ka sí gbogbo gígùn àkókò tí Jesu fi wà pẹ̀lú wọn, kì í ṣe dandan gbogbo ìṣẹ̀lẹ̀ kọ̀ọ̀kan.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: ń wọlé, tí ó sì ń jáde
  rationale: Ìṣe àṣà èdè yìí ń ṣàpèjúwe ìgbésí ayé àti iṣẹ́ tí Jesu ń ṣe déédéé láàárín àwọn ọmọ-ẹ̀yìn. Fífi àwòrán ọ̀rọ̀ orísun sílẹ̀ ń pa ìfararora rẹ̀ mọ́.
- source_word: ἐφ’ ἡμᾶς
  choice: láàárín wa
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, ó ń tọ́ka sí ìwà àti ìgbòkègbodò Jesu ní àárín ẹgbẹ́ náà.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Olúwa Jesu
  rationale: ‘Olúwa’ pa ipò ọlá àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ ti κύριος mọ́, ó sì jẹ́ ìlò Yorùbá tí ó fìdí múlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè Kristi
  choice: Olúwa Jesu
  alternative: Ọ̀gá Jesu
  rationale: ‘Olúwa’ pa ọlá àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú oyè náà mọ́ ju ‘Ọ̀gá’ lọ.
- issue: Ìtọ́kasí akọ nínú ἀνδρῶν
  choice: àwọn ọkùnrin
  alternative: àwọn ènìyàn
  rationale: ἀνήρ jẹ́ ọ̀rọ̀ akọ ní pàtó; ìtumọ̀ náà kò yí i padà sí ọ̀rọ̀ tí kò fi akọ tàbí abo hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Èdè náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. Àmì kọ́ńmà ní òpin fi hàn pé gbólóhùn àti èrò náà ń bá lọ sí ẹsẹ tó tẹ̀ lé.
