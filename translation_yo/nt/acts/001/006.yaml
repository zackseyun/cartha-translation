source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: yo
  text: Nítorí náà, nígbà tí wọ́n péjọ, wọ́n béèrè lọ́wọ́ rẹ̀ pé, “Olúwa, àkókò yìí ha ni ìwọ ń mú ìjọba náà padà sí Ísírẹ́lì[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ń mú ìjọba náà padà fún Ísírẹ́lì.” Dátífù Gíríìkì náà lè túmọ̀ sí ohun tí a ṣe fún àǹfààní Ísírẹ́lì (“fún Ísírẹ́lì”), tàbí, ní tààrà sí i, fífi ìjọba náà padà “sí Ísírẹ́lì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Nítorí náà, nígbà tí wọ́n péjọ
  rationale: A lo gbólóhùn àkókò láti fi iṣẹ́ συνελθόντες hàn, nígbà tí “Nítorí náà” ń gbé ìtẹ̀síwájú ọ̀rọ̀ μὲν οὖν jáde ní Yorùbá àdánidá.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: wọ́n béèrè lọ́wọ́ rẹ̀ pé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún bíbéèrè lọ́wọ́ ẹnì kan àti fífi ọ̀rọ̀ ìbéèrè náà bẹ̀rẹ̀; kò fi ipá àkókò tí kò pọn dandan kún imperfect náà.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìbọ̀wọ̀ àti ìwúwo orúkọ oyè κύριος mọ́ nínú ọ̀rọ̀ tí wọ́n ń bá Jésù sọ.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: àkókò yìí
  rationale: Ó túmọ̀ sí àsìkò tàbí àkókò kan, kì í ṣe ìṣẹ́jú kan ṣoṣo; ìṣètò “àkókò yìí ha ni” jẹ́ Yorùbá àdánidá fún ìbéèrè bẹ́ẹ̀.
- source_word: ἀποκαθιστάνεις
  choice: ìwọ ń mú ... padà
  rationale: “Ń mú ... padà” pa ìtumọ̀ ìmúpadàbọ̀ sí ipò tẹ́lẹ̀ àti present tí ó ń lọ lọ́wọ́ mọ́.
- source_word: τὴν βασιλείαν
  choice: ìjọba náà
  rationale: “Ìjọba” lè tọ́ka sí àkóso ọba tàbí ilẹ̀/ètò ìjọba, ó sì pa ìfojúsọ́nà àwọn ọmọ-ẹ̀yìn mọ́ láì túmọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo.
- source_word: τῷ Ἰσραήλ
  choice: fún Ísírẹ́lì
  rationale: “Fún Ísírẹ́lì” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, ó sì lè gbé èrò anfàní tàbí fífi ohun náà padà fún ẹni tí ó jẹ́ tirẹ̀; àlàyé ìsàlẹ̀ fi yíyan “sí Ísírẹ́lì” hàn.
theological_decisions:
- issue: Irú ìfojúsọ́nà àwọn ọmọ-ẹ̀yìn nípa ìjọba Ísírẹ́lì
  choice: A túmọ̀ ìbéèrè náà ní tààrà gẹ́gẹ́ bí mímú ìjọba padà fún Ísírẹ́lì.
  alternative: A lè sọ pé “mú àkóso padà” tàbí “mú ìjọba Ísírẹ́lì padà,” ṣùgbọ́n àwọn wọ̀nyí lè dín ìtumọ̀ náà kù tàbí fi ìtumọ̀ míì kún un.
  rationale: Ẹsẹ̀ náà ń ròyìn ìbéèrè àwọn ọmọ-ẹ̀yìn; kò sọ níbí pé Jésù fọwọ́ sí tàbí kọ gbogbo èrò inú ìbéèrè wọn. Nítorí náà, a pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Patíkù ìbéèrè “ha” mú ìbéèrè bẹ́ẹ̀ ṣe kedere láì sọ εἰ ní ọ̀nà líle.
