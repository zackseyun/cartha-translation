  to: Nítorí náà, nígbà tí wọ́n péjọ, wọ́n béèrè lọ́wọ́ rẹ̀ pé, “Olúwa, àkókò yìí ha ni ìwọ ń mú ìjọba náà padà sí Ísírẹ́lì[a]?”
