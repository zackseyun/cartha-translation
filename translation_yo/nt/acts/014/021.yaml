id: ACT.14.21
reference: Acts 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti kéde ìhìn rere[a] ní ìlú náà, tí wọ́n sì sọ ọ̀pọ̀ ènìyàn di ọmọ-ẹ̀yìn, wọ́n padà sí Lísírà, sí Íkóníónì àti sí Áńtíókù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti wàásù ìhìn rere ní ìlú náà.”
    reason: ìtumọ̀ ọ̀rọ̀ mìíràn fún Εὐαγγελισάμενοί, ní ìbámu pẹ̀lú àkọsílẹ̀ ìṣàyẹ̀wò Gẹ̀ẹ́sì
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Lẹ́yìn tí wọ́n ... ti kéde ìhìn rere
  rationale: Aorist participle náà tọ́ka sí iṣẹ́ tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì ὑπέστρεψαν. “Kéde ìhìn rere” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìwàásù ihinrere mọ́ láì lo ọ̀rọ̀ ẹ̀sìn tí ó le ṣòro fún òǹkàwé.
- source_word: τε
  choice: sì
  rationale: “Sì” so gbólóhùn yìí mọ́ ohun tí ó ṣáájú, ó sì bá ìṣàn àkọsílẹ̀ Yorùbá mu.
- source_word: τὴν πόλιν ἐκείνην
  choice: ní ìlú náà
  rationale: Ó tọ́ka padà sí Débè nínú àyíká ọ̀rọ̀; “ìlú náà” jẹ́ ìtumọ̀ tààrà tí ó sì ṣe kedere.
- source_word: μαθητεύσαντες
  choice: tí wọ́n sì sọ ... di ọmọ-ẹ̀yìn
  rationale: Ìkọ́lé “sọ ènìyàn di ọmọ-ẹ̀yìn” fi ìtumọ̀ oníṣe ti μαθητεύω hàn dáadáa, ìyẹn láti mú kí àwọn ènìyàn di ọmọ-ẹ̀yìn.
- source_word: ἱκανοὺς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Níhìn-ín ọ̀rọ̀ náà túmọ̀ sí iye ènìyàn tí ó pọ̀ tàbí tí ó tóbi, kì í ṣe ìtóye lásán.
- source_word: ὑπέστρεψαν
  choice: wọ́n padà
  rationale: Ìtumọ̀ àdánidá fún ìrìnàjò padà sí àwọn ibi tí wọ́n ti dé tẹ́lẹ̀.
- source_word: εἰς τὴν Λύστραν
  choice: sí Lísírà
  rationale: εἰς níhìn-ín ń fi ibi tí wọ́n ń lọ hàn; “sí” ni ìtumọ̀ Yorùbá tó yẹ.
- source_word: εἰς Ἰκόνιον
  choice: sí Ikóníónì
  rationale: A tún “sí” lò láti pa ìtẹ̀lé àwọn ibi ìrìnàjò mọ́, gẹ́gẹ́ bí èdè Gíríìkì.
- source_word: εἰς Ἀντιόχειαν
  choice: sí Áńtíókù
  rationale: “Sí” fi ibi ìrìnàjò hàn; àtúnlò rẹ̀ nínú Gíríìkì ni Yorùbá tún ń ṣàfihàn ní ọ̀nà tí kò le koko.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. Àwọn orúkọ ibi ni a kọ ní ìbámu pẹ̀lú bí wọ́n ṣe lè dun ní Yorùbá.
