id: ACT.14.5
reference: Acts 14:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ìgbìyànjú kan wáyé láàárín àwọn aláì-Júù àti àwọn Júù[b], pẹ̀lú àwọn olórí wọn, láti hùwà ìkà sí wọn àti láti sọ wọ́n ní òkúta[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìkọlù kan wáyé.” Ọ̀rọ̀ Gíríìkì ὁρμή lè túmọ̀ sí ìgbì líle tàbí ìkọlù. A lo “ìgbìyànjú” níhìn-ín nítorí àwọn ìṣe ìkà àti sísọ wọ́n ní òkúta ni a fi hàn gẹ́gẹ́ bí ohun tí wọ́n pinnu láti ṣe, kì í ṣe ohun tí ẹsẹ̀ yìí sọ pé wọ́n ti parí.
    reason: lexical_alternative
  - marker: b
    text: Ní àwọn àyíká kan, a lè túmọ̀ “àwọn Júù” sí “àwọn ará ilẹ̀ Jùdíà.” Níhìn-ín, ó ṣeé ṣe kó tọ́ka sí àwọn alátakò Júù gẹ́gẹ́ bí ẹgbẹ́ kan, kì í ṣe àwọn tó wá láti Jùdíà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní àkókò kan náà, ó sì pa agbára ìsopọ̀ δέ mọ́ láìfi ìtakora tó lágbára kún un.
- source_word: ἐγένετο ὁρμὴ
  choice: gbìyànjú[a]
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ìgbì líle, ìkọlù tó bẹ̀rẹ̀, tàbí ìgbìyànjú. Nítorí pé àwọn ọ̀rọ̀-ìṣe tó tẹ̀ lé e sọ ohun tí wọ́n fẹ́ ṣe, ‘gbìyànjú’ jẹ́ èdè Yorùbá àdánidá tí kò sọ pé wọ́n parí ìṣe náà.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Ní ìyàtọ̀ sí àwọn Júù nínú Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìjọba.
- source_word: τε καὶ
  choice: àwọn Kèfèrí àti àwọn Júù
  rationale: Ìṣètò yìí fi hàn pé ẹgbẹ́ méjèèjì ló kópa, bí τε καί ṣe so wọ́n pọ̀.
- source_word: Ἰουδαίων
  choice: àwọn Júù[b]
  rationale: Ní àyíká yìí, ó túmọ̀ sí àwọn alátakò Júù gẹ́gẹ́ bí ẹgbẹ́ kan, kì í ṣe àwọn ará Jùdíà nìkan.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: pẹ̀lú àwọn olórí wọn
  rationale: ‘Àwọn olórí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn ẹni tó ní ipò àṣẹ láwùjọ tàbí ní ìlú; ‘pẹ̀lú’ sì ṣàfihàn σύν.
- source_word: ὑβρίσαι
  choice: láti hùwà ìkà sí wọn
  rationale: Ó gba ìtumọ̀ ìwà ìkà, ìbàjẹ́, tàbí ìlòkulò tí ὑβρίζω lè ní, láìdín un kù sí ẹ̀gàn ọ̀rọ̀ ẹnu nìkan.
- source_word: καὶ λιθοβολῆσαι
  choice: àti láti sọ wọ́n lókùúta
  rationale: Ó túmọ̀ ìṣe lílọ òkúta lù wọ́n, ṣùgbọ́n kò fi ‘pa wọ́n’ kún un, nítorí abajade ikú kò farahàn ní tààrà nínú ọ̀rọ̀-ìṣe Gíríìkì náà.
- source_word: αὐτούς
  choice: wọn / wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Pọ́ọ̀lù àti Bánábà; ìyàtọ̀ àmì ohùn nínú Yorùbá jẹ́ ti ipò gírámà.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá à标准 tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A yan ‘àwọn Kèfèrí’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀ fún àwọn tí kì í ṣe Júù. Àmì [a] wà lẹ́gbẹ̀ẹ́ ‘gbìyànjú,’ àmì [b] sì wà lẹ́gbẹ̀ẹ́ ‘àwọn Júù,’ kí akọsilẹ̀ kọ̀ọ̀kan lè bá ọ̀rọ̀ tó ń ṣàlàyé mu. Àmì ìdákẹ́jẹ ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
