source:
  edition: SBLGNT
  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: yo
  text: Nígbà tí wọ́n mọ èyí[a], wọ́n sá lọ sí àwọn ìlú Líkáóníà—Lísírà àti Déríbè—àti agbègbè àyíká wọn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà tí wọ́n lóye èyí” tàbí “nígbà tí wọ́n wá mọ̀ nípa rẹ̀.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí bí wọ́n ṣe wá lóye ewu tí a ṣàpèjúwe nínú ẹsẹ tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Nígbà tí wọ́n sì mọ èyí
  rationale: Ọ̀rọ̀ participle aorist náà tọ́ka sí bí wọ́n ṣe wá lóye tàbí mọ ewu tí ẹsẹ tó ṣáájú sọ̀rọ̀ nípa rẹ̀. “Èyí” jẹ́ ohun tí a fi kún un láti inú àyíká ọ̀rọ̀, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κατέφυγον
  choice: wọ́n sá lọ
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà tẹnumọ́ kíkúrò ní kánjú nítorí ewu; “sá lọ” ṣe èyí ní kedere, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ sísá lọ sí ibi ààbò.
- source_word: εἰς
  choice: sí
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìrìn, εἰς fi ibi tí ìrìn náà ń lọ hàn; “sí” ni ọ̀nà Yorùbá tó bá a mu.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: àwọn ìlú Líkáóníà
  rationale: Èyí pa ìbáṣepọ̀ genitive mọ́ gẹ́gẹ́ bí àwọn ìlú tó wà ní ẹkùn Líkáóníà, ó sì jẹ́ kí orúkọ ìlú méjèèjì tó tẹ̀ lé e ṣàlàyé wọn.
- source_word: Λύστραν καὶ Δέρβην
  choice: Lísírà àti Déríbè
  rationale: Àwọn wọ̀nyí jẹ́ àkọsílẹ̀ orúkọ ibi náà ní ìrísí tó bá ìró àti ìkọ̀wé Yorùbá mu; wọ́n dúró gẹ́gẹ́ bí àlàyé sí “àwọn ìlú Líkáóníà.”
- source_word: τὴν περίχωρον
  choice: agbègbè àyíká wọn
  rationale: περίχωρος ń tọ́ka sí ilẹ̀ tàbí agbègbè tó yí àwọn ìlú tí a dárúkọ ká; gbolohun yìí kedere, ó sì lè gba ìlú kéékèèké àti ìgbèríko inú ẹkùn náà.
- source_word: καὶ ... καὶ
  choice: —Lísírà àti Déríbè—àti
  rationale: Àmì ìdáwọ́ dúró gígùn mú kí ó ṣe kedere pé Lísírà àti Déríbè ni àwọn ìlú tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, nígbà tí καί tó kàn fi agbègbè àyíká wọn kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àmì ìdáwọ́ dúró gígùn ya orúkọ ìlú méjèèjì sọ́tọ̀ gẹ́gẹ́ bí àlàyé, láì jẹ́ kí ìtàn náà nira fún òǹkàwé.
