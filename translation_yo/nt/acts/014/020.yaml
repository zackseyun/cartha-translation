id: ACT.14.20
reference: Acts 14:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ọmọ-ẹ̀yìn yí i ká[a], ó dìde[b], ó sì wọ ìlú náà lọ. Ní ọjọ́ kejì, ó jáde lọ pẹ̀lú Bánábà sí Dẹ́bè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kó ara wọn jọ yí i ká.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó jíǹde.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí bẹ́ẹ̀; ṣùgbọ́n níbí ó ṣeé ṣe kó ń sọ pé Pọ́ọ̀lù dìde nípa ti ara, kì í ṣe pé ó ń sọ ìjíǹde kúrò nínú òkú ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: yí i ká
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn ọmọ-ẹ̀yìn wà yí Paul ká. ‘Yí i ká’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ìtumọ̀ yíyí ẹni ká mọ́ láìfi hàn pé wọ́n fẹ́ ṣe é ní ibi.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó fi ìyípadà tó yàtọ̀ díẹ̀ sí ohun tó ṣẹlẹ̀ ṣáájú hàn: lẹ́yìn tí wọ́n sọ Paul ní òkú, ó dìde.'
- source_word: τῶν μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún μαθητής, ó sì bójú mu nínú Ìṣe Àwọn Àpọ́sítélì.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Nínú àyíká ìtàn yìí, ó ń sọ ìṣe ara pé Paul dìde kúrò nílẹ̀; kò sọ ní tààrà pé ó jíǹde kúrò nínú òkú.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: ó sì wọ inú ìlú náà lọ
  rationale: Ó pa ìtọ́sọ́nà ìṣípò sínú ìlú mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó túmọ̀ sí ọjọ́ tó tẹ̀ lé ọjọ́ ìṣẹ̀lẹ̀ náà.
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Ó pa agbára ìtumọ̀ ‘jáde’ mọ́, nígbà tí ibi tí wọ́n ń lọ, Déíbè, tẹ̀ lé e.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: òun àti Bánábà
  rationale: Ìkọ́lé yìí sọ ìbákẹ́gbẹ́ Bánábà pẹ̀lú Paul ní Yorùbá tó rọrùn, ó sì yẹra fún àìṣedéédéé tí ‘pẹ̀lú Bánábà’ lè ní ní ibí yìí.
- source_word: Δέρβην
  choice: Déíbè
  rationale: Àkọsílẹ̀ orúkọ ibìkan náà ní ìró tó bá èdè Yorùbá mu.
theological_decisions:
- issue: Bóyá ἀναστὰς yẹ kí ó fi ìjíǹde tàbí ìmúpadàbọ̀sípò oníṣẹ́ ìyanu hàn
  choice: ó dìde
  alternative: ó jíǹde; a gbé e dìde
  rationale: Ọ̀rọ̀ Gíríìkì náà lè sọ pé ẹni kan dìde lásán. Bí ó tilẹ̀ jẹ́ pé ohun tó ṣẹlẹ̀ lẹ́yìn lílù Paul ní òkú jẹ́ ìyanu, ẹsẹ yìí kò sọ ní pàtó pé ó kú, pé ó jíǹde, tàbí pé ẹlòmíràn gbé e dìde. Ìtumọ̀ náà kò fi ẹ̀kọ́ tí ẹsẹ kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìṣàn ìtàn náà mọ́ ní ọ̀nà àdánidá.
