id: ACT.14.17
reference: Acts 14:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: yo
  text: 'Síbẹ̀ náà, kò fi ara rẹ̀ sílẹ̀ láìsí ẹ̀rí[a], nípa ṣíṣe rere: ó ń fún yín ní òjò láti ọ̀run àti àwọn àsìkò ọlọ́pọ̀ èso[b], ó sì ń fi oúnjẹ àti ayọ̀ kún ọkàn yín.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láìsí ẹlẹ́rìí” tàbí “láìsí ìjẹ́rìí.” Ọ̀rọ̀ Gíríìkì tẹnumọ́ pé Ọlọ́run kò jẹ́ kí ẹ̀rí nípa ẹni tí òun jẹ́ má sí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn àsìkò tí ń mú èso wá.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ẹ̀dà àkọsílẹ̀ Gíríìkì ní “ọkàn wa” dípò “ọkàn yín”; SBLGNT ní “ọkàn yín.”
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Síbẹ̀
  rationale: 'Ó fi ìtumọ̀ ìyọ̀ǹda hàn ní ìbámu pẹ̀lú ẹsẹ tó ṣáájú: bí Ọlọ́run tilẹ̀ jẹ́ kí àwọn orílẹ̀-èdè máa rìn ní ọ̀nà wọn, kò ṣíwọ́ jíjẹ́rìí nípa ara rẹ̀.'
- source_word: ἀμάρτυρον
  choice: láìsí ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó lè túmọ̀ sí witness tàbí testimony, ó sì pa ìmọ̀ ìjẹ́rìí inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: αὑτὸν
  choice: ara rẹ̀
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ afara-ẹni mọ́: Ọlọ́run ń jẹ́rìí nípa ara rẹ̀.'
- source_word: ἀφῆκεν
  choice: kò fi ... sílẹ̀
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀nà gbólóhùn Gíríìkì, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἀγαθουργῶν
  choice: nítorí ó ń ṣe rere
  rationale: Apá yìí ṣàlàyé bí Ọlọ́run ṣe kò fi ara rẹ̀ sílẹ̀ láìsí ẹ̀rí; “ń ṣe rere” jẹ́ àdánidá, ó sì fi ìṣe oore rẹ̀ hàn.
- source_word: οὐρανόθεν
  choice: láti ọ̀run
  rationale: Ó pa èdè Bíbélì àti ìtọ́ka sí orísun tí Ọlọ́run ń pèsè láti inú rẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀run ojú-ọjọ́ wà nínú àyíká ọ̀rọ̀ náà.
- source_word: ὑετοὺς
  choice: òjò
  rationale: Yorùbá sábà máa ń lo “òjò” gẹ́gẹ́ bí orúkọ àìlóǹkà; ó lè gba èrò òjò tó ń rọ̀ ní ìgbà púpọ̀ láìfi ọ̀rọ̀ di líle.
- source_word: καιροὺς καρποφόρους
  choice: àwọn àkókò eléso
  rationale: “Àkókò” mú èrò ìgbà tí a yàn tàbí àsìkò jáde, “eléso” sì pa ìtumọ̀ fruit-bearing mọ́.
- source_word: ἐμπιπλῶν
  choice: ó sì ń fi ... kún
  rationale: Ìṣàpẹẹrẹ yìí jẹ́ Yorùbá tó ṣàn dáadáa fún “filling,” ó sì pa ìṣe Ọlọ́run tó ń bá a lọ nínú àlàyé náà mọ́.
- source_word: τροφῆς
  choice: oúnjẹ
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ohun jíjẹ tàbí ohun ìtọ́jú ara.
- source_word: εὐφροσύνης
  choice: ayọ̀
  rationale: “Ayọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì mú inú-dídùn àti ìdùnnú tí ọ̀rọ̀ Gíríìkì túmọ̀ sí jáde.
theological_decisions:
- issue: Irú ẹ̀rí tí ẹsẹ náà sọ pé Ọlọ́run ń jẹ́ nípa ara rẹ̀
  choice: Ọlọ́run ń jẹ́rìí nípa ara rẹ̀ nípasẹ̀ oore ìpèsè rẹ̀ nínú ìṣẹ̀dá
  alternative: Kí a ka òjò, àkókò eléso, oúnjẹ àti ayọ̀ sí ìṣẹ̀lẹ̀ àdánidá lásán láìní ìtumọ̀ nípa Ọlọ́run
  rationale: Arọ́pò-orúkọ afara-ẹni “ara rẹ̀,” ọ̀rọ̀ “ẹ̀rí,” àti àwọn ọ̀rọ̀-ìṣe tó tẹ̀ lé e fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tó ń fúnni, tó sì ń ṣe rere. Ìtumọ̀ náà sọ ohun tí ẹsẹ náà sọ láìfikún ẹ̀kọ́ ìsìn mìíràn.
- issue: Ẹni tí Ọlọ́run kún ọkàn rẹ̀
  choice: ọkàn yín
  alternative: ọkàn wa
  rationale: A tẹ̀ lé SBLGNT, tó ní ὑμῶν (“yín”), ṣùgbọ́n a tọ́ka sí ẹ̀dà ọ̀rọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn èrò Gíríìkì ṣùgbọ́n a pín un pẹ̀lú àmì olójú méjì fún kíkà tó rọrùn. “Ọkàn” pa àwòrán Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ní Yorùbá ìpèsè oúnjẹ lè jẹ́ pé ó ń tẹ́ ènìyàn lọ́rùn.
