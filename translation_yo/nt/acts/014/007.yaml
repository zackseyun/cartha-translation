  text: And there they were preaching the good news[a].
translation:
  language: yo
  text: Wọ́n sì ń kéde ìhìn rere níbẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ibẹ̀ pẹ̀lú, wọ́n ń wàásù ìhìnrere.”
    reason: Àyípadà yìí fi ìtumọ̀ mìíràn tí κἀκεῖ lè ní (‘ní ibẹ̀ pẹ̀lú’) àti ọ̀nà ìbílẹ̀ láti sọ εὐαγγελίζω (‘wàásù ìhìnrere’) hàn.
lexical_decisions:
- source_word: κἀκεῖ
  choice: sì … níbẹ̀
  rationale: κἀκεῖ jẹ́ àkópọ̀ καί àti ἐκεῖ, ó sì túmọ̀ sí ‘àti níbẹ̀’ tàbí ‘níbẹ̀ pẹ̀lú.’ ‘sì … níbẹ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìsopọ̀ ìtàn náà àti ibi tí ìṣe náà ti ṣẹlẹ̀ mọ́.
- source_word: εὐαγγελιζόμενοι
  choice: ń kéde ìhìn rere
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípolongo ìròyìn ayọ̀, pàápàá ìhìn rere nípa Jesu. ‘ń kéde ìhìn rere’ ṣe àfihàn ìtumọ̀ ìṣe náà ní èdè Yorùbá òde òní láìfi ọ̀rọ̀ ẹ̀sìn tí ó le ṣòro kún un.
- source_word: ἦσαν
  choice: Wọ́n … ń
  rationale: Pẹ̀lú participle εὐαγγελιζόμενοι, imperfect ἦσαν fi hàn pé ìṣe náà ń lọ lọ́wọ́ ní àkókò tí ìtàn ń sọ̀rọ̀ rẹ̀. Àkópọ̀ ‘Wọ́n … ń kéde’ ni Yorùbá àdánidá fún ìṣe tí ń bá a lọ ní àkókò àtijọ́.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ṣe kedere, ó ní iyì, ó sì jẹ́ àdánidá fún òǹkàwé òde òní. A lo ‘kéde ìhìn rere’ dípò ọ̀rọ̀ amọ̀-ẹ̀sìn tí ó lè ṣòro, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ‘wàásù ìhìnrere’ mọ́ gẹ́gẹ́ bí àṣàyàn.
