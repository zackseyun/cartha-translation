  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: yo
  text: 'Ṣùgbọ́n àwọn ènìyàn ìlú náà pín sí méjì[a]: àwọn kan wà pẹ̀lú àwọn Júù, àwọn mìíràn sì wà pẹ̀lú àwọn aposteli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn ènìyàn ìlú náà yà sí méjì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: pínyà sí méjì
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣe aláìṣe tí ó túmọ̀ sí pé ohun kan ya tàbí pín. Nínú àyíká yìí, ó ń ṣàpèjúwe bí àwọn ará ìlú ṣe pín sí ẹgbẹ́ méjì.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: àwọn ènìyàn ìlú náà
  rationale: πλῆθος níbí tọ́ka sí ọ̀pọ̀ ènìyàn inú ìlú lápapọ̀, kì í ṣe dandan pé ogunlọ́gọ̀ kan tí ó péjọ sí ibi kan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ kékeré hàn sí ohun tí ó ṣẹlẹ̀ ṣáájú, nítorí náà “Ṣùgbọ́n” bá ìṣàn ọ̀rọ̀ mu.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: àwọn kan ... àwọn mìíràn sì
  rationale: Ìkọ́lé yìí fi ẹgbẹ́ méjì tí ó dojú kọ ara wọn hàn ní èdè Yorùbá àdánidá.
- source_word: σὺν
  choice: wà pẹ̀lú
  rationale: σύν túmọ̀ sí ìbákẹ́gbẹ́ tàbí dídúró ní ìhà kan; àyíká náà mú kí “wà pẹ̀lú” túmọ̀ sí pé wọ́n fara mọ́ ẹgbẹ́ náà.
- source_word: Ἰουδαίοις
  choice: àwọn Júù
  rationale: Kò sí ohun kan nínú ẹsẹ yìí tí ó dín ìtọ́kasí náà kù sí àwọn aṣáájú Júù nìkan.
- source_word: ἀποστόλοις
  choice: àwọn aposteli
  rationale: Èyí ni ọ̀rọ̀ tí a mọ̀ dáadáa fún ἀπόστολος nínú Ìṣe Àwọn Aposteli, ó sì tọ́ka sí Paulu àti Barnaba ní àyíká yìí.
theological_decisions:
- issue: Àwọn tí a pè ní “àwọn aposteli”
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “àwọn aposteli,” ìyẹn orúkọ tí ìtàn náà fi ń pe Paulu àti Barnaba.
  alternative: Túmọ̀ ọ́ ní gbogbogbòò sí “àwọn ikọ̀” tàbí “àwọn ojiṣẹ́.”
  rationale: Luku fúnra rẹ̀ pe Barnaba àti Paulu ní “àwọn aposteli” ní Ìṣe 14:14. Yíyan ọ̀rọ̀ yìí pa èdè ìtàn náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tóóró tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Pínyà sí méjì” mú àwòrán σχίζω jáde, nígbà tí “àwọn ènìyàn ìlú náà” jẹ́ àdánidá ju títúmọ̀ πλῆθος lọ ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀.
