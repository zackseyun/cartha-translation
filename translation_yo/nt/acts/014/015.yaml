id: ACT.14.15
reference: Acts 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: yo
  text: wọ́n sì ń wí pé, “Ẹ̀yin ọkùnrin, kí ló dé tí ẹ fi ń ṣe nǹkan wọ̀nyí? Àwa náà jẹ́ ènìyàn bí ẹ̀yin, tí a sì ní ìrírí kan náà[a]. A ń mú ìhìn rere wá fún yín kí ẹ lè yí padà kúrò nínú àwọn ohun asán wọ̀nyí[b], kí ẹ sì yí sí Ọlọ́run alààyè, ẹni tí ó dá ọ̀run[c] àti ayé àti òkun àti ohun gbogbo tí ó wà nínú wọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ènìyàn tí ipò àti ìrírí wa dà bí ti yín.” Ọ̀rọ̀ náà túmọ̀ sí pé Pọ́ọ̀lù àti Bánábà pín ipò ènìyàn àti ìrírí kan náà pẹ̀lú àwọn olùgbọ́ wọn.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ohun asán” ń tọ́ka nínú àyíká yìí sí ìjọsìn àwọn òrìṣà tí kò ní èrè, títí kan àwọn òrìṣà fúnra wọn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn ọ̀run.” Gíríìkì lo “ọ̀run” ní ẹyọ kan nínú àgbékalẹ̀ ìṣẹ̀dá tí ó fara jọ èdè Ìwé Mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ẹ̀yin ọkùnrin
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni, ó sì tọ́ka sí àwọn ọkùnrin tí a ń bá sọ̀rọ̀ ní tààràtà.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: ènìyàn tí a ní irú ẹ̀dá kan náà bí ẹ̀yin
  rationale: Ó tẹnumọ́ pé Pọ́ọ̀lù àti Bánábà jẹ́ ènìyàn lásán bí àwọn olùgbọ́ wọn, kì í ṣe òrìṣà; ó tún kọjá ìtumọ̀ ìmọ̀lára nìkan.
- source_word: εὐαγγελιζόμενοι
  choice: A ń mú ìròyìn ayọ̀ wá fún yín
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́ ní èdè Yorùbá adayébá, láì fi èdè ìjọ tó le koko kún un.
- source_word: ματαίων
  choice: àwọn ohun asán
  rationale: ‘Asán’ ṣàfihàn ohun tí kò ní èrè tàbí ìtóye; ó jẹ́ kí gbólóhùn náà gbòòrò bí ti Gíríìkì, dípò yíyí i sí ‘òrìṣà’ nìkan.
- source_word: ἐπιστρέφειν ... ἐπὶ θεὸν ζῶντα
  choice: kí ẹ yí padà kúrò ... kí ẹ sì yí sí Ọlọ́run alààyè
  rationale: Ìṣètò ‘kúrò ... sí’ mú ìrìn ìyípadà inú Gíríìkì hàn ní kedere, ‘alààyè’ sì tako àwọn ohun ìjọsìn aláìní ẹ̀mí.
- source_word: ἐποίησεν
  choice: dá
  rationale: ‘Dá’ ni ọ̀rọ̀ Yorùbá adayébá fún iṣẹ́ ìṣẹ̀dá Ọlọ́run nínú àyíká yìí.
- source_word: τὸν οὐρανὸν ... τὴν γῆν ... τὴν θάλασσαν
  choice: ọ̀run àti ayé àti òkun
  rationale: Ó pa àtòjọ ìṣẹ̀dá àti àsopọ̀ ‘àti’ tí Gíríìkì tún ṣe mọ́.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: ohun gbogbo tí ó wà nínú wọn
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere fún gbólóhùn tó kó gbogbo ohun inú ọ̀run, ayé àti òkun jọ.
theological_decisions:
- issue: Ipò Pọ́ọ̀lù àti Bánábà gẹ́gẹ́ bí ènìyàn ní ìtakora sí ọlá ọlọ́run tí ogunlọ́gọ̀ fẹ́ fún wọn
  choice: Àwa náà jẹ́ ènìyàn tí a ní irú ẹ̀dá kan náà bí ẹ̀yin
  alternative: Àwa náà jẹ́ ènìyàn lásán bí ẹ̀yin
  rationale: Àṣàyàn náà pa ìtumọ̀ ìjọra nínú ipò àti ẹ̀dá ènìyàn mọ́, láì mú un dín kù sí ìmọ̀lára tàbí ìfẹ́kúfẹ̀ẹ́.
- issue: Ìwọ̀n ohun tí ‘ματαίων’ ń tọ́ka sí
  choice: àwọn ohun asán
  alternative: àwọn òrìṣà
  rationale: Àyíká náà ní ìjọsìn abọ̀rìṣà nínú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbòòrò ju orúkọ ‘òrìṣà’ lọ; ẹsẹ̀ pàtàkì pa ìṣípayá yẹn mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé àyíká.
- issue: Ọ̀run ní ẹyọ kan tàbí ọ̀pọ̀
  choice: ọ̀run
  alternative: àwọn ọ̀run
  rationale: Gíríìkì lo ẹyọ kan nínú àgbékalẹ̀ ìṣẹ̀dá tí ó fara jọ èdè Ìwé Mímọ́; a pa ẹyọ kan mọ́ láì sọ ohun tí ọ̀rọ̀ náà lè bo di kékeré.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, adayébá, tí ó sì yé òǹkàwé òde òní. A lo ‘ẹ̀yin’ fún ọ̀pọ̀ ènìyàn àti ọ̀wọ̀; a pa àsopọ̀ ìṣẹ̀dá ‘àti ... àti ... àti’ mọ́ láti tẹ̀lé ìtẹnumọ́ orísun. Gbogbo àmì ìsàlẹ̀ [a], [b], [c] wà nínú ẹsẹ̀ pàtàkì.
