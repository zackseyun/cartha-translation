id: ACT.14.3
reference: Acts 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: yo
  text: Nítorí náà, wọ́n dúró níbẹ̀ fún àkókò gígùn, wọ́n ń fi ìgboyà sọ̀rọ̀ ní ìgbẹ́kẹ̀lé Olúwa.[a] Olúwa sì ń jẹ́rìí sí ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀, nípa fífúnni láyè kí àwọn àmì àti iṣẹ́ ìyanu ṣẹlẹ̀ nípasẹ̀ ọwọ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń fi ìgboyà sọ̀rọ̀ fún Olúwa,” tàbí “nínú Olúwa.” Àpólà Gíríìkì náà lè tẹnu mọ́ pé ìgboyà wọn dá lórí Olúwa, tàbí pé wọ́n ń sọ̀rọ̀ ní ìbáṣepọ̀ pẹ̀lú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: fún àkókò gígùn
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí àkókò tí ó pọ̀ tó ṣe pàtàkì; ‘àkókò gígùn’ jẹ́ èdè Yorùbá àdánidá láì sọ iye ọjọ́ tí ọ̀rọ̀ Gíríìkì kò sọ.
- source_word: διέτριψαν
  choice: wọ́n dúró níbẹ̀
  rationale: Ó túmọ̀ sí pé wọ́n lo àkókò tàbí pé wọ́n wà ní ibi kan; ‘dúró níbẹ̀’ bá ìtàn ibi tí wọ́n wà mu.
- source_word: παρρησιαζόμενοι
  choice: wọ́n ń fi ìgboyà sọ̀rọ̀
  rationale: Ó fi ọ̀rọ̀ sísọ ní gbangba láìbẹ̀rù hàn, ó sì pa ìṣe tí ń bá a lọ mọ́.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: fún Olúwa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé iṣẹ́ ìkéde wọn wà fún Olúwa; àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tí ó lè fi ìgbẹ́kẹ̀lé tàbí ìbáṣepọ̀ pẹ̀lú Olúwa hàn mọ́.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: Ó pa oyè κύριος mọ́ láìfi ‘Jésù’ tàbí ìtumọ̀ míì kún ohun tí ẹsẹ náà sọ ní tààrà.
- source_word: τῷ μαρτυροῦντι
  choice: ń jẹ́rìí
  rationale: Ó pa ìtumọ̀ ẹ̀rí àti ìṣe tí ń bá a lọ mọ́.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: sí ọ̀rọ̀ oore-ọ̀fẹ́ rẹ̀
  rationale: ‘Ọ̀rọ̀’ pa λόγος mọ́, ‘oore-ọ̀fẹ́’ sì gbé ìtumọ̀ ẹ̀bùn rere Ọlọ́run tí χάρις ní nínú àyíká yìí jáde.
- source_word: διδόντι
  choice: nípa mímú kí ... ṣẹlẹ̀
  rationale: Ìtumọ̀ yìí sọ ní Yorùbá àdánidá pé Olúwa ni ó ń fún àwọn iṣẹ́ wọ̀nyí láyè àti agbára láti wáyé, dípò gbólóhùn líle tí yóò tẹ̀lé àtòjọ Gíríìkì ní tààrà.
- source_word: σημεῖα καὶ τέρατα
  choice: àwọn àmì àti iṣẹ́ ìyanu
  rationale: 'Ó pa àkójọpọ̀ ọ̀rọ̀ Bíbélì náà mọ́: ‘àmì’ ń fi iṣẹ́ tí ń tọ́ka sí ohun kan hàn, ‘iṣẹ́ ìyanu’ sì ń fi ohun amúnilẹ́nu hàn.'
- source_word: γίνεσθαι
  choice: ṣẹlẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn àmì àti iṣẹ́ ìyanu náà wáyé; ‘ṣẹlẹ̀’ jẹ́ èdè Yorùbá tí ó rọrùn.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: nípasẹ̀ ọwọ́ wọn
  rationale: Ó pa àwòrán ọwọ́ gẹ́gẹ́ bí ohun èlò iṣẹ́ mọ́, ó sì fi hàn pé Olúwa ń ṣiṣẹ́ nípasẹ̀ wọn.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: Lo ‘Olúwa’ nìkan gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ti ṣe.
  alternative: ‘Olúwa Jésù’ tàbí ‘Ọlọ́run.’
  rationale: Àyíká ìtàn lè tọ́ka sí Jésù tí ó jíǹde, ṣùgbọ́n ẹsẹ náà kò fi orúkọ ‘Jésù’ sí i; fífi oyè náà sílẹ̀ pa ìwọ̀n ọ̀rọ̀ orísun mọ́.
- issue: Agbára ìtumọ̀ ἐπὶ τῷ κυρίῳ
  choice: ‘fún Olúwa’ nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìsàlẹ̀.
  alternative: ‘nínú Olúwa’ tàbí ‘ní ìgbẹ́kẹ̀lé Olúwa.’
  rationale: Àpólà náà lè fi ẹni tí wọ́n ń sìn, ìpìlẹ̀ ìgboyà wọn, tàbí ìbáṣepọ̀ wọn pẹ̀lú Olúwa hàn. Àlàyé ìsàlẹ̀ kò jẹ́ kí ìtumọ̀ yìí di ọ̀nà kan ṣoṣo.
- issue: Ọ̀nà tí Olúwa fi jẹ́rìí sí ọ̀rọ̀ oore-ọ̀fẹ́
  choice: Àwọn àmì àti iṣẹ́ ìyanu jẹ́ ọ̀nà tí Olúwa fi ń jẹ́rìí sí ọ̀rọ̀ náà.
  alternative: Kí a ka àwọn àmì náà sí iṣẹ́ àwọn aposteli nìkan.
  rationale: Àwọn participle Gíríìkì méjèèjì ń tọ́ka sí Olúwa; àwọn aposteli jẹ́ ohun èlò nípasẹ̀ ọwọ́ wọn, ṣùgbọ́n Olúwa ni olùfúnni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo ‘oore-ọ̀fẹ́’ fún χάρις, ‘àmì àti iṣẹ́ ìyanu’ fún àkójọpọ̀ σημεῖα καὶ τέρατα, a sì pa àwòrán ‘nípasẹ̀ ọwọ́ wọn’ mọ́. A pín gbólóhùn Gíríìkì gígùn náà sí gbólóhùn méjì fún ìṣàn Yorùbá tó dára, láìyí ẹni tí ó ń jẹ́rìí tàbí ẹni tí ó ń mú àwọn iṣẹ́ ìyanu ṣẹlẹ̀ padà.
