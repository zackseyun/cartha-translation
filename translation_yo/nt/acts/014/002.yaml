id: ACT.14.2
reference: Acts 14:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Júù tí wọ́n kọ̀ láti gbàgbọ́[a] ru àwọn tí kì í ṣe Júù sókè, wọ́n sì mú ọkàn àwọn tí kì í ṣe Júù burú sí àwọn arákùnrin[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n jẹ́ aláìgbọ́ràn.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí kíkọ̀ láti gba ìhìn náà gbọ́; nínú àyíká yìí, ó ṣeé ṣe kó ń tọ́ka sí kíkọ ìhìn rere.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ọkàn àwọn tí kì í ṣe Júù”; níhìn-ín, ìtumọ̀ rẹ̀ ni ìhùwàsí inú tàbí èrò wọn.
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí “àwọn arákùnrin” níhìn-ín tọ́ka sí gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: tí wọ́n kọ̀ láti gbàgbọ́
  rationale: Nínú àyíká ìwàásù Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà tọ́ka sí kíkọ̀ láti gba iṣẹ́ ìránṣẹ́ náà gbọ́, kì í ṣe àìgbọ́ràn lásán; ‘kọ̀ láti’ tún pa agbára ìfẹ́ inú ọ̀rọ̀ náà mọ́.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí túmọ̀ sí àwọn Júù kan nínú àwùjọ sínágọ́gù tí wọ́n tako iṣẹ́ ìránṣẹ́ náà, kì í ṣe gbogbo àwọn Júù.
- source_word: ἐπήγειραν
  choice: ru ... sókè
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì sọ ìmúnisìn tàbí ìmúnibínú sí ìtakò.
- source_word: ἐκάκωσαν
  choice: ba ... jẹ́
  rationale: Pẹ̀lú ‘ọkàn’ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí, ó túmọ̀ sí yí ìwà inú wọn padà sí ibi tàbí mú wọn ní èrò búburú.
- source_word: τὰς ψυχὰς
  choice: ọkàn wọn
  rationale: ‘Ọkàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìhùwàsí inú tàbí èrò ẹni nípa ẹlòmíràn, láìfi ẹ̀kọ́ pàtó kan nípa ẹ̀mí kún un.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú ìyàtọ̀ Júù àti àwọn tí kì í ṣe Júù ní Ìṣe Àwọn Aposteli, èyí jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tí a mọ̀ fún àwọn aláìjẹ́-Júù.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: sí àwọn arákùnrin
  rationale: Ó tẹ̀lé àwòrán ọ̀rọ̀ Gíríìkì tó jẹ́ akọ ní ọ̀pọ̀, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó kó gbogbo àwọn onígbàgbọ́ pọ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφῶν nígbà tí ó lè tọ́ka sí àwùjọ Kristẹni tó ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, ṣùgbọ́n lílò rẹ̀ nínú àwùjọ Kristẹni lè gba àwọn obìnrin pẹ̀lú. Ọ̀rọ̀ pàtàkì pa ìrísí orísun mọ́, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ àkópọ̀ mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ ti ẹ̀dá. Gbólóhùn náà pa ìtakò àti àìdájú ti ọ̀rọ̀ Gíríìkì mọ́, kò sì fi èrò ẹ̀sìn ẹgbẹ́ kan kún un.
