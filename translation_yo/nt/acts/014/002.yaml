revisions:
- from: Ṣùgbọ́n àwọn Júù tí wọ́n kọ̀ láti gbàgbọ́[a] ru àwọn Kèfèrí sókè, wọ́n sì ba ọkàn wọn jẹ́[b] sí àwọn arákùnrin[c].
  to: Ṣùgbọ́n àwọn Júù tí wọ́n kọ̀ láti gbàgbọ́[a] ru àwọn tí kì í ṣe Júù sókè, wọ́n sì mú ọkàn àwọn tí kì í ṣe Júù burú sí àwọn arákùnrin[c].[b]
  rationale: The revision resolves the ambiguous Yoruba pronoun by repeating the Greek referent, “the Gentiles,” and makes the hostile effect explicit as an embittered disposition toward the believers. It uses a neutral contextual Yoruba expression for Gentiles and corrects the lexical explanation in footnote a. Footnote b is retained and its anchor is placed after the clause that renders τὰς ψυχὰς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrastive δέ, the specific opposing Jewish group, their incitement of the Gentiles, and the hostile effect directed against the fellow believers. However, the possessive pronoun in “ba ọkàn wọn jẹ́” can naturally be read as referring to the Jews rather than the Gentiles; the Greek explicitly identifies the Gentiles as those whose inner disposition was adversely affected.
  naturalness: “Ba ọkàn wọn jẹ́ sí” is understandable but less idiomatic and has an ambiguous antecedent. Explicitly naming the Gentiles and using “mú ọkàn ... burú sí” communicates the intended hostile disposition naturally. “Àwọn tí kì í ṣe Júù” is a clear, neutral modern rendering in this Jewish/Gentile contrast, avoiding the potentially pejorative contemporary associations of “Kèfèrí.”
  terminology: “Àwọn Júù” and “àwọn arákùnrin” are appropriate. The footnote for ἀπειθήσαντες should say “gba ìhìn náà gbọ́,” not “gba iṣẹ́ ìránṣẹ́ náà gbọ́,” since one believes a message, while one accepts or obeys a ministry/work. The inclusive explanatory note for “arákùnrin” appropriately preserves the likely collective Christian referent without imposing it on the main text.
  issues:
  - severity: medium
    issue: Ambiguous referent of “wọn” in “ba ọkàn wọn jẹ́.”
    rationale: The immediately preceding subject is “àwọn Júù,” whereas τὰς ψυχὰς τῶν ἐθνῶν explicitly refers to the Gentiles’ inner disposition. The Yoruba should make that referent explicit.
  - severity: low
    issue: “Kèfèrí” can carry pejorative or religiously polemical associations in contemporary Yoruba.
    rationale: Although traditional biblical usage exists, “àwọn tí kì í ṣe Júù” conveys the contextual sense of τῶν ἐθνῶν clearly and neutrally.
  - severity: low
    issue: Footnote a uses an unnatural object with “gbọ́.”
    rationale: The phrase should refer to believing “ìhìn náà” or “ìhìn rere,” rather than believing “iṣẹ́ ìránṣẹ́ náà.”
  revised_text: Ṣùgbọ́n àwọn Júù tí wọ́n kọ̀ láti gbàgbọ́[a] ru àwọn tí kì í ṣe Júù sókè, wọ́n sì mú ọkàn àwọn tí kì í ṣe Júù burú sí àwọn arákùnrin[c].[b]
