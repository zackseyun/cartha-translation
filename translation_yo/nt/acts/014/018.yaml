  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: yo
  text: Pẹ̀lú gbogbo ọ̀rọ̀ wọ̀nyí, pẹ̀lú ìṣòro ni wọ́n fi dá ogunlọ́gọ̀ ènìyàn náà dúró kí wọ́n má bàa rú ẹbọ fún wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Àní bí wọ́n tilẹ̀ ń sọ àwọn nǹkan wọ̀nyí
  rationale: Nínú àyíká yìí, καί ní agbára ìtẹnumọ́, ó sì fi hàn pé ọ̀rọ̀ wọn pàápàá kò rọrùn láti dá ogunlọ́gọ̀ náà dúró; “àní ... tilẹ̀” mú èyí jáde ní Yorùbá àdánidá.
- source_word: μόλις κατέπαυσαν
  choice: ó ṣòro fún wọn láti dá ... dúró
  rationale: μόλις túmọ̀ sí pé wọ́n fẹ́rẹ̀ẹ́ má lè ṣe é tàbí pé pẹ̀lú ìṣòro ni wọ́n fi ṣe é; ọ̀rọ̀ yìí pa agbára ìtumọ̀ “barely/scarcely” mọ́.
- source_word: τοὺς ὄχλους
  choice: àwọn ogunlọ́gọ̀ náà
  rationale: Ìṣùpọ̀ ὄχλοι ń tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; “àwọn ogunlọ́gọ̀” pa nọ́ńbà ìṣùpọ̀ orísun mọ́.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: láti má ṣe rú ẹbọ sí wọn
  rationale: Ẹ̀ka infinitive yìí ṣàlàyé ohun tí wọ́n dá ogunlọ́gọ̀ dúró láti ṣe; θύειν ní àyíká ẹ̀sìn túmọ̀ sí rú ẹbọ, αὐτοῖς sì jẹ́ “sí wọn.”
theological_decisions:
- issue: Àwọn ẹni tí αὐτοῖς (“wọn”) ń tọ́ka sí
  choice: Pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí “wọn”
  alternative: Ṣàlàyé rẹ̀ ní kedere gẹ́gẹ́ bí “Pọ́ọ̀lù àti Bánábà”
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn, ẹsẹ̀ Gíríìkì lo ọ̀rọ̀ arọ́pò-orúkọ; pípa “wọn” mọ́ yàgò fún fífi àlàyé kún ara ẹsẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. “Rú ẹbọ” jẹ́ gbólóhùn Bíbélì tí ó wọ́pọ̀, tí ó sì ṣì ṣeé lóye.
