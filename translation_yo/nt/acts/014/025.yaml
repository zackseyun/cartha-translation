  to: Lẹ́yìn tí wọ́n ti sọ ọ̀rọ̀ náà ní Pẹ́gà,[a] wọ́n sì sọ̀kalẹ̀ lọ sí Atalíà.
  rationale: Àtúnṣe náà kan ipò àsopọ̀ ‘sì’ nìkan, kí ó lè so ìṣe pàtàkì ‘wọ́n sọ̀kalẹ̀ lọ’ mọ́ ìtàn gẹ́gẹ́ bí καί ṣe ń ṣiṣẹ́. A tún ṣe àtúnṣe ìsàlẹ̀ sí ọ̀nà tí ó fi ìtumọ̀ participle míì hàn ní tòótọ́. Ìtumọ̀ ẹsẹ̀ náà kò yí padà.
