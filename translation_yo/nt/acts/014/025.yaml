review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń mú ìtẹ̀síwájú ìṣe participle λαλήσαντες (‘lẹ́yìn tí wọ́n ti sọ’) àti ìṣe pàtàkì κατέβησαν (‘wọ́n sọ̀kalẹ̀ lọ’) hàn dáadáa. ‘Ọ̀rọ̀ náà’ bá τὸν λόγον mu, láì ṣàfikún ‘ti Olúwa’; ‘ní Pẹ́gà’ àti ‘sí Atalíà’ sì tọ́ fún àwọn gbolohun ibi náà.
  naturalness: '‘Sì’ kò rọrùn ní àárín ‘Lẹ́yìn tí wọ́n …’ nínú àkọsílẹ̀ lọwọlọwọ. Ní Yorùbá òde òní, a fi í dara sí ìṣe pàtàkì lẹ́yìn kókó-ọrọ: ‘wọ́n sì sọ̀kalẹ̀ lọ.’ Èyí pa ipa καί mọ́, ó sì jẹ́ kí gbolohun náà ṣàn dáadáa.'
  terminology: ‘Ọ̀rọ̀ náà’ jẹ́ ìyàn tó yẹ fún λόγος nínú àyíká iṣẹ́ ìwàásù yìí. Àwọn orúkọ ibi Pẹ́gà àti Atalíà ni a pa mọ́ gẹ́gẹ́ bí a ti lò nínú ìwé-àfọwọ́kọ náà.
  issues:
