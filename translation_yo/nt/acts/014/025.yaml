    issue: Ipo ‘sì’ nínú gbolohun
    rationale: ‘Wọ́n sì ti sọ’ lè dà bíi pé ‘sì’ ń so ìṣe participle pọ̀; ṣùgbọ́n καί ń so ìṣẹ̀lẹ̀ ẹsẹ̀ náà mọ́ ìtàn. Fífi ‘sì’ sí iwájú ‘sọ̀kalẹ̀’ jẹ́ Yorùbá àdánidá sí i.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ lọwọlọwọ kì í ṣe àṣàyàn tó yàtọ̀ ní kedere
    rationale: ‘Nígbà tí wọ́n ti sọ’ tún ń ṣe ìtumọ̀ participle náà ní ọ̀nà gbolohun-ìgbà. Àṣàyàn ‘Lẹ́yìn sísọ…’ fi ìkọ̀ participial/nominal hàn ní kedere, ó sì bá ‘having spoken’ mu.
