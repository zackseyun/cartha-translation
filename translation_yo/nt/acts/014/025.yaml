lexical_decisions:
- source_word: λαλήσαντες
  choice: lẹ́yìn tí wọ́n ti sọ
  rationale: Aorist participle náà tọ́ka sí ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘after speaking’ mọ́ láì fi agbára ‘kéde’ kún un.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa ọ̀nà ìsọ Lucan tí ó ń tọ́ka sí iṣẹ́ ìwàásù Kristẹni mọ́; ‘ìhìn náà’ ṣeé ṣe, ṣùgbọ́n ó lè sọ àṣà ọ̀rọ̀ orísun di pẹlẹbẹ, ‘ọ̀rọ̀ Olúwa’ sì ní àfikún tí kò sí nínú Gíríìkì.
- source_word: ἐν Πέργῃ
  choice: ní Pẹ́gà
  rationale: ‘Ní’ ni ìtumọ̀ àdánidá fún ἐν pẹ̀lú orúkọ ìlú.
- source_word: κατέβησαν
  choice: wọ́n sọ̀kalẹ̀ lọ
  rationale: Ó fi ìtumọ̀ ìrìn sí ibi tí ó rẹlẹ̀ sí i hàn, ó sì bá ojú-ìwòye ìtàn mu láì túmọ̀ ọ́ sí wíwá sí ọ̀dọ̀ olùsọ̀rọ̀.
- source_word: εἰς Ἀττάλειαν
  choice: sí Atalíà
  rationale: ‘Sí’ ni Yorùbá àdánidá fún ibi tí wọ́n ń lọ.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ẹsẹ̀ náà mọ́ ìtàn ìrìn-àjò tó ń tẹ̀ síwájú, láì fi ìtumọ̀ àkókò míì kún καί.
