id: ACT.14.14
reference: Acts 14:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn àpọ́sítélì náà, Bánábà àti Pọ́ọ̀lù, gbọ́, wọ́n fa aṣọ wọn ya[a], wọ́n sì sá wọ àárín ọ̀pọ̀ ènìyàn náà[b], wọ́n ń ké pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fífa aṣọ ẹni ya jẹ́ àṣà ìgbà náà láti fi ìbànújẹ́, ìpayà, tàbí àtakò sí ọlá tí ó lè jẹ́ ọ̀rọ̀-òdì sí Ọlọ́run hàn.
    reason: cultural_note
  - marker: b
    text: Tàbí, “wọ́n sì fò wọ àárín ọ̀pọ̀ ènìyàn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà ní agbára àkókò níhìn-ín; ọ̀rọ̀ yìí fi hàn pé ohun tí wọ́n gbọ́ ló ṣáájú ìhùwàsí wọn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora díẹ̀ hàn láàárín ohun tí ọ̀pọ̀ ènìyàn fẹ́ ṣe àti ìhùwàsí àwọn àpọ́sítélì.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: àwọn àpọ́sítélì náà, Bánábà àti Pọ́ọ̀lù
  rationale: Ó pa ìṣọ̀kan apposition Gíríìkì mọ́, ó sì dá Bánábà àti Pọ́ọ̀lù mọ̀ gẹ́gẹ́ bí àwọn àpọ́sítélì nínú àyíká yìí.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: wọ́n fa aṣọ wọn ya
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífa aṣọ ya, ìṣe tí ó ń fi ìbànújẹ́, ìpayà tàbí àtakò líle hàn.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: wọ́n sì sá wọ àárín ọ̀pọ̀ ènìyàn náà
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí ìṣíkiri òjijì tó lágbára; εἰς sì tọ́ka sí wíwọ inú àwùjọ náà. ‘Sá wọ’ jẹ́ èdè Yorùbá àdánidá tí ó fi ìkánjú hàn láìfi ‘jáde’ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: κράζοντες
  choice: wọ́n ń ké pé
  rationale: Present participle náà fi hàn pé wọ́n ń pariwo nígbà tí wọ́n ń wọ inú ọ̀pọ̀ ènìyàn; ‘pé’ ṣí ọ̀rọ̀ sí ohun tí wọ́n sọ ní ẹsẹ tó tẹ̀ lé.
theological_decisions:
- issue: Ìtọ́kasí ‘àwọn àpọ́sítélì’ sí Bánábà àti Pọ́ọ̀lù
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn àpọ́sítélì náà, Bánábà àti Pọ́ọ̀lù.’
  alternative: Ṣàlàyé ‘àpọ́sítélì’ gẹ́gẹ́ bí ‘àwọn aṣojú’ tàbí dín un mọ́ àwọn Méjìlá nìkan.
  rationale: Gíríìkì dá Bánábà àti Pọ́ọ̀lù mọ̀ pẹ̀lú ‘àwọn àpọ́sítélì’ ní àyíká yìí. Ìtumọ̀ náà kò gbọ́dọ̀ yanju àríyànjiyàn ẹ̀kọ́ nípa bí ọ̀rọ̀ náà ṣe gbòòrò ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ọ̀pọ̀ ènìyàn’ dára ju ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tó le ní ìtumọ̀ odi lọ; ‘sá wọ’ sì mú ìkánjú ἐξεπήδησαν jáde láìfi ibi tí wọ́n ti ‘jáde’ kún ẹsẹ náà.
