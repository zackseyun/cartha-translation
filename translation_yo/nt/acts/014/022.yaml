id: ACT.14.22
reference: Acts 14:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: yo
  text: Wọ́n ń mú ọkàn àwọn ọmọ-ẹ̀yìn náà lágbára[a], wọ́n ń gba wọn níyànjú láti máa dúró ṣinṣin nínú ìgbàgbọ́ náà[b], wọ́n sì ń sọ pé, “Nípasẹ̀ ọ̀pọ̀ ìpọ́njú[c] ni a gbọdọ̀ wọ ìjọba Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ọkàn’ níbí tún lè tọ́ka sí ìwà-inú àwọn ọmọ-ẹ̀yìn tàbí sí àwọn ọmọ-ẹ̀yìn fúnra wọn gẹ́gẹ́ bí odidi.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ìgbàgbọ́.” Àrokò Gíríìkì náà ṣe àtìlẹ́yìn fún “ìgbàgbọ́ náà,” ṣùgbọ́n ọ̀rọ̀ náà tún lè ṣe àpèjúwe ìgbàgbọ́ ní gbogbogbò.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ọ̀pọ̀ ìnira.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìpọ́njú, ìnira, tàbí wàhálà líle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: ń fún ... ní okun
  rationale: Ọ̀rọ̀ náà ń ṣàpèjúwe bí Pọ́ọ̀lù àti Bánábà ṣe ń mú àwọn ọmọ-ẹ̀yìn dúró ṣinṣin sí i. ‘Fún ... ní okun’ jẹ́ Yorùbá àdánidá, kò sì fi ìtumọ̀ ìdásílẹ̀ ẹgbẹ́ kan kún un.
- source_word: τὰς ψυχὰς
  choice: ọkàn
  rationale: Níbí, ψυχή tọ́ka sí inú ẹni tàbí ẹni náà gẹ́gẹ́ bí odidi; ‘ọkàn’ pa ìwọ̀n tẹ̀mí rẹ̀ mọ́ láìfipá sọ pé ara àti ẹ̀mí jẹ́ ohun méjì tí ó yà pátápátá.
- source_word: τῶν μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwọn tí wọ́n ń kọ́ lẹ́sẹ̀ olùkọ́ tí wọ́n sì ń tẹ̀ lé e.
- source_word: παρακαλοῦντες
  choice: ń gba wọn níyànjú
  rationale: Ó mú ìṣírí àti ìrọ̀rùn onífẹ̀ẹ́ tí ó wà nínú ọ̀rọ̀ Gíríìkì náà jáde, nígbà tí ó tún pa agbára ìpè láti dúró ṣinṣin mọ́.
- source_word: ἐμμένειν
  choice: láti máa dúró ṣinṣin
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti máa bá a lọ tàbí láti dúró nínú ohun kan. ‘Máa dúró ṣinṣin’ jẹ́ àdánidá, ó sì fi ìfaradà hàn.
- source_word: τῇ πίστει
  choice: nínú ìgbàgbọ́ náà
  rationale: Àrokò Gíríìkì náà ṣe àtìlẹ́yìn fún ìtumọ̀ pàtó, ìyẹn ìgbàgbọ́ tí àwọn ọmọ-ẹ̀yìn ti gbà; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbogbogbò ‘ìgbàgbọ́’ sílẹ̀.
- source_word: διὰ πολλῶν θλίψεων
  choice: gba inú ọ̀pọ̀lọpọ̀ ìpọ́njú kọjá
  rationale: Gbólóhùn yìí pa èrò líla àárín ọ̀pọ̀ ìnira mọ́, ó sì jẹ́ Yorùbá tí ó ṣe àwòrán kedere láìsọ pé ìpọ́njú fúnra rẹ̀ ni ó ń jèrè ìjọba.
- source_word: δεῖ ἡμᾶς
  choice: A ní láti
  rationale: Èyí pa agbára dandan ti δεῖ mọ́ ní Yorùbá àdánidá, láìṣàfikún àlàyé nípa ohun tí ó fa dandan náà.
- source_word: εἰσελθεῖν εἰς
  choice: wọ
  rationale: ‘Wọ’ ni ọ̀rọ̀ Yorùbá àdánidá fún lílọ sínú ibi tàbí ipò kan; kò nílò àfikún ọ̀rọ̀ tí yóò tún ìtumọ̀ náà ṣe.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí a mọ̀ dáadáa, ó sì lè gbé ìtumọ̀ ilẹ̀ ọba àti ìṣàkóso Ọlọ́run papọ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις pẹ̀lú àrokò pàtó
  choice: ìgbàgbọ́ náà
  alternative: ìgbàgbọ́
  rationale: Àrokò τῇ ń tọ́ka sí ohun pàtó, ó sì ṣeé ṣe kí ó túmọ̀ sí ìgbàgbọ́ tí àwọn ọmọ-ẹ̀yìn ti gba. Àlàyé [b] fi ìtumọ̀ gbogbogbò sílẹ̀ láìfi èrò ẹ̀kọ́ ìsìn tí ó dé lẹ́yìn náà wọ ọ̀rọ̀ náà.
- issue: Agbára dandan nínú δεῖ
  choice: A ní láti ... wọ ìjọba Ọlọ́run
  alternative: Ó ṣe pàtàkì fún wa láti ... wọ ìjọba Ọlọ́run
  rationale: ‘A ní láti’ pa agbára dandan mọ́, ṣùgbọ́n kò sọ bóyá dandan náà jẹ́ àṣẹ, ètò àyànmọ́, tàbí ọ̀nà láti jèrè ìgbàlà.
- issue: Ìbáṣepọ̀ ìpọ́njú àti wíwọ ìjọba
  choice: gba inú ... ìpọ́njú kọjá wọ
  alternative: lẹ́yìn ọ̀pọ̀lọpọ̀ ìpọ́njú ... wọ
  rationale: διὰ túmọ̀ sí líla ‘nípasẹ̀’ tàbí ‘gba inú’ ohun kan. A kò lo ‘lẹ́yìn’ tàbí ‘kí a tó’ nítorí wọn lè fi ìtẹ̀lé àkókò tí ó le ju ohun tí Gíríìkì sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìtẹ̀sí participle Gíríìkì ni a fi ‘wọ́n ń ...’ hàn, ‘wọ́n sì ń sọ pé’ sì mú ὅτι wọ inú Yorùbá pípé. Àyọlò tààrà ni a lò fún gbólóhùn tí wọ́n ń sọ, láìfi ẹni tí wọ́n ń bá sọ tàbí àlàyé ẹ̀kọ́ ìsìn mìíràn kún un.
