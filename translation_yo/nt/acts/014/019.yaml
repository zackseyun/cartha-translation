- from: Ṣùgbọ́n àwọn Júù kan wá láti Áńtíókù àti Ikóníónì. Nígbà tí wọ́n ti yí àwọn ogunlọ́gọ̀ ènìyàn náà lọ́kàn, tí wọ́n sì sọ Pọ́ọ̀lù ní òkúta, wọ́n wọ́ ọ jáde kúrò nínú ìlú, nítorí wọ́n rò pé òkú ni.[a]
  to: Ṣùgbọ́n àwọn Júù wá láti Áńtíókù àti Ikóníónì; lẹ́yìn tí wọ́n ti yí ogunlọ́gọ̀ ènìyàn náà lọ́kàn, tí wọ́n sì sọ Pọ́ọ̀lù ní òkúta, wọ́n fa á sí òde ìlú, nítorí wọ́n rò pé ó ti kú.[a]
  rationale: Àtúnṣe náà yọ ìfikún tí kò wà nínú Gíríìkì kúrò, ó sì rọ́pò ọ̀rọ̀ tí kò ṣe kedere fún ‘dragged’ pẹ̀lú ọ̀nà Yorùbá tó hàn gbangba. Ó tún fi ìtẹ̀lé àwọn participle Gíríìkì hàn dáadáa, nígbà tí ó pa ìdánilójú-kòsí nípa bóyá Pọ́ọ̀lù kú ní tòótọ́ mọ́.
