source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Júù wá láti Áńtíókù àti Ikóníónì; lẹ́yìn tí wọ́n ti yí ogunlọ́gọ̀ ènìyàn náà lọ́kàn, tí wọ́n sì sọ Pọ́ọ̀lù ní òkúta, wọ́n fa á sí òde ìlú, nítorí wọ́n rò pé ó ti kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n rò pé òkú ni.” Gíríìkì náà sọ ohun tí wọ́n rò; kò sọ ní tààràtà pé Pọ́ọ̀lù kú ní tòótọ́.
    reason: Ó fi àṣàyàn ìtumọ̀ fún perfect infinitive τεθνηκέναι hàn, ó sì pa ìyàtọ̀ mọ́ láàárín ohun tí àwọn olùkọlù rò àti ohun tí ó ṣẹlẹ̀ ní tòótọ́.
lexical_decisions:
- source_word: Ἐπῆλθαν
  choice: wá
  rationale: Ó sọ pé àwọn alátakò náà dé láti àwọn ìlú mìíràn, ó sì bá ìṣàn ìtàn Yorùbá mu láìfi ìkọlù òjijì kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó tako ìdáhùn rere inú àyíká ọ̀rọ̀ tó ṣáájú hàn.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù kan
  rationale: ‘Àwọn Júù’ ni ìtumọ̀ tó tọ́ nínú àyíká yìí; ‘kan’ jẹ́ kó ṣe kedere pé kì í ṣe gbogbo àwọn Júù ni ẹsẹ náà ń sọ̀rọ̀ nípa wọn.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Nígbà tí wọ́n ti yí àwọn ogunlọ́gọ̀ ènìyàn náà lọ́kàn
  rationale: Ó pa ìṣe tó ṣáájú mọ́, ó sì túmọ̀ ìyíni-lọ́kàn ní Yorùbá àdánidá láìsọ ohun tí wọ́n fi yí wọn lọ́kàn.
- source_word: ὄχλους
  choice: àwọn ogunlọ́gọ̀ ènìyàn náà
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí àwọn àwùjọ ènìyàn tí ó péjọ.
- source_word: λιθάσαντες
  choice: tí wọ́n sì sọ Pọ́ọ̀lù ní òkúta
  rationale: Ó fi ìsọ-ènìyàn-ní-òkúta hàn gẹ́gẹ́ bí ìṣe tí ó ṣẹlẹ̀ ṣáájú kí wọ́n tó wọ́ ọ jáde.
- source_word: ἔσυρον
  choice: wọ́n wọ́ ọ
  rationale: Ọ̀rọ̀ yìí sọ ìfipá wọ́ ènìyàn lọ ní kedere, ó sì bá imperfect Gíríìkì mu láìjẹ́ kí gbolohun di líle.
- source_word: ἔξω τῆς πόλεως
  choice: jáde kúrò nínú ìlú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n mú un dé ibi tí ó wà lẹ́yìn ààlà ìlú.
- source_word: νομίζοντες
  choice: nítorí wọ́n rò pé
  rationale: Ó pa ìrònú tàbí àròsọ àwọn olùkọlù náà mọ́, kò sì sọ ọ́ di ohun tí ó dájú.
- source_word: τεθνηκέναι
  choice: òkú ni
  rationale: Ó fi ipò ikú tí wọ́n rò pé Pọ́ọ̀lù wà nínú rẹ̀ hàn ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi àṣàyàn ‘ó ti kú’ hàn.
theological_decisions:
- issue: Bóyá ẹsẹ náà sọ pé Pọ́ọ̀lù kú ní tòótọ́ tàbí pé àwọn olùkọlù rẹ̀ nìkan ló rò bẹ́ẹ̀
  choice: wọ́n rò pé òkú ni
  alternative: Pọ́ọ̀lù kú, lẹ́yìn náà ó sì tún jí
  rationale: Gíríìkì νομίζοντες αὐτὸν τεθνηκέναι ròyìn ohun tí àwọn olùkọlù náà gbà pé ó ṣẹlẹ̀; kò sọ ní tààràtà pé Pọ́ọ̀lù kú ní tòótọ́. Ìtumọ̀ náà kò pinnu ọ̀ràn tí orísun kò pinnu.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pín gbolohun náà sí méjì fún ìmúlẹ̀ kedere, ṣùgbọ́n a pa ìtẹ̀lé àwọn ìṣe àti ìdí tí wọ́n fi wọ́ Pọ́ọ̀lù jáde mọ́.
