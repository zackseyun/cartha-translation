  source_fidelity: Ìtumọ̀ náà pa ìtẹ̀lé ìṣẹ̀lẹ̀, àwọn ibi tí àwọn Júù náà ti wá, ìyí-lọ́kàn ogunlọ́gọ̀, ìsọ Pọ́ọ̀lù ní òkúta, àti ìrònú wọn nípa ikú rẹ̀ mọ́. Síbẹ̀, ‘kan’ nínú ‘àwọn Júù kan’ jẹ́ ìfikún tí Gíríìkì kò sọ, àti ‘wọ́n wọ́ ọ’ kì í fi ìtumọ̀ ìfipá ti ἔσυρον hàn kedere bí ‘wọ́n fa á’ ṣe ń ṣe.
