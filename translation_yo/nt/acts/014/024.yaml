  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti la Pisídíà kọjá, wọ́n dé sí Pamfílíà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí ń tẹ ìtàn ìrìn-àjò náà síwájú lọ́nà àdánidá nínú Yorùbá.
- source_word: διελθόντες
  choice: Nígbà tí wọ́n ti la ... kọjá
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtumọ̀ yìí mú ìbáṣepọ̀ àkókò náà hàn ní Yorùbá tó ṣe kedere.
- source_word: τὴν Πισιδίαν
  choice: Pisídíà
  rationale: Orúkọ agbègbè ni; a kọ ọ́ ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Gíríìkì ní Yorùbá.
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Nínú ìtàn ìrìn-àjò, ‘dé’ jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá láti sọ pé wọ́n wá sí ibi tí a darúkọ.
- source_word: εἰς τὴν Παμφυλίαν
  choice: sí Pamfílíà
  rationale: ‘sí’ fi ìtọ́sọ́nà àti dídé ibi kan hàn ní Yorùbá; ó bá iṣẹ́ εἰς mu láì mú gbolóhùn náà le.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàlágba tó mọ́gbọ́n dání, tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì ṣe àkọ̀kọ́ orúkọ agbègbè ní ọ̀nà Yorùbá.
