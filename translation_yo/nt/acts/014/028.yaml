  text: And they stayed with the disciples for no little time[a].
translation:
  language: yo
  text: Wọ́n sì dúró pẹ̀lú àwọn ọmọ-ẹ̀yìn fún ìgbà tí kò kéré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà àdánidá sí i, “fún ìgbà pípẹ́” tàbí “fún àkókò gígùn.” Ọ̀rọ̀ Gíríìkì lo litotes: “ìgbà tí kò kéré.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: wọ́n dúró
  rationale: Ìṣe aláìparí náà ń tọ́ka sí wíwà tí ó ń bá a lọ ní ibì kan; “wọ́n dúró” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀; “sì” bá ìtẹ̀síwájú ìtàn mu ní Yorùbá.
- source_word: χρόνον οὐκ ὀλίγον
  choice: fún ìgbà tí kò kéré
  rationale: Èyí pa àkànlò-èdè litotes Gíríìkì, “ìgbà tí kò kéré,” mọ́, ó sì ṣì ṣeé lóye ní Yorùbá òde òní.
- source_word: σὺν τοῖς μαθηταῖς
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn
  rationale: σύν pẹ̀lú ọ̀rọ̀ inú dative túmọ̀ sí “pẹ̀lú”; ní àyíká ọ̀rọ̀ yìí, àwọn ọmọ-ẹ̀yìn ni àwùjọ àwọn onígbàgbọ́ ibẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàlágba, ọ̀wọ̀, tí ó ṣeé lóye fún òǹkàwé òde òní; a fi àmì ohùn sí ibi tí ó bá yẹ. Ìtumọ̀ náà tẹ̀ lé ìṣètò Gíríìkì níwọ̀n tí ó fi jẹ́ àdánidá, ó sì pa litotes orísun mọ́.
