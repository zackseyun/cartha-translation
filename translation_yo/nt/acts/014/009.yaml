  terminology: '''Ìgbàgbọ́,'' ''ìmúláradá,'' and ''ìgbàlà'' are suitable Standard Yoruba theological and narrative terms. The footnote wording is adjusted slightly so that the healing gloss for the Greek verb is idiomatic Yoruba.'
