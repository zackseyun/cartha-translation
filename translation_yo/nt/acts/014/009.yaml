id: ACT.14.9
reference: Acts 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: yo
  text: Ọkùnrin yìí fetí sí Pọ́ọ̀lù bí ó ti ń sọ̀rọ̀. Pọ́ọ̀lù tẹjú mọ́ ọn, ó sì rí i pé ọkùnrin náà ní ìgbàgbọ́ láti rí ìmúláradá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti rí ìgbàlà.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “gbà là” tàbí “mú ènìyàn lára dá”; nínú àyíká yìí, ìmúláradá ara ni ó hàn gbangba jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò aṣọ́ka yìí tọ́ka sí ọkùnrin arọ tí ẹsẹ̀ rẹ̀ ti ń bá a lọ láti inú ìyá rẹ̀ ní ẹsẹ tó ṣáájú; ‘Ọkùnrin yìí’ mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ἤκουσεν
  choice: fetí sí
  rationale: Nínú àyíká yìí, ọkùnrin náà kò kàn gbọ́ ohùn Pọ́ọ̀lù; ó ń tẹ́tí sí ọ̀rọ̀ rẹ̀. ‘Fetí sí’ jẹ́ ọ̀nà àdánidá láti fi ìgbọ́ràn pẹ̀lú àkíyèsí hàn.
- source_word: λαλοῦντος
  choice: bí ó ti ń sọ̀rọ̀
  rationale: Ó fi ìṣe tí Pọ́ọ̀lù ń ṣe ní àkókò tí ọkùnrin náà ń fetí sí i hàn, ó sì dára fún ọ̀rọ̀ ìkéde ní èdè Yorùbá.
- source_word: ἀτενίσας
  choice: tẹjú mọ́ ọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwo ẹnì kan pẹ̀lú àkíyèsí gidigidi; ‘tẹjú mọ́ ọn’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere láì sọ pé ó kan ń yọjú sí i lọ́nà àìtọ́.
- source_word: ἰδὼν
  choice: rí i
  rationale: Èyí pa àwòrán ìríran inú ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún ní ìtumọ̀ mímòye ohun tó wà lọ́kàn ọkùnrin náà.
- source_word: ἔχει πίστιν
  choice: ó ní ìgbàgbọ́
  rationale: Πίστις níbí tọ́ka sí ìgbẹ́kẹ̀lé ọkùnrin náà pé agbára Ọlọ́run lè ràn án lọ́wọ́, kì í ṣe sí ìṣòtítọ́ rẹ̀.
- source_word: τοῦ σωθῆναι
  choice: láti rí ìmúláradá
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà lè túmọ̀ sí gbígbàlà ní ìtumọ̀ gbòòrò, ìṣẹ̀lẹ̀ tó tẹ̀ lé e jẹ́ ìmúláradá ara ọkùnrin arọ náà. ‘Rí ìmúláradá’ jẹ́ ọ̀nà Yorùbá tó dára láti sọ ìṣe afarahẹ náà.
theological_decisions:
- issue: Ìtumọ̀ σωθῆναι nínú ìtàn ìmúláradá
  choice: ìmúláradá ara (‘láti rí ìmúláradá’)
  alternative: ìgbàlà ní ìtumọ̀ gbòòrò (‘láti rí ìgbàlà’)
  rationale: Àyíká ìtàn náà àti ẹsẹ tó tẹ̀ lé e tọ́ka sí mímú ara ọkùnrin arọ náà lára dá. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́, kí ìdánilójú ẹ̀kọ́ ìgbàlà tí ọ̀rọ̀ náà lè ní má bàjẹ́.
translation_notes:
  register: A lo èdè Yorùbá àfẹnusọ òde òní tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A pín gbólóhùn Gíríìkì sí méjì, a sì tún orúkọ Pọ́ọ̀lù sọ, nítorí kí ẹni tí arọ́pò-orúkọ náà tọ́ka sí má bà a dàrú ní Yorùbá. Àmì ohùn ni a fi sí gbogbo ibi tí ó yẹ.
