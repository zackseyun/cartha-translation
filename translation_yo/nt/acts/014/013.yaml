source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: yo
  text: Àlùfáà Súúsì, ẹni tí tẹ́ńpìlì rẹ̀ wà níwájú ìlú[b], mú àwọn akọ màlúù àti àwọn òdòdó tí a hun yí ká[a] wá sí àwọn ẹnubodè; òun àti àwọn èrò sì fẹ́ rú ẹbọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “àwọn adé òdòdó” tàbí “àwọn ọ̀ṣọ́ òdòdó.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “Súúsì tí ó wà níwájú ìlú.” Ó ṣeé ṣe pé ìtumọ̀ rẹ̀ ni pé tẹ́ńpìlì tàbí ibi ìjọsìn Súúsì wà níwájú ìlú, tàbí ní òde ìlú.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: sì
  rationale: A lo “sì” láti tẹ̀ síwájú nínú ìtàn lọ́nà tí ó bá èdè Yorùbá mu, láìfi ìtumọ̀ tuntun kún ọ̀rọ̀ àsopọ̀ náà.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: Àlùfáà Súúsì
  rationale: “Súúsì” ń pa orúkọ òrìṣà Gíríìkì Ζεύς mọ́, dípò lílo Júpítérì, orúkọ Róòmù.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: ẹni tí tẹ́ńpìlì rẹ̀ wà níwájú ìlú
  rationale: Gbólóhùn náà tọ́ka sí Súúsì, ṣùgbọ́n ó ṣeé ṣe jù pé ibi ìjọsìn rẹ̀ tí ó wà níwájú tàbí ní ẹ̀yìn odi ìlú ni a ń sọ. A fi “tẹ́ńpìlì” hàn kedere fún òye, a sì pa àìdánilójú ibi náà mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ταύρους
  choice: àwọn akọ màlúù
  rationale: Èyí túmọ̀ sí àwọn màlúù akọ tí a mú wá fún ẹbọ.
- source_word: στέμματα
  choice: àwọn ọ̀ṣọ́ òdòdó
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí òdòdó tí a hun yí ká fún ayẹyẹ tàbí ìrúbọ; “ọ̀ṣọ́ òdòdó” jẹ́ ọ̀rọ̀ àdánidá tí ó sì gba ìtumọ̀ yìí.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: sí àwọn ẹnubodè
  rationale: Ọ̀pọ̀ ni πυλῶνας, ìṣípòpadà tí ἐνέγκας fi hàn sì mú kí “sí” bá a mu.
- source_word: ἐνέγκας
  choice: mú ... wá
  rationale: Ìṣe àkókò tí participle náà sọ ni a ṣe sí ọ̀rọ̀-ìṣe Yorùbá àdánidá, láìsọ ọ́ di gbólóhùn líle bí “nígbà tí ó ti mú.”
- source_word: σὺν τοῖς ὄχλοις
  choice: òun àti àwọn èrò
  rationale: Èyí fi hàn pé àlùfáà náà àti ọ̀pọ̀ ènìyàn tí ó péjọ fẹ́ jọ ṣe ìrúbọ náà; ọ̀pọ̀ ὄχλοις ni “àwọn èrò” ń ṣàfihàn.
- source_word: ἤθελεν θύειν
  choice: fẹ́ rú ẹbọ
  rationale: Nínú àyíká ìjọsìn yìí, θύω túmọ̀ sí fífi ẹbọ rú, θέλω sì fi ìfẹ́ tàbí ète hàn.
theological_decisions:
- issue: Ohun tí τοῦ ὄντος πρὸ τῆς πόλεως ń tọ́ka sí
  choice: A mú un gẹ́gẹ́ bí tẹ́ńpìlì Súúsì tí ó wà níwájú ìlú.
  alternative: A lè túmọ̀ ọ́ ní tààrà pé “Súúsì tí ó wà níwájú ìlú,” tàbí pé ibi ìjọsìn rẹ̀ wà lẹ́yìn odi ìlú.
  rationale: Ní Gíríìkì, gbólóhùn náà ń ṣàpèjúwe Súúsì ní tààrà, ṣùgbọ́n àṣà ìgbàanì máa ń dá òrìṣà mọ̀ nípa ibi tí tẹ́ńpìlì rẹ̀ wà. Fífi “tẹ́ńpìlì” kún un mú kí Yorùbá ṣe kedere láìfi ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ gangan àti òmíràn mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Rú ẹbọ” jẹ́ gbólóhùn Yorùbá tí ó mọ́gbọ́n dání fún ìrúbọ ẹ̀sìn, “àwọn èrò” sì jẹ́ ọ̀nà àdánidá láti sọ ọ̀pọ̀ ènìyàn tí ó péjọ. Àwọn àmì ìsàlẹ̀ [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
