source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: yo
  text: Nígbà tí àwọn ogunlọ́gọ̀ náà rí ohun tí Pọ́ọ̀lù ṣe, wọ́n gbé ohùn wọn sókè, wọ́n ń sọ ní èdè Líkáóníà pé, “Àwọn ọlọ́run, tí wọ́n ti di bí ènìyàn[a], ti sọ̀kalẹ̀ wá sí ọ̀dọ̀ wa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti mú dà bí ènìyàn.” Ọ̀rọ̀ Gíríìkì náà jẹ́ participle passive, ó sì ń tọ́ka sí bí àwọn ọlọ́run náà ṣe dà bí ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Nígbà tí àwọn ogunlọ́gọ̀ náà rí
  rationale: A tú participle aorist ἰδόντες gẹ́gẹ́ bí gbólóhùn àkókò, èyí tó bá ìtàn Yorùbá mu; “àwọn ogunlọ́gọ̀” sì pa ọ̀pọ̀ ὄχλοι mọ́.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ohun tí Pọ́ọ̀lù ṣe
  rationale: Ó tẹ̀ lé ìtumọ̀ clause relative Gíríìkì ní tààrà, láì fi àlàyé iṣẹ́ ìyanu tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: wọ́n gbé ohùn wọn sókè
  rationale: Èyí pa àwòrán idiom Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu láti sọ pé wọ́n ké ní ohùn rara.
- source_word: Λυκαονιστί
  choice: ní èdè Líkáóníà
  rationale: Adverb náà ń tọ́ka sí èdè tí wọ́n fi ń sọ̀rọ̀; fífi “èdè” hàn mú un ṣe kedere fún òǹkàwé òde òní.
- source_word: Οἱ θεοὶ
  choice: Àwọn ọlọ́run
  rationale: Ọ̀pọ̀ θεοί tọ́ka sí àwọn òrìṣà tàbí ọlọ́run nínú òye àwọn ará Lísírà; “àwọn ọlọ́run” jẹ́ gbohungbohun tí kò fi ẹ̀sìn àdúgbò kan pàtó lé e lórí.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: ti dà bí ènìyàn
  rationale: Èyí pa èrò ìfarajọ mọ́, ó sì jẹ́ Yorùbá àdánidá. Ó yẹra fún lílo ọ̀rọ̀ tó lè mú kí àsọjáde àwọn abọ̀rìṣà náà dà bí ẹ̀kọ́ Kristẹni nípa dídá ènìyàn.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: wọ́n sì ti sọ̀kalẹ̀ wá sí ọ̀dọ̀ wa
  rationale: “Sọ̀kalẹ̀” dúró fún καταβαίνω, “sí ọ̀dọ̀ wa” sì fi πρὸς ἡμᾶς hàn ní Yorùbá tó ṣe kedere; àmì “ti” mú ìdùnnú àsọjáde wọn hàn ní ti pé ìṣẹ̀lẹ̀ náà ṣẹ̀ṣẹ̀ dé.
theological_decisions:
- issue: Bí a ṣe máa sọ ìtumọ̀ abọ̀rìṣà ti ogunlọ́gọ̀ náà láì fi ẹ̀kọ́ Kristẹni nípa dídá ènìyàn sínú rẹ̀
  choice: Àwọn ọlọ́run ti dà bí ènìyàn
  alternative: Àwọn ọlọ́run ti wá ní ìrísí ènìyàn
  rationale: “Ti dà bí ènìyàn” tẹ̀ lé ὁμοιωθέντες, ó sì pa ọ̀rọ̀ wọn mọ́ gẹ́gẹ́ bí ìtumọ̀ àwọn abọ̀rìṣà fún ohun tí wọ́n rí, kì í ṣe gẹ́gẹ́ bí ìjẹ́wọ́ ẹ̀kọ́ Kristẹni.
translation_notes:
  register: Yorùbá àfẹnusọ tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa ariwo àti ìyàlẹ́nu ogunlọ́gọ̀ náà mọ́ nínú ọ̀rọ̀ tààrà wọn.
