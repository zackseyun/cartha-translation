id: ACT.14.23
reference: Acts 14:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti yan àwọn alàgbà fún wọn ní ìjọ kọ̀ọ̀kan[a], tí wọ́n sì ti gbàdúrà pẹ̀lú ààwẹ̀, wọ́n fi wọ́n lé Olúwa lọ́wọ́[b], nínú ẹni tí wọ́n ti gbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yan àwọn alàgbà fún wọn ní ìjọ kọ̀ọ̀kan nípa ìdìbò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíyan nípa ìdìbò tàbí gbígbé ọwọ́ sókè ní àwọn àyíká kan, bó tilẹ̀ jẹ́ pé níbí ó lè túmọ̀ sí yíyan lásán.
    reason: alternative_reading
  - marker: b
    text: “Wọ́n fi wọ́n lé Olúwa lọ́wọ́” lè tọ́ka sí àwọn alàgbà tí a ṣẹ̀ṣẹ̀ yàn, dípò gbogbo àwọn onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: tí wọ́n ti yan
  rationale: Ọ̀rọ̀ náà tọ́ka sí yíyan tàbí fífi ènìyàn sí ipò. “Yan” jẹ́ èdè Yorùbá àdánidá tí kò fi ọ̀nà ìṣàkóso ìjọ kan pàtó kún ẹsẹ náà.
- source_word: κατ’ ἐκκλησίαν
  choice: ní ìjọ kọ̀ọ̀kan
  rationale: κατά pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ níbí ní ìtumọ̀ pínpín sí gbogbo ìjọ agbègbè; “ní ìjọ kọ̀ọ̀kan” mú ìtumọ̀ yẹn jáde ní kedere.
- source_word: πρεσβυτέρους
  choice: àwọn alàgbà
  rationale: Nínú àyíká ìjọ, ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tí a mọ̀ sí alàgbà, kì í ṣe kìkì àwọn ọkùnrin àgbàlagbà.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: tí wọ́n sì ti gbàdúrà pẹ̀lú ààwẹ̀
  rationale: Ó pa ìṣe méjèèjì mọ́—àdúrà àti ààwẹ̀—ó sì fi hàn pé wọ́n ṣáájú ìṣe pàtàkì náà.
- source_word: παρέθεντο
  choice: wọ́n fi wọ́n lé ... lọ́wọ́
  rationale: Àpólà Yorùbá yìí túmọ̀ sí fífi àwọn ènìyàn sí àbójútó ẹlòmíràn, ó sì mú agbára ìbáṣepọ̀ tí ọ̀rọ̀ Gíríìkì náà ní jáde.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: Dátífù náà fi ẹni tí a fi wọ́n sí abẹ́ àbójútó rẹ̀ hàn; “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος ní àyíká yìí.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: ẹni tí wọ́n ti gbà gbọ́
  rationale: Ó tọ́ka sí ìgbàgbọ́ tí wọ́n ti ní tẹ́lẹ̀ nínú Olúwa. Ìṣètò yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìṣe àtẹ̀yìnwá ti pluperfect mọ́.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: fún wọn ... wọ́n
  rationale: A pa àwọn arọ́pò-orúkọ mọ́ láì pinnu ju ohun tí Gíríìkì sọ lọ nípa ẹni pàtó tí αὐτούς ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ χειροτονήσαντες ní ti ọ̀nà yíyan aṣáájú ìjọ
  choice: yan àwọn alàgbà
  alternative: dìbò yan àwọn alàgbà nípa gbígbé ọwọ́ sókè
  rationale: Ọ̀rọ̀ náà lè ní ìbáṣepọ̀ pẹ̀lú ìdìbò ní àwọn àyíká kan, ṣùgbọ́n ẹsẹ yìí kò sọ ọ̀nà ìdìbò kan pàtó. “Yan” kò gbé ètò ẹ̀sìn ìjọ kan wọ inú ẹsẹ náà.
- issue: Ẹni tí αὐτοὺς nínú παρέθεντο αὐτοὺς τῷ κυρίῳ ń tọ́ka sí
  choice: àwọn onígbàgbọ́ tàbí àwọn ìjọ lápapọ̀
  alternative: àwọn alàgbà tí a ṣẹ̀ṣẹ̀ yàn nìkan
  rationale: Àyíká tó gbòòrò sọ̀rọ̀ nípa àwọn ọmọ-ẹ̀yìn, ó sì ṣeé ṣe jù pé àwọn ni wọ́n fi lé Olúwa lọ́wọ́; síbẹ̀, èdè Gíríìkì tún lè jẹ́ kí a ka ọ́ sí àwọn alàgbà, nítorí náà àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. A lo “alàgbà” gẹ́gẹ́ bí ọ̀rọ̀ ìjọ tí gbogbo ènìyàn lè lóye, a sì yàgò fún fífi ètò ìṣàkóso ìjọ kan pàtó sínú ẹsẹ náà.
