source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: yo
  text: Nígbà tí wọ́n dé, tí wọ́n sì pe ìjọ jọ, wọ́n ròyìn gbogbo ohun tí Ọlọ́run ti ṣe pẹ̀lú wọn[a], àti pé ó ti ṣí ilẹ̀kùn ìgbàgbọ́ sílẹ̀ fún àwọn Kèfèrí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “gbogbo ohun tí Ọlọ́run ti ṣe nípasẹ̀ wọn.” Ní tààràtà, èdè Gíríìkì sọ pé, “pẹ̀lú wọn.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “ó ti ṣí ilẹ̀kùn ìgbàgbọ́ sílẹ̀ fún àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Nígbà tí wọ́n dé
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ó ṣáájú ìròyìn wọn hàn ní Yorùbá àdánidá.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: tí wọ́n sì pe ìjọ jọ
  rationale: ‘Pe ... jọ’ ṣàlàyé pé wọ́n kó àwùjọ àwọn onígbàgbọ́ ibẹ̀ jọ, ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἀνήγγελλον
  choice: wọ́n ròyìn
  rationale: Ọ̀rọ̀ náà bá àyíká ìròyìn nípa iṣẹ́ ìránṣẹ́ wọn mu, ó sì lè ṣàfihàn bí wọ́n ṣe ń sọ gbogbo ohun tí ó ṣẹlẹ̀.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ gbogbo ohun tí ìròyìn náà kà mọ́.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: Ọlọ́run ti ṣe pẹ̀lú wọn
  rationale: Ó pa ìtumọ̀ gígùn ti μετά, ‘pẹ̀lú,’ mọ́, láìfi dandan túmọ̀ rẹ̀ sí pé Ọlọ́run ṣe iṣẹ́ náà ‘nípasẹ̀’ wọn.
- source_word: ἤνοιξεν
  choice: ó ti ṣí ... sílẹ̀
  rationale: Ó tọ́ka sí iṣẹ́ Ọlọ́run tí ó ti ṣẹlẹ̀ ṣáájú ìgbà tí wọ́n ń ròyìn rẹ̀.
- source_word: τοῖς ἔθνεσιν
  choice: fún àwọn Kèfèrí
  rationale: Nínú ìtàn Ìṣe, ó tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìjọba òde òní.
- source_word: θύραν πίστεως
  choice: ilẹ̀kùn ìgbàgbọ́
  rationale: Ó pa àkàwé ilẹ̀kùn àti ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ láìsọ ìtumọ̀ rẹ̀ di ohun kan ṣoṣo.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu jù lọ nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ μετ’ αὐτῶν nínú àpèjúwe iṣẹ́ Ọlọ́run
  choice: Ọlọ́run ti ṣe pẹ̀lú wọn
  alternative: Ọlọ́run ti ṣe nípasẹ̀ wọn; Ọlọ́run ti ṣe láàárín wọn
  rationale: '‘Pẹ̀lú wọn’ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́: Ọlọ́run ni olùṣe, Pọ́ọ̀lù àti Bánábà sì kópa pẹ̀lú rẹ̀, ṣùgbọ́n a kò sọ ọ́ di èdè irinṣẹ́ nìkan.'
- issue: Ìtumọ̀ ἔθνεσιν
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tẹnumọ́ àwọn tí kì í ṣe Júù àti bí wọ́n ṣe ń wọ inú àwùjọ àwọn onígbàgbọ́, kì í ṣe àwọn ìjọba orílẹ̀-èdè.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. ‘Pe ìjọ jọ’ jẹ́ àdánidá ju àfarawe gígùn lọ, ‘ilẹ̀kùn ìgbàgbọ́’ sì pa àkàwé orísun mọ́.
