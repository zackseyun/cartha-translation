source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: yo
  text: Láti ibẹ̀, wọ́n sì wọ ọkọ̀ ojú omi lọ sí Áńtíókù, níbi tí a ti fi wọ́n lé oore-ọ̀fẹ́ Ọlọ́run lọ́wọ́ fún iṣẹ́ tí wọ́n ti parí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ti mú iṣẹ́ náà ṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Láti ibẹ̀
  rationale: Ó so ìrìn-àjò yìí mọ́ ibi tí wọ́n ti wà tẹ́lẹ̀, ó sì sọ ibi ìbẹ̀rẹ̀ ìrìn-àjò náà ní Yorùbá àdánidá.
- source_word: ἀπέπλευσαν
  choice: wọ́n wọ ọkọ̀ ojú omi lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n kúrò níbẹ̀ nípasẹ̀ ọkọ̀ ojú omi; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: εἰς Ἀντιόχειαν
  choice: sí Áńtíókù
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣípò, εἰς ń tọ́ka sí ibi tí wọ́n ń lọ; a kọ orúkọ ibùdó náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: ὅθεν
  choice: ibi tí ... ti
  rationale: Ó pa ìtumọ̀ ‘láti ibi tí’ mọ́, ó sì ṣe àjọṣe rẹ̀ pẹ̀lú Áńtíókù ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἦσαν παραδεδομένοι
  choice: wọ́n ti fi wọ́n lé ... lọ́wọ́
  rationale: Ìṣẹ̀dá ọ̀rọ̀ náà tọ́ka sí ìṣe kan tó ti ṣẹlẹ̀ ṣáájú; ‘fi ... lé ... lọ́wọ́’ pa èrò fífi wọn sí abẹ́ àbójútó tàbí ìtọ́jú mọ́ láìfi èrò ẹ̀kọ́ ìjọ kan kún un.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Ó tú ìṣọ̀kan ọ̀rọ̀ Gíríìkì náà tààrà, ó sì pa ìwúwo ẹ̀kọ́ nípa oore-ọ̀fẹ́ Ọlọ́run mọ́.
- source_word: εἰς τὸ ἔργον
  choice: fún iṣẹ́
  rationale: ‘Iṣẹ́’ jẹ́ ìtumọ̀ gbòòrò, tààrà fún ἔργον, láìdín un sí irú iṣẹ́ pàtó kan.
- source_word: ὃ ἐπλήρωσαν
  choice: tí wọ́n ti parí
  rationale: Nínú àyíká yìí, πληρόω túmọ̀ sí mímú iṣẹ́ dé òpin; ‘parí’ jẹ́ Yorùbá àdánidá tó sọ ìtumọ̀ náà kedere.
theological_decisions:
- issue: Irú ohun tí ìjọ Áńtíókù ṣe sí Pọ́ọ̀lù àti Bánábà ṣáájú ìrìn-àjò wọn
  choice: wọ́n ti fi wọ́n lé oore-ọ̀fẹ́ Ọlọ́run lọ́wọ́
  alternative: wọ́n ti fi wọ́n sí abẹ́ oore-ọ̀fẹ́ Ọlọ́run
  rationale: Ìtumọ̀ yìí fi hàn pé a gbé wọn lé ìtọ́jú oore-ọ̀fẹ́ Ọlọ́run fún iṣẹ́ náà, láìsọ pé ó jẹ́ àṣà ìyàsímímọ́ tàbí ètò ìjọ kan pàtó.
- issue: Ìtumọ̀ ἐπλήρωσαν nípa iṣẹ́ náà
  choice: tí wọ́n ti parí
  alternative: tí wọ́n ti mú ṣẹ
  rationale: ‘Parí’ tẹnumọ́ pé wọ́n mú iṣẹ́ náà dé òpin; ‘mú ṣẹ’ tún ṣeé ṣe, ṣùgbọ́n ó lè mú ìmọ̀lára ìmúṣẹ àsọtẹ́lẹ̀ wọlé ju ohun tí àyíká béèrè lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tó yẹ. A yàgò fún ọ̀rọ̀ ìjọ aláṣà pàtó, a sì pa ìtumọ̀ pé wọ́n fi àwọn arìnrìn-àjò náà lé oore-ọ̀fẹ́ Ọlọ́run lọ́wọ́ mọ́.
