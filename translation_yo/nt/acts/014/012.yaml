id: ACT.14.12
reference: Acts 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: yo
  text: Wọ́n sì ń pe Bánábà ní Séúsì, wọ́n sì ń pe Pọ́ọ̀lù ní Hẹ́mẹ́sì[a], nítorí òun ni ẹni tí ó ń darí ọ̀rọ̀ sísọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ àtijọ́ kan máa ń lo Júpítà àti Mákúrì, ìyẹn orúkọ Róòmù fún àwọn òrìṣà wọ̀nyí; Séúsì àti Hẹ́mẹ́sì ni ọ̀rọ̀ Gíríìkì ní.
    reason: alternative_reading
  - marker: b
    text: 'Ní Gíríìkì: “ẹni tí ó ń darí ọ̀rọ̀,” tàbí “olórí nínú ọ̀rọ̀ sísọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: wọ́n ń pe
  rationale: Àkókò imperfect ní Gíríìkì fi hàn pé ìṣe náà ń lọ lọ́wọ́ tàbí pé wọ́n ń ṣe é léraléra; “wọ́n ń pe” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τε
  choice: sì
  rationale: τε so gbólóhùn yìí mọ́ ìtàn tó ṣáájú lọ́nà fẹ́ẹ́rẹ́; “sì” ni àsopọ̀ ìtàn tó bá Yorùbá mu.
- source_word: Δία
  choice: Séúsì
  rationale: Orúkọ òrìṣà Gíríìkì Zeus gan-an ni ọ̀rọ̀ Gíríìkì tọ́ka sí; a kò fi Júpítà, orúkọ Róòmù, rọ́pò rẹ̀.
- source_word: Ἑρμῆν
  choice: Hẹ́mẹ́sì
  rationale: A ṣe àfọ̀rọ̀kọ orúkọ òrìṣà Gíríìkì Hermes sí Yorùbá, dípò Mákúrì, orúkọ Róòmù rẹ̀.
- source_word: ἐπειδὴ
  choice: nítorí
  rationale: Ọ̀rọ̀ náà sọ ìdí tí àwọn ènìyàn fi dá Pọ́ọ̀lù mọ̀ sí Hẹ́mẹ́sì.
- source_word: αὐτὸς
  choice: òun
  rationale: “Òun” mú ìtẹnumọ́ díẹ̀ tó wà nínú αὐτός jáde, ó sì yà Pọ́ọ̀lù sọ́tọ̀ kúrò lọ́dọ̀ Bánábà.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: olórí agbọ̀rọ̀sọ
  rationale: Gbólóhùn náà túmọ̀ sí ẹni tó mú ipò aṣáájú nínú ọ̀rọ̀ sísọ. “Olórí agbọ̀rọ̀sọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé Pọ́ọ̀lù ni ẹni pàtàkì tó ń sọ̀rọ̀, láìsọ λόγος di “Ọ̀rọ̀” ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ orúkọ àwọn òrìṣà abọ̀rìṣà
  choice: Lo “Séúsì” àti “Hẹ́mẹ́sì” nínú ẹsẹ̀ náà
  alternative: Júpítà àti Mákúrì
  rationale: Ẹsẹ̀ náà ń ròyìn ohun tí àwọn ará ìlú pe Bánábà àti Pọ́ọ̀lù. Orúkọ Gíríìkì gan-an ló wà nínú orísun, nítorí náà a pa wọ́n mọ́ dípò lílo àwọn orúkọ Róòmù tí àṣà àwọn ìtumọ̀ kan máa ń lò.
translation_notes:
  register: A lo Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àwọn orúkọ àjèjì ni a kọ sí ìró Yorùbá, ṣùgbọ́n a kò fi orúkọ Róòmù rọ́pò orúkọ Gíríìkì.
