source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: yo
  text: Ní Lístírà, ọkùnrin kan ń jókòó; kò ní agbára ní ẹsẹ̀ rẹ̀, ó sì jẹ́ arọ láti inú oyún ìyá rẹ̀ wá; kò sì tí ì rìn rí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: Ní Lístírà
  rationale: A kò fi Καί ṣe ‘àti’ ní ìbẹ̀rẹ̀, nítorí ìtẹ̀síwájú ìtàn náà ṣe kedere ní Yorùbá láìsí àsopọ̀ yẹn.
- source_word: τις ἀνὴρ
  choice: ọkùnrin kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ọkùnrin kan tí a kò dárúkọ, tí ó sì jẹ́ ẹni pàtó nínú ìtàn.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: ẹni tí ẹsẹ̀ rẹ̀ kò lágbára
  rationale: Ó pa ìtumọ̀ àìní agbára mọ́, kò sì dapọ̀ mọ́ χωλός tí ó tẹ̀ lé e.
- source_word: ἐν Λύστροις
  choice: Ní Lístírà
  rationale: A lo ìkọ̀wé orúkọ ibìkan náà ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: ἐκάθητο
  choice: jókòó
  rationale: Nínú àyíká ìtàn yìí, ‘jókòó’ sọ ipò tí ó wà nígbà náà ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: χωλὸς
  choice: ó yarọ
  rationale: ‘Yarọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àìlera ẹsẹ̀ tó mú kí ẹni kò lè rìn dáadáa.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: láti inú ìyá rẹ̀ wá
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá fún ipò láti ìbí.
- source_word: ὃς οὐδέποτε περιεπάτησεν
  choice: kò sì rìn rí
  rationale: Àpẹẹrẹ ‘kò ... rí’ fi hàn ní kedere pé kò rìn nígbà kankan títí di àsìkò ìtàn náà.
theological_decisions: []
translation_notes:
  register: 'Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àlàyé onípele méjì mọ́: ẹsẹ̀ rẹ̀ kò lágbára, ó sì yarọ. A kò fi àmì àlàyé ẹsẹ̀ sí i, nítorí àṣàyàn lexical náà wà ní kedere nínú ẹsẹ̀ fúnra rẹ̀.'
