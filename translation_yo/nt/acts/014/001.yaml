id: ACT.14.1
reference: Acts 14:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: yo
  text: Ní Íkóníónì, àwọn méjèèjì wọ inú sínágọ́gù àwọn Júù, wọ́n sì sọ̀rọ̀ lọ́nà tí ó mú kí ọ̀pọ̀lọpọ̀ Júù àti Gíríìkì gbàgbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘sínágọ́gù Júù.’ Ohun tí èdè Gíríìkì sọ ní tààrà ni ‘sínágọ́gù àwọn Júù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn. Yorùbá kò nílò kí a fi ọ̀rọ̀ àfikún bí ‘nígbà náà’ sí i níbí, nítorí kò sí ọ̀rọ̀ àkókò pàtó nínú Gíríìkì.
- source_word: ἐν Ἰκονίῳ
  choice: Ní Íkóníónì
  rationale: Ó jẹ́ gbólóhùn ibi; a kọ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: κατὰ τὸ αὐτό
  choice: àwọn méjèèjì
  rationale: Nínú àyíká yìí, gbólóhùn náà fi hàn pé Pọ́ọ̀lù àti Bánábà ṣe ìgbésẹ̀ náà papọ̀; ‘àwọn méjèèjì’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti mú ìtumọ̀ yẹn jáde.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: wọ inú
  rationale: A yí infinitive inú ètò ìtàn Gíríìkì padà sí ọ̀rọ̀-ìṣe pípé ní Yorùbá.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: inú sínágọ́gù àwọn Júù
  rationale: Ìtumọ̀ náà pa genitive ‘àwọn Júù’ mọ́ ní kedere, dípò yíyí i padà sí àpèjúwe kan ṣoṣo.
- source_word: λαλῆσαι
  choice: sọ̀rọ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí kò fi kún irú ọ̀rọ̀ tí wọ́n sọ tàbí ẹni tí wọ́n bá sọ ọ́.
- source_word: οὕτως ὥστε
  choice: lọ́nà tí ... fi
  rationale: Ètò Yorùbá yìí pa ìbáṣepọ̀ láàárín ọ̀nà tí wọ́n gbà sọ̀rọ̀ àti àbájáde rẹ̀ mọ́.
- source_word: πιστεῦσαι
  choice: gba ìgbàgbọ́
  rationale: 'Nínú ìtàn yìí, ó sọ àbájáde ìwàásù: àwọn olùgbọ́ di onígbàgbọ́. Gbólóhùn náà kò fi ohun tí wọ́n gbà gbọ́ kún ohun tí Gíríìkì sọ.'
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: àwọn Júù àti àwọn Gíríìkì
  rationale: ‘Àti’ so ẹgbẹ́ méjèèjì pọ̀ gẹ́gẹ́ bí τε καὶ ṣe rí.
- source_word: πολὺ πλῆθος
  choice: ọ̀pọ̀lọpọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi iye ńlá àwọn ènìyàn hàn láìlo gbólóhùn tó le tàbí ti àtijọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστεῦσαι nínú ìtàn ìyípadà sí ìgbàgbọ́
  choice: gba ìgbàgbọ́
  alternative: gbà gbọ́; gba ọ̀rọ̀ náà gbọ́
  rationale: ‘Gba ìgbàgbọ́’ sọ ìdáhùn àwọn Júù àti àwọn Gíríìkì sí ìwàásù àwọn aposteli ní Yorùbá àdánidá. A kò yan ‘gba ọ̀rọ̀ náà gbọ́,’ nítorí ‘ọ̀rọ̀ náà’ kò farahàn ní tààrà nínú ẹsẹ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ tí a ti mú wọ Yorùbá.
