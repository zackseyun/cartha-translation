  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tó dájú, tó ní ìwọ̀n ìyì tí ó yẹ fún ìwé mímọ́. "Rìn ní ọ̀nà tiwọn" jẹ́ òwe/àwòrán tí ó mọ́gbọ́n dání nínú Yorùbá. Lílò ọ̀nà ẹyọ kan pẹ̀lú tiwọn tún jẹ́ àdánidá nínú ìlò àwòrán Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ọ̀nà púpọ̀.
  terminology: '"Orílẹ̀-èdè" pa ìtumọ̀ ἔθνη mọ́ láìfi ìtumọ̀ "aláì-Júù" sínú ọ̀rọ̀ àkọ́kọ́. "Aláì-Júù" nínú àlàyé ìsàlẹ̀ jẹ́ àṣàyàn lexical tí ó wúlò. Àmì [a] wà ní ibi tí ó tọ́, ìsàlẹ̀ náà sì bá ìtumọ̀ àtúnṣe rẹ̀ mu.'
