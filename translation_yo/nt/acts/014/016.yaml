id: ACT.14.16
reference: Acts 14:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: yo
  text: Ní àwọn ìran tí ó ti kọjá, ó gba gbogbo àwọn orílẹ̀-èdè láàyè láti máa rìn ní ọ̀nà tiwọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó gba gbogbo àwọn aláì-Júù láàyè láti máa lọ ní ọ̀nà wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ó
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ìbátan náà tọ́ka sí Ọlọ́run nínú ẹsẹ tó ṣáájú; lílo “ó” jẹ́ àdánidá ní Yorùbá, ó sì ń tẹ̀síwájú pẹ̀lú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Ní àwọn ìran tí ó ti kọjá
  rationale: Èyí pa ìtumọ̀ àwọn ìran ìgbà àtijọ́ tí ó ti ré kọjá mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì yẹ fún Yorùbá òde òní.
- source_word: εἴασεν
  choice: ó gba ... láàyè
  rationale: “Gba ... láàyè” túmọ̀ sí fífàyè gba tàbí àìdásí ohun kan dúró; kò túmọ̀ sí pé Ọlọ́run fọwọ́ sí ìwà àwọn orílẹ̀-èdè náà.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: Àṣàyàn yìí pa ìtumọ̀ àwọn ẹgbẹ́ ènìyàn tàbí àwọn orílẹ̀-èdè mọ́, láìfi dandan túmọ̀ rẹ̀ sí àwọn aláì-Júù nìkan.
- source_word: πορεύεσθαι
  choice: láti máa rìn
  rationale: “Máa rìn” pa àwòrán ìrìn ní ọ̀nà mọ́, ó sì lè ṣàpèjúwe bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: ní ọ̀nà tiwọn
  rationale: Èyí pa àwòrán “ọ̀nà” àti agbára arọ́pò-orúkọ αὐτῶν mọ́, ní Yorùbá tí ó ṣe àdánidá.
theological_decisions:
- issue: Fífi ààyè gba ní ọ̀dọ̀ Ọlọ́run àti fífi ọwọ́ sí ohun kan
  choice: Ọlọ́run gba àwọn orílẹ̀-èdè láàyè láti tẹ̀lé ọ̀nà tiwọn.
  alternative: Ọlọ́run fọwọ́ sí ọ̀nà àwọn orílẹ̀-èdè, tàbí òun fúnra rẹ̀ ló pinnu gbogbo ọ̀nà wọn.
  rationale: εἴασεν ń sọ nípa fífàyè gba, kì í ṣe ìfọwọ́sí tàbí fífi agbára mú wọn ṣe é. Ìtumọ̀ náà pa ìfàyègbà Ọlọ́run àti ojúṣe ènìyàn mọ́ láìyanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún, ní ìlànà ọ̀rọ̀ tó ṣe àdánidá, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. A pa àwòrán “rìn ní ọ̀nà” mọ́ nítorí ó lè tọ́ka sí ìgbésí ayé àti ìwà.
