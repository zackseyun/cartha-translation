source:
  edition: SBLGNT
  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: yo
  text: Ó sọ ní ohùn gíga pé, “Dìde dúró ṣánṣán lórí ẹsẹ̀ rẹ.” Ó sì fò sókè, ó sì bẹ̀rẹ̀ sí í rìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fò sókè, ó sì ń rìn.” Ọ̀rọ̀-ìṣe tó gbẹ̀yìn wà ní ìrísí imperfect, èyí tó lè tẹnumọ́ ìṣe tó ń bá a lọ tàbí ìbẹ̀rẹ̀ rírìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: ní ohùn rara
  rationale: Gbólóhùn dátífù náà ń sọ ọ̀nà tí ó gbà sọ̀rọ̀; ‘ní ohùn rara’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ó sọ̀rọ̀ sókè, ní gbangba àti pẹ̀lú ìtẹnumọ́.
- source_word: Ἀνάστηθι
  choice: Dìde dúró
  rationale: Àṣẹ aorist yìí ń pàṣẹ fún ọkùnrin náà láti dìde sí ipò ìdúró. ‘Dìde dúró’ bá àyíká ìwòsàn ẹni tí kò lè lo ẹsẹ̀ rẹ̀ mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: lórí ẹsẹ̀ rẹ
  rationale: Èyí túmọ̀ sí pé kí ó gbé ara rẹ̀ dúró lórí ẹsẹ̀ tirẹ̀; ọ̀rọ̀ náà ṣetọju àwòrán ara tí Gíríìkì ní.
- source_word: ὀρθός
  choice: ṣánṣán
  rationale: Ọ̀rọ̀ yìí ń ṣàlàyé ìdúró tí ó tọ́, tí ara nà sókè. ‘Dúró ṣánṣán’ jẹ́ àsọyé Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἥλατο
  choice: fò sókè
  rationale: Fọ́ọ̀mù láti inú ἅλλομαι ń tọ́ka sí fífò lojijì. ‘Fò sókè’ pa ìgbésẹ̀ alágbára àti òjijì inú ìtàn iṣẹ́ ìyanu náà mọ́.
- source_word: περιεπάτει
  choice: bẹ̀rẹ̀ sí í rìn
  rationale: Imperfect náà lè fi ìṣe tó ń bá a lọ tàbí ìbẹ̀rẹ̀ ìṣe hàn. Nínú ọ̀wọ̀ ìṣẹ̀lẹ̀ yìí, ‘bẹ̀rẹ̀ sí í rìn’ jẹ́ àdánidá, ó sì fi ìbẹ̀rẹ̀ ìrìn tó ń tẹ̀ síwájú hàn.
theological_decisions:
- issue: Èdè iṣẹ́ ìyanu àti àṣẹ nípa ìdúró
  choice: Túmọ̀ àṣẹ náà àti ìdáhùn ọkùnrin náà gẹ́gẹ́ bí ìwòsàn ara lẹ́sẹ̀kẹsẹ̀, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
  alternative: Láti fi ọ̀rọ̀ ìtumọ̀ ẹ̀kọ́ ìsìn tàbí àlàyé nípa agbára iṣẹ́ ìyanu kún ìtàn náà.
  rationale: Gíríìkì sọ àṣẹ tààrà, lẹ́yìn náà ó sọ ìdáhùn ara tí ó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀, tí a sì lè rí. Ìtumọ̀ náà pa ohun tí ẹsẹ náà sọ mọ́ láìṣe àfikún.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘ọkùnrin náà’ lẹ́ẹ̀kejì láti mú ẹni tí ó fò sókè ṣe kedere nítorí Yorùbá kò ní àmì akọ nínú arọ́pò-orúkọ ‘ó’; ẹni náà ti hàn gbangba nínú àyíká ẹsẹ tó ṣáájú.
