lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ó jáde lọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí pa ìtumọ̀ ìṣípòpadà ‘jáde’ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìrìn sí ibi kan ní Yorùbá.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú láìfi ìtakora hàn; ‘Nígbà náà ni’ bá ìṣàn ìtàn Yorùbá mu.
- source_word: εἰς Ταρσόν
  choice: sí Tásù
  rationale: εἰς pẹ̀lú ọ̀rọ̀ ìṣípòpadà ń tọ́ka sí ibi tí ẹni ń lọ; ‘sí Tásù’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἀναζητῆσαι
  choice: láti wá
  rationale: Ọ̀rọ̀ àìlẹ́ni náà sọ ète ìrìn náà; ‘láti wá’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, tí kò sì fi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: Σαῦλον
  choice: Ṣọ́ọ̀lù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀ fún Saulu.
