id: ACT.11.2
reference: Acts 11:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Peteru gòkè lọ sí Jerusalẹmu, àwọn tí wọ́n jẹ́ ti ìkọlà[a] ń bá a jiyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a kọ ní ilà,” “àwọn ẹgbẹ́ ìkọlà,” tàbí “àwọn onígbàgbọ́ tí a kọ ní ilà.” Ọ̀rọ̀ Gíríìkì náà dá ẹgbẹ́ kan mọ̀ nípa ìbáṣepọ̀ wọn pẹ̀lú ìkọlà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: δέ ń fi ìyípadà ìtàn hàn pẹ̀lú ìtakora díẹ̀; ‘Ṣùgbọ́n nígbà tí’ pa agbára àsopọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἀνέβη
  choice: gòkè lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ sókè, ó sì bá ọ̀nà tí a fi ń sọ nípa lílọ sí Jerusalẹmu mu.
- source_word: Ἰερουσαλήμ
  choice: Jerusalẹmu
  rationale: Àkọtọ̀ orúkọ ibi tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: διεκρίνοντο
  choice: ń bá a jiyàn
  rationale: Fíìlì aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ hàn; ní àyíká yìí, ó jẹ́ àríyànjiyàn tí wọ́n darí sí Peteru, kì í ṣe iyèméjì inú lásán.
- source_word: πρὸς αὐτόν
  choice: bá a
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe àríyànjiyàn, πρός tọ́ka sí ẹni tí wọ́n ń bá jiyàn; ‘bá a’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò mú ìṣọ̀tá le ju ti Gíríìkì lọ.
- source_word: οἱ ἐκ περιτομῆς
  choice: àwọn tí ó fara mọ́ ìkọlà
  rationale: Gbólóhùn náà dá àwọn kan mọ̀ nípa ìbáṣepọ̀ wọn pẹ̀lú ìkọlà. ‘Fara mọ́ ìkọlà’ fi hàn pé ìkọlà ni ohun tí ó ń dá ẹgbẹ́ náà mọ̀, láì pè wọ́n ní ẹgbẹ́ òṣèlú tàbí fi ẹ̀kọ́ ìsìn kan kún un.
theological_decisions:
- issue: Ìdánimọ̀ οἱ ἐκ περιτομῆς
  choice: àwọn onígbàgbọ́ ní Jerusalẹmu tí ìfararọ̀ mọ́ ìkọlà ń dá mọ̀, tí wọ́n sì tako Peteru
  alternative: gbogbo àwọn onígbàgbọ́ Júù lápapọ̀, tàbí ẹgbẹ́ ìkọlà kan tí a ti ṣètò gẹ́gẹ́ bí ẹgbẹ́ pàtó
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí àwọn tí a dá mọ̀ nípa ìkọlà, ṣùgbọ́n kò sọ kedere pé gbogbo onígbàgbọ́ Júù ni, bẹ́ẹ̀ ni kò fi hàn pé ẹgbẹ́ òfin pàtó ni wọ́n.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìkọlà’ fún circumcision, ‘ń bá a jiyàn’ fún ìtakora ọ̀rọ̀ tí ń lọ lọ́wọ́, a sì fi àlàyé sí àlàyé-ẹsẹ̀ láti pa àìdánilójú ẹni tí οἱ ἐκ περιτομῆς ń tọ́ka sí mọ́.
