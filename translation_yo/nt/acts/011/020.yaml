revisions:
- from: Ṣùgbọ́n àwọn kan lára wọn jẹ́ ọkùnrin ará Kípírù àti Kírénè[a]. Nígbà tí wọ́n dé Áńtíókù, wọ́n tún ń bá àwọn Júù tí ń sọ èdè Gíríìkì sọ̀rọ̀, wọ́n sì ń kéde ìhìn rere nípa Jesu Olúwa.
  to: Ṣùgbọ́n àwọn kan lára wọn jẹ́ ọkùnrin ará Kípírù àti ará Kírénè. Nígbà tí wọ́n dé Áńtíókù, wọ́n tún ń bá àwọn Júù tí ń sọ èdè Gíríìkì[a] sọ̀rọ̀, wọ́n sì ń kéde ìhìn rere nípa Olúwa Jésù.
  rationale: Àtúnṣe náà tún ìtọ́ka àmì àlàyé ìsàlẹ̀ ṣe kí ó máa tọ́ka sí ọ̀rọ̀ tí àyípadà ọ̀rọ̀ ọwọ́ kan. Ó tún mú àwọn ethnics ilẹ̀ méjèèjì hàn kedere, ó sì lò ‘Olúwa Jésù,’ èyí tí ó jẹ́ àtòjọ Yorùbá àdánidá fún κύριον Ἰησοῦν. Ìtumọ̀ akọkọ ṣì tẹ̀ lé Ἑλληνιστάς nínú SBLGNT, àlàyé ìsàlẹ̀ sì pa Ἕλληνας mọ́ láì yan ẹgbẹ́ ìtumọ̀ kan fún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:35Z'
