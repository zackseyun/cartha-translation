id: ACT.11.20
reference: Acts 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan lára wọn jẹ́ ọkùnrin ará Kípírù àti ará Kírénè. Nígbà tí wọ́n dé Áńtíókù, wọ́n tún ń bá àwọn Júù tí ń sọ èdè Gíríìkì[a] sọ̀rọ̀, wọ́n sì ń kéde ìhìn rere nípa Olúwa Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé ọwọ́ kan ka “àwọn Gíríìkì” dípò “àwọn Júù tí ń sọ èdè Gíríìkì.” Bí ìkànsí náà bá jẹ́ ti ìpilẹ̀ṣẹ̀, ìtumọ̀ rẹ̀ ni pé wọ́n ń bá àwọn Kèfèrí sọ̀rọ̀, kì í ṣe àwọn Júù tí ń sọ èdè Gíríìkì nìkan.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: àwọn kan
  rationale: Ó tọ́ka sí iye àwọn ènìyàn tí a kò sọ pàtó lára ẹgbẹ́ tí a ti mẹ́nu kàn; “àwọn kan” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἄνδρες
  choice: ọkùnrin
  rationale: Orúkọ Gíríìkì náà tọ́ka pàtó sí àwọn akọ tí wọ́n ti dàgbà, kì í ṣe ọ̀rọ̀ gbogbogbò fún ènìyàn.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: ará Kípírù àti Kírénè
  rationale: Àwọn ọ̀rọ̀ náà ń sọ ibi tí àwọn ọkùnrin náà ti wá; ìtumọ̀ yìí bójú mu ní Yorùbá.
- source_word: οἵτινες
  choice: Nígbà tí wọ́n
  rationale: Ìbáṣepọ̀ náà ni a so mọ́ gbólóhùn àkókò tó tẹ̀ lé e lọ́nà Yorùbá àdánidá, láì pàdánù ẹni tí ó ń tọ́ka sí.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Nígbà tí wọ́n dé Áńtíókù
  rationale: A tú participle aorist náà sí gbólóhùn àkókò, èyí tó ṣe kedere tí ó sì bójú mu ní Yorùbá.
- source_word: ἐλάλουν
  choice: wọ́n ń bá ... sọ̀rọ̀
  rationale: Àmì imperfect náà ń fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń ... sọ̀rọ̀” pa ìrísí yẹn mọ́.
- source_word: καὶ
  choice: tún
  rationale: Níbí, καί ṣeé lóye gẹ́gẹ́ bí fífi àwọn olùgbọ́ mìíràn kún un; “tún” mú ìtumọ̀ adjunctive yẹn jáde.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: àwọn Júù tí ń sọ èdè Gíríìkì
  rationale: Ἑλληνιστάς sábà máa ń tọ́ka sí àwọn Júù tí ń sọ èdè Gíríìkì. Ìtumọ̀ kíkún yìí rọrùn fún òǹkàwé Yorùbá ju gbígbé orúkọ àjèjì wọlé lọ.
- source_word: εὐαγγελιζόμενοι
  choice: wọ́n sì ń kéde ìhìn rere nípa
  rationale: Ó fi irú ọ̀rọ̀ tí wọ́n ń sọ àti ohun tí ó dá lé hàn; “kéde ìhìn rere” jẹ́ kedere, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Jesu Olúwa
  rationale: “Olúwa” pa oyè kristolọ́jì κύριος mọ́, ṣíṣe “Jesu Olúwa” sì jẹ́ àtòjọ ọ̀rọ̀ Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìdánimọ̀ τοὺς Ἑλληνιστάς àti àyípadà àfọwọ́kọ Ἕλληνας
  choice: Ọ̀rọ̀ àkọ́kọ́ tẹ̀ lé SBLGNT, “àwọn Júù tí ń sọ èdè Gíríìkì,” a sì fi “àwọn Gíríìkì” sínú àlàyé ìsàlẹ̀.
  alternative: àwọn Gíríìkì, ìyẹn àwọn Kèfèrí
  rationale: 'Ìyàtọ̀ náà ní ipa lórí bí a ṣe lóye ìtàn ìtànkálẹ̀ ìhìn rere: Ἑλληνιστάς ń tọ́ka sí àwọn Júù tí ń sọ èdè Gíríìkì, ṣùgbọ́n Ἕλληνας yóò tọ́ka sí àwọn Kèfèrí. A tẹ̀ lé ẹ̀dà orísun tí a pèsè, a kò sì fi ìyàtọ̀ pàtàkì náà pamọ́.'
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A ṣàlàyé “Hellenists” nínú ọ̀rọ̀ gan-an kí ó má bàa dà bí ọ̀rọ̀ imọ̀ ẹ̀sìn tí kò ṣe kedere.
