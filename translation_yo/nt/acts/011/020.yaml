  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé SBLGNT dáadáa ní ọ̀pọ̀lọpọ̀ ọ̀nà: ó pa ‘àwọn kan,’ ‘ọkùnrin,’ ìpilẹ̀ ilẹ̀ àwọn ènìyàn náà, ìṣe tí imperfect ń ṣàfihàn, àti ìkìlọ̀ nípa àyípadà Ἑλληνιστάς/Ἕλληνας mọ́. Síbẹ̀, àmì àlàyé ìsàlẹ̀ wà lẹ́yìn ‘Kírénè,’ níbi tí kò yẹ, dípò lẹ́yìn ọ̀rọ̀ tó túmọ̀ Ἑλληνιστάς.'
  naturalness: Yorùbá rẹ̀ rọrùn láti ka, ṣùgbọ́n ‘Olúwa Jésù’ jẹ́ àtòjọ tó hàn kedere, tó sì wọ́pọ̀ ju ‘Jesu Olúwa’ fún κύριον Ἰησοῦν. Fífi ‘ará’ hàn ní iwájú ilẹ̀ méjèèjì tún mú ìpín àwọn ènìyàn ilẹ̀ méjèèjì hàn kedere.
  terminology: ‘àwọn Júù tí ń sọ èdè Gíríìkì’ jẹ́ ìtúmọ̀ tó bójú mu fún Ἑλληνιστάς nínú ọ̀rọ̀ akọkọ; ‘àwọn Gíríìkì’ gbọdọ̀ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àyípadà ọ̀rọ̀ ọwọ́. ‘Olúwa Jésù’ pa oyè κύριος mọ́ ní ìlò Yorùbá tí ó ṣe déédé.
