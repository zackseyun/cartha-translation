source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: yo
  text: Bí mo sì ti bẹ̀rẹ̀ sí í sọ̀rọ̀[a], Ẹ̀mí Mímọ́ bà lé wọn, gẹ́gẹ́ bí ó ti bà lé wa náà[c] ní ìbẹ̀rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí mo bẹ̀rẹ̀ sí í sọ̀rọ̀.” Ìṣètò ọ̀rọ̀ Gíríìkì lè túmọ̀ sí “bí” tàbí “nígbà tí.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ní ìbẹ̀rẹ̀” tọ́ka sí ìbẹ̀rẹ̀ ìtújáde Ẹ̀mí sórí àwọn ọmọ-ẹ̀yìn, ìyẹn ni Pẹ́ńtíkọ́stì.
    reason: cross_reference
  - marker: c
    text: 'Ní ọ̀rọ̀ Gíríìkì, ọ̀rọ̀-ìṣe náà kò hàn lẹ́ẹ̀kejì: “gẹ́gẹ́ bí lórí wa náà.” A pèsè “ó ti bà lé” nínú Yorùbá láti inú apá àkọ́kọ́ gbólóhùn náà.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Bí mo sì ti bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Ìtumọ̀ yìí fi hàn pé ìsọ̀kalẹ̀ Ẹ̀mí ṣẹlẹ̀ ní kété tí Peteru bẹ̀rẹ̀ sí í sọ̀rọ̀, ó sì dá ìtumọ̀ àsìkò ti ἐν pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin oníartíkù sí.
- source_word: λαλεῖν
  choice: sọ̀rọ̀
  rationale: “Sọ̀rọ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe Peteru bí ó ti ń bá àwọn olùgbọ́ rẹ̀ sọ̀rọ̀.
- source_word: ἐπέπεσεν
  choice: bà lé
  rationale: “Bà lé” pa àwòrán alágbára ti ἐπιπίπτω mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó yẹ fún Ẹ̀mí tó dé sórí àwọn ènìyàn.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni orúkọ Yorùbá ìgbàlódé tó wọ́pọ̀, tó ṣe kedere, tí ó sì bá Gíríìkì mu.
- source_word: ἐπ’ αὐτούς
  choice: lé wọn
  rationale: Ó bá ọ̀rọ̀-ìṣe “bà lé” mu, ó sì pa ìfiwéra pẹ̀lú “lé wa” mọ́.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: gan-an gẹ́gẹ́ bí ó ti bà lé wa náà
  rationale: “Gan-an gẹ́gẹ́ bí” mú ìfiwéra tó péye ti ὥσπερ jáde, “náà” sì ṣàfihàn καί. A tún ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ nítorí ó ṣe kedere láti inú àyíká sọ fún Yorùbá àdánidá.
- source_word: ἐν ἀρχῇ
  choice: ní ìbẹ̀rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ àsìkò tó ṣe kedere, láì mú kí ó dà bí ìtọ́ka sí ìṣẹ̀dá ayé.
theological_decisions:
- issue: Ohun tí “ní ìbẹ̀rẹ̀” (ἐν ἀρχῇ) ń tọ́ka sí
  choice: A fi “ní ìbẹ̀rẹ̀” sílẹ̀ ní ọ̀nà gbígbòòrò nínú ẹsẹ náà, pẹ̀lú àlàyé pé ó ṣeé ṣe kó tọ́ka sí ìtújáde Ẹ̀mí ní Pẹ́ńtíkọ́stì.
  alternative: Ó lè túmọ̀ sí “ní àkọ́kọ́” láì fi dandan tọ́ka sí Pẹ́ńtíkọ́stì pàtó.
  rationale: Àyíká ọ̀rọ̀ fi ìrírí ilé Kọ̀nẹ́líù wé ohun tó ti ṣẹlẹ̀ sí Peteru àti àwọn ọmọ-ẹ̀yìn mìíràn tẹ́lẹ̀. Síbẹ̀, ẹsẹ náà fúnra rẹ̀ kò dárúkọ Pẹ́ńtíkọ́stì, nítorí náà a kò fi ìtumọ̀ yẹn sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Èdè náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; “bà lé” pa àwòrán ìpilẹ̀ṣẹ̀ mọ́ láì ṣàlàyé ẹ̀kọ́ ìsìn kan sínú ẹsẹ náà.
