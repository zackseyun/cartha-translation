id: ACT.11.17
reference: Acts 11:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: yo
  text: Nítorí náà, bí Ọlọ́run bá fún wọn ní ẹ̀bùn kan náà gẹ́gẹ́ bí ó ti fún wa náà, àwa tí a gba Olúwa Jésù Mèsáyà gbọ́,[a] ta ni èmi tí mo fi lè dí Ọlọ́run lọ́wọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “nígbà tí àwa náà gba Olúwa Jésù Mèsáyà gbọ́.” Àpólà Gíríìkì náà lè ṣàpèjúwe “àwa,” ó sì tún lè ní agbára àkókò nínú ìtumọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: ẹ̀bùn kan náà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ẹ̀bùn tí Ọlọ́run fún àwọn Kèfèrí bá èyí tí ó fún àwọn Júù onígbàgbọ́ dọ́gba; “ẹ̀bùn kan náà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáradọ́gba náà.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: àwa tí a gba Olúwa Jésù Mèsáyà gbọ́
  rationale: Àpólà alábàápín náà bá ἡμῖν mu, nítorí náà ìtumọ̀ àpèjúwe “àwa tí a ... gbọ́” pa ìbáṣepọ̀ gírámà Gíríìkì mọ́. “Gba ... gbọ́” ni ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ nínú ẹni kan.
- source_word: κύριον
  choice: Olúwa
  rationale: Níbi yìí κύριος jẹ́ oyè Jésù, kì í ṣe ‘ọ̀gá’ lásán; “Olúwa” ni ìtumọ̀ Yorùbá tí ó yẹ.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ṣì ní agbára oyè rẹ̀ ní àkójọpọ̀ ọ̀rọ̀ yìí; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró tí a ṣèlérí mọ́ dípò lílo rẹ̀ bí orúkọ ìdílé.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: ta ni èmi tí èmi ìbá fi lè
  rationale: Èyí mú ìbéèrè àsọyé àti ìrẹ̀lẹ̀ Pétérù jáde ní Yorùbá àdánidá, ó sì pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: κωλῦσαι τὸν θεόν
  choice: dí Ọlọ́run lọ́wọ́
  rationale: Àpólà Yorùbá yìí túmọ̀ sí dídènà tàbí fífi ìdíwọ́ sí ohun tí ẹnì kan fẹ́ ṣe, ó sì pa ọ̀rọ̀ líle náà mọ́ pé ìtakò sí ohun tí ó ṣẹlẹ̀ yóò jẹ́ dídènà Ọlọ́run fúnra rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστόν nínú oyè κύριον Ἰησοῦν Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός jẹ́ oyè tí ó ní ìtumọ̀ Mèsáyà, kì í ṣe apá orúkọ tí kò tún ní ìtumọ̀ oyè. “Mèsáyà” pa agbára Júù àti ìlérí oyè náà mọ́ láìfi ẹ̀kọ́ ìjọ kan kún un.
- issue: Ìbáṣepọ̀ πιστεύσασιν pẹ̀lú ἡμῖν
  choice: 'ìtumọ̀ àpèjúwe: “àwa tí a ... gbọ́”'
  alternative: 'ìtumọ̀ àkókò: “nígbà tí àwa náà gba ... gbọ́”'
  rationale: Alábàápín aorist náà wà ní dative plural, ó sì bá ἡμῖν mu. Ìtumọ̀ àpèjúwe tẹ̀lé ìṣọ̀kan gírámà náà pẹ̀lú ìṣọ́ra, nígbà tí àlàyé ìsàlẹ̀ ojú ewé jẹ́ kí ìtumọ̀ àkókò tí ó ṣeé ṣe hàn, láìyanju bí ẹ̀bùn náà àti ìgbàgbọ́ ṣe tẹ̀ lé ara wọn nípa ẹ̀kọ́ ìgbàlà.
- issue: Agbára àsọyé κωλῦσαι τὸν θεόν
  choice: “dí Ọlọ́run lọ́wọ́”
  alternative: “dènà Ọlọ́run”
  rationale: Ìtumọ̀ yìí pa ìfihàn amúnikún-fún-ẹ̀rù náà mọ́ pé kí Pétérù kọ ohun tí Ọlọ́run ṣe sílẹ̀ yóò dà bí fífi ìdíwọ́ fún Ọlọ́run fúnra rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Nítorí náà” so ẹsẹ̀ náà mọ́ àríyànjiyàn tó ṣáájú; “bí ... bá” mú ipò gidi tí εἰ sọ jáde. Àtúnṣe “àwa” nínú “tí ó fún àwa náà” jẹ́ àdánidá ní Yorùbá, ó sì jẹ́ kí ìfiwéra náà ṣe kedere.
