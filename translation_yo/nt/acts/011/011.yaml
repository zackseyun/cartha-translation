  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: yo
  text: Kíyèsí i! Lẹ́sẹ̀kẹsẹ̀, àwọn ọkùnrin mẹ́ta tí a rán láti Kesaria wá sí mi dé sí ilé tí a wà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ipa àmì àsọyé tí ń fa àfiyèsí sí ìṣẹ̀lẹ̀ pàtàkì mọ́, ní èdè Yorùbá tó bójú mu.
- source_word: ἐξαυτῆς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìṣẹ̀lẹ̀ náà hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ lójú ẹsẹ̀, ó sì bá ìtumọ̀ ‘lẹ́sẹ̀ kan náà’ tàbí ‘nígbà náà gan-an’ mu.
- source_word: τρεῖς ἄνδρες
  choice: àwọn ọkùnrin mẹ́ta
  rationale: Ìtumọ̀ tààrà fún nọ́ńbà àti ọ̀rọ̀ tó ń tọ́ka sí àwọn ọkùnrin.
- source_word: ἐπέστησαν
  choice: dé
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n dé ibi náà; ‘dé’ jẹ́ ti ẹ̀dá, ó sì ṣe kedere ní Yorùbá.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: sí ilé
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘dé,’ ‘sí ilé’ fi ibi tí wọ́n dé hàn lọ́nà àdánidá.
- source_word: ἐν ᾗ ἦμεν
  choice: tí àwa wà
  rationale: Ó pa gbólóhùn ibi náà mọ́ láì fi èrò pé wọ́n ń gbé ibẹ̀ tàbí dúró ibẹ̀ kún un.
- source_word: ἀπεσταλμένοι
  choice: a rán wọn
  rationale: Ìkọ́lé aláìlórúkọ yìí pa ohùn àgbàṣe àti iṣẹ́ rírán tí ó ṣáájú dídé wọn mọ́ lọ́nà Yorùbá tó rọrùn.
- source_word: ἀπὸ Καισαρείας
  choice: láti Kesaria
  rationale: Ó fi ibi tí ìrìnàjò tàbí rírán wọn ti bẹ̀rẹ̀ hàn ní tààrà.
- source_word: πρός με
  choice: sí mi
  rationale: Ó fi Pétérù hàn gẹ́gẹ́ bí ẹni tí a rán àwọn ọkùnrin náà sí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọ̀wọ̀, àti òde òní ni a lò. ‘Sì kíyèsí i’ pa ìmúnilójú ἰδοὺ mọ́; ‘lẹ́sẹ̀kẹsẹ̀’ sì yàtọ̀ sí i gẹ́gẹ́ bí àmì àkókò ἐξαυτῆς, nítorí náà kò sí àkọsílẹ̀ ìsàlẹ̀ tí a nílò.
