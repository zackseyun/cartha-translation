id: ACT.11.28
reference: Acts 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: yo
  text: Ọ̀kan nínú wọn, tí orúkọ rẹ̀ ń jẹ́ Ágábù, dìde, ó sì fi hàn nípasẹ̀ Ẹ̀mí Mímọ́ pé ìyàn ńlá kan yóò dé bá gbogbo ilẹ̀ ayé tí ènìyàn ń gbé[a]—èyí sì ṣẹlẹ̀ ní àkókò Kíláúdíù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ayé”; nínú Lúùkù–Ìṣe Àwọn Àpọ́sítélì, “ilẹ̀ ayé tí ènìyàn ń gbé” tún lè tọ́ka ní pàtó sí gbogbo ilẹ̀ tó wà lábẹ́ ìjọba Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ó ṣe àfihàn ìgbésẹ̀ Ágábù nínú àpéjọ náà ní ọ̀nà àdánidá, ó sì bá ìtumọ̀ ti ara ti ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐσήμανεν
  choice: fi hàn
  rationale: ‘Fi hàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ohun kan di mímọ̀, láìfi ìtumọ̀ àsọtẹ́lẹ̀ kan tí ó le ju ti orísun lọ kún un.
- source_word: διὰ τοῦ πνεύματος
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí aṣojú mọ́; àyíká àsọtẹ́lẹ̀ nínú Ìṣe Àwọn Àpọ́sítélì fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí.
- source_word: λιμὸν μεγάλην
  choice: ìyàn ńlá kan
  rationale: Ìtumọ̀ tààrà ni fún ‘great famine,’ ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: μέλλειν ἔσεσθαι
  choice: ń bọ̀ wá dé bá
  rationale: Ó mú ìrètí ọjọ́ iwájú àti ìmọ̀lára pé ohun náà ń sún mọ́lé jáde ní ọ̀nà tí ó bá ‘ìyàn’ mu ní Yorùbá.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: dé bá gbogbo ilẹ̀ ayé tí ènìyàn ń gbé
  rationale: Ó pa ìtumọ̀ οἰκουμένη gẹ́gẹ́ bí ilẹ̀ ayé tí a ń gbé mọ́, láìdín un kù sí ilẹ̀ Róòmù nínú ọ̀rọ̀ pàtàkì.
- source_word: ἥτις ἐγένετο
  choice: èyí sì ṣẹlẹ̀
  rationale: Ó so àsọtẹ́lẹ̀ náà mọ́ ìmúṣẹ rẹ̀ ní èdè Yorùbá tí ó rọrùn, láìfi ìtumọ̀ míì kún un.
- source_word: ἐπὶ Κλαυδίου
  choice: ní àkókò Kíláúdíù
  rationale: Ó tú gbólóhùn àkókò náà ní kedere, láìfi ọ̀rọ̀ ‘ìjọba’ tí kò sí ní tààrà nínú Gíríìkì kún un.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ ń tọ́ka sí nínú διὰ τοῦ πνεύματος
  choice: Ẹ̀mí Mímọ́ ni a ń tọ́ka sí, a sì kọ ‘Ẹ̀mí’ pẹ̀lú lẹ́tà ńlá.
  alternative: Ọ̀rọ̀ tí ẹ̀mí kan mí sí ní ìtumọ̀ tí kò dá ẹni pàtó mọ́.
  rationale: Nínú àyíká àsọtẹ́lẹ̀ ní Ìṣe Àwọn Àpọ́sítélì, ‘Ẹ̀mí’ sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́; lẹ́tà ńlá ń fi ìdájọ́ àyíká yìí hàn.
- issue: Ìwọ̀n ibi tí οἰκουμένη kàn
  choice: gbogbo ilẹ̀ ayé tí ènìyàn ń gbé
  alternative: gbogbo ayé; tàbí gbogbo ilẹ̀ tó wà lábẹ́ ìjọba Róòmù
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ gbígbòòrò, ó sì tún lè tọ́ka sí ayé ilẹ̀ ọba Róòmù nínú Lúùkù–Ìṣe Àwọn Àpọ́sítélì. Ọ̀rọ̀ pàtàkì pa ìtumọ̀ gbígbòòrò mọ́, àlàyé ìsàlẹ̀ sì pa àṣàyàn tó dín kù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn àkọsílẹ̀, ó sì yà àsọtẹ́lẹ̀ àti ìmúṣẹ rẹ̀ sọ́tọ̀ pẹ̀lú àmì gígùn.
