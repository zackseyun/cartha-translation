id: ACT.11.16
reference: Acts 11:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: yo
  text: Nígbà náà ni mo rántí ọ̀rọ̀ Olúwa, bí ó ti sọ pé, ‘Jòhánù fi omi baptisi, ṣùgbọ́n a ó fi Ẹ̀mí Mímọ́ baptisi yín[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó baptisi yín nínú Ẹ̀mí Mímọ́.” Preposition Gíríìkì náà lè túmọ̀ sí “nínú” (gẹ́gẹ́ bí ibi tàbí àyíká) tàbí “fi/pẹ̀lú” (gẹ́gẹ́ bí ohun èlò).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: mo rántí
  rationale: Ọ̀rọ̀ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìṣe aláṣiṣẹ́ níbí; ‘mo rántí’ jẹ́ Yorùbá àdánidá tí ó sì bójú mu ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ nígbà náà.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: δέ ń tẹ ìtàn náà síwájú láìfi ìtakò líle hàn; ‘Nígbà náà ni’ mú ìṣàn ìtàn àti ìtẹnumọ́ Yorùbá jáde dáadáa.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: ῥῆμα túmọ̀ sí ọ̀rọ̀ tàbí àsọjáde tí a sọ, κύριος sì jẹ́ ‘Olúwa’; gbolohun náà tọ́ka sí ọ̀rọ̀ àṣẹ Jesu.
- source_word: ὡς ἔλεγεν
  choice: bí ó ti sọ pé
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì yẹra fún fífi èrò àsọtúnsọ tàbí àṣà sísọ kún imperfect tí àyíká kò fi dandan múlẹ̀.
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: Èyí ni orúkọ Bíbélì tí ó ti fìdí múlẹ̀ ní Yorùbá fún John.
- source_word: μὲν ... δὲ
  choice: ṣùgbọ́n
  rationale: Àwọn patíkù náà fi ìyàtọ̀ hàn láàárín baptisi Jòhánù àti baptisi tí àwọn olùgbọ́ yóò gba; ‘ṣùgbọ́n’ sọ ìyàtọ̀ náà ní kedere.
- source_word: ἐβάπτισεν ὕδατι
  choice: fi omi baptisi
  rationale: Dative ὕδατι níbí lè jẹ́ ohun èlò; ìṣètò ‘fi omi baptisi’ jẹ́ Yorùbá àdánidá, ó sì pa ọ̀rọ̀ ìmọ̀ Bíbélì ‘baptisi’ mọ́.
- source_word: ὑμεῖς
  choice: yín
  rationale: Arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀ ènìyàn. Yorùbá fi ohun tí ó jẹ́ ẹni tí ìṣe dé bá hàn lọ́nà àdánidá pẹ̀lú ‘yín’; ìtakò pẹ̀lú Jòhánù wà nínú ìṣètò gbólóhùn náà.
- source_word: βαπτισθήσεσθε
  choice: a ó ... baptisi yín
  rationale: Ọ̀nà yìí sọ future passive náà ní Yorùbá àdánidá láìdá ẹni tó ń ṣe baptisi náà mọ̀ sí ohun tí orísun kò sọ.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: fi Ẹ̀mí Mímọ́
  rationale: ἐν lè ní ìtumọ̀ ohun èlò (‘fi/pẹ̀lú’) tàbí ibi/àyíká (‘nínú’). ‘Fi Ẹ̀mí Mímọ́’ bá ìṣètò ọ̀rọ̀ baptisi Yorùbá mu, a sì pa ìtumọ̀ ‘nínú’ mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ tí ó sì ní iyì fún κύριος; ní àyíká yìí ó tọ́ka sí Jesu àti ọ̀rọ̀ àṣẹ rẹ̀.
- issue: Preposition inú ἐν πνεύματι ἁγίῳ
  choice: fi Ẹ̀mí Mímọ́
  alternative: nínú Ẹ̀mí Mímọ́
  rationale: Gíríìkì ἐν gba ìtumọ̀ ohun èlò àti ti ibi/àyíká ní àyíká yìí. Àkọsílẹ̀ pàtàkì lo ‘fi’ gẹ́gẹ́ bí Yorùbá àdánidá, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ mìíràn mọ́ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán; ‘baptisi’ àti ‘Ẹ̀mí Mímọ́’ ni a lò gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó ti fìdí múlẹ̀.
