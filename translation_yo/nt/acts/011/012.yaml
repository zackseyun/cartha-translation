  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: Ẹ̀mí náà ni ó fún Peteru ní ìtọ́ni, ó bá àwọn ọkùnrin náà lọ láìṣe ìyàtọ̀, àwọn arákùnrin mẹ́fà náà sì bá a lọ, wọ́n sì wọ ilé ọkùnrin náà. Ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé ní àṣìṣe ìkọ̀wé nínú ‘má ṣe ìyàtọ̀,’ ó sì lo ‘láìlọ́ra,’ èyí tí kò ṣe kedere gẹ́gẹ́ bí ìtumọ̀ àfidípò fún ‘without hesitating.’'
  naturalness: Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá ìgbàlódé, tó ṣàlàyé, tí ó sì yẹ fún ìtàn Bíbélì. ‘Àwọn arákùnrin mẹ́fà wọ̀nyí náà’ jẹ́ ìṣọ̀kan tó rọrùn díẹ̀ ju ‘wọ̀nyí pẹ̀lú’ lọ, ó sì pa ìtumọ̀ ‘also’ mọ́ kedere.
  terminology: ‘Ẹ̀mí náà,’ ‘arákùnrin,’ àti ‘ilé ọkùnrin náà’ bójú mu sí ọ̀rọ̀ orísun. A pa ìtumọ̀ àkọ́kọ́ ‘láìṣe ìyàtọ̀ kankan’ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń fi ìtumọ̀ mìíràn—àìṣiyèméjì/ìfìfẹ̀yà—sílẹ̀ láìyanju ẹ̀kọ́ kan pàtó.
