id: ACT.11.12
reference: Acts 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: yo
  text: Ẹ̀mí náà sì sọ fún mi pé kí n bá wọn lọ láìṣe ìyàtọ̀ kankan.[a] Àwọn arákùnrin mẹ́fà wọ̀nyí náà bá mi lọ, a sì wọ ilé ọkùnrin náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìṣiyèméjì” tàbí “láìfiyèméjì.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé kí ènìyàn má ṣe ìyàtọ̀ kankan, tàbí kí ó má ṣiyèméjì.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Ẹ̀mí náà
  rationale: Àyíká ìtọ́sọ́nà ní Ìṣe àwọn Aposteli fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; ‘Ẹ̀mí náà’ pa ọ̀rọ̀ Gíríìkì mọ́ láìfi ‘Mímọ́’ kún un níbi tí kò ti fara hàn gbangba.
- source_word: εἶπεν ... μοι
  choice: sọ fún mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtọ́ni tí a fún ẹni kan.
- source_word: συνελθεῖν αὐτοῖς
  choice: kí n bá wọn lọ
  rationale: Ó sọ ìtumọ̀ pé kí Peteru tẹ̀ lé àwọn ọkùnrin náà gẹ́gẹ́ bí alábàákẹ́gbẹ́ wọn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: μηδὲν διακρίναντα
  choice: láìṣe ìyàtọ̀ kankan
  rationale: διακρίνω lè túmọ̀ sí ṣíṣe ìyàtọ̀, ṣiyèméjì, tàbí lọ́ra láti ṣe nǹkan. Nínú àyíká ààlà láàárín Júù àti Kèfèrí, ‘láìṣe ìyàtọ̀ kankan’ bá ọ̀rọ̀ náà mu dáadáa, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: àwọn arákùnrin mẹ́fà wọ̀nyí
  rationale: Àwọn ẹni tí ọ̀rọ̀ náà ń tọ́ka sí jẹ́ ọkùnrin mẹ́fà; ‘wọ̀nyí’ sì ṣàfihàn οὗτοι.
- source_word: εἰσήλθομεν
  choice: a sì wọ
  rationale: Ìtumọ̀ Yorùbá tó rọrùn, tó sì bá ìtàn lọ ni èyí fún wíwọ inú ilé.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: ilé ọkùnrin náà
  rationale: Ó pa ọ̀rọ̀-orúkọ ọkùnrin tí Gíríìkì lò mọ́, dípò yíyí i padà sí arọ́pò-orúkọ.
theological_decisions:
- issue: Ìtumọ̀ μηδὲν διακρίναντα nínú àlàyé Peteru
  choice: láìṣe ìyàtọ̀ kankan
  alternative: láìlọ́ra tàbí láìṣiyèméjì
  rationale: Àyíká náà dá lórí bí Peteru ṣe kọjá ààlà Júù àti Kèfèrí, nítorí náà ìtumọ̀ ṣíṣe àìyàtọ̀ lágbára níhìn-ín. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí àìlọ́ra tàbí àìṣiyèméjì, a sì pa èyí mọ́ nínú àlàyé ìsàlẹ̀ ojú ewé.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, tí ó sì ní àmì ohùn ní kíkún. A lo ‘Ẹ̀mí náà’ láti pa ìsọ̀rọ̀ orísun mọ́, ‘arákùnrin’ fún àwọn ọkùnrin mẹ́fà náà, àti àlàyé ìsàlẹ̀ ojú ewé láti pa àìdánilójú gidi nínú διακρίνω mọ́.
