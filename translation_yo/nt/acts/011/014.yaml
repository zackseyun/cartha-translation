  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: yo
  text: Òun yóò sọ àwọn ọ̀rọ̀ fún ọ; nípasẹ̀ wọn ni a ó gba ìwọ àti gbogbo àwọn ará ilé rẹ là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gangan, a lè túmọ̀ ọ́ sí “nínú àwọn ọ̀rọ̀ wọ̀nyí” tàbí “nípasẹ̀ àwọn ọ̀rọ̀ wọ̀nyí”; gbólóhùn Gíríìkì náà fi hàn pé àwọn ọ̀rọ̀ wọ̀nyí ni ọ̀nà tí ìgbàlà fi dé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ẹni tí a mẹ́nu kàn ṣáájú; “Òun” jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn tuntun ní Yorùbá.
- source_word: λαλήσει
  choice: yóò sọ
  rationale: Ó túmọ̀ sí pé yóò sọ ọ̀rọ̀ tàbí kéde iṣẹ́ kan; “yóò sọ” bá èdè Yorùbá òde òní mu.
- source_word: ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: A pa ọ̀pọ̀ nọ́ńbà àti ìtumọ̀ gangan ti ῥήματα mọ́ dípò lílo “iṣẹ́” tàbí “ìhìn.”
- source_word: πρὸς σὲ
  choice: fún ọ
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe sísọ, πρός tọ́ka sí ẹni tí a ń bá sọ̀rọ̀; “fún ọ” jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν οἷς
  choice: nípasẹ̀ èyí tí
  rationale: Nínú àyíká yìí, ἐν fi àwọn ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò tí ìgbàlà fi dé.
- source_word: σωθήσῃ
  choice: a ó fi ... gba ... là
  rationale: Ẹ̀yà àìṣe ti σῴζω ni a fi hàn pẹ̀lú ìhun Yorùbá àdánidá “a ó gba ... là,” láìsọ ẹni tó ṣe iṣẹ́ náà ní pàtó.
- source_word: σὺ
  choice: ìwọ
  rationale: A pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́ nípasẹ̀ lílo “ìwọ” ní kedere.
- source_word: πᾶς ὁ οἶκός σου
  choice: gbogbo agbo ilé rẹ
  rationale: “Agbo ilé” ń tọ́ka sí gbogbo àwọn tó jẹ́ ti ilé náà, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìgbàlà nínú àyíká agbo ilé Kọ̀nẹ́líù
  choice: “a ó ... gba ... là”
  alternative: “a ó dá ... sílẹ̀”
  rationale: Àyíká Ìṣe Àwọn Àpọ́sítélì ń sọ̀rọ̀ nípa gbígbọ́ ìhìn rere àti ìgbàlà; a pa agbára ẹ̀kọ́ ìgbàlà ti σῴζω mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìwọ̀n “gbogbo agbo ilé rẹ”
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí gbogbo agbo ilé, láìsọ pé ìgbàlà wọn wá láìsí ìdáhùn ẹnì kọ̀ọ̀kan.
  alternative: “gbogbo àwọn ará ilé rẹ”
  rationale: Gíríìkì fi gbogbo agbo ilé sínú ìlérí náà, ṣùgbọ́n ẹsẹ yìí kò ṣàlàyé bí olúkúlùkù ṣe kópa; ìtumọ̀ náà kò fi ẹ̀kọ́ ẹ̀ya ìjọ kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní; a lo “agbo ilé” láti yẹra fún ìtumọ̀ ilé gbígbé nìkan, a sì pa àmì ohùn mọ́ níbi tó yẹ.
