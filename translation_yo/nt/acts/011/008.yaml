id: ACT.11.8
reference: Acts 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: yo
  text: Ṣùgbọ́n mo wí pé, ‘Rárá, Olúwa, nítorí kò sí ohun tí a kà sí èèwọ̀ ní ti ìsìn tàbí ohun àìmọ́ tí ó ti wọ ẹnu mi rí.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Rárá o
  rationale: Ọ̀rọ̀ ìkọ̀sílẹ̀ líle ni; ‘Rárá o’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkọ̀ líle hàn.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó pa ìkésíni tààrà mọ́, ó sì bá bí Peteru ṣe dá ẹni tó ń bá a sọ̀rọ̀ lóhùn mu.
- source_word: κοινὸν
  choice: ohun tí a kà sí ẹ̀gbin
  rationale: Nínú àyíká òfin oúnjẹ, κοινός túmọ̀ sí ohun tí kò yẹ fún lílò mímọ́ tàbí tí a sọ di aláìmọ́ ní ti ìṣe ìsìn; gbolóhùn yìí yà á sọ́tọ̀ díẹ̀ kúrò lọ́dọ̀ ἀκάθαρτος.
- source_word: ἀκάθαρτον
  choice: ohun àìmọ́
  rationale: Ó fi ìtumọ̀ ohun tí kò mọ́ ní ti ìlànà ìsìn hàn, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου
  choice: kò tíì wọ ẹnu mi rí
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ Yorùbá àdánidá fún ohun tí kò ṣẹlẹ̀ rí títí di àsìkò ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìyàtọ̀ láàárín κοινόν àti ἀκάθαρτον
  choice: ohun tí a kà sí ẹ̀gbin tàbí ohun àìmọ́
  alternative: ohun tí kò wọ́pọ̀ tàbí ohun àìmọ́
  rationale: ‘Kò wọ́pọ̀’ lè ṣìnà ní Yorùbá ode òní. Àṣàyàn náà tọ́ka sí ìpín oúnjẹ ní ti ìlànà ìsìn, ó sì pa àwọn ọ̀rọ̀ méjèèjì mọ́ láìdapọ̀ wọn pátápátá.
- issue: Ìbáṣepọ̀ ὅτι pẹ̀lú ìkọ̀ Peteru
  choice: nítorí
  alternative: nítorí pé
  rationale: Ó pa ìdí tí Peteru fi kọ̀ mọ́ gẹ́gẹ́ bí orísun ṣe fi hàn, láìṣe àlàyé ẹ̀kọ́ ẹ̀sìn sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbo.
