  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: yo
  text: Wọ́n sì ṣe bẹ́ẹ̀, nípa rírán án sí àwọn alàgbà nípasẹ̀ Bánábà àti Saulu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, ‘nípasẹ̀ ọwọ́ Bánábà àti Saulu.’ Àṣà-ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé, ‘nípasẹ̀ ọwọ́ Bánábà àti Saulu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Wọ́n sì ṣe bẹ́ẹ̀
  rationale: Ọ̀rọ̀ arọ́pò ὃ tọ́ka sí ohun tí wọ́n pinnu láti ṣe ní ẹsẹ tó ṣáájú, ìyẹn ìrànlọ́wọ́ náà. ‘Wọ́n sì ṣe bẹ́ẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́kasí yẹn mọ́.
- source_word: ἀποστείλαντες
  choice: wọ́n fi í ránṣẹ́
  rationale: Ìṣe alábàápín aorist yìí ṣàlàyé bí wọ́n ṣe mú ohun tí wọ́n pinnu ṣẹ; ‘wọ́n fi í ránṣẹ́’ jẹ́ kedere, ó sì mú ohun tí àyíká ọ̀rọ̀ tọ́ka sí wá pẹ̀lú arọ́pò-orúkọ ‘í.’
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: sí àwọn alàgbà
  rationale: Nínú Ìṣe Àwọn Aposteli, πρεσβύτεροι jẹ́ àwọn aṣáájú tí ìjọ mọ̀ sí ipò náà. ‘Àwọn alàgbà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún wọn.
- source_word: διὰ χειρὸς
  choice: nípasẹ̀
  rationale: Àṣà-ọ̀rọ̀ Gíríìkì náà túmọ̀ sí lílo àwọn ènìyàn gẹ́gẹ́ bí aṣojú tàbí olùgbé ohun lọ. ‘Nípasẹ̀’ sọ ìtumọ̀ náà ní Yorùbá àdánidá; àlàyé ìtumọ̀ gangan wà nínú àlàyé ìsàlẹ̀.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Bánábà àti Saulu
  rationale: A kọ orúkọ àwọn ènìyàn náà ní ìrísí tí ó bá ìlò Yorùbá mu, pẹ̀lú àmì ohùn níbi tí ó ti yẹ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́wọ́lọ́wọ́, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé lásán ni a lò. A yan ‘nípasẹ̀’ dípò títẹ̀lé àṣà-ọ̀rọ̀ Gíríìkì ní tààrà nínú ẹsẹ, kí gbolohun náà lè dun bí Yorùbá àdánidá, ṣùgbọ́n a pa àwòrán ‘ọwọ́’ mọ́ nínú àlàyé ìsàlẹ̀.
