id: ACT.11.1
reference: Acts 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: yo
  text: Àwọn aposteli àti àwọn arákùnrin tí wọ́n wà káàkiri Jùdíà gbọ́ pé àwọn Kèfèrí náà ti gba ọ̀rọ̀ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin”; Gíríìkì náà ní “àwọn arákùnrin,” ó sì lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: gbọ́
  rationale: Ọ̀rọ̀ náà jẹ́ aorist tó ń sọ pé wọ́n gbọ́ ìròyìn; “gbọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá orísun mu.
- source_word: δὲ
  choice: kò ṣe pàtó nínú gbolohun Yorùbá
  rationale: Níhìn-ín δέ jẹ́ àmì ìyípadà nínú ìtàn, kì í ṣe àmì ìtakora líle. Yorùbá àdánidá kò nílò kí a fi ọ̀rọ̀ àfikún bí “nígbà náà” sí i.
- source_word: ἀπόστολοι
  choice: àwọn aposteli
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn aposteli tí a mọ̀ nínú Ìṣe; ọ̀rọ̀ ìjọ tó ti wọ́pọ̀ ni Yorùbá ni a lò.
- source_word: ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ, ṣùgbọ́n ó lè dúró fún àwọn onígbàgbọ́ lápapọ̀. A pa ìrísí akọ mọ́ nínú àyọkà, a sì ṣàlàyé agbára ìtumọ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: tí wọ́n wà káàkiri Jùdíà
  rationale: κατά pẹ̀lú accusative níhìn-ín ní ìtumọ̀ pípín káàkiri agbègbè; “káàkiri Jùdíà” ṣe àfihàn rẹ̀ ju “ní Jùdíà” lọ.
- source_word: Ἰουδαίαν
  choice: Jùdíà
  rationale: Àkọsílẹ̀ orúkọ ilẹ̀ náà ní Yorùbá tó ti wọ́pọ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí wọ́n gbọ́ sílẹ̀; “pé” ni asopọ̀ Yorùbá tó bójú mu.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó tẹnumọ́ pé àwọn Kèfèrí tún wà lára àwọn tó gba ọ̀rọ̀ náà; “pẹ̀lú” pa ìtumọ̀ àfikún yìí mọ́.
- source_word: τὰ ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká Ìṣe yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìṣèlú.
- source_word: ἐδέξαντο
  choice: ti gba
  rationale: δέχομαι lè túmọ̀ sí gbà tàbí tẹ́wọ́ gbà. “Ti gba” bá àsọyé “gba ọ̀rọ̀ Ọlọ́run” mu, ó sì fi hàn pé ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ ṣáájú bí wọ́n ṣe gbọ́ ìròyìn rẹ̀.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Àsọyé Bíbélì tó wọ́pọ̀ ni fún iṣẹ́ ìkéde Ọlọ́run; ó pa ìró àti ìwúwo ẹ̀kọ́ orísun mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοὶ níbi tí ó ṣeé ṣe kí ó kó gbogbo àwùjọ onígbàgbọ́ sínú
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: A pa akọ ọ̀pọ̀ tó wà nínú Gíríìkì mọ́, láì sẹ́ pé ó lè jẹ́ ọ̀rọ̀ aṣojú fún àwọn onígbàgbọ́ ọkùnrin àti obìnrin; àlàyé ìsàlẹ̀ sọ ìtumọ̀ tó gbòòrò náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ìsìn ẹgbẹ́ kan pàtó.
