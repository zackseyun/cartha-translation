  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: yo
  text: Nígbà tí ó dé, tí ó sì rí oore-ọ̀fẹ́ Ọlọ́run[a], inú rẹ̀ dùn, ó sì ń rọ gbogbo wọn pé kí wọ́n máa bá Olúwa lọ pẹ̀lú ìpinnu ọkàn wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oore-ọ̀fẹ́ tí ó ti ọ̀dọ̀ Ọlọ́run wá.” Gbolohun náà lè tọ́ka sí ẹ̀rí iṣẹ́ inú rere Ọlọ́run tí ó hàn gbangba láàárín wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọ́n máa faramọ́ Olúwa” tàbí “kí wọ́n máa jẹ́ olóòótọ́ sí Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: nígbà tí ó dé
  rationale: Ó sọ dídé Báránábà sí ibẹ̀ ní Yorùbá àdánidá, ó sì pa ìtumọ̀ participle aorist náà mọ́.
- source_word: ἰδὼν
  choice: tí ó sì rí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí rírí; àyíká lè ní ìtumọ̀ fífiyèsí iṣẹ́ Ọlọ́run, ṣùgbọ́n a kò fi ìtumọ̀ àfikún náà rọ́pò ọ̀rọ̀ orísun.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Ó pa ìwúwo ẹ̀kọ́-ìgbàgbọ́ χάρις mọ́, ó sì lè tọ́ka sí iṣẹ́ inú rere Ọlọ́run tí ó hàn gbangba láàárín wọn.
- source_word: ἐχάρη
  choice: inú rẹ̀ dùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ó yọ̀ tàbí ó kún fún ayọ̀.
- source_word: παρεκάλει
  choice: ó sì ń rọ
  rationale: Àmì àsìkò imperfect fi hàn pé ó ń ṣe bẹ́ẹ̀ lọ́wọ́lọ́wọ́ tàbí léraléra; ‘ń rọ’ mú agbára ìṣílétí náà jáde.
- source_word: πάντας
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn onígbàgbọ́ tí àyíká ẹsẹ náà ń sọ̀rọ̀ nípa wọn.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: fi ìpinnu ọkàn
  rationale: πρόθεσις jẹ́ ète tàbí ìpinnu, καρδία sì jẹ́ inú ẹni gẹ́gẹ́ bí ibùdó ìfẹ́ àti ìfẹ̀sọ́nà; gbolohun yìí jẹ́ kedere, ó sì sún mọ́ ìṣètò Gíríìkì.
- source_word: προσμένειν
  choice: dúró ṣinṣin ti
  rationale: Ó ṣàfihàn títẹ̀síwájú nínú ìbáṣepọ̀ àti ìfaramọ́; ‘dúró ṣinṣin ti’ jẹ́ Yorùbá àdánidá tí kò fi ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: A pa oyè κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa’; nínú àyíká Ìṣe, ó ń tọ́ka sí Jésù tí ó jíǹde.
theological_decisions:
- issue: Ìtumọ̀ ‘oore-ọ̀fẹ́ Ọlọ́run’ nínú àyíká yìí
  choice: Iṣẹ́ inú rere Ọlọ́run tí ẹ̀rí rẹ̀ hàn láàárín àwọn onígbàgbọ́ Áńtíókù
  alternative: Ìwà inú rere láti ọ̀dọ̀ Ọlọ́run tàbí ìwà rere àwọn onígbàgbọ́
  rationale: Àyíká Ìṣe tọ́ka sí ojú rere àti iṣẹ́ Ọlọ́run tí a lè rí ẹ̀rí rẹ̀. A pa gbolohun náà mọ́ láì túmọ̀ rẹ̀ sí ‘ohun tí Ọlọ́run ṣe,’ kí gbogbo ìtumọ̀ rẹ̀ lè dúró.
- issue: Agbára προσμένειν τῷ κυρίῳ
  choice: Títẹ̀síwájú nínú ìfaramọ́ tímọ́tímọ́ sí Olúwa
  alternative: Láti máa bá Olúwa lọ tàbí láti jẹ́ olóòótọ́ sí Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì ń sọ nípa dídúró nínú ìbáṣepọ̀ àti ìfaramọ́. ‘Dúró ṣinṣin ti Olúwa’ sọ èyí ní kedere láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó dín kù kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Dúró ṣinṣin ti Olúwa’ yẹra fún ìtumọ̀ gígùn jù, ó sì pa ìfaramọ́ tí προσμένω ní mọ́.
