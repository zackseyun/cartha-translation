source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: yo
  text: Ó sì ròyìn fún wa bí ó ti rí áńgẹ́lì náà tí ó dúró nínú ilé rẹ̀, tí ó sì wí pé, “Ránṣẹ́ lọ sí Jọpa, kí o sì ránṣẹ́ pe[a] Símónì, ẹni tí a ń pè ní Pétérù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí o sì pe Símónì wá.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ fífiṣẹ́ pe ẹnì kan kí ó wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: ròyìn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí jíjíṣẹ́ ìròyìn tàbí sísọ ohun tí ó ṣẹlẹ̀ fún àwọn ẹlòmíràn; ‘ròyìn’ bá ìṣàn ìtàn náà mu.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ níbí, tí ó ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn.
- source_word: πῶς εἶδεν
  choice: bí ó ti rí
  rationale: ‘Bí ó ti rí’ pa ìtumọ̀ πῶς mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tó wà nínú ìròyìn náà.
- source_word: τὸν ἄγγελον
  choice: áńgẹ́lì náà
  rationale: Àtẹ̀jáde náà ní article, àyíká ìtàn sì tọ́ka sí áńgẹ́lì pàtó tí Kọ̀nẹ́lì ti rí.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: nínú ilé rẹ̀
  rationale: Ó sọ ibi tí ìran náà ti ṣẹlẹ̀ ní tààràtà, ìyẹn inú ibùgbé rẹ̀.
- source_word: σταθέντα καὶ εἰπόντα
  choice: tí ó dúró ... tí ó sì ń sọ
  rationale: Èyí pa ìṣe méjèèjì mọ́—dídúró àti sísọ—ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Ránṣẹ́ sí Jọpa
  rationale: Imperative náà kò sọ ẹni tí a ó rán ní gbangba; ìtumọ̀ yìí kò fi ‘àwọn ọkùnrin’ kún ohun tí Gíríìkì sọ.
- source_word: μετάπεμψαι
  choice: ránṣẹ́ pe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ènìyàn ránṣẹ́ lọ pe ẹlòmíràn kí ó wá; ‘ránṣẹ́ pe’ mú ìtumọ̀ yẹn jáde ní Yorùbá.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: ẹni tí a ń pè ní Pétérù
  rationale: Ó dá Símónì mọ̀ nípasẹ̀ orúkọ mìíràn tí a fi ń pè é, láìsọ pé orúkọ ìdílé ni.
