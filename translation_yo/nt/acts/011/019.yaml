id: ACT.11.19
reference: Acts 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: yo
  text: Nítorí náà, àwọn tí a ti tú ká nítorí ìpọ́njú náà[a] tí ó wáyé lórí ọ̀ràn Sítéfánù rin ìrìn àjò dé Fòníṣíà, Kípírọ́sì àti Áńtíókù; wọn kò sì sọ ọ̀rọ̀ náà[b] fún ẹnikẹ́ni bí kò ṣe fún àwọn Júù nìkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìpọ́njú” tún lè jẹ́ “inúnibíni.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìnira, wàhálà, tàbí inúnibíni nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀rọ̀ náà” níbí ni ìhìn tí wọ́n ń kéde nípa Jésù; a tún lè túmọ̀ rẹ̀ sí “ìhìn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: àwọn tí a ti tú ká
  rationale: Ó pa ohùn àìṣe ti participle Gíríìkì mọ́, ó sì fi hàn pé títú wọn ká ti ṣẹlẹ̀ ṣáájú ìrìn àjò náà.
- source_word: θλίψεως
  choice: ìpọ́njú
  rationale: “Ìpọ́njú” lè túmọ̀ sí wàhálà, ìnira tàbí ìṣe inúnibíni, nítorí náà ó pa ìtúmọ̀ gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì dín in kù sí inúnibíni nìkan.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: tí ó ṣẹlẹ̀ nípa Sítéfánù
  rationale: Ó fi ìbáṣepọ̀ ìṣẹ̀lẹ̀ náà pẹ̀lú ọ̀ràn Sítéfánù hàn, láì pinnu jù bóyá ìtumọ̀ náà jẹ́ “nítorí” tàbí “ní ìsopọ̀ pẹ̀lú.”
- source_word: διῆλθον ἕως
  choice: rin ìrìn àjò dé
  rationale: Gbólóhùn náà jẹ́ Yorùbá àdánidá fún ìrìn wọn títí dé àwọn ibi tí a dárúkọ.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Fòníṣíà, Kípírọ́sì àti Áńtíókù
  rationale: Àwọn wọ̀nyí ni ìkọ̀wé orúkọ ilẹ̀ àti ìlú náà ní Yorùbá, pẹ̀lú àmì ohùn níbi tí ó yẹ.
- source_word: μηδενὶ λαλοῦντες
  choice: wọn kò sì sọ ... fún ẹnikẹ́ni
  rationale: Ó sọ participle náà di gbólóhùn Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ “sọ fún ẹnikẹ́ni” mọ́.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa àṣà Lúùkù ti lílo “ọ̀rọ̀ náà” gẹ́gẹ́ bí ọ̀rọ̀ àkótán fún ìhìn tí a ń kéde mọ́, láì fi àlàyé míì sínú ọ̀rọ̀ pàtàkì.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: bí kò ṣe fún àwọn Júù nìkan
  rationale: “Bí kò ṣe ... nìkan” pa ìtẹnumọ́ méjèèjì ti εἰ μή àti μόνον mọ́ ní Yorùbá tó bójú mu.
theological_decisions:
- issue: Irú ìpọ́njú tó tẹ̀ lé ikú Sítéfánù
  choice: Lo “ìpọ́njú” nínú ọ̀rọ̀ pàtàkì.
  alternative: inúnibíni
  rationale: Àyíká ọ̀rọ̀ náà ní inúnibíni nínú, ṣùgbọ́n θλῖψις ní ìtumọ̀ tó gbòòrò ju èyí lọ; “ìpọ́njú” kò fi ìtumọ̀ tóóró lé e lórí.
- issue: Ìtumọ̀ τὸν λόγον nínú Ìṣe Àwọn Àpọ́sítélì
  choice: Pa “ọ̀rọ̀ náà” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ìhìn náà; ìhìn rere nípa Jésù
  rationale: “Ọ̀rọ̀ náà” pa àkòrí àti ọ̀nà ìsọ̀rọ̀ Lúùkù mọ́; àfikún “nípa Jésù” yóò jẹ́ àlàyé ìtumọ̀ tí kò fara hàn ní tààrà nínú gbólóhùn Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà níyì, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ “fún àwọn Júù nìkan” mọ́.
