source:
  edition: SBLGNT
  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, àwọn wòlíì sọ̀kalẹ̀ láti Jerúsálẹ́mù wá sí Áńtíókù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ̀kalẹ̀ láti Jerúsálẹ́mù lọ sí Áńtíókù.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “wá sọ̀kalẹ̀” tàbí “lọ sọ̀kalẹ̀”; a yan “sọ̀kalẹ̀ ... wá” láti ojú-ìwòye dídé wọn sí Áńtíókù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó pa ìtumọ̀ àkókò mọ́ ní Yorùbá àdánidá. A kò fi ọ̀rọ̀ míì kun un fún δέ, nítorí agbára àsopọ̀ rẹ̀ rọ̀ níbí.
- source_word: κατῆλθον
  choice: sọ̀kalẹ̀ ... wá
  rationale: ‘Sọ̀kalẹ̀’ pa ìtumọ̀ ìrìn láti ibi gíga sí ibi ìsàlẹ̀ mọ́; ‘wá’ sì gbé ojú-ìwòye dídé sí Áńtíókù hàn ní Yorùbá àdánidá.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: láti Jerúsálẹ́mù
  rationale: ἀπό túmọ̀ sí ‘láti’; orúkọ ìlú náà sì jẹ́ Jerúsálẹ́mù ní ìlò Yorùbá.
- source_word: προφῆται
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ‘prophets,’ láì dín iṣẹ́ wọn kù sí olùkọ́ tàbí oníwàásù.
- source_word: εἰς Ἀντιόχειαν
  choice: sí Áńtíókù
  rationale: εἰς ń tọ́ka sí ìlọ sí ibi kan; ‘sí’ ni ọ̀nà Yorùbá àdánidá láti sọ ìrìn sí ìlú kan.
theological_decisions:
- issue: Ìrú iṣẹ́ àwọn ‘wòlíì’ nínú àwùjọ ìgbàgbọ́ Jerúsálẹ́mù àti Áńtíókù
  choice: àwọn wòlíì
  alternative: àwọn olùkọ́ àsọtẹ́lẹ̀; àwọn òjíṣẹ́ tí Ẹ̀mí mí sí
  rationale: Gíríìkì lo ọ̀rọ̀ gbogbogbò προφῆται, kò sì ṣàlàyé ààlà iṣẹ́ wọn níbí. ‘Àwọn wòlíì’ pa àìdánilójú náà mọ́ láì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé gbogbogbò. A fi àmì ìdákẹ́jẹ sí lẹ́yìn gbólóhùn àkókò fún ìṣàn ọ̀rọ̀ àdánidá.
