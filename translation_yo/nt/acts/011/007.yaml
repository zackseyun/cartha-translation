id: ACT.11.7
reference: Acts 11:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: yo
  text: Mo sì tún gbọ́ ohùn kan tí ó ń sọ fún mi pé, “Dìde, Pétérù; pa ẹran, kí o sì jẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: Dìde
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ pé kí ẹni tí ó jókòó tàbí dùbúlẹ̀ dìde.
- source_word: θῦσον
  choice: pa ẹran
  rationale: Nínú àyíká ìran àwọn ẹranko, ọ̀rọ̀ náà túmọ̀ sí pípa ẹranko fún jíjẹ; fífi “ẹran” kún un mú ète náà ṣe kedere láìfi ìtumọ̀ ẹbọ tí àyíká kò béèrè sí i.
- source_word: φάγε
  choice: jẹ
  rationale: Ìtumọ̀ tààrà àti àdánidá fún àṣẹ náà ni “jẹ.”
- source_word: φωνῆς λεγούσης μοι
  choice: ohùn kan tí ó ń sọ fún mi
  rationale: Ó pa ìtumọ̀ participle Gíríìkì mọ́ ní èdè Yorùbá tó ń ṣàn dáadáa.
theological_decisions:
- issue: Bóyá θῦσον yẹ kí a túmọ̀ sí ọ̀rọ̀ ẹbọ
  choice: pa ẹran
  alternative: rú ẹbọ
  rationale: Àyíká náà dá lórí pípa àwọn ẹranko àti jíjẹ wọn, kì í ṣe àṣẹ láti ṣe ìrúbọ; nítorí náà a kò fi èrò ẹ̀kọ́ ìsìn tí kò hàn gbangba sínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti ìtàn, ó ní iyì, ó sì rọrùn fún òǹkàwé òde òní.
