  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: yo
  text: wọ́n ń wí pé,[a] “Ìwọ wọlé sí ọ̀dọ̀ àwọn ọkùnrin aláìkọlà, o sì bá wọn jẹun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àwọn ọkùnrin aláìkọlà.” ‘Àwọn ọkùnrin aláìkọlà’ ń tọ́ka sí àwọn tí kò ní àmì ìkọlà nínú májẹ̀mú àwọn Júù, ìyẹn àwọn tí kì í ṣe Júù.
    reason: Àṣàyàn ìtumọ̀ fún πρὸς àti àlàyé ọ̀rọ̀ inú àṣà.
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ àbọ̀ ìsinsìnyí yìí so ẹ̀sùn náà mọ́ ìtàn tó ṣáájú; ọ̀nà yìí sì jẹ́ Yorùbá àdánidá.
- source_word: ὅτι
  choice: pé, “
  rationale: Ó ṣí ọ̀rọ̀ tí wọ́n sọ ní tààrà; àmì ọ̀rọ̀ àsọyé mú un hàn ní Yorùbá.
- source_word: Εἰσῆλθες πρὸς ἄνδρας
  choice: Ìwọ wọ ilé àwọn ọkùnrin
  rationale: εἰσέρχομαι túmọ̀ sí wíwọlé, πρός pẹ̀lú ènìyàn sì lè tọ́ka sí lílọ sínú ibùgbé tàbí àwùjọ wọn. Fífi ‘ilé’ kún un jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹ̀sùn wíwọlé sí ọ̀dọ̀ wọn, láì yí ìtumọ̀ padà.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: aláìkọlà
  rationale: Ó pa àpèjúwe gidi ti Gíríìkì mọ́—àwọn tí a kò kọ ní ilà—dípò fífi ìtumọ̀ rẹ̀ sí ‘Kèfèrí’ sínú ọ̀rọ̀ pàtàkì.
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: o sì bá wọn jẹun
  rationale: ‘Bá wọn jẹun’ jẹ́ Yorùbá àdánidá tó ṣàfihàn συνεσθίω, ìyẹn jíjẹun papọ̀ pẹ̀lú wọn.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἀκροβυστίαν ἔχοντας sí ‘àwọn Kèfèrí’ tàbí kí a pa àpèjúwe àìkọlà mọ́
  choice: àwọn ọkùnrin aláìkọlà
  alternative: àwọn ọkùnrin Kèfèrí
  rationale: Ẹ̀sùn àwọn olùsọ̀rọ̀ náà dá lórí àmì májẹ̀mú ìkọlà àti ààlà ìbáṣepọ̀. ‘Aláìkọlà’ pa ìforígbárí ẹ̀sìn àti àwùjọ tó wà nínú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo ‘wọ ilé …’ àti ‘bá wọn jẹun’ gẹ́gẹ́ bí àwọn ọ̀nà Yorùbá àdánidá; a sì pa ọ̀rọ̀ ‘aláìkọlà’ mọ́ nítorí agbára ẹ̀sùn inú orísun.
