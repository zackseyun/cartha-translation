  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ ẹ̀sùn náà mọ́ dáadáa: àwọn ọkùnrin ni ἀνήρ, ‘aláìkọlà’ sì dá ìṣàpèjúwe ἀκροβυστίαν ἔχοντας dúró láì yí i sí ‘Kèfèrí’ nínú ọ̀rọ̀ pàtàkì. Ṣùgbọ́n ‘wọ ilé’ fi ‘ilé’ kún ọ̀rọ̀ orísun níbi tí Gíríìkì ti sọ pé ó wọlé sí ọ̀dọ̀ àwọn ọkùnrin náà. Àlàyé ìsàlẹ̀ tó wà tẹlẹ̀ tún ṣe ‘wọ́n ń bá a jiyàn’ ní àṣàyàn, èyí tí kò jẹ́ àṣàyàn ìtumọ̀ tó bá λέγοντες mu.'
