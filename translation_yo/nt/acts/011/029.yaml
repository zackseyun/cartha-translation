id: ACT.11.29
reference: Acts 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ-ẹ̀yìn pinnu pé olúkúlùkù wọn yóò fi ìrànlọ́wọ́ ránṣẹ́ sí àwọn arákùnrin tí ń gbé ní Jùdíà, gẹ́gẹ́ bí ohun tí ó lè ṣe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ẹnì kọ̀ọ̀kan ṣe ní ìlọsíwájú,” tàbí “gẹ́gẹ́ bí ohun tí ẹnì kọ̀ọ̀kan lè ná.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn arákùnrin” níbí túmọ̀ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn ní Jùdíà, títí kan gbogbo àwùjọ Kristẹni níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tí wọ́n ń tẹ̀ lé Jesu gẹ́gẹ́ bí olùkọ́ wọn.
- source_word: ὥρισαν
  choice: pinnu
  rationale: Ó fi ìpinnu tí wọ́n mọ̀ọ́mọ̀ ṣe hàn ní èdè Yorùbá adayébá.
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: olúkúlùkù gẹ́gẹ́ bí agbára rẹ̀ ti mọ́
  rationale: Ó pa ìtumọ̀ pínpín mọ́ pé ẹnì kọ̀ọ̀kan yóò fi ohun tí ipò àti ohun ìní rẹ̀ gbà ṣe ránṣẹ́.
- source_word: εἰς διακονίαν πέμψαι
  choice: láti fi ìrànlọ́wọ́ ránṣẹ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, διακονία túmọ̀ sí iṣẹ́ ìrànwọ́ fún àwọn onígbàgbọ́ tí wọ́n nílò rẹ̀; gbolóhùn yìí jẹ́ Yorùbá tó ṣe kedere láì sọ irú ẹ̀bùn náà ní pàtó.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: tí ń gbé ní Jùdíà
  rationale: Ìtumọ̀ tààrà, adayébá ti gbólóhùn aláápọn Gíríìkì náà.
- source_word: ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: Ó pa àwòrán ìbátan àti fọ́ọ̀mù akọ ọ̀pọ̀ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοῖς fún àwùjọ Kristẹni ní Jùdíà
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Gíríìkì lo akọ ọ̀pọ̀, ṣùgbọ́n nínú lílò àwọn Kristẹni ìgbàanì ó lè ní gbogbo àwùjọ lọ́kùnrin àti lóbìnrin nínú. A pa fọ́ọ̀mù orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìtẹ́wọ́gbà rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye. “Fi ìrànlọ́wọ́ ránṣẹ́” jẹ́ adayébá ju ìtumọ̀ líle bí “ránṣẹ́ fún iṣẹ́ ìránṣẹ́” lọ, ó sì bá àyíká ìrànwọ́ ìyàn mu. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti yẹ.
