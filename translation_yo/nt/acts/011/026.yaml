id: ACT.11.26
reference: Acts 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: yo
  text: Nígbà tí ó sì rí i, ó mú un wá sí Áńtíókù. Fún odindi ọdún kan, àwọn méjèèjì sì máa ń péjọ pẹ̀lú ìjọ[a], wọ́n sì kọ́ ọ̀pọ̀ ènìyàn[c]. Ní Áńtíókù ni a ti kọ́kọ́ pe àwọn ọmọ-ẹ̀yìn ní Kristẹni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kóra wọn jọ nínú ìjọ.” Gbólóhùn Gíríìkì náà lè tẹnu mọ́ ìpéjọpọ̀ wọn pẹ̀lú àwùjọ àwọn onígbàgbọ́, kì í ṣe pé wọ́n pàdé nínú ilé kan dandan.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì náà sọ pé, “a kọ́kọ́ pe àwọn ọmọ-ẹ̀yìn ní Kristẹni.” Ó ṣeé ṣe kí orúkọ náà bẹ̀rẹ̀ gẹ́gẹ́ bí orúkọ tí àwọn ará ìlú fi ń dá wọn mọ̀ ní Áńtíókù.
    reason: cultural_note
  - marker: c
    text: 'A tún lè so apá yìí pọ̀ báyìí: “wọ́n sì kọ́ ọ̀pọ̀ ènìyàn; ní Áńtíókù ni a sì kọ́kọ́ pe àwọn ọmọ-ẹ̀yìn ní Kristẹni.”'
    reason: previous_rendering
lexical_decisions:
- source_word: εὑρὼν
  choice: nígbà tí ó rí i
  rationale: Aorist participle náà ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: ἤγαγεν
  choice: ó mú un wá
  rationale: Nínú àyíká yìí, ἄγω túmọ̀ sí pé Bánábà mú Saulu wá sí Áńtíókù; ‘mú un wá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere ju ìtumọ̀ líle bí ‘ṣamọ̀nà rẹ̀’ lọ.
- source_word: ἐγένετο δὲ αὐτοῖς καὶ
  choice: ó sì ṣẹlẹ̀ pé … àwọn méjèèjì
  rationale: Ìtumọ̀ yìí mú àṣà-ọrọ Gíríìkì náà wá sí Yorùbá tó mọ́gbọ́n dání, ó sì jẹ́ kedere pé Bánábà àti Saulu ni a ń tọ́ka sí.
- source_word: ἐνιαυτὸν ὅλον
  choice: fún odindi ọdún kan
  rationale: ‘Odindi ọdún kan’ sọ àkókò ọdún kíkún náà ní Yorùbá àdánidá.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: péjọ pọ̀ pẹ̀lú ìjọ
  rationale: Ìtumọ̀ yìí fi ìpéjọpọ̀ wọn pẹ̀lú àwùjọ àwọn onígbàgbọ́ hàn, láì mú kí ‘ìjọ’ dà bí ilé kan pàtó.
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: Nínú Ìṣe Àwọn Aposteli, ọ̀rọ̀ náà sábà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́; ‘ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu.
- source_word: διδάξαι
  choice: wọ́n sì kọ́
  rationale: A ṣe infinitive Gíríìkì náà bí ọ̀rọ̀-ìṣe pípé ní Yorùbá kí gbólóhùn lè ṣàn dáadáa, láì yí ìṣe náà padà.
- source_word: ὄχλον ἱκανόν
  choice: ọ̀pọ̀ ènìyàn
  rationale: ἱκανός níbí ń fi iye tó pọ̀ tó hàn; ‘ọ̀pọ̀ ènìyàn’ jẹ́ Yorùbá tó ṣe kedere tí kò sì sọ iye náà di àsọdùn.
- source_word: χρηματίσαι
  choice: a … pe
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi orúkọ tàbí àmì ìdánimọ̀ kan pe ẹgbẹ́ náà; ìkọ̀lé aláìlẹ́ni-pàtó ‘a pe’ pa ìtumọ̀ náà mọ́.
- source_word: πρώτως
  choice: kọ́kọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìgbà àkọ́kọ́ tí orúkọ yìí bẹ̀rẹ̀ sí í lò.
- source_word: Χριστιανούς
  choice: Kristẹni
  rationale: Èyí jẹ́ orúkọ ẹgbẹ́ tí ó ti di ọ̀rọ̀ ìdánimọ̀, kì í ṣe lílo Χριστός gẹ́gẹ́ bí oyè nìkan. ‘Kristẹni’ ni orúkọ Yorùbá tí a mọ̀ sí i, ó sì yẹra fún ṣíṣe ọ̀rọ̀ tuntun tó lè ṣini lọ́nà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ orúkọ ẹgbẹ́ Χριστιανούς ní ìbámu pẹ̀lú títúmọ̀ Χριστός gẹ́gẹ́ bí ‘Mèsáyà’ nígbà tí ó jẹ́ oyè
  choice: Kristẹni
  alternative: Àwọn ọmọlẹ́yìn Mèsáyà
  rationale: Χριστιανούς níbí jẹ́ orúkọ ẹgbẹ́ tí àwọn ọmọ-ẹ̀yìn gba, kì í ṣe oyè Χριστός tí a ń sọ nípa ẹni kan. ‘Kristẹni’ pa orúkọ ìtàn náà àti ìtumọ̀ àwùjọ rẹ̀ mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Bóyá ἐν τῇ ἐκκλησίᾳ ń tọ́ka sí ilé ìjọsìn tàbí àwùjọ àwọn onígbàgbọ́
  choice: pẹ̀lú ìjọ
  alternative: nínú ìjọ
  rationale: ‘Pẹ̀lú ìjọ’ fi àǹfààní fún ìtumọ̀ pé wọ́n péjọ pẹ̀lú àwùjọ Kristẹni, ó sì yẹra fún fífi ìtumọ̀ ilé kan lé ẹsẹ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘àwọn méjèèjì’ láti jẹ́ kí ìtọ́kasí sí Bánábà àti Saulu ṣe kedere, a sì lo ‘ìjọ’ fún àwùjọ àwọn onígbàgbọ́ láì fi dandan túmọ̀ sí ilé.
