id: ACT.11.18
reference: Acts 11:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí, wọ́n dákẹ́, wọ́n sì yin Ọlọ́run lógo, wọ́n ní, “Nítorí náà, Ọlọ́run ti fi ìrònúpìwàdà tí ń yọrí sí ìyè fún àwọn Kèfèrí náà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí
  rationale: Ó fi agbára àkókò ti participle aorist hàn ní Yorùbá àdánidá; δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò nílò ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: ἡσύχασαν
  choice: wọ́n dákẹ́
  rationale: Ó túmọ̀ sí pé wọ́n dá àtakò tàbí ọ̀rọ̀ wọn dúró; ‘wọ́n dákẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐδόξασαν τὸν θεόν
  choice: wọ́n yin Ọlọ́run lógo
  rationale: Gbolohun yìí pa ìtumọ̀ δοξάζω mọ́ gẹ́gẹ́ bí fífi ògo fún Ọlọ́run, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ló ń ṣàfihàn àkóónú ohun tí wọ́n sọ lọ́nà tó rọrùn ju títú participle náà sí ọ̀rọ̀ gígùn lọ.
- source_word: Ἄρα καὶ
  choice: Ǹjẹ́ … pẹ̀lú
  rationale: ‘Ǹjẹ́’ fi ìparí èrò tí wọ́n fà jáde hàn, ‘pẹ̀lú’ sì pa agbára àfikún καί mọ́.
- source_word: τοῖς ἔθνεσιν
  choice: fún àwọn Kèfèrí
  rationale: Nínú àyíká Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìṣèlú.
- source_word: τὴν μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, fún ìyípadà ọkàn àti yíyí padà kúrò nínú ẹ̀ṣẹ̀; kò dín μετάνοια kù sí ìyípadà èrò lasán.
- source_word: εἰς ζωὴν
  choice: tí ń yọrí sí ìyè
  rationale: Ó pa ìdarí sí ibi àfojúsùn tàbí àbájáde inú εἰς mọ́, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: ἔδωκεν
  choice: ti fi … fún
  rationale: Ó ṣàfihàn iṣe Ọlọ́run gẹ́gẹ́ bí fífúnni, ó sì pa ìṣe tí ó ti ṣẹlẹ̀ tí ó ní ìtumọ̀ lọ́wọ́lọ́wọ́ mọ́.
theological_decisions:
- issue: Ìrònúpìwàdà gẹ́gẹ́ bí ohun tí Ọlọ́run fi fúnni
  choice: A tú ἔδωκεν sí ‘ti fi … fún,’ a sì jẹ́ kí Ọlọ́run jẹ́ ẹni tó fi ìrònúpìwàdà fún àwọn Kèfèrí.
  alternative: ‘jẹ́ kí àwọn Kèfèrí ronúpìwàdà,’ èyí tí ó lè tú ìṣe náà sí ìyọ̀ǹda nìkan.
  rationale: Gíríìkì sọ ní tààrà pé Ọlọ́run ‘fún’ wọn ní ìrònúpìwàdà. Ìtumọ̀ náà pa èyí mọ́ láìfi ètò ẹ̀kọ́ ìgbàgbọ́ tó kọjá ohun tí ẹsẹ náà sọ kún un.
- issue: Ìbáṣepọ̀ μετάνοια àti ζωή
  choice: ‘ìrònúpìwàdà tí ń yọrí sí ìyè’
  alternative: ‘ìrònúpìwàdà fún ìyè’ tàbí ‘ìrònúpìwàdà sí ìyè’
  rationale: εἰς lè fi ibi àfojúsùn tàbí àbájáde hàn. ‘Tí ń yọrí sí ìyè’ ṣètọju ìṣísẹ̀ yẹn láìpinnu ju bí ìbáṣepọ̀ náà ṣe rí lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. ‘Àwọn Kèfèrí’ ni a lò fún àwọn tí kì í ṣe Júù nínú àyíká yìí.
