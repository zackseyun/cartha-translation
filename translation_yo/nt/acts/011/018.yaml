revisions:
- from: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí, wọ́n dákẹ́, wọ́n sì yin Ọlọ́run lógo pé, “Ǹjẹ́ Ọlọ́run ti fi ìrònúpìwàdà tí ń yọrí sí ìyè fún àwọn Kèfèrí pẹ̀lú.”
  to: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí, wọ́n dákẹ́, wọ́n sì yin Ọlọ́run lógo, wọ́n ní, “Nítorí náà, Ọlọ́run ti fi ìrònúpìwàdà tí ń yọrí sí ìyè fún àwọn Kèfèrí náà.”
  rationale: The revision retains the draft’s faithful rendering of μετάνοια as ìrònúpìwàdà and εἰς ζωήν as a movement toward/result in life. It replaces Ǹjẹ́ … pẹ̀lú with Nítorí náà … náà for a clearer inference and a more direct representation of καί with the Gentiles. It also uses wọ́n ní after ‘they glorified God’ to make the quoted response flow naturally in standard Yoruba.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal participle, the cessation of opposition, glorifying God, God as the giver of repentance, and the result/goal expressed by εἰς ζωήν. A small adjustment makes the inferential force of Ἄρα καί and the inclusive reference to the Gentiles clearer in Yoruba.
  naturalness: The revised wording uses a more idiomatic Yoruba inferential transition and separates the speech introducer from the verb for glorifying God. Placing náà with àwọn Kèfèrí clearly conveys ‘also to the Gentiles’ without an awkward sentence-final pẹ̀lú.
  terminology: Ìrònúpìwàdà is an appropriate established Yoruba rendering of μετάνοια. Àwọn Kèfèrí is retained as the conventional contextual designation for non-Jews; its contextual sense is supplied in a note to prevent it from being read merely as a religious insult or as a reference to present-day non-Christians.
  issues:
  - severity: low
    issue: The sentence-final pẹ̀lú is syntactically loose.
    rationale: Although it can communicate ‘also,’ its attachment is less clear than náà following àwọn Kèfèrí, which directly reflects the Greek emphasis on the Gentiles as additional recipients.
  - severity: low
    issue: Ǹjẹ́ is less explicit than the Greek inferential particle in this formal public-reading register.
    rationale: Nítorí náà naturally signals the conclusion marked by Ἄρα without suggesting a question.
  revised_text: Nígbà tí wọ́n gbọ́ nǹkan wọ̀nyí, wọ́n dákẹ́, wọ́n sì yin Ọlọ́run lógo, wọ́n ní, “Nítorí náà, Ọlọ́run ti fi ìrònúpìwàdà tí ń yọrí sí ìyè fún àwọn Kèfèrí náà.”
  revised_footnotes:
