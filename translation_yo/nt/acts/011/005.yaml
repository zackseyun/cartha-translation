revisions:
- from: '“Mo wà ní ìlú Jópà, mo ń gbàdúrà, mo sì rí ìran nígbà tí mo wọ inú ojúran: ohun kan bí aṣọ ńlá ń sọ̀kalẹ̀; a ń sọ ọ́ kalẹ̀ láti ọ̀run ní igun mẹ́rin rẹ̀[a], ó sì dé ọ̀dọ̀ mi.”'
  to: '“Mo wà ní ìlú Jópà, mo ń gbàdúrà, mo sì rí ìran nínú ìpayà[a]: ohun kan bí aṣọ ńlá ń sọ̀kalẹ̀; a ń sọ ọ́ kalẹ̀ láti ọ̀run nípa igun mẹ́rin rẹ̀[b], ó sì dé ọ̀dọ̀ mi.”'
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó ń fi ìṣe ‘wọ inú ojúran’ kún orísun náà pẹ̀lú ‘nínú ìpayà,’ kí ipò ἐκστάσει àti ìran ὅραμα má bàa dàpọ̀. A tún ṣe ‘nípa igun mẹ́rin’ kí ó lè hàn pé àwọn igun náà ni ọ̀nà tí a fi ń sọ aṣọ náà kalẹ̀. Kò sí ìyípadà sí ìtumọ̀ ìṣẹ̀lẹ̀ tàbí ẹ̀kọ́ ìsìn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:28Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìlú Jópà, ìgbàdúrà, ohun tí ó dà bí aṣọ ńlá, ìsọ̀kalẹ̀ láti ọ̀run ní àwọn igun/òpin mẹ́rin, àti dídé ọ̀dọ̀ Pétérù hàn dáadáa. Ṣùgbọ́n ‘nígbà tí mo wọ inú ojúran’ yí ἐν ἐκστάσει padà sí ìṣe ‘wọ inú’ ohun kan, ó sì dín ìyàtọ̀ tó wà láàárín ipò ἐκστάσει àti ὅραμα (‘ìran’) kù.
  naturalness: ‘Nígbà tí mo wọ inú ojúran’ kì í ṣe ọ̀nà Yorùbá boṣewa tó rọrùn jù lọ fún ipò ìran náà, ó sì tún mú ‘ojúran’ dà bí ìran kan náà. ‘Nínú ìpayà’ jẹ́ ọ̀rọ̀ ìtúmọ̀ Bíbélì Yorùbá tí ó bójú mu fún ἔκστασις nínú àyíká yìí; àlàyé ẹsẹ̀-ìsàlẹ̀ ṣàlàyé ìtumọ̀ rẹ̀ níhìn-ín.
  terminology: A dá ‘ìpayà’ sí ‘ìran’ sọ́tọ̀, láti pa ἐκστάσει àti ὅραμα mọ́ gẹ́gẹ́ bí ọ̀rọ̀ méjì. ‘Ìran,’ ‘ọ̀run,’ àti ‘aṣọ ńlá’ yẹ fún ìforúkọsílẹ̀ àti ìlò Yorùbá òde òní. ‘Nípa igun mẹ́rin rẹ̀’ ṣàfihàn ipa àwọn igun náà nínú rírà aṣọ náà sọ̀kalẹ̀ dáadáa ju ‘ní igun’ lọ.
