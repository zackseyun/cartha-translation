    rationale: Ó ṣeé lóye, ṣùgbọ́n ‘nípa igun mẹ́rin rẹ̀’ tú ipa-inṣítírúmẹ́ńtì τέσσαρσιν ἀρχαῖς (‘nípasẹ̀ àwọn igun/òpin mẹ́rin’) jáde kedere.
