id: ACT.11.5
reference: Acts 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: yo
  text: '“Mo wà ní ìlú Jópà, mo ń gbàdúrà, mo sì rí ìran nínú ìpayà[a]: ohun kan bí aṣọ ńlá ń sọ̀kalẹ̀; a ń sọ ọ́ kalẹ̀ láti ọ̀run nípa igun mẹ́rin rẹ̀[b], ó sì dé ọ̀dọ̀ mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Níhìn-ín, ‘ìpayà’ tọ́ka sí ipò ìran àrà ọ̀tọ̀, kì í ṣe ìbẹ̀rù lasán.
    reason: lexical_semantic_clarification
  - marker: b
    text: Tàbí, “a ń sọ ọ́ kalẹ̀ láti ọ̀run nípa àwọn òpin mẹ́rin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Mo wà ní ìlú Jópà, mo ń gbàdúrà
  rationale: Ó pa ọ̀rọ̀ ẹni àkọ́kọ́, ‘ìlú,’ àti ìṣe tí ó ń lọ lọ́wọ́ mọ́, ní èdè Yorùbá àdánidá.
- source_word: ἐν ἐκστάσει
  choice: nígbà tí mo wọ inú ojúran
  rationale: ‘Ojúran’ ṣàpèjúwe ipò ìran àrà ọ̀tọ̀ láìfi ìtumọ̀ ìdùnnú tàbí ẹ̀kọ́ ìjìnlẹ̀ míì kún ἔκστασις.
- source_word: ὅραμα
  choice: ìran
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ohun tí Ọlọ́run fi hàn nínú ìran.
- source_word: σκεῦός τι ὡς ὀθόνην μεγάλην
  choice: ohun kan bí aṣọ ńlá
  rationale: ‘Ohun kan’ pa àìdánimọ̀ σκεῦός τι mọ́; ‘bí aṣọ ńlá’ sì mú àfiwé náà jáde láìsọ irú aṣọ tí Gíríìkì kò sọ.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: ń sọ̀kalẹ̀; a ń sọ ọ́ kalẹ̀ láti ọ̀run
  rationale: Ó fi ìsọ̀kalẹ̀ ohun náà àti ìṣe aláìlórúkọ tí ń sọ ọ́ kalẹ̀ hàn lọ́tọ̀, gẹ́gẹ́ bí àwọn participle méjèèjì.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: ní igun mẹ́rin rẹ̀
  rationale: ‘Igun mẹ́rin’ ni àwòrán Yorùbá tó ṣe kedere fún àwọn etí tàbí òpin mẹ́rin aṣọ náà.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: ó sì dé ọ̀dọ̀ mi
  rationale: Ó fi ìrìn dé ibi tí Pétérù wà hàn ní Yorùbá tó rọrùn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn ọ̀rọ̀ ìran láìsọ ìrírí ìjìnlẹ̀ ju ohun tí ẹsẹ̀ náà sọ lọ
  choice: mo sì rí ìran nígbà tí mo wọ inú ojúran
  alternative: mo sì rí ìran nínú ìpayà ọkàn
  rationale: Àṣàyàn náà pa ἐκστάσει àti ὅραμα mọ́ gẹ́gẹ́ bí ohun méjì tó ní ìbátan—ipò ojúran àti ìran tí Pétérù rí—láìfi ìmọ̀lára ìbẹ̀rù tàbí ayọ̀ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó jẹ́ ti ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ojúran’ fún ipò ἔκστασις, ‘ìran’ sì dúró fún ὅραμα, kí a má bàa da àwọn ọ̀rọ̀ méjèèjì pọ̀.
