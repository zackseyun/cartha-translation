source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: yo
  text: Ṣùgbọ́n ohùn kan tún dáhùn láti ọ̀run lẹ́ẹ̀kejì pé, “Ohun tí Ọlọ́run ti sọ di mímọ́, ìwọ má ṣe kà sí ohun tí ó wọ́pọ̀.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìwọ má ṣe pè é ní ohun àìmọ́” tàbí “ìwọ má ṣe kà á sí ohun aláìsọ́tọ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘dáhùn’ tàbí ‘fèsì’; ‘dáhùn’ bá ìtẹ̀síwájú ìtàn mu ní Yorùbá.
- source_word: φωνὴ
  choice: ohùn kan
  rationale: Ó jẹ́ olùṣe gbólóhùn tí a kò sọ ẹni tó ni ín; ‘ohùn kan’ kò fi ẹni tó ń sọ̀rọ̀ kún ohun tí Gíríìkì sọ.
- source_word: ἐκ δευτέρου
  choice: tún ... lẹ́ẹ̀kejì
  rationale: Ó túmọ̀ sí pé ìdáhùn náà wá ní ìgbà kejì; àkópọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Nínú àyíká ìran yìí, οὐρανός ń tọ́ka sí ọ̀run gẹ́gẹ́ bí ibùgbé ọ̀run, kì í ṣe ojú ọ̀run lásán.
- source_word: Ἃ
  choice: Ohun tí
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí náà ń sọ nípa ẹ̀ka gbogbogbò; Yorùbá lè fi ‘Ohun tí’ sọ ọ́ lọ́nà àdánidá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún θεός nínú àyíká yìí.
- source_word: ἐκαθάρισεν
  choice: ti sọ di mímọ́
  rationale: καθαρίζω túmọ̀ sí láti wẹ̀ tàbí sọ di mímọ́; ‘ti sọ di mímọ́’ fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì dúró.
- source_word: σὺ
  choice: ìwọ
  rationale: Arọ́pò-orúkọ náà fara hàn ní kedere nínú Gíríìkì fún ìtẹnumọ́; fífi ‘ìwọ’ hàn dá ìtẹnumọ́ yẹn pamọ́.
- source_word: μὴ κοίνου
  choice: kò gbọdọ̀ pè ní ohun àìmọ́
  rationale: Nínú ọ̀rọ̀ ìwẹ̀nùmọ́ Júù, κοινόω lè túmọ̀ sí kíkà ohun sí ‘wọ́pọ̀,’ ‘aláìsọ́tọ̀,’ tàbí ‘àìmọ́.’ ‘Ohun àìmọ́’ jẹ́ kedere fún òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ‘wọ́pọ̀/aláìsọ́tọ̀’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ èdè ìwẹ̀nùmọ́ nínú κοινόω
  choice: pè ní ohun àìmọ́
  alternative: pè ní ohun wọ́pọ̀ tàbí ohun aláìsọ́tọ̀
  rationale: ‘Àìmọ́’ mú ìtakora pẹ̀lú ohun tí Ọlọ́run ‘sọ di mímọ́’ yé òǹkàwé Yorùbá ní kedere, ṣùgbọ́n κοινόω ní ìtumọ̀ gangan tó sún mọ́ ‘sọ di ohun wọ́pọ̀/aláìsọ́tọ̀.’ A pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀ kí a má bàa mú ìṣòro ọ̀rọ̀ ìwẹ̀nùmọ́ náà rọrùn jù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ohùn kan’ láì sọ ẹni tó ni ohùn náà, a sì fi ‘ìwọ’ hàn láti pa ìtẹnumọ́ Gíríìkì mọ́.
