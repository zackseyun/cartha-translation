  to: Ṣùgbọ́n ohùn kan tún dáhùn láti ọ̀run lẹ́ẹ̀kejì pé, “Ohun tí Ọlọ́run ti sọ di mímọ́, ìwọ má ṣe kà sí ohun tí ó wọ́pọ̀.[a]”
