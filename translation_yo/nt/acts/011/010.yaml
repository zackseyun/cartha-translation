source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: yo
  text: Èyí sì ṣẹlẹ̀ ní ẹ̀ẹ̀mẹ́ta, a sì tún fà gbogbo rẹ̀ sókè sínú ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì tún gbé gbogbo rẹ̀ sókè sínú ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí ohun tí ó ṣẹlẹ̀ nínú ìran tí a ṣẹ̀ṣẹ̀ sọ, láì fi ọ̀rọ̀ ‘ìran’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: δὲ
  choice: sì
  rationale: Níbi yìí, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú ìtàn; ‘sì’ jẹ́ ọ̀nà àdánidá láti fi hàn ní Yorùbá.
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Ó túmọ̀ sí pé ìṣẹ̀lẹ̀ náà wáyé; ‘ṣẹlẹ̀’ ṣe kedere, ó sì bá èdè ìtàn Yorùbá òde òní mu.
- source_word: ἐπὶ τρίς
  choice: ní ẹ̀ẹ̀mẹ́ta
  rationale: Gbólóhùn náà fi hàn pé ohun kan tún ṣẹlẹ̀ ní ìgbà mẹ́ta; ‘ní ẹ̀ẹ̀mẹ́ta’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: ἀνεσπάσθη
  choice: a ... fa ... sókè
  rationale: Ìṣe aláìlórúkọ yìí ń sọ pé agbára kan fa ohun náà lọ sókè, láì sọ ẹni tó ṣe é; ìtumọ̀ náà pa àwòrán fífa sókè mọ́.
- source_word: πάλιν
  choice: tún
  rationale: Ó ń fi ìṣe tí a ṣe lẹ́ẹ̀kan sí i hàn; ‘tún’ ni ọ̀rọ̀ Yorùbá tó rọrùn jù fún èyí.
- source_word: ἅπαντα
  choice: gbogbo rẹ̀
  rationale: Ọ̀rọ̀ náà kó gbogbo ohun tó wà nínú ìran náà jọ, ṣùgbọ́n kò sọ ní pàtó bóyá aṣọ náà ni tàbí àwọn ẹranko; ‘gbogbo rẹ̀’ pa àìsọ pàtó náà mọ́.
- source_word: εἰς τὸν οὐρανόν
  choice: lọ sínú ọ̀run
  rationale: ‘Sínú’ pa ìtọ́sọ́nà εἰς mọ́, ‘ọ̀run’ sì bá àyíká ìran nínú Ìṣe Àwọn Aposteli mu ju ‘ojú ọ̀run’ lọ.
theological_decisions:
- issue: Ohun tí ἅπαντα ń tọ́ka sí nínú ìròyìn ìran Pétérù
  choice: ‘gbogbo rẹ̀,’ láì sọ pé aṣọ náà tàbí àwọn ẹranko nìkan ni
  alternative: ‘gbogbo nǹkan,’ ‘gbogbo ohun tí ó wà nínú rẹ̀,’ tàbí ‘gbogbo àwọn ẹranko’
  rationale: Gíríìkì kó gbogbo ohun náà jọ, ṣùgbọ́n kò dá ohun tí ó ń tọ́ka sí mọ́ ní pàtó nínú ẹsẹ yìí. Ìtumọ̀ yìí kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ìṣe aláìlórúkọ ‘a ... fa’ láti pa passive Gíríìkì àti àìsọ ẹni tó ṣe ìṣe náà mọ́.
