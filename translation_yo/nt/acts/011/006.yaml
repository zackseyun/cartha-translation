id: ACT.11.6
reference: Acts 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: yo
  text: Nígbà tí mo tẹjú mọ́ inú rẹ̀, tí mo sì ń ṣàyẹ̀wò rẹ̀ dáadáa, mo rí àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin orí ilẹ̀, àwọn ẹranko igbó, àwọn ohun tí ń rákò[a], àti àwọn ẹyẹ ojú ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ẹranko afàyàfà.’ ‘Àwọn ohun tí ń rákò’ pa ìtumọ̀ gbòòrò tí ó jọ èdè ìṣẹ̀dá àti ìsọ̀rí àwọn ẹranko nínú òfin ìjẹun mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: inú rẹ̀
  rationale: Ó tọ́ka sí ohun bí aṣọ ńlá tí Peteru rí; pẹ̀lú ἀτενίζω, ó fi ìdarí ojú hàn sí inú ohun náà, kì í ṣe wíwo ohun náà lásán.
- source_word: ἀτενίσας
  choice: tẹjú mọ́
  rationale: Ó sọ ìwòye tí a fi gbogbo àfiyèsí sí; ‘tẹjú mọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò ní ìtumọ̀ líle ti ‘rọjú wò.’
- source_word: κατενόουν
  choice: ń ṣàyẹ̀wò rẹ̀ dáadáa
  rationale: Ìṣe aláìparí náà fi hàn pé Peteru ń wo ohun náà pẹ̀lú àfiyèsí lọ́nà tí ó ń bá a lọ, ó sì yàtọ̀ sí εἶδον tí ó tẹ̀ lé e.
- source_word: εἶδον
  choice: mo rí
  rationale: Ó túmọ̀ sí rírí ní tààrà, ó sì pa ìyàtọ̀ mọ́ láàárín rẹ̀ àti ṣíṣàyẹ̀wò tí ó ṣáájú.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin orí ilẹ̀
  rationale: Ó pa ìsọ̀rí ẹranko ẹlẹ́sẹ̀ mẹ́rin àti ọ̀rọ̀ ‘ilẹ̀’ inú Gíríìkì mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: τὰ θηρία
  choice: àwọn ẹranko igbó
  rationale: Ó fi hàn pé àwọn ẹranko búburú tàbí ẹranko inú igbó ni, ó sì yà wọ́n sọ́tọ̀ kúrò lára ìsọ̀rí ẹranko ẹlẹ́sẹ̀ mẹ́rin ní gbogbogbòò.
- source_word: τὰ ἑρπετά
  choice: àwọn ohun tí ń rákò
  rationale: Ọ̀rọ̀ yìí gbòòrò ju ‘ẹranko afàyàfà’ lọ, ó sì bá èdè ìṣẹ̀dá àti àwọn ìsọ̀rí òfin oúnjẹ inú Ìwé Mímọ́ mu.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: ‘Ẹyẹ’ jẹ́ ọ̀rọ̀ àdánidá fún àwọn ohun abìyẹ tí ń fò, ‘ojú ọ̀run’ sì tọ́ sí ojú sánmà nínú àkójọ ẹranko yìí.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìtẹ̀síwájú inú κατενόουν mọ́ pẹ̀lú ‘ń ṣàyẹ̀wò,’ a sì lo àkójọ tí ó ní ìwọ̀ntúnwọ̀nsì gẹ́gẹ́ bí Gíríìkì.
