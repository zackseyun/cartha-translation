  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: yo
  text: 'Ṣùgbọ́n Peteru bẹ̀rẹ̀ sí í ṣàlàyé fún wọn lẹ́sẹẹsẹ, pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος
  choice: bẹ̀rẹ̀ sí í
  rationale: Aorist middle participle náà ń ṣiṣẹ́ bí ọ̀rọ̀ àfikún sí ἐξετίθετο; “bẹ̀rẹ̀ sí í ṣàlàyé” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbẹ̀rẹ̀ ìṣe náà hàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ tàbí ìyípadà ọ̀rọ̀ hàn láti ẹ̀sùn ẹsẹ tó ṣáájú sí ìdáhùn Peteru.
- source_word: Πέτρος
  choice: Peteru
  rationale: Orúkọ náà ni a kọ ní ìbámu pẹ̀lú àṣà ìkọ orúkọ Bíbélì ní Yorùbá.
- source_word: ἐξετίθετο
  choice: ṣàlàyé ọ̀rọ̀ náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti gbé ọ̀ràn kalẹ̀ tàbí ṣàlàyé rẹ̀; “ṣàlàyé ọ̀rọ̀ náà” ṣe kedere, ó sì bá àyíká ìtàn Peteru mu.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún arọ́pò-orúkọ dative plural tí ó tọ́ka sí àwọn tí Peteru ń bá sọ̀rọ̀.
- source_word: καθεξῆς
  choice: ní ìtẹ̀lé-tẹ̀lé
  rationale: Ó ń tọ́ka sí ṣíṣe àkọsílẹ̀ àwọn ìṣẹ̀lẹ̀ ní ọ̀nà tí ọ̀kan tẹ̀ lé òmíràn; yíyan yìí pa ìtumọ̀ ìtẹ̀síwájú lẹ́sẹẹsẹ mọ́ láì túmọ̀ ọ́ sí “láti ìbẹ̀rẹ̀.”
- source_word: λέγων
  choice: ó ní
  rationale: Present participle náà ṣí ọ̀rọ̀ Peteru sílẹ̀; “ó ní” jẹ́ ọ̀nà Yorùbá tí ó ṣeé gbọ́ yékéyéké fún fífi ọ̀rọ̀ tààrà bẹ̀rẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn ọlọ́lá tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “ní ìtẹ̀lé-tẹ̀lé” láti pa àfojúsùn καθεξῆς mọ́, a sì fi àwọn ọ̀nà mìíràn sí àlàyé ìsàlẹ̀.
