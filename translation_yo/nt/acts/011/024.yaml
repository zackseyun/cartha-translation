id: ACT.11.24
reference: Acts 11:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: yo
  text: Nítorí ó jẹ́ ọkùnrin rere, ó sì kún fún Ẹ̀mí Mímọ́ àti fún ìgbàgbọ́.[a] Ọ̀pọ̀ ènìyàn sì ni a fi kún Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà, pistis, tún lè túmọ̀ sí “ìdúróṣinṣin” tàbí “ìgbẹ́kẹ̀lé”; níhìn-ín, ìtumọ̀ pàtàkì náà lo “ìgbàgbọ́,” gẹ́gẹ́ bí ìtumọ̀ rẹ̀ tí ó wọ́pọ̀ jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ìdí fún ohun tí a sọ nípa Bánábà ní ẹsẹ tó ṣáájú, ó sì pa agbára ọ̀rọ̀ ìdí mọ́.
- source_word: ἀνὴρ ἀγαθὸς
  choice: ọkùnrin rere
  rationale: Ó tọ́ka sí Bánábà gẹ́gẹ́ bí ọkùnrin, ‘rere’ sì sọ ìwà rere rẹ̀ láìfi ìtumọ̀ míì kún un.
- source_word: πλήρης πνεύματος ἁγίου
  choice: ó kún fún Ẹ̀mí Mímọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun kan kún inú ẹni; ‘Ẹ̀mí Mímọ́’ ń tọ́ka sí Ẹ̀mí Ọlọ́run.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tó bá ọ̀rọ̀ yìí mu, bó tilẹ̀ jẹ́ pé ‘ìṣòtítọ́’ tún ṣeé ṣe nínú àyíká yìí.
- source_word: προσετέθη
  choice: A sì fi ... kún
  rationale: A pa ìṣe aláìlórúkọ náà mọ́, láìsọ ẹni tó ṣe é ní pàtó.
- source_word: ὄχλος ἱκανὸς
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Ó fi hàn pé iye àwọn ènìyàn náà pọ̀ gan-an, ó sì jẹ́ ọ̀rọ̀ tó ṣe déédéé ní Yorùbá òde òní.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: A pa ẹni tí Gíríìkì sọ pé a fi àwọn ènìyàn náà kún mọ́, ìyẹn Olúwa, dípò kí a rọ́pò rẹ̀ pẹ̀lú ìjọ.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí tàbí ìwà mímọ́ kan
  rationale: Nínú Lúùkù–Ìṣe Àwọn Àpọ́sítélì, gbólóhùn náà sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́, bákan náà ni àyíká ọ̀rọ̀ nípa Bánábà ṣe fi hàn.
- issue: Ìtumọ̀ πίστεως nínú àpèjúwe Bánábà
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ lè gba ìgbẹ́kẹ̀lé tàbí ìwà olóòtítọ́, ṣùgbọ́n ‘ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́; a pa èkejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ẹni tí a fi àwọn ènìyàn kún mọ́ nínú προσετέθη ... τῷ κυρίῳ
  choice: Olúwa
  alternative: ìjọ tàbí àwùjọ àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘Olúwa’ ní tààrà; bí ó tilẹ̀ jẹ́ pé dídarapọ̀ mọ́ ìjọ wà nínú èrò náà, kò yẹ kí a fi ìtumọ̀ àlàyé rọ́pò ohun tí orísun sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yan gbólóhùn tó rọrùn fún òǹkàwé gbogbogbòò, a sì pa ìṣe aláìlórúkọ àti ‘Olúwa’ gẹ́gẹ́ bí ohun tí orísun sọ mọ́.
