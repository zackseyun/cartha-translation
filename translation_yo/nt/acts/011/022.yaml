id: ACT.11.22
reference: Acts 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: yo
  text: Ìròyìn nípa wọn sì dé etí ìjọ tí ó wà ní Jerusalẹmu[a], wọ́n sì rán Bánábà jáde títí dé Áńtíókù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìjọ tí ó wà ní Jerusalẹmu gbọ́ ìròyìn nípa wọn”; ní ti gidi, “a gbọ́ ìròyìn náà sínú etí ìjọ tí ó wà ní Jerusalẹmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη … εἰς τὰ ὦτα
  choice: dé etí
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí pé a gbọ́ ọ̀rọ̀ náà sínú etí; ‘dé etí’ jẹ́ àṣà èdè Yorùbá tó ṣe kedere, tó sì pa àwòrán etí mọ́.
- source_word: ὁ λόγος
  choice: Ìròyìn
  rationale: Nínú àyíká ìtàn yìí, λόγος ń tọ́ka sí ìròyìn nípa àwọn ènìyàn àti ohun tó ṣẹlẹ̀ ní Áńtíókù, kì í ṣe ọ̀rọ̀ àsọyé tàbí ‘Ọ̀rọ̀’ ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἐκκλησίας
  choice: ìjọ
  rationale: ‘Ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún àwùjọ àwọn onígbàgbọ́ nínú Ìṣe Àwọn Àpọ́sítélì.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: tí ó wà ní Jerusalẹmu
  rationale: Ó sọ ìjọ pàtó tí a ń tọ́ka sí, ó sì pa gbólóhùn aláìṣe Gíríìkì náà mọ́ ní Yorùbá àdánidá.
- source_word: περὶ αὐτῶν
  choice: nípa wọn
  rationale: Ó pa àìdánilójú ẹni tàbí àwọn ohun tí αὐτῶν ń tọ́ka sí mọ́, láì fi ìtumọ̀ tóóró kan kún un.
- source_word: ἐξαπέστειλαν
  choice: wọ́n sì rán … jáde
  rationale: ‘Rán … jáde’ ṣe àfihàn agbára ọ̀rọ̀ ìṣe àkópọ̀ náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Βαρναβᾶν
  choice: Bánábà
  rationale: Ìkọ̀wé orúkọ náà tẹ̀ lé bí a ṣe ń pè é ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἕως Ἀντιοχείας
  choice: títí dé Áńtíókù
  rationale: Ó ṣe àfihàn ìwọ̀n tàbí ibi tí ìránṣẹ́ náà dé, bí ἕως ṣe ń ṣe, dípò kí a túmọ̀ rẹ̀ sí ‘sí’ nìkan.
theological_decisions:
- issue: Ẹni tí ó rán Bánábà jáde
  choice: A fi ‘wọ́n’ tọ́ka padà sí ìjọ Jerusalẹmu lápapọ̀.
  alternative: Àwọn aṣáájú kan tí a kò dárúkọ nínú ìjọ Jerusalẹmu ló rán an.
  rationale: ‘Ìjọ tí ó wà ní Jerusalẹmu’ ni ẹni tí a dárúkọ tó sún mọ́ ọ̀rọ̀ ìṣe náà jù; ẹsẹ̀ náà kò sọ pé àwọn àpọ́sítélì tàbí àwọn alàgbà nìkan ló ṣe é.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘sì’ fún δέ gẹ́gẹ́ bí àsopọ̀ ìtàn, láì fi ọ̀rọ̀ àkókò bí ‘nígbà náà’ kún orísun.
