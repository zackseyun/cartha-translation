id: ACT.11.21
reference: Acts 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: yo
  text: Ọwọ́ Olúwa sì wà pẹ̀lú wọn, ọ̀pọ̀lọpọ̀ ènìyàn tí wọ́n gbàgbọ́ sì yípadà sí Olúwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: Ọwọ́ Olúwa
  rationale: Ó pa àwòrán èdè Bíbélì mọ́, níbi tí “ọwọ́ Olúwa” ti ń tọ́ka sí agbára tàbí ojú rere Olúwa tí ń ṣiṣẹ́.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni akọ́lé Yorùbá tó bójú mu fún κύριος, ó sì yẹra fún ṣíṣe àlàyé ẹni tí akọ́lé náà ń tọ́ka sí ju ohun tí Gíríìkì sọ lọ.
- source_word: μετ’ αὐτῶν
  choice: wà pẹ̀lú wọn
  rationale: Ó túmọ̀ ìwàníhìn-ín àti ìtìlẹ́yìn Ọlọ́run tó ń bá àwọn òjíṣẹ́ náà lọ ní ọ̀nà àdánidá.
- source_word: πολύς τε ἀριθμός
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti sọ iye ènìyàn púpọ̀.
- source_word: ὁ πιστεύσας
  choice: tí wọ́n gbàgbọ́
  rationale: Ọ̀rọ̀ àbọ̀ aorist náà ń ṣàpèjúwe àwọn ènìyàn tó wà nínú iye púpọ̀ náà; gbólóhùn ìbátan yìí jẹ́ Yorùbá àdánidá, kò sì fi dandan pinnu bóyá ìgbàgbọ́ ṣáájú yíyípadà ní ìtẹ̀lé àkókò.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: yípadà sí Olúwa
  rationale: Ó pa ìtumọ̀ yíyíjú sí Olúwa nínú ìyípadà ẹ̀sìn mọ́ láìfi “ìrònúpìwàdà” kún ohun tí ẹsẹ̀ náà sọ tààrà.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú ọ̀rọ̀ yìí
  choice: Lo “Olúwa” ní ibi méjèèjì láìfi “Jésù” tàbí “Ọlọ́run” rọ́pò rẹ̀.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí Jésù ní pàtó, tàbí gẹ́gẹ́ bí Ọlọ́run ní gbogbogbòò.
  rationale: Ìwé Ìṣe sábà máa ń lo κύριος fún Jésù, pàápàá nínú ọ̀rọ̀ ìyípadà, ṣùgbọ́n Gíríìkì níbí sọ “Olúwa” nìkan. Títọ́jú akọ́lé náà pa ààyè ìtumọ̀ inú àyíká ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán “ọwọ́ Olúwa” mọ́ nítorí pé ó ṣeé lóye nínú Yorùbá Bíbélì. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí náà kò sí àmì àlàyé ìsàlẹ̀ nínú ọ̀rọ̀ pàtàkì.
