id: ACT.26.10
reference: Acts 26:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: yo
  text: 'Èyí náà ni mo ṣe ní Jerúsálẹ́mù: kì í ṣe pé mo ti ọ̀pọ̀ àwọn ẹni mímọ́[a] mọ́ sínú àwọn ilé ẹ̀wọ̀n nìkan, lẹ́yìn tí mo gba àṣẹ lọ́wọ́ àwọn olórí àlùfáà; ṣùgbọ́n nígbà tí a ń pa wọ́n, mo tún dìbò lòdì sí wọn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn ẹni mímọ́” níhìn-ín ni àwọn ènìyàn mímọ́ ti Ọlọ́run, ìyẹn àwọn onígbàgbọ́ nínú Jésù.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, Gíríìkì náà ń sọ nípa mímú tàbí dídá “ìbò” (ψῆφος) kalẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Èyí sì ni mo ṣe
  rationale: Ọ̀rọ̀ yìí tọ́ka padà sí iṣẹ́ inúnibíni tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa rẹ̀, ó sì ṣe kedere ní Yorùbá àdánidá.
- source_word: ἐν Ἱεροσολύμοις
  choice: ní Jerúsálẹ́mù
  rationale: Èyí ni orúkọ ìlú náà ní Yorùbá tí ó wọ́pọ̀.
- source_word: πολλούς τε τῶν ἁγίων
  choice: ọ̀pọ̀ àwọn ẹni mímọ́
  rationale: ἅγιοι túmọ̀ sí àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run, ìyẹn àwọn onígbàgbọ́, kì í ṣe ẹgbẹ́ pàtàkì kan láàárín wọn.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: mo ti ... mọ́ sínú àwọn ẹ̀wọ̀n
  rationale: Ọ̀rọ̀ náà pa agbára ‘títì mọ́’ mọ́, ó sì tún fi ọ̀pọ̀ φυλακαῖς (‘àwọn ẹ̀wọ̀n’) hàn ní kedere.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: lẹ́yìn tí mo gba àṣẹ lọ́wọ́ àwọn olórí àlùfáà
  rationale: Ó fi hàn pé àṣẹ àwọn olórí àlùfáà ni ìpìlẹ̀ iṣẹ́ Pọ́ọ̀lù, láìfi ohun mìíràn kún ọ̀rọ̀ náà.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: nígbà tí wọ́n ń pa wọ́n
  rationale: Àpólà aláìṣe náà ní agbára àkókò níhìn-ín, ἀναιρέω sì túmọ̀ sí pípa ènìyàn kú láàyè ọ̀rọ̀ yìí.
- source_word: κατήνεγκα ψῆφον
  choice: mo dìbò lòdì sí wọn
  rationale: ψῆφος jẹ́ òkúta kékeré tí a fi ń dìbò, ó sì wá túmọ̀ sí ìbò; ‘dìbò lòdì sí wọn’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ìdájọ́ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι nínú Ìṣe Àwọn Àpọ́sítélì
  choice: àwọn ẹni mímọ́, ìyẹn gbogbo àwọn onígbàgbọ́ nínú Jésù
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ọmọ ìjọ lápapọ̀, kì í ṣe àwọn díẹ̀ tí a gbé ga lẹ́yìn ikú wọn.
- issue: Agbára ọ̀rọ̀ κατήνεγκα ψῆφον
  choice: Pọ́ọ̀lù sọ pé òun dìbò lòdì sí wọn
  alternative: Pọ́ọ̀lù fara mọ́ pípa wọn láìjẹ́ pé ó dìbò ní ti gidi
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka ní tààrà sí mímú tàbí dídá ìbò kalẹ̀. A pa agbára yìí mọ́ láìpinnu irú ilé ẹjọ́ tàbí àjọ tí ìbò náà ti wáyé.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ìṣọ̀kan ‘kì í ṣe pé ... nìkan ... ṣùgbọ́n ... tún’ láti fi ìbáṣepọ̀ τε ... τε hàn lọ́nà àdánidá, a sì pa gbolohun náà mọ́ láìsọ irú ètò ìdìbò tí Pọ́ọ̀lù kópa nínú rẹ̀.
