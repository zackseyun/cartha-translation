- from: 'Èyí sì ni mo ṣe ní Jerúsálẹ́mù: kì í ṣe pé mo ti ọ̀pọ̀ àwọn ẹni mímọ́[a] mọ́ sínú àwọn ẹ̀wọ̀n nìkan, lẹ́yìn tí mo gba àṣẹ lọ́wọ́ àwọn olórí àlùfáà; ṣùgbọ́n nígbà tí wọ́n ń pa wọ́n, mo tún dìbò lòdì sí wọn.[b]'
