id: ACT.26.22
reference: Acts 26:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí mo ti gba ìrànlọ́wọ́ láti ọ̀dọ̀ Ọlọ́run, mo dúró títí di òní, mo sì ń jẹ́rìí fún àwọn ẹni kékeré àti àwọn ẹni ńlá[a], láìsọ ohunkóhun bí kò ṣe ohun tí àwọn wòlíì àti Mósè sọ pé yóò ṣẹlẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn ẹni kékeré àti àwọn ẹni ńlá” túmọ̀ sí àwọn ènìyàn láti gbogbo ipò láwùjọ.
    reason: cultural_note
  - marker: b
    text: Tàbí, “láìsọ ohunkóhun kọjá ohun tí àwọn wòlíì àti Mósè sọ pé yóò ṣẹlẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: bí mo ti rí ìrànlọ́wọ́ tí ó wá láti ọ̀dọ̀ Ọlọ́run gbà
  rationale: Ó túmọ̀ sí pé Pọ́ọ̀lù gba ìrànlọ́wọ́ láti ọ̀dọ̀ Ọlọ́run; ‘rí ... gbà’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan gba ohun kan.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: mo dúró títí di òní
  rationale: 'Èyí pa ipò tí ìṣe àṣepé Gíríìkì ń fi hàn mọ́: Pọ́ọ̀lù ti dúró, ó sì ṣì dúró dé òní.'
- source_word: μαρτυρόμενος
  choice: mo ń jẹ́rìí
  rationale: ‘Ń jẹ́rìí’ fi ìṣe tí ń bá a lọ hàn, ó sì pa ìtumọ̀ ẹlẹ́rìí tàbí ẹ̀rí mọ́.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: fún ẹni kékeré àti ẹni ńlá
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́; ó ń tọ́ka sí àwọn ènìyàn láti gbogbo ipò láwùjọ.
- source_word: οὐδὲν ἐκτὸς λέγων ὧν
  choice: Èmi kò sọ ohun kan yàtọ̀ sí ohun tí
  rationale: ‘Yàtọ̀ sí’ lè gbé ìtumọ̀ ἐκτός méjèèjì—‘àfi’ àti ‘kọjá’—ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: àwọn wòlíì àti Mósè sọ
  rationale: A tẹ̀ lé bí Gíríìkì ṣe tò àwọn orúkọ náà, a sì fi ‘sọ’ ṣe àfihàn ọ̀rọ̀ àsọtẹ́lẹ̀ wọn.
- source_word: μελλόντων γίνεσθαι
  choice: pé yóò ṣẹlẹ̀
  rationale: Ó fi ohun tí ó wà ní ọjọ́ iwájú nígbà tí àwọn wòlíì àti Mósè sọ̀rọ̀ hàn, láìfi dandan kun ìtumọ̀ rẹ̀.
theological_decisions:
- issue: Bí ẹ̀rí Pọ́ọ̀lù ṣe bá Ìwé Mímọ́ Ísírẹ́lì mu
  choice: Pọ́ọ̀lù sọ pé ohun tí òun ń kéde kò yàtọ̀ sí ohun tí àwọn wòlíì àti Mósè sọ pé yóò ṣẹlẹ̀.
  alternative: Pọ́ọ̀lù kàn ń sọ pé ẹ̀kọ́ òun ní ìbámu gbogbogbò pẹ̀lú Ìwé Mímọ́, kì í ṣe pé gbogbo kúlẹ̀kúlẹ̀ rẹ̀ jẹ́ ìmúṣẹ àsọtẹ́lẹ̀.
  rationale: οὐδὲν ἐκτὸς ń sọ ìbámu tó lágbára, ṣùgbọ́n a kò fi àlàyé ẹ̀kọ́ ìsìn míì kún ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu; a yà gbolohun gígùn Gíríìkì sí méjì fún ìmọ̀ kedere láìyí ìbáṣepọ̀ èrò rẹ̀ padà.
