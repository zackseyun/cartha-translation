id: ACT.26.11
reference: Acts 26:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: yo
  text: Ní gbogbo àwọn sínágọ́gù ni mo máa ń fi ìyà jẹ wọ́n lọ́pọ̀ ìgbà, mo sì máa ń gbìyànjú láti fi ipá mú wọn sọ̀rọ̀ òdì. Ní ìbínú tí ó pọ̀ gidigidi sí wọn, mo sì máa ń ṣe inúnibíni sí wọn títí dé àwọn ìlú òkèèrè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ gangan, “títí dé àwọn ìlú tí ó wà níta”; ó ṣeé ṣe kí èyí tọ́ka sí àwọn ìlú tí ó wà lẹ́yìn ilẹ̀ Jùdíà.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: Ní gbogbo sínágọ́gù
  rationale: Ó fi ìṣe tí ó ń ṣẹlẹ̀ káàkiri àwọn sínágọ́gù hàn ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: ni mo ti ń fìyà jẹ wọ́n lọ́pọ̀ ìgbà
  rationale: Ó pa ìtumọ̀ ìjìyà àti àtúnṣe ìṣe náà mọ́, ó sì so participle náà mọ́ gbólóhùn àkọ́kọ́ lọ́nà àdánidá.
- source_word: ἠνάγκαζον
  choice: mo sì ń gbìyànjú láti fi ipá mú wọn
  rationale: Àkókò imperfect lè fi ìgbìyànjú tí a ń ṣe léraléra hàn; yíyan yìí kò sọ pé Pọ́ọ̀lù ṣàṣeyọrí ní gbogbo ìgbà.
- source_word: βλασφημεῖν
  choice: sọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún sísọ ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ búburú sí ohun mímọ́, láì sọ ohun pàtó tí Gíríìkì kò dárúkọ.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: Ìbínú mi sí wọn sì pọ̀ débi pé
  rationale: Ó mú ìbínú líle tí ó kọjá ìwọ̀n jáde ní èdè Yorùbá àdánidá, láì lo ọ̀rọ̀ tó lè túmọ̀ sí àìsàn ọpọlọ.
- source_word: ἐδίωκον
  choice: mo ń ṣe inúnibíni sí wọn
  rationale: Ó fi ìṣe inúnibíni tí ń bá a lọ hàn, ó sì bá ìlò ọ̀rọ̀ náà mu nínú Ìṣe Àwọn Àpọ́sítélì.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: títí dé àwọn ìlú òkèèrè
  rationale: Ó túmọ̀ ìlú tí ó wà níta tàbí rékọjá agbègbè wọn lọ́nà tí òǹkàwé Yorùbá òde òní yóò lóye; àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí βλασφημεῖν dojú kọ
  choice: A túmọ̀ rẹ̀ ní gbogbogbòò sí “sọ̀rọ̀-òdì sí Ọlọ́run,” láì dárúkọ Jésù tàbí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí wọ́n sọ̀rọ̀-òdì sí.
  alternative: “sọ̀rọ̀-òdì sí Jésù” tàbí “kọ́ ìgbàgbọ́ Kristẹni pẹ̀lú ọ̀rọ̀-òdì”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí Jésù tàbí ìjẹ́wọ́ Kristẹni, ṣùgbọ́n Gíríìkì kò sọ ohun tí ọ̀rọ̀-òdì náà dojú kọ ní pàtó; ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ tí a ti mọ̀ fún ibi ìjọsìn àwọn Júù; a sì fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
