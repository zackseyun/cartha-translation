revisions:
- from: Ní gbogbo sínágọ́gù ni mo ti ń fìyà jẹ wọ́n lọ́pọ̀ ìgbà, mo sì ń gbìyànjú láti fi ipá mú wọn sọ̀rọ̀-òdì sí Ọlọ́run. Ìbínú mi sí wọn sì pọ̀ débi pé mo ń ṣe inúnibíni sí wọn títí dé àwọn ìlú òkèèrè.[a]
  to: Ní gbogbo àwọn sínágọ́gù ni mo máa ń fi ìyà jẹ wọ́n lọ́pọ̀ ìgbà, mo sì máa ń gbìyànjú láti fi ipá mú wọn sọ̀rọ̀ òdì. Ní ìbínú tí ó pọ̀ gidigidi sí wọn, mo sì máa ń ṣe inúnibíni sí wọn títí dé àwọn ìlú òkèèrè.[a]
  rationale: A yọ “sí Ọlọ́run” kúrò kí ìtumọ̀ náà má bàa sọ ohun tí Gíríìkì kò sọ. A tún ṣe “sínágọ́gù” sí ọ̀pọ̀, a sì tún gbolohun náà ṣe díẹ̀ kí ó lè jẹ́ Yorùbá adayeba, nígbà tí a pa ìtumọ̀ ìṣe tí a máa ń ṣe léraléra àti ìbínú tí ó pọ̀ gidigidi mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:48Z'
