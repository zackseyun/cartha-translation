source:
  edition: SBLGNT
  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: yo
  text: Nítorí àwọn nǹkan wọ̀nyí[a] ni àwọn Júù fi mú mi ní tẹ́ńpìlì[b], wọ́n sì ń gbìyànjú láti pa mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Nítorí ìdí yìí” tàbí “Nítorí àwọn ohun wọ̀nyí.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “tẹ́ńpìlì” ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Nítorí àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ yìí ń sọ ìdí tàbí ohun tó fa ìṣẹ̀lẹ̀ náà, ó sì ń tọ́ka sẹ́yìn sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ. Ìtumọ̀ yìí bá èdè Yorùbá òde òní mu, kò sì dín ohun tí ‘àwọn nǹkan wọ̀nyí’ lè tọ́ka sí kù.
- source_word: με
  choice: mi
  rationale: Arọ́pò-orúkọ ẹni kìn-ín-ní ẹyọ tí ó jẹ́ àṣe àbọ̀ fún ‘mú’; ìtumọ̀ rẹ̀ ṣe tààrà.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Ó ń tọ́ka sí àwọn Júù tí wọ́n kópa nínú mímú Pọ́ọ̀lù nínú ìṣẹ̀lẹ̀ yìí. Àyíká ọ̀rọ̀ ló fi hàn pé kì í ṣe gbogbo àwọn Júù láìsí àfikún ‘kan,’ èyí tí kò sí nínú Gíríìkì.
- source_word: συλλαβόμενοι
  choice: mú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí dí ẹnì kan mú tàbí gbá a mú. ‘Mú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì bá ipá àti ìtakò inú àyíká náà mu láìsọ ọ́ di ìmúṣẹ òfin ní pàtó.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. ‘Ní tẹ́ńpìlì’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń pa ìyàtọ̀ náà mọ́.
- source_word: ἐπειρῶντο
  choice: wọ́n sì ń gbìyànjú
  rationale: Ìṣe aláìparí ní àkókò tó ti kọjá fi ìgbìyànjú tó ń lọ lọ́wọ́ hàn. Àmì ‘ń’ nínú Yorùbá ń pa ojú-ìṣe aláìparí yìí mọ́.
- source_word: διαχειρίσασθαι
  choice: láti pa mí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípa ẹnì kan tàbí mímú un kúrò ní ọ̀nà nípasẹ̀ ikú. ‘Pa mí’ ṣe kedere, kò sì fi ìtumọ̀ òfin tàbí ìdájọ́ tó ju ti Gíríìkì lọ kún un.
theological_decisions:
- issue: Bí a ṣe máa lóye ‘àwọn Júù’ nínú àyíká ọ̀rọ̀ ìtakò
  choice: A lo ‘àwọn Júù’ fún ẹgbẹ́ àwọn Júù tí wọ́n mú Pọ́ọ̀lù nínú ìṣẹ̀lẹ̀ tí a ń sọ.
  alternative: ‘àwọn Júù kan’ tàbí gbígbà pé ó ń dá gbogbo àwọn Júù lẹ́bi
  rationale: Gíríìkì sọ ẹni tí ó ṣe ìṣe náà, ṣùgbọ́n àyíká ìtàn fi ìtọ́kasí náà mọ́ àwọn alatakò pàtó. Fífún un ní ‘kan’ yóò fi ọ̀rọ̀ tí kò hàn gbangba nínú orísun kún un; ní ọwọ́ kejì, kíkà á sí gbogbo ẹ̀yà Júù yóò mú ẹ̀sùn náà gbòòrò ju ohun tí àyíká sọ lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ẹ̀dá ‘ni … fi’ jẹ́ àgbékalẹ̀ Yorùbá àdánidá tó so ìdí mọ́ ìṣe. A lo ‘ń gbìyànjú’ láti fi ìṣe tó ń lọ lọ́wọ́ nínú àkókò tó ti kọjá hàn.
