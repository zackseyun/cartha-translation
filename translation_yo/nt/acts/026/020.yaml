  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: yo
  text: Ṣùgbọ́n mo kọ́kọ́ kéde fún àwọn tí ó wà ní Damásíkù, lẹ́yìn náà ní Jerúsálẹ́mù pẹ̀lú, àti jákèjádò gbogbo agbègbè Jùdíà, àti fún àwọn aláì-Júù[a], pé kí wọ́n ronúpìwàdà, kí wọ́n sì yípadà sí Ọlọ́run, kí wọ́n máa ṣe àwọn iṣẹ́ tí ó yẹ fún ìrònúpìwàdà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Kèfèrí,” tàbí “àwọn orílẹ̀-èdè.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ìṣe tí ó bá ìrònúpìwàdà mu.” Ọ̀rọ̀ náà ń tọ́ka sí ìṣe tó yẹ kí ó bá ìrònúpìwàdà lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ohun tí Paulu sọ níbí ṣe ìyàtọ̀ sí ohun tó sọ ṣáájú pé òun kò ṣàìgbọ́ràn sí ìran ọ̀run.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: fún àwọn tí ó wà ní Damásíkù
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí wọ́n wà ní ìlú náà, ó sì pa ipò wọn gẹ́gẹ́ bí olùgbà ìkéde mọ́.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: kọ́kọ́ ... lẹ́yìn náà ní Jerusalẹmu pẹ̀lú
  rationale: Ìtumọ̀ yìí mú bí àwọn ibi náà ṣe tẹ̀ lé ara wọn hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: jákèjádò gbogbo agbègbè Jùdíà
  rationale: χώρα níbí túmọ̀ sí agbègbè ilẹ̀ kan ní gbogbogbòò; ‘agbègbè’ kò fi kún un pé abúlé nìkan ni.
- source_word: τοῖς ἔθνεσιν
  choice: fún àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἔθνη ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe orílẹ̀-èdè ní ìtumọ̀ ìṣèlú.
- source_word: ἀπήγγελλον
  choice: mo ... kéde
  rationale: Ó bá ìkéde ní gbangba nínú iṣẹ́ ìránṣẹ́ Paulu mu, láìsọ ọ̀rọ̀ náà di ti àṣà ìjọ kan pàtó.
- source_word: μετανοεῖν
  choice: ronúpìwàdà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì dára fún ìyípadà ọkàn àti ìhùwàsí sí Ọlọ́run; kì í ṣe yíyí èrò lásán.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: yípadà sí Ọlọ́run
  rationale: Ó pa ìtọ́sọ́nà sí Ọlọ́run mọ́, kò sì fi dandan hàn pé gbogbo olùgbọ́ ti jẹ́ ti Ọlọ́run tẹ́lẹ̀ rí.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: àwọn iṣẹ́ tí ó yẹ fún ìrònúpìwàdà
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ ἄξια àti ἔργα mọ́, ó sì fi hàn pé iṣẹ́ náà bá ìrònúpìwàdà mu.
- source_word: πράσσοντας
  choice: kí wọ́n máa ṣe
  rationale: ‘Máa ṣe’ mú ìṣe tó ń bá a lọ tàbí ìwà ìgbésí ayé tó tẹ̀ lé ìrònúpìwàdà hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ìrònúpìwàdà, yíyípadà sí Ọlọ́run, àti iṣẹ́
  choice: A gbé iṣẹ́ kalẹ̀ gẹ́gẹ́ bí ohun tó yẹ fún ìrònúpìwàdà tí ó sì ń bá a lọ.
  alternative: A lè ka iṣẹ́ náà sí ohun tó jẹ́ ìrònúpìwàdà fúnra rẹ̀, tàbí sí ìpìlẹ̀ ẹ̀tọ́ ẹni níwájú Ọlọ́run.
  rationale: Gírámà Gíríìkì fi μετανοεῖν àti ἐπιστρέφειν hàn gẹ́gẹ́ bí ohun tí a kéde pé kí wọ́n ṣe, nígbà tí πράσσοντας ń ṣàpèjúwe ìṣe tó bá ìrònúpìwàdà náà mu. A kò fi kún un pé iṣẹ́ ni ó ń mú ìgbàlà wá, bẹ́ẹ̀ ni a kò sọ pé kò ní ipa mìíràn ju ẹ̀rí lọ.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye. A lo ‘ronúpìwàdà’ gẹ́gẹ́ bí ọ̀rọ̀ tó ti fìdí múlẹ̀, ‘Kèfèrí’ sì jẹ́ ọ̀rọ̀ Bíbélì tó wọ́pọ̀ fún ẹni tí kì í ṣe Júù; àlàyé ìsàlẹ̀ ojú ewé dín ewu àìgbọ́ye rẹ̀ kù.
