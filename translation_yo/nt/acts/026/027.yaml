source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: yo
  text: Ọba Agrípà, ǹjẹ́ o gbà àwọn wòlíì gbọ́[a]? Mo mọ̀ pé o gbà wọ́n gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ǹjẹ́ o tẹ́wọ́ gba àwọn wòlíì?” tàbí, “ǹjẹ́ o fi ọkàn tán àwọn wòlíì?”
    reason: Àwọn wọ̀nyí jẹ́ ọ̀nà mìíràn láti túmọ̀ πιστεύεις pẹ̀lú τοῖς προφήταις, bí ó tilẹ̀ jẹ́ pé “gbà … gbọ́” bá ọ̀rọ̀ yìí mu jù lọ ní àyíká rẹ̀.
lexical_decisions:
- source_word: πιστεύεις
  choice: o gbà … gbọ́
  rationale: Ọ̀rọ̀-ìṣe yìí jẹ́ ìbéèrè tààrà sí ẹni kan. Àkójọpọ̀ ọ̀rọ̀ Yorùbá “gbà … gbọ́” fi hàn pé Agrípà gba ẹ̀rí tàbí ọ̀rọ̀ àwọn wòlíì gbọ́, kì í ṣe pé ó kàn ní ìgbẹ́kẹ̀lé ara ẹni sí wọn.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Ọba Agrípà
  rationale: A lo “Ọba” gẹ́gẹ́ bí ọ̀nà àdánidá tí a fi ń bá ọba sọ̀rọ̀ ní Yorùbá òde òní, a sì kọ orúkọ náà sí “Agrípà” ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: τοῖς προφήταις
  choice: àwọn wòlíì
  rationale: Ìtumọ̀ tààrà yìí tọ́ka sí àwọn wòlíì gẹ́gẹ́ bí ẹlẹ́rìí tí a mọ̀ nínú Ìwé Mímọ́, láìfi “àwọn ìwé àsọtẹ́lẹ̀” tàbí àlàyé mìíràn rọ́pò wọn.
- source_word: οἶδα
  choice: Mo mọ̀
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní tààrà, ó sì yẹ fún ìdánilójú tí Pọ́ọ̀lù sọ.
- source_word: ὅτι πιστεύεις
  choice: pé o gbà wọ́n gbọ́
  rationale: A tún lo ọ̀rọ̀-ìṣe kan náà bí ti ìbéèrè àkọ́kọ́. Ọ̀rọ̀ Yorùbá náà ti ní agbára ìtẹnumọ́ nínú ìdáhùn Pọ́ọ̀lù, nítorí náà kò nílò ọ̀rọ̀ àfikún tí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Irú ìgbàgbọ́ tí “àwọn wòlíì” jẹ́ ohun tí ó dúró lé
  choice: Gígbi àwọn wòlíì àti ẹ̀rí wọn gbọ́
  alternative: Títẹ́wọ́ gba àwọn wòlíì; fífi ọkàn tán àwọn wòlíì
  rationale: πιστεύω pẹ̀lú dative níbí túmọ̀ sí gígbi àwọn wòlíì tàbí iṣẹ́ wọn gbọ́. Ìtumọ̀ yìí kò fi ìgbọràn kún un, bẹ́ẹ̀ ni kò sọ ọ́ di ẹ̀kọ́ ìgbàgbọ́ tí ó fẹ̀ ju ohun tí Pọ́ọ̀lù béèrè lọ.
translation_notes:
  register: Yorùbá àtijọ́-díẹ̀ ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. “Ǹjẹ́” mú ìbéèrè tààrà náà ṣe kedere, “wọ́n” sì yàgò fún àtúnṣe “àwọn wòlíì” tí kò ṣe pàtàkì.
