id: ACT.26.29
reference: Acts 26:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: yo
  text: Ṣùgbọ́n Paulu sọ pé,[a] “Èmi ìbá gbàdúrà sí Ọlọ́run pé, yálà ní àkókò kúkúrú tàbí ní àkókò gígùn, kì í ṣe ìwọ nìkan, ṣùgbọ́n gbogbo àwọn tí ń gbọ́ mi lónìí náà, kí wọ́n di irú ẹni tí èmi jẹ́—àyàfi àwọn ẹ̀wọ̀n wọ̀nyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yálà ó fẹ́rẹ̀ẹ́ rí bẹ́ẹ̀ tàbí pátápátá.” Gbólóhùn Gíríìkì náà ṣòro, ó sì lè tọ́ka sí ìwọ̀n, ìsapá, tàbí iye àkókò.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Èmi yóò gbàdúrà sí Ọlọ́run pé
  rationale: Ìtumọ̀ yìí mú ìfẹ́ inú tó ní ìrísí àdúrà àti ẹni tí àdúrà náà tọ̀ sí hàn ní Yorùbá àdánidá; ó yẹra fún ‘Mo fẹ́’ tí kò fi ìtọ́kasí sí Ọlọ́run hàn kedere.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: yálà ní àkókò kúkúrú tàbí ní àkókò gígùn
  rationale: Ó gbé ìtumọ̀ àkókò tó ṣeé ṣe kalẹ̀, ó sì pa ìfiwé ohun kékeré àti ohun púpọ̀ mọ́. Nítorí pé gbólóhùn Gíríìkì náà ṣòro, àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tó ṣeé ṣe pamọ́.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: kì í ṣe ìwọ nìkan, ṣùgbọ́n gbogbo àwọn tí ń gbọ́ ọ̀rọ̀ mi lónìí pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ ‘kì í ṣe…nìkan, ṣùgbọ́n…pẹ̀lú’ mọ́, ó sì sọ participle àsìkò yìí ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: kí wọ́n lè dàbí irú ẹni tí èmi jẹ́
  rationale: ‘Kí wọ́n lè’ sọ àbájáde tí Paulu ń fẹ́ hàn, ‘irú ẹni tí èmi jẹ́’ sì pa ìtọ́kasí ara rẹ̀ àti ìtumọ̀ τοιούτους/ὁποῖος mọ́.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: àyàfi àwọn ẹ̀wọ̀n wọ̀nyí
  rationale: ‘Àyàfi’ fi ìyọkúrò hàn ní tààrà, ‘ẹ̀wọ̀n’ sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún àwọn ohun ìdè ẹlẹ́wọ̀n ní àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ ἐν ὀλίγῳ καὶ ἐν μεγάλῳ ní ìbáṣepọ̀ pẹ̀lú ọ̀rọ̀ Agrippa tó ṣáájú
  choice: yálà ní àkókò kúkúrú tàbí ní àkókò gígùn
  alternative: yálà ó fẹ́rẹ̀ẹ́ rí bẹ́ẹ̀ tàbí pátápátá; tàbí pẹ̀lú ìsapá díẹ̀ tàbí púpọ̀
  rationale: Gbólóhùn náà ní àríyànjiyàn gidi, kò sì yẹ kí ìtumọ̀ yanju rẹ̀ bí ẹni pé ìtumọ̀ kan ṣoṣo ló ṣeé ṣe. Ọ̀rọ̀ inú ẹsẹ̀ yan ìtumọ̀ àkókò tó bá ìjíròrò mu, àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọ Paulu ni a lò. Ìforúkọ ‘Ọlọ́run’ àti ìṣètò gbólóhùn jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba.
