id: ACT.26.26
reference: Acts 26:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: yo
  text: Nítorí ọba mọ̀ nípa àwọn nǹkan wọ̀nyí, èmi sì ń bá a sọ̀rọ̀ pẹ̀lú ìgboyà.[a] Nítorí ó dá mi lójú pé kò sí ọ̀kan nínú àwọn nǹkan wọ̀nyí tí ó sá fún àfiyèsí rẹ̀,[b] nítorí a kò ṣe èyí ní ìkọ̀kọ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “mo ń bá a sọ̀rọ̀ ní òmìnira.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìsọ̀rọ̀ tí ó ṣí sílẹ̀, tí a kò fi pamọ́, tí ó sì ní ìgboyà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “kò sí ohun kan nínú àwọn nǹkan wọ̀nyí tí ó fara pamọ́ fún un,” tàbí, “tí ó lọ láìjẹ́ kí ó kíyè sí i.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, ó jẹ́ “a kò ṣe èyí ní igun kan.” Àkànlò náà túmọ̀ sí pé a kò ṣe é ní ìkọ̀kọ̀ tàbí ní ibi tí kò ṣeé rí.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: mọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí níní ìmọ̀ tàbí ìfaramọ́ ohun kan; “mọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìsọ̀rọ̀ tààrà nípa ìmọ̀ ọba mu.
- source_word: περὶ τούτων
  choice: nípa àwọn nǹkan wọ̀nyí
  rationale: Ó fi kókó ọ̀rọ̀ tí ọba mọ̀ hàn, ó sì pa ọ̀pọ̀ nǹkan inú τούτων mọ́.
- source_word: παρρησιαζόμενος
  choice: ń bá a sọ̀rọ̀ láìbẹ̀rù, ní gbangba
  rationale: Ó mú ìsọ̀rọ̀ tí ó ní ìgboyà, òmìnira àti ìṣípayá jáde; àpapọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá.
- source_word: λανθάνειν ... αὐτὸν
  choice: bọ́ lọ́wọ́ àkíyèsí rẹ̀
  rationale: Èyí jẹ́ àkànlò èdè Yorùbá tó bá èrò pé ohun kan kò jẹ́ kí ẹni náà kíyè sí i mu.
- source_word: οὐ πείθομαι οὐθέν
  choice: ó dá mi lójú pé kò sí ìkankan
  rationale: Ó fi ìdánilójú Pọ́ọ̀lù hàn, ó sì tú ìkọ̀ méjì Gíríìkì sí ìṣètò Yorùbá tó ṣe kedere láìyí ìtumọ̀ padà.
- source_word: πεπραγμένον
  choice: ṣe
  rationale: “Ṣe” jẹ́ ọ̀rọ̀ tó sun mọ́ ìṣe tí a ti mú ṣẹ, tí àyíká gbolohun náà sì ń fi hàn pé ó ti ṣẹlẹ̀.
- source_word: ἐν γωνίᾳ
  choice: ní ìkọ̀kọ̀
  rationale: 'Dípò títú àwòrán Gíríìkì náà ní tààrà gẹ́gẹ́ bí “ní igun kan,” èyí sọ ìtumọ̀ àkànlò rẹ̀ ní Yorùbá àdánidá: kì í ṣe ohun tí a ṣe ní ibi ìfarapamọ́ tàbí ní òkùnkùn.'
- source_word: τοῦτο
  choice: èyí
  rationale: Ó pa ìtọ́kasí náà mọ́ ní gbígbòòrò, láìfi dandan sọ bóyá ó ń tọ́ka sí ikú àti àjíǹde Jésù nìkan tàbí sí gbogbo àwọn ìṣẹ̀lẹ̀ tí wọ́n ń jíròrò.
theological_decisions:
- issue: Ìwọ̀n ohun tí “èyí” (τοῦτο) ń tọ́ka sí àti bí àwọn ìṣẹ̀lẹ̀ náà ṣe hàn sí gbogbo ènìyàn
  choice: Lo “èyí” láìṣe àlàyé síwájú, kí ìtọ́kasí náà lè dúró ní gbígbòòrò bí ó ti rí nínú Gíríìkì.
  alternative: Ṣàlàyé rẹ̀ ní pàtó gẹ́gẹ́ bí ikú àti àjíǹde Jésù nìkan, tàbí gẹ́gẹ́ bí gbogbo ìgbòkègbodò àwọn Kristẹni àti ẹjọ́ Pọ́ọ̀lù.
  rationale: Ẹsẹ̀ náà kò sọ pàtó nípa ìwọ̀n τοῦτο; ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn kan kún un tàbí yanju àìdájú tí orísun náà pa mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. “Ọba” pa oyè Agrippa mọ́; àwọn àmì ohùn ni a fi sí ibi tí ó yẹ. A tú àkànlò ἐν γωνίᾳ sí “ní ìkọ̀kọ̀” nínú ọ̀rọ̀ pàtàkì, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán “ní igun kan” mọ́.
