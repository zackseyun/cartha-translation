  source_fidelity: 'Ìtumọ̀ náà ní gbogbo àwọn èrò pàtàkì Gíríìkì: àkókò ọ̀sán, ojú ọ̀nà, ìpè sí ọba, ìmọ́lẹ̀ láti ọ̀run, ìmọ́lẹ̀ tí ó tayọ ti oòrùn, àti yíyí ẹgbẹ́ àwọn arìnrìn-àjò ká. Ṣùgbọ́n ìṣètò gbolohun lọwọlọwọ mú kí ‘tí ìmọ́lẹ̀ rẹ̀ sì ju ti oòrùn lọ’ wá lẹ́yìn iṣẹ́ títàn ká, ó sì yẹ kí a sọ λαμπρότητα ní kedere gẹ́gẹ́ bí ‘ìtànná’.'
