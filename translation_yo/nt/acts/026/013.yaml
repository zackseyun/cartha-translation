id: ACT.26.13
reference: Acts 26:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: yo
  text: Ní àárín ọ̀sán, ní ojú ọ̀nà, mo rí, ìwọ ọba, ìmọ́lẹ̀ kan láti ọ̀run, tí ó ju ìtànná oòrùn lọ[a], tí ó tàn yí èmi àti àwọn tí ń bá mi rìn ká.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó kọjá ìtànná oòrùn lọ”; Gíríìkì tẹnu mọ́ ọn pé ìmọ́lẹ̀ náà tayọ ìtànná oòrùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Ní ọ̀sán gangan
  rationale: Gbólóhùn Gíríìkì náà jẹ́ àṣà ọ̀rọ̀ fún àárín ọ̀sán; yíyan yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtumọ̀ àkókò náà mọ́.
- source_word: κατὰ τὴν ὁδὸν
  choice: ní ojú ọ̀nà
  rationale: Ó tọ́ka sí ibi tí ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ nígbà ìrìn-àjò; ọ̀rọ̀ yìí jẹ́ kedere, ó sì pa àwòrán ọ̀nà mọ́.
- source_word: εἶδον
  choice: mo rí
  rationale: Ìtumọ̀ taara ti ọ̀rọ̀ ìṣe aorist fún rírí ni èyí.
- source_word: βασιλεῦ
  choice: ìwọ ọba
  rationale: Ó pa ìpè taara vocative mọ́ ní ọ̀nà tí ó ní iyì, tí ó sì bá Yorùbá òde òní mu.
- source_word: οὐρανόθεν
  choice: láti ọ̀run
  rationale: Ó fi hàn pé orísun ìmọ́lẹ̀ náà wá láti ọ̀run, kì í ṣe pé ó wà ní ojú sánmà lásán.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: tí ìmọ́lẹ̀ rẹ̀ sì ju ti oòrùn lọ
  rationale: 'Ó sọ excess tí ὑπέρ ní pẹ̀lú λαμπρότης ní Yorùbá àdánidá: ìmọ́lẹ̀ náà tayọ ìmọ́lẹ̀ oòrùn.'
- source_word: φῶς
  choice: ìmọ́lẹ̀ kan
  rationale: Ó ṣàgbékalẹ̀ ohun ìyanu tí Paulu rí, gẹ́gẹ́ bí orúkọ tí kò ní article nínú Gíríìkì.
- source_word: περιλάμψαν με ... καὶ τοὺς σὺν ἐμοὶ πορευομένους
  choice: tí ó mọ́lẹ̀ yí èmi àti àwọn tí ń bá mi rin ká
  rationale: Ó pa ìtumọ̀ ìmọ́lẹ̀ tó yí àwọn ènìyàn ká àti àwọn ẹlẹgbẹ́ ìrìn Paulu mọ́ ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ οὐρανόθεν nínú ìṣẹ̀lẹ̀ ìfihàn
  choice: láti ọ̀run
  alternative: láti ojú sánmà
  rationale: Ní àyíká ìtàn ìfihàn yìí àti nínú Luku–Ìṣe, “ọ̀run” pa agbára ẹ̀sìn àti orísun ohun tí Paulu rí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu. Ìṣètò gbólóhùn náà tẹ̀lé ìtẹnumọ́ orísun Gíríìkì, ṣùgbọ́n a tún un ṣe díẹ̀ kí ìbáṣepọ̀ “ìmọ́lẹ̀” àti bí ó ṣe ju ti oòrùn lọ lè yege ní Yorùbá.
