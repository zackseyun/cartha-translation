id: ACT.26.28
reference: Acts 26:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: yo
  text: Nígbà náà ni Agiripa sọ fún Paulu pé, “Ní àkókò díẹ̀, o ń rọ̀ mí láti di Kristẹni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Ó fẹ́rẹ̀ẹ́ rọ̀ mí láti di Kristẹni,” tàbí bóyá, “Ní àkókò kúkúrú bẹ́ẹ̀, ṣé o rò pé o lè sọ mí di Kristẹni?” Gbólóhùn Gíríìkì náà lè tọ́ka sí àkókò díẹ̀ tàbí ìwọ̀n díẹ̀, ohùn Agrippa sì lè jẹ́ ti ìfẹ́ ọkàn tàbí ti ẹ̀gàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Nígbà náà ni Agrippa
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; ‘Nígbà náà’ mú ìtẹ̀síwájú ìtàn jáde lọ́nà àdánidá láìfi ìtakora tí ó lágbára kún un.
- source_word: πρὸς τὸν Παῦλον
  choice: sọ fún Paulu pé
  rationale: πρός wà nínú àgbékalẹ̀ ọ̀rọ̀ tí ọ̀rọ̀-ìṣe sísọ kò hàn gbangba; èdè Yorùbá àdánidá nílò ‘sọ fún … pé’ láti ṣáájú ọ̀rọ̀ tààrà.
- source_word: Ἐν ὀλίγῳ
  choice: Láàárín àkókò díẹ̀
  rationale: Ìtumọ̀ yìí fi ojú ìtumọ̀ àkókò hàn ní tààrà, ṣùgbọ́n gbólóhùn Gíríìkì náà tún lè tọ́ka sí ìwọ̀n kékeré; àlàyé ìsàlẹ̀ ṣètọ́jú àìdánilójú náà.
- source_word: με πείθεις
  choice: ìwọ ń yí mi lọ́kàn padà
  rationale: Àmì ìṣe ìsinsìnyí πείθεις bá ‘ń yí … lọ́kàn padà’ mu, ó sì fi ìgbìyànjú tàbí iṣẹ́ tí ń lọ lọ́wọ́ hàn láìfi ìtumọ̀ míràn kún un.
- source_word: Χριστιανὸν
  choice: Kristẹni
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìdánimọ̀ tàbí ipò tuntun; ‘Kristẹni’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún Χριστιανός.
- source_word: ποιῆσαι
  choice: láti di
  rationale: Nínú àgbékalẹ̀ yìí, ποιῆσαι ń sọ àbájáde di ohun kan; ‘láti di Kristẹni’ jẹ́ Yorùbá àdánidá ju ‘láti sọ mí di Kristẹni’ lọ, ó sì pa ìtumọ̀ àbájáde mọ́.
theological_decisions:
- issue: Ìró ohùn àti agbára ìdáhùn Agrippa
  choice: Gbólóhùn tààrà pé Paulu ń yí i lọ́kàn padà láàárín àkókò díẹ̀.
  alternative: Ó lè jẹ́ ọ̀rọ̀ ẹ̀gàn tàbí ìbéèrè pé, ‘Ṣé o rò pé o lè sọ mí di Kristẹni láàárín àkókò kúkúrú báyìí?’; ó tún lè túmọ̀ sí ‘Ó fẹ́rẹ̀ẹ́ yí mi lọ́kàn padà.’
  rationale: Ἐν ὀλίγῳ lè tọ́ka sí àkókò díẹ̀ tàbí ìwọ̀n díẹ̀, ìró ohùn Agrippa sì lè jẹ́ ti òótọ́, ti yíyẹra, tàbí ti ẹ̀gàn. Ọ̀rọ̀ pàtàkì tẹ̀lé ojú ìtumọ̀ gírámà láìyanjú àríyànjiyàn náà ní ìkọ̀kọ̀; àlàyé ìsàlẹ̀ pa àwọn àṣàyàn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. ‘Yí ẹni lọ́kàn padà’ jẹ́ ọ̀nà àdánidá láti sọ ìtẹ́lọ́rùn tàbí ìmúgbàgbọ́, nígbà tí ‘láti di Kristẹni’ pa àbájáde ìṣe mọ́. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu; àwọn orúkọ ẹni ni a kọ ní fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀.
