    issue: “ń yí mi lọ́kàn padà”
    rationale: Ó lè jẹ́ ìtumọ̀ πείθεις, ṣùgbọ́n ó rọrùn láti gbọ́ ọ́ gẹ́gẹ́ bí ìyípadà ọkàn/ìyípadà ẹ̀sìn. “Ń rọ̀ mí” ń sọ ìfọkànsìn ‘persuade’ ní tààrà ju.
