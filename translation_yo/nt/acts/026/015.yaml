source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: yo
  text: Mo sì wí pé, “Ta ni ìwọ, Olúwa?[a]” Olúwa sì wí pé, “Èmi ni Jésù, ẹni tí ìwọ ń ṣe ìnúnibíni sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ àbọ̀wọ̀ tí a fi ń pe ẹnì kan; ṣùgbọ́n “Olúwa” ni a yàn níbí nítorí ẹni tó ń sọ̀rọ̀ fara hàn láti ọ̀run, ó sì fi ara rẹ̀ hàn lẹ́sẹ̀kẹsẹ̀ gẹ́gẹ́ bí Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Mo sì wí pé
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ tí kò fi ìtakora líle hàn; “sì” mú ìṣàn ìtàn náà jáde lọ́nà àdánidá. “Mo” tún fi ἐγώ hàn láìfi ìtẹnumọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: Τίς εἶ, κύριε;
  choice: Ta ni ìwọ, Olúwa?
  rationale: “Ta ni ìwọ?” ni ìtumọ̀ tààrà fún τίς εἶ. “Olúwa” pa ìwọ̀n ọ̀wọ̀ àti agbára κύριε mọ́ nínú ìfarahàn láti ọ̀run; síbẹ̀, “ọ̀gá” lè ṣeé ṣe gẹ́gẹ́ bí ọ̀rọ̀ àbọ̀wọ̀, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Olúwa sì wí pé
  rationale: ὁ κύριος ń tọ́ka sí ẹni tí a ti mọ̀ gẹ́gẹ́ bí Olúwa; èdè Yorùbá kò nílò atúmọ̀ ọ̀rọ̀ article lọ́tọ̀ níbí. “Sì” ṣàfihàn δέ gẹ́gẹ́ bí àsopọ̀ ìtàn.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Èmi ni Jésù
  rationale: “Èmi ni” jẹ́ ìṣàfihàn ara ẹni tó bá ìlànà Yorùbá mu, ó sì pa ìfarahàn ἐγώ mọ́ láìfikún “fúnra mi” tí yóò jẹ́ àfikún ìtẹnumọ́.
- source_word: ὃν σὺ διώκεις
  choice: ẹni tí ìwọ ń ṣe inúnibíni sí
  rationale: “Ṣe inúnibíni sí” túmọ̀ διώκω ní ìtumọ̀ ìlépa àti ìpọ́njú ọ̀tá. Àmì “ń” fi ìṣe tí ń lọ lọ́wọ́ hàn, “ìwọ” sì pa σὺ mọ́ ní kedere.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ tí Saulu fi bá ẹni tó fara hàn láti ọ̀run sọ̀rọ̀
  choice: Olúwa
  alternative: ọ̀gá
  rationale: κύριε lè jẹ́ ọ̀rọ̀ àbọ̀wọ̀ bí “ọ̀gá,” ṣùgbọ́n nínú ọ̀rọ̀ yìí ẹni náà fara hàn láti ọ̀run, lẹ́sẹ̀kẹsẹ̀ ó sì sọ ara rẹ̀ di Jésù; “Olúwa” dá ìwọ̀n ẹ̀kọ́ àti àìdánilójú àkọ́kọ́ náà dúró dáadáa jù. Àlàyé ìsàlẹ̀ pa àṣàyàn mìíràn mọ́.
- issue: Ìdánimọ̀ ẹni tí a ń ṣe inúnibíni sí
  choice: Jésù fúnra rẹ̀ ni gbolohun náà sọ pé Saulu ń ṣe inúnibíni sí
  alternative: ṣíṣe àlàyé kún un pé àwọn ọmọlẹ́yìn Jésù nìkan ni Saulu ń ṣe inúnibíni sí
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “Jésù, ẹni tí ìwọ ń ṣe inúnibíni sí.” A kò ṣàlàyé ìbáṣepọ̀ Jésù pẹ̀lú àwọn ọmọlẹ́yìn rẹ̀ sínú ẹsẹ yìí, kí a má bàa tú ìrora ẹ̀kọ́ inú ọ̀rọ̀ náà ká.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì bá ìtàn mímọ́ mu. “Ṣe inúnibíni sí” jẹ́ ọ̀rọ̀ òde òní tí ó yé gbogbo ènìyàn, láìdín agbára διώκεις kù.
