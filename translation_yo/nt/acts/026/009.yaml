id: ACT.26.9
reference: Acts 26:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: yo
  text: Nítorí náà, èmi fúnra mi rò pé ó yẹ kí n ṣe ọ̀pọ̀ ohun lòdì sí orúkọ Jésù ará Násárétì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lòdì sí orúkọ Jésù ti Násárétì.”
    reason: Àwọn ọ̀nà méjèèjì lè ṣe àfihàn Ἰησοῦ τοῦ Ναζωραίου; “ará Násárétì” jẹ́ àdánidá ní Yorùbá, “Jésù ti Násárétì” sì tú ìbáṣepọ̀ ibi náà jáde ní ọ̀nà míì.
lexical_decisions:
- source_word: Ἐγὼ
  choice: èmi fúnra mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba ní Gíríìkì fi ìtẹnumọ́ hàn; “èmi fúnra mi” pa ìtẹnumọ́ Pọ́ọ̀lù mọ́.
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ àwọn particle yìí ń tẹ̀síwájú nínú ọ̀rọ̀, ó sì ní ìtumọ̀ ìyọrísí pẹ̀lú ìtẹnumọ́ díẹ̀. “Nítorí náà” jẹ́ ọ̀nà àdánidá láti sọ ìsopọ̀ náà ní Yorùbá; ìtẹnumọ́ tún wà nínú “èmi fúnra mi.”
- source_word: ἔδοξα ἐμαυτῷ
  choice: rò
  rationale: Gbólóhùn náà túmọ̀ sí pé Pọ́ọ̀lù ní èrò tàbí ìdájọ́ inú tirẹ̀. “Rò” jẹ́ èdè Yorùbá àdánidá, “èmi fúnra mi” sì ti gbé agbára reflexive náà jáde.
- source_word: πρὸς τὸ ὄνομα
  choice: lòdì sí orúkọ
  rationale: Ní ìbámu pẹ̀lú ἐναντία àti πρᾶξαι, πρός ní agbára ìtakò níbí. “Lòdì sí orúkọ” ṣe àfihàn èyí láì tú “orúkọ” sí “àṣẹ” tàbí “ẹjọ́” nìkan.
- source_word: ὄνομα
  choice: orúkọ
  rationale: Ìtumọ̀ tààrà yìí pa àṣà ọ̀rọ̀ Bíbélì mọ́, níbi tí orúkọ ti lè dúró fún ẹni náà, ọlá rẹ̀, tàbí àṣẹ rẹ̀, láì dín ìtumọ̀ rẹ̀ kù.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jésù ará Násárétì
  rationale: “Ará Násárétì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún àpèjúwe ẹni tí ó ti Násárétì wá; ó pa ìdánimọ̀ orísun náà mọ́.
- source_word: δεῖν
  choice: ó yẹ kí n
  rationale: Ó sọ dandan tí Pọ́ọ̀lù fúnra rẹ̀ rò pé ó jẹ́ ojúṣe rẹ̀ nígbà náà. “Ó yẹ kí n” fi ojúṣe tí ó gbà gbọ́ hàn ju dandan tí a fi lé e lórí lọ.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: ṣe ọ̀pọ̀ ohun lòdì sí
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀lọpọ̀ ìṣe (πολλά) àti ìtakò (ἐναντία) mọ́, láì sọ irú àwọn ìṣe náà ní kíkún ju ohun tí ẹsẹ̀ sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ “orúkọ” ní ìbáṣepọ̀ pẹ̀lú Jésù
  choice: Pa ọ̀rọ̀ Bíbélì náà “orúkọ” mọ́.
  alternative: “àṣẹ Jésù” tàbí “ẹjọ́ Jésù”
  rationale: Ẹsẹ̀ náà kò fi dandan mú wa láti yan apá kan ṣoṣo nínú ìtumọ̀ rẹ̀. “Orúkọ” lè tọ́ka sí Jésù fúnra rẹ̀, ọlá rẹ̀, ìjẹ́wọ́ rẹ̀, tàbí àṣẹ rẹ̀; pípa ọ̀rọ̀ náà mọ́ ń dáàbò bo ìwọ̀n ìtumọ̀ yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé yé fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó yẹ. “Èmi fúnra mi” gbé ìtẹnumọ́ Gíríìkì jáde, “ó yẹ kí n” sì pa ìrísí ojúṣe inú èrò Pọ́ọ̀lù mọ́.
