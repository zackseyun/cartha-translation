base_translation:
  language: en
  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: yo
  text: tí mo ń gbà ọ́ là kúrò lọ́wọ́ àwọn ènìyàn náà àti lọ́wọ́ àwọn Kèfèrí; sí àwọn wọ̀nyí ni mo ń rán ọ́ sí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: tí mo ń gbà ọ́ sílẹ̀ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ participle ìsinsìnyí, ó sì ń sọ nípa gbígbà là tàbí yíyọ kúrò nínú ewu. “Gbà ọ́ sílẹ̀ lọ́wọ́” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìdáǹdè mọ́.
- source_word: τοῦ λαοῦ
  choice: àwọn ènìyàn náà
  rationale: Ní ìtakora pẹ̀lú “àwọn Kèfèrí,” ó ṣeé ṣe kí ó tọ́ka sí àwọn Júù tàbí Israẹli; síbẹ̀, Gíríìkì sọ “àwọn ènìyàn náà” lásán, nítorí náà a pa ọ̀rọ̀ tí kò túmọ̀ sí ju ohun tí orísun sọ lọ mọ́.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká ìyàtọ̀ láàárín àwọn Júù àti àwọn tí kì í ṣe Júù nínú Ìṣe Àwọn Àpọ́sítélì, ἔθνη túmọ̀ sí àwọn tí kì í ṣe Júù; “àwọn Kèfèrí” ni ọ̀rọ̀ Yorùbá Bíbélì tí a mọ̀ dáadáa fún ìtumọ̀ yìí.
- source_word: εἰς οὓς
  choice: tí
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe “rán,” ìbátan yìí di “tí mo ń rán ọ sí” ní Yorùbá àdánidá, tí ó bá ìtumọ̀ “sí ọ̀dọ̀ àwọn tí” mu.
- source_word: ἀποστέλλω
  choice: mo ń rán ọ sí
  rationale: Àmì ìsinsìnyí Gíríìkì ń fi iṣẹ́ ìránṣẹ́ tí Jésù ń gbé lé Pọ́ọ̀lù lọ́wọ́ hàn; “ń rán” pa ìsinsìnyí àti ìmọ̀lára iṣẹ́ tí ń bẹ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ẹni tí “àwọn ènìyàn náà” ń tọ́ka sí ní ìtakora pẹ̀lú àwọn Kèfèrí
  choice: A fi “àwọn ènìyàn náà” sínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè túmọ̀ sí àwọn Júù.
  alternative: “àwọn Júù” tàbí “àwọn ènìyàn Israẹli”
  rationale: Àyíká ọ̀rọ̀ fi hàn gbangba pé àwọn Júù ni a ń tọ́ka sí, ṣùgbọ́n orísun Gíríìkì sọ λαός (“àwọn ènìyàn”) lásán. Fífi ọ̀rọ̀ náà sílẹ̀ bẹ́ẹ̀ ń pa ìṣísẹ̀ àti àìsọ pàtó orísun mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tí ó ti yẹ, ní èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. “Àwọn Kèfèrí” ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ fún àwọn tí kì í ṣe Júù; àfikún ẹsẹ̀ ṣàlàyé ẹni tí “àwọn ènìyàn náà” lè jẹ́.
