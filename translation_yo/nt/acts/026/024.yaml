id: ACT.26.24
reference: Acts 26:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: yo
  text: Bí ó sì ti ń sọ àwọn nǹkan wọ̀nyí láti fi gbèjà ara rẹ̀, Fẹ́sítù fi ohùn rara sọ pé, “Pọ́ọ̀lù, orí rẹ ti dàrú! Ẹ̀kọ́ púpọ̀ rẹ ń sọ ọ́ di aṣínwín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Pọ́ọ̀lù, o ya wèrè! Ẹ̀kọ́ púpọ̀ rẹ ń sọ ọ́ di aṣínwín.”
    reason: Àṣàyàn ọ̀rọ̀ míì tó tú Μαίνῃ ní tààràtà sí i, tí ó sì pa ìtẹnumọ́ ẹ̀sùn Fẹ́sítù mọ́.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: bí ó sì ti ń sọ àwọn nǹkan wọ̀nyí láti fi gbèjà ara rẹ̀
  rationale: Ìtumọ̀ yìí mú ìṣe tó ń lọ ní àkókò kan náà àti ọ̀rọ̀ ìgbèjà níwájú ilé ẹjọ́ jáde, ní èdè Yorùbá tó ṣeé lóye.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: fi ohùn rara
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa bí Fẹ́sítù ṣe dá ọ̀rọ̀ náà dúró pẹ̀lú ohùn gíga mọ́.
- source_word: φησιν
  choice: sọ pé
  rationale: A lo ọ̀rọ̀ ìṣe àtẹ̀yìnwá tó bá ìtàn Yorùbá mu, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo ìsinsìnyí ìtàn.
- source_word: Μαίνῃ
  choice: orí rẹ ti dàrú
  rationale: Ó sọ ẹ̀sùn pé Pọ́ọ̀lù ti ya wèrè ní ọ̀nà Yorùbá òde òní tó lágbára ṣùgbọ́n tó ṣeé lóye.
- source_word: τὰ πολλά ... γράμματα
  choice: ẹ̀kọ́ púpọ̀ rẹ
  rationale: γράμματα níbí tọ́ka sí ìmọ̀ tàbí ẹ̀kọ́ gíga, kì í ṣe àwọn lẹ́tà tàbí ìwé púpọ̀ ní pàtó.
- source_word: εἰς μανίαν περιτρέπει
  choice: ń sọ ọ́ di aṣínwín
  rationale: Ìtumọ̀ yìí mú ìyípadà sí ipò wèrè tí εἰς àti περιτρέπει ń fi hàn jáde ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ òde òní, tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A pa ìrísí ìdájọ́ inú ἀπολογουμένου mọ́, a sì lo “Fẹ́sítù” àti “Pọ́ọ̀lù” gẹ́gẹ́ bí àkọtọ̀ orúkọ tó wọ́pọ̀ nínú Bíbélì Yorùbá.
