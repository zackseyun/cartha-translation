  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: yo
  text: Kí nìdí tí ẹ fi ń ka a sí ohun tí kò ṣeé gbàgbọ́ bí Ọlọ́run bá ń jí àwọn òkú dìde?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Èé ṣe
  rationale: Ó ṣe àfihàn ìbéèrè ìdí ní Yorùbá àdánidá.
- source_word: ἄπιστον
  choice: kò ṣeé gbàgbọ́
  rationale: Ó túmọ̀ sí ohun tí a kà sí aláìṣeé-gbàgbọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: ẹ̀yin fi ń ṣe ìdájọ́ pé
  rationale: Ó pa èrò ìdájọ́ inú κρίνεται mọ́, ó sì fi παρ’ ὑμῖν hàn gẹ́gẹ́ bí àwọn tí wọ́n ń ṣe ìdájọ́ náà, ní ìbámu pẹ̀lú ẹ̀rí orísun àti àtúnṣe tuntun.
- source_word: εἰ
  choice: bí ... bá
  rationale: Ó pa ìrísí gbólóhùn oníṣ شرط mọ́ láìpinnu bóyá εἰ túmọ̀ sí ‘bí’ tàbí ‘pé’ ní ọ̀nà ìtumọ̀ ẹ̀kọ́.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Ọlọ́run bá jí àwọn òkú dìde
  rationale: ‘Jí ... dìde’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣedédé fún ἐγείρει; ‘àwọn òkú’ pa ọ̀pọ̀ nọ́ńbà νεκρούς mọ́.
theological_decisions:
- issue: Bóyá a ó sọ εἰ di ọ̀rọ̀ ìdánilójú ‘pé’ tàbí ọ̀rọ̀ oníṣ شرط ‘bí’.
  choice: bí Ọlọ́run bá jí àwọn òkú dìde
  alternative: pé Ọlọ́run ń jí àwọn òkú dìde
  rationale: A pa àìdánilójú girama εἰ mọ́, gẹ́gẹ́ bí orísun, dípò kí a yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tó yẹ, pẹ̀lú èdè ọ̀wọ̀ àti àdánidá tí òǹkàwé òde òní lè lóye. ‘Ẹ̀yin’ mú àfihàn ọ̀pọ̀ ènìyàn inú ὑμῖν hàn kedere.
