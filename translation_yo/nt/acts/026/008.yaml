  source_fidelity: Ìtumọ̀ náà mú ìbéèrè, ìdájọ́ àwọn olùgbọ́, àti jíjí àwọn òkú dìde wá síta. Síbẹ̀, ‘ẹ̀yin fi ń ṣe ìdájọ́ pé’ jẹ́ ìṣàlàyé tó gùn díẹ̀ fún κρίνεται παρ’ ὑμῖν, àti ‘bá jí’ lè dà bí ìṣẹ̀lẹ̀ kan ju iṣe tí ἐγείρει (ìṣe oníwàlọwọ̀) ń sọ lọ.
