revisions:
- from: Ṣùgbọ́n Paulu wí pé, “Ọ̀wọ̀ Festu Ológo Jù Lọ,[a] orí mi kò dàrú; kàkà bẹ́ẹ̀, ọ̀rọ̀ òtítọ́ àti ti ìrònú tí ó péye ni mò ń sọ.”[b]
  to: Ṣùgbọ́n Paulu wí pé, “Festu ọlọ́lá jùlọ,[a] orí mi kò dàrú; kàkà bẹ́ẹ̀, ọ̀rọ̀ òtítọ́ àti ìrònú tí ó bọ́gbọ́n mu ni mo ń sọ.”[b]
  rationale: The revision replaces an unnatural honorific with an idiomatic formal vocative and refines the rendering of σωφροσύνη to express sound-minded judgment in the immediate context. It otherwise preserves the draft's faithful structure, register, and meaning.
