source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: yo
  text: Ṣùgbọ́n Paulu wí pé, “Festu ọlọ́lá jùlọ,[a] orí mi kò dàrú; kàkà bẹ́ẹ̀, ọ̀rọ̀ òtítọ́ àti ìrònú tí ó bọ́gbọ́n mu ni mo ń sọ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọlọ́lá jùlọ” jẹ́ oyè ìfọ̀wọ̀ fún aláṣẹ gíga.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ọ̀rọ̀ òtítọ́ àti ìwà-ọkàn pípé” tàbí “ọ̀rọ̀ òtítọ́ àti ìfòyemọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwà ọkàn tí ó lójú òtítọ́, ìkóra-ẹni-níjàánu, tàbí ìrònú tí ó dáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìdáhùn Paulu tako ẹ̀sùn Festu nínú ẹsẹ tó ṣáájú hàn ní èdè Yorùbá àdánidá.
- source_word: μαίνομαι
  choice: orí mi kò dàrú
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí wèrè tàbí pé èrò ẹni kò dúró; gbólóhùn yìí jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere láìlo ọ̀rọ̀ ẹ̀gàn.
- source_word: φησίν
  choice: wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù ọ̀rọ̀ náà wà ní àkókò ìsinsìnyí, ó jẹ́ ìsinsìnyí ìtàn; àkókò tí ó ti kọjá ló bá ìtàn Yorùbá mu níbí.
- source_word: κράτιστε
  choice: Ọ̀wọ̀ ... Ológo Jù Lọ
  rationale: A pa ìkíni ọlá fún aláṣẹ gíga mọ́, ṣùgbọ́n a gbé e kalẹ̀ ní ọ̀nà tí olùkà Yorùbá lè lóye.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Ó pa ìtumọ̀ pé ọ̀rọ̀ Paulu ní ìwà òtítọ́ mọ́.
- source_word: σωφροσύνης
  choice: ìrònú tí ó péye
  rationale: Ó mú èrò ìyèkooro, ìkóra-ẹni-níjàánu àti ọpọlọ tí ó dúró ṣinṣin jáde, ní ìyàtọ̀ sí ẹ̀sùn pé orí Paulu dàrú.
- source_word: ῥήματα
  choice: ọ̀rọ̀
  rationale: Ìtumọ̀ tààrà tó bá ọ̀pọ̀ nǹkan tí Paulu ń sọ mu; ní Yorùbá, ‘ọ̀rọ̀’ lè dúró fún ẹyọ kan tàbí ọ̀pọ̀ láìsí àmì ọ̀pọ̀.
- source_word: ἀποφθέγγομαι
  choice: mò ń sọ
  rationale: Ó fi hàn pé Paulu ń sọ ọ̀rọ̀ jáde ní gbangba, láìfi agbára ìkéde tí ó ju ti orísun lọ kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún olùkà òde òní. A lo ‘orí mi kò dàrú’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún àìwèrè, a sì pa ọlá oyè Festu àti ààyè ìtumọ̀ σωφροσύνης mọ́ ní àkọ́lé ẹsẹ àti àlàyé ìsàlẹ̀.
