  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: yo
  text: ní pàtàkì nítorí pé o mọ gbogbo àṣà àti àwọn ọ̀ràn àríyànjiyàn láàárín àwọn Júù dáadáa.[a] Nítorí náà, mo bẹ̀ ọ́ pé kí o fi sùúrù fetí sí mi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àṣà àwọn Júù àti àwọn ọ̀ràn àríyànjiyàn wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo béèrè pé kí o”; ọ̀rọ̀ Gíríìkì náà ń fi ìbéèrè àtọkànwá hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: ní pàtàkì nítorí pé
  rationale: Ó fi ìdí pàtàkì tí Pọ́ọ̀lù fi ní ìgboyà láti sọ̀rọ̀ sí Ágrípà hàn, ó sì so gbólóhùn yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: γνώστην ὄντα σε
  choice: o mọ ... dáadáa
  rationale: Ọ̀rọ̀ yìí fi hàn pé Ágrípà ní ìmọ̀ tó jinlẹ̀ nípa àwọn nǹkan wọ̀nyí, láìsọ pé ó jẹ́ ògbóǹtarìgì ní ipò iṣẹ́ kan.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: gbogbo àṣà ... láàárín àwọn Júù
  rationale: “Láàárín àwọn Júù” pa ìtumọ̀ tí κατὰ Ἰουδαίους lè ní nípa ibi tàbí àgbègbè ọ̀ràn mọ́; “gbogbo àṣà àwọn Júù” tún ṣeé ṣe.
- source_word: τε καὶ
  choice: àti
  rationale: “Àti” so àwọn ẹ̀ka méjèèjì pọ̀ lọ́nà tó rọrùn, tó sì bá Yorùbá mu.
- source_word: ζητημάτων
  choice: àwọn ọ̀ràn àríyànjiyàn
  rationale: Ó túmọ̀ sí àwọn ọ̀ràn tí àwọn ènìyàn ń béèrè tàbí ń jiyàn lé lórí; yíyan yìí pa ìtumọ̀ ìforígbárí inú ọ̀rọ̀ náà mọ́ ní àyíká ẹjọ́.
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi àbájáde ìmọ̀ Ágrípà hàn gẹ́gẹ́ bí ìdí tí Pọ́ọ̀lù fi bẹ̀ ẹ́ pé kó fetí sí i.
- source_word: δέομαι
  choice: mo bẹ̀ ọ́
  rationale: Ó jẹ́ ẹ̀bẹ̀ àtọkànwá, ó lágbára ju “mo ní kí o” lọ, ṣùgbọ́n kò lọ dé “mo pàrọwà”.
- source_word: μακροθύμως
  choice: fi sùúrù
  rationale: Ó sọ irú ìfetísílẹ̀ tí Pọ́ọ̀lù ń béèrè fún—ìfetísílẹ̀ pẹ̀lú sùúrù àti ìfaradà.
- source_word: ἀκοῦσαί μου
  choice: fetí sí mi
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kí ẹnì kan tẹ́tí sí olùsọ̀rọ̀.
