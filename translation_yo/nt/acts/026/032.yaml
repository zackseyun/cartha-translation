source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: yo
  text: Àgírípà sì sọ fún Fẹ́sítù pé, “A lè ti tú ọkùnrin yìí sílẹ̀[a] bí kò bá ti rawọ ẹjọ́ sí Késárì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A lè ti dá ọkùnrin yìí sílẹ̀ bí kò bá ti rawọ ẹjọ́ sí Késárì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ó ń fi ìtẹ̀síwájú ìtàn àti ìyípadà sí ọ̀rọ̀ ìparí Àgírípà hàn ní Yorùbá àdánidá.
- source_word: ἔφη
  choice: sọ fún ... pé
  rationale: Bí ó tilẹ̀ jẹ́ ọ̀rọ̀-ìṣe aláìpé ní Gíríìkì, ó ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà àkọ́sọ lasan; èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti mú ẹni tí a bá sọ̀rọ̀ fún wọ inú gbólóhùn náà.
- source_word: Ἀπολελύσθαι
  choice: ti tú ... sílẹ̀
  rationale: Ó pa ìtumọ̀ ìtúsílẹ̀ mọ́ láì sọ ọ́ di ìdáláre ní ilé ẹjọ́, èyí tí yóò dín ìtumọ̀ Gíríìkì kù.
- source_word: ἐδύνατο
  choice: A lè ti
  rationale: Ó sọ àǹfààní kan ní ìgbà àtijọ́ tí kò wá ṣẹ ní Yorùbá àdánidá.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ọkùnrin yìí
  rationale: Ó pa ìtọ́kasí sí ọkùnrin pàtó kan àti agbára ọ̀rọ̀-atọ́ka οὗτος mọ́.
- source_word: εἰ μὴ
  choice: bí kò bá ti
  rationale: Ó fi ipò àròsọ tí kò ṣẹ hàn ní kedere, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń béèrè.
- source_word: ἐπεκέκλητο
  choice: fi ẹjọ́ rẹ̀ lọ ọ̀dọ̀
  rationale: Ní àyíká òfin Róòmù, ọ̀rọ̀ náà túmọ̀ sí fífi ẹjọ́ lọ sí ọ̀dọ̀ aláṣẹ gíga fún ìdájọ́; gbolohun yìí jẹ́ Yorùbá tó yé kedere fún ìpe ẹjọ́ bẹ́ẹ̀.
- source_word: Καίσαρα
  choice: Késárì
  rationale: A pa orúkọ oyè ìtàn àti òfin náà mọ́ dípò lílo àlàyé bí ‘ọba ilẹ̀ Róòmù.’
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ọ̀nà aláìsọ ẹni pàtó ‘A lè ti tú...’ láti mú àbájáde palolo Gíríìkì jáde lọ́nà Yorùbá àdánidá; àmì ohùn ni a fi sí àwọn orúkọ bí wọ́n ṣe wọ inú èdè Yorùbá.
