id: ACT.26.14
reference: Acts 26:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: yo
  text: Nígbà tí gbogbo wa ti ṣubú lulẹ̀, mo gbọ́ ohùn kan tí ń sọ fún mi ní èdè Hébérù[a] pé, “Sáùlù, Sáùlù, kí ni ìdí tí o fi ń ṣe inúnibíni sí mi? Ó ṣòro fún ọ láti ta ẹsẹ̀ sí àwọn ọ̀pá olójú ṣóńṣó[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe kí ó túmọ̀ sí “ní èdè Árámáíkì”; ní ti gidi, ọ̀rọ̀ Gíríìkì náà sọ pé “ní èdè tàbí ẹ̀ka èdè Hébérù.”
    reason: alternative_reading
  - marker: b
    text: 'Èyí jẹ́ òwe: ẹran tí ó bá ta ẹsẹ̀ sí ọ̀pá olójú ṣóńṣó tí a fi ń darí rẹ̀, ara rẹ̀ ni yóò fi ṣe léṣe. Ìtumọ̀ rẹ̀ ni pé títako ẹni tó ń sọ̀rọ̀ yìí yóò kàn mú ìpalára bá ẹni tó ń tako.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Nígbà tí gbogbo wa sì ti ṣubú lulẹ̀
  rationale: A genitive absolute is rendered as a natural Yoruba temporal clause. “Gbogbo wa” preserves πάντων ἡμῶν, while “ti ṣubú” presents the fall as completed before the hearing.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: mo gbọ́ ohùn kan tí ń sọ fún mi
  rationale: “Ohùn” denotes an articulate voice in this direct-speech context, and the relative construction is natural Yoruba while retaining that the speech was addressed to Paul.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ní èdè Hébérù
  rationale: This directly reflects the Greek designation rather than replacing it with the historically possible identification “Aramaic.”
- source_word: Σαοὺλ Σαούλ
  choice: Sáùlù, Sáùlù
  rationale: The familiar Yoruba form of the personal name is used, and its emphatic repetition is preserved.
- source_word: τί με διώκεις;
  choice: èé ṣe tí o fi ń ṣe inúnibíni sí mi?
  rationale: This is an idiomatic Yoruba question that preserves the ongoing hostile persecution expressed by the Greek present tense.
- source_word: σκληρόν σοι
  choice: Ó ṣòro fún ọ
  rationale: The impersonal force of σκληρόν and the dative of reference are expressed naturally without reducing the saying merely to physical pain.
- source_word: πρὸς κέντρα λακτίζειν
  choice: láti ta ẹsẹ̀ sí àwọn ọ̀pá olójú ṣóńṣó
  rationale: The concrete image of kicking against pointed animal-driving prods is retained instead of replacing the proverb with its inferred meaning.
theological_decisions:
- issue: Meaning of τῇ Ἑβραΐδι διαλέκτῳ
  choice: ní èdè Hébérù
  alternative: ní èdè Árámáíkì
  rationale: The main text follows the explicit Greek wording, while the possible first-century reference to Aramaic is noted without silently resolving the linguistic ambiguity.
- issue: Force of the proverb σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: Preserve the agricultural metaphor in the main text
  alternative: Paraphrase as “Àtakò rẹ yóò ṣe ọ́ ní ibi” (“Your resistance will harm you”)
  rationale: Retaining the metaphor preserves the vivid wording and theological tension; its conventional significance is explained in a note rather than inserted into the speech.
translation_notes:
  register: Standard Yoruba with full tone marks, using dignified but current syntax. “Ṣe inúnibíni sí” is broadly intelligible for persecution. The agricultural image is made concrete as “àwọn ọ̀pá olójú ṣóńṣó,” with the cultural implication supplied in a footnote. Footnote markers are placed after the phrases they actually annotate.
