  to: Nígbà tí gbogbo wa ti ṣubú lulẹ̀, mo gbọ́ ohùn kan tí ń sọ fún mi ní èdè Hébérù[a] pé, “Sáùlù, Sáùlù, kí ni ìdí tí o fi ń ṣe inúnibíni sí mi? Ó ṣòro fún ọ láti ta ẹsẹ̀ sí àwọn ọ̀pá olójú ṣóńṣó[b].”
