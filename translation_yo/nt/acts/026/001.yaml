base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: yo
  text: 'Nígbà náà ni Àgírípà sọ fún Pọ́ọ̀lù pé, “A fún ọ láàyè láti sọ̀rọ̀ ní ti ara rẹ̀[a].” Nígbà náà ni Pọ́ọ̀lù na ọwọ́ rẹ̀, ó sì gbèjà ara rẹ̀[b] pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti sọ̀rọ̀ fún ara rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìgbèjà ara ẹni ní ọ̀nà ìgbẹ́jọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Àgrípà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìlànà ìpè Yorùbá tí ó sún mọ́ orúkọ Gíríìkì.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níbí, δέ ń tẹ ìtàn náà síwájú; gbólóhùn yìí mú ìtẹ̀síwájú náà ṣe kedere ní Yorùbá.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: sọ fún Pọ́ọ̀lù pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti túmọ̀ ọ̀rọ̀ sísọ sí ẹnì kan.
- source_word: Ἐπιτρέπεταί σοι
  choice: A fún ọ láàyè
  rationale: Ó pa ìtumọ̀ ìyọ̀ǹda tí a fi fún Pọ́ọ̀lù mọ́, ó sì bá ọ̀rọ̀ ní ibi ìgbẹ́jọ́ mu.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: láti sọ̀rọ̀ ní ti ara rẹ
  rationale: Ó fi hàn pé Pọ́ọ̀lù lè sọ ọ̀rọ̀ nítorí ọ̀ràn tirẹ̀ tàbí ní ààbò ara rẹ̀, láì fi ìtumọ̀ òfin kún ọ̀rọ̀ náà ju bó ṣe yẹ lọ.
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó pa ìtẹ̀lé àkókò tí Gíríìkì sọ ní tààrà mọ́.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: na ọwọ́ rẹ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá ni èyí fún ìṣe ara náà, láì sọ pé irú àmì ọwọ́ pàtó kan ni.
- source_word: ἀπελογεῖτο
  choice: sọ ọ̀rọ̀ ààbò ara rẹ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí jíjẹ́rìí tàbí gbígbèjà ara ẹni ní ipò òfin; yíyan yìí dá agbára ọ̀rọ̀ ibi ìgbẹ́jọ́ náà dúró láì fi ìtumọ̀ ‘bẹ̀rẹ̀’ kún un.
