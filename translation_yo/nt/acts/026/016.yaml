review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the imperatives, the purpose of the appearance, the commissioning, and the appearance-language force of both ὤφθην and ὀφθήσομαί. However, «rí mi nínú rẹ̀» and «farahàn ọ́ nínú rẹ̀» do not naturally or clearly express the compressed Greek relative construction in Yoruba; the first is especially liable to mean seeing Jesus inside an object or matter. The supplied footnote rightly recognizes the syntactic difficulty, but the main text requires a safe, idiomatic correction.
  naturalness: '«Mo ṣe farahàn ọ́» lacks the required preposition sí in normal Yoruba usage: «mo farahàn sí ọ». Recasting the commission as «láti yàn ọ́ ṣe ìránṣẹ́ àti ẹlẹ́rìí» is also more natural than «láti yàn ọ́ sípò gẹ́gẹ́ bí…».'
  terminology: «Ìránṣẹ́» and «ẹlẹ́rìí» are suitable, accessible renderings of ὑπηρέτης and μάρτυς. «Farahàn sí» appropriately retains personal appearance/revelation language without specifying its mode.
  issues:
  - severity: medium
    issue: The phrases «ohun tí o ti rí mi nínú rẹ̀» and «ohun tí èmi yóò tún farahàn ọ́ nínú rẹ̀» are unnatural and semantically misleading in Yoruba.
    rationale: The Greek construction is compressed and syntactically difficult, but Yoruba nínú rẹ̀ (“in it/in them”) creates an unintended spatial sense and does not supply a clear antecedent. A natural wording should convey testimony concerning what Paul has seen in relation to Jesus and the future appearances, while a note records the more formal ambiguity.
  - severity: medium
    issue: «Mo ṣe farahàn ọ́» omits sí.
    rationale: 'With ẹni as the person to whom one appears, standard Yoruba normally uses «farahàn sí ẹni»: «mo farahàn sí ọ».'
  revised_text: 'Ṣùgbọ́n dìde, kí o sì dúró lórí ẹsẹ̀ rẹ; nítorí ète yìí ni mo ṣe farahàn sí ọ: láti yàn ọ́ ṣe ìránṣẹ́ àti ẹlẹ́rìí nípa ohun tí o ti rí nípa mi àti nípa ohun tí èmi yóò tún farahàn sí ọ.[a]'
  revised_footnotes:
  - marker: a
    text: 'Gbólóhùn Gíríìkì náà kúkúrú, ìbáṣepọ̀ àwọn ọ̀rọ̀ rẹ̀ kò sì ṣe kedere pátápátá. Ní ọ̀nà tó sún mọ́ ọ̀rọ̀ rẹ̀, ó lè túmọ̀ sí: “nípa ohun tí o ti rí mi àti nípa ohun tí èmi yóò farahàn sí ọ nínú rẹ̀.”'
    reason: lexical_alternative
  revision_rationale: The revision adds sí after farahàn, removes the misleading nínú rẹ̀ constructions from the main text, and uses idiomatic Yoruba for formal appointment. The revised main text follows the sense reflected in the English audit trail without asserting more than the Greek warrants; the footnote retains the compressed formal construction and its ambiguity.
