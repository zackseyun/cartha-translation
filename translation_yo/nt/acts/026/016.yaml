revisions:
- from: 'Ṣùgbọ́n dìde, kí o sì dúró lórí ẹsẹ̀ rẹ; nítorí ète yìí ni mo ṣe farahàn ọ́: láti yàn ọ́ sípò gẹ́gẹ́ bí ìránṣẹ́ àti ẹlẹ́rìí, nípa ohun tí o ti rí mi nínú rẹ̀ àti ohun tí èmi yóò tún farahàn ọ́ nínú rẹ̀,[a]'
  to: 'Ṣùgbọ́n dìde, kí o sì dúró lórí ẹsẹ̀ rẹ; nítorí ète yìí ni mo ṣe farahàn sí ọ: láti yàn ọ́ ṣe ìránṣẹ́ àti ẹlẹ́rìí nípa ohun tí o ti rí nípa mi àti nípa ohun tí èmi yóò tún farahàn sí ọ.[a]'
  rationale: The revision adds sí after farahàn, removes the misleading nínú rẹ̀ constructions from the main text, and uses idiomatic Yoruba for formal appointment. The revised main text follows the sense reflected in the English audit trail without asserting more than the Greek warrants; the footnote retains the compressed formal construction and its ambiguity.
  reviewer_model: gpt-5.6-terra
