id: ACT.26.16
reference: Acts 26:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: yo
  text: 'Ṣùgbọ́n dìde, kí o sì dúró lórí ẹsẹ̀ rẹ; nítorí ète yìí ni mo ṣe farahàn sí ọ: láti yàn ọ́ ṣe ìránṣẹ́ àti ẹlẹ́rìí nípa ohun tí o ti rí nípa mi àti nípa ohun tí èmi yóò tún farahàn sí ọ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gbólóhùn Gíríìkì náà kúkúrú, ìbáṣepọ̀ àwọn ọ̀rọ̀ rẹ̀ kò sì ṣe kedere pátápátá. Ní ọ̀nà tó sún mọ́ ọ̀rọ̀ rẹ̀, ó lè túmọ̀ sí: “nípa ohun tí o ti rí mi àti nípa ohun tí èmi yóò farahàn sí ọ nínú rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: dìde
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè ìgbésẹ̀ lẹ́sẹ̀kẹsẹ̀; “dìde” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká náà mu.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: dúró lórí ẹsẹ̀ rẹ
  rationale: Èyí pa àwòrán àṣẹ ara tó wà nínú Gíríìkì mọ́, ó sì jẹ́ gbólóhùn àdánidá ní Yorùbá.
- source_word: εἰς τοῦτο γὰρ
  choice: nítorí ète yìí
  rationale: Ó fi hàn pé ohun tó tẹ̀ lé e ni ète ìfarahàn náà, láì sọ ọ́ di ìdí lásán.
- source_word: ὤφθην σοι
  choice: mo ṣe farahàn ọ́
  rationale: Fáàbù náà jẹ́ ọ̀rọ̀ ìfarahàn; ìtumọ̀ yìí pa ìfarahàn ẹni náà mọ́ dípò yíyí i sí ìrírí inú ọkàn lásán.
- source_word: προχειρίσασθαί σε
  choice: láti yàn ọ́ sípò
  rationale: Ó ṣàfihàn yíyàn ẹni fún iṣẹ́ tàbí ipò kan, kì í ṣe yíyan láàárín àwọn ènìyàn lásán.
- source_word: ὑπηρέτην
  choice: ìránṣẹ́
  rationale: “Ìránṣẹ́” jẹ́ ọ̀rọ̀ tó rọrùn fún gbogbo ènìyàn, ó sì ṣàfihàn ẹni tó ń ṣiṣẹ́ lábẹ́ àṣẹ ẹlòmíràn láì fi oyè ṣọ́ọ̀ṣì kún un.
- source_word: μάρτυρα
  choice: ẹlẹ́rìí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó péye fún ẹni tó ń jẹ́rìí sí ohun tó rí tàbí tó mọ̀.
- source_word: ὧν τε εἶδές με
  choice: nípa ohun tí o ti rí mi nínú rẹ̀
  rationale: Gbólóhùn Gíríìkì náà kúkúrú, ó sì ní ìṣòro ìbáṣepọ̀; ìtumọ̀ yìí dúró sún mọ́ ìṣètò rẹ̀, ó sì pa “mi” mọ́ gẹ́gẹ́ bí ẹni tí Pọ́ọ̀lù rí.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: àti ohun tí èmi yóò tún farahàn ọ́ nínú rẹ̀
  rationale: Ó pa ìfarahàn ọjọ́ iwájú àti ìbáṣepọ̀ rẹ̀ pẹ̀lú iṣẹ́ ẹlẹ́rìí mọ́, láì túmọ̀ rẹ̀ sí “ohun tí èmi yóò fi hàn ọ́.”
theological_decisions:
- issue: Ìwà ìṣípayá inú ὤφθην àti ὀφθήσομαί
  choice: 'Túmọ̀ àwọn méjèèjì pẹ̀lú ọ̀rọ̀ ìfarahàn: “mo ṣe farahàn ọ́” àti “èmi yóò tún farahàn ọ́.”'
  alternative: “O rí mi / ìwọ yóò rí mi,” tàbí “mo fi ara mi hàn / èmi yóò fi ara mi hàn.”
  rationale: Èyí pa agbára ọ̀rọ̀ Gíríìkì mọ́ pé Jésù fúnra rẹ̀ farahàn láti rán Pọ́ọ̀lù, láì pinnu bí ìfarahàn náà ṣe ṣẹlẹ̀.
- issue: Ìtumọ̀ ìbáṣepọ̀ nínú ὧν ... ὧν
  choice: Pa ìṣètò tó há pọ̀ mọ́ nípasẹ̀ “ohun tí ... nínú rẹ̀,” kí àìdánilójú Gíríìkì má bàa parẹ́.
  alternative: “nípa ohun tí o ti rí nípa mi àti ohun tí èmi yóò fi hàn ọ́.”
  rationale: Àṣàyàn míràn rọrùn sí i, ṣùgbọ́n ó lè pinnu ìtumọ̀ ìbáṣepọ̀ tí Gíríìkì fúnra rẹ̀ kò sọ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. “Gẹ́gẹ́ bí” ń ṣàlàyé ipò iṣẹ́ náà, nígbà tí “ìránṣẹ́” yẹra fún ìtumọ̀ oyè ṣọ́ọ̀ṣì.
