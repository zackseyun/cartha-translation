source:
  edition: SBLGNT
  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: yo
  text: Lórí ọ̀ràn yìí[a], bí mo ti ń lọ sí Damásíkù pẹ̀lú àṣẹ àti iṣẹ́ tí àwọn olórí àlùfáà gbé lé mi lọ́wọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní tààràtà, “Nínú àwọn nǹkan wọ̀nyí,” èyí tó ń tọ́ka sẹ́yìn sí àwọn ìṣe àti ète Pọ́ọ̀lù tí ó sọ ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Lórí ọ̀ràn yìí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sẹ́yìn sí àwọn ìṣe àti ète Pọ́ọ̀lù tí ó ṣẹ̀ṣẹ̀ sọ. Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́kasí náà mọ́ láì fi ìtumọ̀ ‘iṣẹ́ àkànṣe’ kún un.
- source_word: πορευόμενος
  choice: bí mo ti ń lọ
  rationale: Ó fi hàn pé ìrìn àjò náà ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ tí Pọ́ọ̀lù fẹ́ sọ lẹ́yìn èyí; gbólóhùn yìí sì bá ìtẹ̀síwájú sí ẹsẹ tó tẹ̀ lé e mu.
- source_word: εἰς τὴν Δαμασκὸν
  choice: sí Damásíkù
  rationale: ‘Sí’ ni ọ̀nà Yorùbá tó ṣe déédé jù lọ fún ibi tí ẹni ń lọ.
- source_word: μετ’ ἐξουσίας
  choice: pẹ̀lú àṣẹ
  rationale: Nínú àyíká yìí, ἐξουσία túmọ̀ sí ẹ̀tọ́ tàbí agbára tí àwọn aláṣẹ fi fún un, kì í ṣe agbára lásán.
- source_word: ἐπιτροπῆς
  choice: iṣẹ́ tí ... gbé lé mi lọ́wọ́
  rationale: Àpèjúwe yìí sọ iṣẹ́ tí a fi lé ẹnì kan lọ́wọ́ lọ́nà Yorùbá tó ṣe kedere, ó sì yẹra fún fífi àwọ̀ ológun tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τῆς τῶν ἀρχιερέων
  choice: tí àwọn olórí àlùfáà gbé lé mi lọ́wọ́
  rationale: Ó fi àwọn olórí àlùfáà hàn gẹ́gẹ́ bí orísun àṣẹ àti iṣẹ́ náà, bó tilẹ̀ jẹ́ pé èdè Gíríìkì lo àpólà oníhun.
- source_word: ἀρχιερέων
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí ẹgbẹ́ àwọn aṣáájú àlùfáà Júù, kì í ṣe ọ̀pọ̀ ẹni tí gbogbo wọn ń di ipò olórí àlùfáà kan náà mú lẹ́ẹ̀kan náà.
