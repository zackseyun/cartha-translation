  source_fidelity: Ìtumọ̀ náà ń pa ìtumọ̀ Ἐν οἷς mọ́ gẹ́gẹ́ bí ìtọ́kasí sí ohun tí Pọ́ọ̀lù ti sọ ṣáájú, ó sì túmọ̀ πορευόμενος, εἰς τὴν Δαμασκὸν, μετ’ ἐξουσίας καὶ ἐπιτροπῆς, àti orísun wọn láti ọ̀dọ̀ àwọn ἀρχιερέων ní òtítọ́. Kọ́mà òpin tún bá ìtẹ̀síwájú gbólóhùn náà nínú ẹsẹ tó tẹ̀ lé e mu.
  naturalness: “Lórí ọ̀ràn yìí” jẹ́ ọ̀nà Yorùbá ìgbàlódé tó dára fún ìsọ̀rọ̀ asopò náà. “Bí mo ti ń lọ sí Damásíkù” àti “pẹ̀lú àṣẹ àti iṣẹ́ tí àwọn olórí àlùfáà gbé lé mi lọ́wọ́” jẹ́ gbólóhùn tó ye ẹni tí ó sì bójú mu nínú ìforúkọsílẹ̀ Bíbélì òde òní.
  terminology: “Àṣẹ” yẹ fún ἐξουσία nínú àyíká àṣẹ tí a fàṣẹ sí, “iṣẹ́ tí ... gbé lé mi lọ́wọ́” ń sọ ἐπιτροπή, ìyẹn iṣẹ́/ìfìṣẹ́ tí a fi lé ẹni lọ́wọ́, ní kedere. “Àwọn olórí àlùfáà” jẹ́ ọ̀rọ̀ tó pé fún ἀρχιερεῖς ní ọ̀rọ̀ ìṣàkóso Júù àkókò náà.
