source:
  edition: SBLGNT
  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: yo
  text: Nígbà náà, ọba, gómìnà náà, Bẹ́níké,[a] àti àwọn tí wọ́n jókòó pẹ̀lú wọn dìde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bẹ́níké: a tún lè kọ ọ́ sí “Bẹ́rẹ́níké.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: dìde
  rationale: Ọ̀rọ̀ náà tọ́ka sí pé ọba dìde níbi tí ó jókòó; “dìde” jẹ́ ọ̀nà àdánidá, ṣókí, tí ó sì yẹ fún àyíká ìpéjọ́ ọlọ́lá.
- source_word: τε
  choice: Nígbà náà ni
  rationale: Patíkù náà so ìṣe yìí mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì ń mú ìtàn tẹ̀ síwájú; “Nígbà náà ni” mú ìtẹ̀sí ìtàn náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ὁ βασιλεὺς
  choice: ọba
  rationale: βασιλεύς túmọ̀ sí ọba. Bí ó tilẹ̀ jẹ́ pé Agripa ni a ń tọ́ka sí, orísun náà lo oyè rẹ̀, nítorí náà a pa oyè náà mọ́.
- source_word: ὁ ἡγεμὼν
  choice: baálẹ̀
  rationale: Nínú àyíká Ìṣe Àwọn Àpọ́sítélì, ἡγεμών jẹ́ olórí ìjọba agbègbè Róòmù; “baálẹ̀” jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tí ó yé ni fún irú aláṣẹ bẹ́ẹ̀.
- source_word: Βερνίκη
  choice: Bẹ́níké
  rationale: “Bẹ́níké” jẹ́ ìkọ̀wé orúkọ náà ní Yorùbá tí ó tẹ̀lé ìró Gíríìkì; àfọwọ́kọ míì wà nínú àlàyé ìsàlẹ̀.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: àwọn tí ó jókòó pẹ̀lú wọn
  rationale: Gbólóhùn náà túmọ̀ ní tààrà sí àwọn tí wọ́n jókòó pọ̀ pẹ̀lú wọn; yíyan yìí pa àwòrán ìjókòó pọ̀ mọ́ láì fi ipò àwùjọ tí orísun kò sọ kún un.
- source_word: καὶ
  choice: àti
  rationale: Àwọn καί tí a tún lò ń so àwọn ẹni àti ẹgbẹ́ tí a tò lẹ́sẹẹsẹ pọ̀; “àti” pa ìṣètò àfikún yẹn mọ́ ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo àkójọ “àti … àti … àti” láti pa ìṣọ̀kan àti ìtẹnumọ́ èdè Gíríìkì mọ́; àmì àlàyé [a] wà lẹ́yìn orúkọ tí ó kan.
