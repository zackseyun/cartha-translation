revisions:
- from: Nígbà náà ni ọba dìde, àti baálẹ̀, àti Bẹ́níké,[a] àti àwọn tí ó jókòó pẹ̀lú wọn.
  to: Nígbà náà, ọba, gómìnà náà, Bẹ́níké,[a] àti àwọn tí wọ́n jókòó pẹ̀lú wọn dìde.
  rationale: A rọ́pò “baálẹ̀” pẹ̀lú “gómìnà náà” láti ṣàfihàn ἡγεμών gẹ́gẹ́ bí gómìnà agbègbè Róòmù. A tún ṣètò gbólóhùn náà kí “dìde” lè kan ọba, gómìnà, Bẹ́níké, àti gbogbo àwọn tó jókòó pẹ̀lú wọn ní kedere. Àmì àlàyé àti ìtumọ̀ orúkọ ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà: gbogbo ọba, gómìnà, Bẹ́níké, àti àwọn tó jókòó pẹ̀lú wọn ni wọ́n dìde. Ṣùgbọ́n “baálẹ̀” kò pé fún ἡγεμών nínú àyíká alákòóso agbègbè Róòmù; ó máa ń tọ́ka sí olórí ìlú tàbí ìbílẹ̀ ní Yorùbá.'
  naturalness: Àtúnṣe ìṣètò gbólóhùn náà ń jẹ́ kó hàn gbangba ní Yorùbá pé ọ̀rọ̀-ìṣe “dìde” kan gbogbo àwọn tí a dárúkọ, kì í ṣe ọba nìkan. “Gómìnà náà” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣeé lóye, tí ó sì bá àyíká mu.
  terminology: “Ọba” yẹ fún βασιλεύς. “Gómìnà náà” yẹ fún ὁ ἡγεμών nínú ìtàn Ìṣe Àwọn Àpọ́sítélì. “Bẹ́níké” ni a pa mọ́ gẹ́gẹ́ bí ìkọ̀wé orúkọ tí a yàn, pẹ̀lú àlàyé ìyàtọ̀ ìkọ̀wé.
  issues:
  - severity: medium
    issue: “Baálẹ̀” fún ὁ ἡγεμών
    rationale: Baálẹ̀ sábà máa ń túmọ̀ sí olórí ìlú/ìbílẹ̀, kò sì ṣàfihàn gómìnà Róòmù kan dáadáa. “Gómìnà” jẹ́ ìbámu tó péye sí ipò Fẹ́ẹ́sítù nínú àyíká ẹsẹ̀ yìí.
  - severity: low
    issue: Ìṣètò gbólóhùn le jẹ́ kí ó dà bí ẹni pé ọba nìkan ló dìde
    rationale: Nípa fífi “dìde” lẹ́yìn àkójọ gbogbo àwọn kókó-ọrọ̀, Yorùbá ń sọ ìbámu ọ̀rọ̀-ìṣe náà pẹ̀lú gbogbo ẹgbẹ́ náà ní kedere, gẹ́gẹ́ bí Gíríìkì.
  revised_text: Nígbà náà, ọba, gómìnà náà, Bẹ́níké,[a] àti àwọn tí wọ́n jókòó pẹ̀lú wọn dìde.
