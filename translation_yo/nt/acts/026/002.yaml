id: ACT.26.2
reference: Acts 26:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: yo
  text: Ní ti gbogbo ohun tí àwọn Júù fi ń fẹ̀sùn kàn mí, Ọba Agripa, mo ka ara mi sí ẹni oríire[a], nítorí pé mo fẹ́ ṣe àwíjàre mi níwájú rẹ lónìí,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “alábùkún”; níbí, ó ṣeé ṣe kí ìtumọ̀ náà jẹ́ “ẹni oríire” tàbí ẹni tí ó ní àǹfààní pàtàkì, nítorí àǹfààní láti ṣe àwíjàre rẹ̀ níwájú Agripa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: Ní ti gbogbo ohun tí
  rationale: “Ní ti” fi kókó ọ̀rọ̀ hàn gẹ́gẹ́ bí περί pẹ̀lú ẹ̀yà ọ̀rọ̀ oníhun, ó sì jẹ́ Yorùbá àdánidá; “gbogbo ohun tí” pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú gbólóhùn ẹ̀sùn.
- source_word: ἐγκαλοῦμαι
  choice: fi ń fẹ̀sùn kàn mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé a ń fi ẹ̀sùn òfin kan ẹni; ó tún pa ìtumọ̀ ìṣe tí a ṣe sí Paulu mọ́.
- source_word: ὑπὸ Ἰουδαίων
  choice: àwọn Júù
  rationale: A lo “àwọn Júù” gẹ́gẹ́ bí olùṣe ẹ̀sùn náà. Nínú àyíká ọ̀rọ̀, ó tọ́ka sí àwọn Júù tó ń fẹ̀sùn kan Paulu, kì í ṣe gbogbo ènìyàn Júù láìyọ ẹnikẹ́ni sílẹ̀.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Ọba Agrippa
  rationale: Ó pa oyè àti ìpè tààrà sí Agrippa mọ́ ní èdè Yorùbá tó bá òde òní mu.
- source_word: ἥγημαι ἐμαυτὸν
  choice: mo ka ara mi sí
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ “mo gbà pé ara mi jẹ́” àti ìtọ́kasí ẹni fúnra rẹ̀ mọ́ lọ́nà àdánidá.
- source_word: μακάριον
  choice: ẹni oríire
  rationale: Nínú àyíká ìgbẹ́jọ́ yìí, “ẹni oríire” fi hàn pé Paulu rí àǹfààní ńlá nínú fífi ọ̀rọ̀ rẹ̀ hàn níwájú Agrippa, láìfi dandan sọ pé ìbùkún ẹ̀sìn ni.
- source_word: ἐπὶ σοῦ
  choice: níwájú rẹ
  rationale: Ó bá ìtumọ̀ fífarahàn níwájú ẹni kan nínú ìgbẹ́jọ́ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μέλλων
  choice: mo máa
  rationale: Pẹ̀lú “lónìí” àti àyíká ìgbẹ́jọ́ tó ń bẹ lọ́wọ́, “mo máa” sọ ìṣe tó fẹ́ ṣẹlẹ̀ ní kété yìí lọ́nà Yorùbá àdánidá, láìfi ìtumọ̀ ìfẹ́-ọkàn kún un.
- source_word: σήμερον
  choice: lónìí
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ jù lọ, fún σήμερον.
- source_word: ἀπολογεῖσθαι
  choice: sọ̀rọ̀ láti gbèjà ara mi
  rationale: Ó mú agbára ọ̀rọ̀ ilé-ẹjọ́ náà jáde pé Paulu yóò sọ ọ̀rọ̀ àwíjàre tirẹ̀, kì í ṣe pé yóò dáàbò bo ara rẹ̀ nípa ti ara.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ μακάριον nínú àyíká yìí
  choice: ẹni oríire
  alternative: ẹni ìbùkún; aláyọ̀
  rationale: “Ẹni oríire” bá àǹfààní fífi àwíjàre hàn níwájú Agrippa mu. “Ẹni ìbùkún” lè mú kí ọ̀rọ̀ náà dà bí àsọyé ẹ̀kọ́ ìsìn tó lágbára ju ohun tí àyíká ń béèrè lọ, nígbà tí “aláyọ̀” lè dà bí ìmọ̀lára lasán.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó bójú mu, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “fi ń fẹ̀sùn kàn mí” àti “sọ̀rọ̀ láti gbèjà ara mi” láti mú àyíká ilé-ẹjọ́ hàn kedere. A kọ “àwọn Júù” gẹ́gẹ́ bí àwọn olùfẹ̀sùn nínú àyíká náà, kì í ṣe gẹ́gẹ́ bí ẹ̀sùn sí gbogbo Júù.
