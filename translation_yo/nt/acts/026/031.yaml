translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a lo ‘ẹ̀wọ̀n’ nínú ẹsẹ̀, a sì fi ìtumọ̀ gangan hàn nínú àlàyé ìsàlẹ̀.
