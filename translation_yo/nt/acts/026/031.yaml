language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n kúrò, wọ́n ń bá ara wọn sọ̀rọ̀ pé, “Ọkùnrin yìí kò ń ṣe ohunkóhun tó yẹ fún ikú tàbí ẹ̀wọ̀n.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tó yẹ fún ikú tàbí ẹ̀wọ̀n irin.” Ọ̀rọ̀ Gíríìkì náà, δεσμῶν, túmọ̀ ní tààrà sí “ìdè” tàbí “ẹ̀wọ̀n irin,” ṣùgbọ́n níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí ìdálẹ́wọ̀n tàbí àhámọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Lẹ́yìn tí wọ́n sì kúrò níbẹ̀
  rationale: Ọ̀rọ̀ ìṣe aláìṣe-parí aorist yìí fi hàn pé wọ́n kọ́kọ́ kúrò ní ibi ìgbọ́jọ́ gbangba náà kí wọ́n tó bẹ̀rẹ̀ sí í bá ara wọn sọ̀rọ̀; ‘kúrò níbẹ̀’ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐλάλουν
  choice: wọ́n ń bá ara wọn sọ̀rọ̀
  rationale: Àkókò imperfect tọ́ka sí ìjíròrò tó ń lọ, kì í ṣe ọ̀rọ̀ ẹyọ kan ṣoṣo; àmì ‘ń’ pa ìtumọ̀ tí ìṣe náà ń bá a lọ mọ́.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìjíròrò láàárín àwọn tó wà níbẹ̀ hàn.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú àyíká yìí, ‘pé’ ni ọ̀nà Yorùbá tó ṣe rẹ́gí láti ṣàgbékalẹ̀ ohun tí wọ́n sọ, láìfi àsọtúnsọ tí kò pọn dandan kún un.
- source_word: Οὐδὲν ... ἄξιον
  choice: kò ṣe ohunkóhun tó yẹ
  rationale: Ìtumọ̀ rẹ̀ ni pé kò sí ohun tí ọkùnrin náà ṣe tó yẹ fún àwọn ìjìyà tí a dárúkọ; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: θανάτου ἢ δεσμῶν
  choice: fún ikú tàbí ẹ̀wọ̀n
  rationale: ‘Ikú’ ń tọ́ka sí ìdájọ́ ikú ní àyíká òfin, ‘ẹ̀wọ̀n’ sì sọ ìtumọ̀ ìdálẹ́wọ̀n δεσμῶν di mímọ̀ fún òǹkàwé òde òní; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ‘ẹ̀wọ̀n irin’ mọ́.
- source_word: τι πράσσει
  choice: ṣe ohunkóhun
  rationale: πράσσει sọ ní gbogbogbòò nípa ohun tí Pọ́ọ̀lù ń ṣe tàbí ti ṣe; ‘ṣe’ kò fi ìtumọ̀ ìwà ọ̀daràn tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó tọ́ka sí Pọ́ọ̀lù ní pàtó, ó sì pa akọ akọ tí ọ̀rọ̀ Gíríìkì náà lò mọ́.
