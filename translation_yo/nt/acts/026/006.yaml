source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: yo
  text: Báyìí, mo dúró lábẹ́ ìdájọ́ nítorí ìrètí ìlérí tí Ọlọ́run ṣe fún àwọn baba wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn baba ńlá wa.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn baba wa,” ó sì ń tọ́ka sí àwọn baba ìpilẹ̀ Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Àti nísinsìnyí
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́, ó sì fi ìyípadà sí ipò Paulu lọ́wọ́lọ́wọ́ hàn ní Yorùbá àdánidá.
- source_word: ἐπ’ ἐλπίδι
  choice: nítorí ìrètí
  rationale: ἐπί pẹ̀lú dátífù níbí ń tọ́ka sí ìdí tàbí ìpìlẹ̀ ìdájọ́ náà; “nítorí ìrètí” sọ ìtumọ̀ yìí ní kedere.
- source_word: ἐπαγγελίας
  choice: ìlérí
  rationale: “Ìlérí” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ohun tí Ọlọ́run ṣèlérí, ó sì pa ìbáṣepọ̀ jenitífù pẹ̀lú “ìrètí” mọ́.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: ìlérí ... fún àwọn baba wa
  rationale: “Fún” fi àwọn tí ìlérí náà tọ̀ sí hàn lọ́nà Yorùbá tó ṣe déédéé, láìfi àlàyé míì kún un.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: tí Ọlọ́run ṣe
  rationale: Ó pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe ìlérí náà, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: πατέρας ἡμῶν
  choice: àwọn baba wa
  rationale: Ó tẹ̀ lé akọ púpọ̀ Gíríìkì, ó sì bá ọ̀rọ̀ májẹ̀mú nípa àwọn baba Ísírẹ́lì mu; àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
- source_word: ἕστηκα
  choice: mo dúró
  rationale: Pípé Gíríìkì ní agbára ipò ìsinsìnyí níbí; “mo dúró” jẹ́ ọ̀nà Yorùbá tó yẹ fún ẹni tó wà níwájú ilé ẹjọ́.
- source_word: κρινόμενος
  choice: ní ìdájọ́
  rationale: Ó fi ipò ìgbẹ́jọ́ Paulu hàn lọ́nà kúkúrú àti àdánidá, dípò ìtumọ̀ líle bí “a ń ṣe ìdájọ́ mi.”
theological_decisions:
- issue: Ta ni “àwọn baba wa” ń tọ́ka sí?
  choice: Àwọn baba ńlá Ísírẹ́lì tí ó ní í ṣe pẹ̀lú májẹ̀mú
  alternative: Àwọn baba ńlá gbogbo àwọn Júù lápapọ̀
  rationale: Nínú ọ̀rọ̀ Paulu níwájú Agrippa, gbólóhùn náà rántí ìtàn májẹ̀mú Ísírẹ́lì àti àwọn tí Ọlọ́run fún ní ìlérí. A pa “àwọn baba wa” mọ́ nínú ẹsẹ̀ láìyanjú ààlà ìtọ́kasí náà ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ní ìdájọ́” fún àyíká ilé ẹjọ́, a sì pa ìṣọ̀kan “ìrètí ìlérí” mọ́ kí a má bà a yí ìbáṣepọ̀ Gíríìkì padà sí “ìrètí nínú ìlérí.”
