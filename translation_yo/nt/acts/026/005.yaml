  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: yo
  text: Wọ́n ti mọ̀ mí láti ìbẹ̀rẹ̀[a], bí wọ́n bá fẹ́ jẹ́rìí, pé mo gbé ìgbésí ayé mi gẹ́gẹ́ bí Farisí, ní ìbámu pẹ̀lú ẹ̀ya ìsìn wa tí ó muna jù lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ìṣáájú,” tàbí “láti ìgbà pípẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì αἵρεσις níhìn-ín túmọ̀ sí “ẹ̀ya” tàbí “ẹgbẹ́,” kì í ṣe “ẹ̀kọ́ èké” ní ìtumọ̀ pàtó tó wáyé lẹ́yìn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: Wọ́n ti mọ̀ mí
  rationale: Ó fi ìmọ̀ tí wọ́n ní nípa Pọ́ọ̀lù láti ìgbà àtijọ́ hàn, tí ó sì ń bá a dé àsìkò ọ̀rọ̀ rẹ̀.
- source_word: ἄνωθεν
  choice: láti ìbẹ̀rẹ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí láti ìgbà ìṣáájú tàbí láti ìbẹ̀rẹ̀, kì í ṣe ‘láti òkè.’
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: bí wọ́n bá fẹ́ jẹ́rìí
  rationale: θέλωσι tẹnumọ́ ìfẹ́-inú wọn, μαρτυρεῖν sì jẹ́ èdè ẹ̀rí tó bá ipò ìgbẹ́jọ́ mu.
- source_word: ἀκριβεστάτην
  choice: tí ó le koko jù lọ
  rationale: Ó jẹ́ ọ̀rọ̀ afiwéra gíga tó ṣàpèjúwe bí ẹ̀ya Farisí ṣe muna gan-an nínú ìlànà ìsìn.
- source_word: αἵρεσιν
  choice: ẹ̀ya
  rationale: Níhìn-ín ó ń tọ́ka sí ẹgbẹ́ tàbí ẹ̀ka kan nínú ẹ̀sìn Júù, kì í ṣe ẹ̀kọ́ èké ní ìtumọ̀ ìmọ̀-ẹ̀sìn tó wáyé lẹ́yìn náà.
- source_word: θρησκείας
  choice: ìsìn
  rationale: Ó tọ́ka sí ẹ̀sìn Júù gẹ́gẹ́ bí odindi nínú ọ̀rọ̀ ìtàn àti ìgbẹ́jọ́ yìí.
- source_word: ἔζησα Φαρισαῖος
  choice: mo gbé ìgbésí ayé mi gẹ́gẹ́ bí Farisí
  rationale: Ìtumọ̀ yìí sọ ìṣe ìgbésí ayé Pọ́ọ̀lù àti ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí Farisí ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ αἵρεσις nínú àyíká ìtàn àwọn Júù
  choice: ẹ̀ya
  alternative: ẹ̀kọ́ èké; ẹgbẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn Farisí gẹ́gẹ́ bí ẹgbẹ́ kan tí a mọ̀ nínú ẹ̀sìn Júù. ‘Ẹ̀kọ́ èké’ yóò fi ìtumọ̀ ẹ̀sìn tó wáyé lẹ́yìn náà kún ẹsẹ̀ náà láìní ẹ̀rí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ẹ̀ya ìsìn wa’ ṣe kedere fún òǹkàwé lasán, ‘le koko jù lọ’ sì sọ ìmúná Farisí ní ọ̀nà àdánidá.
