source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: yo
  text: Èyí tí àwọn ẹ̀yà wa méjìlá ń retí láti dé, bí wọ́n ṣe ń sin Ọlọ́run[b] pẹ̀lú ìtara ní òru àti ní ọ̀sán. Nípa ìrètí yìí ni àwọn Júù[c] fi ń fẹ̀sùn kàn mí, ìwọ ọba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn wa tí wọ́n jẹ́ ẹ̀yà méjìlá.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ ọ̀rọ̀ àkójọpọ̀ tí ń tọ́ka sí Ísírẹ́lì gẹ́gẹ́ bí ènìyàn ẹ̀yà méjìlá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jọ́sìn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí iṣẹ́ ìsìn ẹ̀sìn tàbí ìjọsìn tí a fi fún Ọlọ́run.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ènìyàn Júù.” Ní àyíká ẹjọ́ yìí, ọ̀rọ̀ náà tọ́ka sí àwọn Júù tí wọ́n ń fẹ̀sùn kan Pọ́ọ̀lù, kì í ṣe gbogbo Júù lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: èyí tí ... láti dé ọ̀dọ̀ rẹ̀
  rationale: Ó pa ìtumọ̀ ìdarí sí ibi àfojúsùn mọ́, ó sì ń tọ́ka padà sí ìlérí tí ẹsẹ tó ṣáájú sọ.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: àwọn ẹ̀yà wa méjìlá
  rationale: Yorùbá fi ọ̀rọ̀ yìí sọ àwọn ẹ̀yà Ísírẹ́lì méjìlá lọ́nà àdánidá; àlàyé ìsopọ̀ wọn gẹ́gẹ́ bí odindi kan wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν ἐκτενείᾳ
  choice: fi ìtara
  rationale: Ó ṣàfihàn ìfọkànsìn tó jinlẹ̀ àti ìdúróṣinṣin láìlo èdè onímọ̀.
- source_word: νύκτα καὶ ἡμέραν
  choice: ní òru àti ní ọ̀sán
  rationale: Ó tẹ̀ lé ìtòlẹ́sẹẹsẹ Gíríìkì, ó sì dúró fún iṣẹ́ tí a ń ṣe láìsinmi.
- source_word: λατρεῦον
  choice: sin Ọlọ́run
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí iṣẹ́ ìsìn tàbí ìjọsìn tí a fi fún Ọlọ́run; fífi Ọlọ́run hàn ṣe ìtumọ̀ náà ṣe kedere ní Yorùbá.
- source_word: ἐλπίζει καταντῆσαι
  choice: ń retí láti dé ọ̀dọ̀ rẹ̀
  rationale: Ó mú èrò dídé ibi àfojúsùn tàbí rírí ohun tí a ń retí gbà jáde lọ́nà Yorùbá tó ṣe déédé.
- source_word: περὶ ἧς ἐλπίδος
  choice: Nítorí ìrètí yìí
  rationale: Ní àyíká ẹjọ́ yìí, περί lè tọ́ka sí ohun tí ẹjọ́ náà dá lé tàbí ohun tó fa ẹ̀sùn; yíyan ‘nítorí’ jẹ́ èdè Yorùbá àdánidá níbi yìí.
- source_word: ἐγκαλοῦμαι
  choice: ni ... fi ń fẹ̀sùn kàn mí
  rationale: Ó fi ìtumọ̀ ọ̀rọ̀ òfin ti ẹ̀sùn tí a ń kàn Pọ́ọ̀lù hàn ní kedere.
- source_word: ὑπὸ Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó túmọ̀ ẹgbẹ́ àwọn olùfisùn Júù tó wà nínú àyíká ẹjọ́, kì í ṣe gbogbo Júù láìsí ààlà.
- source_word: βασιλεῦ
  choice: ìwọ ọba
  rationale: Ó pa ìpè tààrà àti ọ̀wọ̀ tí Pọ́ọ̀lù fi ń bá Àgírípà sọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ohun tí λατρεῦον ń tọ́ka sí
  choice: sin Ọlọ́run
  alternative: sìn; jọ́sìn
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀ ‘Ọlọ́run’ ní tààrà nínú gbólóhùn Gíríìkì, àyíká ìfọkànsìn Ísírẹ́lì mú un dájú pé Ọlọ́run ni iṣẹ́ ìsìn náà ń lọ sí; èyí kò fi ẹ̀kọ́ tuntun kún un.
- issue: Ohun tí ìrètí náà jẹ́
  choice: A tọ́ka padà sí ìlérí inú ẹsẹ tó ṣáájú láìsọ àjíǹde ní tààrà níbí
  alternative: Ṣíṣe àjíǹde ní kedere nínú ẹsẹ yìí; tàbí mímú ìrètí náà di ohun gbogbogbòò
  rationale: Ẹsẹ yìí kò tún àkóónú ìlérí náà sọ; nítorí náà, ìtumọ̀ náà pa ìtọ́kasí àti ìfarapamọ́ ọ̀rọ̀ ìpilẹ̀ mọ́.
- issue: Ìtúmọ̀ περί nínú περὶ ἧς ἐλπίδος
  choice: Nítorí ìrètí yìí
  alternative: Nípa ìrètí yìí
  rationale: Àwọn méjèèjì ṣeé ṣe; ‘nítorí’ bá àyíká ìdí tí a fi ń fẹ̀sùn kan Pọ́ọ̀lù mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn tó sún mọ́ fọ́ọ̀mù Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; ‘ìwọ ọba’ jẹ́ ìpè ọ̀wọ̀ tó pa vocative Gíríìkì mọ́. Gbogbo àmì àlàyé [a], [b], àti [c] farahàn nínú ọ̀rọ̀ àkọ́kọ́.
