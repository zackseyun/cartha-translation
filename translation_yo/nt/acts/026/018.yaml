id: ACT.26.18
reference: Acts 26:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: yo
  text: láti la ojú wọn, kí wọn lè yí padà kúrò nínú òkùnkùn sí ìmọ́lẹ̀, àti láti abẹ́ àṣẹ Satani[a] sí Ọlọ́run, kí wọn lè gba ìdáríjì ẹ̀ṣẹ̀ àti ogún láàrín àwọn tí a ti sọ di mímọ́[b] nípa ìgbàgbọ́ nínú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘agbára Satani’ tàbí ‘ìṣàkóso Satani.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọlá-àṣẹ, agbára ìṣàkóso, tàbí agbègbè ìṣàkóso.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘láàrín àwọn tí a ti jẹ́ mímọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: láti la ojú wọn
  rationale: Ó pa àwòrán gidi ti líla ojú mọ́, èyí tí a lò nípa òye ẹ̀mí, láì fi ìtumọ̀ àlàyé kan rọ́pò rẹ̀.
- source_word: τοῦ ἐπιστρέψαι
  choice: kí wọn lè yí padà
  rationale: Ó fi ète hàn, ó sì pa èdè yíyípadà mọ́ láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó lágbára ju orísun lọ.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: kúrò nínú òkùnkùn sí ìmọ́lẹ̀
  rationale: Ó pa ìfiwéra òkùnkùn àti ìmọ́lẹ̀ mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: kúrò lábẹ́ àṣẹ Satani
  rationale: ‘Àṣẹ’ lè túmọ̀ sí agbára ìṣàkóso tàbí ọlá-àṣẹ; ‘lábaixo àṣẹ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ẹni wà ní abẹ́ ìṣàkóso Satani.
- source_word: ἐπὶ τὸν θεόν
  choice: sí Ọlọ́run
  rationale: Ó fi ìṣípo àti yíyí ìfaramọ́ sí Ọlọ́run hàn ní ṣókí.
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: kí wọn lè rí ... gbà
  rationale: ‘Rí ... gbà’ jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí a fi fúnni, ó sì tẹ̀síwájú nínú ète gbolohun náà.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: ìdáríjì ẹ̀ṣẹ̀
  rationale: Ó jẹ́ ìtumọ̀ kedere àti èdè Yorùbá tí ó wọ́pọ̀ fún ìdáríjì àwọn ẹ̀ṣẹ̀.
- source_word: κλῆρον
  choice: ogún
  rationale: Nínú àyíká ìgbàlà yìí, ọ̀rọ̀ náà tọ́ka sí ìpín ogún tí Ọlọ́run fi fún àwọn ènìyàn rẹ̀; ‘ogún’ mú ìtumọ̀ májẹ̀mú àti ọjọ́ iwájú yẹn jáde.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: láàrín àwọn tí a ti sọ di mímọ́
  rationale: 'Ó pa agbára ọ̀rọ̀-ìṣe aláìlèsọ pipe passive mọ́: a ti ṣe iṣẹ́ náà, ipò mímọ́ náà sì ń bá a lọ.'
- source_word: πίστει τῇ εἰς ἐμέ
  choice: nípa ìgbàgbọ́ nínú mi
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tí a fi sọ wọ́n di mímọ́, ó sì jẹ́ kí Jésù hàn kedere gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ náà dojú kọ.
theological_decisions:
- issue: Ìtumọ̀ πίστει τῇ εἰς ἐμέ
  choice: nípa ìgbàgbọ́ nínú mi
  alternative: nípasẹ̀ ìgbẹ́kẹ̀lé nínú mi
  rationale: Ilana náà sọ ẹni tí ìgbàgbọ́ dojú kọ ní kedere; kì í ṣe àkójọpọ̀ genitive pistis-Christou tí a ń jiyàn lé lórí. ‘Ìgbàgbọ́ nínú mi’ pa ọ̀rọ̀ ìsìn àti ìfọkànsìn sí Jésù mọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn.
- issue: Bí πίστει ṣe so mọ́ gbolohun náà
  choice: Ó so mọ́ ‘àwọn tí a ti sọ di mímọ́’
  alternative: Kí a ka a bí ohun tí ó so lọ́nà gbòòrò mọ́ gbígba ìdáríjì àti ogún
  rationale: Ipò ọ̀rọ̀ náà lẹ́gbẹ̀ẹ́ τοῖς ἡγιασμένοις àti article τῇ ṣe àtìlẹ́yìn fún pé ìgbàgbọ́ nínú Jésù ni a fi ṣàlàyé bí a ṣe sọ àwọn náà di mímọ́, bí ó tilẹ̀ jẹ́ pé ipa rẹ̀ lè kan gbogbo àbájáde ìgbàlà tí a mẹ́nu kàn.
translation_notes:
  register: A lo Yorùbá àgbàṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún níbi tí ó jẹ́ àdánidá. Gbolohun náà pa ìtẹ̀síwájú àwọn ète inú orísun Gíríìkì mọ́ nípa lílo ‘kí wọn lè,’ ṣùgbọ́n a tún ṣe é ní ọ̀nà tí ó rọrùn fún òǹkàwé Yorùbá òde òní. A gbé àmì àlàyé [a] sí ‘àṣẹ Satani’ àti [b] sí ‘sọ di mímọ́,’ ní ìbámu pẹ̀lú ohun tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
