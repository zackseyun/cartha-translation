id: ACT.26.4
reference: Acts 26:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: yo
  text: Ǹjẹ́, gbogbo àwọn Júù mọ bí mo ti ń gbé ayé mi[a] láti ìgbà èwe mi, èyí tí mo ti gbé láti ìbẹ̀rẹ̀ láàárín àwọn ènìyàn mi àti ní Jerúsálẹ́mù pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ìgbésí ayé mi” tàbí “ọ̀nà ìgbésí ayé mi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí bí Pọ́ọ̀lù ṣe ń gbé ìgbésí ayé rẹ̀, kì í ṣe wíwà rẹ̀ láàyè lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: bí mo ti ń gbé ayé mi
  rationale: Ó ń tọ́ka sí ọ̀nà ìgbésí ayé Pọ́ọ̀lù, kì í ṣe wíwà láàyè lásán; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ἐκ νεότητος
  choice: láti ìgbà èwe mi
  rationale: Ó pa ibi tí àkókò náà ti bẹ̀rẹ̀ mọ́, ó sì mú ìtọ́kasí ẹni náà hàn kedere.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Ó ṣe àfikún sí bí ìjẹ́rìí Pọ́ọ̀lù ṣe dé jìnnà sẹ́yìn ní ti àkókò.
- source_word: γενομένην
  choice: èyí tí mo ti gbé
  rationale: Nínú ìbáṣepọ̀ rẹ̀ pẹ̀lú βίωσις, ó ṣàpèjúwe ìgbésí ayé tí Pọ́ọ̀lù gbé ní àwọn ibi tí a dárúkọ; èyí yé ni Yorùbá ju ìtumọ̀ líle bí ‘tí ó ṣẹlẹ̀’ lọ.
- source_word: ἐν τῷ ἔθνει μου
  choice: láàárín àwọn ènìyàn mi
  rationale: ἔθνος níbí túmọ̀ sí ẹgbẹ́ ènìyàn tàbí ẹ̀yà Pọ́ọ̀lù, kì í ṣe orílẹ̀-èdè òde òní.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: àti ní Jerúsálẹ́mù pẹ̀lú
  rationale: ‘Pẹ̀lú’ mú agbára ìsopọ̀ τε jáde lọ́nà àdánidá, ó sì fi Jerúsálẹ́mù kún ibi tó ṣáájú.
- source_word: ἴσασι
  choice: mọ
  rationale: Fọ́ọ̀mù pípé οἶδα ní ìtumọ̀ ipò ìsinsìnyí; ‘mọ’ ni ìbámu Yorùbá tó tọ́.
- source_word: πάντες Ἰουδαῖοι
  choice: gbogbo àwọn Júù
  rationale: Ó túmọ̀ gbólóhùn Gíríìkì náà tààrà, láì sọ ìtọ́kasí ẹ̀yà náà di rírẹ̀.
- source_word: μὲν οὖν
  choice: Ǹjẹ́
  rationale: Ó samisi ìyípadà àti ìtẹ̀síwájú nínú ọ̀rọ̀ ìgbèjà Pọ́ọ̀lù lọ́nà Yorùbá tó rọrùn.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní èdè òde òní tó lọ́lá, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘àwọn ènìyàn mi’ láti yẹra fún ìtumọ̀ orílẹ̀-èdè olóṣèlú ti òde òní.
