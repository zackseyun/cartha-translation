  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: yo
  text: pé Mèsáyà yóò jìyà[a], àti pé, gẹ́gẹ́ bí ẹni àkọ́kọ́ tí yóò jí dìde láàárín àwọn òkú[d], òun yóò kéde ìmọ́lẹ̀ fún àwọn ènìyàn[b] àti fún àwọn Kèfèrí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi náà.” A lo “Mèsáyà” níhìn-ín nítorí pé oyè ni ọ̀rọ̀ Gíríìkì Χριστός jẹ́ nínú àyíká àsọtẹ́lẹ̀ yìí.
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn ènìyàn” tọ́ka sí àwọn ènìyàn Júù, ní ìyàtọ̀ sí “àwọn Kèfèrí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn orílẹ̀-èdè.” Nínú àyíká yìí, gbólóhùn náà sábà máa ń túmọ̀ sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “àti pé òun, gẹ́gẹ́ bí ẹni àkọ́kọ́ tí yóò jí dìde láàárín àwọn òkú, yóò kéde.”
    reason: previous_rendering
lexical_decisions:
- source_word: παθητὸς
  choice: yóò jìyà
  rationale: Ọ̀rọ̀ ajẹ́tífù Gíríìkì náà lè túmọ̀ sí ẹni tí ó lè jìyà tàbí ẹni tí a yàn sílẹ̀ láti jìyà. Nínú àkótán àsọtẹ́lẹ̀ yìí, gbólóhùn-ìṣe ‘yóò jìyà’ jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún ṣíṣe àlàyé ìmọ̀-ẹ̀sìn tí orísun kò sọ ní kíkún.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè fún ẹni àmì òróró tí Mósè àti àwọn wòlíì sọ tẹ́lẹ̀ nípa rẹ̀; nítorí náà ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde dáadáa ju lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lọ.
- source_word: πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Ìtumọ̀ yìí pa ìṣáájú tí ọ̀rọ̀ Gíríìkì sọ mọ́, láì fi àlàyé míì kún irú àjíǹde náà.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: tí yóò jí dìde láàárín àwọn òkú
  rationale: Gbólóhùn náà kúrú ní Gíríìkì. Èdè Yorùbá yìí sọ àjíǹde kúrò láàárín àwọn òkú ní kedere, ó sì bá πρῶτος mu lọ́nà àdánidá.
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: A pa àwòrán inú Bíbélì náà mọ́, nítorí ó lè ní ìtumọ̀ ìṣípayá, ìgbàlà àti ìrètí láì dín un kù sí ọ̀kan ṣoṣo.
- source_word: μέλλει καταγγέλλειν
  choice: yóò kéde
  rationale: μέλλω pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin lè fi ohun ọjọ́ iwájú tàbí ohun tí a pète hàn. ‘Yóò kéde’ jẹ́ Yorùbá tó rọrùn, kò sì mú un dà bí ohun tí yóò ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: τῷ τε λαῷ
  choice: fún àwọn ènìyàn náà
  rationale: A pa λαός mọ́ gẹ́gẹ́ bí ‘àwọn ènìyàn náà,’ nígbà tí ìyàtọ̀ rẹ̀ sí àwọn Kèfèrí ń tọ́ka sí àwọn ènìyàn Júù. Àlàyé ìtọ́kasí náà wà ní àlàyé ìsàlẹ̀.
- source_word: τοῖς ἔθνεσιν
  choice: fún àwọn Kèfèrí
  rationale: Nínú ìyàtọ̀ Júù àti àwọn tí kì í ṣe Júù ní Ìṣe Àwọn Àpọ́sítélì, ‘àwọn Kèfèrí’ mú ìtumọ̀ ẹ̀yà àti ẹ̀sìn tí ἔθνη níhìn-ín jáde; àlàyé ìsàlẹ̀ tún fi ‘àwọn orílẹ̀-èdè’ hàn gẹ́gẹ́ bí òmíràn.
- source_word: τε ... καὶ
  choice: àti ... àti
  rationale: Ìsopọ̀ náà fi hàn pé ìkéde náà dé ọ̀dọ̀ ẹgbẹ́ méjèèjì; ìṣètò Yorùbá náà mú ìbáṣepọ̀ yìí ṣe kedere.
theological_decisions:
- issue: Ọ̀nà tí a gbà sọ àjíǹde àti ohun tí ó túmọ̀ sí nípa Mèsáyà
  choice: A sọ Mèsáyà ní ẹni àkọ́kọ́ tí yóò jí dìde láàárín àwọn òkú, gẹ́gẹ́ bí orísun ṣe sọ ìṣáájú rẹ̀.
  alternative: Àkọ́so àjíǹde ìkẹyìn; ẹni àkọ́kọ́ tí ó jí dìde tí kò sì ní kú mọ́.
  rationale: Gíríìkì sọ ìṣáájú ní kedere, ṣùgbọ́n kò ṣe àlàyé bí a ṣe gbọdọ̀ fi í wé àwọn ẹni tí a dá padà sí ìyè tẹ́lẹ̀ nínú Ìwé Mímọ́. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ sínú ọ̀rọ̀ pàtàkì.
- issue: Àwọn tí ‘àwọn ènìyàn náà’ ń tọ́ka sí
  choice: A fi ‘àwọn ènìyàn náà’ sílẹ̀, tí ìyàtọ̀ sí ‘àwọn Kèfèrí’ fi ń tọ́ka sí àwọn Júù.
  alternative: Àwọn ènìyàn Júù; Ísírẹ́lì.
  rationale: Orísun lo λαός, tí Lúùkù sábà máa ń lò fún Ísírẹ́lì. Ìtumọ̀ pàtàkì pa ọ̀rọ̀ orísun mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé ẹni tí ó ṣeé ṣe kí ó tọ́ka sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìṣètò gbólóhùn pa ìlọ́po εἰ ... εἰ mọ́ nípasẹ̀ ‘pé ... àti pé,’ ó sì tún sọ olùṣe kejì ní ‘òun’ kí gbólóhùn lè ṣe kedere. ‘Kéde ìmọ́lẹ̀’ pa àwòrán inú orísun mọ́ dípò ṣíṣe àlàyé rẹ̀ sínú ọ̀rọ̀ pàtàkì.
