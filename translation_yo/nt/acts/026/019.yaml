  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: yo
  text: Nítorí náà, Ọba Àgírípà, èmi kò ṣàìgbọ́ràn sí ìran náà tí ó ti ọ̀run wá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìran ọ̀run náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ìtàn Pọ́ọ̀lù nípa bí ó ṣe pàdé Olúwa àti iṣẹ́ tí a rán an; ó sì jẹ́ ọ̀nà àdánidá láti so ọ̀rọ̀ náà mọ́ ohun tí ó ṣáájú.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Ọba Àgírípà
  rationale: Ọ̀rọ̀ náà jẹ́ ìpè tààrà sí Àgírípà, ó sì pa oyè ọlá rẹ̀ mọ́ ní Yorùbá òde òní.
- source_word: οὐκ ἐγενόμην
  choice: èmi kò ṣàì-
  rationale: Pẹ̀lú ajẹtífù ἀπειθής, γίνομαι ń sọ bí Pọ́ọ̀lù ṣe hùwà sí iṣẹ́ tí a fi fún un. Àkópọ̀ ‘èmi kò ṣàìgbọ́ràn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì fi dandan mú ìtumọ̀ ‘di’ wọlé.
- source_word: ἀπειθὴς
  choice: ṣàìgbọ́ràn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí kí ènìyàn kọ̀ láti tẹ̀ lé àṣẹ Ọlọ́run; ‘ṣàìgbọ́ràn’ mú èrò yẹn jáde láìlágbára ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: sí ìran ọ̀run náà
  rationale: ‘Ìran’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìríran àrà ọ̀tọ̀; ‘ọ̀run’ sì lè tọ́ka sí ibi tí ìran náà ti wá tàbí irú ànímọ́ rẹ̀. ‘Sí’ ṣe àfihàn dative tí ó tẹ̀ lé ἀπειθής.
theological_decisions:
- issue: Irú ohun tí Pọ́ọ̀lù rí ní ọ̀nà Damásíkù
  choice: ìran
  alternative: ìfarahàn; ìṣípayá láti ọ̀run
  rationale: ὀπτασία ń tọ́ka ní tààrà sí ìran tàbí ìfarahàn. ‘Ìran’ pa ẹ̀ka tí ọ̀rọ̀ náà fúnra rẹ̀ lò mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un; ‘ọ̀run’ sì lè sọ ìpilẹ̀ṣẹ̀ tàbí ànímọ́ ìran náà.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ọba Àgírípà’ gẹ́gẹ́ bí ìpè ọlọ́lá tààrà.
