id: ACT.16.4
reference: Acts 16:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: yo
  text: Bí wọ́n sì ti ń la àwọn ìlú náà kọjá, wọ́n ń fi àwọn ìpinnu tí àwọn aposteli àti àwọn alàgbà ní Jerusalẹmu ti pinnu lé wọn lọ́wọ́, kí wọ́n lè máa tẹ̀lé wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àṣẹ.” Ọ̀rọ̀ Gíríìkì náà, dogmata, tọ́ka sí àwọn ìpinnu aláṣẹ tí ìgbìmọ̀ Jerusalẹmu ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: ń la àwọn ìlú náà kọjá
  rationale: Ọ̀rọ̀ náà jẹ́ imperfect, ó sì fi ìrìn-àjò tí ń tẹ̀ síwájú láti ìlú dé ìlú hàn; ‘la … kọjá’ jẹ́ èdè Yorùbá àdánidá.
- source_word: παρεδίδοσαν
  choice: ń fi … lé wọn lọ́wọ́
  rationale: Ó túmọ̀ sí fífi ohun tí ó ní àṣẹ tàbí tí a ti gbà síni lọ́wọ́ fún ẹlòmíràn; yíyan yìí pa ìtumọ̀ ìfìmọ́lẹ̀ àti ìgbéjáde àṣẹ mọ́.
- source_word: αὐτοῖς
  choice: wọn
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ láìfi ‘àwọn onígbàgbọ́’ tàbí ‘àwọn ìjọ’ kún un, bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí wọn.
- source_word: φυλάσσειν
  choice: láti máa pa wọ́n mọ́
  rationale: Níhìn-ín φυλάσσω túmọ̀ sí láti tẹ̀lé tàbí ṣọ́ra láti ṣe ohun tí a pàṣẹ; ‘máa pa … mọ́’ tún fi ìṣe tí ń bá a lọ hàn.
- source_word: δόγματα
  choice: àwọn ìpinnu
  rationale: Ní àyíká Ìṣe 15–16, ọ̀rọ̀ náà tọ́ka sí àwọn ìdájọ́ tàbí ìlànà tí ìgbìmọ̀ Jerusalẹmu fohùn ṣọ̀kan lé lórí. ‘Àwọn ìpinnu’ jẹ́ kedere, ó sì yẹra fún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ti ọjọ́ iwájú.
- source_word: κεκριμένα
  choice: tí … ti ṣe
  rationale: Perfect passive participle náà tọ́ka sí àwọn ìpinnu tí a ti dé sí, tí agbára wọn sì ṣì dúró; Yorùbá àdánidá máa ń sọ ‘ìpinnu tí … ti ṣe.’
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: àwọn aposteli àti àwọn alàgbà
  rationale: ‘Aposteli’ ni ọ̀rọ̀ tí ó ti fìdí múlẹ̀ fún ἀπόστολοι, ‘àwọn alàgbà’ sì jẹ́ ìtumọ̀ àdánidá fún àwọn aṣáájú tí a mọ̀ sí πρεσβύτεροι.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: ní Jerusalẹmu
  rationale: Gbólóhùn náà ń sọ ibi tí àwọn aposteli àti alàgbà wà; ‘ní Jerusalẹmu’ jẹ́ kúkúrú, ó sì bójú mu.
- source_word: ὡς δὲ
  choice: Bí … sì ti
  rationale: Ó ń so ìṣẹ̀lẹ̀ tuntun mọ́ ìtàn tó ṣáájú, ó sì fi hàn pé fífi àwọn ìpinnu náà lé wọn lọ́wọ́ ń ṣẹlẹ̀ bí wọ́n ti ń rin ìrìn-àjò.
theological_decisions:
- issue: Agbára àwọn ìpinnu ìgbìmọ̀ Jerusalẹmu
  choice: àwọn ìpinnu
  alternative: àwọn àṣẹ; àwọn ìlànà
  rationale: ‘Àwọn ìpinnu’ fi hàn pé wọ́n jẹ́ ohun tí àwọn aposteli àti alàgbà ti fohùn ṣọ̀kan lé lórí, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ ní ìtumọ̀ imọ̀-ẹ̀sìn ti ọjọ́ iwájú. Ìtumọ̀ ‘fi … lé wọn lọ́wọ́ láti máa pa wọ́n mọ́’ ṣì pa agbára wọn mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí wọ́n ti jẹ́ àdánidá, a sì pa ìtẹ̀sí imperfect ti àwọn ọ̀rọ̀-ìṣe mọ́ pẹ̀lú ‘ń’ àti ‘máa.’
