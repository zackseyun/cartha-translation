revisions:
- from: Bí wọ́n sì ti ń la àwọn ìlú náà kọjá, wọ́n ń fi àwọn ìpinnu tí àwọn aposteli àti àwọn alàgbà ní Jerusalẹmu ti ṣe lé wọn lọ́wọ́ láti máa pa wọ́n mọ́.[a]
  to: Bí wọ́n sì ti ń la àwọn ìlú náà kọjá, wọ́n ń fi àwọn ìpinnu tí àwọn aposteli àti àwọn alàgbà ní Jerusalẹmu ti pinnu lé wọn lọ́wọ́, kí wọ́n lè máa tẹ̀lé wọn.[a]
  rationale: Àtúnṣe náà rọ́pò ‘ti ṣe’ pẹ̀lú ‘ti pinnu’ láti fi κεκριμένα hàn ní kedere, ó sì tún gbolohun φυλάσσειν ṣe sí ‘kí wọ́n lè máa tẹ̀lé wọn’ fún ìmúlò Yorùbá tí ó yege. ‘Àwọn ìpinnu’ ni a pa mọ́, nítorí ó dáa fún δόγματα nínú àyíká ìpinnu ìgbìmọ̀ Jerusalẹmu.
