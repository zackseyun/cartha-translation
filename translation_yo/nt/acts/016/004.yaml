  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìrìn-àjò wọn láti ìlú dé ìlú, fífi àwọn ìpinnu náà lé àwọn tí ó wà níbẹ̀ lọ́wọ́, àti ipò àwọn aposteli àti alàgbà ní Jerusalẹmu. Síbẹ̀, ‘tí ... ti ṣe’ kò fi passive participle κεκριμένα hàn dáadáa bí ‘tí a ti pinnu,’ ó sì kéré sí ìtumọ̀ ‘decided.’'
