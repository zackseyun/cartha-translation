source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: yo
  text: Nítorí náà, àwọn ìjọ ń di alágbára nínú ìgbàgbọ́, iye wọn sì ń pọ̀ sí i lójoojúmọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nínú ìgbàgbọ́ wọn.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí pé wọ́n ń di alágbára nínú ìgbàgbọ́ Kristẹni tí wọ́n jọ dì mú gẹ́gẹ́ bí ẹ̀kọ́ àti ìgbé-ayé, tàbí pé wọ́n ń di alágbára nínú ìgbẹ́kẹ̀lé wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ àwọn patikulu yìí ń ṣe àkótán ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì fi àbájáde rẹ̀ hàn. “Nítorí náà” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé láti pa ìsopọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ἐκκλησίαι
  choice: àwọn ìjọ
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn àwùjọ onígbàgbọ́ ní ibi kọ̀ọ̀kan; “àwọn ìjọ” jẹ́ èdè Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere.
- source_word: ἐστερεοῦντο
  choice: ń di alágbára
  rationale: Ọ̀rọ̀-ìṣe aláìpé, afìṣeṣe náà tọ́ka sí ìgbésẹ̀ tí ń bá a lọ ní àkókò tí ó kọjá. “Ń di alágbára” sọ ìlọsíwájú náà ní èdè Yorùbá àdánidá, ó sì pa èrò pé agbára ń dé bá wọn mọ́.
- source_word: τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Dátífù náà fi ibi tàbí ọ̀nà tí agbára wọn wà hàn. “Nínú ìgbàgbọ́” lè tọ́ka sí ìgbàgbọ́ Kristẹni tí gbogbo wọn jọ dì mú, láì dá ìtumọ̀ náà mọ́ sí ìgbẹ́kẹ̀lé ara ẹni nìkan.
- source_word: ἐπερίσσευον
  choice: ń pọ̀ sí i
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìbísí tí ń bá a lọ hàn. “Ń pọ̀ sí i” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbísí iye wọn, láì fi agbára tí kò sí nínú Gíríìkì kún un.
- source_word: τῷ ἀριθμῷ
  choice: iye wọn
  rationale: Dátífù yìí ṣàlàyé pé ìbísí náà jẹ́ ti iye ènìyàn. “Iye wọn” mú èyí ṣe kedere ní Yorùbá láì nílò ọ̀rọ̀ àjèjì tàbí ìtumọ̀ líle.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Gbólóhùn náà tọ́ka sí ohun tí ń ṣẹlẹ̀ ní ọjọ́ kọ̀ọ̀kan. “Lójoojúmọ́” jẹ́ ṣókí, ó sì pa ìtumọ̀ ìtẹ̀síwájú náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις pẹ̀lú árítíkù
  choice: “nínú ìgbàgbọ́” gẹ́gẹ́ bí ìgbàgbọ́ Kristẹni tí ìjọ jọ dì mú
  alternative: “nínú ìgbàgbọ́” gẹ́gẹ́ bí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́ àwọn onígbàgbọ́
  rationale: Árítíkù àti àyíká ọ̀rọ̀ nípa àwọn ìjọ mú kí ìtumọ̀ ìgbàgbọ́ tí àwùjọ jọ dì mú ṣeé ṣe jù; síbẹ̀, Gíríìkì náà kò yọ ìtumọ̀ ìgbẹ́kẹ̀lé ara ẹni kúrò pátápátá. A pa àìdánilójú yìí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, àti ọlọ́wọ̀ ni a lò. Àmì ohùn kún níbi tí ó yẹ. Ọ̀rọ̀ náà pa ìlọsíwájú àwọn ọ̀rọ̀-ìṣe aláìpé Gíríìkì mọ́ nípasẹ̀ “ń,” ó sì yẹra fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
