translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtúnṣe náà pa ìṣàn ìtàn, agbára ìṣe ‘jù,’ àti ìtumọ̀ ìṣọ́ tí kò jẹ́ kí ẹni sá mọ́.
