id: ACT.16.23
reference: Acts 16:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti na wọ́n lù púpọ̀[a], wọ́n jù wọ́n sínú túbú[b], wọ́n sì pàṣẹ fún olùṣọ́ túbú pé kí ó ṣọ́ wọn pẹ̀lú ìṣọ́ tó lágbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “lẹ́yìn tí wọ́n ti fi ọ̀pọ̀ ìgbẹ́ lu wọ́n.” Ọ̀rọ̀ Gíríìkì náà sọ pé wọ́n fi ọ̀pọ̀ ìgbẹ́ lu wọ́n, ṣùgbọ́n kò sọ ohun èlò tí wọ́n fi lù wọ́n ní pàtó níbí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “ibi ìhámọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi tí a ti ń há ènìyàn mọ́ ní gbogbogbòò.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: ọ̀pọ̀lọpọ̀ ìlù
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ọ̀pọ̀ ìlù tí a fi lu ènìyàn, láì sọ ohun èlò tí wọ́n fi lù wọ́n ní pàtó. ‘Ọ̀pọ̀lọpọ̀ ìlù’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: τε
  choice: sì
  rationale: Patíkù náà so ìṣẹ̀lẹ̀ yìí mọ́ ìtàn tó ṣáájú; ‘sì’ fi ìṣàn ìtàn náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐπιθέντες
  choice: lẹ́yìn tí wọ́n ... ti lù
  rationale: Pẹ̀lú πληγάς, ọ̀rọ̀ náà túmọ̀ sí fífi ìlù lu ẹnì kan. Àgbékalẹ̀ ‘lẹ́yìn tí ... ti’ fi ìbáṣepọ̀ àkókò participle náà hàn kedere.
- source_word: ἔβαλον εἰς φυλακήν
  choice: wọ́n jù wọ́n sínú ẹ̀wọ̀n
  rationale: ‘Jù ... sínú’ pa agbára àti ìwà líle βάλλω mọ́ ju ‘fi ... sínú’ lọ, nígbà tí ‘ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi ìhámọ́.
- source_word: φυλακήν
  choice: ẹ̀wọ̀n
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tí a ti ń há àwọn ẹlẹ́wọ̀n mọ́; ‘ẹ̀wọ̀n’ ṣe kedere, ó sì jẹ́ èdè òde òní.
- source_word: παραγγείλαντες
  choice: wọ́n sì pàṣẹ
  rationale: ‘Pàṣẹ’ fi agbára àṣẹ inú παραγγέλλω hàn, ó sì bá àgbékalẹ̀ gbolohun Yorùbá mu.
- source_word: δεσμοφύλακι
  choice: olùṣọ́ ẹ̀wọ̀n
  rationale: Èyí ń tọ́ka sí ẹni tí ó ní ojúṣe láti ṣọ́ àwọn ẹlẹ́wọ̀n; ‘olùṣọ́ ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá kedere àti àdánidá.
- source_word: ἀσφαλῶς
  choice: dáadáa
  rationale: Ní ìtumọ̀ ‘ṣọ́ wọn dáadáa,’ ọ̀rọ̀ náà tẹnumọ́ ìṣọ́ tó lágbára tí kò ní jẹ́ kí wọ́n sá, kì í ṣe ààbò àwọn ẹlẹ́wọ̀n.
- source_word: τηρεῖν
  choice: kí ó ṣọ́
  rationale: ‘Ṣọ́’ bá ipò ẹ̀wọ̀n mu, ó sì sọ ìtumọ̀ pípa wọn mọ́ lábẹ́ ìṣọ́ kedere.
- source_word: αὐτούς
  choice: wọn
  rationale: Ó tọ́ka sí Paulu àti Sílà gẹ́gẹ́ bí àwọn tí wọ́n lù, tí wọ́n jù sínú ẹ̀wọ̀n, tí a sì ní láti ṣọ́.
