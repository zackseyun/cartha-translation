- from: Lẹ́yìn tí wọ́n sì ti lù wọ́n ní ọ̀pọ̀lọpọ̀ ìlù[a], wọ́n jù wọ́n sínú ẹ̀wọ̀n[b], wọ́n sì pàṣẹ fún olùṣọ́ ẹ̀wọ̀n pé kí ó ṣọ́ wọn dáadáa.
  to: Lẹ́yìn tí wọ́n ti na wọ́n lù púpọ̀[a], wọ́n jù wọ́n sínú túbú[b], wọ́n sì pàṣẹ fún olùṣọ́ túbú pé kí ó ṣọ́ wọn pẹ̀lú ìṣọ́ tó lágbára.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó lè yọrí sí ìdààmú (‘ìlù’) pẹ̀lú ọ̀nà Yorùbá tó ṣe kedere fún ìfìyà ìgbẹ́. Ó tún mú ìtumọ̀ ‘ní ìdánilójú/ní ìmúdójúìwọ̀n’ ti ἀσφαλῶς hàn kedere. ‘Jù wọ́n sínú’ ni a pa mọ́ láti fi agbára βάλλω hàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:15Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìtòlẹ́sẹẹsẹ ìṣẹ̀lẹ̀ Gíríìkì, ìṣe fífi ìgbẹ́ lu wọn, fífi wọn sínú ibi ìhámọ́, àti àṣẹ fún olùṣọ́ láti pa wọ́n mọ́ lábẹ́ ìṣọ́. Ṣùgbọ́n ‘ìlù’ kò ṣe kedere gẹ́gẹ́ bí ‘ìgbẹ́/ìlù tí a fi nà’; ó lè dà bí ohun èlò ìlù. ‘Dáadáa’ tún lè túmọ̀ sí ṣíṣe ohun kan ní ọ̀nà rere, láì fi ìtumọ̀ ἀσφαλῶς—ìṣọ́ tí ó mú kí ìsálọ̀ má ṣeé ṣe—hàn dáadáa.
  naturalness: ‘Na wọ́n lù púpọ̀’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì yé ẹni. ‘Túbú’ jẹ́ ọ̀rọ̀ òde òní tó mọ́gbọ́n dání fún φυλακή nínú àyíká yìí; ‘olùṣọ́ túbú’ sì jẹ́ ìsọ̀rọ̀ àdánidá.
  terminology: A ti yí ‘ẹ̀wọ̀n’ padà sí ‘túbú’ fún ibi ìhámọ́, kí a má bàa dà á pọ̀ mọ́ ẹ̀wọ̀n irin. A ti lo ‘ìṣọ́ tó lágbára’ láti fi ìtumọ̀ ìmúdójúìwọ̀n ἀσφαλῶς hàn, láì mú un di ìtumọ̀ nípa ààbò àwọn ẹlẹ́wọ̀n.
