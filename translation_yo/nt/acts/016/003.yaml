source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: yo
  text: Pọ́ọ̀lù fẹ́ kí Timotiu bá Pọ́ọ̀lù jáde lọ[a]. Lẹ́yìn tí ó mú Timotiu, ó kọ ọ́ ní ilà nítorí àwọn Júù tí wọ́n wà ní àwọn àgbègbè náà[b], nítorí gbogbo wọn mọ̀ pé Gíríìkì ni baba rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí Timotiu bá Pọ́ọ̀lù rin ìrìn-àjò.” Èdè Gíríìkì sọ ní tààrà pé “kí ó bá a jáde lọ,” ọ̀nà ọ̀rọ̀ kan tó lè túmọ̀ sí bíbẹ̀rẹ̀ ìrìn-àjò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí àwọn Júù” ni a lè sọ pé “nítorí wọn” tàbí “nítorí àníyàn wọn.”
    reason: lexical_alternative
  - marker: c
    text: Èdè Gíríìkì ní “Gíríìkì kan”; nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kó ń fi hàn pé baba Timotiu kì í ṣe Júù.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Timotiu nínú ẹsẹ tó ṣáájú; ‘òun’ jẹ́ ọ̀nà àdánidá láti tún un tọ́ka sí láìfi ìtẹnumọ́ kún un.
- source_word: ἠθέλησεν
  choice: fẹ́
  rationale: Ó fi ìfẹ́ tàbí èrò Pọ́ọ̀lù hàn ní èdè Yorùbá òde òní láìsọ ọ́ di ìpinnu líle ju ohun tí Gíríìkì sọ lọ.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: kí òun bá a jáde lọ
  rationale: Ó pa àwòrán ‘jáde lọ’ mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá fún bíbẹ̀rẹ̀ ìrìn-àjò pẹ̀lú ẹnì kan.
- source_word: λαβὼν
  choice: ó sì mú un
  rationale: Aorist participle náà tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ìkọlà; ìtẹ̀lé àwọn ọ̀rọ̀ náà mú ìṣísẹ̀ yìí hàn ní kedere.
- source_word: περιέτεμεν
  choice: ó kọ ọ́ ní ilà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ìkọlà, láìlo ọ̀rọ̀ ìbòjú.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: nítorí àwọn Júù
  rationale: διά pẹ̀lú accusative sọ ìdí tàbí ohun tó fa ìgbésẹ̀ náà; ‘nítorí’ pa ìtumọ̀ náà mọ́ láìfi èrò míì kún un.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: tí ó wà ní àwọn àgbègbè náà
  rationale: ‘Àwọn àgbègbè’ jẹ́ Yorùbá àdánidá fún ọ̀pọ̀ ibi tí ọ̀rọ̀ náà ń tọ́ka sí, láìsọ pé ibẹ̀ ni wọ́n ń gbé títí.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: nítorí gbogbo wọn mọ̀
  rationale: ‘Nítorí’ fi ipa àlàyé γάρ hàn, ‘gbogbo wọn’ sì pa ìtẹnumọ́ ἅπαντες mọ́.
- source_word: Ἕλλην
  choice: Gíríìkì
  rationale: Ìtumọ̀ tààrà ni ‘Gíríìkì’; a kò yí i sí ‘Kèfèrí’ nítorí èyí lè túmọ̀ ọrọ̀ náà ju bí ẹsẹ náà ṣe sọ lọ.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: ni baba rẹ̀
  rationale: Ìṣètò predicate Yorùbá yìí sọ ní ṣókí àti ní ti ẹ̀dá pé baba rẹ̀ jẹ́ Gíríìkì, láìfi ìtẹnumọ́ àfikún sí ὑπῆρχεν.
theological_decisions:
- issue: Ìdí tí Pọ́ọ̀lù fi kọ Timotiu ní ilà ní ìbámu pẹ̀lú àníyàn àwọn Júù
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìgbésẹ̀ tí Pọ́ọ̀lù gbé nítorí àwọn Júù ibẹ̀ àti ohun tí wọ́n mọ̀ nípa baba Timotiu.
  alternative: Kí a sọ pé ìkọlà ṣe pàtàkì fún ìgbàlà, tàbí pé ohun tí Pọ́ọ̀lù ṣe jẹ́ ọgbọ́n iṣẹ́ ìránṣẹ́ nìkan.
  rationale: Gíríìkì sọ ìdí tí ìtàn náà fúnra rẹ̀ fi lélẹ̀, ṣùgbọ́n kò ṣàlàyé gbogbo ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ tó lè wà mọ́, kò sì fi ìpinnu ẹ̀sìn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣísẹ̀ ìtàn Gíríìkì, ṣùgbọ́n a ṣètò àwọn ọ̀rọ̀ arọ́pò-orúkọ kí ẹni tó ń ṣe àti ẹni tí ìṣe ń kan lè yé òǹkàwé Yorùbá.
