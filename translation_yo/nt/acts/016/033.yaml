id: ACT.16.33
reference: Acts 16:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: yo
  text: Ó sì mú wọn lọ ní wákàtí òru náà[a], ó fọ ọgbẹ́ wọn[b]; lẹ́sẹ̀kẹsẹ̀, òun àti gbogbo àwọn ará ilé rẹ̀[c] sì gba ìrìbọmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní wákàtí náà gan-an lálẹ́.” Gbólóhùn náà tẹnu mọ́ pé ó ti di òru àti pé kò jáfara.
    reason: lexical_alternative
  - marker: b
    text: Lẹ́yọ̀ọ̀rọ̀, ọ̀rọ̀ Gíríìkì náà ní “ó fọ [wọ́n] kúrò nínú àwọn ọgbẹ́.” Ní ọ̀rọ̀ àyíká yìí, èyí túmọ̀ sí pé ó fọ ibi ọgbẹ́ wọn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “gbogbo ìdílé rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè gbòòrò sí gbogbo àwọn tó jẹ́ ti agbo ilé rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: mú wọn lọ
  rationale: Ọ̀rọ̀ náà jẹ́ àpólà-ìṣe aorist tí ó ṣáájú fífọ ọgbẹ́ wọn. “Mú wọn lọ” jẹ́ èdè Yorùbá àdánidá, kò sì sọ ibi tí ó mú wọn lọ tàbí ọ̀nà tí ó gbà ṣe é ní pàtó.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: ní wákàtí òru náà
  rationale: Ó pa ìtumọ̀ àkókò náà mọ́, ó sì tẹnu mọ́ pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ lálẹ́ láìjáfara.
- source_word: ἔλουσεν ... ἀπὸ τῶν πληγῶν
  choice: ó fọ ọgbẹ́ wọn
  rationale: Nínú àyíká yìí, λούω pẹ̀lú ἀπὸ τῶν πληγῶν túmọ̀ sí fífọ ibi tí wọ́n ti fara pa. Èyí ṣe kedere ju títúmọ̀ àkànlò-èdè Gíríìkì náà lẹ́yọ-ọ̀rọ̀ sí lẹ́yọ-ọ̀rọ̀ lọ.
- source_word: ἐβαπτίσθη
  choice: gba ìrìbọmi
  rationale: 'Fífi “gba” lò jẹ́ ọ̀nà Yorùbá àdánidá láti fi ohùn àìṣe Gíríìkì hàn: ẹlòmíràn ni ó ṣe ìrìbọmi fún un. Kò pinnu bí a ṣe ṣe ìrìbọmi náà.'
- source_word: οἱ αὐτοῦ πάντες
  choice: gbogbo àwọn ará ilé rẹ̀
  rationale: “Àwọn ará ilé rẹ̀” gba gbogbo àwọn tó jẹ́ ti agbo ilé rẹ̀, ó sì lè ní ìtumọ̀ tó gbòòrò ju ìdílé kékeré nìkan lọ.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi agbára ìtumọ̀ àìjáfara ti ọ̀rọ̀ Gíríìkì náà hàn ní Yorùbá òde òní.
theological_decisions:
- issue: Àwọn wo ni οἱ αὐτοῦ πάντες ń tọ́ka sí nínú àwọn tí wọ́n gba ìrìbọmi?
  choice: gbogbo àwọn ará ilé rẹ̀
  alternative: gbogbo ìdílé rẹ̀
  rationale: Ẹsẹ yìí sọ pé olùṣọ́ túbú náà àti gbogbo àwọn tó jẹ́ ti agbo ilé rẹ̀ gba ìrìbọmi, ṣùgbọ́n kò sọ ọjọ́ orí wọn, kò ṣe àlàyé bí ẹnì kọ̀ọ̀kan ṣe jẹ́wọ́ ìgbàgbọ́, kò sì sọ ọ̀nà tí a gbà ṣe ìrìbọmi. Ìtumọ̀ náà kò dá ẹ̀kọ́ ìjọ kan pàtó sí ọ̀rọ̀ Gíríìkì.
- issue: Ọ̀nà ìrìbọmi tí ἐβαπτίσθη ń tọ́ka sí
  choice: gba ìrìbọmi
  alternative: a rì í bọ inú omi
  rationale: Ọ̀rọ̀ inú ẹsẹ yìí sọ pé ó gba ìrìbọmi, ṣùgbọ́n kò ṣe àlàyé ọ̀nà tí a gbà ṣe é. Nítorí náà, a kò fi ọ̀nà kan pàtó kún ìtumọ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Gba ìrìbọmi” jẹ́ àkànlò Yorùbá tó ṣe kedere pé ẹni náà ni a ṣe ìrìbọmi fún, “àwọn ará ilé” sì pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́ láìfi èrò ẹ̀kọ́ ìjọ kan kún un.
