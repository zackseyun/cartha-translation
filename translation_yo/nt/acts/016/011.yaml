translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tó bá yẹ, a sì ṣe àwọn orúkọ ibi bí Tíróásì, Samotírákè, àti Neápólì ní ìró Yorùbá.
