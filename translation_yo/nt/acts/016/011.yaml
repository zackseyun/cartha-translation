  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: yo
  text: Nítorí náà[a], a wọ ọkọ̀ ojú omi kúrò ní Tíróásì, a sì lọ tààrà sí Samotrákè; ní ọjọ́ kejì, sí Neápólì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí a wọ ọkọ̀ ojú omi kúrò ní Tíróásì, a lọ tààrà sí Samotrákè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: lẹ́yìn tí a kúrò ní Tíróásì lójú omi
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ pàtó nípa ìrìnàjò ọkọ̀ ojú omi, ìyẹn kíkúrò ní èbúté sí ojú omi. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ tí participle náà fi hàn mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìrìnàjò yìí pọ̀ mọ́ ìṣẹ̀lẹ̀ tó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn.
- source_word: ἀπὸ Τρῳάδος
  choice: ní Tíróásì
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘kúrò,’ ‘ní Tíróásì’ fi ibi tí wọ́n ti jáde hàn lọ́nà àdánidá ní Yorùbá. A ṣe orúkọ ibi náà ní Tíróásì.
- source_word: εὐθυδρομήσαμεν
  choice: a wọ ọkọ̀ ojú omi lọ tààrà
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí wíwọ ọkọ̀ ojú omi ní ipa-ọ̀nà tààrà; ‘lọ tààrà’ pa agbára ìdarí náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: εἰς Σαμοθρᾴκην
  choice: sí Samotírákè
  rationale: εἰς tọ́ka sí ibi tí wọ́n ń lọ; Samotírákè jẹ́ àkọsílẹ̀ orúkọ ibi náà ní ìró Yorùbá.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: ní ọjọ́ kejì ... sì
  rationale: Gbólóhùn àkókò náà túmọ̀ sí ọjọ́ tó tẹ̀ lé e. ‘Sì’ dúró fún δέ gẹ́gẹ́ bí àsopọ̀ ìtẹ̀síwájú ìtàn.
- source_word: εἰς Νέαν Πόλιν
  choice: a sì dé Neápólì
  rationale: εἰς fi ibi ìrìnàjò tó tẹ̀ lé e hàn; fifi ‘dé’ kún un jẹ́ Yorùbá àdánidá, nígbà tí a kọ orúkọ ibi náà ní Neápólì dípò títúmọ̀ rẹ̀ sí ‘Ìlú Tuntun.’
