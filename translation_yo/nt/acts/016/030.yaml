id: ACT.16.30
reference: Acts 16:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: yo
  text: Lẹ́yìn tí ó mú wọn jáde[a], ó wí pé, “Ẹ̀yin ọ̀gá[b], kí ni mo ní láti ṣe kí n lè rí ìgbàlà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ti mú wọn jáde.”
    reason: Àwọn ọ̀nà méjèèjì lè fi hàn pé ìṣe mímú wọn jáde ṣáájú ọ̀rọ̀ tí ó sọ.
  - marker: b
    text: “Ẹ̀yin ọ̀gá” túmọ̀ Gíríìkì Kyrioi gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ nínú àjọṣepọ̀ níbí; kì í ṣe oyè Ọlọ́run, “Olúwa.”
    reason: Láti ṣàlàyé ìtumọ̀ àwùjọ ti κύριος ní àyíká yìí, kí a má bà á dàpọ̀ mọ́ oyè Ọlọ́run.
lexical_decisions:
- source_word: προαγαγὼν
  choice: Lẹ́yìn tí ó sì mú
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú ọ̀rọ̀ sísọ hàn; “Lẹ́yìn tí ó sì mú” jẹ́ Yorùbá àdánidá tí ó pa bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: αὐτοὺς ἔξω
  choice: wọn jáde
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú ἔξω tọ́ka sí mímú wọn lọ sí òde; “wọn jáde” ṣe kedere, ó sì bá Yorùbá mu.
- source_word: ἔφη
  choice: ó wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ἔφη wà ní imperfect, ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà ìbẹ̀rẹ̀ ọ̀rọ̀ nínú ìtàn; “ó wí pé” jẹ́ èdè ọ̀wọ̀ àti àdánidá.
- source_word: Κύριοι
  choice: Ẹ̀yin ọ̀gá
  rationale: Vocative plural κύριος níbí jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ sí Paulu àti Sílà, kì í ṣe oyè Ọlọ́run. “Ẹ̀yin ọ̀gá” mú ìtumọ̀ àjọṣepọ̀ yìí jáde láì sọ ọ́ di “Olúwa.”
- source_word: τί με δεῖ ποιεῖν
  choice: kí ni mo ní láti ṣe
  rationale: δεῖ sọ ohun tí ó pọndandan; “ní láti” fi agbára ìpọnjú náà hàn ní Yorùbá tí ó wọ́pọ̀.
- source_word: ἵνα σωθῶ
  choice: kí a lè gbà mí là
  rationale: ἵνα pẹ̀lú aorist passive subjunctive fi ète tàbí àbájáde hàn. “Kí a lè gbà mí là” pa ohùn àgbàṣe (passive) mọ́, kò sì sọ ẹni tí yóò gbà á là ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ σωθῶ nínú ìbéèrè olùṣọ́ ẹ̀wọ̀n
  choice: kí a lè gbà mí là
  alternative: kí n lè bó; kí a lè dá mi nídè
  rationale: σῴζω lè túmọ̀ sí ìgbàlà kúrò nínú ewu tàbí ìgbàlà ní ìtumọ̀ ẹ̀mí. Àyíká àti ìdáhùn ẹsẹ 31 tọ́ka sí ìtumọ̀ ìgbàlà tó jinlẹ̀, ṣùgbọ́n “gbà mí là” tún pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ láì fi èrò ẹ̀kọ́ ìjọ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ìtàn, ó sì rọrùn fún òǹkàwé òde òní. “Ẹ̀yin ọ̀gá” jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ sí ẹni méjì, nígbà tí “gbà mí là” pa àgbàṣe àti fífẹ̀ ìtumọ̀ σωθῶ mọ́.
