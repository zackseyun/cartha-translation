revisions:
- from: Lẹ́yìn tí ó sì mú wọn jáde[a], ó wí pé, “Ẹ̀yin ọ̀gá[b], kí ni mo ní láti ṣe kí a lè gbà mí là?”
  to: Lẹ́yìn tí ó mú wọn jáde[a], ó wí pé, “Ẹ̀yin ọ̀gá[b], kí ni mo ní láti ṣe kí n lè rí ìgbàlà?”
  rationale: Àtúnṣe náà mú kí gbolohun ìbẹ̀rẹ̀ rọrùn ní Yorùbá, ó sì rọ́pò ọ̀nà passive tí kò wọ́pọ̀ “kí a lè gbà mí là” pẹ̀lú “kí n lè rí ìgbàlà.” Èyí ṣàfihàn σωθῶ ní ìtumọ̀ ìgbàlà tí àyíká ń tọ́ka sí, láì sọ ìlànà ẹ̀kọ́ ìjọ kan di dandan. A ti pa àwọn àmì ìsàlẹ̀ mọ́ sí ibi tí wọ́n tọ́ka sí, a sì ṣe ìwọnba ọ̀rọ̀ àkọ́kọ́ akọsílẹ̀ a kí ó bá gbolohun tuntun mu.
