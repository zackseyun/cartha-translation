id: ACT.16.17
reference: Acts 16:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: yo
  text: Obìnrin náà ń tọ Pọ́ọ̀lù àti àwa náà lẹ́yìn, ó sì ń ké jáde pé, “Àwọn ọkùnrin wọ̀nyí jẹ́ ẹrú Ọlọ́run Gíga Jù Lọ; wọ́n ń kéde ọ̀nà ìgbàlà[a] fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀rọ̀ náà ni “ọ̀nà ìgbàlà”; kò sí ọrọ̀-ìsáájú pàtó níwájú “ọ̀nà.” Nítorí náà, ó lè túmọ̀ sí “ọ̀nà kan sí ìgbàlà” tàbí “ọ̀nà ìgbàlà náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: ń tọ ... lẹ́yìn ṣáá
  rationale: Àpólà yìí fi ìṣe tí ó ń bá a lọ hàn; “ṣáá” ń mú ìtumọ̀ títẹ̀síwájú tàbí àtúnṣe ìṣe náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἔκραζεν
  choice: ń ké jáde
  rationale: Ó fi ohùn rara àti ìṣe tí ó ń bá a lọ hàn láìfi ìmọ̀lára kan tí Gíríìkì kò sọ kún un.
- source_word: δοῦλοι
  choice: ẹrú
  rationale: “Ẹrú” pa ìtumọ̀ jíjẹ́ ohun-ìní tàbí jíjẹ́ ẹni tí ó wà lábẹ́ àṣẹ Ọlọ́run mọ́, ó sì lágbára ju “ìránṣẹ́” lọ gẹ́gẹ́ bí δοῦλοι.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: Ọlọ́run Ọ̀gá-ògo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání, tí ó sì ní iyì, láti sọ orúkọ oyè Ọlọ́run Gíga Jù Lọ.
- source_word: καταγγέλλουσιν
  choice: ń kéde
  rationale: “Ń kéde” mú ìtumọ̀ pípolongo ní gbangba àti àsìkò ìsinsìnyí jáde.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi àwọn olùgbọ́ púpọ̀ tí a ń kéde ọ̀rọ̀ náà fún hàn ní Yorùbá àdánidá.
- source_word: ὁδὸν σωτηρίας
  choice: ọ̀nà ìgbàlà
  rationale: Àpólà aláìlóhun àfihàn yìí jẹ́ àdánidá ní Yorùbá, ó sì lè ru ìtumọ̀ “ọ̀nà kan” tàbí “ọ̀nà náà,” bí Gíríìkì ṣe fi àìdájú náà sílẹ̀.
theological_decisions:
- issue: Bóyá ὁδὸν σωτηρίας jẹ́ ọ̀nà kan tàbí ọ̀nà náà pàtó
  choice: ọ̀nà ìgbàlà
  alternative: ọ̀nà kan sí ìgbàlà / ọ̀nà ìgbàlà náà
  rationale: Ọ̀rọ̀ Gíríìkì kò ní article, kò sì yẹ kí ìtumọ̀ Yorùbá yan ìtumọ̀ aláìlẹ́gbẹ́ tàbí ìtumọ̀ ọ̀kan lára ọ̀pọ̀ ọ̀nà ní tipátipá. “Ọ̀nà ìgbàlà” pa àìdájú gírámà náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìtúmọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “ẹrú” láti pa agbára δοῦλοι mọ́; a sì fi àmì ìsàlẹ̀ ìwé sí “ọ̀nà ìgbàlà,” ibi tí àìdájú gírámà náà wà.
