  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà wá: obìnrin kan, Lídíà, ìbáṣepọ̀ rẹ̀ pẹ̀lú Tíátírà, ìjọ́sìn Ọlọ́run, ìgbọ́ tí ń lọ lọ́wọ́, ìṣe Olúwa lórí ọkàn rẹ̀, àti fífi àfiyèsí sí ọ̀rọ̀ Pọ́ọ̀lù. Ṣùgbọ́n ‘aṣọ elése àlùkò’ kò ṣàlàyé ọjà àwọ̀-púpọ̀ náà ní Yorùbá òde òní dáadáa, ó sì lè dà bí ohun mìíràn.'
