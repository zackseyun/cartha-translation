id: ACT.16.14
reference: Acts 16:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: yo
  text: Obìnrin kan wà tí orúkọ rẹ̀ ń jẹ́ Lídíà, ará ìlú Tíátírà, ẹni tó ń ta aṣọ aláwọ̀ àlùkò, tó sì ń jọ́sìn Ọlọ́run.[a] Ó ń fetí sílẹ̀, Olúwa sì ṣí ọkàn rẹ̀ láti fiyè sí àwọn ohun tí Pọ́ọ̀lù ń sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tó jẹ́ olùjọ́sìn Ọlọ́run”; gbolohun náà lè tọ́ka sí Kèfèrí kan tó fara mọ́ Ọlọ́run Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Obìnrin kan wà
  rationale: Ó pa àìdánimọ̀ tí τις ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti mú ẹni tuntun wọ inú ìtàn ní Yorùbá.
- source_word: ὀνόματι Λυδία
  choice: tí orúkọ rẹ̀ ń jẹ́ Lídíà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún fífi orúkọ ẹni hàn.
- source_word: πορφυρόπωλις
  choice: tó ń ta aṣọ elése àlùkò
  rationale: Ọ̀rọ̀ náà tọ́ka sí oníṣòwò aṣọ tàbí ohun èlò tí a fi àwọ̀ elése àlùkò rì; ‘aṣọ elése àlùkò’ ṣe kedere láì sọ irú ọjà náà ju ohun tí Gíríìkì sọ lọ.
- source_word: πόλεως Θυατείρων
  choice: ará ìlú Tíátírà
  rationale: Ó fi ibi tí Lídíà ti wá hàn ní Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ gẹnitífù náà mọ́.
- source_word: σεβομένη τὸν θεόν
  choice: tó sì ń jọ́sìn Ọlọ́run
  rationale: Ó mú ìtumọ̀ ìbọ̀wọ̀ àti ìjọ́sìn sí Ọlọ́run jáde, láì sọ ọ́ di àmì ẹ̀ka ẹ̀sìn pàtó nínú ọ̀rọ̀ pàtàkì.
- source_word: ἤκουεν
  choice: Ó ń fetí sílẹ̀
  rationale: Àkókò imperfect Gíríìkì ń fi ìṣe tó ń bá a lọ hàn; ‘ń fetí sílẹ̀’ tún fi hàn pé kì í ṣe gbígbọ́ lásán.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Ó tẹ̀ lé ìtumọ̀ Yorùbá tó dúró ṣinṣin fún κύριος, láì fi ‘Jésù’ tàbí ‘Ọlọ́run’ kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: ṣí ọkàn rẹ̀ sílẹ̀
  rationale: Èyí pa àwòrán èdè Gíríìkì mọ́, ó sì jẹ́ gbolohun tó yé ni Yorùbá fún mímú ọkàn ṣe tán láti gba ọ̀rọ̀.
- source_word: προσέχειν
  choice: láti kíyè sí
  rationale: Ó túmọ̀ sí fífi àfiyèsí sí ohun kan; kò fi ìdáhùn tàbí ìyípadà tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà kún un.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: àwọn ohun tí Pọ́ọ̀lù ń sọ
  rationale: Ó jẹ́ Yorùbá àdánidá, ó pa aṣojú Pọ́ọ̀lù mọ́, ‘ń sọ’ sì mú ìṣe tó ń lọ lọ́wọ́ jáde.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ (ὁ κύριος) ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Gíríìkì sọ ‘Olúwa’ nìkan. Ìtumọ̀ náà kò fi ẹni tí kò sọ ní tààrà kún un, ó sì pa àyè ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ipò Lídíà nínú gbolohun σεβομένη τὸν θεόν
  choice: tó sì ń jọ́sìn Ọlọ́run
  alternative: olùjọ́sìn Ọlọ́run; ẹni tó bẹ̀rù Ọlọ́run
  rationale: Ọ̀rọ̀ pàtàkì fi ìṣe ìjọ́sìn àti ìbọ̀wọ̀ rẹ̀ hàn, nígbà tí àlàyé ìsàlẹ̀ sọ pé gbolohun náà lè jẹ́ orúkọ ìdánimọ̀ fún Kèfèrí tó fara mọ́ Ọlọ́run Ísírẹ́lì.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. ‘Elése àlùkò’ ni a lò fún àwọ̀ purple, ‘Pọ́ọ̀lù’ àti ‘Tíátírà’ sì tẹ̀ lé ìkọ̀wé orúkọ tó bójú mu ní Yorùbá.
