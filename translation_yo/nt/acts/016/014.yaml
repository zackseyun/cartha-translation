  terminology: ‘Olúwa’ pa ὁ κύριος mọ́ láì pinnu ẹni tí ọ̀rọ̀ náà kò sọ ní tààrà. ‘Tó ń jọ́sìn Ọlọ́run’ jẹ́ ìtumọ̀ tó dáa fún σεβομένη τὸν θεόν; àlàyé ìsàlẹ̀ sì dá àǹfààní ìtumọ̀ rẹ̀ gẹ́gẹ́ bí Kèfèrí olùfẹ́ Ọlọ́run Ísírẹ́lì sílẹ̀.
