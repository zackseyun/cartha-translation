  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n dé ẹ̀bá Mísíà[a], wọ́n ń gbìyànjú láti lọ sí Bítíníà, àti Ẹ̀mí Jésù kò gbà wọ́n láyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní tòsí Mísíà” tàbí “lẹ́gbẹ̀ẹ́ Mísíà.” Ó ṣeé ṣe kí gbólóhùn Gíríìkì náà tọ́ka sí dídé agbègbè ààlà Mísíà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: nígbà tí wọ́n dé
  rationale: Aorist participle náà ní ipa àkókò ní àyíká ọ̀rọ̀ yìí; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyípadà kékeré tàbí ìtakora sí ìrìn àjò tí a sọ ṣáájú hàn.
- source_word: κατὰ τὴν Μυσίαν
  choice: dé ẹ̀bá Mísíà
  rationale: κατά pẹ̀lú accusative nínú àpèjúwe ilẹ̀ lè túmọ̀ sí lẹ́gbẹ̀ẹ́, lẹ́ba, tàbí ní agbègbè ààlà; ‘ẹ̀bá Mísíà’ pa ìtumọ̀ àyè náà mọ́ láìdájọ́ pé wọ́n wọ inú Mísíà tán.
- source_word: ἐπείραζον
  choice: wọ́n ń gbìyànjú
  rationale: Imperfect náà fi ìgbìyànjú tí ó ń lọ lọ́wọ́ hàn, èyí tí ‘ń gbìyànjú’ mú jáde dáadáa.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: láti lọ sí Bítíníà
  rationale: Infinitive náà sọ ète ìrìn àjò, εἰς sì tọ́ka sí ìlọ sí inú agbègbè náà; Yorùbá máa ń lo ‘lọ sí’ lọ́nà àdánidá fún èyí.
- source_word: οὐκ εἴασεν
  choice: kò gbà wọ́n láyè
  rationale: ἐάω túmọ̀ sí láti gbà láyè tàbí fàyè gba; yíyan yìí kò lágbára ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Ẹ̀mí Jésù
  rationale: Ó pa gbólóhùn Kristọ́lójì aláìlẹ́gbẹ́ inú Gíríìkì mọ́, dípò yíyí i padà sí ‘Ẹ̀mí Mímọ́.’
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn Kristọ́lójì τὸ πνεῦμα Ἰησοῦ
  choice: Ẹ̀mí Jésù
  alternative: Ẹ̀mí Mímọ́; Ẹ̀mí náà
  rationale: Gíríìkì sọ ‘ti Jésù’ ní pàtó. Ìtumọ̀ náà gbọ́dọ̀ pa ọ̀rọ̀ yìí mọ́ láìṣe ìbámu rẹ̀ pẹ̀lú gbólóhùn tí ó wọ́pọ̀ jù tàbí fi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé gbogbo; a lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì ṣe àfọwọ́kọ orúkọ ilẹ̀ Gíríìkì gẹ́gẹ́ bí Mísíà àti Bítíníà.
