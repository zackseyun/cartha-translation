  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: yo
  text: Àwọn arákùnrin ní Lísírà àti Ikóníónì ń jẹ́rìí rere nípa rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin,” ìyẹn ni, àwọn onígbàgbọ́ ẹlẹgbẹ́ ní àwọn ìlú wọ̀nyẹn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: sí i
  rationale: Ọ̀rọ̀ arọ́pò- orúkọ náà tọ́ka padà sí Timotiu ní ẹsẹ 1; èdè Yorùbá àdánidá fi ẹni náà hàn gẹ́gẹ́ bí ẹni tí wọ́n ń jẹ́rìí rere sí.
- source_word: ἐμαρτυρεῖτο
  choice: ń jẹ́rìí rere sí i
  rationale: Ìṣe aláìpé tí ó wà ní ipò àfaragà yìí túmọ̀ sí pé Timotiu ní ẹ̀rí rere tàbí orúkọ rere láàárín wọn; gbolohun yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ẹ̀rí mọ́.
- source_word: ὑπὸ
  choice: Àwọn ... ń
  rationale: Dípò àfaragà tí kò fi bẹ́ẹ̀ jẹ́ àdánidá ní Yorùbá, a yí àwọn aṣojú tí ὑπό tọ́ka sí padà sí olùṣe nínú gbólóhùn alágbèṣe.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: ní Lísírà àti Ikóníónì
  rationale: Ó dá àwọn arákùnrin mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n wà nínú ìlú méjèèjì, láì yí i padà sí pé wọ́n wá láti ibẹ̀.
- source_word: ἀδελφῶν
  choice: Àwọn arákùnrin
  rationale: A pa irú akọ púpọ̀ Gíríìkì mọ́ ní pàtàkì, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, lókùnrin àti lóbìnrin.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφῶν fún àwùjọ Kristẹni ní ti akọ àti abo
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ púpọ̀ ní ìlànà gírámà. Ọ̀rọ̀ pàtàkì pa èyí mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣàlàyé ìlò rẹ̀ tí ó lè gba àwọn ọkùnrin àti obìnrin inú àwùjọ onígbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo gbólóhùn alágbèṣe fún àdánidá Yorùbá, nígbà tí a pa ìtumọ̀ ẹ̀rí rere àti ibi méjèèjì mọ́.
