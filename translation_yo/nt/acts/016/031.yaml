id: ACT.16.31
reference: Acts 16:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: yo
  text: Wọ́n sì wí pé, “Gba Olúwa Jésù gbọ́,[a] a ó sì gbà ọ́ là—ìwọ àti àwọn ará ilé rẹ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Fi ìgbàgbọ́ rẹ lé Olúwa Jésù.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ará ilé rẹ” ń tọ́ka sí àwọn ènìyàn inú agbo ilé rẹ, kì í ṣe ilé tí a kọ́ nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì wí pé
  rationale: δέ jẹ́ àsopọ̀ tí kò fi ìtakora líle hàn níbí; “sì” bá ìṣàn ìtàn Yorùbá mu. “Wí pé” jẹ́ ọ̀nà ọ̀wọ̀ àti àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Gba … gbọ́
  rationale: Àṣẹ aorist náà ń pe ẹni náà sí ìdáhùn pàtó. “Gba … gbọ́” ni ọ̀nà Yorùbá tí ó ṣe déédéé jù láti sọ pé kí ènìyàn ní ìgbàgbọ́ nínú ẹnì kan; ó sì fi Olúwa Jésù hàn gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ náà dojú kọ.
- source_word: κύριον Ἰησοῦν
  choice: Olúwa Jésù
  rationale: “Olúwa” pa agbára oyè κύριος àti ìtumọ̀ rẹ̀ nípa Kristi mọ́; “Jésù” ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: σωθήσῃ
  choice: a ó gbà ọ́ là
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ọ̀la aláìṣe-láti-ọ̀dọ̀ ẹni tí a dárúkọ. Ìsọ̀rọ̀ Yorùbá aláìsọ ẹni “a ó gbà ọ́ là” pa ìtumọ̀ pé ẹni náà yóò rí ìgbàlà mọ́ láìfi ẹni tó ń ṣe iṣẹ́ náà kún ọ̀rọ̀ Gíríìkì.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: ìwọ àti àwọn ará ilé rẹ
  rationale: οἶκος túmọ̀ sí àwọn ènìyàn inú agbo ilé níbí, kì í ṣe ilé gẹ́gẹ́ bí ilé tí a kọ́. “Àwọn ará ilé rẹ” jẹ́ èdè Yorùbá àdánidá tí ó pa ìwọ̀n ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìwọ̀n ìlérí náà nípa “ìwọ àti àwọn ará ilé rẹ”
  choice: A túmọ̀ gbólóhùn náà ní tààrà, láìsọ pé ìgbàgbọ́ olùṣọ́ túbú nìkan mú ìgbàlà àwọn ará ilé rẹ̀ wá láìsí ìgbàgbọ́ tiwọn.
  alternative: Kí a túmọ̀ ọ́ bí ìgbàlà gbogbo agbo ilé nípasẹ̀ ìgbàgbọ́ olórí ilé nìkan, tàbí kí a dín ọ̀rọ̀ náà kù sí olúkúlùkù débi pé a kò fi agbo ilé náà sí.
  rationale: Gíríìkì fi olùṣọ́ túbú àti àwọn ará ilé rẹ̀ sínú gbólóhùn ìlérí náà, ṣùgbọ́n ẹsẹ yìí nìkan kò sọ bí ìgbàlà olúkúlùkù wọn ṣe ní í ṣe pẹ̀lú ìgbàgbọ́. Ìtumọ̀ náà pa àìdánilójú yìí mọ́, kò sì gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọ inú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè. Gbólóhùn “a ó gbà ọ́ là” tẹ̀lé ìlò Yorùbá àdánidá fún ọ̀rọ̀ aláìṣe-láti-ọ̀dọ̀ ẹni tí a dárúkọ, nígbà tí “àwọn ará ilé” yà agbo ènìyàn sọ́tọ̀ kúrò ní ilé gẹ́gẹ́ bí ohun tí a kọ́.
