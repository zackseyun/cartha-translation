source:
  edition: SBLGNT
  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn náà sì dìde papọ̀ lòdì sí wọn[a]. Àwọn aláṣẹ ìlú[b] sì fa aṣọ àwọn méjèèjì náà kúrò lára wọn, wọ́n sì ń pàṣẹ pé kí a fi ọ̀pá nà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “kóra jọ láti kọlu wọn.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ìgbésẹ̀ ìṣọ̀tá tí ọ̀pọ̀ ènìyàn náà jọ gbé.
    reason: lexical_alternative
  - marker: b
    text: Àwọn tí a pè ní “aláṣẹ ìlú” jẹ́ àwọn aláṣẹ ìjọba Róòmù ní Fílípì; ní ọ̀rọ̀ ìmọ̀-ẹ̀rọ, a lè pè wọ́n ní “praetors.”
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: dìde papọ̀ sí wọn
  rationale: Ọ̀rọ̀-ìṣe náà ṣọ̀kan èrò dídìde tàbí kíkóra jọ àti ìgbésẹ̀ ọ̀tá; “dìde papọ̀ sí wọn” pa àwọn méjèèjì mọ́ láì fi kún un pé wọ́n ti bẹ̀rẹ̀ sí í lù wọ́n.
- source_word: ὄχλος
  choice: àwọn ènìyàn náà
  rationale: Ní Yorùbá àdánidá, gbólóhùn yìí tọ́ka sí ọ̀pọ̀ ènìyàn tí ó kóra jọ; kò fi ìtumọ̀ líle ti “ẹgbẹ́ oníjàngbọ̀n” kún ọ̀rọ̀ Gíríìkì.
- source_word: κατ’ αὐτῶν
  choice: sí wọn
  rationale: Pẹ̀lú “dìde,” ọ̀nà àdánidá Yorùbá láti sọ ìgbésẹ̀ ọ̀tá ni “dìde sí wọn.”
- source_word: στρατηγοὶ
  choice: àwọn aláṣẹ ìlú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn olórí ìjọba ìlú Fílípì tó ń ṣe iṣẹ́ àṣẹ Róòmù. “Àwọn aláṣẹ ìlú” ṣe kedere fún òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ fi oyè pàtó wọn hàn.
- source_word: περιρήξαντες
  choice: ya ... kúrò lára wọn
  rationale: Ó fi hàn pé àwọn aláṣẹ já aṣọ náà kúrò lára Paulu àti Sílà kí wọ́n tó pàṣẹ ìlù náà; ìtẹ̀lé àwọn ìṣe náà hàn kedere nínú Yorùbá.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: aṣọ wọn
  rationale: Èyí pa arọ́pò-orúkọ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ aṣọ tí wọ́n wọ̀ láì sọ ọ́ di aṣọ irú kan pàtó.
- source_word: ἐκέλευον
  choice: wọ́n sì ń pàṣẹ
  rationale: “Ń pàṣẹ” pa ìrísí àìparí ti ọ̀rọ̀-ìṣe Gíríìkì mọ́, ó sì fi ìṣe tó ń lọ nínú ìṣẹ̀lẹ̀ náà hàn.
- source_word: ῥαβδίζειν
  choice: kí a fi ọ̀pá lù wọ́n
  rationale: Ọ̀rọ̀ náà sọ ìjìyà lílù pẹ̀lú ọ̀pá ní pàtó; ìtumọ̀ yìí ṣe kedere, kò sì dà á pọ̀ mọ́ lílù pẹ̀lú pàṣán.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A pa agbára ìgbésẹ̀ àpapọ̀ nínú συνεπέστη àti ìṣe tó ń lọ nínú ἐκέλευον mọ́. Arọ́pò-orúkọ “wọn” nínú “aṣọ wọn” pa ìṣètò ọ̀rọ̀ orísun mọ́, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé aṣọ Paulu àti Sílà ni.
