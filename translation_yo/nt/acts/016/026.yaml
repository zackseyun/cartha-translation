revisions:
- from: Lójijì, ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, tó bẹ́ẹ̀ tí àwọn ìpìlẹ̀ ilé ẹ̀wọ̀n[a] fi mì; lẹ́sẹ̀kẹsẹ̀, gbogbo àwọn ilẹ̀kùn ṣí sílẹ̀, àwọn ìdè gbogbo wọn sì tú[b].
  to: Lójijì, ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, débi pé àwọn ìpìlẹ̀ ilé ẹ̀wọ̀n[a] mì; lẹ́sẹ̀kẹsẹ̀, gbogbo àwọn ilẹ̀kùn ṣí sílẹ̀, àwọn ìdè gbogbo àwọn ènìyàn sì tú[b].
  rationale: A tún ọ̀rọ̀ ìdè ṣe sí “àwọn ìdè gbogbo àwọn ènìyàn” kí ìtọ́kasí genitive πάντων má bàa dàrú pẹ̀lú “àwọn ilẹ̀kùn.” A tún “tó bẹ́ẹ̀ tí” ṣe sí “débi pé” fún ìṣàn Yorùbá tí ó rọrùn, láìyí ìbáṣepọ̀ àbájáde ὥστε padà. Àwọn àmì ẹsẹ̀ ìsàlẹ̀ wà níbi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé wà.
