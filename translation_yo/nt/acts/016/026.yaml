translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìṣètò gbólóhùn náà tẹ̀ lé ìṣàn ìtàn Gíríìkì: ìṣẹ̀lẹ̀ àìròtẹ́lẹ̀, àbájáde rẹ̀ lórí ìpìlẹ̀ ilé, lẹ́yìn náà ìṣí ilẹ̀kùn àti títú àwọn ìdè.'
