source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: yo
  text: Lójijì, ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, débi pé àwọn ìpìlẹ̀ ilé ẹ̀wọ̀n[a] mì; lẹ́sẹ̀kẹsẹ̀, gbogbo àwọn ilẹ̀kùn ṣí sílẹ̀, àwọn ìdè gbogbo àwọn ènìyàn sì tú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú δεσμωτήριον sí “ọgbà ẹ̀wọ̀n,” ìyẹn ibi tí a ti ń fi àwọn ẹlẹ́wọ̀n sí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u sí “àwọn ṣẹ́kẹ́ṣẹkẹ̀ gbogbo àwọn ènìyàn sì tú.” Ọ̀rọ̀ Gíríìkì δεσμά lè túmọ̀ sí “ìdè” tàbí “ṣẹ́kẹ́ṣẹkẹ̀,” ἀνέθη sì lè túmọ̀ sí pé wọ́n tú tàbí pé wọ́n di àìdì mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Lójijì
  rationale: Ó fi hàn pé ohun náà ṣẹlẹ̀ láìròtẹ́lẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtàn.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀
  rationale: Èyí túmọ̀ ìṣẹ̀lẹ̀ náà ní kedere, ó sì pa ìtumọ̀ μέγας mọ́ láìfi ohun tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ὥστε σαλευθῆναι
  choice: tó bẹ́ẹ̀ tí ... fi mì
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí sọ àbájáde tí ὥστε ń tọ́ka sí, ó sì mú ìṣe ìmì náà jáde lọ́nà àdánidá.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: àwọn ìpìlẹ̀ ilé ẹ̀wọ̀n
  rationale: “Ìpìlẹ̀” ń tọ́ka sí àwọn apá ìdásílẹ̀ ilé, “ilé ẹ̀wọ̀n” sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi tí a ti ń fi àwọn ẹlẹ́wọ̀n sí.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: gbogbo àwọn ilẹ̀kùn ṣí sílẹ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tí ó pa gbogbo iye àwọn ilẹ̀kùn àti àbájáde ìṣí wọn mọ́, láìsọ ẹni tó ṣí wọn.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó túmọ̀ pé ohun náà ṣẹlẹ̀ ní kíákíá, láìsí ìdádúró.
- source_word: πάντων τὰ δεσμὰ
  choice: àwọn ìdè gbogbo wọn
  rationale: Gbólóhùn yìí fi hàn pé àwọn ìdè náà jẹ́ ti gbogbo àwọn tí ó wà níbẹ̀, ó sì yẹra fún fífi “ṣẹ́kẹ́ṣẹkẹ̀” múlẹ̀ nígbà tí δεσμά lè ní ìtumọ̀ tó gbòòrò.
- source_word: ἀνέθη
  choice: tú
  rationale: “Tú” sọ pé àwọn ìdè náà di àìdì mọ́, láìfi ìtumọ̀ míì kún un pé gbogbo àwọn ẹlẹ́wọ̀n jáde tàbí pé a dá wọn sílẹ̀ ní kíkún.
