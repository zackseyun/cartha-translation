base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: yo
  text: Nígbà náà, ó béèrè fún àwọn ìmọ́lẹ̀, ó sì wọlé lọ́fàá[a]. Nígbà tí ìbẹ̀rù mú un wárìrì, ó wolẹ̀ níwájú Pọ́ọ̀lù àti Sílà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wọlé ní ìfẹ̀sì.” Ọ̀rọ̀ Gíríìkì náà ń fi ìwọlé ojijì àti alágbára hàn.
    reason: lexical_alternative
  - marker: b
    text: Ìwolẹ̀ yìí lè fi ìbẹ̀rù, ẹ̀bẹ̀, tàbí ìtẹríba hàn; kò pọn dandan kí ó túmọ̀ sí pé ó ń jọ́sìn fún wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kò sì fi ìtakora líle hàn.
- source_word: αἰτήσας
  choice: ó ní kí wọ́n mú ... wá
  rationale: Aorist participle náà tọ́ka sí ohun tí ó kọ́kọ́ ṣe; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé ó béèrè ohun náà lọ́wọ́ àwọn ẹlòmíràn.
- source_word: φῶτα
  choice: àwọn ìmọ́lẹ̀
  rationale: Ọ̀pọ̀ φῶς túmọ̀ sí ohun èlò ìtanmọ́lẹ̀ lápapọ̀; a kò fi kún un pé fìtílà tàbí ògùṣọ̀ ni.
- source_word: εἰσεπήδησεν
  choice: ó yára wọlé
  rationale: Ọ̀rọ̀ náà ń fi ìwọlé òjijì, alágbára hàn; ‘yára wọlé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì sọ pé ó fò ní ti gidi.
- source_word: ἔντρομος γενόμενος
  choice: Pẹ̀lú ìbẹ̀rù àti ìwárìrì
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ṣàpèjúwe ẹni tí ìbẹ̀rù mú tó sì ń wárìrì; ìtumọ̀ yìí pa ẹ̀dùn ọkàn àti ìfarahàn ara mọ́.
- source_word: προσέπεσεν
  choice: ó wolẹ̀ níwájú
  rationale: Ó fi ìṣubú tàbí ìwolẹ̀ síwájú ẹnìkan hàn nítorí ìbẹ̀rù, ẹ̀bẹ̀, tàbí ọ̀wọ̀, láì fi ìjọsìn kún ọ̀rọ̀ náà.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: níwájú Paulu àti Sila
  rationale: Dative lẹ́yìn προσπίπτω jẹ́ kí ‘níwájú’ bá èdè Yorùbá mu, láì fi ‘lẹ́sẹ̀’ kún ohun tí Gíríìkì kò sọ ní pàtó.
theological_decisions:
- issue: Irú ìṣe tí olùṣọ́ ẹ̀wọ̀ ṣe sí Paulu àti Sila
  choice: Ó wolẹ̀ níwájú wọn nítorí ìbẹ̀rù àti ìtẹríba, láì pè é ní ìjọsìn.
  alternative: Ó foríbalẹ̀ jọ́sìn fún Paulu àti Sila.
  rationale: προσέπεσεν lè jẹ́ ìwolẹ̀ nítorí ẹ̀bẹ̀, ìbẹ̀rù, tàbí ọ̀wọ̀; àyíká kò béèrè pé kí a túmọ̀ ìṣe náà sí ìjọsìn.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. A yà àwọn ìṣe náà sí gbólóhùn méjì fún ìṣàn ọ̀rọ̀ tó mọ́, láì yí ìtẹ̀síwájú ìṣẹ̀lẹ̀ Gíríìkì padà.
