id: ACT.16.21
reference: Acts 16:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: yo
  text: Wọ́n sì ń kéde àwọn àṣà tí kò bófin mu fún wa láti gbà tàbí láti ṣe, nítorí pé ará Róòmù ni wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn náà sí “gẹ́gẹ́ bí ará Róòmù” tàbí “ní ipò ará Róòmù.” Àpólà Gíríìkì náà sọ ìdí tí àwọn olùfisùn fi ní kò bófin mu fún wọn láti gba tàbí láti ṣe àwọn àṣà wọ̀nyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wọ́n sì
  rationale: “Sì” so ẹ̀sùn yìí mọ́ ọ̀rọ̀ ẹsẹ tó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: καταγγέλλουσιν
  choice: ń kéde
  rationale: Ó fi ìṣe tí wọ́n ń fẹ̀sùn kàn wọ́n pé ó ń lọ lọ́wọ́ hàn, ó sì pa ìtumọ̀ ìkéde ní gbangba mọ́ láìfi ìtumọ̀ ‘kọ́ni’ kún un.
- source_word: ἔθη
  choice: àwọn àṣà
  rationale: “Àṣà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìṣe tàbí ìlànà tí ẹgbẹ́ ènìyàn ti fi lélẹ̀.
- source_word: οὐκ ἔξεστιν
  choice: tí kò bófin mu fún
  rationale: Ọ̀rọ̀ yìí pa ìrísí ẹ̀sùn tó dá lórí òfin tàbí ohun tí a fàyè gbà mọ́, láìsọ pé ẹ̀sùn náà jẹ́ òótọ́.
- source_word: παραδέχεσθαι
  choice: láti gbà
  rationale: “Gbà” lè túmọ̀ sí fífẹ̀sẹ̀ mú àṣà náà gẹ́gẹ́ bí ohun tó yẹ, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: οὐδὲ ποιεῖν
  choice: tàbí láti máa ṣe
  rationale: Ní ìbámu pẹ̀lú ἔθη, “máa ṣe” túmọ̀ sí fífi àṣà náà sí ìṣe; “tàbí” ṣe àfihàn ìsopọ̀ odi lẹ́yìn “kò.”
- source_word: Ῥωμαίοις οὖσιν
  choice: fún àwa ará Róòmù
  rationale: Àgbékalẹ̀ yìí jẹ́ èdè Yorùbá tó rọrùn, ó sì pa ìdí tí àwọn olùfisùn fi sọ pé wọn kò lè gba tàbí ṣe àṣà náà mọ́.
theological_decisions:
- issue: Irú ìdènà inú ẹ̀sùn náà
  choice: Lo èdè òfin pé “kò bófin mu fún” láìjẹ́rìí sí i pé ẹ̀sùn náà bá òfin Róòmù mu ní tòótọ́.
  alternative: “kò tọ́ fún wa” tàbí “a kò fàyè gbà wá”
  rationale: Ẹsẹ náà ń ròyìn ọ̀rọ̀ àwọn olùfisùn, kì í ṣe ìdájọ́ Lúùkù nípa ohun tí òfin Róòmù sọ.
- issue: Ìtumọ̀ Ῥωμαίοις οὖσιν
  choice: 'Fi hàn gẹ́gẹ́ bí ìdí tí àwọn olùfisùn gbé kalẹ̀: “fún àwa ará Róòmù.”'
  alternative: “nítorí pé ará Róòmù ni wá” tàbí “gẹ́gẹ́ bí ará Róòmù”
  rationale: Àpólà aláìlẹ́gbẹ́ Gíríìkì náà lè ṣe àfihàn ìdí tàbí ipò; àkọsílẹ̀ pàtàkì yan ọ̀nà Yorùbá tó ṣókí, àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “àwa” láti tẹ ìdánimọ̀ àwọn olùfisùn gẹ́gẹ́ bí ará Róòmù mọ́lẹ̀, àti “àwọn àṣà” láti pa ìtumọ̀ civic-religious tó gbooro mọ́.
