id: ACT.16.16
reference: Acts 16:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí àwa ti ń lọ sí ibi àdúrà, ọmọbìnrin ẹrú kan tí ó ní ẹ̀mí Pítónì[a] pàdé wa; ó sì ń mú èrè púpọ̀ wá fún àwọn ọ̀gá rẹ̀ nípa ṣíṣe àfọ̀ṣẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí àfọ̀ṣẹ́.” Ní tààràtà, èdè Gíríìkì ní “ẹ̀mí Pítónì,” ọ̀rọ̀ àṣà pàtó kan tó ní í ṣe pẹ̀lú ìṣiṣẹ́ àfọ̀ṣẹ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nípa wíwòṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà àbáwọlé ìtàn tí ó bójú mu ní Yorùbá òde òní, tí ó sì pa agbára ìyípadà ìtàn Gíríìkì mọ́ láì lo èdè àtijọ́.
- source_word: πορευομένων ἡμῶν
  choice: bí àwa ti ń lọ
  rationale: Ó fi hàn pé ìrìn náà ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ pàtàkì ṣẹlẹ̀, ó sì pa ‘àwa’ tí ó hàn gbangba nínú orísun mọ́.
- source_word: εἰς τὴν προσευχὴν
  choice: sí ibi àdúrà
  rationale: Nínú àyíká Ìṣe Àwọn Aposteli, gbólóhùn náà lè tọ́ka sí ibi tí a ti ń péjọ fún àdúrà, kì í ṣe ìṣe àdúrà nìkan.
- source_word: παιδίσκην τινά
  choice: ọmọbìnrin ẹrú kan
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ọmọbìnrin ìránṣẹ́ tàbí ẹrú; mẹ́nuba àwọn ọ̀gá rẹ̀ àti èrè tí wọ́n ń rí lára rẹ̀ mú kí ipò ẹrú rẹ̀ ṣe pàtàkì níbí.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: tí ó ní ẹ̀mí Pítónì
  rationale: Èyí pa ọ̀rọ̀ àṣà pàtó πύθωνα mọ́ gẹ́gẹ́ bí orúkọ Pítónì, dípò yíyí i padà sí ìtumọ̀ iṣẹ́ rẹ̀ nìkan.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: pàdé wa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó rọrùn, tó sì fi ìpàdé tàbí ìdojúkọ náà hàn.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: ń mú èrè púpọ̀ wá
  rationale: Ó sọ àǹfààní owó tó pọ̀ tí àwọn ọ̀gá náà ń rí, ó sì pa ìṣe tí ń bá a lọ nínú àkókò àtijọ́ mọ́.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: fún àwọn ọ̀gá rẹ̀
  rationale: Ní àyíká yìí κύριοι túmọ̀ sí àwọn tí wọ́n ní àṣẹ àti ìní lórí ọmọbìnrin náà, kì í ṣe oyè Ọlọ́run.
- source_word: μαντευομένη
  choice: nípa wíwoṣẹ́
  rationale: ‘Wíwoṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún iṣẹ́ ṣíṣe àsọtẹ́lẹ̀ nípa agbára òkùnkùn tàbí iṣẹ́ awo; àlàyé ìsàlẹ̀ fi ọ̀nà míì hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πνεῦμα πύθωνα, ọ̀rọ̀ àṣà Gíríìkì tó ní í ṣe pẹ̀lú àsọtẹ́lẹ̀ awo
  choice: ẹ̀mí Pítónì
  alternative: ẹ̀mí wíwoṣẹ́
  rationale: A pa orúkọ àṣà pàtó inú Gíríìkì mọ́ nínú ẹsẹ̀, kí a má bàa sọ ìtumọ̀ rẹ̀ di ọ̀kan ṣoṣo; àlàyé ìsàlẹ̀ sọ ìtumọ̀ iṣẹ́ rẹ̀.
- issue: Bóyá παιδίσκη yẹ kí ó fi ipò ẹrú hàn
  choice: ọmọbìnrin ẹrú
  alternative: ọmọbìnrin ìránṣẹ́
  rationale: Ọ̀pọ̀ ọ̀gá tí wọ́n ń jèrè lára rẹ̀ fi ìṣàkóso àti lílo rẹ̀ fún èrè hàn; ‘ọmọbìnrin ẹrú’ mú òtítọ́ àwùjọ yẹn jáde kedere.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye ni a lò. A lo ‘àwa’ láti pa ohùn ẹni àkọ́kọ́ ọ̀pọ̀ mọ́; ‘Pítónì’ ni a kọ gẹ́gẹ́ bí orúkọ àṣà, pẹ̀lú àlàyé fún òǹkàwé.
