- from: Ó sì ṣẹlẹ̀ pé, bí àwa ti ń lọ sí ibi àdúrà, ọmọbìnrin ẹrú kan tí ó ní ẹ̀mí Pítónì[a] pàdé wa. Ó sì ń mú èrè púpọ̀ wá fún àwọn ọ̀gá rẹ̀ nípa wíwoṣẹ́[b].
  to: Ó sì ṣẹlẹ̀ pé, bí àwa ti ń lọ sí ibi àdúrà, ọmọbìnrin ẹrú kan tí ó ní ẹ̀mí Pítónì[a] pàdé wa; ó sì ń mú èrè púpọ̀ wá fún àwọn ọ̀gá rẹ̀ nípa ṣíṣe àfọ̀ṣẹ́[b].
