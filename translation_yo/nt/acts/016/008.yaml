  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: yo
  text: Wọ́n kọjá Mísíà lọ[a], wọ́n sì sọ̀kalẹ̀ lọ sí Tíròásì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “lẹ́yìn tí wọ́n ti gba Mísíà kọjá” tàbí “nígbà tí wọ́n ń kọjá Mísíà.” Participle Gíríìkì náà ní àwọn ìtumọ̀ tí ó sún mọ́ra; ó lè tọ́ka sí lílọ kọjá agbègbè náà tàbí lílọ gba inú rẹ̀ kọjá.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: kọjá lẹ́gbẹ̀ẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist ti παρέρχομαι pẹ̀lú Μυσίαν gẹ́gẹ́ bí ohun tí ìṣe náà kan. “Kọjá lẹ́gbẹ̀ẹ́” fi hàn pé wọ́n tẹ̀ síwájú láìdúró ní agbègbè náà, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ tó sún mọ́ ọn mọ́.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú ìtàn; “sì” so ẹsẹ yìí mọ́ ohun tó ṣáájú láìfi ìtakora líle kún un.
- source_word: Μυσίαν
  choice: Mísíà
  rationale: Orúkọ agbègbè ni; a kọ ọ́ ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Gíríìkì ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: κατέβησαν
  choice: wọ́n sọ̀kalẹ̀ lọ
  rationale: Ìṣe aorist ti καταβαίνω ni, ó sì pa ìdarí sísọ̀kalẹ̀ mọ́; ó lè tọ́ka sí lílọ sí etíkun tàbí sí ibi tó rẹlẹ̀.
- source_word: εἰς
  choice: sí
  rationale: Pẹ̀lú ibi tí wọ́n ń lọ, “sí” ni ọ̀nà Yorùbá tó ṣe déédéé jù láti túmọ̀ εἰς.
- source_word: Τρῳάδα
  choice: Tíróásì
  rationale: Orúkọ ibi ni; a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìró orúkọ Gíríìkì àti ìṣàmì-ohùn Yorùbá.
