- from: Nígbà tí wọ́n sì kọjá lẹ́gbẹ̀ẹ́ Mísíà[a], wọ́n sọ̀kalẹ̀ lọ sí Tíróásì.
  to: Wọ́n kọjá Mísíà lọ[a], wọ́n sì sọ̀kalẹ̀ lọ sí Tíròásì.
  rationale: A rọ́pò ọ̀nà tí ó lè túmọ̀ sí lílọ ní ẹ̀gbẹ́ agbègbè kan pẹ̀lú ọ̀rọ̀ Yorùbá tí ó dáa jù fún ‘passing Mysia/passing by Mysia.’ A lo gbolóhùn ìṣe tó ṣáájú (“Wọ́n kọjá... lọ”) láti ṣàfihàn participle aorist láìfi ìbáṣepọ̀ àsìkò tó le jù kún un. A sì mú àlàyé ìsàlẹ̀ ojú ìwé padà sí ìtúmọ̀ ọ̀rọ̀, dípò ìpinnu ìtumọ̀ látinú àyíká.
