translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “nígbà tí” láti fi ìbáṣepọ̀ participle náà hàn lọ́nà àdánidá, “sì” fún àsopọ̀ pẹ̀lẹ́, àti àwọn àmì ohùn níbi tí ó bá yẹ.
