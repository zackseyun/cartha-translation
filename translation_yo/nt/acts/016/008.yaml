  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtọ́sọ́nà ìṣe καταβαίνω (‘sọ̀kalẹ̀ lọ’) àti ibi àfojúsùn náà dáadáa. Ṣùgbọ́n “kọjá lẹ́gbẹ̀ẹ́ Mísíà” lè túmọ̀ sí rírìn ní ẹ̀gbẹ́ agbègbè náà dípò lílọ kọjá a; “kọjá Mísíà lọ” ṣàfihàn παρέρχομαι pẹ̀lú ohun-ìṣe accusative dáadáa síi. Ìtumọ̀ participle aorist gẹ́gẹ́ bí ìṣe tó ṣáájú ìṣe pàtàkì náà tún wúlò jù ‘Nígbà tí’ lọ nínú ẹsẹ̀ yìí.
  naturalness: 'Àtúnṣe náà jẹ́ Yorùbá òde òní tó rọrùn, ó sì ń ṣètò àwọn ìṣe méjèèjì nínú ọ̀nà ìtàn tí ó dára: wọ́n kọjá Mísíà lọ, lẹ́yìn náà wọ́n sọ̀kalẹ̀ lọ sí Tíròásì.'
