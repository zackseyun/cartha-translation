id: ACT.16.12
reference: Acts 16:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: yo
  text: Láti ibẹ̀, a lọ sí Fílípì[a], tí í ṣe ìlú pàtàkì kan ní agbègbè Makedóníà, ìlú amúnisìn ti Róòmù[b]. A sì dúró ní ìlú yìí fún ọjọ́ mélòó kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú àkọ́kọ́ ní agbègbè Makedóníà.” Gbólóhùn Gíríìkì náà ṣòro; “àkọ́kọ́” lè tọ́ka sí ipò, òkìkí, tàbí ìtẹ̀lé.
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni pé, ìlú kólónì ti Róòmù, ìlú tí Róòmù fún ní ipò àti ẹ̀tọ́ pàtàkì lábẹ́ àkóso rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: láti ibẹ̀ sì lọ
  rationale: Ó so ìrìnàjò yìí mọ́ ọ̀nà tí a ti ń rìn ṣáájú. A fi “lọ” kún un ní Yorùbá kí gbólóhùn ìrìnàjò lè péye, bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe tuntun ní Gíríìkì.
- source_word: εἰς Φιλίππους
  choice: sí Fílípì
  rationale: εἰς pẹ̀lú orúkọ ìlú ń tọ́ka sí ibi tí wọ́n ń lọ; “sí” ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá. “Fílípì” jẹ́ ìkọ̀wé orúkọ ibẹ̀ ní Yorùbá.
- source_word: ἥτις
  choice: tí í ṣe
  rationale: Ó bẹ̀rẹ̀ àlàyé nípa Fílípì; “tí í ṣe” mú ìtumọ̀ àfikún náà jáde lọ́nà àdánidá.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: ọ̀kan lára àwọn ìlú pàtàkì ní agbègbè Makedóníà
  rationale: Gbólóhùn Gíríìkì náà ṣòro, πρώτη sì lè tọ́ka sí ipò ọlá, ìjẹ́-olórí, tàbí ìtẹ̀lé. “Ọ̀kan lára àwọn ìlú pàtàkì” fi ìtumọ̀ ọlá hàn láì sọ pé Fílípì ni olú ìlú tàbí ìlú àkọ́kọ́ ní pàtó.
- source_word: κολωνία
  choice: ìlú abẹ́ àkóso Róòmù
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ipò òfin Fílípì gẹ́gẹ́ bí colonia Róòmù. Ìtumọ̀ yìí jẹ́ kó ṣeé lóye fún òǹkàwé Yorùbá, àkọsílẹ̀ ìsàlẹ̀ sì ṣàlàyé ipò pàtàkì náà.
- source_word: ἦμεν ... διατρίβοντες
  choice: A sì dúró
  rationale: Ìṣọ̀kan ọ̀rọ̀-ìṣe náà fi ìgbé pẹ̀lú ìtẹ̀síwájú hàn; “dúró” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún lílo àkókò ní ibi kan.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: ní ìlú yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka ταύτῃ mọ́ ní ọ̀nà àdánidá.
- source_word: ἡμέρας τινάς
  choice: fún ọjọ́ mélòó kan
  rationale: Ó fi àkókò tí a kò sọ iye rẹ̀ pàtó hàn, láì pinnu pé ó jẹ́ ọjọ́ díẹ̀ gan-an tàbí ọ̀pọ̀ ọjọ́.
theological_decisions:
- issue: Ìtumọ̀ πρώτη nínú àpèjúwe Fílípì
  choice: ọ̀kan lára àwọn ìlú pàtàkì
  alternative: ìlú àkọ́kọ́ ní agbègbè Makedóníà
  rationale: Ọ̀rọ̀ náà kì í ṣe ọ̀ràn ẹ̀kọ́ ìgbàgbọ́, ṣùgbọ́n ó ní ìṣòro ìtàn àti ìtumọ̀ gírámà. Àṣàyàn yìí pa èrò ipò ọlá mọ́ láì sọ ìtumọ̀ kan ṣoṣo di dandan; àkọsílẹ̀ [a] sì pa àṣàyàn “ìlú àkọ́kọ́” mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. A yan “ìlú abẹ́ àkóso Róòmù” dípò gbígbé ọ̀rọ̀ àjèjì “kọ́lónì” wọlé, a sì lo àkọsílẹ̀ láti ṣàlàyé ipò òfin náà.
