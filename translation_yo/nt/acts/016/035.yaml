id: ACT.16.35
reference: Acts 16:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́, àwọn aláṣẹ ìlú rán àwọn tí ń gbé ọ̀pá àṣẹ[a] lọ, wọ́n ní, “Tú àwọn ọkùnrin wọ̀nyẹn sílẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè pè wọ́n ní “líkítọ̀,” ìyẹn àwọn òṣìṣẹ́ tí ń tẹ̀ lé àwọn aláṣẹ Róòmù, tí wọ́n sì ń gbé ọ̀pá gẹ́gẹ́ bí àmì àṣẹ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Ó jẹ́ gbólóhùn àkókò tí ó ń sàmì sí ìyípadà sí òwúrọ̀; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘nígbà tí ọjọ́ dé’ mọ́.
- source_word: ἀπέστειλαν
  choice: rán ... lọ
  rationale: Ìṣe náà túmọ̀ sí pé àwọn aláṣẹ fi àwọn aṣojú ránṣẹ́; ‘rán ... lọ’ ṣe kedere, ó sì bá èdè Yorùbá mu.
- source_word: στρατηγοὶ
  choice: àwọn aláṣẹ ìlú
  rationale: Ní Fílípì, ọ̀rọ̀ náà ń tọ́ka sí àwọn òṣìṣẹ́ gíga ti ìjọba ìlú Róòmù, kì í ṣe àwọn ọ̀gágun; ‘àwọn aláṣẹ ìlú’ yé òǹkàwé òde òní, kò sì dín iṣẹ́ wọn kù sí ti adájọ́ nìkan.
- source_word: ῥαβδούχους
  choice: àwọn tí ń gbé ọ̀pá àṣẹ
  rationale: Ó pa àwòrán gidi ti àwọn òṣìṣẹ́ tí ń gbé ọ̀pá gẹ́gẹ́ bí àmì àṣẹ mọ́, ó sì ṣeé lóye ju lílo orúkọ iṣẹ́ Róòmù tí kò wọ́pọ̀ lọ.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ó mú ọ̀rọ̀ tí àwọn aláṣẹ fi rán wọn jáde ní ọ̀nà Yorùbá àdánidá, nígbà tí ó ṣì pa ìsopọ̀ pẹ̀lú ohun tí wọ́n rán wọn sọ mọ́.
- source_word: Ἀπόλυσον
  choice: Tú ... sílẹ̀
  rationale: Àṣẹ náà ni pé kí a dá àwọn ẹlẹ́wọ̀n sílẹ̀; gbólóhùn yìí bá ipò àhámọ́ mu, ó sì jẹ́ àṣẹ tààrà.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: àwọn ọkùnrin wọ̀nyẹn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí Pọ́ọ̀lù àti Sílà, àwọn ọkùnrin méjì; yíyan ‘àwọn ọkùnrin’ pa ìtọ́kasí náà mọ́.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ó jẹ́ èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní; àlàyé nípa ipò iṣẹ́ Róòmù wà nínú àlàyé ìsàlẹ̀ dípò fífi ọ̀rọ̀ àjèjì sínú ẹsẹ náà.
