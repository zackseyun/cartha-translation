id: ACT.16.15
reference: Acts 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: yo
  text: Nígbà tí òun àti àwọn ará ilé rẹ̀ sì gba ìbatisí, ó rọ̀ wá pé, “Bí ẹ bá ti kà mí sí ẹni olóòótọ́ sí Olúwa[a], ẹ wọ ilé mi, kí ẹ sì dúró síbẹ̀.” Ó sì rọ̀ wá gidigidi títí a fi gbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹ bá ka mí sí onígbàgbọ́ nínú Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “olóòótọ́,” “ẹni tí a lè gbẹ́kẹ̀ lé,” tàbí “onígbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí ... sì
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti ìtumọ̀ àkókò hàn lọ́nà àdánidá ní Yorùbá, láìsọ δέ di ohun tó lágbára ju bí ó ti rí lọ.
- source_word: ἐβαπτίσθη
  choice: gba ìbatisí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá láti sọ ìṣe tí ẹni kan gbà ní Yorùbá, ó sì pa ìtumọ̀ ìṣe àìsọ ẹni tó ṣe é mọ́.
- source_word: ὁ οἶκος αὐτῆς
  choice: àwọn ará ilé rẹ̀
  rationale: Níhìn-ín οἶκος ń tọ́ka sí àwọn tó wà nínú agbo ilé rẹ̀, kì í ṣe ilé gẹ́gẹ́ bí ibi tí a ń gbé.
- source_word: παρεκάλεσεν
  choice: ó rọ̀ wá
  rationale: παρακαλέω níhìn-ín jẹ́ ìpè pẹ̀lú ìrọ̀lẹ́kún tàbí ìtẹnumọ́; ‘rọ̀’ mú agbára yẹn jáde lọ́nà tó wọ́pọ̀ ní Yorùbá.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Bí ẹ bá ti kà mí sí ẹni olóòótọ́ sí Olúwa
  rationale: ‘Bá ti kà’ fi ipò àbájáde perfect κεκρίκατέ hàn, ‘olóòótọ́ sí Olúwa’ sì pa ìtumọ̀ ìṣòtítọ́, jíjẹ́ ẹni ìgbẹ́kẹ̀lé, àti jíjẹ́ onígbàgbọ́ mọ́ láìfi tipátipá yan ọ̀kan ṣoṣo.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου
  choice: ẹ wọ ilé mi
  rationale: Ní ìṣẹ̀lẹ̀ yìí οἶκος túmọ̀ sí ilé gẹ́gẹ́ bí ibùgbé, participle náà sì ń ṣiṣẹ́ gẹ́gẹ́ bí ìpè láti wọlé.
- source_word: μένετε
  choice: kí ẹ sì dúró síbẹ̀
  rationale: Ó túmọ̀ sí kí wọ́n máa gbé ní ilé Lídíà fún àkókò kan, kì í ṣe pé kí wọ́n kàn dúró lórí ẹsẹ̀.
- source_word: παρεβιάσατο ἡμᾶς
  choice: Ó sì rọ̀ wá gidigidi títí a fi gbà
  rationale: Ó fi ìtẹnumọ́ líle ti παραβιάζομαι hàn láìdábàá pé ó fi ipá ti ara mú wọn.
theological_decisions:
- issue: Ohun tí ìbatisí àwọn ará ilé Lídíà lè túmọ̀ sí nínú àríyànjiyàn ẹ̀kọ́ ìsìn
  choice: Túmọ̀ ìròyìn náà tààrà pé òun àti àwọn ará ilé rẹ̀ gba ìbatisí, láìsọ ọjọ́ orí tàbí ipò ìgbàgbọ́ ẹnì kọ̀ọ̀kan.
  alternative: Ṣe àfihàn pé àwọn ọmọ ọwọ́ wà níbẹ̀, tàbí pé gbogbo wọn jẹ́wọ́ ìgbàgbọ́ fúnra wọn.
  rationale: Ẹsẹ̀ náà kò sọ irú àwọn tó wà nínú agbo ilé náà, kò sì lo ìṣẹ̀lẹ̀ náà láti dá àríyànjiyàn nípa ìbatisí yanjú.
- issue: Ìtumọ̀ πιστὴν nínú ọ̀rọ̀ Lídíà
  choice: ẹni olóòótọ́ sí Olúwa
  alternative: onígbàgbọ́ nínú Olúwa; ẹni ìgbẹ́kẹ̀lé níwájú Olúwa
  rationale: Adjective Gíríìkì náà lè tọ́ka sí ìṣòtítọ́, jíjẹ́ ẹni ìgbẹ́kẹ̀lé, tàbí jíjẹ́ onígbàgbọ́. ‘Olóòótọ́ sí Olúwa’ pa ìfọ̀rọ̀wérọ̀ yìí mọ́, àlàyé ìsàlẹ̀ sì fi àṣàyàn mìíràn hàn.
translation_notes:
  register: 'A lo Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. ‘Àwọn ará ilé rẹ̀’ yàtọ̀ sí ‘ilé mi’: èkíní ń tọ́ka sí agbo ilé, èkejì sì ń tọ́ka sí ibùgbé. Àmì ohùn ni a lò ní kíkún níbi tí ó ti jẹ́ àdánidá.'
