  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ọ̀gá rẹ̀ rí i pé ìrètí èrè wọn ti lọ tán[a], wọ́n mú Pọ́ọ̀lù àti Sílà, wọ́n sì fà wọ́n lọ sí ibi ọjà, síwájú àwọn alákòóso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrètí èrè tí wọ́n ń retí.” Gbólóhùn Gíríìkì náà ní tààràtà ni “ìrètí èrè/ìníwó wọn.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a tú sí “àwọn alákòóso” jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn aláṣẹ ìlú; ẹsẹ tó tẹ̀ lé lo ọ̀rọ̀ pàtó sí i fún àwọn adájọ́ ìlú.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: àwọn ọ̀gá rẹ̀
  rationale: Nínú àyíká yìí, κύριοι tọ́ka sí àwọn tí wọ́n ní agbára lórí ọmọbìnrin ẹrú náà tí wọ́n sì ń fi í jèrè; “àwọn ọ̀gá rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì fi ìṣàkóso wọn hàn.
- source_word: ἐξῆλθεν
  choice: ti lọ tán
  rationale: Ó fi hàn pé ohun tí wọ́n fi ń retí èrè ti parí pátápátá, ó sì pa àwòrán ìlọ kúrò inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: ìrètí èrè wọn
  rationale: ἐλπίς túmọ̀ sí “ìrètí,” nígbà tí ἐργασία nínú àyíká yìí tọ́ka sí èrè tàbí owó tí iṣẹ́ ń mú wá, kì í ṣe iṣẹ́ lásán.
- source_word: ἐπιλαβόμενοι
  choice: wọ́n mú
  rationale: Nínú àyíká ìwà ipá yìí, “wọ́n mú” sọ bí wọ́n ṣe di Pọ́ọ̀lù àti Sílà mú lọ́nà tó ṣe kedere, láìfi èdè àjèjì sí ìṣètò Yorùbá.
- source_word: εἵλκυσαν
  choice: wọ́n wọ́ wọn lọ
  rationale: ἕλκω túmọ̀ sí fífi agbára fà ẹnì kan; “wọ́ wọn lọ” jẹ́ ọ̀rọ̀ Yorùbá tó lágbára, tó sì fi ìfipámúni náà hàn.
- source_word: ἀγορὰν
  choice: ibi ọjà
  rationale: ἀγορά jẹ́ ọjà àti gbangba ìlú tí àwọn ará ìlú ti ń ṣe ọ̀ràn; “ibi ọjà” ṣe kedere fún òǹkàwé Yorùbá, gbolohun tó tẹ̀ lé sì fi iṣẹ́ ìjọba ibẹ̀ hàn.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: síwájú àwọn alákòóso
  rationale: ἄρχοντες jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn tó ń ṣàkóso ìlú. “Àwọn alákòóso” pa ìtumọ̀ gbogbogbò náà mọ́, láìdà á pọ̀ mọ́ orúkọ oyè pàtó tí ẹsẹ tó tẹ̀ lé lò.
