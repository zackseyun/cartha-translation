  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: àwọn ọ̀gá náà rí i pé orísun èrè tí wọ́n ń retí ti kúrò, wọ́n di Pọ́ọ̀lù àti Sílà mú, wọ́n sì fà wọ́n lọ sí ọjà níwájú àwọn aláṣẹ. Síbẹ̀, “wọ́n wọ́ wọn lọ” kì í ṣe ọ̀rọ̀ tó ṣe kedere tó sì wọ́pọ̀ jù fún εἵλκυσαν nínú Yorùbá òde òní; “wọ́n fà wọ́n lọ” sọ ìfipámúni nínú ọ̀rọ̀ náà ní kedere.'
