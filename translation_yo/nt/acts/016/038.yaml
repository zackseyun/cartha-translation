translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘olórí ìlú’ dípò ọ̀rọ̀ iṣẹ́ ìjọba àjèjì, a sì fi àlàyé ìtàn-kíkọ sí ìsàlẹ̀. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
