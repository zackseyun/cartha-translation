source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: yo
  text: Àwọn olùgbé ọ̀pá[a] náà sì ròyìn ọ̀rọ̀ wọ̀nyí fún àwọn olórí ìlú[b]; ẹ̀rù sì bà wọ́n nígbà tí wọ́n gbọ́ pé ará Róòmù ni wọ́n[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn olùgbé ọ̀pá” ni àwọn ìránṣẹ́ àwọn olórí ìlú tí wọ́n ń gbé ọ̀pá gẹ́gẹ́ bí àmì àṣẹ; a sábà máa ń pè wọ́n ní “lictors.”
    reason: cultural_note
  - marker: b
    text: “Àwọn olórí ìlú” túmọ̀ στρατηγοί, àwọn aláṣẹ pàtàkì ní ìlú Fílípì.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ọmọ ìlú Róòmù ni wọ́n.” Gíríìkì sọ pé “ará Róòmù,” ṣùgbọ́n nínú ọ̀ràn òfin yìí, kókó náà ni ipò wọn gẹ́gẹ́ bí ọmọ ìlú tí òfin Róòmù ń dáàbò bo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: ròyìn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ìròyìn tàbí ọ̀rọ̀ tí a rán ẹni jíṣẹ́; ó bá ipò iṣẹ́ ìjọba àti jíjíṣẹ́ láti ọ̀dọ̀ àwọn agbérù lọ sọ́dọ̀ àwọn olórí ìlú mu.
- source_word: στρατηγοῖς
  choice: àwọn olórí ìlú
  rationale: Ní Fílípì, ó ń tọ́ka sí àwọn aláṣẹ pàtàkì ti ìlú. ‘Àwọn olórí ìlú’ jẹ́ èdè Yorùbá tí ó ṣe kedere, láìfi oyè Róòmù tí ọ̀pọ̀ ènìyàn kò mọ̀ sínú ẹsẹ̀ náà.
- source_word: ῥαβδοῦχοι
  choice: àwọn agbérù
  rationale: Ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn tí ń gbé ọ̀pá gẹ́gẹ́ bí àmì àṣẹ àwọn olórí ìlú. ‘Agbérù’ pa àwòrán yẹn mọ́, a sì ṣàlàyé iṣẹ́ wọn nínú àlàyé ìsàlẹ̀.
- source_word: τὰ ῥήματα ταῦτα
  choice: ọ̀rọ̀ wọ̀nyí
  rationale: Ìtumọ̀ tààrà tí ó tọ́ka padà sí ọ̀rọ̀ pàtó tí a ṣẹ̀ṣẹ̀ jíṣẹ́.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù sì bà wọ́n
  rationale: Ó fi ìbẹ̀rù tí ó dé bá wọn lẹ́yìn ohun tí wọ́n gbọ́ hàn ní ọ̀nà àdánidá nínú Yorùbá, láìṣe àfikún ìwọ̀n ìbẹ̀rù tí orísun kò sọ.
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Ó fi ìbáṣepọ̀ àkókò àti ìdí tó wà láàárín gbígbọ́ wọn àti ìbẹ̀rù wọn hàn ní kedere.
- source_word: Ῥωμαῖοί
  choice: ará Róòmù
  rationale: Gíríìkì sọ ní tààrà pé ‘àwọn ará Róòmù.’ Ní àyíká òfin yìí, jíjẹ́ ará Róòmù túmọ̀ sí ipò ọmọ ìlú Róòmù tí òfin ń dáàbò bo, ṣùgbọ́n a pa ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀.
