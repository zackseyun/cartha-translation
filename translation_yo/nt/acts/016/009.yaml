id: ACT.16.9
reference: Acts 16:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: yo
  text: 'Ní òru[a], ìran kan farahàn Pọ́ọ̀lù: ọkùnrin ará Makedóníà kan[b] ń dúró, ó sì ń rọ̀ ọ́ pé, “Kọjá wá sí Makedóníà[c], kí o sì ràn wá lọ́wọ́.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láàárín òru” tàbí “ní àkókò òru.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ọkùnrin kan láti Makedóníà.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, ó jẹ́ “Kọjá sí Makedóníà, ràn wá lọ́wọ́”; “Kọjá wá” fi ipá ìpè ti participle náà pẹ̀lú àṣẹ náà hàn lọ́nà Yorùbá àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: ìran
  rationale: “Ìran” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a rí ní ọ̀nà ìfihàn; kò sọ pé àlá ni tàbí pé ìfarahàn ojú lásán ni.
- source_word: διὰ νυκτός
  choice: ní òru
  rationale: Ó fi àkókò tí ìran náà ṣẹlẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: τῷ Παύλῳ ὤφθη
  choice: farahàn Pọ́ọ̀lù
  rationale: Ìtumọ̀ yìí mú ìṣe ọ̀rọ̀ náà jáde lọ́nà àdánidá, ó sì pa èrò pé Pọ́ọ̀lù rí ìran kan mọ́ láìsọ irú ìrírí náà ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀνὴρ Μακεδών τις
  choice: ọkùnrin ará Makedóníà kan
  rationale: “Ọkùnrin” pa ìyàtọ̀ akọ mọ́, “kan” sì dúró fún àìsọ ẹni náà ní pàtó; “ará Makedóníà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbátan rẹ̀ sí agbègbè náà.
- source_word: ἑστώς
  choice: dúró
  rationale: Ó ṣàfihàn ìdúró ọkùnrin náà nínú ìran náà ní ṣókí àti ní èdè àdánidá.
- source_word: παρακαλῶν
  choice: ń rọ̀ ọ́
  rationale: “Ń rọ̀ ọ́” fi ẹ̀bẹ̀ onítara hàn láìmú un le débi “ń bẹ̀ ẹ́ gidigidi.”
- source_word: λέγων
  choice: pé
  rationale: “Pé” ni ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tààrà lẹ́yìn ọ̀rọ̀ ìrọ̀ tàbí ìbẹ̀bẹ̀.
- source_word: Διαβὰς εἰς Μακεδονίαν
  choice: Kọjá wá sí Makedóníà
  rationale: Ó fi ìtumọ̀ alábàáṣiṣẹ́ ti aorist participle pẹ̀lú àṣẹ hàn, ó sì jẹ́ ọ̀rọ̀ ìpè Yorùbá tó ṣe kedere.
- source_word: βοήθησον ἡμῖν
  choice: kí o sì ràn wá lọ́wọ́
  rationale: Ó jẹ́ ìbéèrè tààrà fún ìrànlọ́wọ́, ní ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lágbára.
theological_decisions:
- issue: Irú ìrírí tí ὅραμα àti ὤφθη ń ṣàpèjúwe
  choice: Ìran kan farahàn Pọ́ọ̀lù, láìsọ ní pàtó bí ìran náà ṣe wáyé.
  alternative: Àlá, ìmọ̀lára inú, tàbí ìfarahàn ohun kan ní ojú ara.
  rationale: Ẹsẹ̀ náà pe ohun tó ṣẹlẹ̀ ní ìran, ó sì sọ pé ó farahàn Pọ́ọ̀lù ní òru. Ìtumọ̀ náà pa ìfihàn yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo “Pọ́ọ̀lù” àti “Makedóníà” gẹ́gẹ́ bí ìkọ̀wé orúkọ tó bá èdè Yorùbá mu.
