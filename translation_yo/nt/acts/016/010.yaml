id: ACT.16.10
reference: Acts 16:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: yo
  text: Nígbà tí ó sì ti rí ìran náà, lẹ́sẹ̀kẹsẹ̀ ni a gbìyànjú láti lọ sí Makedóníà[a], níwọ̀n bí a ti parí èrò[b] pé Ọlọ́run ti pè wá láti kéde ìhìn rere fún wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti kúrò lọ sí Makedóníà.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà ni “láti jáde lọ sí Makedóníà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní fífi àwọn nǹkan jọ láti lóye,” tàbí “ní ríròye.” Ọ̀rọ̀ náà fi hàn pé wọ́n fa ìparí èrò yìí láti inú ìran náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “láti wàásù ìhìn rere fún wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí … sì
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ èyí tó ṣáájú, ó sì fi àkókò hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ ὅραμα
  choice: ìran náà
  rationale: “Ìran” ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun ìfihàn tí ènìyàn rí.
- source_word: εἶδεν
  choice: ó ti rí
  rationale: Àmì “ti” fi hàn pé rírí ìran náà ti ṣẹlẹ̀ kí wọ́n tó bẹ̀rẹ̀ sí í wá ọ̀nà láti lọ.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìtumọ̀ ìyára àti àìjáfara ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐζητήσαμεν
  choice: a wá ọ̀nà
  rationale: Ó túmọ̀ sí pé wọ́n fi tọkàntọkàn gbìyànjú láti ṣe ohun náà, láìfi ìdánilójú pé wọ́n ti ṣe é sí inú ọ̀rọ̀.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: láti jáde lọ sí Makedóníà
  rationale: “Jáde lọ sí” pa àwòrán ìṣípò ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ Yorùbá tó ṣeé lóye.
- source_word: συμβιβάζοντες
  choice: ní píparí èrò
  rationale: Ó fi hàn pé wọ́n fi ohun tí ìran náà túmọ̀ sí jọ, wọ́n sì dé ìparí èrò kan; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: προσκέκληται
  choice: ti pè
  rationale: Ó pa ìṣe pípè tàbí ránni níṣẹ́ àti ipa rẹ̀ tó ṣì wà mọ́; a kò sọ ọ́ di ìtọ́sọ́nà lásán.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún olùṣe tí ọ̀rọ̀ Gíríìkì dárúkọ.
- source_word: εὐαγγελίσασθαι
  choice: láti kéde ìhìn rere
  rationale: Ó sọ iṣẹ́ ìkéde ìhìn rere náà ní èdè Yorùbá òde òní tó ṣe kedere, láìfi ọ̀rọ̀ ṣọ́ọ̀ṣì tí kò ṣe dandan kún un.
- source_word: αὐτούς
  choice: fún wọn
  rationale: Ó tọ́ka sí àwọn ará Makedóníà gẹ́gẹ́ bí àwọn tí a ó kéde ìhìn rere náà fún.
theological_decisions:
- issue: Ìyípadà sí ẹni àkọ́kọ́ ọ̀pọ̀ (“a/wá”) nínú ìtàn
  choice: A pa “a” àti “wá” mọ́ ní tààrà.
  alternative: Kí a sọ ọ́ lọ́nà aláìlẹ́ni, tàbí kí a mú un kúrò nítorí èrò kan nípa ẹni tó kọ ìwé náà.
  rationale: Ọ̀rọ̀ Gíríìkì yí sí ẹni àkọ́kọ́ ọ̀pọ̀ ní kedere; ìtumọ̀ gbọ́dọ̀ pa àbùdá yìí mọ́ láìdá ẹ̀kọ́ nípa ẹni tó kọ ọ́ sí i.
- issue: Ìpè Ọlọ́run nínú προσκέκληται ἡμᾶς ὁ θεὸς
  choice: “Ọlọ́run ti pè wá”
  alternative: “Ọlọ́run ń tọ́ wa sọ́nà” tàbí “Ọlọ́run ti ké sí wa.”
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípè tàbí kíkó ènìyàn sínú iṣẹ́ kan; “pè” pa ìgbésẹ̀ Ọlọ́run mọ́ láìrẹ̀ ẹ́ sílẹ̀ tàbí fi àlàyé ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “lẹ́sẹ̀kẹsẹ̀” fún ìyára, “wá ọ̀nà” fún ìsapá, àti “kéde ìhìn rere” fún ọ̀rọ̀ tó ṣe kedere ju gbólóhùn ṣọ́ọ̀ṣì lọ. Àwọn àmì ìsàlẹ̀ ni a gbe lẹ́gbẹ̀ẹ́ gbólóhùn tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
