source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti gba irú àṣẹ bẹ́ẹ̀, ó ju wọn sínú apá inú ilé ẹ̀wọ̀n, ó sì pa ẹsẹ̀ wọn mọ́ nínú igi ìdè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “sínú igi”; níhìn-ín, ó ń tọ́ka sí ohun èlò igi tí a fi ń dènà ẹsẹ̀, ìyẹn àwọn stocks.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: irú àṣẹ bẹ́ẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí àṣẹ láti ọ̀dọ̀ aláṣẹ; ‘irú àṣẹ bẹ́ẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ náà mọ́.
- source_word: λαβὼν
  choice: Nígbà tí ó gba
  rationale: Aorist participle náà fi hàn pé gbígba àṣẹ náà ṣáájú ìṣe pàtàkì; gbólóhùn yìí sọ ìbáṣepọ̀ àkókò náà ní Yorùbá àdánidá.
- source_word: ἔβαλεν
  choice: ó ju wọn sínú
  rationale: ‘Ju ... sínú’ pa agbára βάλλω mọ́, ó sì bá ìwà líle tí a hù sí wọn mu ju ‘fi wọ̀’ lọ.
- source_word: ἐσωτέραν φυλακήν
  choice: ẹ̀wọ̀n inú
  rationale: Ẹ̀yà tí ó wà nínú ilé ẹ̀wọ̀n jù ni ọ̀rọ̀ Gíríìkì ń tọ́ka sí; ‘ẹ̀wọ̀n inú’ jẹ́ kedere, kò sì fi dandan sọ pé ó jẹ́ apá inú jù lọ.
- source_word: ἠσφαλίσατο
  choice: fi ... múlẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan dájú tàbí lílé e mọ́; ‘fi ... múlẹ̀’ bá bí a ṣe ń sọ dídẹ́ ẹsẹ̀ sínú ohun ìdènà mu.
- source_word: τοὺς πόδας αὐτῶν
  choice: ẹsẹ̀ wọn
  rationale: Ìtumọ̀ tààrà πούς ni ‘ẹsẹ̀,’ àti pé ẹsẹ̀ àwọn méjèèjì ni a dì mọ́.
- source_word: εἰς τὸ ξύλον
  choice: sínú àbà
  rationale: ξύλον túmọ̀ ní tààrà sí igi tàbí ohun èlò igi; ní àyíká ilé ẹ̀wọ̀n yìí, ó jẹ́ ohun èlò igi tí a fi ń dì ẹsẹ̀. ‘Àbà’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún irú ohun ìdè igi bẹ́ẹ̀, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ó’ láì tún ‘olùṣọ́ ẹ̀wọ̀n’ sọ, nítorí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ti hàn nínú àyíká ẹsẹ tó ṣáájú. Àmì àlàyé [a] wà lẹ́yìn ‘àbà’ nínú ọ̀rọ̀.
