translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì yé gbogbo ènìyàn. A pa gbígbòòrò ọ̀rọ̀ ìkìlọ̀ Gíríìkì mọ́ dípò fífi ọ̀rọ̀ náà mọ́ ìpara-ẹni nìkan.
