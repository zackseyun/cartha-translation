source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù ké ní ohùn rara pé, “Má ṣe ṣe ara rẹ ní ibi kankan,[a] nítorí gbogbo wa ṣì wà níbí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Má ṣe pa ara rẹ lára.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà gbòòrò sí i: “Má ṣe ṣe ohun búburú kankan sí ara rẹ”; ṣùgbọ́n nínú àyíká yìí, ó ń tọ́ka sí ìpalára ara ẹni tí olùṣọ́ ẹ̀wọ̀n fẹ́ ṣe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: ké
  rationale: Ọ̀rọ̀ náà tọ́ka sí pípe ní ohùn líle nínú ipò pàjáwìrì; “ké” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìgbésí-ohùn náà hàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìdáwọ́lé Pọ́ọ̀lù ṣe ìyàtọ̀ sí ohun tí olùṣọ́ ẹ̀wọ̀n fẹ́ ṣe ní ẹsẹ tó ṣáájú.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Ó pa àwòrán ohùn líle mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédéé.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá, “pé” ni ọ̀nà àdánidá láti ṣáájú ọ̀rọ̀ tí ẹni náà sọ, láìfi ìtumọ̀ kankan sílẹ̀.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Má ṣe ohunkóhun tí yóò ṣe ọ́ ní ibi
  rationale: Ó pa ìfẹ̀ ọrọ̀ Gíríìkì tí ó gbòòrò—má ṣe ohun búburú kankan sí ara rẹ—mọ́, nígbà tí Yorùbá rẹ̀ ṣì ṣe kedere nínú àyíká ìpalára ara ẹni.
- source_word: ἅπαντες
  choice: gbogbo wa
  rationale: Ó mú ìkúnrẹ́rẹ́ gbogbo àwọn tí ó wà níbẹ̀ hàn, ó sì ṣàlàyé ẹni tí “gbogbo” ń tọ́ka sí.
- source_word: γάρ
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí olùṣọ́ ẹ̀wọ̀n kò fi gbọ́dọ̀ pa ara rẹ̀ lára.
- source_word: ἐνθάδε
  choice: níbí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá atọ́ka ibi náà mu.
- source_word: ὁ Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìlànà ìkọ̀wé Yorùbá tó wọ́pọ̀ fún Paul.
