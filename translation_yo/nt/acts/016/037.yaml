id: ACT.16.37
reference: Acts 16:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: yo
  text: Ṣùgbọ́n Pọ́ọ̀lù sọ fún wọn pé, “Lẹ́yìn tí wọ́n ti lù wá ní gbangba láìdá wa lẹ́bi ní ilé ẹjọ́[a], àwa tí í ṣe ọmọ ìlú Róòmù[b], wọ́n jù wá sínú ẹ̀wọ̀n; ní báyìí, wọ́n sì ń lé wa jáde ní ìkọ̀kọ̀? Rárá o! Dípò bẹ́ẹ̀, kí àwọn fúnra wọn wá, kí wọ́n sì mú wa jáde[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “láìjẹ́ pé wọ́n dá wa lẹ́bi” tàbí “nígbà tí a kò tíì dá wa lẹ́bi.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “àwọn ọkùnrin tí wọ́n jẹ́ ará Róòmù”; níbí, ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ ọmọ ìlú Róòmù àti àwọn ẹ̀tọ́ òfin tó bá a rìn.
    reason: cultural_note
  - marker: c
    text: Ó tún lè jẹ́ “kí wọ́n darí wa jáde” tàbí “kí wọ́n mú wa jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sọ fún wọn pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣe àgbékalẹ̀ ọ̀rọ̀ tààrà nínú ìtàn.
- source_word: Δείραντες
  choice: Lẹ́yìn tí wọ́n ti lù wá
  rationale: Ó fi hàn pé lílu náà ti ṣẹlẹ̀ ṣáájú jíju wọn sínú ẹ̀wọ̀n, láìfi irú ohun èlò ìnà jẹ sí i.
- source_word: δημοσίᾳ
  choice: ní gbangba
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a ṣe níwájú gbogbo ènìyàn.
- source_word: ἀκατακρίτους
  choice: láìdá wa lẹ́bi ní ilé ẹjọ́
  rationale: Ó pa ìtumọ̀ pé a kò tíì dá wọn lẹ́bi mọ́, ó sì jẹ́ kí agbára ọ̀rọ̀ òfin náà yé òǹkàwé.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: bí ó tilẹ̀ jẹ́ pé ọmọ ìlú Róòmù ni wá
  rationale: ‘Ọmọ ìlú Róòmù’ sọ ipò wọn gẹ́gẹ́ bí aráàlú tó ní ààbò òfin Róòmù; gbólóhùn concessive náà bá àríyànjiyàn Pọ́ọ̀lù mu.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: wọ́n jù wá sínú ẹ̀wọ̀n
  rationale: ‘Jù ... sínú’ pa agbára àti ìwà líle βάλλω mọ́ ju ‘fi ... sínú’ lọ.
- source_word: λάθρᾳ
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí ṣíṣe ohun ní ìpamọ́ tàbí láìjẹ́ kí gbogbo ènìyàn mọ̀.
- source_word: ἐκβάλλουσιν
  choice: wọ́n sì ń lé wa jáde
  rationale: Ìṣe àsìkò tí ń lọ bá present Greek mu, ‘lé ... jáde’ sì pa ìtumọ̀ ìyọkúrò aláìbọ̀wọ̀ mọ́.
- source_word: οὐ γάρ
  choice: Rárá o!
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ tó lágbára, tó sì jẹ́ ti Yorùbá àdánidá.
- source_word: ἐλθόντες αὐτοὶ
  choice: kí àwọn fúnra wọn wá
  rationale: ‘Àwọn fúnra wọn’ tẹnu mọ́ pé àwọn aláṣẹ gan-an ni Pọ́ọ̀lù fẹ́ kí wọ́n wá.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: kí wọ́n sì mú wa jáde
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún ἐξάγω, tí ó lè túmọ̀ sí mú tàbí darí ẹni jáde.
theological_decisions:
- issue: Agbára ọ̀rọ̀ òfin nínú jíjẹ́ ará Róòmù
  choice: ọmọ ìlú Róòmù
  alternative: ará Róòmù
  rationale: ‘Ọmọ ìlú’ mú ẹ̀tọ́ aráàlú àti ààbò òfin tó wà nínú àríyànjiyàn náà hàn kedere, láìfi ẹ̀kọ́ ẹ̀sìn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ἀκατακρίτους
  choice: láìdá wa lẹ́bi ní ilé ẹjọ́
  alternative: láìdájọ́ wa
  rationale: Àṣàyàn náà tẹ̀lé ìtumọ̀ gírámà pé wọn kò tíì jẹ́ ẹni tí a dá lẹ́bi, ó sì yàgò fún pípa àìsí ìdájọ́ sí ‘àìsí ìgbẹ́jọ́’ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A pa ìbínú àti ìpèníjà òfin inú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
