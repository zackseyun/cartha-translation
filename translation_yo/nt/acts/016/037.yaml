  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìṣẹ̀lẹ̀ tó ṣáájú rẹ̀ mọ́ nínú Δείραντες, ìṣe ní gbangba, àìsí ìdálẹ́bi, ipò ọmọ ìlú Róòmù, ìtẹnumọ́ ‘àwọn fúnra wọn,’ àti ìbéèrè àròsọ tó wà nínú ọ̀rọ̀ Pọ́ọ̀lù. ‘Lé wa jáde’ yẹ fún ἐκβάλλουσιν nínú àyíká yìí. Àtúnṣe kékeré ni a ṣe sí ìṣọ̀kan gbólóhùn níbi tí ó ti ń tọ́ka sí àwọn méjèèjì gẹ́gẹ́ bí ọmọ ìlú Róòmù, àti sí àlàyé akọsílẹ̀ c tí kò fi ìtumọ̀ ‘bá wa jáde’ tó yà kúrò nínú ἐξάγω hàn dáadáa.'
  naturalness: Èdè náà jẹ́ Yorùbá òde òní tó bójú mu, pẹ̀lú àmì ohùn tó péye. ‘Ọmọ ìlú Róòmù ni wá’ lè ye ẹni, ṣùgbọ́n ‘àwa tí í ṣe ọmọ ìlú Róòmù’ jẹ́ àgbékalẹ̀ tó rọrùn, tó sì dára ní Yorùbá boṣewa nínú gbolohun concessive yìí.
