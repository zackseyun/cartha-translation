  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: yo
  text: Wọ́n sì wá, wọ́n rọ̀ wọ́n[a]; lẹ́yìn tí wọ́n mú wọn jáde, wọ́n sì ń bẹ̀ wọ́n[b] pé kí wọ́n kúrò ní ìlú náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n bẹ̀bẹ̀ sí wọn” tàbí “wọ́n fi taratara bẹ̀ wọ́n.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “tù wọ́n nínú” ní àwọn àyíká mìíràn, ṣùgbọ́n níbí ó ṣeé ṣe kó jẹ́ ọ̀rọ̀ pẹ̀lẹ́ láti mú ìbínú wọn rọ̀ lẹ́yìn bí àwọn adájọ́ ìlú ṣe hùwà àìṣòdodo sí Paulù àti Sílà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà tí a túmọ̀ sí “wọ́n ń bẹ̀” wà ní àkókò imperfect ní èdè Gíríìkì; èyí lè fi hàn pé wọ́n ń bá a lọ láti bẹ̀ wọ́n tàbí pé wọ́n bẹ̀ wọ́n léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Wọ́n sì wá
  rationale: Aorist participle náà ń fi ìṣe àwọn olórí ìlú tí ó kọ́kọ́ ṣẹlẹ̀ hàn. Gbólóhùn olópin yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe mọ́.
- source_word: παρεκάλεσαν
  choice: wọ́n bẹ̀ wọ́n
  rationale: Nínú àyíká yìí, παρακαλέω túmọ̀ sí pé àwọn olórí ìlú fi ọ̀rọ̀ pẹ̀lẹ́ bẹ Paulù àti Sílà lẹ́yìn ìwà àìṣòdodo wọn; kì í ṣe pé wọ́n ń tù wọ́n nínú ní ìtumọ̀ olùṣọ́-àgùntàn.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Paulù àti Sílà, a sì pa á mọ́ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ bí ti orísun.
- source_word: ἐξαγαγόντες
  choice: lẹ́yìn tí wọ́n mú wọn jáde
  rationale: Aorist participle ti ἐξάγω fi hàn pé wọ́n mú Paulù àti Sílà jáde kí wọ́n tó bẹ̀ wọ́n pé kí wọ́n lọ; ìtumọ̀ yìí mú ìtẹ̀lé náà ṣe kedere ní Yorùbá.
- source_word: ἠρώτων
  choice: wọ́n ń bẹ̀ wọ́n
  rationale: Àkókò imperfect ti ἐρωτάω lè fi ìbéèrè tí ń bá a lọ tàbí tí a tún ṣe hàn. Àmì ‘ń’ pa apá yìí mọ́ láìsọ pé ó dájú pé wọ́n béèrè léraléra.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: pé kí wọ́n kúrò ní ìlú náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí wọ́n béèrè, ó sì fi ìtumọ̀ kíkúrò ní ìlú náà hàn ní kíkún.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa ìtẹ̀lé àwọn ìṣe inú Gíríìkì mọ́, ṣùgbọ́n ó yí participle méjèèjì sí ìṣọ̀kan gbólóhùn tó jẹ́ àdánidá ní Yorùbá. A kò fi orúkọ Paulù àti Sílà sínú ọ̀rọ̀ pàtàkì nítorí orísun lo ọ̀rọ̀ arọ́pò-orúkọ, tí àyíká sì ti mú ẹni tí ó ń tọ́ka sí ṣe kedere.
