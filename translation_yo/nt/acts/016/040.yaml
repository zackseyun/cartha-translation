  to: Lẹ́yìn tí wọ́n jáde kúrò nínú ilé ẹ̀wọ̀n náà, wọ́n wọlé lọ bá Lídíà. Nígbà tí wọ́n sì rí àwọn arákùnrin[a], wọ́n fún wọn ní ìṣírí, wọ́n sì kúrò.
  rationale: Àtúnṣe náà mú φυλακή hàn kedere gẹ́gẹ́ bí “ilé ẹ̀wọ̀n náà,” ó sì yọ “lẹ́yìn náà” àti “níbẹ̀” kúrò nínú ìparí kí ìtumọ̀ má bàa fi àfikún tí orísun kò sọ sí i. A pa ìtumọ̀ ìbẹ̀wò sí Lídíà, ìṣírí fún àwọn arákùnrin, àti àlàyé nípa ìtumọ̀ àpapọ̀ ἀδελφοί mọ́.
