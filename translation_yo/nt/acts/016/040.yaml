  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣọ̀kan ìṣẹ̀lẹ̀ Gíríìkì dáadáa: jíjáde kúrò ní ilé ẹ̀wọ̀n, lílọ wọlé sí ọ̀dọ̀ Lídíà, rírí àwọn arákùnrin, fífún wọn ní ìṣírí, àti jíjáde wọn. Àmọ́ “níbẹ̀” nínú ìparí ń fi ibi tí kò sọ ní tààràtà kún un, “lẹ́yìn náà” sì lè fi ìtẹ̀lé àkókò tí kò pọndandan kún ìsopọ̀ καί. “Ilé ẹ̀wọ̀n náà” tún ṣe kedere ju “ẹ̀wọ̀n” lọ pé φυλακή jẹ́ ibi ìfìmọ́lẹ̀.'
