id: ACT.16.40
reference: Acts 16:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n jáde kúrò nínú ilé ẹ̀wọ̀n náà, wọ́n wọlé lọ bá Lídíà. Nígbà tí wọ́n sì rí àwọn arákùnrin[a], wọ́n fún wọn ní ìṣírí, wọ́n sì kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí akọ ọ̀pọ̀, ṣùgbọ́n ó lè tọ́ka sí ẹgbẹ́ àwọn onígbàgbọ́ tí ó ní ọkùnrin àti obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Lẹ́yìn tí wọ́n jáde kúrò nínú ẹ̀wọ̀n
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu, tí ó sì fi hàn pé jíjáde wọn ṣáájú lílọ wọn bá Lídíà. “Kúrò nínú ẹ̀wọ̀n” jẹ́ ọ̀nà àdánidá láti sọ ἀπὸ τῆς φυλακῆς.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: wọ́n wọlé lọ bá Lídíà
  rationale: “Wọlé lọ bá” pa ìtumọ̀ εἰσέρχομαι mọ́ gẹ́gẹ́ bí wíwọlé, ó sì sọ ìbẹ̀wò sí Lídíà lọ́nà àdánidá láìfi ọ̀rọ̀ “ilé” kún ẹsẹ náà ní tààràtà.
- source_word: ἰδόντες
  choice: Nígbà tí wọ́n sì rí
  rationale: Gbólóhùn àkókò yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún participle aorist, ó sì so rírí wọn mọ́ ìṣe tó tẹ̀ lé e.
- source_word: παρεκάλεσαν
  choice: wọ́n fún wọn ní ìṣírí
  rationale: παρακαλέω lè túmọ̀ sí fífúnni ní ìṣírí, ìtùnú, tàbí ìyànjú. “Fún wọn ní ìṣírí” pa ìtumọ̀ olùṣọ́-agutan tó gbòòrò mọ́ láìdín in kù sí ìtùnú tàbí àṣẹ nìkan.
- source_word: τοὺς ἀδελφούς
  choice: àwọn arákùnrin
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì akọ ní ọ̀pọ̀, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kó ye ni pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
- source_word: ἐξῆλθαν
  choice: wọ́n kúrò níbẹ̀
  rationale: Ọ̀rọ̀ yìí sọ ìkúrò wọn ní ṣókí, ó sì yẹra fún àtúnṣe “jáde” tí a ti lò ní ìbẹ̀rẹ̀ ẹsẹ náà. “Níbẹ̀” tọ́ka sí ibi tí wọ́n ti pàdé Lídíà àti àwọn onígbàgbọ́ láìpinnu ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe tú τοὺς ἀδελφούς ní àwùjọ Kristẹni kan tí ó ṣeé ṣe kí ọkùnrin àti obìnrin wà
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: A pa ìrísí akọ ní ọ̀pọ̀ ti orísun mọ́ nínú ẹsẹ, ṣùgbọ́n a fi àlàyé sílẹ̀ pé ní Gíríìkì ọ̀rọ̀ náà lè gba gbogbo àwọn onígbàgbọ́ tí ọkùnrin àti obìnrin wà láàárín wọn. Èyí kò pinnu ìdánimọ̀ àwọn tó wà níbẹ̀ ju ẹ̀rí orísun lọ.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. “Wọlé lọ bá” àti “fún wọn ní ìṣírí” jẹ́ àwọn ìsọ̀rọ̀ àdánidá tí wọ́n pa ìtẹ̀sí orísun mọ́. A gbé àmì àlàyé [a] sí lẹ́gbẹ̀ẹ́ “àwọn arákùnrin,” ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
