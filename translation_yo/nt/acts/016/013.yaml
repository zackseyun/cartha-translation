  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì ní ọ̀pọ̀lọpọ̀: ọjọ́ Sábáàtì, ibi àdúrà, jíjókòó ṣáájú sísọ̀rọ̀, àti imperfect nínú “ń sọ̀rọ̀.” Ṣùgbọ́n “sí ẹ̀yìn ẹnubodè” túmọ̀ sí ‘behind the gate,’ kì í ṣe ìjáde sí òde ẹnubodè, nítorí náà ó yí ìbáṣepọ̀ ibi (ἔξω τῆς πύλης) padà. “Bá ... sọ̀rọ̀” tún lè fúnni ní èrò ìjíròrò aláfẹ̀gbẹ́, níbi tí λαλέω pẹ̀lú dative ti jẹ́ ‘sọ̀rọ̀ sí.’'
  naturalness: Ìlò Yorùbá, ìforúkọsílẹ̀, àti àmì ohùn dara ní gbogbogbò. “Sí òde ẹnubodè” àti “sọ̀rọ̀ sí àwọn obìnrin” jẹ́ ohun tí ó tọ́ sí ìtumọ̀ orísun, tí ó sì jẹ́ Yorùbá ìgbàlódé tó dára. Àlàyé ìsàlẹ̀ yẹ kí ó má ṣe fi ìṣe tí ń ṣẹlẹ̀ léraléra (“máa ń wáyé”) sínú àṣàyàn ‘prayer.’
  terminology: “Sábáàtì,” “ẹnubodè,” “odò,” àti “ibi àdúrà” yẹ. “Ibi àdúrà” ń ṣàfihàn προσευχή gẹ́gẹ́ bí ibi kan láì túmọ̀ ọ́ sí “sinagọgu”; àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ‘àdúrà’ mọ́.
