id: ACT.16.13
reference: Acts 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: yo
  text: Ní ọjọ́ Sábáàtì, a jáde lọ sí òde ẹnubodè, lẹ́gbẹ̀ẹ́ odò, níbi tí a rò pé ibi àdúrà wà[a]. Léyìn tí a jókòó, a sì ń sọ̀rọ̀ sí àwọn obìnrin tí wọ́n péjọ síbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níbi tí a rò pé àdúrà wà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àdúrà fúnra rẹ̀ tàbí ibi tí a yà sọ́tọ̀ fún àdúrà; àyíká yìí ṣe àtìlẹ́yìn fún “ibi àdúrà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Ní ọjọ́ Sábáàtì
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣà-ọrọ̀ fún ọjọ́ Sábáàtì; yíyí rẹ̀ sí ‘ọjọ́ àwọn Sábáàtì’ kì í ṣe Yorùbá àdánidá.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: a jáde sí ẹ̀yìn ẹnubodè
  rationale: Èyí mú ìṣípò sí òde ẹnubodè hàn láì fi ‘ìlú’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: παρὰ ποταμόν
  choice: a sì lọ sí etí odò
  rationale: παρά pẹ̀lú accusative ń tọ́ka sí ìlọ sí ibi lẹ́gbẹ̀ẹ́ odò; ‘sí etí odò’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: níbi tí a rò pé ibi àdúrà wà
  rationale: νομίζω túmọ̀ sí ‘rò,’ προσευχή sì lè túmọ̀ sí àdúrà fúnra rẹ̀ tàbí ibi tí a yà sọ́tọ̀ fún àdúrà. Àyíká ìtàn náà ṣe àtìlẹ́yìn fún ‘ibi àdúrà,’ ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: καὶ καθίσαντες
  choice: A jókòó
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbolohun Yorùbá ọ̀tọ̀ yìí fi ìtẹ̀lé ìṣẹ̀lẹ̀ náà hàn ní kedere.
- source_word: ἐλαλοῦμεν
  choice: a sì ń ... sọ̀rọ̀
  rationale: Àmì ‘ń’ pa ipa imperfect mọ́, ó sì fi hàn pé sísọ̀rọ̀ náà ń bá a lọ.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: àwọn obìnrin tí wọ́n péjọ síbẹ̀
  rationale: Èyí fi hàn pé àwọn obìnrin náà ti kóra jọ ṣáájú ìgbà tí wọ́n bá wọn sọ̀rọ̀; ‘síbẹ̀’ jẹ́ àfikún àdánidá láti inú àyíká.
theological_decisions:
- issue: Ìtumọ̀ προσευχή ní àyíká yìí
  choice: ibi àdúrà
  alternative: àdúrà; tàbí ‘sinagọgu’ gẹ́gẹ́ bí ìtumọ̀ aláṣègbéyọ
  rationale: Àyíká náà ń sọ̀rọ̀ nípa ibi kan lẹ́gbẹ̀ẹ́ odò tí àwọn ènìyàn péjọ sí, προσευχή sì lè tọ́ka sí ibi àdúrà nínú lílò àwọn Júù ti àkókò náà. ‘Sinagọgu’ yóò túmọ̀ kọjá ohun tí Gíríìkì sọ, nígbà tí àlàyé ìsàlẹ̀ ń pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹnubodè’ kò fi ‘ìlú’ kún ọ̀rọ̀ orísun; ìtumọ̀ ibi àdúrà sì pa àṣàyàn ọ̀rọ̀ Gíríìkì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
