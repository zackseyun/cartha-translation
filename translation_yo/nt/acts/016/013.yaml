    rationale: Èyí lè fi ìjíròrò ìbáṣepọ̀ hàn. “Ń sọ̀rọ̀ sí àwọn obìnrin” ń tọ́ka dáadáa sí λαλέω pẹ̀lú dative (‘speak to’).
  - severity: low
