    rationale: “Máa ń” ń ṣàfikún èrò ìṣe àṣà tàbí ìṣe tí ń ṣẹlẹ̀ léraléra tí ọrọ̀ Gíríìkì kò sọ. “Àdúrà wà” pa àìdánilójú orísun mọ́ dáadáa.
