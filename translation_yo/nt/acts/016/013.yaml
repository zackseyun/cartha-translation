revisions:
- from: Ní ọjọ́ Sábáàtì, a jáde sí ẹ̀yìn ẹnubodè, a sì lọ sí etí odò, níbi tí a rò pé ibi àdúrà wà[a]. A jókòó, a sì ń bá àwọn obìnrin tí wọ́n péjọ síbẹ̀ sọ̀rọ̀.
  to: Ní ọjọ́ Sábáàtì, a jáde lọ sí òde ẹnubodè, lẹ́gbẹ̀ẹ́ odò, níbi tí a rò pé ibi àdúrà wà[a]. Léyìn tí a jókòó, a sì ń sọ̀rọ̀ sí àwọn obìnrin tí wọ́n péjọ síbẹ̀.
  rationale: Àtúnṣe náà rọ́pò ‘ẹ̀yìn’ pẹ̀lú ‘òde’ láti fi ἔξω hàn ní tòótọ́, ó so ibi lẹ́gbẹ̀ẹ́ odò mọ́ ìjáde náà, ó sì lo “sọ̀rọ̀ sí” fún λαλέω. A tún mú àṣàyàn àlàyé ìsàlẹ̀ padà sí ọ̀nà tí kò ṣàfikún ipa habitual. “Léyìn tí a jókòó” fi ìṣe participle aorist tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn.
  reviewer_model: gpt-5.6-terra
