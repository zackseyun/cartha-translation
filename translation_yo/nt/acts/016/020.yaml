  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: yo
  text: Wọ́n sì mú wọn wá sí iwájú àwọn adájọ́ ìlú[a], wọ́n ní, “Àwọn ọkùnrin yìí ń da ìlú wa rú; àwọn Júù ni wọ́n[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn praetors,” ìyẹn àwọn aláṣẹ ìlú Róòmù ní ìlú amúnisìn Róòmù bíi Fílípì.
    reason: cultural_note
  - marker: b
    text: Tàbí “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù lápapọ̀ tàbí àwọn ènìyàn láti Jùdíà; níbí, “Júù” bá ẹ̀sùn ẹ̀yà àti ẹ̀sìn náà mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: wọ́n sì mú wọn wá síwájú
  rationale: Aorist participle náà tọ́ka sí ìṣe tó ṣáájú εἶπαν; ìtúmọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣe náà mọ́.
- source_word: στρατηγοῖς
  choice: àwọn adájọ́ ìlú
  rationale: Ní Fílípì, ọ̀rọ̀ náà ń tọ́ka sí àwọn aláṣẹ ìlú Róòmù tí wọ́n ń ṣe iṣẹ́ ìṣàkóso àti ìdájọ́; “àwọn adájọ́ ìlú” ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐκταράσσουσιν
  choice: ń da ... rú
  rationale: Ó fi ìdàrúdàpọ̀ tàbí ìyọlẹ́nu tó lágbára hàn, ó sì pa àkókò ìṣe tí ẹ̀sùn náà lò mọ́.
- source_word: ἡμῶν τὴν πόλιν
  choice: ìlú wa
  rationale: Ó ṣe àfihàn ìní àti ìmọ̀lára ìgbéraga ará ìlú tó wà nínú ẹ̀sùn náà ní ọ̀nà Yorùbá àdánidá.
- source_word: Ἰουδαῖοι
  choice: Júù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ṣeé lóye jù lọ gẹ́gẹ́ bí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn, kì í ṣe pé wọ́n kàn wá láti agbègbè Jùdíà.
- source_word: ὑπάρχοντες
  choice: sì ni wọ́n
  rationale: Ìṣètò yìí pa ìsopọ̀ participle mọ́, ó sì jẹ́ kí ìdánimọ̀ wọn gẹ́gẹ́ bí Júù dúró gẹ́gẹ́ bí apá kan ẹ̀sùn náà láì fi ìtumọ̀ ìdí tí kò ṣe dandan kún un.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Àwọn ọkùnrin yìí
  rationale: Ó tọ́ka pàtó sí Pọ́ọ̀lù àti Sílà, àwọn ọkùnrin méjì; ìtumọ̀ náà pa akọ nínú orísun mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἰουδαῖοι nínú ẹ̀sùn ẹ̀yà àti ẹ̀sìn tó lè fa ìṣòro
  choice: Júù
  alternative: àwọn ará Jùdíà
  rationale: Àyíká Fílípì fi hàn pé àwọn olùfisùn ń tẹnumọ́ ìdánimọ̀ ẹ̀yà-ẹ̀sìn Pọ́ọ̀lù àti Sílà ní ìyàtọ̀ sí ìdánimọ̀ ará Róòmù. Gbólóhùn náà jẹ́ ọ̀rọ̀ àwọn olùfisùn, kì í ṣe ìdájọ́ akéde sí gbogbo àwọn Júù.
translation_notes:
  register: Èdè Yorùbá tó ṣe kedere, tó níyì, tí ó sì bá ọ̀rọ̀ òde òní mu ni a lò. “Ń da ìlú wa rú” jẹ́ àsọyé àdánidá fún ẹ̀sùn ìdàrúdàpọ̀, “àwọn adájọ́ ìlú” sì yàgò fún ọ̀rọ̀ ìmọ̀-ẹ̀rọ tí òǹkàwé púpọ̀ lè má mọ̀; àlàyé ìtàn wà ní àlàyé ìsàlẹ̀.
