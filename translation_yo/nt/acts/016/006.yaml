id: ACT.16.6
reference: Acts 16:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: yo
  text: Wọ́n sì gba agbègbè Fríjíà àti Gálátíà kọjá[b], nígbà tí Ẹ̀mí Mímọ́ ti fòfin dè wọ́n láti sọ ọ̀rọ̀ náà ní Éṣíà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni ẹkùn ìṣàkóso Róòmù tí a ń pè ní Éṣíà, ní apá ìwọ̀-oòrùn Éṣíà Kékeré; kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà ti òde òní.
    reason: cultural_note
  - marker: b
    text: Ó tún ṣeé ṣe kí a túmọ̀ rẹ̀ sí, “agbègbè Fríjíà-Gálátíà.” Ètò ọ̀rọ̀ Gíríìkì lè tọ́ka sí agbègbè kan ṣoṣo tí a fi àwọn orúkọ méjèèjì ṣàpèjúwe.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: wọ́n gba … kọjá
  rationale: Ọ̀rọ̀ yìí ń sọ nípa rírìn tàbí lílọ gba inú agbègbè kan kọjá; gbólóhùn náà jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣípòpadà náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” ṣe iṣẹ́ yìí lọ́nà àdánidá ní Yorùbá.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: agbègbè Fríjíà àti Gálátíà
  rationale: χώρα túmọ̀ sí agbègbè tàbí ilẹ̀. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa àìdánilójú ètò Gíríìkì náà mọ́.
- source_word: κωλυθέντες
  choice: ti fòfin dè wọ́n
  rationale: Aorist passive participle náà fi hàn pé a dá wọn dúró tàbí a kọ̀ fún wọn láti ṣe ohun kan. “Fòfin dè wọ́n” mú agbára ìdènà náà jáde láìsọ bí Ẹ̀mí ṣe fi ìdènà náà hàn.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: Ẹ̀mí Mímọ́ ni olùṣe ìdènà náà; ìtúmọ̀ yìí bá lílo ọ̀rọ̀ náà nínú Lúùkù–Ìṣe mu.
- source_word: λαλῆσαι
  choice: láti sọ
  rationale: λαλέω túmọ̀ ní pàtàkì sí sísọ̀rọ̀; “sọ” dúró sún mọ́ ọ̀rọ̀ orísun ju fífi “wàásù” kún un lọ.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀ náà” pa àṣà ọ̀rọ̀ Lúùkù–Ìṣe mọ́, kò sì fi “ìhìn rere” rọ́pò rẹ̀ bí ó tilẹ̀ jẹ́ pé ìhìn Kristẹni ni ó wà lọ́kàn ní àyíká yìí.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ní Éṣíà
  rationale: A pa orúkọ ìtàn náà mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ní ìsàlẹ̀ pé ẹkùn Róòmù ni a ń tọ́ka sí, kì í ṣe kọ́ńtínẹ́ǹtì òde òní.
theological_decisions:
- issue: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùṣe ìdènà náà
  choice: Ẹ̀mí Mímọ́ ti fòfin dè wọ́n
  alternative: ẹ̀mí kan ti dá wọn dúró
  rationale: Àpilẹ̀kọ àti ajẹtífù inú ọ̀rọ̀ Gíríìkì, pẹ̀lú bí Lúùkù–Ìṣe ṣe máa ń lo gbólóhùn náà, tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùṣe. A kò fi ẹ̀kọ́ mìíràn kún ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu, a sì ṣe àwọn orúkọ ilẹ̀ ní ìbámu pẹ̀lú ìró Yorùbá.
