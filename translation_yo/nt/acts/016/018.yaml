revisions:
- from: Ó sì ń ṣe èyí fún ọ̀pọ̀ ọjọ́. Ṣùgbọ́n nígbà tí ọ̀ràn náà yọ Pọ́ọ̀lù lẹ́nu gidigidi, ó yíjú sí ẹ̀mí náà, ó sì wí pé, “Mo pàṣẹ fún ọ ní orúkọ Jésù Mèsáyà pé, jáde kúrò lára rẹ̀.” Ó sì jáde ní wákàtí náà gan-an.
  to: Ó sì ń ṣe èyí fún ọ̀pọ̀ ọjọ́. Ṣùgbọ́n Pọ́ọ̀lù, ní ìdààmú gidigidi, yí padà sí ẹ̀mí náà, ó sì wí pé, “Mo pàṣẹ fún ọ ní orúkọ Jésù Mèsáyà pé kí o jáde kúrò lára rẹ̀.” Ẹ̀mí náà sì jáde ní wákàtí náà gan-an.
  rationale: Àtúnṣe náà yọ àfikún ‘ọ̀ràn náà’ kúrò kí ìtumọ̀ má bàa sọ ohun tí Gíríìkì kò sọ. Ó lo ‘ní ìdààmú gidigidi’ láti ṣàfihàn participle διαπονηθεὶς láìṣètò ìtumọ̀ ìdí kan pàtó. A ṣe ìtúnṣe gírámà sí ‘pé kí o jáde,’ a sì lò ‘yí padà sí’ gẹ́gẹ́ bí ọ̀nà Yorùbá tó wọ́pọ̀ fún ἐπιστρέψας. Ṣíṣe ‘Ẹ̀mí náà’ ní gbolohun ìkẹyìn ń mú kókó-ọrọ̀ tó wà ní ìmọ̀ Gíríìkì hàn kedere fún òǹkàwé Yorùbá, láìfi ẹ̀mí ‘búburú’ tàbí ‘èṣù’ kún un.
