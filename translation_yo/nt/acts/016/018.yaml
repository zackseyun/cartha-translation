id: ACT.16.18
reference: Acts 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: yo
  text: Ó sì ń ṣe èyí fún ọ̀pọ̀ ọjọ́. Ṣùgbọ́n Pọ́ọ̀lù, ní ìdààmú gidigidi, yí padà sí ẹ̀mí náà, ó sì wí pé, “Mo pàṣẹ fún ọ ní orúkọ Jésù Mèsáyà pé kí o jáde kúrò lára rẹ̀.” Ẹ̀mí náà sì jáde ní wákàtí náà gan-an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: ń ṣe èyí fún ọ̀pọ̀ ọjọ́
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú ἐποίει fi hàn pé obìnrin náà ń ṣe ohun yìí léraléra fún ọ̀pọ̀ ọjọ́.
- source_word: διαπονηθεὶς
  choice: nígbà tí ọ̀ràn náà yọ Pọ́ọ̀lù lẹ́nu gidigidi
  rationale: Ó sọ ìdààmú tó jinlẹ̀ ju ìbínú kékeré lọ, ó sì mú ìyípadà ipò tí participle náà tọ́ka sí jáde lọ́nà Yorùbá àdánidá.
- source_word: ἐπιστρέψας
  choice: ó yíjú
  rationale: Ó fi ìyípadà ara Pọ́ọ̀lù sí ọ̀dọ̀ ẹni tàbí ohun tí ó ń bá sọ̀rọ̀ hàn ní ṣókí.
- source_word: τῷ πνεύματι
  choice: sí ẹ̀mí náà
  rationale: Èdè Gíríìkì sọ ‘ẹ̀mí’ láìfi ‘búburú’ tàbí ‘ẹ̀mí èṣù’ kún un; àyíká ọ̀rọ̀ ló ń dá irú ẹ̀mí náà mọ̀.
- source_word: Παραγγέλλω σοι
  choice: Mo pàṣẹ fún ọ
  rationale: Ó mú àṣẹ alágbára tí Pọ́ọ̀lù fún ẹ̀mí náà jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: ní orúkọ Jésù Mèsáyà
  rationale: ‘Ní orúkọ’ tọ́ka sí àṣẹ tí ó dúró lórí ẹni náà; ‘Mèsáyà’ sì pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró mọ́.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: jáde kúrò lára rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ẹ̀mí kan fi ẹni tí ó wà lára rẹ̀ sílẹ̀.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: Ó sì jáde ní wákàtí náà gan-an
  rationale: Ó pa àwòrán ‘wákàtí náà’ mọ́, ‘gan-an’ sì fi ìmúṣẹ lẹ́sẹ̀kẹsẹ̀ tẹnumọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú ọ̀rọ̀ àṣẹ náà
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Jésù, nítorí náà ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì òróró náà mọ́ dípò kí ó dà bí orúkọ ìdílé.
- issue: Bóyá kí a pe πνεῦμα ní ẹ̀mí búburú tàbí ẹ̀mí èṣù nínú ọ̀rọ̀ pàtàkì
  choice: ẹ̀mí náà
  alternative: ẹ̀mí búburú náà; ẹ̀mí èṣù náà
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ ‘ẹ̀mí’ láìsí àpèjúwe míì. Yíyan ‘ẹ̀mí náà’ pa ìfọ̀rọ̀wérọ̀ orísun mọ́, nígbà tí àyíká ọ̀rọ̀ ṣàlàyé ẹni tí a ń tọ́ka sí.
translation_notes:
  register: Yorùbá àdánidá, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtumọ̀ náà pa ìtẹ̀sí ìṣe tó ń bá a lọ, ìdààmú Pọ́ọ̀lù, àti ọ̀rọ̀ orísun ‘ẹ̀mí’ mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
