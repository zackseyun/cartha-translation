  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: yo
  text: Nígbà tí olùṣọ́ ẹ̀wọ̀n náà jí, tí ó sì rí àwọn ilẹ̀kùn ẹ̀wọ̀n náà ní ṣíṣí[a], ó fa idà rẹ̀ yọ, ó sì fẹ́rẹ̀ẹ́ pa ara rẹ̀[b], nítorí ó rò pé àwọn ẹlẹ́wọ̀n náà ti sá àsálà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀lé ìlànà Gíríìkì pẹkipẹki, “rí i pé a ti ṣí àwọn ilẹ̀kùn ẹ̀wọ̀n náà.” Àpólà pípé Gíríìkì náà tẹnu mọ́ ipò ṣíṣí tí àwọn ilẹ̀kùn náà wà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì μάχαιρα lè túmọ̀ sí idà tàbí ohun ìjà olójú kúkúrú, bí ọ̀bẹ; a lo “idà” gẹ́gẹ́ bí ìtumọ̀ tó wọ́pọ̀ jù ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: jí
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí wíwọ ipò jíjì; “jí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì mú ìtumọ̀ ìbẹ̀rẹ̀ jíjì náà jáde.
- source_word: δεσμοφύλαξ
  choice: olùṣọ́ ẹ̀wọ̀n
  rationale: Ó tọ́ka sí ẹni tí a fi ojúṣe àwọn ẹlẹ́wọ̀n lé lọ́wọ́, kì í ṣe olùṣọ́ lásán.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: rí àwọn ilẹ̀kùn ẹ̀wọ̀n náà ní ṣíṣí sílẹ̀
  rationale: Perfect passive participle náà tẹnu mọ́ ipò tí ilẹ̀kùn wà lẹ́yìn tí ó ti ṣí; “ní ṣíṣí sílẹ̀” sọ ipò yẹn ní Yorùbá àdánidá.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: fa idà rẹ̀ yọ
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe yíya ohun ìjà olójú jáde; “idà” ni ìtumọ̀ àṣà fún μάχαιρα ní àyíká yìí, láìfi irú gígùn rẹ̀ múlẹ̀ ju ẹ̀rí lọ.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: fẹ́ pa ara rẹ̀
  rationale: Nínú àyíká yìí, ἤμελλεν fi hàn pé ìṣe náà sún mọ́lé, ἀναιρεῖν sì túmọ̀ sí pípa; gbólóhùn Yorùbá yìí sọ ète tó fẹ́ ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: νομίζων
  choice: nítorí ó rò pé
  rationale: Participle náà fúnni ní ìdí ìṣe rẹ̀, ó sì fi hàn pé ìpinnu inú rẹ̀ ni, kì í ṣe ohun tí ó mọ̀ dájú.
- source_word: ἐκπεφευγέναι
  choice: ti sá àsálà
  rationale: Perfect infinitive náà ṣàfihàn àsálà tí ó rò pé ó ti parí; “ti sá àsálà” jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: τοὺς δεσμίους
  choice: àwọn ẹlẹ́wọ̀n
  rationale: Nínú àyíká yìí, ó tọ́ka sí àwọn ènìyàn tí a fi sínú ẹ̀wọ̀n.
