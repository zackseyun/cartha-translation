translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìyàtọ̀ láàárín ohun tí olùṣọ́ náà rí àti ohun tí ó kàn rò mọ́.
