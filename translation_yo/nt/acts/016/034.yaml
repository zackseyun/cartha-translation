id: ACT.16.34
reference: Acts 16:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: yo
  text: Ó sì mú wọn gòkè lọ sínú ilé náà, ó gbé oúnjẹ kalẹ̀ níwájú wọn[a], ó sì yọ̀ gidigidi pẹ̀lú gbogbo àwọn ará ilé rẹ̀[b], gẹ́gẹ́ bí ẹni tí ó ti gba Ọlọ́run gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘ó gbé tábìlì kalẹ̀ níwájú wọn’; àṣà ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé ó pèsè oúnjẹ fún wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye Gíríìkì náà pé gbogbo àwọn ará ilé rẹ̀ ni wọ́n bá a yọ̀; àwọn kan sì ka gbólóhùn náà bí ẹni pé gbogbo agbo ilé náà pín nínú ìgbàgbọ́ náà pẹ̀lú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: mú wọn gòkè lọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí mímú wọn láti ibi tí ó wà ní ìsàlẹ̀ gòkè lọ; ìtumọ̀ yìí pa ìtẹ̀lé ìṣe mọ́ ní Yorùbá àdánidá.
- source_word: οἶκον
  choice: ilé náà
  rationale: Atọ́ka inú Gíríìkì tọ́ka sí ilé olùṣọ́ ẹ̀wọ̀n tí àyíká ọ̀rọ̀ ti mú kí ó ṣe kedere, láìfi ‘ilé rẹ̀’ kún un ní tààrà.
- source_word: παρέθηκεν τράπεζαν
  choice: ó gbé oúnjẹ kalẹ̀ níwájú wọn
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ Gíríìkì nípa títẹ́ tábìlì, ìyẹn pípèsè oúnjẹ fún àlejò; gbolohun Yorùbá yìí sọ ìtumọ̀ náà lọ́nà àdánidá.
- source_word: ἠγαλλιάσατο
  choice: ó sì yọ̀ gidigidi
  rationale: Ọ̀rọ̀-ìṣe náà ń sọ ayọ̀ ńlá tí ó hàn gbangba, nítorí náà ‘yọ̀ gidigidi’ mú agbára rẹ̀ jáde.
- source_word: πανοικεὶ
  choice: pẹ̀lú gbogbo àwọn ará ilé rẹ̀
  rationale: Ọ̀rọ̀ adverb náà ní ìtumọ̀ pé gbogbo àwọn tó wà nínú agbo ilé náà kópa; ‘àwọn ará ilé’ jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: nítorí ó ti gba Ọlọ́run gbọ́
  rationale: Perfect participle náà sọ ìgbàgbọ́ tí ó ti bẹ̀rẹ̀ tí ipa rẹ̀ sì ń bá a lọ. ‘Ó ti gba Ọlọ́run gbọ́’ pa ẹni kan ṣoṣo gẹ́gẹ́ bí olùṣe mọ́, ‘nítorí’ sì sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ayọ̀ náà lọ́nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bóyá ayọ̀ àti ìgbàgbọ́ náà kan olùṣọ́ ẹ̀wọ̀n nìkan tàbí gbogbo agbo ilé rẹ̀
  choice: Ọ̀rọ̀ inú ẹsẹ̀ fi olùṣọ́ ẹ̀wọ̀n hàn gẹ́gẹ́ bí ẹni tí ó gba Ọlọ́run gbọ́, tí ó sì yọ̀ pẹ̀lú gbogbo àwọn ará ilé rẹ̀.
  alternative: A lè ka a pé gbogbo agbo ilé náà ni wọ́n yọ̀, wọ́n sì jọ gba Ọlọ́run gbọ́.
  rationale: πεπιστευκώς jẹ́ participle akọ ẹyọ kan, ó sì tọ́ka sí olùṣọ́ ẹ̀wọ̀n ní tààrà; síbẹ̀, ipò πανοικεὶ lè jẹ́ kí olùkà rí ìkópa gbogbo agbo ilé nínú ayọ̀, tàbí kó tún rí i gẹ́gẹ́ bí ohun tó kan ìgbàgbọ́. A pa àìdánilójú yìí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. A lo ‘àwọn ará ilé’ dípò ọ̀rọ̀ tí ó lè dà bí ilé gẹ́gẹ́ bí ilé-ọba tàbí ilé gbígbé nìkan.
