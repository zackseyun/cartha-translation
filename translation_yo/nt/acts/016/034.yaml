  source_fidelity: Ìtumọ̀ náà mú ìtẹ̀lé ìṣe náà, ìgbésẹ̀ gígun lọ sínú ilé, ìpèsè oúnjẹ, àti ayọ̀ olùṣọ́ ẹ̀wọ̀n náà hàn dáadáa. Ṣùgbọ́n ‘nítorí’ ń sọ ìbáṣepọ̀ ìdí-ẹ̀sùn ní kedere ju participle πεπιστευκώς lọ. ‘Gẹ́gẹ́ bí ẹni tí ó ti gba Ọlọ́run gbọ́’ dára ju fún pípa perfect participle àti ìtọ́kasí rẹ̀ sí olùṣọ́ ẹ̀wọ̀n ẹyọ kan mọ́.
  naturalness: Yorùbá náà jẹ́ kedere, ó sì yẹ fún ìforígbárí òde òní. ‘Àwọn ará ilé rẹ̀’ jẹ́ ìtumọ̀ àdánidá fún πανοικεί, bí ó tilẹ̀ jẹ́ pé ó lè ní ìfẹ̀hónúhàn ìbátan-ẹbí díẹ̀ ju ‘household’ lọ; nínú àyíká yìí ó ṣiṣẹ́ dáadáa. Àlàyé a yẹ kí ó lo ‘gbé tábìlì kalẹ̀’ dípò ‘tẹ́ tábìlì,’ èyí tí kò dá lórí ìlò Yorùbá tó wọ́pọ̀.
  terminology: ‘Ó gbé oúnjẹ kalẹ̀ níwájú wọn’ sọ παρέθηκεν τράπεζαν lọ́nà tó bójú mu. ‘Gba Ọlọ́run gbọ́’ bá πιστεύω + dative mu, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
