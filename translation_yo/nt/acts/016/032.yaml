id: ACT.16.32
reference: Acts 16:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: yo
  text: Wọ́n sì sọ ọ̀rọ̀ Olúwa[a] fún un,[c] pẹ̀lú gbogbo àwọn tí ó wà ní ilé rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn nípa Olúwa.” Gbólóhùn Gíríìkì náà, “ọ̀rọ̀ Olúwa,” lè túmọ̀ sí ọ̀rọ̀ tí ó jẹ́ ti Olúwa, tí ó ti ọ̀dọ̀ Olúwa wá, tàbí tí ó jẹ́ nípa Olúwa.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “pẹ̀lú gbogbo àwọn ará ilé rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ apá yìí sí, “fún un àti fún gbogbo àwọn tí ó wà ní ilé rẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: wọ́n sọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n bá wọn sọ̀rọ̀ nípa ìhìn náà. “Wọ́n sọ” jẹ́ èdè Yorùbá àdánidá, kò sì fi ìtumọ̀ ìkéde ní gbangba kún ọ̀rọ̀ Gíríìkì.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí olùṣọ́ ẹ̀wọ̀n; pẹ̀lú “sọ,” “fún un” fi hàn pé òun ni ẹni tí wọ́n ń bá sọ̀rọ̀.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀
  rationale: λόγος níhìn-ín ń tọ́ka sí ìhìn Kristẹni tí a sọ. “Ọ̀rọ̀” pa àṣà ọ̀rọ̀ inú Májẹ̀mú Tuntun mọ́, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú “Olúwa” dúró láìṣàlàyé rẹ̀ jù.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: “Ọ̀rọ̀ Olúwa” pa ìrísí gbólóhùn Gíríìkì mọ́, láìdáhùn ní pàtó bóyá ọ̀rọ̀ náà ti ọ̀dọ̀ Olúwa wá tàbí ó jẹ́ ọ̀rọ̀ nípa Olúwa.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: pẹ̀lú gbogbo àwọn tí ó wà ní ilé rẹ̀
  rationale: “Pẹ̀lú” ṣàfihàn σύν ní tààrà, ó sì fi hàn pé gbogbo àwọn tó wà ní ilé náà kópa nínú gbígbọ́ ọ̀rọ̀ náà.
- source_word: οἰκίᾳ
  choice: ilé
  rationale: οἰκία lè túmọ̀ sí ilé gẹ́gẹ́ bí ibi tàbí àwọn ará ilé. “Ilé” pa àwòrán ibi náà mọ́, nígbà tí “àwọn tí ó wà ní ilé” ń tọ́ka sí àwọn ènìyàn tó wà níbẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ọ̀rọ̀ Olúwa”
  choice: A lo “ọ̀rọ̀ Olúwa” láìsọ ní pàtó bóyá ó túmọ̀ sí ọ̀rọ̀ láti ọ̀dọ̀ Olúwa tàbí ọ̀rọ̀ nípa Olúwa.
  alternative: “ìhìn láti ọ̀dọ̀ Olúwa” tàbí “ìhìn nípa Olúwa”
  rationale: Ìbáṣepọ̀ ọ̀rọ̀ inú Gíríìkì lè gba méjèèjì; pípa gbólóhùn náà mọ́ yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu; a sì pa ìdíwọ̀n àti àìdájú tó wà nínú Gíríìkì mọ́.
