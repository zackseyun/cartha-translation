translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìṣe méjèèjì mọ́ gẹ́gẹ́ bí ohun tó ń lọ lọ́wọ́.
