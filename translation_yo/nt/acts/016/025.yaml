  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: yo
  text: Ní nǹkan bí àárín òru, Pọ́ọ̀lù àti Sílà ń gbàdúrà, wọ́n sì ń kọ orin ìyìn sí Ọlọ́run; àwọn ẹlẹ́wọ̀n sì ń fetí sí wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹlẹ́wọ̀n sì ń fetí sí wọn pẹ̀lú àfiyèsí.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi fífetísílẹ̀ pẹ̀lú àfiyèsí tàbí ìtara hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Ní nǹkan bí àárín òru
  rationale: κατά pẹ̀lú ọ̀rọ̀ àsìkò nínú accusative túmọ̀ sí ‘ní nǹkan bí’ tàbí ‘ní àyíká’ àárín òru; δέ jẹ́ àsopọ̀ fífẹ́ tí ‘sì’ nínú gbólóhùn náà ń mú jáde lọ́nà àdánidá.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Pọ́ọ̀lù àti Sílà
  rationale: Àwọn wọ̀nyí ni ìkọ̀wé orúkọ àwọn ẹni náà ní Yorùbá.
- source_word: προσευχόμενοι
  choice: ń gbàdúrà
  rationale: Participle ìsinsìnyí fi ìṣe tí ń lọ lọ́wọ́ ní àkókò kan náà pẹ̀lú ὕμνουν hàn.
- source_word: ὕμνουν τὸν θεόν
  choice: wọ́n sì ń kọ orin ìyìn sí Ọlọ́run
  rationale: ὑμνέω ń tọ́ka sí kíkọ orin ìyìn; ‘sí Ọlọ́run’ sọ ẹni tí orin náà ń lọ sí ní Yorùbá àdánidá.
- source_word: ἐπηκροῶντο
  choice: ń fetí sí wọn dáadáa
  rationale: Ọ̀rọ̀-ìṣe imperfect middle náà fi fífetí-sílẹ̀ tí ń bá a lọ hàn, ó sì lè ní ìtumọ̀ fífetí sílẹ̀ pẹ̀lú àfiyèsí.
- source_word: οἱ δέσμιοι
  choice: àwọn ẹlẹ́wọ̀n
  rationale: δέσμιος túmọ̀ sí àwọn tí a dè tàbí àwọn ẹlẹ́wọ̀n; ‘àwọn ẹlẹ́wọ̀n’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù nínú àyíká yìí.
