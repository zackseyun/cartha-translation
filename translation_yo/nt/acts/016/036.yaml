source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: yo
  text: Olùṣọ́ ẹ̀wọ̀n sì sọ ọ̀rọ̀ wọ̀nyí fún Paulu pé, “Àwọn adájọ́ ìlú[a] ti ránṣẹ́ pé kí a tú yín sílẹ̀. Nítorí náà, ẹ jáde nísinsìnyí, ẹ sì lọ ní àlàáfíà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn adájọ́ ìlú” ni a fi túmọ̀ στρατηγοί, àwọn aláṣẹ ìlú Filippi; ní ọ̀nà ìṣàkóso Róòmù, a tún lè pè wọ́n ní “àwọn praetors.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: sọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ìhìn tàbí àṣẹ tí ẹlòmíràn rán dé etí ẹni; “sọ” jẹ́ èdè Yorùbá àdánidá tí ó bá ìtàn náà mu.
- source_word: ὁ δεσμοφύλαξ
  choice: olùṣọ́ ẹ̀wọ̀n
  rationale: Ó tọ́ka sí ẹni tí ń ṣọ́ ilé ẹ̀wọ̀n, kì í ṣe olùṣọ́ lásán.
- source_word: τοὺς λόγους τούτους
  choice: ọ̀rọ̀ wọ̀nyí
  rationale: Èyí pa ìṣètò Gíríìkì mọ́ ní ọ̀nà tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: Ἀπέσταλκαν
  choice: ti ránṣẹ́
  rationale: Fọ́ọ̀mù pípé náà fi ìṣe tí a ti ṣe tí ó sì ní ipa lọ́wọ́lọ́wọ́ hàn; “ránṣẹ́” lè dúró láìsọ ohun tí a rán ní kedere, gẹ́gẹ́ bí Gíríìkì.
- source_word: οἱ στρατηγοὶ
  choice: àwọn adájọ́ ìlú
  rationale: Ní Filippi, ọ̀rọ̀ náà ń tọ́ka sí àwọn aláṣẹ ìlú Róòmù. “Àwọn adájọ́ ìlú” ṣe kedere sí òǹkàwé Yorùbá láìlo orúkọ iṣẹ́ Róòmù tí ó ṣòro.
- source_word: ἵνα ἀπολυθῆτε
  choice: pé kí a tú yín sílẹ̀
  rationale: Ó sọ àkóónú ìhìn tàbí àṣẹ náà, ó sì pa ohùn àìṣe ti Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: νῦν οὖν
  choice: nítorí náà ... nísinsìnyí
  rationale: Ìtumọ̀ yìí mú ìbáṣepọ̀ àbájáde àti àkókò inú gbólóhùn Gíríìkì jáde ní Yorùbá tí ó rọrùn.
- source_word: ἐξελθόντες πορεύεσθε
  choice: ẹ jáde ... kí ẹ sì máa lọ
  rationale: Participle náà ń ṣiṣẹ́ pẹ̀lú àṣẹ tí ó tẹ̀ lé e; ìtumọ̀ yìí fi ìtẹ̀lé àwọn ìṣe méjèèjì hàn lọ́nà àdánidá.
- source_word: ἐν εἰρήνῃ
  choice: ní àlàáfíà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún lílọ ní àlàáfíà tàbí láìsí ewu.
