translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu. Ọ̀rọ̀ ẹni kejì ọ̀pọ̀ “yín/ẹ” bá àwọn tí a ń dá sílẹ̀ mu, ó sì tún lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀.
