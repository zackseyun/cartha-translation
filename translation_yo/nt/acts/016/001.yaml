id: ACT.16.1
reference: Acts 16:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: yo
  text: Ó sì tún dé Déríbè àti Lísírà. Kíyèsí i, ọmọ-ẹ̀yìn kan tí orúkọ rẹ̀ ń jẹ́ Timotiu wà níbẹ̀[b]. Ọmọkùnrin tí obìnrin Júù kan tó jẹ́ onígbàgbọ́ bí ni, ṣùgbọ́n Gíríìkì ni baba rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “ọmọ-ẹ̀yìn kan wà níbẹ̀, orúkọ rẹ̀ ń jẹ́ Timotiu.”
    reason: previous_rendering
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: Ó sì tún dé
  rationale: “Dé” fi ìtumọ̀ wíwá sí ibi kan hàn, “sì tún” sì mú agbára ìtẹ̀síwájú àti àfikún inú δὲ καὶ jáde lọ́nà Yorùbá àdánidá.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: Déríbè àti Lísírà
  rationale: Àwọn orúkọ ibi náà ni a kọ ní ìró Yorùbá; ọ̀rọ̀-ìṣe “dé” ti fi ìtọ́sọ́nà εἰς hàn láìní láti tún àpólà ibi ṣe.
- source_word: καὶ ἰδοὺ
  choice: Sì wò ó
  rationale: “Wò ó” jẹ́ àmì àsọyé tó ń pe àfiyèsí sí ohun tó tẹ̀ lé e, ó sì pa ìgbésí-ayé ìtàn ἰδού mọ́.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: ọmọ-ẹ̀yìn kan tí orúkọ rẹ̀ ń jẹ́ Timotiu wà níbẹ̀
  rationale: “Ọmọ-ẹ̀yìn” jẹ́ ìtumọ̀ déédéé fún μαθητής, “kan” sì pa àìdánimọ̀ τις mọ́. Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì sọ pé Timotiu wà ní ibi náà.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: Ọmọ obìnrin Júù onígbàgbọ́ kan ni
  rationale: “Onígbàgbọ́” nibi yìí túmọ̀ πιστή gẹ́gẹ́ bí ẹni tó gbàgbọ́, èyí tó bá lílò Lúùkù mu jù; àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ “olùṣòtítọ́” tó tún ṣeé ṣe mọ́.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: ṣùgbọ́n Gíríìkì ni baba rẹ̀
  rationale: Ìṣètò Yorùbá yìí mú gbólóhùn Gíríìkì tí a gé kúrú pé péré pé, ó sì pa ìyàtọ̀ tí δέ fi hàn mọ́. “Gíríìkì” jẹ́ ẹ̀yà tàbí àṣà ẹni náà, kì í ṣe ọ̀rọ̀ gbogbogbò “Kèfèrí.”
theological_decisions:
- issue: Ìtumọ̀ πιστῆς nípa ìyá Timotiu
  choice: obìnrin Júù onígbàgbọ́
  alternative: obìnrin Júù olùṣòtítọ́
  rationale: Nínú àyíká Ìṣe Àwọn Àpọ́sítélì, πιστός sábà máa ń tọ́ka sí ẹni tó gbàgbọ́. Síbẹ̀, ọ̀rọ̀ náà tún lè túmọ̀ sí ẹni olùṣòtítọ́, nítorí náà a kò fi ìtumọ̀ kejì náà pamọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lásán lè lóye ni a lò. A pa “Sì wò ó” mọ́ gẹ́gẹ́ bí àmì àsọyé tó ní agbára, a sì lo àwọn àmì ohùn níbi tó bá yẹ.
