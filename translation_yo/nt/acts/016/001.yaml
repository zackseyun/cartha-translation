  to: Ó sì tún dé Déríbè àti Lísírà. Kíyèsí i, ọmọ-ẹ̀yìn kan tí orúkọ rẹ̀ ń jẹ́ Timotiu wà níbẹ̀[b]. Ọmọkùnrin tí obìnrin Júù kan tó jẹ́ onígbàgbọ́ bí ni, ṣùgbọ́n Gíríìkì ni baba rẹ̀.
