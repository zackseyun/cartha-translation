  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé SBLGNT dáadáa nípa ìrìnàjò sí Déríbè àti Lísírà, ìfarahàn Timotiu gẹ́gẹ́ bí ọmọ-ẹ̀yìn kan níbẹ̀, àti ìyàtọ̀ láàárín ìyá Júù onígbàgbọ́ rẹ̀ àti baba Gíríìkì rẹ̀. Ṣùgbọ́n “Ọmọ obìnrin Júù ... ni” lè túmọ̀ sí “a female child/a girl” ní Yorùbá, kì í sì ṣe ìfihàn tí ó ṣe kedere pé Timotiu jẹ́ ọmọkùnrin tí obìnrin náà bí.
