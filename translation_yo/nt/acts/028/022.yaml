id: ACT.28.22
reference: Acts 28:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: yo
  text: Ṣùgbọ́n a rò pé ó yẹ kí a gbọ́ láti ẹnu rẹ ohun tí ìwọ rò; nítorí ní ti ẹgbẹ́ yìí, a mọ̀ pé níbi gbogbo ni àwọn ènìyàn ti ń sọ̀rọ̀ lòdì sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹgbẹ́ ìsìn” tàbí “ẹgbẹ́ kan”; ọ̀rọ̀ Gíríìkì αἵρεσις níhìn-ín kò fi dandan túmọ̀ sí “ẹ̀kọ́ èké” gẹ́gẹ́ bí a ṣe ń lo ọ́ ní ìtumọ̀ ìmọ̀ ẹ̀sìn ní àwọn àkókò tó tẹ̀ lé e.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: a rò pé ó yẹ
  rationale: Ó fi ìdájọ́ wọn hàn pé fífetí sí Pọ́ọ̀lù jẹ́ ohun tí ó tọ́, ó sì pa ìwà ọ̀wọ̀ àti ìṣọ́ra ọ̀rọ̀ Gíríìkì mọ́.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: kí a gbọ́ láti ẹnu rẹ
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n fẹ́ gbọ́ ọ̀rọ̀ náà lọ́wọ́ Pọ́ọ̀lù fúnra rẹ̀; ‘láti ẹnu rẹ’ jẹ́ èdè Yorùbá àdánidá fún gbígbọ́ tààrà láti ọ̀dọ̀ ẹni náà.
- source_word: ἃ φρονεῖς
  choice: ohun tí ìwọ rò
  rationale: φρονέω níhìn-ín tọ́ka sí èrò tàbí ojú ìwòye Pọ́ọ̀lù; lílo ‘ìwọ’ mú ìtẹnumọ́ ẹni tí wọ́n ń béèrè lọ́wọ́ rẹ̀ hàn.
- source_word: αἱρέσεως
  choice: ẹgbẹ́
  rationale: Ní àyíká Ìṣe Àwọn Àpọ́sítélì, ọ̀rọ̀ náà túmọ̀ sí ẹgbẹ́ tàbí ìgbìmọ̀ ẹ̀sìn, kì í ṣe dandan ‘ẹ̀kọ́ èké’ ní ìtumọ̀ ìmọ̀ ẹ̀sìn ti igbà tó tẹ̀ lé e.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: a mọ̀
  rationale: Èyí túmọ̀ ìkọ̀lé aláìlẹ́ni Gíríìkì sí Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: πανταχοῦ
  choice: níbi gbogbo
  rationale: Ó pa ìtumọ̀ ibi tí ó gbòòrò ti πανταχοῦ mọ́ ní Yorùbá àdánidá.
- source_word: ἀντιλέγεται
  choice: àwọn ènìyàn ti ń sọ̀rọ̀ lòdì sí i
  rationale: Ìṣe aláìdárúkọ Gíríìkì túmọ̀ sí pé a ń sọ̀rọ̀ tako ẹgbẹ́ náà. Yorùbá sábà máa ń lo olùṣe gbogbogbò bí ‘àwọn ènìyàn’ dípò ìkọ̀lé aláìṣe tí kò bá èdè mu.
theological_decisions:
- issue: Ìtumọ̀ αἵρεσις
  choice: ẹgbẹ́
  alternative: ẹ̀kọ́ èké
  rationale: Àwọn olùsọ̀rọ̀ ń tọ́ka sí ìgbìmọ̀ àwọn ọmọlẹ́yìn Jésù gẹ́gẹ́ bí ẹgbẹ́ ẹ̀sìn. ‘Ẹ̀kọ́ èké’ yóò fi ìtumọ̀ ìmọ̀ ẹ̀sìn ti àkókò tó tẹ̀ lé e wọ ẹsẹ̀ náà, èyí tí ọ̀rọ̀ Gíríìkì kò béèrè níhìn-ín.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà ní ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘láti ẹnu rẹ’ fún ìgbọ́rọ̀ tààrà, àti ‘àwọn ènìyàn ti ń sọ̀rọ̀ lòdì sí i’ láti sọ ìṣe aláìdárúkọ Gíríìkì ní Yorùbá àdánidá.
