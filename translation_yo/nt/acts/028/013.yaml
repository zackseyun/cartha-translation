  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: yo
  text: Láti ibẹ̀[a], lẹ́yìn tí a gbé ìdákọ̀ró sókè, a dé Régíọ̀mù. Lẹ́yìn ọjọ́ kan, nígbà tí afẹ́fẹ́ gúúsù bẹ̀rẹ̀ sí í fẹ́, a dé Puteólì ní ọjọ́ kejì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí a gbéra ọkọ̀ ojú omi.” Ọ̀rọ̀ Gíríìkì περιελόντες jẹ́ ọ̀rọ̀ iṣẹ́ ọkọ̀ ojú omi; ó lè tọ́ka ní pàtó sí gbígbé ìdákọ̀ró sókè tàbí, ní ìtumọ̀ gbígbòòrò, sí bíbẹ̀rẹ̀ ìrìn-àjò ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Láti ibẹ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí ibi tí ìrìn-àjò ti tẹ̀ síwájú.
- source_word: περιελόντες
  choice: lẹ́yìn tí a gbé ìdákọ̀ró sókè
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò ojú omi yìí, ó lè túmọ̀ sí yíyọ ohun tí ó di ọkọ̀ mú, ní pàtàkì gbígbé ìdákọ̀ró sókè; a fi ìtumọ̀ tí ó gbòòrò sí i sínú àlàyé ìsàlẹ̀.
- source_word: κατηντήσαμεν
  choice: a dé
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídé ibi tí a ń lọ; ‘a dé’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Ῥήγιον
  choice: Régíọ̀mù
  rationale: Àkọsílẹ̀ orúkọ ibi ìgbàanì náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀ Yorùbá.
- source_word: μετὰ μίαν ἡμέραν
  choice: Lẹ́yìn ọjọ́ kan
  rationale: Ó pa ìtòlẹ́sẹẹsẹ àkókò inú Gíríìkì mọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐπιγενομένου νότου
  choice: nígbà tí afẹ́fẹ́ gúúsù bẹ̀rẹ̀ sí í fẹ́
  rationale: Ó mú ipò tó bá ìṣẹ̀lẹ̀ náà rìn jáde lọ́nà àdánidá, ó sì pa ìtumọ̀ pé afẹ́fẹ́ gúúsù ṣẹ̀ṣẹ̀ dìde mọ́.
- source_word: δευτεραῖοι
  choice: ní ọjọ́ kejì
  rationale: Ó fara mọ́ ìtumọ̀ adverbial náà pé wọ́n dé ní ọjọ́ kejì.
- source_word: ἤλθομεν
  choice: a dé
  rationale: Pẹ̀lú ibi tí wọ́n ń lọ tí a mẹ́nu kàn, ‘a dé’ ni Yorùbá tí ó ṣe kedere jù fún ìròyìn ìrìn-àjò yìí.
- source_word: Ποτιόλους
  choice: Puteólì
  rationale: Àkọsílẹ̀ orúkọ ibi náà ní ọ̀nà tó bójú mu fún kíkà ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A ṣe àkọsílẹ̀ àwọn orúkọ ibi ní ọ̀nà tí ó lè ṣeé kà ní Yorùbá.
