id: ACT.28.31
reference: Acts 28:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: yo
  text: ó ń kéde ìjọba Ọlọ́run, ó sì ń kọ́ni ní àwọn ohun tí ó kan Olúwa Jésù Mèsáyà[a] pẹ̀lú gbogbo ìgboyà, láìsí ìdènà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ oyè (“Mèsáyà”) tàbí, ní àwọn àyíká kan, ọ̀rọ̀ tó ń ṣiṣẹ́ bí orúkọ (“Kristi”).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: Ọ̀rọ̀ ìṣe alábàápín ti àkókò ìsinsìnyí ń ṣàpèjúwe iṣẹ́ tí Paulu ń bá a lọ; “kéde” pa ìtumọ̀ ìpolongo ní gbangba mọ́ láìfi mọ́ ìwàásù àṣẹ̀ṣe nìkan.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì lè gba ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run.
- source_word: διδάσκων
  choice: ó sì ń kọ́ni
  rationale: Ó fi iṣẹ́ ìkọ́ni tí ń bá a lọ hàn, ó sì bá κηρύσσων dọ́gba nínú gbólóhùn.
- source_word: τὰ περὶ
  choice: àwọn ohun tí ó kan
  rationale: Ó ṣàfihàn ìtumọ̀ ọ̀rọ̀ Gíríìkì ní kedere, ó sì jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ líle lọ.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni oyè Kristẹni tó fìdí múlẹ̀ fún κύριος nínú Májẹ̀mú Tuntun.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: “Jesu” jẹ́ orúkọ, “Mèsáyà” sì pa agbára Χριστός gẹ́gẹ́ bí oyè mọ́; Yorùbá kò nílò àpilẹ̀kọ ọ̀tọ̀ níwájú oyè náà.
- source_word: μετὰ πάσης παρρησίας
  choice: pẹ̀lú ìgboyà gbogbo
  rationale: παρρησία ní ìtumọ̀ ọ̀rọ̀ sísọ ní gbangba, láìbẹ̀rù; “gbogbo” pa agbára πάσης mọ́.
- source_word: ἀκωλύτως
  choice: láìsí ìdènà
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtẹnumọ́ ọ̀rọ̀ ìparí Ìṣe Àwọn Aposteli mọ́ pé a kò dá iṣẹ́ ìkéde náà dúró.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àkójọpọ̀ oyè nípa Jesu
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè tó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí “Kristi” jẹ́ àṣàyàn tó mọ́ọ̀mọ́ bí orúkọ.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A tún “ó ń” ṣe láti mú àwọn ọ̀rọ̀ ìṣe alábàápín méjèèjì hàn ní àdánidá. Àmì ẹsẹ̀ [a] wà lẹ́yìn “ìgboyà gbogbo” láti tẹ̀lé ìṣètò ìwé ìtọ́kasí tí a pèsè, bí ó tilẹ̀ jẹ́ pé àlàyé náà kan “Mèsáyà.”
