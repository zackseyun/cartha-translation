  terminology: “Gba … gbọ́” yẹ fún ìdánilójú nínú àyíká yìí, kò sì dá a dọ́gba pátápátá mọ́ ìgbàgbọ́ ìgbàlà. A tún ṣe àtúnṣe ọ̀rọ̀ àlàyé náà kí “kò ní ìgbàgbọ́,” tí ó lè sọ ipò ẹ̀mí tàbí ànímọ́ pípẹ́ ju ìdáhùn nínú ẹsẹ̀ lọ, má bà a darí. “Kò gbàgbọ́” jẹ́ àṣàyàn tààrà, “ṣàì gbàgbọ́” sì jẹ́ àṣàyàn kúkúrú tí kò fi ìtumọ̀ ẹ̀kọ́ kún un.
