  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: yo
  text: Àwọn kan sì gba ohun tí a ń sọ gbọ́, ṣùgbọ́n àwọn mìíràn kò gbà á gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn mìíràn kò gbàgbọ́” tàbí “àwọn mìíràn ṣàì gbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείθοντο
  choice: gba … gbọ́
  rationale: Ọ̀rọ̀ yìí fi hàn pé ọ̀rọ̀ tí wọ́n ń gbọ́ ń mú kí àwọn kan ní ìdánilójú. ‘Gba … gbọ́’ jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi ìtumọ̀ ìgbàgbọ́ ìgbàlà kún ẹsẹ̀ náà láìsí ẹ̀rí.
- source_word: τοῖς λεγομένοις
  choice: ohun tí a ń sọ
  rationale: Àpólà present passive yìí tọ́ka sí àkóónú ọ̀rọ̀ tí a ń sọ lọ́wọ́; ‘ohun tí a ń sọ’ pa ìṣe tí ń lọ lọ́wọ́ àti irú passive náà mọ́ ní Yorùbá àdánidá.
- source_word: ἠπίστουν
  choice: kò gbà á gbọ́
  rationale: Ìtumọ̀ tààrà ni pé àwọn yòókù kò gba ọ̀rọ̀ náà gbọ́. Èyí kò fi èrò pé wọ́n mọ̀ọ́mọ̀ kọ̀ láti gbà á gbọ́ kún ọ̀rọ̀ Gíríìkì.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: àwọn kan … ṣùgbọ́n àwọn mìíràn
  rationale: Ìṣètò yìí fi ìyàtọ̀ láàárín ẹgbẹ́ méjì hàn ní kedere, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ ìtakora náà.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú lọ́nà àdánidá láìfi ìbáṣepọ̀ míì tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Irú ìyàtọ̀ tó wà nínú ìdáhùn àwọn olùgbọ́
  choice: Ẹsẹ̀ náà sọ pé àwọn kan gba ọ̀rọ̀ tí a ń sọ gbọ́, àwọn mìíràn kò sì gbà á gbọ́.
  alternative: Kí a sọ pé àwọn kan di onígbàgbọ́ tòótọ́, àwọn mìíràn sì jẹ́ aláìgbàgbọ́ líle ọkàn ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀.
  rationale: Gíríìkì ṣàpèjúwe ìdáhùn wọn sí ọ̀rọ̀ Pọ́ọ̀lù ní àkókò náà, ṣùgbọ́n kò dá ipò ẹ̀mí wọn níkẹyìn láre. Ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘gba … gbọ́’ láti mú ìtakora ọ̀rọ̀ méjèèjì jáde lọ́nà Yorùbá àdánidá.
