  source_fidelity: 'Ìtumọ̀ pàtàkì náà jẹ́ olóòtọ́ sí Gíríìkì: “gba … gbọ́” ń sọ ἐπείθοντο ní ti ìdánilójú sí ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ, “ohun tí a ń sọ” ń gbé ìṣe tí ń lọ lọwọ́ nínú τοῖς λεγομένοις kalẹ̀, “kò gbà á gbọ́” sì ń pa ìtakora ἠπίστουν mọ́ láìfi ìmọ̀ọ́mọ̀-kíkọ̀ tàbí ìpinnu ẹ̀kọ́ ìgbàgbọ́ kún un. Àmì àlàyé náà, bí ó ti wà, yẹ kí ó so mọ́ ọ̀rọ̀ tí ó ń ṣàlàyé, ìyẹn ἠπίστουν.'
