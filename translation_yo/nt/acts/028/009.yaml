revisions:
- from: Lẹ́yìn tí èyí ṣẹlẹ̀, àwọn yòókù ní erékùṣù náà tí wọ́n ní àwọn àìsàn[a] pẹ̀lú ń wá, a sì ń mú wọn lára dá.
  to: Lẹ́yìn tí èyí ṣẹlẹ̀, àwọn ènìyàn yòókù tó wà ní erékùṣù náà tí wọ́n ní àwọn àìsàn náà ń wá, a sì ń wò wọ́n sàn.
  rationale: Àtúnṣe náà mú kaί hàn pẹ̀lú ‘náà,’ ó ṣe àfihàn ẹgbẹ́ àwọn ènìyàn tó wà lórí erékùṣù náà kedere, ó sì rọ́pò ìkọ̀lé ìwòsàn tí kò wọ́pọ̀ pẹ̀lú ‘a ń wò wọ́n sàn.’ Àmì imperfect náà ṣì wà nínú ‘ń wá’ àti ‘ń wò.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:39Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìlànà àkókò ti τούτου δὲ γενομένου, ìtumọ̀ ‘àwọn yòókù,’ àti ìwòsàn aláìṣiṣẹ́ hàn dáadáa. Ṣùgbọ́n pẹ̀lú nínú ìkọ̀lé ‘pẹ̀lú ń wá’ kò jẹ́ ìsopọ̀ Yorùbá tó yẹ ní ibẹ̀, ó sì lè dá ìṣàn gbolóhùn rú.
  naturalness: ‘Àwọn yòókù ní erékùṣù náà’ lè hàn bí ẹni pé ‘ní erékùṣù’ ń ṣàlàyé ‘yòókù’ dípò àwọn ènìyàn náà. ‘Àwọn ènìyàn yòókù tó wà ní erékùṣù náà’ jẹ́ mímọ́ síi. ‘A sì ń wò wọ́n sàn’ jẹ́ ọ̀nà Yorùbá boṣewa, àdánidá fún ìṣe ìwòsàn passive ju ‘a sì ń mú wọn lára dá’ lọ.
  terminology: ‘Àwọn àìsàn’ ń tẹ̀lé ọ̀pọ̀ ἀσθενείας ní pẹkipẹki. ‘Wò ... sàn’ jẹ́ ọ̀rọ̀ ìwòsàn tí ó wọ́pọ̀, tí kò sì fi ìtumọ̀ ẹ̀sìn kan kún ọ̀rọ̀ náà.
  issues:
  - severity: medium
    issue: Ìkọ̀lé ‘pẹ̀lú ń wá’ kò dára nínú gbolóhùn náà.
    rationale: Pẹ̀lú kò lè so imperfect ‘ń wá’ pọ̀ ní ọ̀nà àdánidá bẹ́ẹ̀. ‘Nàá’ lẹ́yìn kókó-ọrọ náà ń mú kaί (‘also’) hàn kedere.
  - severity: low
    issue: ‘Àwọn yòókù ní erékùṣù náà’ ní ìdààmú ìbáṣepọ̀ ọ̀rọ̀ díẹ̀.
    rationale: Fífún ‘àwọn ènìyàn’ àti ‘tó wà ní erékùṣù náà’ hàn kedere ń so οἱ λοιποί οἱ ἐν τῇ νήσῳ mọ́ láìsí àìgbọ́yé.
  - severity: low
    issue: ‘A sì ń mú wọn lára dá’ kì í ṣe ọ̀nà tí ó wọ́pọ̀ jù lọ fún ‘were healed.’
    rationale: ‘A sì ń wò wọ́n sàn’ jẹ́ ìkọ̀lé aláìdárúkọ tí ó wọ́pọ̀ nínú Yorùbá, ó sì ń fi passive ἐθεραπεύοντο hàn.
  revised_text: Lẹ́yìn tí èyí ṣẹlẹ̀, àwọn ènìyàn yòókù tó wà ní erékùṣù náà tí wọ́n ní àwọn àìsàn náà ń wá, a sì ń wò wọ́n sàn.
