id: ACT.28.9
reference: Acts 28:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: yo
  text: Lẹ́yìn tí èyí ṣẹlẹ̀, àwọn ènìyàn yòókù tó wà ní erékùṣù náà tí wọ́n ní àwọn àìsàn náà ń wá, a sì ń wò wọ́n sàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Lẹ́yìn tí èyí ṣẹlẹ̀
  rationale: Ó fi ìbáṣepọ̀ àkókò tí genitive absolute náà hàn ní Yorùbá àdánidá, δέ sì ń darí ìtàn sí ohun tó ṣẹlẹ̀ lẹ́yìn náà.
- source_word: οἱ λοιποί
  choice: àwọn yòókù
  rationale: Ó tọ́ka sí àwọn ènìyàn tó kù lẹ́yìn ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa ìtumọ̀ ‘the rest/remaining ones’ mọ́.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: ní erékùṣù náà
  rationale: Ọ̀rọ̀ yìí dá ẹgbẹ́ náà mọ̀ gẹ́gẹ́ bí àwọn tó wà ní erékùṣù Málítà; lílo ‘ní erékùṣù’ jẹ́ Yorùbá àdánidá.
- source_word: ἔχοντες ἀσθενείας
  choice: tí wọ́n ní àwọn àìsàn
  rationale: Ó pa participle ‘ní/níní’ àti ọ̀pọ̀ ἀσθενείας mọ́, dípò yíyí gbogbo rẹ̀ sí gbólóhùn gbogbogbò pé ara wọn kò yá.
- source_word: προσήρχοντο
  choice: ń wá
  rationale: Àmì ‘ń’ mú ìṣe tó ń ṣẹlẹ̀ léraléra nínú imperfect náà hàn; a kò fi ‘sọ́dọ̀ rẹ̀’ kún un nítorí kò hàn gbangba nínú Gíríìkì.
- source_word: ἐθεραπεύοντο
  choice: a sì ń mú wọn lára dá
  rationale: Ìkọ̀lé aláṣe àìdá ‘a ń’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ passive, ó sì mú imperfect tó ń tọ́ka sí ìmúláradá léraléra hàn.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi hàn pé àwọn mìíràn náà wá lẹ́yìn ìwòsàn tí a sọ ṣáájú.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá bá èdè àdánidá mu. Èdè náà jẹ́ mímọ́gbọ́n-dání ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a lo ‘ń wá’ àti ‘a sì ń mú wọn lára dá’ láti mú ìṣe léraléra inú àwọn imperfect méjèèjì hàn.
