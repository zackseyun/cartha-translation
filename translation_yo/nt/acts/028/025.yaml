revisions:
- from: 'Nígbà tí wọn kò sì fohùn ṣọ̀kan pẹ̀lú ara wọn, wọ́n ń lọ lẹ́yìn tí Paulu sọ ọ̀rọ̀ ìparí kan[a] pé: “Ohun tí Ẹ̀mí Mímọ́ sọ nípasẹ̀ Aísáyà wòlíì fún àwọn baba ńlá yín[b] tọ́ pé—'
  to: 'Nígbà tí wọn kò sì fohùn ṣọ̀kan pẹ̀lú ara wọn, wọ́n ń lọ lẹ́yìn tí Paulu sọ ọ̀rọ̀ ìparí kan[a] pé: “Ẹ̀mí Mímọ́ sọ̀rọ̀ lọ́nà tí ó tọ́ nípasẹ̀ Aísáyà wòlíì sí àwọn baba ńlá yín[b] pé—'
  rationale: The revision corrects the scope and Yoruba syntax of the rendering for Καλῶς while retaining the draft’s meaning, register, tone marks, verse-continuation dash, and footnote anchors. It also renders πρὸς with the more direct recipient marker “sí.”
  reviewer_model: gpt-5.6-terra
