id: ACT.28.25
reference: Acts 28:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: yo
  text: 'Nígbà tí wọn kò sì fohùn ṣọ̀kan pẹ̀lú ara wọn, wọ́n ń lọ lẹ́yìn tí Paulu sọ ọ̀rọ̀ ìparí kan[a] pé: “Ẹ̀mí Mímọ́ sọ̀rọ̀ lọ́nà tí ó tọ́ nípasẹ̀ Aísáyà wòlíì sí àwọn baba ńlá yín[b] pé—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ kan” tàbí “gbólóhùn kan.” Ní ti gidi, èdè Gíríìkì ní “ọ̀rọ̀ kan”; níbí, ó jẹ́ ọ̀rọ̀ tí Paulu fi parí àsọyé rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn baba yín” tàbí “àwọn àgbà ìran yín.” Èdè Gíríìkì ní “àwọn baba yín,” ó sì ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Nígbà tí wọn kò sì fohùn ṣọ̀kan pẹ̀lú ara wọn
  rationale: “Kò fohùn ṣọ̀kan” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn ń tako ara wọn ní èrò; “pẹ̀lú ara wọn” sì pa ìtumọ̀ ìbáṣepọ̀ πρὸς ἀλλήλους mọ́.
- source_word: ἀπελύοντο
  choice: wọ́n ń lọ
  rationale: Àkókò imperfect náà fi ìṣe tí ó ń lọ lọ́wọ́ hàn. Ọ̀rọ̀ yìí jẹ́ kí ó ṣe kedere pé wọ́n ń kúrò níbẹ̀, láì fi kún un pé ẹnì kan lé wọn lọ.
- source_word: εἰπόντος τοῦ Παύλου
  choice: lẹ́yìn tí Paulu sọ
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò Yorùbá tí ó ṣe àfihàn pé ọ̀rọ̀ Paulu ṣáájú kíkúrò wọn.
- source_word: ῥῆμα ἓν
  choice: ọ̀rọ̀ ìparí kan
  rationale: Ní ti gidi, ó túmọ̀ sí “ọ̀rọ̀ kan,” ṣùgbọ́n níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ tí Paulu fi parí àsọyé rẹ̀. Àlàyé ìtumọ̀ gidi wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: Καλῶς
  choice: tọ́
  rationale: “Tọ́” pa agbára ìdájọ́ καλῶς mọ́ pé ohun tí a sọ jẹ́ èyí tí ó bá òtítọ́ mu, dípò kí a sọ kìkì pé a sọ ọ́ lọ́nà tí ó dára.
- source_word: τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν
  choice: Ohun tí Ẹ̀mí Mímọ́ sọ ... tọ́
  rationale: Ìṣètò gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì sọ Ẹ̀mí Mímọ́ di olùṣe ọ̀rọ̀ náà ní kedere.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: nípasẹ̀ Aísáyà wòlíì
  rationale: “Nípasẹ̀” fi ipa Aísáyà gẹ́gẹ́ bí ẹni tí Ẹ̀mí Mímọ́ gbà sọ̀rọ̀ hàn, bí διά pẹ̀lú genitive ṣe ń ṣe.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: fún àwọn baba ńlá yín
  rationale: “Àwọn baba ńlá yín” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún àwọn baba ìran tàbí àwọn baba ńlá Ísírẹ́lì, ó sì pa àwòrán ìdílé tí πατέρας ní mọ́.
theological_decisions:
- issue: Ẹni tí ó sọ àsọtẹ́lẹ̀ náà àti ẹni tí a gbà sọ ọ́
  choice: Ẹ̀mí Mímọ́ sọ nípasẹ̀ Aísáyà wòlíì
  alternative: Aísáyà wòlíì sọ ọ̀rọ̀ Ẹ̀mí Mímọ́
  rationale: Àṣàyàn náà tẹ̀ lé gírámà Gíríìkì nípa fífi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí olùsọ̀rọ̀, Aísáyà sì ni ẹni tí a gbà sọ ọ̀rọ̀ náà; kò dín Ẹ̀mí Mímọ́ kù sí agbára aláìlẹ́ni-lọ́kàn.
- issue: Ìtọ́kasí àwọn baba
  choice: àwọn baba ńlá yín
  alternative: àwọn baba yín; àwọn àgbà ìran yín
  rationale: Àṣàyàn náà pa ọ̀rọ̀ akọ πατέρας àti ìtọ́kasí rẹ̀ sí àwọn baba ìran Ísírẹ́lì mọ́, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ ẹ̀ya kan.
- issue: Ìtumọ̀ καλῶς
  choice: Ohun tí Ẹ̀mí Mímọ́ sọ ... tọ́
  alternative: Ẹ̀mí Mímọ́ sọ̀rọ̀ dáadáa
  rationale: Èyí pa ìdájọ́ pé ọ̀rọ̀ náà tọ́ mọ́, ṣùgbọ́n kò tú u sí “òtítọ́” ní ọ̀nà tí yóò mú ìtumọ̀ rẹ̀ dín kù tàbí yanju gbogbo àìdánilójú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Kò fohùn ṣọ̀kan” àti “wọ́n ń lọ” rọrùn fún òǹkàwé lónìí, nígbà tí “nípasẹ̀ Aísáyà wòlíì” pa ìwọ̀n àsọtẹ́lẹ̀ àti ọ̀wọ̀ ọ̀rọ̀ náà mọ́. Àmì gígùn ní ìparí fi hàn pé àsọyé Paulu ń bá a lọ sí ẹsẹ tó tẹ̀ lé.
