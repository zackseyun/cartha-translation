id: ACT.28.15
reference: Acts 28:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: yo
  text: Láti ibẹ̀ náà, nígbà tí àwọn ará[a] gbọ́ nípa wa, wọ́n wá pàdé wa títí dé Fọ́ròmù Ápíù àti Ilé-Ìgbọ̀nsẹ Mẹ́ta. Nígbà tí Paulu rí wọn, ó dúpẹ́ lọ́wọ́ Ọlọ́run, ó sì ní ìgboyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ní, ní ti gidi, “àwọn arákùnrin,” ṣùgbọ́n ó sábà máa ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè kan àwọn ọkùnrin àti obìnrin nínú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Àti láti ibẹ̀
  rationale: Ó pa ìsopọ̀ ìtàn ìrìn-àjò àti ìtọ́kasí ibi tí καί + ἐκεῖθεν ní mọ́, ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn ará[a]
  rationale: “Àwọn ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè yí àwọn ọkùnrin àti obìnrin ká. Àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì lo ọ̀rọ̀ tí ìtumọ̀ rẹ̀ ní ti gidi jẹ́ “àwọn arákùnrin.”
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: nígbà tí ... gbọ́ nípa wa
  rationale: A tú participle náà sí gbólóhùn àkókò, a sì pa ìtumọ̀ τὰ περὶ ἡμῶν mọ́ láì fi “ìròyìn” kún un ní dandan.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: wọ́n wá pàdé wa
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé fún àṣà ọ̀rọ̀ Gíríìkì pé wọ́n lọ láti lọ pàdé àwọn arìnrìn-àjò náà.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: títí dé Ọjà Ápíù àti Ilé-Àlejò Mẹ́ta
  rationale: “Títí dé” pa ìwọ̀n jíjìn tí ἄχρι tọ́ka sí mọ́. A tú àwọn orúkọ ibi náà lọ́nà tí ó jẹ́ kí ìtumọ̀ wọn yé òǹkàwé Yorùbá.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Nígbà tí Paulu rí wọn
  rationale: A sọ participle náà di gbólóhùn àkókò tó ṣe déédé, “wọn” sì ń tọ́ka sí àwọn ará tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: ó dúpẹ́ lọ́wọ́ Ọlọ́run
  rationale: “Dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ọpẹ́ fún ẹni kan, ó sì pa Ọlọ́run gẹ́gẹ́ bí ẹni tí Paulu dúpẹ́ lọ́wọ́ rẹ̀ mọ́.
- source_word: ἔλαβε θάρσος
  choice: ó sì mú ọkàn le
  rationale: Àṣà ọ̀rọ̀ Yorùbá yìí sọ ní kedere pé Paulu ní ìgboyà tàbí pé ọkàn rẹ̀ le, ó sì yẹra fún ìtumọ̀ tí yóò sọ ọ́ di ìgbéraga tàbí ìjàgídíjàgan.
theological_decisions:
- issue: Bí a ṣe tú ἀδελφοί fún àwùjọ àwọn Kristẹni tí ó ṣeé ṣe kí ọkùnrin àti obìnrin wà nínú rẹ̀
  choice: àwọn ará
  alternative: àwọn arákùnrin; àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: “Àwọn ará” jẹ́ ọ̀rọ̀ Yorùbá tí ìjọ Kristẹni àti èdè ojoojúmọ́ lè lò fún àwọn ẹlẹgbẹ́ láì sọ pé ọkùnrin nìkan ni wọ́n. Àlàyé ìsàlẹ̀ ṣí irú ọ̀rọ̀ Gíríìkì náà payá, láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, oníyì, tí ó sì ṣeé lóye. A lo “àwọn ará” gẹ́gẹ́ bí ọ̀rọ̀ Kristẹni àdánidá; a tú àwọn orúkọ ibi ní ìtumọ̀ (“Ọjà Ápíù,” “Ilé-Àlejò Mẹ́ta”) kí wọ́n má bàa dà bí àwọn ìró àjèjì tí kò ní ìtumọ̀ fún òǹkàwé. Gbólóhùn méjì náà pa ìtẹ̀lé ìṣẹ̀lẹ̀ orísun mọ́.
