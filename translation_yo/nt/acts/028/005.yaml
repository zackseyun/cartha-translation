  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: yo
  text: Nígbà náà, lẹ́yìn tí ó gbọn ẹranko náà[a] sínú iná, kò ní ìpalára kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹranko igbó” tàbí “ẹranko ńlá.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ gbogbogbò, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé ejò ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Nítorí náà, ... ó
  rationale: Ọ̀rọ̀ atọ́ka náà dúró gẹ́gẹ́ bí arọ́pò-orúkọ, ó sì ń tọ́ka sí Paulu; μέν οὖν ní agbára ìyípadà kékeré nínú ìtàn, èyí tí ‘Nítorí náà’ fi hàn lọ́nà àdánidá.
- source_word: ἀποτινάξας
  choice: lẹ́yìn tí ó gbọn ... sínú
  rationale: Aorist participle náà fi hàn pé fífi ẹranko náà gbọn kúrò ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘lẹ́yìn tí’ mú ìbáṣepọ̀ yìí ṣe kedere ní Yorùbá.
- source_word: τὸ θηρίον
  choice: ẹranko náà
  rationale: θηρίον jẹ́ ọ̀rọ̀ gbogbogbò fún ẹranko, ní pàtàkì ẹranko igbó; bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé ejò ni, a kò fi ọ̀rọ̀ pàtó fún ‘ejò’ sí ibi tí Gíríìkì kò ti lò ó.
- source_word: εἰς τὸ πῦρ
  choice: sínú iná
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá àti tààrà fún ìtọ́sọ́nà εἰς pẹ̀lú accusative.
- source_word: ἔπαθεν
  choice: fara pa
  rationale: Nínú àkópọ̀ rẹ̀ pẹ̀lú οὐδὲν κακόν, gbólóhùn Yorùbá ‘fara pa’ sọ ìfarapa tàbí ipa búburú tí kò ṣẹlẹ̀ lọ́nà àdánidá.
- source_word: οὐδὲν κακόν
  choice: kò ... rárá
  rationale: Ìkọ̀nísẹ́ ‘kò ... rárá’ fi hàn kedere pé kò sí ìfarapa tàbí ipa búburú kankan.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì pa ìtẹ̀síwájú ìtàn àti àìpàtó ọ̀rọ̀ θηρίον mọ́.
