id: ACT.28.6
reference: Acts 28:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n ń retí pé ara rẹ̀ yóò wú, tàbí pé òun yóò ṣubú lulẹ̀ lójijì, yóò sì kú. Ṣùgbọ́n lẹ́yìn tí wọ́n ti dúró pẹ́, tí wọ́n sì rí i pé kò sí ohun àjèjì kankan tó ṣẹlẹ̀ sí i[a], wọ́n yí èrò wọn padà, wọ́n sì bẹ̀rẹ̀ sí í sọ pé òrìṣà kan ni òun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sí ohun tí kò wọ́pọ̀” tàbí “kò sí ohun tí kò bójú mu” tó ṣẹlẹ̀ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: wọ́n ń retí
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì fi ìfojúsọ́nà tí ó ń bá a lọ hàn; ‘wọ́n ń retí’ jẹ́ Yorùbá àdánidá fún un.
- source_word: μέλλειν πίμπρασθαι
  choice: pé ara rẹ̀ yóò wú
  rationale: Nínú àyíká jíjẹ ejò, πίμπρασθαι ń tọ́ka sí wíwú ara; ìtumọ̀ yìí dára ju ìtumọ̀ gangan ti jíjó lọ.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: pé òun yóò ṣubú lulẹ̀ lójijì, yóò sì kú
  rationale: Ó pa ìṣubú, ìṣẹ̀lẹ̀ òjijì, àti ikú mọ́, ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐπὶ πολὺ
  choice: lẹ́yìn tí wọ́n ti dúró pẹ́
  rationale: Ó fi àkókò gígùn tí wọ́n fi ń retí àti ṣọ́ ọ hàn lọ́nà àdánidá.
- source_word: θεωρούντων
  choice: tí wọ́n sì rí i
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwo tàbí ṣíṣàkíyèsí pẹ̀lú àfiyèsí; ‘rí i’ bá àkópọ̀ gbólóhùn Yorùbá mu.
- source_word: μηδὲν ἄτοπον
  choice: kò sí ohun àjèjì kankan
  rationale: ‘Àjèjì’ pa ìtumọ̀ gbígbòòrò ti ohun tí kò bójú mu tàbí tí kò wọ́pọ̀ mọ́, láì fi ‘ipalára’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: μεταβαλόμενοι
  choice: wọ́n yí èrò wọn padà
  rationale: Ó sọ ìyípadà nínú ìdájọ́ tàbí èrò wọn ní kedere.
- source_word: ἔλεγον
  choice: wọ́n sì bẹ̀rẹ̀ sí í sọ
  rationale: Ó mú agbára àìpé ọ̀rọ̀-ìṣe náà jáde gẹ́gẹ́ bí ìbẹ̀rẹ̀ àti ìtẹ̀síwájú ọ̀rọ̀ wọn.
- source_word: θεόν
  choice: ọlọ́run kan
  rationale: Nínú àyíká àwọn abọ̀rìṣà tí wọ́n ní ọ̀pọ̀ ọlọ́run, ọ̀rọ̀ aláìní àtẹnumọ́ náà tọ́ka sí ‘ọlọ́run kan,’ kì í ṣe Ọlọ́run tòótọ́ kan ṣoṣo.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ αὐτὸν εἶναι θεόν láì fi ẹ̀kọ́ Kristẹni tó sọ Pọ́ọ̀lù di Ọlọ́run sínú rẹ̀
  choice: ọlọ́run kan ni òun
  alternative: Ọlọ́run ni òun; ẹ̀dá àtọ̀runwá ni òun
  rationale: Ìtàn náà ń ròyìn ìpinnu àṣìṣe àwọn ará erékùṣù nínú àyíká ìgbàgbọ́ ọlọ́run púpọ̀. ‘Ọlọ́run kan’ pa èrò wọn mọ́, ó sì yẹra fún dídá Pọ́ọ̀lù mọ́ Ọlọ́run kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá; ìforúkọpò ‘òun’ mú kí ẹni tí ara rẹ̀ wú tàbí tó ṣubú hàn kedere, tí ọ̀rọ̀ sì dúró ní ìpele ọ̀wọ̀ àti òye àwọn òǹkàwé òde òní.
