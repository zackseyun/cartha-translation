id: ACT.28.20
reference: Acts 28:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: yo
  text: Nítorí ìdí èyí náà ni mo fi bẹ̀ yín pé kí n rí yín kí n sì bá yín sọ̀rọ̀; nítorí ìrètí Israẹli[a] ni mo fi ẹ̀wọ̀n yìí wọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrètí tí Israẹli ní.” Ó ṣeé ṣe kí èyí tọ́ka sí ìrètí májẹ̀mú àti ìrètí àjíǹde tí Paulu ń kéde.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Nítorí ìdí èyí
  rationale: Ọ̀rọ̀ yìí fi ìdí àti àbájáde ohun tí Paulu ṣẹ̀ṣẹ̀ sọ hàn. Èdè Yorùbá kò nílò kí a tún “nítorí náà” fi kún un, nítorí ìṣètò “nítorí… ni…” ti mú agbára ọ̀rọ̀ Gíríìkì méjèèjì jáde lọ́nà àdánidá.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν
  choice: mo ní kí ẹ wá, kí n lè rí yín
  rationale: “Mo ní kí ẹ wá” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó béèrè pé kí wọ́n wá bá a; “kí n lè rí yín” sì pa ìtumọ̀ ἰδεῖν mọ́. Wíwá náà fara hàn nínú àyíká ọ̀rọ̀ bí ó tilẹ̀ jẹ́ pé a kò sọ ọ́ ní tààrà nínú Gíríìkì.
- source_word: προσλαλῆσαι
  choice: kí n sì bá yín sọ̀rọ̀
  rationale: “Bá… sọ̀rọ̀” fi ìjíròrò alábápín hàn, dípò ọ̀rọ̀ tí ẹnì kan ṣoṣo ń sọ sí àwọn ẹlòmíràn.
- source_word: ἕνεκεν γὰρ
  choice: nítorí … ni … ṣe
  rationale: Ìṣètò yìí sọ ìdí tí ẹ̀wọ̀n fi wà lára Paulu ní kedere, ó sì jẹ́ èdè Yorùbá tó ń ṣàn dáadáa.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: ìrètí Israẹli
  rationale: Ó pa gbólóhùn oníṣe-ìní Gíríìkì mọ́ ní ṣókí, láì fi kún un pé ìrètí náà jẹ́ ti Mèsáyà, àjíǹde, tàbí ìlérí májẹ̀mú nìkan.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: ẹ̀wọ̀n yìí ṣe wà lára mi
  rationale: Èyí pa àwòrán ohun ìdè kan ṣoṣo tí ó wà lára Paulu mọ́. Ó yẹra fún “mo fi… de ara mi,” èyí tí ó lè túmọ̀ sí pé òun fúnra rẹ̀ ló de ara rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ìrètí Israẹli”
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “ìrètí Israẹli,” láì túmọ̀ ọ́ síwájú nínú ẹsẹ náà.
  alternative: “ìrètí àjíǹde Israẹli” tàbí “ìrètí Mèsáyà tí a ṣèlérí fún Israẹli”
  rationale: Ó ṣeé ṣe kí gbólóhùn náà ní ìrètí májẹ̀mú, Mèsáyà àti àjíǹde nínú, ṣùgbọ́n Gíríìkì kò sọ èyíkéyìí nínú wọn ní pàtó. Ìtumọ̀ náà pa àìṣe pàtó yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, tó bójú mu, tó sì yé òǹkàwé òde òní. “Mo ní kí ẹ wá” jẹ́ àdánidá ju títú παρεκάλεσα ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ lọ, nígbà tí “ẹ̀wọ̀n yìí wà lára mi” pa àwòrán Gíríìkì mọ́ láì mú kí ó dà bí ẹni pé Paulu fúnra rẹ̀ ló de ara rẹ̀.
