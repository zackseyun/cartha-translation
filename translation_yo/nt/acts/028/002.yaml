id: ACT.28.2
reference: Acts 28:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: yo
  text: Àwọn ènìyàn ibẹ̀ sì fi inú rere tí kò ṣe déédéé hàn sí wa[b][a], nítorí wọ́n dá iná kan, wọ́n sì fi tọ̀yàyà gba gbogbo wa nítorí òjò tí ó ń rọ̀ àti nítorí òtútù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì βάρβαροι túmọ̀ ní tààrà sí “àwọn báríbárì,” ìyẹn àwọn tí kì í sọ èdè Gíríìkì; níhìn-ín, ó ń tọ́ka sí àwọn olùgbé erékùṣù náà, láìní dandan pé wọ́n jẹ́ aláìní ìwà ọ̀làjú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fi inú rere àrà ọ̀tọ̀ hàn sí wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: àwọn ará ibẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn olùgbé ibẹ̀ tí kì í sọ èdè Gíríìkì; ‘àwọn ará ibẹ̀’ jẹ́ èdè Yorùbá àdánidá tí kò fi ìtumọ̀ ẹlẹ́gàn kún un.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: inú rere àrà ọ̀tọ̀
  rationale: Gbólóhùn náà túmọ̀ sí inú rere tí kò ṣe déédéé tàbí tí ó ju ti ìgbà gbogbo lọ; ‘inú rere àrà ọ̀tọ̀’ mú agbára ọ̀rọ̀ náà jáde ní Yorùbá tó ṣe kedere.
- source_word: παρεῖχον
  choice: fi ... hàn sí wa
  rationale: Ní ìṣọ̀kan pẹ̀lú φιλανθρωπίαν, ó túmọ̀ sí fífi inú rere hàn tàbí ṣíṣe rere sí ẹlòmíràn.
- source_word: ἅψαντες πυρὰν
  choice: wọ́n dá iná
  rationale: Ọ̀nà Yorùbá àdánidá ni ‘dá iná’ fún mímú iná jó; kò ṣe pàtó ju orísun lọ nípa bí iná náà ṣe tóbi.
- source_word: προσελάβοντο
  choice: fi tọ̀yàyàtọ̀yàyà gba
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń sọ nípa gbígba àwọn ènìyàn pẹ̀lú àlejò-rere, kì í ṣe fífún wọn ní ibùgbé ní pàtó.
- source_word: πάντας ἡμᾶς
  choice: gbogbo wa
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé kò sí ẹnikẹ́ni nínú wọn tí a yọ sílẹ̀.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: nítorí òjò tí ń rọ̀
  rationale: Participle náà ṣàpèjúwe òjò tí ó ti dé tí ó sì ń bá a lọ; ọ̀rọ̀ yìí sọ ìpo ojú ọjọ́ tó wà níbẹ̀ ní Yorùbá àdánidá.
- source_word: διὰ τὸ ψῦχος
  choice: àti nítorí òtútù
  rationale: ‘Òtútù’ ni ìtumọ̀ Yorùbá tó ṣe tààrà fún ψῦχος ní àyíká ojú ọjọ́ yìí.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó lọ́lá, tó ṣe kedere fún òǹkàwé gbogbogbò. ‘Àwọn ará ibẹ̀’ yẹra fún ìtumọ̀ ẹlẹ́gàn tí ‘báríbárì’ lè ní lónìí, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa ìtumọ̀ ẹ̀yà-èdè orísun mọ́. Àwọn àmì ìsàlẹ̀ ojú ìwé [b][a] tẹ̀ lé ibi tí ọ̀rọ̀ Gíríìkì méjèèjì bá ara wọn dé nínú gbólóhùn náà.
