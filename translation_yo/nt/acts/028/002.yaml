    issue: ‘fi tọ̀yàyàtọ̀yàyà gba’
    rationale: Ìtúnlò ọrọ̀ náà kò pọndandan, ó sì lè dà bí àṣìṣe ìkọ̀wé. ‘Fi tọ̀yàyà gba’ sọ ìtumọ̀ προσέλαβοντο ní kedere àti ní ti ẹ̀dá Yorùbá.
  - severity: low
    issue: ‘inú rere àrà ọ̀tọ̀’
