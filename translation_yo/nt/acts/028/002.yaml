revisions:
- from: Àwọn ará ibẹ̀ sì fi inú rere àrà ọ̀tọ̀ hàn sí wa[b][a], nítorí wọ́n dá iná, wọ́n sì fi tọ̀yàyàtọ̀yàyà gba gbogbo wa, nítorí òjò tí ń rọ̀ àti nítorí òtútù.
  to: Àwọn ènìyàn ibẹ̀ sì fi inú rere tí kò ṣe déédéé hàn sí wa[b][a], nítorí wọ́n dá iná kan, wọ́n sì fi tọ̀yàyà gba gbogbo wa nítorí òjò tí ó ń rọ̀ àti nítorí òtútù.
  rationale: 'A ṣe àtúnṣe kékeré fún ìṣàn Yorùbá àti ìdúróṣinṣin sí idiomu Gíríìkì: a rọ́pò ìsọdipúpọ̀ ‘tọ̀yàyàtọ̀yàyà’ pẹ̀lú ‘tọ̀yàyà,’ a sì lo ‘tí kò ṣe déédéé’ fún οὐ τὴν τυχοῦσαν. A tún ṣe ìtúnṣe àlàyé ìsàlẹ̀ ojú ìwé kí ó má bàa sọ pé βάρβαροι túmọ̀ sí àìní ìwà ọ̀làjú.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:35Z'
