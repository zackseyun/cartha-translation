  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tọ́ka tọ́gbọ́n sí ìfẹ́-inú rere tí kò ṣe déédéé, sí dídáná iná, àti sí gbígba gbogbo ẹgbẹ́ náà nítorí òjò àti òtútù. Àtúnṣe náà mú ‘àwọn ènìyàn ibẹ̀’ sun mọ́ ìtọ́kasí βάρβαροι sí olùgbé àdúgbò, láìgbé ìtumọ̀ ẹlẹ́gàn wá sí i. ‘Òjò tí ó ń rọ̀’ pa ìtumọ̀ òjò tí ó wà lórí wọn/ti bẹ̀rẹ̀ sí í rọ̀ mọ́, láìfi àsọtẹ́lẹ̀ àkókò tí Gíríìkì kò sọ kún un.
  naturalness: ‘Fi tọ̀yàyàtọ̀yàyà gba’ ní ìsọdipúpọ̀ tí kò pọndandan. ‘Fi tọ̀yàyà gba’ jẹ́ Yorùbá ìgbàlódé, ó sì dára fún ìforígbárí àlejò-rere nínú ọ̀rọ̀ náà. ‘Inú rere tí kò ṣe déédéé’ tún jẹ́ ọ̀nà tí ó dájú, tí ó sì mọ́gbọ́n dọ́gba pẹ̀lú οὐ τὴν τυχοῦσαν.
  terminology: Aṣàyàn ‘àwọn ènìyàn ibẹ̀’ yẹra fún agbára ìkẹ́gàn tí ‘àwọn báríbárì’ lè ní nínú Yorùbá òde òní. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gidi βάρβαροι—àwọn tí kì í sọ Gíríìkì—mọ́, ó sì ṣàlàyé pé ọ̀rọ̀ náà kò gbọdọ̀ túmọ̀ sí àìní ìwà ọ̀làjú.
  issues:
