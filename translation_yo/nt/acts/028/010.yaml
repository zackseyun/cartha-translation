  source_fidelity: Ìtumọ̀ ìbẹ̀rẹ̀ náà yí πολλαῖς τιμαῖς padà sí “ọ̀pọ̀lọpọ̀ ọ̀nà” (‘ní ọ̀nà púpọ̀’), èyí tí kò dá ìtumọ̀ ‘pẹ̀lú ọ̀pọ̀ ọlá/àmì ọlá’ dúró. “Ṣí ọkọ̀ ojú omi sílẹ̀” sì lè túmọ̀ sí sísílẹ̀ tàbí tú ọkọ̀, kì í ṣe fífi ọkọ̀ sí òkun. Àtúnṣe náà pa ìtẹnumọ́ ọlá, ìtumọ̀ ojú omi, àti ìpèsè ohun ìnílò mọ́.
  naturalness: “Fi ọ̀pọ̀ ọlá bọ̀wọ̀ fún wa” àti “nígbà tí a ń fi ọkọ̀ ojú omi sí òkun” jẹ́ Yorùbá tó ṣeé lóye, tó sì bá ìforúkọsílẹ̀ ìtàn náà mu. “Kó àwọn ohun tí a nílò sínú ọkọ̀ fún wa” jẹ́ àdánidá, ó sì ṣàfihàn ohun tí a gbé sínú ọkọ̀.
  terminology: A lo “ọlá” fún τιμαί, “fi ọkọ̀ ojú omi sí òkun” fún ἀνάγω nínú àyíká ọkọ̀ ojú omi, àti “àwọn ohun tí a nílò” fún τὰ πρὸς τὰς χρείας. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó nílò ìpinnu pàtó.
