source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: yo
  text: Àwọn náà sì fi ọ̀pọ̀ ọlá bọ̀wọ̀ fún wa[a]; nígbà tí a sì ń fi ọkọ̀ ojú omi sí òkun[b], wọ́n kó àwọn ohun tí a nílò sínú ọkọ̀ fún wa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, ‘wọ́n fi ọ̀pọ̀ ọlá bọ̀wọ̀ fún wa.’ Èdè Gíríìkì tún ọ̀rọ̀ ‘ọlá’ ṣe láti tẹnumọ́ bí wọ́n ṣe bu ọlá fún wa.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘nígbà tí a ń jáde lọ sí òkun.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìrìn-àjò ojú omi fún bíbẹ̀rẹ̀ ìrìn-àjò nínú ọkọ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘wọ́n pèsè ohun tí a nílò fún wa.’ Ní ọ̀rọ̀ gangan, Gíríìkì sọ pé wọ́n ‘gbé àwọn ohun fún àìní sínú ọkọ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: fi ọ̀pọ̀lọpọ̀ ọ̀nà bọ̀wọ̀ fún wa
  rationale: 'Èyí sọ ìtẹnumọ́ Gíríìkì ní Yorùbá àdánidá: wọ́n fi ọ̀pọ̀ àmì ọlá àti ìyì hàn sí wa, láì lo àtúnwí tí yóò dà bí èdè àjèjì.'
- source_word: ἀναγομένοις
  choice: nígbà tí a fẹ́ ṣí ọkọ̀ ojú omi sílẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìrìn-àjò ojú omi, ó sì túmọ̀ sí bíbẹ̀rẹ̀ ìrìn-àjò ọkọ̀ ojú omi tàbí fífi ọkọ̀ sí òkun.
- source_word: ἐπέθεντο
  choice: wọ́n kó ... sínú ọkọ̀ fún wa
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí fífi àwọn ohun èlò sínú ọkọ̀; àfikún ‘fún wa’ mú ète ìṣe náà ṣe kedere ní Yorùbá.
- source_word: τὰ πρὸς τὰς χρείας
  choice: àwọn ohun tí a nílò
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí àwọn ohun èlò tó bá àìní wọn mu; yíyan yìí jẹ́ kedere, ó sì yẹra fún àtúnwí tí kò wọ́pọ̀ ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá àjọṣe tí ó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘bọ̀wọ̀ fún’ fún ọlá tí a fi hàn, ‘ṣí ọkọ̀ ojú omi sílẹ̀’ fún ìtumọ̀ ọ̀rọ̀ ọkọ̀ ojú omi, àti ‘kó ... sínú ọkọ̀’ láti mú ohun tí àyíká Gíríìkì fi sílẹ̀ ṣe kedere.
