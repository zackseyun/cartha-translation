id: ACT.28.19
reference: Acts 28:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí pé àwọn Júù[b] tako mi[a], a fipá mú mi láti pe ẹjọ́ sí Késárì—kì í ṣe pé mo ní ohunkóhun láti fi fẹ̀sùn kan orílẹ̀-èdè mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí àwọn Júù ń tako mi,” tàbí “nítorí pé àwọn Júù ń sọ̀rọ̀ lòdì sí mi.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn Júù” níbí ń tọ́ka sí àwọn Júù tí wọ́n jẹ́ alatako Paulu nínú ọ̀ràn òfin yìí, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: nígbà tí ... tako mi
  rationale: Ọ̀rọ̀ náà jẹ́ apá gbólóhùn aláìdá dúró (genitive absolute) tí ó fi ipò tó yọrí sí ìgbésẹ̀ Paulu hàn. “Tako mi” jẹ́ Yorùbá àdánidá tó lè ní ìtumọ̀ àtakò nínú ọ̀ràn òfin láì fi kún un pé ọ̀rọ̀ ẹnu nìkan ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn sí ohun tí Paulu ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Èyí túmọ̀ τῶν Ἰουδαίων ní tààrà, láì dín ìtọ́kasí náà kù sí “àwọn aṣáájú Júù,” èyí tí Gíríìkì kò sọ ní pàtó. Àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé ẹni tí ó ń tọ́ka sí nínú àyíká ọ̀ràn náà.
- source_word: ἠναγκάσθην
  choice: a mú mi láti
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣe náà mọ́, pé ipò ọ̀ràn fipá mú Paulu tàbí mú un kò lè ṣe ohun mìíràn.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: pe ẹjọ́ kòtẹ́milọ́rùn sí Kesari
  rationale: Èyí jẹ́ ọ̀rọ̀ òfin fún lílo ẹ̀tọ́ láti gbé ẹjọ́ lọ sí ọ̀dọ̀ olú ọba; “Kesari” pa orúkọ oyè inú Gíríìkì mọ́.
- source_word: οὐχ ὡς
  choice: kì í ṣe nítorí pé
  rationale: Ó fi ìṣàlàyé Paulu nípa ohun tí kò fa ìgbésẹ̀ rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: τοῦ ἔθνους μου
  choice: orílẹ̀-èdè mi
  rationale: Ó pa ìtumọ̀ ẹgbẹ́ ènìyàn gẹ́gẹ́ bí orílẹ̀-èdè tàbí ẹ̀yà Paulu mọ́, ó sì bá ìforúkọsílẹ̀ òfin mu.
- source_word: ἔχων τι κατηγορεῖν
  choice: mo ní ẹ̀sùn kan láti fi kan
  rationale: Ó ṣàfihàn pé Paulu kò ní ẹ̀sùn tàbí ìdí kan láti fẹ̀sùn kan àwọn ènìyàn tirẹ̀, ó sì pa àwọ̀ òfin ti κατηγορεῖν mọ́.
theological_decisions:
- issue: Ìtọ́kasí “àwọn Júù” nínú gbólóhùn tó lè ní ìfarapa nípa ẹ̀yà tàbí ẹ̀sìn
  choice: Pa “àwọn Júù” mọ́ nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ìtumọ̀ tààrà τῶν Ἰουδαίων.
  alternative: “àwọn aṣáájú Júù” tàbí “àwọn ará Jùdíà”
  rationale: Gíríìkì kò fi “aṣáájú” kún un, bẹ́ẹ̀ ni àyíká yìí ń sọ nípa àwọn olùfisùn Júù tí wọn tako Paulu, kì í ṣe gbogbo àwọn Júù. A fi ìṣọ́ra yìí sínú àlàyé dípò yíyí ọ̀rọ̀ pàtàkì padà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. “Pe ẹjọ́ kòtẹ́milọ́rùn” àti “ẹ̀sùn” pa àwọ̀ ọ̀ràn òfin mọ́, ṣùgbọ́n gbólóhùn náà ṣì ṣeé lóye fún òǹkàwé gbogbogbò.
