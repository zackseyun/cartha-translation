  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ilẹ̀/ohun-ìní ilẹ̀ wà ní àgbègbè náà, ti olórí erékùṣù náà Públíù, ẹni tí ó gbà àwọn arìnrìn-àjò náà, tí ó sì ṣe àlejò wọn fún ọjọ́ mẹ́ta. Ṣùgbọ́n “Ní agbègbè ibi náà” kò fi ìmọ̀ ‘ní àgbègbè tí ó yí ibi náà ká’ nínú τοῖς περὶ τὸν τόπον ἐκεῖνον hàn kedere. Bákan náà, “tọ̀wọ̀tọ̀wọ̀” ń ṣàpèjúwe gbígba wọn dípò ọ̀nà inú rere tí φιλοφρόνως ṣe àlejò náà.'
