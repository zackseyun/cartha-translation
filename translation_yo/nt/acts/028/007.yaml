id: ACT.28.7
reference: Acts 28:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: yo
  text: Ní agbègbè tó yí ibi náà ká, àwọn ilẹ̀[a] kan wà tí ó jẹ́ ti ọkùnrin kan, olórí erékùṣù náà[b], ẹni tí orúkọ rẹ̀ ń jẹ́ Públíù. Ó gbà wá, ó sì fi inú rere ṣe àlejò wa fún ọjọ́ mẹ́ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun-ìní ilẹ̀” tàbí “àwọn oko ńlá.” Ọ̀rọ̀ Gíríìkì χωρία ń tọ́ka sí ilẹ̀ tí ẹnì kan ní ní àgbègbè náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọkùnrin pàtàkì jù lọ ní erékùṣù náà.” Ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà jẹ́ oyè ẹni tó jẹ́ aṣáájú tàbí ẹni tó ga jù lọ ní erékùṣù náà.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ó gba wá sí ilé, ó sì ṣe àlejò wa pẹ̀lú inú rere fún ọjọ́ mẹ́ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Ní agbègbè ibi náà
  rationale: Ó sọ ibi tó yí ibi náà ká ní Yorùbá àdánidá. A kò fi ọ̀rọ̀ àsìkò bí ‘nígbà náà’ kún un; agbára ìtẹ̀síwájú δέ lè hàn nínú àyíká ìtàn.
- source_word: ὑπῆρχεν χωρία
  choice: ni àwọn ilẹ̀ kan wà
  rationale: Ìtumọ̀ rẹ̀ ni pé ohun-ìní ilẹ̀ wà ní àdúgbò náà. ‘Àwọn ilẹ̀’ pa ọ̀pọ̀ χωρία mọ́ láì sọ irú ohun-ìní náà pàtó jù.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: ọkùnrin tó jẹ́ olórí erékùṣù náà
  rationale: πρῶτος níbí ń tọ́ka sí ipò gíga tàbí oyè, kì í ṣe nọ́ńbà àkọ́kọ́ lásán. Ìtumọ̀ yìí pa àìdánilójú mọ́ nípa bóyá oyè ìjọba pàtó ni.
- source_word: ὀνόματι Ποπλίῳ
  choice: ẹni tí orúkọ rẹ̀ ń jẹ́ Públíù
  rationale: Ọ̀nà Yorùbá àdánidá ni láti fi orúkọ ẹni hàn; ‘Públíù’ jẹ́ ìkọ̀wé orúkọ Latin Publius ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Ó gbà wá tọ̀wọ̀tọ̀wọ̀
  rationale: Ó túmọ̀ sí gbígba àwọn àlejò wọlé pẹ̀lú inú dídùn; ‘tọ̀wọ̀tọ̀wọ̀’ mú ìtẹ́wọ́gbà náà hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: φιλοφρόνως ἐξένισεν
  choice: ó sì fi inú rere ṣe àlejò wa
  rationale: Àkójọpọ̀ yìí sọ pé ó fi ọ̀rẹ́ àti inú rere gba wọn sí ilé gẹ́gẹ́ bí àlejò.
- source_word: τρεῖς ἡμέρας
  choice: fún ọjọ́ mẹ́ta
  rationale: Ó pa ìwọ̀n àkókò inú ẹ̀sùn náà mọ́ ní ọ̀nà Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Bóyá τῷ πρώτῳ τῆς νήσου jẹ́ oyè ìjọba pàtó tàbí àpèjúwe ẹni tó ga jù lọ
  choice: ọkùnrin tó jẹ́ olórí erékùṣù náà
  alternative: ọkùnrin pàtàkì jù lọ ní erékùṣù náà
  rationale: A yan ọ̀rọ̀ tó lè fi ipò aṣáájú tàbí oyè hàn, ṣùgbọ́n a kò fi orúkọ oyè ìjọba kan tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún òǹkàwé gbogbo. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pín gbólóhùn gígùn Gíríìkì sí méjì kí ìtumọ̀ rẹ̀ lè ṣe kedere láì pàdánù ìbáṣepọ̀ àwọn èrò inú rẹ̀.
