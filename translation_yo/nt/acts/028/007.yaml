  terminology: “Àwọn ilẹ̀,” “olórí erékùṣù náà,” “Públíù,” àti “ṣe àlejò wa” bá orísun mu, wọ́n sì yẹ fún Yorùbá ìgbàlódé tó níyì. “Olórí” kò fi oyè ìjọba pàtó kan tí Gíríìkì kò dájú síi.
