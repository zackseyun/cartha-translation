id: ACT.28.28
reference: Acts 28:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí ó di mímọ̀ fún yín pé a ti rán ìgbàlà Ọlọ́run yìí sí àwọn Kèfèrí[a]; àwọn náà yóò sì fetí sílẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàlà yìí láti ọ̀dọ̀ Ọlọ́run.” Ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì lè ní ọ̀kan nínú àwọn ìtumọ̀ méjèèjì tí ó sún mọ́ra yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn náà yóò sì gbọ́.” Ọ̀rọ̀ ìṣe Gíríìkì lè túmọ̀ sí “gbọ́” tàbí “fetí sílẹ̀,” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Nítorí náà, ẹ jẹ́ kí ó di mímọ̀ fún yín
  rationale: Ó pa ìtumọ̀ ìparí-èrò οὖν àti ohùn ìkéde àṣẹ inú γνωστὸν ... ἔστω ὑμῖν mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τοῖς ἔθνεσιν
  choice: sí àwọn Kèfèrí
  rationale: Nínú ìyàtọ̀ láàárín àwọn Júù àti ἔθνη ní ibi yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù; “àwọn Kèfèrí” sọ ìtumọ̀ ọ̀rọ̀ yìí ní kedere nínú ìlò Bíbélì Yorùbá.
- source_word: ἀπεστάλη
  choice: a ti rán
  rationale: Ìṣe aláìlórúkọ náà fi iṣẹ́ tí a ti parí, tí ó sì ṣì ní ipa nísinsìnyí, hàn láìfi ẹni tó rán án kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: ìgbàlà Ọlọ́run yìí
  rationale: '“Ìgbàlà” pa ìtumọ̀ σωτήριον mọ́ ju “ìhìn iṣẹ́ ìgbàlà” lọ. Àkójọpọ̀ “ìgbàlà Ọlọ́run” tún pa àìdánilójú genitive mọ́: ó lè jẹ́ ìgbàlà tí í ṣe ti Ọlọ́run tàbí èyí tí ó wá láti ọ̀dọ̀ rẹ̀.'
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: àwọn náà yóò sì fetí sílẹ̀
  rationale: “Àwọn náà” gbé ìtẹnumọ́ αὐτοὶ καί jáde; “fetí sílẹ̀” fi ìgbọ́ tí ó ní ìfarabalẹ̀ hàn gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń tọ́ka sí, láìsọ pé wọ́n yóò yí padà ní dandan.
theological_decisions:
- issue: Ìtumọ̀ σωτήριον nínú àyíká ọ̀rọ̀
  choice: ìgbàlà
  alternative: ìhìn iṣẹ́ ìgbàlà
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí ìgbàlà; fífi “ìhìn iṣẹ́” kún un yóò túmọ̀ ọ̀rọ̀ náà ju bí orísun ṣe béèrè lọ.
- issue: Ìbáṣepọ̀ genitive inú τοῦ θεοῦ
  choice: ìgbàlà Ọlọ́run
  alternative: ìgbàlà láti ọ̀dọ̀ Ọlọ́run
  rationale: Ìtumọ̀ àkọ́kọ́ pa ààyè sílẹ̀ fún ìgbàlà tí í ṣe ti Ọlọ́run àti ìgbàlà tí ó ti ọ̀dọ̀ Ọlọ́run wá; àlàyé ìsàlẹ̀ ojú ìwé fi èkejì hàn.
- issue: Agbára ἀκούσονται
  choice: yóò fetí sílẹ̀
  alternative: yóò gbọ́
  rationale: Àyíká náà ń fi ìkọ̀sílẹ̀ àwọn kan wé ìgbọ́ tí ó ní ìfarabalẹ̀ ti àwọn Kèfèrí. “Fetí sílẹ̀” mú èyí jáde láìfi ẹ̀kọ́ nípa ìyípadà ọkàn kún un.
translation_notes:
  register: Yorùbá boṣewa oníyì, tí ó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ẹ jẹ́ kí ó di mímọ̀ fún yín” pa ohùn ìkéde pàtàkì mọ́; “Kèfèrí” ni a lò ní ìtumọ̀ Bíbélì pé àwọn tí kì í ṣe Júù, kì í ṣe gẹ́gẹ́ bí ẹ̀gàn.
