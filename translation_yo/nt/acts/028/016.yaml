  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: yo
  text: Nígbà tí a wọ Róòmù, a gba Páùlù láyè láti gbé lọ́tọ̀, pẹ̀lú ọmọ ogun tí ń ṣọ́ ọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Nígbà tí
  rationale: Ó fi àkókò ìṣẹ̀lẹ̀ hàn ní ọ̀nà tí ó bá èdè Yorùbá àdánidá mu.
- source_word: δὲ
  choice: —
  rationale: Asopọ̀ ọ̀rọ̀ kékeré ni níbí; fífi í sílẹ̀ láìtumọ̀ jẹ́ kí Yorùbá máa ṣàn dáadáa láìfi ìtumọ̀ àtakò kún un.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: a wọ Róòmù
  rationale: Ó pa ìtumọ̀ ìṣípò wọ inú ìlú mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédé.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: a gba Páùlù láyè
  rationale: Ilana àìlórúkọ olùṣe yìí fi hàn pé wọ́n fún Páùlù ní àṣẹ, láìsọ ẹni tó fún un ní àṣẹ.
- source_word: μένειν
  choice: láti máa gbé
  rationale: Nínú ọ̀rọ̀ ibùgbé Páùlù ní Róòmù, ‘máa gbé’ jẹ́ àdánidá, ó sì lè túmọ̀ sí dídúró tàbí gbígbé níbẹ̀.
- source_word: καθ’ ἑαυτόν
  choice: dá
  rationale: Ó túmọ̀ sí pé ó ń gbé ní ọ̀tọ̀ tàbí fúnra rẹ̀, kì í ṣe pé kò sí ẹnikẹ́ni pẹ̀lú rẹ̀, nítorí ọmọ ogun kan ń ṣọ́ ọ.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: pẹ̀lú ọmọ ogun tí ń ṣọ́ ọ
  rationale: ‘Pẹ̀lú’ pa ìtumọ̀ àjọwà σύν mọ́; àpólà aláìlópó yìí sì ṣàpèjúwe ọmọ ogun náà gẹ́gẹ́ bí ẹni tí ń ṣọ́ Páùlù.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘máa dá gbé’ láti yẹra fún ìtumọ̀ pé Páùlù wà ní àdáwà pátápátá, níwọ̀n bí ọmọ ogun tó ń ṣọ́ ọ ti wà pẹ̀lú rẹ̀.
