  terminology: ‘Páùlù,’ ‘Róòmù,’ àti ‘ọmọ ogun tí ń ṣọ́ ọ’ bá ìtúmọ̀ Gíríìkì mu. Kò sí ọ̀rọ̀ ẹ̀sìn pàtàkì tí ó nílò àtúnṣe.
