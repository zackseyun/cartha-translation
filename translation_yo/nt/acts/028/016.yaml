  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí wíwọ Róòmù, ìfẹ̀yọ̀ǹda tí a fún Páùlù, àti ọmọ ogun tí ń ṣọ́ ọ. Ṣùgbọ́n ‘máa dá gbé’ kò fi ìtumọ̀ καθ’ ἑαυτόν (‘ní ọ̀tọ̀/fúnra rẹ̀’) hàn ní kedere tó, ó sì lè dà bí ìbéèrè pé kí ó lọ gbé ilé tirẹ̀.
