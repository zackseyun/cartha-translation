id: ACT.28.21
reference: Acts 28:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n sọ fún un pé, “Àwa kò gba lẹ́tà kankan láti Jùdíà nípa rẹ, bẹ́ẹ̀ ni ẹnikẹ́ni nínú àwọn arákùnrin[b] tí ó dé kò ròyìn tàbí sọ ohun búburú[a] kankan nípa rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí kò dára.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” lè tọ́ka sí àwọn Júù ẹlẹgbẹ́ wọn láti Jùdíà; ẹsẹ yìí kò sọ ní pàtó pé onígbàgbọ́ Kristẹni ni wọ́n.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν· πρὸς αὐτόν
  choice: Ṣùgbọ́n wọ́n sọ fún un pé
  rationale: ‘Ṣùgbọ́n’ fi agbára ìtẹ̀síwájú pẹ̀lú ìyàtọ̀ díẹ̀ ti δέ hàn nínú ìjíròrò; ‘sọ fún un’ jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ tí a darí sí ẹnì kan.
- source_word: Ἡμεῖς οὔτε γράμματα ... ἐδεξάμεθα
  choice: Àwa kò gba lẹ́tà kankan
  rationale: A pa ‘Àwa’ mọ́ nítorí pé Ἡμεῖς fara hàn gbangba fún ìtẹnumọ́. ‘Lẹ́tà’ ni ìtumọ̀ γράμματα nínú àyíká yìí, ‘kò ... kankan’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkọ̀ οὔτε.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: láti Jùdíà
  rationale: Ìtumọ̀ orúkọ ilẹ̀ náà ní ṣókí, láìfi ‘agbègbè ìjọba’ kún ohun tí Gíríìkì sọ.
- source_word: περὶ σοῦ
  choice: nípa rẹ
  rationale: Ọ̀nà Yorùbá òde òní tó ṣe kedere fún ‘nípa rẹ’ tàbí ‘ní ti ọ̀ràn rẹ.’
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: ẹnikẹ́ni lára àwọn arákùnrin tó dé
  rationale: ‘Tó dé’ túmọ̀ participle náà láìfi ibi tí kò fara hàn nínú Gíríìkì kún un; ‘àwọn arákùnrin’ pa ọ̀rọ̀ ìbátan ἀδελφῶν mọ́.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: ròyìn tàbí sọ ... kankan
  rationale: A pa ìyàtọ̀ kékeré tó wà láàárín ‘mú ìròyìn wá’ àti ‘sọ̀rọ̀’ mọ́ nípasẹ̀ ‘ròyìn’ àti ‘sọ.’
- source_word: πονηρόν
  choice: ohun búburú
  rationale: Ìtumọ̀ náà pa agbára ọ̀rọ̀ Gíríìkì mọ́, èyí tó lè túmọ̀ sí ohun búburú tàbí ohun tí kò dára tí a sọ lòdì sí ẹnì kan.
theological_decisions:
- issue: Ta ni ‘àwọn arákùnrin’ (τῶν ἀδελφῶν) ń tọ́ka sí?
  choice: A túmọ̀ rẹ̀ sí ‘àwọn arákùnrin’ láìsọ pé onígbàgbọ́ Kristẹni ni wọ́n.
  alternative: ‘Àwọn Júù ẹlẹgbẹ́ wọn’ tàbí ‘àwọn arákùnrin Kristẹni.’
  rationale: Àwọn aṣáájú Júù ní Róòmù ni wọ́n ń sọ̀rọ̀ nípa àwọn tó wá láti Jùdíà. Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn Júù ẹlẹgbẹ́ wọn, ṣùgbọ́n Gíríìkì kò sọ ìdánimọ̀ wọn ní pàtó. Ìtumọ̀ àti àlàyé ìsàlẹ̀ fi àìdánilójú yìí sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ìṣètò ‘bẹ́ẹ̀ ni kò sí ẹnikẹ́ni...’ láti mú οὔτε ... οὔτε jáde lọ́nà Yorùbá àdánidá.
