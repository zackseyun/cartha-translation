source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: yo
  text: Nígbà tí ó sì ti sọ àwọn nǹkan wọ̀nyí [a], àwọn Júù náà lọ pẹ̀lú àríyànjiyàn púpọ̀ láàárín ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbogbo ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ (tó fi mọ́ Papyrus 74 ti ọ̀rúndún kẹta, Sinaiticus ti ọ̀rúndún kẹrin, àti Vaticanus ti ọ̀rúndún kẹrin), bẹ́ẹ̀ ni kò sì sí nínú àwọn ìtumọ̀ Kọ́pítìkì ìgbà àkọ́kọ́. Ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ àṣà Byzantine, àti nínú àwọn ìtumọ̀ Latin àti Syriac ìgbà àkọ́kọ́. Ó ṣeé ṣe kí akọ̀wé kan fi kún un lẹ́yìn-ò-rẹyìn láti parí ìtàn bí àwọn Júù ṣe lọ.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: jiyàn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìjíròrò, àríyànjiyàn tàbí ìjàmbá ọ̀rọ̀. Nínú àyíká yìí, ‘ń bá ara wọn jiyàn gidigidi’ fi agbára πολλήν àti ìpín ọkàn wọn hàn ní èdè Yorùbá àdánidá.
- source_word: ἀπέρχομαι
  choice: lọ
  rationale: ‘Lọ’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ìtumọ̀ ọ̀rọ̀ ìṣípòpadà náà mu; kò nílò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ àṣejù.
- source_word: ἐν ἑαυτοῖς
  choice: bá ara wọn
  rationale: Àkópọ̀ yìí túmọ̀ sí pé àríyànjiyàn náà wà láàárín àwọn Júù fúnra wọn; ‘bá ara wọn’ sọ èyí ní kedere àti ní ti ẹ̀dá Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A yàn ‘lọ’ dípò ọ̀rọ̀ gíga bí ‘kúrò níbẹ̀,’ àti gbólóhùn ‘ń bá ara wọn jiyàn gidigidi’ láti mú ìtumọ̀ àti agbára ọ̀rọ̀ Gíríìkì jáde lọ́nà àdánidá. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó sọ pé Paulu ti sọ nǹkan wọ̀nyí, láti tọ́ka sí ìṣòro àfọwọ́kọ tó kan gbogbo ẹsẹ náà.
