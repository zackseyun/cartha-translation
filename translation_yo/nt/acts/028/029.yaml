  to: Nígbà tí ó sì ti sọ àwọn nǹkan wọ̀nyí [a], àwọn Júù náà lọ pẹ̀lú àríyànjiyàn púpọ̀ láàárín ara wọn.
  rationale: Àtúnṣe kékeré ni a ṣe láti mú ‘having a great dispute among themselves’ bá ìṣètò Gíríìkì mu dáadáa, láì mú ìtumọ̀ rẹ̀ le ju. A tún mú àwọn gbolohun àlàyé nípa ẹ̀rí ọwọ́-ìwé kedere síi, a sì yọ ‘olórí,’ èyí tí kò hàn nínú ẹsẹ Gíríìkì.
