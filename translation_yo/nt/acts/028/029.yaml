review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń tẹ̀lé Gíríìkì Byzantine dáadáa ní ìwòye gbogbogbò: ó sọ pé àwọn Júù lọ lẹ́yìn tí ó ti sọ̀rọ̀, wọ́n sì ní àríyànjiyàn láàárín ara wọn. Síbẹ̀, ìlò ‘ń bá ara wọn jiyàn gidigidi’ yí ἔχοντες ... συζήτησιν (‘ní àríyànjiyàn púpọ̀’) padà sí ìṣe tí ń lọ lọwọlọwọ díẹ̀. Àtúnṣe náà pa ìtumọ̀ participle náà mọ́ ní kedere.'
  naturalness: ‘Pẹ̀lú àríyànjiyàn púpọ̀ láàárín ara wọn’ jẹ́ Yorùbá boṣewa, ó sì ṣàn dáadáa nínú ìtàn ọlọ́lá. ‘Àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ’ tún dáa ju ‘àkọ́kọ́ jù lọ’ lọ fún ‘earliest manuscripts’.
  terminology: ‘Àwọn Júù’ àti ‘àfọwọ́kọ’ yẹ. A ti ṣe àwọn orúkọ ìtàn ọwọ́ ìwé náà ní ọ̀nà tí ó mọ́gbọ́n dání, pẹ̀lú ‘Kọ́pítìkì’ fún Coptic. Nínú àlàyé, ‘àwọn Júù’ dípò ‘àwọn olórí Júù’ yẹ, nítorí ẹsẹ Gíríìkì fúnra rẹ̀ kan pè wọ́n ní ‘àwọn Júù’; èyí kò fi ẹ̀sùn ìtúmọ̀ tó ju ẹ̀rí lọ kún un.
  issues:
  - severity: low
    issue: ‘ń bá ara wọn jiyàn gidigidi’
    rationale: Ó jẹ́ àdánidá, ṣùgbọ́n ἔχοντες πολλὴν ... συζήτησιν ṣàpèjúwe bí wọ́n ṣe ń lọ—wọ́n ní àríyànjiyàn púpọ̀—kì í ṣe dandan ìṣe imperfect tí ń tẹ̀síwájú.
  - severity: low
    issue: ‘àwọn àfọwọ́kọ Gíríìkì àkọ́kọ́ jù lọ’ nínú àlàyé
    rationale: ‘Earliest’ níhìn-ín túmọ̀ sí àwọn ẹ̀rí tó ti pẹ́ jù lọ, kì í ṣe ‘àkọ́kọ́’ ní ọ̀nà tí ó lè dà bí àwọn tí a kọ́kọ́ ṣe.
  - severity: low
    issue: ‘àwọn olórí Júù’ nínú àlàyé
    rationale: Ìtàn tí a ń tọ́ka sí i sọ ‘àwọn Júù’ nìkan. Kíkúrò nínú ‘olórí’ pa àlàyé mọ́ sí ohun tí ẹsẹ náà sọ.
