id: ACT.28.27
reference: Acts 28:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: yo
  text: Nítorí ọkàn àwọn ènìyàn yìí ti nípọn[a]; wọ́n sì fi etí wọn gbọ́ pẹ̀lú ìṣòro, wọ́n sì ti pa ojú wọn, kí wọn má bàa fi ojú wọn rí, kí wọ́n sì fi etí wọn gbọ́, kí wọ́n sì fi ọkàn wọn lóye, kí wọ́n sì yí padà[b], kí n má bàa mú wọn láradá.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘ọkàn ... ti nípọn’ tàbí ‘ti sanra’; àwòrán náà ń tọ́ka sí ọkàn tí kò ní ìmọ̀lára, tí kò sì tètè lóye.
    reason: lexical_metaphor
  - marker: b
    text: ‘Yí padà’ tún lè túmọ̀ sí ‘padà’ tàbí, ní àyíká ọ̀rọ̀ yìí, ‘ronú pìwà dà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ti yigbì
  rationale: ‘Yigbì’ ń ṣàfihàn bí ohun ṣe nípọn tàbí ṣe sé le, ó sì lè ṣàpẹẹrẹ àìní ìmọ̀lára tàbí àìgbọ́ràn ọkàn láì sọ àlàyé náà di ẹ̀kọ́ ìtumọ̀ lásán.
- source_word: καρδία
  choice: ọkàn
  rationale: ‘Ọkàn’ ni ọ̀rọ̀ Bíbélì tó bá καρδία mu, ó sì pa ìṣọ̀kan mọ́ pẹ̀lú ‘fi ọkàn wọn lóye.’
- source_word: λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún λαός ní àyíká ọ̀rọ̀ àsọyé Aísáyà yìí.
- source_word: βαρέως ἤκουσαν
  choice: etí wọn kò sì fi bẹ́ẹ̀ gbọ́
  rationale: Èyí sọ ìgbọ́ tí ó wúwo tàbí tí ó nira ní Yorùbá àdánidá, láì yí i padà sí àìgbọ́ rárá.
- source_word: ἐκάμμυσαν
  choice: wọ́n sì ti di ojú wọn
  rationale: ‘Di ojú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ojú pa tàbí tì í mọ́.
- source_word: μήποτε
  choice: kí wọn má bàa
  rationale: Ó pa agbára ìkìlọ̀ tàbí ète odi μήποτε mọ́, ó sì jẹ́ kí ìforígbárí tó wà láàárín ìdájọ́ Ọlọ́run àti ojúṣe ènìyàn dúró.
- source_word: ἴδωσιν / ἀκούσωσιν / συνῶσιν
  choice: kí wọ́n ... rí / gbọ́ / lóye
  rationale: Ìlànà ‘kí’ ní Yorùbá ń fi ipò subjunctive àwọn ọ̀rọ̀-ìṣe náà hàn ní ọ̀nà àdánidá.
- source_word: ἐπιστρέψωσιν
  choice: yí padà
  rationale: Ó pa àwòrán yíyí tàbí padàbọ̀ mọ́, láì fi dandan túmọ̀ rẹ̀ sí ọ̀rọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
- source_word: ἰάσομαι
  choice: kí èmi sì mú wọn láradá
  rationale: ‘Mú ... láradá’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ìwòsàn; fífi ‘èmi’ hàn ń tẹnumọ́ ẹni tó ń ṣe ìwòsàn gẹ́gẹ́ bí Gíríìkì ṣe jẹ́ kí ó ṣeé mọ̀.
theological_decisions:
- issue: Ète Ọlọ́run nínú àsọyé Aísáyà
  choice: Túmọ̀ μήποτε sí ‘kí wọn má bàa,’ kí agbára ‘lest/so that not’ inú Gíríìkì hàn.
  alternative: ‘Bí bẹ́ẹ̀ kọ́, wọn ì bá ...’
  rationale: Gíríìkì SBLGNT ní ibi yìí ní agbára ìdènà tàbí ète odi tó lágbára. Ìtumọ̀ yìí kò yanjú bóyá ó jẹ́ ète tàbí àbájáde nìkan, ṣùgbọ́n ó pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú àsọyé náà mọ́.
- issue: Ìtumọ̀ ἐπιστρέψωσιν
  choice: yí padà
  alternative: ronú pìwà dà; padà; gba ìyípadà
  rationale: ‘Yí padà’ mú ìtumọ̀ ìdarí àti ìpadàbọ̀ wá, ṣùgbọ́n kò fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó dín ìtumọ̀ rẹ̀ kù sínú ẹsẹ náà.
- issue: Ìbáṣepọ̀ ἰάσομαι pẹ̀lú μήποτε
  choice: ‘kí èmi sì mú wọn láradá’ gẹ́gẹ́ bí apá ìkẹyìn ìlànà μήποτε
  alternative: ‘èmi ì bá sì mú wọn láradá’
  rationale: Ìlànà yìí tẹ̀lé bí gbolohun Gíríìkì ṣe ń ṣàn, ó sì pa ìtumọ̀ ọjọ́ iwájú ἰάσομαι mọ́ láì sọ ọ́ di ọ̀rọ̀ àròsọ tí Gíríìkì kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àtúnwí ‘kí wọ́n’ láti pa ìṣètò àsọyé Gíríìkì mọ́. Àkọlé àyọlò náà parí pẹ̀lú àmì àsọyé nítorí ẹsẹ yìí jẹ́ apá ọ̀rọ̀ tí Pọ́ọ̀lù ń fa yọ láti ọ̀dọ̀ wòlíì Aísáyà.
