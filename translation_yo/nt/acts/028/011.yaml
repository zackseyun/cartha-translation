id: ACT.28.11
reference: Acts 28:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: yo
  text: Lẹ́yìn oṣù mẹ́ta, a gbéra nínú ọkọ̀ ojú omi kan ti Alẹkisáńdíríà, tí ó ti lo ìgbà òtútù ní erékùṣù náà, tí ó ní àmì àwọn Dioscuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nínú èdè Gíríìkì: “àwọn Dioscuri,” ìyẹn Castor àti Pollux, àwọn ọmọkùnrin ìbejì ti Zeus nínú ìtàn àròsọ Gíríìkì-Róòmù.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Lẹ́yìn oṣù mẹ́ta
  rationale: μετά pẹ̀lú ẹ̀sùn atọ́ka àkókò túmọ̀ sí lẹ́yìn àkókò kan; δέ jẹ́ àsopọ̀ fífẹ́ tí kò pọndandan láti sọ ní Yorùbá.
- source_word: ἀνήχθημεν
  choice: a ṣí ọkọ̀ ojú omi kan láti lọ
  rationale: Nínú ọ̀rọ̀ ìrìnàjò lórí omi, ἀνάγω túmọ̀ sí gbígbéra tàbí fífi ọkọ̀ sí ojú omi; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: Ọkọ̀ náà jẹ́ ti Alẹkisáńdíríà
  rationale: πλοῖον jẹ́ ọkọ̀ ojú omi, Ἀλεξανδρῖνος sì ń tọ́ka sí ìpilẹ̀ṣẹ̀ tàbí ìbáṣepọ̀ rẹ̀ pẹ̀lú Alẹkisáńdíríà.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: ó sì ti lo ìgbà òtútù ní erékùṣù náà
  rationale: Ọ̀rọ̀ alábápín pípé παρακεχειμακότι sọ pé ọkọ̀ náà ti dúró síbẹ̀ jálẹ̀ ìgbà òtútù; erékùṣù náà ni Málítà gẹ́gẹ́ bí àyíká ọ̀rọ̀.
- source_word: παρασήμῳ
  choice: àmì tí ó wà ní iwájú ọkọ̀ náà
  rationale: παράσημος lè jẹ́ àmì ìdámọ̀, àwòrán, tàbí ohun ọ̀ṣọ́ iwájú ọkọ̀; yíyan 'àmì tí ó wà ní iwájú' ń sọ àyíká ọkọ̀ di mímọ̀ láì fi ohun tí Gíríìkì kò dájú múlẹ̀ jù.
- source_word: Διοσκούροις
  choice: Àwọn Dioscuri
  rationale: A pa orúkọ Gíríìkì náà mọ́ nítorí pé ó jẹ́ orúkọ pàtó àwọn òrìṣà ìbejì; àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí ó yé òǹkàwé òde òní.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àmì abọ̀rìṣà Διοσκούροις
  choice: Àwọn Dioscuri
  alternative: Àwọn Ọlọ́run Ìbejì; Castor àti Pollux
  rationale: Ẹsẹ̀ náà kàn ń ròyìn àmì ẹ̀sìn Gíríìkì-Róòmù, kò sì fọwọ́ sí i. Pípa orúkọ pàtó mọ́ ń tẹ̀ lé Gíríìkì ní tààrà, àlàyé ẹsẹ̀ sì ń mú ìtumọ̀ rẹ̀ hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. A lo ‘Alẹkisáńdíríà’ gẹ́gẹ́ bí ìkọ̀wé Yorùbá fún Alexandria, a sì pa ‘Dioscuri’ mọ́ gẹ́gẹ́ bí orúkọ àjèjì pẹ̀lú àlàyé.
