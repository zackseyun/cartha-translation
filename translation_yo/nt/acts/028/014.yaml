id: ACT.28.14
reference: Acts 28:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: yo
  text: Ní ibẹ̀, a rí àwọn arákùnrin[a], wọ́n sì pè wá láti dúró lọ́dọ̀ wọn fún ọjọ́ méje. Báyìí ni a sì ṣe dé Róòmù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn arákùnrin àti arábìnrin’; ọ̀rọ̀ Gíríìkì sọ pé ‘àwọn arákùnrin,’ ṣùgbọ́n nínú àyíká yìí, ó ṣeé ṣe kí ó ń tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Ní ibẹ̀
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ìyẹn Puteoli; ‘Ní ibẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: εὑρόντες
  choice: a rí
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe pípé ní Yorùbá, ní ṣíṣe àfihàn pé rírí wọn ṣẹlẹ̀ ṣáájú ìpè náà.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Èyí pa ìtumọ̀ gangan ti ọ̀rọ̀ Gíríìkì mọ́; nínú àyíká yìí, ó ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn, bí àlàyé ìsàlẹ̀ ṣe sọ.
- source_word: παρεκλήθημεν
  choice: wọ́n sì pè wá
  rationale: Nínú àyíká àlejò yìí, ọ̀rọ̀ náà túmọ̀ sí pé àwọn onígbàgbọ́ ibẹ̀ ké sí wọn tàbí rọ̀ wọ́n láti dúró; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá.
- source_word: παρ’ αὐτοῖς
  choice: lọ́dọ̀ wọn
  rationale: Èyí fi hàn pé wọ́n dúró ní ibùgbé tàbí ní àárín àwọn onígbàgbọ́ náà.
- source_word: ἐπιμεῖναι
  choice: láti dúró
  rationale: Nínú ìrìn-àjò, ‘dúró’ ni ọ̀rọ̀ Yorùbá àdánidá fún gbígbé ní ibi kan fún àkókò díẹ̀.
- source_word: ἡμέρας ἑπτά
  choice: fún ọjọ́ méje
  rationale: ‘Fún’ mú àkókò tí wọ́n lò níbẹ̀ ṣe kedere, ó sì bá ìlò Yorùbá mu.
- source_word: καὶ οὕτως
  choice: Báyìí ni a sì ṣe
  rationale: Èyí pa èrò ‘ní ọ̀nà yìí’ mọ́, ó sì so bí wọ́n ṣe dé Róòmù mọ́ ìtàn ìrìn-àjò tó ṣáájú.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: dé Róòmù
  rationale: Pẹ̀lú εἰς, ọ̀rọ̀-ìṣe náà ń fi dídé ibi tí wọ́n ń lọ hàn; ‘dé Róòmù’ jẹ́ kedere àti àdánidá.
theological_decisions:
- issue: Ẹni tí ἀδελφοὺς ń tọ́ka sí
  choice: àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn ní ìjọ agbègbè náà
  alternative: àwọn arákùnrin wọn nípa ẹ̀jẹ̀, tàbí àwọn Júù ẹlẹgbẹ́ wọn lápapọ̀
  rationale: Nínú ìtàn ìrìn-àjò Iṣe Àwọn Aposteli, ‘àwọn arákùnrin’ sábà máa ń tọ́ka sí àwọn Kristẹni ẹlẹgbẹ́ wọn; ìpè láti dúró lọ́dọ̀ wọn tún ṣe àtìlẹ́yìn fún ìtumọ̀ yìí. Síbẹ̀, a pa ọ̀rọ̀ gangan mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ààyè ìtumọ̀ rẹ̀ ní ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo ‘Róòmù’ gẹ́gẹ́ bí ìkọ̀wé Yorùbá àdánidá fún Rome.
