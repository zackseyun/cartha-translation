  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa àyíká òfin mọ́ láì lo èdè amòfin tó le fún òǹkàwé lasán.
