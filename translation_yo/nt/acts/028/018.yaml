  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: yo
  text: Àwọn wọ̀nyí, lẹ́yìn tí wọ́n ti wádìí mi, fẹ́ dá mi sílẹ̀, nítorí kò sí ìdí kankan fún ìdájọ́ ikú nínú ọ̀ràn mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò rí ẹ̀sùn kankan tí ó yẹ fún ikú nínú ọ̀ràn mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn wọ̀nyí sì
  rationale: Ó tọ́ka padà sí àwọn aláṣẹ Róòmù nínú ẹsẹ tó ṣáájú; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì fi ìtẹnumọ́ tí kò ṣe kedere sínú ὅστις.
- source_word: ἀνακρίναντές με
  choice: lẹ́yìn tí wọ́n ti wádìí ọ̀ràn mi
  rationale: Ó fi hàn pé ìwádìí ìdájọ́ náà ṣẹlẹ̀ ṣáájú ìfẹ́ wọn láti dá Pọ́ọ̀lù sílẹ̀, ó sì bá àyíká ilé-ẹjọ́ mu.
- source_word: ἐβούλοντο
  choice: fẹ́
  rationale: Ó sọ èrò tàbí ìfẹ́ wọn ní àkókò tó kọjá lọ́nà Yorùbá tó rọrùn.
- source_word: ἀπολῦσαι
  choice: dá mi sílẹ̀
  rationale: Nínú àyíká òfin, ó túmọ̀ sí yíyọ ẹni kúrò ní àhámọ́ tàbí fífi í sílẹ̀.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: nítorí wọn kò rí
  rationale: Ó mú ìtumọ̀ ìdí tí àkójọpọ̀ ọ̀rọ̀ infinitive náà ní jáde ní Yorùbá àdánidá.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: ẹ̀sùn kankan tí ó yẹ fún ikú
  rationale: αἰτία lè túmọ̀ sí ẹ̀sùn tàbí ìpìlẹ̀ òfin; pẹ̀lú θανάτου, gbólóhùn yìí sọ pé kò sí ẹ̀sùn tó lè mú ìdájọ́ ikú wá.
- source_word: ἐν ἐμοί
  choice: lára mi
  rationale: 'Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tó ṣeé lóye: wọn kò rí ohun tó yẹ fún ikú nípa Pọ́ọ̀lù.'
