revisions:
- from: Lẹ́yìn tí a sì ti yè bọ́ láìléwu[a], nígbà náà ni a mọ̀ pé Málítà[b] ni a ń pe erékùṣù náà.[c]
  to: Lẹ́yìn tí a ti yè bọ́ láìléwu[a], nígbà náà ni a mọ̀ pé Málítà[b] ni a ń pe erékùṣù náà.[c]
  rationale: A yọ ‘sì’ kúrò nínú gbolohun abẹ́lẹ̀ láti mú kí Yorùbá náà rọrùn, láìpa ìtẹ̀lé ìṣẹ̀lẹ̀ ‘nígbà náà’ run. A tún ṣàtúnṣe àmì-àlàyé a kí ó má fi olùṣe tí Gíríìkì kò sọ hàn, tàbí kí ó má dà bí pé àwọn ènìyàn náà gba ara wọn là.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:32Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà fi ìtẹ̀lé ìṣẹ̀lẹ̀, ìmọ̀ tí wọ́n ṣẹ̀ṣẹ̀ rí nípa orúkọ erékùṣù náà, àti ìtumọ̀ διασωθέντες gẹ́gẹ́ bí yíyè bọ́ nínú ewu hàn dáadáa. ‘Yè bọ́ láìléwu’ kò sọ ẹni tó dá wọn nídè, nítorí náà ó yẹ fún aláìṣe Gíríìkì tí kò darúkọ olùṣe.
  naturalness: ‘Lẹ́yìn tí a sì ti ...’ kò rọrùn nínú Yorùbá boṣewa; ‘sì’ kò yẹ ní ipò yẹn. ‘Lẹ́yìn tí a ti ...’ jẹ́ ìṣètò gbolohun tí ó mọ́ tónítóní, tí ó sì ń dá ìtumọ̀ náà dúró.
  terminology: '‘Málítà,’ ‘erékùṣù,’ àti ‘a ń pe’ jẹ́ àwọn ọ̀rọ̀ tí ó bá Yorùbá òde òní mu. Àmì-àlàyé a ní ìṣòro kíkankíkan: ‘a ti gbà wá là’ lè túmọ̀ sí pé ‘àwa gba ara wa là,’ ó sì kò ìtumọ̀ aláìṣe Gíríìkì mọ́ dáadáa. A tún ṣàtúnṣe rẹ̀.'
