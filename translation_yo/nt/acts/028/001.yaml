id: ACT.28.1
reference: Acts 28:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: yo
  text: Lẹ́yìn tí a ti yè bọ́ láìléwu[a], nígbà náà ni a mọ̀ pé Málítà[b] ni a ń pe erékùṣù náà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “lẹ́yìn tí a ti là á já,” tàbí “lẹ́yìn tí a ti yè bọ́.” Ọ̀rọ̀ Gíríìkì tẹnu mọ́ yíyè bọ́ láìléwu kúrò nínú ewu.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, Melitē; erékùṣù tí a ti mọ̀ sí Málítà láti ìgbà pípẹ́.
    reason: cultural_note
  - marker: c
    text: Ní tààrà, “Málítà ni a ń pe erékùṣù náà.” Ọ̀rọ̀ Gíríìkì lo ìṣesí àsìkò ìsinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: tí a ti yè bọ́ láìléwu
  rationale: Ọ̀rọ̀ yìí sọ pé wọ́n la ewu náà já, wọ́n sì dé ibi ààbò. ‘Yè bọ́ láìléwu’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ìdáǹdè kúrò nínú ewu mọ́, láìfi ẹni tó gba wọn là hàn ní pàtó.
- source_word: τότε
  choice: nígbà náà
  rationale: Ó fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn ní kedere, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: ἐπέγνωμεν
  choice: a mọ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ìgbà náà ni wọ́n tó rí ìsọfúnni nípa orúkọ erékùṣù náà gbà.
- source_word: Μελίτη
  choice: Málítà
  rationale: Èyí ni orúkọ Yorùbá tí a sábà máa ń lò fún erékùṣù tí Gíríìkì pè ní Melitē.
- source_word: ἡ νῆσος
  choice: erékùṣù náà
  rationale: Ìtumọ̀ tààrà àti èdè Yorùbá òde òní tó ṣe kedere ni.
- source_word: καλεῖται
  choice: ni a ń pe
  rationale: Ó pa ìṣesí àsìkò ìsinsìnyí inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ tí ohun kan ń jẹ́.
theological_decisions:
- issue: Ẹni tó mú kí wọ́n la ewu já kò hàn ní pàtó nínú gbólóhùn náà.
  choice: A lo ‘yè bọ́ láìléwu,’ láìdárúkọ ẹni tó gba wọn là.
  alternative: ‘A ti gbà wá là’ lè tẹnu mọ́ ìṣesí aláìṣe ti ọ̀rọ̀ Gíríìkì.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aláìṣe, ṣùgbọ́n kò dárúkọ olùṣe. Ìtumọ̀ yìí kò fi olùṣe kan kún ẹsẹ náà, bẹ́ẹ̀ ni kò sì sọ pé agbára tiwọn ni wọ́n fi là á já.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ àti ìṣiyèméjì nípa ẹni tó gba wọn là mọ́.
