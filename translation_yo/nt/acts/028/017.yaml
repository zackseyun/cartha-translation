source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mẹ́ta, ó pe àwọn aṣáájú àwọn Júù[a] jọ. Nígbà tí wọ́n sì péjọ, ó sọ fún wọn pé, “Ẹ̀yin arákùnrin[b], bí ó tilẹ̀ jẹ́ pé èmi kò ṣe ohunkóhun lòdì sí àwọn ènìyàn tàbí sí àwọn àṣà àwọn baba ńlá[c], síbẹ̀ láti Jerúsálẹ́mù ni a ti fi mí lé àwọn ará Róòmù lọ́wọ́[d] gẹ́gẹ́ bí ẹlẹ́wọ̀n.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn olórí àwọn Júù” tàbí “àwọn ẹni pàtàkì jù lọ láàárín àwọn Júù.”
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì ἀδελφοί. Níhìn-ín, Pọ́ọ̀lù ń bá àwọn ọkùnrin aṣáájú Júù tí ó pè jọ sọ̀rọ̀.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àṣà ìbílẹ̀ àwọn baba ńlá.”
    reason: lexical_alternative
  - marker: d
    text: A tún lè túmọ̀ rẹ̀ sí “a fà mí lé àwọn ará Róòmù lọ́wọ́.” Ní ti gidi, Gíríìkì náà ní “a fi mí lé ọwọ́ àwọn ará Róòmù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Lẹ́yìn ọjọ́ mẹ́ta
  rationale: Èyí mú àsopọ̀ ìtàn Lúùkù àti àkókò náà jáde ní Yorùbá àdánidá, láìfi ọ̀rọ̀ àkókò míì kún un.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: ó pe ... jọ
  rationale: Ọ̀rọ̀ yìí fi ìṣe pípè àwọn ènìyàn láti péjọ hàn, ó sì bójú mu ìtumọ̀ συν-.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: àwọn aṣáájú àwọn Júù
  rationale: πρῶτοι níbí tọ́ka sí ipò ọlá àti ìṣáájú láàárín àwùjọ, kì í ṣe tẹ̀lé-tẹ̀lé àkókò.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Nígbà tí wọ́n sì péjọ
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tó ṣe déédé ní Yorùbá.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Ẹ̀yin arákùnrin, ... èmi
  rationale: “Ẹ̀yin arákùnrin” pa ìkíni sí àwọn ọkùnrin Júù mọ́; “èmi” sì fi ìtẹnumọ́ Ἐγώ hàn ní ibi tó máa ń dun mọ́ Yorùbá.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: bí ó tilẹ̀ jẹ́ pé èmi kò ṣe ohunkóhun lòdì sí
  rationale: Ìtumọ̀ onífẹ̀ẹ́sẹ̀ concessive náà fi ìtakora láàárín àìlẹ́bi Pọ́ọ̀lù àti fífi í lé àwọn ará Róòmù lọ́wọ́ hàn.
- source_word: τῷ λαῷ
  choice: àwọn ènìyàn wa
  rationale: Ó tọ́ka sí àwọn Júù gẹ́gẹ́ bí ènìyàn Pọ́ọ̀lù; “wa” mú ìbáṣepọ̀ náà ṣe kedere ní Yorùbá láìyí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí padà.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: àwọn àṣà tí a jogún láti ọ̀dọ̀ àwọn baba wa
  rationale: Èyí ṣe àfihàn àṣà ìbílẹ̀ tí àwọn baba ńlá fi sílẹ̀, ní èdè Yorùbá tó ṣe kedere.
- source_word: δέσμιος
  choice: gẹ́gẹ́ bí ẹlẹ́wọ̀n
  rationale: Ó ṣàpèjúwe ipò Pọ́ọ̀lù nígbà tí a fi í lé àwọn ará Róòmù lọ́wọ́.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: a ti fi mí lé àwọn ará Róòmù lọ́wọ́
  rationale: Ìtumọ̀ náà pa àwòrán “sí ọwọ́” àti ìṣe fífi ẹni lé aláṣẹ lọ́wọ́ mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nínú ìkíni tààrà
  choice: Ẹ̀yin arákùnrin
  alternative: Ẹ̀yin arákùnrin àti arábìnrin
  rationale: Àwọn ọkùnrin aṣáájú Júù tí Pọ́ọ̀lù pè jọ ni ọ̀rọ̀ náà ń bá; yíyan “arákùnrin” pa akọ nínú orísun àti ìṣọ̀kan Pọ́ọ̀lù pẹ̀lú wọn mọ́.
- issue: Agbára participle οὐδὲν ἐναντίον ποιήσας
  choice: 'concessive: “bí ó tilẹ̀ jẹ́ pé ... kò ṣe”'
  alternative: 'circumstantial: “níwọ̀n bí ... kò ti ṣe”'
  rationale: Àyíká ọ̀rọ̀ tẹnumọ́ ìtakora pé Pọ́ọ̀lù kò ṣẹ̀ sí àwọn Júù tàbí àṣà wọn, síbẹ̀ a fi í lé àwọn ará Róòmù lọ́wọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé òde òní. A lo “ẹlẹ́wọ̀n” fún ipò ìhámọ́, “fi ... lé ... lọ́wọ́” sì pa àwòrán àti ìtumọ̀ òfin orísun mọ́.
