  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: yo
  text: 'ó wí pé,[a] “Lọ sí àwọn ènìyàn yìí, kí o sì sọ pé: ‘Ní gbígbọ́, ẹ ó gbọ́, ẹ kì yóò sì lóye rárá; ní wíwo, ẹ ó wò,[b] ẹ kì yóò sì rí rárá.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ní sísọ pé.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ aláṣepọ̀ tí ó so ọ̀rọ̀ yìí mọ́ gbolohun tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà, Gíríìkì tún ọ̀rọ̀ ìríran ṣe: “ní wíwo, ẹ ó wò, ẹ kì yóò sì rí rárá.” Nínú àyíká yìí, “rí” lè tún túmọ̀ sí mímòye ohun tí ojú ń wò.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ó wí pé
  rationale: Ọ̀rọ̀ aláṣepọ̀ àsìkò ìsinsìnyí ni ó fi ọ̀rọ̀ àsọtẹ́lẹ̀ náà bẹ̀rẹ̀; ‘ó wí pé’ jẹ́ èdè Yorùbá àdánidá tí ó sì so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Lọ bá àwọn ènìyàn yìí
  rationale: ‘Lọ’ mú àṣẹ ìrìn náà jáde ní kedere, ‘bá’ sì fi ìtọ́sọ́nà πρὸς hàn; ‘àwọn ènìyàn yìí’ jẹ́ ọ̀nà àdánidá láti sọ ẹgbẹ́ ènìyàn kan ní Yorùbá.
- source_word: καὶ εἰπόν
  choice: kí o sì sọ pé
  rationale: Ó pa àṣẹ kejì mọ́, ó sì ṣí ọ̀rọ̀ tààrà tí ó tẹ̀ lé e.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Ní gbígbọ́, ẹ ó gbọ́
  rationale: A pa àtúnsọ ọ̀rọ̀ ìgbọ́ ti Gíríìkì àti àṣà ọ̀rọ̀ Hébérù mọ́, bó tilẹ̀ jẹ́ pé ó ní ìtẹnumọ́ tí Yorùbá ojoojúmọ́ kì í sábà lò báyìí.
- source_word: οὐ μὴ συνῆτε
  choice: ẹ kì yóò lóye rárá
  rationale: ‘kì yóò ... rárá’ fi agbára ìkọ̀ emphatic οὐ μή hàn; ‘lóye’ túmọ̀ sí àìní òye inú, kì í ṣe àìgbọ́ ohùn lásán.
- source_word: βλέποντες βλέψετε
  choice: ní wíwo, ẹ ó wò
  rationale: A pa ìtẹ̀síwájú àti àtúnsọ èdè ìríran mọ́ láti bá Ἀκοῇ ἀκούσετε dọ́gba.
- source_word: οὐ μὴ ἴδητε
  choice: ẹ kì yóò rí rárá
  rationale: ‘rí’ pa àtúnsọ èdè ìríran Gíríìkì mọ́, tí àyíká ọ̀rọ̀ sì lè jẹ́ kí ó túmọ̀ sí mímòye ohun tí a rí; ‘rárá’ tún fi ìkọ̀ líle náà hàn.
theological_decisions:
- issue: Àwọn ọ̀rọ̀ ìgbọ́ àti ìríran nínú àsọtẹ́lẹ̀ Aísáyà lè tọ́ka sí ìrírí ara àti àìlóye inú lẹ́ẹ̀kan náà.
  choice: Pa ‘gbọ́/lóye’ àti ‘wò/rí’ mọ́, kí àyíká ọ̀rọ̀ fi hàn pé ìríran ìkẹyìn tún lè jẹ́ ìmòye inú.
  alternative: Túmọ̀ ἴδητε sí ‘lóye ohun tí ẹ rí’ tàbí ‘mọ ohun tí ẹ rí’ láti mú ìtumọ̀ inú hàn gbangba.
  rationale: Yíyan ‘rí’ kò pa ìtumọ̀ inú rẹ́, ó sì pa ìfọ̀rọ̀wérọ̀ Gíríìkì àti àìdánilójú tòótọ́ mọ́; àlàyé ìsàlẹ̀ sọ àṣàyàn mìíràn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí λαός ṣe jẹ́ àpapọ̀ ènìyàn. A mọ̀ọ́mọ̀ pa ìṣọ̀kan àti àtúnsọ ọ̀rọ̀ àsọtẹ́lẹ̀ náà mọ́, bí ó tilẹ̀ jẹ́ pé irú gbolohun náà ga díẹ̀ ju èdè ojoojúmọ́ lọ.
