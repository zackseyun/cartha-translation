  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtẹnumọ́ àtúnsọ náà mọ́ dáadáa: Ἀκοῇ ἀκούσετε ní ‘Ní gbígbọ́, ẹ ó gbọ́,’ àti βλέποντες βλέψετε ní ‘ní wíwo, ẹ ó wò.’ ‘Lóye’ yẹ fún συνῆτε, ‘rí’ sì fi àtúnsọ ìríran ἴδητε pamọ́ láì pinnu ìtumọ̀ inú rẹ̀ ju bó ṣe yẹ lọ. Ṣùgbọ́n ‘Lọ bá àwọn ènìyàn yìí’ lè túmọ̀ sí lílọ pọ̀ pẹlu wọn tàbí lílọ láti bá wọn pàdé; πρὸς níhìn-ín túmọ̀ sí ìtọ́sọ́nà ‘sí.’ Pẹ̀lú náà, καὶ nínú ìsopọ̀ àwọn ẹ̀ka méjèèjì dára jù láti hàn ní ‘sì’ ju ‘ṣùgbọ́n’ lọ.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa, ìlò ‘ẹ’ fún àpapọ̀ ènìyàn sì bá ọ̀rọ̀ àsọtẹ́lẹ̀ mu. ‘Kì yóò ... rárá’ jẹ́ ìkọ̀ ọjọ́ iwájú tó lágbára tí ó yẹ fún οὐ μή. Àtúnṣe ‘Lọ sí’ jẹ́ kedere àti àdánidá síi.
  terminology: ‘Àwọn ènìyàn yìí’ jẹ́ ìtumọ̀ àdánidá fún λαὸν τοῦτον nínú Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lò ọ̀rọ̀ àpapọ̀ alákọ̀ọ́kan. ‘Lóye’ àti ‘rí’ dá ìyàtọ̀ tó wà láàrin ìgbọ́/òye àti wíwo/rírí dúró; àlàyé ìsàlẹ̀ b ń tọ́ka sí ìmọ̀ inú tí ‘rí’ lè gbé.
  issues:
  - severity: medium
    issue: ‘Lọ bá àwọn ènìyàn yìí’ kò fi πρὸς hàn ní ìtumọ̀ ìtọ́sọ́nà kedere.
    rationale: ‘Bá’ lè tọ́ka sí ‘pẹ̀lú’ tàbí ‘lọ bá ẹni pàdé.’ ‘Lọ sí àwọn ènìyàn yìí’ ni ìtumọ̀ tó ṣe kedere jù fún àṣẹ ‘Go to this people.’
  - severity: low
    issue: ‘ṣùgbọ́n’ nínú àwọn gbolohun méjèèjì ń fi ìdàkọ̀ró hàn níbi tí Gíríìkì ti ní καὶ (‘and’).
    rationale: Ìdàkọ̀ró wà nínú ọ̀rọ̀ àsọtẹ́lẹ̀ náà, ṣùgbọ́n a kò gbọ́dọ̀ ṣàfikún ìsopọ̀ alatakò tí kò sí nínú ìpìlẹ̀. ‘Ẹ kì yóò sì ...’ pa ìṣọ̀kan Gíríìkì mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ a pè λέγων ní ‘ní wíwí pé,’ èyí tí kò jẹ́ ọ̀nà Yorùbá tó rọrùn jù fún ìtúmọ̀ aláṣepọ̀ náà.
    rationale: ‘Ní sísọ pé’ ni ìtumọ̀ tààrà tó ṣalaye participle náà dáadáa; ó tún jẹ́ kedere pé ọrọ̀ inú gbà ‘ó wí pé’ gẹ́gẹ́ bí ìmúpadà sí gbolohun Yorùbá.
