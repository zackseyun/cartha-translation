  to: 'ó wí pé,[a] “Lọ sí àwọn ènìyàn yìí, kí o sì sọ pé: ‘Ní gbígbọ́, ẹ ó gbọ́, ẹ kì yóò sì lóye rárá; ní wíwo, ẹ ó wò,[b] ẹ kì yóò sì rí rárá.’”'
  rationale: A tún ‘bá’ ṣe sí ‘sí’ láti túmọ̀ πρὸς ní ìtọ́sọ́nà kedere. A tún fi ‘sì’ rọ́pò ‘ṣùgbọ́n’ láti tọ́pa καὶ, láì yí agbára ìkọ̀ οὐ μή tàbí àtúnsọ àsọtẹ́lẹ̀ náà padà. A ṣàtúnṣe àlàyé a kí ó le ṣàlàyé λέγων ní Yorùbá tó péye.
