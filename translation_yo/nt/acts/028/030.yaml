translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. “Odindi ọdún méjì” pa ìtẹnumọ́ iye àkókò mọ́; “máa ń” sì fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn. Àmì kọ́mà ní òpin ni a pa mọ́ nítorí ẹsẹ yìí ń bá ọ̀rọ̀ ẹsẹ tó tẹ̀ lé e lọ.
