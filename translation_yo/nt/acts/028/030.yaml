  source_fidelity: Ìtumọ̀ àkókò náà, ìtẹnumọ́ ‘odindi,’ ilé àyálégbé, àti ìṣe àṣà tí imperfect ń fi hàn jẹ́ olóòótọ́ sí Gíríìkì. Ṣùgbọ́n ‘fi tayọ̀tayọ̀ gba’ fi ìmọ̀lára àfikún sí ἀπεδέχετο, ‘wọlé tọ̀ ọ́ wá’ sì kì í wọ́pọ̀ nínú Yorùbá boṣewa.
  naturalness: A tún ọ̀rọ̀ gbígbà àwọn àlejò ṣe sí ‘ń tẹ́wọ́ gba,’ èyí tí ó jẹ́ Yorùbá òde òní, tó sì ṣàfihàn ìtẹ́wọ́gbà dáadáa. ‘Àwọn tí wọ́n ń wọlé wá sọ́dọ̀ rẹ̀’ pa àfihàn ìwọlé mọ́ láìjẹ́ kí gbolohun náà dùn lásán.
  terminology: ‘Ilé àyálégbé tirẹ̀’ túmọ̀ ἐν ἰδίῳ μισθώματι ní ọ̀nà kedere, láìfi ìmọ̀ àfikún pé Pọ́ọ̀lù fúnra rẹ̀ ló ṣètò ìyálégbé náà. ‘Tẹ́wọ́ gba’ bá ìtumọ̀ ἀπεδέχετο mu ju ọ̀rọ̀ ìtẹnumọ́ ‘fi tayọ̀tayọ̀ gba’ lọ.
