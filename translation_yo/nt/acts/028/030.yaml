  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: yo
  text: Ó sì dúró fún odindi ọdún méjì nínú ilé àyálégbé tirẹ̀[a], ó sì ń tẹ́wọ́ gba gbogbo àwọn tí wọ́n ń wọlé wá sọ́dọ̀ rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ibùgbé àyálégbé tirẹ̀.” Ọ̀rọ̀ Gíríìkì μίσθωμα ń tọ́ka sí ibi gbígbé tí a háyà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo àwọn tí wọ́n wá sọ́dọ̀ rẹ̀.” Ní tààràtà, èdè Gíríìkì sọ pé “gbogbo àwọn tí wọ́n ń wọlé wá sọ́dọ̀ rẹ̀,” èyí tí ó lè tọ́ka sí àwọn àlejò tí wọ́n ń wọ inú ilé rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: Ó dúró
  rationale: Ọ̀rọ̀ náà tọ́ka sí wíwà tàbí dídúró sí ibì kan fún àkókò kan; “dúró” jẹ́ èdè Yorùbá àdánidá tí ó bá àkópọ̀ ìtàn mu.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe ìtakora líle.
- source_word: διετίαν ὅλην
  choice: fún odindi ọdún méjì
  rationale: “Odindi” pa ìtẹnumọ́ ὅλην mọ́, ó sì fi hàn pé gbogbo àkókò ọdún méjì náà ni.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: nínú ilé tí òun fúnra rẹ̀ háyà
  rationale: μίσθωμα túmọ̀ sí ibùgbé tí a háyà; gbolohun yìí jẹ́ èdè Yorùbá òde òní tí ó sì pa ìtumọ̀ ἰδίῳ mọ́ pé òun fúnra rẹ̀ ló ṣètò rẹ̀.
- source_word: ἀπεδέχετο
  choice: ó máa ń fi tayọ̀tayọ̀ gba
  rationale: Àkókò imperfect náà fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn; “máa ń” mú èyí jáde, “fi tayọ̀tayọ̀ gba” sì sọ ìtẹ́wọ́gbà onínúure.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: gbogbo àwọn tí wọ́n wọlé tọ̀ ọ́ wá
  rationale: “Wọlé” pa ìtumọ̀ ibi inú εἰσπορευομένους mọ́, níwọ̀n bí àwọn àlejò ti ń wọ inú ilé rẹ̀ wá.
