source:
  edition: SBLGNT
  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: yo
  text: Lẹ́yìn tí a dé sí èbúté Sírákúsì[a], a dúró níbẹ̀ fún ọjọ́ mẹ́ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lẹ́yìn tí a gúnlẹ̀ ní Sírákúsì” tàbí “lẹ́yìn tí a wọ èbúté Sírákúsì.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ pàtó tó ní í ṣe pẹ̀lú ìrìn-àjò ojú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: Lẹ́yìn tí a dé sí èbúté
  rationale: Nínú àyíká ìrìn-àjò ojú omi, ọ̀rọ̀ náà túmọ̀ sí dídé sí èbúté tàbí gígúnlẹ̀. Gbólóhùn yìí mú ìtumọ̀ ti ojú omi hàn ní Yorùbá àdánidá láì tẹ̀ lé ìtumọ̀ gangan tí kò ní mọ́gbọ́n dání.
- source_word: εἰς Συρακούσας
  choice: sí èbúté Sírákúsì
  rationale: εἰς fi ìlọsí ibi kan hàn. Pẹ̀lú ọ̀rọ̀ tó ní í ṣe pẹ̀lú ọkọ̀ ojú omi, “sí èbúté Sírákúsì” ṣàlàyé ibi tí wọ́n dé lọ́nà tó ṣe kedere.
- source_word: ἐπεμείναμεν
  choice: a dúró níbẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti dúró tàbí wà ní ibì kan. “A dúró níbẹ̀” jẹ́ Yorùbá òde òní tó ṣe kedere, tí ó sì mú ibi tí wọ́n wà hàn gẹ́gẹ́ bí àyíká ṣe tọ́ka sí.
- source_word: ἡμέρας τρεῖς
  choice: fún ọjọ́ mẹ́ta
  rationale: Ẹ̀sùn-orúkọ yìí ń sọ bí àkókò náà ṣe gùn. “Fún ọjọ́ mẹ́ta” ni ọ̀nà àdánidá láti sọ iye àkókò náà ní Yorùbá.
- source_word: Συρακούσας
  choice: Sírákúsì
  rationale: Àkọ̀wé orúkọ ibi náà ni a mú bá ìró àti ìkọ̀wé Yorùbá mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá tó ṣe kedere, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. “Èbúté” pa àyíká ìrìn-àjò ojú omi mọ́, nígbà tí “a dúró níbẹ̀” jẹ́ ọ̀rọ̀ àdánidá fún ἐπεμείναμεν.
