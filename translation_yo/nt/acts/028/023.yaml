id: ACT.28.23
reference: Acts 28:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti bá a yan ọjọ́ kan, ọ̀pọ̀ sí i nínú wọn wá bá a sí ibi ìbùgbé rẹ̀.[a] Ó ń ṣàlàyé fún wọn[b], ó ń fi ẹ̀rí rẹ̀ múlẹ̀ nípa ìjọba Ọlọ́run, ó sì ń rọ̀ wọ́n lójú nípa Jésù[c] láti inú Òfin Mósè àti àwọn Wòlíì, láti òwúrọ̀ títí di alẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ibi àlejò rẹ̀” tàbí “sí ibi tí ó dúró sí.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibùgbé tàbí ibi àlejò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń túmọ̀ ọ̀rọ̀ náà sílẹ̀” tàbí “ó ń gbé e kalẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó sì ń mú wọn lójú nípa Jésù.” Ọ̀rọ̀ Gíríìkì náà ń fi iṣẹ́ ìrọ̀rọ̀ hàn, láì sọ bóyá gbogbo wọn ní a rọ̀ lójú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... ἡμέραν
  choice: Lẹ́yìn tí wọ́n ti bá a yan ọjọ́ kan
  rationale: Ó fi hàn pé wọ́n jọ pinnu ọjọ́ ìpàdé kan; ‘bá a yan’ tú αὐτῷ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: εἰς τὴν ξενίαν
  choice: ní ibi tí ó ń gbé
  rationale: ξενία túmọ̀ sí ibùgbé tàbí ibi àlejò; gbolohun yìí ṣe kedere láì fi dájú irú ilé tí ó jẹ́.
- source_word: πλείονες
  choice: ọ̀pọ̀ sí i nínú wọn
  rationale: Ó pa ìtumọ̀ afiwéra mọ́ pé iye àwọn tó wá pọ̀ ju tẹ́lẹ̀ lọ.
- source_word: ἐξετίθετο
  choice: Ó sì ń ṣàlàyé fún wọn
  rationale: Àmì imperfect náà tọ́ka sí ìṣàlàyé tó ń bá a lọ; ‘ń ṣàlàyé’ jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: διαμαρτυρόμενος
  choice: ó ń jẹ́rìí tọkàntọkàn
  rationale: ‘Tọkàntọkàn’ mú agbára àti ìfọkànsìn inú ọ̀rọ̀ náà jáde láì sọ ọ́ di àsọdùn.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tó taara, tó sì ti wọ́pọ̀ ní Yorùbá.
- source_word: πείθων τε αὐτοὺς
  choice: ó sì ń gbìyànjú láti mú wọn gbàgbọ́
  rationale: Ó pa iṣẹ́ ìrọ̀rọ̀ tàbí ìmúnigbọ́gbọ́ mọ́, ṣùgbọ́n kò sọ pé gbogbo wọn gba ohun tí Pọ́ọ̀lù sọ.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: nípa Jésù
  rationale: ‘Nípa’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún περὶ.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: láti inú Òfin Mósè àti àwọn Wòlíì
  rationale: ‘Láti inú’ fi hàn pé àwọn Ìwé Mímọ́ wọ̀nyí ni orísun ẹ̀rí rẹ̀; ó tún pa ìṣọ̀kan Òfin àti àwọn Wòlíì mọ́.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: láti òwúrọ̀ títí di alẹ́
  rationale: Ìtumọ̀ àdánidá ni fún gbogbo àkókò láti òwúrọ̀ dé ìrọ̀lẹ́/alẹ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ẹ̀rí nípa ìjọba Ọlọ́run àti ìmúnigbọ́gbọ́ nípa Jésù
  choice: A fi àwọn méjèèjì hàn gẹ́gẹ́ bí apá ìṣàlàyé kan náà tí ó dá lórí Òfin Mósè àti àwọn Wòlíì.
  alternative: Kí a tú wọn bí kókó méjì tí kò ní ìbáṣepọ̀ dandan.
  rationale: Ìṣọ̀kan gírámà Gíríìkì so ìjọba Ọlọ́run àti ọ̀rọ̀ nípa Jésù pọ̀ nínú ìṣàlàyé kan; a kò fi ẹ̀kọ́ ìsìn míì kún un.
- issue: Bóyá πείθων sọ àṣeyọrí tàbí ìgbìyànjú
  choice: ó ń gbìyànjú láti mú wọn gbàgbọ́
  alternative: ó ń mú wọn gbàgbọ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí iṣẹ́ ìrọ̀rọ̀ láì fi dájú pé gbogbo olùgbọ́ ni a mú gbàgbọ́; ìtumọ̀ yìí pa àìdánilójú abajade mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá, àdánidá, ó sì yẹ fún òǹkàwé òde òní. A lo ‘Pọ́ọ̀lù’ nínú àlàyé nìkan, kì í ṣe nínú ẹsẹ̀, nítorí orúkọ náà kò sí nínú Gíríìkì ẹsẹ̀ yìí.
