revisions:
- from: Lẹ́yìn tí wọ́n ti bá a yan ọjọ́ kan, ọ̀pọ̀ sí i nínú wọn wá bá a ní ibi tí ó ń gbé.[a] Ó sì ń ṣàlàyé fún wọn, ó ń jẹ́rìí tọkàntọkàn nípa ìjọba Ọlọ́run, ó sì ń gbìyànjú láti mú wọn gbàgbọ́ nípa Jésù láti inú Òfin Mósè àti àwọn Wòlíì,[b][c] láti òwúrọ̀ títí di alẹ́.
  to: Lẹ́yìn tí wọ́n ti bá a yan ọjọ́ kan, ọ̀pọ̀ sí i nínú wọn wá bá a sí ibi ìbùgbé rẹ̀.[a] Ó ń ṣàlàyé fún wọn[b], ó ń fi ẹ̀rí rẹ̀ múlẹ̀ nípa ìjọba Ọlọ́run, ó sì ń rọ̀ wọ́n lójú nípa Jésù[c] láti inú Òfin Mósè àti àwọn Wòlíì, láti òwúrọ̀ títí di alẹ́.
  rationale: A tún ‘ní’ ṣe sí ‘sí’ láti fi ìṣíwájú εἰς hàn. A rọ́pò ìtumọ̀ tí ó fi ‘ìgbìyànjú’ àti abajade ìgbàgbọ́ kún πείθων pẹ̀lú ‘ń rọ̀ wọ́n lójú nípa Jésù,’ èyí tí ó pa ìtumọ̀ àti àìdánilójú abajade mọ́. A tún ṣètò àwọn àmì àlàyé-ẹsẹ̀ sí ibi tí ọkọọkan wọn ti kan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe ni a nílò láti mú ìtọ́ka ìhùwàsí εἰς ('sí') àti ìtumọ̀ πείθων ('ń rọ̀ ... lójú') sún mọ́ Gíríìkì. Ìtumọ̀ 'ń gbìyànjú láti mú wọn gbàgbọ́' fi ìgbìyànjú tí kò wà ní ọ̀rọ̀ Gíríìkì kún un, ó sì lè yí ohun tí a ń rọ̀ wọ́n lójú nípa rẹ̀ padà.
  naturalness: ‘Ó ń fi ẹ̀rí rẹ̀ múlẹ̀ nípa’ àti ‘ó sì ń rọ̀ wọ́n lójú nípa Jésù’ jẹ́ Yorùbá boṣewa, adayeba, tí ó sì bá ọ̀nà ìṣàlàyé àti ìjẹ́rìí nínú ẹsẹ̀ náà mu. ‘Sí ibi ìbùgbé rẹ̀’ tún dáa ju ‘ní ibi tí ó ń gbé’ lọ nítorí ìṣíwájú sí ibi ni Gíríìkì ń sọ.
  terminology: ‘Ìjọba Ọlọ́run,’ ‘Òfin Mósè,’ ‘àwọn Wòlíì,’ àti ‘Jésù’ yẹ, wọ́n sì ṣe ìbámu pẹ̀lú ìlò Bíbélì Yorùbá. A pa ìbáṣepọ̀ láàárín ìjọba Ọlọ́run àti ìrọ̀rọ̀ nípa Jésù mọ́ láì kún un ní ìtumọ̀ ẹ̀kọ́ ìsìn míì.
  issues:
  - severity: medium
    issue: ‘ní ibi tí ó ń gbé’
    rationale: εἰς τὴν ξενίαν jẹ́ ìṣíwájú sí ibi ìbùgbé rẹ̀; ìtumọ̀ tó wà lọwọlọwọ̀ ń sọ ibi tí wọ́n wà dé (ní) dípò ibi tí wọ́n lọ sí (sí).
  - severity: medium
    issue: ‘ó sì ń gbìyànjú láti mú wọn gbàgbọ́ nípa Jésù’
    rationale: πείθων αὐτοὺς περὶ τοῦ Ἰησοῦ sọ pé ó ń rọ̀/ń yí wọn lójú nípa Jésù. ‘Ń gbìyànjú’ jẹ́ ìfikún, ‘mú wọn gbàgbọ́’ sì lè túmọ̀ sí fífi wọ́n gba ìgbàgbọ́ kan, kì í ṣe ìrọ̀rọ̀ nípa Jésù.
  - severity: low
    issue: Àwọn àmì àlàyé-ẹsẹ̀ b àti c wà ní òpin gbolohun dípò lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
