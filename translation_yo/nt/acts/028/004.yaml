id: ACT.28.4
reference: Acts 28:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: yo
  text: Nígbà tí àwọn ará erékùṣù náà rí ẹranko náà tí ó rọ̀ mọ́ ọwọ́ rẹ̀, wọ́n ń sọ fún ara wọn pé, “Dájúdájú, apànìyàn ni ọkùnrin yìí; bí ó tilẹ̀ yè bó láti inú òkun, Ìdájọ́ kò jẹ́ kí ó wà láàyè.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, βάρβαροι, lè túmọ̀ sí “àwọn tí kì í sọ èdè Gíríìkì” tàbí “àwọn ìbílẹ̀.” Níhìn-ín ó tọ́ka sí àwọn olùgbé agbègbè náà, kì í ṣe pé wọ́n jẹ́ aláìlàjú.
    reason: lexical_alternative
  - marker: b
    text: “Ìdájọ́” túmọ̀ ọ̀rọ̀ Gíríìkì díkē. Níhìn-ín ó dà bí ìdájọ́ tí a sọ di ẹni, tí ń san ẹ̀san fún ìwà búburú; ó sì lè tan mọ́ ìgbàgbọ́ àwọn ará erékùṣù náà nípa agbára òrìṣà.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: àwọn ará erékùṣù náà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn olùgbé ibẹ̀ tí kì í sọ èdè Gíríìkì, kì í ṣe pé wọ́n jẹ́ ènìyàn búburú tàbí aláìlàjú. ‘Àwọn ará erékùṣù náà’ dá ẹni tí a ń tọ́ka sí mọ̀ ní èdè Yorùbá àdánidá.
- source_word: κρεμάμενον
  choice: tí ó rọ̀ mọ́
  rationale: Ó pa àwòrán ẹranko tí ó so tàbí tí ó rọ̀ sí ọwọ́ Paulu mọ́ láìfi ìdúró rẹ̀ hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸ θηρίον
  choice: ẹranko náà
  rationale: Orúkọ náà jẹ́ ọ̀rọ̀ gbòòrò fún ẹranko tàbí ẹ̀dá; bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ejò olóró ni, ẹsẹ yìí kò tún pè é ní ejò ní pàtó.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: wọ́n ń sọ fún ara wọn
  rationale: Ìṣe aláìparí ἔλεγον lè fi ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń tún sọ hàn; ‘wọ́n ń sọ’ gbé ìtumọ̀ yẹn jáde, ‘fún ara wọn’ sì pa πρὸς ἀλλήλους mọ́.
- source_word: Πάντως
  choice: Dájúdájú
  rationale: Ó fi ìdánilójú líle tí àwọn olùsọ ní nínú ìpinnu wọn hàn.
- source_word: φονεύς
  choice: apànìyàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ó pa ènìyàn ní ìlòdì sí òfin.
- source_word: διασωθέντα
  choice: ó yè bó
  rationale: Ó sọ pé ó la ewu já láìfarapa sí ikú. Nínú àyíká yìí, gbólóhùn náà jẹ́ àdánidá, ó sì yẹra fún fífi ìtumọ̀ ìgbàlà nípa ẹ̀sìn kún un.
- source_word: ἡ δίκη
  choice: Ìdájọ́ Òdodo
  rationale: A kọ ọ́ bí orúkọ ẹni láti fi ìsọ̀rọ̀-ẹni hàn, ṣùgbọ́n a kò pè é ní òrìṣà ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
- source_word: ζῆν οὐκ εἴασεν
  choice: kò jẹ́ kí ó wà láàyè
  rationale: Ó túmọ̀ sí pé kò gbà á láàyè mọ́; ìṣètò yìí jẹ́ kedere, ó sì bá ọ̀rọ̀ àwọn ará erékùṣù mu.
- source_word: ἐκ τῆς θαλάσσης
  choice: láti inú òkun
  rationale: ἐκ túmọ̀ sí ‘láti inú’ tàbí ‘jáde láti’; pẹ̀lú ‘ó yè bó,’ ó tọ́ka sí bí ó ṣe la ewu òkun já.
theological_decisions:
- issue: Ìsọ̀rọ̀-ẹni fún δίκη
  choice: Ìdájọ́ Òdodo
  alternative: ìdájọ́ òdodo; Ẹ̀san; òrìṣà Ìdájọ́ Òdodo
  rationale: Lílo lẹ́tà ńlá fi hàn pé àwọn ará erékùṣù ń wo ìdájọ́ òdodo bí agbára ẹni tí ń fi ẹ̀san ẹ̀ṣẹ̀ jẹ, ṣùgbọ́n kò fìdí rẹ̀ múlẹ̀ pé akọ̀wé fara mọ́ ìgbàgbọ́ wọn tàbí pé orúkọ òrìṣà kan pàtó ni.
translation_notes:
  register: Yorùbá àgbàndá tí ó ní àmì ohùn kíkún, pẹ̀lú ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ìṣe aláìparí ‘wọ́n ń sọ’ láti fi imperfect Gíríìkì hàn. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ àkọ́kọ́.
