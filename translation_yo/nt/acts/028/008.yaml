id: ACT.28.8
reference: Acts 28:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé baba Públíù dùbúlẹ̀ ní àìsàn, ó sì ń jìyà àwọn ìkọlù ibà àti ìgbẹ́-ẹ̀jẹ̀. Pọ́ọ̀lù wọlé lọ sọ́dọ̀ rẹ̀; ó gbàdúrà, ó gbé ọwọ́ rẹ̀ lé e, ó sì mú un láradá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣe ìyípadà sínú ìṣẹ̀lẹ̀ tuntun, ó sì pa agbára àsopọ̀ δὲ mọ́ láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: πατέρα τοῦ Ποπλίου
  choice: baba Públíù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé àti tó ṣe kedere fún ìbátan tí ẹ̀ka ọ̀rọ̀ Gíríìkì yìí fi hàn.
- source_word: πυρετοῖς
  choice: àwọn ìkọlù ibà
  rationale: Ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, nítorí náà ‘àwọn ìkọlù ibà’ pa ìtumọ̀ ọ̀pọ̀ mọ́ ní Yorùbá àdánidá láìsọ pé ibà kan ṣoṣo ni.
- source_word: δυσεντερίῳ
  choice: ìgbẹ́-ẹ̀jẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún dysentery.
- source_word: συνεχόμενον
  choice: mú un
  rationale: Ọ̀rọ̀ ìṣe náà ń sọ pé àwọn àìsàn náà dì í mú tàbí ń pọ́n ọn lójú; ‘mú un’ pa àwòrán yẹn mọ́ ní ṣókí.
- source_word: κατακεῖσθαι
  choice: dùbúlẹ̀ àìsàn
  rationale: Èyí fi ìdùbúlẹ̀ àti ipò àìsàn hàn láìsọ ju orísun lọ pé kò lè dìde rárá.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθών
  choice: Pọ́ọ̀lù wọlé tọ̀ ọ́ lọ
  rationale: Ó sọ ìwọlé Pọ́ọ̀lù sí ibi tí aláìsàn náà wà àti bí ó ṣe tọ̀ ọ́ lọ ní Yorùbá tó ṣàn.
- source_word: προσευξάμενος
  choice: ó gbàdúrà
  rationale: Ní ìtẹ̀lé àwọn ọ̀rọ̀ ìṣe, gbígbàdúrà wá ṣáájú gbígbé ọwọ́ lé e àti ìmúláradá, gẹ́gẹ́ bí apá-ìṣe aorist ṣe tọ́ka sí.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: ó gbé ọwọ́ lé e
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún ìṣe náà; ‘ọwọ́’ lè dúró fún ọwọ́ méjèèjì ní irú gbólóhùn yìí láìyí ìtumọ̀ padà.
- source_word: ἰάσατο αὐτόν
  choice: ó mú un láradá
  rationale: Èyí túmọ̀ ìwòsàn náà ní tààrà, ní èdè Yorùbá tó wọ́pọ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
theological_decisions:
- issue: Irú ìwòsàn tí Pọ́ọ̀lù ṣe
  choice: A sọ ìtẹ̀lé náà ní tààrà gẹ́gẹ́ bí àdúrà, gbígbé ọwọ́ lé aláìsàn, àti mímú un láradá.
  alternative: Láti pè é ní iṣẹ́ ìyanu ní pàtó, tàbí láti ṣàlàyé rẹ̀ bí ìmúláradá ti ìṣègùn nìkan.
  rationale: Ẹsẹ náà sọ pé Pọ́ọ̀lù mú un láradá lẹ́yìn àdúrà àti gbígbé ọwọ́ lé e, ṣùgbọ́n kò fún ìwòsàn náà ní àkọlé ẹ̀kọ́ ìgbàgbọ́ míì; ìtumọ̀ náà kò fi ohunkóhun kún ẹ̀rí orísun.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Àwọn ìkọlù ibà’ pa ọ̀pọ̀ inú πυρετοῖς mọ́ ní ọ̀nà tó yé, ‘ìgbẹ́-ẹ̀jẹ̀’ sì jẹ́ ọ̀rọ̀ àdánidá fún dysentery.
