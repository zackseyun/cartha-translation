revisions:
- from: Ó sì ṣẹlẹ̀ pé baba Públíù dùbúlẹ̀ àìsàn, àwọn ìkọlù ibà àti ìgbẹ́-ẹ̀jẹ̀ sì mú un[a]. Pọ́ọ̀lù wọlé tọ̀ ọ́ lọ; ó gbàdúrà, ó gbé ọwọ́ lé e, ó sì mú un láradá.
  to: Ó sì ṣẹlẹ̀ pé baba Públíù dùbúlẹ̀ ní àìsàn, ó sì ń jìyà àwọn ìkọlù ibà àti ìgbẹ́-ẹ̀jẹ̀. Pọ́ọ̀lù wọlé lọ sọ́dọ̀ rẹ̀; ó gbàdúrà, ó gbé ọwọ́ rẹ̀ lé e, ó sì mú un láradá.
  rationale: A tún gbolohun méjì ṣe fún ìṣàn Yorùbá àti ìdúróṣinṣin sí ìtumọ̀ Gíríìkì. ‘Ó ń jìyà’ ń túmọ̀ ìrònú pé àìsàn náà ń dì í mú, ‘wọlé lọ sọ́dọ̀ rẹ̀’ sì ń sọ ìtọ́ka Paul sí aláìsàn náà ní kedere. A pa ìtẹ̀lé àdúrà, gbígbé ọwọ́ lé e, àti ìwòsàn mọ́; a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
