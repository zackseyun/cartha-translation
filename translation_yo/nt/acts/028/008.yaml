  source_fidelity: 'Ìtumọ̀ náà gba gbogbo àwọn èrò pàtàkì Gíríìkì náà: baba Públíù dùbúlẹ̀ ní àìsàn, ibà púpọ̀ àti ìgbẹ́-ẹ̀jẹ̀ ń pọ́n ọn lójú, Pọ́ọ̀lù wọlé lọ sọ́dọ̀ rẹ̀, ó gbàdúrà, ó gbé ọwọ́ lé e, ó sì mú un láradá. Àtúnṣe náà ń ṣe ìbáṣepọ̀ ''wọlé ... sọ́dọ̀ rẹ̀'' kedere ju ''wọlé tọ̀ ọ́ lọ'' lọ, ó sì ń jẹ́ kí ipò ìjìyà tí συνεχόμενον fi hàn ṣàn dáadáa ní Yorùbá.'
  naturalness: 'Àwọn gbolohun nínú ìtumọ̀ àkọ́kọ́ ní ìṣòro díẹ̀: ''àwọn ìkọlù ibà àti ìgbẹ́-ẹ̀jẹ̀ sì mú un'' àti ''wọlé tọ̀ ọ́ lọ'' kò rọrùn tó nínú Yorùbá ìgbàlódé. A tún wọn ṣe sí ''ó sì ń jìyà...'' àti ''wọlé lọ sọ́dọ̀ rẹ̀,'' tí ó jẹ́ àdánidá, kedere, ó sì dá ìtẹ̀lé ìṣẹ̀lẹ̀ dúró.'
  terminology: ‘Públíù,’ ‘ìkọlù ibà,’ ‘ìgbẹ́-ẹ̀jẹ̀,’ ‘gbàdúrà,’ ‘gbé ọwọ́ lé e,’ àti ‘mú un láradá’ bá ìforúkọsílẹ̀ Bíbélì Yorùbá ìgbàlódé mu. ‘Àwọn ìkọlù ibà’ ń fi ọ̀pọ̀ πυρετοῖς hàn láìfúnni ní àlàyé ìṣègùn tí orísun kò sọ.
