translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ ní ibi tó bá yẹ, a sì pa ìtẹ̀lé ìṣe àti àìdánilójú tó wà nínú Gíríìkì mọ́.
