  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà tẹ̀lé Gíríìkì dáadáa: Pọ́ọ̀lù kó igi ìdáná jọ, ó gbé e sórí iná, ejò paramọ́lẹ̀ náà sì jáde nítorí ooru, ó dì mọ́ ọwọ́ rẹ̀. Àmì àlàyé ìsàlẹ̀ náà wà ní ibi tí ó tọ́. Síbẹ̀, àṣàyàn “jẹ ọwọ́ rẹ̀” nínú àlàyé ìsàlẹ̀ lè túmọ̀ sí pé ejò náà jẹ ọwọ́ náà gẹ́gẹ́ bí oúnjẹ, kì í ṣe pé ó bù ú; èyí kò pe gẹ́gẹ́ bí àṣàyàn fún καθῆψε.'
  naturalness: “Dì mọ́ ọwọ́ rẹ̀” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání ju “rọ̀ mọ́ ọwọ́ rẹ̀” lọ fún ìṣe ejò tí ó fi ara mọ́ ọwọ́ ènìyàn. “Ìdì igi gbígbẹ́” sì rọrùn, ó sì dára fún ìdì igi ìdáná.
