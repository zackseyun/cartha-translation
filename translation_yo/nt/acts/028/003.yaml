  to: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù kó ìdì igi gbígbẹ́ jọ, tí ó sì gbé e sórí iná, ejò paramọ́lẹ̀ kan jáde nítorí ooru náà[a], ó sì dì mọ́ ọwọ́ rẹ̀[b].
