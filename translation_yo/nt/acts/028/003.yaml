source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pọ́ọ̀lù kó ìdì igi gbígbẹ́ jọ, tí ó sì gbé e sórí iná, ejò paramọ́lẹ̀ kan jáde nítorí ooru náà[a], ó sì dì mọ́ ọwọ́ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “jáde láti inú ooru náà.” Ọ̀rọ̀ àṣáájú Gíríìkì náà lè túmọ̀ sí èyí ní tààràtà, ṣùgbọ́n ó ṣeé ṣe jù pé níbí ó ń sọ ohun tó fà á tí ejò náà fi jáde: ooru iná náà.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú ọwọ́ rẹ̀” tàbí “bu ọwọ́ rẹ̀ jẹ.” Ọ̀rọ̀ ìṣe Gíríìkì náà ní ìtumọ̀ gbòòrò pé “dì mọ́” tàbí “mú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: kó … jọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí kíkó àwọn ohun jọ. Nínú àyíká yìí, ó túmọ̀ sí pé Pọ́ọ̀lù kó igi ìdáná jọ, kì í ṣe pé ó hun wọn pọ̀.
- source_word: φρυγάνων τι πλῆθος
  choice: ìdì àwọn igi gbígbẹ́
  rationale: φρύγανα jẹ́ àwọn igi kéékèèké tàbí ẹ̀ka gbígbẹ́ tí a lè fi dá iná; τι πλῆθος sì fi iye tí a kò sọ pàtó hàn. ‘Ìdì àwọn igi gbígbẹ́’ jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ohun tí a kó jọ mọ́.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: gbé wọn lé iná
  rationale: Èyí sọ ìṣe fífi àwọn igi náà sórí iná ní ọ̀nà Yorùbá tó ṣe kedere, láì sọ πυρά di ọwọ́ iná nìkan.
- source_word: ἔχιδνα
  choice: ejò paramọ́lẹ̀
  rationale: ἔχιδνα jẹ́ irú ejò olóró kan ní pàtó, kì í ṣe ejò lásán. ‘Ejò paramọ́lẹ̀’ pa ìtumọ̀ pàtó yẹn mọ́.
- source_word: ἀπὸ τῆς θέρμης
  choice: nítorí ooru náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀπό lè túmọ̀ sí ‘láti inú,’ níbí ó ṣeé ṣe jù pé ó ń fi ohun tó mú kí ejò náà jáde hàn, ìyẹn ooru iná náà. Àlàyé ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐξελθοῦσα
  choice: jáde
  rationale: Ó fi hàn ní ṣókí àti ní ti ẹ̀dá pé ejò náà jáde nígbà tí ooru iná dé ọ̀dọ̀ rẹ̀.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: rọ̀ mọ́ ọwọ́ rẹ̀
  rationale: καθάπτω lè túmọ̀ sí dídì mọ́ tàbí mímú ohun kan. ‘Rọ̀ mọ́ ọwọ́ rẹ̀’ pa àwòrán bí ejò náà ṣe dì mọ́ ọwọ́ Pọ́ọ̀lù mọ́ láì pinnu pé ọ̀rọ̀ náà fúnra rẹ̀ túmọ̀ sí jíjẹ.
