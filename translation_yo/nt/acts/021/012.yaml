source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: yo
  text: Nígbà tí a gbọ́ nǹkan wọ̀nyí, àwa àti àwọn ará ibẹ̀ ń bẹ̀ ẹ́[a] pé kí ó má ṣe gòkè lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń rọ̀ ọ́ pé kí ó má ṣe gòkè lọ sí Jerúsálẹ́mù.” Ọ̀rọ̀-ìṣe náà tún lè túmọ̀ sí ìbẹ̀bẹ̀ pẹ̀lú ìtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Nígbà tí a gbọ́ nǹkan wọ̀nyí
  rationale: Ó fi àkókò àti ìtẹ̀síwájú ìtàn hàn ní èdè Yorùbá àdánidá, ó sì pa ọ̀pọ̀ nǹkan tí ταῦτα ń tọ́ka sí mọ́.
- source_word: παρεκαλοῦμεν
  choice: bẹ̀ ẹ́ gidigidi
  rationale: Nínú àyíká ọ̀rọ̀ yìí, παρακαλέω túmọ̀ sí ẹ̀bẹ̀ tàbí ìrọ̀ létí pẹ̀lú ìtara; ‘bẹ̀ ẹ́ gidigidi’ mú agbára ọ̀rọ̀ náà jáde láì fi ìmọ̀lára tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: àwa àti àwọn ará ibẹ̀
  rationale: Ó ya ẹgbẹ́ ẹni tó ń sọ ìtàn àti àwọn olùgbé àdúgbò náà sọ́tọ̀ ní ọ̀nà tí ó ṣe kedere, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: pé kí ó má ṣe gòkè lọ
  rationale: Ìtumọ̀ yìí fi ohun tí wọ́n bẹ̀ Pọ́ọ̀lù pé kó má ṣe hàn, ó sì pa ìtọ́sọ́nà ‘gòkè lọ’ tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé fún ibi tí ìrìnàjò náà ń lọ.
theological_decisions:
- issue: Ọ̀rọ̀ ìtọ́sọ́nà fún lílọ sí Jerúsálẹ́mù
  choice: gòkè lọ sí Jerúsálẹ́mù
  alternative: lọ sí Jerúsálẹ́mù
  rationale: ἀναβαίνειν túmọ̀ sí ‘gòkè lọ’ ó sì jẹ́ ọ̀nà tí a sábà ń gbà sọ ìrìnàjò sí Jerúsálẹ́mù; pípa á mọ́ tẹ̀ lé orísun láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó bójú mu, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó yẹ, a sì fi ‘gòkè lọ’ pa àwòrán ìtọ́sọ́nà orísun mọ́.
