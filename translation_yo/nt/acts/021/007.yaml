id: ACT.21.7
reference: Acts 21:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: yo
  text: Àwa sì, lẹ́yìn tí a parí ìrìn-àjò wa lórí òkun láti Tírè, dé Ptolemaisi. Lẹ́yìn tí a kí àwọn arákùnrin[a], a dúró lọ́dọ̀ wọn fún ọjọ́ kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn arákùnrin,” ọ̀pọ̀ akọ tí ó lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Nígbà tí àwa sì
  rationale: Àrọ́pò-orúkọ tí a tẹnumọ́ náà fi àwọn akọ̀wé ìrìn-àjò hàn gẹ́gẹ́ bí olùṣe, δέ sì ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú. Fífi “àwa” hàn ní kedere pa ìtẹnumọ́ náà mọ́.
- source_word: τὸν πλοῦν διανύσαντες
  choice: parí ìrìn-àjò wa lórí òkun
  rationale: διανύω túmọ̀ sí píparí ohun tí a ń kọjá, πλοῦς sì jẹ́ ìrìn-àjò ojú omi. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ píparí ìrìn-àjò náà mọ́.
- source_word: ἀπὸ Τύρου
  choice: láti Tírè
  rationale: ἀπό ń tọ́ka sí ibi tí wọ́n ti gbéra; “láti Tírè” túmọ̀ ọ́ ní tààrà.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: a dé Ptolemaisi
  rationale: καταντάω nínú ọ̀rọ̀ ìrìn-àjò túmọ̀ sí dídé ibi tí a ń lọ, εἰς sì samì sí ibi àfojúsùn.
- source_word: ἀσπασάμενοι
  choice: Lẹ́yìn tí a kí
  rationale: Ìṣe aláìlórúkọ aorist yìí ṣáájú ìdúró wọn; “Lẹ́yìn tí a kí” fi tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá.
- source_word: τοὺς ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: ἀδελφοί jẹ́ ọ̀pọ̀ akọ ní gírámà, ó sì lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀. Ọ̀rọ̀ inú ẹsẹ̀ pa ìrísí akọ mọ́, àlàyé ìtumọ̀ tó gbòòrò sì wà ní àlàyé ìsàlẹ̀.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: a dúró lọ́dọ̀ wọn fún ọjọ́ kan
  rationale: μένω túmọ̀ sí dídúró tàbí ṣíṣe àtìpó; παρ’ αὐτοῖς fi ìwà pẹ̀lú wọn hàn, ἡμέραν μίαν sì sọ iye àkókò náà.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοὺς ní àwùjọ àwọn Kristẹni
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ akọ ní ìrísí gírámà, ṣùgbọ́n ó lè jẹ́ orúkọ àwùjọ gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin. A pa ìrísí orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé àyè ìtumọ̀ rẹ̀ ní àlàyé ìsàlẹ̀ láì pinnu ohun tí orísun kò sọ ní pàtó.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “ìrìn-àjò lórí òkun” láti mú irú ìrìn-àjò náà hàn, a sì pa ìtẹnumọ́ “àwa” àti tẹ̀lé-tẹ̀lé àwọn ìṣe inú Gíríìkì mọ́ ní ọ̀nà àdánidá.
