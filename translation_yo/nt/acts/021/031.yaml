  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: yo
  text: Bí wọ́n sì ti ń wá láti pa á, ìròyìn dé ọ̀dọ̀ olórí ẹgbẹ́ ọmọ ogun pé gbogbo Jerúsálẹ́m wà nínú ìdàrúdàpọ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘wà nínú rúkèrúdò’ tàbí ‘ń rú sókè.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε
  choice: Bí wọ́n sì ti ń wá ọ̀nà
  rationale: Àkópọ̀ ọ̀rọ̀ olùṣe onítẹ̀síwájú yìí fi hàn pé ìgbìyànjú náà ń lọ lọ́wọ́ nígbà tí ìròyìn dé; ‘ń wá ọ̀nà’ jẹ́ Yorùbá àdánidá fún ìsapá tàbí ìgbìyànjú.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: láti pa á
  rationale: Ó túmọ̀ tààrà sí pípa ènìyàn, ‘láti pa á’ sì ṣe kedere, ó sì jẹ́ èdè Yorùbá ti òde òní.
- source_word: ἀνέβη φάσις
  choice: ìròyìn dé ọ̀dọ̀
  rationale: Gíríìkì ní àwòrán pé ìròyìn ‘gòkè lọ,’ bóyá sí ilé olódi; ní Yorùbá, ‘ìròyìn dé ọ̀dọ̀’ sọ ìtumọ̀ náà ní ọ̀nà àdánidá láìfi ìtọ́sọ́nà ibi tí kò ṣe pàtàkì sí i.
- source_word: τῷ χιλιάρχῳ
  choice: olórí
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọ̀gá ọmọ ogun Róòmù kan; ‘olórí’ ṣeé lóye ní kíkà, nígbà tí àlàyé ẹgbẹ́ ọmọ ogun tó tẹ̀ lé e ń sọ ipò rẹ̀ di mímọ̀.
- source_word: τῆς σπείρης
  choice: ẹgbẹ́ ọmọ ogun
  rationale: σπεῖρα jẹ́ ẹ̀ka ọmọ ogun Róòmù tí a ń pè ní cohort; ‘ẹgbẹ́ ọmọ ogun’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye, láìlo àyálò ọ̀rọ̀ imọ̀-ogun tí kò wọ́pọ̀.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: pé gbogbo Jerúsálẹ́m
  rationale: Èyí pa àkúnya ọ̀rọ̀ Gíríìkì mọ́, níbi tí orúkọ ìlú ti dúró fún ìlú àti àwọn ènìyàn inú rẹ̀.
- source_word: συγχύννεται
  choice: ti dàrú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé ìlú wà nínú ìdàrúdàpọ̀ tàbí rúkèrúdò. ‘Ti dàrú’ jẹ́ àdánidá, ó sì pa ìwọ̀n ìtumọ̀ náà mọ́ láìsọ irú ìdàrúdàpọ̀ náà pàtó ju orísun lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A yan ‘ẹgbẹ́ ọmọ ogun’ dípò àyálò ‘cohort’ kí ọ̀rọ̀ lè yé òǹkàwé lasán; ìtumọ̀ náà ṣì fi hàn pé olórí ẹgbẹ́ náà ni ẹni tí ìròyìn dé ọ̀dọ̀ rẹ̀. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
