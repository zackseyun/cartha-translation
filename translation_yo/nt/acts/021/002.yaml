  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: yo
  text: Nígbà tí a sì rí ọkọ̀ ojú omi kan tí ń kọjá lọ sí Fòníṣíà[a], a wọ ọkọ̀ náà, a sì ṣíkọ̀ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkọ̀ ojú omi kan tí ń lọ sí Fòníṣíà.” Ní ìtumọ̀ gangan, èdè Gíríìkì ṣàpèjúwe ọkọ̀ kan “tí ń kọjá lọ sí Fòníṣíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Nígbà tí a sì rí
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn yìí fi ìtẹ̀lé àkókò hàn ní Yorùbá àdánidá.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi kan
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọkọ̀ tí a fi ń rìn lórí òkun; ‘ọkọ̀ ojú omi’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: διαπερῶν
  choice: tí ń rékọjá
  rationale: Present participle yìí ṣàpèjúwe ìrìn ọkọ̀ náà kọjá lórí omi, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di kìkì ‘tí ń lọ sí’.
- source_word: εἰς Φοινίκην
  choice: lọ sí Fòníṣíà
  rationale: εἰς fi ibi tí ọkọ̀ náà ń lọ hàn; ‘lọ sí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi àfojúsùn.
- source_word: ἐπιβάντες
  choice: a wọ inú rẹ̀
  rationale: Nínú ọ̀rọ̀ ìrìn ojú omi, ἐπιβαίνω túmọ̀ sí gígun tàbí wíwọ ọkọ̀; fífi ọ̀rọ̀ arọ́pò-orúkọ ‘rẹ̀’ kún un mú kí ó ṣe kedere pé inú ọkọ̀ náà ni wọ́n wọ̀.
- source_word: ἀνήχθημεν
  choice: a sì ṣíkọ̀ lọ
  rationale: Nínú lílò ọ̀rọ̀ ojú omi, ἀνάγω túmọ̀ sí fífi ọkọ̀ sí ojú omi láti bẹ̀rẹ̀ ìrìn; ‘ṣíkọ̀ lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye, tó sì bá ìtàn ìrìn mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì mú ìtẹ̀lé àwọn ìṣe mẹ́tẹ̀ẹ̀ta—rí ọkọ̀, wọ ọkọ̀, àti ṣíkọ̀—hàn kedere.
