id: ACT.21.4
reference: Acts 21:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: yo
  text: Lẹ́yìn tí a rí àwọn ọmọ-ẹ̀yìn náà, a dúró níbẹ̀ fún ọjọ́ méje. Wọ́n ń sọ fún Pọ́ọ̀lù léraléra nípasẹ̀ Ẹ̀mí[a] pé kí ó má ṣe gòkè lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabi, “nípa Ẹ̀mí.” Gbólóhùn náà lè fi hàn pé Ẹ̀mí ló ṣí ìjìyà tí ń bọ̀ sí Pọ́ọ̀lù payá, àwọn ọmọ-ẹ̀yìn náà sì yọ ìpinnu láti inú rẹ̀ pé kò yẹ kí ó tẹ̀ síwájú lọ sí Jerúsálẹ́mù.
    reason: Ó fi aṣàyàn ìtumọ̀ náà hàn, ó sì pa àìdánilójú tó wà nínú bóyá Ẹ̀mí fúnra rẹ̀ ni ó fi òfin de ìrìn-àjò náà tàbí pé àwọn ọmọ-ẹ̀yìn ni wọ́n yọ ìpinnu náà láti inú ìfihàn nípa ìjìyà tó ń bọ̀ mọ́.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Nígbà tí a sì rí
  rationale: Ó fi ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn ní ọ̀nà tó bá èdè Yorùbá òde òní mu.
- source_word: μαθητάς
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής, ó sì pa ìtumọ̀ ẹni tó ń tẹ̀ lé olùkọ́ mọ́.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: a dúró níbẹ̀
  rationale: ἐπιμένω túmọ̀ sí dídúró tàbí ṣíṣẹ́ ní ibi kan, αὐτοῦ sì ń tọ́ka sí ibi náà.
- source_word: ἡμέρας ἑπτά
  choice: fún ọjọ́ méje
  rationale: Ó sọ iye àkókò tí wọ́n lò níbẹ̀; fífi “fún” kún un jẹ́ ti ẹ̀dá èdè Yorùbá.
- source_word: οἵτινες
  choice: Wọ́n
  rationale: Ó ń tọ́ka padà sí àwọn ọmọ-ẹ̀yìn náà; gbolohun tuntun jẹ́ kedere, ó sì dùn mọ́ etí ní Yorùbá.
- source_word: ἔλεγον
  choice: ń sọ ... léraléra
  rationale: Àkókò imperfect nínú Gíríìkì lè fi ìṣe tó ń bá a lọ tàbí tí a ń ṣe léraléra hàn.
- source_word: διὰ τοῦ πνεύματος
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Ó pa èrò ohun èlò tàbí aṣojú mọ́ láì pinnu bóyá Ẹ̀mí fúnra rẹ̀ ló pàṣẹ tàbí pé àwọn ọmọ-ẹ̀yìn ló yọ ìkìlọ̀ náà láti inú ohun tí Ẹ̀mí fi hàn.
- source_word: μὴ ἐπιβαίνειν
  choice: kí ó má ṣe gòkè lọ
  rationale: Ó sọ pé kí Pọ́ọ̀lù má lọ sí ibi náà; “gòkè lọ” tún bá ọ̀nà tí Ìwé Mímọ́ sábà máa ń sọ nípa lílọ sí Jerúsálẹ́mù mu.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: “Sí” ni àmì ìtọ́sọ́nà tó ṣe déédé fún ìrìn àjò lọ sí ibi kan.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ διὰ τοῦ πνεύματος ní ìbámu pẹ̀lú ìrìn àjò Pọ́ọ̀lù
  choice: nípasẹ̀ Ẹ̀mí
  alternative: Ẹ̀mí ló mú kí wọ́n sọ
  rationale: Ìtumọ̀ àkọ́kọ́ dúró sún mọ́ Gíríìkì, kò sì yanju ní tipátipá bí ọ̀rọ̀ náà ṣe bá Àwọn Ìṣe 19:21 àti 20:22-23 mu. Ó lè jẹ́ ìkìlọ̀ tí Ẹ̀mí fún wọn tàbí ìpinnu tí wọ́n yọ láti inú ohun tí Ẹ̀mí fi hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Pọ́ọ̀lù” àti “Jerúsálẹ́mù” gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ ní Yorùbá, a sì fi àmì ohùn sí ibi tó yẹ.
