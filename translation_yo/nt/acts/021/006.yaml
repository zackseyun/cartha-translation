  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: yo
  text: Lẹ́yìn tí a ti dágbére fún ara wa[a], a wọ inú ọkọ̀ ojú omi, àwọn náà sì padà sí ilé wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti kí ara wa.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìkíni nígbà ìpàdé tàbí nígbà ìyapa; àyíká ìlọkúrò yìí fi hàn pé dídágbére ni ó túmọ̀ sí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “sí àwọn ohun tàbí ibi tiwọn,” ìyẹn ni, sí ilé wọn tàbí sí ibi tiwọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: a ti dágbére fún ara wa
  rationale: Nínú àyíká ìlọkúrò yìí, gbólóhùn Gíríìkì náà túmọ̀ sí pé wọ́n dágbére fún ara wọn. ‘Dágbére fún ara wa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkíni ìyapa.
- source_word: ἐνέβημεν
  choice: a wọ inú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwọ inú tàbí gígun sínú ohun èlò ìrìn-àjò; ‘wọ inú’ bá ọkọ̀ ojú omi mu, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ọkọ̀ kékeré tàbí ọkọ̀ ńlá lórí omi. ‘Ọkọ̀ ojú omi’ jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò, tó sì yẹ fún ìrìn-àjò òkun nínú Ìṣe Àwọn Àpọ́sítélì.
- source_word: ὑπέστρεψαν
  choice: wọ́n padà
  rationale: Èyí ń pa ìtumọ̀ ìṣípòpadà tó rọrùn nínú ìtàn náà mọ́.
- source_word: εἰς τὰ ἴδια
  choice: sí ilé wọn
  rationale: Gbólóhùn náà jẹ́ àṣà Gíríìkì fún ibi tàbí ohun tí ó jẹ́ tiwọn; nínú àyíká yìí, ‘sí ilé wọn’ sọ ìtumọ̀ náà ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì tẹ̀ lé ìṣísẹ̀ ìtàn Gíríìkì. Àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
