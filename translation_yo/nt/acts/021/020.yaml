revisions:
- from: Nígbà tí wọ́n gbọ́ èyí, wọ́n yin Ọlọ́run lógo, wọ́n sì sọ fún un pé, “Arákùnrin, ìwọ rí iye ẹgbẹẹgbẹ̀rún lọ́nà ẹgbẹẹgbẹ̀rún[a] tí ó wà láàárín àwọn Júù[b] tí wọ́n ti gbàgbọ́, gbogbo wọn sì ní ìtara fún Òfin.”
  to: Nígbà tí wọ́n gbọ́ èyí, wọ́n yin Ọlọ́run lógo, wọ́n sì sọ fún un pé, “Arákùnrin, ìwọ rí bí àwọn Júù tí wọ́n ti gbàgbọ́ ṣe pọ̀ tó[a], gbogbo wọn sì ní ìtara fún Òfin.”
  rationale: The revised sentence replaces the opaque number phrase with a natural Yoruba rhetorical expression that preserves the Greek emphasis on a very large number. Footnote a retains the literal numerical possibility of μυριάδες. Footnote b is preserved as the legitimate lexical alternative for Ἰουδαίοις, but its anchor is not required in the running text because the main rendering remains “àwọn Júù.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:23:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle, glorifying God, direct address to Paul, Jewish believers, and their collective zeal for the Mosaic Law. However, “iye ẹgbẹẹgbẹ̀rún lọ́nà ẹgbẹẹgbẹ̀rún” is not an idiomatic or clear Yoruba representation of πόσαι μυριάδες and obscures the rhetorical sense, “how many/what vast numbers.”
  naturalness: The proposed revision uses an idiomatic Yoruba rhetorical construction, “bí ... ṣe pọ̀ tó,” followed by “ọ̀pọ̀ ẹgbẹẹgbẹ̀rún,” which clearly communicates a very large number. It avoids the unnatural repetitive construction in the draft.
  terminology: “Ọlọ́run,” “Júù,” “Òfin,” “ìtara,” and “tí wọ́n ti gbàgbọ́” are appropriate. Capitalized “Òfin” suitably identifies the Mosaic Law without importing interpretation. The geographic alternative “àwọn ará Jùdíà” is properly retained in a footnote.
  issues:
  - severity: medium
    issue: The expression “iye ẹgbẹẹgbẹ̀rún lọ́nà ẹgbẹẹgbẹ̀rún” is unclear and unidiomatic.
    rationale: It does not naturally express either the literal sense of μυριάδες (“tens of thousands”) or its idiomatic sense of a vast number. It may confuse readers rather than preserve the Greek ambiguity.
  - severity: low
    issue: Footnote a’s phrase “ẹgbẹẹgbẹ̀rún mẹ́wàá lọ́nà púpọ̀” is likewise unnatural.
    rationale: The alternative should state clearly that μυριάδες may refer to units of ten thousand or, more generally, a very large number.
  revised_text: Nígbà tí wọ́n gbọ́ èyí, wọ́n yin Ọlọ́run lógo, wọ́n sì sọ fún un pé, “Arákùnrin, ìwọ rí bí àwọn Júù tí wọ́n ti gbàgbọ́ ṣe pọ̀ tó[a], gbogbo wọn sì ní ìtara fún Òfin.”
  revised_footnotes:
  - marker: a
    text: Lítírásọ, “iye ẹgbẹ̀rún mẹ́wàá mélòó kan.” Ọ̀rọ̀ Gíríìkì μυριάδες lè túmọ̀ sí àwọn ẹyọ ẹgbẹ̀rún mẹ́wàá, tàbí sí iye tí ó pọ̀ gidigidi ní gbogbogbòò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ará Jùdíà,” bí a bá lóye ọ̀rọ̀ náà gẹ́gẹ́ bí ìtọ́kasí agbègbè dípò ẹ̀yà tàbí ẹ̀sìn.
    reason: lexical_alternative
