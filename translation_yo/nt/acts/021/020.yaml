id: ACT.21.20
reference: Acts 21:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí, wọ́n yin Ọlọ́run lógo, wọ́n sì sọ fún un pé, “Arákùnrin, ìwọ rí bí àwọn Júù tí wọ́n ti gbàgbọ́ ṣe pọ̀ tó[a], gbogbo wọn sì ní ìtara fún Òfin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lítírásọ, “iye ẹgbẹ̀rún mẹ́wàá mélòó kan.” Ọ̀rọ̀ Gíríìkì μυριάδες lè túmọ̀ sí àwọn ẹyọ ẹgbẹ̀rún mẹ́wàá, tàbí sí iye tí ó pọ̀ gidigidi ní gbogbogbòò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist náà fi àkókò hàn; ‘èyí’ ń tọ́ka sí ìròyìn inú ẹsẹ tó ṣáájú, ó sì mú Yorùbá dun bí èdè àdánidá.
- source_word: ἐδόξαζον
  choice: wọ́n yin Ọlọ́run lógo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ògo fún Ọlọ́run, ó sì pa ìwọ̀n ẹ̀kọ́-ìgbàgbọ́ δοξάζω mọ́.
- source_word: Θεωρεῖς
  choice: ìwọ rí
  rationale: Ìṣe ìsinsìnyí náà ń pe Pọ́ọ̀lù láti kíyè sí ipò tó hàn gbangba; ‘ìwọ rí’ bá ìlò Yorùbá mu.
- source_word: ἀδελφέ
  choice: Arákùnrin
  rationale: Ọ̀rọ̀ ìpè ẹnì kan ni, tí a sọ sí Pọ́ọ̀lù ọkùnrin.
- source_word: πόσαι μυριάδες
  choice: iye ẹgbẹẹgbẹ̀rún lọ́nà ẹgbẹẹgbẹ̀rún
  rationale: Ó sọ iye tó pọ̀ lọ́pọ̀lọpọ̀ ní èdè Yorùbá láì fi dandan sọ pé ẹyọ ẹgbẹ̀rún mẹ́wàá gan-an ni; àlàyé ìtumọ̀ pàtó wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: láàárín àwọn Júù
  rationale: Àyíká ọ̀rọ̀ náà tẹnu mọ́ àwọn Júù gẹ́gẹ́ bí ènìyàn àti ẹgbẹ́ ẹ̀sìn; ìtumọ̀ agbègbè ‘àwọn ará Jùdíà’ ṣì ṣeé ṣe, a sì tọ́ka sí i ní àlàyé ìsàlẹ̀.
- source_word: τῶν πεπιστευκότων
  choice: tí wọ́n ti gbàgbọ́
  rationale: Perfect participle náà fi hàn pé wọ́n ti wá sí ìgbàgbọ́, wọ́n sì dúró nínú ipò náà.
- source_word: ζηλωταὶ τοῦ νόμου
  choice: ní ìtara fún Òfin
  rationale: ‘Ìtara’ pa agbára ζηλωταί mọ́, ‘Òfin’ sì tọ́ka sí Òfin Mósè nínú àyíká yìí.
- source_word: ὑπάρχουσιν
  choice: ní
  rationale: Nínú Yorùbá, gbólóhùn ‘ní ìtara’ jẹ́ ọ̀nà àdánidá láti sọ iṣẹ́ copular ὑπάρχουσιν.
theological_decisions:
- issue: Ìtọ́kasí ἐν τοῖς Ἰουδαίοις
  choice: láàárín àwọn Júù
  alternative: láàárín àwọn ará Jùdíà
  rationale: Àyíká náà ń sọ nípa àwọn onígbàgbọ́ Júù àti ìtara wọn fún Òfin Mósè, nítorí náà ìdánimọ̀ ẹ̀yà àti ẹ̀sìn ṣe pàtàkì ju ibi tí wọ́n ń gbé lọ; síbẹ̀, ìtumọ̀ agbègbè kò ṣeé yọ kúrò pátápátá.
- issue: Agbára μυριάδες
  choice: ẹgbẹẹgbẹ̀rún lọ́nà ẹgbẹẹgbẹ̀rún
  alternative: ẹgbẹẹgbẹ̀rún mẹ́wàá lọ́nà púpọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ẹyọ ẹgbẹ̀rún mẹ́wàá tàbí, ní gbogbogbòò, iye tí ó pọ̀ gidigidi. Àyànfẹ́ náà pa àìdánilójú yìí mọ́ ní ọ̀nà Yorùbá tó yéni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Òfin’ fún Òfin Mósè, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
