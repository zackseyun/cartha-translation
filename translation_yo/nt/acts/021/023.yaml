revisions:
- from: 'Nítorí náà, ṣe ohun tí àwa sọ fún ọ yìí: àwa ní ọkùnrin mẹ́rin tí wọ́n wà lábẹ́ ẹ̀jẹ́ tí àwọn fúnra wọn jẹ́.[a][b]'
  to: 'Nítorí náà, ṣe ohun tí a sọ fún ọ: a ní ọkùnrin mẹ́rin tí wọ́n ní ẹ̀jẹ́ kan lára wọn.[a][b]'
  rationale: A tún gbolohun ìkẹyìn ṣe sí ọ̀nà Yorùbá tó dára—‘ní ẹ̀jẹ́ kan lára wọn’—láti fi ipò ìlérí tí ó wà lórí àwọn ọkùnrin náà hàn. A yọ ìtẹnumọ́ ‘àwa’ kúrò nínú gbolohun àkọ́kọ́ nítorí pé kò hàn ní pàtó nínú λέγομεν, bí ó tilẹ̀ jẹ́ pé ‘a ní’ ṣi ń tú εἰσὶν ἡμῖν ní ti ẹ̀dá. A pa àìdánilójú ti irú ẹ̀jẹ́ náà mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:23:31Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìsopọ̀ ìdí-ọba οὖν, àṣẹ ποίησον, àti ‘ọkùnrin mẹ́rin.’ Ṣùgbọ́n gbolohun ‘tí àwọn fúnra wọn jẹ́’ kò sọ ἀφ’ ἑαυτῶν ní Yorùbá tó péye. Àpẹẹrẹ ‘ní ẹ̀jẹ́ kan lára wọn’ ń mú ìtumọ̀ ‘having a vow upon themselves’ hàn dáadáa láì sọ irú ẹ̀jẹ́ náà di Nasírì ní pàtó.
  naturalness: ‘Tí wọ́n ní ẹ̀jẹ́ kan lára wọn’ jẹ́ ìlò Yorùbá ìwé-mímọ́ tó mọ́, tó sì ṣeé lóye nínú àyíká ọrọ̀ náà. Ó dára ju ‘wà lábẹ́ ẹ̀jẹ́ tí àwọn fúnra wọn jẹ́,’ èyí tí kò rọrùn ní gírámà Yorùbá.
  terminology: A pa ‘ẹ̀jẹ́’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìlérí/ìbúra mímọ́ nínú ìlò ìwé-mímọ́ Yorùbá; a kò yẹ kí a rọ́pò rẹ̀ pẹ̀lú ‘ẹ̀jẹ̀’ (ìyẹn blood). Àlàyé ẹsẹ gbọdọ̀ ṣàlàyé ìtumọ̀ Gíríìkì láì sọ pé ẹsẹ náà fi irú ẹ̀jẹ́ Nasírì múlẹ̀.
