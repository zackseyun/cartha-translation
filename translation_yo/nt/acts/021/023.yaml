source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: yo
  text: 'Nítorí náà, ṣe ohun tí a sọ fún ọ: a ní ọkùnrin mẹ́rin tí wọ́n ní ẹ̀jẹ́ kan lára wọn.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ti ṣe ìlérí kan.” Ní ti gidi, èdè Gíríìkì sọ pé, “tí wọ́n ní ẹ̀jẹ́ kan.”
    reason: lexical_alternative
  - marker: b
    text: Àyíká ọ̀rọ̀ lè fi hàn pé ó jẹ́ ẹ̀jẹ́ irú ti Nasírì, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ pé “ẹ̀jẹ́” nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Nítorí náà ... yìí
  rationale: οὖν fi àbájáde ìrònú hàn, nígbà tí τοῦτο darapọ̀ mọ́ àṣẹ tó tẹ̀ lé e; ọ̀nà yìí jẹ́ Yorùbá àdánidá.
- source_word: ποίησον
  choice: ṣe
  rationale: Àṣẹ aorist náà jẹ́ àṣẹ tààrà; “ṣe” ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ὅ σοι λέγομεν
  choice: ohun tí àwa sọ fún ọ
  rationale: Ó pa àkóónú àṣẹ mọ́, ó sì mú “àwa” hàn gẹ́gẹ́ bí ẹni tí ọ̀rọ̀-ìṣe náà tọ́ka sí.
- source_word: εἰσὶν ἡμῖν
  choice: àwa ní
  rationale: Ìkọ̀lé wíwà pẹ̀lú dative jẹ́ ọ̀nà Gíríìkì láti sọ ohun tí ẹnì kan ní; “àwa ní” jẹ́ Yorùbá tó rọrùn.
- source_word: ἄνδρες τέσσαρες
  choice: ọkùnrin mẹ́rin
  rationale: ἀνήρ tọ́ka sí àwọn ọkùnrin àgbà, “ọkùnrin mẹ́rin” sì pa akọ-ǹkan náà mọ́.
- source_word: εὐχὴν ἔχοντες
  choice: tí wọ́n wà lábẹ́ ẹ̀jẹ́
  rationale: Ó fi ipò tí ẹ̀jẹ́ náà dè wọ́n sí hàn ní Yorùbá àdánidá, láì sọ irú ẹ̀jẹ́ náà ní pàtó.
- source_word: ἀφ’ ἑαυτῶν
  choice: tí àwọn fúnra wọn jẹ́
  rationale: Ó sọ pé ẹ̀jẹ́ náà jẹ́ ti àwọn ọkùnrin náà fúnra wọn, láì fi ìtumọ̀ imọ̀-ẹ̀sìn míì kún un.
theological_decisions:
- issue: Irú ẹ̀jẹ́ tí àwọn ọkùnrin náà jẹ́
  choice: ẹ̀jẹ́
  alternative: ẹ̀jẹ́ Nasírì
  rationale: Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè tọ́ka sí ẹ̀jẹ́ irú ti Nasírì, ẹsẹ yìí fúnra rẹ̀ sọ εὐχή, ìyẹn “ẹ̀jẹ́,” nìkan; a kò fi ohun tí kò ṣe kedere nínú ẹsẹ náà kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn síbi tí ó bá yẹ, a sì yàgò fún èdè ẹ̀kọ́ ìsìn tó lè sọ ohun tó ju Gíríìkì lọ.
