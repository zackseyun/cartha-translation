translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pín gbólóhùn Gíríìkì gígùn náà sí gbólóhùn méjì fún kíkà tí ó rọrùn. Àwọn àmì ìsàlẹ̀ ni a so mọ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé, dípò títẹ̀lé ìtòlẹ́sẹẹsẹ àmì tí kò bá àkóónú wọn mu nínú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì.
