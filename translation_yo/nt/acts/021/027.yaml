source:
  edition: SBLGNT
  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: yo
  text: Nígbà tí ọjọ́ méje náà fẹ́rẹ̀ẹ́ dé òpin, àwọn Júù láti Éṣíà rí Pọ́ọ̀lù nínú tẹ́ńpìlì[c], wọ́n sì mú gbogbo ogunlọ́gọ̀ náà dà rú[a], wọ́n sì na ọwọ́ mú un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ru gbogbo ogunlọ́gọ̀ náà sókè.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ rírú ogunlọ́gọ̀ sókè tàbí dídà á rú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n gbá a mú.” Gbólóhùn náà túmọ̀ sí mímú ẹnì kan ní ipá.
    reason: lexical_alternative
  - marker: c
    text: “Tẹ́ńpìlì” níhìn-ín túmọ̀ sí àgbègbè àti àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nígbà tí
  rationale: Ó fi àkókò tí ìṣẹ̀lẹ̀ náà bẹ̀rẹ̀ hàn ní Yorùbá àdánidá; δέ kò nílò ọ̀rọ̀ ọ̀tọ̀ nínú gbólóhùn yìí.
- source_word: ἔμελλον ... συντελεῖσθαι
  choice: fẹ́rẹ̀ẹ́ parí
  rationale: Ó mú ìtumọ̀ pé òpin ọjọ́ náà ti sún mọ́lé àti pé àkókò náà ń dé ìparí rẹ̀.
- source_word: αἱ ἑπτὰ ἡμέραι
  choice: ọjọ́ méje náà
  rationale: Ìtumọ̀ tààrà tí kò fi àlàyé nípa àṣà ìwẹ̀nùmọ́ kún ọ̀rọ̀ orísun.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: àwọn Júù tí ó wá láti Éṣíà
  rationale: Ó sọ ibi tí wọ́n ti wá ní kedere, láì mú kí òǹkàwé rò pé gbogbo ilẹ̀ Áṣíà òde òní ni a ń tọ́ka sí.
- source_word: θεασάμενοι αὐτὸν
  choice: rí Pọ́ọ̀lù
  rationale: Orúkọ Pọ́ọ̀lù mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá, láì yí ẹni tí ọ̀rọ̀ náà dá lé lórí padà.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: Ọ̀rọ̀ yìí rọrùn fún òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé gbogbo àgbègbè tẹ́ńpìlì ni ἱερόν túmọ̀ sí.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: Wọ́n ru gbogbo ogunlọ́gọ̀ náà sókè
  rationale: Ó bá ipò rúdurùdu ogunlọ́gọ̀ mu, ó sì pa ìtumọ̀ ìrúkèrúdò tàbí ìdàrúdàpọ̀ mọ́ ní ọ̀nà àdánidá.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: wọ́n sì gbé ọwọ́ lé e
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, níbi tí gbígbé ọwọ́ lé ẹni túmọ̀ sí mímú un ní ipá.
