id: ACT.21.19
reference: Acts 21:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: yo
  text: Lẹ́yìn tí ó kí wọn, ó ń ròyìn fún wọn ní ọ̀kọ̀ọ̀kan àwọn ohun tí Ọlọ́run ti ṣe láàárín àwọn aláì-Júù[b] nípasẹ̀ iṣẹ́ ìránṣẹ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ṣàlàyé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríròyìn tàbí ṣíṣàlàyé ní ẹ̀kúnrẹ́rẹ́, ní ẹyọ kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láàárín àwọn orílẹ̀-èdè.” Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Lẹ́yìn tí ó kí wọn
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ aorist yìí tọ́ka sí ìṣe tí ó ṣáájú ìròyìn náà; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe mọ́.
- source_word: ἐξηγεῖτο
  choice: ó sì bẹ̀rẹ̀ sí í ròyìn
  rationale: Imperfect náà fi ìṣe tí ń lọ lọ́wọ́ hàn. ‘Bẹ̀rẹ̀ sí í ròyìn’ mú ìròyìn gígùn tí Pọ́ọ̀lù ń ṣe jáde láìfi ìtumọ̀ àlàyé tí kò pọndandan kún un.
- source_word: καθ’ ἓν ἕκαστον
  choice: ní ọ̀kọ̀ọ̀kan
  rationale: 'Ó pa agbára ìtumọ̀ distributive mọ́: Pọ́ọ̀lù sọ àwọn ohun náà ní ẹyọ kọ̀ọ̀kan, kì í ṣe ní ṣókí lásán.'
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: àwọn ohun tí Ọlọ́run ti ṣe
  rationale: Ìtumọ̀ yìí sọ Ọlọ́run di ẹni tó ṣe àwọn ìṣe náà, gẹ́gẹ́ bí Gíríìkì ṣe sọ ní tààràtà, ó sì bá ìròyìn ohun tí ó ti ṣẹlẹ̀ mu.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ Ìṣe àwọn Aposteli, ἔθνη ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìpín òṣèlú.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: nípasẹ̀ iṣẹ́ ìránṣẹ́ rẹ̀
  rationale: διά pẹ̀lú genitive fi ọ̀nà tàbí ohun èlò hàn. ‘Iṣẹ́ ìránṣẹ́’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ διακονία níbí, láìsọ ọ́ di ipò ṣọ́ọ̀ṣì kan pàtó.
theological_decisions:
- issue: Ẹni tó ṣe iṣẹ́ nínú ìròyìn iṣẹ́ míṣọ́nárì Pọ́ọ̀lù
  choice: Ọlọ́run ni a gbé kalẹ̀ gẹ́gẹ́ bí ẹni tó ṣe àwọn ohun náà; iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù ni ọ̀nà tí Ọlọ́run gbà ṣe wọ́n.
  alternative: Pọ́ọ̀lù ń ròyìn ohun tí òun fúnra rẹ̀ ṣe láàárín àwọn Kèfèrí.
  rationale: ὁ θεὸς ni subject ọ̀rọ̀-ìṣe ἐποίησεν, nígbà tí διὰ τῆς διακονίας αὐτοῦ fi iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù hàn gẹ́gẹ́ bí ohun èlò. Ìtumọ̀ náà pa iṣẹ́ Ọlọ́run àti ipa ìránṣẹ́ ènìyàn mọ́ láìdín èyíkéyìí kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, ṣùgbọ́n ní ọ̀nà tí òǹkàwé òde òní lè lóye. ‘Kèfèrí’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ fún àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ rẹ̀ ṣe kedere.
