revisions:
- from: Lẹ́yìn tí ó kí wọn, ó sì bẹ̀rẹ̀ sí í ròyìn ní ọ̀kọ̀ọ̀kan[a] àwọn ohun tí Ọlọ́run ti ṣe láàárín àwọn Kèfèrí[b] nípasẹ̀ iṣẹ́ ìránṣẹ́ rẹ̀.
  to: Lẹ́yìn tí ó kí wọn, ó ń ròyìn fún wọn ní ọ̀kọ̀ọ̀kan àwọn ohun tí Ọlọ́run ti ṣe láàárín àwọn aláì-Júù[b] nípasẹ̀ iṣẹ́ ìránṣẹ́ rẹ̀.[a]
  rationale: Àtúnṣe náà yọ ìfikún ‘bẹ̀rẹ̀ sí í,’ nítorí imperfect kò béèrè fún un, ó sì lo ‘ó ń ròyìn’ láti fi ìṣe ìròyìn tí ń tẹ̀síwájú hàn. A tún ṣètò ọ̀rọ̀ distributive náà ní Yorùbá tó rọrùn, a sì rọ́pò ‘Kèfèrí’ pẹ̀lú ‘àwọn aláì-Júù’ láti pa ìtọ́kasí ìtàn-ọrọ̀ ἔθνη mọ́ ní kedere. A ti gbe àmì akọ́sọ a sí ibi ‘iṣẹ́ ìránṣẹ́ rẹ̀,’ nítorí ni Gíríìkì ἐξηγεῖτο ni ó ní ìyàtọ̀ lexical tí ìsàlẹ̀-ojú-ìwé náà ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:23:24Z'
