id: ACT.21.18
reference: Acts 21:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: yo
  text: Ní ọjọ́ kejì[a], Paulu bá wa wọlé lọ sọ́dọ̀ Jakọbu, gbogbo àwọn alàgbà sì wà níbẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọjọ́ tí ó tẹ̀ lé e.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo àwọn alàgbà sì wá” tàbí “gbogbo àwọn alàgbà sì dé.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ dídé wọn tàbí wíwà wọn níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Ní ọjọ́ kejì
  rationale: Gbólóhùn Gíríìkì yìí jẹ́ ọ̀nà àdálò tí ó túmọ̀ sí ọjọ́ tí ó tẹ̀ lé e; “Ní ọjọ́ kejì” jẹ́ Yorùbá àdánidá tí ó ṣe kedere.
- source_word: εἰσῄει
  choice: wọlé lọ
  rationale: Ọ̀rọ̀-ìṣe náà ń fi ìrìn wọ inú ibi kan hàn. “Wọlé lọ” pa ìtọ́sọ́nà yẹn mọ́ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: σὺν ἡμῖν
  choice: bá wa
  rationale: Ó ń tọ́ka sí pé Paulu àti àwọn olùkọ̀wé náà jọ lọ; “bá wa” ni ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún ìbákẹ́gbẹ́.
- source_word: πρὸς Ἰάκωβον
  choice: sọ́dọ̀ Jakọbu
  rationale: πρός pẹ̀lú ẹ̀sùn-orúkọ ń fi ìlọ sí ọ̀dọ̀ ẹni kan hàn. “Sọ́dọ̀ Jakọbu” jẹ́ àdánidá, kò sì fi ìdánimọ̀ míì tí ẹsẹ náà kò sọ kún un.
- source_word: πάντες τε
  choice: gbogbo … sì
  rationale: “Gbogbo” mú πάντες jáde, “sì” sì so gbólóhùn kejì mọ́ ti àkọ́kọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: παρεγένοντο
  choice: wà níbẹ̀
  rationale: Ọ̀rọ̀ náà lè tẹnu mọ́ dídé tàbí wíwà níbẹ̀. Ní àyíká ìpàdé yìí, “wà níbẹ̀” jẹ́ kedere, a sì pa àṣàyàn ‘wá/dé’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οἱ πρεσβύτεροι
  choice: àwọn alàgbà
  rationale: “Àwọn alàgbà” pa ìtumọ̀ àwọn aṣáájú tí a mọ̀ sílẹ̀ nínú ìjọ mọ́, láìgbé ètò ẹ̀sìn ẹgbẹ́ kan wọ inú ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìdánimọ̀ àti ipa Ἰάκωβον
  choice: Jakọbu nìkan, láìfi àpèjúwe míì kún orúkọ náà.
  alternative: Jakọbu arákùnrin Olúwa; Jakọbu aṣáájú ìjọ Jerusalẹmu.
  rationale: Ẹsẹ náà dárúkọ Jakọbu láìsọ ìdánimọ̀ tàbí ipò rẹ̀ síwájú sí i; fífi bẹ́ẹ̀ kún un yóò jẹ́ àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì.
- issue: Ìtumọ̀ οἱ πρεσβύτεροι nínú ìjọ
  choice: àwọn alàgbà
  alternative: àwọn presbyteri; àwọn aṣáájú ìjọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tí a dá mọ̀ nínú ìjọ Jerusalẹmu, ṣùgbọ́n “àwọn alàgbà” pa ìtumọ̀ rẹ̀ mọ́ láìfi ètò ìjọ ẹgbẹ́ kan pàtó lé e lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn síbi tí ó bá jẹ́ àdánidá, a sì lo “Paulu,” “Jakọbu,” àti “àwọn alàgbà” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì Yorùbá tí ó ṣe kedere láìgba ẹ̀kọ́ ẹgbẹ́ ìjọ kan wọlé.
