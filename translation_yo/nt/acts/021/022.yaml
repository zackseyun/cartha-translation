  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: yo
  text: Ǹjẹ́, kí ni a ó ṣe? Dájúdájú, wọn yóò gbọ́ pé o ti dé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe rí gan-an, “Ǹjẹ́, kí ni ó jẹ́?” Àṣà ọ̀rọ̀ Gíríìkì náà ń béèrè ohun tí ó yẹ kí a ṣe níwájú ipò náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Ǹjẹ́, kí ni a ó ṣe?
  rationale: Ní ti gírámà, gbólóhùn náà túmọ̀ sí ‘Ǹjẹ́, kí ni ó jẹ́?’ ṣùgbọ́n nínú àyíká ọ̀rọ̀, ó jẹ́ ìbéèrè nípa ohun tí ó yẹ kí wọ́n ṣe nítorí ipò náà. ‘Kí ni a ó ṣe?’ sọ ipa ọ̀rọ̀ náà jáde ní Yorùbá àdánidá láìtúmọ̀ rẹ̀ jù.
- source_word: πάντως
  choice: Dájúdájú
  rationale: Ọ̀rọ̀ náà ń tẹnumọ́ pé ohun tí a sọ tẹ̀ lé e yóò ṣẹlẹ̀ láìsí àní-àní.
- source_word: ἀκούσονται
  choice: wọn yóò gbọ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní ìtumọ̀ aláṣẹ níbí. Kókó-ọrọ̀ púpọ̀ rẹ̀ kò hàn gbangba nínú ẹsẹ yìí, nítorí náà a pa àìsọ ẹni pàtó mọ́ pẹ̀lú ‘wọn,’ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe tọ́ka sí.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàgbékalẹ̀ àkóónú ohun tí wọn yóò gbọ́, kì í ṣe ìdí ohun kan.
- source_word: ἐλήλυθας
  choice: o ti dé
  rationale: Àkókò pípé ọ̀rọ̀-ìṣe náà ń fi hàn pé ẹni náà dé, ó sì wà níbẹ̀ báyìí. ‘O ti dé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa abajade tó ń bá a lọ mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, èdè òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ǹjẹ́’ so ìbéèrè náà mọ́ ọ̀rọ̀ tó ṣáájú; ‘a ó ṣe’ jẹ́ àdánidá, ó sì yẹ fún ìjíròrò àwọn aṣáájú.
