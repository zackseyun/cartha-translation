source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: yo
  text: Nígbà tí kò sì gbà kí a yí i lọ́kàn padà[a], a dákẹ́, a sì wí pé, “Kí ìfẹ́ Olúwa ṣẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí a kò sì lè yí i lọ́kàn padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Nígbà tí kò sì gbà láti yí ọkàn rẹ̀ padà
  rationale: Gbólóhùn yìí fi ipò tí Pọ́ọ̀lù kò tẹ̀ lé ẹ̀bẹ̀ wọn hàn. ‘Kò gbà láti yí ọkàn rẹ̀ padà’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ pé wọn kò lè yí i lọ́kàn padà mọ́, láì túmọ̀ ọ́ sí pé kò fetí sí wọn rárá.
- source_word: ἡσυχάσαμεν
  choice: a dákẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ṣíwọ́ fífi ọ̀rọ̀ náà lé e lórí, wọ́n sì dákẹ́. Aṣàyàn yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: εἰπόντες
  choice: a sì wí pé
  rationale: Ìṣe alábàáṣiṣẹ́ náà ni a túmọ̀ sí ọ̀rọ̀-ìṣe tí a so mọ́ ìṣe pàtàkì, èyí tí ó jẹ́ àdánidá ní Yorùbá.
- source_word: Τοῦ κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó níyì fún κύριος. A kò sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní kedere ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: τὸ θέλημα
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ níbí túmọ̀ sí ohun tí Olúwa fẹ́ tàbí pinnu, gẹ́gẹ́ bí θέλημα ṣe rí nínú gbólóhùn ìtẹríba yìí.
- source_word: γινέσθω
  choice: Kí ... ṣẹ
  rationale: Ìṣètò ‘Kí ... ṣẹ’ fi àṣẹ ẹni-kẹta àti ìtẹríba sí ohun tí Olúwa fẹ́ hàn lọ́nà Yorùbá tó ṣàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni yíyan tó yẹ jù fún κύριος nínú àyíká ẹ̀sìn yìí. Ó ṣeé ṣe kí ó tọ́ka sí Jésù Olúwa nínú ìtàn náà, ṣùgbọ́n a fi ìtọ́kasí náà sílẹ̀ ní ìwọ̀n tí Gíríìkì fi hàn.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘A dákẹ́’ jẹ́ kúkúrú, ó sì fi hàn pé wọ́n ṣíwọ́ títẹ̀ síwájú pẹ̀lú ẹ̀bẹ̀ wọn.
