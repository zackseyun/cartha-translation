  terminology: ‘kọ Mósè sílẹ̀’ pa ìfẹ̀sùn ἀποστασίαν ἀπὸ Μωϋσέως mọ́ ní ti ìtumọ̀ ọ̀rọ̀ aṣojú. ‘kọ ... ní ilà’ jẹ́ ọ̀nà Yorùbá tó yege fún ìkọlà, ó sì fi τέκνα silẹ̀ gẹ́gẹ́ bí ‘àwọn ọmọ’ dípò kí ó dín un kù sí ọmọkùnrin. ‘Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì tí a mọ̀ dáadáa fún àwọn tí kì í ṣe Júù nínú àyíká yìí.
