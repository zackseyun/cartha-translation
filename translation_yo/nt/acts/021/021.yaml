  to: Ṣùgbọ́n a ti sọ fún wọn nípa rẹ pé ìwọ ń kọ́ gbogbo àwọn Júù tí ń gbé láàárín àwọn Kèfèrí pé kí wọ́n kọ Mósè sílẹ̀[a][b], nípa sísọ fún wọn pé kí wọ́n má ṣe kọ àwọn ọmọ wọn ní ilà, kí wọ́n má sì rìn ní ìbámu pẹ̀lú àwọn àṣà.[c]
