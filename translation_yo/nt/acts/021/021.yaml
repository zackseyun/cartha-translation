id: ACT.21.21
reference: Acts 21:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: yo
  text: Ṣùgbọ́n a ti sọ fún wọn nípa rẹ pé ìwọ ń kọ́ gbogbo àwọn Júù tí ń gbé láàárín àwọn Kèfèrí pé kí wọ́n kọ Mósè sílẹ̀[a][b], nípa sísọ fún wọn pé kí wọ́n má ṣe kọ àwọn ọmọ wọn ní ilà, kí wọ́n má sì rìn ní ìbámu pẹ̀lú àwọn àṣà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé ìwọ ń kọ́ wọn ní ìṣọ̀tẹ̀ sí Mósè.” Ọ̀rọ̀ Gíríìkì ἀποστασία túmọ̀ sí yíyí padà kúrò lọ́dọ̀ ẹnì kan tàbí kíkọ ohun kan sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Mósè” níhìn-ín dúró fún òfin Mósè àti àwọn àṣà àwọn Júù tí wọ́n jogún.
    reason: cultural_note
  - marker: c
    text: Tàbí, “kí wọ́n má sì máa gbé ní ìbámu pẹ̀lú àwọn àṣà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: a ti sọ fún wọn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ohun tí a ti fi ẹnu sọ fún wọn nípa Pọ́ọ̀lù; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìṣe aláìlórúkọ ti Gíríìkì mọ́.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: kí wọn kọ Mósè sílẹ̀
  rationale: Ó fi agbára ẹ̀sùn náà hàn gẹ́gẹ́ bí yíyí padà kúrò lọ́dọ̀ Mósè, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ onímọ̀ ní pàtó.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: gbogbo àwọn Júù tí ń gbé láàárín àwọn Kèfèrí
  rationale: Ó mú kí ipo àwọn Júù tí wọ́n ń gbé káàkiri láàárín àwọn orílẹ̀-èdè aláìní-Júù ṣe kedere ní Yorùbá.
- source_word: λέγων
  choice: ní sísọ fún wọn
  rationale: Apá yìí ṣàlàyé ohun tí ẹ̀kọ́ tí a fi kan Pọ́ọ̀lù ní ẹ̀sùn ní nínú.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: kí wọn má ṣe kọ àwọn ọmọ wọn ní ilà
  rationale: “Kọ ... ní ilà” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìkọlà; “àwọn ọmọ wọn” sì tẹ̀lé τέκνα láìdín un kù sí “ọmọkùnrin” nìkan.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: kí wọn má sì rìn ní ìbámu pẹ̀lú àwọn àṣà náà
  rationale: Ó pa àkàwé “rìn” ti περιπατεῖν mọ́, nígbà tí “ní ìbámu pẹ̀lú” mú ìtumọ̀ ìwà ìgbésí ayé rẹ̀ ṣe kedere.
theological_decisions:
- issue: Irú ẹ̀sùn tí a fi kan Pọ́ọ̀lù nípa Mósè
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ẹ̀sùn pé ó ń kọ́ wọn láti “kọ Mósè sílẹ̀,” láìfi hàn pé akọ̀wé fọwọ́ sí òtítọ́ ẹ̀sùn náà.
  alternative: “pé ìwọ ń kọ́ wọn ní ìṣọ̀tẹ̀ sí Mósè” tàbí “láti kọ òfin Mósè sílẹ̀”
  rationale: Ẹsẹ̀ náà ń ròyìn ohun tí àwọn ẹlòmíràn ti gbọ́ nípa Pọ́ọ̀lù; kì í ṣe ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ ti Lúùkù. Ìtumọ̀ náà pa agbára àti àìdánilójú ẹ̀sùn náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Kèfèrí” jẹ́ ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ fún àwọn tí kì í ṣe Júù; “rìn ní ìbámu pẹ̀lú” pa àkàwé orísun mọ́, ẹsẹ̀ ìsàlẹ̀ sì fúnni ní ọ̀nà Yorùbá tó túbọ̀ ṣàlàyé ìtumọ̀ rẹ̀.
