id: ACT.21.34
reference: Acts 21:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan nínú ọ̀pọ̀ ènìyàn ń ké ohun kan, àwọn mìíràn sì ń ké ohun mìíràn. Níwọ̀n bí kò ti lè mọ ohun tó dájú[a] nítorí ìdàrúdàpọ̀ náà, ó pàṣẹ pé kí wọ́n mú un lọ sínú ibùdó àwọn ọmọ ogun Róòmù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òtítọ́ ọ̀ràn náà” tàbí “ohun tí ó dájú.”
    reason: lexical_alternative
  - marker: b
    text: “Ibùdó àwọn ọmọ ogun Róòmù” jẹ́ ibi tí àwọn ọmọ ogun Róòmù ń gbé; ó ṣeé ṣe kí ó wà nínú ilé olódi tí ó so mọ́ agbègbè tẹ́ńpìlì náà.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: àwọn kan nínú ọ̀pọ̀ ènìyàn ń ké ohun kan, àwọn mìíràn sì ń ké ohun mìíràn
  rationale: Ó pa ìyàtọ̀ alápín ἄλλοι…ἄλλο τι mọ́, ó sì fi àkókò ìṣe tí ń lọ ní ἐπεφώνουν hàn pẹ̀lú ‘ń ké.’ ‘Ọ̀pọ̀ ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ὄχλος láì fi ìtumọ̀ ‘ẹgbẹ́ oníjàgídíjàgan’ kún un.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Nígbà tí kò lè mọ
  rationale: Gbólóhùn genitive absolute náà sọ ipò àti ìdí tí ó yọrí sí àṣẹ tó tẹ̀ lé e; ‘kò lè mọ’ jẹ́ ọ̀nà kedere àti àdánidá ní Yorùbá.
- source_word: τὸ ἀσφαλές
  choice: ohun tó dájú
  rationale: Ó pa ìtumọ̀ ohun tí ó dájú tàbí tí a lè gbẹ́kẹ̀ lé mọ́, láì dín ìtumọ̀ náà kù sí ‘òtítọ́’ nìkan.
- source_word: διὰ τὸν θόρυβον
  choice: nítorí ariwo rúdurùdu náà
  rationale: θόρυβος nínú àyíká yìí túmọ̀ sí ariwo pẹ̀lú ìdàrúdàpọ̀, kì í ṣe ìró lásán; àkójọpọ̀ yìí mú gbogbo agbára ọ̀rọ̀ náà jáde ní Yorùbá.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: ó pàṣẹ pé kí wọ́n mú un lọ
  rationale: Ó fi àṣẹ pàtó ἐκέλευσεν hàn, ó sì sọ passive infinitive náà ní ọ̀nà Yorùbá àdánidá láì dá àwọn aṣojú tí Gíríìkì kò dárúkọ mọ́.
- source_word: εἰς τὴν παρεμβολήν
  choice: sínú ibùdó àwọn ọmọ ogun Róòmù
  rationale: Nínú àyíká Ìṣe Àwọn Aposteli, παρεμβολή tọ́ka sí ibi tí ẹgbẹ́ ọmọ ogun Róòmù ń gbé nítòsí tẹ́ńpìlì. Ìtumọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní ju ‘àgọ́’ lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘ọ̀pọ̀ ènìyàn’ dípò ọ̀rọ̀ tó lè dá wọn lẹ́bi ju ohun tí Gíríìkì sọ lọ; a sì jẹ́ kí àìdájú inú τὸ ἀσφαλές dúró.
