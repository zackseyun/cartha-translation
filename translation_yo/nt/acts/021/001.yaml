id: ACT.21.1
reference: Acts 21:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: yo
  text: Lẹ́yìn tí a fi tipátipá ya ara wa kúrò lọ́dọ̀ wọn, tí a sì ṣíkọ̀ jáde sí òkun, a gba ọ̀nà tààrà dé Kóòsì; ní ọjọ́ kejì, a dé Ródì, a sì dé Pátárà láti ibẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Lẹ́yìn tí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń mú ìṣẹ̀lẹ̀ tó tẹ̀ lé e wọ inú ìtàn. “Lẹ́yìn tí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹ̀lé àkókò hàn.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: a fi tipátipá ya ara wa kúrò lọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ náà lágbára ju pípa ara ẹni dà ní pẹ̀lẹ́pẹ̀lẹ́ lọ; ó fi ìṣòro àti ìrora ìyapa hàn. “Ya ara wa” tún bá ìtumọ̀ apá-ara ẹni nínú àyíká ọ̀rọ̀ mu.
- source_word: ἀναχθῆναι
  choice: ṣíkọ̀ sí òkun
  rationale: Nínú èdè ìrìn-àjò ojú omi, ọ̀rọ̀ náà túmọ̀ sí fífi ọkọ ojú omi kúrò ní èbúté lọ sí òkun.
- source_word: εὐθυδρομήσαντες
  choice: a gba ọ̀nà tààrà
  rationale: Ó tọ́ka sí rírọ̀ ọkọ ojú omi ní ipa ọ̀nà tààrà sí ibi tí a ń lọ; gbolohun yìí ṣe kedere ní Yorùbá láìsọ àwòrán ojú omi náà nù.
- source_word: ἤλθομεν εἰς
  choice: a dé
  rationale: Nínú àkọsílẹ̀ ìrìn-àjò, “a dé” jẹ́ Yorùbá ṣókí àti àdánidá fún dídé ibi kan.
- source_word: Κῶ
  choice: Kóòsì
  rationale: Àkọtọ̀ Yorùbá tó fara mọ́ bí orúkọ Gíríìkì Κῶ ṣe ń dún.
- source_word: τῇ δὲ ἑξῆς
  choice: ní ọjọ́ kejì
  rationale: Gbólóhùn àkókò náà túmọ̀ sí ọjọ́ tó tẹ̀ lé e.
- source_word: Ῥόδον
  choice: Ródì
  rationale: Àkọtọ̀ Yorùbá tó fara mọ́ ìpè orúkọ Gíríìkì Ῥόδος.
- source_word: κἀκεῖθεν
  choice: láti ibẹ̀ sì ni
  rationale: Ó pa ìsopọ̀ “àti láti ibẹ̀” mọ́, ó sì jẹ́ kí ìtòlẹ́sẹẹsẹ ìrìn-àjò wọ́pọ̀ ní Yorùbá.
- source_word: Πάταρα
  choice: Pátárà
  rationale: Àkọtọ̀ Yorùbá tó fara mọ́ bí orúkọ ibi Gíríìkì náà ṣe ń dún.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a pa agbára ìyapa inú ἀποσπασθέντας àti àwòrán ìrìn-àjò ojú omi mọ́.
