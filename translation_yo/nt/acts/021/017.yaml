id: ACT.21.17
reference: Acts 21:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: yo
  text: Nígbà tí a dé sí Jerúsálẹ́mù, àwọn arákùnrin[a] fi ayọ̀ gbà wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin.” Èdè Gíríìkì ní “àwọn arákùnrin,” ṣùgbọ́n ọ̀rọ̀ náà tún lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Nígbà tí a dé
  rationale: Àkójọpọ̀ ọ̀rọ̀ genitive absolute yìí ń fi àkókò àti ipò dídé hàn. “Nígbà tí a dé” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ àkókò mọ́.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: εἰς ń tọ́ka sí ibi tí wọ́n ń lọ; pẹ̀lú ọ̀rọ̀-ìṣe “dé,” “dé sí Jerúsálẹ́mù” jẹ́ ìsọ̀rọ̀ Yorùbá adayébá.
- source_word: ἀσμένως
  choice: fi ayọ̀
  rationale: Ọ̀rọ̀ adverb yìí túmọ̀ sí pé inú wọn dùn láti gba àwọn arìnrìn-àjò náà. “Fi ayọ̀” sọ ìtumọ̀ náà ní kíkún láìfi àlàyé míì kún un.
- source_word: ἀπεδέξαντο
  choice: gbà wá
  rationale: Nínú àyíká yìí, ἀποδέχομαι túmọ̀ sí gbígba ènìyàn tọ̀wọ̀tọ̀wọ̀. “Fi ayọ̀ gbà wá” jẹ́ ọ̀rọ̀ Yorùbá adayébá fún wíwá káàbọ̀.
- source_word: οἱ ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Èdè Gíríìkì lo orúkọ akọ ní ọ̀pọ̀, ἀδελφοί. “Àwọn arákùnrin” pa ìrísí ọ̀rọ̀ orísun mọ́; àlàyé ìsàlẹ̀ ojú-ewé sì jẹ́ kí òǹkàwé mọ̀ pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, tóbìnrin-tọ́kùnrin.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί fún ìjọ àwọn onígbàgbọ́ ní Jerúsálẹ́mù
  choice: àwọn arákùnrin
  alternative: àwọn ará; àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: A pa fọ́ọ̀mù akọ ọ̀pọ̀ inú Gíríìkì mọ́ nínú àyọkà, ṣùgbọ́n a kò fi tipátipá pinnu pé àwọn ọkùnrin nìkan ni wọ́n wà nínú ẹgbẹ́ náà. Àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ tó lè gba gbogbo àwọn onígbàgbọ́ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó mọ́, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. “Fi ayọ̀ gbà wá” jẹ́ ọ̀nà adayébá láti sọ wíwá káàbọ̀ pẹ̀lú inú dídùn.
