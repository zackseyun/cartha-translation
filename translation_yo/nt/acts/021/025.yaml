id: ACT.21.25
reference: Acts 21:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti àwọn Kèfèrí tí wọ́n ti gba ìgbàgbọ́, àwa ránṣẹ́[a], lẹ́yìn tí a pinnu pé kí wọ́n pa ara wọn mọ́ kúrò nínú ohun tí a fi rúbọ sí òrìṣà, àti ẹ̀jẹ̀, àti ẹran tí a pa nípa fífún un[b], àti àgbèrè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ sí “a ránṣẹ́,” ṣùgbọ́n kò sọ ohun tí a rán ní tààràtà; àyíká ń tọ́ka sí ìwé tàbí ìkéde ìpinnu tí a rán ní Ìṣe 15.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, ẹran ọ̀sìn tí a pa nípa fífún un, tí ẹ̀jẹ̀ rẹ̀ kò tú jáde.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: Ṣùgbọ́n ní ti
  rationale: “Ní ti” ń gbé kókó tuntun kalẹ̀ gẹ́gẹ́ bí περὶ, “ṣùgbọ́n” sì ń pa ìyípadà onírẹ̀lẹ̀ tí δέ mú wá mọ́.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: àwọn Kèfèrí tí wọ́n ti gba ìgbàgbọ́
  rationale: “Àwọn Kèfèrí” ni ἐθνῶν túmọ̀ sí ní àyíká yìí; “tí wọ́n ti gba ìgbàgbọ́” sì fi hàn pé wọ́n ti wá sí ìgbàgbọ́, wọ́n sì wà nínú rẹ̀.
- source_word: ἡμεῖς
  choice: àwa
  rationale: A lo ọ̀rọ̀ arọ́pò-orúkọ tí ó dúró fúnra rẹ̀ láti pa ìtẹnumọ́ inú Gíríìkì mọ́.
- source_word: ἀπεστείλαμεν
  choice: ránṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ohun tí a rán ní tààràtà nínú ẹsẹ yìí. “Ránṣẹ́” jẹ́ àdámọ̀ ní Yorùbá, ó sì pa àìsọ ohun tí a rán mọ́; àyíká Ìṣe 15 fi hàn pé ìwé tàbí ìkéde ìpinnu ni a ní lọ́kàn.
- source_word: κρίναντες
  choice: lẹ́yìn tí a pinnu
  rationale: Èyí fi hàn pé ìpinnu náà ṣáájú ríránṣẹ́, ó sì sọ ìṣe ìgbìmọ̀ náà ní èdè Yorùbá tó ṣe kedere.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: kí wọ́n pa ara wọn mọ́ kúrò nínú
  rationale: 'Gbólóhùn yìí pa ìtumọ̀ onípadà-sí-ara ẹni mọ́: kí wọ́n ṣọ́ ara wọn, kí wọ́n sì yẹra fún àwọn ohun tí a tò lẹ́yìn rẹ̀.'
- source_word: τό τε εἰδωλόθυτον
  choice: ohun tí a fi rúbọ sí òrìṣà
  rationale: Ó tẹ̀lé ìtumọ̀ Gíríìkì láì dín un kù sí irú oúnjẹ kan ṣoṣo, bó tilẹ̀ jẹ́ pé oúnjẹ tàbí ẹran tó ní í ṣe pẹ̀lú ẹbọ òrìṣà ni àyíká ń tọ́ka sí.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààràtà ni; a kò fi “jíjẹ” kún ọ̀rọ̀ inú ẹsẹ náà, bí ó tilẹ̀ jẹ́ pé àṣẹ yìí ń sọ nípa lílo ẹ̀jẹ̀ gẹ́gẹ́ bí oúnjẹ.
- source_word: πνικτόν
  choice: ẹran tí a fún pa
  rationale: Èyí ń tọ́ka sí ẹran ọ̀sìn tí a pa nípa fífún un, tí a kò sì tú ẹ̀jẹ̀ rẹ̀ jáde; ìtumọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá.
- source_word: πορνείαν
  choice: àgbèrè
  rationale: “Àgbèrè” jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò fún ìbálòpọ̀ tí kò bófin mu, ó sì bá ìwọ̀n ìtumọ̀ πορνεία mu ju ọ̀rọ̀ tó dín kù sí ìwà kan ṣoṣo lọ.
theological_decisions:
- issue: Ìwà àti bí àṣẹ àwọn aposteli mẹ́rin ṣe pẹ́ tó
  choice: A tú àwọn ohun mẹ́rin tí wọ́n ní kí a yẹra fún ní tààràtà, láì sọ pé wọ́n jẹ́ àṣẹ fún ìgbà díẹ̀ tàbí òfin ayérayé.
  alternative: Kí a ṣàlàyé wọn gẹ́gẹ́ bí ìlànà fún ìbágbépọ̀ tábìlì nígbà yẹn nìkan, tàbí gẹ́gẹ́ bí òfin ìwà rere tó di gbogbo ènìyàn mú títí láé.
  rationale: Ẹsẹ náà ń tún ìpinnu ìgbìmọ̀ ṣọ́ọ̀ṣì ṣe, ṣùgbọ́n kò ṣàlàyé gbogbo ìdí tàbí iye àkókò tí ọ̀kọ̀ọ̀kan àṣẹ náà yóò fi wà. Ìtumọ̀ náà kò gbọ́dọ̀ yanju ohun tí ẹsẹ náà kò yanju.
translation_notes:
  register: A lo Yorùbá àgbàdojú, ọlọ́lá, tí ó sì yé òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Kèfèrí” ni a lò fún àwọn tí kì í ṣe Júù nínú àyíká Májẹ̀mú Tuntun, “àwa” sì pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
