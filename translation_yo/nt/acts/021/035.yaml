  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: yo
  text: Nígbà tí ó dé sí àtẹ̀gùn náà[a], ó ṣẹlẹ̀ pé àwọn ọmọ-ogun ń gbé e nítorí ìwà ipá ogunlọ́gọ̀ náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àtẹ̀gùn náà jọ pé ó jẹ́ èyí tí ń lọ sókè sí ibùdó àwọn ọmọ-ogun Róòmù (wo Ìṣe 21:34, 37).
    reason: cross_reference
  - marker: b
    text: Tàbí, “nítorí agbára tí ogunlọ́gọ̀ náà ń lò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí agbára líle tàbí ìwà ipá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nígbà tí
  rationale: ὅτε ṣe àfihàn àkókò; δέ jẹ́ àsopọ̀ tí kò lágbára, èyí tí Yorùbá kò nílò láti túmọ̀ lọ́tọ̀ níbí.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: ó dé ibi àtẹ̀gùn
  rationale: γίνομαι pẹ̀lú ἐπί àti ọ̀rọ̀ inú accusative jẹ́ ọ̀nà àsọyé fún dídé ibi kan; ‘dé ibi àtẹ̀gùn’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: ἀναβαθμούς
  choice: àtẹ̀gùn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ìpele àtẹ̀gùn tàbí àtẹ̀gùn tí a fi ń gòkè; ‘àtẹ̀gùn’ bá àyíká ọ̀rọ̀ mu.
- source_word: συνέβη
  choice: ó ṣẹlẹ̀ pé
  rationale: συμβαίνω fi ipò tí ó yọrí sí hàn; ‘ó ṣẹlẹ̀ pé’ pa irú ìsọ̀rọ̀ ìtàn Lúùkù mọ́.
- source_word: βαστάζεσθαι
  choice: àwọn ọmọ-ogun gbé e
  rationale: Infinitive passive present náà ń sọ pé wọ́n ń gbé Pọ́ọ̀lù lọ. Yorùbá máa ń lo gbólóhùn olùṣe ní ọ̀nà àdánidá; kò sí ìtumọ̀ dandan ‘ní láti’ tí a fi kún ọ̀rọ̀ pàtó náà.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: àwọn ọmọ-ogun
  rationale: στρατιῶται túmọ̀ tààrà sí àwọn ọmọ-ogun, tí wọ́n sì jẹ́ olùṣe nínú ìtumọ̀ Yorùbá àdánidá.
- source_word: διὰ τὴν βίαν
  choice: nítorí ìwà ipá
  rationale: διά pẹ̀lú accusative sọ ìdí; βία ní àyíká rògbòdìyàn yìí jẹ́ agbára oníjàgídíjàgan tàbí ìwà ipá.
- source_word: τοῦ ὄχλου
  choice: àwọn ènìyàn náà
  rationale: ὄχλος túmọ̀ sí ọ̀pọ̀ ènìyàn tí ó péjọ. ‘Àwọn ènìyàn náà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, nígbà tí ‘ìwà ipá’ ti fi ìhùwàsí búburú wọn hàn.
