translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé yé fún gbogbo ènìyàn. Gbólóhùn olùṣe ‘àwọn ọmọ-ogun gbé e’ jẹ́ àdánidá ju passive aláìrọ̀rùn lọ, ṣùgbọ́n ó pa olùṣe àti ìṣe inú Gíríìkì mọ́. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀; a so àlàyé ibi mọ́ ‘àtẹ̀gùn’ àti àlàyé lexical mọ́ ‘àwọn ènìyàn náà.’
