id: ACT.21.5
reference: Acts 21:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: yo
  text: Nígbà tí àkókò sì tó fún wa láti parí àwọn ọjọ́ náà, a jáde, a sì ń tẹ̀síwájú nínú ìrìnàjò wa. Gbogbo wọn, pẹ̀lú àwọn aya wọn àti àwọn ọmọ wọn, ń bá wa lọ[a] títí dé òde ìlú. Lẹ́yìn tí a kúnlẹ̀ ní etí òkun[b], a gbàdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “gbogbo wọn ń sìnrìn dé wa.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí bíbá ẹni tí ó ń lọ rìn gẹ́gẹ́ bí ọ̀nà láti dágbére fún un.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní etí omi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Nígbà tí àkókò sì tó fún wa láti parí àwọn ọjọ́ náà
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ pé àkókò láti parí ìgbà tí a yàn fún wọn ti dé, dípò fífi kàn sọ pé àwọn ọjọ́ náà ti dópin.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: a jáde, a sì ń bá ìrìn-àjò wa lọ
  rationale: ‘A jáde’ dúró fún iṣẹ́ participle náà, ‘ń bá … lọ’ sì fi ìṣe tí ó ń tẹ̀ síwájú nínú imperfect hàn.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Gbogbo wọn … ń bá wa lọ
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí pé wọ́n bá àwọn arìnrìn-àjò náà lọ nígbà ìlọkúrò, pẹ̀lú ète láti sìn wọ́n dé; àlàyé yẹn wà nínú àlàyé ìsàlẹ̀.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: pẹ̀lú àwọn aya wọn àti àwọn ọmọ wọn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, γυναιξὶ ṣeé lóye jù lọ gẹ́gẹ́ bí ‘àwọn aya,’ níwọ̀n bí πάντων ti ń tọ́ka sí ẹgbẹ́ àwọn ọkùnrin àti agbo ilé wọn.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: títí dé òde ìlú
  rationale: Gbólóhùn yìí fi hàn pé wọ́n bá wọn lọ dé ibi tí ó wà níta ìlú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: θέντες τὰ γόνατα
  choice: Lẹ́yìn tí a sì kúnlẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún àpólà Gíríìkì náà, tí ó túmọ̀ ní tààrà sí fífi eékún lélẹ̀.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ní etí òkun
  rationale: αἰγιαλός ń tọ́ka sí etí omi tàbí etí òkun; ‘etí òkun’ bá ipò ìrìn-àjò ojú omi náà mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání.
- source_word: προσευξάμενοι
  choice: a gbàdúrà
  rationale: A sọ participle náà di ọ̀rọ̀-ìṣe aláṣẹ nínú Yorùbá kí ìtàn náà lè ṣàn lọ́nà àdánidá, láìyí ẹni àkọ́kọ́ ọ̀pọ̀ padà.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A pa ìròyìn ẹni àkọ́kọ́ ọ̀pọ̀ àti ìtẹ̀síwájú ìrìn-àjò náà mọ́, a sì fi àṣàyàn ìtumọ̀ προπέμπω hàn nínú àlàyé ìsàlẹ̀ láìyanju àìdánilójú rẹ̀ ní ìkọ̀kọ̀.
