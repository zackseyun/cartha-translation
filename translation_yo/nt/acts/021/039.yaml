id: ACT.21.39
reference: Acts 21:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: yo
  text: Ṣùgbọ́n Paulu sọ pé, “Èmi jẹ́ Júù, ará Tarsu ní Kilikia, ọmọ ìlú Tarsu tí kò ṣeé fojú kéré.[a] Mo bẹ̀ ọ́, gbà mí láyè láti sọ̀rọ̀ sí àwọn ènìyàn náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi jẹ́ Júù, ọmọ ìlú Tarsu ní Kilikia—ìlú tí kò ṣeé fojú kéré.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος … Ἰουδαῖος
  choice: Èmi jẹ́ Júù
  rationale: Yorùbá kò nílò kí a túmọ̀ ἄνθρωπος lọ́tọ̀ gẹ́gẹ́ bí ‘ọkùnrin’ nínú ìdánimọ̀ yìí; ‘Èmi jẹ́ Júù’ jẹ́ ọ̀rọ̀ àdánidá, ó sì pa ìdánimọ̀ ẹ̀yà àti ẹ̀sìn mọ́.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: ará Tarsu ní Kilikia
  rationale: ‘Ará Tarsu’ sọ ibi tí Paulu ti wá ní Yorùbá àdánidá, ‘ní Kilikia’ sì ṣàlàyé agbègbè rẹ̀.
- source_word: οὐκ ἀσήμου πόλεως πολίτης
  choice: ọmọ ìlú kan tí kò ṣeé fojú kéré
  rationale: ‘Ọmọ ìlú’ fi ìbáṣepọ̀ ará ìlú hàn, gbólóhùn ‘tí kò ṣeé fojú kéré’ sì pa ọ̀nà ìsọ̀rọ̀ litotes ti Gíríìkì mọ́ láì di àtijọ́ tàbí àìgbọ́dọ̀.
- source_word: δέομαι δέ σου
  choice: Mo bẹ̀ ọ́
  rationale: Èyí mú ìtara àti ìrẹ̀lẹ̀ inú ẹ̀bẹ̀ náà jáde ju ‘mo béèrè lọ́wọ́ rẹ’ lọ.
- source_word: ἐπίτρεψόν μοι
  choice: gbà mí láyè
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè fún àṣẹ ní Yorùbá tó bójú mu, tó sì bá ọ̀rọ̀ sí aláṣẹ ológun mu.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: láti bá àwọn ènìyàn náà sọ̀rọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ̀rọ̀ sí àwùjọ; ‘àwọn ènìyàn náà’ pa ìtumọ̀ λαός mọ́ láì dín un kù sí ariwo ogunlọ́gọ̀ nìkan.
- source_word: μέν
  choice: a kò túmọ̀ ọ́ sí ọ̀rọ̀ ọ̀tọ̀
  rationale: Ìtẹnumọ́ μέν wà nínú ìṣètò ‘Èmi jẹ́ Júù’; fífi ‘nítòótọ́’ kún un lè dun bí ìmúdájú òtítọ́ ju ìtẹnumọ́ ìdánimọ̀ lọ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖος nínú àyíká ọ̀rọ̀ yìí
  choice: Júù
  alternative: ará Judea
  rationale: Paulu ń sọ ìdánimọ̀ ẹ̀yà àti ẹ̀sìn rẹ̀, nígbà tó tún sọ Tarsu ní Kilikia gẹ́gẹ́ bí ìlú rẹ̀. ‘Ará Judea’ lè mú kí a gbà pé Judea ni ibi ìbí tàbí ìlú ìbílẹ̀ rẹ̀.
- issue: Ìbáṣepọ̀ Ταρσεύς àti πολίτης
  choice: ará Tarsu … ọmọ ìlú kan
  alternative: ọmọ ìlú Tarsu ní Kilikia, ìlú tí kò ṣeé fojú kéré
  rationale: Gíríìkì lè jẹ́ kí a so ‘ará Tarsu’ àti ‘ọmọ ìlú’ pọ̀ ní ọ̀nà tó ju ẹyọ kan lọ. Àkọ́kọ́ ọrọ̀ pa ìtẹ̀lé àti ìfọkànsìn orísun mọ́, àlàyé ẹsẹ̀ sì fi ọ̀nà míì tó ṣeé ṣe hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘gbà mí láyè’ fún ìbéèrè ọlọ́wọ̀, a sì pa ọ̀nà ìsọ̀rọ̀ ‘kò ṣeé fojú kéré’ mọ́.
