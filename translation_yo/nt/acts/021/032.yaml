  to: Lẹ́sẹ̀kẹsẹ̀, ó mú àwọn ọmọ ogun àti àwọn balógun ọgọ́rùn-ún, ó sì sáré sọ̀kalẹ̀ lọ bá wọn. Nígbà tí wọ́n rí olórí ẹgbẹ́ ọmọ ogun náà[a] àti àwọn ọmọ ogun, wọ́n dáwọ́ lílu Paulu dúró.
