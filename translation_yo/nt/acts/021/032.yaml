  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó mú àwọn ọmọ ogun àti àwọn balógun ọgọ́rùn-ún, ó sì sáré sọ̀kalẹ̀ lọ bá wọn. Nígbà tí wọ́n rí olórí ẹgbẹ́ ọmọ ogun náà[a] àti àwọn ọmọ ogun, wọ́n dáwọ́ lílu Paulu dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá ológun Róòmù.” Ọ̀rọ̀ Gíríìkì náà, χιλίαρχος, ń tọ́ka sí ọ̀gá ológun Róòmù kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ó gbé ìgbésẹ̀ náà láìjáfara; ọ̀rọ̀ yìí jẹ́ ti Yorùbá òde òní, ó sì pa ìkánjú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: παραλαβὼν
  choice: ó mú
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé olórí náà mú àwọn ọmọ ogun lọ pẹ̀lú ara rẹ̀; ‘ó mú’ ṣe kedere láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: στρατιώτας
  choice: àwọn ọmọ ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn jagunjagun lẹ́ni kọ̀ọ̀kan.
- source_word: ἑκατοντάρχας
  choice: àwọn balógun ọ̀rún
  rationale: Ó fi ipò àwọn ọ̀gá ọmọ ogun Róòmù tí a ń pè ní centurion hàn, ó sì jẹ́ kí ìyàtọ̀ wọn sí χιλίαρχος ṣe kedere.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: ó sì sáré sọ̀kalẹ̀ lọ bá wọn
  rationale: Ó pa ìyára àti ìsọ̀kalẹ̀ láti ibi gíga mọ́, ṣùgbọ́n kò fi èrò ikọlù tí gbolohun Gíríìkì kò fi dandan múlẹ̀ kún un.
- source_word: χιλίαρχον
  choice: olórí ẹgbẹ́ ọmọ ogun náà
  rationale: Ó jẹ́ àpèjúwe Yorùbá tó ṣe kedere fún ọ̀gá Róòmù tó ń darí cohort kan, láìlo orúkọ ipò ilẹ̀ òkèèrè tí ọ̀pọ̀ òǹkàwé kò mọ̀.
- source_word: ἐπαύσαντο
  choice: wọ́n dáwọ́ … dúró
  rationale: Ìṣẹ̀dá ọ̀rọ̀ Yorùbá yìí sọ ní ti ẹ̀dá pé wọ́n fòpin sí ohun tí wọ́n ń ṣe.
- source_word: τύπτοντες
  choice: lílu Paulu
  rationale: Ó fi hàn pé wọ́n ń gbá Paulu ní ìgbàkígbà, kì í ṣe pé wọ́n kàn án lẹ́ẹ̀kan ṣoṣo.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A yan ọ̀rọ̀ ipò ológun tó ṣe kedere nínú àyíká Yorùbá, a sì fi àlàyé ìtàn sí àlàyé ìsàlẹ̀ dípò kí a di gbolohun àkọ́kọ́ léwu.
