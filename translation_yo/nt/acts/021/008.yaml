id: ACT.21.8
reference: Acts 21:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: yo
  text: Ní ọjọ́ kejì, a kúrò níbẹ̀, a sì dé Kesaria. A wọ ilé Fílípì ajíhìnrere, ẹni tí ó jẹ́ ọ̀kan lára àwọn méje[a], a sì dúró lọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ọ̀kan lára àwọn ọkùnrin méje tí a yàn ṣáájú fún iṣẹ́ ìránṣẹ́ ní Jerusalẹmu (wo Ìṣe Àwọn Àpọ́sítélì 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi tẹ̀lé ìtàn ní ìtòlẹ́sẹẹsẹ, láìfi δέ kún un lọ́nà tí yóò wuwo.
- source_word: ἐξελθόντες
  choice: a gbéra
  rationale: Nínú ìtàn ìrìn-àjò, ‘a gbéra’ túmọ̀ sí pé wọ́n kúrò ní ibi tí wọ́n wà, ó sì bá èdè Yorùbá òde òní mu ju ìtumọ̀ gígún bí ‘lẹ́yìn tí a jáde’ lọ.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: a sì dé Kesaria
  rationale: ‘Dé’ sọ kedere pé wọ́n dé ibi tí wọ́n ń lọ; ‘Kesaria’ jẹ́ àkọsílẹ̀ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: A wọ ilé
  rationale: Ó pa ìṣe wíwọ inú ilé mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn tí ó tẹ̀ lé bí àwọn ìṣẹ̀lẹ̀ ṣe ṣẹlẹ̀.
- source_word: Φιλίππου τοῦ εὐαγγελιστοῦ
  choice: Fílípì ajíhìnrere
  rationale: ‘Ajíhìnrere’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún ẹni tí ń kéde ìhìn rere, ó sì pa ipa-orúkọ εὐαγγελιστής mọ́.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: ẹni tí ó jẹ́ ọ̀kan lára àwọn méje
  rationale: Ìtumọ̀ yìí dá ìdánimọ̀ Fílípì gẹ́gẹ́ bí ọ̀kan nínú ẹgbẹ́ méje náà dúró, láìsọ ẹgbẹ́ náà di ipò ìjọ kan tí ẹsẹ náà kò dárúkọ.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: a sì dúró lọ́dọ̀ rẹ̀
  rationale: Nínú àyíká àlejò, ‘dúró lọ́dọ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n gbé pẹ̀lú rẹ̀ fún àkókò kan.
theological_decisions:
- issue: Ìdánimọ̀ Fílípì gẹ́gẹ́ bí ‘ọ̀kan lára àwọn méje’
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìtọ́kasí sí àwọn méje, kí a má sì sọ ọ́ di orúkọ ipò ìjọ.
  alternative: Láti pè é ní ọ̀kan lára ‘Àwọn Méje’ tàbí láti fi orúkọ ipò kan kún un.
  rationale: Gíríìkì tọ́ka sí ẹgbẹ́ tí a ti mẹ́nu kàn ṣáájú, ṣùgbọ́n kò sọ níbí pé ó jẹ́ ipò ìjọ pàtó; ìtumọ̀ náà kò gbọ́dọ̀ fi èrò ètò-ìjọ tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ. A gbé àmì àlàyé [a] sí ‘àwọn méje,’ ibi tí àlàyé náà ń tọ́ka sí, dípò fífi sí orúkọ Kesaria.
