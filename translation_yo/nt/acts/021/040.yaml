source:
  edition: SBLGNT
  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: yo
  text: 'Nígbà tí olórí ọmọ ogun náà sì yọ̀ǹda fún un, Pọ́ọ̀lù dúró lórí àwọn àtẹ̀gùn, ó sì fi ọwọ́ ṣe àmì sí àwọn ènìyàn. Nígbà tí wọ́n sì dákẹ́ jẹ́ẹ́ gidigidi, ó bá wọn sọ̀rọ̀ ní èdè Hébérù[a], ó ní:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ó ṣeé ṣe, “ní èdè Árámáíkì.” Gíríìkì náà sọ pé “ní èdè tàbí ẹ̀ka èdè Hébérù”; ní àyíká yìí, ó lè tọ́ka sí èdè àwọn Júù agbègbè náà tí a sábà ń pè ní Árámáíkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Nígbà tí olórí ọmọ ogun náà sì yọ̀ǹda fún un
  rationale: Àpólà olóhun-ìní olómìnira yìí tọ́ka sí olórí ọmọ ogun inú ẹsẹ tó ṣáájú. Mímú orúkọ ipò náà wọlé mú ẹni tí “αὐτοῦ” ń tọ́ka sí ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: Pọ́ọ̀lù dúró lórí àwọn àtẹ̀gùn
  rationale: Ó ṣàpèjúwe ibi tí Pọ́ọ̀lù wà. “Àwọn àtẹ̀gùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ìpele ọ̀nà àtẹ̀gùn tó lọ sí àgọ́ ológun.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: ó sì fi ọwọ́ ṣe àmì sí àwọn ènìyàn
  rationale: Ìṣe náà jẹ́ àmì ọwọ́ láti mú kí àwọn ènìyàn dákẹ́ tàbí láti pe àfiyèsí wọn; gbolohun yìí kò fi ìdí ọ̀kan ṣoṣo nínú àwọn ète méjèèjì múlẹ̀.
- source_word: τῷ λαῷ
  choice: àwọn ènìyàn
  rationale: Yíyan “àwọn ènìyàn” pa ìtumọ̀ λαός mọ́, bí ó tilẹ̀ jẹ́ pé ní àyíká yìí àwọn ènìyàn náà jẹ́ ogunlọ́gọ̀.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Nígbà tí wọ́n sì dákẹ́ jẹ́ẹ́ gidigidi
  rationale: Èyí sọ ìbẹ̀rẹ̀ ìdákẹ́jẹ́ ńlá náà ní ọ̀nà Yorùbá tó ṣe déédéé, dípò títẹ̀lé àkópọ̀ ọ̀rọ̀ Gíríìkì lọ́nà líle.
- source_word: προσεφώνησεν
  choice: ó bá wọn sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí sísọ̀rọ̀ sí àwọn ènìyàn ní gbangba; “ó bá wọn sọ̀rọ̀” jẹ́ kedere, ó sì bójú mu àyíká ọ̀rọ̀ náà.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ní èdè Hébérù[a]
  rationale: Gíríìkì náà sọ ní tààrà pé “ní èdè/ẹ̀ka èdè Hébérù.” A pa Hébérù mọ́ nínú àyọkà, a sì ṣàlàyé pé ó ṣeé ṣe kó tọ́ka sí Árámáíkì nínú àlàyé ìsàlẹ̀.
- source_word: λέγων
  choice: 'ó ní:'
  rationale: Èyí fi ọ̀rọ̀ tí Pọ́ọ̀lù yóò sọ nínú ẹsẹ tó tẹ̀ lé e hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “olórí ọmọ ogun náà” láti mú ẹni tí arọ́pò-orúkọ Gíríìkì tọ́ka sí ṣe kedere láti inú àyíká ẹsẹ tó ṣáájú. Àmì àlàyé [a] wà lẹ́yìn “Hébérù,” ibi tí àṣàyàn ìtumọ̀ náà kan.
