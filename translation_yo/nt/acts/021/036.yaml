  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn náà ń tọ̀ ọ́ lẹ́yìn, wọ́n ń ké pé, “Mú un kúrò!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθει
  choice: ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò imperfect fi hàn pé ìṣe náà ń bá a lọ ní àkókò ìtàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún títẹ̀lé ẹnì kan.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ohun tí ó ṣẹlẹ̀ ṣáájú.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: Ó túmọ̀ àwùjọ ènìyàn púpọ̀ ní ọ̀nà tí ó ṣe kedere, láìfi ìtumọ̀ ẹ̀gàn bí ‘ìkójọpọ̀ oníjàgídíjàgan’ kún un.
- source_word: κράζοντες
  choice: wọ́n sì ń ké
  rationale: Ó fi ìké líle tí ó ń bá ìtẹ̀lé wọn lọ hàn ní Yorùbá àdánidá.
- source_word: Αἶρε αὐτόν
  choice: Mú un kúrò!
  rationale: Ní àyíká ọ̀rọ̀ yìí, àṣẹ náà ń béèrè pé kí a yọ Pọ́ọ̀lù kúrò, kì í ṣe pé kí a kàn gbé e sókè; yíyan yìí tún pa agbára ìbéèrè ọ̀tá náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì àti tó rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu.
