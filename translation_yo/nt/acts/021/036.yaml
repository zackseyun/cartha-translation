  source_fidelity: Ìtumọ̀ àkọ́kọ́ náà fi imperfect ἠκολούθει hàn dáadáa ní “ń tọ̀ ọ́ lẹ́yìn,” ó sì túmọ̀ κράζοντες àti Αἶρε αὐτόν pẹ̀lú agbára tó yẹ. Síbẹ̀, àlàyé-ẹsẹ̀ náà ń gbé “Pa á!” kalẹ̀ gẹ́gẹ́ bí yíyan ìtumọ̀ fún ọrọ̀ Gíríìkì náà, èyí tí kò jẹ́ ìtumọ̀ lexical tààrà tàbí àṣàyàn tí a fìdí múlẹ̀ nínú ẹsẹ̀ yìí. Àyíká tó gbòòrò lè fi ìfẹ́ ọ̀tá wọn hàn, ṣùgbọ́n ọrọ̀ náà fúnra rẹ̀ béèrè pé kí a kó/un yọ ọkùnrin náà kúrò.
