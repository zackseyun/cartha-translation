  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: yo
  text: Ó ní ọmọbìnrin mẹ́rin tí wọ́n jẹ́ wúńdíá, tí wọ́n ń sọ àsọtẹ́lẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ní ọmọbìnrin mẹ́rin tí wọ́n kò tíì ní ọkọ, tí wọ́n ń sọ àsọtẹ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ ... ἦσαν
  choice: Ó ní
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí pé ‘ọmọbìnrin wà fún un,’ ṣùgbọ́n ‘Ó ní’ ni ọ̀nà Yorùbá àdánidá láti fi hàn pé Fílípì ni àwọn ọmọbìnrin náà.
- source_word: θυγατέρες τέσσαρες
  choice: àwọn ọmọbìnrin mẹ́rin
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì bá èdè Yorùbá òde òní mu.
- source_word: παρθένοι
  choice: tí wọ́n kò tíì ní ọkọ
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn obìnrin tí wọn kò tíì ṣe ìgbéyàwó, ó sì tún lè tẹnumọ́ pé wúńdíá ni wọ́n. Àyípadà yìí jẹ́ èdè Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tààrà mọ́.
- source_word: προφητεύουσαι
  choice: tí wọ́n sì ń sọ àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀-ìṣe aláìparí yìí ṣàpèjúwe iṣẹ́ tí wọ́n ń ṣe tàbí tí a mọ̀ wọ́n sí; ‘ń sọ àsọtẹ́lẹ̀’ pa agbára ìtumọ̀ yẹn mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀; ‘sì’ so àpèjúwe iṣẹ́ àsọtẹ́lẹ̀ mọ́ ohun tí a ti sọ ní ọ̀nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ παρθένοι nípa àwọn obìnrin tí wọ́n ń sọ àsọtẹ́lẹ̀
  choice: tí wọ́n kò tíì ní ọkọ
  alternative: tí wọ́n jẹ́ wúńdíá
  rationale: Ẹsẹ̀ náà sọ ipò wọn àti iṣẹ́ àsọtẹ́lẹ̀ wọn, ṣùgbọ́n kò ṣàlàyé ìbáṣepọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan láàárín méjèèjì. Ìtumọ̀ àkọ́kọ́ yàgò fún fífi ẹ̀kọ́ ẹgbẹ́ ìsìn kan kún ọ̀rọ̀ náà, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ tààrà tó ṣe pàtàkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó ti yẹ, a sì yàgò fún ọ̀rọ̀ ìjọ tàbí ẹ̀kọ́ ẹ̀sìn tí kò sí nínú orísun.
