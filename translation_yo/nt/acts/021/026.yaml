  terminology: “Tẹ́ńpìlì” pẹ̀lú àlàyé ìsàlẹ̀ rẹ̀ ń tọ́ka dáadáa sí ἱερόν gẹ́gẹ́ bí àgbègbè tẹ́ńpìlì. “Ìwẹ̀nùmọ́” yẹ fún ἁγνισμός. “Ọrẹ” lè dúró fún προσφορά, ṣùgbọ́n fífi “rú” pọ̀ mọ́ ọ́ nínú ọ̀rọ̀ àkọ́kọ́ ni ó fi ìtumọ̀ ẹbọ/ọrẹ ìjọsìn hàn ní kedere láì sọ irú ẹbọ kan pàtó.
