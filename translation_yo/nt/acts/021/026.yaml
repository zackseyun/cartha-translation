  to: Nígbà náà ni Pọ́ọ̀lù mú àwọn ọkùnrin náà lọ pẹ̀lú rẹ̀. Ní ọjọ́ kejì, lẹ́yìn tí ó ti ṣe ìwẹ̀nùmọ́ pẹ̀lú wọn, ó wọ inú tẹ́ńpìlì[a], ó sì ń kéde ìparí àwọn ọjọ́ ìwẹ̀nùmọ́, títí di ìgbà tí a fi rú ọrẹ náà[b] fún ẹnì kọ̀ọ̀kan wọn.
