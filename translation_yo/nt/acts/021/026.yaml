id: ACT.21.26
reference: Acts 21:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: yo
  text: Nígbà náà ni Pọ́ọ̀lù mú àwọn ọkùnrin náà lọ pẹ̀lú rẹ̀. Ní ọjọ́ kejì, lẹ́yìn tí ó ti ṣe ìwẹ̀nùmọ́ pẹ̀lú wọn, ó wọ inú tẹ́ńpìlì[a], ó sì ń kéde ìparí àwọn ọjọ́ ìwẹ̀nùmọ́, títí di ìgbà tí a fi rú ọrẹ náà[b] fún ẹnì kọ̀ọ̀kan wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a mú ọrẹ náà wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: mú àwọn ọkùnrin náà lọ pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pọ́ọ̀lù mú àwọn ọkùnrin náà bá ara rẹ̀ lọ; gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, kò sì fi ìtumọ̀ míì kún un.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: Ní ọjọ́ kejì
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ ọjọ́ tó tẹ̀ lé ọjọ́ ìṣẹ̀lẹ̀ àkọ́kọ́.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: lẹ́yìn tí ó ti ṣe ìwẹ̀nùmọ́ pẹ̀lú wọn
  rationale: “Ṣe ìwẹ̀nùmọ́” tọ́ka sí ìlànà ìwẹ̀nùmọ́ ti ẹ̀sìn, “pẹ̀lú wọn” sì pa ìtumọ̀ àjọṣe mọ́.
- source_word: εἰσῄει
  choice: ó wọ inú
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní imperfect, “ó wọ inú” ni Yorùbá ìtàn tó ṣe àdánidá jù; fífi “ń” sí “wọ” lè mú kí ìṣe náà dà bí ohun tó dúró ní àárín láìpé.
- source_word: τὸ ἱερόν
  choice: tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, a sì ṣàlàyé àlà rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: διαγγέλλων
  choice: ó sì ń kéde
  rationale: Ó ń ṣàpèjúwe ìfitónilétí tàbí ìkéde tí Pọ́ọ̀lù ṣe nípa ìlànà náà; àmì “ń” tún fi ìṣe tó ń lọ hàn.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: ìparí àwọn ọjọ́ ìwẹ̀nùmọ́ náà
  rationale: Gbólóhùn yìí pa èrò àkókò tí a yàn fún ìwẹ̀nùmọ́, àti bí ó ṣe dé òpin, mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἕως οὗ
  choice: títí ... fi
  rationale: Ìṣọ̀kan “títí ... fi” jẹ́ ọ̀nà Yorùbá àdánidá fún àmì òpin àkókò yìí.
- source_word: προσηνέχθη ... ἡ προσφορά
  choice: a fi mú ọrẹ wá
  rationale: Èyí pa ohùn àìlẹ́ni-lórúkọ (passive) mọ́, ó sì bá ọ̀rọ̀ ìrúbọ mu láì dín προσφορά kù sí ẹbọ ẹran nìkan.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: fún ẹnì kọ̀ọ̀kan wọn
  rationale: “Fún” sọ ìbáṣepọ̀ ọrẹ náà sí olúkúlùkù wọn ní kedere láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìtumọ̀ ipa Pọ́ọ̀lù nínú ìlànà ìwẹ̀nùmọ́ tẹ́ńpìlì
  choice: A sọ ìṣẹ̀lẹ̀ náà bí ìkópa Pọ́ọ̀lù nínú ìlànà ìwẹ̀nùmọ́ àwọn Júù, láì fi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Kí a kọ ọ́ lọ́nà tó fi hàn pé Pọ́ọ̀lù fọwọ́ sí ìlànà tẹ́ńpìlì fún gbogbo Kristẹni, tàbí pé ó tako rẹ̀.
  rationale: Ẹsẹ yìí ń ròyìn ohun tó ṣẹlẹ̀; kò dáhùn àríyànjiyàn tó gbòòrò nípa ipa Òfin tàbí ìlànà tẹ́ńpìlì fún àwọn Kristẹni.
- issue: Ìrísí imperfect nínú εἰσῄει
  choice: A lo “ó wọ inú” fún ìtàn tó ṣe àdánidá ní Yorùbá, nígbà tí “ó sì ń kéde” pa ìṣe tó ń bá a lọ mọ́.
  alternative: “Ó ń wọ inú tẹ́ńpìlì,” èyí tó lè tẹnu mọ́ ìṣe tó ń lọ tàbí tó ń tún ara rẹ̀ ṣe.
  rationale: Imperfect Gíríìkì ní àlà ìtumọ̀ tó lè jẹ́ ìṣe tó ń lọ tàbí ìṣe àyíká ìtàn. Yorùbá “ó ń wọ” lè dà bí ẹni pé kò parí wíwọlé; nítorí náà a yan ọ̀nà tó ṣe àdánidá láì kọ ẹ̀kọ́ pàtó sí aspect náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A ya gbólóhùn àkọ́kọ́ sí méjì kí ìtàn náà lè ṣàn dáadáa ní Yorùbá, láì yí ìtẹ̀lé ìṣẹ̀lẹ̀ padà. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé, dípò ibi tí wọ́n ṣìnà sí nínú consultation layer Gẹ̀ẹ́sì.
