id: ACT.21.24
reference: Acts 21:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: yo
  text: Mú àwọn ọkùnrin wọ̀nyí lọ pẹ̀lú rẹ[a], kí o sì ṣe ìwẹ̀nùmọ́ pẹ̀lú wọn; san ìnáwó fún wọn, kí wọn lè fá irun orí wọn. Nígbà náà, gbogbo ènìyàn yóò mọ̀ pé ohun tí wọ́n ti gbọ́ nípa rẹ kò ní ìpìlẹ̀, ṣùgbọ́n pé ìwọ fúnra rẹ pẹ̀lú ń gbé ìgbésí ayé rẹ ní ìbámu pẹ̀lú Òfin, tí o sì ń pa á mọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mú àwọn wọ̀nyí.” Àwọn ọkùnrin mẹ́rin tí ẹsẹ tó ṣáájú mẹ́nu kàn ni ọ̀rọ̀ náà ń tọ́ka sí.
    reason: contextual_clarification
  - marker: b
    text: Ní tààrà, “o ń rìn ní ìlà, tí o ń pa Òfin mọ́,” ìyẹn ni pé, o ń gbé ní ọ̀nà tó bá pípa Òfin mọ́ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Mú àwọn ọkùnrin wọ̀nyí lọ pẹ̀lú rẹ
  rationale: A fi “àwọn ọkùnrin” kún un láti inú ọ̀rọ̀ ẹsẹ tó ṣáájú, níbi tí a ti mẹ́nu kan àwọn ọkùnrin mẹ́rin; gbólóhùn náà sì sọ ìtumọ̀ παραλαμβάνω ní èdè Yorùbá àdánidá.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: kí o sì ya ara rẹ sí mímọ́ pẹ̀lú wọn
  rationale: Ó fi ìṣe ìwẹ̀nùmọ́ ti àṣà ẹ̀sìn hàn, ó sì pa ìtumọ̀ afẹ̀yìntì àti σύν mọ́.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: san owó tí wọn yóò ná
  rationale: Ó túmọ̀ sí jíjẹ́wọ́ láti ru ìnáwó wọn, ó ṣeé ṣe kí ó jẹ́ ìnáwó tó ní í ṣe pẹ̀lú ẹ̀jẹ́ wọn.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: kí wọn lè fá orí wọn
  rationale: Ó sọ ète tàbí àbájáde tí ἵνα ń tọ́ka sí; “orí wọn” jẹ́ ọ̀nà àdánidá láti sọ ẹyọ alápínpín Gíríìkì ní Yorùbá.
- source_word: γνώσονται πάντες
  choice: Nígbà náà, gbogbo ènìyàn yóò mọ̀
  rationale: “Nígbà náà” mú ìbáṣepọ̀ àbájáde inú ọ̀rọ̀ náà jáde lọ́nà àdánidá.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ohun tí wọ́n ti gbọ́ nípa rẹ
  rationale: κατηχέω lè túmọ̀ sí kíkọ́ni tàbí jíjíṣẹ́ ìròyìn fúnni; nínú àyíká yìí, ó tọ́ka sí ìròyìn tó ń tàn ká nípa Pọ́ọ̀lù.
- source_word: οὐδέν ἐστιν
  choice: kò sí òtítọ́ kan nínú
  rationale: Ó sọ pé àwọn ìròyìn náà kò ní ìpìlẹ̀, láì sọ ju ohun tí ọ̀rọ̀ náà ní lọ.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς
  choice: ṣùgbọ́n pé ìwọ fúnra rẹ pẹ̀lú ń gbé ìgbésí ayé rẹ ní ìbámu
  rationale: στοιχέω túmọ̀ sí rírìn tàbí gbígbé ní ìlà pẹ̀lú ohun kan; “ìwọ fúnra rẹ pẹ̀lú” pa ìtẹnumọ́ καὶ αὐτός mọ́.
- source_word: φυλάσσων τὸν νόμον
  choice: pẹ̀lú Òfin, tí o sì ń pa á mọ́
  rationale: A pa àwọn èrò méjèèjì—gbígbé ní ìbámu àti pípa Òfin mọ́—mọ́, dípò fífi ọ̀kan ṣoṣo rọ́pò méjèèjì.
- source_word: νόμον
  choice: Òfin
  rationale: Nínú àyíká, ó tọ́ka sí Òfin àwọn Júù; a kò fi “ti Mósè” kún un nítorí èyí yóò jẹ́ àlàyé tí kò sí ní tààrà nínú Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú Òfin nínú ìtàn yìí
  choice: 'A sọ ọ́ gẹ́gẹ́ bí ìwà tí àwọn ènìyàn lè rí: ó ń gbé ní ìbámu pẹ̀lú Òfin, ó sì ń pa á mọ́.'
  alternative: ìwọ fúnra rẹ pẹ̀lú ń pa Òfin mọ́
  rationale: Ẹsẹ náà sọ ohun tí àwọn ènìyàn yóò pinnu láti inú ìwẹ̀nùmọ́ Pọ́ọ̀lù àti ríru ìnáwó àwọn ọkùnrin náà. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn mìíràn wọlé láti yanjú bí èyí ṣe bá ohun tí Pọ́ọ̀lù kọ ní ibòmíràn mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ya ara rẹ sí mímọ́” fún ìwẹ̀nùmọ́ àṣà ẹ̀sìn, a sì kọ “Òfin” pẹ̀lú lẹ́tà ńlá láti fi ìtọ́kasí pàtó sí Òfin àwọn Júù hàn.
