  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: yo
  text: Nígbà tí a ń dúró níbẹ̀ fún ọjọ́ mélòó kan sí i, wòlíì kan tí orúkọ rẹ̀ ń jẹ́ Ágábù sọ̀kalẹ̀ láti Jùdíà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Nígbà tí a ... dúró níbẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle àsìkò nínú genitive absolute; ẹni tí a kò dárúkọ ní kedere ni Pọ́ọ̀lù àti àwọn alábàákẹ́gbẹ́ rẹ̀, nítorí náà ‘a’ bá àyíká ọ̀rọ̀ mu.
- source_word: δὲ
  choice: sì
  rationale: δέ ń fi ìyípadà kékeré nínú ìtàn hàn; ‘sì’ jẹ́ ọ̀nà àdánidá láti pa ìsopọ̀ náà mọ́ lẹ́yìn ‘Nígbà tí’.
- source_word: ἡμέρας πλείους
  choice: fún ọ̀pọ̀ ọjọ́ sí i
  rationale: Accusative yìí ń sọ bí àsìkò ṣe gùn. πλείους lè túmọ̀ sí ọjọ́ púpọ̀ tàbí ọjọ́ àfikún; ‘ọ̀pọ̀ ọjọ́ sí i’ pa èrò àfikún náà mọ́ láìfi iye pàtó kún un.
- source_word: κατῆλθέν
  choice: sọ̀kalẹ̀
  rationale: Ó pa àwòrán ìrìnàjò láti Jùdíà sọ̀kalẹ̀ sí etíkun mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: τις
  choice: kan
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àìsọ pàtó ni; ‘wòlíì kan’ jẹ́ èdè Yorùbá àdánidá fún fífi ẹni tuntun hàn.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: láti Jùdíà
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ibi tí ó ti wá.
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún ẹni tí ó ń sọ àsọtẹ́lẹ̀ tàbí ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run.
- source_word: ὀνόματι Ἅγαβος
  choice: tí orúkọ rẹ̀ ń jẹ́ Ágábù
  rationale: Ó tú ìlò dative ὀνόματι sí Yorùbá òde òní tí ó ṣe kedere, ó sì dá orúkọ Ἅγαβος sí fọ́ọ̀mù Yorùbá tó rọrùn láti kà.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní, tó ní ọlá, tó sì ṣe kedere. A lo ‘a’ nítorí apá ìtàn ‘àwa’ nínú àyíká ẹsẹ̀ yìí; a sì pa ìtọ́sọ́nà ‘sọ̀kalẹ̀’ àti ìtumọ̀ àfikún inú πλείους mọ́.
