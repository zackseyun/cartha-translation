id: ACT.21.28
reference: Acts 21:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: yo
  text: wọ́n ń ké pé, “Ẹ̀yin ọkùnrin Ísírẹ́lì, ẹ ṣèrànwọ́! Èyí ni ọkùnrin náà tí ó ń kọ́ gbogbo ènìyàn níbi gbogbo lòdì sí àwọn ènìyàn, òfin, àti ibi yìí. Kódà, ó ti mú àwọn Gíríìkì wọ inú tẹ́ńpìlì[a], ó sì ti sọ ibi mímọ́ yìí di aláìmọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì tàbí àwọn àgbàlá rẹ̀, kì í ṣe ibi mímọ́ inú nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: wọ́n ń ké pé
  rationale: Ó fi hàn pé ọ̀pọ̀ ènìyàn náà ń ké ẹ̀sùn wọn sókè ní gbangba; ìṣe tí ń lọ lọ́wọ́ nínú participle náà tún wà nínú ‘ń ké.’
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ẹ̀yin ọkùnrin ọmọ Ísírẹ́lì
  rationale: Ó pa ìpè taara sí àwọn ọkùnrin Ísírẹ́lì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó bójú mu.
- source_word: βοηθεῖτε
  choice: ẹ ṣèrànwọ́!
  rationale: Àṣẹ kúkúrú fún ìrànlọ́wọ́ ni; yíyan ọ̀rọ̀ yìí kò fi ẹni tí wọ́n fẹ́ kí a ràn lọ́wọ́ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Èyí ni ọkùnrin náà
  rationale: Ó pa agbára ìdánimọ̀ àti ẹ̀sùn inú gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: tí ó ń kọ́ ... lòdì sí àwọn ènìyàn wa, òfin àti ibi yìí
  rationale: ‘Lòdì sí’ dúró fún κατά pẹ̀lú genitive. ‘Àwọn ènìyàn wa’ mú kí ìtọ́ka sí àwọn Júù hàn kedere láti ẹnu àwọn olùfisùn, láì sọ ‘orílẹ̀-èdè’ tàbí fi ẹ̀kọ́ ẹ̀sìn kún un.
- source_word: πάντας πανταχῇ διδάσκων
  choice: tí ó ń kọ́ gbogbo ènìyàn níbi gbogbo
  rationale: Ó pa ìtẹnumọ́ méjèèjì—gbogbo ènìyàn àti níbi gbogbo—mọ́.
- source_word: ἔτι τε καὶ
  choice: Kódà
  rationale: Ó fi ẹ̀sùn míì tí ó le sí i kún ti àkọ́kọ́ ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: Ἕλληνας
  choice: àwọn Gíríìkì
  rationale: Gíríìkì sọ àwọn Hellene ní pàtó, kì í ṣe gbogbo àwọn Kèfèrí lápapọ̀.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: ó ti mú àwọn Gíríìkì wọ inú tẹ́ńpìlì[a]
  rationale: ‘Ó ti mú ... wọ’ sọ ìṣe tí wọ́n fi kàn án hàn. ‘Tẹ́ńpìlì’ jẹ́ àdánidá nínú ọ̀rọ̀ àkọ́kọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé pé ἱερόν túmọ̀ sí gbogbo àgbègbè rẹ̀.
- source_word: κεκοίνωκεν
  choice: ó sì ti sọ ... di aláìmọ́
  rationale: Nínú ọ̀rọ̀ ìjọsìn, κοινόω túmọ̀ sí mímú ohun mímọ́ di aláìmọ́ tàbí àìyẹ; yíyan yìí pa ẹ̀sùn ìbàjẹ́ ìwà mímọ́ mọ́.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ibi mímọ́ yìí
  rationale: Ó pa mímọ́ ibi náà àti ìtẹnumọ́ demonstrative ‘yìí’ mọ́.
theological_decisions:
- issue: Ìtọ́ka τοῦ νόμου
  choice: òfin
  alternative: Òfin Mósè
  rationale: Àyíká Jerúsálẹ́mù fi hàn pé òfin àwọn Júù ni wọ́n ń tọ́ka sí, ṣùgbọ́n Gíríìkì kò darúkọ Mósè níbí. ‘Òfin’ pa ìtọ́ka náà mọ́ láì fi ọ̀rọ̀ kún un.
- issue: Ìtumọ̀ ἱερόν
  choice: tẹ́ńpìlì nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé ìsàlẹ̀
  alternative: àgbègbè tẹ́ńpìlì
  rationale: ἱερόν lè tọ́ka sí gbogbo àgbègbè àti àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú lọ́hùn-ún nìkan. Ọ̀rọ̀ àkọ́kọ́ dúró ní àdánidá, àlàyé sì pa ìyàtọ̀ yìí mọ́.
- issue: Agbára ẹ̀sùn κεκοίνωκεν
  choice: sọ ibi mímọ́ yìí di aláìmọ́
  alternative: ba ibi mímọ́ yìí jẹ́
  rationale: Yíyan náà fi ìtumọ̀ àìmọ́ ní ti ìjọsìn hàn, láì pinnu fún òǹkàwé bóyá ẹ̀sùn àwọn olùfisùn náà jẹ́ òótọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa ìró ẹ̀sùn pajawiri mọ́, láì sọ pé ẹ̀sùn náà jẹ́ òótọ́.
