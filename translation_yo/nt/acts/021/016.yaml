id: ACT.21.16
reference: Acts 21:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: yo
  text: Àwọn kan lára àwọn ọmọ-ẹ̀yìn láti Kesaria sì bá wa lọ, wọ́n ń mú wa lọ sọ́dọ̀ Mínásónì kan, ará Kípírọ́sì, ọmọ-ẹ̀yìn tó ti pẹ́,[b] ẹni tí a óò dúró sí ilé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ẹni tí a lè gbé gẹ́gẹ́ bí àlejò ní ilé rẹ̀,” tàbí “wọ́n ń mú wa lọ sí ilé Mínásónì.” Ọ̀rọ̀ Gíríìkì náà lè ṣàpèjúwe ìdarí wọn lọ sọ́dọ̀ Mínásónì, ẹni tí yóò gba wa sí ilé, ní àwọn ọ̀nà tó jọra wọ̀nyí.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí, “ọmọ-ẹ̀yìn láti ìgbà ìbẹ̀rẹ̀.” Ó ṣeé ṣe kí èyí túmọ̀ sí pé Mínásónì ti jẹ́ ọmọ-ẹ̀yìn fún ìgbà pípẹ́, bóyá láti àwọn ọjọ́ ìbẹ̀rẹ̀ ìgbàgbọ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον … σὺν ἡμῖν
  choice: bá wa lọ
  rationale: Ó sọ ìrìn-àjò papọ̀ àti fífi ara mọ́ ẹgbẹ́ náà ní Yorùbá àdánidá.
- source_word: τῶν μαθητῶν
  choice: àwọn kan lára àwọn ọmọ-ẹ̀yìn
  rationale: Ìsọ̀rí apá kan nínú gbogbo ẹgbẹ́ tó wà nínú Gíríìkì ni a mú jáde ní kedere.
- source_word: ἀπὸ Καισαρείας
  choice: láti Kesaria
  rationale: Ó tọ́ka sí ibi tí àwọn ọmọ-ẹ̀yìn náà ti wá.
- source_word: ἄγοντες
  choice: wọ́n ń mú wa lọ sọ́dọ̀
  rationale: Ó pa èrò ìdarí tàbí mímú àwọn arìnrìn-àjò lọ bá ẹni tí yóò gbà wọ́n sílẹ̀ mọ́.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: ẹni tí a óò dúró sí ilé rẹ̀
  rationale: Ó fi ète láti gba àlejò sí ilé hàn ní ọ̀nà Yorùbá tó ṣe kedere, láìfi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: Μνάσωνί τινι
  choice: Mínásónì kan
  rationale: “Kan” pa ìtumọ̀ ẹni tí a ṣẹ̀ṣẹ̀ ń dárúkọ mọ́; àkọtọ̀ náà sì mú orúkọ Gíríìkì Μνάσων sun mọ́ ìpè rẹ̀.
- source_word: Κυπρίῳ
  choice: ará Kípírọ́sì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tó jẹ́ ọmọ ilẹ̀ Kípírọ́sì.
- source_word: ἀρχαίῳ μαθητῇ
  choice: ọmọ-ẹ̀yìn láti ìgbà àtijọ́
  rationale: Ó pa ìṣòro ìtumọ̀ mọ́ láàárín ẹni tó ti pẹ́ gẹ́gẹ́ bí ọmọ-ẹ̀yìn àti ẹni tó ti jẹ́ ọmọ-ẹ̀yìn láti ìbẹ̀rẹ̀ ìgbà ìgbàgbọ́ náà.
theological_decisions:
- issue: Ìtumọ̀ ἀρχαίῳ μαθητῇ
  choice: ọmọ-ẹ̀yìn láti ìgbà àtijọ́
  alternative: ọmọ-ẹ̀yìn tó ti pẹ́
  rationale: Àṣàyàn yìí kò fipá mú un pé Mínásónì wà lára àwọn ọmọ-ẹ̀yìn àkọ́kọ́ gan-an, ó sì tún pa ìtumọ̀ pé ó ti jẹ́ ọmọ-ẹ̀yìn fún ìgbà pípẹ́ mọ́.
translation_notes:
  register: Yorùbá ọ̀nà-ìbánisọ̀rọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “dúró sí ilé rẹ̀” fún àlejò/lílọ wọ̀ sí ilé, a sì pa àìdánilójú ἀρχαίῳ mọ́ nínú àkọsílẹ̀ ìsàlẹ̀.
