  source_fidelity: Ìtumọ̀ náà ń fi ìpín kan nínú àwọn ọmọ-ẹ̀yìn, ìbẹ̀rẹ̀ wọn láti Kesaria, ìrìn-àjò wọn pẹ̀lú ẹgbẹ́ náà, Mínásónì ẹni ará Kípírọ́sì, àti èrò ibùgbé ní ilé rẹ̀ hàn dáadáa. Ṣùgbọ́n “ọmọ-ẹ̀yìn láti ìgbà àtijọ́” lè dámọ̀ràn pé ó jẹ́ ti ìgbà ayé àtijọ́, dípò ìtumọ̀ ἀρχαίῳ μαθητῇ pé ó ti pẹ́ nínú jíjẹ́ ọmọ-ẹ̀yìn.
  naturalness: “Ọmọ-ẹ̀yìn tó ti pẹ́” jẹ́ Yorùbá òde òní tó rọrùn, tó sì bá ọ̀rọ̀ inú àyíká mu ju “láti ìgbà àtijọ́” lọ. Àtúnṣe kékeré nínú àlàyé ìsàlẹ̀ a tún mú kí “wọ̀ sí” má ṣe dà bí wíwọlé nìkan, ṣùgbọ́n kí ó túmọ̀ sí gbígbàlejò.
