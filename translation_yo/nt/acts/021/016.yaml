  to: Àwọn kan lára àwọn ọmọ-ẹ̀yìn láti Kesaria sì bá wa lọ, wọ́n ń mú wa lọ sọ́dọ̀ Mínásónì kan, ará Kípírọ́sì, ọmọ-ẹ̀yìn tó ti pẹ́,[b] ẹni tí a óò dúró sí ilé rẹ̀.[a]
