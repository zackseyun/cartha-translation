source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: yo
  text: Nígbà náà ni olórí ẹgbẹ́ ọmọ-ogun náà[a] sún mọ́ ọn, ó gbá a mú, ó sì pàṣẹ pé kí wọ́n fi ẹ̀wọ̀n méjì dè é[b]; ó sì ń béèrè pé ta ni ó jẹ́ àti ohun tí ó ti ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì χιλίαρχος túmọ̀ sí “olórí ẹgbẹ̀rún ọmọ-ogun”; ó ń tọ́ka sí ọ̀gá ọmọ-ogun Róòmù kan.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ̀wọ̀n méjì” lè mú àsọtẹ́lẹ̀ ní Ìṣe 21:11 wá sí ọkàn, níbi tí a ti sọ pé a ó dè Pọ́ọ̀lù ní Jerúsálẹ́mù.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: olórí ẹgbẹ́ ọmọ-ogun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ọmọ-ogun Róòmù kan tí ó ní àṣẹ lórí ẹgbẹ́ ọmọ-ogun; yíyan ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé òde òní láì lo orúkọ ipò Róòmù tí ọ̀pọ̀ ènìyàn kò mọ̀.
- source_word: ἐγγίσας
  choice: sún mọ́ ọn
  rationale: Ó fi hàn pé olórí náà kọ́kọ́ sún mọ́ Pọ́ọ̀lù kí ó tó gbá a mú, gẹ́gẹ́ bí participle aorist inú Gíríìkì.
- source_word: ἐπελάβετο αὐτοῦ
  choice: ó gbá a mú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni aláṣẹ fi agbára mú ẹnì kan ní ipò ìmúni.
- source_word: ἐκέλευσε δεθῆναι
  choice: ó pàṣẹ pé kí wọ́n ... dè é
  rationale: Ó pa agbára àṣẹ náà mọ́, ó sì tún fi ohùn àìṣe-taara ti δεθῆναι hàn ní Yorùbá àdánidá.
- source_word: ἁλύσεσι δυσί
  choice: ẹ̀wọ̀n méjì
  rationale: Yíyan yìí túmọ̀ iye àti ohun ìdè náà ní ṣókí, ó sì yẹ fún àyíká ìmúni.
- source_word: ἐπυνθάνετο
  choice: ó ń béèrè
  rationale: Àmì ‘ń’ ń pa ìtumọ̀ imperfect mọ́ pé ìbéèrè náà ń lọ lọ́wọ́ ní àárín ariwo náà.
- source_word: τίς εἴη
  choice: ẹni tí ó jẹ́
  rationale: Èyí jẹ́ ìbéèrè àìṣe-taara ní Yorùbá nípa ẹni tí Pọ́ọ̀lù jẹ́, láì fi ìṣiyèméjì kún ọ̀rọ̀ náà.
- source_word: τί ἐστιν πεποιηκώς
  choice: ohun tí ó ti ṣe
  rationale: ‘Ti ṣe’ fi iṣẹ́ tí a ti parí ṣùgbọ́n tí àbájáde rẹ̀ ṣì ṣe pàtàkì hàn, gẹ́gẹ́ bí perfect Gíríìkì.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe, olóhùn kíkún, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ‘olórí ẹgbẹ́ ọmọ-ogun’ dípò orúkọ ipò Róòmù tí ó jẹ́ àjèjì, a sì pa ìlọsíwájú ìbéèrè àti ìtumọ̀ perfect Gíríìkì mọ́.
