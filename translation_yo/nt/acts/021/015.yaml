  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: yo
  text: Lẹ́yìn àwọn ọjọ́ wọ̀nyí, a múra sílẹ̀[a], a sì gòkè lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kó ẹrù wa jọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímúra fún ìrìn àjò lápapọ̀, kì í ṣe kíkó ẹrù nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Lẹ́yìn àwọn ọjọ́ wọ̀nyí
  rationale: Μετά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí àkókò tí ó tẹ̀ lé e. Ìtumọ̀ yìí dúró nítòsí Gíríìkì, ó sì tọ́ka sí àwọn ọjọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐπισκευασάμενοι
  choice: a múra sílẹ̀
  rationale: Participle náà lè túmọ̀ sí mímúra tàbí pípèsè ara ẹni fún ìrìn àjò, ó sì lè ní kíkó ẹrù sínú. ‘A múra sílẹ̀’ jẹ́ Yorùbá àdánidá tí kò fi ìtumọ̀ náà mọ́ kíkó ẹrù nìkan.
- source_word: ἀνεβαίνομεν
  choice: a sì gòkè lọ
  rationale: Imperfect náà ń ròyìn ìrìn àjò ní àkókò tí ó ti kọjá. ‘Gòkè lọ’ pa ìtọ́sọ́nà àti ìrísí àṣà ti lílọ sí Jerúsálẹ́mù mọ́.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: εἰς ń fi ìlọ sí ibi kan hàn; ‘sí Jerúsálẹ́mù’ ni ọ̀nà Yorùbá tí ó ṣe déédé jù lọ nínú ìtàn ìrìn àjò.
theological_decisions: []
