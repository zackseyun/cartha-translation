translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Dà rú” jẹ́ ọ̀rọ̀ àdánidá fún ìdàrúdàpọ̀ ìlú; “àgbègbè tẹ́ńpìlì” sì yàgò fún dídín ἱερόν kù sí ibi mímọ́ inú ilé nìkan.
