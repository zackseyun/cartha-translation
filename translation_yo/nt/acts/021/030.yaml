  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: yo
  text: Gbogbo ìlú náà sì dà rú, àwọn ènìyàn sì rọ̀ wá kóra jọ[a]. Wọ́n di Pọ́ọ̀lù mú, wọ́n sì ń wọ́ ọ jáde kúrò ní àgbègbè tẹ́ńpìlì[b]; lẹ́sẹ̀kẹsẹ̀ ni a sì pa àwọn ilẹ̀kùn mọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn sì sáré péjọ.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe bí ọ̀pọ̀ ènìyàn ṣe rọ̀ wá sí ibi kan ní òjijì.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí ọgbà tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn ẹnubodè.” Ní àyíká tẹ́ńpìlì yìí, ọ̀rọ̀ náà lè tọ́ka sí àwọn ilẹ̀kùn tàbí àwọn ẹnubodè tí a fi ń wọlé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη ... ἡ πόλις ὅλη
  choice: Gbogbo ìlú náà sì dà rú
  rationale: Ọ̀rọ̀ yìí fi ìdàrúdàpọ̀ gbogbo ìlú hàn, kì í ṣe pé ìlú náà kàn ṣí láti ibì kan lọ sí ibòmíràn.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: àwọn ènìyàn sì rọ́ wá kóra jọ
  rationale: Ó mú ìtumọ̀ ìpéjọpọ̀ àwọn ènìyàn ní kíákíá jáde ní Yorùbá àdánidá.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: Wọ́n di Pọ́ọ̀lù mú
  rationale: Ó ṣàfihàn mímú ènìyàn nípa ipá, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe túmọ̀ sí níhìn-ín.
- source_word: εἷλκον αὐτόν
  choice: wọ́n sì ń wọ́ ọ
  rationale: Àmì “ń” pa ìṣe tí ó ń lọ lọ́wọ́ tí àkókò imperfect Gíríìkì fi hàn mọ́.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: jáde kúrò ní àgbègbè tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè tàbí ọgbà tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ìtumọ̀ àkókò kíákíá náà ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: ni a sì ti àwọn ilẹ̀kùn
  rationale: Ìlò “a” aláìlẹ́ni-pàtó pa ohùn àìṣe Gíríìkì mọ́ láìfi ẹni tí ó ti ilẹ̀kùn kún ọ̀rọ̀ náà.
