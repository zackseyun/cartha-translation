source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: yo
  text: Lẹ́yìn tí a rí Kípírọ̀[a], tí a sì fi í sí apá òsì wa[b], a sì fi ọkọ̀ ojú omi náà lọ sí Síríà, a sì sọ̀kalẹ̀ sí Tírè[c], nítorí ibẹ̀ ni ọkọ̀ ojú omi náà ti ń kó ẹrù rẹ̀ kalẹ̀[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí Kípírọ̀ hàn sí wa.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “tí a fi í sí òsì”; ìyẹn ni pé Kípírọ̀ wà ní apá òsì wa bí a ti ń lọ.
    reason: cultural_note
  - marker: c
    text: Tàbí, “a sì dé Tírè.” Èdè Gíríìkì sọ ní tààràtà pé, “a sì sọ̀kalẹ̀ sí Tírè.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “nítorí ibẹ̀ ni a ti ń tú ẹrù kúrò nínú ọkọ̀ ojú omi náà,” tàbí, “níbi tí wọ́n ti ń tú ọkọ̀ ojú omi náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Lẹ́yìn tí a rí
  rationale: Ọ̀rọ̀ náà jẹ́ aorist participle, ó sì tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìrìn ọkọ̀ ojú omi náà. ‘Lẹ́yìn tí a rí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé erékùṣù náà wọ ojú wọn.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: tí a sì fi í sí apá òsì wa
  rationale: εὐώνυμον túmọ̀ sí ‘ní apá òsì.’ Gbólóhùn yìí pa àwòrán ìtọ́sọ́nà ọkọ̀ ojú omi mọ́ láìlo ọ̀rọ̀ iṣẹ́ atukọ̀ tí ọ̀pọ̀ ènìyàn kò mọ̀.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: a wọ ọkọ̀ ojú omi lọ sí Síríà
  rationale: Èyí sọ ìrìn tí ó ń bá a lọ nípasẹ̀ ọkọ̀ ojú omi ní Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: κατήλθομεν εἰς Τύρον
  choice: a sì sọ̀kalẹ̀ sí Tírè
  rationale: ‘Sọ̀kalẹ̀ sí’ pa ìtumọ̀ ìtọ́sọ́nà κατέρχομαι mọ́, bí ó tilẹ̀ jẹ́ pé ní àyíká yìí ó tún lè túmọ̀ sí pé wọ́n dé ibẹ̀.
- source_word: ἀποφορτιζόμενον
  choice: ti ń kó ... kalẹ̀
  rationale: Present middle/passive participle pẹ̀lú ἦν fi iṣẹ́ tí ó ń lọ lọ́wọ́ hàn. Yorùbá lè fi ọkọ̀ náà ṣe olùṣe ní ọ̀nà àdánidá, ṣùgbọ́n fọ́ọ̀mù Gíríìkì tún gba ìtumọ̀ pé a ń tú ọkọ̀ náà.
- source_word: τὸν γόμον
  choice: ẹrù rẹ̀
  rationale: γόμος ni ẹrù tàbí ọjà tí ọkọ̀ ojú omi gbé; ‘ẹrù rẹ̀’ ṣe ìbáṣepọ̀ rẹ̀ pẹ̀lú ọkọ̀ náà kedere.
