translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A pa àwọn àmì ohùn mọ́ níbi tí wọ́n ti yẹ, a sì yàgò fún ọ̀rọ̀ iṣẹ́ atukọ̀ tí ó le koko.
