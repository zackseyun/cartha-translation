id: ACT.21.29
reference: Acts 21:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: yo
  text: Nítorí wọ́n ti rí Tirofimu ará Efesu pẹ̀lú rẹ̀ nínú ìlú ṣáájú, wọ́n sì rò pé Paulu ti mú un wọ inú tẹ́ńpìlì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “tẹ́ńpìlì” níbí lè tọ́ka sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: wọ́n ti rí ... ṣáájú
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tọ́ka sí ohun tí wọ́n ti rí tẹ́lẹ̀ ṣáájú ìṣẹ̀lẹ̀ tí a ń sọ̀rọ̀ rẹ̀; “ti rí ... ṣáájú” sọ ìbátan àkókò náà ní Yorùbá àdánidá.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Tirofimu ará Efesu
  rationale: Ọ̀rọ̀ Ἐφέσιον ń fi ìlú ìbílẹ̀ Tirofimu hàn; “ará Efesu” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ẹni tí ó wá láti Efesu.
- source_word: ἐν τῇ πόλει
  choice: nínú ìlú
  rationale: πόλις tọ́ka sí ìlú Jerusalẹmu gẹ́gẹ́ bí ibi tí ó yàtọ̀ sí àgbègbè tẹ́ńpìlì; “nínú ìlú” jẹ́ ìtumọ̀ tààrà tí ó sì bójú mu.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Èyí túmọ̀ σύν pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ rẹ̀ ní ṣókí; “rẹ̀” ń tọ́ka sí Paulu gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἐνόμιζον
  choice: wọ́n rò pé
  rationale: νομίζω níbí ń sọ ìpinnu tí wọ́n fà jáde láti inú ohun tí wọ́n rí, kì í ṣe ohun tí wọ́n mọ̀ dájú; “wọ́n rò pé” pa àìdájú náà mọ́.
- source_word: εἰς τὸ ἱερὸν
  choice: wọ inú tẹ́ńpìlì
  rationale: ἱερόν lè tọ́ka sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ àdánidá nínú àkọsílẹ̀ pàtàkì, tí àlàyé ìsàlẹ̀ sì ń pa ìtumọ̀ gbooro rẹ̀ mọ́.
- source_word: εἰσήγαγεν
  choice: ti mú un wọ
  rationale: Gbólóhùn yìí sọ pé, gẹ́gẹ́ bí èrò wọn, Paulu ti mú Tirofimu wọ ibẹ̀; “ti mú un wọ” jẹ́ Yorùbá àdánidá tí ó pa ìṣe ìwọlé náà mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìdí tí ẹ̀sùn inú àyíká ọ̀rọ̀ fi dìde; “Nítorí” pa ipa ìṣàlàyé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἱερόν nínú ẹ̀sùn tí wọ́n fi kan Paulu
  choice: A lo “tẹ́ńpìlì” nínú ẹsẹ̀, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì.
  alternative: “àwọn àgbàlá tẹ́ńpìlì” tàbí “àgbègbè tẹ́ńpìlì” nínú ẹsẹ̀ pàápàá
  rationale: Yíyan “tẹ́ńpìlì” mú kí ẹsẹ̀ rọrùn láti kà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìpéye ìtàn mọ́, láìfi hàn pé ẹ̀sùn náà dá lórí pé wọ́n mú un dé ibi mímọ́ inú tẹ́ńpìlì nìkan.
translation_notes:
  register: 'Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé Yorùbá òde òní. Àwọn orúkọ ni a kọ ní ìrísí Yorùbá tí ó wọ́pọ̀: Tirofimu, Efesu, àti Paulu.'
