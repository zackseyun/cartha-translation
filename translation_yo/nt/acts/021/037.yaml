  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà dá ọ̀pọ̀ ìtumọ̀ Gíríìkì pàtàkì dúró dáadáa: a pa ìṣe aláìṣiṣẹ́-taara náà mọ́, παρεμβολή jẹ́ ibi/àgọ́ ọmọ ogun, àti ìbéèrè nípa mímọ èdè Gíríìkì jẹ́ olóòtọ́. Síbẹ̀, “wọ́n ti fẹ́ mú” lè túmọ̀ sí pé wọ́n ní ìfẹ́ láti mú un, kì í ṣe pé ìmúwọlé rẹ̀ ti fẹ́rẹ̀ẹ́ ṣẹlẹ̀; a nílò “fẹ́rẹ̀ẹ́” láti sọ ìsúnmọ́ ìṣẹ̀lẹ̀ (μέλλων) ní kedere. Ìdáhùn kejì tún nílò kí a darúkọ ọ̀gágun náà kedere, nítorí ẹni tí ó sọ ọ́ ni ọ̀gágun, kì í ṣe Paulu.'
  naturalness: “Nígbà tí wọ́n fẹ́rẹ̀ẹ́ mú...” jẹ́ Yorùbá àdánidá, ó sì sọ ìmọ́tòsí ìṣẹ̀lẹ̀ náà dáadáa. “Ṣé mo ní àṣẹ láti...” jẹ́ ọ̀nà ìbéèrè ìyọ̀ǹda tó rọrùn, tó sì bójú mu. Sísọ “Ọ̀gágun náà” ní ìbẹ̀rẹ̀ ìdáhùn rẹ̀ mú kí ìtàn náà yege láìsí àìdánilójú olùsọ̀rọ̀.
  terminology: “Ibùdó àwọn ọmọ ogun” yẹ fún παρεμβολή nínú àyíká yìí. “Ọ̀gágun” jẹ́ ọ̀rọ̀ tó yege fún χιλίαρχος, bí ó tilẹ̀ jẹ́ pé oyè Róòmù pàtó náà jẹ́ tribune; àlàyé ẹsẹ̀ ìsàlẹ̀ ń ṣàfikún àyíká ológun náà láìṣe ìdíwọ̀ fún ìtàn.
