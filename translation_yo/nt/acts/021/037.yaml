language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: yo
  text: Nígbà tí wọ́n fẹ́rẹ̀ẹ́ mú Paulu wọ inú ibùdó àwọn ọmọ ogun[a], ó sọ fún ọ̀gágun pé, “Ṣé mo ní àṣẹ láti sọ nǹkan kan fún ọ?” Ọ̀gágun náà sì wí pé, “Ṣé o mọ èdè Gíríìkì?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ibùdó àwọn ọmọ ogun” níhìn-ín tọ́ka sí ibùgbé àwọn ọmọ ogun Róòmù, ó sì ṣeé ṣe kí ó wà nínú agbo ilé olódi náà.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Bí wọ́n sì ti fẹ́ mú Paulu wọ inú
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìṣe náà fẹ́ ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀, ó sì pa ìtumọ̀ aláìṣe-taara ti εἰσάγεσθαι mọ́ nípa lílo ‘wọ́n ... mú ... wọ inú.’
- source_word: παρεμβολή
  choice: ibùdó àwọn ọmọ ogun
  rationale: Nínú àyíká Jerúsálẹ́mù yìí, ọ̀rọ̀ náà tọ́ka sí ibi tí àwọn ọmọ ogun Róòmù ń gbé, ó ṣeé ṣe kí ó wà nínú ilé olódi náà.
- source_word: χιλίαρχος
  choice: ọ̀gágun
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè ọ̀gá ọmọ ogun Róòmù kan. ‘Ọ̀gágun’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ọ̀gá ológun gíga.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Ṣé a yọ̀ǹda fún mi láti sọ nǹkan kan fún ọ?
  rationale: Ìtumọ̀ yìí pa èrò ìbéèrè fún àṣẹ mọ́, ó sì jẹ́ ọ̀nà àdánidá tí ẹni ń gbà béèrè ìyọ̀ǹda ní Yorùbá.
- source_word: τι
  choice: nǹkan kan
  rationale: Aṣojú arọ́pò-orúkọ aláìnípàtó náà túmọ̀ sí ‘nǹkan kan’ ní àyíká yìí.
- source_word: Ἑλληνιστί
  choice: èdè Gíríìkì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ní èdè Gíríìkì’; pẹ̀lú γινώσκεις, Yorùbá àdánidá ni ‘mọ èdè Gíríìkì.’
- source_word: γινώσκεις
  choice: o mọ
  rationale: Yíyan ‘mọ’ pa ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ náà mọ́, láì fi dandan sọ pé sísọ tàbí òye nìkan ni ó túmọ̀ sí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé lóye ni a lò. ‘Ṣé’ mú ìjíròrò náà dà bí ọ̀rọ̀ ẹnu àdánidá, nígbà tí ‘a yọ̀ǹda fún mi’ pa ìtumọ̀ ìbéèrè àṣẹ mọ́. A lo ‘ọ̀gágun’ dípò àyálò ọ̀rọ̀ oyè Róòmù, nítorí ó ye òǹkàwé Yorùbá lónìí.
