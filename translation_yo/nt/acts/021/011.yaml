id: ACT.21.11
reference: Acts 21:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: yo
  text: 'Ó sì wá sọ́dọ̀ wa, ó mú àmùrè Pọ́ọ̀lù, ó sì fi í di ẹsẹ̀ àti ọwọ́ ara rẹ̀, ó wí pé, “Báyìí ni Ẹ̀mí Mímọ́ wí: ‘Báyìí ni àwọn Júù ní Jerúsálẹ́mù yóò ṣe di ọkùnrin tí àmùrè yìí jẹ́ tirẹ̀, wọn yóò sì fi í lé àwọn tí kì í ṣe Júù lọ́wọ́.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: àmùrè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àmùrè tàbí aṣọ tí a fi ń dì mọ́ ìbàdí; “àmùrè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: ó fi di ẹsẹ̀ àti ọwọ́ ara rẹ̀
  rationale: ἑαυτοῦ jẹ́ arọ́pò-orúkọ afẹ̀yìntì tó tọ́ka sí Ágábù fúnra rẹ̀; lílo “di” tún pa ìbáṣepọ̀ mọ́ δήσουσιν tó wà lẹ́yìn náà.
- source_word: Τάδε λέγει
  choice: Báyìí ni ... wí
  rationale: Èyí pa ìlànà ọ̀rọ̀ àsọtẹ́lẹ̀ mímọ́ mọ́, ó sì jẹ́ Yorùbá àdánidá tó ní iyì.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bá orúkọ náà mu láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: Τὸν ἄνδρα
  choice: ọkùnrin
  rationale: ἀνήρ níbí ń tọ́ka sí ọkùnrin àgbà kan pàtó, ìyẹn Pọ́ọ̀lù.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: tí àmùrè yìí jẹ́ tirẹ̀
  rationale: Ó fi ìbáṣepọ̀ ohun-ìní tí οὗ sọ hàn ní Yorùbá tó ṣe kedere.
- source_word: οὕτως
  choice: Báyìí ni ... yóò ṣe
  rationale: Ó so ìṣe àmì tí Ágábù ṣe mọ́ ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Gíríìkì sọ “àwọn Júù” láìdín ìtọ́kasí náà kù sí àwọn aṣáájú wọn nìkan.
- source_word: παραδώσουσιν
  choice: wọn yóò fi í lé ... lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi ìfijọ̀wọ́ tàbí fífi ẹnì kan sábẹ́ agbára ẹlòmíràn hàn ní Yorùbá àdánidá.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: lé àwọn Kèfèrí lọ́wọ́
  rationale: Ó pa àwòrán “sí ọwọ́” mọ́ gẹ́gẹ́ bí fífi ẹni náà sábẹ́ agbára àwọn tí kì í ṣe Júù.
theological_decisions:
- issue: Ìtúmọ̀ ọ̀nà àsọtẹ́lẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ taara láti ọ̀dọ̀ Ẹ̀mí
  choice: Báyìí ni Ẹ̀mí Mímọ́ wí
  alternative: Èyí ni ohun tí Ẹ̀mí Mímọ́ sọ
  rationale: Ìtumọ̀ tí a yàn tẹ̀ lé àpẹẹrẹ ọ̀rọ̀ àwọn wòlíì nínú Ìwé Mímọ́, ó sì pa ọlá àti àṣẹ ọ̀rọ̀ náà mọ́ láìfikún ẹ̀kọ́ mìíràn.
- issue: Ẹni tí ἑαυτοῦ ń tọ́ka sí
  choice: Ágábù di ẹsẹ̀ àti ọwọ́ ara rẹ̀
  alternative: Ágábù di ẹsẹ̀ àti ọwọ́ Pọ́ọ̀lù
  rationale: Arọ́pò-orúkọ afẹ̀yìntì náà ń tọ́ka sí olùṣe ìṣe náà, Ágábù; nítorí náà ó ṣe ìṣe àmì àsọtẹ́lẹ̀ sí ara rẹ̀.
translation_notes:
  register: Yorùbá àtẹ̀jáde, olóhùn mímọ́ tí ó tún ṣe kedere sí òǹkàwé òde òní. A lo “Báyìí ni ... wí” láti pa ìrísí ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́, a sì lo “Kèfèrí” ní ìtumọ̀ àyíká rẹ̀ fún àwọn tí kì í ṣe Júù. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
