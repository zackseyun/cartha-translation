revisions:
- from: 'Ó sì tọ̀ wá wá, ó mú àmùrè Pọ́ọ̀lù, ó fi di ẹsẹ̀ àti ọwọ́ ara rẹ̀, ó sì wí pé, “Báyìí ni Ẹ̀mí Mímọ́ wí: ‘Báyìí ni àwọn Júù ní Jerúsálẹ́mù yóò ṣe di ọkùnrin tí àmùrè yìí jẹ́ tirẹ̀, wọn yóò sì fi í lé àwọn Kèfèrí lọ́wọ́.’”[a]'
  to: 'Ó sì wá sọ́dọ̀ wa, ó mú àmùrè Pọ́ọ̀lù, ó sì fi í di ẹsẹ̀ àti ọwọ́ ara rẹ̀, ó wí pé, “Báyìí ni Ẹ̀mí Mímọ́ wí: ‘Báyìí ni àwọn Júù ní Jerúsálẹ́mù yóò ṣe di ọkùnrin tí àmùrè yìí jẹ́ tirẹ̀, wọn yóò sì fi í lé àwọn tí kì í ṣe Júù lọ́wọ́.’”'
  rationale: The revision corrects the malformed opening, explicitly retains the belt as the means of Agabus’s self-binding, and uses a neutral, contextually precise Yoruba expression for Gentiles. It preserves the source’s repeated demonstrative prophetic wording and all principal semantic elements.
  reviewer_model: gpt-5.6-terra
