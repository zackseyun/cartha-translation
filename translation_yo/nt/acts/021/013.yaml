  to: Nígbà náà ni Pọ́ọ̀lù dáhùn pé, “Kí ni ẹ̀ ń ṣe, tí ẹ̀ ń sunkún, tí ẹ sì ń fọ́ ọkàn mi túútúú[a]? Nítorí mo ti múra tán, kì í ṣe láti jẹ́ kí a dè mí nìkan, bí kò ṣe láti kú pẹ̀lú ní Jerusalẹmu nítorí orúkọ Olúwa Jésù[b].”
