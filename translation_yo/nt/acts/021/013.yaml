  naturalness: The register is generally natural and appropriately solemn. “Kí ni ẹ̀ ń ṣe yìí” is understandable, but “yìí” adds “this,” which is not expressed in the Greek. A direct Yoruba question with coordinated participial actions better preserves the source's rhetorical force. “Fọ́ ọkàn mi túútúú” effectively conveys the strong metaphor.
  terminology: “Olúwa” is the appropriate rendering of κύριος, and “orúkọ” rightly retains the biblical name idiom. “Olúwa Jésù” is the standard, natural title order in Yoruba.
