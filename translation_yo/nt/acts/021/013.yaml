id: ACT.21.13
reference: Acts 21:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: yo
  text: Nígbà náà ni Pọ́ọ̀lù dáhùn pé, “Kí ni ẹ̀ ń ṣe, tí ẹ̀ ń sunkún, tí ẹ sì ń fọ́ ọkàn mi túútúú[a]? Nítorí mo ti múra tán, kì í ṣe láti jẹ́ kí a dè mí nìkan, bí kò ṣe láti kú pẹ̀lú ní Jerusalẹmu nítorí orúkọ Olúwa Jésù[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ẹ sì ń tú ọkàn mi ká.” Ọ̀rọ̀-ìṣe Gíríìkì náà lágbára ju ìbànújẹ̀ lásán lọ; ó ya àwòrán ọkàn tí a ń fọ́ tàbí tí a ń tú ká.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ti orúkọ Olúwa Jésù.” Nínú Bíbélì, “orúkọ” lè tọ́ka sí Jésù fúnra rẹ̀, àṣẹ rẹ̀, àti iṣẹ́ tí a fi mọ̀ ọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ó jẹ́ ọ̀rọ̀ ìtàn tó wọ́pọ̀ fún fífi ìdáhùn sí ọ̀rọ̀ hàn, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: Τί ποιεῖτε
  choice: Kí ni ẹ̀ ń ṣe yìí
  rationale: Ó pa ìbéèrè tààrà àti ìtakò onífẹ̀ẹ́ ọkàn Pọ́ọ̀lù mọ́ láì yí i sí ‘Kí ló dé’.
- source_word: κλαίοντες
  choice: tí ẹ̀ ń sunkún
  rationale: Ó mú ìṣe tó ń lọ lọ́wọ́ àti ìbànújẹ̀ àwọn tó wà níbẹ̀ jáde ní èdè Yorùbá tó ṣe déédé.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: tí ẹ sì ń fọ ọkàn mi túútúú
  rationale: Ó pa àwòrán ọkàn tí a ń fọ́ mọ́, ‘túútúú’ sì mú agbára ọ̀rọ̀ Gíríìkì tó ju ìbànújẹ̀ lásán lọ hàn.
- source_word: δεθῆναι
  choice: láti jẹ́ kí a dè mí
  rationale: Ó pa ohùn àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ‘fi sẹ́wọ̀n’ kún ohun tí ọ̀rọ̀ náà sọ ní tààrà.
- source_word: ἀποθανεῖν
  choice: láti kú
  rationale: Ìtumọ̀ tààrà, kedere, tí kò nílò àlàyé àfikún.
- source_word: εἰς Ἰερουσαλὴμ
  choice: ní Jerusalẹmu
  rationale: Ní àyíká yìí, Jerusalẹmu ni ibi tí dídè àti ikú náà yóò ti ṣẹlẹ̀; ‘ní’ ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἑτοίμως ἔχω
  choice: mo ti múra tán
  rationale: Ó túmọ̀ àpólà náà gẹ́gẹ́ bí wíwà ní ìmúrasílẹ̀ pípé, ní èdè Yorùbá tó wọ́pọ̀.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: nítorí orúkọ
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì nípa ‘orúkọ’ mọ́, láì dín ìtumọ̀ rẹ̀ kù sí òkìkí tàbí orúkọ rere nìkan.
- source_word: κυρίου Ἰησοῦ
  choice: Jésù Olúwa
  rationale: ‘Olúwa’ ni akọ́lé Kristi tó yẹ fún κύριος; ètò ‘Jésù Olúwa’ sì jẹ́ èdè Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Títúmọ̀ κύριος gẹ́gẹ́ bí akọ́lé Jésù
  choice: Jésù Olúwa
  alternative: Jésù Ọ̀gá
  rationale: ‘Olúwa’ pa ìwọ̀n àti ìtumọ̀ Kristi ti akọ́lé náà mọ́; ‘Ọ̀gá’ lè sọ ọ́ di akọ́lé ojoojúmọ́ tó rọrùn jù.
- issue: Pípa àpólà ‘orúkọ’ mọ́
  choice: nítorí orúkọ Jésù Olúwa
  alternative: nítorí Jésù Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí ‘orúkọ,’ èyí tó lè dúró fún Jésù fúnra rẹ̀, àṣẹ rẹ̀, àti iṣẹ́ tí a fi mọ̀ ọ́n. Títúmọ̀ rẹ̀ sí Jésù nìkan yóò mú ìjinlẹ̀ àpólà náà kúrò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn níbi tó bá yẹ, a pa ìbéèrè Pọ́ọ̀lù, àwòrán ọkàn tí a ń fọ́, àti àpólà Bíbélì nípa ‘orúkọ’ mọ́.
