  to: “Nígbà náà, ìwọ kì í ṣe ará Íjíbítì náà tí ó dá ìṣọ̀tẹ̀ sílẹ̀ ní ọjọ́ díẹ̀ sẹ́yìn, tí ó sì kó àwọn ọkùnrin apànìyàn ẹgbẹ̀rún mẹ́rin náà jáde lọ sí aginjù bí?”
  rationale: A fi ‘àwọn ọkùnrin’ kún ìtumọ̀ láti ṣàfihàn ἄνδρας ní kedere. A tún ṣàtúnṣe ọ̀rọ̀ àfidípò nínú àkọsílẹ̀ ìsàlẹ̀ kí ó lè tọ́ka sí àwọn tí ń lo ọ̀bẹ kékeré, kì í ṣe ẹni kan tó kan ní ọ̀bẹ.
