source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: yo
  text: “Nígbà náà, ìwọ kì í ṣe ará Íjíbítì náà tí ó dá ìṣọ̀tẹ̀ sílẹ̀ ní ọjọ́ díẹ̀ sẹ́yìn, tí ó sì kó àwọn ọkùnrin apànìyàn ẹgbẹ̀rún mẹ́rin náà jáde lọ sí aginjù bí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Nígbà náà, ìwọ kì í ṣe ... bí?
  rationale: Àkópọ̀ ọ̀rọ̀ náà fi ìparí èrò tí olórí ogun ń fà láti inú bí Paulu ṣe sọ èdè Gíríìkì hàn, ó sì wà ní ìrísí ìbéèrè. ‘Nígbà náà’ mú agbára ìtumọ̀ yìí jáde ní Yorùbá àdánidá.
- source_word: ὁ Αἰγύπτιος
  choice: ará Íjíbítì náà
  rationale: Atọ́ka náà tọ́ka sí ẹni kan tí a ti mọ̀, ẹni tí ó ṣeé ṣe kí òkìkí búburú rẹ̀ ti tàn. ‘Ará Íjíbítì náà’ pa ìdánimọ̀ pàtó yìí mọ́.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: ní ọjọ́ díẹ̀ sẹ́yìn
  rationale: Gbólóhùn náà túmọ̀ sí àkókò kúkúrú ṣáájú àsìkò ọ̀rọ̀; yíyan yìí jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi iye ọjọ́ kan pàtó kún un.
- source_word: ἀναστατώσας
  choice: dá ìṣọ̀tẹ̀ sílẹ̀
  rationale: Nínú àyíká ìṣèlú àti ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí mímú kí ìrúkèrúdò tàbí ìdìtẹ̀ bẹ̀rẹ̀, kì í ṣe rúdurùdu lásán.
- source_word: ἐξαγαγὼν
  choice: kó ... jáde lọ
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídarí tàbí mímú ẹgbẹ́ ènìyàn jáde láti ibì kan lọ sí ibòmíràn. Ìtumọ̀ yìí bá ọ̀nà Yorùbá mu, ó sì yẹ olórí ẹgbẹ́ kan.
- source_word: εἰς τὴν ἔρημον
  choice: lọ sí aginjù
  rationale: ἔρημος lè jẹ́ aṣálẹ̀ tàbí ilẹ̀ tí ènìyàn kò gbé. ‘Aginjù’ ní ìtumọ̀ fífẹ̀ tó yẹ, kò sì fi dandan mú kí a ronú nípa ilẹ̀ yanrìn nìkan.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: ẹgbẹ̀rún mẹ́rin náà
  rationale: Atọ́ka tó wà pẹ̀lú nọ́ńbà náà fi hàn pé ẹgbẹ́ pàtó kan ni. ‘Náà’ pa ìpàtó yẹn mọ́ láì mú kí gbolóhùn Yorùbá wuwo.
- source_word: τῶν σικαρίων
  choice: àwọn apànìyàn
  rationale: σικάριοι ń tọ́ka sí àwọn ọkùnrin tí a mọ̀ fún pípa ènìyàn pẹ̀lú ọ̀bẹ kékeré tí wọ́n fi pamọ́. ‘Àwọn apànìyàn’ sọ iṣẹ́ wọn di mímọ̀ fún òǹkàwé òde òní; àlàyé ìtàn àti ìtumọ̀ gangan wà ní àkọsílẹ̀ ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn kún inú ọ̀rọ̀ níbi tí ó bá yẹ. Ìbéèrè náà pa ìrísí ìfura àti ìparí èrò inú orísun Gíríìkì mọ́.
