id: ACT.6.7
reference: Acts 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: yo
  text: Ọ̀rọ̀ Ọlọ́run sì ń dàgbà, iye àwọn ọmọ-ẹ̀yìn ní Jerúsálẹ́mù sì ń pọ̀ sí i gidigidi, ọ̀pọ̀lọpọ̀ àwọn àlùfáà sì ń ṣègbọràn sí ìgbàgbọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń di olùgbọràn sí ìgbàgbọ́ náà.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ṣíṣe ìgbọràn sí ìhìn ìgbàgbọ́ tí àwọn Kristẹni ń kéde, kì í ṣe ìṣe ìgbẹ́kẹ̀lé inú ọkàn nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: Ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa àṣà ọ̀rọ̀ inú Bíbélì mọ́, ó sì lè tọ́ka sí ọ̀rọ̀ tàbí iṣẹ́ ìkéde tí ó ti ọ̀dọ̀ Ọlọ́run wá láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ηὔξανεν
  choice: ń dàgbà
  rationale: Àkókò imperfect fi ìdàgbàsókè tí ń bá a lọ hàn; ‘ń dàgbà’ tún pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: iye àwọn ọmọ-ẹ̀yìn ... ń pọ̀ sí i
  rationale: Ó fi ìtumọ̀ iye tí ń pọ̀ sí i hàn, ó sì pa ọ̀rọ̀ Lúkù fún àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: ἐν Ἰερουσαλὴμ
  choice: ní Jerúsálẹ́mù
  rationale: Ìtumọ̀ ibi tí ó ṣe tààrà.
- source_word: σφόδρα
  choice: gidigidi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá tí ó fi bí ìpọ̀sí náà ti pọ̀ tó hàn.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: àwọn àlùfáà púpọ̀
  rationale: Ó sọ pé iye àwọn àlùfáà náà pọ̀, ní ọ̀nà tí ó rọrùn, tí ó sì bá Yorùbá òde òní mu.
- source_word: ὑπήκουον
  choice: ń ṣègbọràn sí
  rationale: Ó túmọ̀ ìgbọràn tààrà, imperfect náà sì hàn nínú àmì ìṣe tí ń lọ lọwọ ‘ń’.
- source_word: τῇ πίστει
  choice: ìgbàgbọ́ náà
  rationale: Ó pa article àti àìdánilójú Gíríìkì mọ́, ó sì lè tọ́ka sí ìgbàgbọ́ gẹ́gẹ́ bí iṣẹ́ ìgbẹ́kẹ̀lé tàbí sí ọ̀rọ̀ ìgbàgbọ́ tí a ń kéde.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú τῇ πίστει
  choice: ìgbàgbọ́ náà
  alternative: ìgbàgbọ́; ọ̀rọ̀ ìgbàgbọ́ náà
  rationale: Àyíká ọ̀rọ̀ lè fi ‘ìgbàgbọ́’ hàn gẹ́gẹ́ bí ọ̀rọ̀ tí wọ́n gbà gbọ́, kì í ṣe ìṣe ìgbẹ́kẹ̀lé inú ọkàn nìkan. Ìtumọ̀ àkọ́kọ́ kò pinnu àríyànjiyàn náà tan, àlàyé ìsàlẹ̀ sì ṣí àwọn ọ̀nà míì sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘àlùfáà’ fún àwọn ἱερεῖς Júù nínú àyíká tẹ́ńpìlì, kì í ṣe láti fi ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ̀ náà.
