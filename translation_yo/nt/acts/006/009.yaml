id: ACT.6.9
reference: Acts 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan lára àwọn tí ó wá láti inú sínágọ́gù tí a ń pè ní Sínágọ́gù Àwọn Tí A Ti Tú Sílẹ̀ Kúrò Nínú Ẹrú[a], àti lára àwọn ará Kírénè àti àwọn ará Alẹkisáńdíríà, àti lára àwọn tí ó wá láti Kilikíà àti Éṣíà[b], dìde, wọ́n sì bẹ̀rẹ̀ sí í bá Sítéfánù jiyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn Libertini.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ẹrú tí a ti tú sílẹ̀, ó sì ṣeé ṣe kí ó tún kan àwọn àtọmọdọ́mọ wọn.
    reason: lexical_alternative
  - marker: b
    text: “Éṣíà” níbí ni agbègbè ìṣàkóso Róòmù kan ní ìwọ̀ oòrùn Éṣíà Kékeré, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì Éṣíà gẹ́gẹ́ bí a ti mọ̀ ọ́n lónìí.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: dìde
  rationale: Ọ̀rọ̀ yìí pa àwòrán dídìde mọ́, ó sì bá ìgbésẹ̀ àtakò tí ó tẹ̀ lé e mu láì fi ìtumọ̀ míì kún un.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ hàn láti iṣẹ́ Sítéfánù sí àtakò sí i.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: àwọn kan lára àwọn tí ó wá láti inú sínágọ́gù
  rationale: Ó pa ìtumọ̀ apá kan nínú ẹgbẹ́ náà mọ́, ó sì sọ ìbáṣepọ̀ wọn pẹ̀lú sínágọ́gù náà di mímọ́.
- source_word: συναγωγῆς
  choice: sínágọ́gù
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún ibi ìpàdé tàbí àjọ àwọn Júù.
- source_word: τῆς λεγομένης
  choice: tí a ń pè ní
  rationale: Ó fi orúkọ tí a mọ ibi ìpàdé náà sí hàn ní èdè àdánidá.
- source_word: Λιβερτίνων
  choice: Àwọn Òmìnira
  rationale: Ó tọ́ka sí àwọn tí a ti dá sílẹ̀ kúrò ní oko ẹrú, tàbí àwọn àtọmọdọ́mọ wọn; ó yẹra fún àtúmọ̀ òde òní tí kò bá ọ̀rọ̀ náà mu.
- source_word: Κυρηναίων
  choice: àwọn ará Kírénè
  rationale: Ìtumọ̀ gentiliki yìí jẹ́ àwọn ènìyàn tí ó wá láti Kírénè.
- source_word: Ἀλεξανδρέων
  choice: àwọn ará Alẹkisáńdíríà
  rationale: Ó túmọ̀ sí àwọn ènìyàn tí ó wá láti Alẹkisáńdíríà.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: àwọn tí ó wá láti Kilikíà àti Éṣíà
  rationale: ἀπό pẹ̀lú orúkọ ibi ń tọ́ka sí ibi tí ènìyàn ti wá; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé ìtumọ̀ Éṣíà ní àkókò náà.
- source_word: συζητοῦντες
  choice: wọ́n sì bẹ̀rẹ̀ sí í bá ... jiyàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó jẹ́ àríyànjiyàn àtakò, kì í ṣe ìjíròrò lásán; ìtẹ̀síwájú ìṣe náà ni a sọ ní Yorùbá àdánidá.
- source_word: τῷ Στεφάνῳ
  choice: bá Sítéfánù
  rationale: Dátífù náà jẹ́ ẹni tí wọ́n ń bá jiyàn, èyí tí àkójọpọ̀ ọ̀rọ̀ ‘bá ... jiyàn’ mú jáde dáadáa.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, a sì tú àwọn gentiliki sí ‘àwọn ará ...’ fún ìmúlòye àwọn òǹkàwé òde òní.
