id: ACT.6.14
reference: Acts 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: yo
  text: Nítorí a gbọ́ ọ́ tí ó ń sọ pé, “Jésù ará Násárétì yìí[a] yóò pa ibi yìí[b] run, yóò sì yí àwọn àṣà tí Mósè fi lé wa lọ́wọ́ padà.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù ọmọ Násárétì yìí.”
    reason: lexical_alternative
  - marker: b
    text: “Ibi yìí” ń tọ́ka sí tẹ́ńpìlì.
    reason: cultural_note
  - marker: c
    text: Tàbí “àwọn àṣà tí Mósè fi fún wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: a gbọ́ ọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ perfect ti ἀκούω, ó sì ń tọ́ka sí ohun tí àwọn olùfisùn sọ pé àwọn fúnra wọn gbọ́; “a gbọ́ ọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí nínú ìròyìn ẹ̀sùn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára ìṣàlàyé ọ̀rọ̀ Gíríìkì mọ́, ó sì so ẹ̀sùn yìí mọ́ ohun tí a sọ ṣáájú.
- source_word: αὐτοῦ λέγοντος
  choice: nígbà tí ó ń sọ pé
  rationale: Ìtumọ̀ yìí sọ gbangba pé àwọn olùfisùn ní àwọn gbọ́ ọ̀rọ̀ náà láti ẹnu rẹ̀, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: Jésù ará Násárétì yìí
  rationale: “Ará Násárétì” ṣàfihàn ìbátan ẹni náà sí Násárétì, “yìí” sì pa ìtẹnumọ́ demonstrative οὗτος àti ìró ọ̀rọ̀ àwọn olùfisùn mọ́.
- source_word: καταλύσει
  choice: yóò pa ... run
  rationale: Ní ti ilé ìjọsìn, καταλύω túmọ̀ sí pípa ohun kan run tàbí wó lulẹ̀; “pa ... run” ṣe kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: τὸν τόπον τοῦτον
  choice: ibi yìí
  rationale: Ó tẹ̀ lé ìtumọ̀ gangan ti τόπος láì fi “ilé ìjọsìn” sínú ọ̀rọ̀ pàtàkì, bí ó tilẹ̀ jẹ́ pé ibẹ̀ ni ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká rẹ̀.
- source_word: ἀλλάξει
  choice: yóò ... yí ... padà
  rationale: “Yí ... padà” jẹ́ ìbámu Yorùbá àdánidá fún ìṣe yíyí ohun kan padà.
- source_word: τὰ ἔθη
  choice: àwọn àṣà
  rationale: ἔθη ń tọ́ka sí àwọn ìṣe àti ìlànà tí àwùjọ jogún; “àwọn àṣà” mú ìtumọ̀ náà jáde láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn àkànṣe.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: tí Mósè fi lé wa lọ́wọ́
  rationale: “Fi lé wa lọ́wọ́” fi hàn pé Mósè ṣe àkójọ tàbí àtẹ̀jáde àwọn ìlànà náà fún wọn láti máa pa mọ́, bí παραδίδωμι ṣe túmọ̀ sí níbí.
theological_decisions:
- issue: Ohun tí “ibi yìí” ń tọ́ka sí
  choice: A lo “ibi yìí” nínú ọ̀rọ̀ pàtàkì, a sì fi ìtọ́kasí ilé ìjọsìn sínú àlàyé ìsàlẹ̀.
  alternative: ilé ìjọsìn yìí; ibi mímọ́ yìí
  rationale: Gíríìkì sọ “ibi yìí.” Àyíká fi hàn pé ilé ìjọsìn ni, ṣùgbọ́n pípa ọ̀rọ̀ gbogbogbò náà mọ́ kò jẹ́ ká túmọ̀ ju ohun tí àwọn olùfisùn sọ lọ.
- issue: Ìró ẹ̀sùn tí wọ́n fi kan Jésù
  choice: A pa demonstrative náà mọ́ nínú “Jésù ará Násárétì yìí.”
  alternative: Jésù ará Násárétì; Jésù ti Násárétì
  rationale: “Yìí” ń gbé ìtẹnumọ́ àti ìró àfojúdi díẹ̀ tí ó lè wà nínú ọ̀rọ̀ àwọn olùfisùn jáde, láì fi àlàyé tàbí ìdájọ́ tirẹ̀ kún un.
translation_notes:
  register: A lo Yorùbá àpéjọ tó mọ́gbọ́n dání, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ; gbólóhùn náà tún pa ìró ẹ̀sùn àti ìtumọ̀ tí kò yẹ kí a tú sí ọ̀nà kan ṣoṣo mọ́.
