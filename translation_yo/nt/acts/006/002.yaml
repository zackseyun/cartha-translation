source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: yo
  text: Nígbà náà, àwọn Méjìlá pe gbogbo àwùjọ àwọn ọmọ-ẹ̀yìn jọ[a], wọ́n sì sọ pé, “Kò yẹ[b] kí àwa fi ọ̀rọ̀ Ọlọ́run sílẹ̀ láti máa ṣe iṣẹ́ níbi àwọn tábìlì[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ìkójọpọ̀ gbogbo àwọn ọmọ-ẹ̀yìn” tàbí “ọ̀pọ̀ àwọn ọmọ-ẹ̀yìn.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “Kò bójú mu” tàbí “Kò ṣe ìtẹ́wọ́gbà fún wa.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, láti bójú tó iṣẹ́ ìpín oúnjẹ àti ohun ìní tó ní í ṣe pẹ̀lú oúnjẹ àwùjọ àwọn onígbàgbọ́.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: pe ... jọ
  rationale: Ó fi ìtumọ̀ pípè àwọn ènìyàn láti péjọ hàn ní Yorùbá àdánidá, ó sì bá participle tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì mu.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú láti inú ẹ̀dùn-ọkàn ẹsẹ tó ṣáájú, kì í ṣe ìtakora líle.
- source_word: οἱ δώδεκα
  choice: àwọn Méjìlá
  rationale: Èyí pa orúkọ ẹgbẹ́ náà mọ́ láìfi ‘àpọ́sítélì’ kún un, nítorí kò sí nínú Gíríìkì níhìn-ín.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: gbogbo àwùjọ àwọn ọmọ-ẹ̀yìn
  rationale: Ó mú agbára àkójọpọ̀ πλῆθος jáde ní èdè Yorùbá òde òní, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa àwọn àṣàyàn bí ‘ọ̀pọ̀lọpọ̀’ mọ́.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Kò yẹ
  rationale: Àṣàyàn yìí sọ ìbójúmu tàbí ohun tí ó tọ́ ní ipò yìí, láìsọ pé iṣẹ́ ìpín oúnjẹ kò ní iyì.
- source_word: ἡμᾶς καταλείψαντας
  choice: kí àwa fi ... sílẹ̀
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó mọ́gbọ́n dání fún accusative-with-infinitive, ó sì pa èrò fífi ojúṣe pàtàkì sílẹ̀ mọ́.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tí ó ṣe kedere tí ó sì pa ìró ẹ̀kọ́ ìgbàgbọ́ mọ́; nínú Ìṣe, ó lè tọ́ka sí ìhìn tí a ń kéde.
- source_word: διακονεῖν
  choice: láti máa ṣe iṣẹ́
  rationale: Ó sọ iṣẹ́ ìránṣẹ́ tí ó wúlò ní ọ̀nà tí ó ṣeé lóye, láìfi ipò ìjọ kan tí ó ṣẹ̀yìn sínú ọ̀rọ̀ náà.
- source_word: τραπέζαις
  choice: tábìlì
  rationale: Ó pa àwòrán gidi Gíríìkì mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó kan ìpín oúnjẹ àti ohun ìní àwùjọ.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ipò àkọ́kọ́ iṣẹ́ àwọn àpọ́sítélì àti iṣẹ́ ìrànlọ́wọ́ tó wúlò
  choice: “Kò yẹ kí àwa fi ọ̀rọ̀ Ọlọ́run sílẹ̀” ni a lò láti fi hàn pé ọ̀rọ̀ náà jẹ́ nípa bí wọ́n ṣe yẹ kí wọ́n ṣètò ojúṣe wọn.
  alternative: “Kò dùn mọ́ni” tàbí “Kò ṣe ìtẹ́wọ́gbà fún wa.”
  rationale: Ẹsẹ náà ń fi ojúṣe méjì wé ara wọn, kì í sọ pé iṣẹ́ tábìlì kò ní iyì. Ìtumọ̀ náà pa àfojúsùn àwọn Méjìlá mọ́ láìrẹ iṣẹ́ ìrànlọ́wọ́ sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo “àwọn Méjìlá” gẹ́gẹ́ bí orúkọ ẹgbẹ́, “ọ̀rọ̀ Ọlọ́run” fún ìró Bíbélì tí ó mọ́, àti “iṣẹ́ tábìlì” láti pa àwòrán orísun mọ́, pẹ̀lú àlàyé àṣà nínú àkọsílẹ̀ ìsàlẹ̀.
