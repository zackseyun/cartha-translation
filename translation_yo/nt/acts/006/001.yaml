  naturalness: ‘Ìráhùn kan wáyé láti ọ̀dọ̀ àwọn Hélénísítì sí àwọn Hébérù’ jẹ́ Yorùbá ìtàn tó rọrùn, ó sì ń tẹ̀lé ìṣètò Gíríìkì dáadáa. ‘A ń gbójú fo àwọn opó wọn’ jẹ́ ọ̀rọ̀ tí ó ṣe kedere ju ‘a ń fojú ré’ lọ nínú àyíká yìí.
