id: ACT.6.1
reference: Acts 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, bí iye àwọn ọmọ-ẹ̀yìn ti ń pọ̀ sí i, ìráhùn kan wáyé láti ọ̀dọ̀ àwọn Hélénísítì[a] sí àwọn Hébérù, nítorí a ń gbójú fo àwọn opó wọn nínú ìpínfunni ojoojúmọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí ‘àwọn Hélénísítì’ jẹ́ àwọn Júù tí ń sọ èdè Gíríìkì, ní ìyàtọ̀ sí ‘àwọn Hébérù,’ tí ó ṣeé ṣe kí wọ́n máa sọ èdè Árámáíkì tàbí Hébérù.
    reason: cultural_note
  - marker: b
    text: Tàbí, ‘a ń kọ àwọn opó wọn sílẹ̀ nínú iṣẹ́ ìránṣẹ́ ojoojúmọ́.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí iṣẹ́ ìránṣẹ́ ní gbòòrò, ṣùgbọ́n nínú àyíká yìí ó lè tọ́ka sí pípín ohun ìpèsè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó pa ìtọ́kasí àkókò mọ́, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú ìtàn láìfi ìtakora tí δέ kò fi dandan hàn kún un.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: bí iye àwọn ọmọ-ẹ̀yìn ti ń pọ̀ sí i
  rationale: Ó mú gbólóhùn àyíká genitive absolute jáde gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ lẹ́gbẹ̀ẹ́ ìṣẹ̀lẹ̀ pàtàkì, ó sì sọ ìdàgbàsókè nínú iye wọn ní Yorùbá àdánidá.
- source_word: ἐγένετο γογγυσμός
  choice: bẹ̀rẹ̀ sí í ráhùn
  rationale: Γογγυσμός lè túmọ̀ sí ìkùnsínú tàbí ẹ̀dùn; ìṣe ‘ráhùn’ sọ ẹ̀dùn pàtó tó tẹ̀ lé e ní kedere, ‘bẹ̀rẹ̀ sí í’ sì fi hàn pé ó ṣẹ̀ṣẹ̀ dìde.
- source_word: τῶν Ἑλληνιστῶν
  choice: àwọn Hélénísítì
  rationale: A pa orúkọ ẹgbẹ́ ìtàn náà mọ́ ní àfọwọ́kọ ohùn Yorùbá, dípò fífi ìtumọ̀ tí ó ṣeé ṣe sí i sínú ẹsẹ̀ fúnra rẹ̀; àlàyé wà ní àlàyé ìsàlẹ̀.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: sí àwọn Hébérù
  rationale: ‘Sí’ fi ibi tí ẹ̀dùn náà dojú kọ hàn, ó sì pa ìbáṣepọ̀ tó wà láàárín àwọn orúkọ ẹgbẹ́ méjèèjì mọ́.
- source_word: παρεθεωροῦντο
  choice: a ń fojú ré
  rationale: Àpẹẹrẹ ìṣe aláìparí àti passive náà ń tọ́ka sí ohun tó ń ṣẹlẹ̀ léraléra. ‘Fojú ré’ lè túmọ̀ sí pé a kò kíyè sí wọn tàbí a ń kọ wọn sílẹ̀, láìdájọ́ pé ìṣe náà mọ̀ọ́mọ̀ jẹ́.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: nínú ìpínfunni ojoojúmọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé διακονία ní ìtumọ̀ gbòòrò bí iṣẹ́ ìránṣẹ́, ọ̀rọ̀ nípa àwọn opó àti ìpèsè ohun ìní nínú àyíká yìí mú ‘ìpínfunni’ yẹ; ‘ojoojúmọ́’ túmọ̀ καθημερινῇ.
- source_word: αἱ χῆραι αὐτῶν
  choice: àwọn opó wọn
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí àwọn Hélénísítì lọ́nà tó ṣeé gbà jù, a sì pa ìbáṣepọ̀ náà mọ́ ní tààrà.
theological_decisions:
- issue: Ìdánimọ̀ àwọn ẹgbẹ́ Ἑλληνισταί àti Ἑβραῖοι
  choice: Pa orúkọ ẹgbẹ́ náà mọ́ gẹ́gẹ́ bí ‘Hélénísítì’ àti ‘Hébérù’ nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ ṣàlàyé ìtumọ̀ tó ṣeé ṣe.
  alternative: Àwọn Júù tí ń sọ èdè Gíríìkì àti àwọn Júù tí ń sọ èdè Árámáíkì tàbí Hébérù.
  rationale: Orísun náà lo orúkọ ẹgbẹ́, kì í ṣe àlàyé èdè wọn ní tààrà. Pípa àwọn orúkọ náà mọ́ kò jẹ́ kí ìtumọ̀ tú gbogbo àìdánilójú ìtàn náà láìsí ẹ̀rí tó pé.
- issue: Bóyá fojú ré àwọn opó náà mọ̀ọ́mọ̀ ni
  choice: Lo ‘a ń fojú ré,’ èyí tí kò pinnu ète inú àwọn tó ń pín nǹkan.
  alternative: A ń kọ àwọn opó wọn sílẹ̀.
  rationale: παρεθεωροῦντο sọ pé wọn kò rí ìtọ́jú tó yẹ, ṣùgbọ́n kò sọ ní kedere pé ìwà náà jẹ́ ti mọ̀ọ́mọ̀; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ti ìtàn tó níyì, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní; a yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
