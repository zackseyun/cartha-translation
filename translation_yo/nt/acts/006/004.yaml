  source_fidelity: Ìtumọ̀ náà fi ìyàtọ̀ δέ hàn dáadáa pẹ̀lú “Ṣùgbọ́n,” ó sì pa ìtẹnumọ́ ἡμεῖς mọ́ pẹ̀lú “àwa.” “Yóò máa fi ara wa fún” ṣàfihàn ìfaradà tí προσκαρτερήσομεν ń sọ, àti “àdúrà” àti iṣẹ́ tí ó ní í ṣe pẹ̀lú λόγος ni a so mọ́ra gẹ́gẹ́ bí orísun ṣe ṣe e. Àtúnṣe kékeré náà jẹ́ kí ìbáṣepọ̀ iṣẹ́ ìránṣẹ́ náà pẹ̀lú ọ̀rọ̀ náà yege síi nínú Yorùbá.
  naturalness: “Iṣẹ́ ìránṣẹ́ ti ọ̀rọ̀ náà” jẹ́ ìpèníjà tó kéré sí “iṣẹ́ ìránṣẹ́ ọ̀rọ̀ náà,” nítorí “ti” ń fi hàn ní kedere pé iṣẹ́ ìránṣẹ́ náà ní í ṣe pẹ̀lú ọ̀rọ̀ náà. Ìtún “fún” ṣáájú apá kejì tún mú àkójọ àwọn ohun méjèèjì tí wọ́n yóò fi ara wọn fún rọrùn láti ka.
  terminology: '“Iṣẹ́ ìránṣẹ́” dáa fún διακονία nínú àyíká yìí: ó lè tọ́ka sí iṣẹ́ ìsìn/ìránṣẹ́ láìfi ipò ìjọ kan pàtó wọ inú ẹsẹ náà. Ẹsẹ̀ ìsàlẹ̀ àkọ́kọ́ lo “iṣẹ́ òjíṣẹ́,” èyí tí ó lè dá ọ̀rọ̀ sí iṣẹ́ ẹni-òjíṣẹ́ dípò yíyan ìtumọ̀ “service” mìíràn fún διακονία; a ti tún un ṣe.'
