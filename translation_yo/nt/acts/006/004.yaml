  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: yo
  text: Ṣùgbọ́n àwa yóò máa fi ara wa fún àdúrà àti fún iṣẹ́ ìránṣẹ́ ti ọ̀rọ̀ náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ sísìn nípa ọ̀rọ̀ náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “iṣẹ́ ìránṣẹ́” tàbí “iṣẹ́ sísìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn kedere nínú Gíríìkì láti tẹnu mọ́ ìyàtọ̀ sí àwọn tí a yàn fún iṣẹ́ míì; “àwa” pa ìtẹnumọ́ yìí mọ́ ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín iṣẹ́ tí wọ́n ṣẹ̀ṣẹ̀ dá fún àwọn mìíràn àti ohun tí àwọn aposteli yóò máa ṣe.
- source_word: τῇ προσευχῇ
  choice: fún àdúrà
  rationale: Ó bá gbólóhùn Yorùbá “fi ara wa fún” mu, ó sì fi àdúrà hàn gẹ́gẹ́ bí ohun tí wọ́n yóò máa dúró ṣinṣin lé lórí.
- source_word: διακονίᾳ
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ìtumọ̀ náà gba èrò iṣẹ́ tàbí iṣẹ́ òjíṣẹ́ sínú ara rẹ̀ láìsọ ọ́ di ipò àlùfáà tàbí ẹ̀ka ìjọ kan pàtó.
- source_word: τοῦ λόγου
  choice: ọ̀rọ̀ náà
  rationale: Ó pa àṣà ọ̀rọ̀ Kristẹni àkọ́kọ́ mọ́, níbi tí “ọ̀rọ̀” ti ń tọ́ka sí ọ̀rọ̀ Ọlọ́run tí a ń kéde; àpilẹ̀kọ Gíríìkì náà ni a fi “náà” hàn.
- source_word: προσκαρτερήσομεν
  choice: yóò máa fi ara wa fún
  rationale: “Yóò máa” fi ìṣe tí ń bá a lọ hàn, “fi ara wa fún” sì mú ìforúkọsílẹ̀ àti ìfaradà tó wà nínú ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ διακονία ní ìyàtọ̀ sí iṣẹ́ jíjẹ́ oúnjẹ ní àyíká ẹsẹ náà
  choice: iṣẹ́ ìránṣẹ́ ọ̀rọ̀ náà
  alternative: iṣẹ́ òjíṣẹ́ ọ̀rọ̀ náà
  rationale: “Iṣẹ́ ìránṣẹ́” pa èrò pé iṣẹ́ ni διακονία mọ́, ó sì yẹra fún fífi ìpín líle kan láàárín àwọn olórí ìjọ àti àwọn ọmọ ìjọ wọ inú ẹsẹ tí kò sọ bẹ́ẹ̀. Ó tún jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú iṣẹ́ tábìlì inú àyíká ọ̀rọ̀ náà hàn.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tó bá yẹ; “yóò máa fi ara wa fún” jẹ́ àdánidá, ó sì mú ìfaradà tí ń bá a lọ jáde.
