source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: yo
  text: Wọ́n mú àwọn wọ̀nyí wá síwájú àwọn aposteli,[a] lẹ́yìn tí wọ́n gbàdúrà, wọ́n gbé ọwọ́ lé wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n fi àwọn wọ̀nyí hàn níwájú àwọn aposteli.”
    reason: lexical_alternative
  - marker: b
    text: Gbígbé ọwọ́ lé wọn lè jẹ́ àmì fífi iṣẹ́ lé wọn lọ́wọ́ ní gbangba tàbí fífún wọn ní ìbùkún; ọ̀rọ̀ Gíríìkì sọ ìṣe náà, ṣùgbọ́n kò ṣàlàyé ìtumọ̀ rẹ̀ nínú ètò ìjọ sí i níbí.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: àwọn wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ìbátan náà tọ́ka sí àwọn méje tí a ṣẹ̀ṣẹ̀ dárúkọ ní ẹsẹ tó ṣáájú; “àwọn wọ̀nyí” jẹ́ èdè Yorùbá àdánidá, kò sì fi “ọkùnrin” kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
- source_word: ἔστησαν ἐνώπιον
  choice: mú ... wá síwájú
  rationale: Àpapọ̀ ọ̀rọ̀ yìí túmọ̀ sí fífi àwọn ènìyàn síwájú tàbí mímú wọn wá sí iwájú àwọn mìíràn; yíyan yìí jẹ́ èdè Yorùbá tó ṣe kedere, ó sì mú ìtumọ̀ ìfihàn wọn níwájú àwọn aposteli jáde.
- source_word: τῶν ἀποστόλων
  choice: àwọn aposteli
  rationale: “Aposteli” jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa ní èdè Yorùbá fún ẹgbẹ́ àwọn aṣojú Jesu tí Ìṣe Àwọn Aposteli ń tọ́ka sí.
- source_word: προσευξάμενοι
  choice: lẹ́yìn tí wọ́n ... gbàdúrà
  rationale: Aorist participle náà sábà ń fi ìṣe tó ṣáájú ìṣe pàtàkì hàn; gbólóhùn yìí sọ ìtẹ̀lé àwọn ìṣe náà ní Yorùbá àdánidá.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: wọ́n gbé ọwọ́ lé wọn
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání fún ìṣe fífi ọwọ́ lé ènìyàn; ó ṣàpèjúwe ìṣe náà láì fi ìtumọ̀ ẹ̀sìn kan pàtó kún un.
theological_decisions:
- issue: Ìtumọ̀ fífi ọwọ́ lé wọn
  choice: Ṣàpèjúwe rẹ̀ gẹ́gẹ́ bí “wọ́n gbé ọwọ́ lé wọn” nìkan.
  alternative: “wọ́n yàn wọ́n sí ipò” tàbí “wọ́n fi iṣẹ́ lé wọn lọ́wọ́”
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìṣe fífi ọwọ́ lé wọn, ṣùgbọ́n kò ṣàlàyé níbí bóyá ìyẹn jẹ́ ìyàn sí ipò, ìránṣẹ́, ìbùkún, tàbí ohun mìíràn. Ìtumọ̀ náà pa àìdánilójú yìí mọ́, kò sì gbé ẹ̀kọ́ ìjọ kan kalẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “aposteli” gẹ́gẹ́ bí orúkọ oyè tí ó ti wọ́pọ̀, a sì yàgò fún ọ̀rọ̀ tó lè sọ ìṣe náà di ìyàn sí ipò ní dandan.
