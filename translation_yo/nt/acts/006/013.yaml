source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: yo
  text: Wọ́n tún fi àwọn ẹlẹ́rìí èké kalẹ̀, tí wọ́n sọ pé, “Ọkùnrin yìí kò dẹ́kun[a] sísọ àwọn ọ̀rọ̀[b] lòdì sí ibi mímọ́ yìí[c] àti òfin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò dáwọ́ ... dúró.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sísọ̀rọ̀” tàbí “sísọ ohun kan” lòdì sí ibi mímọ́ yìí àti òfin.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ibi mímọ́ náà.” Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn Gíríìkì náà ń tọ́ka ní pàtó sí tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: mú … wá
  rationale: Nínú ọ̀rọ̀ ẹjọ́ yìí, gbólóhùn náà túmọ̀ sí pé wọ́n mú àwọn ẹlẹ́rìí jáde tàbí gbé wọn kalẹ̀ láti jẹ́rìí. “Mú … wá” jẹ́ Yorùbá àdánidá, ó sì fi hàn pé àwọn kan ló ṣètò ìfarahàn wọn.
- source_word: τε
  choice: tún
  rationale: “Tún” fi agbára àfikún τέ hàn, ní pé èyí jẹ́ ohun mìíràn tí wọ́n ṣe.
- source_word: μάρτυρας ψευδεῖς
  choice: àwọn ẹlẹ́rìí èké
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀ fún àwọn tí ń jẹ́rìí irọ́ nínú ẹjọ́, ó sì pa ìtumọ̀ òfin mọ́.
- source_word: λέγοντας
  choice: tí wọ́n sọ pé
  rationale: Gbólóhùn aláṣepọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì so ohun tí àwọn ẹlẹ́rìí náà sọ mọ́ wọn ní kedere.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí kò fi ẹ̀gàn kún ọ̀rọ̀ Gíríìkì.
- source_word: οὐ παύεται
  choice: kò dẹ́kun
  rationale: “Kò dẹ́kun” fi ìṣe tí ó ń bá a lọ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan kò ṣíwọ́ ohun kan.
- source_word: λαλῶν ῥήματα
  choice: sísọ àwọn ọ̀rọ̀
  rationale: Ìtumọ̀ yìí ṣojú ọ̀rọ̀-orúkọ ῥήματα tí ó hàn gbangba nínú Gíríìkì, láì mú gbólóhùn Yorùbá le.
- source_word: κατὰ
  choice: lòdì sí
  rationale: Nínú ẹ̀sùn ọ̀tá yìí, κατά pẹ̀lú ẹ̀yà atọ́ka-jíjẹ́ túmọ̀ sí ìtakò sí ibi mímọ́ àti òfin.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: ibi mímọ́ yìí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àwọn arọ́pò-orúkọ pàtó, ibi tí wọ́n ń tọ́ka sí ní àyíká ọ̀rọ̀ ni tẹ́ńpìlì tó wà níbẹ̀; “yìí” mú ìtọ́kasí ibẹ̀ náà jáde lọ́nà àdánidá.
- source_word: νόμου
  choice: òfin
  rationale: Nínú àyíká Júù yìí, ó ń tọ́ka sí Òfin Mósè; “òfin” pa ọ̀rọ̀ inú ẹ̀sùn náà mọ́ láì ṣàlàyé rẹ̀ jù.
theological_decisions:
- issue: Ohun tí “ibi mímọ́” àti “òfin” ń tọ́ka sí
  choice: Ẹ̀sùn náà ń tọ́ka sí tẹ́ńpìlì Jerúsálẹ́mù àti Òfin Mósè.
  alternative: Kí a ka wọn sí ibi ìjọsìn àti àṣà òfin lápapọ̀.
  rationale: Àyíká ìtàn Ìṣe Àwọn Àpọ́sítélì sọ nípa ẹ̀sùn sí Sítéfánù lórí tẹ́ńpìlì àti Mósè. Ìtumọ̀ náà pa ọ̀rọ̀ àwọn olùfisùn mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- issue: Ìwọ̀n líle èdè ẹ̀sùn náà
  choice: Pa ìró ọ̀rọ̀ ẹjọ́ oníjà mọ́ láì mú un le ju Gíríìkì lọ.
  alternative: Lílo ọ̀rọ̀ ìtumọ̀ bí “sọ̀rọ̀-òdì sí Ọlọ́run” tàbí “ba orúkọ jẹ́.”
  rationale: Bí ó tilẹ̀ jẹ́ pé ẹsẹ náà pè é ní ẹ̀rí èké, ọ̀rọ̀ ẹ̀sùn tí a ròyìn ni “sísọ àwọn ọ̀rọ̀ lòdì sí,” kì í ṣe ọ̀rọ̀ tó túmọ̀ rẹ̀ sí ìsọ̀rọ̀-òdì ní pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn kíkún. Èdè náà ṣaláìmọ̀ fún òǹkàwé lásán, ó sì pa ìró ẹjọ́ àti ọ̀tá inú ẹsẹ náà mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
