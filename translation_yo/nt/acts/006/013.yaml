  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: τέ = “tún,” μάρτυρας ψευδεῖς = “àwọn ẹlẹ́rìí èké,” àti κατά = “lòdì sí.” Ṣùgbọ́n ἔστησαν nínú àyíká ilé-ẹjọ́ túmọ̀ sí fífi/títọ́ àwọn ẹlẹ́rìí kalẹ̀; “mú ... wá” lè jẹ́ ìtumọ̀ tó fẹ̀ ju, nígbà tí “fi ... kalẹ̀” dájú síi. Pẹ̀lú, “sí ibi mímọ́ ... àti sí òfin” dájú gẹ́gẹ́ bí àtòjọ ìtọ́ka, ṣùgbọ́n “lòdì sí ... àti òfin” jẹ́ Yorùbá tó rọrùn síi láì yí ìtumọ̀ padà.'
  naturalness: “Wọ́n tún fi àwọn ẹlẹ́rìí èké kalẹ̀” jẹ́ ìtàn-ìwé Yorùbá tó dára, tó sì bá èdè ẹjọ́ mu. “Kò dẹ́kun sísọ àwọn ọ̀rọ̀” jẹ́ ìtumọ̀ tó sun mọ́ orísun ṣùgbọ́n ó lè dùn díẹ̀ bí ìtúmọ̀-lẹ́tà; a lè pa ῥήματα mọ́ nípasẹ̀ “kò dẹ́kun láti máa sọ̀rọ̀ lòdì sí,” níbi tí “sọ̀rọ̀” ń gbé ìṣe náà lọ́nà àdánidá. Nítorí ìtumọ̀ tó dára jù lọ ní àfọwọ́ṣe, a pa “àwọn ọ̀rọ̀” mọ́ nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n a ṣàtúnṣe ìpò ẹ̀sùn náà fún ìṣàn èdè.
  terminology: “Àwọn ẹlẹ́rìí èké,” “ibi mímọ́ yìí,” àti “òfin” jẹ́ ọ̀rọ̀ tó pé. “Ibi mímọ́” kò fi “tẹ́ńpìlì” sínú ọ̀rọ̀ ẹsẹ̀, nítorí náà ó pa ọ̀rọ̀ àwọn olùfisùn mọ́ bó ṣe wà; àlàyé ìsàlẹ̀ le ṣàlàyé àyíká tẹ́ńpìlì. Àmì [a], [b], [c] wà ní ibi tó lè yà òǹkàwé lẹ́nu nínú gbolohun; fífi wọn sí lẹ́yìn ọ̀rọ̀ kọọkan tí wọ́n ṣàlàyé dára síi.
