source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: yo
  text: Wọ́n kò sì lè dojú kọ ọgbọ́n àti Ẹ̀mí tí Stefanu fi ń sọ̀rọ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọgbọ́n àti ẹ̀mí tí Stefanu fi ń sọ̀rọ̀,” bí a bá ka πνεύματι sí ẹ̀mí Stefanu fúnra rẹ̀ dípò Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: wọn kò lè
  rationale: Ọ̀rọ̀ yìí nínú àìpé fi àìlágbára wọn hàn; ‘wọn kò lè’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: ἀντιστῆναι
  choice: dúró lòdì sí
  rationale: Ó túmọ̀ sí láti dojú kọ tàbí láti tako ní ọ̀nà tí ẹni lè fara da ohun tí ó ń bá a jà; ‘dúró lòdì sí’ bá àyíká ìjiyàn mu.
- source_word: σοφίᾳ
  choice: ọgbọ́n
  rationale: Yorùbá kò nílò àmì ìdánimọ̀ bí àpilẹ̀kọ Gíríìkì níbí; ọ̀rọ̀ náà ń tọ́ka sí ọgbọ́n tí ó hàn nínú ọ̀rọ̀ Stefanu.
- source_word: πνεύματι
  choice: Ẹ̀mí
  rationale: Àyíká Ìṣe 6:5 àti ìsopọ̀ ọgbọ́n pẹ̀lú Ẹ̀mí tọ́ka sí Ẹ̀mí Mímọ́; lẹ́tà ńlá fi ìtumọ̀ yìí hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
- source_word: ᾧ ἐλάλει
  choice: tí ó ń mú un sọ̀rọ̀
  rationale: Ọ̀nà yìí fi Ẹ̀mí hàn gẹ́gẹ́ bí ẹni tí ń fún Stefanu lágbára láti sọ̀rọ̀, ó sì pa ìṣe tí ń lọ lọ́wọ́ nínú ἐλάλει mọ́.
theological_decisions:
- issue: Bóyá πνεύματι ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí Stefanu fúnra rẹ̀
  choice: Ẹ̀mí
  alternative: ẹ̀mí
  rationale: Ìtẹnumọ́ Ìṣe pé Stefanu kún fún Ẹ̀mí Mímọ́ àti bí a ṣe so ọgbọ́n mọ́ Ẹ̀mí ṣe àtìlẹ́yìn fún ìtumọ̀ Ẹ̀mí Mímọ́; síbẹ̀, Gíríìkì fúnra rẹ̀ kò mú ìtumọ̀ kejì kúrò pátápátá, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní pẹ̀lú àmì ohùn ní kíkún. ‘Dúró lòdì sí’ jẹ́ àdánidá, ‘tí ó ń mú un sọ̀rọ̀’ sì jẹ́ kí ipa Ẹ̀mí àti ìṣe tí ń lọ lọ́wọ́ ṣe kedere láìfi ẹ̀kọ́ ìjọ kan kún un.
