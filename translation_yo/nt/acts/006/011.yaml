  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: yo
  text: Nígbà náà ni wọ́n fi ìkọ̀kọ̀ rọ àwọn ọkùnrin kan láti sọ pé,[a] “A ti gbọ́ ọ́ tí ó ń sọ àwọn ọ̀rọ̀ ẹ̀gàn lòdì sí Mósè àti Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi ìkọ̀kọ̀ sún àwọn ọkùnrin kan láti sọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríràn, rírọ, tàbí mímú àwọn ènìyàn ṣe ohun kan ní ọ̀nà àṣírí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ṣe àfihàn ìgbésẹ̀ tó tẹ̀ lé e nínú ìtàn.
- source_word: ὑπέβαλον
  choice: wọ́n fi ìkọ̀kọ̀ ru ... sókè
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ṣíṣe ohun ní ìkọ̀kọ̀ láti ru àwọn ẹlòmíràn sí ohun kan; gbólóhùn Yorùbá yìí pa ìtumọ̀ ìdẹ̀tẹ̀ àti ìmúnilọ́kànṣe náà mọ́.
- source_word: ἄνδρας
  choice: àwọn ọkùnrin kan
  rationale: ἀνήρ tọ́ka sí àwọn akọ ní pàtó níbí; “kan” jẹ́ kí ọ̀rọ̀ náà dùn bí Yorùbá àdánidá láìfi àlàyé tuntun kún un.
- source_word: λέγοντας
  choice: láti sọ pé
  rationale: Ó tú participle náà sí Yorùbá àdánidá gẹ́gẹ́ bí ohun tí wọ́n ru àwọn ọkùnrin náà láti ṣe.
- source_word: Ἀκηκόαμεν
  choice: Àwa ti gbọ́
  rationale: “ti gbọ́” pa agbára perfect mọ́, ìyẹn ohun tí wọ́n ní wọ́n ti gbọ́ tí ó sì dúró gẹ́gẹ́ bí ẹ̀rí wọn.
- source_word: αὐτοῦ λαλοῦντος
  choice: tí ó ń sọ
  rationale: Àkópọ̀ yìí sọ pé wọ́n gbọ́ ọ nígbà tí ó ń sọ̀rọ̀; “ń sọ” jẹ́ Yorùbá àdánidá fún ìṣe tó ń lọ.
- source_word: ῥήματα βλάσφημα
  choice: ọ̀rọ̀ ẹ̀gàn
  rationale: Ní àyíká ẹ̀sùn ẹ̀sìn yìí, “ọ̀rọ̀ ẹ̀gàn” fi hàn pé ọ̀rọ̀ náà ń tàbùkù sí ẹni mímọ́ tàbí sí Ọlọ́run, láìsọ ẹ̀sùn náà di òtítọ́.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: sí Mósè àti Ọlọ́run
  rationale: “sí” tọ́ka sí àwọn ẹni tí ẹ̀gàn náà dojú kọ; ìtumọ̀ ìtakò náà ti hàn nínú “ẹ̀gàn.”
theological_decisions:
- issue: Irú ẹ̀sùn tí wọ́n fi kan Sítéfánù
  choice: A túmọ̀ βλάσφημα sí “ọ̀rọ̀ ẹ̀gàn” tí ó dojú kọ Mósè àti Ọlọ́run, gẹ́gẹ́ bí ẹ̀sùn tí àwọn ọkùnrin náà sọ.
  alternative: “ọ̀rọ̀ búburú” tàbí “ọ̀rọ̀ ìbàjẹ́ orúkọ” sí Mósè àti Ọlọ́run.
  rationale: “Ọ̀rọ̀ ẹ̀gàn” pa agbára ẹ̀sìn àti ti òfin inú βλάσφημα mọ́. Àyíká náà fi hàn pé ìròyìn ẹ̀sùn ni, kì í ṣe ìmúdájú pé ẹ̀sùn náà jẹ́ òtítọ́.
translation_notes:
  register: Yorùbá ìwòde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Fi ìkọ̀kọ̀ ru ... sókè” jẹ́ ọ̀rọ̀ àdánidá tó pa ìṣe àṣírí àti ìmúnilọ́kànṣe inú ὑπέβαλον mọ́; àfikún ìsàlẹ̀ ojú ìwé sì tọ́ka sí ọ̀nà mìíràn tí a lè gbà túmọ̀ rẹ̀.
