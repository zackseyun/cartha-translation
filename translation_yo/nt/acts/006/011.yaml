  to: Nígbà náà ni wọ́n fi ìkọ̀kọ̀ rọ àwọn ọkùnrin kan láti sọ pé,[a] “A ti gbọ́ ọ́ tí ó ń sọ àwọn ọ̀rọ̀ ẹ̀gàn lòdì sí Mósè àti Ọlọ́run.”
