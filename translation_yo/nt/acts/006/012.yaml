id: ACT.6.12
reference: Acts 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: yo
  text: Àwọn náà ru àwọn ènìyàn, àwọn àgbà àti àwọn akọ̀wé sókè sí i. Wọ́n sì sún mọ́ ọn lójijì, wọ́n mú un, wọ́n sì darí rẹ̀ lọ síwájú Sànhẹ́dírìn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbìmọ̀.” Ọ̀rọ̀ Gíríìkì συνέδριον lè túmọ̀ sí ìgbìmọ̀ ní ìtumọ̀ gbooro, ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó tọ́ka sí ìgbìmọ̀ aṣàkóso Júù, ìyẹn Sànhẹ́dírìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: ru ... sókè sí i
  rationale: Ó fi ìtumọ̀ fífi ìbínú tàbí ìdàrúdàpọ̀ ru àwọn ènìyàn sí ẹni kan hàn, láìfi ìwà ipá tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: τε
  choice: Nítorí náà
  rationale: Ó ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn tó rọ̀; níbí, ó so ìgbésẹ̀ yìí mọ́ ète tí ẹsẹ tó ṣáájú sọ.
- source_word: λαὸν
  choice: àwọn ènìyàn
  rationale: Ìtumọ̀ tààrà tí kò dín ọ̀rọ̀ náà kù sí ogunlọ́gọ̀ kan pàtó.
- source_word: πρεσβυτέρους
  choice: àwọn àgbààgbà
  rationale: Ó tọ́ka sí àwọn aṣáájú Júù tí a mọ̀ sí àgbààgbà, kì í ṣe àwọn ọkùnrin tó dàgbà lásán.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Ó pa orúkọ ẹgbẹ́ àwọn amòfin àti àwọn amòye Ìwé Mímọ́ ní àkókò náà mọ́.
- source_word: ἐπιστάντες
  choice: dé bá a lójijì
  rationale: Ó mú ìtumọ̀ sísún mọ́ ọn tàbí yíyọ sí i lójijì jáde ní Yorùbá àdánidá.
- source_word: συνήρπασαν
  choice: mú un
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí fífi agbára mú ẹni; ìtẹ̀síwájú gbólóhùn náà mú agbára náà hàn kedere.
- source_word: ἤγαγον
  choice: fà á lọ
  rationale: Ó jẹ́ ọ̀nà àdánidá láti fi hàn pé wọn kó o lọ láìfẹ́ tirẹ̀ lẹ́yìn tí wọ́n mú un.
- source_word: συνέδριον
  choice: Sàhẹ́ndírìn
  rationale: Ní àyíká Jerusalẹmu yìí, ó ṣeé ṣe jù pé ọ̀rọ̀ náà ń tọ́ka sí ìgbìmọ̀ aṣàkóso Júù tí a ń pè ní Sanhedrin.
theological_decisions:
- issue: Ìtumọ̀ συνέδριον
  choice: Sàhẹ́ndírìn
  alternative: ìgbìmọ̀
  rationale: Àwọn àgbààgbà àti àwọn akọ̀wé tí a mẹ́nu kàn, pẹ̀lú àyíká Jerusalẹmu, fi hàn pé ìgbìmọ̀ aṣàkóso Júù pàtó ni; síbẹ̀, ọ̀rọ̀ Gíríìkì lè túmọ̀ sí “ìgbìmọ̀” ní gbogbogbòò.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo “Sàhẹ́ndírìn” gẹ́gẹ́ bí orúkọ ìtàn, a sì ṣàlàyé ọ̀nà míì “ìgbìmọ̀” nínú àlàyé ìsàlẹ̀.
