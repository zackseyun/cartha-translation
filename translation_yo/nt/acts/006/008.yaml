  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: yo
  text: Ṣítéfánù[a], ẹni tí ó kún fún oore-ọ̀fẹ́ àti agbára, ń ṣe àwọn iṣẹ́ ìyanu ńlá àti àwọn àmì ńlá láàárín àwọn ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “ó kún fún ìgbàgbọ́ àti agbára,” dípò “ó kún fún oore-ọ̀fẹ́ àti agbára.”
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; ìṣàn gbólóhùn Yorùbá kò nílò ‘ṣùgbọ́n’ tàbí ọ̀rọ̀ àkókò bí ‘nígbà náà,’ èyí tí yóò fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: ẹni tí ó kún fún oore-ọ̀fẹ́ àti agbára
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn ànímọ́ méjèèjì kún Ṣítéfánù. ‘Oore-ọ̀fẹ́’ pa ìtumọ̀ χάρις àti ìró ẹ̀kọ́ ìgbàgbọ́ inú Ìṣe mọ́; ‘agbára’ sì bá δύναμις mu nínú àyíká iṣẹ́ ìyanu.
- source_word: ἐποίει
  choice: ń ṣe
  rationale: Àkókò imperfect Gíríìkì tọ́ka sí iṣẹ́ tí ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀; ‘ń ṣe’ dá abala yẹn dúró ní Yorùbá.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: iṣẹ́ ìyanu àti àmì ńlá
  rationale: ‘Iṣẹ́ ìyanu’ sọ ipa ìyàlẹ́nu τέρατα ní Yorùbá àdánidá, ‘àmì’ sì pa iṣẹ́ atọ́kasí σημεῖα mọ́. ‘Ńlá’ kan àwọn méjèèjì gẹ́gẹ́ bí μεγάλα ti ṣe nínú Gíríìkì.
- source_word: ἐν τῷ λαῷ
  choice: láàárín àwọn ènìyàn
  rationale: Àpólà náà tọ́ka sí ibi tàbí àwùjọ tí iṣẹ́ wọ̀nyí ti ń ṣẹlẹ̀; ‘láàárín àwọn ènìyàn’ jẹ́ Yorùbá tó ṣe déédé, tí kò sì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ ní χάριτος/πίστεως
  choice: oore-ọ̀fẹ́
  alternative: ìgbàgbọ́
  rationale: SBLGNT tí a fi ṣe orísun ka χάριτος (‘oore-ọ̀fẹ́’), nítorí náà òun ni ọ̀rọ̀ àkọ́kọ́ tẹ̀ lé. Nítorí pé àwọn àfọwọ́kọ kan ka πίστεως (‘ìgbàgbọ́’), a pa àṣàyàn pàtàkì yẹn mọ́ sínú àlàyé ìsàlẹ̀ láìdá a pò mọ́ ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní èdè òde òní tó lọ́lá, tó sì ṣe kedere fún òǹkàwé gbogbo. A lo ‘Ṣítéfánù’ gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ nínú Yorùbá.
