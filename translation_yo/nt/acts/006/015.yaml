    issue: ‘wọ́n rí i pé ojú rẹ̀ dà bí ojú áńgẹ́lì’
    rationale: Ìṣọ̀kan ‘rí i pé’ sábà máa ń tọ́ka sí rírí/ímọ̀ ìdí kan (‘they saw that ...’). Gíríìkì ní ohun tí wọ́n rí ní tààrà ni ‘ojú rẹ̀’; nítorí náà, a gbọdọ̀ sọ ojú náà di ohun-ìṣe ‘rí’ ní kedere.
