id: ACT.6.15
reference: Acts 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: yo
  text: Gbogbo àwọn tí wọ́n jókòó nínú ìgbìmọ̀ náà[a] sì tẹjú mọ́ ọn, wọ́n rí ojú rẹ̀ bí ojú áńgẹ́lì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Sànhẹ́dírìn.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: tẹjú mọ́ ọn
  rationale: Ó fi ìwòye tí ó jinlẹ̀, tí ó sì dúró pẹ́ hàn, kì í ṣe wíwo lásán; ó tún jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: πάντες οἱ καθεζόμενοι
  choice: Gbogbo àwọn tí ó jókòó
  rationale: Ó pa ìtumọ̀ ‘gbogbo’ mọ́, ó sì ṣàpèjúwe àwọn tí wọ́n jókòó ní ọ̀nà tí ó bá ìtàn Yorùbá mu.
- source_word: συνεδρίῳ
  choice: ìgbìmọ̀ náà
  rationale: Ó túmọ̀ orúkọ náà ní tààrà gẹ́gẹ́ bí ìgbìmọ̀ alákòóso, láì sọ ọ́ di orúkọ àkànṣe nínú ẹsẹ náà.
- source_word: πρόσωπον
  choice: ojú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ojú Sítéfánù tí wọ́n rí; ‘ojú’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: ὡσεὶ
  choice: dà bí
  rationale: Ó pa ìfiwéra mọ́ láì sọ irú ànímọ́ pàtó tí ó mú kí ojú rẹ̀ jọ ti áńgẹ́lì.
- source_word: ἀγγέλου
  choice: áńgẹ́lì
  rationale: Nínú àyíká ìtàn yìí, ó tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe òjíṣẹ́ ènìyàn lásán.
theological_decisions:
- issue: Irú ìfiwéra inú gbólóhùn ‘ojú rẹ̀ dà bí ojú áńgẹ́lì’
  choice: Ìfiwéra tí ó sọ pé ìrísí Sítéfánù jọ ti áńgẹ́lì, láì sọ ànímọ́ pàtó tí wọ́n rí.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìmọ́lẹ̀ ògo, ìfọ̀kànbalẹ̀ aláìlẹ́bi, tàbí ọlá àti àṣẹ láti ọ̀run.
  rationale: Gíríìkì sọ ìjọra nìkan; kò sọ bóyá ìmọ́lẹ̀, ìfọ̀kànbalẹ̀, ọlá, tàbí àkópọ̀ wọn ni. Ìtumọ̀ náà fi àìsọ pàtó yìí sílẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì yé òǹkàwé òde òní. ‘Tẹjú mọ́ ọn’ mú agbára ἀτενίσαντες jáde; ‘dà bí’ pa ìfiwéra àti àìsọ ànímọ́ pàtó mọ́. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá.
