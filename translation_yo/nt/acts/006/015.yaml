  verdict: revise
  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ ìpilẹ̀ ń pa ‘gbogbo,’ ìjókòó nínú ìgbìmọ̀, wíwo ọlọ́kàn-tán, àti ìfiwéra pẹ̀lú ojú áńgẹ́lì mọ́. Ṣùgbọ́n ‘wọ́n rí i pé ojú rẹ̀ dà bí ...’ lè túmọ̀ sí pé wọ́n rí ìdí kan/tabi òtítọ́ kan nípa ojú rẹ̀, dípò pé wọ́n rí ojú rẹ̀ fúnra rẹ̀, gẹ́gẹ́ bí Gíríìkì ṣe sọ.
  naturalness: ‘Tẹjú mọ́ ọn’ jẹ́ àdánidá, ó sì fi wíwo pẹ̀lú ìfẹ́kúfẹ̀ẹ́ hàn. ‘Wọ́n rí ojú rẹ̀ bí ojú áńgẹ́lì’ jẹ́ ọ̀nà Yorùbá tó hàn gedegbe síi fún ohun tí wọ́n rí.
  terminology: ‘Ìgbìmọ̀’ jẹ́ ìtumọ̀ tó yẹ fún συνέδριον nínú ọ̀rọ̀ àkọ́kọ́; àlàyé ‘Sànhẹ́dírìn’ nínú àlàyé ẹsẹ̀ dára. ‘Áńgẹ́lì’ sì yẹ fún ἀγγέλου nínú àyíká yìí. Àtúnṣe kò sọ irú ìjọra náà di ìmọ́lẹ̀, ògo, tàbí ànímọ́ mìíràn.
  issues:
