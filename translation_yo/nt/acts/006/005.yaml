id: ACT.6.5
reference: Acts 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: yo
  text: Àbá náà sì tẹ́ gbogbo àwùjọ náà lọ́rùn, wọ́n sì yan Sítéfánù, ọkùnrin kan tí ó kún fún ìgbàgbọ́[a] àti Ẹ̀mí Mímọ́, àti Fílípì, Pírókórù, Níkánórì, Tímónì, Páménà àti Níkóláù[c], ará Áńtíókù kan tí ó ti yí padà sí ẹ̀sìn àwọn Júù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé tàbí ìdúróṣinṣin; “ìgbàgbọ́” ni a lò nínú ẹsẹ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ẹni tí ó “yí padà sí ẹ̀sìn àwọn Júù” jẹ́ ẹni tí kì í ṣe Júù ní ìbẹ̀rẹ̀, ṣùgbọ́n tí ó gba ẹ̀sìn àwọn Júù.
    reason: cultural_note
  - marker: c
    text: Ní títẹ̀lé ìlò “àti” léraléra nínú Gíríìkì, a lè kà á pé, “Sítéfánù, ọkùnrin kan tí ó kún fún ìgbàgbọ́ àti Ẹ̀mí Mímọ́, àti Fílípì àti Pírókórù àti Níkánórì àti Tímónì àti Páménà àti Níkóláù.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ λόγος
  choice: Àbá náà
  rationale: Nínú ọ̀rọ̀ àyíká yìí, λόγος ń tọ́ka sí ohun tí àwọn aposteli ṣẹ̀ṣẹ̀ dábàá, kì í ṣe ‘ọ̀rọ̀’ lásán.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: tẹ́ gbogbo àwùjọ náà lọ́rùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé gbogbo àwùjọ náà fara mọ́ àbá náà, láìfi èdè ìjọ tí ó wáyé lẹ́yìn náà sínú πλῆθος.
- source_word: ἐξελέξαντο
  choice: wọ́n sì yan
  rationale: Ó túmọ̀ sí pé àwùjọ náà yan àwọn ọkùnrin náà láti inú àwọn mìíràn.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: ọkùnrin kan tí ó kún fún ìgbàgbọ́ àti Ẹ̀mí Mímọ́
  rationale: ‘Ọkùnrin’ pa ìtumọ̀ akọ ti ἀνήρ mọ́; ‘kún fún’ jẹ́ àdánidá fún πλήρης, ‘ìgbàgbọ́’ sì ni ìtumọ̀ àkọ́kọ́ ti πίστις níbí.
- source_word: προσήλυτον
  choice: ẹni tí ó ti yí padà sí ẹ̀sìn àwọn Júù
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí kì í ṣe Júù ní ìbẹ̀rẹ̀ ṣùgbọ́n tí ó gba ẹ̀sìn àwọn Júù; ìtumọ̀ kíkún yìí ṣe kedere ju lílo ọ̀rọ̀ àjèjì lọ.
- source_word: Ἀντιοχέα
  choice: ará Áńtíókù kan
  rationale: Àpèjúwe náà fi ìlú tí Níkóláù ti wá hàn ní ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Sítéfánù, Fílípì, Pírókórù, Níkánórì, Tímónì, Páménà àti Níkóláù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìrísí tí ó bá ìró àti ìkọ̀wé Yorùbá mu, pẹ̀lú àmì ohùn níbi tí ó ti yẹ.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àpèjúwe Sítéfánù
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Nínú àyíká yìí, ‘ìgbàgbọ́’ ni ìtumọ̀ tí ó ṣeé ṣe jù, ṣùgbọ́n πίστις tún lè tọ́ka sí ìṣòtítọ́; a pa àṣàyàn yẹn mọ́ sínú àlàyé ìsàlẹ̀.
- issue: Ìdánimọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Nínú Ìṣe Àwọn Aposteli, gbólóhùn náà sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run, kì í ṣe ìwà ẹ̀mí mímọ́ lásán.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá. A lo ‘àwùjọ’ dípò ọ̀rọ̀ tí yóò fi ètò ìjọ ti àkókò mìíràn sínú ẹsẹ náà. A ṣètò orúkọ méje náà gẹ́gẹ́ bí àkójọ kan ṣoṣo, bí ó tilẹ̀ jẹ́ pé Gíríìkì tún àsopọ̀ καί ṣe.
