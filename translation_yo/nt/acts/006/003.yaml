id: ACT.6.3
reference: Acts 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: yo
  text: Ṣùgbọ́n, ẹ̀yin ará,[a] ẹ yan ọkùnrin méje láàárín yín tí a jẹ́rìí rere fún, tí wọ́n kún fún Ẹ̀mí àti ọgbọ́n,[b] àwọn tí àwa yóò yàn sípò láti bójú tó iṣẹ́ yìí.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ẹ̀yin ará” jẹ́ ọ̀rọ̀ akọ; nínú irú ìkíni yìí, ó lè kan gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: cultural_note
  - marker: b
    text: Tàbí, “tí wọ́n kún fún Ẹ̀mí Mímọ́ àti ọgbọ́n.” Gíríìkì sọ ní tààrà pé, “tí wọ́n kún fún Ẹ̀mí àti ọgbọ́n.”
    reason: alternative_reading
  - marker: c
    text: “Iṣẹ́ yìí” tọ́ka sí ọ̀ràn ìpínpín ojoojúmọ́ tí a mẹ́nu kàn nínú àyíká ẹsẹ yìí.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: ẹ yan
  rationale: Ọ̀rọ̀ àṣẹ náà pe ìjọ láti wá àwọn tó yẹ̀ kí wọ́n sì yàn wọ́n; “ẹ yan” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó mú ìtumọ̀ yìí jáde.
- source_word: δέ
  choice: Nítorí náà
  rationale: Nínú àyíká ọ̀rọ̀, δέ ń gbé ọ̀rọ̀ láti inú àlàyé ìṣòro àti ìmọ̀ràn àwọn aposteli lọ sí ohun tí ìjọ gbọ́dọ̀ ṣe; “Nítorí náà” fi ìsopọ̀ ìyọrísí náà hàn.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ìkíni sí àwọn ọmọ ìgbàgbọ́, ó sì lè dúró fún àwùjọ lápapọ̀ bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: ọkùnrin méje láàárín yín
  rationale: ἄνδρας tọ́ka sí àwọn ọkùnrin ní pàtó, ἐξ ὑμῶν sì fi hàn pé láti inú àwùjọ náà ni kí wọ́n ti yàn wọ́n.
- source_word: μαρτυρουμένους
  choice: tí a jẹ́rìí rere sí
  rationale: Èyí pa ìtumọ̀ pé àwọn ẹlòmíràn ń sọ ẹ̀rí rere nípa wọn mọ́, dípò kí ó dín kù sí ìwà rere nìkan.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: tí ó kún fún Ẹ̀mí àti ọgbọ́n
  rationale: Ó tẹ̀lé ìtumọ̀ gbolohun Gíríìkì, ó sì lo “Ẹ̀mí” fún ìtọ́kasí tó ṣeé ṣe jù lọ sí Ẹ̀mí Ọlọ́run láì fi “Mímọ́” kun ohun tí kò sí nínú ọ̀rọ̀ orísun.
- source_word: καταστήσομεν ἐπὶ τῆς χρείας ταύτης
  choice: àwa yóò yàn sípò láti bójú tó iṣẹ́ yìí
  rationale: “Yàn sípò” mú ìfìdí ẹni múlẹ̀ fún ojúṣe jáde, “láti bójú tó iṣẹ́ yìí” sì jẹ́ Yorùbá àdánidá fún fífi wọn ṣe olùṣàkóso ọ̀ràn náà.
theological_decisions:
- issue: Bóyá πνεύματος túmọ̀ sí ẹ̀mí ní gbogbogbòò tàbí Ẹ̀mí Ọlọ́run
  choice: Ẹ̀mí
  alternative: ẹ̀mí; Ẹ̀mí Mímọ́
  rationale: Ìlò ọ̀rọ̀ náà nínú Lúùkù–Ìṣe àti àyíká ìjíṣẹ́ fi hàn pé ó ṣeé ṣe jù lọ kí ó tọ́ka sí Ẹ̀mí Ọlọ́run. Síbẹ̀, a kò fi “Mímọ́” kun ọ̀rọ̀ pàtàkì nítorí ἁγίου kò sí nínú Gíríìkì.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹ̀yin ará” gẹ́gẹ́ bí ìkíni àdánidá, a sì pa ìtọ́kasí akọ nínú ἄνδρας mọ́ pẹ̀lú “ọkùnrin.” Gbogbo àmì ìsàlẹ̀ ojú ìwé farahàn nínú ọ̀rọ̀ pàtàkì.
