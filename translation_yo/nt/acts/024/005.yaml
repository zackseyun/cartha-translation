id: ACT.24.5
reference: Acts 24:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: yo
  text: Nítorí a ti rí i pé ọkùnrin yìí jẹ́ àrùn àjàkálẹ̀, ó ń ru rògbòdìyàn sókè láàárín gbogbo àwọn Júù káàkiri ayé tí ènìyàn ń gbé, ó sì tún jẹ́ aṣáájú ẹgbẹ́ ìsìn àwọn ará Násárétì,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: àjàkálẹ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí àjàkálẹ̀ tàbí ohun apanirun, ṣùgbọ́n níhìn-ín ó jẹ́ ọ̀rọ̀ ẹ̀gàn fún ẹni tí wọ́n kà sí ewu fún àwùjọ. ‘Àjàkálẹ̀ ènìyàn’ pa àwòrán líle yẹn mọ́ ní Yorùbá.
- source_word: κινοῦντα στάσεις
  choice: ó ń dá ìrúkèrúdò sílẹ̀
  rationale: στάσεις lè tọ́ka sí ìṣọ̀tẹ̀, rògbòdìyàn, tàbí ìrúkèrúdò ẹgbẹ́. Gbólóhùn yìí fi ẹ̀sùn pípa ìdàrúdàpọ̀ àti rògbòdìyàn hàn láì fi ìtumọ̀ tóóró kan lé e lórí.
- source_word: οἰκουμένην
  choice: ayé tí ènìyàn ń gbé
  rationale: Ìtumọ̀ ìpilẹ̀ ni ilẹ̀ ayé tí a ń gbé; nínú ọ̀rọ̀ Róòmù ó sábà máa ń tọ́ka sí gbogbo àgbègbè ayé tí wọ́n mọ̀.
- source_word: πρωτοστάτην
  choice: aṣáájú
  rationale: Ó ń tọ́ka sí ẹni tó wà níwájú tàbí olórí pàtàkì nínú ẹgbẹ́ kan; ‘aṣáájú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó mú ẹ̀sùn náà jáde.
- source_word: αἱρέσεως
  choice: ẹgbẹ́ ìsìn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹgbẹ́ tàbí ẹ̀ka ìsìn, kì í ṣe dandan ẹ̀kọ́ èké ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wá lẹ́yìn náà.
- source_word: Ναζωραίων
  choice: àwọn ará Násárétì
  rationale: Orúkọ tí olùfisùn fi ń pe àwọn ọmọlẹ́yìn Jésù, tí ó so wọ́n mọ́ Násárétì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ αἵρεσις
  choice: ẹgbẹ́ ìsìn
  alternative: ẹgbẹ́ aládàámọ̀ / ẹ̀ya ìsìn
  rationale: ‘Ẹgbẹ́ ìsìn’ kò fi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò fi dandan hàn sí i, ṣùgbọ́n ó ṣì pa ohùn ẹ̀sùn olùfisùn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn ọ̀wọ̀ àti òde òní ni a lò. A pa ìṣàn gbólóhùn ẹ̀sùn ilé-ẹjọ́ mọ́, pẹ̀lú àwòrán líle ‘àjàkálẹ̀ ènìyàn’ àti àìdánilójú στάσεις gẹ́gẹ́ bí ìrúkèrúdò.
