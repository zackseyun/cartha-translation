id: ACT.24.21
reference: Acts 24:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: yo
  text: tàbí nítorí ọ̀rọ̀ kan ṣoṣo yìí tí mo ké jáde nígbà tí mo dúró láàárín wọn pé, “Nítorí àjíǹde àwọn òkú ni a ṣe ń dá mi lẹ́jọ́ níwájú yín lónìí.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìké” tàbí “ohùn” dípò “ọ̀rọ̀”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí a sọ tàbí sí ohùn tàbí ìké tí a fi sọ ọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àjíǹde kúrò láàárín àwọn òkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: ọ̀rọ̀
  rationale: Nínú àyíká yìí, φωνή ń tọ́ka sí ohun tí Pọ́ọ̀lù sọ, kì í ṣe ohùn rẹ̀ nìkan. “Ọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá fún gbólóhùn tàbí ìkéde kan pàtó.
- source_word: ἐκέκραξα
  choice: mo ké jáde
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí sísọ ohun sókè ní gbangba; “ké jáde” pa agbára ìkéde náà mọ́.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: nígbà tí mo dúró láàárín wọn
  rationale: Ó fi ipò Pọ́ọ̀lù àti àkókò tí ó ké jáde hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: ἀναστάσεως νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí pa ìtumọ̀ gbòòrò ti àjíǹde àwọn tí ó ti kú mọ́, láì sọ ọ́ di àjíǹde Jésù nìkan.
- source_word: κρίνομαι
  choice: a ṣe ń dá mi lẹ́jọ́
  rationale: Ìṣẹ̀dá àìṣe-taara àti àsìkò ìsinsìnyí hàn pé Pọ́ọ̀lù wà lábẹ́ ìdájọ́ ní àkókò náà.
- source_word: ἐφ’ ὑμῶν
  choice: níwájú yín
  rationale: Nínú ọ̀rọ̀ ilé-ẹjọ́, gbólóhùn náà túmọ̀ sí wíwà níwájú aláṣẹ tàbí ìgbìmọ̀ tó ń gbọ́ ẹjọ́, láì fi dandan sọ pé àwọn náà nìkan ni adájọ́.
- source_word: ἢ
  choice: tàbí
  rationale: Ó so ẹsẹ yìí mọ́ àwíjàre tó ṣáájú, ó sì pa ìṣòro gírámà Gíríìkì mọ́ láì ṣàlàyé rẹ̀ ju bí ó ti wà lọ.
- source_word: μιᾶς ταύτης
  choice: kan ṣoṣo yìí
  rationale: Ó tẹnu mọ́ pé ọ̀rọ̀ kan pàtó ṣoṣo ni Pọ́ọ̀lù ń tọ́ka sí.
- source_word: σήμερον
  choice: lónìí
  rationale: Èyí ni ìtumọ̀ àdánidá àti tó ṣe kedere ní Yorùbá òde òní.
theological_decisions:
- issue: Irú ẹ̀sùn tí wọ́n ń jiyàn lé lórí
  choice: Àjíǹde àwọn òkú lápapọ̀
  alternative: Àjíǹde Jésù ní pàtó gẹ́gẹ́ bí ìpìlẹ̀ ìrètí àjíǹde
  rationale: Gbólóhùn Gíríìkì περὶ ἀναστάσεως νεκρῶν jẹ́ gbòòrò. A kò mú un dín kù sí àjíǹde Jésù nìkan, bí ó tilẹ̀ jẹ́ pé ìwé Ìṣe so ìwàásù Pọ́ọ̀lù mọ́ àjíǹde Jésù ní àwọn ibòmíràn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún àyíká ilé-ẹjọ́. “A ṣe ń dá mi lẹ́jọ́” jẹ́ kedere sí òǹkàwé lásán, “mo ké jáde” sì pa ìgbóná ìkéde Pọ́ọ̀lù mọ́.
