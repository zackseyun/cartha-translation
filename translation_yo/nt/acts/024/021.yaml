  verdict: approve
  source_fidelity: Ìtumọ̀ náà fi ìsopọ̀ ‘tàbí’ tí ó ń tọ́ka sí ẹsẹ tó ṣáájú hàn dáadáa. Ó pa ìtẹnumọ́ ‘ọ̀rọ̀ kan ṣoṣo yìí’ mọ́; ‘mo ké jáde’ mú agbára ἐκέκραξα wá; ‘nígbà tí mo dúró láàárín wọn’ ṣàfihàn ìṣe ìdúró náà; àti ‘àjíǹde àwọn òkú’ dúró fún ìtumọ̀ gbogbogbò ti ἀναστάσεως νεκρῶν. ‘A ṣe ń dá mi lẹ́jọ́ níwájú yín lónìí’ jẹ́ ìtumọ̀ tó bá κρίνομαι àti ἐφ’ ὑμῶν mu nínú àyíká ilé-ẹjọ́.
  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì jẹ́ ohun tí a lè ka ní rọrùn. Ìkọ́lé ‘Nítorí ... ni a ṣe ń dá mi lẹ́jọ́’ jẹ́ ọ̀nà tó wọ́pọ̀ láti fi ohun tí ẹjọ́ náà dá lórí hàn, láì yí ìtumọ̀ àìṣe-taara Gíríìkì padà sí ìpinnu pàtó nípa ẹni tó ń dájọ́.
  terminology: ‘Àjíǹde àwọn òkú’ jẹ́ ọ̀rọ̀ ìsìn Yorùbá tó ye ẹni, ó sì yẹ fún gbolohun gbogbogbò náà; a kò sọ ọ́ di àjíǹde Jésù nìkan. Àwọn àlàyé abẹ́lẹ̀ [a] àti [b] ṣàfihàn àwọn yíyàn ìtumọ̀ fún φωνή àti ἀναστάσεως νεκρῶν ní òtítọ́, àwọn àmì wọn sì wà ní ibi tó tọ́.
