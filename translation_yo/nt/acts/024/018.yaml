translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “tẹ́ńpìlì” gẹ́gẹ́ bí ọ̀rọ̀ ìsìn tí ó mọ̀ọ́mọ̀ wọ́pọ̀. Àmi ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ.
