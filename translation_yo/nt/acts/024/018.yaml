  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: yo
  text: Nínú àwọn ọ̀ràn wọ̀nyí[a], wọ́n rí mi nínú tẹ́ńpìlì nígbà tí mo ti ṣe ìwẹ̀nùmọ́ àṣà ìsìn[b], kì í ṣe pẹ̀lú ogunlọ́gọ̀ ènìyàn tàbí pẹ̀lú ariwo ìdàrúdàpọ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “Nígbà tí àwọn nǹkan wọ̀nyí ń ṣẹlẹ̀,” tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, “nínú èyí wọ̀nyí.” Gbólóhùn Gíríìkì ἐν αἷς ń tọ́ka sí àwọn ọ̀ràn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
    reason: lexical_alternative
  - marker: b
    text: “Ìwẹ̀nùmọ́ àṣà ìsìn” níhìn-ín tọ́ka sí ìwẹ̀nùmọ́ ìṣe-ẹ̀sìn, kì í ṣe ìmọ́tótó lásán.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: Nígbà àwọn nǹkan wọ̀nyí
  rationale: Gbólóhùn yìí tọ́ka sí àwọn ohun tàbí ìṣẹ̀lẹ̀ tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn. Ó mú ìtumọ̀ àkókò àti ìtọ́kasí ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: εὗρόν με
  choice: wọ́n bá mi
  rationale: “Bá” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn olùfisùn pàdé tàbí rí Pọ́ọ̀lù ní ibi náà; kò ní agbára àfikún bí “ṣàwárí.”
- source_word: ἡγνισμένον
  choice: mo ti ṣe ìwẹ̀nùmọ́
  rationale: Ó fi hàn pé ìwẹ̀nùmọ́ ti parí, Pọ́ọ̀lù sì wà ní ipò ẹni tí a ti sọ di mímọ́ nípa àṣà ìsìn. Ìtumọ̀ yìí jẹ́ àdánidá ju ìkọ́lé aláìṣe Yorùbá gígùn lọ.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì yẹ níhìn-ín.
- source_word: οὐ μετὰ ὄχλου
  choice: kò sí ọ̀pọ̀ ènìyàn pẹ̀lú mi
  rationale: Ó sọ ní kedere pé Pọ́ọ̀lù kò ní àwùjọ ènìyàn tí ó tẹ̀ lé e; “ọ̀pọ̀ ènìyàn” kò fi ìtumọ̀ “agbo ọmọ ogun” tàbí “ìkójọpọ̀ onírúkèrúdò” tí ọ̀rọ̀ Gíríìkì kò béèrè kún un.
- source_word: οὐδὲ μετὰ θορύβου
  choice: bẹ́ẹ̀ ni kò sí ariwo rúdurùdu
  rationale: “Ariwo rúdurùdu” mú ìtumọ̀ ariwo àti ìdàrúdàpọ̀ gbangba inú θόρυβος jáde ní ọ̀rọ̀ ẹjọ́ yìí.
