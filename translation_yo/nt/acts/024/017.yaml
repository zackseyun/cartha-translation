base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: yo
  text: Lẹ́yìn ọ̀pọ̀ ọdún, mo dé láti mú àwọn ẹ̀bùn àánú[a] wá fún orílẹ̀-èdè mi àti àwọn ọrẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn ẹ̀bùn ìrànlọ́wọ́ fún àwọn aláìní.
    reason: lexical_explanation
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Lẹ́yìn ọ̀pọ̀ ọdún
  rationale: Gbólóhùn àsìkò náà túmọ̀ sí pé àkókò ọ̀pọ̀ ọdún ti kọjá. A kò fi δέ hàn lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ fẹ́lẹ́fẹ́, ìbẹ̀rẹ̀ yìí sì bá èdè Yorùbá mu.
- source_word: ἐλεημοσύνας
  choice: àwọn ẹ̀bùn àánú
  rationale: Èyí fi hàn pé àwọn ẹ̀bùn ni a pèsè láti ran àwọn aláìní lọ́wọ́, ó sì jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: ποιήσων
  choice: láti mú ... wá
  rationale: Pẹ̀lú ἐλεημοσύνας, ποιέω jẹ́ ọ̀rọ̀ àṣà fún fífúnni ní ohun ìtọrẹ; ‘mú ... wá’ bá ìrìn-àjò Pọ́ọ̀lù àti èdè Yorùbá àdánidá mu.
- source_word: εἰς τὸ ἔθνος μου
  choice: fún orílẹ̀-èdè mi
  rationale: ἔθνος níbí ń tọ́ka sí orílẹ̀-èdè Júù tí Pọ́ọ̀lù jẹ́ ara rẹ̀; yíyan ‘orílẹ̀-èdè mi’ pa agbára ọ̀rọ̀ náà mọ́ láì yí i sí ‘Kèfèrí.’
- source_word: παρεγενόμην
  choice: mo wá
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídé Pọ́ọ̀lù; ‘mo wá’ jẹ́ ọ̀nà kúkúrú, àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: προσφοράς
  choice: àwọn ọrẹ
  rationale: ‘Àwọn ọrẹ’ pa ìtumọ̀ gbòòrò ti ohun tí a mú wá tàbí fi fún Ọlọ́run mọ́, láì pinnu irú ọrẹ náà ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Irú iṣẹ́ àánú tí Pọ́ọ̀lù mú lọ sí Jerúsálẹ́mù
  choice: àwọn ẹ̀bùn àánú
  alternative: àwọn ohun ìtọrẹ fún àwọn aláìní
  rationale: Yíyan yìí jẹ́ ti ìtumọ̀ ọ̀rọ̀, kì í ṣe ti ẹ̀kọ́ ìgbàgbọ́. Ó sọ ìrànlọ́wọ́ fún àwọn aláìní di mímọ̀ ní èdè tí òǹkàwé òde òní lè lóye.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún àwọn òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ; a kò lo ọ̀rọ̀ ìjọ kan pàtó tàbí túmọ̀ irú àwọn ọrẹ náà ju bí orísun Gíríìkì ṣe sọ lọ.
