base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: yo
  text: Wọ́n kò sì lè fi ẹ̀rí fìdí àwọn ohun tí wọ́n ń fẹ̀sùn kàn mí lé lórí nísinsìnyí múlẹ̀ fún ọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “mú ẹ̀rí kalẹ̀ fún ọ” tàbí “fi hàn fún ọ”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ohun kan wá kalẹ̀, fífi hàn, tàbí fífi ìdí rẹ̀ múlẹ̀. Nínú àyíká ilé-ẹjọ́ yìí, ó ń tọ́ka sí fífi ẹ̀rí múlẹ̀ fún ẹ̀sùn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ... kò sì
  rationale: Ó ń tẹ̀ síwájú nínú àríyànjiyàn Pọ́ọ̀lù pẹ̀lú ìkọ̀; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára àsopọ̀ náà mọ́.
- source_word: παραστῆσαι
  choice: fi ẹ̀rí mú ... dúró
  rationale: Nínú ọ̀rọ̀ ilé-ẹjọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí láti gbé ẹ̀rí kalẹ̀ tàbí fìdí ẹ̀sùn múlẹ̀. Gbólóhùn Yorùbá yìí sọ ìtumọ̀ ìjẹ́rìí-ẹ̀rí náà ní kedere, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ gígùn rẹ̀ hàn.
- source_word: δύνανταί
  choice: lè
  rationale: Ó fi agbára tàbí àǹfààní láti ṣe ohun kan hàn ní ọ̀nà Yorùbá tó rọrùn.
- source_word: σοι
  choice: níwájú rẹ
  rationale: Dátífù náà tọ́ka sí Fẹ́líìsì gẹ́gẹ́ bí ẹni tí wọ́n ń gbé ẹjọ́ náà kalẹ̀ fún; “níwájú rẹ” bá àyíká ilé-ẹjọ́ mu láì yí ẹni tí ọ̀rọ̀ náà tọ́ sí padà.
- source_word: περὶ ὧν
  choice: àwọn ohun tí
  rationale: Ó pa ìtọ́kasí sí àwọn ọ̀ràn tí ẹ̀sùn náà dá lé mọ́ láì sọ wọ́n di àwọn ẹ̀sùn ní pàtó ju Gíríìkì lọ.
- source_word: νυνὶ
  choice: nísinsìnyí
  rationale: Ó fi àkókò ẹ̀sùn tí wọ́n ń ṣe lọ́wọ́ hàn ní kedere.
- source_word: κατηγοροῦσίν μου
  choice: wọ́n fi ń fẹ̀sùn kàn mí
  rationale: Ó mú ìtumọ̀ òfin ti “fẹ̀sùn kàn” jáde, ó sì pa ìṣe tó ń lọ lọ́wọ́ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àkójọpọ̀ ọ̀rọ̀ ilé-ẹjọ́ “fi ẹ̀rí mú ... dúró” àti “fẹ̀sùn kàn” láti mú ipò ẹjọ́ hàn láì jẹ́ kí èdè náà le ju.
