id: ACT.24.1
reference: Acts 24:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ márùn-ún, Ananíà, olórí àlùfáà, sọ̀kalẹ̀ wá pẹ̀lú àwọn alàgbà kan àti agbẹnusọ kan tí a ń pè ní Tẹ́túlù[a]. Wọ́n sì fẹ̀sùn kan Pọ́ọ̀lù níwájú gómìnà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “agbẹjọ́rò kan tí a ń pè ní Tẹ́túlù”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tó ń sọ̀rọ̀ ní gbangba tàbí aṣojú nínú ọ̀ràn òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Lẹ́yìn ọjọ́ márùn-ún
  rationale: Ó fi hàn pé ọjọ́ márùn-ún ti kọjá; a kò fi δέ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìbẹ̀rẹ̀ ọ̀tọ̀, nítorí Yorùbá kò nílò rẹ̀ níbí.
- source_word: κατέβη
  choice: sọ̀kalẹ̀ wá
  rationale: Ó pa ìtumọ̀ ìrìn-àjò sí ibi tí ó rẹlẹ̀ mọ́, ó sì bá ìrìn láti Jerúsálẹ́mù sí Kesaria mu.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò àlùfáà gíga jù lọ láàárín àwọn Júù.
- source_word: Ἁνανίας
  choice: Ananíà
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń pe àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: pẹ̀lú àwọn alàgbà kan
  rationale: “Àwọn alàgbà” tọ́ka sí àwọn aṣáájú Júù níbí, “kan” sì pa àìdánimọ̀ τις mọ́.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: ọ̀rọ̀sọ kan tí a ń pè ní Tẹ́túlù
  rationale: “Ọ̀rọ̀sọ” pa ìtumọ̀ ẹni tó mọ sísọ̀rọ̀ ní gbangba mọ́ láì pinnu bóyá agbẹjọ́rò ni ní pàtó; àlàyé ìsàlẹ̀ fi ìtumọ̀ ti ọ̀rọ̀ ẹjọ́ hàn.
- source_word: οἵτινες
  choice: Wọ́n sì
  rationale: Ó tọ́ka sí gbogbo àwọn tí a ṣẹ̀ṣẹ̀ dárúkọ, ó sì jẹ́ ìsopọ̀ àrọ́sọ tó bá Yorùbá mu.
- source_word: ἐνεφάνισαν
  choice: fẹ̀sùn kan
  rationale: Nínú àyíká ilé ẹjọ́, ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀sùn hàn ní ìlànà òfin.
- source_word: τῷ ἡγεμόνι
  choice: níwájú gómìnà
  rationale: Èyí sọ pé wọ́n gbé ẹjọ́ náà kalẹ̀ níwájú alákòóso Róòmù.
- source_word: κατὰ τοῦ Παύλου
  choice: kan Pọ́ọ̀lù
  rationale: Pẹ̀lú “fẹ̀sùn,” èyí ń sọ ní kedere pé Pọ́ọ̀lù ni wọ́n ń fẹ̀sùn kàn.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá òde òní tó ní ọlá, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tó bá ẹ̀dá èdè mu. A gbé àmì àlàyé [a] mọ́ “Tẹ́túlù,” ibi tí àṣàyàn ọ̀rọ̀ ῥήτωρ ti wúlò, dípò kí a gbé e mọ́ gbolohun àkókò.
