translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àwọn àmì ohùn níbi tí ó bá yẹ. ‘Wádìí rẹ̀ lẹ́nu wò’ mú àyíká ìgbẹ́jọ́ náà hàn ní èdè tí òǹkàwé lásán lè lóye; a sì pa ìtẹnumọ́ ‘ìwọ fúnra rẹ’ àti ‘àwa’ mọ́.
