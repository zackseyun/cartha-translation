source:
  edition: SBLGNT
  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: yo
  text: Láti ọ̀dọ̀ rẹ̀[a], ìwọ fúnra rẹ yóò lè, nípa wíwádìí rẹ̀[b], mọ̀ nípa gbogbo nǹkan wọ̀nyí tí àwa fi ń fẹ̀sùn kàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì péye sí i, “láti ọ̀dọ̀ ẹni tí ìwọ fúnra rẹ, lẹ́yìn tí o ti wádìí rẹ̀, yóò lè rí dájú nípa gbogbo ọ̀ràn tí àwa fi ń fẹ̀sùn kàn án.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní àfikún gbólóhùn kan ní ẹsẹ 7 pé olórí ogun Lisia fi ipá gba Pọ́ọ̀lù kúrò lọ́wọ́ wọn, ó sì pàṣẹ fún àwọn olùfisùn láti wá síwájú Fẹlikisi. Àwọn ọ̀rọ̀ náà kò sí nínú ẹ̀dà SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: Láti ọ̀dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ παρά pẹ̀lú ẹ̀yà atọ́ka ìní ń tọ́ka sí orísun ìmọ̀ náà. Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì fi hàn pé Fẹlikisi lè rí ìsọfúnni náà gbà láti ọ̀dọ̀ ẹni tí yóò wádìí lẹ́nu wò.
- source_word: δυνήσῃ
  choice: yóò ti lè mọ
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà sọ agbára tàbí àǹfààní láti dé orí ìmọ̀ lẹ́yìn ìwádìí; ‘yóò lè’ mú èyí jáde ní Yorùbá àdánidá.
- source_word: αὐτὸς
  choice: ìwọ fúnra rẹ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, ó sì fi hàn pé Fẹlikisi fúnra rẹ̀ ni yóò ṣe ìwádìí náà.
- source_word: ἀνακρίνας
  choice: lẹ́yìn tí o bá ti wádìí rẹ̀ lẹ́nu wò
  rationale: Nínú ọ̀rọ̀ ilé-ẹjọ́, ἀνακρίνω túmọ̀ sí ṣíṣe ìwádìí tàbí fífi ìbéèrè yẹ ẹni wò. Ìtumọ̀ yìí pa ìhà ìdájọ́ náà mọ́ láì fi sí fífi ìbéèrè nìkan.
- source_word: περὶ πάντων τούτων
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Èyí pa ìtẹnumọ́ ‘gbogbo’ àti ọ̀pọ̀ nǹkan tí a ṣẹ̀ṣẹ̀ fẹ̀sùn lé Pọ́ọ̀lù lórí mọ́.
- source_word: ἐπιγνῶναι
  choice: mọ
  rationale: Nínú àyíká ilé-ẹjọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí wíwá mọ̀ tàbí rí òtítọ́ ọ̀ràn dájú. ‘Mọ’ jẹ́ kedere, ó sì yẹ fún Yorùbá òde òní.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: tí àwa fi ń fẹ̀sùn kàn án
  rationale: Gbólóhùn náà pa ìtẹnumọ́ ‘àwa’ àti ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ ti κατηγορέω mọ́.
