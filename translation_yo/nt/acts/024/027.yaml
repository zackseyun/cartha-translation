id: ACT.24.27
reference: Acts 24:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọdún méjì pé[a], Pọ́kíù Fẹ́sítù rọ́pò Fẹ́líìsì ní ipò; Fẹ́líìsì sì fi Pọ́ọ̀lù sílẹ̀ ní ìdè, nítorí ó fẹ́ ṣe ojúrere fún àwọn Júù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí ọdún méjì kọjá.”
    reason: Àyípadà ọ̀nà ìtumọ̀ fún gbólóhùn àkókò Διετίας ... πληρωθείσης.
  - marker: b
    text: Tàbí, “nítorí ó fẹ́ wá ojúrere àwọn Júù.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ṣíṣe ojúrere fún wọn tàbí wíwá ìfẹ́ rere wọn.
    reason: Àìdájú ìtumọ̀ χάριτα καταθέσθαι ni a pa mọ́.
lexical_decisions:
- source_word: Διετίας ... πληρωθείσης
  choice: nígbà tí ọdún méjì pé
  rationale: Gbólóhùn olódì genitive yìí fi àkókò hàn. ‘Ọdún méjì pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò ọdún méjì ti parí.
- source_word: ἔλαβεν διάδοχον
  choice: Pọ́kíù Fẹ́sítù rọ́pò Fẹ́líìsì ní ipò
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní tààràtà túmọ̀ sí pé Fẹ́líìsì ‘gba arọ́pò,’ Yorùbá àdánidá máa ń sọ pé ẹnì kan rọ́pò ẹlòmíràn ní ipò.
- source_word: Πόρκιον Φῆστον
  choice: Pọ́kíù Fẹ́sítù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró Yorùbá, pẹ̀lú àmì ohùn.
- source_word: θέλων
  choice: nítorí ó fẹ́
  rationale: Participle náà sọ ìdí tí Fẹ́líìsì fi ṣe ohun tó ṣe; ‘nítorí’ mú ìbáṣepọ̀ ìdí yẹn ṣe kedere ní Yorùbá.
- source_word: χάριτα καταθέσθαι
  choice: ṣe ojúrere fún
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí lè túmọ̀ sí ṣíṣe ojúrere fún wọn tàbí wíwá ojúrere wọn. ‘Ṣe ojúrere fún’ jẹ́ Yorùbá àdánidá, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τοῖς Ἰουδαίοις
  choice: fún àwọn Júù
  rationale: Dative náà bá ìtumọ̀ ‘ṣe ojúrere fún’ mu, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: κατέλιπε
  choice: fi ... sílẹ̀
  rationale: Èyí sọ pé nígbà tí Fẹ́líìsì kúrò ní ipò, kò tú Pọ́ọ̀lù sílẹ̀, bí kò ṣe pé ó fi í sílẹ̀ nínú ipò tí ó wà.
- source_word: δεδεμένον
  choice: ní dídè
  rationale: Perfect passive participle náà tẹnumọ́ pé Pọ́ọ̀lù ṣì wà ní ipò ẹni tí a dè; ‘ní dídè’ kò fi kún un pé ẹ̀wọ̀n kan pàtó ni wọ́n fi dè é.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn Júù’ àti àkọsílẹ̀ orúkọ pẹ̀lú àmì ohùn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn àkókò; àmì [b] yẹ kí ó fara hàn lẹ́yìn ‘fún àwọn Júù’ nínú ọ̀rọ̀ àkọ́kọ́.
