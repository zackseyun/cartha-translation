  - severity: medium
    issue: Àlàyé ìsàlẹ̀ fún χάριτα καταθέσθαι kò sí
    rationale: Ìpinnu ìtumọ̀ náà sọ pé a gbọdọ̀ pa ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀, ṣùgbọ́n àlàyé [b] kò wà, bẹ́ẹ̀ sì ni àmì rẹ̀ kò hàn nínú ọ̀rọ̀ náà. Àfikún rẹ̀ ń ṣètọ́jú àìdájú lexical náà.
