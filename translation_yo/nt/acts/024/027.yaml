  to: Ṣùgbọ́n nígbà tí ọdún méjì pé[a], Pọ́kíù Fẹ́sítù rọ́pò Fẹ́líìsì ní ipò; Fẹ́líìsì sì fi Pọ́ọ̀lù sílẹ̀ ní ìdè, nítorí ó fẹ́ ṣe ojúrere fún àwọn Júù[b].
