id: ACT.24.16
reference: Acts 24:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: yo
  text: Nítorí èyí[a], èmi fúnra mi pẹ̀lú ń sapá nígbà gbogbo láti ní ẹ̀rí-ọkàn tí kò lẹ́bi níwájú Ọlọ́run àti ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú èyí.”
    reason: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì ἐν τούτῳ lè túmọ̀ sí “nínú èyí” ní tààrà, tàbí kí ó ní agbára ìdí bí “nítorí èyí” nínú àyíká ọ̀rọ̀ náà.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nítorí èyí
  rationale: Ọ̀rọ̀ yìí tọ́ka padà sí ìrètí tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa rẹ̀, ó sì lè fi ìdí ìsapá rẹ̀ hàn. “Nítorí èyí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ ìdí yìí, nígbà tí àlàyé ìsàlẹ̀ fi “Nínú èyí” pamọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí Gíríìkì lè gbà.
- source_word: καὶ αὐτὸς
  choice: èmi fúnra mi pẹ̀lú
  rationale: “Pẹ̀lú” pa agbára καί mọ́, “fúnra mi” sì mú ìtẹnumọ́ αὐτός jáde ní Yorùbá tí ó ṣe kedere.
- source_word: ἀσκῶ
  choice: ń sapá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ara ẹni ṣe àṣà, ìdánilẹ́kọ̀ọ́, tàbí lílo gbogbo okun. “Ń sapá” fi ìtiraka onítẹ̀síwájú tí àyíká ọ̀rọ̀ náà ń béèrè hàn lọ́nà àdánidá.
- source_word: ἀπρόσκοπον
  choice: tí kò lẹ́bi
  rationale: Níbi yìí, ọ̀rọ̀ náà ṣàpèjúwe ẹ̀rí-ọkàn tí kò ní ohun tí yóò mú ìdálẹ́bi tàbí ìkọ̀sẹ̀ wá. “Tí kò lẹ́bi” jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó sì bá ìbáṣepọ̀ pẹ̀lú Ọlọ́run àti ènìyàn mu.
- source_word: συνείδησιν
  choice: ẹ̀rí-ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ìmọ̀ inú nípa ohun rere àti ohun búburú.
- source_word: ἔχειν
  choice: láti ní
  rationale: Ó jẹ́ ọ̀rọ̀ àfojúsùn tí ó tẹ̀ lé “ń sapá,” ó sì pa ìtumọ̀ tààrà ti Gíríìkì mọ́.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: níwájú Ọlọ́run àti ènìyàn
  rationale: “Níwájú” fi ìbáṣepọ̀ àti jíjíhìn hàn ní Yorùbá. “Ènìyàn” lè dúró fún gbogbo ẹ̀dá ènìyàn láìfi akọ tàbí abo sí i, bí ἀνθρώπους ṣe rí níbí.
- source_word: διὰ παντός
  choice: nígbà gbogbo
  rationale: Ó fi ìwà tí ń bá a lọ ní gbogbo ìgbà hàn lọ́nà Yorùbá tí ó mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπους gẹ́gẹ́ bí gbogbo ẹ̀dá ènìyàn
  choice: ènìyàn
  alternative: àwọn ènìyàn
  rationale: Bó tilẹ̀ jẹ́ pé ἀνθρώπους jẹ́ ọ̀pọ̀ nínú Gíríìkì, “ènìyàn” lè jẹ́ orúkọ àpapọ̀ ní Yorùbá, ó sì kó ọkùnrin àti obìnrin jọ ní ti ẹ̀dá ènìyàn láìdá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun sílẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà pa ìtẹnumọ́ “èmi fúnra mi pẹ̀lú,” ìsapá tí ń bá a lọ, àti ojúṣe sí Ọlọ́run àti sí gbogbo ènìyàn mọ́.
