translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò gbólóhùn náà ṣàlàyé ìdí tí Fẹlikisi fi sún ọ̀ràn náà síwájú, ó sì pa èdè ilé-ẹjọ́ àti ìtumọ̀ pàtàkì “Ọ̀nà” mọ́.
