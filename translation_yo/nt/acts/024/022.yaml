  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: yo
  text: Ṣùgbọ́n Fẹlikisi, nítorí tí ó ní ìmọ̀ tó péye sí i nípa Ọ̀nà náà[b], sún ọ̀ràn wọn síwájú[a], ó ní, “Nígbà tí Lisia olórí ọmọ ogun bá sọ̀kalẹ̀ wá, èmi yóò pinnu ẹjọ́ yín[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “dá ìgbọ́jọ́ náà dúró fún ìgbà díẹ̀”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ìgbésẹ̀ ilé-ẹjọ́ síwájú tàbí dídá a dúró títí di ìgbà mìíràn.
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀nà” jẹ́ ọ̀kan lára àwọn orúkọ tí a fi ń pe ẹgbẹ́ àwọn Kristẹni ní ìgbà ìbẹ̀rẹ̀.
    reason: cultural_note
  - marker: c
    text: Tàbí “èmi yóò pinnu àwọn ọ̀ràn tó kàn yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: sún ọ̀ràn wọn síwájú
  rationale: Ọ̀rọ̀ náà ní agbègbè ìdájọ́ túmọ̀ sí fífi ìgbésẹ̀ tàbí ìpinnu sí ọjọ́ mìíràn. Bí ó tilẹ̀ jẹ́ pé αὐτούς tọ́ka tààrà sí àwọn ènìyàn náà, gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ fífi ọ̀ràn àwọn ẹgbẹ́ méjèèjì síwájú mọ́.
- source_word: ἀκριβέστερον εἰδὼς
  choice: nítorí tí ó ní ìmọ̀ tó péye sí i
  rationale: Èyí pa agbára afiwéra ἀκριβέστερον mọ́, ó sì fi hàn pé ìmọ̀ Fẹlikisi ní nípa ọ̀ràn náà ló bá ìgbésẹ̀ rẹ̀ mu.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: nípa Ọ̀nà náà
  rationale: “Ọ̀nà” jẹ́ orúkọ tí ìwé Ìṣe ń lò fún ẹgbẹ́ àwọn ọmọlẹ́yìn Jesu; lílo lẹ́tà ńlá ń fi ìlò pàtàkì yìí hàn láì ṣe àlàyé rẹ̀ sínú ẹsẹ náà.
- source_word: Ὅταν ... καταβῇ
  choice: Nígbà tí ... bá sọ̀kalẹ̀ wá
  rationale: Àkópọ̀ “nígbà tí ... bá” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí hàn, “sọ̀kalẹ̀ wá” sì pa àwòrán ìrìn-àjò inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: χιλίαρχος
  choice: olórí ọmọ ogun
  rationale: Ìtumọ̀ iṣẹ́ rẹ̀ yìí yé òǹkàwé Yorùbá òde òní ju lílo ọ̀rọ̀ Róòmù tí a yá lọ.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: èmi yóò pinnu ẹjọ́ yín
  rationale: Nínú àyíká ilé-ẹjọ́, διαγνώσομαι túmọ̀ sí ṣíṣe ìpinnu lẹ́yìn àyẹ̀wò; “ẹjọ́ yín” sì jẹ́ ìtumọ̀ Yorùbá àdánidá fún àwọn ọ̀ràn tó kan wọn.
