  to: Lẹ́yìn ọjọ́ mélòó kan, Fẹ́líìsì dé pẹ̀lú Dùrúṣílà, ìyàwó tirẹ̀ gan-an, ẹni tí ó jẹ́ Júù. Ó sì ránṣẹ́ kí wọ́n pe Pọ́ọ̀lù wá, ó sì tẹ́tí sí i nípa ìgbàgbọ́[b] nínú Mèsáyà Jesu.[a]
