id: ACT.24.24
reference: Acts 24:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mélòó kan, Fẹ́líìsì dé pẹ̀lú Dùrúṣílà, ìyàwó tirẹ̀ gan-an, ẹni tí ó jẹ́ Júù. Ó sì ránṣẹ́ kí wọ́n pe Pọ́ọ̀lù wá, ó sì tẹ́tí sí i nípa ìgbàgbọ́[b] nínú Mèsáyà Jesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “Kristi Jesu.” A lo “Mèsáyà” níbí nítorí pé Χριστός jẹ́ oyè.
    reason: alternative_reading
  - marker: b
    text: A tún lè sọ pé, “ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì πίστις lè ní ìtumọ̀ yìí pẹ̀lú, bó tilẹ̀ jẹ́ pé “ìgbàgbọ́” ni a lò nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Lẹ́yìn ọjọ́ mélòó kan
  rationale: Ó túmọ̀ gbólóhùn àkókò náà ní ti ẹ̀dá, nígbà tí a kò fi ọ̀rọ̀ àfikún bí ‘nísinsin yìí’ kún δέ.
- source_word: παραγενόμενος
  choice: dé
  rationale: Ọ̀rọ̀ náà tọ́ka sí wíwá tàbí dídé Fẹ́líìsì sí ibẹ̀; ‘dé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: τῇ ἰδίᾳ γυναικὶ
  choice: aya òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ ἰδίᾳ mọ́, pé Dùrúṣílà ni aya tirẹ̀ gan-an.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: ẹni tí ó jẹ́ Júù
  rationale: Ó sọ ìdánimọ̀ Dùrúṣílà gẹ́gẹ́ bí Júù ní ọ̀nà tó bójú mu, láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀gàn.
- source_word: μετεπέμψατο
  choice: ránṣẹ́ pe
  rationale: Ó mú ìtumọ̀ pé ó ní kí a lọ pe Pọ́ọ̀lù wá jáde ní Yorùbá àdánidá.
- source_word: ἤκουσεν αὐτοῦ
  choice: fetí sí ọ̀rọ̀ rẹ̀
  rationale: Pẹ̀lú àyíká ọ̀rọ̀ yìí, ἀκούω pẹ̀lú genitive túmọ̀ sí pé ó tẹ́tí sí Pọ́ọ̀lù, kì í ṣe pé ó kàn gbọ́ ohùn rẹ̀.
- source_word: περὶ τῆς ... πίστεως
  choice: nípa ìgbàgbọ́
  rationale: περί fi kókó ọ̀rọ̀ tí Pọ́ọ̀lù sọ hàn, ìgbàgbọ́ sì ni ìtumọ̀ àkọ́kọ́ tó yẹ fún πίστις níbí.
- source_word: εἰς Χριστὸν Ἰησοῦν
  choice: nínú Mèsáyà Jesu
  rationale: εἰς fi ẹni tí ìgbàgbọ́ náà dojú kọ hàn. ‘Mèsáyà’ pa ipa Χριστός gẹ́gẹ́ bí oyè mọ́, ‘Jesu’ sì tẹ̀ lé bí ó ti rí nínú Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu; Jesu Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà Jesu’ pa oyè náà àti bí àwọn ọ̀rọ̀ Gíríìkì ṣe tẹ̀ lé ara wọn mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà míì hàn.
- issue: Ìtumọ̀ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: ìgbàgbọ́ nínú Mèsáyà Jesu
  alternative: ìgbẹ́kẹ̀lé nínú Mèsáyà Jesu
  rationale: πίστις pẹ̀lú εἰς àti accusative tọ́ka sí ìgbàgbọ́ tí a gbé lé Jesu, kì í ṣe ìṣòtítọ́ Jesu. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú ‘ìgbẹ́kẹ̀lé’ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A pín gbólóhùn náà sí méjì kí ó lè ṣàn dáadáa ní Yorùbá, láìyí ìbáṣepọ̀ àwọn ìṣẹ̀lẹ̀ padà.
