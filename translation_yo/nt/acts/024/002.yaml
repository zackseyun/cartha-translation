  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: yo
  text: 'Nígbà tí a sì pè é wọlé, Tẹ́túlù bẹ̀rẹ̀ sí í fẹ̀sùn kàn án, ó ní: “Níwọ̀n bí a ti ń gbádùn àlàáfíà púpọ̀ nípasẹ̀ rẹ, tí àwọn àtúnṣe[a] sì ń wáyé fún orílẹ̀-èdè yìí nípasẹ̀ ìfojúsọ́nà rẹ[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “àwọn ìmúgbòòrò” tàbí “àwọn ìgbésẹ̀ àtúnṣe.”
    reason: lexical_alternative
  - marker: b
    text: Àbí “ọgbọ́n inú ìṣàkóso rẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ríronú síwájú tàbí ètò ìṣàkóso alákóso kan níbí, kì í ṣe dandan pé ó ń tọ́ka sí ìpèsè Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Nígbà tí a sì pè é wọlé
  rationale: Ọ̀rọ̀ yìí jẹ́ genitive absolute tó ṣàlàyé ipò tí ìṣe pàtàkì ti bẹ̀rẹ̀. “Pè é wọlé” bá àyíká ilé-ẹjọ́ mu, ó sì pa arọ́pò-orúkọ Gíríìkì mọ́ láìfi orúkọ Pọ́ọ̀lù kún un.
- source_word: ἤρξατο κατηγορεῖν
  choice: bẹ̀rẹ̀ sí í fẹ̀sùn kàn án
  rationale: Ó fi ìbẹ̀rẹ̀ ìṣe náà hàn, “fẹ̀sùn kàn” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹ̀sùn ní àyíká òfin.
- source_word: ὁ Τέρτυλλος
  choice: Tẹ́túlù
  rationale: A ṣe àfọ̀rọ̀kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró àti ìlò Yorùbá.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí ṣàgbékalẹ̀ ọ̀rọ̀ tí Tẹ́túlù sọ ní Yorùbá àdánidá, láìyí iṣẹ́ participle náà padà.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: Níwọ̀n bí a ti ń gbádùn àlàáfíà púpọ̀
  rationale: “Ń gbádùn àlàáfíà púpọ̀” sọ ìrírí àlàáfíà tó pọ̀ jáde, ó sì pa ọ̀rọ̀ ìpọ́nni Tẹ́túlù mọ́.
- source_word: διὰ σοῦ
  choice: nípasẹ̀ rẹ
  rationale: Ó ṣe àfihàn ẹni tí àlàáfíà náà ti ọwọ́ rẹ̀ wá, gẹ́gẹ́ bí διά pẹ̀lú genitive ṣe túmọ̀ sí níbí.
- source_word: διορθωμάτων
  choice: àwọn àtúnṣe
  rationale: “Àwọn àtúnṣe” lè tọ́ka sí ìṣe ìṣàtúnṣe tàbí ìmúgbòòrò nínú ìṣàkóso, ó sì yẹ fún àyíká òṣèlú náà.
- source_word: γινομένων
  choice: ń wáyé
  rationale: Èyí pa èrò pé àwọn àtúnṣe náà ń ṣẹlẹ̀ mọ́, láìfi aṣojú ìṣe kan kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τῷ ἔθνει τούτῳ
  choice: fún orílẹ̀-èdè yìí
  rationale: Ní àyíká yìí ἔθνος ń tọ́ka sí àwọn Júù gẹ́gẹ́ bí orílẹ̀-èdè kan lábẹ́ ìṣàkóso Róòmù; “orílẹ̀-èdè” bá àyíká ìṣàkóso àti òfin mu.
- source_word: διὰ τῆς σῆς προνοίας
  choice: nípasẹ̀ ìfojúsọ́nà rẹ
  rationale: “Ìfojúsọ́nà” fi èrò ìrònú síwájú àti ètò ìṣàkóso hàn, láìmú ìtumọ̀ ìpèsè Ọlọ́run wọ ọ̀rọ̀ tí a sọ nípa alákóso ènìyàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πρόνοια ní àyíká ìṣàkóso ènìyàn
  choice: ìfojúsọ́nà
  alternative: ìpèsè; ọgbọ́n inú ìṣàkóso
  rationale: Tẹ́túlù ń yin alákóso ènìyàn fún bí ó ṣe ń ronú síwájú àti bí ó ṣe ń ṣètò. “Ìfojúsọ́nà” yẹra fún fífi èrò pé ìpèsè àtọ̀runwá ni ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. A pa ìrísí ọ̀rọ̀ ìpọ́nni Tẹ́túlù àti ìtẹ̀síwájú gbólóhùn sí ẹsẹ tó tẹ̀ lé mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí àlàyé wọn kan.
