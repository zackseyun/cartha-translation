  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: yo
  text: Ó sì pàṣẹ fún balógun ọgọ́rùn-ún náà pé kí ó pa Pọ́ọ̀lù mọ́ lábẹ́ ìṣọ́, ṣùgbọ́n kí ó fún un ní ìrọ̀rùn díẹ̀[a], kí ó má sì ṣe dá ẹnikẹ́ni nínú àwọn tirẹ̀ dúró láti ràn án lọ́wọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó fún un ní òmìnira díẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìtura, ìrọ̀rùn, tàbí òmìnira díẹ̀ kúrò nínú ìhámọ́ líle.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “àwọn tirẹ̀.” Ó ṣeé ṣe kí èyí tọ́ka sí àwọn alábàákẹ́gbẹ́ tàbí alátìlẹ́yìn Pọ́ọ̀lù tí a yọ̀ǹda fún láti ràn án lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: Ó sì pàṣẹ
  rationale: Aorist participle náà ń tẹ̀síwájú nínú ìtàn; gbólóhùn aláṣẹ pẹ̀lú “sì” jẹ́ èdè Yorùbá àdánidá.
- source_word: τῷ ἑκατοντάρχῃ
  choice: fún balógun ọ̀rún náà
  rationale: “Balógun ọ̀rún” ń ṣàfihàn ọ̀gá ọmọ-ogun Róòmù tó ń darí nǹkan bí ọgọ́rùn-ún ọmọ-ogun, ó sì ṣe kedere ju fífi ọ̀rọ̀ àjèjì sílẹ̀ lọ.
- source_word: τηρεῖσθαι αὐτόν
  choice: kí ó máa ṣọ́ Pọ́ọ̀lù mọ́
  rationale: Nínú ọ̀rọ̀ ẹjọ́ yìí, τηρέω túmọ̀ sí pípa ẹni mọ́ lábẹ́ ìṣọ́. Orúkọ Pọ́ọ̀lù ni a tún lò kí aṣojú-orúkọ má bà a dàrú.
- source_word: ἔχειν τε ἄνεσιν
  choice: kí ó fún un ní ìrọ̀rùn díẹ̀
  rationale: ἄνεσις lè jẹ́ ìtura, ìrọ̀rùn, tàbí òmìnira kúrò nínú ìhámọ́ tó le. “Ìrọ̀rùn díẹ̀” pa ìtumọ̀ rẹ̀ mọ́ láì sọ ọ́ di òmìnira pátápátá.
- source_word: τε ... καὶ
  choice: ṣùgbọ́n ... kí ó má sì
  rationale: Àwọn asopọ̀ náà so àṣẹ méjì pọ̀; “ṣùgbọ́n” mú ìyàtọ̀ láàárín pípa mọ́ àti fífún ní ìrọ̀rùn hàn ní Yorùbá àdánidá.
- source_word: μηδένα κωλύειν
  choice: kí ó má sì ṣe dá ẹnikẹ́ni ... dúró
  rationale: 'Èyí pa agbára ọ̀rọ̀ òdì tó kan gbogbo ènìyàn mọ́: kò gbọ́dọ̀ dí ẹnikẹ́ni lọ́wọ́.'
- source_word: τῶν ἰδίων αὐτοῦ
  choice: nínú àwọn ènìyàn tirẹ̀
  rationale: Gbólóhùn Gíríìkì kò sọ bóyá ìdílé, ọ̀rẹ́, tàbí alábàákẹ́gbẹ́ ni; yíyan yìí pa àìdánilójú àti ìfẹ̀ rẹ̀ mọ́.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: láti ṣe ìránṣẹ́ fún un
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ìrànlọ́wọ́ tàbí pípèsè ohun tí ó nílò. “Ṣe ìránṣẹ́ fún un” jẹ́ àdánidá, kò sì fi ìtumọ̀ ẹ̀sìn àkànṣe kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìtumọ̀ ἄνεσις àti τῶν ἰδίων αὐτοῦ mọ́ ní fífẹ̀, a sì yẹra fún sísọ pé òmìnira pátápátá ni Pọ́ọ̀lù ní tàbí pé ìdílé rẹ̀ nìkan ni a ń tọ́ka sí.
