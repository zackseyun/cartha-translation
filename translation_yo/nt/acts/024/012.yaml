source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: yo
  text: Wọ́n kò sì rí mi ní tẹ́ńpìlì tí mo ń bá ẹnikẹ́ni jiyàn[a] tàbí tí mo ń kó ogunlọ́gọ̀ jọ[b], bẹ́ẹ̀ ni wọn kò rí mi ní àwọn sínágọ́gù tàbí ní ibikíbi káàkiri ìlú náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí mo ń bá ẹnikẹ́ni ṣe awuyewuye,” tàbí “tí mo ń bá ẹnikẹ́ni jíròrò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ọ̀rọ̀ wé ọ̀rọ̀ tàbí jíjiyàn; nínú àyíká yìí, ìtumọ̀ tó ní ìtakò díẹ̀ bá ọ̀rọ̀ ààbò Pọ́ọ̀lù mu jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí mo ń dá ìkójọpọ̀ ogunlọ́gọ̀ sílẹ̀.” Gbólóhùn Gíríìkì náà tọ́ka sí kíkó ogunlọ́gọ̀ jọ tàbí dídá ìdàrúdàpọ̀ kan sílẹ̀ láàárín ọ̀pọ̀ ènìyàn; kò fi dandan sọ pé ìrúkèrúdò ńlá ti ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ní Ìṣe sábà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “tẹ́ńpìlì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: εὗρόν με
  choice: Wọn kò sì rí mi
  rationale: Ó pa èrò inú ọ̀rọ̀ ààbò Pọ́ọ̀lù mọ́ pé àwọn olùfisùn rẹ̀ kò bá a níbi tí ó ti ń ṣe àwọn ohun tí wọ́n fi kàn án.
- source_word: πρός τινα διαλεγόμενον
  choice: tí mo ń bá ẹnikẹ́ni jiyàn
  rationale: διαλέγομαι lè túmọ̀ sí jíjíròrò, fífi ọ̀rọ̀ wé ọ̀rọ̀, tàbí jíjiyàn; nínú àyíká ẹjọ́ yìí, “jiyàn” fi ìtumọ̀ ìtakò hàn láìṣe àfikún ju orísun lọ.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: tí mo ń ru ogunlọ́gọ̀ sókè
  rationale: Gbólóhùn náà ń tọ́ka sí mímú kí ogunlọ́gọ̀ kóra jọ tàbí kí rúdurùdu bẹ̀rẹ̀; yíyan yìí jẹ́ àdánidá ní Yorùbá, kò sì fi dandan sọ pé ìrúkèrúdò ńlá tàbí ìjà ti ṣẹlẹ̀.
- source_word: ὄχλου
  choice: ogunlọ́gọ̀
  rationale: Ó túmọ̀ sí ọ̀pọ̀ ènìyàn tí wọ́n kóra jọ; kò fi ìwà ipá tí “agbo àwọn onírúkèrúdò” lè ní kún un.
- source_word: συναγωγαῖς
  choice: àwọn sínágọ́gù
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún ibi ìpàdé àti ìjọsìn àwọn Júù.
- source_word: κατὰ τὴν πόλιν
  choice: ní ibikíbi káàkiri ìlú náà
  rationale: κατά pẹ̀lú accusative níhìn-ín ń fi ìtànkálẹ̀ ká gbogbo agbègbè hàn; “ní ibikíbi káàkiri” mú kí ìtumọ̀ pé kò sí ibi kan nínú ìlú náà tí wọ́n ti rí i bẹ́ẹ̀ ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “Wọn kò sì rí mi” láti mú ìkọ̀sí οὔτε ṣiṣẹ́ lọ́nà àdánidá, a sì tún un ní apá kejì fún ìṣe kedere. Àwọn àmì ohùn ni a fi sí ibi tí ó bá àkọtọ̀ Yorùbá boṣewa mu.
