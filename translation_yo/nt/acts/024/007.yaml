  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: yo
  text: Ṣùgbọ́n Lísíà, olórí ọmọ ogun, dé, ó sì fi ipá púpọ̀ mú un kúrò lọ́wọ́ wa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí—papọ̀ pẹ̀lú apá ìparí ẹsẹ 6 àti apá ìbẹ̀rẹ̀ ẹsẹ 8—kò sí nínú àwọn àfọwọ́kọ Gíríìkì àtijọ́ jù lọ, títí kan Pápírúsì 74 ti ọ̀rúndún kẹta àti àwọn àfọwọ́kọ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin; kò sì sí nínú àwọn ìtumọ̀ èdè Coptic ìjímìjí. Ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ ti ìbílẹ̀ Byzantine, nínú ìbílẹ̀ Latin, àti nínú àwọn àfọwọ́kọ Gíríìkì tí ó dé lẹ́yìn náà. Ó dà bí àfikún olootu ìjímìjí tí ó ń sọ nípa bí olórí ọmọ ogun Róòmù ṣe dá sí ọ̀ràn náà kí wọ́n tó dé iwájú Fẹ́líkì.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: dé
  rationale: Aorist participle náà ń sọ pé Lísíà dé sí ibi ìṣẹ̀lẹ̀ náà; lílo ọ̀rọ̀-ìṣe aláṣẹ pẹ̀lú “ó sì” mú ìtàn náà ṣàn lọ́nà àdánidá ní Yorùbá.
- source_word: χιλίαρχος
  choice: olórí ọmọ ogun
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí olórí ẹgbẹ́ ọmọ ogun ńlá, ìyẹn ipò tribune ní Róòmù. “Olórí ọmọ ogun” ṣe kedere fún òǹkàwé òde òní láìfi orúkọ ipò àjèjì kún un.
- source_word: μετὰ πολλῆς βίας
  choice: fi ipá púpọ̀
  rationale: Èyí fi lílo agbára ara tàbí ìfipámúni hàn, ṣùgbọ́n kò fi dandan dá a lẹ́bi gẹ́gẹ́ bí ìwà ipá búburú.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: gbà á kúrò lọ́wọ́ wa
  rationale: Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán Gíríìkì “kúrò ní ọwọ́ wa” mọ́, pẹ̀lú ìtumọ̀ pé Lísíà mú un kúrò ní àkóso wọn.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Gbà á kúrò lọ́wọ́ wa” pa àwòrán orísun mọ́, ó sì yẹ fún ọ̀rọ̀ àwọn olùfisùn tí ń ṣàlàyé bí wọ́n ṣe pàdánù àkóso Pọ́ọ̀lù.
