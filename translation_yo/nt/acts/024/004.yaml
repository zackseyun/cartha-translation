source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: yo
  text: Ṣùgbọ́n, kí n má bàa dá ọ dúró ju èyí lọ[a], mo bẹ̀ ọ pé kí o fi inú rere rẹ[b] tẹ́tí sí wa ní ṣókí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí n má bàa dá ọ dúró mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ìwà pẹ̀lẹ́ rẹ” tàbí “gẹ́gẹ́ bí àánú rẹ.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwà títọ́ tí kì í le koko, ìwà pẹ̀lẹ́, tàbí àánú nínú ìdájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Ṣùgbọ́n kí n má bàa
  rationale: “Ṣùgbọ́n” ń mú ìyípadà kékeré tí δέ ní wá, “kí n má bàa” sì pa ìtumọ̀ ète tí ἵνα μὴ ní mọ́ ní Yorùbá àdánidá.
- source_word: ἐπὶ πλεῖόν
  choice: sí i
  rationale: Nínú gbólóhùn yìí, “sí i” túmọ̀ sí pé kí ohun náà má lọ síwájú tàbí má pẹ́ jù, ó sì bá àyíká ìgbọ́jọ́ mu.
- source_word: σε ἐγκόπτω
  choice: dá ọ dúró
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dídènà, dídúró ẹnì kan, tàbí fífi àkókò rẹ̀ jẹ. “Dá ọ dúró” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tí ó sì yẹ fún ọ̀rọ̀ ìbọ̀wọ̀ sí aláṣẹ.
- source_word: παρακαλῶ
  choice: mo bẹ̀ ọ
  rationale: Ó fi ẹ̀bẹ̀ ọlọ́wọ̀ àti ìbọ̀wọ̀ tí ọ̀rọ̀ inú ilé ẹjọ́ yìí ní hàn ju “mo béèrè lọ́wọ́ rẹ” lọ.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: kí o ... tẹ́tí sí wa
  rationale: “Tẹ́tí sí wa” jẹ́ Yorùbá àdánidá fún gbígbọ́ ọ̀rọ̀ ẹgbẹ́ kan ní ìgbọ́jọ́, láìfi àlàyé tí kò sí nínú Giriki kún un.
- source_word: συντόμως
  choice: ní ṣókí
  rationale: Ó tọ́ka sí kíkúrú ọ̀rọ̀ tàbí àkókò; “ní ṣókí” pa ìtumọ̀ náà mọ́ lọ́nà tó rọrùn.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: fi inú rere rẹ
  rationale: ἐπιείκεια lè jẹ́ ìwà pẹ̀lẹ́, òdodo tí kò le koko, tàbí àánú nígbà ìdájọ́. “Fi inú rere rẹ” jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tó ṣe àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀rọ̀ ilé ẹjọ́ tó ní ìbọ̀wọ̀, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ àtijọ́ tàbí ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
