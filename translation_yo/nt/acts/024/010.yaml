translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó sì bá ọ̀rọ̀ ilé ẹjọ́ mu. A lo “baálẹ̀” fún alákòóso agbègbè, “onídàájọ́” fún iṣẹ́ ìdájọ́, a sì pa àìdánilójú εὐθύμως mọ́ nínú àlàyé ìsàlẹ̀.
