id: ACT.24.10
reference: Acts 24:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: yo
  text: Nígbà náà, Paulu dáhùn, lẹ́yìn tí gómìnà náà ti fi orí ṣàmì sí i láti sọ̀rọ̀ pé, “Níwọ̀n bí mo ti mọ̀ pé o ti jẹ́ onídàájọ́ lórí orílẹ̀-èdè yìí fún ọ̀pọ̀ ọdún, mo fi inú dídùn gbèjà ara mi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo fi ìgboyà gbèjà ara mi.” Ọ̀rọ̀ náà lè tọ́ka sí ìmúratán, ìgboyà, tàbí inú dídùn, kì í ṣe ìmọ̀lára ayọ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Nígbà náà ni Paulu dáhùn
  rationale: “Dáhùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífèsì; “nígbà náà” ń so ìtàn náà tẹ̀ síwájú láìfi agbára àsopọ̀ τε kún un jù.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: lẹ́yìn tí baálẹ̀ náà ti kọ́rí sí i pé kó sọ̀rọ̀
  rationale: Gbólóhùn àkókò yìí fi ìṣe ara tí νεύω ń tọ́ka sí hàn; “kọ́rí sí i” túmọ̀ sí fífi orí ṣe àmì láti fún un láṣẹ láti sọ̀rọ̀.
- source_word: ἡγεμόνος
  choice: baálẹ̀
  rationale: Nínú àyíká Ìṣe àwọn Aposteli, ọ̀rọ̀ náà tọ́ka sí alákòóso agbègbè Róòmù; “baálẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún alákòóso bẹ́ẹ̀ láìsọ oyè Róòmù pàtó tí Gíríìkì kò sọ.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: láti ọ̀pọ̀ ọdún wá
  rationale: Èyí ń fi iye àkókò tí ó bẹ̀rẹ̀ sẹ́yìn tí ó sì ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: ὄντα σε κριτὴν
  choice: ìwọ ti jẹ́ onídàájọ́
  rationale: “Ti jẹ́” mú ipò tí ó ti wà fún ọ̀pọ̀ ọdún tí ó sì ṣì ṣe pàtàkì ní àkókò ọ̀rọ̀ náà hàn.
- source_word: κριτὴν
  choice: onídàájọ́
  rationale: Èyí pa ìtumọ̀ òfin κριτής mọ́, ó sì bá àyíká ilé ẹjọ́ mu.
- source_word: τῷ ἔθνει τούτῳ
  choice: fún orílẹ̀-èdè yìí
  rationale: “Orílẹ̀-èdè” pa ìtumọ̀ ìṣèlú àti ti àwọn ènìyàn inú ἔθνος mọ́; “fún” bá ìbáṣepọ̀ iṣẹ́ onídàájọ́ mu láìfi ìtumọ̀ ìṣàkóso tí kò ṣe kedere kún un.
- source_word: ἐπιστάμενος
  choice: Nítorí mo mọ̀ pé
  rationale: Ìtumọ̀ yìí mú kí ìdí tí Paulu fi múra láti gbèjà ara rẹ̀ ṣe kedere ní Yorùbá, bí participle Gíríìkì ṣe ń ṣiṣẹ́.
- source_word: εὐθύμως
  choice: inú mi dùn láti
  rationale: Èyí fi ìmúratán àti inú rere hàn. Nítorí ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ìgboyà tàbí ìfọkànbalẹ̀, àṣàyàn náà wà nínú àlàyé ìsàlẹ̀.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: ara mi
  rationale: Nínú àkójọpọ̀ “sọ̀rọ̀ láti gbèjà ara mi,” èyí sọ àwọn ọ̀ràn nípa Paulu ní Yorùbá tí ó rọrùn, láìsọ àkóónú rẹ̀ di ohun mìíràn.
- source_word: ἀπολογοῦμαι
  choice: sọ̀rọ̀ láti gbèjà ara mi
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ òfin náà mọ́, ó sì jẹ́ Yorùbá àdánidá ju gbólóhùn tí a tú ní tààràtà lọ.
