source:
  edition: SBLGNT
  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: yo
  text: Fẹ́líkì, ọlọ́lá jù lọ, ní gbogbo ọ̀nà àti ní gbogbo ibi, a ń jẹ́wọ́ èyí pẹ̀lú gbogbo ọpẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘a gbà á’ tàbí ‘a tẹ́wọ́ gbà á.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbígba tàbí títẹ́wọ́ gbà; ṣùgbọ́n níhìn-ín, ó ṣeé ṣe kó ń tọ́ka sí jíjẹ́wọ́ ní gbangba ohun rere tí a ń sọ pé Fẹ́líkì ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: ní gbogbo ọ̀nà
  rationale: Ó túmọ̀ sí ‘ní gbogbo ọ̀nà’ tàbí ‘ní gbogbo apá’; ó bá πανταχοῦ ṣiṣẹ́ pọ̀ láti fi hàn pé ìtẹ́wọ́gbà náà gbòòrò ní ọ̀nà àti ní ibi.
- source_word: τε καὶ
  choice: àti
  rationale: Ọ̀rọ̀ àsopọ̀ yìí so πάντῃ àti πανταχοῦ pọ̀; ‘àti’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti mú ìbáṣepọ̀ náà jáde.
- source_word: πανταχοῦ
  choice: níbi gbogbo
  rationale: Ó jẹ́ ọ̀rọ̀ tó ń tọ́ka sí ibi, ó sì túmọ̀ sí ‘ní gbogbo ibi’ tàbí ‘níbi gbogbo.’
- source_word: ἀποδεχόμεθα
  choice: a gbà èyí
  rationale: ‘Gbà’ pa ìtumọ̀ ìpilẹ̀ ti títẹ́wọ́ gba tàbí gbígba mọ́, ó sì tún lè bá ọ̀rọ̀ ìyìn Tẹ́túlù mu níbi tó ti ń fi hàn pé àwọn mọ àwọn àǹfààní tí ó ka sí ti Fẹ́líkì sí.
- source_word: κράτιστε
  choice: ọlọ́lá jù lọ
  rationale: Orúkọ oyè ọ̀wọ̀ ni fún aláṣẹ gíga; ‘ọlọ́lá jù lọ’ pa ìwọ̀n àfiwé tó ga jù àti ọ̀wọ̀ ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀sìn kún un.
- source_word: Φῆλιξ
  choice: Fẹ́líkì
  rationale: A kọ orúkọ ẹni náà ní ọ̀nà tó bá ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá mu.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: pẹ̀lú gbogbo ọpẹ́
  rationale: Gbólóhùn náà ń sọ ìwà ọkàn tó bá ìtẹ́wọ́gbà náà rìn; ‘pẹ̀lú gbogbo ọpẹ́’ pa agbára πάσης mọ́ ní èdè Yorùbá tó ṣe déédéé.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àṣàtọ́wọ́dọ́wọ́, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A gbé orúkọ ẹni tí a ń bá sọ sí iwájú gẹ́gẹ́ bí ìṣe Yorùbá tó wọ́pọ̀, a sì pa àtúnsọ ‘ní gbogbo ọ̀nà àti níbi gbogbo’ mọ́ láti ṣàfihàn ìtẹnumọ́ Gíríìkì.
