  source_fidelity: 'Ìtumọ̀ náà gba èrò gbolohun Gíríìkì náà lápapọ̀: ìwọ̀n tí ó kún fún ‘ní gbogbo ọ̀nà’ àti ‘ní gbogbo ibi,’ oyè ọlá fún Fẹ́líkì, àti ìdúpẹ́. Ṣùgbọ́n ‘a gbà èyí’ kì í ṣàfihàn dáadáa ìtumọ̀ ἀποδεχόμεθα nínú ọ̀rọ̀ ìyìn ìgbẹ́jọ́ yìí; ‘a jẹ́wọ́ èyí’ sún mọ́ ìtumọ̀ ‘a acknowledge this’ ju. ‘Ní gbogbo ibi’ sì jẹ́ ọ̀nà Yorùbá tó hàn gedegbe ju ‘níbi gbogbo’ lọ.'
  naturalness: Ìṣètò gbolohun àkọ́kọ́ lè yọrí sí ìdàrúdàpọ̀ díẹ̀, pàápàá nínú ‘a fi gbogbo ọpẹ́ gbà èyí.’ Gbólóhùn tí a tún ṣe, ‘a ń jẹ́wọ́ èyí pẹ̀lú gbogbo ọpẹ́,’ jẹ́ ìsọ̀rọ̀ Yorùbá òde òní tó rọrùn, tó sì bá ìforúkọsílẹ̀ ọlọ́lá ọ̀rọ̀ ìgbẹ́jọ́ mu.
  terminology: ‘Fẹ́líkì, ọlọ́lá jù lọ’ pa oyè κράτιστε mọ́ ní ohùn ọ̀wọ̀. ‘Pẹ̀lú gbogbo ọpẹ́’ yẹ fún μετὰ πάσης εὐχαριστίας. A tún ṣe àlàyé àlàyé ìsàlẹ̀ kí àwọn yíyàn ìtumọ̀ fún ἀποδεχόμεθα lè jẹ́ Yorùbá tó dára.
