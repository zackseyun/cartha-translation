    rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘gbà/tẹ́wọ́ gbà,’ ṣùgbọ́n nínú ọ̀rọ̀ Tẹ́túlù sí Fẹ́líkì, ó ń fi hàn pé wọ́n ń jẹ́wọ́ ohun tí a sọ nípa rẹ̀ pẹ̀lú ìdúpẹ́. ‘A ń jẹ́wọ́ èyí’ pa ìtumọ̀ náà mọ́ dáadáa.
