  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: yo
  text: Mo ní ìrètí nínú Ọlọ́run—èyí tí àwọn ọkùnrin wọ̀nyí fúnra wọn pẹ̀lú ń retí—pé àjíǹde yóò wà fún àwọn olódodo àti àwọn aláìṣòdodo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí àwọn fúnra wọn pẹ̀lú tẹ́wọ́ gbà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “retí” tàbí “tẹ́wọ́ gbà”; níbí, ó lè tẹnumọ́ ìrètí tí wọ́n jọ ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: Mo ní ìrètí nínú Ọlọ́run
  rationale: Ó pa àwòrán ọ̀rọ̀-orúkọ ἐλπίς àti ohun tí ìrètí náà dojú kọ mọ́; ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìgbẹ́kẹ̀lé àti ìrètí tí a gbé lé Ọlọ́run.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: èyí tí àwọn ọkùnrin wọ̀nyí fúnra wọn pẹ̀lú ń retí
  rationale: “Èyí” tọ́ka padà sí ìrètí; “àwọn ọkùnrin wọ̀nyí fúnra wọn pẹ̀lú” pa ìtẹnumọ́ καὶ αὐτοὶ οὗτοι mọ́. “Ń retí” fi ìtumọ̀ ìfojúsọ́nà ti προσδέχομαι hàn ní ti ẹ̀dá, láìfi dandan sọ pé wọ́n “gba ẹ̀kọ́ náà gbọ́.”
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: pé àjíǹde ... yóò wà
  rationale: “Àjíǹde” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún jíjí dìde kúrò nínú òkú; “yóò wà” mú ìtọ́kasí ọjọ́ iwájú ti μέλλειν ἔσεσθαι jáde láìfi ìtumọ̀ pé ó máa ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ kún un.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: àwọn olódodo àti àwọn aláìṣòdodo
  rationale: Ó pa ìyàtọ̀ ìwà tó wà nínú Gíríìkì mọ́, ó sì fi hàn pé àjíǹde náà kan ẹgbẹ́ méjèèjì.
theological_decisions:
- issue: Ààlà àti irú àjíǹde tí Pọ́ọ̀lù sọ
  choice: àjíǹde àwọn olódodo àti àwọn aláìṣòdodo
  alternative: àjíǹde gbogbo ènìyàn láìtẹnumọ́ ìyàtọ̀ ìwà wọn
  rationale: Gíríìkì dárúkọ ẹgbẹ́ méjèèjì ní kedere. Ìtumọ̀ náà kò fi ètò ẹ̀kọ́ kan kún ọ̀rọ̀ nípa àkókò, ìpele, tàbí bí ìdájọ́ ṣe máa tẹ̀ lé e.
- issue: Ìtumọ̀ προσδέχονται
  choice: ń retí
  alternative: ń gbà á gbọ́ / tẹ́wọ́ gbà á
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífojúsọ́nà tàbí títẹ́wọ́ gba ohun kan. “Ń retí” pa agbára ìfojúsọ́nà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn sílẹ̀ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àmì ìdádúró gígùn ya gbólóhùn àfikún sọ́tọ̀ láti mú ìbáṣepọ̀ rẹ̀ pẹ̀lú “ìrètí” hàn.
