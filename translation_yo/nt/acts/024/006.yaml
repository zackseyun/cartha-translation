  edition: SBLGNT
  text: ὃς καὶ τὸ ἱερὸν ἐπείρασεν βεβηλῶσαι, ὃν καὶ ⸀ἐκρατήσαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: yo
  text: Ó tilẹ̀ gbìyànjú láti sọ tẹ́ńpìlì di aláìmọ́[a], àwa sì mú un,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní kíkà gígùn sí i níbí, títí kan pé wọ́n fẹ́ ṣe ìdájọ́ Pọ́ọ̀lù gẹ́gẹ́ bí òfin wọn, àti pé Lísíà, olórí ogun, dé, ó sì fi agbára ńlá mú un kúrò lọ́wọ́ wọn.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Pọ́ọ̀lù; “Ó” jẹ́ ọ̀nà àdánidá láti tẹ̀síwájú ẹ̀sùn náà ní Yorùbá.
- source_word: καὶ
  choice: tilẹ̀
  rationale: Nínú àyíká ẹ̀sùn yìí, καὶ ń fi ìtẹnumọ́ hàn; “tilẹ̀” mú ìtumọ̀ ‘àní’ tàbí ‘paapaa’ jáde ní èdè Yorùbá àdánidá.
- source_word: τὸ ἱερὸν
  choice: tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: ἐπείρασεν
  choice: gbìyànjú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti ṣe ìgbìyànjú tàbí láti dán ohun kan wò; “gbìyànjú” bá infinitive tó tẹ̀ lé e mu lọ́nà àdánidá.
- source_word: βεβηλῶσαι
  choice: láti ba … jẹ́
  rationale: Nínú àyíká tẹ́ńpìlì, ọ̀rọ̀ náà túmọ̀ sí láti sọ ohun mímọ́ di aláìmọ́ tàbí láti tẹ́ ẹ lọ́lá. “Ba … jẹ́” jẹ́ èdè tí òǹkàwé òde òní lè lóye, láìfi ìtumọ̀ ẹ̀sìn kan pàtó kún un.
- source_word: ὃν
  choice: un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà náà tún tọ́ka sí Pọ́ọ̀lù; “un” ni àpapọ̀ àdánidá pẹ̀lú “mú” ní Yorùbá.
- source_word: ἐκρατήσαμεν
  choice: àwa sì mú un
  rationale: κρατέω níbí ni láti dì mú tàbí gba ẹni kan; fífi “àwa” hàn ń pa ìtẹnumọ́ ẹni àkọ́kọ́ púpọ̀ mọ́, “mú” sì dá ìṣe gbígbá a mú dúró láìsọ ọ́ di ọ̀rọ̀ ìlànà ọlọ́pàá nìkan.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀ Aṣe 24:6 ní ìbámu pẹ̀lú àfikún gígùn nínú àwọn àfọwọ́kọ kan
  choice: Túmọ̀ gbólóhùn SBLGNT kúkúrú nìkan, tí ó parí sí “àwa sì mú un,”
  alternative: Àwọn àfọwọ́kọ kan fi kún un pé wọ́n fẹ́ ṣe ìdájọ́ Pọ́ọ̀lù gẹ́gẹ́ bí òfin wọn, ṣùgbọ́n Lísíà olórí ogun gba á kúrò lọ́wọ́ wọn.
  rationale: Akọ́ọ́lẹ̀ Gíríìkì tí a pèsè ni kíkà kúkúrú; a kò fi ohun tí kò sí nínú rẹ̀ kún ọ̀rọ̀ pàtàkì. A tọ́ka sí kíkà gígùn nínú àlàyé ìsàlẹ̀ nítorí pé ó wà nínú àwọn àfọwọ́kọ kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “tẹ́ńpìlì” fún ἱερόν, a sì pa àmì kọ́má ìparí mọ́ nítorí pé gbólóhùn ẹ̀sùn náà ń tẹ̀ síwájú nínú ẹsẹ tó tẹ̀ lé e.
