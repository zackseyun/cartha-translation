id: ACT.24.26
reference: Acts 24:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: yo
  text: Ní àkókò kan náà, ó ń retí pé Pọ́ọ̀lù yóò fún un ní owó[a]. Nítorí náà, ó tún máa ń ránṣẹ́ pè é wá ní ọ̀pọ̀ ìgbà sí i, ó sì máa ń bá a sọ̀rọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn, “ó ń retí àbẹ̀tẹ́lẹ̀ lọ́wọ́ Pọ́ọ̀lù.” Ọ̀rọ̀ Gíríìkì náà sọ pé “owó” lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Lákòókò kan náà
  rationale: Ó fi hàn pé ìrètí yìí ń lọ ní àkókò kan náà pẹ̀lú ohun tí ìtàn ṣáájú ń sọ; gbólóhùn náà sì jẹ́ Yorùbá àdánidá.
- source_word: ἐλπίζων
  choice: ó ń retí
  rationale: Ọ̀rọ̀ aláìparí yìí tọ́ka sí ìrètí tí Fẹlikisi ń bá a lọ níní; àmì ‘ń’ mú ìṣe tí ń tẹ̀ síwájú náà jáde.
- source_word: χρήματα
  choice: owó
  rationale: Ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ní tààràtà ni ‘owó.’ Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí àbẹ̀tẹ́lẹ̀, a kò fi ìtumọ̀ tó ṣe pàtó ju ọ̀rọ̀ orísun lọ sínú ẹsẹ náà.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Pọ́ọ̀lù yóò fún òun ní owó
  rationale: Yíyí ìṣe àìṣeṣe Gíríìkì padà sí ìṣe olùṣe jẹ́ Yorùbá àdánidá, ó sì pa Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí ẹni tí Fẹlikisi ń retí owó lọ́wọ́ rẹ̀.
- source_word: διὸ καὶ
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìdí àti àbájáde mọ́ láàárín ìrètí owó náà àti bí ó ṣe ń pe Pọ́ọ̀lù léraléra.
- source_word: πυκνότερον
  choice: ní ìgbà púpọ̀ sí i
  rationale: Ó fi ìfiwéra ìwọ̀n ìgbà hàn kedere, ìyẹn ‘more often,’ ní Yorùbá tó rọrùn.
- source_word: μεταπεμπόμενος
  choice: ó máa ń ránṣẹ́ pe e
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ríranṣẹ́ pe ẹnì kan tàbí pípè é wá; àṣàyàn yìí bá ipò Pọ́ọ̀lù gẹ́gẹ́ bí ẹlẹ́wọ̀n mu.
- source_word: ὡμίλει αὐτῷ
  choice: ó sì máa ń bá a sọ̀rọ̀
  rationale: Ó tọ́ka sí ìjíròrò tàbí ọ̀rọ̀ ẹni sí ẹni tí ó ń ṣẹlẹ̀ léraléra, kì í ṣe àsọyé ní gbangba.
theological_decisions:
- issue: Bóyá kí a sọ ète ìbàjẹ́ Fẹlikisi ní pàtó gẹ́gẹ́ bí ‘àbẹ̀tẹ́lẹ̀’ nínú ẹsẹ náà
  choice: Lo ‘owó’ nínú ẹsẹ náà, kí àyíká ọ̀rọ̀ fi ète àbẹ̀tẹ́lẹ̀ hàn; ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
  alternative: ó ń retí pé Pọ́ọ̀lù yóò fún òun ní àbẹ̀tẹ́lẹ̀
  rationale: Àyíká ọ̀rọ̀ fi ìwà ìbàjẹ́ hàn gidigidi, ṣùgbọ́n χρήματα túmọ̀ sí ‘owó’ lásán, kì í ṣe ọ̀rọ̀ pàtó fún ‘àbẹ̀tẹ́lẹ̀.’ Èyí pa ìdààmú àti àìṣe-pàtó inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. Àwọn ìṣe ‘ó máa ń …’ fi hàn pé Fẹlikisi ń pe Pọ́ọ̀lù, ó sì ń bá a sọ̀rọ̀ léraléra. A lo ‘òun’ fún Fẹlikisi nínú gbólóhùn àkọ́kọ́ láti dín àìmọ̀ ẹni tí arọ́pò-orúkọ ń tọ́ka sí kù.
