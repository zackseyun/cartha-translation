  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Júù kan láti Éṣíà[a] wà, àwọn tí ó yẹ kí wọ́n ti wà níwájú rẹ kí wọ́n sì fi ẹ̀sùn kàn mí[b], bí wọ́n bá ní ohunkóhun lòdì sí mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éṣíà” níbí ń tọ́ka sí ẹkùn ìjọba Róòmù kan ní Éṣíà Kékeré, kì í ṣe ilẹ̀ ayé Éṣíà ti òde òní.
    reason: cultural_note
  - marker: b
    text: Tàbí “fẹ̀sùn kàn mí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: àwọn ... kan
  rationale: Ó tọ́ka sí iye kan tí a kò sọ pàtó; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ọ̀rọ̀ tí ó ṣáájú hàn.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: láti Éṣíà
  rationale: Ó pa orúkọ ibi inú orísun mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ẹkùn ìjọba Róòmù ni.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún àwọn ènìyàn Júù.
- source_word: ἔδει
  choice: ó yẹ kí wọ́n ti
  rationale: Ó mú ìgbọ́dọ̀ṣe tí kò ṣẹ ní àkókò tí ó yẹ jáde, gẹ́gẹ́ bí imperfect Gíríìkì ṣe ń tọ́ka sí.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: wà níwájú rẹ
  rationale: Nínú ọ̀rọ̀ ẹjọ́, ó túmọ̀ sí wíwà níwájú aláṣẹ tó ń gbọ́ ẹjọ́.
- source_word: κατηγορεῖν
  choice: fi ẹ̀sùn kan mí
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá fún fífi ẹ̀sùn kan ẹni nínú ọ̀rọ̀ ẹjọ́.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: bí wọ́n bá ní ohunkóhun lòdì sí mi
  rationale: Ó pa ìtumọ̀ náà mọ́ ní fífẹ̀, láì sọ ọ́ di ẹ̀sùn pàtó ju bí orísun ṣe sọ lọ; ‘bá’ tún fi ipò àní-àní hàn.
