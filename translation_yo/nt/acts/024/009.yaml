  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: yo
  text: Àwọn Júù náà sì darapọ̀ mọ́ ìfẹ̀sùn náà,[a] wọ́n ń sọ pé bẹ́ẹ̀ ni àwọn nǹkan wọ̀nyí rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn Júù náà sì darapọ̀ mọ́ wọn, wọ́n ń sọ pé bẹ́ẹ̀ ni àwọn nǹkan wọ̀nyí rí.”
    reason: Ìtumọ̀ mìíràn fún συνεπέθεντο; ó lè túmọ̀ sí dídarapọ̀ mọ́ àwọn olùfẹ̀sùn mìíràn.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: bá wọn kópa nínú ẹ̀sùn náà
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí dídarapọ̀ mọ́ ìkọlù tàbí ẹ̀sùn ẹlòmíràn. Nínú àyíká ilé-ẹjọ́ yìí, gbólóhùn yìí fi hàn pé àwọn Júù fọwọ́ sí ẹ̀sùn Tẹ́túlù, láì sọ ọ́ di ìkọlù ti ara.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” bá ìlò Yorùbá mu.
- source_word: καὶ
  choice: náà
  rationale: Ó fi àwọn Júù kún àwọn tó ti ń gbé ẹ̀sùn náà kalẹ̀.
- source_word: οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn Júù tí ó wà níbi ìgbọ́jọ́ náà; ìtumọ̀ yìí ṣe kedere, kò sì fi ìtumọ̀ àgbègbè kún un.
- source_word: φάσκοντες
  choice: wọ́n ń tẹnumọ́
  rationale: Ó sọ bí wọ́n ṣe fi ìdánilójú ṣètìlẹ́yìn fún ohun tí a fẹ̀sùn rẹ̀, ó sì bá àyíká ilé-ẹjọ́ mu.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtọ́kasí gbooro ti Gíríìkì mọ́ sí gbogbo ohun tí a ṣẹ̀ṣẹ̀ fẹ̀sùn rẹ̀, dípò yíyí i padà sí “àwọn ẹ̀sùn wọ̀nyí” nìkan.
- source_word: οὕτως ἔχειν
  choice: bẹ́ẹ̀ ni ... rí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbolohun Gíríìkì tó túmọ̀ sí pé ohun kan rí gẹ́gẹ́ bí a ti sọ ọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo èdè ilé-ẹjọ́ “ẹ̀sùn” láti mú àyíká náà hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gbooro ti συνεπέθεντο mọ́.
