  source_fidelity: 'Ìtumọ̀ náà gba ìṣọ̀kan ‘Tàbí,’ ìtẹnumọ́ ‘àwọn ọkùnrin wọ̀nyí fúnra wọn,’ ìpè ẹni-kẹta ‘kí ... sọ,’ àti àkókò ‘nígbà tí mo dúró’ dáadáa. Ṣùgbọ́n ‘àìṣòdodo ... rí lọ́wọ́ mi’ kò péye fún ἀδίκημα: àìṣòdodo lè túmọ̀ sí ìwà ìwà-búburú tàbí ìwà àìdájọ́, ‘rí lọ́wọ́ mi’ sì lè yọrí sí ìtumọ̀ pé a rí ohun kan ní ọwọ́ ẹni. ‘Ohun àìtọ́ tí wọ́n rí lára mi’ dá ìbéèrè Pọ́ọ̀lù nípa ẹ̀ṣẹ̀/ìwà-búburú tí a rí nínú rẹ̀ mú ní kedere.'
