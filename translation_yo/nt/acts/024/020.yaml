lexical_decisions:
- source_word: ἢ
  choice: Tàbí
  rationale: Ó ń mú àṣàyàn mìíràn wọ inú àríyànjiyàn Pọ́ọ̀lù, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: αὐτοὶ οὗτοι
  choice: àwọn ọkùnrin wọ̀nyí fúnra wọn
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ àti ìtọ́kasí àwọn ẹni tó wà níbẹ̀ mọ́.
- source_word: εἰπάτωσαν
  choice: kí ... sọ
  rationale: Ìlànà ‘kí’ pẹ̀lú ọ̀rọ̀-ìṣe fi àṣẹ ẹni-kẹta hàn lọ́nà Yorùbá tó ṣe déédéé nínú ọ̀rọ̀ ẹjọ́.
- source_word: τί εὗρον
  choice: irú ... tí wọ́n rí
  rationale: Ó béèrè ohun pàtó tí wọ́n rí gẹ́gẹ́ bí ẹ̀sùn; ‘irú’ mú ìbéèrè náà ṣe kedere láìfi ìtumọ̀ tuntun kún un.
- source_word: ἀδίκημα
  choice: àìṣòdodo
  rationale: Ọ̀rọ̀ yìí gbòòrò tó láti túmọ̀ sí ìwà búburú tàbí ẹ̀ṣẹ̀ lábẹ́ òfin, láìdín ìtumọ̀ Gíríìkì kù sí ‘ìwà ọ̀daràn’ nìkan.
- source_word: στάντος μου
  choice: nígbà tí mo dúró
  rationale: Ó fi ìbáṣepọ̀ àkókò participle aorist náà hàn ní Yorùbá tó rọrùn.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: níwájú ìgbìmọ̀ náà
  rationale: Ó ṣàfihàn pé Pọ́ọ̀lù farahàn níwájú ẹgbẹ́ adájọ́ Júù; àlàyé ẹsẹ̀ ìsàlẹ̀ sọ irú ìgbìmọ̀ náà ní pàtó.
