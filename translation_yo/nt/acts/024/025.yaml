id: ACT.24.25
reference: Acts 24:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: yo
  text: Ṣùgbọ́n bí ó ti ń bá a sọ̀rọ̀ nípa òdodo, ìkóra-ẹni-níjàánu àti ìdájọ́ tí ń bọ̀, ẹ̀rù bà Fẹlikisi, ó sì dáhùn pé, “Lọ fún ìsinsìnyí; nígbà tí mo bá rí àǹfààní, èmi yóò pè ọ́ wá.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: bí ó ti ń bá a sọ̀rọ̀
  rationale: Ó fi ìjíròrò tàbí ṣíṣe àlàyé lójúkojú hàn, kì í ṣe ọ̀rọ̀ àsọyé lásán.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìwà títọ́ àti ohun tí ó bá ìfẹ́ Ọlọ́run mu.
- source_word: ἐγκρατείας
  choice: ìkóra-ẹni-níjàánu
  rationale: Ó túmọ̀ sí agbára láti ṣàkóso ìfẹ́ àti ìṣe ẹni.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: ìdájọ́ tí ń bọ̀
  rationale: Ó pa ìtumọ̀ ìdájọ́ ọjọ́ iwájú mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἔμφοβος γενόμενος
  choice: ẹ̀rù ba Fẹlikisi
  rationale: Ìtumọ̀ àdánidá ní Yorùbá fún pé ó di ẹni tí ẹ̀rù bà.
- source_word: Τὸ νῦν ἔχον πορεύου
  choice: Máa lọ ná
  rationale: Ọ̀nà Yorùbá àdánidá láti sọ pé kí ó lọ fún ìsinsìnyí.
- source_word: καιρὸν μεταλαβών
  choice: nígbà tí mo bá rí àǹfààní
  rationale: καιρός níbí ń tọ́ka sí àkókò tàbí àǹfààní tí ó yẹ.
- source_word: μετακαλέσομαί σε
  choice: èmi yóò ránṣẹ́ pè ọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípè ẹnì kan wá, ní pàtàkì nípa fífiṣẹ́ ránṣẹ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdáláre
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa koko ìwà àti ìdájọ́; “òdodo” pa ìtumọ̀ gbòòrò rẹ̀ mọ́, kò sì fi ẹ̀kọ́ ìdáláre pàtó lé e lórí.
- issue: Irú ìdájọ́ tí μέλλοντος ń tọ́ka sí
  choice: ìdájọ́ tí ń bọ̀
  alternative: ìdájọ́ ọjọ́ ìkẹyìn
  rationale: Orísun sọ “ìdájọ́ tí ń bọ̀” ní tààrà; a kò sọ ohun tí ó ju èyí lọ láti yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A lo “ìkóra-ẹni-níjàánu” láti jẹ́ kí èrò ἐγκράτεια yé òǹkàwé lasán, a sì kọ orúkọ Φῆλιξ sí “Fẹlikisi” ní ìbámu pẹ̀lú ìró Yorùbá.
