  text: δυναμένου σου ⸀ἐπιγνῶναι, ὅτι οὐ πλείους εἰσίν μοι ἡμέραι ⸀δώδεκα ἀφ’ ἧς ἀνέβην προσκυνήσων ⸀εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: yo
  text: gẹ́gẹ́ bí o ṣe lè rí i dájú, pé kò ju ọjọ́ méjìlá lọ láti ìgbà tí mo gòkè lọ sí Jerúsálẹ́m láti jọ́sìn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: gẹ́gẹ́ bí ìwọ fúnra rẹ ṣe lè wádìí rẹ̀ dájú
  rationale: Gbólóhùn yìí pa agbára Fẹliksi láti ṣàyẹ̀wò òtítọ́ ọ̀ràn mọ́, ó sì bá àyíká ìgbẹ́jọ́ mu láì sọ ọ́ di ìdí pàtó.
- source_word: ἐπιγνῶναι
  choice: wádìí rẹ̀ dájú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí mímọ ohun kan nípasẹ̀ ìwádìí tàbí ìjẹ́rìí, kì í ṣe mímọ lásán.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: kò ju ọjọ́ méjìlá lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò tí ó ti kọjá kò pọ̀ ju ọjọ́ méjìlá lọ, ó sì pa ìtumọ̀ Gíríìkì mọ́.
- source_word: ἀφ’ ἧς
  choice: láti ìgbà tí
  rationale: Ó fi ìbẹ̀rẹ̀ àkókò ọjọ́ méjìlá náà hàn ní kedere.
- source_word: ἀνέβην
  choice: mo ti gòkè lọ
  rationale: Ó pa ọ̀nà ìṣọ̀rọ̀ ìbílẹ̀ ti lílọ sókè sí Jerúsálẹ́m mọ́.
- source_word: προσκυνήσων
  choice: láti jọ́sìn
  rationale: Future participle náà fi ète ìrìnàjò Pọ́ọ̀lù hàn; a kò fi ẹni tí ó jọ́sìn sí kún un nítorí pé orísun kò sọ ọ́ ní tààrà.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́m
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífi ibi tí ó ń lọ hàn.
