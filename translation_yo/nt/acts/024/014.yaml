id: ACT.24.14
reference: Acts 24:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: yo
  text: Ṣùgbọ́n mo jẹ́wọ́ èyí fún ọ, pé ní ìbámu pẹ̀lú Ọ̀nà náà, èyí tí wọ́n ń pè ní ẹ̀ya ìsìn[a], bẹ́ẹ̀ ni mo ṣe ń sin Ọlọ́run àwọn baba wa[b], mo sì ń gba gbogbo ohun tí a kọ nínú Òfin àti nínú àwọn Wòlíì gbọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ẹgbẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹgbẹ́ tàbí ẹ̀ya kan; “ẹ̀kọ́ èké” yóò fi ìtumọ̀ tó dé lẹ́yìn náà kún ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “Ọlọ́run àjogúnbá”; ìtumọ̀ rẹ̀ ni Ọlọ́run tí àwọn baba Ísírẹ́lì ń sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: mo jẹ́wọ́
  rationale: Ó fi ìjẹ́wọ́ Pọ́ọ̀lù ní gbangba níwájú Fẹlikisi hàn, láìjẹ́ kí ó dà bí ẹni pé ó ń jẹ́wọ́ ẹ̀ṣẹ̀ tàbí ẹ̀bi.
- source_word: κατὰ τὴν ὁδόν
  choice: ní ìbámu pẹ̀lú Ọ̀nà náà
  rationale: ‘Ọ̀nà náà’ pa orúkọ tí a fi ń pe ẹgbẹ́ àwọn ọmọlẹ́yìn Jésù nínú Ìṣe mọ́; ‘ní ìbámu pẹ̀lú’ sì ṣàfihàn ìtẹ̀lé tàbí ìfaradà mọ́ ọ.
- source_word: αἵρεσιν
  choice: ẹ̀ya ìsìn
  rationale: Níbí, ọ̀rọ̀ náà túmọ̀ sí ẹgbẹ́ tàbí ẹ̀ya kan tí àwọn alatakò fi ń pè wọ́n, kì í ṣe dandan ‘ẹ̀kọ́ èké’ ní ìtumọ̀ ẹ̀sìn ti àkókò tó tẹ̀ lé e.
- source_word: οὕτως λατρεύω
  choice: bẹ́ẹ̀ ni mo ṣe ń sin
  rationale: ‘Bẹ́ẹ̀ ni’ so ọ̀nà ìjọsìn Pọ́ọ̀lù mọ́ Ọ̀nà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ‘ń sin’ jẹ́ ọ̀rọ̀ Yorùbá adayeba fún iṣẹ́ ìjọsìn tí a ń ṣe fún Ọlọ́run.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Ọlọ́run àwọn baba wa
  rationale: Ó mú ìtumọ̀ Ọlọ́run tí àwọn baba Ísírẹ́lì ń sìn jáde, ó sì pa ìtẹ̀síwájú Pọ́ọ̀lù pẹ̀lú ìgbàgbọ́ Ísírẹ́lì mọ́.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: mo sì ń gba gbogbo ohun tí a kọ ... gbọ́
  rationale: Ó sọ ìṣe alábápín náà di gbólóhùn Yorùbá adayeba, ó sì pa ìtumọ̀ pé Pọ́ọ̀lù gba gbogbo ohun tí ó wà ní àkọsílẹ̀ gbọ́ mọ́.
- source_word: κατὰ τὸν νόμον ... τοῖς ἐν τοῖς προφήταις
  choice: sínú Òfin àti sínú àwọn Wòlíì
  rationale: Ó tọ́ka sí àwọn ìpín Ìwé Mímọ́ Júù méjèèjì, ó sì ṣàfihàn ibi tí àwọn ohun náà ti wà ní àkọsílẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú ẹ̀sìn Júù àti Ọ̀nà náà
  choice: A mú Pọ́ọ̀lù hàn gẹ́gẹ́ bí ẹni tí ó ń sin Ọlọ́run Ísírẹ́lì ní ìbámu pẹ̀lú Ọ̀nà náà, tí ó sì gba Òfin àti àwọn Wòlíì gbọ́.
  alternative: Kí a túmọ̀ Ọ̀nà náà bí ẹ̀sìn mìíràn tí ó yà pátápátá sí ẹ̀sìn Júù.
  rationale: 'Gbólóhùn Gíríìkì fúnra rẹ̀ tẹnumọ́ ìtẹ̀síwájú: Ọ̀nà náà ni ọ̀nà tí Pọ́ọ̀lù fi ń sin Ọlọ́run àwọn baba, kò sì kọ Òfin tàbí àwọn Wòlíì sílẹ̀.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, adayeba, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ̀ya ìsìn’ láti yẹra fún fífi ìtumọ̀ imọ̀-ẹ̀sìn ti àkókò tó tẹ̀ lé e sínú αἵρεσις.
