source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ohun kan tó dà bí ìpẹ́ ṣubú kúrò ní ojú rẹ̀[a]; ó sì tún rí. Lẹ́yìn náà, ó dìde, a sì ṣe ìrìbọmi fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ìpẹ́ ṣubú kúrò ní ojú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lo ìfiwéra; ó ṣàpèjúwe ohun tí ó dà bí ìpẹ́, kò sì sọ pé ìpẹ́ gidi ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn ní èdè Yorùbá òde òní pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ láìjáfara.
- source_word: ἀπέπεσαν
  choice: já bọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí sọ ìṣubú àti yíyọ kúrò ní ibi kan lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: kúrò lójú rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun kan yọ kúrò ní ojú ẹni.
- source_word: ὡς λεπίδες
  choice: ohun kan bí àwọn ìpẹ́
  rationale: “Bí” pa ìfiwéra Gíríìkì mọ́, “ohun kan” sì mú kí ó ṣe kedere pé a ń ṣàpèjúwe ohun tó dà bí ìpẹ́, kì í ṣe pé ó jẹ́ ìpẹ́ gangan.
- source_word: ἀνέβλεψέν
  choice: ó sì tún ríran
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé agbára ìríran rẹ̀ padà, kì í ṣe pé ó kàn gbójú sókè.
- source_word: τε καὶ
  choice: ó sì ... lẹ́yìn náà
  rationale: Ó so àwọn ìṣe tó tẹ̀ lé ara wọn pọ̀ ní ọ̀nà tó bá ìtàn Yorùbá mu.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Ó sọ ìṣe tó tẹ̀ lé e ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: ἐβαπτίσθη
  choice: a sì ṣe ìrìbọmi fún un
  rationale: Ó pa ìṣe aláìlèsọ-orúkọ Gíríìkì mọ́, ó sì yẹra fún fífi ọ̀nà ìrìbọmi ẹ̀ya ìjọ kan pàtó sínú ẹsẹ náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ βαπτίζω láìṣe ojúsàájú ẹ̀kọ́ ẹ̀ya ìjọ kan
  choice: a sì ṣe ìrìbọmi fún un
  alternative: a sì rì í bọ inú omi
  rationale: Ẹsẹ náà ròyìn ìrìbọmi ṣùgbọ́n kò sọ ọ̀nà tí wọ́n gbà ṣe é ní pàtó; “ṣe ìrìbọmi fún un” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì yẹra fún pípa ọ̀nà kan láṣẹ.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò. A fi àmì ohùn síbi tó yẹ, a sì pa ìtẹ̀síwájú àwọn ìṣe inú ìtàn náà mọ́.
