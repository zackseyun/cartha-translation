  source_fidelity: 'Ìtumọ̀ náà ń fi àwọn apá pàtàkì Gíríìkì hàn dáadáa: ἐξουσίαν jẹ́ “àṣẹ,” παρὰ τῶν ἀρχιερέων jẹ́ ìpilẹ̀ àṣẹ láti ọ̀dọ̀ àwọn olórí àlùfáà, àti δῆσαι jẹ́ “láti dè.” Ṣùgbọ́n ipò “níbí” ní òpin gbólóhùn le jẹ́ kí ó dà bíi pé ó ń ṣàlàyé àwọn tí ń pe orúkọ Jésù, dípò ibi tí Sáùlù ti ní àṣẹ náà. Bákan náà, “ti gba” jẹ́ ìṣe tí ó ti parí, nígbà tí ἔχει jẹ́ ìṣe ìsinsìnyí, “ní.”'
