source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: yo
  text: Ó sì ní àṣẹ níbí, láti ọ̀dọ̀ àwọn olórí àlùfáà, láti dè gbogbo àwọn tí ń pe orúkọ rẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn tí ń ké pe orúkọ rẹ.” Gbólóhùn Gíríìkì náà jẹ́ ọ̀nà tí Bíbélì sábà máa ń gbà sọ nípa pípe tàbí kíké pe ẹnì kan; ní ọ̀pọ̀ ìgbà, ó wà nínú àdúrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: níbí
  rationale: Ọ̀rọ̀-ìṣe àpèjúwe ibi yìí túmọ̀ sí ‘níbí’; nínú àyíká ọ̀rọ̀ náà, ó ń tọ́ka sí Damásíkù.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ fi hàn pé agbára òfin tàbí ìfúniláṣẹ tí a yàn fún un ni, kì í ṣe agbára ara lásán.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: lọ́wọ́ àwọn olórí àlùfáà
  rationale: παρά pẹ̀lú ẹ̀yà genitive ń fi orísun hàn; ‘lọ́wọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ẹni tí àṣẹ ti ọ̀dọ̀ rẹ̀ wá.
- source_word: δῆσαι
  choice: láti dè
  rationale: ‘Dè’ pa àwòrán gidi inú ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé mímú ẹni ni ìtumọ̀ rẹ̀ nínú àyíká yìí.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: gbogbo àwọn tí ń ké pe
  rationale: Àpólà náà ń tọ́ka sí gbogbo àwọn ẹni tí wọ́n ń ké pe ẹnì kan tàbí ń pè é fún ìrànlọ́wọ́; ìtumọ̀ yìí pa àṣà ọ̀rọ̀ Bíbélì mọ́.
- source_word: τὸ ὄνομά σου
  choice: orúkọ rẹ
  rationale: Ìtumọ̀ tààrà yìí pa ìfọkànsìn ọ̀rọ̀ Gíríìkì mọ́; nínú Bíbélì, orúkọ lè dúró fún ẹni náà àti àṣẹ rẹ̀.
theological_decisions:
- issue: Agbára ìtumọ̀ gbólóhùn ‘ké pe orúkọ rẹ’ tí a sọ sí Jésù
  choice: ké pe orúkọ rẹ
  alternative: gbàdúrà sí ọ; ké pe àṣẹ rẹ
  rationale: Ọ̀rọ̀ Bíbélì yìí sábà máa ń tọ́ka sí pípè ẹni nínú àdúrà àti fífi ara mọ́ ọn. Níwọ̀n bí Ananíà ti ń bá Jésù sọ̀rọ̀ tààrà, gbólóhùn náà ní ìwọ̀n ìfọkànsìn sí Jésù, ṣùgbọ́n a kò tú u sí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ ní kedere.
translation_notes:
  register: Yorùbá àṣàdéédé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ gbólóhùn náà jẹ́ àdánidá, ọ̀rọ̀ sì ní ọlá; ‘olórí àlùfáà’ yàtọ̀ sí ‘Àlùfáà Àgbà’ tó lè túmọ̀ sí ẹni kan ṣoṣo.
