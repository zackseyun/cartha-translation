id: ACT.9.32
reference: Acts 9:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: yo
  text: Bí Peteru ti ń rìn káàkiri gbogbo ibi, ó tún sọ̀kalẹ̀ lọ sí ọ̀dọ̀ àwọn ènìyàn mímọ́ tí ń gbé ní Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: ń la gbogbo agbègbè náà kọjá
  rationale: Ọ̀rọ̀ náà ní ti gírámà lè túmọ̀ sí pé Peteru ń kọjá láàárín ‘gbogbo wọn,’ ṣùgbọ́n nínú àyíká ìtàn yìí, ó ṣeé ṣe jù pé ó ń rìn ká gbogbo àwọn agbègbè tàbí àwọn ìjọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. ‘Gbogbo agbègbè náà’ jẹ́ èdè Yorùbá àdánidá tí kò fi èrò tí kò sí nínú orísun kún un lọ́pọ̀.
- source_word: κατελθεῖν καὶ πρὸς
  choice: ó tún sọ̀kalẹ̀ lọ sọ́dọ̀
  rationale: ‘Sọ̀kalẹ̀’ pa ìtumọ̀ ìrìn-àjò κατελθεῖν mọ́, ‘tún’ sì fi ipa καί hàn pé Lida tún wà lára ibi tí Peteru dé.
- source_word: τοὺς ἁγίους
  choice: àwọn ènìyàn mímọ́
  rationale: Èyí jẹ́ ìtumọ̀ taara fún orúkọ àpapọ̀ náà, ó sì tọ́ka sí àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sí mímọ́ fún Ọlọ́run, láìfi orúkọ ẹ̀ka ìjọ kan lé e lórí.
- source_word: Λύδδα
  choice: Lida
  rationale: A ṣe àkọsílẹ̀ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró rẹ̀, ní ọ̀nà tí ó rọrùn fún òǹkàwé Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ ‘àwọn ènìyàn mímọ́’
  choice: A fi gbolohun náà sílẹ̀ gẹ́gẹ́ bí ọ̀nà tí Luku fi ń pe àwọn onígbàgbọ́.
  alternative: ‘Àwọn Kristẹni’ tàbí ‘àwọn ọmọ ìjọ’
  rationale: Orísun sọ ‘àwọn mímọ́’; fífi ‘Kristẹni’ tàbí ‘ọmọ ìjọ’ rọ́pò rẹ̀ yóò sọ ìtumọ̀ náà di pàtó ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní gbogbo ibi tí ó yẹ, a sì yàgò fún fífi ọ̀rọ̀ ìbẹ̀rẹ̀ bí ‘Ǹjẹ́’ tàbí ‘Nígbà náà’ kún δέ, nítorí pé níbí ó ṣiṣẹ́ gẹ́gẹ́ bí àmì ìtẹ̀síwájú ìtàn.
