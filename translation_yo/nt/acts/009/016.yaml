source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: yo
  text: Nítorí èmi yóò fi hàn án bí ìjìyà tí ó gbọdọ̀ jìyà nítorí orúkọ mi ṣe pọ̀ tó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ti orúkọ mi,” tàbí “fún orúkọ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: èmi
  rationale: A pa ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ mọ́ láti fi ìtẹnumọ́ Gíríìkì hàn, bí ó tilẹ̀ jẹ́ pé àmì ẹni ti wà nínú ‘yóò.’
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí rẹ̀.
- source_word: ὑποδείξω αὐτῷ
  choice: yóò fi hàn án
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ‘èmi yóò fi hàn án,’ tí ó sì pa ohun tí ọ̀rọ̀ Gíríìkì sọ mọ́.
- source_word: ὅσα
  choice: bí ó ti pọ̀ tó
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń tọ́ka sí ìwọ̀n tàbí bí ìjìyà náà yóò ti pọ̀ tó, kì í ṣe àtòjọ ohun kọ̀ọ̀kan.
- source_word: δεῖ
  choice: ó gbọdọ̀
  rationale: Ó sọ pé ohun náà pọndandan, láìṣe àfikún pé irú dandan wo ni—ìpinnu Ọlọ́run, àyànmọ́, tàbí ohun mìíràn.
- source_word: ὑπὲρ τοῦ ὀνόματός μου
  choice: nítorí orúkọ mi
  rationale: ‘Nítorí’ lè sọ ìdí tàbí ohun tí a ṣe fún, nígbà tí ‘orúkọ mi’ pa ìtumọ̀ ọlọ́rọ̀ nípa ẹni, àṣẹ, àti ìjẹ́wọ́ Jesu mọ́.
- source_word: παθεῖν
  choice: jìyà
  rationale: ‘Jìyà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kedere fún lílo πάσχω níhìn-ín.
theological_decisions:
- issue: Irú dandan tí δεῖ ń sọ
  choice: ó gbọdọ̀
  alternative: a ti yàn án láti / àyànmọ́ rẹ̀ ni láti
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ìjìyà náà pọndandan, ṣùgbọ́n kò sọ ní pàtó nínú ẹsẹ yìí bóyá ó jẹ́ àṣẹ ìpèsè Ọlọ́run, àyànmọ́, tàbí irú dandan mìíràn. ‘Ó gbọdọ̀’ pa ìṣòro ìtumọ̀ náà mọ́ láìfi ẹ̀kọ́ kan kún un.
- issue: Ìtumọ̀ ὑπὲρ pẹ̀lú ‘orúkọ mi’
  choice: nítorí orúkọ mi
  alternative: nítorí ti orúkọ mi / ní ipò orúkọ mi
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìjìyà nítorí ìbáṣepọ̀ pẹ̀lú Jesu tàbí fún ti orúkọ rẹ̀. A lo gbólóhùn tó gbòòrò ní àkọ́kọ́, a sì pa àwọn ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘èmi’ fún ìtẹnumọ́, ‘bí ó ti pọ̀ tó’ fún ìwọ̀n ὅσα, àti ‘orúkọ mi’ láti pa àwòrán àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
