  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: ìtẹnumọ́ nínú ἐγώ, ìsopọ̀ γάρ, ìfihàn ọjọ́ iwájú, dandan δεῖ, àti ìjìyà nítorí/fún orúkọ Jesu. Síbẹ̀, ìṣètò ‘bí ó ti pọ̀ tó tí ó gbọdọ̀ jìyà’ kò ṣàfihàn iye ìjìyà náà ní Yorùbá tó dáa.'
