id: ACT.9.5
reference: Acts 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: yo
  text: Ó sì wí pé, “Ta ni ìwọ, Olúwa[a]?” Ó sì wí pé, “Èmi ni Jésù, ẹni tí ìwọ ń ṣe inúnibíni sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń bá ẹnì kan sọ̀rọ̀; níhìn-ín a túmọ̀ rẹ̀ sí “Olúwa” nítorí àyíká ìfihàn náà.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ó wí
  rationale: Ọ̀rọ̀-ìṣe aorist λέγω ni; “wí” jẹ́ ọ̀nà ọ̀wọ̀ àti àdánidá láti sọ ọ́ nínú ìtàn, “ó” sì dúró fún olùṣe tí Gíríìkì kò dárúkọ ní kedere.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú ìtẹ̀síwájú ìtàn; “sì” mú ìṣàn ọ̀rọ̀ náà jáde láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: Τίς εἶ
  choice: Ta ni ìwọ
  rationale: Ó túmọ̀ ìbéèrè ní tààrà, ó sì pa ìtẹnumọ́ tí ó wà lórí ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: κύριε
  choice: Olúwa
  rationale: “Olúwa” bá ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ àti oyè mu, ó sì yẹ fún àyíká ìfihàn yìí; síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ọ̀rọ̀ ìbọ̀wọ̀ bí “Ọ̀gá.”
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ó pa arọ́pò-orúkọ tí a tẹnumọ́ ní Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìdánimọ̀ ara ẹni.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó ti fìdí múlẹ̀.
- source_word: ὃν σὺ διώκεις
  choice: ẹni tí ìwọ ń ṣe inúnibíni sí
  rationale: “Ẹni tí” tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí ìṣe náà ń dé bá; “ìwọ” pa ìtẹnumọ́ σὺ mọ́, “ń ṣe inúnibíni sí” sì fi hàn pé ìṣe ọ̀tá náà ń bá a lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριε nínú ọ̀rọ̀ Saulu kí ẹni tó ń sọ̀rọ̀ tó fi ara rẹ̀ hàn ní kíkún
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán, ṣùgbọ́n “Olúwa” pa agbára ìtàn àti ti ẹ̀kọ́-ìgbàgbọ́ nínú ìfihàn ẹni tó ń sọ̀rọ̀ mọ́. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ìtumọ̀ míì tí Gíríìkì gbà láàyè hàn, láìsọ pé Saulu ti ní òye ẹ̀kúnrẹ́rẹ́ ní àkókò ìbéèrè náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa “ó sì wí” mọ́ ní ìgbà méjèèjì láti fara mọ́ ìṣàn àti àìdárúkọ olùsọ̀rọ̀ nínú Gíríìkì.
