  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: yo
  text: Ṣùgbọ́n Sọ́ọ̀lù wá mọ̀ nípa ìdìtẹ̀ wọn. Wọ́n sì ń ṣọ́ àwọn ẹnubodè[a] ní ọ̀sán àti ní òru kí wọ́n lè pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹnubodè ìlú.” Èdè Gíríìkì kàn sọ pé “àwọn ẹnubodè”; àyíká ọ̀rọ̀ ló fi hàn pé àwọn ẹnubodè ìlú ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: wá mọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé ète náà dé sí ìmọ̀ Sọ́ọ̀lù láì sọ ẹni tó sọ ọ́ fún un. ‘Wá mọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìyípadà sí ipò ìmọ̀ hàn.
- source_word: ἐπιβουλή
  choice: ète
  rationale: ‘Ète’ túmọ̀ sí ìṣètò búburú tí a ṣe ní ìkọ̀kọ̀, ó sì bá ète láti pa Sọ́ọ̀lù mu.
- source_word: παρετηροῦντο
  choice: ń ṣọ́
  rationale: Àkókò ọ̀rọ̀-ìṣe Gíríìkì fi ìṣe tí ń bá a lọ hàn. Nínú àyíká yìí, ‘ń ṣọ́’ túmọ̀ sí pé wọ́n ń wo àwọn ọ̀nà àbáwọlé àti àbájáde láìsinmi, kì í ṣe pé wọ́n ń dáàbò bo wọn.
- source_word: πύλας
  choice: àwọn ẹnubodè
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà àti ìtumọ̀ gígùn ọ̀rọ̀ Gíríìkì mọ́; pé ẹnubodè ìlú ni wọ́n jẹ́ wá láti inú àyíká ọ̀rọ̀.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: ní ọ̀sán àti ní òru
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ìṣọ́ náà ń lọ ní ọ̀sán àti ní òru.
- source_word: ὅπως
  choice: kí wọ́n lè
  rationale: Gbólóhùn yìí fi ète tàbí ìdí tí wọ́n fi ń ṣọ́ ẹnubodè hàn.
- source_word: ἀνέλωσιν
  choice: pa á
  rationale: Nínú àyíká yìí, ἀναιρέω túmọ̀ sí pípa ènìyàn; ‘pa á’ jẹ́ ọ̀rọ̀ tààrà, tó sì ṣe kedere.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ète wọn àti bí Sọ́ọ̀lù ṣe wá mọ̀ ọ́n.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so àlàyé míì pọ̀ mọ́ ète wọn ní ọ̀nà àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ‘àwọn ẹnubodè,’ nítorí ibẹ̀ ni àlàyé náà ń tọ́ka sí.
