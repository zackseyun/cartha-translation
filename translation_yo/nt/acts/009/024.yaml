  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: a sọ pé ìmọ̀ ìdìtẹ̀ náà dé ọ̀dọ̀ Sọ́ọ̀lù, ìṣọ́ àwọn ẹnubodè náà ń bá a lọ ní ọ̀sán àti òru, ète wọn sì jẹ́ láti pa á. Síbẹ̀, ‘ète’ lè jẹ́ ète tàbí ìpinnu tí kò ní ìtumọ̀ búburú; ‘ìdìtẹ̀’ fi ἐπιβουλή hàn dáadáa nínú àyíká ìpànìyàn yìí. A tún nílò àmì ohùn ìsàlẹ̀ nínú ‘mọ̀’ (láti mọ̀).'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní, ó sì rọrùn láti ka. ‘Wá mọ̀ nípa ìdìtẹ̀ wọn’ jẹ́ ọ̀nà àdánidá tí ó mú ìtumọ̀ aláìsọ ẹni tí ó mú ìròyìn náà wá nínú ἐγνώσθη hàn. ‘Ń ṣọ́’ yẹ fún ìṣiṣẹ́ tí ń tẹ̀síwájú náà.
  terminology: ‘Sọ́ọ̀lù,’ ‘ẹnubodè,’ ‘ọ̀sán àti òru,’ àti ‘pa á’ bá ọ̀rọ̀ orísun mu. ‘Ìdìtẹ̀’ dára ju ‘ète’ lọ níbi yìí nítorí ó tọ́ka sí ìṣètò ìkòkò tí ó lòdì sí ẹni kan. Àmì ẹsẹ̀ [a] wà níbi tí ó tọ́ka sí ọrọ̀ náà gan-an.
