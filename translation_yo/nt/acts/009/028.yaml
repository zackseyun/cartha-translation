  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: yo
  text: Ó sì wà pẹ̀lú wọn ní Jerúsálẹ́mù, ó ń wọlé, ó sì ń jáde, ó ń fi ìgboyà sọ̀rọ̀ ní orúkọ Olúwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: Ó sì wà pẹ̀lú wọn
  rationale: Ọ̀rọ̀ ìṣe aláìpé ἦν fi ìbákẹ́gbẹ́ tí ó ń bá a lọ hàn. “Ó wà pẹ̀lú wọn” pa ìtumọ̀ yẹn mọ́ láìfi kún un pé ó ń gbé lọ́dọ̀ wọn.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: ó ń wọlé, ó sì ń jáde
  rationale: Àwọn participle méjèèjì jẹ́ ọ̀rọ̀ àpèjúwe fún rírìn kiri àti ìbákẹ́gbẹ́ ní gbangba. Ìtumọ̀ yìí pa àwòrán “wọlé/jáde” àti ìṣe tí ń ṣẹlẹ̀ léraléra mọ́.
- source_word: εἰς Ἰερουσαλήμ
  choice: ní Jerúsálẹ́mù
  rationale: Nínú àyíká ọ̀rọ̀ yìí, εἰς ń tọ́ka sí Jerúsálẹ́mù gẹ́gẹ́ bí ibi tí ìṣe náà ti ń ṣẹlẹ̀, kì í ṣe pé ó ń wọ inú ìlú náà léraléra.
- source_word: παρρησιαζόμενος
  choice: ó ń fi ìgboyà sọ̀rọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísọ̀rọ̀ ní gbangba láìbẹ̀rù; “fi ìgboyà sọ̀rọ̀” jẹ́ Yorùbá àdánidá tí ó pa ìgboyà àti òmìnira ọ̀rọ̀ náà mọ́.
- source_word: ἐν τῷ ὀνόματι
  choice: ní orúkọ
  rationale: “Ní orúkọ” pa ọ̀rọ̀ àpèjúwe Bíbélì mọ́, ó sì jẹ́ kí ìtumọ̀ nípa àṣẹ, aṣojú, àti ìjẹ́wọ́ má ṣe dín kù sí ọ̀kan ṣoṣo.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: A túmọ̀ κύριος gẹ́gẹ́ bí oyè “Olúwa,” dípò yíyí i padà sí orúkọ ẹni; nínú àyíká Ìṣe Àwọn Àpọ́sítélì, ẹni tí a ń tọ́ka sí ni Jésù.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A pa oyè náà mọ́ gẹ́gẹ́ bí “Olúwa” nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a kọ “Jésù” ní tààrà.
  rationale: Ọ̀rọ̀ Gíríìkì ní κυρίου, kì í ṣe Ἰησοῦ. Àyíká ọ̀rọ̀ fi hàn pé Jésù ni a ń tọ́ka sí, ṣùgbọ́n pípa oyè náà mọ́ bọ̀wọ̀ fún ìṣètò àti ìfarahàn ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìṣe tí ń bá a lọ mọ́ nípasẹ̀ “ń,” a sì pa àwòrán wọlé/jáde ti Gíríìkì mọ́.
