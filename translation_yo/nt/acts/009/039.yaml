  to: Peteru sì dìde, ó sì bá wọn lọ. Nígbà tí ó dé, wọ́n mú un gòkè lọ sí yàrá tí ó wà lókè. Gbogbo àwọn opó sì dúró lẹ́gbẹ̀ẹ́ rẹ̀[a], wọ́n ń sunkún, wọ́n sì ń fi àwọn ẹ̀wù àwọ̀tẹ́lẹ̀ àti aṣọ àwọ̀lékè[b] tí Dọ́kásì[c] máa ń ṣe nígbà tí ó wà pẹ̀lú wọn hàn án.
