  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní pàtàkì: Peteru bá àwọn ènìyàn náà lọ, wọ́n mú un lọ sí yàrá tí ó wà lókè, àwọn opó ń sunkún, wọ́n sì ń fi aṣọ tí Dọ́kásì ń ṣe hàn án. Ṣùgbọ́n “Nítorí náà” fún δέ ń fi ìbáṣepọ̀ ìdí-òpin kún ọ̀rọ̀ náà, níbi tí δέ ti jẹ́ àsopọ̀ ìtẹ̀síwájú lasán.'
