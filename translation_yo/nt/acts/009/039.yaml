id: ACT.9.39
reference: Acts 9:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: yo
  text: Peteru sì dìde, ó sì bá wọn lọ. Nígbà tí ó dé, wọ́n mú un gòkè lọ sí yàrá tí ó wà lókè. Gbogbo àwọn opó sì dúró lẹ́gbẹ̀ẹ́ rẹ̀[a], wọ́n ń sunkún, wọ́n sì ń fi àwọn ẹ̀wù àwọ̀tẹ́lẹ̀ àti aṣọ àwọ̀lékè[b] tí Dọ́kásì[c] máa ń ṣe nígbà tí ó wà pẹ̀lú wọn hàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dúró níwájú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ yẹn pẹ̀lú; àyíká ọ̀rọ̀ fi hàn pé àwọn opó náà péjọ sí ọ̀dọ̀ Peteru nínú ọ̀fọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ẹ̀wù àwọ̀tẹ́lẹ̀ àti aṣọ àwọ̀lékè” ń túmọ̀ àwọn ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀ fún aṣọ; ó ṣeé ṣe kí wọ́n tọ́ka sí aṣọ inú àti aṣọ òde.
    reason: cultural_note
  - marker: c
    text: Dọ́kásì ni orúkọ Gíríìkì rẹ̀; ní Ìṣe 9:36, a tún pè é ní Tábítà.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ó sọ ìgbésẹ̀ tí Peteru gbé láti dáhùn sí ìpè wọn ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: συνῆλθεν αὐτοῖς
  choice: ó bá wọn lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Peteru tẹ̀ lé àwọn aṣojú náà lọ.
- source_word: παραγενόμενον
  choice: Nígbà tí ó dé
  rationale: Ó mú ìtumọ̀ àkókò ti participle náà jáde ní èdè Yorùbá àdánidá.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: wọ́n mú un gòkè lọ sí yàrá òkè
  rationale: Ó pa ìlọ sókè àti ibi tí wọ́n ń lọ mọ́ láìjẹ́ kí gbólóhùn náà ṣòro.
- source_word: παρέστησαν αὐτῷ
  choice: dúró lẹ́gbẹ̀ẹ́ rẹ̀
  rationale: Ó bá àwòrán àwọn opó tí wọ́n péjọ sí ọ̀dọ̀ Peteru mu, ṣùgbọ́n àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ míì tí ó ṣeé ṣe.
- source_word: κλαίουσαι
  choice: wọ́n ń sunkún
  rationale: Ó fi ìṣe tí ó ń bá a lọ àti ọ̀fọ̀ wọn hàn.
- source_word: ἐπιδεικνύμεναι
  choice: wọ́n sì ń fi ... hàn án
  rationale: Ó sọ pé wọ́n ń fi àwọn aṣọ náà hàn Peteru ní kedere.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: àwọn ẹ̀wù àwọ̀tẹ́lẹ̀ àti aṣọ àwọ̀lékè
  rationale: 'Ó pa ìyàtọ̀ tó wà láàárín irú aṣọ méjèèjì mọ́: èyí tí a wọ sábẹ́ àti èyí tí a wọ lókè.'
- source_word: ὅσα ἐποίει
  choice: tí ... máa ń ṣe
  rationale: Ìlò imperfect náà lè tọ́ka sí iṣẹ́ tí Dọ́kásì ń ṣe léraléra nígbà tí ó wà láàyè pẹ̀lú wọn.
