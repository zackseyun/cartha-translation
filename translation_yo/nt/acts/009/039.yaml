translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó yẹ. A yan “Peteru,” “Dọ́kásì,” àti “Tábítà” gẹ́gẹ́ bí ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Yorùbá. Gbogbo àmì àlàyé [a]–[c] wà nínú ọ̀rọ̀ pàtàkì ní ibi tí ó bá ọ̀rọ̀ wọn mu.
