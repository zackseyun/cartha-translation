  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: yo
  text: Nígbà tí ọjọ́ púpọ̀ ti kọjá,[a] àwọn Júù[b] dìtẹ̀ pọ̀[c] láti pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà tí ọjọ́ púpọ̀ ti pé” tàbí “ti parí.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “àwọn Júù.” Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ẹgbẹ́ kan pàtó tí ń tako Saulu, kì í ṣe gbogbo Júù láìsí àyọkúrò.
    reason: cultural_note
  - marker: c
    text: Tàbí “jùmọ̀ gbèrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nígbà tí
  rationale: Ó fi ìyípadà àkókò hàn ní ọ̀nà tó bá Yorùbá àdánidá mu; kò pọndandan láti túmọ̀ δέ lọ́tọ̀.
- source_word: ἐπληροῦντο
  choice: ti kọjá
  rationale: Pẹ̀lú ‘ọjọ́’ gẹ́gẹ́ bí olùṣe, ọ̀rọ̀ náà jẹ́ àṣà èdè fún bí àkókò ṣe ń pé tàbí ṣe ń kọjá. ‘Ti kọjá’ jẹ́ Yorùbá àdánidá.
- source_word: ἡμέραι ἱκαναί
  choice: ọjọ́ púpọ̀
  rationale: ἱκαναί níbí túmọ̀ sí iye tó pọ̀ tàbí tó ṣe pàtàkì, kì í ṣe pé ó kàn ‘tó’ nìkan.
- source_word: συνεβουλεύσαντο
  choice: dìtẹ̀ pọ̀
  rationale: Ó sọ ìgbìmọ̀ àpapọ̀ tí ète búburú wà nínú rẹ̀; ‘dìtẹ̀ pọ̀’ mú ìmọ̀ràn ìkọ̀kọ̀ àti ète láti pa ẹni hàn ní Yorùbá.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Ó pa ìtumọ̀ gíríìkì mọ́ láì fi ‘àwọn olórí’ kún un tàbí dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù.
- source_word: ἀνελεῖν
  choice: láti pa
  rationale: Ó jẹ́ ọ̀nà tààrà, kedere, àti àdánidá láti sọ gbígba ẹ̀mí ẹni, láì fi ìtumọ̀ òfin míì kún un.
- source_word: αὐτόν
  choice: á
  rationale: Arọ́pò-orúkọ olùgbàṣe náà ń tọ́ka sí Saulu nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ οἱ Ἰουδαῖοι nínú ìtàn ìtakò
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn olórí Júù
  rationale: A pa ọ̀rọ̀ orísun mọ́, nítorí ẹsẹ yìí kò sọ pé àwọn olórí nìkan ni. Àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ẹgbẹ́ kan pàtó tí ń tako Saulu ni àyíká ọ̀rọ̀ ń tọ́ka sí, kì í ṣe gbogbo Júù láìsí àyọkúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìtòlẹ́sẹẹsẹ àwọn àmì àlàyé tẹ̀ lé ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
