source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: yo
  text: Gbogbo àwọn tí ń gbé ní Lida àti ní Ṣárónì[a] sì rí i, wọ́n sì yí padà sí Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀tẹ́lẹ̀ Ṣárónì.”
    reason: lexical_alternative
  - marker: b
    text: “Yí padà sí Olúwa” tún lè jẹ́ “padà sọ́dọ̀ Olúwa”; ní ìtumọ̀ àlàyé sí i, “wọ́n di ẹni tí ó gba Olúwa gbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: rí i
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn ènìyàn náà rí Énéà lẹ́yìn ìwòsàn rẹ̀; “rí i” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: πάντες οἱ κατοικοῦντες
  choice: gbogbo àwọn olùgbé
  rationale: Àpólà alábápín pẹ̀lú atókùn náà ń tọ́ka sí gbogbo àwọn tí ń gbé ní àwọn agbègbè náà; “gbogbo àwọn olùgbé” jẹ́ kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Λύδδα
  choice: Lida
  rationale: A ṣe àkọsílẹ̀ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: τὸν Σαρῶνα
  choice: Ṣárónì
  rationale: Ṣárónì ni orúkọ agbègbè pẹ̀tẹ́lẹ̀ náà. A fi àlàyé sí àkọsílẹ̀ ìsàlẹ̀ láti pa ìtumọ̀ agbègbè/pẹ̀tẹ́lẹ̀ mọ́ láì fi ọ̀rọ̀ kún ẹsẹ̀ náà.
- source_word: οἵτινες
  choice: wọ́n sì
  rationale: Ìtumọ̀ yìí ń bá ìtàn náà lọ ní èdè Yorùbá tó rọrùn, ó sì ń tọ́ka padà sí àwọn olùgbé tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: yí padà sí Olúwa
  rationale: “Yí padà sí” pa àwòrán ìyípadà ìtọ́sọ́nà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹra fún fífi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó túmọ̀ ju ti orísun lọ sí i.
- source_word: κύριον
  choice: Olúwa
  rationale: “Olúwa” ni akọ́lé Yorùbá tó bójú mu fún κύριος. Àyíká tọ́ka sí Jésù tó jíǹde, ṣùgbọ́n a kò fi “Jésù” kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù
  rationale: Àyíká Ìṣe 9 fi hàn pé ó ṣeé ṣe gan-an kí akọ́lé náà tọ́ka sí Jésù, ṣùgbọ́n Gíríìkì sọ τὸν κύριον nìkan. Nítorí náà, a pa akọ́lé náà mọ́ láì fi orúkọ kún un.
- issue: Agbára ìtumọ̀ ἐπέστρεψαν
  choice: yí padà sí
  alternative: padà sọ́dọ̀; di ẹni ìyípadà sí
  rationale: “Yí padà sí” lè gbé èrò ìrònúpìwàdà àti ìgbàgbọ́ jáde láì sọ pé wọ́n ti jẹ́ ti Olúwa tẹ́lẹ̀, tàbí láì fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó dín ìtumọ̀ náà kù sí i.
translation_notes:
  register: Èdè Yorùbá àkànṣe tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ, a sì pa àtẹ̀jáde ìtàn náà mọ́ ní ọ̀nà àdánidá. Gẹ́gẹ́ bí ìbámu àwọn àmì àkọsílẹ̀ ìsàlẹ̀ pẹ̀lú ọ̀rọ̀ tí wọ́n ń ṣàlàyé, [a] tẹ̀ lé Ṣárónì, [b] sì tẹ̀ lé gbólóhùn “yí padà sí Olúwa.”
