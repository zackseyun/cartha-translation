  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìbéèrè méjèèjì, ‘orúkọ yìí,’ àti ète Saulu mọ́. Ṣùgbọ́n ‘ní dídè’ kò jẹ́ ọ̀nà Yorùbá tí ó pé fún δεδεμένους, àti ‘Ṣé kì í sì í ṣe’ ń dà bí ìṣe àṣà lọwọlọwọ dípò ìwá tí ó ti ṣẹlẹ̀. Àtúnṣe náà fi ìwá tí ó ti wá ṣáájú hàn ní kedere.
  naturalness: ‘Ṣe ìparun láàárín àwọn’ kò rọrùn bí ohun tí ó gba àfojúsùn tààrà. ‘Ṣe ìparun sí àwọn’ jẹ́ Yorùbá boṣewa tí ó dára jù. ‘Àwọn tí ń pe orúkọ yìí’ sì jẹ́ ìsọ̀rí Bíbélì tí ó mọ́gbọ́n dání ju ‘ń ké pe’ lọ nínú àyíká yìí.
  terminology: A pa ‘orúkọ yìí’ mọ́ gẹ́gẹ́ bí Gíríìkì, láì fi Jésù kún ọ̀rọ̀ pàtàkì. ‘Àwọn olórí àlùfáà’ jẹ́ ìtumọ̀ tó yẹ fún ἀρχιερεῖς. ‘Àwọn tí a dè’ fi δεδεμένους hàn láì sọ irú ìdè kan pàtó.
  issues:
  - severity: medium
    issue: ‘ní dídè’
    rationale: Èyí kò jẹ́ gbólóhùn Yorùbá àdánidá fún ‘bound’; ó lè túmọ̀ sí ipò ìdúró tàbí ìgbésẹ̀ dídi. ‘Àwọn tí a dè’ fi ipò passive perfect náà hàn ní kedere.
  - severity: medium
    issue: ‘Ṣé kì í sì í ṣe fún ète yìí ni ó fi wá síbí’
    rationale: Àmì ‘kì í’ sábà ń tọ́ka sí ohun tí kì í ṣẹlẹ̀ nígbà gbogbo. ‘Ṣé kì í ṣe ... ni ó ti wá síbí’ dá ìbéèrè ìjẹ́wọ́ náà àti ìwá tí ó ti ṣẹlẹ̀ (ἐληλύθει) dúró dáadáa.
  - severity: low
    issue: ‘ń ké pe orúkọ yìí’ àti àlàyé rẹ̀
    rationale: ‘Ń pe orúkọ yìí’ jẹ́ ohun tí ó rọrùn àti tí ó wọ́pọ̀ nínú ìlò Bíbélì Yorùbá. Àlàyé ìṣàfilọ́lẹ̀ àtijọ́ náà (‘ń fi orúkọ yìí ké pè é’) kò ṣe kedere.
  - severity: low
    issue: ‘ṣe ìparun láàárín àwọn’
    rationale: Gíríìkì ní àwọn ènìyàn gẹ́gẹ́ bí object tààrà. ‘Ṣe ìparun sí àwọn’ dá ìbáṣepọ̀ náà hàn ní Yorùbá tí ó ṣe déédé.
