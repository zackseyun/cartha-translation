id: ACT.9.21
reference: Acts 9:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: yo
  text: Gbogbo àwọn tí wọ́n gbọ́ ọ̀rọ̀ rẹ̀ sì ń ṣe kàyéfì, wọ́n sì ń wí pé, “Ọkùnrin yìí kọ́ ni ẹni tí ó ṣe ìparun sí àwọn tí ń pe orúkọ yìí ní Jerusalẹmu[a]? Ṣé kì í ṣe fún ète yìí ni ó ti wá síbí, kí ó lè mú àwọn tí a dè lọ sọ́dọ̀ àwọn olórí àlùfáà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Orúkọ yìí’ ń tọ́ka sí Jésù. A lè tú ‘àwọn tí ń pe orúkọ yìí’ sí ‘àwọn tí ń ké pè é nípasẹ̀ orúkọ yìí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ń ṣe kàyéfì
  rationale: Ó fi ìyàlẹ́nu líle tí ó ń bá a lọ hàn ní Yorùbá àdánidá, láì mú un dé ìtumọ̀ pé ọpọlọ wọn dàrú.
- source_word: πάντες οἱ ἀκούοντες
  choice: Gbogbo àwọn tí wọ́n gbọ́ ọ̀rọ̀ rẹ̀
  rationale: A fi ohun tí wọ́n gbọ́, èyí tí ọ̀rọ̀ inú àyíká tọ́ka sí, hàn ní kedere àti ní Yorùbá tí ó ṣe déédé.
- source_word: πορθήσας
  choice: ṣe ìparun láàárín
  rationale: Ọ̀rọ̀ náà lágbára ju ‘ṣe inúnibíni’ lọ; ‘ṣe ìparun láàárín’ pa agbára ìwà ipá rẹ̀ mọ́ láì sọ pé ó pa gbogbo wọn run.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: àwọn tí ń ké pe orúkọ yìí
  rationale: ‘Ké pe orúkọ’ pa àwòrán Bíbélì ti fífi ìgbàgbọ́ ké pe orúkọ ẹni mọ́, ó sì jẹ́ Yorùbá tí ó yé ni àyíká ìjọsìn.
- source_word: τὸ ὄνομα τοῦτο
  choice: orúkọ yìí
  rationale: Ó pa ọ̀rọ̀ atọ́ka Gíríìkì mọ́ dípò fífi ‘orúkọ Jésù’ kún un ní tààrà.
- source_word: εἰς τοῦτο
  choice: fún ète yìí
  rationale: Ó sọ ète ìwá rẹ̀ ní kedere, ó sì bá ìtumọ̀ gbólóhùn Gíríìkì mu.
- source_word: ἐληλύθει
  choice: ni ó fi wá síbí
  rationale: Nínú ìbéèrè Yorùbá yìí, ó tọ́ka sí wíwá tí ó ti ṣẹlẹ̀ ṣáájú àsọyé àwọn olùgbọ́.
- source_word: δεδεμένους
  choice: ní dídè
  rationale: Ó pa ipò tí a dè wọ́n sí mọ́, láì sọ ohun tí a fi dè wọ́n ní pàtó.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: mú wọn lọ sọ́dọ̀ àwọn olórí àlùfáà
  rationale: ‘Mú ... lọ sọ́dọ̀’ jẹ́ àdánidá, ó sì pa ìtọ́sọ́nà sí ọ̀dọ̀ àwọn aláṣẹ àlùfáà mọ́.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwùjọ àwọn aláṣẹ àlùfáà, kì í ṣe ọ̀pọ̀ àwọn olórí àlùfáà gíga tí wọ́n ń ṣiṣẹ́ ní ipò kan náà.
theological_decisions:
- issue: Bóyá kí a tú ‘orúkọ yìí’ sí ‘orúkọ Jésù’ nínú ọ̀rọ̀ pàtàkì
  choice: Pa ‘orúkọ yìí’ mọ́
  alternative: orúkọ Jésù
  rationale: Gíríìkì fi ẹni tí orúkọ náà ń tọ́ka sí sílẹ̀ fún àyíká ọ̀rọ̀; mímú atọ́ka náà dúró pa agbára àsọyé àti àìsọ ní tààrà mọ́.
- issue: Bí a ṣe máa fi agbára πορθήσας hàn
  choice: ṣe ìparun láàárín
  alternative: ṣe inúnibíni sí
  rationale: Ọ̀rọ̀ orísun náà lágbára ju ọ̀rọ̀ gbogbogbò fún inúnibíni lọ, nítorí náà a kò yẹ kí a rọ ìwà ipá Saulu kù.
- issue: Ìrísí gbólóhùn kejì gẹ́gẹ́ bí ìbéèrè
  choice: Ṣé kì í sì í ṣe ...?
  alternative: Ó sì ti wá síbí fún ète yìí
  rationale: Àmì ìbéèrè ní orísun náà bo gbogbo àsọyé, Yorùbá yìí sì pa ìbéèrè ìrètí ìjẹ́wọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yan ‘ń ṣe kàyéfì’ àti ‘ṣe ìparun láàárín’ láti jẹ́ kó yé àwọn òǹkàwé òde òní, nígbà tí ‘ké pe orúkọ’ ń pa àṣà ọ̀rọ̀ Bíbélì mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
