id: ACT.9.41
reference: Acts 9:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: yo
  text: Ó sì na ọwọ́ rẹ̀ sí i[a], ó sì gbé e dìde. Lẹ́yìn náà, ó pe àwọn ẹni mímọ́ àti àwọn opó, ó sì fi í hàn wọ́n láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó di ọwọ́ rẹ̀ mú.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe fífi ọwọ́ fún ẹnì kan láti ràn án lọ́wọ́ láti dìde.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: na ọwọ́ rẹ̀ sí i
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Pétérù na ọwọ́ sí i láti ràn án lọ́wọ́ láti dìde. Ó tẹ̀ lé àwòrán Gíríìkì ní ọ̀nà tó ṣe kedere, tó sì jẹ́ ti Yorùbá àdánidá.
- source_word: ἀνέστησεν
  choice: gbé e dìde
  rationale: Àṣàyàn yìí lè túmọ̀ sí mímú ẹni dìde tàbí mímú ẹni dúró, ó sì pa ìró èdè àjíǹde inú àyíká ọ̀rọ̀ mọ́ láì sọ pé Pétérù fúnra rẹ̀ ló dá a padà sí ìyè.
- source_word: φωνήσας
  choice: ó pe
  rationale: Ó sọ ìṣe pípe àwọn ènìyàn náà jọ ní èdè Yorùbá tó rọrùn, ó sì bá ìtẹ̀lé ìṣẹ̀lẹ̀ inú Gíríìkì mu.
- source_word: τοὺς ἁγίους
  choice: àwọn ẹni mímọ́
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún orúkọ tí Májẹ̀mú Tuntun fi ń pe àwọn ènìyàn Ọlọ́run; kò dín un kù sí ‘àwọn onígbàgbọ́’ nìkan.
- source_word: τὰς χήρας
  choice: àwọn opó
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì pa ìyàtọ̀ wọn mọ́ nítorí ipa pàtàkì wọn nínú àyíká ìtàn tó ṣáájú.
- source_word: παρέστησεν
  choice: fi í hàn wọ́n
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé Pétérù mú un wá síwájú wọn, ó sì fi hàn wọ́n. Èyí jẹ́ Yorùbá àdánidá ju lílo ‘gbé e kalẹ̀’ lọ.
- source_word: ζῶσαν
  choice: láàyè
  rationale: 'Ọ̀rọ̀ náà ṣàpèjúwe ipò Tábítà nígbà tí Pétérù fi í hàn wọ́n: ó wà láàyè. Ó mú agbára ìṣẹ̀lẹ̀ náà jáde ní kedere.'
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀνέστησεν, ọ̀rọ̀ tó ní ìbáṣepọ̀ pẹ̀lú àjíǹde, nínú ìtàn yìí
  choice: gbé e dìde
  alternative: ràn án lọ́wọ́ láti dìde / mú un dúró
  rationale: ‘Gbé e dìde’ pa agbára ọ̀rọ̀ Gíríìkì àti ìró àjíǹde mọ́, ṣùgbọ́n ó tún lè tọ́ka sí ìṣe Pétérù ti mímú Tábítà dìde lẹ́yìn tí ó ti padà sí ìyè. Bẹ́ẹ̀ ni kò sọ ohun tí ẹsẹ náà kò sọ ní pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Ìtúmọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; ó sì pa àìdájú kékeré inú δοὺς ... χεῖρα àti ìró àjíǹde inú ἀνέστησεν mọ́.
