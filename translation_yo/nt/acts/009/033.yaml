    issue: The personal name “Aíníà” is not a sound rendering of Αἰνέαν.
    rationale: Αἰνέας has the vowel sequence ai-ne-as; “Aíníà” changes the second syllable from the Greek epsilon sound to /i/. “Ainéà” more closely represents the source name in Yoruba orthography.
