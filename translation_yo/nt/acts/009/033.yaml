base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: yo
  text: Ó sì rí ọkùnrin kan níbẹ̀, tí orúkọ rẹ̀ ń jẹ́ Ainéà. Ó ti dùbúlẹ̀ lórí àkéte[a] fún ọdún mẹ́jọ, ara rẹ̀ sì rọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àkéte tàbí ibùsùn kékeré tí a lè gbé kiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Ó sì rí ... níbẹ̀
  rationale: “Ó sì” fi ìtẹ̀síwájú ìtàn tí δέ ń tọ́ka sí hàn, “rí” sì jẹ́ ìtumọ̀ tààrà fún εὗρεν.
- source_word: ἄνθρωπόν τινα
  choice: ọkùnrin kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ nípa ẹni pàtó kan tí a ṣẹ̀ṣẹ̀ ń mú wọ inú ìtàn.
- source_word: ὀνόματι Αἰνέαν
  choice: tí orúkọ rẹ̀ ń jẹ́ Aíníà
  rationale: Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì ṣe àfihàn orúkọ Gíríìkì Αἰνέας ní ìró Yorùbá.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: fún ọdún mẹ́jọ
  rationale: Ọ̀rọ̀ náà ń sọ iye àkókò tí ipò náà ti pé; “fún ọdún mẹ́jọ” sọ ọ́ ní kedere ní Yorùbá.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: Ó ti dùbúlẹ̀ lórí àkéte
  rationale: Èyí pa àwòrán gidi inú Gíríìkì mọ́ dípò yíyí i padà sí ọ̀rọ̀ gbogbogbò bí “kò lè dìde lórí ibùsùn.”
- source_word: ὃς ἦν παραλελυμένος
  choice: ara rẹ̀ sì rọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti ṣàpèjúwe ẹni tí paralysis mú.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ìtàn tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A pín àpèjúwe náà sí gbólóhùn méjì kí ó lè ṣàn lọ́nà àdánidá, láìsọ ìtumọ̀ Gíríìkì nù.
