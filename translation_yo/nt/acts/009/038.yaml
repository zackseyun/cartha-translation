id: ACT.9.38
reference: Acts 9:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: yo
  text: Nítorí pé Lida sún mọ́ Jopa, nígbà tí àwọn ọmọ-ẹ̀yìn gbọ́ pé Peteru wà níbẹ̀, wọ́n rán ọkùnrin méjì lọ sọ́dọ̀ rẹ̀, wọ́n sì rọ̀ ọ́ pé, “Má ṣe pẹ́[a] láti wá sọ́dọ̀ wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má ṣe ṣiyèméjì láti wá sọ́dọ̀ wa.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ṣíṣiyèméjì tàbí ṣíṣe pẹ́; nínú ẹ̀bẹ̀ kánjú yìí, ẹsẹ̀ náà lo ìtumọ̀ “má ṣe pẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Nítorí pé Lida wà nítòsí Jopa
  rationale: 'Àkójọpọ̀ ọ̀rọ̀ genitive absolute náà fi ipò tó yí ìṣẹ̀lẹ̀ ká hàn, ó sì ní ìtumọ̀ ìdí nínú àyíká yìí: bí àwọn ìlú náà ṣe sún mọ́ra ló mú kí àwọn ọmọ-ẹ̀yìn ránṣẹ́ sí Peteru. ‘Nítorí pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.'
- source_word: Λύδδας / Ἰόππῃ
  choice: Lida / Jopa
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi Gíríìkì náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún àwọn ọmọlẹ́yìn onígbàgbọ́ nínú Ìṣe Àwọn Aposteli.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́
  rationale: Gbólóhùn àsìkò yìí fi hàn lọ́nà Yorùbá àdánidá pé gbígbọ́ ìròyìn náà ṣáájú rírán àwọn ọkùnrin náà.
- source_word: ἐν αὐτῇ
  choice: wà níbẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí Lida; ‘níbẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi àfikún tí kò sí nínú orísun kún un.
- source_word: ἀπέστειλαν δύο ἄνδρας
  choice: wọ́n rán ọkùnrin méjì sí i
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìṣe àti ẹni tí wọ́n rán ní tààrà, ó sì jẹ́ èdè Yorùbá tó lọ́nà.
- source_word: παρακαλοῦντες
  choice: wọ́n sì rọ̀ ọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìbéèrè ọlọ́kàn-gbígbóná; ‘rọ̀’ mú ìtẹnumọ́ náà jáde láìsọ ọ́ di ẹ̀bẹ̀ líle ju ti orísun lọ.
- source_word: Μὴ ὀκνήσῃς
  choice: Má ṣe jáfara
  rationale: ὀκνέω lè tọ́ka sí ṣíṣe pẹ́ tàbí ṣíṣe iyèméjì. Nínú ìbéèrè kí Peteru yára rìnrìn-àjò, ‘má ṣe jáfara’ mú ìtumọ̀ pé kó má ṣe pẹ́ jáde, nígbà tó tún fi àyè sílẹ̀ fún èrò àìlọ́ra.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: láti wá sọ́dọ̀ wa
  rationale: Bó tilẹ̀ jẹ́ pé διελθεῖν ní ìtumọ̀ gangan ti líla tàbí rírìn kọjá, nínú àyíká yìí ó ń tọ́ka sí ìrìn Peteru dé ibi tí àwọn olùsọ̀rọ̀ wà. ‘Wá sọ́dọ̀ wa’ jẹ́ ìṣe-ọrọ Yorùbá àdánidá láti ojú ìwòye wọn.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀n òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Ó jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘Peteru,’ ‘Lida,’ àti ‘Jopa’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tó bá ìró Yorùbá mu.
