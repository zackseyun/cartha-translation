  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: yo
  text: Àwọn ọkùnrin tí wọ́n ń bá a rin ìrìn àjò dúró láì lè sọ̀rọ̀; wọ́n ń gbọ́ ohùn náà[a], ṣùgbọ́n wọn kò rí ẹnikẹ́ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìró.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ohùn” tàbí “ìró”; fi wé Ìṣe 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Àwọn ọkùnrin
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ọkùnrin náà; a kò fi δέ hàn ní ìbẹ̀rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àkókò, nítorí pé ó jẹ́ àsopọ̀ ìtàn tó rọ̀.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: tí wọ́n ń bá a rin ìrìn àjò
  rationale: Ó túmọ̀ sí àwọn tí wọ́n ń bá a lọ ní ojú ìrìn àjò, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti ti ẹ̀dá.
- source_word: εἱστήκεισαν
  choice: dúró
  rationale: Ìṣe náà ní agbára ipò dúró; ‘dúró’ bá ìtàn Yorùbá mu láìfi kún un pé wọ́n ṣẹ̀ṣẹ̀ dá ìrìn wọn dúró.
- source_word: ἐνεοί
  choice: láìlè sọ̀rọ̀
  rationale: Ó sọ pé wọn kò lè sọ̀rọ̀, bóyá nítorí ìyàlẹ́nu; yíyàn yìí ṣe kedere ju lílo àkànlò èdè tí ó lè túmọ̀ sí ìyàlẹ́nu nìkan lọ.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: wọ́n ń gbọ́ ohùn náà
  rationale: φωνή lè jẹ́ ohùn ẹni tàbí ohun tí etí gbọ́. ‘Ohùn’ jẹ́ yíyàn àdánidá tó sún mọ́ ọ̀rọ̀ Gíríìkì, láìdá ìtumọ̀ rẹ̀ sí ‘ìró’ nìkan.
- source_word: μηδένα δὲ θεωροῦντες
  choice: ṣùgbọ́n wọn kò rí ẹnikẹ́ni
  rationale: θεωρέω níbí jẹ́ rírí tàbí kíyèsí ènìyàn; ‘kò rí ẹnikẹ́ni’ ni ọ̀nà Yorùbá tó ṣe kedere jù.
theological_decisions:
- issue: Ìfarahàn bí ẹni pé Ìṣe 9:7 àti 22:9 yàtọ̀ lórí ohun tí àwọn alábàákẹ́gbẹ́ Saulu gbọ́
  choice: Lo ‘ohùn’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sọ pé ‘ìró’ tún ṣeé ṣe
  alternative: Lo ‘ìró’ nínú ọ̀rọ̀ pàtàkì láti fi ìyàtọ̀ hàn láàárín gbígbọ́ ìró àti gbígbọ́ ọ̀rọ̀ ẹni tó ń sọ̀rọ̀
  rationale: φωνή fúnra rẹ̀ lè túmọ̀ sí ‘ohùn’ tàbí ‘ìró.’ Fífi ‘ohùn’ sí ọ̀rọ̀ pàtàkì dúró sítòsí ẹ̀rí orísun, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì àti ìṣòro tó wà láàárín àwọn ẹsẹ méjèèjì mọ́ láìfi ìbámu kan lé wọn lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tó bá yẹ. Àmì àlàyé [a] wà lẹ́yìn ‘ohùn náà,’ ibi tí àṣàyàn ọ̀rọ̀ náà ti kan.
