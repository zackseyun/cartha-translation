source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: yo
  text: Ó sì ti rí[a] nínú ìran pé ọkùnrin kan tí a ń pè ní Anania wọlé, tí ó sì fi ọwọ́ rẹ̀ lé e, kí ó lè tún rí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì rí.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní aorist; “ó sì ti rí” fi hàn pé ìran tí ó rí ṣì ṣe pàtàkì sí ohun tí ń ṣẹlẹ̀ ní àkókò náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó lè ríran padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ó sì ti rí
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ aorist, ṣùgbọ́n “ti rí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ tí ó sì ṣì ṣe pàtàkì ní àsìkò ọ̀rọ̀ yìí. “Ó sì rí” tún ṣeé ṣe.
- source_word: ἄνδρα
  choice: ọkùnrin kan
  rationale: Ó tọ́ka sí ọkùnrin àgbà kan, ìyẹn Ananíà; ìtumọ̀ yìí ṣe kedere, ó sì bá akọ-ǹkan orísun mu.
- source_word: ἐν ὁράματι
  choice: nínú ìran
  rationale: Èyí ni gbólóhùn Yorùbá tí ó wọ́pọ̀ fún ohun tí ènìyàn rí nípasẹ̀ ìran.
- source_word: Ἁνανίαν ὀνόματι
  choice: tí orúkọ rẹ̀ ń jẹ́ Ananíà
  rationale: Ó tú àṣà-ọrọ Gíríìkì náà sí Yorùbá òde òní tí ó rọrùn, láìyí iṣẹ́ ìdánimọ̀ orúkọ náà padà.
- source_word: εἰσελθόντα
  choice: wọlé
  rationale: Ó sọ ìgbésẹ̀ Ananíà nínú ìran náà ní ṣókí àti ní èdè àdánidá.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: gbé ọwọ́ lé e
  rationale: Èyí ni àṣà-ọrọ Yorùbá tí ó bójú mu fún fífi ọwọ́ lé ẹnì kan. Kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kun iṣẹ́ ara tí Gíríìkì sọ.
- source_word: ὅπως
  choice: kí ó lè
  rationale: Ó fi ète tàbí àbájáde tí a pinnu hàn ní Yorùbá àdánidá.
- source_word: ἀναβλέψῃ
  choice: ríran padà
  rationale: Nínú ọ̀rọ̀ ìmúláradá yìí, ó túmọ̀ sí pípadà ríran, kì í ṣe gbígbé ojú sókè lásán.
theological_decisions:
- issue: Bóyá kí a fi ìtumọ̀ ẹ̀kọ́ ìsìn pàtó kún fífi ọwọ́ lé Saulu
  choice: gbé ọwọ́ lé e
  alternative: fi ọwọ́ rẹ̀ lé e
  rationale: Orísun sọ iṣẹ́ fífi ọwọ́ lé e, ṣùgbọ́n kò ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìlànà ìyàsímímọ́, sakírámẹ́ǹtì, tàbí ọ̀nà ìwòsàn ẹ̀sìn kan. Ìtumọ̀ náà pa àìsọtẹ́lẹ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìbẹ̀rẹ̀ asopọ̀ “ó sì” mọ́ nítorí καὶ àti ìtẹ̀síwájú ọ̀rọ̀ inú àyíká ẹsẹ̀ náà.
