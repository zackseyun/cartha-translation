id: ACT.9.40
reference: Acts 9:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù rán gbogbo wọn jáde, ó kúnlẹ̀, ó sì gbàdúrà. Lẹ́yìn náà, ó yíjú sí òkú náà, ó ní, “Tábítà, dìde.” Obìnrin náà sì la ojú rẹ̀; nígbà tí ó rí Pétérù, ó dìde jókòó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλὼν δὲ ἔξω πάντας
  choice: Ṣùgbọ́n Pétérù mú kí gbogbo wọn jáde síta
  rationale: Ó fi hàn pé Pétérù yọ gbogbo àwọn tó wà níbẹ̀ kúrò nínú yàrá, láìfi agbára tó pọ̀ ju ti Gíríìkì hàn.
- source_word: θεὶς τὰ γόνατα
  choice: ó kúnlẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìṣe kíkúnlẹ̀ láti gbàdúrà.
- source_word: προσηύξατο
  choice: ó sì gbàdúrà
  rationale: Ìtumọ̀ tààrà, tó sì wọ́pọ̀ fún προσεύχομαι.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: ó yíjú sí òkú náà
  rationale: ‘Yíjú sí’ pa ìyípadà ibi tí Pétérù dojú kọ mọ́; ‘òkú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere ní àyíká yìí pé ara ẹni tó ti kú ni.
- source_word: Ταβιθά
  choice: Tábítà
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti àmì ohùn Yorùbá.
- source_word: ἀνάστηθι
  choice: dìde
  rationale: ‘Dìde’ lè túmọ̀ sí jí dìde tàbí gbéra sókè, ó sì pa ìtumọ̀ àṣẹ náà àti ìdọ́gba rẹ̀ mọ́ láìfi ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀ sí i.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: Obìnrin náà sì la ojú rẹ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá fún gbólóhùn Gíríìkì náà.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: nígbà tí ó rí Pétérù
  rationale: Gbólóhùn àkókò yìí mú ìtẹ̀lé ìṣẹ̀lẹ̀ náà ṣe kedere ní Yorùbá.
- source_word: ἀνεκάθισεν
  choice: ó dìde jókòó
  rationale: Ó ṣàpèjúwe jíjókòó sókè láti ipò ìdùbúlẹ̀ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n / sì
  rationale: ‘Ṣùgbọ́n’ samisi ìyípadà láti inú ìṣẹ̀lẹ̀ tó ṣáájú, ‘sì’ sì ń tẹ ìtàn náà síwájú láìsọ ìtakora di líle.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ ἀνάστηθι nínú ìṣẹ̀lẹ̀ ìmúpadàbọ̀ sí ìyè
  choice: dìde
  alternative: gbéra sókè
  rationale: ‘Dìde’ pa àìdánilójú gidi ti ọ̀rọ̀ Gíríìkì mọ́—ó lè jẹ́ ‘get up’ tàbí ‘arise’—ó sì bá ìṣẹ̀lẹ̀ ìmúpadàbọ̀ sí ìyè mu láìfikún ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yé òǹkàwé òde òní. A kò fi àmì àlàyé [a] sí ‘dìde’ nítorí àṣàyàn Yorùbá yìí fúnra rẹ̀ gba àwọn ìtumọ̀ ‘arise/get up’ méjèèjì, nítorí náà kò sí àṣàyàn míì tó nílò àlàyé.
