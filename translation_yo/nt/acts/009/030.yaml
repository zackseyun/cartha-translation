id: ACT.9.30
reference: Acts 9:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: yo
  text: Nígbà tí àwọn arákùnrin gbọ́ èyí[a], wọ́n mú un sọ̀kalẹ̀ lọ sí Kesaria, wọ́n sì rán an lọ sí Tarsu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Gíríìkì ní “àwọn arákùnrin,” ṣùgbọ́n ní àyíká yìí ó lè tọ́ka sí àwùjọ àwọn onígbàgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: nígbà tí ... gbọ́ èyí
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó fi ipò tó mú kí àwọn ìṣe pàtàkì ṣẹlẹ̀ hàn. Ohun tí wọ́n mọ̀ kò fara hàn nínú ẹsẹ yìí, ṣùgbọ́n ó tọ́ka sí ohun tó wà ní ẹsẹ tó ṣáájú; nítorí náà, ‘gbọ́ èyí’ jẹ́ Yorùbá àdánidá.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Èyí pa irú akọ púpọ̀ ti Gíríìkì mọ́. Ní inú Ìṣe, ó tún lè tọ́ka sí àwùjọ àwọn onígbàgbọ́ lápapọ̀; àlàyé ẹsẹ̀-isalẹ̀ sọ ìtumọ̀ yẹn.
- source_word: κατήγαγον
  choice: wọ́n mú un sọ̀ kalẹ̀ lọ
  rationale: Ìtumọ̀ yìí pa ìdarí ìrìn-àjò inú κατά- mọ́, ní pàtàkì bí wọ́n ṣe ń lọ sí agbègbè etíkun.
- source_word: Καισάρειαν
  choice: Kesaria
  rationale: Àkọsílẹ̀ orúkọ ìlú náà ní ọ̀nà tó wọ́pọ̀ nínú Yorùbá.
- source_word: ἐξαπέστειλαν
  choice: wọ́n rán an lọ
  rationale: Ó fi hàn pé wọ́n rán an kúrò ní Kesaria láti tẹ̀ síwájú lọ sí Tarsu, láìlo ọ̀rọ̀ líle tàbí àjèjì.
- source_word: Ταρσόν
  choice: Tarsu
  rationale: Àkọsílẹ̀ orúkọ ìlú náà ní ọ̀nà tó bá ìró Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nínú àwùjọ tí ó ṣeé ṣe kí ọkùnrin àti obìnrin wà
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Ọ̀rọ̀ inú àkọ́kọ́ jẹ́ akọ púpọ̀, nítorí náà a pa á mọ́ nínú ọ̀rọ̀ pàtàkì. Síbẹ̀, nítorí ó lè dúró fún àwùjọ àwọn onígbàgbọ́ lápapọ̀ ní àyíká yìí, a fi àlàyé sí ẹsẹ̀-isalẹ̀ láti pa ìtumọ̀ tó gbòòrò náà mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó lọ́lá, tó ṣe kedere, tí ó sì bá ọ̀rọ̀ ìtàn mu. A lo ‘sọ̀ kalẹ̀ lọ’ láti pa ìdarí ìrìn-àjò mọ́, a sì lo àwọn orúkọ ibi Kesaria àti Tarsu ní ìkọ̀wé Yorùbá.
