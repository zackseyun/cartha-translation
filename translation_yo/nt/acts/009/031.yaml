- from: Nítorí náà, ìjọ jákèjádò gbogbo Jùdíà, Gálílì àti Samáríà ní àlàáfíà, a sì ń gbé e ró[a]. Bí ó ti ń rìn nínú ìbẹ̀rù Olúwa àti nínú ìṣírí Ẹ̀mí Mímọ́[b], ó ń pọ̀ sí i.
  to: Nítorí náà, ìjọ jákèjádò gbogbo Jùdíà, Gálílì àti Samáríà ní àlàáfíà, a sì ń mú un lágbára[a]. Bí ó ti ń rìn nínú ìbẹ̀rù Olúwa àti nínú ìṣírí Ẹ̀mí Mímọ́[b], ó ń pọ̀ sí i.
  rationale: A rọ́pò ‘a sì ń gbé e ró’ pẹ̀lú ‘a sì ń mú un lágbára’ kí a lè sọ ìtumọ̀ οἰκοδομουμένη—ìjọ tí a ń fún ní ìmúlẹ̀ àti okun—ní Yorùbá tí ó ṣe kedere. A tún ṣàtúnṣe ọ̀rọ̀ àlàyé iyatọ̀ àfọwọ́kọ kí ó lè jẹ́ ìròyìn ìtàn-ọrọ tó péye. Àwọn ìyókù ti dúró gẹ́gẹ́ bí ìtumọ̀ orísun.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:16:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé SBLGNT dáadáa: ‘ìjọ’ jẹ́ ẹyọ kan, àwọn agbègbè mẹ́tẹ̀ẹ̀ta wà ní kíkún, àti àwọn ọ̀rọ̀-ìṣe ń ṣàfihàn ìṣe tí ń lọ lọwọlọwọ. Síbẹ̀, ‘a sì ń gbé e ró’ lè túmọ̀ sí gbígbé ìjọ náà sókè ní ti gidi, kì í sì ṣe àwòrán ìmúlẹ̀/ìfẹ̀sẹ̀mulẹ̀ ti οἰκοδομουμένη ní kedere.'
  naturalness: Èdè náà rọrùn, ó sì bójú mu fún Yorùbá òde òní. ‘A sì ń mú un lágbára’ jẹ́ ọ̀nà tí ó dáa síi láti sọ ìmọ̀ràn ìkọ́nilẹ́gbẹ́/ìmúlẹ̀ ìjọ, láì fa àwòrán gbígbé ohun kan sókè.
  terminology: ‘Ìjọ,’ ‘Olúwa,’ ‘Ẹ̀mí Mímọ́,’ àti ‘ìbẹ̀rù Olúwa’ jẹ́ àwọn ọ̀rọ̀ tó yẹ, tó sì bá ìlò Bíbélì Yorùbá mu. ‘Ìṣírí Ẹ̀mí Mímọ́’ jẹ́ yíyan tó bójú mu fún παράκλησις; àwọn ìtumọ̀ míràn yẹ kí wọ́n wà nínú àlàyé ìsàlẹ̀.
  issues:
