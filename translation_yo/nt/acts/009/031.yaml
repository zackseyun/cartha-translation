id: ACT.9.31
reference: Acts 9:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: yo
  text: Nítorí náà, ìjọ jákèjádò gbogbo Jùdíà, Gálílì àti Samáríà ní àlàáfíà, a sì ń mú un lágbára[a]. Bí ó ti ń rìn nínú ìbẹ̀rù Olúwa àti nínú ìṣírí Ẹ̀mí Mímọ́[b], ó ń pọ̀ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “àwọn ìjọ” dípò “ìjọ.”
    reason: textual_variant
  - marker: b
    text: Tàbí “ìtùnú” tàbí “ìgbaniníyànjú” Ẹ̀mí Mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: ìjọ
  rationale: Ọ̀rọ̀ Gíríìkì inú SBLGNT jẹ́ ẹyọ kan, ó sì ń tọ́ka sí ìjọ gẹ́gẹ́ bí odindi kan jákèjádò àwọn agbègbè mẹ́tẹ̀ẹ̀ta.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: jákèjádò gbogbo Jùdíà, Gálílì àti Samáríà
  rationale: ‘Jákèjádò’ fi ìtumọ̀ agbègbè ti κατά hàn, ‘gbogbo’ sì dúró fún ὅλης láì mú èdè Yorùbá le.
- source_word: εἶχεν εἰρήνην
  choice: ní àlàáfíà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìjọ wà ní ipò àlàáfíà, ó sì lè ní ìsinmi kúrò nínú inúnibíni nínú.
- source_word: οἰκοδομουμένη
  choice: a sì ń gbé e ró
  rationale: Ìṣẹ̀lẹ̀ tí ń bá a lọ àti ohun tí a ń ṣe sí ìjọ ni a pa mọ́; ‘gbé e ró’ tún mú àwòrán kíkọ́ ohun kan ró wà, bó tilẹ̀ jẹ́ pé ó túmọ̀ sí fífún ìjọ lókun ní àyíká yìí.
- source_word: πορευομένη
  choice: Bí ó ti ń rìn
  rationale: ‘Rìn’ pa àkàwé Gíríìkì mọ́, nígbà tí gbólóhùn náà ń tọ́ka sí ìwà àti ọ̀nà ìgbésí ayé ìjọ.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: nínú ìbẹ̀rù Olúwa
  rationale: A pa gbólóhùn Bíbélì náà mọ́ láì sọ ọ́ di ẹ̀rù lásán; ní àyíká yìí ó ní ìtumọ̀ ọ̀wọ̀ jíjinlẹ̀ àti ìgbọràn sí Olúwa.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: nínú ìṣírí Ẹ̀mí Mímọ́
  rationale: ‘Ìṣírí’ bá àyíká fífún ìjọ lókun àti ìdàgbàsókè mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ‘ìtùnú’ àti ‘ìgbaniníyànjú’ mọ́.
- source_word: ἐπληθύνετο
  choice: ó ń pọ̀ sí i
  rationale: Èyí sọ ìbísí tí ń bá a lọ ní Yorùbá àdánidá, ó sì jẹ́ kí ‘ìjọ’ ẹyọ kan máa bá a lọ gẹ́gẹ́ bí olùṣe.
theological_decisions:
- issue: Iye àti ìtọ́kasí ἐκκλησία
  choice: ‘ìjọ’ gẹ́gẹ́ bí odindi kan jákèjádò àwọn agbègbè náà
  alternative: ‘àwọn ìjọ’ gẹ́gẹ́ bí ó ṣe wà nínú àwọn àfọwọ́kọ kan
  rationale: Àkọsílẹ̀ SBLGNT tí a pèsè lo ẹyọ kan, àwọn ọ̀rọ̀-ìṣe àti àwọn ọ̀rọ̀ alábápín rẹ̀ sì tún jẹ́ ẹyọ kan. A fi ọ̀nà mìíràn sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ‘ìbẹ̀rù Olúwa’
  choice: ọ̀wọ̀ jíjinlẹ̀ sí Olúwa tí ó ń yọrí sí ìgbọràn
  alternative: ẹ̀rù tàbí ìpayà lásán
  rationale: A pa ọ̀rọ̀ orísun mọ́ kí ìjìnlẹ̀ ẹ̀kọ́ rẹ̀ má bàa di ìtumọ̀ kan ṣoṣo, ṣùgbọ́n àyíká kò béèrè pé kí a túmọ̀ rẹ̀ sí ìpayà.
- issue: Ìtumọ̀ παράκλησις ní ìbáṣepọ̀ pẹ̀lú Ẹ̀mí Mímọ́
  choice: ìṣírí
  alternative: ìtùnú tàbí ìgbaniníyànjú
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbígbòòrò. ‘Ìṣírí’ bá àyíká àlàáfíà, fífúnni lókun àti ìbísí mu, nígbà tí a pa àwọn ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àjùmọ̀lò òde òní ni a lò pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti yíyé fún òǹkàwé lasán. A pa àkàwé ‘rìn’ àti ‘gbé ró’ mọ́ níbi tí wọ́n ti ṣì yé dáadáa ní Yorùbá.
