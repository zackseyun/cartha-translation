source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: yo
  text: 'Bí ó ti ń ṣe ìrìn àjò, ó ṣẹlẹ̀ pé, bí ó ti ń sún mọ́ Damásíkù, lójijì ìmọ́lẹ̀ kan láti ọ̀run[a] tàn yí i ká.


    [a] Tàbí “láti ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì οὐρανός lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run,” ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí “ọ̀run” fi hàn pé Ọlọ́run ni orísun ìmọ́lẹ̀ náà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láti ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì οὐρανός lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run,” ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí “ọ̀run” fi hàn pé Ọlọ́run ni orísun ìmọ́lẹ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Bí ó ti ń rin ìrìn àjò lọ
  rationale: Ìtumọ̀ yìí fi hàn pé ìrìn àjò náà ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ náà ṣẹlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ articular infinitive pẹ̀lú ἐν ní Yorùbá.
- source_word: ἐγένετο
  choice: ó ṣẹlẹ̀ pé
  rationale: Ó pa àmì ìtàn Lúùkù mọ́, kò sì yọ ìmọ̀lára pé ìṣẹ̀lẹ̀ kan dé bá a kúrò.
- source_word: αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: ó ń sún mọ́ Damásíkù
  rationale: “Ń sún mọ́” pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì fi hàn pé ó sún mọ́ ìlú náà, kì í ṣe pé ó ti wọ inú rẹ̀.
- source_word: ἐξαίφνης τε
  choice: lójijì ... sì
  rationale: “Lójijì” mú ìṣẹ̀lẹ̀ òjijì náà jáde, “sì” sì so gbólóhùn náà mọ́ ohun tí ó ṣáájú.
- source_word: περιήστραψεν
  choice: kọ mànà yí i ká
  rationale: Ọ̀rọ̀ yìí ṣàfihàn ìmọ́lẹ̀ tí ó tàn lójijì, tí ó sì yí ẹni náà ká; “kọ mànà” jẹ́ ọ̀nà Yorùbá àdánidá fún ìtànná òjijì.
- source_word: φῶς
  choice: ìmọ́lẹ̀ kan
  rationale: “Kan” bá orúkọ tí kò ní article mu ní àyíká yìí, ó sì jẹ́ kí Yorùbá náà ṣe kedere.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Nínú ìṣẹ̀lẹ̀ ìfihàn bí èyí, “ọ̀run” pa ìtumọ̀ orísun àtọ̀runwá mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú àyíká ìfihàn
  choice: láti ọ̀run
  alternative: láti ojú ọ̀run
  rationale: Àyíká ìtàn náà tọ́ka sí ìpàdé àtọ̀runwá, nítorí náà “ọ̀run” ni ìtumọ̀ tí ó ṣeé ṣe jù; àlàyé ìsàlẹ̀ ojú ìwé sì pa àṣàyàn “ojú ọ̀run” mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó bójú mu, tí ó sì ṣeé yé fún òǹkàwé gbogbogbò ni a lò. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Semicolon ń mú ìtàn náà ṣe kedere láìsọ ìsopọ̀ àwọn gbólóhùn Gíríìkì di ohun mìíràn.
