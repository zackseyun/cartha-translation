  text: ἐγένετο ⸀δὲ ἡμέρας ἱκανὰς ⸀μεῖναι ἐν Ἰόππῃ παρά τινι Σίμωνι βυρσεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: yo
  text: Ó sì dúró ní Jọ́pà fún ọ̀pọ̀ ọjọ́ lọ́dọ̀ Símónì kan[a], ẹni tí ń rọ awọ ẹran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ilé Símónì kan.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà lè fi hàn pé ó ń gbé ní ilé ẹni náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: ó dúró
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà àsọyé Gíríìkì tí ó ń sọ pé Pétérù dúró síbẹ̀. Ṣíṣe ‘dúró’ ní ọ̀rọ̀-ìṣe pàtàkì jẹ́ èdè Yorùbá àdánidá, láìfi ‘ó sì ṣẹlẹ̀ pé’ kún un lọ́nà líle.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘sì’ bá ìṣàn ìtàn Yorùbá mu láìsọ ọ́ di ìtakora.
- source_word: ἡμέρας ἱκανὰς
  choice: fún ọ̀pọ̀ ọjọ́
  rationale: ἱκανὰς nínú gbólóhùn àsìkò yìí túmọ̀ sí ọjọ́ púpọ̀ tàbí iye ọjọ́ tí ó pọ̀ tó; ‘fún ọ̀pọ̀ ọjọ́’ ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: ἐν Ἰόππῃ
  choice: ní Jọ́pà
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi Ἰόππη ní ìbámu pẹ̀lú ìró rẹ̀ gẹ́gẹ́ bí ‘Jọ́pà,’ a sì lo ‘ní’ fún ibi.
- source_word: παρά τινι Σίμωνι
  choice: lọ́dọ̀ Símónì kan
  rationale: παρά pẹ̀lú dátífù lè tọ́ka sí dídúró pẹ̀lú ẹnì kan tàbí ní ilé rẹ̀. ‘Lọ́dọ̀ Símónì kan’ jẹ́ àdánidá, ó pa àìdánimọ̀ τινι mọ́, kò sì mú ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ ibi wọ̀nyí di dandan.
- source_word: βυρσεῖ
  choice: ẹni tí ń ṣe awọ ẹran
  rationale: βυρσεύς ni ẹni tí ń pèsè tàbí ń ṣiṣẹ́ awọ ẹran kí ó lè di awọ lílò. Àpèjúwe yìí yé òǹkàwé òde òní ju lílo orúkọ iṣẹ́ àtijọ́ ‘aláwọ̀’ láìsí àlàyé lọ.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ Jọ́pà àti Símónì. A lo gbólóhùn iṣẹ́ ‘ẹni tí ń ṣe awọ ẹran’ kí iṣẹ́ βυρσεύς lè yé òǹkàwé lónìí, ní ìforúkọsílẹ̀ tí ó bójú mu fún Ìwé Mímọ́.
