id: ACT.9.26
reference: Acts 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: yo
  text: Nígbà tí ó sì dé Jerusalẹmu, ó ń gbìyànjú láti dara pọ̀ mọ́ àwọn ọmọ-ẹ̀yìn[a]; ṣùgbọ́n gbogbo wọn ń bẹ̀rù rẹ̀, nítorí wọn kò gbàgbọ́ pé ọmọ-ẹ̀yìn ni òun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti fi ara rẹ̀ mọ́ àwọn ọmọ-ẹ̀yìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Nígbà tí ó dé
  rationale: Ọ̀rọ̀ àbọ̀ aorist yìí fi ipò àkókò tí ó ṣáájú ìṣe pàtàkì hàn; gbólóhùn náà jẹ́ ti Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe àtakò líle.
- source_word: εἰς Ἰερουσαλήμ
  choice: dé Jerusalẹmu
  rationale: Èyí sọ ìrìnàjò dé ìlú náà ní ọ̀nà Yorùbá tí ó bójú mu.
- source_word: ἐπείραζεν
  choice: ó ń gbìyànjú
  rationale: Àkókò imperfect fi ìgbìyànjú tí ń lọ lọ́wọ́ hàn, kì í ṣe ìdẹwò.
- source_word: κολλᾶσθαι
  choice: láti dara pọ̀ mọ́
  rationale: Ó mú ìtumọ̀ dídarapọ̀ tàbí fífi ara mọ́ ẹgbẹ́ kan jáde láìfi ètò ọmọ-ẹgbẹ́ ìjọ ti ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
- source_word: τοῖς μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún àwọn akẹ́kọ̀ọ́ àti olùtẹ̀lé Jésù.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: ṣùgbọ́n gbogbo wọn ń bẹ̀rù rẹ̀
  rationale: Ṣùgbọ́n fi ìyàtọ̀ tó wà láàárín ìgbìyànjú rẹ̀ àti ìhùwàsí wọn hàn ní Yorùbá àdánidá; ‘ń bẹ̀rù’ pa abala imperfect mọ́.
- source_word: μὴ πιστεύοντες
  choice: nítorí wọn kò gbà
  rationale: Ọ̀rọ̀ àbọ̀ náà sọ ìdí tí wọ́n fi bẹ̀rù rẹ̀; ìtumọ̀ oníṣe-okùnfà yìí ṣe kedere ní Yorùbá.
- source_word: ὅτι ἐστὶν μαθητής
  choice: pé ọmọ-ẹ̀yìn ni òun
  rationale: Ìṣètò gbólóhùn Yorùbá yìí pa ọ̀rọ̀ tí wọ́n kò gbà gbọ́ mọ́, láìfipá yan àkókò ‘is/was’ tí èdè Yorùbá kò nílò níbí.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tí Saulu ń wá pẹ̀lú àwọn onígbàgbọ́ ní Jerusalẹmu
  choice: láti dara pọ̀ mọ́ àwọn ọmọ-ẹ̀yìn
  alternative: láti fi ara rẹ̀ mọ́ àwọn ọmọ-ẹ̀yìn
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìfẹ́ rẹ̀ láti wà láàárín wọn kí wọ́n sì gbà á, kì í sọ ní pàtó nípa ètò ìforúkọsílẹ̀ ọmọ ìjọ tàbí àṣà mímọ́ kan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí àṣàyàn ọ̀rọ̀ náà kan.
