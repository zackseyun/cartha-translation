id: ACT.9.4
reference: Acts 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: yo
  text: Ó sì ṣubú lulẹ̀, ó gbọ́ ohùn kan tí ń sọ fún un pé, “Sáùlù, Sáùlù, èé ṣe tí ìwọ fi ń ṣe inúnibíni sí mi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: Ó sì ṣubú lulẹ̀
  rationale: Aorist participle πεσών and the directional phrase are rendered as a natural Yoruba sequential clause. “Ṣubú lulẹ̀” expresses falling to the ground without broadening γῆ to the whole earth.
- source_word: ἤκουσεν φωνὴν
  choice: ó gbọ́ ohùn kan
  rationale: Because the sound speaks intelligible words, φωνή is naturally “ohùn,” not merely an indistinct sound.
- source_word: λέγουσαν αὐτῷ
  choice: tí ń sọ fún un pé
  rationale: This relative construction naturally connects the voice with its direct speech while retaining the sense of speaking to Saul.
- source_word: Σαοὺλ Σαούλ
  choice: Sọ́ọ̀lù, Sọ́ọ̀lù
  rationale: The personal name is transliterated in a form natural to Yoruba orthography, and the emphatic repetition is preserved.
- source_word: τί
  choice: èé ṣe tí ... fi
  rationale: In this interrogative idiom τί asks for the reason; “èé ṣe tí ... fi” is the natural Standard Yoruba equivalent of “why.”
- source_word: με
  choice: mi
  rationale: The first-person direct object is retained without explanatory expansion, preserving the speaker’s identification with those being persecuted.
- source_word: διώκεις
  choice: ń ṣe inúnibíni sí
  rationale: In context διώκω denotes hostile persecution rather than neutral pursuit. The progressive marker “ń” reflects the ongoing force of the Greek present.
theological_decisions:
- issue: Ìdánimọ̀ ẹni tó ń sọ̀rọ̀ pẹ̀lú àwọn tí Sọ́ọ̀lù ń ṣe inúnibíni sí
  choice: A pa ọ̀rọ̀ tààrà “sí mi” mọ́ láìfi àlàyé kún un.
  alternative: Àwọn ìtumọ̀ àlàyé bí “sí àwọn ènìyàn mi” tàbí “sí àwọn ọmọlẹ́yìn mi.”
  rationale: Ọ̀rọ̀ Gíríìkì fi ẹni tó ń sọ̀rọ̀ hàn gẹ́gẹ́ bí ẹni tí inúnibíni náà kàn fúnra rẹ̀. Ìtumọ̀ náà yẹ kí ó pa agbára ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyanju rẹ̀ pẹ̀lú àfikún.
translation_notes:
  register: Yorùbá Àfẹnusọ tí ó bójú mu, tí ó ní àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà jẹ́ ti ìgbàlódé, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo “ìwọ” fún ìtẹnumọ́ inú ìbéèrè náà.
