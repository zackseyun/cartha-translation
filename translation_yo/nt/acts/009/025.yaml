  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn èrò pàtàkì inú Gíríìkì mọ́: ìyípadà δέ, “àwọn ọmọ-ẹ̀yìn rẹ̀,” àkókò òru, ìsàlẹ̀ náà, ọ̀nà “gba inú ògiri,” àti agbọ̀n ńlá. Síbẹ̀, ìtòlẹ́sẹẹsẹ “sọ̀ ọ́ kalẹ̀ gba inú ògiri ní agbọ̀n” lè jẹ́ kí “ní agbọ̀n” dà bí ibi tí ìṣe náà ṣẹlẹ̀ dípò ohun èlò/àpótí tí wọ́n fi sọ ọ́ kalẹ̀. Fífi “fi agbọ̀n” sí iwájú mú ìbáṣepọ̀ náà hàn kedere láì fi ohunkóhun kún orísun.'
  naturalness: '“Fi agbọ̀n ńlá kan sọ̀ ọ́ kalẹ̀” jẹ́ Yorùbá boṣewa tó rọrùn, tó sì ṣe kedere ju “sọ̀ ọ́ kalẹ̀ ... ní agbọ̀n” lọ nínú àyíká yìí. Àlàyé [a] náà tún nílò ìtúnṣe kékeré: “gba ojú kan nínú ògiri” kì í ṣe ọ̀nà Yorùbá tó dára fún “through an opening in the wall.”'
  terminology: “Àwọn ọmọ-ẹ̀yìn rẹ̀,” “ní òru,” “sọ̀ ọ́ kalẹ̀,” àti “agbọ̀n ńlá” yẹ, wọ́n sì bá ìforúkọsílẹ̀ ìtàn mímọ́ Yorùbá mu. A ti pa àìdánilójú nípa bí “gba inú ògiri” ṣe lè tọ́ka sí ihò tàbí ojú fèrèsé mọ́ nínú àlàyé, láì sọ pé orísun náà fúnra rẹ̀ darukọ wọn.
