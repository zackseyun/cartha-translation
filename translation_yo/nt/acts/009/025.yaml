translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà ni a lò níbi tó yẹ. A pa “àwọn ọmọ-ẹ̀yìn rẹ̀” àti ìtumọ̀ gangan “gba inú ògiri” mọ́, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé ohun tí gbólóhùn náà lè túmọ̀ sí.
