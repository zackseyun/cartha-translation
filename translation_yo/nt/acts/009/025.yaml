source:
  edition: SBLGNT
  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ̀ mú un ní òru, wọ́n sì fi agbọ̀n ńlá kan sọ̀ ọ́ kalẹ̀ gba inú ògiri[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ihò tàbí ojú fèrèsé kan nínú ògiri.” Gíríìkì sọ ní tààrà pé “gba inú ògiri”; ó ṣeé ṣe kó ń tọ́ka sí ihò tàbí ojú fèrèsé kan nínú ògiri ìlú.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì lo ọ̀rọ̀ méjì tó ní í ṣe pẹ̀lú sísọ kalẹ̀ (“wọ́n sọ̀ ọ́ kalẹ̀” àti “nígbà tí wọ́n ń sọ ọ́ kalẹ̀”); àkójọpọ̀ ọ̀rọ̀ yìí tẹnu mọ́ ọ̀nà ìgbàsálà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: mú un
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n gba Sọ́ọ̀lù sí ọwọ́ láti ràn án lọ́wọ́ láti sá; “mú un” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àmì ìyípadà kékeré tó tún fi ìṣe àwọn ọmọ-ẹ̀yìn yàtọ̀ sí ìdìtẹ̀ tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí pa αὐτοῦ mọ́ gẹ́gẹ́ bí “rẹ̀,” ó sì lo ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún μαθηταί.
- source_word: νυκτός
  choice: ní òru
  rationale: Genitive àkókò náà túmọ̀ sí pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní àkókò òru; “ní òru” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: διὰ τοῦ τείχους
  choice: gba inú ògiri
  rationale: διά pẹ̀lú genitive tọ́ka sí lílọ la ohun kan kọjá. Gíríìkì sọ ní tààrà pé “gba inú ògiri,” láì sọ “ojú fèrèsé” tàbí “ihò” ní kedere.
- source_word: καθῆκαν αὐτόν
  choice: wọ́n sì sọ̀ ọ́ kalẹ̀
  rationale: καθίημι níbí túmọ̀ sí sísọ ẹnì kan kalẹ̀ láti ibi gíga; gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá ọ̀nà ìgbàsálà náà mu.
- source_word: χαλάσαντες
  choice: sọ̀ ọ́ kalẹ̀
  rationale: Participle yìí tún ṣàpèjúwe bí wọ́n ṣe sọ̀ ọ́ kalẹ̀. A kò tún un ṣe nínú gbólóhùn àkọ́kọ́ kí Yorùbá lè dùn, ṣùgbọ́n àlàyé ìsàlẹ̀ [b] pa àtúnwí aláwòrán inú Gíríìkì mọ́.
- source_word: ἐν σπυρίδι
  choice: ní agbọ̀n ńlá kan
  rationale: σπυρίς jẹ́ agbọ̀n, ó sábà sì máa ń jẹ́ èyí tó tóbi; fífi “ńlá” kún un bá ohun èlò tó lè gba ọkùnrin kan mu.
