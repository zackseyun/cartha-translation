language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: yo
  text: Ní Jọ́pà, ọmọ-ẹ̀yìn obìnrin kan wà tí orúkọ rẹ̀ ń jẹ́ Tábítà[a], tí a túmọ̀ sí Dọ́kásì. Ó kún fún àwọn iṣẹ́ rere àti àwọn iṣẹ́ àánú tí ó máa ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dọ́kásì ni orúkọ Gíríìkì tí ó bá Tábítà mu; ìtumọ̀ orúkọ náà ni “àgbọ̀nrín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: ọmọ-ẹ̀yìn obìnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ́ abo ní pàtó; fífi “obìnrin” kún un mú ìtumọ̀ yẹn hàn ní Yorùbá láìsí àìmọ̀ye.
- source_word: ὀνόματι Ταβιθά
  choice: orúkọ rẹ̀ sì ń jẹ́ Tábítà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan ní orúkọ kan.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: tí a bá túmọ̀ orúkọ náà, Dọ́kásì ni a ń pè é
  rationale: Ó pa ìṣe títúmọ̀ orúkọ Sẹ́mítì náà sí orúkọ Gíríìkì mọ́, kì í sì í sọ ọ́ di ìtumọ̀ ọ̀rọ̀ lásán.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: Ó kún fún iṣẹ́ rere
  rationale: Ó jẹ́ ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐλεημοσυνῶν
  choice: iṣẹ́ àánú
  rationale: Ó lè tọ́ka sí fífún aláìní ní nǹkan, ṣùgbọ́n “iṣẹ́ àánú” pa ààyè ìtumọ̀ rẹ̀ mọ́ láìfi sí ọrẹ owó nìkan.
- source_word: ὧν ἐποίει
  choice: tí ó máa ń ṣe
  rationale: “Máa ń” fi ìṣe tí ó jẹ́ àṣà tàbí tí ń bá a lọ hàn, gẹ́gẹ́ bí imperfect ἐποίει.
- source_word: δέ
  choice: sì
  rationale: A lo àsopọ̀ Yorùbá kékeré láti fi ìlọsíwájú ìtàn hàn, láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: Ἐν Ἰόππῃ
  choice: Ní Jọ́pà
  rationale: Ìtumọ̀ ibi tí ó rọrùn, pẹ̀lú àkọsílẹ̀ orúkọ ìlú ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ μαθήτρια, akọ́ abo ọ̀rọ̀ “ọmọ-ẹ̀yìn”
  choice: ọmọ-ẹ̀yìn obìnrin
  alternative: ọmọ-ẹ̀yìn
  rationale: Yorùbá “ọmọ-ẹ̀yìn” kò fi akọ tàbí abo hàn fúnra rẹ̀; “obìnrin” jẹ́ kí ẹ̀rí akọ́ abo tí Gíríìkì sọ ní pàtó hàn gbangba.
- issue: Ìwọ̀n ìtumọ̀ ἐλεημοσυνῶν
  choice: iṣẹ́ àánú
  alternative: fífúnni ní ọrẹ àánú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífún àwọn aláìní ní nǹkan ní pàtó, ṣùgbọ́n ní àyíká yìí ó tún ṣàpèjúwe ìṣe ìtọ́jú oníàánú; a pa ìwọ̀n méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “máa ń ṣe” láti fi ìṣe àṣà tí ń bá a lọ hàn.
