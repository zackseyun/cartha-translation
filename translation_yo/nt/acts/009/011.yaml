id: ACT.9.11
reference: Acts 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: yo
  text: Olúwa sì sọ fún un pé, “Dìde, kí o lọ sí òpópónà tí a ń pè ní Títọ́, kí o sì wá ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Saulu, ará Tarsu[a], ní ilé Judasi, nítorí, wò ó, ó ń gbàdúrà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Saulu ti Tarsu.” Ajẹtífù Gíríìkì Ταρσέα fi hàn pé Tarsu ni ibi tí Saulu ti wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Ó jẹ́ orúkọ oyè Yorùbá tí ó bójú mu fún κύριος, ó sì pa ọlá àti àṣẹ ẹni tí ń sọ̀rọ̀ mọ́ láìfi ‘Jésù’ kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
- source_word: Ἀναστὰς πορεύθητι
  choice: Dìde, kí o lọ
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi àṣẹ hàn pé kí Anania dìde kí ó sì bẹ̀rẹ̀ ìrìn rẹ̀; èdè Yorùbá yìí jẹ́ ti àdánidá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: ῥύμην
  choice: òpópónà
  rationale: Ní àyíká ìlú, ῥύμη túmọ̀ sí òpópónà tàbí ojú ọ̀nà; ‘òpópónà’ ṣe kedere sí òǹkàwé òde òní.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: tí a ń pè ní Títọ́
  rationale: Εὐθεῖαν ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ òpópónà; ‘Títọ́’ pa ìtumọ̀ orúkọ Gíríìkì náà mọ́.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: ní ilé Judasi
  rationale: Gbólóhùn yìí tọ́ka sí ibi tí Anania yóò ti wá Saulu; ‘ní ilé Judasi’ jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì péye.
- source_word: ζήτησον
  choice: wá
  rationale: Nínú àyíká yìí ζητέω túmọ̀ sí láti wá ẹni kan; ‘wá’ kò sọ pé ó ti rí i, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Saulu, ará Tarsu
  rationale: ‘Tí orúkọ rẹ̀ ń jẹ́ Saulu’ ṣàfihàn ὀνόματι, ‘ará Tarsu’ sì fi hàn pé Tarsu ni ìlú ìbílẹ̀ rẹ̀, bí ajẹtífù Ταρσέα ṣe túmọ̀ sí.
- source_word: ἰδοὺ γὰρ
  choice: nítorí, wò ó
  rationale: ‘Nítorí’ pa ipa γάρ gẹ́gẹ́ bí ìdí mọ́, ‘wò ó’ sì pe àfiyèsí sí ohun tí ó tẹ̀ lé, gẹ́gẹ́ bí ἰδού.
- source_word: προσεύχεται
  choice: ó ń gbàdúrà
  rationale: Àmì ìṣe ‘ń’ fi hàn pé Saulu wà nínú gbígbàdúrà ní àkókò náà, ó sì bá àsìkò ọ̀rọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí ‘Olúwa’ nìkan.
  alternative: ‘Olúwa Jésù’
  rationale: Àyíká ìtàn náà fi ẹni tí ń sọ̀rọ̀ hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ ní κύριος nìkan. Ìtumọ̀ náà kò fi ìdánimọ̀ tí a kò sọ ní gbangba kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu, a sì lo ‘Judasi,’ ‘Saulu,’ àti ‘Tarsu’ gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ nínú Yorùbá.
