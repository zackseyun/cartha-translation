language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: yo
  text: Ṣùgbọ́n Ṣọ́ọ̀lù dìde kúrò ní ilẹ̀; bí ó tilẹ̀ jẹ́ pé ojú rẹ̀ ṣí, kò rí ohunkóhun.[a] Wọ́n dì í lọ́wọ́, wọ́n sì mú un wọ ìlú Damásíkù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki, “nígbà tí ojú rẹ̀ ti ṣí, kò rí ohunkóhun.” Ìṣètò ọ̀rọ̀ Gíríìkì tẹnu mọ́ ohun tó yani lẹ́nu pé ojú rẹ̀ ṣí, síbẹ̀ kò ríran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: dìde
  rationale: Ní àyíká ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé Ṣọ́ọ̀lù dìde níbi tí ó ti ṣubú sílẹ̀; “dìde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì bá ìṣe náà mu.
- source_word: ἀπὸ τῆς γῆς
  choice: kúrò nílẹ̀
  rationale: γῆ ń tọ́ka sí ilẹ̀ tí Ṣọ́ọ̀lù ṣubú lé, kì í ṣe ayé lápapọ̀ tàbí ilẹ̀ agbègbè kan.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: bí ó tilẹ̀ jẹ́ pé ojú rẹ̀ là
  rationale: 'Gbólóhùn yìí fi ìyàtọ̀ tó yani lẹ́nu hàn: ojú rẹ̀ là, síbẹ̀ kò lè ríran. Ìtumọ̀ yìí mú ipò àfikún àti ìtakora inú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.'
- source_word: οὐδὲν ἔβλεπεν
  choice: kò rí ohunkóhun
  rationale: Èyí sọ àìríran rẹ̀ pátápátá ní ọ̀nà tó ṣe déédé pẹ̀lú Gíríìkì, tí ó sì mọ́gbọ́n dání ní Yorùbá.
- source_word: χειραγωγοῦντες
  choice: wọ́n dìímú lọ́wọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ní pàtó pé wọ́n mú ọwọ́ rẹ̀ láti ṣamọ̀nà rẹ̀; “dìímú lọ́wọ́” pa àwòrán gidi yẹn mọ́.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: wọ́n mú un wọ ìlú Damásíkù
  rationale: εἰσάγω túmọ̀ sí mímú tàbí ṣíṣamọ̀nà ẹni wọ inú ibi kan. Fífì “mú un wọ” hàn yàgò fún àtúnṣe ọ̀rọ̀ lẹ́yìn tí a ti sọ pé wọ́n dìímú lọ́wọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n / Nítorí náà / sì
  rationale: Àwọn δέ mẹ́ta ń mú ìtàn tẹ̀ síwájú, wọ́n sì ń fi ìtakora kékeré tàbí àsopọ̀ hàn. Yorùbá kò béèrè pé kí a tú gbogbo wọn ní ọ̀nà kan náà; àwọn àsopọ̀ tí a yàn bá ìṣàn ìtàn mu.
- source_word: Σαῦλος
  choice: Ṣọ́ọ̀lù
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀.
- source_word: Δαμασκόν
  choice: Damásíkù
  rationale: A ṣe àkọsílẹ̀ orúkọ ìlú náà ní ọ̀nà tí ó bá èdè Yorùbá àti ìpè rẹ̀ mu.
