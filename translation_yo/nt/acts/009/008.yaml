translation_notes:
  register: Èdè Yorùbá tó ṣe déédé, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá ẹ̀dá èdè mu, a sì pa ìyàtọ̀ láàárín ojú tí ó là àti àìríran mọ́.
