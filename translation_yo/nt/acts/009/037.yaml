id: ACT.9.37
reference: Acts 9:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: yo
  text: Ní àwọn ọjọ́ náà, ó ṣẹlẹ̀ pé ó ṣàìsàn, ó sì kú. Lẹ́yìn tí wọ́n wẹ̀ ẹ́, wọ́n gbé e sínú yàrá kan lókè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú yàrá òkè kan.” Ọ̀rọ̀ Gíríìkì náà kàn ń tọ́ka sí yàrá kan ní ilẹ̀ òkè ilé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ó ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà ìtàn tí ó wọ́pọ̀ fún fífi ìṣẹ̀lẹ̀ tuntun hàn; ó bójú mu èdè Yorùbá òde òní láì lo gbólóhùn àtijọ́.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Ní àwọn ọjọ́ náà
  rationale: Ó pa ìtọ́kasí sí àkókò tí a ti mẹ́nu kàn mọ́, ó sì tẹ̀ lé ìtumọ̀ Gíríìkì ní ti ara.
- source_word: ἀσθενήσασαν
  choice: ó ṣàìsàn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àìsàn tí ó ṣáájú ikú, kì í ṣe àìlera lásán.
- source_word: ἀποθανεῖν
  choice: ó sì kú
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ infinitive, gbólóhùn olódì ní Yorùbá ni ó fi ìtumọ̀ àti ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá.
- source_word: λούσαντες
  choice: Lẹ́yìn tí wọ́n wẹ̀ ẹ́
  rationale: Ó fi hàn pé fífọ ara rẹ̀ ṣẹlẹ̀ lẹ́yìn ikú ṣùgbọ́n ṣáájú gbígbé e sí yàrá; àyíká náà fi hàn pé òkú rẹ̀ ni wọ́n wẹ̀.
- source_word: ἔθηκαν αὐτὴν
  choice: wọ́n tẹ́ ẹ sílẹ̀
  rationale: Yíyan ọ̀rọ̀ yìí mú ìṣe títẹ́ ara ẹni tí ó ti kú sílẹ̀ jáde dáadáa ju ọ̀rọ̀ gbogbogbò bí ‘fi sí’ lọ.
- source_word: ἐν ὑπερῴῳ
  choice: nínú yàrá kan lókè
  rationale: ὑπερῷον ń tọ́ka sí yàrá ní ilẹ̀ òkè ilé; àìsí article pàtó nínú Gíríìkì kò béèrè pé kí a mú un bí yàrá pàtó kan.
theological_decisions:
- issue: Bóyá ὑπερῴῳ yẹ kí ó dà bí orúkọ yàrá pàtó kan tàbí bí àpèjúwe ibi kan
  choice: nínú yàrá kan lókè
  alternative: nínú yàrá òkè náà
  rationale: Gíríìkì kò lo article pàtó níhìn-ín, nítorí náà a kò yẹ kí ìtumọ̀ fi hàn pé yàrá olókìkí tàbí yàrá pàtó kan ni. Àpèjúwe ibi tí kò ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àfikún ni a yàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn níbi tí ó ti yẹ. A kò túmọ̀ δὲ àkọ́kọ́ pẹ̀lú ọ̀rọ̀ ìyípadà àfikún, nítorí gbólóhùn àkókò ti ń darí ìtàn náà lọ́nà àdánidá; ìtẹ̀síwájú lẹ́yìn náà hàn nínú ‘Lẹ́yìn tí.’ Àmì àlàyé [a] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí ó ń ṣàlàyé, kì í ṣe lẹ́gbẹ̀ẹ́ fífọ ara rẹ̀.
