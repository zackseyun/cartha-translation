id: ACT.9.1
reference: Acts 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: yo
  text: Ṣùgbọ́n Sáúlù ṣì ń mí èémí ìhalẹ̀ àti ìpànìyàn[a] sí àwọn ọmọ-ẹ̀yìn Olúwa; ó sì lọ bá olórí àlùfáà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpakúpa.” Ọ̀rọ̀ Gíríìkì φόνος lè túmọ̀ sí pípa ènìyàn tàbí ìpànìyàn. A yan “ìpànìyàn” nítorí pé ó mú ìwúwo ìwà búburú inú ọ̀rọ̀ náà jáde, nígbà tí “ìpakúpa” ń fi ọ̀nà ìtumọ̀ àṣà kan hàn nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn, ó sì dá ìtàn padà sí ọ̀dọ̀ Sáúlù lẹ́yìn ohun tí ó ṣẹlẹ̀ ṣáájú.
- source_word: ἔτι
  choice: ṣì
  rationale: Ó fi hàn pé ìwà ọ̀tá Sáúlù ń bá a lọ láti inú àyíká ọ̀rọ̀ tí ó ṣáájú.
- source_word: ἐμπνέων
  choice: ń mí èémí
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé ìhalẹ̀ àti ìpànìyàn dà bí èémí tí Sáúlù ń mí, ó sì jẹ́ ọ̀rọ̀ tí ó yéni ní Yorùbá.
- source_word: ἀπειλῆς
  choice: ìhalẹ̀
  rationale: Ó túmọ̀ ìdẹ́rùbà tàbí ọ̀rọ̀ ọ̀tá tí a fi ń halẹ̀ mọ́ ẹlòmíràn.
- source_word: φόνου
  choice: ìpànìyàn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí pípa ènìyàn tàbí ìpànìyàn; “ìpànìyàn” mú ìwúwo ìwà búburú inú ọ̀rọ̀ náà jáde láì kọjá ìtumọ̀ rẹ̀.
- source_word: εἰς τοὺς μαθητὰς
  choice: sí àwọn ọmọ-ẹ̀yìn
  rationale: Pẹ̀lú ìhalẹ̀ àti ìpànìyàn, “sí” fi ibi tí ìwà ọ̀tá Sáúlù dojú kọ hàn ní ọ̀nà àdánidá.
- source_word: μαθητὰς
  choice: ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún àwọn tí wọ́n ń tẹ̀ lé olùkọ́ tàbí olúwa wọn.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Ó bá ìlò κύριος fún Jésù nínú àyíká Lúùkù–Ìṣe mu, ó sì fi hàn pé àwọn ọmọ-ẹ̀yìn náà jẹ́ ti Olúwa.
- source_word: προσελθὼν
  choice: ó sì lọ bá
  rationale: Ìṣe alábàápín aorist náà ṣáájú ìbéèrè tí ẹsẹ tó tẹ̀ lé sọ; “lọ bá” sọ ìtọ̀sí ẹni náà ní Yorùbá àdánidá, ó sì jẹ́ kí ẹsẹ yìí dúró gẹ́gẹ́ bí gbolohun.
- source_word: ἀρχιερεῖ
  choice: olórí àlùfáà
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere fún àlùfáà tó ga jù lọ ní ipò.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú τοῦ κυρίου
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyíká yìí, κύριος ń tọ́ka sí Jésù; “Olúwa” ni ọ̀rọ̀ ìbílẹ̀ tó yẹ, tí kò sì mú ìtumọ̀ ẹ̀kọ́ ìsìn àfikún wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó ṣe kedere fún òǹkàwé gbogbogbò. A pa àwòrán “mí èémí” mọ́ nítorí agbára rẹ̀, a sì lo àmì ohùn níbi tí ó bá yẹ.
