revisions:
- from: Pétérù sì sọ fún un pé, “Anáníà, Jésù Mèsáyà mú ọ lára dá. Dìde, kí o sì tẹ́ ibùsùn rẹ fúnra rẹ.” Lójú ẹsẹ̀, ó sì dìde.
  to: Pétérù sì sọ fún un pé, “Ẹnéà, Jésù Mèsáyà mú ọ láradá. Dìde, kí o sì tẹ́ ibùsùn fún ara rẹ.” Lẹ́sẹ̀kẹsẹ̀, ó sì dìde.
  rationale: The revision corrects the mistaken personal name and makes minor idiomatic improvements while retaining the Greek present “heals,” the titular sense of Χριστός as Mèsáyà, the reflexive element in the bedding command, and the immediacy of εὐθέως. No footnote is required in Yoruba for this verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's speech, the present-tense healing declaration, the command to rise and prepare bedding, and the immediate response. However, it substitutes Ananias (Anáníà), a different person, for Αἰνέα (Aeneas), which is a material source-fidelity error.
  naturalness: The revised wording uses idiomatic Standard Yoruba. “mú ọ láradá” is written as the established compound expression, and “tẹ́ ibùsùn fún ara rẹ” naturally expresses the reflexive force of σεαυτῷ without the awkward double possessive/reflexive phrasing.
  terminology: Mèsáyà appropriately renders Χριστός as a title. The personal name is corrected to Ẹnéà, rather than Anáníà.
  issues:
  - severity: high
    issue: Αἰνέα is rendered “Anáníà.”
    rationale: Ananias and Aeneas are distinct names and persons in Acts. The Greek vocative Αἰνέα must be represented as Aeneas/Ẹnéà, not Ananias.
  - severity: low
    issue: “mú ọ lára dá” is nonstandardly separated.
    rationale: The usual Yoruba healing expression is written “mú ẹni láradá.”
  - severity: low
    issue: “ibùsùn rẹ fúnra rẹ” is stylistically awkward for the reflexive dative.
    rationale: “fún ara rẹ” directly and naturally conveys “for yourself,” while avoiding redundant possessive and emphatic forms.
  revised_text: Pétérù sì sọ fún un pé, “Ẹnéà, Jésù Mèsáyà mú ọ láradá. Dìde, kí o sì tẹ́ ibùsùn fún ara rẹ.” Lẹ́sẹ̀kẹsẹ̀, ó sì dìde.
  revised_footnotes: []
  revision_rationale: The revision corrects the mistaken personal name and makes minor idiomatic improvements while retaining the Greek present “heals,” the titular sense of Χριστός as Mèsáyà, the reflexive element in the bedding command, and the immediacy of εὐθέως. No footnote is required in Yoruba for this verse.
