id: ACT.9.34
reference: Acts 9:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: yo
  text: Pétérù sì sọ fún un pé, “Ẹnéà, Jésù Mèsáyà mú ọ láradá. Dìde, kí o sì tẹ́ ibùsùn fún ara rẹ.” Lẹ́sẹ̀kẹsẹ̀, ó sì dìde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνέα
  choice: Anáníà
  rationale: A lo ìrísí orúkọ yìí tí ó wọ́pọ̀ nínú Bíbélì Yorùbá fún Aeneas, pẹ̀lú àmì ohùn.
- source_word: ἰᾶταί
  choice: mú ọ lára dá
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà ń kéde ìwòsàn ní ti gidi; ‘mú ọ lára dá’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi tipátipá sọ pé ìṣe náà ń lọ lọ́wọ́ tàbí pé ó ti parí ṣáájú.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín, Χριστός jẹ́ oyè Jésù; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò lílò ‘Kristi’ bí ẹni pé ó jẹ́ apá kan orúkọ.
- source_word: ἀνάστηθι
  choice: Dìde
  rationale: Àṣẹ kedere, àdánidá ní Yorùbá fún ẹni tí ó ti dùbúlẹ̀.
- source_word: στρῶσον σεαυτῷ
  choice: tẹ́ ibùsùn rẹ fúnra rẹ
  rationale: στρώννυμι túmọ̀ sí títẹ́ tàbí ṣíṣe ohun ìtẹ́ sílẹ̀; ‘fúnra rẹ’ pa σεαυτῷ mọ́, ó sì tẹnu mọ́ agbára tí ẹni tí a mú lára dá tún ní.
- source_word: εὐθέως
  choice: Lójú ẹsẹ̀
  rationale: Gbólóhùn Yorùbá àdánidá fún ìṣe tí ó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: ἀνέστη
  choice: ó dìde
  rationale: Ó tún ọ̀rọ̀ àṣẹ ‘Dìde’ sọ ní ìròyìn, ó sì fi àbájáde ìwòsàn hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìkéde ìwòsàn
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός ń ṣiṣẹ́ bí oyè níhìn-ín. ‘Jésù Mèsáyà’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ oyè náà mọ́ láìfi àpilẹ̀kọ Gẹ̀ẹ́sì tí èdè Yorùbá kò nílò kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ibùsùn’ gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò fún ohun ìtẹ́ ẹni náà, láìdá irú rẹ̀ pàtó.
