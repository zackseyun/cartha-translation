  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: yo
  text: Ó sì wà fún ọjọ́ mẹ́ta láì ríran[a]; kò jẹun, kò sì mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà sí i, “kò ríran.” Gbólóhùn náà fi hàn pé Saulu kò lè ríran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Ó sì wà fún ọjọ́ mẹ́ta
  rationale: Àkúsatífù náà ń fi gígùn àkókò hàn; ‘fún ọjọ́ mẹ́ta’ jẹ́ ọ̀nà àdánidá ní Yorùbá, ‘ó sì wà’ sì pa ìtumọ̀ ἦν mọ́ láì fi ‘ó dúró’ kún un.
- source_word: μὴ βλέπων
  choice: láì ríran
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘láì ríran.’ Ó jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún fífi ajẹtífù tó lágbára jù, bí ‘afọ́jú,’ sínú ọ̀rọ̀ pàtàkì.
- source_word: οὐκ ἔφαγεν
  choice: kò jẹun
  rationale: ἔφαγεν túmọ̀ sí ‘jẹ’; ‘jẹun’ ni ìlò Yorùbá tó wọ́pọ̀ fún jíjẹ oúnjẹ ní àyíká yìí.
- source_word: οὐδὲ ἔπιεν
  choice: bẹ́ẹ̀ ni kò mu omi
  rationale: οὐδὲ so ìṣe kejì tí a sẹ́ mọ́ ti àkọ́kọ́. ‘Bẹ́ẹ̀ ni kò…’ jẹ́ ìsopọ̀ Yorùbá tó ṣe kedere; ‘mu omi’ níbí ń sọ mímu ohun mímu lápapọ̀, gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
theological_decisions: []
