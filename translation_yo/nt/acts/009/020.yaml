  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó ń kéde Jésù nínú àwọn sínágọ́gù pé òun ni Ọmọ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀-ìṣe náà sí, “ó bẹ̀rẹ̀ sí í kéde Jésù” tàbí “ó kéde Jésù.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ ìpolongo ní gbangba, ó sì wà ní àkókò imperfect.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti àìní ìdádúró tí ọ̀rọ̀ Gíríìkì náà ní hàn ní Yorùbá àdánidá.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nínú àwọn sínágọ́gù
  rationale: Ó pa ìtumọ̀ ibi àti ọ̀pọ̀ sínágọ́gù mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐκήρυσσεν
  choice: ó bẹ̀rẹ̀ sí í kéde
  rationale: “Kéde” mú ìtumọ̀ ìpolongo ní gbangba jáde; “bẹ̀rẹ̀ sí í” bá ipa ìtàn lẹ́yìn εὐθέως mu, bí ó tilẹ̀ jẹ́ pé imperfect náà tún lè túmọ̀ sí ìṣe tí ń lọ lọ́wọ́.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: A pa Jésù mọ́ gẹ́gẹ́ bí ohun tààrà tí a ń kéde, láì fi “nípa” kún un.
- source_word: ὅτι οὗτός ἐστιν
  choice: pé òun ni
  rationale: “Pé” ṣàgbékalẹ̀ àkóónú ìkéde; “òun ni” fi ìtẹnumọ́ ìdánimọ̀ οὗτός hàn ní Yorùbá tó ń ṣàn dáadáa.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tí ó sì pa ìwúwo orúkọ oyè Kristi náà mọ́.
theological_decisions:
- issue: Orúkọ oyè Kristi nínú ìkéde Saulu
  choice: Ọmọ Ọlọ́run
  alternative: Ọmọ ti Ọlọ́run
  rationale: “Ọmọ Ọlọ́run” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ὁ υἱὸς τοῦ θεοῦ, láì dín tàbí fa ẹ̀kọ́ inú gbólóhùn náà sí i.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Sínágọ́gù” ni a lò fún ibi ìjọsìn àwọn Júù; “kéde” yàgò fún ìtumọ̀ ṣọ́ọ̀ṣì tó lè wà nínú “wàásù.”
