source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: yo
  text: Ó sì ń sọ̀rọ̀, ó sì ń bá àwọn Júù tí ń sọ èdè Gíríìkì[a] jiyàn; ṣùgbọ́n wọ́n ń gbìyànjú láti pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “àwọn Hẹ́lẹ́nístì,” ìyẹn ni, àwọn Júù tí ń sọ èdè Gíríìkì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: ń sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ó ń bá a lọ tàbí pé ó máa ń ṣe é léraléra; “ń sọ̀rọ̀” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τε καὶ
  choice: ó sì ... ó sì
  rationale: Ètò yìí so àwọn ìṣe méjèèjì pọ̀ ní Yorùbá láì fi ìtẹnumọ́ tí kò sí nínú orísun kún un.
- source_word: συνεζήτει
  choice: ń bá ... jiyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìjíròrò tí àríyànjiyàn wà nínú rẹ̀, kì í ṣe ìfọ̀rọ̀wérọ̀ lásán; “jiyàn” bá ọ̀rọ̀ tí ó tẹ̀ lé nípa ìṣòdì mu.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: ń bá àwọn Júù tí ń sọ èdè Gíríìkì jiyàn
  rationale: πρός pẹ̀lú ọ̀rọ̀-ìṣe ìjíròrò ń fi àwọn tí a ń bá sọ̀rọ̀ hàn. Nínú Ìṣe Àwọn Àpọ́sítélì, Ἑλληνισταί tọ́ka sí àwọn Júù tí èdè Gíríìkì jẹ́ èdè wọn.
- source_word: Ἑλληνιστάς
  choice: àwọn Júù tí ń sọ èdè Gíríìkì
  rationale: Ìtumọ̀ ṣókí yìí ṣe àlàyé ẹgbẹ́ èdè àti àṣà tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí, ó sì yé òǹkàwé Yorùbá òde òní ju lílo ọ̀rọ̀ àyálò lọ.
- source_word: οἱ δὲ
  choice: ṣùgbọ́n wọ́n
  rationale: δέ yí ọ̀rọ̀ padà sí ìṣòdì wọn sí Sáùlù; “ṣùgbọ́n” mú ìyàtọ̀ yẹn hàn kedere.
- source_word: ἐπεχείρουν
  choice: ń gbìyànjú
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìsapá tí ó ń bá a lọ hàn; “ń gbìyànjú” pa apá yẹn mọ́.
- source_word: ἀνελεῖν αὐτόν
  choice: láti pa á
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἀναιρέω túmọ̀ sí pípa ènìyàn; “láti pa á” jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
theological_decisions:
- issue: Ta ni Ἑλληνιστάς ń tọ́ka sí?
  choice: Àwọn Júù tí ń sọ èdè Gíríìkì
  alternative: Àwọn ará Gíríìkì tàbí gbogbo àwọn tí ń sọ èdè Gíríìkì
  rationale: Ìlò Ἑλληνισταί nínú Ìṣe Àwọn Àpọ́sítélì, pàápàá ní Ìṣe 6:1, tọ́ka sí ẹgbẹ́ àwọn Júù tí ń sọ èdè Gíríìkì, kì í ṣe àwọn Kèfèrí lápapọ̀.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó ṣe kedere, tí ó sì jẹ́ ti òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; ìṣàmúlò “ń” pa ìṣe tí ó ń bá a lọ mọ́ nínú àwọn ọ̀rọ̀-ìṣe aláìpé méjèèjì.
