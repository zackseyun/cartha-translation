id: ACT.9.27
reference: Acts 9:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n Bánábà dì í mú, ó sì mú un lọ sí ọ̀dọ̀ àwọn àpọ́sítélì. Ó ròyìn fún wọn bí Ṣọ́ọ̀lù ti rí Olúwa ní ọ̀nà, àti pé Olúwa ti bá a sọ̀rọ̀, àti bí ó ti fi ìgboyà sọ̀rọ̀ ní Damásíkù ní orúkọ Jésù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: dì í mú
  rationale: Ó pa agbára gidi ọ̀rọ̀ náà mọ́, ìyẹn ‘di ẹni mú,’ ṣùgbọ́n nínú àyíká yìí ó jẹ́ ìṣe ìrànlọ́wọ́ Bánábà, kì í ṣe mímú ẹni ní tipátipá.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: mú un lọ sọ́dọ̀ àwọn aposteli
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Bánábà ṣamọ̀nà Ṣọ́ọ̀lù lọ síwájú àwọn aposteli.
- source_word: διηγήσατο
  choice: ròyìn fún wọn
  rationale: ‘Ròyìn’ fi hàn pé ó sọ ìṣẹ̀lẹ̀ náà ní ìtẹ̀lé àti ní kíkún ju ọ̀rọ̀ gbogbogbò ‘sọ’ lọ.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: bí ... ní ọ̀nà
  rationale: ὁδός tọ́ka sí ọ̀nà ìrìn-àjò sí Damásíkù, kì í ṣe orúkọ ẹgbẹ́ ‘Ọ̀nà náà.’
- source_word: εἶδεν τὸν κύριον
  choice: ti rí Olúwa
  rationale: Àmì àsìkò ‘ti’ bá ìròyìn nípa ohun tó ti ṣẹlẹ̀ mu; ‘Olúwa’ sì pa ìtumọ̀ àti ìwọ̀n Kristọ́lọ́jì κύριος mọ́.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: pé Olúwa ti bá a sọ̀rọ̀
  rationale: Títún ‘Olúwa’ sọ dípò ọ̀rọ̀ arọ́pò-orúkọ yọ ìṣòro ẹni tí ó bá Ṣọ́ọ̀lù sọ̀rọ̀ kúrò, gẹ́gẹ́ bí ìtẹ̀sí gírámà àti àyíká ẹsẹ̀ náà.
- source_word: ἐπαρρησιάσατο
  choice: fi ìgboyà sọ̀rọ̀
  rationale: Ó mú èrò sísọ̀rọ̀ ní òmìnira àti láìbẹ̀rù jáde, láìfi ọ̀rọ̀ pàtó bí ‘wàásù’ kún orísun.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: ní orúkọ Jésù
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì mọ́ fún sísọ̀rọ̀ lábẹ́ àṣẹ Jésù àti ní ìjẹ́wọ́ rẹ̀.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ tọ́ka sí nínú ìrírí Ṣọ́ọ̀lù lójú ọ̀nà
  choice: ‘Olúwa’ tọ́ka sí Jésù
  alternative: Kí ‘Olúwa’ jẹ́ ìtọ́kasí gbogbogbò sí Ọlọ́run
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ nínú Ìṣe 9 dá ìpàdé náà mọ́ Jésù tí ó jíǹde, òpin ẹsẹ̀ náà sì mẹ́nu kan ‘orúkọ Jésù.’ Síbẹ̀, a pa oyè ‘Olúwa’ mọ́ nínú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘aposteli’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó ti wọ́pọ̀. A fi ‘Ṣọ́ọ̀lù’ sí gẹ́gẹ́ bí orúkọ nínú ìròyìn láti mú àwọn ọ̀rọ̀ arọ́pò-orúkọ kedere, bó tilẹ̀ jẹ́ pé Gíríìkì ní αὐτόν/αὐτός.
