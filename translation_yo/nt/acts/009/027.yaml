revisions:
- from: Ṣùgbọ́n Bánábà dì í mú, ó sì mú un lọ sọ́dọ̀ àwọn aposteli. Ó ròyìn fún wọn bí Ṣọ́ọ̀lù ti rí Olúwa ní ọ̀nà, àti pé Olúwa ti bá a sọ̀rọ̀, àti bí ó ti fi ìgboyà sọ̀rọ̀ ní orúkọ Jésù ní Damásíkù.
  to: Ṣùgbọ́n Bánábà dì í mú, ó sì mú un lọ sí ọ̀dọ̀ àwọn àpọ́sítélì. Ó ròyìn fún wọn bí Ṣọ́ọ̀lù ti rí Olúwa ní ọ̀nà, àti pé Olúwa ti bá a sọ̀rọ̀, àti bí ó ti fi ìgboyà sọ̀rọ̀ ní Damásíkù ní orúkọ Jésù.
  rationale: A ṣàtúnṣe ìtòlẹ́sẹẹsẹ gbolohun ìkẹyìn láti fi Damásíkù ṣáájú ‘ní orúkọ Jésù,’ gẹ́gẹ́ bí orísun Gíríìkì, a sì tún àmì ohùn ‘àpọ́sítélì’ ṣe. A pa ìtumọ̀ ‘dì í mú’ mọ́ nítorí ó lè ṣàfihàn ἐπιλαβόμενος láìṣàfikún ohun tí a mú tàbí ọ̀nà ìmú náà.
