id: ACT.9.13
reference: Acts 9:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: yo
  text: Ṣùgbọ́n Ananíà dáhùn pé, “Olúwa, mo ti gbọ́ láti ọ̀dọ̀ ọ̀pọ̀ ènìyàn nípa ọkùnrin yìí, bí ó ti ṣe ohun búburú púpọ̀ tó[a] sí àwọn ẹni mímọ́ rẹ ní Jerusalẹmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun búburú wo ni ó ti ṣe sí àwọn ẹni mímọ́ rẹ ní Jerusalẹmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ Ἁνανίας
  choice: Ṣùgbọ́n Ananíà dáhùn pé
  rationale: “Ṣùgbọ́n” mú ìyípadà onírẹ̀lẹ̀ tí δέ ń fi hàn nínú ìtàn náà jáde, “dáhùn” sì jẹ́ ìtumọ̀ àdánidá fún ἀπεκρίθη.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ yìí jẹ́ ìpè tààrà sí Jésù ẹni tí Ananíà ń bá sọ̀rọ̀ nínú ìran; “Olúwa” pa ọ̀wọ̀ àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: mo ti gbọ́ láti ọ̀dọ̀ ọ̀pọ̀ ènìyàn
  rationale: “Mo ti gbọ́” fi hàn pé ìròyìn tí ó ti gbọ́ ṣì ṣe pàtàkì sí ìdáhùn rẹ̀ nísinsìnyí. Fífi “ènìyàn” kún un jẹ́ ohun tí Yorùbá àdánidá ń béèrè, láìyí ìtumọ̀ ọ̀pọ̀ àwọn olùròyìn padà.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: nípa ọkùnrin yìí
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ Yorùbá òde òní fún gbólóhùn náà.
- source_word: ὅσα κακὰ
  choice: gbogbo ohun búburú
  rationale: Yíyan yìí mú ìwọ̀n àti àpapọ̀ àwọn iṣẹ́ búburú tí ὅσα κακά ń tọ́ka sí jáde ní Yorùbá àdánidá, láìdín ìwà búburú wọn kù sí ìpalára lásán.
- source_word: τοῖς ἁγίοις σου
  choice: àwọn ẹni mímọ́ rẹ
  rationale: “Àwọn ẹni mímọ́” pa ìtumọ̀ ἅγιοι mọ́ gẹ́gẹ́ bí orúkọ fún àwọn onígbàgbọ́, “rẹ” sì pa ìní tí σου ń fi hàn mọ́.
- source_word: ἐποίησεν
  choice: tí ó ti ṣe
  rationale: “Ṣe” jẹ́ ìbádọ́gba tó gbòòrò fún ποιέω; “ti ṣe” sì fi ìbáṣepọ̀ iṣẹ́ àtijọ́ náà pẹ̀lú àníyàn Ananíà lọ́wọ́lọ́wọ́ hàn.
- source_word: ἐν Ἰερουσαλήμ
  choice: ní Jerusalẹmu
  rationale: Ìtumọ̀ ibi tó ṣe déédé fún gbólóhùn Gíríìkì náà.
theological_decisions:
- issue: Ẹni tí Κύριε ń tọ́ka sí àti agbára ọ̀rọ̀ náà
  choice: Ìpè tààrà sí Jésù gẹ́gẹ́ bí “Olúwa”
  alternative: “Ọ̀gá” gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ lásán
  rationale: Nínú ọ̀rọ̀ tó yí ẹsẹ yìí ká, Ananíà ń dá Jésù ẹni tí ó jíǹde lóhùn nínú ìran. Nítorí náà, “Olúwa” bá àyíká ìtàn náà mu, ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ mọ́ láìfi ohun tí ìtàn kò sọ kún un.
- issue: Ìdánimọ̀ τοῖς ἁγίοις σου
  choice: “àwọn ẹni mímọ́ rẹ” fún àwọn onígbàgbọ́ tí í ṣe ti Olúwa
  alternative: “àwọn ènìyàn rẹ”
  rationale: Ìtumọ̀ náà pa èdè ìwé mímọ́ ti ἅγιοι àti ìbáṣepọ̀ wọn pẹ̀lú Olúwa mọ́, láìso ó mọ́ ẹ̀kọ́ ẹ̀ya ìjọ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé lasán, ṣùgbọ́n ó tún pa ìṣiyèméjì àti ìbẹ̀rù inú ìdáhùn Ananíà mọ́.
