revisions:
- from: Ṣùgbọ́n Ananíà dáhùn pé, “Olúwa, mo ti gbọ́ láti ọ̀dọ̀ ọ̀pọ̀ ènìyàn nípa ọkùnrin yìí àti gbogbo ohun búburú tí ó ti ṣe sí àwọn ẹni mímọ́ rẹ ní Jerusalẹmu.[a]”
  to: Ṣùgbọ́n Ananíà dáhùn pé, “Olúwa, mo ti gbọ́ láti ọ̀dọ̀ ọ̀pọ̀ ènìyàn nípa ọkùnrin yìí, bí ó ti ṣe ohun búburú púpọ̀ tó[a] sí àwọn ẹni mímọ́ rẹ ní Jerusalẹmu.”
  rationale: The revision replaces the potentially universal “gbogbo ohun búburú” with a natural Yoruba degree expression that reflects the extent implied by ὅσα κακά. The footnote is revised to a grammatical Yoruba alternative reflecting the ‘what evil things’ lexical option and is anchored to the phrase it qualifies.
