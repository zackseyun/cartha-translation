id: ACT.9.15
reference: Acts 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa sọ fún un pé, “Lọ, nítorí ọkùnrin yìí jẹ́ ohun èlò àyànfẹ́ mi láti ru orúkọ mi lọ síwájú àwọn Kèfèrí[a] àti àwọn ọba àti àwọn ọmọ Ísírẹ́lì[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ọmọ Ísírẹ́lì” jẹ́ ọ̀rọ̀ Bíbélì ìbílẹ̀ fún àwọn ènìyàn Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè Yorùbá tó bójú mu fún κύριος ni àyíká yìí; ó ń tọ́ka sí Jésù ẹni tí ó jíǹde, tó sì ń sọ̀rọ̀ pẹ̀lú àṣẹ.
- source_word: Πορεύου
  choice: Lọ
  rationale: Àṣẹ kúkúrú, àdánidá ní Yorùbá, tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: σκεῦος ἐκλογῆς
  choice: ohun èlò tí mo yàn
  rationale: σκεῦος lè túmọ̀ sí ohun ìkó-nǹkan, ṣùgbọ́n àkàwé ni níbí fún ẹni tí a yàn fún iṣẹ́ kan. Gbólóhùn yìí ṣe ìtumọ̀ náà kedere láìfi ẹ̀kọ́ ìsìn àfikún sí ἐκλογῆς.
- source_word: ἐστίν μοι
  choice: jẹ́ ... fún ara mi
  rationale: Ó fi ìbáṣepọ̀ àti jíjẹ́ ti Olúwa hàn, gẹ́gẹ́ bí dátífù μοι ṣe rí.
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: láti gbé orúkọ mi lọ
  rationale: “Láti” fi ète infinitive hàn; “gbé orúkọ mi lọ” pa àwòrán gbígbé orúkọ mọ́, ó sì bá iṣẹ́ ìkéde mu.
- source_word: ἐνώπιον
  choice: síwájú
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ pé kí ó mú orúkọ náà dé iwájú àwọn ẹgbẹ́ tí a dárúkọ.
- source_word: ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Ní ìyàtọ̀ sí àwọn ọmọ Ísírẹ́lì, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Àṣàyàn gangan jù lọ, “àwọn orílẹ̀-èdè,” wà nínú àlàyé ìsàlẹ̀.
- source_word: βασιλέων
  choice: àwọn ọba
  rationale: Ìtumọ̀ tààrà tó ṣe kedere, tí kò sì sọ ọ̀rọ̀ náà di gbígbòòrò ju ti orísun lọ.
- source_word: υἱῶν Ἰσραήλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: Èyí pa ọ̀rọ̀ ìdílé Bíbélì mọ́ ní Yorùbá àdánidá. Nínú àṣà ọ̀rọ̀ yìí, “ọmọ” dúró fún àwọn ènìyàn Ísírẹ́lì lápapọ̀, kì í ṣe ọmọkùnrin nìkan.
- source_word: τε ... καὶ ... τε
  choice: àti ... àti
  rationale: Àsopọ̀ Yorùbá tó wọ́pọ̀ ló fi ìṣọ̀kan àwọn ẹgbẹ́ mẹ́tẹ̀ẹ̀ta hàn láìsọ gbólóhùn di líle.
theological_decisions:
- issue: Ó ṣeé ṣe kí a ka ἐκλογῆς gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ nípa ìyàn àyànmọ́.
  choice: ohun èlò tí mo yàn fún ara mi
  alternative: ohun èlò àyànfẹ́ mi; ohun èlò ìyàn
  rationale: Ẹsẹ̀ náà sọ ní kedere pé Olúwa yan ọkùnrin náà fún iṣẹ́ ìránṣẹ́. Ìtumọ̀ yìí pa ìyàn náà mọ́, ṣùgbọ́n kò fi àríyànjiyàn ẹ̀kọ́ ìsìn ìgbà tó tẹ̀ lé e sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àwòrán “ohun èlò” àti “gbé orúkọ mi” mọ́, nígbà tí ìṣètò gbólóhùn jẹ́ àdánidá ní Yorùbá.
