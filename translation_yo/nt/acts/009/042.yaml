id: ACT.9.42
reference: Acts 9:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: yo
  text: Èyí sì di mímọ̀ jákèjádò gbogbo Jópà, ọ̀pọ̀ ènìyàn sì gba Olúwa gbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: Èyí ... di mímọ̀
  rationale: Gbólóhùn Gíríìkì náà kò sọ ẹni tó mú un di mímọ̀. ‘Èyí ... di mímọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ àbájáde náà mọ́ láìfi olùṣe kan kún un.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn náà síwájú; ‘sì’ bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: jákèjádò gbogbo Jópà
  rationale: ‘Jákèjádò’ fi ìtànkálẹ̀ ká gbogbo agbègbè hàn, ‘gbogbo’ sì pa agbára ὅλης mọ́.
- source_word: Ἰόππης
  choice: Jópà
  rationale: A ṣe orúkọ ibì náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: ἐπίστευσαν πολλοὶ
  choice: ọ̀pọ̀ ènìyàn ... gba ... gbọ́
  rationale: Ọ̀rọ̀ ajẹtífù πολλοί dúró fún àwọn ènìyàn ní Gíríìkì; Yorùbá àdánidá nílò ‘ọ̀pọ̀ ènìyàn.’ ‘Gba ... gbọ́’ sọ ìṣẹ̀lẹ̀ wíwọ inú ìgbàgbọ́ yẹn ní kedere.
- source_word: ἐπὶ τὸν κύριον
  choice: gba Olúwa gbọ́
  rationale: Pẹ̀lú πιστεύω, gbólóhùn yìí tọ́ka sí fífi ìgbẹ́kẹ̀lé sínú ẹni kan. ‘Gba Olúwa gbọ́’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì pa Olúwa mọ́ gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ náà dojú kọ.
- source_word: κύριον
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος ní àyíká yìí, ó sì pa ọlá àti ìwúwo ẹ̀kọ́ nípa Kristi tó wà nínú orúkọ oyè náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω pẹ̀lú ἐπὶ τὸν κύριον
  choice: gba Olúwa gbọ́
  alternative: ní ìgbàgbọ́ nínú Olúwa
  rationale: ‘Gba Olúwa gbọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìgbàgbọ́ àti ìgbẹ́kẹ̀lé tí ẹni kan fi sínú Olúwa, láìfi àlàyé ẹ̀kọ́ ìsìn tó kọjá ọ̀rọ̀ orísun kún un.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ọlá àti ìtumọ̀ nípa Kristi tó ṣe pàtàkì nínú Ìṣe Àwọn Àpọ́sítélì mọ́; ‘Ọ̀gá’ lè dín ìwúwo orúkọ oyè náà kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti ìtàn, ó lóye fún òǹkàwé òde òní, ó sì ní ọlá. A lo ‘Èyí’ láti tọ́ka sí gbogbo ìṣẹ̀lẹ̀ tó ṣáájú láìsọ ohun tí Gíríìkì kò sọ ní pàtó.
