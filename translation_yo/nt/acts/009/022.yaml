source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n Saulu ń túbọ̀ di alágbára sí i, ó sì ń da àwọn Júù tí ń gbé ní Damásíkù rú, nípa fífi ẹ̀rí hàn pé ẹni yìí ni Mèsáyà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà, Χριστός, túmọ̀ sí “ẹni tí a fi òróró yàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: ń túbọ̀ lágbára sí i
  rationale: Ó fi ìṣe tí ń bá a lọ nínú imperfect àti ìtẹnumọ́ μᾶλλον hàn lọ́nà Yorùbá àdánidá, láì pinnu bóyá agbára náà wá láti inú Saulu tàbí láti ọ̀dọ̀ Ọlọ́run.
- source_word: συνέχυννεν
  choice: ń da ... rú
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ dídà wọ́n rú tàbí fífi wọ́n sínú ìdàrúdàpọ̀ nínú àríyànjiyàn mú, ó sì lágbára ju ‘ń mú ... dàrú’ lásán lọ.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: àwọn Júù tí ń gbé ní Damásíkù
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn Júù pàtó tí ń gbé ní ìlú náà, kì í ṣe sí gbogbo àwọn Júù lápapọ̀.
- source_word: συμβιβάζων
  choice: nípa fífi ẹ̀rí hàn
  rationale: 'Participle náà ṣàlàyé ọ̀nà tí Saulu gbà ń dá wọn rú: ó ń so àwọn kókó ẹ̀rí pọ̀ láti fi ìparí ọ̀rọ̀ múlẹ̀.'
- source_word: οὗτός
  choice: ẹni yìí
  rationale: Ó pa agbára demonstrative mọ́, ó ń tọ́ka pàtó sí Jésù dípò lílo arọ́pò-orúkọ lásán.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí, Χριστός jẹ́ oyè fún ẹni àmì òróró tí a ṣèlérí, kì í ṣe apá orúkọ; ‘Mèsáyà’ pa àyíká ìrètí àwọn Júù mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní kedere nínú gbólóhùn pé ẹni yìí ni ẹni àmì òróró tí a ṣèlérí. ‘Mèsáyà’ mú ìtumọ̀ Júù rẹ̀ jáde, nígbà tí ‘Kristi’ lè dà bí orúkọ ní Yorùbá.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tó bá yẹ; ‘Damásíkù’ àti ‘Mèsáyà’ ni a ṣe ní ìbámu pẹ̀lú ìpè Yorùbá.
