  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè Sọ́ọ̀lù fún lẹ́tà sí àwọn sínágọ́gù ní Damásíkù, ète rẹ̀, àti ìtọ́kasí sí Ọ̀nà náà hàn dáadáa. Ṣùgbọ́n “yálà ọkùnrin tàbí obìnrin” yí ìṣọ̀kan τε καί (‘ọkùnrin àti obìnrin méjèèjì’) padà sí ìyàn ‘either/or,’ ó sì wà ní ipò tí ó lè dà bí ẹni pé ó ń ṣàpèjúwe Jerúsálẹ́m. A tún tún ọ̀nà ìfihàn δεδεμένους ṣe sí ‘ní ìdè,’ kí ó sọ ipò ẹni tí a dè ní kedere láìfikún pé ẹ̀wọ̀n irin ni.
  naturalness: Àtúnṣe náà ń lo Yorùbá boṣewa tó rọrùn fún kíkà ní gbangba. Ìpò ‘ọkùnrin àti obìnrin’ lẹ́yìn ‘àwọn tí ó bá rí’ ṣàlàyé ohun tí ó wà lábẹ́ ìwádìí Sọ́ọ̀lù, nígbà tí ‘mú … lọ sí Jerúsálẹ́m ní ìdè’ jẹ́ ìlànà ọ̀rọ̀ Yorùbá àdánidá.
  terminology: ‘Ọ̀nà náà’ yẹ kí ó wà gẹ́gẹ́ bí orúkọ ìdánimọ̀ ìjímìjí náà. ‘Sínágọ́gù,’ ‘Damásíkù,’ àti ‘Jerúsálẹ́m’ jẹ́ ìlò tó bójú mu. Nínú àlàyé ìsàlẹ̀, a rọ́pò ‘ìgbìmọ̀’ pẹ̀lú ‘ẹgbẹ́,’ nítorí ìgbìmọ̀ sábà máa ń túmọ̀ sí committee, kì í ṣe movement/group.
