id: ACT.9.2
reference: Acts 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: yo
  text: ó sì béèrè àwọn lẹ́tà lọ́wọ́ rẹ̀ sí àwọn sínágọ́gù ní Damásíkù, kí ó lè mú àwọn tí ó bá rí nínú àwọn ti Ọ̀nà náà[a], ọkùnrin àti obìnrin, lọ sí Jerúsálẹ́m ní ìdè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọlẹ́yìn Ọ̀nà náà.” Ọ̀rọ̀ Gíríìkì náà lo orúkọ ìjímìjí kan fún ẹgbẹ́ àwọn Kristẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: ó sì béèrè àwọn lẹ́tà lọ́wọ́ rẹ̀
  rationale: ‘Béèrè … lọ́wọ́ rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ẹni náà béèrè ohun kan lọ́dọ̀ rẹ̀; ‘sì’ tún so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú.
- source_word: ἐπιστολὰς
  choice: àwọn lẹ́tà
  rationale: Èyí túmọ̀ nọ́ńbà ọ̀pọ̀ àti ọ̀rọ̀ náà ní tààrà, láìfi ìtumọ̀ àfikún bí ‘ìwé àṣẹ’ sínú ẹsẹ̀.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: sí àwọn sínágọ́gù ní Damásíkù
  rationale: Ó sọ ibi tí àwọn lẹ́tà náà ń lọ ní Yorùbá tó ṣe kedere, ó sì pa ‘àwọn sínágọ́gù’ mọ́ gẹ́gẹ́ bí ohun tí Gíríìkì sọ.
- source_word: ὅπως ἐάν
  choice: kí ó bá à lè … tí ó bá
  rationale: 'Àkópọ̀ yìí pa ète àti ipò àìdánilójú mọ́: ìdí ni pé kí ó lè ṣe bẹ́ẹ̀ bí ó bá rí irú àwọn ẹni náà.'
- source_word: τινας … ἄνδρας τε καὶ γυναῖκας
  choice: àwọn tí ó bá rí … yálà ọkùnrin tàbí obìnrin
  rationale: Ó mú àìdánilójú ‘ẹnikẹ́ni/àwọn kan’ jáde, ó sì pa ìtọ́kasí Gíríìkì sí ọkùnrin àti obìnrin méjèèjì mọ́.
- source_word: τῆς ὁδοῦ ὄντας
  choice: tí wọ́n jẹ́ ti Ọ̀nà náà
  rationale: Ó pa àjọṣe gẹnitífù náà àti orúkọ ìgbìmọ̀ Kristẹni ìjímìjí ‘Ọ̀nà náà’ mọ́, láìsọ ọ́ di àlàyé gígùn nínú ẹsẹ̀.
- source_word: δεδεμένους ἀγάγῃ
  choice: dè … mú lọ
  rationale: Ìlànà ọ̀rọ̀-ìṣe tẹ̀léra ní Yorùbá jẹ́ ọ̀nà àdánidá láti sọ pé kí ó mú wọn lọ ní ipò dídè; kò fi ‘ẹ̀wọ̀n irin’ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́m
  rationale: ‘Sí’ ni ọ̀nà Yorùbá àdánidá fún ìrìnàjò lọ sí ìlú kan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ τῆς ὁδοῦ
  choice: Ọ̀nà náà
  alternative: àwọn ọmọlẹ́yìn Ọ̀nà náà
  rationale: ‘Ọ̀nà náà’ pa orúkọ ìdánimọ̀ ìgbìmọ̀ Kristẹni ìjímìjí mọ́, kò sì fi ìtumọ̀ olùtúmọ̀ tó pọ̀ ju orísun lọ sínú ọ̀rọ̀ náà.
- issue: Ìtọ́kasí ἄνδρας τε καὶ γυναῖκας
  choice: yálà ọkùnrin tàbí obìnrin
  alternative: ọkùnrin àti obìnrin
  rationale: Èyí pa ìtẹnumọ́ pé ète Sọ́ọ̀lù kan ọkùnrin àti obìnrin méjèèjì mọ́, láìrọ́pò wọn pẹ̀lú ọ̀rọ̀ gbogbogbò bí ‘àwọn ènìyàn.’
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ ìtàn àti ẹ̀sìn tó ti wọ́pọ̀, a sì pa àwọn orúkọ ibi mọ́ ní ìrísí Yorùbá.
