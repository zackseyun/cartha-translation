id: ACT.9.17
reference: Acts 9:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: yo
  text: Nítorí náà, Ananíà lọ, ó sì wọ inú ilé náà. Ó gbé ọwọ́ rẹ̀ lé Sọ́ọ̀lù, ó sì wí pé, “Arákùnrin Sọ́ọ̀lù, Olúwa ni ó rán mi—Jésù, ẹni tí ó farahàn sí ọ ní ojú ọ̀nà tí o ń gbà wá[a]—kí ojú rẹ lè tún rí[b], kí o sì kún fún Ẹ̀mí Mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú ọ̀nà tí o ń rìn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí o lè ríran padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Nítorí náà, Ananíà lọ
  rationale: “Nítorí náà” fi ìtẹ̀síwájú àti àbájáde ìtàn hàn, “lọ” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe náà láìfi ìtumọ̀ àfikún sí i.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: ó sì wọ inú ilé náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa ìtumọ̀ ‘wọ ilé náà’ mọ́.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: Ó gbé ọwọ́ rẹ̀ lé Sọ́ọ̀lù
  rationale: “Gbé ọwọ́ lé” jẹ́ gbólóhùn Yorùbá àdánidá fún fífi ọwọ́ kan ènìyàn, ó sì pa ìṣe ara tí Gíríìkì sọ mọ́.
- source_word: Σαοὺλ ἀδελφέ
  choice: Arákùnrin Sọ́ọ̀lù
  rationale: Ó pa ọ̀rọ̀ ìpè ìbátan náà mọ́, ó sì bá ìlò Kristẹni Yorùbá mu láìṣàfikún ìtumọ̀ ẹ̀yà tàbí ẹ̀kọ́ ìjọ kan.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: Olúwa ni ó rán mi
  rationale: Ìkọ̀lé “ni ó” tẹnumọ́ ẹni tí ó rán Ananíà, bí ìkọ̀lé Gíríìkì ṣe ń dá Olúwa mọ̀ gẹ́gẹ́ bí olùránṣẹ́ náà.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Jésù, ẹni tí ó farahàn ọ́
  rationale: A pa Jésù mọ́ gẹ́gẹ́ bí àfikún ìdánimọ̀ sí “Olúwa,” “ẹni tí” sì dúró fún participle olórúkọ náà ní Yorùbá àdánidá.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: ní ojú ọ̀nà tí o ń gbà wá[a]
  rationale: “Ojú ọ̀nà” jẹ́ ọ̀nà gidi; “ń gbà wá” pa ìṣe tí ó ń lọ lọ́wọ́ àti ìrìn-àjò tí ń tọ sí ibi kan mọ́.
- source_word: ὅπως
  choice: kí
  rationale: “Kí” ni ọ̀nà Yorùbá àdánidá láti fi ète tàbí àfojúsùn hàn nínú irú gbólóhùn yìí.
- source_word: ἀναβλέψῃς
  choice: kí o lè ríran padà[b]
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí mímú agbára ìríran padà, kì í ṣe wíwo sókè lásán.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: kí o sì kún fún Ẹ̀mí Mímọ́
  rationale: “Kún fún” pa àwòrán àti ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́; “Ẹ̀mí Mímọ́” ni orúkọ Yorùbá tí ó wọ́pọ̀ fún Ẹ̀mí Ọlọ́run.
theological_decisions:
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú “Olúwa” nínú ìkọ̀lé gbólóhùn náà
  choice: “Olúwa ni ó rán mi—Jésù, ẹni tí ó farahàn ọ́...”
  alternative: “Olúwa Jésù, ẹni tí ó farahàn ọ́..., ni ó rán mi”
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìtẹ̀lé àti ìdádúró àfikún orúkọ inú Gíríìkì mọ́, kí ó má bàa tú àìdánilójú gírámà náà sí ọ̀nà kan ṣoṣo, bó tilẹ̀ jẹ́ pé Jésù ń dá Olúwa mọ̀ ní kedere nínú àyíká náà.
- issue: Ìtumọ̀ πνεύματος ἁγίου tí kò ní article ní Gíríìkì
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Nínú Ìṣe Àwọn Àpọ́sítélì, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Ọlọ́run; àìsí article ní Gíríìkì kò mú kí ó di ẹ̀mí kan tí a kò mọ̀.
- issue: Ìtumọ̀ ἀδελφέ nínú ọ̀rọ̀ Ananíà sí Sọ́ọ̀lù
  choice: Arákùnrin Sọ́ọ̀lù
  alternative: Sọ́ọ̀lù, arákùnrin
  rationale: Èyí pa ìtẹ́wọ́gbà àti ìbáṣepọ̀ tí ọ̀rọ̀ ìpè náà ń fi hàn mọ́, láìsọ pé ó dá lórí ìbátan ẹ̀jẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìdádúró àfikún inú gbólóhùn Gíríìkì mọ́ nípasẹ̀ àmì gígùn (—). Àwọn àmì àlàyé [a] àti [b] wà ní ibi tí ó yẹ nínú ọ̀rọ̀.
