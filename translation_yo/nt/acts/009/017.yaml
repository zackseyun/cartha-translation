revisions:
- from: Nítorí náà, Ananíà lọ, ó sì wọ inú ilé náà. Ó gbé ọwọ́ rẹ̀ lé Sọ́ọ̀lù, ó sì wí pé, “Arákùnrin Sọ́ọ̀lù, Olúwa ni ó rán mi—Jésù, ẹni tí ó farahàn ọ́ ní ojú ọ̀nà tí o ń gbà wá[a]—kí o lè ríran padà[b], kí o sì kún fún Ẹ̀mí Mímọ́.”
  to: Nítorí náà, Ananíà lọ, ó sì wọ inú ilé náà. Ó gbé ọwọ́ rẹ̀ lé Sọ́ọ̀lù, ó sì wí pé, “Arákùnrin Sọ́ọ̀lù, Olúwa ni ó rán mi—Jésù, ẹni tí ó farahàn sí ọ ní ojú ọ̀nà tí o ń gbà wá[a]—kí ojú rẹ lè tún rí[b], kí o sì kún fún Ẹ̀mí Mímọ́.”
  rationale: The revision supplies sí in the required ‘appear to’ construction and replaces the less idiomatic restoration-of-sight phrase with a clear modern Yoruba equivalent. It retains the source’s appositional wording, purpose relation, ambiguity-resistant identification, and both footnote anchors.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative sequence, Ananias’s laying on of hands, the appositional identification of Jesus with ‘the Lord,’ the purpose clauses, and the reference to the Holy Spirit. However, ‘farahàn ọ́’ omits the required Yoruba preposition in the sense ‘appeared to you’; ‘farahàn sí ọ’ is the standard and unambiguous form.
  naturalness: The register is generally clear Standard Yoruba. ‘kí o lè ríran padà’ is less natural than an explicit modern expression for restored sight. ‘kí ojú rẹ lè tún rí’ communicates the healing sense idiomatically.
  terminology: ‘Arákùnrin Sọ́ọ̀lù,’ ‘Olúwa,’ ‘Jésù,’ and ‘Ẹ̀mí Mímọ́’ are suitable established biblical terminology. The appositional dash appropriately preserves the Greek’s identification of Jesus without forcing a more interpretively reorganized syntax.
  issues:
  - severity: medium
    issue: ‘Jésù, ẹni tí ó farahàn ọ́’ lacks ‘sí.’
    rationale: 'In Standard Yoruba, ẹni kan ‘farahàn sí’ ẹni kan: someone appears to someone. Without sí, the construction is grammatically deficient/unnatural and can obscure the participant relation expressed by σοι.'
  - severity: low
    issue: ‘kí o lè ríran padà’ is awkward for recovered sight in modern Yoruba.
    rationale: The Greek ἀναβλέψῃς means that Saul will see again in this healing context. ‘Kí ojú rẹ lè tún rí’ is natural, clear, and preserves that sense.
  revised_text: Nítorí náà, Ananíà lọ, ó sì wọ inú ilé náà. Ó gbé ọwọ́ rẹ̀ lé Sọ́ọ̀lù, ó sì wí pé, “Arákùnrin Sọ́ọ̀lù, Olúwa ni ó rán mi—Jésù, ẹni tí ó farahàn sí ọ ní ojú ọ̀nà tí o ń gbà wá[a]—kí ojú rẹ lè tún rí[b], kí o sì kún fún Ẹ̀mí Mímọ́.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “ní ojú ọ̀nà tí o ń rìn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí o lè ríran padà.”
    reason: lexical_alternative
  revision_rationale: The revision supplies sí in the required ‘appear to’ construction and replaces the less idiomatic restoration-of-sight phrase with a clear modern Yoruba equivalent. It retains the source’s appositional wording, purpose relation, ambiguity-resistant identification, and both footnote anchors.
