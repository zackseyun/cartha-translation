  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: yo
  text: Lẹ́yìn tí ó gba oúnjẹ[a], agbára rẹ̀ tún padà[b]. Ó sì wà pẹ̀lú àwọn ọmọ-ẹ̀yìn ní Damásíkù fún ọjọ́ mélòó kan[c].
