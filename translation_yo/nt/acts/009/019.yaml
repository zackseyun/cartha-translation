lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: lẹ́yìn tí ó jẹun
  rationale: Gbólóhùn náà túmọ̀ sí gbígba oúnjẹ tàbí jíjẹun; èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún fi hàn pé jíjẹun ṣáájú ìpadà agbára.
- source_word: ἐνίσχυσεν
  choice: agbára rẹ̀ tún padà
  rationale: Nínú àyíká ọ̀rọ̀, àìjẹun ti sọ Sọ́ọ̀lù di aláìlera; yíyan yìí sọ ìtumọ̀ abajade ọ̀rọ̀-ìṣe náà ní Yorùbá àdánidá, láìṣàfikún ohun tí kò sí nínú ọ̀rọ̀ Gíríìkì.
- source_word: Ἐγένετο δὲ
  choice: ó sì wà
  rationale: Níhìn-ín, ἐγένετο δὲ jẹ́ àsopọ̀ ìtàn ju pé ó ń tẹnumọ́ ohun kan tí ó ṣẹlẹ̀ lọ; “ó sì wà” bá ìṣàn ìtàn Yorùbá mu.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn ní Damásíkù
  rationale: μετά pẹ̀lú ẹ̀yà genitive fi ìbáṣepọ̀ hàn, “pẹ̀lú”; gbólóhùn ἐν Δαμασκῷ sì tọ́ka sí ibi tí àwọn ọmọ-ẹ̀yìn náà wà.
- source_word: ἡμέρας τινάς
  choice: fún ọjọ́ mélòó kan
  rationale: Accusative yìí fi iye àkókò hàn; “ọjọ́ mélòó kan” pa àìdájú iye ọjọ́ náà mọ́ láìsọ iye pàtó.
