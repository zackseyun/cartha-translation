  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbò: λαβὼν τροφὴν ni gbígba oúnjẹ, ἐνίσχυσεν sì tọ́ka sí ìmúpadà okun/agbára; ìbáṣepọ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn ní Damásíkù àti àkókò tí a kò sọ ní pàtó ni a ti pa mọ́. Àtúnṣe náà mú kí ọ̀rọ̀ àkọ́kọ́ fara mọ́ ‘gba oúnjẹ’ dáadáa ju ‘jẹun’ lọ.'
