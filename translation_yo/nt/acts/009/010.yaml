id: ACT.9.10
reference: Acts 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: yo
  text: Ọmọ ẹ̀yìn kan tí orúkọ rẹ̀ ń jẹ́ Ananíà wà ní Damásíkù. Olúwa sì sọ fún un nínú ìran pé, “Ananíà!” Ó sì dáhùn pé, “Èmi nìyí, Olúwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: wà ... sì
  rationale: Fọ́ọ̀mù aláìpé εἰμί ń ṣí ẹni tuntun sílẹ̀ nínú ìtàn, δέ sì jẹ́ àsopọ̀ ìtàn tí kò lágbára. Ìṣètò gbólóhùn Yorùbá àti ‘sì’ mú ìyípadà ìtàn náà jáde láìfi ọ̀rọ̀ àkókò kan kún un.
- source_word: τις μαθητὴς
  choice: ọmọ ẹ̀yìn kan
  rationale: τις jẹ́ àmì àìsọ pàtó níbí; ‘kan’ ni ọ̀nà Yorùbá àdánidá láti fi ẹni tí a ṣẹ̀ṣẹ̀ ń mú wọ inú ìtàn hàn.
- source_word: ἐν Δαμασκῷ
  choice: ní Damásíkù
  rationale: Èyí jẹ́ ìtọ́kasí ibi ní tààrà; a lo orúkọ ibìkan náà ní ìkọ̀wé Yorùbá.
- source_word: ὀνόματι Ἁνανίας
  choice: tí orúkọ rẹ̀ ń jẹ́ Ananíà
  rationale: Dátífù ὀνόματι jẹ́ ọ̀nà ìdánimọ̀ ẹni nípa orúkọ; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: ἐν ὁράματι
  choice: nínú ìran
  rationale: Ọ̀rọ̀ náà sọ ọ̀nà tí Olúwa gbà bá Ananíà sọ̀rọ̀; ‘nínú ìran’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Nínú àyíká Ìṣe 9, akọlé náà ń tọ́ka sí Jesu tí ó jíǹde. ‘Olúwa’ pa ìtumọ̀ akọlé κύριος mọ́ láìṣe àlàyé àfikún sínú ẹsẹ náà.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sọ fún un
  rationale: λέγω pẹ̀lú πρός àti akúsátífù túmọ̀ sí sísọ ohun kan sí ẹnì kan; ‘sọ fún un’ jẹ́ ọ̀rọ̀ Yorùbá tó péye àti àdánidá.
- source_word: Ἁνανία
  choice: Ananíà
  rationale: Orúkọ náà wà ní ipò ìpè; a kọ ọ́ ní ìbámu pẹ̀lú ìlànà ìkọ̀wé Yorùbá.
- source_word: Ἰδοὺ ἐγώ
  choice: Èmi nìyí
  rationale: Èyí jẹ́ ìdáhùn ìmúratán àti fífi ara ẹni hàn. ‘Èmi nìyí’ mú agbára àṣà-ọ̀rọ̀ náà jáde ju ìtumọ̀ gígé ọ̀rọ̀ kọ̀ọ̀kan lọ.
- source_word: κύριε
  choice: Olúwa
  rationale: Bí ó tilẹ̀ jẹ́ pé κύριε lè túmọ̀ sí ọ̀rọ̀ ọ̀wọ̀ fún ènìyàn ní ibòmíràn, níbí Ananíà ń dá ẹni tó bá a sọ̀rọ̀ nínú ìran lóhùn; àyíká náà ṣe atilẹyin fún ‘Olúwa.’
theological_decisions:
- issue: Ẹni tí ὁ κύριος àti κύριε ń tọ́ka sí nínú ìran
  choice: Àwọn méjèèjì ń tọ́ka sí Jesu tí ó jíǹde gẹ́gẹ́ bí Olúwa.
  alternative: Kí a kà á sí ìpè sí Ọlọ́run lápapọ̀ láìsọ ẹni pàtó.
  rationale: Àyíká Ìṣe 9 fi ẹni tó ń sọ̀rọ̀ hàn gẹ́gẹ́ bí Olúwa tó rán Ananíà sí Saulu; lílo ‘Olúwa’ pa agbára Kristológì ọ̀rọ̀ náà mọ́ láìfi ‘Jesu’ kún ibi tí Gíríìkì kò ti sọ orúkọ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtúmọ̀ náà jẹ́ àdánidá fún olùkà gbogbogbò, ó sì pa ìṣètò ìtàn, ìran, àti ìdáhùn ìmúratán Ananíà mọ́.
