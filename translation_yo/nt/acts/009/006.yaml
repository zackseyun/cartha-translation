  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: yo
  text: Ṣùgbọ́n dìde, kí o sì wọ inú ìlú náà; a ó sọ fún ọ ohun tí o gbọdọ̀ ṣe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ́ ní tààrà sí i, “a ó sọ fún ọ ohun tí ó jẹ́ dandan fún ọ láti ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà hàn láti inú ọ̀rọ̀ Ṣọ́ọ̀lù sí àṣẹ tí a fún un; ó sì jẹ́ ọ̀nà àdánidá láti túmọ̀ àsopọ̀ alátakò náà.
- source_word: ἀνάστηθι
  choice: dìde
  rationale: Ọ̀rọ̀ àṣẹ yìí bá ipò Ṣọ́ọ̀lù, ẹni tí ó ṣubú lulẹ̀, mu, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: wọ inú ìlú náà
  rationale: Ó mú ìtumọ̀ ìwọlé sínú ìlú jáde ní Yorùbá àdánidá, tí ó sì pa àṣẹ náà mọ́.
- source_word: λαληθήσεταί σοι
  choice: a ó sọ ... fún ọ
  rationale: Ìsọ̀rọ̀ aláìdárúkọ olùṣe yìí pa ìṣe-àfaradà Gíríìkì mọ́ ní Yorùbá tó rọrùn, láìsọ ẹni tí yóò sọ ọ́ ní pàtó.
- source_word: ὅ τί
  choice: ohun tí
  rationale: Ó ṣe àfihàn àkóónú ohun tí a ó sọ fún un ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: σε δεῖ ποιεῖν
  choice: ohun tí o gbọdọ̀ ṣe
  rationale: “Gbọdọ̀” pa agbára ìjẹ́dandan δεῖ mọ́, láìṣe àlàyé ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions:
- issue: Agbára δεῖ nínú àyíká ìtọ́sọ́nà Ọlọ́run
  choice: o gbọdọ̀ ṣe
  alternative: ó ṣe pàtàkì fún ọ láti ṣe / ohun tí ó yẹ kí o ṣe
  rationale: δεῖ sábà máa ń fi ìjẹ́dandan tàbí ojúṣe tó lágbára hàn nínú Ìṣe Àwọn Aposteli. “O gbọdọ̀ ṣe” pa agbára yẹn mọ́ láìsọ ní pàtó ju ọ̀rọ̀ náà lọ pé ta ni ó pinnu ìjẹ́dandan náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé gbogbo. A lo “a ó” gẹ́gẹ́ bí ìṣe aláìdárúkọ olùṣe láti pa àìsọ ẹni tí yóò bá Ṣọ́ọ̀lù sọ̀rọ̀ mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
