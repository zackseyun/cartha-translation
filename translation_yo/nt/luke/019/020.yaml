source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: yo
  text: Ẹni òmíràn náà sì wá, ó ní, ‘Olúwa, wò ó, mínà rẹ nìyí, èyí tí mo ti pa mọ́ sínú aṣọ[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ìfínú ọwọ́.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí aṣọ kékeré tí a sábà máa ń fi nu ojú tàbí lagun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: Ẹni òmíràn náà
  rationale: Ó fi ìránṣẹ́ yìí wé àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láì sọ pé òun ni ẹni kejì nínú iye wọn.
- source_word: ἦλθεν λέγων
  choice: wá, ó ní
  rationale: Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa bí ìṣe wíwá ṣe ṣáájú ọ̀rọ̀ rẹ̀ mọ́.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ sí ẹni tó jẹ́ ọ̀gá nínú àkàwé náà, ó sì tún pa ìtumọ̀ κύριος mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἰδοὺ
  choice: wò ó, ... nìyí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí pe àfiyèsí olùgbọ́, ó sì fi mínà náà hàn ní èdè Yorùbá tó ṣe déédéé.
- source_word: ἡ μνᾶ σου
  choice: mínà rẹ
  rationale: A ṣe mínà ní àfọwọ́kọ sí Yorùbá gẹ́gẹ́ bí òṣùwọ̀n owó ayé àtijọ́, dípò lílo orúkọ owó òde òní tó lè ṣini lọ́nà.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: èyí tí mo pa mọ́
  rationale: Ó sọ ipò tí mínà náà wà fún àkókò kan—ó fi í pamọ́—ní ọ̀nà tó rọrùn, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν σουδαρίῳ
  choice: sínú aṣọ
  rationale: Aṣọ jẹ́ ọ̀rọ̀ gbòòrò tó bá σουδάριον mu, láì fi irú aṣọ kan pàtó tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọlé.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ tí ìránṣẹ́ sọ sí ọ̀gá àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ àti ìró ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ẹni tí a ń bá sọ̀rọ̀ ní kété yìí ni ọ̀gá inú àkàwé; kò fi dandan sọ pé ọ̀rọ̀ náà jẹ́ ìjẹ́wọ́ nípa Kristi.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ, a sì yàgò fún ọ̀rọ̀ owó òde òní tí kò bá àṣà ọ̀rọ̀ náà mu.
