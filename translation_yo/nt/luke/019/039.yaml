  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: yo
  text: Àwọn kan lára àwọn Farisí nínú ogunlọ́gọ̀ náà sì sọ fún un pé, “Olùkọ́, bá àwọn ọmọ-ẹ̀yìn rẹ wí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: Àwọn kan lára àwọn Farisí
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn tí ó sọ̀rọ̀ jẹ́ díẹ̀ lára gbogbo àwọn Farisí, láì sọ iye wọn pàtó.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: tí ó wà nínú ogunlọ́gọ̀ náà
  rationale: ἀπό ń tọ́ka sí ibi tàbí àwùjọ tí wọ́n ti jáde; ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé àwọn Farisí náà wà láàárín ogunlọ́gọ̀. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì yẹra fún ìtumọ̀ tí ó lè dà bí ẹni pé wọ́n ṣẹ̀ṣẹ̀ kúrò níbẹ̀.
- source_word: εἶπαν πρὸς αὐτόν
  choice: sọ fún un pé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ìlànà àsọyé Gíríìkì náà.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè fún ẹni tí ń kọ́ni; “Olùkọ́” pa ìtumọ̀ iṣẹ́ ìkọ́ni mọ́ láì fi ipò ọlá tàbí ẹ̀kọ́ nípa ẹni Kristi kún un.
- source_word: ἐπιτίμησον
  choice: bá … wí
  rationale: Àṣẹ náà ń béèrè fún ìbáwí taara. “Bá … wí” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ láì túmọ̀ ọ́ ní pàtó sí “mú wọn dákẹ́.”
- source_word: τοῖς μαθηταῖς σου
  choice: àwọn ọmọ-ẹ̀yìn rẹ
  rationale: “Ọmọ-ẹ̀yìn” pa ìbáṣepọ̀ akẹ́kọ̀ọ́ àti olùkọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa nínú àyíká Ìhìn Rere.
theological_decisions:
- issue: Ìtumọ̀ Διδάσκαλε gẹ́gẹ́ bí orúkọ oyè tí wọ́n fi ń pe Jésù
  choice: Olùkọ́
  alternative: Ọ̀gá
  rationale: Níbí, ọ̀rọ̀ náà tẹnu mọ́ ipa ìkọ́ni, kì í sì í fi dandan sọ ìjẹ́wọ́ ẹ̀kọ́ nípa ẹni tí Jésù jẹ́. “Olùkọ́” kò fi ìtumọ̀ aláṣẹ tàbí ìjẹ́wọ́ tó lágbára ju ti Gíríìkì lọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. “Ogunlọ́gọ̀” ni a lò fún ὄχλος, “Farisí” fún Φαρισαῖος, àti “ọmọ-ẹ̀yìn” fún μαθητής.
