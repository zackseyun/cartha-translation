id: LUK.19.11
reference: Luke 19:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: yo
  text: Bí wọ́n ti ń gbọ́ nǹkan wọ̀nyí, ó tẹ̀ síwájú láti sọ àkàwé kan, nítorí ó wà nítòsí Jerusalẹmu, àti nítorí wọ́n rò pé ìjọba Ọlọ́run fẹ́rẹ̀ẹ́ fara hàn lẹ́sẹ̀kẹsẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fẹ́rẹ̀ẹ́ di mímọ̀ gbangba lẹ́sẹ̀kẹsẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ohun kan di èyí tí a lè rí tàbí tí ó hàn gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Bí wọ́n ti ń gbọ́ nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ yìí jẹ́ genitive absolute pẹ̀lú present participle, ó sì fi hàn pé gbígbọ́ náà ń lọ lọ́wọ́ nígbà tí Jésù bẹ̀rẹ̀ àkàwé náà.
- source_word: προσθεὶς εἶπεν
  choice: ó tẹ̀ síwájú láti sọ
  rationale: Ìtumọ̀ àdámọ́ yìí mú ìtẹ̀síwájú nínú ọ̀rọ̀ jáde ní Yorùbá àdánidá, dípò títúmọ̀ rẹ̀ ní líle gẹ́gẹ́ bí ‘ó fi kún un, ó sì sọ.’
- source_word: παραβολὴν
  choice: àkàwé kan
  rationale: ‘Àkàwé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún irú ẹ̀kọ́ aláwòrán yìí, ó sì bá lílo ọ̀rọ̀ náà nínú àwọn Ìhìn Rere mu.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: nítorí ó wà nítòsí Jerusalẹmu
  rationale: διά pẹ̀lú articular infinitive ní agbára ìdí; ẹni tí ó wà nítòsí Jerusalẹmu ni Jésù.
- source_word: δοκεῖν αὐτοὺς
  choice: wọ́n rò
  rationale: Ó sọ èrò tàbí ìfojúsọ́nà wọn láìfi hàn pé ohun tí wọ́n rò dájú.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí tẹnu mọ́ pé wọ́n retí ohun náà ní kánkán, láìsí ìdádúró.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: fẹ́ fara hàn
  rationale: ‘Fẹ́’ ní àyíká yìí sọ ìṣẹ̀lẹ̀ tí a retí pé ó sún mọ́lé; ‘fara hàn’ sì pa ìtumọ̀ dídé sí ìran tàbí mímọ̀ gbangba mọ́.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó péye, tí ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ jákèjádò Lúùkù.
theological_decisions:
- issue: Irú bí ìfarahàn ìjọba Ọlọ́run tí àwọn ènìyàn ń retí yóò ṣe rí
  choice: ìjọba Ọlọ́run fẹ́ fara hàn lẹ́sẹ̀kẹsẹ̀
  alternative: ìjọba Ọlọ́run fẹ́ di mímọ̀ gbangba lẹ́sẹ̀kẹsẹ̀
  rationale: Ẹsẹ yìí sọ pé wọ́n retí ìfarahàn ìjọba náà ní kánkán, ṣùgbọ́n kò sọ bóyá ó jẹ́ ìṣèlú, ìṣẹ̀lẹ̀ òpin ayé, tàbí ọ̀nà ẹ̀mí. Ìtumọ̀ náà kò fi ẹ̀kọ́ kan tí ẹsẹ kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì lo ‘Jerusalẹmu’ gẹ́gẹ́ bí ìkọ̀wé orúkọ ibi tí ó mọ́ọ̀mọ́ bá ìpè Yorùbá mu.
