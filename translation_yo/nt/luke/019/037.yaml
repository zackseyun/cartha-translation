id: LUK.19.37
reference: Luke 19:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: yo
  text: Bí ó sì ti ń sún mọ́ ibi ìsọ̀kalẹ̀ Òkè Ólífì, gbogbo ogunlọ́gọ̀ àwọn ọmọ-ẹ̀yìn bẹ̀rẹ̀ sí í fi ayọ̀ yin Ọlọ́run ní ohùn rara nítorí gbogbo iṣẹ́ agbára[a] tí wọ́n ti rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ ńlá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn agbára” tàbí “àwọn ìṣe agbára,” ó sì tẹnumọ́ àwọn ìṣe tí agbára Ọlọ́run farahàn nínú wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Nígbà tí ó sì ti sún mọ́
  rationale: Èyí mú gbólóhùn alábápín oníṣe inú ọ̀rọ̀ Gíríìkì wá gẹ́gẹ́ bí àkókò abẹ́lẹ̀, ó sì pa ìtumọ̀ pé ó ti ń dé síbẹ̀ mọ́.
- source_word: πρὸς τῇ καταβάσει
  choice: ibi ìsọ̀kalẹ̀
  rationale: Ó tọ́ka sí ibi tí a ti ń sọ̀ kalẹ̀ láì fi àlàyé nípa bí ilẹ̀ ibẹ̀ ṣe rí kún ọ̀rọ̀ orísun.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: Òkè Ólífì
  rationale: Èyí ni orúkọ ibi náà ní Yorùbá tí ó ṣe kedere, tí ó sì bá ìlò Bíbélì mu.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: gbogbo ogunlọ́gọ̀ àwọn ọmọ-ẹ̀yìn
  rationale: “Ogunlọ́gọ̀” fi hàn pé ẹgbẹ́ náà pọ̀, “àwọn ọmọ-ẹ̀yìn” sì dá ẹni tí ogunlọ́gọ̀ náà jẹ́ mọ̀.
- source_word: ἤρξαντο ... χαίροντες αἰνεῖν τὸν θεὸν
  choice: bẹ̀rẹ̀ sí í fi ayọ̀ yin Ọlọ́run
  rationale: “Bẹ̀rẹ̀ sí í” mú ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ náà wá; “fi ayọ̀” sì mú χαίροντες gẹ́gẹ́ bí ọ̀nà tí wọ́n gbà yin Ọlọ́run, ní Yorùbá àdánidá.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n gbé ohùn wọn sókè.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: nítorí gbogbo iṣẹ́ agbára tí wọ́n ti rí
  rationale: “Iṣẹ́ agbára” pa ìsopọ̀ δύναμις mọ́ pẹ̀lú agbára tí ó hàn nínú ìṣe, láì sọ ọ́ di ọ̀rọ̀ amọ̀ nípa iṣẹ́ ìyanu nìkan; “tí wọ́n ti rí” fi hàn pé àwọn ìṣe náà ti ṣẹlẹ̀ ṣáájú ìyìn yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δύναμις ní àyíká àwọn iṣẹ́ ìyanu
  choice: iṣẹ́ agbára
  alternative: iṣẹ́ ìyanu; iṣẹ́ ńlá
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí agbára, ìṣe agbára, tàbí iṣẹ́ ìyanu. “Iṣẹ́ agbára” pa ìtẹnumọ́ orísun mọ́ lórí agbára tí ó farahàn nínú ìṣe, láì dín ìtumọ̀ rẹ̀ kù sí iṣẹ́ ìyanu nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì àlàyé [a] sí lẹ́yìn “iṣẹ́ agbára,” ibi tí àlàyé náà ń tọ́ka sí.
