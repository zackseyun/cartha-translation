  to: Bí ó sì ti ń sún mọ́ ibi ìsọ̀kalẹ̀ Òkè Ólífì, gbogbo ogunlọ́gọ̀ àwọn ọmọ-ẹ̀yìn bẹ̀rẹ̀ sí í fi ayọ̀ yin Ọlọ́run ní ohùn rara nítorí gbogbo iṣẹ́ agbára[a] tí wọ́n ti rí.
