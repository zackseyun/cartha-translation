  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: ẹgbẹ́ àwọn ọmọ-ẹ̀yìn bẹ̀rẹ̀ sí í yin Ọlọ́run pẹ̀lú ayọ̀ àti ní ohùn rara nítorí àwọn δυνάμεις tí wọ́n ti rí. Síbẹ̀, “ti sún mọ́” lè dà bí iṣẹ́ tí ó ti parí, níbi tí ἐγγίζοντος ń gbé ìṣiṣẹ̀ ìsúnmọ́ tí ń lọ kalẹ̀. Àtúnṣe kékeré náà pa ìtẹ̀sí ìṣesí yìí mọ́.'
  naturalness: “Bí ó ti ń sún mọ́” jẹ́ Yorùbá òde òní tí ó rọrùn, ó sì bá gbolóhùn àkókò abẹ́lẹ̀ mu. “Gbogbo ogunlọ́gọ̀ àwọn ọmọ-ẹ̀yìn,” “pẹ̀lú ayọ̀,” àti “ní ohùn rara” jẹ́ ìlò tó ṣeé gbọ́ ní Yorùbá boṣewa.
  terminology: “Òkè Ólífì,” “àwọn ọmọ-ẹ̀yìn,” àti “Ọlọ́run” yẹ. “Iṣẹ́ agbára” jẹ́ ìtumọ̀ tó ṣọ́ra fún δυνάμεις, nítorí ó tọ́ka sí ìṣe tí agbára hàn nínú rẹ̀ láì fi dandan dí í mọ́ “iṣẹ́ ìyanu.” Àlàyé ìsàlẹ̀ ni a tún ṣe kí ọ̀pọ̀ δυνάμεων àti ìtumọ̀ “ìṣe agbára” hàn kedere.
