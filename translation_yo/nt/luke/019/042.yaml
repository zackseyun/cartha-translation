id: LUK.19.42
reference: Luke 19:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: yo
  text: ó ń wí pé,[a] “Ìbá ṣe pé ní ọjọ́ yìí, ìwọ pàápàá mọ̀ àwọn ohun tí ó ń mú àlàáfíà wá[b]—ṣùgbọ́n ní báyìí, a ti fi wọ́n pamọ́ kúrò lójú rẹ.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ èyí pé, “Ká ní o mọ̀ ní ọjọ́ yìí, ìwọ pàápàá, àwọn ohun tí ó ń mú àlàáfíà wá.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, ní ti gidi: “àwọn ohun sí àlàáfíà,” ìyẹn ni, àwọn ohun tó jẹ mọ́ àlàáfíà tàbí tó ń yọrí sí i.'
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹyọ kan. Nítorí náà, àwọn ìtumọ̀ kan sọ apá ìkẹyìn ní ẹyọ kan pé, “ṣùgbọ́n ní báyìí, a ti fi í pamọ́ kúrò lójú rẹ,” nípa gbígba gbolohun tó ṣáájú gẹ́gẹ́ bí èrò kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ó ń wí pé
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tó so mọ́ ìtàn tó ṣáájú; ‘ó ń wí pé’ pa ìṣàn ọ̀rọ̀ náà mọ́ láì sọ ọ́ di ọ̀rọ̀-ìṣe àkókò tó parí.
- source_word: Εἰ ἔγνως
  choice: Ìbá ṣe pé … mọ
  rationale: Nínú ẹkún ọkàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí kò ṣẹlẹ̀ bí ó ti yẹ; ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbànújẹ irú bẹ́ẹ̀ hàn.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: ní ọjọ́ yìí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ìtọ́kasí àkókò yìí, láì fi ìtẹnumọ́ míì kún un.
- source_word: καὶ σὺ
  choice: ìwọ náà
  rationale: Fífi arọ́pò-orúkọ náà hàn gbangba ń pa ìtẹnumọ́ àti ìmọ̀lára ẹkún sí Jerusalẹmu mọ́.
- source_word: τὰ πρὸς εἰρήνην
  choice: àwọn ohun tí ó ń mú àlàáfíà wá
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn ohun tó jẹ mọ́ àlàáfíà tàbí tó ń yọrí sí i; gbolohun yìí ṣe kedere, ó sì pa ọ̀pọ̀ nǹkan inú τὰ mọ́.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè gba ìtumọ̀ ìbágbépọ̀ rere, ire, àti yíyẹra fún ìdájọ́ nínú àyíká ọ̀rọ̀ náà.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n ní báyìí
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín ohun tí ó yẹ kí a mọ̀ àti bí a ti fi í pamọ́ nísinsìnyí.
- source_word: ἐκρύβη
  choice: a ti fi wọ́n pamọ́
  rationale: Èyí fi ohùn àìṣe (passive) hàn ní Yorùbá, ó sì so ohun tí a fi pamọ́ mọ́ ‘àwọn ohun’ tó ṣáájú ní kedere. Fífi ‘ti’ lò tún fi àbájáde tó wà títí di báyìí hàn.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: kúrò lójú rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tó pa àwòrán ojú gẹ́gẹ́ bí ohun èlò ìríran àti ìmọ̀ mọ́.
theological_decisions:
- issue: Ohun tí ἐκρύβη ń tọ́ka sí
  choice: A mú un tọ́ka sí ‘àwọn ohun tí ó ń mú àlàáfíà wá,’ a sì lo ‘wọ́n’ nínú Yorùbá.
  alternative: A lè mú un gẹ́gẹ́ bí ẹyọ kan pé, ‘a ti fi í pamọ́ kúrò lójú rẹ.’
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ẹyọ kan, ọ̀rọ̀ tó sún mọ́ ọn jù ni τὰ πρὸς εἰρήνην, tó jẹ́ ọ̀pọ̀ nǹkan ní ìtumọ̀. Yorùbá túbọ̀ ṣe kedere pẹ̀lú ‘wọ́n,’ ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn ẹyọ kan mọ́.
- issue: Agbára ẹkún inú gbolohun oníṣ شرط Εἰ ἔγνως
  choice: A túmọ̀ rẹ̀ sí ‘Ìbá ṣe pé … mọ,’ láì fi ọ̀rọ̀ pàtó tó túmọ̀ sí ‘kìkì’ tàbí ‘ì bá mà dára’ kún un.
  alternative: ‘Háà, ká ní … mọ̀!’ tàbí ‘Ìbá ṣe pé … mọ̀ ní!’
  rationale: Ìbànújẹ àti ìfẹ́kúfẹ̀ẹ́ wà nínú àyíká ọ̀rọ̀ náà, ṣùgbọ́n kò sí particle Gíríìkì pàtó fún ‘only.’ Ìtumọ̀ àkọ́kọ́ pa agbára ẹkún mọ́ láì fi ìtúmọ̀ míì kún ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá fún òǹkàwé òde òní. A lo ‘àlàáfíà’ nítorí ó ṣe kedere, ó sì gbòòrò tó láti ru ìtumọ̀ εἰρήνη nínú àyíká yìí. Àmì gígùn (—) pa ìdádúró ẹkún àti ìyípadà líle sí ‘ṣùgbọ́n ní báyìí’ mọ́.
