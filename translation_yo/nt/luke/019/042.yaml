  naturalness: The revised wording remains idiomatic Standard Yoruba and retains the solemn, lamenting register. “A ti fi wọ́n pamọ́” is a natural passive expression in Yoruba.
  terminology: Àlàáfíà is an appropriate established rendering for εἰρήνη. “Àwọn ohun tí ó ń mú àlàáfíà wá” adequately communicates the plural phrase τὰ πρὸς εἰρήνην without overinterpreting it.
