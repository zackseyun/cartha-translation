review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future force of κρίνω, the direct address ‘wicked slave,’ the rhetorical framing of the master’s description, and the parallel ‘what ... what’ objects in the final clauses. The rendering of τίθημι as ‘fi sílẹ̀,’ however, commonly means ‘leave behind’ in Yoruba, rather than ‘lay/set down,’ and therefore weakens the Greek image and its parallel with αἴρων.
  naturalness: The register is clear, modern Standard Yoruba, and the use of tone marks is generally sound. ‘Fi kalẹ̀’ is the more natural and precise wording for putting or laying something down in this context.
  terminology: ‘Ẹrú’ appropriately conveys δοῦλος in this master–slave parable. ‘Enìyàn líle’ is an acceptable non-interpretive rendering of αὐστηρός. ‘Ń ká’ suitably retains the agricultural image of θερίζων.
  issues:
  - severity: medium
    issue: ‘ohun tí èmi kò fi sílẹ̀’ is imprecise for ὃ οὐκ ἔθηκα.
    rationale: In ordinary Yoruba, ‘fi sílẹ̀’ commonly conveys leaving something behind. Greek ἔθηκα here means ‘I put/laid down’ (with possible deposit nuance), in deliberate parallel to ‘taking up.’ ‘Fi kalẹ̀’ preserves that concrete verbal contrast without forcing a financial sense.
