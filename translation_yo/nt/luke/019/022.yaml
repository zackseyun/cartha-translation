id: LUK.19.22
reference: Luke 19:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: yo
  text: Ó sì wí fún un pé, “Láti inú ẹnu rẹ[a] ni èmi yóò ti dá ọ lẹ́jọ́, ìwọ ẹrú búburú[b]. O mọ̀ pé ènìyàn líle ni mí, ẹni tí ń gbé ohun tí èmi kò fi kalẹ̀[c], tí mo sì ń ká ohun tí èmi kò gbìn[d], àbí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀rọ̀ ẹnu rẹ fúnra rẹ ni èmi yóò fi dá ọ lẹ́jọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìránṣẹ́ búburú.” Ọ̀rọ̀ Gíríìkì náà, δοῦλος, sábà máa ń tọ́ka sí ẹrú tàbí ẹni tí ó wà lábẹ́ ìdè ọ̀gá.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ohun tí èmi kò fi pamọ́.” Ọ̀rọ̀ náà lè tọ́ka sí fífi ohun pamọ́ gẹ́gẹ́ bí ohun ìfipamọ́ nínú àyíká owó yìí.
    reason: lexical_alternative
  - marker: d
    text: Ní ọ̀rọ̀ gangan, Gíríìkì sọ pé, “ohun tí èmi kò gbìn,” kì í ṣe “ibi tí èmi kò gbìn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: Láti inú ẹnu rẹ
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ọ̀rọ̀ ẹnu ẹrú náà fúnra rẹ̀ ni a ó fi dá a lẹ́jọ́.
- source_word: κρίνω
  choice: èmi yóò ... dá ọ lẹ́jọ́
  rationale: Ìṣe ọ̀rọ̀ náà jẹ́ ti ọjọ́ iwájú, ó sì túmọ̀ sí dídájọ́ ní gbòòrò; a kò mú un dín kù sí fífi ẹ̀sùn dáni nìkan.
- source_word: πονηρὲ
  choice: búburú
  rationale: “Búburú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbáwí nípa ìwà ẹni nínú àyíká yìí.
- source_word: δοῦλε
  choice: ẹrú
  rationale: Nínú àkàwé ọ̀gá àti ẹni tí ó wà lábẹ́ àṣẹ rẹ̀ yìí, ipò ìdè àti jíjẹ́ ohun-ìní ọ̀gá hàn gbangba; “ẹrú” pa agbára δοῦλος mọ́ ju “ìránṣẹ́” lọ.
- source_word: ᾔδεις
  choice: O mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì náà ní ìmọ̀ tí ó ti wà tẹ́lẹ̀, “O mọ̀” ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ nínú ìfọ̀rọ̀wérọ̀ yìí.
- source_word: αὐστηρός
  choice: líle
  rationale: “Líle” fi ìwà líle tàbí ìmúnilórí ẹni náà hàn láìfi ìtumọ̀ míì tí kò sí nínú Gíríìkì kún un.
- source_word: αἴρων
  choice: ń gbé
  rationale: Ó pa àwòrán gbígbé ohun sókè tàbí kíkó o lọ mọ́, ó sì bá gbólóhùn “ohun tí ... kò fi sílẹ̀” mu.
- source_word: ὃ οὐκ ἔθηκα
  choice: ohun tí èmi kò fi sílẹ̀
  rationale: “Fi sílẹ̀” pa ìtumọ̀ gbígbé ohun kalẹ̀ tàbí fífi ohun sí ibì kan mọ́, láìfi dandan sọ pé ìfipamọ́ owó ní pàtó ni.
- source_word: θερίζων
  choice: ń ká
  rationale: “Ká” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún kíkórè, ó sì pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
- source_word: ὃ οὐκ ἔσπειρα
  choice: ohun tí èmi kò gbìn
  rationale: Arọ́pò-orúkọ Gíríìkì túmọ̀ sí “ohun tí,” kì í ṣe “ibi tí”; ìtumọ̀ yìí sì pa ìbáramu àwọn gbólóhùn méjèèjì mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé ọ̀gá àti ẹrú
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìbáṣepọ̀ àṣẹ àti ìdè ẹni náà ṣe pàtàkì nínú àkópọ̀ ọ̀rọ̀ yìí. “Ẹrú” fi ipò awujọ tí δοῦλος ń tọ́ka sí hàn kedere, láìsọ ohunkóhun nípa bó ṣe yẹ tàbí bó ṣe burú.
- issue: Bóyá ọ̀rọ̀ ọ̀gá pé òun jẹ́ ènìyàn líle jẹ́ òtítọ́ tí a fẹsẹ̀ múlẹ̀ tàbí àtúnsọ ohun tí ẹrú náà sọ
  choice: A pa ọ̀rọ̀ tààrà náà mọ́ gẹ́gẹ́ bí ìdáhùn ọ̀gá sí ọ̀rọ̀ ẹrú, láìfi àlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: “O sọ pé ènìyàn líle ni mí” tàbí “Bí o bá mọ̀ pé ènìyàn líle ni mí”
  rationale: Gíríìkì sọ ọ́ ní tààrà lẹ́yìn “O mọ̀ pé,” ṣùgbọ́n ó wà nínú ìdáhùn alájàpá tí ọ̀gá fi ń lo ọ̀rọ̀ ẹrú náà. Ìtumọ̀ náà kò pinnu bóyá àkàwé náà ń fìdí àpèjúwe ìwà ọ̀gá múlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Àbí?” ń fi hàn pé ìbéèrè tó parí ẹsẹ náà jẹ́ ti ìfìdí-ọ̀rọ̀ múlẹ̀, bí Gíríìkì ṣe gbé e kalẹ̀.
