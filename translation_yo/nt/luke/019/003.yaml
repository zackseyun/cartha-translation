source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: yo
  text: Ó sì ń gbìyànjú láti rí ẹni tí Jesu jẹ́, ṣùgbọ́n kò lè rí i nítorí ogunlọ́gọ̀ ènìyàn náà, nítorí ó kéré ní gíga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kúrú.” Gbólóhùn Gíríìkì náà ní ìtumọ̀ gangan pé ó kéré nípa gíga ara; ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí gíga ara, kì í ṣe ọjọ́ orí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: ń gbìyànjú
  rationale: Àkókò imperfect fi ìsapá tí ó ń bá a lọ hàn; ‘ń gbìyànjú’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἰδεῖν
  choice: láti rí
  rationale: Infinitive náà sọ ète ìsapá rẹ̀; ‘láti rí’ jẹ́ ìtumọ̀ tí ó ṣe kedere.
- source_word: τίς ἐστιν
  choice: ẹni tí Jesu jẹ́
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ìdánimọ̀ tàbí irú ẹni tí ẹnì kan jẹ́; yíyan yìí pa àìdánilójú náà mọ́ láìfi àlàyé kún un.
- source_word: οὐκ ἠδύνατο
  choice: kò lè rí i
  rationale: ‘Kò lè’ jẹ́ ọ̀nà Yorùbá àdánidá fún àìlágbára; àfikún ‘rí i’ mú ohun tí kò lè ṣe ṣe kedere láti inú ọ̀rọ̀ tó ṣáájú.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: nítorí ọ̀pọ̀ ènìyàn
  rationale: Níbí, ἀπό sọ ìdí tàbí ìdènà; ọ̀pọ̀ ènìyàn ni ó dí ojú rẹ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó mú ìdí tí kò fi lè rí Jesu wọlé lọ́nà tí ó ṣe kedere.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: ó kúrú ní ìwọ̀n ara
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἡλικία tọ́ka sí gíga ara, kì í ṣe ọjọ́ orí; ‘kúrú ní ìwọ̀n ara’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí ó sì ní iyì.
