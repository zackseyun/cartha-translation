id: LUK.19.41
reference: Luke 19:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: yo
  text: Bí ó sì ti súnmọ́, ó rí ìlú náà, ó sì sọkún nítorí rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sọkún lé e lórí.”
    reason: Àṣàyàn yìí tẹ̀lé ìtumọ̀ ἐπ’ αὐτήν ní pẹkipẹki sí i, bí ó tilẹ̀ jẹ́ pé “nítorí rẹ̀” jẹ́ Yorùbá àdánidá jù lọ ní àyíká yìí.
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Bí ó sì ti sún mọ́lé
  rationale: Ọ̀rọ̀ yìí fi ìṣípòpadà rẹ̀ sí ibi náà hàn, láìfi ohun tí ó sún mọ́ kún un, nítorí àyíká ọ̀rọ̀ ti sọ ọ́ di mímọ̀.
- source_word: ἰδὼν
  choice: nígbà tí ó rí
  rationale: Ó mú ìṣe àbọ̀ náà wá sí Yorùbá àdánidá, ó sì so rírí ìlú náà mọ́ ẹkún rẹ̀ ní tààrà.
- source_word: τὴν πόλιν
  choice: ìlú náà
  rationale: πόλις túmọ̀ sí ‘ìlú’; ‘náà’ tọ́ka sí Jerusalẹmu tí àyíká ọ̀rọ̀ ti jẹ́ kó ṣe kedere, láìṣàfikún orúkọ náà sínú ẹsẹ yìí.
- source_word: ἔκλαυσεν
  choice: ó sọkún
  rationale: κλαίω ń tọ́ka sí ẹkún; ‘sọkún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì pa ìwúwo ìmọ̀lára náà mọ́ láìfi líle tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐπ’ αὐτήν
  choice: nítorí rẹ̀
  rationale: Pẹ̀lú κλαίω, gbólóhùn yìí ń sọ ohun tí a ń ṣọ̀fọ̀ tàbí tí a ń sunkún fún. ‘Nítorí rẹ̀’ jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó sún mọ́ ‘lé e lórí’ mọ́.
theological_decisions:
- issue: Bóyá kí a fi akọ tàbí abo hàn nínú arọ́pò-orúkọ tó dúró fún ìlú
  choice: Lo ‘rẹ̀,’ tí kò fi akọ tàbí abo hàn
  alternative: Ṣe àpèjúwe Jerusalẹmu bí obìnrin
  rationale: Nínú Gíríìkì, αὐτήν jẹ́ abo nítorí pé πόλις jẹ́ ọ̀rọ̀-orúkọ abo ní gírámà. Ṣùgbọ́n arọ́pò-orúkọ Yorùbá kò pín sí akọ àti abo, ẹsẹ náà kò sì béèrè pé kí a fi àkàwé obìnrin kún un. Nítorí náà, ‘rẹ̀’ pa ìtumọ̀ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà ní iyì, ó sì rọrùn fún òǹkàwé òde òní. A kò gbìyànjú láti gbe abo gírámà Gíríìkì wọ arọ́pò-orúkọ Yorùbá, nítorí èdè Yorùbá kò ní ìyàtọ̀ akọ àti abo níbẹ̀.
