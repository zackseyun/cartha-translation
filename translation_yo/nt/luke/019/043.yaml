id: LUK.19.43
reference: Luke 19:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: yo
  text: Nítorí àwọn ọjọ́ yóò dé bá ọ, nígbà tí àwọn ọ̀tá rẹ yóò kọ́ odi ìsàgatì sí ọ[a], wọn yóò yí ọ ká, wọn yóò sì há ọ mọ́ láti gbogbo ìhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbé òkìtì ìsàgatì dìde sí ọ.”
    reason: Ọ̀rọ̀ Gíríìkì χάραξ lè tọ́ka sí odi, òkìtì, tàbí iṣẹ́ ìdènà tí àwọn ọmọ ogun ń kọ́ fún ìsàgatì.
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó so àsọtẹ́lẹ̀ yìí mọ́ ọ̀rọ̀ ẹkún Jésù tó ṣáájú, ó sì pa agbára ìdí tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: àwọn ọjọ́ yóò dé bá ọ
  rationale: Èyí pa àpèjúwe àsọtẹ́lẹ̀ náà mọ́ pé àwọn ọjọ́ ìṣẹ̀lẹ̀ kan ń bọ̀ tí yóò dé bá Jerúsálẹ́mù.
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: yóò kọ́ odi ìsàgatì sí ọ
  rationale: Nínú àyíká ogun, gbólóhùn náà ń tọ́ka sí kíkọ́ ohun ìdènà tàbí odi fún ìsàgatì sí ìlú; ‘odi ìsàgatì’ ṣe kedere sí òǹkàwé òde òní.
- source_word: οἱ ἐχθροί σου
  choice: àwọn ọ̀tá rẹ
  rationale: Ìtumọ̀ tààrà ni fún àwọn ọmọ ogun tó dojú kọ Jerúsálẹ́mù.
- source_word: περικυκλώσουσίν σε
  choice: wọn yóò yí ọ ká
  rationale: Ó sọ ìyíká ìlú ká ní ọ̀nà ogun ní èdè Yorùbá tó ṣe kedere.
- source_word: συνέξουσίν σε πάντοθεν
  choice: wọn yóò sì há ọ mọ́ láti gbogbo ìhà
  rationale: ‘Há ọ mọ́’ fi ìdínà àti ìpọ́njú ìsàgatì hàn, ‘láti gbogbo ìhà’ sì pa ìtumọ̀ πάντοθεν mọ́.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ ẹni kejì ẹyọ kan ń tọ́ka sí nínú ẹkún Jésù lórí Jerúsálẹ́mù
  choice: A pa ‘ọ’ tó jẹ́ ẹyọ kan mọ́, bí ẹni pé Jerúsálẹ́mù jẹ́ ẹni tí Jésù ń bá sọ̀rọ̀.
  alternative: A lè túmọ̀ rẹ̀ sí ọ̀pọ̀ ènìyàn tí ń gbé inú ìlú náà.
  rationale: Àwọn arọ́pò-orúkọ Gíríìkì jẹ́ ẹyọ kan, wọ́n sì bá àkàwé Jerúsálẹ́mù gẹ́gẹ́ bí ẹni kan mu; ìtumọ̀ náà kò fẹ̀ ìtumọ̀ rẹ̀ sí àwọn olùgbé ìlú nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa ni, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà ní ìtẹ́lọ́rùn àti ìwọ̀ntúnwọ̀nsì àsọtẹ́lẹ̀, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní; a lo ọ̀rọ̀ ogun ‘ìsàgatì’ nítorí àyíká ẹsẹ̀ náà.
