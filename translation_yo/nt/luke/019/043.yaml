  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: ὅτι ni “Nítorí”; àsọtẹ́lẹ̀ “àwọn ọjọ́ yóò dé bá ọ” pa ìtumọ̀ ọjọ́ tí ń bọ̀ lórí Jerúsálẹ́mù mọ́; àwọn ọ̀tá ni kókó-ọrọ àwọn ìṣe ogun mẹ́tẹ̀ẹ̀ta náà. “Kọ́ odi ìsàgatì sí ọ,” “yí ọ ká,” àti “há ọ mọ́ láti gbogbo ìhà” ń sọ ìtumọ̀ iṣẹ́ ìsàgatì, yíká, àti títẹ́/ìdínà káa-kiri náà ní ìbámu pẹ̀lú ọ̀rọ̀ ìpilẹ̀. A pa arọ́pò-orúkọ ẹyọ kan mọ́, gẹ́gẹ́ bí Jerúsálẹ́mù tí a sọ di ẹni nínú àyíká rẹ̀.'
