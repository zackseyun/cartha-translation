  source_fidelity: 'Ìtumọ̀ náà fi àwọn apá pàtàkì Gíríìkì hàn dáadáa: Jerusalẹmu ni a ń bá sọ̀rọ̀ gẹ́gẹ́ bí ẹni; àwọn ọmọ inú rẹ wà nínú ìparun náà; àwòrán ‘òkúta kan lórí òkúta’ wà; ‘nítorí’ sọ ìdí náà; àti ‘àkókò ìbẹ̀wò rẹ’ pa ìtumọ̀ gígboro ti ἐπισκοπή mọ́. Àtúnṣe kékeré kan ni a nílò kí ìbáṣepọ̀ àwọn ohun méjèèjì tí ἐδαφιοῦσίν ń kàn—‘ọ́’ àti ‘àwọn ọmọ rẹ’—mọ́ kedere nínú Yorùbá.'
  naturalness: 'Gbolohun akọkọ nínú àkọsílẹ̀ náà, ‘wọn yóò sì wó ọ lulẹ̀, ìwọ àti àwọn ọmọ rẹ...,’ kò rọrùn ní Yorùbá: ‘ìwọ’ lẹ́yìn ‘ọ’ dà bí àfikún ẹni tí kò ní ipò gírámà kedere. Fífi ‘ọ́ àti àwọn ọmọ rẹ’ ṣe ohun kan ṣoṣo fún ‘wó ... lulẹ̀’ jẹ́ adayeba sí i, ó sì sọ ìtumọ̀ Gíríìkì di mímọ́. A tún ṣàtúnṣe àmì ohùn arọ́pò-orúkọ ohun sí ‘ọ́.’'
  terminology: ‘Wó ... lulẹ̀,’ ‘àwọn ọmọ rẹ tí ń bẹ nínú rẹ,’ ‘òkúta kan ... òkúta mìíràn,’ àti ‘àkókò ìbẹ̀wò rẹ’ bá ìpele ọ̀rọ̀ Bíbélì Yorùbá òde òní mu. ‘Ìbẹ̀wò’ yẹ fún ἐπισκοπή nítorí ó fi ìbẹ̀wò àti ìṣàyẹ̀wò sílẹ̀ ní ìmọ̀ràn, láì pinnu ọ̀rọ̀ náà sí àánú tàbí ìdájọ́ nìkan.
