id: LUK.19.44
reference: Luke 19:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: yo
  text: Wọ́n yóò sì wó ọ́ àti àwọn ọmọ rẹ tí ń bẹ nínú rẹ lulẹ̀; wọn kì yóò sì fi òkúta kan sílẹ̀ lórí òkúta mìíràn nínú rẹ, nítorí ìwọ kò mọ àkókò ìbẹ̀wò[a] rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àkókò ìṣàyẹ̀wò rẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbẹ̀wò tàbí ìṣàyẹ̀wò, pàápàá ìbẹ̀wò Ọlọ́run tí ó lè mú àánú tàbí ìdájọ́ wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν σε
  choice: wọn yóò sì wó ọ lulẹ̀
  rationale: “Wó … lulẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún rírun ohun kan dé ilẹ̀, ó sì pa agbára ἐδαφίζω mọ́ láì sọ “ìlú rẹ” dípò arọ́pò-orúkọ ẹni kejì.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: àwọn ọmọ rẹ tí ń bẹ nínú rẹ
  rationale: “Àwọn ọmọ rẹ” pa àwòrán Jerusalẹmu gẹ́gẹ́ bí ìyá mọ́; “tí ń bẹ nínú rẹ” sì fi hàn pé àwọn ènìyàn inú ìlú ni a ń tọ́ka sí láì sọ àwòrán náà di “àwọn olùgbé.”
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: wọn kì yóò sì fi òkúta kan sílẹ̀ lórí òkúta mìíràn nínú rẹ
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tí ó ṣe kedere fún ìparun pátápátá, ó sì pa “nìnú rẹ” àti àwòrán òkúta-lórí-òkúta mọ́.
- source_word: ἀνθ’ ὧν
  choice: nítorí
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń fi ìdí ìdájọ́ náà hàn; “nítorí” jẹ́ ìtumọ̀ ìdí tí ó ṣe kedere ní Yorùbá òde òní.
- source_word: οὐκ ἔγνως
  choice: ìwọ kò mọ
  rationale: “Kò mọ” lè sọ àìdámọ̀ tàbí àìlóye ohun tí Ọlọ́run ń ṣe; fífi “ìwọ” hàn ń tẹnu mọ́ ẹni tí Jesu ń bá sọ̀rọ̀.
- source_word: τὸν καιρὸν
  choice: àkókò
  rationale: “Àkókò” jẹ́ ọ̀rọ̀ àdánidá fún καιρός, ó sì lè gba ìtumọ̀ àkókò pàtàkì tàbí àkókò tí a yàn láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τῆς ἐπισκοπῆς σου
  choice: ìbẹ̀wò rẹ
  rationale: “Ìbẹ̀wò” pa ìtumọ̀ wíwá-bẹ̀-wò mọ́, ó sì jẹ́ kí ọ̀rọ̀ náà ṣí sí ìbẹ̀wò Ọlọ́run tí ó lè mú àánú tàbí ìdájọ́ wá. Àfikún “rẹ” ṣe aṣojú σου.
theological_decisions:
- issue: Ìtumọ̀ ἐπισκοπή ní àyíká ọ̀rọ̀ ìdájọ́
  choice: ìbẹ̀wò rẹ
  alternative: àkókò tí a wá yẹ̀ ọ́ wò; àkókò tí Ọlọ́run bẹ̀ ọ́ wò
  rationale: Gíríìkì lè túmọ̀ sí ìbẹ̀wò tàbí ìṣàyẹ̀wò, pàápàá ìbẹ̀wò Ọlọ́run fún àánú tàbí ìdájọ́. “Ìbẹ̀wò rẹ” kò sọ pé àánú nìkan tàbí ìdájọ́ nìkan ni, bẹ́ẹ̀ ni kò fi “Ọlọ́run” kún ibi tí ọ̀rọ̀ Gíríìkì kò ti sọ ọ́ ní tààrà.
translation_notes:
  register: Yorùbá ìpele àárín tí ó bójú mu, tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa Jerusalẹmu mọ́ gẹ́gẹ́ bí ẹni tí a ń bá sọ̀rọ̀ àti gẹ́gẹ́ bí ìyá àwọn “ọmọ” inú rẹ.
