id: LUK.19.47
reference: Luke 19:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: yo
  text: Ó sì ń kọ́ni lójoojúmọ́ ní tẹ́ńpìlì. Ṣùgbọ́n àwọn olórí àlùfáà àti àwọn akọ̀wé, àti àwọn ọkùnrin pàtàkì nínú àwọn ènìyàn,[a] ń gbìyànjú láti pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣáájú àwọn ènìyàn.” Ní tààrà, gbólóhùn Gíríìkì náà ni “àwọn ẹni àkọ́kọ́ nínú àwọn ènìyàn”; ó ń tọ́ka sí àwọn ẹni olókìkí tàbí alágbára nínú àwùjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: Ó sì ń kọ́ni
  rationale: Ìṣètò ọ̀rọ̀ yìí jẹ́ àìpé aláṣepọ̀ tó fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń kọ́ni” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó túmọ̀ sí pé ó ń ṣẹlẹ̀ ní gbogbo ọjọ́, lọ́jọ́ dé ọjọ́; “lójoojúmọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì bá ìtumọ̀ ìpínkiri náà mu.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Ní tẹ́ńpìlì” jẹ́ ìtumọ̀ ṣókí tó wọ́pọ̀, tí kò fi àlàyé tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí ẹgbẹ́ àwọn aṣáájú ẹgbẹ́ àlùfáà, kì í ṣe ọ̀pọ̀ olórí àlùfáà gíga ní àkókò kan náà.
- source_word: οἱ γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” jẹ́ ìtumọ̀ tààrà fún γραμματεῖς, ó sì yẹra fún fífi ìtumọ̀ àlàyé bí “àwọn olùkọ́ òfin” rọ́pò ọ̀rọ̀ orísun.
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Àìpé náà fi ìgbìyànjú tó ń bá a lọ hàn. Nínú àyíká yìí, “ń wá ọ̀nà” jẹ́ Yorùbá àdánidá fún wíwá bí wọn ṣe lè mú ète náà ṣẹ.
- source_word: ἀπολέσαι
  choice: láti pa á run
  rationale: ἀπόλλυμι lè túmọ̀ sí píparun tàbí pípa ènìyàn. “Pa á run” dúró sún mọ́ ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì, ó sì ní agbára láti ní pípa Jesu nínú láì dín un kù sí ọ̀nà ikú kan ṣoṣo.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: àwọn ọkùnrin pàtàkì láàárín àwọn ènìyàn
  rationale: πρῶτοι, “àwọn ẹni àkọ́kọ́,” ń tọ́ka níbí sí àwọn ọkùnrin olókìkí tàbí alágbára láàárín àwùjọ. Ìtumọ̀ yìí pa akọ-nìkan ọ̀pọ̀ mọ́, ó sì mú ipò ọlá wọn hàn.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú οἱ πρῶτοι τοῦ λαοῦ
  choice: àwọn ọkùnrin pàtàkì láàárín àwọn ènìyàn
  alternative: àwọn aṣáájú àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ-nìkan ọ̀pọ̀, ó sì ṣeé ṣe kó ń tọ́ka sí àwọn akọni olókìkí ní ìtàn àwùjọ ìgbà náà. A pa ìtọ́kasí yìí mọ́ dípò yíyí i sí ọ̀rọ̀ tí kò fi akọ hàn.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó bá yẹ. A lo “tẹ́ńpìlì” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀, “àwọn akọ̀wé” gẹ́gẹ́ bí ìtumọ̀ tààrà, àti “pa á run” láti pa fífẹ̀ ìtumọ̀ ἀπολέσαι mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
