id: LUK.19.30
reference: Luke 19:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: yo
  text: Ó ń sọ pé, “Ẹ lọ sí abúlé tó wà ní ìhà kejì yín. Nígbà tí ẹ bá wọ inú rẹ̀, ẹ ó rí ọmọ ẹranko kan tí a dè mọ́, tí ẹnikẹ́ni kò tíì gùn rí. Ẹ tú u, kí ẹ sì mú un wá.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμην
  choice: abúlé
  rationale: Ó túmọ̀ sí ìletò tàbí abúlé, ó sì bá àyíká ọ̀rọ̀ náà mu ní Yorùbá àdánidá.
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́
  rationale: πῶλος lè túmọ̀ sí ọmọ ẹranko tí a ń gùn; nínú àyíká ìtàn yìí, ‘ọmọ kẹ́tẹ́kẹ́tẹ́’ jẹ́ ìtumọ̀ tó ṣe kedere tí ó sì bá ẹ̀rí ìwé ìhìn rere mu.
- source_word: δεδεμένον
  choice: tí a dè
  rationale: 'Ó pa ìtumọ̀ participle perfect náà mọ́: ẹranko náà wà ní ipò tí wọ́n ti dè é.'
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: tí ẹnikẹ́ni kò tíì gùn rí
  rationale: Ìtumọ̀ gangan ni pé kò sí ènìyàn kankan tí ó ti jókòó lé e rí; ní Yorùbá, ‘gùn’ ni ọ̀rọ̀ àdánidá fún jíjókòó lórí ẹranko fún ìrìn.
- source_word: λύσαντες ... ἀγάγετε
  choice: Ẹ tú u, kí ẹ sì mú un wá
  rationale: 'Ó fi àwọn àṣẹ méjèèjì hàn ní Yorùbá tó ṣàn dáadáa: tú ẹranko náà, lẹ́yìn náà mú un wá.'
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá yẹ, pẹ̀lú èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ’ nítorí pé àwọn ọmọ-ẹ̀yìn méjì ni a rán ní ẹsẹ tó ṣáájú.
