  - severity: low
    issue: “Tí ó bá ní”
    rationale: Ó ṣeé gbà gẹ́gẹ́ bí ìwà gbogbogbò, ṣùgbọ́n “bá” lè gbé ìmọ̀lára ‘if/whenever’ wọlé. “Tí ó ní” ń ṣe àfihàn ẹni tí ó ní gẹ́gẹ́ bí ìtọ́kasí àpapọ̀, bí participle Gíríìkì náà.
