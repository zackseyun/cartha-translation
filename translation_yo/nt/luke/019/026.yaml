id: LUK.19.26
reference: Luke 19:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: yo
  text: Mo sọ fún yín pé, gbogbo ẹni tí ó ní, a ó fi kún un[a]; ṣùgbọ́n ẹni tí kò ní, àní ohun tí ó ní pàápàá ni a ó gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó fún un.” Ọ̀rọ̀ Gíríìkì kò sọ “kún” ní tààrà, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ń fi ìfikún hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ọ̀rọ̀ tààrà hàn, ó sì pa ìtẹnumọ́ gbólóhùn Jésù mọ́.
- source_word: παντὶ τῷ ἔχοντι
  choice: gbogbo ẹni tí ó bá ní
  rationale: Ìṣe-alábápín oníarọ́pò-orúkọ náà ń tọ́ka sí ẹnikẹ́ni ní gbogbogbòò; ‘gbogbo ẹni tí ó bá ní’ jẹ́ Yorùbá kedere tí ó pa àyè ìtumọ̀ ohun tí ẹni náà ní mọ́.
- source_word: δοθήσεται
  choice: ni a ó fi kún fún
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ‘a ó fi fún’; nínú òwe yìí, ìfikún ni a lóye. ‘Fi kún fún’ jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tààrà sílẹ̀.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: ṣùgbọ́n ẹni tí kò ní
  rationale: Ó pa ìyàtọ̀ tí δέ mú wá àti ìtọ́kasí gbogbogbò sí ẹni tí kò ní mọ́.
- source_word: καὶ ὃ ἔχει
  choice: àní ohun tí ó ní pàápàá
  rationale: Àpapọ̀ ‘àní ... pàápàá’ fi agbára ìtẹnumọ́ καί hàn ní Yorùbá àdánidá.
- source_word: ἀρθήσεται
  choice: ni a ó gbà kúrò lọ́wọ́ rẹ̀
  rationale: Ó sọ ìmúkúrò tàbí ìfi-ẹni-du ohun kan ní kedere, ó sì bá fọ́ọ̀mù àìsọ ẹni tó ṣe é nínú Gíríìkì mu.
theological_decisions:
- issue: Agbára ìtumọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìlànà ìfikún àti àdánù
  choice: A túmọ̀ òwe náà ní ṣókí láìfi àlàyé ẹ̀kọ́ ìgbàlà, ẹ̀tọ́ iṣẹ́, tàbí àyànmọ́ kún un.
  alternative: A lè fi hàn ní pàtó pé ó ń sọ nípa ìríjú nínú àkàwé náà, tàbí pé ó jẹ́ ìlànà ìjọba Ọlọ́run ní gbogbogbòò.
  rationale: Ẹsẹ náà kò sọ bí ìlànà náà ṣe ń ṣiṣẹ́ nípa ẹ̀kọ́ ìgbàgbọ́; ìtumọ̀ náà gbọ́dọ̀ pa ṣókí àti ìfọ̀rọ̀wérọ̀ rẹ̀ mọ́, kí àyíká ni ó darí lílò rẹ̀.
translation_notes:
  register: Yorùbá ìlòde-òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘a ó’ láti pa ìṣe àìsọ ẹni tó ṣe é mọ́, a sì yẹra fún fífi ẹni tí ń fún tàbí gba ohun náà hàn nígbà tí Gíríìkì kò dárúkọ rẹ̀.
