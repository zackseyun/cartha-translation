  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ gbólóhùn Gíríìkì mọ́: ìkéde tààrà, ìtọ́kasí gbogbogbò sí ẹni tó ní/ní kò ní, ìyàtọ̀ ṣùgbọ́n, àti ìmúkúrò ohun tí ẹni náà ní. Síbẹ̀, ìpèníjà kékeré wà nínú ìṣètò gbolohun akọkọ.'
  naturalness: “Ni a ó fi kún fún” kò péye ní Yorùbá ìlòde-òní nítorí pé “fi kún” níbí nílò arọ́pò-orúkọ olùgbà (“un”). “A ó fi kún un” jẹ́ ìsopọ̀ tí ó dára, tí ó sì mú ìfikún tí a lóye nínú àyíká hàn. “Tí ó ní” tún sun mọ́ ìṣe ìwà gbogbogbò ti Gíríìkì ju “tí ó bá ní,” tí ó lè mú ìmọ̀lára àdéhùn ọjọ́ iwájú wá díẹ̀.
  terminology: “Àní … pàápàá,” “gbọ́ kúrò lọ́wọ́,” àti “a ó” jẹ́ àwọn ọ̀rọ̀ tó bá ìtẹnumọ́, ìmúkúrò, àti fọ́ọ̀mù aláìsọ ẹni-ṣe ti Gíríìkì mu. Àlàyé ìsàlẹ̀ yẹ kí ó fi aṣayan tààrà náà hàn pẹ̀lú arọ́pò-orúkọ olùgbà.
