  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: yo
  text: wọ́n ń wí pé, “Alábùkún ni Ọba[a] tí ń bọ̀ ní orúkọ Olúwa! Àlàáfíà ní ọ̀run[b], àti ògo ní ibi gíga jù lọ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan tẹ̀ lé ọ̀rọ̀ tí ọ̀pọ̀ ènìyàn mọ̀ dáadáa pé, “Alábùkún ni ẹni tí ń bọ̀ ní orúkọ Olúwa,” ṣùgbọ́n Lúùkù fi “Ọba” sínú ọ̀rọ̀ rẹ̀ ní pàtó.
    reason: alternative_reading
  - marker: b
    text: 'Èyí mú Lúùkù 2:14 wá sí ìrántí, ṣùgbọ́n ibi tí àlàáfíà wà yàtọ̀: níbẹ̀, “àlàáfíà lórí ilẹ̀ ayé”; níhìn-ín, “àlàáfíà ní ọ̀run.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ aláìparí yìí so ìkígbe ọ̀pọ̀ ènìyàn náà mọ́ ẹsẹ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti mú ọ̀rọ̀ tí wọ́n sọ wọlé ní Yorùbá.
- source_word: Εὐλογημένος
  choice: Alábùkún ni
  rationale: Ó pa ìtumọ̀ ìkíni ìbùkún mọ́, ó sì bá èdè ọlọ́lá tí ó ní ìró Sáàmù mu.
- source_word: ὁ ἐρχόμενος
  choice: tí ń bọ̀
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì so ẹni tí ń bọ̀ mọ́ Ọba ní ọ̀nà tí ó rọrùn ní Yorùbá.
- source_word: βασιλεὺς
  choice: Ọba
  rationale: Lúùkù mẹ́nu kan Ọba ní pàtó; a kò yọ ọ́ kúrò tàbí sọ ọ́ di ẹni tí kò ní ipò ọba.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Èyí pa àwòrán èdè Sẹ́mítíkì àti ìtumọ̀ wíwá lábẹ́ àṣẹ Olúwa mọ́ láì ṣe àlàyé ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Àlàáfíà ní ọ̀run
  rationale: Ó pa gbólóhùn ìkígbe tí kò ní ọ̀rọ̀-ìṣe àti ibi tí àlàáfíà wà—ní ọ̀run—mọ́ gẹ́gẹ́ bí orísun Gíríìkì.
- source_word: δόξα ἐν ὑψίστοις
  choice: ògo ní ibi gíga jù lọ
  rationale: Ó tú ọ̀rọ̀ àpèjúwe àwọn ibi gíga jù lọ sí Yorùbá tí ó ṣe kedere, tí ó sì pa ìró ewì rẹ̀ mọ́.
theological_decisions:
- issue: Ìkíni Ọba Mèsáyà nígbà ìwọlé ìṣẹ́gun
  choice: A tú βασιλεὺς ní pàtó sí “Ọba.”
  alternative: “Alábùkún ni ẹni tí ń bọ̀ ní orúkọ Olúwa.”
  rationale: Ọ̀rọ̀ Lúùkù ní βασιλεὺς, nítorí náà pípa “Ọba” mọ́ ń fi ìtẹnumọ́ ipò ọba hàn láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìbáṣepọ̀ pẹ̀lú Lúùkù 2:14
  choice: “Àlàáfíà ní ọ̀run”
  alternative: “Àlàáfíà lórí ilẹ̀ ayé”
  rationale: Orísun náà sọ “ní ọ̀run” ní kedere. A pa ìyàtọ̀ àti ẹdọfu tó wà láàárín ẹsẹ̀ yìí àti Lúùkù 2:14 mọ́, dípò lílo ọ̀rọ̀ ẹsẹ̀ kejì láti mú un bá a mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ ìkígbe náà pa ìṣọ̀kan ewì àti ìfarajọ Lúùkù 2:14 mọ́.
