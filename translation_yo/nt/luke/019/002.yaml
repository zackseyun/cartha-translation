  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: yo
  text: Sì kíyèsí i, ọkùnrin kan wà tí a ń pè ní Sákíọ́sì; òun sì jẹ́ olórí agbowó-orí, ó sì jẹ́ ọlọ́rọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa iṣẹ́ àmì ọ̀rọ̀ tí ń darí àfiyèsí mọ́, ó sì bá ìtàn Yorùbá àdánidá mu.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Ó fi hàn pé ẹni náà jẹ́ akọ, ó sì jẹ́ ẹnì kọ̀ọ̀kan tí a ṣẹ̀ṣẹ̀ mú wọ inú ìtàn.
- source_word: ὀνόματι καλούμενος
  choice: tí orúkọ rẹ̀ ń jẹ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé a ń pe ẹnì kan ní orúkọ kan, láì tẹ̀ lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì ní líle.
- source_word: Ζακχαῖος
  choice: Sákíọ́sì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà ìkọ̀wé Yorùbá.
- source_word: αὐτὸς ἦν
  choice: òun sì jẹ́
  rationale: “Òun” pa ìtẹnumọ́ díẹ̀ àti ìpadà sí ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ mọ́ láì sọ ọ́ di líle jù.
- source_word: ἀρχιτελώνης
  choice: olórí àwọn agbowó orí
  rationale: Ó sọ ipò àṣẹ rẹ̀ láàárín àwọn agbowó orí ní kedere, ó sì jẹ́ Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: αὐτὸς πλούσιος
  choice: ó sì jẹ́ ọlọ́rọ̀
  rationale: Ó túmọ̀ πλούσιος ní tààrà, nígbà tí àsopọ̀ “sì” ń pa ìfikún àpèjúwe kejì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn. A lo àmì olójú méjì láti pa ìṣètò gbolohun Gíríìkì mọ́ láì fi ọ̀rọ̀ tí kò sí nínú orísun kún un.
