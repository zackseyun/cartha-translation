  source_fidelity: 'Ìtumọ̀ náà ń mú àwọn èrò pàtàkì Gíríìkì náà wá: ọkùnrin kan, orúkọ Sákíọ́sì, ipò rẹ̀ gẹ́gẹ́ bí olórí agbowó-orí, àti ọrọ̀ rẹ̀. Síbẹ̀, “Sì wò ó” dà bí àṣẹ pé kí a wo ẹni kan, kì í sì ṣiṣẹ́ gẹ́gẹ́ bí àmì ìfẹ̀sí ìtàn ἰδοὺ ní ti ẹ̀dá Yorùbá.'
