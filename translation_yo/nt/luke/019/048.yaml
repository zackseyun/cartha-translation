source:
  edition: SBLGNT
  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: yo
  text: Wọ́n kò sì rí ohun tí wọ́n lè ṣe[a], nítorí gbogbo àwọn ènìyàn ń tẹ́tí sí i tọkàntọkàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ gangan: “gbogbo àwọn ènìyàn ń rọ̀ mọ́ ọn, wọ́n ń tẹ́tí sí i.” Àṣà-ọrọ Gíríìkì náà ń fi bí wọ́n ṣe ń tẹ́tí sí Jesu pẹ̀lú gbogbo àfiyèsí àti ìtara hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: wọn kò sì rí
  rationale: Ọ̀rọ̀-ìṣe àìpé pẹ̀lú ìkọ̀sẹ̀ fi hàn pé wọn ń bá a lọ láìrí ọ̀nà tí wọn yóò gbà; ‘wọn kò rí’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: τὸ τί ποιήσωσιν
  choice: ohun tí wọn lè ṣe
  rationale: 'Èyí pa ìtumọ̀ ìfọ̀rọ̀wérọ̀ inú ọkàn mọ́: irú ìgbésẹ̀ wo ni ó ṣeé ṣe fún wọn láti gbé?'
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: nítorí gbogbo àwọn ènìyàn
  rationale: ‘Nítorí’ mú ipa ìdí tí γάρ ní jáde, ‘gbogbo àwọn ènìyàn’ sì pa ìtẹnumọ́ ἅπας mọ́.
- source_word: ἐξεκρέματο αὐτοῦ ἀκούων
  choice: ń tẹ́tí sí i tọkàntọkàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì túmọ̀ sí fífi gbogbo àfiyèsí tẹ́tí sí Jesu pẹ̀lú ìfẹ́ gidigidi. Ọ̀rọ̀ Yorùbá yìí sọ àṣà-ọrọ náà ní kedere láìfi ‘ọ̀rọ̀ rẹ̀’ kún ohun tí Gíríìkì sọ ní tààrà.
theological_decisions: []
translation_notes:
  register: Yorùbá àtẹ̀jáde, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. ‘Ń tẹ́tí sí i tọkàntọkàn’ jẹ́ àdánidá ju títú àṣà-ọrọ Gíríìkì ‘rọ̀ mọ́ ọn’ sínú àkọ́kọ́ ẹsẹ̀ lọ; àlàyé ẹsẹ̀ ìsàlẹ̀ pa àwòrán gangan náà mọ́.
