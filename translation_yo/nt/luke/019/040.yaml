language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: yo
  text: Ó sì dáhùn pé, “Mo sọ fún yín, bí àwọn wọ̀nyí bá dákẹ́[a], àwọn òkúta yóò ké jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “dákẹ́ rárá” tàbí “pa ẹnu mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Ó sì dáhùn pé
  rationale: Yorùbá máa ń fi ọ̀rọ̀ ìdáhùn àti ọ̀rọ̀ sísọ hàn lọ́nà àdánidá pẹ̀lú ‘dáhùn pé.’ Èyí pa ìtumọ̀ apá-ọ̀rọ̀ ἀποκριθεὶς àti ọ̀rọ̀-ìṣe pàtàkì εἶπεν mọ́ láìsọ ọ̀rọ̀ náà di àtúnwí tí kò wọ́pọ̀.
- source_word: Λέγω ὑμῖν
  choice: Mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì ní agbára láti fi ìkéde tààràtà àti ọlá-àṣẹ ọ̀rọ̀ Jésù hàn.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: A pa ọ̀rọ̀ atọ́ka náà mọ́ láìfi ‘àwọn ènìyàn’ tàbí ‘àwọn ọmọ-ẹ̀yìn’ kún un, nítorí àyíká ọ̀rọ̀ ló ń fi ẹni tí ó ń tọ́ka sí hàn.
- source_word: σιωπήσουσιν
  choice: bá dákẹ́
  rationale: Pẹ̀lú àmì ipò ‘bá,’ ‘dákẹ́’ ń sọ ìdákẹ́ tí yóò ṣẹlẹ̀ gẹ́gẹ́ bí ipò àní-àní; ó lè túmọ̀ sí kí wọ́n dá ọ̀rọ̀ dúró tàbí kí wọ́n wà ní ìdákẹ́, bí ọ̀rọ̀ Gíríìkì ṣe gbà.
- source_word: οἱ λίθοι
  choice: àwọn òkúta
  rationale: Èyí ni ìtumọ̀ tààràtà λίθοι, ó sì pa àwòrán gidi àti líle inú gbólóhùn náà mọ́.
- source_word: κράξουσιν
  choice: yóò ké jáde
  rationale: ‘Ké jáde’ ń fi ohùn gíga àti ìkéde gbangba tí κράζω ní hàn, ó sì bá àwòrán alágbára inú ẹsẹ náà mu.
theological_decisions:
- issue: Bóyá kí a ṣàlàyé nínú ọ̀rọ̀ pàtàkì pé kíké àwọn òkúta jẹ́ àkàwé tàbí iṣẹ́ ìyanu gidi
  choice: 'A pa àwòrán tààràtà náà mọ́: ‘àwọn òkúta yóò ké jáde.’'
  alternative: Kí a túmọ̀ ọ́ sí pé àwọn òkúta yóò jẹ́rìí lọ́nà àkàwé, tàbí pé gbogbo ìṣẹ̀dá yóò yin Ọlọ́run.
  rationale: Ọ̀rọ̀ Gíríìkì kò ṣàlàyé irú àwòrán náà. Fífi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ó ti rí ń pa agbára àsọtẹ́lẹ̀ àti ìfọkànsìn rẹ̀ mọ́, láìpinnu bóyá ó jẹ́ àsọdùn, àwòrán àsọtẹ́lẹ̀, tàbí ohun ìyanu tí ó lè ṣẹlẹ̀.
translation_notes:
  register: Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ó sì dáhùn pé’ yẹra fún àtúnwí tí kò wọ́pọ̀, ‘Mo sọ fún yín’ sì pa agbára ọ̀rọ̀ Jésù mọ́. A fi àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ tí àṣàyàn ìtumọ̀ rẹ̀ kan.
