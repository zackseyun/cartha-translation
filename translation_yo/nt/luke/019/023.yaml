source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: yo
  text: Kí sì ni ìdí tí ìwọ kò fi fi owó mi sí ilé ìfowópamọ́[a]? Nígbà tí mo dé, èmi ìbá ti gba owó náà padà pẹ̀lú èlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi owó mi sí ọ̀dọ̀ àwọn oníṣòwò owó”; ní tààrà, “fi owó mi lé orí tábìlì.”
    reason: ìtumọ̀ mìíràn fún gbolóhùn ìṣòwò Gíríìkì náà; ó pa àwòrán “tábìlì” mọ́.
lexical_decisions:
- source_word: διὰ τί
  choice: Kí sì ni ìdí tí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ìdí, ó sì pa ohùn ìbáwí inú ọ̀rọ̀ náà mọ́.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: fi ... sí ilé ìfowópamọ́
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ ní tààrà sí fífi owó ‘lé orí tábìlì,’ τράπεζα ní àyíká ìṣòwò yìí ń tọ́ka sí ibi tí wọ́n ti ń fi owó pamọ́ tàbí ṣe iṣẹ́ ìnáwó. ‘Ilé ìfowópamọ́’ mú ìṣe náà yé òǹkàwé òde òní.
- source_word: μου τὸ ἀργύριον
  choice: owó mi
  rationale: ἀργύριον lè túmọ̀ sí fàdákà tàbí owó; ‘owó’ ni ó bá àyíká ìnáwó yìí mu jù lọ, kò sì ní mú òǹkàwé rò pé irin fàdákà nìkan ni.
- source_word: κἀγὼ ἐλθὼν
  choice: Nígbà náà, nígbà tí mo bá dé
  rationale: A sọ àpólà aláṣìkò náà ní Yorùbá àdánidá, ‘Nígbà náà’ sì fi ìyọrísí ohun tí ó yẹ kí ìránṣẹ́ náà ṣe hàn.
- source_word: σὺν τόκῳ
  choice: pẹ̀lú èlé
  rationale: ‘Èlé’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún owó àfikún tí owó tí a fi pamọ́ tàbí tí a yá ń mú wá.
- source_word: αὐτὸ ἔπραξα
  choice: èmi ìbá gba owó náà pa dà
  rationale: πράσσω níbí ní ìtumọ̀ ìṣòwò ti gbígba iye owó tí ó tọ́ ẹni. ‘Gba ... pa dà’ mú ìtumọ̀ gbígba olú owó náà àti èlé rẹ̀ yé ni Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ilé ìfowópamọ́’ gẹ́gẹ́ bí ìṣọ̀kan iṣẹ́ fún àwòrán tábìlì oníṣòwò owó ti ayé àtijọ́.
