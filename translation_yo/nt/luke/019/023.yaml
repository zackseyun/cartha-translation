review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè ìbáwí náà, fífi owó sínú ilé ìfowópamọ́, àti gbígba a pẹ̀lú èlé hàn dáadáa. Ṣùgbọ́n “nígbà tí mo bá dé” sábà ń tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú; ọrọ̀ Gíríìkì ní ipò ìfẹ́hónúhàn tí kò ṣẹ ní ìgbà tí olúwa dé tẹlẹ̀, nítorí náà a nílò “mo dé” pẹ̀lú “ìbá ti gba.”
  naturalness: “Kí sì ni ìdí tí ìwọ kò fi fi owó mi sí ilé ìfowópamọ́?” jẹ́ Yorùbá boṣewa tó rọrùn. Àtúnṣe ọ̀rọ̀ ìkẹyìn náà mú àkókò àti ipò ìfẹ́hónúhàn rẹ̀ jẹ́ èyí tí ó dáa síi, láì jẹ́ kí ó dùn bí àsọtẹ́lẹ̀ ọjọ́ iwájú.
  terminology: “Ilé ìfowópamọ́” jẹ́ ìtumọ̀ òde òní tó bá ipa τράπεζα nínú àyíká ìṣòwò mu. “Èlé” bá τόκος mu. Àkọsílẹ̀ ẹsẹ̀ kan ní a fi kún un láti pa àwòrán gidi ti “tábìlì”/ibi oníṣòwò owó mọ́.
