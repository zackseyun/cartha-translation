  to: Kí sì ni ìdí tí ìwọ kò fi fi owó mi sí ilé ìfowópamọ́[a]? Nígbà tí mo dé, èmi ìbá ti gba owó náà padà pẹ̀lú èlé.
  rationale: A tún “mo bá dé” ṣe sí “mo dé,” a sì fi “ti” kún “ìbá ti gba” kí Yorùbá lè sọ ìfẹ́hónúhàn ohun tí ó yẹ kí ó ti ṣẹ ní ìgbà tí olúwa dé. A tún ṣàfikún àkọsílẹ̀ ẹsẹ̀ láti ṣàlàyé ìtumọ̀ ìṣòwò ti τράπεζα, láì yí ìtumọ̀ àkọ́kọ́ padà.
