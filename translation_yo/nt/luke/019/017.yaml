  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ó ṣe dáadáa, ìránṣẹ́ rere[a]; nítorí pé o ti jẹ́ olóòtítọ́ nínú ohun kékeré jùlọ, máa ní àṣẹ lórí ìlú mẹ́wàá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹrú.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ìránṣẹ́” tàbí “ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Ó ṣe dáadáa
  rationale: Ọ̀rọ̀ ìyìn tó bá èdè Yorùbá òde òní mu, tí ó sì pa ìmọ̀lára ìtẹ́wọ́gbà inú Gíríìkì mọ́.
- source_word: ἀγαθὲ δοῦλε
  choice: ìránṣẹ́ rere
  rationale: Ó túmọ̀ àpèjúwe vocative náà ní tààrà; “ìránṣẹ́” bá àyíká òwe ọ̀gá àti ẹni tó ń ṣiṣẹ́ fún un mu, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ “ẹrú” mọ́.
- source_word: ἐν ἐλαχίστῳ
  choice: nínú ohun kékeré púpọ̀
  rationale: Ó fi hàn pé ohun tí a fi lé e lọ́wọ́ kéré gan-an, láì dá ohun pàtó tí Gíríìkì kò sọ sí i.
- source_word: πιστὸς ἐγένου
  choice: o jẹ́ olóòtítọ́
  rationale: Ó tẹ̀lé ìtumọ̀ ìdájọ́ pé ẹni náà jẹ́ ẹni tí a lè gbẹ́kẹ̀ lé, láì fi ìtumọ̀ àfikún “o fi ara rẹ hàn” sínú rẹ̀.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: máa ṣe aláṣẹ
  rationale: Ìlànà àṣẹ periphrastic yìí ń sọ pé kí ó wà ní ipò àṣẹ; gbolohun Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ipò àṣẹ náà mọ́.
- source_word: ἐπάνω δέκα πόλεων
  choice: lórí ìlú mẹ́wàá
  rationale: “Lórí” fi àṣẹ ìṣàkóso hàn, “ìlú mẹ́wàá” sì jẹ́ ìbámu tààrà pẹ̀lú πόλεων.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àyíká òwe ọ̀gá àti ìránṣẹ́
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: “Ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé nínú àyíká yìí, tí ó sì pa ìbáṣepọ̀ ẹni tó wà lábẹ́ àṣẹ ọ̀gá mọ́. Nítorí δοῦλος tún lè túmọ̀ sí “ẹrú,” a pa àṣàyàn líle yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá. Àmì àlàyé [a] wà lẹ́yìn gbogbo ẹsẹ̀ nítorí ó ń ṣàlàyé “ìránṣẹ́” nínú ọ̀rọ̀ inú àyọlò.
