lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó pa ìsopọ̀ ìtàn lasán mọ́ láìfi ìtumọ̀ àkókò tàbí ìtakora kún un.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n wí fún un pé
  rationale: Aoristi náà jẹ́ ìṣe tó ṣẹlẹ̀ nínú ìtàn; ‘wí fún un’ sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún ọ̀rọ̀ tí a sọ sí ẹnì kan.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ κύριος àti ìmọ̀lára àṣẹ mọ́; nínú àkópọ̀ òwe yìí, ó tún lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí ọ̀gá.
- source_word: ἔχει
  choice: ó ní
  rationale: Ó túmọ̀ ìní ní tààrà, láìfi ìtẹnumọ́ bí ‘tẹ́lẹ̀’ kún ohun tí Gíríìkì sọ.
- source_word: δέκα μνᾶς
  choice: mínà mẹ́wàá
  rationale: A pa orúkọ owó ìgbàanì náà mọ́ dípò lílo orúkọ owó òde òní tó lè mú òye ṣìnà.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ ìkíni tààrà nínú òwe
  choice: Olúwa
  alternative: Ọ̀gá / Alàgbà
  rationale: ‘Olúwa’ pa ìtumọ̀ àti ìmọ̀lára àṣẹ inú ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé ẹsẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ó lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ lasán nínú àyíká òwe, láìdá ìjẹ́wọ́ nípa Kristi lé e lórí.
translation_notes:
  register: Yorùbá àมาตรฐาน tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo ‘wí’ fún ìforúkọsílẹ̀ Bíbélì tó ní iyì, ‘mínà’ sì jẹ́ àkọsílẹ̀ ohùn ọ̀rọ̀ owó Gíríìkì. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
