id: LUK.19.13
reference: Luke 19:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: yo
  text: Ó sì pe mẹ́wàá lára àwọn ẹrú tirẹ̀, ó fún wọn ní owó mínà mẹ́wàá[b], ó sì sọ fún wọn pé, “Ẹ fi í ṣòwò títí èmi yóò fi dé.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Mínà jẹ́ ìwọ̀n owó ní ayé àtijọ́.
    reason: cultural_note
  - marker: c
    text: Ó tún lè jẹ́, “Ẹ máa fi í ṣe òwò títí èmi yóò fi dé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Ó sì pe
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtúmọ̀ yìí fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δούλους
  choice: àwọn ẹrú
  rationale: Nínú àkópọ̀ ọ̀rọ̀ olúwa àti àwọn ẹni tí ó jẹ́ tirẹ̀, “ẹrú” fi ipò àwùjọ àti ìní ẹni hàn kedere; “ìránṣẹ́” lè dín agbára ọ̀rọ̀ Gíríìkì náà kù.
- source_word: ἑαυτοῦ
  choice: tirẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ ìpadà-sẹ́yìn mọ́, pé àwọn ẹrú náà jẹ́ tirẹ̀ gan-an.
- source_word: μνᾶς
  choice: owó mínà
  rationale: A pa orúkọ ìwọ̀n owó ayé àtijọ́ náà mọ́ ní àfọwọ́kọ, a sì fi “owó” kún un kí òǹkàwé lè mọ ohun tí ó jẹ́.
- source_word: Πραγματεύσασθε
  choice: Ẹ fi í ṣòwò
  rationale: Àṣẹ náà túmọ̀ sí lílo owó tí a fi lé wọn lọ́wọ́ fún òwò; gbólóhùn Yorùbá yìí jẹ́ ti àdánidá láì sọ ọ̀nà ìṣòwò pàtó.
- source_word: ἐν ᾧ ἔρχομαι
  choice: títí èmi yóò fi dé
  rationale: Ìtumọ̀ àkókò tí àkópọ̀ Gíríìkì náà ní ni “títí èmi yóò fi dé/padà”; “dé” bá àkópọ̀ ìtàn mu, “èmi” sì pa ìtẹnumọ́ olùsọ̀rọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkópọ̀ àkàwé olúwa àti ẹrú
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àwọn ẹni náà wà lábẹ́ olúwa, wọ́n sì jẹ́ tirẹ̀; “ẹrú” ló fi òtítọ́ ipò àwùjọ inú àkópọ̀ ọ̀rọ̀ náà hàn jù, láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo “ẹrú” fún ìbáṣepọ̀ olúwa-ẹrú, “owó mínà” fún ìtumọ̀ àṣà, àti “ẹ fi í ṣòwò” gẹ́gẹ́ bí àṣẹ ọ̀pọ̀ ènìyàn. Àmì [b] àti [c] wà nínú ọ̀rọ̀; a kò fi [a] sí i nítorí pé kò sí àlàyé ẹsẹ̀ [a] nínú àkọsílẹ̀ Yorùbá yìí.
