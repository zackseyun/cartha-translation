source:
  edition: SBLGNT
  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: yo
  text: Ó sì sọ fún àwọn tí ó dúró níbẹ̀ pé, “Ẹ gba mina náà[a] kúrò lọ́dọ̀ rẹ̀, kí ẹ sì fi fún ẹni tí ó ní mina mẹ́wàá náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ìbílẹ̀, “páùnù.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹ̀ka owó ìgbàanì kan, mina.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεστῶσιν
  choice: àwọn tí ó dúró níbẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí a lò gẹ́gẹ́ bí orúkọ, ó ń tọ́ka sí àwọn tí ó wà nítòsí. ‘Àwọn tí ó dúró níbẹ̀’ pa àwòrán ìṣẹ̀lẹ̀ náà mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Ẹ gba ... kúrò lọ́wọ́ rẹ̀
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni Ἄρατε, ἀπό sì fi ìyapa hàn. Gbólóhùn yìí sọ ìtumọ̀ ‘mú un kúrò ní ìkáwọ́ rẹ̀’ ní Yorùbá tó ṣe kedere.
- source_word: μνᾶν
  choice: mina
  rationale: Mina jẹ́ ẹ̀ka owó ìgbàanì. Títọ ohùn rẹ̀ jáde gẹ́gẹ́ bí ‘mina’ pa àyíká ìtàn mọ́, kò sì mú kí a rò pé owó ìgbà òde òní ni.
- source_word: δότε
  choice: kí ẹ sì fi fún
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni δότε, ó sì túmọ̀ sí fífi ohun kan fún ẹlòmíràn. Ìtumọ̀ yìí jẹ́ ti ara Yorùbá nínú ọ̀wọ́ àṣẹ méjì tó tẹ̀ lé ara wọn.
- source_word: τῷ ... ἔχοντι
  choice: ẹni tí ó ní
  rationale: Articular participle náà dúró bí orúkọ, kò sì sọ akọ tàbí abo ní pàtó. ‘Ẹni tí ó ní’ pa èyí mọ́ láìfi ‘ọkùnrin’ kún un.
- source_word: τὰς δέκα μνᾶς
  choice: mina mẹ́wàá náà
  rationale: ‘Náà’ ṣàfihàn article Gíríìkì, ó sì ń tọ́ka sí iye tí a ti mẹ́nu kàn tẹ́lẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ μνᾶ, ẹ̀ka owó ìgbàanì
  choice: mina
  alternative: pọ́ọ̀nù
  rationale: ‘Mina’ pa orúkọ ẹ̀ka owó Gíríìkì àti àyíká ìtàn mọ́. ‘Pọ́ọ̀nù’ lè mú kí òǹkàwé ronú nípa ẹ̀ka owó tàbí ìwọ̀n òde òní tí kò dọ́gba pẹ̀lú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ẹ’ nínú àṣẹ láti fi ọ̀pọ̀ ènìyàn inú ọ̀rọ̀ Gíríìkì hàn.
