id: LUK.19.10
reference: Luke 19:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn wá láti wá àwọn tí ó sọnù[a], kí ó sì gbà wọ́n là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó sọnù.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan, kò sì tọ́ka sí akọ tàbí abo; a lè lóye rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: wá
  rationale: Aorist náà sọ ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí ohun tí ó ṣẹlẹ̀; “wá” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa ìtumọ̀ iṣẹ́ tí ó mú un wá mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún ọ̀rọ̀ tí ó ṣáájú hàn; “Nítorí” so ẹsẹ yìí mọ́ àyíká rẹ̀ ní kedere.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa orúkọ oyè tí Jésù ń lò fún ara rẹ̀ mọ́, pẹ̀lú ìjìnlẹ̀ ìtumọ̀ rẹ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì.
- source_word: ζητῆσαι
  choice: láti wá
  rationale: Infinitive náà ń sọ ète wí; “láti wá” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún fífi ìwádìí onítumọ̀ hàn.
- source_word: σῶσαι
  choice: kí ó sì gbà wọ́n là
  rationale: “Gbà … là” jẹ́ ìtumọ̀ Yorùbá àdánidá fún σῴζω, ó sì pa ìtumọ̀ ìgbàlà tó ju ìgbàlà ara lásán lọ mọ́ nínú àyíká Lúùkù 19:9.
- source_word: τὸ ἀπολωλός
  choice: àwọn tí ó sọnù
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan tí kò tọ́ka sí akọ tàbí abo, ó lè dúró fún gbogbo ẹ̀ka àwọn ẹni tí ó sọnù. Yorùbá nílò kí olùtọ́kasí ẹni hàn nínú gbólóhùn yìí; “àwọn tí ó sọnù” mú ìtumọ̀ àpapọ̀ náà jáde láìfi sí Sákéù nìkan.
theological_decisions:
- issue: Ìwọ̀n àti ìtumọ̀ τὸ ἀπολωλός
  choice: àwọn tí ó sọnù
  alternative: ohun tí ó sọnù
  rationale: Àyíká náà kan Sákéù lẹ́sẹ̀kẹsẹ̀, ṣùgbọ́n gbólóhùn náà tún ṣàlàyé iṣẹ́ Jésù ní gbòòrò. Ìtumọ̀ àpapọ̀ yìí pa ìwọ̀n náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ẹyọ àti àìdánimọ̀ ẹni nínú Gíríìkì hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo “Ọmọ Ènìyàn” gẹ́gẹ́ bí orúkọ oyè Bíbélì; a sì tún ohun tí “àwọn” ń tọ́ka sí ṣe nínú “wọ́n” nítorí ìṣọ̀kan gírámà Yorùbá.
