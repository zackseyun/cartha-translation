  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: «Nítorí» ń fi γάρ hàn, «Ọmọ Ènìyàn» pa oyè náà mọ́, àwọn ọ̀rọ̀ «láti wá» àti «kí ó sì gbà wọ́n là» ń ṣàfihàn ète méjèèjì tí ζητῆσαι καὶ σῶσαι sọ. «Àwọn tí ó sọnù» jẹ́ ìtumọ̀ àpapọ̀ tí ó yẹ fún τὸ ἀπολωλός nínú àyíká yìí, láìdín un kù sí Sákéù nìkan.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé tó dáa, ó sì ní ìṣàn ọrọ̀ Bíbélì tó wúlò. Ìtúnwí «wá láti wá» lè dà bí ìtúnwí ní ojú ẹ̀dá, ṣùgbọ́n ó jẹ́ ohun àdánidá, ó sì yẹ níbi tí «wá» àkọ́kọ́ túmọ̀ sí ‘came,’ èkejì sì túmọ̀ sí ‘seek.’ Àmì ohùn àti àmì ìsàlẹ̀ wà ní ìbámu pẹ̀lú Yorùbá ìwọ̀ntúnwọ̀nsì.
  terminology: «Ọmọ Ènìyàn» jẹ́ oyè Bíbélì tí a mọ̀ dáadáa fún ὁ υἱὸς τοῦ ἀνθρώπου. «Gbà wọ́n là» yẹ fún σῶσαι nínú ọ̀rọ̀ ìgbàlà Lúùkù 19, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un. Àlàyé ìsàlẹ̀ náà ṣàlàyé ẹyọ-neuter Gíríìkì náà ní tòótọ́, ó sì pa ìtumọ̀ mìíràn «ohun tí ó sọnù» sílẹ̀.
