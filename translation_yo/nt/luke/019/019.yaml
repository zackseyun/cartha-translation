  verdict: revise
  source_fidelity: The draft accurately represents the narrative connective, the addressee ('this one also'), the emphatic direct address, and jurisdiction over five cities. However, 'máa ṣe olórí' can naturally be heard as habitual/prospective ('will/keep acting as a leader') rather than the direct appointment imperative expressed by ἐπάνω γίνου.
  naturalness: The Yoruba is generally clear and idiomatic. Replacing 'máa ṣe olórí' with 'jẹ́ olórí' gives a more direct and natural imperative in this formal parabolic pronouncement.
  terminology: '''Olórí ìlú márùn-ún'' suitably conveys being placed in authority over five cities. ''Ìlú'' is an appropriate equivalent for πόλεων here. The alternative renderings should remain explicitly tied to the authority/appointment idiom.'
  issues:
