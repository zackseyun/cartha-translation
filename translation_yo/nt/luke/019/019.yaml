  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: yo
  text: Ó sì tún sọ fún ẹni yìí pé, “Ìwọ náà, jẹ́ olórí ìlú márùn-ún.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àṣẹ lórí ìlú márùn-ún,” tàbí, “kí a fi ọ́ ṣe olórí ìlú márùn-ún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Ó sọ
  rationale: Aorist λέγω jẹ́ ọ̀rọ̀ ìtàn tó rọrùn, tí ‘ó sọ’ sì túmọ̀ rẹ̀ lọ́nà àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ ìtàn tó fẹ́rẹ̀ẹ́ má ní ìtakora; ‘sì’ bá ìṣàn èdè Yorùbá mu.
- source_word: καὶ τούτῳ
  choice: tún ... fún ẹni yìí
  rationale: ‘Ẹni yìí’ pa agbára demonstrative τούτῳ mọ́, ‘tún’ sì fi ìtumọ̀ καί hàn nínú ìtẹ̀síwájú pẹ̀lú ìránṣẹ́ tó ṣáájú.
- source_word: Καὶ σὺ
  choice: Ìwọ náà
  rationale: Ó pa ìtẹnumọ́ sí ẹni tí a ń bá sọ àti ìbára-dọ́gba pẹ̀lú ìránṣẹ́ àkọ́kọ́ mọ́.
- source_word: ἐπάνω γίνου
  choice: máa ṣe olórí
  rationale: Àṣẹ present γίνου pẹ̀lú ἐπάνω ń tọ́ka sí fífi ẹni sí ipò àṣẹ; ‘máa ṣe olórí’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: πέντε πόλεων
  choice: ìlú márùn-ún
  rationale: πόλις túmọ̀ sí ìlú, genitive náà sì tọ́ka sí àwọn ìlú tí yóò wà lábẹ́ àṣẹ rẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. ‘Máa ṣe olórí’ mú àṣẹ àti yíyan sí ipò tó wà nínú ἐπάνω γίνου jáde láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
