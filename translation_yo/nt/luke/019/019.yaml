    issue: The main rendering 'máa ṣe olórí' is aspectually less precise for ἐπάνω γίνου.
    rationale: The Greek is a present imperative assigning authority. In Yoruba, 'máa ṣe' may suggest future or habitual conduct, whereas 'jẹ́ olórí' directly expresses the commanded/appointed status without adding that nuance.
