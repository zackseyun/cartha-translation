id: LUK.19.18
reference: Luke 19:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: yo
  text: Ẹlẹ́ẹ̀kejì sì dé, ó ní, ‘Mínà rẹ, Olúwa, ti jèrè mínà márùn-ún.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ẹlẹ́ẹ̀kejì
  rationale: Ó túmọ̀ sí ẹni kejì nínú àwọn ìránṣẹ́ tí ń wá jíhìn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μνᾶ
  choice: mínà
  rationale: A ṣe àyálò orúkọ ẹyọ owó Gíríìkì náà dípò yíyí i padà sí iye owó òde òní, nítorí iye rẹ̀ kò ní ìbámu pípé kan.
- source_word: κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè fún ẹni tó ní àṣẹ lórí ìránṣẹ́ ni ní àyíká òwe yìí; ‘Olúwa’ pa ọ̀wọ̀ àti ipò rẹ̀ mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: ti jèrè mínà márùn-ún
  rationale: Ní àyíká ìṣòwò yìí, gbolohun náà túmọ̀ sí pé mínà náà mú èrè mínà márùn-ún wá; ‘jèrè’ jẹ́ Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní tààrà pé ‘ṣe’ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριε nínú òwe
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ ń ṣàfihàn ọ̀wọ̀ àti àṣẹ tí ọ̀rọ̀ Gíríìkì náà ní, ṣùgbọ́n àyíká òwe ni ó pinnu ìtumọ̀ rẹ̀; a kò sọ ní kedere pé ó jẹ́ àkọlé Ọlọ́run níbí.
translation_notes:
  register: Yorùbá àkànṣe, ọlọ́wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìṣísẹ̀ gbolohun Gíríìkì mọ́ ní ọ̀nà àdánidá.
