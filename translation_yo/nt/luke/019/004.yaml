  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: yo
  text: Ó sì sáré lọ síwájú, ó gun igi síkámọ̀ kan[a] kí ó lè rí i, nítorí pé ó fẹ́rẹ̀ẹ́ gba ibẹ̀ kọjá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní pàtó sí i, igi ọ̀pọ̀tọ́-síkámọ̀ (Ficus sycomorus).
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν … εἰς τὸ ἔμπροσθεν
  choice: sáré lọ síwájú
  rationale: Ó mú ìṣe sísáré àti èrò lílọ dé iwájú hàn ní Yorùbá àdánidá, láìṣe àtúnṣe ọ̀rọ̀ Gíríìkì náà ní ọ̀nà líle.
- source_word: ἀνέβη ἐπὶ
  choice: gun orí
  rationale: ‘Gun orí igi’ ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún gígun igi.
- source_word: συκομορέαν
  choice: igi síkámọ̀ kan
  rationale: Orúkọ igi tí a mọ̀ sí síkámọ̀ ni a lò nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ fi irú ọ̀pọ̀tọ́ tí ó jẹ́ hàn ní pàtó sí i.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: kí ó lè rí i
  rationale: Ó pa ète ìṣe náà mọ́, ó sì lo ọ̀rọ̀ Yorùbá àdánidá. Arọ́pò-orúkọ ‘i’ kò fi orúkọ ẹni náà kún ohun tí Gíríìkì sọ.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ṣàfihàn ìdí tí ó fi gun igi ní kedere.
- source_word: ἐκείνης
  choice: ibẹ̀
  rationale: Ó pa ìtọ́kasí ibi tàbí ipa ọ̀nà náà mọ́ láìfi ‘ọ̀nà’ tàbí ‘òpópónà’ tí kò hàn gbangba nínú Gíríìkì kún un.
- source_word: ἤμελλεν διέρχεσθαι
  choice: ó ń bọ̀ wá gba ibẹ̀ kọjá
  rationale: Ọ̀rọ̀ yìí sọ ìṣe tí ó sún mọ́lé àti lílọ gba ibi náà kọjá ní Yorùbá tí ó ṣeé lóye, láìtúmọ̀ μέλλω sí ìfẹ́ ọkàn lásán.
theological_decisions: []
