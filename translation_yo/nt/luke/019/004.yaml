  source_fidelity: Ìbẹ̀rẹ̀ ẹsẹ náà túmọ̀ προδραμὼν εἰς τὸ ἔμπροσθεν, ἀνέβη ἐπὶ, àti ète ἵνα ἴδῃ αὐτόν dáadáa. Ṣùgbọ́n “ó ń bọ̀ wá” jẹ́ ìṣe tí ń lọ lọ́wọ́/ìbòwọ́ sí ibi kan, kò sì fara hàn ní kedere gẹ́gẹ́ bí μέλλω (“fẹ́rẹ̀ẹ́”/“wà ní ìfẹ́ láti”) pẹ̀lú infinitive. A tún le sọ gígun igi ní ọ̀nà tí ó rọrùn jù.
