  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A gbe àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ‘igi síkámọ̀,’ ibi tí àlàyé ọ̀rọ̀ náà tọ́ sí.
