id: LUK.19.46
reference: Luke 19:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: yo
  text: Ó ń wí fún wọn pé, “A ti kọ ọ́ sílẹ̀ pé, ‘Ilé mi yóò sì jẹ́ ilé àdúrà,’[a] ṣùgbọ́n ẹ̀yin ti sọ ọ́ di ihò àwọn ọlọ́ṣà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Tẹ́ńpìlì mi yóò jẹ́ ilé àdúrà.” Ọ̀rọ̀ Gíríìkì náà ní “ilé mi,” ó sì jẹ́ ìfẹnukò sí Aísáyà 56:7.
    reason: lexical_alternative
  - marker: b
    text: “Ihò àwọn ọlọ́ṣà” jẹ́ ìfẹnukò sí Jeremáyà 7:11. A tún lè tú “àwọn ọlọ́ṣà” sí “àwọn adigunjalè.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Ó ń sọ fún wọn pé
  rationale: Ó pa ìṣàn participle ti ìtàn ṣáájú mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Γέγραπται
  choice: A ti kọ ọ́ pé
  rationale: Ìtumọ̀ àdánidá fún perfect passive tí a fi ń tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí ohun tí a kọ tí ó sì dúró.
- source_word: Καὶ ἔσται ὁ οἶκός μου
  choice: Ilé mi yóò sì jẹ́
  rationale: Ó pa καί (‘sì’) àti ìtumọ̀ ọjọ́ iwájú mọ́, ó sì tú οἶκος ní tààràtà sí ‘ilé’ dípò ṣíṣe àlàyé rẹ̀ sí ‘tẹ́ńpìlì.’
- source_word: οἶκος προσευχῆς
  choice: ilé àdúrà
  rationale: Gbólóhùn Yorùbá tí ó rọrùn, tí ó sì pa ìtumọ̀ genitive náà mọ́.
- source_word: ὑμεῖς δὲ
  choice: ṣùgbọ́n ẹ̀yin
  rationale: ‘Ẹ̀yin’ fi ìtẹnumọ́ orúkọ arọ́pò hàn, ‘ṣùgbọ́n’ sì mú ìtakora náà jáde.
- source_word: ἐποιήσατε
  choice: ti sọ ọ́ di
  rationale: Ìṣe perfect ní àyíká yìí ń tọ́ka sí ohun tí wọ́n ti mú kí ó di báyìí; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: σπήλαιον
  choice: ihò
  rationale: Ó pa àwòrán ibi ìfarapamọ́ mọ́ láì dín un kù sí ihò àdánidá lásán.
- source_word: λῃστῶν
  choice: àwọn ọlọ́ṣà
  rationale: Ó gba ìtumọ̀ gbogbogbòò ti àwọn tó ń jí tàbí gba nǹkan lọ́wọ́ ènìyàn, láì sọ ọ́ di ọ̀rọ̀ olóṣèlú pàtó.
theological_decisions:
- issue: Bóyá kí οἶκός μου jẹ́ ‘ilé mi’ tàbí ‘tẹ́ńpìlì mi’
  choice: ilé mi
  alternative: tẹ́ńpìlì mi
  rationale: ‘Ilé mi’ tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààràtà, ó sì pa ìbáṣepọ̀ pẹ̀lú Isaiah 56:7 mọ́; àyíká náà ti jẹ́ kí ó ṣe kedere pé tẹ́ńpìlì ni a ń tọ́ka sí.
- issue: Ìwọn ìtumọ̀ λῃστῶν
  choice: àwọn ọlọ́ṣà
  alternative: àwọn adigunjalè
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ọlọ́ṣà, adigunjalè, tàbí bandit; ‘àwọn ọlọ́ṣà’ pa àìdánilójú yẹn mọ́ láì fi ìtumọ̀ olóṣèlú kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà ní ọlá tó yẹ fún ọ̀rọ̀ Ìwé Mímọ́ ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
