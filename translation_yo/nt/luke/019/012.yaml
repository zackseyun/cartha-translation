id: LUK.19.12
reference: Luke 19:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: yo
  text: Nítorí náà, ó sọ pé, “Ọkùnrin kan tí a bí sí ìdílé ọlọ́lá lọ sí ilẹ̀ jíjìn láti gba ìjọba[a] fún ara rẹ̀, kí ó sì padà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ipò ọba” tàbí “àṣẹ ọba.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilẹ̀ ìjọba fúnra rẹ̀ tàbí sí ìṣàkóso àti àṣẹ ọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí ìyọrísí hàn láìfi ìtumọ̀ míì kún un.
- source_word: Ἄνθρωπός τις
  choice: Ọkùnrin kan
  rationale: Ó fi ẹni kan tí a kò tíì dárúkọ hàn nínú àkàwé; èdè yìí rọrùn, ó sì bá ìlò Yorùbá mu.
- source_word: εὐγενὴς
  choice: tí a bí sí ìdílé ọlọ́lá
  rationale: Ó tọ́ka sí ipò gíga nípa ìbí tàbí ìdílé, kì í ṣe kìkì pé ọkùnrin náà ní ìwà ọlọ́lá.
- source_word: ἐπορεύθη
  choice: lọ
  rationale: Ọ̀rọ̀ ìṣe náà sọ ìrìn lọ sí ibòmíràn ní ọ̀nà tààrà; “lọ” jẹ́ èdè Yorùbá àdánidá.
- source_word: εἰς χώραν μακρὰν
  choice: sí ilẹ̀ jíjìn
  rationale: Ó pa ìtumọ̀ ibi tàbí agbègbè tí ó jìnnà mọ́ ní èdè tí ó ṣe kedere.
- source_word: λαβεῖν
  choice: láti gba
  rationale: Nínú àyíká ìṣèlú yìí, ọkùnrin náà ń lọ láti gba ohun tí a ó fi fún un, kì í ṣe láti já a gbà.
- source_word: ἑαυτῷ
  choice: fún ara rẹ̀
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ afẹ̀yìntì mọ́, pé òun fúnra rẹ̀ ni yóò gba ìjọba náà.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: “Ìjọba” lè tọ́ka sí ilẹ̀ ìjọba tàbí sí ìṣàkóso ọba, nítorí náà ó pa ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: ὑποστρέψαι
  choice: kí ó sì padà
  rationale: Ó fi ìṣe kejì tí ó bá “láti gba” ṣiṣẹ́ pọ̀ hàn, ní èdè Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ βασιλείαν nínú àkàwé tí ó ní àwòrán ìṣèlú
  choice: ìjọba
  alternative: ipò ọba tàbí àṣẹ ọba
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ilẹ̀ ìjọba tàbí agbára àti ipò láti jọba. “Ìjọba” jẹ́ ọ̀rọ̀ àdánidá tí kò fi tipátipá yan ọ̀kan ṣoṣo, a sì ṣàkọsílẹ̀ àwọn ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. Gbólóhùn “tí a bí sí ìdílé ọlọ́lá” yà ìtumọ̀ ipò nípa ìbí sọ́tọ̀ kúrò nínú ìwà rere, “ìjọba” sì pa àìdánilójú tó wà nínú βασιλεία mọ́.
