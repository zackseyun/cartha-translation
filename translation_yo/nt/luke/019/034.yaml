  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: yo
  text: Wọ́n sì wí pé[a], “Olúwa nílò rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá nílò rẹ̀,” bí a bá gba κύριος ní ìtumọ̀ ọ̀gá tàbí ẹni tí ó ni í, dípò orúkọ oyè fún Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: Ọ̀rọ̀-atọ́ka οἱ dúró fún àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, nítorí náà ‘wọ́n’ ni ó bá a mu. δέ jẹ́ àsopọ̀ pẹ̀lẹ́; ‘sì’ ń tẹ ìtàn náà síwájú láìfi ìtakora tí kò sí kún un.
- source_word: εἶπαν
  choice: wí pé
  rationale: εἶπαν jẹ́ ọ̀nà àkókò àtijọ́ ti λέγω, ìtumọ̀ rẹ̀ sì ni ‘wí/sọ.’ ‘Wí pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ tààrà.
- source_word: ὅτι
  choice: pé àti àmì ọ̀rọ̀ àyọlò
  rationale: ὅτι ń ṣáájú ọ̀rọ̀ tààrà níbí. Ní Yorùbá, ‘pé’ pẹ̀lú àmì ọ̀rọ̀ àyọlò ló ń fi iṣẹ́ yìí hàn lọ́nà àdánidá.
- source_word: Ὁ κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ àkọ́kọ́ fún κύριος gẹ́gẹ́ bí orúkọ oyè, ó sì ṣeé lóye nínú àyíká yìí pé ó ń tọ́ka sí Jésù. Síbẹ̀, κύριος tún lè túmọ̀ sí ọ̀gá tàbí ẹni tí ohun-ìní jẹ́ tirẹ̀; a pa àṣàyàn yẹn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ṣeéṣe jù lọ láti tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. ‘Rẹ̀’ jẹ́ ọ̀nà Yorùbá kúkúrú, àdánidá fún ohun tí Olúwa nílò.
- source_word: χρείαν ἔχει
  choice: nílò
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní ti gidi sí ‘ní àìní.’ ‘Nílò’ ni ìtumọ̀ Yorùbá àdánidá, kedere, tí kò sì yí agbára gbólóhùn náà padà.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí nínú èsì àwọn ọmọ-ẹ̀yìn
  choice: ‘Olúwa,’ tí àyíká ìtàn fi hàn pé ó ṣeéṣe jù lọ kí ó tọ́ka sí Jésù
  alternative: ‘Ọ̀gá’ tàbí ‘ẹni tí ó ni í,’ tí yóò tọ́ka sí olówó ọmọ kẹ́tẹ́kẹ́tẹ́ náà
  rationale: Lẹ́sẹ̀kẹsẹ̀ nínú ìtàn Lúùkù, gbólóhùn yìí ni Jésù ti kọ́ àwọn ọmọ-ẹ̀yìn rẹ̀ láti sọ, Lúùkù sì sábà máa ń lo κύριος gẹ́gẹ́ bí orúkọ oyè fún Jésù. Ṣùgbọ́n nítorí κύριος tún lè túmọ̀ sí ọ̀gá tàbí olówó ohun-ìní, a kò pa ìtumọ̀ kejì náà rẹ́; a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘wí pé’ fún ìṣàn ìtàn tó ní ìwọ̀ntúnwọ̀nsì, ‘Olúwa’ sì pa orúkọ oyè Gíríìkì mọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún ìtumọ̀ mìíràn tó ṣeé ṣe.
