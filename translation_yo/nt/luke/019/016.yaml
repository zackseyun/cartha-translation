  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: yo
  text: Ẹni àkọ́kọ́ sì wá, ó ní, “Olúwa[a], mínà rẹ ti mú mínà mẹ́wàá wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí a fi ń pe ẹni tó ga ní ipò, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο δὲ
  choice: Nígbà náà ... dé
  rationale: δὲ ń tẹ ìtàn náà síwájú, παρεγένετο sì túmọ̀ sí pé ẹni náà dé tàbí wá sí iwájú ọ̀gá rẹ̀. ‘Nígbà náà ... dé’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn.
- source_word: ὁ πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Ó tọ́ka sí ẹni àkọ́kọ́ nínú àwọn ìránṣẹ́ tí wọ́n wá sọ bí wọ́n ṣe lo owó náà.
- source_word: λέγων
  choice: ó ní
  rationale: Ọ̀nà àdánidá ní Yorùbá láti sọ participle tí ó ń ṣàlàyé ọ̀rọ̀ ẹni tó dé ni ‘ó ní.’
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ọ̀wọ̀ àti àṣẹ κύριε mọ́; nínú àkàwé yìí ó tún lè jẹ́ ọ̀rọ̀ tí ìránṣẹ́ fi ń pe ọ̀gá rẹ̀.
- source_word: ἡ μνᾶ σου
  choice: mínà rẹ
  rationale: A pa orúkọ ìwọ̀n owó ìgbàanì μνᾶ mọ́ gẹ́gẹ́ bí ‘mínà,’ possessive σου sì di ‘rẹ.’
- source_word: δέκα προσηργάσατο μνᾶς
  choice: ti jèrè mínà mẹ́wàá
  rationale: προσεργάζομαι sọ èrè tí iṣẹ́ mú wá ní àfikún. ‘Ti jèrè mínà mẹ́wàá’ jẹ́ kedere, ó sì pa àbájáde tí ó ti ṣẹ̀ mọ́ láìfi ọ̀nà tí èrè náà gbà dé kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ ìbánisọ̀rọ̀ àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ẹni tí a ń bá sọ̀rọ̀ jẹ́ aláṣẹ nínú àkàwé, nítorí náà κύριε lè jẹ́ ìkíni ọ̀wọ̀ sí ‘Ọ̀gá,’ kì í ṣe dandan pé ó jẹ́ ìjẹ́wọ́ nípa Ọlọ́run. A lo ‘Olúwa’ nínú àyọkà, a sì pa ‘Ọ̀gá’ mọ́ nínú àlàyé láti má ṣe mú àìdánilójú ọ̀rọ̀ náà kúrò.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà rọrùn fún òǹkàwé lásán, ṣùgbọ́n a pa orúkọ owó ìgbàanì àti àìdánilójú κύριε mọ́.
