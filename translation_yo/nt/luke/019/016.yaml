  rationale: A tún gbólóhùn náà ṣe fún ìṣàn Yorùbá tí ó dára jù, a sì rọ́pò ọ̀nà tí mínà fi ‘jèrè’ pẹ̀lú ọ̀nà tí ó sọ pé ó ‘mú’ mínà mẹ́wàá wá. Èyí ń pa ìtumọ̀ èrè tí προσηργάσατο ń fi hàn mọ́. A tún ṣàtúnṣe àlàyé ‘Ọ̀gá’ kí ó má ṣe sọ ipò àṣẹ di ìjùlọ pátápátá. Àmì [b] ni a pa mọ́ nínú ìṣàkójọpọ̀ àlàyé gẹ́gẹ́ bí a ti fi ránṣẹ́, ṣùgbọ́n kò nílò àmì nínú ara ẹsẹ̀ nítorí ‘mínà’ ló ti ṣàlàyé taara.
