  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σπεύσας κατέβη, καὶ ὑπεδέξατο αὐτὸν χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: yo
  text: Ó sì yára sọ̀kalẹ̀, ó sì fi ayọ̀ tẹ́wọ́ gbà á.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì yára, ó sọ̀kalẹ̀, ó sì fi ayọ̀ gbà á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: yára
  rationale: Ọ̀rọ̀ náà fi hàn pé ó ṣe ohun náà lẹ́sẹ̀kẹsẹ̀ pẹ̀lú ìtara; “yára” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú ìtumọ̀ yìí jáde.
- source_word: κατέβη
  choice: sọ̀kalẹ̀
  rationale: Ó pa ìtọ́sọ́nà ìṣípò náà mọ́ ní kedere, ìyẹn, láti ibi gíga wá sílẹ̀.
- source_word: ὑπεδέξατο
  choice: tẹ́wọ́ gbà
  rationale: Fáàbù náà túmọ̀ sí gbígba ẹnì kan tọ̀yàyà-tọ̀yàyà, ó sì lè ní ìtumọ̀ àlejò ṣíṣe; “tẹ́wọ́ gbà” jẹ́ èdè Yorùbá tí ó wọ́pọ̀ fún ìkíni àbọ̀ tọkàntọkàn.
- source_word: αὐτόν
  choice: á
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà tí ó ń tọ́ka sí Jésù; àmi ohùn gíga yà á sọ́tọ̀ kúrò ní “a”.
- source_word: χαίρων
  choice: fi ayọ̀
  rationale: Participle náà ṣàpèjúwe bí ó ṣe tẹ́wọ́ gbà á; “fi ayọ̀” pa ìtumọ̀ ayọ̀ tí ó ń bá ìṣe náà lọ mọ́ ní èdè Yorùbá àdánidá.
- source_word: καὶ ... καὶ
  choice: Ó sì ... ó sì
  rationale: “Sì” pa ìsopọ̀ ìtàn tí καί ṣe mọ́, àtúnṣe “ó” sì jẹ́ kí gbolohun náà ṣàn lọ́nà Yorùbá tí ó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “tẹ́wọ́ gbà” láti mú ìtumọ̀ àlejò ṣíṣe inú ὑπεδέξατο jáde, a sì fi àyípadà tí ó sún mọ́ ìṣètò Gíríìkì sí àlàyé ìsàlẹ̀.
