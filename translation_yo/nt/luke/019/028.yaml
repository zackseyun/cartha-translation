  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ nǹkan wọ̀nyí, ó sì ń lọ síwájú bí ó ti ń gòkè lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Àsopọ̀ “sì” ń tẹ̀síwájú nínú ìtàn lọ́nà àdánidá láìfi ìtumọ̀ tuntun kún un.
- source_word: εἰπὼν
  choice: Lẹ́yìn tí ó ti sọ
  rationale: Ó fi hàn pé ìsọ̀rọ̀ náà ṣẹlẹ̀ ṣáájú ìṣe pàtàkì, gẹ́gẹ́ bí aorist participle ṣe túmọ̀ sí níbí.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí gbogbo ohun tí Jésù ṣẹ̀ṣẹ̀ sọ láìdín ìtọ́kasí náà kù sí ọ̀rọ̀ kan ṣoṣo.
- source_word: ἐπορεύετο
  choice: ó ń bá ọ̀nà rẹ̀ lọ
  rationale: Ìsọ̀rọ̀ yìí mú ìṣe tí ń tẹ̀síwájú nínú imperfect náà jáde ní Yorùbá àdánidá.
- source_word: ἔμπροσθεν
  choice: níwájú
  rationale: Ó pa ìtumọ̀ pé Jésù ń lọ níwájú àwọn tí ó wà pẹ̀lú rẹ̀ mọ́, láìfi ọ̀rọ̀ tí kò sí nínú ẹsẹ̀ náà kún un.
- source_word: ἀναβαίνων
  choice: ó ń gòkè lọ
  rationale: Ó pa èdè ìgòkè lọ sí Jerúsálẹ́mù mọ́, ó sì fi hàn pé ìṣe náà ń lọ papọ̀ pẹ̀lú ìrìn-àjò rẹ̀.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: “Sí” fi ìlọ sí ibi tí a ń lọ hàn, láìsọ pé ó ti wọ inú ìlú náà.
theological_decisions:
- issue: Bóyá kí a pa èdè ìgòkè lọ sí Jerúsálẹ́mù mọ́
  choice: ó ń gòkè lọ sí Jerúsálẹ́mù
  alternative: ó ń rìn àjò lọ sí Jerúsálẹ́mù
  rationale: Ọ̀rọ̀ Gíríìkì ἀναβαίνων sọ ìgòkè ní tààrà; pípa rẹ̀ mọ́ ń fi àwòrán ilẹ̀ àti ìwọ̀n pàtàkì tí ìrìn Jésù sí Jerúsálẹ́mù ní nínú ìtàn Lúùkù hàn láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ; ìtẹ̀síwájú imperfect àti participle ni a fi “ń bá ... lọ” àti “ń gòkè lọ” hàn.
