  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: yo
  text: Nígbà tí gbogbo wọn rí èyí, wọ́n ń kùn, wọ́n ní, “Ó wọlé láti dúró lọ́dọ̀ ọkùnrin ẹlẹ́ṣẹ̀ kan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó wọlé láti jẹ́ àlejò lọ́dọ̀ ọkùnrin ẹlẹ́ṣẹ̀ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí ... rí èyí
  rationale: A tú aorist participle náà sí gbólóhùn àkókò ní Yorùbá àdánidá; “èyí” ń tọ́ka sí ohun tí Jésù ṣe nínú àyíká ọ̀rọ̀.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Èyí pa ìtẹnumọ́ pé gbogbo àwọn tó rí ohun náà ló kópa nínú ìhùwàsí yìí mọ́.
- source_word: διεγόγγυζον
  choice: wọ́n bẹ̀rẹ̀ sí í kùn
  rationale: “Bẹ̀rẹ̀ sí í” fi ìṣe tí ó ń bẹ̀rẹ̀ hàn, “kùn” sì mú ìtumọ̀ ìkùnsínú àti àsọjáde àìtẹ́lọ́rùn διεγόγγυζον jáde.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti ṣàgbékalẹ̀ ọ̀rọ̀ tí àwọn ènìyàn sọ nígbà tí wọ́n ń kùn.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: sọ́dọ̀ ọkùnrin ẹlẹ́ṣẹ̀ kan
  rationale: “Ọkùnrin ẹlẹ́ṣẹ̀” pa àpèjúwe ἁμαρτωλῷ àti akọ ἀνδρί méjèèjì mọ́; “sọ́dọ̀” bá παρά pẹ̀lú dative mu ní ọ̀rọ̀ dídúró ní ilé ẹni.
- source_word: εἰσῆλθεν
  choice: Ó wọ ilé ... lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé “ilé” kò fara hàn gẹ́gẹ́ bí ọ̀rọ̀ lọ́tọ̀ nínú Gíríìkì, ó jẹ́ àfikún àdánidá ní Yorùbá tí àyíká ọ̀rọ̀ sì mú un dájú.
- source_word: καταλῦσαι
  choice: láti dúró sọ́dọ̀ rẹ̀
  rationale: Èyí sọ ìtumọ̀ dídúró tàbí gbígbé gẹ́gẹ́ bí àlejò ní ọ̀nà tí ó ṣe kedere fún òǹkàwé Yorùbá.
theological_decisions:
- issue: Bí a ṣe tú àpèjúwe àwọn ènìyàn nípa Sákéùsì
  choice: ọkùnrin ẹlẹ́ṣẹ̀ kan
  alternative: ẹlẹ́ṣẹ̀ kan
  rationale: Gíríìkì lo adjective àti noun akọ papọ̀; yíyan “ọkùnrin ẹlẹ́ṣẹ̀” pa ìdájọ́ ẹ̀gàn àwọn ènìyàn àti ìtọ́kasí akọ mọ́ láìfi ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ καταλῦσαι gẹ́gẹ́ bí dídúró tàbí jíjẹ́ àlejò
  choice: láti dúró sọ́dọ̀ rẹ̀
  alternative: láti ṣe àlejò sọ́dọ̀ rẹ̀
  rationale: “Dúró sọ́dọ̀ rẹ̀” pa ìtumọ̀ gbígbé/dídúró mọ́, nígbà tí “ṣe àlejò” jẹ́ ìtumọ̀ tó túmọ̀ síi díẹ̀. A fi ọ̀nà kejì sínú àlàyé ìsàlẹ̀ láti pa àṣàyàn lexical náà mọ́.
translation_notes:
  register: A lo Yorùbá òde òní tó bójú mu, tó níyì, pẹ̀lú àmì ohùn ní kíkún. “Kùn” jẹ́ ọ̀rọ̀ tí ó rọrùn fún ìkùnsínú; “wọ ilé ... lọ” àti “dúró sọ́dọ̀ rẹ̀” jẹ́ ọ̀nà àdánidá láti sọ ìwọlé àti gbígbé gẹ́gẹ́ bí àlejò.
