id: LUK.19.8
reference: Luke 19:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: yo
  text: Ṣùgbọ́n Sákéù dúró, ó sì sọ fún Olúwa pé, “Wò ó, Olúwa, mo fi ìdajì ohun ìní mi fún àwọn òtòṣì; bí mo bá sì ti jẹ ẹnikẹ́ni ní ohunkóhun[a], mo san án padà ní ìlọ́po mẹ́rin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí mo bá ti fi ipá gba ohunkóhun lọ́wọ́ ẹnikẹ́ni.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí fífi ipá gba, fífi ẹlòmíràn ṣe èrè fún ara ẹni, tàbí jíjẹ ẹni ní nǹkan, nígbà míì nípa ẹ̀sùn èké.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọ̀rọ̀-ìṣe Gíríìkì tí ó wà ní àsìkò ìsinsìnyí tún lè túmọ̀ sí “màá fi fún” àti “màá san padà,” tí yóò fi ìpinnu lẹ́sẹ̀kẹsẹ̀ hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: dúró
  rationale: Ó ń sọ ìṣe ìtàn náà ní ṣókí, láìfi kún un pé Sákéù dìde tàbí pé ó dá ìrìn rẹ̀ dúró.
- source_word: κύριον / κύριε
  choice: Olúwa
  rationale: Ó pa oyè náà mọ́, èyí tí ó lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, tí ó sì tún ní ìtumọ̀ jíjinlẹ̀ nínú bí Lúùkù ṣe ń tọ́ka sí Jésù.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ àfiyèsí tí ó bá èdè Yorùbá òde òní mu, tí ó sì pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: ìdajì ohun ìní mi
  rationale: Ó ṣàfihàn pé Sákéù ń sọ nípa ìdajì gbogbo dúkìá tàbí ohun tí ó ní.
- source_word: τοῖς πτωχοῖς
  choice: fún àwọn òtòṣì
  rationale: Ó tọ́ka ní tààrà sí àwọn ènìyàn tí wọ́n jẹ́ òtòṣì nípa ọrọ̀ ajé.
- source_word: δίδωμι
  choice: mo fi ... fún
  rationale: Àsìkò ìsinsìnyí ni ọ̀rọ̀ Gíríìkì lò. Gbólóhùn Yorùbá yìí pa ìtumọ̀ ìsinsìnyí mọ́ láìpinnu bóyá ó ń ṣàpèjúwe àṣà rẹ̀ tẹ́lẹ̀ tàbí ìpinnu tí ó ṣẹ̀ṣẹ̀ ṣe.
- source_word: ἐσυκοφάντησα
  choice: jẹ ẹnikẹ́ni ní ohunkóhun
  rationale: ‘Jẹ ẹni ní nǹkan’ jẹ́ ọ̀nà Yorùbá àdánidá fún jíjẹ́ ẹni ní dúkìá tàbí owó lọ́nà àìtọ́; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ fífi ipá gba àti ẹ̀sùn èké mọ́.
- source_word: ἀποδίδωμι
  choice: mo san án padà
  rationale: Ó bá èrò sísan ohun tí a gbà padà mu, ó sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn.
- source_word: τετραπλοῦν
  choice: ní ìlọ́po mẹ́rin
  rationale: Ó sọ iye ẹ̀san náà ní pàtó gẹ́gẹ́ bí ìgbà mẹ́rin iye ohun tí a gbà.
theological_decisions:
- issue: Agbára àsìkò ìsinsìnyí nínú δίδωμι àti ἀποδίδωμι
  choice: mo fi ... fún; mo san ... padà
  alternative: màá fi ... fún; màá san ... padà
  rationale: Ọ̀rọ̀ Gíríìkì méjèèjì wà ní àsìkò ìsinsìnyí. Ìtumọ̀ àkọ́kọ́ kò fi tipátipá pinnu bóyá Sákéù ń sọ ohun tí ó máa ń ṣe tàbí ìpinnu tuntun tí ó fẹ́ bẹ̀rẹ̀ sí í mú ṣẹ; àlàyé [b] pa òye ọjọ́ iwájú mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
