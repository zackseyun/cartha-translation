  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: yo
  text: Wọ́n sì mú un wá sí ọ̀dọ̀ Jésù; lẹ́yìn tí wọ́n ju aṣọ òde wọn sórí ọmọ ẹranko náà[a], wọ́n gbé Jésù sórí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, πῶλος, túmọ̀ sí ọmọ ẹranko tí a lè gùn; nínú àyíká ìtàn yìí, ó ṣeé ṣe kí ó jẹ́ ọmọ kẹ́tẹ́kẹ́tẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: wọ́n mú un tọ Jesu wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n mú ẹranko náà dé ọ̀dọ̀ Jesu. “Mú un tọ Jesu wá” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò lọ sí ọ̀dọ̀ ẹni kan; arọ́pò-orúkọ “un” kò sì fi akọ tàbí abo hàn.
- source_word: ἐπιρίψαντες αὐτῶν τὰ ἱμάτια
  choice: lẹ́yìn tí wọ́n ju aṣọ àwọ̀lékè wọn
  rationale: Aorist participle náà tọ́ka sí ohun tí wọ́n kọ́kọ́ ṣe ṣáájú ọ̀rọ̀-ìṣe pàtàkì. “Aṣọ àwọ̀lékè” mú ìtumọ̀ ἱμάτια gẹ́gẹ́ bí aṣọ òde jáde ní èdè Yorùbá òde òní.
- source_word: ἐπὶ τὸν πῶλον
  choice: sórí ọmọ kẹ́tẹ́kẹ́tẹ́ náà[a]
  rationale: ἐπί tọ́ka sí fífi aṣọ lé orí ẹranko náà. πῶλος túmọ̀ sí ọmọ ẹranko tí a lè gùn; àyíká ìtàn náà mú kí “ọmọ kẹ́tẹ́kẹ́tẹ́” ṣe kedere sí òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ìfẹ̀hónúhàn ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: wọ́n gbé Jesu gùn ún
  rationale: 'Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ causative: wọ́n mú kí Jesu gun ẹranko náà. Gbólóhùn Yorùbá yìí ṣókí, ó sì dá ìtumọ̀ náà dúró láìjẹ́ kí ó dà bí ẹni pé àwọn fúnra wọn ni wọ́n gùn ún.'
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ó sì jẹ́ ti ìtàn ọlọ́lá tí òǹkàwé òde òní lè lóye. A lo “un/ún” fún ẹranko náà nítorí arọ́pò-orúkọ Yorùbá kò nílò yíyan láàárín “it” àti “him” bí ti Gẹ̀ẹ́sì.
