  source_fidelity: 'Àtúnṣe náà ń mú πρός náà hàn ní kedere gẹ́gẹ́ bí ìṣípadà sí ọ̀dọ̀ Jésù, ó sì ń pa ìtumọ̀ causative ti ἐπεβίβασαν mọ́: wọ́n gbé Jésù sórí ẹranko náà. A tún yẹra fún sísọ pẹ̀lú ìdánilójú pé πῶλος jẹ́ ọmọ kẹ́tẹ́kẹ́tẹ́ nínú ọ̀rọ̀-ẹsẹ̀ fúnra rẹ̀, níwọ̀n bí ọ̀rọ̀ Gíríìkì náà ti lè tọ́ka sí ọmọ ẹṣin tàbí ọmọ kẹ́tẹ́kẹ́tẹ́, bí ó tilẹ̀ jẹ́ pé àyíká ìtàn náà ń tọ́ka gidigidi sí ọmọ kẹ́tẹ́kẹ́tẹ́.'
  naturalness: “Mú un wá sí ọ̀dọ̀ Jésù” jẹ́ gbólóhùn Yorùbá boṣewa tí ó rọrùn ju “mú un tọ Jesu wá” lọ. “Aṣọ òde wọn” jẹ́ ọ̀nà àdánidá láti sọ aṣọ ìta/àwọ̀lékè. “Wọ́n gbé Jésù sórí rẹ̀” jẹ́ kedere, ó sì yẹ fún ìtàn náà ju “wọ́n gbé Jesu gùn ún” lọ.
  terminology: A ti lo “Jésù” pẹ̀lú àmì ohùn gẹ́gẹ́ bí ìlànà Yorùbá. “Ọmọ ẹranko” ń pa ìfẹ̀hónúhàn πῶλος mọ́, ìsàlẹ̀-ìwé sì ṣàlàyé ìtọ́kasí ọmọ kẹ́tẹ́kẹ́tẹ́ tí àyíká náà ṣeé ṣe kí ó túmọ̀ sí.
  issues:
  - severity: medium
    issue: “ọmọ kẹ́tẹ́kẹ́tẹ́” nínú ọ̀rọ̀-ẹsẹ̀ náà mú ìtumọ̀ πῶλος di pàtó ju bí ọrọ̀ Gíríìkì ṣe rí lọ.
    rationale: πῶλος jẹ́ ọmọ ẹranko tí a lè gùn, ó sì lè jẹ́ ọmọ ẹṣin tàbí ọmọ kẹ́tẹ́kẹ́tẹ́. Àyíká ń ṣe ìtìlẹ́yìn ọmọ kẹ́tẹ́kẹ́tẹ́, ṣùgbọ́n ọ̀rọ̀ náà fúnra rẹ̀ kò sọ ọ́ ní pàtó.
  - severity: medium
    issue: “wọ́n gbé Jesu gùn ún” kò jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti fi causative ‘set/mount’ hàn.
    rationale: Ó lè dà bí ẹni pé Jésù fúnra rẹ̀ ni ó gùn, tàbí kí ìṣọ̀kan ọ̀rọ̀-ìṣe náà má ṣe rọrùn. “Wọ́n gbé Jésù sórí rẹ̀” sọ ìṣe àwọn ènìyàn náà àti àbájáde rẹ̀ ní kedere.
  - severity: low
