id: LUK.19.27
reference: Luke 19:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti àwọn ọ̀tá mi wọ̀nyí, tí wọn kò fẹ́ kí n jọba lórí wọn[a], ẹ mú wọn wá síhìn-ín, kí ẹ sì rẹ́ wọ́n pa níwájú mi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọn kò fẹ́ kí n jẹ́ ọba wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹ sì pa wọ́n níwájú mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n ní ti
  rationale: Ó fi ìyípadà ọ̀rọ̀ tó lágbára hàn, ó sì gbé kókó ìkẹyìn nínú ọ̀rọ̀ ọlọ́lá náà kalẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: àwọn ọ̀tá mi wọ̀nyí
  rationale: ‘Àwọn ọ̀tá’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ẹni tó ń tako ẹnì kan; ‘wọ̀nyí’ pa ìtẹnumọ́ àti ìtọ́kasí τούτους mọ́.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: tí wọn kò fẹ́ kí n jọba lórí wọn
  rationale: Gbólóhùn aláìṣe náà di gbólóhùn ìbátan tó bá Yorùbá mu. ‘Jọba lórí wọn’ pa ìtumọ̀ βασιλεύω gẹ́gẹ́ bí ìṣe ìṣàkóso ọba mọ́.
- source_word: ἀγάγετε ὧδε
  choice: ẹ mú wọn wá síhìn-ín
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe àdánidá láti sọ àṣẹ pé kí a kó àwọn ẹni náà dé ibi tí olùsọ̀rọ̀ wà.
- source_word: κατασφάξατε
  choice: ẹ sì rẹ́ wọn pa
  rationale: κατασφάζω lágbára, ó sì burú ju ọ̀rọ̀ gbogbogbò ‘pa’ lọ. ‘Rẹ́ wọn pa’ jẹ́ kó hàn pé pípa oníwà ipá ni, láì fi ìtumọ̀ ìdájọ́ òfin tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἔμπροσθέν μου
  choice: níwájú mi
  rationale: Ó pa ìtumọ̀ ibi àti wíwà ní ojú olùsọ̀rọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtọ́kasí sí ẹni tó ń sọ̀rọ̀ nínú àkàwé
  choice: A túmọ̀ àṣẹ ọlọ́lá náà tààrà, láì dín ìwà ipá rẹ̀ kù, láì sì fi kún un pé àṣẹ tààrà láti ọ̀dọ̀ Jésù ló jẹ́ níta àkàwé.
  alternative: Kí a fi ọ̀rọ̀ àlàyé kún un láti mú kí àṣẹ náà jìnnà sí Jésù nítorí pé àwòrán àkàwé lásán ni.
  rationale: Ọ̀rọ̀ Gíríìkì gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ọlọ́lá inú àkàwé. Ìtumọ̀ náà gbọdọ̀ pa agbára ìtàn àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì dá ìtumọ̀ tí ẹsẹ náà kò sọ lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. ‘Rẹ́ wọn pa’ pa líle ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ fúnni ní ọ̀nà tó rọrùn sí i.
