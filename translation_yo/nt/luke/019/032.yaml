  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: yo
  text: Àwọn tí a rán lọ sì rí i gẹ́gẹ́ bí ó ti sọ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí ní ṣókí, “wọ́n rí,” níbi tí a ti lóye ohun tí wọ́n rí láti inú àyíká ọ̀rọ̀: ọmọ kẹ́tẹ́kẹ́tẹ́ tí Jésù ti ṣàpèjúwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: lọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó fi ìṣe lílọ hàn; “lọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìtẹ̀síwájú ìtàn yìí láìfi ìtumọ̀ kún un.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn; “sì” bá ìlò Yorùbá mu.
- source_word: οἱ ἀπεσταλμένοι
  choice: Àwọn tí a rán
  rationale: Èyí pa ìtumọ̀ participle passive náà mọ́ ní kedere, láìtúmọ̀ wọn ní ọ̀nà àfikún bí “àwọn ońṣẹ́.”
- source_word: εὗρον
  choice: rí i
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí “rí”; arọ́pò-orúkọ “i” jẹ́ kí gbólóhùn Yorùbá dára, ó sì tọ́ka sí ọmọ kẹ́tẹ́kẹ́tẹ́ tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: “Gẹ́gẹ́ bí” fi ìbámu ohun tí wọ́n rí pẹ̀lú ohun tí Jésù sọ hàn lọ́nà àdánidá, láìfi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: εἶπεν αὐτοῖς
  choice: ó ti sọ fún wọn
  rationale: “Sọ fún wọn” jẹ́ ìtumọ̀ àdánidá fún λέγω pẹ̀lú ẹni tí a bá sọ̀rọ̀ sí; “ti” fi hàn pé ọ̀rọ̀ náà ti ṣẹlẹ̀ ṣáájú bí wọ́n ṣe rí ohun náà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “Àwọn tí a rán” láti pa passive orísun mọ́, àti “rí i” fún ìṣàn gbólóhùn àdánidá ní Yorùbá.
