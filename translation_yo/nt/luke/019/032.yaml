  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: “Àwọn tí a rán” pa participle passive οἱ ἀπεσταλμένοι mọ́; “lọ” ń ṣàfihàn ἀπελθόντες; “rí i” ń mú object tí a lóye nínú àyíká wá síta láìyí ìtumọ̀ orísun padà; “gẹ́gẹ́ bí ó ti sọ fún wọn” sì bá καθὼς εἶπεν αὐτοῖς mu. Àtúnṣe náà kàn jẹ́ láti mú ìṣàn Yorùbá rọrùn.'
  naturalness: 'Ìlò “sì” lẹ́ẹ̀mejì nínú “Àwọn tí a rán sì lọ, wọ́n sì rí i” dùn bí ìsopọ̀ ìtàn tí ó pọ̀ ju nínú Yorùbá. “Àwọn tí a rán lọ sì rí i” jẹ́ ìṣàn tó dára, ó sì pa ìtẹ̀síwájú ìtàn δέ mọ́. Ọ̀rọ̀ ìsàlẹ̀ atilẹba náà tún nílò àtúnṣe kékeré: “nígbà tí” kò yẹ níhìn-ín; “níbi tí” ni ó bá èrò object tí a lóye mu.'
  terminology: “Àwọn tí a rán,” “gẹ́gẹ́ bí,” àti “sọ fún wọn” jẹ́ ọ̀rọ̀ Yorùbá boṣewa, tí ó dára fún ìforúkọsílẹ̀ ìtàn mímọ́ tó ní iyì. “Ọmọ kẹ́tẹ́kẹ́tẹ́” nínú àlàyé ìsàlẹ̀ tọ́ka pẹ̀lú ìṣọ́ra sí àyíká tó súnmọ́, kì í sì fi object kan tí kò sí nínú gbolohun Gíríìkì lé e lórí nínú ìtumọ̀ pàtàkì.
