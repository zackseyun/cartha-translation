id: LUK.19.21
reference: Luke 19:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: yo
  text: nítorí mo bẹ̀rù rẹ[a], nítorí pé ọkùnrin líle ni ọ́; o máa ń mú ohun tí o kò gbé kalẹ̀[b], o sì máa ń ká ohun tí o kò fúnrúgbìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ń bẹ̀rù rẹ.”
    reason: Àkókò ọ̀rọ̀-ìṣe Gíríìkì lè tẹnu mọ́ ipò ìbẹ̀rù tó ń bá a lọ ní àkókò àtijọ́.
  - marker: b
    text: Ní tààràtà, “ohun tí o kò gbé kalẹ̀.” Ní àyíká owó, a tún lè túmọ̀ ọ́ ní ìtumọ̀ gbòòrò sí i pé, “ohun tí o kò fi sílẹ̀” tàbí “ohun tí o kò fi pamọ́.”
    reason: Ó pa gbólóhùn Gíríìkì tí ó mọ̀ọ́mọ̀ gbòòrò mọ́, ó sì ṣàlàyé àwọn ìtumọ̀ tó ṣeé ṣe nínú àyíká ọrọ̀ ajé.
lexical_decisions:
- source_word: ἐφοβούμην
  choice: mo bẹ̀rù
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi ìbẹ̀rù tí ó wà lọ́kàn ìránṣẹ́ ní àkókò àtijọ́ hàn; “mo bẹ̀rù” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: γάρ
  choice: nítorí
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí rẹ̀.
- source_word: αὐστηρὸς
  choice: líle
  rationale: “Líle” lè túmọ̀ sí ẹni tó muna tàbí tó le koko, ó sì pa agbára ẹ̀sùn ìránṣẹ́ mọ́ láìdájọ́ bóyá ẹ̀sùn náà jẹ́ òótọ́.
- source_word: αἴρεις
  choice: ìwọ a máa mú
  rationale: “Mú” pa ìtumọ̀ gbígbé tàbí mímú ohun kan mọ́; “a máa” bá ìṣe àṣà tí ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí lè fi hàn ní àyíká yìí mu.
- source_word: ὃ οὐκ ἔθηκας
  choice: ohun tí o kò gbé kalẹ̀
  rationale: Ó pa àwòrán gidi ti τίθημι, ‘gbé/sá kalẹ̀,’ mọ́ láìfi ọ̀rọ̀ òwò pàtó bí ‘fi pamọ́’ kún un.
- source_word: θερίζεις
  choice: o sì máa ká
  rationale: “Ká” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún kíkó ohun ọ̀gbìn nígbà ìkórè, ó sì pa àfiwé iṣẹ́ àgbẹ̀ mọ́.
- source_word: ὃ οὐκ ἔσπειρας
  choice: ohun tí o kò fúnrúgbìn
  rationale: “Fúnrúgbìn” túmọ̀ sí fífi irúgbìn sínú ilẹ̀, ó sì bá “ká” mu nínú àfiwé iṣẹ́ àgbẹ̀.
- source_word: ἄνθρωπος
  choice: ọkùnrin
  rationale: Ní àyíká òwe yìí, ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin kan pàtó, kì í ṣe ènìyàn lápapọ̀.
theological_decisions:
- issue: Bóyá kí a dín agbára ọ̀rọ̀ ìránṣẹ́ nípa ọ̀gá rẹ̀ kù
  choice: Pa ẹ̀sùn ìránṣẹ́ mọ́ pẹ̀lú “ọkùnrin líle”
  alternative: Lo “ọkùnrin tó muna” tàbí ọ̀rọ̀ míì tó rọrùn sí i
  rationale: Ẹsẹ̀ náà ń ròyìn ọ̀rọ̀ ìránṣẹ́ fúnra rẹ̀. Ìtumọ̀ kò gbọ́dọ̀ dín agbára ẹ̀sùn rẹ̀ kù tàbí pinnu pé àpèjúwe náà jẹ́ ìdájọ́ òtítọ́ lórí ọ̀gá náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. Àwọn àmì ohùn wà níbi tí ó yẹ. “Ọkùnrin líle” jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, tí ó sì pa ìrísí ẹ̀sùn náà mọ́; ìtẹ̀síwájú “mú…ká” tún pa ìbáramu àwọn gbólóhùn méjèèjì mọ́.
