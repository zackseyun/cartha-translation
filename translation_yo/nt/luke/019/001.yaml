  text: And he entered and was passing through Jericho[a].
translation:
  language: yo
  text: Ó sì wọ Jeríkò, ó sì ń la àárín rẹ̀ kọjá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀lé ìṣètò Gíríìkì pẹkipẹki: “Lẹ́yìn tí ó wọ Jeríkò, ó ń la àárín rẹ̀ kọjá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ó sì
  rationale: Àsopọ̀ ìtàn tó ṣe déédé ni Καὶ; “sì” so ìṣẹ̀lẹ̀ yìí mọ́ èyí tó ṣáájú láìfi ìtumọ̀ míì kún un.
- source_word: εἰσελθὼν
  choice: wọ
  rationale: Aorist participle náà tọ́ka sí wíwọlé tó ṣẹlẹ̀ ní ìbẹ̀rẹ̀, nígbà tí ọ̀rọ̀-ìṣe àkọ́kọ́ ń tẹ̀ síwájú. Ìṣọ̀kan ọ̀rọ̀-ìṣe méjèèjì jẹ́ adayeba ní Yorùbá, ó sì pa tẹ̀lé-tẹ̀lé ìṣe náà mọ́.
- source_word: διήρχετο
  choice: ń la ìlú náà kọjá
  rationale: Imperfect náà fi ìṣe tó ń lọ lọ́wọ́ hàn; àmì “ń” pa apá ìtẹ̀síwájú yìí mọ́. Fífi “ìlú náà” kún un mú gbolóhùn Yorùbá ṣe kedere pé Jeríkò ni ibi tí ó ń la kọjá.
- source_word: τὴν Ἰεριχώ
  choice: Jeríkò
  rationale: Orúkọ ibi náà ni a kọ ní ìrísí tó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àpólà “ń la … kọjá” láti fi ìṣe tí ó ń lọ lọ́wọ́ hàn, a sì yàgò fún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú orísun.
