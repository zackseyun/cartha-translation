source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: yo
  text: Bí wọ́n ṣe ń tú ọmọ kẹ́tẹ́kẹ́tẹ́ náà, àwọn tó ni ín[a] sọ fún wọn pé, “Èé ṣe tí ẹ fi ń tú ọmọ kẹ́tẹ́kẹ́tẹ́ náà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn olúwa rẹ̀.” Ọ̀rọ̀ Gíríìkì κύριοι jẹ́ ìrísí ọ̀pọ̀ ti κύριος (“olúwa” tàbí “ọ̀gá”), ṣùgbọ́n níbí ó ń tọ́ka sí àwọn ènìyàn tí ọmọ kẹ́tẹ́kẹ́tẹ́ náà jẹ́ tiwọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων
  choice: bí wọ́n ti ń tú
  rationale: Ọ̀rọ̀ participle yìí fi hàn pé ìtú ẹranko náà ń lọ lọ́wọ́ nígbà tí àwọn olówó rẹ̀ sọ̀rọ̀; ‘ń tú’ bá ìṣe yíyan okùn ẹranko mu, ó sì pa ìbámu mọ́ pẹ̀lú λύετε ní ìparí ẹsẹ náà.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; ‘sì’ jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá láìsọ ọ́ di ìtakora.
- source_word: αὐτῶν
  choice: wọ́n
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àwọn méjì tí a rán ní àyíká ẹsẹ tó ṣáájú; ‘wọ́n’ pa ìtọ́kasí náà mọ́ láìfikún àlàyé tí kò sí nínú ẹsẹ yìí.
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́
  rationale: πῶλος túmọ̀ sí ọmọ ẹranko, àyíká ọ̀rọ̀ sì ti fi hàn pé kẹ́tẹ́kẹ́tẹ́ ni; ‘ọmọ kẹ́tẹ́kẹ́tẹ́’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: εἶπαν
  choice: sọ
  rationale: λέγω túmọ̀ sí ‘sọ’; bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ tí ó tẹ̀ lé e, yíyan ‘sọ’ pa ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: οἱ κύριοι αὐτοῦ
  choice: àwọn olówó rẹ̀
  rationale: κύριοι jẹ́ ọ̀pọ̀ ‘olúwa/ọ̀gá,’ ṣùgbọ́n níbí ó tọ́ka sí àwọn ènìyàn tí ẹranko náà jẹ́ tiwọn. ‘Àwọn olówó rẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn tó ni ín, láìdá ìtumọ̀ ẹ̀sìn tí kò sí ní àyíká ọ̀rọ̀ náà sílẹ̀.
- source_word: πρὸς αὐτούς
  choice: fún wọn
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe sísọ, ‘sọ fún wọn’ ni ìlò Yorùbá àdánidá tó bá πρός αὐτούς mu.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú ìlò yìí, τί béèrè ìdí ìṣe náà; ‘Èé ṣe’ fi agbára ìbéèrè náà hàn ní Yorùbá àdánidá.
- source_word: λύετε
  choice: ẹ fi ń tú
  rationale: Ọ̀rọ̀-ìṣe present náà ń béèrè nípa ìṣe tó ń lọ lọ́wọ́. ‘ń tú’ tún ọ̀rọ̀ kan náà ṣe gẹ́gẹ́ bí ní ìbẹ̀rẹ̀ ẹsẹ, ó sì pa ìbámu λυόντων/λύετε mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριοι níbi tí ó tọ́ka sí jíjẹ́ ohun-ìní ènìyàn, kì í ṣe oyè ẹ̀sìn
  choice: àwọn olówó rẹ̀
  alternative: àwọn ọ̀gá rẹ̀
  rationale: Bí κύριος ṣe lè túmọ̀ sí ‘Olúwa’ tàbí ‘ọ̀gá,’ àyíká yìí ń sọ nípa àwọn ènìyàn tí ọmọ kẹ́tẹ́kẹ́tẹ́ náà jẹ́ tiwọn. ‘Àwọn olówó rẹ̀’ fi ìtumọ̀ ohun-ìní hàn kedere, ó sì yẹra fún ìtumọ̀ ẹ̀sìn tí kò bá ẹsẹ náà mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọmọ kẹ́tẹ́kẹ́tẹ́’ dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ tí kò ṣe kedere; a sì tún ‘ń tú’ ṣe láti pa ìbámu ọ̀rọ̀ Gíríìkì mọ́.
