  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: yo
  text: Bí ó sì ti ń lọ, wọ́n ń tẹ́ aṣọ wọn sórí ọ̀nà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘aṣọ àwọ̀lékè wọn.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Bí ó sì ti ń lọ
  rationale: Gbólóhùn genitive absolute pẹ̀lú participle ti ìsinsìnyí fi hàn pé ìlọsíwájú Jésù àti ìṣe àwọn ènìyàn ń ṣẹlẹ̀ ní àkókò kan náà; ‘Bí ó sì ti ń lọ’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ àkókò náà mọ́.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘sì’ mú ìṣàn ọ̀rọ̀ náà dúró láìfi ìtakora líle kún un.
- source_word: ὑπεστρώννυον
  choice: wọ́n ń tẹ́
  rationale: Ìṣe imperfect náà ń fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn. ‘Wọ́n ń tẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi aṣọ nà sórí ilẹ̀.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: aṣọ wọn
  rationale: ἱμάτια lè túmọ̀ sí aṣọ lápapọ̀ tàbí aṣọ àwọ̀lékè. ‘Aṣọ wọn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, ó sì pa ìtumọ̀ gbooro ti ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí ìtumọ̀ tó ṣe pàtó sí i.
- source_word: ἐν τῇ ὁδῷ
  choice: sí ojú ọ̀nà
  rationale: Ní àyíká yìí, gbolohun náà ń tọ́ka sí ibi tí wọ́n tẹ́ aṣọ sí ní ipa ọ̀nà Jésù. ‘Sí ojú ọ̀nà’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún ìtumọ̀ àpèjúwe ti ‘ọ̀nà’.
theological_decisions: []
