source:
  edition: SBLGNT
  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: yo
  text: Ó sì wọ tẹ́ńpìlì[a] lọ, ó sì bẹ̀rẹ̀ sí lé àwọn tí ń tajà jáde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àgbàlá tẹ́ńpìlì” tàbí “àgbègbè tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: wọ inú … lọ
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist yìí ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì. Ìtẹ̀lé ọ̀rọ̀-ìṣe méjì ní Yorùbá—“wọ inú … lọ, ó sì bẹ̀rẹ̀”—fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà hàn lọ́nà àdánidá láìfi ìtumọ̀ àkókò tí kò pọndandan kún un.
- source_word: ἱερὸν
  choice: tẹ́ńpìlì
  rationale: Ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ ṣókí tí a mọ̀ dáadáa; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé àgbàlá tàbí gbogbo àgbègbè tẹ́ńpìlì ni a ní lọ́kàn.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀ sí
  rationale: Àkójọpọ̀ “bẹ̀rẹ̀ sí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbẹ̀rẹ̀ ìṣe tí ἤρξατο sọ hàn.
- source_word: ἐκβάλλειν
  choice: lé … jáde
  rationale: “Lé … jáde” fi agbára àti ìpinnu tó wà nínú ἐκβάλλω hàn, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: πωλοῦντας
  choice: àwọn tí ń tajà
  rationale: Ọ̀rọ̀-ìṣe alábápín present náà tọ́ka sí àwọn ènìyàn tí wọ́n ń ṣe iṣẹ́ títà nígbà náà. “Àwọn tí ń tajà” pa ìṣe tó ń lọ lọ́wọ́ mọ́, kò sì sọ ohun tí wọ́n ń tà nígbà tí ẹsẹ yìí kò dárúkọ rẹ̀.
theological_decisions:
- issue: Ìwọ̀n àgbègbè tí ἱερόν ń tọ́ka sí nínú ìṣe Jésù ní tẹ́ńpìlì
  choice: A lo “tẹ́ńpìlì” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú òye pé gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì ni ọ̀rọ̀ náà ń tọ́ka sí.
  alternative: “àgbàlá tẹ́ńpìlì” tàbí “gbogbo àgbègbè tẹ́ńpìlì”; kì í ṣe “ibi mímọ́ inú tẹ́ńpìlì” nìkan.
  rationale: Ἱερόν sábà máa ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, ní ìyàtọ̀ sí ναός, tó lè tọ́ka sí ilé mímọ́ inú rẹ̀. Ìtumọ̀ pàtàkì dúró ṣókí, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ibi náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lo “ń tajà” dípò ọ̀rọ̀ tó lè dín wọn kù sí irú àwọn olùtajà kan, nítorí ẹsẹ náà kò sọ ohun tí wọ́n ń tà.
