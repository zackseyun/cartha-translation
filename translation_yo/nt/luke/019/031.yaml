id: LUK.19.31
reference: Luke 19:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá sì bi yín pé, “Èé ṣe tí ẹ fi ń tú u?” ẹ ó sọ báyìí pé, “Olúwa[a] nílò rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá nílò rẹ̀.”
    reason: Ìtumọ̀ míì tí κύριος lè ní nínú àyíká ọ̀rọ̀ yìí ni ‘ọ̀gá.’
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: bi … pé
  rationale: Ọ̀nà àdánidá ní Yorùbá ni ‘bi ẹnìkan pé’ fún bíbéèrè ìbéèrè tààrà.
- source_word: Διὰ τί
  choice: Èé ṣe
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere, tí ó sì jẹ́ àdánidá jù lọ láti béèrè ìdí.
- source_word: λύετε
  choice: ẹ fi ń tú u
  rationale: Nínú àyíká ọ̀rọ̀ yìí, λύω túmọ̀ sí yíyan okùn tí a fi so ọmọ kẹ́tẹ́kẹ́tẹ́ náà; ‘tú u’ sọ èyí ní kedere.
- source_word: οὕτως ἐρεῖτε
  choice: ẹ ó sọ báyìí pé
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà ní agbára ìtọ́ni; ‘ẹ ó sọ báyìí’ pa agbára yẹn mọ́ ní Yorùbá tó ṣe déédé.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ pa oyè náà àti ìtumọ̀ ẹ̀kọ́ nípa Jésù mọ́, nígbà tí àyíká ọ̀rọ̀ tún lè jẹ́ kí a gbọ́ ọ gẹ́gẹ́ bí ọ̀gá.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Yorùbá ‘rẹ̀’ kò fi akọ tàbí abo hàn, ó sì lè tọ́ka sí ẹranko náà láìfi ìtumọ̀ tí Gíríìkì kò sọ kún un.
- source_word: χρείαν ἔχει
  choice: nílò
  rationale: ‘Nílò’ ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún gbólóhùn Gíríìkì náà.
theological_decisions:
- issue: Ìtọ́kasí àti agbára Ὁ κύριος
  choice: Olúwa
  alternative: ọ̀gá
  rationale: Nínú ìtàn Lúùkù, κύριος sábà máa ń tọ́ka sí Jésù, ‘Olúwa’ sì pa ìró ẹ̀kọ́ ìgbàgbọ́ oyè náà mọ́. Síbẹ̀, a fi àlàyé ìsàlẹ̀ ojú ewé hàn nítorí ‘ọ̀gá’ tún ṣeé ṣe nínú àyíká ìṣẹ̀lẹ̀ náà.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀ ni a lò fún ọ̀pọ̀ ọmọ-ẹ̀yìn (‘yín,’ ‘ẹ’). Èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní ọlá. ‘Rẹ̀’ pa àìsọ pàtó ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́ ní ti akọ tàbí abo.
