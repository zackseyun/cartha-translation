  to: Nígbà tí ó padà dé lẹ́yìn tí ó ti gba ìjọba, ó pàṣẹ pé kí a pe àwọn ẹrú rẹ̀ wọ̀nyí tí ó ti fún ní owó náà wá sọ́dọ̀ rẹ̀, kí ó lè mọ ohun tí wọ́n ti jèrè nínú òwò.[a]
  rationale: 'Àtúnṣe náà jẹ́ ti ìṣètò àti ìtọ́kasí gbolohun nìkan: ó so ọ̀rọ̀ ìbátan náà mọ́ àwọn ẹrú tí ó ń ṣàlàyé, láì yí ìtumọ̀ tàbí ìpele ìdánilójú ẹsẹ náà padà. A tún lo “èrè tí wọ́n ti ṣe,” èyí tí ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ ju “èrè tí wọ́n ti jẹ” lọ nínú àlàyé ẹsẹ̀.'
