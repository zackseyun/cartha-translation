id: LUK.19.15
reference: Luke 19:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: yo
  text: Nígbà tí ó padà dé lẹ́yìn tí ó ti gba ìjọba, ó pàṣẹ pé kí a pe àwọn ẹrú rẹ̀ wọ̀nyí tí ó ti fún ní owó náà wá sọ́dọ̀ rẹ̀, kí ó lè mọ ohun tí wọ́n ti jèrè nínú òwò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ohun tí wọ́n ti ṣe nínú òwò” tàbí “èrè tí wọ́n ti ṣe.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ṣíṣe òwò àti àbájáde rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Nígbà tí
  rationale: Àgbékalẹ̀ ìtàn yìí ń ṣí ìṣẹ̀lẹ̀ tó tẹ̀ lé e; ní Yorùbá, gbólóhùn àkókò taara dára ju fífi ‘ó sì ṣẹlẹ̀’ kún un lọ.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: ó padà dé
  rationale: Ọ̀rọ̀ infinitive pẹ̀lú ἐν ní agbára àkókò; ‘padà dé’ jẹ́ ọ̀nà àdánidá láti sọ pé ó dé láti ìrìnàjò rẹ̀.
- source_word: λαβόντα τὴν βασιλείαν
  choice: lẹ́yìn tí ó ti gba ìjọba
  rationale: Participle náà tọ́ka sí ohun tó ti ṣẹlẹ̀ ṣáájú àṣẹ náà; ‘gba’ dá ìtumọ̀ ìfúnni ní ipò ọba dúró láì sọ pé ó fi ipá gbà á.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: Nínú àkòrí òwe yìí, ọ̀rọ̀ náà lè túmọ̀ sí àṣẹ tàbí ipò ọba; ‘ìjọba’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì pa ìfẹ̀ ìtumọ̀ náà mọ́.
- source_word: φωνηθῆναι αὐτῷ
  choice: kí a pe ... wá sọ́dọ̀ rẹ̀
  rationale: Passive infinitive náà túmọ̀ sí pípe tàbí ránṣẹ́ pè wọ́n sí iwájú rẹ̀; àgbékalẹ̀ yìí mọ́gbọ́n dání ní Yorùbá.
- source_word: δούλους
  choice: àwọn ẹrú rẹ̀
  rationale: Nínú ipò àwùjọ òwe náà, àwọn ẹni wọ̀nyí wà lábẹ́ àṣẹ olówó wọn gẹ́gẹ́ bí ẹni tí a ní; ‘ẹrú’ pa ìbáṣepọ̀ ìdè náà mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: δεδώκει
  choice: tí ó ti fún ní
  rationale: Pluperfect náà fi hàn pé fífún wọn ní owó ti ṣẹlẹ̀ ṣáájú ìpadàbọ̀ rẹ̀.
- source_word: ἀργύριον
  choice: owó náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè jẹ́ fàdákà ní tààrà, nínú ẹsẹ yìí ó ń tọ́ka sí owó tí ó fi lé wọn lọ́wọ́; kò tún dárúkọ ìwọ̀n mina níbí.
- source_word: ἵνα γνοῖ
  choice: kí ó lè mọ
  rationale: Èyí pa agbára ète inú ἵνα mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: τί διεπραγματεύσαντο
  choice: ohun tí wọ́n ti jèrè nínú òwò
  rationale: Ọ̀rọ̀-ìṣe náà ní í ṣe pẹ̀lú ṣíṣe òwò àti àbájáde rẹ̀; ìtumọ̀ yìí mú ìṣe àti èrè jáde, ṣùgbọ́n àlàyé ẹsẹ̀ pa ìtumọ̀ gbooro mọ́.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú òwe nípa ọrọ̀ ajé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: 'Ìbáṣepọ̀ wọn pẹ̀lú ọlọ́lá náà ju ti òṣìṣẹ́ lasán lọ: wọ́n wà lábẹ́ àṣẹ rẹ̀, ó sì fi ohun-ìní rẹ̀ lé wọn lọ́wọ́. ‘Ẹrú’ fi ipò ìdè àwùjọ náà hàn láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.'
- issue: Ìtumọ̀ βασιλεία ní ipò òṣèlú òwe náà
  choice: ìjọba
  alternative: ipò ọba tàbí àṣẹ ọba
  rationale: ‘Ìjọba’ jẹ́ gbooro tó láti gba ilẹ̀ ọba àti àṣẹ ìṣàkóso; a kò fi dandan pinnu bóyá ohun tó gba ni ilẹ̀, ipò, tàbí agbára ìṣàkóso nìkan.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmi ohùn ní kíkún níbi tó bá bá àṣà ìkọ̀wé mu; a yẹra fún ọ̀rọ̀ àtijọ́ bí ‘ó sì ṣe’ fún àgbékalẹ̀ ἐγένετο, nítorí gbólóhùn àkókò taara jẹ́ àdánidá sí i.
