language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ará ìlú rẹ̀ kórìíra rẹ̀, wọ́n sì rán ẹgbẹ́ aṣojú kan[a] tẹ̀ lé e, wọ́n ní, ‘Àwa kò fẹ́ kí ọkùnrin yìí jẹ ọba lórí wa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìjọ aṣojú kan.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹgbẹ́ aṣojú tí a rán lọ ní iṣẹ́ òṣìṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: àwọn ará ìlú
  rationale: Èyí pa ìtumọ̀ ọmọ ẹgbẹ́ àwùjọ olóṣèlú mọ́, láì pe wọ́n ní ọmọ abẹ́ ọba kí ọ̀rọ̀ náà tó fi hàn pé wọ́n kọ ìjọba rẹ̀.
- source_word: ἐμίσουν
  choice: kórìíra
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìkórìíra tí ó ń bá a lọ tàbí tí ó ti di ìwà wọn; ọ̀nà àdánidá ni ‘kórìíra’ láti sọ ọ́ nínú ìtàn Yorùbá.
- source_word: ἀπέστειλαν
  choice: rán
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe ìtàn tó rọrùn, tí ‘rán’ sì túmọ̀ rẹ̀ ní kedere láì fi ìtumọ̀ míì kún un.
- source_word: πρεσβείαν
  choice: ikọ̀ aṣojú kan
  rationale: Ó ń tọ́ka sí ẹgbẹ́ àwọn aṣojú tí a rán lọ fún iṣẹ́ pàtó; gbólóhùn yìí jẹ́ ti Yorùbá òde òní, ó sì pa àyíká olóṣèlú mọ́.
- source_word: ὀπίσω αὐτοῦ
  choice: tẹ̀ lé e
  rationale: Nínú àyíká yìí, wọ́n rán ikọ̀ náà lọ lẹ́yìn rẹ̀ lẹ́yìn tí ó ti kúrò; ‘tẹ̀ lé e’ sọ èyí ní Yorùbá àdánidá.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ó ṣí ọ̀rọ̀ tí ikọ̀ aṣojú náà mú lọ; ‘wọ́n ní’ jẹ́ ìsopọ̀ ìtàn tó ṣe kedere.
- source_word: Οὐ θέλομεν
  choice: Àwa kò fẹ́
  rationale: Ó fi ìfẹ́-inú àti ìkọ̀sílẹ̀ wọn hàn ní èdè Yorùbá tó wọ́pọ̀.
- source_word: τοῦτον
  choice: ọkùnrin yìí
  rationale: Èyí mú ìjìnnà àti ẹ̀mí ìkọ̀sílẹ̀ tó wà nínú ọ̀rọ̀ atọ́ka náà jáde, láì sọ ọ́ di ẹ̀gàn tó lágbára ju ti Gíríìkì lọ.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: jẹ ọba lórí wa
  rationale: Èyí pa àwòrán ìjọba ọba mọ́ kedere ju ọ̀rọ̀ gbogbogbò bí ‘ṣàkóso wa’ lọ, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìṣèlú àti ti ọba nínú òwe náà
  choice: jẹ ọba lórí wa
  alternative: ṣàkóso wa
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ní pàtó nípa jíjẹ ọba. Ìtumọ̀ yìí pa àwòrán ọba àti ìkọ̀sílẹ̀ àṣẹ rẹ̀ mọ́, láì fi ìtumọ̀ àpẹẹrẹ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní tààrà kún un.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. ‘Àwọn ará ìlú’ pa ìtumọ̀ civic mọ́; ‘jẹ ọba lórí wa’ sì pa èdè ìjọba ọba mọ́. A gbé àmì àlàyé [a] sí ‘ikọ̀ aṣojú kan,’ ibi tí àlàyé ọ̀rọ̀ πρεσβεία ti jẹ mọ́.
