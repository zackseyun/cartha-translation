source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé bí ó ti sún mọ́ Bẹtifágè àti Bẹtani, sí Òkè tí a ń pè ní Òlífì, ó rán méjì lára àwọn ọmọ-ẹ̀yìn náà
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó pa àgbékalẹ̀ ìtàn Lúùkù mọ́ ní èdè Yorùbá àdánidá; “sì” tún fi ìsopọ̀ καί hàn.
- source_word: ὡς
  choice: bí ó ti
  rationale: Ó mú ìtumọ̀ àkókò jáde, ó sì fi hàn pé ìsúnmọ́ náà ń lọ lọ́wọ́.
- source_word: ἤγγισεν
  choice: sún mọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún lílọ sún mọ́ ibi kan.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: mọ́ Bẹtifágè àti Bẹtani
  rationale: Pẹ̀lú “sún,” “mọ́” ni ìṣọ̀kan gírámà Yorùbá tó dára jù fún àwọn orúkọ ibi náà.
- source_word: πρὸς τὸ ὄρος
  choice: níhà òkè
  rationale: Ó ṣàfihàn ìtọ́sọ́nà tàbí ipò ní ìbámu pẹ̀lú òkè náà láìfi ìtumọ̀ tó ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: tí a ń pè ní Òlífì
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ Gíríìkì “tí a ń pè ní Olifi” mọ́, dípò fífi “Òkè Olifi” kún un lẹ́ẹ̀kejì; “Òlífì” jẹ́ orúkọ ibi nínú àyíká yìí.
- source_word: ἀπέστειλεν
  choice: ó rán
  rationale: Ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye fún iṣẹ́ ríran ènìyàn lọ.
- source_word: δύο τῶν μαθητῶν
  choice: méjì lára àwọn ọmọ-ẹ̀yìn náà
  rationale: Ó fi ìtumọ̀ apá kan nínú ẹgbẹ́ hàn, ó sì yẹra fún fífi “tirẹ̀” kún un níbi tí kò ti hàn gbangba nínú Gíríìkì.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún níbi tó bá jẹ́ àdánidá, pẹ̀lú ìforúkọsílẹ̀ àwọn ibi gẹ́gẹ́ bí Bẹtifágè àti Bẹtani. Àṣà ọ̀rọ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní.
