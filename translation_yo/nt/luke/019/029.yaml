review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Lukan narrative formula, the temporal approach, the two place names, the sending, and the partitive sense of ‘two of the disciples.’ However, “níhà òkè” is not a sufficiently clear or idiomatic rendering of πρὸς τὸ ὄρος in this construction and can suggest ‘on the side of a mountain’ rather than movement toward the named mount.
  naturalness: “Ó sì ṣẹlẹ̀ pé bí ó ti sún mọ́ …” is understandable Standard Yoruba. Recasting the directional phrase as “sí Òkè tí a ń pè ní Òlífì” gives a clearer, natural narrative sequence while retaining the source’s wording ‘called Olives.’
  terminology: Bẹtifágè, Bẹtani, and ọmọ-ẹ̀yìn are suitable. Òlífì is retained as the place designation rather than importing an interpretive expansion into the text.
  issues:
  - severity: medium
    issue: The phrase “níhà òkè tí a ń pè ní Òlífì” is directionally and syntactically ambiguous.
    rationale: πρὸς τὸ ὄρος identifies the approach in relation to the mount. In Yoruba, “níhà òkè” can mean ‘at/on the side of a mountain’; “sí Òkè…” clearly expresses the intended direction without adding meaning.
  revised_text: Ó sì ṣẹlẹ̀ pé bí ó ti sún mọ́ Bẹtifágè àti Bẹtani, sí Òkè tí a ń pè ní Òlífì, ó rán méjì lára àwọn ọmọ-ẹ̀yìn náà
  revised_footnotes: []
