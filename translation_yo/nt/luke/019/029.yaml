  to: Ó sì ṣẹlẹ̀ pé bí ó ti sún mọ́ Bẹtifágè àti Bẹtani, sí Òkè tí a ń pè ní Òlífì, ó rán méjì lára àwọn ọmọ-ẹ̀yìn náà
