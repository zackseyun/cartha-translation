id: LUK.19.9
reference: Luke 19:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: yo
  text: Jésù sì sọ fún un pé, “Lónìí, ìgbàlà ti dé sí ilé yìí[a], nítorí pé òun náà jẹ́ ọmọ Ábúráhámù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará ilé yìí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilé fúnra rẹ̀ tàbí sí àwọn ènìyàn inú ilé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Jésù sì wí
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn tó rọrùn, ó sì ń tẹ̀ síwájú láìfi ìtakora tàbí ìtẹ̀lé àkókò tó lágbára kún ọ̀rọ̀ náà.
- source_word: πρὸς αὐτὸν
  choice: fún un
  rationale: Ó pa arọ́pò-orúkọ inú Gíríìkì mọ́, láìfi orúkọ Sákíúsì kún ẹsẹ yìí.
- source_word: Σήμερον
  choice: Lónìí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tó ṣe déédéé, ó sì pa ìtẹnumọ́ àkókò tó wà ní ìbẹ̀rẹ̀ gbólóhùn Gíríìkì mọ́.
- source_word: σωτηρία
  choice: ìgbàlà
  rationale: “Ìgbàlà” pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀ nínú Lúùkù mọ́ ju ọ̀rọ̀ tó túmọ̀ sí ìdáǹdè lásán lọ.
- source_word: τῷ οἴκῳ τούτῳ
  choice: sí ilé yìí
  rationale: “Ilé” ni ìbámu taara pẹ̀lú οἶκος, ó sì lè tọ́ka sí ilé gẹ́gẹ́ bí ibi tàbí sí àwọn ará ilé; àlàyé ìtumọ̀ kejì wà ní àlàyé ìsàlẹ̀.
- source_word: ἐγένετο
  choice: ti dé
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, “ti dé” jẹ́ Yorùbá àdánidá fún bí ìgbàlà ṣe dé wáyé, ó sì fi àbájáde tó wà ní báyìí hàn.
- source_word: καθότι
  choice: nítorí pé
  rationale: Ó fi ìdí tí Jésù fi kéde ọ̀rọ̀ náà hàn ní kedere.
- source_word: καὶ αὐτὸς
  choice: òun náà
  rationale: Ọ̀rọ̀ yìí pa ìtẹnumọ́ pé ẹni yìí náà wà lára wọn mọ́.
- source_word: υἱὸς Ἀβραάμ
  choice: ọmọ Ábúráhámù
  rationale: Ó pa àkànlò èdè ìdílé àti májẹ̀mú náà mọ́, láìdín in kù sí ìran ẹ̀jẹ̀ nìkan tàbí túmọ̀ rẹ̀ gẹ́gẹ́ bí ọmọ ìgbàgbọ́ nìkan.
theological_decisions:
- issue: Ìtumọ̀ “ọmọ Ábúráhámù”
  choice: A pa àkànlò náà mọ́ bí ọ̀rọ̀ ìdánimọ̀ àti májẹ̀mú, láìsọ bóyá ó ń tọ́ka sí ìran Ábúráhámù, jíjẹ́ ọmọ ẹgbẹ́ olóòótọ́ nínú ìdílé ìgbàgbọ́ rẹ̀, tàbí àwọn méjèèjì.
  alternative: “àtọmọdọ́mọ Ábúráhámù” tàbí “ọmọ nínú ìdílé ìgbàgbọ́ Ábúráhámù”
  rationale: Ẹsẹ náà fúnra rẹ̀ kò yan ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí; pípa àkànlò náà mọ́ ń jẹ́ kí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà dúró.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó níyì, tó ṣe kedere, tó sì yé òǹkàwé òde òní. A fi àmì ohùn sí ibi tó yẹ, a sì pa ìtẹnumọ́ àti àìdánilójú tó wà nínú orísun Gíríìkì mọ́.
