reference: Luke 19:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: yo
  text: Nígbà tí Jésù dé ibi náà, ó gbójú sókè, ó sì sọ fún un pé, “Sákéù, yára sọ̀kalẹ̀, nítorí pé mo gbọ́dọ̀[b] dúró ní ilé rẹ[a] lónìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “nínú ilé rẹ” tàbí “ní ibùgbé rẹ.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì δεῖ, “gbọ́dọ̀,” lè ní ìtumọ̀ ìjẹ́dandan tí ó so mọ́ iṣẹ́ Jésù tàbí ète Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Nígbà tí
  rationale: Nínú ìtẹ̀síwájú ìtàn yìí, ọ̀rọ̀ náà ń ṣàmì sí àkókò; “Nígbà tí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: ἐπὶ τὸν τόπον
  choice: dé ibi náà
  rationale: Ó fi hàn pé Jésù dé ibi pàtó tí Sákéù wà, láìfi ìtumọ̀ míì kún un.
- source_word: ἀναβλέψας
  choice: ó gbójú sókè
  rationale: Ó ṣàpèjúwe bí Jésù ṣe darí ojú rẹ̀ sókè sí Sákéù tí ó wà lórí igi.
- source_word: εἶπεν πρὸς αὐτόν
  choice: ó sì sọ fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ìlànà ọ̀rọ̀ ìtàn mu.
- source_word: Ζακχαῖε
  choice: Sákéù
  rationale: A lo ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: σπεύσας κατάβηθι
  choice: yára sọ̀kalẹ̀
  rationale: Àṣẹ náà ní ìkánjú nínú rẹ̀; “yára sọ̀kalẹ̀” sọ agbára yẹn jáde ní Yorùbá àdánidá.
- source_word: σήμερον γὰρ
  choice: nítorí pé … lónìí
  rationale: γάρ ń fúnni ní ìdí fún àṣẹ náà; gbígbé “lónìí” sí òpin gbólóhùn jẹ́ ètò ọ̀rọ̀ Yorùbá tí ó rọgbọ.
- source_word: ἐν τῷ οἴκῳ σου
  choice: sí ilé rẹ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, οἶκος tọ́ka sí ibùgbé Sákéù, ibi tí Jésù yóò dúró sí.
- source_word: δεῖ
  choice: mo gbọ́dọ̀
  rationale: “Gbọ́dọ̀” pa agbára ìjẹ́dandan mọ́, ó sì lágbára ju ọ̀rọ̀ tí yóò túmọ̀ sí pé Jésù kàn nílò láti ṣe bẹ́ẹ̀.
- source_word: μεῖναι
  choice: dúró
  rationale: Níbí, ọ̀rọ̀ náà túmọ̀ sí láti wà tàbí gbé ní ibì kan fún àkókò kan; “dúró” jẹ́ kedere, kò sì dín ìtumọ̀ náà sí sísùn mọ́jú kan ṣoṣo.
theological_decisions:
- issue: Agbára δεῖ nínú ẹ̀kọ́ ìtàn Lúùkù
  choice: mo gbọ́dọ̀
  alternative: mo ní láti; ó ṣe pàtàkì kí n
  rationale: δεῖ lè tọ́ka sí ìjẹ́dandan tí ó so mọ́ iṣẹ́ Jésù tàbí ète Ọlọ́run. “Mo gbọ́dọ̀” pa ìjẹ́dandan náà mọ́ láìsọ ní pàtó pé ta ni ó gbé e lé Jésù lọ́wọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. A gbé àmì àlàyé [a] sí ọ̀dọ̀ “ilé rẹ” àti [b] sí ọ̀dọ̀ “gbọ́dọ̀,” nítorí ibẹ̀ ni ọ̀kọ̀ọ̀kan ti bá ọ̀rọ̀ Gíríìkì tí àlàyé rẹ̀ ń tọ́ka sí mu.
