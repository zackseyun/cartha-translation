id: LUK.10.22
reference: Luke 10:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: yo
  text: Baba mi ti fi ohun gbogbo lé mi lọ́wọ́[a]. Kò sí ẹni tí ó mọ ẹni tí Ọmọ náà jẹ́ bí kò ṣe Baba; bẹ́ẹ̀ náà ni kò sí ẹni tí ó mọ ẹni tí Baba jẹ́ bí kò ṣe Ọmọ àti ẹnikẹ́ni tí Ọmọ bá yàn láti fi Baba hàn fún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Baba mi ti fi ohun gbogbo fún mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹnikẹ́ni tí Ọmọ bá fẹ́ láti fi Baba hàn fún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ tó gbòòrò, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘gbogbo nǹkan’ tàbí ‘everything’ láì dín ààlà rẹ̀ kù.
- source_word: παρεδόθη
  choice: ti fi ... lé mi lọ́wọ́
  rationale: Èyí fi ìṣe tí Baba ṣe ní fífi ohun gbogbo sí ọwọ́ Ọmọ hàn, ó sì pa àwòrán ‘handed over’ mọ́ ju ‘fi fún mi’ lọ, bó tilẹ̀ jẹ́ pé ó tún lè ní ìmọ̀lára ohun tí a fi sí ìkáwọ́ ẹni.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Baba mi ti fi
  rationale: Nítorí pé Yorùbá sábà máa ń lo gbólóhùn olùṣe dípò gbólóhùn àìṣe, a sọ Baba ní olùṣe ní tààrà, tí ó bá ìtumọ̀ ὑπό pẹ̀lú olùṣe mu.
- source_word: γινώσκει
  choice: mọ
  rationale: ‘Mọ’ ni ìtumọ̀ pàtàkì ọ̀rọ̀ náà; a kò fi ‘mọ ní kíkún’ kún un, kí a má bàa túmọ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: τίς ἐστιν ὁ υἱὸς
  choice: ẹni tí Ọmọ náà jẹ́
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ìbéèrè nípa ẹni tí ẹnì kan jẹ́, ó sì pa ìtumọ̀ ti ara ẹni àti ti ìbáṣepọ̀ mọ́.
- source_word: ὁ υἱός
  choice: Ọmọ náà
  rationale: ‘Ọmọ’ ni a lò gẹ́gẹ́ bí orúkọ oyè ìbáṣepọ̀ Kristi nínú àyíká yìí; lẹ́tà ńlá àti ‘náà’ ń fi ẹni pàtó tí a ń tọ́ka sí hàn.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Èyí jẹ́ orúkọ oyè ìbáṣepọ̀ fún Ọlọ́run nínú àyíká náà; lẹ́tà ńlá ń fi ẹni tí a ń tọ́ka sí hàn láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ẹnikẹ́ni tí Ọmọ bá yàn láti fi Baba hàn fún
  rationale: Gbólóhùn yìí pa olùgbà àìsọ pàtó àti ìfẹ́-inú Ọmọ mọ́. A tún sọ ‘Baba’ ní tààrà nítorí pé Yorùbá nílò ohun tí a ń fi hàn kedere níbí, bí ó tilẹ̀ jẹ́ pé ó fara sin nínú Gíríìkì.
- source_word: βούληται
  choice: bá yàn
  rationale: ‘Yàn’ ń sọ ìpinnu àti ìfẹ́-inú Ọmọ ní Yorùbá òde òní láì sọ ọ́ di ọ̀rọ̀ àtijọ́ tàbí dín agbára ìpinnu rẹ̀ kù.
- source_word: ἀποκαλύψαι
  choice: láti fi Baba hàn
  rationale: ‘Fi ... hàn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣí ẹni payá tàbí mímú kí a mọ̀ ọ́n; ó pa ìtumọ̀ ìṣípayá mọ́ láì di ọ̀rọ̀ ẹ̀kọ́ pàtó.
theological_decisions:
- issue: Ìmọ̀ aláìlẹ́gbẹ́ tí Baba àti Ọmọ ní nípa ara wọn
  choice: A pa ọ̀rọ̀ náà mọ́ pé kò sí ẹlòmíràn tí ó mọ ẹni tí Ọmọ jẹ́ bí kò ṣe Baba, tàbí ẹni tí Baba jẹ́ bí kò ṣe Ọmọ.
  alternative: Fífi ‘mọ ní kíkún’ tàbí ‘mọ ní tòótọ́’ kún un.
  rationale: Ìṣètò gbólóhùn fúnra rẹ̀ ru ìwúwo ẹ̀kọ́ náà; fífi ọ̀rọ̀ míì kún γινώσκει yóò túmọ̀ ju ẹ̀rí orísun lọ.
- issue: Ìfẹ́-inú Ọmọ nínú ṣíṣí Baba payá
  choice: A lò ‘yàn láti fi Baba hàn’ láti pa ipa ìpinnu Ọmọ mọ́.
  alternative: ‘fẹ́ láti fi Baba hàn’ tàbí àtúnsọ tí yóò dín ipa Ọmọ kù.
  rationale: Gíríìkì fi Ọmọ hàn gẹ́gẹ́ bí ẹni tí ó pinnu ẹni tí yóò fi Baba hàn fún. Ìtumọ̀ náà kò rọ ọ̀rọ̀ yìí, bẹ́ẹ̀ ni kò fi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo gbólóhùn olùṣe ní ìbẹ̀rẹ̀ nítorí pé ó jẹ́ àdánidá ju àìṣe lọ ní Yorùbá, a sì pa ìtẹnumọ́, ìyàsọ́tọ̀ àti ìfarahàn ìbáṣepọ̀ Baba–Ọmọ ti orísun mọ́.
