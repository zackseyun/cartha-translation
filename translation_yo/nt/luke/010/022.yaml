  terminology: “Baba,” “Ọmọ,” “mọ,” àti “fi ... hàn” jẹ́ ọ̀rọ̀ tó yẹ, tó ṣe kedere, tí kò sì kún ìtumọ̀ ẹ̀kọ́ ìjọsìn sí i. “Ọmọ náà” ń ṣiṣẹ́ gẹ́gẹ́ bí ìtọ́kasí sí Ọmọ pàtó nínú àyíká náà. Àwọn àlàyé abẹ́lẹ̀ mejeeji jẹ́ yíyàn ọ̀rọ̀ tí ó bófin mu, àti àwọn àmì wọn wà ní ibi tó yẹ.
