  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: πάντα jẹ́ “ohun gbogbo”; a pa ìṣe tí Baba ṣe nínú παρεδόθη mọ́ nínú “ti fi ... lé ... lọ́wọ́”; àwọn gbólóhùn ìmọ̀ àìlẹ́gbẹ́ náà sì tẹ̀lé ìṣètò àti ààlà orísun. “Ẹnikẹ́ni tí Ọmọ bá yàn láti fi Baba hàn fún” ṣàfihàn olùgbà tí a kò sọ pàtó àti ìpinnu Ọmọ, níbi tí “Baba” jẹ́ ohun tí a ṣí payá.'
