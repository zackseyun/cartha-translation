translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, àdánidá, àti òde òní pẹ̀lú àmì ohùn ní kíkún. Fọ́ọ̀mù ‘ẹ’ bá ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀ mu, ó sì tún pa ìlànà ọ̀wọ̀ mọ́. A gbé àmì àlàyé [a] sí ‘àwọn ojú pópó rẹ̀,’ ibi tí ọ̀rọ̀ Gíríìkì πλατείας wà ní pàtó.
