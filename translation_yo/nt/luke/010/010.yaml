  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: yo
  text: Ṣùgbọ́n ìlú èyíkéyìí tí ẹ bá wọ̀, tí wọn kò bá sì gbà yín, ẹ jáde lọ sí àwọn ojú pópó rẹ̀[a], kí ẹ sì sọ pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ibi gbangba rẹ̀’ tàbí ‘àwọn ojú ọ̀nà fífẹ̀ rẹ̀.’ Ọ̀rọ̀ Gíríìkì πλατείας ń tọ́ka sí àwọn ojú ọ̀nà fífẹ̀ tàbí àwọn ibi gbangba tí gbogbo ènìyàn ti ń kọjá tàbí ti ń péjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Ṣùgbọ́n ìlú èyíkéyìí tí
  rationale: Àkópọ̀ ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú ἄν jẹ́ àìnípẹ̀kun, ó sì ń tọ́ka sí ìlú èyíkéyìí tí ọ̀ràn náà bá ṣẹlẹ̀ sí; ‘ìlú èyíkéyìí tí’ mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: εἰσέλθητε
  choice: ẹ bá wọ̀
  rationale: Ọ̀rọ̀-ìṣe yìí túmọ̀ sí wíwọ inú ìlú; lílo ‘bá’ bá ìtumọ̀ gbólóhùn àídájú náà mu dáadáa.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: wọn kò sì gbà yín
  rationale: ‘Gbà yín’ lè túmọ̀ sí gbígba àwọn oníṣẹ́ náà wọlé tàbí fífi inú rere tẹ́wọ́ gbà wọ́n, láì fi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ Gíríìkì náà lórí.
- source_word: ἐξελθόντες
  choice: ẹ jáde lọ
  rationale: Ọ̀rọ̀ alábápín yìí ṣáájú àṣẹ εἴπατε, ó sì ń fi ìgbésẹ̀ tí wọ́n gbọ́dọ̀ kọ́kọ́ ṣe hàn; àṣẹ tààrà ‘ẹ jáde lọ’ jẹ́ èdè Yorùbá àdánidá.
- source_word: τὰς πλατείας αὐτῆς
  choice: àwọn ojú pópó rẹ̀
  rationale: πλατεῖα ń tọ́ka sí ojú ọ̀nà fífẹ̀ tàbí ibi gbangba nínú ìlú. ‘Àwọn ojú pópó rẹ̀’ jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní yóò lóye nírọ̀rùn, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ibi gbangba mọ́.
- source_word: εἴπατε
  choice: kí ẹ sì wí pé
  rationale: Àṣẹ ọ̀rọ̀-ìṣe λέγω ni; ‘kí ẹ sì wí pé’ fi àṣẹ náà àti ìṣíwájú ọ̀rọ̀ tí yóò tẹ̀ lé e hàn lọ́nà tó bójú mu.
