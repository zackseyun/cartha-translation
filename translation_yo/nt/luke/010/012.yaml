  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: yo
  text: Mo sọ fún yín pé, ní ọjọ́ náà yóò rọrùn fún Sódómù láti faradà ju fún ìlú náà lọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ṣeé faradà jù.” Ọ̀rọ̀ afiwéra Gíríìkì ἀνεκτότερον lè túmọ̀ sí ọ̀nà méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: “Ọjọ́ náà” ń tọ́ka sí ọjọ́ ìdájọ́ Ọlọ́run; àwọn ẹsẹ̀ mìíràn tí ó jọ èyí sọ èyí ní kedere.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín pé
  rationale: Ó jẹ́ ọ̀rọ̀ ìmúdájú tààrà ní àkókò ìsinsìnyí; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ tí a ń sọ tààrà mọ́.
- source_word: Σοδόμοις
  choice: fún Sódómù
  rationale: Dátífù púpọ̀ náà lè tọ́ka sí àwọn ará Sódómù tàbí Sódómù gẹ́gẹ́ bí àwùjọ; lílo orúkọ ibi náà ní ọ̀nà àpèjúwe jẹ́ ṣókí, ó sì pa ìtumọ̀ àpapọ̀ mọ́ láì ṣàlàyé rẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ní ọjọ́ náà
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn àkókò náà; kò fi ọ̀rọ̀ ‘ìdájọ́’ kún ẹsẹ̀ náà.
- source_word: ἀνεκτότερον
  choice: yóò rọrùn láti fara da
  rationale: Ó mú ìtumọ̀ afiwéra ohun tí ó ṣeé fara dà ju òmíràn lọ hàn ní Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἔσται
  choice: yóò
  rationale: Ó pa ìgbà ọjọ́ iwájú ti ọ̀rọ̀-ìṣe ‘láti jẹ́’ mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: ju fún ìlú náà lọ
  rationale: Ilana ‘ju … lọ’ fi afiwéra Gíríìkì hàn, ‘ìlú náà’ sì pa πόλις àti atọ́ka ἐκείνῃ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ọjọ́ náà’
  choice: Pa ‘ní ọjọ́ náà’ mọ́ láì fikún ‘ọjọ́ ìdájọ́’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ní ọjọ́ ìdájọ́
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ọjọ́ ìdájọ́ Ọlọ́run, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ ‘ọjọ́ náà’ nìkan. Èyí pa àìsọ pàtó ti orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní èdè òde òní tó ní iyì, tó sì yé òǹkàwé gbogbogbò. A fi ‘fara da’ sọ ìfaradà ìdájọ́ ní ọ̀nà àdánidá, a kò sì sọ ohun tí yóò ṣẹlẹ̀ sí ‘àwọn ará Sódómù’ ní pàtó ju orísun lọ.
