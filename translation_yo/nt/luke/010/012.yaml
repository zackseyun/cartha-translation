  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì ti Gíríìkì mọ́: ìkéde tààrà, ọjọ́ tí a tọ́ka sí, afiwéra ‘ṣeé fara dà/rọrùn láti fara da’ àti ìlú tí a tọ́ka sí. Síbẹ̀, ìtòlẹ́sẹẹsẹ ‘yóò rọrùn láti fara da fún Sódómù’ kì í ṣe ọ̀nà Yorùbá tí ó rọrùn jù lọ láti sọ ẹni tí ìfaradà náà kan.'
  naturalness: A tún gún gbolóhùn náà sí ‘yóò rọrùn fún Sódómù láti faradà,’ èyí tí ó jẹ́ Yorùbá boṣewa, tí ó sì jẹ́ kí dátífù ‘fún Sódómù’ hàn kedere. A tún lo ‘faradà’ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe kan, dípò ‘fara da.’
  terminology: ‘Sódómù,’ ‘ọjọ́ náà,’ ‘ìlú náà,’ àti ‘ìdájọ́ Ọlọ́run’ jẹ́ ọ̀rọ̀ tó bá ìlò Yorùbá boṣewa àti ìmọ̀ ọ̀rọ̀ Ìwé Mímọ́ mu. A pa ‘Sódómù’ mọ́ gẹ́gẹ́ bí orúkọ ibi tó dúró fún àwọn ènìyàn rẹ̀, láì sọ ‘àwọn ará Sódómù’ kún un.
