reference: Luke 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: yo
  text: '‘Kódà erùpẹ̀ ìlú yín tí ó dì mọ́ ẹsẹ̀ wa[a], àwa ń nù ú kúrò lòdì sí yín[b]. Síbẹ̀, ẹ mọ èyí pé: ìjọba Ọlọ́run ti sún mọ́lé[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘erùpẹ̀ láti ìlú yín tí ó dì mọ́ wa ní ẹsẹ̀ wa’; ọ̀nà tí Gíríìkì gbà sọ ọ́ jẹ́ ọ̀rọ̀ àṣà, ó sì ń ṣàpèjúwe erùpẹ̀ ìlú náà tí ó dì mọ́ ẹsẹ̀ àwọn òjíṣẹ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ọ̀rọ̀ náà ní ‘àwa ń nù ú kúrò fún yín’; nínú àyíká yìí, dátífù náà ní ipa ẹ̀rí lòdì sí yín. Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí ‘nù kúrò’ ju ‘gbọn kúrò’ lọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘ti dé súnmọ́.’ Ìṣe pípé Gíríìkì fi hàn pé ìjọba Ọlọ́run ti sún mọ́lé, ìsúnmọ́ náà sì ṣì ní ìjẹ́pàtàkì nísinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: erùpẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí erùpẹ̀ ní pàtó, kì í ṣe ilẹ̀ tàbí ẹ̀gbin lápapọ̀; ó sì pa agbára àmì ìṣe náà mọ́.
- source_word: κολληθέντα
  choice: tí ó lẹ̀ mọ́
  rationale: Ó fi hàn pé erùpẹ̀ náà dì mọ́ ẹsẹ̀ àwọn òjíṣẹ́; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: εἰς τοὺς πόδας
  choice: mọ́ ẹsẹ̀ wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gangan bí ‘sí àwọn ẹsẹ̀,’ nínú àṣà ọ̀rọ̀ yìí ó ṣàpèjúwe erùpẹ̀ tí ó lẹ̀ mọ́ ẹsẹ̀.
- source_word: ἀπομασσόμεθα
  choice: àwa ń nù ún kúrò lára wa
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí nínù kúrò, kì í ṣe gbígbọn kúrò ní pàtó. ‘Lára wa’ jẹ́ kí ìṣe náà ṣe kedere láìfi ohun tí kò sí nínú orísun kún un.
- source_word: ὑμῖν
  choice: gẹ́gẹ́ bí ẹ̀rí lòdì sí yín
  rationale: Dátífù náà ní agbára ìtọ́kasí ọ̀tá tàbí ẹ̀rí nínú àyíká yìí. Ìtumọ̀ yìí mú agbára ìdájọ́ ìṣe náà jáde lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: πλήν
  choice: Síbẹ̀
  rationale: 'Ó fi ìyípadà tó lágbára hàn: láìka àmì ìdájọ́ náà sí, òtítọ́ pàtàkì kan ṣì wà tí wọ́n gbọ́dọ̀ mọ̀.'
- source_word: γινώσκετε
  choice: ẹ mọ
  rationale: Àṣẹ ìsinsìnyí náà ń pè fún mímọ̀ tàbí jíjẹ́wọ́ òtítọ́ náà; ‘ẹ mọ’ jẹ́ tààrà, ó sì bójú mu.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Ìṣe pípé náà sọ pé ìjọba náà ti dé sí ipò ìsúnmọ́ tí ó sì ní ìjẹ́pàtàkì títí di ìsinsìnyí; ‘ti sún mọ́lé’ pa ìṣẹ̀lẹ̀ àti àbájáde rẹ̀ mọ́.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè tọ́ka sí ìjọba àti ìṣàkóso Ọlọ́run láìyanjú ẹ̀dọ̀fu ọ̀rọ̀ náà ju bí orísun ṣe ṣe lọ.
theological_decisions:
- issue: Agbára àmì nínú erùpẹ̀ tí a nù kúrò
  choice: Ìṣe àmì gẹ́gẹ́ bí ẹ̀rí àti ìdájọ́ lòdì sí ìlú tí ó kọ ìhìn náà
  alternative: Ìṣe ìmọ́tótó tàbí ìṣe arìnrìn-àjò lásán
  rationale: ὑμῖν àti àyíká iṣẹ́ ìránṣẹ́ náà fi hàn pé ìṣe náà jẹ́ ẹ̀rí lòdì sí àwọn tí ó kọ ìhìn náà. Ìtumọ̀ náà mú èyí hàn láìṣàlàyé kọjá ọ̀rọ̀.
- issue: Ìtumọ̀ ìsúnmọ́ ìjọba Ọlọ́run
  choice: Ìjọba Ọlọ́run ti sún mọ́lé nínú iṣẹ́ àti ìhìn àwọn aṣojú Jésù, kódà níbi tí a ti kọ̀ ọ́
  alternative: Ìjọba náà kàn fẹ́ dé ní ọjọ́ iwájú; tàbí ìjọba náà ti pé pátápátá báyìí
  rationale: ἤγγικεν fi ìsúnmọ́ tí ó ti ṣẹlẹ̀ tí ó sì ń bá a lọ hàn, ṣùgbọ́n kò fi dandan sọ pé ìmúṣẹ rẹ̀ ti pé pátápátá. Èyí pa ẹ̀dọ̀fu nípa òpin ayé inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwa’ láti tẹnumọ́ ẹni tí ń ṣe ìṣe gẹ́gẹ́ bí Gíríìkì ṣe fi hàn, a sì pa àṣẹ ‘ẹ mọ’ àti ẹ̀dọ̀fu ìsúnmọ́ ìjọba Ọlọ́run mọ́.
