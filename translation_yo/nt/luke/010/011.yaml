  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ‘erùpẹ̀,’ ìfaradọ̀ mọ́ ẹsẹ̀, ìṣe nínù kúrò, agbára ìfẹ̀sùn/ẹ̀rí lòdì sí wọn, àti ìsúnmọ́ ìjọba Ọlọ́run. Ṣùgbọ́n ‘lẹ̀ mọ́’ kò dáa fún ìfaradọ̀ erùpẹ̀ mọ́ ẹsẹ̀ nínú Yorùbá òde òní; ‘dì mọ́’ jẹ́ kedere, ó sì jẹ́ àdánidá. ‘Lára wa’ nínú ìtumọ̀ àti àlàyé tún yí ibi tí a ti nù erùpẹ̀ náà kúrò láti ‘ẹsẹ̀ wa’ sí ara wa lápapọ̀.'
