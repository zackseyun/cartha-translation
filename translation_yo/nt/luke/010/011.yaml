  to: '‘Kódà erùpẹ̀ ìlú yín tí ó dì mọ́ ẹsẹ̀ wa[a], àwa ń nù ú kúrò lòdì sí yín[b]. Síbẹ̀, ẹ mọ èyí pé: ìjọba Ọlọ́run ti sún mọ́lé[c].’'
