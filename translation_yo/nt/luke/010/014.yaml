id: LUK.10.14
reference: Luke 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: yo
  text: Ṣùgbọ́n ní ìdájọ́, yóò ṣeé fara dà fún Tírè àti Sídónì ju fún yín lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò rọrùn fún Tírè àti Sídónì ju fún yín lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ líle wá sí ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé níbí.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: fún Tírè àti Sídónì
  rationale: Àwọn ọ̀rọ̀ náà wà ní dative, wọ́n sì ń tọ́ka sí àwọn tí ìdájọ́ yóò rọrùn fún jù.
- source_word: ἀνεκτότερον
  choice: yóò rọrùn ... láti fara dà á
  rationale: Ó fi ìtumọ̀ comparative ‘more bearable/tolerable’ hàn ní Yorùbá àdánidá, láì sọ pé ìdájọ́ náà kò le.
- source_word: ἔσται
  choice: yóò
  rationale: Ó pa ìṣe ọjọ́ iwájú ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐν τῇ κρίσει
  choice: ní ọjọ́ ìdájọ́
  rationale: Ọ̀nà Yorùbá àdánidá ni láti tọ́ka sí àsìkò ìdájọ́ pàtó náà; ‘ọjọ́’ ń ṣàlàyé àkókò láì ṣàfikún àbájáde ẹ̀kọ́ ìgbàgbọ́ sí i.
- source_word: ἢ ὑμῖν
  choice: ju fún yín lọ
  rationale: Ó parí ìfiwéra náà ní ọ̀nà Yorùbá tó ṣe kedere, ó sì pa ẹni kejì ọ̀pọ̀ nínú ὑμῖν mọ́.
theological_decisions:
- issue: Ìtumọ̀ κρίσις nínú àyíká ọ̀rọ̀
  choice: ìdájọ́ pàtó tí ń bọ̀
  alternative: ìdájọ́ ní ìtumọ̀ gbogbogbòò
  rationale: Àyíká ọ̀rọ̀ fi àwọn ìlú tí kò ronú pìwà dà wé Tírè àti Sídónì, èyí sì tọ́ka sí ìdájọ́ Ọlọ́run ní ọjọ́ iwájú. Gbólóhùn náà kò ṣàlàyé ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún lórí àwọn ọ̀rọ̀ Yorùbá, a sì kọ orúkọ ìlú gẹ́gẹ́ bí Tírè àti Sídónì.
