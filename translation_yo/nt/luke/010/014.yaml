    text: Tàbí, “yóò rọrùn fún Tírè àti Sídónì ju fún yín lọ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added temporal noun “ọjọ́” and employs a natural impersonal Yoruba construction for “more bearable.” It retains the comparative relationship, future sense, plural address, and the judgment terminology of the Greek.
