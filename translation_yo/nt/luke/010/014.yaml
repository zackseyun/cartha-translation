revisions:
- from: Ṣùgbọ́n ní ọjọ́ ìdájọ́, yóò rọrùn fún Tírè àti Sídónì láti fara dà á ju fún yín lọ.[a]
  to: Ṣùgbọ́n ní ìdájọ́, yóò ṣeé fara dà fún Tírè àti Sídónì ju fún yín lọ.[a]
  rationale: The revision removes the added temporal noun “ọjọ́” and employs a natural impersonal Yoruba construction for “more bearable.” It retains the comparative relationship, future sense, plural address, and the judgment terminology of the Greek.
  reviewer_model: gpt-5.6-terra
