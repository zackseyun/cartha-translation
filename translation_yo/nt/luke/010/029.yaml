id: LUK.10.29
reference: Luke 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: yo
  text: Ṣùgbọ́n ẹni náà, tí ó fẹ́ dá ara rẹ̀ láre, sọ fún Jésù pé, “Ta sì ni aládùúgbò mi?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ta ni a lè kà sí aládùúgbò mi?”
    reason: Àṣàyàn yìí mú ìtumọ̀ tí ó ṣeé ṣe nínú πλησίον jáde, ìyẹn ni ẹni tí ó yẹ kí a kà sí aládùúgbò, ṣùgbọ́n ó túmọ̀ ju ọ̀rọ̀ inú ẹsẹ̀ lọ díẹ̀.
lexical_decisions:
- source_word: θέλων
  choice: tí ó fẹ́
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ alábápín ìsinsìnyí mọ́, ó sì fi ìfẹ́ tàbí ète ẹni náà hàn ní Yorùbá àdánidá.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: dá ara rẹ̀ láre
  rationale: Àpólà yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan ń gbìyànjú láti fi hàn pé òun tọ́. Kò fi tipátipá sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìdáláre ní ìtumọ̀ pàtó.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: sọ fún Jésù pé
  rationale: Ó tẹ̀ lé ọ̀nà ìtàn Gíríìkì ní tààrà, ó sì dára fún ṣíṣe àgbékalẹ̀ ọ̀rọ̀ tí a fa yọ.
- source_word: Καὶ
  choice: sì
  rationale: ‘Sì’ pa àsopọ̀ ìbéèrè tó tẹ̀ lé e mọ́, ó sì jẹ́ àdánidá nínú ọ̀rọ̀ Yorùbá.
- source_word: τίς ἐστίν μου πλησίον
  choice: Ta sì ni aládùúgbò mi?
  rationale: ‘Aládùúgbò’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún πλησίον níbí, pàápàá nítorí àyíká òfin Tórà. Ìtumọ̀ náà pa ìbéèrè tààrà àti àìṣedéédé rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιῶσαι ἑαυτόν
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìgbìyànjú ẹni náà láti fi ara rẹ̀ hàn pé òun tọ́.
  alternative: Láti fi ìwà rere ara rẹ̀ múlẹ̀ tàbí láti dá ara rẹ̀ láre níwájú àwọn tó wà níbẹ̀.
  rationale: Àyíká náà jẹ́ ìjíròrò nípa òfin àti ìwà; gbólóhùn náà ń tọ́ka sí ìgbìyànjú láti fi ara ẹni hàn pé ó tọ́, kì í ṣe dandan ẹ̀kọ́ ìdáláre ní ìtumọ̀ ìmọ̀-ẹ̀sìn pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣeé yé fún gbogbo ènìyàn ni a lò. ‘Dá ara rẹ̀ láre’ jẹ́ àpólà àdánidá, ‘aládùúgbò’ sì pa àsopọ̀ mọ́ pẹ̀lú àṣẹ Tórà tó wà ní àyíká ẹsẹ̀ náà.
