    rationale: Títún “nǹkan wọ̀nyí” sọ jẹ́ kí ó dájú pé àwọn ohun kan náà tí a fi pamọ́ ni a ṣí payá, gẹ́gẹ́ bí ταῦτα/αὐτά nínú orísun.
