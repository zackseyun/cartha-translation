    rationale: “Bẹ́ẹ̀ ni ó ṣe dára lójú rẹ” ń tẹnumọ́ ìdájọ́ pé ohun kan dára, nígbà tí εὐδοκία ń sọ ohun tí ó wù Baba tàbí ìfẹ́ inú rere rẹ. “Nítorí pé bẹ́ẹ̀ ni ó wù ọ́” pa ìtumọ̀ náà mọ́ dáadáa láìfi ìtumọ̀ ẹ̀kọ́ míì kún un.
