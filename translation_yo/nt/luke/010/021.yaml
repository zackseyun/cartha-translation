  source_fidelity: 'Ìtumọ̀ náà ṣàfihàn ìtumọ̀ Gíríìkì ní ìwọ̀n rere: àkókò náà, ayọ̀ líle, Ẹ̀mí Mímọ́, ìfarapamọ́ àti ìṣípayá, àti àwọn ẹgbẹ́ méjèèjì ni a pa mọ́. Ṣùgbọ́n “ó ṣe dára lójú rẹ” lè túmọ̀ sí pé ohun náà jẹ́ rere ní ojú Baba, dípò εὐδοκία, ìfẹ́ inú rere/ohun tí ó wù ú. “Bẹ́ẹ̀ ni ó wù ọ́” jẹ́ ọ̀nà Yorùbá títọ́, àdánidá láti sọ ìtumọ̀ gbolohun náà.'
  naturalness: Yorùbá náà tútù, ó sì yẹ fún àdúrà. A tún gbé àmì àlàyé ìsàlẹ̀ (a) sí “Mo yìn ọ́,” ibi tí ọ̀rọ̀ Gíríìkì Ἐξομολογοῦμαί σοι wà, dípò kí ó wà lẹ́yìn “Baba.” Ríròpo “wọn” pẹ̀lú “nǹkan wọ̀nyí” lẹ́ẹ̀kejì jẹ́ kí ohun tí a ṣí payá hàn kedere, ó sì mú ìtakora rẹ̀ pẹ̀lú “fi nǹkan wọ̀nyí pamọ́” lágbára.
  terminology: “Ẹ̀mí Mímọ́,” “Baba,” àti “Olúwa” bá ìtumọ̀ orísun àti ìforúkọsílẹ̀ ẹ̀sìn Yorùbá àpapọ̀ mu. “Àwọn ọmọdé kéékèèké” pa àwòrán νηπίοις mọ́; àlàyé ìsàlẹ̀ ṣètìlẹ́yìn fún ìtumọ̀ gangan “àwọn ọmọ ọwọ́” àti lílo àfiwé rẹ̀.
