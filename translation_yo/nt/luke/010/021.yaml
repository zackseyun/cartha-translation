id: LUK.10.21
reference: Luke 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: yo
  text: Ní wákàtí náà gan-an, ó yọ̀ gidigidi nínú Ẹ̀mí Mímọ́, ó sì wí pé, “Mo yìn ọ́[a], Baba, Olúwa ọ̀run àti ayé, nítorí pé o fi nǹkan wọ̀nyí pamọ́ fún àwọn ọlọ́gbọ́n àti àwọn olóye, o sì ṣí nǹkan wọ̀nyí payá fún àwọn ọmọdé kéékèèké[b]. Bẹ́ẹ̀ ni, Baba, nítorí pé bẹ́ẹ̀ ni ó wù ọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo dúpẹ́ lọ́wọ́ rẹ.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè sọ ìdúpẹ́ àti ìyìn nínú àdúrà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọmọ ọwọ́.” Ó ṣeé ṣe kí a lò ó ní àfiwé fún àwọn onírẹ̀lẹ̀ tàbí àwọn tí ayé kò kà sí pàtàkì, kì í ṣe fún àwọn ọmọ kéékèèké nìkan.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí pé irú èyí ni ìfẹ́ inú rere rẹ,” tàbí, “nítorí pé èyí ni ohun tí ó dùn mọ́ ọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Ní wákàtí náà gan-an
  rationale: Ó pa ìtẹnumọ́ àkókò inú èdè Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἠγαλλιάσατο
  choice: ó yọ̀ gidigidi
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí ayọ̀ ńlá tàbí ìdùnnú jíjinlẹ̀; ‘yọ̀ gidigidi’ ṣe ìtumọ̀ agbára rẹ̀ ní èdè òde òní.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: Àpilẹ̀kọ pẹ̀lú orúkọ àti àpèjúwe náà tọ́ka sí Ẹ̀mí Mímọ́; ‘nínú’ pa ìtumọ̀ ibi tàbí agbára tí ayọ̀ náà ti wá mọ́ láìfi ọ̀kan ṣoṣo múlẹ̀.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Mo yìn ọ́
  rationale: Nínú àdúrà yìí, ọ̀rọ̀ náà lè túmọ̀ sí yíyin tàbí dúpẹ́; ‘Mo yìn ọ́’ bá ọ̀rọ̀ ìbọ̀wọ̀ tó tẹ̀ lé e mu, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà kejì hàn.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Baba, Olúwa ọ̀run àti ayé
  rationale: Ó pa àwọn ọ̀rọ̀ ìpè méjèèjì àti ìjọba Ọlọ́run lórí ọ̀run àti ayé mọ́ ní ọ̀nà tó ṣe déédé.
- source_word: ἀπέκρυψας
  choice: o fi ... pamọ́
  rationale: Ìtumọ̀ tààrà ni, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó sọ ohun tí arọ́pò-orúkọ náà ń tọ́ka sí di kedere láìfikún ìtumọ̀ tuntun.
- source_word: σοφῶν καὶ συνετῶν
  choice: àwọn ọlọ́gbọ́n àti àwọn olóye
  rationale: Ó pa ìyàtọ̀ díẹ̀ láàárín ọgbọ́n àti òye mọ́, láìsọ ọ́ di ọ̀rọ̀ nípa ẹ̀kọ́ ilé-ìwé.
- source_word: ἀπεκάλυψας
  choice: o ṣí wọn payá
  rationale: Ó dúró ní ìtakora tó ṣe kedere sí ‘fi ... pamọ́’ ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìṣípayá.
- source_word: νηπίοις
  choice: àwọn ọmọdé kéékèèké
  rationale: Ó pa àwòrán àwọn ọmọ kéékèèké mọ́, ṣùgbọ́n kò fi ìtumọ̀ náà mọ́ àwọn ọmọ ọwọ́ nìkan; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ gangan àti lílo àfiwé.
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì bá ìfìdí ọ̀rọ̀ múlẹ̀ mu.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: nítorí pé bẹ́ẹ̀ ni ó ṣe dára lójú rẹ
  rationale: Ó pa ọ̀rọ̀ nípa ohun tí ó dára tàbí dùn mọ́ Ọlọ́run àti gbolohun ‘ní ojú rẹ’ mọ́, láìyí i padà sí ẹ̀kọ́ nípa ìpinnu Ọlọ́run nìkan.
theological_decisions:
- issue: Ohun tí τῷ πνεύματι τῷ ἁγίῳ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí rẹ̀ tàbí nínú ẹ̀mí
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì pẹ̀lú àpilẹ̀kọ náà ṣètìlẹ́yìn fún Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tí gbolohun náà ń tọ́ka sí; ìtumọ̀ yìí kò dín un kù sí ìmọ̀lára inú Jésù.
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ tí a ń bá Baba sọ
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ ìjọba àti ọlá ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ìpè Yorùbá tó yẹ ní àdúrà.
- issue: Ìtumọ̀ εὐδοκία
  choice: ohun tí ó dára lójú rẹ
  alternative: ìfẹ́ inú rere rẹ tàbí ohun tí ó dùn mọ́ ọ
  rationale: Ìtumọ̀ àkọ́kọ́ pa àìdánilójú láàárín ìtẹ́wọ́gbà, inú dídùn, àti ìfẹ́ Ọlọ́run mọ́; àlàyé ìsàlẹ̀ fi àwọn ọ̀nà míì tó bófin mu hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, tó ní ọlá tó yẹ fún àdúrà, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘nǹkan’ gẹ́gẹ́ bí akọtọ̀ Yorùbá boṣewa, a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
