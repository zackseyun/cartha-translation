id: LUK.10.15
reference: Luke 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: yo
  text: Ìwọ náà, Kápánáúmù, ṣé a ó gbé ọ ga dé ọ̀run? A ó mú ọ sọ̀kalẹ̀ dé Hédíìsì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dé agbègbè àwọn òkú.” Ọ̀rọ̀ Gíríìkì ni “Hédíìsì,” kì í ṣe Gẹ́hẹ́nà (“ọ̀run àpáàdì”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: A ṣe àkọsílẹ̀ orúkọ ibì náà ní ìbámu pẹ̀lú bí a ṣe ń pe Capernaum ní Yorùbá, láì túmọ̀ orúkọ náà.
- source_word: μὴ ... ὑψωθήσῃ
  choice: ṣé a ó gbé ọ ga
  rationale: A mú un gẹ́gẹ́ bí ìbéèrè àrọ́sọ tí ó ń retí ìdáhùn òdì. ‘Gbé ọ ga’ pa ìtumọ̀ fífi sí ipò gíga mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἕως οὐρανοῦ
  choice: dé ọ̀run
  rationale: ‘Dé’ fi ààlà ìgbéga hàn, ó sì pa àwòrán ìlọ sókè mọ́ nínú ìyàtọ̀ rẹ̀ sí sísọ kalẹ̀.
- source_word: ἕως τοῦ ᾅδου
  choice: dé Hédíìsì
  rationale: A ṣe àkọsílẹ̀ ᾅδης gẹ́gẹ́ bí ‘Hédíìsì’ láti pa á yà sọ́tọ̀ kúrò ní Gẹ́hẹ́nà àti láti má ṣe fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: καταβιβασθήσῃ
  choice: a ó sọ ọ́ kalẹ̀
  rationale: 'Ìsọ̀rọ̀ yìí pa ohùn àìṣeṣe mọ́: ẹlòmíràn ni yóò mú kí ìlú náà sọ̀ kalẹ̀. Ó tún mú àwòrán ìrẹ̀sílẹ̀ àti ìdájọ́ jáde láì fi agbára tí kò sí nínú ọ̀rọ̀ náà kún un.'
theological_decisions:
- issue: Ìtumọ̀ ᾅδης
  choice: Hédíìsì
  alternative: agbègbè àwọn òkú; ọ̀run àpáàdì
  rationale: ‘Hédíìsì’ pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ sí Gẹ́hẹ́nà, kò sì pinnu pé ibi ìjìyà ìkẹyìn ni. Àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ìtumọ̀ àlàyé tí òǹkàwé lè lóye.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. Àmì ohùn wà níbi tí ó bá yẹ; ìbéèrè àrọ́sọ náà àti ìyàtọ̀ àwòrán láàárín ọ̀run àti Hédíìsì ni a pa mọ́.
