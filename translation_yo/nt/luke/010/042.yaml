language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: yo
  text: Ṣùgbọ́n ohun díẹ̀ ni a nílò—tàbí ohun kan ṣoṣo[a]. Nítorí Màríà ti yan ìpín rere[b], èyí tí a kò ní gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun kan ṣoṣo ni a nílò.” Nínú àyíká ọ̀rọ̀ nípa oúnjẹ yìí, Gíríìkì tún lè túmọ̀ sí, “àwọn oúnjẹ díẹ̀ ni a nílò—tàbí oúnjẹ kan ṣoṣo.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “apá rere.” Ó ṣeé ṣe kí “ìpín” tọ́ka ní ẹ̀ẹ̀kan náà sí ìpín oúnjẹ àti sí ìpín ẹni nínú ohun tí ó ṣe pàtàkì lóòótọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων
  choice: ohun díẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ẹ̀yà olópò nínú Gíríìkì, ṣùgbọ́n ‘ohun díẹ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn ohun tí a nílò kò pọ̀, ó sì lè tọ́ka sí ìmúrasílẹ̀ oúnjẹ nínú àyíká ọ̀rọ̀ náà.
- source_word: χρεία
  choice: ni a nílò
  rationale: Èyí fi ìtumọ̀ àìní tàbí ohun tó ṣe pàtàkì hàn ní Yorùbá òde òní láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἢ ἑνός
  choice: tàbí ohun kan ṣoṣo
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ohun díẹ̀ àti ohun kan mọ́, láìdájọ́ bóyá oúnjẹ kan ni tàbí ohun pàtàkì kan ṣoṣo.
- source_word: Μαριὰμ
  choice: Màríà
  rationale: Orúkọ tí ó ti wọ́pọ̀ fún Μαριάμ nínú Yorùbá.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: ìpín rere
  rationale: ‘Ìpín’ lè túmọ̀ sí apá oúnjẹ àti ogún tàbí ohun iyebíye tí ẹnì kan yàn; ‘rere’ sì ń tẹ̀lé ἀγαθή láìyí i sí ìfiwéra ‘tó dára jù.’
- source_word: ἐξελέξατο
  choice: ti yan
  rationale: Ó fi ìṣe yíyan Màríà àti àbájáde tó ṣì dúró hàn lọ́nà àdánidá.
- source_word: ἥτις
  choice: èyí tí
  rationale: Ó tọ́ka padà sí ‘ìpín rere’ ó sì ṣàlàyé ànímọ́ rẹ̀.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: a kò ní gbà kúrò lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ yìí sọ pé a kì yóò mú ìpín náà kúrò lọ́dọ̀ Màríà; ‘gbà kúrò lọ́wọ́ rẹ̀’ jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ‘ohun díẹ̀ … tàbí ohun kan ṣoṣo’ ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ Mátà àti ohun tí Màríà yàn
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí gbólóhùn nípa ohun tí a nílò, láìsọ pàtó bóyá ó túmọ̀ sí oúnjẹ díẹ̀, oúnjẹ kan, tàbí ohun pàtàkì kan ṣoṣo.
  alternative: ‘Ohun kan ṣoṣo ni ó ṣe pàtàkì’ tàbí ‘oúnjẹ díẹ̀—àní oúnjẹ kan ṣoṣo—ni a nílò.’
  rationale: Gíríìkì lè tọ́ka sí ìmúrasílẹ̀ oúnjẹ lọ́nà gidi tàbí sí ohun pàtàkì nípa tẹ̀mí. Ìtumọ̀ náà pa ìṣòro àti àfojúsùn méjèèjì mọ́ láìyanju wọn láìní ẹ̀rí tó pé.
translation_notes:
  register: Yorùbá àgbáyé òde òní tí ó ní ọ̀wọ̀ àti ìṣàn àdánidá ni a lò. A fi àmì ohùn kún ibi tí ó yẹ. ‘Ohun kan ṣoṣo’ ṣe ìtumọ̀ ἑνός kedere, nígbà tí àlàyé ìsàlẹ̀ pa àìdánilójú nípa ‘oúnjẹ kan’ tàbí ‘ohun pàtàkì kan’ mọ́.
