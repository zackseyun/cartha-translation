id: LUK.10.2
reference: Luke 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ìkórè pọ̀, ṣùgbọ́n àwọn òṣìṣẹ́ kò pọ̀. Nítorí náà, ẹ bẹ Olúwa ìkórè pé kí ó rán àwọn òṣìṣẹ́ jáde[a] sínú ìkórè tirẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó lé àwọn òṣìṣẹ́ jáde.” Ọ̀rọ̀ Gíríìkì náà lè ní agbára ju ‘rán jáde’ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ó sì sọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà lè túmọ̀ sí ‘ó sì ń sọ,’ ṣùgbọ́n ‘ó sì sọ’ jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ọ̀rọ̀ ẹni nínú ìtàn Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; ‘sì’ bá ìlò Yorùbá mu láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: θερισμός
  choice: ìkórè
  rationale: Èyí pa àwòrán iṣẹ́ oko mọ́, ó sì lè gbé ìtumọ̀ àfiwé tí ẹsẹ náà ní.
- source_word: πολύς
  choice: pọ̀
  rationale: ‘Pọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọ̀pọ̀lọpọ̀, ó sì ṣe ìtakora pẹ̀lú ‘kò pọ̀.’
- source_word: ἐργάται
  choice: àwọn òṣìṣẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ti òde òní, ó ṣe kedere, ó sì tọ́ka sí àwọn tó ń ṣe iṣẹ́ ìkórè láìfi akọ nìkan hàn.
- source_word: ὀλίγοι
  choice: kò pọ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé iye wọn kéré, ó sì bá ‘ìkórè pọ̀’ ṣe ìtakora tó ṣe kedere.
- source_word: δεήθητε
  choice: ẹ bẹ
  rationale: Àṣẹ náà ń béèrè ìrawọ́ ẹ̀bẹ̀ àtọkànwá; ‘ẹ bẹ’ pa agbára ìbéèrè náà mọ́ nínú àyíká àdúrà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ láti bẹ Olúwa jẹ́ àbájáde ọ̀rọ̀ nípa ìkórè púpọ̀ àti òṣìṣẹ́ díẹ̀.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ẹni tó ní àṣẹ àti ìró ẹ̀kọ́ nípa Ọlọ́run mọ́, láìṣàlàyé ẹni tí àkọlé náà ń tọ́ka sí ju ohun tí ẹsẹ sọ lọ.
- source_word: ὅπως
  choice: pé kí
  rationale: ‘Pé kí’ jẹ́ ọ̀nà Yorùbá tó bójú mu láti mú ohun tí wọ́n gbọ́dọ̀ bẹ̀bẹ̀ fún wọlé.
- source_word: ἐκβάλῃ
  choice: rán … jáde
  rationale: ‘Rán … jáde’ sọ ìgbéjáde àwọn òṣìṣẹ́ sínú iṣẹ́ náà ní èdè àdánidá. Nítorí ọ̀rọ̀ Gíríìkì lè lágbára ju ‘rán’ lọ, àlàyé ìsàlẹ̀ fi yíyan mìíràn hàn.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: sínú ìkórè tirẹ̀
  rationale: Èyí tẹ̀lé àwòrán àti ìní inú Gíríìkì pẹ́kípẹ́kí, láìfi ‘oko’ kún un níbi tí kò ti fara hàn.
theological_decisions:
- issue: Ẹni tí àkọlé ‘Olúwa ìkórè’ ń tọ́ka sí àti agbára àkọlé náà
  choice: Pa àkọlé àfiwé náà mọ́ gẹ́gẹ́ bí ‘Olúwa ìkórè’ láìṣàlàyé ẹni tí ó ń tọ́ka sí.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí Ọlọ́run tó ni iṣẹ́ náà tó sì ń darí rẹ̀, tàbí gẹ́gẹ́ bí ìtọ́kasí àṣẹ Ọlọ́run nínú Jésù.
  rationale: Ẹsẹ náà fi ẹni tó ni ìkórè àti ẹni tó ń rán òṣìṣẹ́ hàn, ṣùgbọ́n kò tú ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run tàbí Kristi ní kíkún. Títẹ̀lé àkọlé náà nìkan pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn níbi tó bá yẹ, a sì pa àwòrán ìkórè àti ìní ‘tirẹ̀’ mọ́.
