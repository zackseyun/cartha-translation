revisions:
- from: Ṣùgbọ́n ọ̀pọ̀ iṣẹ́ ìránṣẹ́ tí Mátà ń ṣe ń pín ọkàn rẹ̀ níyà. Ó sì sún mọ́ Jesu, ó ní, “Olúwa, kò ha jẹ ọ́ ní ọ̀ràn pé arábìnrin mi fi mí sílẹ̀ láti dá ṣe iṣẹ́ ìránṣẹ́ bí? Nítorí náà, sọ fún un pé kí ó bá mi ṣe é.”
  to: Ṣùgbọ́n ọ̀pọ̀ iṣẹ́ sísìn ń fa Mátà káàkiri. Ó sì sún mọ́ ọn, ó ní, “Olúwa, ṣé kò bìkítà sí i pé arábìnrin mi fi mí sílẹ̀ kí n ṣe iṣẹ́ sísìn nìkan? Nítorí náà, sọ fún un kí ó ràn mí lọ́wọ́.”
  rationale: 'A tún ọ̀rọ̀ náà ṣe láti mú ìtumọ̀ Gíríìkì náà hàn pẹ̀lú Yorùbá boṣewa tó wúlò: Mátà ni ọ̀pọ̀ iṣẹ́ sísìn ń fa káàkiri; ó sún mọ́ Olúwa; ó ṣàròyé pé a fi òun nìkan sílẹ̀ fún iṣẹ́ náà; ó sì béèrè pé kí arábìnrin rẹ̀ ràn án lọ́wọ́. Kò sí ìdí tí a fi nílò àlàyé ìsàlẹ̀ fún ìyàtọ̀ ọ̀rọ̀ nínú ẹsẹ̀ yìí.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:55Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnyẹ̀wò náà tún περιεσπᾶτο ṣe gẹ́gẹ́ bí ipò tí ọ̀pọ̀ iṣẹ́ ń fà Mátà káàkiri, ó sì pa ‘ọ̀pọ̀ iṣẹ́ sísìn,’ ìsúnmọ́ ẹni tí ó ń bá sọ̀rọ̀, ìbéèrè ẹ̀dùn náà, ‘ní èmi nìkan,’ àti àṣẹ pé kí Màríà darapọ̀ ràn án lọ́wọ́ mọ́. ‘Jesu’ ni a kò fi kún ọ̀rọ̀ Gíríìkì nínú ìtumọ̀ tí a tún ṣe; aṣojú-ọrọ̀ ‘ọ́n’ tọ́ka sí ẹni tí Mátà pè ní Olúwa.
  naturalness: ‘Ń pín ọkàn rẹ̀ níyà’ kì í ṣe ọ̀nà tí ó wọ́pọ̀ jù lọ láti sọ pé ènìyàn ti dàrú tàbí ti fa káàkiri nítorí iṣẹ́. ‘Ọ̀pọ̀ iṣẹ́ sísìn ń fa Mátà káàkiri’ jẹ́ Yorùbá tó ṣeé lóye, ó sì mú ìmọ̀ περιεσπᾶτο dáadáa. A tún rọ́pò ‘dá ṣe iṣẹ́ ìránṣẹ́ bí,’ èyí tí kò dára ní gírámà tàbí ní ìtumọ̀, pẹ̀lú ìsọ̀rọ̀ àdánidá.
  terminology: A pa ‘Olúwa’ mọ́ fún Κύριε. ‘Iṣẹ́ sísìn’ níhìn-ín ń tọ́ka sí iṣẹ́ ìtọ́jú/ìpèsè nínú ilé, kì í ṣe ọ́fíìsì ìjọ; ó ní ìtumọ̀ tó gbooro tó lati ba διακονία mu. ‘Ràn mí lọ́wọ́’ jẹ́ ìtumọ̀ Yorùbá tó mọ́ fún συναντιλάβηται, ó sì fi ìrànlọ́wọ́ pọ̀ mọ́ iṣẹ́ hàn.
  issues:
  - severity: medium
    issue: ‘ń pín ọkàn rẹ̀ níyà’ àti ‘dá ṣe iṣẹ́ ìránṣẹ́ bí’
    rationale: Gbólóhùn àkọ́kọ́ kò ṣe àfihàn ìfàkúrò/ìfàkáàkiri περιεσπᾶτο ní ọ̀nà Yorùbá tó rọrùn; ‘dá ṣe ... bí’ sì jẹ́ ìdàgbàsókè gírámà tí kò ṣeé gba, ó tún kùnà láti sọ μόνην (‘ní èmi nìkan’) ní kedere.
  - severity: low
    issue: ‘kò ha jẹ ọ́ ní ọ̀ràn’
    rationale: Ó ṣeé lóye, ṣùgbọ́n kò wọ́pọ̀, ó sì dà bí ìbéèrè nípa ọ̀ràn ẹni dípò ìbéèrè pé ohun náà kò bìkítà sí i. ‘Ṣé kò bìkítà sí i pé...?’ jẹ́ ọ̀rọ̀ àdánidá tó pa ẹ̀dùn οὐ μέλει σοι mọ́.
  - severity: low
    issue: ‘kí ó bá mi ṣe é’
    rationale: Ó lè tọ́ka sí ṣíṣe ohun kan tí a ti mẹ́nuba, ṣùgbọ́n kò hàn gbangba pé Màríà gbọ́dọ̀ ràn Mátà lọ́wọ́. ‘Kí ó ràn mí lọ́wọ́’ sọ ìtumọ̀ συναντιλάβηται ní kedere.
