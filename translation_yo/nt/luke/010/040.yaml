id: LUK.10.40
reference: Luke 10:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ iṣẹ́ sísìn ń fa Mátà káàkiri. Ó sì sún mọ́ ọn, ó ní, “Olúwa, ṣé kò bìkítà sí i pé arábìnrin mi fi mí sílẹ̀ kí n ṣe iṣẹ́ sísìn nìkan? Nítorí náà, sọ fún un kí ó ràn mí lọ́wọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: ń pín ọkàn rẹ̀ níyà
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ọ̀pọ̀ ohun ṣe ń fa Mátà káàkiri, tí kò sì jẹ́ kí ọkàn rẹ̀ dúró sí ohun kan; àìpé náà fi hàn pé ipò yìí ń bá a lọ.
- source_word: περὶ πολλὴν διακονίαν
  choice: ọ̀pọ̀ iṣẹ́ ìránṣẹ́ tí Mátà ń ṣe
  rationale: Nínú àyíká ilé yìí, διακονία túmọ̀ sí iṣẹ́ ṣíṣe fún àwọn àlejò, kì í ṣe ipò iṣẹ́ ìjọ tàbí iṣẹ́ òjíṣẹ́ pàtó.
- source_word: ἐπιστᾶσα
  choice: ó sì sún mọ́ Jesu
  rationale: Ó fi ìgbésẹ̀ Mátà láti wá sí tòsí ẹni tí ó fẹ́ bá sọ̀rọ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος, ó sì pa ọ̀wọ̀ inú ọ̀rọ̀ Mátà sí Jesu mọ́.
- source_word: οὐ μέλει σοι
  choice: kò ha jẹ ọ́ ní ọ̀ràn
  rationale: Ó pa ìbéèrè ẹ̀dùn Mátà mọ́ láìfi agbára ìmọ̀lára tí ó ju ti Gíríìkì lọ kún un.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: fi mí sílẹ̀ láti dá ṣe iṣẹ́ ìránṣẹ́
  rationale: Ó mú ìtumọ̀ ‘fi mí sílẹ̀’ àti ‘ṣe iṣẹ́ náà ní èmi nìkan’ jọ, láìlo ọ̀rọ̀ líle bí ‘kọ̀ mí sílẹ̀ pátápátá.’
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Nítorí náà, sọ fún un
  rationale: Ó pa àṣẹ tààrà àti ìtumọ̀ ìyọrísí οὖν mọ́.
- source_word: συναντιλάβηται
  choice: kí ó bá mi ṣe é
  rationale: Ó fi hàn pé Màríà ní láti dara pọ̀ mọ́ Mátà kí wọ́n jọ ṣe iṣẹ́ náà, èyí tí ó ju ‘ràn mí lọ́wọ́’ lásán lọ ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ tí Mátà sọ sí Jesu
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ jẹ́ akọlé ọ̀wọ̀ tí ó bá ìlò Lúùkù fún Jesu mu, ó sì ṣí ààyè sílẹ̀ fún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó gbooro ju ‘Ọ̀gá’ lọ láìfi ohun tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo ‘ń pín ọkàn rẹ̀ níyà’ láti ṣàfihàn ìfàkúrò ọkàn tí περιεσπᾶτο ní, a sì lo ‘iṣẹ́ ìránṣẹ́’ ní ìtumọ̀ iṣẹ́ ilé àti iṣẹ́ fún àlejò, kì í ṣe iṣẹ́ òjíṣẹ́ ìjọ.
