translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìtẹnumọ́ αὐτός mọ́ pẹ̀lú “òun fúnra rẹ̀.”
