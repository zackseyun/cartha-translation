base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: yo
  text: Bí wọ́n ti ń lọ ní ọ̀nà, òun fúnra rẹ̀ wọ abúlé kan; obìnrin kan tí orúkọ rẹ̀ ń jẹ́ Mátà sì gbà á lálejò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kí i káàbọ̀.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbígba ẹnì kan tọ̀wọ̀tọ̀wọ̀ gẹ́gẹ́ bí àlejò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Bí wọ́n ti ń lọ ní ọ̀nà
  rationale: Ìṣètò ἐν pẹ̀lú infinitive olórúkọ ń fi ìṣe méjì tí ń ṣẹlẹ̀ ní àkókò kan náà hàn; αὐτούς jẹ́ ọ̀pọ̀, nítorí náà “wọ́n” tọ́ka sí ẹgbẹ́ arìnrìn-àjò náà.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, ó sì yà ẹni tí ó wọ abúlé náà sọ́tọ̀ kúrò lára “wọ́n” tí wọ́n ń lọ.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: wọ abúlé kan
  rationale: κώμη túmọ̀ sí abúlé, τινά sì fún un ní ìtumọ̀ àìdánimọ̀ díẹ̀; “abúlé kan” jẹ́ ọ̀nà Yorùbá àdánidá láti pa èyí mọ́.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: obìnrin kan tí orúkọ rẹ̀ ń jẹ́ Márítà sì
  rationale: δέ mú ìtàn tẹ̀ síwájú, τις sì ń ṣàfihàn ẹni tuntun; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìdánimọ̀ orúkọ.
- source_word: ὑπεδέξατο αὐτὸν
  choice: gbà á lálejò
  rationale: ὑποδέχομαι níhìn-ín túmọ̀ sí gbígba ẹni tọ̀wọ̀tọ̀wọ̀ gẹ́gẹ́ bí àlejò. “Gbà á lálejò” mú ìtumọ̀ àlejò náà jáde láìfi “sí ilé rẹ̀” kún ohun tí Gíríìkì kò sọ ní tààrà.
