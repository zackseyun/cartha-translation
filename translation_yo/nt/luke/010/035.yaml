    rationale: A lè mú un péye sí i nípa sisọ pé dẹ́nárì kan fẹ́rẹ̀ẹ́ tó owó iṣẹ́ ọjọ́ kan fún òṣìṣẹ́, èyí tó bá ìtàn owó náà mu.
