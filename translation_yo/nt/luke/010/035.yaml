  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: yo
  text: Ní ọjọ́ kejì[a], ó mú dẹ́nárì méjì jáde, ó fi fún olùtọ́jú ilé ìgbọ̀nsẹ̀ náà, ó sì sọ pé, ‘Bójú tó ọkùnrin náà; ohun gbogbo tí o bá tún ná sí i, èmi yóò san án padà fún ọ nígbà tí mo bá padà dé.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dẹ́nárì jẹ́ owó fàdákà Róòmù tí a sábà máa ń lò; dẹ́nárì kan fẹ́rẹ̀ẹ́ tó owó iṣẹ́ ọjọ́ kan fún òṣìṣẹ́.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Ní ọjọ́ kejì
  rationale: Gbólóhùn àkókò náà túmọ̀ sí ọjọ́ tí ó tẹ̀ lé e; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐκβαλών
  choice: ó mú ... jáde
  rationale: Ní àyíká yìí, ó ń sọ pé ó mú owó jáde láti inú ohun-ìní rẹ̀, kì í ṣe ìtumọ̀ líle ti ‘sọ jáde.’
- source_word: δύο δηνάρια
  choice: owó dẹ́nárì méjì
  rationale: Ó pa orúkọ owó ìgbà Róòmù mọ́ dípò yíyí i padà sí iye owó iṣẹ́ ọjọ́ méjì.
- source_word: πανδοχεῖ
  choice: olùtọ́jú ilé èrò náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń bójú tó ibi ìgbọ̀nsẹ̀, kì í ṣe ilé náà fúnra rẹ̀.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Ṣe ìtọ́jú rẹ̀
  rationale: Ó fi àṣẹ fún un láti máa fi àkíyèsí bójú tó ọkùnrin náà; ìtumọ̀ yìí ṣe kedere, ó sì bá Yorùbá mu.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: iye àfikún èyíkéyìí tí o bá ná
  rationale: Ó pa àìdánilójú iye náà àti èrò ìnáwó tí ó ju owó tí a ti fún un lọ mọ́.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: nígbà tí mo bá padà dé
  rationale: Èyí tú ìṣọ̀kan articular infinitive náà sí gbólóhùn àkókò Yorùbá tí ó ṣe àdánidá.
- source_word: ἀποδώσω σοι
  choice: èmi yóò san án padà fún ọ
  rationale: Ó sọ ìlérí láti san gbogbo àfikún ìnáwó náà padà ní kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbòò. A lo ‘ilé èrò’ fún ilé ìgbọ̀nsẹ̀ arìnrìn-àjò, a sì pa orúkọ owó ìtàn ‘dẹ́nárì’ mọ́ pẹ̀lú àlàyé ìsàlẹ̀ ojú-ìwé.
