  to: “Èwo nínú àwọn mẹ́tẹ̀ẹ̀ta wọ̀nyí ni ó dà bí ẹni sí ọ pé ó ti di aládùúgbò fún ọkùnrin tí ó ṣubú sí ọwọ́ àwọn ọlọ́ṣà?”[a]
