id: LUK.10.36
reference: Luke 10:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: yo
  text: “Èwo nínú àwọn mẹ́tẹ̀ẹ̀ta wọ̀nyí ni ó dà bí ẹni sí ọ pé ó ti di aládùúgbò fún ọkùnrin tí ó ṣubú sí ọwọ́ àwọn ọlọ́ṣà?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ta ni nínú àwọn mẹ́tẹ̀ẹ̀ta wọ̀nyí tí o rò pé ó jẹ́ aládùúgbò fún ọkùnrin tí ó ṣubú sí ọwọ́ àwọn ọlọ́ṣà?” Ní ti gidi, Gíríìkì sọ pé, “ó dà bí ẹni sí ọ pé ó ti di aládùúgbò,” èyí tí ó tẹnu mọ́ pé ẹni náà di aládùúgbò nípasẹ̀ ìṣe rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Ta ni
  rationale: Ó béèrè ẹni kan lára ẹgbẹ́ mẹ́ta tí a ti dárúkọ; ‘Ta ni nínú àwọn mẹ́tẹ̀ẹ̀ta’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: τούτων τῶν τριῶν
  choice: nínú àwọn mẹ́tẹ̀ẹ̀ta wọ̀nyí
  rationale: Ó pa ìtumọ̀ apá-kan-lára-mẹ́ta mọ́ láìfi ‘ọkùnrin’ kún Gíríìkì.
- source_word: πλησίον
  choice: aládùúgbò
  rationale: Níhìn-ín ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ fún ẹni tí ó hùwà bí aládùúgbò sí ẹlòmíràn, kì í ṣe kìkì ẹni tí ó ń gbé nítòsí.
- source_word: δοκεῖ σοι
  choice: tí ó dà bí ẹni pé
  rationale: Èyí pa èrò ‘ó dà bí ẹni sí ọ’ mọ́ ní ọ̀nà Yorùbá tí ó rọrùn; ọ̀rọ̀ ìbéèrè ‘Ta ni’ ti fi ‘sí ọ’ hàn nípa ẹni tí a ń béèrè lọ́wọ́.
- source_word: γεγονέναι
  choice: ó ti di
  rationale: Ó pa ìtumọ̀ pípé ti ‘ti di’ mọ́, dípò kí a sọ ọ́ ní ti ipò tí kò ní ìyípadà bí ‘jẹ́’.
- source_word: τοῦ ἐμπεσόντος
  choice: fún ọkùnrin tí ó ṣubú
  rationale: Àyíká ìtàn fi hàn pé ẹni tí a ń tọ́ka sí ni ọkùnrin tí àwọn ọlọ́ṣà kọlù; ‘fún’ sọ ìbáṣepọ̀ aládùúgbò sí i lọ́nà àdánidá.
- source_word: εἰς τοὺς λῃστάς
  choice: sí ọwọ́ àwọn ọlọ́ṣà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí ó bọ́ sí agbára àwọn ọlọ́ṣà, bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ní ṣókí pé ó ‘ṣubú sínú àwọn ọlọ́ṣà’.
theological_decisions:
- issue: Ìdojúkọ̀ ìwà rere nínú ìbéèrè àkàwé ará Samáríà rere
  choice: Pa ‘ó ti di aládùúgbò’ mọ́
  alternative: ‘ó jẹ́ aládùúgbò’ tàbí ‘ó hùwà bí aládùúgbò’
  rationale: '‘Ó ti di’ pa ìṣípò ìbéèrè Jésù mọ́: kì í ṣe kíkàn mọ ẹni tí í ṣe aládùúgbò ẹni, bí kò ṣe ẹni tí ó di aládùúgbò nípa ohun tí ó ṣe. ‘Ó hùwà bí’ lè ṣàlàyé rẹ̀ jù bí Gíríìkì ṣe sọ lọ.'
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘aládùúgbò’ ní ìtumọ̀ ìbáṣepọ̀ àti ìwà rere, a sì pa ‘ó ti di’ mọ́ láti fi agbára γεγονέναι hàn.
