source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: yo
  text: Ó sì ní arábìnrin kan tí a ń pè ní Màríà, ẹni tí òun náà jókòó ní ẹsẹ̀ Jésù[a], tí ó sì ń fetí sí ọ̀rọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “Olúwa” dípò “Jésù.”
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka padà sí Mátà nínú ẹsẹ tó ṣáájú; “Ó” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìtọ́kasí náà jáde.
- source_word: ἀδελφὴ
  choice: arábìnrin
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbátan obìnrin kan tí wọ́n bí pọ̀.
- source_word: καλουμένη Μαριάμ
  choice: tí a ń pè ní Màríà
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ aláìṣe náà jáde ní Yorùbá àdánidá, ó sì fi orúkọ ẹni náà hàn láìsí àfikún.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: jókòó sí ẹsẹ̀
  rationale: Ó pa ìṣe jíjókòó sí ẹsẹ̀ Jesu mọ́, tó sì lè fi ipò akẹ́kọ̀ọ́ hàn láìṣe àlàyé rẹ̀ sínú ẹsẹ náà.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Ọ̀rọ̀ SBLGNT tí a pèsè ní Ἰησοῦ, nítorí náà a lo orúkọ “Jesu” nínú àkọ́kọ́, a sì tọ́ka sí “Olúwa” gẹ́gẹ́ bí ẹ̀dà mìíràn ní àlàyé ìsàlẹ̀.
- source_word: ἤκουεν
  choice: ń fetí sí
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ hàn; “ń fetí sí” tún mú èrò pé ó ń tẹ́tí gbọ́ pẹ̀lú àfiyèsí jáde.
- source_word: τὸν λόγον αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: Èyí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa ìwọ̀n ìtumọ̀ λόγος mọ́ láìfi dandan sọ ọ́ di “ẹ̀kọ́” tàbí “iṣẹ́ ìwàásù.”
theological_decisions:
- issue: Orúkọ tàbí oyè nínú gbólóhùn “sí ẹsẹ̀ ...”
  choice: Jesu
  alternative: Olúwa
  rationale: SBLGNT tí a fún wa ka Ἰησοῦ (“Jesu”). Nítorí ẹ̀rí ìwé àfọwọ́kọ mìíràn fún κύριος (“Olúwa”), a pa ìyàtọ̀ náà mọ́ nínú àlàyé ìsàlẹ̀ dípò yíyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tó rọrùn fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
