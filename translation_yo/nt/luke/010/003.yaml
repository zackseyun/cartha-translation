  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: yo
  text: Ẹ lọ; ẹ kíyèsí i, mo ń rán yín jáde bí àwọn ọmọ àgùntàn[b] láàárín àwọn ìkookò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ní àárín àwọn ìkookò.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan lè lo “àgùntàn,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí túmọ̀ sí “ọmọ àgùntàn” ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπάγετε
  choice: Ẹ máa lọ
  rationale: Àṣẹ ẹni kejì ọ̀pọ̀ ni; “Ẹ máa lọ” jẹ́ ọ̀nà àdánidá, ṣókí, tí ó sì fi hàn pé Jésù ń bá ẹgbẹ́ kan sọ̀rọ̀.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pe àfiyèsí sí ohun tí ó tẹ̀ lé e. “Kíyèsí i” jẹ́ ọ̀rọ̀ Yorùbá ọlọ́lá tí ó tún yé òǹkàwé òde òní.
- source_word: ἀποστέλλω
  choice: mo ń rán yín jáde
  rationale: Àkókò ìsinsìnyí àti ìtumọ̀ iṣẹ́ ìránṣẹ́ ni a pa mọ́; “jáde” mú ìṣípò wọn lọ síbi iṣẹ́ náà hàn láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, èyí tí “yín” fi hàn kedere ní Yorùbá.
- source_word: ὡς
  choice: bí
  rationale: Ó ṣàfihàn àfiwé, kì í ṣe pé àwọn ọmọ-ẹ̀yìn jẹ́ ọ̀dọ́ àgùntàn ní ti gidi.
- source_word: ἄρνας
  choice: àwọn ọ̀dọ́ àgùntàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ọmọ àgùntàn ní pàtó; yíyan “àwọn ọ̀dọ́ àgùntàn” pa àwòrán àìlágbára àti ewu mọ́.
- source_word: ἐν μέσῳ λύκων
  choice: láàárín àwọn ìkookò
  rationale: Ó pa àwòrán pé ìkookò yí wọn ká mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu.
theological_decisions:
- issue: Àwòrán ẹranko tí a fi ṣàpẹẹrẹ iṣẹ́ ìránṣẹ́ àwọn ọmọ-ẹ̀yìn
  choice: Pa àfiwé náà mọ́ gẹ́gẹ́ bí “àwọn ọ̀dọ́ àgùntàn láàárín àwọn ìkookò.”
  alternative: “àwọn àgùntàn láàárín àwọn ìkookò”
  rationale: Gíríìkì lo ἄρνας, ìyẹn “ọ̀dọ́ àgùntàn,” kì í ṣe ọ̀rọ̀ gbogbogbò fún “àgùntàn.” Èyí pa ìtẹnumọ́ lórí àìlágbára wọn mọ́, kò sì mú ẹsẹ yìí bá àwọn ọ̀rọ̀ tó jọ ọ́ ní ibòmíràn mu láìní ẹ̀rí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àṣẹ ọ̀pọ̀ “Ẹ máa lọ” àti arọ́pò-orúkọ “yín” mú iye àwọn olùgbọ́ hàn gbangba. “Kíyèsí i” pa agbára ọ̀rọ̀ ìpe-àfiyèsí mọ́ láìjẹ́ àtijọ́ jù.
