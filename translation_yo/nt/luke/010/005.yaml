id: LUK.10.5
reference: Luke 10:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: yo
  text: Ní ilé yòówù tí ẹ bá wọ̀, ẹ kọ́kọ́ sọ pé, ‘Àlàáfíà fún ilé yìí.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Kí àlàáfíà wà fún ilé yìí,” tàbí, “Kí àlàáfíà wà lórí ilé yìí.” Gíríìkì jẹ́ gbólóhùn ìbùkún ṣókí.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: Ní ilé yòówù tí ẹ bá wọ̀
  rationale: Èyí fi ìtumọ̀ gbólóhùn arọ́pò-orúkọ aláìdánimọ̀ hàn ní Yorùbá àdánidá. Ọ̀rọ̀-ìṣe ‘wọ̀’ fúnra rẹ̀ ní ìtumọ̀ ìlọ sínú, nítorí náà ‘ní ilé’ kò sọ agbára ìtọ́sọ́nà εἰς nù.
- source_word: εἰσέλθητε
  choice: tí ẹ bá wọ̀
  rationale: Àpẹẹrẹ ‘tí … bá’ bá aorist subjunctive pẹ̀lú ἄν mu gẹ́gẹ́ bí ìṣe tí ó lè ṣẹlẹ̀ ní ilé èyíkéyìí; ‘ẹ’ tún bá ọ̀pọ̀ ènìyàn tí a ń bá sọ mu.
- source_word: οἰκίαν
  choice: ilé
  rationale: Níhìn-ín οἰκία ń tọ́ka sí ibi ìgbé tí wọ́n wọ̀; ‘ilé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, ó sì tún lè ní ìfarahàn sí àwọn ará ilé láìfi ìtumọ̀ yẹn lé ẹsẹ náà lórí.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: ‘Kọ́kọ́’ fi ààyè àkọ́kọ́ nínú ìtẹ̀lé ìṣe hàn lọ́nà àdánidá.
- source_word: λέγετε
  choice: ẹ … sọ pé
  rationale: Èyí jẹ́ àṣẹ sí ọ̀pọ̀ olùgbọ́, ó sì mú ọ̀rọ̀ ìkíni tí wọ́n gbọ́dọ̀ sọ wọlé lọ́nà Yorùbá tó mọ́.
- source_word: Εἰρήνη
  choice: Àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn lóye fún ìbàlẹ̀, àlàáfíà, àti ire tí ìkíni tàbí ìbùkún yìí ń kéde.
- source_word: τῷ οἴκῳ τούτῳ
  choice: fún ilé yìí
  rationale: ‘Fún’ fi ẹni tàbí ohun tí ìbùkún náà ń tọ́ sí hàn; ‘ilé yìí’ pa ìtumọ̀ gidi mọ́, ṣùgbọ́n nínú Yorùbá ó tún lè kan àwọn tó ń gbé ibẹ̀.
theological_decisions:
- issue: Irú àlàáfíà tí gbólóhùn náà ń kéde
  choice: 'Pa á mọ́ gẹ́gẹ́ bí ìkíni tàbí ìbùkún ṣókí: ‘Àlàáfíà fún ilé yìí.’'
  alternative: ‘Kí àlàáfíà wà fún ilé yìí’ tàbí ‘Kí àlàáfíà bà lé ilé yìí.’
  rationale: Gíríìkì jẹ́ gbólóhùn ìbùkún ṣókí tí kò ní ọ̀rọ̀-ìṣe tí a kọ sílẹ̀. Ìtumọ̀ yìí pa ṣókí rẹ̀ àti agbára ìkéde rẹ̀ mọ́, láìsọ ọ́ di ìkíni lasán tàbí fi èdè ìsìn àfikún kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A lo ‘ẹ’ nítorí pé àṣẹ náà ń tọ́ka sí ọ̀pọ̀ ọmọ-ẹ̀yìn; a sì pa àdúrà-ìbùkún náà mọ́ ní ṣókí.
