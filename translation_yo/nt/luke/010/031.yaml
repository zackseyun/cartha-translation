  source_fidelity: 'Ìtumọ̀ náà gba ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì náà dáadáa: àlùfáà kan, ìsọ̀kalẹ̀ tí ń tẹ̀síwájú, rírí ọkùnrin náà, àti lílọ kọjá ní ìhà òdìkejì. Ṣùgbọ́n “Ó sì ṣe déédé pé” kò jẹ́ ọ̀nà Yorùbá tó rọrùn tàbí tó péye láti fi κατὰ συγκυρίαν hàn; “déédé” lè sọ ìtumọ̀ ìbámu tàbí pé ohun kan ṣẹlẹ̀ gan-an. “Láìròtẹ́lẹ̀” fi ìṣẹ̀lẹ̀ àìfojúrí/chance hàn dáadáa jù.'
