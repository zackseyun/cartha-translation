  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: yo
  text: Láìròtẹ́lẹ̀, àlùfáà kan ń sọ̀ kalẹ̀ lójú ọ̀nà náà; nígbà tí ó rí i, ó sì kọjá lọ ní ìhà òdìkejì rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọjá lọ”; ṣùgbọ́n ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pé ó kọjá lọ ní ìhà òdìkejì rẹ̀, èyí tí ó lè fi ìyẹra hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Ó sì ṣe déédé pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn ìṣẹ̀lẹ̀ méjì bá ara wọn pàdé láìjẹ́ pé a ti ṣètò rẹ̀. Kò fi dandan sọ pé Ọlọ́run kò ní ipa nínú ìṣẹ̀lẹ̀ náà.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ ìtàn tó rọrùn, ó sì mú ìtàn tẹ̀ síwájú láìfi ìtakora líle kún un.
- source_word: ἱερεύς τις
  choice: àlùfáà kan
  rationale: ‘Kan’ pa ìtumọ̀ ẹni kan tí a kò dárúkọ mọ́; ‘àlùfáà’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ἱερεύς nínú àyíká Bíbélì.
- source_word: κατέβαινεν
  choice: ń sọ̀ kalẹ̀
  rationale: Àmì ‘ń’ pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, bí imperfect Gíríìkì ṣe gbé e kalẹ̀; ‘sọ̀ kalẹ̀’ tún fi ìrìn-àjò láti ibi gíga sí ibi ìsàlẹ̀ hàn.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: ní ojú ọ̀nà náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún jíjẹ́ ẹni tí ń rìn lórí ọ̀nà kan náà tí a ti mẹ́nu kàn.
- source_word: ἰδὼν αὐτὸν
  choice: Nígbà tí ó rí i
  rationale: Gbólóhùn àkókò yìí mú kí ó ṣe kedere pé rírí ọkùnrin náà ṣáájú ìṣe àlùfáà náà, láìfi ìdí míì kún ọ̀rọ̀.
- source_word: ἀντιπαρῆλθεν
  choice: ó kọjá lọ ní ìhà kejì
  rationale: Ìtumọ̀ yìí pa èrò pé ó kọjá ní apá òdìkejì mọ́, kì í ṣe pé ó kan kọjá lẹ́gbẹ̀ẹ́ rẹ̀ lásán.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A ya gbólóhùn náà sí méjì fún ìṣàn ọ̀rọ̀ tó ṣe kedere. A fi àmì àlàyé [a] sí lẹ́yìn ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé, dípò lẹ́yìn ‘ọ̀nà náà’.
