  to: Nítorí mo sọ fún yín pé ọ̀pọ̀ àwọn wòlíì àti àwọn ọba fẹ́[a] rí ohun tí ẹ̀yin ń rí, ṣùgbọ́n wọn kò rí i; wọ́n sì fẹ́ gbọ́ ohun tí ẹ ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ.
