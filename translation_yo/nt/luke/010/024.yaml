id: LUK.10.24
reference: Luke 10:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé ọ̀pọ̀ àwọn wòlíì àti àwọn ọba fẹ́[a] rí ohun tí ẹ̀yin ń rí, ṣùgbọ́n wọn kò rí i; wọ́n sì fẹ́ gbọ́ ohun tí ẹ ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìfẹ́-ọkàn láti rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: “Mo sọ fún yín” jẹ́ ọ̀nà àdánidá láti sọ λέγω ... ὑμῖν ní Yorùbá; “Nítorí” sì pa ìsopọ̀ àlàyé tí γάρ ní mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: ọ̀pọ̀ wòlíì àti ọba
  rationale: Èyí pa iye “ọ̀pọ̀” àti orúkọ ìtàn “àwọn wòlíì àti àwọn ọba” mọ́ láì sọ βασιλεῖς di àwọn alákòóso lápapọ̀.
- source_word: ἠθέλησαν
  choice: fẹ́
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè túmọ̀ sí fífẹ́ tàbí níní ìfẹ́-ọkàn sí ohun kan, láì fi ìmọ̀lára tó lágbára ju ti Gíríìkì lọ kún un.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: rí ohun tí ẹ̀yin ń rí
  rationale: “Rí” pa èrò ìríran mọ́; “ẹ̀yin” fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς àti ìyàtọ̀ tó wà láàárín àwọn ọmọ-ẹ̀yìn àti àwọn ènìyàn ìgbà àtijọ́ hàn.
- source_word: καὶ οὐκ εἶδαν
  choice: ṣùgbọ́n wọn kò rí i
  rationale: Bí ó tilẹ̀ jẹ́ pé καί ni Gíríìkì lò, “ṣùgbọ́n” sọ ìtakora tó wà nínú ọ̀rọ̀ náà ní Yorùbá àdánidá; “i” tọ́ka sí ohun tí wọ́n fẹ́ rí.
- source_word: καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: wọ́n sì fẹ́ gbọ́ ohun tí ẹ ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ
  rationale: Èyí pa ìfarajọ tó wà láàárín “rí” àti “gbọ́” mọ́, ó sì fi àkókò ìṣe tó ń lọ nínú ἀκούετε hàn nípasẹ̀ “ń gbọ́.”
theological_decisions:
- issue: Àwọn wo ni “àwọn wòlíì àti ọba” jẹ́?
  choice: Pa àwọn ẹ̀ka ìtàn náà mọ́ gẹ́gẹ́ bí “wòlíì àti ọba,” láì fi àlàyé míì kún un.
  alternative: “àwọn wòlíì àti alákòóso” tàbí “àwọn wòlíì àti ọba ìgbà àtijọ́”
  rationale: Gíríìkì sọ “wòlíì àti ọba” ní tààrà. Ìtumọ̀ náà kò gbọ́dọ̀ sọ irú àwọn ọba náà di ohun kan pàtó tàbí fi “ìgbà àtijọ́” kún ohun tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo “wòlíì” àti “ọba” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó ti fìdí múlẹ̀.
