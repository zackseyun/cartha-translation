id: LUK.10.17
reference: Luke 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: yo
  text: Àwọn méjìléláàádọ́rin náà sì padà wá pẹ̀lú ayọ̀, wọ́n sì wí pé, “Olúwa, àwọn ẹ̀mí èṣù pàápàá tẹrí bá fún wa ní orúkọ rẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: padà wá
  rationale: Ọ̀rọ̀ náà tọ́ka sí pípadà láti ibi iṣẹ́ tí a rán wọn sí; ‘padà wá’ jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ so ìṣẹ̀lẹ̀ yìí mọ́ ìtàn tó ṣáájú, ó sì mú ìtàn náà tẹ̀ síwájú láìfi ìtumọ̀ àkókò tí kò pọndandan kún un.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: àwọn méjìléláàádọ́rin
  rationale: Èyí tẹ̀ lé SBLGNT, tó ka iye náà sí méjìléláàádọ́rin; a tọ́ka sí ẹ̀dà míì nínú àlàyé ìsàlẹ̀.
- source_word: μετὰ χαρᾶς
  choice: fi ayọ̀
  rationale: Ó pa orúkọ ‘ayọ̀’ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún bí wọ́n ṣe padà.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Èyí fi ìṣe tí ó ń bá pípadà wọn lọ hàn, ó sì ṣí ọ̀rọ̀ tààrà sílẹ̀ lọ́nà àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè κύριος ni wọ́n fi pe Jésù; ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tó bójú mu.
- source_word: καὶ
  choice: pàápàá
  rationale: 'Níhìn-ín καί ń fi ìyàlẹ́nu àti ìtẹnumọ́ hàn: àwọn ẹ̀mí èṣù pàápàá.'
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí ń tọ́ka sí àwọn ẹ̀mí búburú ọ̀tá; ‘ẹ̀mí èṣù’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, láìdá wọn pọ̀ mọ́ Èṣù gẹ́gẹ́ bí ẹnì kan ṣoṣo.
- source_word: ὑποτάσσεται
  choice: tẹrí ba fún
  rationale: ‘Tẹrí ba fún’ sọ ìgbọràn àti wíwà lábẹ́ àṣẹ wọn ní Yorùbá àdánidá, ó sì bá fọ́ọ̀mù ìsinsìnyí mu.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Èyí dúró fún dative náà lẹ́yìn ọ̀rọ̀ tó túmọ̀ sí fífi ara sábẹ́ àṣẹ.
- source_word: ἐν τῷ ὀνόματί σου
  choice: ní orúkọ rẹ
  rationale: Ó pa àpẹẹrẹ ọ̀rọ̀ Gíríìkì mọ́, ó sì lè sọ àṣẹ tàbí agbára tí wọ́n lò ní ìbáṣepọ̀ pẹ̀lú orúkọ Jésù.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa iye àwọn ọmọ-ẹ̀yìn
  choice: àwọn méjìléláàádọ́rin
  alternative: àwọn àádọ́rin
  rationale: A tẹ̀ lé ọ̀rọ̀ SBLGNT tí a pèsè, ṣùgbọ́n a pa ìyàtọ̀ pàtàkì ‘àádọ́rin’ mọ́ nínú àlàyé ìsàlẹ̀, kí a má bàa fi ìyàtọ̀ ẹ̀rí ọ̀rọ̀ pamọ́.
translation_notes:
  register: Yorùbá àjọṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn Gíríìkì, ṣùgbọ́n ó jẹ́ àdánidá ní Yorùbá.
