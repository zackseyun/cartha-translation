- from: Àwọn méjìléláàádọ́rin náà sì fi ayọ̀ padà wá[a], wọ́n ń wí pé, “Olúwa, àwọn ẹ̀mí èṣù pàápàá tẹrí ba fún wa ní orúkọ rẹ.”
  to: Àwọn méjìléláàádọ́rin náà sì padà wá pẹ̀lú ayọ̀, wọ́n sì wí pé, “Olúwa, àwọn ẹ̀mí èṣù pàápàá tẹrí bá fún wa ní orúkọ rẹ.”
