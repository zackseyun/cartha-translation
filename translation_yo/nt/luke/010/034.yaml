    rationale: Bí ó tilẹ̀ jẹ́ pé ọgbẹ́ lè jẹ́ orúkọ àpapọ̀ ní Yorùbá, ‘àwọn ọgbẹ́ rẹ̀’ ń pa ọ̀pọ̀ orísun mọ́ kedere.
  - severity: low
    issue: ‘ó ń da òróró àti wáìnì lé e’ lè dà bíi pé a da wọ́n sórí ẹni náà lápapọ̀.
    rationale: Gíríìkì ń so ìdà náà mọ́ dídi àwọn ọgbẹ́; ‘sí wọn’ ń tọ́ka sí àwọn ọgbẹ́ ní kedere.
  - severity: low
