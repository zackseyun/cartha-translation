  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: yo
  text: Ó sún mọ́ ọn, ó sì dì àwọn ọgbẹ́ rẹ̀, nígbà tí ó ń da òróró àti wáìnì sí wọn. Lẹ́yìn náà, ó gbé e gùn ẹranko tirẹ̀[a], ó mú un lọ sí ilé ìtura, ó sì tọ́jú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí ‘ẹranko’ lè túmọ̀ sí ẹranko tí a gùn tàbí tí a fi ń ru ẹrù.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: ó sún mọ́ ọ
  rationale: Ó fi ìṣísẹ̀ ọkùnrin náà sí ọ̀dọ̀ ẹni tí ó fara pa hàn lọ́nà àdánidá, ó sì bá ipa aorist participle mu.
- source_word: κατέδησεν
  choice: ó di ọgbẹ́ rẹ̀
  rationale: ‘Di ọgbẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pípa ọgbẹ́ mọ́ tàbí fífi ohun dì í; kò fi ohun èlò ìtọ́jú òde òní kún ọ̀rọ̀ náà.
- source_word: τραύματα
  choice: ọgbẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn ọgbẹ́ ara; orúkọ yìí lè dúró fún ọgbẹ́ púpọ̀ ní àyíká yìí.
- source_word: ἐπιχέων
  choice: ó ń da ... lé e
  rationale: Ó pa ìtumọ̀ ìṣe tí ó ń bá dídi ọgbẹ́ lọ mọ́, ó sì sọ fífi omi náà sórí ọgbẹ́ ní èdè àdánidá.
- source_word: ἔλαιον
  choice: òróró
  rationale: ‘Òróró’ ni ìbámu gbooro pẹ̀lú ἔλαιον; a kò fi ‘ólífì’ kún un nítorí orísun náà kò sọ ọ́ ní pàtó.
- source_word: οἶνον
  choice: wáìnì
  rationale: Ìtumọ̀ tààrà fún ọtí wáìnì ni; a kò fi ìlò rẹ̀ gẹ́gẹ́ bí oògùn sínú ẹsẹ náà.
- source_word: ἐπιβιβάσας
  choice: ó gbé e gun
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún fífi ènìyàn gun ẹranko tí a fi ń rìn.
- source_word: ἴδιον
  choice: tirẹ̀
  rationale: Ó pa ìtẹnumọ́ pé ẹranko náà jẹ́ ohun ìní tirẹ̀ mọ́.
- source_word: κτῆνος
  choice: ẹranko
  rationale: Ó pa ìtumọ̀ gbooro ti ẹranko ìrìn tàbí ẹranko ẹrù mọ́ láì sọ irú ẹranko tí Gíríìkì kò dárúkọ.
- source_word: πανδοχεῖον
  choice: ilé èrò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ibi tí àwọn arìnrìn-àjò ti lè wọ̀ sí, kí wọn sì sùn.
- source_word: ἐπεμελήθη
  choice: ó tọ́jú rẹ̀
  rationale: Ó sọ àbójútó ara ẹni àti ìfẹ́ni tí middle verb náà ní lọ́nà kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A lo ‘ilé èrò’ fún πανδοχεῖον àti ‘ẹranko tirẹ̀’ fún τὸ ἴδιον κτῆνος. Àmì ẹsẹ̀ [a] wà lẹ́yìn ọ̀rọ̀ tí àlàyé rẹ̀ kan.
