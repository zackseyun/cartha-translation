revisions:
- from: Ó sì sún mọ́ ọ, ó di ọgbẹ́ rẹ̀, ó ń da òróró àti wáìnì lé e. Lẹ́yìn náà, ó gbé e gun ẹranko tirẹ̀[a], ó mú un lọ sí ilé èrò, ó sì tọ́jú rẹ̀.
  to: Ó sún mọ́ ọn, ó sì dì àwọn ọgbẹ́ rẹ̀, nígbà tí ó ń da òróró àti wáìnì sí wọn. Lẹ́yìn náà, ó gbé e gùn ẹranko tirẹ̀[a], ó mú un lọ sí ilé ìtura, ó sì tọ́jú rẹ̀.
  rationale: Àtúnṣe náà jẹ́ ìmúdọ́gba kékeré fún ìfaramọ́ sí ọ̀pọ̀ ọgbẹ́ nínú orísun, fún ìtọ́kasí tó ṣe kedere sí ibi tí a ti da òróró àti wáìnì, àti fún àmì ohùn Yorùbá tó pé. A tún lo ‘ilé ìtura’ gẹ́gẹ́ bí ìtumọ̀ tó dájú, tó sì jẹ́ ti ìgbàlódé fún ilé ìgbafẹ́ arìnrìn-àjò.
