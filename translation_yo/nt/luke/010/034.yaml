  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ Gíríìkì dáadáa. Síbẹ̀, a tún un ṣe díẹ̀ láti fi ọ̀pọ̀ ‘ọgbẹ́’ (τραύματα) hàn, láti tọ́ka sí àwọn ọgbẹ́ náà gẹ́gẹ́ bí ibi tí a ti da òróró àti wáìnì sí, àti láti ṣàtúnṣe àmì ohùn nínú ‘gùn’.
  naturalness: ‘Ilé ìtura’ jẹ́ ọ̀nà Yorùbá ìgbàlódé, tó rọrùn, fún ibi ìgbafẹ́ àwọn arìnrìn-àjò. Àtúnṣe ìṣe-ọrọ náà sì mú kí ìbáṣepọ̀ àwọn ọgbẹ́, òróró, àti wáìnì ṣe kedere.
  terminology: ‘Òróró,’ ‘wáìnì,’ ‘ẹranko tirẹ̀,’ àti ‘tọ́jú’ bá ọ̀rọ̀ Gíríìkì mu. ‘Ilé ìtura’ ń ṣàfihàn πανδοχεῖον láì fi irú ilé kan pàtó tí orísun kò sọ kún un.
