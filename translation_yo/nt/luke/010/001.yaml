id: LUK.10.1
reference: Luke 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, Olúwa tún yan àádọ́rin ó lé méjì mìíràn[a], ó sì rán wọn ní méjì-méjì ṣáájú rẹ̀ lọ sí gbogbo ìlú àti ibi tí òun fúnra rẹ̀ ń fẹ́ lọ sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “àádọ́rin” dípò “àádọ́rin ó lé méjì.”
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ àsìkò àti ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé.
- source_word: ἀνέδειξεν
  choice: yan
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí yíyan àwọn ènìyàn sí iṣẹ́ pàtó; “yan” ṣe kedere, kò sì fi ìtumọ̀ míì kún un.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún akọ́lé κύριος níbi tí ó ń tọ́ka sí Jésù.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: tún yan àádọ́rin ó lé méjì mìíràn
  rationale: “Tún” àti “mìíràn” jọ mú èrò pé àwọn wọ̀nyí jẹ́ àfikún mọ́ àwọn tí a ti mẹ́nu kàn; a tẹ̀lé iye méjìléláàádọ́rin inú SBLGNT.
- source_word: ἀπέστειλεν
  choice: rán wọn
  rationale: “Rán” jẹ́ ọ̀rọ̀ adayébá fún fífi ènìyàn lọ ṣe iṣẹ́, láìfi ìtumọ̀ ipò tàbí ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἀνὰ δύο δύο
  choice: ní méjì-méjì
  rationale: Ó pa ìpín wọn sí oríṣi méjì-méjì àti àtúnṣe ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá adayébá.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ṣáájú rẹ̀
  rationale: Ó fi hàn pé wọ́n lọ ṣáájú kí òun tó dé, dípò títú ọ̀rọ̀ náà nípa ojú ní ti gidi.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: sí gbogbo ìlú àti ibi
  rationale: Ó pa àwọn ọ̀rọ̀ méjèèjì, πόλις àti τόπος, mọ́ láìdà wọ́n pọ̀ sí ọ̀kan.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: tí òun fúnra rẹ̀ yóò dé láìpẹ́
  rationale: “Òun fúnra rẹ̀” pa ìtẹnumọ́ αὐτός mọ́; “yóò dé láìpẹ́” sọ ìṣe ọjọ́ iwájú tí ó sún mọ́lé nínú μέλλω ní Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa iye àwọn tí Olúwa yàn
  choice: àádọ́rin ó lé méjì
  alternative: àádọ́rin
  rationale: SBLGNT ní ἑβδομήκοντα δύο, “méjìléláàádọ́rin.” Nítorí “àádọ́rin” jẹ́ ìyàtọ̀ àfọwọ́kọ pàtàkì, a fi sí àlàyé ìsàlẹ̀ dípò kí a pa á mọ́ tàbí kí a dá ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé gbogbo lè lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ adayébá, a sì fi àmì ìsàlẹ̀ sí iye tí ìyàtọ̀ àfọwọ́kọ náà kan.
