id: LUK.10.19
reference: Luke 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: yo
  text: Wò ó, mo ti fún yín ní àṣẹ láti tẹ̀ lórí àwọn ejò àti àkekèé[a], àti lórí gbogbo agbára ọ̀tá; kò sì sí ohun kankan tí yóò pa yín lára rárá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè túmọ̀ náà sí, “ejò àti àkekèé.” Nínú àyíká yìí, àwòrán náà lè tún tọ́ka sí àwọn agbára ẹ̀mí ọ̀tá.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ náà sí, “kò sí ohun kankan tí yóò ṣe yín ní ibi láéláé,” tàbí, “kò sí ohun kankan tí yóò pa yín lára rárá.” Gíríìkì lo ìkọ̀ méjì láti tẹnumọ́ ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ tàbí ìpe àfiyèsí mọ́ ní èdè Yorùbá ọ̀wọ̀, láì lo ọ̀rọ̀ àtijọ́ tí kò rọrùn fún òǹkàwé òde òní.
- source_word: δέδωκα
  choice: mo ti fún yín
  rationale: Àmì ‘ti’ fi hàn pé fífún náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì wà nísinsìnyí, gẹ́gẹ́ bí perfect tense Gíríìkì.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ túmọ̀ sí ẹ̀tọ́ tàbí agbára tí a fi fún ẹni, ó sì jẹ́ kí ìyàtọ̀ rẹ̀ sí δύναμις (‘agbára’) tó wá lẹ́yìn hàn gbangba.
- source_word: τοῦ πατεῖν ἐπάνω
  choice: láti tẹ̀ lórí
  rationale: Ó pa àwòrán fífi ẹsẹ̀ tẹ ohun kan mọ́, ṣùgbọ́n kò fi ọ̀rọ̀ tó lágbára ju orísun lọ kún un.
- source_word: ὄφεων καὶ σκορπίων
  choice: àwọn ejò àti àkekèé
  rationale: Àwọn wọ̀nyí ni orúkọ ẹranko náà ní Yorùbá òde òní; a pa àwòrán gidi tí ọ̀rọ̀ Gíríìkì gbé kalẹ̀ mọ́.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: láti borí gbogbo agbára
  rationale: ‘Láti borí’ sọ ìṣàkóso tàbí ipò gíga ju agbára ọ̀tá lọ ní Yorùbá àdánidá, nígbà tí ‘gbogbo agbára’ pa ìtẹnumọ́ πᾶσαν mọ́.
- source_word: δύναμιν
  choice: agbára
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún okun tàbí agbára ìṣe, ó sì yàtọ̀ sí ‘àṣẹ’ tí a lò fún ἐξουσία.
- source_word: τοῦ ἐχθροῦ
  choice: ọ̀tá
  rationale: A pa ọ̀rọ̀ náà mọ́ ní gbogbogbòò, láì sọ ní pàtó pé Sátánì tàbí Èṣù ni, nítorí orísun sọ ‘ọ̀tá’ nìkan.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: kò sì sí ohun kankan tí yóò pa yín lára rárá
  rationale: Ìṣètò òdì àti ‘rárá’ mú ìtẹnumọ́ ìkọ̀ Gíríìkì jáde ní Yorùbá àdánidá; ‘pa ... lára’ sọ ìpalára láì dín un sí ọgbẹ́ ara nìkan.
theological_decisions:
- issue: Ẹni tí ‘ọ̀tá’ ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí ‘ọ̀tá’ láì fi orúkọ míì kún un.
  alternative: Sátánì tàbí Èṣù
  rationale: Àyíká ọ̀rọ̀ nípa àwọn ẹ̀mí èṣù àti Sátánì lè tọ́ka sí i, ṣùgbọ́n Gíríìkì kò sọ orúkọ náà níhìn-ín; ìtumọ̀ náà kò yẹ kí ó yanju ohun tí ọ̀rọ̀ fi sílẹ̀ ní gbangba.
- issue: Bóyá ‘ejò àti àkekèé’ jẹ́ ohun gidi tàbí àpẹẹrẹ agbára ẹ̀mí
  choice: A pa àwòrán àwọn ẹranko náà mọ́ nínú ẹsẹ̀.
  alternative: Kí a túmọ̀ wọn ní tààrà sí àwọn agbára ẹ̀mí búburú
  rationale: Ìtumọ̀ ọ̀rọ̀ wọn ní tààrà jẹ́ àwọn ẹranko, bí ó tilẹ̀ jẹ́ pé àyíká lè fún àwòrán náà ní ìtumọ̀ nípa àwọn agbára ẹ̀mí. A kò fi ìtumọ̀ kan ṣoṣo lé òǹkàwé lórí.
- issue: Ìlérí pé kò sí ohun tí yóò pa àwọn ọmọ-ẹ̀yìn lára
  choice: 'A pa ìkọ̀ tó lágbára mọ́: ‘kò ... rárá.’'
  alternative: Kí a dín un kù sí ààbò ẹ̀mí nìkan tàbí ààbò ara nìkan
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò ṣàlàyé bí ìlérí yìí ṣe ní í ṣe pẹ̀lú ìjìyà àwọn ọmọ-ẹ̀yìn ní ibòmíràn; ìtumọ̀ kò yẹ kí ó fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan sínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Àṣẹ’ àti ‘agbára’ pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì méjèèjì mọ́; ‘Kíyèsí i’ sì jẹ́ ìpe àfiyèsí tó bójú mu láì dà bí èdè àtijọ́ jù.
