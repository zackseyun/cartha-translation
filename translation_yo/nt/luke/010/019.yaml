  source_fidelity: Àwọn apá pàtàkì bíi perfect náà nínú “mo ti fún yín,” ìyàtọ̀ “àṣẹ” sí “agbára,” àti ìkọ̀ alágbára nínú ìparí ẹsẹ̀ wà ní ìbámu pẹ̀lú Gíríìkì. Ṣùgbọ́n “láti borí gbogbo agbára ọ̀tá” yí ìṣọ̀kan gírámà Gíríìkì náà sí ìṣẹ́gun dípò àṣẹ lórí agbára ọ̀tá; a tún ṣe àtúnṣe sí “lórí gbogbo agbára ọ̀tá.” Àlàyé-ẹsẹ̀ a náà fi “ejò olóró” kún ohun tí ὄφεις kò sọ.
