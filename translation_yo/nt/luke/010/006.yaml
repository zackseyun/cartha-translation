id: LUK.10.6
reference: Luke 10:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: yo
  text: Bí ọmọ àlàáfíà kan bá sì wà níbẹ̀[a], àlàáfíà yín yóò sinmi lé e lórí; ṣùgbọ́n bí kò bá sí, yóò sì padà tọ̀ yín wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni àlàáfíà”—ìyẹn ni, ẹni tí ó ṣí ọkàn sí ìhìn-iṣẹ́ tí ń mú àlàáfíà wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: ọmọ àlàáfíà kan
  rationale: Èyí pa àkànlò èdè Sẹ́mítíkì àti ọ̀rọ̀ akọ ẹyọ kan nínú Gíríìkì mọ́. Ó túmọ̀ sí ẹni tí àlàáfíà ń ṣe àpèjúwe rẹ̀ tàbí ẹni tí ó múra láti gba iṣẹ́ ìránṣẹ́ àlàáfíà; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ìtumọ̀ àkànlò náà hàn.
- source_word: ἐπαναπαήσεται
  choice: yóò bà lé e
  rationale: Àkànlò Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé àlàáfíà náà yóò sinmi tàbí dúró lórí ẹni náà, ó sì pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: àlàáfíà yín
  rationale: Èyí pa ọ̀rọ̀ arọ́pò-orúkọ olùní ti Gíríìkì mọ́, kò sì fi dandan túmọ̀ rẹ̀ sí ìkíni tàbí ìbùkún nìkan.
- source_word: μήγε
  choice: bí kò bá sí
  rationale: Ó sọ ipò òdì náà ní Yorùbá tí ó rọrùn, ó sì mú ìtumọ̀ pé ẹni bẹ́ẹ̀ kò sí níbẹ̀ hàn ní kedere.
- source_word: ἀνακάμψει
  choice: yóò padà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yípadà tàbí padà wá; ‘yóò padà’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé jù lọ níhìn-ín.
- source_word: ἐφ’ ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘padà,’ ‘sọ́dọ̀ yín’ jẹ́ àkànlò Yorùbá àdánidá tí ó fi hàn pé àlàáfíà náà yóò padà tọ àwọn tí wọ́n sọ ọ́.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Bí ... bá sì wà níbẹ̀
  rationale: Èyí pa àsopọ̀ καί, gbólóhùn oníwọ̀n ἐὰν, àti ìtẹnumọ́ ibi ἐκεῖ mọ́ ní ètò ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ àkànlò akọ υἱὸς εἰρήνης di ọ̀rọ̀ tí kò tọ́ka sí akọ tàbí abo
  choice: Pa ‘ọmọ àlàáfíà’ mọ́ nínú ẹsẹ̀ pàtàkì
  alternative: ẹni àlàáfíà; ẹni tí ó ní àlàáfíà
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ẹyọ kan nínú àkànlò tí a lè mọ̀. ‘Ọmọ àlàáfíà’ pa ìrísí àti ìdíwọ̀n ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ ń fún òǹkàwé ní ìtumọ̀ Yorùbá tí ó ṣe kedere sí i.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ọmọ àlàáfíà’ mọ̀ọ́mọ̀ pa àkànlò orísun mọ́; ‘bà lé e’ àti ‘padà sọ́dọ̀ yín’ mú kí ìyókù ẹsẹ̀ náà ṣàn ní Yorùbá àdánidá.
