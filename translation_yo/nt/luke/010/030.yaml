  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: yo
  text: Jésù sì dáhùn pé, “Ọkùnrin kan ń sọ̀kalẹ̀ láti Jerúsálẹ́mù lọ sí Jẹ́ríkò, ó sì ṣubú sí ọwọ́ àwọn ọlọ́ṣà. Wọ́n bọ́ ọ́ ní aṣọ, wọ́n nà án, wọ́n sì lọ, wọ́n fi í sílẹ̀ nígbà tí ó fẹ́rẹ̀ẹ́ kú.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: sì dáhùn pé
  rationale: Nínú ọ̀rọ̀ àsọyé yìí, ὑπολαμβάνω túmọ̀ sí gbígbé ọ̀rọ̀ ẹni kejì mú láti dá a lóhùn; ‘dáhùn’ jẹ́ Yorùbá àdánidá.
- source_word: Ἄνθρωπός τις
  choice: Ọkùnrin kan
  rationale: Ṣe àfihàn ẹni tí a kò dárúkọ, gẹ́gẹ́ bí ìbẹ̀rẹ̀ àkàwé náà.
- source_word: κατέβαινεν
  choice: ń sọ̀kalẹ̀
  rationale: Pa ìtọ́kasí ìrìn-àjò sísàlẹ̀ láti Jerúsálẹ́mù mọ́, èyí tó tún bá ipò ilẹ̀ mu.
- source_word: λῃσταῖς περιέπεσεν
  choice: ṣubú sí ọwọ́ àwọn ọlọ́ṣà
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún jíjìn sínú ewu tàbí ìkọlù àwọn ọlọ́ṣà.
- source_word: ἐκδύσαντες αὐτὸν
  choice: tú aṣọ rẹ̀
  rationale: Túmọ̀ ìṣe fífi ẹni náà sí ìhòòhò ní ṣókí, láìfi ohun tí orísun kò sọ kún un.
- source_word: πληγὰς ἐπιθέντες
  choice: lù ú
  rationale: Ṣe àfihàn fífi ìlù tàbí ọgbẹ́ ba a ní èdè Yorùbá tó wọ́pọ̀.
- source_word: ἡμιθανῆ
  choice: ní àbọ̀-òkú
  rationale: Pa àwòrán ‘half-dead’ mọ́ ní ọ̀nà Yorùbá tó ṣe kedere, ìyẹn ẹni tó wà láàárín ikú àti ìyè.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìtẹ̀síwájú ìṣe inú Gíríìkì mọ́ pẹ̀lú ‘wọ́n… wọ́n… wọ́n sì…’.
