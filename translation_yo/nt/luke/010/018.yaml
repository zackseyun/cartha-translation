  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣe àtẹ̀yìnwá nínú “ó sì wí fún wọn,” imperfect nínú “Mo ń wo,” orúkọ Sátánì, ìṣubú láti ọ̀run, àti àfiwé mànàmáná wọlé dáadáa. Síbẹ̀, “bí ó ti ń ṣubú … bí mọ̀nàmọ́ná” ní “bí” méjì tí ó lè mú kí ìbáṣepọ̀ àfiwé Gíríìkì náà dàrú.
  naturalness: “Mo ń wo Sátánì tí ń ṣubú láti ọ̀run bí mànàmáná” jẹ́ gbolóhùn Yorùbá boṣewa, kedere, ó sì dáa ju ìkọ̀sẹ̀ “bí ó ti … bí …” lọ. “Mànàmáná” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì bá ìlò Bíbélì Yorùbá mu fún ἀστραπή.
  terminology: Sátánì àti ọ̀run yẹ. A tún ṣe àtúnṣe ìsàlẹ̀-ìwé kí yíyàn “Mo rí” má ba a fi hàn pé ìṣubú náà ti parí dandan; imperfect Gíríìkì ti “wo” ni a ń ṣàlàyé, kì í ṣe pé aorist participle náà gbọ́dọ̀ di iṣẹ́ tí ó ti parí ní Yorùbá.
