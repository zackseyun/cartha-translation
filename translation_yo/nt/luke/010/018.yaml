  rationale: Àtúnṣe náà yọ ìdàrú tí “bí” méjì lè dá sílẹ̀, ó sì pa imperfect ti Ἐθεώρουν mọ́ nípasẹ̀ “Mo ń wo.” A rọ́pò “mọ̀nàmọ́ná” pẹ̀lú “mànàmáná,” ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún mànàmáná/àrá nínú àfiwé yìí. Kò ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan nípa ìgbà ìṣubú Sátánì.
