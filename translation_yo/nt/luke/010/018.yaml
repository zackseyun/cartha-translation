base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Mo ń wo Sátánì tí ń ṣubú láti ọ̀run bí mànàmáná.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Mo rí Sátánì ń ṣubú láti ọ̀run bí mànàmáná.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè gba ìtumọ̀ rọrùn yìí, ṣùgbọ́n “Mo ń wo” túbọ̀ pa ìrísí ìṣe tí ń lọ mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ó sì wí fún wọn pé
  rationale: Aorist εἶπεν jẹ́ ìṣe àtẹ̀yìnwá nínú ìtàn; δέ jẹ́ àsopọ̀ pẹ̀lẹ́, tí ‘sì’ fi hàn lọ́nà àdánidá; αὐτοῖς ni ‘fún wọn.’
- source_word: Ἐθεώρουν
  choice: Mo ń wo
  rationale: Àkókò imperfect ti θεωρέω ní ìrísí ìṣe tí ń lọ lọ́wọ́; ‘Mo ń wo’ pa ìrísí yìí mọ́ láìṣe Yorùbá ní àjèjì.
- source_word: τὸν Σατανᾶν
  choice: Sátánì
  rationale: A lò orúkọ/oyè ẹni náà gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Yorùbá Bíbélì, dípò fífi ìtumọ̀ ‘Ọ̀tá’ rọ́pò rẹ̀.
- source_word: ὡς ἀστραπὴν
  choice: bí mọ̀nàmọ́ná
  rationale: ὡς mú àfiwé wọlé; ‘bí mọ̀nàmọ́ná’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àwòrán náà mọ́.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: οὐρανός lè túmọ̀ sí ojú ọ̀run tàbí ibùgbé ọ̀run; ní àyíká ọ̀rọ̀ yìí ‘ọ̀run’ pa ìtumọ̀ tó gbòòrò àti ìṣòro ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
- source_word: πεσόντα
  choice: bí ó ti ń ṣubú
  rationale: Aorist participle náà ṣàpèjúwe Sátánì gẹ́gẹ́ bí ẹni tí a ń rí nínú ìṣẹ̀lẹ̀ ṣíṣubú; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì bá ‘Mo ń wo’ mu.
theological_decisions:
- issue: Ìgbà àti ìrísí ìṣẹ̀lẹ̀ ṣíṣubú Sátánì
  choice: Mo ń wo Sátánì bí ó ti ń ṣubú
  alternative: Mo rí Sátánì tí ó ṣubú
  rationale: Ọ̀rọ̀ Gíríìkì kò fi dandan sọ bóyá Jesu ń tọ́ka sí ìṣubú ìpilẹ̀ṣẹ̀, iṣẹ́ àwọn ọmọ-ẹ̀yìn nígbà náà, tàbí ìran àsọtẹ́lẹ̀ nípa ìjákulẹ̀ Sátánì. Ìtumọ̀ náà pa ìrísí ìṣe tí ń lọ àti àìdánilójú àkókò mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A yan ‘wí’ fún ìforúkọsílẹ̀ mímọ́ tó ṣì ṣeé lóye, ‘Mo ń wo’ sì jẹ́ àdánidá fún imperfect.
