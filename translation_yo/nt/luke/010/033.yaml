  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: yo
  text: Ṣùgbọ́n ará Samáríà kan, bí ó ti ń rin ìrìn àjò, dé sí ibi tí ọkùnrin náà wà; nígbà tí ó rí i, àánú ṣe é.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ó ní àánú sí i.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ará Samáríà kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ẹni tí ó jẹ́ ará Samáríà, ó sì pa ìdánimọ̀ ẹ̀yà àti ẹ̀sìn rẹ̀ mọ́ nínú ìtàn náà.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ìṣe ará Samáríà yìí àti ti àlùfáà àti ọmọ Lefi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: τις
  choice: kan
  rationale: Ọ̀rọ̀ àìnípàtó yìí bá Σαμαρίτης mu; “kan” ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὁδεύων
  choice: bí ó ti ń rin ìrìn àjò
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ mọ́ gẹ́gẹ́ bí àyíká fún ohun tó ṣẹlẹ̀ lẹ́yìn náà.
- source_word: ἦλθεν
  choice: dé
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ó dé ibi tí ọkùnrin tí a ṣekúṣe sí náà wà.
- source_word: κατ’ αὐτόν
  choice: ibi tí ọkùnrin náà wà
  rationale: Ọ̀rọ̀ yìí sọ ibi tí ará Samáríà náà dé; fífi “ọkùnrin náà” sọ ọ́ mú kí ẹni tí arọ́pò-orúkọ ń tọ́ka sí ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: ἰδών
  choice: nígbà tí ó sì rí i
  rationale: Ó fi hàn ní ti àkókò pé rírí ọkùnrin náà ṣáájú ìdáhùn àánú rẹ̀.
- source_word: ἐσπλαγχνίσθη
  choice: àánú rẹ̀ ṣe é
  rationale: Gbólóhùn Yorùbá àdánidá yìí sọ ìmọ̀lára àánú jíjinlẹ̀ tí ọ̀rọ̀ Gíríìkì náà ní, láìfi ẹ̀kọ́ ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bí a ṣe máa sọ ìdáhùn àánú ará Samáríà láìfi ìtumọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà
  choice: àánú rẹ̀ ṣe é
  alternative: ó ní àánú sí i
  rationale: Àṣàyàn náà pa agbára ìmọ̀lára inú tí ἐσπλαγχνίσθη ní mọ́, ṣùgbọ́n kò tú un sí ọ̀rọ̀ nípa oore-ọ̀fẹ́, ìfẹ́ aládùúgbò, tàbí ẹ̀kọ́ mìíràn tí ẹsẹ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo “ará Samáríà” dípò àkọsílẹ̀ orúkọ tí kò ṣe kedere, a sì tú ἐσπλαγχνίσθη sí ọ̀rọ̀ àdánidá Yorùbá tó pa agbára rẹ̀ mọ́.
