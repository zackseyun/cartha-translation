source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: yo
  text: Ó sì yíjú sí àwọn ọmọ-ẹ̀yìn náà, nígbà tí wọ́n wà lọ́tọ̀, ó sì wí pé, “Alábùkún-fún ni àwọn ojú tí ń rí ohun tí ẹ̀yin ń rí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: ó sì yíjú sí
  rationale: Ó mú ìṣe yíyí sí àwọn ọmọ-ẹ̀yìn jáde ní Yorùbá àdánidá, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀ tí Jésù sọ lẹ́yìn náà.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀ lọ́tọ̀ sí àwọn ẹlòmíràn; “ní ìkọ̀kọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó bá èdè òde òní mu.
- source_word: μαθητάς
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής, ó sì pa ìtumọ̀ ẹni tó ń kọ́ lábẹ́ olùkọ́ àti tó ń tẹ̀ lé e mọ́.
- source_word: Μακάριοι
  choice: Alábùkún-fún ni
  rationale: Ó jẹ́ ìkéde ipò ìbùkún, kì í ṣe ìmọ̀lára ayọ̀ lásán; yíyan yìí pa agbára ọ̀rọ̀ ìbùkún náà mọ́.
- source_word: οἱ ὀφθαλμοὶ
  choice: àwọn ojú
  rationale: Ó tẹ̀ lé àwòrán tààrà inú Gíríìkì, níbi tí “ojú” ti dúró fún àwọn ẹni tí a fún ní àǹfààní láti rí.
- source_word: οἱ βλέποντες
  choice: tí ń rí
  rationale: Ó fi ìṣe tó ń lọ hàn gẹ́gẹ́ bí participle ìsinsìnyí náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἃ βλέπετε
  choice: ohun tí ẹ̀yin ń rí
  rationale: Ó pa ọ̀rọ̀ ibátan àti ìṣe ìsinsìnyí mọ́; “ẹ̀yin” tún mú ìtẹnumọ́ ẹni-kejì ọ̀pọ̀ tó wà nínú βλέπετε ṣe kedere.
theological_decisions:
- issue: Agbára ìkéde Μακάριοι
  choice: Ìkéde pé àwọn ojú tí ń rí ohun tí àwọn ọmọ-ẹ̀yìn ń rí jẹ́ alábùkún-fún
  alternative: Gbólóhùn nípa ayọ̀ tàbí oríire lásán
  rationale: Nínú irú ọ̀rọ̀ ìbùkún yìí, μακάριοι ń kéde ìbùkún àti ojú rere Ọlọ́run, kì í ṣe bí inú ẹni ṣe dùn nìkan. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ní ìkọ̀kọ̀” jẹ́ kedere láì nílò àlàyé ẹsẹ̀-àlàyé; èdè náà pa àwòrán “àwọn ojú” inú orísun mọ́.
