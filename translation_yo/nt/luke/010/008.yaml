  rationale: 'A ṣe àtúnṣe kékeré kan ṣoṣo: a yọ ‘bá’ kúrò nínú gbólóhùn ìbátan tó ṣàpèjúwe ohun tí a gbé kalẹ̀. Èyí pa ipa participle Gíríìkì náà mọ́ láìfi ìtumọ̀ ipò tàbí ìṣẹ̀lẹ̀ ọjọ́ iwájú kún un.'
