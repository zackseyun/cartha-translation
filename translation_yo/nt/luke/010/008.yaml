  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: yo
  text: Ní ìlú yòówù tí ẹ bá wọ̀, tí wọ́n sì gbà yín, ẹ jẹ ohun tí wọ́n gbé kalẹ̀ níwájú yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: ní ìlú yòówù
  rationale: Àpapọ̀ ọ̀rọ̀ arọ́pò-orúkọ àti ἄν ń fi ìtumọ̀ gbogbogbò hàn, ìyẹn ‘ìlú yòówù.’ Ní Yorùbá, ‘ní ìlú ... tí ... wọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ìwọlé sínú ìlú láìfi ìtumọ̀ εἰς sílẹ̀.
- source_word: εἰσέρχησθε
  choice: tí ẹ bá wọ̀
  rationale: Ìṣe ọ̀rọ̀ yìí wà nínú gbólóhùn ipò gbogbogbò; ‘tí ẹ bá wọ̀’ jẹ́ Yorùbá àdánidá fún ‘nígbàkigbà tí ẹ bá wọ inú rẹ̀.’
- source_word: δέχωνται ὑμᾶς
  choice: tí wọ́n sì gbà yín
  rationale: δέχομαι lè túmọ̀ sí gbígba tàbí kíka ẹni sí àlejò. ‘Gbà yín’ pa ìbámu ọ̀rọ̀ mọ́, ó sì yẹ ní àyíká ọ̀rọ̀ yìí; ‘sì’ tún ṣàfihàn καί.
- source_word: ἐσθίετε
  choice: ẹ jẹ
  rationale: Àṣẹ ìsinsìnyí ni; àṣẹ ‘ẹ jẹ’ jẹ́ kedere, àdánidá, ó sì bá ọ̀pọ̀ ènìyàn tí a ń bá sọ mu.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: ohun tí wọ́n bá gbé kalẹ̀ níwájú yín
  rationale: Gbólóhùn náà pa àwòrán ohun tí a gbé síwájú ẹni mọ́, ó sì yẹ fún oúnjẹ tí a fi fún àlejò láìṣe àlàyé ju orísun lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lò ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμεῖς.
