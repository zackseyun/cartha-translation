  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Kí ni a kọ nínú Òfin? Báwo ni o ṣe kà á?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni o ṣe túmọ̀ rẹ̀?” Ní ìtumọ̀ tààrà, Gíríìkì sọ pé, “Báwo ni o ṣe kà á?” Ó sì lè ní ìtumọ̀ bí o ṣe lóye tàbí túmọ̀ ohun tí o kà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú ìtàn; “sì” ń mú ìṣàn ọ̀rọ̀ Yorùbá lọ láìfi ìtakora tí kò sí kún un. “Ó” dúró fún ẹni tí àpilẹ̀kọ Gíríìkì tọ́ka sí.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé ó bá a sọ̀rọ̀ ní tààrà, láìfi ìtumọ̀ míì kún un.
- source_word: Ἐν τῷ νόμῳ
  choice: sínú Òfin
  rationale: νόμος níbí ń tọ́ka sí Òfin tí a kọ sílẹ̀ fún Ísírẹ́lì gẹ́gẹ́ bí apá Ìwé Mímọ́; lílo lẹ́tà ńlá fún “Òfin” ń fi ìtọ́kasí pàtó yìí hàn.
- source_word: τί γέγραπται
  choice: Kí ni a kọ
  rationale: Gíríìkì perfect passive fi ohun tí a kọ sílẹ̀ tí ó sì wà ní ìkọ̀wé hàn. “Kí ni a kọ sínú Òfin?” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtọ́kasí sí ohun tí a kọ mọ́.
- source_word: πῶς
  choice: Báwo ni
  rationale: πῶς béèrè nípa ọ̀nà tàbí bí ẹni náà ṣe lóye ohun tí ó kà; “Báwo ni” pa ìbéèrè náà sílẹ̀ ní gbangba.
- source_word: ἀναγινώσκεις
  choice: ìwọ ṣe kà á
  rationale: ἀναγινώσκω túmọ̀ ní pàtàkì sí “kà.” Fífi “ìwọ” hàn ń bá ìbéèrè Yorùbá mu, “á” sì ń tọ́ka padà sí Òfin. A pa ìtumọ̀ ìpìlẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ẹ̀ka ìtumọ̀ “túmọ̀ rẹ̀” hàn.
theological_decisions:
- issue: Ìtumọ̀ νόμος nínú ìbéèrè Jésù
  choice: Òfin gẹ́gẹ́ bí Òfin Ìwé Mímọ́ tí a fi fún Ísírẹ́lì
  alternative: Tórà; tàbí òfin lásán ní ìtumọ̀ gbogbogbò
  rationale: Ọ̀rọ̀ náà wáyé nínú ìjíròrò pẹ̀lú amòfin Júù, nítorí náà ó ń tọ́ka sí Òfin tí a mọ̀ sí apá Ìwé Mímọ́, kì í ṣe òfin gbogbogbò.
- issue: Ẹ̀ka ìtumọ̀ πῶς ἀναγινώσκεις
  choice: Pa ìtumọ̀ tààrà “Báwo ni ìwọ ṣe kà á?” mọ́
  alternative: Báwo ni ìwọ ṣe túmọ̀ rẹ̀?
  rationale: Ó ṣeé ṣe kí ìbéèrè náà kan òye tàbí ìtumọ̀ ẹni náà, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ni “kà.” Ìtumọ̀ tààrà ń pa ààyè ọ̀rọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀sìn inú ẹsẹ náà mọ́.
translation_notes:
  register: Yorùbá àfọwọ́kọ, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ; “Òfin” gba lẹ́tà ńlá láti fi hàn pé Òfin Ìwé Mímọ́ ni.
