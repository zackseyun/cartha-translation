- from: Sì wò ó, amòfin kan[a] dìde láti dán an wò, ó ní, “Olùkọ́, kí ni mo gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?”
  to: Kíyèsí i, amòfin kan[a] dìde láti dán an wò, ó ní, “Olùkọ́, kí ni mo gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?”
  rationale: The revision replaces only the unnatural rendering of the Greek attention marker with an idiomatic Yoruba narrative equivalent. It retains the legal-specialist clarification, the probing sense, the question’s action-focused framing, and the inheritance metaphor without adding theological interpretation.
  reviewer_model: gpt-5.6-terra
