id: LUK.10.25
reference: Luke 10:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: yo
  text: Kíyèsí i, amòfin kan[a] dìde láti dán an wò, ó ní, “Olùkọ́, kí ni mo gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀mọ̀wé nínú Òfin.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tó jẹ́ amòye nínú Òfin àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa àmì ìtàn tó ń pe àfiyèsí mọ́, ó sì mú kí ìṣẹ̀lẹ̀ náà hàn gbangba láì sọ ọ́ di ọ̀rọ̀ àtijọ́ tí kò yé òǹkàwé òde òní.
- source_word: νομικός τις
  choice: amòfin kan
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹni tó mọ Òfin Mósè dáadáa, kì í ṣe agbẹjọ́rò òde òní lásán. Àlàyé ìsàlẹ̀ ojú ewé mú ìtumọ̀ pàtó yìí ṣe kedere.
- source_word: ἀνέστη
  choice: dìde
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tó sì bá ọ̀nà tí Yorùbá fi ń sọ ìṣẹ̀lẹ̀ bẹ́ẹ̀ mu.
- source_word: ἐκπειράζων αὐτὸν
  choice: láti dán an wò
  rationale: Ó fi hàn pé amòfin náà fẹ́ fi Jésù ṣe àyẹ̀wò tàbí mú un sínú ìdánwò; kò fi dandan túmọ̀ sí pé ó ń tan án láti dá ẹ̀ṣẹ̀.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti bẹ̀rẹ̀ ọ̀rọ̀ ẹni lẹ́yìn ìṣe tó ṣáájú.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ó sọ ipa ẹni tó ń kọ́ni ní ẹ̀kọ́ ní kedere, láì lo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tó lè ṣini lọ́nà.
- source_word: τί ποιήσας
  choice: kí ni mo gbọdọ̀ ṣe
  rationale: Ó sọ ìbéèrè ní Yorùbá àdánidá, ó sì pa èrò rẹ̀ mọ́ pé ìṣe kan ni yóò jẹ́ ọ̀nà sí àbájáde tó ń béèrè nípa rẹ̀.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìyè tí kò ní òpin, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu ní àyíká yìí.
- source_word: κληρονομήσω
  choice: kí n lè jogún
  rationale: Ó pa àwòrán ogún inú ọ̀rọ̀ Gíríìkì mọ́ dípò fífi ọ̀rọ̀ gbogbogbò bí ‘rí gbà’ rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ νομικός nínú àyíká Júù ní ọ̀rúndún kìíní
  choice: amòfin, ìyẹn ẹni tó jẹ́ amòye nínú Òfin Mósè
  alternative: ọ̀mọ̀wé nínú Òfin
  rationale: Ọkùnrin náà jẹ́ ẹni tí a kọ́ nípa Tórà àti ìtumọ̀ rẹ̀, kì í ṣe agbẹjọ́rò nínú ètò òfin ìgbàlódé. A pa ọ̀rọ̀ kúkúrú náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀ ojú ewé.
- issue: Agbára ọ̀rọ̀ τί ποιήσας ... κληρονομήσω
  choice: kí ni mo gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?
  alternative: kí ni kí n ṣe láti jogún ìyè àìnípẹ̀kun?
  rationale: Ìtumọ̀ yìí pa bí ọkùnrin náà ṣe gbé ìbéèrè rẹ̀ karí ohun tí òun yóò ṣe mọ́, láì pinnu tàbí ṣàlàyé ìdáhùn ẹ̀kọ́ ìgbàgbọ́ sí ìbéèrè náà ṣáájú.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Sì wò ó’ pa ohùn ìpè-àfiyèsí inú ìtàn mọ́; ‘amòfin’ jẹ́ kúkúrú, ṣùgbọ́n àlàyé [a] yọ ìtumọ̀ agbẹjọ́rò òde òní kúrò.
