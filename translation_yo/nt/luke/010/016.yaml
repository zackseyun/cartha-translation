id: LUK.10.16
reference: Luke 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: yo
  text: Ẹni tí ó bá gbọ́ yín, ó gbọ́ mi; ẹni tí ó bá kọ̀[a] yín, ó kọ̀ mí; ṣùgbọ́n ẹni tí ó bá kọ̀ mí, ó kọ̀ ẹni tí ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ‘ṣàì kà yín sí’ tàbí ‘yọ yín sí ẹ̀gbẹ́ kan,’ fún ‘kọ̀’ (Gíríìkì: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Ẹni tí ó bá gbọ́
  rationale: Ọ̀rọ̀ yìí fi ẹni kọ̀ọ̀kan hàn ní ọ̀nà gbogbogbò. Ìlò ‘Ẹni tí ó bá’ jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ ẹni tí ìṣe náà ń dá mọ̀ mọ́.
- source_word: ὑμῶν … ἐμοῦ
  choice: yín … mi
  rationale: Jẹ́nítífù lẹ́yìn ἀκούω tọ́ka sí àwọn ènìyàn tí a gbọ́. Ìtumọ̀ tààrà yìí kò fi ‘ọ̀rọ̀’ tàbí ‘ohùn’ kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: ἀκούει
  choice: gbọ́
  rationale: ‘Gbọ́’ pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́, ó sì lè ní agbára ìtumọ̀ gbigbọ́ ẹni pẹ̀lú ìtẹ́wọ́gbà nínú àyíká yìí.
- source_word: ἀθετέω
  choice: kọ̀
  rationale: Nínú àyíká ìbáṣepọ̀ yìí, ‘kọ̀’ sọ ìtẹ̀sí láti má gba àwọn aṣojú náà tàbí ẹni tí wọ́n dúró fún ní kedere. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tí ọ̀rọ̀ Gíríìkì lè ní hàn.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré àti ìlọsíwájú sí gbólóhùn ìparí hàn.
- source_word: τὸν ἀποστείλαντά με
  choice: ẹni tí ó rán mi
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ẹni tí a ń tọ́ka sí mọ́ láìfi ‘Baba’ kún ọ̀rọ̀ orísun.
theological_decisions:
- issue: Ìdámọ̀ Jésù pẹ̀lú àwọn aṣojú tí ó rán
  choice: 'A pa ìtẹ̀lé ẹni-sí-ẹni mọ́: ẹni tí ó gbọ́ tàbí kọ̀ àwọn ọmọ-ẹ̀yìn gbọ́ tàbí kọ̀ Jésù; ẹni tí ó kọ̀ Jésù sì kọ̀ ẹni tí ó rán an.'
  alternative: Kí a túmọ̀ rẹ̀ sí gbigbọ́ tàbí kíkọ̀ ‘ọ̀rọ̀’ àwọn ọmọ-ẹ̀yìn nìkan.
  rationale: Gíríìkì lo arọ́pò-orúkọ ẹni—‘yín’ àti ‘mi’—kì í ṣe ọ̀rọ̀ àfojúrí bí ‘ìránṣẹ́’ tàbí ‘ẹ̀kọ́.’
- issue: Ta ni ‘ẹni tí ó rán mi’ ń tọ́ka sí?
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ‘ẹni tí ó rán mi.’
  alternative: Kí a sọ ní gbangba pé ‘Baba tí ó rán mi.’
  rationale: Àyíká tọ́ka sí Ọlọ́run Baba, ṣùgbọ́n ẹsẹ̀ Gíríìkì kò lo ọ̀rọ̀ ‘Baba’; nítorí náà a kò fi àlàyé yẹn sínú ọ̀rọ̀ ẹsẹ̀.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹni tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni gbogbogbò, nígbà tí àtúnṣe ‘gbọ́ … gbọ́’ àti ‘kọ̀ … kọ̀’ pa ìṣọ̀kan àti agbára ọ̀rọ̀ orísun mọ́.
