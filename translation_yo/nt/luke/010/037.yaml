source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: yo
  text: Ó sì dáhùn pé, “Ẹni tí ó ṣe àánú sí i.” Jésù sì sọ fún un pé, “Lọ, ìwọ náà sì ṣe bẹ́ẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Ẹni tí ó ṣàánú fún un
  rationale: Ó túmọ̀ ìṣe àánú náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ẹni náà fi àánú hàn sí ọkùnrin náà mọ́.
- source_word: Πορεύου
  choice: Máa lọ
  rationale: Àṣẹ tí ó bá ọ̀rọ̀ Yorùbá mu, tí ó dúró fún ‘lọ’.
- source_word: καὶ σὺ
  choice: kí ìwọ náà sì
  rationale: 'A fi ‘ìwọ’ hàn gbangba láti pa ìtẹnumọ́ orúkọ arọ́pò ἐσύ mọ́: ‘ìwọ náà’.'
- source_word: ποίει ὁμοίως
  choice: máa ṣe bẹ́ẹ̀
  rationale: Ìrísí ‘máa ṣe’ fi àṣẹ ìṣe tí ó yẹ kí ó máa bá a lọ hàn, ‘bẹ́ẹ̀’ sì tọ́ka sí àpẹẹrẹ àánú tí a ṣẹ̀ṣẹ̀ sọ.
theological_decisions:
- issue: Ìtẹnumọ́ ‘ìwọ náà’ nínú àṣẹ Jésù
  choice: kí ìwọ náà sì máa ṣe bẹ́ẹ̀
  alternative: lọ, kí o sì ṣe bẹ́ẹ̀
  rationale: Gíríìkì fi σὺ hàn ní pàtó, nítorí náà a pa ìtẹnumọ́ ẹni tí Jésù ń bá sọ̀rọ̀ mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ó sì dáhùn pé’ ń so ẹsẹ̀ náà mọ́ ìbéèrè tó ṣáájú; ‘Nígbà náà’ mú ìtẹ̀síwájú ìtàn náà ṣe kedere.
