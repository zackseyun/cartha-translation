  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa dá a lóhùn pé, “Mátà, Mátà, ìwọ ń ṣàníyàn, o sì ń dààmú nípa ọ̀pọ̀ nǹkan,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Ṣùgbọ́n ... dá a lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà jẹ́ àṣà ìtàn tí ó túmọ̀ sí pé ẹni náà dá ẹnì kejì lóhùn. Ṣùgbọ́n fi ìyàtọ̀ kékeré sí ẹ̀dùn Mátà hàn, ‘dá a lóhùn pé’ sì jẹ́ Yorùbá àdánidá.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Olúwa jẹ́ akọ́lé Yorùbá tí ó yẹ fún κύριος níbí, ó sì pa ìtumọ̀ ọ̀wọ̀ àti ìtumọ̀ nípa ẹni tí Jésù jẹ́ mọ́.
- source_word: Μάρθα Μάρθα
  choice: Mátà, Mátà
  rationale: A pa pípe orúkọ náà lẹ́ẹ̀mejì mọ́ láti fi ìtẹnumọ́ àti ìfẹ́ inú ọ̀rọ̀ náà hàn.
- source_word: μεριμνᾷς
  choice: ìwọ ń ṣàníyàn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àníyàn inú tàbí ìrònú tí ń da ọkàn láàmú; ‘ń ṣàníyàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ náà mu.
- source_word: θορυβάζῃ
  choice: o sì ń dààmú
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ìdàrúdàpọ̀ tàbí ìyọlẹ́nu ọkàn. ‘Ń dààmú’ yàtọ̀ díẹ̀ sí ‘ń ṣàníyàn,’ ó sì pa ìṣọ̀kan àwọn ọ̀rọ̀ méjèèjì mọ́.
- source_word: περὶ πολλά
  choice: nítorí ohun púpọ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún àwọn ohun púpọ̀ tí àníyàn àti ìdààmú Mátà dá lé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος gẹ́gẹ́ bí akọ́lé fún Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú ìtàn Lúùkù, κύριος ní agbára akọ́lé ọ̀wọ̀, ó sì tún ní ìtumọ̀ nípa ẹni tí Jésù jẹ́. ‘Ọ̀gá’ yóò dín ìró ìtumọ̀ yẹn kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A kò fi àlàyé ìsìn ẹ̀ya kan kún un. Àkọsílẹ̀ ìsàlẹ̀ Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé ó so àmì [a] mọ́ ‘answered her,’ ṣùgbọ́n ọ̀rọ̀ rẹ̀ (‘worried and upset’) jẹ́ àṣàyàn fún μεριμνᾷς καὶ θορυβάζῃ; nítorí pé àwọn àṣàyàn Yorùbá náà kò fi ìtumọ̀ pàtàkì míì hàn ju àkọsílẹ̀ lọ, a kò fi àkọsílẹ̀ ìsàlẹ̀ kún ẹsẹ yìí.
