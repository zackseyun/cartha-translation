  terminology: ‘Olúwa’ yẹ fún ὁ κύριος nínú àyíká Lúùkù. ‘Mátà’ jẹ́ ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Yorùbá. Àwọn ọ̀rọ̀ ‘ṣàníyàn’ àti ‘dààmú’ pa ìyàtọ̀ tó wà láàárín μεριμνᾷς àti θορυβάζῃ mọ́.
