- from: Ṣùgbọ́n Olúwa dá a lóhùn pé, “Mátà, Mátà, ìwọ ń ṣàníyàn, o sì ń dààmú nítorí ohun púpọ̀,”
  to: Ṣùgbọ́n Olúwa dá a lóhùn pé, “Mátà, Mátà, ìwọ ń ṣàníyàn, o sì ń dààmú nípa ọ̀pọ̀ nǹkan,”
  rationale: A rọ́pò ọ̀rọ̀ ìbátan ‘nítorí’ pẹ̀lú ‘nípa’ láti fi περὶ hàn ní tòótọ́, láì yí ìtumọ̀ tàbí ìforúkọsílẹ̀ ẹsẹ náà padà. A kò fi àkọsílẹ̀ ìsàlẹ̀ kún un, nítorí kò sí ìyàtọ̀ ìtumọ̀ pàtàkì nínú Yorùbá tí ó nílò ìdásílẹ̀ nínú ẹsẹ yìí.
