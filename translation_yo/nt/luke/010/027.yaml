id: LUK.10.27
reference: Luke 10:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: yo
  text: Ó sì dáhùn pé, “Kí o nífẹ̀ẹ́ Olúwa Ọlọ́run rẹ pẹ̀lú gbogbo ọkàn rẹ, àti pẹ̀lú gbogbo ẹ̀mí rẹ, àti pẹ̀lú gbogbo agbára rẹ, àti pẹ̀lú gbogbo èrò inú rẹ; kí o sì nífẹ̀ẹ́ ẹnikejì rẹ bí ara rẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó sì dáhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe alábápín pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì náà, láìsí ìpàdánù ìtumọ̀.
- source_word: Ἀγαπήσεις
  choice: Kí ìwọ ó nífẹ̀ẹ́
  rationale: Àkójọpọ̀ ‘kí … ó’ fi agbára àṣẹ tí ọ̀rọ̀-ìṣe ọjọ́ iwájú Gíríìkì ní nínú àyọlò Ìwé Mímọ́ hàn, ó sì jẹ́ Yorùbá àdánidá ju lílo ọjọ́ iwájú tí ó lè dà bí àsọtẹ́lẹ̀ lọ.
- source_word: κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: ‘Olúwa’ jẹ́ oyè Ọlọ́run tó yẹ fún κύριος níbi yìí, ‘Ọlọ́run’ sì túmọ̀ θεός ní tààràtà.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: láti inú gbogbo ọkàn rẹ
  rationale: ‘Láti inú’ pa agbára ἐξ (‘láti inú/jáde láti inú’) mọ́, ó sì yàtọ̀ sí ἐν tí ó wà nínú àwọn gbólóhùn mẹ́ta tó tẹ̀ lé e.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: pẹ̀lú gbogbo ẹ̀mí rẹ
  rationale: ‘Ẹ̀mí’ jẹ́ ọ̀rọ̀ Yorùbá tí a sábà lò fún ψυχή nígbà tí ó ń tọ́ka sí ìwàláàyè tàbí ẹni inú; a kò fi í mú ẹ̀kọ́ nípa bí ènìyàn ṣe pín sí apá kan pàtó múlẹ̀.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: pẹ̀lú gbogbo agbára rẹ
  rationale: ‘Agbára’ fi ìtumọ̀ okun tàbí ipá ἰσχύς hàn ní Yorùbá òde òní.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: pẹ̀lú gbogbo èrò inú rẹ
  rationale: ‘Èrò inú’ sọ ọgbọ́n inú, ìrònú, àti agbára láti ronú tí διάνοια ń tọ́ka sí ní ọ̀nà tí ó ṣe kedere.
- source_word: τὸν πλησίον σου
  choice: ẹnikejì rẹ
  rationale: ‘Ẹnikejì’ jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò fún ẹni mìíràn tí ojúṣe ìfẹ́ kan, kì í sì í fi ìtumọ̀ náà mọ́ ẹni tó ń gbé lẹ́gbẹ̀ẹ́ ilé ẹni nìkan.
- source_word: ὡς σεαυτόν
  choice: bí ara rẹ
  rationale: Èyí pa ìfiwéra ὡς mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ oyè Ọlọ́run κύριος nínú àyọlò òfin
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyọlò tó ń tọ́ka sí Ọlọ́run Ísírẹ́lì, ‘Olúwa’ pa ìwọ̀n ẹ̀sìn àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ìwé Mímọ́ mọ́ ju ‘Ọ̀gá’ lọ.
- issue: 'Àwọn ọ̀rọ̀ nípa ènìyàn: καρδία, ψυχή, ἰσχύς, διάνοια'
  choice: A pa àwọn mẹ́rẹ̀ẹ̀rin mọ́ gẹ́gẹ́ bí ọkàn, ẹ̀mí, agbára, àti èrò inú
  alternative: Kí a kó gbogbo wọn jọ sí ‘gbogbo ara rẹ’ tàbí ‘gbogbo ẹni tí o jẹ́’
  rationale: Àtòjọ náà ń tẹnu mọ́ ìfọkànsìn pátápátá. Pípa ọ̀rọ̀ kọ̀ọ̀kan mọ́ ń dá àwọ̀n àsọyé náà sí, láìfi èrò pé ènìyàn ní àwọn apá mẹ́rin tí a lè yà sọ́tọ̀ lé e lórí.
- issue: Ìyàtọ̀ láàárín ἐξ nínú gbólóhùn àkọ́kọ́ àti ἐν nínú àwọn tó tẹ̀ lé e
  choice: láti inú …; pẹ̀lú …
  alternative: pẹ̀lú … nínú gbogbo gbólóhùn mẹ́rẹ̀ẹ̀rin
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ ọ̀rọ̀ ìsopọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àṣà ìtumọ̀ sábà máa ń sọ gbogbo wọn ní ọ̀nà kan náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi gbogbo tí ó bá yẹ. Àtẹ̀jáde náà pa ìró àṣẹ Ìwé Mímọ́ mọ́ nípasẹ̀ ‘Kí … ó,’ ó sì tún ọ̀rọ̀-ìṣe ‘nífẹ̀ẹ́’ sọ ní apá kejì kí gbólóhùn náà lè mọ́ ní Yorùbá.
