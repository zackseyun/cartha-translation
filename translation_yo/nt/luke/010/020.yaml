id: LUK.10.20
reference: Luke 10:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: yo
  text: 'Síbẹ̀, ẹ má ṣe yọ̀ nítorí èyí: pé àwọn ẹ̀mí ń tẹríba fún yín,[a] ṣùgbọ́n ẹ yọ̀ pé a ti kọ orúkọ yín sílẹ̀ ní àwọn ọ̀run.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àyíká ọ̀rọ̀ fi hàn pé àwọn ẹ̀mí ọ̀tá ni; a tún lè túmọ̀ rẹ̀ sí “àwọn ẹ̀mí búburú” tàbí “àwọn ẹ̀mí èṣù,” bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ “àwọn ẹ̀mí” lásán. “Ń tẹríba fún yín” tún lè jẹ́ “wà lábẹ́ àṣẹ yín.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní ọ̀nà ìbílẹ̀, “ní ọ̀run.” Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó fi àtúnṣe alágbára sí ayọ̀ àwọn ọmọ-ẹ̀yìn hàn, ó sì bá ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: ἐν τούτῳ
  choice: nítorí èyí
  rationale: Nínú Yorùbá, èyí jẹ́ ọ̀nà àdánidá láti sọ ohun tí ayọ̀ náà dá lé, nígbà tí ó ṣì pa ìtọ́kasí demonstrative mọ́.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: ẹ má ṣe yọ̀ ... ṣùgbọ́n ẹ yọ̀
  rationale: Àtúnlò ọ̀rọ̀-ìṣe kan náà pa ìfarawé àti ìyàtọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὰ πνεύματα
  choice: àwọn ẹ̀mí
  rationale: Ó pa ìtumọ̀ gbooro πνεύματα mọ́; àyíká ọ̀rọ̀ fi hàn pé ẹ̀mí ọ̀tá ni, ṣùgbọ́n a kò fi ‘ẹ̀mí búburú’ tàbí ‘àwọn ẹ̀mí èṣù’ sínú ọ̀rọ̀ pàtàkì.
- source_word: ὑμῖν ὑποτάσσεται
  choice: ń tẹríba fún yín
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ jíjẹ́ lábẹ́ àṣẹ wọn ní kedere, ó sì bójú mu present passive/middle náà.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: orúkọ yín
  rationale: Èyí ni ìṣọ̀kan Yorùbá tí ó wọ́pọ̀ fún orúkọ ọ̀kọ̀ọ̀kan àwọn ènìyàn púpọ̀; ó jẹ́ àdánidá ju ‘àwọn orúkọ yín’ lọ.
- source_word: ἐγγέγραπται
  choice: a ti kọ ... sílẹ̀
  rationale: Àmì ‘ti’ àti ‘sílẹ̀’ fi iṣẹ́ tí a ti ṣe tí àbájáde rẹ̀ ṣì dúró hàn, gẹ́gẹ́ bí perfect passive.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: Ó pa plural Gíríìkì mọ́ láì sọ ọ́ di singular ‘ní ọ̀run’.
theological_decisions:
- issue: Ibi tí a kọ orúkọ náà sí
  choice: ní àwọn ọ̀run
  alternative: ní ọ̀run
  rationale: A pa plural οὐρανοῖς mọ́, dípò kí a sọ ọ́ di singular ìbílẹ̀; kò fi ẹ̀kọ́ nípa iye tàbí ìpele ọ̀run kún ọ̀rọ̀ náà.
- issue: Irú àwọn ẹ̀mí náà
  choice: àwọn ẹ̀mí
  alternative: àwọn ẹ̀mí búburú / àwọn ẹ̀mí èṣù
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí àwọn ẹ̀dá ẹ̀mí ọ̀tá, ṣùgbọ́n πνεύματα fúnra rẹ̀ kò ní àpèjúwe ‘búburú’; a pa àìdánilójú lexical náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ohùn náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ/yín’ fún àwọn ẹni púpọ̀, gẹ́gẹ́ bí ὑμεῖς ṣe béèrè.
