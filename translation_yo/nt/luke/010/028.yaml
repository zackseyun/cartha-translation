  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “O dáhùn dáadáa. Máa ṣe èyí[a], ìwọ yóò sì yè.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní àsìkò ìsinsìnyí; ó lè fi hàn pé kí a máa ṣe èyí ní ìgbà gbogbo tàbí kí a tẹ̀síwájú nínú rẹ̀.
    reason: verbal_aspect
  - marker: b
    text: Àyíká ọ̀rọ̀ tó gbòòrò ń sọ nípa ìyè àìnípẹ̀kun (wo Lúùkù 10:25), ṣùgbọ́n èdè Gíríìkì níbí kàn sọ pé, “ìwọ yóò yè.”
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ó sì sọ fún un pé
  rationale: ‘Ó sọ fún un’ túmọ̀ ọ̀rọ̀-ìṣe àti ẹni tí a bá sọ̀rọ̀ ní ti ẹ̀dá; ‘sì’ jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò fi ìtakora tàbí ìtẹ̀lé ìṣẹ̀lẹ̀ tí ó lágbára kún un.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Ìwọ dáhùn lọ́nà tí ó tọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ìdáhùn rẹ̀ péye tàbí tọ́; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìgbéyẹ̀wò ìdáhùn náà mọ́.
- source_word: τοῦτο ποίει
  choice: Máa ṣe èyí
  rationale: ‘Èyí’ tọ́ka padà sí àṣẹ tí a ṣẹ̀ṣẹ̀ sọ; ‘máa ṣe’ fi agbára ìlànà ìsinsìnyí hàn, èyí tí ó lè túmọ̀ sí ìṣe tí a ń bá a lọ.
- source_word: καὶ ζήσῃ
  choice: ìwọ yóò sì yè
  rationale: ‘Yè’ túmọ̀ ζάω ní tààrà gẹ́gẹ́ bí ‘wà láàyè/live,’ láìfi ‘jogún ìyè àìnípẹ̀kun’ kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtúmọ̀ bí ‘yè’ ṣe gbòòrò sí nínú àyíká ọ̀rọ̀ nípa ìyè àìnípẹ̀kun
  choice: ìwọ yóò sì yè
  alternative: ìwọ yóò jogún ìyè àìnípẹ̀kun
  rationale: Àyíká ẹsẹ 25 dá lórí jíjogún ìyè àìnípẹ̀kun, ṣùgbọ́n gbólóhùn Gíríìkì níbí sọ pé ‘ìwọ yóò yè’ lásán. Ìtumọ̀ pàtàkì náà ni a fi sí àkọsílẹ̀ ìsàlẹ̀ dípò fífi ọ̀rọ̀ tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A yan ‘dáhùn lọ́nà tí ó tọ́’ fún ìtumọ̀ tí ó ṣe kedere; ‘máa ṣe èyí’ pa agbára ìlànà tí ó lè máa bá a lọ mọ́; ‘yè’ sì yẹra fún ṣíṣàlàyé ẹ̀kọ́ ìgbàgbọ́ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
