id: LUK.10.4
reference: Luke 10:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: yo
  text: Ẹ má ṣe gbé àpò owó, àpò ìrìn-àjò[b], tàbí bàtà; ẹ má sì kí ẹnikẹ́ni ní ojú ọ̀nà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èrò àṣẹ yìí kò dà bí ẹni pé ó ka ìwà rere ìkíni sí ohun tí kò tọ́. Ó ṣeé ṣe kó ń tẹnumọ́ ìkánjú iṣẹ́ náà, nítorí ìkíni ní àṣà ìgbà yẹn lè gba àkókò púpọ̀.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ “àpò ìrìn-àjò” sí “àpò ẹrù kékeré” tàbí “àpò” lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζετε
  choice: gbé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti gbé tàbí ru ohun kan. “Gbé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere nínú àṣẹ nípa ohun èlò ìrìn-àjò.
- source_word: βαλλάντιον
  choice: àpò owó
  rationale: Ó ń tọ́ka sí àpò tí a fi ń kó owó; “àpò owó” jẹ́ ọ̀rọ̀ tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: πήραν
  choice: àpò ìrìn-àjò
  rationale: Ó jẹ́ àpò fún ohun èlò tàbí oúnjẹ tí arìnrìn-àjò ń mú lọ. “Àpò ìrìn-àjò” sọ iṣẹ́ rẹ̀ di mímọ̀ ní Yorùbá òde òní.
- source_word: ὑποδήματα
  choice: bàtà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a wọ̀ sí ẹsẹ̀, ó sì lè jẹ́ bàtà aláwọ̀ ìgbàanì. “Bàtà” bó ìtumọ̀ náà mu láì fi irú bàtà kan tí ọ̀rọ̀ náà kò fi dandan hàn kún un.
- source_word: μηδένα
  choice: ẹnikẹ́ni
  rationale: Nínú gbólóhùn ìkọ̀wọ̀n yìí, “ẹnikẹ́ni” pẹ̀lú “má” túmọ̀ sí pé kí wọ́n má kí ẹnikẹ́ni rárá.
- source_word: κατὰ τὴν ὁδόν
  choice: ní ojú ọ̀nà
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tó ṣẹlẹ̀ nígbà tí ènìyàn ń rìnrìn-àjò lọ.
- source_word: ἀσπάσησθε
  choice: kí
  rationale: “Kí” ni ọ̀rọ̀ Yorùbá tó bá ìṣe pípàdé ẹlòmíràn, kí a sì ṣe ìkíni fún un, mu jù lọ.
theological_decisions:
- issue: Agbára àṣẹ pé kí wọ́n má kí ẹnikẹ́ni ní ojú ọ̀nà
  choice: 'A pa á mọ́ gẹ́gẹ́ bí àṣẹ tààrà: “ẹ má sì kí ẹnikẹ́ni ní ojú ọ̀nà.”'
  alternative: “Ẹ má ṣe jẹ́ kí ìkíni dá yín dúró ní ọ̀nà.”
  rationale: Gíríìkì sọ ọ́ gẹ́gẹ́ bí àṣẹ tààrà. A kò rọ agbára rẹ̀ nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé àṣà tó ṣeé ṣe wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní àmì ohùn níbi tó yẹ. Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn, nítorí náà a lo “Ẹ má ṣe.” A fi àmì àlàyé [a] mọ́ gbolohun ìkíni, a sì fi [b] mọ́ “àpò ìrìn-àjò,” kí àmì kọ̀ọ̀kan bá àlàyé rẹ̀ mu.
