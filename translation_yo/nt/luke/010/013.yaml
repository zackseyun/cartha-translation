language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: yo
  text: “Ègbé ni fún ọ, Kórásínì! Ègbé ni fún ọ, Bẹtisáídà! Nítorí pé, bí àwọn iṣẹ́ agbára[a] tí ó ṣẹlẹ̀ láàárín yín bá ṣẹlẹ̀ ní Tírè àti Sídónì, tipẹ́tipẹ́ ni wọ́n ìbá ti ronúpìwàdà[b], bí wọ́n ṣe jókòó nínú aṣọ ọ̀fọ̀ àti eérú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ ìyanu”; Gíríìkì náà lè túmọ̀ sí “àwọn iṣẹ́ agbára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ìbá ti yí èrò àti ìwà wọn padà tipẹ́tipẹ́, bí wọ́n ṣe jókòó nínú aṣọ ọ̀fọ̀ àti eérú.”
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ègbé ni fún ọ
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àti ìkìlọ̀ àsọtẹ́lẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún àdírẹ́sì tààrà.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Kórásínì / Bẹtisáídà / Tírè / Sídónì
  rationale: A kọ àwọn orúkọ ibi náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tí ó ṣeé kà ní Yorùbá.
- source_word: δυνάμεις
  choice: àwọn iṣẹ́ agbára
  rationale: Ó mú ìtumọ̀ iṣẹ́ tí agbára ń bẹ nínú rẹ̀ jáde láì sọ ọ́ di ọ̀rọ̀ ìtumọ̀ tó dín kù sí ‘iṣẹ́ ìyanu’ nìkan.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: ti ṣẹlẹ̀ ... tí ó ṣẹlẹ̀
  rationale: ‘Ṣẹlẹ̀’ tẹ̀ lé ìtumọ̀ γίνομαι gẹ́gẹ́ bí ohun tí ó wáyé, dípò fífi aṣeyọrí olùṣe kan sí i.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó fi hàn pé àwọn iṣẹ́ náà ṣẹlẹ̀ ní àárín àwọn ènìyàn ìlú wọ̀nyí, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: πάλαι
  choice: tipẹ́tipẹ́
  rationale: Ó sọ àkókò pípẹ́ sẹ́yìn di mímọ̀ ní ọ̀nà Yorùbá tó ṣeé lóye.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: nínú aṣọ ọ̀fọ̀ àti eérú
  rationale: ‘Aṣọ ọ̀fọ̀’ ṣàlàyé iṣẹ́ sackcloth fún òǹkàwé òde òní, nígbà tí ‘eérú’ pa àwòrán ìrònúpìwàdà àti ọ̀fọ̀ mọ́.
- source_word: καθήμενοι
  choice: tí wọn jókòó
  rationale: Ó pa ìdúró ara tí participle Gíríìkì yà sílẹ̀ mọ́.
- source_word: μετενόησαν
  choice: wọn ìbá ti ronúpìwàdà
  rationale: ‘Ronúpìwàdà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún yíyí ọkàn àti ìwà padà; ‘ìbá ti’ sì pa ọ̀rọ̀ àròsọ òdì-sí-ohun-tó-ṣẹlẹ̀ mọ́.
theological_decisions:
- issue: Ìwà àwọn δυνάμεις nínú iṣẹ́ Jesu
  choice: àwọn iṣẹ́ agbára
  alternative: àwọn iṣẹ́ ìyanu
  rationale: Yíyan yìí pa ìtumọ̀ iṣẹ́ àti agbára méjèèjì mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ Gíríìkì.
- issue: Àwòrán ìrònúpìwàdà
  choice: Pa ‘tí wọn jókòó nínú aṣọ ọ̀fọ̀ àti eérú’ mọ́ nínú ẹsẹ̀ náà
  alternative: wọn ìbá ti fi ọ̀fọ̀ hàn pé wọn ronúpìwàdà
  rationale: Ọ̀rọ̀ Gíríìkì ní àwòrán gidi ti jíjókòó pẹ̀lú aṣọ ọ̀fọ̀ àti eérú; pípa rẹ̀ mọ́ kò jẹ́ kí a sọ ọ́ di àlàyé lásán.
- issue: Ọ̀rọ̀ àròsọ nípa Tírè àti Sídónì
  choice: ká ní ... wọn ìbá ti
  alternative: bí ... bá ... wọn yóò ti
  rationale: Ìṣètò yìí fi kedere hàn ní Yorùbá pé Jesu ń sọ ohun tí kò ṣẹlẹ̀ ní tòótọ́ àti èsì tí ìbá tẹ̀ lé e, láì pinnu ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó ní iyì, tó bójú mu fún kíkà ní gbangba, tí ó sì ní àmì ohùn níbi tí ó ti yẹ. ‘Ká ní ... ìbá ti’ ni a lò láti mú àròsọ òdì-sí-ohun-tó-ṣẹlẹ̀ jáde lọ́nà àdánidá; ‘aṣọ ọ̀fọ̀’ ń jẹ́ kí àṣà sackcloth yé òǹkàwé òde òní láì pa àwòrán ọ̀rọ̀ náà rẹ́.
