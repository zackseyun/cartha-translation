id: LUK.10.9
reference: Luke 10:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: yo
  text: Ẹ sì máa wo àwọn aláìsàn tó wà níbẹ̀ sàn, kí ẹ sì sọ fún wọn pé, ‘Ìjọba Ọlọ́run ti sún mọ́ yín.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: máa wo ... sàn
  rationale: Ọ̀rọ̀ ìṣe àṣẹ ti àkókò ìsinsìnyí ń tọ́ka sí iṣẹ́ tí wọ́n gbọdọ̀ máa ṣe. ‘Wo ... sàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n mú àwọn aláìsàn lára dá.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: àwọn aláìsàn inú rẹ̀
  rationale: Ní ìbámu pẹ̀lú θεραπεύετε, ἀσθενεῖς túmọ̀ sí àwọn tí ara wọn kò dá níbí; ‘inú rẹ̀’ ń tọ́ka padà sí ìlú tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: λέγετε αὐτοῖς
  choice: sọ fún wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì taara fún àṣẹ láti bá wọn sọ̀rọ̀.
- source_word: Ἤγγικεν
  choice: ti sún mọ́
  rationale: Ìṣe pípé Gíríìkì fi ìsúnmọ́ tí ó ti ṣẹlẹ̀, tí ó sì ní ìtumọ̀ lọ́wọ́lọ́wọ́ hàn. ‘Ti sún mọ́’ pa apá méjèèjì yìí mọ́ láì sọ pé ó ti dé ní kíkún.
- source_word: ἐφ’ ὑμᾶς
  choice: yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ‘sún mọ́,’ fífi ‘yín’ ṣe àfikún jẹ́ Yorùbá àdánidá fún ìsúnmọ́ sí àwọn olùgbọ́.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Bíbélì tó wọ́pọ̀, tó sì pa ìtumọ̀ ìjọba àti ìṣàkóso Ọlọ́run mọ́ láì dín ọ̀pọ̀ ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Ìtumọ̀ ìkéde nípa Ìjọba Ọlọ́run
  choice: Ìjọba Ọlọ́run ‘ti sún mọ́’ àwọn olùgbọ́.
  alternative: Ìjọba náà ti dé ní kíkún nísinsìnyí, tàbí ó ṣì jẹ́ ti ọjọ́ iwájú nìkan.
  rationale: Ìṣe pípé ἤγγικεν fi ìsúnmọ́ àti ìwúlò lọ́wọ́lọ́wọ́ hàn, ṣùgbọ́n ẹsẹ náà kò pinnu bóyá ìjọba náà ti dé ní kíkún tàbí pé gbogbo ìmúṣẹ rẹ̀ ṣì ń bọ̀. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Máa wo ... sàn’ ń fi àṣẹ iṣẹ́ tí ń bá a lọ hàn.
