id: LUK.10.7
reference: Luke 10:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: yo
  text: Ẹ dúró ní ilé yẹn kan náà, kí ẹ máa jẹ, kí ẹ sì máa mu ohun tí wọ́n bá pèsè, nítorí òṣìṣẹ́ yẹ fún owó iṣẹ́ rẹ̀.[a] Ẹ má ṣe máa kúrò ní ilé kan lọ sí òmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “owó iṣẹ́ tí ó tọ́ sí i.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún τοῦ μισθοῦ αὐτοῦ tí ó mú èrò ohun tí ó tọ́ sí òṣìṣẹ́ jáde síwájú.
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: ní ilé yẹn kan náà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ilé tí ó ti gba àwọn ọmọ-ẹ̀yìn, ó sì tẹnu mọ́ pé kí wọ́n dúró sí ibì kan náà.
- source_word: μένετε
  choice: Ẹ dúró
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì ń béèrè pé kí wọ́n máa bá a lọ ní dídúró níbẹ̀.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: kí ẹ máa jẹ, kí ẹ sì máa mu
  rationale: Ìtumọ̀ yìí fi hàn pé jíjẹ àti mímu ń bá dídúró wọn lọ ní àkókò kan náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὰ παρ’ αὐτῶν
  choice: ohun tí wọ́n bá pèsè
  rationale: Àpólà náà túmọ̀ sí ohun tí àwọn olùgbàlejò fi fún wọn; ‘pèsè’ sọ èyí ní kedere láìfi ọ̀rọ̀ míì kún orísun.
- source_word: ἄξιος γὰρ ὁ ἐργάτης
  choice: nítorí òṣìṣẹ́ yẹ
  rationale: ‘Òṣìṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń ṣiṣẹ́, ‘yẹ’ sì pa èrò ἄξιος mọ́ gẹ́gẹ́ bí ìdí fún gbígba àlejò.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: fún owó iṣẹ́ rẹ̀
  rationale: Ní àyíká yìí μισθός jẹ́ ìsanwó fún iṣẹ́; ‘owó iṣẹ́’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ‘rẹ̀’ sì pa ẹyọ akọ inú Gíríìkì mọ́ láìsọ pé olùgbàlejò fúnra rẹ̀ ni ó san án.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Ẹ má ṣe máa kúrò ní ilé kan lọ sí òmíràn
  rationale: Èyí jẹ́ ìkìlọ̀ pé kí wọ́n má ṣe yí ibùgbé wọn padà láti agbo ilé kan sí òmíràn; ọ̀rọ̀ Yorùbá náà jẹ́ àdánidá, ó sì pa àṣẹ náà mọ́.
theological_decisions:
- issue: Ẹyọ akọ nínú τοῦ μισθοῦ αὐτοῦ
  choice: owó iṣẹ́ rẹ̀
  alternative: owó iṣẹ́ wọn
  rationale: Gíríìkì lo arọ́pò-orúkọ ẹyọ akọ tí ó bá ὁ ἐργάτης mu. Yorùbá ‘rẹ̀’ kì í fi akọ tàbí abo hàn, ṣùgbọ́n ó pa ẹyọ ọ̀rọ̀ orísun mọ́, kò sì sọ ọ́ di ọ̀pọ̀.
- issue: Ìbáṣepọ̀ láàárín iṣẹ́ àti ìsanwó
  choice: òṣìṣẹ́ yẹ fún owó iṣẹ́ rẹ̀
  alternative: ó yẹ kí òṣìṣẹ́ gba owó iṣẹ́ tí ó tọ́ sí i
  rationale: Àṣàyàn àkọ́kọ́ pa ìṣètò àti agbára ἄξιος ... τοῦ μισθοῦ mọ́, láìṣàlàyé ju ohun tí orísun sọ lọ tàbí yí i padà sí ẹ̀kọ́ ẹ̀sìn kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; a lo ‘Ẹ’ nítorí àwọn àṣẹ Gíríìkì jẹ́ ọ̀pọ̀ ènìyàn.
