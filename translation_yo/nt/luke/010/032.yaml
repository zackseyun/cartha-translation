  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ọmọ Lefi kan dé ibi náà; nígbà tí ó rí i, ó kọjá lọ ní ìhà kejì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó kọjá lọ.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí pé ó mọ̀ọ́mọ̀ gba ìhà kejì láti yẹra fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ìṣe ọmọ Lefi pọ̀ mọ́ ti àlùfáà nínú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfiwéra.
- source_word: δὲ καὶ
  choice: ọmọ Lefi kan
  rationale: A kò túmọ̀ δέ lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ pẹ̀lẹ́; ìtumọ̀ àfikún καί wà nínú ìṣàn gbólóhùn ‘Bẹ́ẹ̀ náà ni ... kan,’ tó fi ẹni kejì kún àpẹẹrẹ àkọ́kọ́.
- source_word: Λευίτης
  choice: ọmọ Lefi
  rationale: Èyí pa ìdánimọ̀ ẹgbẹ́ ìtàn àti ẹ̀sìn náà mọ́ láì sọ ọ́ di akọ́ṣẹ́mọṣẹ́ tẹ́ńpìlì tàbí fi àlàyé kún un.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: dé ibi náà
  rationale: Ó fi hàn pé ó dé ibi ìṣẹ̀lẹ̀ náà; ‘dé’ jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ participle aorist náà.
- source_word: ἰδὼν
  choice: nígbà tí ó rí i
  rationale: Ó fi ìtẹ̀lé àkókò hàn, ó sì mú ẹni tí ó rí láti inú àyíká ọ̀rọ̀ wá láì ṣàfikún ìtumọ̀ tuntun.
- source_word: ἀντιπαρῆλθεν
  choice: ó kọjá lọ ní òdìkejì
  rationale: Ọ̀rọ̀ àkópọ̀ náà ju ‘kọjá lọ’ lásán lọ, ó sì tọ́ka sí lílọ kọjá ní apá kejì bí ìyẹra.
theological_decisions:
- issue: Ìdánimọ̀ Λευίτης nípa àwùjọ àti ẹ̀sìn
  choice: ọmọ Lefi
  alternative: ìránṣẹ́ tẹ́ńpìlì; ẹni láti ẹ̀yà Lefi
  rationale: ‘Ọmọ Lefi’ jẹ́ orúkọ ẹgbẹ́ tí a mọ̀ nínú ìtàn àwọn Júù, ó sì pa ìfararora rẹ̀ mọ́ pẹ̀lú àlùfáà nínú ìtàn náà láì mú iṣẹ́ kan pàtó wọ inú ẹsẹ.
- issue: Agbára ìtumọ̀ ἀντιπαρῆλθεν
  choice: ó kọjá lọ ní òdìkejì
  alternative: ó kọjá lọ
  rationale: A pa àbá ìyẹra tó wà nínú ọ̀rọ̀ àkópọ̀ Gíríìkì mọ́, ṣùgbọ́n a kò fi ìdí ọkàn ẹni náà múlẹ̀ ju ohun tí ọ̀rọ̀ náà lè gbé lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. ‘Ọmọ Lefi’ pa ìdánimọ̀ ìtàn mọ́; ‘ní òdìkejì’ sì gbé agbára ọ̀rọ̀ Gíríìkì jáde láì ṣàlàyé èrò inú ẹni náà ju bó ṣe yẹ lọ.
