  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: yo
  text: Nípa rírọ̀ wọ́n pẹ̀lú ọ̀pọ̀ ohun mìíràn[a], ó ń kéde ìhìn rere fún àwọn ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípa rírọ̀ wọ́n pẹ̀lú ọ̀pọ̀ ohun mìíràn.” Gíríìkì kò sọ ohun tí “ọ̀pọ̀” ń tọ́ka sí ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ọ̀rọ̀ ajẹtífù aláìlábùkù tó dúró gẹ́gẹ́ bí orúkọ ni; ó tọ́ka sí ọ̀pọ̀ ohun tàbí ọ̀rọ̀ tí Johanu sọ, láìfi ohun tí ó ń ṣàpèjúwe hàn gbangba.
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Ó ń so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì ń fi ìtẹ̀síwájú tàbí àbájáde ọ̀rọ̀ hàn láìtú àwọn patíkù náà ju bó ṣe yẹ lọ.
- source_word: καὶ ἕτερα
  choice: mìíràn pẹ̀lú
  rationale: Ó túmọ̀ sí àwọn ohun àfikún tàbí ohun mìíràn; àkójọpọ̀ yìí pa ìtumọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: παρακαλῶν
  choice: pẹ̀lú ... ọ̀rọ̀ ìṣírí
  rationale: Nínú iṣẹ́ ìwàásù Johanu, ọ̀rọ̀ náà ní agbára ìrọ̀, ìkìlọ̀ àti ìṣírí. ‘Ọ̀rọ̀ ìṣírí’ jẹ́ èdè Yorùbá tí ó bójú mu, bí ó tilẹ̀ jẹ́ pé ó lè tún túmọ̀ sí pé ó ń rọ̀ wọ́n.
- source_word: εὐηγγελίζετο
  choice: ó ń kéde ìhìn rere
  rationale: Fọ́ọ̀mù imperfect náà fi ìṣe tó ń lọ ní àkókò àtijọ́ hàn; ‘ó ń kéde ìhìn rere’ pa ìṣe tẹ̀síwájú àti ìtumọ̀ ìkéde ìhìn rere mọ́.
- source_word: τὸν λαόν
  choice: fún àwọn ènìyàn
  rationale: Ó tọ́ka sí àwọn ènìyàn tí Johanu ń bá sọ̀rọ̀; a kò fi ‘Israẹli’ tàbí ‘ogunlọ́gọ̀’ kún un nítorí pé ẹsẹ̀ náà kò sọ bẹ́ẹ̀ ní tààrà.
theological_decisions:
- issue: Agbára εὐηγγελίζετο nínú iṣẹ́ Johanu
  choice: ó ń kéde ìhìn rere
  alternative: ó ń wàásù; ó ń kéde
  rationale: Gíríìkì fúnra rẹ̀ ṣàpèjúwe ìwàásù oníṣírí Johanu gẹ́gẹ́ bí ìkéde ìhìn rere. Ìtumọ̀ náà pa ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìsọ ọ́ di ìwàásù lásán.
- issue: Ohun tí Πολλὰ ń tọ́ka sí
  choice: ọ̀pọ̀lọpọ̀ ọ̀rọ̀ ìṣírí
  alternative: ọ̀pọ̀lọpọ̀ ohun mìíràn ni ó fi ń rọ̀ wọ́n
  rationale: Gíríìkì fi ohun tí Πολλὰ ń ṣàpèjúwe sílẹ̀ láìsọ ọ́. Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa àìdánilójú gidi inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. A yan ‘ìhìn rere’ gẹ́gẹ́ bí gbólóhùn tó wọ́pọ̀, tó sì bójú mu fún εὐαγγελίζω; a sì fi àmì ohùn sí ibi tí ó yẹ.
