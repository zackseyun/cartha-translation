  - severity: low
    issue: A tún “pẹ̀lú” ṣe lẹ́ẹ̀mejì nínú “pẹ̀lú ... mìíràn pẹ̀lú.”
    rationale: Àtúnlò yìí kò jẹ́ àṣìṣe gírámà pátápátá, ṣùgbọ́n ó mú gbolohun náà wuwo, kò sì dára bí ìtumọ̀ Yorùbá òde òní.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ náà lo “ohun” níbi tí gbolohun àkọ́kọ́ ti lo “ọ̀rọ̀ ìṣírí.”
    rationale: Ìyàtọ̀ náà lè dá òǹkàwé lójú. Kí ìtumọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀ bá ara wọn mu, kí wọ́n sì pa àìsọ ohun tí Πολλὰ ń ṣàpèjúwe mọ́.
