revisions:
- from: Nítorí náà, pẹ̀lú ọ̀pọ̀lọpọ̀ ọ̀rọ̀ ìṣírí mìíràn pẹ̀lú[a], ó ń kéde ìhìn rere fún àwọn ènìyàn.
  to: Nípa rírọ̀ wọ́n pẹ̀lú ọ̀pọ̀ ohun mìíràn[a], ó ń kéde ìhìn rere fún àwọn ènìyàn.
  rationale: A yọ ìtúmọ̀ ìdí tó lágbára nínú “Nítorí náà” kúrò, nítorí μὲν οὖν jẹ́ àmì ìtẹ̀síwájú ọ̀rọ̀ níbí. A rọ́pò “ọ̀rọ̀ ìṣírí” pẹ̀lú “rírọ̀ wọ́n,” èyí tó gba ìtumọ̀ παρακαλῶν tó gbòòrò síi, a sì lo “ọ̀pọ̀ ohun mìíràn” láti pa ohun tí Greek fi sílẹ̀ láìsọ mọ́. Àmì ìsàlẹ̀ náà ń pèsè ọ̀nà ìtúmọ̀ mìíràn láìfi ìtumọ̀ kan pàṣẹ.
