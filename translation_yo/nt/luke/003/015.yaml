id: LUK.3.15
reference: Luke 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: yo
  text: Bí àwọn ènìyàn ṣe ń fi ìrètí dúró, tí gbogbo wọn sì ń rò nínú ọkàn wọn nípa Jòhánù pé bóyá òun ni Mèsáyà[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Kristi.” Ní èdè Gíríìkì: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: ṣe ń fi ìrètí dúró
  rationale: Ó mú ìṣe tí ó ń bá a lọ àti ìdúró pẹ̀lú ìfojúsọ́nà jáde ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakò líle hàn; “sì” so gbólóhùn náà mọ́ ohun tó ṣáájú láìfi ọ̀rọ̀ bí “nísinsìnyí” kún un.
- source_word: λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó túmọ̀ λαός gẹ́gẹ́ bí àpapọ̀ àwọn ènìyàn, kì í ṣe ogunlọ́gọ̀ lásán.
- source_word: διαλογιζομένων
  choice: ń rò
  rationale: Ó ṣàfihàn ìrònú àti ìgbèrò inú; àfikún “nínú ọkàn wọn” mú ìtumọ̀ inú rẹ̀ hàn kedere.
- source_word: πάντων
  choice: gbogbo wọn
  rationale: Ó pa ìtumọ̀ àkópọ̀ πάντων mọ́, ó sì tọ́ka sí àwọn ènìyàn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: nínú ọkàn wọn
  rationale: Ìtumọ̀ tààrà yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ààyè ọkàn gẹ́gẹ́ bí ibùdó ìrònú inú mọ́.
- source_word: περὶ τοῦ Ἰωάννου
  choice: nípa Jòhánù
  rationale: “Nípa” ni ìtumọ̀ Yorùbá tó ṣe déédé fún περί pẹ̀lú ọ̀rọ̀ orúkọ ní irú àyíká yìí.
- source_word: μήποτε
  choice: pé bóyá
  rationale: Ó pa ìbéèrè inú àti àìdánilójú μήποτε mọ́.
- source_word: εἴη
  choice: òun ni
  rationale: Nínú àkópọ̀ “pé bóyá òun ni,” bóyá ló gbé agbára optative ti ṣíṣeéṣe àti àìdánilójú; “òun” tún tẹ ẹni tí wọ́n ń ronú nípa rẹ̀ mọ́lẹ̀.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí ó jẹ́ oyè ẹni àmì-ọ̀ràn tí àwọn ènìyàn ń retí, nítorí náà “Mèsáyà” pa àyíká Júù àti iṣẹ́ oyè náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì-ọ̀ràn tí àwọn ènìyàn ń retí, kì í ṣe bí orúkọ tí ó ti fẹ́rẹ̀ẹ́ di ti ara ẹni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye; a lo àmì ohùn níbi tó bá yẹ. Gbólóhùn náà pa ìṣàn gírámà tó ń tẹ̀ sí ẹsẹ tó tẹ̀ lé e mọ́, gẹ́gẹ́ bí orísun Gíríìkì.
