  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ó pa genitive absolute tó ń ṣètò ìṣẹ̀lẹ̀ náà mọ́, ìfojúsọ́nà nínú προσδοκῶντος, ìrònú inú nínú διαλογιζομένων, àti àìdánilójú μήποτε pẹlu optative εἴη. “Pé bóyá òun ni” ń ṣàfihàn ìbéèrè inú tí kò dájú náà ní ti ẹ̀dá Yorùbá.'
  naturalness: “Bí àwọn ènìyàn ṣe ń fi ìrètí dúró” jẹ́ ọ̀nà Yorùbá boṣewa, tí ó mọgbọ́n dáradára fún ‘as the people were waiting expectantly.’ “Tí gbogbo wọn sì ń rò nínú ọkàn wọn” jẹ́ àdánidá, ó sì yẹ fún ìforúkọsílẹ̀ Bíbélì. Lílò “ọkàn wọn” ní ẹyọ jẹ́ ìlò pínpín ẹni-kọọkan tí ó wọ́pọ̀ nínú Yorùbá, láìpadanu ìtumọ̀ plural Gíríìkì.
