source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: yo
  text: Ní àkókò ipò àlùfáà àgbà ti Ánásì àti Káyáfà[a], ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ Jòhánù, ọmọ Sekaráyà, ní aginjù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, “ipò àlùfáà àgbà” wà ní ẹyọ kan, bí ó tilẹ̀ jẹ́ pé Lúùkù dárúkọ Ánásì àti Káyáfà méjèèjì.
    reason: translation_note
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: Ní àkókò ipò àlùfáà àgbà ti Ánásì àti Káyáfà
  rationale: ἐπί pẹ̀lú ọ̀rọ̀-orúkọ inú genitive níbí ń tọ́ka sí àkókò. Gbólóhùn yìí jẹ́ Yorùbá tó ṣeé lóye, ó sì pa ‘ipò àlùfáà àgbà’ mọ́ ní ẹyọ kan bí ἀρχιερέως, bó tilẹ̀ jẹ́ pé Lúùkù dárúkọ ọkùnrin méjì.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run dé
  rationale: Èyí mú àṣà ọ̀rọ̀ àsọtẹ́lẹ̀ inú Ìwé Mímọ́ jáde lọ́nà àdánidá ní Yorùbá. ‘Dé’ fi hàn pé ìfihàn náà ṣẹlẹ̀, láì tú ἐγένετο ní ọ̀nà líle gẹ́gẹ́ bí ‘ṣẹlẹ̀.’
- source_word: ἐπὶ Ἰωάννην
  choice: ọ̀dọ̀ Jòhánù
  rationale: Pẹ̀lú ‘dé,’ ọ̀rọ̀ náà fi ìtọ́sọ́nà sí ẹni tí ìfihàn náà dé bá hàn lọ́nà Yorùbá tó wọ́pọ̀; ó bá ìtumọ̀ ἐπί pẹ̀lú accusative mu.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: ọmọ Sekaráyà
  rationale: Àfikún yìí ń dá Jòhánù yìí mọ̀ nípasẹ̀ baba rẹ̀. Ọ̀nà yìí jẹ́ kedere, ó sì bójú mu ní Yorùbá.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ lè tọ́ka sí ilẹ̀ tí ènìyàn kò pọ̀ sí, kì í ṣe aṣálẹ̀ oníyanrìn nìkan; nítorí náà, ó bá àyíká iṣẹ́ Jòhánù mu.
theological_decisions:
- issue: Bí a ṣe máa tú ìtọ́kasí Ánásì àti Káyáfà ní ìbámu pẹ̀lú ἀρχιερέως tó jẹ́ ẹyọ kan
  choice: 'Pa ipò náà mọ́ ní ẹyọ kan: ‘Ní àkókò ipò àlùfáà àgbà ti Ánásì àti Káyáfà’'
  alternative: Nígbà tí Ánásì àti Káyáfà jẹ́ àlùfáà àgbà
  rationale: Ọ̀rọ̀ Gíríìkì lo ẹyọ kan fún ipò àlùfáà àgbà, ṣùgbọ́n ó dárúkọ ẹni méjì. Ìtumọ̀ yìí pa ìdíjú ìtàn àti lítíréṣọ̀ náà mọ́, kò sì gbìyànjú láti mú un bára mu ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìlànà ọ̀rọ̀ àsọtẹ́lẹ̀ ‘ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀…’ mọ́ ní ọ̀nà tí olùkà Yorùbá lè lóye nírọ̀rùn.
