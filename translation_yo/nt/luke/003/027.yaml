base_translation:
  language: en
  yaml_path: translation/nt/luke/003/027.yaml
  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: yo
  text: ọmọ Jóánánì[a], ọmọ Résà, ọmọ Serubábélì, ọmọ Ṣeálítíélì[b], ọmọ Nérì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, àpilẹ̀kọ ìpele ìní τοῦ ni a tún sọ pẹ̀lú orúkọ kọ̀ọ̀kan; a fi “ọmọ” hàn nítorí ìlànà ìtàn ìran tí àyíká ọ̀rọ̀ ti fi lélẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Salatíélì”; a sábà ń fi í mọ̀ gẹ́gẹ́ bí orúkọ Májẹ̀mú Láéláé náà, “Ṣeálítíélì.”
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtàn ìran yìí, àpilẹ̀kọ oníjíròrò τοῦ tí a tún sọ pẹ̀lú orúkọ kọ̀ọ̀kan dúró fún ìbátan ọmọ sí baba tí ọ̀rọ̀ tó ṣáájú ti fi lélẹ̀. “Ọmọ” sọ ìtumọ̀ tí a fi sílẹ̀ yìí ní Yorùbá àdánidá.
- source_word: Ἰωανὰν
  choice: Jóánánì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí tó bá ìró rẹ̀ mu, pẹ̀lú àwọn àmì ohùn Yorùbá.
- source_word: Ῥησὰ
  choice: Résà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà láti inú Gíríìkì ní ọ̀nà tó rọrùn fún olùkà Yorùbá.
- source_word: Ζοροβαβὲλ
  choice: Serubábélì
  rationale: A lo ìrísí orúkọ tí a mọ̀ nínú àṣà Bíbélì Yorùbá, tí ó sì ń tọ́ka sí ẹni kan náà tí a mọ̀ nínú Májẹ̀mú Láéláé.
- source_word: Σαλαθιὴλ
  choice: Ṣeálítíélì
  rationale: A lo ìrísí orúkọ Hébérù tí a mọ̀ sí Ṣeálítíélì láti jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ Májẹ̀mú Láéláé hàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì ní Σαλαθιήλ.
- source_word: Νηρὶ
  choice: Nérì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí Yorùbá tó bá ìró rẹ̀ mu.
theological_decisions:
- issue: Àkúrò-ọ̀rọ̀ nínú ìtàn ìran
  choice: Lo “ọmọ” ṣáájú orúkọ kọ̀ọ̀kan.
  alternative: Lo ọ̀wọ́ orúkọ pẹ̀lú “ti” lásán.
  rationale: Gíríìkì fi ìbátan ọmọ sí baba sílẹ̀ gẹ́gẹ́ bí ohun tí àyíká ìtàn ìran ti mú kedere. Fífi “ọmọ” kún un jẹ́ ìtumọ̀ gírámà tí a lóye, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ọmọ” dípò gbólóhùn gígùn “ọmọkùnrin” nítorí pé ó jẹ́ ọ̀nà àdánidá àti ṣókí fún ìtàn ìran Yorùbá; àwọn orúkọ ni a ṣe àkọsílẹ̀ kí olùkà lè pè wọ́n nírọ̀rùn.
