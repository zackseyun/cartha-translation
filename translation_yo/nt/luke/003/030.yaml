  register: Yorùbá àṣà, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A tún “ọmọ” sọ níwájú orúkọ kọ̀ọ̀kan láti jẹ́ kí ìlànà ìran náà ṣe kedere; a fi àmì ohùn sí orúkọ níbi tí ó bá jẹ́ adayébá.
