  text: the son of Simeon[a], the son of Judah, the son of Joseph, the son of Jonam, the son of Eliakim[b],
translation:
  language: yo
  text: ọmọ Síméónì[a], ọmọ Júdà, ọmọ Jósẹ́fù, ọmọ Jónámù, ọmọ Élíákímù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan lo “Júdásì” dípò “Júdà”; orúkọ Gíríìkì kan náà ni a lè tú ní ọ̀nà méjèèjì, ṣùgbọ́n “Júdà” bá àyíká ìtàn ìran yìí mu dáadáa.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ tàbí àṣà ìtumọ̀ kan ní “Jónánì” dípò “Jónámù.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtàn ìran Lúùkù, akọ́lé onígbẹ̀yìn tí a tún sọ níwájú orúkọ kọ̀ọ̀kan ń tẹ̀ síwájú nínú ìlànà ìran. “Ọmọ” mú ìbátan tí a fi sílẹ̀ láìsọ jáde hàn ní Yorùbá adayébá.
- source_word: Συμεὼν
  choice: Síméónì
  rationale: Ìkọ̀wé orúkọ yìí tẹ̀ lé bí a ṣe máa ń mú orúkọ Síméónì wọ èdè Yorùbá, pẹ̀lú àmì ohùn.
- source_word: Ἰούδα
  choice: Júdà
  rationale: Fọ́ọ̀mù Gíríìkì náà lè dúró fún Júdà tàbí Júdásì; nínú àkọsílẹ̀ ìran yìí, “Júdà” bá orúkọ Hébérù/Júù mu dáadáa, kò sì fa ìbáṣepọ̀ tí kò yẹ pẹ̀lú Júdásì Ísíkáríótù.
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: Èyí ni fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún orúkọ náà.
- source_word: Ἰωνὰμ
  choice: Jónámù
  rationale: Ó ṣojú fọ́ọ̀mù SBLGNT Ἰωνάμ ní kíkà Yorùbá; “Jónánì” jẹ́ fọ́ọ̀mù míì tí àwọn àṣà àfọwọ́kọ tàbí ìtumọ̀ kan ní.
- source_word: Ἐλιακὶμ
  choice: Élíákímù
  rationale: Ìkọ̀wé yìí ń ṣojú orúkọ Sémítì náà ní ọ̀nà Yorùbá tí ó ṣeé kà, pẹ̀lú àmì ohùn.
