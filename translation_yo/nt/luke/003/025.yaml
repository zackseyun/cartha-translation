  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: yo
  text: ọmọ Mátátíà, ọmọ Ámósì, ọmọ Náhúmù, ọmọ Hésílì, ọmọ Nágáì,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtàn ìran yìí, àpilẹ̀kọ oníjẹnítífù tí a ń tún sọ dúró fún ìbátan ọmọ sí baba tí àyíká ọ̀rọ̀ ti fi hàn. “Ọmọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àtòjọ ìran mu.
- source_word: Ματταθίου
  choice: Mattatíà
  rationale: Orúkọ ènìyàn ni; a ṣe àkọsílẹ̀ ohùn rẹ̀ ní Yorùbá, pẹ̀lú ìparí -íà tó bá fọ́ọ̀mù orúkọ náà mu.
- source_word: Ἀμὼς
  choice: Ámósì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìlànà Yorùbá; níbí, orúkọ baba ńlá kan ni, láìfi dandan dá a mọ́ Ámósì wòlíì.
- source_word: Ναοὺμ
  choice: Náhúmù
  rationale: A lo fọ́ọ̀mù Yorùbá tó wọ́pọ̀ fún orúkọ Nahumu, èyí tó ṣetọju ìdánimọ̀ orúkọ Bíbélì náà.
- source_word: Ἑσλὶ
  choice: Ésílì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà láti inú Gíríìkì, láìfi h- sí ìbẹ̀rẹ̀, nítorí pé mímí líle kò sí nínú ọ̀rọ̀ orísun.
- source_word: Ναγγαὶ
  choice: Nággáì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà pẹ̀lú kọ́ńsónántì méjì láti ṣetọju gg inú ọ̀rọ̀ Gíríìkì, àti àpẹẹrẹ fáwẹ́lì ìparí -áì.
