revisions:
- from: Ní ọdún kẹ́ẹ̀ẹ́dógún ìjọba Tiberiu Kesari[a], nígbà tí Pontiu Pilatu ń ṣàkóso Judea, tí Herodu sì jẹ́ tetraki Galili, tí Filipu arákùnrin rẹ̀ jẹ́ tetraki agbègbè Iturea àti Trakoniti, tí Lisania sì jẹ́ tetraki Abilene[b],
  to: Ní ọdún kẹ́ẹ̀ẹ́dógún ìjọba Tiberiu Kesari[a], nígbà tí Pọntiu Pilatu ń ṣàkóso Jùdíà, tí Hẹrodu sì jẹ́ tetraki ti Galili, tí Filipu, arákùnrin Hẹrodu, jẹ́ tetraki ti agbègbè Iturea àti Trakoniti, tí Lisania sì jẹ́ tetraki ti Abilene[b],
  rationale: The revision corrects the Yoruba orthography of Pọntiu, makes Philip’s relationship to Hẹrodu explicit, and refines the temporal alternative in footnote a. It retains the source’s chronological and political details, the open-ended comma, and the historical title “tetraki.”
