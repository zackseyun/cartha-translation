id: LUK.3.1
reference: Luke 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: yo
  text: Ní ọdún kẹ́ẹ̀ẹ́dógún ìjọba Tiberiu Kesari[a], nígbà tí Pọntiu Pilatu ń ṣàkóso Jùdíà, tí Hẹrodu sì jẹ́ tetraki ti Galili, tí Filipu, arákùnrin Hẹrodu, jẹ́ tetraki ti agbègbè Iturea àti Trakoniti, tí Lisania sì jẹ́ tetraki ti Abilene[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò ọdún kẹ́ẹ̀ẹ́dógún náà.”
    reason: lexical_alternative
  - marker: b
    text: “Tetraki” jẹ́ alákòóso agbègbè kan lábẹ́ àṣẹ Róòmù.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: Ní ọdún kẹ́ẹ̀ẹ́dógún
  rationale: Ó jẹ́ gbólóhùn àkókò tó ṣe déédé pẹ̀lú èdè Yorùbá, ó sì pa ìṣètò ọjọ́-ìṣẹ̀lẹ̀ Luku mọ́.
- source_word: δὲ
  choice: sì (nínú àwọn gbólóhùn tó tẹ̀ lé e)
  rationale: δέ jẹ́ àmì ìlọsíwájú ìtàn, kì í ṣe ìtakora líle. Yorùbá kò nílò ọ̀rọ̀ bí ‘Ǹjẹ́’ ní ìbẹ̀rẹ̀; ‘sì’ nínú àtòjọ náà ń mú ìsopọ̀ ìtàn náà jáde lọ́nà àdánidá.
- source_word: ἡγεμονίας
  choice: ìjọba
  rationale: Ní ìbámu pẹ̀lú Tiberiu Kesari, ‘ìjọba’ túmọ̀ sí àkókò tí ó fi ń ṣàkóso gẹ́gẹ́ bí olú ọba.
- source_word: Τιβερίου Καίσαρος
  choice: Tiberiu Kesari
  rationale: Àkọsílẹ̀ orúkọ náà ni a mú bá ìró àti ìlànà ìkọ̀wé Yorùbá mu.
- source_word: ἡγεμονεύοντος
  choice: ń ṣàkóso
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe participle náà mọ́, dípò yíyí i padà sí orúkọ oyè nìkan.
- source_word: τετρααρχοῦντος
  choice: jẹ́ tetraki
  rationale: A pa oyè ìṣèlú pàtó náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀ ojú ìwé.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filipu arákùnrin rẹ̀
  rationale: Ó pa ìbátan Filipu sí Herodu mọ́ ní ọ̀nà kúkúrú tí ó sì ṣe kedere.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: agbègbè Iturea àti Trakoniti
  rationale: ‘Agbègbè’ ṣe àfihàn χώρας, kí orúkọ méjèèjì má bàa dà bí orílẹ̀-èdè òde òní.
- source_word: τῆς Ἀβιληνῆς
  choice: Abilene
  rationale: Orúkọ agbègbè ìtàn ni; a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìró Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ oyè ìṣèlú τετρααρχοῦντος
  choice: jẹ́ tetraki
  alternative: jẹ́ alákòóso / ń ṣàkóso
  rationale: Pípamọ́ oyè pàtó náà yẹra fún fífi ìtumọ̀ gbogbogbò rọ́pò àlàyé ìtàn tí orísun Gíríìkì fúnni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àtòjọ àwọn gbólóhùn ‘tí ... sì’ láti tẹ̀ lé ìṣètò gírámà Gíríìkì, níwọ̀n bí ẹsẹ yìí ti ń bá a lọ sí ẹsẹ tó tẹ̀ lé e. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; àwọn orúkọ àjèjì ni a mú bá ìró Yorùbá mu.
