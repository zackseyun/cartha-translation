id: LUK.3.8
reference: Luke 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: yo
  text: Nítorí náà, ẹ so àwọn èso tí ó yẹ fún ìrònúpìwàdà[a]. Ẹ má sì bẹ̀rẹ̀ sí í sọ láàárín ara yín[b] pé, “Ábúráhámù ni baba wa,” nítorí mo sọ fún yín pé Ọlọ́run lè gbé àwọn ọmọ dìde fún Ábúráhámù láti inú àwọn òkúta wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn èso tí ó bá ìrònúpìwàdà mu.” Ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀ nọ́ńbà, ó sì ń tẹnu mọ́ ìwà tí ó bá ìrònúpìwàdà tòótọ́ mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ara yín” tàbí “sí ara yín.” Gbólóhùn náà lè tọ́ka sí ohun tí wọ́n ń sọ lọ́kàn ara wọn tàbí ohun tí wọ́n ń sọ ní àárín ẹgbẹ́ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: ẹ so
  rationale: Pẹ̀lú ‘èso,’ ọ̀rọ̀-ìṣe ‘so’ ni èdè Yorùbá àdánidá fún mímú èso jáde; àṣẹ náà sì dúró gẹ́gẹ́ bí ìpè sí ìṣe gidi.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ohun tí a sọ ṣáájú hàn ní kedere.
- source_word: καρποὺς
  choice: àwọn èso
  rationale: A pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, kí ó lè tọ́ka sí onírúurú ìṣe tàbí àbájáde ìrònúpìwàdà.
- source_word: ἀξίους τῆς μετανοίας
  choice: tí ó yẹ fún ìrònúpìwàdà
  rationale: Ó pa èrò ìbámu láàárín ìwà àti ìrònúpìwàdà mọ́ láì sọ pé ìṣe ni ó ń ra ìdáríjì.
- source_word: μὴ ἄρξησθε λέγειν
  choice: Ẹ má sì bẹ̀rẹ̀ sí í sọ
  rationale: Ó fi agbára ìkìlọ̀ náà hàn pé kí wọ́n má tilẹ̀ bẹ̀rẹ̀ sí í lo ọ̀rọ̀ yìí láti dá ara wọn láre.
- source_word: ἐν ἑαυτοῖς
  choice: láàárín ara yín
  rationale: Ó jẹ́ Yorùbá àdánidá fún ohun tí ẹgbẹ́ kan ń sọ ní àárín ara wọn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ọ̀rọ̀ inú ọkàn sílẹ̀ gẹ́gẹ́ bí ohun tí ó tún ṣeé ṣe.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Ábúráhámù ni baba wa
  rationale: Ìtúmọ̀ yìí jẹ́ kedere, ó sì tẹnu mọ́ ìgbẹ́kẹ̀lé wọn nínú ìran Ábúráhámù.
- source_word: δύναται ὁ θεὸς
  choice: Ọlọ́run lè
  rationale: Ó sọ agbára àti òmìnira Ọlọ́run ní Yorùbá àdánidá.
- source_word: ἐκ τῶν λίθων τούτων
  choice: láti inú àwọn òkúta wọ̀nyí
  rationale: Ó pa ìtumọ̀ orísun tí ἐκ ní mọ́, ó sì bá àwòrán àwọn òkúta tí ó wà níbẹ̀ mu.
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: gbé àwọn ọmọ dìde fún Ábúráhámù
  rationale: ‘Gbé ... dìde’ pa àwòrán Gíríìkì mọ́ pé Ọlọ́run lè mú àwọn ọmọ wá sí ipò yìí lọ́nà àìròtẹ́lẹ̀, láì dín un kù sí ìbí nípa ti ara nìkan.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn èso tí ó yẹ fún ìrònúpìwàdà’
  choice: Àwọn ìṣe tí ó bá ìrònúpìwàdà tòótọ́ mu, tí ó sì ń fi í hàn.
  alternative: A lè sọ pé ‘àwọn èso tí ó bá ìrònúpìwàdà mu.’
  rationale: Gíríìkì ń béèrè ìbámu láàárín ìrònúpìwàdà àti ìwà; kò sọ pé àwọn ìṣe wọ̀nyí ń ra ìdáríjì.
- issue: Ìgbẹ́kẹ̀lé nínú jíjẹ́ ìran Ábúráhámù
  choice: Jòhánù kọ̀ ìrònú pé ìbátan ẹ̀jẹ̀ pẹ̀lú Ábúráhámù dá ààbò ènìyàn lójú níwájú Ọlọ́run.
  alternative: A lè tú ọ̀rọ̀ náà sí i nípa ṣíṣàlàyé àwọn ‘ọmọ tòótọ́’ Ábúráhámù, ṣùgbọ́n èyí yóò fi èrò tí ẹsẹ̀ náà kò sọ ní tààrà kún un.
  rationale: Ẹsẹ̀ náà tako ìgbẹ́kẹ̀lé nínú ìran ènìyàn, ó sì jẹ́wọ́ agbára Ọlọ́run láti gbé ọmọ dìde fún Ábúráhámù láti ibi tí ènìyàn kò retí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ so àwọn èso’ jẹ́ àwòrán ọ̀gbìn tí ó wọ́pọ̀, ‘ìrònúpìwàdà’ sì jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún μετάνοια. A pa àìdánilójú ἐν ἑαυτοῖς mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
