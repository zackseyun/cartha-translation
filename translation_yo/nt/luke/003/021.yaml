source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé nígbà tí a batisí gbogbo àwọn ènìyàn, tí a sì ti batisí Jésù pẹ̀lú, bí ó ti ń gbàdúrà, a ṣí ọ̀run[a] sílẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ojú ọ̀run” tàbí “ọ̀run.” Nínú àyíká yìí, “ọ̀run” bá ìfihàn Ọlọ́run tí ó tẹ̀ lé mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó ṣe àfihàn ìṣẹ̀lẹ̀ tuntun nínú ìtàn, nígbà tí “sì” ń gbé ìtàn náà tẹ̀ síwájú láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: nígbà tí a batisí gbogbo àwọn ènìyàn
  rationale: Ìsọ̀rọ̀ aláìlẹ́ni Gíríìkì pẹ̀lú ἐν jẹ́ ti àkókò; “nígbà tí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́, “gbogbo àwọn ènìyàn” sì pa ìtẹnumọ́ ἅπαντα mọ́.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: tí a sì ti batisí Jesu pẹ̀lú
  rationale: “Pẹ̀lú” gbé agbára àfikún καί jáde, “ti batisí” sì fi hàn pé ìbatisí Jesu ti wáyé ní àkókò tí ìṣe àdúrà àti ṣíṣí ọ̀run tẹ̀ lé.
- source_word: καὶ προσευχομένου
  choice: bí ó ti ń gbàdúrà
  rationale: “Ń” fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì jẹ́ kó ṣe kedere pé Jesu ló ń gbàdúrà nígbà ìṣẹ̀lẹ̀ pàtàkì náà.
- source_word: ἀνεῳχθῆναι
  choice: ṣí sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ aláìṣe ti “a ṣí,” láìfi àwòrán lílá tàbí yíya tí ọ̀rọ̀ Gíríìkì yìí kò fi dandan sọ kún un.
- source_word: τὸν οὐρανὸν
  choice: ọ̀run
  rationale: “Ọ̀run” bá àyíká ìfihàn Ọlọ́run mu, ó sì tún lè pa ìbáṣepọ̀ pẹ̀lú ojú ọ̀run mọ́ dáadáa ju yíyan ọ̀rọ̀ tí yóò dín ìtumọ̀ náà kù.
theological_decisions:
- issue: Ohun tí οὐρανός ń tọ́ka sí nínú ìbatisí Jesu
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: Àyíká tí Ẹ̀mí ń sọ̀kalẹ̀ àti ohùn Ọlọ́run ń dún ṣe atilẹyin fún “ọ̀run” gẹ́gẹ́ bí ibùgbé ti ọ̀run, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ “ojú ọ̀run” tí ọ̀rọ̀ Gíríìkì náà tún lè ní mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì yé òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A yan “batisí” gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tí ó wọ́pọ̀, a sì ṣètò gbólóhùn náà kí ìṣe àdúrà Jesu àti ṣíṣí ọ̀run lè hàn kedere láìyanju àìdánilójú orísun ju bó ṣe yẹ lọ.
