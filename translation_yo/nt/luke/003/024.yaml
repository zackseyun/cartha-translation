  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: yo
  text: ọmọ Mátátì[a], ọmọ Léfì, ọmọ Mélíkì, ọmọ Jánáì, ọmọ Jósẹ́fù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀ lé ìrísí gírámà Gíríìkì gan-an, “ti Mátátì, ti Léfì, ti Mélíkì, ti Jánáì, ti Jósẹ́fù.” Nínú Gíríìkì, àpilẹ̀kọ genitive náà ni a tún ṣe níwájú orúkọ kọ̀ọ̀kan; àyíká àkọsílẹ̀ ìran náà sì jẹ́ kó hàn pé ìbátan “ọmọ” ni a túmọ̀ sí, bí ó tilẹ̀ jẹ́ pé a kò sọ ọ́ jáde ní ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú àkọsílẹ̀ ìran yìí, àpilẹ̀kọ oníbáṣepọ̀ τοῦ tí a tún ṣe níwájú orúkọ kọ̀ọ̀kan dúró fún ìbátan ọmọ tí ọ̀rọ̀ tó yí i ká ti fi hàn. Lílo “ọmọ” jẹ́ kó ṣe kedere ní Yorùbá láìfi ìtumọ̀ tuntun kún un.
- source_word: Μαθθὰτ
  choice: Mátátì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tó bá ìṣètò ohùn àti ìkọ̀wé Yorùbá mu.
- source_word: Λευὶ
  choice: Léfì
  rationale: Àkọsílẹ̀ orúkọ Λευί ní Yorùbá tó tẹ̀ lé ìró orísun, pẹ̀lú f dípò v tí kò sí nínú alífábẹ́ẹ̀tì Yorùbá boṣewa.
- source_word: Μελχὶ
  choice: Mélíkì
  rationale: A mú orúkọ náà bá ìró Μελχί mu ní èdè Yorùbá; fáwẹ́lì ìrànwọ́ mú àkójọpọ̀ kọ́ńsónántì náà rọrùn láti sọ.
- source_word: Ἰανναὶ
  choice: Jánáì
  rationale: Àkọsílẹ̀ yìí pa ìró ìparí -αί mọ́, ó sì jẹ́ orúkọ tó ṣeé kà ní Yorùbá.
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: Ìrísí Yorùbá tí ó wọ́pọ̀ fún Ἰωσήφ ni a lò, pẹ̀lú àfikún fáwẹ́lì ìparí tó bá èdè Yorùbá mu.
theological_decisions:
- issue: Ìyọkúrò ọ̀rọ̀ nínú àkọsílẹ̀ ìran
  choice: Fi “ọmọ” síwájú orúkọ kọ̀ọ̀kan ní kedere
  alternative: Pa ọ̀wọ́ oníbáṣepọ̀ mọ́ gẹ́gẹ́ bí “ti Mátátì, ti Léfì...”
  rationale: Gíríìkì tẹ̀ síwájú pẹ̀lú ọ̀wọ́ genitive, ṣùgbọ́n àyíká àkọsílẹ̀ ìran ló jẹ́ kó túmọ̀ sí ìbátan ọmọ. “Ọmọ” mú èrò tí a fi sílẹ̀ nínú gírámà náà hàn ní Yorùbá láìdá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ọ̀nà ọ̀rọ̀ náà rọrùn, ó níyì, ó sì bá àkọsílẹ̀ ìran mu. Àwọn orúkọ ni a ṣe àkọsílẹ̀ wọn gẹ́gẹ́ bí ìró orísun ṣe gba, ní ìbámu pẹ̀lú ètò ìró Yorùbá.
