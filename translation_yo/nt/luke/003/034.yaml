base_translation:
  language: en
  yaml_path: translation/nt/luke/003/034.yaml
  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: yo
  text: ọmọ Jákọ́bù,[a] ọmọ Ísáákì, ọmọ Ábúráhámù, ọmọ Térà,[b] ọmọ Náhórì.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀rọ̀ tó túmọ̀ sí “ti” ni a tún ṣe pẹ̀lú orúkọ kọ̀ọ̀kan; a mú “ọmọ” jáde látinú àpẹẹrẹ àtòjọ ìran náà kí ìbátan náà lè ṣe kedere ní Yorùbá.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Thara”; a lo “Térà” láti bá ìrísí orúkọ náà tí a mọ̀ nínú Májẹ̀mú Láéláé mu.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní “Nachor”; a lo “Náhórì” láti bá ìrísí orúkọ náà tí a mọ̀ nínú Májẹ̀mú Láéláé mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Àpilẹ̀kọ arọ́pò-orúkọ oníjẹnítífù tí a tún ṣe níwájú orúkọ kọ̀ọ̀kan ń tẹ̀ síwájú nínú àtòjọ ìran; Yorùbá lè fi “ọmọ” hàn ní kedere láìfi “ti” kún un, èyí sì mú ìbátan ìran náà yé ni lọ́nà àdánidá.
- source_word: Ἰακώβ
  choice: Jákọ́bù
  rationale: Ìrísí orúkọ baba ńlá náà tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: Ἰσαάκ
  choice: Ísáákì
  rationale: Ìkọ̀wé orúkọ náà ní Yorùbá tí ó pa ìdánimọ̀ Ísáákì mọ́, tí ó sì bá ìró èdè mu.
- source_word: Ἀβραάμ
  choice: Ábúráhámù
  rationale: Ìrísí Yorùbá tí ó mọ́ọ̀mọ́ fún orúkọ Ábúráhámù, tí ó pa ìdánimọ̀ baba ńlá náà mọ́.
- source_word: Θάρα
  choice: Térà
  rationale: A lo ìrísí orúkọ Májẹ̀mú Láéláé tí àwọn òǹkàwé Yorùbá mọ̀ ju lílo àkọsílẹ̀ Gíríìkì “Thara” lọ.
- source_word: Ναχώρ
  choice: Náhórì
  rationale: A lo ìrísí orúkọ Májẹ̀mú Láéláé tí ó mọ̀ sí àwọn òǹkàwé Yorùbá, dípò títẹ̀lé lẹ́tà Gíríìkì “Nachor” pẹkipẹki.
theological_decisions:
- issue: Ṣíṣe ìbátan ọmọ tí gbolohun Gíríìkì fi sílẹ̀ láìsọ ní tààrà nínú àtòjọ ìran
  choice: Túmọ̀ ìsopọ̀ jẹnítífù kọ̀ọ̀kan ní kedere pẹ̀lú “ọmọ”
  alternative: Fi “ti” nìkan sí àárín àwọn orúkọ
  rationale: Àyíká àtòjọ ìran ni Lúùkù fi hàn pé ìbátan ọmọ ni a ń sọ. “Ọmọ” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá; kì í ṣe fífi ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àkọ́tọ́ tí ó lọ́lá, tó ṣe kedere, tó sì bá ọ̀rọ̀ ìran mu. A fi àmì ohùn sí ibi tí ó jẹ́ àdánidá, a sì tún “ọmọ” ṣe láti pa ìṣètò orísun mọ́ ní ọ̀nà tí òǹkàwé Yorùbá lè lóye lẹ́sẹ̀kẹsẹ̀.
