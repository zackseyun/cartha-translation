id: LUK.3.4
reference: Luke 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: yo
  text: 'gẹ́gẹ́ bí a ti kọ ọ́ sínú ìwé àwọn ọ̀rọ̀ Aísáyà wòlíì pé,


    “Ohùn ẹni tí ń ké ní aginjù[a]:


    ‘Ẹ pèsè ọ̀nà Olúwa[b];


    ẹ mú àwọn ọ̀nà rẹ̀ tọ́.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè lóye “ní aginjù” gẹ́gẹ́ bí apá kan àṣẹ tó tẹ̀ lé e: “Ohùn ẹni tí ń ké pé, ‘Ní aginjù, ẹ pèsè ọ̀nà Olúwa.’”'
    reason: alternative_reading
  - marker: b
    text: Tàbí, “OLÚWA.” Àyọlò yìí ń dún bí Aísáyà 40:3, níbi tí èdè Hébérù ti lo orúkọ Ọlọ́run, YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ọ̀nà Yorùbá àdánidá fún gbólóhùn tí a fi ń tọ́ka sí ohun tí a kọ sínú Ìwé Mímọ́; ó tún pa ìtumọ̀ pé ohun tí a kọ náà ṣì dúró mọ́.
- source_word: βίβλῳ λόγων
  choice: ìwé àwọn ọ̀rọ̀
  rationale: Ó ṣe àfihàn àwọn orúkọ méjèèjì inú Gíríìkì, ní èdè Yorùbá tí ó ṣe kedere, láì yọ ‘àwọn ọ̀rọ̀’ kúrò.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: Aísáyà wòlíì
  rationale: Ó jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó rọrùn fún àpèjúwe Aísáyà gẹ́gẹ́ bí wòlíì.
- source_word: Φωνὴ βοῶντος
  choice: Ohùn ẹni tí ń ké
  rationale: Ó pa àwòrán ohùn ẹni kan tí ń ké mọ́, ó sì bá ìsopọ̀ participle Gíríìkì mu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi ahoro tí kò fi bẹ́ẹ̀ sí ènìyàn; a so ó mọ́ ‘ń ké’ nínú ọ̀rọ̀ pàtàkì, bí ìṣètò Gíríìkì ti sábà ń tọ́ka sí.
- source_word: Ἑτοιμάσατε
  choice: Ẹ pèsè
  rationale: Àṣẹ sí ọ̀pọ̀ ènìyàn ni; ‘ẹ pèsè’ jẹ́ ọ̀nà Yorùbá àdánidá, tó sì níyì fún ìpè wòlíì.
- source_word: τὴν ὁδὸν κυρίου
  choice: ọ̀nà Olúwa
  rationale: Ó pa àkàwé ọ̀nà tí a ń pèsè fún dídé Olúwa mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún κύριος nínú ẹsẹ Gíríìkì; àlàyé ìsàlẹ̀ ojú ewé sọ ìbátan rẹ̀ pẹ̀lú orúkọ YHWH nínú Aísáyà.
- source_word: εὐθείας ποιεῖτε
  choice: ẹ mú … tọ́
  rationale: Ó fi àṣẹ náà hàn ní Yorùbá àdánidá, ó sì pa èrò ṣíṣe àwọn ọ̀nà náà ní títọ́ mọ́.
- source_word: τὰς τρίβους αὐτοῦ
  choice: àwọn ipa ọ̀nà rẹ̀
  rationale: ‘Ipa ọ̀nà’ yàtọ̀ díẹ̀ sí ‘ọ̀nà’ ṣùgbọ́n ó ṣì pa ìfiwéra àwọn ojú ọ̀nà méjèèjì inú orísun mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κύριος nínú ọ̀rọ̀ Aísáyà tí èdè Hébérù rẹ̀ ní YHWH
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì Lúùkù ni κύριος, nítorí náà ọ̀rọ̀ pàtàkì lo ‘Olúwa.’ Àlàyé ìsàlẹ̀ ojú ewé pa ìtàn orúkọ àtọ̀runwá YHWH mọ́ láì fi ìtumọ̀ ìjọ kan lé ẹsẹ náà lórí.
- issue: Ibi tí ‘ní aginjù’ ti so mọ́ nínú gbólóhùn àsọtẹ́lẹ̀
  choice: ó so mọ́ ‘ẹni tí ń ké’
  alternative: 'ó so mọ́ àṣẹ náà: ‘Ní aginjù, ẹ pèsè ọ̀nà Olúwa’'
  rationale: Ìṣètò ọ̀rọ̀ nínú àyọlò Gíríìkì Lúùkù lè jẹ́ kí a kà á pẹ̀lú ẹni tí ń ké, ṣùgbọ́n ìsopọ̀ kejì náà ṣeé ṣe, ó sì hàn kedere nínú àlàyé ìsàlẹ̀ ojú ewé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Àwọn àṣẹ ‘Ẹ pèsè’ àti ‘ẹ mú’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ. Ìlà ewì náà tẹ̀ lé ìṣọ̀kan àti ìṣírò ọ̀rọ̀ àsọtẹ́lẹ̀ láì di èdè àtijọ́.
