  terminology: ‘Aísáyà,’ ‘wòlíì,’ ‘aginjù,’ àti ‘Olúwa’ bá ìlò Standard Yorùbá àti ìforúkọsílẹ̀ Bíbélì mu. ‘Àwọn ọ̀nà rẹ̀’ jẹ́ ọ̀rọ̀ tó móoru, tó sì ṣetán láti gbé τρίβους gẹ́gẹ́ bí ọ̀nà/ipa ọ̀nà, láì fi ìtumọ̀ kan tí kò sí nínú orísun kún un.
