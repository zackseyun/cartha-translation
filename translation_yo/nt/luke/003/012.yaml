id: LUK.3.12
reference: Luke 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: yo
  text: Àwọn agbowó-orí pàápàá wá láti gba ìrìbọmi,[a] wọ́n sì wí fún un pé, “Olùkọ́, kí ni kí a ṣe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Àwọn agbowó-orí pẹ̀lú wá láti gba ìrìbọmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: wá
  rationale: Aorist indicative náà tọ́ka sí ìṣẹ̀lẹ̀ àtijọ́ ní ọ̀nà tó rọrùn; “wá” ni ìtumọ̀ àdánidá ní Yorùbá.
- source_word: δὲ καὶ τελῶναι
  choice: Àwọn agbowó-orí pàápàá
  rationale: τελῶναι túmọ̀ sí àwọn agbowó-orí; “pàápàá” mú agbára àfikún àti ìtẹnumọ́ δὲ ... καὶ jáde, ó sì fi hàn pé ẹgbẹ́ tí a lè má retí náà wá.
- source_word: βαπτισθῆναι
  choice: láti ṣe ìrìbọmi
  rationale: Infinitive passive náà sọ ète tí wọ́n fi wá. Ní Yorùbá ìjọba-ọrọ Bíbélì, “ṣe ìrìbọmi” jẹ́ ọ̀nà àdánidá láti sọ pé kí a bọ ẹni sínú omi tàbí kí ẹni gba ìrìbọmi; àlàyé ẹsẹ̀ fi àṣàyàn kejì hàn.
- source_word: εἶπαν πρὸς αὐτόν
  choice: wọ́n sì wí fún un
  rationale: Èyí pa ìtumọ̀ gígùn λέγω mọ́ gẹ́gẹ́ bí “wí,” dípò yíyí i padà sí ọ̀rọ̀ pàtó fún “béèrè,” bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ wọn.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: “Olùkọ́” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ẹni tí ń kọ́ni, láìfikún ìtumọ̀ Rabbi tàbí ọ̀gá.
- source_word: τί ποιήσωμεν
  choice: kí ni kí a ṣe?
  rationale: 'Ọ̀rọ̀ yìí mú ìbéèrè deliberative subjunctive náà jáde ní Yorùbá àdánidá: wọ́n ń béèrè ìgbésẹ̀ tó yẹ kí wọ́n gbé.'
theological_decisions:
- issue: Ìfarahàn ẹgbẹ́ àwọn agbowó-orí tí àwùjọ kò ka sí ẹni rere nínú ìpè Johanu sí ìrònúpìwàdà
  choice: Lo “Àwọn agbowó-orí pàápàá” láti pa ìtẹnumọ́ pé àwọn náà tún wá mọ́.
  alternative: “Àwọn agbowó-orí pẹ̀lú wá” tàbí “Àwọn agbowó-orí tún wá”
  rationale: “Pàápàá” dáàbò bo agbára ọ̀rọ̀ náà pé ẹgbẹ́ tí a kò retí tàbí tí a ń fojú burúkú wo náà dáhùn sí ìpè Johanu, láìfikún ìdájọ́ ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé gbogbogbò. “Agbowó-orí” jẹ́ ọ̀rọ̀ kedere ju àlàyé gígùn lọ, “Olùkọ́” sì jẹ́ ọ̀rọ̀ ìbánisọ̀rọ̀ ọlọ́lá.
