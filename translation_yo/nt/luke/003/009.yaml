id: LUK.3.9
reference: Luke 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: yo
  text: Àní, àáké ti wà ní gbòǹgbò àwọn igi báyìí. Nítorí náà, gbogbo igi tí kò bá so èso rere ni a ó gé lulẹ̀, tí a ó sì jù sínú iná.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Àní ... báyìí
  rationale: Ó mú ìtẹnumọ́ àti ìjẹ́kánjú ìdájọ́ náà jáde lọ́nà Yorùbá àdánidá, láìfi ọ̀rọ̀ kankan kún ìtumọ̀ rẹ̀.
- source_word: ἡ ἀξίνη
  choice: àáké
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún irinṣẹ́ tí a fi ń gé igi ni, ó sì pa àwòrán àkàwé náà mọ́.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: ti wà ní gbòǹgbò àwọn igi
  rationale: Ó tẹ̀ lé ìtumọ̀ pé àáké náà ti wà níbi gbòǹgbò, ó ti múra fún iṣẹ́; ‘wà’ kò fi hàn ní pàtó bóyá ẹnì kan gbé e síbẹ̀.
- source_word: πᾶν οὖν δένδρον
  choice: Nítorí náà, gbogbo igi
  rationale: ‘Nítorí náà’ fi ìyọrísí ọ̀rọ̀ ìkìlọ̀ tó ṣáájú hàn kedere.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: tí kò bá so èso rere
  rationale: ‘So èso’ ni gbólóhùn Yorùbá àdánidá fún igi tó ń mú èso jáde, ó sì pa àkàwé ìwà rere mọ́.
- source_word: ἐκκόπτεται
  choice: ni a ó gé lulẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún gígé igi débi pé ó ṣubú; ọjọ́ iwájú bá ìkìlọ̀ àsọtẹ́lẹ̀ náà mu.
- source_word: εἰς πῦρ βάλλεται
  choice: tí a ó sì jù sínú iná
  rationale: Ó pa ìṣe líle àti ibi tí a jù igi náà sí mọ́ ní èdè Yorùbá òde òní.
theological_decisions:
- issue: Àwòrán àkàwé nípa ìdájọ́
  choice: Pa àwòrán àáké, igi, èso rere àti iná mọ́ gẹ́gẹ́ bí ìkìlọ̀ pé ìdájọ́ ti sún mọ́lé.
  alternative: Ṣàlàyé iná náà ní pàtó gẹ́gẹ́ bí ọ̀run àpáàdì tàbí gẹ́gẹ́ bí ìdájọ́ ìtàn lórí Ísírẹ́lì nìkan.
  rationale: Ẹsẹ náà kò sọ ní pàtó ohun gbogbo tí iná náà dúró fún; fífi àkàwé náà sílẹ̀ bí ó ti rí ń pa àìdájú tòótọ́ àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Àní’ fún ìtẹnumọ́, ‘so èso’ fún àṣà ọ̀rọ̀ Yorùbá, a sì yẹra fún ṣíṣe àlàyé iná náà ju ohun tí Gíríìkì sọ lọ.
