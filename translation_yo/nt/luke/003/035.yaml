  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: yo
  text: ọmọ Sérúgù,[a] ọmọ Réù, ọmọ Pélégì, ọmọ Ébérì, ọmọ Ṣélà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “ti Serouch, ti Ragau, ti Phalek, ti Eber, ti Sala.” Nínú àtòjọ ìran Lúùkù, ẹ̀wọ̀n àwọn fọ́ọ̀mù genitive yìí ń fi ìbátan ọmọ hàn ní ọ̀nà àkùdé; a fi “ọmọ” kún un nítorí àyíká ọ̀rọ̀, kí ìtumọ̀ náà lè ṣe kedere ní Yorùbá.'
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn orúkọ níbí tẹ̀lé fọ́ọ̀mù Májẹ̀mú Láéláé tí a fi ń mọ àwọn baba ńlá wọ̀nyí: Sérúgù, Réù, Pélégì, Ébérì, àti Ṣélà.'
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú àtòjọ ìran Lúùkù, àpilẹ̀kọ oníṣe-ẹni tí a tún sọ léraléra ń tẹ̀ síwájú nínú ọ̀rọ̀ ìbátan ọmọ tí àyíká ti fi hàn. “Ọmọ” jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá láti sọ ìbátan náà, bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì sọ ọ́ ní ọ̀nà àkùdé.
- source_word: Σεροὺχ
  choice: Sérúkì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí tó bá ìró Yorùbá mu, pẹ̀lú fáwẹ́lì ìparí láti mú kí kíkà á rọrùn.
- source_word: Ῥαγαὺ
  choice: Réù
  rationale: Ìrísí yìí tẹ̀ lé orúkọ baba ńlá náà tí a mọ̀ láti inú ìran Jẹ́nẹ́sísì, ó sì bá ìró Yorùbá mu.
- source_word: Φάλεκ
  choice: Pélégì
  rationale: A lo ìrísí orúkọ tí ó so ẹni náà mọ́ Pélégì inú Jẹ́nẹ́sísì, ní àtúnṣe sí ìró àti ìkọ̀wé Yorùbá.
- source_word: Ἔβερ
  choice: Ébérì
  rationale: Ìrísí yìí pa ìdánimọ̀ baba ńlá Ébérì mọ́, ó sì yà á sọ́tọ̀ kúrò nínú àwọn orúkọ míì tí ó lè dà bí i.
- source_word: Σαλὰ
  choice: Ṣélà
  rationale: A lo ìrísí orúkọ Májẹ̀mú Láéláé tí a mọ̀ sí Ṣélà, dípò títẹ̀lé ìrísí Gíríìkì Sálà ní tààràtà, kí ìbáṣepọ̀ àtòjọ ìran náà hàn gbangba.
