  source_fidelity: Ìtumọ̀ náà mú imperfect ἐπηρώτων (“ń béèrè”) àti ìbéèrè deliberative ποιήσωμεν (“kí a ṣe”) dáradára. Ṣùgbọ́n “Àwọn èrò” lè túmọ̀ sí ìrònú/èrò, ó sì lè jẹ́ aláìní ìdánilójú fún οἱ ὄχλοι, ẹgbẹ́ ènìyàn púpọ̀ tí ó péjọ.
  naturalness: Ìkọ̀wé náà rọrùn, ó sì ní àmì ohùn tó péye. “Àwọn ogunlọ́gọ̀ ènìyàn” jẹ́ ọ̀nà tí ó ṣe kedere jù lọ láti pe àwọn ọ̀pọ̀ ènìyàn tí ó péjọ. Gbigbé “nígbà náà” sí ìparí ìbéèrè náà ń jẹ́ kí ó ṣiṣẹ́ gẹ́gẹ́ bí àmì ìyọrísí ju àmì àkókò lọ.
  terminology: A rọ́pò “Àwọn èrò” pẹ̀lú “Àwọn ogunlọ́gọ̀ ènìyàn” fún “the crowds.” Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtàkì tàbí orúkọ tí ó nílò àtúnṣe.
  issues:
