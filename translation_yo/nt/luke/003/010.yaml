    issue: “Àwọn èrò” kò ṣe kedere gẹ́gẹ́ bí ìtumọ̀ οἱ ὄχλοι.
    rationale: “Èrò” lè tọ́ka sí ìrònú tàbí èrò ẹni; bí ó tilẹ̀ jẹ́ pé a lè lò ó fún ènìyàn, “àwọn ogunlọ́gọ̀ ènìyàn” ń fi ìtumọ̀ ‘crowds’ hàn ní kedere, ó sì yẹ fún àyíká ọ̀pọ̀ ènìyàn tí ó péjọ.
  - severity: low
