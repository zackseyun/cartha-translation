  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: yo
  text: Àwọn ogunlọ́gọ̀ ènìyàn sì ń béèrè lọ́wọ́ rẹ̀ pé, “Kí ni kí a ṣe nígbà náà?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ń béèrè lọ́wọ́ rẹ̀
  rationale: Àkókò imperfect fi hàn pé ìbéèrè náà ń lọ lọ́wọ́ tàbí pé wọ́n ń tún un béèrè; ọ̀rọ̀ yìí sọ ìṣe tí ń tẹ̀ síwájú ní Yorùbá àdánidá.
- source_word: οἱ ὄχλοι
  choice: Àwọn èrò
  rationale: Ọ̀pọ̀ nọ́ńbà náà ń tọ́ka sí àwọn àwùjọ ènìyàn tí ó péjọ; “àwọn èrò” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, ó sì pa ọ̀pọ̀ nọ́ńbà mọ́.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá àdánidá, “pé” ló dára jù láti ṣí ọ̀rọ̀ tí wọ́n sọ sílẹ̀, dípò títúmọ̀ participle náà ní ọ̀rọ̀-lórí-ọ̀rọ̀ gẹ́gẹ́ bí “wọ́n ń wí pé.”
- source_word: Τί οὖν
  choice: Kí ni ... nígbà náà
  rationale: “Nígbà náà” pa ìtumọ̀ ìyọrísí οὖν mọ́, ó sì so ìbéèrè náà mọ́ ìkìlọ̀ Jòhánù tó ṣáájú.
- source_word: ποιήσωμεν
  choice: kí a ṣe
  rationale: Deliberative aorist subjunctive náà jẹ́ ìbéèrè nípa ohun tí ó yẹ kí wọ́n ṣe; “kí a ṣe” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ọ́ láìfi ìtumọ̀ míì kún un.
