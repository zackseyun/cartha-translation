  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ má ṣe gba owó-orí ju iye tí a ti pàṣẹ fún yín lọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé ìrísí Gíríìkì pẹ̀lú: “Ẹ má ṣe ṣe ju ohun tí a ti pàṣẹ fún yín lọ.” Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ ìṣe náà ń tọ́ka ní pàtó sí iṣẹ́ gbígba owó-orí wọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘sì’ bá ìṣàn Yorùbá mu láìfi ìtakora líle kún un.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sọ fún wọn pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún λέγω + πρός, ó sì mú ọ̀rọ̀ tààrà tí ó tẹ̀ lé wọlé dáadáa.
- source_word: Μηδὲν πλέον
  choice: Ẹ má ṣe gba ohun tí ó pọ̀ ju ... lọ
  rationale: Gbólóhùn náà fi òfin ìdènà àṣejù hàn. ‘Gba’ jẹ́ kí iṣẹ́ àwọn agbowó-orí tí àyíká ọ̀rọ̀ tọ́ka sí ṣe kedere, nígbà tí ‘ohun tí ó pọ̀ ju’ pa ìtumọ̀ excess mọ́.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: ju èyí tí a ti pàṣẹ fún yín lọ
  rationale: διατεταγμένον jẹ́ perfect passive participle; ‘a ti pàṣẹ’ pa ohùn àìsọ ẹni tó ṣe é àti ipa àṣẹ ìjọba mọ́.
- source_word: πράσσετε
  choice: gba
  rationale: Bí ó tilẹ̀ jẹ́ pé πράσσω lè túmọ̀ sí ‘ṣe,’ ní àyíká ẹsẹ 12–13 ó tọ́ka sí iṣẹ́ gbígba owó-orí. ‘Gba’ jẹ́ àdánidá ní Yorùbá, kò sì fi ohun tuntun kún àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ṣíṣe ohun tí πράσσετε ń tọ́ka sí kedere láti inú àyíká ọ̀rọ̀
  choice: Lo ‘gba’ fún iṣẹ́ gbígba owó-orí.
  alternative: ‘Ẹ má ṣe ohunkóhun tí ó pọ̀ ju èyí tí a ti pàṣẹ fún yín lọ.’
  rationale: Àwọn tí Jòhánù ń bá sọ̀rọ̀ ni agbowó-orí gẹ́gẹ́ bí ẹsẹ tó ṣáájú; nítorí náà, ‘gba’ mú ìṣe tí a fi sílẹ̀ nínú Gíríìkì hàn láìyí ẹ̀kọ́ ẹsẹ náà padà. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro ti ọ̀rọ̀ ìṣe náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘Ẹ’ àti ‘yín’ bá àwọn olùgbọ́ mu.
