id: LUK.3.5
reference: Luke 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: yo
  text: Gbogbo àfonífojì ni a ó kún[a], gbogbo òkè ńlá àti òkè kékeré ni a ó sì mú rẹlẹ̀; àwọn ibi wọ̀nyí tí ó wọ̀ yóò di títọ́[b], àwọn ọ̀nà gángá yóò sì di ọ̀nà pẹlẹbẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo ọ̀gbun ni a ó kún ... àwọn ohun tí ó wọ̀ yóò di títọ́, àwọn ibi gángá yóò sì di ọ̀nà pẹlẹbẹ.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn yìí ń mú Aísáyà 40:4 wá sí ìrántí; ó lo àwòrán ṣíṣe ọ̀nà láti sọ nípa mímúra ọ̀nà Olúwa sílẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Gbogbo àfonífojì
  rationale: “Àfonífojì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún valley, ó sì bá àwòrán ilẹ̀ tí a ń tún ṣe mu. “Ọ̀gbun” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà mìíràn láti túmọ̀ ravine tàbí gorge.
- source_word: πληρωθήσεται
  choice: ni a ó kún
  rationale: Ìṣe aláìlẹ́ni tí ó ṣe é ni “a ó kún” ń fi ìtumọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú onífaragà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: gbogbo òkè ńlá àti òkè kékeré
  rationale: A pa ìyàtọ̀ tó wà láàárín òkè gíga àti òkè kékeré mọ́, bákan náà ni a kò sọ méjèèjì di ọ̀rọ̀ kan ṣoṣo.
- source_word: ταπεινωθήσεται
  choice: ni a ó sì rẹ̀ sílẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí rírẹ ilẹ̀ gíga sílẹ̀, kì í ṣe sísọ nípa ìrẹ̀lẹ̀ ti ìwà nìkan. Yíyan yìí pa àwòrán ilẹ̀ àti ìró àsọtẹ́lẹ̀ rẹ̀ mọ́.
- source_word: τὰ σκολιά
  choice: àwọn ibi tí ó wọ́
  rationale: Ajẹtífù ọ̀pọ̀ oníjìnnìkí ni Gíríìkì lò bí orúkọ láìsọ pé ọ̀nà ni pàtó. “Àwọn ibi tí ó wọ́” pa àìsọ pàtó yẹn mọ́, ó sì bá àwòrán ṣíṣe ọ̀nà mu.
- source_word: εἰς εὐθείαν
  choice: yóò di títọ́
  rationale: '“Di títọ́” sọ àbájáde ìyípadà náà ní Yorùbá àdánidá: ohun tí ó wọ́ di ohun tí ó tọ́.'
- source_word: αἱ τραχεῖαι
  choice: àwọn ọ̀nà gbágungbà
  rationale: Bí ó tilẹ̀ jẹ́ pé ajẹtífù tí a lò bí orúkọ ni ọ̀rọ̀ Gíríìkì, àyíká àti “ὁδοὺς” tó tẹ̀ lé e fi hàn pé ọ̀nà ni a ń sọ. “Gbágungbà” ṣàpèjúwe ojú ọ̀nà tí kò dọ́gba, tí kò sì dán.
- source_word: εἰς ὁδοὺς λείας
  choice: yóò sì di ọ̀nà dídán
  rationale: “Ọ̀nà” túmọ̀ ὁδός ní tààrà, “dídán” sì mú ìtumọ̀ ojú ọ̀nà tó smooth wá ní èdè Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Àwòrán àsọtẹ́lẹ̀ nípa ilẹ̀ àti ṣíṣe ọ̀nà láti Aísáyà 40:4
  choice: A pa àwòrán gidi ti kíkún àfonífojì, rírọ òkè sílẹ̀, títún ibi tí ó wọ́ ṣe, àti ṣíṣe ọ̀nà dán mọ́.
  alternative: Ṣíṣe àlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìgbé àwọn onírẹ̀lẹ̀ ga àti ìrẹ àwọn agbéraga sílẹ̀.
  rationale: Bó tilẹ̀ jẹ́ pé àwòrán náà lè ní ìtumọ̀ nípa ẹ̀mí àti ìwà, Lúùkù pa èdè ilẹ̀ àti ọ̀nà ti àsọtẹ́lẹ̀ náà mọ́. Ìtumọ̀ náà kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ kan rọ́pò àwòrán inú ẹsẹ náà.
translation_notes:
  register: Yorùbá àkànṣe òde òní ni a lò pẹ̀lú àmì ohùn ní kíkún, ní èdè ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé gbogbogbò. Ìṣètò “ni a ó” ń mú ohùn onífaragà ọjọ́ iwájú jáde lọ́nà àdánidá, “gbágungbà” sì jẹ́ ọ̀rọ̀ tí ó ṣe àwòrán ojú ọ̀nà líle tí kò dọ́gba.
