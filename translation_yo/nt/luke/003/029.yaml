  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: yo
  text: ọmọ Jéṣúà, ọmọ Élíésérì, ọmọ Jórímù, ọmọ Mátátì, ọmọ Léfì,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú àkọsílẹ̀ ìran yìí, ẹ̀yà ara oníran náà ń tọ́ka sí ìbátan ọmọ sí baba; fífi “ọmọ” hàn ní gbogbo ìpele jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: Ἰησοῦ
  choice: Jéṣúà
  rationale: Orúkọ ẹni ni a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìpè Yorùbá; nínú àyíká ìran yìí, “Jéṣúà” ń yà ẹni náà sọ́tọ̀ kúrò nínú ìtọ́kasí tó wọ́pọ̀ sí Jésù Kristi.
- source_word: Ἐλιέζερ
  choice: Élíésérì
  rationale: Àkọsílẹ̀ Yorùbá tó tẹ̀ lé ìró orúkọ Gíríìkì.
- source_word: Ἰωρὶμ
  choice: Jórímù
  rationale: Àkọsílẹ̀ Yorùbá tó tẹ̀ lé ìró orúkọ Gíríìkì.
- source_word: Μαθθὰτ
  choice: Mátátì
  rationale: Àkọsílẹ̀ Yorùbá tó tẹ̀ lé ìró orúkọ Gíríìkì.
- source_word: Λευὶ
  choice: Léfì
  rationale: Èyí ni ọ̀nà tí orúkọ náà fi mọ́ àwọn òǹkàwé Yorùbá, ó sì bá ìró orísun mu.
