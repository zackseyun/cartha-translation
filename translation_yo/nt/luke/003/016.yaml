  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: yo
  text: Jòhánù dá gbogbo wọn lóhùn pé, “Èmi ń fi omi ṣe ìrìbọmi fún yín; ṣùgbọ́n ẹni tí ó lágbára ju mí lọ ń bọ̀. Èmi kò yẹ láti tú okùn bàtà rẹ̀. Òun yóò fi Ẹ̀mí Mímọ́ àti iná ṣe ìrìbọmi fún yín.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “Òun yóò ṣe ìrìbọmi fún yín nínú Ẹ̀mí Mímọ́ àti iná.” Ọ̀rọ̀ Gíríìkì ἐν lè tọ́ka sí ohun èlò, ààyè, tàbí ohun tí a ń bọ̀ sínú. “Iná” náà lè tọ́ka sí ìwẹ̀nùmọ́, ìdájọ́, tàbí apá kan nínú àwòrán ìrìbọmi Ẹ̀mí àti iná; ẹsẹ̀ yìí kò pinnu èyí ní pàtó.
    reason: lexical_alternative_and_theological_ambiguity
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν
  choice: dá gbogbo wọn lóhùn pé
  rationale: Ó mú ìtumọ̀ ìdáhùn àti ọ̀rọ̀ ìṣáájú λέγων pọ̀ sínú ọ̀nà Yorùbá tí ó ṣe déédéé, nígbà tí ‘gbogbo wọn’ dúró fún πᾶσιν.
- source_word: Ἐγὼ μὲν
  choice: Èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olókìkí ‘Èmi’ àti àmì ìdádúró lẹ́yìn gbólóhùn náà mú ìtẹnumọ́ àti ìyàtọ̀ tí μέν ń pèsè hàn láì fi ọ̀rọ̀ àjèjì kún un.
- source_word: ὕδατι
  choice: fi omi
  rationale: Dative náà lè tọ́ka sí ohun èlò tàbí ààyè/element; ‘fi omi’ jẹ́ ọ̀nà Yorùbá àdánidá fún means, ó sì jẹ́ kí àfidípò pẹ̀lú Ẹ̀mí Mímọ́ àti iná hàn kedere.
- source_word: βαπτίζω / βαπτίσει
  choice: ṣe ìrìbọmi / yóò ṣe ìrìbọmi
  rationale: ‘Ṣe ìrìbọmi’ jẹ́ ọ̀rọ̀ ìjọsìn Yorùbá tí ó wọ́pọ̀, tí kò sì pinnu ọ̀nà tàbí ìlànà ìrìbọmi kan tí ẹsẹ̀ náà kò sọ ní pàtó.
- source_word: ὁ ἰσχυρότερός μου
  choice: ẹni tí ó lágbára ju mí lọ
  rationale: Ó tú comparative náà jáde ní Yorùbá kedere, ó sì pa ìtumọ̀ agbára mọ́ láì fi àlàyé míì kún un.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Àkókò tí ń lọ lọ́wọ́ yìí bá present tense Gíríìkì mu, ó sì fi ìmọ̀lára pé dídé náà sún mọ́lé hàn.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Èmi kò tilẹ̀ yẹ
  rationale: ‘Yẹ’ mú ìtumọ̀ worthiness/adequacy inú ọ̀rọ̀ ìrẹ̀lẹ̀ náà hàn; ‘tilẹ̀’ ń tẹnu mọ́ ìrẹ̀lẹ̀ Jòhánù.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: láti tú okùn bàtà rẹ̀
  rationale: Ó jẹ́ àlàyé kedere, ti òde òní fún iṣẹ́ ìrẹ̀lẹ̀ ti títú okùn bàtà, láì lo ọ̀rọ̀ àtijọ́ tàbí aláìmọ̀.
- source_word: αὐτὸς
  choice: Òun
  rationale: ‘Òun’ ní ìtẹnumọ́ ju ‘ó’ lọ, ó sì pa ìyàtọ̀ láàárín Jòhánù àti ẹni tí ń bọ̀ mọ́.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: fi Ẹ̀mí Mímọ́ àti iná
  rationale: ‘Fi’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe ìrìbọmi, ṣùgbọ́n ἐν lè túmọ̀ sí means, sphere, tàbí element; àkọsílẹ̀ ẹsẹ̀ ń jẹ́ kí àìdánilójú yẹn hàn. Àkọlé ńlá fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ ‘yóò ṣe ìrìbọmi fún yín nínú/pẹ̀lú Ẹ̀mí Mímọ́ àti iná’
  choice: A pa ‘Ẹ̀mí Mímọ́ àti iná’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ kan náà láì ṣàlàyé irú iṣẹ́ tí iná ń ṣe.
  alternative: Kí a tú iná sí ìwẹ̀nùmọ́, tàbí kí a sọ pé Ẹ̀mí jẹ́ fún àwọn kan, iná ìdájọ́ sì jẹ́ fún àwọn mìíràn.
  rationale: Gbólóhùn Gíríìkì kò pinnu ní kedere bóyá iná jẹ́ ti ìwẹ̀nùmọ́, ti ìdájọ́, tàbí apá kan nínú àwòrán ìrìbọmi Ẹ̀mí-ati-iná; ìtumọ̀ náà kò yẹ kí ó yanjú ìjiyàn náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò gbólóhùn náà jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n ó pa ìtẹnumọ́ Jòhánù, ìyàtọ̀ pẹ̀lú ẹni tí ń bọ̀, àti àìdánilójú ọ̀rọ̀ ‘Ẹ̀mí Mímọ́ àti iná’ mọ́.
