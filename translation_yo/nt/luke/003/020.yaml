  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: yo
  text: 'Ó sì tún fi èyí kún gbogbo ohun búburú tí ó ti ṣe: ó tì Johanu mọ́ nínú ẹ̀wọ̀n.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà gan-an, “Ó tún fi èyí kún gbogbo wọn.” Ìtumọ̀ rẹ̀ ni pé Hẹrọdu fi iṣẹ́ yìí kún gbogbo ohun búburú mìíràn tí ó ti ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: fi … kún
  rationale: 'Ọ̀rọ̀ yìí ní agbára ìkójọpọ̀ níbí: Hẹrọdu ṣe iṣẹ́ búburú mìíràn sí àwọn ti iṣáájú. “Fi … kún” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yẹn mọ́.'
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ń tọ́ka sí iṣẹ́ tí gbólóhùn tó tẹ̀ lé sọ, ìyẹn títì Johanu mọ́ ẹ̀wọ̀n.
- source_word: ἐπὶ πᾶσιν
  choice: gbogbo ìwà búburú rẹ̀
  rationale: Ní ìbámu pẹ̀lú ẹsẹ 19, gbólóhùn náà túmọ̀ sí pé Hẹrọdu fi iṣẹ́ yìí kún gbogbo iṣẹ́ búburú tó ti ṣe. A mú ohun tí àyíká ọ̀rọ̀ fi hàn jáde ní Yorùbá, ṣùgbọ́n àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
- source_word: κατέκλεισεν
  choice: ti … mọ́
  rationale: “Ti … mọ́” pa àwòrán gidi ti pípa ènìyàn mọ́ sínú ibi kan mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe déédéé.
- source_word: Ἰωάννην
  choice: Johanu
  rationale: A lo ìkọ̀wé orúkọ náà gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: ἐν φυλακῇ
  choice: inú ẹ̀wọ̀n
  rationale: φυλακή níbí jẹ́ ibi tí a ti ń fi ẹni tí a mú sí; “inú ẹ̀wọ̀n” jẹ́ ọ̀nà Yorùbá àdánidá àti kedere.
theological_decisions:
- issue: Ohun tí ἐπὶ πᾶσιν ń tọ́ka sí àti agbára rẹ̀
  choice: Hẹrọdu fi títì Johanu mọ́ ẹ̀wọ̀n kún gbogbo ìwà búburú rẹ̀ tẹ́lẹ̀.
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà tó sún mọ́ lẹ́tà pé, “Ó tún fi èyí kún gbogbo wọn.”
  rationale: Àyíká ẹsẹ 19–20 sọ̀rọ̀ nípa àwọn ìwà búburú Hẹrọdu; nítorí náà, ìtumọ̀ ìkójọpọ̀ yìí ni àyíká ọ̀rọ̀ ń tọ́ka sí. Ẹsẹ̀ ìsàlẹ̀ jẹ́ kí àìdánilójú kékeré inú gbólóhùn Gíríìkì ṣì hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A yan “ti … mọ́ inú ẹ̀wọ̀n” láti pa àwòrán gidi ọ̀rọ̀ Gíríìkì mọ́ láì ṣe àsọtúnsọ tí kò dùn mọ́ etí.
