  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: yo
  text: ọmọ Káinámù[a][b], ọmọ Arifaksadi[c], ọmọ Ṣemu, ọmọ Noa, ọmọ Lameki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ Gẹ̀ẹ́sì kan máa ń kọ orúkọ yìí sí “Kainan.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìbílẹ̀ ọ̀rọ̀ kan yọ Káinámù kúrò níbí, kí ìtòlẹ́sẹẹsẹ ìran náà lè bá àwọn ìrísí kan nínú Májẹ̀mú Láéláé mu dáadáa sí i.
    reason: textual_variant
  - marker: c
    text: “Arifaksadi” tẹ̀ lé ìrísí Gíríìkì inú Lúùkù; fi wé orúkọ inú Májẹ̀mú Láéláé tí a sábà máa ń kọ sí “Aripakishadi.”
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtòlẹ́sẹẹsẹ ìran yìí, àpilẹ̀kọ oníjẹnítífù tí a tún sọ níwájú orúkọ kọ̀ọ̀kan dúró fún ìbátan ìran tí àyíká ti fi hàn. “Ọmọ” sọ ìbátan náà di mímọ́ ní Yorùbá láìsọ ọ̀rọ̀ tí kò pọndandan.
- source_word: Καϊνὰμ
  choice: Káinámù
  rationale: A kọ orúkọ Gíríìkì náà ní ìbámu pẹ̀lú ìró rẹ̀, a sì fi fáwẹ́lì ìparí kún un kí ó lè dùn bí Yorùbá àdánidá.
- source_word: Ἀρφαξὰδ
  choice: Áfásádì
  rationale: Yíyan yìí tẹ̀ lé ìrísí àti ìró orúkọ Gíríìkì inú Lúùkù, dípò fífi ìrísí Hébérù inú Májẹ̀mú Láéláé rọ́pò rẹ̀.
- source_word: Σὴμ
  choice: Ṣémù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìró Gíríìkì, ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: Νῶε
  choice: Nóà
  rationale: “Nóà” ni ìrísí orúkọ yìí tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwọn òǹkàwé Yorùbá.
- source_word: Λάμεχ
  choice: Lámékì
  rationale: A kọ orúkọ náà ní ọ̀nà tó sún mọ́ ìró Gíríìkì, pẹ̀lú fáwẹ́lì ìparí fún ìsọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Wíwà Káinámù nínú ìtòlẹ́sẹẹsẹ ìran Lúùkù láàárín Áfásádì àti Ṣémù
  choice: A pa Káinámù mọ́ sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ó ṣe wà nínú SBLGNT.
  alternative: Àwọn àṣà àfọwọ́kọ tàbí ìṣọ̀kan kan yọ Káinámù kúrò, kí ìtòlẹ́sẹẹsẹ náà lè bá àwọn ìrísí Májẹ̀mú Láéláé kan mu dáadáa sí i.
  rationale: Ọ̀rọ̀ Gíríìkì tí a yàn ní Καϊνὰμ; nítorí náà, ìtumọ̀ gbọdọ̀ pa ẹ̀rí Lúùkù mọ́, kì í ṣe láti mú un bá Jẹ́nẹ́sísì mu ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A lo ọ̀rọ̀ ṣókí, ọ̀wọ̀, àti ìtẹ̀síwájú “ọmọ” láti pa ìrísí ìtòlẹ́sẹẹsẹ ìran mọ́. Àwọn orúkọ ni a mú bá ètò ìró Yorùbá mu, ṣùgbọ́n a ṣọ́ra láti tẹ̀ lé orísun Gíríìkì.
