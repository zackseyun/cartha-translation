  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: yo
  text: ọmọ Mẹtúsélà, ọmọ Énọ́kù, ọmọ Jérédì, ọmọ Mahalaleeli, ọmọ Kainamu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, Καϊνάμ (Kainamu); a tún lè kọ ọ́ sí “Kainani,” tàbí “Kenani” nígbà tí a bá mú un bá àwọn ìtàn ìran inú Májẹ̀mú Láéláé mu. Ọ̀rọ̀ Gíríìkì nínú Lúùkù ní orúkọ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Àpilẹ̀kọ akọ tí a tún ń lò ní ọ̀nà ìní ní inú ìtàn ìran yìí ń bá gbólóhùn ìran tí ó ti bẹ̀rẹ̀ tẹ́lẹ̀ lọ. “Ọmọ” sọ ìbátan ìran náà di mímọ́ ní Yorùbá láì mú kí gbólóhùn náà wuwo.
- source_word: Μαθουσαλά
  choice: Mẹtúsélà
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó bá ìpè Yorùbá mu, tí ó sì jẹ́ kí a lè dá ẹni tí orúkọ náà ń tọ́ka sí nínú Májẹ̀mú Láéláé mọ̀.
- source_word: Ἑνώχ
  choice: Énọ́kù
  rationale: Ìkọ̀wé Yorùbá tó ṣeé kà fún orúkọ Gíríìkì náà, pẹ̀lú fáwẹ́lì ìparí tí ìpè Yorùbá nílò.
- source_word: Ἰάρετ
  choice: Jérédì
  rationale: Ìrísí orúkọ tó bá ìpè Yorùbá mu, tó sì jẹ́ mímọ̀ gẹ́gẹ́ bí orúkọ ẹni inú ìtàn ìran.
- source_word: Μαλελεήλ
  choice: Mahalaleeli
  rationale: A lo ìrísí tí ó jọ orúkọ ẹni náà nínú ìtàn ìran Májẹ̀mú Láéláé, láì pa ìdánimọ̀ orúkọ Gíríìkì rẹ́ rẹ́.
- source_word: Καϊνάμ
  choice: Kainamu
  rationale: A tú orúkọ tí ó wà nínú ọ̀rọ̀ Gíríìkì Lúùkù jáde ní tààrà, dípò kí a mú un bá ìrísí orúkọ kan nínú àwọn àṣà ìtàn ìran Májẹ̀mú Láéláé mu.
theological_decisions:
- issue: Àkékúrú ìtàn ìran nínú àwọn ọ̀rọ̀ ìní tí a tún sọ
  choice: Lo “ọmọ” níwájú orúkọ kọ̀ọ̀kan
  alternative: Fi ọ̀wọ́ àwọn orúkọ ìní sílẹ̀ láì sọ ìbátan wọn ní kedere
  rationale: Nínú àyíká ìtàn ìran, àwọn ọ̀rọ̀ ìní náà túmọ̀ sí pé ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ jẹ́ ọmọ ẹni tó tẹ̀ lé e. “Ọmọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti ẹ̀dá.
- issue: Bí a ṣe máa tú Καϊνάμ nínú ìtàn ìran Lúùkù
  choice: Fi Kainamu sínú ọ̀rọ̀ pàtàkì
  alternative: Kainani tàbí Kenani
  rationale: Ọ̀rọ̀ Gíríìkì Lúùkù ní orúkọ Καϊνάμ níbí; nítorí náà, a kò yẹ kí a yọ ọ́ kúrò tàbí kí a dákẹ́ mú un bá ìtàn ìran Májẹ̀mú Láéláé mu. Àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìrísí mìíràn mọ́ fún àyẹ̀wò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tó ní iyì, tó sì ṣeé lóye. A lo “ọmọ” gẹ́gẹ́ bí àṣà Yorùbá fún ìtàn ìran; a sì fi àmì ohùn sí àwọn orúkọ níbi tí ìpè wọn ṣe dájú, ṣùgbọ́n a kò fipá fi àmì ohùn àròsọ sí orúkọ tí ìpè rẹ̀ lè yàtọ̀.
