id: LUK.3.14
reference: Luke 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: yo
  text: Àwọn ọmọ ogun pẹ̀lú ń béèrè lọ́wọ́ rẹ̀ pé, “Àwa náà ńkọ́, kí ni kí a ṣe?” Ó sì wí fún wọn pé, “Ẹ má ṣe fi ipá gba ohunkóhun lọ́wọ́ ẹnikẹ́ni[a], ẹ má sì ṣe fi ẹ̀sùn èké kan ẹnikẹ́ni; ẹ máa ní ìtẹ́lọ́rùn pẹ̀lú owó iṣẹ́ yín[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gidi rírì ẹni tàbí fífi ẹ̀rù bà á; níbí, ó ń tọ́ka sí lílo agbára tàbí ìhalẹ̀ láti gba ohun-ìní lọ́wọ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: “Owó iṣẹ́” lè tún ní ìtumọ̀ “owó tàbí ìpèsè tí ọmọ ogun ń gbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: àwọn ọmọ ogun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ń ṣiṣẹ́ ológun; ‘àwọn ọmọ ogun’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká náà mu.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Àwa náà ńkọ́, kí ni kí a ṣe?
  rationale: Ìbéèrè ‘kí ni kí a ṣe?’ fi ìpinnu tí wọ́n ń wá hàn, ‘Àwa náà ńkọ́’ sì pa ìtẹnumọ́ καὶ ἡμεῖς mọ́ ní Yorùbá àdánidá.
- source_word: διασείσητε
  choice: fi ipá gba ohunkóhun lọ́wọ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí lílo ìhalẹ̀ tàbí agbára ipò láti gba ohun-ìní; yíyàn yìí mú ìtumọ̀ ìfipámúni náà jáde láìlo ọ̀rọ̀ àjèjì.
- source_word: συκοφαντήσητε
  choice: fi ẹ̀sùn èké kan
  rationale: Ó sọ ìfisùn tí kò jẹ́ òótọ́ ní kedere, ó sì yẹ fún àyíká ìkìlọ̀ nípa lílo agbára lọ́nà búburú.
- source_word: ἀρκεῖσθε
  choice: kí ... tó yín
  rationale: Gbólóhùn Yorùbá yìí sọ ìtẹ́lọ́rùn àti jíjẹ́ kí ohun tí ènìyàn ní tó o, gẹ́gẹ́ bí àṣẹ tí ó ń bá a lọ.
- source_word: ὀψωνίοις
  choice: owó iṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí owó tàbí ìpèsè tí ọmọ ogun ń gbà; ‘owó iṣẹ́’ jẹ́ kedere fún òǹkàwé òde òní, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ààyè sí ìtumọ̀ tó gbooro.
theological_decisions:
- issue: Ìtọ́ni ìwà rere fún àwọn ọmọ ogun
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìtọ́ni fún àwọn ọmọ ogun láti má ṣe lo agbára wọn fún ìfipámúni tàbí ẹ̀sùn èké, kí wọ́n sì ní ìtẹ́lọ́rùn pẹ̀lú owó iṣẹ́ wọn.
  alternative: Kí a túmọ̀ ẹsẹ náà bí ìdálẹ́bi iṣẹ́ ológun fúnra rẹ̀.
  rationale: Ẹsẹ náà kò pàṣẹ fún wọn pé kí wọ́n fi iṣẹ́ ológun sílẹ̀; ó dáhùn sí wọn nípa àwọn ìwà búburú pàtó. Ìtumọ̀ náà kò fi ìpinnu ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Àwa náà ńkọ́’ jẹ́ ọ̀nà àdánidá láti pa ìtẹnumọ́ Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
