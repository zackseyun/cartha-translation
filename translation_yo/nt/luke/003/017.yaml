reference: Luke 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: yo
  text: Oríta fífẹ́ ọkà[a] wà ní ọwọ́ rẹ̀ láti mú pápá ìpakà rẹ̀ mọ́ pátápátá, àti láti kó àlìkámà jọ sínú àká rẹ̀[b]; ṣùgbọ́n ìyàngbò ni yóò fi iná tí a kò lè paná rẹ̀[c] jó pátápátá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣọ́bù tí a fi ń fẹ́ ọkà,” tàbí, gẹ́gẹ́ bí a ti ń pè é tẹ́lẹ̀, “afẹ́fẹ́ ọkà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò tí a fi ń ju ọkà sókè kí afẹ́fẹ́ lè ya hóró ọkà sọ́tọ̀ kúrò nínú ìyàngbò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ilé ìkó-ọkà sí” tàbí “ilé ìtọ́jú ọkà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “iná tí kò lè kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: ọ̀pá oríta tí a fi ń fẹ́ ọkà
  rationale: Ó tọ́ka sí ohun èlò iṣẹ́ àgbẹ̀ tí a fi ń ju ọkà sókè kí afẹ́fẹ́ lè ya hóró ọkà sọ́tọ̀ kúrò lára ìyàngbò. Àpèjúwe yìí ṣe kedere ní Yorùbá òde òní, ó sì pa ìrísí ohun èlò náà mọ́.
- source_word: διακαθᾶραι
  choice: láti fọ ... mọ́ pátápátá
  rationale: Ó mú agbára ọ̀rọ̀ ìṣe àkópọ̀ Gíríìkì jáde pé iṣẹ́ fífọ́ tàbí mímú kúrò náà yóò pé tán.
- source_word: ἅλωνα
  choice: ilẹ̀ ìpakà
  rationale: Èyí ni ibi tí a ti ń pa ọkà, tí a sì ti ń fẹ́ ẹ; ó pa àwòrán iṣẹ́ àgbẹ̀ inú ẹsẹ náà mọ́.
- source_word: συναγαγεῖν
  choice: láti kó ... jọ
  rationale: Ó túmọ̀ sí kíkó ohun tí a ti yà sọ́tọ̀ papọ̀, ó sì bá ọ̀nà tí a fi ń kó hóró ọkà lẹ́yìn fífẹ́ rẹ̀ mu.
- source_word: σῖτον
  choice: àlìkámà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ọkà lápapọ̀, àlìkámà ni ó bá ìyàtọ̀ rẹ̀ sí ìyàngbò mu jù ní àyíká yìí.
- source_word: ἀποθήκην
  choice: àká
  rationale: Àká jẹ́ ibi ìtọ́jú ọkà tí ó bá àwòrán iṣẹ́ àgbẹ̀ mu, láìfi irú ilé kan pàtó kún ohun tí Gíríìkì sọ.
- source_word: ἄχυρον
  choice: ìyàngbò
  rationale: Nínú fífẹ́ ọkà, èyí ni ìyókù fẹ́lẹ́fẹ́lẹ́ tí a yà kúrò lára hóró ọkà; kì í ṣe pòròpórò ọkà lásán.
- source_word: κατακαύσει
  choice: yóò ... jó pátápátá
  rationale: Ọ̀rọ̀ ìṣe náà ní ìtumọ̀ jíjóná tán pátápátá; gbólóhùn Yorùbá yìí mú agbára rẹ̀ jáde.
- source_word: πυρὶ ἀσβέστῳ
  choice: fi iná tí kò ṣeé pa
  rationale: Ó sọ pé kò ṣeé paná náà, láìṣàlàyé ju ohun tí àwòrán ìdájọ́ inú ẹsẹ náà sọ lọ.
- source_word: οὗ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníhun náà so ohun èlò, ilẹ̀ ìpakà, àti àká mọ́ ẹni tí ń bọ̀; lílo “rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìbáṣepọ̀ náà mọ́.
theological_decisions:
- issue: Àwòrán ìdájọ́ nínú fífẹ́ ọkà
  choice: A pa ìyàsọ́tọ̀ tó lágbára mọ́ láàárín àlìkámà tí a kó sínú àká àti ìyàngbò tí a jó pátápátá.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó gẹ́gẹ́ bí ìdájọ́ ayé lórí Ísírẹ́lì nìkan, tàbí kí a fi gbogbo ẹ̀kọ́ ìsìn kan nípa ìdájọ́ ìkẹyìn kún un.
  rationale: Ẹsẹ náà fi ìgbàlà àti ìdájọ́ hàn nípasẹ̀ àwòrán iṣẹ́ àgbẹ̀, ṣùgbọ́n kò ṣàlàyé gbogbo bí ìdájọ́ náà yóò ṣe ṣẹlẹ̀. Ìtumọ̀ náà kò dín agbára “iná tí kò ṣeé pa” kù, bẹ́ẹ̀ ni kò yanjú ohun tí ẹsẹ náà kò sọ.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Ọ̀pá oríta tí a fi ń fẹ́ ọkà” ṣàlàyé ohun èlò tí ó lè má mọ̀ọ́mọ̀ jẹ́ mímọ̀ fún ọ̀pọ̀ ènìyàn; àwọn ọ̀rọ̀ bí “ilẹ̀ ìpakà,” “àká,” àti “ìyàngbò” sì pa àwòrán iṣẹ́ àgbẹ̀ mọ́. A fi àmì ohùn sí ibi tí ó bá èdè àkọsílẹ̀ Yorùbá mu.
