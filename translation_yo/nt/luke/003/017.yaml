  to: Oríta fífẹ́ ọkà[a] wà ní ọwọ́ rẹ̀ láti mú pápá ìpakà rẹ̀ mọ́ pátápátá, àti láti kó àlìkámà jọ sínú àká rẹ̀[b]; ṣùgbọ́n ìyàngbò ni yóò fi iná tí a kò lè paná rẹ̀[c] jó pátápátá.
  rationale: 'Àtúnṣe náà mú ìfaramọ́ sí àwòrán iṣẹ́ àgbẹ̀ Gíríìkì dára síi: a “mú” pápá ìpakà mọ́ nípa yíya ìyàngbò kúrò, a kì í “fọ” ọ́ gẹ́gẹ́ bí fífọ ilẹ̀. A tún ṣàlàyé iná ἀσβέστῳ gẹ́gẹ́ bí iná tí a kò lè paná rẹ̀. Ìyókù ìtumọ̀ náà—pẹ̀lú ìyàsọ́tọ̀ láàárín àlìkámà àti ìyàngbò, àti agbára jíjó pátápátá—wà ní ìbámu pẹ̀lú orísun.'
