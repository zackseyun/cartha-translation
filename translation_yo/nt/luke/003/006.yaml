  text: and all flesh will see the salvation of God[a][b].
translation:
  language: yo
  text: Gbogbo ẹran ara yóò sì rí ìgbàlà Ọlọ́run[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo aráyé.” Ní ti gidi, èdè Gíríìkì ní “gbogbo ẹran ara”; èyí jẹ́ àtúnkò Aísáyà 40:5, ó sì ń tọ́ka sí gbogbo ènìyàn níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbàlà láti ọ̀dọ̀ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: yóò rí
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; ‘yóò rí’ jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ojú-rírí inú Gíríìkì mọ́.
- source_word: πᾶσα σὰρξ
  choice: gbogbo ẹran ara
  rationale: Àṣà-ọrọ àsọtẹ́lẹ̀ yìí ń tọ́ka sí gbogbo ènìyàn, ó sì ń dún bí Isaiah 40:5. Mímú ‘ẹran ara’ sílẹ̀ pa ìsopọ̀ yẹn àti àwòrán gangan mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ ṣàlàyé ìtumọ̀ rẹ̀.
- source_word: σωτήριον
  choice: ìgbàlà
  rationale: A lo ọ̀rọ̀ náà gẹ́gẹ́ bí ọ̀rọ̀-orúkọ pẹ̀lú àpèjúwe; ‘ìgbàlà’ jẹ́ ìtumọ̀ tààrà, ó sì gba gbogbo ìwọ̀n iṣẹ́ ìgbàlà Ọlọ́run.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ orúkọ Yorùbá ‘ìgbàlà Ọlọ́run’ pa genitive Gíríìkì mọ́ láì fi dandan pinnu bóyá ó túmọ̀ sí ohun tí Ọlọ́run ní tàbí ohun tó ti ọ̀dọ̀ rẹ̀ wá.
theological_decisions:
- issue: Ìtumọ̀ àṣà-ọrọ πᾶσα σὰρξ
  choice: 'Ó ní ìwọ̀n gbogbo aráyé: gbogbo ènìyàn yóò rí ìgbàlà Ọlọ́run.'
  alternative: Kí a ka a ní ti gidi gẹ́gẹ́ bí gbogbo ẹ̀dá tó ní ẹran ara.
  rationale: Nínú àyíká ọ̀rọ̀, ó jẹ́ àyọlò láti inú Isaiah, ó sì ń tọ́ka sí aráyé lápapọ̀. Ọ̀rọ̀ pàtàkì ‘ẹran ara’ wà nínú ẹsẹ̀ láti pa ìró àti ìsopọ̀ Ìwé Mímọ́ mọ́, nígbà tí àlàyé ṣàfihàn ẹni tí ó ń tọ́ka sí.
- issue: Ìbáṣepọ̀ genitive nínú τοῦ θεοῦ
  choice: ‘ìgbàlà Ọlọ́run,’ tí kò fi dandan pinnu bóyá ti Ọlọ́run ni tàbí ó ti ọ̀dọ̀ Ọlọ́run wá.
  alternative: ‘ìgbàlà láti ọ̀dọ̀ Ọlọ́run.’
  rationale: Gíríìkì lè jẹ́ ti ẹni tó ni í tàbí orísun. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú tòótọ́ yẹn mọ́; a fi ìtumọ̀ orísun sínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A yan ‘ẹran ara’ láti pa àṣà-ọrọ àsọtẹ́lẹ̀ mọ́, pẹ̀lú àlàyé fún ìtumọ̀ rẹ̀.
