source:
  edition: SBLGNT
  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: yo
  text: Ó sì wá sí gbogbo agbègbè tó yí odò Jọ́dánì ká[a], ó ń kéde[b] ìbátísí ìrònúpìwàdà fún ìdáríjì àwọn ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì wá ká gbogbo agbègbè tó wà ní àyíká odò Jọ́dánì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń wàásù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: ó sì lọ sí
  rationale: Nínú ìtàn Yorùbá, “lọ sí” fi ìṣíkiri Jòhánù wọ agbègbè náà hàn lọ́nà àdánidá. Ọ̀rọ̀ Gíríìkì ἔρχομαι lè túmọ̀ sí ‘wá’ tàbí ‘lọ’ gẹ́gẹ́ bí ibi tí a ti ń wo ìṣíkiri náà.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: sí gbogbo ẹkùn tó yí odò Jọ́dánì ká
  rationale: “Gbogbo ẹkùn” ṣàfihàn πᾶσαν περίχωρον, “tó yí ... ká” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ agbègbè tó wà ní àyíká Jọ́dánì. Fífi “odò” kún un mú kí orúkọ ibi náà ṣe kedere fún òǹkàwé òde òní.
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: “Kéde” mú ìtumọ̀ ìkéde ní gbangba tí κηρύσσω ní jáde, láìfi ọ̀rọ̀ náà mọ́ iṣẹ́ ìwàásù inú ilé ìjọ nìkan.
- source_word: βάπτισμα
  choice: ìbatisí
  rationale: “Ìbatisí” ni ọ̀rọ̀ Yorùbá tí a mọ̀ sí rere fún ìṣe ìbatisí tàbí ìwẹ̀ àṣà tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí níhìn-ín.
- source_word: μετανοίας
  choice: ìrònúpìwàdà
  rationale: “Ìrònúpìwàdà” sọ ìyípadà ọkàn àti ìpadà kúrò nínú ẹ̀ṣẹ̀ ní èdè Yorùbá tó mọ́gbọ́n dání. Ìsopọ̀ taara “ìbatisí ìrònúpìwàdà” pa ìbáṣepọ̀ genitive náà mọ́ láìṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: fún ìdáríjì àwọn ẹ̀ṣẹ̀
  rationale: “Fún ìdáríjì àwọn ẹ̀ṣẹ̀” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún gbolohun náà, ó sì pa ìbáṣepọ̀ tó wà láàárín ìbatisí, ìrònúpìwàdà àti ìdáríjì mọ́ láìdáhùn àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ kan.
theological_decisions:
- issue: Ìbáṣepọ̀ ìbatisí, ìrònúpìwàdà àti ìdáríjì
  choice: ìbatisí ìrònúpìwàdà fún ìdáríjì àwọn ẹ̀ṣẹ̀
  alternative: ìbatisí tó ń fi ìrònúpìwàdà hàn, èyí tó ń yọrí sí ìdáríjì
  rationale: Ìtumọ̀ náà tẹ̀ lé ìṣètò βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν, kò sì pinnu bóyá ìbatisí jẹ́ ohun èlò, àmì, tàbí ìkéde nípa ìdáríjì. Nípa bẹ́ẹ̀, a pa àìṣe kedere àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ inú orísun náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan “kéde” dípò “wàásù” nínú ọ̀rọ̀ pàtàkì láti fi agbára ìkéde ní gbangba hàn.
