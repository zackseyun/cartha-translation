id: LUK.3.19
reference: Luke 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: yo
  text: Ṣùgbọ́n Hẹ́rọ́dù, tẹ́tírárkì náà[a], nígbà tí ẹni náà ń bá a wí[b] nípa Hẹ́rọ́díà, aya arákùnrin rẹ̀, àti nípa gbogbo ohun búburú tí Hẹ́rọ́dù ti ṣe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èdè Gíríìkì ní tẹ́tírárkì, oyè ìṣèlú kan tí ìtumọ̀ rẹ̀ ní ìbẹ̀rẹ̀ jẹ́ ‘olùṣàkóso ìdá kan nínú mẹ́rin’ ilẹ̀ kan.
    reason: historical_title
  - marker: b
    text: A tún lè tú u sí ‘ń dá a lẹ́bi’ tàbí ‘ń fi ìwà búburú rẹ̀ hàn.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbáwí lórí ìwà búburú tàbí mímú ìwà náà hàn kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: olùṣàkóso agbègbè
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ìṣèlú kan pàtó. ‘Olùṣàkóso agbègbè’ yé òǹkàwé Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ fi orúkọ oyè náà àti ìtumọ̀ rẹ̀ hàn.
- source_word: ἐλεγχόμενος
  choice: tí ẹni náà ń bá wí
  rationale: Gbólóhùn yìí pa ìṣe tó ń lọ lọ́wọ́ àti agbára ìbáwí lórí ìwà búburú mọ́, láì sọ ọ́ di ẹjọ́ òfin tàbí kìkì ìdojúkọ.
- source_word: ὑπ’ αὐτοῦ
  choice: ẹni náà
  rationale: Orísun lo arọ́pò-orúkọ tí ó ń tọ́ka sí Jòhánù nínú àyíká ọ̀rọ̀; a kò fi orúkọ Jòhánù kún ọ̀rọ̀ pàtàkì.
- source_word: περὶ Ἡρῳδιάδος
  choice: nípa Hẹrodíà
  rationale: ‘Nípa’ ṣe àfihàn ohun tí ìbáwí náà dá lé, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: aya arákùnrin rẹ̀
  rationale: Èyí jẹ́ ìtúmọ̀ Yorùbá àdánidá tí ó pa ìbátan tó ṣe pàtàkì sí ẹ̀sùn náà mọ́.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: àti nípa gbogbo ohun búburú tí Hẹ́rọ́dù ti ṣe
  rationale: Ìtúmọ̀ náà pa àtúnṣe ‘nípa’ mọ́, ó sì fi hàn pé ọ̀pọ̀ iṣẹ́ búburú Hẹ́rọ́dù ni ọ̀rọ̀ náà kàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora inú ìtàn sí ohun tó ṣáájú hàn lọ́nà àdánidá.
theological_decisions:
- issue: Agbára ìwà rere inú ìbáwí Jòhánù sí Hẹ́rọ́dù
  choice: tí ẹni náà ń bá wí
  alternative: tí ẹni náà ń tú àṣírí ìwà rẹ̀ síta; tí ẹni náà ń fi ẹ̀sùn kàn
  rationale: ‘Ń bá wí’ fi ìdálẹ́bi ìwà búburú hàn láì dín ọ̀rọ̀ náà kù sí ìṣípayá àṣírí tàbí mú un di ẹjọ́ òfin.
translation_notes:
  register: A lo èdè Yorùbá òde òní tó bójú mu, tó sì ṣeé lóye. ‘Olùṣàkóso agbègbè’ mú oyè àjèjì náà sún mọ́ òǹkàwé, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ìtàn rẹ̀ mọ́. ‘Ẹni náà’ pa arọ́pò-orúkọ inú orísun mọ́; àyíká ọ̀rọ̀ ló fi hàn pé Jòhánù ni.
