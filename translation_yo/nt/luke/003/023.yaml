source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: yo
  text: Jésù fúnra rẹ̀ sì, nígbà tí ó bẹ̀rẹ̀, fẹ́rẹ̀ẹ́ tó ọgbọ̀n ọdún; ó jẹ́ ọmọ Jóṣéfù—gẹ́gẹ́ bí a ti rò—Jóṣéfù náà sì jẹ́ ọmọ Hélì.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìbẹ̀rẹ̀.” Gíríìkì kò sọ “iṣẹ́ ìránṣẹ́ rẹ̀” ní gbangba, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí i.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, Jésù ni a máa ń ka sí ọmọ Jóṣéfù.
    reason: alternative_reading
  - marker: c
    text: Ní tààrà, Gíríìkì ní “Jóṣéfù, ti Hélì”; nínú àtòjọ ìran, ìtumọ̀ rẹ̀ ni “Jóṣéfù, ọmọ Hélì.”
    reason: source_form
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tí ó bá Yorùbá mu, tó sì so ẹsẹ yìí mọ́ ìṣẹ̀lẹ̀ ìbatisí tó ṣáájú.
- source_word: αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ nínú ọ̀rọ̀ ‘Jésù fúnra rẹ̀.’
- source_word: ἀρχόμενος
  choice: nígbà tí ó bẹ̀rẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì yàgò fún fífi ‘iṣẹ́ ìránṣẹ́ rẹ̀’ kún un, nítorí pé kò sí ní gbangba nínú Gíríìkì.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: ẹni bí ẹni ọgbọ̀n ọdún
  rationale: Ó sọ ọjọ́ orí tí a fi sí àfojúsùn, ó sì pa ìtumọ̀ ὡσεὶ (‘bí ẹni pé,’ ‘ìwọ̀n’) mọ́.
- source_word: ὢν υἱός
  choice: ó sì jẹ́ ọmọ
  rationale: Ó ṣí ìdánimọ̀ ìran sílẹ̀ ní Yorùbá tó ṣe kedere láì fi ìtumọ̀ míì kún un.
- source_word: ὡς ἐνομίζετο
  choice: gẹ́gẹ́ bí àwọn ènìyàn ti rò
  rationale: Ó fi hàn pé èrò tí gbogbo ènìyàn ní ni, kì í ṣe ìjẹ́rìí Lúùkù pé Jóṣéfù ni baba rẹ̀ nípa ẹ̀jẹ̀.
- source_word: Ἰωσὴφ τοῦ Ἠλὶ
  choice: Jóṣéfù … ọmọ Hélì
  rationale: Nínú àtòjọ ìran Yorùbá, fífi ‘ọmọ’ hàn jẹ́ kedere ju gẹnitífù Gíríìkì tí a fi ọ̀rọ̀ sílẹ̀ lọ; ó so Jóṣéfù mọ́ Hélì gẹ́gẹ́ bí àtòjọ náà ṣe ń lọ.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘gẹ́gẹ́ bí àwọn ènìyàn ti rò’ pẹ̀lú jíjẹ́ Jésù ọmọ Jóṣéfù
  choice: Fi ọ̀rọ̀ náà sí àárín àmì ìyapa láti fi hàn pé àwọn ènìyàn ló ka Jésù sí ọmọ Jóṣéfù.
  alternative: Kí a kọ ọ́ láìsí àmì ìyapa, tàbí kí a mú un bí àlàyé àwùjọ lásán.
  rationale: 'Èyí pa ìfọ̀rọ̀wérọ̀ inú ìtàn Lúùkù mọ́: a mọ Jésù sí ọmọ Jóṣéfù ní ojú àwùjọ, ṣùgbọ́n ẹsẹ yìí kò sọ pé Jóṣéfù ni baba rẹ̀ nípa ẹ̀jẹ̀.'
- issue: Bóyá kí a fi ‘iṣẹ́ ìránṣẹ́ rẹ̀’ kún ‘nígbà tí ó bẹ̀rẹ̀’
  choice: Má ṣe fi ‘iṣẹ́ ìránṣẹ́ rẹ̀’ sínú ọ̀rọ̀ pàtàkì.
  alternative: ‘nígbà tí ó bẹ̀rẹ̀ iṣẹ́ ìránṣẹ́ rẹ̀’
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìbẹ̀rẹ̀ iṣẹ́ rẹ̀ ní gbangba, ṣùgbọ́n ọ̀rọ̀ ‘iṣẹ́ ìránṣẹ́’ kò sí nínú orísun Gíríìkì.
- issue: Ẹni tí ‘ọmọ Hélì’ ń tọ́ka sí
  choice: Jóṣéfù ni ‘ọmọ Hélì’ ń ṣe àlàyé rẹ̀.
  alternative: Kí a pa fọ́ọ̀mù aláìpé ‘Jóṣéfù, ti Hélì’ mọ́.
  rationale: Àtòjọ gẹnitífù Gíríìkì bẹ̀rẹ̀ pẹ̀lú Jóṣéfù, lẹ́yìn náà Hélì; Yorùbá nílò ‘ọmọ’ fún ìtumọ̀ tó ṣe kedere, láìsọ pé Hélì ni baba Jésù ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìtàn-kíkà tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún lórí àwọn ọ̀rọ̀ Yorùbá; àwọn orúkọ ni a kọ ní ìrísí Yorùbá tí ó wọ́pọ̀. Àmì ìyapa yí àlàyé ὡς ἐνομίζετο ká kí ìtumọ̀ rẹ̀ má bà a dàpọ̀ mọ́ ìlà ìran.
