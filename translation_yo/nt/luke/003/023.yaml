  to: Jésù fúnra rẹ̀ sì, nígbà tí ó bẹ̀rẹ̀, fẹ́rẹ̀ẹ́ tó ọgbọ̀n ọdún; ó jẹ́ ọmọ Jóṣéfù—gẹ́gẹ́ bí a ti rò—Jóṣéfù náà sì jẹ́ ọmọ Hélì.[a][b][c]
