  source_fidelity: Ìtumọ̀ náà pa ìtẹnumọ́ nínú ‘Jésù fúnra rẹ̀,’ ìbẹ̀rẹ̀ tí a kò sọ ohun tí a bẹ̀rẹ̀ rẹ̀ ní pàtó, àti ìyàsọ́tọ̀ ‘gẹ́gẹ́ bí a ti rò’ mọ́. Ṣùgbọ́n ‘ẹni bí ẹni ọgbọ̀n ọdún’ kò gbé ὡσεὶ ἐτῶν τριάκοντα kalẹ̀ dáadáa, ó sì dà bí ìsọ̀rọ̀ ọjọ́-orí tí kò péye. ‘Ó fẹ́rẹ̀ẹ́ tó ọgbọ̀n ọdún’ jẹ́ ìsọ̀rọ̀ Yorùbá tí ó dára fún ìwọ̀n ọjọ́-orí náà.
  naturalness: Àkọsílẹ̀ ìbẹ̀rẹ̀ ní àmì ìdákẹ́jẹ lẹ́yìn ‘sì’ kò rọrùn nínú Yorùbá. Pẹ̀lú èyí, ìtẹ̀lé ‘ọmọ Jóṣéfù … ọmọ Hélì’ lè mú kí ó dà bí ẹni pé Jésù ni ọmọ Hélì ní tààrà. Fífi Hélì so mọ́ Jóṣéfù ní kedere ń jẹ́ kí ìlà ìran náà rọrùn láti ka.
  terminology: Jésù, Jóṣéfù, àti Hélì jẹ́ àwọn orúkọ tí ó yẹ. ‘gẹ́gẹ́ bí a ti rò’ pa agbára ọ̀rọ̀ ὡς ἐνομίζετο mọ́ láì sọ pé gbogbo ènìyàn ni wọ́n rò bẹ́ẹ̀, nítorí ‘àwọn ènìyàn’ kò sí ní pàtó nínú Gíríìkì.
