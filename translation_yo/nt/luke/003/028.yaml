base_translation:
  language: en
  yaml_path: translation/nt/luke/003/028.yaml
  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: yo
  text: ọmọ Mẹlkì[a], ọmọ Addì, ọmọ Kosamu, ọmọ Elmadamu, ọmọ Eri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, àpilẹ̀kọ oníjẹnítífù náà nìkan ni a tún ṣe níwájú orúkọ kọ̀ọ̀kan; àyíká ìtàn ìran fi hàn pé ìbáṣepọ̀ ọmọ ni a túmọ̀ rẹ̀ sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Àpilẹ̀kọ oníjẹnítífù tí a tún ṣe níwájú orúkọ kọ̀ọ̀kan ń bá ìlànà ìtàn ìran tẹ̀ síwájú; “ọmọ” sọ ìbáṣepọ̀ náà di mímọ́ ní Yorùbá láìfi ọ̀rọ̀ tí kò sí nínú àyíká kún un.
- source_word: Μελχὶ
  choice: Mẹlkì
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tí ó ṣeé kà ní Yorùbá.
- source_word: Ἀδδὶ
  choice: Addì
  rationale: A ṣàkọsílẹ̀ orúkọ ẹni náà gẹ́gẹ́ bí ìró Gíríìkì rẹ̀, pẹ̀lú kọ́ńsónántì méjì tí ọ̀rọ̀ orísun ní.
- source_word: Κωσὰμ
  choice: Kosamu
  rationale: A lo K fún kappa Gíríìkì, a sì fi fáwẹ́lì ìparí kún un kí orúkọ náà lè ṣàn déédéé ní Yorùbá.
- source_word: Ἐλμαδὰμ
  choice: Elmadamu
  rationale: Ìkọ̀wé yìí tẹ̀lé ìró orúkọ Gíríìkì, pẹ̀lú fáwẹ́lì ìparí fún ìsọ̀rọ̀ Yorùbá tí ó rọrùn.
- source_word: Ἢρ
  choice: Eri
  rationale: A ṣe àkọsílẹ̀ orúkọ náà láti inú Gíríìkì Ēr, a sì fi i parí rẹ̀ kí ó ṣeé pè ní ti ẹ̀dá-ìró Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, kedere, ọ̀wọ̀, àti ti òde òní ni a lò. A tún “ọmọ” ṣe níwájú orúkọ kọ̀ọ̀kan láti pa ìṣàn ìtàn ìran mọ́. A lo àmì ohùn níbi tí ó bá jẹ́ ti ọ̀rọ̀ Yorùbá; a sì ṣe àwọn orúkọ àjèjì ní ọ̀nà tí ó ṣeé pè ní Yorùbá.
