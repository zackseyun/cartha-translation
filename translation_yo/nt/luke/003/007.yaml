id: LUK.3.7
reference: Luke 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: yo
  text: Nítorí náà, ó ń sọ fún àwọn ogunlọ́gọ̀ tí ń jáde wá láti gba ìbatisí lọ́wọ́ rẹ̀ pé, “Ẹ̀yin ọmọ paramọ́lẹ̀[a], ta ni ó kìlọ̀ fún yín pé kí ẹ sá kúrò lọ́wọ́ ìbínú tí ń bọ̀[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin irú-ọmọ paramọ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìbínú tí yóò dé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò imperfect ní Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé Jòhánù máa ń sọ ọ́; “ó ń sọ” pa ìtumọ̀ yẹn mọ́ láìfi hàn dandan pé ó tún un sọ ní ọ̀pọ̀ ìgbà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn àti àbájáde rẹ̀.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: fún àwọn ogunlọ́gọ̀ tí ń jáde wá
  rationale: Ó tọ́ka sí ọ̀pọ̀ ènìyàn tí wọ́n ń jáde lọ sí ọ̀dọ̀ Jòhánù; “jáde wá” jẹ́ ọ̀nà àdánidá láti sọ ìṣípò yẹn ní Yorùbá.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: kí ó lè batisí wọn
  rationale: 'Ó pa ète ìjáde wọn àti agbára passive ti Gíríìkì mọ́ ní Yorùbá àdánidá: àwọn ni Jòhánù yóò batisí.'
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ẹ̀yin ọmọ paramọ́lẹ̀
  rationale: “Ọmọ” ṣàfihàn ohun tí a bí tàbí irú-ọmọ, “paramọ́lẹ̀” sì tọ́ka sí ejò olóró tí ἐχιδνῶν ń pè ní orúkọ; gbólóhùn náà tún pa agbára ìbáwí àwòrán náà mọ́.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ta ni ó kìlọ̀ fún yín
  rationale: Nínú àyíká ewu ìdájọ́, ὑποδείκνυμι ní agbára ìkìlọ̀ tàbí ìtọ́nisọ́nà, kì í ṣe fífi ohun kan hàn lásán.
- source_word: φυγεῖν
  choice: kí ẹ sá kúrò
  rationale: Ó pa àwòrán sísá kúrò níwájú ewu mọ́ dípò yíyí i sí “yè” nìkan.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: kúrò lọ́wọ́ ìbínú tí ń bọ̀
  rationale: “Ìbínú” dúró fún ὀργή, “tí ń bọ̀” sì pa èrò ohun tó ń bọ̀ tàbí tó fẹ́ dé mọ́ láìsọ àkókò rẹ̀ pàtó.
theological_decisions:
- issue: Irú ìbínú tí ὀργή ń tọ́ka sí nínú ìkìlọ̀ Jòhánù
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìbínú Ọlọ́run tí ń bọ̀ nínú ìdájọ́, láìfi ètò ẹ̀kọ́ ìgbà ìkẹyìn kan pàtó kún un.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ìdájọ́ ọjọ́ ìkẹyìn tàbí sí ìdájọ́ kan nínú ìtàn ayé.
  rationale: Àyíká Lúùkù 3 so ìrònúpìwàdà mọ́ ìdájọ́ Ọlọ́run, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ bóyá ìdájọ́ náà jẹ́ ti ọjọ́ ìkẹyìn nìkan tàbí ti ìṣẹ̀lẹ̀ kan nínú ìtàn. “Ìbínú tí ń bọ̀” pa àìsọ pàtó yẹn mọ́.
translation_notes:
  register: Yorùbá tó ṣe kedere, tó ní iyì, tí ó sì bójú mu fún òǹkàwé òde òní ni a lò. A yan “batisí” gẹ́gẹ́ bí ọ̀rọ̀ Kristẹni tí a mọ̀ ní gbogbogbòò, a sì lo “ogunlọ́gọ̀” láti pa ọ̀pọ̀ àwọn ènìyàn mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
