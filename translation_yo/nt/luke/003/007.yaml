  to: Nítorí náà, ó ń sọ fún àwọn ogunlọ́gọ̀ tí ń jáde wá láti gba ìbatisí lọ́wọ́ rẹ̀ pé, “Ẹ̀yin ọmọ paramọ́lẹ̀[a], ta ni ó kìlọ̀ fún yín pé kí ẹ sá kúrò lọ́wọ́ ìbínú tí ń bọ̀[b]?”
