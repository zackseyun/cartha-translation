  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: yo
  text: ọmọ Máátì, ọmọ Mátátíà, ọmọ Séméìnì, ọmọ Jósẹ́kì, ọmọ Jódà,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtàn ìran yìí, àpilẹ̀kọ oníjẹnítífù tí a tún sọ léraléra dúró fún ìbátan ọmọ sí baba tí àyíká ọ̀rọ̀ ti fi hàn. Lílo “ọmọ” jẹ́ kó ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Μάαθ
  choice: Máátì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tí ó bá ètò ìkọ̀wé àti ìró Yorùbá mu.
- source_word: Ματταθίου
  choice: Mátátíà
  rationale: Èyí jẹ́ àkọsílẹ̀ orúkọ Gíríìkì Ματταθίας ní fọ́ọ̀mù tí ó rọrùn fún olùkà Yorùbá láti pè.
- source_word: Σεμεῒν
  choice: Séméìnì
  rationale: A tọ̀lé ìrísí àti ìró orúkọ Gíríìkì náà, pẹ̀lú fáwẹ́lì ìparí tí ó mú kí àkójọpọ̀ kọ́ńsónáǹtì náà ṣeé pè ní Yorùbá.
- source_word: Ἰωσὴχ
  choice: Jósẹ́kì
  rationale: A ṣàfihàn ìró Ἰωσήχ ní ọ̀nà Yorùbá; “kì” dúró fún kọ́ńsónáǹtì χ ní ìparí, ó sì mú orúkọ náà ṣeé pè.
- source_word: Ἰωδὰ
  choice: Jódà
  rationale: Àkọsílẹ̀ tààrà ti Ἰωδά ni, tí a mú bá ìró àti àmì ohùn Yorùbá mu láì ṣe àfikún láti inú fọ́ọ̀mù Hébérù.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo “ọmọ” ní gbogbo ìpele láti mú ìbátan ìran tí Gíríìkì fi sílẹ̀ ní àkótán hàn gbangba. A fi àmì ohùn sí àwọn orúkọ gẹ́gẹ́ bí ìpè Yorùbá tí a yàn; àwọn àkọsílẹ̀ orúkọ lè yàtọ̀ nínú àwọn Bíbélì Yorùbá mìíràn.
