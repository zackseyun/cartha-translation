  source_fidelity: 'Ìtumọ̀ náà tọ́ka ìlànà ìran tí Gíríìkì ń tẹ̀síwájú pẹ̀lú τοῦ dáadáa. Fífúnni ní “ọmọ” fún ọkọọkan àwọn orúkọ jẹ́ ìmú-kedere tó bá àyíká ìtàn ìran náà mu, láì ṣàfikún ìtumọ̀ míì. Gbogbo orúkọ náà tẹ̀lé àwọn fọ́ọ̀mù Gíríìkì SBLGNT: Μάαθ, Ματταθίου, Σεμεῒν, Ἰωσὴχ, àti Ἰωδὰ.'
  naturalness: “Ọmọ …, ọmọ …” jẹ́ ọ̀nà Yorùbá tó ṣàlàyé, tó sì yẹ fún àtòkọ ìran. Àmì ohùn àti fáwẹ́lì ìparí àwọn orúkọ mú kí wọ́n rọrùn láti pè nínú Yorùbá, bí ó tilẹ̀ jẹ́ pé ìkọ̀wé orúkọ Bíbélì lè ní àwọn ìyàtọ̀ kékeré láàrin àwọn ìtẹ̀jáde.
  terminology: Ọ̀rọ̀ “ọmọ” yẹ níhìn-ín fún ìbátan ìran. A transliterate àwọn orúkọ dípò fífi wọ́n bá fọ́ọ̀mù Hébérù tàbí àwọn ìbágbépọ̀ mìíràn mu; èyí pa ìfararọ̀ mọ́ ẹ̀dà Gíríìkì.
