  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: yo
  text: ọmọ Ẹ́nọ́ṣì[a], ọmọ Ṣẹ́tì, ọmọ Ádámù, ọmọ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, a tún àgbékalẹ̀ ọ̀rọ̀ ìbátan náà ṣe pé, ‘ti Ẹ́nọ́ṣì, ti Ṣẹ́tì, ti Ádámù, ti Ọlọ́run’; a fi ‘ọmọ’ kún un ní Yorùbá nítorí àgbékalẹ̀ ìtàn ìran tó ti hàn kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: ọmọ Ẹ́nọ́ṣì
  rationale: Àgbékalẹ̀ oníbàátan náà ń tẹ̀ síwájú nínú ìtàn ìran Lúùkù; ọ̀rọ̀ ìbátan ‘ọmọ’ ni a lóye pé ó yọ kúrò, nítorí náà a fi í hàn ní Yorùbá fún ìtumọ̀ tó ṣe kedere. ‘Ẹ́nọ́ṣì’ jẹ́ ìkọ orúkọ náà ní ìbámu pẹ̀lú bí Yorùbá ṣe ń pe àwọn orúkọ Bíbélì.
- source_word: τοῦ Σὴθ
  choice: ọmọ Ṣẹ́tì
  rationale: Àpẹẹrẹ gírámà kan náà ń fi ìbátan ọmọ sí baba hàn. A lo ‘Ṣẹ́tì’ gẹ́gẹ́ bí ìkọ orúkọ náà ní Yorùbá.
- source_word: τοῦ Ἀδὰμ
  choice: ọmọ Ádámù
  rationale: Àtòjọ ìran náà ń bá ìbátan ọmọ sí baba lọ. Níbí, Ἀδάμ jẹ́ orúkọ ẹni, kì í ṣe ọ̀rọ̀ gbogbogbò fún ‘ènìyàn’; nítorí náà a kọ ọ́ sí ‘Ádámù’.
- source_word: τοῦ θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: Gbólóhùn oníbàátan ìkẹyìn bá àpẹẹrẹ gbogbo àtòjọ náà mu, nítorí náà ‘ọmọ’ ṣì jẹ́ ọ̀rọ̀ ìbátan tí a lóye. ‘Ọlọ́run’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún Ọlọ́run gẹ́gẹ́ bí ẹni tí θεοῦ ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ τοῦ θεοῦ ní òpin ìtàn ìran Ádámù
  choice: ọmọ Ọlọ́run
  alternative: ti Ọlọ́run; láti ọ̀dọ̀ Ọlọ́run
  rationale: Ní ìrísí gírámà, Gíríìkì ní gbólóhùn oníbàátan nìkan, ṣùgbọ́n nínú àtòjọ ìran Lúùkù, ìbátan ọmọ ni àpẹẹrẹ tó ń tẹ̀ síwájú. ‘Ọmọ Ọlọ́run’ pa ìṣọ̀kan lítíréṣọ̀ àti agbára ọ̀rọ̀ náà mọ́, láìfi èrò nípa ipò ọmọ Kristi kún ohun tí ẹsẹ̀ náà sọ nípa Ádámù.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu. A yọ ‘ọmọ’ kejìkejì síta bí àtòjọ ìran Yorùbá ṣe máa ń rí, ṣùgbọ́n a pa àpẹẹrẹ ìbátan orísun mọ́.
