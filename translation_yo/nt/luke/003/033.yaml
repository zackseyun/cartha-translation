  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ ⸂Ἀμιναδὰβ τοῦ Ἀδμὶν τοῦ Ἀρνὶ⸃ τοῦ Ἑσρὼμ τοῦ Φαρὲς τοῦ Ἰούδα
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: yo
  text: ọmọ Aminadabu[a], ọmọ Admini, ọmọ Arni, ọmọ Hesroni, ọmọ Peresi, ọmọ Juda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà pé, “ọmọ Aminadabu, ọmọ Admini, ọmọ Aramu,” nígbà tí àwọn mìíràn kò ní “Admini,” wọ́n sì kà pé, “ọmọ Aminadabu, ọmọ Aramu.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú ìtàn ìran Lúùkù, àpilẹ̀kọ oníjẹnítífù tí a ń tún sọ níwájú orúkọ kọ̀ọ̀kan dúró fún ìbátan ìran tí a ti bẹ̀rẹ̀ sí í sọ ní ẹsẹ tó ṣáájú. “Ọmọ” sọ ìbátan náà ní Yorùbá àdánidá láìfi ohun míì kún ọ̀rọ̀ náà.
- source_word: Ἀμιναδάβ
  choice: Aminadabu
  rationale: Ìkọ̀wé orúkọ yìí bá ìrísí orúkọ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀ mu, ó sì ṣojú orúkọ Gíríìkì náà dáadáa.
- source_word: Ἀδμίν
  choice: Admini
  rationale: Àyíkọ orúkọ Gíríìkì gẹ́gẹ́ bí ó ṣe wà nínú SBLGNT; a fi sí ọ̀rọ̀ pàtàkì nítorí èyí ni ẹ̀rí ìwé tí a yàn fún àtẹ̀jáde náà.
- source_word: Ἀρνί
  choice: Arni
  rationale: Àyíkọ tààrà ti orúkọ tí SBLGNT tẹ̀ jáde. A kò yí i sí Aramu nínú ọ̀rọ̀ pàtàkì; a tọ́ka sí ìyàtọ̀ inú àwọn ìwé àfọwọ́kọ nínú àlàyé ìsàlẹ̀.
- source_word: Ἑσρώμ
  choice: Hesroni
  rationale: Ìrísí tí ó bá orúkọ baba ńlá Májẹ̀mú Láéláé mu, tí ó sì rọrùn fún òǹkàwé Yorùbá láti dá mọ̀.
- source_word: Φαρές
  choice: Peresi
  rationale: Ìrísí orúkọ Májẹ̀mú Láéláé tí a mọ̀, dípò àyíkọ tí yóò tẹ̀ lé ìró Gíríìkì nìkan.
- source_word: Ἰούδα
  choice: Juda
  rationale: Ìrísí orúkọ baba ńlá àti ẹ̀yà Ísírẹ́lì tí a mọ̀ ní Yorùbá; ó tún dènà ìdàrúdàpọ̀ pẹ̀lú àwọn ènìyàn Májẹ̀mú Tuntun tí a ń pè ní Judasi.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn lórí àwọn ọ̀rọ̀ Yorùbá níbi tó yẹ. A fi àwọn orúkọ Bíbélì sílẹ̀ ní àwọn ìrísí àyíkọ tí ó ṣeé mọ̀, láìfi àmì ohùn tí kò dájú lé wọn lórí. Àtúnṣe “ọmọ” níwájú orúkọ kọ̀ọ̀kan pa ìlànà ìtàn ìran Gíríìkì mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
