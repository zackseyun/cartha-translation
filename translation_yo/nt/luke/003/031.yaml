  text: τοῦ Μελεὰ τοῦ Μεννὰ τοῦ Ματταθὰ τοῦ Ναθὰμ τοῦ Δαυὶδ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/031.yaml
  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: yo
  text: ọmọ Mélíà[a], ọmọ Ménà[b], ọmọ Mátátà, ọmọ Nátánì, ọmọ Dáfídì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “ti Mélíà, ti Ménà, ti Mátátà, ti Nátánì, ti Dáfídì.” Nínú àtòjọ ìran Lúùkù, ìlànà tí a ń tún ṣe yìí sábà máa ń túmọ̀ sí “ọmọ.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan ní fọ́ọ̀mù orúkọ “Ménánì” dípò “Ménà”; ṣùgbọ́n ọ̀rọ̀ SBLGNT níbí ni Μεννά (Ménà).
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú àtòjọ ìran Lúùkù, àpilẹ̀kọ onípò-àní Gíríìkì tí a tún ṣe níwájú orúkọ kọ̀ọ̀kan dúró fún ìbátan ọmọ sí baba tí ọ̀rọ̀ inú àwọn ẹsẹ tó yí i ká ti fi hàn. Lílo “ọmọ” mú ìtumọ̀ náà ṣe kedere ní Yorùbá láìfi èrò tuntun kún un.
- source_word: Μελεὰ
  choice: Mélíà
  rationale: A ṣàkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tí ó bá ìkọ̀wé àti ìpè Yorùbá mu.
- source_word: Μεννὰ
  choice: Ménà
  rationale: Àkọsílẹ̀ yìí tẹ̀ lé fọ́ọ̀mù Μεννά inú SBLGNT ní tààrà; a kò yí i sí fọ́ọ̀mù “Ménánì” tí àwọn àṣà ìtumọ̀ mìíràn lè lò.
- source_word: Ματταθὰ
  choice: Mátátà
  rationale: Ìkọ̀wé Yorùbá yìí dúró fún ìró orúkọ Gíríìkì Ματταθά ní ọ̀nà tó ṣeé kà ní ti ẹ̀dá.
- source_word: Ναθὰμ
  choice: Nátánì
  rationale: A lo fọ́ọ̀mù Yorùbá tí a mọ̀ fún Nátánì, ọmọ Dáfídì, dípò títẹ̀ lé ìkọ̀wé Gíríìkì ní ẹyọ ọ̀rọ̀ kọ̀ọ̀kan.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: “Dáfídì” ni fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀, tí ó sì jẹ́ kí àwọn òǹkàwé mọ ẹni tí orúkọ Gíríìkì Δαυίδ ń tọ́ka sí.
theological_decisions:
- issue: Ìyọkúrò ọ̀rọ̀ nínú àtòjọ ìran
  choice: Fi “ọmọ” síwájú orúkọ kọ̀ọ̀kan.
  alternative: Túmọ̀ ọ́ gẹ́gẹ́ bí “ti Mélíà, ti Ménà, ti Mátátà, ti Nátánì, ti Dáfídì.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ẹ̀wọ̀n àwọn orúkọ onípò-àní tí ó gbára lé ìlànà gírámà àyíká rẹ̀. Fífi “ọmọ” hàn ní Yorùbá sọ ìbátan ìran náà di mímọ̀ láìyanju ìbéèrè ẹ̀kọ́ ìgbàgbọ́ mìíràn tàbí fi àlàyé tí kò sí nínú àyíká kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, pẹ̀lú àmì ohùn lórí àwọn orúkọ níbi tí ó rọrùn láti fi ìpè hàn. Ẹsẹ náà jẹ́ apá kan gbólóhùn àtòjọ ìran, nítorí náà a pa ìrísí àtòjọ rẹ̀ mọ́, a sì lo àmì àdákọ ní ìparí dípò fífi gbólóhùn tuntun ṣe e.
