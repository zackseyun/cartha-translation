id: LUK.3.11
reference: Luke 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: yo
  text: Ó sì dá wọn lóhùn pé, “Ẹni tí ó ní ẹ̀wù méjì[a] kí ó pín fún ẹni tí kò ní rárá; ẹni tí ó sì ní oúnjẹ kí ó ṣe bákan náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ẹ̀wù kan tí a máa ń wọ̀ sátòsí ara; a tún lè pè é ní túnìkì.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Ó sì dá wọn lóhùn pé
  rationale: Èyí mú ìdáhùn Jòhánù àti àsopọ̀ onírẹ̀lẹ̀ δέ jáde ní Yorùbá àdánidá. Kíkọ ọ̀rọ̀ náà gẹ́gẹ́ bí ìdáhùn kan kò fi dandan pa àṣeyọrí imperfect mọ́, ṣùgbọ́n ó yẹra fún gbólóhùn Yorùbá tí yóò le tàbí tí yóò dà bí àsọtúnsọ.
- source_word: ὁ ἔχων δύο χιτῶνας
  choice: Ẹni tí ó ní ẹ̀wù àwọ̀tẹ́lẹ̀ méjì
  rationale: “Ẹni tí ó ní” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún participle aṣojú ẹnikẹ́ni. χιτών jẹ́ ẹ̀wù ìgbàanì tí a wọ̀ mọ́ ara, nítorí náà “ẹ̀wù àwọ̀tẹ́lẹ̀” péye ju “ṣẹ́ẹ̀tì” tàbí “ẹ̀wù àwọ̀lékè” lọ.
- source_word: μεταδότω τῷ μὴ ἔχοντι
  choice: kí ó pín fún ẹni tí kò ní rárá
  rationale: Ilana “kí ó” gbé agbára imperative ẹni-kẹta jáde lọ́nà àdánidá. “Pín fún” sọ fífún aláìní ní ìpín ohun tí ẹni náà ní; “rárá” mú ohun tí ó yé wa láti inú ọ̀rọ̀ ṣáájú hàn pé ẹni kejì kò ní ẹ̀wù bẹ́ẹ̀.
- source_word: βρώματα
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbogbogbò fún àwọn ohun jíjẹ; “oúnjẹ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí ó sì wọ́pọ̀.
- source_word: ὁμοίως ποιείτω
  choice: kí ó ṣe bákan náà
  rationale: Èyí pa ìfarajọ àti agbára àṣẹ mọ́, ó sì fi hàn pé ẹni tí ó ní oúnjẹ gbọ́dọ̀ ṣe irú pínpín kan náà.
theological_decisions:
- issue: Ẹni kan gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: Ẹni tí ó ní ... ẹni tí ó sì ní
  alternative: Ọkùnrin tí ó ní ... òun tí ó sì ní
  rationale: Àwọn participle akọ ẹyọ kan nínú Gíríìkì ń ṣe aṣojú ẹnikẹ́ni, kì í ṣe ọkùnrin nìkan. “Ẹni” pa ẹyọ kan àti ìtumọ̀ gbogbogbò náà mọ́ láìfi akọ tàbí abo tí orísun kò tẹnumọ́ kún un.
- issue: Agbára àṣẹ Jòhánù
  choice: kí ó pín ... kí ó ṣe
  alternative: ó yẹ kí ó pín ... ó yẹ kí ó ṣe
  rationale: Gíríìkì lo imperative ẹni-kẹta. Ilana Yorùbá “kí ó” jẹ́ àṣẹ tàbí ìṣílétí tó lágbára, kò sì sọ ọ́ di àbá lásán.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún ni a lò. Èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì; “ẹ̀wù àwọ̀tẹ́lẹ̀” pa àṣà aṣọ ayé Gíríìkì-Róòmù mọ́ láìlo ọ̀rọ̀ àjèjì.
