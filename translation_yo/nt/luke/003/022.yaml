id: LUK.3.22
reference: Luke 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: yo
  text: Ẹ̀mí Mímọ́ sì sọ̀kalẹ̀ sórí rẹ̀ ní ìrísí ti ara, bí àdàbà; ohùn kan sì wá láti ọ̀run pé, “Ìwọ ni Ọmọ mi, ẹni tí mo fẹ́ràn; nínú rẹ ni inú mi dùn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Inú mi dùn sí ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: sọ̀kalẹ̀
  rationale: Ó pa ìṣísẹ̀ láti òkè sọ̀kalẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá nínú Yorùbá òde òní.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó wọ́pọ̀, tí ó sì bá gbolohun pàtó Gíríìkì mu.
- source_word: σωματικῷ εἴδει
  choice: ní ìrísí ara
  rationale: Ó fi hàn pé ìfarahàn náà ní ìrísí tí ó ṣeé rí, kì í ṣe ohun inú ọkàn nìkan, láì sọ pé Ẹ̀mí náà di ẹranko gidi.
- source_word: ὡς περιστερὰν
  choice: bí àdàbà
  rationale: “Bí” pa àfiwé ὡς mọ́, ó sì yẹra fún sísọ pé Ẹ̀mí Mímọ́ di àdàbà ní ti gidi.
- source_word: ἐπ’ αὐτόν
  choice: sórí rẹ̀
  rationale: Ó ṣàfihàn ibi tí Ẹ̀mí náà sọ̀kalẹ̀ sí ní Yorùbá àdánidá.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: ohùn kan sì wá láti ọ̀run
  rationale: Ìtumọ̀ yìí sọ ìṣẹ̀lẹ̀ náà ní kedere, ó sì mú ìtumọ̀ ọ̀rọ̀ Gíríìkì tó túmọ̀ sí pé ohùn náà ṣẹlẹ̀ tàbí wá láti ọ̀run.
- source_word: Σὺ εἶ
  choice: Ìwọ ni
  rationale: Lílo “Ìwọ” ní gbangba pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ὁ υἱός μου
  choice: Ọmọ mi
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ìní àti ìbátan ọmọ nínú Yorùbá.
- source_word: ὁ ἀγαπητός
  choice: olùfẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ kúkúrú, ọlọ́lá, tó sì túmọ̀ sí ẹni tí a fẹ́ràn gidigidi nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐν σοὶ
  choice: sí ọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní tààrà sí “nínú,” “ní inú dídùn sí ọ” ni Yorùbá àdánidá fún ìtẹ́wọ́gbà àti ayọ̀ sí ẹni kan.
- source_word: εὐδόκησα
  choice: mo ní inú dídùn
  rationale: Ó sọ ìtẹ́wọ́gbà àti ayọ̀ Ọlọ́run ní Yorùbá tó ṣe kedere. Àlàyé ìsàlẹ̀ pa ìtọ́kasí aorist àti ọ̀nà tó tẹ̀lé Gíríìkì pẹkipẹki mọ́.
theological_decisions:
- issue: Irú ìfarahàn Ẹ̀mí Mímọ́
  choice: Ẹ̀mí Mímọ́ sọ̀kalẹ̀ ní ìrísí ara tí a fi wé àdàbà.
  alternative: Ẹ̀mí Mímọ́ sọ̀kalẹ̀ gẹ́gẹ́ bí àdàbà gidi.
  rationale: Àpapọ̀ σωματικῷ εἴδει àti ὡς περιστερὰν tọ́ka sí ìfarahàn tí ó ṣeé rí àti àfiwé; kò fi dandan mú wa sọ pé Ẹ̀mí náà di àdàbà ní ti gidi.
- issue: Agbára àti àkókò εὐδόκησα nínú ọ̀rọ̀ Ọlọ́run
  choice: “Mo ní inú dídùn sí ọ” ni a lò nínú ẹsẹ̀ fún ìtẹ́wọ́gbà tó dúró ṣinṣin ní Yorùbá àdánidá.
  alternative: “Nínú rẹ ni inú mi dùn.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aorist, tí a lè fi ọ̀nà ìgbà-àtijọ́ hàn; síbẹ̀, Yorùbá kò fi àkókò hàn lórí ọ̀rọ̀-ìṣe bí Gíríìkì. Ẹsẹ̀ àkọ́kọ́ sọ ìtumọ̀ náà lọ́nà àdánidá, àlàyé ìsàlẹ̀ sì pa ìrísí tó tẹ̀lé Gíríìkì pẹkipẹki mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá jẹ́ àdánidá, a sì pa ìtẹnumọ́ “Ìwọ” àti àfiwé “bí àdàbà” mọ́.
