    rationale: βοῦς lè tọ́ka sí ẹran màlúù/ox, ṣùgbọ́n kò sọ pé akọ màlúù (bull). ‘Màlúù’ ń yẹra fún ìfikún ìtumọ̀ náà.
  - severity: medium
    issue: ‘Ọjọ́ Ìsinmi’ kò ṣe pàtó sí ọjọ́ Sábáàtì.
    rationale: σάββατον jẹ́ Sábáàtì; ìtumọ̀ gbogbogbò ‘ọjọ́ Ìsinmi’ lè dín ìtọ́kasí ìtàn àti ẹ̀sìn pàtó kù.
  - severity: low
    issue: Ìṣètò ìbéèrè nínú gbólóhùn àkọ́kọ́ kò ṣàn dáadáa.
    rationale: Fífún ‘tí’ lẹ́yìn ‘Ta nínú yín’ mú kí olùṣe ìṣe ‘kì yóò fà á jáde’ hàn ní kedere, ó sì pa ipa ìbéèrè àsọyé mọ́.
