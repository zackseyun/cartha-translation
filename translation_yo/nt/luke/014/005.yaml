  verdict: revise
  source_fidelity: Àtúnṣe kékeré ni a nílò. Ọ̀rọ̀ Gíríìkì náà béèrè nípa ẹni nínú wọn tí ọmọkùnrin tàbí màlúù rẹ̀ bá ṣubú sínú kànga, tí kò ní yọ ọ́ jáde lẹ́sẹ̀kẹsẹ̀ ní ọjọ́ Sábáàtì. Ìtumọ̀ àkọ́kọ́ pa àpẹẹrẹ ìgbàlà kánjú àti ìbéèrè àsọyé mọ́, ṣùgbọ́n ‘akọ màlúù’ lè tọ́ka sí akọ màlúù tí kò dájú pé ó jẹ́ ‘ox,’ ‘ọjọ́ Ìsinmi’ sì lè jẹ́ ọjọ́ ìsinmi èyíkéyìí dípò ọjọ́ Sábáàtì pàtó.
  naturalness: ‘Ta ni nínú yín, bí … bá ṣubú, tí kò ní …?’ kì í ṣàn dáadáa bí ‘Ta nínú yín tí … bá ṣubú, tí kì yóò …?’ Ìṣètò ìkẹyìn fi ẹni tí ìbéèrè náà ń tọ́ka sí hàn ní kedere, ó sì jẹ́ Yorùbá òde òní tó rọrùn.
  terminology: A yí ‘akọ màlúù’ padà sí ‘màlúù’ láti má ṣe fi akọ-ọba (bull) tàbí ìdánilẹ́kọ̀ọ́ tí Gíríìkì kò sọ kún βοῦς. A lo ‘ọjọ́ Sábáàtì’ láti pa ìtọ́kasí pàtó sí σάββατον mọ́. ‘Ọmọkùnrin’ dáa fún υἱός, ‘kànga’ dáa fún φρέαρ, ‘fà á jáde’ sì bójú mu fún ἀνασπάσει.
  issues:
