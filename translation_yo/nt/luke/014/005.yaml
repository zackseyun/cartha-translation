id: LUK.14.5
reference: Luke 14:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ta nínú yín tí ọmọkùnrin rẹ̀ tàbí màlúù rẹ̀ bá ṣubú sínú kànga, tí kì yóò fà á jáde lẹ́sẹ̀kẹsẹ̀ ní ọjọ́ Sábáàtì?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka “kẹ́tẹ́kẹ́tẹ́” dípò “ọmọkùnrin.”
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Ta ni nínú yín
  rationale: Ọ̀nà Yorùbá àdánidá fún ìbéèrè àsọyé tí ń tọ́ka sí ẹni kan láàárín àwọn olùgbọ́.
- source_word: υἱὸς
  choice: ọmọkùnrin rẹ̀
  rationale: Ó pa ìtumọ̀ akọ ní pàtó ti υἱός mọ́, ó sì fi ìbáṣepọ̀ ẹni tí a ń bi léèrè hàn ní Yorùbá àdánidá.
- source_word: βοῦς
  choice: akọ màlúù rẹ̀
  rationale: Ìtumọ̀ tó ṣe kedere fún ẹran màlúù akọ; ó bá àpẹẹrẹ ẹran iṣẹ́ mu láìlo ọ̀rọ̀ àtijọ́ tí ọ̀pọ̀ ènìyàn lè má lóye.
- source_word: φρέαρ
  choice: kànga
  rationale: φρέαρ túmọ̀ sí kànga ní pàtó níhìn-ín; a kò mú un dọ́gba pẹ̀lú ‘kòtò’ nítorí àwọn ẹsẹ míì.
- source_word: πεσεῖται
  choice: bá ṣubú
  rationale: Ìṣètò ‘bí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ipò àfojúsùn inú ìbéèrè àsọyé hàn.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìkánjú àkókò tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ἀνασπάσει
  choice: fà á jáde
  rationale: Ó fi ìṣe fífa ohun sókè láti inú kànga hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: αὐτὸν
  choice: á
  rationale: Arọ́pò-orúkọ Yorùbá yìí lè tọ́ka sí ọmọkùnrin tàbí akọ màlúù láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: ní ọjọ́ Ìsinmi
  rationale: Ó ṣàfihàn ἡμέρᾳ àti sábáàtì ní ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa ẹni tàbí ohun tó ṣubú
  choice: ọmọkùnrin rẹ̀ tàbí akọ màlúù rẹ̀
  alternative: kẹ́tẹ́kẹ́tẹ́ rẹ̀ tàbí akọ màlúù rẹ̀
  rationale: SBLGNT tí a pèsè ka υἱὸς (‘ọmọkùnrin’), nítorí náà ọ̀rọ̀ pàtàkì tẹ̀ lé e. A pa ẹ̀rí àfọwọ́kọ mìíràn mọ́ sínú àlàyé ìsàlẹ̀ láìdà á pọ̀ mọ́ ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ọjọ́ Ìsinmi’ fún ọjọ́ Sábáàtì, a sì fi àmì ìsàlẹ̀ [a] sí òpin gbólóhùn nítorí pé ó ṣàlàyé ọ̀rọ̀ ‘ọmọkùnrin’ inú ìbéèrè náà.
