id: LUK.14.12
reference: Luke 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: yo
  text: Ó sì tún ń sọ fún ẹni tí ó pè é pé, “Nígbà tí o bá ṣe àsè ọ̀sán[a] tàbí àsè alẹ́, má ṣe pe àwọn ọ̀rẹ́ rẹ, tàbí àwọn arákùnrin rẹ, tàbí àwọn ìbátan rẹ, tàbí àwọn aládùúgbò ọlọ́rọ̀, kí àwọn náà má bàa pe ọ́ ní ìpadà[b], kí ó sì di ìsanpadà fún ọ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ àárọ̀.” Ọ̀rọ̀ Gíríìkì ἄριστον tọ́ka sí oúnjẹ tí a jẹ ṣáájú àsè alẹ́, ní ọ̀pọ̀ ìgbà ní àárín ọjọ́, kì í ṣe dandan oúnjẹ àárọ̀ bí a ṣe lóye rẹ̀ lónìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọ́n pe ọ́ padà.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí pípe ẹnì kan ní ìpadà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí a sì san padà fún ọ.” Ní tààràtà, èdè Gíríìkì ní, “kí ó sì di ìsanpadà fún ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Ó sì tún ń sọ
  rationale: Ọ̀rọ̀-ìṣe àìpé ἔλεγεν fi ìṣe tí ó ń lọ hàn; “ń sọ” pa ìrísí ìtàn náà mọ́, “sì tún” sì ṣojú δὲ καὶ lọ́nà Yorùbá àdánidá.
- source_word: τῷ κεκληκότι αὐτόν
  choice: fún ẹni tí ó pè é
  rationale: Èyí ṣàfihàn ẹni tí ó ti pe Jésù síbi àsè láìfi ìtumọ̀ àfikún bí “olùgbàlejò” sínú ọ̀rọ̀ náà.
- source_word: Ὅταν ποιῇς
  choice: Nígbà tí o bá ṣe
  rationale: Ní ọ̀rọ̀ nípa oúnjẹ, ποιέω túmọ̀ sí ṣíṣe tàbí pípèsè àsè; gbólóhùn yìí jẹ́ èdè Yorùbá tí ó ṣe kedere fún ìṣẹ̀lẹ̀ tí ó lè máa ṣẹlẹ̀.
- source_word: ἄριστον
  choice: àsè ọ̀sán
  rationale: ἄριστον jẹ́ oúnjẹ ìṣáájú ọjọ́, tí a sábà máa ń jẹ ní àárín ọjọ́; “àsè ọ̀sán” yà á sọ́tọ̀ kúrò ní àsè alẹ́ láìjẹ́ kí ó dà bí oúnjẹ àárọ̀ òde òní.
- source_word: δεῖπνον
  choice: àsè alẹ́
  rationale: δεῖπνον tọ́ka sí oúnjẹ pàtàkì tí a sábà máa ń jẹ ní ìrọ̀lẹ́ tàbí alẹ́.
- source_word: μὴ φώνει
  choice: má ṣe pe
  rationale: Bí ó tilẹ̀ jẹ́ pé φωνέω túmọ̀ ní pàtó sí “pè,” nínú àyíká àsè ó túmọ̀ sí pípe ènìyàn wá síbi oúnjẹ; èdè Yorùbá náà ní ìtumọ̀ méjèèjì.
- source_word: τοὺς ἀδελφούς σου
  choice: àwọn arákùnrin rẹ
  rationale: A pa akọ ọ̀pọ̀ inú èdè Gíríìkì mọ́ dípò yíyí i padà sí ọ̀rọ̀ tí kò fi akọ tàbí abo hàn.
- source_word: τοὺς συγγενεῖς σου
  choice: àwọn ìbátan rẹ
  rationale: “Àwọn ìbátan” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún àwọn ará tàbí mọ̀lẹ́bí.
- source_word: γείτονας πλουσίους
  choice: àwọn aládùúgbò ọlọ́rọ̀
  rationale: 'Ọ̀rọ̀ náà pa ìbáṣepọ̀ gírámà mọ́: πλουσίους ṣe àpèjúwe àwọn aládùúgbò.'
- source_word: μήποτε
  choice: kí wọ́n má bà á
  rationale: Gbólóhùn Yorùbá yìí fi ìkìlọ̀ tàbí ohun tí a fẹ́ yẹra fún hàn, gẹ́gẹ́ bí μήποτε ṣe rí.
- source_word: ἀντικαλέσωσίν σε
  choice: tún pè ọ́ padà
  rationale: Ọ̀rọ̀-ìṣe àkópọ̀ náà túmọ̀ sí pípe ẹnì kan padà gẹ́gẹ́ bí ìdáhùn sí ìpè rẹ̀; “tún pè ọ́ padà” jẹ́ àdánidá, ó sì pa ìtumọ̀ ìfèsì náà mọ́.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: kí èyí sì di ẹ̀san fún ọ
  rationale: Ìtumọ̀ yìí tẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki, ó sì pa èrò ìsanpadà tàbí ìdápadà sí ẹni náà mọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jésù jẹ́ ìfòfinró tí kò ní ààlà tàbí ọ̀nà ìkọ́ni tí ń tako pípe àwọn tí wọ́n lè san padà
  choice: A túmọ̀ àṣẹ náà ní tààràtà láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Láti ṣàlàyé nínú ọ̀rọ̀ pé Jésù kàn ń tako ète ìsanpadà nìkan.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ àṣẹ náà ní ọ̀nà líle, ó sì fi ewu ìsanpadà hàn; ìtumọ̀ kò gbọ́dọ̀ dín ìforígbárí yìí kù tàbí pinnu àlàyé ẹ̀kọ́ ìgbàgbọ́ kan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìwọ̀n-ọba, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “àsè” nítorí àyíká pípe àwọn ènìyàn wá sí oúnjẹ, ṣùgbọ́n a yà àsè ọ̀sán sí àsè alẹ́. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà ni a lò níbi tí ó bá yẹ.
