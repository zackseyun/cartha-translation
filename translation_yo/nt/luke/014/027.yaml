source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: yo
  text: Ẹnikẹ́ni tí kò bá gbé àgbélébùú tirẹ̀, tí ó sì ń wá lẹ́yìn mi, kò lè jẹ́ ọmọ-ẹ̀yìn mi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ru àgbélébùú tirẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ń wá lẹ́yìn mi”; fi wé gbólóhùn jíjẹ́ ọmọ-ẹ̀yìn tí a sábà máa ń lò, “tẹ̀lé mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Ẹnikẹ́ni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìdánimọ̀ yìí ń gbé ipò gbogbogbò kalẹ̀; “Ẹnikẹ́ni tí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára “whoever” mọ́.
- source_word: βαστάζει
  choice: gbé
  rationale: “Gbé” lè túmọ̀ sí gbígbé ohun kan, ó sì bá àwòrán àgbélébùú mu ní kedere, láìsọ agbára àpẹẹrẹ rẹ̀ nù.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: àgbélébùú tirẹ̀
  rationale: “Àgbélébùú” ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún σταυρός; “tirẹ̀” pa ìtẹnumọ́ arọ́pò-orúkọ afẹ̀yìntì ἑαυτοῦ mọ́ láìfi akọ tàbí abo kún un, nítorí èdè Yorùbá kì í fi akọ-abo hàn nínú irú arọ́pò-orúkọ bẹ́ẹ̀.
- source_word: ἔρχεται ὀπίσω μου
  choice: tọ̀ mí lẹ́yìn
  rationale: Gbólóhùn yìí pa àwòrán ẹni tí ń lọ lẹ́yìn olùkọ́ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún títẹ̀lé ẹnì kan.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kò lè jẹ́ ọmọ-ẹ̀yìn mi
  rationale: “Kò lè” fi àìlè ṣe hàn, kì í ṣe àṣẹ ìdènà lásán; “ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής nínú ọ̀rọ̀ ihinrere.
theological_decisions:
- issue: Ìtẹnumọ́ pé ẹni kọ̀ọ̀kan ní láti gbé àgbélébùú tirẹ̀
  choice: àgbélébùú tirẹ̀
  alternative: àgbélébùú rẹ̀
  rationale: “Tirẹ̀” túbọ̀ pa ìtẹnumọ́ ἑαυτοῦ mọ́ pé àgbélébùú ẹni náà gan-an ni, láìṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì.
- issue: Ìbáṣepọ̀ ἔρχεται ὀπίσω μου pẹ̀lú jíjẹ́ ọmọ-ẹ̀yìn
  choice: tọ̀ mí lẹ́yìn
  alternative: tẹ̀lé mi
  rationale: A pa àwòrán gidi “wá/lọ lẹ́yìn mi” mọ́ ní ọ̀nà Yorùbá àdánidá, dípò kí a sọ ọ́ di ìtumọ̀ ṣókí “tẹ̀lé mi” nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Ẹnikẹ́ni tí … bá” fún ipò gbogbogbò, “àgbélébùú” fún ọ̀rọ̀ ìtàn àti àpẹẹrẹ náà, àti “ọmọ-ẹ̀yìn” gẹ́gẹ́ bí ọ̀rọ̀ ihinrere tó ti fìdí múlẹ̀. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
