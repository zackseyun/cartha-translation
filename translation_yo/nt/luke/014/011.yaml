id: LUK.14.11
reference: Luke 14:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: yo
  text: Nítorí pé ẹnikẹ́ni tí ó bá gbé ara rẹ̀ ga, a ó rẹ̀ ẹ́ sílẹ̀; ẹni tí ó bá sì rẹ ara rẹ̀ sílẹ̀, a ó gbé e ga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó ń ṣàlàyé ìdí fún ohun tí Jésù sọ ṣáájú; “Nítorí pé” jẹ́ ọ̀nà àdánidá láti pa agbára ìtumọ̀ yìí mọ́ ní Yorùbá.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: ẹnikẹ́ni tí ó bá gbé ara rẹ̀ ga
  rationale: “Ẹnikẹ́ni tí ó bá” fi ìtumọ̀ òwe tí ó kan gbogbo ènìyàn hàn, “gbé ara rẹ̀ ga” sì ṣàfihàn ìgbéraga tàbí fífi ara ẹni sí ipò gíga, kì í ṣe gbígbé ara sókè ní ti gidi.
- source_word: ταπεινωθήσεται
  choice: a ó rẹ̀ ẹ́ sílẹ̀
  rationale: Ọ̀rọ̀ yìí pa ìṣe tí ẹlòmíràn yóò ṣe sí ẹni náà mọ́, ó sì bá ìyàtọ̀ tó wà láàárín gbígbé ga àti rírọ̀ sílẹ̀ mu.
- source_word: καὶ ὁ ταπεινῶν ἑαυτὸν
  choice: ẹni tí ó bá sì rẹ ara rẹ̀ sílẹ̀
  rationale: Ìtúmọ̀ yìí jẹ́ àdánidá, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ méjèèjì mọ́; ó ń tọ́ka sí ẹni tó fi ìrẹ̀lẹ̀ yan ipò kékeré fún ara rẹ̀.
- source_word: ὑψωθήσεται
  choice: a ó gbé e ga
  rationale: Ó pa ìṣe aláìlórúkọ àti ìbámu pẹ̀lú “a ó rẹ̀ ẹ́ sílẹ̀” mọ́ láìfi ẹni tó ṣe ìṣe náà kún ẹsẹ̀.
theological_decisions:
- issue: Ẹni tó ń ṣe ìṣe nínú ọ̀rọ̀ ìṣe méjèèjì tí a ṣe sí olùgbà
  choice: A kò dárúkọ ẹni tó máa rẹ̀ sílẹ̀ tàbí ẹni tó máa gbé ga
  alternative: Ọlọ́run yóò rẹ̀ ẹ́ sílẹ̀, Ọlọ́run yóò sì gbé e ga
  rationale: Gíríìkì lo ọ̀rọ̀ ìṣe aláìsọ ẹni tó ṣe é. Bó tilẹ̀ jẹ́ pé àyíká Bíbélì lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe, fífi orúkọ Ọlọ́run kún un yóò tú ohun tí orísun kò sọ ní tààrà.
- issue: Àwọn ọ̀rọ̀ akọ tó dúró fún gbogbo ènìyàn nínú Gíríìkì
  choice: ẹnikẹ́ni… ara rẹ̀
  alternative: ọkùnrin èyíkéyìí… ara rẹ̀
  rationale: Yorùbá kò pín ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta sí akọ àti abo. “Ẹnikẹ́ni” àti “ara rẹ̀” jẹ́ ìtumọ̀ tó péye, tó sì kan gbogbo ènìyàn láìfi akọ tí èdè Yorùbá kò nílò kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn ní kíkún. Àtúnṣe gbolóhùn méjèèjì àti àwọn ọ̀rọ̀ “gbé… ga / rẹ̀… sílẹ̀” pa ìró òwe àti ìtakora orísun mọ́. “A ó” jẹ́ ọ̀nà Yorùbá àdánidá láti fi olùṣe sílẹ̀ láìdárúkọ rẹ̀.
