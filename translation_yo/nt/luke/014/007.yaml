translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Àkàwé” àti “àwọn àyè ọlá” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye láì sọ ìtumọ̀ àsè Gíríìkì di àjèjì. A gbé àmì àlàyé [a] sí “àwọn àyè ọlá,” nítorí pé ibẹ̀ ni àlàyé lexical náà tọ́ka sí.
