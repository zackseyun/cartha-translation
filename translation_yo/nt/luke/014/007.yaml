  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: yo
  text: 'Ó sì ń sọ àkàwé kan fún àwọn tí a pè, bí ó ti kíyè sí bí wọ́n ṣe ń yan àwọn àyè ọlá[a] fún ara wọn, ó ní fún wọn pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibi jíjókòó tí ó ga jù lọ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn àyè tí a bọ̀wọ̀ fún jù lọ níbi àsè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ó sì ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ tàbí ìtẹ̀síwájú ìtàn hàn; “ń sọ” pa ìtumọ̀ yẹn mọ́ ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó bá ìyípadà inú ìtàn mu láì fi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: τοὺς κεκλημένους
  choice: àwọn tí a pè síbi àsè
  rationale: Perfect participle tọ́ka sí àwọn ènìyàn tí a ti pè; “síbi àsè” mú ọ̀rọ̀ náà yé kedere gẹ́gẹ́ bí àyíká àsè inú ìtàn ṣe fi hàn.
- source_word: παραβολήν
  choice: àkàwé kan
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹ̀kọ́ àpẹẹrẹ tí παραβολή ń tọ́ka sí níhìn-ín.
- source_word: ἐπέχων
  choice: nígbà tí ó kíyè sí
  rationale: Ó fi hàn pé Jésù fiyè sí ohun tí àwọn tí a pè ń ṣe, èyí sì ni ó fa àkàwé náà.
- source_word: πῶς
  choice: bí
  rationale: “Bí” ṣe àfihàn ọ̀nà tí wọ́n gbà ń ṣe ìṣe náà lọ́nà àdánidá ní Yorùbá.
- source_word: πρωτοκλισίας
  choice: àwọn àyè ọlá
  rationale: Ó túmọ̀ sí àwọn ibi jíjókòó tàbí ìgbọ̀nsẹ̀ tí a ka sí pàtàkì jù lọ níbi àsè; “àwọn àyè ọlá” sọ ìtumọ̀ àwùjọ rẹ̀ di mímọ̀ fún òǹkàwé òde òní.
- source_word: ἐξελέγοντο
  choice: ń yan ... fún ara wọn
  rationale: “Ń yan” pa abala imperfect mọ́, “fún ara wọn” sì ṣàfihàn ìtumọ̀ middle tí ó wà nínú ọ̀rọ̀ Gíríìkì.
- source_word: λέγων πρὸς αὐτούς
  choice: ó ní fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu láti ṣáájú ọ̀rọ̀ tààrà tí yóò tẹ̀ lé.
