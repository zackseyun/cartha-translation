  text: bí bẹ́ẹ̀ kọ́[a], lẹ́yìn tí ó ti fi ìpìlẹ̀ lélẹ̀, tí kò sì lè parí i, gbogbo àwọn tí ó rí i á bẹ̀rẹ̀ sí í fi í ṣe ẹlẹ́yà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má bàa jẹ́ pé, lẹ́yìn tí ó ti fi ìpìlẹ̀ lélẹ̀, tí kò sì lè parí i, gbogbo àwọn tí ó rí i á bẹ̀rẹ̀ sí í fi í ṣe ẹlẹ́yà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: bí bẹ́ẹ̀ kọ́
  rationale: Nínú ìkìlọ̀ àkàwé yìí, gbólóhùn náà ń tọ́ka sí àbájáde búburú tí ẹni náà fẹ́ yẹra fún; “bí bẹ́ẹ̀ kọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìkìlọ̀ náà hàn.
- source_word: θέντος αὐτοῦ
  choice: lẹ́yìn tí ó bá ti fi … lélẹ̀
  rationale: Genitive absolute náà fi hàn pé fífi ìpìlẹ̀ lélẹ̀ ṣẹlẹ̀ ṣáájú àìlèparí; ọ̀rọ̀ yìí mú ìtẹ̀lé àkókò náà ṣe kedere ní Yorùbá.
- source_word: θεμέλιον
  choice: ìpìlẹ̀
  rationale: “Ìpìlẹ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún foundation ilé.
- source_word: μὴ ἰσχύοντος
  choice: tí kò sì lè
  rationale: ἰσχύω níbí ń sọ nípa agbára tàbí ipá láti ṣe ohun kan, kì í ṣe okun ara nìkan; “kò lè” jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ἐκτελέσαι
  choice: parí rẹ̀
  rationale: Nínú àyíká iṣẹ́ ìkọ́lé, “parí rẹ̀” sọ ìmú iṣẹ́ náà dé òpin lọ́nà àdánidá.
- source_word: πάντες οἱ θεωροῦντες
  choice: gbogbo àwọn tí ó rí i
  rationale: θεωρέω túmọ̀ sí wíwo tàbí ṣíṣe àkíyèsí; “rí i” jẹ́ ọ̀nà Yorùbá tó rọrùn, tí ohun tí wọ́n rí sì jẹ́ ipò iṣẹ́ ìkọ́lé náà.
- source_word: ἄρξωνται
  choice: lè bẹ̀rẹ̀
  rationale: Subjunctive náà wà lábẹ́ gbólóhùn ìkìlọ̀, nítorí náà “lè bẹ̀rẹ̀” pa ìtumọ̀ àbájáde tó ṣeé ṣe mọ́.
- source_word: αὐτῷ ἐμπαίζειν
  choice: fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe ẹni ní ẹlẹ́yà tàbí fífi í ṣe yẹ̀yẹ́; yíyan yìí jẹ́ àdánidá, kedere, ó sì ní ìyì.
