  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa: ‘Ṣùgbọ́n’ lè dúró fún δέ; ‘Ọkùnrin kan’ ń ṣàfihàn ἄνθρωπός τις; ‘ń pèsè’ ń pa ìṣe imperfect ἐποίει mọ́; àti ‘ó sì pe ọ̀pọ̀ ènìyàn’ ń bá καὶ ἐκάλεσεν πολλούς mu. ‘Àsè ńlá’ yẹ fún δεῖπνον μέγα nínú àyíká ìpè sí oúnjẹ.'
  naturalness: Ọ̀rọ̀ ara ẹsẹ̀ jẹ́ Yorùbá ìlànà tí ó rọrùn, tí àmì ohùn rẹ̀ sì pé. ‘Pe ọ̀pọ̀ ènìyàn sí i’ jẹ́ ìkọ̀wé tó yè, bí ó tilẹ̀ jẹ́ pé ‘sí àsè náà’ tún lè jẹ́ ọ̀nà míràn.
  terminology: ‘Àsè’ jẹ́ ọ̀rọ̀ tó bójú mu fún oúnjẹ ìgbàlejò nínú àkókò yìí. Ṣùgbọ́n gbolóhùn àlàyé ìsàlẹ̀ náà, ‘oúnjẹ pàtàkì ọjọ́,’ kò ṣeé lò lédè Yorùbá ní ti ara, ó sì lè ṣe kedere díẹ̀ sí i pé δεῖπνον sábà ń jẹ́ oúnjẹ pàtàkì tí a máa ń jẹ ní ìkẹyìn ọjọ́.
