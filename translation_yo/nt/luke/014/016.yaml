  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Ọkùnrin kan ń pèsè àsè ńlá kan[a], ó sì pe ọ̀pọ̀ ènìyàn sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “oúnjẹ alẹ́ ńlá” tàbí “oúnjẹ ńlá.” Ọ̀rọ̀ Gíríìkì δεῖπνον sábà máa ń tọ́ka sí oúnjẹ pàtàkì tí a máa ń jẹ ní ìkẹyìn ọjọ́; níbí, àyíká náà jẹ́ ti oúnjẹ ìgbàlejò fún àwọn tí a pè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ṣùgbọ́n ó sọ fún un pé
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ onírẹ̀lẹ̀ tí ó yí ọ̀rọ̀ padà sí ìdáhùn ẹni tí ó ṣẹ̀ṣẹ̀ sọ̀rọ̀; “Ṣùgbọ́n” fi ìyípadà yìí hàn láìfi àtakò líle kún un.
- source_word: Ἄνθρωπός τις
  choice: Ọkùnrin kan
  rationale: τις fi ìtumọ̀ aláìdánimọ̀ kan hàn nínú àkàwé; “ọkùnrin kan” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa akọ ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐποίει
  choice: ń pèsè
  rationale: Àkókò imperfect fi iṣẹ́ tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn. Nínú àyíká àsè, “ń pèsè” jẹ́ adayeba ju “ń ṣe” lọ, ó sì fi ìmúrasílẹ̀ àsè hàn láìsọ pé àsè náà ti bẹ̀rẹ̀.
- source_word: δεῖπνον μέγα
  choice: àsè ńlá kan
  rationale: δεῖπνον túmọ̀ sí oúnjẹ pàtàkì ọjọ́, ní ọ̀pọ̀ ìgbà oúnjẹ alẹ́; nínú àyíká ẹni tó gbàlejò tí ó sì pe ọ̀pọ̀ ènìyàn, “àsè ńlá” sọ ìtumọ̀ náà ní Yorùbá òde òní, “ńlá” sì dúró fún μέγα.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: ó sì pe ọ̀pọ̀ ènìyàn sí i
  rationale: Nínú àyíká jíjẹun, καλέω túmọ̀ sí pípe ènìyàn síbi àsè. “sí i” mú kí ìtumọ̀ ìpè náà ṣe kedere ní Yorùbá, πολλούς sì ni “ọ̀pọ̀ ènìyàn.”
theological_decisions: []
translation_notes:
  register: Yorùbá ìlànà tí ó ní àmì ohùn ní kíkún, tí ó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àsè” nítorí àyíká ìpè sí oúnjẹ ológo, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò δεῖπνον mọ́. A gbe àmì [a] lẹ́yìn gbólóhùn tí ó túmọ̀ δεῖπνον μέγα, kì í ṣe lẹ́yìn “fún un,” nítorí ibẹ̀ ni àlàyé ọ̀rọ̀ náà tọ́ sí.
