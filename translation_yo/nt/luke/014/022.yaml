source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: yo
  text: Ìránṣẹ́ náà[a] sì wí pé, ‘Olúwa[b], ohun tí o pàṣẹ ti ṣẹ, ààyè sì ṣì wà.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹrú” dípò “ìránṣẹ́” (δοῦλος).
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Ọ̀gá” dípò “Olúwa” (Κύριε).
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ìránṣẹ́
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ẹrú tàbí ìránṣẹ́. Nínú àkàwé yìí, “ìránṣẹ́” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìbáṣepọ̀ ẹni tí ń pàṣẹ àti ẹni tí ń ṣiṣẹ́ mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ “ẹrú” hàn.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè sí baálé ilé nínú àkàwé. “Olúwa” pa agbára àti ọlá ẹni tí a ń bá sọ̀rọ̀ mọ́, bí ó tilẹ̀ jẹ́ pé “ọ̀gá” bá àyíká ilé mu pẹ̀lú.
- source_word: γέγονεν
  choice: a ti ṣe
  rationale: Fọ́ọ̀mù pípé náà fi hàn pé a ti mú àṣẹ náà ṣẹ, abajade rẹ̀ sì dúró títí di àsìkò ọ̀rọ̀ náà.
- source_word: ὃ ἐπέταξας
  choice: ohun tí o pàṣẹ
  rationale: Ó tọ́ka sí gbogbo ohun tí olúwa náà ti pàṣẹ, ó sì pa agbára ọ̀rọ̀-ìṣe ἐπιτάσσω mọ́.
- source_word: ἔτι
  choice: ṣì
  rationale: “Ṣì” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ààyè ń bẹ lẹ́yìn tí a ti mú àṣẹ ṣẹ.
- source_word: τόπος
  choice: ibì kan
  rationale: Nínú àyíká àsè, ó túmọ̀ sí ibì tàbí ààyè tí ẹlòmíràn lè gbà; “ibì kan ṣì wà” jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “wí pé” láti bá ìtàn mímọ́ mu láì jẹ́ kí èdè di àtijọ́ jù. Àwọn àmì ìsàlẹ̀ [a] àti [b] ni a so mọ́ gbólóhùn náà láti pa àwọn àṣàyàn ọ̀rọ̀ orísun mọ́.
