id: LUK.14.9
reference: Luke 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: yo
  text: Ẹni tí ó pe ọ àti òun yóò sì wá, yóò sì sọ fún ọ pé, “Fi ipò rẹ fún ẹni yìí.” Nígbà náà ni ìwọ yóò bẹ̀rẹ̀ sí í gba ipò ìkẹyìn pẹ̀lú ìtìjú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipò tó rẹlẹ̀ jù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ipò tó wà ní ìkẹyìn nínú ìtòlẹ́sẹẹsẹ; nítorí náà, nínú àyíká àsè yìí, ó lè jẹ́ ipò ìjókòó tó kéré jù lọ ní ọlá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: Ẹni tí ó pe ìwọ àti òun
  rationale: Èyí mú ìtumọ̀ àpólà alábápín ọ̀rọ̀ náà jáde gẹ́gẹ́ bí ẹni tó ṣe ìpè, ó sì pa ìyàtọ̀ láàárín àwọn méjèèjì tí a pè mọ́.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: yóò sì wá, yóò sì sọ fún ọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐλθών jẹ́ alábápín ọ̀rọ̀ aorist, ó ṣáájú ọ̀rọ̀-ìṣe ọjọ́ iwájú ἐρεῖ; ìtumọ̀ yìí fi ìtẹ̀lé àwọn ìṣe méjèèjì hàn ní Yorùbá àdánidá.
- source_word: Δὸς τούτῳ τόπον
  choice: Fi ipò rẹ fún ọkùnrin yìí
  rationale: Nínú àyíká àsè yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ipò ìjókòó ẹni fún àlejò kejì, kì í ṣe wíwá ààyè lásán. Fífi “rẹ” kún un mú ohun tí àyíká ọ̀rọ̀ béèrè ṣe kedere.
- source_word: μετὰ αἰσχύνης
  choice: fi ìtìjú
  rationale: Ìtìjú ṣe àfihàn αἰσχύνη gẹ́gẹ́ bí ojú títì tàbí àbùkù níwájú àwọn ẹlòmíràn; ó lágbára ju ìdààmú kékeré lásán lọ.
- source_word: ἄρξῃ ... κατέχειν
  choice: yóò ... bẹ̀rẹ̀ sí í gba
  rationale: Àkópọ̀ yìí pa ìtumọ̀ “bẹ̀rẹ̀” mọ́, ó sì lo “gba” fún gbígba tàbí jíjẹ́ ẹni tó wà ní ipò ìjókòó náà láìfi ìfipámú tí kò hàn gbangba sínú ọ̀rọ̀.
- source_word: τὸν ἔσχατον τόπον
  choice: ipò ìkẹyìn
  rationale: Ìtumọ̀ yìí pa èrò “ìkẹyìn” mọ́, ó sì bá ìtòlẹ́sẹẹsẹ ipò ìjókòó ní àsè mu; ó tún jẹ́ kí ìtumọ̀ “ipò tó rẹlẹ̀ jù” wà láìyanju àìdánilójú náà ní ọ̀nà kan ṣoṣo.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbàṣe tó mọ́gbọ́n dání, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ipò” ni a lò láti pa ìtumọ̀ τόπος mọ́, nígbà tí àyíká àsè ń jẹ́ kí ipò ìjókòó náà ṣe kedere.
