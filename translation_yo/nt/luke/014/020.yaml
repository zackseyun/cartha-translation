  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: yo
  text: Ẹlòmíràn sì sọ pé, “Mo ti fẹ́ aya[a], nítorí náà, èmi kò lè wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo fẹ́ aya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: Ẹlòmíràn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹlòmíràn nínú àwọn tí wọ́n ń sọ àwáwí wọn lọ́kọ̀ọ̀kan.
- source_word: Γυναῖκα ἔγημα
  choice: Mo ti gbéyàwó
  rationale: Ní àyíká yìí, γυνή túmọ̀ sí ‘aya,’ ἔγημα sì túmọ̀ sí pé ọkùnrin náà ti ṣe ìgbéyàwó. ‘Mo ti gbéyàwó’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀, ó sì ní ipa lórí ipò rẹ̀ nísinsìnyí.
- source_word: διὰ τοῦτο
  choice: nítorí ìdí èyí
  rationale: Ó pa ìsopọ̀ ohun tó ṣẹlẹ̀ mọ́ mọ́ àwáwí tí olùsọ̀rọ̀ náà fi sọ pé òun kò lè wá.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: mi ò lè wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ àìlè ṣe ohun kan, ó sì pa ìtumọ̀ δύναμαι mọ́.
