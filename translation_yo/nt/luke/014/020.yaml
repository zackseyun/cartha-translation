  register: A lo Yorùbá òde òní tó ṣe déédéé fún ọ̀rọ̀ ẹnu inú àkàwé náà. ‘Mi ò lè wá’ jẹ́ ti ìjíròrò àdánidá, ṣùgbọ́n ó ṣì níyì, ó sì yé àwọn òǹkàwé lọ́nà rọrùn.
