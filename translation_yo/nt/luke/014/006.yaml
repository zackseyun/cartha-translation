translation:
  language: yo
  text: Wọ́n kò sì lè dáhùn sí nǹkan wọ̀nyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “sí èyí” tàbí “ní ìdáhùn sí nǹkan wọ̀nyí.” Ọ̀rọ̀ ìtọ́ka náà nínú Gíríìkì wà ní ọ̀pọ̀; ní ìtumọ̀ tààrà, “sí nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ọ̀rọ̀ tó wọ́pọ̀ ní Yorùbá ni “sì”; ó ń tẹ̀síwájú láti inú ìjíròrò tó ṣáájú láìfi ìtumọ̀ àkókò kún un.
- source_word: οὐκ
  choice: kò
  rationale: “Kò” ni àtakò Yorùbá tó bá ọ̀rọ̀-ìṣe ẹni púpọ̀ mu ní àyíká yìí.
- source_word: ἴσχυσαν
  choice: lè
  rationale: Níhìn-ín ἰσχύω ń tọ́ka sí agbára láti ṣe ohun kan, kì í ṣe okun ara; “lè” sọ ìtumọ̀ agbára yẹn jáde lọ́nà àdánidá.
- source_word: ἀνταποκριθῆναι
  choice: dáhùn
  rationale: “Dáhùn” túmọ̀ sí fífi èsì fún ohun tí a sọ tàbí béèrè, ó sì yẹra fún ìtumọ̀ líle bíi dídá ẹnu padà.
- source_word: πρὸς ταῦτα
  choice: sí nǹkan wọ̀nyí
  rationale: Àṣàyàn yìí pa ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì fi hàn pé wọn kò lè fún àwọn ọ̀rọ̀ náà ní èsì.
