  verdict: revise
  source_fidelity: The draft accurately preserves the household list, the climactic inclusion of one’s own life, and the force of inability in ‘kò lè jẹ́ ọmọ-ẹ̀yìn mi.’ It appropriately retains the stark primary sense of μισεῖ (‘kórìíra’) while placing the comparative-priority explanation in a footnote. A minor grammatical and orthographic revision improves the conditional construction and restores the required tone mark in ‘bàbá.’
  naturalness: ‘Ẹnikẹ́ni tí ó bá wá sọ́dọ̀ mi, tí kò bá sì kórìíra ...’ is smoother and more idiomatic Standard Yoruba than the draft’s mixed conditional sequence. ‘Bàbá ara rẹ̀’ naturally represents ‘his own father.’ The revised footnote gives the comparative alternative in clear Yoruba.
  terminology: ‘Kórìíra,’ ‘ìwàláàyè ara rẹ̀,’ and ‘ọmọ-ẹ̀yìn mi’ are suitable, accurate terms. The revision retains ‘aya’ for γυνή in its household sense and explicitly retains both male and female siblings.
