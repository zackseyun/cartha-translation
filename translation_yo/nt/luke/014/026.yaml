    rationale: The Standard Yoruba word for ‘father’ is ‘bàbá.’ ‘Bàbá ara rẹ̀’ is a more natural way to express the reflexive emphasis of πατέρα ἑαυτοῦ.
  - severity: low
    issue: The conditional sequence ‘Bí ... bá ..., tí kò sì ...’ is less regular than the corresponding subjunctive construction.
    rationale: Using ‘Ẹnikẹ́ni tí ó bá ... tí kò bá sì ...’ clearly carries both conditions and reads naturally in contemporary formal Yoruba.
  - severity: low
    issue: Footnote a’s proposed comparative wording, ‘fẹ́ ... níwọ̀n tí ó kéré sí i,’ is not idiomatic Yoruba.
    rationale: ‘Tí kò fẹ́ràn ... ju mí lọ’ naturally conveys the contextual comparative sense, without softening the main-text rendering ‘kórìíra.’
