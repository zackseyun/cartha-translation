id: LUK.14.26
reference: Luke 14:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá wá sọ́dọ̀ mi, tí kò bá sì kórìíra[a] bàbá ara rẹ̀ àti ìyá rẹ̀, aya rẹ̀, àwọn ọmọ rẹ̀, àwọn arákùnrin rẹ̀ àti àwọn arábìnrin rẹ̀—àní ìwàláàyè ara rẹ̀ pàápàá[b]—kò lè jẹ́ ọmọ-ẹ̀yìn mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò fẹ́ràn ... ju mí lọ.” Ọ̀rọ̀ náà túmọ̀ ní tààrà sí “kórìíra,” ṣùgbọ́n nínú àyíká yìí ó ń béèrè pé kí ìfaramọ́ ẹni sí Jésù ga ju ìdè ẹbí tó sún mọ́ ẹni jù lọ; fi wé Mátíù 10:37.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọkàn ara rẹ̀.” Nínú àyíká àwọn ohun tí jíjẹ́ ọmọ-ẹ̀yìn lè ná ẹni, ó ṣeé ṣe jù pé ψυχή túmọ̀ sí ìwàláàyè ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: kórìíra
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì náà, ó sì pa bí ọ̀rọ̀ Jésù ṣe le tó mọ́. Àlàyé ìtumọ̀ afíwéra, pé kí ẹni fi ìfẹ́ sí Jésù ṣáájú ìfẹ́ sí ẹbí, wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔρχεται πρός με
  choice: wá sọ́dọ̀ mi
  rationale: Ó túmọ̀ ìṣípò tààrà sí ọ̀dọ̀ Jésù láì yí i padà sí gbólóhùn mìíràn bí ‘tẹ̀ lé mi.’
- source_word: πατέρα ἑαυτοῦ
  choice: baba tirẹ̀
  rationale: ‘Tirẹ̀’ fi agbára arọ́pò-orúkọ ìpadàsọ́dọ̀ ẹni inú ἑαυτοῦ hàn.
- source_word: γυναῖκα
  choice: aya rẹ̀
  rationale: Nínú àkójọ àwọn ará ilé yìí, ‘aya’ ni ìtumọ̀ àyíká tí ó yẹ fún γυνή.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: àwọn arákùnrin rẹ̀ àti àwọn arábìnrin rẹ̀
  rationale: Orísun náà dárúkọ àwọn arákùnrin àti àwọn arábìnrin ní pàtó, nítorí náà a pa àwọn méjèèjì mọ́.
- source_word: ἔτι τε καὶ
  choice: àní ... pàápàá
  rationale: Àpapọ̀ ọ̀rọ̀ yìí gbé ohun tó gbẹ̀yìn nínú àkójọ náà ga; ‘àní ... pàápàá’ mú ìtẹnumọ́ náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ψυχὴν ἑαυτοῦ
  choice: ìwàláàyè ara rẹ̀
  rationale: Nínú àyíká iye tí jíjẹ́ ọmọ-ẹ̀yìn ń ná, ψυχή ń tọ́ka sí ìwàláàyè ẹni fúnra rẹ̀, kì í ṣe dandan sí ọkàn aláìlérò ní ìtumọ̀ tóóró.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kò lè jẹ́ ọmọ-ẹ̀yìn mi
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó pa agbára àìlèṣe tàbí àìbáramu inú gbólóhùn Gíríìkì náà mọ́.
theological_decisions:
- issue: Bóyá kí a rọ agbára μισεῖ kù nípa fífi ìtumọ̀ afíwéra sínú ọ̀rọ̀ pàtàkì
  choice: A lo ‘kórìíra’ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìtumọ̀ afíwéra àti ìṣáájú ìfaramọ́ nínú àlàyé ìsàlẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ sí ‘fẹ́ ... níwọ̀n díẹ̀’ tàbí pé ‘má ṣe fẹ́ ... ju mi lọ.’
  rationale: Ọ̀rọ̀ Jésù mọ̀ọ́mọ̀ le. Pípa ‘kórìíra’ mọ́ ń jẹ́ kí ìforígbárí inú ọ̀rọ̀ náà dúró, dípò kí ìtumọ̀ túmọ̀-ọrọ̀ rọ ọ́ kù ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ ψυχή nínú ẹsẹ yìí
  choice: A túmọ̀ rẹ̀ sí ‘ìwàláàyè,’ kì í ṣe ‘ọkàn.’
  alternative: ọkàn; ara ẹni
  rationale: Àyíká náà ń sọ nípa ohun tí jíjẹ́ ọmọ-ẹ̀yìn lè ná ẹni àti fífi gbogbo ìwàláàyè ẹni sábẹ́ ìfaramọ́ sí Jésù. ‘Ìwàláàyè’ sọ èyí kedere láì fi ẹ̀kọ́ tóóró kan nípa ẹ̀dá ọkàn kún un.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. Àtúnṣe ‘àní ... pàápàá’ jẹ́ àdánidá ní Yorùbá, ‘ọmọ-ẹ̀yìn’ sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀ fún μαθητής. Àwọn àmì ohùn ni a fi sí ibi gbogbo tí ó yẹ.
