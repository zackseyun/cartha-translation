  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: yo
  text: 'Ọ̀pọ̀ ènìyàn ń bá a lọ[a]; ó sì yíjú sí wọn, ó sọ fún wọn pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀pọ̀ ènìyàn ń bá a rìn ìrìn àjò.” Ọ̀rọ̀ Gíríìkì tẹnu mọ́ ọn pé ogunlọ́gọ̀ ènìyàn ń bá Jésù lọ bí ó ti ń rìn ìrìn àjò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: ń bá a rìn ìrìn àjò
  rationale: 'Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn: àwọn èrò náà ń bá a lọ ní ọ̀nà. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìrìn-àjò pẹ̀lú ẹni kan mọ́.'
- source_word: δὲ
  choice: kò ṣe é túmọ̀ lọ́tọ̀ nínú gbólóhùn àkọ́kọ́
  rationale: Níhìn-ín, δέ jẹ́ àmì ìyípadà kékeré nínú ìtàn, kì í ṣe àmì àtakò líle. Sísọ ọ́ di “nígbà náà” tàbí “ṣùgbọ́n” lè fi ìtumọ̀ tí Gíríìkì kò ní kún un; àsopọ̀ “sì” nínú abala kejì mú ìṣàn ìtàn náà dáadáa.
- source_word: αὐτῷ
  choice: bá a
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù láì tún orúkọ rẹ̀ sọ; ìtumọ̀ ìbákẹ́gbẹ́ wà nínú “bá a.”
- source_word: ὄχλοι πολλοί
  choice: ọ̀pọ̀lọpọ̀ èrò
  rationale: Èyí pa èrò pé àwọn ènìyàn pọ̀ gan-an mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá. “Èrò” lè tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ.
- source_word: καὶ
  choice: ó sì
  rationale: Àsopọ̀ yìí so ìṣe Jésù mọ́ àyíká ìrìn-àjò náà ní ọ̀nà àdánidá.
- source_word: στραφεὶς
  choice: ó yíjú sí wọn
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀ tí Jésù sọ. “Yíjú sí wọn” fi hàn pé ó yí sí àwọn èrò láti bá wọn sọ̀rọ̀, láì fi ìtọ́sọ́nà ara tí ọ̀rọ̀ Gíríìkì kò pàṣẹ kún un.
- source_word: εἶπεν
  choice: ó wí pé
  rationale: Ìtumọ̀ ìtàn tí ó péye, tó sì ní ìforúkọsílẹ̀ ọlọ́lá fún ọ̀rọ̀ tí yóò tẹ̀ lé.
- source_word: πρὸς αὐτούς
  choice: sí wọn
  rationale: Ó pa arọ́pò-orúkọ Gíríìkì mọ́, àwọn èrò sì ni ohun tí “wọn” ń tọ́ka sí.
