review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ìkọ̀sẹ̀ méjì náà (‘kì í yẹ fún ilẹ̀ tàbí òkìtì ìgbẹ́’), olùṣe ọ̀pọ̀ tí a kò dárúkọ nínú ‘wọ́n’, àti ìpè ìgbọ́ ní ìparí wà níbẹ̀. Àtúnṣe kékeré sí ‘wọ́n máa ń ju ú síta’ mú βάλλουσιν hàn ní kedere gẹ́gẹ́ bí jíju nù, pẹ̀lú ìṣe gbogbogbòó tí ìsinsìnyí Gíríìkì ń fi hàn.'
  naturalness: ‘Kò yẹ fún ilẹ̀, bẹ́ẹ̀ ni kò yẹ fún òkìtì ìgbẹ́’ jẹ́ Yorùbá tó ṣe kedere. ‘Wọ́n máa ń ju ú síta’ jẹ́ ìsọ̀rọ̀ àdánidá ju ‘wọ́n ń sọ ọ́ síta’ lọ nínú àwòrán ohun tí a ń danù. Gbólóhùn ìparí náà jẹ́ ọ̀rọ̀ ìkìlọ̀ tí ó bojúmu ní Yorùbá.
  terminology: ‘Ilẹ̀’ yẹ fún γῆ nínú àyíká iṣẹ́ àgbẹ̀; ‘òkìtì ìgbẹ́’ pa ìtumọ̀ κοπρία mọ́. Àpèjúwe àlàyé ìsàlẹ̀ (a) yẹ kí ó lo ‘òkìtì ààtàn,’ èyí tí ó jẹ́ yíyàn ọ̀rọ̀ mìíràn tó dájú fún dung/manure heap, dípò ‘òkìtì ajílẹ̀,’ èyí tí ó lè tọ́ka sí àkópọ̀ ajílẹ̀ tàbí ohun ìfẹ̀sẹ̀mulẹ̀ ilẹ̀ tí ó gbooro ju.
  issues:
  - severity: low
    issue: ‘sọ ọ́ síta’ kò ní agbára ‘throw/cast out’ tó hàn gbangba.
    rationale: βάλλουσιν ní ìtumọ̀ jíju tàbí dídànù níbí. ‘Ju ú síta’ jẹ́ ọ̀rọ̀ Yorùbá tó péye sí i; ‘máa ń’ sì tọ́ka sí ìṣe gbogbogbòó nínú ọ̀rọ̀ àkàwé náà.
  - severity: low
    issue: Àpèjúwe ìsàlẹ̀ (a) ní ‘òkìtì ajílẹ̀’ kò jẹ́ yíyàn ọ̀rọ̀ tó péye jù lọ fún κοπρίαν.
    rationale: ‘Ajílẹ̀’ lè ní ìtumọ̀ fertilizer tàbí compost ní gbangba, ṣùgbọ́n κοπρίαν ń sọ̀rọ̀ ní pàtó nípa dung/manure. ‘Òkìtì ààtàn’ pa ìtumọ̀ yíyàn ‘dung heap’ mọ́.
  revised_text: Kò yẹ fún ilẹ̀, bẹ́ẹ̀ ni kò yẹ fún òkìtì ìgbẹ́[a]; wọ́n máa ń ju ú síta. Ẹni tí ó ní etí láti fi gbọ́[b], kí ó gbọ́.
