source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: yo
  text: Kò yẹ fún ilẹ̀, bẹ́ẹ̀ ni kò yẹ fún òkìtì ìgbẹ́[a]; wọ́n máa ń ju ú síta. Ẹni tí ó ní etí láti fi gbọ́[b], kí ó gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘òkìtì ààtàn.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘Ẹnikẹ́ni tí ó bá ní etí láti gbọ́, kí ó gbọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: ilẹ̀
  rationale: Nínú àkàwé iṣẹ́ àgbẹ̀ yìí, γῆ ń tọ́ka sí ilẹ̀ tí a lè lò fún dida ohun ọ̀gbìn, kì í ṣe gbogbo ayé.
- source_word: κοπρίαν
  choice: òkìtì ìgbẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ibi tí a kó ìgbẹ́ sí fún lílò ní iṣẹ́ àgbẹ̀. ‘Òkìtì ìgbẹ́’ ṣe àwòrán náà ní kedere, ó sì pa ìtumọ̀ gidi ọ̀rọ̀ náà mọ́.
- source_word: εὔθετόν
  choice: yẹ fún
  rationale: ‘Yẹ fún’ fi ìtumọ̀ ohun tí ó bá ìlò kan mu tàbí tí ó dára fún un hàn láì dín un kù sí pé ó kàn wúlò.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: wọ́n ń sọ ọ́ síta
  rationale: Èyí pa ọ̀nà ìṣe alágbára àti olùṣe ọ̀pọ̀ tí a kò dárúkọ nínú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́
  rationale: Èyí tẹ̀ lé ìṣètò Gíríìkì, ó sì pa agbára àṣẹ ἀκουέτω mọ́. ‘Ẹni’ lè dúró fún ẹnikẹ́ni láì fi akọ tàbí abo kún ibi tí èdè Yorùbá kò ti béèrè rẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ ìṣírí ìparí àti akọ aṣojú nínú Gíríìkì
  choice: Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́
  alternative: Ẹnikẹ́ni tí ó bá ní etí láti gbọ́, kí ó gbọ́
  rationale: Gíríìkì lo ẹyọ akọ ní ìlànà gírámà, ṣùgbọ́n ó ń ṣojú gbogbo ẹni tó bá gbọ́. Nítorí Yorùbá kò fi akọ tàbí abo hàn nínú ‘ẹni,’ ìtumọ̀ aṣojú náà dúró láì fi ìyàtọ̀ akọ-abo tí kò bá èdè Yorùbá mu kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tí ó lọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ilẹ̀’ àti ‘òkìtì ìgbẹ́’ láti mú àyíká iṣẹ́ àgbẹ̀ àti àwòrán gidi inú ẹsẹ náà hàn; ‘wọ́n ń sọ ọ́ síta’ sì pa olùṣe àìdánimọ̀ inú Gíríìkì mọ́.
