id: LUK.14.31
reference: Luke 14:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: yo
  text: Àbí ọba wo ni, nígbà tí ó bá ń lọ láti bá ọba mìíràn jagun, tí kì yóò kọ́kọ́ jókòó, kí ó sì ronú bóyá òun lè fi ẹgbẹ̀rún mẹ́wàá dojú kọ[a] ẹni tí ń bọ̀ wọ̀ ọ́ pẹ̀lú ẹgbẹ̀rún ogún?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pàdé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “pàdé” ní tààràtà, ṣùgbọ́n níhìn-ín ó tọ́ka sí pàdé ẹni tí ń bọ̀ wọ̀ ọ́ nínú ìjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó so àpẹẹrẹ kejì mọ́ èyí tí ó ṣáájú rẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìbéèrè àfiwé ní Yorùbá.
- source_word: τίς βασιλεὺς
  choice: ọba wo ni
  rationale: Èyí mú agbára ìbéèrè àsọyé náà jáde ní Yorùbá, níbi tí ìdáhùn tí a ń retí ti hàn gbangba.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: nígbà tí ó bá ń lọ láti bá ọba mìíràn jagun
  rationale: Gbólóhùn yìí fi ìlọsíwájú pẹ̀lú ète àti ìjà ológun hàn ní èdè Yorùbá tó ṣe kedere, láì mú un ju ohun tí Gíríìkì sọ lọ.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: tí kì yóò kọ́kọ́ jókòó, kí ó sì ronú
  rationale: Ìbéèrè náà ń retí ìdáhùn rere; “kọ́kọ́ jókòó” pa ìtòlẹ́sẹẹsẹ iṣẹ́ mọ́, “ronú” sì sọ ìgbìmọ̀-ọkàn àti ṣíṣe àgbéyẹ̀wò di mímọ̀.
- source_word: εἰ δυνατός ἐστιν
  choice: bóyá òun lè
  rationale: Ó tọ́ka sí agbára tàbí ohun tí ó ṣeé ṣe fún un, kì í ṣe àṣẹ láti ṣe é.
- source_word: ἐν δέκα χιλιάσιν
  choice: fi ẹgbẹ̀rún mẹ́wàá
  rationale: “Fi” mú ìtumọ̀ ohun èlò tàbí ọmọ-ogun tí ó wà lọ́wọ́ ọba náà jáde lọ́nà àdánidá.
- source_word: ὑπαντῆσαι
  choice: dojú kọ
  rationale: Ní àyíká ogun, ọ̀rọ̀ náà túmọ̀ sí pípa ojú dé tàbí dídìde lòdì sí ọmọ-ogun tó ń bọ̀; “dojú kọ” mú agbára yìí hàn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gidi “lọ pàdé” pamọ́.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: ẹni tí ń bọ̀ sí i pẹ̀lú ẹgbẹ̀rún ogún
  rationale: Ó pa àwòrán ọba kejì tí ń tẹ̀ síwájú lòdì sí i mọ́, pẹ̀lú iye ọmọ-ogun rẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní ọlá, tí ó sì yé òǹkàwé òde òní. A lo àkópọ̀ “ọba wo ni ... tí kì yóò” fún ìbéèrè àsọyé, àti “òun” láti fi ọba àkọ́kọ́ hàn kedere láàárín àwọn ọba méjì.
