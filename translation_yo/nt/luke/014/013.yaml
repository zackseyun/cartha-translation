source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: yo
  text: Ṣùgbọ́n nígbàkigbà tí o bá ṣe àsè[a], pe àwọn tálákà, àwọn abirùn[b], àwọn arọ, àti àwọn afọ́jú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí o bá pèsè àsè” tàbí “nígbà tí o bá gba àwọn ènìyàn lálejò.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí wọ́n ní àbùkù ara; ó tún lè kan àwọn tí ẹ̀yà ara wọn ti fara pa tàbí tí ẹ̀yà kan ara wọn kò pé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi àṣẹ yìí ṣe ìyàtọ̀ sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ nípa àwọn tí a kò gbọdọ̀ máa pè sí àsè.
- source_word: ὅταν
  choice: nígbàkigbà tí o bá
  rationale: 'Ìsọ yìí mú ìtumọ̀ àkókò tí kò dá lórí ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo jáde: ní gbogbo ìgbà tí irú àǹfààní bẹ́ẹ̀ bá wáyé.'
- source_word: δοχὴν ποιῇς
  choice: tí o bá ṣe àsè
  rationale: ‘Ṣe àsè’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbàlejò níbi oúnjẹ ńlá tàbí àjọyọ̀; kò fi ìtumọ̀ náà mọ́ oúnjẹ alẹ́ nìkan.
- source_word: κάλει
  choice: pe
  rationale: Nínú ọ̀rọ̀ àsè, ‘pe’ túmọ̀ sí fífi ìkésíni ránṣẹ́ sí ẹnì kan.
- source_word: πτωχούς
  choice: àwọn tálákà
  rationale: Ó tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ òtòṣì; ọ̀rọ̀ yìí ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ἀναπείρους
  choice: àwọn abirùn
  rationale: Ó tọ́ka sí àwọn tí wọ́n ní àìlera tàbí àbùkù ara tó lágbára. A pa á mọ́ gẹ́gẹ́ bí ẹ̀ka tó yàtọ̀ sí àwọn arọ, bí àkójọ Gíríìkì ṣe rí.
- source_word: χωλούς
  choice: àwọn arọ
  rationale: Ó tọ́ka ní pàtó sí àwọn tí ìrìn wọn ní ìdíwọ́, ó sì yàtọ̀ sí ọ̀rọ̀ gbogbogbò fún àwọn abirùn.
- source_word: τυφλούς
  choice: àwọn afọ́jú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí kò ríran.
theological_decisions:
- issue: Bí a ṣe lè tú àwọn ọ̀rọ̀ tó ní í ṣe pẹ̀lú àìlera ara ní ọ̀nà tó bọ̀wọ̀ fún ènìyàn, láìpa ìyàtọ̀ inú àkójọ Gíríìkì rẹ́
  choice: Lo ‘àwọn abirùn’ fún ἀναπείρους àti ‘àwọn arọ’ fún χωλούς gẹ́gẹ́ bí ẹ̀ka méjì ọ̀tọ̀.
  alternative: Lo ‘àwọn tó ní àìlera ara’ àti ‘àwọn tí kò lè rìn dáadáa.’
  rationale: Àyànfẹ́ náà pa ìṣísẹ̀ kúkurú ti àkójọ orísun mọ́, ó sì ṣọ́ ìyàtọ̀ láàárín àìlera ara ní gbogbogbò àti ìdíwọ́ rírìn ní pàtó. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ìwọ̀n ìtumọ̀ ἀναπείρους hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà jẹ́ kúkúrú, ó ní iyì, ó sì tẹ̀ lé àkójọ orísun. ‘Ṣe àsè’ àti ‘pe’ jẹ́ ọ̀rọ̀ àdánidá fún ọ̀rọ̀ gbígbàlejò; a kò lo ọ̀rọ̀ ẹ̀kọ́ ìsìn àkànṣe kankan.
