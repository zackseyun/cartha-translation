source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: yo
  text: Nítorí ta ni nínú yín tí ó fẹ́ kọ́ ilé gogoro kan, tí kò kọ́kọ́ jókòó láti ṣírò iye ìnáwó náà[a], bóyá ó ní ohun tó tó láti parí iṣẹ́ náà[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ka iye ìnáwó náà” tàbí “láti ṣírò owó iṣẹ́ náà.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “bóyá ó ní fún ìparí.” Ìtumọ̀ rẹ̀ ni bóyá ohun ìní rẹ̀ tó láti parí iṣẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Nítorí ta ni nínú yín
  rationale: Ó pa ìsopọ̀ γάρ mọ́ pẹ̀lú “Nítorí,” ó sì mú ìbéèrè àsọyé tí a darí sí àwọn olùgbọ́ jáde lọ́nà Yorùbá àdánidá.
- source_word: θέλων
  choice: tí ó bá fẹ́
  rationale: Ó ṣàfihàn ìfẹ́ tàbí ète ẹni náà, ó sì bá ìlànà ìbéèrè àfojúsùn mu ní Yorùbá.
- source_word: πύργον
  choice: ilé gogoro kan
  rationale: “Ilé gogoro” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ilé gíga tàbí tower, láì tú àwòrán orísun náà ká.
- source_word: οἰκοδομῆσαι
  choice: kọ́
  rationale: “Kọ́” ni ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ilé tàbí ohun ìkọ́lé.
- source_word: οὐχὶ
  choice: tí kì yóò
  rationale: 'Ó pa agbára ìbéèrè tí ń retí ìdáhùn rere mọ́: ó dájú pé ẹni náà yóò kọ́kọ́ ṣe ìṣírò.'
- source_word: πρῶτον καθίσας
  choice: kọ́kọ́ jókòó
  rationale: Ó pa ìṣe tí ó ṣáájú mọ́, ó sì tẹ̀ lé àwòrán gangan ti jíjókòó láti gbèrò.
- source_word: ψηφίζει τὴν δαπάνην
  choice: ṣírò iye owó tí yóò ná
  rationale: “Ṣírò” mú ìtumọ̀ kíkà tàbí ṣíṣe àròkọ jáde; “iye owó tí yóò ná” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún δαπάνη.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: kí ó lè mọ̀ bóyá ohun tí ó ní tó láti parí rẹ̀
  rationale: Ó mú idi ìṣírò náà yé ni Yorùbá, nígbà tí ó pa ìtumọ̀ gangan náà mọ́ pé a ń wádìí bóyá ohun ìní ẹni náà tó fún ìparí iṣẹ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ilé gogoro” láti pa àwòrán πύργος mọ́, a sì jẹ́ kí ìbéèrè àsọyé náà dun bí Yorùbá àdánidá.
