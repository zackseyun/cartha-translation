    rationale: Orísun náà sọ pé ẹni náà jókòó láti ṣírò ìnáwó náà, bóyá ó ní ohun tó fún ìparí; kò fi ète náà hàn gẹ́gẹ́ bí “kí ó lè mọ̀.” Yíyọ ọ́ kúrò ń pa ìṣọ̀kan pẹ̀lú orísun mọ́.
  - severity: low
    issue: “iye owó tí yóò ná” kéré sí ìtumọ̀ δαπάνη.
