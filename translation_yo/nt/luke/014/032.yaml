  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: yo
  text: Ṣùgbọ́n bí kò bá ṣe bẹ́ẹ̀, nígbà tí ọba kejì náà ṣì wà ní ibi jíjìn, ó rán ìjọ aṣojú[a], ó sì béèrè fún àwọn ohun tí yóò mú àlàáfíà wá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣojú.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “àwọn ohun tí ó ní í ṣe pẹ̀lú àlàáfíà”; ìyẹn ni, àwọn ohun tàbí ìlànà tí yóò mú àlàáfíà wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Ṣùgbọ́n bí kò bá rí bẹ́ẹ̀
  rationale: 'Ó pa ìtumọ̀ àtakò àti ipò àídájú inú gbólóhùn Gíríìkì mọ́: ‘ṣùgbọ́n bí bẹ́ẹ̀ kọ́.’ Ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.'
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: nígbà tí ọba kejì náà ṣì wà ní ọ̀nà jíjìn
  rationale: Gbólóhùn yìí fi hàn pé ìṣẹ̀lẹ̀ náà ń ṣẹlẹ̀ nígbà tí ẹni kejì ṣì jìnnà. ‘Ọba kejì náà’ mú ẹni tí αὐτοῦ ń tọ́ka sí ṣe kedere láti inú àkóónú àkàwé náà, láìfi ohun tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: πρεσβείαν
  choice: ikọ̀ aṣojú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ikọ̀ tí a rán lọ tàbí àwọn aṣojú. ‘Ikọ̀ aṣojú’ jẹ́ èdè Yorùbá òde òní tí ó bójú mu ní àyíká ìbánisọ̀rọ̀ láàárín àwọn ọba.
- source_word: ἀποστείλας
  choice: ó rán
  rationale: 'A tú participle aorist náà sí ọ̀rọ̀-ìṣe pípé tí a so mọ́ ìṣe àkọ́kọ́, kí ìtẹ̀síwájú ìṣe náà lè hàn ní Yorùbá àdánidá: ó rán ikọ̀, ó sì béèrè.'
- source_word: ἐρωτᾷ
  choice: ó sì béèrè fún
  rationale: Níhìn-ín, ἐρωτάω túmọ̀ sí béèrè tàbí tọrọ ohun kan, kì í ṣe pé ó kàn ń wádìí ọ̀rọ̀.
- source_word: τὰ πρὸς εἰρήνην
  choice: àwọn àdéhùn àlàáfíà
  rationale: Ní ti gidi, ó jẹ́ ‘àwọn ohun tí ó jẹ mọ́ àlàáfíà’; nínú àyíká ogun, ó ń tọ́ka sí àwọn àdéhùn tàbí ohun tí yóò mú àlàáfíà wá. Ìtumọ̀ yìí ṣe kedere, ṣùgbọ́n àlàyé ìtumọ̀ gidi wà nínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá tí ó lọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A gbé àwọn àmì àlàyé ìsàlẹ̀ sí ọ̀rọ̀ tí ọkọọkan wọn ń ṣàlàyé, nítorí ibi tí wọ́n wà nínú consultation layer Gẹ̀ẹ́sì kò bá àkóónú àwọn àlàyé náà mu.
