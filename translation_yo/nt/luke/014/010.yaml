id: LUK.14.10
reference: Luke 14:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí a bá pè ọ́ síbi àsè, lọ jókòó[a] sí ibi tí ó rẹlẹ̀ jù, kí, nígbà tí ẹni tí ó pè ọ́ bá dé, ó lè sọ fún ọ pé, ‘Ọ̀rẹ́, wá jókòó sí ibi tí ó ga sí i.’[b] Nígbà náà, ọlá yóò wà fún ọ níwájú gbogbo àwọn tí wọ́n bá ọ́ jókòó níbi àsè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tọ́ka ní pàtó sí fífi ara lélẹ̀ níbi oúnjẹ, gẹ́gẹ́ bí àṣà jíjẹun ní àkókò náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wá gòkè sí ibi tí ó ga sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: tí a bá pè ọ́ síbi àsè
  rationale: Nínú àyíká àsè, καλέω túmọ̀ sí pípe ẹnì kan wá sí àsè; fífi “síbi àsè” kún un mú ìtumọ̀ náà ṣe kedere ní Yorùbá.
- source_word: πορευθεὶς
  choice: lọ
  rationale: Participle náà bá àṣẹ pàtàkì náà rìn; “lọ jókòó” jẹ́ ọ̀nà àdánidá láti sọ àwọn ìṣe méjèèjì ní Yorùbá.
- source_word: ἀνάπεσε
  choice: jókòó
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífi ara lélẹ̀ lẹ́gbẹ̀ẹ́ tábìlì ní àṣà àsè ìgbàanì, ṣùgbọ́n “jókòó” ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere jù; àlàyé ìṣe ìgbàanì wà ní àlàyé ìsàlẹ̀.
- source_word: ἔσχατον τόπον
  choice: ibi tí ó rẹlẹ̀ jù
  rationale: Ó ń tọ́ka sí ipò tí kò ní ọlá tó àwọn ipò yòókù, kì í ṣe dandan ibi tó wà ní ìkẹyìn ní ti ààyè.
- source_word: ὁ κεκληκώς σε
  choice: ẹni tí ó pè ọ́
  rationale: Èyí tẹ̀ lé participle Gíríìkì ní kíkún láì fi ìtumọ̀ “olùgbàlejò” kún ọ̀rọ̀ náà.
- source_word: Φίλε
  choice: Ọ̀rẹ́
  rationale: Ó pa ọ̀rọ̀ ìkíni onínúure náà mọ́ láì fi ọrọ̀ arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: προσανάβηθι ἀνώτερον
  choice: wá sí ibi gíga sí i
  rationale: Ó pa àwòrán lílọ sókè sí ipò ọlá mọ́, ó sì bá ojú-ìwòye ẹni tó ń pè é mu.
- source_word: δόξα
  choice: ọlá
  rationale: Nínú àyíká awùjọ yìí, δόξα túmọ̀ sí ọlá tí àwọn ẹlòmíràn ń rí, kì í ṣe ògo Ọlọ́run.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: níwájú gbogbo àwọn tí wọ́n jọ jókòó síbi àsè pẹ̀lú rẹ
  rationale: Ó pa ìhàn gbangba ti ọlá náà àti àyíká jíjẹun pọ̀ mọ́.
theological_decisions:
- issue: Irú ẹ̀kọ́ tí ọ̀rọ̀ náà jẹ́
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìtọ́ni inú àkàwé nípa ìrẹ̀lẹ̀ àti ọlá, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
  alternative: Kí a mú un gẹ́gẹ́ bí ìlànà ìwà níbi àsè nìkan, tàbí gẹ́gẹ́ bí ọ̀rọ̀ nípa èrè ọjọ́ ìkẹyìn nìkan.
  rationale: Àwòrán àsè náà lè ṣiṣẹ́ ní ipele awùjọ, ó sì ń tọ́ka sí kókó ìrẹ̀lẹ̀ àti ìyípadà ipò; ìtumọ̀ kò gbọ́dọ̀ pinnu ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “jókòó” fún ìṣe àsè kí ọ̀rọ̀ má bàa ṣòro, a sì ṣàlàyé ìṣe fífi ara lélẹ̀ nínú àlàyé ìsàlẹ̀. Àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ.
