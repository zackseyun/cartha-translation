  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: yo
  text: Nígbà tí àsè alẹ́ náà tó, ó rán ìránṣẹ́ rẹ̀ láti sọ fún àwọn tí a ti pè pé, “Ẹ wá, nítorí ohun gbogbo ti ṣetán báyìí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ó rán
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó rán ẹnì kan lọ fún iṣẹ́ kan; “ó rán” jẹ́ ọ̀nà àdánidá àti tààrà ní Yorùbá.
- source_word: δοῦλον
  choice: ìránṣẹ́
  rationale: Nínú àkàwé ilé àti àsè yìí, ipa ẹni náà gẹ́gẹ́ bí ìránṣẹ́ àti aṣojú ni ó ṣe pàtàkì; “ẹrú” lè tẹnumọ́ ipò ìní ju ohun tí àyíká ọ̀rọ̀ béèrè lọ.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: nígbà tí àsè alẹ́ náà tó
  rationale: Ó pa ìtumọ̀ àkókò tí a yàn fún oúnjẹ mọ́, ó sì dùn bí Yorùbá àdánidá. “Àsè alẹ́” bá àyíká àsè ńlá náà mu láì fi ìtumọ̀ tí kò sí kún un.
- source_word: εἰπεῖν
  choice: láti sọ fún
  rationale: Infinitive náà fi ète rírán ìránṣẹ́ hàn; “láti sọ fún” bá ọ̀rọ̀ tí ó tọ̀ lé e mu ní Yorùbá.
- source_word: τοῖς κεκλημένοις
  choice: àwọn tí a ti pè
  rationale: Fọ́ọ̀mù perfect passive náà fi hàn pé a ti pè wọ́n tẹ́lẹ̀; “a ti pè” dá ìtumọ̀ yẹn dúró kedere.
- source_word: Ἔρχεσθε
  choice: Ẹ wá
  rationale: Àṣẹ sí ọ̀pọ̀ ènìyàn ni; “Ẹ wá” jẹ́ ìpè tààrà, ó sì yẹ fún ọ̀rọ̀ ọ̀wọ̀ sí àwọn àlejò.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí wọ́n fi yẹ kí wọ́n wá, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
- source_word: ἤδη
  choice: báyìí
  rationale: Nínú gbólóhùn Yorùbá “ohun gbogbo ti ṣetán báyìí,” ó fi hàn pé ìmúrasílẹ̀ ti pé ní àkókò yẹn; èyí jẹ́ àdánidá ju lílo “tẹ́lẹ̀” lọ ní àyíká yìí.
- source_word: ἕτοιμά ἐστιν
  choice: ohun gbogbo ti ṣetán
  rationale: Adjective neuter plural pẹ̀lú verb singular ní Gíríìkì ní ìtumọ̀ àpapọ̀, tí subject rẹ̀ kò hàn gbangba. Yorùbá àdánidá ń sọ ọ́ pé “ohun gbogbo ti ṣetán,” ní títọ́ka sí gbogbo ìmúrasílẹ̀ àsè.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A lo “Ẹ wá” fún àṣẹ ọ̀pọ̀ ènìyàn àti ìwà ọ̀wọ̀. Gbólóhùn ìkẹyìn jẹ́ ìtumọ̀ àdánidá fún collective neuter plural Gíríìkì láì dá subject kan pàtó bí “oúnjẹ” sílẹ̀.
