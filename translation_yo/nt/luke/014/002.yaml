  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: yo
  text: Sì wò ó,[a] ọkùnrin kan tí ara rẹ̀ wú nítorí omi wà níwájú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kíyèsí.” Ọ̀rọ̀ Gíríìkì náà ń pe àfiyèsí sí ohun tí ó ṣẹ̀ṣẹ̀ farahàn nínú ìtàn.
    reason: discourse_marker_alternative
lexical_decisions:
- source_word: καὶ
  choice: Sì
  rationale: Ó pa ìsopọ̀ ìtàn mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó fi agbára ọ̀rọ̀ tó ń pe àfiyèsí hàn ní Yorùbá àdánidá.
- source_word: ἄνθρωπός τις
  choice: ọkùnrin kan
  rationale: Ó tọ́ka sí ẹni pàtó kan tí a kò dárúkọ, gẹ́gẹ́ bí τις ṣe ń ṣiṣẹ́ níbí.
- source_word: ἦν
  choice: wà
  rationale: Ìṣe àìpé εἰμί ní ìtumọ̀ wíwà; ‘wà’ bá gbólóhùn Yorùbá mu.
- source_word: ὑδρωπικὸς
  choice: tí ara rẹ̀ wú nítorí omi
  rationale: Ó ṣàlàyé àìsàn ìwú ara nítorí omi inú ẹran-ara ní èdè tí òǹkàwé òde òní lè lóye, láìlo ọ̀rọ̀ ìṣègùn àjèjì.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Ó pa ìtumọ̀ ipò níwájú àti wíwà ní ojú ẹni náà mọ́ láìyan ọ̀kan ṣoṣo.
