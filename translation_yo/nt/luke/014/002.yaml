translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ àdánidá tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A ṣàlàyé ὑδρωπικός dípò lílo orúkọ àìsàn ìṣègùn tí ọ̀pọ̀ ènìyàn kò mọ̀.
