    rationale: “Lẹ́gbẹ̀ẹ́ tábìlì” lè dà bí ibi tó wà ní ẹ̀gbẹ́ tábìlì lásán. “Ipò tí ó ní ọlá jù lọ níbi tábìlì” ń fara mọ́ πρωτοκλισία dáadáa.
