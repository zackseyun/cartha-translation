  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ipò-ìṣàpẹẹrẹ ti Ὅταν mọ́, ó túmọ̀ γάμοι gẹ́gẹ́ bí àsè ìgbéyàwó, ó sì ṣàlàyé πρωτοκλισία gẹ́gẹ́ bí ibi ọlá jù lọ. Síbẹ̀, gbolóhùn ìkẹyìn nínú àwòkọ́ṣe náà lè dà bí ẹni pé ẹni tó ní ọlá ni koko-ọrọ̀ ọrọ̀-ìṣe náà; àtúnṣe náà mú kí ó hàn gbangba pé ẹni tó pè ọ́ ni ó tún ti pe alejo mìíràn.'
  naturalness: Yorùbá náà jẹ́ ti òde òní, ó sì bá ìforúkọsílẹ̀ ìkọ́ni mu. “Má ṣe lọ jókòó” jẹ́ ìsọ̀rọ̀ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa ìṣe rírògbọ̀kú ti ayé ìgbàanì mọ́.
  terminology: “Àsè ìgbéyàwó,” “ibi ọlá jù lọ,” àti “ọlá” jẹ́ yíyan ọ̀rọ̀ tó pé fún àyíká àsè àti ìyàsọ́tọ̀ ìpo tí Gíríìkì ń sọ. Àlàyé ibi ọlá ni a tún ṣètò díẹ̀ kí ó má ṣe fi ipò kan tí kò dájú kún ọ̀rọ̀ náà.
  issues:
