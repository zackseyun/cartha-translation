    rationale: Nínú “ó ti pe ẹni tí ó ní ọlá jù ọ́ lọ,” “ó” lè ní ìtọ́kasí tí òǹkàwé kan kò ní so mọ́ ẹni tó pè alejo àkọ́kọ́ lẹ́sẹ̀kẹsẹ̀. Fífi “ẹni kan” kún un sì ń mú ἐντιμότερός σου ... κεκλημένος hàn kedere, pẹ̀lú ìtumọ̀ ìkìlọ̀ μήποτε.
  - severity: low
