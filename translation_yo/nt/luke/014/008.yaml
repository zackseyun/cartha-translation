  to: Nígbà tí ẹnì kan bá pè ọ́ sí àsè ìgbéyàwó,[a] má ṣe lọ jókòó sí ibi ọlá jù lọ,[b][c] kí ó má bàa jẹ́ pé ó ti pe ẹni kan tí ó ní ọlá ju ìwọ lọ.
