  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: yo
  text: Nígbà tí ẹnì kan bá pè ọ́ sí àsè ìgbéyàwó,[a] má ṣe lọ jókòó sí ibi ọlá jù lọ,[b][c] kí ó má bàa jẹ́ pé ó ti pe ẹni kan tí ó ní ọlá ju ìwọ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ìgbéyàwó.” Ọ̀rọ̀ Gíríìkì tó wà ní ọ̀pọ̀ lè tọ́ka sí gbogbo ayẹyẹ ìgbéyàwó, pàápàá àsè rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Èyí ni ipò tí ó ní ọlá jù lọ níbi tábìlì.
    reason: cultural_note
  - marker: c
    text: Ní àwọn àsè pàtàkì ní ayé ìgbàanì, àwọn ènìyàn sábà máa ń rọ̀gbọ̀kú sí ibi tábìlì dípò kí wọ́n jókòó ṣánṣán.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Nígbà tí ẹnì kan bá pè ọ́
  rationale: Ọ̀rọ̀ yìí gbé ipò gbogbogbò kan kalẹ̀. Nínú àyíká àsè, “pè” túmọ̀ sí pípe ènìyàn wá, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: εἰς γάμους
  choice: sí àsè ìgbéyàwó
  rationale: Ọ̀rọ̀ Gíríìkì tó wà ní ọ̀pọ̀ lè tọ́ka sí ayẹyẹ ìgbéyàwó, pàápàá àsè rẹ̀; àyíká ẹsẹ náà nípa ibi jíjókòó ń ti ìtumọ̀ àsè lẹ́yìn.
- source_word: μὴ κατακλιθῇς
  choice: má ṣe lọ jókòó
  rationale: Ní àsè ìgbàanì, àwọn ènìyàn máa ń rọ̀gbọ̀kú síbi tábìlì, ṣùgbọ́n “jókòó” ni ọ̀rọ̀ Yorùbá àdánidá fún gbígba ipò níbi àsè; àlàyé ìṣe ìgbàanì wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: sí ibi ọlá jù lọ
  rationale: Ó ń tọ́ka sí ipò tó ní ọlá jù lọ níbi àsè, kì í ṣe kàn sí àga kan pàtó.
- source_word: μήποτε
  choice: kí ó má bàa jẹ́ pé
  rationale: Ó fi ìkìlọ̀ àti ohun tó lè ṣẹlẹ̀ hàn lọ́nà tó bá Yorùbá mu.
- source_word: ἐντιμότερός σου
  choice: ẹni tí ó ní ọlá jù ọ́ lọ
  rationale: Ó pa ìfiwéra ipò àti ọlá mọ́ láì sọ pé ẹni náà dára ní ti ìwà ju ẹni kejì lọ.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: ó ti pe
  rationale: Ìṣe pípè náà ti ṣẹlẹ̀ tẹ́lẹ̀, ó sì ní ipa lórí àsè náà. Aṣojú ọ̀rọ̀-ìṣe náà ń tọ́ka padà sí ẹni tó pe ẹni àkọ́kọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àkànṣe, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “lọ jókòó” gẹ́gẹ́ bí ìtumọ̀ àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa àṣà rírògbọ̀kú níbi àsè ìgbàanì mọ́. Àwọn àmì ohùn àti àmì ìsàlẹ̀ wà níbi tó yẹ.
