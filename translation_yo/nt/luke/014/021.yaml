id: LUK.14.21
reference: Luke 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: yo
  text: Nígbà tí ìránṣẹ́ náà padà dé[a], ó ròyìn nǹkan wọ̀nyí fún ọ̀gá rẹ̀. Nígbà náà ni inú bí baálé ilé náà, ó sì sọ fún ìránṣẹ́ rẹ̀ pé, ‘Jáde lọ kíákíá sí àwọn ojú pópó ńlá àti àwọn ọ̀nà kéékèèké inú ìlú, kí o sì mú àwọn tálákà, àwọn tí ara wọn ní àbùkù, àwọn afọ́jú àti àwọn arọ wá síbí.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà tí ìránṣẹ́ náà dé.” Àyíká ìtàn fi hàn pé ó ń padà wá láti ròyìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: padà dé
  rationale: Ní àyíká ìtàn yìí, ìránṣẹ́ náà dé padà láti ròyìn èsì àwọn tí a pè; ‘padà dé’ mú ìtumọ̀ yẹn hàn ní Yorùbá àdánidá.
- source_word: δοῦλος
  choice: ìránṣẹ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ẹrú tàbí ìránṣẹ́, ṣùgbọ́n ipa iṣẹ́ rẹ̀ nínú agbo ilé ni àyíká yìí tẹnumọ́; ‘ìránṣẹ́’ jẹ́ kíkà tí ó ṣe kedere, tí kò sì fi ipò ìdè rẹ̀ pamọ́ gẹ́gẹ́ bí ẹ̀kọ́ pàtàkì.
- source_word: ἀπήγγειλεν
  choice: ròyìn
  rationale: ‘Ròyìn’ bá ìṣe fífi ohun tí ó ṣẹlẹ̀ tó ọ̀gá létí mu dáadáa.
- source_word: κυρίῳ
  choice: ọ̀gá
  rationale: Níbí, κύριος ń tọ́ka sí olórí ènìyàn tí ìránṣẹ́ náà ń ṣiṣẹ́ fún, kì í ṣe akọ́lé Ọlọ́run; ‘ọ̀gá’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbáṣepọ̀ yìí.
- source_word: ὀργισθεὶς
  choice: inú bí
  rationale: Ọ̀rọ̀ yìí fi ìbínú tí ó dìde gẹ́gẹ́ bí ìhùwàpadà baálé ilé hàn; ‘inú bí’ jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: οἰκοδεσπότης
  choice: baálé ilé
  rationale: Ó túmọ̀ sí olórí tàbí ọ̀gá agbo ilé; ‘baálé ilé’ pa àyíká ilé mọ́, ó sì yàtọ̀ sí ‘ọ̀gá’ fún κύριος.
- source_word: πλατείας καὶ ῥύμας
  choice: àwọn ojú pópó ńlá àti àwọn ọ̀nà kéékèèké
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ mọ́ láàárín àwọn ọ̀nà gbígbòòrò ní gbangba àti àwọn ọ̀nà tóóró tàbí kéékèèké.
- source_word: πτωχούς
  choice: àwọn tálákà
  rationale: ‘Àwọn tálákà’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn tí kò ní ohun ìní.
- source_word: ἀναπείρους
  choice: àwọn aláàbò ara
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ara wọn ní àìpé tàbí tí apá kan ara wọn ti bàjẹ́; ‘àwọn aláàbò ara’ jẹ́ ọ̀rọ̀ oníyì tó gbòòrò, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn tó ṣe pàtó hàn.
- source_word: τυφλοὺς καὶ χωλούς
  choice: àwọn afọ́jú àti àwọn arọ
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí jẹ́ ìtumọ̀ Yorùbá tààrà fún àwọn tí kò ríran àti àwọn tí kò lè rìn dáadáa.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àkàwé agbo ilé
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Àyíká ẹsẹ̀ náà tẹnumọ́ iṣẹ́ tí ẹni náà ń ṣe fún ọ̀gá rẹ̀, kì í ṣe fífi ipò ẹrú ṣe kókó ẹ̀kọ́; síbẹ̀, ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ‘ẹrú’.
- issue: Ìtumọ̀ κύριος níbi tí ó ti ń tọ́ka sí ènìyàn
  choice: ọ̀gá
  alternative: olúwa
  rationale: Ẹni tí a ń tọ́ka sí jẹ́ ọ̀gá ìránṣẹ́ nínú àkàwé, kì í ṣe Ọlọ́run. ‘Ọ̀gá’ yẹra fún ìtumọ̀ ti Ọlọ́run, ó sì bá Yorùbá òde òní mu.
- issue: Ìtumọ̀ ἀναπείρους
  choice: àwọn aláàbò ara
  alternative: àwọn tí apá ara wọn ti gé tàbí bàjẹ́
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ àpèjúwe gbòòrò fún àìpé ara tàbí tóóró sí àwọn tí apá ara wọn ti bàjẹ́. A pa ìtumọ̀ gbòòrò mọ́ nínú ẹsẹ̀, a sì ṣàkọsílẹ̀ àṣàyàn tó ṣe pàtó.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ọ̀gá’ àti ‘baálé ilé’ láti pa ìyàtọ̀ κύριος àti οἰκοδεσπότης mọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbogbo àmì àlàyé ìsàlẹ̀ tó wà nínú àkọsílẹ̀ fara hàn nínú ọ̀rọ̀ ẹsẹ̀.
