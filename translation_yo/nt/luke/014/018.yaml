  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo wọn bẹ̀rẹ̀ sí í ṣe àwáwí papọ̀.[a] Ẹni àkọ́kọ́ sọ fún un pé, ‘Mo ra ilẹ̀ kan, mo sì gbọ́dọ̀ lọ wo ó. Mo bẹ̀ ọ́, gba àwáwí mi.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo wọn bẹ̀rẹ̀ sí í ṣe àwáwí ní ọ̀nà kan náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkọ ìpè nípa fífi àwáwí hàn; ἀπὸ μιᾶς jẹ́ idiomu tó túmọ̀ sí pé gbogbo wọn ṣe bẹ́ẹ̀ papọ̀ tàbí ní ọ̀nà kan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó tako ìpè àsè inú ẹsẹ tó ṣáájú hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: gbogbo wọn bẹ̀rẹ̀ sí í kọ̀ láti wá, ọ̀kọ̀ọ̀kan sì ń sọ àwáwí tirẹ̀
  rationale: παραιτεῖσθαι lè túmọ̀ sí kíkọ ìpè nípasẹ̀ fífi àwáwí hàn. Gbólóhùn yìí mú kí ìtumọ̀ náà ṣe kedere, ó sì pa agbára reflexive àti gbogbo wọn mọ́.
- source_word: ἀπὸ μιᾶς
  choice: ọ̀kọ̀ọ̀kan sì ń sọ àwáwí tirẹ̀
  rationale: Àpólà náà jẹ́ ọ̀rọ̀ àṣà tó fi hàn pé gbogbo wọn jọ ṣe ohun kan tàbí ní ọ̀nà kan náà; nínú àyíká yìí, gbogbo wọn kọ ìpè náà pẹ̀lú àwáwí. Àlàyé Yorùbá yìí yẹra fún túmọ̀ ọ́ ní líle gẹ́gẹ́ bí ‘láti ọ̀kan.’
- source_word: Ἀγρόν
  choice: ilẹ̀ kan
  rationale: ἀγρός lè jẹ́ pápá tàbí ilẹ̀ kan. ‘Ilẹ̀ kan’ kò fi kún un pé ó jẹ́ oko tí a ń dá, ó sì bá ohun tí a rà mu dáadáa.
- source_word: ἠγόρασα
  choice: Mo ra
  rationale: Fọ́ọ̀mù ìṣe àná Yorùbá jẹ́ ọ̀nà àdánidá láti sọ ìrà tó ti ṣẹlẹ̀ tí ó sì ní ipa lásìkò yìí.
- source_word: ἔχω ἀνάγκην
  choice: ó sì pọn dandan fún mi
  rationale: Ó pa agbára ọ̀rọ̀ ìdandan mọ́ ju ‘mo fẹ́’ lọ, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: láti lọ wò ó
  rationale: Ó sọ ìṣe méjèèjì—lílọ àti wíwò—ní ṣókí láì fi ìtumọ̀ ‘ṣàyẹ̀wò’ tí ó lágbára sí i kún un.
- source_word: ἐρωτῶ σε
  choice: Mo bẹ̀ ọ́
  rationale: Nínú ọ̀rọ̀ ìbéèrè ọlọ́wọ̀ yìí, ‘Mo bẹ̀ ọ́’ jẹ́ Yorùbá àdánidá tó pa ìbéèrè pàtó mọ́.
- source_word: ἔχε με παρῃτημένον
  choice: ka mí sí ẹni tí o ti gba àwáwí rẹ̀
  rationale: 'Ó mú ipò àbájáde inú perfect participle hàn: kí olùpè ka ẹni náà sí ẹni tí àwáwí rẹ̀ ti jẹ́ ìtẹ́wọ́gbà.'
- source_word: ὁ πρῶτος
  choice: Ẹni àkọ́kọ́
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ordinal substantive.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé lasan. A ṣàlàyé ìtumọ̀ àṣà ἀπὸ μιᾶς nínú àkọsílẹ̀ dípò títúmọ̀ ọ́ ní líle.
