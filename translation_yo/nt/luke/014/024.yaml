source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé, kò sí ọ̀kan nínú àwọn ọkùnrin wọ̀nyẹn tí a ti pè tí yóò tọ́ oúnjẹ alẹ́ mi wò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àsè mi” tàbí “oúnjẹ ìrọ̀lẹ́ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: “Nítorí” ṣe àfihàn iṣẹ́ ìṣàlàyé γάρ, “mo sọ fún yín” sì pa ọ̀nà ìbánisọ̀rọ̀ tààrà λέγω ... ὑμῖν mọ́ ní Yorùbá àdánidá.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: kò sí ọ̀kan nínú àwọn ọkùnrin wọ̀nyẹn
  rationale: Gbólóhùn yìí pa ìtẹnumọ́ οὐδείς àti ìtumọ̀ akọ pàtó ἀνδρῶν mọ́; “wọ̀nyẹn” tọ́ka sí àwọn tí a mẹ́nu kàn ṣáájú.
- source_word: τῶν κεκλημένων
  choice: tí a pè
  rationale: Ní àyíká àsè, καλέω túmọ̀ sí pípe ènìyàn wá síbi oúnjẹ. “Tí a pè” jẹ́ ṣókí, ó sì bá èdè Yorùbá mu láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: γεύσεταί
  choice: yóò tọ́ ... wò
  rationale: Ọ̀rọ̀ Yorùbá “tọ́ ... wò” pa àwòrán gangan ti γεύομαι, ‘tọ́wò,’ mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún ní agbára ìtumọ̀ jíjẹ tàbí kíkópa nínú oúnjẹ.
- source_word: μου τοῦ δείπνου
  choice: oúnjẹ alẹ́ mi
  rationale: δεῖπνον jẹ́ oúnjẹ pàtàkì, sábà ní alẹ́, ó sì lè jẹ́ àsè. “Oúnjẹ alẹ́ mi” jẹ́ èdè Yorùbá tí ó ṣe kedere, ó sì pa arọ́pò-orúkọ ẹni àkọ́kọ́ μου mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú ọ̀rọ̀ ẹni tó ṣe àsè láìsọ àpèjúwe náà di ìtumọ̀ ẹ̀kọ́ ìsìn ní tààrà
  choice: Pa “oúnjẹ alẹ́ mi” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ẹni tó ṣe àsè nínú àkàwé.
  alternative: àsè mi
  rationale: Gíríìkì ní arọ́pò-orúkọ ẹni àkọ́kọ́ “mi,” ṣùgbọ́n kò ṣàlàyé ẹni tí àsè náà dúró fún nípa ẹ̀kọ́ ìsìn. Ìtumọ̀ náà fi ìforígbárí àti agbára ìkọ̀sílẹ̀ inú àkàwé sílẹ̀ láìyanjú rẹ̀.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán láti lóye.
