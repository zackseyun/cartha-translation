revisions:
- from: Nítorí mo sọ fún yín pé, kò sí ọ̀kan nínú àwọn ọkùnrin wọ̀nyẹn tí a pè tí yóò tọ́ oúnjẹ alẹ́ mi wò[a].
  to: Nítorí mo sọ fún yín pé, kò sí ọ̀kan nínú àwọn ọkùnrin wọ̀nyẹn tí a ti pè tí yóò tọ́ oúnjẹ alẹ́ mi wò[a].
  rationale: The revision makes the prior-invitation sense of the Greek perfect passive explicit and corrects the lexical footnote while retaining the draft’s natural rendering of the host’s meal and its non-allegorizing narrative voice.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'The Greek is represented accurately in its principal elements: γάρ is explanatory, οὐδείς is absolute, ἀνδρῶν remains explicitly male, κεκλημένων denotes invitees, and γεύσεται retains the image of tasting. “Tí a ti pè” better reflects the perfect passive participle than the unmarked “tí a pè.” The proposed footnote, however, inaccurately labels “oúnjẹ ìrọ̀lẹ́ mi” as a literal meaning; δεῖπνον is a main meal and may be an evening meal or banquet, but does not literally mean ‘evening meal.’'
  naturalness: “Nítorí mo sọ fún yín pé” and “yóò tọ́ oúnjẹ … wò” are natural, dignified Standard Yoruba. Adding “ti” in “tí a ti pè” naturally conveys that the invitations had already been issued.
  terminology: “Oúnjẹ alẹ́ mi” is a defensible contextual rendering of δεῖπνον, though the note should present “àsè mi” and “oúnjẹ ìrọ̀lẹ́ mi” simply as alternatives, without calling the latter literal. The male-specific “àwọn ọkùnrin” appropriately preserves ἀνδρῶν.
  issues:
  - severity: low
    issue: The perfect aspect of τῶν κεκλημένων is not expressed in “tí a pè.”
    rationale: The Greek perfect passive identifies people who have already been invited. “Tí a ti pè” preserves this aspect idiomatically.
  - severity: medium
    issue: The footnote calls “oúnjẹ ìrọ̀lẹ́ mi” a literal rendering.
    rationale: δεῖπνον does not literally specify evening; it denotes a principal meal and can denote a banquet. The note should not overstate a contextual association as lexical literalness.
  revised_text: Nítorí mo sọ fún yín pé, kò sí ọ̀kan nínú àwọn ọkùnrin wọ̀nyẹn tí a ti pè tí yóò tọ́ oúnjẹ alẹ́ mi wò[a].
  revised_footnotes:
  - marker: a
    text: Tàbí “àsè mi” tàbí “oúnjẹ ìrọ̀lẹ́ mi.”
    reason: lexical_alternative
  revision_rationale: The revision makes the prior-invitation sense of the Greek perfect passive explicit and corrects the lexical footnote while retaining the draft’s natural rendering of the host’s meal and its non-allegorizing narrative voice.
