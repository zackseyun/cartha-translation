id: LUK.14.1
reference: Luke 14:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí ó wọ ilé ọ̀kan nínú àwọn olórí àwọn Farisí lọ ní ọjọ́ Ìsinmi láti jẹun,[a] àwọn náà ń kíyèsí i pẹkipẹki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti jẹ búrẹ́dì”; bí ọ̀rọ̀ Gíríìkì ṣe rí ní tààrà nìyẹn, ṣùgbọ́n ó lè túmọ̀ sí jíjẹ oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń ṣọ́ ọ pẹkipẹki”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwo pẹ̀lú ìfura tàbí ète ọ̀tá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó pa iṣẹ́ ọ̀rọ̀ ìbẹ̀rẹ̀ ìtàn tí Lúùkù sábà máa ń lò mọ́, ní Yorùbá àdánidá.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: nígbà tí ó wọ ... lọ
  rationale: Ìtumọ̀ àkókò ni àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní; gbolohun yìí sì jẹ́ àdánidá ní Yorùbá.
- source_word: οἶκόν
  choice: ilé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù fún ilé ẹni ní ibi àsè yìí.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: ọ̀kan lára àwọn olórí àwọn Farisí
  rationale: Ó pa èrò pé ẹni náà jẹ́ ọ̀kan nínú àwọn aṣáájú ẹgbẹ́ Farisí mọ́, láì sọ ipò rẹ̀ di ohun tó dájú ju ti Gíríìkì lọ.
- source_word: σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Dátífù náà ń tọ́ka sí àkókò; ‘ọjọ́ Ìsinmi’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún Sábáàtì.
- source_word: φαγεῖν ἄρτον
  choice: láti jẹ oúnjẹ
  rationale: Ní Gíríìkì, ó túmọ̀ ní tààrà sí ‘jẹ búrẹ́dì,’ ṣùgbọ́n àṣà ọ̀rọ̀ náà túmọ̀ sí jíjẹ oúnjẹ; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ tààrà mọ́.
- source_word: παρατηρούμενοι
  choice: ń ṣọ́ ọ̀rọ̀ rẹ̀ pẹkipẹki
  rationale: Ó fi àkíyèsí tó jinlẹ̀ àti ìfojúsọ́nà hàn, ó sì pa àníyàn inú ìtàn mọ́ láì fi ète búburú kún un ní pàtó.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Àrọ́pò-orúkọ Yorùbá yìí dára ní àyíká náà; ìtẹnumọ́ Gíríìkì kò nílò àfikún tí yóò mú gbolohun le.
theological_decisions:
- issue: Bóyá wíwo tí àwọn Farisí ń wo Jésù ní ète ọ̀tá
  choice: wọ́n ń ṣọ́ ọ̀rọ̀ rẹ̀ pẹkipẹki
  alternative: wọ́n ń ṣe amí rẹ̀
  rationale: παρατηρούμενοι lè ní ìtumọ̀ ìṣọ́ra pẹ̀lú ìfura tàbí ète ọ̀tá, ṣùgbọ́n ẹsẹ̀ náà kò sọ ète búburú ní gbangba. Ìtumọ̀ tí a yàn pa ìforígbárí inú ìtàn mọ́ láì sọ ohun tó ju ẹ̀rí ọ̀rọ̀ lọ.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ni a lò, pẹ̀lú èdè òde òní tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. ‘Farisí’ àti ‘ọjọ́ Ìsinmi’ tẹ̀ lé ìlò Bíbélì Yorùbá tó wọ́pọ̀.
