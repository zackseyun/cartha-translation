review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtẹ̀lé ìtàn, rírà àjàgà màlúù márùn-ún, ìlọ láti dán wọn wò, àti ìbéèrè ọlọ́wọ̀ọ́ mu dáadáa. Síbẹ̀, “láti má wá” nínú ìtumọ̀ àkọ́kọ́ fi ìṣe kan kún un tí Gíríìkì kò sọ ní tààrà. Àwíyé ìsàlẹ̀ a náà sì lo “oríṣi,” ẹni tí ó túmọ̀ sí irú/kíláàsì, kì í ṣe méjì-méjì màlúù.
  naturalness: “Gba àwáwí mi” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbéèrè ἔχε με παρῃτημένον hàn. “Àjàgà màlúù márùn-ún” pa àwòrán iṣẹ́ àgbẹ̀ mọ́, nígbà tí àwíyé ìsàlẹ̀ ṣe àlàyé pé àjàgà kọ̀ọ̀kan ní màlúù méjì.
  terminology: A pa “àjàgà” mọ́ fún ζεύγη, “màlúù” fún βοῶν, àti “dán ... wò” fún δοκιμάσαι. A rọ́pò ìtumọ̀ ìdáláre tí ó lè dún bí ìdájọ́ ẹ̀sùn pẹ̀lú “gba àwáwí mi,” èyí tí ó bá àyíká ọ̀rọ̀ mu.
  issues:
