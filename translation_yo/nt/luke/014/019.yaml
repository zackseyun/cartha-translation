translation_notes:
  register: Èdè Yorùbá àมาตรฐาน tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘màlúù’ fún βοῦς ní ọ̀nà àpapọ̀, àti ‘àjàgà màlúù’ láti pa àwòrán àwọn ẹranko méjì tí a so pọ̀ fún iṣẹ́ mọ́.
