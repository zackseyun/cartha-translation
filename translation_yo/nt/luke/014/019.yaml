base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: yo
  text: Ẹlòmíràn sì wí pé, ‘Mo ra àjàgà màlúù márùn-ún[a], mo sì ń lọ láti dán wọn wò. Mo bẹ̀ ọ́, gba àwáwí mi[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn méjì-méjì màlúù márùn-ún” tàbí “ẹgbẹ́ màlúù iṣẹ́ márùn-ún.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ka mi sí ẹni tí a ti yọ̀ǹda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: Ẹlòmíràn
  rationale: Nínú ìtẹ̀lé àwọn tí a pè tí wọ́n ń ṣe àwáwí, ọ̀rọ̀ yìí túmọ̀ sí ẹlòmíràn nínú wọn.
- source_word: Ζεύγη βοῶν
  choice: àjàgà màlúù márùn-ún
  rationale: ζεῦγος tọ́ka sí méjì tí a so pọ̀ fún iṣẹ́; ‘àjàgà màlúù’ pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἠγόρασα
  choice: Mo ra
  rationale: Àkókò aorist sọ ìṣe tí ó ṣẹlẹ̀; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì bá ọ̀ràn ohun tí ẹni náà ṣẹ̀ṣẹ̀ rà mu.
- source_word: πορεύομαι
  choice: mo sì ń lọ
  rationale: Ó fi ìlọ tàbí ète tí ó ń ṣẹlẹ̀ nísinsìnyí hàn.
- source_word: δοκιμάσαι
  choice: láti dán wọn wò
  rationale: Ó túmọ̀ sí fífi àwọn màlúù náà ṣe àdánwò láti mọ bí wọ́n ṣe lè ṣiṣẹ́; ‘dán ... wò’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐρωτῶ σε
  choice: Mo bẹ̀ ọ́
  rationale: Níbí, ἐρωτάω jẹ́ ìbéèrè pẹ̀lú ẹ̀bẹ̀ oníwà pẹ̀lẹ́; ‘Mo bẹ̀ ọ́’ mú agbára ọ̀rọ̀ náà jáde dáadáa.
- source_word: ἔχε με παρῃτημένον
  choice: ka mi sí ẹni tí a ti dá láre láti má wá
  rationale: Ìṣọ̀kan ἔχω àti perfect passive participle ń béèrè pé kí a ka ẹni náà sí ẹni tí a ti gba àwáwí rẹ̀; àfikún ‘láti má wá’ mú ohun tí ìdá-láre náà kan ṣe kedere ní Yorùbá.
