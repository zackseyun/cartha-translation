  naturalness: ‘Àwọn tí wọ́n jókòó jẹun pọ̀ pẹ̀lú rẹ̀’ jẹ́ ọ̀nà Yorùbá òde òní tó rọrùn ju ‘àwọn tí wọ́n jọ jókòó síbi oúnjẹ pẹ̀lú rẹ̀’ lọ. ‘Alábùkún ni ẹni tí’ jẹ́ gbolohun tó ṣeé gbọ́, ó sì pa ipò ìbùkún nínú ọrọ̀ Μακάριος mọ́.
