id: LUK.14.15
reference: Luke 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọ̀kan lára àwọn tí wọ́n jókòó jẹun pọ̀ pẹ̀lú rẹ̀[a] gbọ́ nǹkan wọ̀nyí, ó sọ fún un pé, “Alábùkún ni ẹni tí yóò jẹ búrẹ́dì[b] ní ìjọba Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àsìkò yẹn, àwọn ènìyàn sábà máa ń rọ̀gbọ̀ tàbí tẹ̀ sí ẹ̀gbẹ́ níbi tábìlì nígbà tí wọ́n bá ń jẹun; èdè Gíríìkì tọ́ka sí àwọn tí wọ́n wà ní irú ìdúró yẹn pẹ̀lú rẹ̀.
    reason: cultural_note
  - marker: b
    text: Ní gangan, “jẹ búrẹ́dì.” Èyí jẹ́ ọ̀nà Gíríìkì àdánidá tó lè tọ́ka sí jíjẹ oúnjẹ tàbí kópa nínú àsè; ọ̀rọ̀ pàtàkì náà pa àwòrán “búrẹ́dì” mọ́.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà ní agbára àkókò; gbólóhùn ‘nígbà tí ... gbọ́’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìdáhùn tuntun hàn lẹ́yìn ọ̀rọ̀ Jésù; ‘Ṣùgbọ́n’ bá ìṣísẹ̀ ìtàn náà mu.
- source_word: τις τῶν συνανακειμένων
  choice: ọ̀kan lára àwọn tí wọ́n jọ jókòó síbi oúnjẹ pẹ̀lú rẹ̀
  rationale: Ó tọ́ka sí àlejò kan tí a kò dárúkọ lára àwọn tí wọ́n ń jẹun pọ̀; ‘jọ jókòó síbi oúnjẹ’ jẹ́ èdè Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ sọ nípa ìwà ìgbọ̀nsẹ̀ ìgbàanì.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí tọ́ka padà sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: εἶπεν αὐτῷ
  choice: ó sọ fún un pé
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ọ̀nà ìbánisọ̀rọ̀ inú ìtàn, ó sì pa ẹni tí a bá sọ̀rọ̀ sí mọ́.
- source_word: Μακάριος
  choice: Alábùkún
  rationale: Nínú ọ̀rọ̀ irú ìbùkún, ‘Alábùkún’ pa ìtumọ̀ ojú rere Ọlọ́run àti ìrètí ọjọ́ iwájú mọ́ ju ọ̀rọ̀ tó túmọ̀ sí ayọ̀ ọkàn lásán lọ.
- source_word: ὅστις
  choice: ẹni tí
  rationale: Ó ní agbára gbogbogbò, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ ‘ẹnikẹ́ni tí’ láìfi àfikún tí kò pọndandan sí i.
- source_word: φάγεται
  choice: yóò jẹ
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; ‘yóò jẹ’ pa ìtọ́ka sí àsè ọjọ́ iwájú nínú ìjọba Ọlọ́run mọ́.
- source_word: ἄρτον
  choice: oúnjẹ
  rationale: Ìtumọ̀ gangan ni ‘àkàrà/búrẹ́dì,’ ṣùgbọ́n nínú ọ̀rọ̀ Gíríìkì ‘jẹ àkàrà’ lè túmọ̀ sí jíjẹ oúnjẹ tàbí kópa nínú àsè. ‘Jẹ oúnjẹ’ jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa àwòrán gangan náà mọ́.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ní ìjọba Ọlọ́run
  rationale: Ìtumọ̀ tààrà ni, láìfi ‘àsè’ kún ọ̀rọ̀ pàtàkì bí ó tilẹ̀ jẹ́ pé àyíká ń tọ́ka sí jíjẹun.
theological_decisions:
- issue: Agbára ìbùkún ti Μακάριος nínú ọ̀rọ̀ àsè ìjọba ọjọ́ iwájú
  choice: Alábùkún ni ẹni tí yóò jẹ oúnjẹ ní ìjọba Ọlọ́run
  alternative: Ayọ̀ ni fún ẹni tí yóò jẹ oúnjẹ ní ìjọba Ọlọ́run
  rationale: ‘Alábùkún’ fi ipò ojú rere Ọlọ́run àti ìrètí ìjọba ọjọ́ iwájú hàn, láìsọ ọ́ di ìmọ̀lára ayọ̀ nìkan.
- issue: Bóyá kí a pa àwòrán gangan ‘jẹ àkàrà’ mọ́ nínú ọ̀rọ̀ pàtàkì
  choice: jẹ oúnjẹ
  alternative: jẹ àkàrà
  rationale: ἄρτον jẹ́ ‘àkàrà/búrẹ́dì’ ní gangan, ṣùgbọ́n gbolohun náà jẹ́ ọ̀nà Gíríìkì fún jíjẹun pọ̀. Yorùbá ‘jẹ oúnjẹ’ mú ìtumọ̀ àyíká jáde lọ́nà àdánidá, nígbà tí àlàyé [b] pa àwòrán gangan àti àìdánilójú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘jọ jókòó síbi oúnjẹ’ dípò ṣíṣe àṣà rírògbọ̀ ìgbàanì di àjèjì nínú ọ̀rọ̀ pàtàkì; àlàyé [a] ṣàlàyé rẹ̀. A lo ‘Alábùkún’ fún ìwọ̀n ẹ̀sìn àti ọjọ́ iwájú ti Μακάριος.
