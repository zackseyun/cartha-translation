base_translation:
  language: en
  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: yo
  text: wọ́n ń wí pé, “Ọkùnrin yìí bẹ̀rẹ̀ sí í kọ́, kò sì lè[a] parí iṣẹ́ náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kò sì ní agbára tó láti parí iṣẹ́ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń ṣàlàyé ohun tí àwọn ẹni tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú ń ṣe. “Wọ́n ń wí pé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ọ̀rọ̀ wọn mọ́ àyíká náà, “pé” sì ń ṣáájú ọ̀rọ̀ tí wọ́n sọ ní tààrà.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Ọkùnrin yìí
  rationale: Ó pa ìtọ́kasí demonstrative náà àti akọ ẹyọ kan tó wà nínú Gíríìkì mọ́, láìfi ẹ̀gàn míì tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: bẹ̀rẹ̀ sí í kọ́lé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún “bẹ̀rẹ̀ sí kọ́,” “kọ́lé” sì bá àpẹẹrẹ ilé gogoro inú àyíká mu.
- source_word: οὐκ ἴσχυσεν
  choice: kò sì lè
  rationale: Nínú àyíká yìí, ἰσχύω ń tọ́ka sí agbára tàbí ipá láti ṣe ohun kan. “Kò lè” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì fi ìkùnà agbára ṣe hàn láìdín ìtumọ̀ náà kù sí okun ara nìkan.
- source_word: ἐκτελέσαι
  choice: parí rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú iṣẹ́ dé òpin. Arọ́pò-orúkọ “rẹ̀” ń tọ́ka sí ilé tàbí iṣẹ́ ìkọ́lé tí àyíká ti sọ di mímọ̀, ó sì mú gbolohun náà ṣe déédéé ní Yorùbá.
