translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣe kedere ni a lò. A pa ìró ẹ̀gàn gbangba tó wà nínú àyíká mọ́ láìfi ọ̀rọ̀ ẹ̀gàn tuntun kún un.
