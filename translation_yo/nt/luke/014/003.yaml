id: LUK.14.3
reference: Luke 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: yo
  text: Jésù sì dáhùn, ó sì wí fún àwọn amòfin[a] àti àwọn Farisí pé, “Ṣé ó bófin mu láti ṣe ìwòsàn ní ọjọ́ Ìsinmi, tàbí bẹ́ẹ̀ kọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn amòye nínú Òfin.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ó ní ìmọ̀ àkànṣe nípa Òfin àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: dáhùn, ó wí
  rationale: Ó pa ìsọ̀rọ̀ méjèèjì nínú ọ̀rọ̀ Gíríìkì mọ́—‘dáhùn’ àti ‘wí’—ní ọ̀nà tí ó ṣeé lóye nínú ìtàn Yorùbá.
- source_word: νομικοὺς
  choice: àwọn amòfin
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn amòye nínú Òfin Mósè, kì í ṣe àwọn agbẹjọ́rò òde òní; àlàyé ẹsẹ̀ ìsàlẹ̀ mú ìtumọ̀ pàtó yìí hàn.
- source_word: Φαρισαίους
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí a sábà máa ń lò ní Yorùbá.
- source_word: Ἔξεστιν
  choice: Ṣé ó bófin mu
  rationale: Ó mú agbára ìbéèrè nípa ohun tí Òfin fàyè gbà jáde, láì sọ ìpinnu Jésù síwájú.
- source_word: τῷ σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Ó túmọ̀ dátífù àkókò náà ní ọ̀nà Yorùbá tí ó ṣe kedere, ó sì tọ́ka sí ọjọ́ Sábáàtì.
- source_word: θεραπεῦσαι
  choice: láti mú ènìyàn láradá
  rationale: Ó sọ ìṣe ìwòsàn ènìyàn ní kedere, gẹ́gẹ́ bí àyíká ìṣẹ̀lẹ̀ náà ṣe fi hàn.
- source_word: ἢ οὔ
  choice: tàbí kò bófin mu
  rationale: Yíyí ‘or not’ padà sí gbólóhùn kíkún jẹ́ adayébá ní Yorùbá, ó sì pa ìbéèrè àṣàyàn méjì náà mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìbéèrè nípa Òfin ọjọ́ Ìsinmi láì fi ìpinnu Jésù kún un
  choice: Ṣé ó bófin mu láti mú ènìyàn láradá ní ọjọ́ Ìsinmi, tàbí kò bófin mu?
  alternative: Ṣé a fàyè gba láti mú ènìyàn láradá ní ọjọ́ Ìsinmi, tàbí a kò fàyè gbà á?
  rationale: ‘Ó bófin mu’ pa ìtumọ̀ òfin àti ẹ̀sìn ti ἔξεστιν mọ́, nígbà tí ó kò fi àlàyé kún un nípa àánú, àìní, tàbí àṣẹ Jésù.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọjọ́ Ìsinmi’ fún Sábáàtì, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
