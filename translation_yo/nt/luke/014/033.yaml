  source_fidelity: Ìtumọ̀ náà mú ìpínrọ̀ ẹnì kọ̀ọ̀kan nínú πᾶς ἐξ ὑμῶν, ìfẹ̀hónúhàn ἀποτάσσεται sí ohun ìní, àti àìṣeéṣe inú οὐ δύναται ... εἶναι ... μαθητής wá ní òtítọ́. Ṣùgbọ́n, ‘Nítorí náà, bẹ́ẹ̀ náà ni’ jẹ́ ìsopọ̀ ọ̀rọ̀ tó tún ara rẹ̀ ṣe díẹ̀, ‘tí kò bá kọ’ sì fún un ní ìrísí ìpò-ìdí (‘if’) tí kò hàn nínú ọ̀rọ̀ ìbátan Gíríìkì náà.
  naturalness: ‘Bẹ́ẹ̀ náà ni’ jẹ́ ìtumọ̀ àdánidá fún οὕτως nínú ìparí ìlò náà; fífi ‘nítorí náà’ kún un lẹ́ẹ̀kan ṣoṣo ń jẹ́ kí gbolohun náà rọrùn. ‘Tí kò kọ ... sílẹ̀’ bá ìṣètò Yorùbá mu dáadáa lẹ́yìn ‘olúkúlùkù yín.’
  terminology: ‘Ọmọ-ẹ̀yìn,’ ‘ohun ìní,’ àti ‘kọ ... sílẹ̀’ dára fún ọ̀rọ̀ ẹ̀sìn àti ọ̀rọ̀ ohun ìní nínú àyíká yìí. Àlàyé ẹsẹ̀ abẹ́lẹ̀ yẹ kí ó pe ἀποτάσσεται ní ‘ọ̀rọ̀-ìṣe’ kí ó sì má ṣe ṣàfikún pé ènìyàn ‘rò pé’ ó ní ẹ̀tọ́ náà.
  issues:
  - severity: medium
    issue: Ìsopọ̀ ‘Nítorí náà, bẹ́ẹ̀ náà ni’ tún agbára ìparí ọ̀rọ̀ ṣe, ó sì kì í rọrùn nínú gbolohun Yorùbá yìí.
    rationale: οὕτως οὖν le jẹ́ ‘Bẹ́ẹ̀ náà ni, nítorí náà’; ṣùgbọ́n ní Yorùbá, ‘Bẹ́ẹ̀ náà ni’ nìkan lè gbé ìsopọ̀ ìparí náà ní ti ara nínú àyíká yìí. ‘Nítorí náà, bẹ́ẹ̀ náà ni’ dà bí ìtúmọ̀ ọ̀rọ̀-fún-ọ̀rọ̀ tó wúwo.
