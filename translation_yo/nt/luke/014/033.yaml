id: LUK.14.33
reference: Luke 14:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni, olúkúlùkù yín tí kò kọ gbogbo ohun ìní tirẹ̀ sílẹ̀[a] kò lè jẹ́ ọmọ-ẹ̀yìn mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘tí kò fi gbogbo ohun tó ní sílẹ̀.’ Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ‘dágbére fún’; níbí, ó ń tọ́ka sí kí ènìyàn kọ ẹ̀tọ́ rẹ̀ lórí ohun ìní rẹ̀ sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Nítorí náà, bẹ́ẹ̀ náà ni
  rationale: Ó pa agbára ìparí ọ̀rọ̀ οὖν mọ́, ó sì fi οὕτως so ìlò ẹ̀kọ́ náà mọ́ àwọn àpẹẹrẹ tó ṣáájú.
- source_word: πᾶς ἐξ ὑμῶν
  choice: olúkúlùkù yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ pínpín náà hàn pé ohun tí a béèrè yìí kan ẹnì kọ̀ọ̀kan.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: tí kò bá kọ ... sílẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀποτάσσομαι túmọ̀ sí kí ènìyàn yọ ọwọ́ tàbí ẹ̀tọ́ rẹ̀ kúrò lórí ohun kan; ọ̀rọ̀ yìí kò fi dandan sọ pé ó gbọdọ̀ ta gbogbo ohun náà.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: gbogbo ohun ìní tirẹ̀
  rationale: ‘Ohun ìní’ sọ ohun-ìní tàbí dúkìá ẹni ní kedere, ‘tirẹ̀’ sì pa ìtẹnumọ́ ἑαυτοῦ mọ́ láìjẹ́ kí akọ akọ-abo Gíríìkì dà bí ẹni pé ó yọ obìnrin sílẹ̀.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kò lè jẹ́ ọmọ-ẹ̀yìn mi
  rationale: Ó pa agbára àìṣeéṣe οὐ δύναται mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: μαθητής
  choice: ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀ fún ẹni tó ń kọ́ lábẹ́ olùkọ́, tó sì ń tẹ̀ lé e.
theological_decisions:
- issue: Irú ohun tí a ń béèrè nípa ohun ìní
  choice: Lo ‘kọ gbogbo ohun ìní tirẹ̀ sílẹ̀,’ èyí tó lè túmọ̀ sí yíyọ ẹ̀tọ́ àti ìfẹ́kúfẹ̀ẹ́ ẹni kúrò lórí wọn.
  alternative: ‘Fi gbogbo ohun tó ní sílẹ̀,’ èyí tí a lè gbọ́ gẹ́gẹ́ bí fífi gbogbo dúkìá sílẹ̀ ní ti ara.
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘kí a dágbére fún’ tàbí ‘kí a kọ̀ sílẹ̀.’ Ìtumọ̀ yìí pa líle ohun tí jíjẹ́ ọmọ-ẹ̀yìn ń béèrè mọ́, ṣùgbọ́n kò fi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé àìdánilójú ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Olúkúlùkù’ yàgò fún ìṣòro akọ tàbí abo nítorí Gíríìkì lo akọ ẹyọ ní ìtumọ̀ gbogbogbò.
