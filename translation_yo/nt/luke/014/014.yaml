id: LUK.14.14
reference: Luke 14:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: yo
  text: Ìwọ yóò sì ní ìbùkún[a], nítorí wọn kò lè san án padà fún ọ; nítorí a ó san án padà fún ọ nígbà àjíǹde àwọn olódodo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwọ yóò sì láyọ̀.” “Ní ìbùkún” ń tọ́ka sí ojú rere Ọlọ́run àti èrè ọjọ́ iwájú, kì í ṣe ìmọ̀lára ayọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “nínú àjíǹde àwọn olódodo.” Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àkókò; nítorí náà, “nígbà àjíǹde” jẹ́ ìtumọ̀ Yorùbá tó dáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: alábùkún
  rationale: “Alábùkún” ṣàfihàn ipò ẹni tí Ọlọ́run ṣe ní rere, ó sì pa ìwọ̀n ẹ̀kọ́ nípa èrè ọjọ́ iwájú mọ́ ju “aláyọ̀” lọ.
- source_word: ἔσῃ
  choice: ìwọ yóò … jẹ́
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí tọ́ka sí ipò tí ẹni náà yóò wà, ìtẹnumọ́ “ìwọ” sì bá ẹni kejì ẹyọ kan nínú Gíríìkì mu.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: wọn kò lè san án padà fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ àìlágbára tàbí àìní ohun tí a fi lè san padà; kò túmọ̀ sí pé wọn kò ní ojúṣe láti san.
- source_word: ἀνταποδοθήσεται
  choice: a ó san án padà fún ọ
  rationale: Ìlò aláìlórúkọ “a ó” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ohùn àfarajìn Gíríìkì mọ́ láìfi ẹni tó máa san án padà kún ọ̀rọ̀ náà ní tààràtà.
- source_word: ἐν τῇ ἀναστάσει
  choice: nígbà àjíǹde
  rationale: “Nígbà” sọ ìtumọ̀ àkókò ti ἐν ní kedere àti ní Yorùbá àdánidá, láìyí ìṣẹ̀lẹ̀ àjíǹde náà padà.
- source_word: τῶν δικαίων
  choice: àwọn olódodo
  rationale: “Àwọn olódodo” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì pa ìtumọ̀ ìwà àti ti ẹ̀kọ́ ìgbàgbọ́ nínú δικαίων mọ́.
theological_decisions:
- issue: Ta ni yóò san án padà?
  choice: A lo gbólóhùn aláìlórúkọ “a ó san án padà fún ọ.”
  alternative: “Ọlọ́run yóò san án padà fún ọ.”
  rationale: Ohùn àfarajìn Gíríìkì kò dárúkọ Ọlọ́run ní tààràtà. Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí èrè láti ọ̀dọ̀ Ọlọ́run, ìtumọ̀ kò gbọ́dọ̀ fi orúkọ ẹni tó ṣe iṣẹ́ náà kún ohun tí ẹsẹ náà kò sọ ní gbangba.
- issue: Ìtumọ̀ “àjíǹde àwọn olódodo”
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àjíǹde ọjọ́ iwájú tó ní í ṣe pẹ̀lú àwọn olódodo.
  alternative: Àjíǹde gbogbo ènìyàn tí a tẹnumọ́ àwọn olódodo nínú rẹ̀, tàbí àjíǹde àwọn olódodo tó yàtọ̀ sí ti àwọn ẹlòmíràn.
  rationale: Gbólóhùn náà kò pinnu bóyá àjíǹde yìí yàtọ̀ sí àjíǹde àwọn ẹlòmíràn tàbí ó jẹ́ apá kan àjíǹde gbogbogbò. Ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “san án padà” lẹ́ẹ̀mejì láti pa ìbámu ọ̀rọ̀ Gíríìkì ἀνταποδοῦναι/ἀνταποδοθήσεται mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
