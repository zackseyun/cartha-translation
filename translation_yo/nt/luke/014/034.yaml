    issue: Ọ̀rọ̀ náà ní “mú un ní adùn padà.”
    rationale: “Padà” lè mú kí a ka ἀρτυθήσεται sí ‘mú padà bọ̀ sípò,’ ṣùgbọ́n ìpilẹ̀ ọ̀rọ̀ béèrè nípa ohun tí a ó fi season/fun iyọ̀ náà ní adùn.
  - severity: high
    issue: Àkọsílẹ̀-ẹsẹ̀ náà sọ “kí ni a ó fi ṣe é lásìkò?”
    rationale: “Lásìkò” kò ní ìbáṣepọ̀ pẹ̀lú μωρανθῇ tàbí ἀρτυθήσεται, ó sì fúnni ní ìtumọ̀ tí kò tọ́. Ó yẹ kí àkọsílẹ̀ náà ṣàlàyé ìtumọ̀ gangan ‘di òmùgọ̀’ àti ìtumọ̀ rẹ̀ nínú àyíká iyọ̀.
