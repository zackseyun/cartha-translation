review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì gbolohun Gíríìkì náà dáadáa: iyọ̀ dára, ó sì lè di aláìní adùn. Ṣùgbọ́n “mú un ní adùn padà” fi èrò ‘padà/restoration’ kún ἀρτυθήσεται, níbi tí ọ̀rọ̀ náà kàn béèrè ohun tí a ó fi fi adùn sí i. Àkọsílẹ̀-ẹsẹ̀ tó wà tẹlẹ̀ sì ní ìtumọ̀ tí kò bá ọ̀rọ̀ Gíríìkì mu.'
