  to: Nítorí náà, iyọ̀ dára; ṣùgbọ́n bí iyọ̀ pàápàá bá di aláìní adùn,[a] kí ni a ó fi fi adùn sí i?
  rationale: 'Àtúnṣe náà pa ìbéèrè àwòrán Gíríìkì náà mọ́: iyọ̀ tí ó di aláìní adùn yóò fi ohun wo gba adùn? Ó yọ èrò ‘mú padà’ tí kò hàn nínú ọ̀rọ̀ ìpilẹ̀ kúrò, ó sì rọ́pò àkọsílẹ̀-ẹsẹ̀ tí kò tọ́ pátápátá pẹ̀lú àlàyé ìtumọ̀-ọrọ̀ tó bá μωρανθῇ mu.'
  reviewer_model: gpt-5.6-terra
