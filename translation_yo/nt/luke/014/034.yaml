source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: yo
  text: Nítorí náà, iyọ̀ dára; ṣùgbọ́n bí iyọ̀ pàápàá bá di aláìní adùn,[a] kí ni a ó fi fi adùn sí i?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí iyọ̀ bá di òmùgọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ gangan “di òmùgọ̀,” ṣùgbọ́n nínú ọ̀rọ̀ nípa iyọ̀, ó ń tọ́ka sí dídi aláìní adùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: dára
  rationale: Ó ṣe àfihàn ìdájọ́ rere nípa iyọ̀ láì fi kún un pé ẹwà tàbí ìwúlò nìkan ni a ń sọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára ìparí tàbí àbájáde ọ̀rọ̀ tó ṣáájú mọ́ ní Yorùbá àdánidá.
- source_word: ἅλας
  choice: iyọ̀
  rationale: Ìtumọ̀ tààrà fún iyọ̀ ni, a sì pa àkàwé òwe náà mọ́.
- source_word: ἐὰν δὲ καὶ
  choice: ṣùgbọ́n bí ... pàápàá bá
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ hàn, ‘pàápàá’ sì pa ìtẹnumọ́ καί mọ́ pé iyọ̀ fúnra rẹ̀ lè pàdánù ohun tó jẹ́ ìwà pàtàkì rẹ̀.
- source_word: μωρανθῇ
  choice: di aláìní adùn
  rationale: Ní ti iyọ̀, ọ̀rọ̀ náà túmọ̀ sí dídi aláìní adùn; yíyan èyí yẹra fún ìtumọ̀ gangan ‘di òmùgọ̀,’ tí kò bá àyíká ọ̀rọ̀ mu.
- source_word: ἐν τίνι
  choice: kí ni a ó fi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè nípa ohun èlò tàbí ọ̀nà tí a ó fi ṣe ohun kan.
- source_word: ἀρτυθήσεται
  choice: mú un ní adùn padà
  rationale: Ó pa àwòrán fífi adùn sí oúnjẹ mọ́, ó sì jẹ́ kí ìbéèrè nípa iyọ̀ tó ti di aláìní adùn ṣe kedere láì túmọ̀ àkàwé náà sí ẹ̀kọ́ ní tààrà.
theological_decisions:
- issue: Agbára àkàwé ọ̀rọ̀ nípa iyọ̀
  choice: Pa òwe nípa iyọ̀ mọ́ gẹ́gẹ́ bí àkàwé, láì sọ ìlò rẹ̀ sí ọmọ-ẹ̀yìn ní tààrà nínú ẹsẹ náà.
  alternative: Ṣàlàyé e ní tààrà pé àwọn ọmọ-ẹ̀yìn tí wọ́n pàdánù ìwà ìyàtọ̀ wọn ni a ń tọ́ka sí.
  rationale: Ọ̀rọ̀ Gíríìkì fi àwòrán náà sílẹ̀ fún àyíká ọ̀rọ̀ láti túmọ̀; ìtumọ̀ náà kò gbọ́dọ̀ yanjú gbogbo ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ sínú gbolohun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Nítorí náà’ pa àsopọ̀ mọ́; ‘pàápàá’ sì gbe ìtẹnumọ́ gbolohun Gíríìkì jáde.
