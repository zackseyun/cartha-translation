  terminology: “Iyọ̀,” “dára,” àti “aláìní adùn” yẹ fún àwòrán òwe náà. Àkọsílẹ̀ tuntun náà tọ́ka sí ìtumọ̀ gangan ‘di òmùgọ̀’ ti μωρανθῇ, ṣùgbọ́n ó ṣàlàyé ní kedere pé nínú àyíká iyọ̀, ìtumọ̀ náà ni dídi aláìní adùn.
  issues:
