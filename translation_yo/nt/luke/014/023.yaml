id: LUK.14.23
reference: Luke 14:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: yo
  text: Ọ̀gá náà sì sọ fún ẹrú náà pé, “Jáde lọ sí àwọn ojú ọ̀nà àti àwọn odi ọgbà, kí o sì fi dandan mú àwọn ènìyàn wọlé[a], kí ilé mi lè kún.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “rọ̀ wọ́n gidigidi kí wọ́n wọlé.” Ọ̀rọ̀ Gíríìkì náà lágbára, ó sì lè túmọ̀ sí “fi dandan mú” tàbí “tẹ̀ wọ́n.” Síbẹ̀, nínú àkàwé yìí, kò dandan túmọ̀ sí pé a lò agbára ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Ọ̀gá
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ni ilé, kì í ṣe orúkọ oyè Ọlọ́run ní tààràtà. “Ọ̀gá” fi ipò rẹ̀ nínú ìtàn hàn lọ́nà àdánidá.
- source_word: δοῦλον
  choice: ẹrú
  rationale: “Ẹrú” pa ipò ìdè tí δοῦλος túmọ̀ sí mọ́, dípò kí a rọ ọ̀rọ̀ náà sí “ìránṣẹ́” lásán.
- source_word: Ἔξελθε
  choice: Jáde lọ
  rationale: Ó pa ìtumọ̀ ìṣípò jáde tí ἐξέρχομαι ní mọ́, ó sì jẹ́ ọ̀rọ̀ àṣẹ tó ṣe kedere ní Yorùbá.
- source_word: ὁδοὺς
  choice: àwọn ojú ọ̀nà
  rationale: Ó túmọ̀ àwọn ọ̀nà ìrìn-àjò ní ẹ̀yìn tàbí ní òde ìlú lọ́nà tí ó bá Yorùbá mu.
- source_word: φραγμοὺς
  choice: ẹ̀gbẹ́ ọgbà
  rationale: φραγμός lè jẹ́ ọgbà, odi ààlà, tàbí ohun tí a fi dí ibi; “ẹ̀gbẹ́ ọgbà” dá àwòrán àwọn ibi etí ọ̀nà àti ààlà tí a ti lè rí ènìyàn dúró.
- source_word: ἀνάγκασον
  choice: fi dandan mú
  rationale: Yíyan yìí pa agbára ọ̀rọ̀ àṣẹ Gíríìkì náà mọ́, láì dín in kù sí ìpè pẹ̀lẹ́. Àlàyé ìsàlẹ̀ fi hàn pé, nínú àkàwé yìí, kò pọn dandan kó túmọ̀ sí lílo agbára ara.
- source_word: εἰσελθεῖν
  choice: wọlé
  rationale: “Wọlé” jẹ́ ìtumọ̀ àdánidá tí ó sì péye fún wíwọ inú ilé ibi àsè.
- source_word: ἵνα γεμισθῇ
  choice: kí ... lè kún
  rationale: Ìṣètò yìí fi ète àṣẹ náà hàn ní Yorùbá àdánidá.
- source_word: μου ὁ οἶκος
  choice: ilé mi
  rationale: οἶκος ń tọ́ka sí ilé tí àsè ti ń wáyé; “ilé mi” jẹ́ ìtumọ̀ tààrà tí ó bá àyíká ọ̀rọ̀ mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú àkàwé
  choice: Ọ̀gá
  alternative: Olúwa
  rationale: κύριος ń ṣiṣẹ́ gẹ́gẹ́ bí ẹni tó ni ilé nínú ayé ìtàn àkàwé náà. “Ọ̀gá” kò fi tipá sọ ọ́ di orúkọ oyè Ọlọ́run, ṣùgbọ́n kò sì dí ìtumọ̀ ẹ̀kọ́ àkàwé náà lọ́wọ́.
- issue: Agbára ọ̀rọ̀ ἀνάγκασον
  choice: fi dandan mú àwọn ènìyàn wọlé
  alternative: rọ̀ wọ́n gidigidi pé kí wọ́n wọlé
  rationale: Ọ̀rọ̀ Gíríìkì náà lágbára, nítorí náà a kò rọ̀ ọ́ nínú ẹsẹ̀ pàtàkì. Síbẹ̀, àlàyé ìsàlẹ̀ dáàbò bo àìdánilójú tó wà nínú ọ̀rọ̀ náà, kí a má bàa fi ẹ̀kọ́ lílo agbára ara kún àkàwé náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A lo “ẹrú” láti pa ipò ìdè inú ọ̀rọ̀ Gíríìkì mọ́; “fi dandan mú” sì pa agbára àṣẹ náà mọ́, pẹ̀lú àlàyé láti yà á sọ́tọ̀ kúrò nínú ìtumọ̀ lílo agbára ara.
