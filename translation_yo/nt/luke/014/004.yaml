  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n dákẹ́[a]. Ó sì di ọkùnrin náà mú, ó mú un láradá, ó sì jẹ́ kó lọ[b].
