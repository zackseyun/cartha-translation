lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn tí Jésù béèrè lọ́wọ́ wọn ní ẹsẹ tó ṣáájú; δέ sì fi ìyàtọ̀ láàárín ìbéèrè rẹ̀ àti àìdáhùn wọn hàn.
- source_word: ἡσύχασαν
  choice: wọ́n dákẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọn kò dáhùn; “wọ́n dákẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí láìfi ohun míì kún un.
- source_word: ἐπιλαβόμενος
  choice: Ó sì di ọkùnrin náà mú
  rationale: Èyí pa ìtumọ̀ ìfọwọ́kan tàbí dídi ẹni náà mú mọ́, láìsọ bí Jésù ṣe dì í mú ní pàtó.
- source_word: ἰάσατο
  choice: ó mú un láradá
  rationale: “Mú un láradá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìwòsàn ara nínú àyíká yìí.
- source_word: αὐτὸν
  choice: ọkùnrin náà / un
  rationale: Ó ń tọ́ka sí ọkùnrin aláìsàn tí a mẹ́nu kàn ṣáájú; lílo “ọkùnrin náà” kọ́kọ́ mú ẹni tí a ń tọ́ka sí ṣe kedere.
- source_word: ἀπέλυσεν
  choice: ó sì jẹ́ kí ó lọ
  rationale: ἀπολύω lè túmọ̀ sí tú sílẹ̀, lé lọ, tàbí jẹ́ kí ẹni kan lọ. “Jẹ́ kí ó lọ” bá ìtàn yìí mu, kò sì fi èrò ìgbèkùn tàbí ìdájọ́ òfin kún un.
