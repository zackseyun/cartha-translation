id: LUK.2.38
reference: Luke 2:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: yo
  text: Ní wákàtí náà gan-an[a], ó dé síbẹ̀, ó sì ń dúpẹ́ lọ́wọ́ Ọlọ́run[b], ó sì ń sọ̀rọ̀ nípa rẹ̀[c] fún gbogbo àwọn tí ń retí ìràpadà Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní wákàtí kan náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń yin Ọlọ́run” tàbí “ó ń fi ọpẹ́ fún Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: “Rẹ̀” ṣeé ṣe jù pé ó ń tọ́ka sí Jésù ọmọ náà nínú àyíká ìtàn, bí ó tilẹ̀ jẹ́ pé “Ọlọ́run” ni ẹni tí a mẹ́nu kàn tí ó sún mọ́ arọ́pò-orúkọ náà jù nínú èdè Gíríìkì.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ní wákàtí náà gan-an
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkókò tí ìṣẹ̀lẹ̀ náà ṣẹlẹ̀, “gan-an” sì mú ìtẹnumọ́ αὐτῇ jáde láìsọ ọ́ di àkókò míì.
- source_word: ἐπιστᾶσα
  choice: ó dé síbẹ̀
  rationale: Aorist participle náà ṣàpèjúwe bí Ánà ṣe dé sí ibi tí wọ́n wà ní àkókò náà; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sọ ọ̀nà ìdé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀνθωμολογεῖτο
  choice: ó ń dúpẹ́ lọ́wọ́
  rationale: Imperfect middle náà lè túmọ̀ sí fífi ọpẹ́ tàbí ìyìn hàn. “Ń dúpẹ́ lọ́wọ́ Ọlọ́run” bá dative τῷ θεῷ mu, ó sì pa ìṣe tí ń bá a lọ mọ́ láìfi ìtumọ̀ ingressive “bẹ̀rẹ̀” kún un ní dandan.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Àpilẹ̀kọ Gíríìkì náà jẹ́ àṣà èdè níbí; “lọ́wọ́ Ọlọ́run” ni ọ̀nà Yorùbá àdánidá fún fífi ọpẹ́ fún Ọlọ́run.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: ó ń sọ̀rọ̀ nípa rẹ̀
  rationale: “Ń sọ̀rọ̀” fi imperfect tí ń tọ́ka sí ìṣe tí ń bá a lọ hàn. A pa arọ́pò-orúkọ “rẹ̀” mọ́ kí a má bàa pinnu ẹni tí αὐτοῦ ń tọ́ka sí nínú ẹsẹ̀ náà.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: fún gbogbo àwọn tí ń retí
  rationale: προσδέχομαι ní Lúùkù sábà máa ń ní ìtumọ̀ ìrètí pẹ̀lú ìfojúsọ́nà; “ń retí” ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: λύτρωσιν
  choice: ìràpadà
  rationale: “Ìràpadà” pa ìtumọ̀ ìdásílẹ̀ àti ìgbàlà inú λύτρωσις mọ́, láìdín ọ̀rọ̀ náà kù sí òṣèlú tàbí ẹ̀mí nìkan.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọtọ̀ orúkọ ìlú náà tí ó bá ìpè Yorùbá mu.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“rẹ̀”) ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí “rẹ̀”; nínú àyíká ìtàn, ó ṣeé ṣe jù pé ó ń tọ́ka sí Jésù ọmọ náà.
  alternative: Ó tún lè dà bí ẹni pé ó ń tọ́ka sí Ọlọ́run, nítorí Ọlọ́run ni orúkọ tí ó sún mọ́ ọn jù nínú gbolohun Gíríìkì.
  rationale: Pípa “rẹ̀” mọ́ ń tẹ̀ lé ọ̀rọ̀ Gíríìkì, ó sì dáàbò bo àìdájú gidi náà dípò fífi ìtumọ̀ kan ṣoṣo lé e lórí.
- issue: Ìtumọ̀ “ìràpadà Jerúsálẹ́mù”
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí “ìràpadà Jerúsálẹ́mù,” láìṣàlàyé rẹ̀ síwájú nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè sọ “ìdásílẹ̀ Jerúsálẹ́mù” tàbí túmọ̀ rẹ̀ sí ìgbàlà àwọn ènìyàn Ọlọ́run tí Jerúsálẹ́mù dúró fún.
  rationale: Gbólóhùn náà lè gba ìgbésẹ̀ ìgbàlà Ọlọ́run fún àwọn ènìyàn rẹ̀, pẹ̀lú ìtumọ̀ àwùjọ àti ti ọjọ́ iwájú; a kò gbọdọ̀ dín un kù sí ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; ìforúkọsílẹ̀ náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ó dé síbẹ̀” dípò ọ̀rọ̀ líle, a sì pa ìlọsíwájú àwọn imperfect mọ́ nípasẹ̀ “ń.”
