id: LUK.2.15
reference: Luke 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí àwọn áńgẹ́lì ti kúrò lọ́dọ̀ wọn, tí wọ́n wọ ọ̀run lọ, àwọn olùṣọ́ àgùntàn bá ara wọn sọ pé, “Ẹ jẹ́ kí a lọ nísinsin yìí dé Bẹ́tílẹ́hẹ́mù[a], kí a sì rí ohun yìí tí ó ṣẹlẹ̀[b], èyí tí Olúwa ti jẹ́ kí a mọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ṣókí, “lọ sí Bẹ́tílẹ́hẹ́mù”; ọ̀rọ̀ Gíríìkì ἕως túmọ̀ ní tààrà sí “títí dé Bẹ́tílẹ́hẹ́mù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọ̀ràn yìí tí ó ṣẹlẹ̀”; ọ̀rọ̀ Gíríìkì ῥῆμα lè túmọ̀ sí “ọ̀rọ̀,” “ọ̀ràn,” tàbí “ohun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó bá àgbékalẹ̀ ìtàn Lúùkù mu, ó sì jẹ́ èdè Yorùbá àdánidá láì lo ọ̀rọ̀ àtijọ́ tí ó le.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: ti kúrò lọ́dọ̀ wọn lọ sí ọ̀run
  rationale: Ó fi ìṣe tí ó ṣáájú ọ̀rọ̀ àwọn olùṣọ́ àgùntàn hàn, ó sì pa ìtumọ̀ ọ̀run gẹ́gẹ́ bí ibùgbé ti ọ̀run mọ́.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: sọ fún ara wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tààrà sílẹ̀; a kò tẹnumọ́ ìtẹ̀síwájú imperfect ju bí àyíká ṣe béèrè lọ.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Ẹ jẹ́ kí a lọ nísinsin yìí dé Bẹ́tílẹ́hẹ́mù
  rationale: “Ẹ jẹ́ kí a” fi hortatory subjunctive hàn, “nísinsin yìí” mú agbára δὴ jáde, “dé” sì pa ìmọ̀ ἕως (‘títí dé’) mọ́ ní Yorùbá àdánidá.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ohun yìí tí ó ṣẹlẹ̀
  rationale: Nínú àyíká yìí, ῥῆμα ń tọ́ka sí ìṣẹ̀lẹ̀ tí a kéde, kì í ṣe sí gbólóhùn nìkan; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ míì mọ́.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: èyí tí Olúwa ti jẹ́ kí a mọ̀
  rationale: Ó tú ἐγνώρισεν sí Yorùbá tí ó wọ́pọ̀, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtó bí ‘ìṣípayá.’
theological_decisions:
- issue: Ẹni tí “Olúwa” (ὁ κύριος) ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “Olúwa,” ẹni tí ó jẹ́ orísun ohun tí àwọn áńgẹ́lì sọ di mímọ̀.
  alternative: A lè lóye rẹ̀ ní gbogbogbòò gẹ́gẹ́ bí Olúwa ọ̀run, láì dá a mọ́ Ọlọ́run Baba tàbí ọmọ tuntun náà ní pàtó.
  rationale: Àyíká fi Ọlọ́run hàn gẹ́gẹ́ bí orísun ìkéde àwọn áńgẹ́lì, ṣùgbọ́n ìtumọ̀ kò fi ìdánimọ̀ ẹ̀kọ́ ìsìn tóóró kan lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbòò. “Ẹ jẹ́ kí a” yẹ fún ọ̀rọ̀ ìmòràn tí ẹgbẹ́ kan ń sọ fún ara wọn.
