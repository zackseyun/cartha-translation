  to: Àwọn olùṣọ́ àgùntàn sì wà ní agbègbè kan náà; wọ́n ń lo òru ní ìta, ní pápá[a], wọ́n sì ń ṣe ìṣọ́ òru lórí agbo àgùntàn wọn[b].
