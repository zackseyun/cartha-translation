translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àmì olójú méjì ya ìfihàn àwọn olùṣọ́ sílẹ̀ kúrò nínú àlàyé iṣẹ́ tí wọ́n ń ṣe, ṣùgbọ́n ó pa ìṣàn ìtàn mọ́.
