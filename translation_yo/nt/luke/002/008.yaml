language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: yo
  text: Àwọn olùṣọ́ àgùntàn sì wà ní agbègbè kan náà; wọ́n ń lo òru ní ìta, ní pápá[a], wọ́n sì ń ṣe ìṣọ́ òru lórí agbo àgùntàn wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ́n ń gbé ní ìta gbangba” tàbí “wọ́n pàgọ́ sí ìta.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé àwọn olùṣọ́ náà ń lo òru ní ìta, ní pápá.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “wọ́n ń ṣọ́ àwọn ìṣọ́ òru lórí agbo wọn.” Èyí lè tọ́ka sí ṣíṣọ́ ní ọ̀wọ̀ọ̀wọ́, tàbí sí àwọn àkókò ìṣọ́ tí a pín òru sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ní ìbẹ̀rẹ̀ gbólóhùn yìí, “sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtàn tuntun so mọ́ ohun tí ó ṣáájú, láìfi ìtumọ̀ míì kún un.
- source_word: ποιμένες
  choice: àwọn olùṣọ́ àgùntàn
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí àwọn tí ń tọ́jú àgùntàn; “olùṣọ́ àgùntàn” ṣe kedere ju ọ̀rọ̀ gbogbogbò fún olùtọ́jú ẹran lọ.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: ní agbègbè náà
  rationale: “Agbègbè náà” jẹ́ Yorùbá àdánidá fún ibi tàbí ìlú-kékeré tó yí ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ká, láìsọ pé gbogbo orílẹ̀-èdè ni.
- source_word: ἀγραυλοῦντες
  choice: wọ́n ń lo òru ní ìta pápá
  rationale: Ìṣe náà tẹnumọ́ pé àwọn olùṣọ́ náà ń dúró ní ìta gbangba ní pápá ní òru. “Ń lo òru” mú èyí hàn láìsọ pé ibẹ̀ ni wọ́n ń gbé títí láé tàbí pé wọ́n ń sùn.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: wọ́n ń ṣọ́ ... ní àwọn ìgbà ìṣọ́ òru
  rationale: Ìtumọ̀ yìí pa àwòrán ìṣọ́ òru mọ́, ó sì jẹ́ kí ọ̀pọ̀ nínú ọ̀rọ̀ Gíríìkì hàn, èyí tó lè túmọ̀ sí pé wọ́n ń pín òru sí ìgbà ìṣọ́.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: agbo àgùntàn wọn
  rationale: “Agbo àgùntàn wọn” sọ irú ẹran náà àti pé àwọn ni wọ́n ń tọ́jú rẹ̀ ní kedere, ní Yorùbá tí ó rọrùn.
- source_word: ἦσαν
  choice: wà
  rationale: “Wà” ni ọ̀nà Yorùbá tí ó ṣe déédéé láti sọ pé àwọn olùṣọ́ náà wà ní agbègbè náà nígbà yẹn.
