id: LUK.2.39
reference: Luke 2:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti parí gbogbo ohun tí ó bá òfin Olúwa mu[a], wọ́n padà sí Galili, sí ìlú tiwọn[b], Násárẹ́tì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí òfin Olúwa béèrè.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ìlú”; Násárẹ́tì jẹ́ ìletò kékeré.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: Nígbà tí
  rationale: Ó fi àkókò tí ìṣe àkọ́kọ́ parí kí ìṣe pàtàkì tó tẹ̀ lé hàn, láìfi dandan sọ pé ó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: ἐτέλεσαν
  choice: wọ́n ti parí
  rationale: Ó túmọ̀ sí pé wọ́n mú gbogbo ìṣe tí a ń sọ̀rọ̀ rẹ̀ dé òpin; yíyan ‘parí’ yẹra fún ìtumọ̀ àsọtẹ́lẹ̀ tí ‘mú ṣẹ’ lè fà.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: gbogbo ohun tí ó bá òfin Olúwa mu
  rationale: Ó dúró sítòsí ọ̀rọ̀ Gíríìkì, ó sì pa ìtumọ̀ pé gbogbo ohun tó ní í ṣe pẹ̀lú òfin náà mọ́ láìsọ ọ́ di ‘ohun tí òfin béèrè’ nínú ẹsẹ pàtàkì.
- source_word: νόμον κυρίου
  choice: òfin Olúwa
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìró èdè Ìwé Mímọ́ ti gbólóhùn náà mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Nínú àyíká yìí ó ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí òfin náà ti ọ̀dọ̀ rẹ̀ wá; ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος.
- source_word: ἐπέστρεψαν
  choice: wọ́n padà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípadà sí ibi kan nínú àkọsílẹ̀ ìrìn-àjò, ‘wọ́n padà’ sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: εἰς ń fi ibi tí wọ́n ń lọ hàn; ‘sí’ ni ọ̀rọ̀ Yorùbá tó bá a mu.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: sí ìlú tiwọn
  rationale: πόλις lè jẹ́ ìlú ńlá tàbí kékeré; ‘ìlú’ jẹ́ ọ̀rọ̀ Yorùbá àpapọ̀ tó bójú mu, ‘tiwọn’ sì pa ìtẹnumọ́ ἑαυτῶν mọ́.
- source_word: Ναζαρέθ
  choice: Násárẹ́tì
  rationale: Àkọtọ̀ yìí mú orúkọ ibi náà bá ìró àti ìkọ̀wé Yorùbá mu.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ nínú ‘òfin Olúwa’ ń tọ́ka sí
  choice: ‘Olúwa’ ń tọ́ka sí Ọlọ́run, ẹni tí òfin inú Ìwé Mímọ́ ti ọ̀dọ̀ rẹ̀ wá.
  alternative: Kò sí àlàyé mìíràn tó lágbára nínú àyíká yìí.
  rationale: Gbólóhùn náà jẹ́ ọ̀nà tí àwọn Júù àti Ìwé Mímọ́ fi ń sọ̀rọ̀ nípa òfin Ọlọ́run; a túmọ̀ ọ́ ní tààrà láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ìlú’ jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún πόλις bó tilẹ̀ jẹ́ pé Násárẹ́tì kéré; àlàyé náà wà ní àkọ́sẹ̀jáde [b].
