id: LUK.2.3
reference: Luke 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: yo
  text: Gbogbo ènìyàn sì ń lọ láti forúkọ sílẹ̀[a], olúkúlùkù sí ìlú tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti jẹ́ kí a kọ orúkọ wọn sílẹ̀.” Ọ̀rọ̀ náà ń tọ́ka sí ìforúkọsílẹ̀ ti ìjọba fún ìkànìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: ń lọ
  rationale: Àkókò aláìpé nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń lọ” ṣe àfihàn èyí ní Yorùbá àdánidá.
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Èyí mú ìtumọ̀ “gbogbo wọn” jáde ní ọ̀nà tí ó ṣe kedere, ó sì bá ìtẹnumọ́ olúkúlùkù ní apá kejì mu.
- source_word: ἀπογράφεσθαι
  choice: láti forúkọ sílẹ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá òde òní fún fífi orúkọ ẹni sínú àkọsílẹ̀ ìjọba; ó bá àyíká ìkànìyàn mu láì fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtumọ̀ pínpín mọ́, pé ẹnì kọ̀ọ̀kan ló ń lọ.
- source_word: ἑαυτοῦ
  choice: tirẹ̀
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ yìí; “tirẹ̀” jẹ́ ìtumọ̀ àdánidá fún ohun tí ó jẹ́ ti ẹnì kọ̀ọ̀kan fúnra rẹ̀.
- source_word: πόλιν
  choice: ìlú
  rationale: “Ìlú” lè túmọ̀ sí city tàbí town gẹ́gẹ́ bí πόλις, láì sọ ọ́ di “ìlú ìbílẹ̀” tí yóò túmọ̀ sí ohun tí ó pọ̀ ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Ìṣètò akọ ẹyọ nínú ἕκαστος … ἑαυτοῦ
  choice: olúkúlùkù sí ìlú tirẹ̀
  alternative: olúkúlùkù ọkùnrin sí ìlú tirẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìrísí akọ ẹyọ, akọ lè dúró fún ẹnì kọ̀ọ̀kan ní irú gbólóhùn pínpín bẹ́ẹ̀. Yorùbá kò fi akọ tàbí abo hàn nínú “tirẹ̀”; fífi “ọkùnrin” kún un yóò dín ìtumọ̀ náà kù láìsí ìdí láti inú ọ̀rọ̀ tàbí àyíká.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. “Ń lọ” pa ìṣe tí ó ń bá a lọ mọ́, “forúkọ sílẹ̀” sì jẹ́ gbólóhùn tí gbogbo ènìyàn lè lóye fún ìforúkọsílẹ̀ ìjọba.
