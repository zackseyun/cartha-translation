  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: yo
  text: “Ògo fún Ọlọ́run ní ibi gíga jù lọ, àti àlàáfíà lórí ilẹ̀ ayé láàárín àwọn ènìyàn tí Ọlọ́run dùn sí.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn ènìyàn tí ojúrere Ọlọ́run wà lórí wọn.”
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn ìwé àfọwọ́kọ kan ní: “àti àlàáfíà lórí ilẹ̀ ayé, àti inú rere láàárín àwọn ènìyàn.”'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Ògo
  rationale: Ọ̀rọ̀ náà jẹ́ ìkéde tí ń fi ògo fún Ọlọ́run; “ògo” pa ìwúwo ìjọsìn àti ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: ἐν ὑψίστοις
  choice: ní ibi gíga jù lọ
  rationale: Ó tọ́ka sí agbègbè ọ̀run tí ó ga jù lọ, ó sì dá ìyàtọ̀ ibi sílẹ̀ pẹ̀lú “lórí ilẹ̀ ayé.”
- source_word: θεῷ
  choice: fún Ọlọ́run
  rationale: Ìtumọ̀ yìí fi dative ìfijọ̀wọ́-ògo hàn ní Yorùbá àdánidá.
- source_word: ἐπὶ γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó jẹ́ ìtumọ̀ ibi ní tààrà, ó sì bá ọ̀nà tí Yorùbá òde òní gbà ń sọ̀rọ̀ mu.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè rú ìtumọ̀ ìrẹ́pọ̀ àti ìdákẹ́jẹ̀ inú εἰρήνη.
- source_word: ἐν ἀνθρώποις
  choice: láàárín àwọn ènìyàn
  rationale: ἄνθρωποι níbí tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; Yorùbá kò nílò àlàyé akọ-nlá fún lílo yìí.
- source_word: εὐδοκίας
  choice: tí inú rẹ̀ dùn sí
  rationale: Genitive náà ṣàpèjúwe àwọn ènìyàn gẹ́gẹ́ bí ẹni tí ojúrere Ọlọ́run wà lórí wọn. Ìtúmọ̀ yìí jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé “rẹ̀” mú ẹni tí inú rẹ̀ dùn sí wọn ṣe kedere láti inú ọ̀rọ̀-ìsọ̀rí náà.
theological_decisions:
- issue: Ìtumọ̀ genitive εὐδοκίας nínú ìkéde àwọn áńgẹ́lì
  choice: Àlàáfíà wà láàárín àwọn ènìyàn tí inú Ọlọ́run dùn sí.
  alternative: “Àlàáfíà, inú rere sí àwọn ènìyàn,” gẹ́gẹ́ bí ẹ̀dà kan tí ó ka εὐδοκία; tàbí “àwọn ènìyàn ojúrere” gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ ìrísí genitive.
  rationale: SBLGNT ka εὐδοκίας, genitive, nítorí náà ó dára kí gbólóhùn náà ṣàpèjúwe àwọn ẹni tí àlàáfíà dé bá. A kò fi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí; a kàn tẹ̀ lé ìṣọ̀kan gírámà Gíríìkì. Àyípadà εὐδοκία wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún. “Àwọn ènìyàn” jẹ́ ọ̀rọ̀ àpapọ̀ ní Yorùbá, nítorí náà kò sí ìdí fún àlàyé pé ó kan gbogbo ẹ̀dá ènìyàn, kì í ṣe akọ nìkan.
