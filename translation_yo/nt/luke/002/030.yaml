  text: because my eyes have seen your salvation[a]
translation:
  language: yo
  text: nítorí ojú mi ti rí ìgbàlà rẹ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olùgbàlà rẹ.” Gíríìkì sọ pé “ìgbàlà rẹ,” ṣùgbọ́n nínú àyíká ọ̀rọ̀ náà, ìgbàlà Ọlọ́run fara hàn nínú Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: nítorí
  rationale: Nínú ọ̀rọ̀ yìí, ó ń fi ìdí ọ̀rọ̀ Síméónì tó ṣáájú múlẹ̀; “nítorí” jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ ìdí náà ní Yorùbá.
- source_word: εἶδον
  choice: ti rí
  rationale: Ẹ̀yà ọ̀rọ̀ yìí ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ó sì ní ìṣe pẹ̀lú ipò ìsinsìnyí; “ti rí” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: οἱ ὀφθαλμοί μου
  choice: ojú mi
  rationale: Ó pa àwòrán ara ẹni tó hàn gbangba nínú Gíríìkì mọ́ dípò yíyí i sí “mo,” ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye.
- source_word: τὸ σωτήριόν σου
  choice: ìgbàlà rẹ
  rationale: σωτήριον túmọ̀ sí ìgbàlà tàbí ìdáǹdè, kì í ṣe ọ̀rọ̀ orúkọ ẹni σωτήρ (“Olùgbàlà”) ní tààrà. “Ìgbàlà rẹ” pa ọ̀rọ̀ orísun àti ìjìnlẹ̀ rẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ náà ìgbàlà Ọlọ́run wà níwájú Síméónì nínú ẹni Jésù.
theological_decisions:
- issue: Bóyá kí τὸ σωτήριόν σου jẹ́ ọ̀rọ̀ àfojúsùn “ìgbàlà rẹ” tàbí kí a sọ ọ́ di ẹni pé “Olùgbàlà rẹ.”
  choice: ìgbàlà rẹ
  alternative: Olùgbàlà rẹ
  rationale: Gíríìkì lo σωτήριον, èyí tó sábà ń tọ́ka sí ìgbàlà tàbí ohun tí Ọlọ́run fi ń gbàlà, kì í ṣe σωτήρ, ọ̀rọ̀ tó túmọ̀ sí “Olùgbàlà.” Yíyan “ìgbàlà rẹ” jẹ́ kí ìtumọ̀ pé ìgbàlà Ọlọ́run fara hàn nínú ọmọ náà dúró láìfi ìtumọ̀ àlàyé sínú ọ̀rọ̀ pàtó.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ọ̀nà àwòrán “ojú mi” ti orísun mọ́.
