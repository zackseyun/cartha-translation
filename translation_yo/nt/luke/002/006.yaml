source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: yo
  text: Ó sì ṣe, nígbà tí wọ́n wà níbẹ̀, àwọn ọjọ́ fún un láti bímọ sì pé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọjọ́ fún un láti bímọ sì parí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: sì
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ Gíríìkì náà ń tẹ ìtàn síwájú; ‘sì’ dá ìsopọ̀ náà mọ́ ní Yorùbá láì fi gbólóhùn líle tí kò pọndandan kún un.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: Nígbà tí wọ́n ... wà níbẹ̀
  rationale: Ìṣètò ọ̀rọ̀ náà ń tọ́ka sí ohun méjì tó ń ṣẹlẹ̀ ní àkókò kan náà. Èyí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘nígbà tí wọ́n wà níbẹ̀’ mọ́.
- source_word: ἐπλήσθησαν
  choice: pé
  rationale: Ní àyíká ọ̀rọ̀ oyún àti ìbímọ, ‘ọjọ́ ... pé’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àkókò tó dé òpin tàbí ìkún rẹ̀, ó sì ṣì pa èrò ìmú ọjọ́ ṣẹ mọ́.
- source_word: αἱ ἡμέραι
  choice: ọjọ́
  rationale: Ó tẹ̀ lé ọ̀rọ̀ orísun tó sọ ‘àwọn ọjọ́,’ ṣùgbọ́n Yorùbá sábà máa ń lo ‘ọjọ́’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ nínú gbólóhùn ‘ọjọ́ pé.’
- source_word: τοῦ τεκεῖν αὐτήν
  choice: tí yóò fi bímọ
  rationale: Èyí sọ ní kedere pé ìmú ọjọ́ náà ṣẹ jẹ́ ti ìbímọ obìnrin náà, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn, tó bójú mu.
theological_decisions:
- issue: Bóyá ἐπλήσθησαν αἱ ἡμέραι ń tọ́ka sí àkókò tí Ọlọ́run yàn tàbí kìkì òpin oyún Màríà
  choice: ọjọ́ tí yóò fi bímọ pé
  alternative: àkókò tó yẹ kí ó bímọ dé
  rationale: Àṣàyàn náà pa àwòrán ‘ọjọ́’ àti ìpé tàbí ìkún wọn mọ́, láì sọ ní tààrà pé Ọlọ́run ló yan àkókò náà. Nítorí náà, kò pa ìṣòro ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
