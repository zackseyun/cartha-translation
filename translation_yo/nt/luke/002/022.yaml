id: LUK.2.22
reference: Luke 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: yo
  text: Nígbà tí àwọn ọjọ́ ìwẹ̀nùmọ́ wọn pé gẹ́gẹ́ bí òfin Mósè[a], wọ́n mú un gòkè lọ sí Jerúsálẹ́mù láti mú un wá síwájú Olúwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, ‘ìwẹ̀nùmọ́ rẹ̀,’ dípò ‘ìwẹ̀nùmọ́ wọn.’
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: pé
  rationale: Nínú ọ̀rọ̀ nípa àkókò, ọ̀rọ̀ yìí túmọ̀ sí pé iye ọjọ́ tí a yàn ti dé òpin rẹ̀; ‘pé’ jẹ́ ọ̀nà Yorùbá àdánidá, tó sì pa ìtumọ̀ náà mọ́.
- source_word: καθαρισμοῦ
  choice: ìwẹ̀nùmọ́
  rationale: Ó tọ́ka sí ìwẹ̀nùmọ́ nípa àṣà ẹ̀sìn lábẹ́ òfin Mósè lẹ́yìn ìbímọ; ‘ìwẹ̀nùmọ́’ ṣe kedere, ó sì bá àyíká òfin àti ìjọsìn mu.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ẹ̀dà Gíríìkì SBLGNT tí a fún ní ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ αὐτῶν; nítorí náà, a pa ọ̀pọ̀ náà mọ́ nínú àkọsílẹ̀ pàtàkì.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: gẹ́gẹ́ bí òfin Mósè
  rationale: Ó fi hàn pé ohun tí wọ́n ṣe bá ohun tí òfin Mósè béèrè mu; gbolohun yìí jẹ́ kedere, ó sì pa ìforúkọsílẹ̀ òfin mọ́.
- source_word: ἀνήγαγον
  choice: wọ́n mú un gòkè lọ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ mímú ẹni gòkè lọ, ó sì bá ìrìnàjò gòkè sí Jerúsálẹ́mù mu.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà ìkọ̀wé orúkọ ìlú Jerusalem tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: παραστῆσαι
  choice: láti mú un wá síwájú
  rationale: Nínú àyíká ìjọsìn àti òfin yìí, ó túmọ̀ sí mímú ọmọ náà wá síwájú Ọlọ́run; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi àlàyé àfikún kún un.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος níbi tí ó ti ń tọ́ka sí Ọlọ́run pẹ̀lú ọ̀wọ̀.
theological_decisions:
- issue: Iye ọ̀rọ̀ arọ́pò-orúkọ nínú ‘àwọn ọjọ́ ìwẹ̀nùmọ́ wọn’
  choice: Pa ‘wọn’ tó jẹ́ ọ̀pọ̀ mọ́ nínú àkọsílẹ̀ pàtàkì
  alternative: àwọn ọjọ́ ìwẹ̀nùmọ́ rẹ̀
  rationale: SBLGNT tí a lò ní αὐτῶν (‘wọn’). A kò yí i padà láti mú un bá ìtumọ̀ Lẹ́fítíkù tàbí àṣà ìtumọ̀ kan mu; a fi ẹ̀dà ẹyọ náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Mú un gòkè lọ’ pa ìtọ́sọ́nà ìrìnàjò sí Jerúsálẹ́mù mọ́, ‘mú un wá síwájú Olúwa’ sì pa ìforúkọsílẹ̀ ìjọsìn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan kún un.
