id: LUK.2.41
reference: Luke 2:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: yo
  text: Àwọn òbí rẹ̀ sì máa ń lọ sí Jerusalẹmu lọ́dọọdún fún Àjọ̀dún Ìrékọjá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: máa ń lọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí ń tọ́ka sí ohun tí wọ́n ń ṣe léraléra ní àkókò àtijọ́; “máa ń lọ” sọ ìṣe àṣà náà ní Yorùbá àdánidá.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Èyí ni ìtumọ̀ tààrà àti èdè Yorùbá àdánidá fún ọ̀rọ̀ Gíríìkì náà, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: κατ’ ἔτος
  choice: lọ́dọọdún
  rationale: Ó túmọ̀ sí “ní gbogbo ọdún” tàbí “ọdún dé ọdún”; “lọ́dọọdún” jẹ́ kedere, ó sì bá ìṣe tí ó ń ṣẹlẹ̀ léraléra mu.
- source_word: Ἰερουσαλὴμ
  choice: Jerusalẹmu
  rationale: Àkọsílẹ̀ orúkọ ibi náà ní ìrísí tí ó wọ́pọ̀, tí ó sì ṣeé kà ní Yorùbá.
- source_word: τῇ ἑορτῇ
  choice: fún Àjọ̀dún
  rationale: Nínú àyíká ìrìn-àjò yìí, dátífù náà fi àkókò tàbí ète ìrìn-àjò hàn; “fún Àjọ̀dún” sọ ète náà ní kedere.
- source_word: τοῦ πάσχα
  choice: Ìrékọjá
  rationale: Èyí ni orúkọ Yorùbá tí ó ṣe kedere fún àjọ̀dún Júù náà, Pásíkà.
theological_decisions:
- issue: Bí a ṣe tọ́ka sí àwọn ará ilé Jésù
  choice: àwọn òbí rẹ̀
  alternative: baba àti ìyá rẹ̀
  rationale: Gíríìkì sọ ní tààrà pé “àwọn òbí rẹ̀.” Ìtumọ̀ yìí pa ìtumọ̀ ìtàn náà mọ́ láìgbọ́dọ̀ yanju tàbí sẹ́ ẹ̀kọ́ nípa bí a ṣe bí Jésù tí Lúùkù ti sọ ṣáájú.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn níbi tí ó ti yẹ, tí ó ní ọlá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. “Máa ń lọ” àti “lọ́dọọdún” jọ mú ìṣe àṣà tí ọ̀rọ̀-ìṣe aláìpé Gíríìkì fi hàn jáde láìdun bí àsọtúnsọ tí kò yẹ.
