  naturalness: “Àwọn òbí rẹ̀ sì máa ń lọ sí Jerusalẹmu lọ́dọọdún fún Àjọ̀dún Ìrékọjá” jẹ́ Yorùbá boṣewa tí ó rọrùn, tí ó sì yẹ fún ìtàn mímọ́. “Máa ń lọ” pẹ̀lú “lọ́dọọdún” ń sọ ìṣe tí ó máa ń ṣẹlẹ̀ ní ìgbà àtijọ́ ní ọ̀nà àdánidá.
