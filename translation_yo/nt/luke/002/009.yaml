source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: yo
  text: Áńgẹ́lì kan ti Olúwa sì dúró lẹ́gbẹ̀ẹ́ wọn[a], ògo Olúwa sì tàn yí wọn ká, ẹ̀rù ńlá sì bà wọ́n[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “wá sí ọ̀dọ̀ wọn” tàbí “farahàn sí wọn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí wíwá síbẹ̀ lójijì àti sí dídúró nítòsí wọn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “wọ́n bẹ̀rù ìbẹ̀rù ńlá”; àkànlò Gíríìkì yìí ń fi ẹ̀rù líle hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa kan
  rationale: Ní àyíká ìtàn yìí, ἄγγελος túmọ̀ sí áńgẹ́lì, kì í ṣe òjíṣẹ́ lásán. Fífi “kan” sí ẹ̀yìn gbólóhùn náà fi hàn pé kò sí article ní Gíríìkì, láì sọ ọ́ di “áńgẹ́lì náà.”
- source_word: ἐπέστη αὐτοῖς
  choice: wá dúró lẹ́gbẹ̀ẹ́ wọn lójijì
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí dídúró lẹ́gbẹ̀ẹ́ ẹnì kan tàbí wíwá síbẹ̀ lójijì. Ìtumọ̀ yìí pa ìṣe dídúró mọ́, ó sì fi ìfarahàn òjijì tí ọ̀rọ̀ náà lè ní hàn.
- source_word: δόξα κυρίου
  choice: ògo Olúwa
  rationale: “Ògo” pa ìtumọ̀ δόξα mọ́ gẹ́gẹ́ bí ọlá àti ìmọ́lẹ̀ àtọ̀runwá; “Olúwa” sì jẹ́ ìtumọ̀ κύριος nígbà tí ó ń tọ́ka sí Ọlọ́run.
- source_word: περιέλαμψεν αὐτούς
  choice: tàn yí wọn ká
  rationale: Gbólóhùn yìí sọ ní ti ẹ̀dá Yorùbá pé ìmọ́lẹ̀ náà tàn ká wọn yíká, ó sì bá περιλάμπω mu.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ẹ̀rù ńlá sì bà wọ́n
  rationale: Èyí jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ ní Yorùbá láti sọ ìbẹ̀rù líle, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àkànlò Gíríìkì náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ἄγγελος κυρίου àti δόξα κυρίου
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ní ẹsẹ yìí, κύριος ń tọ́ka sí Ọlọ́run. “Olúwa” pa ìwọ̀n ẹ̀sìn àti lílo ọ̀rọ̀ náà nínú Májẹ̀mú Tuntun mọ́ ju “Ọ̀gá” lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “lójijì” láti mú agbára ἐπέστη jáde láì sọ pé ìfarahàn àrà ọ̀tọ̀ kan ṣẹlẹ̀ ju ohun tí Gíríìkì sọ lọ.
