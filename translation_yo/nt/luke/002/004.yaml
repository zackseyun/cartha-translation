id: LUK.2.4
reference: Luke 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: yo
  text: Jósẹ́fù náà sì lọ gòkè láti Gálílì, láti ìlú Násárẹ́tì, lọ sí Jùdíà, sí ìlú Dáfídì tí a ń pè ní Bẹ́tílẹ́hẹ́mù, nítorí pé ó ti inú ilé àti ìran Dáfídì wá[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jẹ́ ti ilé àti ìdílé Dáfídì.” Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀ méjì tó ní ìbátan nípa ìran, láti tẹnumọ́ pé Jósẹ́fù jẹ́ àtọmọdọ́mọ Dáfídì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: gòkè
  rationale: Ó pa àwòrán ìrìn-àjò sí ibi gíga mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ, láì sọ ọ́ di ‘lọ’ lásán.
- source_word: δὲ καὶ
  choice: pẹ̀lú sì
  rationale: ‘Sì’ so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú, ‘pẹ̀lú’ sì fi hàn pé Jósẹ́fù náà wà lára àwọn tó lọ.
- source_word: πόλεως / πόλιν
  choice: ìlú / ìlú
  rationale: ‘Ìlú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún Násárẹ́tì àti fún àkọlé Bẹ́tílẹ́hẹ́mù gẹ́gẹ́ bí ìlú Dáfídì.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: ìlú Dáfídì tí a ń pè ní Bẹ́tílẹ́hẹ́mù
  rationale: Ó pa ìtumọ̀ àti ìṣètò gbólóhùn ìbátan inú Gíríìkì mọ́, ó sì jẹ́ Yorùbá tó ṣe déédéé.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: nítorí pé ó ... wá
  rationale: Ó sọ ìdí tó wà nínú àkójọpọ̀ ọ̀rọ̀ Gíríìkì ní Yorùbá àdánidá.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: ó ti inú ilé àti ìran Dáfídì wá
  rationale: ‘Ilé’ ń pa ìtumọ̀ ìdílé ọba mọ́, ‘ìran’ sì ń tọ́ka sí ìsopọ̀ nípa àwọn baba ńlá; lílo ọ̀rọ̀ méjèèjì kò da ìtẹnumọ́ Lúùkù nù.
theological_decisions:
- issue: Àwọn ọ̀rọ̀ nípa jíjẹ́ àtọmọdọ́mọ Dáfídì
  choice: ó ti inú ilé àti ìran Dáfídì wá
  alternative: ó jẹ́ ti ilé àti ìdílé Dáfídì
  rationale: Àṣàyàn náà pa οἶκος àti πατριά mọ́ gẹ́gẹ́ bí ọ̀rọ̀ méjì tó ní ìbátan, ó sì tẹnumọ́ ìran Dáfídì ti Jósẹ́fù láì fi ẹ̀kọ́ ìsìn míì kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì kọ àwọn orúkọ ibi àti ènìyàn ní ìlànà Yorùbá.
