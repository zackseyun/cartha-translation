  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: yo
  text: èyí tí ìwọ ti pèsè níwájú gbogbo àwọn ẹ̀yà ènìyàn[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ojú gbogbo àwọn ẹ̀yà ènìyàn”; àṣà ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí a gbé kalẹ̀ ní gbangba kí gbogbo wọn lè rí i.
    reason: lexical_alternative
  - marker: b
