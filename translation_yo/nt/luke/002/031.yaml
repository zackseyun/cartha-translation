    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ aláṣe kan ṣoṣo yìí ń tọ́ka sí “ìgbàlà” nínú ẹsẹ tó ṣáájú; “èyí tí” so gbólóhùn náà mọ́ ohun tí a mẹ́nu kàn ṣáájú lọ́nà àdánidá.
- source_word: ἡτοίμασας
  choice: ìwọ ti pèsè
  rationale: Ìṣe náà jẹ́ ẹni kejì ẹyọ, Ọlọ́run sì ni a ń bá sọ̀rọ̀. “Ti pèsè” jẹ́ èdè Yorùbá àdánidá tó sì fi hàn pé ìmúrasílẹ̀ náà ti ṣẹlẹ̀.
- source_word: κατὰ πρόσωπον
  choice: níwájú
  rationale: “Níwájú” mú ìtumọ̀ ohun tí a gbé kalẹ̀ ní gbangba, ní ojú tàbí níwájú àwọn ẹlòmíràn, láìjẹ́ kí gbólóhùn náà le ní etí Yorùbá.
- source_word: πάντων
  choice: gbogbo
  rationale: Ó ń tọ́ka sí gbogbo wọn láìsí àyọkúrò nínú ọ̀rọ̀ náà.
- source_word: τῶν λαῶν
  choice: àwọn ẹ̀yà ènìyàn
  rationale: Ọ̀pọ̀ λαῶν ń tọ́ka sí àwọn àwùjọ ènìyàn púpọ̀. “Àwọn ẹ̀yà ènìyàn” pa ọ̀pọ̀ náà mọ́, kò sì yára sọ ọ́ di “àwọn orílẹ̀-èdè” ṣáájú àlàyé ẹsẹ tó tẹ̀ lé.
theological_decisions:
- issue: Ìwọ̀n àti ìtumọ̀ λαῶν ní ìbáṣepọ̀ pẹ̀lú ẹsẹ tó tẹ̀ lé
  choice: gbogbo àwọn ẹ̀yà ènìyàn
  alternative: gbogbo àwọn orílẹ̀-èdè; gbogbo ènìyàn
  rationale: Yíyan “àwọn ẹ̀yà ènìyàn” pa ọ̀pọ̀ inú Gíríìkì mọ́, ó sì fi ààyè sílẹ̀ fún ẹsẹ 32 láti sọ ní pàtó nípa àwọn Kèfèrí àti Ísírẹ́lì, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. Fífún “ìwọ” ní àyè mú ẹni tí a ń bá sọ̀rọ̀—Ọlọ́run—hàn kedere, “níwájú” sì yàgò fún ìtumọ̀ gígún tí “níwájú ojú” lè ní ní Yorùbá.
