  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: yo
  text: Nígbà tí ó sì pé ọmọ ọdún méjìlá, bí wọ́n ti ń gòkè lọ gẹ́gẹ́ bí àṣà àjọ̀dún náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ìyẹn ni, Àjọ̀dún Ìrékọjá, gẹ́gẹ́ bí ẹsẹ tó ṣáájú ti sọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: ó pé ọmọ ọdún méjìlá
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà ìsọ̀rọ̀ nípa ọjọ́-orí; ‘ó pé ọmọ ọdún méjìlá’ jẹ́ èdè Yorùbá àdánidá, ó sì ń tọ́ka sí Jésù gẹ́gẹ́ bí àyíká ọ̀rọ̀ ti fi hàn.
- source_word: ἀναβαινόντων
  choice: bí wọ́n ti ń gòkè lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘gòkè lọ,’ ó sì jẹ́ ọ̀rọ̀ tí a sábà lò fún lílọ sí Jerúsálẹ́mù. ‘Ti ń’ pa ìṣe tí ó ń lọ lọ́wọ́ mọ́; a kò fi ‘sí Jerúsálẹ́mù’ kún un nítorí ẹsẹ yìí kò tún sọ ọ́ ní tààrà.
- source_word: αὐτῶν
  choice: wọ́n
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí àwọn tí àyíká ọ̀rọ̀ mẹ́nu kàn, pàápàá àwọn òbí Jésù; ‘wọ́n’ kò fi ìtumọ̀ tí ó ju ti Gíríìkì lọ kún un.
- source_word: κατὰ τὸ ἔθος
  choice: gẹ́gẹ́ bí àṣà
  rationale: Èyí ń fi hàn pé wọ́n ṣe ohun náà ní ìbámu pẹ̀lú ìṣe tí ó ti di àṣà. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: τῆς ἑορτῆς
  choice: àjọ̀dún náà
  rationale: ἑορτή jẹ́ àjọ̀dún ìsìn. Atọ́ka ‘náà’ pa article Gíríìkì mọ́, ó sì tọ́ka sí Àjọ̀dún Ìrékọjá tí ẹsẹ tó ṣáájú sọ.
- source_word: καὶ ὅτε
  choice: Nígbà tí ó sì
  rationale: ‘Nígbà tí’ mú ìbáṣepọ̀ àkókò jáde, ‘sì’ sì pa ìtẹ̀síwájú ìtàn tí καί ń fi hàn mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A pa ìṣe tí ó ń lọ lọ́wọ́ nínú ἀναβαινόντων mọ́ pẹ̀lú ‘wọ́n ti ń gòkè lọ.’ A kò fi àmì [a] sí ọ̀rọ̀ ọjọ́-orí, nítorí àlàyé Gẹ̀ẹ́sì fún àmì náà dájú pé ó ń jíròrò ἀναβαινόντων, ṣùgbọ́n àmì náà wà lẹ́yìn ‘twelve years old,’ ó sì dà bí àṣìṣe ìṣètò; kò sí àṣàyàn pàtàkì tí ó yẹ fún àlàyé ìsàlẹ̀ ní Yorùbá.
