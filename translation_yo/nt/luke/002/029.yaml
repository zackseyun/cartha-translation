source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: yo
  text: “Ní báyìí, Olúwa, ìwọ ń tú ẹrú rẹ̀[a] sílẹ̀[b] ní àlàáfíà, gẹ́gẹ́ bí ọ̀rọ̀ rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘ìránṣẹ́ rẹ̀.’ Ọ̀rọ̀ Giriki δοῦλος lè túmọ̀ sí ‘ẹrú’ tàbí ‘ìránṣẹ́’; ‘ẹrú’ ni a lò níbí nítorí pé ọ̀rọ̀ tí Simeoni fi pe Ọlọ́run ní ‘Olúwa’ mú ìbáṣepọ̀ ẹni tó ní ẹrú àti ẹrú rẹ̀ hàn gbangba.
    reason: lexical_alternative
  - marker: b
    text: Ohun tí Simeoni ní lọ́kàn ni pé ó ti múra tán láti fi ayé sílẹ̀ ní àlàáfíà, bí ó tilẹ̀ jẹ́ pé ohun tí Giriki sọ ní tààrà jù ni ‘ìwọ ń tú sílẹ̀’ tàbí ‘ìwọ ń jẹ́ kí ó lọ.’
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Ní báyìí
  rationale: Ó fi hàn pé ìmúṣẹ ohun tí Simeoni ń retí ti dé ní àkókò yìí; gbólóhùn náà sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀπολύεις
  choice: ìwọ ń tú … sílẹ̀
  rationale: Ó pa àwòrán ìtúsílẹ̀ tàbí fífi ẹni kan lọ mọ́ láì sọ ní pàtó pé Ọlọ́run ń jẹ́ kí Simeoni kú.
- source_word: τὸν δοῦλόν σου
  choice: ẹrú rẹ̀
  rationale: δοῦλος lè túmọ̀ sí ẹrú tàbí ìránṣẹ́, ṣùgbọ́n bí Simeoni ṣe pe Ọlọ́run ní δέσποτα mú ìbáṣepọ̀ olúwa àti ẹrú hàn gbangba; ‘ẹrú rẹ̀’ pa agbára ìtumọ̀ yẹn mọ́.
- source_word: δέσποτα
  choice: Olúwa
  rationale: Nínú àdúrà Yorùbá, ‘Olúwa’ jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí ó bá ẹni tó ní àṣẹ lórí ìránṣẹ́ tàbí ẹrú mu; ó sì jẹ́ àdánidá ju ‘Ọ̀gá’ lọ nínú àyíká yìí.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: gẹ́gẹ́ bí ọ̀rọ̀ rẹ̀
  rationale: Ó fi ìbámu pẹ̀lú ohun tí Ọlọ́run ti sọ hàn, ó sì pa ìtọ́kasí sí ìlérí Ọlọ́run mọ́.
- source_word: ἐν εἰρήνῃ
  choice: ní àlàáfíà
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti èdè Yorùbá àdánidá fún lílọ kúrò láìsí ìdààmú, lábẹ́ ojú rere Ọlọ́run.
theological_decisions:
- issue: Bóyá kí a sọ pé Simeoni ń tọ́ka sí ikú rẹ̀ ní pàtó
  choice: Pa àwòrán ìtúsílẹ̀ mọ́ láì darúkọ ikú ní pàtó
  alternative: ‘ìwọ ń jẹ́ kí ẹrú rẹ̀ kú ní àlàáfíà’
  rationale: Àyíká ọ̀rọ̀ náà fi hàn pé Simeoni ti múra tán láti kú, ṣùgbọ́n ἀπολύω túmọ̀ sí títú sílẹ̀ tàbí jíjẹ́ kí ẹni lọ, kì í ṣe ‘mú kí ó kú’ ní tààrà. Ìtumọ̀ yìí pa àìsọgbangba àti ewì inú ọ̀rọ̀ náà mọ́.
- issue: Bí a ṣe lè so δοῦλος àti δέσποτα pọ̀
  choice: ‘ẹrú’ àti ‘Olúwa’
  alternative: ‘ìránṣẹ́’ àti ‘Olúwa Ọba Aláṣẹ’
  rationale: Àṣàyàn náà mú ìbáṣepọ̀ ẹni tó ní àṣẹ àti ẹni tó wà lábẹ́ àṣẹ rẹ̀ hàn, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Giriki kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàwọlé, ọ̀wọ̀, àti èyí tí ó yẹ fún àdúrà. A lo ‘Olúwa’ dípò ‘Ọ̀gá’ nítorí pé ó bá ìpè sí Ọlọ́run mu dáadáa, ṣùgbọ́n a pa agbára ìbáṣepọ̀ δέσποτα–δοῦλος mọ́ nípasẹ̀ ‘Olúwa’ àti ‘ẹrú.’
