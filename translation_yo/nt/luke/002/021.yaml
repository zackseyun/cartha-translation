id: LUK.2.21
reference: Luke 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: yo
  text: Nígbà tí ọjọ́ mẹ́jọ pé fún ìkọlà rẹ̀[a], wọ́n pe orúkọ rẹ̀ ní Jésù[b], orúkọ tí áńgẹ́lì náà ti pè é ní kí a tó lóyún rẹ̀ nínú ilé ọlẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ọjọ́ mẹ́jọ náà pé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n pè é ní Jésù.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, kí a tó lóyún rẹ̀ nínú ilé ọlẹ̀ Màríà.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: nígbà tí ọjọ́ mẹ́jọ pé
  rationale: Ó fi ìtumọ̀ pé àsìkò náà dé òpin hàn ní Yorùbá àdánidá, ó sì pa ìrísí ọ̀rọ̀ Lúùkù mọ́ ju ‘lẹ́yìn ọjọ́ mẹ́jọ’ lọ.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: fún kí wọ́n kọ ọ́ ní ilà
  rationale: Ó sọ ète àsìkò náà ní kedere; ‘kọ ní ilà’ ni gbólóhùn Yorùbá tó wọ́pọ̀ fún ìkọlà abẹ́.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: wọ́n pe orúkọ rẹ̀ ní Jésù
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa ọ̀rọ̀ ‘orúkọ’ àti ìṣe pípè orúkọ tó wà nínú Gíríìkì mọ́.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó ti fẹsẹ̀ múlẹ̀ ní Yorùbá.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: orúkọ tí áńgẹ́lì náà ti pè é
  rationale: Ó tún ìṣe κληθέν ṣe gẹ́gẹ́ bí orísun, ó sì lo ‘náà’ láti tọ́ka sí áńgẹ́lì tí a ti mẹ́nu kàn tẹ́lẹ̀.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: kí a tó lóyún rẹ̀ nínú ilé ọlẹ̀
  rationale: Ó túmọ̀ ìlóyún ènìyàn ní kedere láìfi èdè ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò béèrè kún un; ‘ilé ọlẹ̀’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún womb.
theological_decisions:
- issue: Gbólóhùn nípa ìlóyún Jésù
  choice: kí a tó lóyún rẹ̀ nínú ilé ọlẹ̀
  alternative: kí a tó lóyún Jésù nínú ilé ọlẹ̀ Màríà
  rationale: Àkọ́kọ́ tẹ̀ lé ọ̀rọ̀ Gíríìkì láìfi orúkọ Màríà, tí kò sí nínú ẹsẹ yìí, sínú ẹsẹ náà. Ó sọ ìṣẹ̀lẹ̀ ìlóyún rẹ̀ ní kedere láìṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Kọ ní ilà’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lasán lè lóye, ‘ilé ọlẹ̀’ sì yẹ fún àyíká ìlóyún. A pa àtúnsọ gbòngbò καλέω mọ́ nípa lílo ‘pe’ lẹ́ẹ̀mejì.
