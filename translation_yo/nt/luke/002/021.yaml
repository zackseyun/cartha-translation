review_pass:
  verdict: revise
  source_fidelity: Àtúmọ̀ náà mú ìtẹ̀lé àsìkò ọjọ́ mẹ́jọ, ìkọlà, fífún ọmọ náà ní orúkọ Jésù, àti ìpè orúkọ náà ṣáájú ìlóyún rẹ̀ nínú ilé ọlẹ̀ hàn dáadáa. Síbẹ̀, gbolohun ‘orúkọ tí áńgẹ́lì náà ti pè é’ nílò ‘ní’ ní òpin láti fi hàn pé áńgẹ́lì pè ọmọ náà ní orúkọ náà, kì í ṣe pé ó kan ‘pe’ orúkọ náà. ‘Fún ìkọlà rẹ̀’ sì jẹ́ ọ̀nà tí ó péye, tí ó sì wúlò ní Yorùbá fún τοῦ περιτεμεῖν αὐτόν.
  naturalness: Ìlò ‘Nígbà tí ọjọ́ mẹ́jọ pé’ àti ‘wọ́n pe orúkọ rẹ̀ ní Jésù’ jẹ́ Yorùbá ìgbàlódé tó mọ́. A tún ṣe àtúnṣe àlàyé àfikún [b], nítorí ‘wọ́n sọ ọ́ ní Jésù’ kò dára gẹ́gẹ́ bí ọ̀nà ìpè-orúkọ ní Yorùbá.
  terminology: ‘Ìkọlà’ jẹ́ ọ̀rọ̀ tó níyì, tó ṣe kedere fún περιτομή. ‘Jésù,’ ‘áńgẹ́lì,’ ‘lóyún,’ àti ‘ilé ọlẹ̀’ bá ìlò Bíbélì Yorùbá àti ìtumọ̀ orísun mu. A kò fi Màríà sínú ọ̀rọ̀ ẹsẹ náà; a fi í sí àlàyé ẹsẹ nìkan, gẹ́gẹ́ bí àlàyé ìtọ́kasí.
  issues:
