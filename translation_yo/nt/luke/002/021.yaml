  to: Nígbà tí ọjọ́ mẹ́jọ pé fún ìkọlà rẹ̀[a], wọ́n pe orúkọ rẹ̀ ní Jésù[b], orúkọ tí áńgẹ́lì náà ti pè é ní kí a tó lóyún rẹ̀ nínú ilé ọlẹ̀[c].
  rationale: 'Àtúnṣe náà ṣàtúnṣe ìṣètò gbolohun ìpè-orúkọ kí ó lè sọ ìtumọ̀ κληθέν dáadáa: áńgẹ́lì náà ti pè ọmọ náà ní orúkọ Jésù. Ó tún rọ́pò àlàyé [b] pẹ̀lú gbolohun Yorùbá tó jẹ́ àdánidá. Gbogbo àkọsílẹ̀ ìtumọ̀ pàtàkì àti ìtumọ̀ tí orísun fi sílẹ̀ ní àìlójútó ni a pa mọ́.'
