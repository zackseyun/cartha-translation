source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: yo
  text: Ó sì gba ọmọ náà sínú apá rẹ̀, ó sì yin Ọlọ́run, ó sì wí pé,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì gbà ọmọ náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbà” tàbí “kaàbọ̀”; ṣùgbọ́n nítorí gbólóhùn “sínú apá rẹ̀” tó tẹ̀ lé e, “gba ọmọ náà sínú apá rẹ̀” ló ṣàpèjúwe ìṣe ti ara náà dáadáa ní Yorùbá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: gbé
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, δέχομαι pẹ̀lú ‘sí apá’ ń tọ́ka sí gbígba ọmọ náà sínú apá; ‘gbé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe náà, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘gbà.’
- source_word: αὐτό
  choice: ọmọ náà
  rationale: Arọ́pò-orúkọ akọ́-abo àárín náà ń tọ́ka sí ọmọ Jésù. Dípò lílo arọ́pò-orúkọ tí ó lè rú ìtumọ̀ ní Yorùbá, àtúnṣe orúkọ náà mú ẹni tí a ń tọ́ka sí ṣe kedere láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: εἰς τὰς ἀγκάλας
  choice: sí apá rẹ̀
  rationale: ἀγκάλαι túmọ̀ sí apá tí a fi ń gbá tàbí gbé ọmọ. ‘Sí apá rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá, ó sì mú ìní tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ fún àyíká hàn.
- source_word: εὐλόγησεν τὸν θεόν
  choice: ó súre fún Ọlọ́run
  rationale: εὐλογέω nígbà tí Ọlọ́run jẹ́ ẹni tí ìṣe náà dojú kọ túmọ̀ sí sísúre fún un tàbí fífi ọ̀rọ̀ rere yin ín. ‘Súre fún Ọlọ́run’ pa àwòrán ọ̀rọ̀ ìpilẹ̀ mọ́ ju ‘yin Ọlọ́run’ lọ.
- source_word: καὶ εἶπεν
  choice: ó sì wí pé
  rationale: Èyí jẹ́ ìtẹ̀síwájú ìtàn tó rọrùn. ‘Wí pé’ bá ìforúkọsílẹ̀ mímọ́ tó ní iyì mu, ó sì ṣí ọ̀nà fún ọ̀rọ̀ tí yóò tẹ̀ lé.
- source_word: αὐτός
  choice: ó
  rationale: Arọ́pò-orúkọ náà ní ìtẹnumọ́ díẹ̀, ṣùgbọ́n fífi ‘òun fúnra rẹ̀’ ṣe é yóò mú ìtẹnumọ́ náà pọ̀ ju ti Gíríìkì lọ; ‘ó’ jẹ́ àdánidá nínú ìtàn Yorùbá.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ akọ́-abo àárín αὐτό ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìtọ́ka sí ọmọ Jésù, nípa lílo ‘ọmọ náà.’
  alternative: Lílo arọ́pò-orúkọ aláìlẹ́ni ní títẹ̀lé akọ́-abo gírámà Gíríìkì ní tààràtà.
  rationale: Akọ́-abo gírámà arọ́pò-orúkọ náà tẹ̀lé ọ̀rọ̀ fún ‘ọmọ,’ ṣùgbọ́n ẹni tí a ń tọ́ka sí ni Jésù. ‘Ọmọ náà’ mú ìtọ́ka ti ìtàn ṣe kedere láìgbọ́dọ̀ yanjú ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ kankan tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘wí pé’ fún ìforúkọsílẹ̀ Bíbélì tó bójú mu, láìsọ ọ̀rọ̀ di àtijọ́ tàbí líle.
