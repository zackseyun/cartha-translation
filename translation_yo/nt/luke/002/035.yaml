id: LUK.2.35
reference: Luke 2:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: yo
  text: Àti ìwọ fúnra rẹ náà, idà yóò gba inú ọkàn rẹ kọjá[b][a], kí àwọn èrò inú ọkàn ọ̀pọ̀ ènìyàn lè fara hàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò gún inú ọkàn rẹ.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní pàtàkì sí “gba inú kọjá,” ṣùgbọ́n àwòrán idà fúnra rẹ ń fi gígún hàn.
    reason: lexical_alternative
  - marker: b
    text: A sábà máa ń lóye “idà” níhìn-ín gẹ́gẹ́ bí àpẹẹrẹ ìrora jíjinlẹ̀ tí Màríà yóò ní.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: ìwọ fúnra rẹ
  rationale: Àkójọpọ̀ arọ́pò-orúkọ náà tẹnumọ́ pé Màríà fúnra rẹ ni ọ̀rọ̀ náà kàn; yíyan yìí fi ìtẹnumọ́ náà hàn ní Yorùbá àdánidá.
- source_word: ψυχή
  choice: inú ọkàn
  rationale: Níhìn-ín, ψυχή tọ́ka sí ẹni inú àti ibi tí ìrora jíjinlẹ̀ ti ń ṣẹlẹ̀, kì í ṣe ẹ̀mí gẹ́gẹ́ bí ohun tó yà sọ́tọ̀ tàbí ìyè ara nìkan. “Inú ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àwòrán yìí.
- source_word: διελεύσεται
  choice: yóò ... gba ... kọjá
  rationale: Èyí tẹ̀lé ìtumọ̀ pàtàkì ọ̀rọ̀ Gíríìkì náà, “kọjá gba inú,” láì fi ìtumọ̀ àlàyé “gún” sí inú ẹsẹ̀.
- source_word: ῥομφαία
  choice: idà
  rationale: Bí ó tilẹ̀ jẹ́ pé ῥομφαία lè túmọ̀ sí idà ńlá, “idà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì tó fún àwòrán àsọtẹ́lẹ̀ yìí.
- source_word: ὅπως ἂν
  choice: kí ... lè
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a ń retí hàn, ó sì pa ìsopọ̀ pẹ̀lú gbólóhùn tó ṣáájú mọ́.
- source_word: ἀποκαλυφθῶσιν
  choice: lè fara hàn
  rationale: “Fara hàn” fi ìṣípayá ohun tó ti wà ní ìkọ̀kọ̀ hàn, ó sì bá fọ́ọ̀mù aláìṣe Gíríìkì mu ní Yorùbá àdánidá.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: inú ọkàn ọ̀pọ̀ ènìyàn
  rationale: ἐκ tọ́ka sí ibi tí àwọn èrò ti wá, ìyẹn láti inú ọkàn; Yorùbá nílò “ènìyàn” níhìn-ín kí gbólóhùn náà lè yéni dáadáa.
- source_word: διαλογισμοί
  choice: àwọn èrò
  rationale: Ọ̀rọ̀ yìí lè jẹ́ èrò, ìrònú, tàbí ìgbèrò inú; “àwọn èrò” gbòòrò tó láti pa àìdánilójú bóyá wọ́n dára tàbí wọ́n burú mọ́.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ náà ń bá sọ àti agbára àsọtẹ́lẹ̀ náà
  choice: A fi ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ọ̀rọ̀ tààrà sí Màríà, tó ń sọ àsọtẹ́lẹ̀ ìrora jíjinlẹ̀ tí yóò kan òun fúnra rẹ, láì sọ pàtó bí ìrora náà yóò ṣe ṣẹlẹ̀.
  alternative: Kí a sọ idà náà ní pàtó di ìbànújẹ́ Màríà nígbà tí wọ́n kàn Jésù mọ́ àgbélébùú, tàbí ìrora tí ìpín tí iṣẹ́ Jésù mú wá fà.
  rationale: Gíríìkì bá Màríà sọ tààrà, ṣùgbọ́n kò ṣàlàyé ohun pàtó tí “idà” dúró fún. Ìtumọ̀ náà nítorí náà pa àwòrán àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán; a pa àwòrán “idà” àti ìtumọ̀ gangan “kọjá gba inú” mọ́.
