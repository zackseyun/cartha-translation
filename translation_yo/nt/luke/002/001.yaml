source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ wọ̀nyẹn pé àṣẹ kan jáde láti ọ̀dọ̀ Kesari Augustu pé kí a forúkọ àwọn ènìyàn gbogbo ilẹ̀ ayé tí ènìyàn ń gbé sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ayé Róòmù,” tàbí “gbogbo ìjọba Róòmù.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń tọ́ka sí ayé tí ènìyàn ń gbé, ní pàtàkì nínú àyíká ìjọba Róòmù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀
  rationale: Ọ̀nà ìtàn yìí fi ìṣẹ̀lẹ̀ tuntun hàn, δὲ sì ń so ìtàn náà pọ̀ mọ́ ohun tó ṣáájú. ‘Ó sì ṣẹlẹ̀’ jẹ́ èdè Yorùbá àdánidá, kò sì ní ìrísí àtijọ́ tí kò pọndandan.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó pa ìtọ́kasí àsìkò inú Gíríìkì mọ́ ní ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ἐξῆλθεν δόγμα
  choice: àṣẹ kan jáde
  rationale: ‘Àṣẹ’ mú ìtumọ̀ ìlànà ọba δόγμα jáde, ‘jáde’ sì pa àwòrán pé a kéde rẹ̀ síta mọ́.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: láti ọ̀dọ̀ Kesari Augustu
  rationale: Ó fi Kesari Augustu hàn gẹ́gẹ́ bí orísun àṣẹ náà, ní ìbámu pẹ̀lú παρά pẹ̀lú ọ̀rọ̀-orúkọ oníṣe-genitive.
- source_word: ἀπογράφεσθαι
  choice: kí a forúkọ ... sílẹ̀
  rationale: Ó túmọ̀ sí fífi orúkọ ènìyàn sínú àkọsílẹ̀ ìjọba. Ìtumọ̀ yìí kò fi kún un pé kíkà ènìyàn tàbí owó-orí ni pàtó, nítorí ẹsẹ yìí fúnra rẹ̀ kò sọ bẹ́ẹ̀ ní kedere.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: gbogbo ilẹ̀ ayé tí ènìyàn ń gbé
  rationale: Ó pa ìtumọ̀ gbooro οἰκουμένη, ‘ayé tí a ń gbé,’ mọ́, láì dín un kù sí Ilẹ̀ Ọba Róòmù nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìwọ̀n ibi tí οἰκουμένη dé
  choice: gbogbo ilẹ̀ ayé tí ènìyàn ń gbé
  alternative: gbogbo ilẹ̀ ayé Róòmù; gbogbo Ilẹ̀ Ọba Róòmù
  rationale: Èyí jẹ́ ọ̀ràn ìtàn àti ìtumọ̀ ọ̀rọ̀ ju ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ lọ. Ọ̀rọ̀ pàtàkì pa ìtumọ̀ Gíríìkì gbooro mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì jẹ́ kí òǹkàwé rí ìtumọ̀ tó bá àyíká ìjọba Róòmù mu.
translation_notes:
  register: Èdè jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì lo ‘Kesari Augustu’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ-oyè àti orúkọ ẹni tó rọrùn láti mọ̀.
