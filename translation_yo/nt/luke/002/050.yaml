id: LUK.2.50
reference: Luke 2:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: yo
  text: Wọ́n kò sì lóye ọ̀rọ̀ tí ó sọ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àsọjáde,” “ọ̀rọ̀ tí a sọ,” tàbí “ọ̀ràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ní Yorùbá, “sì” so gbólóhùn yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, láìfi agbára ìtakò kún καὶ.
- source_word: αὐτοὶ
  choice: wọn
  rationale: Ó ń tọ́ka sí àwọn òbí Jésù nínú àyíká ọ̀rọ̀. Arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ṣùgbọ́n kò pọndandan láti fi ìtẹnumọ́ “àwọn fúnra wọn” kún un ní Yorùbá.
- source_word: οὐ συνῆκαν
  choice: kò lóye
  rationale: “Lóye” jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere láti sọ pé wọn kò mọ ìtumọ̀ ohun tí a sọ; kò túmọ̀ sí pé wọn kọ̀ ọ́ tàbí pé òye wọn kàn pé ní apá kan.
- source_word: τὸ ῥῆμα
  choice: ọ̀rọ̀
  rationale: ῥῆμα lè tọ́ka sí ọ̀rọ̀ tí a sọ, àsọjáde, tàbí ọ̀ràn. “Ọ̀rọ̀” jẹ́ àdánidá ní Yorùbá, ó sì pa ìwọ̀n ìtumọ̀ orísun náà mọ́.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: tí ó sọ fún wọn
  rationale: Èyí tú λαλέω gẹ́gẹ́ bí “sọ,” ó sì so gbólóhùn àlàyé náà mọ́ “ọ̀rọ̀” ní kedere àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí ìtàn ṣe ṣàpèjúwe ìdáhùn àwọn òbí Jésù
  choice: A sọ ní tààrà pé wọn kò lóye ọ̀rọ̀ Jésù.
  alternative: Wọn kò lóye rẹ̀ ní kíkún; tàbí wọn kò gba ọ̀rọ̀ náà.
  rationale: Gíríìkì sọ àìlóye, kì í ṣe òye tí kò pé tàbí kíkọ ọ̀rọ̀ náà. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ nípa ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀ mọ́ láìṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà rọrùn, ọ̀wọ̀ sì wà nínú rẹ̀. A lo “ọ̀rọ̀” láti pa ààyè ìtumọ̀ ῥῆμα mọ́, a sì fi àmì àlàyé [a] hàn nínú ọ̀rọ̀ pàtàkì.
