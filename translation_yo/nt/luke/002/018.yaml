source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: yo
  text: Gbogbo àwọn tí ó gbọ́ ọ̀rọ̀ náà sì ṣe kàyéfì nípa ohun tí àwọn olùṣọ́ àgùntàn sọ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnu yà wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Gbogbo àwọn tí ó gbọ́ ọ̀rọ̀ náà
  rationale: Àpólà alábápín ọ̀rọ̀ náà túmọ̀ sí gbogbo àwọn tó gbọ́; ‘ọ̀rọ̀ náà’ jẹ́ àfikún tí àyíká ọ̀rọ̀ ń béèrè fún ní Yorùbá, ó sì tọ́ka sí ìròyìn àwọn olùṣọ́ àgùntàn.
- source_word: ἐθαύμασαν
  choice: ṣe kàyéfì
  rationale: Ó sọ ìyàlẹ́nu àti ìyanilẹ́nu ọkàn láìfi hàn bóyá ìhùwàsí náà di ìgbàgbọ́ tàbí àìgbàgbọ́.
- source_word: περὶ τῶν λαληθέντων
  choice: nípa ohun tí ... sọ
  rationale: ‘Nípa’ pa agbára περί mọ́ gẹ́gẹ́ bí ohun tí ìyàlẹ́nu wọn dá lé; àtúmọ̀ yìí sì mú àkóónú ohun tí a sọ ṣe kedere.
- source_word: ὑπὸ τῶν ποιμένων
  choice: tí àwọn olùṣọ́ àgùntàn sọ
  rationale: Ìṣètò gbolohun Yorùbá yìí sọ àwọn olùṣọ́ àgùntàn di aṣojú iṣẹ́ náà ní kedere, bó ṣe rí nínú ὑπό pẹ̀lú ọ̀rọ̀ àfihàn olùṣe.
- source_word: πρὸς αὐτούς
  choice: fún wọn
  rationale: Ó pa ìtọ́sọ́nà ọ̀rọ̀ sí àwọn olùgbọ́ mọ́ láìsọ àwọn ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Irú ìhùwàsí tí ἐθαύμασαν ń ṣàpèjúwe
  choice: Ìyàlẹ́nu ni ẹsẹ náà ròyìn, láìsọ pé ó jẹ́ ìgbàgbọ́ ìgbàlà tàbí àìgbàgbọ́.
  alternative: Kí a túmọ̀ ọ́ bí ìdáhùn rere nínú ìgbàgbọ́, tàbí bí ìfẹ́ láti mọ̀ lásán.
  rationale: θαυμάζω sọ ìhùwàsí ìyàlẹ́nu; ẹsẹ náà kò sọ ohun tí ìyàlẹ́nu náà yọrí sí, nítorí náà a pa ààyè ìtumọ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ṣe kàyéfì’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìyàlẹ́nu jinlẹ̀, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé fúnni ní àṣàyàn ‘ẹnu yà wọ́n.’
