  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Gbogbo àwọn tí ó gbọ́” ń mú πάντες οἱ ἀκούσαντες wá; “ṣe kàyéfì” ń ṣàfihàn ἐθαύμασαν láìfi ìgbàgbọ́ tàbí àìgbàgbọ́ kún un; “nípa ohun tí àwọn olùṣọ́ àgùntàn sọ fún wọn” ń gbé περι τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς kalẹ̀ ní kedere. Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àfọwọ́ṣe passive, ìṣètò active Yorùbá náà pa olùṣe, àkóónú, àti àwọn olùgbọ́ mọ́.'
