id: LUK.2.25
reference: Luke 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: yo
  text: Sì wò ó, ọkùnrin kan wà ní Jerusalẹmu, orúkọ rẹ̀ sì ni Simeoni. Ọkùnrin yìí jẹ́ olódodo àti olùfọkànsìn; ó ń retí ìtùnú Israẹli[a], Ẹ̀mí Mímọ́ sì wà lórí rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtùnú fún Israẹli.” Gbólóhùn náà ń tọ́ka sí ìtùnú àtọ̀runwá àti ìmúpadàbọ̀sípò tí Israẹli ń retí.
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé ṣe kí a túmọ̀ rẹ̀ sí, “ẹ̀mí mímọ́ kan wà lórí rẹ̀”; ṣùgbọ́n nínú àyíká ọ̀rọ̀ Lúùkù, ó ṣeé ṣe jù lọ pé Ẹ̀mí Mímọ́ ni ó ń tọ́ka sí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa iṣẹ́ ọ̀rọ̀ yìí mọ́ gẹ́gẹ́ bí àmì ìtàn tí ń fa àfiyèsí sí ẹni tuntun tó ṣe pàtàkì, láì lo ọ̀rọ̀ àtijọ́ tí kò rọrùn fún òǹkàwé òde òní.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ẹni tí a ń tọ́ka sí jẹ́ ọkùnrin kan pàtó, Simeoni; ‘ọkùnrin’ bá ìtumọ̀ àti àyíká mu.
- source_word: ᾧ ὄνομα Συμεών
  choice: orúkọ rẹ̀ sì ni Simeoni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánimọ̀ ẹni náà, ó sì pa agbára gbólóhùn Gíríìkì mọ́.
- source_word: δίκαιος
  choice: olódodo
  rationale: ‘Olódodo’ ní ìtumọ̀ ìwà rere àti ìbáṣepọ̀ tó tọ́ níwájú Ọlọ́run, bí ọ̀rọ̀ Gíríìkì ṣe ní níbí.
- source_word: εὐλαβής
  choice: olùfọkànsìn
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe ẹni tó ní ọ̀wọ̀ jíjinlẹ̀ fún Ọlọ́run, tó sì fara balẹ̀ nínú ìjọsìn; ‘olùfọkànsìn’ jẹ́ kúkúrú, ó sì yẹ fún èdè ọ̀wọ̀.
- source_word: προσδεχόμενος
  choice: ó ń retí
  rationale: Àmì ‘ń’ fi ìretí tó ń bá a lọ hàn, kì í ṣe dídúró lásán.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: ìtùnú Israẹli
  rationale: ‘Ìtùnú’ gba ìtumọ̀ ìtùnú, ìrànlọ́wọ́ àti ìmúpadàbọ̀sípò tí Israẹli ń retí lọ́wọ́ Ọlọ́run; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ọlọ́rọ̀ náà hàn.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé àrótọ́ pàtó kò sí nínú Gíríìkì, lílo Lúùkù àti àyíká ẹsẹ̀ 26–27 tọ́ka sí Ẹ̀mí Mímọ́; èdè Yorùbá kò nílò àrótọ́ bí ti Gẹ̀ẹ́sì.
- source_word: ἐπ’ αὐτόν
  choice: wà lórí rẹ̀
  rationale: Èyí pa àwòrán ìwàníhìn-ín àti iṣẹ́ agbára Ẹ̀mí ‘lórí’ ẹni náà mọ́ láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ẹni tàbí ohun tí πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ sì wà lórí rẹ̀
  alternative: ẹ̀mí mímọ́ kan wà lórí rẹ̀
  rationale: Nínú ìlò Lúùkù àti àyíká lẹ́sẹ̀kẹsẹ̀, pàápàá ẹsẹ̀ 26–27, gbólóhùn náà tọ́ka lọ́nà tó ṣeé ṣe jù sí Ẹ̀mí Mímọ́. Àlàyé ìsàlẹ̀ ṣì jẹ́wọ́ àìdájú gírámà tó wà nítorí àìsí àrótọ́.
- issue: Ìtumọ̀ παράκλησις ní ìrètí Israẹli
  choice: ìtùnú Israẹli
  alternative: ìmúpadàbọ̀sípò Israẹli
  rationale: ‘Ìtùnú’ sun mọ́ ìtumọ̀ ọ̀rọ̀ náà, ó sì lè gbé ìrètí ìtùnú àti ìmúpadàbọ̀sípò láti ọ̀dọ̀ Ọlọ́run pọ̀, láì dín un kù sí èrò ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. ‘Sì kíyèsí i’ pa àmì àfiyèsí ìtàn mọ́; ‘olùfọkànsìn’ yẹra fún gígùn àlàyé nínú ẹsẹ̀. A fi àmì ohùn sí ibi tí ó yẹ, a sì gbé àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
