revisions:
- from: Áńgẹ́lì náà sì wí fún wọn pé, “Ẹ má bẹ̀rù, nítorí, kíyèsí i, mo mú ìhìn rere ayọ̀ ńlá wá fún yín, èyí tí yóò jẹ́ ti gbogbo àwọn ènìyàn náà[a].”
  to: Áńgẹ́lì náà sì wí fún wọn pé, “Ẹ má bẹ̀rù, nítorí ẹ wò ó, mo mú ìhìn rere ayọ̀ ńlá wá fún yín, èyí tí yóò jẹ́ fún gbogbo ènìyàn náà.”
  rationale: A fi «fún» sílẹ̀ ní ibi «ti» kí ìbáṣepọ̀ tó wà nínú ọ̀rọ̀ Gíríìkì má bàa yí. A tún ṣe ἰδού sí «ẹ wò ó» fún Yorùbá tó rọrùn àti tó ní agbára ìkéde. Àmì ẹsẹ̀ [a] ni a yọ kúrò nínú ọ̀rọ̀ àkọ́kọ́ nítorí ìwọ̀n ìtumọ̀ pàtó náà ni a ti tẹ̀lé nínú ìtumọ̀; ẹsẹ̀-àlàyé yìí ṣì wà gẹ́gẹ́ bí àlàyé aṣàyàn ìtumọ̀.
