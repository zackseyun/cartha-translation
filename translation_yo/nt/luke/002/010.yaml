id: LUK.2.10
reference: Luke 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: yo
  text: Áńgẹ́lì náà sì wí fún wọn pé, “Ẹ má bẹ̀rù, nítorí ẹ wò ó, mo mú ìhìn rere ayọ̀ ńlá wá fún yín, èyí tí yóò jẹ́ fún gbogbo ènìyàn náà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: Áńgẹ́lì náà
  rationale: Ọ̀rọ̀ atọ́ka náà tọ́ka padà sí áńgẹ́lì tí a ti mẹ́nu kàn tẹ́lẹ̀, nítorí náà “náà” mú ìtumọ̀ pàtó yẹn hàn.
- source_word: Μὴ φοβεῖσθε
  choice: Ẹ má bẹ̀rù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti tọwọ́tọwọ́ láti sọ ìkìlọ̀ fún ọ̀pọ̀ ènìyàn pé kí wọ́n má ṣe bẹ̀rù.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa agbára àmì-ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì bá ìforúkọsílẹ̀ ọlọ́lá mu.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi ìdí tí kò fi yẹ kí àwọn olùṣọ́-àgùntàn bẹ̀rù hàn.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: mo mú ìhìn rere ... wá fún yín
  rationale: Ó sọ ìkéde ìròyìn rere ní Yorùbá àdánidá, ó sì pa ὑμῖν mọ́ gẹ́gẹ́ bí “fún yín,” láì fi ìtumọ̀ ẹ̀kọ́ ìsìn àfikún sí i.
- source_word: χαρὰν μεγάλην
  choice: ayọ̀ ńlá
  rationale: Ó ṣe àfihàn ìwọ̀n ayọ̀ náà ní kedere, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn.
- source_word: ἥτις ἔσται
  choice: èyí tí yóò jẹ́
  rationale: Ó so gbólóhùn ìbátan náà mọ́ “ayọ̀ ńlá” láì mú ìtumọ̀ rẹ̀ le ju bó ṣe wà lọ.
- source_word: παντὶ τῷ λαῷ
  choice: ti gbogbo àwọn ènìyàn náà
  rationale: “Àwọn ènìyàn náà” pa ìtójú ọ̀rọ̀ atọ́ka Gíríìkì mọ́, ó sì lè tọ́ka sí àwọn ènìyàn pàtó nínú àyíká ìtàn náà; “gbogbo” ṣe àfihàn παντί.
theological_decisions:
- issue: Ìwọ̀n àwọn tí παντὶ τῷ λαῷ ń tọ́ka sí
  choice: ti gbogbo àwọn ènìyàn náà
  alternative: fún gbogbo ènìyàn
  rationale: Ọ̀rọ̀ atọ́ka tó wà pẹ̀lú λαός lè tọ́ka sí àwọn ènìyàn pàtó—ó ṣeé ṣe kí ó jẹ́ Ísírẹ́lì nínú àyíká ìtàn yìí. Ìtumọ̀ yìí kò fi tipátipá sọ pé gbogbo aráyé ni ẹsẹ̀ yìí fúnra rẹ̀ ń tọ́ka sí, bẹ́ẹ̀ ni kò sì tako ìtẹ̀sí ìgbàlà fún àwọn orílẹ̀-èdè ní ibòmíràn nínú Lúùkù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A pa àmì ohùn mọ́ níbi tó yẹ; “kíyèsí i” dá ohùn ìkéde ἰδού dúró, “Ẹ má bẹ̀rù” sì jẹ́ ọ̀nà ọ̀rọ̀ àdánidá fún ọ̀pọ̀ olùgbọ́.
