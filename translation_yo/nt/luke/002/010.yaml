  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí áńgẹ́lì tí a ti mẹ́nu kàn, ìkìlọ̀ náà, ìròyìn rere, ayọ̀ ńlá, àti ìtumọ̀ pàtó tí παντὶ τῷ λαῷ lè ní. Síbẹ̀, ìtumọ̀ ìbáṣepọ̀ «èyí tí yóò jẹ́ ti gbogbo àwọn ènìyàn náà» yí «fún» (εἰς/for in sense) padà sí «ti» (‘belonging to’), nítorí náà a nílò àtúnṣe.
  naturalness: «Nítorí, kíyèsí i» kò rọrùn gẹ́gẹ́ bí àmì ìfẹ́nu-sí-ọ̀rọ̀ nínú Yorùbá. «Nítorí ẹ wò ó» jẹ́ ọ̀nà kedere, tó ní ìwọ̀n ìkéde, láti ṣàfihàn ἰδού. A tún tún ìpín gbolohun náà ṣe kí «fún gbogbo ènìyàn náà» lè so mọ́ ayọ̀ náà ní ti ẹ̀dá Yorùbá.
  terminology: «Áńgẹ́lì náà», «Ẹ má bẹ̀rù», «ìhìn rere», àti «ayọ̀ ńlá» bá ọ̀rọ̀ ìpilẹ̀ mu, wọ́n sì bójú mu ní Yorùbá boṣewa. «Gbogbo ènìyàn náà» ń pa ìtumọ̀ definite ti τῷ λαῷ mọ́ láì sọ ìdánimọ̀ ẹgbẹ́ náà di ohun tí ẹsẹ̀ yìí kò sọ ní tààrà.
