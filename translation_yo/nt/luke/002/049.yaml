id: LUK.2.49
reference: Luke 2:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Èé ṣe tí ẹ fi ń wá mi? Ẹ kò ha mọ̀ pé mo gbọ́dọ̀ wà ní ilé Bàbá mi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo gbọ́dọ̀ wà nínú ohun tí í ṣe ti Bàbá mi,” tàbí, “nínú ọ̀ràn Bàbá mi.” Gbólóhùn Gíríìkì náà kò parí ní kíkún, ó sì lè tọ́ka sí ilé Bàbá mi tàbí sí àwọn ohun àti ọ̀ràn Bàbá mi.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Èé ṣe tí
  rationale: Ọ̀rọ̀ Gíríìkì yìí béèrè ìdí tàbí ohun tó fà á. ‘Èé ṣe tí’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìbéèrè náà mọ́.
- source_word: ἐζητεῖτέ
  choice: ẹ fi ń wá mi
  rationale: ζητέω níbí túmọ̀ sí wíwá ẹni tí a kò rí; ìṣe tí ó ń lọ ní àkókò náà ni ‘ń wá’ fi hàn.
- source_word: οὐκ ᾔδειτε
  choice: Ẹ kò ha mọ̀
  rationale: Èyí túmọ̀ οἶδα ní tààrà, ‘ha’ sì pa ìrísí ìbéèrè àsọyé náà mọ́ ní èdè Yorùbá tó níyì.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: ní ilé Bàbá mi
  rationale: Gbólóhùn Gíríìkì náà kò parí ní kíkún, ṣùgbọ́n bí wọ́n ṣe rí Jésù nínú tẹ́ńpìlì mú kí ‘ní ilé Bàbá mi’ bá àyíká ọ̀rọ̀ mu jù. Àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- source_word: δεῖ
  choice: mo gbọ́dọ̀
  rationale: δεῖ ń sọ nípa ohun tí ó pọndandan; ‘gbọ́dọ̀’ pa ìwúwo dandan náà mọ́.
- source_word: εἶναί με
  choice: mo ... wà
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá fún infinitive Gíríìkì pẹ̀lú ẹni tó jẹ́ olùṣe rẹ̀ lẹ́yìn δεῖ.
- source_word: πατρός μου
  choice: Bàbá mi
  rationale: Jésù ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Bàbá rẹ̀; lílo lẹ́tà ńlá pa ìtọ́kasí pàtàkì yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Àìṣe kedere pátápátá nínú ἐν τοῖς τοῦ πατρός μου
  choice: ní ilé Bàbá mi
  alternative: nínú àwọn ohun ti Bàbá mi / nípa iṣẹ́ Bàbá mi
  rationale: Àyíká tẹ́ńpìlì ṣe ìtìlẹ́yìn fún ‘ilé,’ ṣùgbọ́n Gíríìkì náà tún lè tọ́ka sí àwọn ohun, iṣẹ́, tàbí ọ̀ràn Bàbá. Àlàyé ìsàlẹ̀ kò jẹ́ kí ìtumọ̀ mìíràn yìí sọnù.
- issue: Ẹni tí ‘Bàbá mi’ ń tọ́ka sí
  choice: Ọlọ́run gẹ́gẹ́ bí Bàbá Jésù
  alternative: Jósẹ́fù gẹ́gẹ́ bí baba rẹ̀ ní ayé
  rationale: Àyíká tẹ́ńpìlì àti ìyàtọ̀ tí ọ̀rọ̀ Jésù dá sí ìbéèrè Màríà fi hàn pé Ọlọ́run ni ó ń pè ní Bàbá rẹ̀. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. ‘Ẹ kò ha mọ̀’ jẹ́ ìbéèrè àsọyé tó yẹ fún ọ̀rọ̀ mímọ́ láìdi èdè àtijọ́; àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
