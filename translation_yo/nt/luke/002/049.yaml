  terminology: ‘Bàbá mi’ pẹ̀lú lẹ́tà ńlá, ‘gbọ́dọ̀,’ àti ‘ilé’ bójú mu. Àtúnṣe àlàyé ìsàlẹ̀ nìkan ni a nílò, kí ó má ṣe sọ àṣàyàn ‘iṣẹ́ Bàbá mi’ di ìṣe tí Jésù gbọdọ̀ ṣe, níbi tí Gíríìkì ti sọ pé ó gbọdọ̀ wà ‘nínú’ ohun tí í ṣe ti Bàbá rẹ̀.
