  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: yo
  text: Ẹnu sì ya gbogbo àwọn tí ń gbọ́ ọ́ sí òye rẹ̀ àti àwọn ìdáhùn rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnu sì ya wọ́n gidigidi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìyàlẹ́nu líle hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Ẹnu sì ya
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti fi ìyàlẹ́nu líle hàn, ó sì bá ìṣe tí ń lọ lọ́wọ́ nínú fọ́ọ̀mù imperfect mu láìlo ọ̀rọ̀ tí yóò túmọ̀ sí pé wọn pàdánù ìṣàkóso ara wọn.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; “sì” bá ìṣàn ìtàn Yorùbá mu láìfi ìtakora tí kò sí sínú ẹsẹ náà.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: gbogbo àwọn tí ń gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Èyí pa ìtumọ̀ gbogbo ẹni tó wà ní ipò gbígbọ́ mọ́. Fífi “ọ̀rọ̀” kún un jẹ́ Yorùbá àdánidá fún gbígbọ́ ẹni ní irú àyíká ìjíròrò yìí.
- source_word: ἐπὶ
  choice: sí
  rationale: Pẹ̀lú “ẹnu ya,” “sí” ni àfihàn Yorùbá àdánidá fún ohun tó fa ìyàlẹ́nu.
- source_word: συνέσει
  choice: òye
  rationale: “Òye” fi agbára láti lóye àti ìjìnlẹ̀ ìmọ̀ hàn ní kedere, láìdín ọ̀rọ̀ náà kù sí òye-orí lasan.
- source_word: ἀποκρίσεσιν
  choice: àwọn ìdáhùn
  rationale: “Àwọn ìdáhùn” bá púpọ̀ ọ̀rọ̀ Gíríìkì mu, ó sì yẹ fún ìjíròrò tí ẹsẹ tó ṣáájú ṣàpèjúwe.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Jésù; “rẹ̀” ni fọ́ọ̀mù ohun-ìní Yorùbá tó bá àwọn ibi méjèèjì mu.
theological_decisions: []
