  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìtumọ̀ náà pa agbára ìyàlẹ́nu àti ìṣàn ìtàn mọ́.
