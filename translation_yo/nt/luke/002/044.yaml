  source_fidelity: Ìtumọ̀ náà ń fi gbogbo àwọn èrò pàtàkì Gíríìkì hàn. Ṣùgbọ́n “nítorí wọ́n rò pé” yí àkójọpọ̀ νομίσαντες sí ìdí pàtó (“because”), níbi tí ọrọ̀ Gíríìkì ti ń ṣàpèjúwe ohun tí wọ́n rò nígbà tí wọ́n ń rìn. “Wọ́n sì ń wá a” ń ṣàfihàn imperfect ἀνεζήτουν dáadáa láìfi ìbẹ̀rẹ̀ ìṣe tí kò dájú kún un.
  naturalness: 'Àtúnṣe náà lo Yorùbá ìgbàlódé tó rọrùn àti tó bọ́gbọ́n mu: “nínú ẹgbẹ́ àwọn arìnrìn-àjò,” “wọ́n rìn ọ̀nà ọjọ́ kan,” àti “àwọn ojúlùmọ̀ wọn.” Àmì ohùn ti wà níbi tó yẹ.'
  terminology: “Ẹgbẹ́ àwọn arìnrìn-àjò” jẹ́ ìtumọ̀ kedere fún συνοδία, láìfi ìtumọ̀ ẹlẹ́sìn tàbí àṣà kan kún un. “Ìbátan” àti “ojúlùmọ̀” ń pa ìyàtọ̀ tó wà láàárín συγγενεῖς àti γνωστοί mọ́.
  issues:
