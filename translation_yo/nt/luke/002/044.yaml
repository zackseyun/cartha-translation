translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé lásán ni a lò. A yan gbólóhùn àlàyé fún συνοδία dípò ọ̀rọ̀ àjèjì, a sì fi gbogbo àmì ohùn sí ibi tó yẹ.
