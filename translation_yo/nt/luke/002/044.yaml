source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n rò pé ó wà nínú ẹgbẹ́ àwọn arìnrìn-àjò,[a] wọ́n rìn ọ̀nà ọjọ́ kan, wọ́n sì ń wá a[b] láàárín àwọn ìbátan àti àwọn ojúlùmọ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú káfánà.” Ọ̀rọ̀ Gíríìkì συνοδία ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn tí wọ́n jọ ń rin ìrìn àjò.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀-ìṣe náà sí “wọ́n sì bẹ̀rẹ̀ sí í wá a.” Ọ̀rọ̀-ìṣe náà wà ní àkókò imperfect, ó sì lè tẹnu mọ́ pé ìwá náà ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: nítorí wọ́n rò pé
  rationale: Ó fi hàn pé Màríà àti Jósẹ́fù gbà pé ohun náà rí bẹ́ẹ̀ láìsí ìdánilójú; ‘wọ́n rò pé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìrò yìí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ṣe àmì ìyípadà díẹ̀ nínú ìtàn, ní ìyàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: ó wà láàárín àwọn tí wọ́n jọ ń rin ìrìn àjò
  rationale: Ìtumọ̀ yìí ṣàlàyé συνοδία gẹ́gẹ́ bí ẹgbẹ́ àwọn ènìyàn tí wọ́n jọ ń rin ìrìn àjò, ní èdè Yorùbá tó ṣe kedere.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: wọ́n rin ìrìn ọjọ́ kan
  rationale: Ó mú ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì jáde pé wọ́n rin ìjìnnà tàbí àkókò ìrìn ọjọ́ kan.
- source_word: ἀνεζήτουν
  choice: wọ́n sì bẹ̀rẹ̀ sí í wá a
  rationale: Àìpé ọ̀rọ̀-ìṣe náà lè tọ́ka sí ìbẹ̀rẹ̀ ìwá náà àti bí ó ṣe ń bá a lọ; àkọlé yìí mú ìbẹ̀rẹ̀ náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
- source_word: συγγενεῦσιν
  choice: àwọn ìbátan
  rationale: Ó tọ́ka sí àwọn ará tàbí ìbátan ní gbogbogbòò, láìfi akọ tàbí abo sí i.
- source_word: γνωστοῖς
  choice: ojúlùmọ̀
  rationale: Ó túmọ̀ sí àwọn ènìyàn tí wọ́n mọ̀, tí kò sì pọn dandan kí wọ́n jẹ́ ọ̀rẹ́ tímọ́tímọ́.
