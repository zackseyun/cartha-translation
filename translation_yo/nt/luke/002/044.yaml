    rationale: “Wọ́n sì ń wá a” ń pa ipa imperfect tí ń lọ lọwọ́ mọ́; a gbé àmì b sí lẹ́yìn rẹ̀, a sì fi “bẹ̀rẹ̀ sí í wá” sílẹ̀ gẹ́gẹ́ bí àṣàyàn nínú àlàyé.
