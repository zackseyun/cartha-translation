    issue: “nítorí wọ́n rò pé” jẹ́ ìsọ̀rọ̀ ìdí.
    rationale: νομίσαντες jẹ́ participle tó ń ṣàpèjúwe àìmọ̀/ìrò wọn, kì í ṣe ìdí tí a gbọ́dọ̀ sọ ní gbangba. A yí i sí “wọ́n rò pé ...” nínú ìtẹ̀síwájú ìtàn.
