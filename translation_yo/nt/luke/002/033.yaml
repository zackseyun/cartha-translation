source:
  edition: SBLGNT
  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: yo
  text: Bàbá rẹ̀ àti ìyá rẹ̀ sì ń ṣe kàyéfì sí àwọn ohun tí a ń sọ nípa rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì: “baba rẹ̀.” Nínú ìtàn yìí, èyí ń tọ́ka sí Jósẹ́fù gẹ́gẹ́ bí baba nínú ìdílé àti ní ojú àwùjọ. Àwọn ìtumọ̀ kan ní “Jósẹ́fù àti ìyá rẹ̀” láti má ṣe fa àìgbọ́ye nípa ìtàn Lúùkù ṣáájú nípa bí wúńdíá ṣe lóyún Jésù.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba rẹ̀
  rationale: Èyí túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààràtà gẹ́gẹ́ bí ‘baba rẹ̀,’ láì yí i padà sí ‘Jósẹ́fù.’ Nínú ìtàn náà, ó ń tọ́ka sí Jósẹ́fù ní ipò baba nínú ìdílé àti lábẹ́ òfin.
- source_word: μήτηρ
  choice: ìyá rẹ̀
  rationale: Ìtumọ̀ Yorùbá àdánidá fún μήτηρ ni ‘ìyá’; a fi ‘rẹ̀’ kún un nítorí pé àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ń sọ nípa baba àti ìyá ọmọ náà.
- source_word: θαυμάζοντες
  choice: ń ṣe kàyéfì
  rationale: Àkójọpọ̀ ἦν pẹ̀lú ọ̀rọ̀ alábápín yìí fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn. ‘Ń ṣe kàyéfì’ jẹ́ ọ̀nà Yorùbá tí ó bójú mu láti fi ìyàlẹ́nu àti ìfẹ́nu-kúnnu hàn.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: sí àwọn ohun tí a ń sọ
  rationale: 'Ó pa ìtumọ̀ ọ̀pọ̀ àti ìṣe aláìlórúkọ tí ń lọ lọ́wọ́ mọ́: ‘àwọn ohun tí a ń sọ.’ Ọ̀rọ̀ àsopọ̀ ‘sí’ bá ‘ṣe kàyéfì’ mu ní Yorùbá.'
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: ‘Nípa rẹ̀’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún περί pẹ̀lú ọ̀rọ̀ orúkọ ní genitive, ó sì pa ìtọ́kasí sí ọmọ náà mọ́.
theological_decisions:
- issue: Pípe Jósẹ́fù ní ‘baba rẹ̀’ níbi tí ìtàn Lúùkù ti fi ìbí Jésù láti ọ̀dọ̀ wúńdíá múlẹ̀
  choice: A tú ọ̀rọ̀ tí ó wà nínú Gíríìkì sí ‘baba rẹ̀,’ a sì ṣàlàyé ìtumọ̀ ìdílé àti ti òfin nínú àlàyé ìsàlẹ̀.
  alternative: ‘Jósẹ́fù àti ìyá rẹ̀’ tàbí ‘baba rẹ̀ ní ipò ìdílé/òfin’ nínú ẹsẹ̀ pàtàkì
  rationale: Gíríìkì náà sọ ‘baba rẹ̀’ ní tààràtà. Lúùkù lè lo ọ̀rọ̀ yìí fún Jósẹ́fù ní ìtumọ̀ ìbátan ìdílé àti ti òfin láì tako ìbí Jésù láti ọ̀dọ̀ wúńdíá tí ó ti sọ tẹ́lẹ̀. A kò gbọdọ̀ yanjú ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà nípa yíyí ọ̀rọ̀ orísun padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Ń ṣe kàyéfì’ jẹ́ àdánidá ju ìtumọ̀ líle lọ, ó sì pa ìṣe tí ń lọ lọ́wọ́ àti ìmọ̀lára ìyàlẹ́nu mọ́. A fi àmì ohùn sí ibi tí ó yẹ.
