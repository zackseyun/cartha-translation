  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: yo
  text: Ṣùgbọ́n Màríà ń pa gbogbo ọ̀rọ̀ wọ̀nyí mọ́[a], ó sì ń ronú jinlẹ̀ lórí wọn nínú ọkàn rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń tọ́jú gbogbo nǹkan wọ̀nyí pẹ̀lú ìṣọ́ra.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ń kó wọn jọ láti ronú lórí wọn” tàbí “ń fi wọn wéra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín ìdáhùn àwọn olùṣọ́-àgùntàn àti ìdáhùn inú ọkàn Màríà.
- source_word: συνετήρει
  choice: ń fi ... pamọ́ sínú ọkàn rẹ̀
  rationale: Àkókò imperfect fi ìṣe tí ń bá a lọ hàn; gbólóhùn yìí sì sọ pé ó ń tọ́jú àwọn ọ̀rọ̀ náà pẹ̀lú ìṣọ́ra, kì í ṣe pé ó kàn rántí wọn.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: gbogbo ọ̀rọ̀ wọ̀nyí
  rationale: ῥήματα lè túmọ̀ sí ọ̀rọ̀ tí a sọ tàbí àwọn nǹkan tí ó ṣẹlẹ̀; àyíká ibí yìí tẹnumọ́ ìròyìn àti iṣẹ́ tí àwọn olùṣọ́-àgùntàn sọ.
- source_word: συμβάλλουσα
  choice: ń ronú lórí wọn, ní fífi wọn wéra pọ̀
  rationale: Ó mú ìtumọ̀ ìrònú jinlẹ̀ àti mímú àwọn kókó jọ láti fi wéra hàn, láìsọ pé Màríà ti lóye ohun gbogbo tán.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: sínú ọkàn rẹ̀
  rationale: Ó pa àkàwé Bíbélì mọ́ fún ibi ìrònú àti ìmọ̀lára inú ènìyàn.
- source_word: Μαρία
  choice: Màríà
  rationale: Èyí ni ọ̀nà ìkọ orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
theological_decisions:
- issue: Irú ìdáhùn Màríà
  choice: Màríà ń tọ́jú àwọn ọ̀rọ̀ náà, ó sì ń ronú jinlẹ̀ nípa wọn.
  alternative: Màríà kàn rántí àwọn ìṣẹ̀lẹ̀ náà, tàbí ó ti lóye gbogbo wọn ní kíkún.
  rationale: Àwọn ọ̀rọ̀ Gíríìkì fi ìtọ́jú àti ìrònú hàn, ṣùgbọ́n wọn kò sọ pé òye rẹ̀ ti pé ní àkókò náà.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àkàwé “ọkàn” mọ́, a sì lo ìṣàfihàn ìṣe tí ń bá a lọ fún imperfect àti participle.
