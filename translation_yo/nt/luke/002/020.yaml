id: LUK.2.20
reference: Luke 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: yo
  text: Àwọn olùṣọ́-àgùntàn náà sì padà, wọ́n ń yin Ọlọ́run lógo, wọ́n sì ń yìn ín fún gbogbo ohun tí wọ́n ti gbọ́, tí wọ́n sì ti rí, gẹ́gẹ́ bí a ti sọ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “gẹ́gẹ́ bí a ti sọ̀rọ̀ sí wọn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: padà
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n padà sí ibi tàbí iṣẹ́ tí wọ́n ti wá; “padà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì bá ìtàn náà mu.
- source_word: οἱ ποιμένες
  choice: àwọn olùṣọ́-àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ọkùnrin tó ń ṣọ́ agbo àgùntàn nínú àyíká ìtàn yìí.
- source_word: δοξάζοντες
  choice: wọ́n ń yin Ọlọ́run lógo
  rationale: Ó pa ìtumọ̀ fífi ògo fún Ọlọ́run mọ́, ó sì fi ìṣe tó ń bá ìpadà wọn lọ hàn.
- source_word: αἰνοῦντες
  choice: wọ́n sì ń yìn ín
  rationale: Ó pa ọ̀rọ̀ kejì tí ó túmọ̀ sí yíyin mọ́ láì da a pọ̀ mọ́ δοξάζοντες.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: Ọlọ́run ni olùgbà ìyìn àti ògo nínú gbolóhùn náà.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: fún gbogbo ohun tí
  rationale: “Fún” fi ìdí tàbí ohun tó fa ìyìn náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἤκουσαν καὶ εἶδον
  choice: wọ́n ti gbọ́, tí wọ́n sì ti rí
  rationale: Àmì “ti” mú kí ó ṣe kedere pé gbígbọ́ àti rírí náà ti ṣẹlẹ̀ ṣáájú ìpadà àti yíyin wọn, láì yí ìtumọ̀ àwọn aorist padà.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: gẹ́gẹ́ bí a ti sọ fún wọn
  rationale: Ó pa àfiwé καθώς àti ìṣe aláìdárúkọ olùṣe nínú passive ἐλαλήθη mọ́; kò fi áńgẹ́lì kún gẹ́gẹ́ bí olùsọ̀rọ̀ níbi tí ẹsẹ náà kò ti dárúkọ rẹ̀.
theological_decisions:
- issue: Bóyá kí a dárúkọ áńgẹ́lì gẹ́gẹ́ bí ẹni tó sọ ohun náà fún wọn
  choice: gẹ́gẹ́ bí a ti sọ fún wọn
  alternative: gẹ́gẹ́ bí áńgẹ́lì ti sọ fún wọn
  rationale: Gíríìkì fi olùṣe ìsọ̀rọ̀ sílẹ̀ láìdárúkọ, bí ó tilẹ̀ jẹ́ pé àyíká ìtàn tọ́ka sí ọ̀rọ̀ áńgẹ́lì. Ìtumọ̀ náà pa àìdárúkọ yẹn mọ́, kò sì fi àlàyé tí ẹsẹ náà kò sọ ní tààrà kún un.
- issue: Ìbáṣepọ̀ gbolóhùn ìkẹyìn pẹ̀lú ohun tí wọ́n gbọ́ tí wọ́n sì rí
  choice: Fi sílẹ̀ ní òpin gẹ́gẹ́ bí gbolóhùn àfiwé tó kan gbogbo ohun tí wọ́n gbọ́ tí wọ́n sì rí
  alternative: So ó mọ́ ohun tí wọ́n rí nìkan
  rationale: Ìtòlẹ́sẹẹsẹ Gíríìkì lè jẹ́ kí gbolóhùn náà tọ́ka sí gbogbo àkójọpọ̀ ohun tí wọ́n gbọ́ tí wọ́n sì rí; fífi sí òpin pa ìbáṣepọ̀ gbígbòòrò yìí mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ohùn náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé lásán. A lo ìtòlẹ́sẹẹsẹ “wọ́n ń ... wọ́n sì ń ...” láti mú àwọn participle méjèèjì yé kedere gẹ́gẹ́ bí ìṣe tó ń bá ìpadà wọn lọ.
