  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: yo
  text: Ìforúkọsílẹ̀ yìí kọ́kọ́ wáyé nígbà tí Kíréníùsì ń ṣàkóso Síríà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìforúkọsílẹ̀ yìí wáyé ṣáájú ìgbà tí Kíréníùsì ń ṣàkóso Síríà.” Àwọn kan ń túmọ̀ πρώτη níbí gẹ́gẹ́ bí ọ̀rọ̀ afíwéra tó ń tọ́ka sí àkókò.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìkànìyàn” dípò “ìforúkọsílẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìforúkọsílẹ̀ ìjọba, èyí tí ó sábà máa ń ní í ṣe pẹ̀lú owó orí.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ìforúkọsílẹ̀ tí ẹsẹ tó ṣáájú mẹ́nu kàn; ‘yìí’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀπογραφὴ
  choice: ìforúkọsílẹ̀
  rationale: Ó túmọ̀ sí fífi orúkọ àwọn ènìyàn sílẹ̀ lọ́nà ìjọba, ní ọ̀pọ̀ ìgbà fún kíkà ènìyàn tàbí owó orí; ‘ìforúkọsílẹ̀’ kò fi ìtumọ̀ tóóró kan lé e lórí.
- source_word: πρώτη
  choice: kọ́kọ́
  rationale: Èyí pa ìtumọ̀ àkọ́kọ́ tàbí ‘first’ mọ́, ó sì bá ἐγένετο mu lọ́nà àdánidá.
- source_word: ἐγένετο
  choice: wáyé
  rationale: ‘Wáyé’ jẹ́ ìtumọ̀ Yorùbá tó bójú mu fún ohun kan tí ó ṣẹlẹ̀ tàbí bẹ̀rẹ̀ sí í ṣẹlẹ̀.
- source_word: ἡγεμονεύοντος
  choice: nígbà tí ... ń ṣàkóso
  rationale: Ó pa agbára gbólóhùn genitive absolute mọ́ gẹ́gẹ́ bí àyíká àkókò, láìfi oyè ìjọba pàtó kan kún ọrọ̀ Gíríìkì.
- source_word: τῆς Συρίας
  choice: Siria
  rationale: Orúkọ agbègbè náà ní ìkọ̀wé Yorùbá tó wọ́pọ̀.
- source_word: Κυρηνίου
  choice: Kuiriniu
  rationale: Ìkọ̀wé orúkọ Κυρήνιος ní ìbámu pẹ̀lú ìró àti àṣà ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πρώτη nínú gbólóhùn tí ìtàn àti ìṣọ̀kan èdè rẹ̀ jẹ́ àríyànjiyàn
  choice: A túmọ̀ πρώτη sí ‘kọ́kọ́’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Ìforúkọsílẹ̀ yìí wáyé ṣáájú ìgbà tí Kuiriniu ń ṣàkóso Siria.’
  rationale: Ìtumọ̀ ordinal ni ìtumọ̀ tó taara jù lọ, ṣùgbọ́n a pa ìtumọ̀ àkókò afíwéra ‘ṣáájú’ mọ́ sínú àlàyé ìsàlẹ̀ nítorí àríyànjiyàn lórí ìṣọ̀kan àti ìtàn.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ń ṣàkóso’ dípò fífi oyè ‘gómìnà’ kún un, kí ìtumọ̀ ọ̀rọ̀ Gíríìkì má bà a di pàtó ju bó ṣe rí lọ.
