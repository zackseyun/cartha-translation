id: LUK.2.40
reference: Luke 2:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: yo
  text: Ọmọ náà sì ń dàgbà, ó sì ń lágbára, ó ń kún fún ọgbọ́n; ojúrere Ọlọ́run[a] sì wà lórí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oore-ọ̀fẹ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Ọmọ náà sì
  rationale: “Ọmọ” bá παιδίον mu ní àyíká ọ̀rọ̀ ìgbà èwe yìí; “sì” fi ìsopọ̀ onírẹ̀lẹ̀ ti δέ hàn ní ìtàn Yorùbá àdánidá.
- source_word: ηὔξανεν
  choice: ń dàgbà
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń tọ́ka sí ìdàgbàsókè tí ń bá a lọ; “ń dàgbà” mú ìtẹ̀síwájú yẹn jáde kedere.
- source_word: ἐκραταιοῦτο
  choice: ń lágbára
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ṣàpèjúwe líle tàbí agbára tí ń pọ̀ sí i; gbolohun yìí jẹ́ èdè Yorùbá àdánidá fún ìdàgbàsókè ọmọ.
- source_word: πληρούμενον σοφίᾳ
  choice: ó ń kún fún ọgbọ́n
  rationale: Ó pa ìtumọ̀ ohun tí ó ń bá ìdàgbàsókè ọmọ náà lọ mọ́, ó sì ka σοφίᾳ sí ohun tí ó kún inú rẹ̀.
- source_word: χάρις θεοῦ
  choice: ojúrere Ọlọ́run
  rationale: Nínú àpèjúwe ìtàn yìí, “ojúrere” sọ ìfẹ́ rere àti ojú rere Ọlọ́run di mímọ̀ ní èdè òde òní, láìpa àṣàyàn “oore-ọ̀fẹ́” rẹ́.
- source_word: ἦν ἐπ’ αὐτό
  choice: sì wà lórí rẹ̀
  rationale: Èyí pa àwòrán orísun mọ́ pé ojúrere Ọlọ́run wà lórí ọmọ náà, ó sì jẹ́ gbolohun Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ χάρις θεοῦ ní àyíká ìdàgbàsókè Kristi
  choice: ojúrere Ọlọ́run
  alternative: oore-ọ̀fẹ́ Ọlọ́run
  rationale: “Ojúrere” fi ìfẹ́ rere àti ìtẹ́wọ́gbà Ọlọ́run hàn láìdá sí ìtumọ̀ pé àìpé kan wà nínú ìwà àtọ̀runwá Ọmọ; síbẹ̀, “oore-ọ̀fẹ́” jẹ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì tó bófin mu, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe déédé fún àwọn òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ ti ẹ̀dá, a sì lo ìṣẹ̀lẹ̀ “ń” láti fi ipa ọ̀rọ̀-ìṣe aláìpé inú Gíríìkì hàn.
