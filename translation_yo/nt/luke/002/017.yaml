id: LUK.2.17
reference: Luke 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: yo
  text: Nígbà tí wọ́n sì rí i, wọ́n sọ ìhìn[a] tí a ti sọ fún wọn nípa ọmọ yìí di mímọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀” tàbí “àsọyé” tí a ti sọ fún wọn nípa ọmọ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí wọ́n rí i
  rationale: Aorist participle náà ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì. “Nígbà tí wọ́n rí i” jẹ́ èdè Yorùbá àdánidá; “i” dúró fún ọmọ náà tàbí ohun tí wọ́n rí gẹ́gẹ́ bí àyíká ẹsẹ náà ṣe fi hàn.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle. “Sì” bá ìṣàn ìtàn Yorùbá mu.
- source_word: ἐγνώρισαν
  choice: wọ́n sọ ... di mímọ̀
  rationale: γνωρίζω túmọ̀ sí láti mú ohun kan di mímọ̀ tàbí láti fi í hàn fún ẹlòmíràn. Ìtumọ̀ yìí pa agbára ọ̀rọ̀-ìṣe náà mọ́ láì sọ ọ́ di ìkéde àṣẹ.
- source_word: περὶ τοῦ ῥήματος
  choice: ìhìn
  rationale: ῥῆμα lè túmọ̀ sí ọ̀rọ̀, àsọyé, tàbí ìhìn. Ní àyíká yìí, ó tọ́ka sí ohun tí a sọ fún àwọn olùṣọ́ àgùntàn nípa ọmọ náà; “ìhìn” ṣe èrò yẹn ní kedere ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn pamọ́.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: tí a ti sọ fún wọn
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe àti ìṣe tí ó ti ṣẹlẹ̀ ṣáájú mọ́. Lílo “a” aláìlórúkọ jẹ́ ọ̀nà Yorùbá àdánidá láti fi passive Gíríìkì hàn.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: nípa ọmọ yìí
  rationale: παιδίον tọ́ka sí ọmọ kékeré, níhìn-ín sí Jésù tí a ṣẹ̀ṣẹ̀ bí. “Ọmọ yìí” jẹ́ kedere, ó sì yẹra fún fífi ìtẹnumọ́ tí kò pọndandan kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ῥῆμα ní ìbáṣepọ̀ pẹ̀lú ohun tí áńgẹ́lì sọ
  choice: ìhìn
  alternative: ọ̀rọ̀ tàbí àsọyé
  rationale: “Ìhìn” fi hàn pé ohun tí a sọ ni àkóónú tí àwọn olùṣọ́ àgùntàn gbọ́ nípa ọmọ náà. Kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀ náà; àlàyé ìsàlẹ̀ sì jẹ́ kí ìrẹ́pọ̀ ìtumọ̀ ῥῆμα hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A fi àmì àlàyé [a] sí lẹ́yìn “ìhìn,” ibi tí ó bá ῥῆμα mu ní tààrà.
