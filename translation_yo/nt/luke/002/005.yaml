  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: yo
  text: láti forúkọ sílẹ̀ pẹ̀lú Màríà, ẹni tí a ti ṣe ìfẹ́sọ́nà rẹ̀ fún un[a], tí ó sì lóyún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àfẹ́sọ́nà rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìfẹ́sọ́nà tí a ti fìdí rẹ̀ múlẹ̀, tí ìdè rẹ̀ lágbára ju ìfẹ́sọ́nà òde òní lọ ní ti òfin àti àwùjọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó sì wà ní oyún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: láti lọ forúkọ sílẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí fífi orúkọ sílẹ̀ fún ìkànìyàn; ìtumọ̀ yìí jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere, ó sì bá ète ìrìn àjò náà mu.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: Èyí ni ọ̀nà àdánidá láti sọ pé Màríà bá a lọ.
- source_word: Μαριὰμ
  choice: Màríà
  rationale: A lo irú orúkọ tí ó ti wọ́pọ̀ nínú èdè Yorùbá.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: ẹni tí a ti fẹ́ sí i
  rationale: Gbólóhùn yìí fi ìbáṣepọ̀ ìfẹ́sọ́nà tí a ti fìdí rẹ̀ múlẹ̀ hàn, láì pè Màríà ní aya rẹ̀ tàbí sọ ọ́ di ìbáṣepọ̀ àfẹ́sọ́nà òde òní lásán.
- source_word: οὔσῃ ἐγκύῳ
  choice: tí ó sì lóyún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere àti ti àdánidá láti ṣàpèjúwe ipò Màríà ní àkókò náà.
theological_decisions:
- issue: Ipò ìgbéyàwó Màríà ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Jósẹ́fù
  choice: ẹni tí a ti fẹ́ sí i
  alternative: àfẹ́sọ́nà rẹ̀; aya rẹ̀
  rationale: Gíríìkì sọ ní pàtó pé a ti ṣe ìfẹ́sọ́nà Màríà fún un, ìbáṣepọ̀ tí ó ní agbára lábẹ́ àṣà àti òfin ìgbà náà. “Aya rẹ̀” yóò sọ ju ohun tí gbólóhùn náà sọ lọ, “àfẹ́sọ́nà rẹ̀” nìkan sì lè mú kí agbára ìdè náà dà bí ti ìfẹ́sọ́nà òde òní.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ àti ipò Màríà ni a sọ ní ọ̀nà tó ṣe kedere, tó ní iyì, tí òǹkàwé òde òní sì lè lóye.
