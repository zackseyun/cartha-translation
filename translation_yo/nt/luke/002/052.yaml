id: LUK.2.52
reference: Luke 2:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: yo
  text: Jésù sì ń tẹ̀ síwájú ní ọgbọ́n àti ní ìdàgbàsókè ara[a], àti ní ojúrere lọ́dọ̀ Ọlọ́run àti àwọn ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọjọ́ orí” tàbí “ìdàgbà”; ọ̀rọ̀ Gíríìkì ἡλικία lè túmọ̀ sí ọjọ́ orí tàbí ìdàgbàsókè ti ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: ń tẹ̀ síwájú
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń fi ìtẹ̀síwájú tó ń bá a lọ hàn; ‘ń tẹ̀ síwájú’ sọ èyí ní Yorùbá àdánidá láì sọ ọ́ di ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
- source_word: σοφίᾳ
  choice: ní ọgbọ́n
  rationale: ‘Ọgbọ́n’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún òye àti ìfòyemọ̀ tó jinlẹ̀ tí σοφία túmọ̀ sí níhìn-ín.
- source_word: ἡλικίᾳ
  choice: ní ìdàgbàsókè ara
  rationale: Ἡλικία lè tọ́ka sí ọjọ́ orí tàbí bí ara ṣe dàgbà. ‘Ìdàgbàsókè ara’ mú ìtumọ̀ ìdàgbà ti ara jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: χάριτι
  choice: ní ojúrere
  rationale: Nínú àjọṣe pẹ̀lú Ọlọ́run àti àwọn ènìyàn, χάρις túmọ̀ sí ojúrere tàbí ìtẹ́wọ́gbà, kì í ṣe dandan ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́.
- source_word: παρὰ θεῷ
  choice: lọ́dọ̀ Ọlọ́run
  rationale: Παρά pẹ̀lú dative ń sọ nípa bí ẹnì kan ṣe wà ní ojú tàbí lọ́dọ̀ ẹlòmíràn; ‘lọ́dọ̀ Ọlọ́run’ jẹ́ àdánidá ní Yorùbá, ó sì bá àpólà tó tẹ̀ lé e mu.
- source_word: ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Ἄνθρωποι níhìn-ín dúró fún gbogbo ènìyàn lápapọ̀. ‘Àwọn ènìyàn’ jẹ́ ìtumọ̀ Yorùbá tó péye, tí kò sì fi ìtumọ̀ akọ nìkan kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìdàgbàsókè Jésù gẹ́gẹ́ bí ènìyàn
  choice: A sọ ní tààrà pé Jésù ń tẹ̀ síwájú ní ọgbọ́n, ìdàgbàsókè ara àti ojúrere.
  alternative: Yí ọ̀rọ̀ náà padà láti dín ìdàgbàsókè Jésù kù tàbí láti bò ó mọ́lẹ̀ nítorí ìṣòro ẹ̀kọ́ nípa ẹni Kristi.
  rationale: Gíríìkì sọ ìtẹ̀síwájú Jésù ní kedere. Ìtumọ̀ náà pa ẹ̀rí nípa jíjẹ́ ènìyàn rẹ̀ ní tòótọ́ mọ́, láì gbìyànjú láti yanjú tàbí mú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà rọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ń tẹ̀ síwájú’ mú ìṣe tó ń bá a lọ jáde, ‘ojúrere’ sì yẹ fún àjọṣe tí ẹsẹ̀ náà ń sọ.
