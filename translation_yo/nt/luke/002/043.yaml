id: LUK.2.43
reference: Luke 2:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: yo
  text: Nígbà tí wọ́n sì parí àwọn ọjọ́ náà, bí wọ́n ti ń padà lọ, Jésù ọmọkùnrin náà dúró[a] ní Jerusalẹmu, àwọn òbí rẹ̀[b] kò sì mọ̀ pé ó dúró síbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dúró sẹ́yìn ní Jerusalẹmu.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn òbí rẹ̀.” Èdè ìdílé tí Lúùkù sábà máa ń lò níhìn-ín kò tako ìtàn ìbí Jésù láti inú wúńdíá tí ó sọ ṣáájú nínú Ìhìn Rere náà.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: nígbà tí wọ́n parí àwọn ọjọ́ náà
  rationale: Ó fi ipò tí ó ti parí ṣáájú ìṣẹ̀lẹ̀ pàtàkì hàn, ó sì pa ọ̀rọ̀-àpèjúwe Gíríìkì ‘àwọn ọjọ́ náà’ mọ́ láì fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: bí wọ́n ti ń padà lọ
  rationale: Ìlò yìí fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò kan náà hàn; èdè Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì mú ìtumọ̀ náà jáde kedere.
- source_word: ὑπέμεινεν
  choice: dúró sí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Jésù ṣì wà ní Jerusalẹmu nígbà tí àwọn yòókù ń padà; àṣàyàn ‘dúró sẹ́yìn’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ὁ παῖς
  choice: ọmọkùnrin náà
  rationale: παῖς lè túmọ̀ sí ọmọ, ọmọkùnrin, tàbí ìránṣẹ́ gẹ́gẹ́ bí àyíká; níhìn-ín Jésù jẹ́ ọmọ ọdún méjìlá, nítorí náà ‘ọmọkùnrin náà’ bá ọjọ́ orí àti ìtàn mu.
- source_word: ἐν Ἰερουσαλήμ
  choice: sí Jerusalẹmu
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘dúró,’ ‘dúró sí Jerusalẹmu’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó wà ní ibẹ̀.
- source_word: οὐκ ἔγνωσαν
  choice: kò sì mọ̀ pé ó dúró síbẹ̀
  rationale: γινώσκω níhìn-ín túmọ̀ sí mímọ̀ tàbí mímọ̀ nípa ohun tí ó ṣẹlẹ̀; fífi gbólóhùn ohun tí wọn kò mọ̀ kún un mú èdè Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: àwọn òbí rẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà ti γονεῖς, ó sì pa èdè ìdílé tí Lúùkù lò mọ́.
theological_decisions:
- issue: Pípe Màríà àti Jósẹ́fù ní οἱ γονεῖς αὐτοῦ
  choice: àwọn òbí rẹ̀
  alternative: bàbá àti ìyá rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé ‘àwọn òbí rẹ̀.’ Ìtumọ̀ náà pa ọ̀rọ̀ Lúùkù àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tí ó lè dà bí ẹni pé ó wà mọ́, láì gbìyànjú láti mú un bá ìtàn ìbí láti inú wúńdíá mu ní ọ̀nà àfikún.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́, ó lọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
