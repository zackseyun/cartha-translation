id: LUK.2.34
reference: Luke 2:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: yo
  text: Síméónì sì súre fún wọn, ó sì sọ fún Màríà ìyá rẹ̀ pé, “Wò ó, a yàn ọmọ yìí fún ìṣubú àti ìdìde ọ̀pọ̀ ènìyàn ní Ísírẹ́lì, àti fún àmì tí a ó máa sọ̀rọ̀ lòdì sí,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “àmì tí àwọn ènìyàn yóò máa tako.”'
    reason: Ó ṣàfihàn ọ̀nà ìtumọ̀ mìíràn fún σημεῖον ἀντιλεγόμενον, níbi tí ìtakò náà ti dojú kọ àmì náà.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: súre fún
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan ké pe ìbùkún Ọlọ́run sórí àwọn mìíràn.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ìkìlọ̀ àti ìfa àfiyèsí ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá òde òní.
- source_word: κεῖται εἰς
  choice: a ti yan ... láti mú kí
  rationale: Nínú àyíká yìí, κεῖται ń tọ́ka sí ohun tí a fi ẹni náà sílẹ̀ tàbí yàn fún un; ìtumọ̀ yìí tún jẹ́ kí ète gbolohun náà ṣe kedere láì sọ ẹni tó ṣe ìyàn náà ní tààrà.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: ṣubú ... sì dìde
  rationale: Ó pa àtakò tó lágbára láàárín ìṣubú àti ìdìde mọ́, bẹ́ẹ̀ ni kò pinnu láìní ẹ̀rí bóyá ẹgbẹ́ kan náà tàbí ẹgbẹ́ ọ̀tọ̀ọ̀tọ̀ ni a ń sọ.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: àmì tí a ó máa sọ̀rọ̀ lòdì sí
  rationale: 'Ó fi ìṣe tí participle Gíríìkì ń tọ́ka sí hàn ní kedere: àmì náà yóò dojú kọ ìtakò àti àríyànjiyàn.'
theological_decisions:
- issue: Ìtumọ̀ πτῶσιν καὶ ἀνάστασιν πολλῶν
  choice: “mú kí ọ̀pọ̀ ènìyàn ... ṣubú, kí ọ̀pọ̀ sì dìde”
  alternative: “fún ìṣubú àti àjíǹde ọ̀pọ̀ ènìyàn”
  rationale: A kò fi “àjíǹde” sí i nítorí pé ó lè mú kí òǹkàwé rò pé àjíǹde ara nìkan ni gbolohun náà ń sọ. “Ṣubú ... dìde” pa àwòrán àti àìdánilójú orísun mọ́.
- issue: Bóyá “ọ̀pọ̀” kan náà ló ṣubú tí wọ́n sì dìde
  choice: A tún “ọ̀pọ̀” sọ lẹ́ẹ̀mejì láì sọ pé àwọn kan ni wọ́n ṣubú, àwọn mìíràn sì dìde.
  alternative: “láti mú kí ọ̀pọ̀ kan ṣubú, kí àwọn mìíràn sì dìde”
  rationale: Gíríìkì kò ṣàlàyé bóyá àwọn ènìyàn kan náà ni iṣẹlẹ̀ méjèèjì kan tàbí ẹgbẹ́ méjì ọ̀tọ̀; a yàgò fún pípa àìdánilójú yẹn rẹ́.
- issue: Agbára ẹni tó wà lẹ́yìn “a ti yan”
  choice: A lo ọ̀rọ̀ aláìlẹ́ni “a ti yan.”
  alternative: “Ọlọ́run ti yàn án”
  rationale: Bí ó tilẹ̀ jẹ́ pé Ọlọ́run ni a lè lóye gẹ́gẹ́ bí ẹni tó ṣe èyí, orísun kò darúkọ rẹ̀ ní tààrà, nítorí náà a kò fi kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ọmọ yìí” fún οὗτος nítorí pé ọmọdé ni àyíká náà ń tọ́ka sí. Àmì ẹsẹ̀ [a] wà nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí a ti béèrè.
