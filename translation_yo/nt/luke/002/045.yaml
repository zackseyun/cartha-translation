base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: yo
  text: Nígbà tí wọn kò rí i[a], wọ́n padà sí Jerúsálẹ́mù, wọ́n ń wá a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Láìrí i, wọ́n padà sí Jerúsálẹ́mù, wọ́n ń wá a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Àsopọ̀ yìí tẹ̀ síwájú nínú ìtàn náà ní ọ̀nà àdánidá, ó sì pa ìṣàn paratactic Gíríìkì mọ́ láìfi ìtumọ̀ ‘lẹ́yìn náà’ kún un.
- source_word: μὴ εὑρόντες
  choice: Nígbà tí wọn kò rí i
  rationale: Aorist participle pẹ̀lú μή jẹ́ gbólóhùn àyíká tó lè tọ́ka sí àkókò; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὑπέστρεψαν
  choice: wọn padà
  rationale: Ó túmọ̀ sí pé wọ́n yí padà lọ sí ibi tí wọ́n ti wá; ‘padà’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì ṣe kedere.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́mù
  rationale: Pẹ̀lú orúkọ ìlú, εἰς ń tọ́ka sí ibi tí ìrìn-àjò ń lọ; ‘sí’ ni ìtumọ̀ Yorùbá àdánidá.
- source_word: ἀναζητοῦντες
  choice: wọ́n ń wá
  rationale: Participial yìí fi ìṣe wíwá tó ń bá a lọ hàn. ‘Wọ́n ń wá’ jẹ́ èdè òde òní tó ṣe kedere, nígbà tí àyíká náà mú kí ìtumọ̀ ìwádìí takuntakun hàn.
- source_word: αὐτόν
  choice: i / a
  rationale: Àrọ́pò-orúkọ akọ ẹyọ kan náà ni ó tọ́ka sí Jésù; irú fọ́ọ̀mù rẹ̀ yí padà sí ‘i’ lẹ́yìn ‘rí’ àti ‘a’ lẹ́yìn ‘wá’ gẹ́gẹ́ bí ìlànà Yorùbá.
