  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: yo
  text: Ìmọ́lẹ̀ fún ìṣípayá sí àwọn orílẹ̀-èdè[a], àti ògo fún àwọn ènìyàn rẹ, Ísírẹ́lì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí kì í ṣe Júù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn orílẹ̀-èdè” lápapọ̀, ṣùgbọ́n níbí ó ṣeé ṣe kí ó ń tọ́ka sí àwọn tí kì í ṣe Júù ní ìyàtọ̀ sí Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìmọ́lẹ̀ ní tààrà, ó sì bá àpèjúwe ewì Síméónì mu láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: εἰς ἀποκάλυψιν
  choice: fún ìṣípayá
  rationale: “Fún” fi ète tàbí àbájáde hàn, “ìṣípayá” sì pa èrò ohun tí a ṣí síta tàbí tí a mú di mímọ̀ mọ́.
- source_word: ἐθνῶν
  choice: àwọn orílẹ̀-èdè
  rationale: Èyí pa ìtumọ̀ gbooro ọ̀rọ̀ Gíríìkì mọ́. Nínú àyíká yìí, ó ń tọ́ka sí àwọn tí kì í ṣe Júù ní ìyàtọ̀ sí Ísírẹ́lì, bí àlàyé ìsàlẹ̀ ṣe ṣàlàyé.
- source_word: δόξαν
  choice: ògo
  rationale: “Ògo” pa ìtumọ̀ ọlá àti ọlá ńlá tí iṣẹ́ ìgbàlà Ọlọ́run mú wá mọ́.
- source_word: λαοῦ σου Ἰσραήλ
  choice: Ísírẹ́lì ènìyàn rẹ
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé Ísírẹ́lì ni ẹni tí a ń pè ní ènìyàn Ọlọ́run.
- source_word: καὶ
  choice: àti
  rationale: Ó so àwọn apá méjèèjì tí ó jọra pọ̀ ní kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Ísírẹ́lì
  choice: àwọn orílẹ̀-èdè
  alternative: àwọn aláìkọlà / àwọn tí kì í ṣe Júù
  rationale: Ìtumọ̀ “àwọn orílẹ̀-èdè” jẹ́ èyí tí ó sún mọ́ ọ̀rọ̀ Gíríìkì jù, tí ó sì pa àìdánilójú ìtumọ̀ rẹ̀ mọ́. Àyíká fífi wọn wé Ísírẹ́lì mú kí ìtọ́kasí sí àwọn tí kì í ṣe Júù ṣeé rí; a fi èyí sínú àlàyé ìsàlẹ̀ dípò yíyanjú rẹ̀ ní ìkọ̀kọ̀ nínú ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kúkúrú, ọlọ́lá, ó sì pa ìṣètò ewì àti ìfarawé àwọn apá méjèèjì mọ́.
