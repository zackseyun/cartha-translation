base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: yo
  text: Nítorí pé lónìí ni a bí Olùgbàlà fún yín ní ìlú Dáfídì; òun ni Mèsáyà, Olúwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gangan, ọ̀rọ̀ Gíríìkì náà ni “Mèsáyà Olúwa”; a tún máa ń túmọ̀ rẹ̀ ní ọ̀nà àtẹ̀dáwọ́ pé “Kristi Olúwa.” Ó wọ́pọ̀ láti lóye rẹ̀ gẹ́gẹ́ bí akọ́lé méjì: “Mèsáyà” àti “Olúwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń ṣàlàyé ìdí tàbí kókó ìhìn tí áńgẹ́lì kéde ní ẹsẹ tó ṣáájú.
- source_word: ἐτέχθη
  choice: a bí
  rationale: Ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìṣe aláìṣe yìí ni “a bí,” ó sì bá ìṣẹ̀lẹ̀ tó ṣẹ̀ ní àkókò kan mu.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dátífù náà tọ́ka sí àǹfààní àwọn olùgbọ́, kì í ṣe kìkì ẹni tí a fi nǹkan fún.
- source_word: σήμερον
  choice: lónìí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ṣe kedere fún àkókò náà.
- source_word: σωτὴρ
  choice: Olùgbàlà
  rationale: Ó pa ìtumọ̀ ẹni tó ń gbani là mọ́, ó sì jẹ́ akọ́lé ẹ̀sìn àti ti ọba tó mọ́gbọ́n dání ní Yorùbá.
- source_word: ὅς ἐστιν
  choice: òun ni
  rationale: Ó so Olùgbàlà náà mọ́ àwọn akọ́lé tó tẹ̀ lé e ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: χριστὸς
  choice: Mèsáyà
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ akọ́lé ẹni tí a fòróró yàn, kì í ṣe orúkọ lasan; “Mèsáyà” mú iṣẹ́ akọ́lé náà hàn gbangba.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ tó yẹ fún akọ́lé ọlá àti àṣẹ yìí, ó sì pa ìwọ̀n ẹ̀kọ́ nípa ẹni Kristi mọ́.
- source_word: ἐν πόλει Δαυίδ
  choice: ní ìlú Dáfídì
  rationale: Ó tẹ̀ lé gbólóhùn orísun ní ti ìtumọ̀, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáfídì mọ́.
theological_decisions:
- issue: Ìtumọ̀ χριστὸς κύριος
  choice: Mèsáyà, Olúwa
  alternative: Mèsáyà Olúwa; Kristi Olúwa; Mèsáyà ti Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì fi akọ́lé méjèèjì sí ipò kan náà lẹ́gbẹ̀ẹ́ “Olùgbàlà.” Àmì kọ́mà ní Yorùbá ń ran òǹkàwé lọ́wọ́ láti rí wọn gẹ́gẹ́ bí akọ́lé méjì tí ń tọ́ka sí ẹni kan, láì sọ ọ́ di “Mèsáyà ti Olúwa,” èyí tó jẹ́ ìtumọ̀ mìíràn tí ó ṣeé ṣe ṣùgbọ́n tí kò tààrà tó bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá ṣe àdánidá. Èdè náà ní ọlá, ó ṣe kedere, kò sì ní àwọ̀ ẹ̀kọ́ ìjọ kan pàtó. Ìtòlẹ́sẹẹsẹ gbólóhùn jẹ́ ti Yorùbá àdánidá, nígbà tí ó ṣì pa ìtẹnumọ́ “lónìí” àti ìbáṣepọ̀ Dáfídì mọ́.
