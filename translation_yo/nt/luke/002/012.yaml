  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: yo
  text: 'Èyí yóò sì jẹ́ àmì fún yín: ẹ ó rí ọmọ ọwọ́ kan tí a fi aṣọ dì, tí ó sì dùbúlẹ̀ nínú ibùjẹ ẹran.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a fi aṣọ ìdì ọmọ dì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ọ̀pọ́n tí a fi ń bọ́ ẹran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: àmì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun ìdámọ̀ tí àwọn olùṣọ́-àgùntàn yóò fi mọ ọmọ náà; “àmì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé láì fi dandan túmọ̀ rẹ̀ sí iṣẹ́ ìyanu tàbí ẹ̀rí.
- source_word: εὑρήσετε
  choice: ẹ ó rí
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí sọ ohun tí yóò ṣẹlẹ̀ fún ọ̀pọ̀ ẹni; “ẹ ó rí” jẹ́ ọ̀nà àdánidá àti kedere láti sọ ọ́ ní Yorùbá.
- source_word: βρέφος
  choice: ọmọ ọwọ́ kan
  rationale: βρέφος túmọ̀ sí ọmọ kékeré gan-an, pàápàá ọmọ-ọwọ́; yíyan yìí ṣe kedere ju “ọmọ” lásán lọ.
- source_word: ἐσπαργανωμένον
  choice: tí a fi aṣọ dì
  rationale: Ó ṣàpèjúwe ọmọ tí a fi aṣọ yí ká tàbí dì; gbolohun yìí jẹ́ ti èdè Yorùbá òde òní, ó sì pa ìṣe pàtó inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κείμενον
  choice: tí ó sì dùbúlẹ̀
  rationale: κεῖμαι ń ṣàpèjúwe ipò tí ọmọ náà wà, kì í ṣe ìṣe fífi tí a ṣẹ̀ṣẹ̀ ṣe; “dùbúlẹ̀” mú ìtumọ̀ ipò náà jáde dáadáa.
- source_word: φάτνῃ
  choice: nínú ibùjẹ ẹran
  rationale: φάτνη lè jẹ́ ibùjẹ tàbí ohun èlò tí ẹran ti ń jẹun; “ibùjẹ ẹran” jẹ́ kedere, ó sì bá ohun tí ọ̀rọ̀ náà ń tọ́ka sí mu.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: Èyí ni yóò sì jẹ́ àmì fún yín
  rationale: Gbolohun Gíríìkì náà yọ ọ̀rọ̀ àsopọ̀ kan sílẹ̀, ṣùgbọ́n Yorùbá nílò rẹ̀ fún ìṣàn èdè tó dára; ọjọ́ iwájú bá àyíká àsọtẹ́lẹ̀ náà mu.
theological_decisions:
- issue: Irú àmì tí a fi fún àwọn olùṣọ́-àgùntàn
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí àmì ìdámọ̀, láì sọ ní pàtó pé iṣẹ́ ìyanu ni.
  alternative: A lè lóye àmì náà pẹ̀lú gẹ́gẹ́ bí ìfẹsẹ̀múlẹ̀ àtọ̀runwá tó ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ jinlẹ̀.
  rationale: Àyíká ẹsẹ náà dojú kọ bí àwọn olùṣọ́-àgùntàn yóò ṣe dá ọmọ náà mọ̀ nípasẹ̀ ipò àràọ̀tọ̀ tí wọ́n yóò bá a. “Àmì” pa ààyè sílẹ̀ fún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n kò fi í kún ohun tí ọ̀rọ̀ náà kò sọ ní gbangba.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ọmọ ọwọ́,” “fi aṣọ dì,” àti “ibùjẹ ẹran” jẹ́ ọ̀rọ̀ kedere, àdánidá, tí kò gbára lé èdè ìjọ kan pàtó.
