source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: yo
  text: Ànà sì wà, wòlíì obìnrin kan, ọmọbìnrin Fánúẹ́lì, láti inú ẹ̀yà Áṣérì. Ó ti dàgbà gan-an,[a] ó sì ti gbé pẹ̀lú ọkọ fún ọdún méje láti ìgbà wúńdíá rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ti darúgbó gidigidi.” Ní ti gidi, Gíríìkì sọ pé ó ti “lọ síwájú nínú ọjọ́ púpọ̀,” àṣà ọ̀rọ̀ kan fún ọjọ́ ogbó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ti gbé pẹ̀lú ọkọ fún ọdún méje lẹ́yìn ìgbà wúńdíá rẹ̀”; ìyẹn ni pé, fún ọdún méje lẹ́yìn tí ó fi ipò wúńdíá sílẹ̀ nígbà tí ó ṣègbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: wòlíì obìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ orúkọ akọ́ abo ní pàtó fún obìnrin tí ó jẹ́ wòlíì; ‘wòlíì obìnrin’ ṣe ìyàtọ̀ abo náà ní kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: θυγάτηρ Φανουήλ
  choice: ọmọbìnrin Fánúẹ́lì
  rationale: Èyí túmọ̀ ìbátan ìdílé náà ní tààrà, ní ọ̀nà tí ó bá Yorùbá mu.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: láti inú ẹ̀yà Áṣérì
  rationale: ἐκ ń tọ́ka sí ìpilẹ̀ tàbí jíjẹ́ ara ẹgbẹ́ kan; ‘láti inú ẹ̀yà’ pa ìtumọ̀ ìbátan ẹ̀yà mọ́.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: Ọjọ́ orí rẹ̀ ti pọ̀ gidigidi
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní ti gidi sí pé ẹni náà ti ‘lọ síwájú nínú ọjọ́ púpọ̀’; àṣà ọ̀rọ̀ Yorùbá ‘ọjọ́ orí rẹ̀ ti pọ̀’ pa àwòrán ọjọ́ mọ́, ó sì sọ ọjọ́ ogbó di mímọ̀.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: ó ti bá ọkọ rẹ̀ gbé
  rationale: Ní àyíká yìí, ἀνήρ túmọ̀ sí ọkọ nínú ìgbéyàwó, kì í ṣe ọkùnrin lásán; gbólóhùn Yorùbá náà jẹ́ àdánidá, kò sì dín ìbáṣepọ̀ náà sí gbígbé pọ̀ lásán.
- source_word: ἔτη ἑπτὰ
  choice: fún ọdún méje
  rationale: Ó pa iye àkókò ọdún méje mọ́ ní tààrà.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: láti ìgbà wúńdíá rẹ̀
  rationale: ‘Ìgbà wúńdíá’ pa ọ̀rọ̀ orísun mọ́ láìfi àlàyé ọjọ́ ìgbéyàwó sínú ẹsẹ̀ pàtàkì; àlàyé ìtumọ̀ àkókò náà wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ipo Ànà gẹ́gẹ́ bí προφῆτις
  choice: A pè Ànà ní ‘wòlíì obìnrin,’ ẹni tí Ọlọ́run fi ń sọ̀rọ̀.
  alternative: Kí a mú ọ̀rọ̀ náà bí oyè ọlá lásán tàbí bí olùfọkànsìn kan tí kò ní iṣẹ́ wòlíì.
  rationale: Orúkọ Gíríìkì náà jẹ́ ọ̀rọ̀ tó wọ́pọ̀ fún wòlíì, ó sì ní ààmì abo ní kedere; kò yẹ kí ìtumọ̀ rẹ̀ rọ̀ tàbí kí a dín ipa náà kù.
- issue: Àpèjúwe ọjọ́ ogbó Ànà
  choice: A lo àṣà ọ̀rọ̀ ‘ọjọ́ orí rẹ̀ ti pọ̀ gidigidi’ láìṣírò ọjọ́ orí rẹ̀ nínú ẹsẹ̀ yìí.
  alternative: ‘Ó ti darúgbó gidigidi,’ tàbí fífi iye ọjọ́ orí kan tí a lè ṣe àkójọpọ̀ rẹ̀ láti ẹsẹ̀ tó tẹ̀ lé e sínú ẹsẹ̀ yìí.
  rationale: Ọ̀rọ̀ Lúùkù jẹ́ àpèjúwe àṣà ọ̀rọ̀ tí ó dá lórí ‘ọjọ́ púpọ̀’; ìtumọ̀ náà gbọ́dọ̀ pa àwòrán yìí àti àìdánilójú ìṣírò ọjọ́ orí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye. A lo ‘wòlíì obìnrin’ láti ṣàfihàn abo tí Gíríìkì samisi, ‘ọjọ́ orí rẹ̀ ti pọ̀’ láti pa àwòrán ọjọ́ mọ́, àti ‘bá ọkọ rẹ̀ gbé’ fún ìgbé ayé ìgbéyàwó. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó bá yẹ.
