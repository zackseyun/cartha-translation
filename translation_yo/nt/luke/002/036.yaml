  source_fidelity: Ìtumọ̀ náà pa ìdánimọ̀ Ànà gẹ́gẹ́ bí wòlíì obìnrin, ìran rẹ̀ láti ẹ̀yà Áṣérì, àti àkókò ọdún méje mọ́. Síbẹ̀, “wà pẹ̀lú” ń fi ìtumọ̀ ‘also’ kún καί, àti ‘ọkọ rẹ̀’ sọ ohun tí Gíríìkì fi sí àìpèníjà (‘a husband’) di ohun tí ó dájú. Àmì àlàyé a tún wà lẹ́yìn ‘wòlíì obìnrin’ bí ó tilẹ̀ jẹ́ pé àlàyé rẹ̀ kan ọjọ́ ogbó.
