revisions:
- from: Ànà wà pẹ̀lú, wòlíì obìnrin kan, ọmọbìnrin Fánúẹ́lì, láti inú ẹ̀yà Áṣérì. Ọjọ́ orí rẹ̀ ti pọ̀ gidigidi,[a] ó sì ti bá ọkọ rẹ̀ gbé fún ọdún méje láti ìgbà wúńdíá rẹ̀.[b]
  to: Ànà sì wà, wòlíì obìnrin kan, ọmọbìnrin Fánúẹ́lì, láti inú ẹ̀yà Áṣérì. Ó ti dàgbà gan-an,[a] ó sì ti gbé pẹ̀lú ọkọ fún ọdún méje láti ìgbà wúńdíá rẹ̀.[b]
