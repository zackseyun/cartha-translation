  terminology: “Wòlíì obìnrin,” “ọmọbìnrin Fánúẹ́lì,” àti “ẹ̀yà Áṣérì” yẹ. “Ìgbà wúńdíá rẹ̀” jẹ́ ìtumọ̀ tó bójú mu fún τῆς παρθενίας αὐτῆς, pẹ̀lú àlàyé ìsàlẹ̀ tó ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú ìgbéyàwó láìfi ìtumọ̀ náà sínú ọ̀rọ̀ pàtàkì.
