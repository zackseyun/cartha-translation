  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: yo
  text: 'àti láti rú ẹbọ gẹ́gẹ́ bí ohun tí a ti sọ nínú Òfin Olúwa[a]: àdàbà igbó méjì tàbí ọmọ ẹyẹlé méjì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ohun tí a sọ nínú Òfin Olúwa.”
    reason: Perfect participle náà lè jẹ́ títúmọ̀ ní ọ̀nà tó tẹnumọ́ ohun tí Òfin ń sọ, dípò ohun tí a ti sọ tẹ́lẹ̀.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: láti rú ẹbọ
  rationale: Nínú ọ̀rọ̀ ìrúbọ, gbólóhùn Yorùbá ‘rú ẹbọ’ ni ọ̀nà àdánidá láti sọ fífi ẹbọ rú; ó tún fi ìtumọ̀ ète tí infinitive náà ní hàn.
- source_word: κατὰ τὸ εἰρημένον
  choice: gẹ́gẹ́ bí ohun tí a ti sọ
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ sísọ mọ́, ó sì fi ipò perfect passive hàn pé ohun náà ti jẹ́ sísọ, ó sì dúró gẹ́gẹ́ bí àṣẹ inú Ìwé Mímọ́.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: nínú Òfin Olúwa
  rationale: ‘Òfin’ tọ́ka sí Òfin Mósè gẹ́gẹ́ bí Ìwé Mímọ́, ‘Olúwa’ sì ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níbí.
- source_word: ζεῦγος τρυγόνων
  choice: àdàbà igbó méjì
  rationale: ζεῦγος túmọ̀ sí ẹyẹ méjì tí ó jẹ́ méjì kan; ‘méjì’ sọ èyí ní kedere láì fi èrò akọ àti abo kún ọ̀rọ̀ Gíríìkì. ‘Àdàbà igbó’ ń ṣe ìyàtọ̀ sí ẹyẹlé.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: ọmọ ẹyẹlé méjì
  rationale: νοσσός jẹ́ ọmọ ẹyẹ, περιστερά sì jẹ́ ẹyẹlé/àdàbà; gbólóhùn yìí jẹ́ kedere, ó sì bá èdè ìrúbọ mu.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú gbólóhùn tó tọ́ka sí Òfin Ọlọ́run
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì ní κύριος, ‘Olúwa’ sì pa ọ̀nà tí Májẹ̀mú Tuntun gbà ń pè é mọ́ láì pinnu pé a gbọ́dọ̀ tẹ orúkọ Ọlọ́run tó wà lẹ́yìn àyọlò náà ní lẹ́tà ńlá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe, tó ní ọlá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún. A kò tú ζεῦγος sí ‘akọ àti abo,’ nítorí ọ̀rọ̀ Gíríìkì kò sọ irú akọ tàbí abo àwọn ẹyẹ náà.
