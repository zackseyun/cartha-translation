language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: yo
  text: Ó sì jẹ́ opó títí di ẹni ọdún mẹ́rìnlélọ́gọ́rin[a]. Kì í kúrò ní tẹ́ńpìlì[b]; ó ń sin Ọlọ́run nípa ààwẹ̀ àti àdúrà ẹ̀bẹ̀[c] ní òru àti ní ọ̀sán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì jẹ́ opó fún ọdún mẹ́rìnlélọ́gọ́rin.” Èdè Gíríìkì lè sọ ọjọ́ orí Ánà tàbí iye ọdún tí ó fi jẹ́ opó.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì níbí ń tọ́ka sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
  - marker: c
    text: “Àdúrà ẹ̀bẹ̀” tún lè jẹ́ “àwọn ẹ̀bẹ̀” tàbí “àwọn ìbéèrè àdúrà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún obìnrin tí ọkọ rẹ̀ ti kú ni “opó”; àyíká ọ̀rọ̀ náà mú kí ó ṣe kedere pé opó obìnrin ni.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: títí ó fi pé ẹni ọdún mẹ́rìnlélọ́gọ́rin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọjọ́ orí Ánà dé ọdún mẹ́rìnlélọ́gọ́rin. Bí ó tilẹ̀ jẹ́ pé Gíríìkì náà lè tọ́ka sí iye ọdún tí ó lò gẹ́gẹ́ bí opó, a fi ìtumọ̀ kejì náà sínú àlàyé ìsàlẹ̀.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: Kì í kúrò ní tẹ́ńpìlì
  rationale: “Kì í” fi ìṣe tí ó máa ń ṣẹlẹ̀ déédéé hàn, gẹ́gẹ́ bí imperfect Gíríìkì. Gbólóhùn náà sì dúró nítòsí ìtumọ̀ pé kò máa ń fi àgbègbè tẹ́ńpìlì sílẹ̀.
- source_word: ἱεροῦ
  choice: tẹ́ńpìlì
  rationale: “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tó yé àwọn òǹkàwé òde òní. Nínú Gíríìkì, ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; àlàyé ìsàlẹ̀ ṣàlàyé èyí.
- source_word: νηστείαις
  choice: nípa ààwẹ̀
  rationale: Ó fi ọ̀nà tí ó gbà ń ṣe ìsìn hàn. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, “ààwẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún lè tọ́ka sí àṣà ṣíṣe ààwẹ̀ léraléra.
- source_word: δεήσεσιν
  choice: àdúrà ẹ̀bẹ̀
  rationale: δέησις tẹnumọ́ ẹ̀bẹ̀ tàbí ìbéèrè nínú àdúrà. “Àdúrà ẹ̀bẹ̀” jẹ́ kó yé ni ní kedere, ó sì bá èdè Yorùbá mu.
- source_word: λατρεύουσα
  choice: ó ń sin Ọlọ́run
  rationale: Nínú àyíká ẹ̀sìn yìí, λατρεύω tọ́ka sí ṣíṣe iṣẹ́ ìsìn fún Ọlọ́run. Fífi “Ọlọ́run” kún un mú gbólóhùn Yorùbá ṣe kedere láìfi ẹ̀kọ́ ìjọ kan sí i.
- source_word: νύκτα καὶ ἡμέραν
  choice: ní òru àti ní ọ̀sán
  rationale: Ó pa ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ ìfọkànsìn tó ń bá a lọ déédéé.
theological_decisions:
- issue: Bóyá gbólóhùn náà ń sọ ọjọ́ orí Ánà tàbí iye ọdún tí ó fi jẹ́ opó
  choice: Ọ̀rọ̀ inú ẹsẹ náà sọ pé Ánà pé ẹni ọdún mẹ́rìnlélọ́gọ́rin.
  alternative: Ó lè túmọ̀ sí pé ó ti lo ọdún mẹ́rìnlélọ́gọ́rin gẹ́gẹ́ bí opó.
  rationale: Èdè Gíríìkì lè gba ìtumọ̀ méjèèjì. A yan ìtumọ̀ ọjọ́ orí fún ọ̀rọ̀ inú ẹsẹ nítorí ó rọrùn ní Yorùbá, ṣùgbọ́n a pa àìdánilójú tó wà nínú orísun mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Kì í” ṣàfihàn ìṣe déédéé, “ní òru àti ní ọ̀sán” sì pa ìtòlẹ́sẹẹsẹ orísun mọ́.
