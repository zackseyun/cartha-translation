source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: yo
  text: 'Lójijì, ọ̀pọ̀ ọmọ ogun ọ̀run wà pẹ̀lú áńgẹ́lì náà, wọ́n ń yìn Ọlọ́run, wọ́n sì ń wí pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: Lójijì
  rationale: Ó sọ bí ohun náà ṣe ṣẹlẹ̀ láìròtẹ́lẹ̀, ó sì pa ìyàlẹ́nu inú ìtàn náà mọ́.
- source_word: ἐγένετο
  choice: wà
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń fi wíwà tàbí dídé ẹgbẹ́ náà hàn; “wà” kò fi kún un pé wọ́n farahàn lójú ní pàtó.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: wà pẹ̀lú áńgẹ́lì náà
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní ọ̀nà tí ó ṣe àdánidá ní Yorùbá.
- source_word: πλῆθος
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ó fi iye púpọ̀ hàn ní èdè tí òǹkàwé òde òní lè lóye nírọ̀rùn.
- source_word: στρατιᾶς οὐρανίου
  choice: ọmọ ogun ọ̀run
  rationale: Ó pa àwòrán ẹgbẹ́ ọmọ ogun ti ọ̀run mọ́, láì sọ ọ́ di “àwọn áńgẹ́lì” nìkan.
- source_word: αἰνούντων τὸν θεόν
  choice: wọ́n ń yin Ọlọ́run
  rationale: Ó ṣàfihàn ìṣe tí ń lọ lọ́wọ́, tí Ọlọ́run sì jẹ́ ẹni tí wọ́n ń yìn.
- source_word: καὶ λεγόντων
  choice: wọ́n sì ń wí pé
  rationale: Ó so ìyìn náà mọ́ ọ̀rọ̀ tí yóò tẹ̀ lé ní ẹsẹ tó kàn.
theological_decisions:
- issue: Ìtumọ̀ στρατιᾶς οὐρανίου
  choice: ọmọ ogun ọ̀run
  alternative: ogun ọ̀run
  rationale: “Ọmọ ogun ọ̀run” pa ìtumọ̀ ẹgbẹ́ ológun àti ìtọ́kasí sí ọ̀run mọ́, bí ó tilẹ̀ jẹ́ pé iṣẹ́ wọn níbí ni yíyin Ọlọ́run, kì í ṣe jíjà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
