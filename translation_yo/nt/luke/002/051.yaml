id: LUK.2.51
reference: Luke 2:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: yo
  text: Ó sì bá wọn sọ̀kalẹ̀, ó sì dé Násárẹ́tì; ó sì wà lábẹ́ àṣẹ wọn[a]. Ìyá rẹ̀ sì ń pa gbogbo ọ̀rọ̀ wọ̀nyí mọ́ nínú ọkàn rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì ń tẹ̀lé àṣẹ wọn,” tàbí “ó sì ń gbọ́ tiwọn.” Ọ̀nà tí Gíríìkì gbà sọ ọ́ fi hàn pé wíwà lábẹ́ àṣẹ wọn tàbí ìgbọràn náà ń bá a lọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ῥήματα lè túmọ̀ sí “àwọn ọ̀rọ̀ tí a sọ,” “àwọn ọ̀ràn,” tàbí “àwọn nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: sọ̀kalẹ̀
  rationale: Ó pa ìtumọ̀ ìrìn-àjò láti ibi gíga sọ̀ kalẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju gbólóhùn líle bí ‘sọ ara rẹ̀ kalẹ̀’ lọ.
- source_word: μετ’ αὐτῶν
  choice: bá wọn
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní ṣókí gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: dé Násárẹ́tì
  rationale: Nínú ìtàn ìrìn-àjò Yorùbá, ‘dé’ sọ dídé ibi tí a ń lọ ní kedere, ó sì bá ìtumọ̀ ἔρχομαι εἰς mu.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: ó sì ń tẹríba fún wọn
  rationale: Àmì ‘ń’ fi ìṣe tó ń bá a lọ hàn, gẹ́gẹ́ bí àkópọ̀ imperfect àti participle Gíríìkì; ‘tẹríba fún’ sì pa ìtumọ̀ fífi ara sí abẹ́ àṣẹ wọn mọ́ láì sọ ọ́ di ìgbọràn lẹ́ẹ̀kan ṣoṣo.
- source_word: διετήρει
  choice: pa … mọ́
  rationale: Ó túmọ̀ sí pípa ohun mọ́ tàbí ṣíṣọ́ ọ dáadáa; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì yẹra fún fífi ìtumọ̀ àlàyé míì kún un.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: gbogbo ọ̀rọ̀ wọ̀nyí
  rationale: ‘Ọ̀rọ̀’ lè tọ́ka sí ohun tí a sọ àti sí ọ̀ràn tàbí ìṣẹ̀lẹ̀; nítorí náà, ó pa ààyè ìtumọ̀ ῥήματα mọ́ dáadáa ní Yorùbá.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: nínú ọkàn rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ibi ìrántí àti ìrònú inú, ó sì pa àwòrán ‘ọkàn’ inú orísun mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú Màríà àti Jósẹ́fù
  choice: ó sì ń tẹríba fún wọn
  alternative: ó sì wà lábẹ́ àṣẹ wọn; ó sì ń gbọ́ tiwọn
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé fífi ara rẹ̀ sí abẹ́ wọn jẹ́ ohun tó ń bá a lọ. Ìtumọ̀ yìí pa ìgbọràn rẹ̀ sí àwọn òbí rẹ̀ lórí ayé mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ náà tàbí dín ẹni tí ó jẹ́ kù.
- issue: Bí a ṣe máa tú ῥήματα nínú àyíká yìí
  choice: gbogbo ọ̀rọ̀ wọ̀nyí
  alternative: gbogbo nǹkan wọ̀nyí; gbogbo ọ̀rọ̀ tí a sọ wọ̀nyí
  rationale: ‘Ọ̀rọ̀’ jẹ́ kí ó ṣeé ṣe láti lóye ohun tí a sọ àti àwọn ọ̀ràn tí ìtàn náà ròyìn, nítorí náà a kò fi tipátipá yan ọ̀kan nínú àwọn ìtumọ̀ tí orísun lè gbà.
translation_notes:
  register: Yorùbá boṣewa oní àmì ohùn ni a lò, pẹ̀lú èdè ìtàn tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘bá wọn sọ̀kalẹ̀’ àti ‘dé Násárẹ́tì’ fún ìṣàn ìtàn àdánidá; ‘ń tẹríba’ sì jẹ́ kí ìṣe tó ń bá a lọ hàn.
