id: LUK.2.48
reference: Luke 2:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: yo
  text: Nígbà tí wọ́n sì rí i, ẹnu yà wọ́n; ìyá rẹ̀ sì sọ fún un pé, “Ọmọ, kí ló dé tí o fi ṣe èyí sí wa báyìí? Wò ó, bàbá rẹ àti èmi ti ń wá ọ pẹ̀lú ìrora ọkàn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “bàbá rẹ àti èmi ti ń wá ọ nínú ìpọ́njú” tàbí “pẹ̀lú ìbànújẹ́ lílágbára.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìrora ẹ̀dùn tí wọ́n ní nígbà tí wọ́n ń wá a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí wọ́n sì rí i
  rationale: A tú àpólà aláìlèsì aorist náà sí ọ̀nà àkókò tí ó ṣe àdánidá ní Yorùbá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: ἐξεπλάγησαν
  choice: ẹnu yà wọ́n
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ìyàlẹ́nu lílágbára ní kedere láìdi ọ̀rọ̀ náà mọ́ ọn.
- source_word: Τέκνον
  choice: Ọmọ
  rationale: Ó pa ìpè onífẹ̀ẹ́ ti ìyá mọ́, láìfi ‘mi’ tàbí ìtumọ̀ ọkùnrin kún ohun tí Gíríìkì sọ.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: èé ṣe tí o fi ṣe wa báyìí?
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe àdánidá fún ẹ̀dùn ọkàn náà, ó sì pa agbára ἡμῖν àti οὕτως mọ́.
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ó fa àfiyèsí sí ohun tí Màríà fẹ́ tẹnumọ́, ní èdè Yorùbá òde òní tí kò jẹ́ ti àtijọ́.
- source_word: ὁ πατήρ σου
  choice: bàbá rẹ
  rationale: A pa ọ̀rọ̀ pẹ̀tẹ́lẹ̀ ti Gíríìkì mọ́ láìfi àlàyé bí ‘bàbá rẹ ní ayé’ kún un.
- source_word: ὀδυνώμενοι
  choice: ní fífi ìrora ọkàn
  rationale: ‘Ìrora ọkàn’ mú ìpọ́njú ẹ̀dùn tí participle náà ní jáde ju ọ̀rọ̀ àníyàn lásán lọ; ìṣètò ‘fi … wá’ jẹ́ ti Yorùbá àdánidá.
- source_word: ἐζητοῦμέν σε
  choice: ti ń … wá ọ
  rationale: ‘Ti ń’ fi hàn pé wíwá náà ń lọ fún àkókò kan títí dé ìgbà tí wọ́n rí i, gẹ́gẹ́ bí imperfect Gíríìkì.
theological_decisions:
- issue: Pípe Jósẹ́fù ní ‘bàbá rẹ’ lẹ́gbẹ̀ẹ́ jíjẹ́ Ọmọ Ọlọ́run ti Jésù
  choice: bàbá rẹ
  alternative: bàbá rẹ ní ayé
  rationale: Màríà fúnra rẹ̀ sọ ‘bàbá rẹ àti èmi.’ Fífi ‘ní ayé’ kún un yóò túmọ̀ ẹ̀kọ́ sínú ẹsẹ náà dípò títúmọ̀ ohun tí ó wà níbẹ̀; a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ tí ẹsẹ tó tẹ̀ lé yóò tan ìmọ́lẹ̀ sí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní iyì, tí ó sì ṣe é lóye fún òǹkàwé lásán. A lo ‘sọ fún un’ àti ‘ṣe wa báyìí’ fún ìṣàn ọ̀rọ̀ àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
