  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: yo
  text: 'gẹ́gẹ́ bí a ti kọ ọ́ nínú Òfin Olúwa pé: “Gbogbo ọmọ akọ tí ó bá kọ́kọ́ ṣí ilé-ọmọ ni a ó pè ní mímọ́ fún Olúwa.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo akọ tí ó bá ṣí ilé-ọmọ.”
    reason: lexical_alternative
  - marker: b
    text: Èyí túmọ̀ sí pé a ka àkọ́bí ọmọ akọ sí ẹni mímọ́, tàbí ẹni tí a yà sí mímọ́ fún Olúwa. Wo Ẹ́kísódù 13:2, 12.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́
  rationale: Ó fi ìbámu pẹ̀lú ohun tí a kọ sínú Ìwé Mímọ́ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìtọ́kasí yìí.
- source_word: ἐν νόμῳ κυρίου
  choice: sínú Òfin Olúwa
  rationale: νόμος ń tọ́ka sí Òfin Mósè gẹ́gẹ́ bí àṣẹ Ìwé Mímọ́; ‘Òfin Olúwa’ pa ìbáṣepọ̀ náà mọ́.
- source_word: Πᾶν ἄρσεν
  choice: Gbogbo ọmọ akọ
  rationale: ‘Ọmọ akọ’ mú ìtumọ̀ akọ àti àyíká ọmọ tuntun hàn ní Yorùbá àdánidá, láìsọ ọ́ di ‘àkọ́bí’ ní tààràtà.
- source_word: διανοῖγον μήτραν
  choice: tí ó bá kọ́kọ́ ṣí ilé-ọmọ
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe ìbí àkọ́kọ́ tí ń ṣí ilé-ọmọ; ‘kọ́kọ́’ mú idiomu náà ṣe kedere ní Yorùbá láìyí ìtumọ̀ rẹ̀ padà.
- source_word: ἅγιον τῷ κυρίῳ
  choice: mímọ́ fún Olúwa
  rationale: Ó pa èdè ìwa mímọ́ ti ἅγιον mọ́, nígbà tí ‘fún Olúwa’ fi ìyasọ́tọ̀ tàbí ìyàsímímọ́ sí Olúwa hàn.
- source_word: κληθήσεται
  choice: ni a ó pè
  rationale: Ó ṣàfihàn ọ̀rọ̀ ọjọ́ iwájú aláìṣe ti Gíríìkì, ó sì bá ìforúkọsílẹ̀ àṣẹ mu ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò Òfin Ísírẹ́lì
  choice: Olúwa
  alternative: OLÚWA
  rationale: A ń túmọ̀ láti inú Gíríìkì κύριος; ‘Olúwa’ pa ìtumọ̀ àti ọ̀wọ̀ àdéhùn mọ́ láìfi fọ́ọ̀mù orúkọ Hébérù sínú ọ̀rọ̀ Gíríìkì.
- issue: Èdè ìwa mímọ́ tàbí èdè ìyàsímímọ́
  choice: mímọ́ fún Olúwa
  alternative: a yà sí mímọ́ fún Olúwa
  rationale: ἅγιον sọ ‘mímọ́’ ní tààràtà. Àṣàyàn yìí pa ìsopọ̀ ọ̀rọ̀ ìwa mímọ́ mọ́, nígbà tí àlàyé ìyàsímímọ́ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún kíkà ní gbangba. A kò fi àlàyé ẹ̀kọ́ ìsìn kankan tí kò sí nínú orísun kún un.
