id: LUK.2.27
reference: Luke 2:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: yo
  text: Ó sì wá nínú Ẹ̀mí sínú tẹ́mpìlì[a]. Nígbà tí àwọn òbí náà[b] mú ọmọ náà, Jésù, wọ inú tẹ́mpìlì láti ṣe ohun tí àṣà òfin béèrè nípa rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ẹ̀mí.” Gbólóhùn Gíríìkì lè gba ọ̀nà méjèèjì; “nínú Ẹ̀mí” sún mọ́ ọ̀rọ̀ Gíríìkì jù, ó sì bá bí Lúùkù ṣe ń tẹnu mọ́ Ẹ̀mí Mímọ́ ní àyíká yìí mu.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní, “àwọn òbí náà.” Lúùkù lo èdè ìdílé lasán níbí fún Màríà àti Jósẹ́fù nínú bí wọ́n ṣe ń tọ́jú Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣáájú Gíríìkì mọ́, ó sì bá bí Lúùkù ṣe ń tẹnu mọ́ Ẹ̀mí Mímọ́ ní àyíká ẹsẹ yìí mu. Àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ ‘nípasẹ̀ Ẹ̀mí’ hàn.
- source_word: ἱερόν
  choice: tẹ́ńpìlì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere láìfi ‘àgbàlá’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: nígbà tí ... mú ... wọlé
  rationale: Ìsọ̀rọ̀ aláìlópin tí ἐν ṣáájú rẹ̀ ní agbára àkókò níbí; ọ̀nà yìí jẹ́ ti Yorùbá àdánidá.
- source_word: γονεῖς
  choice: àwọn òbí náà
  rationale: Èyí túmọ̀ nọ́ńbà púpọ̀ àti ọ̀rọ̀-ìdánimọ̀ Gíríìkì ní tààrà, ó sì lo èdè ìdílé lasán tí Lúùkù lò fún Màríà àti Jósẹ́fù.
- source_word: παιδίον Ἰησοῦν
  choice: ọmọ náà, Jésù
  rationale: παιδίον tọ́ka sí ọmọ kékeré ní àyíká yìí, Jésù sì jẹ́ orúkọ tí a fi dá ọmọ náà mọ̀.
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: láti ṣe
  rationale: Ìsọ̀rọ̀ aláìlópin oníjẹnítífù ń fi ète hàn; àwọn òbí ni ẹni tí yóò ṣe ohun náà, bí ó tilẹ̀ jẹ́ pé èdè Yorùbá kò nílò kí a tún wọn sọ gẹ́gẹ́ bí olùṣe.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: gẹ́gẹ́ bí àṣà òfin
  rationale: Ó pa èrò ohun tí ó ti di àṣà tàbí ìlànà lábẹ́ òfin mọ́ ní ọ̀nà ṣókí tí ó sì ṣeé lóye.
- source_word: περὶ αὐτοῦ
  choice: fún un ... nípa rẹ̀
  rationale: ‘Fún un’ jẹ́ àdánidá nínú àyíká ìṣe ìsìn, ‘nípa rẹ̀’ sì jẹ́ kí ìbáṣepọ̀ tí περί pẹ̀lú jẹnítífù ń fi hàn má bàa sọnù.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ ń tọ́ka sí nínú ìgbésẹ̀ Síméónì
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí tàbí ìmọ̀lára inú Síméónì fúnra rẹ̀
  rationale: Àwọn ìtọ́kasí sí Ẹ̀mí Mímọ́ tí ó tẹ̀ lé ara wọn ní Lúùkù 2:25–27 mú kí ìtumọ̀ yìí lágbára jù; síbẹ̀, àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀nà gírámà mọ́.
- issue: Lílo ‘àwọn òbí’ fún Màríà àti Jósẹ́fù
  choice: Túmọ̀ γονεῖς ní tààrà sí ‘àwọn òbí náà’
  alternative: àwọn alágbàtọ́ rẹ̀; Jósẹ́fù àti Màríà
  rationale: Lúùkù lo èdè ìdílé ojoojúmọ́ ní àkọsílẹ̀ ìtàn. Èyí kò dá ẹ̀kọ́ ìbí láti ọ̀dọ̀ wúńdíá lẹ́bi, bẹ́ẹ̀ ni kò yẹ kí a rọ́pò ọ̀rọ̀ Gíríìkì pẹ̀lú ọ̀rọ̀ tí ó dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa ìtẹ̀síwájú gbólóhùn mọ́ pẹ̀lú àmì kọ́mà ní òpin, nítorí ẹsẹ yìí ń bá ẹsẹ tó tẹ̀ lé lọ.
