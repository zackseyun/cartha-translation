id: LUK.2.46
reference: Luke 2:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: yo
  text: Ó sì ṣe pé, lẹ́yìn ọjọ́ mẹ́ta, wọ́n rí i nínú àgbàlá tẹ́ńpìlì[a], ó jókòó láàárín àwọn olùkọ́, ó ń fetí sí wọn, ó sì ń béèrè lọ́wọ́ wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ó ń fọ̀rọ̀ wá wọn lẹ́nu wò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣe
  rationale: Ó pa ọ̀nà ìtàn Lúùkù mọ́ ní èdè Yorùbá tó ní iyì, láì lo gbólóhùn àtijọ́ tí kò ṣe déédéé mọ́.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: lẹ́yìn ọjọ́ mẹ́ta
  rationale: Ó tẹ̀ lé ìtumọ̀ àkókò μετά pẹ̀lú accusative, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εὗρον αὐτόν
  choice: wọ́n rí i
  rationale: Ìtumọ̀ aorist náà ni a gbé jáde ní kíkún, ní ọ̀nà tó rọrùn tí ó sì bá ìtàn mu.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; ‘àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ yìí hàn ní kedere.
- source_word: καθεζόμενον
  choice: ó jókòó
  rationale: Ó ṣàfihàn ipò Jésù nígbà tí wọ́n rí i, ní èdè Yorùbá àdánidá.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: láàárín àwọn olùkọ́
  rationale: Ó túmọ̀ ἐν μέσῳ àti διδάσκαλοι láì fi ‘òfin’ kún un, nítorí ọ̀rọ̀ yẹn kò sí ní Gíríìkì.
- source_word: ἀκούοντα αὐτῶν
  choice: ó ń fetí sí wọn
  rationale: ‘Fetí sí’ fi hàn pé ó ń tẹ́tí sí wọn pẹ̀lú àfiyèsí, kì í ṣe pé ó kàn ń gbọ́ ohùn wọn.
- source_word: ἐπερωτῶντα αὐτούς
  choice: ó sì ń bi wọ́n ní ìbéèrè
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún bíbéèrè, láì dá àríyànjiyàn tàbí ìfọ̀rọ̀wánilẹ́nuwò líle sí ọ̀rọ̀ náà.
theological_decisions:
- issue: Irú ìbáṣepọ̀ Jésù pẹ̀lú àwọn olùkọ́
  choice: ó ń fetí sí wọn, ó sì ń bi wọ́n ní ìbéèrè
  alternative: ó ń bi wọ́n lẹ́bi / ó ń fọ̀rọ̀ wá wọn lẹ́nu wò
  rationale: Gíríìkì fi Jésù hàn gẹ́gẹ́ bí ẹni tó ń kópa nínú ìjíròrò—ó ń fetí sí wọn, ó sì ń béèrè. Ìtumọ̀ yìí kò dín ọgbọ́n rẹ̀ kù, bẹ́ẹ̀ ni kò sọ ìṣẹ̀lẹ̀ náà di ìdojúkọ tí ẹsẹ̀ náà kò béèrè.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti ìtàn mímọ́ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Àgbàlá tẹ́ńpìlì’ mú ìtumọ̀ ἱερόν hàn kedere, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé ìdí rẹ̀.
