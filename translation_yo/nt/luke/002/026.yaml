id: LUK.2.26
reference: Luke 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: yo
  text: Ẹ̀mí Mímọ́ sì ti fi hàn án pé òun kì yóò rí ikú kí ó tó rí Mèsáyà Olúwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ọ̀nà ìtumọ̀ ìbílẹ̀, “Kristi Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: a ti fi hàn án
  rationale: Ọ̀rọ̀ náà nínú àyíká yìí tọ́ka sí ìfihàn tàbí ìsọfúnni láti ọ̀dọ̀ Ọlọ́run; “a ti fi hàn án” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìṣe àṣekágbá Gíríìkì mu.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: láti ọ̀dọ̀ Ẹ̀mí Mímọ́
  rationale: ὑπό pẹ̀lú ọ̀rọ̀ inú ẹ̀ka genitive fi olùṣe hàn. Èdè Yorùbá “láti ọ̀dọ̀ Ẹ̀mí Mímọ́” sọ orísun àti ipa Ẹ̀mí Mímọ́ ní ti ẹnìkan ní kedere.
- source_word: μὴ ἰδεῖν θάνατον
  choice: kì yóò rí ikú
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì “rí ikú” mọ́, èyí tí ó sì ṣeé lóye ní Yorùbá gẹ́gẹ́ bí ọ̀nà ọ̀rọ̀ fún kíkú.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: kí ó tó rí
  rationale: 'Ọ̀nà yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́: kò ní kú ṣáájú ìgbà tí yóò rí ẹni náà.'
- source_word: τὸν χριστὸν κυρίου
  choice: Mèsáyà Olúwa
  rationale: Χριστός jẹ́ oyè Mèsáyà níbí, kì í ṣe orúkọ bí ẹni pé ó jẹ́ apá kan orúkọ ẹni. “Mèsáyà Olúwa” pa ìbáṣepọ̀ genitive κυρίου mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó fìdí múlẹ̀ fún κύριος, àkójọpọ̀ “Mèsáyà Olúwa” sì jẹ́ ọ̀nà àdánidá láti fi ìní tàbí ìbáṣepọ̀ hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè Mèsáyà
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú τὸν χριστὸν κυρίου, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn. “Mèsáyà” mú àyíká ìrètí Mèsáyà jáde; àṣà ìtumọ̀ “Kristi Olúwa” wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa àwòrán “rí ikú” àti oyè Mèsáyà mọ́.
