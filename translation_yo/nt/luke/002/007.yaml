  to: Ó sì bí ọmọkùnrin àkọ́bí rẹ̀, ó fi aṣọ dì í, ó sì gbé e sínú ibùjẹ ẹranko[b], nítorí kò sí àyè fún wọn nínú yàrá àlejò[c].
