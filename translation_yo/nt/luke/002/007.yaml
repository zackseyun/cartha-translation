id: LUK.2.7
reference: Luke 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: yo
  text: Ó sì bí ọmọkùnrin àkọ́bí rẹ̀, ó fi aṣọ dì í, ó sì gbé e sínú ibùjẹ ẹranko[b], nítorí kò sí àyè fún wọn nínú yàrá àlejò[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, ‘ìkángun oúnjẹ ẹranko.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibi tàbí ohun èlò tí a fi ń fún ẹranko ní oúnjẹ.
    reason: lexical_alternative
  - marker: c
    text: Ní ìtumọ̀ ìbílẹ̀, ‘ilé èrò.’ Ọ̀rọ̀ Gíríìkì κατάλυμα lè túmọ̀ sí yàrá àlejò tàbí ibi ìgbé; Lúùkù lo ọ̀rọ̀ mìíràn fún ilé èrò oníṣòwò ní Lúùkù 10:34.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: bí
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe déédé fún bíbí ọmọ ni àyíká yìí; ó ṣe kedere, kò sì lo èdè àtijọ́ tí kò wọ́pọ̀.
- source_word: πρωτότοκον
  choice: àkọ́bí
  rationale: Ó tọ́ka sí ọmọ tí a kọ́kọ́ bí, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ náà.
- source_word: ἐσπαργάνωσεν
  choice: fi aṣọ wé e
  rationale: Ó sọ ní èdè Yorùbá àdánidá pé a fi aṣọ dì ọmọ tuntun; ‘wé e’ mú ìṣe yí ọmọ ká hàn gbangba.
- source_word: ἀνέκλινεν
  choice: tẹ́ ẹ sí
  rationale: Nínú àyíká ọmọ ọwọ́, èyí túmọ̀ sí fífi ọmọ náà dùbúlẹ̀ tàbí gbé e sí ibì kan; ‘tẹ́ ẹ sí’ jẹ́ àdánidá ní Yorùbá.
- source_word: φάτνῃ
  choice: ọ̀pá ìjẹun ẹranko
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ibi tàbí ohun èlò tí ẹranko ti ń jẹ; ìtumọ̀ yìí ṣe kedere ju lílo ọ̀rọ̀ àjèjì tàbí ti àṣà lọ.
- source_word: τόπος
  choice: àyè
  rationale: ‘Àyè’ fi ìtumọ̀ ibi tàbí ààyè tó wà fún wọn hàn lọ́nà àdánidá.
- source_word: καταλύματι
  choice: yàrá àlejò
  rationale: κατάλυμα lè jẹ́ ibi ìgbé àlejò tàbí yàrá àlejò; Lúùkù lo ọ̀rọ̀ mìíràn fún ilé èrò oníṣòwò ní Lúùkù 10:34, ó sì lo κατάλυμα fún yàrá àlejò ní Lúùkù 22:11.
theological_decisions:
- issue: Bóyá κατάλυμα yẹ kí ó jẹ́ ‘ilé èrò’ tàbí ọ̀rọ̀ tó ń tọ́ka sí yàrá àlejò nínú ilé
  choice: yàrá àlejò
  alternative: ilé èrò; ibi ìgbé àlejò
  rationale: Gíríìkì kò fi dandan sọ pé ilé èrò oníṣòwò ni. Ìlò ọ̀rọ̀ Lúùkù fúnra rẹ̀ ń ṣètìlẹ́yìn fún ‘yàrá àlejò,’ èyí sì yẹra fún fífi àwòrán ìbílẹ̀ tí ẹsẹ náà kò béèrè kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. A yàgò fún àwòrán ilé èrò tí àṣà ti gbajúmọ̀, kí ìtumọ̀ náà lè tẹ̀ lé ẹ̀rí Gíríìkì. A kò fi àmì [a] sínú ọ̀rọ̀ nítorí àlàyé [a] Gẹ̀ẹ́sì kò bá ibi tí a fi àmì sí mu, ó sì jọ pé ó jẹ́ àṣìṣe nínú dátà orísun.
