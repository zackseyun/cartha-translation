source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: yo
  text: Wọ́n sì dé ní kánkán, wọ́n sì rí Màríà àti Jósẹ́fù àti ọmọ ọwọ́ náà tí ó dùbúlẹ̀ nínú ibùjẹ ẹran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ohun èlò tí a fi ń bọ́ ẹran.” Ọ̀rọ̀ Gíríìkì φάτνη lè tọ́ka sí ibùjẹ ẹran tàbí ohun èlò ìjẹun ẹran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: wọ́n sì dé
  rationale: Ọ̀rọ̀ yìí ṣe àfihàn pé wọ́n dé ibi tí áńgẹ́lì ti sọ fún wọn; “dé” jẹ́ ọ̀nà àdánidá láti sọ ìṣípòpadà wọn sí ibi náà ní Yorùbá.
- source_word: σπεύσαντες
  choice: yára
  rationale: Ọ̀rọ̀ ìṣe alábápín náà ṣàlàyé bí wọ́n ṣe dé—pẹ̀lú ìkánjú. “Yára” ṣe àfihàn ìkánjú náà ní èdè Yorùbá tó rọrùn, tó sì ṣe àdánidá.
- source_word: ἀνεῦραν
  choice: wọ́n sì rí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí rírí ohun lẹ́yìn wíwá a. “Rí” bá ìtàn náà mu, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi ìwádìí tí ó yọrí sí àṣeyọrí hàn.
- source_word: τήν τε Μαριὰμ
  choice: Màríà
  rationale: A lo irú orúkọ tí ó ti wọ́pọ̀ ní Yorùbá. A fi àsopọ̀ τε hàn nípasẹ̀ ìṣọ̀kan àkójọ náà.
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: Èyí ni irú orúkọ náà tí ó ti fìdí múlẹ̀, tí ó sì mọ́gbọ́n dání ní Yorùbá.
- source_word: τὸ βρέφος
  choice: ọmọ ọwọ́ náà
  rationale: βρέφος ń tọ́ka sí ọmọ kékeré gan-an, níhìn-ín ọmọ tuntun. “Ọmọ ọwọ́” jẹ́ gbólóhùn Yorùbá tó ṣe àdánidá fún ọmọ irú bẹ́ẹ̀.
- source_word: κείμενον
  choice: tí ó dùbúlẹ̀
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ipò ọmọ náà, kì í ṣe ìṣe fífi tí ẹnì kan fi í síbẹ̀. “Dùbúlẹ̀” pa ìtumọ̀ ipò yẹn mọ́.
- source_word: ἐν τῇ φάτνῃ
  choice: nínú ibùjẹ ẹran[a]
  rationale: φάτνη lè jẹ́ ohun èlò tàbí ibi tí ẹran ti ń jẹun. “Ibùjẹ ẹran” jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá, tó sì yẹ fún àyíká ìbí yìí; àlàyé ìsàlẹ̀ ojú ìwé pa ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: καὶ ... καὶ ... καὶ
  choice: sì ... sì ... àti ... àti
  rationale: Àwọn àsopọ̀ wọ̀nyí pa ìṣàn àfikún tó rọrùn ti Gíríìkì mọ́, ṣùgbọ́n a ṣètò wọn gẹ́gẹ́ bí èdè Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àtúmọ̀ náà pa ìkánjú, àkójọ àwọn tí wọ́n rí, àti ipò ọmọ náà mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
