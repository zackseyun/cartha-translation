  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Kí ni àwọn ọ̀rọ̀ wọ̀nyí tí ẹ ń jíròrò láàárín ara yín bí ẹ ti ń rìn lọ?”[a] Wọ́n sì dúró jẹ́ẹ́,[b] ìbànújẹ́ sì hàn lójú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni àwọn ọ̀ràn wọ̀nyí tí ẹ ń jíròrò láàárín ara yín bí ẹ ti ń rìn lọ?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n dá ìrìn wọn dúró, ojú wọn sì rẹ̀wẹ̀sì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Ó sì wí fún wọn pé
  rationale: “Wí” ṣetọju ìtumọ̀ boṣewa ti λέγω, nígbà tí “sì” so ìṣẹ̀lẹ̀ náà mọ́ ìtàn tó ṣáájú láìfi ìtakò líle kún un.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Àwọn ọ̀rọ̀ wo
  rationale: “Àwọn ọ̀rọ̀” ṣetọju àwòrán gangan ti λόγοι, ṣùgbọ́n nínú àyíká yìí ó tún lè túmọ̀ sí àwọn ọ̀ràn tí wọ́n ń jíròrò.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: ẹ ń sọ fún ara yín
  rationale: Gbólóhùn Yorùbá yìí fi ìsọ̀rọ̀ tí ń lọ síwá-sẹ́yìn láàárín wọn hàn ní ọ̀nà àdánidá, láìfi èrò pé wọ́n ń jiyàn kún ọ̀rọ̀ Gíríìkì.
- source_word: περιπατοῦντες
  choice: bí ẹ ti ń rìn lọ
  rationale: Ó fi hàn pé ìrìn àti ìsọ̀rọ̀ náà ń ṣẹlẹ̀ ní àkókò kan náà.
- source_word: ἐστάθησαν
  choice: Wọ́n sì dúró jẹ́ẹ́
  rationale: Ó mú ìtumọ̀ pé wọ́n dá ìrìn wọn dúró, kì í ṣe pé wọ́n wulẹ̀ wà ní ìdúró nìkan.
- source_word: σκυθρωποί
  choice: ìbànújẹ́ sì hàn lójú wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìrísí ojú tí ó kún fún ìbànújẹ́ tàbí ìrẹ̀wẹ̀sì; ìtumọ̀ yìí jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà ní ọlá, ó rọrùn fún òǹkàwé òde òní, ó sì ṣetọju ìyàtọ̀ tó ṣeé ṣe láàárín “ọ̀rọ̀” àti “ọ̀ràn,” àti láàárín “dúró jẹ́ẹ́” àti “dá ìrìn dúró.”
