source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: yo
  text: àti pé kí a kéde ìrònúpìwàdà fún ìdáríjì ẹ̀ṣẹ̀[a] ní orúkọ rẹ̀ sí gbogbo àwọn orílẹ̀-èdè[b], pẹ̀lú ìkéde náà tí yóò bẹ̀rẹ̀ láti Jerúsálẹ́m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrònúpìwàdà àti ìdáríjì ẹ̀ṣẹ̀”; a lè lóye Gíríìkì náà gẹ́gẹ́ bí ohun méjì tí a ó kéde papọ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “sí gbogbo orílẹ̀-èdè.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “àwọn Kèfèrí” ní àwọn àyíká kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: kí a kéde
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe aláìlẹ́ni pàtó náà mọ́, ó sì fi hàn pé ìkéde ní gbangba ni, láìfi í mọ́ ìwàásù nínú ilé ìjọsìn nìkan.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: ní orúkọ rẹ̀
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ìkéde náà wá lábẹ́ àṣẹ rẹ̀, ó sì dúró lórí ẹni tí òun jẹ́.
- source_word: μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí yíyí ọkàn àti ìgbésí ayé padà, ó sì jẹ́ ọ̀rọ̀ tó ṣe kedere fún èrò ìrònúpìwàdà nínú àyíká yìí.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: ìdáríjì ẹ̀ṣẹ̀
  rationale: Ó sọ ìtumọ̀ ìtúsílẹ̀ tàbí ìdáríjì kúrò nínú ẹ̀ṣẹ̀ ní ọ̀nà tó mọ́gbọ́n dání, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: sí gbogbo àwọn orílẹ̀-èdè
  rationale: “Sí” pa ìtọ́sọ́nà εἰς mọ́, “gbogbo àwọn orílẹ̀-èdè” sì fi ìwọ̀n àgbáyé hàn láìdín un kù sí àwọn Kèfèrí nìkan.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: bẹ̀rẹ̀ láti Jerúsálẹ́m
  rationale: Ó pa Jerúsálẹ́m mọ́ gẹ́gẹ́ bí ibi tí ìkéde náà ti máa kọ́kọ́ bẹ̀rẹ̀, láìṣàfikún ẹni tí a kò dárúkọ ní tààrà.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìrònúpìwàdà àti ìdáríjì ẹ̀ṣẹ̀
  choice: “ìrònúpìwàdà fún ìdáríjì ẹ̀ṣẹ̀”
  alternative: “ìrònúpìwàdà àti ìdáríjì ẹ̀ṣẹ̀”
  rationale: Ìtumọ̀ àkọ́kọ́ fi ìbáṣepọ̀ tímọ́tímọ́ wọn hàn ṣùgbọ́n kò fi ètò ẹ̀kọ́ ìgbàlà kan tí ẹsẹ̀ náà kò ṣàlàyé kún un; àlàyé ìsàlẹ̀ fi ìtumọ̀ méjì tó ṣeé ṣe nínú Gíríìkì pamọ́.
- issue: Ìtumọ̀ ἔθνη
  choice: “gbogbo àwọn orílẹ̀-èdè”
  alternative: “gbogbo àwọn Kèfèrí”
  rationale: Àṣàyàn náà pa ìkéde sí gbogbo ayé mọ́, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí àwọn tí kì í ṣe Júù nìkan.
translation_notes:
  register: Yorùbá àtẹ̀wọ́dá, ọlọ́lá, tó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ; a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè fi ìtumọ̀ ẹ̀ya ìjọ kan lé ẹsẹ̀ náà lórí.
