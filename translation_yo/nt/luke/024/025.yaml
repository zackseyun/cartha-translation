id: LUK.24.25
reference: Luke 24:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Háà, ẹ̀yin aláìlóye[a], tí ọkàn yín sì lọ́ra[b] láti gba gbogbo ohun tí àwọn wòlíì ti sọ[c] gbọ́!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin aláìní òye” tàbí “ẹ̀yin tí kò ní ìmòye.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ọkàn yín lọ́ra”; ó túmọ̀ sí pé inú ènìyàn kò tètè múra láti gbẹ́kẹ̀ lé ohun tí Ọlọ́run sọ, kí ó sì gbà á.
    reason: cultural_note
  - marker: c
    text: Tàbí “sọ̀rọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Háà
  rationale: Ó pa agbára ìkéde àti ìbáwí inú ọ̀rọ̀ ìpè Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἀνόητοι
  choice: ẹ̀yin aláìlóye
  rationale: Ó tọ́ka sí àìní òye, láìsọ ọ̀rọ̀ náà di ẹ̀gàn tó dá lórí ìwà búburú nìkan; “ẹ̀yin” sì pa ìpè ọ̀pọ̀ ènìyàn mọ́.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: tí ọkàn yín sì lọ́ra
  rationale: Ó pa àwòrán “ọkàn” gẹ́gẹ́ bí inú ènìyàn mọ́, dípò kí a dín un kù sí òye orí nìkan.
- source_word: τοῦ πιστεύειν
  choice: láti ... gbọ́
  rationale: “Gba ... gbọ́” ni ọ̀nà Yorùbá àdánidá láti sọ ìgbàgbọ́ tàbí fífi ìgbẹ́kẹ̀lé sínú ohun tí a sọ.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: gbogbo ohun tí
  rationale: Ó pa ìtẹnumọ́ pé gbogbo ohun tí àwọn wòlíì sọ ni wọ́n yẹ kí wọ́n gbà gbọ́ mọ́.
- source_word: ἐλάλησαν
  choice: ti sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún ọ̀rọ̀ àwọn wòlíì, láìfi ìtumọ̀ míì kún un.
- source_word: οἱ προφῆται
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn aṣojú Ọlọ́run tó ń sọ ọ̀rọ̀ rẹ̀.
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Ó sì wí fún wọn pé
  rationale: Ó tẹ̀lé ìsopọ̀ ìtàn καί, ó sì jẹ́ ìṣílétí ọ̀rọ̀ tó bójú mu ní Yorùbá ọlọ́lá.
theological_decisions:
- issue: Irú ìbáwí tí Jésù ṣe
  choice: Ìbáwí náà kan àìní òye àti ọkàn tí kò tètè gba gbogbo ẹ̀rí àwọn wòlíì gbọ́.
  alternative: Kí a ka a sí ìdálẹ́bi ìwà búburú nìkan, tàbí sí àìlóye ọpọlọ nìkan.
  rationale: Àpapọ̀ ἀνόητοι, “ọkàn ... lọ́ra,” àti “gba ... gbọ́” fi hàn pé òye àti ìgbẹ́kẹ̀lé jọ wà níwájú; ìtumọ̀ náà pa méjèèjì mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa ọlọ́lá tí ó tún ṣeé lóye lójoojúmọ́. “Háà” mú ìmọ̀lára ìbáwí inú Ὦ jáde; “aláìlóye” yẹra fún ìbínú ẹ̀gàn tó lè wà nínú “òmùgọ̀”; a sì pa àwòrán “ọkàn” mọ́ nítorí pé ó ṣe pàtàkì sí ìtumọ̀ ẹsẹ náà.
