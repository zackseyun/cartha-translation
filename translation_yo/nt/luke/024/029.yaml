translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti ìtàn ni a lò. “Ilẹ̀ ti fẹ́ ṣú” àti “ọjọ́ ti wọ̀ lọ” jẹ́ àwọn gbólóhùn Yorùbá àdánidá tí ó pa ìlọsíwájú sí ìrọ̀lẹ́ àti àwòrán ọjọ́ tí ń rẹ̀ sílẹ̀ mọ́. Àmì ẹsẹ̀ [b] wà lẹ́yìn gbogbo ọ̀rọ̀ tí àlàyé rẹ̀ kan.
