source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: yo
  text: Wọ́n sì rọ̀ ọ́ gidigidi[a], wọ́n ní, “Dúró pẹ̀lú wa, nítorí ìrọ̀lẹ́ ti sún mọ́lé, ọjọ́ sì ti lọ jìnnà.”[b] Ó sì wọlé láti dúró pẹ̀lú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ́n fi taratara rọ̀ ọ́”; ní ìtumọ̀ àtijọ́, “wọ́n fi agbára rọ̀ ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nítorí ilẹ̀ ti fẹ́ ṣú, ọjọ́ sì ti wọ̀ lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: wọ́n rọ̀ ọ́ gidigidi
  rationale: Ọ̀rọ̀ náà ní àyíká yìí ń fi ìrọ̀ pẹ̀lú ìtẹnumọ́ hàn, kì í ṣe pé wọ́n fi ipá mú un. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìrọ̀ náà mọ́.
- source_word: Μεῖνον
  choice: Dúró
  rationale: Nínú àyíká àlejò yìí, “Dúró” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti bẹ ẹnì kan pé kí ó bá wọn wà fún ìrọ̀lẹ́.
- source_word: μεθ’ ἡμῶν
  choice: pẹ̀lú wa
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive túmọ̀ sí ìbákẹ́gbẹ́; “pẹ̀lú wa” ni ìtumọ̀ tààrà.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: nítorí ilẹ̀ ti fẹ́ ṣú
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún ìrọ̀lẹ́ tí ó ń sún mọ́lé, ó sì pa ìtumọ̀ πρὸς mọ́ pé ìrọ̀lẹ́ ń sún mọ́lé dípò pé ó ti dé tán.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: ọjọ́ sì ti wọ̀ lọ
  rationale: “Ọjọ́ ti wọ̀ lọ” jẹ́ àpẹẹrẹ ọ̀rọ̀ Yorùbá tó bójú mu fún ọjọ́ tí ó ti ń parí, ó sì pa àwòrán κλίνω mọ́ ní èdè àdánidá.
- source_word: εἰσῆλθεν
  choice: Ó sì wọlé
  rationale: “Wọlé” túmọ̀ sí pé ó wọ inú ilé tàbí ibi tí wọn yóò dúró, ó sì jẹ́ ọ̀rọ̀ ìtàn Yorùbá tó ṣe déédé.
- source_word: τοῦ μεῖναι
  choice: láti dúró
  rationale: Articular infinitive náà ń ṣàfihàn ète níbí; “láti dúró” pa ìbámu mọ́ pẹ̀lú àṣẹ “Dúró.”
- source_word: σὺν αὐτοῖς
  choice: pẹ̀lú wọn
  rationale: σύν ń tọ́ka sí ìbákẹ́gbẹ́; “pẹ̀lú wọn” ni ìtumọ̀ Yorùbá tó ṣe déédé.
