  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: yo
  text: Nígbà náà ni ó ṣí ọgbọ́n wọn kí wọn lè lóye Ìwé Mímọ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ṣí òye wọn,” dípò “ó ṣí ọgbọ́n wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti lè lóye Ìwé Mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀lé ìṣẹ̀lẹ̀ inú ìtàn hàn lọ́nà àdánidá ní Yorùbá.
- source_word: διήνοιξεν
  choice: ó ṣí ... sílẹ̀
  rationale: Ó pa àwòrán ìṣe náà mọ́ pé ó ‘ṣí’ ohun kan, dípò yíyí i padà sí ‘ó mú wọn lágbára’ tàbí àlàyé míì.
- source_word: αὐτῶν τὸν νοῦν
  choice: ọkàn wọn
  rationale: Ní Yorùbá, ‘ọkàn’ lè tọ́ka sí agbára inú ènìyàn láti ronú àti láti lóye; ó sì bá àwòrán ‘ṣí’ mu lọ́nà àdánidá. ‘Òye wọn’ tún ṣeé ṣe.
- source_word: τοῦ συνιέναι
  choice: kí wọn lè lóye
  rationale: Ó sọ ète tàbí àbájáde infinitive Gíríìkì náà di mímọ́ ní Yorùbá láìfi ìtumọ̀ àfikún kún un.
- source_word: τὰς γραφάς
  choice: Ìwé Mímọ́
  rationale: Nínú àyíká Lúùkù–Ìṣe, ọ̀rọ̀ náà ń tọ́ka sí àwọn ìwé mímọ́ Ísírẹ́lì tí a gbà gẹ́gẹ́ bí Ìwé Mímọ́.
theological_decisions:
- issue: Irú ìṣe Jésù nínú ṣíṣí agbára òye wọn
  choice: A pa gbólóhùn tààrà náà mọ́ pé ‘ó ṣí ọkàn wọn sílẹ̀,’ láìfi ẹ̀kọ́ ìsìn àfikún sí i.
  alternative: Ó mú wọn lè lóye; ó ṣàlàyé Ìwé Mímọ́ fún wọn.
  rationale: Gíríìkì sọ pé Jésù ṣí νοῦς wọn fún lílóye Ìwé Mímọ́. Ìtumọ̀ yìí pa ẹ̀rí náà àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn tó wà nínú rẹ̀ mọ́, láìdín un kù sí ṣíṣe àlàyé lásán.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ọkàn wọn’ jẹ́ àdánidá pẹ̀lú ọ̀rọ̀-ìṣe ‘ṣí ... sílẹ̀,’ nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ‘òye wọn’ mọ́ gẹ́gẹ́ bí àṣàyàn lexical.
