  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: ‘wọ́n sì padà’ ń ṣàfihàn participle ὑποστρέψασαι ní ìbáṣepọ̀ pẹ̀lú ìṣe àkọ́kọ́; ‘láti ibojì náà’ jẹ́ μνημείου; ‘wọ́n sì ròyìn’ jẹ́ ἀπήγγειλαν; ‘gbogbo nǹkan wọ̀nyí’ jẹ́ ταῦτα πάντα; àti àwọn olùgbọ́ méjèèjì—‘àwọn mọ́kànlá náà’ àti ‘gbogbo àwọn yòókù’—wà ní kíkún. Arọ́pò-orúkọ ‘wọ́n’ kò lè fi abo hàn ní Yorùbá, ṣùgbọ́n ó pa ìtọ́kasí àyíká sí àwọn obìnrin mọ́ láìfi orúkọ kún orísun.'
