id: LUK.24.9
reference: Luke 24:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: yo
  text: Wọ́n sì padà láti ibojì náà, wọ́n sì ròyìn gbogbo nǹkan wọ̀nyí fún àwọn mọ́kànlá náà àti fún gbogbo àwọn yòókù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: wọ́n sì padà
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist active, feminine plural, ó sì ń tọ́ka sí àwọn obìnrin inú àyíká ọ̀rọ̀ tó ṣáájú. Yorùbá kì í fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ‘wọ́n’; lílo gbólóhùn aláìlẹ́gbẹ́ yìí mú ìtẹ̀síwájú ìtàn náà ṣe kedere ní èdè àdánidá.
- source_word: μνημείου
  choice: ibojì náà
  rationale: ‘Ibojì’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ibi tí a sin Jésù; ‘náà’ fi article pàtó inú Gíríìkì hàn.
- source_word: ἀπήγγειλαν
  choice: wọ́n sì ròyìn
  rationale: ‘Ròyìn’ túmọ̀ sí fífi ohun tí ẹni rí tàbí gbọ́ tó àwọn ẹlòmíràn létí, ó sì bá iṣẹ́ ἀπαγγέλλω mu láìjẹ́ kí ìṣe náà dà bí ìkéde fún gbogbo ènìyàn.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Èyí pa agbára πάντα (‘gbogbo’) àti demonstrative ταῦτα (‘wọ̀nyí’) mọ́.
- source_word: τοῖς ἕνδεκα
  choice: fún àwọn mọ́kànlá náà
  rationale: A kò fi ‘àpọ́sítélì’ kún un, nítorí pé Gíríìkì sọ ‘àwọn mọ́kànlá’ nìkan. ‘Náà’ jẹ́ kí ó hàn pé ẹgbẹ́ tí a ti mọ̀ ni.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: fún gbogbo àwọn yòókù
  rationale: Ọ̀rọ̀ yìí pa ìyàtọ̀ tó wà láàárín àwọn mọ́kànlá àti gbogbo àwọn mìíràn tó wà níbẹ̀ mọ́.
theological_decisions:
- issue: Ẹni tí participle feminine plural àti ọ̀rọ̀-ìṣe plural ń tọ́ka sí
  choice: Arọ́pò-orúkọ ‘wọ́n’ ń tọ́ka sí àwọn obìnrin tí wọ́n lọ sí ibojì gẹ́gẹ́ bí àyíká ọ̀rọ̀ tó ṣáájú.
  alternative: Láti fi ‘àwọn obìnrin náà’ sínú ẹsẹ yìí ní tààràtà.
  rationale: Gíríìkì fi abo wọn hàn nínú gírámà, ṣùgbọ́n arọ́pò-orúkọ Yorùbá kò ní ìyàtọ̀ akọ àti abo. Fífi orúkọ ‘àwọn obìnrin’ kún un yóò ṣe ohun tó fara sin nínú Gíríìkì ní gbangba ju bí orísun ṣe sọ ọ́ lọ.
- issue: Orúkọ ìdánimọ̀ ẹgbẹ́ àwọn ọmọ-ẹ̀yìn pàtàkì
  choice: àwọn mọ́kànlá náà
  alternative: àwọn àpọ́sítélì mọ́kànlá náà
  rationale: Orísun Gíríìkì lo nọ́ńbà náà gẹ́gẹ́ bí orúkọ ẹgbẹ́ láìfi ‘àpọ́sítélì’ kún un; ìtumọ̀ náà pa ìṣókí àti ìtumọ̀ pàtó yẹn mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó yẹ. Ìtòlẹ́sẹẹsẹ gbólóhùn méjì pẹ̀lú ‘sì’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàfihàn ìsopọ̀ participle àti ọ̀rọ̀-ìṣe pàtàkì inú Gíríìkì.
