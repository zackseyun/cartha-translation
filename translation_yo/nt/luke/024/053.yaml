  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: yo
  text: Wọ́n sì ń wà ní tẹ́ńpìlì nígbà gbogbo, wọ́n ń bùkún fún Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń yin Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà ní “bùkún fún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ̀ ìparí yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: ἦσαν διὰ παντός
  choice: wọ́n ń wà ... nígbà gbogbo
  rationale: Àpẹẹrẹ ọ̀rọ̀ yìí fi ipò tó ń bá a lọ àti ìṣe tí wọ́n ń ṣe déédéé hàn; àkójọpọ̀ ‘ń wà’ àti ‘nígbà gbogbo’ mú agbára imperfect àti διὰ παντός jáde.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: εὐλογοῦντες
  choice: wọ́n ń súre fún
  rationale: εὐλογέω túmọ̀ ní ìpìlẹ̀ sí ‘súre fún’ tàbí ‘sọ̀rọ̀ rere nípa.’ Nígbà tí Ọlọ́run jẹ́ ẹni tí a ń ṣe é sí, Yorùbá lè sọ ‘súre fún Ọlọ́run,’ bí ó tilẹ̀ jẹ́ pé ‘yin Ọlọ́run’ túbọ̀ wọ́pọ̀.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ó jẹ́ object tààrà fún εὐλογοῦντες; ‘Ọlọ́run’ ni ìtumọ̀ Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Èdè ìjọsìn εὐλογοῦντες τὸν θεόν
  choice: wọ́n ń súre fún Ọlọ́run
  alternative: wọ́n ń yin Ọlọ́run
  rationale: ‘Súre fún’ pa ìtumọ̀ lexical εὐλογέω mọ́, dípò kí a sọ ọ́ di ọ̀rọ̀ ìyìn lásán. Síbẹ̀, ní àyíká yìí, ‘yin Ọlọ́run’ jẹ́ ìtumọ̀ Yorùbá tó ṣeé gbà, torí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Tẹ́ńpìlì’ ni a lò fún gbogbo àgbègbè ἱερόν.
