- from: Nígbà náà ni ojú wọn là, wọ́n sì dá a mọ̀; ó sì di ẹni àìrí lójú wọn.[a]
  to: Nígbà náà ni ojú wọn là, wọ́n sì dá a mọ̀; ó sì di àìrí lójú wọn.[a]
  rationale: The revision replaces the mildly stiff “di ẹni àìrí” with the more natural predicate “di àìrí,” preserving γίνομαι (‘became’) and ἄφαντος (‘unseen/invisible’) without asserting how Jesus ceased to be seen. The footnote’s disappearance alternative is adjusted to specify departure from their sight, matching the visual force of the source expression.
