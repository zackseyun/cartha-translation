review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the passive opening of the disciples’ eyes, their recognition of Jesus, and the deliberately non-mechanistic sense of ἄφαντος ἐγένετο ἀπ’ αὐτῶν. The proposed revision preserves these points while making the final Yoruba clause more idiomatic.
  naturalness: “Ojú wọn là” and “wọ́n sì dá a mọ̀” are natural Standard Yoruba. In this context, however, “ó sì di ẹni àìrí lójú wọn” is somewhat stiff and can suggest that Jesus became a particular kind of ‘invisible person.’ “Ó sì di àìrí lójú wọn” is smoother Yoruba while retaining ‘became’ and the relational ‘from/before their sight.’
  terminology: No doctrinally loaded terminology is introduced. “Dá a mọ̀” appropriately expresses recognition, and “di àìrí lójú wọn” preserves the Greek narrative ambiguity without specifying disappearance’s mechanism.
  issues:
  - severity: low
    issue: The expression “ẹni àìrí” is slightly unnatural in this predicate context.
    rationale: Although understandable, it can be read as a fixed description (‘an invisible person’) rather than the change-of-state expressed by ἄφαντος ἐγένετο. Removing ẹni yields a more idiomatic Yoruba rendering while retaining the source sense.
  - severity: low
    issue: The first alternative in the footnote is better anchored to sight rather than merely proximity.
    rationale: “Kúrò lọ́dọ̀ wọn” can mean leaving their presence, whereas the Greek expression concerns no longer being visible to them. “Kúrò ní ojú wọn” makes the alternative’s visual sense explicit.
  revised_text: Nígbà náà ni ojú wọn là, wọ́n sì dá a mọ̀; ó sì di àìrí lójú wọn.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “ó sì pòórá kúrò ní ojú wọn,” tàbí “wọn kò sì rí i mọ́.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the mildly stiff “di ẹni àìrí” with the more natural predicate “di àìrí,” preserving γίνομαι (‘became’) and ἄφαντος (‘unseen/invisible’) without asserting how Jesus ceased to be seen. The footnote’s disappearance alternative is adjusted to specify departure from their sight, matching the visual force of the source expression.
