id: LUK.24.31
reference: Luke 24:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: yo
  text: Nígbà náà ni ojú wọn là, wọ́n sì dá a mọ̀; ó sì di àìrí lójú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì pòórá kúrò ní ojú wọn,” tàbí “wọn kò sì rí i mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: ojú wọn là
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist passive ti διανοίγω. “Ojú wọn là” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé agbára láti mọ ẹni tí wọ́n ń wò ni a fún wọn, kì í ṣe pé àwọn fúnra wọn ló mú un ṣẹlẹ̀.
- source_word: οἱ ὀφθαλμοὶ
  choice: ojú wọn
  rationale: Èyí túmọ̀ gẹ́gẹ́ bí àpólà oníhun tó jẹ́ àdánidá ní Yorùbá, ó sì pa “àwọn ojú” gẹ́gẹ́ bí olùwà mọ́.
- source_word: ἐπέγνωσαν
  choice: wọ́n sì dá a mọ̀
  rationale: Nínú àyíká ìtàn Emmausi, ἐπιγινώσκω túmọ̀ sí pé wọ́n wá mọ ẹni tí wọn kò tíì dá mọ̀ tẹ́lẹ̀; “dá a mọ̀” sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: ἄφαντος
  choice: ẹni àìrí
  rationale: ἄφαντος tọ́ka sí ẹni tí a kò lè rí tàbí ẹni tí kò sí ní ojú ẹni. “Ẹni àìrí” tẹ̀ lé ìtumọ̀ náà láìsọ bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: ó sì di … lójú wọn
  rationale: “Ó sì di” pa agbára γίνομαι mọ́, “lójú wọn” sì fi ìbáṣepọ̀ tí ἀπό ní nínú gbólóhùn yìí hàn ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: δὲ ń gbé ìtàn lọ sí ohun tó ṣẹlẹ̀ lẹ́yìn náà; “Nígbà náà ni” jẹ́ àsopọ̀ ìtàn tó ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bí Jésù ṣe di ẹni tí wọn kò rí
  choice: ó sì di ẹni àìrí lójú wọn
  alternative: ó sì pòórá kúrò lọ́dọ̀ wọn; wọn kò sì rí i mọ́
  rationale: Gíríìkì lo ἄφαντος pẹ̀lú γίνομαι, ó sì sọ pé Jésù di ẹni tí wọn kò rí láìṣàlàyé ọ̀nà tàbí ẹ̀rọ tí ìṣẹ̀lẹ̀ náà gbà ṣẹlẹ̀. Ìtumọ̀ yìí pa àdììtú ìtàn náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbo. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó bá yẹ, a sì yàgò fún gbólóhùn tó lè ṣàlàyé bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀ ju ohun tí Gíríìkì sọ lọ.
