id: LUK.24.50
reference: Luke 24:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: yo
  text: Nígbà náà, ó mú wọn jáde títí dé Bẹ́tánì[a]; ó sì gbé ọwọ́ rẹ̀ méjèèjì sókè, ó súre fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘sí Bẹ́tánì’ tàbí ‘sí agbègbè Bẹ́tánì’; gbólóhùn Gíríìkì náà ní ẹ̀kúnrẹ́rẹ́ díẹ̀, ní tààràtà, ‘títí dé apá ọ̀dọ̀ Bẹ́tánì.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: ó mú wọn jáde
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú tàbí ṣíṣáájú ẹni jáde. ‘Ó mú wọn jáde’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìtọ́sọ́nà jáde mọ́.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kì í ṣe pé ó ń fi ohun méjì tako ara wọn.
- source_word: ἕως πρὸς Βηθανίαν
  choice: títí dé Bẹ́tánì
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìrìn dé ibi tàbí agbègbè Bẹ́tánì. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú díẹ̀ tí ọ̀rọ̀ ìpilẹ̀ ní mọ́.
- source_word: Βηθανίαν
  choice: Bẹ́tánì
  rationale: Àkọsílẹ̀ orúkọ ibì kan ní ìbámu pẹ̀lú ìró àti àṣà ìkọ̀wé Yorùbá.
- source_word: ἐπάρας
  choice: ó sì gbé ... sókè
  rationale: Ó ṣàpèjúwe ìṣe tí ó ṣáájú tàbí bá ìbùkún náà lọ. Àgbékalẹ̀ gbolohun Yorùbá yìí ṣe kedere, ó sì jẹ́ ti ẹ̀dá.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: ọwọ́ rẹ̀ méjèèjì
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, ‘àwọn ọwọ́ rẹ̀.’ ‘Ọwọ́ rẹ̀ méjèèjì’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti fi hàn pé ọwọ́ méjèèjì ni ó gbé sókè.
- source_word: εὐλόγησεν
  choice: ó súre fún wọn
  rationale: Nínú àyíká yìí, εὐλογέω túmọ̀ sí pípe ìbùkún sórí àwọn ọmọ-ẹ̀yìn. ‘Súre fún’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe yìí láìfikún àṣà ìjọ tàbí ẹ̀kọ́ ìsìn kan.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí àwọn ọmọ-ẹ̀yìn tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Irú ìṣe Jésù nígbà tí ó ń súre fún àwọn ọmọ-ẹ̀yìn
  choice: ó súre fún wọn
  alternative: ó kéde ìbùkún lé wọn lórí
  rationale: Ìtumọ̀ náà pa ìṣe ìbùkún mọ́ ní ọ̀nà tó rọrùn, láìsọ ọ́ di àkànṣe ètò ìsìn tàbí ipò àlùfáà kan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. Semicolon náà ya ìrìn jáde sí Bẹ́tánì kúrò ní ìṣe gbígbé ọwọ́ sókè àti sísúre.
