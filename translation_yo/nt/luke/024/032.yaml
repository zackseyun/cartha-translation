  source_fidelity: Ìtumọ̀ náà pa ìbéèrè tí ó ń retí ìdáhùn bẹ́ẹ̀, àwòrán ọkàn tí ń jó, ìṣe tí ó ń lọ lọ́wọ́ nínú àwọn imperfect méjèèjì, àti ‘Ìwé Mímọ́’ mọ́. Ṣùgbọ́n ‘bi ara wọn’ túmọ̀ sí pé wọ́n béèrè lọ́wọ́ ara wọn, níbi tí εἶπαν jẹ́ ‘wọ́n wí’; bákan náà, ‘kò máa ń jó’ ń fi ìṣe àṣà/habitual hàn dípò ìṣe tí ń ṣẹlẹ̀ nígbà náà.
  naturalness: ‘Wọ́n sì wí fún ara wọn’ àti ‘kò ń jó’ jẹ́ Yorùbá ìpele-giga tí ó dára fún ìwé mímọ́ àti kíkà ní gbangba. ‘Ń ṣí Ìwé Mímọ́ sílẹ̀ fún wa’ pa àwòrán ìṣí náà mọ́ láìfi ‘payá’ kún un nínú ọ̀rọ̀ àkọ́kọ́.
  terminology: ‘Ọkàn,’ ‘Ìwé Mímọ́,’ àti ‘lójú ọ̀nà’ bójú mu. A tún ṣe àtúnṣe àlàyé akọ́silẹ̀ (c) kí ó bá ọ̀rọ̀ àkọ́kọ́ mu, kí ó sì má ṣe pe ohun tí kì í ṣe ìtumọ̀ tààrà ní ìtumọ̀ tààrà.
