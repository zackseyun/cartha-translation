  to: Wọ́n sì wí fún ara wọn pé, “Ṣé ọkàn wa kò ń jó nínú wa[a] bí ó ti ń bá wa sọ̀rọ̀ lójú ọ̀nà[b], bí ó ti ń ṣí Ìwé Mímọ́ sílẹ̀ fún wa[c]?”
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀-ìṣe ‘béèrè’ pẹ̀lú ‘wí’ gẹ́gẹ́ bí εἶπαν, yọ ‘máa ń’ kúrò kí ìṣe tí ń lọ lọ́wọ́ má bàa di habitual, ó sì pa àwòrán ‘ṣí’ fún διανοίγω mọ́. Àwọn akọ́silẹ̀ náà ti wà ní ìbámu pẹ̀lú ọ̀rọ̀ àkọ́kọ́ àti àwọn àṣàyàn tó ṣeé ṣe ní Yorùbá.
