id: LUK.24.32
reference: Luke 24:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: yo
  text: Wọ́n sì wí fún ara wọn pé, “Ṣé ọkàn wa kò ń jó nínú wa[a] bí ó ti ń bá wa sọ̀rọ̀ lójú ọ̀nà[b], bí ó ti ń ṣí Ìwé Mímọ́ sílẹ̀ fún wa[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì lo ‘ọkàn wa’ ní ẹyọ; Yorùbá tún lè lo ‘ọkàn wa kọ̀ọ̀kan.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní ọ̀nà.’
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, ‘ń ṣí Ìwé Mímọ́ sílẹ̀ fún wa’; nínú àyíká yìí, ó ń tọ́ka sí mímú ìtumọ̀ Ìwé Mímọ́ yé wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: bi ara wọn pé
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn méjèèjì ń bá ara wọn sọ̀rọ̀; ó jẹ́ ọ̀nà àdánidá láti sọ reciprocal expression náà ní Yorùbá.
- source_word: Οὐχὶ
  choice: Ṣé ... kò
  rationale: Ó dá ìbéèrè tí ó ń retí ìdáhùn bẹ́ẹ̀ ni sílẹ̀, gẹ́gẹ́ bí Gíríìkì.
- source_word: ἡ καρδία ἡμῶν
  choice: ọkàn wa
  rationale: A pa singular Gíríìkì mọ́; Yorùbá sì lè lo ‘ọkàn wa’ lọ́nà àdánidá fún ìrírí inú tí wọ́n jọ ní.
- source_word: καιομένη
  choice: máa ń jó
  rationale: Ó pa àwòrán iná Gíríìkì mọ́, kò sì sọ ìrírí náà di ìmọ̀lára tàbí ìmọ́lẹ̀ ọkàn nìkan.
- source_word: ἐν ἡμῖν
  choice: nínú wa
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì tọ́ka sí ìrírí inú.
- source_word: ἐλάλει
  choice: ń bá wa sọ̀rọ̀
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ní ìbámu pẹ̀lú imperfect Gíríìkì.
- source_word: ἐν τῇ ὁδῷ
  choice: lójú ọ̀nà
  rationale: Ó jẹ́ gbolohun Yorùbá àdánidá fún ohun tó ṣẹlẹ̀ nígbà ìrìn àjò lórí ọ̀nà.
- source_word: διήνοιγεν
  choice: ń ṣí ... payá
  rationale: Ó pa àwòrán ‘ṣí’ mọ́, nígbà tí ‘payá’ mú kí ìtumọ̀ ìṣípayá ohun tí Ìwé Mímọ́ túmọ̀ sí ṣe kedere láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τὰς γραφάς
  choice: Ìwé Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì, fún àwọn ìwé mímọ́ tí ọ̀rọ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Àwòrán ‘ọkàn tí ń jó’
  choice: Pa àwòrán náà mọ́ gẹ́gẹ́ bí ‘ọkàn wa ... ń jó nínú wa.’
  alternative: ‘Inú wa dùn gidigidi’ tàbí ‘ọkàn wa balẹ̀ mọ́lẹ̀.’
  rationale: Ọ̀rọ̀ náà kò sọ bóyá ìmọ̀lára, ìmúnilọ́kànsókè ti ẹ̀mí, tàbí òye ni iná náà dúró fún; pípa àwòrán náà mọ́ ń dáàbò bo àìdájú àti ìfúnpá ẹ̀kọ́ inú ẹsẹ náà.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì bójú mu fún kíkà ní gbangba. A pa ìbéèrè rhetorical, imperfect aspect, àti àwòrán ọkàn tí ń jó mọ́.
