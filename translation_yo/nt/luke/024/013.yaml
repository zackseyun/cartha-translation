source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: yo
  text: Sì wò ó, ní ọjọ́ náà gan-an, àwọn méjì nínú wọn ń lọ sí abúlé kan, tí ó jìnnà sí Jerúsálẹ́mù ní ọgọ́ta sítádíónì,[a] tí orúkọ rẹ̀ ń jẹ́ Ẹ́máúsì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sítádíónì jẹ́ òṣùwọ̀n jíjìn ní ayé àtijọ́; ọgọ́ta sítádíónì fẹ́rẹ̀ẹ́ tó máìlì méje tàbí kìlómítà mọ́kànlá.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Sì kíyè sí i
  rationale: Ó pa àmì ìtàn Lúùkù mọ́, ó sì pe olùkà láti fiyè sí ohun tí ó tẹ̀ lé ní ọ̀nà Yorùbá tí ó bójú mu.
- source_word: δύο ἐξ αὐτῶν
  choice: àwọn méjì lára wọn
  rationale: Ó fi ìtumọ̀ apá kan nínú ẹgbẹ́ hàn láì sọ ẹni tí ‘wọn’ jẹ́ ní pàtó ju orísun lọ.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: ní ọjọ́ náà gan-an
  rationale: ‘Gan-an’ mú ìtẹnumọ́ inú gbolohun Gíríìkì jáde ní èdè Yorùbá àdánidá.
- source_word: ἦσαν πορευόμενοι
  choice: ń lọ
  rationale: Ìṣe aláìparí náà fi ìrìn tí ń lọ lọ́wọ́ ní àkókò ìtàn hàn; àyíká ọ̀rọ̀ ti fi hàn pé ó ṣẹlẹ̀ nígbà àtijọ́.
- source_word: εἰς κώμην
  choice: sí abúlé kan
  rationale: ‘Abúlé’ bá κώμη mu, ‘sí’ sì jẹ́ ọ̀nà àdánidá láti fi ibi tí wọ́n ń lọ hàn.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: tí ó jìnnà sí Jerúsálẹ́mù ní ọgọ́ta sítádíónì
  rationale: Ó pa òṣùwọ̀n ayé àtijọ́ inú orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ìṣírò òde òní.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: orúkọ abúlé náà sì ni Ẹ́máúsì
  rationale: Ó pa ìsọfúnni orúkọ tí ó ṣe kedere nínú Gíríìkì mọ́, ó sì dára ní Yorùbá ju àtúmọ̀ gírámà tó le koko lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘kíyè sí i’ gẹ́gẹ́ bí àmì ìfiyèsí ìtàn, a sì pa sítádíónì mọ́ nínú ọ̀rọ̀ pẹ̀lú àlàyé òde òní ní àlàyé ìsàlẹ̀ ojú ìwé.
