  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: yo
  text: Wọ́n sì dìde ní wákàtí náà gan-an, wọ́n padà sí Jerúsálẹ́mù, wọ́n sì rí àwọn Mọ́kànlá àti àwọn tí ó wà pẹ̀lú wọn tí wọ́n ti péjọ pọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ti kóra jọ.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe wọn gẹ́gẹ́ bí àwọn tí ó ti wà ní ìpéjọ nígbà tí wọ́n rí wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: wọ́n sì dìde
  rationale: Ó fi ìṣe tí ó ṣáájú ìpadà wọn hàn ní ọ̀nà àdánidá, láìfi ìtumọ̀ kún un.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ní wákàtí náà gan-an
  rationale: Ó pa ìtọ́kasí sí àkókò pàtó náà àti ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὑπέστρεψαν
  choice: wọ́n padà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún pípadà sí ibi tí wọ́n ti wá.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Àkọ̀tọ́ orúkọ ibìkan náà ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: εὗρον
  choice: wọ́n sì rí
  rationale: Ó túmọ̀ ìṣe rírí àwọn ènìyàn náà ní ọ̀nà tó ṣe tààrà, tó sì bá ìtàn mu.
- source_word: ἠθροισμένους
  choice: tí wọ́n ti péjọ pọ̀
  rationale: ‘Ti’ fi ipò tí ó ti wà níbẹ̀ nígbà tí wọ́n rí wọn hàn; ‘péjọ pọ̀’ sì pa ìtumọ̀ ìkójọpọ̀ mọ́.
- source_word: τοὺς ἕνδεκα
  choice: àwọn Mọ́kànlá
  rationale: Ó pa àkọlé ẹgbẹ́ náà mọ́ láìfi ‘àwọn aposteli’ kún ohun tí Gíríìkì kò sọ.
- source_word: τοὺς σὺν αὐτοῖς
  choice: àwọn tí ó wà pẹ̀lú wọn
  rationale: Ó tọ́ka sí àwọn mìíràn tó wà pẹ̀lú àwọn Mọ́kànlá láìsọ irú ẹni tí wọ́n jẹ́ ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Ìtọ́kasí ‘àwọn Mọ́kànlá’ bí ó tilẹ̀ jẹ́ pé Júdásì kò sí mọ́, ó sì ṣeé ṣe kí Tọ́másì má sí níbẹ̀
  choice: Pa ‘àwọn Mọ́kànlá’ mọ́ gẹ́gẹ́ bí àkọlé ẹgbẹ́ náà.
  alternative: ‘àwọn aposteli mọ́kànlá’ tàbí ‘àwọn ọmọ-ẹ̀yìn tó ṣẹ́ kù’
  rationale: τοὺς ἕνδεκα jẹ́ orúkọ tí a fi ń dá ẹgbẹ́ náà mọ̀. Ìtumọ̀ yìí kò ṣe àfikún láti mú iye àwọn tó wà níbẹ̀ bá ìtàn mìíràn mu.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní ọlá, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tó túmọ̀ ἠθροισμένους, nítorí ibẹ̀ ni àlàyé náà kan.
