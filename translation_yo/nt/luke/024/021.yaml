id: LUK.24.21
reference: Luke 24:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: yo
  text: Ṣùgbọ́n àwa ti ń retí pé òun ni ẹni tí yóò ra Ísírẹ́lì padà[a][b]. Síbẹ̀, láfikún gbogbo èyí, ó ti di ọjọ́ kẹta báyìí láti ìgbà tí nǹkan wọ̀nyí ti ṣẹlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ẹni tí a ń retí pé yóò ra Ísírẹ́lì padà.” Gíríìkì lo ọ̀rọ̀-ìṣe present (“ni”) nínú ohun tí ìrètí wọn àtijọ́ dá lé.
    reason: alternative_reading
  - marker: b
    text: “Ra Ísírẹ́lì padà” lè tọ́ka ní gbígbòòrò sí ìdáǹdè tí wọ́n ń retí lọ́wọ́ Mèsáyà; ẹsẹ̀ náà kò sọ ní pàtó bóyá ìdáǹdè ìṣèlú, ìgbàlà ẹ̀mí, tàbí àwọn méjèèjì ni wọ́n ní lọ́kàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ṣùgbọ́n àwa
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn, “àwa” sì pa ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ náà mọ́.
- source_word: ἠλπίζομεν
  choice: ti ń retí
  rationale: Àkókò imperfect náà ń tọ́ka sí ìrètí tí ó ń bá a lọ ní àtijọ́, tí àwọn ìṣẹ̀lẹ̀ sì ti mú kí ó dà bí ìrètí tí ó já sí pàbó.
- source_word: ὅτι αὐτός ἐστιν
  choice: pé òun ni
  rationale: Àpólà yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹnumọ́ αὐτός mọ́. Ọ̀rọ̀ àsopọ̀ “ni” kò fi àmì àkókò hàn, nítorí náà kò fi tipátipá yí present ἐστιν padà sí àkókò àtijọ́.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: ẹni tí yóò ra … padà
  rationale: “Yóò” fi iṣẹ́ tí wọ́n ń retí sí iwájú hàn; “ra … padà” sì jẹ́ ọ̀nà Yorùbá tí ó pa ìtumọ̀ ìràpadà mọ́ láì dín un kù sí òmìnira ìṣèlú tàbí ìgbàlà ẹ̀mí nìkan.
- source_word: τὸν Ἰσραήλ
  choice: Ísírẹ́lì
  rationale: Ó tọ́ka tààrà sí àwọn ènìyàn májẹ̀mú náà gẹ́gẹ́ bí odindi kan.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Síbẹ̀, láfikún gbogbo èyí
  rationale: Ó mú ìyàtọ̀ àti àfikún ohun mìíràn tí ń kó ìrẹ̀wẹ̀sì bá wọn jáde ní Yorùbá tó ṣe déédé.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: ó ti di ọjọ́ kẹta báyìí
  rationale: Èyí tú ọ̀rọ̀-àṣà Gíríìkì nípa bí àkókò ṣe ń kọjá sí Yorùbá àdánidá.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: láti ìgbà tí nǹkan wọ̀nyí ti ṣẹlẹ̀
  rationale: Ó pa ibi tí wọ́n ti bẹ̀rẹ̀ sí í ka àkókò àti ìṣẹ̀lẹ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìrètí Mèsáyà nínú λυτροῦσθαι τὸν Ἰσραήλ
  choice: ra Ísírẹ́lì padà
  alternative: gba Ísírẹ́lì sílẹ̀; gba Ísírẹ́lì là
  rationale: Ọ̀rọ̀ náà lè gba ìdáǹdè orílẹ̀-èdè àti ìgbàlà ní ìtumọ̀ gbígbòòrò; ẹsẹ̀ náà kò sọ ọ̀nà ìràpadà náà di ọ̀kan pàtó.
- issue: Agbára àkókò ἐστιν lẹ́yìn ἠλπίζομεν
  choice: pé òun ni ẹni tí yóò…
  alternative: pé òun ni ẹni tí ì bá ra… padà
  rationale: “Ni” ní Yorùbá kò ní àmì àkókò, nítorí náà ó lè pa present Gíríìkì mọ́ láàrín ohun tí wọ́n ń retí, nígbà tí “ti ń retí” fi ipò ìrètí wọn ní àtijọ́ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ti ń retí” fún ìrètí tí ó ń bá a lọ ní àtijọ́, “pé òun ni” fún ìtẹnumọ́ tí kò fipá yí àkókò Gíríìkì padà, àti “ó ti di ọjọ́ kẹta báyìí” fún ọ̀rọ̀-àṣà nípa bí àkókò ṣe ń kọjá.
