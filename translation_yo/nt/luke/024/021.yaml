  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: “Ṣùgbọ́n àwa ti ń retí” ń gbé imperfect ἠλπίζομεν kalẹ̀ gẹ́gẹ́ bí ìrètí àtijọ́ tí ó ń bá a lọ; “pé òun ni” ń pa ìtẹnumọ́ αὐτός àti present ἐστιν mọ́ láì fi àmì àkókò tí Yorùbá kò béèrè sí i. “ẹni tí yóò ra Ísírẹ́lì padà” jẹ́ ìtumọ̀ tó bójú mu fún ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ, ó sì dá ìtumọ̀ ìràpadà sílẹ̀ ní gbígbòòrò. Gbólóhùn àkókò ìkẹyìn tún jẹ́ olóòtọ́ sí τρίτην ... ἡμέραν ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.'
