  text: You are witnesses of these things[a].
translation:
  language: yo
  text: Ẹ̀yin ni ẹlẹ́rìí sí àwọn nǹkan wọ̀nyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin ni ẹlẹ́rìí àwọn nǹkan wọ̀nyí.” Ọ̀rọ̀ atọ́ka Gíríìkì náà tọ́ka sí àwọn ìṣẹ̀lẹ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ nípa wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ yìí fara hàn gbangba fún ìtẹnumọ́; “Ẹ̀yin” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹnumọ́ náà hàn.
- source_word: ἐστε
  choice: ni
  rationale: Nínú gbólóhùn ìdánimọ̀ Yorùbá, “ni” ló sọ ní ti ẹ̀dá pé àwọn tí a ń bá sọ̀rọ̀ jẹ́ ẹlẹ́rìí.
- source_word: μάρτυρες
  choice: ẹlẹ́rìí
  rationale: Ó túmọ̀ sí àwọn tí ń jẹ́rìí sí ohun tí wọ́n rí tàbí gbọ́; “ẹlẹ́rìí” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká Lúùkù mu láìfi ìtumọ̀ ikú-ajẹ́rìíkú kún un.
- source_word: τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ atọ́ka ẹlẹ́yà ọ̀pọ̀ yìí tọ́ka padà sí àwọn ìṣẹ̀lẹ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ; “àwọn nǹkan wọ̀nyí” ṣe ìtọ́kasí náà kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ipa àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí μάρτυρες
  choice: Ẹsẹ̀ náà dá àwọn ọmọ-ẹ̀yìn mọ̀ gẹ́gẹ́ bí àwọn tí yóò jẹ́rìí sí àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ.
  alternative: A lè ka ọ̀rọ̀ náà pẹ̀lú ìró ìtumọ̀ Kristẹni tó wáyé lẹ́yìn náà nípa ikú ajẹ́rìíkú.
  rationale: Nínú àyíká lẹ́sẹ̀kẹsẹ̀, ohun tí Jésù ń sọ ni jíjẹ́rìí sí ìjìyà rẹ̀, àjíǹde rẹ̀, àti ìkéde ìrònúpìwàdà àti ìdáríjì ẹ̀ṣẹ̀. Nítorí náà, a kò gbọ́dọ̀ fi ìtumọ̀ ikú ajẹ́rìíkú tó dàgbà lẹ́yìn náà wọ ẹsẹ̀ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹlẹ́rìí” ní ẹyọ gẹ́gẹ́ bí orúkọ ipa lẹ́yìn “ẹ̀yin,” bí ó ṣe jẹ́ àdánidá ní Yorùbá; ìtumọ̀ rẹ̀ jẹ́ ọ̀pọ̀ nínú àyíká náà.
