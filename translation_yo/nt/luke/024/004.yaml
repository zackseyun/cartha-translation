  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí wọ́n wà nínú ìdàrúdàpọ̀ nípa èyí, wò ó, ọkùnrin méjì wá dúró lẹ́gbẹ̀ẹ́ wọn nínú aṣọ tí ń tàn bí mànàmáná.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà sí i, “nínú aṣọ tí ń mànàmáná.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Èyí pa ọ̀nà ìsọ̀tàn tí Lúùkù máa ń lò mọ́, láì lo ọ̀rọ̀ àtijọ́ tàbí èdè tí kò ṣe àdánidá.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς περὶ τούτου
  choice: nígbà tí èyí ń rú wọn lójú
  rationale: Ọ̀rọ̀ náà fi àkókò hàn, ó sì túmọ̀ sí pé àwọn obìnrin náà kò mọ ohun tí wọn yóò rò nípa ohun tí ó ṣẹlẹ̀; ‘rú wọn lójú’ ju ìyàlẹ́nu lásán lọ.
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó jẹ́ àmì ìsọ̀rọ̀ tí ń pe olùka sí ìṣẹ̀lẹ̀ tuntun tí ó yani lẹ́nu, ní ọ̀nà tí ó bójú mu nínú Yorùbá òde òní.
- source_word: ἄνδρες δύο
  choice: ọkùnrin méjì
  rationale: Ẹsẹ yìí fúnra rẹ̀ pè wọ́n ní ọkùnrin méjì; a kò fi ìdánimọ̀ wọn gẹ́gẹ́ bí áńgẹ́lì kún ọ̀rọ̀ náà.
- source_word: ἐπέστησαν αὐταῖς
  choice: dúró lẹ́gbẹ̀ẹ́ wọn
  rationale: Èyí pa ìtumọ̀ ibi tí wọ́n dúró mọ́, láì túmọ̀ ọ̀rọ̀ náà ju bí ó ti wà lọ sí ‘farahàn sí wọn.’
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: nínú aṣọ dídán yanran
  rationale: Èyí jẹ́ Yorùbá àdánidá fún aṣọ tí ìmọ́lẹ̀ rẹ̀ ń kọ mànàmáná; àlàyé ìsàlẹ̀ pa àwòrán mànàmáná inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìdánimọ̀ àwọn méjèèjì
  choice: ọkùnrin méjì
  alternative: áńgẹ́lì méjì
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ náà fi hàn pé wọ́n jẹ́ ìránṣẹ́ ọ̀run, ἄνδρες δύο nínú ẹsẹ yìí sọ wọ́n di ‘ọkùnrin méjì.’ Ìtumọ̀ náà kò gbé ìdánimọ̀ láti ẹsẹ mìíràn wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. ‘Kíyè sí i’ pa agbára ἰδοὺ mọ́ láì lo ọ̀rọ̀ àtijọ́; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
