  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń bùkún fún wọn, ó yà kúrò lọ́dọ̀ wọn, a sì gbé e sókè lọ sí ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan kò ní: “a sì gbé e sókè lọ sí ọ̀run.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó fi ìlànà ìtàn Lúùkù hàn ní èdè Yorùbá òde òní tí ó ṣe kedere, láì lo ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: bí ó ti ń súre fún wọn
  rationale: Ìṣàmúlò “bí … ti ń” fi hàn pé ìbùkún náà ń lọ lọ́wọ́ ní àkókò tí ìyapa náà ṣẹlẹ̀; “súre fún” jẹ́ ọ̀nà àdánidá láti sọ εὐλογεῖν ní àyíká yìí.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: ó yà kúrò lọ́dọ̀ wọn
  rationale: Ó pa èrò ìyapa tàbí kíkúrò mọ́, ó sì bá ìṣẹ̀lẹ̀ ìdágbére ti ara mu láì fi àlàyé míì kún un.
- source_word: ἀνεφέρετο
  choice: a sì gbé e sókè
  rationale: Ìkọ́lé aláìlẹ́ni tí ó ṣe iṣẹ́ náà ní kedere pa ìtumọ̀ passive mọ́, láì pinnu ẹni tí ó gbé e sókè.
- source_word: εἰς τὸν οὐρανόν
  choice: lọ sí ọ̀run
  rationale: Nínú àyíká yìí, οὐρανός tọ́ka sí ọ̀run gẹ́gẹ́ bí ibùgbé ọ̀run, kì í ṣe ojú ọ̀run lásán.
theological_decisions:
- issue: Gbólóhùn oníṣiyèméjì καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: A fi “a sì gbé e sókè lọ sí ọ̀run” sínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìyàtọ̀ inú àwọn ìwé àfọwọ́kọ.
  alternative: Kí a yọ gbólóhùn náà kúrò nítorí pé àwọn ìwé àfọwọ́kọ kan kò ní in.
  rationale: SBLGNT fi gbólóhùn náà sínú àmì àkámọ́ oníṣiyèméjì. Fífì í sínú ọ̀rọ̀ pàtàkì pẹ̀lú àlàyé ìsàlẹ̀ ojú ewé pa ẹ̀rí orísun àti àìdánilójú ọrọ̀ náà mọ́, láì dá ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá tó ṣe déédé, tó níyì, tí ó sì yé òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; gírámà àti ìtẹ̀sí gbólóhùn jẹ́ ti Yorùbá, kì í ṣe àfarawé ìṣètò Gíríìkì tàbí Gẹ̀ẹ́sì.
