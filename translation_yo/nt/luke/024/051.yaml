review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ ìbẹ̀rẹ̀ àti ìparí ẹsẹ̀ náà tọ́: “Ó sì ṣẹlẹ̀ pé” ń gbé ἐγένετο jáde, “bí ó ti ń …” ń fi ìṣe tí ń lọ lọ́wọ́ hàn, “ó yà kúrò lọ́dọ̀ wọn” sì yẹ fún διέστη ἀπ’ αὐτῶν. Gbólóhùn tí ó wà nínú àmì àkámọ́ SBLGNT náà wà nínú ọ̀rọ̀ pàtàkì pẹ̀lú àlàyé ìyàtọ̀ àwọn ìwé àfọwọ́kọ, gẹ́gẹ́ bí orísun ṣe béèrè. Ṣùgbọ́n “ń súre fún wọn” túmọ̀ sí pé ó ń gbàdúrà fún wọn, kì í ṣe εὐλογεῖν, ‘bùkún fún wọn.’'
  naturalness: 'Àtúnṣe náà jẹ́ Yorùbá òde òní tí ó déédé: “bí ó ti ń bùkún fún wọn” jẹ́ ọ̀nà àdánidá, ó sì pa abala ìṣe-tí-ń-lọ-lọ́wọ́ ti Gíríìkì mọ́. “A sì gbé e sókè lọ sí ọ̀run” jẹ́ ìkọ́lé aláìdásílẹ̀ ẹni-iṣẹ́ tí ó bá passive ἀνεφέρετο mu.'
  terminology: A gbọdọ̀ lo “bùkún fún” fún εὐλογεῖν nínú àyíká yìí. “Súre fún” jẹ́ ọ̀rọ̀ àdúrà/intercession, ó sì yí ìṣe Jésù padà. “Ọ̀run” yẹ fún οὐρανός ní ẹsẹ̀ yìí.
  issues:
