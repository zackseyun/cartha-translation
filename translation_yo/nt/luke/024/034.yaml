  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: yo
  text: wọ́n ń wí pé[a], “A ti jí Olúwa dìde nítòótọ́, ó sì ti farahàn Símónì!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ apá yìí sí: “Olúwa ti jí dìde nítòótọ́” tàbí “Ní tòótọ́, a jí Olúwa dìde.” Ọ̀rọ̀ àfikún àti ọ̀rọ̀-ìṣe Gíríìkì náà lè gba àwọn ìtumọ̀ wọ̀nyí tó sún mọ́ra; ọ̀rọ̀ inú ẹsẹ náà pa ìtumọ̀ pé ẹlòmíràn ni ó jí Olúwa dìde mọ́.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle present, plural, tí ó so mọ́ gbólóhùn tó ṣáájú. ‘wọ́n ń wí pé’ mú ìtẹ̀síwájú ọ̀rọ̀ náà àti ẹni púpọ̀ tí ń sọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣí ohun tí wọ́n sọ sílẹ̀; ‘pé’ ni ọ̀nà Yorùbá tó ṣe déédé jù fún ìfihàn ọ̀rọ̀ taara yìí.
- source_word: ὄντως
  choice: nítòótọ́
  rationale: ‘nítòótọ́’ tẹnumọ́ pé ìròyìn àjíǹde náà jẹ́ òtítọ́ gan-an, gẹ́gẹ́ bí adverb Gíríìkì ṣe ń ṣe.
- source_word: ἠγέρθη
  choice: A ti jí … dìde
  rationale: Ìkọ̀sẹ̀ Yorùbá aláìsọ ẹni tó ṣe iṣẹ́ (‘A ti jí…’) pa ohùn passive Gíríìkì mọ́ láìdá ẹni tó jí Olúwa dìde lórúkọ; ‘ti’ sì fi abajade iṣẹ́ náà tó wà di ìsinsìnyí hàn.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni orúkọ oyè Yorùbá tó bójú mu fún κύριος, ó sì pa ìwọ̀n Kristọ́lọ́jì ọ̀rọ̀ náà mọ́.
- source_word: καὶ
  choice: ó sì
  rationale: ‘sì’ so ìfarahàn náà pọ̀ mọ́ ìjẹ́rìí àjíǹde; ‘ó’ tún mú ẹni tí ó farahàn, ìyẹn Olúwa, hàn kedere ní Yorùbá.
- source_word: ὤφθη
  choice: ó sì ti farahàn
  rationale: Fọ́ọ̀mù passive Gíríìkì yìí ní ìlò àdánidá fún ìfarahàn lẹ́yìn àjíǹde. ‘farahàn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, ‘ti’ sì so ìṣẹ̀lẹ̀ náà mọ́ ìròyìn tó wà lọ́wọ́.
- source_word: Σίμωνι
  choice: Símónì
  rationale: A tú orúkọ náà sí ìkọ̀wé Yorùbá bí ‘Símónì’; a kò fi ‘Pétérù’ kún un nítorí orísun náà sọ ‘Símónì’ nìkan.
theological_decisions:
- issue: Ohùn ọ̀rọ̀-ìṣe àjíǹde
  choice: A ti jí Olúwa dìde
  alternative: Olúwa ti jí dìde
  rationale: Gíríìkì lo passive (ἠγέρθη). Àkọ́kọ́ pa ohùn yẹn mọ́, kò sì dárúkọ ẹni tó ṣe iṣẹ́ náà; ọ̀nà kejì dára gan-an ní Yorùbá ṣùgbọ́n ó yí ọ̀rọ̀ náà sí ìṣe aláìlérò.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ní àyíká àjíǹde yìí, κύριος jẹ́ orúkọ oyè fún Jésù. ‘Olúwa’ pa ọlá àti ìwọ̀n Kristọ́lọ́jì rẹ̀ mọ́ ju ‘Ọ̀gá’ lọ.
translation_notes:
  register: Yorùbá àtẹ̀jáde jẹ́ ti ìpele ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yan ‘wọ́n ń wí pé’ láti jẹ́ kí ìsopọ̀ mọ́ gbólóhùn tó ṣáájú hàn.
