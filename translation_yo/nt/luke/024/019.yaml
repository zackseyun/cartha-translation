language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Àwọn nǹkan wo?” Wọ́n sì wí fún un pé, “Àwọn nǹkan nípa Jésù ará Násárẹ́tì[a], ẹni tí ó jẹ́ ọkùnrin kan, wòlíì alágbára ní iṣẹ́ àti ọ̀rọ̀ níwájú Ọlọ́run àti gbogbo àwọn ènìyàn[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù Násárénì”; Gíríìkì ní “Jésù Násárénì.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní ìtumọ̀ gangan pé, “ẹni tí ó wá di ọkùnrin kan, wòlíì”; ṣùgbọ́n nínú àyíká yìí, a lè túmọ̀ ọ̀rọ̀-ìṣe náà ní àdánidá pé “jẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Àwọn nǹkan wo?
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ nọ́ńbà ti ọ̀rọ̀ ìbéèrè náà mọ́, ó sì jẹ́ ọ̀nà àdánidá láti tọ́ka sí àwọn ọ̀ràn tí wọ́n ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Àwọn nǹkan nípa Jésù
  rationale: Ó tẹ̀lé ìtumọ̀ gírámà náà ní tààrà láì fi èrò pé ó túmọ̀ sí ohun tí ó ṣẹlẹ̀ sí i kún un.
- source_word: Ναζαρηνοῦ
  choice: ará Násárẹ́tì
  rationale: Yorùbá máa ń fi “ará” hàn ní ti ẹni tí ó jẹ́ ti ìlú kan; ó jẹ́ àdánidá ju gbígbé orúkọ oyè kan jáde lọ, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àpèjúwe “Násárénì.”
- source_word: ἐγένετο
  choice: di
  rationale: “Di” pa agbára ọ̀rọ̀-ìṣe γίνομαι (“di/wá di”) mọ́, dípò kí a sọ ọ́ di “jẹ́” lásán; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé ọ̀nà àdánidá mìíràn.
- source_word: ἀνὴρ προφήτης
  choice: ọkùnrin kan, wòlíì
  rationale: Ó pa àwọn ọ̀rọ̀-orúkọ méjèèjì mọ́, pẹ̀lú “wòlíì” gẹ́gẹ́ bí àfikún àpèjúwe sí “ọkùnrin kan,” láì yọ ἀνήρ kúrò.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: alágbára ní iṣẹ́ àti ọ̀rọ̀
  rationale: Ó jẹ́ gbolohun Yorùbá tí ó yé kedere, tó sì pa ìbáṣepọ̀ láàárín ohun tí ó ṣe àti ohun tí ó sọ mọ́.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: níwájú Ọlọ́run àti gbogbo àwọn ènìyàn
  rationale: “Níwájú” lè túmọ̀ sí ní ojú tàbí ní ìmọ̀ ẹni, ó sì pa ẹ̀rí níwájú Ọlọ́run àti ní gbangba láàárín àwọn ènìyàn mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀνὴρ nígbà tí ó ń tọ́ka sí Jésù
  choice: ọkùnrin kan, wòlíì
  alternative: wòlíì kan / ọkùnrin kan tí ó jẹ́ wòlíì
  rationale: Gíríìkì sọ ἀνήρ ní kedere. Mímú “ọkùnrin” wọ inú ìtumọ̀ pa àpèjúwe àwọn tí ń sọ̀rọ̀ mọ́, láì ṣe àfikún tàbí iyọkúrò nípa ẹni tí Kristi jẹ́.
- issue: Agbára ọ̀rọ̀-ìṣe ἐγένετο
  choice: di
  alternative: jẹ́
  rationale: “Di” tẹ̀lé ìtumọ̀ gangan “became/came to be,” ṣùgbọ́n “jẹ́” lè jẹ́ àdánidá sí i ní àyíká yìí. A kò fi àìdánilójú náà pamọ́; a ṣàkọsílẹ̀ ọ̀nà mìíràn.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “wí” láti pa ìforúkọsílẹ̀ ìtàn mímọ́ mọ́, “nípa” fún περί, àti “níwájú” fún ἐναντίον. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ.
