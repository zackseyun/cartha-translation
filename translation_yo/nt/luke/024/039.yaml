id: LUK.24.39
reference: Luke 24:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: yo
  text: Ẹ wo ọwọ́ mi àti ẹsẹ̀ mi, kí ẹ sì rí i pé èmi fúnra mi ni.[a] Ẹ fọwọ́ kàn mí, kí ẹ sì wò ó,[b] nítorí ẹ̀mí[c] kò ní ẹran ara àti egungun bí ẹ ti rí pé mo ní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Ẹ wo ọwọ́ mi àti ẹsẹ̀ mi, nítorí èmi fúnra mi ni.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé, “Èmi fúnra mi ni ẹni náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ fọwọ́ yẹ̀ mí wò, kí ẹ sì rí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “iwin.” Ọ̀rọ̀ Gíríìkì náà ni “ẹ̀mí.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Ẹ wo / ẹ sì wò ó
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni ó ń ké sí wọn láti yẹ ara rẹ̀ wò lẹ́sẹ̀kẹsẹ̀; ‘wo’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àyẹ̀wò ojú.
- source_word: χεῖράς ... πόδας
  choice: ọwọ́ ... ẹsẹ̀
  rationale: A túmọ̀ àwọn ọ̀rọ̀ ara méjèèjì ní tààràtà, kí ìdánimọ̀ ara ẹni tí ẹsẹ náà tẹnumọ́ lè dúró.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: kí ẹ sì mọ̀ pé èmi fúnra mi ni
  rationale: ‘Èmi fúnra mi’ pa ìtẹnumọ́ ἐγώ ... αὐτός mọ́; fífi ‘kí ẹ sì mọ̀’ kún un jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú àṣẹ ‘Ẹ wo’ jẹ́ Yorùbá àdánidá láì sọ ìtumọ̀ di ẹ̀kọ́ mìíràn.
- source_word: ψηλαφήσατέ
  choice: Ẹ fọwọ́ kàn mí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ọwọ́ kan tàbí yẹ ohun wò nípa fífi ọwọ́ tọ́ ọ; ‘fọwọ́ kàn’ ṣe kedere, ó sì jẹ́ èdè òde òní.
- source_word: πνεῦμα
  choice: ẹ̀mí
  rationale: ‘Ẹ̀mí’ ni ìbámu tààrà jù lọ pẹ̀lú πνεῦμα, ó sì pa àìdánilójú tó wà láàárín ‘spirit’ àti ‘ghost’ mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
- source_word: σάρκα καὶ ὀστέα
  choice: ẹran ara àti egungun
  rationale: Nínú àyíká yìí σάρξ jẹ́ ohun ara gidi; ‘ẹran ara àti egungun’ sọ ìyàtọ̀ ara tó ṣeé fọwọ́ kàn ní kedere.
- source_word: καθὼς
  choice: bí
  rationale: Ó mú ìfiwéra láàárín ohun tí ẹ̀mí kò ní àti ohun tí àwọn ọmọ-ẹ̀yìn rí pé Jesu ní wọlé lọ́nà àdánidá.
- source_word: θεωρεῖτε
  choice: ẹ ti rí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí wíwo pẹ̀lú àkíyèsí; ‘rí’ bá ẹ̀bẹ̀ sí ẹ̀rí ojú mu ní Yorùbá.
- source_word: ἔχοντα
  choice: pé mo ní
  rationale: A sọ participle Gíríìkì náà di gbólóhùn Yorùbá tó ṣe déédé, láì pàdánù ìtumọ̀ pé ohun náà wà lára Jesu.
theological_decisions:
- issue: Ọ̀rọ̀ Jesu nípa jíjẹ́ ẹni tó ní ara lẹ́yìn àjíǹde
  choice: 'A pa ọ̀rọ̀ ara tó ṣe kedere mọ́: ‘ẹ̀mí kò ní ẹran ara àti egungun bí ẹ ti rí pé mo ní.’'
  alternative: Ìtumọ̀ àlàyé tó lè rọ ìyàtọ̀ láàárín ara Jesu àti ẹ̀mí
  rationale: Gíríìkì tẹnumọ́ wíwo, fífi ọwọ́ kàn, ẹran ara àti egungun. Ìtumọ̀ náà jẹ́ kí ìjẹ́rìí ara gidi dúró láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ kún un.
- issue: Ìtumọ̀ ὅτι lẹ́yìn ‘Ẹ wo’
  choice: 'A fi hàn gẹ́gẹ́ bí ohun tí wíwo náà yóò mú wọn mọ̀: ‘kí ẹ sì mọ̀ pé èmi fúnra mi ni.’'
  alternative: ‘Nítorí èmi fúnra mi ni,’ níbi tí ὅτι ti jẹ́ okùnfà
  rationale: Èdè Gíríìkì gba ìtumọ̀ méjèèjì láyè. Yíyan àkóónú ohun tí wọn yóò mọ̀ bá ìtẹnumọ́ ìdánimọ̀ ara ẹni mu, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀nà okùnfà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bá ọ̀rọ̀ sí ọ̀pọ̀ ènìyàn mu. A lo ‘ẹran ara’ fún σάρξ nínú àyíká ara gidi, kí a má bà á dàpọ̀ mọ́ ‘ẹran’ gẹ́gẹ́ bí oúnjẹ.
