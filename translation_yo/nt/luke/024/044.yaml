  source_fidelity: Ìtúmọ̀ náà mú ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì náà dáadáa, pẹ̀lú ìdandan δεῖ ('gbọ́dọ̀') àti àkójọpọ̀ àwọn ìpín Ìwé Mímọ́. Ṣùgbọ́n ìtòlẹ́sẹẹsẹ 'ohun tí a kọ nípa mi sínú Òfin...' lè jẹ́ kí ó dà bí ẹni pé a kọ ohun kan nípa Jésù sínú Òfin; ἐν ... περὶ ἐμοῦ túmọ̀ sí ohun tí a kọ nínú àwọn ìpín wọ̀nyẹn nípa rẹ̀.
  naturalness: Àtúnṣe ìtòlẹ́sẹẹsẹ sí 'ohun gbogbo tí a kọ nínú ... nípa mi' jẹ́ Yorùbá ìgbàlódé tó mọ́gbọ́n dání, ó sì yọ ìdààmú ìbáṣepọ̀ àwọn gbolohun kúrò. 'Àwọn ni ọ̀rọ̀ mi wọ̀nyí' jẹ́ ìfihàn tí ó hàn gedegbe fún Οὗτοι οἱ λόγοι μου.
  terminology: '''Òfin Mósè, àwọn Wòlíì, àti àwọn Sáàmù'' dára gẹ́gẹ́ bí orúkọ àwọn ìpín Ìwé Mímọ́. A ti pa àìdánilójú nípa bóyá ''Àwọn Sáàmù'' nìkan tàbí aṣojú Àwọn Ìwé mọ́ nínú àlàyé ìsàlẹ̀.'
