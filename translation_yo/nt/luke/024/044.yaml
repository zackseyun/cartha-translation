id: LUK.24.44
reference: Luke 24:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: yo
  text: 'Nígbà náà ni ó sọ fún wọn pé, “Àwọn ni ọ̀rọ̀ mi wọ̀nyí tí mo sọ fún yín nígbà tí mo ṣì wà pẹ̀lú yín: ohun gbogbo tí a kọ nínú Òfin Mósè, àwọn Wòlíì, àti àwọn Sáàmù[b] nípa mi[c] gbọ́dọ̀ ṣẹ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí a ti kọ.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “Òfin Mósè, àwọn Wòlíì, àti àwọn Sáàmù” tọ́ka sí àwọn ìpín pàtàkì ti Ìwé Mímọ́ Ísírẹ́lì. “Àwọn Sáàmù” lè túmọ̀ sí Ìwé Sáàmù ní pàtó, tàbí ó lè dúró fún ìpín tí a ń pè ní Àwọn Ìwé.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nípa ti èmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Nígbà náà ni ó sọ fún wọn pé
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn síwájú; “Nígbà náà” bá ìṣàn Yorùbá mu láì fi ìtakora kún un. “sọ fún wọn” jẹ́ ọ̀nà àdánidá láti túmọ̀ ọ̀rọ̀ sí àwọn ènìyàn.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Àwọn ọ̀rọ̀ mi ... nìwọ̀nyí
  rationale: Ìkọ́lé “... nìwọ̀nyí” jẹ́ Yorùbá àdánidá fún àfihàn Οὗτοι, ó sì pa “àwọn ọ̀rọ̀ mi” mọ́ ní tààrà.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: tí mo sọ fún yín
  rationale: “sọ fún” mú ìtumọ̀ λαλέω πρὸς wá ní Yorùbá tó rọrùn, ó sì pa gbólóhùn alátọ́ka mọ́.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: nígbà tí mo ṣì wà pẹ̀lú yín
  rationale: “nígbà tí” fi iṣẹ́ àkókò participle hàn, “ṣì” sì dúró fún ἔτι.
- source_word: ὅτι
  choice: ':'
  rationale: Àmì méjì yìí ṣe àfihàn àlàyé àkóónú ọ̀rọ̀ rẹ̀ lọ́nà Yorùbá tó mọ́; ó bá ipa ὅτι gẹ́gẹ́ bí olùṣí àkóónú mu.
- source_word: δεῖ πληρωθῆναι
  choice: gbọ́dọ̀ ṣẹ
  rationale: “gbọ́dọ̀” pa agbára ìdandan δεῖ mọ́, “ṣẹ” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìmúṣẹ ohun tí Ìwé Mímọ́ kọ.
- source_word: πάντα τὰ γεγραμμένα
  choice: Gbogbo ohun tí a kọ
  rationale: “Gbogbo ohun” pa agbára àpapọ̀ πάντα mọ́; “tí a kọ” fi participle passive hàn ní ọ̀nà àdánidá.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: sínú Òfin Mósè, àwọn Wòlíì àti àwọn Sáàmù
  rationale: “sínú” tọ́ka sí ibi tí àwọn ọ̀rọ̀ náà ti wà nínú Ìwé Mímọ́. Lílò lẹ́tà ńlá fi hàn pé orúkọ àwọn ìpín Ìwé Mímọ́ ni wọ́n, láì pinnu bóyá “Sáàmù” túmọ̀ sí Sáàmù nìkan tàbí gbogbo Àwọn Ìwé.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: “nípa mi” jẹ́ àfiwé Yorùbá tó ṣe kedere, tó sì bá περί pẹ̀lú genitive mu.
theological_decisions:
- issue: Ìwọ̀n àti agbára ìdandan Ìwé Mímọ́ nínú ọ̀rọ̀ Jésù
  choice: “gbọ́dọ̀ ṣẹ”
  alternative: “yóò ṣẹ” tàbí “ní láti ṣẹ”
  rationale: “gbọ́dọ̀ ṣẹ” pa ìdandan tí δεῖ fi hàn mọ́, ṣùgbọ́n kò ṣàfikún ẹ̀kọ́ kan pàtó nípa ọ̀nà tàbí bí ìmúṣẹ náà ṣe gbòòrò tó.
- issue: Ìdánimọ̀ “Òfin Mósè, àwọn Wòlíì àti àwọn Sáàmù”
  choice: Ṣe wọn bí orúkọ àwọn ìpín Ìwé Mímọ́, kí àlàyé àìdánilójú wà ní àlàyé ìsàlẹ̀.
  alternative: Ka “Sáàmù” sí ìwé Sáàmù nìkan, tàbí gẹ́gẹ́ bí aṣojú gbogbo Àwọn Ìwé.
  rationale: Ọ̀rọ̀ Gíríìkì dá bí àtọ́ka sí àwọn ìpín pàtàkì ti Ìwé Mímọ́ Ísírẹ́lì, ṣùgbọ́n kò yanjú bóyá ψαλμοῖς ní ìtumọ̀ tóóró tàbí tó gbòòrò.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìkọ́lé gbólóhùn jẹ́ kedere fún òǹkàwé gbogbogbò, nígbà tí àwọn orúkọ ìpín Ìwé Mímọ́ àti agbára “gbọ́dọ̀” pa ìwọ̀n ọ̀rọ̀ orísun mọ́.
