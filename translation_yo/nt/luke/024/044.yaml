revisions:
- from: 'Nígbà náà ni ó sọ fún wọn pé, “Àwọn ọ̀rọ̀ mi tí mo sọ fún yín nígbà tí mo ṣì wà pẹ̀lú yín nìwọ̀nyí: Gbogbo ohun tí a kọ nípa mi[c] sínú Òfin Mósè, àwọn Wòlíì àti àwọn Sáàmù[b] gbọdọ̀ ṣẹ[a].”'
  to: 'Nígbà náà ni ó sọ fún wọn pé, “Àwọn ni ọ̀rọ̀ mi wọ̀nyí tí mo sọ fún yín nígbà tí mo ṣì wà pẹ̀lú yín: ohun gbogbo tí a kọ nínú Òfin Mósè, àwọn Wòlíì, àti àwọn Sáàmù[b] nípa mi[c] gbọ́dọ̀ ṣẹ[a].”'
  rationale: A tún gbólóhùn náà ṣe kí 'nínú Òfin Mósè, àwọn Wòlíì, àti àwọn Sáàmù' ṣàpèjúwe ibi tí a ti kọ àwọn ohun náà, àti kí 'nípa mi' ṣàpèjúwe àwọn ohun tí a kọ, gẹ́gẹ́ bí ìṣètò Gíríìkì. A pa ìdandan ìmúṣẹ, àwọn orúkọ ìpín Ìwé Mímọ́, àti àìdánilójú tó yẹ nínú àlàyé ìsàlẹ̀ mọ́.
