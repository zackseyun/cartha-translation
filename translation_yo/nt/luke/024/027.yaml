language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: yo
  text: Ó sì bẹ̀rẹ̀ pẹ̀lú Mósè àti gbogbo àwọn Wòlíì[b], ó sì ṣàlàyé[a] fún wọn nínú gbogbo Ìwé Mímọ́ àwọn ohun tí ó ní í ṣe pẹ̀lú òun fúnra rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó túmọ̀ wọn fún wọn” tàbí “ó ṣí ìtumọ̀ wọn payá ní ẹ̀kúnrẹ́rẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣí ìtumọ̀ ohun kan payá ní kíkún.
    reason: lexical_alternative
  - marker: b
    text: “Mósè àti gbogbo àwọn Wòlíì” ń tọ́ka sí àwọn ìwé Ìwé Mímọ́ tí a so mọ́ Mósè àti sí àwọn ìwé àwọn wòlíì.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος
  choice: Ó sì bẹ̀rẹ̀
  rationale: Aorist participle náà so ìbẹ̀rẹ̀ mọ́ iṣẹ́ pàtàkì tí ó tẹ̀ lé e; gbólóhùn aláìlẹ́gbẹ́ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀπὸ Μωϋσέως
  choice: láti ọ̀dọ̀ Mósè
  rationale: Ó pa ìtumọ̀ Mósè gẹ́gẹ́ bí ibi tí àlàyé Ìwé Mímọ́ ti bẹ̀rẹ̀ mọ́, láìfi dandan sọ pé ẹni náà nìkan ni a ń tọ́ka sí.
- source_word: πάντων τῶν προφητῶν
  choice: gbogbo àwọn Wòlíì
  rationale: Lẹ́tà ńlá fi hàn pé apá kan nínú Ìwé Mímọ́ ni a ń tọ́ka sí, kì í ṣe gbogbo ẹni tó ní ẹ̀bùn àsọtẹ́lẹ̀ lásán.
- source_word: διερμήνευσεν
  choice: ó ṣàlàyé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣí ìtumọ̀ ohun kan payá tàbí túmọ̀ rẹ̀ ní ẹ̀kúnrẹ́rẹ́; “ṣàlàyé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká yìí mu.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí fi ẹni tí àlàyé náà wà fún hàn ní èdè Yorùbá àdánidá.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: nínú gbogbo Ìwé Mímọ́
  rationale: γραφή ní àyíká yìí ń tọ́ka sí Ìwé Mímọ́; “nínú” pa ìtumọ̀ ibi tí àwọn ẹ̀rí náà wà mọ́, “gbogbo” sì fi fífẹ̀ àgbègbè àlàyé náà hàn.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: àwọn ohun tí ó jẹ mọ́ òun fúnra rẹ̀
  rationale: Ìtumọ̀ yìí gba ọ̀pọ̀ nǹkan, ẹsẹ̀, tàbí kókó tó ní í ṣe pẹ̀lú Jésù láàyè, láìdín wọn kù sí àsọtẹ́lẹ̀ tààrà nìkan.
theological_decisions:
- issue: Ìwọ̀n àlàyé Jésù lórí Ìwé Mímọ́
  choice: Gbólóhùn náà sọ pé Jésù ṣàlàyé láti inú gbogbo apá Ìwé Mímọ́ àwọn ohun tí ó jẹ mọ́ òun fúnra rẹ̀, láìsọ irú ìbáṣepọ̀ kan ṣoṣo tí gbogbo wọn ní pẹ̀lú rẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ sí àsọtẹ́lẹ̀ Mèsáyà tààrà nìkan, tàbí pé gbogbo ẹsẹ̀ kọ̀ọ̀kan nínú Májẹ̀mú Láéláé ń tọ́ka sí i ní tààrà.
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò, ṣùgbọ́n kò sọ pé àsọtẹ́lẹ̀ tààrà nìkan ni, bẹ́ẹ̀ ni kò fi dandan mú wa sọ pé gbogbo ẹsẹ̀ kọ̀ọ̀kan ń tọ́ka sí Jésù. A pa fífẹ̀ àti ìṣòro ìtumọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tó bá yẹ. “Òun fúnra rẹ̀” mú ìtọ́kasí sí ẹni tí ó ń sọ̀rọ̀ hàn gbangba, “Ìwé Mímọ́” sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀ fún γραφαί.
