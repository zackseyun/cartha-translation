language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí ó tìgbọ̀n sílẹ̀ láti jẹun pẹ̀lú wọn[a], ó mú búrẹ́dì náà, ó bù kún un, lẹ́yìn tí ó sì bù ú, ó bẹ̀rẹ̀ sí í pín in fún wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nígbà tí ó jókòó láti jẹun pẹ̀lú wọn.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka pàtó sí títìgbọ̀n sílẹ̀ níbi oúnjẹ, gẹ́gẹ́ bí àṣà jíjẹun ní ayé ìgbàanì.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó sì ń pín in fún wọn.’ Fífi ọ̀rọ̀-ìṣe náà sí imperfect ní Gíríìkì lè tẹnu mọ́ ìṣe tí ó ń lọ lọ́wọ́; ‘ó bẹ̀rẹ̀ sí í pín’ fi ìbẹ̀rẹ̀ ìṣe náà hàn nínú àyíká ìtàn yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Èyí pa ọ̀nà ìsopọ̀ ìtàn tí Lúùkù máa ń lò mọ́, ó sì jẹ́ èdè Yorùbá àdánidá láì lo ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: nígbà tí ó tìgbọ̀n sílẹ̀ láti jẹun pẹ̀lú wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ti àkókò, ó sì ń tọ́ka sí bí àwọn ènìyàn ṣe máa ń tìgbọ̀n sílẹ̀ níbi oúnjẹ ní ayé ìgbàanì, kì í ṣe jíjókòó lásán.
- source_word: λαβὼν τὸν ἄρτον
  choice: ó mú búrẹ́dì náà
  rationale: A sọ participle náà di ọ̀rọ̀-ìṣe pípé láti mú kí Yorùbá ṣàn dáadáa, nígbà tí a pa tẹ̀léǹtẹ̀lé ìṣe náà mọ́.
- source_word: εὐλόγησεν
  choice: ó súre sí i
  rationale: Èyí fi ìbùkún lórí búrẹ́dì hàn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, láì yí i sí ‘ó dúpẹ́’ tàbí fi ìtumọ̀ ẹ̀sìn kan kún un.
- source_word: κλάσας
  choice: lẹ́yìn tí ó sì bù ú
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ bù búrẹ́dì náà kí ó tó pín in; ‘lẹ́yìn tí’ mú ìtẹ̀lé náà ṣe kedere.
- source_word: ἐπεδίδου
  choice: ó bẹ̀rẹ̀ sí í pín in fún wọn
  rationale: Imperfect náà lè fi ìṣe tí ó ń lọ lọ́wọ́ tàbí ìbẹ̀rẹ̀ ìṣe hàn. Yíyan ‘bẹ̀rẹ̀ sí í pín’ bá ìṣẹ̀lẹ̀ ní àyíká ọ̀rọ̀ mu, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
theological_decisions:
- issue: Ìṣe níbi oúnjẹ lè mú kí òǹkàwé ronú nípa Oúnjẹ Alẹ́ Olúwa tàbí àṣà sakiramenti.
  choice: Lo èdè oúnjẹ ojoojúmọ́ nínú ẹsẹ náà, kí a má ṣe fi ìtumọ̀ sakiramenti kún un.
  alternative: Ṣe àyípadà ọ̀rọ̀ tó máa mú kí ó túbọ̀ dà bí ìdásílẹ̀ Oúnjẹ Alẹ́ Olúwa.
  rationale: Tẹ̀léǹtẹ̀lé ‘mú… súre… bù… pín’ lè ní ìró àwọn ìtàn oúnjẹ mìíràn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò pe ìṣe náà ní àṣà sakiramenti. Ìtumọ̀ náà pa àwọn ìṣe tí ó wà nínú orísun mọ́ láì gbé ẹ̀kọ́ ẹgbẹ́ ìsìn kan wọ inú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ nítorí pé ó jẹ́ ọ̀rọ̀ tí ọ̀pọ̀ ènìyàn mọ̀, a sì lo ‘tìgbọ̀n sílẹ̀ láti jẹun’ láti pa àṣà jíjẹun ti ọ̀rúndún kìíní mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
