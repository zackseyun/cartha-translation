  to: Ó sì ṣẹlẹ̀ pé, nígbà tí ó tìgbọ̀n sílẹ̀ láti jẹun pẹ̀lú wọn[a], ó mú búrẹ́dì náà, ó bù kún un, lẹ́yìn tí ó sì bù ú, ó bẹ̀rẹ̀ sí í pín in fún wọn.[b]
  rationale: A rọ́pò ‘ó súre sí i’ pẹ̀lú ‘ó bù kún un’ nítorí pé èyí ló fi ìtumọ̀ εὐλόγησεν hàn ní kedere nínú Yorùbá, láì mú kí ó dà bí pé Jesu ń gbàdúrà sí búrẹ́dì náà. A tún ṣe ìṣọ̀kan ọ̀rọ̀ àlàyé a pẹ̀lú ọ̀rọ̀ inú ẹsẹ náà. Ìyókù ìtumọ̀ náà pa ìtẹ̀lé, àkókò, àti àìsí ìtumọ̀ sakiramenti àfikún mọ́.
