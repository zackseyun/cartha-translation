  source_fidelity: Ìtẹ̀lé àwọn ìṣe náà—mú búrẹ́dì, bù kún un, bù ú, sì pín in fún wọn—ń bá Gíríìkì mu dáadáa, àti ‘ó bẹ̀rẹ̀ sí í pín’ jẹ́ ọ̀nà tó ṣeé gbà láti ṣàfihàn imperfect ἐπεδίδου. Ṣùgbọ́n ‘ó súre sí i’ lè túmọ̀ sí pé ó ń gbàdúrà sí búrẹ́dì náà, èyí tí kò bá εὐλόγησεν mu.
  naturalness: Èdè ẹsẹ náà ń ṣàn dáadáa lápapọ̀. ‘Tìgbọ̀n sílẹ̀ láti jẹun’ pa àṣà jíjẹun ayé ìgbàanì mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé rẹ̀ fún òǹkàwé. ‘Bù kún un’ jẹ́ ọ̀nà tó hàn gbangba, tó sì jẹ́ àdánidá ju ‘súre sí i’ lọ nínú àyíká yìí.
  terminology: ‘Bù kún un’ fi ìṣe ìbùkún lórí búrẹ́dì hàn láì sọ pé ó ṣe sakiramenti kan tàbí pé ó kan dúpẹ́. ‘Búrẹ́dì’ àti ‘pín in fún wọn’ yẹ, wọ́n sì wúlò fún Yorùbá òde òní.
