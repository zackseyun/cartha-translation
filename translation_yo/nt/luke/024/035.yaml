  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: yo
  text: Àwọn náà fúnra wọn sì ń ròyìn ohun tí ó ṣẹlẹ̀ ní ọ̀nà, àti bí ó ṣe di mímọ̀ fún wọn[a] nígbà bíbù búrẹ́dì náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí wọ́n ṣe dá a mọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ìrísí àfaragbà; ó lè tẹnumọ́ yálà pé wọ́n dá a mọ̀ tàbí pé a mú kí ó di mímọ̀ fún wọn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nígbà bíbù búrẹ́dì.” Èdè Gíríìkì lè ní ìtumọ̀ gbogbogbò, ṣùgbọ́n “búrẹ́dì náà” bá oúnjẹ pàtó tí a sọ ṣáájú mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Àwọn náà fúnra wọn
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ó sì fi àwọn ọmọ-ẹ̀yìn méjèèjì yìí yà sọ́tọ̀ gẹ́gẹ́ bí àwọn tó ń fi ìrírí tiwọn ròyìn.
- source_word: ἐξηγοῦντο
  choice: ń ròyìn
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà tọ́ka sí ìtàn tí wọ́n ń bá a lọ láti sọ; “ń ròyìn” jẹ́ èdè Yorùbá àdánidá tí kò sọ ọ́ di àlàyé ẹ̀kọ́.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: ohun tí ó ṣẹlẹ̀ ní ọ̀nà
  rationale: Gbólóhùn Gíríìkì náà há díẹ̀; fífi “tí ó ṣẹlẹ̀” kún un mú ìtumọ̀ tí àyíká ọ̀rọ̀ ń tọ́ka sí ṣe kedere ní Yorùbá láìfi kókó tuntun sí i.
- source_word: ὡς
  choice: bí
  rationale: “Bí” sọ ọ̀nà tàbí ipò tí ìdánimọ̀ náà fi wáyé, ó sì bá ìlò ὡς níbí mu.
- source_word: ἐγνώσθη
  choice: ó ṣe di mímọ̀ fún wọn
  rationale: Ìtumọ̀ yìí pa ìrísí àfaragbà ọ̀rọ̀-ìṣe Gíríìkì mọ́, kò sì dá ọ̀rọ̀ náà sí “wọ́n dá a mọ̀” nìkan.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: nígbà bíbù àkàrà náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣẹ̀lẹ̀ náà, ó sì pa ìtọ́kasí sí àkàrà pàtó nínú oúnjẹ tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀ mọ́.
theological_decisions:
- issue: Bóyá ἐγνώσθη túmọ̀ sí pé àwọn ọmọ-ẹ̀yìn náà dá Jesu mọ̀ lásán, tàbí pé a mú kí ó di mímọ̀ fún wọn
  choice: ó ṣe di mímọ̀ fún wọn
  alternative: wọ́n dá a mọ̀
  rationale: Ìrísí àfaragbà Gíríìkì jẹ́ kí ọ̀rọ̀ náà lè tẹnumọ́ ìdánimọ̀ wọn tàbí bí a ṣe mú kí ó di mímọ̀ fún wọn. Àyànfẹ́ náà pa ìṣòro ìtumọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ láìpinnu rẹ̀ ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Àkàrà” ni a yàn fún ἄρτος gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ nínú àyíká Bíbélì, dípò “búrẹ́dì,” kí a má bàa fi irú oúnjẹ òde-òní pàtó sínú ẹsẹ̀ náà.
