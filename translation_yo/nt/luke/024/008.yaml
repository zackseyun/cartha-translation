lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Àsopọ̀ ìtàn tí ó wọ́pọ̀ ni “sì”; ó pa ìsopọ̀ pẹ̀lú ohun tó ṣáájú mọ́ láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἐμνήσθησαν
  choice: rántí
  rationale: Ọ̀rọ̀-ìṣe yìí níhìn-ín túmọ̀ sí pé wọ́n rántí ohun tí wọ́n ti gbọ́; “rántí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere.
- source_word: τῶν ῥημάτων
  choice: àwọn ọ̀rọ̀
  rationale: ῥήματα tọ́ka sí ọ̀rọ̀ tí a sọ tàbí àwọn ohun tí ẹnìkan sọ. “Àwọn ọ̀rọ̀” jẹ́ ìtumọ̀ tààrà, nígbà tí “àwọn ọ̀rọ̀ tí ó sọ” tún ṣeé ṣe.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníjìní náà ń tọ́ka sí Jésù nínú àyíká ọ̀rọ̀, ṣùgbọ́n Gíríìkì sọ ní ṣókí pé “rẹ̀,” nítorí náà a pa ìrísí yẹn mọ́.
