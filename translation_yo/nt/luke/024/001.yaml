source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: yo
  text: Ṣùgbọ́n ní ọjọ́ kìíní ọ̀sẹ̀[a], ní kùtùkùtù òwúrọ̀, wọ́n wá sí ibojì náà, wọ́n sì mú àwọn ohun olóòórùn dídùn tí wọ́n ti pèsè wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gẹ́lẹ́, “ní èkíní nínú àwọn Sábáàtì”; èyí jẹ́ àsọyé tí ó túmọ̀ sí ọjọ́ kìíní ọ̀sẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Ṣùgbọ́n ní ọjọ́ kìíní ọ̀sẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà àsọyé Sẹ́mítì/Koine tí ó túmọ̀ sí ọjọ́ kìíní ọ̀sẹ̀. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, kò sì fi ìtumọ̀ kàlẹ́ńdà tí ọ̀rọ̀ náà kò béèrè sí i.
- source_word: ὄρθρου βαθέως
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Gbólóhùn náà tọ́ka sí ìgbà tí ilẹ̀ ṣẹ̀ṣẹ̀ ń mọ́ gan-an. “Ní kùtùkùtù òwúrọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtẹnumọ́ àkókò náà mọ́.
- source_word: ἐπὶ τὸ μνῆμα
  choice: sí ibojì náà
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìrìn, ἐπί fi ìlọ sí ibi kan hàn. “Ibojì” ni ọ̀rọ̀ Yorùbá tí ó bá ibi ìsìnkú yìí mu.
- source_word: ἦλθον
  choice: wọ́n wá
  rationale: Aorist náà ròyìn pé wọ́n dé ibẹ̀ láìfi àfikún míì sí ìṣe náà; “wọ́n wá” jẹ́ àsọyé ìtàn àdánidá ní Yorùbá.
- source_word: φέρουσαι
  choice: wọ́n sì mú ... wá
  rationale: Participle náà ṣàpèjúwe ohun tí wọ́n ń mú nígbà tí wọ́n wá. Ìtẹ̀lé ọ̀rọ̀ “mú ... wá” jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣe méjèèjì pọ̀.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: àwọn òróró olóòórùn dídùn tí wọ́n ti pèsè
  rationale: ἀρώματα tọ́ka sí àwọn nǹkan olóòórùn dídùn tí a lò fún ìtọ́jú òkú. Ní àyíká yìí, “àwọn òróró olóòórùn dídùn” mú ète ìsìnkú náà jáde ní Yorùbá, “tí wọ́n ti pèsè” sì fi ìṣe tí ó ti ṣáájú hàn.
theological_decisions:
- issue: Ìtumọ̀ àsọyé àkókò τῇ μιᾷ τῶν σαββάτων nínú ìtàn àjíǹde
  choice: ní ọjọ́ kìíní ọ̀sẹ̀
  alternative: ní ọjọ́ kìíní àwọn Sábáàtì
  rationale: A yan ìtumọ̀ àdánidá ti àsọyé náà dípò ìtumọ̀ gẹ́lẹ́ tí ó lè mú kí òǹkàwé rí àkíyèsí ẹ̀kọ́ ìgbàgbọ́ tàbí kàlẹ́ńdà tí Gíríìkì kò fi dandan mú wá.
translation_notes:
  register: Yorùbá àwùjọ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. A lo “kùtùkùtù òwúrọ̀” fún ọ̀nà àsọyé àdánidá, a sì lo “ibojì” àti “òróró olóòórùn dídùn” gẹ́gẹ́ bí ọ̀rọ̀ tí òǹkàwé òde òní lè lóye nírọ̀rùn.
