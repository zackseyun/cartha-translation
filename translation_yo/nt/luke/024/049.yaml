id: LUK.24.49
reference: Luke 24:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: yo
  text: Ẹ sì wò ó, èmi yóò rán ìlérí Baba mi sórí yín. Ṣùgbọ́n ẹ dúró ní ìlú náà títí a ó fi fi agbára láti òkè wọ̀ yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: kíyèsí i
  rationale: Ọ̀rọ̀ yìí fa àfiyèsí sí ohun pàtàkì tí Jesu fẹ́ sọ; ‘kíyèsí i’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì ní iyì.
- source_word: ἐξαποστέλλω
  choice: yóò rán ... sí
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ àsìkò ìsinsìnyí, ṣùgbọ́n ó lè tọ́ka sí ohun tó fẹ́rẹ̀ẹ́ ṣẹlẹ̀; Yorùbá ‘yóò rán’ bá àyíká ọ̀rọ̀ àti ìṣẹ̀lẹ̀ tó ń bọ̀ mu.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: ìlérí Baba mi
  rationale: 'A pa ìtumọ̀ àkàwé náà mọ́: ohun tí Baba ṣèlérí, láì sọ ní tààrà pé Ẹ̀mí Mímọ́ ni, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí i.'
- source_word: καθίσατε ἐν τῇ πόλει
  choice: ẹ dúró ní ìlú náà
  rationale: καθίζω níbí túmọ̀ sí kí wọ́n wà níbẹ̀, kí wọ́n má ṣe kúrò; ‘ẹ dúró’ jẹ́ èdè Yorùbá àdánidá ju ‘ẹ jókòó’ lọ.
- source_word: ἐνδύσησθε ... δύναμιν
  choice: fi agbára ... wọ̀ yín
  rationale: A pa àwòrán aṣọ inú ọ̀rọ̀ Gíríìkì mọ́, níbi tí agbára ti dà bí ohun tí a fi wọ ènìyàn.
- source_word: ἐξ ὕψους
  choice: láti òkè
  rationale: Ìtumọ̀ gígùn àti àwòrán ìpilẹ̀ṣẹ̀ ọ̀run ni a pa mọ́.
theological_decisions:
- issue: Ìdánimọ̀ ‘ìlérí Baba’
  choice: A fi gẹ́gẹ́ bí ‘ìlérí Baba mi.’
  alternative: ‘Ẹ̀mí Mímọ́ tí Baba mi ṣèlérí.’
  rationale: Ọ̀rọ̀ Gíríìkì kò darúkọ Ẹ̀mí Mímọ́ ní tààrà ní ẹsẹ yìí; a kò fẹ́ tú àlàyé àyíká ọ̀rọ̀ sínú ọ̀rọ̀ pàtó náà.
- issue: Ìbáṣepọ̀ agbára àti olùgbà
  choice: ‘fi agbára láti òkè wọ̀ yín’
  alternative: ‘gba agbára láti òkè.’
  rationale: Yíyan yìí pa àwòrán ἐνδύσησθε mọ́, láì ṣàlàyé irú agbára náà kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọ ‘Baba’ ní lẹ́tà ńlá fi hàn pé Baba Jesu ni a ń tọ́ka sí. Gbólóhùn náà jẹ́ ti òde òní, ṣùgbọ́n ó ní iyì, ó sì pa àwòrán ìpilẹ̀ṣẹ̀ Gíríìkì mọ́.
