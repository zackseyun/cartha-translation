  text: καὶ αὐτοὶ ὡμίλουν πρὸς ἀλλήλους περὶ πάντων τῶν συμβεβηκότων τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: yo
  text: Wọ́n sì ń bá ara wọn sọ̀rọ̀ nípa gbogbo nǹkan wọ̀nyí tí ó ti ṣẹlẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń bá ara wọn jíròrò nípa gbogbo ìṣẹ̀lẹ̀ wọ̀nyí tí ó ti wáyé.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὡμίλουν àti τῶν συμβεβηκότων τούτων, láìyí ìtumọ̀ pàtàkì padà.
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bójú mu, ó sì pa ìsopọ̀ pẹ̀lú ohun tó ṣáájú mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Arọ́pò-orúkọ Gíríìkì náà hàn gbangba, ṣùgbọ́n ìtẹnumọ́ rẹ̀ kò lágbára níbí; “wọ́n” ni ọ̀nà àdánidá jù lọ ní Yorùbá.
- source_word: ὡμίλουν
  choice: ń bá ara wọn sọ̀rọ̀
  rationale: Àkókò imperfect fi hàn pé ìṣe náà ń lọ lọ́wọ́ nígbà náà; gbólóhùn yìí tún fi ìjíròrò láàárín wọn hàn, kì í ṣe ọ̀rọ̀ àsọyé.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Ó fi hàn pé ọ̀rọ̀ náà ń lọ láti ọ̀dọ̀ ẹnìkan sí ẹnì kejì; “bá ara wọn sọ̀rọ̀” jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: περὶ πάντων
  choice: nípa gbogbo
  rationale: “Nípa” fi kókó ọ̀rọ̀ hàn, “gbogbo” sì bo àpapọ̀ àwọn ohun tí a ń tọ́ka sí.
- source_word: τῶν συμβεβηκότων τούτων
  choice: nǹkan wọ̀nyí tí ó ti ṣẹlẹ̀
  rationale: Perfect participle náà tọ́ka sí àwọn ohun tó ti ṣẹlẹ̀ tí ipa wọn ṣì ṣe pàtàkì nínú ìtàn; “tí ó ti ṣẹlẹ̀” sọ ìṣe tó parí yẹn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “ń bá ara wọn sọ̀rọ̀” dípò ọ̀rọ̀ tó le tàbí tó dà bí àsọyé, a sì pa ìṣe tó ń lọ lọ́wọ́ inú imperfect mọ́.
