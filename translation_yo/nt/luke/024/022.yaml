lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ṣùgbọ́n … pẹ̀lú
  rationale: 'Ó pa agbára ìtakora àti àfikún mọ́: ọ̀rọ̀ yìí yí padà kúrò nínú ìjákulẹ̀ tí wọ́n ṣẹ̀ṣẹ̀ sọ, ó sì fi ìṣẹ̀lẹ̀ míì tí ó yani lẹ́nu kún un.'
- source_word: γυναῖκές τινες
  choice: àwọn obìnrin kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí iye obìnrin tí a kò sọ pàtó.
- source_word: ἐξ ἡμῶν
  choice: lára wa
  rationale: Ó fi hàn pé àwọn obìnrin náà wà lára ẹgbẹ́ àwọn ọmọ-ẹ̀yìn, kì í ṣe pé wọ́n kàn wá láti ọ̀dọ̀ wọn.
- source_word: ἐξέστησαν ἡμᾶς
  choice: mú wa ní ìyàlẹ́nu gidigidi
  rationale: Ó sọ agbára ìyàlẹ́nu tàbí ìdàrúdàpọ̀ inú ọ̀rọ̀ Gíríìkì láì pinnu bóyá àwọn tó ń sọ̀rọ̀ gba ẹ̀rí àwọn obìnrin náà gbọ́.
- source_word: γενόμεναι
  choice: wọ́n dé
  rationale: Pẹ̀lú ὀρθριναὶ àti gbólóhùn ibi tí ó tẹ̀ lé e, ọ̀rọ̀ náà ṣàpèjúwe wíwà àwọn obìnrin náà ní ibojì ní kùtùkùtù; ‘wọ́n dé’ sọ èyí ní Yorùbá àdánidá.
- source_word: ὀρθριναὶ
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Ó túmọ̀ sí àkókò tí ó ṣáájú púpọ̀ ní òwúrọ̀ tàbí nígbà tí ilẹ̀ ń mọ́, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ibojì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, μνημεῖον ni ibi tí a sin Jésù sí; ‘ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí ‘wọ́n dé’ sì ń fi ìlọ sí ibẹ̀ hàn.
theological_decisions:
- issue: Agbára ἐξέστησαν nínú ìròyìn nípa àjíǹde
  choice: mú wa ní ìyàlẹ́nu gidigidi
  alternative: mú ẹnu yà wá; dá wa rú
  rationale: 'Yíyan ọ̀rọ̀ yìí pa ìṣòro inú ìtàn náà mọ́: ó sọ ìhùwàsí àwọn ọmọ-ẹ̀yìn sí ìròyìn àwọn obìnrin láì fi kún un pé wọ́n gbà á gbọ́ tàbí pé wọ́n kọ̀ ọ́.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó sì ní iyì. Àtòjọ ‘Ṣùgbọ́n … pẹ̀lú’ pa ìtakora àti àfikún Gíríìkì mọ́. Àmì kọ́mà ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
