source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n jọ́sìn rẹ̀[a][b], wọ́n sì padà sí Jerúsálẹ́m pẹ̀lú ayọ̀ ńlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kò ní “lẹ́yìn tí wọ́n jọ́sìn rẹ̀.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “lẹ́yìn tí wọ́n forí balẹ̀ fún un” tàbí “lẹ́yìn tí wọ́n tẹrí ba fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bójú mu, ó sì pa ìsopọ̀ pẹ̀lú ohun tó ṣáájú mọ́ láìfi ìtumọ̀ àkókò míì kún un.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí hàn gbangba nínú Gíríìkì. “Wọ́n” jẹ́ èdè Yorùbá àdánidá; fífi “àwọn fúnra wọn” ṣe é yóò tẹnumọ́ ọ ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
- source_word: προσκυνήσαντες αὐτόν
  choice: nígbà tí wọ́n ti jọ́sìn rẹ̀
  rationale: Ìkọ̀ participle aorist náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìpadà wọn. Nínú àyíká Jésù tí ó jíǹde tí a sì gbé sókè, “jọ́sìn rẹ̀” bá ọ̀rọ̀ náà mu, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ “forí balẹ̀ fún un” mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe.
- source_word: ὑπέστρεψαν
  choice: wọ́n padà
  rationale: Èyí sọ ìtumọ̀ ọ̀rọ̀-ìṣe Gíríìkì náà ní kedere àti ní èdè ìtàn Yorùbá tó wọ́pọ̀.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́m
  rationale: “Sí” ni ọ̀nà àdánidá láti fi ibi tí wọ́n ń lọ hàn ní Yorùbá.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: Ìtumọ̀ yìí pa χαρά àti agbára ajẹtífù μεγάλη mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí Jésù tí ó jíǹde
  choice: jọ́sìn rẹ̀
  alternative: forí balẹ̀ fún un / fi ọ̀wọ̀ gíga fún un
  rationale: Àyíká lẹ́yìn àjíǹde àti ìgòkè re ọ̀run mú kí “jọ́sìn” yẹ, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè ṣàpèjúwe fíforíbalẹ̀ tàbí fífi ọ̀wọ̀ gíga hàn; àlàyé ìsàlẹ̀ ojú ìwé kò jẹ́ kí àìdánilójú ìtumọ̀ yìí sọnù.
- issue: 'Gbólóhùn tí àfọwọ́kọ rẹ̀ yàtọ̀: [προσκυνήσαντες αὐτόν]'
  choice: A fi í sínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé àyípadà àfọwọ́kọ ní ìsàlẹ̀ ojú ìwé.
  alternative: Kí a yọ ọ́ kúrò gẹ́gẹ́ bí ohun tí àwọn àfọwọ́kọ kan kò ní.
  rationale: SBLGNT fi gbólóhùn náà hàn ṣùgbọ́n ó samì sí i gẹ́gẹ́ bí èyí tí ẹ̀rí àfọwọ́kọ rẹ̀ kò dájú; nítorí náà a pa á mọ́, a sì sọ àìdánilójú náà ní gbangba.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìkọ̀ “nígbà tí … ti” fi hàn pé ìjọ́sìn náà ṣáájú ìpadà wọn, bí participle aorist Gíríìkì ṣe ń ṣiṣẹ́ ní àyíká yìí.
