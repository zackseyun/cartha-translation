id: LUK.24.16
reference: Luke 24:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: yo
  text: Ṣùgbọ́n a dí ojú wọn mú, kí wọn má bàa dá a mọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ṣùgbọ́n a dá ojú wọn dúró láti dá a mọ̀,” tàbí, “Ṣùgbọ́n a kò jẹ́ kí wọn dá a mọ̀.” Gíríìkì kò sọ ẹni tí ó ṣe èyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Asopọ̀ onírẹ̀lẹ̀ yìí fi ìyàtọ̀ hàn láàárín wíwà Jésù pẹ̀lú wọn àti àìdámọ̀ ọ́n wọn.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ojú wọn
  rationale: Ó pa àwòrán ara tí Gíríìkì lò mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐκρατοῦντο
  choice: a dí ... mú
  rationale: Ìṣe aláìlórúkọ olùṣe yìí sọ pé a dá ojú wọn dúró tàbí a ṣàkóso rẹ̀, láìsọ ẹni tí ó ṣe bẹ́ẹ̀.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: kí wọn má bàa dá ... mọ̀
  rationale: Ní àyíká ìtàn yìí, ἐπιγινώσκω túmọ̀ sí dídá ẹni tí wọ́n rí mọ̀, kì í ṣe mímọ̀ ní gbogbogbòò.
- source_word: αὐτόν
  choice: a
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù; irú àkọsílẹ̀ Yorùbá yìí jẹ́ àdánidá nínú gbólóhùn ‘dá a mọ̀.’
theological_decisions:
- issue: Bóyá kí a sọ ẹni tí ó dí wọn lọ́wọ́ dídá Jésù mọ̀
  choice: 'A fi olùṣe sílẹ̀ láìdárúkọ rẹ̀: ‘a dí ojú wọn mú.’'
  alternative: ‘Ọlọ́run dí ojú wọn mú’ tàbí ‘wọn kò lè dá a mọ̀.’
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ passive, kò sì dárúkọ olùṣe. Lílo ‘a’ aláìlórúkọ pa àìṣedéédé yẹn mọ́, láìfi Ọlọ́run kun un ní tààràtà tàbí yí ọ̀rọ̀ náà padà sí àìlera wọn lásán.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé yé ni a lò. ‘A dí ojú wọn mú’ pa àwòrán ‘ojú’ àti ìṣe aláìlórúkọ olùṣe mọ́; àmì ẹsẹ̀ [a] ṣàlàyé àwọn ìtumọ̀ míì àti àìdárúkọ olùṣe.
