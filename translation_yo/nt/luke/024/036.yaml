id: LUK.24.36
reference: Luke 24:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: yo
  text: Bí wọ́n sì ti ń sọ àwọn nǹkan wọ̀nyí[a], òun fúnra rẹ̀ dúró láàárín wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé-àfọwọ́kọ kan fi kún un pé, “ó sì wí fún wọn pé, ‘Àlàáfíà fún yín.’”
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka aláìlẹ́mìí ọ̀pọ̀ yìí ń tọ́ka sí àwọn ohun tí wọ́n ṣẹ̀ṣẹ̀ ń sọ; yíyan ọ̀rọ̀ yìí pa ìtumọ̀ ọ̀pọ̀ àti àsopọ̀ pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: δὲ
  choice: sì
  rationale: Nínú gbólóhùn aláṣepọ̀ onígẹ́nítífù yìí, δέ ń so ìṣẹ̀lẹ̀ tuntun mọ́ ọ̀rọ̀ tí ń lọ lọ́wọ́. Àpapọ̀ ‘Bí ... sì ti’ fi ìgbà kan náà àti ìyípadà inú ìtàn hàn lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτῶν λαλούντων
  choice: bí wọ́n ti ń sọ
  rationale: Ẹ̀yà ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú àkójọpọ̀ gẹ́nítífù fi ọ̀rọ̀ sísọ tí ń lọ lọ́wọ́ hàn, ní àkókò kan náà pẹ̀lú ìṣẹ̀lẹ̀ àkọ́kọ́.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: αὐτός jẹ́ ti ìtẹnumọ́ níbí; ‘òun fúnra rẹ̀’ pa ìtẹnumọ́ pé ẹni náà gan-an ni ó wà níwájú wọn mọ́.
- source_word: ἔστη
  choice: dúró
  rationale: Aorist ἵστημι túmọ̀ sí pé ó gba ipò ìdúró. ‘Dúró’ jẹ́ ìtumọ̀ tààrà, láìfi èrò ‘farahàn’ tàbí ìṣípò tí kò hàn nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐν μέσῳ αὐτῶν
  choice: láàárín wọn
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó dúró ní àárín àwùjọ wọn, ó sì pa ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá kí a fi àfikún ọ̀pọ̀ ìwé-àfọwọ́kọ náà, ‘ó sì wí fún wọn pé, “Àlàáfíà fún yín,”’ sínú ọ̀rọ̀ pàtàkì.
  choice: A kò fi í sínú ọ̀rọ̀ pàtàkì, ní ìbámu pẹ̀lú SBLGNT tí a pèsè.
  alternative: Kí a fi ‘ó sì wí fún wọn pé, “Àlàáfíà fún yín.”’ kún un.
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè parí sí ‘láàárín wọn’ kò sì ní ikíni náà. Nítorí àyípadà yìí ṣe pàtàkì nínú ẹ̀rí àwọn ìwé-àfọwọ́kọ, a tọ́ka sí i nínú àlàyé ìsàlẹ̀ dípò fífi í sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Bí wọ́n sì ti ń sọ’ jẹ́ àkójọpọ̀ tó ṣe àfihàn ìṣe méjì tó ń ṣẹlẹ̀ ní àkókò kan náà; ‘òun fúnra rẹ̀’ sì pa ìtẹnumọ́ orísun mọ́.
