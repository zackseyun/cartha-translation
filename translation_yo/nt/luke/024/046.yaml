id: LUK.24.46
reference: Luke 24:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: yo
  text: 'Ó sì sọ fún wọn pé, “Báyìí ni a ti kọ ọ́ sílẹ̀: Mèsáyà[a] yóò jìyà, yóò sì dìde kúrò láàárín àwọn òkú ní ọjọ́ kẹta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ perfect passive tí a sábà máa ń lò láti tọ́ka sí ohun tí Ìwé Mímọ́ sọ, ohun tí ó sì dúró gẹ́gẹ́ bí ohun tí a kọ sílẹ̀.
- source_word: παθεῖν
  choice: yóò jìyà
  rationale: Infinitive náà sọ àkóónú ohun tí a kọ sílẹ̀; ‘yóò jìyà’ jẹ́ èdè Yorùbá àdánidá láìfi ìtumọ̀ dandan tí kò hàn gbangba sínú gbólóhùn náà.
- source_word: τὸν χριστόν
  choice: Mèsáyà
  rationale: Níbí, Χριστός jẹ́ oyè ẹni tí a fòróró yàn nínú àyíká Ìwé Mímọ́, kì í ṣe orúkọ lásán.
- source_word: ἀναστῆναι
  choice: dìde
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ active infinitive, nítorí náà ‘dìde’ pa ohùn active mọ́ ju ‘a ó jí i dìde’ lọ.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí fi ìtumọ̀ ἐκ, ìyẹn jíjáde kúrò láàárín àwọn tí ó kú, hàn ní kíkún, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Dative náà ń tọ́ka sí àkókò; ‘ní ọjọ́ kẹta’ ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: οὕτως
  choice: Báyìí ni
  rationale: Ó pa ìtumọ̀ ‘ní ọ̀nà yìí/báyìí’ mọ́, ó sì bá ìṣílétí ohun tí Ìwé Mímọ́ sọ mu.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ jẹ́ àmì àdánidá ní Yorùbá fún gbólóhùn àkóónú tí ὅτι ń ṣàgbékalẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àkótán ìjìyà àti àjíǹde
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ náà fi hàn pé oyè ni ọ̀rọ̀ náà jẹ́ níbí; ‘Mèsáyà’ pa àyíká Júù àti ìlérí Ìwé Mímọ́ mọ́.
- issue: Ohùn ọ̀rọ̀-ìṣe àjíǹde ἀναστῆναι
  choice: yóò dìde
  alternative: a ó jí i dìde
  rationale: Gíríìkì ní active infinitive; yíyàn ‘dìde’ kò yí ọ̀rọ̀ inú ẹsẹ yìí sí passive, bí ó tilẹ̀ jẹ́ pé àwọn ẹsẹ mìíràn sọ pé Ọlọ́run jí Jesu dìde.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A yan ‘Ó sì sọ fún wọn’ fún ìtẹ̀síwájú ìtàn; ‘a ti kọ ọ́’ pa agbára perfect passive àti àṣà ìtọ́ka sí Ìwé Mímọ́ mọ́. Àmì ẹsẹ̀ [a] wà lẹ́yìn ‘Mèsáyà’ gẹ́gẹ́ bí àlàyé yíyan ọ̀rọ̀.
