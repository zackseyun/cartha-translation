revisions:
- from: Ó sì sọ fún wọn pé, “Báyìí ni a ti kọ ọ́ pé, Mèsáyà[a] yóò jìyà, yóò sì dìde kúrò láàárín àwọn òkú ní ọjọ́ kẹta.”
  to: 'Ó sì sọ fún wọn pé, “Báyìí ni a ti kọ ọ́ sílẹ̀: Mèsáyà[a] yóò jìyà, yóò sì dìde kúrò láàárín àwọn òkú ní ọjọ́ kẹta.”'
  rationale: The revision improves the Yoruba scriptural-introductory idiom and punctuation while leaving the source-level meanings intact. It retains the future-style rendering of the infinitives without inserting ‘must,’ preserves the active force of ‘dìde,’ and keeps the explicit ‘láàárín àwọn òkú’ nuance for ἐκ νεκρῶν. The sole note remains correctly anchored to Mèsáyà and presents Kristi as the alternative title.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal Greek elements: the scriptural formula γέγραπται, the titular sense of τὸν χριστόν, active ‘rise’ for ἀναστῆναι, the ‘from among the dead’ sense of ἐκ νεκρῶν, and the temporal phrase ‘on the third day.’ The revised wording retains these features without adding necessity language.'
  naturalness: '‘Báyìí ni a ti kọ ọ́ pé, ...’ is understandable but somewhat congested in modern Standard Yoruba, especially with both pé and a following comma. ‘Báyìí ni a ti kọ ọ́ sílẹ̀: ...’ is a more idiomatic scriptural formula and clearly introduces the content that follows.'
  terminology: Mèsáyà is an appropriate rendering of the titular Χριστός in this context. The note’s gloss is refined so that it says ‘the one anointed with oil,’ rather than implying primarily that oil itself performs the choosing.
  issues:
  - severity: low
    issue: The introductory construction is punctuationally and idiomatically awkward.
    rationale: After ‘Báyìí ni a ti kọ ọ́ pé,’ the comma creates an unnatural break before the content clause. Using ‘a ti kọ ọ́ sílẹ̀:’ gives a natural Yoruba presentation of the standing scriptural witness while preserving the sense of γέγραπται.
  - severity: low
    issue: The footnote gloss ‘ẹni tí a fòróró yàn’ is imprecise.
    rationale: Χριστός denotes one who has been anointed. ‘Ẹni tí a fi òróró yàn’ expresses the traditional anointing-and-appointment sense more naturally and accurately.
  revised_text: 'Ó sì sọ fún wọn pé, “Báyìí ni a ti kọ ọ́ sílẹ̀: Mèsáyà[a] yóò jìyà, yóò sì dìde kúrò láàárín àwọn òkú ní ọjọ́ kẹta.”'
  revised_footnotes:
