id: LUK.24.10
reference: Luke 24:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: yo
  text: Àwọn náà ni Màríà ará Magdalà, Jóánà, Màríà ìyá Jákọ́bù[a], àti àwọn obìnrin yòókù tí wọ́n wà pẹ̀lú wọn; wọ́n sì ń sọ ohun wọ̀nyí fún àwọn aposteli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì ní ‘Màríà ti Jákọ́bù.’ Ó ṣeé ṣe jù pé èyí túmọ̀ sí ‘Màríà ìyá Jákọ́bù,’ bí ó tilẹ̀ jẹ́ pé ‘Màríà aya Jákọ́bù’ tún ṣeé ṣe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Àwọn náà ni
  rationale: Ọ̀rọ̀ yìí dá àwọn obìnrin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ̀. Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì jẹ́ kí δέ ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn pẹ̀lẹ́ láìfi ọ̀rọ̀ àkókò kan kún un.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Màríà ará Magdalà
  rationale: Orúkọ yìí fi Màríà hàn gẹ́gẹ́ bí ẹni tí ó wá láti Magdalà; ‘ará Magdalà’ mú ìtumọ̀ orúkọ ìdánimọ̀ náà jáde ní Yorùbá tó ṣe kedere.
- source_word: Ἰωάννα
  choice: Jóánà
  rationale: Èyí jẹ́ àkọsílẹ̀ orúkọ náà ní ìró Yorùbá.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Màríà ìyá Jákọ́bù
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní kúkúrú pé ‘Màríà ti Jákọ́bù.’ Nínú irú ìdánimọ̀ yìí, ìyá Jákọ́bù ni ìtumọ̀ tó ṣeé ṣe jù, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé pa àìdánilójú inú orísun mọ́.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: àwọn obìnrin yòókù tí ó wà pẹ̀lú wọn
  rationale: Àpèjúwe náà jẹ́ akọ-abo obìnrin ní ọ̀pọ̀; fífi ‘obìnrin’ hàn gbangba jẹ́ Yorùbá àdánidá, ó sì bá àwọn tí a ń tọ́ka sí mu.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àmì ìṣe aláìparí nínú Gíríìkì tọ́ka sí ìṣe tó ń lọ tàbí tí wọ́n ń ṣe léraléra; ‘ń sọ’ pa ìrísí yẹn mọ́.
- source_word: ταῦτα
  choice: ohun wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí tọ́ka sí àwọn ìṣẹ̀lẹ̀ àti ọ̀rọ̀ tí wọ́n ròyìn ṣáájú.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: fún àwọn aposteli
  rationale: ‘Aposteli’ jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa ní Yorùbá fún àwọn tí Jésù rán; ‘sọ ... fún’ jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá tó bá ibi yìí mu.
theological_decisions:
- issue: Ìbátan tí Μαρία ἡ Ἰακώβου ń tọ́ka sí
  choice: Màríà ìyá Jákọ́bù
  alternative: Màríà aya Jákọ́bù, tàbí ní tààrà ‘Màríà ti Jákọ́bù’
  rationale: Gíríìkì kò sọ irú ìbátan náà ní gbangba. ‘Ìyá Jákọ́bù’ ni ó ṣeé ṣe jù nínú ọ̀nà ìdánimọ̀ àwọn obìnrin nínú àwọn Ìhìn Rere, ṣùgbọ́n a tọ́ka sí ìtumọ̀ mìíràn nínú àlàyé kí a má bàa pa àìdánilójú orísun rẹ́.
translation_notes:
  register: Yorùbá àpapọ̀, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yan ìṣọ̀kan ọ̀rọ̀ àdánidá ‘sọ ohun wọ̀nyí fún’.
