id: LUK.24.5
reference: Luke 24:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: yo
  text: Nígbà tí ẹ̀rù sì bà wọ́n gidigidi, tí wọ́n sì tẹ ojú wọn ba ilẹ̀, wọ́n sọ fún wọn pé, “Èé ṣe tí ẹ fi ń wá ẹni tí ó wà láàyè láàárín àwọn òkú?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ́ ní ọ̀rọ̀ gangan, “Kí ni ẹ ń wá ẹni tí ó wà láàyè pẹ̀lú àwọn òkú?” Nínú àyíká ọ̀rọ̀ yìí, ìtumọ̀ rẹ̀ ni, “Èé ṣe tí ẹ fi ń wá ẹni tí ó wà láàyè láàárín àwọn òkú?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: Nígbà tí ẹ̀rù sì bà wọ́n gidigidi
  rationale: Ọ̀rọ̀ yìí fi hàn pé ẹ̀rù ńlá dé bá wọn ní àkókò náà; “ẹ̀rù bà wọ́n gidigidi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbẹ̀rù líle náà.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: tí wọ́n sì tẹ ojú wọn ba ilẹ̀
  rationale: Èyí pa àwòrán ìṣe ara tí ọ̀rọ̀ Gíríìkì gbé kalẹ̀ mọ́, ó sì lè fi ìbẹ̀rù tàbí ọ̀wọ̀ hàn láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: εἶπαν πρὸς αὐτάς
  choice: wọ́n sọ fún wọn
  rationale: A pa àwọn arọ́pò-orúkọ inú orísun mọ́, láì tún “àwọn ọkùnrin” tàbí “àwọn obìnrin” sọ níbi tí Gíríìkì kò ti tún wọn sọ.
- source_word: Τί ζητεῖτε
  choice: Èé ṣe tí ẹ fi ń wá
  rationale: Bí ó tilẹ̀ jẹ́ pé τί lè túmọ̀ sí “kí ni,” nínú ìbéèrè yìí ó ń béèrè ìdí tí wọ́n fi ń wá a; “Èé ṣe tí ẹ fi ń wá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àkókò ìṣe tí ń lọ mu.
- source_word: τὸν ζῶντα
  choice: ẹni tí ó wà láàyè
  rationale: Èyí pa ìtumọ̀ ẹni kan ṣoṣo tí ó ń bẹ láàyè mọ́, láìsọ ọ́ di èrò àìní-ẹni tàbí fi àlàyé àjinde kún ọ̀rọ̀ náà.
- source_word: μετὰ τῶν νεκρῶν
  choice: láàárín àwọn òkú
  rationale: μετά pẹ̀lú ọ̀rọ̀ oníṣe-ẹni kejì lè túmọ̀ sí “pẹ̀lú” tàbí “láàárín”; “láàárín àwọn òkú” ni ọ̀rọ̀ Yorùbá àdánidá jù lọ nínú àyíká ibojì yìí.
theological_decisions:
- issue: Ìtọ́kasí àjinde nínú τὸν ζῶντα
  choice: ẹni tí ó wà láàyè
  alternative: alààyè náà
  rationale: Ìtumọ̀ yìí fi Jésù hàn gẹ́gẹ́ bí ẹni tí ó wà láàyè ní ìyàtọ̀ sí àwọn òkú, ó sì pa agbára ọ̀rọ̀ nípa àjinde mọ́ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: A lo Yorùbá àkọ́tọ̀ pẹ̀lú àmì ohùn ní èdè òde òní tó ní iyì, tó sì yé òǹkàwé lasán. Ìtòlẹ́sẹẹsẹ àwọn gbólóhùn kéékèèké pa ìbáṣepọ̀ àwọn participle Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá.
