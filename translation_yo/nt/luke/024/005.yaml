  terminology: “Ẹni tí ó wà láàyè” pa substantival participle τὸν ζῶντα mọ́ gẹ́gẹ́ bí ẹni kan, láìfi àlàyé ẹ̀kọ́ míràn kún un. “Láàárín àwọn òkú” jẹ́ ìtumọ̀ àdánidá àti tó péye fún μετὰ τῶν νεκρῶν nínú àyíká yìí.
