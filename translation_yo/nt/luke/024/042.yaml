translation:
  language: yo
  text: Wọ́n sì fún un ní apá kan lára ẹja tí a yan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan tó dé lẹ́yìn fi kún un pé, “àti lára afárá oyin.”
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: οἱ jẹ́ arọ́pò-orúkọ níhìn-ín, ó ń tọ́ka sí àwọn ọmọ-ẹ̀yìn tí wọ́n péjọ; δέ jẹ́ àsopọ̀ pẹ̀lẹ́. “Wọ́n sì” ń bá ìtàn náà lọ lọ́nà àdánidá láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: ἐπέδωκαν αὐτῷ
  choice: fún un ní
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí fífún tàbí fífi ohun lé ẹnì kan lọ́wọ́; ìṣètò “fún un ní” ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún ẹni tí a fún ní ohun kan.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: apá kan lára ẹja tí a yan
  rationale: μέρος ni olórí gbólóhùn náà, ó túmọ̀ sí “apá” tàbí “ìpín”; ἰχθύος ὀπτοῦ ṣàlàyé pé apá náà jẹ́ lára ẹja tí a fi ooru yan. Ìtumọ̀ yìí pa ìtumọ̀ “ẹyọ ẹja kan” mọ́ra nítorí orísun sọ ní pàtó pé apá kan ni.
- source_word: ὀπτοῦ
  choice: tí a yan
  rationale: ὀπτός tọ́ka sí oúnjẹ tí a fi ooru yan tàbí sun. “Tí a yan” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọ̀nà pípèsè ẹja náà mu láìsọ ọ́ di “sísè” lásán.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀ inú Lúùkù 24:42
  choice: 'A túmọ̀ SBLGNT nìkan: “apá kan lára ẹja tí a yan.”'
  alternative: Àwọn àfọwọ́kọ kan tó dé lẹ́yìn fi kún un pé, “àti lára afárá oyin.”
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè parí sí μέρος, kò sì ní àfikún nípa afárá oyin. A tẹ̀ lé ẹ̀rí orísun àríwísí náà, ṣùgbọ́n a fi àyípadà àfọwọ́kọ tí ó gbajúmọ̀ sínú àlàyé ìsàlẹ̀ fún ìṣípayá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà rọrùn, ó lọ́lá, ó sì yẹ fún kíkà ní gbangba. “Apá kan lára” mú ìtumọ̀ μέρος hàn gbangba, “ẹja tí a yan” sì jẹ́ ọ̀nà àdánidá ju gbígbé àkójọpọ̀ ọ̀rọ̀ Gíríìkì wọ Yorùbá lọ.
