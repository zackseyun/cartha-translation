source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù dìde, ó sì sáré lọ sí ibojì náà; ó sì tẹrí ba wo inú rẹ̀, ó rí àwọn aṣọ ọ̀gbọ̀ náà nìkan; ó sì lọ, ó ń ṣe kàyéfì nínú ara rẹ̀ nípa ohun tí ó ṣẹlẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀rí àfọwọ́kọ àtijọ́ kan kò ní ẹsẹ yìí. Gbólóhùn náà tí a túmọ̀ sí “ó ń ṣe kàyéfì nínú ara rẹ̀” lè tún túmọ̀ sí pé ó lọ sí ilé rẹ̀.
    reason: Àmì ⸂…⸃ nínú SBLGNT tọ́ka sí ìyàtọ̀ pàtàkì nínú ẹ̀rí àfọwọ́kọ lórí ẹsẹ náà. πρὸς ἑαυτόν lè gba ìtumọ̀ ibi (“sí ilé rẹ̀”) tàbí ìtumọ̀ ìrònú inú ẹni; ìtumọ̀ àkọ́kọ́ nínú ẹsẹ náà yàgò fún fífi ibi kan dá lórí ọ̀rọ̀ náà.
lexical_decisions:
- source_word: μνημεῖον
  choice: ibojì
  rationale: Ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bójú mu ibojì tí a gbẹ sínú àpáta nínú àyíká ìtàn náà.
- source_word: παρακύψας
  choice: tẹ̀ síwájú láti wo inú rẹ̀
  rationale: Ó mú ìṣe títẹ ara síwájú tàbí fífi orí wọlé láti wo inú ibojì hàn ní èdè Yorùbá àdánidá.
- source_word: ὀθόνια
  choice: àwọn aṣọ ọ̀gbọ̀
  rationale: Ó tọ́ka sí àwọn aṣọ ọ̀gbọ̀ kéékèèké tàbí aṣọ ìdìmọ́ tí wọ́n fi wé òkú.
- source_word: θαυμάζων
  choice: ó ń ṣe kàyéfì
  rationale: Ó pa ìtumọ̀ ìyàlẹ́nu àti ríronú jinlẹ̀ sí ohun tí ó ṣẹlẹ̀ mọ́, láìfi ìgbàgbọ́ tàbí àìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìtumọ̀ πρὸς αὑτόν
  choice: ó lọ sí ilé rẹ̀
  alternative: ó lọ, ó ń ṣe kàyéfì nínú ara rẹ̀
  rationale: Nínú èdè Gíríìkì, gbólóhùn náà lè túmọ̀ sí pé ó lọ sí ilé rẹ̀ tàbí pé ó lọ lọ́tọ̀, ó ń ṣe kàyéfì nínú ara rẹ̀. Àkọsílẹ̀ pàtó yìí yàn ìtumọ̀ ibi tí ó ń lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìṣòro náà mọ́.
- issue: Àkókò ọ̀rọ̀ βλέπει
  choice: ó rí
  alternative: ó rí i / ó ń rí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí nínú ìtàn, Yorùbá àdánidá máa ń sọ ìṣẹ̀lẹ̀ ìgbà àtijọ́ yìí ní ‘ó rí’; a kò yí àkókò ìṣẹ̀lẹ̀ náà tàbí ìtumọ̀ rẹ̀ padà.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
