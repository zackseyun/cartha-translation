  text: And they found the stone rolled away from the tomb,
translation:
  language: yo
  text: Wọ́n sì rí i pé a ti yí òkúta náà kúrò ní ibojì náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: wọ́n rí i pé
  rationale: Ọ̀rọ̀-ìṣe aorist active indicative ẹni kẹta ọ̀pọ̀ ni; olùṣe tí a kò tún dárúkọ ni àwọn obìnrin inú ẹsẹ tó ṣáájú. ‘Wọ́n rí i pé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí wọ́n bá ní ipò kan.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; ‘sì’ bá ìṣàn ìtàn Yorùbá mu láìfi ìtakora líle kún un.
- source_word: τὸν λίθον
  choice: òkúta náà
  rationale: Nínú àyíká ìsìnkú yìí, λίθος ni òkúta tí a fi dí ibojì; ‘òkúta náà’ tọ́ka sí òkúta tí a mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἀποκεκυλισμένον
  choice: a ti yí … kúrò
  rationale: Perfect passive participle náà fi hàn pé ẹnì kan ti yí òkúta náà, ó sì wà ní ipò tí a ti mú un kúrò. Ilana ‘a ti’ pa ohùn aláìṣe àti èsì tó ṣì dúró mọ́.
- source_word: ἀπὸ τοῦ μνημείου
  choice: ní ẹnu ibojì náà
  rationale: μνημεῖον nínú àyíká Ìhìn Rere túmọ̀ sí ibojì. ‘Kúrò ní ẹnu ibojì náà’ sọ ibi tí a ti yí òkúta náà kúrò ní Yorùbá àdánidá; fífi ‘ẹnu’ kún un jẹ́ ìtumọ̀ àyíká fún ibi tí òkúta ìdíbo náà wà.
theological_decisions:
- issue: Olùṣe ọ̀pọ̀ tí Gíríìkì kò tún dárúkọ
  choice: Wọ́n sì rí i pé
  alternative: Ó sì hàn sí wọn pé
  rationale: Fáwẹ́lì ọ̀pọ̀ inú εὗρον tọ́ka padà sí àwọn obìnrin inú ẹsẹ tó ṣáájú. ‘Wọ́n’ mú gbólóhùn Yorùbá pé láìfi ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìpo òkúta lẹ́yìn tí a yí i
  choice: a ti yí òkúta náà kúrò
  alternative: òkúta náà ti yí kúrò
  rationale: Ohùn aláìṣe inú ἀποκεκυλισμένον fi iṣẹ́ tí a ṣe sí òkúta hàn, láìsọ ẹni tó ṣe é. ‘A ti yí’ pa àìdárúkọ olùṣe náà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A yan ‘ibojì’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ gíga.
