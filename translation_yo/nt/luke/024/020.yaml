id: LUK.24.20
reference: Luke 24:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: yo
  text: àti bí àwọn olórí àlùfáà àti àwọn alákòóso wa ṣe fi í fún ìdájọ́ ikú, tí wọ́n sì kàn án mọ́ àgbélébùú.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti dá a lẹ́bi ikú” tàbí “fún ìdájọ́ ikú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n sì mú kí a kàn án mọ́ àgbélébùú,” èyí tó mú un ṣe kedere pé àwọn olórí náà ló ru ojúṣe, bí ó tilẹ̀ jẹ́ pé àwọn aláṣẹ Róòmù ló ṣe ìpànìyàn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: àti bí ... ṣe
  rationale: Ìsọ̀rọ̀ yìí ń tẹ ohun tí a ń ròyìn nínú ẹsẹ tó ṣáájú lọ; ‘àti bí ... ṣe’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹ̀síwájú àti àkóónú náà hàn.
- source_word: παρέδωκαν
  choice: fi í lé wọn lọ́wọ́
  rationale: Ó túmọ̀ sí fífi ẹnì kan lé aláṣẹ tàbí àwọn tó máa ṣe ìdájọ́ lọ́wọ́; kò fi ìtumọ̀ tó dín kù sí ‘dalẹ̀’ sínú ọ̀rọ̀ náà.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí ẹgbẹ́ àwọn aṣáájú àlùfáà, kì í ṣe pé ọ̀pọ̀ olórí àlùfáà gíga ń ṣiṣẹ́ ní ipò kan náà.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: àwọn alákòóso wa
  rationale: ‘Àwọn alákòóso’ pa ìtumọ̀ àwọn tó ní ọlá àṣẹ nínú ọ̀ràn ìṣèlú àti ìdájọ́ mọ́; ‘wa’ sì pa ìdánimọ̀ àwọn olùsọ̀rọ̀ mọ́.
- source_word: εἰς κρίμα θανάτου
  choice: láti dájọ́ ikú fún un
  rationale: κρίμα lè jẹ́ ìdájọ́, ìpinnu ilé-ẹjọ́, tàbí ẹ̀bi tí a dá; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó pa àbájáde ìdájọ́ sí ikú mọ́.
- source_word: ἐσταύρωσαν
  choice: kàn án mọ́ àgbélébùú
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ aláṣe tààrà, ó sì gbé ojúṣe lé àwọn olórí náà; ìtumọ̀ yìí kò fi àlàyé àfikún nípa àwọn ará Róòmù sínú ẹsẹ náà.
theological_decisions:
- issue: Ẹni tó ru ojúṣe fún pípa Jésù
  choice: ‘wọ́n sì kàn án mọ́ àgbélébùú,’ pẹ̀lú ìṣe tààrà gẹ́gẹ́ bí Gíríìkì
  alternative: ‘wọ́n sì mú kí a kàn án mọ́ àgbélébùú’
  rationale: Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀-ìṣe aláṣe pẹ̀lú àwọn olórí àlùfáà àti alákòóso gẹ́gẹ́ bí olùṣe. Èyí pa ìdálẹ́bi wọn mọ́ láìpinnu pé ọwọ́ wọn fúnra wọn ni ó ṣe iṣẹ́ ìpànìyàn náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti àdánidá fún òǹkàwé òde òní. A lo ‘fi í lé wọn lọ́wọ́’ láti fi ipò ìdájọ́ hàn, àti ‘àgbélébùú’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀. Àwọn àmì ohùn àti àmì ẹsẹ̀ Yorùbá wà níbi tí ó bá yẹ.
