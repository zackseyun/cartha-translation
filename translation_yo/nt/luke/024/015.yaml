  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé bí wọ́n ti ń bá ara wọn sọ̀rọ̀, tí wọ́n sì ń jíròrò[a], Jésù fúnra rẹ̀ sún mọ́ wọn, ó sì ń bá wọn rìn lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń bá ara wọn ṣe àríyànjiyàn”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìjíròrò tó le sí i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sún mọ́ wọn, ó sì bá wọn rìn lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà ìtàn Lúùkù láti so ìṣẹ̀lẹ̀ tuntun mọ́ èyí tó ṣáájú; gbólóhùn yìí jẹ́ ti Yorùbá òde òní, kò sì ní àwọ̀ èdè àtijọ́.
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: bí wọ́n ti ń bá ara wọn sọ̀rọ̀
  rationale: Ẹ̀ka ọ̀rọ̀ yìí ń tọ́ka sí ohun tó ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ mìíràn ṣẹlẹ̀; “bá ara wọn sọ̀rọ̀” fi ìjíròrò láàárín wọn hàn ní èdè àdánidá.
- source_word: συζητεῖν
  choice: ń jíròrò
  rationale: “Jíròrò” lè gba ìtumọ̀ ìfọ̀rọ̀wérọ̀ tó jinlẹ̀ tàbí ìyànjú èrò láìfi dandan sọ pé wọ́n ń bá ara wọn jà; àlàyé ìsàlẹ̀ fi agbára ìtumọ̀ míì hàn.
- source_word: αὐτὸς Ἰησοῦς
  choice: Jésù fúnra rẹ̀
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ αὐτός mọ́, pé Jésù gan-an ni ẹni tó sún mọ́ wọn.
- source_word: ἐγγίσας
  choice: sún mọ́ wọn
  rationale: Ó sọ ìṣípò Jésù sí ọ̀dọ̀ wọn ní ọ̀nà tó rọrùn, tó sì bá Yorùbá mu.
- source_word: συνεπορεύετο
  choice: ó sì ń bá wọn rìn lọ
  rationale: Àmì ìṣe aláìparí nínú Gíríìkì fi ìrìn tí ó ń bá a lọ hàn; “ń bá wọn rìn lọ” pa ìtẹ̀síwájú náà mọ́.
theological_decisions:
- issue: Ìtẹnumọ́ ẹni tí ó sún mọ́ àwọn ọmọ-ẹ̀yìn náà
  choice: Jésù fúnra rẹ̀ sún mọ́ wọn
  alternative: Jésù sún mọ́ wọn
  rationale: Gíríìkì tẹnumọ́ pé Jésù gan-an ni ó sún mọ́ wọn. Ìtumọ̀ náà pa ìtẹnumọ́ gírámà mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn-ìbòwọ̀ ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tó bá yẹ, a sì yà ìṣe tí ó ń lọ lọ́wọ́ sọ́tọ̀ pẹ̀lú “ń.” Gbólóhùn “àwọn nǹkan wọ̀nyí” jẹ́ ohun tí àyíká ẹsẹ tó ṣáájú ń tọ́ka sí, ó sì mú ìtumọ̀ Yorùbá ṣe kedere.
