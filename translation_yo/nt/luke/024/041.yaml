  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: yo
  text: Nígbà tí wọn kò sì tíì gbàgbọ́ nítorí ayọ̀, tí ẹnu sì ń yà wọ́n, ó sọ fún wọn pé, “Ṣé ẹ ní ohun kan níhìn-ín láti jẹ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Nígbà tí wọn kò sì tíì
  rationale: ‘Kò tíì’ fi ìtẹ̀síwájú tí ἔτι ní hàn, ‘sì’ sì jẹ́ àsopọ̀ pẹ̀lẹ́ fún δέ; ‘nígbà tí’ mú gbólóhùn participle náà wọ Yorùbá àdánidá.
- source_word: ἀπιστούντων
  choice: gbà á gbọ́
  rationale: Pẹ̀lú ‘kò tíì,’ ó ṣàfihàn pé àìgbàgbọ́ náà ṣì ń bá a lọ ní àkókò yẹn, láì sọ ọ́ di àìgbàgbọ́ líle tàbí ìkọ̀sílẹ̀ pípé.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: nítorí ayọ̀
  rationale: ἀπό níbí ń tọ́ka sí ohun tó fà á; ‘nítorí ayọ̀’ jẹ́ Yorùbá tó ṣe kedere, tó sì pa ìyàlẹ́nu pé ayọ̀ wọn ló mú kí ó ṣòro fún wọn láti gbàgbọ́ mọ́.
- source_word: θαυμαζόντων
  choice: tí ẹnu sì ń yà wọ́n
  rationale: Ọ̀rọ̀ yìí jẹ́ àfihàn Yorùbá àdánidá fún ìyàlẹ́nu ńlá; ‘ń’ pa ipa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: Ἔχετέ
  choice: Ṣé ẹ ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè bóyá àwọn ènìyàn ní ohun kan lọ́wọ́.
- source_word: τι βρώσιμον
  choice: ohun kan ... láti jẹ
  rationale: Ó sọ ‘ohun tí a lè jẹ’ ní Yorùbá tó rọrùn, láì di ọ̀rọ̀ náà mọ́ irú oúnjẹ kan pàtó.
- source_word: ἐνθάδε
  choice: níhìn-ín
  rationale: Ó túmọ̀ adverb ibi náà ní ṣókí àti ní tààrà.
theological_decisions:
- issue: Irú ìhùwàsí àwọn ọmọ-ẹ̀yìn sí Jésù tó jíǹde
  choice: Wọn kò tíì lè gbà á gbọ́ nítorí ayọ̀ tó kún wọn àti ìyàlẹ́nu wọn.
  alternative: Wọn ṣì jẹ́ aláìgbàgbọ́ ní ọ̀nà líle tàbí pé wọn kọ Jésù sílẹ̀.
  rationale: 'Gbólóhùn Gíríìkì so ἀπιστούντων pọ̀ mọ́ ἀπὸ τῆς χαρᾶς àti θαυμαζόντων. Ìtumọ̀ náà pa ìdàrúdàpọ̀ ẹ̀dùn ọkàn yìí mọ́: ìṣẹ̀lẹ̀ náà dùn mọ́ wọn, ó sì yani lẹ́nu tó bẹ́ẹ̀ tí wọn kò tíì lè gbà á gbọ́; kò fi kún un pé wọn ń kọ Jésù ní líle.'
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘ẹ’ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ‘Ṣé’ fún ìbéèrè àdánidá, àti àmi ohùn ní kíkún níbi tí ó ti yẹ.
