id: LUK.24.38
reference: Luke 24:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Kí ni ó dé tí ẹ fi dàrú, èé sì ṣe tí àwọn iyèméjì[a] fi ń dìde nínú ọkàn yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìrònú” tàbí “àwọn èrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú gbólóhùn yìí, Τί ń béèrè ìdí tàbí ohun tó fa ipò wọn; “Èé ṣe” ni ọ̀nà Yorùbá tó ṣe déédé jù láti sọ ọ́.
- source_word: τεταραγμένοι
  choice: ọkàn yín fi dàrú
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ipò ìdàrúdàpọ̀ inú tí wọ́n wà nínú rẹ̀. Lílo “ọkàn yín fi dàrú” jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìmọ̀lára inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διαλογισμοὶ
  choice: àwọn èrò iyèméjì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn ìrònú tó ń fi àìdánilójú tàbí ìbéèrè inú hàn. “Àwọn èrò iyèméjì” mú ìtumọ̀ àyíká náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ gbòòrò bí “ìrònú” àti “àròyé” sílẹ̀.
- source_word: ἀναβαίνουσιν
  choice: ń dìde
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni “gòkè,” “ń dìde” jẹ́ àfiwé Yorùbá tó bá ìrònú inú mu, ó sì tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: nínú ọkàn yín
  rationale: “Ọkàn yín” jẹ́ àdánidá ní Yorùbá, ó sì lè tọ́ka sí ọkàn olúkúlùkù nínú ẹgbẹ́ náà bó tilẹ̀ jẹ́ pé “ọkàn” wà ní ẹyọ ọ̀rọ̀.
- source_word: καρδία
  choice: ọkàn
  rationale: “Ọkàn” pa àwòrán Bíbélì mọ́ gẹ́gẹ́ bí inú ènìyàn, ibi tí èrò, ìmọ̀lára àti ìpinnu ti ń wá; “ọpọlọ” tàbí “èrò inú” nìkan yóò dín ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Ọ̀rọ̀ nípa inú ènìyàn, καρδία
  choice: ọkàn
  alternative: èrò inú tàbí inú-ọkàn
  rationale: Yíyan “ọkàn” pa ìrísí ẹ̀kọ́ Bíbélì mọ́ pé ọkàn kó èrò àti ìmọ̀lára ènìyàn sínú, láìdín un kù sí ọ̀kan nínú wọn nìkan.
- issue: Ìtumọ̀ διαλογισμοὶ nínú àyíká ìfarahàn Jésù
  choice: àwọn èrò iyèméjì
  alternative: àwọn ìrònú tàbí àwọn àròyé
  rationale: Àyíká náà fi àìdánilójú àwọn ọmọ-ẹ̀yìn hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbòòrò ju “iyèméjì” nìkan lọ. Nítorí náà, àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́, kí a má bàa dá ìtumọ̀ tó ṣì ní ààyè sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé lasán. Àmi ohùn kíkún ni a lò níbi tó bá yẹ; àtúnwí “Èé ṣe” mú ìbáṣepọ̀ àwọn ìbéèrè méjèèjì hàn, “ọkàn” sì pa àwòrán orísun mọ́.
