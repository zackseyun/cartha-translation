translation:
  language: yo
  text: Ó sì mú un, ó sì jẹ ẹ́ níwájú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Àsopọ̀ “sì” jẹ́ kí ìtàn máa lọ ní ti ẹ̀dá, láìfi ìtumọ̀ àkókò kan kún ọ̀rọ̀ Gíríìkì.
- source_word: λαβὼν
  choice: gbà á
  rationale: Ọ̀rọ̀ alábápín aorist yìí ṣáájú ìṣe pàtàkì; “gbà á” jẹ́ Yorùbá àdánidá, tí “á” sì ń tọ́ka sí ẹja inú ẹsẹ tó ṣáájú.
- source_word: ἐνώπιον αὐτῶν
  choice: níwájú wọn
  rationale: Ó túmọ̀ sí pé ó ṣe ìṣe náà níbi tí wọ́n ti lè rí i; ọ̀rọ̀ yìí kúkúrú, ó sì bójú mu ní Yorùbá.
- source_word: ἔφαγεν
  choice: jẹ ẹ́
  rationale: Ó sọ ìṣe jíjẹ tí ó ṣẹlẹ̀ tán; arọ́pò-orúkọ ohun náà ń tọ́ka sí ohun tí a mẹ́nu kàn nínú ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí àwọn ọ̀rọ̀-ìṣe náà gbà gẹ́gẹ́ bí àfojúsùn ní gbangba
  choice: A fi “á/ẹ́” hàn lẹ́yìn àwọn ọ̀rọ̀-ìṣe méjèèjì
  alternative: Ó sì gbà, ó sì jẹ níwájú wọn.
  rationale: Gíríìkì kò tún ohun náà dárúkọ nítorí a lè mọ̀ ọ́ láti ẹsẹ tó ṣáájú. Yorùbá àdánidá fẹ́ kí arọ́pò-orúkọ náà hàn níbí; èyí kò fi ẹ̀kọ́ tuntun kún un, ó kan mú ìṣe náà ṣe kedere.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì; a lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu.
