id: LUK.24.6
reference: Luke 24:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: yo
  text: Kò sí níhìn-ín, ṣùgbọ́n a ti jí i dìde.[a] Ẹ rántí bí ó ti sọ̀rọ̀ sí yín nígbà tí ó ṣì wà ní Gálílì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ti jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn àìṣeṣe (“a ti jí i dìde” tàbí “a jí i dìde”), ṣùgbọ́n a tún lè sọ ìṣẹ̀lẹ̀ àjíǹde náà ní Yorùbá pé, “ó ti jí dìde.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Kò sí níhìn-ín
  rationale: Yorùbá lè fi ẹni tí àyíká ọ̀rọ̀ ti mú kedere sílẹ̀ láìdárú; ‘níhìn-ín’ sì sọ ibi tí ọ̀rọ̀ náà ń tọ́ka sí ní ti ẹ̀dá.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín àìsí rẹ̀ ní ibẹ̀ àti jíjí rẹ̀ dìde.
- source_word: ἠγέρθη
  choice: a ti jí i dìde
  rationale: Ìsọ̀rọ̀ aláìlórúkọ olùṣe yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ohùn àìṣeṣe ti Gíríìkì mọ́, ó sì fi iṣẹ́ ẹni míì tí a kò dárúkọ hàn.
- source_word: μνήσθητε
  choice: Ẹ rántí
  rationale: Àṣẹ tó ń tọ́ àwọn obìnrin púpọ̀ ni; ‘Ẹ’ pa nọ́ńbà púpọ̀ mọ́, ‘rántí’ sì jẹ́ ọ̀rọ̀ àdánidá tó lágbára.
- source_word: ὡς
  choice: bí
  rationale: ‘Bí’ lè ṣí ọ̀nà sí irú ọ̀rọ̀ tí Jesu sọ láìfi ìtumọ̀ tó ju ti Gíríìkì lọ kún un.
- source_word: ἐλάλησεν ὑμῖν
  choice: ó ti sọ̀rọ̀ fún yín
  rationale: ‘Sọ̀rọ̀ fún yín’ pa ìṣe sísọ àti àwọn olùgbọ́ púpọ̀ mọ́ láìsọ àkóónú rẹ̀ ní pàtó.
- source_word: ἔτι ὢν
  choice: nígbà tí ó ṣì wà
  rationale: Gbólóhùn àsìkò yìí jẹ́ àdánidá ní Yorùbá, ‘ṣì’ sì ṣe àfihàn ἔτι.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ní Gálílì
  rationale: Ìtumọ̀ ibi tó taara ni, pẹ̀lú àkọsílẹ̀ orúkọ ilẹ̀ náà ní ìbámu pẹ̀lú ìró Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ àjíǹde ἠγέρθη
  choice: a ti jí i dìde
  alternative: ó ti jí dìde
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa ìrísí àìṣeṣe Gíríìkì mọ́, ó sì jẹ́ kí iṣẹ́ Ọlọ́run tí a lè lóye nínú àyíká ọ̀rọ̀ náà dúró láìfi orúkọ olùṣe kún ohun tí ẹsẹ̀ náà sọ. Àṣàyàn kejì jẹ́ Yorùbá àdánidá, ṣùgbọ́n ó yí ìrísí ọ̀rọ̀ náà sí aláṣe.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣeé lóye ni a lò. A lo ‘yín’ àti ‘Ẹ’ láti fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀, kì í ṣe àmì ọ̀wọ̀ sí ẹni kan ṣoṣo. Àmì ohùn kún ibi tí ó jẹ́ àdánidá.
