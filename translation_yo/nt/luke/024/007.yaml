  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: yo
  text: wí pé, “Ó pọndandan kí a fi Ọmọ Ènìyàn lé ọwọ́ àwọn ènìyàn ẹlẹ́ṣẹ̀[a], kí a kàn án mọ́ àgbélébùú, àti ní ọjọ́ kẹta, kí ó jí dìde[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a fà á lé ọwọ́ àwọn ènìyàn ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó dìde.” Ọ̀rọ̀ Gíríìkì náà wà ní ohùn ìṣe, kì í ṣe ní ohùn ìfaragba bí, “kí a jí i dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ní wí pé
  rationale: Ó pa ìsopọ̀ participle mọ́ pẹ̀lú àṣẹ ìrántí inú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti mú ọ̀rọ̀ tí a fa yọ wọlé ní Yorùbá.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ àkọlé náà tí ó ti fìdí múlẹ̀ ní Yorùbá, ó sì pa ìdámọ̀ ara ẹni Jesu àti ìró àwọn ẹsẹ Ìwé Mímọ́ mìíràn mọ́.
- source_word: ὅτι δεῖ
  choice: Ó pọndandan kí
  rationale: Ó fi hàn pé ohun náà gbọ́dọ̀ ṣẹlẹ̀ gẹ́gẹ́ bí ète Ọlọ́run, kì í ṣe àsọtẹ́lẹ̀ lasan.
- source_word: παραδοθῆναι εἰς χεῖρας
  choice: kí a fi ... lé ọwọ́
  rationale: Ìlò ẹni tí a kò dárúkọ, “a,” jẹ́ ọ̀nà Yorùbá àdánidá fún passive náà; “lé ọwọ́” sì pa àwòrán jíjẹ́ kí ẹni kan bọ́ sábẹ́ agbára àwọn ẹlòmíràn mọ́.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: àwọn ènìyàn ẹlẹ́ṣẹ̀
  rationale: Ó túmọ̀ àwọn ọ̀rọ̀ méjèèjì ní tààrà—“ènìyàn” àti “ẹlẹ́ṣẹ̀”—láì sọ ọ́ di “àwọn ẹlẹ́ṣẹ̀” nìkan. Ní Yorùbá, “ènìyàn” kò ní àmì akọ tàbí abo, bí ó tilẹ̀ jẹ́ pé àwọn ọkùnrin ni àyíká ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: σταυρωθῆναι
  choice: kí a kàn án mọ́ àgbélébùú
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì péye fún ikú nípa kíkàn mọ́ àgbélébùú.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Ó jẹ́ ìtumọ̀ dative àkókò náà ní ọ̀nà Yorùbá àdánidá, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἀναστῆναι
  choice: kí ó jí dìde
  rationale: Ó pa ohùn active Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí a sábà lò fún pípadà sí ìyè.
theological_decisions:
- issue: Agbára δεῖ nínú àsọtẹ́lẹ̀ Jesu nípa ìjìyà rẹ̀
  choice: Ó pọndandan kí
  alternative: yóò; ó ní láti
  rationale: “Ó pọndandan” pa ìtumọ̀ àìní-àṣàyàn tí ó wà nínú ète Ọlọ́run mọ́, láì sọ ọ́ di àsọtẹ́lẹ̀ ọjọ́ iwájú lasan.
- issue: Ohùn active nínú ἀναστῆναι
  choice: kí ó jí dìde
  alternative: kí a jí i dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ active, nítorí náà a kò yí i sí passive, bí ó tilẹ̀ jẹ́ pé àwọn ibi mìíràn nínú Májẹ̀mú Tuntun sọ pé Ọlọ́run jí Jesu dìde.
- issue: Ìdámọ̀ àwọn ἀνθρώπων ἁμαρτωλῶν
  choice: àwọn ènìyàn ẹlẹ́ṣẹ̀
  alternative: àwọn ẹlẹ́ṣẹ̀; àwọn ọkùnrin ẹlẹ́ṣẹ̀
  rationale: Àṣàyàn yìí pa “ènìyàn” àti “ẹlẹ́ṣẹ̀” méjèèjì mọ́. A kò fi “ọkùnrin” kún un nítorí ἀνθρώπων lè jẹ́ ọ̀rọ̀ gbogbogbò fún ènìyàn, ìrísí akọ gírámà nìkan kò sì tó láti fi ọ̀rọ̀ akọ pàtó sínú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Ìlò “a” tí a kò dárúkọ fún àwọn passive méjì jẹ́ ti Yorùbá àdánidá; “Ó pọndandan” sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ δεῖ mọ́.
