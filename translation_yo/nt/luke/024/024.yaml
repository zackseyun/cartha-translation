language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: yo
  text: Àwọn kan lára àwọn tí wọ́n wà pẹ̀lú wa sì lọ sí ibojì náà, wọ́n sì rí i gẹ́gẹ́ bí àwọn obìnrin náà ti sọ; ṣùgbọ́n wọn kò rí òun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: lọ
  rationale: Ọ̀rọ̀ náà ń sọ ìrìn wọn lọ sí ibi tí a dárúkọ; “lọ” jẹ́ ọ̀nà àdánidá, ó sì yẹ fún ìtàn náà láì tẹnu mọ́ bí wọ́n ṣe kúrò.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: Àwọn kan lára àwọn tí ó wà pẹ̀lú wa
  rationale: Èyí pa ìtumọ̀ pé apá kan nínú ẹgbẹ́ àwọn tí wọ́n wà pẹ̀lú àwọn olùsọ̀rọ̀ mọ́, ó sì tẹ̀lé ìṣètò Gíríìkì lọ́nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: sí ibojì náà
  rationale: Nínú àyíká ìtàn yìí, μνημεῖον ni ibi tí a sin Jésù sí; “ibojì” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù fún un.
- source_word: εὗρον
  choice: rí i
  rationale: “Rí i” jẹ́ ọ̀rọ̀ ìtàn tó rọrùn fún ohun tí wọ́n bá níbẹ̀, láì fi ìtumọ̀ míì kún un.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: gẹ́gẹ́ bí àwọn obìnrin náà ti sọ
  rationale: Gbólóhùn yìí sọ pé ohun tí wọ́n rí bá ìròyìn àwọn obìnrin náà mu. Ìṣètò “ti sọ” tún fi hàn ní ti àdánidá pé ọ̀rọ̀ àwọn obìnrin náà ṣáájú ìrìn yìí.
- source_word: αὐτὸν
  choice: òun
  rationale: “Òun” tọ́ka sí Jésù láì fi orúkọ rẹ̀ kún ibi tí Gíríìkì ti lo arọ́pò-orúkọ, ó sì yà á kedere sí “i” tí ó tọ́ka sí ohun tí wọ́n rí.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ tó wà láàárín bí wọ́n ṣe rí ohun gbogbo gẹ́gẹ́ bí a ti sọ àti bí wọn kò ṣe rí Jésù hàn.
- source_word: οὐκ εἶδον
  choice: wọn kò rí
  rationale: Èyí pa ìtumọ̀ ὁράω, “rí,” mọ́; kò yí i padà sí “kò rí i gbà” tàbí “kò bá a.”
theological_decisions:
- issue: Ọ̀rọ̀ inú ìtàn àjíǹde
  choice: Ẹsẹ náà sọ pé àwọn tó lọ sí ibojì rí ohun tí ó bá ìròyìn àwọn obìnrin mu, ṣùgbọ́n wọn kò rí Jésù fúnra rẹ̀.
  alternative: Ṣàlàyé ohun pàtó tí wọ́n rí nínú ibojì tàbí mú ìtàn náà bá àkọsílẹ̀ míì mu ní kíkún.
  rationale: Ìtumọ̀ náà pa ìyàtọ̀ inú Gíríìkì mọ́ láàárín rírí ipò náà gẹ́gẹ́ bí àwọn obìnrin ti sọ àti àìrí Jésù; kò fi àlàyé láti inú àwọn ìtàn míì kún un.
translation_notes:
  register: Yorùbá àfọwọ́ṣe tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àsopọ̀ “sì” mú ìtẹ̀síwájú ìtàn καί hàn, nígbà tí àmì àbọ̀-àfẹnukò ṣáájú “ṣùgbọ́n” mú ìyàtọ̀ ìkẹyìn kedere.
