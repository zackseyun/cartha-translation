review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtẹ̀lé ìṣe nínú participle náà, ìṣe ‘fihàn,’ àti àwọn ẹ̀yà ara méjèèjì dáadáa. Síbẹ̀, ‘sì’ yẹ kí ó so ìṣe pàtàkì mọ́ ìtàn, gẹ́gẹ́ bí καὶ, kì í ṣe kí ó wọ inú gbólóhùn ‘Lẹ́yìn tí...’ nìkan.
  naturalness: ‘Lẹ́yìn tí ó ti sọ èyí, ó sì fi ... hàn wọ́n’ jẹ́ ìṣètò Yorùbá boṣewa tó rọrùn síi, tó sì jẹ́ kí ìtẹ̀lé ìṣe náà hàn kedere. Fifi ‘rẹ̀’ lẹ́yìn ‘ọwọ́’ àti ‘ẹsẹ̀’ méjèèjì tún mú un dájú pé ọwọ́ àti ẹsẹ̀ Jesu fúnra rẹ̀ ni.
  terminology: ‘Fi ... hàn’ jẹ́ ìbámu àdánidá fún ἔδειξεν; ‘ọwọ́’ àti ‘ẹsẹ̀’ bá ìtumọ̀ ẹ̀yà ara nínú ọ̀rọ̀ orísun mu. Àlàyé ìsàlẹ̀ ìwé náà tọ́ka ní kedere sí ìyàtọ̀ àwọn ẹ̀dà àfọwọ́kọ, gẹ́gẹ́ bí àmì àkámọ́ nínú SBLGNT.
  issues:
