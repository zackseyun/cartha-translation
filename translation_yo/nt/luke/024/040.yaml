  text: ⸂[καὶ τοῦτο εἰπὼν ⸀ἔδειξεν αὐτοῖς τὰς χεῖρας καὶ τοὺς πόδας.]⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ èyí[a], ó sì fi ọwọ́ rẹ̀ àti ẹsẹ̀ rẹ̀ hàn wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀dà àfọwọ́kọ kan kò ní gbólóhùn yìí.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ tó wọ́pọ̀ ni; “sì” ń tẹ̀síwájú nínú ìtàn láìfi ìtumọ̀ àkókò míì kún un.
- source_word: τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sọ èyí
  rationale: Participle aorist náà fi hàn pé sísọ̀rọ̀ náà ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ἔδειξεν
  choice: ó fi ... hàn
  rationale: Èyí ni ọ̀nà àdánidá láti sọ pé ó jẹ́ kí wọ́n rí wọn ní ojú ara.
- source_word: αὐτοῖς
  choice: wọ́n
  rationale: “Fi ... hàn wọ́n” jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí a fi ohun náà hàn.
- source_word: τὰς χεῖρας
  choice: ọwọ́ ... rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé article ni Gíríìkì lò, Yorùbá máa ń lo arọ́pò-orúkọ ohun-ìní ní àyíká yìí láti fi hàn pé ọwọ́ tirẹ̀ ni.
- source_word: τοὺς πόδας
  choice: ẹsẹ̀ rẹ̀
  rationale: “Ẹsẹ̀” ni ìbámu tààrà fún πόδας nípa ẹ̀yà ara; “rẹ̀” mú ìtumọ̀ ohun-ìní tó wà nínú àyíká náà jáde lọ́nà àdánidá.
theological_decisions:
- issue: Ipò ẹsẹ yìí nínú àwọn ẹ̀dà àfọwọ́kọ
  choice: A fi gbólóhùn náà sínú ọ̀rọ̀ pàtàkì, a sì fi àlàyé ìyàtọ̀ ẹ̀dà sí àlàyé ìsàlẹ̀ ìwé.
  alternative: Àwọn ẹ̀dà àfọwọ́kọ kan kò ní gbogbo gbólóhùn yìí.
  rationale: SBLGNT fi gbogbo ẹsẹ náà sínú àmì àkámọ́ onígun láti fi iyèméjì pàtàkì nípa ẹ̀rí ọ̀rọ̀ hàn. Nítorí pé ọ̀rọ̀ orísun tí a pèsè ní gbólóhùn náà, a túmọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a jẹ́ kí òǹkàwé mọ ìyàtọ̀ ẹ̀dà náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “Lẹ́yìn tí ...” dípò ìṣètò ọ̀rọ̀ tó le koko, a sì pa ìtẹ̀síwájú ìtàn mọ́ pẹ̀lú “sì”.
