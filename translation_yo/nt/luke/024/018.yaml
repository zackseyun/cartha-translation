id: LUK.24.18
reference: Luke 24:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: yo
  text: Nígbà náà, ọ̀kan nínú wọn, tí orúkọ rẹ̀ ń jẹ́ Kílópà, dá a lóhùn pé, “Ṣé ìwọ nìkan ni àlejò ní Jerúsálẹ́mù tí kò mọ ohun tí ó ṣẹlẹ̀ níbẹ̀ ní àwọn ọjọ́ wọ̀nyí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ìwọ nìkan ni ẹni tí ń gbé ní Jerúsálẹ́mù gẹ́gẹ́ bí àjèjì?” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbé ní ibì kan gẹ́gẹ́ bí àjèjì tàbí olùgbé fún ìgbà díẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Nígbà náà ... dá a lóhùn pé
  rationale: A so participle náà pọ̀ mọ́ gbólóhùn pàtàkì ní Yorùbá àdánidá; “Nígbà náà” fi ìlọsíwájú ìtàn hàn láìsọ δέ di àtakò líle.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: ọ̀kan nínú wọn, tí orúkọ rẹ̀ ń jẹ́ Kílóópà
  rationale: “Ọ̀kan nínú wọn” mú ẹni tí εἷς ń tọ́ka sí nínú àwọn ọmọ-ẹ̀yìn méjì náà ṣe kedere; ọ̀nà yìí sì túmọ̀ ὀνόματι lọ́nà Yorùbá tí ó rọrùn.
- source_word: εἶπεν πρὸς αὐτόν
  choice: dá a lóhùn pé
  rationale: Ọ̀rọ̀ yìí bá ἀποκριθείς ṣiṣẹ́ pọ̀ láti ṣàfihàn pé Kílóópà ń fèsì sí i, láìfi orúkọ ẹni tí a ń bá sọ̀rọ̀ kún ohun tí Gíríìkì kò sọ ní kedere.
- source_word: Σὺ μόνος
  choice: Ṣé ìwọ nìkan ni
  rationale: “Ìwọ nìkan” pa ìtẹnumọ́ àti ìtumọ̀ àdádó μόνος mọ́ nínú ìbéèrè.
- source_word: παροικεῖς Ἰερουσαλὴμ
  choice: àlejò ní Jerúsálẹ́mù
  rationale: παροικέω ní ìtumọ̀ gbígbé níbi gẹ́gẹ́ bí àjèjì tàbí ẹni tí kò dúró títí; “àlejò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé ó lè tẹnumọ́ ìbẹ̀wò ju ìgbé fún ìgbà díẹ̀ lọ.
- source_word: οὐκ ἔγνως
  choice: tí kò mọ
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà jẹ́ aorist, ìbéèrè náà ń tọ́ka sí àìmọ̀ tí ó wà ní àkókò ọ̀rọ̀; “kò mọ” sọ èyí ní Yorùbá àdánidá.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: ohun tí ó ṣẹlẹ̀ níbẹ̀
  rationale: “Ohun tí ó ṣẹlẹ̀” ṣe àkójọpọ̀ àwọn ìṣẹ̀lẹ̀ tó ṣẹ̀ṣẹ̀ wáyé, “níbẹ̀” sì tọ́ka padà sí Jerúsálẹ́mù lọ́nà tí ó rọrùn.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ní àwọn ọjọ́ wọ̀nyí
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì tọ́ka sí àwọn ọjọ́ tí ó ṣẹ̀ṣẹ̀ kọjá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè náà jẹ́ ti ìyàlẹ́nu, ṣùgbọ́n a kò fi ọ̀rọ̀ àfikún mú kí ó le ju ti orísun lọ. Àmì àlàyé [a] wà lẹ́yìn gbogbo ìbéèrè nítorí ó ṣàlàyé ìtumọ̀ pàtàkì ti παροικεῖς.
