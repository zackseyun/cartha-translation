  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: yo
  text: Àwọn ọ̀rọ̀ wọ̀nyí sì dà bí ọ̀rọ̀ asán lójú wọn[a], wọn kò sì gba àwọn obìnrin náà gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ìtàn asán” tàbí “bí ọ̀rọ̀ ẹni tí ń sọ̀rọ̀ láìní làákàyè.” Ọ̀rọ̀ Gíríìkì náà, λῆρος, ń tọ́ka sí ọ̀rọ̀ tí a kà sí aláìní èrò tàbí ohun tí kò bójú mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: dà ... lójú wọn
  rationale: Nínú gbólóhùn ìdájọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí bí ohun kan ṣe rí sí ẹnì kan, kì í ṣe pé ó farahàn ní ojú lásán; “dà ... lójú wọn” jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ὡσεὶ λῆρος
  choice: bí ọ̀rọ̀ asán
  rationale: Ó pa ìfiwéra ὡσεὶ mọ́, ó sì fi hàn pé wọ́n ka ohun tí a sọ sí ọ̀rọ̀ tí kò ní làákàyè tàbí tí kò yẹ ní gbígbàgbọ́.
- source_word: τὰ ῥήματα ταῦτα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Èyí tẹ̀ lé ọ̀pọ̀ iye àti atọ́ka inú Gíríìkì ní tààrà, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἠπίστουν
  choice: wọn kò ... gbọ́
  rationale: Ìṣe aláìpé náà ṣàpèjúwe àìgbàgbọ́ wọn nígbà náà; a kò fi èrò pé wọ́n mọ̀ọ́mọ̀ kọ̀ láti gbàgbọ́ kún un.
- source_word: αὐταῖς
  choice: àwọn obìnrin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ abo, ọ̀pọ̀ iye, ó sì tọ́ka sí àwọn obìnrin inú àyíká ọ̀rọ̀; ṣíṣe itọ́kasí náà ní kedere dá abo ọ̀rọ̀ orísun mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ṣe kedere fún gbogbo ènìyàn. A lo “dà ... lójú wọn” gẹ́gẹ́ bí àfihàn ìdájọ́ àdánidá ní Yorùbá, a sì yàgò fún èdè ẹ̀kọ́ ìsìn tí ó lè fi ìtumọ̀ míì kún ẹsẹ náà.
