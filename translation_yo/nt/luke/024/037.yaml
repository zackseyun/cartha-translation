  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: yo
  text: Ṣùgbọ́n ìpayà bá wọ́n, ẹ̀rù sì bà wọ́n; wọ́n rò pé ẹ̀mí kan[a] ni wọ́n ń rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iwin kan.” Ọ̀rọ̀ Gíríìkì náà, πνεῦμα, túmọ̀ ní tààrà sí “ẹ̀mí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: wọ́n jáyà
  rationale: “Jáyà” fi ìpayà òjijì tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí hàn, láì mú un lágbára ju gbólóhùn tó tẹ̀ lé e nípa ẹ̀rù lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn láti inú ìfarahàn Jésù sí ìhùwàsí àwọn ọmọ-ẹ̀yìn.
- source_word: ἔμφοβοι γενόμενοι
  choice: ẹ̀rù sì bà wọ́n
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ní ti ẹ̀dá pé wọ́n dé ipò ìbẹ̀rù, ó sì pa ìtẹ̀lé ‘jáyà’ àti ‘bẹ̀rù’ mọ́.
- source_word: ἐδόκουν
  choice: wọ́n rò pé
  rationale: Ó sọ èrò tàbí ìgbàgbọ́ tí wọ́n ní nípa ohun tí wọ́n ń rí ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: πνεῦμα
  choice: ẹ̀mí kan
  rationale: “Ẹ̀mí” ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù, ó sì yẹra fún fífi àwọn èrò àṣà kan pàtó tí ó lè bá “iwin” rìn sínú ẹsẹ náà.
- source_word: θεωρεῖν
  choice: ni àwọn ń rí
  rationale: Àmì ‘ń’ pa ìtumọ̀ ìṣe tó ń lọ lọ́wọ́ nínú infinitive present mọ́, ní ọ̀nà tó bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nínú àyíká ìfarahàn Jésù lẹ́yìn àjíǹde
  choice: ẹ̀mí kan
  alternative: iwin kan
  rationale: “Ẹ̀mí” sún mọ́ ọ̀rọ̀ orísun, ó sì pa àìmọ̀ pàtó ọ̀rọ̀ náà mọ́. Ẹsẹ náà ń ṣàlàyé èrò àṣìṣe àwọn ọmọ-ẹ̀yìn, láì sọ pé Jésù jẹ́ ẹ̀mí tí kò ní ara.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò.
