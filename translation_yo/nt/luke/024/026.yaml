  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: yo
  text: Ṣé kò ha ṣe dandan fún Mèsáyà láti jìyà àwọn nǹkan wọ̀nyí àti láti wọ inú ògo rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ oyè Gíríìkì náà, Χριστός, ni a túmọ̀ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́ nínú àyíká ìmúṣẹ Ìwé Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Ṣé kò ha
  rationale: Ó gbé ìbéèrè tí ó ń retí ìdáhùn bẹ́ẹ̀ ni jáde ní ọ̀nà Yorùbá tí ó jẹ́ àdánidá.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò atọ́ka ọ̀pọ̀ mọ́, ó sì tọ́ka sí àwọn ìjìyà tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn.
- source_word: ἔδει
  choice: ṣe dandan fún
  rationale: Ó fi ìjẹ́dandan hàn láì sọ ó di kìkì àṣẹ tàbí ohun tí kò lè yà.
- source_word: παθεῖν
  choice: láti jìyà
  rationale: Ìtumọ̀ tààrà, ṣókí, tí ó sì wọ́pọ̀ fún πάσχω ní àyíká ọ̀rọ̀ yìí.
- source_word: τὸν χριστὸν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró; “Mèsáyà” mú ìtumọ̀ oyè náà àti àyíká ìmúṣẹ Ìwé Mímọ́ hàn.
- source_word: καὶ
  choice: kí ó sì
  rationale: Ó so àwọn ọ̀rọ̀-ìṣe aláìlópin méjèèjì pọ̀ láì fi ìtẹ̀lé àkókò kún ohun tí Gíríìkì sọ.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: kí ó sì wọ inú ògo rẹ̀
  rationale: Ó pa èrò wíwọ inú ipò tàbí agbègbè ògo mọ́, pẹ̀lú arọ́pò oníhun “rẹ̀.”
- source_word: δόξαν
  choice: ògo
  rationale: “Ògo” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún δόξα, pàápàá ní àyíká àjíǹde àti ìgbéga.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ó túmọ̀ arọ́pò oníhun náà ní tààrà, láì ṣàlàyé ẹni tí ó fún un ní ògo tàbí irú ìbáṣepọ̀ oníhun náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní àyíká ìmúṣẹ Ìwé Mímọ́; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́.
- issue: Agbára ἔδει
  choice: ṣe dandan fún
  alternative: ní láti
  rationale: Yíyan yìí pa ìjẹ́dandan tó bá ètò Ọlọ́run àti ìmúṣẹ Ìwé Mímọ́ mu mọ́, láì tú ìtumọ̀ náà sílẹ̀ sínú àlàyé tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Ṣé kò ha” jẹ́ ìbéèrè àròsọ tí ó retí ìdáhùn rere; “ṣe dandan fún” sì jẹ́ àdánidá ju ìṣètò ọ̀rọ̀ líle lọ.
