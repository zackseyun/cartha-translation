  text: ⸂εἰσελθοῦσαι δὲ⸃ οὐχ εὗρον τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n wọ inú ibojì náà[a], wọ́n kò rí ara náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “ara Olúwa Jésù.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: nígbà tí wọ́n wọ inú rẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ aorist active participle, nominative feminine plural, ó sì ń tọ́ka sí àwọn obìnrin náà. Ìtumọ̀ àkókò yìí jẹ́ Yorùbá àdánidá, ‘nígbà tí wọ́n wọ inú rẹ̀’; ‘rẹ̀’ ń tọ́ka sí ibojì tí àyíká ọ̀rọ̀ ti sọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ ń tẹ ìtàn náà síwájú pẹ̀lú ìyàtọ̀ díẹ̀ láàárín wíwọ wọn sínú ibojì àti ohun àìròtẹ́lẹ̀ tí wọ́n bá níbẹ̀.
- source_word: οὐχ εὗρον
  choice: wọn kò rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ ìṣe aorist tí a sẹ́, ó sì pa agbára ìtàn rírọrùn ti Gíríìkì mọ́.
- source_word: τὸ σῶμα
  choice: òkú náà
  rationale: Ní àyíká ìsìnkú, ‘òkú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ara ẹni tí ó kú. Ó yàgò fún ‘ara náà,’ èyí tí ó lè dà bí ara ẹni alààyè tàbí apá ara ní Yorùbá, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá kí a sọ ẹni tí òkú náà jẹ́ ní pàtó
  choice: òkú náà
  alternative: òkú Jésù Olúwa
  rationale: Ẹ̀dà Gíríìkì tí a pèsè ní τὸ σῶμα nìkan. A kò fi àfikún inú àwọn àfọwọ́kọ kan sínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà rọrùn, ó ní iyì, ó sì bá ìtàn àkókò òde òní mu. A lo ‘òkú’ nítorí àyíká ibojì, àti ‘wọ inú rẹ̀’ láti jẹ́ kí ohun tí wọn wọ̀ hàn kedere ní Yorùbá.
