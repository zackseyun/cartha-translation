  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: yo
  text: Wọ́n sún mọ́ abúlé tí wọ́n ń lọ sí, Jesu sì ṣe bí ẹni pé[a] òun ń lọ síwájú sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó díbọ̀n pé òun ń lọ síwájú sí i”; tàbí, “ó fi ara hàn bí ẹni pé òun ń lọ síwájú sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: wọ́n sún mọ́
  rationale: Ó fi hàn pé wọ́n ń dé etí ibi náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún sísún mọ́ ibi kan.
- source_word: κώμην
  choice: abúlé
  rationale: κώμη sábà ń tọ́ka sí ìletò kékeré ju ìlú ńlá lọ; “abúlé” bá ìtumọ̀ yìí mu.
- source_word: οὗ ἐπορεύοντο
  choice: tí wọ́n ń lọ sí
  rationale: Ó pa ìrìn àjò tí ó ń bá a lọ àti ibi tí wọ́n ń lọ mọ́ nínú ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: προσεποιήσατο
  choice: ṣe bí ẹni pé
  rationale: Ó sọ pé Jesu fi ara hàn bí ẹni tí yóò tẹ̀ síwájú láìfi dandan túmọ̀ rẹ̀ sí ẹ̀tàn.
- source_word: πορρώτερον
  choice: síwájú sí i
  rationale: Nínú ọ̀rọ̀ ìrìn àjò, gbólóhùn yìí fi ìlọ sí ibi jíjìn sí i hàn lọ́nà àdánidá.
- source_word: πορεύεσθαι
  choice: òun yóò máa lọ
  rationale: Ó ṣàfihàn ìṣe tí Jesu fi hàn pé òun fẹ́ tẹ̀ síwájú láti máa ṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ προσεποιήσατο nípa ìṣe Jesu
  choice: Jesu ṣe bí ẹni pé òun yóò máa lọ síwájú sí i
  alternative: Jesu díbọ́n pé òun yóò máa lọ síwájú sí i
  rationale: “Ṣe bí ẹni pé” pa ìfọ̀rọ̀wérọ̀ ìtàn náà mọ́, ṣùgbọ́n kò fi ẹ̀sùn ẹ̀tàn tí ọ̀rọ̀ Gíríìkì kò fi dandan béèrè kún un.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Jesu” láti mú ẹni tí arọ́pò-orúkọ αὐτός ń tọ́ka sí ṣe kedere ní Yorùbá, láìyí ìtumọ̀ ìtàn padà.
