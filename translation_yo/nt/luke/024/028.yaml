  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ti Gíríìkì náà: wọ́n sún mọ́ abúlé tí wọ́n ń lọ sí, Jesu sì fi ara hàn bí ẹni pé òun ń tẹ̀ síwájú. Ṣùgbọ́n “Nígbà tí” ń ṣàfikún ìsopò àkókò tí kò sí nínú Καὶ, àti “yóò máa lọ” ń mú ìṣe náà dà bí ohun ọjọ́ iwájú ju bí ó ti yẹ lọ. “Ń lọ” dá ìtumọ̀ ìṣe tí a fi hàn nínú infinitive náà dúró dáadáa.'
