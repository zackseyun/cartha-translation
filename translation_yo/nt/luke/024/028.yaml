  terminology: “Abúlé” bá κώμη mu. “Ṣe bí ẹni pé” ń pa ìtumọ̀ προσεποιήσατο mọ́ láìfi ìdájọ́ ìwà ẹ̀tàn tí ó pọ̀ ju sí i. “Síwájú sí i” ń ṣàfihàn πορρώτερον nínú àyíká ìrìn-àjò.
