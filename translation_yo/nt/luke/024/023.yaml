source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: yo
  text: Nígbà tí wọn kò rí ara rẹ̀[a], wọ́n wá, wọ́n sì ní pé wọ́n ti rí ìran àwọn áńgẹ́lì[b], tí wọ́n sọ pé ó wà láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí ó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó bẹ́ẹ̀: “wọ́n wá, wọ́n ní pé wọ́n ti rí ìran àwọn áńgẹ́lì, wọ́n sì sọ pé ó wà láàyè,” nípa mímú “tí wọ́n sọ” tọ́ka sí àwọn obìnrin dípò àwọn áńgẹ́lì.'
    reason: alternative_reading
  - marker: b
    text: 'Tàbí: “wọ́n sì ní pé wọ́n tilẹ̀ ti rí ìran àwọn áńgẹ́lì.”'
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: nígbà tí wọn kò rí
  rationale: Aorist participle feminine plural náà ń tọ́ka sí àwọn obìnrin; gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìkọ̀ μὴ mọ́.
- source_word: τὸ σῶμα αὐτοῦ
  choice: òkú rẹ̀
  rationale: Nínú àyíká ibojì yìí, òkú ni ọ̀rọ̀ Yorùbá àdánidá fún ara ẹni tí a sin; ó yàgò fún ìtumọ̀ tí 'ara rẹ̀' lè ní gẹ́gẹ́ bí ara alààyè.
- source_word: ἦλθον λέγουσαι
  choice: wọ́n padà wá, wọ́n ní
  rationale: ἦλθον túmọ̀ sí pé wọ́n wá; ní àyíká náà, wọ́n ń bọ̀ láti ibojì, nítorí náà 'padà wá' mú ìṣípò náà hàn ní Yorùbá àdánidá, 'wọ́n ní' sì gbé participle λέγουσαι jáde.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Καί kejì fi kún ìròyìn pé kì í ṣe pé òkú náà nìkan ni wọn kò rí, wọ́n tún rí ìran; 'pẹ̀lú' ń sọ agbára àfikún yìí ní Yorùbá.
- source_word: ὀπτασίαν ἀγγέλων
  choice: ìran àwọn áńgẹ́lì
  rationale: ὀπτασία jẹ́ ìran àràmàǹdà tàbí ìfarahàn; 'ìran àwọn áńgẹ́lì' ṣe kedere láì fi àlàyé tí kò sí nínú Giriki kún un.
- source_word: ἑωρακέναι
  choice: àwọn ti rí
  rationale: Perfect infinitive inú ọ̀rọ̀ tí a ròyìn ni; àmì 'ti' Yorùbá mú pé ìrí náà ti ṣẹlẹ̀ ṣáájú ìròyìn wọn hàn.
- source_word: οἳ λέγουσιν
  choice: tí wọ́n sọ
  rationale: Relative pronoun masculine plural tọ́ka lọ́nà àdánidá jù lọ sí àwọn áńgẹ́lì; Yorùbá kò fi ìyàtọ̀ present/past inú ọ̀rọ̀ tí a ròyìn hàn ní ọ̀nà kan náà bí Giriki, 'sọ' sì jẹ́ àdánidá nínú àyíká ìròyìn yìí.
- source_word: αὐτὸν ζῆν
  choice: pé ó wà láàyè
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá ti infinitival clause, ó sì pa ẹ̀rí pé Jesu wà láàyè mọ́.
theological_decisions:
- issue: Ẹni tí οἳ λέγουσιν ń tọ́ka sí
  choice: 'Ó tọ́ka sí àwọn áńgẹ́lì: “tí wọ́n sọ pé ó wà láàyè.”'
  alternative: 'Ó lè jẹ́ pé ó tọ́ka sí àwọn obìnrin: wọ́n wá sọ pé àwọn rí ìran àwọn áńgẹ́lì, wọ́n sì sọ pé ó wà láàyè.'
  rationale: ἀγγέλων ni antecedent masculine plural tó sún mọ́ οἳ jù lọ, ìtàn tó yí i ká sì bá ìtumọ̀ yẹn mu. Síbẹ̀, a pa àṣàyàn syntactic kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “òkú rẹ̀” nítorí àyíká ibojì, “ìran” fún ὀπτασία, àti “pẹ̀lú” láti mú agbára àfikún καί hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
