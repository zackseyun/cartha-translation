  source_fidelity: Àtúnṣe náà mú τὸ σῶμα αὐτοῦ hàn gẹ́gẹ́ bí “ara rẹ̀,” kì í ṣe “òkú rẹ̀,” nítorí Giriki sọ “ara” ní tààrà. Ó tún yọ ìfikún “padà” kúrò nínú ἦλθον, ó sì ṣe ἑωρακέναι ní “wọ́n ti rí.” Ìbáṣepọ̀ οἳ λέγουσιν pẹ̀lú àwọn áńgẹ́lì ni a pa mọ́, pẹ̀lú àṣàyàn mìíràn nínú àlàyé ìsàlẹ̀.
  naturalness: “Nígbà tí wọn kò rí ara rẹ̀, wọ́n wá, wọ́n sì ní pé wọ́n ti rí …” jẹ́ Yorùbá boṣewa tí ó rọrùn, tí ó sì ṣe kedere. “Wọ́n sì ní pé” ń so ìròyìn tí a sọ pọ̀ dáadáa; “pẹ̀lú” ní ipò ìkẹyìn lè jẹ́ kó dà bí ẹni pé ó ń fi àwọn áńgẹ́lì kún ohun mìíràn, nítorí náà a lo “sì” fún καί àfikún náà.
  terminology: “Ara rẹ̀” ni ìtumọ̀ tó sunmọ́ σῶμα, ó sì yẹ nínú àyíká ibojì. “Ìran àwọn áńgẹ́lì” yẹ fún ὀπτασίαν ἀγγέλων, “wà láàyè” sì yẹ fún αὐτὸν ζῆν.
