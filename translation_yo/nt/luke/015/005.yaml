  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: yo
  text: Nígbà tí ó sì rí i[a], ó gbé e lé èjìká rẹ̀, ó ń yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àgùntàn tí ó sọnù, gẹ́gẹ́ bí ẹsẹ tó ṣáájú ti sọ.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: Nígbà tí ó bá sì rí i
  rationale: Aorist participle náà ṣàfihàn ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì. Gbólóhùn àsìkò yìí jẹ́ àdánidá ní Yorùbá; “i” tí a fi kún un tọ́ka sí àgùntàn tí ó sọnù nínú ẹsẹ tó ṣáájú.
- source_word: ἐπιτίθησιν
  choice: ó gbé e lé
  rationale: Ìṣe yìí túmọ̀ sí fífi ohun kan sí orí ohun mìíràn. “Gbé e lé èjìká” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì pa àwòrán ìṣe olùṣọ́-àgùntàn mọ́.
- source_word: ἐπὶ τοὺς ὤμους
  choice: lé èjìká rẹ̀
  rationale: ἐπί pẹ̀lú accusative ń tọ́ka sí gbígbé ohun náà sórí èjìká. Yorùbá sábà máa ń lo “èjìká” gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ níbi tí Gíríìkì ti lo ọ̀pọ̀.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí olùṣọ́-àgùntàn, kì í ṣe àgùntàn náà; “rẹ̀” ni ìtumọ̀ àdánidá nínú àkójọpọ̀ yìí.
- source_word: χαίρων
  choice: ó ń yọ̀
  rationale: Present participle náà ṣàfihàn ayọ̀ tó ń bá ìṣe gbígbé àgùntàn náà lọ. Gbólóhùn “ó ń yọ̀” pa agbára ìṣe àti ìmọ̀lára ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Fífi ohun tí εὑρὼν ń gba kún ọ̀rọ̀
  choice: A lo “rí i,” tí “i” fi tọ́ka sí àgùntàn tí ó sọnù.
  alternative: Kí a túmọ̀ ọ́ láìfi ohun tí ó rí hàn.
  rationale: Gíríìkì lè fi ohun tí ọ̀rọ̀-ìṣe ń gba sílẹ̀ nítorí àyíká ti mú un ṣe kedere. Yorùbá nílò arọ́pò-orúkọ náà fún ìtumọ̀ tó ṣe kedere; èyí kò fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá àgbàṣe, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹ̀sí ìtàn àkàwé náà mọ́.
