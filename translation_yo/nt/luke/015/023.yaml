  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: yo
  text: Ẹ sì mú ọmọ màlúù tí a ti bọ́ sanra náà wá, kí ẹ pa á[a], kí a sì jẹ, kí a sì ṣe ayẹyẹ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ fi rúbọ”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípa ẹran, ó sì lè ní ìtumọ̀ ìrúbọ ní àwọn àyíká kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: Ẹ sì mú ... wá
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “mú ... wá” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kí wọ́n gbé ohun náà dé ọ̀dọ̀ ẹni tó ń sọ̀rọ̀.
- source_word: μόσχον τὸν σιτευτόν
  choice: ọmọ màlúù àbọ́pa náà
  rationale: μόσχος túmọ̀ sí ọmọ màlúù, σιτευτός sì ń tọ́ka sí èyí tí a ti bọ́ dáadáa fún àkókò pàtàkì. “Àbọ́pa” sọ ète yìí ní ṣókí, ó sì bá èdè Yorùbá mu.
- source_word: θύσατε
  choice: kí ẹ pa á
  rationale: Nínú àyíká àsè yìí, ọ̀rọ̀ náà ń tọ́ka sí pípa ẹran náà fún jíjẹ. “Pa á” jẹ́ èdè Yorùbá tó ṣe kedere láì fi ìtumọ̀ ẹbọ tí àyíká kò fi dandan mú wọlé.
- source_word: φαγόντες
  choice: kí a sì jẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé participle aorist ni, ó darapọ̀ mọ́ ìpè láti ṣe ayẹyẹ. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa ìṣe jíjẹ mọ́ láì túmọ̀ rẹ̀ sí àsè lọ́nà àfikún.
- source_word: εὐφρανθῶμεν
  choice: kí a sì ṣe ayẹyẹ
  rationale: Subjunctive ìṣírí ẹni kìíní ọ̀pọ̀ ni; “kí a ... ṣe ayẹyẹ” bá àyíká àsè mu, ó sì jẹ́ èdè òde òní tó yé kedere.
- source_word: καὶ ... καὶ
  choice: Ẹ sì ... kí a sì ... kí a sì
  rationale: Àtúnṣe “sì” pa ìṣọ̀kan àti ìtẹ̀síwájú àwọn àṣẹ àti ìpè náà mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ẹbọ tí θύσατε lè ní
  choice: “kí ẹ pa á,” gẹ́gẹ́ bí pípa ẹran fún àsè
  alternative: “kí ẹ fi rúbọ” tàbí ọ̀rọ̀ míì tó sọ ẹbọ ní kedere
  rationale: θύω lè ní ìtumọ̀ ìrúbọ ní àwọn àyíká kan, ṣùgbọ́n níbí, àfiyèsí ìtàn wà lórí pípèsè àsè ilé. Ìtumọ̀ “pa á” kò fi ẹ̀kọ́ ìsìn tí kò hàn gbangba sínú àkójọpọ̀ náà, nígbà tí àlàyé ìsàlẹ̀ ṣì pa ààyè ìtumọ̀ kejì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ọmọ màlúù àbọ́pa” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ẹran tí a ti bọ́ fún àkókò ayẹyẹ; àmì ohùn wà níbi tí ó yẹ.
