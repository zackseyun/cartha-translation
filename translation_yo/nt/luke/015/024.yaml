id: LUK.15.24
reference: Luke 15:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: yo
  text: Nítorí ọmọ mi yìí ti kú, ó sì tún wà láàyè[a]; ó ti sọnù, a sì ti rí i[b]. Wọ́n sì bẹ̀rẹ̀ sí í ṣe ayẹyẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì tún yè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a sì rí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣe àfihàn ìdí tí bàbá náà fi ní kí wọ́n ṣe ayẹyẹ; ‘nítorí’ jẹ́ ọ̀nà àdánidá láti so ìdí yìí ní Yorùbá.
- source_word: οὗτος ὁ υἱός μου
  choice: ọmọ mi yìí
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ atọ́ka οὗτος mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé, tí ó lè fi ìfẹ́ àti ìdánimọ̀ hàn.
- source_word: νεκρὸς ἦν
  choice: ti kú
  rationale: Ó pa àwòrán líle ti ikú mọ́ láì túmọ̀ rẹ̀ sí àjèjì tàbí ìyapa; nínú àyíká Yorùbá, ‘ti kú’ bá ìyípadà sí ‘tún wà láàyè’ mu dáadáa.
- source_word: ἀνέζησεν
  choice: ó sì tún wà láàyè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti tún yè tàbí tún wà láàyè. Yíyan yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtakora kú/láàyè mọ́.
- source_word: ἦν ἀπολωλὼς
  choice: ó ti sọnù
  rationale: ‘Sọnù’ ni ọ̀rọ̀ tó bá àkòrí sọnù/rí jákèjádò Lúùkù 15 mu, ó sì ṣàfihàn ipò tó wà ṣáájú.
- source_word: εὑρέθη
  choice: a sì ti rí i
  rationale: Ó pa ohùn àìṣe ti Gíríìkì mọ́ ní Yorùbá pẹ̀lú ‘a’ aláìlórúkọ, láì sọ ẹni tó rí i ní pàtó; ‘ti’ tún fi àbájáde tó wà nísinsìnyí hàn.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: wọ́n sì bẹ̀rẹ̀ sí í ṣe ayẹyẹ
  rationale: ‘Bẹ̀rẹ̀’ pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ mọ́, ‘ṣe ayẹyẹ’ sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó bá àsè àti ayọ̀ inú àyíká náà mu.
theological_decisions:
- issue: Agbára àkàwé inú ‘kú’ àti ‘tún wà láàyè’
  choice: Pa èdè ikú àti ìyè mọ́ gẹ́gẹ́ bí ó ti rí, láì fi àlàyé ìtumọ̀ ẹ̀mí tàbí àjọṣepọ̀ rọ́pò rẹ̀.
  alternative: Túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘ó dà bí ẹni tó kú, ó sì tún padà sí àjọṣepọ̀.’
  rationale: Nínú òwe náà, ikú àti ìyè ń ṣàpẹẹrẹ ìyapa àti ìmúpadàbọ̀sípò, ṣùgbọ́n ọ̀rọ̀ Gíríìkì mọ̀ọ́mọ̀ lo àwòrán líle yìí. Ìtumọ̀ náà kò gbọ́dọ̀ yọ ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ náà kúrò.
- issue: Ẹni tó ṣe iṣẹ́ nínú εὑρέθη
  choice: Lo ‘a sì ti rí i,’ èyí tí kò dárúkọ aṣojú náà.
  alternative: Lo ‘a sì rí i’ tàbí ‘wọ́n sì ti rí i.’
  rationale: Gíríìkì jẹ́ ohùn àìṣe, kò sì sọ ẹni tó rí ọmọ náà. Yorùbá sábà máa ń lo ‘a’ aláìlórúkọ fún irú ìtumọ̀ yìí, nítorí náà kò fi aṣojú tuntun kún ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbòò. ‘Ó tún wà láàyè’ ni a yàn dípò ọ̀rọ̀ tó lè mú àjíǹde ara nìkan wá sí ọkàn, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ fi àṣàyàn náà hàn.
