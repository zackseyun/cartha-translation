id: LUK.15.32
reference: Luke 15:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: yo
  text: Ṣùgbọ́n ó pọndandan kí a ṣe ayẹyẹ, kí a sì yọ̀,[a] nítorí arákùnrin rẹ yìí ti kú, ó sì tún wà láàyè;[b] ó ti sọnù, a sì ti rí i.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó yẹ kí a ṣe ayẹyẹ, kí a sì yọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ó sì gbé” tàbí “ó sì wá sí ìyè”; ó ṣeé ṣe kí gbolohun náà jẹ́ àfiwé fún ìmúpadàbọ̀ ẹni náà nínú òwe yìí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a sì rí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: ṣe ayẹyẹ
  rationale: Nínú àyíká àsè inú òwe náà, ‘ṣe ayẹyẹ’ fi ìdùnnú tí a ń fi àsè hàn mú jáde lọ́nà àdánidá ju gbolohun bí ‘máa yọ̀’ lọ.
- source_word: χαρῆναι
  choice: yọ̀
  rationale: Ó pa ọ̀rọ̀ kejì tí ó ń fi ayọ̀ hàn mọ́, láì da àwọn ọ̀rọ̀ méjèèjì pọ̀ sí ọ̀kan.
- source_word: ἔδει
  choice: ó yẹ kí a
  rationale: Ó fi dandan tàbí ohun tí ipò náà béèrè hàn, ṣùgbọ́n kò sọ ẹni kan pàtó gẹ́gẹ́ bí olùṣe. ‘Ó yẹ’ tún lè túmọ̀ sí pé ohun náà bá ipò mu, èyí tí akọsilẹ̀ ẹsẹ̀ ṣàlàyé.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: arákùnrin rẹ yìí
  rationale: Ètò ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa méjèèjì—ìbátan σου àti atọ́ka οὗτος—mọ́.
- source_word: νεκρὸς ἦν
  choice: ti kú
  rationale: Ó pa àwòrán ikú mọ́ láì túmọ̀ rẹ̀ sí ìyapa tàbí ìpadàbọ̀ ní tààrà, kí agbára àfiwé inú òwe náà lè dúró.
- source_word: ἔζησεν
  choice: ó sì tún wà láàyè
  rationale: Ó pa ìtakora ikú àti ìyè mọ́. ‘Tún’ mú ìpadà sí ipò ìyè hàn, bí àyíká ọ̀rọ̀ ṣe ń béèrè, láì sọ ọ́ di ẹ̀kọ́ nípa àjíǹde ara.
- source_word: ἀπολωλὼς
  choice: ó ti sọnù
  rationale: Perfect participle náà ń ṣàpèjúwe ipò ẹni tí ó sọnù; ìtumọ̀ yìí jẹ́ ti ẹ̀dá àti àyíká òwe náà.
- source_word: εὑρέθη
  choice: a sì ti rí i
  rationale: Yorùbá sábà máa ń lo àkójọpọ̀ ẹni tí kò ní orúkọ, ‘a,’ fún passive bẹ́ẹ̀. ‘Ti’ fi àbájáde tó ṣì wúlò nísinsìnyí hàn.
theological_decisions:
- issue: Bóyá kí a sọ ìtumọ̀ àfiwé/ìmúpadàbọ̀ ti ἔζησεν ní gbangba
  choice: Pa àwòrán ikú àti ìyè mọ́ pẹ̀lú ‘ó sì tún wà láàyè.’
  alternative: ‘ó sì tún jí dìde’ tàbí ‘ó sì tún padà sí ìyè’
  rationale: ‘Jí dìde’ lè mú kí òǹkàwé rò pé àjíǹde ara ni ẹsẹ̀ náà ń sọ ní tààrà. Ìtumọ̀ tí a yàn pa ìtakora inú Gíríìkì mọ́, ó sì jẹ́ kí àyíká òwe náà fi ìmúpadàbọ̀ hàn láì yanjú àfiwé náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘arákùnrin rẹ yìí’ láti mú ìránnilétí baba nípa ìbátan wọn jáde. Àwọn àmì ohùn ni a fi sí gbogbo ọ̀rọ̀ níbi tí ó ti yẹ.
