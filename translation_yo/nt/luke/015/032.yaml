  naturalness: Yorùbá náà jẹ́ èyí tí ó dára, tí ó sì rọrùn láti ka. ‘A sì ti rí i’ jẹ́ ọ̀nà àdánidá láti sọ passive náà. A tún ṣe akọsilẹ̀ b ní ìtúnṣe nítorí ‘ó yè’ kò ní ìtumọ̀ ‘ó wà láàyè’ ní Yorùbá òde òní.
  terminology: ‘Ṣe ayẹyẹ’ àti ‘yọ̀’ dá ìlọ́pò ọrọ̀ ayọ̀ inú Gíríìkì mọ́. ‘Arákùnrin rẹ yìí’ tọ́ka sí ὁ ἀδελφός σου οὗτος dáadáa, láì ṣàfikún ìtumọ̀ ẹ̀kọ́ sí àfiwé ikú àti ìyè náà.
