reference: Luke 15:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: yo
  text: Ṣùgbọ́n ọmọ náà sọ fún un pé, “Baba, mo ti ṣẹ̀ sí ọ̀run[a], mo sì ṣẹ̀ níwájú rẹ. N kò yẹ mọ́ láti pè mí ní ọmọ rẹ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, “ṣẹ̀ sí ọ̀run,” lo “ọ̀run” gẹ́gẹ́ bí ọ̀nà ìbọ̀wọ̀ láti tọ́ka sí Ọlọ́run; àwọn ìtumọ̀ kan túmọ̀ ọ́ ní ṣíṣàlàyé sí “ṣẹ̀ sí Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan tẹ̀síwájú pẹ̀lú ọ̀rọ̀ tí ìtumọ̀ rẹ̀ jẹ́, “Ṣe mí bí ọ̀kan lára àwọn alágbàṣe rẹ,” ní ìbámu pẹ̀lú ẹsẹ 19; ọ̀rọ̀ SBLGNT parí gbólóhùn náà sí “ọmọ rẹ.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ṣùgbọ́n ... sọ
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “Ṣùgbọ́n” bá ìyípadà inú ìtàn mu, ó sì fi ọ̀rọ̀ ọmọ náà ṣe ìyàtọ̀ sí ohun tí baba ṣẹ̀ṣẹ̀ ṣe láìjẹ́ kí ìtakora náà le jù.
- source_word: ὁ υἱὸς αὐτῷ
  choice: ọmọ náà sọ fún un
  rationale: Ó pa àpilẹ̀kọ náà mọ́ gẹ́gẹ́ bí “ọmọ náà,” ó sì tú αὐτῷ sí “fún un” láìfi “baba” kún ohun tí Gíríìkì sọ ní kedere.
- source_word: Πάτερ
  choice: Baba
  rationale: Àpèjúwe pàtó vocative náà ni “Baba”; fífi “mi” kún un kò pọndandan, nítorí kò sí ní kedere nínú Gíríìkì.
- source_word: ἥμαρτον
  choice: mo ti ṣẹ̀
  rationale: Ọ̀nà ìjẹ́wọ́ ẹ̀ṣẹ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì sọ ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà nísinsìnyí.
- source_word: εἰς τὸν οὐρανὸν
  choice: ṣẹ̀ sí ọ̀run
  rationale: Ó pa ọ̀rọ̀ àfiṣàpẹẹrẹ ìbọ̀wọ̀ fún Ọlọ́run mọ́, dípò kí a túmọ̀ rẹ̀ ní ṣíṣàlàyé sí “ṣẹ̀ sí Ọlọ́run.”
- source_word: καὶ ἐνώπιόν σου
  choice: mo sì ṣẹ̀ níwájú rẹ
  rationale: “Níwájú rẹ” pa ìtumọ̀ ìpìlẹ̀ ti ἐνώπιον mọ́; a tún ọ̀rọ̀-ìṣe “ṣẹ̀” sọ kí gbólóhùn Yorùbá lè ṣe kedere, láìpa ìtumọ̀ rẹ̀ dà.
- source_word: οὐκέτι
  choice: kò ... mọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ “no longer.”
- source_word: ἄξιος
  choice: yẹ
  rationale: “Yẹ” mú ìtumọ̀ ìwà rere àti ipò ìbátan tí ọ̀rọ̀ náà ní nínú ìjẹ́wọ́ yìí jáde ní kedere.
- source_word: κληθῆναι
  choice: láti jẹ́ ẹni tí a ń pè ní
  rationale: Ó pa ìṣe aláìlórúkọ (passive) mọ́, ó sì jẹ́ Yorùbá àdánidá ju títúmọ̀ ọ́ ní líle gẹ́gẹ́ bí “láti jẹ́ pípè” lọ.
- source_word: υἱός σου
  choice: ọmọ rẹ
  rationale: Ó pa ìbátan ìdílé àti ohun tí ọmọ náà ní òun kò yẹ mọ́ láti jẹ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ “ọ̀run” nínú ìjẹ́wọ́ náà
  choice: Pa “ṣẹ̀ sí ọ̀run” mọ́ gẹ́gẹ́ bí ọ̀nà ìbọ̀wọ̀ láti tọ́ka sí ẹ̀ṣẹ̀ sí Ọlọ́run.
  alternative: Túmọ̀ ọ́ ní ṣíṣàlàyé gẹ́gẹ́ bí “ṣẹ̀ sí Ọlọ́run.”
  rationale: Gíríìkì sọ “ọ̀run”; pípa ọ̀rọ̀ náà mọ́ bọ̀wọ̀ fún ẹ̀rí orísun, ó sì yàgò fún yíyanju àfiṣàpẹẹrẹ ẹ̀sìn náà ní ìkọ̀kọ̀.
- issue: Ibi tí ọ̀rọ̀ ọmọ náà parí nínú ẹsẹ yìí
  choice: Parí ọ̀rọ̀ náà sí “ọmọ rẹ,” gẹ́gẹ́ bí SBLGNT.
  alternative: Fi ọ̀rọ̀ náà kún un pé, “Ṣe mí bí ọ̀kan lára àwọn alágbàṣe rẹ,” gẹ́gẹ́ bí àwọn àfọwọ́kọ kan àti Lúùkù 15:19.
  rationale: Ẹ̀rí orísun tí a pèsè parí ní υἱός σου; àlàyé ìsàlẹ̀ ojú ìwé ni ó yẹ kí ó tọ́ka sí ẹ̀dà gígùn láìfi í sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé lásán ni a lò. Àmì ohùn kún níbi tí ó bá jẹ́ àdánidá. “Èmi” ní ìbẹ̀rẹ̀ gbólóhùn ìkẹyìn fi ìtẹnumọ́ ẹni tí ń jẹ́wọ́ hàn, nígbà tí “ẹni tí a ń pè ní” jẹ́ ọ̀nà Yorùbá tó rọrùn láti pa passive κληθῆναι mọ́.
