  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà: lẹ́yìn tí ọkùnrin náà ná gbogbo ohun tí ó ní, ìyàn líle dé sí agbègbè náà, ó sì bẹ̀rẹ̀ sí í ṣàìní. Ṣùgbọ́n “ìyàn ... mú ní gbogbo ilẹ̀ náà” kò ṣe àfihàn ἐγένετο ní ọ̀nà tó péye tàbí tó rọrùn nínú Yorùbá; ó lè dà bí ẹni pé ìyàn náà ‘mú’ ohun kan. “Òun náà” sì lè ní ìtumọ̀ ‘òun pẹ̀lú,’ ju ìtẹnumọ́/ìtẹ̀síwájú αὐτός lọ.'
