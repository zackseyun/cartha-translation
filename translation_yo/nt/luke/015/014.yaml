  rationale: A rọ́pò “mú” pẹ̀lú “ṣẹlẹ̀” láti ṣàfihàn ἐγένετο pẹ̀lú λιμός ní Yorùbá tó dára. A lo “ní gbogbo agbègbè náà” fún ìtànkálẹ̀ κατά τὴν χώραν ἐκείνην. A yọ “náà” nínú “òun náà” kí a má fi ìtumọ̀ ‘pẹ̀lú’ kún αὐτός. Àwọn àmì ìsàlẹ̀ a àti b wà níbi tí wọ́n tọ́, wọ́n sì bá àwọn àṣàyàn ìtumọ̀ tí a sọ mu.
