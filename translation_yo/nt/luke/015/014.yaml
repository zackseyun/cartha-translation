base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí ó ti ná gbogbo ohun tí ó ní tán, ìyàn líle kan ṣẹlẹ̀ ní gbogbo agbègbè náà[a], ó sì bẹ̀rẹ̀ sí í ṣe aláìní[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní agbègbè náà” tàbí “já gbogbo ilẹ̀ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó bẹ̀rẹ̀ sí í ṣàìní” tàbí “ó bẹ̀rẹ̀ sí í nílò ohun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: lẹ́yìn tí ó ti ná gbogbo ohun tí ó ní tán
  rationale: 'Gbólóhùn olùṣe nínú ọ̀rọ̀ ìpilẹ̀ ń tọ́ka sí àkókò: lẹ́yìn tí ó ti ná gbogbo ohun tí ó ní. ‘Ná’ dúró mọ́ ìtumọ̀ δαπανάω láìfi èrò pé ó fi í ṣòfò kún un láti inú àyíká ìtàn.'
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora hàn láàárín ìgbésí ayé ọ̀pọ̀ àti ìṣòro tó dé lẹ́yìn náà.
- source_word: ἐγένετο
  choice: mú
  rationale: Pẹ̀lú ‘ìyàn,’ ọ̀rọ̀ náà ń sọ bí ìṣẹ̀lẹ̀ ṣe dé bá agbègbè kan; ‘ìyàn ... mú’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: λιμὸς ἰσχυρά
  choice: ìyàn líle kan
  rationale: ἰσχυρά ń mú bí ìyàn náà ṣe le tó lágbára; ‘ìyàn líle’ jẹ́ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: ní gbogbo ilẹ̀ náà
  rationale: κατά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative lè fi hàn pé ohun kan tàn dé gbogbo àgbègbè; ‘ilẹ̀’ tún lè túmọ̀ sí orílẹ̀ tàbí agbègbè ní àyíká yìí.
- source_word: ἤρξατο ὑστερεῖσθαι
  choice: bẹ̀rẹ̀ sí í ṣe aláìní
  rationale: ἤρξατο pẹ̀lú infinitive ń fi ìbẹ̀rẹ̀ ipò kan hàn, ὑστερεῖσθαι sì túmọ̀ sí pé ohun tí ẹni nílò kò tó fún un.
- source_word: αὐτὸς
  choice: òun náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́ díẹ̀; ‘òun náà’ pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
