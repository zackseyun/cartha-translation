translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ná’ dípò ‘fi ṣòfò’ kí a má bàa fi ìdájọ́ tí ọ̀rọ̀ Gíríìkì ẹsẹ̀ yìí kò fi hàn kún un; a sì lo ‘ìyàn líle’ àti ‘ṣe aláìní’ gẹ́gẹ́ bí àwọn gbólóhùn àdánidá.
