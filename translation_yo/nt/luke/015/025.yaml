  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: yo
  text: Ọmọ rẹ̀ àgbà sì wà ní oko; bí ó sì ti ń bọ̀, tí ó sì sún mọ́ ilé náà, ó gbọ́ orin àti ijó[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “orin tí a fi ohun èlò ṣẹ̀ àti àwọn oníjó.” Àwọn ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí orin ohun èlò àti ẹgbẹ́ àwọn oníjó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: sì wà
  rationale: δέ ṣe àmì ìyípadà nínú ìtàn; “sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú láìfi ìtakò tí kò sí kún un.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: ọmọ rẹ̀ àgbà
  rationale: πρεσβύτερος túmọ̀ sí ẹni tí ó dàgbà jù nínú àwọn ọmọ méjì tí ìtàn náà ń fi wé ara wọn; “ọmọ rẹ̀ àgbà” dá ìyàtọ̀ yẹn mọ́ láìsọ pé òun ni àkọ́bí gbogbo ọmọ.
- source_word: ἐν ἀγρῷ
  choice: ní oko
  rationale: ἀγρός ń tọ́ka sí oko tàbí ilẹ̀ iṣẹ́ àgbẹ̀; “ní oko” jẹ́ gbolohun Yorùbá tó ṣe tààrà, tó sì bá àyíká ìtàn mu.
- source_word: ὡς ἐρχόμενος
  choice: bí ó sì ti ń bọ̀
  rationale: Ìṣe alábápín yìí fi ìgbà àti ìlọsíwájú hàn; “bí ó ti ń bọ̀” mú kí ìrìn rẹ̀ sí ilé hàn gẹ́gẹ́ bí ohun tó ń lọ lọ́wọ́.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: tí ó sì sún mọ́ ilé náà
  rationale: ἐγγίζω túmọ̀ sí sísún mọ́ tàbí fífi ara kan ibi; yíyan yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìsúnmọ́ mọ́.
- source_word: ἤκουσεν
  choice: ó gbọ́
  rationale: Aoristi náà sọ ìṣẹ̀lẹ̀ tó rọrùn nínú ìtàn; “ó gbọ́” kò fi ìtumọ̀ míì tí kò sí kún un.
- source_word: συμφωνίας
  choice: orin
  rationale: συμφωνία lè tọ́ka sí orin tàbí ìró ohun èlò orin; “orin” jẹ́ ọ̀rọ̀ tó yé gbogbo ènìyàn, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa ìtumọ̀ pàtó míì mọ́.
- source_word: χορῶν
  choice: ijó
  rationale: χορός lè túmọ̀ sí ijó tàbí ẹgbẹ́ àwọn oníjó; “ijó” bá ìṣọ̀kan “orin àti ijó” mu ní Yorùbá, nígbà tí àlàyé ń tọ́ka sí ìtumọ̀ ẹgbẹ́ àwọn oníjó.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti ìtàn, ó lọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn, kì í ṣe ọ̀rọ̀ àkókò.
