source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: yo
  text: N kò yẹ mọ́ kí a pè mí ní ọmọkùnrin rẹ. Ṣe mí bí ọ̀kan lára àwọn òṣìṣẹ́ alágbàṣe rẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan lára àwọn ìránṣẹ́ tí a gbà ṣiṣẹ́ fún owó.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn òṣìṣẹ́ tí a ń san owó iṣẹ́ fún, kì í ṣe àwọn ẹrú inú ilé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: kò yẹ mọ́
  rationale: '“Mọ́” pẹ̀lú ìsẹ́ òdì fi hàn pé ipò náà ti yí padà: kò yẹ mọ́ bí ó ti lè yẹ tẹ́lẹ̀.'
- source_word: ἄξιος
  choice: yẹ
  rationale: “Yẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ́ ẹni tí ó tó tàbí tí ó lẹ́tọ̀ọ́ sí ipò kan.
- source_word: κληθῆναι
  choice: láti jẹ́ kí a pè mí ní
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe ti Gíríìkì mọ́, ó sì ṣàfihàn yíyan ẹni náà sí ipò tàbí orúkọ kan.
- source_word: υἱός
  choice: ọmọ
  rationale: Nínú àyíká yìí, “ọmọ” túmọ̀ sí ọmọkùnrin tí ń bá bàbá rẹ̀ sọ̀rọ̀; Yorùbá sábà máa ń lo ọ̀rọ̀ yìí láìfi abo hàn nígbà tí àyíká ti mú un ṣe kedere.
- source_word: ποίησόν
  choice: Sọ mí di
  rationale: Àṣẹ náà bẹ baba pé kó fi í sí ipò tuntun; “sọ mí di” lagbara, ó sì sun mọ́ ìtumọ̀ fa-ẹni-di-nǹkan ti Gíríìkì ju “máa ṣe sí mi bí” lọ.
- source_word: ὡς
  choice: bí
  rationale: “Bí” fi ìfiwéra hàn, kì í fi dandan sọ pé ó ti di òṣìṣẹ́ náà ní ti ìdánimọ̀.
- source_word: ἕνα τῶν μισθίων
  choice: ọ̀kan lára àwọn òṣìṣẹ́ alágbàṣe rẹ
  rationale: “Òṣìṣẹ́ alágbàṣe” tọ́ka sí ẹni tí a gbà ṣiṣẹ́ fún owó iṣẹ́, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ẹrú inú ilé.
theological_decisions:
- issue: Ọ̀rọ̀ ipò nínú ìjẹ́wọ́ ọmọ náà
  choice: Pa “yẹ” àti ìbátan “ọmọ” mọ́ láìrọ̀ ọ́.
  alternative: Èmi kò lẹ́tọ̀ọ́ mọ́ láti jẹ́ ọmọ rẹ.
  rationale: Gíríìkì sọ ní pàtó pé kò yẹ kí a pè é ní ọmọ, kì í ṣe pé ìbátan rẹ̀ ti parí ní ti gidi. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ yìí mọ́ láìdá ìpinnu ẹ̀kọ́ ìgbàgbọ́ sí i.
- issue: Ìfiwéra tàbí ìdánimọ̀ nínú ὡς
  choice: “bí ọ̀kan lára”
  alternative: “gẹ́gẹ́ bí ọ̀kan lára”
  rationale: “Bí” pa agbára ìfiwéra mọ́, ó sì yẹra fún fífi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “Sọ mí di” láti pa agbára àṣẹ Gíríìkì mọ́; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
