revisions:
- from: Èmi kò yẹ mọ́ láti jẹ́ kí a pè mí ní ọmọ rẹ. Sọ mí di bí ọ̀kan lára àwọn òṣìṣẹ́ alágbàṣe rẹ.[a]
  to: N kò yẹ mọ́ kí a pè mí ní ọmọkùnrin rẹ. Ṣe mí bí ọ̀kan lára àwọn òṣìṣẹ́ alágbàṣe rẹ.[a]
  rationale: The revision removes the added permission sense, states the masculine filial term explicitly, and uses an idiomatic comparative imperative. It retains the source's ambiguity about whether the request concerns formal status or treatment, while preserving the wage-worker nuance and attaching the note to its lexical referent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal negation, unworthiness, passive designation, and the distinction of paid workers from slaves. However, “láti jẹ́ kí a pè mí” adds the idea of permitting others to call him, whereas Greek κληθῆναι simply means “to be called.” The explicitly masculine υἱός is better retained as “ọmọkùnrin” in this self-contained verse.
  naturalness: “Èmi kò yẹ mọ́ láti jẹ́ kí a pè mí” is less natural Yoruba because it makes the speaker appear to be granting permission. “N kò yẹ mọ́ kí a pè mí” is direct and idiomatic. “Ṣe mí bí” is a natural imperative that preserves the comparative force of ὡς without overstating a change of identity.
  terminology: “Òṣìṣẹ́ alágbàṣe” appropriately represents μίσθιος as a wage-paid worker. The note correctly explains that these are not household slaves. “Ọmọkùnrin” preserves the masculine reference of υἱός.
  issues:
  - severity: medium
    issue: The expression “láti jẹ́ kí a pè mí” adds a permission/allowance sense.
    rationale: The Greek passive infinitive κληθῆναι means “to be called”; it does not express the son's allowing people to use that designation.
  - severity: low
    issue: “Ọmọ” does not itself mark the masculine singular υἱός in an isolated rendering.
    rationale: Although the narrative context identifies the speaker as male, “ọmọkùnrin” retains the source wording more explicitly and remains natural in Yoruba.
  - severity: low
    issue: The footnote anchor is placed at the sentence end rather than directly after the term it explains.
    rationale: Placing [a] after “òṣìṣẹ́ alágbàṣe” makes the lexical scope immediately clear.
  revised_text: N kò yẹ mọ́ kí a pè mí ní ọmọkùnrin rẹ. Ṣe mí bí ọ̀kan lára àwọn òṣìṣẹ́ alágbàṣe rẹ.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan lára àwọn ìránṣẹ́ tí a gbà ṣiṣẹ́ fún owó.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn òṣìṣẹ́ tí a ń san owó iṣẹ́ fún, kì í ṣe àwọn ẹrú inú ilé.
    reason: lexical_alternative
  revision_rationale: The revision removes the added permission sense, states the masculine filial term explicitly, and uses an idiomatic comparative imperative. It retains the source's ambiguity about whether the request concerns formal status or treatment, while preserving the wage-worker nuance and attaching the note to its lexical referent.
