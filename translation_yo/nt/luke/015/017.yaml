  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ gbogbogbòò ẹsẹ̀ náà: ìmọ̀lára ọmọ náà padà, ó rántí àwọn òṣìṣẹ́ alágbàṣe bàbá rẹ̀ tí wọ́n ní oúnjẹ tó pọ̀, ó sì fi ipò ebi tirẹ̀ wé e. Ṣùgbọ́n “àkàrà” kì í ṣe ìtumọ̀ tó yẹ fún ἄρτων nínú àyíká yìí; àkàrà jẹ́ oúnjẹ ẹ̀wà tí a sè/dín, nígbà tí “búrẹ́dì” ni ọ̀rọ̀ Yorùbá òde òní tó tọ́ fún bread. “Ń ṣègbé” sì pa ìmọ̀ ἀπόλλυμαι mọ́ dáadáa ju “ń kú lọ,” tí ó lè sọ ìtumọ̀ náà di ikú gangan ju bó ṣe yẹ lọ.'
