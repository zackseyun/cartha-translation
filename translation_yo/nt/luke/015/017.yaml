  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó padà ronú dáadáa[a], ó ní, ‘Àwọn òṣìṣẹ́ alágbàṣe bàbá mi mélòó ni tí wọ́n ní búrẹ́dì tí ó ṣẹ́ kù[b], ṣùgbọ́n èmi ń ṣègbé níbí nítorí ebi!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, Gíríìkì ní, “nígbà tí ó wá sí ara rẹ̀.” Tàbí, “nígbà tí ojú rẹ̀ já.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí wọ́n ní búrẹ́dì tó pọ̀ débi pé ó ṣẹ́ kù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: nígbà tí ojú rẹ̀ wá já
  rationale: Àrọ́pò èdè Yorùbá yìí túmọ̀ sí pé ìrònú ẹni padà ṣe kedere, ó sì bá ìtumọ̀ àpẹẹrẹ Gíríìkì mu láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: ἔφη
  choice: ó ní
  rationale: Ọ̀rọ̀ ìtàn aorist náà yẹ gẹ́gẹ́ bí ọ̀rọ̀ ìṣe tó ṣẹlẹ̀ lẹ́ẹ̀kan nínú ìtàn; ‘ó ní’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: μίσθιοι
  choice: àwọn òṣìṣẹ́ alágbàṣe
  rationale: Ó tọ́ka sí àwọn tí a gbà síṣẹ́ fún owó, kì í ṣe ẹrú ilé; ‘òṣìṣẹ́ alágbàṣe’ pa ìyàtọ̀ yẹn mọ́.
- source_word: περισσεύονται ἄρτων
  choice: ní oúnjẹ àkàrà àní tó ń ṣẹ́ kù
  rationale: Ó fi hàn pé àkàrà pọ̀ ju ohun tí wọ́n nílò lọ, kì í ṣe pé wọ́n kàn ní ohun tí yóò tó wọn.
- source_word: ἄρτων
  choice: oúnjẹ àkàrà
  rationale: A pa ohun pàtó tí Gíríìkì sọ, ìyẹn àkàrà, mọ́; fífi ‘oúnjẹ’ kún un mú kí Yorùbá náà ṣe kedere pé ó jẹ́ ohun ìgbẹ́mìí ró.
- source_word: λιμῷ
  choice: nítorí ebi
  rationale: Ní àyíká ọ̀rọ̀ yìí, λιμός túmọ̀ sí ebi líle tí ń pa á, ju bí a ó ṣe túmọ̀ ọ́ sí ìyàn gbogbo ilẹ̀ lọ.
- source_word: ὧδε
  choice: níbí
  rationale: Ó tẹnu mọ́ ipò búburú tí ó wà nísinsìnyí, ní ìtakora sí ọ̀pọ̀ yanturu tó wà ní ilé bàbá rẹ̀.
- source_word: ἀπόλλυμαι
  choice: ń kú lọ
  rationale: Ìṣe àsìkò ìsinsìnyí náà fi ìparun tó ń lọ lọ́wọ́ hàn; ‘ń kú lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìwúwo ọ̀rọ̀ náà mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, tí ó sì bá ọ̀rọ̀ ẹnu inú ìtàn mu. A lo ‘ojú rẹ̀ wá já’ gẹ́gẹ́ bí àrọ́pò àdánidá, pẹ̀lú àlàyé ìtumọ̀ gangan nínú àlàyé ìsàlẹ̀.
