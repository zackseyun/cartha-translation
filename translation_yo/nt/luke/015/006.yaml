id: LUK.15.6
reference: Luke 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: yo
  text: Nígbà tí ó sì dé inú ilé[a], ó pe àwọn ọ̀rẹ́ rẹ̀ àti àwọn aládùúgbò rẹ̀ jọ, ó wí fún wọn pé, “Ẹ bá mi yọ̀[b], nítorí mo ti rí àgùntàn mi tí ó sọnù[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó rọrùn sí i nínú Yorùbá, “nígbà tí ó dé ilé.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ní “nígbà tí ó dé inú ilé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ bá mi ṣe ayẹyẹ.” Ọ̀rọ̀ àṣẹ Gíríìkì náà túmọ̀ sí kí ènìyàn bá ẹlòmíràn yọ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àgùntàn mi tó ti sọnù.” Ní ti gidi, Gíríìkì náà ní “àgùntàn mi, èyí tí ó ti sọnù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: Nígbà tí ó sì dé inú ilé
  rationale: A ṣe àpólà alábàápín aorist náà bí gbólóhùn àkókò ní Yorùbá. ‘Dé inú ilé’ pa ìtọ́kasí Gíríìkì sí wíwọ inú ilé mọ́, bí ó tilẹ̀ jẹ́ pé ‘dé ilé’ lè túmọ̀ sí ‘dé sí ilé tirẹ̀’ lọ́nà àdánidá.
- source_word: συγκαλεῖ
  choice: ó pe ... jọ
  rationale: ‘Pe ... jọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan pe ọ̀pọ̀ ènìyàn kí wọ́n péjọ.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: àwọn ọ̀rẹ́ rẹ̀ àti àwọn aládùúgbò rẹ̀
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí jẹ́ ìtumọ̀ tààrà fún φίλους àti γείτονας; arọ́pò-orúkọ ‘rẹ̀’ mú ìbáṣepọ̀ wọn pẹ̀lú olùṣọ́-agùntàn náà hàn lọ́nà Yorùbá tó ṣe kedere.
- source_word: λέγων αὐτοῖς
  choice: ó wí fún wọn pé
  rationale: Èyí so ọ̀rọ̀ tí ó sọ mọ́ ìṣe pípe wọn jọ ní ọ̀nà tó ṣe déédéé, tó sì ní iyì.
- source_word: Συγχάρητέ μοι
  choice: Ẹ bá mi yọ̀
  rationale: ‘Ẹ bá mi yọ̀’ fi àṣẹ ọ̀pọ̀ ènìyàn àti èrò ayọ̀ tí a jọ ń pín hàn; kò fi ìtumọ̀ àfikún sí ayẹyẹ kan pàtó.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín ὅτι ń ṣàlàyé ìdí tí wọ́n fi gbọ́dọ̀ bá a yọ̀.
- source_word: εὗρον
  choice: mo ti rí
  rationale: Àmì ‘ti’ fi ìṣe tí ó ti parí àti àbájáde rẹ̀ tí ó ṣì wà nísinsìnyí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: àgùntàn mi tí ó sọnù
  rationale: Ìtumọ̀ yìí pa àwòrán àgùntàn náà àti ìtumọ̀ àpólà perfect ‘èyí tí ó wà ní ipò sísọnù’ mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Àwòrán òwe nípa ohun tí a rí padà
  choice: àgùntàn mi tí ó sọnù
  alternative: àgùntàn mi tó ti sọnù; àgùntàn mi tí ó nù
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ń sọ àwòrán òwe ní kíkún, kò sì pe àgùntàn náà ní ‘ẹlẹ́ṣẹ̀’ tàbí fi ọ̀rọ̀ ìgbàlà sí i. Gbólóhùn ìbátan náà tún ń tẹ̀ lé ìṣètò τὸ πρόβατόν μου τὸ ἀπολωλός láìyanju ìtumọ̀ òwe náà ṣáájú àkókò.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè àdánidá, ọ̀wọ̀, àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Wí’ ń gbé ìforúkọsílẹ̀ Bíbélì tó ní iyì díẹ̀, nígbà tí ‘pe ... jọ’ àti ‘Ẹ bá mi yọ̀’ jẹ́ ọ̀rọ̀ Yorùbá ojoojúmọ́ tó mọ́gbọ́n dání.
