  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: yo
  text: N óò dìde, n óò sì lọ sọ́dọ̀ bàbá mi, n óò sì sọ fún un pé, ‘Bàbá, mo ti ṣẹ̀ sí ọ̀run[a] àti níwájú rẹ[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘sí Ọlọ́run’; ó ṣeé ṣe kí ‘ọ̀run’ níbí jẹ́ ọ̀nà ọ̀wọ̀ láti tọ́ka sí Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘lójú rẹ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Èmi yóò dìde
  rationale: Ọ̀rọ̀ ìṣe aláìlópìn yìí ṣáájú ọ̀rọ̀ ìṣe ọjọ́ iwájú, ó sì fi ìgbésẹ̀ àkọ́kọ́ nínú ìpinnu ọmọ náà hàn. Lílo ọ̀rọ̀ ìṣe ọjọ́ iwájú ní Yorùbá jẹ́ kí èrò náà ṣe kedere, ó sì bá ìtumọ̀ Gíríìkì mu.
- source_word: πορεύσομαι
  choice: èmi yóò sì lọ
  rationale: Ó túmọ̀ sí lílọ sí ibi tàbí sọ́dọ̀ ẹni kan. ‘Lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ yìí mu láìfi ìtumọ̀ míì kún un.
- source_word: πρὸς τὸν πατέρα μου
  choice: sọ́dọ̀ bàbá mi
  rationale: πρός pẹ̀lú accusative fi ìlọsí ọ̀dọ̀ ẹni kan hàn. ‘Sọ́dọ̀ bàbá mi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó ń lọ bá bàbá rẹ̀.
- source_word: ἐρῶ αὐτῷ
  choice: èmi yóò sì wí fún un
  rationale: Ó jẹ́ ọ̀rọ̀ ọjọ́ iwájú fún sísọ ohun kan fún ẹni kan. ‘Wí fún un’ jẹ́ ọ̀rọ̀ tó níyì, tó sì sun mọ́ ìṣètò Gíríìkì.
- source_word: Πάτερ
  choice: Bàbá
  rationale: Èyí jẹ́ àpèjúwe ìpè tààrà. ‘Bàbá’ pa ìbáṣepọ̀ ọmọ àti baba mọ́ láìfi ọ̀rọ̀ arọ́pò-orúkọ tí kò sí nínú Gíríìkì kún un.
- source_word: ἥμαρτον
  choice: mo ti ṣẹ̀
  rationale: Aorist náà jẹ́ ìjẹ́wọ́ ẹ̀ṣẹ̀ tí a ti dá, tí ipa ìwà rere rẹ̀ sì ṣì wà ní àsìkò ọ̀rọ̀ náà. ‘Mo ti ṣẹ̀’ jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń jẹ́wọ́ ẹ̀ṣẹ̀.
- source_word: εἰς τὸν οὐρανὸν
  choice: sí ọ̀run
  rationale: Gbólóhùn náà ní ‘ọ̀run’ gẹ́gẹ́ bí ó ti wà nínú Gíríìkì, ó sì ṣeé ṣe kí ó jẹ́ ọ̀nà ọ̀wọ̀ láti tọ́ka sí Ọlọ́run. ‘Ṣẹ̀ sí ọ̀run’ pa àwòrán àti àìsọ pàtó inú orísun mọ́.
- source_word: ἐνώπιόν σου
  choice: níwájú rẹ
  rationale: ἐνώπιον túmọ̀ sí ‘níwájú’ tàbí ‘lójú’ ẹni kan. ‘Níwájú rẹ’ pa ọ̀rọ̀ Gíríìkì mọ́, kò sì sọ ọ́ di ‘sí ọ’ bí ẹni pé ọ̀rọ̀ kan náà ni pẹ̀lú gbólóhùn tó ṣáájú.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ‘ọ̀run’ ní pàtó sí ‘Ọlọ́run’ nínú ẹsẹ̀ náà
  choice: 'A fi ‘ọ̀run’ sílẹ̀ nínú ẹsẹ̀ náà: ‘mo ti ṣẹ̀ sí ọ̀run àti níwájú rẹ.’'
  alternative: Mo ti ṣẹ̀ sí Ọlọ́run àti sí ọ.
  rationale: Gíríìkì lo οὐρανός (‘ọ̀run’), ó sì ṣeé ṣe kí èyí jẹ́ ọ̀nà ọ̀wọ̀ tí àwọn Júù fi ń tọ́ka sí Ọlọ́run. Fífi ‘ọ̀run’ sílẹ̀ ń jẹ́ kí ìtumọ̀ orísun àti ìwọ̀n àìsọ pàtó rẹ̀ dúró, dípò kí ìtumọ̀ túmọ̀ rẹ̀ ní pàtó fún òǹkàwé.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àtúnsọ ‘Èmi yóò’ ń fi ìpinnu ọmọ náà hàn kedere, nígbà tí ‘wí fún un’ àti ‘níwájú rẹ’ ń pa ìrísí ọ̀rọ̀ orísun mọ́.
