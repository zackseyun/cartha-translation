revisions:
- from: Èmi yóò dìde, èmi yóò sì lọ sọ́dọ̀ bàbá mi, èmi yóò sì wí fún un pé, ‘Bàbá, mo ti ṣẹ̀ sí ọ̀run[a] àti níwájú rẹ[b].’
  to: N óò dìde, n óò sì lọ sọ́dọ̀ bàbá mi, n óò sì sọ fún un pé, ‘Bàbá, mo ti ṣẹ̀ sí ọ̀run[a] àti níwájú rẹ[b].’
  rationale: Àtúnṣe náà mú ìṣàn ọ̀rọ̀ Yorùbá rọrùn nípa fífi àwọn arọ́pò-orúkọ ìtẹnumọ́ tí a tún lò kúrò, àti nípa lílo «sọ fún un». Kò yí ìtumọ̀, ìbáṣepọ̀ gbolóhùn, tàbí àìsọ pàtó ti «ọ̀run» nínú orísun padà. A tún dá àwọn àmì akọ́silẹ̀ sí ibi tí akoonu akọ́silẹ̀ kọ̀ọ̀kan ti ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:24Z'
