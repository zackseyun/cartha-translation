lexical_decisions:
- source_word: εἶπεν
  choice: ó sọ
  rationale: Ọ̀rọ̀-ìṣe aorist ti λέγω ni; “ó sọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi iṣẹ́ sísọ hàn nígbà tí òwe kan jẹ́ ohun tí a sọ.
- source_word: δὲ
  choice: Nítorí náà
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́. Ní àyíká ọ̀rọ̀ yìí, “Nítorí náà” so èsì Jésù mọ́ ẹ̀sùn tí wọ́n ṣẹ̀ṣẹ̀ sọ láìsọ pé ìtakora líle wà.
- source_word: πρὸς αὐτοὺς
  choice: fún wọn
  rationale: πρός pẹ̀lú accusative tọ́ka sí àwọn tí a ń bá sọ̀rọ̀; “fún wọn” ni ìtumọ̀ Yorùbá àdánidá nínú gbólóhùn yìí.
- source_word: τὴν παραβολὴν ταύτην
  choice: òwe yìí
  rationale: παραβολή túmọ̀ sí àpẹẹrẹ tàbí ìtàn àfiwé tí a fi ń kọ́ni. “Òwe” ni ọ̀rọ̀ Bíbélì Yorùbá tó mọ́gbọ́n dání, tí “yìí” sì pa demonstrative ταύτην mọ́.
- source_word: λέγων
  choice: 'pé:'
  rationale: Participle yìí ṣí ọ̀nà sí ohun tí Jésù máa sọ lẹ́yìn náà. “Pé:” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ètò ọ̀rọ̀ mu láti bẹ̀rẹ̀ àyọlò tààrà.
