  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Arákùnrin rẹ ti dé, bàbá rẹ sì ti pa ọmọ màlúù tí a ti bọ́ sanra, nítorí ó gba a padà ní àlàáfíà, láìsí ewu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìlera.” Ọ̀rọ̀ Gíríìkì ὑγιαίνοντα lè túmọ̀ sí “ẹni tí ó wà ní ìlera,” tàbí, nínú àyíká yìí, ẹni tí ó padà ní àlàáfíà láìsí ewu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: ti dé
  rationale: 'Ọ̀rọ̀ yìí ń tọ́ka sí dídé tí àbájáde rẹ̀ ṣì wà: arákùnrin náà ti dé, ó sì wà níbẹ̀ báyìí.'
- source_word: ἔθυσεν
  choice: ti pa
  rationale: Nínú àyíká àsè yìí, ó túmọ̀ sí pípa ẹran fún oúnjẹ ayẹyẹ; ‘pa’ jẹ́ èdè Yorùbá àdánidá, kò sì fi ìtumọ̀ ẹbọ ìsìn kún un.
- source_word: μόσχον τὸν σιτευτόν
  choice: ọmọ màlúù tí a ti bọ́ sanra
  rationale: Èyí ṣàlàyé ẹran ọ̀sìn tí a bọ́ ní àkànṣe kí ó sanra fún àsè, ní èdè tí òǹkàwé òde òní lè lóye.
- source_word: ὑγιαίνοντα
  choice: ní àlàáfíà, láìsí ewu
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ẹni tí ara rẹ̀ le tàbí ẹni tí ó padà láìfarapa; gbólóhùn yìí mú ìtumọ̀ gbígbòòrò tó bá àyíká ìpadàbọ̀ ọmọ náà mu, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tóóró hàn.
- source_word: ἀπέλαβεν
  choice: gba a padà
  rationale: Ó pa èrò gbígba ẹni tí ó ti lọ padà mọ́, dípò gbígba lásán.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: Ó sì sọ fún un pé
  rationale: ‘Sì’ mú ìsopọ̀ δέ hàn láìsọ ọ́ di àtakò líle, ‘pé’ sì ṣàgbékalẹ̀ ọ̀rọ̀ tí a sọ ní tààrà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún, a sì yẹra fún èdè ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
