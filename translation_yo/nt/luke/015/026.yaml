  text: καὶ προσκαλεσάμενος ἕνα τῶν παίδων ἐπυνθάνετο τί ⸀ἂν εἴη ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: yo
  text: Ó sì pe ọ̀kan lára àwọn ìránṣẹ́ wá sí ọ̀dọ̀ rẹ̀, ó béèrè pé, “Kí ni nǹkan wọ̀nyí lè jẹ́?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí èyí túmọ̀ sí.” Ní ti gidi, èdè Gíríìkì sọ pé, “kí ni àwọn nǹkan wọ̀nyí lè jẹ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe … wá sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist middle, ó sì fi hàn pé ó pe ẹni náà wá sí ọ̀dọ̀ ara rẹ̀ kí ó tó béèrè. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣe náà mọ́.
- source_word: παίδων
  choice: àwọn ìránṣẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé παῖς lè túmọ̀ sí ọmọ tàbí ìránṣẹ́, àyíká ilé yìí—níbi tí a ti pe ẹnì kan láti ṣàlàyé ayẹyẹ náà—ṣe àtìlẹ́yìn fún ‘ìránṣẹ́’; ‘ọmọ’ lè ṣi òye sí ọ̀nà mìíràn.
- source_word: ἐπυνθάνετο
  choice: ó béèrè
  rationale: Imperfect middle náà ń tọ́ka sí fífi ìwádìí béèrè. ‘Ó béèrè’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, nígbà tí àkíyèsí imperfect kò lágbára tó bẹ́ẹ̀ nínú àyíká yìí.
- source_word: τί ἂν εἴη ταῦτα
  choice: ohun tí gbogbo nǹkan wọ̀nyí lè jẹ́
  rationale: Èyí pa ọ̀rọ̀ púpọ̀ ταῦτα àti ìtumọ̀ àìdánilójú tàbí potential tí ἂν εἴη mọ́, láì yí i padà sí ìtumọ̀ tí a ti ṣàlàyé jù, bí ‘ohun tí èyí túmọ̀ sí.’
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì gbé àmì àlàyé ẹsẹ̀ sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
