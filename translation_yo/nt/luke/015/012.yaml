  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà ní gbogbogbò: ẹni kékeré náà béèrè ìpín ohun ìní tí ó yẹ fún un, baba sì pín ohun ìní rẹ̀ fún àwọn ọmọ méjèèjì. Ṣùgbọ́n “ẹni tí ó kéré” máa ń tọ́ka sí ìwọ̀n ara ju ọjọ́-orí lọ, “tí ó tọ́ sí mi” kò dára gẹ́gẹ́ bí ọ̀nà Yorùbá fún ohun tí ó yẹ fún ẹni, àti “ohun ìgbé-ayé rẹ̀” kò rọrùn nínú àyíká yìí.'
  naturalness: “Àbúrò wọn” jẹ́ ọ̀nà Yorùbá àdánidá fún νεώτερος nínú àyíká àwọn arákùnrin. “Ìpín ... tí ó yẹ fún mi” dáa ju “tí ó tọ́ sí mi” lọ. “Ohun ìní rẹ̀” jẹ́ ọ̀rọ̀ rọrùn fún ohun tí baba pín; àlàyé ẹsẹ̀-ìsàlẹ̀ ń pa ìtumọ̀ βίον gẹ́gẹ́ bí ohun ìgbẹ́mìíró/ohun ìní mọ́.
  terminology: “Dúkìá” bá οὐσία mu dáadáa nínú ọ̀rọ̀ ogún. “Ohun ìní” nínú gbolohun kejì bá βίον mu ní àyíká náà, láì sọ pé ó jẹ́ “ìgbé-ayé” gangan. “Baba” dára fún ìpè ẹni náà, “Bàbá náà” sì dára fún olùṣe ìṣe tí ó tẹ̀ lé e.
  issues:
