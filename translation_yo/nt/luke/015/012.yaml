revisions:
- from: Ẹni tí ó kéré nínú wọn sì sọ fún baba rẹ̀ pé, “Baba, fún mi ní ìpín dúkìá tí ó tọ́ sí mi.”[a] Bàbá náà sì pín ohun ìgbé-ayé rẹ̀ láàárín wọn.[b]
  to: Àbúrò wọn sì sọ fún baba rẹ̀ pé, “Baba, fún mi ní ìpín dúkìá tí ó yẹ fún mi.”[a] Bàbá náà sì pín ohun ìní rẹ̀ fún wọn.[b]
  rationale: Àtúnṣe náà mú ọ̀rọ̀ Yorùbá náà di adayeba síi, pàápàá fún ìyàtọ̀ ọjọ́-orí nínú νεώτερος àti ìpín tí ó yẹ fún ẹni nínú ἐπιβάλλον. Ó tún lo “ohun ìní” fún βίον nínú ọ̀rọ̀ àlàyé yìí, nígbà tí ẹsẹ̀-ìsàlẹ̀ ń tọ́jú ìfẹ̀ẹ́ ìtumọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ohun ìgbẹ́mìíró tàbí ohun ìní. Àmì ẹsẹ̀-ìsàlẹ̀ méjèèjì wà ní ibi tó yẹ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:22Z'
