  - severity: medium
    issue: “ìpín dúkìá tí ó tọ́ sí mi”
    rationale: “Tọ́ sí” kì í ṣe ọ̀nà tó wọ́pọ̀ láti sọ ìpín tí ó yẹ fún ẹnikan nínú Yorùbá. “Tí ó yẹ fún mi” mú ἐπιβάλλον hàn ní kedere àti ní ìbámu pẹ̀lú ìlò Yorùbá.
  - severity: low
    issue: “ohun ìgbé-ayé rẹ̀”
    rationale: Ó jẹ́ gbolohun tí kò wọ́pọ̀, ó sì lè dà bí ìyè baba fúnra rẹ̀. “Ohun ìní rẹ̀,” pẹ̀lú àlàyé βίον nínú ẹsẹ̀-ìsàlẹ̀, ṣe kedere pé ohun ìní tàbí ohun ìgbẹ́mìíró ni a pín.
