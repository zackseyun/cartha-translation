  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: yo
  text: Àbúrò wọn sì sọ fún baba rẹ̀ pé, “Baba, fún mi ní ìpín dúkìá tí ó yẹ fún mi.”[a] Bàbá náà sì pín ohun ìní rẹ̀ fún wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ìpín ohun ìní tí ó jẹ́ tèmi” tàbí “ìpín tí ó yẹ kí n rí.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ìgbé-ayé rẹ̀” tàbí “ohun tí ó fi ń gbé” (βίον); níhìn-ín, ó tọ́ka sí ohun ìní baba náà tàbí ohun tí ó fi ń gbé ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: ẹni tí ó kéré
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù afiwéra tí a lò bí orúkọ, ìyẹn ‘ẹni tí ó kéré’; àyíká ọ̀rọ̀ fi hàn pé ọmọ ni, ṣùgbọ́n ‘ọmọ’ kò sí ní kedere nínú gbólóhùn Gíríìkì yìí.
- source_word: δός μοι
  choice: fún mi ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti tààrà láti sọ àṣẹ tàbí ìbéèrè náà.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: ìpín ... tí ó tọ́ sí mi
  rationale: Ó túmọ̀ sí ìpín tí ó yẹ kí ẹni náà rí tàbí tí ó jẹ́ tirẹ̀; gbólóhùn aláfarawé náà pa ìtumọ̀ ẹ̀tọ́ sí ìpín mọ́.
- source_word: οὐσία
  choice: dúkìá
  rationale: Nínú àyíká ogún yìí, ọ̀rọ̀ náà tọ́ka sí ohun ìní tàbí dúkìá; ‘dúkìá’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ipò náà mu.
- source_word: διεῖλεν
  choice: pín
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún pípín tàbí pínpín ohun kan fún àwọn ènìyàn.
- source_word: αὐτοῖς
  choice: láàárín wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gírámà rẹ̀ ni ‘fún wọn,’ ohun tí a ń ṣe ni pípín ohun ìní sí àwọn méjèèjì; ‘láàárín wọn’ sọ èyí ní Yorùbá àdánidá.
- source_word: βίον
  choice: ohun ìgbé-ayé rẹ̀
  rationale: βίος lè túmọ̀ sí ìgbé-ayé, ohun ìní, tàbí ohun tí ènìyàn fi ń gbé; yíyan ‘ohun ìgbé-ayé’ pa ìsopọ̀ mọ́ ohun tí baba fi ń gbé ayé mọ́, dípò kí a sọ ọ́ di dúkìá lásán.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Ẹni tí ó kéré’ pa bí Gíríìkì kò ṣe sọ ‘ọmọ’ ní kedere mọ́; ‘Bàbá náà’ mú olùṣe ìṣe tó tẹ̀ lé e ṣe kedere ní Yorùbá láì yí ìtumọ̀ padà. Àwọn àmì ohùn ni a fi sí ibi tí ó bá ti yẹ.
