  to: Ní ọjọ́ díẹ̀ lẹ́yìn náà[a], ọmọkùnrin àbúrò náà kó gbogbo ohun tirẹ̀ jọ, ó sì lọ sí ilẹ̀ kan tí ó jìnnà. Níbẹ̀, ó fi dúkìá rẹ̀[b] ṣòfò, ó sì ń gbé ìgbé ayé láìníjàánu[c].
  rationale: A rọ́pò àpèjúwe tí ó lè túmọ̀ sí àìfẹ́sí pẹ̀lú èdè tí ó fi ìwà aláìníjàánu àti oníṣòfò hàn. A tún jẹ́ kí ìṣe lílọ náà kúrú, síbẹ̀ ó ṣì bá ἀπεδήμησεν àti “sí ilẹ̀ kan tí ó jìnnà” mu. Àwọn àmì ìsàlẹ̀ wà ní ìbámu pẹ̀lú àwọn àmì nínú ẹsẹ náà.
