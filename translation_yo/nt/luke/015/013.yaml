id: LUK.15.13
reference: Luke 15:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: yo
  text: Ní ọjọ́ díẹ̀ lẹ́yìn náà[a], ọmọkùnrin àbúrò náà kó gbogbo ohun tirẹ̀ jọ, ó sì lọ sí ilẹ̀ kan tí ó jìnnà. Níbẹ̀, ó fi dúkìá rẹ̀[b] ṣòfò, ó sì ń gbé ìgbé ayé láìníjàánu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn ọjọ́ tí kò pọ̀.” Bí ọ̀rọ̀ Gíríìkì ṣe rí gan-an ni “lẹ́yìn ọjọ́ tí kò pọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun-ìní rẹ̀” tàbí “ọrọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ìgbé ayé oníṣòfò” tàbí “ní ìgbé ayé aláìníjàánu.” Ẹsẹ yìí kò sọ ẹ̀ṣẹ̀ kan pàtó; ó ń ṣàpèjúwe ìgbé ayé oníṣòfò, aláìníjàánu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Ní ọjọ́ díẹ̀ lẹ́yìn náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ lẹ́yìn ọjọ́ tí kò pọ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ti ọ̀rọ̀ Gíríìkì hàn.
- source_word: συναγαγὼν πάντα
  choice: kó gbogbo ohun tirẹ̀ jọ
  rationale: Ó pa ìṣe tí ó ṣáájú ìrìn-àjò mọ́, ó sì fi agbára συνάγω, ‘kó jọ,’ hàn láì sọ ní pàtó pé ó ta ohun-ìní náà.
- source_word: ὁ νεώτερος υἱός
  choice: ọmọkùnrin àbúrò náà
  rationale: Ní àyíká tí ọmọ méjì wà, ‘ọmọkùnrin àbúrò’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ọmọ tí ó kéré jù.
- source_word: ἀπεδήμησεν
  choice: rin ìrìn àjò lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ kúrò sí ibòmíràn; gbólóhùn yìí bá ọ̀rọ̀ tí ó tẹ̀ lé e nípa ilẹ̀ jíjìnnà mu, láì fi ‘ilẹ̀ òkèèrè’ kún un ju bó ṣe yẹ lọ.
- source_word: εἰς χώραν μακράν
  choice: sí ilẹ̀ kan tí ó jìnnà
  rationale: ‘Ilẹ̀’ lè túmọ̀ sí agbègbè tàbí orílẹ̀-èdè, bí χώρα ṣe ní ìwọ̀n ìtumọ̀ gbígbòòrò; ‘tí ó jìnnà’ ṣàfihàn μακράν.
- source_word: διεσκόρπισεν
  choice: fi ... ṣòfò
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìpilẹ̀ ni ‘tú ká,’ nípa dúkìá ó túmọ̀ sí lílò ó ní ọ̀nà tí kò bójú mu títí ó fi tán.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: dúkìá rẹ̀
  rationale: ‘Dúkìá’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun-ìní tàbí ọrọ̀ tí ènìyàn ní, kò sì dín οὐσία kù sí owó nìkan.
- source_word: ζῶν ἀσώτως
  choice: ó ń gbé ìgbé ayé aláìbìkítà
  rationale: Ó ṣàlàyé irú ìgbé ayé tí ó bá fífi dúkìá ṣòfò lọ, láì fi ẹ̀ṣẹ̀ kan pàtó—gẹ́gẹ́ bí ìwà àgbèrè—sí inú ẹsẹ náà.
theological_decisions:
- issue: Bóyá ἀσώτως ń tọ́ka sí irú ẹ̀ṣẹ̀ kan pàtó
  choice: ìgbé ayé aláìbìkítà
  alternative: ìgbé ayé ìwà àgbèrè
  rationale: Ẹsẹ yìí sọ ní gbogbogbò nípa ìgbé ayé tí kò ní ìkóra-ẹni-níjàánu, kò sì dárúkọ ìwà àgbèrè tàbí ẹ̀ṣẹ̀ kan pàtó; nítorí náà, a kò gbọ́dọ̀ fi ìtumọ̀ tóóró sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìṣètò gbólóhùn méjì mú kí ẹsẹ gígùn náà rọrùn láti kà, láì yí ìbáṣepọ̀ àwọn ìṣe inú orísun padà.
