  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: yo
  text: Ó sì ń yán hànhàn láti fi àwọn èèpo èso igi kárọ́bù tí àwọn ẹlẹ́dẹ̀ ń jẹ kún ikùn rẹ̀[a], kò sì sí ẹni tí ń fún un ní ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn èèpo”; ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí àwọn èèpo èso igi kárọ́bù, èyí tí a sábà máa ń fi bọ́ ẹran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: ń yán hànhàn
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìfẹ́ líle tí ó ń bá a lọ hàn; “ń yán hànhàn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́kúfẹ̀ẹ́ líle nítorí ebi.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: láti ... kún inú rẹ̀
  rationale: Èyí pa àwòrán gidi ti fífi oúnjẹ kún ikùn mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere láì túmọ̀ ọ́ sí “tẹ́ ẹ lọ́rùn.”
- source_word: ἀπὸ τῶν κερατίων
  choice: fi èèpo èso kárọ́bù ... kún
  rationale: Ní ìbámu pẹ̀lú lílo Yorùbá, “fi ... kún” sọ ohun tí ó fẹ́ fi kún inú rẹ̀; κεράτια tọ́ka pàtó sí èèpo èso igi kárọ́bù.
- source_word: οἱ χοῖροι
  choice: àwọn ẹlẹ́dẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀, tí ó sì ṣe kedere fún pigs.
- source_word: ἤσθιον
  choice: ń jẹ
  rationale: Àmì “ń” mú ìṣe tí ó ń lọ lọ́wọ́ inú ọ̀rọ̀-ìṣe aláìpé Gíríìkì náà jáde.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: kò sí ẹni tí ó fún un ní ohunkóhun
  rationale: Ó sọ àìsí ẹni tí ó pèsè ohunkóhun fún un ní Yorùbá àdánidá; “ohunkóhun” mú ohun tí Gíríìkì fi sílẹ̀ láìsọ jáde.
