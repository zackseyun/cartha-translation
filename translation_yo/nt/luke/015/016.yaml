  source_fidelity: Ìtumọ̀ náà mú ìfẹ́kúfẹ̀ẹ́ tó ń bá a lọ, fífi ohun kan kún ikùn, àti ìṣe àwọn ẹlẹ́dẹ̀ tí ó ń lọ lọ́wọ́ hàn dáadáa. Ṣùgbọ́n “ṣùgbọ́n” yí ìsopọ̀ καὶ (‘àti’) padà sí ìtakò tí kò sí nínú Gíríìkì, àti “ó fún un” kò fi àbala aláìpé ἐδίδου hàn kedere bí “ń fún un.” “Ikùn” sì dáa ju “inú” lọ níbí, nítorí κοιλία túmọ̀ sí ikùn/stomach ní àyíká ebi yìí.
  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé, ó sì rọrùn láti ka. “Ń yán hànhàn” yẹ fún ìfẹ́ líle nítorí ebi. Àtúnṣe kékeré sí “kò sì sí ẹni tí ń fún un ní ohunkóhun” jẹ́ èdè àdánidá, ó sì pa ìtumọ̀ ìṣe tí ń tẹ̀síwájú mọ́.
  terminology: “Àwọn ẹlẹ́dẹ̀” jẹ́ ọ̀rọ̀ tí ó bójú mu fún χοῖροι. “Àwọn èèpo èso igi kárọ́bù” sọ κεράτια di mímọ̀, ó sì dá iye púpọ̀ ọ̀rọ̀ Gíríìkì náà dúró. A lo “ikùn” fún κοιλία, láì sọ ọ́ di ìtumọ̀ àfiwé.
