id: LUK.15.29
reference: Luke 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: yo
  text: Ṣùgbọ́n ó dá baba rẹ̀ lóhùn pé, “Wò ó, ọdún púpọ̀ ni mo ti ń sìn ọ[a], èmi kò sì rú àṣẹ rẹ rí; síbẹ̀, ìwọ kò fún mi ní ọmọ ewúrẹ́ kan pàápàá láti bá àwọn ọ̀rẹ́ mi ṣe àjọyọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ti ń ṣe iṣẹ́ ẹrú fún ọ.” Ọ̀rọ̀ Gíríìkì δουλεύω lè túmọ̀ sí “sìn,” ṣùgbọ́n ó tún lè ní ìtumọ̀ líle sí i pé “ṣe iṣẹ́ ẹrú.” Níhìn-ín, ìtumọ̀ líle náà lè fi ìkorò nínú ọ̀rọ̀ ọmọ àgbà náà hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: ó dá baba rẹ̀ lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fèsì sí baba rẹ̀, láì tún ‘dáhùn, ó sì wí’ ṣe lásán.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ tàbí fífi ohun tí yóò tẹ̀ lé hàn mọ́, ó sì bá èdè Yorùbá òde òní mu.
- source_word: τοσαῦτα ἔτη
  choice: ọ̀pọ̀lọpọ̀ ọdún
  rationale: Ó fi gígùn àkókò tí ọmọ náà ń tẹnumọ́ hàn ní Yorùbá àdánidá.
- source_word: δουλεύω σοι
  choice: ni mo ti fi ń ṣe bí ẹrú fún ọ
  rationale: δουλεύω lè túmọ̀ sí sísìn, ṣùgbọ́n ó tún ní agbára iṣẹ́ ẹni tí ó wà lábẹ́ ẹlòmíràn. ‘Ṣe bí ẹrú’ mú ìkorò inú ọmọ àgbà náà jáde láì sọ pé ó jẹ́ ẹrú ní ti gidi.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: èmi kò sì rú àṣẹ rẹ rí
  rationale: ‘Rú àṣẹ’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ṣíṣe lòdì sí àṣẹ; ‘rí’ mú οὐδέποτε jáde.
- source_word: ἔδωκας ἔριφον
  choice: ìwọ kò fún mi ní ọmọ ewúrẹ́ kan pàápàá
  rationale: ἔριφος ni ọmọ ewúrẹ́; ‘kan pàápàá’ mú ẹ̀dùn ọkàn àti fífi ẹ̀bùn náà kéré hàn nínú ẹ̀sùn rẹ̀.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: láti bá àwọn ọ̀rẹ́ mi ṣe àjọyọ̀
  rationale: Ó sọ ète gbólóhùn ἵνα àti ayọ̀ àjọṣe tí εὐφρανθῶ ní nínú àyíká àsè yìí ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe tú δουλεύω nínú ọ̀rọ̀ ọmọ àgbà
  choice: ṣe bí ẹrú fún ọ
  alternative: ń sìn ọ
  rationale: Ọ̀rọ̀ náà kò fi hàn pé ọmọ náà jẹ́ ẹrú ní ti gidi; ó ń ṣàfihàn bí ó ṣe ń wo iṣẹ́ rẹ̀ pẹ̀lú ìbínú àti ìkorò. Ìtumọ̀ yìí pa agbára ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ rirọ̀ ‘sìn’ hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforígbárí ọ̀rọ̀ ọmọ àgbà ni a pa mọ́ nípa ‘Wò ó,’ ‘ṣe bí ẹrú,’ àti ‘kan pàápàá,’ ṣùgbọ́n èdè náà ṣì jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye.
