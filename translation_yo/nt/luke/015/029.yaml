review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the reply, the long duration, the elder son's claimed obedience, the denied young goat, and the purpose of celebrating with friends. However, “ni mo ti fi ń ṣe bí ẹrú fún ọ” is not idiomatic Yoruba in this construction and turns δουλεύω into an explicit simile. In this context, “ń sìn ọ” is the direct, natural rendering; the stronger connotation may be retained as a lexical alternative in the note.
  naturalness: The revision uses standard modern Yoruba and removes the awkward use of fi. “Ọdún púpọ̀ ni mo ti ń sìn ọ” is natural and retains the elder son's emphatic complaint.
  terminology: “Sìn” appropriately renders δουλεύω without asserting that the son was literally or figuratively a slave. The footnote preserves the stronger possible nuance, “ṣe iṣẹ́ ẹrú,” while identifying it as an alternative rather than imposing it on the main text. “Ọmọ ewúrẹ́” and “rú àṣẹ” are clear and suitable.
  issues:
  - severity: medium
    issue: The phrase “ọ̀pọ̀lọpọ̀ ọdún ni mo ti fi ń ṣe bí ẹrú fún ọ” is structurally unnatural and over-specifies the metaphor.
    rationale: The particle fi is not naturally used here without an appropriate instrumental/complement structure, and “ṣe bí ẹrú” adds a simile not explicitly present in the Greek. δουλεύω can be rendered naturally as “sìn” in the main text, with its stronger sense noted.
  revised_text: Ṣùgbọ́n ó dá baba rẹ̀ lóhùn pé, “Wò ó, ọdún púpọ̀ ni mo ti ń sìn ọ[a], èmi kò sì rú àṣẹ rẹ rí; síbẹ̀, ìwọ kò fún mi ní ọmọ ewúrẹ́ kan pàápàá láti bá àwọn ọ̀rẹ́ mi ṣe àjọyọ̀.”
