review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn èrò pàtàkì Gíríìkì mọ́: ọkùnrin aṣojú kan, àgùntàn ọgọ́rùn-ún, èyí kan tí ó sọnù, mọ́kàndínlọ́gọ́rùn-ún tí a fi sílẹ̀, ìlọ láti wá èyí tí ó sọnù, àti ìwá títí a fi rí i. Síbẹ̀, a tún ọ̀rọ̀ ìbéèrè àsọyé náà ṣe díẹ̀ kí ìsopọ̀ ‘fi ... sílẹ̀ ... lọ wá’ lè ṣàn dáadáa ní Yorùbá. ‘Ilẹ̀ pápá’ tún bá yíyan English POB ‘open country’ mu dáadáa, láìpa ààyè ìtumọ̀ ἐρήμῳ mọ́.'
  naturalness: ‘Ta ni ọkùnrin láàárín yín’ lè yéni, ṣùgbọ́n ‘Ọkùnrin wo ni láàárín yín’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì sún mọ́ ìbéèrè àpẹẹrẹ náà. ‘Tí kì í fi ... sílẹ̀, kí ó sì lọ’ darí ìṣe kejì sí ìṣesí àṣẹ/ìfẹ́; ‘tí kò ní fi ... sílẹ̀, kí ó sì lọ wá’ jẹ́ ìlànà ìbéèrè ìrònú tó dájú jù. A yọ ‘yòókù’ kúrò nítorí mọ́kàndínlọ́gọ́rùn-ún ti sọ iye tí ó kù tán.
  terminology: ‘Ọkùnrin,’ ‘àgùntàn,’ ‘sọnù,’ àti ‘lọ wá’ bá ìforúkọsílẹ̀ àti ìtumọ̀ ọ̀rọ̀ orísun mu. ‘Ilẹ̀ pápá’ jẹ́ ìtumọ̀ àdánidá fún ààyè agbo-ẹran nínú ọ̀rọ̀ yìí; àlàyé ìsàlẹ̀ ń pa ‘ìgbẹ́’ àti ‘ibi tí ènìyàn kò gbé’ mọ́ gẹ́gẹ́ bí àwọn aṣàyàn.
  issues:
  - severity: medium
    issue: Ìsopọ̀ ọ̀rọ̀-ìṣe ‘tí kì í fi ... sílẹ̀, kí ó sì lọ wá’ kò rọrùn tó.
    rationale: ‘Kí ó’ sábà máa ń ṣiṣẹ́ gẹ́gẹ́ bí ìfẹ́, àṣẹ, tàbí ète. Nínú ìbéèrè àsọyé yìí, ‘tí kò ní fi ... sílẹ̀, kí ó sì lọ wá’ ń sọ ìṣe tí a retí nínú àpẹẹrẹ náà ní ọ̀nà tó ṣe kedere.
  - severity: low
    issue: ‘Yòókù’ lẹ́yìn ‘mọ́kàndínlọ́gọ́rùn-ún’ jẹ́ àfikún tí kò pọndandan.
    rationale: Nọ́ńbà náà fúnra rẹ̀ ti túmọ̀ sí mẹ́rìndínlọ́gọ́rùn-ún—ìyẹn, àgùntàn mọ́kàndínlọ́gọ́rùn-ún tí ó ṣẹ́kù nínú ọgọ́rùn-ún.
  - severity: low
    issue: ‘Ìgbẹ́’ gẹ́gẹ́ bí yíyan ọ̀rọ̀ àkọ́kọ́ lè fa àwòrán igbó dípò ilẹ̀ gbangba fún agbo-ẹran.
    rationale: ἐρήμῳ ní ààyè ìtumọ̀ púpọ̀; ‘ní ilẹ̀ pápá’ jẹ́ ìbámu tó dára pẹ̀lú yíyan English POB ‘in the open country,’ nígbà tí àlàyé ìsàlẹ̀ ń dáàbò bo aṣàyàn ‘ìgbẹ́’.
