id: LUK.15.4
reference: Luke 15:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: yo
  text: “Ọkùnrin wo ni láàárín yín tí ó ní ọgọ́rùn-ún àgùntàn, tí ọ̀kan nínú wọn sì sọnù, tí kò ní fi mọ́kàndínlọ́gọ́rùn-ún náà sílẹ̀ ní ilẹ̀ pápá[a], kí ó sì lọ wá èyí tí ó sọnù títí yóò fi rí i?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìgbẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbẹ́, ilẹ̀ pápá, tàbí ibi tí ènìyàn kò gbé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Ta ni ọkùnrin láàárín yín
  rationale: Ó pa àpẹẹrẹ ọkùnrin kan mọ́ gẹ́gẹ́ bí Gíríìkì ṣe fi ἄνθρωπος akọ ẹyọ kan hàn, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìbéèrè àsọyé ní Yorùbá.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: tí ó ní ọgọ́rùn-ún àgùntàn
  rationale: Ìtumọ̀ tààrà, tó sì bá ìṣàn gbólóhùn Yorùbá mu.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: tí ọ̀kan nínú wọn sì sọnù
  rationale: Èyí sọ pé àgùntàn kan wà ní ipò sísọnù láìjẹ́ kí ó dà bí ẹni pé ọkùnrin náà mọ̀ọ́mọ̀ pa á run; ó tún jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: tí kì í fi mọ́kàndínlọ́gọ́rùn-ún yòókù sílẹ̀
  rationale: Ìbéèrè òdì àsọyé náà ń retí ìdáhùn rere; “kì í” fi ìṣe tí a sábà retí hàn ní Yorùbá.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní ìgbẹ́
  rationale: “Ìgbẹ́” lè tọ́ka sí ilẹ̀ tí kò sí ìlú tàbí ibi ìta gbangba tí a kò gbin, ó sì pa ààyè ìtumọ̀ ἔρημος mọ́. Àlàyé ìsàlẹ̀ sọ pé ó tún lè túmọ̀ sí ilẹ̀ pápá.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: kí ó sì lọ wá èyí tí ó sọnù
  rationale: “lọ wá” fi ìlọ sí ọ̀dọ̀ àgùntàn náà àti ète láti ṣàwárí rẹ̀ hàn ní kedere, ní Yorùbá àdánidá.
- source_word: ἕως εὕρῃ αὐτό
  choice: títí yóò fi rí i
  rationale: Ó pa ìwọ̀n àkókò “títí” àti ìrí àgùntàn náà mọ́ ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Èdè akọ aṣojú nínú ìbéèrè àkàwé
  choice: Pa “ọkùnrin” mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: ẹni
  rationale: Gíríìkì lo ἄνθρωπος ní akọ ẹyọ gẹ́gẹ́ bí àpẹẹrẹ aṣojú. “Ọkùnrin” pa irú èdè orísun náà mọ́ láìsọ pé àpẹẹrẹ náà kan àwọn ọkùnrin nìkan.
- issue: Ibi tí a fi àwọn àgùntàn mọ́kàndínlọ́gọ́rùn-ún sílẹ̀
  choice: ní ìgbẹ́
  alternative: ní ilẹ̀ pápá
  rationale: ἔρημος ní ààyè ìtumọ̀ tó lè jẹ́ aginjù, ibi tí ènìyàn kò gbé, tàbí ilẹ̀ ìta gbangba. A kò fi ọ̀rọ̀ kún un pé ibi náà léwu tàbí pé a kọ àwọn àgùntàn náà sílẹ̀ pátápátá.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ìbéèrè àsọyé Yorùbá “Ta ni ... tí kì í ...?” láti pa ìdáhùn rere tí ọ̀rọ̀ Gíríìkì ń retí mọ́.
