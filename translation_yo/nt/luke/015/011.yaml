  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: yo
  text: Ó sì wí pé, “Ọkùnrin kan ní ọmọkùnrin méjì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Ó sì wí pé
  rationale: Aorist Εἶπεν introduces the next part of Jesus’ discourse, while δέ marks a mild continuation or transition. “Ó sì wí pé” is natural, dignified Yorùbá and does not overstate contrast or sequence.
- source_word: Ἄνθρωπός τις
  choice: Ọkùnrin kan
  rationale: “Ọkùnrin” accurately identifies the male referent, and postposed “kan” naturally represents the indefinite τις without making him identifiable.
- source_word: εἶχεν
  choice: ní
  rationale: In this parabolic setting, Yorùbá “ní” idiomatically states the man’s circumstance of having two sons; Yoruba does not require an overt past form here.
- source_word: δύο
  choice: méjì
  rationale: The cardinal numeral is naturally placed after the noun in Yorùbá.
- source_word: υἱούς
  choice: ọmọkùnrin
  rationale: This preserves the specifically male meaning “sons,” rather than using the broader “children.”
theological_decisions:
- issue: Generic or slightly individuated force of Ἄνθρωπός τις
  choice: Ọkùnrin kan
  alternative: Ọkùnrin kan pàtó
  rationale: “Ọkùnrin kan” is the ordinary Yorùbá way to introduce an unidentified male character and adequately reflects τις. Adding “pàtó” would sound emphatic and imply a degree of specificity not required by the Greek.
translation_notes:
  register: Standard Yorùbá with full tone marks where natural. The wording is current, clear, and dignified. “Ó sì wí pé” preserves the mild discourse transition, while “ọmọkùnrin méjì” retains the gender-specific familial detail.
