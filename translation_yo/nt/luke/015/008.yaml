translation_notes:
  register: A lo Yorùbá tí ó ṣe déédéé, tí ó lọ́lá, tí ó sì yé òǹkàwé òde òní. Ìbéèrè àsọyé náà ń retí pé obìnrin náà yóò ṣe gbogbo ohun tí a mẹ́nu kàn, a sì pa àwọ̀ ìtumọ̀ ‘pẹ̀lú ìṣọ́ra/taratara’ mọ́ nínú àlàyé ìsàlẹ̀.
