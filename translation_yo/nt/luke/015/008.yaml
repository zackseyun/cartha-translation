source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: yo
  text: Tàbí obìnrin wo tí ó ní dírákímà mẹ́wàá[a], tí ó bá pàdánù dírákímà kan, ṣé kì yóò tan fìtílà, gbá ilé náà, kí ó sì fi taratara wá a[b] títí yóò fi rí i?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dírákímà jẹ́ owó fàdákà Gíríìkì kan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “farabalẹ̀ wá a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Àbí
  rationale: Ó so àpẹẹrẹ yìí mọ́ èyí tí ó ṣáájú, ó sì bá ìbéèrè àfiwé mu ní Yorùbá.
- source_word: τίς γυνὴ
  choice: obìnrin wo
  rationale: Ó pa ìrísí ìbéèrè àsọyé Gíríìkì mọ́ láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un.
- source_word: δραχμὰς
  choice: owó dírákímà
  rationale: A pa orúkọ pàtó owó Gíríìkì náà mọ́ fún ìtàn àti àṣà, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ἔχουσα δέκα
  choice: tí ó ní owó dírákímà mẹ́wàá
  rationale: Ìtumọ̀ yìí ṣe àfihàn gbólóhùn aláápọn Gíríìkì ní ọ̀nà tí ó ṣe déédéé ní Yorùbá.
- source_word: ἐὰν ἀπολέσῃ
  choice: tí ó bá sọ ... nù
  rationale: ‘Tí ó bá’ mú ipò àídájú gbogbogbò tí ἐάν pẹ̀lú subjunctive ń fi hàn jáde.
- source_word: δραχμὴν μίαν
  choice: dírákímà kan
  rationale: Ó pa orúkọ owó náà àti ìtẹnumọ́ pé ẹyọ kan ṣoṣo ló sọnù mọ́.
- source_word: οὐχὶ
  choice: ṣé kì yóò
  rationale: Ó dá ìbéèrè àsọyé tí ń retí ìdáhùn rere sílẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: ἅπτει λύχνον
  choice: tan fìtílà
  rationale: Ó túmọ̀ ìṣe títan ohun ìmọ́lẹ̀ ilé kedere, láìfi article tí kò sí nínú Gíríìkì kún un.
- source_word: σαροῖ τὴν οἰκίαν
  choice: gbá ilé náà
  rationale: ‘Gbá ilé’ ni ọ̀nà Yorùbá àdánidá fún fífi ìgbálẹ̀ fọ ilé; ‘náà’ tọ́ka sí ilé obìnrin náà nínú àwòrán ìtàn.
- source_word: ζητεῖ ἐπιμελῶς
  choice: farabalẹ̀ wá a
  rationale: Ó mú ìtumọ̀ wíwá pẹ̀lú àkíyèsí àti ìsapá jáde ní èdè Yorùbá ti òde òní.
- source_word: ἕως οὗ εὕρῃ
  choice: títí yóò fi rí i
  rationale: Ó fi ibi tí ìwá náà parí hàn, ó sì mú ohun tí obìnrin náà rí ṣe kedere láti inú àyíká ọ̀rọ̀.
