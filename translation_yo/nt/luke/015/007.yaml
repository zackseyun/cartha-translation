  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì Gíríìkì mọ́: ìkéde taara náà, ìsopọ̀ οὕτως pẹ̀lú àkàwé tó ṣáájú, ayọ̀ tí yóò wà ní ọ̀run, ẹlẹ́ṣẹ̀ kan tí ó ronúpìwàdà, àti ìfiwéra pẹ̀lú àwọn olódodo mẹ́rìnlélọ́gọ́rùn-ún-dín-ọ̀kan. Kò dárúkọ ẹni tí ń yọ̀, bẹ́ẹ̀ sì ni kò yan ìtumọ̀ ẹ̀gàn fún δικαίοις. Àtúnṣe kékeré kan nílò kí nọ́ńbà ọ̀rọ̀ náà bá aṣojú-ọrọ̀ ''wọn'' mu, àti kí àlàyé àfikún [a] máa fúnni ní àṣàyàn tó tọ́ fún οὕτως.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa tó dára. Síbẹ̀, 'olódodo mọ́kàndínlọ́gọ́rùn-ún tí wọn' darapọ̀ orúkọ ẹyọ kan pẹ̀lú aṣojú-ọrọ̀ púpọ̀. 'Àwọn olódodo mọ́kàndínlọ́gọ́rùn-ún tí wọn' jẹ́ ìṣọ̀kan gírámà tí ó mọ́gbọ́n dání.
  terminology: '''Ronúpìwàdà,'' ''ẹlẹ́ṣẹ̀,'' àti ''olódodo'' jẹ́ àwọn ọ̀rọ̀ ìsìn Yorùbá tó fìdí múlẹ̀, tí wọ́n sì bá μετανοοῦντι, ἁμαρτωλῷ, àti δικαίοις mu. A fi ''olódodo'' sílẹ̀ láìsọ pé wọ́n jẹ́ olódodo ní tòótọ́ tàbí pé ọ̀rọ̀ ẹ̀gàn ni.'
