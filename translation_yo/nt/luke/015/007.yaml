id: LUK.15.7
reference: Luke 15:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: yo
  text: Mo sọ fún yín pé, lọ́nà kan náà[a], ayọ̀ yóò wà ní ọ̀run nítorí ẹlẹ́ṣẹ̀ kan tí ó ronúpìwàdà, ju nítorí àwọn olódodo mọ́kàndínlọ́gọ́rùn-ún tí wọn kò nílò ìrònúpìwàdà lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “bẹ́ẹ̀ ni” tàbí “bẹ́ẹ̀ náà.” Gbólóhùn náà so ayọ̀ ọ̀run pọ̀ mọ́ kókó àkàwé tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì sọ pé “àwọn olódodo.” A lè lóye rẹ̀ ní tààrà, tàbí gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn nínú àyíká náà; ìtumọ̀ yìí kò pinnu ọ̀nà kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín pé
  rationale: Ọ̀rọ̀ ìṣáájú yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ hàn, ó sì pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́.
- source_word: οὕτως
  choice: lọ́nà kan náà
  rationale: Ó so ayọ̀ ní ọ̀run pọ̀ mọ́ kókó àkàwé tó ṣáájú, ó sì túmọ̀ ìfiwéra náà ní Yorùbá kedere.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: ayọ̀ yóò wà ní ọ̀run
  rationale: Ó pa ìgbà ọjọ́ iwájú àti ibi tí ayọ̀ náà wà mọ́ láìfi Ọlọ́run tàbí àwọn áńgẹ́lì kún un gẹ́gẹ́ bí olùṣe.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: nítorí ẹlẹ́ṣẹ̀ kan
  rationale: Pẹ̀lú χαρά, ἐπί ń tọ́ka sí ohun tí ó fa ayọ̀; “nítorí” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu ní àyíká yìí.
- source_word: μετανοοῦντι
  choice: tí ó ronúpìwàdà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá àti tí a mọ̀ dáadáa fún ẹni tí ó yí ọkàn àti ìtọ́sọ́nà rẹ̀ padà; gbólóhùn ìbátan náà pa ipa participle mọ́.
- source_word: ἢ
  choice: ju ... lọ
  rationale: Nínú ìṣètò ìfiwéra yìí, “ju ... lọ” ni ọ̀nà Yorùbá tó ṣe kedere jù fún “than,” kì í ṣe “tàbí.”
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: olódodo mọ́kàndínlọ́gọ́rùn-ún
  rationale: Adjective Gíríìkì náà dúró fún àwọn ènìyàn; “olódodo” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ, kò sì pinnu bóyá ọ̀rọ̀ náà jẹ́ tààrà tàbí àfiwé ẹ̀gàn.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: tí wọn kò nílò ìrònúpìwàdà
  rationale: Ó sọ ọ̀rọ̀ orúkọ μετανοίας ní kedere, ó sì jẹ́ Yorùbá àdánidá ju lílo arọ́pò-orúkọ tí ìtumọ̀ rẹ̀ lè ṣókùnkùn lọ.
theological_decisions:
- issue: Bóyá “olódodo” ń tọ́ka sí àwọn ẹni tí wọ́n jẹ́ olódodo ní tòótọ́ tàbí sí àwọn tó ka ara wọn sí olódodo
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “olódodo,” láìfi àmì àyọlò tàbí àlàyé ẹ̀gàn sínú ọ̀rọ̀ àkọ́kọ́.
  alternative: “àwọn tí wọ́n rò pé àwọn jẹ́ olódodo”
  rationale: δικαίοις túmọ̀ sí “olódodo,” kò sì sí àmì gírámà tó fi ẹ̀gàn hàn ní kedere. Ìtumọ̀ yẹ kí ó pa ìṣòro ìtumọ̀ inú àyíká náà mọ́.
- issue: Ta ni ó ń yọ̀ ní ọ̀run
  choice: Sọ pé “ayọ̀ yóò wà ní ọ̀run,” láìdárúkọ ẹni tó ń yọ̀.
  alternative: “Ọlọ́run yóò yọ̀” tàbí “àwọn áńgẹ́lì yóò yọ̀”
  rationale: Ẹsẹ yìí sọ ibi tí ayọ̀ yóò wà, kò sọ olùṣe náà ní tààrà. Fífi Ọlọ́run tàbí àwọn áńgẹ́lì kún un yóò kọjá ohun tí Gíríìkì sọ.
- issue: Ìtumọ̀ μετανοοῦντι
  choice: “tí ó ronúpìwàdà”
  alternative: “tí ó yí èrò rẹ̀ padà”
  rationale: “Ronúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó ní ìtumọ̀ yíyí ọkàn àti ìtọ́sọ́nà padà ní àyíká ẹ̀ṣẹ̀; kò yẹ kí a dín un kù sí ìyípadà èrò lasan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. Àmì [a] wà lẹ́gbẹ̀ẹ́ οὕτως, àmì [b] sì tẹ̀ lé gbogbo gbólóhùn tó ní “olódodo” kí àlàyé náà má bà a dá ìṣàn ọ̀rọ̀ dúró.
