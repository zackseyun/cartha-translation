  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn èrò pàtàkì Gíríìkì náà mọ́: ìpè onífẹ̀ẹ́ τέκνον, ìdúró pẹ̀lú baba nígbà gbogbo, àti pé gbogbo ohun-ìní baba jẹ́ ti ọmọ náà. Ṣùgbọ́n ipò “sì” nínú gbolóhùn kejì lè dà bí ẹni pé ó ń tẹnumọ́ pé àwọn ohun náà ‘jẹ́ tèmi pẹ̀lú,’ dípò kí ó so àsọyé méjèèjì pọ̀ gẹ́gẹ́ bí καί. Gbigbé “sì” sí iwájú ìsọtẹ́lẹ̀ kejì mú ìbáṣepọ̀ náà hàn dáadáa.'
