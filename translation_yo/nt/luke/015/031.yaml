base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ọmọ[a], ìwọ wà pẹ̀lú mi nígbà gbogbo, gbogbo ohun tí ó jẹ́ tèmi sì jẹ́ tìrẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọmọkùnrin.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ọmọ,” ó sì jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ nínú ìdílé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Ọmọ
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ láàárín òbí àti ọmọ ni τέκνον; “Ọmọ” pa ìtẹ́lọ́rùn àti ìbátan náà mọ́ láìfi akọ kún ọ̀rọ̀ Gíríìkì.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí “ní gbogbo ìgbà” tàbí “nígbà gbogbo”; èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbáṣepọ̀ tí ó ń bá a lọ.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: μετά pẹ̀lú genitive ń sọ ìbákẹ́gbẹ́ tàbí wíwà papọ̀; “pẹ̀lú mi” jẹ́ ìtumọ̀ tààrà, tí ó sì ṣe àdánidá.
- source_word: πάντα τὰ ἐμὰ
  choice: gbogbo ohun tí ó jẹ́ tèmi
  rationale: Gbólóhùn náà kó gbogbo ohun-ìní baba náà jọ; ìtumọ̀ yìí pa ìtẹnumọ́ “gbogbo” mọ́.
- source_word: σά ἐστιν
  choice: jẹ́ tìrẹ
  rationale: σά túmọ̀ sí “tìrẹ”; ọ̀rọ̀ yìí pa àyè ìtumọ̀ nípa ohun-ìní àti ìbátan sílẹ̀ bí ó ti rí nínú àkàwé náà.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ó sì wí fún un pé
  rationale: δέ lè jẹ́ ìtẹ̀síwájú tàbí ìyàtọ̀ kékeré; “sì” jẹ́ àsopọ̀ ìtàn Yorùbá tí ó bá ibi yìí mu láìfi ìtakora líle kún un.
theological_decisions:
- issue: Ọ̀rọ̀ ìpè ìdílé nínú ìdáhùn baba
  choice: “Ọmọ” fún τέκνον
  alternative: “Ọmọkùnrin” tàbí “Ọmọ mi”
  rationale: “Ọmọ” pa ìfẹ́ àti ìbátan tí τέκνον ní mọ́, kò sì sọ ọ́ di akọ ní kedere tàbí fi arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe àdánidá, ó sì yé òǹkàwé òde òní. “Wí” ní ìrísí ìtàn mímọ́ ṣùgbọ́n kò ga ju bó ṣe yẹ lọ.
