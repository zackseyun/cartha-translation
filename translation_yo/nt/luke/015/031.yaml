  terminology: “Ọmọ” jẹ́ ìbámu tó dáa fún τέκνον; kò fi “mi” tàbí ìtumọ̀ akọ kún un. “Ọmọkùnrin” yẹ gẹ́gẹ́ bí àṣàyàn nínú àlàyé nítorí ẹni tí a ń bá sọ̀rọ̀ jẹ́ akọ nínú àyíká ìtàn, ṣùgbọ́n kì í ṣe ìtumọ̀ àkọ́kọ́.
