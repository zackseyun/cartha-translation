language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni[a], mo sọ fún yín pé ayọ̀ ń bẹ níwájú àwọn áńgẹ́lì Ọlọ́run nítorí ẹlẹ́ṣẹ̀ kan tí ó ronúpìwàdà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ní ọ̀nà kan náà” tàbí “Bẹ́ẹ̀ náà.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì sọ pé ayọ̀ ń bẹ “níwájú àwọn áńgẹ́lì Ọlọ́run”; kò sọ ní tààrà pé àwọn áńgẹ́lì fúnra wọn ni wọ́n ń yọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ gẹ́gẹ́
  rationale: Ó so ohun tí Jésù ń sọ mọ́ àkàwé tó ṣáájú, ó sì fi ìfiwéra hàn lọ́nà àdánidá ní Yorùbá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìtẹnumọ́ yìí, ó sì pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́.
- source_word: γίνεται χαρά
  choice: ayọ̀ ń bẹ
  rationale: Ó fi hàn pé ayọ̀ wà tàbí ṣẹlẹ̀, láìfi ẹni tó ń yọ̀ kun ohun tí Gíríìkì sọ.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó pa ìtumọ̀ ibi tàbí wíwà ní ojú ẹnì kan mọ́, láìyí i sí pé àwọn áńgẹ́lì fúnra wọn ni wọ́n ń yọ̀.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: àwọn áńgẹ́lì Ọlọ́run
  rationale: Ìtumọ̀ tààrà àti èdè Bíbélì tó ṣe kedere fún àwọn òǹkàwé Yorùbá òde òní.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: nítorí ẹlẹ́ṣẹ̀ kan
  rationale: ἐπί pẹ̀lú dative tọ́ka sí ohun tó fa ayọ̀ náà; “nítorí” jẹ́ àdánidá, ó sì ṣe kedere ní Yorùbá.
- source_word: μετανοοῦντι
  choice: tí ó ronú pìwà dà
  rationale: Gbólóhùn ìbátan yìí ṣàfihàn ẹlẹ́ṣẹ̀ náà gẹ́gẹ́ bí ẹni tó ń ronú pìwà dà, láìṣàlàyé ẹ̀kọ́ náà kọjá ohun tí ẹsẹ̀ sọ.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìrònúpìwàdà
  choice: tí ó ronú pìwà dà
  alternative: tí ó yí ọkàn rẹ̀ padà; tí ó padà sọ́dọ̀ Ọlọ́run
  rationale: “Ronú pìwà dà” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀, tó sì pa ìwọ̀n ìtumọ̀ μετανοέω mọ́ láìdín in kù sí ìyípadà èrò lasán tàbí fi àlàyé ẹ̀kọ́ míì kún un.
- issue: Ibi tàbí ẹni tó ni ayọ̀ náà
  choice: ayọ̀ ń bẹ níwájú àwọn áńgẹ́lì Ọlọ́run
  alternative: àwọn áńgẹ́lì Ọlọ́run ń yọ̀
  rationale: Gíríìkì sọ pé ayọ̀ ń bẹ “níwájú” àwọn áńgẹ́lì; kò sọ ní tààrà pé àwọn áńgẹ́lì fúnra wọn ni olùṣe ayọ̀ náà. Ìtumọ̀ yìí pa àìdánilójú tòótọ́ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. A gbé àmì àlàyé [b] sí lẹ́yìn gbogbo gbólóhùn nítorí ó ṣàlàyé ìtumọ̀ “níwájú àwọn áńgẹ́lì Ọlọ́run.”
