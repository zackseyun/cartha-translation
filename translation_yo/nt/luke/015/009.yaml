id: LUK.15.9
reference: Luke 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: yo
  text: Nígbà tí ó sì rí i, ó pe àwọn ọ̀rẹ́bìnrin àti àwọn aládùúgbò rẹ̀ jọ, ó ní, ‘Ẹ bá mi yọ̀, nítorí mo ti rí owó dírákímà[a] tí mo pàdánù.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dírákímà jẹ́ owó fàdákà Gíríìkì; ní ọ̀pọ̀ àyíká, iye rẹ̀ fẹ́rẹ̀ẹ́ dọ́gba pẹ̀lú owó-iṣẹ́ ọjọ́ kan fún òṣìṣẹ́.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: Nígbà tí ó rí i
  rationale: A ṣe àpólà aláìlópó aorist obìnrin náà sí gbólóhùn àkókò tí ó bá èdè Yorùbá mu; ‘i’ ń tọ́ka sí owó náà láti inú àyíká ọ̀rọ̀.
- source_word: συγκαλεῖ
  choice: ó pe ... jọ
  rationale: ‘Pe ... jọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtumọ̀ pípè àwọn ènìyàn wá sí ọ̀dọ̀ ẹni hàn, ó sì pa agbára ìtàn alásìkò mọ́.
- source_word: φίλας
  choice: àwọn ọ̀rẹ́bìnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ abo ní ọ̀pọ̀; ‘àwọn ọ̀rẹ́bìnrin’ mú ìtọ́kasí sí àwọn obìnrin tí wọ́n jẹ́ ọ̀rẹ́ rẹ̀ hàn ní kedere.
- source_word: γείτονας
  choice: àwọn aládùúgbò rẹ̀
  rationale: ‘Aládùúgbò’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn tí wọ́n ń gbé nítòsí; a kò fi akọ tàbí abo kún un nítorí fọ́ọ̀mù Gíríìkì náà lè tọ́ka sí aládùúgbò lápapọ̀.
- source_word: Συγχάρητέ μοι
  choice: Ẹ bá mi yọ̀
  rationale: Àṣẹ ọ̀pọ̀ yìí túmọ̀ sí kí wọ́n pín ayọ̀ pẹ̀lú obìnrin náà; ‘Ẹ bá mi yọ̀’ jẹ́ kedere, àdánidá, ó sì pa ìtumọ̀ ìyọ̀ papọ̀ mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí wọ́n fi gbọ́dọ̀ bá a yọ̀.
- source_word: εὗρον
  choice: mo ti rí
  rationale: ‘Mo ti rí’ sọ àṣeyọrí ìwárí náà ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá, láìyí ìtumọ̀ aorist padà sí ìṣe tí ń lọ lọ́wọ́.
- source_word: δραχμὴν
  choice: owó dírákímà
  rationale: A pa orúkọ owó pàtó náà mọ́, a sì fi ‘owó’ ṣáájú rẹ̀ kí òǹkàwé Yorùbá lè mọ ohun tí ó jẹ́ lẹ́sẹ̀kẹsẹ̀.
- source_word: ἣν ἀπώλεσα
  choice: tí mo sọ nù
  rationale: ‘Sọ nù’ jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí ẹni kan pàdánù; àpólà ìbátan náà ń dá owó tí a ń sọ̀rọ̀ rẹ̀ mọ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo ‘ọ̀rẹ́bìnrin’ láti pa akọ abo φίλας mọ́, ṣùgbọ́n a kò fi akọ abo lé γείτονας lórí.
