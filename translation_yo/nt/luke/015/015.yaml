translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A yà àwọn gbólóhùn méjèèjì pẹ̀lú àmì olójú méjì láti jẹ́ kí ìtẹ̀síwájú ìtàn ṣe kedere.
