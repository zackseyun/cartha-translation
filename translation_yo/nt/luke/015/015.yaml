  to: Ó sì lọ fi ara rẹ̀ mọ́ ọ̀kan nínú àwọn ọmọ ìlú ilẹ̀ náà[a]; ẹni náà sì rán an lọ sí àwọn oko rẹ̀ láti bọ́ àwọn ẹlẹ́dẹ̀.
