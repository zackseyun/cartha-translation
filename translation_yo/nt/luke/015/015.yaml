  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: yo
  text: Ó sì lọ fi ara rẹ̀ mọ́ ọ̀kan nínú àwọn ọmọ ìlú ilẹ̀ náà[a]; ẹni náà sì rán an lọ sí àwọn oko rẹ̀ láti bọ́ àwọn ẹlẹ́dẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “dì mọ́” tàbí “rọ̀ mọ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífi ara mọ́ ẹnì kan pẹ́kípẹ́kí, títí kan gbígbẹ́kẹ̀lé e.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: lọ
  rationale: Aorist participle náà ń fi ìgbésẹ̀ tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn; “lọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ míì kún un.
- source_word: ἐκολλήθη
  choice: fi ara rẹ̀ mọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ fífi ara mọ́ ẹnì kan pẹ́kípẹ́kí, pẹ̀lú èrò ìgbẹ́kẹ̀lé; “fi ara rẹ̀ mọ́” dá ìtumọ̀ yìí dúró ní Yorùbá àdánidá.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: ọ̀kan lára àwọn ọmọ ìlú
  rationale: πολίτης túmọ̀ sí ọmọ ìlú tàbí ẹni tí ó jẹ́ apá kan àwùjọ ìṣèlú; gbolohun yìí tún pa ìtumọ̀ “ọ̀kan lára wọn” mọ́.
- source_word: τῆς χώρας ἐκείνης
  choice: ilẹ̀ náà
  rationale: χώρα lè túmọ̀ sí ilẹ̀, agbègbè, tàbí orílẹ̀-èdè; “ilẹ̀ náà” bá àyíká ìtàn mu, ó sì jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀.
- source_word: ἔπεμψεν αὐτόν
  choice: rán an lọ
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún fífi ẹnì kan ránṣẹ́; “ẹni náà” ni a lò gẹ́gẹ́ bí olùṣe láti jẹ́ kí ẹni tí ọ̀rọ̀ ń tọ́ka sí ṣe kedere.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: sí àwọn oko rẹ̀
  rationale: ἀγρός níbí ni pápá oko tàbí ilẹ̀ iṣẹ́ àgbẹ̀, ọ̀pọ̀ rẹ̀ sì wà nínú orísun; “àwọn oko rẹ̀” pa méjèèjì mọ́.
- source_word: βόσκειν
  choice: láti máa bọ́
  rationale: βόσκω túmọ̀ sí fífún ẹranko ní oúnjẹ tàbí dídá wọn jẹ; “máa bọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún iṣẹ́ tí a rán an lọ ṣe ní ìtẹ̀síwájú.
- source_word: χοίρους
  choice: àwọn ẹlẹ́dẹ̀
  rationale: “Ẹlẹ́dẹ̀” ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún χοῖρος, a sì fi àmì ọ̀pọ̀ hàn gẹ́gẹ́ bí orísun.
