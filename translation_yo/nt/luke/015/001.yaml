  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: yo
  text: Gbogbo àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀ sì ń sún mọ́ ọn láti fetí sí i[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń tọ̀ ọ́ wá.” Ìṣètò ọ̀rọ̀ Gíríìkì náà fi hàn pé ìṣe náà ń lọ lọ́wọ́ tàbí ń ṣẹlẹ̀ léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: sì ń
  rationale: “Sì” ń gbé ìyípadà ọ̀rọ̀ tí δέ ṣe jáde láìfi ọ̀rọ̀ àkókò kan kún un; “ń” sì fi ìṣe tí ó ń lọ lọ́wọ́ tàbí tí ó ń ṣẹlẹ̀ léraléra hàn.
- source_word: αὐτῷ ἐγγίζοντες
  choice: ń sún mọ́ ọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń tọ̀ ọ́ wá, ó sì pa ìtumọ̀ ìṣe tí ó ń lọ lọ́wọ́ tàbí tí ó ń ṣẹlẹ̀ léraléra mọ́.
- source_word: πάντες
  choice: Gbogbo
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé gbogbo àwọn tí a kà sí ẹgbẹ́ méjèèjì yìí ni a ń sọ̀rọ̀ nípa wọn.
- source_word: οἱ τελῶναι
  choice: àwọn agbowó-orí
  rationale: Ọ̀rọ̀ yìí ṣe kedere fún àwọn òǹkàwé òde òní, ó sì tọ́ka sí àwọn tí ń gba owó-orí tàbí owó ìjọba.
- source_word: οἱ ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí túmọ̀ ọ̀rọ̀ orúkọ Gíríìkì náà ní tààràtà láìfi ìdájọ́ tàbí àlàyé míì kún un.
- source_word: ἀκούειν αὐτοῦ
  choice: láti fetí sí i
  rationale: Ọ̀rọ̀-àìṣe náà ń sọ ète tí wọ́n fi ń sún mọ́ ọn; “fetí sí i” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífetí sí ohun tí ẹni kan ń sọ.
theological_decisions:
- issue: Agbára ìtumọ̀ ẹgbẹ́ “àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀” nínú àwùjọ àti ẹ̀sìn
  choice: A pa àwọn ẹgbẹ́ méjèèjì mọ́ gẹ́gẹ́ bí orísun ṣe pè wọ́n, láìfi àlàyé ìtumọ̀ kún un.
  alternative: àwọn agbowó-orí àti àwọn mìíràn tí àwùjọ kọ̀ sílẹ̀; àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀ burúkú jáì
  rationale: Orísun náà dárúkọ àwọn ẹgbẹ́ méjì tí àwọn olùgbọ́ ìgbà náà mọ̀. Àfikún àlàyé yóò pinnu ìtumọ̀ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà, yóò sì dín ìforígbárí inú ìtàn náà kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò láti lóye. “Agbowó-orí” ni a lò dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó lè dà bí ohun tí ẹ̀sìn kan nìkan ń lò.
