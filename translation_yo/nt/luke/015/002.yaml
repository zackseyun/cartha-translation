source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: yo
  text: Àwọn Farisí àti àwọn akọ̀wé sì ń ráhùn, wọ́n ń wí pé, “Ọkùnrin yìí ń tẹ́wọ́ gba àwọn ẹlẹ́ṣẹ̀, ó sì ń bá wọn jẹun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: ń kùn
  rationale: Àkókò imperfect fi ìṣe tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn; ‘ń kùn’ sì pa ìtumọ̀ ìkùnsínú àti àsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́ mọ́.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: Àwọn Farisí àti àwọn akọ̀wé
  rationale: Ìṣọ̀kan τε ... καί so ẹgbẹ́ méjèèjì pọ̀; èdè Yorùbá àdánidá kò nílò kí a fi ‘méjèèjì’ kún un níbí. ‘Àwọn akọ̀wé’ jẹ́ ọ̀rọ̀ tí a mọ̀ fún àwọn amòfin àti olùkọ́ Ìwé Mímọ́ ní àyíká yìí.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ó fi hàn pé ọ̀rọ̀ wọn ń lọ papọ̀ pẹ̀lú ìkùnsínú náà, ó sì bá ìṣètò gbolohun Yorùbá mu.
- source_word: Οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa ìtọ́kasí tó ní ìmọ̀lára àfojúdi tàbí jíjìnnà sí ẹni náà mọ́ ju ‘Òun’ lọ.
- source_word: ἁμαρτωλοὺς
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ substantival adjective náà, ó sì pa ìtumọ̀ ẹgbẹ́ àwọn tí a kà sí ẹlẹ́ṣẹ̀ mọ́.
- source_word: προσδέχεται
  choice: ń gba ... tọ̀wọ̀tọ̀wọ̀
  rationale: ‘Gba ... tọ̀wọ̀tọ̀wọ̀’ fi ìtẹ́wọ́gbà rere hàn ní kedere, láì sọ ọ́ di ìtumọ̀ sáyẹ́kọ́lójì ti ‘accepts.’
- source_word: συνεσθίει αὐτοῖς
  choice: ń bá wọn jẹun
  rationale: Ó túmọ̀ ìjẹun papọ̀ ní tààrà, ó sì pa agbára àjọṣepọ̀ tábìlì tí ẹ̀sùn náà ní mọ́.
theological_decisions:
- issue: Agbára àwùjọ àti ẹ̀sìn inú bí Jésù ṣe ń bá àwọn ẹlẹ́ṣẹ̀ ṣe
  choice: A sọ ẹ̀sùn náà ní tààrà, pẹ̀lú ìtẹ́wọ́gbà àti jíjẹun papọ̀.
  alternative: Ọkùnrin yìí ń gba àwọn ẹlẹ́ṣẹ̀, ó sì ń bá wọn jẹun.
  rationale: Ọ̀rọ̀ náà gbé ìbínú àwọn Farisí àti akọ̀wé kalẹ̀ nítorí Jésù ń tẹ́wọ́ gba àwọn tí wọ́n fi àmì ‘ẹlẹ́ṣẹ̀’ sí, ó sì ń bá wọn jẹun; a kò dín ìkọ̀sẹ̀ náà kù, bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kikún níbi tó bá jẹ́ àdánidá. Ìṣètò ‘sì ń kùn, wọ́n ń wí’ mú imperfect àti participle jáde ní ọ̀nà Yorùbá tó rọrùn.
