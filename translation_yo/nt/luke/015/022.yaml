id: LUK.15.22
reference: Luke 15:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: yo
  text: Ṣùgbọ́n baba náà sọ fún àwọn ẹrú rẹ̀[a] pé, “Ẹ yára mú aṣọ gígùn tí ó dára jù lọ[b] jáde, kí ẹ sì wọ̀ ọ́ fún un; kí ẹ fi òrùka[c] sí ọwọ́ rẹ̀, kí ẹ sì fi bàtà sí ẹsẹ̀ rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà (doulous) ń tọ́ka sí àwọn ẹrú tàbí ìránṣẹ́ tí wọ́n wà lábẹ́ ìdè ilé; “àwọn ẹrú” pa ipò àwùjọ náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “aṣọ gígùn àkọ́kọ́”; nínú àyíká yìí, ó ṣeé ṣe kí ó túmọ̀ sí aṣọ tó dára jù lọ tàbí tó ga jù ní ipò.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà sọ “òrùka” lásán; àwọn kan gbà pé òrùka èdìdì ni, tó ń fi pípadà rẹ̀ sí ipò hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: àwọn ẹrú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ ohun-ìní olówó ilé tàbí tí wọ́n wà lábẹ́ ìdè iṣẹ́. “Àwọn ẹrú” pa ipò àwùjọ ìgbà náà mọ́ ju “àwọn ìránṣẹ́” lọ.
- source_word: Ταχὺ
  choice: Ẹ yára
  rationale: Ó jẹ́ ọ̀rọ̀ àṣẹ tó ń rọ àwọn olùgbọ́ láti ṣe ohun náà lẹ́sẹ̀kẹsẹ̀; “Ẹ yára” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkánjú náà hàn.
- source_word: ἐξενέγκατε
  choice: mú ... jáde
  rationale: Ìṣe náà túmọ̀ sí mímú ohun kan jáde láti inú ilé tàbí ibi ìpamọ́; gbólóhùn yìí ṣe kedere ní Yorùbá.
- source_word: στολὴν τὴν πρώτην
  choice: aṣọ àwọ̀lékè tí ó dára jù lọ
  rationale: Nínú ọ̀rọ̀ yìí, πρώτην ṣeé ṣe kí ó túmọ̀ sí èyí tó ga jù tàbí tó dára jù, kì í ṣe èyí tó kọ́kọ́ wà ní ìtòlẹ́sẹẹsẹ. “Aṣọ àwọ̀lékè” fi irú aṣọ gígùn náà hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐνδύσατε αὐτόν
  choice: wọ̀ ọ́ fún un
  rationale: Èyí sọ ìṣe fífi aṣọ náà wọ ọ́ ní ọ̀nà Yorùbá àdánidá, ó sì so mọ́ aṣọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: δακτύλιον
  choice: òrùka
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ òrùka lásán; kò sọ ní pàtó pé òrùka èdìdì ni.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: sí ọwọ́ rẹ̀
  rationale: Èyí tẹ̀ lé ibi tí ọ̀rọ̀ orísun mẹ́nu kàn, ó sì jẹ́ gbólóhùn tó bójú mu ní Yorùbá.
- source_word: ὑποδήματα
  choice: sálúbàtà
  rationale: Ọ̀rọ̀ náà tọ́ka sí irú bàtà tí wọ́n sábà máa ń wọ ní ayé Mẹditaréníà ìgbàanì; “sálúbàtà” ṣe pàtó ju “bàtà” lásán lọ.
- source_word: εἰς τοὺς πόδας
  choice: wọ ẹsẹ̀ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ohun èlò ìbòsẹ̀ sí ẹsẹ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ hàn láti inú ọ̀rọ̀ ọmọ náà sí ìgbésẹ̀ baba; “Ṣùgbọ́n” mú ìyípadà ìtàn náà jáde.
theological_decisions:
- issue: Bóyá kí a túmọ̀ δούλους sí “ẹrú” tàbí “ìránṣẹ́”
  choice: àwọn ẹrú
  alternative: àwọn ìránṣẹ́
  rationale: Àyíká ilé ọlọ́lá yìí kò mú ipò ìdè wọn kúrò. “Ẹrú” pa òtítọ́ àwùjọ inú ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Bóyá πρώτην nínú στολὴν τὴν πρώτην túmọ̀ sí “àkọ́kọ́” tàbí “tó dára jù lọ”
  choice: aṣọ àwọ̀lékè tí ó dára jù lọ
  alternative: aṣọ àwọ̀lékè àkọ́kọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ṣeé ṣe kí ó tọ́ka sí aṣọ tó ga jù ní ipò tàbí tó dára jù, kì í ṣe àkọ́kọ́ nínú ìtòlẹ́sẹẹsẹ. Àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
- issue: Bóyá kí a mú δακτύλιον gbòòrò sí “òrùka èdìdì”
  choice: òrùka
  alternative: òrùka èdìdì
  rationale: Bí ó tilẹ̀ jẹ́ pé òrùka náà lè ní ìtumọ̀ nípa pípadà sí ipò ọmọ tàbí àṣẹ, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ pé òrùka èdìdì ni; nítorí náà, a kò fi ìtumọ̀ àfikún sínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tó lọ́lá, tó ṣe kedere, tí àwọn òǹkàwé òde òní sì lè lóye. Àwọn àmì ohùn wà níbi tó yẹ; ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn “Ẹ” bá bí baba ṣe ń bá àwọn ẹrú rẹ̀ sọ mu. A yan “sálúbàtà” láti fi irú bàtà ìgbàanì hàn ní pàtó.
