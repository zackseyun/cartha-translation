language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: yo
  text: Ó sì dìde, ó lọ sọ́dọ̀ baba rẹ̀. Ṣùgbọ́n nígbà tí ó ṣì wà ní jíjìnnà[a], baba rẹ̀ rí i, ó sì ṣàánú rẹ̀ gidigidi. Ó sáré lọ bá a, ó gbá a mọ́ ọrùn, ó sì fi ìfẹ́ gidigidi fẹnu kò ó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ṣì jìnnà réré.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ìṣe Gíríìkì náà lè fi bí ìfẹ́ ṣe le tó hàn, ó sì ṣeé ṣe kí ó túmọ̀ sí pé ó fẹnu kò ó léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Ó sì dìde
  rationale: Ọ̀rọ̀ yìí fi hàn pé ọmọ náà gbé ìgbésẹ̀ pàtó láti ṣe ohun tí ó ti pinnu; ‘dìde’ tún pa bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: ó lọ sọ́dọ̀ baba rẹ̀
  rationale: ἔρχομαι lè túmọ̀ sí ‘wá’ tàbí ‘lọ’ gẹ́gẹ́ bí ojú-ìwòye; ‘lọ sọ́dọ̀ baba rẹ̀’ jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ ìṣípò àti ìbáṣepọ̀ náà mọ́.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: nígbà tí ó ṣì wà ní ọ̀nà jíjìn
  rationale: Èyí sọ ipò tí ọmọ náà wà ní àkókò tí baba rí i; ó pa ìtumọ̀ jíjìnnà mọ́ láìfi ibi tí a kò sọ nínú Gíríìkì kún un.
- source_word: ἐσπλαγχνίσθη
  choice: àánú rẹ̀ sì ṣe é gidigidi
  rationale: Gbólóhùn Yorùbá yìí sọ àánú jíjinlẹ̀ tí ó ru nínú ẹni, ó sì bá agbára ẹ̀dùn-ọkàn inú ọ̀rọ̀ Gíríìkì mu.
- source_word: δραμὼν
  choice: Ó sáré lọ bá a
  rationale: ‘Sáré’ túmọ̀ ìṣe náà ní tààrà; ‘lọ bá a’ mú ibi tí ó ń sáré sí ṣe kedere lọ́nà àdánidá nínú Yorùbá.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: ó dì í mọ́ra ní ọrùn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àwòrán ‘ṣubú lé ọrùn rẹ̀’; ìtumọ̀ yìí pa ọrùn àti ìgbá-mọ́ra náà mọ́ ní èdè Yorùbá tí ó ṣeé lóye, láìjẹ́ kí gbólóhùn náà dà bí ìṣubú lásán.
- source_word: κατεφίλησεν
  choice: ó sì fi ìfẹ́ gidigidi fẹnuko rẹ̀
  rationale: Ọ̀rọ̀ ìṣe àkópọ̀ yìí lè fi ìfẹ́ gbígbóná tàbí ìṣe tí a tún ṣe hàn. ‘Fi ìfẹ́ gidigidi fẹnuko rẹ̀’ pa ìfẹ́ àti okun ìṣe náà mọ́ láìfipá sọ pé ó ṣe é léraléra.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe àánú baba nínú àkàwé náà
  choice: A lo èdè tí ó fi àánú àti ìgbésẹ̀ onífẹ̀ẹ́ baba hàn kedere, láìsọ ní tààrà pé baba náà dúró fún Ọlọ́run.
  alternative: Kí a dín agbára ẹ̀dùn-ọkàn náà kù, tàbí kí a fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un pé baba náà ni Ọlọ́run.
  rationale: Àwọn ọ̀rọ̀ ìṣe inú ẹsẹ náà fúnra wọn lágbára, wọ́n sì fi baba tí ó kọ́kọ́ gbé ìgbésẹ̀ hàn. Ìtumọ̀ náà gbọ́dọ̀ pa èyí mọ́ láìfi ìtumọ̀ àpẹẹrẹ tí ẹsẹ náà kò sọ ní gbangba kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí àwọn òǹkàwé òde òní lè lóye. A yan ‘lọ sọ́dọ̀’ gẹ́gẹ́ bí ojú-ìwòye ìtàn, ‘àánú rẹ̀ ṣe é gidigidi’ fún ẹ̀dùn-ọkàn jíjinlẹ̀, àti ‘dì í mọ́ra ní ọrùn’ láti sọ àwòrán Gíríìkì ní Yorùbá àdánidá. Gbogbo àmì àlàyé ìsàlẹ̀ [a], [b] wà níbi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé ti fara hàn.
