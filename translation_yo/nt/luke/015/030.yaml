reference: Luke 15:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọmọ rẹ yìí dé, ẹni tí ó jẹ ohun ìní rẹ run[a] pẹ̀lú àwọn obìnrin aṣẹ́wó, ìwọ pa ọmọ màlúù tí a ti sanra fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘jẹ ohun ìní rẹ run.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ aláwòrán, ó sì lè tọ́ka sí ohun tí ènìyàn fi ń gbé, dúkìá, tàbí ogún.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó pa ìtumọ̀ àkókò ὅτε mọ́, ó sì lo ‘ṣùgbọ́n’ láti fi ìyàtọ̀ inú ẹ̀dùn ọkàn ọmọ àgbà hàn gẹ́gẹ́ bí δέ ṣe ń ṣe ní àyíká ọ̀rọ̀ náà.
- source_word: ὁ υἱός σου οὗτος
  choice: ọmọ rẹ yìí
  rationale: Ìtọ́ka ‘yìí’ pa agbára οὗτος àti ọ̀nà tí ọmọ àgbà fi ń ya ara rẹ̀ sọ́tọ̀ kúrò lọ́dọ̀ àbúrò rẹ̀ mọ́; kò pè é ní ‘àbúrò mi.’
- source_word: ὁ καταφαγών
  choice: ẹni tí ó jẹ ... run
  rationale: ‘Jẹ ... run’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àwòrán líle inú κατεσθίω—jíjẹ ohun kan tán pátápátá—mọ́, dípò kí a túmọ̀ rẹ̀ lásán sí fífi nǹkan ṣòfò.
- source_word: σου τὸν βίον
  choice: ohun ìní rẹ
  rationale: Níhìn-ín βίος ń tọ́ka sí ohun tí baba ní tàbí ohun àmúṣọrọ̀ rẹ̀, kì í ṣe ẹ̀mí rẹ̀. ‘Ohun ìní’ jẹ́ èdè adayeba tí ó tún gba ìtumọ̀ dúkìá tàbí ogún láàyè.
- source_word: μετὰ πορνῶν
  choice: pẹ̀lú àwọn obìnrin aṣẹ́wó
  rationale: Èyí túmọ̀ πόρνη ní tààràtà, ní èdè òde òní tí òǹkàwé Yorùbá lè lóye, láìrọ̀ ẹ̀sùn ọmọ àgbà náà lójú.
- source_word: ἦλθεν
  choice: dé
  rationale: ‘Dé’ sọ pé ó wá síbẹ̀ láìfi ìtumọ̀ ‘padà’ kún ọ̀rọ̀ Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká ìtàn fi hàn pé ìpadàbọ̀ ni.
- source_word: ἔθυσας
  choice: pa
  rationale: Nínú àyíká àsè yìí, θύω túmọ̀ sí pípa ẹran fún oúnjẹ. ‘Pa’ jẹ́ èdè Yorùbá adayeba, kò sì fi ìtumọ̀ ẹbọ ìsìn tí kò sí nínú àyíká ọ̀rọ̀ náà kún un.
- source_word: τὸν σιτευτὸν μόσχον
  choice: ọmọ màlúù tí a ti sanra
  rationale: Èyí ṣàlàyé ní kedere pé ọmọ màlúù náà ni a ti tọ́ lọ́nà àkànṣe kí ó sanra fún àsè.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù náà fi ẹni tí wọ́n ṣe ohun náà fún hàn; pípa ọmọ màlúù náà jẹ́ fún àǹfààní rẹ̀ àti láti fi bu ọlá fún un.
theological_decisions:
- issue: Bóyá kí a fi ẹ̀sùn ọmọ àgbà hàn gẹ́gẹ́ bí òtítọ́ tí ẹni tó ń sọ ìtàn ti fi ìdí rẹ̀ múlẹ̀
  choice: A túmọ̀ ẹ̀sùn náà ní tààràtà gẹ́gẹ́ bí ọ̀rọ̀ ọmọ àgbà, láìfi ọ̀rọ̀ amúyẹ kún un.
  alternative: Láti sọ pé ‘ẹni tí a ní ó jẹ ohun ìní rẹ run’ tàbí láti ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìwà àgbèrè tí a ti fi ìdí rẹ̀ múlẹ̀.
  rationale: Gíríìkì fi èyí sí ẹnu ọmọ àgbà gẹ́gẹ́ bí ẹ̀sùn tirẹ̀; kò sọ ní ẹsẹ yìí pé ẹni tó ń sọ ìtàn ti fìdí gbogbo kúlẹ̀kúlẹ̀ rẹ̀ múlẹ̀. Títúmọ̀ ọ̀rọ̀ rẹ̀ ní tààràtà pa ìfọ̀rọ̀wérọ̀ àti ìdọ̀gbà inú ìtàn náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ọmọ rẹ yìí’ pa ìyapa ẹ̀dùn ọkàn ọmọ àgbà mọ́; ‘jẹ ... run’ sì pa àwòrán líle inú Gíríìkì mọ́ ní ọ̀nà tí ó bá Yorùbá mu.
