id: LUK.15.28
reference: Luke 15:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: yo
  text: Ṣùgbọ́n inú bí i, kò sì fẹ́ wọlé.[a] Nígbà náà ni baba rẹ̀ jáde, ó sì ń bẹ̀ ẹ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fẹ́ wọlé” tàbí “ó kọ̀ láti wọlé.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “ń bẹ̀ ẹ́” tún lè túmọ̀ sí “ń rọ̀ ọ́” tàbí “ń pàrọwà fún un.” Ìrísí ọ̀rọ̀-ìṣe náà fi hàn pé ó ṣeé ṣe kí ẹ̀bẹ̀ náà máa bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: inú bí i
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìbínú bẹ̀rẹ̀ sí í mú un. ‘Inú bí i’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì lágbára ju ohun tí Gíríìkì sọ lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ayẹyẹ tí a mẹ́nu kàn ṣáájú àti ìhùwàsí ọmọ àgbà.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: kò sì fẹ́ wọlé
  rationale: Ó pa ìtumọ̀ ìfẹ́ inú ẹni mọ́ láì sọ ọ́ di ìkọ̀sílẹ̀ tó ṣe kedere ju ọ̀rọ̀ orísun lọ.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Nígbà náà ni baba rẹ̀
  rationale: Ó mú ìtẹ̀síwájú ìtàn àti ìdáhùn baba sí ìhùwàsí ọmọ náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐξελθὼν
  choice: jáde
  rationale: Ó túmọ̀ ìrìn láti inú ilé sí òde ní ṣókí àti ní kedere.
- source_word: παρεκάλει
  choice: ó sì ń bẹ̀ ẹ́
  rationale: Ìṣe àìparí náà lè fi ìbẹ̀bẹ̀ tó ń bá a lọ hàn. ‘Ń bẹ̀ ẹ́’ mú ìtara àti ìtẹ̀síwájú ẹ̀bẹ̀ baba náà jáde láì fi ìrẹ̀lẹ̀ tó pọ̀ jù kún un.
- source_word: αὐτόν
  choice: ẹ́
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí ọmọ àgbà.
theological_decisions:
- issue: Ìró àti ìtumọ̀ ẹ̀bẹ̀ baba nínú àkàwé náà
  choice: ó sì ń bẹ̀ ẹ́
  alternative: ó sì ń rọ̀ ọ́; ó sì ń pàrọwà fún un
  rationale: Ìtumọ̀ yìí pa ìfẹ́ rere àti ìgbésẹ̀ onínúure baba mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti èdè òde òní ni a lò. A lo ‘inú bí i’ gẹ́gẹ́ bí àfihàn ìbínú tó wọ́pọ̀, àti ‘ń bẹ̀ ẹ́’ láti pa agbára ìṣe àìparí Gíríìkì mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
