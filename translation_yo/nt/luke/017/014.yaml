source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: yo
  text: Nígbà tí ó sì rí wọn, ó wí fún wọn pé, “Ẹ lọ fi ara yín hàn fún àwọn àlùfáà[b].” Bí wọ́n sì ti ń lọ, a wẹ̀ wọ́n mọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “a sọ wọ́n di mímọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìwẹ̀mọ́ nípa ara àti nípa ìlànà ẹ̀sìn.
    reason: lexical_alternative
  - marker: b
    text: Àṣẹ pé kí wọ́n fi ara wọn hàn fún àwọn àlùfáà ń tọ́ka sí àyẹ̀wò tí Òfin béèrè lọ́wọ́ àlùfáà fún ẹni tí a mú láradá kúrò nínú àìsàn awọ ara; wo Léfítíkù 14.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ó rí wọn
  rationale: Ọ̀rọ̀ aláṣẹ-àkókò yìí bá èdè Yorùbá mu gẹ́gẹ́ bí gbólóhùn àkókò; a fi “wọn” kún un láti inú àyíká ọ̀rọ̀, nítorí αὐτοῖς tẹ̀ lé e.
- source_word: Πορευθέντες
  choice: Ẹ lọ
  rationale: Participle aorist náà ń ṣiṣẹ́ pẹ̀lú agbára àṣẹ níhìn-ín; “Ẹ lọ” jẹ́ àṣẹ tó ṣe kedere, tó sì bá Yorùbá àdánidá mu.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: fi ara yín han
  rationale: Èyí sọ ìfihàn ara ẹni fún àyẹ̀wò àwọn àlùfáà ní ọ̀nà tó ṣe kedere sí òǹkàwé òde òní.
- source_word: τοῖς ἱερεῦσιν
  choice: àwọn àlùfáà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn àlùfáà tí yóò yẹ ẹni tí àìsàn awọ ara bá lára wò, kí wọ́n sì jẹ́rìí sí ìmímọ́ rẹ̀ gẹ́gẹ́ bí Òfin.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: bí wọ́n sì ti ń lọ
  rationale: Ìkọ́lé Gíríìkì náà fi hàn pé ìmímọ́ ṣẹlẹ̀ ní àkókò tí wọ́n wà lójú ọ̀nà; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìbáṣepọ̀ àkókò náà mọ́.
- source_word: ἐκαθαρίσθησαν
  choice: wọ́n di mímọ́
  rationale: καθαρίζω lè ní ìtumọ̀ ìmúláradá ara àti ìpadà sí ipò mímọ́ nípa ìlànà ẹ̀sìn. “Wọ́n di mímọ́” pa ìtumọ̀ méjèèjì mọ́ ju “wọ́n rí ìwòsàn” lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ èdè ìmímọ́ nínú àyíká àìsàn awọ ara
  choice: wọ́n di mímọ́
  alternative: wọ́n rí ìwòsàn; a sọ wọ́n di mímọ́
  rationale: Gíríìkì tẹnumọ́ ìmímọ́, èyí tó lè kan ìmúláradá ara àti ìmímọ́ níwájú àwọn àlùfáà. Ìtumọ̀ yìí kò dín un kù sí ìwòsàn nìkan, bẹ́ẹ̀ ni kò fi olùṣe tí ẹsẹ̀ náà kò dárúkọ kún un.
translation_notes:
  register: A lo Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A gbe àmì [b] sí “àwọn àlùfáà” àti [a] sí “wọ́n di mímọ́,” níbi tí àlàyé kọ̀ọ̀kan ti bá ọ̀rọ̀ mu.
