  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: yo
  text: Wọ́n yóò sì sọ fún yín pé, “Wò ó, ó wà lọ́hùn-ún!” tàbí, “Wò ó, ó wà níhìn-ín!” Ẹ má ṣe lọ, ẹ má sì tẹ̀ lé wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ẹ má ṣe lọ, ẹ má sì ṣe lépa.” Ọ̀rọ̀ Gíríìkì kò sọ ẹni tàbí ohun tí a ń lépa ní gbangba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: Wọn yóò sì sọ fún yín pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti mú ọ̀rọ̀ ọjọ́ iwájú àti ìṣáájú ọ̀rọ̀ tààrà jáde.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ ìpè láti fa àfiyèsí sí ohun tí a ń tọ́ka sí; ó bá èdè Yorùbá òde òní mu ju gbólóhùn àtijọ́ lọ.
- source_word: ἐκεῖ / ὧδε
  choice: ó wà lọ́hùn-ún / ó wà níhìn-ín
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ ibi jíjìn àti ibi tó sún mọ́ni mọ́, Yorùbá sì nílò gbólóhùn kíkún díẹ̀ kí ìkéde náà lè ṣe kedere.
- source_word: μὴ ἀπέλθητε
  choice: Ẹ má ṣe lọ
  rationale: Àṣẹ ìdènà náà kìlọ̀ fún àwọn olùgbọ́ láti má ṣe lọ sí ibi tí a tọ́ka sí; yíyan yìí kò fi ibi tàbí ohun míì kún ọ̀rọ̀ Gíríìkì.
- source_word: μηδὲ διώξητε
  choice: ẹ má sì ṣe lé wọn tẹ̀ lé
  rationale: διώκω ní ìtumọ̀ lílépa tàbí títẹ̀ lé. Ọ̀rọ̀ Yorùbá yìí mú agbára ìkìlọ̀ náà jáde, ṣùgbọ́n a fi àmì àlàyé hàn pé ohun tí wọ́n ń lépa kò fara hàn gbangba nínú Gíríìkì.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí διώξητε ń tọ́ka sí ní gbangba
  choice: A lo “lé wọn tẹ̀ lé” nínú ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé àìdánilójú náà ní àlàyé ìsàlẹ̀.
  alternative: “ẹ má sì ṣe lépa” láì sọ ohun tí a ń lépa
  rationale: Gíríìkì kò sọ ohun tí a ń lépa ní gbangba. “Wọn” lè tọ́ka sí àwọn tí ń kéde ibi náà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú gidi yìí mọ́, kò sì sọ pé ìtumọ̀ kan ṣoṣo ni ó ṣeé ṣe.
- issue: Bí a ṣe máa túmọ̀ àwọn ìkéde ibi méjèèjì
  choice: “Wò ó, ó wà lọ́hùn-ún!” tàbí, “Wò ó, ó wà níhìn-ín!”
  alternative: “Wò ó lọ́hùn-ún! Wò ó níhìn-ín!”
  rationale: Yíyan gbólóhùn kíkún jẹ́ èdè Yorùbá àdánidá, ó sì pa ìyàtọ̀ ἐκεῖ àti ὧδε mọ́ láì fi ìtumọ̀ nípa ìpadà Ọmọ Ènìyàn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A lò ọ̀pọ̀-orúkọ ọlọ́wọ̀ “ẹ/yín,” a sì pa ìkìlọ̀ náà mọ́ ní ṣókí àti ní tààrà.
