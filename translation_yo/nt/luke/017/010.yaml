  to: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá ti ṣe gbogbo ohun tí a pàṣẹ fún yín, ẹ sọ pé, “Àwa jẹ́ ẹrú aláìlérè[a]; a ti ṣe ohun tí a ní ojúṣe láti ṣe[b].”
  rationale: A tún ìtumọ̀ ἀχρεῖοι ṣe sí ‘aláìlérè’ kí ìtumọ̀ akọkọ̀ lè sún mọ́ ọ̀rọ̀ Gíríìkì, kí ó má sì dín un kù sí ìtumọ̀ àìní ẹ̀tọ́ sí ẹ̀san. Àlàyé ìsàlẹ̀ ń pa àwọn ìtumọ̀ tí a lè yàn mìíràn mọ́. A tún ìṣètò gbolohun méjèèjì ṣe díẹ̀ fún Yorùbá boṣewa tó dára.
