id: LUK.17.10
reference: Luke 17:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá ti ṣe gbogbo ohun tí a pàṣẹ fún yín, ẹ sọ pé, “Àwa jẹ́ ẹrú aláìlérè[a]; a ti ṣe ohun tí a ní ojúṣe láti ṣe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹrú tí kò wúlò,” “ẹrú asán,” tàbí “ẹrú tí kò ní ẹ̀tọ́ láti béèrè èrè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí kò mú èrè wá tàbí, nínú àyíká yìí, ẹni tí kò ní ẹ̀tọ́ sí ẹ̀san àfikún.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “ohun tí ó yẹ kí a ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: Ó so ìlò ẹ̀kọ́ náà mọ́ àpẹẹrẹ tó ṣáájú, ó sì pa ìtumọ̀ ‘ní ọ̀nà kan náà’ mọ́ ní Yorùbá àdánidá.
- source_word: ὅταν ποιήσητε
  choice: nígbà tí ẹ bá ti ṣe
  rationale: Àkójọpọ̀ ‘bá ti ṣe’ fi hàn pé iṣẹ́ náà ti parí ṣáájú àṣẹ náà pé kí wọ́n sọ ọ̀rọ̀ tó tẹ̀ lé.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: gbogbo ohun tí a pàṣẹ fún yín
  rationale: ‘Pàṣẹ’ pa agbára àṣẹ inú διατάσσω mọ́, dípò ọ̀rọ̀ rírọ̀ bí ‘fún yín ní iṣẹ́.’
- source_word: λέγετε
  choice: ẹ sọ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ àṣẹ lọwọlọwọ nínú àyíká yìí.
- source_word: Δοῦλοι
  choice: Ẹrú
  rationale: Àyíká ẹsẹ tó ṣáájú jẹ́ ti olúwa àti ẹrú; ‘ẹrú’ pa ipò ìdè àti agbára àpẹẹrẹ náà mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: ἀχρεῖοί
  choice: tí kò lẹ́tọ̀ọ́ sí èrè
  rationale: Ó mú kókó náà jáde pé ṣíṣe ojúṣe kò fún ẹrú ní ẹ̀tọ́ sí èrè àfikún, láìsọ pé ẹni náà kò níye lásán. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ gígùn míì hàn.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ohun tí ó jẹ́ ojúṣe wa láti ṣe
  rationale: ‘Ojúṣe’ sọ ìtumọ̀ ọranyan tàbí ohun tí ẹni ní láti ṣe ní Yorùbá òde òní tó ṣe kedere.
- source_word: πεποιήκαμεν
  choice: ni a ti ṣe
  rationale: ‘A ti ṣe’ fi iṣẹ́ tó ti parí, tí ìyọrísí rẹ̀ sì ṣì wúlò ní àsìkò ọ̀rọ̀ náà, hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλοι nínú àpẹẹrẹ ọmọ-ẹ̀yìn
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àyíká náà sọ nípa ẹni tó wà lábẹ́ ọlá-àṣẹ olúwa. ‘Ẹrú’ pa agbára àwùjọ àti ìtumọ̀ àsọyé Gíríìkì mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan kún un.
- issue: Ìtumọ̀ ἀχρεῖοι
  choice: tí kò lẹ́tọ̀ọ́ sí èrè
  alternative: aláìlérè; asán; tí kò ní ẹ̀tọ́ láti béèrè èrè
  rationale: Ìtumọ̀ yìí tẹnu mọ́ pé ìgbọràn kì í sọ Ọlọ́run di ajigbèsè ẹni, ṣùgbọ́n kò yanjú gbogbo ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì ní ìkọ̀kọ̀; àlàyé ìsàlẹ̀ pa àwọn àṣàyàn mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ̀yin/yín’ láti pa ọ̀pọ̀ ènìyàn inú ὑμεῖς mọ́.
