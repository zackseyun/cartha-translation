id: LUK.17.7
reference: Luke 17:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: yo
  text: Ṣùgbọ́n ta ni nínú yín tí ó ní ẹrú[a] kan tí ń tulẹ̀ tàbí tí ń ṣọ́ agbo ẹran, tí yóò sọ fún un nígbà tí ó bá ti inú oko wọlé pé, “Wá lẹ́sẹ̀kẹsẹ̀, kí o sì nà ara rẹ̀ sílẹ̀ síbi oúnjẹ”[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìránṣẹ́” tàbí “ẹrú-ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ni doulos.
    reason: alternative_reading
  - marker: b
    text: “Nà ara rẹ̀ sílẹ̀ síbi oúnjẹ” ń tọ́ka sí àṣà ìgbàanì ti rírògbọkú nígbà jíjẹun; ní ọ̀nà tí ó rọrùn, “jókòó láti jẹun.”
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó wà lábẹ́ ìní àti àṣẹ ọ̀gá, kì í ṣe òṣìṣẹ́ tí a yá. “Ẹrú” pa agbára ìbáṣepọ̀ ọ̀gá àti ẹrú mọ́ nínú àkàwé náà.
- source_word: ἀροτριῶντα
  choice: tí ń tulẹ̀
  rationale: Èyí sọ iṣẹ́ fífi ohun èlò tú ilẹ̀ fún àgbẹ̀ ní tààràtà, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ποιμαίνοντα
  choice: tí ń ṣọ́ agbo ẹran
  rationale: Èyí pa àwòrán iṣẹ́ olùṣọ́-agbo mọ́ láì fi irú ẹran kan kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: nígbà tí ó bá ti oko dé
  rationale: Gbólóhùn náà fi hàn pé ó ti iṣẹ́ oko dé, lẹ́yìn náà ni ọ̀gá bá a sọ̀rọ̀; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá.
- source_word: ἐρεῖ αὐτῷ
  choice: tí yóò sọ fún un
  rationale: Ó tẹ̀ lé ìtumọ̀ ọjọ́ iwájú ti ἐρεῖ, ó sì bá ìbéèrè àsọyé náà mu.
- source_word: Εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí kò ní ìdádúró hàn ní kedere.
- source_word: παρελθὼν
  choice: Wá
  rationale: Nínú àṣẹ yìí, participle náà ń fi ìṣípò sí ibi oúnjẹ hàn; “Wá” sọ ìṣípò náà ní Yorùbá àdánidá.
- source_word: ἀνάπεσε
  choice: kí o sì nà án síbi oúnjẹ
  rationale: Èyí pa ìṣe jíjẹun nípa fífara nà sílẹ̀ ní àṣà ìgbàanì mọ́, dípò yíyí rẹ̀ padà sí jíjókòó lásán.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àkàwé ilé kan
  choice: ẹrú
  alternative: ìránṣẹ́; ẹrú-ìránṣẹ́
  rationale: Kókó ọ̀rọ̀ náà sinmi lórí àṣẹ tí ọ̀gá ní lórí ẹni náà. “Ẹrú” pa ìyàtọ̀ ipò àti agbára inú àwùjọ tí ọ̀rọ̀ Gíríìkì ní mọ́, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá òde òní tí ó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn. “Ṣọ́ agbo ẹran” kò sọ pé àgùntàn nìkan ni, nítorí Gíríìkì kò dárúkọ irú ẹran. Àmì ohùn àti àmì ìkọ̀wé ni a lò níbi tí ó bá yẹ.
