  verdict: revise
  source_fidelity: Ìtumọ̀ náà ṣàfihàn ìbéèrè àsọyé, ọjọ́ iwájú ti ἐρεῖ, iṣẹ́ méjèèjì (títu ilẹ̀ àti ṣíṣọ́ agbo), àti ipò ẹrú náà dáadáa. Ṣùgbọ́n “nà án” túmọ̀ sí sísọ ohun kan míì nà, kì í ṣe kí ẹrú náà rọ̀gbọkú fún jíjẹun; nítorí náà kò ṣe ìtumọ̀ ἀνάπεσε ní tòótọ́.
  naturalness: “Nígbà tí ó bá ti oko dé” lè yé ẹni, ṣùgbọ́n “nígbà tí ó bá ti inú oko wọlé” jẹ́ Yorùbá tí ó mọ́gbọn-dáná jù, ó sì mú ἐκ τοῦ ἀγροῦ hàn kedere. Àtúnṣe “nà ara rẹ̀ sílẹ̀” yọ àìdánidá àti aṣiṣe arọ́pò-orúkọ kúrò.
  terminology: “Ẹrú” jẹ́ yíyan tó bá δοῦλος mu nínú àkàwé yìí. “Tí ń tulẹ̀” àti “tí ń ṣọ́ agbo ẹran” tún bá àwọn participle Gíríìkì mu. “Nà ara rẹ̀ sílẹ̀ síbi oúnjẹ” pa ìṣe rọ̀gbọkú nígbà oúnjẹ ti ἀνάπεσε mọ́, láì sọ pé jókòó lásán.
