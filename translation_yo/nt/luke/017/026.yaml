source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: yo
  text: Àti gẹ́gẹ́ bí ó ti ṣẹlẹ̀ ní àwọn ọjọ́ Nóà, bẹ́ẹ̀ náà ni yóò rí ní àwọn ọjọ́ Ọmọ Ènìyàn náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni Ènìyàn.” Oyè náà nínú èdè Gíríìkì, tí a sábà máa ń túmọ̀ sí “Ọmọ Ènìyàn,” lè ní ìró Dáníẹ́lì 7; a sì pa á mọ́ níbí nítorí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè Mèsáyà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àkókò ìkẹyìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣe àfihàn ìfiwéra tó ṣe kedere, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: ἐγένετο
  choice: ó ti ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ ohun tó ṣẹlẹ̀ ní àkókò Nóà mọ́ láì lo ọ̀rọ̀ àtijọ́ tàbí àfikún ìtumọ̀.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: ní ọjọ́ Nóà
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún gbólóhùn àkókò yìí, ó sì sún mọ́ ìṣètò Gíríìkì.
- source_word: οὕτως
  choice: bẹ́ẹ̀ náà
  rationale: Ó dáhùn sí ‘gẹ́gẹ́ bí’ nínú ìfiwéra náà, ó sì fi ìbáramu àwọn àkókò méjèèjì hàn.
- source_word: ἔσται
  choice: ni yóò rí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bí nǹkan yóò ṣe jẹ́, láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó pa agbára àfikún καί kejì mọ́ nínú ìfiwéra náà.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa ìrísí orúkọ oyè náà àti ìró Dáníẹ́lì 7 mọ́, gẹ́gẹ́ bí orúkọ oyè Mèsáyà àti ti àkókò ìkẹyìn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ìrísí ọ̀rọ̀ Gíríìkì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́; kò sì sọ ọ́ di gbólóhùn gbogbogbò tàbí yanjú ìtumọ̀ oyè náà ju ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere sí òǹkàwé òde òní. A lo ‘ní ọjọ́ Nóà’ gẹ́gẹ́ bí àkànlò èdè àkókò, a sì pa ìfiwéra ‘gẹ́gẹ́ bí … bẹ́ẹ̀ náà’ mọ́.
