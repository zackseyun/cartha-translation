  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìfiwéra Gíríìkì náà dáadáa: ‘gẹ́gẹ́ bí … bẹ́ẹ̀ náà ni’ ń ṣàfihàn καθὼς … οὕτως, ‘ó ti ṣẹlẹ̀’ ń mú ἐγένετο wá, àti ọjọ́ iwájú ‘yóò rí’ ń bá ἔσται mu. Síbẹ̀, ταῖς ἡμέραις jẹ́ ọ̀pọ̀ ní ibi méjèèjì, nítorí náà a tún un ṣe sí ‘àwọn ọjọ́.’'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa, ṣùgbọ́n ‘pẹ̀lú ní’ kò rọrùn tó. Fífi ‘náà’ lẹ́yìn ‘àwọn ọjọ́ Ọmọ Ènìyàn’ jẹ́ ọ̀nà tó dáa jù láti gbé καί kejì wọlé láì mú kí ìlànà ọ̀rọ̀ wuwo.
