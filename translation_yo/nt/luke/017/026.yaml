  to: Àti gẹ́gẹ́ bí ó ti ṣẹlẹ̀ ní àwọn ọjọ́ Nóà, bẹ́ẹ̀ náà ni yóò rí ní àwọn ọjọ́ Ọmọ Ènìyàn náà.[a]
