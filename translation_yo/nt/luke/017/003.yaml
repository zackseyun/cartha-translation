  terminology: “Arákùnrin,” “bá a wí,” “ronúpìwàdà,” and “dárí jì í” are suitable, clear renderings in a respectful modern biblical register. The masculine main-text rendering is retained, while the footnote appropriately notes its potentially broader disciple-community reference.
