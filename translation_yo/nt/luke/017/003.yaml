id: LUK.17.3
reference: Luke 17:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: yo
  text: Ẹ máa ṣọ́ra fún ara yín.[a] Bí arákùnrin rẹ[b] bá ṣẹ̀, bá a wí; bí ó bá sì ronúpìwàdà, dárí jì í.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Bí arákùnrin rẹ bá ṣẹ̀ sí ọ, bá a wí.”
    reason: textual_variant
  - marker: b
    text: “Arákùnrin” jẹ́ akọ ní ẹyọ ọ̀kan ní èdè Gíríìkì, ó sì lè tọ́ka ní gbogbogbòò sí ọmọ-ẹ̀yìn ẹlẹgbẹ́, yálà ọkùnrin tàbí obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: Ẹ máa kíyèsára
  rationale: Ọ̀rọ̀ àṣẹ ní àkókò ìsinsìnyí ni, ó sì ń pe fún ìṣọ́ra tí ń bá a lọ. ‘Ẹ máa kíyèsára’ jẹ́ Yorùbá àdánidá tí ó pa agbára ìkìlọ̀ náà mọ́.
- source_word: ἑαυτοῖς
  choice: yín
  rationale: Arọ́pò-orúkọ afarahẹ̀ náà tọ́ka padà sí àwọn tí a ń bá sọ̀rọ̀. ‘Ara yín’ ti wà nínú ìtumọ̀ ọ̀rọ̀-ìṣe ‘kíyèsára yín,’ nítorí náà a kò nílò láti tún ‘ara’ sọ lọ́nà tí kò ní dùn bí Yorùbá àdánidá.
- source_word: ἁμάρτῃ
  choice: bá ṣẹ̀
  rationale: Orísun Gíríìkì kúkúrú kò ní ohun tí ẹ̀ṣẹ̀ náà dojú kọ, bí ‘sí ọ’ ṣe rí. ‘Ṣẹ̀’ pa ìtumọ̀ náà mọ́ láìfi àfikún sí i.
- source_word: ἀδελφός σου
  choice: arákùnrin rẹ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ ọ̀kan. ‘Arákùnrin rẹ’ bá ìrísí orísun mu, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń sọ pé ó lè túmọ̀ sí ọmọ-ẹ̀yìn ẹlẹgbẹ́ ní gbogbogbòò.
- source_word: ἐπιτίμησον
  choice: bá a wí
  rationale: Àṣẹ náà ń béèrè ìbáwí ẹnu tààrà. ‘Bá a wí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáwí tí ó lágbára ju ìmọ̀ràn lásán lọ.
- source_word: μετανοήσῃ
  choice: ronú pìwà dà
  rationale: Gbólóhùn Yorùbá yìí sọ ìyípadà ọkàn àti ìpadà kúrò nínú ẹ̀ṣẹ̀, ó sì bá ọ̀rọ̀ Gíríìkì mu nínú àyíká ìwà àti ìbáṣepọ̀ yìí.
- source_word: ἄφες
  choice: dárí jì í
  rationale: Nínú ìbáṣepọ̀ láàárín ènìyàn, ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀ṣẹ̀ jì. ‘Dárí jì í’ jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
theological_decisions:
- issue: Bóyá kí a fi ‘sí ọ’ kún ‘bá ṣẹ̀’
  choice: A kò fi ‘sí ọ’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Bí arákùnrin rẹ bá ṣẹ̀ sí ọ, bá a wí...
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè kà pé ἐὰν ἁμάρτῃ ὁ ἀδελφός σου, kò sì ní εἰς σέ tàbí ọ̀rọ̀ mìíràn tó dọ́gba pẹ̀lú rẹ̀. Kí ìtumọ̀ má bàa dín ẹ̀ṣẹ̀ náà mọ́ ohun tí a ṣe sí ẹni tí a ń bá sọ̀rọ̀ nìkan, a tẹ̀ lé ọ̀rọ̀ kúkúrú náà; a sì fi ẹ̀dà gígùn sí àlàyé ìsàlẹ̀ ojú ìwé.
- issue: Bí a ṣe túmọ̀ ἀδελφός nípa akọ tàbí abo
  choice: arákùnrin rẹ
  alternative: arákùnrin tàbí arábìnrin rẹ; ọmọ-ẹ̀yìn ẹlẹgbẹ́ rẹ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ẹyọ ọ̀kan. Síbẹ̀, nínú àyíká àwọn ọmọ-ẹ̀yìn, ó lè dúró fún ọmọ-ẹ̀yìn ẹlẹgbẹ́ ní gbogbogbòò; àlàyé ìsàlẹ̀ ojú ìwé pa ànfààní ìtumọ̀ yẹn mọ́ láìyí ìrísí ọ̀rọ̀ pàtàkì padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. Fífi ‘ẹ’ ọ̀pọ̀ ènìyàn àti ‘yín’ hàn ń tẹ̀ lé προσέχετε ἑαυτοῖς; ìyókù ẹsẹ̀ náà ń bá ẹnì kan ṣoṣo sọ̀rọ̀ gẹ́gẹ́ bí Gíríìkì ṣe rí.
