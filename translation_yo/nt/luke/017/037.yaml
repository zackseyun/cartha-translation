language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: yo
  text: Wọ́n sì dá a lóhùn pé, “Níbo, Olúwa?” Ó sì sọ fún wọn pé, “Níbi tí ara bá wà[a], ibẹ̀ ni àwọn igún[b] yóò péjọ síbẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ara” sí “òkú,” èyí tí yóò mú àwòrán ẹyẹ tó ń jẹ ẹran òkú túbọ̀ ṣe kedere.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “àwọn idì,” ṣùgbọ́n nínú àyíká àwọn ẹyẹ tó péjọ síbi ara, “àwọn igún” lè mú ìtumọ̀ náà ṣe kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: Wọ́n sì dá a lóhùn pé
  rationale: Èyí túmọ̀ ìṣe alábápín tó ń ṣáájú ọ̀rọ̀ wọn àti ọ̀rọ̀-ìṣe ìtàn tó wà ní àsìkò ìsinsìnyí sí Yorùbá ìtàn àdánidá. Ó mú ìtumọ̀ ‘wọ́n dáhùn’ jáde láìfi ìṣètò Gíríìkì tí kò rọrùn sínú Yorùbá.
- source_word: Ποῦ
  choice: Níbo
  rationale: Ìbéèrè kúkúrú, àdánidá nípa ibi ni; ó bá Gíríìkì mu láìṣàfikún ìtumọ̀ míì.
- source_word: κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún κύριος gẹ́gẹ́ bí ọ̀rọ̀ tí wọ́n fi ń pe Jésù níhìn-ín.
- source_word: Ὅπου
  choice: Níbi tí … bá wà
  rationale: Ìṣètò yìí sọ òwe gbogbogbò náà ní Yorùbá àdánidá, láìfi ìtumọ̀ pàtó kan kún ibi tí Gíríìkì kò ṣe bẹ́ẹ̀.
- source_word: σῶμα
  choice: ara
  rationale: ‘Ara’ pa ìtumọ̀ ìpìlẹ̀ σῶμα mọ́. Àyíká ọ̀rọ̀ ń tọ́ka sí ara ẹni tàbí ẹranko tó ti kú, ṣùgbọ́n àlàyé ìsàlẹ̀ ni ó fi ‘òkú’ hàn gẹ́gẹ́ bí yíyan míì, kí a má bàa mú àwòrán náà ṣe kedere ju orísun lọ.
- source_word: ἀετοὶ
  choice: igún
  rationale: Nínú àwòrán àwọn ẹyẹ tó ń péjọ síbi ara, ‘igún’ (vultures) ló mú ohun tí ó ṣeé ṣe jù lọ nínú àyíká ọ̀rọ̀ yìí jáde ní Yorùbá. Àlàyé ìsàlẹ̀ pa ‘idì’ mọ́ gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ Gíríìkì tó tún ṣeé ṣe.
- source_word: ἐπισυναχθήσονται
  choice: yóò kóra jọ sí
  rationale: Yorùbá àdánidá máa ń sọ ìpéjọpọ̀ àwọn ẹyẹ ní ọ̀nà yìí. Ó pa àsìkò ọjọ́ iwájú àti èrò pé gbogbo wọn yóò péjọ sí ibi kan mọ́, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìrísí àìṣe.
theological_decisions:
- issue: Ìtumọ̀ òwe nípa ara àti àwọn ẹyẹ ìjẹkújẹ
  choice: A túmọ̀ àwòrán náà tààrà láìsọ ohun tí ara tàbí àwọn ẹyẹ náà dúró fún.
  alternative: A lè ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìdájọ́ ìkẹyìn, àwọn ọmọ ogun Róòmù, tàbí òfin gbogbogbò nípa bí ìdájọ́ ṣe máa ń hàn gbangba.
  rationale: Gíríìkì kò dá ẹni tàbí ìṣẹ̀lẹ̀ tí àwòrán náà ń tọ́ka sí mọ́. Nítorí náà, ìtumọ̀ yìí pa àìdánilójú àti ìfàsẹ́yìn ẹ̀kọ́ ìgbàgbọ́ inú òwe náà mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìrísí òwe àti ìdẹrù àwòrán orísun mọ́.
