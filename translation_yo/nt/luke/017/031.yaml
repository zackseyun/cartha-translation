id: LUK.17.31
reference: Luke 17:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: yo
  text: Ní ọjọ́ náà, ẹnikẹ́ni tí ó bá wà lórí òrùlé[b], tí àwọn ohun ìní rẹ̀ sì wà nínú ilé, kò gbọdọ̀ sọ̀ kalẹ̀ láti lọ mú wọn; bákan náà, ẹni tí ó bá wà ní oko kò gbọdọ̀ padà lọ sí ohun tí ó wà lẹ́yìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní ọ̀nà tó rọ̀ pé, “kò gbọdọ̀ padà lọ mú ohun tí ó fi sílẹ̀ sẹ́yìn.”
    reason: lexical_alternative
  - marker: b
    text: “Òrùlé” níbí túmọ̀ sí òrùlé pẹlẹbẹ tí ènìyàn lè dé, tí wọ́n sì sábà máa ń lò gẹ́gẹ́ bí ibi tí a lè lò ní àkókò náà.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí àkókò pàtó, ó sì pa ìtẹnumọ́ atọ́ka ἐκείνῃ mọ́.
- source_word: ὃς ἔσται
  choice: ẹnikẹ́ni tí ó bá wà
  rationale: Àpẹẹrẹ ‘tí ó bá wà’ sọ ìtumọ̀ gbogbogbò àti ìṣeeṣe ọjọ́ iwájú jáde ní Yorùbá láì fi ọjọ́ iwájú tẹnumọ́ ju bí Gíríìkì ṣe ṣe lọ.
- source_word: ἐπὶ τοῦ δώματος
  choice: lórí òrùlé
  rationale: ‘Òrùlé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ibi orí ilé; àlàyé ìṣe òrùlé pẹlẹbẹ ní àṣà ìgbà náà wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: τὰ σκεύη αὐτοῦ
  choice: àwọn ohun ìní rẹ̀
  rationale: Ní àyíká yìí σκεύη ń tọ́ka sí àwọn ohun ẹni tàbí ohun èlò inú ilé tí a lè lọ mú; ‘àwọn ohun ìní’ jẹ́ gbólóhùn tó ṣe kedere, tí kò sì dín ìtumọ̀ náà mọ́ irú ohun kan ṣoṣo.
- source_word: μὴ καταβάτω
  choice: kò gbọdọ̀ sọ̀ kalẹ̀
  rationale: Èyí mú agbára àṣẹ ìdènà ẹni-kẹta inú Gíríìkì jáde, ó sì bá ìkìlọ̀ pajawiri náà mu.
- source_word: ἆραι αὐτά
  choice: láti lọ mú wọn
  rationale: Ó sọ ìṣe lílọ gba àwọn ohun inú ilé ní Yorùbá àdánidá, ní ìbámu pẹ̀lú ìtumọ̀ αἴρω gẹ́gẹ́ bí gbígbé tàbí mímú ohun kúrò.
- source_word: ὁ ἐν ἀγρῷ
  choice: ẹni tí ó bá wà ní oko
  rationale: Ó pa àpẹẹrẹ ẹni aṣojú mọ́, ó sì tẹ̀ lé ìṣètò apá àkọ́kọ́ ní Yorùbá tó rọrùn.
- source_word: ὁμοίως
  choice: bákan náà
  rationale: Ó so ìdènà kejì mọ́ ti àkọ́kọ́ ní ṣókí, ó sì pa ìfarajọ ìṣètò wọn mọ́.
- source_word: μὴ ἐπιστρεψάτω
  choice: kò gbọdọ̀ yí padà
  rationale: ‘Yí padà’ mú ìtumọ̀ pípadà sẹ́yìn àti agbára ìdènà náà jáde ní ọ̀nà tó wọ́pọ̀ ní Yorùbá.
- source_word: εἰς τὰ ὀπίσω
  choice: sí àwọn ohun tí ó wà lẹ́yìn
  rationale: Ìtumọ̀ yìí pa agbára ohun-afẹ́yinti τὰ ὀπίσω mọ́ dípò kíkàn túmọ̀ rẹ̀ sí ọ̀rọ̀ ìṣe ‘sẹ́yìn’ nìkan; àkọsílẹ̀ ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá tó túbọ̀ rọ̀.
theological_decisions:
- issue: Àwòrán ìkìlọ̀ pajawiri nípa ọjọ́ ìkẹyìn
  choice: A pa àwọn àṣẹ gidi pé kí ẹni lórí òrùlé má sọ̀ kalẹ̀ àti pé kí ẹni ní oko má yí padà mọ́.
  alternative: Kí a ṣàlàyé rẹ̀ ní gbogbogbò gẹ́gẹ́ bí ìkìlọ̀ pé kí ènìyàn má ṣe rọ̀ mọ́ ohun ìní.
  rationale: Ọ̀rọ̀ Gíríìkì lo àwòrán ipò tó ṣe kedere tí ó so mọ́ ‘ọjọ́ náà.’ Pípa àwòrán náà mọ́ ń gbé ìkánjú ọ̀rọ̀ náà jáde, kò sì fi ẹ̀kọ́ ìwà tó gbòòrò ju ohun tí ẹsẹ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ṣe kedere fún òǹkàwé lasán. A lo ‘kò gbọdọ̀’ láti fi agbára ìdènà hàn, a sì pa ìfarajọ àwọn apá méjèèjì àti àìdánilójú díẹ̀ inú εἰς τὰ ὀπίσω mọ́.
