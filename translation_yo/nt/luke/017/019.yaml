  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Dìde, lọ; ìgbàgbọ́ rẹ[b] ti gbà ọ́ là[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ti mú ọ sàn” tàbí “ti wò ọ́ sàn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìgbàlà, ìwòsàn, tàbí gbígbà ẹni kúrò nínú ewu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì fún “ìgbàgbọ́” tún lè túmọ̀ sí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́, bí ó tilẹ̀ jẹ́ pé “ìgbàgbọ́” ni a lò nínú ọ̀rọ̀ pàtàkì níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣe àgbékalẹ̀ ọ̀rọ̀ tààrà, ó sì pa ìtọ́kasí sí ọkùnrin náà mọ́ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: Ἀναστὰς
  choice: Dìde
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó ṣiṣẹ́ pọ̀ mọ́ àṣẹ tí ó tẹ̀ lé e; “Dìde” pa àṣẹ kúkúrú àti ọlá ọ̀rọ̀ náà mọ́.
- source_word: πορεύου
  choice: máa lọ
  rationale: Àṣẹ yìí túmọ̀ sí kí ó bẹ̀rẹ̀ sí í lọ tàbí kí ó tẹ̀ síwájú ní ọ̀nà rẹ̀; “máa lọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bójú mu ní àyíká yìí.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún πίστις; níhìn-ín ó tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé, nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: σέσωκέν σε
  choice: ti gbà ọ́ là
  rationale: Fọ́ọ̀mù perfect náà ń tọ́ka sí iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì dúró. “Ti gbà ọ́ là” pa ìtumọ̀ fífẹ̀ ti σῴζω mọ́, láìdín un kù sí ìwòsàn ara nìkan.
theological_decisions:
- issue: Ìtumọ̀ σέσωκέν σε nínú àyíká ìwòsàn
  choice: ti gbà ọ́ là
  alternative: ti mú ọ lára dá; ti wò ọ́ sàn
  rationale: Gbogbo àwọn mẹ́wàá ni a ti sọ di mímọ́ kúrò nínú àrùn, ṣùgbọ́n ọkùnrin yìí padà wá fi ògo fún Ọlọ́run. Nítorí náà, “ti gbà ọ́ là” pa ìtumọ̀ ìgbàlà àti ìwòsàn tí ọ̀rọ̀ Gíríìkì lè ní mọ́, dípò kí ó yan ìwòsàn ara nìkan.
- issue: Ìtumọ̀ πίστις ní ọ̀rọ̀ Jesu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ṣeé ṣe kí ó tọ́ka sí ìgbẹ́kẹ̀lé ọkùnrin náà nínú Jesu. Síbẹ̀, “ìgbàgbọ́” ni àyípadà àkọ́kọ́ tí ó pa ààyè ìtumọ̀ ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ṣe kedere, tí ó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. A lo “sọ fún un pé” àti “máa lọ” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, bó tilẹ̀ jẹ́ pé [b] ṣáájú [a] nínú gbólóhùn nítorí ìbámu pẹ̀lú àwọn àmì tí a pèsè.
