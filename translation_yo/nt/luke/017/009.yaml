id: LUK.17.9
reference: Luke 17:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: yo
  text: Ṣé ó dúpẹ́ lọ́wọ́ ẹrú náà nítorí pé ó ṣe ohun tí a pàṣẹ fún un láti ṣe?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ Gíríìkì doulos sí “ìránṣẹ́” tàbí “ẹrú-ìránṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Ṣé ...?
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe alásọyé, μὴ bẹ̀rẹ̀ ìbéèrè tí ó ń retí ìdáhùn òdì. Ní Yorùbá àdánidá, “Ṣé ...?” jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé ìdáhùn náà ni “Rárá.”
- source_word: ἔχει χάριν
  choice: dúpẹ́ lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ ἔχειν χάριν τινί túmọ̀ sí níní tàbí fífi ìmoore hàn sí ẹnì kan; “dúpẹ́ lọ́wọ́” ni ọ̀nà Yorùbá tó ṣe déédéé jù fún èyí.
- source_word: δούλῳ
  choice: ẹrú
  rationale: Nínú àkàwé yìí, ẹni náà wà lábẹ́ àṣẹ ọ̀gá, ó sì di dandan fún un láti ṣe ohun tí a pàṣẹ. “Ẹrú” pa ipò ìdè àti àìdọ́gba agbára inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὅτι
  choice: nítorí pé
  rationale: ὅτι ń fi ìdí tí ọ̀gá fi lè dúpẹ́ hàn; “nítorí pé” ni àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐποίησεν
  choice: ó ṣe
  rationale: ποιέω ní ìtumọ̀ gbígbòòrò, níbí ó sì ń tọ́ka sí ṣíṣe ohun tí a pàṣẹ; “ó ṣe” jẹ́ adayeba, ó sì péye nínú àyíká yìí.
- source_word: τὰ διαταχθέντα
  choice: ohun tí a pàṣẹ fún un láti ṣe
  rationale: Àpólà participle passive yìí túmọ̀ sí ‘àwọn ohun tí a ti pàṣẹ.’ Ìtumọ̀ yìí pa ìṣe-àìṣe mọ́, ó sì sọ ní Yorùbá àdánidá pé àṣẹ náà jẹ́ ohun tí ó ní láti ṣe.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àyíká àkàwé ọ̀gá àti ẹrú
  choice: ẹrú
  alternative: ìránṣẹ́; ẹrú-ìránṣẹ́
  rationale: Ìrònú ẹsẹ̀ náà sinmi lórí ipò ẹni tó wà lábẹ́ àṣẹ tí ó sì ní ojúṣe láti ṣègbọ́ràn. “Ẹrú” kò dín òtítọ́ ipò àwùjọ àti àìdọ́gba agbára inú àkàwé náà kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè náà jẹ́ ti àsọyé, ó sì ń retí ìdáhùn pé “Rárá.” Ọ̀rọ̀ jẹ́ ti òde òní, ó lóye fún gbogbo ènìyàn, ó sì pa agbára àkàwé náà mọ́.
