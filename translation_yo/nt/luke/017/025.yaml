source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: yo
  text: Ṣùgbọ́n ó kọ́kọ́ ní láti jìyà ìyà púpọ̀, kí ìran yìí sì kọ̀ ọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó ṣàmì sí ohun tí ó gbọ́dọ̀ ṣẹlẹ̀ ṣáájú àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; ‘kọ́kọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àkókò tẹ̀ lé ara rẹ̀ mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níhìn-ín, δέ fi ìyàtọ̀ díẹ̀ hàn láàárín ohun tí a sọ ṣáájú àti ìjìyà tó gbọdọ̀ kọ́kọ́ dé; ‘Ṣùgbọ́n’ mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: δεῖ
  choice: ní láti
  rationale: ‘Ní láti’ pa agbára ìdandan mọ́ láì fi kún un ní pàtó pé àṣẹ tàbí ète Ọlọ́run ni, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ bẹ́ẹ̀ lè wà nínú ọ̀rọ̀ Lúùkù.
- source_word: αὐτὸν
  choice: ó
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà ní accusative gẹ́gẹ́ bí olùṣe infinitive nínú Gíríìkì, gbolohun Yorùbá àdánidá ń lo ‘ó’ gẹ́gẹ́ bí olùṣe.
- source_word: πολλὰ
  choice: ohun púpọ̀
  rationale: Neuter plural náà tọ́ka sí ọ̀pọ̀ ohun tí yóò farada; ‘ohun púpọ̀’ pa ìfẹ̀ rẹ̀ mọ́ ju ọ̀rọ̀ àfojúrí bí ‘púpọ̀’ nìkan lọ.
- source_word: παθεῖν
  choice: jìyà
  rationale: ‘Jìyà’ jẹ́ ìbámu Yorùbá tó tààrà, tó sì ṣe àfihàn ìrora àti ìfaradà tó wà nínú πάσχω.
- source_word: ἀποδοκιμασθῆναι
  choice: kọ̀ ọ́ sílẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí kí a yẹ ẹnì kan wò kí a sì kọ̀ ọ́; ‘kọ̀ ọ́ sílẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yẹ fún ìkọ̀sílẹ̀ ẹni.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ìran yìí sì kọ̀ ọ́ sílẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe passive, ἀπό lè fi ẹni tó ṣe ìkọ̀sílẹ̀ hàn. Yorùbá active yìí jẹ́ àdánidá, ó sì pa ‘ìran yìí’ mọ́ gẹ́gẹ́ bí àwọn ènìyàn ìgbà ayé rẹ̀.
theological_decisions:
- issue: Agbára δεῖ nípa ìjìyà Ọmọ Ènìyàn
  choice: ní láti
  alternative: ó pọndandan fún un láti; tàbí ṣíṣe àlàyé rẹ̀ ní gbangba gẹ́gẹ́ bí ète Ọlọ́run
  rationale: Lúùkù sábà máa ń lo δεῖ fún ohun tó ṣẹlẹ̀ ní ìbámu pẹ̀lú ète Ọlọ́run. ‘Ní láti’ pa ìdandan àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́ láì ṣàfikún àlàyé tí ẹsẹ náà kò sọ ní gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Gbolohun náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé gbogbo. A lo active fún apá ìkẹyìn nítorí pé ó jẹ́ àdánidá jù ní Yorùbá, láì yí ẹni tó ṣe ìkọ̀sílẹ̀ tàbí ẹni tí a kọ̀ sílẹ̀ padà.
