base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: yo
  text: 'Bákan náà[a], gẹ́gẹ́ bí ó ti ṣẹlẹ̀ ní àwọn ọjọ́ Lọ́ọ̀tì: wọ́n ń jẹun, wọ́n ń mu, wọ́n ń rà, wọ́n ń tà, wọ́n ń gbìn, wọ́n sì ń kọ́lé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bẹ́ẹ̀ náà, bí ó ti rí ní àwọn ọjọ́ Lọ́ọ̀tì.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὁμοίως àti ọ̀nà àdánidá mìíràn láti so ó mọ́ gbólóhùn àfiwé tó tẹ̀ lé e.
lexical_decisions:
- source_word: ὁμοίως
  choice: Bákan náà
  rationale: Ọ̀rọ̀ yìí so àpẹẹrẹ Lọ́ọ̀tì pọ̀ mọ́ àfiwé tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘ní ọ̀nà kan náà.’
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó mú ìfiwéra ọ̀nà tàbí bí ohun ṣe rí jáde ní kedere, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐγένετο
  choice: ó ti ṣẹlẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà tọ́ka sí ohun tó ṣẹlẹ̀ ní ìtàn; ìtumọ̀ yìí jẹ́ ti òde òní, ó sì dára létí.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: ní àwọn ọjọ́ Lọ́ọ̀tì
  rationale: Ó pa àṣà ọ̀rọ̀ àsìkò inú Bíbélì mọ́, tó túmọ̀ sí àkókò tí Lọ́ọ̀tì wà láàyè.
- source_word: ἤσθιον
  choice: wọ́n ń jẹun
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ tàbí tó jẹ́ àṣà wọn hàn, gẹ́gẹ́ bí àkókò imperfect Gíríìkì.
- source_word: ἔπινον
  choice: wọ́n ń mu
  rationale: Ó ṣàfihàn ìṣe ojoojúmọ́ tó ń lọ, ó sì bá ìlà àwọn ọ̀rọ̀-ìṣe yòókù mu.
- source_word: ἠγόραζον
  choice: wọ́n ń rà
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì dára jù láti sọ ìṣe rírà tó ń lọ déédéé.
- source_word: ἐπώλουν
  choice: wọ́n ń tà
  rationale: Ó bá ‘wọ́n ń rà’ ṣe méjì, ó sì ṣàpèjúwe iṣẹ́ ọjà ojoojúmọ́.
- source_word: ἐφύτευον
  choice: wọ́n ń gbìn
  rationale: Ó tọ́ka sí iṣẹ́ àgbẹ̀ tí wọ́n ń ṣe déédéé, pẹ̀lú ìwòye ìṣe tó ń lọ.
- source_word: ᾠκοδόμουν
  choice: wọ́n sì ń kọ́lé
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí kíkọ́ ilé ní ti gidi, kì í ṣe ìtumọ̀ àpèjúwe; ‘kọ́lé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnṣe ‘ń’ lórí gbogbo ọ̀rọ̀-ìṣe pa ìwòye imperfect Gíríìkì mọ́, ìyẹn àwọn ìṣe ojoojúmọ́ tó ń lọ.
