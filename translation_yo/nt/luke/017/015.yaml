base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀kan nínú wọn, nígbà tí ó rí i pé a ti mú un láradá, ó padà, ó sì ń fi ohùn rara yin Ọlọ́run lógo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń fi ògo fún Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíyin Ọlọ́run tàbí fífi ògo fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Ṣùgbọ́n ọ̀kan nínú wọn
  rationale: Ọ̀rọ̀ yìí jẹ́ apá kan nínú gbogbo wọn, δέ sì fi ìyàtọ̀ ìṣe ẹni yìí sí ti àwọn mẹ́sàn-án yòókù hàn lọ́nà pẹ̀lẹ́.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: nígbà tí ó rí i pé a ti mú òun láradá
  rationale: Gbólóhùn yìí fi hàn pé ó mọ̀ pé ìwòsàn ti ṣẹlẹ̀ kí ó tó padà; ‘mú ... láradá’ sọ ìwòsàn ara ní pàtó.
- source_word: ὑπέστρεψεν
  choice: ó padà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó yí padà lọ sí ibi tí ó ti wá.
- source_word: μετὰ φωνῆς μεγάλης
  choice: ó ń fi ohùn rara
  rationale: Àpólà Gíríìkì náà túmọ̀ sí sísọ tàbí kíké ní ohùn gíga; ‘ohùn rara’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìṣẹ̀lẹ̀ náà mu.
- source_word: δοξάζων τὸν θεόν
  choice: yin Ọlọ́run lógo
  rationale: Èyí pa èrò δοξάζω mọ́ gẹ́gẹ́ bí fífi ògo fún Ọlọ́run, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn láti lóye.
theological_decisions:
- issue: Ìtumọ̀ τὸν θεόν
  choice: Ọlọ́run
  alternative: —
  rationale: Ẹsẹ̀ náà kàn sọ pé ọkùnrin tí a mú láradá ń yin Ọlọ́run lógo; kò yẹ kí a fi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- issue: Ìtumọ̀ δοξάζων
  choice: yin Ọlọ́run lógo
  alternative: yin Ọlọ́run
  rationale: ‘Yin ... lógo’ pa ìtumọ̀ fífi ògo fún Ọlọ́run mọ́, nígbà tí ‘yin’ nìkan tún ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọpò ‘òun’ mú ẹni tí a mú láradá ṣe kedere, ìtumọ̀ náà sì jẹ́ ti òde òní, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn.
