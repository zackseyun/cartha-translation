  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: yo
  text: Wọ́n sì gbé ohùn wọn sókè[a], wọ́n sì wí pé, “Jésù, Olórí[b], ṣàánú wa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan, “wọ́n gbé ohùn wọn sókè”; ìtumọ̀ rẹ̀ ni pé wọ́n ké ní ohùn rara.
    reason: lexical_alternative
  - marker: b
    text: “Olórí” túmọ̀ ọ̀rọ̀ Gíríìkì epistata, ọ̀rọ̀ ìpè fún ẹni tí ó ní àṣẹ tàbí tí ó ń darí; kì í ṣe ọ̀rọ̀ tí a sábà túmọ̀ sí “Olúwa” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tó wọ́pọ̀ ni “sì”; kò fi agbára àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ṣùgbọ́n “wọ́n” nìkan ló bá èdè Yorùbá àdánidá mu níbí láìfi ìtumọ̀ àfikún sí i.
- source_word: ἦραν φωνὴν
  choice: gbé ohùn wọn sókè
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì túmọ̀ sí pé wọ́n ké ní ohùn rara.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ó mú ipa participle náà jáde gẹ́gẹ́ bí ohun tí wọ́n ń sọ nígbà tí wọ́n gbé ohùn sókè, ní Yorùbá tó ṣeé kà.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ ní Yorùbá, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí ìpè tààrà níbí.
- source_word: ἐπιστάτα
  choice: Olórí
  rationale: Ọ̀rọ̀ ìpè yìí ń tọ́ka sí ẹni tó ní àṣẹ tàbí tó ń darí. “Olórí” ṣe àfihàn àṣẹ náà láìdá a pọ̀ mọ́ κύριος, ọ̀rọ̀ Gíríìkì tí a sábà túmọ̀ sí “Olúwa.”
- source_word: ἐλέησον
  choice: ṣàánú fún
  rationale: Àṣẹ ẹ̀bẹ̀ ni, tó ń béèrè ìyọ́nú àti ìrànlọ́wọ́ ní kíákíá; “ṣàánú fún wa” jẹ́ ọ̀nà àdánidá àti ọlọ́lá ní Yorùbá.
- source_word: ἡμᾶς
  choice: wa
  rationale: Ó jẹ́ ẹni tí ẹ̀bẹ̀ àánú náà kàn, ó sì bá gbólóhùn Yorùbá “ṣàánú fún wa” mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐπιστάτα gẹ́gẹ́ bí oyè ìpè fún Jésù
  choice: Olórí
  alternative: Olúwa
  rationale: Gíríìkì ní ἐπιστάτης níbí, kì í ṣe κύριος. “Olórí” pa ìtumọ̀ ẹni tó ní àṣẹ àti tó ń darí mọ́, láìfi ìtumọ̀ ẹ̀kọ́ nípa Kristi tó lágbára ju ohun tí ọ̀rọ̀ yìí fúnra rẹ̀ sọ lọ sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó ṣeé lóye ni a lò. A pa àwòrán “gbé ohùn sókè” mọ́, a sì lò “Olórí” láti dá ìyàtọ̀ ἐπιστάτης àti κύριος dúró. Gbogbo àmì ohùn àti àmì ẹsẹ̀ ni a fi sí ibi tí ó yẹ.
