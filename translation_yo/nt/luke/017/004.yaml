  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: yo
  text: Bí ó bá ṣẹ̀ sí ọ ní ìgbà méje nínú ọjọ́ kan,[a] tí ó sì padà wá sọ́dọ̀ rẹ ní ìgbà méje, tí ó ń wí pé, “Mo ronúpìwàdà,” kí o dáríjì í.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ọjọ́ náà.” Gíríìkì ń tọ́ka sí àkókò tí ìṣe náà wáyé nínú rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ìwọ yóò dáríjì í.” Gíríìkì lo fọ́ọ̀mù ọjọ́-ọ̀la, ṣùgbọ́n níbí ó ní agbára àṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις
  choice: ní ìgbà méje
  rationale: Ó túmọ̀ sí ‘ìgbà méje’ gẹ́gẹ́ bí ọ̀rọ̀-àpọ́nlé, ó sì pa ìtẹnumọ́ ìṣe tí a tún ṣe mọ́.
- source_word: τῆς ἡμέρας
  choice: láàárín ọjọ́ kan
  rationale: Ẹ̀yà ọ̀rọ̀ yìí sọ àkókò tí ìṣe náà ṣẹlẹ̀ nínú rẹ̀; ‘láàárín ọjọ́ kan’ jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ‘kan’ kò dúró lọ́tọ̀ nínú Gíríìkì.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: ṣẹ̀ sí ọ
  rationale: Nínú àyíká yìí, ἁμαρτάνω pẹ̀lú εἰς σέ túmọ̀ sí ṣíṣe ẹ̀ṣẹ̀ tàbí àṣìṣe sí ẹni tí a ń bá sọ̀rọ̀; ‘ṣẹ̀ sí ọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: padà tọ̀ ọ́ wá
  rationale: ἐπιστρέφω lè túmọ̀ sí ‘yí padà’ tàbí ‘padà wá’; ọ̀rọ̀ yìí mú ìpadàbọ̀ ẹni tó ṣẹ̀ àti bí ó ṣe tún tọ ẹni náà wá pọ̀.
- source_word: λέγων
  choice: pé
  rationale: Ọ̀rọ̀ aláìlópìn Gíríìkì yìí ń fi ohun tí ẹni náà sọ hàn; ‘pé’ so ọ̀rọ̀ rẹ̀ mọ́ ìṣe ìpadàbọ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: Μετανοῶ
  choice: Mo ronú pìwà dà
  rationale: Ó pa ìtumọ̀ ìrònúpìwàdà mọ́, kì í ṣe ìbànújẹ́ tàbí àforíjì lásán.
- source_word: ἀφήσεις αὐτῷ
  choice: kí o dárí jì í
  rationale: Fọ́ọ̀mù ọjọ́-ọ̀la Gíríìkì ní agbára àṣẹ nínú àyíká ẹ̀kọ́ yìí; ‘kí o dárí jì í’ jẹ́ àṣẹ tó ṣe kedere, tó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Agbára fọ́ọ̀mù ọjọ́-ọ̀la ἀφήσεις
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìtọ́ni: “kí o dárí jì í.”'
  alternative: A lè túmọ̀ ọ́ ní ti àsọtẹ́lẹ̀ pé, “ìwọ yóò dárí jì í,” tàbí ní ti ojúṣe pé, “o gbọ́dọ̀ dárí jì í.”
  rationale: Nínú ọ̀rọ̀ ìtọ́ni yìí, ọjọ́-ọ̀la náà ń ṣiṣẹ́ bí àṣẹ. Ìtumọ̀ tí a yàn fi agbára ìtọ́ni náà hàn láìfi ìtẹnumọ́ míì kún un.
- issue: Ìtumọ̀ Μετανοῶ
  choice: “Mo ronú pìwà dà.”
  alternative: “Ó ká mi lára” tàbí “Mo yí ọkàn mi padà.”
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìrònúpìwàdà, kì í ṣe ìbànújẹ́ tàbí yíyí èrò padà lásán; ìtumọ̀ yìí pa ìwọ̀n ìwà rere àti ti ẹ̀mí inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. “Bí ó bá tilẹ̀” gbé ἐὰν kalẹ̀ gẹ́gẹ́ bí ipò tí ó ṣeé ṣe, “ṣẹ̀ sí ọ” sì yẹra fún ọ̀rọ̀ ẹ̀sìn líle ju ohun tí àyíká béèrè lọ. Àwọn àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn àti agbára gírámà Gíríìkì mọ́.
