  naturalness: “Bí ó bá ṣẹ̀ sí ọ ní ìgbà méje nínú ọjọ́ kan” àti “padà wá sọ́dọ̀ rẹ” jẹ́ Yorùbá boṣewa, kedere, àti àdánidá. “Mo ronúpìwàdà” jẹ́ ọ̀nà kúkúrú, ìlò òde-òní tí ó dára fún Μετανοῶ. “Kí o dáríjì í” jẹ́ ìtọ́ni tí ó ṣàn lọ́nà ti ẹnu Yorùbá.
