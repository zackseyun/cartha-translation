id: LUK.17.24
reference: Luke 17:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: yo
  text: Nítorí, gẹ́gẹ́ bí mànàmáná tí ń kọ láti apá kan lábẹ́ ọ̀run dé apá kejì lábẹ́ ọ̀run, tí ó sì ń tàn[a], bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò ṣe rí ní ọjọ́ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní ọ̀nà Yorùbá tí ó rọrùn sí i pé, “láti òpin ọ̀run kan dé òpin kejì.” Ní ti gidi, Gíríìkì tún “lábẹ́ ọ̀run” sọ ní ìhà méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọjọ́ tí ó jẹ́ tirẹ̀.” Gbólóhùn náà ń tọ́ka sí àkókò tí ó ní í ṣe pẹ̀lú Ọmọ Ènìyàn, kò sì sọ ohun tí yóò ṣẹlẹ̀ ní ọjọ́ náà ní pàtó nínú ẹsẹ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” pa agbára àlàyé γάρ mọ́, “gẹ́gẹ́ bí” sì bẹ̀rẹ̀ àfiwé ὥσπερ ní Yorùbá àdánidá.
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: mànàmáná tí ń kọ
  rationale: “Mànàmáná” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἀστραπή; “tí ń kọ” fi ìṣe aláàyè ti participle ἀστράπτουσα hàn.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: láti apá kan lábẹ́ ọ̀run dé apá kejì lábẹ́ ọ̀run
  rationale: Ó pa àtúnṣe “lábẹ́ ọ̀run” ní ìhà méjèèjì mọ́, ó sì fi ìrìn láti apá kan dé apá kejì hàn ní Yorùbá tí ó ṣeé lóye.
- source_word: λάμπει
  choice: tí ó sì ń tàn
  rationale: “Ń tàn” yà λάμπει sọ́tọ̀ kúrò ní “ń kọ” fún ἀστράπτουσα, bí Gíríìkì ṣe lo ọ̀rọ̀ ìṣe méjì tí ó jọra ṣùgbọ́n tí kò jẹ́ ọ̀kan náà.
- source_word: οὕτως ἔσται
  choice: bẹ́ẹ̀ náà ni ... yóò rí
  rationale: Ìṣètò Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ “bẹ́ẹ̀ ni yóò jẹ́,” ó sì pa àfiwé àti ọjọ́ iwájú mọ́.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ tààrà, tí a mọ̀ dáadáa, fún orúkọ oyè náà; kò sọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́ kan.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: ní ọjọ́ rẹ̀
  rationale: Ó pa ìbáṣepọ̀ ọjọ́ náà pẹ̀lú Ọmọ Ènìyàn mọ́, ṣùgbọ́n kò fi “bọ̀,” “ìdájọ́,” tàbí ìtumọ̀ pàtó mìíràn kún ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Ìtumọ̀ “Ọmọ Ènìyàn ... ní ọjọ́ rẹ̀” nínú ọ̀rọ̀ nípa ìkẹyìn
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ní ọjọ́ rẹ̀.”
  alternative: “nígbà tí yóò dé” tàbí “ní ọjọ́ ìdájọ́”
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí ọjọ́ iwájú ti Ọmọ Ènìyàn, ṣùgbọ́n Gíríìkì kò sọ “dídé” tàbí “ìdájọ́” níbí. Ìtumọ̀ náà nítorí náà kò yẹ kí ó mú ohun tí kò ṣe kedere dájú.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Mànàmáná tí ń kọ ... tí ó sì ń tàn” jẹ́ àwòrán tí ó wọ́pọ̀, ó sì pa ìyàtọ̀ láàárín àwọn ọ̀rọ̀ ìṣe Gíríìkì méjì mọ́. Àtúnṣe “lábẹ́ ọ̀run” jẹ́ díẹ̀ ní ti gidi ju ọ̀nà ọ̀rọ̀ ojoojúmọ́ lọ, ṣùgbọ́n a pa á mọ́ nínú ẹsẹ, a sì fi ọ̀nà àdánidá sí àlàyé ìsàlẹ̀.
