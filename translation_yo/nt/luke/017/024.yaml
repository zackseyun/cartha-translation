- from: Nítorí gẹ́gẹ́ bí mànàmáná tí ń kọ láti apá kan lábẹ́ ọ̀run dé apá kejì lábẹ́ ọ̀run, tí ó sì ń tàn[a], bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò rí ní ọjọ́ rẹ̀[b].
  to: Nítorí, gẹ́gẹ́ bí mànàmáná tí ń kọ láti apá kan lábẹ́ ọ̀run dé apá kejì lábẹ́ ọ̀run, tí ó sì ń tàn[a], bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò ṣe rí ní ọjọ́ rẹ̀[b].
  rationale: Àtúnṣe náà mú ìtumọ̀ “so will the Son of Man be” wá sí Yorùbá tó dára sí i pẹ̀lú “yóò ṣe rí.” Ó tún mú àwọn àlàyé ìsàlẹ̀ méjèèjì péye sí i, nígbà tí ó pa àtúnsọ̀ Gíríìkì, ìyàtọ̀ láàárín “ń kọ” àti “ń tàn,” àti àìdájú “ní ọjọ́ rẹ̀” mọ́.
