id: LUK.17.1
reference: Luke 17:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: yo
  text: Nígbà náà, ó sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Kò ṣeé ṣe kí àwọn ohun ìkọ̀sẹ̀[a] má wá, ṣùgbọ́n ègbé ni fún ẹni tí wọ́n wá nípasẹ̀ rẹ̀!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ ‘àwọn ohun tí ń mú ènìyàn dẹ́ṣẹ̀,’ ‘àwọn ìdẹwò sí ẹ̀ṣẹ̀,’ tàbí ‘àwọn ohun tí ń mú ènìyàn ṣubú.’ Ọ̀rọ̀ Gíríìkì σκάνδαλα ń tọ́ka sí àwọn ohun tí ń mú ènìyàn kọsẹ̀ ní ti ìwà tàbí nípa ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Nígbà náà, ó sọ
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ tí kò lágbára; ‘Nígbà náà’ mú ìtẹ̀síwájú ìtàn Lúùkù jáde lọ́nà àdánidá láìfi ìtakora kún un.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθηταί, ‘rẹ̀’ sì fi αὐτοῦ hàn.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Kò ṣeé ṣe
  rationale: Èyí pa ìrísí gbólóhùn Gíríìkì mọ́, ó sì mú àìṣeéyẹ̀ kí ohun tí ó tẹ̀ lé e má ṣẹlẹ̀ hàn.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: kí àwọn ohun ìkọ̀sẹ̀ má wá
  rationale: Ìṣètò infinitive pẹ̀lú μή sọ pé ohun tí kò ṣeé ṣe ni pé σκάνδαλα kò ní wá; ìtumọ̀ yìí pa àwòrán ìkọ̀sẹ̀ mọ́.
- source_word: σκάνδαλα
  choice: àwọn ohun ìkọ̀sẹ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ohun tí ń dẹ ènìyàn tàbí tí ń mú un ṣubú ní ti ìwà tàbí nípa ẹ̀mí. ‘Àwọn ohun ìkọ̀sẹ̀’ pa àwòrán yẹn àti ìtumọ̀ rẹ̀ tí ó gbòòrò mọ́.
- source_word: πλὴν οὐαὶ
  choice: ṣùgbọ́n ègbé ni
  rationale: ‘Ṣùgbọ́n’ mú ìyípadà láti àìṣeéyẹ̀ ìṣẹ̀lẹ̀ náà sí ìdájọ́ ẹni tí ó fa á hàn; ‘ègbé ni’ jẹ́ ìkìlọ̀ ológo tí ó bá οὐαί mu.
- source_word: δι’ οὗ
  choice: fún ẹni tí wọ́n wá nípasẹ̀ rẹ̀
  rationale: Èyí pa ẹni kan ṣoṣo tí ọ̀rọ̀ náà ń tọ́ka sí mọ́, ó sì dúró pẹ̀lú èrò ‘nípasẹ̀’ láìsọ ní pàtó ju orísun lọ pé ẹni náà mọ̀ọ́mọ̀ fa wọn.
- source_word: ἔρχεται
  choice: wọ́n wá
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹyọ, ‘wọ́n’ bá ‘àwọn ohun ìkọ̀sẹ̀’ mu ní Yorùbá ó sì jẹ́ kí gbólóhùn náà ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ σκάνδαλα nínú ẹ̀kọ́ ìwà rere
  choice: Àwọn ohun ìkọ̀sẹ̀
  alternative: ẹ̀ṣẹ̀; ohun tí ń mú ènìyàn dẹ́ṣẹ̀; ìdẹwò sí ẹ̀ṣẹ̀
  rationale: Yíyan àwòrán ‘ìkọ̀sẹ̀’ kò fi ìtumọ̀ náà mọ́ ìbínú ara ẹni nìkan tàbí ìdẹwò nìkan; ó jẹ́ kí ìkìlọ̀ nípa ohun gbogbo tí ó lè mú ènìyàn ṣubú nípa ìwà tàbí ẹ̀mí dúró.
- issue: Ẹni kan ṣoṣo nínú δι’ οὗ
  choice: ẹni tí wọ́n wá nípasẹ̀ rẹ̀
  alternative: ọkùnrin tí wọ́n wá nípasẹ̀ rẹ̀; ẹni tí ó mú wọn wá
  rationale: ‘Ẹni’ pa ìtọ́kasí sí ènìyàn kan mọ́ láìfi akọ tàbí abo tí kò ṣe pàtàkì kún un; ‘nípasẹ̀ rẹ̀’ tún yẹra fún fífi ìmọ̀ọ́mọ̀ tàbí ìdí tí Gíríìkì kò sọ kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, tí ó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Kò ṣeé ṣe’ pa ìrísí orísun mọ́; ‘àwọn ohun ìkọ̀sẹ̀’ jẹ́ àwòrán àdánidá tó tún jẹ́ kí ìtumọ̀ ẹ̀mí àti ti ìwà dúró. A gbé àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
