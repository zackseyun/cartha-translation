id: LUK.17.22
reference: Luke 17:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: yo
  text: Ó sì sọ fún àwọn ọmọ-ẹ̀yìn pé, “Àwọn ọjọ́ ń bọ̀ nígbà tí ẹ ó fẹ́ gidigidi láti rí ọ̀kan lára àwọn ọjọ́ Ọmọ Ènìyàn,[a] nígbà náà ẹ kì yóò rí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn ọjọ́ Ọmọ Ènìyàn” lè tọ́ka sí àkókò wíwà àti iṣẹ́ rẹ̀, tàbí ní pàtàkì sí ìfarahàn rẹ̀ lọ́jọ́ iwájú; ọ̀rọ̀ Gíríìkì kò fi ìwọ̀n ìtumọ̀ náà mọ́ ọ̀kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς τοὺς μαθητάς
  choice: Ó sì sọ fún àwọn ọmọ-ẹ̀yìn pé
  rationale: “Sì” fi ìsopọ̀ onírẹ̀lẹ̀ ti δέ hàn láìsọ ọ́ di ìtakora; “àwọn ọmọ-ẹ̀yìn” tẹ̀ lé ọ̀rọ̀ Gíríìkì tí kò fi ọ̀rọ̀ arọ́pò-orúkọ olóhun kún un.
- source_word: Ἐλεύσονται ἡμέραι ὅτε
  choice: Àwọn ọjọ́ ń bọ̀ nígbà tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àsọtẹ́lẹ̀ nípa àkókò tí ń bọ̀, ó sì pa agbára ọ̀rọ̀ ọjọ́ iwájú mọ́.
- source_word: ἐπιθυμήσετε
  choice: ẹ ó máa fẹ́ gidigidi
  rationale: Ọ̀rọ̀ yìí fi ìfẹ́-ọkàn líle hàn, kì í ṣe ìfẹ́ lásán; gbólóhùn náà sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: μίαν τῶν ἡμερῶν
  choice: ọ̀kan lára àwọn ọjọ́
  rationale: 'Ó pa ìtumọ̀ partitive mọ́: ọjọ́ kan nínú ọ̀pọ̀ ọjọ́.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A túmọ̀ oyè tí Jésù lò fún ara rẹ̀ ní tààràtà, kí ìfarahàn rẹ̀ pẹ̀lú Dáníẹ́lì àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ má bàa sọnù.
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: láti rí … ṣùgbọ́n ẹ kì yóò rí i
  rationale: “Rí” jẹ́ ọ̀rọ̀ àdánidá fún àwọn ọ̀rọ̀-ìṣe méjèèjì. “Rí i” fi ohun tí wọ́n ń fẹ́ rí hàn kedere; “ṣùgbọ́n” sọ ìyàtọ̀ inú gbólóhùn náà ní Yorùbá àdánidá láìyí ìtumọ̀ padà.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ọjọ́ Ọmọ Ènìyàn”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìtọ́ka tó ní agbára sí àkókò Ọmọ Ènìyàn, láìfi dandan mọ́ iṣẹ́ Jésù lórí ilẹ̀ ayé nìkan tàbí ìfarahàn rẹ̀ lọ́jọ́ iwájú nìkan.
  alternative: Ó lè tọ́ka sí àwọn ọjọ́ tí Jésù wà pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀ lórí ilẹ̀ ayé, tàbí ní pàtàkì sí ìfarahàn àti ìdájọ́ Ọmọ Ènìyàn lọ́jọ́ iwájú.
  rationale: Ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ gba ìwọ̀n méjèèjì láàyè. Ìtumọ̀ náà kò yan ọ̀kan lára wọn níbi tí ẹsẹ̀ náà kò ti yan án.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A ṣàtúnṣe àlàyé ìsàlẹ̀ Gẹ̀ẹ́sì tó samisi [a], nítorí ibi tí àmì náà wà àti ohun tí àlàyé náà sọ kò bá ara wọn mu; a pa àlàyé orísun tó ṣe pàtàkì nípa “àwọn ọjọ́ Ọmọ Ènìyàn” mọ́.
