base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni yóò rí ní ọjọ́ tí a bá ṣí Ọmọ Ènìyàn payá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Bẹ́ẹ̀ náà’ tàbí ‘Ní ọ̀nà kan náà.’ Àkànlò èdè Gíríìkì náà ń tọ́ka padà sí àwọn àpẹẹrẹ tí ó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Bẹ́ẹ̀ náà ni yóò rí
  rationale: Ọ̀rọ̀ yìí tọ́ka padà sí àwọn àpẹẹrẹ ọjọ́ Nóà àti ọjọ́ Lọ́ọ̀tì, ó sì túmọ̀ sí pé ohun kan náà yóò ṣẹlẹ̀ ní irú ọ̀nà kan náà. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ìfiwéra àti ìtọ́kasí ọjọ́ iwájú mọ́.
- source_word: ἔσται
  choice: yóò rí
  rationale: Fífi ‘yóò rí’ ṣe àfihàn ọ̀rọ̀ ọjọ́ iwájú ἔσται ní Yorùbá àdánidá; nínú gbólóhùn ‘Bẹ́ẹ̀ náà ni yóò rí,’ ó túmọ̀ sí ‘bẹ́ẹ̀ náà ni yóò ṣe rí.’
- source_word: ᾗ ἡμέρᾳ
  choice: ní ọjọ́ tí
  rationale: Èyí fi ìtumọ̀ àkókò ti dative relative náà hàn ní Yorùbá tó wọ́pọ̀, láì sọ ọjọ́ náà di ohun tí kò dá pàtó.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa orúkọ oyè Jesu yìí mọ́ gẹ́gẹ́ bí ìtumọ̀ tó mọ́ nípa Ìhìn Rere, tí ó sì ní ìsopọ̀ pẹ̀lú Dáníẹ́lì 7.
- source_word: ἀποκαλύπτεται
  choice: a bá ṣí … payá
  rationale: Ìkọ̀ṣe aláìní olùṣe pàtó ‘a bá ṣí … payá’ jẹ́ ọ̀nà Yorùbá àdánidá láti gbé passive Gíríìkì jáde. Ó pa èrò ìṣípayá tàbí ìfarahàn ní gbangba mọ́, dípò kí ó túmọ̀ ọ̀rọ̀ náà sí wíwá lásán.
theological_decisions:
- issue: Ìtumọ̀ orúkọ oyè ὁ υἱὸς τοῦ ἀνθρώπου nípa òpin ayé
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ọmọ Ènìyàn / Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ìdánimọ̀ orúkọ oyè náà àti ìsopọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́; àwọn àṣàyàn mìíràn lè sọ agbára Mèsáyà àti ti ìṣípayá òpin ayé rẹ̀ di aláìlágbára.
- issue: Agbára ἀποκαλύπτεται nínú àyíká ọ̀rọ̀
  choice: a bá ṣí Ọmọ Ènìyàn payá
  alternative: Ọmọ Ènìyàn bá dé / bá farahàn
  rationale: Ọ̀rọ̀ Gíríìkì náà dá lórí ìṣípayá, kì í ṣe dídé nìkan. Àṣàyàn yìí pa ìtumọ̀ ìṣípayá ní gbangba àti irú passive rẹ̀ mọ́ láì fi èrò míì kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa orúkọ oyè ‘Ọmọ Ènìyàn’ mọ́.
