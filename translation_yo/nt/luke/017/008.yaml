revisions:
- from: Kàkà bẹ́ẹ̀, ṣé kò ní sọ fún un pé, “Pèsè oúnjẹ alẹ́ mi, di aṣọ rẹ mọ́ra[a], kí o sì máa ṣe ìránṣẹ́ fún mi títí tí mo fi jẹ, tí mo sì mu[b]; lẹ́yìn náà, ìwọ yóò jẹ, ìwọ yóò sì mu”?”
  to: Kàkà bẹ́ẹ̀, ṣé kò ní sọ fún un pé, “Pèsè oúnjẹ alẹ́ mi, dì aṣọ rẹ mọ́ra[a], kí o sì ṣe iṣẹ́ fún mi títí tí mo fi jẹ, tí mo sì mu[b]; lẹ́yìn náà, ìwọ yóò jẹ, ìwọ yóò sì mu”?”
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tó lè sọ ẹni náà di ‘ìránṣẹ́’ ní kedere tàbí tó lè fúnni ní ìmọ̀ ìṣe déédéé, pẹ̀lú ọ̀rọ̀ tó ń fi iṣẹ́ ìtọ́jú ẹni tí ń jẹun hàn. A tún ṣàtúnṣe àmì ohùn lórí ọ̀rọ̀-àṣẹ náà. Gbogbo ìbáṣepọ̀, ìlànà àkókò, àti ìtẹnumọ́ inú Gíríìkì ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
