id: LUK.17.8
reference: Luke 17:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: yo
  text: Kàkà bẹ́ẹ̀, ṣé kò ní sọ fún un pé, “Pèsè oúnjẹ alẹ́ mi, dì aṣọ rẹ mọ́ra[a], kí o sì ṣe iṣẹ́ fún mi títí tí mo fi jẹ, tí mo sì mu[b]; lẹ́yìn náà, ìwọ yóò jẹ, ìwọ yóò sì mu”?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, “múra sí iṣẹ́”; ní ti gidi, ó ń tọ́ka sí dídì aṣọ mọ́ra kí ó má bà a dí ẹni lọ́wọ́ nígbà iṣẹ́.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “títí tí mo fi jẹ, tí mo sì mu tán.” Ìtumọ̀ yìí tẹnumọ́ pé kí jíjẹ àti mímu ẹni náà parí kí àkókò ẹni kejì tó dé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Kàkà bẹ́ẹ̀, ṣé kò ní
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú, ó sì jẹ́ ìbéèrè tí a retí ìdáhùn rere sí. Èdè yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ἐρεῖ αὐτῷ
  choice: sọ fún un
  rationale: Ó pa ìṣe ‘sọ’ àti ẹni tí a ń bá sọ mọ́ láìfi ọ̀rọ̀ ‘ẹrú’ tàbí ‘ìránṣẹ́’ kún ẹsẹ náà.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Pèsè oúnjẹ alẹ́ mi
  rationale: δειπνέω tọ́ka sí jíjẹ oúnjẹ alẹ́ nínú àyíká yìí; ìtumọ̀ náà ṣe kedere, ó sì bá àṣẹ náà mu.
- source_word: περιζωσάμενος
  choice: di aṣọ rẹ mọ́ra
  rationale: Ó pa àwòrán dídì aṣọ mọ́ra fún iṣẹ́ mọ́, dípò pípa àwòrán àṣà náà rẹ́ patapata.
- source_word: διακόνει μοι
  choice: máa ṣe ìránṣẹ́ fún mi
  rationale: Níbí, ọ̀rọ̀ náà túmọ̀ sí ṣíṣe iṣẹ́ fún ẹni kan, pàápàá nígbà oúnjẹ; a kò lò ọ̀rọ̀ ìjọ tí kò yẹ sí àyíká náà.
- source_word: ἕως φάγω καὶ πίω
  choice: títí tí mo fi jẹ, tí mo sì mu
  rationale: Èyí tẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó tún lè tẹnumọ́ pé iṣẹ́ náà parí kí ìránṣẹ́ tó jẹ.
- source_word: μετὰ ταῦτα
  choice: lẹ́yìn náà
  rationale: Ó jẹ́ gbólóhùn àkókò Yorùbá tó rọrùn, tó sì péye.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: ìwọ yóò jẹ, ìwọ yóò sì mu
  rationale: Àwọn ọ̀rọ̀-ìṣe náà jẹ́ ọjọ́ iwájú; fífi ‘ìwọ’ hàn ní kedere pa ìtẹnumọ́ σύ mọ́.
theological_decisions:
- issue: Orúkọ ipò ẹni nínú àkàwé náà
  choice: A kò fi ‘ẹrú’ tàbí ‘ìránṣẹ́’ kún gẹ́gẹ́ bí orúkọ ẹni nínú ẹsẹ yìí; a lo arọ́pò-orúkọ bí Gíríìkì ṣe ṣe.
  alternative: Láti sọ ‘yóò sọ fún ìránṣẹ́ náà’ tàbí ‘fún ẹrú náà’ fún àlàyé sí i.
  rationale: Bó tilẹ̀ jẹ́ pé δοῦλος wà ní àyíká ẹsẹ tó ṣáájú, ẹsẹ yìí fúnra rẹ̀ lo αὐτῷ nìkan. Ìtumọ̀ náà kò gbọ́dọ̀ fi ọ̀rọ̀ tí kò sí sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn ọ̀rọ̀ àṣẹ àti ìtẹnumọ́ ‘ìwọ’ pa ìbáṣepọ̀ olúwa àti ẹni tó ń ṣe iṣẹ́ mọ́ láìfi orúkọ ipò kan kún ẹsẹ náà.
