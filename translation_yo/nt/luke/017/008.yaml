  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìbéèrè àfọwọ́yẹ Gíríìkì náà, àwọn àṣẹ méjèèjì, ìlànà àkókò ‘títí ... lẹ́yìn náà,’ àti ìtẹnumọ́ ẹni kejì. Síbẹ̀, ‘máa ṣe ìránṣẹ́ fún mi’ lè túmọ̀ sí kí ẹni náà di ìránṣẹ́ ẹni tí ń sọ̀rọ̀ tàbí kí ó máa ṣe iṣẹ́ déédéé, dípò iṣẹ́ ìtọ́jú níbi oúnjẹ tí διακόνει ń sọ.
  naturalness: ‘Dì aṣọ rẹ mọ́ra, kí o sì ṣe iṣẹ́ fún mi’ jẹ́ Yorùbá òde òní tó rọrùn, ó sì yẹ fún àṣẹ nínú àkàwé náà. Àmì ohùn ‘Dì’ tún yẹ kí ó hàn.
  terminology: A kò yẹ kí a fi ‘ìránṣẹ́’ hàn gẹ́gẹ́ bí orúkọ ipò ẹni nínú ẹsẹ, nítorí Gíríìkì nínú ẹsẹ yìí lo arọ́pò-orúkọ. ‘Ṣe iṣẹ́ fún mi’ ń fi ìṣe ìtọ́jú/ìsìn níbi oúnjẹ hàn láìsọ ọ́ di ọ̀rọ̀ ìjọ tàbí fífi ipò míì kún un.
