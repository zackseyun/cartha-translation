    rationale: Ó ní ìtumọ̀ ipò (‘be a servant to me’) àti ìṣe déédéé (‘keep serving’) ju àṣẹ láti sìn ẹni náà níbi oúnjẹ lọ. ‘ṣe iṣẹ́ fún mi’ dáa sí i ní àyíká yìí.
