  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: yo
  text: Mo sọ fún yín pé, ní òru náà, ènìyàn méjì yóò wà ní ibùsùn kan; a ó mú ọ̀kan[a], a ó sì fi èkejì sílẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “a ó mú ọ̀kan lọ.” Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ kò sọ níbí bóyá mímú náà jẹ́ fún ìgbàlà tàbí fún ìdájọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “a ó fi èkejì sílẹ̀ lẹ́yìn.” A lo “fi sílẹ̀” nínú ọ̀rọ̀ pàtàkì kí a má bàa fi èrò nípa àwọn ìṣẹ̀lẹ̀ ọjọ́ ìkẹyìn tí kò fara hàn gbangba nínú Gíríìkì kún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ọ̀rọ̀ ìfọkànsìn tààrà, ó sì pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ταύτῃ τῇ νυκτί
  choice: ní alẹ́ ọjọ́ náà
  rationale: Ó tọ́ka sí alẹ́ pàtó kan tí ọ̀rọ̀ náà ń sọ nípa rẹ̀; gbólóhùn yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἔσονται δύο
  choice: ènìyàn méjì yóò wà
  rationale: Orúkọ iye náà dúró fún ènìyàn méjì nínú àyíká ọ̀rọ̀ yìí; fífi “ènìyàn” hàn mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: lórí ibùsùn kan
  rationale: κλίνη lè túmọ̀ sí ibùsùn tàbí àga ìrọ̀gbọ̀kú; àyíká alẹ́ mú “ibùsùn” yẹ jù, “lórí” sì bá ἐπί mu.
- source_word: ὁ εἷς
  choice: ọ̀kan
  rationale: Yorùbá máa ń lo “ọ̀kan” ní ìfiwéra ẹni méjì báyìí láì nílò àfikún mìíràn.
- source_word: παραλημφθήσεται
  choice: a ó mú ọ̀kan
  rationale: Ọ̀rọ̀ ìṣe náà túmọ̀ sí mímú ẹni kan tàbí mímú un lọ pẹ̀lú ẹni; ìtumọ̀ kúkúrú yìí kò pinnu bóyá mímú náà jẹ́ fún ìgbàlà tàbí fún ìdájọ́.
- source_word: ὁ ἕτερος
  choice: èkejì
  rationale: “Èkejì” fi ẹni kejì nínú àwọn méjèèjì hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀφεθήσεται
  choice: a ó fi èkejì sílẹ̀
  rationale: Nínú ìtakora rẹ̀ sí παραλημφθήσεται, ọ̀rọ̀ náà túmọ̀ sí fífi ẹni náà sílẹ̀, kì í ṣe dídárí jì í; a kò fi àlàyé ẹ̀kọ́ ọjọ́ ìkẹyìn kún un.
theological_decisions:
- issue: Bóyá ẹni tí a mú ni a gbà là tàbí ni a mú lọ sí ìdájọ́, àti bóyá ẹni tí a fi sílẹ̀ ni ẹni rere tàbí ẹni tí a dá lẹ́bi
  choice: 'Ọ̀rọ̀ pàtàkì náà dúró láì yan ìtumọ̀ kan: “a ó mú ọ̀kan, a ó sì fi èkejì sílẹ̀.”'
  alternative: A lè ka ẹni tí a mú sí ẹni tí a gbà là, tàbí sí ẹni tí a mú lọ fún ìdájọ́.
  rationale: Àwọn ọ̀rọ̀ ìṣe Gíríìkì nínú ẹsẹ yìí fúnra wọn kò pinnu ọ̀ràn ẹ̀kọ́ náà; ìtumọ̀ náà pa àìdánilójú àti ìforígbárí ìtumọ̀ tó wà nínú orísun mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà rọrùn fún òǹkàwé gbogbogbò, ó sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
