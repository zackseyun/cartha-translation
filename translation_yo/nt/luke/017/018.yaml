  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: yo
  text: Ṣé a kò rí ẹnikẹ́ni tí ó padà láti fún Ọlọ́run ní ògo, bí kò ṣe àjèjì yìí nìkan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni láti orílẹ̀-èdè mìíràn yìí” tàbí “ẹni òde yìí”; ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àjèjì, ẹni tí kì í ṣe ọmọ Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: a kò rí ẹnikẹ́ni
  rationale: Èyí sọ ìbéèrè àsọyé inú ọ̀rọ̀ Gíríìkì ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé kò sí ẹlòmíràn tí a rí mọ́.
- source_word: ὑποστρέψαντες
  choice: tó padà wá
  rationale: Ó fi hàn pé ẹni náà yí padà, ó sì wá sí ọ̀dọ̀ Jésù, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: δοῦναι δόξαν
  choice: láti fi ògo fún
  rationale: ‘Fi ògo fún’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àkànlò èdè Bíbélì ‘fún ní ògo’ mọ́.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Ọlọ́run ni ìtumọ̀ àdánidá ti θεός níbi yìí.
- source_word: εἰ μὴ
  choice: àfi ... nìkan
  rationale: Àkójọpọ̀ yìí sọ ìyọkúrò náà ní Yorùbá tó ṣe kedere, ó sì tẹnumọ́ pé ẹni yìí nìkan ló padà.
- source_word: ἀλλογενής
  choice: àjèjì
  rationale: ‘Àjèjì’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni láti orílẹ̀-èdè tàbí ẹ̀yà mìíràn; àlàyé ìsàlẹ̀ sọ ìtumọ̀ ẹni òde sí Ísírẹ́lì di mímọ̀.
- source_word: οὗτος
  choice: yìí
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ atọ́ka Gíríìkì mọ́: ‘àjèjì yìí.’'
theological_decisions:
- issue: Ipò ọkùnrin tí a mú lára dá gẹ́gẹ́ bí ẹni òde ní ti ẹ̀yà àti ẹ̀sìn
  choice: àjèjì yìí
  alternative: ọkùnrin láti orílẹ̀-èdè mìíràn yìí; ẹni òde yìí
  rationale: Ọ̀rọ̀ náà tẹnumọ́ ìyàlẹ́nu pé ẹni òde sí Ísírẹ́lì ni ẹni kan ṣoṣo tó padà wá fi ògo fún Ọlọ́run. A kò fi ‘ará Samáríà’ sínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká ṣáájú ti sọ bẹ́ẹ̀.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. ‘Ṣé’ àti ‘tó’ jẹ́ àwọn ìkékúrú tó wọ́pọ̀ nínú Standard Yoruba, tí ó jẹ́ kí ìbéèrè àsọyé náà dùn bí ọ̀rọ̀ àdánidá láì sọ ọ́ di ọ̀rọ̀ ẹlẹ́gbẹ́.
