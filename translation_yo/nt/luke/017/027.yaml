id: LUK.17.27
reference: Luke 17:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: yo
  text: Wọ́n ń jẹun, wọ́n ń mu, wọ́n ń gbéyàwó, a sì ń fún wọn ní ọkọ tàbí aya[a], títí di ọjọ́ tí Nóà wọ inú ọkọ̀ áàkì. Ìkún omi sì dé, ó sì pa gbogbo wọn run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè sọ ọ́ ní ṣókí pé, “wọ́n ń gbéyàwó, wọ́n sì ń di ọkọ tàbí aya.” Gíríìkì ya ohun-ìṣe méjì sọ́tọ̀: ọ̀kan jẹ́ ohun-ìṣe aláṣe (“ń gbéyàwó”), èkejì sì jẹ́ ohun-ìṣe aláìṣe (“a ń fún wọn ní ọkọ tàbí aya”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον
  choice: Wọ́n ń jẹun
  rationale: Àkókò imperfect fi iṣẹ́ tí ó ń lọ tàbí tí ó jẹ́ àṣà hàn; “ń jẹun” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἔπινον
  choice: wọ́n ń mu
  rationale: “Ń mu” pa ìrísí imperfect mọ́, ó sì bá àtòjọ àwọn ohun tí wọ́n ń ṣe déédéé mu.
- source_word: ἐγάμουν
  choice: wọ́n ń gbéyàwó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún fífẹ́ ọkọ tàbí aya; kò fi akọ tàbí abo kún ohun tí ọ̀rọ̀ Gíríìkì fẹ́ sọ ní àyíká yìí.
- source_word: ἐγαμίζοντο
  choice: a sì ń fi wọ́n fún ni ní ìgbéyàwó
  rationale: Ìtumọ̀ yìí pa ìrísí passive àti ìyàtọ̀ rẹ̀ sí ἐγάμουν mọ́, láì sọ ẹni tí ó fi wọ́n fún ni ní pàtó.
- source_word: ἄχρι ἧς ἡμέρας
  choice: títí di ọjọ́ tí
  rationale: Gbólóhùn yìí fi ààlà àkókò àwọn ìṣe tí ń lọ hàn ní Yorùbá àdánidá.
- source_word: εἰσῆλθεν
  choice: wọ inú
  rationale: Ó sọ ìṣẹ̀lẹ̀ tí ó parí ní kedere, ó sì bá ohun èlò tí a ń wọ inú rẹ̀ mu.
- source_word: κιβωτόν
  choice: ọkọ̀ áàkì
  rationale: Nínú ìtàn Nóà, ọ̀rọ̀ náà tọ́ka sí áàkì pàtó, kì í ṣe ọkọ̀ ojú omi lásán.
- source_word: κατακλυσμός
  choice: ìkún omi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún omi ńlá tí ó bo ilẹ̀ nínú ìtàn Nóà.
- source_word: ἀπώλεσεν πάντας
  choice: pa gbogbo wọn run
  rationale: Ó mú ìparun àti gbogbo àwọn ènìyàn tí πάντας tọ́ka sí hàn ní kedere.
theological_decisions:
- issue: Ṣíṣe ìyàtọ̀ láàárín àwọn ọ̀rọ̀-ìṣe méjì nípa ìgbéyàwó
  choice: wọ́n ń gbéyàwó, a sì ń fi wọ́n fún ni ní ìgbéyàwó
  alternative: wọ́n ń gbéyàwó, wọ́n sì ń fẹ́ ọkọ tàbí aya
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe active kan àti passive kan. Ìtumọ̀ tí a yàn pa ìyàtọ̀ yẹn mọ́, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìrísí àwọn ọ̀rọ̀-ìṣe ìbẹ̀rẹ̀
  choice: lílò “ń” jálẹ̀ fún àwọn ìṣe tí ń lọ
  alternative: lílò ọ̀rọ̀-ìṣe àtẹ̀yìnwá gẹ́gẹ́ bí ìṣẹ̀lẹ̀ kọ̀ọ̀kan tí ó parí
  rationale: Àwọn imperfect inú Gíríìkì ṣàpẹẹrẹ ìgbésí ayé ojoojúmọ́ tí ó ń bá a lọ títí ìdájọ́ fi dé lójijì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó sì ní iyì. Àmì ohùn wà níbi tí ó yẹ. “Nígbà náà ni” jẹ́ kí ìtẹ̀síwájú ìtàn lẹ́yìn ààlà “títí di ọjọ́” ṣe kedere, láì yí ìtumọ̀ orísun padà.
