  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: yo
  text: Àwọn àpọ́sítélì sì sọ fún Olúwa pé, “Mú ìgbàgbọ́[b] wa pọ̀ sí i.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Fi ìgbàgbọ́ kún wa.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “fikún” ní gangan, ṣùgbọ́n níbí ó túmọ̀ sí “mú ... pọ̀ sí i.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye “ìgbàgbọ́” gẹ́gẹ́ bí “ìgbẹ́kẹ̀lé”; ohun tí kò ṣeé ṣe tó níbí ni “ìṣòtítọ́,” bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ yẹn nínú àwọn àyíká kan.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bójú mu, ó sì pa ìsopọ̀ rọrùn tí Καὶ ní mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: εἶπαν
  choice: sọ
  rationale: Ọ̀rọ̀-ìṣe aorist náà ń tọ́ka sí ìṣe kan nínú ìtàn; “sọ” ni ọ̀nà Yorùbá àdánidá láti túmọ̀ ọ́ níbí.
- source_word: οἱ ἀπόστολοι
  choice: àwọn àpọ́sítélì
  rationale: Èyí ni ọ̀rọ̀ tí a ti mọ̀ sí rere fún àwọn tí Jésù rán ní àṣẹ, ó sì bá lílo rẹ̀ nínú Lúùkù–Ìṣe àwọn Àpọ́sítélì mu.
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: “Olúwa” pa ìtumọ̀ oyè ọ̀wọ̀ àti ìjìnlẹ̀ ìtọ́kasí sí Kristi mọ́; “sọ fún” sì jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó bá dative náà mu.
- source_word: Πρόσθες
  choice: Mú ... pọ̀ sí i
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ọ̀rọ̀ náà ni “fikún,” pẹ̀lú πίστιν ó túmọ̀ sí fífi ìwọ̀n ohun tó ti wà tẹ́lẹ̀ pọ̀ sí i. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìbéèrè náà.
- source_word: ἡμῖν
  choice: wa
  rationale: Dative “sí wa” ni Gíríìkì ní gangan, ṣùgbọ́n nínú gbólóhùn Yorùbá “ìgbàgbọ́ wa” ló sọ ìbáṣepọ̀ náà ní kedere àti lọ́nà àdánidá.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ó ṣeé ṣe jù lọ pé ọ̀rọ̀ náà ń tọ́ka sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé àwọn àpọ́sítélì, kì í ṣe ìṣòtítọ́ wọn; “ìgbàgbọ́” sì pa ìtumọ̀ ẹ̀sìn rẹ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tó ń tọ́ka sí Jésù
  choice: Olúwa
  alternative: ọ̀gá
  rationale: “Olúwa” jẹ́ oyè àdánidá nínú àyíká yìí, ó sì pa ìtumọ̀ Kristológì tí ọ̀rọ̀ náà lè ní nínú Lúùkù mọ́; “ọ̀gá” lè dín ìjìnlẹ̀ oyè náà kù.
- issue: Bí a ṣe túmọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ tó ṣeé ṣe jù lọ fún ohun tí àwọn àpọ́sítélì ń béèrè pé kí ó pọ̀ sí i. “Ìgbẹ́kẹ̀lé” lè ṣàlàyé apá kan nínú rẹ̀, nígbà tí “ìṣòtítọ́” jẹ́ ìtumọ̀ tó ṣeé ṣe fún ọ̀rọ̀ náà ní àwọn àyíká mìíràn ṣùgbọ́n tí kò ṣeé ṣe tó níbí.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A yan “àpọ́sítélì” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀sìn tí ó ti wọ́pọ̀, “Olúwa” fún κύριος, àti ìṣètò àdánidá “Mú ìgbàgbọ́ wa pọ̀ sí i” láìsọ ìtumọ̀ Gíríìkì di pàtó ju bí ó ti rí lọ.
