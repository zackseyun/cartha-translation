source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: yo
  text: Bí ó ti ń wọ abúlé kan, àwọn ọkùnrin mẹ́wàá tí àrùn ẹ̀tẹ̀ ń ṣe[a] pàdé rẹ̀, wọ́n sì dúró ní ibi jíjìnnà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì wí pé, ‘àwọn ọkùnrin mẹ́wàá ẹlẹ́tẹ̀.’ Ó lo ọ̀rọ̀ àpèjúwe fún wọn, kì í ṣe orúkọ àyẹ̀wò ìṣègùn òde òní tó péye.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘láti òkèrè.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: bí ó sì ti ń wọ
  rationale: Ọ̀rọ̀ participle tó wà ní present nínú genitive absolute fi hàn pé wíwọlé náà ń lọ lọ́wọ́ nígbà tí ìpàdé ṣẹlẹ̀; ‘bí ó ti ń wọ’ pa ìtumọ̀ yìí mọ́ ní Yorùbá àdánidá.
- source_word: εἴς τινα κώμην
  choice: ìletò kan
  rationale: ‘Kan’ fi àìsọ pàtó ti τινα hàn, ‘ìletò’ sì bá κώμη, ìyẹn ibi kékeré ju ìlú ńlá lọ, mu.
- source_word: ἀπήντησαν
  choice: pàdé rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ‘pàdé’ mu láìfi ìṣípò tí ọ̀rọ̀ Gíríìkì kò fi dandan mú kún un.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: àwọn ọkùnrin mẹ́wàá tí àrùn ẹ̀tẹ̀ ń ṣe
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì bọ̀wọ̀ fún àwọn ènìyàn náà ju lílo ‘ẹlẹ́tẹ̀’ gẹ́gẹ́ bí orúkọ wọn lọ. Àlàyé ìsàlẹ̀ ṣàkíyèsí pé Gíríìkì lo àpèjúwe adjectival, kì í ṣe àyẹ̀wò ìṣègùn òde òní tó péye.
- source_word: οἳ ἔστησαν
  choice: wọ́n dúró
  rationale: Ó pa ìṣe rírọrùn ἔστησαν mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣàn dáadáa lẹ́yìn àmì àárín gbólóhùn.
- source_word: πόρρωθεν
  choice: ní òkèrè
  rationale: ‘Ní òkèrè’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún jíjẹ́ ní ibi tó jìnnà sí ẹni mìíràn; kò sọ ìwọ̀n jíjìnnà tó ju ti ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àpèjúwe àìsàn λεπροί
  choice: àwọn ọkùnrin mẹ́wàá tí àrùn ẹ̀tẹ̀ ń ṣe
  alternative: àwọn ọkùnrin mẹ́wàá ẹlẹ́tẹ̀
  rationale: Àṣàyàn náà pa àìsàn gẹ́gẹ́ bí àpèjúwe àwọn ọkùnrin náà mọ́, ṣùgbọ́n kò sọ àìsàn náà di gbogbo ìdánimọ̀ wọn. Ó tún yẹra fún fífi ìtumọ̀ ìṣègùn òde òní tóóró kan ohun tí ọ̀rọ̀ ayé àtijọ́ lè gbòòrò sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbo. A gbe àmì [a] sí lẹ́yìn àpèjúwe àìsàn, níbi tí àlàyé rẹ̀ ti tọ́ sí, dípò lẹ́yìn ‘ìletò kan.’
