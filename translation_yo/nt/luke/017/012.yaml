  to: Bí ó ti ń wọ abúlé kan, àwọn ọkùnrin mẹ́wàá tí àrùn ẹ̀tẹ̀ ń ṣe[a] pàdé rẹ̀, wọ́n sì dúró ní ibi jíjìnnà[b].
