source:
  edition: robinson-pierpont-2005-byzantine
  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: yo
  text: Ènìyàn méjì[a] yóò wà ní oko; a ó mú ọ̀kan lọ, a ó sì fi èkejì sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì àtijọ́ jù lọ (tó fi mọ́ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin) tàbí nínú àwọn ìtumọ̀ Coptic ìgbàanì. Síbẹ̀, ó wà nínú àṣà ọ̀rọ̀ Ìwọ̀ Oòrùn (gẹ́gẹ́ bí Codex Bezae ti ọ̀rúndún karùn-ún), nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ Byzantine, àti nínú Vulgate Látìn. Ó ṣeé ṣe kí àwọn akọ̀wé tó wá lẹ́yìn fi kún un láti mú un bá Mátíù 24:40 mu.
    reason: textual_critical
lexical_decisions:
- source_word: παραλαμβάνω
  choice: mú … lọ
  rationale: Nínú àyíká ọ̀rọ̀ nípa ohun tí yóò ṣẹlẹ̀ ní òpin, gbólóhùn yìí túmọ̀ sí mímú ẹnì kan lọ tàbí kíkó o mọ́ra; ó sì tako fífi ẹnì kejì sílẹ̀. Àṣàyàn yìí kò pinnu ibi tí a mú ẹni náà lọ.
- source_word: ἀφίημι
  choice: fi … sílẹ̀
  rationale: Ó túmọ̀ sí fífi ẹnì kan sílẹ̀, ní ìtakò tààrà sí mímú ẹnì kejì lọ.
- source_word: ἕτερος
  choice: èkejì
  rationale: Nítorí pé ẹni méjì ni a mẹ́nu kàn, ọ̀rọ̀ náà tọ́ka sí ẹni kejì nínú wọn.
- source_word: δύο
  choice: èèyàn méjì
  rationale: Gíríìkì sọ ‘méjì’ láì sọ akọ tàbí abo; ‘èèyàn méjì’ pa ìtumọ̀ yẹn mọ́, kò sì fi kún un pé ọkùnrin ni wọ́n.
theological_decisions:
- issue: Ìtumọ̀ ẹni tí a mú lọ àti ẹni tí a fi sílẹ̀
  choice: Pa ìtumọ̀ náà mọ́ láì sọ pé ẹni tí a mú lọ ni a gbà là tàbí dá lẹ́jọ́.
  alternative: Ṣàlàyé mímú lọ gẹ́gẹ́ bí ìgbàlà tàbí ìdájọ́.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ibi tí a mú ẹni náà lọ tàbí ohun tí yóò ṣẹlẹ̀ sí i; nítorí náà, a kò yẹ kí ìtumọ̀ yanju àìdájú náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ní oko’ fún ἐν τῷ ἀγρῷ, àti ìṣètò aláìní ẹni pàtó ‘a ó mú … a ó sì fi …’ láti ṣàfihàn àwọn ọ̀rọ̀-ìṣe Gíríìkì tó wà ní passive láì sọ ẹni tó ṣe ìṣe náà.
