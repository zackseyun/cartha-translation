  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: yo
  text: Àwọn obìnrin méjì yóò máa lọ ọlọ papọ̀[a]; a ó mú ọ̀kan lọ[b], ṣùgbọ́n a ó fi èkejì sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ibi kan náà.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí “papọ̀” tàbí “ní ibi kan náà.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “a ó mú ... lọ” fúnra rẹ̀ kò sọ bóyá mímú náà jẹ́ fún ìgbàlà tàbí fún ìdájọ́; Gíríìkì fi ìbéèrè náà sílẹ̀ fún àyíká ọ̀rọ̀ tó gbòòrò jù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: Àwọn obìnrin méjì yóò máa wà / yóò máa lọ ọlọ
  rationale: Ọ̀rọ̀ náà gbé ìṣẹ̀lẹ̀ ọjọ́ iwájú kalẹ̀; abo nínú ἀλήθουσαι fi hàn pé obìnrin ni àwọn méjèèjì.
- source_word: ἀλήθουσαι
  choice: máa lọ ọlọ
  rationale: Ó túmọ̀ sí iṣẹ́ lílọ oúnjẹ tàbí ọkà; ‘lọ ọlọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láìfi ‘ọkà’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐπὶ τὸ αὐτό
  choice: papọ̀
  rationale: Gbólóhùn náà lè túmọ̀ sí pé wọ́n ń ṣe é papọ̀ tàbí pé wọ́n wà ní ibi kan náà; ‘papọ̀’ bá èdè Yorùbá mu jù lọ nínú ọ̀rọ̀ yìí.
- source_word: ἡ μία παραλημφθήσεται
  choice: a ó mú ọ̀kan lọ
  rationale: Ìṣe aláìlẹ́ni tó ṣe é nínú Gíríìkì ni a pa mọ́ pẹ̀lú ‘a ó’; ‘mú ... lọ’ kò sọ bóyá ìgbàlà tàbí ìdájọ́ ni mímú náà túmọ̀ sí.
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: ṣùgbọ́n a ó fi èkejì sílẹ̀
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ δέ jáde, ‘fi ... sílẹ̀’ sì jẹ́ ìtumọ̀ tààrà tí kò fi èrò ‘kọ̀ sílẹ̀’ tàbí ‘pa mọ́’ kún un.
theological_decisions:
- issue: Bóyá ẹni tí a mú lọ ni a gbà là tàbí ni a mú lọ fún ìdájọ́, àti bóyá ẹni tí a fi sílẹ̀ ló rí ìgbàlà tàbí ìdájọ́.
  choice: A ó mú ọ̀kan lọ, ṣùgbọ́n a ó fi èkejì sílẹ̀.
  alternative: A ó mú ọ̀kan lọ fún ìdájọ́, a ó dá èkejì sí; tàbí a ó mú ọ̀kan lọ sí ìgbàlà, a ó fi èkejì sílẹ̀ fún ìdájọ́.
  rationale: Ẹsẹ yìí fúnra rẹ̀ sọ ìyapa náà nìkan; kò pinnu ní tààrà ohun rere tàbí ohun búburú tí ọ̀kọ̀ọ̀kan túmọ̀ sí. Ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ inú àyíká ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá àkànṣe, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Máa lọ ọlọ’ jẹ́ gbólóhùn iṣẹ́ ojoojúmọ́ tó mọ́gbọ́n dání; ìṣe aláìlẹ́ni tó ṣe é (‘a ó’) pa ìrísí passive Gíríìkì mọ́ láìdá ẹni tó mú wọn lọ lórúkọ.
