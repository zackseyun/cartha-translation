id: LUK.17.16
reference: Luke 17:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: yo
  text: Ó sì dojúbolẹ̀ ní ẹsẹ̀ rẹ̀, ó ń dúpẹ́ lọ́wọ́ rẹ̀. Ará Samáríà sì ni ọkùnrin náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: ó sì dojúbolẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó ṣubú tàbí ó rẹ ara rẹ̀ sílẹ̀; pẹ̀lú ἐπὶ πρόσωπον, “dojúbolẹ̀” fi ìṣesí ìrẹ̀lẹ̀ náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐπὶ πρόσωπον
  choice: dojúbolẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ṣàpèjúwe ẹni tí ojú rẹ̀ dojú kọ ilẹ̀. Yorùbá “dojúbolẹ̀” mú ìtumọ̀ ìṣesí ara náà jáde láìfi àlàyé kún un.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: ní ẹsẹ̀ rẹ̀
  rationale: Nínú àyíká ìforíbalẹ̀ yìí, gbólóhùn náà túmọ̀ sí pé ó wà lẹ́gbẹ̀ẹ́ tàbí níwájú ẹsẹ̀ Jesu; “ní ẹsẹ̀ rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: εὐχαριστῶν αὐτῷ
  choice: ó ń dúpẹ́ lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí fi ìṣe tó ń lọ papọ̀ pẹ̀lú dídojúbolẹ̀ hàn. “Dúpẹ́ lọ́wọ́ rẹ̀” jẹ́ àdánidá, ó sì pa ẹni tí a dúpẹ́ lọ́wọ́ mọ́.
- source_word: Σαμαρίτης
  choice: Ará Samáríà
  rationale: Èyí ni orúkọ ìdánimọ̀ ẹ̀yà àti ẹ̀sìn ẹni láti Samáríà ní Yorùbá, ó sì pa ìjẹ́pàtàkì rẹ̀ nínú ìtàn náà mọ́.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Ará Samáríà sì ni ọkùnrin náà
  rationale: Fífì “ọkùnrin náà” sí ipò ìtẹnumọ́ ṣe àfihàn agbára αὐτός, láìfi ìtumọ̀ àlàyé míì kún gbólóhùn náà.
theological_decisions:
- issue: Ìtẹnumọ́ ìdánimọ̀ ọkùnrin tí a mú láradá
  choice: Ará Samáríà sì ni ọkùnrin náà
  alternative: Ó sì jẹ́ ará Samáríà
  rationale: Yíyí ìtòlẹ́sẹẹsẹ gbólóhùn padà fi ìdánimọ̀ rẹ̀ hàn gẹ́gẹ́ bí ìròyìn pàtàkì, ṣùgbọ́n kò ṣàlàyé tàbí tú ìforígbárí láwùjọ àti nínú ẹ̀kọ́ ìgbàgbọ́ tí ìtàn náà ní.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn pípé níbi tó yẹ, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “dojúbolẹ̀” fún ìṣesí ìforíbalẹ̀, a sì pa àṣírí ìtẹnumọ́ ìdánimọ̀ ará Samáríà mọ́.
