  source_fidelity: The translation accurately conveys the prostration before Jesus' feet, the concurrent act of thanking him, and the climactic identification of the man as a Samaritan. “Dójúbolẹ̀” idiomatically combines the sense of falling and being face-down without adding interpretive content.
