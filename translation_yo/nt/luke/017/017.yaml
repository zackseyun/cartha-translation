  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: yo
  text: 'Nígbà náà ni Jésù dáhùn pé: “Àwọn mẹ́wàá kọ́ ni a sọ di mímọ́ bí? Ṣùgbọ́n àwọn mẹ́sàn-án náà wà níbo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Nígbà náà ni Jésù dáhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà Gíríìkì tí ó wọ́pọ̀ láti bẹ̀rẹ̀ ọ̀rọ̀ ẹni. ‘Dáhùn pé’ jẹ́ Yorùbá àdánidá, ‘nígbà náà’ sì fi ìtẹ̀síwájú ìtàn tí δέ ní hàn.
- source_word: Οὐχὶ
  choice: kọ́ ... bí?
  rationale: Οὐχί bẹ̀rẹ̀ ìbéèrè tí ó ń retí ìdáhùn bẹ́ẹ̀ ni; ìṣètò Yorùbá ‘kọ́ ... bí?’ pa agbára ìbéèrè àsọyé náà mọ́.
- source_word: οἱ δέκα
  choice: Àwọn mẹ́wàá
  rationale: Ó tọ́ka sí ẹgbẹ́ mẹ́wàá tí a ti mọ̀ nínú àyíká ọ̀rọ̀, láìfi ìtẹnumọ́ ‘gbogbo’ kún un.
- source_word: ἐκαθαρίσθησαν
  choice: a sọ di mímọ́
  rationale: Ìṣe àìṣe taara yìí túmọ̀ sí fífi wọ́n di mímọ́. Yíyan ‘sọ di mímọ́’ pa ìtumọ̀ ìwòsàn àti ìmímọ́ nípa àṣà ẹ̀sìn mọ́, dípò dín un kù sí ‘wò sàn’ nìkan.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Àwọn mẹ́sàn-án yòókù ha dà?
  rationale: δέ fi ìyàtọ̀ àwọn mẹ́sàn-án sí ẹni kan tí ó padà hàn. ‘Yòókù’ mú ìtọ́kasí ẹgbẹ́ tó ṣẹ́ kù ṣe kedere, ‘ha dà?’ sì jẹ́ ìbéèrè Yorùbá àdánidá nípa ibi tí wọ́n wà.
theological_decisions:
- issue: Ìtumọ̀ καθαρίζω nínú ìwòsàn àwọn adẹ́tẹ̀
  choice: a sọ di mímọ́
  alternative: a mú lára dá; a wò sàn
  rationale: καθαρίζω ní pàtó ni ‘sọ di mímọ́,’ ó sì lè ní ìtumọ̀ ìmímọ́ nípa àṣà ẹ̀sìn àti ìmúpadàbọ̀sípò ara nínú ọ̀rọ̀ adẹ́tẹ̀. Ìtumọ̀ yìí pa àwọn ìpele méjèèjì mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo ‘mẹ́wàá’ àti ‘mẹ́sàn-án’ gẹ́gẹ́ bí ọ̀nà ìṣírò tí ó wọ́pọ̀.
