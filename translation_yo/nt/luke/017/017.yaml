revisions:
- from: Nígbà náà ni Jésù dáhùn pé, “Àwọn mẹ́wàá kọ́ ni a sọ di mímọ́ bí? Àwọn mẹ́sàn-án yòókù ha dà?”
  to: 'Nígbà náà ni Jésù dáhùn pé: “Àwọn mẹ́wàá kọ́ ni a sọ di mímọ́ bí? Ṣùgbọ́n àwọn mẹ́sàn-án náà wà níbo?”'
  rationale: The revision retains the draft’s appropriate rendering of the narrative progression, rhetorical negative question, and cleansing terminology. It corrects the final question so that it explicitly asks for the location of the nine, as ποῦ requires, while “Ṣùgbọ́n” conveys the contrast marked by δέ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus' speech, the affirmative-expected rhetorical question, the known group of ten, and καθαρίζω as being made clean. However, “Àwọn mẹ́sàn-án yòókù ha dà?” does not faithfully express Greek ποῦ (“where?”); “dà?” ordinarily asks about manner/state (for example, “how is it?”), not location.
  naturalness: “Nígbà náà ni Jésù dáhùn pé” and “Àwọn mẹ́wàá kọ́ ni a sọ di mímọ́ bí?” are natural Standard Yoruba. Replacing the final clause with an explicit locative question makes the saying idiomatic and immediately clear.
  terminology: “a sọ di mímọ́” suitably preserves the cleansing language of ἐκαθαρίσθησαν, including its physical and ceremonial associations, without reducing it to healing. “Àwọn mẹ́sàn-án náà” refers naturally to the remaining nine without adding unnecessary interpretive emphasis.
  issues:
  - severity: medium
    issue: The phrase “Àwọn mẹ́sàn-án yòókù ha dà?” does not mean “But where are the nine?”
    rationale: The source word ποῦ is a locative interrogative. Yoruba “dà?” is not a natural locative question here. “wà níbo?” directly and idiomatically renders “where are [they]?”
  - severity: low
    issue: “yòókù” is not required in the translation.
    rationale: Although contextually true, “the remaining” is not stated in the Greek. “náà” provides an anaphoric reference to the nine while retaining the source's concision.
  revised_text: 'Nígbà náà ni Jésù dáhùn pé: “Àwọn mẹ́wàá kọ́ ni a sọ di mímọ́ bí? Ṣùgbọ́n àwọn mẹ́sàn-án náà wà níbo?”'
  revised_footnotes: []
