lexical_decisions:
- source_word: μνημονεύετε
  choice: Ẹ rántí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Ẹ rántí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa agbára ìkìlọ̀ tààrà mọ́.
- source_word: τῆς γυναικὸς
  choice: aya
  rationale: Bí ó tilẹ̀ jẹ́ pé γυνή lè túmọ̀ sí “obìnrin” tàbí “aya,” ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ Lọ́ọ̀tì fi hàn pé “aya” ni ìtumọ̀ tó yẹ níbí.
- source_word: Λώτ
  choice: Lọ́ọ̀tì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Lọ́ọ̀tì ní Yorùbá.
theological_decisions:
- issue: Ìrísí ìkìlọ̀ àti ìtọ́kasí sí ìtàn Gẹnẹsisi
  choice: 'Àṣẹ kúkúrú, tààrà: “Ẹ rántí aya Lọ́ọ̀tì.”'
  alternative: “Ẹ rántí aya ti Lọ́ọ̀tì.”
  rationale: Ọ̀rọ̀ náà tọ́ka sí Gẹnẹsisi 19:26 gẹ́gẹ́ bí ìkìlọ̀. Ìtumọ̀ yìí pa kúkúrú àti agbára àṣẹ inú Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá àkànṣe, tí ó ní ọ̀wọ̀, tó sì rọrùn fún òǹkàwé òde òní. A lo “Ẹ” nítorí àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn; a fi àmì ohùn sí ibi tí ó bá àkọtọ́ Yorùbá mu.
