  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: yo
  text: Ó sàn fún un bí a bá ti so òkúta ọlọ kan mọ́ ọrùn rẹ̀, tí a sì ti jù ú sínú òkun, ju kí ó mú ọ̀kan nínú àwọn kékeré wọ̀nyí kọsẹ̀ lọ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i, “òkúta ọlọ ńlá.” Gbólóhùn Gíríìkì náà lè tọ́ka sí òkúta ọlọ tóbi, tí ó wúwo, èyí tí a ń lò nínú ọlọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú kí ọ̀kan nínú àwọn kékeré wọ̀nyí dẹ́ṣẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí mímú ẹnì kan ṣubú sínú ẹ̀ṣẹ̀ tàbí ìparun tẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Ó sàn fún un
  rationale: Ọ̀rọ̀ yìí fi hàn pé àbájáde kan dára tàbí yẹra fún ju èkejì lọ; ‘Ó sàn fún un’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ìfiwéra náà mọ́.
- source_word: λίθος μυλικὸς
  choice: òkúta ọlọ
  rationale: Èyí ni òkúta tí a fi ń lọ nǹkan; ọ̀rọ̀ àkọ́kọ́ kò fi dandan sọ irú ọlọ pàtó, nítorí náà àlàyé nípa òkúta ọlọ ńlá wà nínú àlàyé ìsàlẹ̀.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: kí a so ... mọ́ ọn ní ọrùn
  rationale: Èyí sọ ipò òkúta tí a fi mọ́ ọrùn ẹni náà ní Yorùbá tí ó ṣe kedere, bó tilẹ̀ jẹ́ pé Gíríìkì tẹnumọ́ bí ó ti wà yí ọrùn ká.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: kí a sì jù ú sínú òkun
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe-olùṣe àti iṣẹ́ jíju sínú òkun mọ́, ó sì bá ìṣètò gbólóhùn Yorùbá mu.
- source_word: σκανδαλίσῃ
  choice: mú ... kọsẹ̀
  rationale: ‘Mú ... kọsẹ̀’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí mímú ẹni ṣubú sínú ẹ̀ṣẹ̀ tàbí ìparun nípa tẹ̀mí; àlàyé ìsàlẹ̀ mú ìtumọ̀ náà ṣe kedere.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: ọ̀kan nínú àwọn kékeré wọ̀nyí
  rationale: Ìtumọ̀ gígùn-gígùn yìí kò dín ẹni tí gbólóhùn náà ń tọ́ka sí kù sí àwọn ọmọdé tàbí àwọn onígbàgbọ́ nìkan.
- source_word: ἢ ἵνα
  choice: ju kí ... lọ
  rationale: Èyí ni àkójọpọ̀ ìfiwéra Yorùbá tí ó ṣe àdánidá, tí ó sì fi àbájáde méjèèjì wé ara wọn.
theological_decisions:
- issue: Ẹni tí ‘àwọn kékeré wọ̀nyí’ ń tọ́ka sí
  choice: àwọn kékeré wọ̀nyí
  alternative: àwọn ọmọdé wọ̀nyí; àwọn ọmọ-ẹ̀yìn tàbí onígbàgbọ́ onírẹ̀lẹ̀ wọ̀nyí
  rationale: Ọ̀rọ̀ Gíríìkì kò dá ẹgbẹ́ náà mọ́ ní pàtó ju pé wọ́n jẹ́ ‘kékeré’ lọ. Ìtumọ̀ náà pa ààyè ìtumọ̀ yìí mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘òkúta ọlọ’ àti ‘mú ... kọsẹ̀’ láti pa àwòrán orísun mọ́, nígbà tí àwọn àlàyé ìsàlẹ̀ ń ṣàlàyé àwọn ìtumọ̀ tó ṣeé ṣe.
