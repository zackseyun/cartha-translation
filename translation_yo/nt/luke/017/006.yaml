  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn èrò pàtàkì Gíríìkì mọ́: κύριος = “Olúwa,” πίστις = “ìgbàgbọ́,” àfiwé irúgbìn músítádì, igi συκάμινος, àti ìpìlẹ̀ ìṣe-àfojúsùn tí ἄν ń fi hàn. Ṣùgbọ́n “Kí a fà ọ́ tu” yí àṣẹ palolo sí ìpè sí ‘àwa’ láti ṣe ìṣe náà, ó sì kéré sí ìtumọ̀ Ἐκριζώθητι.'
