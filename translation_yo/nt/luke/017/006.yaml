  terminology: “Igi mólábẹ́rì” lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ òde òní fún mulberry; àlàyé “igi sikamínì” ń pa àṣàyàn ìtumọ̀ ìbílẹ̀ mọ́. “Òkun” ni a kọ́ pẹ̀lú àmì ohùn.
