id: LUK.17.6
reference: Luke 17:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: yo
  text: Olúwa sì sọ pé, “Bí ẹ bá ní ìgbàgbọ́ bí irúgbìn músítádì, ẹ ìbá sọ fún igi mólábẹ́rì yìí[a] pé, ‘Tu ara rẹ kúrò ní gbòǹgbò, kí o sì gbìn ara rẹ sínú òkun,’ ó sì ìbá gbọ́ tiyín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú ọ̀rọ̀ Gíríìkì náà sí ‘igi sikamínì,’ bí a ti máa ń pè é ní ìtumọ̀ àtijọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Ó pa àkọ́lé ìtàn àti ìtumọ̀ Kristi mọ́; ‘Olúwa’ ni ọ̀nà Yorùbá tí ó bójú mu jù fún κύριος ní àyíká yìí.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Ní ọ̀rọ̀ yìí, πίστις ń tọ́ka sí ìgbẹ́kẹ̀lé tàbí ìgbàgbọ́ nínú Ọlọ́run, kì í ṣe ìṣòtítọ́ gẹ́gẹ́ bí ìwà.
- source_word: ὡς κόκκον σινάπεως
  choice: bí irúgbìn músítádì
  rationale: ‘Bí’ pa àfiwé ὡς mọ́ láì fi kún un pé kìkì kékeré irúgbìn náà ni Jesu ń tẹnumọ́.
- source_word: συκαμίνῳ
  choice: igi mólábẹ́rì
  rationale: συκάμινος jẹ́ igi mólábẹ́rì; èyí yé òǹkàwé Yorùbá òde òní ju títú orúkọ Gíríìkì náà jáde lọ.
- source_word: ἐλέγετε ἂν
  choice: ẹ̀yin ì bá sọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà fi ìṣe tí ó lè ṣẹlẹ̀ lábẹ́ ipò kan hàn; ‘ì bá sọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ἄν yìí hàn.
- source_word: Ἐκριζώθητι
  choice: Kí a fà ọ́ tu láti gbòǹgbò
  rationale: Èyí fi pàṣẹ aláìṣe-fúnra-ẹni hàn ní Yorùbá àdánidá, ó sì pa àwòrán gbígbé ohun náà tu láti gbòǹgbò mọ́.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: kí a sì gbìn ọ́ sínú òkun
  rationale: Ó pa àwòrán alágbára, àjèjì ti fífi igi sínú òkun mọ́, láì túmọ̀ ‘gbìn’ sí ‘gbé lọ gbìn níbòmíràn.’
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: òun ì bá sì gbọ́ tiyín
  rationale: ‘Gbọ́ ti’ túmọ̀ sí ṣíṣe ohun tí a pàṣẹ, ó sì bá ìsọ̀rọ̀ àṣẹ sí igi náà mu.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ nípa iṣẹ́ ìyanu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká náà dá lórí ìgbẹ́kẹ̀lé tí ó dojú kọ ohun tí ó dàbí ẹni pé kò ṣeé ṣe. ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láì sọ ọ́ di ìṣòtítọ́ ìwà.
- issue: Iru ipò tí gbólóhùn Εἰ ἔχετε ... ἄν ń sọ
  choice: Bí ẹ̀yin bá ní ... ẹ̀yin ì bá sọ
  alternative: Bí ẹ̀yin bá ní ... ẹ lè sọ
  rationale: ‘Ì bá’ fi agbára ìṣe tí ó sinmi lórí ipò hàn, bí ἄν ṣe ń ṣe, ṣùgbọ́n ‘bá ní’ kò dá a lẹ́jọ́ pátápátá pé wọn kò ní ìgbàgbọ́ rárá; ó tipa bẹ́ẹ̀ pa ìfọ̀rọ̀wérọ̀ inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Àmì àlàyé [a] wà lẹ́gbẹ̀ẹ́ ‘igi mólábẹ́rì,’ ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé, kì í ṣe lẹ́gbẹ̀ẹ́ ‘Olúwa.’
