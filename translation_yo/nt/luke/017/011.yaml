source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń lọ sí Jerúsálẹ́mù, ó ń kọjá láàárín Samáríà àti Gálílì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “ó ń kọjá ní agbègbè ààlà láàárín Samáríà àti Gálílì.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí pé ó ń rìn láàárín àwọn agbègbè méjèèjì tàbí pé ó ń gba agbègbè ààlà tó yà wọ́n sọ́tọ̀ kọjá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà ìṣípayá ìṣẹ̀lẹ̀ tí Lúùkù sábà máa ń lò; gbolohun yìí jẹ́ Yorùbá òde òní tí ó sì pa iṣẹ́ ìtàn náà mọ́.
- source_word: ἐν τῷ πορεύεσθαι
  choice: bí ó ti ń lọ
  rationale: Ó fi hàn pé ìrìnàjò náà ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ yìí, gẹ́gẹ́ bí articular infinitive pẹ̀lú ἐν ṣe túmọ̀ sí àkókò tí ó jọra.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́mù
  rationale: εἰς tọ́ka sí ibi tí ìrìnàjò ń lọ; “sí” ni ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: αὐτός
  choice: ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn ní Gíríìkì, ṣùgbọ́n fífi “òun fúnra rẹ̀” kún un yóò fi ìtẹnumọ́ tí kò pọndandan sí i ní Yorùbá.
- source_word: διήρχετο
  choice: ó ń gba … kọjá
  rationale: Àmì imperfect fi ìgbésẹ̀ tí ń bá a lọ hàn; “ń gba … kọjá” pa ìtumọ̀ ìrìnàjò tí ń lọ lọ́wọ́ mọ́.
- source_word: διὰ μέσον
  choice: àárín
  rationale: Gbólóhùn Gíríìkì náà lè túmọ̀ sí àgbègbè àárín àwọn agbègbè méjèèjì tàbí líla la àárín wọn; “àárín” pa àìdánilójú náà mọ́.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: Samáríà àti Gálílì
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ ibi náà ní ìlànà tí Gíríìkì gbé wọn kalẹ̀, pẹ̀lú àmì ohùn Yorùbá tó bá ìpè wọn mu.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò. A pa ìlànà ìtàn Lúùkù àti ìṣe tí ń lọ lọ́wọ́ mọ́, a sì fi àlàyé ìtumọ̀ méjì ti διὰ μέσον sínú àlàyé ìsàlẹ̀.
