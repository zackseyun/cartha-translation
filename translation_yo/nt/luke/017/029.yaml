source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: yo
  text: Ṣùgbọ́n ní ọjọ́ tí Lọ́ọ̀tì jáde kúrò ní Sódómù, iná àti súlfúrì[a] rọ̀ láti ọ̀run, wọ́n sì pa gbogbo wọn run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìtumọ̀ ìbílẹ̀, “iná àti imí-ọjọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Ṣùgbọ́n ní ọjọ́ tí
  rationale: Gbólóhùn náà tọ́ka sí àkókò, ‘ní ọjọ́ tí’; ‘ṣùgbọ́n’ sì pa ìyàtọ̀ kékeré tí δέ mú wá mọ́ láàárín èyí àti àpẹẹrẹ Nóà tó ṣáájú.
- source_word: ἐξῆλθεν
  choice: jáde kúrò
  rationale: Èyí fi ìṣípò gidi tí ọ̀rọ̀ Gíríìkì náà sọ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Λὼτ
  choice: Lọ́ọ̀tì
  rationale: Àkọsílẹ̀ orúkọ náà ní ọ̀nà tí ó bá ìpè Gíríìkì mu, tí ó sì wọ́pọ̀ nínú Yorùbá.
- source_word: ἀπὸ Σοδόμων
  choice: kúrò ní Sódómù
  rationale: Ó túmọ̀ ibi tí Lọ́ọ̀tì ti jáde ní Yorùbá àdánidá; orúkọ ibì náà jẹ́ Sódómù.
- source_word: ἔβρεξεν
  choice: rọ̀
  rationale: Gíríìkì lò ó bí ọ̀rọ̀-ìṣe tí kò ní olùṣe tí a dárúkọ; ìtumọ̀ yìí kò fi Ọlọ́run tàbí olùṣe mìíràn kún ohun tí ẹsẹ náà sọ.
- source_word: πῦρ καὶ θεῖον
  choice: iná àti imí-ọjọ́ olóró
  rationale: πῦρ ni ‘iná,’ θεῖον sì ni sulfur; ‘imí-ọjọ́ olóró’ jẹ́ ọ̀nà Yorùbá tí ó ṣeé lóye fún ohun alumọ́ni sulfur láìlo ọ̀rọ̀ Gẹ̀ẹ́sì tàbí ọ̀rọ̀ ìgbàanì.
- source_word: ἀπ’ οὐρανοῦ
  choice: láti ọ̀run
  rationale: ‘Ọ̀run’ pa èdè Bíbélì àti ìtọ́ka sí Gẹnẹ́sisi 19:24 mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἀπώλεσεν πάντας
  choice: ó sì pa gbogbo wọn run
  rationale: ἀπόλλυμι níbí ni ‘pa run’; ‘gbogbo wọn’ fi πάντας àti àwọn ènìyàn tí ó ń tọ́ka sí hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ θεῖον nínú àwòrán ìdájọ́
  choice: imí-ọjọ́ olóró
  alternative: súlfúrì; òkúta imí-ọjọ́
  rationale: Ìtumọ̀ náà pa ìtumọ̀ ohun alumọ́ni olóró tí θεῖον ní mọ́, ó sì yẹra fún ọ̀rọ̀ àjèjì tàbí àfikún àwòrán tí kò sí nínú Gíríìkì.
- issue: Ìtumọ̀ οὐρανός
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: ‘Ọ̀run’ bá àṣà èdè Bíbélì àti ìṣẹ̀lẹ̀ Gẹnẹ́sisi mu, ṣùgbọ́n kò pinnu ju bí ọ̀rọ̀ orísun ṣe pinnu lọ bóyá ìtumọ̀ rẹ̀ jẹ́ ibi ìgbé Ọlọ́run tàbí òfuurufú lókè.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ títọ́, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní; a pa ìṣàn gírámà Gíríìkì àti àwòrán ìdájọ́ rẹ̀ mọ́ láìfi olùṣe tí a kò dárúkọ kún un.
