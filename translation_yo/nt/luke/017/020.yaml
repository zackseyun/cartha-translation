id: LUK.17.20
reference: Luke 17:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: yo
  text: Nígbà tí àwọn Farisí béèrè lọ́wọ́ rẹ̀ pé ìgbà wo ni ìjọba Ọlọ́run yóò dé, ó dá wọn lóhùn pé, “Ìjọba Ọlọ́run kì í dé ní ọ̀nà tí a lè ṣàkíyèsí[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú àkíyèsí,” “ní ọ̀nà tí a lè fi ojú rí,” tàbí “pẹ̀lú wíwo fínnífínní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Nígbà tí àwọn Farisí béèrè lọ́wọ́ rẹ̀
  rationale: A túmọ̀ àpólà alábápín ọ̀rọ̀ aorist passive gẹ́gẹ́ bí gbólóhùn àkókò tó bá Yorùbá mu. Ìtumọ̀ náà fi hàn pé àwọn Farisí ni olùbéèrè, láì lo passive tí yóò le ní Yorùbá.
- source_word: πότε ἔρχεται
  choice: ìgbà wo ni ... yóò dé
  rationale: πότε jẹ́ ìbéèrè nípa àkókò, ἔρχεται sì ní agbára ọjọ́ iwájú nínú ìbéèrè yìí. “Yóò dé” jẹ́ ọ̀nà àdánidá láti sọ dídé ohun tí a ń retí.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tó ṣe kedere, tó sì wọ́pọ̀ fún gbólóhùn náà nínú Yorùbá Bíbélì.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: ó dá wọn lóhùn pé
  rationale: Yorùbá máa ń fi “dá ... lóhùn pé” sọ ìtumọ̀ àwọn ọ̀rọ̀-ìṣe méjèèjì lọ́nà àdánidá; fífi “ó sì wí” kún un yóò jẹ́ àsọtúnsọ tí kò pọn dandan.
- source_word: Οὐκ ἔρχεται
  choice: kì í dé
  rationale: Àmì àsìkò habitual/gnomic “kì í” fi hàn pé Jésù ń sọ nípa bí ìjọba náà ṣe ń dé, kì í ṣe ìṣẹ̀lẹ̀ kan ṣoṣo ní àsìkò náà.
- source_word: μετὰ παρατηρήσεως
  choice: pẹ̀lú ohun tí a lè ṣàkíyèsí
  rationale: παρατήρησις lè túmọ̀ sí àkíyèsí, wíwo pẹ̀lú ìṣọ́ra, tàbí ohun tí a lè tọpinpin nípa àmì òde. Àyànfẹ́ yìí pa ìṣiyèméjì náà mọ́ díẹ̀, kò sì fi “àwọn àmì” kún ọ̀rọ̀ Gíríìkì ní pàtó.
theological_decisions:
- issue: Ohun tí Jésù ń sẹ́ nípa dídé ìjọba Ọlọ́run
  choice: Jésù sọ pé ìjọba Ọlọ́run kì í dé lọ́nà tí a lè ṣàkíyèsí tàbí tọpinpin rẹ̀ bí àmì òde.
  alternative: Jésù ń sẹ́ gbogbo irú àmì ọjọ́ ìkẹyìn pátápátá, tàbí ó ń sọ pé kò sí ẹni tó lè rí ìjọba Ọlọ́run ní ọ̀nà kankan.
  rationale: μετὰ παρατηρήσεως dá lórí ọ̀nà àkíyèsí tàbí ìṣọ́ra. Ìtumọ̀ yìí kò gbé ẹ̀kọ́ tó ju ohun tí ẹsẹ náà sọ lọ wọ inú rẹ̀, ó sì pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. A lo “Farisí” gẹ́gẹ́ bí orúkọ ẹgbẹ́ náà, “ìjọba Ọlọ́run” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó mọ̀ọ́mọ̀ ṣe kedere, a sì yẹra fún fífi “àmì” sínú ọ̀rọ̀ àkọ́kọ́ nítorí pé kò sí ọ̀rọ̀ Gíríìkì pàtó fún un.
