id: LUK.17.33
reference: Luke 17:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá ń wá ọ̀nà láti pa ìyè[a] rẹ̀ mọ́ yóò pàdánù rẹ̀, ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù rẹ̀ yóò pa á mọ́ láàyè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀mí.” Níhìn-ín, ψυχή ṣeé ṣe kó túmọ̀ sí ìyè tàbí ara ẹni, dípò ìtumọ̀ “ẹ̀mí” náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “yóò mú un wà láàyè”; ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí pípa ohun kan mọ́ láàyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: tí ó bá ń wá ọ̀nà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìsapá pẹ̀lú ète, kì í ṣe ìfẹ́ lásán; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá fún ẹni tí ń sapá láti ṣe ohun kan.
- source_word: ψυχὴν
  choice: ìyè ara rẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, ψυχή túmọ̀ sí ìyè tàbí ara ẹni, kì í ṣe dandan ọkàn tí kò ṣeé fojú rí. ‘Ìyè ara rẹ̀’ mú ìtumọ̀ náà hàn láìfi ẹ̀kọ́ nípa ìpín ara àti ọkàn kún un.
- source_word: περιποιήσασθαι
  choice: láti pa ... mọ́
  rationale: Ọ̀rọ̀ arin náà ní ìtumọ̀ pípa ohun kan mọ́ tàbí dáàbò bo ó fún ara ẹni; ‘pa ... mọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: yóò pàdánù / tí ó bá pàdánù
  rationale: Lílo ‘pàdánù’ ní apá méjèèjì pa ìfiwéra alárìnrìn-àjò inú ọ̀rọ̀ Jesu mọ́, láìṣe àlàyé ju ohun tí Gíríìkì sọ lọ.
- source_word: ζῳογονήσει
  choice: yóò pa á mọ́ láàyè
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ ní pàtó sí pípa ohun kan mọ́ láàyè; ìtumọ̀ yìí pa àtakò tó wà láàárín ‘pàdánù’ àti ‘mọ́ láàyè’ mọ́.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Ẹnikẹ́ni tí ó bá ... ṣùgbọ́n ẹnikẹ́ni tí ó bá
  rationale: Ìṣètò yìí fi ipò gbogbogbò hàn, δέ sì ń fi apá kejì tako apá àkọ́kọ́; ‘ṣùgbọ́n’ mú ìyàtọ̀ náà ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ àfiwé Jesu
  choice: ìyè ara rẹ̀
  alternative: ẹ̀mí rẹ̀
  rationale: Ọ̀rọ̀ tó yí ẹsẹ náà ká dá lórí pípa ara ẹni mọ́ nígbà ìdájọ́ àti àtakò pípa ìyè mọ́ nípa pípàdánù rẹ̀. ‘Ìyè ara rẹ̀’ yẹra fún fífi ẹ̀kọ́ nípa ẹ̀mí tí ó yà sọ́tọ̀ kún ọ̀rọ̀ náà.
- issue: Bí a ṣe túmọ̀ ζῳογονήσει
  choice: yóò pa á mọ́ láàyè
  alternative: yóò gbà á là
  rationale: Gíríìkì kò lo ọ̀rọ̀-ìṣe tí a sábà máa ń túmọ̀ sí ‘gbà là’; ó sọ ní pàtó pé kí ohun náà wà láàyè. Ìtumọ̀ yìí pa ìfọkànsìn àti ìdọ́gba ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ń wá ọ̀nà’ fi ìsapá oníète hàn, ‘pa ... mọ́’ sì jẹ́ gbólóhùn àdánidá tí ó tún pa ìfararora ọ̀rọ̀ apá méjèèjì mọ́.
