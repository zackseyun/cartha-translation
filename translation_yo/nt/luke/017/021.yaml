source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: yo
  text: Wọ́n kì yóò sì sọ pé, ‘Wò ó, ó wà níhìn-ín!’ tàbí, ‘Ó wà níbẹ̀!’ Nítorí, kíyèsí i, ìjọba Ọlọ́run wà láàárín yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjọba Ọlọ́run wà ní inú yín.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ohun tó wà ní inú ènìyàn tàbí ohun tó wà láàárín ẹgbẹ́ kan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ... kì
  rationale: Ó tẹ̀ síwájú nínú ìkọ̀sẹ̀ tí ó wà ní ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nor’ ní Yorùbá.
- source_word: ἐροῦσιν
  choice: wọn kì yóò sọ
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; àpólà yìí pa ìkọ̀sẹ̀ Gíríìkì mọ́.
- source_word: Ἰδοὺ ὧδε ... Ἐκεῖ
  choice: Wò ó, ó wà níhìn-ín! ... Ó wà níbẹ̀!
  rationale: Ó mú ìpè fún àkíyèsí àti ìtọ́ka sí ibi méjèèjì jáde ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí tí wọn kò fi ní tọ́ka sí ibi kan pàtó hàn.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó jẹ́ ìpè ọlọ́lá fún àkíyèsí, ó sì yẹra fún àtúnṣe ‘Wò ó’ lẹ́sẹ̀kẹsẹ̀.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ìtumọ̀ tó ṣe kedere, tó sì pa ìtumọ̀ ìṣàkóso àti ilẹ̀ ọba mọ́ láì fi ọ̀kan ṣoṣo múlẹ̀.
- source_word: ἐντὸς ὑμῶν
  choice: láàárín yín
  rationale: Nínú àyíká yìí, ẹni kejì ọ̀pọ̀ àti ọ̀rọ̀ nípa ibi ṣe atilẹyin fún ìtumọ̀ pé ó wà láàárín àwọn tí Jésù ń bá sọ̀rọ̀; àṣàyàn ‘ní inú yín’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐστιν
  choice: wà
  rationale: Ó tú ọ̀rọ̀-ìṣe εἰμί ní ọ̀nà locative tí ó bá èdè Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ ἐντὸς ὑμῶν
  choice: ìjọba Ọlọ́run wà láàárín yín
  alternative: ìjọba Ọlọ́run wà ní inú yín
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ohun tó wà ní inú ènìyàn tàbí ohun tó wà láàárín ẹgbẹ́ kan. Àyíká àti olùgbọ́ ọ̀pọ̀ mú ‘láàárín yín’ yẹ sí ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘kíyèsí i’ fún ἰδοὺ kejì láti fi ìtẹnumọ́ hàn láì tún ‘Wò ó’ ṣe; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
