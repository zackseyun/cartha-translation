id: LUK.5.22
reference: Luke 5:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù mọ ohun tí wọ́n ń rò[a], ó sì dá wọn lóhùn pé, “Èé ṣe tí ẹ fi ń ronú nínú ọkàn yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lóye ìrònú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: mọ
  rationale: “Mọ” sọ ní kedere pé Jésù mọ ohun tí wọ́n ń rò, láìfi ọ̀nà tí ó gbà mọ̀ ọ́ kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tí ó ní ìtakora sí ohun tí ó ṣáájú hàn nínú ìtàn náà.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: ohun tí wọ́n ń rò
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún èrò tàbí ìjíròrò inú wọn, ó sì mú ìṣe ọpọlọ tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí hàn.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: ó sì dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti túmọ̀ àkójọpọ̀ ọ̀rọ̀ ìtàn náà, tí ó ní ìtumọ̀ pé ó fèsì, ó sì sọ fún wọn.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú ìbéèrè yìí, τί ń béèrè ìdí tí wọ́n fi ń ronú bẹ́ẹ̀, nítorí náà “Èé ṣe” ni Yorùbá àdánidá jù lọ.
- source_word: διαλογίζεσθε
  choice: ẹ fi ń ronú
  rationale: Ó pa ìtumọ̀ ìrònú inú tí ó ń lọ lọ́wọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ó pa àwòrán Bíbélì ti ọkàn gẹ́gẹ́ bí inú ènìyàn, ibi ìrònú àti ìfẹ́ inú, mọ́.
theological_decisions:
- issue: Bí Jésù ṣe mọ ìrònú inú àwọn ènìyàn náà
  choice: A sọ ní tààrà pé Jésù mọ ohun tí wọ́n ń rò, láìṣàlàyé ọ̀nà tí ó gbà mọ̀ ọ́.
  alternative: Láti sọ ní pàtó pé ó mọ̀ ọ́ nípa agbára àrà ọ̀tọ̀, tàbí láti sọ pé ó kàn fojú díwọ̀n ohun tí wọ́n ń rò.
  rationale: Ẹsẹ náà fi hàn pé Jésù mọ ìrònú inú wọn, ṣùgbọ́n kò ṣàlàyé bí ó ṣe mọ̀ ọ́. Ìtumọ̀ yìí pa àìsọ pàtó yẹn mọ́ láìfi ẹ̀kọ́ mìíràn kún un tàbí dín ohun tí ẹsẹ náà sọ kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe déédéé, ó sì ṣe kedere fún àwọn òǹkàwé òde òní; a pa àwòrán “nínú ọkàn yín” mọ́.
