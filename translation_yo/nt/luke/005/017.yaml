id: LUK.5.17
reference: Luke 5:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: yo
  text: Ní ọ̀kan lára àwọn ọjọ́ wọ̀nyẹn, ó ṣẹlẹ̀ pé Jésù ń kọ́ni, àwọn Farisí àti àwọn olùkọ́ òfin sì jókòó níbẹ̀. Wọ́n ti wá láti gbogbo abúlé ní Galili àti Judea, àti láti Jerusalẹmu; agbára Olúwa sì wà níbẹ̀ fún un láti ṣe ìwòsàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “láti mú wọn láradá,” dípò “fún un láti ṣe ìwòsàn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Ní ọ̀kan lára àwọn ọjọ́ wọ̀nyẹn, ó ṣẹlẹ̀ pé
  rationale: Ó pa ọ̀nà ìtàn tí Lúùkù sábà máa ń lò mọ́, ṣùgbọ́n ó jẹ́ Yorùbá àdánidá tí kò ní ìrísí èdè àtijọ́.
- source_word: αὐτὸς ἦν διδάσκων
  choice: Jésù ń kọ́ni
  rationale: Àpólà náà fi iṣẹ́ tí ó ń bá a lọ hàn. Lílo orúkọ Jésù mú ẹni tí ọ̀rọ̀ ń tọ́ka sí ṣe kedere ní Yorùbá láìfi ìtẹnumọ́ ‘òun fúnra rẹ̀’ kún un.
- source_word: καθήμενοι
  choice: jókòó níbẹ̀
  rationale: Ó ṣàpèjúwe bí wọ́n ṣe wà níbi ìṣẹ̀lẹ̀ náà ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni àkọsílẹ̀-orúkọ ẹgbẹ́ Júù náà tí ó wọ́pọ̀, tí ó sì rọrùn fún òǹkàwé Yorùbá.
- source_word: νομοδιδάσκαλοι
  choice: àwọn olùkọ́ òfin
  rationale: Ó tú ìtumọ̀ ọ̀rọ̀ àkópọ̀ Gíríìkì náà jáde ní tààràtà láìsọ pé wọ́n jẹ́ amòye ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐληλυθότες
  choice: Wọ́n ti wá
  rationale: Ó fi hàn pé wíwá wọn ti ṣẹlẹ̀ ṣáájú, wọ́n sì ṣì wà níbẹ̀.
- source_word: ἐκ πάσης κώμης
  choice: láti gbogbo ìletò
  rationale: ‘Ìletò’ bá κώμη mu gẹ́gẹ́ bí ibùgbé kékeré tàbí abúlé, ‘gbogbo’ sì pa agbára distributive πάσης mọ́.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: ní Galili àti Judea, àti láti Jerusalẹmu
  rationale: A ṣe ìyàtọ̀ láàárín àwọn agbègbè méjì àti ìlú Jerusalẹmu ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: δύναμις κυρίου
  choice: agbára Olúwa
  rationale: Ó pa àkópọ̀ genitive àti ìwúwo ẹ̀kọ́ nípa agbára Ọlọ́run mọ́; ‘Olúwa’ ni ìtumọ̀ àdánidá fún κύριος ní àyíká yìí.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: wà níbẹ̀ fún un láti mú àárẹ̀ dá
  rationale: Ó fi ète/àbájáde iṣẹ́ ìwòsàn hàn, ó sì tẹ̀lé αὐτόν gẹ́gẹ́ bí ìtọ́ka sí ẹni tí yóò ṣe ìwòsàn, láìfi ohun tí a kò mẹ́nu kàn kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtọ́kasí àti ipa ti δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Agbára Olúwa wà níbẹ̀ fún Jésù láti ṣe ìwòsàn.
  alternative: Agbára Olúwa wà níbẹ̀ láti mú wọn láradá.
  rationale: Ọ̀rọ̀ SBLGNT tí a fún wa ní αὐτόν, kì í ṣe ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀. Nítorí náà, àkọsílẹ̀ pàtàkì kò fi ‘wọn’ kún un, ṣùgbọ́n ó jẹ́ kí agbára Olúwa nínú iṣẹ́ ìwòsàn Jésù hàn gbangba.
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Ọlọ́run
  rationale: ‘Olúwa’ pa ìtumọ̀ àti àyè ìtọ́kasí Gíríìkì mọ́ láìdín in sí ìtumọ̀ kan ṣoṣo ju bí ẹsẹ̀ náà ti ṣe lọ.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Mú àárẹ̀ dá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwòsàn, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìyàtọ̀ àfọwọ́kọ mọ́.
