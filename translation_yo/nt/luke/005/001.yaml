source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí ọ̀pọ̀ ènìyàn ń rọ̀ mọ́ ọn, tí wọ́n sì ń fetí sí ọ̀rọ̀ Ọlọ́run[a], òun sì ń dúró lẹ́gbẹ̀ẹ́ adágún Gẹnẹ́sárẹ́tì[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ọ̀pọ̀ ènìyàn ń rọ̀ mọ́ ọn, tí wọ́n sì ń gbọ́ ọ̀rọ̀ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Gẹnẹ́sárẹ́tì ni adágún tí a tún mọ̀ sí Òkun Gálílì.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Èyí jẹ́ ọ̀nà tí Lúùkù sábà máa ń gbà láti bẹ̀rẹ̀ ìṣẹ̀lẹ̀ tuntun. “Sì” mú ipa δέ jáde láìfi ọ̀rọ̀ àkókò kan tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: bí ... ṣe ń rọ́ mọ́ ọn, tí wọ́n sì ń fetí sí
  rationale: 'Ìṣètò ọ̀rọ̀ náà tọ́ka sí ohun tó ń ṣẹlẹ̀ ní àkókò kan náà; ìtumọ̀ yìí sì pa ìṣe méjèèjì mọ́: rírọ́ mọ́ ọn àti fífetí sí.'
- source_word: ὄχλον
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún àwùjọ ènìyàn púpọ̀ ní ibi kan.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: ń rọ́ mọ́ ọn
  rationale: Ó fi hàn pé ọ̀pọ̀ ènìyàn náà sún mọ́ ọn débi pé wọ́n ń tẹ̀ sí i tàbí ń há a mọ́ra.
- source_word: ἀκούειν
  choice: ń fetí sí
  rationale: “Fetí sí” fi ìgbọ́ràn pẹ̀lú àfiyèsí hàn ju gbígbọ́ lasán lọ, ó sì bá àyíká ìwàásù mu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa ìtumọ̀ àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ gbólóhùn Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Bíbélì tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: òun dúró
  rationale: “Òun” ń ṣe àfihàn ẹni tí αὐτός tọ́ka sí, “dúró” sì sọ ipò tí ó wà nígbà náà ní kedere láìsọ ọ̀rọ̀ di líle.
- source_word: παρὰ τὴν λίμνην
  choice: lẹ́gbẹ̀ẹ́ adágún
  rationale: Ó túmọ̀ ipò tó wà lẹ́bàá omi náà ní èdè Yorùbá àdánidá.
- source_word: Γεννησαρέτ
  choice: Gẹnẹ́sárẹ́tì
  rationale: A ṣe orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì, dípò kí a fi orúkọ ìtumọ̀ tàbí orúkọ mìíràn rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  alternative: ìhìn Ọlọ́run
  rationale: “Ọ̀rọ̀ Ọlọ́run” pa ìtẹ̀sí ẹ̀kọ́ ìgbàgbọ́ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ Bíbélì mìíràn mọ́, láìfi ìtumọ̀ rẹ̀ mọ́ sí ìhìn tí a ń kéde nìkan.
- issue: Bí a ṣe ṣe Γεννησαρέτ
  choice: Gẹnẹ́sárẹ́tì
  alternative: Òkun Gálílì
  rationale: Ẹsẹ Gíríìkì fúnra rẹ̀ pe adágún náà ní Gẹnẹ́sárẹ́tì. Lílo “Òkun Gálílì” nínú ara ẹsẹ yóò jẹ́ àlàyé ìdánimọ̀ tí kò sí nínú ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Kọ́mà ìparí fi hàn pé gbólóhùn náà ń bá a lọ sínú ẹsẹ tó tẹ̀ lé e.
