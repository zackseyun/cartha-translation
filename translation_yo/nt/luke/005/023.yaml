id: LUK.5.23
reference: Luke 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: yo
  text: 'Èwo ni ó rọrùn jù: láti sọ pé, ‘A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́,’[a] tàbí láti sọ pé, ‘Dìde, kí o sì máa rìn’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Èwo ni ó rọrùn jù
  rationale: Ìbéèrè yìí fi ohun méjì wé ara wọn; ‘Èwo ni ó rọrùn jù’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára àfiwé náà mọ́.
- source_word: εἰπεῖν
  choice: láti sọ pé
  rationale: Ọ̀rọ̀ náà ṣí ọ̀kọ̀ọ̀kan nínú gbólóhùn méjì tí a fi wéra sílẹ̀; ‘láti sọ pé’ bá ìtumọ̀ àti ìlò Yorùbá mu.
- source_word: Ἀφέωνταί σοι αἱ ἁμαρτίαι σου
  choice: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Ọ̀rọ̀ ìṣe pípé oníṣe-ìfaragba náà ń tọ́ka sí ìdáríjì tí ó ti ṣẹlẹ̀, tí ipò rẹ̀ sì ń bá a lọ. Ìtumọ̀ yìí kò sọ ẹni tó ṣe ìdáríjì ní kedere, gẹ́gẹ́ bí Gíríìkì náà.
- source_word: ἢ
  choice: tàbí
  rationale: Ó ya àwọn ọ̀nà méjì tí ìbéèrè náà fi wéra sọ́tọ̀.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: Àṣẹ tààrà ni fún ọkùnrin náà láti dìde; ọ̀rọ̀ yìí ṣe kedere, ó sì ní iyì.
- source_word: καὶ περιπάτει
  choice: kí o sì máa rìn
  rationale: Níhìn-ín, περιπατέω túmọ̀ sí rírìn ní ti ara. ‘Máa rìn’ fi àṣẹ tí ó ń pe fún ìṣe hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ gbólóhùn ìdáríjì láìfi ẹ̀kọ́ ìsìn àfikún sínú ọ̀rọ̀ ìṣe pípé oníṣe-ìfaragba
  choice: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  alternative: A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: ‘A ti dárí ... jì’ fi hàn pé ìdáríjì ti ṣẹlẹ̀, ipa rẹ̀ sì dúró, ṣùgbọ́n kò sọ ẹni tó ṣe é ní tààrà. Àkíyèsí ìsàlẹ̀ fúnni ní ọ̀nà míì tí ó tẹnu mọ́ ipò ìdáríjì ju abájáde ìṣe pípé lọ.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘Dìde’ dípò ọ̀rọ̀ ọ̀wọ́ tàbí ọ̀rọ̀ àtijọ́, a sì pa ìbéèrè àfiwé àti ìfaragba ọ̀rọ̀ ìdáríjì mọ́.
