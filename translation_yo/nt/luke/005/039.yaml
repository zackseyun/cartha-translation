id: LUK.5.39
reference: Luke 5:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá ti mu wáìnì àtijọ́ kì í fẹ́ tuntun, nítorí ó máa ń wí pé, “Èyí àtijọ́ dára.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “Èyí àtijọ́ dára jù.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ẹnikẹ́ni ... kì í
  rationale: Ìṣètò ‘ẹnikẹ́ni ... kì í’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìtumọ̀ àpapọ̀ ti ‘kò sí ẹnikẹ́ni,’ ó sì bá ìwà òwe gbólóhùn náà mu.
- source_word: πιὼν
  choice: tí ó bá ti mu
  rationale: Ó fi hàn pé mímu wáìnì àtijọ́ ti ṣẹlẹ̀ ṣáájú fífẹ́ tuntun, bí aorist participle ṣe ń tọ́ka sí.
- source_word: παλαιὸν
  choice: wáìnì àtijọ́
  rationale: Ọ̀rọ̀ ‘wáìnì’ wà ní ìtumọ̀ láti inú àyíká ẹsẹ náà; fífi í hàn gbangba mú kí Yorùbá ṣe kedere láìfi èrò tuntun kún un.
- source_word: θέλει
  choice: fẹ́
  rationale: ‘Fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì sọ ìfẹ́ tàbí ohun tí ènìyàn yàn níbí.
- source_word: νέον
  choice: tuntun
  rationale: 'A pa àfojúdi ọ̀rọ̀ Gíríìkì mọ́: ‘tuntun’ dúró fún wáìnì tuntun, èyí tí àyíká ti mú kedere.'
- source_word: λέγει γάρ
  choice: nítorí ó máa ń wí pé
  rationale: ‘Nítorí’ pa agbára ìdí ti γάρ mọ́; ‘ó máa ń wí’ bá gbólóhùn òwe tó sọ ìṣe tí ó sábà máa ń ṣẹlẹ̀ mu.
- source_word: Ὁ παλαιὸς
  choice: Èyí àtijọ́
  rationale: ‘Èyí àtijọ́’ tọ́ka sí wáìnì àtijọ́ láìṣe àtúnsọ orúkọ náà, ó sì pa ìsọ̀rọ̀ ṣókí ti Gíríìkì mọ́.
- source_word: χρηστός
  choice: dára
  rationale: ‘Dára’ ni ìtumọ̀ gbòòrò, aláìṣàfikún fún χρηστός ní àyíká yìí; kò sọ ọ́ di afiwéra bí ‘dára jù’ ṣe máa ṣe.
theological_decisions:
- issue: Ìtumọ̀ χρηστός nínú òwe nípa wáìnì àtijọ́ àti tuntun
  choice: dára
  alternative: dára jù
  rationale: Ọ̀rọ̀ inú SBLGNT ni χρηστός, ìtumọ̀ rẹ̀ ní tààrà ni ‘dára’ tàbí ‘dùn mọ́ni,’ kì í ṣe afiwéra ‘dára jù.’ A fi ìtumọ̀ mìíràn tí àwọn àfọwọ́kọ kan ní sínú àlàyé ìsàlẹ̀ dípò kí a gbé e wọ inú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa oníyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘wáìnì’ gẹ́gẹ́ bí ọ̀rọ̀ tó wọ́pọ̀ fún ọtí wáìnì, a sì lo ìṣètò òwe ‘ẹnikẹ́ni ... kì í’ àti ‘ó máa ń wí’ láti jẹ́ kí gbólóhùn náà ṣàn lọ́nà àdánidá.
