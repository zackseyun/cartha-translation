  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó dìde níwájú wọn, ó gbé ohun tí ó ti dùbúlẹ̀ sórí rẹ̀, ó sì lọ sí ilé rẹ̀, ó ń yin Ọlọ́run lógo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ohun náà ṣẹlẹ̀ láìjáfara; “lẹ́sẹ̀kẹsẹ̀” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ìṣe tí ó ṣẹlẹ̀ ní kíá.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Bí ó tilẹ̀ jẹ́ pé participle ni ní Gíríìkì, fífi ṣe ọ̀rọ̀-ìṣe pípé nínú Yorùbá mú ìtàn náà ṣàn dáadáa, ó sì pa bí àwọn ìṣe náà ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἐνώπιον αὐτῶν
  choice: níwájú wọn
  rationale: Èyí fi hàn pé ó dìde níbi tí gbogbo wọn ti lè rí i, láìfi “ní ojú wọn” kún ohun tí Gíríìkì sọ.
- source_word: ἄρας
  choice: ó gbé
  rationale: αἴρω níhìn-ín tọ́ka sí gbígbé ohun tí ó ti dùbúlẹ̀ lé sókè kí ó sì mú un lọ; “ó gbé” jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó sì bá ìṣe náà mu.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: ohun tí ó ti dùbúlẹ̀ lé
  rationale: Gíríìkì kò pe ohun náà ní àkéte tàbí ibùsùn nínú ẹsẹ yìí; ìtumọ̀ yìí pa ìsọ̀rọ̀ alátọ́ka orísun náà mọ́ láìfi ohun pàtó kún un.
- source_word: κατέκειτο
  choice: ó ti dùbúlẹ̀
  rationale: Ìhà imperfect fi ipò tí ó wà tẹ́lẹ̀ hàn; “ó ti dùbúlẹ̀” jẹ́ àdánidá ní Yorùbá fún ipò tí ó ṣáájú ìgbà tí ó dìde.
- source_word: ἀπῆλθεν
  choice: ó sì lọ
  rationale: Nínú àyíká yìí, “ó lọ” sọ ìkúrò rẹ̀ lọ sí ilé ní kedere; “sì” tún so ìṣe náà mọ́ àwọn ìṣe tó ṣáájú.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: sí ilé rẹ̀
  rationale: οἶκος lè túmọ̀ sí ilé tàbí ibùgbé; “ilé rẹ̀” jẹ́ ìtumọ̀ tààrà, àdánidá ní Yorùbá.
- source_word: δοξάζων τὸν θεόν
  choice: ó ń yin Ọlọ́run lógo
  rationale: Gbólóhùn yìí pa èrò fífi ògo fún Ọlọ́run mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó yé ni láti sọ δοξάζω ní àyíká yìí.
theological_decisions:
- issue: Bóyá kí a pe ohun tí ọkùnrin náà gbé ní “àkéte” tàbí “ibùsùn”
  choice: A lo “ohun tí ó ti dùbúlẹ̀ lé” nínú ẹsẹ náà.
  alternative: àkéte tí ó ti dùbúlẹ̀ lé; ibùsùn tí ó ti dùbúlẹ̀ lé
  rationale: Ẹsẹ Gíríìkì náà lo gbólóhùn alátọ́ka, kò sì darúkọ ohun náà ní pàtó. Ìtumọ̀ yìí yẹra fún fífi ìtumọ̀ tí ó ṣe pàtó jù sí orísun náà, nígbà tí àyíká ìtàn ṣì jẹ́ kí ohun tí a ń tọ́ka sí yé ni.
translation_notes:
  register: Yorùbá boṣewa oníyì, tó rọrùn fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹ̀lé àwọn ìṣe inú Gíríìkì mọ́ ní ọ̀nà tí ó ṣàn dáadáa ní Yorùbá.
