source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ̀yin kò lè mú kí àwọn àlejò ìgbéyàwó[a] gbààwẹ̀ nígbà tí ọkọ ìyàwó wà pẹ̀lú wọn, ṣé bẹ́ẹ̀ ni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “àwọn ọmọ yàrá ìgbéyàwó”; àṣà-ọ̀rọ̀ ni èyí fún àwọn alábàákẹ́gbẹ́ ọkọ ìyàwó tàbí àwọn àlejò ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Ẹ̀yin kò lè ... àbí ẹ lè ṣe bẹ́ẹ̀?
  rationale: Ìbéèrè tí μή bá ọ̀rọ̀-ìṣe atọ́ka lọ ń retí ìdáhùn òdì. Ìtumọ̀ yìí mú ìtẹnumọ́ àti agbára ìbéèrè àsọyé náà hàn ní Yorùbá àdánidá.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: àwọn àlejò ìgbéyàwó[a]
  rationale: Èyí jẹ́ àṣà-ọ̀rọ̀ tí ó túmọ̀ sí àwọn alábàáṣiṣẹ́ ọkọ ìyàwó tàbí àwọn àlejò ayẹyẹ ìgbéyàwó; ‘àwọn àlejò ìgbéyàwó’ sọ ìtumọ̀ náà ní Yorùbá òde òní láìfi àwòrán yàrá gidi ṣì olùkà.
- source_word: νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọkùnrin tí a ń ṣe ìgbéyàwó rẹ̀, ó sì pa àwòrán ìgbéyàwó inú ọ̀rọ̀ náà mọ́.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: wà pẹ̀lú wọn
  rationale: Ó fi ìwàníhìn-ín àti ìbákẹ́gbẹ́ ọkọ ìyàwó pẹ̀lú àwọn àlejò hàn ní tààràtà.
- source_word: ποιῆσαι νηστεῦσαι
  choice: mú kí ... gbààwẹ̀
  rationale: Àkópọ̀ ποιέω àti ọ̀rọ̀-ìṣe aláìlẹ́ni ṣe ń fi ìmúṣe tàbí ìfipáṣe hàn; ‘mú kí ... gbààwẹ̀’ pa ìtumọ̀ okùnfà náà mọ́.
- source_word: νηστεῦσαι
  choice: gbààwẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká ẹ̀sìn mu fún fífi oúnjẹ sílẹ̀ fún àkókò kan.
theological_decisions:
- issue: Ìdánimọ̀ Jesu nípasẹ̀ àpèjúwe ọkọ ìyàwó
  choice: A pa àwòrán ‘ọkọ ìyàwó’ mọ́ láìṣàlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ nínú ẹsẹ náà.
  alternative: Láti fi kún un ní tààràtà pé Jesu ń fi ara rẹ̀ wé ọkọ ìyàwó.
  rationale: Ẹsẹ náà fúnra rẹ̀ ń lo àkàwé yìí, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ orísun kún un.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní ọlá, tí ó sì ṣeé yé fún olùkà òde òní ni a lò. Àmì ohùn ni a fi sí ọ̀rọ̀ níbi tí ó bá yẹ; ‘Ẹ̀yin’ mú ìtẹnumọ́ inú ìbéèrè àsọyé náà hàn.
