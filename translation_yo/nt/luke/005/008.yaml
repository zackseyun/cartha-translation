id: LUK.5.8
reference: Luke 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Símónì Pétérù rí ohun tí ó ṣẹlẹ̀, ó ṣubú sí eékún Jésù, ó ní, “Kúrò lọ́dọ̀ mi, nítorí mo jẹ́ ọkùnrin ẹlẹ́ṣẹ̀, Olúwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ... rí ohun tí ó ṣẹlẹ̀
  rationale: Aorist participle náà ni a túmọ̀ gẹ́gẹ́ bí gbólóhùn àkókò ní Yorùbá. Nítorí ohun tí ó rí kò hàn gbangba nínú ẹsẹ yìí, “ohun tí ó ṣẹlẹ̀” tọ́ka sí ìpeja àrà náà láìfi àlàyé ẹ̀kọ́ kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà ìtàn pẹ̀lú ìtakora díẹ̀ hàn láàárín iṣẹ́ ìyanu náà àti ìhùwàpadà Símónì.
- source_word: Σίμων Πέτρος
  choice: Símónì Pétérù
  rationale: A pa orúkọ méjèèjì mọ́ bí wọ́n ṣe wà nínú Gíríìkì.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: ó wolẹ̀ lẹ́gbẹ̀ẹ́ eékún Jésù
  rationale: Èyí sọ ìṣubú rẹ̀ síwájú Jésù àti ibi tí ó wà ní kedere, ní èdè Yorùbá àdánidá. “Wolẹ̀” tún mú ìrẹ̀lẹ̀ ìdúró náà jáde.
- source_word: λέγων
  choice: ó ní
  rationale: Ìṣe alábàákẹ́gbẹ́ náà jẹ́ àdánidá jù lọ ní Yorùbá bí “ó ní,” dípò títẹ̀lé àpẹẹrẹ participle Gíríìkì ní líle.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Kúrò lọ́dọ̀ mi
  rationale: Àṣẹ aorist náà jẹ́ ẹ̀bẹ̀ kí Jésù ya ara rẹ̀ kúrò lọ́dọ̀ rẹ̀; gbolohun yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàgbékalẹ̀ ìdí tí Símónì fi bẹ Jésù pé kí ó kúrò lọ́dọ̀ rẹ̀.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: ẹlẹ́ṣẹ̀ ènìyàn ni mí
  rationale: Ó pa àpẹẹrẹ àsọyé náà mọ́ pé Símónì ń pe ara rẹ̀ ní ènìyàn ẹlẹ́ṣẹ̀. Bí ó tilẹ̀ jẹ́ pé ἀνήρ jẹ́ akọ ní Gíríìkì, “ọkùnrin ẹlẹ́ṣẹ̀” kò ṣe àdánidá púpọ̀ nínú àsọyé Yorùbá yìí, ẹni tí ń sọ̀rọ̀ sì ti hàn gbangba pé ọkùnrin ni.
- source_word: κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ọ̀wọ̀ àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tí ó ṣeé ṣe mọ́; kò dín un kù sí ìkíni ọ̀wọ̀ lásán, bẹ́ẹ̀ ni kò fi ìjẹ́wọ́ tó ti pé sí i láti òde.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριε nígbà tí Símónì ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá; Aláṣẹ
  rationale: Nínú ọ̀rọ̀ yìí Símónì fèsì sí iṣẹ́ ìyanu pẹ̀lú ìbẹ̀rù àti ìjẹ́wọ́ ẹ̀ṣẹ̀. “Olúwa” pa ọ̀wọ̀ àti ìjìnlẹ̀ ìtumọ̀ tó ṣeé ṣe mọ́ láìsọ pé Símónì ti ṣe gbogbo ìjẹ́wọ́ nípa ẹni tí Jésù jẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A yan àwọn ọ̀rọ̀ àdánidá bí “ó ní” àti “Kúrò lọ́dọ̀ mi,” nígbà tí “Olúwa” pa ìwọ̀n ọ̀wọ̀ àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ mọ́.
