revisions:
- from: Ṣùgbọ́n nígbà tí Símónì Pétérù rí ohun tí ó ṣẹlẹ̀, ó wolẹ̀ lẹ́gbẹ̀ẹ́ eékún Jésù, ó ní, “Kúrò lọ́dọ̀ mi, nítorí ẹlẹ́ṣẹ̀ ènìyàn ni mí, Olúwa.”
  to: Ṣùgbọ́n nígbà tí Símónì Pétérù rí ohun tí ó ṣẹlẹ̀, ó ṣubú sí eékún Jésù, ó ní, “Kúrò lọ́dọ̀ mi, nítorí mo jẹ́ ọkùnrin ẹlẹ́ṣẹ̀, Olúwa.”
  rationale: The revision corrects the spatial sense of Simon Peter’s falling, avoids adding a potentially stronger worship/prostration nuance, and makes his confession natural while preserving the Greek’s masculine singular noun. No footnote is needed, since the implicit object is supplied naturally from the immediate context and no unresolved textual or lexical ambiguity requires annotation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:03:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the narrative transition, both names, the implicit object of seeing, Simon Peter’s plea, the causal confession, and the address “Olúwa.” However, “lẹ́gbẹ̀ẹ́ eékún Jésù” means “beside Jesus’ knee(s),” rather than falling at/to them, and “wolẹ̀” can introduce a more specifically prostrate or worshipful sense than προσέπεσεν requires. The predicate “ẹlẹ́ṣẹ̀ ènìyàn ni mí” is also unnatural and does not clearly retain ἀνήρ as a male self-designation.
  naturalness: 'The revision uses idiomatic modern Standard Yoruba while preserving the source’s vivid posture: “ó ṣubú sí eékún Jésù.” The confession is recast as the natural “mo jẹ́ ọkùnrin ẹlẹ́ṣẹ̀.”'
  terminology: “Símónì Pétérù” and “Olúwa” are appropriate. “Ọkùnrin ẹlẹ́ṣẹ̀” preserves the specifically masculine ἀνήρ without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: “lẹ́gbẹ̀ẹ́ eékún Jésù” misstates the direction/location of Simon Peter’s action.
    rationale: Lẹ́gbẹ̀ẹ́ means “beside,” whereas προσέπεσεν τοῖς γόνασιν expresses falling at or to Jesus’ knees.
  - severity: medium
    issue: “ó wolẹ̀” is not the most precise rendering of προσέπεσεν in this context.
    rationale: Wolẹ̀ may suggest formal prostration or an act of worship. “Ó ṣubú sí eékún Jésù” directly conveys the physical falling described in the Greek while leaving its precise implication open.
  - severity: medium
    issue: “ẹlẹ́ṣẹ̀ ènìyàn ni mí” is awkward and obscures the masculine noun ἀνήρ.
    rationale: “Mo jẹ́ ọkùnrin ẹlẹ́ṣẹ̀” is natural Yoruba and explicitly represents Simon Peter’s self-description as a sinful man.
  revised_text: Ṣùgbọ́n nígbà tí Símónì Pétérù rí ohun tí ó ṣẹlẹ̀, ó ṣubú sí eékún Jésù, ó ní, “Kúrò lọ́dọ̀ mi, nítorí mo jẹ́ ọkùnrin ẹlẹ́ṣẹ̀, Olúwa.”
  revised_footnotes: []
  revision_rationale: The revision corrects the spatial sense of Simon Peter’s falling, avoids adding a potentially stronger worship/prostration nuance, and makes his confession natural while preserving the Greek’s masculine singular noun. No footnote is needed, since the implicit object is supplied naturally from the immediate context and no unresolved textual or lexical ambiguity requires annotation.
