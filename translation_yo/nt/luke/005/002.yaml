source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: yo
  text: Ó sì rí ọkọ̀ ojú omi méjì tí ó dúró létí adágún náà, ṣùgbọ́n àwọn apẹja ti jáde kúrò nínú wọn, wọ́n sì ń fọ àwọn àwọ̀n náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: Ó sì rí
  rationale: Aorist ὁράω jẹ́ ìṣe ìtàn lasán; “rí” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, láìfi ìtumọ̀ “ṣàkíyèsí lójijì” kún un.
- source_word: δύο πλοῖα
  choice: ọkọ̀ ojú omi méjì
  rationale: Nínú àyíká iṣẹ́ apẹja lórí adágún, “ọkọ̀ ojú omi” dára ju “ọkọ̀ ńlá” lọ, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: tí ó dúró létí adágún náà
  rationale: “Dúró” pa ipò àìṣípò ἑστῶτα mọ́ láìsọ pé a ti dè wọ́n mọ́lẹ̀; “létí adágún” jẹ́ ọ̀nà àdánidá láti sọ ipò lẹ́gbẹ̀ẹ́ adágún.
- source_word: οἱ δὲ ἁλιεῖς
  choice: ṣùgbọ́n àwọn apẹja
  rationale: “Ṣùgbọ́n” fi ìyípadà kékeré tàbí ìfìwéra δέ hàn, “àwọn apẹja” sì jẹ́ ìtumọ̀ iṣẹ́ náà ní Yorùbá.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: ti sọ̀kalẹ̀ kúrò nínú wọn
  rationale: Ìṣe participle náà ṣẹlẹ̀ ṣáájú fífọ àwọ̀n; “ti sọ̀kalẹ̀ kúrò nínú wọn” sọ ìtẹ̀lé yìí ní Yorùbá àdánidá, “wọn” sì ń tọ́ka sí àwọn ọkọ̀ náà.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: wọ́n sì ń fọ àwọn àwọ̀n náà
  rationale: “Ń fọ” mú ìṣe tí ó ń lọ lọ́wọ́ inú imperfect hàn; “àwọn àwọ̀n náà” pa definite article mọ́ láìfi ohun-ìní tí kò sí nínú Gíríìkì kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “adágún” dípò “òkun” nítorí λίμνη, a sì yẹra fún fífi ìtumọ̀ pàtó bí “a dè ọkọ̀ mọ́lẹ̀” tàbí “wọ́n dé etí ilẹ̀” kún ọ̀rọ̀ orísun.
