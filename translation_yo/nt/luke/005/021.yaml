id: LUK.5.21
reference: Luke 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: yo
  text: Àwọn akọ̀wé àti àwọn Farisí sì bẹ̀rẹ̀ sí í ronú láàárín ara wọn, wọ́n ní, “Ta ni ẹni yìí tí ó ń sọ ọ̀rọ̀-òdì sí Ọlọ́run? Ta ni ó lè dárí ẹ̀ṣẹ̀ jì bí kò ṣe Ọlọ́run nìkan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: bẹ̀rẹ̀ sí í ronú láàárín ara wọn
  rationale: Ó pa ìtumọ̀ ‘bẹ̀rẹ̀ sí í’ mọ́, ó sì fi διαλογίζεσθαι hàn gẹ́gẹ́ bí ìrònú tàbí ìgbérò láàárín wọn, láìfi dandan mú un jẹ́ ìrònú inú nìkan tàbí àríyànjiyàn ẹnu.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún àwọn amòfin Ìwé Mímọ́ ní àyíká Ìhìn Rere, ó sì sún mọ́ ìtumọ̀ orísun ju àlàyé gígùn lọ.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ni a ṣe àfọwọ́kọ rẹ̀ ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: λαλεῖ βλασφημίας
  choice: ń sọ ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: βλασφημία ní àyíká yìí jẹ́ ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀-òdì sí Ọlọ́run. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì jẹ́ kí ohun tí wọ́n fi ń fẹ̀sùn kàn án ṣe kedere láìṣàfikún ìpinnu ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: dárí ẹ̀ṣẹ̀ jì
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá àti èyí tí ó péye fún fífi ẹ̀ṣẹ̀ jì.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: bí kò ṣe Ọlọ́run nìkan ṣoṣo
  rationale: Ó pa ìyàsọ́tọ̀ àti ìtẹnumọ́ μόνος mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: Τίς ἐστιν οὗτος
  choice: Ta ni ẹni yìí
  rationale: Ó pa ìbéèrè gígún-kúrú àti ohùn àtakò náà mọ́, láìfi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ Jésù láti dárí ẹ̀ṣẹ̀ jì
  choice: A sọ àtakò wọn ní tààrà pé Ọlọ́run nìkan ṣoṣo ni ó lè dárí ẹ̀ṣẹ̀ jì.
  alternative: Láti mú ẹ̀sùn náà rọrùn, tàbí láti fi àlàyé kún un pé Jésù jẹ́ Ọlọ́run.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ mú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ wá síwájú, ṣùgbọ́n kò sọ ìparí rẹ̀ ní kedere níbí; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí àkọsílẹ̀ Lúùkù fi sílẹ̀ gẹ́gẹ́ bí ìfọ̀rọ̀wérọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; àmì ohùn ni a lò ní kíkún níbi tí ó bá bá àṣà Yorùbá mu. ‘Àwọn akọ̀wé’ àti ‘àwọn Farisí’ pa àwọ̀ ìtàn àti ọ̀rọ̀ ẹ̀sìn ti àyíká Ìhìn Rere mọ́.
