  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: yo
  text: Símónì sì dáhùn pé, “Ọ̀gá, gbogbo òru ni a fi ṣiṣẹ́ kára[a], a kò sì mú ohunkóhun; ṣùgbọ́n nítorí ọ̀rọ̀ rẹ[b], mo máa sọ àwọn àwọ̀n náà kalẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣe làálàá.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ìsapá líle.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “lórí ọ̀rọ̀ rẹ” tàbí “nípa ọ̀rọ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: dáhùn pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi sọ àṣà ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí ‘ó dáhùn, ó sì wí,’ láìṣe àtúnsọ tí kò pọndandan.
- source_word: Ἐπιστάτα
  choice: Ọ̀gá
  rationale: ‘Ọ̀gá’ fi hàn pé Símónì mọ àṣẹ àti ipò Jésù, ṣùgbọ́n kò gbé ìtumọ̀ κύριος (‘Olúwa’) wọ inú akọle yìí.
- source_word: δι’ ὅλης νυκτός
  choice: gbogbo òru ni a fi
  rationale: Gbólóhùn yìí sọ pé iṣẹ́ náà gba gbogbo òru, ó sì jẹ́ Yorùbá tí ó wọ́pọ̀.
- source_word: κοπιάσαντες
  choice: ṣiṣẹ́ kára
  rationale: Ó mú ìsapá líle inú ọ̀rọ̀ Gíríìkì jáde ní èdè Yorùbá òde òní; ‘ṣe làálàá’ tún ṣeé lò.
- source_word: οὐδὲν ἐλάβομεν
  choice: a kò sì mú ohunkóhun
  rationale: Nínú ọ̀rọ̀ ìpẹja, ‘mú’ túmọ̀ sí pípa ẹja; ‘ohunkóhun’ pa bí orísun ṣe sọ̀rọ̀ láìdárúkọ ẹja mọ́.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ṣùgbọ́n nítorí ọ̀rọ̀ rẹ
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìrí èso iṣẹ́ wọn àti ìgbọ́ràn Símónì, ó sì sọ pé ọ̀rọ̀ Jésù ni ìdí tàbí ìpìlẹ̀ ìṣe náà.
- source_word: χαλάσω
  choice: èmi yóò sọ … kalẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ àwọ̀n sínú omi; fífi ‘èmi’ síbẹ̀ tẹnumọ́ ìpinnu Símónì gẹ́gẹ́ bí ọ̀rọ̀-ìṣe ẹyọ kan ṣe rí.
- source_word: τὰ δίκτυα
  choice: àwọn àwọ̀n náà
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ inú ẹ̀rí SBLGNT mọ́, ó sì ṣe kedere pé àwọ̀n ìpẹja tí a ti mẹ́nu kàn ni.
theological_decisions:
- issue: Bí a ṣe túmọ̀ akọle Ἐπιστάτα fún Jésù
  choice: Ọ̀gá
  alternative: Olúwa; Olùkọ́
  rationale: Orísun lo ἐπιστάτης, kì í ṣe κύριος tàbí διδάσκαλος. ‘Ọ̀gá’ pa ìmọ̀wọ̀n àṣẹ Jésù mọ́ láìfi ìtumọ̀ kíkún ‘Olúwa’ tàbí ìtumọ̀ pàtó ‘Olùkọ́’ kún un.
- issue: Ìtumọ̀ ἐπὶ τῷ ῥήματί σου
  choice: nítorí ọ̀rọ̀ rẹ
  alternative: lórí ọ̀rọ̀ rẹ; nípa ọ̀rọ̀ rẹ
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà lè tọ́ka sí ìdí tàbí ìpìlẹ̀ ìṣe Símónì. A yan èdè àdánidá, a sì pa àwọn ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà tẹ̀lé ìṣàn ọ̀rọ̀ Yorùbá, ó pa nọ́ńbà ọ̀pọ̀ ‘àwọn àwọ̀n’ mọ́, kò sì fi akọle ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì kún un.
