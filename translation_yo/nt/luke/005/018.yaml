  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: yo
  text: Kíyèsí i, àwọn ọkùnrin kan ń gbé ọkùnrin kan tí ó ní ẹ̀gba lórí ibùsùn. Wọ́n ń wá ọ̀nà láti gbé e wọlé, kí wọ́n sì gbé e kalẹ̀ níwájú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ìyẹn ni pé, níwájú Jésù.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó pa iṣẹ́ ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìpè láti fa àfiyèsí sí ohun tó ń ṣẹlẹ̀, ní èdè Yorùbá tó ṣe kedere.
- source_word: ἄνδρες
  choice: àwọn ọkùnrin kan
  rationale: Ἀνήρ ń tọ́ka sí àwọn ọkùnrin, ọ̀rọ̀ náà sì jẹ́ aláìdánimọ̀ níhìn-ín; “kan” mú èyí jáde lọ́nà àdánidá.
- source_word: φέροντες
  choice: ń gbé
  rationale: Ìṣe olùṣe tó wà ní àsìkò ìsinsìnyí nínú Gíríìkì fi hàn pé ìgbé náà ń lọ lọ́wọ́ nínú ìṣẹ̀lẹ̀ náà.
- source_word: ἐπὶ κλίνης
  choice: lórí ibùsùn
  rationale: Κλίνη lè túmọ̀ sí ibùsùn tàbí ohun tí ó dà bí ibùsùn; “ibùsùn” jẹ́ ọ̀rọ̀ tó ṣe tààrà tí kò fi ìtumọ̀ àfikún kún un.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ẹnì kan tí ó jẹ́ ọkùnrin; ìtumọ̀ yìí ṣe kedere, ó sì bá àyíká mu.
- source_word: παραλελυμένος
  choice: tí ara rẹ̀ rọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere láti sọ ipò àìlera paralysis tí ó ti bá ẹni náà.
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Àìpé àsìkò nínú Gíríìkì ń fi ìgbìyànjú tó ń bá a lọ hàn; “ń wá ọ̀nà” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: εἰσενεγκεῖν
  choice: láti gbé e wọlé
  rationale: Ó mú ìtumọ̀ gbígbé ẹni náà wọ inú ilé jáde, ó sì bá ohun tí àwọn ọkùnrin náà ń ṣe mu.
- source_word: θεῖναι
  choice: kí wọ́n sì gbé e kalẹ̀
  rationale: Τίθημι túmọ̀ sí fífi tàbí gbígbé ohun kan sí ibì kan; “gbé e kalẹ̀” jẹ́ èdè Yorùbá àdánidá ní àyíká yìí.
- source_word: ἐνώπιον αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Èyí pa arọ́pò-orúkọ Gíríìkì mọ́, láì fi orúkọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sínú ẹsẹ náà.
theological_decisions:
- issue: Ẹni tí αὐτοῦ tó wà ní òpin ẹsẹ náà ń tọ́ka sí
  choice: níwájú rẹ̀
  alternative: níwájú Jésù
  rationale: Àyíká ìtàn fi hàn pé Jésù ni arọ́pò-orúkọ náà ń tọ́ka sí, ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ, kì í ṣe orúkọ Jésù. A pa àìsọ-orúkọ yẹn mọ́ nínú ẹsẹ, a sì ṣàlàyé ẹni tí ó ń tọ́ka sí nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ara rẹ̀ rọ” fún paralysis nítorí pé ó jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, a sì pa ìlọsíwájú àwọn ìṣe inú ìtàn mọ́ pẹ̀lú àmì “ń”.
