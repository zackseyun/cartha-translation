source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: yo
  text: 'Ṣùgbọ́n àwọn ọjọ́ yóò dé, nígbà tí a ó bá mú ọkọ ìyàwó kúrò lọ́dọ̀ wọn[a], nígbà náà ni wọn yóò gbààwẹ̀ ní àwọn ọjọ́ wọ̀nyẹn.


    [a] Tàbí, “a yọ ọkọ ìyàwó kúrò lọ́dọ̀ wọn.” Ọ̀rọ̀ Gíríìkì náà ń fi hàn pé a mú ọkọ ìyàwó náà kúrò lọ́dọ̀ wọn, kì í ṣe pé òun fúnra rẹ̀ kàn lọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a yọ ọkọ ìyàwó kúrò lọ́dọ̀ wọn.” Ọ̀rọ̀ Gíríìkì náà ń fi hàn pé a mú ọkọ ìyàwó náà kúrò lọ́dọ̀ wọn, kì í ṣe pé òun fúnra rẹ̀ kàn lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: àwọn ọjọ́ yóò dé
  rationale: Èyí pa àwòrán àsọtẹ́lẹ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣeé lóye láti sọ pé àkókò kan ń bọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín ipò ìsinsìnyí àti ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú.
- source_word: ὅταν
  choice: nígbà tí
  rationale: Ó ṣe àfihàn ìṣẹ̀lẹ̀ ọjọ́ iwájú tí yóò ṣáájú gbígbààwẹ̀ wọn.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: a ó mú ... kúrò lọ́dọ̀ wọn
  rationale: Ìtumọ̀ aláìdárúkọ ẹni tó ṣe iṣẹ́ náà jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ohùn àìṣe Gíríìkì àti ìmọ̀lára pé a fi agbára mú un kúrò mọ́.
- source_word: ὁ νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọkọ ní àyíká ayẹyẹ ìgbéyàwó, ó sì pa àkàwé náà mọ́.
- source_word: τότε
  choice: nígbà náà ni
  rationale: Ìlò ‘ni’ tẹnu mọ́ àkókò tí ìyọkúrò ọkọ ìyàwó yóò yọrí sí gbígbààwẹ̀.
- source_word: νηστεύσουσιν
  choice: wọn yóò gbààwẹ̀
  rationale: ‘Gbààwẹ̀’ túmọ̀ sí fífi oúnjẹ sílẹ̀ nítorí ète ẹ̀sìn, kì í ṣe àìjẹun lásán.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó pa àtúnsọ àsìkò ọjọ́ iwájú tó wà nínú Gíríìkì mọ́, ó sì tẹnu mọ́ àkókò náà.
theological_decisions:
- issue: Bóyá kí a sọ ἀπαρθῇ di pé ọkọ ìyàwó kàn lọ fúnra rẹ̀
  choice: a ó mú ọkọ ìyàwó kúrò lọ́dọ̀ wọn
  alternative: ọkọ ìyàwó yóò fi wọ́n sílẹ̀ / yóò lọ kúrò lọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ti ohùn àìṣe, ó sì ní ìmọ̀lára ìyọkúrò tí ẹlòmíràn ṣe. Yíyan èyí pa ìfojúsọ́nà àti ìnira ọ̀rọ̀ Jésù mọ́ láìṣe àlàyé rẹ̀ débi ẹ̀kọ́ ìsìn kan pàtó.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní ni a lò. A pa àtúnsọ ‘àwọn ọjọ́’ àti ìtẹnumọ́ ‘nígbà náà ni’ mọ́, nígbà tí a lo ìtumọ̀ aláìdárúkọ ẹni ‘a ó mú’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ohùn àìṣe.
