language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: yo
  text: Nígbà náà, ó wọ ọ̀kan nínú àwọn ọkọ̀ ojú omi náà, èyí tí ó jẹ́ ti Símónì, ó sì béèrè lọ́wọ́ rẹ̀ pé kí ó mú ọkọ̀ náà sún kúrò ní ilẹ̀ díẹ̀[a]. Ó jókòó, ó sì ń kọ́ àwọn ogunlọ́gọ̀ ènìyàn náà lórí ọkọ̀ ojú omi náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kúrò létí bèbè.” Ní ọ̀rọ̀ gangan, Gíríìkì sọ pé “kúrò ní ilẹ̀,” ní ìyàtọ̀ sí ọkọ̀ tí ó wà lórí omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: ó wọ
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ wọ ọkọ̀ kí ó tó ní kí Símónì ti ọkọ̀ náà síwájú; “ó wọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó ṣe kedere.
- source_word: πλοίων / πλοίου
  choice: àwọn ọkọ̀ ojú omi / ọkọ̀ ojú omi
  rationale: Ní àyíká adágún àti iṣẹ́ ìpẹja, πλοῖον túmọ̀ sí ọkọ̀ ojú omi kékeré; a pa ìyàtọ̀ ọ̀pọ̀ àti ẹyọ mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: ὃ ἦν Σίμωνος
  choice: èyí tí ó jẹ́ ti Símónì
  rationale: Genitive Σίμωνος ń fi ohun-ìní hàn; gbólóhùn yìí jẹ́ kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: ἠρώτησεν
  choice: ó ní kí
  rationale: Nínú àyíká yìí, ἐρωτάω jẹ́ ìbéèrè tàbí ìwọ̀; ìṣètò “ní kí” ni Yorùbá àdánidá fún bí ẹnì kan ṣe béèrè pé kí ẹlòmíràn ṣe ohun kan, láìsọ ọ́ di àṣẹ líle.
- source_word: ἐπαναγαγεῖν
  choice: ti ọkọ̀ náà síwájú
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígbé ọkọ̀ kúrò létí ilẹ̀ sínú omi; “ti ọkọ̀ náà síwájú” sọ ìṣípò ọkọ̀ náà ní kedere láìfi “sí òkun” kún un.
- source_word: ἀπὸ τῆς γῆς
  choice: kúrò ní ilẹ̀
  rationale: γῆ túmọ̀ ní pàtàkì sí ilẹ̀ tàbí ilẹ̀ gbígbẹ, ní ìyàtọ̀ sí ọkọ̀ tí ó wà lórí omi. A pa ìtumọ̀ gangan náà mọ́, pẹ̀lú àlàyé àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: ὀλίγον
  choice: díẹ̀
  rationale: Ó ń tọ́ka sí ìjìnnà kékeré; “díẹ̀” jẹ́ ṣókí, ó sì ṣe déédéé ní Yorùbá.
- source_word: καθίσας
  choice: ó jókòó
  rationale: Aorist participle náà ṣáájú iṣẹ́ tí imperfect verb ń ṣàpèjúwe; “ó jókòó” fi ìtẹ̀lé iṣẹ́ náà hàn ní èdè ìtàn àdánidá.
- source_word: ἐδίδασκεν
  choice: ó sì ń kọ́
  rationale: Àmì imperfect fi iṣẹ́ tí ń lọ lọ́wọ́ hàn; “ń kọ́” pa ìlọsíwájú iṣẹ́ kọ́ni náà mọ́.
- source_word: τοὺς ὄχλους
  choice: àwọn ènìyàn náà
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì jẹ́ ọ̀pọ̀, Yorùbá máa ń lo “àwọn ènìyàn” fún ọ̀pọ̀ ènìyàn tí ó péjọ; ó yé àwọn òǹkàwé òde òní ju ọ̀rọ̀ tí ó lè dà bí ọ̀pọ̀ ẹgbẹ́ lọ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “Símónì” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tí ó wọ́pọ̀ ní Yorùbá. Gbólóhùn náà pa ìtẹ̀lé ìṣe àti aspect imperfect mọ́ láìjẹ́ kí ìtumọ̀ di líle tàbí àjèjì.
