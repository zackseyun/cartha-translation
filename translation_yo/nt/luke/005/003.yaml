review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì náà dáadáa: ọkọ̀ kan nínú ọ̀pọ̀, ohun-ìní Símónì, ìjìnnà kékeré kúrò ní ilẹ̀, àti iṣẹ́ ìkọ́ni tí ń lọ lọ́wọ́. Síbẹ̀, “ó ní kí Símónì ti ọkọ̀ náà síwájú” kò ṣe kedere gẹ́gẹ́ bí ìbéèrè láti mú ọkọ̀ náà kúrò ní etí ilẹ̀; ó lè dà bí ìtọ́nisọ́nà pé kí ọkọ̀ máa lọ síwájú. “Láti inú ọkọ̀” sì lè túmọ̀ sí láti inú ìhà ọkọ̀, níbi tí Gíríìkì ti ń sọ ibi tí ó ti ń kọ́ni, ìyẹn lórí ọkọ̀.'
  naturalness: Àkọsílẹ̀ náà ní ìlò Yorùbá tí ó dára ní gbogbogbòò. “Béèrè lọ́wọ́ rẹ̀ pé kí ó mú ọkọ̀ náà sún kúrò ní ilẹ̀ díẹ̀” jẹ́ ìtúmọ̀ tí ó rọrùn, tí ó sì ṣe kedere. “Lórí ọkọ̀” tún bá ọ̀nà tí Yorùbá máa ń sọ ibi tí ènìyàn wà láti kọ́ni mu.
  terminology: “Ọkọ̀ ojú omi” àti “Símónì” yẹ. Fun τοὺς ὄχλους, “àwọn ogunlọ́gọ̀ ènìyàn” ń fi ìtumọ̀ ìjọ ènìyàn púpọ̀ hàn dáadáa ju “àwọn ènìyàn náà” lọ. Àlàyé ìsàlẹ̀ yẹ kí ó lo “Ní ọ̀rọ̀ gangan” dípò “Ní gígún.”
  issues:
  - severity: medium
    issue: “ó ní kí Símónì ti ọkọ̀ náà síwájú” jẹ́ àìdánilójú.
    rationale: ἐρωτάω + infinitive ń fi ìbéèrè hàn pé kí Símónì mú ọkọ̀ náà jáde díẹ̀ kúrò ní ilẹ̀. “Ti ... síwájú” kò sọ ìkúrò kúrò ní etí ilẹ̀ ní kedere, ó sì lè yí ìṣe náà sí ìlọ síwájú lásán.
  - severity: low
    issue: “láti inú ọkọ̀ ojú omi náà” kò péye jù fún ἐκ τοῦ πλοίου.
    rationale: Ní àyíká yìí, ìtumọ̀ àdánidá ni pé Jesu ń kọ́ àwọn ènìyàn wọ̀n-ọn lórí ọkọ̀; “láti inú” lè gbé ìtumọ̀ ibi inú ọkọ̀ ga ju ohun tí gbolohun Gíríìkì béèrè lọ.
  - severity: low
    issue: “Ní gígún” nínú àlàyé ìsàlẹ̀ kì í ṣe ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ‘literally.’
    rationale: “Ní ọ̀rọ̀ gangan” jẹ́ kedere sí i, ó sì yẹ fún àlàyé nípa ìtumọ̀ ọ̀rọ̀.
