id: LUK.5.27
reference: Luke 5:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, ó jáde, ó sì rí[a] agbowó-orí kan tí orúkọ rẹ̀ ń jẹ́ Léfì, tí ó jókòó ní ibi tí wọ́n ti ń gba owó-orí[b]. Ó sì sọ fún un pé, “Tẹ̀lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kíyè sí” tàbí “wò”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwòye tó ju rírí lásán lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ibi tí wọ́n ti ń gba owó ìkọjá” tàbí “ní ibùdó kọ́ọ̀sítọ́ọ̀mù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Èyí pa ìtumọ̀ ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtàn tẹ̀ síwájú.
- source_word: ἐξῆλθεν
  choice: ó jáde
  rationale: Ó fi ìṣípò kedere tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí hàn láìfi àlàyé mìíràn kún un.
- source_word: ἐθεάσατο
  choice: ó sì rí
  rationale: “Rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ìtàn mu; àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí wíwo tàbí kíyèsí pẹ̀lú àfiyèsí.
- source_word: τελώνην
  choice: agbowó-orí
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ń gba owó orí tàbí owó ìkọjá fún ìjọba.
- source_word: ὀνόματι Λευὶν
  choice: tí orúkọ rẹ̀ ń jẹ́ Léfì
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìsọfúnni orúkọ ẹni náà.
- source_word: καθήμενον
  choice: tí ó jókòó
  rationale: Ó pa àwòrán Léfì gẹ́gẹ́ bí ẹni tó jókòó síbi iṣẹ́ rẹ̀ mọ́.
- source_word: ἐπὶ τὸ τελώνιον
  choice: ní ibi ìgbà owó-orí
  rationale: Ọ̀rọ̀ yìí sọ ibi tí wọ́n ti ń gba owó orí tàbí owó ìkọjá; “ibi ìgbà owó-orí” yàgò fún fífi irú ilé tàbí àgọ́ kan pàtó lé ọ̀rọ̀ náà lórí.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: Èyí jẹ́ àṣẹ tààrà tí ó pa ìtumọ̀ títẹ̀lé mọ́, tí ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti pe ẹnì kan sí ìtẹ̀lé tí ń bá a lọ.
theological_decisions:
- issue: Agbára àṣẹ Jésù gẹ́gẹ́ bí ìpè sí jíjẹ́ ọmọ-ẹ̀yìn
  choice: “Máa tọ̀ mí lẹ́yìn” gẹ́gẹ́ bí àṣẹ tààrà
  alternative: “Di ọmọ-ẹ̀yìn mi” tàbí “Máa tọ̀ mí lẹ́yìn gẹ́gẹ́ bí ọmọ-ẹ̀yìn”
  rationale: Àyíká náà fi hàn pé ìpè sí jíjẹ́ ọmọ-ẹ̀yìn ni, ṣùgbọ́n ìtumọ̀ kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàn “Léfì” gẹ́gẹ́ bí ìkọ orúkọ náà ní Yorùbá.
