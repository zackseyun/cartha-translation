  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: yo
  text: Ṣùgbọ́n ìròyìn nípa rẹ̀ ń tàn kálẹ̀ sí i[a], ọ̀pọ̀ ogunlọ́gọ̀ ènìyàn sì ń péjọ láti gbọ́ àti láti rí ìwòsàn kúrò nínú àìsàn wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ nípa rẹ̀” tàbí “ìròyìn nípa rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: ń tàn kálẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó ń bá a lọ hàn; ‘ń tàn kálẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìròyìn ń lọ káàkiri.
- source_word: μᾶλλον
  choice: sí i
  rationale: ‘Sí i’ pa agbára ìfiwéra mọ́, pé ìtàn náà ń tàn kálẹ̀ ju ti tẹ́lẹ̀ lọ.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: ìròyìn nípa rẹ̀
  rationale: Nínú àyíká ìtàn yìí, λόγος túmọ̀ sí ìròyìn tàbí ohun tí àwọn ènìyàn ń sọ nípa Jésù, kì í ṣe ọ̀rọ̀ ẹ̀kọ́ ẹ̀sìn ní ìtumọ̀ pàtó.
- source_word: συνήρχοντο
  choice: ń péjọ
  rationale: Àkókò imperfect fi ìpéjọ tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra hàn.
- source_word: ὄχλοι πολλοὶ
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ọ̀pọ̀ àwùjọ ènìyàn, láìlo gbólóhùn tí kò rọrùn bí ‘ọ̀pọ̀ ogunlọ́gọ̀.’
- source_word: ἀκούειν
  choice: láti gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Èdè Gíríìkì fi ohun tí wọ́n fẹ́ gbọ́ sílẹ̀ láìsọ ọ́; Yorùbá nílò àfikún kékeré yìí fún ìtumọ̀ tí ó mọ́, ó sì hàn nínú àyíká pé wọ́n wá gbọ́ Jésù.
- source_word: θεραπεύεσθαι
  choice: láti rí ìwòsàn
  rationale: 'Èyí sọ ìtumọ̀ passive náà ní Yorùbá àdánidá: kí a wo wọn sàn tàbí kí wọ́n gba ìwòsàn.'
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: kúrò nínú àìsàn wọn
  rationale: ‘Kúrò nínú’ ṣe àfihàn agbára ἀπό, nígbà tí ‘àìsàn’ bá àyíká ìwòsàn ara mu.
theological_decisions:
- issue: Irú ìwòsàn tí ẹsẹ náà ń sọ
  choice: Lo èdè ìwòsàn ara ní tààràtà láìfẹ̀ sí ìtumọ̀ ẹ̀mí.
  alternative: Lo gbólóhùn gbooro bí ‘kí a mú wọn pé’ tí ó lè tọ́ka sí ìmúpadàbọ̀sípò ẹ̀mí.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ sọ nípa àwọn àìsàn àwọn ènìyàn; kò sọ ní kedere pé ìwòsàn ẹ̀mí ni.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; àṣà èdè jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ìròyìn’ fún λόγος ní àyíká yìí, a sì pa ìṣe tí ó ń bá a lọ mọ́ nípasẹ̀ ‘ń.’
