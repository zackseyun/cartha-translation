  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: yo
  text: Ṣùgbọ́n òun máa ń yà sọ́tọ̀ ní àwọn ibi ahoro, ó sì máa ń gbàdúrà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n òun fúnra rẹ̀ ń yà sọ́tọ̀ ní àwọn ibi ahoro, ó sì ń gbàdúrà.” Nínú èdè Gíríìkì, ọ̀rọ̀-ìṣe aláìpé kan pẹ̀lú àwọn participle fi ìṣe tí ó ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀ léraléra hàn.
    reason: Àlàyé nípa ọ̀nà míì láti túmọ̀ ọ̀rọ̀ náà àti bí ìṣe náà ṣe ń wáyé.
lexical_decisions:
- source_word: αὐτὸς
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ní ìtẹnumọ́ díẹ̀; “òun” jẹ́ ọ̀nà àdánidá láti fi ìtẹnumọ́ yẹn hàn ní Yorùbá.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn sí bí òkìkí Jésù ṣe ń tàn ká sí i ní àyíká ẹsẹ yìí.
- source_word: ἦν ὑποχωρῶν
  choice: a máa fà sẹ́yìn lọ
  rationale: Ìṣètò ọ̀rọ̀ aláìpé pẹ̀lú participle ń tọ́ka sí ohun tí ó máa ń ṣẹlẹ̀ léraléra tàbí tí ó jẹ́ àṣà; “a máa” sọ ìṣe àṣà náà ní Yorùbá àdánidá, “fà sẹ́yìn lọ” sì pa ìtumọ̀ yíyọ kúrò lọ́dọ̀ àwọn ènìyàn mọ́.
- source_word: ἐν ταῖς ἐρήμοις
  choice: sí àwọn ibi ahoro
  rationale: Ọ̀pọ̀ ἔρημος ń tọ́ka sí àwọn ibi tí ènìyàn kò gbé tàbí ibi ìdákẹ́jẹ. “Àwọn ibi ahoro” kò fi dandan mú kí a ronú nípa aṣálẹ̀ kan pàtó; “sí” sì bá ọ̀rọ̀ ìṣípò “fà sẹ́yìn lọ” mu ní Yorùbá.
- source_word: καὶ προσευχόμενος
  choice: a sì máa gbàdúrà
  rationale: Ó so ìṣe kejì tí ó ń ṣẹlẹ̀ léraléra mọ́ ti àkọ́kọ́, láì sọ ọ́ di ète tàbí àbájáde rẹ̀.
theological_decisions:
- issue: Bí ìṣe Jésù ṣe ń wáyé nípa àkókò
  choice: Ẹsẹ náà ṣàpèjúwe àṣà Jésù láti máa yọ kúrò lọ́dọ̀ àwọn ènìyàn kí ó sì máa gbàdúrà.
  alternative: Ó lè jẹ́ ìṣẹ̀lẹ̀ kan ṣoṣo tí ẹsẹ náà ń ròyìn.
  rationale: ἦν pẹ̀lú àwọn present participle méjèèjì sábà ń fi ìṣe tí ó ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀ léraléra hàn. “A máa” pa ìtumọ̀ àṣà yìí mọ́ láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “àwọn ibi ahoro” fún ibi tí kò sí ènìyàn dípò ọ̀rọ̀ tí yóò dandan túmọ̀ sí aṣálẹ̀.
