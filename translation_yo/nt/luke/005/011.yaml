source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti mú àwọn ọkọ̀ ojú omi náà dé orí ilẹ̀[a], wọ́n fi ohun gbogbo sílẹ̀[b], wọ́n sì tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n mú àwọn ọkọ̀ ojú omi náà wá sí ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi gbogbo nǹkan sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: Nígbà tí wọ́n sì ti mú ... dé
  rationale: Aorist participle náà fi ìṣe tó ṣáájú àwọn ìṣe pàtàkì hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: τὰ πλοῖα
  choice: àwọn ọkọ̀ ojú omi náà
  rationale: Nínú àyíká iṣẹ́ apẹja ní Galili, πλοῖα túmọ̀ sí àwọn ọkọ̀ ojú omi, kì í ṣe ọkọ̀ ńlá ní pàtó.
- source_word: ἐπὶ τὴν γῆν
  choice: dé orí ilẹ̀
  rationale: Èyí pa ìtumọ̀ gangan ‘sí orí ilẹ̀’ mọ́, ó sì bá bí a ṣe ń sọ ní Yorùbá mu láì fi ‘etíkun’ kún ibi tí γῆ kò sọ ọ́ ní pàtó.
- source_word: ἀφέντες
  choice: wọ́n fi ... sílẹ̀
  rationale: ἀφίημι níbí túmọ̀ sí fífi nǹkan sílẹ̀ tàbí kọ̀ ọ́ sílẹ̀; lílo ọ̀rọ̀-ìṣe aláàlàyé yìí mú gbolohun náà ṣe kedere ní Yorùbá.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ náà ní agbára àkópọ̀ tó túmọ̀ sí gbogbo ohun, láì ṣe àfikún ohun tí àwọn náà jẹ́ tàbí bóyá fífi wọn sílẹ̀ náà jẹ́ títí láé.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wọ́n sì tẹ̀ lé e
  rationale: ‘Tẹ̀ lé’ ń gba ìtumọ̀ títẹ̀ lé ẹnì kan ní ti ìrìn àti ní ti jíjẹ́ ọmọ-ẹ̀yìn, láì ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Ìwọ̀n ohun tí πάντα kó sínú fífi sílẹ̀
  choice: wọ́n fi ohun gbogbo sílẹ̀
  alternative: wọ́n fi gbogbo nǹkan sílẹ̀
  rationale: ‘Ohun gbogbo’ pa agbára àkópọ̀ πάντα mọ́, ṣùgbọ́n kò sọ ju ẹsẹ náà lọ nípa ohun tí wọ́n ní tàbí bóyá wọ́n ta gbogbo ohun-ìní wọn tán.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. A lo ‘ọkọ̀ ojú omi’ fún ìtumọ̀ tó ṣe kedere, ‘tẹ̀ lé e’ sì pa ìṣe ìtàn àti ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn mọ́.
