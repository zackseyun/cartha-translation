language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: yo
  text: Kò sì sí ẹni tí ó máa ń fi wáìnì tuntun sínú àwọn àpò awọ àtijọ́[a]. Bí bẹ́ẹ̀ kọ́, wáìnì tuntun náà yóò fa àwọn àpò awọ náà ya; wáìnì náà yóò dà nù[b], àwọn àpò awọ náà yóò sì bàjẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘àwọn awọ àtijọ́.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn àpò tí a fi awọ ẹranko ṣe, tí a sì ń lò láti fi wáìnì pamọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘yóò tú jáde.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: fi ... sínú
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ohun kan sí ibì kan. ‘Fi ... sínú’ jẹ́ ọ̀nà Yorùbá àdánidá, kò sì fi ìtumọ̀ ‘dà’ kún ọ̀rọ̀ orísun.
- source_word: οἶνον νέον
  choice: ọtí wáìnì tuntun
  rationale: Èyí jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún wáìnì tuntun, ó sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìwú ọtí mọ́.
- source_word: ἀσκοὺς παλαιούς
  choice: àpò awọ ti àtijọ́
  rationale: ἀσκός jẹ́ àpò tí a fi awọ ẹranko ṣe fún omi tàbí ọtí. Gbólóhùn yìí jẹ́ kedere ní Yorùbá, ó sì yẹra fún fífi àpò ọ̀hún hàn bí awọ lásán.
- source_word: εἰ δὲ μήγε
  choice: Bí bẹ́ẹ̀ kọ́
  rationale: Ó sọ àbájáde ohun tí yóò ṣẹlẹ̀ bí ènìyàn bá ṣe ohun tí a ṣẹ̀ṣẹ̀ sọ pé kò yẹ.
- source_word: ῥήξει
  choice: yóò fa ... ya
  rationale: 'Fáàbù náà jẹ́ oníṣe: ọtí tuntun ni yóò mú kí àwọn àpò náà ya. Ọ̀rọ̀ yìí pa ìbáṣepọ̀ gírámà orísun mọ́.'
- source_word: ἐκχυθήσεται
  choice: yóò dà nù
  rationale: Fọ́ọ̀mù àìṣe náà ṣàpèjúwe ọtí tí yóò tú jáde tí yóò sì ṣòfò lẹ́yìn tí àpò bá ya.
- source_word: ἀπολοῦνται
  choice: yóò bàjẹ́
  rationale: Nípa àwọn àpò, ‘bàjẹ́’ fi hàn pé wọn yóò di aláìlò mọ́, láìfi ìtumọ̀ ìparun pátápátá kún un.
- source_word: καὶ αὐτός
  choice: ọtí náà
  rationale: Àrọ́pò-orúkọ náà tọ́ka sí ọtí tuntun. Títún ‘ọtí náà’ sọ jẹ́ àdánidá ní Yorùbá, ó sì mú ẹni tí a ń tọ́ka sí ṣe kedere.
- source_word: οὐδεὶς
  choice: Kò sì sí ẹni
  rationale: Èyí jẹ́ ìṣàfihàn Yorùbá tí ó ṣe kedere fún ‘kò sí ẹnikẹ́ni,’ ó sì bá ìró òwe gbólóhùn náà mu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘ọtí wáìnì’ fún ìmọ̀ kedere, àti ‘àpò awọ’ láti ṣàlàyé ohun èlò àṣà ìgbàanì láìsọ ọ̀rọ̀ náà di gígùn jù.
