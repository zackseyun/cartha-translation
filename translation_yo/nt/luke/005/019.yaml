id: LUK.5.19
reference: Luke 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: yo
  text: Wọ́n kò sì rí ọ̀nà tí wọ́n yóò fi gbé e wọlé nítorí ọ̀pọ̀ ènìyàn[a]. Nítorí náà, wọ́n gòkè sórí òrùlé, wọ́n sì sọ ọ́ kalẹ̀ pẹ̀lú àkéte rẹ̀[c], gba àárín àwọn àwo amọ̀ òrùlé[b], sí àárín, níwájú Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kò rí bí wọ́n yóò ṣe gbé e wọlé nítorí ọ̀pọ̀ ènìyàn.” Ọ̀nà tí èdè Gíríìkì gbà sọ ọ́ lè tẹnu mọ́ bí wọ́n yóò ṣe ṣe é tàbí ọ̀nà tí wọ́n yóò gbà wọlé.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n gba àárín àwọn àwo amọ̀ tí a fi bo òrùlé; ọ̀rọ̀ Lúùkù fi irú òrùlé tí a fi àwo amọ̀ bò hàn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ibùsùn kékeré rẹ̀” tàbí “ohun tí wọ́n fi gbé e.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibùsùn kékeré tàbí àkéte ìsùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας
  choice: ọ̀nà tí wọn yóò fi
  rationale: Ọ̀rọ̀ Gíríìkì yìí dúró ní ààyè gbólóhùn tí ó lè túmọ̀ sí ọ̀nà àbáwọlé tàbí bí iṣẹ́ náà yóò ṣe wáyé. Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀nà tàbí ọgbọ́n iṣẹ́ mọ́.
- source_word: εἰσενέγκωσιν
  choice: gbé e wọlé
  rationale: Ó fi hàn pé wọ́n fẹ́ gbé ọkùnrin náà wọ inú ilé; ‘gbé’ tún bá ọ̀rọ̀ àyíká mu pé àwọn ènìyàn ń ru ẹni tí kò lè rìn.
- source_word: διὰ τὸν ὄχλον
  choice: nítorí ọ̀pọ̀ ènìyàn
  rationale: διά pẹ̀lú accusative níbí ń sọ ìdí tàbí ìdènà, kì í ṣe pé wọ́n ń la àárín ọ̀pọ̀ ènìyàn kọjá.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: wọ́n gòkè sórí òrùlé
  rationale: Èyí fi ìlọ sókè àti ibi tí wọ́n dé hàn ní Yorùbá òde òní tí ó ṣe kedere.
- source_word: διὰ τῶν κεράμων
  choice: láàárín àwọn àwo amọ̀ òrùlé
  rationale: κέραμος ní ọ̀pọ̀ nǹkan ń tọ́ka sí àwọn àwo amọ̀ tí a fi bo òrùlé. Àṣàyàn yìí yà á sọ́tọ̀ kúrò lọ́dọ̀ táìlì ilẹ̀.
- source_word: καθῆκαν
  choice: sọ ... kalẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí mímú ohun sọ̀ kalẹ̀ láti òkè; ìkọ̀wé yìí jẹ́ àdánidá ní Yorùbá.
- source_word: σὺν τῷ κλινιδίῳ
  choice: òun àti àkéte rẹ̀
  rationale: κλινίδιον jẹ́ ibùsùn kékeré tàbí ohun tí a lè dùbúlẹ̀ lé. ‘Àkéte’ yàgò fún ìtumọ̀ ohun èlò ìṣègùn òde òní tí ‘stretcher’ lè mú wọlé.
- source_word: εἰς τὸ μέσον
  choice: sí àárín
  rationale: Ó pa ìtọ́ka sí ibi àárín ìpéjọpọ̀ mọ́ láì fi ‘àwọn ènìyàn’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: níwájú Jésù
  rationale: Èyí sọ ipò ọkùnrin náà ní ìbámu pẹ̀lú Jésù ní kedere, kì í ṣe àkókò tàbí ìdájọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìpele àárín tí ó bójú mu fún Ìwé Mímọ́, tí ó ní ọlá ṣùgbọ́n tí ó tún ṣe kedere sí òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó jẹ́ àdánidá. ‘Àwo amọ̀ òrùlé’ ń ṣàlàyé àwòrán ilé ayé Lúùkù láì lo ọ̀rọ̀ àjèjì ‘táìlì’; ‘àkéte’ sì jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn lè lóye.
