  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ṣetọju ìtòlẹ́sẹẹsẹ àti ìtumọ̀ pàtàkì ti Gíríìkì: ìyàlẹ́nu/ìpayà dé bá gbogbo ènìyàn, wọ́n ń fi ògo fún Ọlọ́run, ẹ̀rù kún wọn, wọ́n sì jẹ́wọ́ pé wọ́n ti rí ohun tí ó kọjá ìrètí. Síbẹ̀, “gba gbogbo wọn” kì í ṣe ọ̀nà Yorùbá tí ó dára jù lọ láti mú ἔλαβεν ἅπαντας nínú àyíká yìí; “bá gbogbo wọn” ń mú ìtumọ̀ náà jáde ní kedere àti ní àdánidá.'
  naturalness: “Ìyàlẹ́nu bá gbogbo wọn” jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá tó wọ́pọ̀ ju “ìyàlẹ́nu gba gbogbo wọn” lọ. “lónìí” sì jẹ́ ìtumọ̀ òde-òní, kúkúrú, tí ó bá σήμερον mu dáadáa. A tún ṣe àtúnṣe ìkọ̀wé “ìyàlẹ́nu” pẹ̀lú àmì ohùn tó péye.
  terminology: “Ọlọ́run,” “fi ògo fún Ọlọ́run,” “ẹ̀rù,” àti “àwọn ohun àrà” jẹ́ àwọn ọ̀rọ̀ tó yẹ. “Ẹ̀rù” ń pa φόβος mọ́ ní ti gidi láì rọ̀ ọ́ sí “ọ̀wọ̀” nìkan. A kò yẹ kí àlàyé ẹsẹ̀-ìsàlẹ̀ pè ìyàlẹ́nu náà ní “ìyanu ńlá,” nítorí ìyẹn lè yí ìdáhùn àwọn ènìyàn padà sí iṣẹ́ ìyanu tí wọ́n rí.
  issues:
  - severity: medium
    issue: “Ìyàlẹ́nu sì gba gbogbo wọn” kò dára jù lọ gẹ́gẹ́ bí ìṣọ̀kan ọ̀rọ̀ Yorùbá.
    rationale: Nínú Yorùbá, ìyàlẹ́nu tàbí ìpayà sábà máa ń “bá” ènìyàn. “Bá gbogbo wọn” ń ṣàfihàn dáadáa pé ìyàlẹ́nu náà dé lórí gbogbo wọn, gẹ́gẹ́ bí ἔλαβεν ἅπαντας.
  - severity: medium
    issue: Àlàyé aami [a] ń fúnni ní “ìyanu ńlá mú gbogbo wọn” gẹ́gẹ́ bí àṣàyàn.
    rationale: “Ìyanu” lè tọ́ka sí iṣẹ́ ìyanu fúnra rẹ̀, kì í ṣe ìmọ̀lára ìyàlẹ́nu tí ἔκστασις ń sọ níbí. Àlàyé náà yẹ kí ó dojú kọ àwọn àṣàyàn fún ìmọ̀lára náà, bí “ìpayà” tàbí “ìyàlẹ́nu ńlá.”
