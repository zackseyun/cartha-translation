source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: yo
  text: Ìyàlẹ́nu sì bá gbogbo wọn, wọ́n sì ń fi ògo fún Ọlọ́run; ẹ̀rù sì kún wọn, wọ́n sì ń sọ pé, “A ti rí àwọn ohun àrà lónìí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκστασις
  choice: ìyàlẹ́nu
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí ìyàlẹ́nu ńlá tí ó borí àwọn ènìyàn, kì í ṣe ìrírí àdììtú ẹ̀mí.
- source_word: ἔλαβεν ἅπαντας
  choice: gba gbogbo wọn
  rationale: 'Èyí pa àwòrán gbígbóná ti ọ̀rọ̀ Gíríìkì mọ́: ìyàlẹ́nu náà mú gbogbo wọn tàbí gba gbogbo wọn.'
- source_word: ἐδόξαζον
  choice: wọ́n sì ń yin Ọlọ́run lógo
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú imperfect ni “ń” fi hàn; “yin ... lógo” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń fi ògo fún Ọlọ́run.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ọ̀rọ̀ náà mu.
- source_word: ἐπλήσθησαν φόβου
  choice: ẹ̀rù sì kún wọn
  rationale: Ìtumọ̀ yìí tọ́ka sí pé ẹ̀rù kún inú wọn, ó sì pa agbára φόβος mọ́ láì sọ ọ́ di ìbẹ̀rù-ọ̀wọ̀ nìkan.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ó ṣàfihàn ìṣe tí ó ń bá ìyìn wọn lọ, ó sì ṣí ọ̀rọ̀ tí wọ́n sọ.
- source_word: Εἴδομεν
  choice: A ti rí
  rationale: Perfect Yorùbá náà fi hàn pé ohun tí wọ́n ṣẹ̀ṣẹ̀ rí ló fa ìdáhùn wọn ní àkókò yẹn.
- source_word: παράδοξα
  choice: àwọn ohun àrà
  rationale: “Ohun àrà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ó kọjá ohun tí a máa ń retí, láì fún un ní ìtumọ̀ búburú.
- source_word: σήμερον
  choice: lọ́jọ́ òní
  rationale: Ó túmọ̀ sí “lónìí,” ó sì pa ìmójúmó ohun tí wọ́n rí mọ́.
theological_decisions:
- issue: Ìtumọ̀ φόβος nígbà tí àwọn ènìyàn rí iṣẹ́ agbára Ọlọ́run
  choice: ẹ̀rù
  alternative: ìbẹ̀rù-ọ̀wọ̀
  rationale: “Ẹ̀rù” pa ìforígbárí inú ẹsẹ náà mọ́ láàárín ìpayà àti fífi ògo fún Ọlọ́run; a kò rọ̀ ọ́ di ọ̀wọ̀ tàbí ìyanu nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ń” láti pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí yóò túmọ̀ φόβος ní ọ̀nà ẹ̀gbẹ́ kan ṣoṣo.
