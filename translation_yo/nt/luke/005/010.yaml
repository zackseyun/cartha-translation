  source_fidelity: 'Ìtumọ̀ náà ń pa ètò àti ìtumọ̀ gbólóhùn Gíríìkì mọ́ dáadáa: Jákọ́bù àti Jòhánù ni a fi kún Símoni, wọ́n jẹ́ alábàákẹ́gbẹ́ nínú iṣẹ́ ìpẹja, Jésù sì fún Símoni ní ìtùnú àti ìpè tuntun. “máa mú àwọn ènìyàn láàyè” ń gbìyànjú láti pa ìtumọ̀ ζωγρῶν—mímú ní ìyè—mọ́, láì mú un bá ọ̀rọ̀ ‘apẹja ènìyàn’ inú àwọn ìwé Mátíù àti Máàkù mu. Ṣùgbọ́n ìtẹ̀sí ẹsẹ-ìsàlẹ̀ a lo “ní ààyè,” èyí tí kò túmọ̀ sí ‘alive’ ní Yorùbá.'
