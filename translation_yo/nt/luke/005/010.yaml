  terminology: Àwọn orúkọ Jákọ́bù, Jòhánù, Símoni, àti Jésù bójú mu. “àwọn ènìyàn” jẹ́ ìtumọ̀ tó pé fún ἀνθρώπους nínú àyíká yìí. A túnṣe àlàyé ζωγρέω kí ó lo “ní ìyè/láàyè,” kì í ṣe “ní ààyè,” tí ó túmọ̀ sí ibi tàbí àyè.
