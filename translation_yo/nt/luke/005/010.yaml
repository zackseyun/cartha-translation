id: LUK.5.10
reference: Luke 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ó sì rí fún Jákọ́bù àti Jòhánù, àwọn ọmọ Sebedéè, tí wọ́n jẹ́ alábàáṣiṣẹ́ pẹ̀lú Símoni. Jésù sì sọ fún Símoni pé, “Má bẹ̀rù; láti ìsinsìnyí lọ, ìwọ yóò máa mú àwọn ènìyàn láàyè.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwọ yóò máa mú àwọn ènìyàn ní ìyè.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí mímú tàbí kíkó ẹni láàyè, kì í ṣe pípa ẹni.
    reason: lexical_alternative
  - marker: b
    text: Fi wé Mátíù 4:19 àti Máàkù 1:17, níbi tí Jésù ti sọ pé, “Èmi yóò sọ yín di apẹja ènìyàn.” Ọ̀rọ̀ tí Lúùkù lò níhìn-ín yàtọ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Bẹ́ẹ̀ náà ni ó sì rí fún
  rationale: Ọ̀rọ̀ yìí so ohun tó ṣẹlẹ̀ sí Jákọ́bù àti Jòhánù mọ́ ìyàlẹ́nu àti ẹ̀rù tí ẹsẹ tó ṣáájú sọ pé ó dé bá Símoni àti àwọn tó wà pẹ̀lú rẹ̀. Ó jẹ́ èdè Yorùbá àdánidá láì tún ohun tí Gíríìkì kò tún sọ ṣe.
- source_word: υἱοὺς Ζεβεδαίου
  choice: àwọn ọmọ Sebedéè
  rationale: Ó pa ìdánimọ̀ wọn gẹ́gẹ́ bí ọmọ Sebedéè mọ́ ní ọ̀nà tó bójú mu ní Yorùbá.
- source_word: κοινωνοὶ
  choice: alábàáṣiṣẹ́pọ̀
  rationale: Nínú àyíká iṣẹ́ ìpẹja yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn tí wọ́n jọ ń ṣe iṣẹ́ tàbí òwò, kì í ṣe ọ̀rẹ́ lásán.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá, kúkúrú, tí ó sì ní ìtùnú fún àṣẹ pẹ̀lú μή.
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsìnyí lọ
  rationale: Ó fi ìyípadà tó bẹ̀rẹ̀ ní àkókò yẹn tí yóò sì máa bá a lọ hàn kedere.
- source_word: ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: Níhìn-ín ἄνθρωπος ń tọ́ka sí gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἔσῃ ζωγρῶν
  choice: ìwọ yóò máa mú àwọn ènìyàn láàyè
  rationale: Ìtumọ̀ yìí pa àwòrán mímú ẹja àti èrò ζωγρέω pé a mú ẹni náà ní ààyè mọ́; ‘yóò máa’ tún fi ìṣe tí yóò máa bá a lọ hàn.
theological_decisions:
- issue: Àwòrán ζωγρέω nínú ìpè Jésù sí Símoni
  choice: ìwọ yóò máa mú àwọn ènìyàn láàyè
  alternative: ìwọ yóò máa mú àwọn ènìyàn; ìwọ yóò di apẹja ènìyàn
  rationale: Lúùkù lo ọ̀rọ̀ tó túmọ̀ sí mímú ẹni ní ààyè, ó sì yàtọ̀ sí gbólóhùn ‘apẹja ènìyàn’ ní Mátíù 4:19 àti Máàkù 1:17. A kò mú àwọn ẹsẹ náà bá ara wọn mu nípa fífi ọ̀rọ̀ wọn rọ́pò ọ̀rọ̀ Lúùkù.
- issue: Bó ṣe yẹ kí a túmọ̀ ἀνθρώπους nípa akọ tàbí abo
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Àwọn ènìyàn lápapọ̀ ni ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká yìí, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Bẹ́ẹ̀ náà ni ó sì rí fún’ jẹ́ kí ìbẹ̀rẹ̀ ẹsẹ náà so mọ́ ẹsẹ 9 bí Gíríìkì ṣe ṣe, ‘alábàáṣiṣẹ́pọ̀’ sì bá àyíká iṣẹ́ ìpẹja mu.
