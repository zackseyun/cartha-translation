id: LUK.5.12
reference: Luke 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé nígbà tí ó wà ní ọ̀kan nínú àwọn ìlú, kíyè sí i, ọkùnrin kan wà níbẹ̀ tí àrùn ẹ̀tẹ̀ ti kún ara rẹ̀.[a] Nígbà tí ó rí Jésù, ó dojúbolẹ̀, ó sì bẹ̀ ẹ́ pé, “Olúwa, bí o bá fẹ́, o lè sọ mí di mímọ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “tí àrùn ẹ̀tẹ̀ bo gbogbo ara rẹ̀.” Gíríìkì sọ pé ó “kún fún àrùn ẹ̀tẹ̀,” èyí tó tẹnu mọ́ bí ipò rẹ̀ ṣe le tó. Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí onírúurú àrùn awọ ara, kì í ṣe àrùn Hansen nìkan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “o lè wẹ̀ mí mọ́.” Ọ̀rọ̀ náà lè ní ìtumọ̀ ìwẹ̀mọ́ kúrò nínú àìsàn, ó sì tún lè ní í ṣe pẹ̀lú ìmúpadàbọ̀sípò ní ti ẹ̀sìn àti àwùjọ, kì í ṣe ìwòsàn ara nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó mú ọ̀nà ìṣíṣẹ̀ ìtàn Lúùkù jáde ní Yorùbá òde òní láì lo gbólóhùn àtijọ́ tí kò rọrùn.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: nígbà tí ó wà
  rationale: Ó tú ìkọ̀lé infinitive tó ní article sí gbólóhùn àkókò tí ó ṣe déédéé ní Yorùbá.
- source_word: μιᾷ τῶν πόλεων
  choice: ọ̀kan lára àwọn ìlú náà
  rationale: “Ìlú” lè tọ́ka sí town tàbí city, kò sì fi dandan sọ pé ibẹ̀ jẹ́ ìlú ńlá.
- source_word: ἰδοὺ
  choice: sì wò ó
  rationale: Ó pa àmì ìfiyèsí àti ìfarahàn òjijì inú ìtàn náà mọ́ ní ọ̀nà tí Yorùbá lè lóye.
- source_word: πλήρης λέπρας
  choice: tí àrùn ẹ̀tẹ̀ ti kún ara rẹ̀
  rationale: Ó pa àwòrán “kún” (πλήρης) mọ́, ó sì fi bí ipò ọkùnrin náà ṣe le tó hàn láì sọ ohun tí Gíríìkì kò sọ.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ó dojúbolẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìdúbalẹ̀ sílẹ̀ pẹ̀lú ojú sílẹ̀ àti ìrẹ̀lẹ̀ olùbẹ̀bẹ̀ náà hàn lọ́nà àdánidá.
- source_word: ἐδεήθη αὐτοῦ
  choice: ó sì bẹ̀ ẹ́
  rationale: Ó fi ẹ̀bẹ̀ líle àti ìníjàánu ọkùnrin náà hàn ní èdè Yorùbá tí ó wọ́pọ̀.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ àkọ́kọ́ fún κύριος, ó sì pa ọ̀wọ̀ àti ìtumọ̀ nípa ẹni tí Jésù jẹ́ sílẹ̀ láì fi ohun míì kún un.
- source_word: ἐὰν θέλῃς
  choice: bí o bá fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ìmúrasílẹ̀ Jésù ní kedere, kò sì tú ọ̀rọ̀ náà sí ìbéèrè nípa agbára rẹ̀.
- source_word: δύνασαί με καθαρίσαι
  choice: o lè wẹ̀ mí mọ́
  rationale: “Lè” pa èrò agbára mọ́; “wẹ̀ mí mọ́” sì gba ìwòsàn ara àti ìsọdimímọ́ ní ojú ẹ̀sìn àti àwùjọ pọ̀.
theological_decisions:
- issue: Ìtumọ̀ λέπρα àti καθαρίζω nínú ìṣẹ̀lẹ̀ ìwòsàn
  choice: Lo “àrùn ẹ̀tẹ̀” àti “wẹ̀ mí mọ́.”
  alternative: Lo “àrùn awọ ara” àti “wò mí sàn.”
  rationale: λέπρα ní ayé àtijọ́ lè gbòòrò ju àrùn Hansen ti òde òní lọ, ṣùgbọ́n “àrùn ẹ̀tẹ̀” jẹ́ ọ̀rọ̀ tí a mọ̀. “Wẹ̀ mí mọ́” pa ìwòsàn ara àti ìmúpadàbọ̀sípò ní ti ẹ̀sìn àti àwùjọ mọ́.
- issue: Ìtumọ̀ κύριος nígbà tí ọkùnrin náà ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá; Alàgbà
  rationale: “Olúwa” pa ọ̀wọ̀ inú ọ̀rọ̀ náà àti ìṣeéṣe ìtumọ̀ nípa ẹni tí Jésù jẹ́ mọ́, láì pinnu ju ohun tí àyíká ẹsẹ̀ náà fúnra rẹ̀ fi hàn lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ìtàn mímọ́, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. “Sì wò ó” jẹ́ ọ̀rọ̀ ìfiyèsí tí ó mọ̀ọ́mọ̀ ní díẹ̀ láti pa ἰδοὺ mọ́; “dojúbolẹ̀” sì jẹ́ àdánidá ju títú gbogbo ọ̀rọ̀ Gíríìkì ní ọ̀kọ̀ọ̀kan lọ.
