    rationale: Ó ṣeé lóye, ṣùgbọ́n ó lè kàn sí ìwẹ̀ pẹ̀lú omi. “Sọ mí di mímọ́” jẹ́ ìtumọ̀ gbooro tó dáa jù, tí ó sì pa ìmọ̀lára ìmímọ́ ti Gíríìkì mọ́.
