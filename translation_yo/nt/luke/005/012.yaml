  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ gbogbogbò Gíríìkì dáadáa: ọkùnrin náà ní ẹ̀tẹ̀ tó burú, ó dojúbolẹ̀, ó sì bẹ Jésù. Síbẹ̀, “sì wò ó” kì í ṣiṣẹ́ gẹ́gẹ́ bí ìtumọ̀ àdánidá fún ἰδοὺ nínú àyíká yìí; ó lè dà bí àṣẹ pé kí a wo ohun kan. “Kíyè sí i” ń pa ìfiyèsí àti ìfarahàn òjijì náà mọ́ dáadáa. “Sọ mí di mímọ́” sì sun mọ́ καθαρίσαι ju “wẹ̀ mí mọ́” lọ, níwọ̀n bí ó ti pa èrò ìmímọ́/ìwẹ̀mọ́ mọ́ láì dín un kù sí ìwẹ̀ ara lasan.'
  naturalness: Àwọn gbolohun míì jẹ́ Yorùbá boṣewa tó rọrùn láti ka. A tún “sì wò ó” ṣe sí “kíyè sí i” fún ọ̀rọ̀ ìtàn tí ó dára. “Nígbà tí” ní ìbẹ̀rẹ̀ gbolohun kejì jẹ́ kedere, bí ó tilẹ̀ jẹ́ pé ìfarahàn rẹ̀ wúlò ní Yorùbá.
  terminology: “Olúwa” yẹ fún Κύριε, ó sì yẹ kí a máa lò “àrùn ẹ̀tẹ̀” nínú ọ̀rọ̀ àkọ́kọ́ pẹ̀lú àlàyé ìsàlẹ̀ pé λέπρα àtijọ́ kò dájú pé àrùn Hansen nìkan ni. “Sọ mí di mímọ́” pa ìtumọ̀ καθαρίζω mọ́, pẹ̀lú àwọ̀n ìtumọ̀ ti ara, ti ẹ̀sìn, àti ti àwùjọ. Àmì [b] yẹ kí ó wà lẹ́yìn ọ̀rọ̀ ìmímọ́ tí ìsàlẹ̀ rẹ̀ ń ṣàlàyé, kì í ṣe lẹ́yìn gbogbo ọ̀rọ̀ àfọwọ́sọ̀rọ̀ láì fi ìdí rẹ̀ hàn.
