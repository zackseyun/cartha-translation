source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: yo
  text: Wọ́n sì ṣe àmì sí àwọn alábàáṣiṣẹ́ wọn nínú ọkọ̀ ojú omi kejì pé kí wọ́n wá ràn wọ́n lọ́wọ́.[a] Wọ́n sì wá, wọ́n sì kún ọkọ̀ ojú omi méjèèjì débi pé àwọn ọkọ̀ náà bẹ̀rẹ̀ sí í rì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fẹ́wọ́ sí àwọn alábàáṣiṣẹ́ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: wọ́n juwọ́ sí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe àmì tàbí ìjuwọ́ sí ẹni tí ó jìnnà; ‘juwọ́ sí’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún àmì tí a fi ọwọ́ tàbí ara ṣe.
- source_word: μετόχοις
  choice: àwọn alábàáṣiṣẹ́ wọn
  rationale: Nínú àyíká iṣẹ́ ìpẹja yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tí wọ́n jọ ń ṣiṣẹ́ tàbí tí wọ́n jẹ́ alábàáṣiṣẹ́, kì í ṣe àwọn ẹlẹgbẹ́ lásán.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: tí ó wà nínú ọkọ̀ ojú omi kejì
  rationale: ‘Ọkọ̀ ojú omi kejì’ fi ìyàtọ̀ ọkọ̀ kejì nínú ìṣẹ̀lẹ̀ náà hàn ní ọ̀nà tí ó ṣe kedere.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: pé kí wọ́n wá ràn wọ́n lọ́wọ́
  rationale: 'Gbólóhùn Gíríìkì náà sọ ète àmì náà: kí àwọn alábàáṣiṣẹ́ náà wá darapọ̀ mọ́ wọn láti ṣèrànwọ́. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá.'
- source_word: ἔπλησαν
  choice: wọ́n fi ẹja kún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘kún’; fífi ‘ẹja’ hàn gbangba mú ohun tí wọ́n fi kún ọkọ̀ yé kedere láti inú àyíká, láìyí ìtumọ̀ padà.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: ọkọ̀ ojú omi méjèèjì
  rationale: ‘Méjèèjì’ pa ìtumọ̀ ἀμφότερα mọ́ ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: débi pé àwọn ọkọ̀ náà bẹ̀rẹ̀ sí í rì
  rationale: Infinitive ìsinsìnyí náà ṣàpèjúwe ìrì tí ń lọ lọ́wọ́ gẹ́gẹ́ bí àbájáde; ‘bẹ̀rẹ̀ sí í rì’ kò sọ pé wọ́n ti rì pátápátá.
theological_decisions: []
translation_notes:
  register: Yorùbá ọ̀wọ̀, ti òde òní, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ọkọ̀ ojú omi’ láti yà á sọ́tọ̀ kedere, a sì pa ìtẹ̀síwájú ìrì ọkọ̀ náà mọ́ láìsọ pé wọ́n rì tán.
