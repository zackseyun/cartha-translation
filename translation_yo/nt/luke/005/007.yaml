revisions:
- from: Nítorí náà, wọ́n juwọ́ sí àwọn alábàáṣiṣẹ́ wọn tí ó wà nínú ọkọ̀ ojú omi kejì pé kí wọ́n wá ràn wọ́n lọ́wọ́.[a] Wọ́n sì wá, wọ́n sì fi ẹja kún ọkọ̀ ojú omi méjèèjì débi pé àwọn ọkọ̀ náà bẹ̀rẹ̀ sí í rì.
  to: Wọ́n sì ṣe àmì sí àwọn alábàáṣiṣẹ́ wọn nínú ọkọ̀ ojú omi kejì pé kí wọ́n wá ràn wọ́n lọ́wọ́.[a] Wọ́n sì wá, wọ́n sì kún ọkọ̀ ojú omi méjèèjì débi pé àwọn ọkọ̀ náà bẹ̀rẹ̀ sí í rì.
  rationale: Àtúnṣe náà rọ́pò asopò ìpèníjà tí kò wà nínú Gíríìkì pẹ̀lú ìtẹ̀lé ìtàn “wọ́n sì,” ó sì rọ́pò ọ̀rọ̀ tí kò dájú “juwọ́ sí” pẹ̀lú “ṣe àmì sí.” Àwọn ìyókù ni a pa mọ́, pẹ̀lú “ẹja” tí a yọ kúrò nínú gbolóhùn kí ìtumọ̀ má ṣe sọ ohun tí ẹsẹ̀ yìí kò pè ní orúkọ, bí ó tilẹ̀ jẹ́ pé àyíká ti sọ ọ́ di mímọ̀.
