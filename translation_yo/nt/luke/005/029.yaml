  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: yo
  text: Léfì sì ṣe àsè ńlá kan fún un ní ilé rẹ̀. Ogunlọ́gọ̀ àwọn agbowó orí àti àwọn ẹlòmíràn sì wà níbẹ̀; wọ́n dùbúlẹ̀ láti jẹun[b] pẹ̀lú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú rẹ̀.” Gíríìkì ní “pẹ̀lú wọn,” ṣùgbọ́n ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí lè yé òǹkàwé ní ọ̀nà tó yàtọ̀.
    reason: alternative_reading
  - marker: b
    text: Ní àsè àkànṣe ní agbègbè Mẹditaréníà ìgbàanì, àṣà ni fún àwọn olùjẹun láti dùbúlẹ̀ níbi oúnjẹ.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: àsè ńlá kan
  rationale: “Àsè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún oúnjẹ àjọyọ̀ tàbí àsè tí ẹni kan gbàlejò; “ńlá” sì mú ìtẹnumọ́ μεγάλην jáde.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó tọ́ka sí Jésù nínú àyíká ẹsẹ náà, ṣùgbọ́n a pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi orúkọ kún un.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: ní ilé rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì jẹ́ èdè Yorùbá àdánidá fún ibi tí Léfì ti ṣe àsè náà.
- source_word: ὄχλος πολὺς
  choice: ogunlọ́gọ̀
  rationale: “Ogunlọ́gọ̀” sọ ìjọ ènìyàn púpọ̀ ní ṣókí, ó sì bá ìtumọ̀ ὄχλος πολὺς mu.
- source_word: τελωνῶν
  choice: àwọn agbowó orí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ fún àwọn tó ń gba owó orí ní àyíká Ìhìn Rere.
- source_word: ἄλλων
  choice: àwọn ẹlòmíràn
  rationale: Ó pa àìsọ pàtó Gíríìkì mọ́, láì fi irú àwọn ènìyàn náà kún ọ̀rọ̀.
- source_word: μετ’ αὐτῶν
  choice: pẹ̀lú wọn
  rationale: A pa arọ́pò-orúkọ ọ̀pọ̀ Gíríìkì mọ́. Nítorí ẹni tí “wọn” ń tọ́ka sí lè dà bí ẹni tí kò ṣe kedere, àlàyé ìsàlẹ̀ wà fún un.
- source_word: κατακείμενοι
  choice: wọ́n rọ̀gbọ̀kú láti jẹun
  rationale: Ọ̀rọ̀ yìí mú ìdúró ara àwọn olùjẹun ní àsè ìgbàanì jáde, dípò yíyí i padà sí “wọ́n jókòó” lásán.
