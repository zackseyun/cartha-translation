source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: yo
  text: Ó sì na ọwọ́ rẹ̀, ó sì fi ọwọ́ kàn án, ó ní, “Mo fẹ́; di mímọ́.” Lójú ẹsẹ̀, àrùn ẹ̀tẹ̀ náà sì kúrò lára rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: na ọwọ́ rẹ̀
  rationale: Ó fi ìṣe nínà ọwọ́ hàn ní ọ̀nà Yorùbá tó ṣe déédé, tó sì pa ìtẹ̀síwájú ìṣe inú Gíríìkì mọ́.
- source_word: ἥψατο αὐτοῦ
  choice: ó fọwọ́ kàn án
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ó fi ọwọ́ kan ẹni náà; ó tún pa pàtàkì ìfọwọ́kàn ẹni tí a kà sí aláìmọ́ mọ́.
- source_word: Θέλω
  choice: Mo fẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ ìfẹ́-inú àti ìmúratán Jésù, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú.
- source_word: καθαρίσθητι
  choice: di mímọ́
  rationale: Ó pa èrò ìwẹ̀mọ́ mọ́, èyí tó ju ìwòsàn ara nìkan lọ, ó sì jẹ́ àṣẹ tó ṣe déédé ní Yorùbá.
- source_word: εὐθέως
  choice: Lójú ẹsẹ̀
  rationale: Gbólóhùn Yorùbá tó ṣe déédé fún ohun tó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: ἡ λέπρα
  choice: àrùn ẹ̀tẹ̀
  rationale: Èyí ni ìtumọ̀ ìbílẹ̀ tó rọrùn fún òǹkàwé láti mọ̀, nígbà tí àlàyé ìsàlẹ̀ fi ìtúmọ̀ ọ̀rọ̀ Gíríìkì tó lè gbòòrò sí i hàn.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: kúrò lára rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ pé àrùn náà fi ẹni náà sílẹ̀, ó sì pa àwòrán ìkúrò inú orísun mọ́.
theological_decisions:
- issue: Ìtumọ̀ καθαρίσθητι nínú ìwòsàn ẹni tó ní ẹ̀tẹ̀
  choice: di mímọ́
  alternative: rí ìwòsàn
  rationale: Orísun Gíríìkì tẹnu mọ́ ìwẹ̀mọ́, èyí tó ní ìwòsàn ara àti ìpadà sí ipò ìmímọ́ láwùjọ àti nípa àṣà ẹ̀sìn nínú rẹ̀. “Di mímọ́” kò dín ìtumọ̀ náà kù sí ìwòsàn ara nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. A gbé àmì àlàyé [a] sí “ẹ̀tẹ̀,” ibi tí àlàyé náà tọ́ka sí ní tòótọ́.
