source:
  edition: SBLGNT
  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: yo
  text: Nígbà tí wọ́n ṣe bẹ́ẹ̀, wọ́n kó[a] ọ̀pọ̀ ẹja gan-an sínú àwọ̀n wọn, àwọ̀n wọn sì ń ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n mú ọ̀pọ̀ ẹja gan-an.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí híhá tàbí yíyí ẹja ká sínú àwọ̀n, ó sì tẹnu mọ́ àwòrán àwọn ẹja tí àwọ̀n yí ká.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọ̀n wọn sì bẹ̀rẹ̀ sí í ya.” Ọ̀rọ̀-ìṣe Gíríìkì náà ṣàfihàn yíya tí ń lọ lọ́wọ́, kì í ṣe dandan pé àwọ̀n náà ti ya tán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: nígbà tí wọ́n ṣe
  rationale: Aorist participle náà tọ́ka sí ohun tí wọ́n ṣe ṣáájú ìṣẹ̀lẹ̀ pàtàkì; gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé iṣẹ́ mọ́.
- source_word: συνέκλεισαν
  choice: wọ́n ká ... mọ́ inú àwọ̀n
  rationale: Èyí pa àwòrán ìtumọ̀ Gíríìkì náà mọ́ pé wọ́n yí àwọn ẹja náà ká, wọ́n sì há wọn sínú àwọ̀n, dípò lílo ọ̀rọ̀ gbogbogbò ‘mú’ nìkan.
- source_word: πλῆθος ἰχθύων πολύ
  choice: ẹja púpọ̀ lọ́pọ̀lọpọ̀
  rationale: Àtúnṣe ìtẹnumọ́ yìí fi hàn pé iye ẹja náà pọ̀ gidigidi, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: διερρήσσετο
  choice: ń ya
  rationale: Àkókò imperfect náà ṣàfihàn yíya tí ń lọ lọ́wọ́, kì í ṣe pé àwọ̀n náà ti ya tán pátápátá.
- source_word: τὰ δίκτυα αὐτῶν
  choice: àwọ̀n wọn
  rationale: A pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, a sì lo ìṣàpẹẹrẹ ohun-ìní Yorùbá tí ó bá àṣà èdè mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. ‘Ká ... mọ́ inú àwọ̀n’ pa àwòrán orísun mọ́ láì mú kí gbólóhùn náà le láti lóye; ‘ń ya’ sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
