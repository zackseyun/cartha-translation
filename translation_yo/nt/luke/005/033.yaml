id: LUK.5.33
reference: Luke 5:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: yo
  text: Wọ́n sì wí fún un pé, “Àwọn ọmọ-ẹ̀yìn Jòhánù máa ń gbààwẹ̀ léraléra, wọ́n sì máa ń gbàdúrà; bẹ́ẹ̀ náà ni àwọn ti àwọn Farisí[a], ṣùgbọ́n àwọn tìrẹ[b] ń jẹ, wọ́n sì ń mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ-ẹ̀yìn àwọn Farisí.” Ní Gíríìkì, ó jẹ́ “àwọn ti àwọn Farisí” ní tààràtà; a lóye “ọmọ-ẹ̀yìn” láti inú gbólóhùn tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọmọ-ẹ̀yìn rẹ.” Gíríìkì sọ ní ṣókí pé “àwọn tìrẹ”; a lóye “ọmọ-ẹ̀yìn” láti inú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Wọ́n sì wí fún un pé
  rationale: “Sì” fi δέ hàn gẹ́gẹ́ bí àsopọ̀ ìtàn tí kò fi ìtakora líle hàn; gbólóhùn náà sì jẹ́ Yorùbá àdánidá.
- source_word: μαθηταὶ Ἰωάννου
  choice: Àwọn ọmọ-ẹ̀yìn Jòhánù
  rationale: Èyí túmọ̀ ìbátan tí genitive náà ń fi hàn ní ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: νηστεύουσιν πυκνά
  choice: máa ń gbààwẹ̀ léraléra
  rationale: “Máa ń” fi ìṣe àṣà hàn, “léraléra” sì sọ pé ìṣe náà ń ṣẹlẹ̀ ní ọ̀pọ̀ ìgbà, bí πυκνά ṣe túmọ̀ sí níbí.
- source_word: δεήσεις ποιοῦνται
  choice: wọ́n sì máa ń gbàdúrà
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ṣíṣe àdúrà tàbí ẹ̀bẹ̀ sí Ọlọ́run; ó yàgò fún gbólóhùn aláìṣedéédé bí “ṣe àwọn àdúrà.”
- source_word: ὁμοίως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Gbólóhùn yìí fi ìfarajọ àti àfikún tí ὁμοίως καὶ ní hàn ní Yorùbá tó rọrùn.
- source_word: οἱ τῶν Φαρισαίων
  choice: àwọn ti àwọn Farisí
  rationale: A kò fi “ọmọ-ẹ̀yìn” kún ọ̀rọ̀ pàtàkì, nítorí Gíríìkì fi orúkọ náà sílẹ̀ kí a lóye rẹ̀ láti inú gbólóhùn tó ṣáájú.
- source_word: οἱ δὲ σοὶ
  choice: ṣùgbọ́n àwọn tìrẹ
  rationale: “Àwọn tìrẹ” pa àkékúrú Gíríìkì mọ́, ó sì jẹ́ kí ìyàtọ̀ náà ṣe kedere; “ọmọ-ẹ̀yìn” ni a lóye láti inú àyíká ọ̀rọ̀.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: ń jẹ, wọ́n sì ń mu
  rationale: Àmì ìṣe “ń” fi ìṣe tí wọ́n ń ṣe gẹ́gẹ́ bí àṣà hàn, ní ìyàtọ̀ sí gbígbààwẹ̀.
theological_decisions:
- issue: Bóyá kí a fi “ọmọ-ẹ̀yìn” kún àwọn gbólóhùn kejì àti kẹta
  choice: Pa àkékúrú Gíríìkì mọ́ pẹ̀lú “àwọn ti àwọn Farisí” àti “àwọn tìrẹ.”
  alternative: “Àwọn ọmọ-ẹ̀yìn àwọn Farisí” àti “àwọn ọmọ-ẹ̀yìn rẹ.”
  rationale: Kì í ṣe ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ tí àríyànjiyàn wà lórí, ṣùgbọ́n pípa àkékúrú náà mọ́ jẹ́ kí ìtumọ̀ fara mọ́ ìṣètò Gíríìkì láìsọ ìtumọ̀ rẹ̀ di òkùnkùn.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì lo “máa ń” fún ìṣe àṣà. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
