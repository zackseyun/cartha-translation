  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: yo
  text: Èmi kò wá láti pe àwọn olódodo, bí kò ṣe àwọn ẹlẹ́ṣẹ̀ sí ìrònúpìwàdà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìrònúpìwàdà.” Gbólóhùn Gíríìkì εἰς μετάνοιαν ń sọ ète tàbí ibi tí ìpè náà ń darí sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Èmi kò wá
  rationale: Ọ̀rọ̀-ìṣe pípé náà fi dídé tí ó ní ète àti ipò rẹ̀ nísinsìnyí hàn; “Èmi kò wá” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi iṣẹ́ tí Jesu wá ṣe hàn.
- source_word: καλέσαι
  choice: láti pe
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́ni náà sọ ète dídé rẹ̀; “pe” lè túmọ̀ sí pípe tàbí fífi ìpè síni láìfi dandan mú un jẹ́ àṣẹ tàbí ìkésíni nìkan.
- source_word: δικαίους
  choice: àwọn olódodo
  rationale: Àjẹtífù náà dúró gẹ́gẹ́ bí orúkọ fún àwọn tí ó jẹ́ olódodo; a kò fi àlàyé kún un pé wọ́n jẹ́ olódodo ní tòótọ́ tàbí pé àwọn ènìyàn kàn kà wọ́n sí bẹ́ẹ̀.
- source_word: ἁμαρτωλοὺς
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ àwọn ẹni tí ẹ̀ṣẹ̀ ń ṣàpèjúwe mu.
- source_word: εἰς μετάνοιαν
  choice: sí ìrònúpìwàdà
  rationale: εἰς pẹ̀lú μετάνοιαν ń tọ́ka sí ète tàbí ibi tí ìpè náà ń darí sí. “Ìrònúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún yíyí ọkàn àti ìhùwàsí padà kúrò nínú ẹ̀ṣẹ̀.
theological_decisions:
- issue: Bóyá Jesu ń sọ pé kò sí olódodo tòótọ́ rárá, tàbí ó ń sọ̀rọ̀ nípa bí a ṣe ń wo àwọn ènìyàn láwùjọ
  choice: A pa ìyàtọ̀ tó wà láàárín “àwọn olódodo” àti “àwọn ẹlẹ́ṣẹ̀” mọ́ láìfi àlàyé onítumọ̀ kún un.
  alternative: “àwọn tí wọ́n rò pé àwọn jẹ́ olódodo” tàbí “àwọn tí a kà sí olódodo”
  rationale: Ẹsẹ náà kò sọ ní tààrà pé ọ̀rọ̀ náà jẹ́ àwàdà-ìtumọ̀ tàbí pé olódodo jẹ́ ẹni tí ó rò ara rẹ̀ bẹ́ẹ̀. Fífi èyí kún un yóò yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ títóbi tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Èmi” láti gba ìtẹnumọ́ tí ó bá ọ̀rọ̀ Jesu mu, a sì pa nọ́ńbà púpọ̀ àti ìdàkejì gbólóhùn Gíríìkì mọ́.
