  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: yo
  text: Nígbà tí ó rí ìgbàgbọ́ wọn[a], ó wí pé, “Ọkùnrin, a ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé”; ní Gíríìkì, “ìgbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀-ìṣe náà lè tẹnu mọ́ ipò ìdáríjì tó wà nísinsìnyí nítorí ìṣe kan tí a ti parí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí ó rí
  rationale: Ó fi ìṣe participle náà hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ ní àsìkò tí ó sọ̀rọ̀, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láì fi ìtẹ̀lé àkókò míì kún un.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún πίστις ní ọ̀rọ̀ yìí; ó lè ní ìtumọ̀ ìgbẹ́kẹ̀lé, èyí tí àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí.
- source_word: αὐτῶν
  choice: wọn
  rationale: A pa arọ́pò-orúkọ ọ̀pọ̀ mọ́, láì pinnu bóyá ó ń tọ́ka sí aláàrùn náà pẹ̀lú àwọn tó gbé e wá tàbí àwọn tó gbé e wá nìkan.
- source_word: Ἄνθρωπε
  choice: Ọkùnrin
  rationale: Ó pa ìtọ́kasí sí ọkùnrin mọ́, kò sì fi ìfẹ́ni tàbí ipò ọ̀wọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἀφέωνταί
  choice: a ti dárí ... jì
  rationale: Ìṣètò 'a ti' fi perfect passive hàn ní Yorùbá gẹ́gẹ́ bí ìṣe tí a ti ṣe, tí àbájáde rẹ̀ sì dúró títí di ìsinsìnyí.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe tààrà tó sì pa ìtumọ̀ ìwà àti ẹ̀kọ́ ìsìn mọ́.
- source_word: σοι ... σου
  choice: rẹ ... ọ́
  rationale: A ṣàfihàn genitive náà pẹ̀lú 'rẹ' àti dative náà pẹ̀lú 'ọ́', gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ pé a dárí àwọn ẹ̀ṣẹ̀ ẹni náà jì í.
theological_decisions:
- issue: Ààlà ìtumọ̀ “ìgbàgbọ́ wọn”
  choice: A pa arọ́pò-orúkọ ọ̀pọ̀ “wọn” mọ́ láì sọ ẹni pàtó tí gbogbo rẹ̀ kàn.
  alternative: Ó lè tọ́ka sí àwọn ọkùnrin tó gbé aláàrùn náà wá nìkan, tàbí sí aláàrùn náà àti àwọn ẹlẹgbẹ́ rẹ̀ papọ̀.
  rationale: αὐτῶν jẹ́ ọ̀pọ̀, ṣùgbọ́n àyíká kò yanjú gbogbo ẹni tí ó wà nínú rẹ̀; ìtumọ̀ náà kò gbọ́dọ̀ yọ ìṣòro yìí kúrò.
- issue: Agbára àti àkókò ọ̀rọ̀ ìdáríjì
  choice: “a ti dárí ... jì” ń kéde ipò ìdáríjì tó wà nísinsìnyí gẹ́gẹ́ bí àbájáde ìṣe tó ti ṣẹlẹ̀.
  alternative: “a dárí ... jì” lè dà bí ìdáríjì tó ṣẹlẹ̀ ní àkókò ọ̀rọ̀ náà gan-an.
  rationale: Perfect passive Gíríìkì sọ òtítọ́ ìdáríjì àti ipò tó yọ lára rẹ̀, ṣùgbọ́n kò pinnu ní kíkún bóyá ọ̀rọ̀ náà ń mú un ṣẹ tàbí ń kéde ohun tó ti ṣẹlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé navnav; a lo “Ọkùnrin” dípò “Ọ̀rẹ́” kí a má bàa fi ìfẹ́ni tí kò hàn gbangba nínú orísun kún un.
