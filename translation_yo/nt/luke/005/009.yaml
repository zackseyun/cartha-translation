  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: yo
  text: Nítorí ìyàlẹ́nu gbà á mú, àti gbogbo àwọn tí wọ́n wà pẹ̀lú rẹ̀, nítorí ìmú ẹja tí wọ́n mú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: ìyàlẹ́nu
  rationale: Ó túmọ̀ sí ìyàlẹ́nu ńlá tí ó dé bá ènìyàn lójijì; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá tí ó bá ìṣẹ̀lẹ̀ ìmú ẹja lọ́pọ̀lọpọ̀ mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìhùwà Símónì nínú ẹsẹ tó ṣáájú, ó sì fi ìdí ìhùwà náà hàn.
- source_word: περιέσχεν
  choice: ti bo ... mọ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ìpìlẹ̀ pé ohun kan yí ẹni ká tàbí gbá a mú; àpólà Yorùbá yìí fi agbára ìyàlẹ́nu tó borí wọn hàn.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: gbogbo àwọn tí ó wà pẹlu rẹ̀
  rationale: Ó pa ìtẹnumọ́ gbogbo àwọn alábàáṣiṣẹ́ Símónì tí wọ́n wà níbẹ̀ mọ́.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: nítorí ọ̀pọ̀ ẹja tí wọ́n mú
  rationale: ἐπί níbí ń tọ́ka sí ohun tó fa ìyàlẹ́nu; ἄγρα jẹ́ ohun tí a mú nínú ọdẹ tàbí ìpẹja, àti pé ‘ọ̀pọ̀ ẹja tí wọ́n mú’ jẹ́ àdánidá ní Yorùbá.
- source_word: ὧν συνέλαβον
  choice: tí wọ́n mú
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí àwọn ẹja, ìṣe olópò sì fi hàn pé ẹgbẹ́ náà ló kópa; ‘tí wọ́n mú’ sọ èyí ní kedere.
