translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, àdánidá, tí ó ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àpólà ‘bo ... mọ́lẹ̀’ láti pa agbára àwòrán Gíríìkì mọ́ láì mú kí gbólóhùn náà ṣòro.
