  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: yo
  text: Ṣùgbọ́n a gbọ́dọ̀ da wáìnì tuntun sínú àwọn àpò awọ tuntun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì lo ajẹtífù méjì ọ̀tọ̀: νέος (“tuntun,” pàápàá ní ti àkókò) fún wáìnì, àti καινός (“tuntun” tàbí “tí ó ṣẹ̀ṣẹ̀ dára,” pàápàá ní ti ipò tàbí ànímọ́) fún àwọn àpò awọ. Yorùbá lo “tuntun” fún méjèèjì nínú ẹsẹ yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ohun tó yẹ kí a ṣe yàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ pé kò yẹ.
- source_word: οἶνον νέον
  choice: wáìnì tuntun
  rationale: νέος tọ́ka sí ohun tuntun ní ti àkókò; níhìn-ín, ó jẹ́ wáìnì tí a ṣẹ̀ṣẹ̀ ṣe.
- source_word: εἰς
  choice: sínú
  rationale: Ó fi ìṣípòpadà sí inú ohun èlò hàn, kì í ṣe wíwà níbẹ̀ lásán.
- source_word: ἀσκοὺς
  choice: àpò awọ
  rationale: ἀσκός jẹ́ àpò tí a fi awọ ẹranko ṣe láti fi omi mímu bí wáìnì pamọ́; ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: καινοὺς
  choice: tuntun
  rationale: καινός tẹnumọ́ tuntun ní ti ipò tàbí ànímọ́. Yorùbá kò ní ọ̀rọ̀ àdánidá tó máa fi ìyàtọ̀ kékeré láàárín νέος àti καινός hàn láìdá ìtumọ̀ míì sí i; nítorí náà, àlàyé ẹsẹ ìsàlẹ̀ ni ó pa ìyàtọ̀ náà mọ́.
- source_word: βλητέον
  choice: a gbọ́dọ̀ da
  rationale: Ọ̀rọ̀-ìṣe ajẹtífù náà sọ ohun tó pọndandan tàbí ohun tó yẹ kí a ṣe. “A gbọ́dọ̀ da” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, “da” sì bá fífi omi sínú àpò mu.
theological_decisions:
- issue: Ìyàtọ̀ láàárín νέος àti καινός nínú gbólóhùn kan náà
  choice: Lo “tuntun” fún méjèèjì, kí ẹsẹ ìsàlẹ̀ ṣàlàyé ìyàtọ̀ wọn
  alternative: Lo “tuntun” fún νέος àti “tí ó ṣì dára/tí kò tíì gbó” fún καινός
  rationale: 'Gíríìkì lo ajẹtífù méjì ọ̀tọ̀: νέος fún tuntun ní ti àkókò, καινός sì sábà tẹnumọ́ tuntun tàbí dídára ní ti ipò. Ṣíṣe àfikún “tí kò tíì gbó” sínú ọ̀rọ̀ pàtàkì lè túmọ̀ àwòrán náà ju ohun tí Gíríìkì sọ lọ; ẹsẹ ìsàlẹ̀ pa ìyàtọ̀ gidi náà mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn. “Wáìnì” ni a lò gẹ́gẹ́ bí ọ̀rọ̀ tí a ti yá tí ó wọ́pọ̀, “àpò awọ” sì ṣàlàyé ohun èlò àṣà náà ní ṣókí.
