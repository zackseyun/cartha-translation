id: LUK.5.36
reference: Luke 5:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: yo
  text: Ó tún ń pa òwe kan fún wọn pé, “Kò sí ẹni tí ó ya àlẹ̀mọ́ lára aṣọ tuntun, tí ó sì fi lé aṣọ àtijọ́. Bí bẹ́ẹ̀ kọ́, yóò ya aṣọ tuntun náà, àlẹ̀mọ́ tí ó wá lára aṣọ tuntun náà kì yóò sì bá aṣọ àtijọ́ mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Ó tún ń pa
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ó ń bá ọ̀rọ̀ rẹ̀ lọ, ‘tún’ sì mú καὶ/δὲ jáde ní Yorùbá àdánidá.
- source_word: παραβολὴν
  choice: òwe kan
  rationale: Nínú àyíká yìí παραβολή jẹ́ àpẹẹrẹ ìkọ́ni onífiwé; ‘òwe’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ó sì rọrùn fún òǹkàwé, láìsọ pé òwe àtọwọ́dọwọ́ Yorùbá ni.
- source_word: ἐπίβλημα
  choice: àlẹ̀mọ́
  rationale: ‘Àlẹ̀mọ́’ túmọ̀ sí ẹ̀yà aṣọ tí a fi ń tún ibi tí ó ya ṣe, ó sì bá àyíká aṣọ mu dáadáa.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: lára aṣọ tuntun
  rationale: ἱμάτιον lè jẹ́ aṣọ tàbí aṣọ àwọ̀lékè; ‘aṣọ’ pa ìtumọ̀ gbòòrò náà mọ́, ‘lára’ sì fi ibi tí a ti ya àlẹ̀mọ́ náà hàn.
- source_word: σχίσας ἐπιβάλλει
  choice: ya … tí ó sì fi lé
  rationale: Ìtumọ̀ yìí sọ ìṣe méjèèjì ní ọ̀nà Yorùbá àdánidá, ó sì pa tẹ̀lé-tẹ̀lé participle aorist àti ọ̀rọ̀-ìṣe pàtàkì mọ́.
- source_word: ἐπὶ ἱμάτιον παλαιόν
  choice: lé aṣọ àtijọ́
  rationale: ‘Fi lé’ túmọ̀ sí gbígbé e sí orí aṣọ náà láìfi kún un pé a rán an, nítorí Gíríìkì kò sọ ọ̀nà tí a gbà so ó.
- source_word: εἰ δὲ μήγε
  choice: Bí ó bá ṣe bẹ́ẹ̀
  rationale: Ní àyíká yìí, gbolohun náà ń tọ́ka sí àbájáde bí ẹnì kan bá ṣe ohun tí a ṣẹ̀ṣẹ̀ sọ; èyí jẹ́ Yorùbá àdánidá fún ‘otherwise/or else.’
- source_word: καὶ τὸ καινὸν σχίσει
  choice: yóò ya aṣọ tuntun náà
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ active future; ẹni náà ni ó ba aṣọ tuntun jẹ́ nípa yíya àlẹ̀mọ́ kúrò lára rẹ̀.
- source_word: οὐ συμφωνήσει
  choice: kì yóò … bá … mu
  rationale: ‘Bá … mu’ lè sọ àìbáramu tàbí àìyẹ nípa aṣọ, ó sì pa ìwọ̀n ìtumọ̀ συμφωνέω mọ́ láìdín un kù sí àwọ̀ nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A kò fi ‘rán’ sí i nítorí ọ̀rọ̀ Gíríìkì sọ pé a fi àlẹ̀mọ́ lé aṣọ, kò sì sọ ọ̀nà ìsomọ́ náà ní pàtó.
