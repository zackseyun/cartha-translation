  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: yo
  text: Ó sì fi ohun gbogbo sílẹ̀[a], ó dìde, ó sì ń tọ̀ ọ́ lẹ́yìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Lẹ́yìn tí ó ti fi ohun gbogbo sílẹ̀, ó dìde, ó sì tọ̀ ọ́ lẹ́yìn.’
    reason: Àṣàyàn ìṣètò gbolohun tó ń fi hàn gbangba pé fífi ohun gbogbo sílẹ̀ ṣáájú dídìde àti títọ̀ ọ́ lẹ́yìn.
lexical_decisions:
- source_word: καταλιπὼν
  choice: fi … sílẹ̀
  rationale: Ọ̀rọ̀ àrọ́pò aorist yìí ṣáájú ìṣe pàtàkì, ó sì fi hàn pé Lefi kọ ohun tí ó ní sílẹ̀ nígbà tó dáhùn sí ìpè náà. ‘Fi … sílẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi ìtumọ̀ ‘kọ̀ sílẹ̀ pátápátá’ kún ọ̀rọ̀ náà.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó túmọ̀ sí gbogbo ohun láìsọ àlàyé sí i; ‘ohun gbogbo’ pa ìtẹnumọ́ gbòòrò inú Gíríìkì mọ́.
- source_word: ἀναστὰς
  choice: ó dìde
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé ó dìde láti ṣe ohun tí Jésù pè é sí; ‘ó dìde’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἠκολούθει
  choice: ó ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò imperfect lè fi ìṣe tí ń bá a lọ hàn. ‘Ó ń tọ̀ ọ́ lẹ́yìn’ pa apá yìí mọ́ láìfi dandan túmọ̀ rẹ̀ sí pé ìṣe náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀.
- source_word: αὐτῷ
  choice: ọ́
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Jésù nínú àyíká ọ̀rọ̀; lílo arọ́pò-orúkọ pa ìsopọ̀ ọ̀rọ̀ orísun mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ Yorùbá àdánidá fún ìtẹ̀síwájú ìtàn, ó sì pa ìṣọ̀kan rírọrùn ti καὶ mọ́.
theological_decisions:
- issue: Bí ìkọ̀sílẹ̀ ohun gbogbo tí Lefi ṣe ti gbòòrò tó
  choice: Ẹsẹ náà sọ pé ó fi ‘ohun gbogbo’ sílẹ̀, ṣùgbọ́n kò sọ bóyá èyí túmọ̀ sí pé ó kọ gbogbo ohun-ìní rẹ̀ sílẹ̀ títí láé.
  alternative: Kí a túmọ̀ ọ́ sí pé ó kọ iṣẹ́ rẹ̀ sílẹ̀ fún ìgbà díẹ̀, tàbí pé ó jáwọ́ nínú gbogbo ohun-ìní rẹ̀ títí láé.
  rationale: Ìtumọ̀ náà pa èdè tó kún fún gbogbo nǹkan mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ nípa ohun-ìní tàbí iṣẹ́ kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àtúmọ̀ náà tẹ̀ lé ìṣètò ìtàn Gíríìkì, ó sì lo ‘ń tọ̀ … lẹ́yìn’ láti pa ìṣe imperfect mọ́.
