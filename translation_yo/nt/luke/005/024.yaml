id: LUK.5.24
reference: Luke 5:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: yo
  text: Ṣùgbọ́n kí ẹ lè mọ̀ pé Ọmọ Ènìyàn[a] ní àṣẹ lórí ilẹ̀ ayé láti dárí ẹ̀ṣẹ̀ jì—ó sọ fún ọkùnrin tí ara rẹ̀ rọ náà pé, “Mo sọ fún ọ, dìde, gbé àkéte rẹ[b], kí o sì lọ sí ilé rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹni ènìyàn.” A pa akọ́lé Gíríìkì náà mọ́ gẹ́gẹ́ bí “Ọmọ Ènìyàn” nítorí pé Jésù máa ń fi pe ara rẹ̀, ó sì ní ìbáṣepọ̀ pàtàkì pẹ̀lú Dáníẹ́lì 7.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ibùsùn rẹ.” Ọ̀rọ̀ Gíríìkì κλινίδιον lè túmọ̀ sí ibùsùn kékeré, àkéte, tàbí ohun tí a tẹ́ sílẹ̀ fún sísùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Ṣùgbọ́n kí ẹ lè mọ̀
  rationale: “Ṣùgbọ́n” fi ìyípadà kékeré tí δέ mú wá hàn, “kí ẹ lè mọ̀” sì ṣàfihàn ète ἵνα àti ìmọ̀ tí εἰδῆτε ń tọ́ka sí. “Ẹ” jẹ́ ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí fọ́ọ̀mù Gíríìkì.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa akọ́lé tí Jésù fi ń pe ara rẹ̀ mọ́, pẹ̀lú ìró Ìwé Dáníẹ́lì 7 àti àìdánilójú ìtumọ̀ rẹ̀ tí ó yẹ kí ó wà.
- source_word: ἐξουσίαν ἔχει
  choice: ní àṣẹ
  rationale: ἐξουσία túmọ̀ sí ẹ̀tọ́ tàbí àṣẹ láti ṣe ohun kan, kì í ṣe agbára lásán; èyí bá àríyànjiyàn nípa dídárí ẹ̀ṣẹ̀ jì mu.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ìtumọ̀ ibi tí ó taara ni, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἀφιέναι ἁμαρτίας
  choice: láti dárí ẹ̀ṣẹ̀ jì
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ìdáríjì ẹ̀ṣẹ̀.
- source_word: τῷ παραλελυμένῳ
  choice: fún ọkùnrin arọ náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin tí ara rẹ̀ rọ; “ọkùnrin arọ” jẹ́ ṣókí, ó sì yé àwọn òǹkàwé lónìí.
- source_word: Σοὶ λέγω
  choice: Mo sọ fún ọ
  rationale: A pa ìtẹnumọ́ olùrọ̀ àti ẹni tí a ń bá sọ mọ́ ní ọ̀nà adayeba ní Yorùbá.
- source_word: ἔγειρε
  choice: dìde
  rationale: Àṣẹ kúkúrú, taara, tí ó sì ní iyì ni, gẹ́gẹ́ bí Gíríìkì.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: gbé àkéte rẹ
  rationale: “Gbé” níbí fi gbígbé ohun náà sókè àti mímú un lọ hàn; “àkéte” bá ibùsùn kékeré tàbí ohun tí a tẹ́ sílẹ̀ mu.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: kí o sì lọ sí ilé rẹ
  rationale: Ìtumọ̀ adayeba tí ó pa ìtọ́sọ́nà ìrìn-àjò àti ibi tí yóò lọ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” pa akọ́lé Kristi àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìwà ènìyàn lásán.
- issue: Ìtumọ̀ ἐξουσία nínú ọ̀rọ̀ dídárí ẹ̀ṣẹ̀ jì
  choice: àṣẹ
  alternative: agbára
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ẹ̀tọ́ Jésù láti dárí ẹ̀ṣẹ̀ jì, kì í ṣe agbára iṣẹ́ ìyanu nìkan.
- issue: Ohun tí ἐπὶ τῆς γῆς ń tọ́ka sí
  choice: lórí ilẹ̀ ayé
  alternative: ní ilẹ̀ ayé yìí
  rationale: A fi gbólóhùn náà sílẹ̀ ní ṣókí bí orísun ṣe rí, kí a má bàa pinnu bóyá ó ń ṣe ìyàtọ̀ pẹ̀lú ọ̀run tàbí ó kàn ń tọ́ka sí ibi tí àṣẹ náà ti ń ṣiṣẹ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “ẹ” fún ọ̀pọ̀ ènìyàn nínú gbólóhùn àkọ́kọ́, ṣùgbọ́n “ọ” fún ọkùnrin náà nínú àṣẹ taara.
