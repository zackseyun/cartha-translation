id: LUK.5.4
reference: Luke 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: yo
  text: Nígbà tí ó sì parí ọ̀rọ̀ sísọ, ó sọ fún Símoni pé, “Gbé ọkọ̀ lọ sí ibi tí omi ti jin[a], kí ẹ sì sọ àwọn àwọ̀n yín kalẹ̀ láti mú ẹja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sínú ibú.” Ní Gíríìkì, ó sọ ní tààrà pé “sínú ìjìnlẹ̀,” èyí tó ń tọ́ka sí omi jíjìn níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí … sì
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn pẹ̀lú ìtẹ̀síwájú kékeré nínú ìtàn, láìfi agbára púpọ̀ kún δέ.
- source_word: ἐπαύσατο λαλῶν
  choice: ó parí ọ̀rọ̀ sísọ
  rationale: Ó túmọ̀ sí pé ó dá iṣẹ́ sísọ tó ń lọ lọ́wọ́ dúró tàbí pé ó parí rẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ó sọ fún Símoni pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti ṣáájú ọ̀rọ̀ tí ẹnì kan sọ, ó sì dúró sún mọ́ λέγω.
- source_word: Ἐπανάγαγε
  choice: Gbé ọkọ̀ lọ
  rationale: Nínú àyíká iṣẹ́ apẹja, ọ̀rọ̀ náà ń tọ́ka sí mímú ọkọ̀ kúrò létí omi lọ síwájú. Fífi “ọkọ̀” hàn mú ìtumọ̀ náà ṣe kedere ní Yorùbá.
- source_word: εἰς τὸ βάθος
  choice: sí ibi tí omi ti jin[a]
  rationale: βάθος ń tọ́ka sí omi jíjìn níbí; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá. Àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan “sínú ibú” pamọ́.
- source_word: χαλάσατε
  choice: kí ẹ sì sọ … kalẹ̀
  rationale: Nípa àwọ̀n láti inú ọkọ̀, “sọ … kalẹ̀” fi ìṣe fífi wọn sọ̀ kalẹ̀ sínú omi hàn lọ́nà àdánidá.
- source_word: τὰ δίκτυα ὑμῶν
  choice: àwọn àwọ̀n yín
  rationale: Ó pa ọ̀pọ̀ àwọ̀n àti arọ́pò-orúkọ ẹni púpọ̀ mọ́, gẹ́gẹ́ bí Gíríìkì.
- source_word: εἰς ἄγραν
  choice: láti mú ẹja
  rationale: ἄγρα túmọ̀ sí ohun tí a mú nínú ọdẹ tàbí ìpẹja; ní àyíká yìí, gbólóhùn náà sọ ète fífi àwọ̀n kalẹ̀ hàn ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìyípadà láti àṣẹ ẹyọ kan sí àṣẹ fún ọ̀pọ̀ ènìyàn
  choice: “Gbé ọkọ̀ lọ” lẹ́yìn ọ̀rọ̀ sí Símoni, lẹ́yìn náà “kí ẹ … àwọn àwọ̀n yín”
  alternative: Lílo ẹyọ kan tàbí ọ̀pọ̀ ènìyàn ní gbogbo àṣẹ náà
  rationale: Gíríìkì lo àṣẹ ẹyọ kan fún Símoni nínú Ἐπανάγαγε, ṣùgbọ́n ó lo àṣẹ àti arọ́pò-orúkọ ọ̀pọ̀ ènìyàn nínú χαλάσατε … ὑμῶν. Ìtumọ̀ náà pa ìyípadà yìí mọ́, láìṣàlàyé ẹni tí àwọn yòókù jẹ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A lo àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà jẹ́ kedere fún òǹkàwé lásán, ó sì pa ìyàtọ̀ ẹyọ kan/ọ̀pọ̀ ènìyàn inú Gíríìkì mọ́.
