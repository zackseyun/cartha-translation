  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: yo
  text: Jésù sì dá wọn lóhùn pé, “Àwọn tí ara wọn yá kò nílò oníṣègùn, bí kò ṣe àwọn aláìsàn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ara wọn kò dá.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà ń sọ nípa àwọn tí ipò wọn kò dáa; ó jẹ́ àṣà ọ̀rọ̀ fún àwọn aláìsàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν πρὸς αὐτούς
  choice: Jésù sì dá wọn lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà ìsọ̀rọ̀ ìtàn Gíríìkì tí ó túmọ̀ sí pé Jésù fèsì sí wọn. “Dá wọn lóhùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: kò nílò
  rationale: “Kò nílò” sọ ìtumọ̀ ‘kò ní àìní’ ní Yorùbá àdánidá láìjẹ́ kí gbólóhùn náà wúwo.
- source_word: οἱ ὑγιαίνοντες
  choice: àwọn tí ara wọn le
  rationale: Gbólóhùn yìí ń tọ́ka sí àwọn ènìyàn tí ara wọn dá ṣáṣá. “Ara wọn le” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìlera rere.
- source_word: ἰατροῦ
  choice: oníṣègùn
  rationale: “Oníṣègùn” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún ẹni tí ń tọ́jú àìsàn, ó sì bá àpẹẹrẹ olùtọ́jú aláìsàn inú ọ̀rọ̀ náà mu.
- source_word: οἱ κακῶς ἔχοντες
  choice: àwọn aláìsàn
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ Gíríìkì fún àwọn tí ara wọn kò dá. “Àwọn aláìsàn” mú ìtumọ̀ náà jáde kedere ní Yorùbá òde òní, nígbà tí àlàyé ìtumọ̀ tààrà wà nínú àkọsílẹ̀ ìsàlẹ̀.
