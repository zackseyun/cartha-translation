id: LUK.5.14
reference: Luke 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: yo
  text: Ó sì pàṣẹ fún un pé, “Má sọ fún ẹnikẹ́ni, ṣùgbọ́n lọ fi ara rẹ hàn àlùfáà, kí o sì rú ẹbọ fún ìwẹ̀nùmọ́ rẹ, gẹ́gẹ́ bí Mósè ti pàṣẹ,[b] láti jẹ́ ẹ̀rí fún wọn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “gẹ́gẹ́ bí ẹ̀rí fún wọn”; “wọn” lè tọ́ka sí àwọn àlùfáà tàbí àwọn ẹlòmíràn, àwọn kan sì lóye rẹ̀ gẹ́gẹ́ bí ẹ̀rí lòdì sí wọn.
    reason: alternative_reading
  - marker: b
    text: Wo Léfítíkù 14 fún ẹbọ tí Mósè pàṣẹ fún ìwẹ̀nùmọ́ kúrò nínú àrùn ẹ̀tẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: pàṣẹ
  rationale: Ó fi ìtọ́ni aláṣẹ hàn láìfi agbára míì kún ọ̀rọ̀ Gíríìkì.
- source_word: μηδενὶ εἰπεῖν
  choice: kí ó má sọ fún ẹnikẹ́ni
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó pa ìfòfindè náà mọ́.
- source_word: ἀπελθὼν
  choice: Lọ
  rationale: Nínú àṣẹ yìí, ‘Lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìgbésẹ̀ tó ṣáájú fífi ara hàn.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: fi ara rẹ hàn àlùfáà
  rationale: Ó tẹ̀ lé ìtumọ̀ Gíríìkì ní tààrà, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: προσένεγκε
  choice: mú ọrẹ wá
  rationale: Ní àyíká ìsìn àti ẹbọ, gbolohun yìí sọ ohun tí ẹni náà gbọ́dọ̀ gbé wá fún ìrúbọ láìfi irú ọrẹ náà kún ọ̀rọ̀.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: nítorí ìwẹ̀nùmọ́ rẹ
  rationale: ‘Ìwẹ̀nùmọ́’ bá ọ̀rọ̀ ìmọ́-nípa-àṣà ẹ̀sìn mu, ó sì yàtọ̀ sí ìwòsàn nìkan.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: gẹ́gẹ́ bí Mósè ti pàṣẹ
  rationale: Ó pa ìtọ́kasí sí àṣẹ inú Òfin Mósè mọ́ ní ọ̀nà tó ṣe kedere.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: láti jẹ́ ẹ̀rí fún wọn
  rationale: Ó pa àìdájú ẹni tí ‘wọn’ ń tọ́ka sí àti bóyá ẹ̀rí náà dára tàbí tako wọn mọ́.
theological_decisions:
- issue: Ẹni tí αὐτοῖς (‘fún wọn’) ń tọ́ka sí àti agbára εἰς μαρτύριον
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘láti jẹ́ ẹ̀rí fún wọn,’ láìsọ ẹni tí ‘wọn’ jẹ́ tàbí pé ẹ̀rí náà tako wọn.
  alternative: ‘láti jẹ́ ẹ̀rí fún àwọn àlùfáà’ tàbí ‘láti jẹ́ ẹ̀rí lòdì sí wọn’
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní pàtó, bẹ́ẹ̀ ni ó lè jẹ́ ẹ̀rí fún wọn tàbí ẹ̀rí tó tako wọn; ìtumọ̀ náà pa àìdájú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Àlùfáà’ ni a lò fún ἱερεύς, ‘ọrẹ’ fún ohun tí a mú wá ní àyíká ẹbọ, àti ‘ìwẹ̀nùmọ́’ fún ìmọ́-nípa-àṣà ẹ̀sìn.
