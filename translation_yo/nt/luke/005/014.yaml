  rationale: Àtúnṣe náà jẹ́ kí ọ̀rọ̀ àṣẹ náà rọrùn ní Yorùbá, ó sì mú προσένεγκε hàn gẹ́gẹ́ bí ìrúbọ nínú àyíká òfin ìwẹ̀nùmọ́. Ó pa ìtumọ̀ tí kò dájú ti “fún wọn” mọ́, kò sì sọ ẹni tí “wọn” jẹ́ tàbí pé ẹ̀rí náà dára tàbí tako wọn. A tún gbe àmì ìsàlẹ̀ a sí gbolohun tí àlàyé rẹ̀ ń ṣàlàyé.
