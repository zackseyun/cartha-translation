  source_fidelity: 'Ìtumọ̀ náà ń pa ètò gbolohun Gíríìkì mọ́ dáadáa: àwọn Farisí àti àwọn akọ̀wé wọn ni ń kùn sí àwọn ọmọ-ẹ̀yìn Jesu, ìbéèrè náà sì wà ní ọ̀pọ̀ ẹni gẹ́gẹ́ bí ἐσθίετε καὶ πίνετε. Síbẹ̀, ‘agbowó òde’ le dín τελῶναι kù sí àwọn olùgba owó ọ̀nà/ààlà; ‘agbowó orí’ gbooro síi, ó sì bá ‘tax collectors’ mu dáadáa.'
  naturalness: ‘Kí ló dé tí ẹ̀ fi ń jẹ, tí ẹ̀ sì ń mu’ jẹ́ ọ̀nà Yorùbá ìgbàlódé tí ó rọrùn, tí ó sì jẹ́ gírámà ju ‘Èé ṣe tí ẹ fi ń jẹ’ lọ. Gbigbe àmì akọsílẹ̀ sí ọ̀dọ̀ ‘ń kùn’ ń jẹ́ kí ibi tí akọsílẹ̀ ń ṣàlàyé hàn kedere.
  terminology: ‘Àwọn Farisí,’ ‘àwọn akọ̀wé wọn,’ ‘àwọn ọmọ-ẹ̀yìn rẹ̀,’ àti ‘àwọn ẹlẹ́ṣẹ̀’ pa àwọn orúkọ ẹgbẹ́ àti ọ̀rọ̀ pàtàkì inú orísun mọ́. ‘Àwọn agbowó orí’ ni a lò fún τελῶναι láti má ṣe di ìtumọ̀ náà mọ́ owó ọ̀nà nìkan.
  issues:
