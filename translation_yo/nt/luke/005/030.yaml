  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: yo
  text: Àwọn Farisí àti àwọn akọ̀wé wọn sì ń kùn[a] sí àwọn ọmọ-ẹ̀yìn rẹ̀, wọ́n ń sọ pé, “Kí ló dé tí ẹ̀ fi ń jẹ, tí ẹ̀ sì ń mu pẹ̀lú àwọn agbowó orí àti àwọn ẹlẹ́ṣẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń ṣàròyé ní ìkùnsínú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀dùn tí a ń sọ kẹ́lẹ́kẹ́lẹ́, kì í ṣe àtakò ní gbangba nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: ń kùn
  rationale: Ọ̀rọ̀ yìí fi ẹ̀dùn tàbí àròyé tí a ń sọ ní ìkùnsínú hàn; àmì àkókò aláìparí náà tọ́ka sí ohun tí wọ́n ń ṣe lọ́wọ́ tàbí léraléra.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹgbẹ́ àwọn amòfin ẹ̀sìn yìí, ó sì pa orúkọ ìtàn wọn mọ́ láì fi àlàyé iṣẹ́ wọn rọ́pò rẹ̀.
- source_word: αὐτῶν
  choice: wọn
  rationale: 'A so ọ̀rọ̀ arọ́pò-orúkọ olùní náà mọ́ àwọn akọ̀wé gẹ́gẹ́ bí ètò Gíríìkì ṣe rí: ‘àwọn akọ̀wé wọn.’'
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sí àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: πρός pẹ̀lú accusative níhìn-ín tọ́ka sí àwọn tí wọ́n darí ọ̀rọ̀ sí.
- source_word: Διὰ τί
  choice: Èé ṣe tí
  rationale: Ọ̀nà Yorùbá àdánidá láti béèrè ìdí ni èyí.
- source_word: τελωνῶν
  choice: àwọn agbowó òde
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó yé kedere fún àwọn tí ń gba owó orí tàbí owó kọjá ní àkókò náà, ó sì lè pa àbùkù tí àwùjọ fi kàn wọ́n mọ́.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Ìtumọ̀ tààrà ni, ó sì pa ìpín àwùjọ àti ìwà tí àwọn olùsọ̀rọ̀ fi ń pe àwọn ènìyàn náà mọ́.
- source_word: ἐσθίετε καὶ πίνετε
  choice: ẹ fi ń jẹ, tí ẹ sì ń mu
  rationale: Ó pa iṣẹ́ méjèèjì mọ́ ní tààrà, ó sì mú ìṣe tí wọ́n ń ṣe déédéé tàbí lọ́wọ́ hàn ní Yorùbá.
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn ni a pa mọ́ ní ọ̀nà tí ó bá ìṣàn ọ̀rọ̀ Yorùbá mu.
theological_decisions:
- issue: Agbára ẹ̀sìn àti ti àwùjọ inú jíjẹ àti mímu pẹ̀lú ‘àwọn agbowó òde àti àwọn ẹlẹ́ṣẹ̀’
  choice: A pa ẹ̀sùn pàtó náà mọ́ láì fi àlàyé míì kún un.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìrúfin ìwẹ̀nùmọ́ ẹ̀sìn tàbí bí fífọwọ́ sí ìwà búburú wọn.
  rationale: Ẹsẹ náà kò sọ ìdí ẹ̀sìn tàbí ìwà náà ní kíkún; nítorí náà, ìtumọ̀ náà pa ìforígbárí nípa ìbákẹ́gbẹ́ níbi oúnjẹ mọ́ láì pinnu ohun tí ẹsẹ kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘akọ̀wé’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ ìtàn, àti ‘agbowó òde’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó mọ̀ ní àyíká Bíbélì. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó kan ‘ń kùn.’
