  terminology: ‘Àwọn Farisí kan,’ ‘Jésù,’ ‘Hẹ́rọ́dù,’ àti ‘fẹ́ pa ọ́’ bá ìlò Yorùbá Bíbélì boṣewa mu, wọ́n sì ṣètọ́jú ìtumọ̀ láìfi èrò ìtumọ̀ ẹ̀sìn kún un.
