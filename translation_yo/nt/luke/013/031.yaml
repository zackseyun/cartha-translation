    issue: ‘lọ sí ibòmíràn’
    rationale: ‘Sí ibòmíràn’ ń sọ ibi tuntun kan tí ọ̀rọ̀ ìpilẹ̀ kò sọ. ἐντεῦθεν jẹ́ ‘kúrò níbí/láti ibi yìí’; a kò gbọ́dọ̀ ṣàfikún ibi àfojúsùn.
