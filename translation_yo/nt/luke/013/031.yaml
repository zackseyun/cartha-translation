  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú àkókò pàtó, ẹgbẹ́ Farisí kan, ìdí ìkìlọ̀ náà, àti ìfẹ́ Hẹ́rọ́dù láti pa Jésù hàn dáadáa. Ṣùgbọ́n ‘tọ Jésù wá’ lè túmọ̀ sí pé wọ́n tẹ̀lé Jésù wá, kì í ṣe pé wọ́n sún mọ́ ọn; ‘lọ sí ibòmíràn’ sì fi ibi-ìfẹ̀hìn míì kún ọ̀rọ̀ náà, níbi tí Gíríìkì ti kan sọ pé kí ó lọ kúrò níbí.
