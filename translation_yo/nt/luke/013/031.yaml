  to: Ní wákàtí yẹn gan-an[a], àwọn Farisí kan wá sọ́dọ̀ Jésù, wọ́n sì sọ fún un pé, “Jáde, kí o sì lọ kúrò níbí[b], nítorí Hẹ́rọ́dù fẹ́ pa ọ́.”
