id: LUK.13.31
reference: Luke 13:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: yo
  text: Ní wákàtí yẹn gan-an[a], àwọn Farisí kan wá sọ́dọ̀ Jésù, wọ́n sì sọ fún un pé, “Jáde, kí o sì lọ kúrò níbí[b], nítorí Hẹ́rọ́dù fẹ́ pa ọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní wákàtí kan náà yẹn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kúrò níbí, kí o sì lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Ní wákàtí yẹn gan-an
  rationale: Gbólóhùn yìí tọ́ka sí àkókò pàtó, ó sì tẹnu mọ́ pé ohun náà ṣẹlẹ̀ ní àkókò yẹn gan-an; èyí dá agbára αὐτῇ dúró ní Yorùbá àdánidá.
- source_word: προσῆλθάν
  choice: tọ Jésù wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísún mọ́ ẹni tàbí wíwá bá a. Fífi orúkọ Jésù hàn dípò arọ́pò-orúkọ mú ìtumọ̀ ṣe kedere ní Yorùbá láìfi ohunkóhun kún ìṣẹ̀lẹ̀ náà.
- source_word: τινες Φαρισαῖοι
  choice: àwọn Farisí kan
  rationale: ‘Kan’ pa àìdánimọ̀ τινες mọ́, kò sì fi hàn pé gbogbo àwọn Farisí ni.
- source_word: λέγοντες αὐτῷ
  choice: wọ́n sì sọ fún un pé
  rationale: A sọ participle náà di ọ̀rọ̀-ìṣe pípé nítorí ìṣàn gbolohun Yorùbá tó ṣe kedere, nígbà tí àjọṣe rẹ̀ pẹ̀lú wíwá wọn ṣì dúró.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Kúrò níbí, kí o sì lọ sí ibòmíràn
  rationale: Èyí pa àṣẹ méjèèjì mọ́—kíkúrò àti lílọ—ó sì sọ ìṣípo kúrò ní ibi tí wọ́n wà ní ọ̀nà Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí wọ́n fi fún Jésù ní àṣẹ náà hàn ní kedere.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tó bá ìró Yorùbá àti àṣà ìkọ̀wé orúkọ Bíbélì mu.
- source_word: θέλει
  choice: fẹ́
  rationale: ‘Fẹ́’ sọ ìfẹ́ tàbí ìnífẹ̀ẹ́ láti ṣe ohun kan, láìsọ ọ́ di ète tí a ti pinnu pátápátá.
- source_word: ἀποκτεῖναι
  choice: pa
  rationale: ‘Pa’ jẹ́ ọ̀nà Yorùbá tààrà láti sọ pípa ènìyàn, kò sì fi èrò ìdájọ́ ikú lórí rẹ̀.
theological_decisions:
- issue: Ète àwọn Farisí nínú ìkìlọ̀ wọn
  choice: A gbé ọ̀rọ̀ wọn kalẹ̀ gẹ́gẹ́ bí ìkìlọ̀ láìsọ bóyá ọkàn rere tàbí ète búburú ló mú wọn sọ ọ́.
  alternative: A lè túmọ̀ ìṣẹ̀lẹ̀ náà bí ìkìlọ̀ tòótọ́, tàbí bí ọgbọ́n láti dẹ́rù ba Jésù kí ó lè lọ.
  rationale: Ọ̀rọ̀ Gíríìkì ròyìn ohun tí wọ́n sọ, ṣùgbọ́n kò ṣàlàyé ète ọkàn wọn; ìtumọ̀ náà fi àìdánilójú ìtàn yìí sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ tààrà, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Jésù’ níbi αὐτῷ láti yẹra fún àìṣe kedere arọ́pò-orúkọ Yorùbá; kò yí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí padà.
