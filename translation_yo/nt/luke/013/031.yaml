    rationale: ‘Kúrò níbí’ lè bo gbogbo àṣẹ náà, ṣùgbọ́n ‘Jáde, kí o sì lọ kúrò níbí’ ń pa ‘jáde’ àti ‘lọ’ mọ́ ní kedere.
