id: LUK.13.29
reference: Luke 13:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: yo
  text: Wọ́n yóò sì wá láti ìlà-oòrùn àti ìwọ̀-oòrùn, àti láti àríwá àti gúúsù; wọ́n yóò sì jókòó síbi àsè ní ìjọba Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n yóò jókòó.” Ọ̀rọ̀ Gíríìkì náà ní pàtó ń tọ́ka sí fífi ara tì sílẹ̀ níbi oúnjẹ àsè, gẹ́gẹ́ bí àṣà ìgbà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: Àwọn ènìyàn yóò sì wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘wá’ tàbí ‘dé.’ ‘Yóò wá’ jẹ́ èdè Yorùbá àdánidá níbi tí a ti ń sọ ibi tí wọ́n ti ń bọ̀; fífi ‘àwọn ènìyàn’ kún un mú olùṣe tí ó fara sin nínú ọ̀rọ̀ Gíríìkì hàn láì sọ irú àwọn ènìyàn náà ní pàtó.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: láti ìlà-oòrùn àti ìwọ̀-oòrùn
  rationale: Àwọn ọ̀rọ̀ Gíríìkì ní ìtumọ̀ gangan ‘ibi tí oòrùn ti ń yọ’ àti ‘ibi tí oòrùn ti ń wọ̀,’ ṣùgbọ́n wọ́n jẹ́ ọ̀nà tí a fi ń tọ́ka sí ìhà ìlà-oòrùn àti ìwọ̀-oòrùn.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: láti àríwá àti gúúsù
  rationale: Èyí ń tẹ̀ síwájú nínú ṣíṣàkójọ gbogbo ìhà mẹ́rin ní èdè Yorùbá tó ṣe kedere.
- source_word: ἀνακλιθήσονται
  choice: wọn yóò sì jókòó yí tábìlì ká[a]
  rationale: Ọ̀rọ̀ náà ń tọ́ka ní pàtó sí dídùbú tàbí fífi ara tì sílẹ̀ níbi àsè gẹ́gẹ́ bí àṣà ìgbà náà. ‘Jókòó yí tábìlì ká’ jẹ́ àwòrán àsè tó ṣe kedere fún òǹkà Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ń pa ìṣe ìgbàanì náà mọ́.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ní ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá, tí ó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ βασιλεία τοῦ θεοῦ mọ́.
theological_decisions:
- issue: Àwòrán àsè nínú ìjọba ọjọ́ iwájú
  choice: Pa àwòrán jíjẹun pọ̀ mọ́ nípasẹ̀ ‘jោកòó yí tábìlì ká,’ pẹ̀lú àlàyé nípa dídùbú níbi àsè.
  alternative: ‘wọn yóò jókòó ní ìjọba Ọlọ́run’ tàbí ‘wọn yóò dùbú níbi àsè ní ìjọba Ọlọ́run’
  rationale: A kò gbọdọ̀ sọ àwòrán àsè náà di wíwọlé sí ìjọba lásán. Ní bákan náà, ‘dùbú’ nìkan lè dà bí ẹni pé wọ́n sùn fún òǹkà òde òní; ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ papọ̀ ń pa àwòrán orísun náà mọ́.
- issue: Ìwọ̀n àgbáyé tí ìhà mẹ́rin ń tọ́ka sí
  choice: Túmọ̀ gbogbo ìhà mẹ́rin ní tààrà láì sọ ẹ̀yà àwọn tó ń bọ̀.
  alternative: Ṣàlàyé wọn ní pàtó gẹ́gẹ́ bí àwọn Kèfèrí láti gbogbo orílẹ̀-èdè.
  rationale: Ẹsẹ náà fi ìkójọpọ̀ láti ibi gbogbo hàn, ṣùgbọ́n kò dárúkọ àwọn Kèfèrí tàbí ẹ̀yà kan ní pàtó; ìtumọ̀ náà kò gbọ́dọ̀ fi ìtumọ̀ àlàyé kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. ‘Jókòó yí tábìlì ká’ mú àwòrán àsè yé òǹkà òde òní; àlàyé ìsàlẹ̀ sì ṣàfihàn ìṣe dídùbú níbi àsè tí ọ̀rọ̀ Gíríìkì sọ ní pàtó.
