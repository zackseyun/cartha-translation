id: LUK.13.27
reference: Luke 13:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: yo
  text: Yóò sì sọ fún yín pé,[a] “Èmi kò mọ ibi tí ẹ ti wá. Ẹ kúrò lọ́dọ̀ mi, gbogbo ẹ̀yin olùṣe àìṣòdodo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘yóò sọ, nípa wí fún yín pé’; Yorùbá darapọ̀ ọ̀rọ̀-ìṣe méjèèjì fún ìṣàn ọ̀rọ̀ àdánidá.
    reason: source_form
  - marker: b
    text: Tàbí, ‘gbogbo ẹ̀yin tí ń ṣe ohun tí kò tọ́’ tàbí ‘gbogbo ẹ̀yin olùṣe ìwà búburú.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: yóò sọ fún yín pé
  rationale: Ọ̀rọ̀ náà ní ọ̀rọ̀-ìṣe pàtàkì ‘yóò sọ’ àti ọ̀rọ̀-ìṣe alábàápín ‘ó ń wí’; ní Yorùbá, ‘yóò sọ fún yín pé’ darapọ̀ iṣẹ́ àwọn méjèèjì ní ọ̀nà àdánidá láìpàdánù ìtumọ̀.
- source_word: οἶδα
  choice: Èmi kò mọ
  rationale: ‘Mọ’ ni ìtumọ̀ tààrà; fífi ‘Èmi’ sí i mú ìtẹnumọ́ àti ìkọ̀sẹ̀-kúrò nínú ìbáṣepọ̀ hàn láìyí ọ̀rọ̀ náà sí ‘dámọ̀.’
- source_word: πόθεν ἐστέ
  choice: ibi tí ẹ ti wá
  rationale: Ọ̀rọ̀ πόθεν ń tọ́ka sí orísun tàbí ibi tí ènìyàn ti wá; gbólóhùn yìí jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Ẹ kúrò lọ́dọ̀ mi
  rationale: Àṣẹ náà béèrè ìyapa gédégbé. ‘Ẹ kúrò lọ́dọ̀ mi’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ní ìwọ̀n tó yẹ fún ọ̀rọ̀ ìdájọ́.
- source_word: πάντες ἐργάται
  choice: gbogbo ẹ̀yin olùṣe
  rationale: ‘Gbogbo ẹ̀yin’ mú agbára ìpè tààrà náà hàn, ‘olùṣe’ sì ṣàpèjúwe àwọn tí wọ́n ń ṣe tàbí ń fi ohun kan ṣe ìwà wọn.
- source_word: ἀδικίας
  choice: àìṣòdodo
  rationale: ‘Àìṣòdodo’ pa ìtumọ̀ ìwà tí kò tọ́ àti ìtakora sí òdodo mọ́, láìfi èrò pàtó nípa rírú òfin kún ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ìtumọ̀ ἀδικίας nínú ọ̀rọ̀ ìdájọ́
  choice: àìṣòdodo
  alternative: ìwà búburú; ohun tí kò tọ́; rírú òfin
  rationale: ‘Àìṣòdodo’ pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú òdodo mọ́, ó sì fi ẹ̀sùn ìwà hàn ní gbòòrò. ‘Rírú òfin’ lè fi ìtumọ̀ νόμος tí kò sí nínú ἀδικία kún un.
- issue: Ìtumọ̀ ‘Èmi kò mọ ibi tí ẹ ti wá’
  choice: Dídúró mọ́ ọ̀rọ̀ ‘mọ’ àti ìbéèrè orísun
  alternative: Èmi kò dámọ̀ yín
  rationale: Àyíká lè ní ìtumọ̀ kíkọ ìbáṣepọ̀ tàbí ìdámọ̀ wọn, ṣùgbọ́n yíyí i sí ‘kò dámọ̀ yín’ nìkan yóò tú àìgbọ́dọ̀mọ̀ọ́ ìtumọ̀ ọ̀rọ̀ ìpilẹ̀. Ìtumọ̀ tààrà jẹ́ kí ìfarapa ẹ̀kọ́-ìgbàgbọ́ náà dúró.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ kúrò lọ́dọ̀ mi’ ní agbára ìdájọ́ láìjẹ́ ọ̀rọ̀ àtijọ́, ‘olùṣe àìṣòdodo’ sì pa ìrísí orúkọ ἐργάται àti agbára ìwà rere/ìwà búburú ἀδικίας mọ́.
