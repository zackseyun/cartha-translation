reference: Luke 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: yo
  text: Ṣùgbọ́n ó dá a lóhùn pé, “Olúwa, fi í sílẹ̀[a] ní ọdún yìí náà, títí tí n ó fi walẹ̀ yí i ká, tí n ó sì fi ààtàn sí i[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ kí ó wà” tàbí “dá a sí.”
    reason: lexical_alternative
  - marker: b
    text: “Ààtàn” níbí ni ìgbẹ́ tí a fi ń mú ilẹ̀ lókun; a tún lè túmọ̀ rẹ̀ sí “ajílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: ó dá a lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ gbólóhùn ìtàn Gíríìkì náà; ó pa ìtumọ̀ ìdáhùn àti ọ̀rọ̀ tí ó tẹ̀ lé mọ́ láì mú kí gbolohun náà le.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ tó dúró ṣinṣin fún κύριος, ó sì tún lè jẹ́ oyè ọ̀wọ̀ fún ẹni tó ni ọgbà àjàrà nínú àkàwé yìí.
- source_word: ἄφες αὐτὴν
  choice: fi í sílẹ̀
  rationale: Ọ̀rọ̀ yìí sọ pé kí ó jẹ́ kí igi náà wà, kí ó má ṣe mú ìdájọ́ tí a pinnu ṣẹ lórí rẹ̀ ní báyìí; kò fi ìtumọ̀ “dárí jì” kún un.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: ní ọdún yìí náà
  rationale: Ó pa ìtumọ̀ ọdún àfikún náà mọ́, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀ ní Yorùbá láti sọ “this year also.”
- source_word: ἕως ὅτου
  choice: títí tí … fi
  rationale: Ìṣètò “títí tí … fi” ni ọ̀nà Yorùbá àdánidá fún ààlà àkókò tí gbólóhùn Gíríìkì yìí fi hàn.
- source_word: σκάψω περὶ αὐτὴν
  choice: n ó fi walẹ̀ yí i ká
  rationale: “Walẹ̀ yí i ká” pa àwòrán iṣẹ́ ọwọ́ gidi ti σκάπτω mọ́, dípò kí a sọ ọ́ di ọ̀rọ̀ gbogbogbò bíi títọ́jú ilẹ̀.
- source_word: βάλω κόπρια
  choice: n ó sì fi ààtàn sí i
  rationale: “Ààtàn” pa ìtumọ̀ ìgbẹ́ tí a ń lò láti mú ilẹ̀ lókun mọ́; “fi … sí i” sì sọ ohun tí a ṣe sí igi náà ní kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ tí olùtọ́jú ọgbà sọ fún ẹni tó ni ọgbà nínú àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyíká àkàwé, ọ̀rọ̀ náà lè jẹ́ oyè ọ̀wọ̀ lásán; “Olúwa” pa ìbámu pẹ̀lú ìtumọ̀ κύριος mọ́, láì sọ ní pàtó pé olùtọ́jú náà ń bá Ọlọ́run sọ̀rọ̀.
- issue: Bí a ṣe lóye ἄφες αὐτὴν lẹ́yìn àṣẹ láti gé igi náà lulẹ̀
  choice: fi í sílẹ̀
  alternative: dá a sí / ṣàánú rẹ̀
  rationale: “Fi í sílẹ̀” jẹ́ kí ìtumọ̀ náà dúró sí fífi igi náà sílẹ̀ fún àkókò díẹ̀; “ṣàánú rẹ̀” lè fi èrò ẹ̀dùn-ọkàn tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe, ọlọ́wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “ó dá a lóhùn pé” dípò àtúnṣe ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ tí yóò le ní Yorùbá. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì pa àwòrán iṣẹ́ ọgbà—walẹ̀ àti ààtàn—mọ́.
