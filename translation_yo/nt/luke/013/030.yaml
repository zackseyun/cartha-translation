  source_fidelity: Àfikún “nísinsìnyí” kò sí nínú Gíríìkì, ó sì lè mú ìyàtọ̀ àkókò tí kò ṣe pàtó nínú ọ̀rọ̀ náà wọlé. Bákan náà, “yóò di” ń fi ìmọ̀ ìyípadà kún εἰμί (“yóò jẹ́”), bí ó tilẹ̀ jẹ́ pé àyíká le dá ìyípadà ipò lójú. Àtúnṣe náà pa ìfarajọ́ ìwàláàyè, ìjọra gbolohun méjèèjì, àti ìtumọ̀ gbogbogbò ti Gíríìkì mọ́.
