revisions:
- from: Àti kíyèsí i, àwọn kan wà tí wọ́n jẹ́ ẹni ìkẹyìn nísinsìnyí, tí wọn yóò sì di ẹni àkọ́kọ́; àwọn kan sì wà tí wọ́n jẹ́ ẹni àkọ́kọ́ nísinsìnyí, tí wọn yóò sì di ẹni ìkẹyìn.
  to: Wò ó[a], àwọn ẹni ìkẹyìn wà tí yóò jẹ́ ẹni àkọ́kọ́, àwọn ẹni àkọ́kọ́ sì wà tí yóò jẹ́ ẹni ìkẹyìn.
  rationale: A yọ àwọn àfikún “nísinsìnyí” àti “di” kúrò kí ìtumọ̀ má bàa sọ ju Gíríìkì lọ. A tún ṣe ìbẹ̀rẹ̀ sí “Wò ó!” gẹ́gẹ́ bí àmì ìkíni-afiyèsí tó dára fún ἰδοὺ, a sì pa ìfiwéra ìkẹyìn/àkọ́kọ́ mọ́. Àmì akọsílẹ̀ àti ìtumọ̀ ọ̀rọ̀ gangan ni a fi kún un gẹ́gẹ́ bí ìtàn àyẹ̀wò Gẹ̀ẹ́sì.
