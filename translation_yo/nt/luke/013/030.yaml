source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: yo
  text: Wò ó[a], àwọn ẹni ìkẹyìn wà tí yóò jẹ́ ẹni àkọ́kọ́, àwọn ẹni àkọ́kọ́ sì wà tí yóò jẹ́ ẹni ìkẹyìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ gangan: “àwọn ẹni ìkẹyìn wà tí yóò jẹ́ ẹni àkọ́kọ́, àti àwọn ẹni àkọ́kọ́ wà tí yóò jẹ́ ẹni ìkẹyìn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá ìsinsìnyí tí ó ní iyì láti pe àfiyèsí olùgbọ́ sí ọ̀rọ̀ pàtàkì, láì lo ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀.
- source_word: ἔσχατοι
  choice: ẹni ìkẹyìn
  rationale: Ó pa ìtumọ̀ ipò ìkẹyìn mọ́, kò sì túmọ̀ rẹ̀ sí ẹni tí kò tó nǹkan nípa ìwà tàbí iye.
- source_word: πρῶτοι
  choice: ẹni àkọ́kọ́
  rationale: Ó jẹ́ òdìkejì tó ṣe kedere fún ‘ẹni ìkẹyìn,’ ó sì pa ìwọ̀ntúnwọ̀nsì gbólóhùn Gíríìkì mọ́.
- source_word: οἳ ἔσονται
  choice: tí wọn yóò sì di
  rationale: ‘Yóò di’ sọ ìyípadà ipò tí ọ̀rọ̀ àsọtẹ́lẹ̀ náà túmọ̀ sí lọ́nà àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì túmọ̀ ní tààrà sí ‘yóò jẹ́.’
- source_word: εἰσὶν
  choice: àwọn kan wà tí wọ́n jẹ́
  rationale: Ó fi agbára gbólóhùn ìwàláàyè Gíríìkì hàn ní Yorùbá àdánidá, ó sì yẹra fún gbólóhùn líle bí ‘àwọn ìkẹyìn wà.’
- source_word: καὶ
  choice: àti / sì
  rationale: A lo ‘àti’ ní ìbẹ̀rẹ̀ láti so ẹsẹ̀ náà mọ́ ohun tó ṣáájú, a sì lo ‘sì’ láti mú ìfiwéra àwọn apá méjèèjì dun bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n àwọn tí ìyípadà ipò náà kàn
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí òfin gbogbogbò nípa ìyípadà ipò, láì sọ irú ẹgbẹ́ ènìyàn kan pàtó.
  alternative: Kí a sọ ọ́ ní pàtó nípa àwọn Kèfèrí àti Júù, ìrẹ̀lẹ̀ àti ìgbéraga, tàbí ipò ní ìdájọ́ ìkẹyìn.
  rationale: Àyíká náà ní í ṣe pẹ̀lú wíwọ inú ìjọba Ọlọ́run, ṣùgbọ́n Gíríìkì sọ ọ̀rọ̀ náà ní ṣókí àti ní gbogbogbò. Ìtumọ̀ kò gbọ́dọ̀ fi ẹ̀kọ́ ìtumọ̀ kan ṣoṣo sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àkànṣe, pẹ̀lú àmì ohùn kíkún níbi tó bá bá èdè mu. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Nísinsìnyí’ jẹ́ àfikún ìtumọ̀ láti mú ìyàtọ̀ láàárín εἰσὶν àti ἔσονται ṣe kedere; a kò fi àlàyé ẹ̀kọ́ ìsìn kan pàtó kún un.
