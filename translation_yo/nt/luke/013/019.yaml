id: LUK.13.19
reference: Luke 13:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: yo
  text: Ó dàbí irúgbìn músítádì kan, tí ọkùnrin kan mú, tí ó sì jù sínú ọgbà tirẹ̀; ó dàgbà, ó sì di igi[a], àwọn ẹyẹ ojú ọ̀run[b] sì ṣe ìtẹ́ wọn nínú àwọn ẹ̀ka rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì sọ ní tààrà pé ó “di igi,” ó sì pa àwòrán ìdàgbàsókè ńlá nínú àkàwé náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ẹyẹ sánmà”; ní àṣà ìtumọ̀ kan, “àwọn ẹyẹ afẹ́fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Ó dàbí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àfiwé náà; ó tún jẹ́ kí ohun tí a ń fi wé láti ẹsẹ tó ṣáájú wà gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: κόκκῳ σινάπεως
  choice: irúgbìn músítádì kan
  rationale: ‘Irúgbìn’ túmọ̀ κόκκος ní ọ̀nà tí ó ṣe kedere nípa ohun ọ̀gbìn, ‘músítádì’ sì jẹ́ orúkọ tí a mọ̀ sí ewéko náà ní Yorùbá òde òní.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: tí ọkùnrin kan mú
  rationale: Ó pa ẹni akọ kan tí àpẹẹrẹ náà sọ mọ́, ó sì tẹ̀ lé ìṣísẹ̀ ọ̀rọ̀ Gíríìkì láì di Yorùbá líle.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: tí ó sì jù sínú ọgbà tirẹ̀
  rationale: ‘Jù sínú’ pa agbára βάλλω mọ́ ju ‘fi sínú’ lọ; ‘ọgbà’ sì bá κῆπος mu. ‘Tirẹ̀’ tẹnu mọ́ pé ọgbà tirẹ̀ ni.
- source_word: ηὔξησεν
  choice: Ó dàgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún bí ohun ọ̀gbìn ṣe ń hù tí ó sì ń tóbi.
- source_word: ἐγένετο εἰς δένδρον
  choice: ó sì di igi
  rationale: Ó túmọ̀ gbólóhùn náà ní tààrà, ó sì pa àwòrán ìdàgbàsókè ńlá tí àkàwé náà gbé kalẹ̀ mọ́.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: ‘Ojú ọ̀run’ ń tọ́ka sí ojú sánmà ní àyíká yìí, ó sì pa àwòrán Gíríìkì mọ́ ní Yorùbá tí ó lérò.
- source_word: κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ
  choice: tẹ́ ìtẹ́ sínú àwọn ẹ̀ka rẹ̀
  rationale: Pẹ̀lú ẹyẹ gẹ́gẹ́ bí olùṣe, ‘tẹ́ ìtẹ́’ sọ ìtumọ̀ gbígbé tàbí pípa ibùgbé kalẹ̀ ní kedere; ‘àwọn ẹ̀ka rẹ̀’ sì túmọ̀ κλάδοις αὐτοῦ láìsí àfikún.
theological_decisions:
- issue: Ìtumọ̀ akọ nínú ἄνθρωπος
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Ní àkàwé yìí, ọ̀rọ̀ náà ń ṣàpèjúwe ẹni akọ kan pàtó; nítorí náà, a kò sọ akọ rẹ̀ di àìlójú.
- issue: Àwòrán δένδρον nínú àkàwé irúgbìn músítádì
  choice: igi
  alternative: igi kékeré tàbí abẹ́rẹ́
  rationale: Gíríìkì sọ δένδρον ní kedere. A pa àwòrán ńlá tàbí àṣejù àkàwé náà mọ́ dípò ṣíṣe àtúnṣe rẹ̀ nítorí ìmọ̀ nípa ewéko.
- issue: Ìtumọ̀ οὐρανός ní àyíká yìí
  choice: ojú ọ̀run
  alternative: afẹ́fẹ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ ibi tí àwọn ẹyẹ ti ń fò, kì í ṣe ìtọ́ka ẹ̀kọ́ ìgbàgbọ́ sí ibùgbé Ọlọ́run; síbẹ̀ ‘ojú ọ̀run’ pa ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò; a pa ìtẹ̀lé ìṣe àti àwòrán àkàwé Gíríìkì mọ́ láìfi èrò ẹ̀kọ́ ìsìn kan kún un.
