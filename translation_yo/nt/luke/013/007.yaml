id: LUK.13.7
reference: Luke 13:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: yo
  text: Ó sì sọ fún olùtọ́jú ọgbà àjàrà náà pé, “Wò ó, ọdún mẹ́ta nìyí tí mo ti ń wá èso lórí igi ọ̀pọ̀tọ́ yìí, ṣùgbọ́n mi ò rí èso kankan. Gé e lulẹ̀. Èé ṣe tí igi náà fi tún ń sọ ilẹ̀ náà di aláìwúlò?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èé ṣe tí igi náà fi tún ń sọ ilẹ̀ náà di aláìlérè?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣíṣe ilẹ̀ di aláìwúlò tàbí kí ilẹ̀ má lè so èso; kì í ṣe pé igi náà kàn ń gba àyè nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: olùtọ́jú ọgbà àjàrà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tó ń ṣiṣẹ́, tó sì ń tọ́jú ọgbà àjàrà; yíyan yìí pa àyíká ọgbà àjàrà mọ́, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pe àfiyèsí olùgbọ́ ní tẹnumọ́tẹnumọ́ láìlo ọ̀rọ̀ àtijọ́ tàbí èdè tí kò wọ́pọ̀.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: ọdún mẹ́ta nìyí
  rationale: Ó fi hàn pé ipò náà ti ń bá a lọ láti ọdún mẹ́ta sẹ́yìn títí di ìsinsìnyí.
- source_word: ἔρχομαι ζητῶν
  choice: mo ti ń wá
  rationale: Ìṣètò yìí fi ìṣe tí a ń ṣe léraléra tàbí tí ó ń bá a lọ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: καρπὸν
  choice: èso
  rationale: Èso igi gan-an ni àwòrán òwe náà ń sọ níbí; a kò fi ìtumọ̀ ẹ̀mí kún ọ̀rọ̀ náà.
- source_word: συκῇ
  choice: igi ọ̀pọ̀tọ́
  rationale: Èyí ni orúkọ Yorùbá tó ṣe kedere fún fig tree.
- source_word: οὐχ εὑρίσκω
  choice: èmi kò sì rí ọ̀kan
  rationale: Ó pa ìsẹ̀lẹ̀ ìwá-kiri tí kò ní àṣeyọrí mọ́, ìtẹnumọ́ ‘èmi’ sì bá ìyàtọ̀ olùwá àti igi mu.
- source_word: ἔκκοψον
  choice: Gé e lulẹ̀
  rationale: Àṣẹ tààrà ni láti gé igi náà kúrò; gbólóhùn yìí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ gígé igi lulẹ̀.
- source_word: ἱνατί
  choice: Èé ṣe
  rationale: Ó gbé ìbéèrè ìdí kalẹ̀ ní tààrà.
- source_word: καὶ
  choice: tún
  rationale: Níbi yìí, ó fi kún ìṣòro àìso èso pé igi náà tún ń ba ilẹ̀ jẹ́ tàbí ń gba ibẹ̀ lásán.
- source_word: γῆν
  choice: ilẹ̀
  rationale: Ní àyíká iṣẹ́ àgbẹ̀ yìí, ‘ilẹ̀’ lè tọ́ka sí ilẹ̀ tí igi náà dúró sí àti erùpẹ̀ tó ń lò.
- source_word: καταργεῖ
  choice: máa gba ilẹ̀ náà lásán
  rationale: Ó sọ ipa tó ṣe kedere nínú àyíká náà—igi aláìléso ń gba ilẹ̀ tí a lè lò fún ohun mìíràn—ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn pé ó ń sọ ilẹ̀ di aláìlérè mọ́.
theological_decisions:
- issue: Àwòrán òwe àti ìtumọ̀ rẹ̀ nípa ẹ̀mí
  choice: A pa èdè iṣẹ́ àgbẹ̀ mọ́ gẹ́gẹ́ bí ó ti wà nínú orísun.
  alternative: Kí a túmọ̀ ọ́ lọ́nà tó sọ àìso èso nípa ẹ̀mí ní gbangba.
  rationale: Ẹsẹ yìí jẹ́ ara òwe; kò yẹ kí ìtumọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ ní tààrà sínú ọ̀rọ̀ òwe náà.
- issue: Ìtumọ̀ καταργεῖ
  choice: máa gba ilẹ̀ náà lásán
  alternative: máa sọ ilẹ̀ náà di aláìlérè
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí jíjẹ́ kí ilẹ̀ má ṣe wúlò tàbí má so èso, kì í ṣe gbígba àyè nìkan. A yan gbólóhùn Yorùbá tó rọrùn nínú àkọ́kọ́, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àjùmọ̀lò, ọ̀wọ̀, àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Olùtọ́jú ọgbà àjàrà’ ṣe kedere ju ọ̀rọ̀ iṣẹ́ àgbẹ̀ àkànṣe tí ọ̀pọ̀ ènìyàn lè má mọ̀ lọ.
