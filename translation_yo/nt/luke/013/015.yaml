id: LUK.13.15
reference: Luke 13:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa dá a lóhùn, ó sì wí pé, “Ẹ̀yin alágàbàgebè! Ṣé olúkúlùkù yín kì í tú màlúù tàbí kẹ́tẹ́kẹ́tẹ́ rẹ̀ kúrò níbi ìjẹun rẹ̀ ní ọjọ́ Ìsinmi, kí ó sì mú un lọ láti fún un ní omi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè tí Lúùkù lò fún Jésù ni κύριος níbí; “Olúwa” pa ìwọ̀n Kristológi inú ìtàn náà mọ́ láìfi àlàyé kún un.
- source_word: Ὑποκριταί
  choice: Ẹ̀yin alágàbàgebè!
  rationale: Ọ̀rọ̀ ìbáwí ní ọ̀pọ̀ ni; “Ẹ̀yin” mú kí àdírẹ́sì tààrà sí ọ̀pọ̀ ènìyàn ṣe kedere, “alágàbàgebè” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ìṣe rẹ̀ kò bá ohun tí ó ń fi ara hàn mu.
- source_word: ἕκαστος ὑμῶν
  choice: olúkúlùkù yín
  rationale: 'Ó pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́: kálukú nínú àwọn tí a ń bá sọ̀rọ̀.'
- source_word: τῷ σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ọjọ́ Sábáàtì Júù.
- source_word: λύει
  choice: tú
  rationale: Nínú àyíká ẹran tí a dè mọ́ ibi ìjẹun, “tú” túmọ̀ sí yíyọ okùn rẹ̀, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: βοῦν
  choice: màlúù
  rationale: βοῦς lè tọ́ka sí ẹran màlúù lápapọ̀; “màlúù” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi akọ tàbí iṣẹ́ ẹran náà kún ohun tí ọ̀rọ̀ Gíríìkì kò pinnu ní pàtó.
- source_word: ὄνον
  choice: kẹ́tẹ́kẹ́tẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún donkey.
- source_word: φάτνης
  choice: ibi ọ̀gbà ẹran
  rationale: φάτνη lè jẹ́ ibi tàbí ohun èlò tí ẹran ti ń jẹ; gbolohun yìí jẹ́ adayeba, a sì fi àlàyé ìtumọ̀ míì sínú àlàyé ìsàlẹ̀.
- source_word: ἀπαγαγὼν
  choice: fà á lọ
  rationale: Ó sọ ìṣe mímú ẹran kúrò níbi tí a dè é sí lọ síbi omi ní Yorùbá tó rọrùn; ìtẹ̀lé ìṣe náà wà ní kedere.
- source_word: ποτίζει
  choice: fún un ní omi
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú kí ẹranko mu omi; yíyan yìí jẹ́ kedere àti àdánidá ju ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀ lọ.
theological_decisions:
- issue: Orúkọ oyè κύριος tí a fi kan Jésù nínú ìtàn
  choice: Olúwa
  alternative: ọ̀gá
  rationale: “Olúwa” pa orúkọ oyè tí akọ̀wé ìtàn fún Jésù àti ìwúwo Kristológi rẹ̀ mọ́; “ọ̀gá” yóò dín ìtumọ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lásán. Ìbéèrè àsọ̀rọ̀ (rhetorical question) àti ìbáwí líle inú orísun ni a pa mọ́.
