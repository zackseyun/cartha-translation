source:
  edition: SBLGNT
  text: εἶπεν δέ τις αὐτῷ· Κύριε, εἰ ὀλίγοι οἱ σῳζόμενοι; ὁ δὲ εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: yo
  text: Ẹnì kan sì sọ fún un pé, “Olúwa,[a] ṣé àwọn díẹ̀ nìkan ni a ń gbà là?[b]” Ó sì sọ fún wọn pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Olúwa” tún lè túmọ̀ sí “Ọ̀gá” gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀; Gíríìkì kò jẹ́ kí agbára oyè náà hàn ní kíkún níhìn-ín.
    reason: alternative_reading
  - marker: b
    text: 'Ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì: “Ṣé àwọn tí a ń gbà là ni díẹ̀?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: sì
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ nínú ìtàn yìí; “sì” ń tẹ̀síwájú nínú ìtàn láì fi ìtakora tí kò sí sínú rẹ̀.
- source_word: τις
  choice: Ẹnì kan
  rationale: Ó tọ́ka sí ẹni tí a kò dárúkọ; “ẹnì kan” jẹ́ ọ̀nà Yorùbá àdánidá láti pa àìdánimọ̀ náà mọ́.
- source_word: αὐτῷ
  choice: bi í pé
  rationale: Àpólà yìí túmọ̀ sí pé ẹni náà béèrè lọ́wọ́ rẹ̀. Arọ́pò-orúkọ “í” pa “rẹ̀” inú Gíríìkì mọ́ láì fi orúkọ Jésù kún ẹsẹ yìí.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa agbára oyè κύριε mọ́, bó tilẹ̀ jẹ́ pé ní àyíká ọ̀rọ̀ yìí ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lasan.
- source_word: εἰ ὀλίγοι οἱ σῳζόμενοι
  choice: ṣé àwọn díẹ̀ nìkan ni a ń gbà là?
  rationale: Èyí jẹ́ ìbéèrè àdánidá ní Yorùbá, ó sì pa èrò iye díẹ̀ àti ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἱ σῳζόμενοι
  choice: àwọn ... ni a ń gbà là
  rationale: “A ń gbà là” fi ohùn àìṣe-taara àti ìṣe tí ń lọ lọ́wọ́ hàn, láì pinnu ètò ẹ̀kọ́ ìgbàlà kan pàtó.
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Ó sì sọ fún wọn pé
  rationale: Ó pa arọ́pò-orúkọ ọ̀pọ̀ “wọn” mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tí yóò tẹ̀ lé.
theological_decisions:
- issue: Agbára κύριε gẹ́gẹ́ bí ọ̀rọ̀ tí a fi ń pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá; Alágbà
  rationale: “Olúwa” ń pa ṣíṣeéṣe pé oyè náà ní ìtumọ̀ Kristi tó jinlẹ̀ mọ́; àkọ́lé ìsàlẹ̀ tún jẹ́ kí òǹkàwé mọ̀ pé ó lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ nínú àyíká yìí.
- issue: Ìrísí àsìkò àti ohùn οἱ σῳζόμενοι
  choice: a ń gbà là
  alternative: àwọn tí a gbà là
  rationale: Àmì “ń” pa ìṣe tàbí ipò tí ń lọ lọ́wọ́ mọ́, ohùn àìṣe-taara sì fi Ọlọ́run gẹ́gẹ́ bí olùgbàlà sílẹ̀ láì fi orúkọ rẹ̀ kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. “Ṣé” mú ìbéèrè náà jẹ́ ti ẹnu àdánidá; “a ń gbà là” pa ìṣe tí ń lọ lọ́wọ́ àti ohùn àìṣe-taara mọ́.
