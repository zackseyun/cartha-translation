id: LUK.13.6
reference: Luke 13:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: yo
  text: Ó sì ń sọ àkàwé yìí pé, “Ọkùnrin kan ní igi ọ̀pọ̀tọ́ kan tí a gbìn sínú ọgbà àjàrà rẹ̀[a]. Ó sì wá ń wá èso lórí rẹ̀, ṣùgbọ́n kò rí èso kankan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnì kan ní igi ọ̀pọ̀tọ́ kan tí a gbìn sínú ọgbà àjàrà rẹ̀.” Arọ́pò-orúkọ Gíríìkì náà kò sọ ẹni náà ní pàtó, ó sì lè jẹ́ “ẹnì kan”; ṣùgbọ́n “ọkùnrin kan” bá ọ̀nà ìtàn àkàwé mu dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ó sì ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi ìṣe tí ń lọ lọ́wọ́ tàbí ọ̀nà ìṣáájú ìtàn hàn; ‘ń sọ’ mú apá yìí jáde ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ asopọ̀ pẹ̀lẹ́; ‘sì’ so àkàwé náà mọ́ ohun tó ṣáájú láìfi ìtumọ̀ míì kún un.
- source_word: παραβολήν
  choice: àkàwé
  rationale: ‘Àkàwé’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá irú ìtàn àpẹẹrẹ tí Jésù fi ń kọ́ni mu.
- source_word: Συκῆν
  choice: igi ọ̀pọ̀tọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí igi fíìgì ní pàtó; ‘igi ọ̀pọ̀tọ́’ ni orúkọ Yorùbá rẹ̀.
- source_word: εἶχέν τις
  choice: Ọkùnrin kan ní
  rationale: τις jẹ́ arọ́pò-orúkọ àìsọ pàtó. ‘Ọkùnrin kan’ bá ọ̀nà ìtàn àkàwé Yorùbá mu, láìsọ ẹni náà di ẹni pàtó.
- source_word: πεφυτευμένην
  choice: tí a gbìn
  rationale: Perfect passive participle fi igi náà hàn gẹ́gẹ́ bí èyí tí a ti gbìn, tó sì wà ní ipò yẹn; gbólóhùn Yorùbá yìí mú ìtumọ̀ náà jáde lọ́nà àdánidá.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: sínú ọgbà àjàrà rẹ̀
  rationale: ἀμπελών túmọ̀ sí ọgbà àjàrà, αὐτοῦ sì fi hàn pé tirẹ̀ ni. ‘Sínú’ bá ìṣe gbígbìn sínú ọgbà mu ní Yorùbá.
- source_word: ἦλθεν ζητῶν
  choice: Ó sì wá ń wá
  rationale: Ọ̀rọ̀-ìṣe àkọ́kọ́ àti participle tó tẹ̀ lé e fi dídé àti wíwá èso hàn papọ̀; àtúnsọ ‘wá ń wá’ jẹ́ Yorùbá àdánidá, tí àyíká sì mú ìyàtọ̀ ìtumọ̀ àwọn ọ̀rọ̀ méjèèjì ṣe kedere.
- source_word: καρπὸν
  choice: èso
  rationale: ‘Èso’ ni ìbámu tààrà, ó sì pa agbára àpẹẹrẹ ọ̀rọ̀ náà mọ́.
- source_word: ἐν αὐτῇ
  choice: lórí rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν lè túmọ̀ sí ‘nínú,’ Yorùbá máa ń sọ pé èso wà ‘lórí’ igi.
- source_word: οὐχ εὗρεν
  choice: kò rí ọ̀kan
  rationale: Èyí tọ́ka padà sí èso, ó sì sọ pé kò rí èso kankan lọ́nà ṣókí àti àdánidá.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ àìsọ pàtó τις ń tọ́ka sí nínú àkàwé
  choice: Ọkùnrin kan
  alternative: Ẹnì kan
  rationale: Ẹsẹ̀ náà ń ṣàgbékalẹ̀ ẹni kan nínú àkàwé láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó kún un. ‘Ọkùnrin kan’ bá ìlànà ìtàn mu, ṣùgbọ́n ‘Ẹnì kan’ tún ṣeé ṣe nítorí τις fúnra rẹ̀ kò sọ akọ tàbí abo ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìṣàn ìtàn Gíríìkì àti àìsọ-pàtó τις mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
