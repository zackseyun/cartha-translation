id: LUK.13.16
reference: Luke 13:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: yo
  text: Obìnrin yìí náà, ẹni tí í ṣe ọmọbìnrin Abrahamu, tí Satani sì ti dè fún ọdún méjìdínlógún—ẹ wò ó—kò ha yẹ kí a tú u sílẹ̀ kúrò nínú ìdè yìí ní ọjọ́ Sábáàtì?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: ọmọbìnrin Abrahamu
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ìbátan mọ́, ó sì lè tọ́ka sí jíjẹ́ àtọmọdọ́mọ Abrahamu tàbí ọmọ ẹgbẹ́ àwọn ènìyàn májẹ̀mú láì fi tipátipá yan ọ̀kan.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: ti dè / tú u sílẹ̀ / ìdè
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí pa àwòrán kan náà ti dídè àti títú ìdè mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: ἰδού
  choice: wò ó
  rationale: Ó fi àmì ìfiyèsí pàtàkì inú ọ̀rọ̀ Jesu hàn, dípò kí a yọ ọ́ kúrò bí ẹni pé kò sí.
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: ọdún méjìdínlógún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ọdún méjìdínlógún.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ní ọjọ́ Sábáàtì
  rationale: Ó tọ́ka ní pàtó sí ọjọ́ Sábáàtì Júù, ó sì yẹra fún àìdánilójú tí ‘ọjọ́ ìsinmi’ lè mú wá.
theological_decisions:
- issue: Ìtumọ̀ ‘ọmọbìnrin Abrahamu’
  choice: A pa gbólóhùn ìbátan náà mọ́ láì ṣàlàyé rẹ̀ síwájú.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ‘àtọmọdọ́mọ Abrahamu’ tàbí ‘ẹni tó ní ìgbàgbọ́ Abrahamu.’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lè ní ìtumọ̀ ìran àti ìdánimọ̀ májẹ̀mú; ìtumọ̀ náà kò gbọ́dọ̀ pa ọ̀kan lára àwọn ìtumọ̀ wọ̀nyí run.
- issue: Ìṣe Satani nínú àìsàn obìnrin náà
  choice: ‘tí Satani sì ti dè’
  alternative: Kí a rọ̀ ọ́ sí ‘tí ó ti wà lábẹ́ ìpọ́njú’ tàbí kí a sọ pé àìsàn lásán ni.
  rationale: Gíríìkì fi ìṣe dídè náà lé Satani lọ́wọ́ ní tààrà; a pa ìdánimọ̀ yẹn mọ́ láì ṣàfikún ẹ̀kọ́ nípa gbogbo àìsàn.
- issue: Ìbéèrè dandan οὐκ ἔδει
  choice: ‘kò ha yẹ kí a tú u sílẹ̀’
  alternative: ‘ó gbọdọ̀ jẹ́ kí a tú u sílẹ̀.’
  rationale: Èyí pa ìrísí ìbéèrè tí ó ń retí ìdáhùn bẹ́ẹ̀ni mọ́, pẹ̀lú ìmọ̀lára ohun tí ó tọ́ tàbí tí ó pọndandan.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Sábáàtì’ fún ìtọ́kasí tó péye, a sì pa ‘wò ó’ mọ́ láti dúró fún ἰδού. Àmì ìbéèrè àti àmì àsọjáde pípẹ́ ń jẹ́ kí ìṣàn ọ̀rọ̀ náà hàn gbangba.
