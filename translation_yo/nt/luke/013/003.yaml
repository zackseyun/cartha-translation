  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: yo
  text: Rárá, mo sọ fún yín; ṣùgbọ́n bí ẹ kò bá ronúpìwàdà, gbogbo yín yóò ṣègbé bákan náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀nà kan náà.” ‘Bákan náà’ lè tọ́ka sí irú ìdájọ́ òjijì tó jọra, kì í ṣe dandan pé gbogbo wọn yóò kú ní ọ̀nà kan náà gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Rárá
  rationale: Ó dáhùn àfojúsùn inú ọ̀rọ̀ tó ṣáájú pẹ̀lú ìkọ̀ tí ó lágbára, ní èdè Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa ọ̀rọ̀ tààrà sí àwọn olùgbọ́ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ohun tí Jésù kọ̀ àti ìkìlọ̀ tó tẹ̀ lé e.
- source_word: ἐὰν μὴ
  choice: bí ẹ kò bá
  rationale: Ìṣètò àídájú Yorùbá yìí fi ìtumọ̀ ‘unless/if not’ hàn lọ́nà àdánidá.
- source_word: μετανοῆτε
  choice: ronúpìwàdà
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí yíyí ọkàn àti ìwà padà, kì í ṣe àtúnrò lásán; ó bá ìpè sí ìrònúpìwàdà níwájú Ọlọ́run mu.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó tẹnumọ́ pé ìkìlọ̀ náà kan gbogbo àwọn olùgbọ́ láìsí ẹni tí a yọ sílẹ̀.
- source_word: ὁμοίως
  choice: bákan náà
  rationale: Ó pa ìfiwéra mọ́ pẹ̀lú ohun tó ṣẹlẹ̀ nínú àyíká ọ̀rọ̀, láìdájọ́ pé irú ikú kan náà gan-an ni.
- source_word: ἀπολεῖσθε
  choice: yóò ṣègbé
  rationale: ‘Ṣègbé’ ní agbára ìtumọ̀ ìparun tàbí píparun ẹni, láìdín ìkìlọ̀ náà kù sí ikú ara nìkan tàbí sọ ọ́ di ìdálẹ́bi ayérayé ní pàtó.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀπολεῖσθε nínú ìkìlọ̀ Jésù
  choice: yóò ṣègbé
  alternative: yóò kú; a ó pa yín run; a ó dá yín lẹ́bi ayérayé
  rationale: Ọ̀rọ̀ Gíríìkì náà ń kìlọ̀ nípa ìdájọ́ àti ìparun, ṣùgbọ́n kò sọ ní pàtó níbí bóyá ikú ara nìkan ni tàbí ìdálẹ́bi ayérayé. ‘Ṣègbé’ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìtumọ̀ μετανοῆτε
  choice: ronúpìwàdà
  alternative: yí èrò yín padà; yí ọkàn yín padà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, kì í ṣe ìyípadà èrò lásán, bí kò ṣe ìyípadà ọkàn àti ọ̀nà ìgbésí ayé níwájú Ọlọ́run. Ọ̀rọ̀ Yorùbá ‘ronúpìwàdà’ sọ èyí ní kedere láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Ẹ/yín’ fi ọ̀pọ̀ ènìyàn tí πάντες ń tọ́ka sí hàn; ‘ronúpìwàdà’ jẹ́ ọ̀rọ̀ ìgbàgbọ́ tó ye àwọn olùkà òde òní, ‘ṣègbé’ sì pa agbára àti àìsọ pàtó inú ìkìlọ̀ náà mọ́.
