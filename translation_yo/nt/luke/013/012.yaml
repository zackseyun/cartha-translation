id: LUK.13.12
reference: Luke 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Jésù rí i, ó pè é, ó sì wí fún un pé, “Obìnrin, a ti tú ọ sílẹ̀ kúrò nínú àìlera rẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ... rí i
  rationale: Aorist participle náà ń tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ìpè náà; gbólóhùn àsìkò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń mú ìtàn tẹ̀ síwájú pẹ̀lú ìyípadà tàbí ìyàtọ̀ kékeré; “Ṣùgbọ́n” bá ìṣísẹ̀ ọ̀rọ̀ yìí mu láìfi ìtakora líle kún un.
- source_word: προσεφώνησεν
  choice: ó pè é
  rationale: προσφωνέω lè túmọ̀ sí pípe tàbí bá ẹni sọ̀rọ̀; nínú àyíká yìí, “ó pè é” fi hàn pé Jésù kọ́kọ́ pe obìnrin náà sí ara rẹ̀.
- source_word: εἶπεν αὐτῇ
  choice: ó sì wí fún un
  rationale: Ìtumọ̀ yìí ṣàfihàn ọ̀rọ̀ ìṣe náà àti ẹni tí a sọ ọ́ fún, ní èdè Yorùbá tó ní iyì.
- source_word: Γύναι
  choice: Obìnrin
  rationale: Ọ̀rọ̀ àpèjúwe yìí jẹ́ ìpè tààrà tó ní ọ̀wọ̀ nínú Gíríìkì; “Obìnrin” pa ìtumọ̀ náà mọ́ láìfi ìfẹ́ni tàbí ipò àwùjọ tí kò sí nínú orísun kún un.
- source_word: ἀπολέλυσαι
  choice: a ti tú ọ sílẹ̀
  rationale: Perfect passive náà ń fi ìṣe tí a ti parí àti ipò tó ń bá a lọ hàn. “A ti tú ọ sílẹ̀” pa ohùn àfaragà àti àbájáde tó wà nísinsìnyí mọ́.
- source_word: τῆς ἀσθενείας σου
  choice: kúrò nínú àìlera rẹ
  rationale: ἀσθένεια ní ìtumọ̀ gbòòrò bí àìlera, àìsàn, tàbí ailagbara. “Àìlera” bá àyíká ìpọ́njú ara mu, kò sì sọ ọ́ di àyẹ̀wò ìṣègùn pàtó.
theological_decisions:
- issue: Irú ipò obìnrin náà tí ἀσθένεια ń tọ́ka sí
  choice: àìlera
  alternative: àìsàn; ailagbara; àrùn
  rationale: Àyíká náà fi ìpọ́njú ara hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà gbòòrò ju àìsàn kan pàtó lọ. “Àìlera” pa ìfẹ̀sí gbòòrò náà mọ́, kò sì fi ẹ̀kọ́ tàbí àyẹ̀wò ìṣègùn àfikún sínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “wí” nínú ọ̀rọ̀ alásopọ̀ gẹ́gẹ́ bí ìforúkọsílẹ̀ Bíbélì tó wọ́pọ̀, nígbà tí ìpè tààrà “Obìnrin” dúró ṣinṣin gẹ́gẹ́ bí orísun.
