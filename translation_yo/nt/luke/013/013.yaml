  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: yo
  text: Ó sì gbé ọwọ́ rẹ̀ lé e; lẹ́sẹ̀kẹsẹ̀, ara rẹ̀ sì tọ́,[a] ó sì ń yin Ọlọ́run lógo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dìde dúró ṣánṣán” tàbí “a sì sọ ọ́ di títọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: Ó sì gbé ọwọ́ rẹ̀ lé e
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ọwọ́ rẹ̀ lé obìnrin náà; ẹyọ ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ (‘àwọn ọwọ́’), ṣùgbọ́n ‘ọwọ́ rẹ̀’ lè túmọ̀ sí ọwọ́ méjèèjì ní Yorùbá láìsí àìdánidá.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ìwòsàn náà ṣẹlẹ̀ ní kíákíá, láìjáfara.
- source_word: ἀνωρθώθη
  choice: ara rẹ̀ sì tún tọ́
  rationale: Ọ̀rọ̀ náà jẹ́ fọ́ọ̀mù aláìṣe tí ó túmọ̀ sí pé ohun tí ó tẹ̀ rí di títọ́; ‘ara rẹ̀ tún tọ́’ jẹ́ Yorùbá àdánidá fún ìmúpadàbọ̀sípò ara obìnrin tí ó ti tẹ̀.
- source_word: ἐδόξαζεν
  choice: ó sì ń yin ... lógo
  rationale: Àmì ìṣe àìpé náà tọ́ka sí ìṣe tó ń lọ; ‘ń yin ... lógo’ pa ìtumọ̀ fífi ògo fún Ọlọ́run mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún ohun tí ìṣe δοξάζω ń kan.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àbájáde ìwòsàn tí ἀνωρθώθη ṣàpèjúwe
  choice: ara rẹ̀ sì tún tọ́
  alternative: ó dìde dúró ṣánṣán; a sì sọ ọ́ di títọ́
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa obìnrin tí ara rẹ̀ tẹ̀ tí kò sì lè nà án. Yíyan ọ̀rọ̀ yìí ṣàfihàn ìmúpadàbọ̀sípò ara rẹ̀ láìfi ẹ̀kọ́ míì kún bí ìwòsàn náà ṣe ṣẹlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ara rẹ̀ tún tọ́’ dípò gbólóhùn aláìdánidá, a sì lo àmì ‘ń’ láti pa ìṣe tó ń lọ nínú ἐδόξαζεν mọ́.
