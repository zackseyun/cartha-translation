id: LUK.13.26
reference: Luke 13:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: yo
  text: Nígbà náà ni ẹ ó bẹ̀rẹ̀ sí í sọ pé, ‘A jẹun, a sì mu níwájú rẹ, ìwọ sì kọ́ni ní àwọn òpópónà wa[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ibi gbangba ìlú wa”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn òpópónà fífẹ̀ tàbí àwọn ibi gbangba tí ó ṣí sílẹ̀ nínú ìlú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí hàn gẹ́gẹ́ bí ohun tí yóò ṣẹlẹ̀ lẹ́yìn ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́yìn náà’ nínú Yorùbá.
- source_word: ἄρξεσθε λέγειν
  choice: ẹ ó bẹ̀rẹ̀ sí í sọ
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ tí ἄρξεσθε ní mọ́, dípò kí a túmọ̀ rẹ̀ sí ‘ẹ ó sọ’ nìkan.
- source_word: Ἐφάγομεν … καὶ ἐπίομεν
  choice: Àwa jẹun, a sì mu
  rationale: Àwọn ọ̀rọ̀ aorist méjèèjì ń tọ́ka sí ohun tí wọ́n ṣe tẹ́lẹ̀; ‘jẹun’ àti ‘mu’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ àti mímu.
- source_word: ἐνώπιόν σου
  choice: níwájú rẹ
  rationale: Ó lè túmọ̀ sí wíwà ní ojú ẹni tàbí níbi tí ẹni náà wà. Ọ̀rọ̀ yìí pa ẹ̀bẹ̀ wọn tí ó dá lórí ìbákẹ́gbẹ́ níta mọ́ láìfi ìtẹ́wọ́gbà tímọ́tímọ́ kún un.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: ní àwọn òpópónà wa
  rationale: πλατεῖα lè tọ́ka sí àwọn òpópónà fífẹ̀ tàbí ibi gbangba nínú ìlú. ‘Àwọn òpópónà wa’ jẹ́ èdè Yorùbá tó ṣe kedere, tí àkọ́silẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ míì mọ́.
- source_word: ἐδίδαξας
  choice: ìwọ sì kọ́ni
  rationale: Ó sọ iṣẹ́ ìkọ́ni tí ó ṣẹlẹ̀ tẹ́lẹ̀ ní ṣókí. ‘Kọ́ni’ kò fi dandan sọ pé àwọn olùsọ̀ náà gan-an ni a kọ́, ó sì bá àìní ohun tí ọ̀rọ̀ Gíríìkì ṣe sí mu.
theological_decisions:
- issue: Irú ẹ̀bẹ̀ tí àwọn olùsọ̀ ń ṣe sí Jesu
  choice: A pa ọ̀rọ̀ wọn mọ́ gẹ́gẹ́ bí ẹ̀rí pé wọ́n wà níbi tí ó ti jẹ, mu, tàbí kọ́ni, láìsọ pé ó jẹ́wọ́ wọn gẹ́gẹ́ bí tirẹ̀.
  alternative: A lè túmọ̀ ọ̀rọ̀ náà lọ́nà tí yóò mú kí ó dà bí ẹni pé wọ́n ní ìdàpọ̀ tàbí àjọṣe tí Jesu ti fọwọ́ sí.
  rationale: Ẹsẹ̀ náà sọ pé ẹ̀bẹ̀ wọn dá lórí ìsúnmọ́ wọn sí i níta. Kò sọ pé Jesu jẹ́wọ́ àjọṣe ìgbàlà kan pẹ̀lú wọn; nítorí náà, ìtumọ̀ náà kò gbọdọ̀ yanjú ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ yìí fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Jesu ń bá sọ̀rọ̀, àti ‘rẹ/ìwọ’ fún ẹni kan tí wọ́n ń bá sọ̀rọ̀ nínú ọ̀rọ̀ tààrà.
