id: LUK.13.4
reference: Luke 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: yo
  text: Àbí àwọn méjìdínlógún wọ̀nyẹn tí ilé gogoro ní Sílóámù wó lé lórí, tí ó sì pa wọ́n—ṣé ẹ rò pé wọ́n di alájọ̀bi ju gbogbo àwọn ènìyàn tí ń gbé ní Jerúsálẹ́mù lọ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Alájọ̀bi” tún lè jẹ́ “ẹlẹ́ṣẹ̀ tó burú ju” tàbí “arúfin tó burú ju.” Ọ̀rọ̀ Gíríìkì náà, ὀφειλέται, túmọ̀ ní tààrà sí “àwọn ajigbèsè,” ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ẹ̀bi ìwà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń mú àpẹẹrẹ mìíràn wọ inú ìjiyàn náà, ó sì bá ìbéèrè àtakò ní Yorùbá mu.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: àwọn méjìdínlógún
  rationale: Ó pa iye àti ìtọ́kasí àwọn ènìyàn náà mọ́ láìfi ọkùnrin kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: ilé gogoro ní Sílóámù wó lé lórí
  rationale: “Ilé gogoro” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún πύργος; “wó lé lórí” fi ìṣubú ilé náà àti ẹni tí ó ṣubú lé hàn.
- source_word: ἀπέκτεινεν αὐτούς
  choice: ó sì pa wọ́n
  rationale: Èdè ìtàn tó ṣe kedere ni, tí kò sọ ìṣẹ̀lẹ̀ àjálù náà di ìdájọ́ ikú tí ẹnìkan mọ̀ọ́mọ̀ ṣe.
- source_word: δοκεῖτε ὅτι
  choice: ṣé ẹ rò pé
  rationale: Ó mú ìbéèrè tààrà tí Jésù béèrè jáde ní Yorùbá àdánidá.
- source_word: αὐτοὶ ὀφειλέται ἐγένοντο
  choice: wọ́n di ajigbèsè
  rationale: Ó pa àwòrán gbèsè inú ὀφειλέται àti ìtumọ̀ ‘di’ inú ἐγένοντο mọ́, láìsọ ọ́ di ‘ẹlẹ́ṣẹ̀’ nìkan.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: tí ó burú ju gbogbo àwọn ènìyàn ... lọ
  rationale: Ìlànà ‘ju ... lọ’ sọ ìfiwéra παρά di Yorùbá àdánidá; ‘àwọn ènìyàn’ bá ìtọ́kasí gbogbogbò ἀνθρώπους mu.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: tí ń gbé ní Jerúsálẹ́mù
  rationale: Ó fi ìtumọ̀ àwọn olùgbé ibẹ̀ tí participle náà ní hàn ní èdè Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ ὀφειλέται ní àyíká ọ̀rọ̀ yìí
  choice: ajigbèsè tí ó burú ju
  alternative: ẹlẹ́ṣẹ̀ tó burú ju; arúfin tó burú ju
  rationale: “Ajigbèsè” pa àwòrán gbèsè ìwà rere tàbí ẹ̀bi mọ́, ó sì jẹ́ kí ọ̀rọ̀ ẹsẹ yìí yàtọ̀ sí “ẹlẹ́ṣẹ̀” ní ẹsẹ 2. Àfikún “tí ó burú ju” mú ipa ìfiwéra náà ṣe kedere ní Yorùbá láìsọ pé gbèsè owó ni.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì kọ orúkọ ibi gẹ́gẹ́ bí Sílóámù àti Jerúsálẹ́mù.
