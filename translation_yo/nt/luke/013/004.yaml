  to: Àbí àwọn méjìdínlógún wọ̀nyẹn tí ilé gogoro ní Sílóámù wó lé lórí, tí ó sì pa wọ́n—ṣé ẹ rò pé wọ́n di alájọ̀bi ju gbogbo àwọn ènìyàn tí ń gbé ní Jerúsálẹ́mù lọ?[a]
