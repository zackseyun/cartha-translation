id: LUK.13.25
reference: Luke 13:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: yo
  text: Nígbà tí baálé ilé bá ti dìde, tí ó sì ti ilẹ̀kùn mọ́[a], ẹ̀yin yóò bẹ̀rẹ̀ sí í dúró lóde, tí ẹ ń kan ilẹ̀kùn, tí ẹ sì ń wí pé, ‘Olúwa[b], ṣí ilẹ̀kùn fún wa,’ baálé ilé náà yóò dá yín lóhùn pé, ‘Èmi kò mọ̀ yín, ibi tí ẹ ti wá[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó túbọ̀ tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì: “Lẹ́yìn tí baálé ilé bá dìde, tí ó sì ti ilẹ̀kùn mọ́.”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì κύριε ni a sábà máa ń túmọ̀ sí “Olúwa”; nínú àkàwé yìí, ó tún lè túmọ̀ sí “Ọ̀gá.”
    reason: alternative_reading
  - marker: c
    text: 'Gíríìkì túmọ̀ ní tààrà sí: “Èmi kò mọ̀ yín, ibi tí ẹ ti wá.” Gbólóhùn náà lè tọ́ka sí àìmọ ẹni tí wọ́n jẹ́ tàbí ibi tí wọ́n ti wá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Nígbà tí ... bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ṣàfihàn àkókò tí kò tíì dájú, tí ìṣẹ̀lẹ̀ tó tẹ̀ lé e yóò bẹ̀rẹ̀; èdè Yorùbá ‘nígbà tí ... bá’ mú ìtumọ̀ ‘nígbà/ní kété tí’ jáde lọ́nà àdánidá.
- source_word: ἐγερθῇ
  choice: dìde
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí dídìde kúrò níbi ìjókòó tàbí ìrọ̀gbọ̀kú, kì í ṣe àjíǹde kúrò nínú òkú.
- source_word: ὁ οἰκοδεσπότης
  choice: baálé ilé
  rationale: ‘Baálé ilé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tó jẹ́ olórí tàbí ọ̀gá ilé, ó sì pa ìtumọ̀ àṣẹ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: ti ilẹ̀kùn mọ́
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún pípa ilẹ̀kùn débi tí àwọn tó wà lóde kò fi lè wọlé, ó sì mú agbára ìyọkúrò inú ọ̀rọ̀ náà hàn.
- source_word: ἔξω ἑστάναι
  choice: dúró lóde
  rationale: Ó ṣàfihàn ipò àwọn ẹni náà gẹ́gẹ́ bí ẹni tó dúró níta ilé.
- source_word: κρούειν τὴν θύραν
  choice: kan ilẹ̀kùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń kan ilẹ̀kùn láti pe àwọn tó wà nínú ilé.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ àṣà fún κύριος, ó sì pa ìró ìmọ̀-ẹ̀sìn inú Lúùkù mọ́, bó tilẹ̀ jẹ́ pé nínú àkàwé a tún lè lóye rẹ̀ gẹ́gẹ́ bí ‘Ọ̀gá.’
- source_word: ἄνοιξον ἡμῖν
  choice: ṣí ilẹ̀kùn fún wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘ilẹ̀kùn’ kò tún hàn nínú gbolohun Gíríìkì yìí, ohun tí wọ́n ní kí ó ṣí ni ilẹ̀kùn; fífi ọ̀rọ̀ náà sínú Yorùbá mú ẹ̀bẹ̀ náà ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Èmi kò mọ̀ yín, ibi tí ẹ ti wá
  rationale: 'Ìtumọ̀ yìí pa méjèèjì mọ́: ọ̀rọ̀ taara ‘kò mọ̀ yín’ àti gbólóhùn tó tẹ̀ lé e nípa ibi tí wọ́n ti wá, láì fi ipò tó ṣòro nínú Gíríìkì pamọ́.'
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ bá ìtumọ̀ àkọ́kọ́ àti lílò ọ̀rọ̀ náà jálẹ̀ Lúùkù mu; àlàyé ìsàlẹ̀ ojú ewé jẹ́wọ́ pé ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ sí ọ̀gá ilé nínú àkàwé náà.
- issue: Agbára οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Èmi kò mọ̀ yín, ibi tí ẹ ti wá
  alternative: Èmi kò mọ ibi tí ẹ ti wá
  rationale: A pa ὑμᾶς (‘yín’) mọ́ ní kedere, kí a má bàa dín agbára ìkọ̀sílẹ̀ náà kù tàbí sọ ọ́ di ìbéèrè nípa ibi ìbí nìkan; a tún pa ìṣòro ìbáṣepọ̀ àwọn gbólóhùn Gíríìkì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó yẹ. ‘Baálé ilé’ jẹ́ àdánidá ju ìtumọ̀ líle bí ‘olú ilé’ lọ; ‘ti ilẹ̀kùn mọ́’ sì mú ìdènà wọlé hàn kedere.
