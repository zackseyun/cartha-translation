  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn eroja pàtàkì Gíríìkì mọ́: baálé ilé, dídìde àti títì ilẹ̀kùn mọ́, dídúró lóde, kíkàn ilẹ̀kùn, ìpè náà, àti ìdáhùn ìkọ̀sílẹ̀ náà. Àtúnṣe kékeré ń jẹ́ kí ìtẹ̀lé àkókò ἀφ’ οὗ ἂν ... ἄρξησθε hàn kedere síi, ó sì tún sọ λέγοντες di gbólóhùn Yorùbá tó péye.'
  naturalness: ‘Tí ẹ ń kan ilẹ̀kùn pé’ kò rọrùn púpọ̀ nínú Yorùbá ìgbàlódé, nítorí pé ìpè tí wọ́n ń sọ nílò ìsopọ̀ tó hàn. ‘Tí ẹ ń kan ilẹ̀kùn, tí ẹ sì ń wí pé’ jẹ́ àdánidá, ó sì pa ìṣe méjèèjì mọ́. Fífi ‘baálé ilé náà’ sí iwájú ‘yóò dá yín lóhùn’ tún mú ẹni tó ń sọ̀rọ̀ hàn gbangba lẹ́yìn ọ̀rọ̀ àwọn tó dúró lóde.
