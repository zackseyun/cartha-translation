  to: Nígbà tí baálé ilé bá ti dìde, tí ó sì ti ilẹ̀kùn mọ́[a], ẹ̀yin yóò bẹ̀rẹ̀ sí í dúró lóde, tí ẹ ń kan ilẹ̀kùn, tí ẹ sì ń wí pé, ‘Olúwa[b], ṣí ilẹ̀kùn fún wa,’ baálé ilé náà yóò dá yín lóhùn pé, ‘Èmi kò mọ̀ yín, ibi tí ẹ ti wá[c].’
