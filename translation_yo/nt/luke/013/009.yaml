id: LUK.13.9
reference: Luke 13:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: yo
  text: Bí ó bá sì so èso ní àkókò tí ń bọ̀—ó dára; ṣùgbọ́n bí kò bá so èso[a], ìwọ yóò gé e lulẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́dún tó ń bọ̀.” Àwọn ìtumọ̀ kan fi àkókò tó ṣe pàtó yìí kún un láti inú ẹsẹ tó ṣáájú; ṣùgbọ́n ní ti gidi, Gíríìkì ní “fún ọjọ́ iwájú” tàbí “ní àkókò tí ń bọ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: Bí ó bá sì
  rationale: Ó pa ìsopọ̀ καί mọ́ pẹ̀lú ‘sì,’ ó sì fi ipò àdéhùn tí ἐάν ń tọ́ka sí hàn ní Yorùbá àdánidá. Ìyàtọ̀ μέν...δέ farahàn nípasẹ̀ ‘ṣùgbọ́n’ nínú abala kejì.
- source_word: ποιήσῃ καρπὸν
  choice: so èso
  rationale: ‘So èso’ ni ọ̀rọ̀ Yorùbá àdánidá fún bí igi ṣe ń mú èso jáde, ó sì pa àwòrán iṣẹ́ àgbẹ̀ inú Gíríìkì mọ́.
- source_word: εἰς τὸ μέλλον
  choice: ní àkókò tí ń bọ̀
  rationale: Èyí tẹ̀ lé ìtumọ̀ gbooro ti ‘fún ọjọ́ iwájú’ tàbí ‘ní àkókò tí ń bọ̀,’ láì fi ‘lọ́dún tó ń bọ̀’ sínú ọ̀rọ̀ gẹ́gẹ́ bí ẹni pé Gíríìkì sọ ọdún kan ní pàtó.
- source_word: εἰ δὲ μήγε
  choice: ṣùgbọ́n bí kò bá so èso
  rationale: Ó mú ìtakora δέ àti àìṣẹ̀lẹ̀ ohun tí a mẹ́nu kàn tẹ́lẹ̀ yé kedere ní Yorùbá; a tún ‘so èso’ sọ nítorí pé èyí dára ju fífi gbolohun náà sílẹ̀ ní àìpé lọ ní Yorùbá.
- source_word: ἐκκόψεις αὐτήν
  choice: ìwọ yóò gé e lulẹ̀
  rationale: ‘Gé e lulẹ̀’ bá àwòrán gígé igi tí kò so èso mu, ‘ìwọ yóò’ sì pa ẹni kejì ẹyọ àti ìtọ́ka ọjọ́ iwájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ àkókò nínú ìdádúró ìdájọ́ olówó ọgbà
  choice: ní àkókò tí ń bọ̀
  alternative: lọ́dún tó ń bọ̀
  rationale: Ọ̀rọ̀ Gíríìkì ẹsẹ yìí kò sọ ọdún kan ní pàtó. Ìtumọ̀ gbooro yìí pa àdéhùn inú àkàwé àti ìkìlọ̀ nípa ìdájọ́ tí a dá dúró ṣùgbọ́n tí ó ṣì lè dé mọ́, láì mú àkókò náà ṣe pàtó ju ẹ̀rí ọ̀rọ̀ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbo ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. Gbólóhùn ‘ó dára’ ń jẹ́ kí ìtumọ̀ àkùdé inú Gíríìkì ṣe kedere ní Yorùbá láì yanjú àìpé ọ̀rọ̀ náà ju bó ṣe yẹ lọ.
