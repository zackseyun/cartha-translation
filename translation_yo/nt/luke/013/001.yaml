id: LUK.13.1
reference: Luke 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: yo
  text: Ní àkókò yẹn gan-an, àwọn kan wà níbẹ̀ tí wọ́n ń ròyìn fún un nípa àwọn ará Gálílì tí Pílátù da ẹ̀jẹ̀ wọn pọ̀ mọ́ àwọn ẹbọ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Pílátù pò ẹ̀jẹ̀ wọn mọ́ àwọn ẹbọ wọn.”
    reason: Àṣàyàn ọ̀rọ̀ míì fún ἔμιξεν μετὰ; “pò ... mọ́” jẹ́ ọ̀nà Yorùbá mìíràn láti sọ pé a da ohun kan pọ̀ mọ́ ohun mìíràn.
lexical_decisions:
- source_word: Παρῆσαν
  choice: àwọn kan wà níbẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ àìpé (imperfect) ti πάρειμι, ó sì ń fi hàn pé àwọn ènìyàn kan wà níbẹ̀, kì í ṣe dandan pé wọ́n ṣẹ̀ṣẹ̀ dé.
- source_word: δέ
  choice: a fi ìyípadà ọ̀rọ̀ náà hàn nípasẹ̀ ìṣètò gbólóhùn, láì fi ọ̀rọ̀ míì kún un
  rationale: δέ jẹ́ àmì ìyípadà kékeré nínú ìtàn. Ní Yorùbá, gbólóhùn àkókò ní ìbẹ̀rẹ̀ mú ìyípadà náà jáde lọ́nà àdánidá, láì nílò ‘ṣùgbọ́n’ tàbí ‘nígbà náà,’ èyí tí ó lè mú ìtumọ̀ tí kò sí nínú orísun wọlé.
- source_word: τινες
  choice: àwọn kan
  rationale: Èyí pa ìtumọ̀ ọ̀pọ̀ ènìyàn tí a kò dárúkọ mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: ní àkókò yẹn gan-an
  rationale: ‘Gan-an’ ń pa agbára αὐτῷ mọ́, ó sì tọ́ka sí àkókò pàtó kan náà pẹ̀lú ohun tó ṣáájú.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: tí wọ́n ń ròyìn fún un
  rationale: Àpólà aláìpé yìí ṣàlàyé ohun tí àwọn tó wà níbẹ̀ ń ṣe; ‘ń ròyìn fún un’ pa ìtumọ̀ fífi ìròyìn tàbí ìṣẹ̀lẹ̀ kan tó ṣẹlẹ̀ tó ẹnì kan létí mọ́.
- source_word: περὶ τῶν Γαλιλαίων
  choice: nípa àwọn ará Gálílì
  rationale: περί pẹ̀lú genitive fi kókó ìròyìn hàn; ‘nípa’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ὧν τὸ αἷμα
  choice: tí ... ẹ̀jẹ̀ wọn
  rationale: Ìṣètò Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ ìbátan ohun-ìní tí Greek fi ὧν hàn.
- source_word: Πιλᾶτος
  choice: Pílátù
  rationale: A kọ orúkọ náà gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἔμιξεν
  choice: da ... pọ̀ mọ́
  rationale: ‘Da X pọ̀ mọ́ Y’ túmọ̀ míγνυμι ní Yorùbá òde òní lọ́nà tó ṣe kedere, láì ṣàfikún bí ìṣẹ̀lẹ̀ náà ṣe wáyé.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: mọ́ àwọn ẹbọ wọn
  rationale: ‘Àwọn ẹbọ wọn’ pa αὐτῶν mọ́, ó sì fi sílẹ̀ láì pinnu bóyá wọ́n mú ẹbọ náà wá tàbí wọ́n ń rú wọn nígbà náà.
theological_decisions:
- issue: Agbára ìtàn àti ìwà búburú inú ohun tí Pílátù ṣe
  choice: A túmọ̀ ọ̀rọ̀ náà tààrà pé Pílátù da ẹ̀jẹ̀ àwọn ará Gálílì pọ̀ mọ́ àwọn ẹbọ wọn.
  alternative: Kí a ṣàlàyé rẹ̀ sí i pé ‘ó pa wọ́n nígbà tí wọ́n ń rú ẹbọ.’
  rationale: Ẹsẹ yìí kò sọ bí ìṣẹ̀lẹ̀ náà ṣe wáyé tàbí ìtumọ̀ rẹ̀ nípa ẹ̀kọ́ ìgbàgbọ́. Ìtumọ̀ náà pa ọ̀rọ̀ líle orísun mọ́, kò sì fi àlàyé tí kò hàn gbangba nínú Greek kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa ìbẹ̀rẹ̀ àkókò mọ́ láti fi ìbáṣepọ̀ pẹ̀lú àyíká tó ṣáájú hàn, láì ṣàfikún àmì ìjíròrò tí Greek kò sọ ní tààrà.
