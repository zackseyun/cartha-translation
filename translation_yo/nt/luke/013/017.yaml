  to: Bí ó sì ti ń sọ àwọn nǹkan wọ̀nyí, ojú ń ti gbogbo àwọn tí ń tako rẹ̀[a], gbogbo ogunlọ́gọ̀ náà sì ń yọ̀ nítorí gbogbo àwọn ohun ológo tí ó ń ṣe.[b]
  rationale: A tún «ohun ológo» ṣe sí «àwọn ohun ológo» láti pa ọ̀pọ̀ Gíríìkì mọ́ ní kedere. A sì tún akọsilẹ̀ [b] ṣe kí ó jẹ́ Yorùbá àdánidá, kí ó sì pa ìtumọ̀ gbòòrò ἐνδόξοις mọ́ láìdín un kù sí iṣẹ́ ìyanu nìkan.
