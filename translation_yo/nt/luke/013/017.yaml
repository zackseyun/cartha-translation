  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: yo
  text: Bí ó sì ti ń sọ àwọn nǹkan wọ̀nyí, ojú ń ti gbogbo àwọn tí ń tako rẹ̀[a], gbogbo ogunlọ́gọ̀ náà sì ń yọ̀ nítorí gbogbo àwọn ohun ológo tí ó ń ṣe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé “gbogbo àwọn alátakò rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé “gbogbo àwọn ohun àgbàyanu” tàbí “gbogbo àwọn ohun títayọ.” Ọ̀rọ̀ Gíríìkì náà sọ pé “àwọn ohun ológo,” gbólóhùn gbòòrò tí ó lè kan àwọn iṣẹ́ agbára rẹ̀ pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Bí ó sì ti ń sọ àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ àti ìgbà-kan-náà mọ́ nínú genitive absolute náà, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: κατῃσχύνοντο
  choice: ojú ń ti
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí fi ipò ìtìjú tí ó ń bá a lọ hàn. Ó bá àárín ìtumọ̀ passive/middle Gíríìkì mu láìfi ẹni tí ó ń fa ìtìjú náà kún ọ̀rọ̀.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: àwọn tí ń tako rẹ̀
  rationale: Ó pa agbára ìṣe participle náà àti ìtakò tí ń lọ lọ́wọ́ mọ́ ju orúkọ ṣókí bíi “àwọn alátakò rẹ̀” lọ.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo ogunlọ́gọ̀ náà
  rationale: Ó sọ ọ̀pọ̀ ènìyàn tí ó péjọ gẹ́gẹ́ bí àwùjọ kan, ní èdè Yorùbá tí ó bójú mu.
- source_word: ἔχαιρεν
  choice: ń yọ̀
  rationale: Àmì ìṣe ń fi imperfect Gíríìkì hàn gẹ́gẹ́ bí ayọ̀ tí ń bá a lọ.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: nítorí gbogbo ohun ológo
  rationale: “Nítorí” sọ ohun tí ayọ̀ wọn dá lé, “ohun ológo” sì pa ìtumọ̀ gbòòrò ἔνδοξος mọ́ láìdín in kù sí iṣẹ́ ìyanu nìkan.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: tí ó ń ṣe
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ àti iṣẹ́ tí Jésù fúnra rẹ̀ ń ṣe hàn ní ọ̀nà Yorùbá àdánidá.
theological_decisions:
- issue: Irú àwọn “ohun ológo” náà
  choice: Fi ọ̀rọ̀ náà sílẹ̀ ní gbòòrò gẹ́gẹ́ bí “gbogbo ohun ológo.”
  alternative: “Gbogbo iṣẹ́ ìyanu” tàbí “gbogbo ohun àgbàyanu.”
  rationale: Àyíká ọ̀rọ̀ ní ìwòsàn kan nínú, ṣùgbọ́n ἔνδοξος fúnra rẹ̀ kò dín ohun tí ó ń tọ́ka sí kù sí iṣẹ́ ìyanu. Ìtumọ̀ gbòòrò pa àìdánilójú tó wà nínú orísun mọ́.
- issue: Ẹni tí ó ṣe àwọn iṣẹ́ náà nínú ὑπ’ αὐτοῦ
  choice: “tí ó ń ṣe,” tí ó fi iṣẹ́ náà lé Jésù lọ́wọ́ ní tààrà.
  alternative: “tí ó ń ṣẹlẹ̀ nípasẹ̀ rẹ̀.”
  rationale: ὑπό pẹ̀lú genitive ń tọ́ka sí aṣojú olùṣe ní tààrà; ìtumọ̀ yìí kò sọ ọ́ di irinṣẹ́ aláìtààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ó ní ọlá ṣùgbọ́n ó ṣì ṣeé lóye fún òǹkàwé òde òní. “Ogunlọ́gọ̀” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún àwùjọ ènìyàn púpọ̀, “ojú ń ti” sì jẹ́ àkójọpọ̀ ọ̀rọ̀ àdánidá fún ipò ìtìjú.
