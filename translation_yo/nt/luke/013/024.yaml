id: LUK.13.24
reference: Luke 13:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: yo
  text: “Ẹ sapá láti gba ilẹ̀kùn tóóró[a] wọlé, nítorí ọ̀pọ̀ ènìyàn, mo sọ fún yín, yóò wá ìwọlé, wọn kì yóò sì lè wọlé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba ẹnubodè tóóró wọlé.” Ọ̀rọ̀ Gíríìkì tí Lúùkù lò ni “ilẹ̀kùn” (θύρα), nígbà tí ẹsẹ tó jọ èyí nínú Mátíù lo “ẹnubodè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Ẹ sapá
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè ìsapá gidigidi. ‘Ẹ sapá’ jẹ́ èdè Yorùbá àdánidá tó pa agbára àti ìjẹ́kánjú ọ̀rọ̀ Gíríìkì mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: εἰσελθεῖν
  choice: láti … wọlé
  rationale: ‘Wọlé’ túmọ̀ ìwọlé ní kedere, ó sì bá ọ̀rọ̀ nípa ẹnu ọ̀nà mu. A lò ó ní ìbámu pẹ̀lú ìṣẹ̀lẹ̀ méjèèjì nínú ẹsẹ náà.
- source_word: διὰ τῆς στενῆς θύρας
  choice: gba ẹnu ọ̀nà tóóró … wọlé
  rationale: θύρα túmọ̀ sí ẹnu ọ̀nà ní pàtàkì, kì í ṣe ẹnubodè; ‘tóóró’ sì fi ààyè tí kò fẹ̀ hàn. ‘Gba … wọlé’ jẹ́ ìṣètò ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ọ̀rọ̀ náà ń mú ìdí fún àṣẹ tó ṣáájú wá; ‘nítorí’ pa ìbáṣepọ̀ ìdí náà mọ́.
- source_word: πολλοί
  choice: ọ̀pọ̀ ènìyàn
  rationale: Àpèjúwe náà dúró fún àwọn ènìyàn; fífi ‘ènìyàn’ hàn jẹ́ kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣeé lóye fún gbólóhùn àsọyé náà.
- source_word: ζητήσουσιν
  choice: yóò wá ọ̀nà
  rationale: ‘Wá ọ̀nà láti’ fi ìwá àti ìgbìyànjú hàn láì sọ ọ́ di ọ̀rọ̀ kan náà pẹ̀lú ‘Ẹ sapá,’ nítorí Gíríìkì náà lo ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: οὐκ ἰσχύσουσιν
  choice: wọn kì yóò lè wọlé
  rationale: Ní àyíká yìí ἰσχύω túmọ̀ sí ní agbára tàbí agbára-ṣe láti mú ohun kan ṣẹ. ‘Kì yóò lè wọlé’ jẹ́ kedere, ó sì tún ohun tí wọn kò lè ṣe sọ láti yẹra fún àìdánilójú.
theological_decisions:
- issue: Ìsapá ènìyàn àti èdè ìgbàlà
  choice: A pa àṣẹ alágbára náà mọ́ gẹ́gẹ́ bí ‘Ẹ sapá,’ láì rọ ọ́ àti láì fi àlàyé nípa iṣẹ́, ẹ̀tọ́, tàbí ọ̀nà ìgbàlà kún un.
  alternative: Ẹ ṣe gbogbo ohun tí ẹ lè ṣe láti wọlé; Ẹ gbìyànjú láti wọlé.
  rationale: Ẹsẹ náà fúnra rẹ̀ pàṣẹ pé kí ènìyàn sapá tọkàntọkàn, ó sì kìlọ̀ pé ọ̀pọ̀ yóò wá láti wọlé ṣùgbọ́n wọn kì yóò lè ṣe bẹ́ẹ̀. Ìtumọ̀ náà pa ìforígbárí yìí mọ́ láì yanju àríyànjiyàn nípa ọlá Ọlọ́run, ojúṣe ènìyàn, tàbí iṣẹ́ tí ń mú ènìyàn yẹ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, àti kedere fún òǹkàwé òde òní; ‘ẹnu ọ̀nà’ ni a yàn dípò ‘ẹnubodè’ láti tẹ̀lé θύρα.
