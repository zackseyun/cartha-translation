revisions:
- from: “Ẹ sapá láti gba ẹnu ọ̀nà tóóró[a] wọlé, nítorí mo sọ fún yín pé, ọ̀pọ̀ ènìyàn yóò wá ọ̀nà láti wọlé, ṣùgbọ́n wọn kì yóò lè wọlé.”
  to: “Ẹ sapá láti gba ilẹ̀kùn tóóró[a] wọlé, nítorí ọ̀pọ̀ ènìyàn, mo sọ fún yín, yóò wá ìwọlé, wọn kì yóò sì lè wọlé.”
  rationale: Àtúnṣe náà yọ ‘ọ̀nà’ kúrò nínú gbólóhùn kejì kí ó má bàa ṣàfikún èrò ‘wíwá ọgbọ́n/ọ̀nà’ sí ζητεῖν εἰσελθεῖν. Ó tún lo ‘ilẹ̀kùn’ fún θύρα, ní ìbámu pẹ̀lú ìpinnu ìtumọ̀ Gíríìkì àti àlàyé tó fi í yà kúrò ní ‘ẹnubodè.’ ‘Sì’ ń so àwọn gbólóhùn ọjọ́ iwájú méjèèjì pọ̀ gẹ́gẹ́ bí καί, láì sọ ọ́ di ìtakora tó lágbára ju.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:56Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa àṣẹ ‘Ẹ sapá’ àti ìkìlọ̀ nípa àìní agbára láti wọlé mọ́. Síbẹ̀, ‘wá ọ̀nà láti wọlé’ ṣàfikún ‘ọ̀nà,’ ohun tí kò sí nínú ζητήσουσιν εἰσελθεῖν; ọ̀rọ̀ Gíríìkì náà ní pé wọ́n yóò ‘wá ìwọlé’/‘wá láti wọlé.’ ‘Ẹnu ọ̀nà’ tún lè tọ́ka sí ẹnu-ọ̀nà tàbí ọ̀nà ìwọlé ní gíga, níbi tí θύρα ti jẹ́ ‘ilẹ̀kùn’ ní pàtó.
  naturalness: ‘Ẹ sapá láti gba ilẹ̀kùn tóóró wọlé’ jẹ́ Yorùbá boṣewa tó ṣe kedere. ‘Wá ìwọlé’ jẹ́ ọ̀nà kúkúrú, tó bójú mu láti fi ìtumọ̀ ‘seek to enter’ hàn láì ṣàfikún ohun tí wọ́n ń wá.
  terminology: A tún ‘θύρα’ ṣe sí ‘ilẹ̀kùn,’ tí ó ya sọ́tọ̀ ní kedere kúrò ní ‘ẹnubodè’ (πύλη ní Mátíù). Àmì àlàyé náà jẹ́ kí ìyàtọ̀ ọ̀rọ̀ náà hàn. A kò fi ẹ̀kọ́ ìjọ kankan kún àṣẹ ìsapá náà.
  issues:
  - severity: medium
    issue: ‘yóò wá ọ̀nà láti wọlé’
    rationale: Èyí túmọ̀ sí wíwá ọ̀nà tàbí ọgbọ́n láti wọlé, ṣùgbọ́n Gíríìkì sọ pé ọ̀pọ̀ yóò wá ìwọlé/láti wọlé. ‘Ọ̀nà’ jẹ́ àfikún tí kò ní ìpìlẹ̀ nínú ọ̀rọ̀ ìpilẹ̀.
  - severity: low
    issue: ‘ẹnu ọ̀nà’ fún θύρα
    rationale: Ọ̀rọ̀ náà lè gbà, ṣùgbọ́n ‘ilẹ̀kùn’ jẹ́ ìtumọ̀ tó péye jù fún θύρα (‘door’) àti pé ó ń pa ìyàtọ̀ rẹ̀ mọ́ kúrò ní ‘ẹnubodè’ (‘gate’).
