id: LUK.13.14
reference: Luke 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: yo
  text: Ṣùgbọ́n olórí sínágọ́gù náà dáhùn, inú bí i nítorí pé Jésù mú ènìyàn láradá ní ọjọ́ Sábáàtì, ó sì sọ fún àwọn ènìyàn pé, “Ọjọ́ mẹ́fà ni ó wà tí a gbọ́dọ̀ fi ṣiṣẹ́; nítorí náà, ẹ wá ní àwọn ọjọ́ wọ̀nyẹn kí a mú yín láradá, kì í ṣe ní ọjọ́ Sábáàtì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè sọ ọ́ ní ọ̀nà Yorùbá tó rọrùn sí i pé: “Ọjọ́ mẹ́fà ni a fi ń ṣiṣẹ́; ẹ wá ní àwọn ọjọ́ wọ̀nyẹn kí a mú yín láradá, kì í ṣe ní ọjọ́ Sábáàtì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ṣùgbọ́n ... dáhùn
  rationale: “Ṣùgbọ́n” fi ìyípadà oníjàngbọ̀n sí ìwòsàn tó ṣáájú hàn; “dáhùn” sì pa iṣẹ́ ọ̀rọ̀ ἀποκριθεὶς mọ́ bí ìfèsì, bó tilẹ̀ jẹ́ pé kò sí ìbéèrè tààrà.
- source_word: ὁ ἀρχισυνάγωγος
  choice: olórí sínágọ́gù náà
  rationale: Ó túmọ̀ sí ẹni tó ń bójú tó àwọn ọ̀ràn sínágọ́gù, láìfi àṣẹ ìjọba sí ọ̀rọ̀ náà.
- source_word: ἀγανακτῶν
  choice: inú bí i
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì fi ìbínú líle hàn láìṣe àfikún ìdájọ́ onítúmọ̀.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: nítorí pé Jésù mú ènìyàn láradá ní ọjọ́ Sábáàtì
  rationale: “Nítorí pé” fi ìtumọ̀ ìdí ti ὅτι hàn; “mú ènìyàn láradá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún θεραπεύω ní àyíká yìí. “Ènìyàn” kò sọ akọ tàbí abo, ó sì tọ́ka sí ìwòsàn tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: ó sì sọ fún àwọn ènìyàn
  rationale: Ìṣe àìparí Gíríìkì kò pọn dandan kí a tú sí ọ̀rọ̀ tó ń ṣẹlẹ̀ lọ́wọ́ ní Yorùbá; “sọ” jẹ́ ìtàn àdánidá. “Àwọn ènìyàn” dúró fún ogunlọ́gọ̀ tó péjọ.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Ọjọ́ mẹ́fà ni ó wà tí a gbọ́dọ̀ fi ṣiṣẹ́
  rationale: Ó pa èrò ọjọ́ mẹ́fà àti agbára dandan/ojúṣe inú δεῖ mọ́, ní èdè Yorùbá tó ṣe déédéé.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: nítorí náà, ẹ máa wá ní àwọn ọjọ́ wọ̀nyẹn kí a lè mú yín láradá
  rationale: “Nítorí náà” pa ìyọrísí οὖν mọ́; àkópọ̀ “ẹ máa wá ... kí a lè mú yín láradá” sọ ìlànà náà ní Yorùbá àdánidá, láìsọ ẹni tó máa ṣe ìwòsàn ní pàtó.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: kì í ṣe ní ọjọ́ Sábáàtì
  rationale: Ó pa ìyàtọ̀ tó lágbára mọ́ láàárín àwọn ọjọ́ mẹ́fà àti ọjọ́ Sábáàtì.
theological_decisions:
- issue: Bó ṣe yẹ kí a tú ọ̀rọ̀ olórí sínágọ́gù nípa iṣẹ́ àti ìwòsàn ní Sábáàtì
  choice: 'A gbé ọ̀rọ̀ rẹ̀ kalẹ̀ gẹ́gẹ́ bí àtakò tó dá lórí òye rẹ̀ nípa òfin: “Ọjọ́ mẹ́fà ni ó wà tí a gbọ́dọ̀ fi ṣiṣẹ́...”'
  alternative: Ṣíṣe àlàyé ọ̀rọ̀ náà ní ọ̀nà tó ti pè é ní alágàbàgebè tàbí tó ti dá a lẹ́bi nínú ẹsẹ yìí fúnra rẹ̀.
  rationale: Ẹsẹ náà ń ròyìn ojú ìwòye olórí sínágọ́gù; kò fìdí ojú ìwòye náà múlẹ̀ gẹ́gẹ́ bí ìdájọ́ Ọlọ́run. Ìtumọ̀ náà pa ìforígbárí inú ìtàn mọ́ láìṣe àfikún ẹ̀kọ́ ẹ̀sìn.
- issue: Ẹni tó ń ṣe ìwòsàn nínú θεραπεύεσθε
  choice: “kí a lè mú yín láradá,” èyí tí kò dárúkọ aṣojú ìwòsàn ní pàtó
  alternative: “kí Jésù lè mú yín láradá” tàbí “kí ẹ lè gba ìwòsàn”
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ palolo, kò sì dárúkọ ẹni tó ń ṣe iṣẹ́ náà. Yíyẹra fún fífi “Jésù” kún un pa àìsọ ẹni náà mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. “Sínágọ́gù” àti “Sábáàtì” jẹ́ àwọn ọ̀rọ̀ Bíbélì tí a ti fara mọ́ Yorùbá; àkọ́kọ́ jẹ́ kékèké gẹ́gẹ́ bí orúkọ ibi, èkejì sì jẹ́ orúkọ ọjọ́ pàtó.
