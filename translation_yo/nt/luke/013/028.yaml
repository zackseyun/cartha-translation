id: LUK.13.28
reference: Luke 13:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: yo
  text: Ní ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà[a], nígbà tí ẹ bá rí Abrahamu, Isaaki, Jakọbu àti gbogbo àwọn wòlíì nínú ìjọba Ọlọ́run, ṣùgbọ́n tí a ń lé ẹ̀yin fúnra yín síta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹkún àti ìpayínkeke eyín.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé a ń fi agbára lé wọn jáde, kí wọn sì wà níta.
    reason: lexical_emphasis
lexical_decisions:
- source_word: ἐκεῖ
  choice: Ní ibẹ̀
  rationale: Ọ̀rọ̀ atọ́ka ibi yìí tọ́ka sí ibi ìyasọ́tọ̀ àti ìdájọ́; “ní ibẹ̀” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtọ́kasí ibi náà mọ́.
- source_word: ὁ κλαυθμὸς
  choice: ẹkún
  rationale: “Ẹkún” túmọ̀ ìsọkún tàbí ì pohùnréré nínú ìbànújẹ́, láìfi ìtumọ̀ tí ó ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá àwòrán Gíríìkì ti pípa eyín pọ̀ nínú ìrora tàbí ìbínú mu.
- source_word: ὅταν ὄψησθε
  choice: nígbà tí ẹ bá rí
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú kan; ìlò “bá” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: πάντας τοὺς προφήτας
  choice: gbogbo àwọn wòlíì
  rationale: Ó pa “gbogbo” tí ó wà nínú Gíríìkì mọ́, ó sì lo ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún àwọn wòlíì.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: nínú ìjọba Ọlọ́run
  rationale: Ìtumọ̀ tààrà, tí ó mọ́gbọ́n dání, fún gbólóhùn pàtàkì “ìjọba Ọlọ́run.”
- source_word: ὑμᾶς δὲ
  choice: ṣùgbọ́n ... ẹ̀yin fúnra yín
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ hàn, “ẹ̀yin fúnra yín” sì mú ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì jáde.
- source_word: ἐκβαλλομένους ἔξω
  choice: tí a ń lé ... síta
  rationale: “Lé ... síta” pa agbára àti ìyasọ́tọ̀ tí ἐκβάλλω àti ἔξω ní mọ́; “ń” tún ṣàfihàn ìṣe tí participle náà gbé kalẹ̀.
theological_decisions:
- issue: Irú ìdájọ́ tí àwòrán ẹsẹ̀ náà ń tọ́ka sí
  choice: Pa àwòrán gidi ti ẹkún, ìpayínkeke àti lílé síta mọ́ láìsọ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò ṣàlàyé sí i.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí “ìdálẹ́bi ayérayé” tàbí “ìbànújẹ́ púpọ̀.”
  rationale: Ẹsẹ̀ náà fi ìyasọ́tọ̀ kúrò nínú ìjọba Ọlọ́run àti ìrora rẹ̀ hàn, ṣùgbọ́n kò ṣàlàyé gbogbo ẹ̀kọ́ nípa ìdájọ́ ìkẹyìn; nítorí náà a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹnumọ́ “ẹ̀yin fúnra yín” àti ìyàtọ̀ tó wà láàárín àwọn baba ńlá àti wòlíì nínú ìjọba Ọlọ́run, àti àwọn olùgbọ́ tí a ń lé síta, mọ́.
