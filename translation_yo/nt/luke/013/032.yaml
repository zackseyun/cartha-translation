revisions:
- from: Ó sì wí fún wọn pé, “Ẹ lọ sọ fún kọ̀lọ̀kọ̀lọ̀ yẹn pé, ‘Wò ó, mo ń lé àwọn ẹ̀mí èṣù jáde, mo sì ń mú ìwòsàn ṣẹ lónìí àti lọ́la; ní ọjọ́ kẹta, a ó sì mú mi dé òpin.’”[a]
  to: Ó sì wí fún wọn pé, “Ẹ lọ sọ fún kọ̀lọ̀kọ̀lọ̀ yẹn pé, ‘Wò ó, mo ń lé àwọn ẹ̀mí èṣù jáde, mo sì ń ṣe iṣẹ́ ìwòsàn lónìí àti lọ́la; ní ọjọ́ kẹta ni a mú mi dé òpin.’”[a]
  rationale: The revision improves idiomatic Yoruba for the healing clause and removes an explicit future auxiliary from the final passive clause, thereby more closely preserving the Greek present passive and its deliberate theological openness. It retains the original metaphor, sequence, register, and footnote anchor.
