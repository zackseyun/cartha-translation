id: LUK.13.32
reference: Luke 13:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ lọ sọ fún kọ̀lọ̀kọ̀lọ̀ yẹn pé, ‘Wò ó, mo ń lé àwọn ẹ̀mí èṣù jáde, mo sì ń ṣe iṣẹ́ ìwòsàn lónìí àti lọ́la; ní ọjọ́ kẹta ni a mú mi dé òpin.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi dé ibi àfojúsùn mi,” “a sọ mí di pípé,” tàbí “èmi parí ipa ọ̀nà mi.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí pé a mú ẹni dé ìparí; ó ṣeéṣe kí ó ń tọ́ka sí píparí iṣẹ́ tí a yàn fún Jesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: kọ̀lọ̀kọ̀lọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹranko kọ̀lọ̀kọ̀lọ̀ ní tààrà; fífi orúkọ ẹranko náà sílẹ̀ pa àkàwé àti ohùn ẹ̀gàn mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Àmì ọ̀rọ̀ yìí pe àfiyèsí sí ohun tí ó tẹ̀ lé e; ‘Wò ó’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa agbára ìtọ́kasí náà mọ́.
- source_word: ἐκβάλλω δαιμόνια
  choice: mo ń lé àwọn ẹ̀mí èṣù jáde
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún yíyọ àwọn ẹ̀mí èṣù kúrò lára ènìyàn, tí ó sì pa agbára ἐκβάλλω mọ́.
- source_word: ἰάσεις ἀποτελῶ
  choice: mo ń mú ìwòsàn ṣẹ
  rationale: ‘Mú ìwòsàn ṣẹ’ pa ìtumọ̀ ἀποτελῶ gẹ́gẹ́ bí mímú ohun kan ṣẹ tàbí dé àṣeyọrí mọ́, ó sì yàtọ̀ sí ọ̀rọ̀ ìṣe tó ṣáájú.
- source_word: σήμερον καὶ αὔριον
  choice: lónìí àti lọ́la
  rationale: Ìtumọ̀ tààrà yìí pa ìtọ́kasí àkókò méjèèjì mọ́, pẹ̀lú ṣíṣeéṣe pé ó ń tọ́ka sí àkókò kúkúrú tí a ti yàn.
- source_word: τῇ τρίτῃ
  choice: ní ọjọ́ kẹta
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti dative oníṣirò gẹ́gẹ́ bí ìtọ́kasí àkókò.
- source_word: τελειοῦμαι
  choice: a ó sì mú mi dé òpin
  rationale: Gbólóhùn yìí pa ohùn àìṣe ti Gíríìkì àti èrò mímú iṣẹ́ dé ìparí mọ́, láìsọ ní pàtó pé ó ń tọ́ka sí àjíǹde, ògo, tàbí ìpé ìwà.
theological_decisions:
- issue: Ìtumọ̀ τελειοῦμαι nípa iṣẹ́ tí a yàn fún Jesu àti bóyá ó ń tọ́ka sí ikú tàbí àjíǹde rẹ̀
  choice: a ó mú mi dé òpin
  alternative: èmi ó dé ibi àfojúsùn mi; a ó sọ mí di pípé; èmi ó parí ipa ọ̀nà mi
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí mímú iṣẹ́ Jesu dé ìparí, tí ó ṣeéṣe kí ikú àti ìdáláre rẹ̀ wà nínú rẹ̀, ṣùgbọ́n kò sọ àjíǹde ní pàtó. Ìtumọ̀ yìí pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi ìtumọ̀ tóóró kan lé e lórí.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Kọ̀lọ̀kọ̀lọ̀ yẹn’ pa demonstrative àti ohùn ẹ̀gàn mọ́; ‘a ó mú mi dé òpin’ jẹ́ ọ̀nà àdánidá láti pa passive àti àìdánilójú τελειοῦμαι mọ́.
