review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the demonstrative and disparaging animal metaphor, the twofold activity of expelling demons and effecting healings, the temporal sequence, and the passive/open-ended force of τελειοῦμαι. However, the explicit future auxiliary in the final clause is stronger than the Greek present form, even though the future sense is contextually natural.
  naturalness: The register is generally clear Standard Yoruba. ‘Mo ń mú ìwòsàn ṣẹ’ is understandable but less idiomatic and leaves the plural ἰάσεις underrepresented. ‘Mo ń ṣe iṣẹ́ ìwòsàn’ is more natural while preserving the distinct healing activity. ‘A mú mi dé òpin’ with the third-day temporal expression preserves the Greek present passive without unnecessarily specifying future morphology.
  terminology: ‘Kọ̀lọ̀kọ̀lọ̀ yẹn,’ ‘àwọn ẹ̀mí èṣù,’ and ‘ní ọjọ́ kẹta’ are appropriate. The footnote alternatives should correspond precisely to the revised main-text wording and should not introduce a more specific theological conclusion.
  issues:
  - severity: medium
    issue: The final clause uses the explicit future auxiliary ‘a ó’ for τελειοῦμαι.
    rationale: τελειοῦμαι is a present passive. The context may imply a future culmination, but an explicit future auxiliary narrows the grammatical form more than necessary. ‘Ní ọjọ́ kẹta ni a mú mi dé òpin’ is a natural Yoruba rendering that leaves the source expression’s temporal/aspectual openness intact.
  - severity: low
    issue: ‘Mo ń mú ìwòsàn ṣẹ’ represents plural ἰάσεις with a bare singular abstract noun and is somewhat stiff.
    rationale: ‘Mo ń ṣe iṣẹ́ ìwòsàn’ is idiomatic Yoruba and naturally denotes the ongoing performance of healings without conflating it with the preceding exorcisms.
  revised_text: Ó sì wí fún wọn pé, “Ẹ lọ sọ fún kọ̀lọ̀kọ̀lọ̀ yẹn pé, ‘Wò ó, mo ń lé àwọn ẹ̀mí èṣù jáde, mo sì ń ṣe iṣẹ́ ìwòsàn lónìí àti lọ́la; ní ọjọ́ kẹta ni a mú mi dé òpin.’”[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “èmi dé ibi àfojúsùn mi,” “a sọ mí di pípé,” tàbí “èmi parí ipa ọ̀nà mi.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí pé a mú ẹni dé ìparí; ó ṣeéṣe kí ó ń tọ́ka sí píparí iṣẹ́ tí a yàn fún Jesu.
    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic Yoruba for the healing clause and removes an explicit future auxiliary from the final passive clause, thereby more closely preserving the Greek present passive and its deliberate theological openness. It retains the original metaphor, sequence, register, and footnote anchor.
