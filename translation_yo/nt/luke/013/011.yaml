source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: yo
  text: Sì kíyèsí i, obìnrin kan wà tí ó ní ẹ̀mí àìlera[a] fún ọdún méjìdínlógún. Ara rẹ̀ sì tẹ̀ síwájú, kò sì lè nà ró pátápátá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí tí ń sọni di aláìlera.” Ọ̀rọ̀ Gíríìkì mẹ́nu kan “ẹ̀mí” ní tààrà; èyí lè tọ́ka sí ipa ẹ̀mí kan nínú ìpọ́njú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ọ̀rọ̀ yìí pe àfiyèsí olùkà sí ohun tí ó ṣẹ̀ṣẹ̀ fara hàn nínú ìtàn, ní èdè Yorùbá tí ó ṣe kedere tí kò sì jẹ́ àtijọ́ jù.
- source_word: γυνὴ
  choice: obìnrin kan
  rationale: Ó fi obìnrin tí a kò tíì dárúkọ wọ inú ìtàn lọ́nà àìnípàtó.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: tí ó ní ẹ̀mí àìlera
  rationale: Ó pa ọ̀rọ̀ Gíríìkì fún ‘ẹ̀mí’ mọ́, ó sì túmọ̀ ἀσθενείας gẹ́gẹ́ bí àìlera láì pinnu pé ó jẹ́ àìsàn lásán tàbí pé ẹ̀mí èṣù ni ní pàtó.
- source_word: ἔτη δεκαοκτώ
  choice: fún ọdún méjìdínlógún
  rationale: ‘Fún’ fi iye àkókò hàn lọ́nà àdánidá ní Yorùbá.
- source_word: συγκύπτουσα
  choice: Ó ti tẹ̀ síwájú
  rationale: Ó ṣàpèjúwe bí ara obìnrin náà ṣe tẹ̀ mọ́lẹ̀ ní kedere láì sọ pé ó tẹ̀ méjì, èyí tí yóò túmọ̀ ju orísun lọ.
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: kò sì lè nà ró pátápátá
  rationale: ‘Nà ró’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ẹni tí ó tẹ̀ lè tún dúró tààrà; ‘pátápátá’ pa ìtumọ̀ ìmúná ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ πνεῦμα ἀσθενείας láì yọ ìṣe ẹ̀mí kúrò tàbí fi ìtumọ̀ ẹ̀mí èṣù kún un
  choice: ẹ̀mí àìlera
  alternative: ẹ̀mí tí ń sọni di aláìlera; àìlera tí ẹ̀mí kan fà
  rationale: Gíríìkì mẹ́nu kan ‘ẹ̀mí’ ní tààrà, nítorí náà a pa á mọ́ nínú ọ̀rọ̀ pàtàkì. Síbẹ̀, a kò pè é ní ẹ̀mí èṣù, nítorí ẹsẹ yìí fúnra rẹ̀ kò sọ bẹ́ẹ̀ ní pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tí ó ní iyì, ṣùgbọ́n ó ṣì rọrùn fún àwọn òǹkàwé òde òní. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
