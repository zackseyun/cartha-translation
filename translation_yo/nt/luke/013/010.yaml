  text: Ἦν δὲ διδάσκων ἐν μιᾷ τῶν συναγωγῶν ἐν τοῖς σάββασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: yo
  text: Ó ń kọ́ni ní ọ̀kan lára àwọn sínágọ́gù ní ọjọ́ Ìsinmi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ọjọ́ Ìsinmi”; ọ̀rọ̀ Gíríìkì náà wà ní ìrísí ọ̀pọ̀, ṣùgbọ́n ó sábà máa ń ní ìtumọ̀ ẹyọ kan, “ọjọ́ Ìsinmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Ó ń kọ́ni
  rationale: Ìṣọ̀kan ἦν pẹ̀lú διδάσκων jẹ́ periphrastic imperfect, ó sì ń tọ́ka sí iṣẹ́ tí ó ń lọ ní àkókò àtijọ́. Àkópọ̀ ‘Ó ń kọ́ni’ ni ọ̀nà Yorùbá àdánidá láti fi ìṣe tí ó ń lọ nígbà náà hàn. A kò túmọ̀ δέ lọ́tọ̀, nítorí pé níbí ó kàn ń so ìtàn náà tẹ̀ síwájú, fífi ‘Ṣùgbọ́n’ tàbí ‘Nígbà náà’ sí i lè mú ìtumọ̀ tí kò sí nínú Gíríìkì wọlé.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: ní ọ̀kan lára àwọn sínágọ́gù
  rationale: Èyí pa ìtumọ̀ partitive náà mọ́, ‘ní ọ̀kan lára àwọn sínágọ́gù.’ A lo ‘sínágọ́gù’ gẹ́gẹ́ bí orúkọ ilé ìjọsìn Júù pàtó, dípò ọ̀rọ̀ gbogbogbò bí ‘ibi ìpàdé.’
- source_word: ἐν τοῖς σάββασιν
  choice: ní ọjọ́ Ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé σάββασιν jẹ́ plural ní ìrísí, ó sábà máa ń ṣiṣẹ́ gẹ́gẹ́ bí singular nínú Gíríìkì Koine. ‘Ní ọjọ́ Ìsinmi’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu; a fi plural náà sínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. ‘Ọjọ́ Ìsinmi’ ni a lò fún Sabbath, ‘sínágọ́gù’ sì pa àyíká ẹ̀sìn Júù mọ́.
