id: LUK.13.33
reference: Luke 13:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: yo
  text: Síbẹ̀, mo gbọdọ̀ tẹ̀síwájú nínú ìrìn mi lónìí, lọ́la, àti lọ́jọ́ tí ó tẹ̀ lé e,[a] nítorí kò ṣeé ṣe[b] kí wòlíì kan ṣègbé ní òde Jerusalẹmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà, “lónìí, lọ́la, àti lọ́jọ́ tí ó tẹ̀ lé e,” lè jẹ́ àṣà ọ̀rọ̀ tó ń tọ́ka sí ìgbésẹ̀ kúkúrú kan tí a ti pinnu, dípò ọjọ́ mẹ́ta gangan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “kò lè rí bẹ́ẹ̀,” tàbí, “kò ṣeé ronú pé wòlíì kan yóò ṣègbé ní òde Jerusalẹmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ tàbí àtúnṣe tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ní èdè Yorùbá àdánidá.
- source_word: δεῖ με
  choice: mo gbọdọ̀
  rationale: Ó pa ìtumọ̀ dandan mọ́ láìṣàlàyé bóyá dandan náà jẹ́ ti Ọlọ́run tàbí ti ipò ọ̀rọ̀.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: lónìí, lọ́la, àti lọ́jọ́ tí ó tẹ̀ lé e
  rationale: Ó pa ìtẹ̀síwájú àkókò mẹ́tẹ̀ẹ̀ta inú Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ó tún lè jẹ́ àṣà ọ̀rọ̀ fún àkókò kúkúrú kan tí a ti pinnu.
- source_word: πορεύεσθαι
  choice: máa bá ọ̀nà mi lọ
  rationale: Ó sọ ìrìn tàbí ìlọsíwájú tí kò dá dúró ní ọ̀nà àdánidá Yorùbá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí fún dandan tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: οὐκ ἐνδέχεται
  choice: kò ṣeé ṣe
  rationale: Ó pa ìtumọ̀ àìṣeéṣe tàbí ohun tí kò yẹ kí ó rí bẹ́ẹ̀ mọ́, láìfi ẹ̀gàn inú ọ̀rọ̀ náà hàn ju bí orísun ṣe ṣe lọ.
- source_word: προφήτην
  choice: wòlíì kan
  rationale: Ọ̀rọ̀ náà jẹ́ aláìní àtọ́ka, ó sì ń tọ́ka sí wòlíì ní gbogbogbòò.
- source_word: ἀπολέσθαι
  choice: ṣègbé
  rationale: Ó pa ìtumọ̀ fífẹ̀ ti píparun tàbí ikú mọ́, ó sì bá ìforígbárí ọ̀rọ̀ náà mu.
- source_word: ἔξω Ἰερουσαλήμ
  choice: ní òde Jerusalẹmu
  rationale: Ó jẹ́ ìtumọ̀ ààyè tó ṣe tààrà fún jíjẹ́ ní ẹ̀yìn odi tàbí níta ìlú Jerusalẹmu.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù pé wòlíì kò lè ṣègbé ní òde Jerusalẹmu
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àìṣeéṣe, ṣùgbọ́n a kò sọ ọ́ di ẹ̀kọ́ pé kò lè ṣẹlẹ̀ rárá ní gbogbo ipò.
  alternative: A lè túmọ̀ ọ́ pé ‘kò yẹ kí ó rí bẹ́ẹ̀’ tàbí ‘kò ṣeé ronú pé,’ láti mú ìfọ̀rọ̀jẹ́ tàbí ẹ̀gàn àsọtẹ́lẹ̀ náà hàn sí i.
  rationale: οὐκ ἐνδέχεται lè túmọ̀ sí ohun tí kò ṣeé ṣe, tí kò bófin mu, tàbí tí kò ṣeé gbà rò. Ìtumọ̀ yìí fi ìforígbárí àti ìfọ̀rọ̀jẹ́ tó ṣeé ṣe sílẹ̀ fún òǹkàwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóòórùn-ọ̀wọ̀ àti àdánidá ni a lò. A yan “wòlíì” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀, “ṣègbé” sì pa ìwọ̀n gíga àti ìtumọ̀ fífẹ̀ orísun mọ́. Àwọn àmì ẹsẹ̀-àlàyé wà lẹ́yìn àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
