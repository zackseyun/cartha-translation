id: LUK.13.18
reference: Luke 13:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: yo
  text: Nítorí náà, ó ń sọ pé, “Kí ni ìjọba Ọlọ́run[a] dà bí, kí sì ni èmi yóò fi wé e?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣàkóso Ọlọ́run,” èyí tí ó tẹnumọ́ bí Ọlọ́run ṣe ń ṣàkóso dípò ibi ìjọba kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ó ń sọ pé
  rationale: Ìṣe aláìparí náà lè tọ́ka sí ọ̀rọ̀ tí ó ń bá a lọ tàbí ọ̀nà ìtàn; ‘ó ń sọ pé’ pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí ìyọrísí hàn.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: Kí ni ... dà bí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè fún àfiwé.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó pa gbólóhùn pàtàkì tí a mọ̀ dáadáa mọ́, ó sì lè tọ́ka sí àṣẹ ìṣàkóso Ọlọ́run àti ibi tàbí àyíká tí ìṣàkóso náà dé.
- source_word: καὶ
  choice: kí sì ni
  rationale: ‘Sì’ so àwọn ìbéèrè méjèèjì pọ̀ ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: kí sì ni èmi yóò fi wé
  rationale: Ó ṣàfihàn ìbéèrè àròjinlẹ̀ ọjọ́ iwájú náà, ó sì lo àtẹ̀jáde Yorùbá àdánidá fún ‘fi ... wé’.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ gbólóhùn Bíbélì tí ó ti fìdí múlẹ̀, ó sì pa àwòrán ìjọba mọ́; àkọ́silẹ̀ ìsàlẹ̀ jẹ́ kí òǹkàwé rí ìtumọ̀ ìṣàkóso tàbí àṣẹ Ọlọ́run láìfi ọ̀kan ṣoṣo múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnṣe gírámà ‘kí ni ... fi wé’ jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé orísun Gíríìkì lo àpẹẹrẹ ‘sí kí ni’.
