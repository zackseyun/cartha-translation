  to: Ó sì dá wọn lóhùn pé, “Ṣé ẹ rò pé àwọn ará Gálílì wọ̀nyí di ẹlẹ́ṣẹ̀ ju gbogbo àwọn ará Gálílì lọ nítorí pé wọ́n jìyà àwọn nǹkan wọ̀nyí?”
