  naturalness: Yorùbá náà jẹ́ ti òde òní, ó sì rọrùn láti lóye. ‘Ó sì dá wọn lóhùn pé’ àti ‘Ṣé ẹ rò pé’ jẹ́ ọ̀nà àdánidá. Yíyọ ‘yòókù’ kúrò ń jẹ́ kí gbolohun náà sun mọ́ orísun láì dín ìfẹ̀hàn rẹ̀ kù.
