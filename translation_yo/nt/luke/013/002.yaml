  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: yo
  text: Ó sì dá wọn lóhùn pé, “Ṣé ẹ rò pé àwọn ará Gálílì wọ̀nyí di ẹlẹ́ṣẹ̀ ju gbogbo àwọn ará Gálílì lọ nítorí pé wọ́n jìyà àwọn nǹkan wọ̀nyí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó sì dá wọn lóhùn pé
  rationale: Ó mú àkópọ̀ ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘dáhùn, ó ní’ mọ́.
- source_word: ἁμαρτωλοὶ ... ἐγένοντο
  choice: di ẹlẹ́ṣẹ̀ ... ju ... lọ
  rationale: ‘Di’ ń ṣàfihàn ἐγένοντο ní tààrà, láì yí i sí ‘jẹ́’; ‘ju ... lọ’ sì mú ìfiwéra παρὰ jáde.
- source_word: πεπόνθασιν
  choice: wọ́n jìyà
  rationale: Ó ṣàfihàn pé ìṣẹ̀lẹ̀ búburú náà ti ṣẹlẹ̀ sí wọn; Yorùbá yìí jẹ́ kedere, ó sì bá àyíká ọ̀rọ̀ mu.
theological_decisions:
- issue: Bóyá ἐγένοντο yẹ kí a túmọ̀ sí ‘jẹ́’ tàbí ‘di’
  choice: di ẹlẹ́ṣẹ̀
  alternative: jẹ́ ẹlẹ́ṣẹ̀
  rationale: A pa agbára gangan ti ἐγένοντο (‘di/wá jẹ́’) mọ́, bó tilẹ̀ jẹ́ pé ìbéèrè náà lè ń tọ́ka sí bí ìjìyà wọn ṣe fi wọ́n hàn lójú àwọn ènìyàn, kì í ṣe dandan pé wọ́n ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í dẹ́ṣẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó lóye fún gbogbo ènìyàn, ó sì ní ọlá. ‘Ṣé ẹ rò pé’ jẹ́ ọ̀nà àdánidá fún ìbéèrè taara sí ọ̀pọ̀ ènìyàn.
