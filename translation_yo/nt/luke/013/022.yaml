id: LUK.13.22
reference: Luke 13:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: yo
  text: Ó ń la àwọn ìlú àti abúlé kọjá, ó ń kọ́ni, ó sì ń bá ìrìn àjò rẹ̀ lọ sí Jerúsálẹ́m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìhà Jerúsálẹ́m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: Ó ń la ... kọjá
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìrìn tí ó ń bá a lọ hàn; ‘ń la ... kọjá’ jẹ́ èdè Yorùbá àdánidá fún lílọ gba onírúurú ibi kọjá.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: àwọn ìlú àti abúlé
  rationale: κατά pẹ̀lú accusative níbí ní ìtumọ̀ pínpín káàkiri àwọn ibi; ‘ìlú àti abúlé’ pa ìyàtọ̀ àwọn ibùgbé ńlá àti kékeré mọ́.
- source_word: διδάσκων
  choice: ó ń kọ́ni
  rationale: Participle ìsinsìnyí ṣàpèjúwe ohun tí ó ń ṣe lẹ́gbẹ̀ẹ́ ìrìn àjò náà; gbolohun aláìpé ‘ó ń kọ́ni’ mú ìṣe tí ó ń bá a lọ jáde ní Yorùbá àdánidá.
- source_word: πορείαν ποιούμενος
  choice: ó sì ń bá ìrìn àjò rẹ̀ lọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe tàbí títẹ̀síwájú nínú ìrìn àjò; yíyan yìí fi ìlọsíwájú oníèrò hàn láìtumọ̀ ọ́ ní ọ̀rọ̀-lẹ́-ọ̀rọ̀ tí kò ní dùn.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́m
  rationale: εἰς sábà máa ń tọ́ka sí ibi tí ìrìn ń lọ; ‘sí’ lè túmọ̀ sí ‘lọ sí’ tàbí ‘ní ìhà sí’ nínú àyíká ìrìn tí kò tíì parí, nítorí náà ó pa ìwọ̀n àìdájú náà mọ́.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́m
  rationale: Orúkọ ibi náà ni a kọ ní ìlànà Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Ìtọ́sọ́nà ìrìn àjò Jésù sí Jerúsálẹ́m
  choice: sí Jerúsálẹ́m
  alternative: ní ìhà Jerúsálẹ́m
  rationale: Àyíká náà fi ìrìn tí ó ń bá a lọ hàn, kì í ṣe dídé; ‘sí’ jẹ́ èdè Yorùbá àdánidá tí ó lè sọ ibi-afẹ́ ìrìn náà láìfi dídé síbẹ̀ múlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò níbi tí ó bá yẹ; àtúnṣe gbolohun participle sí ‘ó ń ...’ jẹ́ kí ìṣe tí ó ń bá a lọ hàn ní ti ẹ̀dá Yorùbá.
