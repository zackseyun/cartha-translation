id: LUK.13.35
reference: Luke 13:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: yo
  text: Wò ó, a fi ilé yín sílẹ̀ fún yín.[a] Mo sì sọ fún yín pé, ẹ̀yin kì yóò rí mi rárá títí ọjọ́ náà yóò fi dé tí ẹ ó sọ pé,[b][c] ‘Ìbùkún ni fún ẹni tí ń bọ̀ ní orúkọ Olúwa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, ‘a pa ilé yín tì fún yín’ tàbí ‘a kọ ilé yín sílẹ̀ fún yín.’ Ìṣe aláìlórúkọ Gíríìkì lè ní ìtumọ̀ ìdájọ́ pé a ti fi í lé wọn lọ́wọ́. ‘Ilé yín’ ṣeé ṣe kí ó tọ́ka sí Jerúsálẹ́mù, pàápàá tẹ́ńpìlì rẹ̀, ṣùgbọ́n Gíríìkì sọ ‘ilé yín’ lásán.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: Àwọn kan lóye èyí gẹ́gẹ́ bí ìtọ́ka sí ìwọlé Jesu pẹ̀lú ayẹyẹ; àwọn mìíràn sì rí i gẹ́gẹ́ bí ìjẹ́wọ́ rẹ̀ ní ọjọ́ iwájú. Gíríìkì fúnra rẹ̀ kò pàṣẹ ìgbà kan ṣoṣo.
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ náà, ‘Ìbùkún ni fún ẹni tí ń bọ̀ ní orúkọ Olúwa,’ ń ṣe àtúnsọ Sáàmù 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí pe àfiyèsí sí ìkéde pàtàkì kan, ó sì jẹ́ ọ̀nà Yorùbá òde òní tí ó bójú mu fún ἰδοὺ.
- source_word: ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν
  choice: a fi ilé yín sílẹ̀ fún yín
  rationale: Ó pa ìṣe aláìlórúkọ inú èdè Gíríìkì mọ́, ó sì jẹ́ kí ‘ilé yín’ dúró láì fi ‘tẹ́ńpìlì’ tàbí ‘Jerúsálẹ́mù’ kún un.
- source_word: λέγω δὲ ὑμῖν
  choice: Mo sì sọ fún yín pé
  rationale: ‘Sì’ fi ìtẹ̀síwájú pẹ̀lú ìyàtọ̀ díẹ̀ tí δέ ní hàn ní Yorùbá àdánidá.
- source_word: οὐ μὴ ἴδητέ με
  choice: ẹ̀yin kì yóò rí mi rárá
  rationale: ‘Kì yóò ... rárá’ mú ìtakò ọjọ́ iwájú tó lágbára nínú οὐ μή jáde ní kedere.
- source_word: ἕως ἥξει ὅτε εἴπητε
  choice: títí àkókò yóò fi dé nígbà tí ẹ ó sọ pé
  rationale: Ó tú àkójọpọ̀ àsìkò Gíríìkì sí Yorùbá tí ó ṣe kedere, láì pinnu ìgbà ìṣẹ̀lẹ̀ náà ju ohun tí orísun sọ lọ.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Alábùkún-fún ni ẹni tí ń bọ̀
  rationale: Ó pa ìlànà ìbùkún àti ìró Sáàmù 118:26 mọ́; ‘ẹni tí ń bọ̀’ kò fi ipa mú un di orúkọ oyè kan.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Èyí ni ìtumọ̀ àdánidá ti àpólà náà, ó sì pa ọ̀rọ̀ ìwé mímọ́ tí a mọ̀ mọ́.
theological_decisions:
- issue: Ohun tí ‘ilé yín’ ń tọ́ka sí
  choice: A pa ‘ilé yín’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Tẹ́ńpìlì, Jerúsálẹ́mù, tàbí ilé/ìran Ísírẹ́lì.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí Jerúsálẹ́mù, pàápàá tẹ́ńpìlì rẹ̀, ṣùgbọ́n Gíríìkì sọ ‘ilé yín’ lásán; nítorí náà a kò dín ìtumọ̀ rẹ̀ kù nínú ọ̀rọ̀ pàtàkì.
- issue: Ìgbà tí àwọn olùgbọ́ yóò sọ ìbùkún ìkẹyìn
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a kò dá ìgbà rẹ̀ kan pàtó.
  alternative: Ìwọlé Jesu pẹ̀lú ayẹyẹ, ìjẹ́wọ́ ọjọ́ iwájú ti Jerúsálẹ́mù/Ísírẹ́lì, tàbí ìjẹ́wọ́ nígbà ìpadàbọ̀ Jesu.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò fi dandan mú ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí; a pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ẹ̀yin/yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ọ̀pọ̀ nínú Gíríìkì. Ọ̀rọ̀ náà pa ìrònú ìdájọ́ àti àìdánilójú nípa ‘ilé’ àti àkókò ìjẹ́wọ́ mọ́.
