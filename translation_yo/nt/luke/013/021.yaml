id: LUK.13.21
reference: Luke 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: yo
  text: Ó dàbí ìwúkàrà[a] tí obìnrin kan mú, tí ó sì fi pamọ́[b] sínú sàtà mẹ́ta ti ìyẹ̀fun[c], títí ìwúkàrà fi tàn ká gbogbo rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ń mú ìyẹ̀fun wú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a fi ń mú ìyẹ̀fun wú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “dà pọ̀ mọ́.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní gangan sí “fi pamọ́” tàbí “fi fara sin.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “sàtà mẹ́ta.” Sàtà jẹ́ òṣùwọ̀n ohun gbígbẹ̀ ní ayé àtijọ́; sàtà mẹ́ta jẹ́ ìyẹ̀fun púpọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία
  choice: Ó dàbí
  rationale: Ọ̀rọ̀ yìí ń bẹ̀rẹ̀ àfiwé; “Ó dàbí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àfiwé náà, ó sì fi ohun tí ẹsẹ tó ṣáájú ń sọ sílẹ̀ gẹ́gẹ́ bí ohun tí “Ó” ń tọ́ka sí.
- source_word: ζύμῃ
  choice: ìwúkàrà
  rationale: “Ìwúkàrà” ń tọ́ka sí ohun tí a fi ń mú ìyẹ̀fun wú, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rere tàbí búburú kún àwòrán náà.
- source_word: λαβοῦσα γυνὴ
  choice: tí obìnrin kan mú
  rationale: Ó yí participle aorist náà padà sí gbólóhùn àdánidá ní Yorùbá, láì pàdánù ìtẹ̀lé ìṣe náà.
- source_word: ἔκρυψεν
  choice: fi pamọ́
  rationale: Èyí pa ìtumọ̀ gangan ti “fipamọ́” tàbí “farapamọ́” mọ́; àlàyé ìsàlẹ̀ fi “dà pọ̀ mọ́” hàn gẹ́gẹ́ bí ìtumọ̀ tó bá iṣẹ́ ṣíṣe oúnjẹ mu.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: sínú sàtà mẹ́ta ti ìyẹ̀fun
  rationale: A pa orúkọ òṣùwọ̀n ìgbàanì náà mọ́ nítorí pé σάτα jẹ́ òṣùwọ̀n pàtó; àlàyé ìsàlẹ̀ ṣàlàyé rẹ̀ fún òǹkàwé òde òní.
- source_word: ἕως οὗ
  choice: títí
  rationale: “Títí” ni ọ̀nà Yorùbá tó rọrùn, tó sì péye fún àsopọ̀ àkókò náà.
- source_word: ἐζυμώθη ὅλον
  choice: títí gbogbo rẹ̀ fi ní ìwúkàrà
  rationale: Èyí pa ìtumọ̀ pé ìwúkàrà dé inú gbogbo àkójọpọ̀ náà mọ́, dípò lílo “wú” nìkan, èyí tí ó lè tọ́ka sí àbájáde dípò ìṣe jíjẹ́ kí gbogbo rẹ̀ ní ìwúkàrà.
theological_decisions:
- issue: Agbára àmì ìwúkàrà nínú òwe náà
  choice: A túmọ̀ ọ́ láì fi hàn pé àmì náà dára tàbí pé ó burú.
  alternative: Kí a túmọ̀ ìwúkàrà gẹ́gẹ́ bí àmì ibi, tàbí kí a ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìtànkálẹ̀ rere ti ìjọba Ọlọ́run.
  rationale: Ẹsẹ náà fúnra rẹ̀ fi àwòrán ìwúkàrà hàn ṣùgbọ́n kò sọ ní tààrà bóyá a gbọ́dọ̀ ka àmì náà sí rere tàbí búburú; ìtumọ̀ náà kò gbọ́dọ̀ yanju àríyànjiyàn yẹn fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A pa “fi pamọ́” àti “sàtà” mọ́ láti sún mọ́ ẹ̀rí Gíríìkì, a sì lo àlàyé ìsàlẹ̀ láti mú wọn yé ni kedere.
