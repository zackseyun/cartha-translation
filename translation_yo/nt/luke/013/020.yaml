reference: Luke 13:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: yo
  text: Ó sì tún sọ pé, “Kí ni èmi yóò fi ìjọba Ọlọ́run wé?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asopọ̀ ‘sì’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìbáṣepọ̀ ìtàn tí Καὶ ní mọ́, láìfi ìtumọ̀ àkókò kún un.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ sọ ìṣe àtúnṣe tàbí àtúnwí jáde ní kíkún, ó sì bá ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: εἶπεν
  choice: sọ pé
  rationale: ‘Sọ pé’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere fún fífi ọ̀rọ̀ tààrà bẹ̀rẹ̀.
- source_word: Τίνι
  choice: Kí ni ... fi ... wé
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ ὁμοιόω, Τίνι ń béèrè ohun tí a ó fi ṣe àfiwé, kì í ṣe ẹni kan; ìṣètò ‘Kí ni ... fi ... wé?’ ni Yorùbá àdánidá.
- source_word: ὁμοιώσω
  choice: èmi yóò ... wé
  rationale: ‘Yóò ... wé’ pa ìrísí ọjọ́ iwájú àti agbára ìbéèrè ìrònú inú ọ̀rọ̀ Gíríìkì mọ́; fífi ‘èmi’ hàn ń tẹnu mọ́ ẹni àkọ́kọ́ bí ọ̀rọ̀ ìpilẹ̀ ṣe rí.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ gbólóhùn Bíbélì tí a mọ̀ dáadáa, ó sì lè gba ìtumọ̀ ìṣàkóso Ọlọ́run àti àgbègbè ìjọba rẹ̀ láìdín un kù sí ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία nínú ọ̀rọ̀ nípa ìṣàkóso Ọlọ́run
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ pa ìfẹ̀sí ọ̀rọ̀ náà sí ìṣàkóso ọba àti ilẹ̀ tàbí àyíká ìjọba mọ́. ‘Ìṣàkóso Ọlọ́run’ ṣeé ṣe, ṣùgbọ́n ó lè dín ìtumọ̀ rẹ̀ kù sí iṣẹ́ ìṣàkóso nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ìṣètò àfiwé Yorùbá àdánidá ‘fi ... wé’.
