base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: yo
  text: Rárá, mo sọ fún yín; ṣùgbọ́n bí ẹ̀yin kò bá ronúpìwàdà, gbogbo yín ni yóò ṣègbé bákan náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo yín ni yóò ṣègbé ní ọ̀nà kan náà.” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “bákan náà” lè tọ́ka sí irú ìdájọ́ tí ó jọ èyí nínú àwọn ìṣẹ̀lẹ̀ tí a mẹ́nuba ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Rárá
  rationale: Ó jẹ́ ìdáhùn òdì tí ó lágbára sí ìbéèrè tí àyíká ọ̀rọ̀ ṣáájú mú wá; “Rárá” jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa ìlànà ọ̀rọ̀ Lúùkù mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: ṣùgbọ́n bí ẹ̀yin kò bá
  rationale: Ìtumọ̀ yìí mú ìyípadà ọ̀rọ̀ àti ipò àìní àyọkà náà jáde lọ́nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: μετανοῆτε
  choice: ronúpìwàdà
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí ìrònúpìwàdà níwájú Ọlọ́run, kì í ṣe ìyípadà èrò lásán; ó pa ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ è̩sìn kan pàtó kún un.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó fi hàn gbangba pé ìkìlọ̀ náà kan gbogbo àwọn tí Jésù ń bá sọ̀rọ̀.
- source_word: ὡσαύτως
  choice: bákan náà
  rationale: Ó pa ìfiwéra náà mọ́ láìpinnu bóyá ó ń tọ́ka sí ọ̀nà, ìdánilójú, tàbí ojijì ìdájọ́ náà.
- source_word: ἀπολεῖσθε
  choice: yóò ṣègbé
  rationale: “Ṣègbé” mú ìparun tàbí ìpàdánù tó le koko jáde, kò sì dín ìkìlọ̀ náà kù sí ikú ti ara nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìrònúpìwàdà nínú ìkìlọ̀ Jésù
  choice: ronúpìwàdà
  alternative: yí ọkàn yín padà; padà sí Ọlọ́run
  rationale: A pa ìpè sí ìrònúpìwàdà mọ́ láìdín in kù sí ìbànújẹ́ inú tàbí láìfi àlàyé ẹ̀kọ́ ìgbàlà kan pàtó lé e lórí.
- issue: Agbára ọ̀rọ̀ ὡσαύτως ἀπολεῖσθε
  choice: yóò ṣègbé bákan náà
  alternative: yóò ṣègbé ní ọ̀nà kan náà
  rationale: Ìtumọ̀ yìí pa ìfiwéra pẹ̀lú àwọn ìṣẹ̀lẹ̀ ṣáájú mọ́, ṣùgbọ́n kò fi tipátipá sọ ohun tí ìfiwéra náà dá lé lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin” láti jẹ́ kí ọ̀pọ̀ ènìyàn tí πάντες ń tọ́ka sí hàn kedere, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
