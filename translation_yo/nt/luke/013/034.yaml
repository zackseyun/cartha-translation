id: LUK.13.34
reference: Luke 13:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: yo
  text: “Jerúsálẹ́mù, Jerúsálẹ́mù, ìwọ tí ń pa àwọn wòlíì, tí o sì ń sọ àwọn tí a rán sí ọ ní òkúta[a]—ẹ̀ẹ̀melòó ni mo fẹ́ kó àwọn ọmọ rẹ jọ, gẹ́gẹ́ bí adìẹ ṣe ń kó àwọn ọmọ rẹ̀ jọ sábẹ́ ìyẹ́ rẹ̀[b], ṣùgbọ́n ẹ̀yin kò fẹ́!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwọ tí ó máa ń pa àwọn wòlíì, tí ó sì máa ń sọ àwọn tí a rán sí ọ ní òkúta.” Àwọn ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe Jerúsálẹ́mù nípa ìwà tí ó máa ń hù sí àwọn ìránṣẹ́ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ẹyẹ ṣe ń kó àwọn ọmọ rẹ̀ jọ sábẹ́ ìyẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì ὄρνις lè túmọ̀ sí ẹyẹ lápapọ̀, ṣùgbọ́n àwòrán ìyá tí ń kó àwọn ọmọ rẹ̀ jọ sábẹ́ ìyẹ́ mú “adìẹ” bá ọ̀rọ̀ yìí mu dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerúsálẹ́mù, Jerúsálẹ́mù
  rationale: A lo orúkọ ibi tí ó wọ́pọ̀ ní Yorùbá, a sì pa àtúnsọ náà mọ́ láti fi ẹkún àti ìtẹnumọ́ inú ọ̀rọ̀ ìpè hàn.
- source_word: ἡ ἀποκτείνουσα ... λιθοβολοῦσα
  choice: ìwọ tí ń pa ... tí o sì ń sọ ... ní òkúta
  rationale: Àwọn participle ti àsìkò ìsinsìnyí ṣàpèjúwe ìwà tí ó máa ń hàn nínú bí Jerúsálẹ́mù ṣe ń ṣe sí àwọn ìránṣẹ́ Ọlọ́run; “tí ń” mú agbára ìṣàpèjúwe yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τοὺς προφήτας
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ti fìdí múlẹ̀ fún àwọn wòlíì.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: àwọn tí a rán sí ọ
  rationale: Ó pa ohùn àìṣe (passive) mọ́, ó sì yí ẹni tí a ń bá sọ̀rọ̀ padà sí “ọ” ní ìbámu pẹ̀lú ìpè tààrà sí Jerúsálẹ́mù.
- source_word: ποσάκις
  choice: ẹ̀ẹ̀melòó
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún “ìgbà mélòó” nínú ẹkún ìbéèrè àsọyé.
- source_word: ἠθέλησα ... οὐκ ἠθελήσατε
  choice: mo fẹ́ ... ẹ̀yin kò fẹ́
  rationale: Àtúnsọ “fẹ́” pa ìtakora ìfẹ́ àti àìfẹ́ inú Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un. “Ẹ̀yin” mú plural ἠθελήσατε hàn kedere.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: kó àwọn ọmọ rẹ jọ
  rationale: “Kó ... jọ” mú agbára compound verb náà hàn, “àwọn ọmọ rẹ” sì pa àkàwé Jerúsálẹ́mù gẹ́gẹ́ bí ìyá-ìlú àti àìdánilójú ẹni tí àwọn ọmọ náà ń tọ́ka sí mọ́.
- source_word: ὄρνις
  choice: àgbébọ̀ adìẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ẹyẹ lápapọ̀, àwòrán ìyá tí ń kó ọmọ sábẹ́ ìyẹ́ mú “àgbébọ̀ adìẹ” jẹ́ yíyan tó ṣe kedere jù lọ.
- source_word: τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας
  choice: àwọn ọmọ rẹ̀ sábẹ́ ìyẹ́ rẹ̀
  rationale: Yorùbá sábà máa ń sọ “àwọn ọmọ” ju ọ̀rọ̀ àkójọpọ̀ aláìmọ̀ lọ; gbolohun náà pa àwòrán àwọn ọmọ adìẹ tí a dáàbò bò mọ́.
theological_decisions:
- issue: Ohun tí “àwọn ọmọ rẹ” ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “àwọn ọmọ rẹ,” láìsọ pé àwọn olùgbé ìlú nìkan ni tàbí gbogbo àwọn ènìyàn tí ìlú náà dúró fún.
  alternative: àwọn olùgbé Jerúsálẹ́mù; àwọn ènìyàn Ísírẹ́lì tí Jerúsálẹ́mù dúró fún
  rationale: Gíríìkì ń bá Jerúsálẹ́mù sọ̀rọ̀ bí ìyá-ìlú; ìtumọ̀ náà pa àkàwé àti àyè ìtumọ̀ rẹ̀ mọ́.
- issue: Ìtakora ìfẹ́ nínú θέλω / ἠθελήσατε
  choice: “mo fẹ́ ... ẹ̀yin kò fẹ́”
  alternative: “mo ń fẹ́ gidigidi ... ẹ̀yin kọ̀”; “mo múra tán ... ẹ̀yin kò múra”
  rationale: Yíyan náà pa èdè ìfẹ́/ìfẹ̀-inú Gíríìkì àti plural ẹni kejì mọ́, láìyanjú ariyanjiyan nípa ìfẹ́ Ọlọ́run àti ìkọ̀ ènìyàn rékọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ìwọ” bá Jerúsálẹ́mù gẹ́gẹ́ bí ìlú kan mu, nígbà tí “ẹ̀yin” mú plural ἠθελήσατε àti ìyípadà sí àwọn ènìyàn tí a ń bá wí hàn. Àmì gígùn àti àmì ìyanu pa ìró ẹkún àti ìbànújẹ́ ọ̀rọ̀ náà mọ́.
