  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: yo
  text: Nígbà tí ó sì jáde sí ilẹ̀[a], ọkùnrin kan láti inú ìlú náà, ẹni tí ó ní àwọn ẹ̀mí èṣù[b], pàdé rẹ̀. Fún ìgbà pípẹ́, kò wọ aṣọ, kò sì gbé inú ilé, bí kò ṣe láàárín àwọn ibojì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó bá àṣà èdè mu jù, “nígbà tí ó gúnlẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹ̀mí èṣù wọ̀ ọ́.” Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà pé ó “ní àwọn ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: Nígbà tí ó sì jáde sí ilẹ̀
  rationale: Èyí fi ìṣe alábàápín tó ń tọ́ka sí àkókò hàn, ó sì pa ìtumọ̀ gangan ‘jáde sí ilẹ̀’ mọ́ láì fi ‘etíkun’ kún ọ̀rọ̀ náà.
- source_word: ὑπήντησεν
  choice: pàdé rẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá àti tààrà láti sọ pé ẹni kan bá ẹlòmíràn pàdé.
- source_word: ἀνήρ τις
  choice: ọkùnrin kan
  rationale: ‘Ọkùnrin’ fi akọ tí ἀνήρ tọ́ka sí hàn, ‘kan’ sì mú àìdánimọ̀ tí τις ní wá.
- source_word: ἐκ τῆς πόλεως
  choice: láti inú ìlú náà
  rationale: Ó fi ibi tí ọkùnrin náà ti wá tàbí ìlú tí ó ní í ṣe pẹ̀lú hàn ní Yorùbá tó ṣe kedere.
- source_word: ἔχων δαιμόνια
  choice: ní àwọn ẹ̀mí èṣù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ‘ní àwọn ẹ̀mí èṣù’ dípò lílo gbólóhùn tó túmọ̀ sí pé wọ́n ti gba gbogbo ara rẹ̀.
- source_word: χρόνῳ ἱκανῷ
  choice: Ó sì ti pẹ́ gan-an
  rationale: Gbólóhùn náà fi àkókò gígùn tó pọ̀ tó hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: tí kò wọ aṣọ
  rationale: ‘Wọ aṣọ’ ni ọ̀nà Yorùbá tó ṣe kedere fún ìṣe fífi aṣọ wọ ara ẹni.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: kò sì máa ń gbé inú ilé
  rationale: Ìlò ‘máa ń’ fi ìṣe àṣà tàbí ohun tó ń ṣẹlẹ̀ lemọ́lemọ́ tí imperfect Gíríìkì lè ní hàn.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: bí kò ṣe láàárín àwọn ibojì
  rationale: ‘Láàárín àwọn ibojì’ fi ibi ìsìnkú púpọ̀ tí ọ̀rọ̀ náà ń tọ́ka sí hàn, ó sì bá ìyàtọ̀ ‘kì í ṣe ... bí kò ṣe’ mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δαιμόνια ní àyíká ìpọ́njú láti ọwọ́ ẹ̀mí búburú
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí àìmọ́
  rationale: Ọ̀rọ̀ inú ẹsẹ yìí ni δαιμόνια, kì í ṣe πνεύματα ἀκάθαρτα; nítorí náà, ‘àwọn ẹ̀mí èṣù’ pa ìyàtọ̀ ọ̀rọ̀ orísun mọ́.
- issue: Bí a ṣe túmọ̀ ἔχων δαιμόνια
  choice: ní àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí èṣù wọ̀ ọ́
  rationale: Ìtumọ̀ àkọ́kọ́ dúró sítòsí ọ̀rọ̀ Gíríìkì ‘ní’ ó sì yẹra fún píparí irú àṣẹ tàbí ìṣàkóso tí àwọn ẹ̀mí náà ní lórí ọkùnrin náà ju ohun tí gbólóhùn orísun sọ lọ.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ni a lò, pẹ̀lú ọ̀nà ìsọ̀rọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A tún àwọn àmì àlàyé ẹsẹ̀ ṣe kí [a] tọ́ka sí jíjáde sí ilẹ̀, kí [b] sì tọ́ka sí níní àwọn ẹ̀mí èṣù.
