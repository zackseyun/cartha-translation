revisions:
- from: Nígbà tí ó sì jáde sí ilẹ̀[a], ọkùnrin kan láti inú ìlú náà pàdé rẹ̀; ọkùnrin náà ní àwọn ẹ̀mí èṣù[b]. Ó sì ti pẹ́ gan-an tí kò wọ aṣọ, kò sì máa ń gbé inú ilé, bí kò ṣe láàárín àwọn ibojì.
  to: Nígbà tí ó sì jáde sí ilẹ̀[a], ọkùnrin kan láti inú ìlú náà, ẹni tí ó ní àwọn ẹ̀mí èṣù[b], pàdé rẹ̀. Fún ìgbà pípẹ́, kò wọ aṣọ, kò sì gbé inú ilé, bí kò ṣe láàárín àwọn ibojì.
  rationale: A ṣètò gbolóhùn ìbẹ̀rẹ̀ náà kí ‘ẹni tí ó ní àwọn ẹ̀mí èṣù’ lè ṣàlàyé ọkùnrin náà ní tààrà, a sì rọ́pò ìsọ̀rọ̀ àkókò náà pẹ̀lú ọ̀nà Yorùbá tó mọ́gbọ́n dání. Kò sí ìyípadà sí ìtumọ̀, sí ìforúkọsílẹ̀ ọ̀rọ̀ ẹ̀kọ́, tàbí sí ibi àwọn àmì àlàyé.
