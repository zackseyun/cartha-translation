source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: yo
  text: Wọ́n sì ń bẹ̀ ẹ́ pé kí ó má ṣe pàṣẹ fún wọn láti lọ sínú ọ̀gbun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi jíjìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi jíjìn gidigidi; níhìn-ín, nítorí àyíká ọ̀rọ̀ àwọn ẹ̀mí búburú, ó lè tọ́ka sí ọ̀gbun gẹ́gẹ́ bí ibi ìhámọ́ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: ń bẹ̀ ẹ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń bá a lọ hàn; “ń bẹ̀ ẹ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ẹ̀bẹ̀ kánjúkánjú àwọn ẹ̀mí èṣù sí Jesu.
- source_word: ἐπιτάξῃ
  choice: pàṣẹ fún
  rationale: Ó ń tọ́ka sí fífúnni ní àṣẹ pẹ̀lú ọlá-àṣẹ; “pàṣẹ fún wọn” pa agbára àṣẹ Jesu mọ́.
- source_word: ἄβυσσον
  choice: ọ̀gbun àìnísàlẹ̀
  rationale: “Ọ̀gbun àìnísàlẹ̀” ṣàfihàn ibi jíjìn tí kò ní ìsàlẹ̀, ó sì bá àyíká ọ̀rọ̀ nípa ibi ìhámọ́ àwọn ẹ̀mí búburú mu láì sọ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: ἀπελθεῖν
  choice: láti lọ
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá fún ìṣípò lọ sí ibi tí a mẹ́nu kàn, láìfi ọ̀rọ̀ àfikún tí kò pọndandan kún un.
- source_word: ἵνα μὴ
  choice: pé kí ó má ṣe
  rationale: Lẹ́yìn ọ̀rọ̀ ẹ̀bẹ̀, gbólóhùn yìí sọ ohun tí wọ́n ń béèrè; “pé kí ó má ṣe” jẹ́ Yorùbá àdánidá tó sì pa ìtumọ̀ odi náà mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí pa ipa dative mọ́ gẹ́gẹ́ bí àwọn tí àṣẹ náà kan, ó sì jẹ́ ìṣọ̀rọ̀ Yorùbá tó bójú mu.
theological_decisions:
- issue: Ìtumọ̀ ἄβυσσος nínú àyíká ọ̀rọ̀ nípa àwọn ẹ̀mí èṣù
  choice: ọ̀gbun àìnísàlẹ̀ gẹ́gẹ́ bí ibi ìhámọ́ tàbí ìdájọ́ fún àwọn ẹ̀mí búburú
  alternative: ọ̀gbun jíjìn ní ìtumọ̀ ibi lásán
  rationale: Àyíká ọ̀rọ̀ fi àwọn ẹ̀mí èṣù hàn bí wọ́n ṣe bẹ̀rù àṣẹ Jesu. Ìtumọ̀ yìí pa ìwòye ayé ẹ̀mí mọ́, ṣùgbọ́n kò ṣe àlàyé ibi náà ré kọjá ohun tí Lúùkù sọ.
translation_notes:
  register: Yorùbá àkànṣe tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. “Wọ́n sì ń bẹ̀ ẹ́” pa ìtẹ̀síwájú ìṣe inú aorist/imperfect context mọ́, “ọ̀gbun àìnísàlẹ̀” sì fúnni ní ìtumọ̀ àdánidá láìgbé àwòrán ìwé apokalipsi míì wọ inú ẹsẹ náà.
