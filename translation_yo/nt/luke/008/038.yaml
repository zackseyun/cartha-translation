source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: yo
  text: Ọkùnrin náà, ẹni tí àwọn ẹ̀mí èṣù ti jáde lára rẹ̀, ń bẹ̀ ẹ́ pé kí òun wà pẹ̀lú rẹ̀; ṣùgbọ́n ó rán an lọ, ó ní,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: ń bẹ̀ ẹ́
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi ìrawọ́ ẹ̀bẹ̀ tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń bẹ̀ ẹ́” jẹ́ Yorùbá àdánidá tí ó pa ìtara ẹ̀bẹ̀ náà mọ́.
- source_word: ὁ ἀνὴρ
  choice: Ọkùnrin náà
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọkùnrin tí ìtàn ti mẹ́nu kàn tẹ́lẹ̀, nítorí náà “Ọkùnrin náà” ṣe kedere, ó sì bá akọ rẹ̀ mu.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: ẹni tí àwọn ẹ̀mí èṣù ti jáde lára rẹ̀
  rationale: “Ti jáde” pa ìṣe tí ó ti ṣẹlẹ̀ ṣáájú mọ́; “lára rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ẹ̀mí náà jáde kúrò nínú agbára tàbí ara ẹni náà.
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtọ́kasí sí àwọn ẹ̀dá ẹ̀mí búburú mọ́ láì sọ ìtumọ̀ náà di aláìlágbára.
- source_word: εἶναι σὺν αὐτῷ
  choice: kí òun lè wà pẹ̀lú rẹ̀
  rationale: Ìtúmọ̀ yìí tẹ̀lé ìtumọ̀ infinitive náà ní ti àdánidá; “òun” ṣe ìyàtọ̀ láàárín ọkùnrin náà àti ẹni tí ó ń bẹ̀.
- source_word: ἀπέλυσεν
  choice: ó rán an lọ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, Jesu kò gba ìbéèrè ọkùnrin náà, ó sì fún un ní ìtọ́sọ́nà mìíràn; “rán an lọ” mú ìṣe náà jáde ní kedere láì fi ìwà líle kún un.
- source_word: λέγων
  choice: ó ní
  rationale: “Ó ní” jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tí ẹni kan yóò sọ, ó sì bá participle Gíríìkì náà mu.
theological_decisions:
- issue: Ìtumọ̀ τὰ δαιμόνια nínú àyíká ìlépa ẹ̀mí èṣù
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí búburú
  rationale: “Àwọn ẹ̀mí èṣù” pa àfihàn ọrọ̀ náà mọ́ pé àwọn ẹ̀dá ẹ̀mí gidi ni wọ́n jáde lára ọkùnrin náà, ó sì yẹra fún dídín ẹ̀rí ìtàn náà kù sí ohun tí kò ṣe kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “ṣùgbọ́n” láti gbé ìtakora δέ kejì jáde; δέ àkọ́kọ́ kò nílò ọ̀rọ̀ asopọ̀ ọ̀tọ̀ ní Yorùbá.
