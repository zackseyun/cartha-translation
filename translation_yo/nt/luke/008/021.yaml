  verdict: revise
  source_fidelity: 'Ìtumọ̀ àwọn apá ọ̀rọ̀ náà dára lápapọ̀: ‘ó dá wọn lóhùn pé,’ ‘ọ̀rọ̀ Ọlọ́run,’ àti ìṣe àbùdá nínú ‘ń gbọ́ ... ń ṣe é’ bá Gíríìkì mu. Ṣùgbọ́n ìṣètò ‘Àwọn wọ̀nyí ni ìyá mi àti àwọn arákùnrin mi: àwọn tí...’ yí ibátan ìdánimọ̀ gírámà padà, ó sì dà bí ẹni pé ‘àwọn wọ̀nyí’ ni ìyá àti arákùnrin Jésù, lẹ́yìn náà ni a tún ṣàlàyé wọn. Orísun náà ń sọ pé ìyá àti àwọn arákùnrin rẹ̀ ni ẹgbẹ́ àwọn tí ń gbọ́ tí wọ́n sì ń ṣe ọ̀rọ̀ Ọlọ́run.'
  naturalness: 'Àtúnṣe náà jẹ́ Yorùbá òde òní tó rọrùn: ‘Ìyá mi àti àwọn arákùnrin mi ni àwọn tí...’ Ó sọ ìdánimọ̀ tí ọrọ̀ náà ń ṣe ní kedere. ‘Àwọn tí ń gbọ́ ... tí wọ́n sì ń ṣe é’ jẹ́ ìlò àdánidá.'
  terminology: ‘Ìyá mi,’ ‘àwọn arákùnrin mi,’ àti ‘ọ̀rọ̀ Ọlọ́run’ yẹ. A pa ‘àwọn arákùnrin’ mọ́ nínú ọ̀rọ̀ pàtàkì fún ἀδελφοί; àlàyé ìsàlẹ̀ lè fi hàn pé ìlò ọ̀rọ̀ náà kò fi ohun tí gbólóhùn náà lè kan mọ́ akọ nìkan.
