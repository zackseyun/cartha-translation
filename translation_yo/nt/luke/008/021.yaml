source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Ìyá mi àti àwọn arákùnrin mi[a] ni àwọn tí ń gbọ́ ọ̀rọ̀ Ọlọ́run, tí wọ́n sì ń ṣe é.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin mi.” Ọ̀rọ̀ Gíríìkì náà lo “àwọn arákùnrin,” ṣùgbọ́n ohun tí gbólóhùn náà ń sọ lè kan àwọn obìnrin pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: ó dá wọn lóhùn pé
  rationale: Èyí fi ìtumọ̀ pé ó fèsì sí wọn hàn ní Yorùbá àdánidá. Kíkó ‘dáhùn’ àti ‘sọ’ jọ ní ọ̀rọ̀ kan kò sọ ohunkóhun nù, nítorí pé ‘pé’ ti mú ọ̀rọ̀ tí ó tẹ̀ lé wọlé.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: ìyá mi àti àwọn arákùnrin mi
  rationale: ‘Ìyá mi’ túmọ̀ ọ̀rọ̀ ẹyọ náà tààrà, ‘àwọn arákùnrin mi’ sì pa akọ ọ̀pọ̀ ἀδελφοί mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn tó lè kó àwọn obìnrin sínú rẹ̀ hàn.
- source_word: οὗτοί εἰσιν οἱ
  choice: 'Àwọn wọ̀nyí ni ...: àwọn tí'
  rationale: Ìṣètò yìí pa agbára ọ̀rọ̀ atọ́ka οὗτοί mọ́, ó sì lo àmì olóṣù méjì láti so ‘àwọn wọ̀nyí’ mọ́ àwọn ẹni tí àpèjúwe tó tẹ̀ lé ń tọ́ka sí.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún gbolohun oníṣùmọ̀ náà, ó sì pa ìtumọ̀ ọ̀rọ̀ tàbí ìhìn Ọlọ́run mọ́.
- source_word: οἱ ... ἀκούοντες καὶ ποιοῦντες
  choice: àwọn tí ń gbọ́ ... tí wọ́n sì ń ṣe é
  rationale: Àmì ‘ń’ fi ìṣe tó ń jẹ́ àbùdá wọn hàn, ‘ṣe é’ sì dúró sítòsí ποιέω láì fi ìtumọ̀ ‘gbọ́ràn’ kun un ní tààrà.
theological_decisions:
- issue: Ìwọ̀n àwọn tí Jésù pè ní ìdílé rẹ̀
  choice: A fi ‘àwọn arákùnrin’ sínú ọ̀rọ̀ pàtàkì, a sì jẹ́ kí ìdánimọ̀ náà dá lórí gbígbọ́ ọ̀rọ̀ Ọlọ́run àti ṣíṣe é.
  alternative: Lílo ‘àwọn arákùnrin àti arábìnrin’ nínú ọ̀rọ̀ pàtàkì, tàbí sísọ pé Jésù kọ ìdílé rẹ̀ nípa ẹ̀jẹ̀ sílẹ̀ pátápátá.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ó sì tún ń dún bí ìtọ́kasí sí àwọn arákùnrin rẹ̀ nípa ẹ̀jẹ̀. Síbẹ̀, àlàyé náà lè kan àwọn ọmọ-ẹ̀yìn láìka akọ tàbí abo sí. Ẹsẹ̀ náà kò sọ pé Jésù sẹ́ ìdílé rẹ̀ nípa ẹ̀jẹ̀, nítorí náà a kò fi ìtumọ̀ yẹn kun un.
- issue: Agbára ọ̀rọ̀ atọ́ka οὗτοι
  choice: ‘Àwọn wọ̀nyí ni’
  alternative: ‘Àwọn tí ... ni’ láìsí ọ̀rọ̀ atọ́ka
  rationale: Yíyan ‘àwọn wọ̀nyí’ pa ìtẹnumọ́ ìdánimọ̀ tó wà nínú orísun mọ́; àlàyé ìsàlẹ̀ jẹ́wọ́ àtúnṣètò tó rọrùn sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àṣàájú tó bójú mu, tó ní àmì ohùn níbi tí ó yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Dá wọn lóhùn pé’ jẹ́ ti èdè àdánidá ju àtúnsọ ìṣọ̀kan Semitic-Greek lọ; ‘àwọn wọ̀nyí ni’ sì pa ìtẹnumọ́ orísun mọ́ láì di èdè àtijọ́.
