id: LUK.8.45
reference: Luke 8:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: yo
  text: Jésù sì béèrè pé, “Ta ni ẹni tí ó fọwọ́ kàn mí?” Nígbà tí gbogbo wọn ń sẹ́ pé àwọn kọ́, Peteru sọ pé, “Olùkọ́, àwọn èrò yí ọ ká, wọ́n sì ń tẹ̀ ọ́ mọ́ra.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁψάμενός
  choice: fọwọ́ kàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ara kan ẹnì kan ní àyíká yìí; ‘fọwọ́ kàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ irú ìfọwọ́kàn náà.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Nígbà tí gbogbo wọn ń sẹ́ pé àwọn kọ́
  rationale: ‘Ń sẹ́’ pa ìṣe tí ń lọ lọ́wọ́ mọ́, ‘pé àwọn kọ́’ sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ohun tí gbogbo wọn ń sẹ́.
- source_word: Ἐπιστάτα
  choice: Olùkọ́
  rationale: Nínú Lúùkù, ọ̀rọ̀ ìpè yìí fi ìbọ̀wọ̀ àti ìtẹ́wọ́gbà àṣẹ Jésù hàn. ‘Olùkọ́’ jẹ́ àdánidá ní Yorùbá, kò sì gbé akọ́lé κύριος (‘Olúwa’) wọ inú ẹsẹ̀ náà.
- source_word: ὄχλοι
  choice: àwọn èrò
  rationale: ‘Àwọn èrò’ pa nọ́ńbà púpọ̀ Gíríìkì mọ́, ó sì tọ́ka sí ọ̀pọ̀ ìjọ ènìyàn tó yí Jésù ká.
- source_word: συνέχουσίν
  choice: yí ọ ká
  rationale: Yíyí ẹnì kan ká mú èrò dídí i mọ́ láàárín ọ̀pọ̀ ènìyàn jáde ní Yorùbá àdánidá.
- source_word: ἀποθλίβουσιν
  choice: ń há mọ́ ọ
  rationale: Ọ̀rọ̀ yìí fi ìtẹ̀sí líle ti èrò tó ń tẹ ara wọn mọ́ Jésù hàn, láì sọ àsọdùn pé wọ́n ń fọ́ ọ.
theological_decisions:
- issue: Ìtumọ̀ akọ́lé Ἐπιστάτα tí Peteru fi pe Jésù
  choice: Olùkọ́
  alternative: Olúwa
  rationale: Ẹsẹ̀ náà lo Ἐπιστάτα, kì í ṣe κύριος. ‘Olùkọ́’ fi ìbọ̀wọ̀ àti àṣẹ hàn láì fi akọ́lé Kristẹni tó lágbára ju èyí tí Gíríìkì sọ lọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn níbi tó yẹ; ìtòlẹ́sẹẹsẹ gbólóhùn jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n ó pa ìbéèrè Gíríìkì náà àti ìṣe ìsẹ́ tí ń lọ lọ́wọ́ mọ́.
