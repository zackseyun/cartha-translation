  to: Jésù sì béèrè pé, “Ta ni ẹni tí ó fọwọ́ kàn mí?” Nígbà tí gbogbo wọn ń sẹ́ pé àwọn kọ́, Peteru sọ pé, “Olùkọ́, àwọn èrò yí ọ ká, wọ́n sì ń tẹ̀ ọ́ mọ́ra.”
