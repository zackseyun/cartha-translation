id: LUK.8.19
reference: Luke 8:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: yo
  text: Nígbà náà ni ìyá rẹ̀ àti àwọn arákùnrin rẹ̀[b] wá sọ́dọ̀ rẹ̀, ṣùgbọ́n wọn kò lè dé ọ̀dọ̀ rẹ̀[a] nítorí ọ̀pọ̀ ènìyàn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá a pàdé” tàbí “dé ibi tí ó wà.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “àwọn arákùnrin”; àwọn kan máa ń túmọ̀ èyí ní ọ̀nà tó gbòòrò sí i gẹ́gẹ́ bí “àwọn ìbátan,” ṣùgbọ́n “àwọn arákùnrin” ni ọ̀rọ̀ inú ẹsẹ náà sọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ
  choice: Nígbà náà ni ... wá
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti dídé àwọn ará Jésù hàn ní Yorùbá àdánidá.
- source_word: πρὸς αὐτὸν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó túmọ̀ sí lílọ sí ọ̀dọ̀ ẹni kan, láìfi ète tí Gíríìkì kò sọ kún un.
- source_word: ἡ μήτηρ
  choice: ìyá rẹ̀
  rationale: Ọ̀rọ̀ ìbátan tó ṣe kedere; ọ̀rọ̀ àyíká fi hàn pé ìyá Jésù ni.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ó pa akọ púpọ̀ ἀδελφοί mọ́, kò sì yí i sí ọ̀rọ̀ gbòòrò bí ‘àwọn ìbátan.’
- source_word: οὐκ ἠδύναντο
  choice: wọn kò lè
  rationale: Ó sọ àìlèṣe tó wà nínú imperfect δύναμαι ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: συντυχεῖν αὐτῷ
  choice: dé ọ̀dọ̀ rẹ̀
  rationale: Nínú àyíká tí ọ̀pọ̀ ènìyàn dí wọn lọ́wọ́, ó túmọ̀ sí pé wọn kò lè dé ibi tí ó wà tàbí bá a pàdé.
- source_word: διὰ τὸν ὄχλον
  choice: nítorí ọ̀pọ̀ ènìyàn náà
  rationale: διά pẹ̀lú accusative sọ ìdí; gbolohun yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn arákùnrin rẹ̀’
  choice: Túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘àwọn arákùnrin rẹ̀,’ láìpinnu irú ìbátan wọn ju ohun tí ẹsẹ náà sọ lọ.
  alternative: àwọn ìbátan rẹ̀
  rationale: ἀδελφοί sábà túmọ̀ sí ‘àwọn arákùnrin’; ẹsẹ náà kò ṣàlàyé bóyá arákùnrin àbúrò/ẹ̀gbọ́n kan náà, arákùnrin àbọ̀, tàbí ìbátan mìíràn ni wọ́n.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
