- from: Irúgbìn mìíràn sì bọ́ sí ilẹ̀ rere[a]; nígbà tí ó sì hù, ó so èso ní ìlọ́po ọgọ́rùn-ún[b]. Bí ó ti ń sọ nǹkan wọ̀nyí, ó ké jáde pé, “Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́.”
  to: Irúgbìn mìíràn sì ṣubú sí ilẹ̀ rere[a]; nígbà tí ó sì hù, ó so èso ní ìlọ́po ọgọ́rùn-ún[b]. Bí ó ti ń sọ nǹkan wọ̀nyí, ó ké jáde pé, “Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́.”
