  source_fidelity: Ìṣe ìṣe Gíríìkì náà jẹ́ pé irúgbìn náà “wọ́ sílẹ̀/fell,” kì í ṣe pé ó kan “bọ́ sí” ilẹ̀. “Ṣubú sí ilẹ̀” ṣàfihàn ἔπεσεν dáadáa. Àwọn apá yòókù—ilẹ̀ rere, hù, so èso ní ìlọ́po ọgọ́rùn-ún, àti ìpè ìgbọ́gbọ́ náà—ń pa ìtumọ̀ orísun mọ́.
