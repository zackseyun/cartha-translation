id: LUK.8.8
reference: Luke 8:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: yo
  text: Irúgbìn mìíràn sì ṣubú sí ilẹ̀ rere[a]; nígbà tí ó sì hù, ó so èso ní ìlọ́po ọgọ́rùn-ún[b]. Bí ó ti ń sọ nǹkan wọ̀nyí, ó ké jáde pé, “Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilẹ̀ tí ó dára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó so èso ní ìgbà ọgọ́rùn-ún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: irúgbìn mìíràn
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe irúgbìn mìíràn nínú àwọn irúgbìn inú òwe náà. Fífi ‘irúgbìn’ hàn gbangba mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: γῆν τὴν ἀγαθήν
  choice: ilẹ̀ rere
  rationale: Nínú ọ̀rọ̀ iṣẹ́ àgbẹ̀ yìí, ‘ilẹ̀ rere’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ilẹ̀ tí irúgbìn lè dàgbà dáadáa nínú rẹ̀.
- source_word: φυὲν
  choice: nígbà tí ó sì hù
  rationale: Èyí fi ìṣẹ̀lẹ̀ hùhù irúgbìn ṣáájú sísọ èso hàn, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἐποίησεν καρπὸν
  choice: ó so èso
  rationale: ‘So èso’ ni gbólóhùn Yorùbá àdánidá fún ohun ọ̀gbìn tí ó mú èso jáde.
- source_word: ἑκατονταπλασίονα
  choice: ní ìlọ́po ọgọ́rùn-ún
  rationale: Ó pa ìtumọ̀ iye tí ó pọ̀ tó ìgbà ọgọ́rùn-ún mọ́ láì dín agbára ọ̀rọ̀ náà kù.
- source_word: ταῦτα λέγων
  choice: bí ó ti ń sọ nǹkan wọ̀nyí
  rationale: Ó fi hàn pé kíké jáde náà ṣẹlẹ̀ ní àkókò tí ó ń sọ àwọn ọ̀rọ̀ wọ̀nyí.
- source_word: ἐφώνει
  choice: ó ké jáde
  rationale: Ó sọ ìgbóhùn sókè pẹ̀lú ìtẹnumọ́, ṣùgbọ́n kò fi dandan túmọ̀ sí pé ó ń pariwo nínú ìbínú.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Ẹni tí ó ní etí láti fi gbọ́
  rationale: ‘Ẹni’ pa ìtumọ̀ aṣojú ẹni kọ̀ọ̀kan mọ́, láì sọ ọ́ di ọkùnrin nìkan; ‘láti fi gbọ́’ sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Ọ̀nà yìí pa àṣẹ ẹni kẹta mọ́, ó sì ní ìtẹnumọ́ ìpè náà ní Yorùbá.
theological_decisions:
- issue: Èdè aṣojú nínú ìkìlọ̀ Jésù
  choice: Ẹni tí ó ní etí láti fi gbọ́, kí ó gbọ́
  alternative: Ọkùnrin tí ó ní etí láti fi gbọ́, kí ó gbọ́
  rationale: Gíríìkì náà ń tọ́ka sí ẹnikẹ́ni tí ó lè gbọ́, kì í ṣe ọkùnrin nìkan. ‘Ẹni’ pa ìtumọ̀ ẹni kọ̀ọ̀kan àti ìpè gbogbogbò mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba.
