  terminology: “Ilẹ̀ rere,” “hù,” àti “so èso” bá ọ̀rọ̀ àgbẹ̀ mu. “Ẹni” ń pa agbára aṣojú ti Ὁ ἔχων mọ́ láì fi ọkùnrin nìkan sí i. A tún ọ̀rọ̀ àlàyé ẹsẹ̀-ẹ̀sín b ṣe sí ìyàn mìíràn tí kò ṣàfikún ìtumọ̀ tí kò sí nínú Gíríìkì.
