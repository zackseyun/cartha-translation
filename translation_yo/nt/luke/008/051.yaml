id: LUK.8.51
reference: Luke 8:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: yo
  text: Nígbà tí ó dé inú ilé náà, kò gba ẹnikẹ́ni[a] láyè láti bá a wọlé, àfi Peteru àti Johanu àti Jakọbu, àti baba ọmọbìnrin náà àti ìyá rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé-àfọwọ́kọ kan kò ní ọ̀rọ̀ náà, “ẹnikẹ́ni láti bá a wọlé.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Nígbà tí ó dé inú ilé náà
  rationale: Aorist participle ἐλθών is naturally expressed as a temporal clause; δέ continues the narrative without requiring a separate conjunction, and οἰκία denotes the house or home.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: kò gba ... láyè láti ... wọlé
  rationale: In this context ἀφίημι means permit or allow, while εἰσελθεῖν means enter; the Yoruba construction is clear, current, and natural.
- source_word: τινα σὺν αὐτῷ
  choice: ẹnikẹ́ni ... láti bá a wọlé
  rationale: Under negation, indefinite τινα has the generic force ‘anyone’; bá a wọlé naturally conveys entering together with him.
- source_word: εἰ μὴ
  choice: àfi
  rationale: After the negative clause, εἰ μή marks an exception rather than a condition.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Peteru àti Johanu àti Jakọbu
  rationale: The familiar Yoruba forms of the names are used, while the repeated àti preserves the source's polysyndetic rhythm.
- source_word: τῆς παιδὸς
  choice: ọmọbìnrin náà
  rationale: παῖς can mean child, boy, or girl; the immediate context identifies this child as Jairus's daughter, so the feminine-specific wording is natural and contextually warranted.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: baba ... àti ìyá rẹ̀
  rationale: The wording preserves the separate mention of the girl's father and mother rather than compressing them into ‘parents’; the possessive reference is explicit and idiomatic in Yoruba.
theological_decisions:
- issue: Specificity of παῖς in context
  choice: baba ọmọbìnrin náà àti ìyá rẹ̀
  alternative: baba ọmọ náà àti ìyá rẹ̀
  rationale: Although παῖς is lexically broader than ‘girl,’ the narrative explicitly concerns Jairus's daughter. The chosen wording reflects contextual gender without introducing a doctrinal interpretation.
translation_notes:
  register: Standard Yorùbá in a dignified but accessible narrative register, with full tone marks where natural. The sentence retains the source's sequence and repeated conjunctions without becoming unnaturally literal.
