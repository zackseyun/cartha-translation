id: LUK.8.49
reference: Luke 8:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀, ẹnì kan dé láti ọ̀dọ̀ olórí sínágọ́gù[a], ó sì wí pé, “Ọmọbìnrin rẹ ti kú; má ṣe yọ olùkọ́ náà lẹ́nu mọ́[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “alákòóso sínágọ́gù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “má ṣe dá olùkọ́ náà láàmú mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Nígbà tí ó ṣì ń sọ̀rọ̀
  rationale: Gbólóhùn oníjẹ́nítífù yìí fi hàn pé ìṣe méjèèjì ń ṣẹlẹ̀ ní àkókò kan náà; “ṣì” sì pa agbára ἔτι mọ́ ní Yorùbá àdánidá.
- source_word: ἔρχεταί τις
  choice: ẹnì kan dé
  rationale: A tú ìṣe ìsinsìnyí inú ìtàn náà sí àkókò tí ó kọjá, gẹ́gẹ́ bí ó ti bójú mu ní ìtàn Yorùbá; τις jẹ́ ẹni tí a kò dárúkọ.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: láti ọ̀dọ̀ olórí sínágọ́gù
  rationale: παρά pẹ̀lú jẹ́nítífù tọ́ka sí ibi tàbí ẹni tí ìránṣẹ́ ti wá; “olórí sínágọ́gù” jẹ́ ọ̀nà kedere, òde òní láti sọ ipò ἀρχισυνάγωγος.
- source_word: λέγων
  choice: ó sì wí pé
  rationale: Ó so dídé ẹni náà mọ́ ọ̀rọ̀ tí ó mú wá, ní èdè Yorùbá tí ó lọ́nà rere.
- source_word: Τέθνηκεν
  choice: ti kú
  rationale: Àkókò pípé Gíríìkì fi iṣẹlẹ̀ ikú àti ipò tí ó yọ láti inú rẹ̀ hàn; “ti kú” mú èrò méjèèjì wọ̀nyí jáde ní Yorùbá.
- source_word: ἡ θυγάτηρ σου
  choice: Ọmọbìnrin rẹ
  rationale: Ìtumọ̀ tààrà fún ọmọdébìnrin ẹni tí a ń bá sọ̀rọ̀.
- source_word: μηκέτι
  choice: mọ́
  rationale: “Mọ́” lẹ́yìn àṣẹ òdì fi hàn pé kí ìṣe náà má bá a lọ láti ìsinsìnyí lọ.
- source_word: σκύλλε
  choice: má ṣe yọ ... lẹ́nu
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti dá ẹnì kan láàmú tàbí fi ìṣòro kàn án; “yọ ... lẹ́nu” jẹ́ àdánidá, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́.
- source_word: τὸν διδάσκαλον
  choice: olùkọ́ náà
  rationale: διδάσκαλος ní ìtumọ̀ ìpìlẹ̀ rẹ̀ ni “olùkọ́”; a kò gbé e ga sí oyè mìíràn tí ọ̀rọ̀ Gíríìkì kò béèrè.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀρχισυνάγωγος nípa ipò Jáírù
  choice: olórí sínágọ́gù
  alternative: alákòóso sínágọ́gù
  rationale: Ó jẹ́ orúkọ ipò nínú ilé ìjọsìn Júù, kì í ṣe oyè ẹ̀kọ́ ìgbàgbọ́; “olórí” ṣe kedere fún òǹkàwé òde òní.
- issue: Bí a ṣe túmọ̀ διδάσκαλος
  choice: olùkọ́ náà
  alternative: ọ̀gá náà
  rationale: Gíríìkì lo orúkọ ojúṣe tí ó wọ́pọ̀ fún ẹni tí ń kọ́ni. “Olùkọ́” pa ìtumọ̀ yẹn mọ́ láìfi ìtumọ̀ nípa ẹni Kristi kún un tí kò hàn gbangba nínú gbólóhùn náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tí ó yẹ. “Sínágọ́gù” jẹ́ ọ̀rọ̀ àyálò tí ó wọ́pọ̀ fún ilé ìjọsìn Júù; ìṣètò gbólóhùn sì pa ìtẹ̀síwájú ìtàn àti kánjúkánjú ìròyìn náà mọ́.
