id: LUK.8.39
reference: Luke 8:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: yo
  text: Padà sí ilé rẹ, kí o sì ròyìn gbogbo ohun tí Ọlọ́run ti ṣe fún ọ. Ó sì lọ, ó ń kéde káàkiri gbogbo ìlú náà nípa gbogbo ohun tí Jésù ti ṣe fún un.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Padà
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí ẹni náà padà sí ibi tí ó ti wá; “Padà” jẹ́ ọ̀nà àdánidá, tààrà, tí ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς τὸν οἶκόν σου
  choice: sí ilé rẹ
  rationale: Ní àyíká yìí, οἶκος ń tọ́ka sí ilé ẹni gẹ́gẹ́ bí ibi tí yóò padà sí; “ilé rẹ” tún lè ní ìtumọ̀ ibùgbé àti àwọn ará ilé rẹ ní ọ̀nà àdánidá.
- source_word: διηγοῦ
  choice: kí o sì sọ
  rationale: διηγέομαι túmọ̀ sí láti ròyìn tàbí ṣàlàyé ohun kan; “sọ” jẹ́ èdè Yorùbá òde òní tí ó rọrùn, tí àyíká sì mú kí ìtumọ̀ ríròyìn ohun tí ó ṣẹlẹ̀ hàn.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: gbogbo ohun tí Ọlọ́run ti ṣe fún ọ
  rationale: ὅσα lè túmọ̀ sí “gbogbo ohun tí” tàbí “ohun tí ó tó bẹ́ẹ̀ tí.” Yíyan “gbogbo ohun tí” dúró mọ́ ọ̀rọ̀ Gíríìkì láìfi ajẹtífù bí “ńlá” kún un.
- source_word: ἀπῆλθεν
  choice: Ó sì lọ
  rationale: Ọ̀rọ̀ náà sọ pé ó kúrò níbi náà; “ó lọ” jẹ́ ìtumọ̀ àdánidá ní Yorùbá, àyíká sì fi ìkúrò rẹ̀ hàn.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: káàkiri gbogbo ìlú náà
  rationale: κατά pẹ̀lú ọ̀rọ̀ àfihàn yìí ní ìtumọ̀ pípín ká gbogbo agbègbè ìlú náà; “káàkiri gbogbo ìlú náà” sọ èyí ní kedere.
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: κηρύσσω jẹ́ pípolongo ní gbangba, ó lágbára ju sísọ lásán lọ; “kéde” pa ìtumọ̀ yẹn mọ́ láìsọ ọ́ di ìwàásù ní pàtó.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: gbogbo ohun tí Jésù ti ṣe fún un
  rationale: Ìtumọ̀ yìí pa ìbáradọ́gba ọ̀rọ̀ mọ́ pẹ̀lú “gbogbo ohun tí Ọlọ́run ti ṣe fún ọ,” ó sì lo “fún un” láti fi ẹni tí Jésù ṣe ohun náà fún hàn.
theological_decisions:
- issue: Ìbáradọ́gba láàárín “Ọlọ́run” nínú àṣẹ Jésù àti “Jésù” nínú ìkéde ọkùnrin náà
  choice: 'Pa àwọn orúkọ méjèèjì mọ́ bí orísun ṣe gbé wọn kalẹ̀: ohun tí Ọlọ́run ṣe fún ọ / ohun tí Jésù ṣe fún un.'
  alternative: Ṣe àwọn gbólóhùn méjèèjì bákan náà nípa yíyí “Ọlọ́run” tàbí “Jésù” padà, tàbí ṣàlàyé ìbáṣepọ̀ wọn ní tààrà.
  rationale: Lúùkù fi “Ọlọ́run” àti “Jésù” sí ipò tó jọra láìfi àlàyé olóòtú kún un. Ìtumọ̀ náà pa agbára ẹ̀kọ́ ìgbàgbọ́ àti ìfọ̀rọ̀wérọ̀ yìí mọ́ láìyanjú rẹ̀ fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àṣàjọ, òde òní, tí ó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
