id: LUK.8.32
reference: Luke 8:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: yo
  text: Agbo kan tí ẹlẹ́dẹ̀ inú rẹ̀ pọ̀ wà níbẹ̀, ó ń jẹun lórí òkè náà[b]. Wọ́n[c] sì bẹ̀ ẹ́ pé kí ó gba àwọn láàyè láti wọ inú àwọn ẹlẹ́dẹ̀ náà; ó sì gbà wọ́n láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “lẹ́gbẹ̀ẹ́ òkè náà.”
    reason: lexical_alternative
  - marker: c
    text: Nínú àyíká ọ̀rọ̀ náà, “wọ́n” ń tọ́ka sí àwọn ẹ̀mí èṣù tàbí àwọn ẹ̀mí àìmọ́; àwọn ìtumọ̀ kan sọ èyí ní tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: agbo ẹlẹ́dẹ̀ ńlá kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ẹlẹ́dẹ̀ inú agbo náà pọ̀; ó tún pa ìtumọ̀ ἱκανῶν mọ́ gẹ́gẹ́ bí ohun tó ń tọ́ka sí iye tàbí ìwọ̀n agbo náà.
- source_word: βοσκομένη
  choice: wọ́n ń jẹun
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe ohun tí àwọn ẹlẹ́dẹ̀ ń ṣe. ‘Ń jẹun’ ṣe kedere, ó sì bójú mu fún ẹlẹ́dẹ̀ ju ọ̀rọ̀ tó lè túmọ̀ sí jíjẹ koríko nìkan lọ.
- source_word: ἐν τῷ ὄρει
  choice: lórí òkè náà
  rationale: Èyí tẹ̀ lé ìtumọ̀ ὄρος ní tààrà, láì fi ìtumọ̀ pàtó bí ‘ẹ̀gbẹ́ òkè’ kún un.
- source_word: παρεκάλεσαν
  choice: bẹ̀ ẹ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ìṣe náà jẹ́ ẹ̀bẹ̀ líle, kì í ṣe bíbéèrè lásán.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: gba àwọn láàyè / gbà wọ́n láàyè
  rationale: Àtúnsọ gbólóhùn kan náà nínú ìbéèrè àti ìdáhùn pa ìbáramu àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: láti wọ inú àwọn ẹlẹ́dẹ̀ náà
  rationale: ‘Wọ inú’ sọ ìwọlé tí εἰσελθεῖν túmọ̀ sí, ‘àwọn ẹlẹ́dẹ̀ náà’ sì mú ẹni tí ἐκείνους ń tọ́ka sí hàn kedere.
- source_word: δὲ / καὶ
  choice: — / sì
  rationale: A kò fi ọ̀rọ̀ àsopọ̀ sí ìbẹ̀rẹ̀ nítorí δὲ kì í ṣe ọ̀rọ̀ àkókò pàtó níbí; ‘sì’ fi ìtẹ̀síwájú ìtàn hàn ní àwọn apá tó tẹ̀ lé e.
theological_decisions:
- issue: Ẹni tí ‘wọ́n’ nínú ‘wọ́n sì bẹ̀ ẹ́’ ń tọ́ka sí
  choice: A fi ‘wọ́n’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, nígbà tí àyíká ọ̀rọ̀ fi hàn pé àwọn ẹ̀mí èṣù ni.
  alternative: ‘Àwọn ẹ̀mí èṣù sì bẹ̀ ẹ́’
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò tún pe àwọn ẹ̀mí náà ní orúkọ, bí ó tilẹ̀ jẹ́ pé àyíká tó yí i ká mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere. Fífi arọ́pò-orúkọ náà sílẹ̀ pa ìṣiyèméjì gírámà orísun mọ́ láì yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹlẹ́dẹ̀’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn pàtó, a sì fi àmì ohùn sí ibi tí ó bá èdè àkọsílẹ̀ mu.
