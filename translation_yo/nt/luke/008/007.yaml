source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: yo
  text: Irúgbìn mìíràn sì ṣubú sí àárín àwọn ẹ̀gún,[a] àwọn ẹ̀gún náà sì bá a dàgbà, wọ́n sì fún un pa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn ẹ̀gún.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹ̀gún náà, bí wọ́n ti ń bá a dàgbà, sì fún un pa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Irúgbìn mìíràn
  rationale: Ọ̀rọ̀ ajẹ́tífù aláìlóbìrin ẹyọ kan yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí irúgbìn nínú àyíká òwe náà; fífi “irúgbìn” kún un mú ìtumọ̀ náà ṣe kedere ní Yorùbá.
- source_word: ἔπεσεν
  choice: bọ́
  rationale: “Bọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ó ṣubú sí ibi kan, ó sì pa ìṣe ìtàn rírọrùn náà mọ́.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: sí àárín àwọn ẹ̀gún
  rationale: Èyí pa ìtumọ̀ ibi tí ó wà ní àárín tàbí láàárín àwọn ohun ọ̀gbìn ẹlẹ́gùn mọ́.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: àwọn ẹ̀gún
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀ yìí, “àwọn ẹ̀gún” lè tọ́ka sí àwọn ohun ọ̀gbìn ẹlẹ́gùn, ó sì jẹ́ àwòrán tí àwọn òǹkàwé Yorùbá mọ̀.
- source_word: συμφυεῖσαι
  choice: bá a dàgbà
  rationale: Ìṣe náà túmọ̀ sí pé àwọn ẹ̀gún dàgbà pọ̀ pẹ̀lú irúgbìn náà; “bá a dàgbà” sọ ìdàgbàsókè tí ó jọ ṣẹlẹ̀ ní kedere àti ní èdè àdánidá.
- source_word: ἀπέπνιξαν
  choice: fún un pa
  rationale: “Fún un pa” jẹ́ àpèjúwe Yorùbá àdánidá fún bí ohun ọ̀gbìn mìíràn ṣe lè há irúgbìn mọ́, kí ó sì pa á; ó bá àkàwé iṣẹ́ àgbẹ̀ náà mu.
- source_word: αὐτό
  choice: un
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí irúgbìn tí a ti mẹ́nu kàn, “un” sì jẹ́ ìtọ́kasí àdánidá ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “fún un pa” láti mú àwòrán ohun ọ̀gbìn tí a há mọ́ hàn ní èdè àdánidá, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
