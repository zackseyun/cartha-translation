  to: Èyí tí ó bọ́ sí àárín àwọn ẹ̀gún sì ni àwọn tí wọ́n ti gbọ́; ṣùgbọ́n bí wọ́n ti ń lọ, àníyàn[a], ọrọ̀ àti ìgbádùn ayé ń fún wọn pa, wọn kò sì mú èso dé ìpọn.[b]
