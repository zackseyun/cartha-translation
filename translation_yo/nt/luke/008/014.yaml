review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìṣọ̀kan ẹsẹ̀ Gíríìkì náà mọ́ ní gbogbogbòò: ohun tí ó ṣubú sí àárín ẹ̀gún ń tọ́ka sí irúgbìn inú àkàwé, àwọn olùgbọ́ ni a sì ń ṣàlàyé. Ó tún fi àwọn ìdààmú/àníyàn, ọrọ̀, àti ìgbádùn ayé hàn gẹ́gẹ́ bí ohun tí ń dí èso kíkún. Síbẹ̀, ‘so èso dé ìgbà tí yóò fi gbó’ lè túmọ̀ sí pé wọn ń dúró kí èso náà gbó, kì í ṣe pé èso wọn kì í dé ìpọn rárá; a tún lè pa ìtumọ̀ τελεσφοροῦσιν mọ́ dáadáa nípa lílo ‘mú èso dé ìpọn.’'
  naturalness: Èdè náà dára, ó sì jẹ́ Yorùbá boṣewa ní ọ̀pọ̀ ibi. ‘Ń fún wọn pa’ kò wọ́pọ̀ tó ‘ń pa wọ́n lọ́mì’ nínú lílo òde òní, ṣùgbọ́n ‘pa lọ́mì’ ń ṣàfihàn ìpani-mí ju àwòrán ìdènà ìdàgbàsókè ohun ọ̀gbìn lọ. ‘Ń fún wọn pa’ lè dúró nítorí ó pa àwòrán ẹ̀gún mọ́. Àtúnṣe sí ìpín èso ló pọndandan fún ìtumọ̀ tó ṣókí, tó sì kedere.
  terminology: ‘Ẹ̀gún,’ ‘àníyàn,’ ‘ọrọ̀,’ àti ‘ìgbádùn ayé’ bá ọ̀rọ̀ Gíríìkì mu. ‘Ìpọn’ jẹ́ ọ̀rọ̀ kedere fún ìpò èso tí ó ti dàgbà dé ìparí/ti pọ́n, ó sì yẹ fún τελεσφοροῦσιν ju gbólóhùn ‘dé ìgbà tí yóò fi gbó’ lọ.
  issues:
