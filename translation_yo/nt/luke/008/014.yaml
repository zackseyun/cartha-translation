id: LUK.8.14
reference: Luke 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: yo
  text: Èyí tí ó bọ́ sí àárín àwọn ẹ̀gún sì ni àwọn tí wọ́n ti gbọ́; ṣùgbọ́n bí wọ́n ti ń lọ, àníyàn[a], ọrọ̀ àti ìgbádùn ayé ń fún wọn pa, wọn kò sì mú èso dé ìpọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdààmú” tàbí “ìṣòro ọkàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn kò mú èso dé ìparí,” tàbí “wọn kò so èso tí ó pọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: Èyí tí ó bọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí ó bọ́, ìyẹn irúgbìn inú àkàwé náà, ṣùgbọ́n kò fi ọ̀rọ̀ náà ‘irúgbìn’ kún ohun tí Gíríìkì kò sọ ní tààràtà.
- source_word: ἀκάνθας
  choice: àwọn ẹ̀gún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa àwòrán ohun ọ̀gbìn inú àkàwé náà mọ́.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ni àwọn tí wọ́n ti gbọ́
  rationale: ‘Wọ́n ti gbọ́’ fi hàn pé gbígbọ́ náà ti ṣẹlẹ̀, láìfi ohun tí wọ́n gbọ́ kún gbólóhùn Gíríìkì ní tààràtà.
- source_word: ὑπὸ μεριμνῶν
  choice: àníyàn
  rationale: ‘Àníyàn’ gba ìtumọ̀ ìdààmú tàbí ohun tí ń kó ìrònú bá ènìyàn, ó sì bá àkópọ̀ ọ̀rọ̀ inú ẹsẹ náà mu.
- source_word: πλούτου
  choice: ọrọ̀
  rationale: ‘Ọrọ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọrọ̀ ajé tàbí ọ̀pọ̀lọpọ̀ ohun ìní níbí.
- source_word: ἡδονῶν τοῦ βίου
  choice: ìgbádùn ayé
  rationale: Èyí fi ìgbádùn ìgbésí ayé ojoojúmọ́ hàn, ó sì pa ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: πορευόμενοι
  choice: bí wọ́n ti ń lọ
  rationale: Gbólóhùn yìí mú ìṣe tí ń bá a lọ jáde láìfi ìtumọ̀ míì kún un pé ó dájú pé gbogbo ìrìn ayé ni.
- source_word: συμπνίγονται
  choice: ń fún wọn pa
  rationale: Ọ̀rọ̀ yìí pa àwòrán àwọn ẹ̀gún tí ń fún ohun ọ̀gbìn pa mọ́, ó sì jẹ́ ọ̀nà ìsọ̀rọ̀ Yorùbá tí ó lágbára, tí ó sì ṣe kedere.
- source_word: οὐ τελεσφοροῦσιν
  choice: wọn kò sì so èso dé ìgbà tí yóò fi gbó
  rationale: Èyí pa àwòrán sísọ èso àti èrò pé èso náà kò dé ìgbó tàbí ìparí ìdàgbàsókè rẹ̀ mọ́.
theological_decisions:
- issue: Irú ìkùnà tí àwọn olùgbọ́ inú ilẹ̀ ẹlẹ́gùn ní
  choice: A pa àwòrán pé àwọn ohun ayé ń fún wọn pa àti pé èso wọn kò dé ìgbó mọ́, láìsọ ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
  alternative: A lè túmọ̀ rẹ̀ pé wọn kò gba ìgbàlà ní tòótọ́, pé onígbàgbọ́ ni wọ́n ṣùgbọ́n wọn di aláìléso, tàbí pé wọ́n bẹ̀rẹ̀ dáadáa ṣùgbọ́n wọ́n yí padà kúrò.
  rationale: Ẹsẹ náà sọ ohun tí àníyàn, ọrọ̀ àti ìgbádùn ayé ṣe sí àwọn olùgbọ́, ṣùgbọ́n kò dá ìjíròrò nípa ìfaradà, àtúnbí tàbí ìpàdánù èrè láre ní tààràtà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. Àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
