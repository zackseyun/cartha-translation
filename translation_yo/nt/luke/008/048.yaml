source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Ọmọbìnrin, ìgbàgbọ́ rẹ ti gbà ọ́ là[a]; máa lọ ní àlàáfíà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ rẹ ti mú ọ láradá,” tàbí “ìgbàgbọ́ rẹ ti wò ọ sàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwòsàn àti sí ìgbàlà.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Ọmọbìnrin
  rationale: Ó pa ọ̀rọ̀ ìpè orúkọ ìbátan náà mọ́, ó sì fi ìfẹ́ àti ìtùnú tí Jésù fi bá obìnrin náà sọ̀rọ̀ hàn láìṣe àfikún ìtumọ̀.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún ìgbẹ́kẹ̀lé onígbàgbọ́ rẹ̀ nínú Jésù, ó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: σέσωκέν
  choice: ti gbà ọ́ là
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìgbàlà tàbí sí mímú ara dá; ‘ti gbà ọ́ là’ pa ìtumọ̀ rẹ̀ tó gbòòrò àti ìjìnlẹ̀ ẹ̀kọ́ rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìwòsàn hàn.
- source_word: πορεύου
  choice: máa lọ
  rationale: Àṣẹ Yorùbá àdánidá ni èyí, ó sì bá ‘lọ’ nínú orísun mu láìfi ìtumọ̀ míì kún un.
- source_word: εἰς εἰρήνην
  choice: ní àlàáfíà
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé kí ó lọ pẹ̀lú àlàáfíà tàbí lábẹ́ ìbùkún àlàáfíà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ìbẹ̀rù obìnrin náà àti ọ̀rọ̀ ìtùnú Jésù.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ σῴζω nínú àyíká ìwòsàn
  choice: ‘ti gbà ọ́ là’ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘ti mú ọ lára dá’ tàbí ‘ti mú ọ láradá’
  rationale: Ìṣẹ̀lẹ̀ náà ní í ṣe pẹ̀lú ìwòsàn ara, ṣùgbọ́n σῴζω lè ní ìtumọ̀ tó gbòòrò ju ìwòsàn ara nìkan lọ. Ìtumọ̀ pàtàkì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ àti ìtumọ̀ méjèèjì mọ́; àlàyé ìsàlẹ̀ sì ṣàlàyé ìtumọ̀ ìwòsàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
