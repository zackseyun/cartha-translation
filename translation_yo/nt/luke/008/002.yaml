id: LUK.8.2
reference: Luke 8:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: yo
  text: 'àti àwọn obìnrin kan tí a ti mú láradá kúrò nínú àwọn ẹ̀mí búburú àti àìsàn: Màríà tí a ń pè ní Magidalénì, ẹni tí àwọn ẹ̀mí èṣù méje ti jáde lára rẹ̀,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: àwọn obìnrin kan
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí apá kan lára àwọn obìnrin; ‘àwọn obìnrin kan’ jẹ́ èdè Yorùbá àdánidá, ó sì pa àìdánimọ̀ tí τινες ní mọ́.
- source_word: τεθεραπευμέναι
  choice: tí a ti mú láradá
  rationale: Àkójọpọ̀ ἦσαν àti perfect passive participle tọ́ka sí ìmúláradá tí ó ti ṣẹlẹ̀ ṣáájú, tí àbájáde rẹ̀ sì ń bá a lọ. ‘A ti mú láradá’ lè gba ìtúsílẹ̀ kúrò lọ́wọ́ ẹ̀mí búburú àti ìwòsàn ara.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: kúrò lọ́wọ́ àwọn ẹ̀mí búburú
  rationale: ‘Àwọn ẹ̀mí búburú’ túmọ̀ πνεύματα πονηρά ní tààrà; ‘kúrò lọ́wọ́’ sì sọ ìdáǹdè kúrò nínú agbára wọn ní Yorùbá àdánidá.
- source_word: καὶ ἀσθενειῶν
  choice: àti àìsàn
  rationale: Àìsàn jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àìlera tàbí àrùn ara ní àyíká ọ̀rọ̀ yìí.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: ẹni tí a ń pè ní Magidalénì
  rationale: Gbólóhùn yìí fi orúkọ ìdánimọ̀ Màríà hàn ní ọ̀nà Yorùbá tí ó ṣe kedere, láì fi ìtumọ̀ mìíràn kún un.
- source_word: ἀφ’ ἧς
  choice: kúrò lára rẹ̀
  rationale: ἀπό fi ìyapa tàbí ibi tí ohun kan ti kúrò hàn; ‘kúrò lára rẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá nípa ẹ̀mí èṣù.
- source_word: δαιμόνια ἑπτὰ
  choice: àwọn ẹ̀mí èṣù méje
  rationale: ‘Ẹ̀mí èṣù’ ṣe ìyàtọ̀ sí ọ̀rọ̀ gbòòrò ‘ẹ̀mí búburú’ tí ó wà ní ìbẹ̀rẹ̀ ẹsẹ, ó sì pa iye méje mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐξεληλύθει
  choice: ti jáde
  rationale: Ìṣe pluperfect yìí fi hàn pé àwọn ẹ̀mí èṣù náà ti kúrò ṣáájú àsìkò ìtàn; ‘ti jáde’ pa ìṣe tí ó ti parí yìí mọ́ láì fipá yan láàárín ‘lọ jáde’ àti ‘wá jáde.’
theological_decisions:
- issue: Ọ̀nà tí a fi sọ ìpọ́njú láti ọ̀dọ̀ ẹ̀mí èṣù
  choice: A pa ‘àwọn ẹ̀mí búburú’ àti ‘àwọn ẹ̀mí èṣù’ mọ́ gẹ́gẹ́ bí àwọn aṣojú ti ara ẹ̀mí, ní yàtọ̀ sí àìsàn.
  alternative: Kí a ka àwọn ọ̀rọ̀ nípa ẹ̀mí sí àpẹẹrẹ lásán fún ìṣòro ọpọlọ tàbí àìsàn ara.
  rationale: Gíríìkì ya πνεύματα πονηρά àti δαιμόνια sọ́tọ̀ kúrò lọ́dọ̀ ἀσθένειαι. Ìtumọ̀ náà pa ìyàtọ̀ inú ẹsẹ mọ́ láì fi àlàyé ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ó sì ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá. A lo ‘Magidalénì’ gẹ́gẹ́ bí àkọsílẹ̀ Yorùbá fún Μαγδαληνή. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí ‘àwọn obìnrin kan’ ti gba ìtumọ̀ àìdánimọ̀ τινες, ‘ti jáde’ sì gba ìtumọ̀ ἐξεληλύθει láì nílò yíyan ‘lọ’ tàbí ‘wá.’
