id: LUK.8.10
reference: Luke 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: yo
  text: Ó sì wí pé, “A ti fi fún un yín láti mọ àwọn ohun ìjìnlẹ̀ ti ìjọba Ọlọ́run, ṣùgbọ́n fún àwọn ìyókù, a sọ fún wọn nípasẹ̀ àwọn àkàwé, kí wọ́n má rí bí wọ́n tilẹ̀ ń wò, kí òye má sì yé wọn bí wọ́n tilẹ̀ ń gbọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ yìí ń mú Aísáyà 6:9–10 wá sí ọkàn. Gbólóhùn “kí” lè fi ète, àbájáde ìdájọ́, tàbí àwọn méjèèjì hàn.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: a ti fi fún
  rationale: Ìṣe aláìlórúkọ ní àkókò pípé náà fi hàn pé fífún náà ti ṣẹlẹ̀, ipò tí ó yọrí sí sì ń bá a lọ; a kò sọ ẹni tí ó fún un, gẹ́gẹ́ bí Gíríìkì.
- source_word: γνῶναι
  choice: láti mọ
  rationale: ‘Mọ’ túmọ̀ γινώσκω ní tààrà, ó sì jẹ́ kí ó yàtọ̀ sí συνιῶσιν (‘òye yé’) ní ìparí ẹsẹ náà.
- source_word: μυστήρια
  choice: àwọn ohun ìjìnlẹ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí òtítọ́ ìjọba Ọlọ́run tí ó farapamọ́ tí a sì ṣí payá, kì í ṣe àṣírí lásán.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ó sì lè gba ìtumọ̀ agbègbè ìjọba àti ìṣàkóso Ọlọ́run.
- source_word: τοῖς δὲ λοιποῖς
  choice: ṣùgbọ́n fún àwọn ìyókù
  rationale: ‘Àwọn ìyókù’ pa ìtumọ̀ λοιποί mọ́ láì mú ‘àwọn tí ó wà lóde’ láti inú ìtàn tó jọra nínú Máàkù wọlé.
- source_word: ἐν παραβολαῖς
  choice: inú àwọn àkàwé ni ó wà
  rationale: A pèsè ọ̀rọ̀-ìṣe tí gbólóhùn Gíríìkì fi sílẹ̀ láìsọ, kí Yorùbá lè ṣe déédé, nígbà tí ‘inú àwọn àkàwé’ pa àpẹẹrẹ ἐν mọ́.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí pa agbára ète tàbí àbájáde ἵνα mọ́, láìyanju ìjà ẹ̀kọ́ nípa ète Ọlọ́run àti ìdájọ́.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: kí wọ́n lè má rí nígbà tí wọ́n ń wò
  rationale: Ó pa ìtúnlò gbòǹgbò ‘rí/wò’ àti ìyàtọ̀ láàárín wíwo àti ríran ní ti òye mọ́.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: kí òye sì má yé wọn nígbà tí wọ́n ń gbọ́
  rationale: ‘Òye yé wọn’ jẹ́ ọ̀nà Yorùbá àdánidá fún συνίημι, ó sì yàtọ̀ sí gbígbọ́ etí.
theological_decisions:
- issue: Agbára gbólóhùn ἵνα nínú ìtọ́kasí sí Aísáyà 6
  choice: kí ... lè
  alternative: tí àbájáde rẹ̀ fi jẹ́ pé; nítorí pé
  rationale: ‘Kí ... lè’ jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí ète, àbájáde ìdájọ́, tàbí àwọn méjèèjì; a kò rọ̀ ọ́ di àlàyé tí kò ní ìnira ẹ̀kọ́.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn ohun ìjìnlẹ̀’ dípò ọ̀rọ̀ àjèjì, a sì fi àmì ohùn sí ibi tí ó yẹ. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
