  terminology: ‘Ìjọba Ọlọ́run,’ ‘àwọn ohun ìjìnlẹ̀,’ àti ‘àkàwé’ jẹ́ àwọn ọ̀rọ̀ tó yẹ fún ìforúkọsílẹ̀ Bíbélì. ‘Òye yé wọn’ ṣàfihàn συνιῶσιν dáadáa, ó sì yàtọ̀ sí ‘gbọ́.’
