  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì ní pàtàkì: ìṣe pípé aláìlórúkọ nínú δέδοται, ‘ohun ìjìnlẹ̀’ fún μυστήρια, àti ìdààmú ète/àbájáde nínú ἵνα. Síbẹ̀, ‘inú àwọn àkàwé ni ó wà’ ní ìtọ́kasí tí kò yege díẹ̀ nínú Yorùbá, àti ‘nígbà tí wọ́n ń wò/gbọ́’ kò gbé ipa ìfaramọ́ (‘though’) tí a ti yàn nínú ọ̀rọ̀ àtúnyẹ̀wò Gẹ̀ẹ́sì jáde dáadáa.'
