revisions:
- from: Ó sì wí pé, “Ẹ̀yin ni a ti fi fún láti mọ àwọn ohun ìjìnlẹ̀ ti ìjọba Ọlọ́run, ṣùgbọ́n fún àwọn ìyókù, inú àwọn àkàwé ni ó wà, kí wọ́n lè má rí nígbà tí wọ́n ń wò, kí òye sì má yé wọn nígbà tí wọ́n ń gbọ́.”[a]
  to: Ó sì wí pé, “A ti fi fún un yín láti mọ àwọn ohun ìjìnlẹ̀ ti ìjọba Ọlọ́run, ṣùgbọ́n fún àwọn ìyókù, a sọ fún wọn nípasẹ̀ àwọn àkàwé, kí wọ́n má rí bí wọ́n tilẹ̀ ń wò, kí òye má sì yé wọn bí wọ́n tilẹ̀ ń gbọ́.”[a]
  rationale: Àtúnṣe náà ń jẹ́ kí apá ellipsis ‘ṣùgbọ́n fún àwọn ìyókù ἐν παραβολαῖς’ jẹ́ gbolohun Yorùbá tí ó yege, láì yí ìyàtọ̀ tó wà láàárín ìfihàn fún àwọn ọmọ-ẹ̀yìn àti àkàwé fún àwọn ìyókù padà. ‘Kí’ pa ìfẹ̀sẹ̀mulẹ̀ ἵνα mọ́ láì pinnu ìbéèrè ẹ̀kọ́ nípa ète tàbí àbájáde; ‘bí wọ́n tilẹ̀’ sì ṣàfihàn ipa ìfaramọ́ nínú ìtẹ̀lé Aísáyà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:32Z'
