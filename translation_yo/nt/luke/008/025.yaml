- from: Ó sì sọ fún wọn pé, “Ibo ni ìgbàgbọ́ yín[a] wà?” Ẹ̀rù sì bà wọ́n, ẹnu sì yà wọ́n, wọ́n ń sọ fún ara wọn pé, “Ta wá ni ẹni yìí, tí ó ń pàṣẹ fún àwọn afẹ́fẹ́ àti omi pàápàá, tí wọ́n sì ń ṣègbọ́ràn sí i?”
  to: Ó sì sọ fún wọn pé, “Ìbo ni ìgbàgbọ́ yín[a] wà?” Ẹ̀rù sì bà wọ́n, ẹnu sì yà wọ́n, wọ́n ń sọ fún ara wọn pé, “Ta wá ni ẹni yìí, tí ó ń pàṣẹ fún àní àwọn afẹ́fẹ́ àti omi, tí wọ́n sì ń ṣègbọ́ràn sí i?”
  rationale: A tún ‘Ibo’ ṣe sí ‘Ìbo’ láti mú àmì ohùn Yorùbá boṣewa péye. A rọ́pò ‘pàápàá’ pẹ̀lú ‘àní’ kí ìtẹnumọ́ ‘even’ má bàa dà bí ẹni pé omi nìkan ni ó kan, ṣùgbọ́n kí ó kan àwọn afẹ́fẹ́ àti omi gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe hàn.
