id: LUK.8.25
reference: Luke 8:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ìbo ni ìgbàgbọ́ yín[a] wà?” Ẹ̀rù sì bà wọ́n, ẹnu sì yà wọ́n, wọ́n ń sọ fún ara wọn pé, “Ta wá ni ẹni yìí, tí ó ń pàṣẹ fún àní àwọn afẹ́fẹ́ àti omi, tí wọ́n sì ń ṣègbọ́ràn sí i?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé.” A tún lè lóye ìbéèrè Jesu sí wọn gẹ́gẹ́ bí, “Ìbo ni ìgbẹ́kẹ̀lé yín wà?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Ibo ni ... wà?
  rationale: Èyí pa ìbéèrè nípa ibi tàbí wíwà ìgbàgbọ́ wọn mọ́, láì túmọ̀ ọ́ sí ‘Kí ló dé tí ẹ kò ní ìgbàgbọ́?’
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún πίστις; ní àyíká yìí ó tún ní ìtumọ̀ fífi ọkàn tán ẹni kan.
- source_word: φοβηθέντες
  choice: Ẹ̀rù sì bà wọ́n
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n bẹ̀rù, ó sì pa ìdáhùn ẹ̀rù tí participle Gíríìkì fi hàn mọ́.
- source_word: ἐθαύμασαν
  choice: ẹnu sì yà wọ́n
  rationale: Èyí sọ ìyàlẹ́nu àti ìṣẹ̀lẹ̀ tí ó mú wọn ṣe kàyéfì ní Yorùbá òde òní tí ó ṣe kedere.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Ta wá ni ẹni yìí
  rationale: '‘Wá’ mú agbára ìbéèrè ìparí èrò ἄρα jáde: lẹ́yìn ohun tí wọ́n rí, irú ẹni wo ni ẹni yìí?'
- source_word: ἐπιτάσσει
  choice: ń pàṣẹ fún
  rationale: Èyí túmọ̀ ìṣe pípàṣẹ tàbí fífúnni ní àṣẹ ní tààrà, láì gbé ọ̀rọ̀ ‘bá ... wí’ láti ẹsẹ tó ṣáájú wọ inú rẹ̀.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: àwọn afẹ́fẹ́ àti omi
  rationale: Èyí pa ọ̀pọ̀ ‘afẹ́fẹ́’ àti ẹyọ ‘omi’ inú Gíríìkì mọ́, dípò lílo ‘ìgbì’ tàbí ‘òkun’ láti inú ìtàn tó jọ ọ́.
- source_word: ὑπακούουσιν αὐτῷ
  choice: wọ́n sì ń ṣègbọ́ràn sí i
  rationale: ‘Ṣègbọ́ràn sí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìgbọràn sí àṣẹ, ó sì pa àwòrán ẹ̀dá tí ń dáhùn bí ẹni pé wọ́n jẹ́ ènìyàn mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πίστις níbi tí ó tún lè túmọ̀ sí fífi ọkàn tán ẹni kan
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó gbòòrò mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé jẹ́ kí òǹkàwé rí ìtumọ̀ ‘ìgbẹ́kẹ̀lé’ tó bá àyíká ewu yìí mu.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ìṣètò ọ̀rọ̀ Yorùbá àdánidá fún ẹ̀rù àti ìyàlẹ́nu, ṣùgbọ́n a pa ìbéèrè tààrà, ọ̀pọ̀ ‘afẹ́fẹ́,’ ẹyọ ‘omi,’ àti agbára ìpàṣẹ mọ́.
