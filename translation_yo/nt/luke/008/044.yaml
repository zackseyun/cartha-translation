  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: yo
  text: Ó súnmọ́ ọn láti ẹ̀yìn, ó sì kan etí aṣọ rẹ̀[a]; lẹ́sẹ̀kẹsẹ̀, ìṣàn ẹ̀jẹ̀ rẹ̀ sì dáwọ́ dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣẹ́tí aṣọ rẹ̀” tàbí “okùn etí aṣọ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Ó wá láti ẹ̀yìn rẹ̀
  rationale: Ó fi ìṣípò obìnrin náà sí ọ̀dọ̀ Jésù láti ẹ̀yìn hàn ní Yorùbá àdánidá, ó sì pa ìṣe tó ṣáájú fífi ọwọ́ kàn mọ́.
- source_word: ἥψατο
  choice: ó sì fọwọ́ kan
  rationale: ‘Fọwọ́ kan’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ọwọ́ tẹ ohun kan, láìfi ìtumọ̀ mímú un gidigidi kún ọ̀rọ̀ náà.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: etí aṣọ rẹ̀
  rationale: ‘Etí aṣọ’ lè túmọ̀ sí ẹ̀gbẹ́ tàbí ìṣẹ́tí aṣọ, ó sì yẹra fún ṣíṣe pàtó ju èdè Gíríìkì lọ; àṣàyàn ‘okùn etí aṣọ’ wà nínú àlàyé ìsàlẹ̀.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó mú ìṣẹ̀lẹ̀ ojijì àti àkókò tí kò ní ìdádúró inú ọ̀rọ̀ náà jáde ní Yorùbá òde òní.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: ìṣàn ẹ̀jẹ̀ rẹ̀ sì dáwọ́ dúró
  rationale: Ó pa àwòrán ‘ìṣàn ẹ̀jẹ̀’ inú Gíríìkì mọ́, nígbà tí ‘dáwọ́ dúró’ sọ ìdáwọ́ rẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ àṣà Júù tó ṣeé ṣe nínú κράσπεδον
  choice: etí aṣọ
  alternative: ìṣẹ́tí aṣọ tàbí okùn etí aṣọ
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí etí aṣọ lápapọ̀ tàbí sí okùn tó wà ní etí aṣọ àwọn Júù. Ẹsẹ yìí kò fi dandan mú ká yan ìtọ́kasí pàtó sí òfin nípa okùn aṣọ, nítorí náà a lo ọ̀rọ̀ gbòòrò nínú ẹsẹ, a sì pa àwọn àṣàyàn mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
