  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: yo
  text: Nígbà tí Jésù padà dé, ogunlọ́gọ̀ náà kí i káàbọ̀[a], nítorí gbogbo wọn ni wọ́n ń dúró de e[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ogunlọ́gọ̀ náà gbà á”; ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí gbígba ẹni tàbí kíka ẹni káàbọ̀, ó sì ní ìtumọ̀ rere níhìn-ín.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí gbogbo wọn ni wọ́n ń retí rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Nígbà tí ... padà dé
  rationale: Ẹ̀yà ἐν + ọ̀rọ̀-ìṣe aláìlẹ́ni pẹ̀lú akọ́tọ̀ jẹ́ gbólóhùn àsìkò; “Nígbà tí” túmọ̀ ọ́ lọ́nà àdánidá. A kò fi δέ hàn ní ọ̀rọ̀ ọ̀tọ̀, nítorí ìtẹ̀síwájú ìtàn náà ti ṣe kedere láìfi àsopọ̀ tí ó wuwo kún un.
- source_word: ὑποστρέφειν
  choice: padà dé
  rationale: ὑποστρέφω túmọ̀ sí láti padà tàbí láti dé padà; “padà dé” bá ọ̀nà tí Yorùbá fi ń sọ ìpadàbọ̀ dé ibi kan mu.
- source_word: ἀπεδέξατο
  choice: fi tayọ̀tayọ̀ gbà á
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígba ẹni lọ́nà rere. “Fi tayọ̀tayọ̀ gbà á” mú ìtumọ̀ ìkáàbọ̀ hàn láìfi “pẹ̀lú ayọ̀” tí kò sí ní kedere nínú Gíríìkì kún un.
- source_word: ὁ ὄχλος
  choice: ogunlọ́gọ̀ náà
  rationale: ὄχλος jẹ́ àwùjọ ènìyàn tí ó péjọ; “ogunlọ́gọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ àwùjọ mọ́.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: nítorí gbogbo wọn ni wọ́n ń dúró dè é
  rationale: γάρ sọ ìdí tí wọ́n fi gbà á, προσδοκάω sì lè túmọ̀ sí dídúró de tàbí fífi ojú sọ́nà. Àmì “ń” pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, “gbogbo wọn ni” sì tẹnu mọ́ πάντες.
