id: LUK.8.55
reference: Luke 8:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: yo
  text: Ẹ̀mí rẹ̀ sì padà[a], lẹ́sẹ̀kẹsẹ̀ ni ó sì dìde, ó sì pàṣẹ pé kí wọ́n fún un ní ohun tí yóò jẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èémí rẹ̀ sì padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: padà
  rationale: “Padà” sọ ìpadàbọ̀ ẹ̀mí ọmọbìnrin náà ní ọ̀nà àdánidá, láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: ẹ̀mí rẹ̀
  rationale: “Ẹ̀mí rẹ̀” bá ìtumọ̀ πνεῦμα nínú àyíká jíjí dìde yìí mu, ó sì pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ náà mọ́. “Èémí rẹ̀” (breath) tún ṣeé ṣe, a sì fi sí àlàyé ìsàlẹ̀.
- source_word: ἀνέστη
  choice: ó dìde
  rationale: “Ó dìde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìgbésẹ̀ ara tí ἀνέστη ń sọ mu.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé ọmọbìnrin náà dìde ní kánkán, láìsí ìdádúró.
- source_word: διέταξεν
  choice: ó pàṣẹ
  rationale: “Ó pàṣẹ” pa agbára àṣẹ tí διατάσσω ní mọ́, ó sì yẹ fún ìtọ́ni pàtó tí Jésù fún wọn.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: kí wọ́n fún un ní ohun tí yóò jẹ
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó pa ìṣe fífúnni nínú δοθῆναι mọ́, ó sì mú φαγεῖν, “jẹ,” hàn ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nínú àyíká jíjí ẹni tí ó kú dìde
  choice: ẹ̀mí rẹ̀ padà
  alternative: èémí rẹ̀ padà
  rationale: “Ẹ̀mí” pa ìwọ̀n ọ̀rọ̀ Gíríìkì àti ìjìnlẹ̀ ìtàn náà mọ́ láìdín ohun tó ṣẹlẹ̀ kù sí mímí afẹ́fẹ́ nìkan. Síbẹ̀, “èémí” jẹ́ ìtumọ̀ ọ̀rọ̀ tó ṣeé ṣe, nítorí náà a tọ́ka sí i ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lasán. A lo “lẹ́sẹ̀kẹsẹ̀ ni ó sì dìde” láti tẹnumọ́ ìyára ìṣẹ̀lẹ̀ náà, àti “ohun tí yóò jẹ” láti mú φαγεῖν hàn ní kedere.
