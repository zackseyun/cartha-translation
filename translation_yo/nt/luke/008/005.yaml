source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: yo
  text: Afúnrúgbìn kan jáde lọ láti fún irúgbìn rẹ̀ ká. Bí ó sì ti ń fún irúgbìn náà, diẹ̀ nínú rẹ̀ ṣubú sí ẹ̀gbẹ́ ọ̀nà; a tẹ̀ ẹ́ mọ́lẹ̀, àwọn ẹyẹ ojú ọ̀run[a] sì jẹ ẹ́ run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ẹyẹ ọ̀run”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: Afúnrúgbìn kan jáde lọ
  rationale: Ọ̀rọ̀-orúkọ iṣẹ́ “afúnrúgbìn” fi articular participle hàn ní ṣókí; “kan” jẹ́ àdámọ̀ Yorùbá nínú ìbẹ̀rẹ̀ àkàwé, bí ó tilẹ̀ jẹ́ pé Greek ní definite article.
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: láti fún irúgbìn rẹ̀
  rationale: Articular infinitive náà ń sọ ète ìjáde rẹ̀; “fún irúgbìn” jẹ́ ọ̀nà àdánidá láti sọ fífọ́n irúgbìn ká ní Yorùbá.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Bí ó sì ti ń fún un
  rationale: Ìṣètò yìí pa ìtumọ̀ ìgbà kan náà mọ́, ó sì lo arọ́pò-orúkọ “un” láti yẹra fún àtúnsọ tí kò ṣe pàtàkì.
- source_word: ὃ μὲν
  choice: apá kan
  rationale: Ó tọ́ka sí ìpín kan nínú irúgbìn náà, ó sì mú ìṣètò àwọn ibi oríṣiríṣi tí ó tẹ̀ lé hàn.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: bọ́ sí ẹ̀gbẹ́ ọ̀nà
  rationale: “Ẹ̀gbẹ́ ọ̀nà” pa ìtumọ̀ παρά mọ́ gẹ́gẹ́ bí ibi lẹ́gbẹ̀ẹ́ ọ̀nà, láì lo ọ̀rọ̀ àtijọ́.
- source_word: κατεπατήθη
  choice: a tẹ̀ ẹ́ mọ́lẹ̀
  rationale: Passive aláìdárúkọ olùṣe ní Greek ni a mú wá pẹ̀lú passive “a” ti Yorùbá; “tẹ̀ ... mọ́lẹ̀” sọ ìtẹ̀mọ́lẹ̀ ní kedere.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó mọ́gbọ́n dání fún àwọn ẹyẹ tí ń fò lókè, ó sì pa àwòrán οὐρανός mọ́.
- source_word: κατέφαγεν αὐτό
  choice: jẹ ẹ́ run
  rationale: “Jẹ ... run” mú agbára ọ̀rọ̀ κατεσθίω hàn ju “jẹ” lásán lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àkànṣe, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “afúnrúgbìn” dípò àlàyé gígùn, a sì lo passive “a” láti pa aláìdárúkọ olùṣe mọ́.
