  to: Afúnrúgbìn kan jáde lọ láti fún irúgbìn rẹ̀ ká. Bí ó sì ti ń fún irúgbìn náà, diẹ̀ nínú rẹ̀ ṣubú sí ẹ̀gbẹ́ ọ̀nà; a tẹ̀ ẹ́ mọ́lẹ̀, àwọn ẹyẹ ojú ọ̀run[a] sì jẹ ẹ́ run.
  rationale: Àtúnṣe náà sọ ohun tí afúnrúgbìn ń ṣe di kedere pẹ̀lú “fún irúgbìn ... ká,” ó sì rọ́pò arọ́pò-orúkọ tí ó lè dàrú pẹ̀lú “irúgbìn náà.” “Diẹ̀ nínú rẹ̀ ṣubú” pa ìtumọ̀ pínpín ὃ μὲν mọ́, ní Yorùbá àdánidá. Kò sí ìyípadà sí ìtumọ̀, ìforígbárí ọ̀rọ̀, tàbí àmì ẹsẹ̀ ìsàlẹ̀.
