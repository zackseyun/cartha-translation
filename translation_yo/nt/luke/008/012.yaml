id: LUK.8.12
reference: Luke 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: yo
  text: Àwọn tí ó wà lẹ́gbẹ̀ẹ́ ọ̀nà ni àwọn tí wọ́n ti gbọ́ ọ̀rọ̀ náà; lẹ́yìn náà, Èṣù wá, ó sì mú ọ̀rọ̀ náà[a] kúrò nínú ọkàn wọn, kí wọ́n má bàa gbàgbọ́ kí wọ́n sì rí ìgbàlà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọ̀rọ̀ náà” níbí ń tọ́ka sí ọ̀rọ̀ Ọlọ́run tí a ń kéde nínú òwe náà.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: Ó pa àwòrán ibi tí ó wà ní ẹ̀gbẹ́ ọ̀nà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἀκούσαντες
  choice: tí wọ́n ti gbọ́ ọ̀rọ̀ náà
  rationale: Àkókò ìṣe náà tọ́ka sí àwọn tí wọ́n ti gbọ́ iṣẹ́ ìkéde náà; fífi ohun tí wọ́n gbọ́ hàn jẹ́ èdè Yorùbá àdánidá nínú àyíká yìí.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn ní kedere.
- source_word: ὁ διάβολος
  choice: Èṣù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá búburú náà gẹ́gẹ́ bí ẹni kan; “Èṣù” ni àkọ́lé Yorùbá tí ó wọ́pọ̀ jù lọ fún un.
- source_word: αἴρει
  choice: a sì mú ... kúrò
  rationale: Ó túmọ̀ sí yíyọ ohun kan kúrò tàbí gbígbé e lọ; gbolohun yìí jẹ́ ti ara Yorùbá láìfi ipa líle tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì mọ́, nígbà tí àyíká òwe náà fi hàn pé iṣẹ́ ìkéde Ọlọ́run ni a ń sọ.
- source_word: τῆς καρδίας αὐτῶν
  choice: nínú ọkàn wọn
  rationale: “Ọkàn” pa ìtumọ̀ Bíbélì ti ibi ìrònú, ìfẹ́ inú àti ìdáhùn ènìyàn mọ́; “wọn” tún fi ọ̀pọ̀ ènìyàn inú Gíríìkì hàn.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: kí wọn má bà á gbàgbọ́, kí a sì gbà wọ́n là
  rationale: Ó pa ète tàbí àbájáde ìṣe Èṣù mọ́, ó sì sọ ìgbàgbọ́ àti ìgbàlà ní ọ̀nà àdánidá láìfi àlàyé ẹ̀kọ́ ìsìn kan kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìgbàgbọ́ àti ìgbàlà
  choice: kí wọn má bà á gbàgbọ́, kí a sì gbà wọ́n là
  alternative: Àwọn ìtumọ̀ tí yóò ṣàlàyé ìgbàgbọ́ gẹ́gẹ́ bí ìmọ̀ lásán, tàbí tí yóò fi ẹ̀kọ́ ẹ̀sìn kan nípa bí ìgbàlà ṣe ń ṣẹlẹ̀ kún ọ̀rọ̀ náà
  rationale: Gíríìkì sọ pé Èṣù ń mú ọ̀rọ̀ náà kúrò láti dí ìgbàgbọ́ àti ìgbàlà lọ́wọ́. Ìtumọ̀ náà pa ìfẹ̀hónúhàn yìí mọ́ láìyanjú àríyànjiyàn ẹ̀kọ́ ìsìn tí ó gbòòrò sí i.
- issue: Olùṣe ìgbàlà nínú ọ̀rọ̀ aláìṣe σωθῶσιν
  choice: kí a sì gbà wọ́n là
  alternative: kí wọ́n sì rí ìgbàlà
  rationale: Ìlò “a” aláìsọ ẹni pàtó jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣe aláìṣe Gíríìkì mọ́, láìfi olùṣe kan tí ẹsẹ náà kò dárúkọ sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. “Èṣù a wá, a sì mú” ń fi ìṣe tí ó máa ń ṣẹlẹ̀ nínú àlàyé òwe hàn; a yà “a” àmì ìṣe àṣà kúrò lọ́dọ̀ arọ́pò-orúkọ “a” inú gbolohun ìgbàlà nípasẹ̀ àyíká.
