id: LUK.8.17
reference: Luke 8:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: yo
  text: Nítorí kò sí ohun tí ó farapamọ́ tí kò ní di ohun tí ó hàn gbangba[a]; bẹ́ẹ̀ ni kò sí ohun àṣírí tí a kò ní mọ̀[b] àti tí kò ní wá sí gbangba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kì yóò hàn gbangba.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí a ó mọ̀ dájúdájú”; àgbékalẹ̀ Gíríìkì náà fi ìdánilójú líle hàn pé kò sí ohun àṣírí tí yóò wà láìdi mímọ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí kò ní wá sí ìmọ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: ohun tí ó farapamọ́
  rationale: Ó túmọ̀ sí ohun tí a fi pamọ́ tàbí tí kò hàn; ‘ohun tí ó farapamọ́’ jẹ́ Yorùbá àdánidá, ó sì bá ìtumọ̀ ìfihàn rẹ̀ mu.
- source_word: φανερὸν
  choice: hàn gbangba
  rationale: Nínú gbólóhùn àkọ́kọ́, ó tako κρυπτόν, ó sì fi hàn pé ohun náà yóò di mímọ̀ ní gbangba.
- source_word: γενήσεται
  choice: yóò hàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìyípadà ipò láti inú fífarapamọ́ sí híhàn; ‘yóò hàn’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἀπόκρυφον
  choice: ohun àṣírí
  rationale: ‘Ohun àṣírí’ pa ìyàtọ̀ kékeré mọ́ láàárín ọ̀rọ̀ yìí àti κρυπτόν, bó tilẹ̀ jẹ́ pé àwọn méjèèjì jọ ń tọ́ka sí ohun tí a fi pamọ́.
- source_word: οὐ μὴ γνωσθῇ
  choice: tí a kì yóò mọ̀
  rationale: Àkójọpọ̀ ìsẹ́lọ́nà náà jẹ́ ìkọ̀ líle; nínú àgbékalẹ̀ ‘kò sí … tí a kì yóò mọ̀,’ Yorùbá náà fi ìdánilójú hàn pé kò sí ohun àṣírí tí yóò wà láìdi mímọ̀.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: tí yóò sì jáde sí gbangba
  rationale: Èyí jẹ́ ọ̀nà àsọyé fún ohun tí a mú kúrò ní ìkọ̀kọ̀ tí ó sì di ohun tí gbogbo ènìyàn lè rí tàbí mọ̀.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
theological_decisions:
- issue: Ìwọ̀n ohun tí ọ̀rọ̀ nípa ìṣípayá yìí kàn
  choice: A pa á mọ́ gẹ́gẹ́ bí ìlànà gbogbogbò pé ohun tí ó farapamọ́ tàbí tí ó jẹ́ àṣírí yóò farahàn níkẹyìn.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìṣípayá ní ọjọ́ ìdájọ́ ìkẹyìn, tàbí sí ìfihàn ẹ̀kọ́ Jesu nìkan.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò sọ àkókò tàbí ìṣẹ̀lẹ̀ pàtó tí ìfihàn náà yóò ṣẹlẹ̀; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, tí àwọn òǹkàwé lásán lè lóye. Àwọn ọ̀rọ̀ ‘farapamọ́,’ ‘àṣírí,’ àti ‘gbangba’ pa ìbádọ́gba àti ìtẹnumọ́ inú Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó lé e lórí.
