  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: yo
  text: 'Èyí sì ni àkàwé náà: irúgbìn náà ni ọ̀rọ̀ Ọlọ́run.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èyí sì ni ìtumọ̀ àkàwé náà.” Ní ọ̀nà tí ó sún mọ́ èdè Gíríìkì jù, ó kà pé, “Èyí sì ni àkàwé náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ni
  rationale: Ọ̀rọ̀ ìsopọ̀ náà bẹ̀rẹ̀ àlàyé Jésù ní tààrà; “ni” pa ìlànà ọ̀rọ̀ Gíríìkì mọ́ láìfi “ìtumọ̀” kún un.
- source_word: δὲ
  choice: sì
  rationale: “Sì” fi ìyípadà pẹ̀lẹ́ láti inú àkàwé sí àlàyé rẹ̀ hàn, gẹ́gẹ́ bí δέ ṣe ń ṣiṣẹ́ nínú ọ̀rọ̀.
- source_word: αὕτη ἡ παραβολή
  choice: Èyí sì ni àkàwé náà
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, “èyí ni àkàwé náà,” dípò fífi ọ̀rọ̀ ìtumọ̀ tàbí àlàyé tí kò sí nínú orísun kún un.
- source_word: σπόρος
  choice: irúgbìn
  rationale: “Irúgbìn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a fún, ó sì lè dúró gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ bí ẹyọ Gíríìkì náà.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” pa ìtumọ̀ ohun tí Ọlọ́run sọ tàbí iṣẹ́ tí ó rán mọ́, ó sì jẹ́ èdè Bíbélì tí ó yé àwọn òǹkàwé òde òní.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ètò “ọ̀rọ̀ Ọlọ́run” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbátan genitive Gíríìkì hàn láìtúmọ̀ rẹ̀ sí “ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run.”
theological_decisions:
- issue: Bóyá kí a tú παραβολή sí “àkàwé” tàbí kí a mú un gbòòrò sí “ìtumọ̀/àlàyé àkàwé náà”
  choice: àkàwé
  alternative: ìtumọ̀ àkàwé náà
  rationale: Bí ó tilẹ̀ jẹ́ pé Jésù ń ṣàlàyé àkàwé náà ní àyíká ọ̀rọ̀, Gíríìkì sọ ní tààrà pé “èyí ni àkàwé náà.” A pa ìfọ̀rọ̀wérọ̀ àti ìṣòro kékeré yìí mọ́, a sì ṣàlàyé àṣàyàn míì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “àkàwé,” “irúgbìn,” àti “ọ̀rọ̀ Ọlọ́run” gẹ́gẹ́ bí àwọn ọ̀rọ̀ àdánidá tí ó pa àwòrán àti ìlànà orísun mọ́.
