  to: nítorí ọmọbìnrin rẹ̀ kan ṣoṣo[a] ni ó ní, ẹni tí ó jẹ́ ọmọ ọdún méjìlá ní nǹkan bí[b], ó sì ń kú. Bí Jesu sì ti ń lọ, àwọn èrò náà ń há mọ́ ọn gidigidi[c].
  rationale: A tún gbolohun ọjọ́-ori ṣe kí ó fi ìṣirò ὡς hàn dáadáa. A yọ àbájáde pé Jesu fẹ́rẹ̀ẹ́ má lè mí kúrò nínú ìtumọ̀ àkọ́kọ́, nítorí pé ó jẹ́ ìmúgbòòrò agbára συνέπνιγον; a sì fi ìṣeeṣe yẹn sí ìsàlẹ̀ ojúewé. Àwọn àmì ìsàlẹ̀ ojúewé wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ṣàlàyé.
