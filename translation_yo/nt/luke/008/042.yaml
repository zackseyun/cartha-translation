source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: yo
  text: nítorí ọmọbìnrin rẹ̀ kan ṣoṣo[a] ni ó ní, ẹni tí ó jẹ́ ọmọ ọdún méjìlá ní nǹkan bí[b], ó sì ń kú. Bí Jesu sì ti ń lọ, àwọn èrò náà ń há mọ́ ọn gidigidi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọbìnrin kan ṣoṣo ni ó ní.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà fi hàn pé ọjọ́-ori náà jẹ́ ìṣirò, kì í ṣe iye pípé.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà lè fi títẹ̀ mọ́lẹ̀ gidigidi hàn, débi tí ó lè ṣòro fún un láti mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: ọmọbìnrin kan ṣoṣo
  rationale: Ní ìbámu pẹ̀lú θυγάτηρ, ọ̀rọ̀ náà túmọ̀ sí ọmọbìnrin kan ṣoṣo tí ọkùnrin náà ní; kò tọ́ka sí bí a ṣe bí i.
- source_word: ὡς ἐτῶν δώδεκα
  choice: ẹni tí ó fẹ́rẹ̀ẹ́ pé ọmọ ọdún méjìlá
  rationale: ὡς níwájú iye ọdún fi hàn pé iye náà jẹ́ àfojúsùn, kì í ṣe iye pípé.
- source_word: ἀπέθνῃσκεν
  choice: ń kú lọ
  rationale: Ìṣe aláìparí náà ṣàpèjúwe ikú gẹ́gẹ́ bí ohun tí ń lọ lọ́wọ́, kì í ṣe pé ó ti kú tán.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Bí Jesu sì ti ń lọ
  rationale: Ìtumọ̀ náà pa ìṣe méjì tí ń ṣẹlẹ̀ ní àkókò kan náà mọ́; lílo orúkọ Jesu mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá láìfi ìtumọ̀ tuntun kún un.
- source_word: οἱ ὄχλοι
  choice: àwọn èrò náà
  rationale: Àwọn èrò jẹ́ ọ̀nà àdánidá láti fi ọ̀pọ̀ ènìyàn tí ó kóra jọ hàn, ó sì lè gbé agbára ọ̀pọ̀ nínú Gíríìkì.
- source_word: συνέπνιγον
  choice: ń há mọ́ ọn débi pé ó fẹ́rẹ̀ẹ́ má lè mí
  rationale: Ọ̀rọ̀ náà lágbára ju pé wọ́n kàn ń yí i ká lọ; ó fi híhá mọ́ni gidigidi, tó fẹ́rẹ̀ẹ́ dí èémí, hàn.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó pa ìsopọ̀ ìdí mọ́ pẹ̀lú ẹ̀bẹ̀ Jairusi nínú ẹsẹ tó ṣáájú.
- source_word: αὐτῷ
  choice: tí ó ní
  rationale: Dative ohun-ìní náà jẹ́ àdánidá ní Yorùbá gẹ́gẹ́ bí ‘tí ó ní.’
