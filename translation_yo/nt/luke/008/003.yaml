id: LUK.8.3
reference: Luke 8:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: yo
  text: àti Jóánà[a], aya Kúsà, olùṣàkóso ilé Hẹ́rọ́dù, àti Súsánà, àti ọ̀pọ̀ àwọn obìnrin mìíràn, tí wọ́n ń ṣe ìránṣẹ́ fún wọn láti inú ohun ìní wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “fún un” dípò “fún wọn.”
    reason: textual_variant
  - marker: b
    text: Tàbí “láti inú ohun tí wọ́n ní” tàbí “láti inú ohun-ìní tiwọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: aya Kúsà
  rationale: Nínú àfikún orúkọ yìí, γυνή pẹ̀lú orúkọ ẹni nínú genitive túmọ̀ sí ‘aya’ lọ́nà àdánidá.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: olùṣàkóso ilé Hẹ́rọ́dù
  rationale: ἐπίτροπος ń tọ́ka sí ẹni tí a fi àbójútó ohun-ìní tàbí ọ̀ràn ilé lé lọ́wọ́; ‘olùṣàkóso ilé’ bá àyíká ààfin tàbí ilé ńlá mu, kò sì ní ìtumọ̀ ilé-iṣẹ́ òde òní.
- source_word: ἕτεραι πολλαί
  choice: ọ̀pọ̀ àwọn obìnrin mìíràn
  rationale: Fọ́ọ̀mù abo ọ̀pọ̀ náà ń tọ́ka sí àwọn obìnrin; fífi ‘àwọn obìnrin’ hàn mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: αἵτινες διηκόνουν
  choice: tí wọ́n ń ... ṣe ìránṣẹ́
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe iṣẹ́ tí wọ́n ń ṣe lọ́wọ́; ‘ṣe ìránṣẹ́’ pa ìtumọ̀ fífẹ̀ διακονέω mọ́ láìfi ipò ìjọ kan kún un.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: A tẹ̀lé ọ̀rọ̀ Gíríìkì ọ̀pọ̀ αὐτοῖς, èyí tí ó ṣeé ṣe kí ó tọ́ka sí Jésù àti àwọn tí ó wà pẹ̀lú rẹ̀.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: fi ohun ìní wọn
  rationale: Gbólóhùn náà sọ pé iṣẹ́ ìrànlọ́wọ́ wọn jáde láti inú ohun tàbí ohun-ìní tí ó jẹ́ tiwọn; ‘ohun ìní wọn’ jẹ́ kedere, ó sì sún mọ́ ọ̀rọ̀ ìpilẹ̀.
theological_decisions:
- issue: Ẹni tí αὐτοῖς ń tọ́ka sí
  choice: 'ọ̀pọ̀: wọ́n ń ṣe ìránṣẹ́ fún wọn'
  alternative: 'ẹyọ: wọ́n ń ṣe ìránṣẹ́ fún un, ìyẹn Jésù'
  rationale: SBLGNT tí a pèsè ní αὐτοῖς, ọ̀rọ̀ ọ̀pọ̀. Ìtumọ̀ náà tẹ̀lé ẹ̀rí yìí, kò sì yí i sí ẹyọ láti bá àwọn ẹ̀dà mìíràn mu.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A kọ àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì sọ abo tí ἕτεραι πολλαί tọ́ka sí ní gbangba fún ìṣírí kedere.
