  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Ṣùgbọ́n” yẹ fún δέ nínú ìṣàn ìtàn; “ó di ọwọ́ rẹ̀ mú” sọ κρατήσας τῆς χειρὸς αὐτῆς ní ọ̀nà Yorùbá tó wúlò; “ó sì ké pé” mú ìpè ohùn ἐφώνησεν λέγων hàn; “Ọmọ, dìde” sì pa ìwọ̀n àti ìfẹ́ inú Ἡ παῖς, ἔγειρε mọ́. Ọ̀rọ̀ arọ́pò-orúkọ “rẹ̀” lè jẹ́ aláìlóbìí ní ìdánìkanṣo ẹsẹ, ṣùgbọ́n àyíká ìtàn fi ẹni tí ọwọ́ náà jẹ́ hàn kedere, kò sì yí ìtumọ̀ padà.'
