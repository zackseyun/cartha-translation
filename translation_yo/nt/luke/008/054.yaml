  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: yo
  text: Ṣùgbọ́n ó di ọwọ́ rẹ̀ mú, ó sì ké pé, “Ọmọ[a], dìde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọmọbìnrin.” Ọ̀rọ̀ Gíríìkì παῖς lè túmọ̀ sí “ọmọ” tàbí, nínú àyíká yìí, “ọmọbìnrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Ṣùgbọ́n ó
  rationale: “Ṣùgbọ́n” fi ìyípadà kékeré nínú ìtàn hàn, nígbà tí “ó” dúró fún αὐτός láìfi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: di ọwọ́ rẹ̀ mú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó mú ọwọ́ ọmọ náà, ó sì pa ìṣe ara tí ọ̀rọ̀ Gíríìkì sọ mọ́ láìdún bí ìfipámúni.
- source_word: ἐφώνησεν λέγων
  choice: ó sì ké pé
  rationale: “Ké pé” sọ pé ó fi ohùn tí a lè gbọ́ pè é, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn ju títú participle λέγων lọ lọ́tọ̀.
- source_word: Ἡ παῖς
  choice: Ọmọ
  rationale: παῖς lè túmọ̀ sí ọmọ lápapọ̀ tàbí ọmọbìnrin nínú àyíká yìí. “Ọmọ” pa ìtumọ̀ gbooro àti ohùn onífẹ̀ẹ́ náà mọ́, láìdà á pọ̀ mọ́ ọ̀rọ̀ inú ìtàn tó jọra.
- source_word: ἔγειρε
  choice: dìde
  rationale: “Dìde” jẹ́ àṣẹ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ pé kí ẹni náà jí tàbí dìde mu ní àyíká ìmúpadàbọ̀sípò sí ìyè.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ tí Jesu fi pe ọmọ náà
  choice: Ọmọ
  alternative: Ọmọbìnrin
  rationale: “Ọmọ” pa àyè ìtumọ̀ παῖς mọ́, bó tilẹ̀ jẹ́ pé àyíká fi hàn pé ọmọbìnrin ni. Èyí yẹra fún fífi ọ̀rọ̀ inú ìwé míì kún ẹsẹ yìí.
- issue: Bí a ṣe túmọ̀ àṣẹ ἔγειρε
  choice: dìde
  alternative: jí dìde
  rationale: “Dìde” jẹ́ àṣẹ tààrà, ó sì yẹra fún yíyan láàárín ìtumọ̀ jí lójú oorun àti dìde kúrò nínú ikú ju bí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ṣe yan lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà rọrùn, ó ní iyì, ó sì lè yé òǹkàwé lásán.
