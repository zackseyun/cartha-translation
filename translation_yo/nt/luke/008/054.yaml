  terminology: “Ọmọ” jẹ́ ìpinnu tó dáa fún παῖς nítorí ó pa ìtumọ̀ gbooro ọ̀rọ̀ náà mọ́, láìfi “ọmọbìnrin” tí àyíká nìkan fi hàn ṣe ìtumọ̀ pàtó nínú ọ̀rọ̀ àkọ́kọ́. Àlàyé abẹ́lẹ̀ náà fún “Ọmọbìnrin” ṣàlàyé àṣàyàn náà ní òtítọ́. “Dìde” jẹ́ ìtumọ̀ kedere, tí kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kún ἔγειρε.
