id: LUK.8.28
reference: Luke 8:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó rí Jésù, ó ké jáde, ó sì wólẹ̀ níwájú rẹ̀, ó sì fi ohùn rara sọ pé, “Kí ni mo ní ṣe pẹ̀lú rẹ[a], Jésù, Ọmọ Ọlọ́run Gíga Jù Lọ? Mo bẹ̀ ọ́, má ṣe dá mi lóró.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà gan-an, “Kí ni ó wà láàárín èmi àti ìwọ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: nígbà tí ó rí
  rationale: Aorist participle náà fi ipò àkókò tí ó ṣáájú àwọn ìṣe pàtàkì hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘when he saw’ mọ́.
- source_word: ἀνακράξας
  choice: ó ké ramúramù
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíké jáde ní ohùn gíga; ‘ké ramúramù’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìbújáde ohùn líle láì da a pọ̀ mọ́ φωνῇ μεγάλῃ.
- source_word: προσέπεσεν αὐτῷ
  choice: ó sì wólẹ̀ níwájú rẹ̀
  rationale: Ó pa àwòrán ẹni tó ṣubú níwájú ẹlòmíràn mọ́, láì fi kún un pé ó dé ẹsẹ̀ rẹ̀, èyí tí Gíríìkì kò sọ ní pàtó.
- source_word: φωνῇ μεγάλῃ
  choice: ó sì fi ohùn rara wí
  rationale: ‘Fi ohùn rara’ jẹ́ ọ̀nà Yorùbá àdánidá fún dative of manner, ó sì pa agbára àwòrán ohùn gíga náà mọ́.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Kí ni mo ní ṣe pẹ̀lú rẹ
  rationale: Èyí mú ìtumọ̀ àtakò àti ìyapa inú àṣà-ọrọ Semitic náà jáde ní Yorùbá òde òní; àtẹ̀jáde tó tẹ̀lé ọ̀rọ̀ gan-an wà nínú àlàyé ìsàlẹ̀.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Ọmọ Ọlọ́run Ọ̀gá-ògo
  rationale: ‘Ọlọ́run Ọ̀gá-ògo’ jẹ́ orúkọ oyè Yorùbá tó lóye fún ‘Ọlọ́run Gíga Jù Lọ,’ ó sì pa gbogbo agbára ìdánimọ̀ Jésù nínú ọ̀rọ̀ náà mọ́ láì fi ẹ̀kọ́ míì kún un.
- source_word: δέομαί σου
  choice: Mo bẹ̀ ọ́
  rationale: Ó fi ẹ̀bẹ̀ kánjúkánjú hàn ní ọ̀nà tó rọrùn, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: μή με βασανίσῃς
  choice: má ṣe dá mi lóró
  rationale: ‘Dá ... lóró’ bo ìtumọ̀ ìjìyà líle tàbí torment nínú àyíká ìlépa ẹ̀mí, láì sọ ọ́ di ìdálóró ara nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìjẹ́wọ́ ẹ̀mí èṣù nípa ẹni tí Jésù jẹ́
  choice: Jésù, Ọmọ Ọlọ́run Ọ̀gá-ògo
  alternative: Jésù, Ọmọ Ọlọ́run Gíga Jù Lọ
  rationale: A pa gbogbo ìtumọ̀ Christological inú ọ̀rọ̀ ìpè náà mọ́ gẹ́gẹ́ bí ẹni tó sọ ọ́ ṣe sọ ọ́, láì rẹ̀ ẹ́ sílẹ̀ tàbí mú un gùn ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: A lo Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ké ramúramù’ àti ‘fi ohùn rara wí’ ni a yà sọ́tọ̀ láti pa àwọn gbólóhùn Gíríìkì méjèèjì mọ́. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí àlàyé náà kan, dípò lẹ́yìn ‘Jésù.’
