  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò àti ìtumọ̀ Gíríìkì dáadáa ní ọ̀pọ̀lọpọ̀: rírí Jésù, kíké, wíwólẹ̀ níwájú rẹ̀, ìbéèrè àdàkàdekè, ìdánimọ̀ rẹ̀, àti ẹ̀bẹ̀ pé kí a má ṣe dá a lóró. Síbẹ̀, “Ọlọ́run Ọ̀gá-ògo” kò jẹ́ ìtumọ̀ tó péye fún τοῦ θεοῦ τοῦ ὑψίστου; ó yẹ kí a sọ oyè “Ọlọ́run Gíga Jù Lọ” ní kedere. “Ké ramúramù” sì máa ń tọ́ka sí kíkùn tàbí sísọ ní ìró kéré ju kíké jáde lọ, nítorí náà kò bá ἀνακράξας mu dáadáa.'
