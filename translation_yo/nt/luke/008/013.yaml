  - severity: low
    issue: Àlàyé ìsàlẹ̀ lọwọlọwọ lo ‘ìpọ́njú tí ń dánni wò’ gẹ́gẹ́ bí yíyan tó sun mọ́ πειρασμός.
    rationale: Ọ̀rọ̀ yẹn gùn, ó sì lè sọ pé ìpọ́njú nìkan ni ìtumọ̀ náà. ‘Ìdánwò’ àti ‘ìdẹwò’ dáa ju fún pípa àgbègbè ìtumọ̀ Gíríìkì mọ́.
