id: LUK.8.13
reference: Luke 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: yo
  text: Àwọn tí ó sì wà lórí àpáta ni àwọn tí, nígbà tí wọ́n bá gbọ́, wọ́n fi ayọ̀ gba ọ̀rọ̀ náà. Ṣùgbọ́n wọ́n kò ní gbòǹgbò; wọ́n gbàgbọ́ fún ìgbà díẹ̀, wọ́n sì yà kúrò ní àkókò ìdánwò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò ìdẹwò,” tàbí “nígbà ìdánwò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdánwò, ìpọ́njú, tàbí ìdẹwò, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: lórí àpáta
  rationale: Ó tẹ̀ lé àwòrán àpáta tó wà nínú òwe náà, ó sì pa ẹyọ ọ̀rọ̀ πέτρα mọ́ láì fi ‘ilẹ̀ olókùúta’ kún un.
- source_word: ἀκούσωσιν
  choice: nígbà tí wọ́n bá gbọ́
  rationale: Ìtumọ̀ àdáyébá fún ὅταν pẹ̀lú aorist subjunctive nínú gbólóhùn tó ń sọ ohun tó máa ń ṣẹlẹ̀.
- source_word: μετὰ χαρᾶς
  choice: fi ayọ̀
  rationale: Ó sọ bí wọ́n ṣe gba ọ̀rọ̀ náà pẹ̀lú ìmọ̀lára ayọ̀ ní Yorùbá àdáyébá.
- source_word: δέχονται τὸν λόγον
  choice: wọ́n ... gba ọ̀rọ̀ náà
  rationale: ‘Gba ọ̀rọ̀ náà’ jẹ́ kedere, ó sì pa àṣà èdè Bíbélì mọ́; nínú àyíká yìí ọ̀rọ̀ náà ni iṣẹ́ ìwàásù tí a kéde.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: kò ní gbòǹgbò
  rationale: Ó pa àfiwé àti nọ́ńbà ẹyọ inú Gíríìkì mọ́.
- source_word: πρὸς καιρὸν
  choice: fún ìgbà díẹ̀
  rationale: Ó fi hàn pé àkókò náà ní òpin, ó sì jẹ́ Yorùbá tí ó ṣe déédéé.
- source_word: πιστεύουσιν
  choice: wọ́n gbàgbọ́
  rationale: Ìtumọ̀ tààrà fún πιστεύω ni; kò pinnu bóyá ìgbàgbọ́ náà jẹ́ ti ìgbàlà tàbí ti ojú lásán.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: ní àkókò ìdánwò
  rationale: ‘Ìdánwò’ lè gba ìtumọ̀ àdánwò, ìpọ́njú tí ń dánni wò, tàbí ìtànjẹ sí ẹ̀ṣẹ̀, gẹ́gẹ́ bí πειρασμός ṣe lè túmọ̀ sí nínú àyíká ọ̀rọ̀.
- source_word: ἀφίστανται
  choice: wọ́n yà kúrò
  rationale: Ó fi ìṣe kíkọ̀ sílẹ̀ tàbí yíyọ ara ẹni kúrò nínú ohun tí a ti gbàgbọ́ hàn, láì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó ti ní ìtumọ̀ pàtó.
theological_decisions:
- issue: Bóyá πιστεύουσιν túmọ̀ sí ìgbàgbọ́ ìgbàlà tòótọ́ tàbí ìgbàgbọ́ ojú lásán
  choice: wọ́n gbàgbọ́
  alternative: wọ́n dà bí ẹni pé wọ́n gbàgbọ́; wọ́n ní ìgbàgbọ́ tòótọ́ ṣùgbọ́n wọ́n yà kúrò lẹ́yìn náà; ìgbàgbọ́ ojú lásán ni tiwọn
  rationale: Ẹsẹ náà sọ pé wọ́n gbàgbọ́ fún ìgbà díẹ̀, lẹ́yìn náà wọ́n yà kúrò; kò dáhùn àríyànjiyàn ẹ̀kọ́ ìsìn nípa irú ìgbàgbọ́ náà. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ yìí mọ́.
- issue: Ìtumọ̀ πειρασμός nínú àyíká yìí
  choice: ìdánwò
  alternative: ìdẹwò; àkókò ìpọ́njú tí ń dánni wò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdánwò, ìpọ́njú, tàbí ìdẹwò. ‘Ìdánwò’ ni ìtumọ̀ tó gbòòrò jù nínú àyíká yìí, a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Wọ́n yà kúrò’ jẹ́ ọ̀rọ̀ tí ará ìlú lè lóye, ó sì yẹra fún píparí àríyànjiyàn ẹ̀kọ́ ìsìn nípa àpadà-kúrò nínú ìgbàgbọ́.
