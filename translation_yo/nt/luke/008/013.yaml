  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé èdè Gíríìkì dáadáa: ẹgbẹ́ àwọn tí ó wà lórí àpáta, ìgbọ́ àti gbígba ọ̀rọ̀ náà pẹ̀lú ayọ̀, àìní gbòǹgbò, ìgbàgbọ́ fún àkókò kúkúrú, àti yíyà kúrò ní àkókò πειρασμός. Àtúnṣe kékeré náà mú ìtọ́kasí sí ‘ọ̀rọ̀ náà’ hàn gbangba díẹ̀, ó sì yọ ìtẹnumọ́ tí kò pọndandan kúrò nínú gbolohun ìkẹyìn.'
  naturalness: ‘Wọ́n kò ní gbòǹgbò’ jẹ́ ìbámu kedere sí kókó-ọrọ púpọ̀ ju ‘àwọn wọ̀nyí kò ní gbòǹgbò’ lọ. ‘Wọ́n yà kúrò ní àkókò ìdánwò’ jẹ́ Yorùbá ìgbàlódé, ó sì mú ìṣàn gbolohun náà rọrùn. Àlàyé ìsàlẹ̀ ni a tún ṣe kí àwọn yíyan rẹ̀ jẹ́ adáyébá, kí ó má sì fi ìtumọ̀ ‘ìpọ́njú’ lórí πειρασμός ní ọ̀nà tó dín ìbòjú-méjì ọ̀rọ̀ náà kù.
  terminology: ‘Àpáta,’ ‘ọ̀rọ̀ náà,’ ‘ayọ̀,’ ‘gbòǹgbò,’ ‘ìgbàgbọ́,’ àti ‘ìdánwò’ bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu. ‘Wọ́n yà kúrò’ pa ìtumọ̀ ἀφίστανται mọ́ láì dá ìbéèrè ẹ̀kọ́ ìsìn nípa irú ìgbàgbọ́ wọn tàbí ìfaradà àwọn onígbàgbọ́ ṣẹ́jọ.
  issues:
