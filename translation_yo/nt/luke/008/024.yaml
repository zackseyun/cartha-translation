id: LUK.8.24
reference: Luke 8:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: yo
  text: Nígbà náà ni wọ́n sún mọ́ ọn, wọ́n sì jí i, wọ́n ń wí pé, “Olùkọ́ni, Olùkọ́ni, à ń ṣègbé!” Ó sì jí, ó bá afẹ́fẹ́ àti ìgbì omi náà wí; wọ́n sì dáwọ́ dúró, ìdákẹ́jẹ́ sì wà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: wọ́n tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò wọn sí ọ̀dọ̀ Jésù hàn ní ọ̀nà Yorùbá tí ó ṣe déédé, láì fi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: διήγειραν
  choice: wọ́n jí i
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún jí ẹnì kan kúrò nínú oorun.
- source_word: Ἐπιστάτα
  choice: Olúwa
  rationale: Nínú àyíká yìí, ó jẹ́ ọ̀rọ̀ ìpè tí ó fi ìbọ̀wọ̀ àti ìtẹ́wọ́gbà àṣẹ Jésù hàn; “Olúwa” jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kì í ṣe κύριος.
- source_word: ἀπολλύμεθα
  choice: à ń ṣègbé
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ àti ewu ikú tí ó sún mọ́lé mọ́.
- source_word: διεγερθεὶς
  choice: nígbà tí ó sì jí
  rationale: Ó pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́ láì pinnu ju ọ̀rọ̀ Gíríìkì lọ bóyá ó jí fúnra rẹ̀ tàbí pé jíjí wọn ló mú un jí.
- source_word: ἐπετίμησεν
  choice: ó bá ... wí
  rationale: “Bá ... wí” jẹ́ ọ̀rọ̀ Yorùbá tí ó lágbára fún ìkìlọ̀ tàbí àṣẹ líle, ó sì bá bí Jésù ṣe lo àṣẹ lórí afẹ́fẹ́ àti omi mu.
- source_word: ἀνέμῳ
  choice: afẹ́fẹ́
  rationale: Ó túmọ̀ ìtumọ̀ pẹ̀lẹ́pẹ̀lẹ́ ti ọ̀rọ̀ náà láì fi “ìjì” kún un.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: ìru omi náà
  rationale: “Ìru omi” fi ìgbì omi tí ń ru sókè hàn, ó sì pa àwòrán κλύδων àti ìbáṣepọ̀ rẹ̀ pẹ̀lú “omi” mọ́.
- source_word: ἐπαύσαντο
  choice: wọ́n sì dáwọ́ dúró
  rationale: Ọ̀rọ̀ arọ́pò ọ̀pọ̀ “wọ́n” pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́, ó ń tọ́ka sí afẹ́fẹ́ àti ìru omi.
- source_word: ἐγένετο γαλήνη
  choice: gbogbo rẹ̀ sì balẹ̀ jẹ́ẹ́
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìdákẹ́jẹ́ tí ó dé lẹ́yìn ìjì, ó sì fi àbájáde iṣẹ́ náà hàn.
theological_decisions:
- issue: Ìtumọ̀ oyè Ἐπιστάτα tí wọ́n fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” níbí ń fi ìbọ̀wọ̀ àti àṣẹ tí àwọn ọmọ-ẹ̀yìn mọ̀ pé Jésù ní hàn. A kò lo o láti dá Ἐπιστάτα pọ̀ mọ́ κύριος ní gbogbo ibi, bí kò ṣe gẹ́gẹ́ bí ọ̀rọ̀ ìpè Yorùbá tó bójú mu ní àyíká yìí.
- issue: Àṣẹ Jésù lórí afẹ́fẹ́ àti omi nínú ἐπετίμησεν
  choice: ó bá ... wí
  alternative: ó pàṣẹ fún
  rationale: Èyí pa agbára ọ̀rọ̀ náà àti àṣẹ tààrà Jésù mọ́, láì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Èdè náà níyì, ó sì ṣe kedere fún òǹkàwé òde òní. Kò sí àmì àlàyé ẹsẹ̀ nítorí pé àlàyé Gẹ̀ẹ́sì tí a pèsè kò bá ibi tí àmì [a] wà mu, bẹ́ẹ̀ ni ìtumọ̀ Yorùbá “ìru omi” kò nílò àṣàyàn yẹn.
