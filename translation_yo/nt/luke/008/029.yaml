  source_fidelity: Ìtumọ̀ náà ń fi ìfẹ̀hónúhàn Jesu, ẹ̀mí àìmọ́, ìdè, ìṣọ́, fífọ́ ìdè, àti lílé ọkùnrin náà sí ibi ahoro hàn dáadáa. Ṣùgbọ́n “Ṣùgbọ́n” fún καί ń ṣàfikún ìyàtọ̀ tí Gíríìkì kò sọ; a yẹ kí a lo ìsopò “sí”/“àti” tí kò ní ìtumọ̀ àfikún.
