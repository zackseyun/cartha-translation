id: LUK.8.29
reference: Luke 8:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: yo
  text: Nítorí ó ti pàṣẹ fún ẹ̀mí àìmọ́ náà kí ó jáde kúrò lára ọkùnrin náà. Nítorí ó ti gbá a mú ní ọ̀pọ̀ ìgbà[a], a sì máa ń fi ẹ̀wọ̀n àti ṣẹ́kẹ́ṣẹkẹ̀ dè é, a sì ń ṣọ́ ọ; ó sì máa ń já àwọn ìdè náà, ẹ̀mí èṣù náà a sì máa lé e lọ sí àwọn ibi ahoro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìgbà pípẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àkókò gígùn, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà tún ṣe àtìlẹ́yìn fún ìṣẹ̀lẹ̀ léraléra.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “sí àwọn ibi tí ó ṣófo,” ìyẹn àwọn ibi tí ènìyàn kò gbé.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: ó ti pàṣẹ
  rationale: Ọ̀rọ̀ yìí jẹ́ àìpé nínú Gíríìkì, ṣùgbọ́n γάρ fi hàn pé ó ń ṣàlàyé ohun tí ó ti ṣáájú; ‘ó ti pàṣẹ’ fi ìṣe tí ó ṣáájú ìdáhùn ẹ̀mí náà hàn ní Yorùbá àdánidá.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: ẹ̀mí àìmọ́ náà
  rationale: Ó pa ìtumọ̀ àìmọ́ tàbí àìjẹ́mímọ́ mọ́, ó sì bá ọ̀rọ̀ Májẹ̀mú Tuntun tí ó wọ́pọ̀ mu.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: kí ó jáde kúrò lára ọkùnrin náà
  rationale: ‘Kúrò lára’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìjáde ẹ̀mí kúrò nínú ẹni, láìsọ ìtumọ̀ ibi náà nù.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ọ̀pọ̀ χρόνοις lè tọ́ka sí ìṣẹ̀lẹ̀ léraléra tàbí àkókò gígùn; ọ̀rọ̀ tó tẹ̀ lé e ní àìpé ṣe àtìlẹ́yìn fún ìṣẹ̀lẹ̀ tí ó máa ń ṣẹlẹ̀ léraléra.
- source_word: συνηρπάκει
  choice: ó ti máa ń gbá a mú
  rationale: ‘Gbá a mú’ fi agbára àti ìṣàkóso líle hàn; ‘ti máa ń’ mú ìtàn ẹ̀yìn àti ìṣẹ̀lẹ̀ léraléra jọ.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: a fi ẹ̀wọ̀n àti ṣẹ́kẹ́ṣẹkẹ̀ dè é
  rationale: Ìṣe àṣà ‘a ... dè é’ fi àìpé léraléra hàn; ‘ẹ̀wọ̀n’ àti ‘ṣẹ́kẹ́ṣẹkẹ̀’ ya irú ìdè méjèèjì sọ́tọ̀ ní èdè tí ó ṣeé lóye.
- source_word: φυλασσόμενος
  choice: wọn a máa ṣọ́ ọ
  rationale: Ó fi hàn pé wọ́n ń ṣọ́ ọ nígbà tí wọ́n dè é, ní ọ̀nà Yorùbá tí ó rọrùn ju títẹ̀lé àkópọ̀ participle Gíríìkì lọ.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: òun a já àwọn ìdè náà
  rationale: ‘Já’ pa agbára διαρρήσσω mọ́; ‘ìdè’ gbòòrò ju ‘ẹ̀wọ̀n’ lọ, gẹ́gẹ́ bí δεσμά.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: ẹ̀mí èṣù náà a sì lé e lọ
  rationale: Ìṣètò gbolohun Yorùbá yìí mú olùṣe náà hàn kedere, ó sì pa ìfipámú inú ‘lé ... lọ’ mọ́.
- source_word: εἰς τὰς ἐρήμους
  choice: sí àwọn ibi ahoro
  rationale: ‘Àwọn ibi ahoro’ pa nọ́ńbà púpọ̀ Gíríìkì mọ́, ó sì tọ́ka sí àwọn ibi tí ènìyàn kò gbé láìfi irú ilẹ̀ kan pàtó lé e lórí.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ẹ̀mí èṣù
  choice: ẹ̀mí àìmọ́; ẹ̀mí èṣù
  alternative: ẹ̀mí búburú; àìsàn ọpọlọ gẹ́gẹ́ bí àpẹẹrẹ
  rationale: Ẹsẹ̀ náà fi ẹ̀mí náà hàn gẹ́gẹ́ bí ẹni tí ń ṣe ìṣe àti tí ń darí ọkùnrin náà. Ìtumọ̀ náà kò rọ ọ́ sí àpẹẹrẹ tàbí àìsàn nìkan, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
- issue: Ìyàtọ̀ tó wà láàárín πνεῦμα ἀκάθαρτον àti δαιμόνιον
  choice: pa ‘ẹ̀mí àìmọ́’ àti ‘ẹ̀mí èṣù’ méjèèjì mọ́
  alternative: lo ọ̀rọ̀ kan náà ní ibì méjèèjì
  rationale: Èyí pa ìyàtọ̀ ọ̀rọ̀ inú Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé àwọn méjèèjì tọ́ka sí ẹ̀dá kan náà nínú àyíká ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ode òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A tú àwọn imperfect Gíríìkì sí àṣà Yorùbá ‘a máa’ láti fi ìṣe léraléra hàn; a tún tú participle sí gbolohun aládàáṣe kí ọ̀rọ̀ má bàa le.
