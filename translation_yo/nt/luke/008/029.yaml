revisions:
- from: Nítorí ó ti pàṣẹ fún ẹ̀mí àìmọ́ náà pé kí ó jáde kúrò lára ọkùnrin náà. Nítorí ní ọ̀pọ̀ ìgbà[a] ni ó ti máa ń gbá a mú; àwọn ènìyàn a sì fi ẹ̀wọ̀n àti ṣẹ́kẹ́ṣẹkẹ̀ dè é, wọn a máa ṣọ́ ọ. Ṣùgbọ́n òun a já àwọn ìdè náà, ẹ̀mí èṣù náà a sì lé e lọ sí àwọn ibi ahoro[b].
  to: Nítorí ó ti pàṣẹ fún ẹ̀mí àìmọ́ náà kí ó jáde kúrò lára ọkùnrin náà. Nítorí ó ti gbá a mú ní ọ̀pọ̀ ìgbà[a], a sì máa ń fi ẹ̀wọ̀n àti ṣẹ́kẹ́ṣẹkẹ̀ dè é, a sì ń ṣọ́ ọ; ó sì máa ń já àwọn ìdè náà, ẹ̀mí èṣù náà a sì máa lé e lọ sí àwọn ibi ahoro[b].
  rationale: Àtúnṣe náà yọ ìtumọ̀ ìyàtọ̀ tí “Ṣùgbọ́n” fi kún καί kúrò, ó sì tún gbolohun nípa ìmú ọkùnrin náà ṣe kí ó jẹ́ Yorùbá boṣewa tí ó kedere. Àwọn àmì ẹsẹ̀ àti àlàyé ìsàlẹ̀ ni a pa mọ́, nítorí wọ́n bá orísun Gíríìkì mu.
