  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: yo
  text: Gbogbo wọn sì ń sunkún, wọ́n sì ń ṣọ̀fọ̀ rẹ̀. Ṣùgbọ́n ó sọ pé, “Ẹ má sunkún, nítorí kò kú, ṣùgbọ́n ó ń sùn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wà lójú oorun.” Ọ̀rọ̀ Jésù lo ìsùn gẹ́gẹ́ bí àpèjúwe níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: ń sunkún
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ẹkún náà ń lọ lọ́wọ́; “ń sunkún” sọ ìtumọ̀ yìí ní Yorùbá àdánidá.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Èyí pa ìtẹnumọ́ pé gbogbo àwọn tó wà níbẹ̀ ló ń ṣe bẹ́ẹ̀ mọ́.
- source_word: ἐκόπτοντο αὐτήν
  choice: ń ṣọ̀fọ̀ rẹ̀
  rationale: Nínú àyíká ikú, κόπτομαι túmọ̀ sí ṣíṣe ọ̀fọ̀ tàbí ẹkún ìbànújẹ́, bó tilẹ̀ jẹ́ pé ó lè ní lílu ara mọ́ra; “ń ṣọ̀fọ̀ rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láìfi ìṣe ara kan kún ọ̀rọ̀ náà.
- source_word: Μὴ κλαίετε
  choice: Ẹ má sunkún
  rationale: Ọ̀rọ̀-àṣẹ ìsinsìnyí pẹ̀lú μή lè ní ìtumọ̀ dídá ohun tó ń lọ lọ́wọ́ dúró; “Ẹ má sunkún” bá àyíká náà mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: οὐ γὰρ
  choice: nítorí kò
  rationale: “Nítorí” fi ipa ìṣàlàyé γάρ hàn, “kò” sì gbé ìsẹ́ náà lọ́nà àìní.
- source_word: ἀπέθανεν
  choice: kò kú
  rationale: Ọ̀nà yìí jẹ́ gígùn-ún-rọ̀ Yorùbá tó bá aorist mu, ó sì pa ìtakora pẹ̀lú “ó ń sùn” mọ́.
- source_word: καθεύδει
  choice: ó ń sùn
  rationale: Èyí pa àwòrán oorun tí Jésù lò mọ́, ó sì fi ìṣe tó ń lọ lọ́wọ́ hàn gẹ́gẹ́ bí ọ̀rọ̀-ìṣe ìsinsìnyí.
theological_decisions:
- issue: Ọ̀rọ̀ Jésù pé ọmọbìnrin náà kò kú, ṣùgbọ́n ó ń sùn
  choice: A pa ọ̀rọ̀ náà mọ́ ní tààràtà gẹ́gẹ́ bí Jésù ṣe sọ ọ́, láìṣàlàyé ìtakora náà nínú ẹsẹ̀.
  alternative: “Kò kú títí láé; ó kàn ń sùn” tàbí “Ó dà bí ẹni pé ó kú, ṣùgbọ́n oorun ló sùn.”
  rationale: Àwọn ọ̀nà mìíràn yóò pinnu ìtumọ̀ tí Gíríìkì fúnra rẹ̀ kò sọ ní tààràtà. “Ó ń sùn” pa àkàwé náà àti ìfọ̀kànbalẹ̀ tó wà láàárín ikú rẹ̀ àti ìmúpadàbọ̀sípò tó sún mọ́lé mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ṣọ̀fọ̀” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì yẹ fún ìbànújẹ́ ikú láìṣe àlàyé àsọdùn nípa lílu ara.
