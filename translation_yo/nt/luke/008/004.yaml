  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: yo
  text: Nígbà tí ọ̀pọ̀ ènìyàn sì ń péjọ, tí àwọn ènìyàn láti ìlú kọ̀ọ̀kan sì ń wá sọ́dọ̀ rẹ̀, ó sọ̀rọ̀ nípasẹ̀ àkàwé kan:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sọ̀rọ̀ nínú àkàwé kan.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀nà tàbí ohun èlò tí ó fi sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος δὲ ὄχλου πολλοῦ
  choice: Nígbà tí ọ̀pọ̀ ènìyàn sì ń péjọ
  rationale: Gbólóhùn olùní genitive yìí fi ìṣe tí ó ń lọ lọ́wọ́ hàn; “ń péjọ” mú ìtumọ̀ pé àwọn ènìyàn ń kóra jọ jáde ní Yorùbá àdánidá. “Sì” fi ìtẹ̀síwájú ìtàn δέ hàn láìsọ ọ́ di ìtakora.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτόν
  choice: tí àwọn ènìyàn láti ìlú kọ̀ọ̀kan sì ń tọ̀ ọ́ wá
  rationale: “Láti ìlú kọ̀ọ̀kan” pa agbára pínpín κατὰ πόλιν mọ́, “ń tọ̀ ọ́ wá” sì ṣàfihàn ìrìn sí ọ̀dọ̀ Jésù tí πρὸς αὐτόν túmọ̀ sí.
- source_word: εἶπεν
  choice: ó bá wọn sọ̀rọ̀
  rationale: Yíyan yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó bẹ̀rẹ̀ sí í bá àwùjọ náà sọ̀rọ̀; “wọn” jẹ́ ohun tí àyíká ọ̀rọ̀ mú yé, kì í ṣe àfikún ẹni tuntun.
- source_word: διὰ παραβολῆς
  choice: nípasẹ̀ àkàwé kan
  rationale: διά pẹ̀lú genitive lè tọ́ka sí ohun èlò tàbí ọ̀nà; “nípasẹ̀” pa ìtumọ̀ ohun èlò mọ́, “àkàwé” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún παραβολή.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yàgò fún èdè ìjọ kan pàtó.
