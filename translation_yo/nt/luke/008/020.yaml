  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: yo
  text: A sì ròyìn fún un pé, “Ìyá rẹ àti àwọn arákùnrin rẹ[a] dúró níta, wọ́n ń fẹ́ rí ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn mọ̀lẹ́bí,” bí a bá lóye ἀδελφοί ní ìtumọ̀ tó gbooro nínú àyíká ọ̀rọ̀; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “àwọn arákùnrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: Wọ́n ròyìn fún un
  rationale: Ọ̀rọ̀ yìí jẹ́ àìṣe aláṣe ní Gíríìkì, ṣùgbọ́n lílo ‘wọ́n’ gẹ́gẹ́ bí aláṣe tí a kò dárúkọ jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì fi hàn pé ẹnì kan mú ìròyìn náà tọ Jésù wá.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó tẹ ìtàn náà síwájú láìfi ìtakora líle kún un.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó fi ẹni tí wọ́n mú ìròyìn náà tọ̀ wá hàn ní kedere.
- source_word: μήτηρ
  choice: ìyá
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó níyì, fún ‘mother.’
- source_word: ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ akọ, ó sì sábà túmọ̀ sí àwọn arákùnrin; a kò fẹ̀ ẹ́ sí ‘àwọn mọ̀lẹ́bí’ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἑστήκασιν
  choice: dúró
  rationale: Perfect Gíríìkì náà ń tọ́ka sí ipò tí ó wà ní àsìkò náà; ‘dúró’ sọ ipò yẹn ní Yorùbá àdánidá.
- source_word: ἔξω
  choice: níta
  rationale: Ó pa ìtumọ̀ ààyè mọ́ láìfi ‘ilé’ tàbí ibi mìíràn tí kò sí nínú Gíríìkì kún un.
- source_word: ἰδεῖν
  choice: rí
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ; a kò yí i sí ‘pàdé’ tàbí ‘bá sọ̀rọ̀.’
- source_word: θέλοντες
  choice: wọ́n ń fẹ́
  rationale: Ó fi ìfẹ́ tí ó ń bá a lọ ní àsìkò tí wọ́n dúró níta hàn ní Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ ‘ἀδελφοί’ nípa ìbátan àwọn ọkùnrin wọ̀nyí pẹ̀lú Jésù
  choice: àwọn arákùnrin
  alternative: àwọn mọ̀lẹ́bí
  rationale: A pa ìtumọ̀ ọ̀rọ̀ Gíríìkì tó wọ́pọ̀ mọ́, láìdáhùn àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa irú ìbátan pàtó tí wọ́n ní pẹ̀lú Jésù. Àlàyé ìsàlẹ̀ ojú ìwé ṣí àǹfààní ìtumọ̀ gbooro sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò gbólóhùn jẹ́ àdánidá fún Yorùbá, ṣùgbọ́n ó pa àkóónú àti àìdánilójú Gíríìkì mọ́.
