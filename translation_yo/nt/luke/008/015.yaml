revisions:
- from: Ṣùgbọ́n èyí tí ó bọ́ sí orí ilẹ̀ rere—àwọn wọ̀nyí ni àwọn tí, lẹ́yìn tí wọ́n fi ọkàn rere àti ọ̀wọ̀ gbọ́ ọ̀rọ̀ náà, wọ́n dì í mú ṣinṣin, wọ́n sì ń so èso pẹ̀lú ìfaradà.[a]
  to: Ṣùgbọ́n èyí tí ó bọ́ sínú ilẹ̀ rere—àwọn wọ̀nyí ni àwọn tí wọ́n gbọ́ ọ̀rọ̀ náà ní ọkàn ọlọ́lá àti rere[a], wọ́n di ọ̀rọ̀ náà mú ṣinṣin, wọ́n sì ń so èso pẹ̀lú ìfaradà.
  rationale: Àtúnṣe náà yí ‘sí orí’ padà sí ‘sínú’ láti fi ibi tí Gíríìkì sọ hàn. Ó rọ́pò “ọ̀wọ̀,” tí kò pé ní àyíká yìí, pẹ̀lú “ọlọ́lá,” ó sì pa ìyìn méjì—καλῇ àti ἀγαθῇ—mọ́. A tún ṣe gbolohun dídìmú náà ní ọ̀nà Yorùbá tó mọ́, a sì mú àmì ìsàlẹ̀ bá ibi ìyàtọ̀ ìtumọ̀ rẹ̀ mu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:32Z'
