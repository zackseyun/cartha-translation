id: LUK.8.15
reference: Luke 8:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: yo
  text: Ṣùgbọ́n èyí tí ó bọ́ sínú ilẹ̀ rere—àwọn wọ̀nyí ni àwọn tí wọ́n gbọ́ ọ̀rọ̀ náà ní ọkàn ọlọ́lá àti rere[a], wọ́n di ọ̀rọ̀ náà mú ṣinṣin, wọ́n sì ń so èso pẹ̀lú ìfaradà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “ní ọkàn olóòtítọ́ àti rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: èyí tí ó bọ́ sí orí ilẹ̀ rere
  rationale: Àpilẹ̀kọ akọ-abo àárín àti gbólóhùn ibi náà jẹ́ àkótán nínú àlàyé òwe; ó ń tọ́ka sí ohun tí a fúnrúgbìn. Fífi ‘tí ó bọ́’ kún un mú kí Yorùbá ṣe kedere láì fi ‘irúgbìn’ sí ọ̀rọ̀ Gíríìkì ní tààrà.
- source_word: καλῇ γῇ
  choice: ilẹ̀ rere
  rationale: Nínú àwòrán iṣẹ́ àgbẹ̀ yìí, γῆ túmọ̀ sí ilẹ̀ tí irúgbìn ń hù sí; ‘ilẹ̀ rere’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì pa ìyàtọ̀ inú òwe mọ́.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: àwọn wọ̀nyí ni àwọn tí
  rationale: Ó pa agbára ìdánimọ̀ ẹgbẹ́ àwọn ènìyàn náà mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: fi ọkàn rere àti ọ̀wọ̀
  rationale: ‘Ọkàn’ dúró fún inú ènìyàn. Àwọn ajẹtífù méjèèjì jẹ́ ọ̀rọ̀ ìyìn tó sún mọ́ra; ‘rere àti ọ̀wọ̀’ pa ìyìn méjèèjì mọ́ láì sọ wọ́n di ohun kan náà tàbí fi ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἀκούσαντες τὸν λόγον
  choice: lẹ́yìn tí wọ́n ... gbọ́ ọ̀rọ̀ náà
  rationale: 'Participle aorist náà ṣáájú àwọn iṣe pàtàkì: wọ́n kọ́kọ́ gbọ́, lẹ́yìn náà wọ́n dì í mú, wọ́n sì so èso.'
- source_word: κατέχουσιν
  choice: wọ́n dì í mú ṣinṣin
  rationale: Ó fi ìdádúró àti ìmúra gidigidi hàn ju pé wọ́n kàn ní ọ̀rọ̀ náà lọ; ‘í’ tọ́ka sí ọ̀rọ̀ náà.
- source_word: καρποφοροῦσιν
  choice: wọ́n ń so èso
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ àfiwé rẹ̀.
- source_word: ἐν ὑπομονῇ
  choice: pẹ̀lú ìfaradà
  rationale: ὑπομονή ń tọ́ka sí fífaradà tí ó dúró ṣinṣin; gbólóhùn yìí fi ọ̀nà tí wọ́n gbà ń so èso hàn.
theological_decisions:
- issue: Àpèjúwe ìwà rere inú ọkàn tí ó gba ọ̀rọ̀
  choice: fi ọkàn rere àti ọ̀wọ̀
  alternative: fi ọkàn olóòtítọ́ àti rere
  rationale: Ìtumọ̀ náà pa àpèjúwe rere méjì ti ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n kò pinnu bí ọkàn bẹ́ẹ̀ ṣe wáyé, kò sì fi èrò nípa ẹ̀tọ́, àtúnbí, tàbí èrè iṣẹ́ kún ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo àwòrán ilẹ̀, dídì ọ̀rọ̀ mú, àti sísọ èso ní ọ̀nà tí òǹkàwé Yorùbá lè lóye ní rọrùn.
