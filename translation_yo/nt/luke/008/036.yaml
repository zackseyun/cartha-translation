  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: yo
  text: Àwọn tí wọ́n rí ìṣẹ̀lẹ̀ náà sì ròyìn fún wọn bí a ṣe gbà ọkùnrin tí ẹ̀mí èṣù ti wọ̀ náà là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí a ṣe mú ọkùnrin náà lára dá,” tàbí, “bí a ṣe dá a sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbà là, mú lára dá, tàbí dá sílẹ̀, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: ròyìn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti sọ tàbí láti fi ohun tí ó ṣẹlẹ̀ tó ẹlòmíràn létí; “ròyìn” bá àyíká ẹ̀rí àwọn ẹni tí ó rí ìṣẹ̀lẹ̀ náà mu, ó sì ní ìyì tó yẹ.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá láì fi ìtakora tí kò sí sínú rẹ̀.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative yìí tọ́ka sí àwọn tí wọ́n gba ìròyìn náà; “fún wọn” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: οἱ ἰδόντες
  choice: Àwọn tí ó ... rí ohun tí ó ṣẹlẹ̀
  rationale: Participle olórúkọ yìí ń tọ́ka sí àwọn ẹlẹ́rìí ìṣẹ̀lẹ̀ náà. Fífi “ohun tí ó ṣẹlẹ̀” kún un mú ìtọ́kasí náà ṣe kedere ní Yorùbá láì yí ìtumọ̀ padà.
- source_word: πῶς
  choice: bí
  rationale: “Bí” ń fi ọ̀nà tàbí àkóónú ohun tí wọ́n ròyìn hàn, ó sì jẹ́ ìtumọ̀ àdánidá fún πῶς.
- source_word: ἐσώθη
  choice: a ti ... gba ... sílẹ̀
  rationale: Ní àyíká yíyọ àwọn ẹ̀mí èṣù jáde, “gba ... sílẹ̀” fi ìdáǹdè hàn ní kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbígbòòrò σῴζω—gbà là, mú lára dá, tàbí dá nídè—mọ́.
- source_word: ὁ δαιμονισθείς
  choice: ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣe ní ìwọ̀fà
  rationale: Ọ̀rọ̀ yìí ń sọ nípa ọkùnrin kan tí ó ti wà lábẹ́ agbára àwọn ẹ̀mí èṣù. Gbólóhùn yìí ṣe kedere, ó bójú mu ní Yorùbá òde òní, kò sì sọ ẹni náà di ẹni tí ìṣòro rẹ̀ nìkan ń ṣàpèjúwe.
theological_decisions:
- issue: Ìtumọ̀ ἐσώθη (σῴζω) nínú àyíká ìdáǹdè kúrò lọ́wọ́ àwọn ẹ̀mí èṣù
  choice: a ti gba ... sílẹ̀
  alternative: a ti gbà á là; a ti mú un lára dá; a ti dá a nídè
  rationale: σῴζω lè túmọ̀ sí gbà là, mú lára dá, tàbí dá nídè. Nínú àyíká yìí, “gba ... sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìdáǹdè àti ìmúpadàbọ̀sípò, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́, kí a má bàa fi ọ̀rọ̀ náà mọ́ ìwòsàn ara nìkan tàbí ìgbàlà ẹ̀mí nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀mí èṣù” ní ọ̀pọ̀ nítorí àyíká ìtàn náà, bí ó tilẹ̀ jẹ́ pé participle Gíríìkì fúnra rẹ̀ kò sọ iye wọn. Àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá.
