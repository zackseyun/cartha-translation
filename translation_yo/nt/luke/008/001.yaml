id: LUK.8.1
reference: Luke 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: yo
  text: Ó sì ṣe lẹ́yìn náà pé ó ń rìn kiri láti ìlú kan dé òmíràn àti láti abúlé kan dé òmíràn[a], ó ń kéde ìjọba Ọlọ́run[b], ó sì ń sọ ìhìn rere nípa rẹ̀. Àwọn Méjìlá náà sì wà pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìlú dé ìlú àti ní abúlé dé abúlé.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “ìjọba Ọlọ́run” sí “ìṣàkóso Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Ó sì ṣe lẹ́yìn náà pé
  rationale: Èyí pa àmì ìtẹ̀síwájú ìtàn Lúùkù àti ìtumọ̀ pé ìṣẹ̀lẹ̀ náà tẹ̀ lé ohun tí ó ṣáájú mọ́, láì lo ọ̀rọ̀ Yorùbá àtijọ́ tàbí èyí tí kò bá èdè òde òní mu.
- source_word: αὐτὸς
  choice: ó
  rationale: Àrọ́pò-orúkọ Gíríìkì náà tọ́ka sí ẹni tí a ti ń sọ̀rọ̀ nípa rẹ̀; ‘ó’ jẹ́ ọ̀nà àdánidá ní Yorùbá, nítorí pé àyíká yìí kò béèrè fún ìtẹnumọ́ ‘òun fúnra rẹ̀’.
- source_word: διώδευεν
  choice: ó ń rìn
  rationale: Àmì ‘ń’ fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì; àlàyé ibi tí ó ń rìn kọjá wà nínú gbólóhùn tó tẹ̀ lé e.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: láti ìlú kan dé òmíràn àti láti abúlé kan dé òmíràn
  rationale: 'Ọ̀rọ̀ yìí mú agbára pínpín κατά hàn: ó ń lọ láti ibì kan sí ibòmíràn, ní àwọn ìlú àti àwọn abúlé.'
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: ‘Kéde’ mú ìtumọ̀ ìkéde ní gbangba hàn, kò sì fi ọ̀rọ̀ náà mọ́ ìwàásù inú àpéjọ nìkan.
- source_word: εὐαγγελιζόμενος
  choice: ó sì ń sọ ìhìn rere nípa rẹ̀
  rationale: Èyí yà iṣẹ́ yìí sọ́tọ̀ kúrò ní κηρύσσων, ó sì pa èrò ìhìn rere mọ́; ‘rẹ̀’ tọ́ka sí ìjọba Ọlọ́run tí a ṣẹ̀ṣẹ̀ dárúkọ.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, ó sì lè gba ìtumọ̀ ilẹ̀ ìjọba àti ìṣàkóso Ọlọ́run láàyè, láì dín βασιλεία kù sí apá kan ṣoṣo.
- source_word: οἱ δώδεκα
  choice: Àwọn Méjìlá
  rationale: Èyí pa orúkọ ẹgbẹ́ náà mọ́ láì fi ‘àwọn ọmọ-ẹ̀yìn’ tàbí ‘àwọn àpọ́sítélì’ kún ohun tí Gíríìkì kò sọ níbí.
- source_word: σὺν αὐτῷ
  choice: wà pẹ̀lú rẹ̀
  rationale: Gbólóhùn Yorùbá yìí sọ ìbákẹ́gbẹ́ wọn pẹ̀lú rẹ̀ ní kedere àti ní ti ẹ̀dá.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ ni ìtumọ̀ tí ó gbòòrò jù, tí ó sì lè ní èrò agbègbè ìjọba àti iṣẹ́ ìṣàkóso Ọlọ́run nínú; yíyan ‘ìṣàkóso’ nìkan lè túmọ̀ ọ̀rọ̀ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá. Àtúnṣe gbólóhùn náà pa ìṣe tí ń bá a lọ, ìrìn àjò láti ibì kan sí ibòmíràn, àti ìyàtọ̀ láàárín ‘kéde’ àti ‘sọ ìhìn rere’ mọ́.
