- from: Ó sì ṣe lẹ́yìn náà pé ó ń rìn láti ìlú kan dé òmíràn àti láti abúlé kan dé òmíràn[a], ó ń kéde ìjọba Ọlọ́run, ó sì ń sọ ìhìn rere nípa rẹ̀[b]. Àwọn Méjìlá náà sì wà pẹ̀lú rẹ̀.
  to: Ó sì ṣe lẹ́yìn náà pé ó ń rìn kiri láti ìlú kan dé òmíràn àti láti abúlé kan dé òmíràn[a], ó ń kéde ìjọba Ọlọ́run[b], ó sì ń sọ ìhìn rere nípa rẹ̀. Àwọn Méjìlá náà sì wà pẹ̀lú rẹ̀.
  rationale: A ti rọ́pò ‘ó ń rìn’ pẹ̀lú ‘ó ń rìn kiri’ nìkan, kí ìtumọ̀ náà lè fi ìrìn àjò tí ń tẹ̀síwájú láàrín àwọn ibi púpọ̀ hàn, gẹ́gẹ́ bí διώδευεν. A tún ti gbe àmì [b] sí lẹ́yìn ‘ìjọba Ọlọ́run,’ ibi tí akọ́silẹ̀ náà ti ń ṣàlàyé. Ìyókù gbólóhùn náà pa ìtẹ̀síwájú ìtàn, ìpínpín ìlú/abúlé, ìkéde, ìhìn rere, àti ìbákẹ́gbẹ́ Àwọn Méjìlá mọ́.
