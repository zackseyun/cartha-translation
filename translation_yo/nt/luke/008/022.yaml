  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: yo
  text: Ní ọ̀kan lára àwọn ọjọ́ náà, ó ṣẹlẹ̀ pé ó wọ ọkọ̀ ojú omi kan pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀. Ó sì sọ fún wọn pé, “Ẹ jẹ́ kí a kọjá lọ sí ìhà kejì adágún náà[a].” Wọ́n sì gbéra lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “Ẹ jẹ́ kí a kọjá lọ sí apá kejì adágún náà.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìrìn ọkọ̀ lórí omi; ó lè túmọ̀ sí “wọ́n bẹ̀rẹ̀ ìrìn ọkọ̀ wọn” tàbí “wọ́n kúrò ní etí omi pẹ̀lú ọkọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ó ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣe àfihàn ìyípadà sí ìṣẹ̀lẹ̀ tuntun nínú ìtàn, láìlo ọ̀rọ̀ àtijọ́ tàbí fífi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ní ọ̀kan lára àwọn ọjọ́ náà
  rationale: Èyí pa ìtumọ̀ apá-kan-nínú-ọ̀pọ̀ mọ́, ó sì fi hàn pé ọjọ́ náà wà láàárín àkókò tí a ti ń sọ̀rọ̀ nípa rẹ̀.
- source_word: αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ó wọ ọkọ̀ ojú omi kan pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì mú un ṣe kedere pé òun àti àwọn ọmọ-ẹ̀yìn rẹ̀ wọ inú ọkọ̀ náà; ‘kan’ bá àìní article pàtó lórí πλοῖον mu.
- source_word: εἶπεν πρὸς αὐτούς
  choice: ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere fún ọ̀rọ̀ tí a sọ sí àwọn ènìyàn.
- source_word: Διέλθωμεν
  choice: Ẹ jẹ́ kí a rékọjá lọ
  rationale: ‘Ẹ jẹ́ kí a’ fi ìmọ̀ràn tàbí ìpè fún olùsọ̀rọ̀ àti àwọn tó ń gbọ́ hàn, gẹ́gẹ́ bí subjunctive onítànilólùwọ̀pọ̀ náà; ‘rékọjá lọ’ pa ìtọ́sọ́nà ìrìn náà mọ́.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: sí ìhà kejì adágún náà
  rationale: ‘Ìhà kejì’ túmọ̀ τὸ πέραν ní kedere, ‘adágún’ sì bá λίμνη mu ju ‘òkun’ lọ.
- source_word: ἀνήχθησαν
  choice: wọ́n sì gbéra lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún bí wọ́n ṣe bẹ̀rẹ̀ ìrìn wọn; àlàyé ìsàlẹ̀ fi ìtumọ̀ pàtó ọ̀rọ̀ ọkọ̀ ojú omi náà hàn.
