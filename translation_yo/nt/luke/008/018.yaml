id: LUK.8.18
reference: Luke 8:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: yo
  text: Nítorí náà, ẹ kíyè sí bí ẹ ṣe ń gbọ́. Nítorí ẹni tí ó bá ní, a ó fi kún un; ẹni tí kò bá sì ní, àní ohun tí ó rò pé ó ní[a] ni a ó gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àní ohun tí ó dàbí pé ó ní ni a ó gbà kúrò lọ́wọ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: ẹ kíyè sí
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn olùgbọ́ láti ṣọ́ra kí wọ́n sì fiyè sí ohun tí wọ́n ń ṣe; ‘ẹ kíyè sí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú agbára ìkìlọ̀ náà jáde.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ ẹ̀kọ́ tó ṣáájú nípa gbígbọ́ àti bí ènìyàn ṣe ń gba ọ̀rọ̀ náà.
- source_word: πῶς ἀκούετε
  choice: bí ẹ ṣe ń fetí sílẹ̀
  rationale: πῶς tẹnu mọ́ ọ̀nà tí a fi ń gbọ́, kì í ṣe pé etí kan gbọ́ ohùn lásán; ‘fetí sílẹ̀’ fi gbígbọ́ pẹ̀lú àfiyèsí hàn.
- source_word: ὃς ἂν ... ἔχῃ
  choice: ẹni tí ó bá ní
  rationale: Àkópọ̀ ọ̀rọ̀ yìí jẹ́ ipò gbogbogbò tí kò tọ́ka sí ẹni pàtó; ‘ẹni tí ó bá ní’ pa ìtumọ̀ òwe náà mọ́ lọ́nà àdánidá.
- source_word: δοθήσεται αὐτῷ
  choice: a ó fún un sí i
  rationale: Gíríìkì kò sọ ohun tí a ó fi fún un ní tààrà, ṣùgbọ́n ó tọ́ka sí ìfikún. ‘A ó fún un sí i’ mú ìfikún náà yé ni Yorùbá láì sọ ohun tí ẹsẹ náà kò dárúkọ.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: ẹni tí kò bá sì ní
  rationale: Ó bá àkópọ̀ gbólóhùn àkọ́kọ́ mu, ó sì pa ìtakora tó wà láàárín ẹni tó ní àti ẹni tí kò ní mọ́.
- source_word: ὃ δοκεῖ ἔχειν
  choice: ohun tí ó rò pé òun ní
  rationale: δοκέω lè túmọ̀ sí ‘rò’ tàbí ‘dàbí ẹni pé.’ Nínú gbólóhùn yìí, ‘ó rò pé òun ní’ ṣe kedere pé ohun-ìní náà wà nínú ìrò ẹni náà, nígbà tí akọsilẹ̀ ìsàlẹ̀ pa àṣàyàn kejì mọ́.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ó gbà kúrò lọ́wọ́ rẹ̀
  rationale: Àkópọ̀ Yorùbá yìí sọ ìyọkúrò tàbí fífi ẹni kan du ohun tí ó ní lọ́nà tó ṣe kedere.
- source_word: αὐτῷ / αὐτοῦ
  choice: un / lọ́wọ́ rẹ̀
  rationale: Àwọn arọ́pò-orúkọ wọ̀nyí tọ́ka sí ẹni kọ̀ọ̀kan nínú òwe gbogbogbò náà, wọ́n sì jẹ́ àdánidá ní Yorùbá láì fi akọ tàbí abo kún ohun tí kò pọndandan.
theological_decisions:
- issue: Agbára ìtumọ̀ òwe nípa ẹni tó ní àti ẹni tí kò ní
  choice: A fi òwe náà sílẹ̀ nínú àyíká ọ̀rọ̀ rẹ̀ nípa bí ènìyàn ṣe ń fetí sí ọ̀rọ̀ Jésù, láì sọ ọ́ di ẹ̀kọ́ nípa àyànmọ́, iṣẹ́ rere, tàbí ọrọ̀ ayé.
  alternative: A lè ka a sí ìlànà gbogbogbò nípa ìmúrasílẹ̀ ọkàn nípa tẹ̀mí tàbí nípa ìṣàmúlò ohun tí a fi lé ẹni lọ́wọ́.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ ìlànà alájàm̀bá kan tó so mọ́ gbígbọ́. Ìtumọ̀ náà pa ìfúnpọ̀ ẹ̀kọ́ yìí mọ́, kò sì fi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Ohun tí δοκεῖ túmọ̀ sí nínú ọ̀rọ̀ náà
  choice: ohun tí ó rò pé òun ní
  alternative: ohun tí ó dàbí ẹni pé ó ní
  rationale: Gíríìkì gba ìtumọ̀ méjèèjì láàyè. Ọ̀rọ̀ inú ẹsẹ kò fi dandan yan bóyá ìrò ẹni náà ni tàbí bí ohun náà ṣe farahàn síta; a lo ìtumọ̀ tó ṣe kedere jù ní àkọ́kọ́, a sì pa èkejì mọ́ nínú akọsilẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. A lo ọ̀rọ̀ ọ̀wọ̀ púpọ̀ ‘ẹ’ fún àwọn olùgbọ́ tí Jésù ń bá sọ̀rọ̀, àti èdè tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní.
