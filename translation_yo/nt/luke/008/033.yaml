id: LUK.8.33
reference: Luke 8:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: yo
  text: Nígbà náà, àwọn ẹ̀mí èṣù náà jáde kúrò nínú ọkùnrin náà, wọ́n sì wọ inú àwọn ẹlẹ́dẹ̀ náà; agbo ẹlẹ́dẹ̀ náà sì sáré sọ̀ kalẹ̀ ní ibi gẹ̀rẹ́gẹ̀rẹ́ náà sínú adágún náà, wọ́n sì rì kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba etí òkè gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ kalẹ̀” tàbí “kọjá ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ kalẹ̀”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìsọ̀kalẹ̀ tí ó gẹ̀rẹ́gẹ̀rẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου
  choice: àwọn ẹ̀mí èṣù náà jáde kúrò lára ọkùnrin náà
  rationale: Aorist participle marks action preceding the main verb. The idiomatic Yoruba sequence conveys this naturally, while “ẹ̀mí èṣù” preserves the specific reference to demons and “kúrò lára” fits departure from a possessed person.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: wọ́n sì wọ inú àwọn ẹlẹ́dẹ̀
  rationale: This directly represents motion into the pigs in clear, ordinary Yoruba.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: agbo ẹlẹ́dẹ̀ náà sì tú eré
  rationale: The singular collective noun is rendered as “agbo ẹlẹ́dẹ̀,” and “tú eré” communicates the sudden, forceful rush without assigning motive.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ kalẹ̀
  rationale: This expresses rapid downward movement over a steep slope without requiring the stronger image of a sheer cliff.
- source_word: εἰς τὴν λίμνην
  choice: sínú adágún
  rationale: “Adágún” distinguishes a lake from the sea and reflects λίμνη.
- source_word: ἀπεπνίγη
  choice: wọ́n sì rì kú
  rationale: Although the Greek verb is singular because the herd is collective, natural Yoruba resumes the individual pigs with plural “wọ́n.” “Rì kú” clearly conveys death by drowning in this context.
theological_decisions:
- issue: Rendering δαιμόνια in the possession narrative
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí àìmọ́
  rationale: The source specifically says δαιμόνια, not the separate expression “unclean spirits”; the chosen wording preserves that lexical distinction.
- issue: Degree of specificity in κρημνός
  choice: ibi gẹ̀rẹ́gẹ̀rẹ́
  alternative: òkè àpáta olójú ṣánṣán
  rationale: The Greek denotes a steep descent but does not necessarily require a sheer precipice; the chosen phrase avoids embellishment.
- issue: Number agreement in ἀπεπνίγη
  choice: wọ́n sì rì kú
  alternative: agbo náà sì rì kú
  rationale: Greek uses a singular verb with the collective “herd.” Yoruba naturally shifts to the plural animals; this does not change the event or imply that only part of the herd died.
translation_notes:
  register: Yorùbá àgbàṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ṣe kedere fún òǹkàwé gbogbogbò, ó sì ṣì ní ọ̀wọ̀ àti ìwọ̀ntúnwọ̀nsì tó yẹ fún Ìwé Mímọ́.
