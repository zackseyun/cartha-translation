  terminology: “Àwọn ẹ̀mí èṣù” yẹ fún δαιμόνια nínú àyíká yìí, kò sì rọ́pò ọrọ̀ náà pẹ̀lú “ẹ̀mí àìmọ́.” “Adágún” dájú fún λίμνη. “Ibi gẹ̀rẹ́gẹ̀rẹ́” pa ìtumọ̀ κρημνός mọ́ láì fi dandan ṣe e ní òkè àpáta olójú ṣánṣán.
