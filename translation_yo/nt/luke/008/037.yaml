id: LUK.8.37
reference: Luke 8:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: yo
  text: Gbogbo ogunlọ́gọ̀ láti agbègbè àyíká àwọn ará Gérásénì béèrè lọ́wọ́ rẹ̀ pé kí ó kúrò lọ́dọ̀ wọn, nítorí ẹ̀rù ńlá mú wọn.[a] Nígbà náà, ó wọ inú ọkọ̀ ojú omi kan, ó sì padà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rù ńlá gbá wọn mú.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún συνείχοντο, èyí tí ó lè túmọ̀ sí pé ohun kan dì tàbí gbá ènìyàn mú.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ní kí ó ṣe ohun kan; kò sì fi agbára ẹ̀bẹ̀ tí ó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ἅπαν τὸ πλῆθος
  choice: gbogbo ogunlọ́gọ̀
  rationale: Ó pa ìtumọ̀ gbogbo àwọn ènìyàn tí ó péjọ mọ́, ó sì bójú mu fún ìtàn ọlọ́lá ní Yorùbá.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: tó wá láti agbègbè àwọn ará Gérásénì tí ó yí ká
  rationale: Ó sọ pé ogunlọ́gọ̀ náà wá láti gbogbo agbègbè àyíká tí a so mọ́ àwọn ará Gérásénì, láì sọ orúkọ ibòmíràn dípò ẹ̀rí inú ọ̀rọ̀ Gíríìkì.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: kí ó kúrò lọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ yìí ṣe àfihàn ìbéèrè wọn ní Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ jíjìnnà sí wọn mọ́.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: ẹ̀rù ńlá mú wọn gidigidi
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún bí ìbẹ̀rù ṣe dì wọ́n mú; kò pinnu bóyá ẹ̀rù náà jẹ́ ọ̀wọ̀ fún agbára Ọlọ́run, ìkórìíra, tàbí ohun mìíràn.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ó wọ inú ọkọ̀ ojú omi kan
  rationale: Ó tú ìṣe pípa wọ ọkọ̀ sí Yorùbá kedere; ‘kan’ bá àìsí atíkù pàtó nínú Gíríìkì mu.
- source_word: ὑπέστρεψεν
  choice: ó sì padà
  rationale: Ó jẹ́ ìtumọ̀ ṣókí, àdánidá fún lílọ padà nínú ìtàn.
theological_decisions:
- issue: Ìdí pàtó tí àwọn ènìyàn fi bẹ̀rù tí wọ́n sì ní kí Jésù lọ
  choice: A sọ pé ẹ̀rù ńlá mú wọn, láì ṣàlàyé irú ẹ̀rù náà.
  alternative: A lè túmọ̀ ẹ̀rù náà sí ìbẹ̀rù ọlọ́wọ̀ fún agbára Ọlọ́run tàbí sí ìbínú nítorí àdánù àti ìdàrúdàpọ̀.
  rationale: Ẹsẹ náà kò sọ ohun tí ẹ̀rù náà dá lé tàbí bóyá ó jẹ́ ẹ̀rù ọlọ́wọ̀, ìkórìíra, tàbí àkópọ̀ méjèèjì; nítorí náà, a pa àìdájú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa ọlọ́lá, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘béèrè lọ́wọ́ rẹ̀’ dípò ọ̀rọ̀ tó lè mú kí ìbéèrè náà dà bí ẹ̀bẹ̀ líle ju bí Gíríìkì ṣe sọ ọ́ lọ.
