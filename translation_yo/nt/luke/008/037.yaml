revisions:
- from: Gbogbo ogunlọ́gọ̀ tó wá láti agbègbè àwọn ará Gérásénì tí ó yí ká sì béèrè lọ́wọ́ rẹ̀ pé kí ó kúrò lọ́dọ̀ wọn, nítorí ẹ̀rù ńlá mú wọn gidigidi.[a] Nígbà náà, ó wọ inú ọkọ̀ ojú omi kan, ó sì padà.
  to: Gbogbo ogunlọ́gọ̀ láti agbègbè àyíká àwọn ará Gérásénì béèrè lọ́wọ́ rẹ̀ pé kí ó kúrò lọ́dọ̀ wọn, nítorí ẹ̀rù ńlá mú wọn.[a] Nígbà náà, ó wọ inú ọkọ̀ ojú omi kan, ó sì padà.
  rationale: Àtúnṣe náà yọ ìmúgbòòrò ‘gidigidi’ kúrò kí ìwọ̀n φόβῳ μεγάλῳ lè wà ní bí ọ̀rọ̀ orísun ṣe rí. Ó tún ṣàtúnṣe ìṣètò ‘agbègbè àyíká àwọn ará Gérásénì’ láti jẹ́ kí περίχωρος τῶν Γερασηνῶν hàn gbangba. Kò fi ìtumọ̀ ẹ̀sìn tàbí ìdí tí wọ́n fi bẹ̀rù kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbo ìpín pàtàkì: gbogbo ogunlọ́gọ̀ náà, agbègbè àyíká àwọn ará Gérásénì, ìbéèrè pé kí ó kúrò, ìbẹ̀rù ńlá, wíwọ ọkọ̀ ojú omi, àti ìpadà rẹ̀. Ṣùgbọ́n ‘gidigidi’ ń fi ìmúgbòòrò kún ‘ẹ̀rù ńlá,’ tí φόβῳ μεγάλῳ kò sọ lọ́nà ìlọ́po méjì.'
  naturalness: Gbólóhùn náà ṣeé lóye, ṣùgbọ́n ‘tó wá láti agbègbè àwọn ará Gérásénì tí ó yí ká’ lè dà bí ẹni pé àwọn ará Gérásénì fúnra wọn ni ohun tí ó yí ká. ‘láti agbègbè àyíká àwọn ará Gérásénì’ jẹ́ Yorùbá tó rọrùn, tó sì ṣàfihàn ìbáṣepọ̀ gírámà Gíríìkì ní kedere.
  terminology: ‘Ogunlọ́gọ̀,’ ‘ará Gérásénì,’ ‘kúrò lọ́dọ̀ wọn,’ ‘ẹ̀rù ńlá,’ àti ‘ọkọ̀ ojú omi’ bá àkọsílẹ̀ ìtàn ọlọ́lá mu. Àmì ohùn àti ìkọ̀wé orúkọ náà yẹ.
  issues:
  - severity: low
    issue: ‘gidigidi’ lẹ́yìn ‘ẹ̀rù ńlá’
    rationale: ‘Ńlá’ ti tú μεγάλῳ (‘great’) tẹlẹ̀; ‘gidigidi’ lè sọ ìbẹ̀rù náà di ‘very great,’ ju ìwọ̀n ọ̀rọ̀ orísun lọ.
  - severity: low
    issue: Ìpò gbolóhùn ‘tí ó yí ká’
    rationale: Nínú àkọ́kọ́, ó lè ṣòro láti mọ ohun tí gbolóhùn ìbátan náà ń ṣàlàyé. Ṣíṣe é di ‘agbègbè àyíká àwọn ará Gérásénì’ pa ‘surrounding region of the Gerasenes’ mọ́ ní kedere.
