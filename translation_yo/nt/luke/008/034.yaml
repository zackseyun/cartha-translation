  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: àwọn tó ń tọ́jú agbo náà rí ìṣẹ̀lẹ̀ náà, wọ́n sá lọ, wọ́n sì ròyìn rẹ̀ ní ìlú àti ní àgbègbè ìgbèríko. Ìtumọ̀ ‘ìgbèríko’ fún τοὺς ἀγρούς yẹ ní àyíká ìfiwéra pẹ̀lú ìlú, àti àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘oko’ mọ́.'
