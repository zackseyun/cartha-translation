source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: yo
  text: Nígbà tí àwọn olùtọ́jú ẹlẹ́dẹ̀ náà rí ohun tí ó ṣẹlẹ̀[a], wọ́n sá lọ, wọ́n sì ròyìn rẹ̀ ní ìlú àti ní ìgbèríko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó ti wáyé.”
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ tààrà, “ní àwọn oko”; níhìn-ín ó ń tọ́ka sí ìgbèríko tó yí ìlú náà ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Nígbà tí ... rí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò ní Yorùbá àdánidá, láì pàdánù ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ìṣe pàtàkì tó tẹ̀ lé e.
- source_word: οἱ βόσκοντες
  choice: àwọn olùṣọ́ ẹlẹ́dẹ̀ náà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, àwọn tó ń tọ́jú agbo ẹlẹ́dẹ̀ ni participle náà ń tọ́ka sí; yíyan ọ̀rọ̀ yìí kò ní mú kí òǹkàwé rò pé agbo àgùntàn ni.
- source_word: τὸ γεγονός
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún participle perfect tí a lò gẹ́gẹ́ bí nọ́ọ̀nù, ó sì tọ́ka sí ìṣẹ̀lẹ̀ tí ó ti wáyé.
- source_word: ἔφυγον
  choice: wọ́n sá lọ
  rationale: Ó fi ìtumọ̀ φεύγω hàn ní kedere gẹ́gẹ́ bí fífi ibi náà sílẹ̀ nítorí ìbẹ̀rù tàbí ewu, láì fi èrò ‘bọ́ lọ́wọ́’ kún un.
- source_word: ἀπήγγειλαν
  choice: wọ́n ròyìn rẹ̀
  rationale: ‘Ròyìn’ bá ìṣe fífi ìròyìn ohun tó ṣẹlẹ̀ dé ọ̀dọ̀ àwọn ẹlòmíràn mu; ‘rẹ̀’ jẹ́ ohun tí ọ̀rọ̀ àyíká fi hàn.
- source_word: εἰς τὴν πόλιν
  choice: ní ìlú
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń fi ìtọ́sọ́nà hàn, pẹ̀lú ọ̀rọ̀ ìṣe fífi ìròyìn dé ibì kan, ‘ní ìlú’ jẹ́ Yorùbá àdánidá tó fi ibi tí wọ́n ti tan ìròyìn náà hàn.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: àti ní àwọn agbègbè ìgbèríko
  rationale: ἀγρούς lè túmọ̀ ní tààrà sí àwọn oko, ṣùgbọ́n ní ìtakora pẹ̀lú ‘ìlú’ ó ń tọ́ka sí àwọn agbègbè ìgbèríko tó yí ìlú náà ká.
