translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A sọ ‘ẹlẹ́dẹ̀’ ní kedere láti jẹ́ kí ẹni tí οἱ βόσκοντες ń tọ́ka sí yé òǹkàwé láti inú àyíká ọ̀rọ̀.
