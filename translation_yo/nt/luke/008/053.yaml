source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: yo
  text: Wọ́n sì ń rẹ́rìn-ín sí i, nítorí wọ́n mọ̀ pé ó ti kú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: ń fi í rẹ́rìn-ín
  rationale: Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ ẹ̀gàn, ìrísí imperfect sì fi hàn pé ìṣe náà ń lọ lọ́wọ́; gbolohun yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń rẹ́rìn-ín ẹnì kan ní ẹ̀gàn.
- source_word: αὐτοῦ
  choice: í
  rationale: Arọ́pò-orúkọ yìí tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọ́n ń fi rẹ́rìn-ín; ‘í’ bá àkópọ̀ ọ̀rọ̀ Yorùbá ‘fi í rẹ́rìn-ín’ mu.
- source_word: εἰδότες
  choice: nítorí wọ́n mọ̀
  rationale: Participle náà ń sọ ìdí tí wọ́n fi ń rẹ́rìn-ín; yíyí i sí gbólóhùn ìdí jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì bójú tó ìbáṣepọ̀ ọ̀rọ̀ inú àyíká.
- source_word: ὅτι
  choice: pé
  rationale: ὅτι ń ṣí àkóónú ohun tí wọ́n mọ̀ sílẹ̀; ‘pé’ ni àmì ìṣàkóso gbólóhùn tó yẹ ní Yorùbá.
- source_word: ἀπέθανεν
  choice: ó ti kú
  rationale: Aorist náà sọ ikú gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ti parí; ‘ó ti kú’ sọ ìparí yẹn ní Yorùbá àdánidá láì yí i padà sí àpèjúwe ipò nìkan.
theological_decisions:
- issue: Bóyá kí a fi ‘ọmọbìnrin náà’ hàn gbangba níbi tí Gíríìkì ti ní ọ̀rọ̀-ìṣe ẹni kẹta ẹyọ ṣoṣo láìsí orúkọ.
  choice: Lo ‘ó ti kú,’ kí ẹni tí ‘ó’ ń tọ́ka sí yé láti inú àyíká.
  alternative: ‘ọmọbìnrin náà ti kú’ tàbí ‘ọmọ náà ti kú’
  rationale: Èdè Gíríìkì kò tún orúkọ ọmọbìnrin náà sọ ní ẹsẹ yìí. Arọ́pò-orúkọ Yorùbá pa ìkékúrú orísun mọ́, nígbà tí àyíká ṣáájú mú ẹni tí a ń tọ́ka sí ṣe kedere.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. ‘Ń fi í rẹ́rìn-ín’ mú ẹ̀gàn inú καταγελάω àti ìṣe tí ń lọ lọ́wọ́ hàn; a kò fi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ orísun.
