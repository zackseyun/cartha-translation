reference: Luke 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì ń bi í pé, “Kí ni òwe yìí túmọ̀ sí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ṣe rí gan-an, “Kí ni òwe yìí lè jẹ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: ń bi í pé
  rationale: Ọ̀rọ̀-ìṣe àìpé náà lè fi ìṣe tó ń lọ tàbí ìbéèrè tí wọ́n ń béèrè hàn; ‘ń bi í pé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n béèrè lọ́wọ́ rẹ̀.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; ‘sì’ so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú láìfi ìtakora líle kún un.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ μαθηταί gẹ́gẹ́ bí àwọn tó ń kọ́ lẹ́yìn olùkọ́ mọ́.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: Kí ni òwe yìí túmọ̀ sí?
  rationale: Bí ó tilẹ̀ jẹ́ pé lítírésọ̀ ọ̀rọ̀ náà sún mọ́ ‘kí ni òwe yìí lè jẹ́,’ àyíká fi hàn pé wọ́n ń béèrè ìtumọ̀ rẹ̀; èdè yìí jẹ́ ti Yorùbá àdánidá, nígbà tí àlàyé ìtumọ̀ gangan wà nínú àlàyé ìsàlẹ̀.
- source_word: παραβολή
  choice: òwe
  rationale: Nínú àyíká ìkọ́ni Jesu, ‘òwe’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún àkọsílẹ̀ àpẹẹrẹ tàbí ìtàn àfiwé; àyíká náà yà á sọ́tọ̀ kúrò nínú òwe kúkúrú lasán.
- source_word: εἴη
  choice: túmọ̀ sí
  rationale: Optative inú ìbéèrè aláìtaara lẹ́yìn ọ̀rọ̀-ìṣe àkókò tó kọjá ń sọ ìwádìí wọn; ‘túmọ̀ sí’ mú ète ìbéèrè náà jáde ní Yorùbá tó ṣeé kà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ń bi í’ láti fi ipa imperfect hàn, a sì fi àmì ohùn sí ibi tí ó bá àdánidá mu.
