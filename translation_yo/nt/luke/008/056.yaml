  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: yo
  text: Àwọn òbí rẹ̀ sì jẹ́ ẹnu yà gidigidi, ṣùgbọ́n ó pàṣẹ fún wọn pé kí wọn má sọ ohun tí ó ṣẹlẹ̀ fún ẹnikẹ́ni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστησαν
  choice: jẹ́ ẹnu yà gidigidi
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle hàn. ‘Jẹ́ ẹnu yà gidigidi’ jẹ́ Yorùbá àdánidá tí ó mú agbára ìhùwàpadà náà jáde láìtúmọ̀ ọ́ sí pé wọ́n pàdánù ìṣàkóso ara wọn.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe tààrà fún bàbá àti ìyá ọmọ náà lápapọ̀.
- source_word: παρήγγειλεν
  choice: pàṣẹ fún
  rationale: Ọ̀rọ̀ Gíríìkì náà ní agbára àṣẹ tàbí ìtọ́ni tó lágbára. Nínú àyíká yìí, ‘pàṣẹ fún’ ṣe àfihàn pé kì í ṣe àbá lásán.
- source_word: μηδενὶ
  choice: fún ẹnikẹ́ni
  rationale: Pẹ̀lú gbólóhùn ìkìlọ̀ ‘kí wọn má sọ,’ èyí túmọ̀ sí pé wọn kò gbọdọ̀ sọ fún ẹnikẹ́ni.
- source_word: εἰπεῖν
  choice: sọ
  rationale: ‘Sọ ... fún ẹnikẹ́ni’ jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó ṣe déédéé fún fífi ohun kan tó ṣẹlẹ̀ tó ẹlòmíràn létí.
- source_word: τὸ γεγονός
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Àpólà aláṣepọ̀ pípé tí a lò gẹ́gẹ́ bí orúkọ ń tọ́ka sí ìṣẹ̀lẹ̀ tí ó ti wáyé; ‘ohun tí ó ṣẹlẹ̀’ mú èyí jáde lọ́nà tó ṣe kedere.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ kékeré tó wà láàárín ìyàlẹ́nu àwọn òbí náà àti àṣẹ tí Jesu fún wọn hàn.
theological_decisions:
- issue: Àṣírí nípa Mèsáyà àti bí àṣẹ Jesu ṣe gbòòrò tó
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààrà gẹ́gẹ́ bí àṣẹ pé kí wọ́n má sọ ohun tí ó ṣẹlẹ̀ fún ẹnikẹ́ni.
  alternative: A lè ka á sí àṣẹ ìdákẹ́jẹ tó ní í ṣe pẹ̀lú àṣírí nípa Mèsáyà, tàbí sí ìtọ́ni fún àkókò díẹ̀ tàbí fún àwọn ènìyàn kan ṣoṣo.
  rationale: Ẹsẹ náà kò sọ ìdí àṣẹ náà tàbí bí yóò ṣe pẹ́ tó. Nítorí náà, ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, òde òní, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘jẹ́ ẹnu yà gidigidi’ fún ìyàlẹ́nu líle, àti ‘pàṣẹ fún’ láti pa agbára ọ̀rọ̀ Gíríìkì mọ́.
