revisions:
- from: Sì wò ó, ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jáírù dé. Ó sì jẹ́ olórí sínágọ́gù. Ó wólẹ̀ lẹ́gbẹ̀ẹ́ ẹsẹ̀ Jésù, ó sì bẹ̀ ẹ́ pé kí ó wọ ilé òun,
  to: Sì kíyèsí, ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jáírù dé; ó sì jẹ́ olórí sínágọ́gù. Ó sì wólẹ̀ ní ẹsẹ̀ Jésù, ó ń bẹ̀ ẹ́ kí ó wọ inú ilé rẹ̀,
  rationale: Àtúnṣe náà mú ibi tí Jáírù wólẹ̀ wá sí «ní ẹsẹ̀ Jésù,» èyí tó bá ìtumọ̀ Gíríìkì mu dáadáa, ó sì lo «ó ń bẹ̀» láti ṣàfihàn àìpé ọrọ̀-ìṣe náà. A tún ṣe ìbẹ̀rẹ̀ sí «Sì kíyèsí» fún ìṣàn Yorùbá àkọsílẹ̀ tó dára, a sì fi «inú ilé rẹ̀» ṣe kedere ẹni tí ilé náà jẹ́ tirẹ̀. Kò sí ẹsẹ̀-àlàyé tí orísun tàbí ìtumọ̀ náà béèrè fún.
