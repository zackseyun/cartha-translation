source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: yo
  text: Sì kíyèsí, ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jáírù dé; ó sì jẹ́ olórí sínágọ́gù. Ó sì wólẹ̀ ní ẹsẹ̀ Jésù, ó ń bẹ̀ ẹ́ kí ó wọ inú ilé rẹ̀,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa ìfihàn ìṣẹ̀lẹ̀ tuntun àti ìpe sí àfiyèsí mọ́, ní ọ̀nà tó bá Yorùbá àkọsílẹ̀ ọlọ́lá mu.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: olórí sínágọ́gù
  rationale: Ó túmọ̀ ipò Jáírù gẹ́gẹ́ bí aṣáájú sínágọ́gù láì fi ojúṣe pàtó kan kún ohun tí Gíríìkì kò sọ.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: Ó wólẹ̀ lẹ́gbẹ̀ẹ́ ẹsẹ̀ Jésù
  rationale: παρά pẹ̀lú accusative níbí ń tọ́ka sí ibi tó sún mọ́ ẹsẹ̀ Jésù; ‘wólẹ̀’ fi ìṣe ìrẹ̀lẹ̀ àti ẹ̀bẹ̀ hàn láì túmọ̀ rẹ̀ sí ìjọsìn ní dandan.
- source_word: παρεκάλει
  choice: ó sì bẹ̀ ẹ́
  rationale: Àìpé Gíríìkì lè fi ẹ̀bẹ̀ tó ń bá a lọ hàn; ọ̀rọ̀ Yorùbá yìí sọ ìtẹnumọ́ ẹ̀bẹ̀ náà ní ti ẹ̀dá.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: kí ó wọ ilé òun
  rationale: Ó tẹ̀lé ìtumọ̀ gígùn pé kí Jésù wọ inú ilé Jáírù; ‘òun’ mú kí ẹni tí ilé jẹ́ tirẹ̀ ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ìwólẹ̀ Jáírù ní ẹsẹ̀ Jésù
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìṣe ìrẹ̀lẹ̀ àti ẹ̀bẹ̀.
  alternative: Láti pè é ní ìjọsìn Jáírù fún Jésù.
  rationale: Ẹsẹ yìí sọ pé ó ṣubú lẹ́gbẹ̀ẹ́ ẹsẹ̀ Jésù, ṣùgbọ́n kò lo ọ̀rọ̀ προσκυνέω; nítorí náà a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó ju orísun lọ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ ìtàn Júù tó wọ́pọ̀, a sì yà àwọn gbólóhùn náà sí kéékèèké fún ìṣàn ọ̀rọ̀ àdánidá.
