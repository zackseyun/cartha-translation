revisions:
- from: Obìnrin kan sì wà níbẹ̀ tí ẹ̀jẹ̀ ti ń dà lára rẹ̀ fún ọdún méjìlá[a]. Ó ti ná gbogbo ohun tí ó ní láti fi gbé ayé fún àwọn oníṣègùn[b], ṣùgbọ́n kò sí ẹnikẹ́ni tí ó lè wò ó sàn[c].
  to: Obìnrin kan sì wà tí ó ti ní ìṣàn ẹ̀jẹ̀ fún ọdún méjìlá[a]. Ó sì ti ná gbogbo ohun ìní rẹ̀ fún àwọn oníṣègùn[b], kò sì lè rí ìwòsàn gbà láti ọ̀dọ̀ ẹnikẹ́ni[c].
  rationale: Àtúnṣe náà yọ àfikún ipò àti ìsopọ̀ àtakò tí Gíríìkì kò sọ, ó lo ìsọ̀rọ̀ Yorùbá tó kedere fún àìsàn ìṣàn ẹ̀jẹ̀ àti passive ‘láti ọ̀dọ̀ ẹnikẹ́ni,’ ó sì tún àlàyé ìsàlẹ̀ ṣe kí ó bá Gẹ̀ẹ́sì POB audit trail tí a pèsè mu. A pa àìdánilójú ìyàtọ̀ ìwé àfọwọ́kọ mọ́, láìfikún ìtumọ̀ ẹ̀kọ́-ìsìn.
