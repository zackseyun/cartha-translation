source:
  edition: SBLGNT
  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: yo
  text: Obìnrin kan sì wà tí ó ti ní ìṣàn ẹ̀jẹ̀ fún ọdún méjìlá[a]. Ó sì ti ná gbogbo ohun ìní rẹ̀ fún àwọn oníṣègùn[b], kò sì lè rí ìwòsàn gbà láti ọ̀dọ̀ ẹnikẹ́ni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ní ìṣàn ẹ̀jẹ̀,” tàbí ní ọ̀nà tó túbọ̀ rọrùn, “tí ó ń jìyà ẹ̀jẹ̀ dídà.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì βίος níbí túmọ̀ sí ohun àmúgbésí-ayé rẹ̀ tàbí ohun ìní rẹ̀, kì í ṣe ìyè rẹ̀ tàbí gbogbo àkókò ayé rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé àfọwọ́kọ kan, tí Textus Receptus àti ìtàn KJV tẹ̀lé, ní àfikún pé kò lè rí ìwòsàn gbà láti ọ̀dọ̀ ẹnikẹ́ni lẹ́yìn tí wọ́n ti sọ pé ó ná gbogbo ohun àmúgbésí-ayé rẹ̀ fún àwọn oníṣègùn. Ọ̀rọ̀ SBLGNT ní gbolohun àìlè rí ìwòsàn náà, ṣùgbọ́n kò fi ìtumọ̀ tó lágbára jù sí i pé àwọn oníṣègùn náà kùnà láti wo ó sàn.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: Obìnrin kan sì wà níbẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti gbé obìnrin náà wọ inú ìtàn, nígbà tí ó ṣì ń fi participle Gíríìkì hàn gẹ́gẹ́ bí àlàyé abẹ́lẹ̀.
- source_word: ἐν ῥύσει αἵματος
  choice: ẹ̀jẹ̀ ti ń dà lára rẹ̀
  rationale: Gbólóhùn yìí ṣe kedere pé ìṣàn ẹ̀jẹ̀ tí kò dáwọ́ dúró ni obìnrin náà ń jìyà rẹ̀, láìsọ irú àìsàn náà ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: fún ọdún méjìlá
  rationale: Ọ̀nà Yorùbá tó bójú mu ni èyí fún àkókò tí ohun kan ti ń lọ lọ́wọ́.
- source_word: ἰατροῖς
  choice: fún àwọn oníṣègùn
  rationale: Oníṣègùn jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún àwọn tó ń tọ́jú àìsàn; ‘fún’ sì fi àwọn ẹni tí ó ná owó sí hàn.
- source_word: προσαναλώσασα
  choice: Ó ti ná
  rationale: Àmì ‘ti’ fi hàn pé lílo gbogbo ohun ìní náà ti ṣẹlẹ̀ ṣáájú àìlè rí ìwòsàn.
- source_word: ὅλον τὸν βίον
  choice: gbogbo ohun tí ó ní láti fi gbé ayé
  rationale: βίος níbí túmọ̀ sí ohun ìní tàbí ohun ìgbẹ́mìíró, kì í ṣe ẹ̀mí tàbí gbogbo ọdún ayé rẹ̀.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: kò sí ẹnikẹ́ni tí ó lè wò ó sàn
  rationale: Èyí tú ìtumọ̀ àìlè gba ìwòsàn lọ́wọ́ ẹnikẹ́ni sí Yorùbá àdánidá, ó sì pa ìtumọ̀ passive náà mọ́ nípa fífi olùwòsàn tí kò sí hàn.
theological_decisions:
- issue: Bóyá θεραπευθῆναι yẹ kí a túmọ̀ ní èdè ẹ̀sìn tàbí ti ìtọ́jú ara
  choice: wò ó sàn
  alternative: mú un lára dá
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwòsàn ara ní àyíká yìí. ‘Wò ó sàn’ jẹ́ èdè Yorùbá tó ṣe kedere, kò sì fi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. ‘Ẹ̀jẹ̀ ti ń dà lára rẹ̀’ jẹ́ àdánidá ju títú àwòrán Gíríìkì ní ọ̀rọ̀-kí-ọ̀rọ̀ lọ; ‘gbogbo ohun tí ó ní láti fi gbé ayé’ sì yẹra fún ìtumọ̀ aṣìṣe pé ó ná ‘gbogbo ayé’ rẹ̀.
