language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: yo
  text: Nígbà tí obìnrin náà sì rí i pé ohun tí òun ṣe kò farapamọ́[a], ó wá pẹ̀lú ìwárìrì, ó sì dojúbolẹ̀ níwájú rẹ̀[b]. Níwájú gbogbo àwọn ènìyàn, ó sọ ìdí tí òun fi fọwọ́ kàn án àti bí a ṣe mú un láradá lẹ́sẹ̀kẹsẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé òun kò bọ́ lọ́wọ́ àkíyèsí,” tàbí, “pé a ti rí ohun tí òun ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ṣubú sílẹ̀ níwájú rẹ̀.” Gíríìkì sọ pé ó ṣubú níwájú rẹ̀, kò sì mẹ́nu kan ẹsẹ̀ rẹ̀ ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: Nígbà tí ... rí i
  rationale: Aorist participle náà fi ipò àkókò tó yọrí sí ìṣe pàtàkì hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá.
- source_word: οὐκ ἔλαθεν
  choice: ohun tí òun ṣe kò farapamọ́
  rationale: Ó mú èrò pé ìṣe obìnrin náà kò ṣe é fi pamọ́ mọ́, láìfi ẹni tí ó ṣàkíyèsí rẹ̀ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τρέμουσα
  choice: pẹ̀lú ìwárìrì
  rationale: Ó pa àwòrán ìwárìrì ara àti ọkàn mọ́ láìdín un kù sí ìbẹ̀rù nìkan.
- source_word: προσπεσοῦσα αὐτῷ
  choice: ó dojúbolẹ̀ níwájú rẹ̀
  rationale: Ó ṣàpèjúwe ìṣubú sílẹ̀ níwájú Jésù fún ẹ̀bẹ̀ tàbí ọ̀wọ̀, láìfi ‘ẹsẹ̀ rẹ̀’ kún ẹsẹ náà.
- source_word: δι’ ἣν αἰτίαν
  choice: ìdí tí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere àti àdánidá láti sọ ‘nítorí ìdí wo.’
- source_word: ἥψατο αὐτοῦ
  choice: òun fi fọwọ́ kàn án
  rationale: ἅπτομαι pẹ̀lú genitive túmọ̀ sí fífi ọwọ́ kàn; lílo ‘òun’ mú ẹni tí obìnrin náà ń tọ́ka sí ṣe kedere nínú àlàyé rẹ̀.
- source_word: ἀπήγγειλεν
  choice: ó sọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí jíṣẹ́ tàbí ròyìn; ‘ó sọ’ jẹ́ èdè Yorùbá òde òní tó bójú mu ní gbangba yìí.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: Níwájú gbogbo àwọn ènìyàn
  rationale: Ó tẹ̀lé ìtumọ̀ ‘níwájú/ní ojú gbogbo àwọn ènìyàn’ ní kedere.
- source_word: ὡς ἰάθη
  choice: bí a ṣe mú òun láradá
  rationale: Ó pa ọ̀nà tí ὡς gbà ṣàgbékalẹ̀ ohun tí obìnrin náà ròyìn mọ́, kò sì sọ ẹni tó ṣe ìwòsàn ní tààrà níbi tí passive Gíríìkì kò ti sọ ọ́.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó túmọ̀ sí pé ìmúláradá ṣẹlẹ̀ lójú ẹsẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ ìdojúbolẹ̀ àti ọ̀rọ̀ obìnrin náà ní gbangba
  choice: A ṣe àpèjúwe pé ó dojúbolẹ̀, ó sì sọ ohun tó ṣẹlẹ̀ ní gbangba, láìpe ìṣe náà ní ìrònúpìwàdà tàbí ìjọsìn ní tààrà.
  alternative: Kí a sọ pé ó jẹ́wọ́ ẹ̀ṣẹ̀ tàbí pé ó jọ́sìn Jésù.
  rationale: Ẹsẹ náà lè fi ọ̀wọ̀ tàbí ẹ̀bẹ̀ hàn, ṣùgbọ́n kò pe ìṣe náà ní ìrònúpìwàdà tàbí ìjọsìn; ìtumọ̀ náà pa àìsọtẹ́lẹ̀ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti ìtàn mímọ́ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘òun’ nínú àlàyé tí obìnrin náà sọ láti yà á sọ́tọ̀ kúrò lọ́dọ̀ Jésù.
