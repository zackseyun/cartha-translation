  to: Bí wọ́n sì ti ń lọ nínú ọkọ̀ ojú omi, ó sùn lọ. Ìjì afẹ́fẹ́ líle sì sọ̀ kalẹ̀ sórí adágún náà, omi sì ń wọ inú ọkọ̀[a], wọ́n sì wà nínú ewu.
  rationale: A tún ọrọ̀ ìjì náà ṣe sí «Ìjì afẹ́fẹ́ líle» nìkan, kí ìtumọ̀ «windstorm» àti ìtẹnumọ́ ἀνέμου lè hàn. A fi ọ̀nà tí ó ṣàdánidá náà silẹ fún συνεπληροῦντο, pẹ̀lú àlàyé ìsàlẹ̀ ojú-ìwé tí ó tọ́ka sí ìtumọ̀ gangan àti ọkọ̀ tí omi ń kún.
