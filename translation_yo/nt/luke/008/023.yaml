  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: yo
  text: Bí wọ́n sì ti ń lọ nínú ọkọ̀ ojú omi, ó sùn lọ. Ìjì afẹ́fẹ́ líle sì sọ̀ kalẹ̀ sórí adágún náà, omi sì ń wọ inú ọkọ̀[a], wọ́n sì wà nínú ewu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “wọ́n sì ń kún”; ìyẹn ni pé, ọkọ̀ náà ń kún fún omi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Bí wọ́n sì ti ń lọ nínú ọkọ̀ ojú omi
  rationale: Ìtumọ̀ yìí mú ìṣe tí ó ń lọ lọ́wọ́ nínú genitive absolute náà jáde ní Yorùbá àdánidá.
- source_word: ἀφύπνωσεν
  choice: ó sùn lọ
  rationale: Ó fi hàn pé ó bẹ̀rẹ̀ sí í sùn, gẹ́gẹ́ bí agbára ingressive ti aorist náà; Jésù ni ẹni tí àyíká ọ̀rọ̀ tọ́ka sí.
- source_word: κατέβη
  choice: sọ̀ kalẹ̀
  rationale: Ó pa àwòrán ìjì tí ó dé láti ibi gíga mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ̀rọ̀ mu.
- source_word: λαῖλαψ ἀνέμου
  choice: ìjì líle
  rationale: Ó sọ ìjì afẹ́fẹ́ oníjàgídíjàgan náà ní ọ̀nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: εἰς τὴν λίμνην
  choice: sórí adágún náà
  rationale: Pẹ̀lú ọ̀rọ̀ ojú-ọjọ́ àti κατέβη, ‘sórí adágún’ jẹ́ ìtumọ̀ Yorùbá tó rọrùn tí ó pa àwòrán ibi tí ìjì náà dé mọ́.
- source_word: συνεπληροῦντο
  choice: omi sì ń wọ inú ọkọ̀
  rationale: Fáàbù imperfect plural náà ní ìṣòro ìtọ́kasí; àyíká fi hàn pé ọkọ̀ ń kún fún omi. Ọ̀rọ̀ yìí sọ ohun tó ń ṣẹlẹ̀ kedere láìsọ pé ọrọ̀ Gíríìkì darúkọ ọkọ̀ ní tààrà.
- source_word: ἐκινδύνευον
  choice: wọ́n sì wà nínú ewu
  rationale: Ó pa ìtumọ̀ ewu tí ó ń bá a lọ nínú imperfect náà mọ́ ní èdè Yorùbá tí ó wọ́pọ̀.
