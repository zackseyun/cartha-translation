id: LUK.8.30
reference: Luke 8:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: yo
  text: Nígbà náà ni Jésù bi í pé, “Kí ni orúkọ rẹ?” Ó sì dáhùn pé, “Lẹ́gíọ̀nù”[a], nítorí pé ọ̀pọ̀ ẹ̀mí èṣù ti wọ inú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lẹ́gíọ̀nù” jẹ́ ọ̀rọ̀ tí ó wá láti èdè Látìn, tí ó ń tọ́ka sí ẹgbẹ́ ọmọ ogun Róòmù ńlá kan; níbí, ó fi hàn pé ọ̀pọ̀ ẹ̀mí èṣù ni ó wà nínú ọkùnrin náà.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: bi í pé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí bí ẹnì kan ní ìbéèrè; ‘bi í pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ìbéèrè tààrà.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ní ibí yìí, δέ ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn; ‘Nígbà náà ni’ mú ìlọsíwájú ìtàn náà yé kedere.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Kí ni orúkọ rẹ?
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì bójú mu fún gbólóhùn Gíríìkì náà.
- source_word: Λεγιών
  choice: Lẹ́gíọ̀nù
  rationale: A ṣe àkọsílẹ̀ ọ̀rọ̀ àjèjì náà ní ìró Yorùbá, nígbà tí àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ọ̀rọ̀ náà ń sọ ìdí tí ó fi pe ara rẹ̀ ní ‘Lẹ́gíọ̀nù.’
- source_word: εἰσῆλθεν
  choice: ti wọ
  rationale: Ìṣe náà ti ṣẹlẹ̀ ṣáájú ìdáhùn rẹ̀; ‘ti wọ’ fi ìbátan àkókò yìí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δαιμόνια πολλὰ
  choice: ọ̀pọ̀ ẹ̀mí èṣù
  rationale: Àṣàyàn yìí pa ìtumọ̀ àwọn ẹ̀dá ẹ̀mí búburú àti ọ̀pọ̀ wọn mọ́ láìrọ̀ ọ́ sí ‘àwọn ẹ̀mí búburú’ lásán.
- source_word: εἰς αὐτόν
  choice: inú rẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘wọ,’ ‘inú rẹ̀’ fi ìṣípò sínú ẹni náà hàn ní Yorùbá tó rọgbọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δαιμόνια ní ọ̀rọ̀ nípa àwọn ẹ̀mí tí ó wọ inú ọkùnrin náà
  choice: ẹ̀mí èṣù
  alternative: ẹ̀mí búburú
  rationale: ‘Ẹ̀mí èṣù’ ń tọ́ka sí àwọn ẹ̀dá ẹ̀mí búburú gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe sọ, kò sì dín ìjẹ́wọ́ ohun àrà ọ̀tọ̀ inú ẹsẹ náà kù.
- issue: Ìbátan àkókò εἰσῆλθεν sí ìdáhùn ‘Lẹ́gíọ̀nù’
  choice: ti wọ
  alternative: wọ
  rationale: ‘Ti wọ’ mú un ṣe kedere pé wíwọlé àwọn ẹ̀mí èṣù náà ti ṣẹlẹ̀ ṣáájú ìdáhùn náà, láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Gbólóhùn náà tẹ̀ lé ìṣàn ìtàn àdánidá, a sì fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ.
