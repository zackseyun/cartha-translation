language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: yo
  text: Wọ́n sì fi ọkọ̀ ojú omi dé agbègbè àwọn ará Gérásà[a], èyí tí ó wà ní òdìkejì Gálílì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan àti àwọn apá Ìhìn Rere tó jọra ní orúkọ náà sí “àwọn ará Gádárà” tàbí “àwọn ará Gérgésà.”
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: fi ọkọ̀ ojú omi dé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí lílọ lórí omi títí dé ibi kan tàbí dídé ibẹ̀ ní ọkọ̀ ojú omi. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìrìn-àjò lórí omi àti dídé ibi náà mọ́.
- source_word: χώραν
  choice: agbègbè
  rationale: Nínú àyíká yìí, χώρα ń tọ́ka sí ìpínlẹ̀ ilẹ̀ tàbí àgbègbè kan, kì í ṣe orílẹ̀-èdè òde òní.
- source_word: Γερασηνῶν
  choice: àwọn ará Gérásà
  rationale: Ẹ̀yà ọ̀rọ̀ Gíríìkì náà ń sọ nípa àwọn ènìyàn tí a mọ̀ mọ́ Gérásà; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ethnicon náà hàn.
- source_word: ἥτις
  choice: èyí tí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn àlàyé tó ń tọ́ka padà sí agbègbè náà láìfi ìtumọ̀ míì kún un.
- source_word: ἀντιπέρα
  choice: ní òdìkejì
  rationale: Ó túmọ̀ sí pé agbègbè náà wà ní ìhà kejì tàbí kọjá sí Gálílì; ‘ní òdìkejì’ jẹ́ ṣókí, ó sì bá àyíká ilẹ̀ mu.
- source_word: Γαλιλαίας
  choice: Gálílì
  rationale: Èyí ni ìkọlórúkọ ibi náà ní Yorùbá pẹ̀lú àmì ohùn tó yẹ.
theological_decisions:
- issue: Ìyàtọ̀ orúkọ ibi nínú àwọn àfọwọ́kọ àti ìtàn Ìhìn Rere tó jọra
  choice: àwọn ará Gérásà
  alternative: àwọn ará Gádárà tàbí àwọn ará Gérgésà
  rationale: SBLGNT ka Γερασηνῶν níbí, nítorí náà ọ̀rọ̀ inú ẹsẹ̀ tẹ̀ lé e. A fi àwọn kíkà mìíràn sínú àlàyé ìsàlẹ̀ kí a má bàa pa ẹ̀rí ìyàtọ̀ àfọwọ́kọ tàbí mú àwọn ìtàn náà dọ́gba láìnídìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘fi ọkọ̀ ojú omi dé’ dípò ìtumọ̀ gígún tó lè fi ìtọ́sọ́nà ‘sọ̀kalẹ̀’ kún ọ̀rọ̀ náà níbi tí Yorùbá kò ti nílò rẹ̀; a sì fi àmì ohùn sí àwọn ọ̀rọ̀ àti orúkọ ibi níbi tó bá yẹ.
