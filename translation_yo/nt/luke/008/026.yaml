review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ ẹsẹ̀ náà tọ́ka dáadáa sí κατέπλευσαν gẹ́gẹ́ bí dídé nípasẹ̀ ọkọ̀ ojú omi, χώραν gẹ́gẹ́ bí “agbègbè,” àti ἀντιπέρα gẹ́gẹ́ bí “ní òdìkejì.” “Àwọn ará Gérásà” fi ethnicon Γερασηνῶν hàn ní kedere, ó sì tẹ̀ lé kíkà SBLGNT.
  naturalness: Ọ̀rọ̀ inú ẹsẹ̀ náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti kà. Àlàyé ìsàlẹ̀ ní ìdàrúdàpọ̀ kékeré nínú “kà á sí,” nítorí “á” lè dà bí ẹni pé ó ń tọ́ka sí agbègbè tàbí sí ohun mìíràn; “ní orúkọ náà” ṣàlàyé pé kíkà ọ̀rọ̀ ni a ń tọ́ka sí.
  terminology: Àwọn orúkọ ibi “Gérásà,” “Gádárà,” “Gérgésà,” àti “Gálílì” jẹ́ ìkọlórúkọ tó bójú mu. “Àfọwọ́kọ” yẹ fún manuscripts; “àwọn apá Ìhìn Rere tó jọra” dájú ju “àwọn ìtàn Ìhìn Rere tó jọra” lọ fún àwọn parallel passages.
  issues:
  - severity: low
    issue: Ọ̀rọ̀ àlàyé ìsàlẹ̀ náà lo “kà á sí.”
    rationale: Ó ṣeé lóye, ṣùgbọ́n ó lè má ṣe kedere ohun tí “á” ń tọ́ka sí. Fífi “ní orúkọ náà” kún un mú kíkà onírúurú orúkọ ibi náà hàn gbangba.
  - severity: low
    issue: “Àwọn ìtàn Ìhìn Rere tó jọra” kò ṣe pàtó bí “parallel Gospel passages.”
    rationale: Àwọn apá inú àwọn Ìhìn Rere, kì í ṣe gbogbo ìtàn, ni a ń fi wé ara wọn nínú àlàyé textual variant yìí.
