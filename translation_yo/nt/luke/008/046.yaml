  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ pé, “Ẹnì kan fọwọ́ kàn mí, nítorí mo mọ̀ pé agbára ti jáde lára mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Ẹnì kan fọwọ́ kàn mí
  rationale: 'Ó sọ ìtumọ̀ ọ̀rọ̀ Gíríìkì ní èdè Yorùbá àdánidá: ẹnì kan fi ọwọ́ kan Jésù.'
- source_word: ἔγνων
  choice: mo mọ̀
  rationale: Aorist ἔγνων túmọ̀ sí pé Jésù mọ ohun tó ṣẹlẹ̀; ‘mo mọ̀’ pa ìtumọ̀ yìí mọ́ láì yí i sí ‘mo rí i’ tàbí ‘mo mọ̀lára.’
- source_word: δύναμιν
  choice: agbára
  rationale: ‘Agbára’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún δύναμις ní àyíká iṣẹ́ ìwòsàn yìí.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: jáde lára mi
  rationale: Ọ̀rọ̀ yìí pa àwòrán agbára tí ó ti jáde kúrò lọ́dọ̀ Jésù mọ́, ó sì jẹ́ èdè Yorùbá tó rọrùn.
theological_decisions:
- issue: Bí a ṣe máa sọ pé Jésù mọ agbára tó jáde
  choice: mo mọ̀ pé agbára jáde lára mi
  alternative: mo mọ̀lára pé agbára jáde lára mi
  rationale: Orísun náà lo ἔγνων (‘mo mọ̀’), kì í ṣe ọ̀rọ̀ tó túmọ̀ ní pàtó sí ìmọ̀lára; nítorí náà a kò fi ìtumọ̀ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn; ó jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
