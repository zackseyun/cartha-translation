source:
  edition: SBLGNT
  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: yo
  text: Irúgbìn mìíràn sì ṣubú sórí àpáta[a]; nígbà tí ó hù, ó gbẹ nítorí kò ní ọ̀rinrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘lórí àpáta náà.’ Ọ̀rọ̀ Gíríìkì náà lo ‘àpáta’ ní ẹyọ kan, ó sì pa àwòrán irúgbìn tí ó ṣubú sórí àpáta mọ́, dípò gbólóhùn gbòòrò bí ‘ilẹ̀ olókùúta.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Òmíràn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹyọ kan ni ó ń tọ́ka sí irúgbìn mìíràn nínú ìtẹ̀lé àkàwé náà; “òmíràn” jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: κατέπεσεν
  choice: bọ́
  rationale: Ó ṣàpèjúwe bí irúgbìn náà ṣe jábọ́; “bọ́” ṣe kedere, kò sì fi ìtumọ̀ àfikún kún un.
- source_word: ἐπὶ τὴν πέτραν
  choice: sórí àpáta
  rationale: Ó pa ẹyọ ọ̀rọ̀ πέτρα, ‘àpáta,’ mọ́, dípò yíyí i sí gbólóhùn gbòòrò bí ‘ilẹ̀ olókùúta.’
- source_word: φυὲν
  choice: nígbà tí ó sì rú jáde
  rationale: Ẹ̀ka-ìṣe aorist yìí tọ́ka sí ìrújáde irúgbìn ṣáájú gbígbẹ rẹ̀; gbólóhùn yìí jẹ́ èdè iṣẹ́-àgbẹ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἐξηράνθη
  choice: ó gbẹ
  rationale: Nínú àyíká ewéko, ọ̀rọ̀ náà túmọ̀ sí pé ohun tí ó rú jáde gbẹ; ìtumọ̀ yìí rọrùn, ó sì bójú mu.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: nítorí kò ní
  rationale: διά pẹ̀lú infinitive tí ó ní article ń sọ ìdí; “nítorí kò ní” pa ìbáṣepọ̀ ìdí náà mọ́ ní Yorùbá àdánidá.
- source_word: ἰκμάδα
  choice: ọ̀rinrin
  rationale: ἰκμάς ni ọrinrin tí ohun ọ̀gbìn nílò; “ọ̀rinrin” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì dín ìtumọ̀ náà sí omi inú igi.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘rú jáde’ fún bí irúgbìn ṣe hù, àti ‘ọ̀rinrin’ fún ọrinrin tí ewéko nílò.
