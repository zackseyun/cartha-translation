id: LUK.8.35
reference: Luke 8:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: yo
  text: Nígbà náà ni wọ́n jáde lọ láti wo ohun tí ó ṣẹlẹ̀; wọ́n sì wá sọ́dọ̀ Jesu. Wọ́n rí ọkùnrin náà tí àwọn ẹ̀mí èṣù ti jáde lára rẹ̀[a]; ó jókòó lẹ́bàá ẹsẹ̀ Jesu, ó wọ aṣọ, ó sì wà ní ìmọ̀lára rẹ̀ dáadáa[b]. Ẹ̀rù sì bà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní ọ̀rọ̀-ìṣe ọ̀pọ̀ (“àwọn ẹ̀mí èṣù jáde”); ẹ̀dà tí a tẹ̀ jáde ní ọ̀rọ̀-ìṣe ẹyọ kan pẹ̀lú olùṣe ọ̀pọ̀. Ìyàtọ̀ yìí kò yí ìtumọ̀ gbólóhùn náà padà, kò sì fara hàn nínú èdè Yorùbá.
    reason: textual_variant
  - marker: b
    text: Tàbí, “ó sì ń ronú lọ́nà tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wọ́n jáde lọ
  rationale: Ó sọ ìṣípò wọn láti ibi tí wọ́n wà lọ síbi ìṣẹ̀lẹ̀ náà ní Yorùbá àdánidá.
- source_word: τὸ γεγονός
  choice: ohun tí ó ṣẹlẹ̀
  rationale: 'Ó mú ìtumọ̀ participle perfect tí a lò gẹ́gẹ́ bí orúkọ jáde: ohun tí ó ti ṣẹlẹ̀.'
- source_word: εὗρον
  choice: wọ́n rí
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé jù lọ láti sọ pé wọ́n dé, wọ́n sì bá ọkùnrin náà ní ipò yìí.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: tí àwọn ẹ̀mí èṣù ti jáde lára rẹ̀
  rationale: “Lára rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún ìjáde àwọn ẹ̀mí kúrò nínú ẹni náà; “ti” fi hàn pé ó ti ṣẹlẹ̀ ṣáájú ìgbà tí wọ́n rí i.
- source_word: δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Ó pa ìtumọ̀ àwọn ẹ̀dá ẹ̀mí búburú tí ìtàn náà gbé kalẹ̀ mọ́, láì sọ ọ́ di àìsàn tàbí àpẹẹrẹ lásán.
- source_word: ἱματισμένον
  choice: ó wọ aṣọ
  rationale: Gbólóhùn yìí ṣe kedere, ó sì fi ìyàtọ̀ sí ìhòòhò ọkùnrin náà tẹ́lẹ̀ hàn.
- source_word: σωφρονοῦντα
  choice: ọpọlọ rẹ̀ sì péye
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìmúpadàbọ̀sípò ìrònú tó tọ́ àti ìkóra-ẹni-níjàánu hàn láìlo èdè ìṣègùn òde òní.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: lẹ́bàá ẹsẹ̀ Jesu
  rationale: Ó fi ipò ọkùnrin náà nítòsí ẹsẹ̀ Jesu hàn, ó sì yẹra fún fífi ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn kún un ní tààràtà.
- source_word: ἐφοβήθησαν
  choice: Ẹ̀rù sì bà wọ́n
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti pàtó fún ìbẹ̀rù tí ọ̀rọ̀ Gíríìkì náà sọ.
theological_decisions:
- issue: Ìtumọ̀ δαιμόνια nínú ìtàn ìlépa ẹ̀mí èṣù jáde
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí búburú
  rationale: Yíyan “ẹ̀mí èṣù” pa ìwà ẹ̀dá ẹ̀mí àti agbára ìtàn náà mọ́, láì dín un kù sí àìsàn tàbí àpẹẹrẹ.
- issue: Ìtumọ̀ σωφρονοῦντα lẹ́yìn tí àwọn ẹ̀mí èṣù jáde
  choice: ọpọlọ rẹ̀ sì péye
  alternative: ó sì ń ronú lọ́nà tí ó tọ́
  rationale: Èyí sọ ìpadàbọ̀ sí ìyè ọpọlọ tó yè kooro àti ìkóra-ẹni-níjàánu, láìfi àyẹ̀wò ìṣègùn tuntun wọ inú ọ̀rọ̀ náà.
- issue: Ìjókòó lẹ́bàá ẹsẹ̀ Jesu
  choice: lẹ́bàá ẹsẹ̀ Jesu
  alternative: ní ẹsẹ̀ Jesu
  rationale: Ó ṣàfihàn ipò ara tí παρά pẹ̀lú accusative ń tọ́ka sí; ó sì jẹ́ kí ìtumọ̀ ìtẹríba tàbí jíjẹ́ ọmọ-ẹ̀yìn wà gẹ́gẹ́ bí ohun tí a lè rí nínú àyíká ọ̀rọ̀, kì í ṣe ohun tí ìtumọ̀ fi kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pín gbolohun Gíríìkì gígùn náà sí méjì fún kíkà tó ṣe kedere, ṣùgbọ́n a pa tẹ̀lé-tẹ̀lé ìtàn àti gbogbo àwọn àpèjúwe ọkùnrin náà mọ́.
