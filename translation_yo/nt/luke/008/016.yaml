  to: Kò sí ẹni tí ó tan fìtílà tán, tí yóò fi ohun èlò bò ó tàbí tí yóò gbé e sí abẹ́ ibùsùn; dípò bẹ́ẹ̀, ó máa ń gbé e sí orí ìdúró fìtílà, kí àwọn tí ń wọlé lè rí ìmọ́lẹ̀ náà.
