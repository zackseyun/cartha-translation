id: LUK.8.16
reference: Luke 8:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: yo
  text: Kò sí ẹni tí ó tan fìtílà tán, tí yóò fi ohun èlò bò ó tàbí tí yóò gbé e sí abẹ́ ibùsùn; dípò bẹ́ẹ̀, ó máa ń gbé e sí orí ìdúró fìtílà, kí àwọn tí ń wọlé lè rí ìmọ́lẹ̀ náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: fìtílà
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun èlò ìmọ́lẹ̀ kékeré tí a ń tàn; ó bá àwòrán inú ọ̀rọ̀ Gíríìkì mu láì fi irú epo tàbí ẹ̀rọ kan kún un.
- source_word: σκεύει
  choice: ohun èlò
  rationale: σκεῦος ní ìtumọ̀ gbòòrò sí ohun èlò tàbí àpò; ‘ohun èlò’ pa ìtumọ̀ gbòòrò náà mọ́ láì pinnu pé abọ́, ìkòkò, tàbí àpò pàtó ni.
- source_word: κλίνης
  choice: ibùsùn
  rationale: ‘Ibùsùn’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ohun tí a dùbúlẹ̀ sórí, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: λυχνίας
  choice: ìdúró fìtílà
  rationale: Ó túmọ̀ sí ibi tí a gbé fìtílà lé láti jẹ́ kí ìmọ́lẹ̀ rẹ̀ tàn; yíyan yìí yà á sọ́tọ̀ kúrò nínú fìtílà fúnra rẹ̀.
- source_word: οἱ εἰσπορευόμενοι
  choice: àwọn tí ń wọlé
  rationale: Àkópọ̀ ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹni tí wọ́n ń wọ inú ilé tàbí ibi náà; ‘àwọn tí ń wọlé’ jẹ́ àdánidá, ó sì pa ìṣe tó ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ δέ pẹ̀lú ọ̀rọ̀ tó ṣáájú
  choice: A kò fi ọ̀rọ̀ bí ‘nísinsìnyí’ sí ìbẹ̀rẹ̀.
  alternative: ‘Ṣùgbọ́n’ tàbí ‘Ǹjẹ́’ ní ìbẹ̀rẹ̀.
  rationale: δέ jẹ́ àmì ìsopọ̀ ọ̀rọ̀ tó rọ̀ níbí, kì í ṣe ọ̀rọ̀ tó túmọ̀ sí ‘nísinsìnyí’; Yorùbá àdánidá lè fi ìsopọ̀ náà hàn láì túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀.
- issue: Agbára gbólóhùn ἵνα
  choice: ‘kí ... lè rí’
  alternative: ‘nítorí pé ... yóò rí’
  rationale: 'ἵνα ń fi ète hàn: a gbé fìtílà sí ibi gíga kí àwọn tó wọlé lè rí ìmọ́lẹ̀. Yíyan náà kò fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún àpẹẹrẹ náà.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò ‘Kò sí ẹni tí ... tí yóò ...’ jẹ́ ọ̀nà Yorùbá tó ṣàn dáadáa fún gbólóhùn òfin gbogbogbò. ‘Dípò bẹ́ẹ̀’ mú ìyàtọ̀ ἀλλά jáde ní kedere. Kò sí àlàyé ẹ̀sìn tàbí àfikún tí kò sí nínú orísun.
