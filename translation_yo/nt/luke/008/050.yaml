  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Jésù gbọ́ èyí, ó dá a lóhùn pé, “Má bẹ̀rù; kàn gbàgbọ́[a], a ó sì gba ọmọbìnrin náà là[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kàn ní ìgbàgbọ́” tàbí “kàn gbẹ́kẹ̀ lé e.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọmọbìnrin náà yóò sàn” tàbí “ọmọbìnrin náà yóò bọ́ sípò.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí láti gbà là, láti dá nídè, tàbí láti mú ẹni sàn; ní àyíká yìí, ó ní í ṣe pẹ̀lú mímú un bọ́ kúrò ní etí ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ... gbọ́ èyí
  rationale: Ọ̀rọ̀ yìí fi hàn pé gbígbọ́ náà ṣáájú ìdáhùn Jésù; “èyí” mú ohun tí ó gbọ́ láti inú àyíká ọ̀rọ̀ náà ṣe kedere láìṣàlàyé rẹ̀ jù.
- source_word: ἀπεκρίθη αὐτῷ
  choice: ó dá a lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún dídá ẹnì kan lóhùn.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Ó jẹ́ àṣẹ ìdènà tó ṣe kedere, tó sì bá èdè Yorùbá òde òní mu.
- source_word: μόνον πίστευσον
  choice: kàn gbàgbọ́
  rationale: “Kàn” pa àṣẹ náà mọ́ sí ohun kan ṣoṣo, “gbàgbọ́” sì jẹ́ ìtumọ̀ tààrà fún πιστεύω, bó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ fífi ìgbẹ́kẹ̀lé sí ẹni kan.
- source_word: σωθήσεται
  choice: a ó gba ọmọbìnrin náà là
  rationale: Ìṣe aláìlórúkọ ọjọ́ iwájú náà di gbólóhùn Yorùbá àdánidá; “gbà ... là” pa ìtumọ̀ gbígbàlà tàbí ìdáǹdè mọ́, nígbà tí àyíká ọ̀rọ̀ náà tún jẹ́ ti ìmúláradá àti pípadà sí ìyè.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω nínú àṣẹ Jésù
  choice: gbàgbọ́
  alternative: ní ìgbàgbọ́; gbẹ́kẹ̀ lé e
  rationale: “Gbàgbọ́” ni ìbámu tààrà pẹ̀lú ọ̀rọ̀ ìṣe Gíríìkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ìgbẹ́kẹ̀lé mọ́ kí a má bà á dín kù sí fífi ohun kan sí ọkàn nìkan.
- issue: Ìtumọ̀ σωθήσεται nínú àyíká àìsàn àti ikú
  choice: a ó gba ọmọbìnrin náà là
  alternative: ara rẹ̀ yóò dá; yóò bọ́ sípò
  rationale: Èyí pa ìsopọ̀ pẹ̀lú ìtumọ̀ gbígbàlà tàbí ìdáǹdè mọ́, láìfi ìtumọ̀ ìmúláradá tí àyíká ọ̀rọ̀ náà ní sílẹ̀; àwọn ìtumọ̀ tóóró síi wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ọmọbìnrin náà” láti mú akọ abo tó wà nínú σωθήσεται ṣe kedere nínú Yorùbá.
