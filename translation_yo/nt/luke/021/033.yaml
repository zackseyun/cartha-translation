  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: yo
  text: Ọ̀run àti ayé yóò kọjá lọ, ṣùgbọ́n àwọn ọ̀rọ̀ mi kì yóò kọjá lọ rárá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Àwọn ọ̀rọ̀ mi kò ní kọjá lọ láéláé.” Èdè Gíríìkì lo ìkọ̀ tó lágbára (οὐ μὴ).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Ọ̀run
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ ‘ọ̀run àti ayé,’ ọ̀run ń tọ́ka sí apá tí ó wà lókè nínú gbogbo ìṣẹ̀dá, kì í ṣe ojú ọ̀run tí a ń rí nìkan.
- source_word: ἡ γῆ
  choice: ayé
  rationale: Ní ìbámu pẹ̀lú ‘ọ̀run,’ γῆ túmọ̀ sí ayé gẹ́gẹ́ bí apá ìṣẹ̀dá gbogbo, kì í ṣe ilẹ̀ agbègbè kan.
- source_word: παρελεύσονται
  choice: yóò kọjá lọ / kò ní kọjá lọ
  rationale: ‘Kọjá lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun kan yóò dópin tàbí kó má sí mọ́; pípa ọ̀rọ̀-ìṣe náà mọ́ ní ìgbà méjèèjì tún pa ìfarawé inú gbólóhùn Gíríìkì mọ́.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín bí ọ̀run àti ayé ṣe lè kọjá lọ àti bí àwọn ọ̀rọ̀ Jesu kò ṣe lè kọjá lọ.
- source_word: οἱ λόγοι μου
  choice: àwọn ọ̀rọ̀ mi
  rationale: Ọ̀pọ̀ λόγοι ń tọ́ka sí àwọn ọ̀rọ̀ tí Jesu sọ; ‘àwọn ọ̀rọ̀ mi’ pa ọ̀pọ̀-orúkọ àti ìtumọ̀ tààrà náà mọ́.
- source_word: οὐ μὴ
  choice: kò ní … láéláé
  rationale: Àpapọ̀ ìkọ̀ Gíríìkì yìí lágbára gan-an. ‘Kò ní … láéláé’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkọ̀ tó dájú, tó sì lágbára hàn.
theological_decisions:
- issue: Agbára ìjẹ́rìí Jesu nípa bí àwọn ọ̀rọ̀ rẹ̀ ṣe dúró laelae
  choice: àwọn ọ̀rọ̀ mi kò ní kọjá lọ láéláé
  alternative: àwọn ọ̀rọ̀ mi dájúdájú kò ní kọjá lọ
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìkọ̀ οὐ μὴ tó lágbára mọ́ ní Yorùbá àdánidá, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò. ‘Yóò’ fi ọjọ́ iwájú hàn, ‘kò ní … láéláé’ sì mú ìkọ̀ tó lágbára jáde ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
