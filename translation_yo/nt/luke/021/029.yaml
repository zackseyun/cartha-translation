translation:
  language: yo
  text: Ó sì pa òwe kan fún wọn pé, “Ẹ wo igi ọ̀pọ̀tọ́ àti gbogbo àwọn igi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Ó sì
  rationale: Ó ń tẹ̀ síwájú nínú ìtàn náà lọ́nà àdánidá, láìfi ìtumọ̀ àkókò míì kún un.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: pa òwe kan fún wọn
  rationale: ‘Pa òwe’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan sọ àpẹẹrẹ olùkọ́ni; ‘fún wọn’ sì dúró fún αὐτοῖς.
- source_word: Ἴδετε
  choice: Ẹ wo
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni, ó sì ń pe àwọn olùgbọ́ láti darí àfiyèsí wọn sí ohun tí a mẹ́nu kàn.
- source_word: τὴν συκῆν
  choice: igi ọ̀pọ̀tọ́
  rationale: Ó tọ́ka sí igi náà, kì í ṣe èso rẹ̀ nìkan.
- source_word: πάντα τὰ δένδρα
  choice: gbogbo àwọn igi yòókù
  rationale: Ní Yorùbá, ‘yòókù’ mú kí ìṣọ̀kan ‘igi ọ̀pọ̀tọ́ àti gbogbo igi’ ṣe kedere; síbẹ̀, ọ̀rọ̀ náà kò hàn ní tààràtà nínú Gíríìkì, nítorí náà a tọ́ka sí àṣàyàn gígúnná jù lọ nínú àlàyé ìsàlẹ̀.
