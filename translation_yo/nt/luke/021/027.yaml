id: LUK.21.27
reference: Luke 21:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: yo
  text: Nígbà náà ni wọn yóò rí Ọmọ Ènìyàn tí ń bọ̀ nínú ìkùukùu pẹ̀lú agbára àti ògo ńlá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí ìkùukùu.” Nínú èdè Gíríìkì, ọ̀rọ̀ náà wà ní ẹyọ, ó sì sọ pé “nínú ìkùukùu”; ṣùgbọ́n àwòrán náà rántí Dáníẹ́lì 7 àti àwọn ẹsẹ tó jọ ọ́ nípa Ọmọ Ènìyàn tí ń bọ̀ pẹ̀lú àwọn ìkùukùu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: wọn yóò rí
  rationale: Ọ̀rọ̀ yìí sọ ní tààrà nípa ohun tí wọn yóò fi ojú rí lọ́jọ́ iwájú; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ àkọlé náà tí a mọ̀ sí ní Yorùbá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ àwòrán inú Dáníẹ́lì 7.
- source_word: ἐρχόμενον
  choice: tí ń bọ̀
  rationale: Ó pa ìṣe tí ó ń lọ mọ́ gẹ́gẹ́ bí participle Gíríìkì náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐν νεφέλῃ
  choice: nínú ìkùukùu
  rationale: Gíríìkì lo ẹyọ kan, ó sì sọ ní ti gidi pé ‘nínú ìkùukùu’; a kò yí i padà sí ọ̀pọ̀ tàbí mú un bá àwọn ẹsẹ mìíràn mu.
- source_word: μετὰ δυνάμεως
  choice: pẹ̀lú agbára
  rationale: μετά pẹ̀lú genitive tọ́ka sí ohun tó bá a rìn; ‘pẹ̀lú agbára’ ṣe kedere, ó sì jẹ́ Yorùbá tó wọ́pọ̀.
- source_word: δόξης πολλῆς
  choice: ògo ńlá
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún ọ̀rọ̀ tí ó túmọ̀ sí ògo púpọ̀ tàbí ògo ńlá, ó sì pa ìgbéga ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ àkọlé Kristẹni τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa àkọlé tí Jésù ń lò àti ìtọ́kasí rẹ̀ sí Dáníẹ́lì 7 mọ́ láì dín ìtumọ̀ rẹ̀ kù.
- issue: Àwòrán ìkùukùu àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì/ìfarahàn Ọlọ́run
  choice: nínú ìkùukùu
  alternative: lórí ìkùukùu
  rationale: A tẹ̀ lé ọ̀rọ̀ Lúùkù, tí ó jẹ́ ẹyọ kan, dípò kí a mú un bá àwọn ibi mìíràn tàbí ọ̀rọ̀ àṣà mu; ìtumọ̀ náà ṣì jẹ́ kí ìtọ́kasí sí Dáníẹ́lì hàn.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìrísí ọ̀rọ̀ àsọtẹ́lẹ̀ náà mọ́ láì fi èrò ẹ̀kọ́ ìjọ kan kún un.
