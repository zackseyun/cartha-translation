  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìpìlẹ̀ Gíríìkì dáadáa nípa àwọn àmì ojú ọ̀run, ìpọ́njú àwọn orílẹ̀-èdè, àti ariwo òkun. Ṣùgbọ́n ‘wọn yóò sì dààmú’ jẹ́ ìsọ̀rọ̀ méjì tí kò pa ìtumọ̀ ἐν ἀπορίᾳ (‘nínú ìdàrúdàpọ̀/ní àìrí ọ̀nà’) mọ́ pẹ̀lú ìdúróṣinṣin tó. ‘Ìgbì líle’ tún tú σάλου sí ‘waves’ ní pàtó ju ọ̀rọ̀ náà, tí ó túmọ̀ sí ríru/síṣàn omi, lọ.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. Àtúnṣe kékeré náà mú ìbáṣepọ̀ ‘ìpọ́njú ... nínú ìdàrúdàpọ̀’ hàn kedere, ó sì yàgò fún ìtúmọ̀ tí ó lè túmọ̀ sí ìbànújẹ́ lásán.
  terminology: ‘Àwọn àmì,’ ‘oòrùn,’ ‘òṣùpá,’ ‘ìràwọ̀,’ ‘ìpọ́njú,’ àti ‘orílẹ̀-èdè’ yẹ. ‘Ìdàrúdàpọ̀’ dára fún ἀπορίᾳ nínú àyíká yìí; ‘ríru rẹ̀’ sì sún mọ́ σάλου ju ‘ìgbì líle rẹ̀’ lọ.
