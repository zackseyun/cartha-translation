id: LUK.21.25
reference: Luke 21:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: yo
  text: Àwọn àmì yóò sì wà ní oòrùn, òṣùpá àti àwọn ìràwọ̀;[a] lórí ilẹ̀ ayé, àwọn orílẹ̀-èdè yóò wà nínú ìpọ́njú àti ìdàrúdàpọ̀ nítorí ariwo òkun àti rírú rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú oòrùn àti òṣùpá àti àwọn ìràwọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ tààrà, “ní ariwo òkun àti rírú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì gbòòrò tó láti tọ́ka sí àwọn ìṣẹ̀lẹ̀ àrà ọ̀tọ̀ láì fi dandan túmọ̀ wọn sí àmì ibi.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: ní oòrùn, òṣùpá àti àwọn ìràwọ̀
  rationale: Èyí pa ìbáṣepọ̀ ἐν mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn àmì náà yóò fara hàn nínú àwọn ohun ojú ọ̀run wọ̀nyí.
- source_word: συνοχὴ ἐθνῶν
  choice: ìpọ́njú yóò bá àwọn orílẹ̀-èdè
  rationale: ‘Ìpọ́njú’ fi ipò wàhálà tó ń tẹni mọ́lẹ̀ hàn; gbólóhùn ọlọ́rọ̀-ìṣe yìí sì jẹ́ àdánidá ju gbólóhùn oníjẹ́ńítífù lọ ní Yorùbá.
- source_word: ἐν ἀπορίᾳ
  choice: wọn yóò sì dààmú
  rationale: Nínú àyíká yìí, ó ń sọ ipò àwọn ènìyàn tí kò mọ ohun tí wọn yóò ṣe tàbí ọ̀nà àbáyọ; ‘dààmú’ mú ìdàrúdàpọ̀ àti àìrí ọ̀nà yẹn jáde ní èdè òde òní.
- source_word: ἤχους θαλάσσης
  choice: nítorí ariwo òkun
  rationale: ‘Ariwo’ pa ìtumọ̀ ìró alágbára mọ́, ‘nítorí’ sì mú ìbáṣepọ̀ rẹ̀ pẹ̀lú ìpọ́njú àti ìdààmú hàn ní Yorùbá tó ṣàn.
- source_word: σάλου
  choice: ìgbì líle rẹ̀
  rationale: σάλος ń tọ́ka sí ríru tàbí ìdàrúdàpọ̀ òkun; ‘ìgbì líle’ mú àwòrán náà ṣe kedere láì ṣàlàyé rẹ̀ kọjá ohun tí àyíká sọ.
theological_decisions:
- issue: Irú àwọn àmì ojú ọ̀run
  choice: Ṣe àfihàn wọn ní tààrà gẹ́gẹ́ bí àwọn àmì ní oòrùn, òṣùpá àti àwọn ìràwọ̀.
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí ìṣẹ̀lẹ̀ ojú ọ̀run ní ti ara nìkan tàbí gẹ́gẹ́ bí àpẹẹrẹ ìṣèlú nìkan.
  rationale: Ẹsẹ náà kò pinnu bóyá àwọn àmì náà jẹ́ ti ara, ti àpẹẹrẹ, tàbí méjèèjì; ìtumọ̀ náà fi àìdánilójú yìí sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tó bá yẹ; a sì yà àwọn gbólóhùn náà pẹ̀lú àmì ìdádúró láti mú ìṣàn ọ̀rọ̀ kedere.
