  to: Àwọn àmì yóò sì wà ní oòrùn, òṣùpá àti àwọn ìràwọ̀;[a] lórí ilẹ̀ ayé, àwọn orílẹ̀-èdè yóò wà nínú ìpọ́njú àti ìdàrúdàpọ̀ nítorí ariwo òkun àti rírú rẹ̀.[b]
  rationale: Àtúnṣe náà pa ìtumọ̀ ἐν ἀπορίᾳ mọ́ gẹ́gẹ́ bí ipò ìdàrúdàpọ̀/àìrí ọ̀nà, ó sì tú σάλου ní ọ̀nà tí kò fi ‘ìgbì’ kún un ní pàtó. A fi ìbáṣepọ̀ ìdí tí English POB ti yàn silẹ̀ nípa lílo ‘nítorí,’ láì pinnu ìtumọ̀ àpẹẹrẹ tàbí ti ara fún àwọn àmì ojú ọ̀run.
