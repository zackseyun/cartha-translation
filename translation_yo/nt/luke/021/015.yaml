source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: yo
  text: Nítorí èmi yóò fún yín ní ọ̀rọ̀ àti ọgbọ́n tí gbogbo àwọn tí ó tako yín kò ní lè koju tàbí tako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: ọ̀rọ̀
  rationale: Nípa ìtumọ̀, ‘ẹnu’ dúró fún ohun tí àwọn ọmọ-ẹ̀yìn yóò sọ; ‘ọ̀rọ̀’ jẹ́ èdè Yorùbá àdánidá, ó sì bá àyíká ẹsẹ̀ 14 mu.
- source_word: σοφίαν
  choice: ọgbọ́n
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún σοφία ní àyíká yìí.
- source_word: ἀντικείμενοι
  choice: àwọn tí ó ń ta kò yín
  rationale: Ó ṣàfihàn àwọn alátakò láìfi ìtumọ̀ ẹ̀sìn àfikún sí i.
- source_word: ἀντιστῆναι ἢ ἀντειπεῖν
  choice: dúró lòdì sí tàbí sọ̀rọ̀ lòdì sí
  rationale: Ó pa ìyàtọ̀ tó wà láàárín kíkọjú-ìjà sí àti fífi ọ̀rọ̀ tako mọ́.
theological_decisions:
- issue: Ẹni tó ń fúnni ní ọ̀rọ̀ àti ọgbọ́n
  choice: èmi yóò fún yín
  alternative: a ó fún yín
  rationale: A pa àfiyèsí ẹni àkọ́kọ́ ἐγώ mọ́, nítorí Jésù fúnra rẹ̀ ni ó ń sọ ìlérí náà.
- issue: Ìbáṣepọ̀ gbolohun ᾗ
  choice: tí ... kò ní lè
  alternative: èyí tí ... kò ní lè
  rationale: Ọ̀rọ̀ arọ́pò ᾗ lè tọ́ka sí ọgbọ́n ní pàtó tàbí sí ‘ọ̀rọ̀ àti ọgbọ́n’ gẹ́gẹ́ bí odindi; àyípadà Yorùbá yìí jẹ́ kí ìtumọ̀ náà má ṣe há sí ọgbọ́n nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní.
