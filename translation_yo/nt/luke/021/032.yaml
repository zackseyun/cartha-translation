id: LUK.21.32
reference: Luke 21:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: yo
  text: Lóòótọ́ ni mo wí fún yín pé, ìran yìí[a] kì yóò kọjá lọ rárá títí gbogbo nǹkan yóò fi ṣẹlẹ̀.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘àwọn ènìyàn yìí’ tàbí ‘àkókò ayé yìí.’ Ọ̀rọ̀ Gíríìkì náà lè ní ju òye kan lọ, ṣùgbọ́n ‘ìran’ ni ìtumọ̀ tààrà jù lọ.
    reason: alternative_reading
  - marker: b
    text: Àwọn ìtumọ̀ kan ní ‘gbogbo nǹkan wọ̀nyí,’ ní fífi ‘wọ̀nyí’ kún un láti inú àyíká ọ̀rọ̀; Gíríìkì níbí sọ pé ‘gbogbo nǹkan’ nìkan.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé ‘yóò ṣẹ’ tàbí ‘yóò wáyé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ àṣẹ àti ìdánilójú tí ἀμήν ní jáde ní Yorùbá àdánidá, láì fi dandan lo àfọwọ́kọ ‘Àmín’.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín pé
  rationale: Ìtumọ̀ yìí sún mọ́ èdè Gíríìkì, ó sì jẹ́ ọ̀nà ọ̀rọ̀ tó bójú mu ní Yorùbá ọlọ́lá.
- source_word: οὐ μὴ παρέλθῃ
  choice: kì yóò kọjá lọ rárá
  rationale: ‘Rárá’ pa mọ́ ìkọ̀ emphatic ti οὐ μή pẹ̀lú subjunctive, láì túmọ̀ ọ́ sí ‘láéláé,’ èyí tí ó lè kọjá ohun tí ọ̀rọ̀ náà sọ.
- source_word: ἡ γενεὰ αὕτη
  choice: ìran yìí
  rationale: ‘Ìran’ ni ìtumọ̀ tààrà jù lọ fún γενεά níbí; àlàyé ìsàlẹ̀ pa àwọn òye mìíràn mọ́ láì yanjú àríyànjiyàn náà nínú ọ̀rọ̀ pàtàkì.
- source_word: ἕως ἂν
  choice: títí ... yóò fi
  rationale: Ẹ̀rọ gírámà Yorùbá yìí fi ààlà àkókò tí ἕως ἄν ń tọ́ka sí hàn lọ́nà àdánidá.
- source_word: πάντα
  choice: gbogbo nǹkan
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì, tí kò ní ọ̀rọ̀ tó túmọ̀ sí ‘wọ̀nyí,’ bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè fi irú ìtọ́kasí bẹ́ẹ̀ hàn.
- source_word: γένηται
  choice: ṣẹlẹ̀
  rationale: Ó sọ ìṣẹ̀lẹ̀ tàbí wíwá-ní-àṣẹ̀ jáde láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára bí ‘mú ṣẹ’ kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘ìran yìí’ nínú ọ̀rọ̀ nípa ohun ìkẹyìn
  choice: ìran yìí
  alternative: àwọn ènìyàn yìí; àkókò ayé yìí
  rationale: A pa ìtumọ̀ ọ̀rọ̀ tó sún mọ́ Gíríìkì jù lọ mọ́, láì pinnu bóyá ó ń tọ́ka sí àwọn ènìyàn ọjọ́ Jésù, ìran tí yóò rí àwọn àmì náà, tàbí ẹgbẹ́ ènìyàn kan.
- issue: Ohun tí ‘gbogbo nǹkan’ ń tọ́ka sí
  choice: gbogbo nǹkan
  alternative: gbogbo nǹkan wọ̀nyí
  rationale: πάντα nìkan ni ẹsẹ náà ní; a kò fi ‘wọ̀nyí’ kún un, bí àyíká ọ̀rọ̀ tilẹ̀ lè tọ́ka sí àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì yé òǹkàwé òde òní ni a lò. ‘Lóòótọ́ ni mo wí fún yín pé’ pa ìdúróṣinṣin ọ̀rọ̀ Jésù mọ́; ‘kì yóò ... rárá’ fi ìkọ̀ líle hàn. Àwọn àmì ìsàlẹ̀ [a], [b], àti [c] wà nínú ọ̀rọ̀ pàtàkì.
