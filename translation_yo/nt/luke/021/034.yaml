id: LUK.21.34
reference: Luke 21:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa ṣọ́ra fún ara yín, kí ọkàn yín má bàa wúwo nítorí ìwà wọ̀bìà[a], ìmutípara, àti àwọn àníyàn ìgbésí ayé, kí ọjọ́ náà má sì bàa dé bá yín lójijì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìjẹkùjẹ tàbí àṣejù nínú mímu ọtí, tàbí ìrora àti àìsàn, bí orí fífọ́, tí ó lè tẹ̀ lé ìmutípara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε … ἑαυτοῖς
  choice: ẹ máa ṣọ́ ara yín
  rationale: Ó mú àṣẹ fún ìṣọ́ra tí ó ń bá a lọ jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé kí àwọn olùgbọ́ ṣọ́ ara wọn mọ́.
- source_word: μήποτε
  choice: kí … má bàa
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkìlọ̀ ìdènà hàn.
- source_word: βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: kí ọkàn yín má bàa di wíwúwo
  rationale: Ó pa àwòrán ọkàn tí ó di wíwúwo mọ́, láì dín 'ọkàn' kù sí ìmọ̀lára nìkan.
- source_word: κραιπάλῃ
  choice: ìwà wọ̀bìà
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àṣejù inú ọtí mímu tàbí àbájáde rẹ̀. 'Ìwà wọ̀bìà' fi àṣejù aláìníjàánu hàn, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ọtí mọ́.
- source_word: μέθῃ
  choice: ìmutípara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ipò ọ̀mùtí.
- source_word: μερίμναις βιωτικαῖς
  choice: àníyàn ìgbésí ayé
  rationale: Ó sọ àwọn ìdààmú àti ìṣòro tí ó jẹ mọ́ ìgbésí ayé ojoojúmọ́ ní kúkúrú àti ní èdè àdánidá.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: dé bá yín lójijì
  rationale: Ó fi dídé tí kò fúnni ní àkókò ìmúrasílẹ̀ hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ọjọ́ náà
  rationale: Ó pa ọ̀rọ̀ orísun náà mọ́ láì fi 'ọjọ́ ìdájọ́' kún un.
theological_decisions:
- issue: Ìtọ́kasí ọjọ́ ìkẹyìn nínú ‘ọjọ́ náà’
  choice: ọjọ́ náà
  alternative: ọjọ́ ìdájọ́ náà
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ọjọ́ pàtàkì ní òpin ni a ń tọ́ka sí, ṣùgbọ́n a kò fi àkọlé ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ ní tààrà kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, bí Gíríìkì ṣe rí. A pa àwòrán ‘ọkàn tí ó di wíwúwo’ àti àìsọ pàtó ‘ọjọ́ náà’ mọ́.
