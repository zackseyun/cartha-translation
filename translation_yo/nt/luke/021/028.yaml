id: LUK.21.28
reference: Luke 21:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn nǹkan wọ̀nyí bá bẹ̀rẹ̀ sí í ṣẹlẹ̀[a], ẹ na ara yín sókè, kí ẹ sì gbé orí yín sókè[b], nítorí ìràpadà yín[c] ń súnmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí àwọn nǹkan wọ̀nyí ti ń bẹ̀rẹ̀ sí í ṣẹlẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ wo òkè, kí ẹ sì gbé orí yín sókè.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ “ìràpadà” sí “ìdáǹdè”; níbí, ó ń tọ́ka sí ìdáǹdè ìkẹyìn tó ń súnmọ́ fún àwọn ọmọ-ẹ̀yìn Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: nígbà tí àwọn nǹkan wọ̀nyí bá bẹ̀rẹ̀ sí í ṣẹlẹ̀
  rationale: Ó fi gbólóhùn àkókò Gíríìkì hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘bẹ̀rẹ̀’ àti ‘ṣẹlẹ̀’ mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà oníwọ̀nba láti inú ìpọ́njú tí a ṣẹ̀ṣẹ̀ sọ sí ọ̀rọ̀ ìgboyà hàn.
- source_word: ἀνακύψατε
  choice: ẹ gbé ara yín ró
  rationale: Ó pa àwòrán ẹni tí ó ń na ara rẹ̀ sókè lẹ́yìn tí ó ti tẹ̀ ba mọ́, ó sì lè sọ nípa ìgboyà láì sọ ìtumọ̀ náà di ẹ̀kọ́ pàtó.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: kí ẹ sì gbé orí yín sókè
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán ìrètí àti ìgboyà inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διότι
  choice: nítorí
  rationale: Ó sọ ìdí tí wọ́n fi gbọ́dọ̀ ní ìgboyà ní kedere.
- source_word: ἐγγίζει
  choice: ń sún mọ́lé
  rationale: Ó fi ìsúnmọ́ tí ń lọ síwájú hàn, dípò kí ó kan sọ pé ohun náà wà nítòsí.
- source_word: ἀπολύτρωσις
  choice: ìràpadà
  rationale: ‘Ìràpadà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìdásílẹ̀ tí Ọlọ́run mú wá, ó sì pa ìjinlẹ̀ ìgbàlà àti ìdáǹdè inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ìràpadà yín’ nínú àsọyé nípa àwọn ohun ìkẹyìn
  choice: A túmọ̀ ọ́ sí ‘ìràpadà yín,’ láì dín in kù sí àsálà kúrò nínú ìṣòro ìtàn kan ṣoṣo.
  alternative: ‘ìdáǹdè yín’ tàbí ‘ìgbàlà yín’
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí ohun ọjọ́ iwájú àti ìmúṣẹ ìkẹyìn. ‘Ìràpadà’ pa ìtumọ̀ gbígbòòrò rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń jẹ́ kí òǹkàwé rí ìtumọ̀ ìdáǹdè rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ títọ́, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. Àwọn àṣẹ ‘ẹ gbé ...’ bá ọ̀pọ̀ ènìyàn mu gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
