  rationale: Àtúnṣe náà rọ́pò ìfarahàn ọjọ́ iwájú pẹ̀lú ìdènà àṣẹ, ó sì lo “ronú tẹ́lẹ̀” láti pa ìtumọ̀ gbooro προμελετᾶν mọ́. Ó tún yọ “rẹ̀” tí kò ní ohun tí ó ń tọ́ka sí kúrò, nígbà tí a pa ọkàn, ìjùmọ̀sọrọ̀, àti ìgbèjà ara ẹni mọ́.
