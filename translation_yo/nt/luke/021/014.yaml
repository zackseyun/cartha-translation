  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: yo
  text: Nítorí náà, ẹ pinnu nínú ọkàn yín pé ẹ má ṣe ronú tẹ́lẹ̀ nípa bí ẹ ó ṣe gbèjà ara yín[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé ẹ má ṣe dán bí ẹ ó ṣe sọ ọ̀rọ̀ ìgbèjà yín wò ṣáájú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: ẹ pinnu rẹ̀
  rationale: Àṣẹ aorist τίθημι nínú àkójọpọ̀ ọ̀rọ̀ ‘nínú ọkàn’ ń tọ́ka sí fífi ìpinnu kan múlẹ̀. ‘Ẹ pinnu rẹ̀’ jẹ́ Yorùbá àdánidá tí ó pa agbára àṣẹ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìtumọ̀ tí a fà jáde láti inú ọ̀rọ̀ tó ṣáájú hàn.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ọ̀rọ̀ Yorùbá máa ń lo ‘ọkàn yín’ fún inú ẹni àti ibi ìpinnu, bí ó tilẹ̀ jẹ́ pé καρδίαις jẹ́ ọ̀pọ̀ nínú Gíríìkì; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ọkàn mọ́.
- source_word: μὴ
  choice: pé ẹ kò ní
  rationale: Ó sẹ́ ìṣe infinitive tí ó sin àṣẹ náà; ìṣọ̀kan ‘ẹ pinnu ... pé ẹ kò ní ...’ jẹ́ kedere àti àdánidá ní Yorùbá.
- source_word: προμελετᾶν
  choice: múra ọ̀rọ̀ ... sílẹ̀ ṣáájú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ríronú, pípèsè, tàbí dídán ọ̀rọ̀ ìgbèjà wò ṣáájú. Ìtumọ̀ yìí mú èrò ìmúrasílẹ̀ tẹ́lẹ̀ jáde láì fi ìtumọ̀ ọ̀daràn kún un.
- source_word: ἀπολογηθῆναι
  choice: ọ̀rọ̀ tí ẹ ó fi gbèjà ara yín
  rationale: Ó ń tọ́ka sí fífúnni ní ìdáhùn ìgbèjà, pàápàá níwájú ilé ẹjọ́ tàbí aláṣẹ; ‘gbèjà ara yín’ pa ìtumọ̀ middle náà mọ́ ní Yorùbá tó rọrùn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀pọ̀ ẹni ‘ẹ/yín’ fún àwọn ọmọ-ẹ̀yìn, a sì pa àwòrán ‘ọkàn’ àti ìtumọ̀ ìgbèjà níwájú aláṣẹ mọ́. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn tí ó ní àwọn ọ̀nà ìtumọ̀ méjì.
