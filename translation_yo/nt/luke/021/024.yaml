id: LUK.21.24
reference: Luke 21:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: yo
  text: Wọ́n yóò sì ṣubú ní ojú idà, a ó sì kó wọn ní ìgbèkùn lọ sí àárín gbogbo àwọn orílẹ̀-èdè[a]. Àwọn orílẹ̀-èdè yóò sì máa tẹ Jerúsálẹ́mù mọ́lẹ̀[b] títí àwọn àkókò àwọn orílẹ̀-èdè yóò fi pé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “sí àárín gbogbo àwọn tí kì í ṣe Júù”; ọ̀rọ̀ Gíríìkì ἔθνη lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn tí kì í ṣe Júù,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí, “àwọn tí kì í ṣe Júù yóò máa tẹ Jerúsálẹ́mù mọ́lẹ̀.”
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ sí, “títí àwọn àkókò àwọn tí kì í ṣe Júù yóò fi pé.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: wọ́n yóò ṣubú
  rationale: Ó pa àwòrán Gíríìkì ‘ṣubú’ mọ́, nígbà tí ọ̀rọ̀ ogun tó tẹ̀ lé e fi hàn pé ṣíṣubú sínú ikú ni a ń sọ.
- source_word: στόματι μαχαίρης
  choice: sí ojú idà
  rationale: ‘Ojú idà’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún eti idà, ó sì pa àwòrán gidi inú àpólà Gíríìkì náà mọ́.
- source_word: αἰχμαλωτισθήσονται
  choice: a ó kó wọn ní ìgbèkùn lọ
  rationale: Ìtumọ̀ yìí fi ipá gbólóhùn aláìlórúkọ hàn, ó sì mú èrò pé a mú wọn kúrò ní ilẹ̀ wọn gẹ́gẹ́ bí ẹlẹ́wọ̀n jáde kedere.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: sí àárín gbogbo àwọn orílẹ̀-èdè
  rationale: ‘Sí àárín’ sọ ìṣípò lọ sáàárín àwọn orílẹ̀-èdè di Yorùbá àdánidá; ‘orílẹ̀-èdè’ sì pa ìtumọ̀ tó gbòòrò ti ἔθνη mọ́.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Àkọtọ̀ orúkọ ibìkan náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: πατουμένη
  choice: yóò máa tẹ ... mọ́lẹ̀
  rationale: Ìṣe tó ń bá a lọ nínú ọ̀rọ̀ Gíríìkì ni ‘yóò máa’ fi hàn, ‘tẹ mọ́lẹ̀’ sì pa àwòrán ìtẹ̀mọ́lẹ̀ àti ìṣàkóso tipátipá mọ́.
- source_word: ὑπὸ ἐθνῶν
  choice: àwọn orílẹ̀-èdè yóò ...
  rationale: A yí gbólóhùn aláìlórúkọ padà sí ìṣe olórúkọ fún Yorùbá tó dùn, láìyí ẹni tó ń ṣe ìṣe náà padà; a tún lo ‘orílẹ̀-èdè’ fún ìṣọ̀kan ọ̀rọ̀.
- source_word: ἄχρι οὗ
  choice: títí ... yóò fi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ààlà àkókò ‘títí di ìgbà tí’.
- source_word: πληρωθῶσιν
  choice: yóò fi pé
  rationale: ‘Pé’ lè túmọ̀ sí pé àkókò náà dé òpin tàbí pé ó dé ẹ̀kún rẹ̀, láìfi ètò ẹ̀kọ́ nípa ìgbà ìkẹyìn kan lé e lórí.
- source_word: καιροὶ ἐθνῶν
  choice: àwọn àkókò àwọn orílẹ̀-èdè
  rationale: Ó pa ìbáṣepọ̀ tí a kò ṣàlàyé nínú àpólà Gíríìkì mọ́, kò sì fi ‘tí a yàn’ kún ọ̀rọ̀ pàtó, bó tilẹ̀ jẹ́ pé καιροί lè tọ́ka sí àwọn àkókò pàtàkì tàbí tí a yàn.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη ní gbogbo ẹsẹ náà
  choice: àwọn orílẹ̀-èdè
  alternative: àwọn tí kì í ṣe Júù
  rationale: Ọ̀rọ̀ Gíríìkì kan náà farahàn lẹ́ẹ̀mẹta. Lílo ‘àwọn orílẹ̀-èdè’ ní gbogbo ibi pa ìṣọ̀kan ọ̀rọ̀ àti àìdánilójú bóyá ìtẹnumọ́ wà lórí àwọn orílẹ̀-èdè tàbí àwọn tí kì í ṣe Júù mọ́; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ καιροὶ ἐθνῶν
  choice: àwọn àkókò àwọn orílẹ̀-èdè yóò pé
  alternative: àwọn àkókò àwọn tí kì í ṣe Júù yóò pé; àwọn àkókò tí a yàn fún àwọn orílẹ̀-èdè yóò parí
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìwúwo ọ̀rọ̀ nípa òpin àkókò àti àìdánilójú ìbáṣepọ̀ genitive mọ́, láìgbé ètò ẹ̀kọ́ ìgbà ìkẹyìn ẹ̀ya kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘A ó kó wọn’ jẹ́ ọ̀nà Yorùbá àdánidá fún passive tí kò dárúkọ ẹni tó ṣe ìṣe; ‘yóò máa tẹ ... mọ́lẹ̀’ fi ìṣe tó ń bá a lọ hàn.
