id: LUK.21.11
reference: Luke 21:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: yo
  text: Àwọn ìmìtìtì ilẹ̀ ńlá yóò sì ṣẹlẹ̀, ìyàn àti àjàkálẹ̀-àrùn yóò sì wà ní onírúurú ibi; àwọn ohun amúnilẹ́rù àti àwọn àmì ńlá láti ọ̀run yóò sì wà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: àwọn ìmìtìtì ilẹ̀ ńlá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn ìmìtìtì ilẹ̀ tí ó lágbára tàbí tí ó le gan-an, ó sì pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́.
- source_word: κατὰ τόπους
  choice: ní onírúurú ibi
  rationale: Gbólóhùn yìí fi hàn pé àwọn ìṣẹ̀lẹ̀ náà yóò tàn ká sí ibi ọ̀tọ̀ọ̀tọ̀, láìfi hàn pé gbogbo ibi ni yóò ṣẹlẹ̀ sí lẹ́ẹ̀kan náà.
- source_word: λιμοὶ
  choice: ìyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àìsí oúnjẹ tó le koko, kì í ṣe àìtó oúnjẹ díẹ̀ lásán.
- source_word: λοιμοὶ
  choice: àjàkálẹ̀-àrùn
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún àrùn tó ń tàn ká láàárín ọ̀pọ̀ ènìyàn.
- source_word: φόβητρα
  choice: àwọn ohun amúnilẹ́rù
  rationale: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí ń tọ́ka sí àwọn ohun tàbí ìṣẹ̀lẹ̀ tí ń mú ẹ̀rù ba ènìyàn; ìtumọ̀ yìí pa àìdánilójú nípa irú wọn mọ́.
- source_word: σημεῖα μεγάλα
  choice: àwọn àmì ńlá
  rationale: “Àmì” ni ìtumọ̀ gbòòrò àti bó ṣe yẹ fún σημεῖον, nígbà tí “ńlá” kò fi àlàyé míì tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἀπ’ οὐρανοῦ
  choice: láti ọ̀run
  rationale: “Ọ̀run” lè tọ́ka sí ojú ọ̀run tí a ń rí tàbí ibùgbé ọ̀run, nítorí náà ó dáàbò bo ìtumọ̀ méjèèjì tí ọ̀rọ̀ Gíríìkì lè ní.
- source_word: ἔσονται / ἔσται
  choice: yóò ṣẹlẹ̀ / yóò wà
  rationale: Lílo ọ̀rọ̀ méjì yìí mú àtòjọ náà dun bí Yorùbá àdánidá, ó sì ṣàfihàn àwọn ohun tí yóò wáyé ní ọjọ́ iwájú.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός nínú ọ̀rọ̀ àsọtẹ́lẹ̀ nípa òpin ayé
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: “Ọ̀run” jẹ́ ọ̀rọ̀ Yorùbá tó lè ní ìtumọ̀ ibi tí Ọlọ́run wà tàbí ojú ọ̀run tí a ń rí. Ó tipa bẹ́ẹ̀ pa ìṣòro àti ìtumọ̀ méjèèjì inú ọ̀rọ̀ Gíríìkì mọ́, láìfipá yan pé àmì náà jẹ́ ti ẹ̀mí nìkan tàbí ìṣẹ̀lẹ̀ ojú ọ̀run nìkan.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ gbolohun náà tẹ̀ lé ìsopọ̀ inú Gíríìkì, ṣùgbọ́n a ṣètò rẹ̀ kí ó lè ṣe kedere fún olùkà Yorùbá. A kò fi ẹ̀kọ́ ìjọ kan pàtó kún ọ̀rọ̀ náà.
