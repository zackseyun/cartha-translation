id: LUK.21.23
reference: Luke 21:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: yo
  text: Ègbé ni fún àwọn tí ó lóyún àti àwọn tí ń fún ọmọ lọ́mú ní àwọn ọjọ́ wọ̀nyẹn! Nítorí ìpọ́njú ńlá yóò wà lórí ilẹ̀ náà[a], ìbínú yóò sì wà lórí àwọn ènìyàn yìí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayé.” Ọ̀rọ̀ Gíríìkì γῆ lè túmọ̀ sí “ilẹ̀” tàbí “ayé”; a yan “ilẹ̀ náà” níhìn-ín nítorí àyíká ọ̀rọ̀ náà dá lórí Jerúsálẹ́mù àti Jùdíà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìbínú yóò wà fún àwọn ènìyàn yìí” tàbí “ìbínú yóò dé bá àwọn ènìyàn yìí.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Ègbé ni fún
  rationale: Ó pa ohùn àsọtẹ́lẹ̀ tí ó ní ẹkún àti ìdájọ́ mọ́, ó sì lágbára ju ọ̀rọ̀ ìbànújẹ́ lásán lọ.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: àwọn tí ó lóyún
  rationale: Èyí ni ọ̀nà Yorùbá adayeba àti kedere láti sọ nípa àwọn aboyún, láì lo gbólóhùn àtijọ́ tàbí èyí tí kò rọrùn.
- source_word: ταῖς θηλαζούσαις
  choice: àwọn tí ń fún ọmọ lọ́mú
  rationale: Ó sọ ìtumọ̀ fífún ọmọ ní ọmú ní èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní ọjọ́ wọnnì
  rationale: Ó jẹ́ ìtumọ̀ àsìkò tí ó sun mọ́ èdè Gíríìkì, tí ó sì jẹ́ Yorùbá adayeba.
- source_word: ἀνάγκη μεγάλη
  choice: ìpọ́njú ńlá
  rationale: Nínú àyíká àjálù yìí, ọ̀rọ̀ náà tọ́ka sí wàhálà àti ìnira líle, kì í ṣe dandan lásán.
- source_word: ἐπὶ τῆς γῆς
  choice: yóò dé bá ilẹ̀ náà
  rationale: γῆ lè túmọ̀ sí ‘ilẹ̀ náà’ tàbí ‘ayé’; ‘ilẹ̀ náà’ bá àyíká Jerúsálẹ́mù àti Jùdíà mu jù, ‘dé bá’ sì fi ipa ìṣẹ̀lẹ̀ tó ń bọ̀ hàn ní Yorùbá adayeba.
- source_word: ὀργὴ
  choice: ìbínú
  rationale: Ó pa ìtumọ̀ ìbínú líle tí ó ní ìdájọ́ nínú mọ́ láì fi ‘ti Ọlọ́run’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τῷ λαῷ τούτῳ
  choice: yóò dé bá àwọn ènìyàn yìí
  rationale: Dátífù náà fi àwọn ènìyàn yìí hàn gẹ́gẹ́ bí ẹni tí ìbínú yóò kan; ọ̀nà yìí sì jẹ́ adayeba, ó tún pa agbára ‘yìí’ mọ́.
theological_decisions:
- issue: Ohun tí γῆ àti ‘àwọn ènìyàn yìí’ ń tọ́ka sí, àti bí ìwọ̀n rẹ̀ ti tó
  choice: A túmọ̀ γῆ sí ‘ilẹ̀ náà,’ nítorí ìdájọ́ agbègbè Israẹli/Jùdíà ni àyíká ọ̀rọ̀ náà kọ́kọ́ ń tọ́ka sí.
  alternative: ‘Ayé,’ èyí tí ó lè tọ́ka sí gbogbo aráyé.
  rationale: Àyíká Lúùkù sọ nípa yíyi Jerúsálẹ́mù ká, ìsọdahoro rẹ̀, àti ohun tí yóò ṣẹlẹ̀ sí àwọn olùgbé rẹ̀. Síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ayé’ sílẹ̀ gẹ́gẹ́ bí ohun tí Gíríìkì lè túmọ̀ sí.
- issue: Irú ìbínú tí ὀργή jẹ́
  choice: A sọ pé ‘ìbínú’ láì fi ẹni tí ìbínú náà ti ọ̀dọ̀ rẹ̀ wá kún un.
  alternative: ‘Ìbínú Ọlọ́run’ tàbí ‘ìdájọ́.’
  rationale: Ó ṣeé ṣe kí àyíká náà tọ́ka sí ìbínú Ọlọ́run, ṣùgbọ́n ẹsẹ̀ Gíríìkì kò sọ ‘Ọlọ́run’ ní tààrà; ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìpele àárín tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘Ègbé ni fún’ láti pa ohùn àsọtẹ́lẹ̀ mọ́; a kò fi ‘Ọlọ́run’ kún ‘ìbínú,’ nítorí kò sí ní tààrà nínú orísun.
