  rationale: A tún ‘ní ọjọ́ wọnnì’ ṣe sí ‘ní àwọn ọjọ́ wọ̀nyẹn’ láti pa ọ̀pọ̀ ọjọ́ àti ìtọ́kasí ἐκείναις mọ́. A tún ìtúmọ̀ àwọn gbolohun ìkẹyìn ṣe sí ‘ìpọ́njú ... yóò wà lórí ...; ìbínú ... yóò sì wà lórí ...’ nítorí ó sún mọ́ Gíríìkì, ó sì jẹ́ Yorùbá aláìlòòótọ́. A pa ‘ilẹ̀ náà’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́ láti tẹ̀lé ìpinnu ìtumọ̀ tí a ti gbà, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ń dá ‘ayé’ sílẹ̀ gẹ́gẹ́ bí yíyan míràn.
