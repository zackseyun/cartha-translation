  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: yo
  text: Èyí yóò jẹ́ àǹfààní fún yín láti jẹ́rìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èyí yóò yọrí sí ẹ̀rí fún yín.”
    reason: Yíyàn ọ̀rọ̀ tó sún mọ́ ìtumọ̀ nọ́ọ̀nù μαρτύριον; ‘ẹ̀rí’ lè ní ìró ìjẹ́rìí ní gbangba tàbí níwájú ìdájọ́.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: yóò yọrí sí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àbájáde ohun tí a sọ ṣáájú, kì í ṣe pé ohun kan kàn ṣẹlẹ̀ lásán.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dátífù náà fi hàn pé àbájáde yìí kan àwọn ọmọ-ẹ̀yìn, ó sì jẹ́ ohun tí yóò wúlò gẹ́gẹ́ bí àǹfààní fún wọn.
- source_word: εἰς
  choice: sí
  rationale: Nínú gbólóhùn yìí, εἰς ń fi àbájáde tàbí ète hàn; ‘yọrí sí’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: μαρτύριον
  choice: ẹ̀rí
  rationale: ‘Ẹ̀rí’ lè túmọ̀ sí ìjẹ́rìí tí a sọ ní gbangba tàbí níwájú aláṣẹ, ó sì tún lè jẹ́ ẹ̀rí ní ọ̀nà ìdájọ́; èyí pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì dín án kù.
theological_decisions:
- issue: Ìtumọ̀ ìyà àwọn ọmọ-ẹ̀yìn níwájú àwọn aláṣẹ
  choice: Àwọn ìṣẹ̀lẹ̀ náà yóò di àǹfààní fún àwọn ọmọ-ẹ̀yìn láti jẹ́rìí.
  alternative: Àwọn ìṣẹ̀lẹ̀ náà yóò jẹ́ ẹ̀rí lòdì sí àwọn ọ̀tá wọn.
  rationale: Àyíká Lúùkù, níbi tí a ti ń mú wọn lọ síwájú àwọn ọba àti àwọn alákòóso, fi hàn pé ó ṣeé ṣe jù pé ẹ̀rí náà ni ti àwọn ọmọ-ẹ̀yìn nípa Jésù. Síbẹ̀, a lo ‘ẹ̀rí’ nínú ọ̀rọ̀ pàtàkì kí a má bàa pa ìtumọ̀ kejì rẹ́ lára.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún, ní ọ̀nà ṣókí, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. ‘Yọrí sí ẹ̀rí’ pa ìṣòro ìtumọ̀ àbájáde/ète àti ẹ̀rí/ìjẹ́rìí mọ́; àlàyé ìtumọ̀ tó ṣe kedere sí i wà ní àlàyé ìsàlẹ̀.
