source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: yo
  text: Wọ́n sì béèrè lọ́wọ́ rẹ̀ pé, “Olùkọ́, ǹjẹ́ nígbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀? Kí sì ni àmì náà nígbà tí àwọn nǹkan wọ̀nyí bá fẹ́ ṣẹlẹ̀?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí sì ni àmì náà nígbà tí àwọn nǹkan wọ̀nyí bá ń bọ̀ láti ṣẹlẹ̀?” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ tó gbòòrò ju “fẹ́ ṣẹlẹ̀” lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Wọ́n sì béèrè lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ náà sọ ní ṣókí pé wọ́n béèrè ìbéèrè lọ́wọ́ rẹ̀; gbólóhùn Yorùbá yìí jẹ́ èdè àdánidá, ó sì bá àyíká ìbéèrè tààrà mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ so ìtàn náà pọ̀, kò sì fi ìtakora líle hàn; “sì” ni ọ̀nà Yorùbá tó bójú mu.
- source_word: λέγοντες
  choice: pé
  rationale: Apá ọ̀rọ̀ yìí mú ọ̀rọ̀ ìbéèrè wọn wọlé. Yorùbá àdánidá máa ń lo “pé” dípò títúmọ̀ rẹ̀ ní líle gẹ́gẹ́ bí “ní wíwí pé.”
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: διδάσκαλος túmọ̀ sí ẹni tí ń kọ́ni; “Olùkọ́” jẹ́ ìtumọ̀ tó ṣe kedere láìfi ìtumọ̀ àṣẹ tó lágbára bíi “Ọ̀gá” kún un.
- source_word: πότε οὖν
  choice: nígbà wo ni
  rationale: “Nígbà wo” pa ìbéèrè nípa àkókò mọ́; ìṣàn àti ìyọrísí tí οὖν ń fi hàn wà nínú àyíká ọ̀rọ̀, kò sì nílò ọ̀rọ̀ àfikún tí yóò mú Yorùbá le.
- source_word: ταῦτα ἔσται
  choice: àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀-ìṣe “jẹ́/wà,” ìtumọ̀ rẹ̀ níhìn-ín ni pé àwọn ìṣẹ̀lẹ̀ náà yóò wáyé; “yóò ṣẹlẹ̀” jẹ́ Yorùbá tó ṣe kedere.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tó ń tọ́ka sí ìṣẹ̀lẹ̀ pàtàkì kan.
- source_word: ὅταν
  choice: pé
  rationale: Nínú ìbéèrè Yorùbá “Kí ni yóò jẹ́ àmì pé…?”, “pé” ni ó fi àkókò/ìpo ìṣẹ̀lẹ̀ tí àmì náà ń tọ́ka sí hàn lọ́nà àdánidá.
- source_word: μέλλῃ
  choice: fẹ́rẹ̀
  rationale: “Fẹ́rẹ̀ ṣẹlẹ̀” pa ìmọ̀lára pé ìṣẹ̀lẹ̀ náà ń sún mọ́lé mọ́, bó tilẹ̀ jẹ́ pé μέλλω tún lè ní ìtumọ̀ gbogbogbò pé ohun kan ń bọ̀.
- source_word: γίνεσθαι
  choice: ṣẹlẹ̀
  rationale: Ní àyíká yìí, γίνομαι ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ tó ń wáyé; “ṣẹlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ nípa òpin ayé àti bí àkókò ṣe sún mọ́lé
  choice: Pa ìbéèrè nípa “àmì” mọ́, kí a sì tú μέλλῃ sí “fẹ́rẹ̀ ṣẹlẹ̀.”
  alternative: “ń bọ̀ láti ṣẹlẹ̀” tàbí “yóò ṣẹlẹ̀”
  rationale: “Fẹ́rẹ̀” pa ìmọ̀lára ìsúnmọ́ tí μέλλω lè ní mọ́, láìsọ bí àkókò náà ṣe gùn tàbí láìfipá yan ètò ẹ̀kọ́ kan nípa àwọn ìṣẹ̀lẹ̀ ọjọ́ iwájú.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yàgò fún ìtumọ̀ líle tí kò bá ìṣàn Yorùbá mu.
