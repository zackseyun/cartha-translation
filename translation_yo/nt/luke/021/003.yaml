  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: yo
  text: Ó sì wí pé, “Lóòótọ́ ni mo sọ fún yín, opó tálákà yìí fi sí i ju gbogbo wọn lọ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀, “ó ju sínú rẹ̀ ju gbogbo wọn lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ Jesu jáde ní Yorùbá àdánidá, láì di ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn pàtó.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́.
- source_word: χήρα
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tó péye fún obìnrin tí ọkọ rẹ̀ ti kú.
- source_word: πτωχή
  choice: tálákà
  rationale: Ó sọ ipò àìní rẹ̀ ní èdè tí àwọn ènìyàn òde òní lóye, láì fi ìwọ̀n òṣì tí ọ̀rọ̀ náà kò sọ ní pàtó kún un.
- source_word: αὕτη
  choice: yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka tí ń tọ́ka sí opó pàtó náà mọ́.
- source_word: πλεῖον
  choice: ju ... lọ
  rationale: Ìlànà àfiwé Yorùbá àdánidá tó ṣàfihàn pé ohun tí ó fi sí i pọ̀ ju ti àwọn yòókù lọ.
- source_word: πάντων
  choice: gbogbo wọn
  rationale: Ní àyíká ọ̀rọ̀, ó tọ́ka sí gbogbo àwọn olùdásílẹ̀ ọrẹ mìíràn; gbolohun yìí pa ìtumọ̀ àfiwé náà mọ́.
- source_word: ἔβαλεν
  choice: fi sí i
  rationale: Ní àyíká àpótí ìṣúra tẹ́ńpìlì, ó túmọ̀ sí fífi owó sínú rẹ̀; ọ̀rọ̀ yìí jẹ́ ti òde òní, ó sì yẹra fún àbá pé ó ju owó náà sí i láìṣọ́ra.
theological_decisions:
- issue: Àfiwé nípa ọrẹ opó náà
  choice: “fi sí i ju gbogbo wọn lọ”
  alternative: “fi sí i ju ẹnikẹ́ni nínú wọn lọ”
  rationale: πλεῖον πάντων ń fi ohun tí opó náà fi sí i wé ti gbogbo àwọn olùfúnni yòókù. Ìtumọ̀ yìí kò ṣàlàyé ìdí àfiwé náà ṣáájú ẹsẹ tó tẹ̀ lé e, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn tí kò sí nínú ẹsẹ yìí kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ; ara ọ̀rọ̀ jẹ́ àdánidá, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní. A lo “fi sí i” fún iṣẹ́ fífi owó sínú àpótí ìṣúra, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìṣe gangan ti βάλλω mọ́.
