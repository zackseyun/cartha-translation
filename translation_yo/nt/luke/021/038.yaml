  to: Gbogbo ènìyàn sì máa ń wá bá a ní kùtùkùtù nínú àgbègbè tẹ́ńpìlì láti gbọ́ ọ́.[a]
  rationale: Àtúnṣe náà yọ àfikún tí kò wà nínú Gíríìkì kúrò, ó sì lo “ní kùtùkùtù” láti fi ìtumọ̀ àkókò ὤρθριζεν hàn ní kedere. “Máa ń” ṣì ń pa ipa imperfect tí ó jẹ́ ìṣe àṣà mọ́, ìsàlẹ̀ náà sì ṣì ṣàlàyé ìtumọ̀ ἱερόν ní tòótọ́.
  reviewer_model: gpt-5.6-terra
