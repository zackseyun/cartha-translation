  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: yo
  text: Gbogbo ènìyàn sì máa ń wá bá a ní kùtùkùtù nínú àgbègbè tẹ́ńpìlì láti gbọ́ ọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: Gbogbo àwọn ènìyàn
  rationale: Ó fi ìtumọ̀ àkójọpọ̀ tí ó gbòòrò hàn nípa àwọn ènìyàn tí wọ́n ń péjọ sọ́dọ̀ Jésù, láìfi dandan sọ pé olúkúlùkù ènìyàn ni.
- source_word: ὤρθριζεν
  choice: máa ń tètè wá ... ní àárọ̀
  rationale: ‘Máa ń’ mú ìṣe àṣà tàbí ìṣe tí a ń tún ṣe inú imperfect náà jáde; ‘tètè ... ní àárọ̀’ sì pa ìtumọ̀ dídìde tàbí wíwá ní kùtùkùtù mọ́.
- source_word: πρὸς αὐτόν
  choice: wá bá a
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìlọ sí ọ̀dọ̀ ẹni tí a ti mẹ́nu kàn, láìṣe àtúnlò orúkọ Jésù.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbègbè tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; yíyan yìí mú ìyàtọ̀ náà hàn ní kedere.
- source_word: ἀκούειν αὐτοῦ
  choice: láti gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Infinitive náà ń sọ ète ìwá wọn; ọ̀rọ̀ Yorùbá yìí túmọ̀ sí pé wọ́n wá láti fetí sí ohun tí Jésù ń sọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Máa ń’ ṣe àfihàn ìṣe tí ó ń ṣẹlẹ̀ léraléra.
