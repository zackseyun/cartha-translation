revisions:
- from: Ó gbé ojú sókè, ó sì rí àwọn ọlọ́rọ̀ tí ń kó ẹ̀bùn wọn[a] sí ibi ìṣúra[b].
  to: Ó gbé ojú sókè, ó sì rí àwọn ọlọ́rọ̀ tí ń fi àwọn ẹ̀bùn wọn sínú ibi ìṣúra[a].
  rationale: The revision makes the act of depositing explicit, retains the plural gifts of the Greek, and removes an unsafe lexical-alternative footnote. The treasury note is retained, with wording that reflects both a treasury area and offering receptacles without deciding between them.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the lifted gaze, the perception, the wealthy people, and the broad ambiguity of γαζοφυλάκιον. However, “tí ń kó ẹ̀bùn wọn sí” more naturally suggests carrying gifts to a place than depositing them into it; the Greek βάλλοντας specifically depicts putting/casting the gifts into the treasury. The source has plural τὰ δῶρα, which is best retained as “àwọn ẹ̀bùn wọn.”
  naturalness: “Ó gbé ojú sókè, ó sì rí àwọn ọlọ́rọ̀” is natural, dignified Standard Yoruba. Recasting the participial phrase with “tí ń fi ... sínú” gives an idiomatic and precise expression for placing offerings in a receptacle or treasury area.
  terminology: “Àwọn ọlọ́rọ̀,” “ẹ̀bùn,” and “ibi ìṣúra” are appropriate. The first footnote's “ọrẹ wọn” is potentially ambiguous in contemporary Yoruba, where ọ̀rẹ commonly means ‘friend’; it should not be offered as an unqualified lexical alternative here. “Àwọn ẹ̀bùn wọn” retains the unmarked sense of δῶρα, while the cultural footnote appropriately explains the possible reference of γαζοφυλάκιον.
  issues:
  - severity: medium
    issue: The phrase “tí ń kó ẹ̀bùn wọn sí ibi ìṣúra” can mean ‘carrying/taking their gifts to the treasury.’
    rationale: βάλλοντας εἰς indicates depositing or putting the gifts into the treasury, not merely transporting them there. “Tí ń fi àwọn ẹ̀bùn wọn sínú ibi ìṣúra” preserves this action naturally.
  - severity: medium
    issue: Footnote a gives “ọrẹ wọn” as an unqualified alternative.
    rationale: This wording is liable to be understood as ‘their friends’ in modern Yoruba. It does not safely communicate the intended lexical alternative without explanatory context, so it should be removed.
  - severity: low
    issue: The translation uses singular “ẹ̀bùn” where Greek has plural τὰ δῶρα.
    rationale: A collective singular can be acceptable, but plural “àwọn ẹ̀bùn wọn” more directly reflects the source and reads naturally in this context.
  revised_text: Ó gbé ojú sókè, ó sì rí àwọn ọlọ́rọ̀ tí ń fi àwọn ẹ̀bùn wọn sínú ibi ìṣúra[a].
  revised_footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ibi ìṣúra” lè tọ́ka sí agbègbè ìṣúra tẹ́ńpìlì tàbí sí àwọn ohun èlò tí a ń fi ẹ̀bùn sínú.
    reason: cultural_note
  revision_rationale: The revision makes the act of depositing explicit, retains the plural gifts of the Greek, and removes an unsafe lexical-alternative footnote. The treasury note is retained, with wording that reflects both a treasury area and offering receptacles without deciding between them.
