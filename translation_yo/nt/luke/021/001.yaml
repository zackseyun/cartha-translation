source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: yo
  text: Ó gbé ojú sókè, ó sì rí àwọn ọlọ́rọ̀ tí ń fi àwọn ẹ̀bùn wọn sínú ibi ìṣúra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ibi ìṣúra” lè tọ́ka sí agbègbè ìṣúra tẹ́ńpìlì tàbí sí àwọn ohun èlò tí a ń fi ẹ̀bùn sínú.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: Ó gbé ojú sókè
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe gbígbé ojú sókè ní ti gidi; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìṣe inú ìtàn náà mọ́.
- source_word: δὲ
  choice: ó sì
  rationale: δέ jẹ́ àsopọ̀ rírọ̀ nínú ìtàn; “ó sì” so ìṣe méjèèjì pọ̀ láìfi ìtakora tàbí ìtẹ̀lé àkókò tó lágbára kún un.
- source_word: εἶδεν
  choice: rí
  rationale: Ìtumọ̀ rẹ̀ níbí ni rírí lasán; “rí” kò fi èrò àfikún bíi fífi àkíyèsí jinlẹ̀ sí i.
- source_word: τοὺς βάλλοντας
  choice: àwọn ... tí ń kó ... sí
  rationale: Participle náà dúró fún àwọn ènìyàn tí wọ́n ń fi nǹkan sínú ohun kan. “Kó ... sí” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ ìṣe yìí, dípò títúmọ̀ βάλλω gẹ́gẹ́ bí “sọ” tàbí “jù,” èyí tí yóò le ní ìtumọ̀ tí kò yẹ ní àyíká ọrẹ.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: sí ibi ìṣúra
  rationale: “Ibi ìṣúra” jẹ́ gbòòrò tó láti tọ́ka sí agbègbè ìṣúra tẹ́ńpìlì tàbí ibi tí a ń gba ọrẹ, láìdá ìtumọ̀ ọ̀rọ̀ Gíríìkì náà sí àpótí kan ṣoṣo.
- source_word: τὰ δῶρα αὐτῶν
  choice: ẹ̀bùn wọn
  rationale: δῶρα túmọ̀ sí “ẹ̀bùn”; ní àyíká yìí ó jẹ́ ohun tí wọ́n fi rú ọrẹ. “Ẹ̀bùn wọn” pa ìtumọ̀ ọ̀rọ̀ náà mọ́, nígbà tí “ọrẹ wọn” tún ṣeé ṣe.
- source_word: πλουσίους
  choice: àwọn ọlọ́rọ̀
  rationale: Adjective náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn olówó; “àwọn ọlọ́rọ̀” jẹ́ kedere, àdánidá, ó sì bá ìtumọ̀ Gíríìkì mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá Àfẹnukò tó bójú mu, pẹ̀lú àmì ohùn ní kíkún. Ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbòò; “ibi ìṣúra” tún pa àìdánilójú inú γαζοφυλάκιον mọ́.
