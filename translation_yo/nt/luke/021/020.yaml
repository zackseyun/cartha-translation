  to: Ṣùgbọ́n nígbà tí ẹ bá rí Jerúsálẹ́mù tí àwọn ọmọ ogun ń yí i ká[a], nígbà náà, kí ẹ mọ̀ pé ìsọdahoro rẹ̀ ti sún mọ́[b].
