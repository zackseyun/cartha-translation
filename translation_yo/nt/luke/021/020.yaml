language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹ bá rí Jerúsálẹ́mù tí àwọn ọmọ ogun ń yí i ká[a], nígbà náà, kí ẹ mọ̀ pé ìsọdahoro rẹ̀ ti sún mọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí àwọn ibùdó ológun yí Jerúsálẹ́mù ká.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ibùdó tàbí àwọn ọmọ ogun tí wọ́n dó síbẹ̀; níbí, ó ń tọ́ka sí àwọn agbára ológun tí wọ́n dó yí Jerúsálẹ́mù ká.
    reason: lexical_alternative
  - marker: b
    text: “Ìsọdahoro” tún mú èdè ìdájọ́ àwọn wòlíì wá sí ọkàn; fi wé ọ̀rọ̀ tó jọ èyí nínú Mátíù 24:15 àti Máàkù 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn, ó sì dá ipò ọjọ́ iwájú sílẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: ἴδητε
  choice: ẹ bá rí i
  rationale: Àkópọ̀ ‘nígbà tí … bá’ jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí a ń retí lọ́jọ́ iwájú; ‘rí i’ pa ìtumọ̀ ìríran mọ́.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: àwọn ọmọ ogun yí … ká
  rationale: Ó sọ ipò ìdótì ológun náà ní kedere. στρατόπεδον lè túmọ̀ sí ibùdó ológun tàbí àwọn ọmọ ogun tí wọ́n dó sí ibẹ̀; ọ̀rọ̀ àyíká tọ́ka sí àwọn agbára tí ń dó ti ìlú náà.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Ìkọ̀wé orúkọ ibìkan yìí tẹ̀ lé bí a ṣe ń pè é ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: τότε γνῶτε
  choice: nígbà náà ni kí ẹ mọ̀
  rationale: Ó pa ìtẹnumọ́ àkókò àti agbára àṣẹ aorist imperative mọ́ ní Yorùbá àdánidá.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Ó fi hàn pé ohun náà ti súnmọ́, tí ipò ìsúnmọ́ náà sì wà báyìí, gẹ́gẹ́ bí perfect tense Gíríìkì.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: ìsọdahoro rẹ̀
  rationale: ‘Ìsọdahoro’ pa ìtumọ̀ ìparun tí ń sọ ibi di ahoro àti ìró èdè ìdájọ́ àwọn wòlíì mọ́, láì fi èrò ìtumọ̀ ẹ̀sìn mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ ìdájọ́ tó ń bọ̀ sórí Jerúsálẹ́mù
  choice: Lo ‘ìsọdahoro’ fún ἐρήμωσις, láì sọ ètò ìtumọ̀ nípa ọjọ́ ìkẹyìn kan pàtó.
  alternative: Lo ‘ìparun,’ tàbí so ó ní tààràtà mọ́ ‘ohun ìríra tí ń sọni di ahoro.’
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ pé ìsọdahoro Jerúsálẹ́mù sún mọ́lé nígbà tí àwọn ọmọ ogun bá yí i ká. ‘Ìsọdahoro’ pa ìwọ̀n ọ̀rọ̀ àti ìró àsọtẹ́lẹ̀ mọ́ láì yanjú àríyànjiyàn ẹ̀kọ́ ìgbà ìkẹyìn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ẹni kejì plural nínú Gíríìkì. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì pa àwòrán ìdótì ológun àti ìdájọ́ àsọtẹ́lẹ̀ mọ́.
