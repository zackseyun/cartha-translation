  terminology: “Ìgbẹ̀san” jẹ́ ìtumọ̀ tó bójú mu fún ἐκδίκησις nínú àyíká ìdájọ́. Kò yẹ kí a lo “ẹ̀san ìwà,” nítorí èyí kì í túmọ̀ sí ìgbẹ̀san tàbí ìsanpadà ìdájọ́. “Ìsanpadà” ni àṣàyàn tó dára fún àlàyé ọ̀rọ̀ náà.
