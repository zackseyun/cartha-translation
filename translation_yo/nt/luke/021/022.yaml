  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: yo
  text: Nítorí ọjọ́ ìgbẹ̀san ni ọjọ́ wọ̀nyí, kí gbogbo ohun tí a ti kọ sílẹ̀ lè ṣẹ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ọjọ́ ìsanpadà ni ọjọ́ wọ̀nyí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti jẹ́ kí gbogbo ohun tí a ti kọ sílẹ̀ ṣẹ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ìdí fún ìkìlọ̀ tó ṣáájú; “Nítorí” pa agbára ìdí/àlàyé Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἡμέραι ἐκδικήσεως
  choice: ọjọ́ ìgbẹ̀san
  rationale: Ó pa àwòrán “ọjọ́” àti ìtumọ̀ ìdájọ́ líle ti ἐκδίκησις mọ́, láì sọ ọ́ di ìbínú ẹ̀dá ènìyàn lásán.
- source_word: αὗταί εἰσιν
  choice: ni ọjọ́ wọ̀nyí
  rationale: Ìṣètò gbólóhùn Yorùbá yìí fi ìtẹnumọ́ sí “ọjọ́ wọ̀nyí” gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: τοῦ πλησθῆναι
  choice: kí ... lè ṣẹ
  rationale: Ó ṣàfihàn ìtumọ̀ ète tàbí àbájáde tí infinitive náà lè ní, láì fi dandan yan ọ̀kan ṣoṣo.
- source_word: πάντα τὰ γεγραμμένα
  choice: gbogbo ohun tí a ti kọ sílẹ̀
  rationale: Ó pa ìwọ̀n gbogbo àti perfect passive participle mọ́, kò sì dín ohun tí a kọ sílẹ̀ náà kù sí àkọlé kan pàtó.
theological_decisions:
- issue: Ìwà ἐκδικήσεως nínú àsọtẹ́lẹ̀ Jésù
  choice: ìgbẹ̀san
  alternative: ìjìyà ìdájọ́; ẹ̀san ìwà
  rationale: “Ìgbẹ̀san” pa líle àti ìtumọ̀ ìdájọ́ Ọlọ́run mọ́; àyíká àti ìmúṣẹ ohun tí a kọ sílẹ̀ ni ó ń dá a dúró kí a má ka a sí ìwà ìkórìíra ènìyàn lásán.
- issue: Agbára τοῦ pẹ̀lú infinitive
  choice: kí ... lè ṣẹ
  alternative: fún ... láti ṣẹ
  rationale: Àyànfẹ́ yìí jẹ́ kí ìtumọ̀ ète àti àbájáde méjèèjì ṣì ṣeé gbà, dípò fífi ọ̀kan múlẹ̀ lórí èkejì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣeé yé fún òǹkàwé òde òní, ó sì pa àwòrán àti àìdánilójú gírámà orísun mọ́.
