  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń tẹ̀lé Gíríìkì dáadáa: “Nítorí” ń ṣàlàyé ìkìlọ̀ tó ṣáájú, “ọjọ́ ìgbẹ̀san” pa ìtumọ̀ ìdájọ́/ìsanpadà mọ́, àti “kí ... lè ṣẹ” lè gbé ète tàbí àbájáde τοῦ + infinitive jáde. Síbẹ̀, àlàyé àfikún [a] lọwọlọwọ, “ẹ̀san ìwà,” kò jẹ́ àfidámọ́ ọrọ̀ ἐκδίκησις; ó yí i padà sí èrè tàbí ìsanwó fún ìwà.'
