  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa wà lójúfò ní gbogbo ìgbà, kí ẹ sì máa gbàdúrà pé kí ẹ lè ní agbára láti[a] yọ kúrò nínú gbogbo ohun wọ̀nyí tí ó fẹ́ ṣẹlẹ̀[b], àti láti dúró níwájú Ọmọ Ènìyàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “kí a kà yín sí ẹni tí ó yẹ láti yọ kúrò nínú gbogbo ohun wọ̀nyí ...” dípò “kí ẹ lè ní agbára láti yọ kúrò nínú gbogbo ohun wọ̀nyí ...”
    reason: textual_variant
  - marker: b
    text: Tàbí, “tí yóò ṣẹlẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn náà, “dúró níwájú Ọmọ Ènìyàn,” lè túmọ̀ sí dídúró níwájú rẹ̀ gẹ́gẹ́ bí ẹni tí a tẹ́wọ́ gbà tàbí ẹni tí a dá láre, ṣùgbọ́n Gíríìkì kò sọ ìtumọ̀ yìí ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: ẹ máa wà lójúfò
  rationale: Ọ̀rọ̀ àṣẹ náà ń pe àwọn olùgbọ́ púpọ̀ sí ìṣọ́ra tí kò dáwọ́ dúró. ‘Ẹ máa wà lójúfò’ jẹ́ Yorùbá àdánidá tí ó pa àwòrán jíjíròrò àti ìmúrasílẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ tàbí ìyípadà ọ̀rọ̀ hàn lẹ́yìn ìkìlọ̀ tó ṣáájú.
- source_word: ἐν παντὶ καιρῷ
  choice: ní gbogbo ìgbà
  rationale: Ó sọ ìtẹ̀síwájú ìṣọ́ra ní gbogbo àkókò ní Yorùbá tí ó ṣe kedere.
- source_word: δεόμενοι
  choice: kí ẹ sì máa gbàdúrà
  rationale: Participle náà tọ́ka sí àdúrà ẹ̀bẹ̀; ìtumọ̀ yìí so ó mọ́ àṣẹ pàtàkì lọ́nà àdánidá.
- source_word: ἵνα κατισχύσητε
  choice: kí ẹ lè ní agbára
  rationale: κατισχύω túmọ̀ sí níní agbára tó, tàbí ṣíṣeé borí. Ìtumọ̀ yìí tẹ̀ lé SBLGNT, kò sì da a pọ̀ mọ́ àyípadà àfọwọ́kọ tó ní ‘kà ... yẹ.’
- source_word: ἐκφυγεῖν
  choice: láti yọ kúrò nínú
  rationale: Ó sọ àbájáde tí wọ́n ń bẹ̀bẹ̀ fún, ìyẹn kí wọ́n lè bọ́ tàbí sá àsálà kúrò nínú àwọn ohun tó ń bọ̀.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: gbogbo ohun wọ̀nyí tí ó fẹ́ ṣẹlẹ̀
  rationale: ‘Tí ó fẹ́ ṣẹlẹ̀’ lè fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ó sún mọ́lé hàn, láì sọ pé ó ti bẹ̀rẹ̀ sí í ṣẹlẹ̀.
- source_word: σταθῆναι
  choice: láti dúró
  rationale: Ó pa àwòrán dídúró níwájú ẹni kan mọ́, láì fi ìtẹ́wọ́gbà tàbí ìdáláre tí Gíríìkì kò sọ ní tààrà kún un.
- source_word: ἔμπροσθεν
  choice: níwájú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá kedere fún ipò tàbí ìbáṣepọ̀ wíwà níwájú ẹnì kan.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè náà àti ìtumọ̀ abẹ́lẹ̀ Sẹ́mítì rẹ̀ mọ́ gẹ́gẹ́ bí a ṣe ń lò ó nínú àwọn Ìhìn Rere.
theological_decisions:
- issue: Ìtumọ̀ κατισχύσητε nípa fífaradà ní àkókò ìkẹyìn
  choice: kí ẹ lè ní agbára
  alternative: kí a lè kà yín yẹ
  rationale: SBLGNT ka κατισχύσητε, èyí tó ń sọ nípa agbára tàbí ṣíṣeé borí, kì í ṣe yíyẹ. A fi àyípadà àfọwọ́kọ tó gbajúmọ̀ sí àlàyé ìsàlẹ̀ dípò fífi í sínú ọ̀rọ̀ pàtàkì.
- issue: Agbára ọ̀rọ̀ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: láti dúró níwájú Ọmọ Ènìyàn
  alternative: láti dúró níwájú Ọmọ Ènìyàn gẹ́gẹ́ bí ẹni tí a tẹ́wọ́ gbà
  rationale: Gbólóhùn náà lè ní ìtumọ̀ ìdáláre ní ìdájọ́ ọjọ́ ìkẹyìn, ṣùgbọ́n Gíríìkì kò sọ èyí ní gbangba. A pa àìdánilójú tó wà nínú orísun mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti kedere. Àṣẹ náà jẹ́ ọ̀pọ̀ ènìyàn (‘ẹ’), a sì yan ‘wà lójúfò’ láti fi ìṣọ́ra tẹ̀síwájú hàn. A yàgò fún fífi ẹ̀kọ́ ìjọ kan tàbí ìtumọ̀ ìdáláre tí kò hàn gbangba nínú Gíríìkì sínú ọ̀rọ̀ pàtàkì.
