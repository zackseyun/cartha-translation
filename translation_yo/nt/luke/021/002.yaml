  text: εἶδεν δέ ⸀τινα χήραν πενιχρὰν βάλλουσαν ἐκεῖ ⸂λεπτὰ δύο⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/002.yaml
  text: And he saw a poor widow putting in two small copper coins there,[a]
translation:
  language: yo
  text: Ó sì rí opó obìnrin aláìní kan tí ó ń fi owó idẹ kéékèèké méjì síbẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “lepta méjì,” ìyẹn ni, owó idẹ méjì tí ó kéré gan-an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Ó rí
  rationale: Aorist ọ̀rọ̀-ìṣe ὁράω túmọ̀ sí pé ó rí i; yíyan “rí” pa ìṣípò ìtàn náà mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: δέ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú ìtàn yìí; “sì” so ẹsẹ yìí mọ́ ohun tó ṣáájú láìsọ ọ́ di ìyàtọ̀ tó lágbára.
- source_word: τινα
  choice: kan
  rationale: τις ń tọ́ka sí ẹni tí a kò dárúkọ; “kan” ni ọ̀nà àdánidá láti fi àìsọ ẹni pàtó hàn ní Yorùbá.
- source_word: χήραν
  choice: opó obìnrin
  rationale: χήρα túmọ̀ sí opó obìnrin. Fífi “obìnrin” kún un mú akọ tàbí abo ẹni náà ṣe kedere, nítorí “opó” nìkan lè tọ́ka sí obìnrin tàbí ọkùnrin ní Yorùbá.
- source_word: πενιχρὰν
  choice: aláìní
  rationale: πενιχρός ń sọ ẹni tí ohun ìní rẹ̀ kéré tàbí tí ó jẹ́ òtòṣì. “Aláìní” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tí kò sì mú ipò náà le ju ohun tí Gíríìkì sọ lọ.
- source_word: βάλλουσαν
  choice: tí ó ń fi … sí
  rationale: Bí ó tilẹ̀ jẹ́ pé βάλλω lè túmọ̀ sí “sọ” tàbí “jù,” nínú ọ̀rọ̀ fífi owó sínú àpótí ìṣúra, “fi … sí” jẹ́ èdè Yorùbá àdánidá. Àmì “ń” tún pa ìṣe tó ń lọ nígbà tí ó rí i mọ́.
- source_word: ἐκεῖ
  choice: síbẹ̀
  rationale: ἐκεῖ túmọ̀ sí “níbẹ̀”; “síbẹ̀” bá ìṣe fífi nkan sí ibi tí a ti mẹ́nu kàn tẹ́lẹ̀ mu.
- source_word: λεπτὰ δύο
  choice: owó idẹ kéékèèké méjì
  rationale: λεπτά jẹ́ owó idẹ méjì tí iye wọn kéré gan-an. Ìtumọ̀ yìí sọ iye, irú irin, àti kékeré owó náà ní èdè tí òǹkàwé òde òní lè lóye; àlàyé ìdánimọ̀ Gíríìkì wà ní àlàyé ìsàlẹ̀.
