  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìkìlọ̀ náà, wíwá ‘ní orúkọ mi,’ ẹ̀sùn ìdánimọ̀ ‘Èmi ni ẹni náà,’ ìkéde pé àkókò ti sún mọ́, àti àṣẹ pé kí wọ́n má tẹ̀ lé àwọn ẹni bẹ́ẹ̀, wà níbẹ̀. Ṣùgbọ́n ‘kí a má bàa mú yín ṣìnà’ kò jẹ́ ọ̀nà Yorùbá tó rọrùn tàbí tó péye láti ṣàfihàn ìkìlọ̀ ìfaragba náà; ‘kí a má bàa tàn yín jẹ’ dára sí i nínú àyíká àwọn afẹnujẹ.'
  naturalness: ‘Ẹ ṣọ́ra’ àti ‘Ẹ má ṣe tọ̀ wọn lẹ́yìn’ jẹ́ ọ̀rọ̀ Yorùbá aláìléwu, adayeba. A tún ṣe ‘wọn yóò máa wí’ sí ‘wọ́n a sì wí’ kí ìṣọ̀kan gbolohun àti ìbáṣepọ̀ participle náà lè rọrùn. ‘Ti sún mọ́’ ni a lò dípò ‘ti sún mọ́lé,’ nítorí ó ṣàfihàn ‘has drawn near’ ní kedere láìkó ìtumọ̀ ibùdó/ilé wọlé.
  terminology: ‘Ní orúkọ mi’ pa ἐπὶ τῷ ὀνόματί μου mọ́. ‘Èmi ni ẹni náà’ ń sọ ìdánimọ̀ tí a fi sílẹ̀ nínú Ἐγώ εἰμι láìsọ pé Mèsáyà ni wọ́n ń pè ara wọn. Àlàyé ìsàlẹ̀ ojú ìwé náà pa aṣàyàn ‘Èmi ni’ àti ìmọ̀lára àyíká mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
