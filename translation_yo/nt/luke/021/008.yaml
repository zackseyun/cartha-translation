id: LUK.21.8
reference: Luke 21:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: yo
  text: Ó sì wí pé, “Ẹ ṣọ́ra kí a má bàa tàn yín jẹ. Nítorí ọ̀pọ̀ ènìyàn yóò wá ní orúkọ mi, wọ́n a sì wí pé, ‘Èmi ni ẹni náà,’[a] àti pé, ‘Àkókò náà ti sún mọ́.’ Ẹ má ṣe tọ̀ wọn lẹ́yìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ṣókí, “Èmi ni”; ìyẹn ni pé, afẹnujẹ kan ń pe ara rẹ̀ ní ẹni tí a ń retí, bóyá Mèsáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε
  choice: Ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ yìí ń ké sí ọ̀pọ̀ olùgbọ́ pé kí wọ́n wà lójúfò. ‘Ẹ ṣọ́ra’ jẹ́ Yorùbá àdánidá tí ó sì bá ìkìlọ̀ tó tẹ̀ lé e mu.
- source_word: μὴ πλανηθῆτε
  choice: kí a má bàa mú yín ṣìnà
  rationale: Ìtumọ̀ yìí pa ìrísí ọ̀rọ̀ tí ó sọ nípa mímú ènìyàn kúrò ní ọ̀nà òtítọ́ mọ́, ó sì fi ipò àfarawà ọ̀rọ̀ Gíríìkì hàn láìsọ ẹni tó ń tan wọn jẹ ní pàtó.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: yóò wá ní orúkọ mi
  rationale: ‘Ní orúkọ mi’ lè túmọ̀ sí wíwá pẹ̀lú ẹ̀tọ́ tàbí ìdánimọ̀ tí wọ́n ń sọ pé ó jẹ́ ti Jésù, ó sì jẹ́ gbólóhùn tó mọ́gbọ́n dání ní Yorùbá.
- source_word: λέγοντες
  choice: wọn yóò máa wí pé
  rationale: Ó ṣàfihàn ọ̀rọ̀ tí àwọn ẹlẹ́tàn náà yóò máa sọ, láìfi ìtumọ̀ míì kún ọ̀rọ̀ orísun.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni ẹni náà
  rationale: Gbólóhùn Gíríìkì kò sọ oyè kan ní pàtó. ‘Èmi ni ẹni náà’ mú ìdánimọ̀ tí ọ̀rọ̀ náà ń béèrè hàn ní Yorùbá, láìfi ‘Mèsáyà’ kún un.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Àkókò náà ti sún mọ́lé
  rationale: ‘Àkókò náà’ lè tọ́ka sí àkókò pàtàkì tí a yàn, ‘ti sún mọ́lé’ sì pa ìṣe pípé tí ó ní ipa lọ́wọ́lọ́wọ́ mọ́.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Ẹ má ṣe tọ̀ wọn lẹ́yìn
  rationale: Ó jẹ́ àṣẹ pé kí àwọn olùgbọ́ má ṣe darapọ̀ mọ́ wọn tàbí tẹ̀ lé wọn, ó sì pa àwòrán lílọ lẹ́yìn wọn mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἐγώ εἰμι nínú ọ̀rọ̀ àwọn afẹnujẹ
  choice: Èmi ni ẹni náà
  alternative: Èmi ni; tàbí Èmi ni Mèsáyà
  rationale: Ọ̀rọ̀ náà lè dúró gẹ́gẹ́ bí ‘Èmi ni,’ ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé àwọn afẹnujẹ ń dá ara wọn mọ̀ gẹ́gẹ́ bí ẹni tí a ń retí. A kò lo ‘Mèsáyà’ nínú ẹsẹ̀ náà nítorí Gíríìkì kò sọ ọ́ ní gbangba; àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. Àṣẹ méjèèjì jẹ́ fún ọ̀pọ̀ ènìyàn, nítorí náà a lo ‘Ẹ’. A yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan, a sì pa àìdánilójú Ἐγώ εἰμι mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
