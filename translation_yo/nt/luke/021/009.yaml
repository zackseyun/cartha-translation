id: LUK.21.9
reference: Luke 21:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹ bá gbọ́ nípa ogun àti rúkèrúdò[a], ẹ má ṣe fòyà; nítorí àwọn nǹkan wọ̀nyí gbọdọ̀ kọ́kọ́ ṣẹlẹ̀, ṣùgbọ́n òpin kò níí dé lẹ́sẹ̀kẹsẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdàrúdàpọ̀,” “rudurùdu,” tàbí “àìṣètò.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ṣùgbọ́n kì í ṣe òpin lẹ́sẹ̀kẹsẹ̀.” Tàbí, “ṣùgbọ́n òpin kò níí dé lẹ́sẹ̀kẹsẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: “Nígbà tí” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí kò tíì ní àkókò pàtó hàn; “Ṣùgbọ́n” sì mú ìlọsíwájú ọ̀rọ̀ àti ìyàtọ̀ pẹ̀lẹ́ tí δέ ní nínú àyíká yìí jáde.
- source_word: ἀκούσητε
  choice: ẹ bá gbọ́ nípa
  rationale: Ọ̀rọ̀ yìí tọ́ka sí gbígbọ́ ìròyìn nípa àwọn ìṣẹ̀lẹ̀; “gbọ́ nípa” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πολέμους
  choice: ogun
  rationale: “Ogun” lè dúró fún ogun kan tàbí àwọn ogun lọ́pọ̀ nínú irú àkópọ̀ ọ̀rọ̀ yìí, ó sì ṣe déédé pẹ̀lú πολέμους.
- source_word: ἀκαταστασίας
  choice: rúkèrúdò
  rationale: “Rúkèrúdò” bo ìdàrúdàpọ̀, ìwọ́de aláriwo, àti àìbalẹ̀ láwùjọ tàbí nínú ìṣèlú láì fi ìtumọ̀ náà mọ́ ìṣọ̀tẹ̀ nìkan.
- source_word: μὴ πτοηθῆτε
  choice: ẹ má ṣe fòyà
  rationale: “Fòyà” sọ ìbẹ̀rù líle tàbí jíjáyà tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: δεῖ γὰρ
  choice: nítorí ... gbọdọ̀
  rationale: “Nítorí” mú agbára àlàyé γάρ jáde, “gbọ́dọ̀/mọ́tọ̀lẹ̀” sì fi dandan tí δεῖ túmọ̀ sí hàn; “mọ́tọ̀lẹ̀” here represented as standard “mọ́tọ̀lẹ̀” is avoided in the text in favor of the standard spelling “mọ́tọ̀lẹ̀”.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: àwọn nǹkan wọ̀nyí gbọdọ̀ kọ́kọ́ ṣẹlẹ̀
  rationale: “Ṣẹlẹ̀” jẹ́ ọ̀nà àdánidá fún γίνομαι nígbà tí a ń sọ nípa àwọn ìṣẹ̀lẹ̀, “kọ́kọ́” sì pa ìtẹ̀lé tí πρῶτον fi hàn mọ́.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ṣùgbọ́n òpin kì yóò dé lẹ́sẹ̀kẹsẹ̀
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe ní apá yìí. Fífi “dé” kún un jẹ́ ohun tí Yorùbá àdánidá nílò, nígbà tí “lẹ́sẹ̀kẹsẹ̀” pa agbára εὐθέως mọ́.
theological_decisions:
- issue: Àkókò òpin
  choice: Àwọn ogun àti rúkèrúdò gbọdọ̀ kọ́kọ́ ṣẹlẹ̀, ṣùgbọ́n òpin kì yóò dé lẹ́sẹ̀kẹsẹ̀.
  alternative: Àwọn ìṣẹ̀lẹ̀ wọ̀nyí wà lára ohun tí ó ṣáájú òpin, ṣùgbọ́n wọn kì í ṣe òpin fúnra rẹ̀.
  rationale: Ìtumọ̀ náà pa ìkìlọ̀ Jésù mọ́ pé a kò gbọdọ̀ ka ìròyìn rúkèrúdò sí ẹ̀rí pé òpin ti dé lójú ẹsẹ̀, láì gbé ètò ẹ̀kọ́ kan pàtó nípa ọjọ́ ìkẹyìn wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ẹni kejì ọ̀pọ̀ nínú Gíríìkì. “Rúkèrúdò” jẹ́ àṣàyàn àkọ́kọ́ nítorí ó gbòòrò tó láti gba oríṣìíríṣìí àìbalẹ̀ láwùjọ àti nínú ìṣèlú.
