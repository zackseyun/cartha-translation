  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: yo
  text: nígbà tí wọ́n bá ti rúwé[a], nípa rírí wọn, ẹ̀yin fúnra yín á mọ̀ pé ìgbà ẹ̀ẹ̀rùn ti sún mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, “nígbà tí wọ́n bá ti yọ.” Ọ̀rọ̀ Gíríìkì kò darúkọ “ewé” ní tààràtà, ṣùgbọ́n àyíká ọ̀rọ̀ nípa àwọn igi fi í hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Àkópọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi gbé gbólóhùn àkókò tí ohun tí a ń retí yóò ṣẹlẹ̀ hàn.
- source_word: προβάλωσιν
  choice: rúwé
  rationale: Nínú àyíká ọ̀rọ̀ igi ní ẹsẹ tó ṣáájú, ‘rúwé’ sọ ní ṣókí àti ní àdánidá pé àwọn igi ń yọ ewé tuntun, bí ó tilẹ̀ jẹ́ pé ewé kò hàn gbangba nínú ọ̀rọ̀ Gíríìkì.
- source_word: ἤδη
  choice: ti
  rationale: ‘Ti’ nínú ‘bá ti rúwé’ àti ‘ti sún mọ́lé’ fi hàn pé ìṣẹ̀lẹ̀ náà ti bẹ̀rẹ̀ sí í fara hàn; èyí pa ipa ἤδη méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: βλέποντες
  choice: nípa rírí i
  rationale: 'Ó pa ìtumọ̀ participle náà gẹ́gẹ́ bí ọ̀nà tí wọ́n fi mọ̀ mọ́: ìmọ̀ náà wá nípasẹ̀ ohun tí wọ́n rí.'
- source_word: ἀφ’ ἑαυτῶν
  choice: ẹ̀yin fúnra yín
  rationale: Ó tẹnu mọ́ pé àwọn olùgbọ́ lè mọ̀ ọ́ láti inú àkíyèsí tiwọn fúnra wọn, láìní ẹni míì láti ṣàlàyé fún wọn.
- source_word: γινώσκετε
  choice: á mọ̀
  rationale: Nínú gbólóhùn àkókò Yorùbá, ‘á mọ̀’ sọ àbájáde tí ó máa ń tẹ̀ lé àmì náà ní kedere, ó sì bá ìtumọ̀ ìdánimọ̀ láti inú àkíyèsí mu.
- source_word: ἐγγὺς
  choice: sún mọ́lé
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ìsúnmọ́ àkókò ní àdánidá.
- source_word: θέρος
  choice: ìgbà ẹ̀ẹ̀rùn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún season tí Gíríìkì θέρος ń tọ́ka sí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá fún olùkà òde òní. A lo ‘rúwé’ fún ìtumọ̀ ewé tuntun tí àyíká ọ̀rọ̀ ń tọ́ka sí, a sì fi àlàyé sí àkọsílẹ̀ ìsàlẹ̀ nítorí pé ọ̀rọ̀ Gíríìkì kò darúkọ ewé ní tààràtà.
