  source_fidelity: 'Ìtumọ̀ náà gba èrò gbólóhùn Gíríìkì dáadáa: àmì àkókò náà, rúwé àwọn igi, ìmọ̀ tí ó wá láti inú àkíyèsí àwọn olùgbọ́, àti ìsúnmọ́ ìgbà ẹ̀ẹ̀rùn. ‘Rúwé’ jẹ́ ìtumọ̀ tó yẹ fún προβάλωσιν nínú àyíká àwọn igi, bí ó tilẹ̀ jẹ́ pé ‘ewé’ jẹ́ ohun tí àyíká ń fi hàn dípò ohun tí a sọ ní gbangba. Ṣùgbọ́n ‘sún mọ́lé’ yí ìtumọ̀ ἐγγὺς padà sí ìsúnmọ́ ilé; Gíríìkì kan sọ pé ìgbà ẹ̀ẹ̀rùn ti sún mọ́.'
