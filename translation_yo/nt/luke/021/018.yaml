  text: And not a hair from your head will perish[a].
translation:
  language: yo
  text: Kò sì sí irun kan láti orí yín tí yóò ṣègbé rárá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ Gíríìkì: “Kò sí irun kan láti orí yín tí yóò ṣègbé rárá.” Gíríìkì lò ìkọ̀ méjì láti fi ìdánilójú tó lágbára hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Àti pé
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú láì fi ìtakora kún un.
- source_word: θρὶξ
  choice: irun kan
  rationale: Ọ̀rọ̀ náà jẹ́ ẹyọ kan; ‘irun kan’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kò sí èyíkéyìí tí yóò ṣègbé.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: láti orí yín
  rationale: Ó pa ìtumọ̀ apá-kúrò-nínú-odidi mọ́, ó sì bá bí Yorùbá ṣe ń sọ ọ́ mu.
- source_word: οὐ μὴ
  choice: kì yóò ... láé
  rationale: Àkójọpọ̀ ọ̀rọ̀ ìkọ̀ méjì ní Gíríìkì fi ìdánilójú líle hàn; ‘kì yóò ... láé’ mú agbára náà jáde ní Yorùbá àdánidá.
- source_word: ἀπόληται
  choice: ṣègbé
  rationale: ‘Ṣègbé’ lè túmọ̀ sí píparun tàbí sísọnù pátápátá, ó sì pa ọ̀wọ̀ àti ìṣòro ìtumọ̀ inú àyíká ọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ yìí dà bí ẹni pé ó ń tako àsọtẹ́lẹ̀ ìpànìyàn àti inúnibíni ní àwọn ẹsẹ tó sún mọ́ ọn.
  choice: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ìdánilójú tó lágbára, láì ṣàlàyé nínú ọ̀rọ̀ pàtàkì bóyá ìdáàbòbò ara tàbí ìpamọ́ níkẹyìn ni ó túmọ̀ sí.
  alternative: Kí a túmọ̀ ọ́ ní tààràtà gẹ́gẹ́ bí ìlérí pé kò sí ìpalára ara kankan tí yóò ṣẹlẹ̀.
  rationale: Àyíká ọ̀rọ̀ sọ pé a ó pa àwọn ọmọ-ẹ̀yìn kan; nítorí náà, ìtumọ̀ gbọ́dọ̀ pa ìforígbárí náà mọ́, kó má sì fi ìtumọ̀ ẹ̀kọ́ kan sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ṣègbé’ pa ìtumọ̀ àti ìforígbárí inú àyíká ọ̀rọ̀ mọ́.
