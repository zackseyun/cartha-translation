  text: By your endurance you will gain your lives[a][b].
translation:
  language: yo
  text: Nípa ìfaradà yín, ẹ jèrè ìyè yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ àbájáde, “Nípa ìfaradà yín, ẹ ó ní ìyè yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí àṣẹ.
    reason: grammatical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: ìfaradà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí dídúró ṣinṣin àti fífarada lábẹ́ ìpọ́njú. “Ìfaradà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ inúnibíni inú àyíká ẹsẹ̀ náà mu.
- source_word: κτήσασθε
  choice: ẹ ó jèrè
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ Gíríìkì jẹ́ àṣẹ, àyíká ọ̀rọ̀ náà lè fi èsì ọjọ́ iwájú hàn. “Ẹ ó jèrè” sọ èsì ìfaradà náà ní Yorùbá àdánidá; àṣẹ gẹ́gẹ́ bí ìrísí ọ̀rọ̀ náà wà nínú àlàyé [a].
- source_word: ψυχὰς
  choice: ẹ̀mí yín
  rationale: Nínú Yorùbá, “ẹ̀mí” lè tọ́ka sí ìyè ẹni, pàápàá nínú gbólóhùn bí “ẹ̀mí yín.” Èyí bá àyíká ewu, ikú, àti ìpamọ́ níkẹyìn mu láìfi ìtumọ̀ náà mọ́ apá àìrí ènìyàn nìkan.
- source_word: ἐν
  choice: nípa
  rationale: ἐν pẹ̀lú ọ̀rọ̀ ní ipò dative lè fi ọ̀nà tàbí ohun èlò hàn níbí. “Nípa” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ìfaradà ni ọ̀nà tí èsì náà fi dé.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú àyíká inúnibíni àti àwọn ohun ìkẹyìn
  choice: “ẹ̀mí” ní ìtumọ̀ ìyè ẹni lápapọ̀
  alternative: “ọkàn” tàbí “ara ẹni”
  rationale: Yíyan “ẹ̀mí yín” nínú àyíká yìí jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí ìyè àwọn ọmọ-ẹ̀yìn lápapọ̀, láìpinnu pé apá àìrí ènìyàn nìkan ni a ń sọ. Ó tún pa ìforígbárí tó wà láàárín ewu ikú ara àti ìpamọ́ níkẹyìn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní ni a lò. “Ẹ ó jèrè” jẹ́ àbájáde ọjọ́ iwájú tó bá àyíká mu, nígbà tí àlàyé [a] pa ìrísí àṣẹ Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
