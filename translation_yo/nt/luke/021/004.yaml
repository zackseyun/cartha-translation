  to: Nítorí gbogbo àwọn wọ̀nyí fi nínú ohun tí ó pọ̀ ju ohun tí wọ́n nílò ṣe ẹ̀bùn[a]; ṣùgbọ́n obìnrin yìí, nínú àìní rẹ̀[b], fi gbogbo ohun tí ó ní láti fi gbé ayé ṣe ẹ̀bùn[c].
  rationale: Àtúnṣe náà mú gbolohun περισσεύοντος di Yorùbá adayeba, ó pa ìyàtọ̀ àpọ̀jù/àìní mọ́, ó sì yọ àṣàyàn ẹsẹ̀ ìsàlẹ̀ tí kò pé “ọ̀rẹ́” kúrò. A ti pa “ẹ̀bùn” mọ́ fún δῶρα, a kò sì fi àpótí ìṣúra tàbí ìtumọ̀ míì tí orísun kò sọ kún un.
