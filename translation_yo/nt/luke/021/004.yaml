  - severity: high
    issue: Ẹsẹ̀ ìsàlẹ̀ a fún “ọ̀rẹ́” gẹ́gẹ́ bí àṣàyàn fún “ẹ̀bùn.”
    rationale: “Ọ̀rẹ́” ní Yorùbá boṣewa túmọ̀ sí friend, kì í ṣe donated gift/offerings; ó lè ṣì òǹkàwé lọ.
  - severity: low
    issue: “ohun ìgbẹ́mìíró” nínú ẹsẹ̀ ìsàlẹ̀ c kò wọ́pọ̀ bí “ohun ìgbẹ́ ayé.”
    rationale: “Ohun ìgbẹ́ ayé” ṣàfihàn βίος gẹ́gẹ́ bí ohun ìtìlẹ́yìn ìgbésí-ayé ní ọ̀nà tó mọ́gbọ́n dání.
