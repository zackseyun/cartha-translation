  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń mú ìyàtọ̀ pàtàkì tí ó wà láàárín ohun àpọ̀jù àwọn míì àti àìní obìnrin náà jáde dáadáa, ó sì tú πάντα τὸν βίον gẹ́gẹ́ bí ohun ìgbẹ́ ayé rẹ̀, kì í ṣe ìwàláàyè rẹ̀. Síbẹ̀, “fi lára àpọ̀jù ohun tí wọ́n ní ṣe ẹ̀bùn” kò rọrùn gan-an, ó sì lè dà bí pé àwọn ènìyàn náà ṣe ohun tí wọ́n ní fúnra rẹ̀ di ẹ̀bùn dípò kí wọ́n fi nínú àpọ̀jù wọn fúnni.
  naturalness: A lè sọ ọ́ ní Yorùbá òde òní tó rọrùn sí i pẹ̀lú “fi nínú ohun tí ó pọ̀ ju ohun tí wọ́n nílò ṣe ẹ̀bùn.” Èyí ń ṣàlàyé περισσεύοντος láìkọjá ohun tí orísun sọ, ó sì dá ìtakora pẹ̀lú “nínú àìní rẹ̀” dúró.
  terminology: “Ẹ̀bùn” yẹ fún δῶρα nínú àyíká yìí. Ṣùgbọ́n “ọ̀rẹ́” kì í ṣe àṣàyàn ìtumọ̀ tó pé fún δῶρα nínú ẹsẹ yìí; ó sábà ń túmọ̀ sí ẹni tí ó jẹ́ friend. A tún ṣàtúnṣe àlàyé βίος sí “ohun ìgbẹ́ ayé” fún èdè adayeba.
