id: LUK.21.4
reference: Luke 21:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: yo
  text: Nítorí gbogbo àwọn wọ̀nyí fi nínú ohun tí ó pọ̀ ju ohun tí wọ́n nílò ṣe ẹ̀bùn[a]; ṣùgbọ́n obìnrin yìí, nínú àìní rẹ̀[b], fi gbogbo ohun tí ó ní láti fi gbé ayé ṣe ẹ̀bùn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àwọn ẹ̀bùn.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn ẹ̀bùn,” ìyẹn àwọn ohun tí a fi fúnni ní àyíká tẹ́ńpìlì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú òṣì rẹ̀” tàbí “nínú ohun tí kò tó fún un.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn, gbogbo ohun ìgbẹ́ ayé rẹ̀, tàbí gbogbo ohun tí ó ní láti fi máa gbé; kò túmọ̀ sí gbogbo ìwàláàyè rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Nítorí gbogbo àwọn wọ̀nyí
  rationale: “Nítorí” pa ìbáṣepọ̀ àlàyé γάρ mọ́ pẹ̀lú ẹsẹ tó ṣáájú, “gbogbo àwọn wọ̀nyí” sì tú πάντες ... οὗτοι ní ọ̀nà Yorùbá àdánidá.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: lára àpọ̀jù ohun tí wọ́n ní
  rationale: Ó fi hàn pé ohun tí wọ́n fi fúnni jẹ́ apá kan lára ohun tó kù sí wọn lẹ́yìn àìní wọn, ó sì dá ìyàtọ̀ rẹ̀ pẹ̀lú àìní opó náà dúró.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: fi ... ṣe ẹ̀bùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ohun kan fúnni gẹ́gẹ́ bí ẹ̀bùn; ó pa ìtumọ̀ δῶρα mọ́ láìfi ‘àpótí ìṣúra tẹ́ńpìlì’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: αὕτη δὲ
  choice: ṣùgbọ́n obìnrin yìí
  rationale: Ó mú ìtakora δέ jáde, ó sì mú ẹni tí arọ́pò-orúkọ abo náà ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: nínú àìní rẹ̀
  rationale: “Àìní” bo ìtumọ̀ àìtó, ìṣòro tàbí ipò aláìní ti ὑστέρημα, ó sì yàtọ̀ kedere sí àpọ̀jù àwọn yòókù.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: gbogbo ohun tí ó ní láti fi gbé ayé
  rationale: Nínú àyíká ọ̀rọ̀ owó yìí, βίος túmọ̀ sí ohun ìgbé-ayé tàbí ohun tí ènìyàn fi ń gbé, kì í ṣe gbogbo ìwàláàyè rẹ̀. Gbólóhùn yìí ṣe ìtumọ̀ náà kedere fún òǹkàwé òde òní.
- source_word: ἔβαλεν
  choice: fi ... ṣe ẹ̀bùn
  rationale: Ìṣe fífi owó náà sílẹ̀ fún Ọlọ́run ni a sọ ní ọ̀nà Yorùbá tó rọrùn, láìsọ pé ó ju ú tàbí pé ó fi ìwàláàyè ara rẹ̀ fúnni.
theological_decisions:
- issue: Ìtumọ̀ βίος nínú ẹ̀bùn opó náà
  choice: Ohun tí ó ní láti fi gbé ayé
  alternative: Gbogbo ayé rẹ̀
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti fífi owó fúnni, βίος sì ń tọ́ka sí ohun ìgbẹ́mìíró tàbí ọ̀nà ìgbésí-ayé. “Gbogbo ayé rẹ̀” lè mú kí a rò pé ó fi ìwàláàyè rẹ̀ fúnni ní ti gidi.
- issue: Ohun tí τὰ δῶρα ń tọ́ka sí
  choice: Àwọn ẹ̀bùn
  alternative: Àwọn ọrẹ́; àpótí ìṣúra tẹ́ńpìlì
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí “àwọn ẹ̀bùn.” Àyíká ọ̀rọ̀ tẹ́ńpìlì fi irú ẹ̀bùn náà hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò pè é ní àpótí ìṣúra.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A lo “fi ... ṣe ẹ̀bùn” dípò àkójọpọ̀ ọ̀rọ̀ tí kò wọ́pọ̀ bí “fi sínú àwọn ẹ̀bùn,” kí ìtumọ̀ Gíríìkì lè dúró ní Yorùbá àdánidá.
