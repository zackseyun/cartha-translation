id: LUK.21.16
reference: Luke 21:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: yo
  text: Ṣùgbọ́n, àwọn òbí yín, àwọn arákùnrin yín, àwọn ìbátan yín àti àwọn ọ̀rẹ́ yín pàápàá ni yóò fi yín lé ọwọ́ àwọn ẹlòmíràn[a], wọn yóò sì pa àwọn kan nínú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin” tàbí “àwọn ọmọ ìyá kan náà,” nítorí pé akọ ọ̀pọ̀ Gíríìkì lè tọ́ka sí àwùjọ àwọn ọmọ ìyá ọkùnrin àti obìnrin nígbà míì.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: yóò fi yín lé àwọn aláṣẹ lọ́wọ́
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú tí ẹni mìíràn ń ṣe sí wọn, ó sì túmọ̀ sí fífi wọn lé àwọn alatakò tàbí àwọn aláṣẹ lọ́wọ́. Àfikún ‘àwọn aláṣẹ’ mú ìtumọ̀ náà ṣe kedere ní Yorùbá láì sọ ọ́ di ‘dà yín’ nìkan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ hàn láti inú ìdánilójú ẹsẹ tó ṣáájú sí ìkìlọ̀ yìí.
- source_word: καὶ
  choice: pàápàá
  rationale: 'καὶ àkọ́kọ́ níbí ní agbára ‘àní/even’: àwọn tó sún mọ́ wọn gan-an ni yóò fi wọ́n léni lọ́wọ́.'
- source_word: ὑπὸ
  choice: àwọn ... yín ... yóò
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe aláìṣe Gíríìkì, ὑπό tọ́ka sí àwọn tó ṣe ohun náà. Yorùbá àdánidá yí gbólóhùn náà sí ọ̀rọ̀ ìṣe olùṣe, tí àwọn òbí àti bẹ́ẹ̀ bẹ́ẹ̀ lọ jẹ́ olùṣe.
- source_word: γονέων
  choice: àwọn òbí
  rationale: Ó kó bàbá àti ìyá jọ gẹ́gẹ́ bí òbí.
- source_word: ἀδελφῶν
  choice: àwọn arákùnrin
  rationale: A pa akọ ọ̀pọ̀ Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́; akọsilẹ̀ ṣàlàyé pé ó tún lè tọ́ka sí àwọn ọmọ ìyá ọkùnrin àti obìnrin lápapọ̀.
- source_word: συγγενῶν
  choice: àwọn ìbátan
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ti òde òní, ó sì bo àwọn ẹni inú ẹbí tàbí ìran ní gbígbòòrò.
- source_word: φίλων
  choice: àwọn ọ̀rẹ́
  rationale: Ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ fún φίλων.
- source_word: θανατώσουσιν
  choice: wọn yóò ... pa
  rationale: Ó sọ ní kedere pé wọn yóò fa ikú àwọn kan; Yorùbá ‘pa’ jẹ́ àdánidá, ó sì pa ìwúwo ọ̀rọ̀ náà mọ́.
- source_word: ἐξ ὑμῶν
  choice: àwọn kan nínú yín
  rationale: Èyí ni ìtumọ̀ àdánidá ti àsọyé Gíríìkì náà, kì í ṣe pé gbogbo wọn ni a ó pa.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφῶν nínú àkójọ àwọn ìbátan
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn ọmọ ìyá
  rationale: Ọ̀rọ̀ pàtàkì pa akọ ọ̀pọ̀ inú Gíríìkì mọ́, ṣùgbọ́n a fi àlàyé sílẹ̀ nítorí pé nínú irú àkójọ ìbátan bẹ́ẹ̀, ó lè dúró fún àwọn ọmọ ìyá ti akọ àti abo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ìṣètò gbólóhùn olùṣe tí ó bá Yorùbá mu dípò pípa passive Gíríìkì mọ́ lọ́nà líle; ‘pàápàá’ pa agbára ascensive καὶ mọ́.
