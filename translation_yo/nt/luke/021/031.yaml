id: LUK.21.31
reference: Luke 21:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí àwọn nǹkan wọ̀nyí tí ń ṣẹlẹ̀[a], ẹ mọ̀ pé ìjọba Ọlọ́run[b] wà nítòsí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn nǹkan wọ̀nyí tí ń ṣẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìṣàkóso Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: Ó so ìlò àpẹẹrẹ tó ṣáájú pọ̀ mọ́ àwọn ọmọ-ẹ̀yìn, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς mọ́ nípa lílo “ẹ̀yin.”
- source_word: ὅταν ἴδητε
  choice: nígbà tí ẹ bá rí
  rationale: Ọ̀rọ̀ yìí fi ohun tí a ń retí lọ́jọ́ iwájú hàn; “nígbà tí … bá” jẹ́ ọ̀nà Yorùbá àdánidá fún un.
- source_word: ταῦτα γινόμενα
  choice: àwọn nǹkan wọ̀nyí tí ń ṣẹlẹ̀
  rationale: Ó tọ́ka sí àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe, ó sì mú ìtumọ̀ ohun tí ń ṣẹlẹ̀ ní àkókò náà jáde ní èdè òde òní.
- source_word: γινώσκετε
  choice: ẹ mọ̀
  rationale: Ó jẹ́ àṣẹ pé kí àwọn olùgbọ́ lóye àmì náà; “ẹ mọ̀” jẹ́ títọ́, ó sì ṣe kedere.
- source_word: ἐγγύς ἐστιν
  choice: wà nítòsí
  rationale: Ó pa àwòrán ìsúnmọ́ mọ́ láìfi ìtumọ̀ àkókò tàbí ìpele ìṣẹ̀lẹ̀ kan kún un.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀, tó sì lè ní ìtumọ̀ agbègbè ìjọba àti ìṣàkóso ọba, láìdín ọ̀rọ̀ náà kù sí ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ “ìjọba Ọlọ́run” nínú ọ̀rọ̀ nípa ohun ìkẹyìn
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ìjọba Ọlọ́run.”
  alternative: “ìṣàkóso Ọlọ́run” tàbí ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìmúṣẹ ìjọba náà ní ẹ̀kúnrẹ́rẹ́
  rationale: Ẹsẹ̀ náà kò sọ bóyá ìfarahàn, ìmúṣẹ ní ẹ̀kúnrẹ́rẹ́, tàbí ìdáláre ìjọba Ọlọ́run ló ní lọ́kàn. Ìtumọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi [a] sí lẹ́yìn gbólóhùn tó bá àṣàyàn γινόμενα mu, a sì fi [b] sí lẹ́yìn “ìjọba Ọlọ́run,” nítorí ibẹ̀ ni àwọn àlàyé ìsàlẹ̀ wọn tọ́ sí.
