source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: yo
  text: Ní ọ̀sán, ó máa ń kọ́ni ní tẹ́ńpìlì[a]; ní òru sì ni ó máa ń jáde lọ sùn lórí òkè tí a ń pè ní Òkè Ólífì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘láti lo òru níbẹ̀’; ọ̀rọ̀ náà tún lè túmọ̀ sí lílo òru ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: ó máa ń kọ́ni
  rationale: Ìṣọ̀kan imperfect ti εἰμί pẹ̀lú participle διδάσκων fi ìṣe tí ó ń ṣẹlẹ̀ déédéé hàn; ‘ó máa ń kọ́ni’ sọ ìṣe àṣà yìí ní Yorùbá àdánidá.
- source_word: τὰς ἡμέρας
  choice: ní ọ̀sán
  rationale: Ó dúró fún àkókò ọ̀sán, ó sì pa ìyàtọ̀ ọ̀sán àti òru mọ́ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gbígbòòrò náà mọ́.
- source_word: τὰς δὲ νύκτας
  choice: ní òru sì ni
  rationale: Gbólóhùn yìí mú ìyàtọ̀ tó wà láàárín ohun tí Jésù máa ń ṣe ní ọ̀sán àti ní òru hàn.
- source_word: ἐξερχόμενος
  choice: ó máa ń jáde lọ
  rationale: Particiṕle náà ṣàpèjúwe ìṣe tí ó máa ń tún ṣẹlẹ̀, ‘jáde lọ’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ηὐλίζετο
  choice: láti sùn mọ́jú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílo òru tàbí gbígbé sí ibìkan ní òru, ó sì lè tọ́ka sí dídúró ní gbangba; ‘sùn mọ́jú’ jẹ́ èdè Yorùbá tó ṣe kedere láì sọ irú ibùgbé náà pàtó.
- source_word: εἰς τὸ ὄρος
  choice: lórí òkè
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń fi ibi tí a ń lọ hàn, pẹ̀lú ọ̀rọ̀ lílo òru ó yọrí sí wíwà ní ibi náà; ‘lórí òkè’ bá èdè Yorùbá mu.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: tí a ń pè ní Òkè Ólífì
  rationale: Èyí ṣe orúkọ ibi náà ní ọ̀nà tí àwọn òǹkàwé Yorùbá mọ̀, ó sì pa ìtumọ̀ ‘Òkè àwọn igi ólífì’ mọ́.
