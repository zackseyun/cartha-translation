translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ohùn ni a lò níbi tí ó bá yẹ, a sì lo ‘máa ń’ láti fi ìṣe àṣà tí imperfect Gíríìkì ń sọ hàn.
