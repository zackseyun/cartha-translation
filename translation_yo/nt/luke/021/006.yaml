source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: yo
  text: Ní ti àwọn nǹkan wọ̀nyí tí ẹ̀ ń wò[a], àwọn ọjọ́ ń bọ̀ nígbà tí kò ní sí òkúta kan lórí òkúta mìíràn tí a kò ní wó lulẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn nǹkan wọ̀nyí tí ẹ̀ rí.” Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí “rí” lápapọ̀ tàbí “wò, kíyè sí” ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kò ní sí òkúta lórí òkúta tí a kò ní wó lulẹ̀”; ọ̀nà ọ̀rọ̀ yìí ń fi ìparun pátápátá hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Ní ti àwọn nǹkan wọ̀nyí tí ẹ̀ ń wò
  rationale: “Ní ti” fi ìtẹnumọ́ ọ̀rọ̀ tí a gbé síwájú hàn; “ẹ̀ ń wò” sì pa ìṣe tí ń lọ lọ́wọ́ àti ìdojúkọ ojú mọ́.
- source_word: ἐλεύσονται ἡμέραι
  choice: ọjọ́ ń bọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ìṣẹ̀lẹ̀ ọjọ́ iwájú kan dájú pé yóò dé.
- source_word: ἐν αἷς
  choice: nígbà tí
  rationale: Ó túmọ̀ ìbátan àkókò náà ní Yorùbá àdánidá láì yí ìtumọ̀ padà.
- source_word: οὐκ ἀφεθήσεται
  choice: a kò ní fi ... sílẹ̀
  rationale: Ìṣe aláìlórúkọ yìí pa ohùn àìsọ ẹni tó ṣe ìwópalẹ̀ mọ́, ó sì bá ọ̀rọ̀ ìwó ilé mu.
- source_word: λίθος ἐπὶ λίθῳ
  choice: òkúta kan ... lórí òmíràn
  rationale: Ọ̀rọ̀ yìí jẹ́ àpẹẹrẹ ìparun pátápátá, ó sì ṣe kedere ní Yorùbá.
- source_word: ὃς οὐ καταλυθήσεται
  choice: láì wó o lulẹ̀
  rationale: καταλύω ní àyíká ilé túmọ̀ sí píṣubú tàbí wíwó ohun tí a kọ́; “wó ... lulẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì lágbára.
theological_decisions:
- issue: Ìwọ̀n àti agbára àsọtẹ́lẹ̀ Jésù nípa àwọn ilé tẹ́ńpìlì
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àsọtẹ́lẹ̀ gidi nípa ìparun àwọn ohun tí a kọ́, láì fi ètò ẹ̀kọ́ ìgbà ìkẹyìn kankan kún un.
  alternative: Kí a ka a sí àpẹẹrẹ ìdájọ́ lásán tàbí kí a so ó mọ́ ètò ẹ̀kọ́ ìgbà ìkẹyìn kan pàtó.
  rationale: Gíríìkì náà sọ ní tààrà nípa àwọn ohun tí ojú ń rí tí a óò wó lulẹ̀, òkúta lẹ́yìn òkúta; ìtumọ̀ náà gbọ́dọ̀ pa agbára gidi yìí mọ́ láì ṣàfikún ẹ̀kọ́ tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Ẹ̀” ń bá ọ̀pọ̀ ènìyàn tí θεωρεῖτε ń tọ́ka sí mu; a yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn àkànṣe.
