id: LUK.21.26
reference: Luke 21:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: yo
  text: Àwọn ènìyàn yóò máa dákú nítorí ẹ̀rù àti ìfojúsọ́nà àwọn ohun tí ń bọ̀ sórí ayé tí ènìyàn ń gbé[a], nítorí àwọn agbára ọ̀run ni a ó mì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayé” tàbí “ilẹ̀ ayé”; ní Gíríìkì, “ayé tí ènìyàn ń gbé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn agbára àwọn ọ̀run” tàbí “àwọn agbára inú ọ̀run.” Gbólóhùn náà lè tọ́ka ní gbòòrò sí àwọn agbára àgbáyé tàbí ti ojú ọ̀run.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: yóò máa dákú
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí agbára tàbí ẹ̀mí ṣe ń tán lára ènìyàn nítorí ìbẹ̀rù. “Dákú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè fi ìṣubú ara àti ìrẹ̀wẹ̀sì ọkàn hàn láì sọ pé wọ́n kú.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ìtọ́kasí náà kan ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἀπὸ φόβου
  choice: nítorí ẹ̀rù
  rationale: ἀπό pẹ̀lú ọ̀rọ̀-orúkọ onígbẹ̀yìn ń tọ́ka sí ohun tó fa ìṣẹ̀lẹ̀ náà níbí; “nítorí ẹ̀rù” jẹ́ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ orísun mu.
- source_word: προσδοκίας
  choice: ìfojúsọ́nà
  rationale: Ó túmọ̀ sí dídúró de ohun tí ń bọ̀ tàbí fífi ojú sọ́nà fún un. Àyíká ẹsẹ̀ náà fi hàn pé ohun búburú ni wọ́n ń retí, ṣùgbọ́n a kò fi “àníyàn” tàbí “ìpayà” kún ọ̀rọ̀ Gíríìkì fúnra rẹ̀.
- source_word: τῶν ἐπερχομένων
  choice: àwọn ohun tí ń bọ̀
  rationale: Èyí pa ọ̀pọ̀ ohun tàbí ìṣẹ̀lẹ̀ mọ́ gẹ́gẹ́ bí participle aláìlórúkọ ọ̀pọ̀ ti orísun.
- source_word: τῇ οἰκουμένῃ
  choice: sórí ayé tí ènìyàn ń gbé
  rationale: οἰκουμένη ń tọ́ka sí gbogbo agbègbè ayé tí ènìyàn ń gbé tàbí àwùjọ aráyé, kì í ṣe ilẹ̀ gẹ́gẹ́ bí ohun àdánidá nìkan.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: àwọn agbára ọ̀run
  rationale: Gbólóhùn yìí dúró sítòsí orísun, ó sì pa àìdánilójú rẹ̀ mọ́ nípa bóyá ó ń tọ́ka sí agbára ojú ọ̀run, àwọn ohun inú ọ̀run, tàbí àwọn agbára ẹ̀mí.
- source_word: σαλευθήσονται
  choice: a ó mì
  rationale: Ìṣe ọ̀rọ̀ ọjọ́ iwájú tí a ṣe sí olùgbà ni; “a ó mì” ṣe àfihàn ìmì líle àti ìdàrúdàpọ̀ àgbáyé tó wà nínú àwòrán àsọtẹ́lẹ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ “àwọn agbára ọ̀run” nínú ọ̀rọ̀ àsọtẹ́lẹ̀ nípa òpin ayé
  choice: Pa gbólóhùn àìdánilójú náà mọ́ gẹ́gẹ́ bí “àwọn agbára ọ̀run.”
  alternative: “àwọn ohun alágbára inú ọ̀run” tàbí “àwọn ẹ̀dá alágbára ọ̀run”
  rationale: Ọ̀rọ̀ Gíríìkì lè fa àwòrán àwọn ìpìlẹ̀ àgbáyé, àwọn ìràwọ̀ àti ohun ojú ọ̀run, tàbí àwọn agbára ẹ̀mí jáde. Kíkọ ọ́ sí “àwọn agbára ọ̀run” kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye ni a lò. “Yóò máa dákú” mú ìṣe tó ń ṣẹlẹ̀ léraléra tàbí tó ń tàn ká mọ́; “ìfojúsọ́nà” sì yẹra fún fífi ìtumọ̀ rere “ìrètí” sí ohun ìbẹ̀rù tí àyíká náà ń sọ.
