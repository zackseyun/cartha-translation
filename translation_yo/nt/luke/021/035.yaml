source:
  edition: SBLGNT
  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: yo
  text: gẹ́gẹ́ bí ìdẹ̀kùn[a]; nítorí ọjọ́ náà yóò dé bá gbogbo àwọn tí ń gbé[b] lórí gbogbo ilẹ̀ ayé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ìdẹ̀kùn tí a fi okùn ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “gbogbo àwọn tí ó jókòó lórí gbogbo ilẹ̀ ayé”; ìdíòmù Gíríìkì náà ń tọ́ka sí àwọn tí ń gbé tàbí ń tẹ̀dó sí ilẹ̀ ayé.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gbogbo ilẹ̀ náà”; ṣùgbọ́n “gbogbo ilẹ̀ ayé” ló bá ìwọ̀n ọ̀rọ̀ yìí mu jù.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: bí ìdẹ̀kùn
  rationale: “Ìdẹ̀kùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a fi ń mú ẹranko tàbí ènìyàn láìròtẹ́lẹ̀; ó pa àwòrán ohun tí ń dé lójijì tí kò sì rọrùn láti bọ́ lọ́wọ́ rẹ̀ mọ́.
- source_word: ἐπεισελεύσεται
  choice: yóò dé bá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ohun kan yóò dé sórí tàbí bá àwọn ènìyàn lójijì. “Dé bá” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìkìlọ̀ inú àyíká ọ̀rọ̀ mu.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún ìkìlọ̀ tó ṣáájú; “nítorí” pa ìsopọ̀ ìdí náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐπὶ πάντας
  choice: bá gbogbo
  rationale: A so ἐπί mọ́ ọ̀rọ̀-ìṣe nípa lílo “dé bá,” èyí tó fi hàn pé ọjọ́ náà yóò dé sórí gbogbo wọn.
- source_word: τοὺς καθημένους
  choice: àwọn tí ń gbé
  rationale: Bí ó tilẹ̀ jẹ́ pé κάθημαι lè túmọ̀ sí “jókòó,” nínú gbólóhùn yìí ó jẹ́ àṣà-ìsọ̀rọ̀ fún àwọn tó ń gbé tàbí ń tẹ̀dó sí ibì kan.
- source_word: ἐπὶ πρόσωπον
  choice: ní ojú
  rationale: “Ní ojú ... ilẹ̀ ayé” pa àwòrán ojú tàbí orí ilẹ̀ mọ́, ó sì jẹ́ àṣà-ìsọ̀rọ̀ Bíbélì tí a lè lóye ní Yorùbá.
- source_word: πάσης τῆς γῆς
  choice: gbogbo ilẹ̀ ayé
  rationale: γῆ lè jẹ́ “ilẹ̀” tàbí “ilẹ̀ ayé.” Nínú ìkìlọ̀ tó kan gbogbo àwọn olùgbé rẹ̀, “gbogbo ilẹ̀ ayé” ló bá ìwọ̀n gbólóhùn náà mu jù.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ γῆ nínú ìkìlọ̀ nípa ọjọ́ tó ń bọ̀
  choice: gbogbo ilẹ̀ ayé
  alternative: gbogbo ilẹ̀ náà
  rationale: γῆ lè tọ́ka sí ilẹ̀ agbègbè kan tàbí sí gbogbo ayé. Ìsọ̀rọ̀ “gbogbo àwọn tí ń gbé ní ojú” rẹ̀ ṣe àtìlẹ́yìn fún ìtumọ̀ tó kárí ayé, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ìtumọ̀ “ilẹ̀ náà” tún ṣeé ṣe.
- issue: Olùṣe tí a kò sọ ní tààrà nínú ἐπεισελεύσεται
  choice: ọjọ́ náà
  alternative: ó
  rationale: Ọ̀rọ̀ Gíríìkì kò tún sọ kókó-ọ̀rọ̀ náà nínú ẹsẹ yìí, ṣùgbọ́n “ọjọ́ náà” nínú ẹsẹ tó ṣáájú ni olùṣe tí àyíká ọ̀rọ̀ tọ́ka sí. Fífi “ọjọ́ náà” sínú Yorùbá mú ìtumọ̀ gírámà ṣe kedere láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “dé bá” dípò ìtumọ̀ líle bí “wọlé dé sórí,” a sì pa àwòrán Bíbélì “ní ojú gbogbo ilẹ̀ ayé” mọ́.
