id: LUK.21.10
reference: Luke 21:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: yo
  text: Nígbà náà, ó sọ fún wọn pé, “Orílẹ̀-èdè yóò dìde sí orílẹ̀-èdè, ìjọba yóò sì dìde sí ìjọba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àsìkò tó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú, ó sì bá Yorùbá àdánidá mu.
- source_word: ἔλεγεν
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ imperfect, ‘ó sọ’ ni ọ̀nà àdánidá láti fi ṣí ọ̀rọ̀ tààrà nínú ìtàn Yorùbá láìfi ìtumọ̀ àfikún kún aspect rẹ̀.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí fi indirect object hàn ní Yorùbá àdánidá.
- source_word: Ἐγερθήσεται
  choice: yóò dìde sí
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ ogun yìí, ‘dìde sí’ túmọ̀ sí gbé ara dìde lòdì sí ẹlòmíràn, ó sì yẹra fún ìtumọ̀ líle ti passive pé ẹnì kan ni ó gbé e dìde.
- source_word: ἔθνος
  choice: orílẹ̀-èdè
  rationale: Nínú àyíká ìṣèlú àti ogun yìí, ọ̀rọ̀ náà ń tọ́ka sí orílẹ̀-èdè tàbí àwùjọ ènìyàn gẹ́gẹ́ bí ẹgbẹ́ ìṣèlú.
- source_word: ἐπ’ ἔθνος
  choice: sí orílẹ̀-èdè
  rationale: Pẹ̀lú ‘dìde,’ preposition náà ń fi ìkọlù tàbí àtakò hàn; ‘dìde sí’ jẹ́ àdánidá ní Yorùbá.
- source_word: βασιλεία
  choice: ìjọba
  rationale: Níhìn-ín ó ń tọ́ka sí agbègbè tàbí ilẹ̀ tí ọba ń ṣàkóso, kì í ṣe àṣẹ ọba ní àfojúsùn àìrí.
- source_word: ἐπὶ βασιλείαν
  choice: sí ìjọba
  rationale: Àtúnṣe ìlà náà pa ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́, ó sì fi àtakò láàárín àwọn ìjọba hàn.
theological_decisions:
- issue: Àpẹẹrẹ ìjà nínú àsọtẹ́lẹ̀ nípa ohun tó ń bọ̀
  choice: Túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí àsọtẹ́lẹ̀ tààrà nípa ìjà láàárín àwọn orílẹ̀-èdè àti àwọn ìjọba.
  alternative: Kà á sí ohun tó ń tọ́ka sí ìparun Jerúsálẹ́mù nìkan, tàbí sí àkójọ àsìkò pípé fún òpin ayé.
  rationale: Ẹsẹ yìí fúnra rẹ̀ sọ pé orílẹ̀-èdè àti ìjọba yóò dìde sí ara wọn; kò pinnu ètò ẹ̀kọ́ kan pàtó nípa àwọn ìṣẹ̀lẹ̀ òpin.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A kò fi àmì àlàyé [a] sí i nítorí àṣàyàn ‘dìde sí’ ti bo ìtumọ̀ lexical náà, kò sì sí àṣàyàn Yorùbá míì tó yẹ kí a fi hàn lọ́tọ̀ nínú ẹsẹ yìí.
