    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
