  language: yo
  text: Nígbà tí àwọn kan ń sọ̀rọ̀ nípa tẹ́ńpìlì náà[b], pé a ti fi àwọn òkúta ẹlẹ́wà àti àwọn ẹ̀bùn tí a yà sí mímọ́[a] ṣe é lọ́ṣọ̀ọ́, ó ní,
  philosophy: optimal-equivalence
  footnotes:
