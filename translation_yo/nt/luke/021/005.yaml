lexical_decisions:
- source_word: τινων λεγόντων
  choice: Nígbà tí àwọn kan ń sọ̀rọ̀
  rationale: Gbólóhùn àyíká oníjẹ́nítífù náà ń fi ohun tó ń ṣẹlẹ̀ ní àkókò kan náà hàn; ìtumọ̀ yìí bójú mu ní Yorùbá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: τοῦ ἱεροῦ
  choice: nípa tẹ́ńpìlì náà
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tí àlàyé ìsàlẹ̀ ojú ìwé sì ń mú ìwọ̀n ìtumọ̀ rẹ̀ ṣe kedere.
- source_word: λίθοις καλοῖς
  choice: àwọn òkúta ẹlẹ́wà
  rationale: Ẹlẹ́wà sọ bí àwọn òkúta náà ṣe dára tó, ó sì jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἀναθήμασιν
  choice: àwọn ẹ̀bùn tí a yà sí mímọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀bùn tí a fi fún Ọlọ́run, tí a sì gbé kalẹ̀ ní tẹ́ńpìlì. Yíya wọn “sí mímọ́” ṣe àfihàn ìyàsọ́tọ̀ wọn láì lo ọ̀rọ̀ ìmọ̀-ẹ̀sìn tó ṣòro.
- source_word: κεκόσμηται
  choice: bí a ti ... ṣe é lọ́ṣọ̀ọ́
  rationale: Ìṣe aláṣepé aláìṣe náà fi hàn pé iṣẹ́ ọ̀ṣọ́ ti parí, àbájáde rẹ̀ sì ṣì dúró. “A ti ... ṣe é lọ́ṣọ̀ọ́” pa ìtumọ̀ ipò-àbájáde yìí mọ́ ní Yorùbá àdánidá.
- source_word: εἶπεν
  choice: ó ní
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì kò pe orúkọ Jésù ní tààrà; “ó ní” pa ìṣàn ọ̀rọ̀ àti àìsọ orúkọ náà mọ́.
