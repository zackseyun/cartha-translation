id: LUK.21.12
reference: Luke 21:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: yo
  text: Ṣùgbọ́n ṣáájú gbogbo nǹkan wọ̀nyí, wọn yóò gbé ọwọ́ wọn lé yín[a], wọn yóò sì ṣe inúnibíni sí yín. Wọn yóò fi yín lé àwọn sínágọ́gù àti àwọn ọgbà ẹ̀wọ̀n lọ́wọ́, wọn yóò mú yín lọ síwájú àwọn ọba àti àwọn gómìnà nítorí orúkọ mi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọn yóò mú yín.” Gíríìkì sọ ní tààrà pé, “wọn yóò gbé ọwọ́ wọn lé yín”; ọ̀nà àsọyé ni èyí fún mímú ẹni pẹ̀lú ìkórìíra tàbí fífi ipá bá a lò.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “nítorí orúkọ mi” sí “nítorí ti orúkọ mi,” tàbí, ní ọ̀nà tí ó túmọ̀ sí i síwájú sí i, “nítorí mi.” Ọ̀rọ̀ inú ẹsẹ náà pa àsọyé Bíbélì mọ́, èyí tí ó so orúkọ Jésù pọ̀ mọ́ ẹni rẹ̀ àti àṣẹ rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Ṣùgbọ́n ṣáájú gbogbo nǹkan wọ̀nyí
  rationale: “Ṣáájú” fi ìtumọ̀ àkókò πρό pẹ̀lú ọ̀rọ̀-orúkọ inú ẹ̀ka hàn; “gbogbo nǹkan wọ̀nyí” sì pa agbára πάντων mọ́. “Ṣùgbọ́n” fi ìyípadà tàbí ìyàtọ̀ tí δέ ń tọ́ka sí hàn.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: wọn yóò gbé ọwọ́ wọn lé yín
  rationale: Èyí pa àwòrán gidi ti Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó jẹ́ ọ̀nà àsọyé fún mímú ẹni tàbí fífi ipá bá a lò.
- source_word: διώξουσιν
  choice: wọn yóò sì ṣe inúnibíni sí yín
  rationale: Nínú àyíká ìtakò sí àwọn ọmọ-ẹ̀yìn, διώκω túmọ̀ sí ṣíṣe inúnibíni, kì í ṣe lílépa lásán.
- source_word: παραδιδόντες
  choice: Wọn yóò fi yín lé … lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi ọ̀nà tí inúnibíni náà yóò gbà ṣẹlẹ̀ hàn, ó sì pa ìtumọ̀ fífi ẹni lé àṣẹ tàbí ìdájọ́ àwọn mìíràn lọ́wọ́ mọ́.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: àwọn sínágọ́gù àti àwọn ọgbà ẹ̀wọ̀n
  rationale: A pa orúkọ ilé-iṣẹ́ ẹ̀sìn náà mọ́ gẹ́gẹ́ bí “sínágọ́gù,” láì túmọ̀ ọ́ sí àwọn aláṣẹ inú rẹ̀; “ọgbà ẹ̀wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ibi ìhámọ́.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: wọn yóò mú yín lọ síwájú àwọn ọba àti àwọn gómìnà
  rationale: “Mú … lọ síwájú” fi ìgbésẹ̀ fífi ipá mú wọn àti ìfarahàn níwájú àwọn aláṣẹ fún ìdájọ́ hàn.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: nítorí orúkọ mi
  rationale: Èyí pa àsọyé Bíbélì “orúkọ mi” mọ́, èyí tí ó so orúkọ Jésù pọ̀ mọ́ ẹni rẹ̀ àti àṣẹ rẹ̀, láì sọ ọ́ di “nítorí mi” nìkan.
theological_decisions:
- issue: Ìtumọ̀ “orúkọ mi” nínú àyíká inúnibíni
  choice: nítorí orúkọ mi
  alternative: nítorí mi; nítorí pé ẹ̀yin jẹ́ ti tèmi
  rationale: Dídá “orúkọ mi” sílẹ̀ pa ìtumọ̀ àti ìwúwo ọ̀rọ̀ Bíbélì mọ́ nípa ẹni Jésù, àṣẹ rẹ̀, àti jíjẹ́wọ́ rẹ̀, láì fi ìtumọ̀ ẹ̀kọ́ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò; a pa àwọn àwòrán àti àsọyé pàtàkì inú Gíríìkì mọ́ níbi tí Yorùbá ti lè gbà wọ́n.
