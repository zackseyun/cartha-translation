  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: yo
  text: Gbogbo ènìyàn yóò sì kórìíra yín nítorí orúkọ mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí mi.” Ọ̀rọ̀ náà “orúkọ mi” lè tọ́ka sí ẹni tí Jésù jẹ́, àṣẹ rẹ̀, àti jíjẹ́wọ́ ìfaramọ́ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: yóò kórìíra yín
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú àti participle passive náà túmọ̀ sí pé àwọn míì yóò máa kórìíra àwọn ọmọ-ẹ̀yìn. Èdè Yorùbá àdánidá sábà máa ń lo active tí ohun tí ìṣe náà dé bá jẹ́ object, dípò passive aláìlẹ́sẹ̀.
- source_word: ὑπὸ πάντων
  choice: gbogbo ènìyàn
  rationale: ὑπό pẹ̀lú genitive fi ẹni tó ṣe ìṣe hàn; πάντων ní agbára gbígbòòrò, ‘gbogbo ènìyàn.’ Gbigbe e sí iwájú mú kí gbolohun Yorùbá active náà ṣe kedere.
- source_word: διὰ
  choice: nítorí
  rationale: διά pẹ̀lú accusative ń sọ ìdí tàbí ohun tó fa nǹkan; ‘nítorí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu.
- source_word: τὸ ὄνομά μου
  choice: orúkọ mi
  rationale: Ìtumọ̀ tààrà yìí pa ìjìnlẹ̀ ọ̀rọ̀ ‘orúkọ’ mọ́, èyí tó lè tọ́ka sí ẹni tí Jésù jẹ́, àṣẹ rẹ̀, àti jíjẹ́wọ́ ìfaramọ́ sí i.
theological_decisions:
- issue: Ìtumọ̀ ‘orúkọ mi’ nínú ọ̀rọ̀ inúnibíni sí ọmọ-ẹ̀yìn
  choice: orúkọ mi
  alternative: nítorí mi / nítorí pé ẹ jẹ́ tiẹ̀
  rationale: Èdè Gíríìkì sọ ní pàtó pé ‘nítorí orúkọ mi.’ Pípa ọ̀rọ̀ náà mọ́ kò dín ìtumọ̀ rẹ̀ kù sí apá kan ṣoṣo, ó sì fi àjọṣe rẹ̀ pẹ̀lú ẹni tí Jésù jẹ́, àṣẹ rẹ̀, àti jíjẹ́wọ́ rẹ̀ sílẹ̀.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo active construction àdánidá ní Yorùbá láti sọ passive Gíríìkì, láìyí ẹni tó ṣe ìṣe tàbí ẹni tí ìṣe náà dé bá padà. Àwọn àmì ohùn wà níbi tó yẹ.
