id: LUK.21.21
reference: Luke 21:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: yo
  text: Nígbà náà, kí àwọn tí ó wà ní Jùdíà sá lọ sí àwọn òkè; kí àwọn tí ó wà ní àárín rẹ̀[a] jáde kúrò, kí àwọn tí ó sì wà ní ìgbèríko má wọ inú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rẹ̀” ní ibi méjèèjì ń tọ́ka sí Jerúsálẹ́m, tí a mẹ́nu kàn ní ẹsẹ ṣáájú.
    reason: referent_clarification
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé àṣẹ yìí tẹ̀ lé àmì tí a ṣẹ̀ṣẹ̀ sọ ní ẹsẹ ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: àwọn tí ó wà ní Jùdíà
  rationale: Ó tọ́ka sí àwọn ènìyàn tí wọ́n wà ní agbègbè Jùdíà láìfi ìtumọ̀ míì kún un.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: kí ... sá lọ sí àwọn òkè
  rationale: Ìṣètò ‘kí’ pa agbára àṣẹ ẹni-kẹta mọ́; ‘sá lọ’ sì mú ìkìlọ̀ pajawiri náà yé kedere.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: àwọn tí ó wà ní àárín rẹ̀
  rationale: ‘Ní àárín rẹ̀’ tẹ̀ lé ọ̀rọ̀ orísun, kò sì fi orúkọ Jerúsálẹ́m sí ibi tí kò ti tún farahàn nínú ẹsẹ náà.
- source_word: ἐκχωρείτωσαν
  choice: kí ... jáde kúrò
  rationale: Ó sọ ìyọkúrò tàbí fífi ibi kan sílẹ̀ ní Yorùbá àdánidá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: οἱ ἐν ταῖς χώραις
  choice: àwọn tí ó ... wà ní ìgbèríko
  rationale: Nínú àyíká yìí, χώραι túmọ̀ sí àwọn ibi ìta ìlú tàbí ìgbèríko, kì í ṣe oko tí a ń rò nikan.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: kí ... má wọ inú rẹ̀
  rationale: Ó fi ìfòfindè àṣẹ Gíríìkì hàn ní kedere, ó sì jẹ́ gbólóhùn Yorùbá tí ó rọrùn láti lóye.
theological_decisions:
- issue: Ohun tí αὐτῆς àti αὐτήν ń tọ́ka sí
  choice: Lo ‘rẹ̀’ kí àlàyé ìsàlẹ̀ ojú ìwé sì sọ pé Jerúsálẹ́m ni ó ń tọ́ka sí.
  alternative: Tún ‘rẹ̀’ ṣe sí ‘Jerúsálẹ́m’ tàbí ‘ìlú náà’ nínú ọ̀rọ̀ pàtàkì.
  rationale: Àyíká ẹsẹ 20 fi hàn pé Jerúsálẹ́m ni ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí. Síbẹ̀, fífi ‘rẹ̀’ sílẹ̀ pa ìṣètò ọ̀rọ̀ orísun àti ìtọ́kasí rẹ̀ mọ́ láìfi orúkọ tí a kò tún sọ nínú ẹsẹ yìí kún un. Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀,’ nítorí náà àlàyé ìsàlẹ̀ ojú ìwé ni ó ń mú ẹni tí a ń tọ́ka sí ṣe kedere.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n àdánidá ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; ìṣètò ‘kí ...’ pa àwọn àṣẹ ẹni-kẹta mẹ́tẹ̀ẹ̀ta mọ́, àwọn àmì àárín gbólóhùn sì mú ìbádọ́gba wọn hàn.
