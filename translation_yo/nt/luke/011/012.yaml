  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: yo
  text: Tàbí, bí ó bá béèrè fún ẹyin, ṣé yóò fún un ní àkekèé?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Tàbí bí
  rationale: Ó ń mú àpẹẹrẹ tó tẹ̀ lé e wọ inú ìbéèrè àsọyé; “Tàbí bí” jẹ́ ọ̀nà àdánidá ní Yorùbá láìfi καί kún un ju bó ṣe yẹ lọ.
- source_word: αἰτήσει
  choice: ó bá béèrè
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ṣiṣẹ́ bí ipò nínú ìbéèrè àsọyé; “ó bá béèrè” fi èrò yẹn hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: ᾠόν
  choice: ẹyin
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe tààrà fún ohun tí a ń pè ní egg.
- source_word: ἐπιδώσει
  choice: ṣé yóò fún
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífún ẹni ní ohun tí ó béèrè; ìtumọ̀ yìí bá ìbéèrè àsọyé ọjọ́ iwájú mu.
- source_word: αὐτῷ
  choice: un
  rationale: Arọ́pò-orúkọ náà ni olùgbà ohun; Yorùbá fi í hàn lọ́nà àdánidá nínú “fún un.”
- source_word: σκορπίον
  choice: àkekèé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún scorpion, ó sì pa ìyàtọ̀ tó lágbára láàárín ẹyin àti ẹranko olóró náà mọ́.
theological_decisions:
- issue: Agbára ìbéèrè àsọyé nínú àfiwé bàbá àti ọmọ
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìbéèrè àsọyé tó ṣe tààrà, láìfikún àlàyé ìtumọ̀.
  alternative: Kí a fi ọ̀rọ̀ bí “dípò rẹ̀” kún un láti sọ ìyàtọ̀ náà di gbangba sí i.
  rationale: Gíríìkì fi ìyàtọ̀ aláìgbọ́gbọ́n náà sílẹ̀ ní àfihàn; Yorùbá náà lè jẹ́ kí olùkà lóye rẹ̀ láìsí àfikún, èyí sì pa kókó nípa ìwà rere Baba mọ́ láìṣe àlàyé àfikún.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́wọ̀ àti kedere ni a lò. “Ṣé” mú kí ìbéèrè àsọyé náà dun bí Yorùbá àdánidá, nígbà tí “yóò” pa ìtọ́kasí ọjọ́ iwájú mọ́.
