  to: Ṣùgbọ́n ó wí pé, “Kàkà bẹ́ẹ̀, ìbùkún ni fún àwọn tí ń gbọ́ ọ̀rọ̀ Ọlọ́run, tí wọ́n sì ń pa á mọ́.”[a]
