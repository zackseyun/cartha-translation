language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: yo
  text: Ṣùgbọ́n ó wí pé, “Kàkà bẹ́ẹ̀, ìbùkún ni fún àwọn tí ń gbọ́ ọ̀rọ̀ Ọlọ́run, tí wọ́n sì ń pa á mọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní tòótọ́, ìbùkún ni fún àwọn …” tàbí, “Bẹ́ẹ̀ ni, kàkà bẹ́ẹ̀, ìbùkún ni fún àwọn …” Ọ̀rọ̀ kékeré Gíríìkì náà lè mú ohun tí a sọ tẹ́lẹ̀ dájú, nígbà tí ó sì ń darí ìtẹnumọ́ sí ibòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó ń yí ìtẹnumọ́ ọ̀rọ̀ obìnrin náà padà, láì sọ pé ohun tí ó sọ jẹ́ irọ́ pátápátá. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì náà tún lè ní agbára ìfẹ̀sí àti ìmúdájú.
- source_word: μακάριοι
  choice: alábùkún-fún
  rationale: Ó pa ìtumọ̀ ìbùkún Ọlọ́run mọ́, ó sì yẹ fún ọ̀rọ̀ Jesu ju ọ̀rọ̀ tí yóò túmọ̀ sí ayọ̀ inú tàbí oríire lásán lọ.
- source_word: οἱ ἀκούοντες
  choice: àwọn tí ń gbọ́
  rationale: Àpólà aṣáájú-ọ̀rọ̀ ìsinsìnyí náà ń tọ́ka sí àwọn ẹni tí fífetísílẹ̀ sí ọ̀rọ̀ Ọlọ́run jẹ́ ìwà wọn déédéé; “àwọn tí ń gbọ́” jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó lè tọ́ka sí ìhìn tàbí ìṣípayá tí ó ti ọ̀dọ̀ Ọlọ́run wá, ó sì pa fífẹ̀ ìtumọ̀ λόγος àti ìró Bíbélì mọ́.
- source_word: φυλάσσοντες
  choice: ń pa á mọ́
  rationale: Ọ̀rọ̀ náà ní èrò pípa ohun mọ́, ṣíṣọ́ ọ, àti ṣíṣe gẹ́gẹ́ bí ó ti wí. “ń pa á mọ́” gba gbogbo ìtumọ̀ wọ̀nyí láàyè, dípò kí ó dín un kù sí ṣíṣe àṣẹ nìkan.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Ṣùgbọ́n ó wí pé
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ kékeré sí ọ̀rọ̀ tí ó ṣáájú hàn, nígbà tí “ó wí pé” dúró nítòsí ìtumọ̀ εἶπεν, ó sì bá ìforúkọsílẹ̀ ọlọ́lá mu.
theological_decisions:
- issue: Agbára ìdáhùn Jesu sí ìkéde ìbùkún obìnrin náà
  choice: Jesu yí ìtẹnumọ́ náà sí ìbùkún tòótọ́ ti gbígbọ́ ọ̀rọ̀ Ọlọ́run àti pípa á mọ́, láì sọ ní tààrà pé ìyá rẹ̀ kò ní ìbùkún.
  alternative: A lè ka ọ̀rọ̀ náà bí kíkọ ohun tí obìnrin náà sọ sílẹ̀ pátápátá, tàbí bí fífi ìbùkún mìíràn kún un láì ṣe àtúnṣe kankan.
  rationale: Μενοῦν lè mú ohun tí a ṣẹ̀ṣẹ̀ sọ dájú, kí ó sì tún darí ìtẹnumọ́ rẹ̀. “Kàkà bẹ́ẹ̀” pẹ̀lú àlàyé ìsàlẹ̀ pa ìfọ̀kànbalẹ̀ àti ìṣòro ìtumọ̀ yìí mọ́ láì yanjú rẹ̀ ní ẹ̀gbẹ́ ìlànà ẹ̀kọ́ kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ ti ẹ̀dá. “Pa ọ̀rọ̀ mọ́” jẹ́ àpólà àdánidá tí ó lè ní gbígbọ́ràn nínú láì sọ ìtumọ̀ náà di gbígbọ́ràn sí òfin nìkan.
