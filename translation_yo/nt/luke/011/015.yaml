  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: “àwọn kan nínú wọn” ṣàfihàn τινὲς ... ἐξ αὐτῶν; “Ṣùgbọ́n” yẹ fún δέ ní àyíká ìtakora; “nípasẹ̀” mú ipa irinṣẹ́/àṣẹ inú ἐν hàn; “olórí àwọn ẹ̀mí èṣù” sì jẹ́ ìtumọ̀ kedere fún τῷ ἄρχοντι τῶν δαιμονίων. “Lé ... jáde” túmọ̀ ἐκβάλλει dáadáa nínú àyíká kíkó ẹ̀mí èṣù jáde.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa, ó sì ní ìforúkọsílẹ̀ tó bójú mu fún ọ̀rọ̀ ìtàn inú Ìwé Mímọ́. Ìdàkọ́kọ́ “Nípasẹ̀ ... ni ó fi ń lé ... jáde” jẹ́ ìlò tí ó ṣeé gbọ́, ó sì ṣàfihàn ẹ̀sùn àwọn agbẹnusọ náà kedere.
  terminology: “Ẹ̀mí èṣù” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì bójú mu fún δαιμόνια. “Olórí” yẹ fún ἄρχων láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ìpínlẹ̀ àṣẹ tó ju ohun tí ẹsẹ̀ sọ lọ kún un. “Béélísébúlù” tẹ̀lé Βεελζεβούλ, àlàyé ìsàlẹ̀ sì tọ́ka sí ìrísí ìbílẹ̀ Béélísébúbù ní ọ̀nà tó pé.
