id: LUK.11.15
reference: Luke 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan nínú wọn sọ pé, “Nípasẹ̀ Béélísébúlù[a], olórí àwọn ẹ̀mí èṣù, ni ó fi ń lé àwọn ẹ̀mí èṣù jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìrísí ìbílẹ̀ mìíràn ti orúkọ yìí ni “Béélísébúbù”; “Béélísébúlù” tẹ̀lé ọ̀rọ̀ Gíríìkì níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ṣùgbọ́n àwọn kan nínú wọn
  rationale: “Àwọn kan” fi àìdánimọ̀ ẹgbẹ́ kékeré náà hàn, “nínú wọn” sì pa ìtumọ̀ apá lára gbogbo mọ́. “Ṣùgbọ́n” fi ìtakora sí ìhùwàpadà rere inú àyíká ẹsẹ náà hàn.
- source_word: εἶπον
  choice: sọ pé
  rationale: Ó túmọ̀ aorist náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ kan ṣoṣo, ó sì jẹ́ ọ̀nà àdánidá láti mú ọ̀rọ̀ tí a fa yọ wọlé ní Yorùbá.
- source_word: Ἐν Βεελζεβοὺλ
  choice: Nípasẹ̀ Béélísébúlù
  rationale: “Nípasẹ̀” sọ ipa ẹni tàbí ọ̀nà tí ẹ̀sùn náà ní lọ́kàn di mímọ̀ láìfi “agbára” tí kò fara hàn ní tààrà sínú ọ̀rọ̀ náà. “Béélísébúlù” tẹ̀lé ìrísí orúkọ Gíríìkì.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: olórí àwọn ẹ̀mí èṣù
  rationale: “Olórí” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ẹni tó ń ṣàkóso; ó yẹra fún fífi ètò ẹ̀kọ́ nípa àwọn ẹ̀mí èṣù tí ẹsẹ náà kò sọ kún un.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ni ó fi ń lé àwọn ẹ̀mí èṣù jáde
  rationale: “Lé … jáde” mú ìtumọ̀ ìmúkúrò tàbí ìléjáde ẹ̀mí èṣù jáde ní Yorùbá àdánidá. Ẹ̀yà “ni ó fi ń” so ọ̀nà tí a mẹ́nu kàn mọ́ iṣẹ́ náà, ó sì bá ìlànà gbólóhùn Yorùbá mu.
theological_decisions:
- issue: Ìrísí orúkọ Βεελζεβούλ
  choice: Béélísébúlù
  alternative: Béélísébúbù
  rationale: Ọ̀rọ̀ pàtàkì tẹ̀lé ìrísí Βεελζεβούλ nínú ẹ̀dà Gíríìkì SBLGNT. Ìrísí ìbílẹ̀ tó mọ̀ sí ọ̀pọ̀ ènìyàn wà nínú àlàyé ìsàlẹ̀ láìròyìn pé àwọn méjèèjì bá ẹ̀rí orísun mu bákan náà.
- issue: Ìtumọ̀ ἄρχων
  choice: olórí àwọn ẹ̀mí èṣù
  alternative: ọba àwọn ẹ̀mí èṣù
  rationale: “Olórí” fi ipò àṣẹ hàn láìsọ pé ó jẹ́ ọba ní ìtumọ̀ gangan tàbí láìgbé ẹ̀kọ́ àfikún nípa ètò àwọn ẹ̀mí èṣù wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A ṣe orúkọ Gíríìkì náà mu bá ìró àti àkọtọ Yorùbá mu, a sì yẹra fún lẹ́tà “z” tí kì í ṣe ara álífábẹ́ẹ̀tì Yorùbá boṣewa.
