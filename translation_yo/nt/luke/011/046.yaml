language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: yo
  text: Ṣùgbọ́n ó wí pé, “Ègbé pẹ̀lú ni fún yín, ẹ̀yin amòye nínú Òfin[a], nítorí ẹ ń fi ẹrù tí ó ṣòro láti gbé lé àwọn ènìyàn lórí, ẹ̀yin fúnra yín kò sì fi ìka kan nínú àwọn ìka yín kan àwọn ẹrù náà.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni àwọn ògbógi nínú Òfin àwọn Júù, kì í ṣe àwọn agbẹjọ́rò bí ti òde òní.
    reason: lexical_alternative
  - marker: b
    text: Àpèjúwe náà lè túmọ̀ sí, “ẹ kò tilẹ̀ gbé ìka kan láti ran wọn lọ́wọ́.” Ó tẹnu mọ́ ọn pé wọn kò ṣe ìsapá kankan láti ran àwọn tí wọ́n fi ẹrù lé lórí lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: àwọn amòye nínú Òfin
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ó mọ Òfin àwọn Júù jinlẹ̀, kì í ṣe àwọn agbẹjọ́rò ìgbà òde òní. Ìtumọ̀ yìí ṣe ẹni tí a ń sọ̀rọ̀ sí kedere ní Yorùbá.
- source_word: οὐαί
  choice: Ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àti ìkìlọ̀ àsọtẹ́lẹ̀ mọ́, dípò kí ó sọ ọ́ di ọ̀rọ̀ ìbànújẹ́ lásán.
- source_word: φορτίζετε
  choice: ẹ ń di ẹrù ... lé ... lórí
  rationale: Ó pa àwòrán fífi ẹrù lé ènìyàn lórí mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà ní Yorùbá.
- source_word: ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà kan ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: φορτία δυσβάστακτα
  choice: ẹrù tí ó ṣòro láti gbé
  rationale: Ó túmọ̀ sí ẹrù tí gbígbé rẹ̀ nira; kò sọ pé kò ṣeé gbé rárá. Ìtumọ̀ yìí pa ìwọ̀n ọ̀rọ̀ orísun mọ́.
- source_word: αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: Ó mú ìtẹnumọ́ àti ìyàtọ̀ láàárín àwọn amòye Òfin àti àwọn ènìyàn tí wọ́n di ẹrù lé lórí hàn.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: ìka kan ṣoṣo nínú àwọn ìka yín
  rationale: Ó pa ìtumọ̀ apá-kan-nínú-ọ̀pọ̀ àti ìtẹnumọ́ pé wọn kò ṣe ìsapá tí ó kéré jù lọ mọ́.
- source_word: προσψαύετε
  choice: kan
  rationale: Ó pa àwòrán gidi ti fífi ìka kan ẹrù mọ́, láì sọ ìtumọ̀ tí a lè fà jáde pé wọn kò ran àwọn ènìyàn lọ́wọ́ sínú ọ̀rọ̀ pàtàkì.
- source_word: Καὶ ὑμῖν
  choice: fún ẹ̀yin ... pẹ̀lú
  rationale: Ó fi hàn pé Jesu ń fi ẹgbẹ́ yìí kún àwọn tí ó ti ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ta ni νομικοῖς ń tọ́ka sí?
  choice: Àwọn amòye nínú Òfin àwọn Júù
  alternative: Àwọn agbẹjọ́rò; àwọn akọ̀wé
  rationale: Ní àyíká ọ̀rọ̀ Lúùkù, wọ́n jẹ́ ògbógi nínú Òfin Mósè. “Àwọn agbẹjọ́rò” lè mú kí òǹkàwé ronú nípa amòfin ilé-ẹjọ́ òde òní, “àwọn akọ̀wé” sì dín ìtumọ̀ ọ̀rọ̀ náà kù.
- issue: Ìtumọ̀ gbólóhùn ìkẹyìn
  choice: Pa àwòrán pé wọn kò fi ìka kan ẹrù náà mọ́
  alternative: Ẹ kò ṣe ìsapá kankan láti ràn wọ́n lọ́wọ́
  rationale: Ọ̀rọ̀ orísun sọ nípa fífi ìka kan ẹrù ní tààràtà. Ìtumọ̀ àpèjúwe náà—pé wọn kò ran àwọn tí wọ́n di ẹrù lé lórí lọ́wọ́—ṣe kedere, ṣùgbọ́n a kò fi í rọ́pò àwòrán inú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní ibi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “Òfin” gẹ́gẹ́ bí orúkọ fún Òfin Mósè, a sì pa àwòrán ẹrù àti ìka inú Gíríìkì mọ́.
