  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: yo
  text: Ẹni tí kò wà pẹ̀lú mi lòdì sí mi ni,[a] ẹni tí kò sì kójọ pẹ̀lú mi ń tú ká.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí kò wà pẹ̀lú mi lòdì sí mi ni, ẹnikẹ́ni tí kò sì kójọ pẹ̀lú mi ń tú ká.”
    reason: Àṣàyàn ọ̀nà láti sọ ọ̀rọ̀ ὁ pẹ̀lú participle gẹ́gẹ́ bí ẹni ẹyọ tí ó dúró fún gbogbo ènìyàn.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: Ẹni tí kò bá wà
  rationale: Ẹni tí ... jẹ́ ọ̀nà Yorùbá àdánidá fún àpilẹ̀kọ pẹ̀lú participle tí ó ń tọ́ka sí ẹnikẹ́ni tí ìwà yìí bá ṣàpèjúwe; ó pa ìtumọ̀ ẹyọ ọ̀rọ̀ gbogbogbò mọ́ láì lo èdè àtijọ́.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi / bá mi
  rationale: Àwọn méjèèjì fi ìbáṣepọ̀ tàbí ìdúró papọ̀ hàn. “Pẹ̀lú mi” dúró nínú gbólóhùn àkọ́kọ́, “bá mi” sì jẹ́ àdánidá pẹ̀lú ọ̀rọ̀-ìṣe “kójọ” nínú èkejì.
- source_word: κατ’ ἐμοῦ
  choice: lòdì sí mi
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere jù lọ láti sọ ìtakò, ó sì pa ìyàtọ̀ líle láàárín “pẹ̀lú mi” àti “lòdì sí mi” mọ́.
- source_word: συνάγων
  choice: kójọ
  rationale: “Kójọ” túmọ̀ sí kíkó àwọn ènìyàn tàbí ohun papọ̀, ó sì pa àwòrán ìkójọpọ̀ tí ó dojú kọ ìtúká mọ́.
- source_word: σκορπίζει
  choice: ń tú ká
  rationale: “Tú ká” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, aláwòrán, tí ó sì dojú kọ “kójọ” ní tààrà.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so àwọn abala méjèèjì pọ̀ lọ́nà àdánidá ní Yorùbá, ó sì pa ìṣọ̀kan àti ìfiwéra ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù nípa àìdásí-tọ̀túntòsì sí i
  choice: A fi ẹni tí kò dúró pẹ̀lú Jésù hàn gẹ́gẹ́ bí ẹni tí ó lòdì sí i.
  alternative: Láti túmọ̀ ọ́ ní ọ̀nà rírọ̀ bí ẹni tí kò kàn ṣe àtìlẹ́yìn, tàbí láti fi ìtumọ̀ rẹ̀ mọ́ iṣẹ́ ìlépa ẹ̀mí èṣù nìkan.
  rationale: Ìrísí Gíríìkì jẹ́ ọ̀rọ̀ gbooro tí ó sì lágbára. Ìtumọ̀ náà kò dín agbára rẹ̀ kù, bẹ́ẹ̀ ni kò fi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹni tí” láti tẹ̀lé ìṣètò Gíríìkì, a sì fi “ẹnikẹ́ni tí” sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn àdánidá.
