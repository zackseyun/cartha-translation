id: LUK.11.50
reference: Luke 11:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: yo
  text: kí a lè béèrè ẹ̀jẹ̀ gbogbo àwọn wòlíì, tí a ti ta sílẹ̀ láti ìpilẹ̀ṣẹ̀ ayé, lọ́wọ́ ìran yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lè mú ìran yìí jíhìn fún ẹ̀jẹ̀ náà.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ pípe ẹnì kan ní ìdájọ́ fún títasílẹ̀ ẹ̀jẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐκζητηθῇ
  choice: béèrè ... lọ́wọ́
  rationale: 'Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ní agbára ìdájọ́: pípe ẹnì kan láti jíhìn fún ẹ̀jẹ̀ tí a ta sílẹ̀. Gbólóhùn ‘béèrè ... lọ́wọ́’ pa ìtumọ̀ yẹn mọ́ láìṣe àfikún ẹ̀kọ́ mìíràn.'
- source_word: τὸ αἷμα
  choice: ẹ̀jẹ̀
  rationale: Èyí túmọ̀ ọ̀rọ̀ Gíríìkì ní tààrà; ní àyíká yìí, ẹ̀jẹ̀ náà dúró fún ikú àwọn wòlíì àti ẹ̀bi tó bá ìtàjẹ̀sílẹ̀ náà lọ.
- source_word: πάντων τῶν προφητῶν
  choice: gbogbo àwọn wòlíì
  rationale: Ó pa ìtẹnumọ́ tó kárí gbogbo àwọn wòlíì mọ́.
- source_word: τὸ ἐκκεχυμένον
  choice: tí a ti ta sílẹ̀
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ẹ̀jẹ̀ tí a ta nítorí ìpànìyàn, ó sì pa ìṣe tí ó ti ṣẹlẹ̀ mọ́.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: láti ìpilẹ̀ṣẹ̀ ayé
  rationale: Ó pa àwòrán àti àkókò tí gbólóhùn Gíríìkì ń tọ́ka sí mọ́ ní èdè Yorùbá tó níyì.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: lọ́wọ́ ìran yìí
  rationale: ‘Lọ́wọ́’ fi ẹni tí a ń béèrè ìjíhìn lọ́dọ̀ rẹ̀ hàn ní kedere, gẹ́gẹ́ bí ἀπό ṣe ń ṣiṣẹ́ pẹ̀lú ọ̀rọ̀ ìṣe náà.
theological_decisions:
- issue: Bí a ṣe lóye bí a ó ti ‘béèrè’ ẹ̀jẹ̀ àwọn wòlíì
  choice: Ìran yìí ni a ó pè láti jíhìn ní ìdájọ́ fún ẹ̀jẹ̀ àwọn wòlíì.
  alternative: Kí gbólóhùn náà kan fi ìtẹ̀síwájú ìkọ̀sílẹ̀ àwọn wòlíì nínú ìtàn hàn láìní agbára ìdájọ́ tó lágbára.
  rationale: Ìṣe ἐκζητέω nínú ọ̀rọ̀ nípa ẹ̀jẹ̀ sábà ń tọ́ka sí ṣíṣe ìwádìí àti fífi ẹ̀bi kan ẹni. Ìtumọ̀ náà pa agbára ìdájọ́ mọ́, ṣùgbọ́n kò ṣàlàyé bí ẹ̀bi àpapọ̀ ìran ṣe ń ṣiṣẹ́ ré kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó níyì, pẹ̀lú àmì ohùn ní kíkún. ‘Wòlíì,’ ‘ẹ̀jẹ̀ tí a ta sílẹ̀,’ àti ‘ìpilẹ̀ṣẹ̀ ayé’ pa ìforúkọsílẹ̀ Bíbélì mọ́ láìdi èdè náà rú.
