  source_fidelity: Ìtumọ̀ náà ń tọ́ka dáadáa sí ègbé ìwòlíì, ìfẹ́ àwọn Fárísí fún ipò ìjókòó ọlá, àti ìkíni ní ibi tí gbogbo ènìyàn ti ń wọlé sí. Síbẹ̀, “gbàgede ọjà” kì í ṣe ọ̀rọ̀ tí ó dára jù lọ fún ἀγοραί, ẹni tí ó túmọ̀ sí àwọn ibi ọjà/àwọn ọjà ní gbangba.
