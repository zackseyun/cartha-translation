base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: yo
  text: Ègbé ni fún yín, ẹ̀yin Fárísí, nítorí ẹ fẹ́ràn àwọn ìjókòó ọlá jù lọ[a] nínú àwọn sínágọ́gù, àti ìkíni ní àwọn ibi ọjà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìjókòó olórí” tàbí “àwọn ipò ọlá.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, ìkíni ní gbangba tí ń fi ọlá àti ìfẹ̀wọ́sí hàn sí ẹni láwùjọ.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ tàbí ìkìlọ̀ àwọn wòlíì mọ́; kò rọ̀ ọ́ di ọ̀rọ̀ ìbànújẹ́ lásán.
- source_word: τοῖς Φαρισαίοις
  choice: ẹ̀yin Fárísí
  rationale: Ó fi hàn gbangba pé Jésù ń bá àwọn Fárísí sọ̀rọ̀ tààrà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí a fi kéde ègbé náà ní Yorùbá àdánidá.
- source_word: ἀγαπᾶτε
  choice: ẹ fẹ́ràn
  rationale: Ó tọ́ka sí ìfẹ́ líle tàbí ìfẹ́kúfẹ̀ẹ́ wọn sí ọlá láwùjọ, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: àwọn ìjókòó ọlá jù lọ
  rationale: Ó sọ ìtumọ̀ ipò ìjókòó tí ó ní ọlá gíga jù lọ ní kedere, láìdí i mọ́ pé ó jẹ́ ìjókòó iwájú ní ti ibi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nínú àwọn sínágọ́gù
  rationale: Àyálò-ọ̀rọ̀ “sínágọ́gù” dá irú ibi ìjọsìn Júù tí orísun ń tọ́ka sí mọ́.
- source_word: τοὺς ἀσπασμοὺς
  choice: ìkíni
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn fún ìkíni tàbí ìfọwọ́sí ní gbangba; àlàyé ìṣe àṣà rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ní àwọn gbàgede ọjà
  rationale: Ó mú ìtumọ̀ ibi gbangba tí ọjà àti ìgbésí ayé àwùjọ ti ń lọ jáde ju “ọjà” nìkan lọ.
theological_decisions:
- issue: Irú ègbé tí Jésù kéde
  choice: Ọ̀rọ̀ ìdájọ́ bí ti wòlíì sí ìfẹ́ àwọn Fárísí fún ọlá ní gbangba
  alternative: Àríwísí ìwà àìtọ́ láwùjọ lásán
  rationale: οὐαί àti ìdí tí ó tẹ̀ lé e fi hàn pé ọ̀rọ̀ náà ní agbára ìwà rere àti ti ẹ̀mí; ìtumọ̀ náà kò dín in kù sí àṣà ìwà rere lásán.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa àtúnsọ ìṣe “ẹ fẹ́ràn” mọ́ nípasẹ̀ àkójọpọ̀ ohun méjèèjì, bí ó ti rí nínú Gíríìkì.
