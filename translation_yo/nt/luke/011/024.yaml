id: LUK.11.24
reference: Luke 11:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: yo
  text: Nígbà tí ẹ̀mí àìmọ́ bá jáde kúrò lára ọkùnrin náà, ó máa ń gba àwọn ibi tí kò ní omi[a] kọjá, ó ń wá ìsinmi. Nígbà tí kò sì rí i, ó ní, “Màá padà sí ilé mi, ibi tí mo ti jáde wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibi gbígbẹ.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn ibi tí kò ní omi ní ti gangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Nígbà tí ... bá
  rationale: Àkópọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ipò àkókò gbogbogbò tí ὅταν pẹ̀lú subjunctive ń fi hàn.
- source_word: ἀκάθαρτον πνεῦμα
  choice: ẹ̀mí àìmọ́
  rationale: Ó pa ìtumọ̀ ẹ̀mí búburú tí ó jẹ́ aláìmọ́ mọ́, ó sì jẹ́ gbólóhùn tí ó wọ́pọ̀, tí ó ṣe kedere nínú Yorùbá Bíbélì.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: bá jáde kúrò lára ọkùnrin náà
  rationale: “Jáde kúrò lára” fi ìyapa ẹ̀mí náà kúrò lọ́dọ̀ ẹni náà hàn kedere; “ọkùnrin náà” pa akọ ẹyọ ọ̀rọ̀ Gíríìkì mọ́ nínú àpẹẹrẹ yìí.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: ó máa ń gba àwọn ibi tí kò ní omi kọjá
  rationale: Èyí pa ìṣe líla àwọn agbègbè kan kọjá àti ìtumọ̀ gangan ἀνύδρων, “tí kò ní omi,” mọ́ láìfi àlàyé míì kún un.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ó ń wá ìsinmi
  rationale: Ó sọ participle náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ wíwá ibi ìsinmi mọ́.
- source_word: καὶ μὴ εὑρίσκον
  choice: Nígbà tí kò sì rí i
  rationale: Arọ́pò-orúkọ “i” tọ́ka sí ìsinmi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ kí ìtẹ̀síwájú ọ̀rọ̀ náà rọrùn ní Yorùbá.
- source_word: λέγει
  choice: ó ní
  rationale: “Ó ní” ni ọ̀nà Yorùbá àdánidá fún fífi ọ̀rọ̀ ẹni tàbí ẹ̀mí kan hàn, ó sì pa present tí ìtàn náà lò mọ́.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Màá padà sí ilé mi
  rationale: Ó fi ìpinnu ọjọ́ iwájú hàn ní ọ̀nà àdánidá, ó sì pa àwòrán “ilé mi” mọ́ fún ìtẹ̀síwájú àkàwé náà.
- source_word: ὅθεν ἐξῆλθον
  choice: ibi tí mo ti jáde wá
  rationale: Ó pa ìtọ́ka sí ibi ìbẹ̀rẹ̀ mọ́, ó sì tún ìṣe “jáde” ṣe bí ọ̀rọ̀ Gíríìkì ṣe ṣe.
theological_decisions:
- issue: Ohun tí “ẹ̀mí àìmọ́” ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ẹ̀mí búburú tí ó ń ṣe bí ẹni aláàyè, tí ó lè jáde, wá ìsinmi, sọ̀rọ̀, kí ó sì padà.
  alternative: Kí a túmọ̀ rẹ̀ sí àkàwé ìpadà sínú ìwà búburú nìkan tàbí sí agbára tí kò ní ìwà-ẹni.
  rationale: Àyíká ìwé Ìhìn Rere àti àwọn ìṣe tí ẹsẹ yìí sọ pé ẹ̀mí náà ń ṣe fi hàn pé a gbé e kalẹ̀ gẹ́gẹ́ bí ẹ̀mí tí ó ní ìwà-ẹni; ìtumọ̀ kò gbọ́dọ̀ sọ èyí di àkàwé lásán.
- issue: Akọ nínú ἀνθρώπου
  choice: ọkùnrin náà
  alternative: ẹni náà
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ nínú àpẹẹrẹ aṣojú yìí; “ọkùnrin náà” pa ìṣàmúlò náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ó máa ń” bá ìṣẹ̀lẹ̀ àpẹẹrẹ gbogbogbò mu, nígbà tí “Màá” jẹ́ ọ̀nà àdánidá ṣùgbọ́n tí ó ṣì bójú mu fún ìpinnu ọjọ́ iwájú. A gbé àmì àlàyé [a] sí lẹ́yìn “àwọn ibi tí kò ní omi,” ibi tí àlàyé ọ̀rọ̀ náà tọ́ka sí.
