  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: yo
  text: Ẹni náà sì dáhùn láti inú ilé pé, “Má yọ mí lẹ́nu.[a] A ti ti ilẹ̀kùn náà tẹ́lẹ̀,[b] àwọn ọmọ mi sì wà pẹ̀lú mi ní ibi ìsùn.[c] Èmi kò lè dìde láti fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Má fa ìdààmú fún mi” tàbí “Má ṣe máa yọ mí lẹ́nu.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààràtà sí “pèsè ìdààmú fún mi.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Ilẹ̀kùn náà ti tì tẹ́lẹ̀.” Ọ̀rọ̀-ìṣe aláṣepé Gíríìkì lè tẹnumọ́ ìṣe tí ó ti parí (“a ti tì í”) tàbí ipò tí ó yọrí sí (“ó ti tì”).
    reason: lexical_alternative
  - marker: c
    text: “Ní ibi ìsùn” ń tọ́ka sí ibi tí àwọn ará ilé ń sùn papọ̀ nínú àṣà ilé ìgbà náà; kì í ṣe ọ̀rọ̀ nípa ìbálòpọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Ẹni náà sì
  rationale: Ó ń tẹ̀síwájú nínú ìtàn, ó sì ń tọ́ka sí ọ̀rẹ́ tí ó wà nínú ilé; “ẹni náà sì” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́kasí àti ìsopọ̀ mọ́.
- source_word: ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: dáhùn láti inú ilé pé
  rationale: “Láti inú ilé” pa ìyàtọ̀ ibi mọ́ láàárín ẹni inú ilé àti ẹni tí ó wà lóde. Yorùbá máa ń fi “dáhùn pé” sọ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà lọ́nà àdánidá.
- source_word: Μή μοι κόπους πάρεχε
  choice: Má yọ mí lẹ́nu
  rationale: Èyí jẹ́ gbólóhùn àṣà tó túmọ̀ sí mímú ìdààmú tàbí ìnira bá ẹnì kan; “Má yọ mí lẹ́nu” ṣe kedere, ó sì bá ìforígbárí inú ọ̀rọ̀ mu.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: A ti ti ilẹ̀kùn náà tẹ́lẹ̀
  rationale: Ìṣe aláṣepé κέκλεισται ń tọ́ka sí ohun tí a ti ṣe tí ipò rẹ̀ ṣì ń bá a lọ. “A ti ti ... tẹ́lẹ̀” pa ìṣe tí ó ti parí àti àbájáde rẹ̀ mọ́ láì fi “tì pa” tàbí “tilẹ̀kùn pa” kún un.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: àwọn ọmọ mi sì wà pẹ̀lú mi lórí ibùsùn
  rationale: “Àwọn ọmọ mi” kò sọ ọjọ́-orí wọn ju bí orísun ṣe sọ lọ. “Lórí ibùsùn pẹ̀lú mi” fi ibi ìsùn tí ìdílé ń lò hàn ní kedere, láì mú ìtumọ̀ ìbálòpọ̀ wọlé.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Èmi kò lè dìde láti fún ọ
  rationale: Ó pa àìlè ṣe náà àti ìṣe dídìde tí yóò ṣáájú fífúnni mọ́. A kò fi ohun tí a ó fún un kún ọ̀rọ̀, nítorí pé kò fara hàn ní Gíríìkì, ó sì ṣeé lóye láti inú àyíká ọ̀rọ̀.
