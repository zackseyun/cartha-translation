translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. Gbólóhùn náà pa àwọ̀n ìtumọ̀ Gíríìkì mọ́, ṣùgbọ́n a ṣe àtúnṣe ìṣètò rẹ̀ sí ọ̀nà tí Yorùbá fi ń sọ̀rọ̀ ní ti ẹ̀dá.
