id: LUK.11.35
reference: Luke 11:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: yo
  text: Nítorí náà, ṣọ́ra kí ìmọ́lẹ̀ tí ó wà nínú rẹ má bàa jẹ́ òkùnkùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà, rí i dájú pé ìmọ́lẹ̀ tí ó wà nínú rẹ kì í ṣe òkùnkùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκόπει
  choice: ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ onítẹ̀síwájú yìí ń pe ẹni kan ṣoṣo sí ìṣọ́ra; “ṣọ́ra” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìkìlọ̀ mọ́.
- source_word: οὖν
  choice: nítorí náà
  rationale: Ó fi àbájáde ọgbọ́n hàn láti inú ẹ̀kọ́ tí ó ṣáájú nípa ojú àti ìmọ́lẹ̀.
- source_word: μὴ
  choice: kí ... má bàa
  rationale: Pẹ̀lú ọ̀rọ̀ àṣẹ, ó ṣàfihàn ìkìlọ̀ nípa ohun tí kò yẹ kí ó ṣẹlẹ̀; ìṣètò Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìṣọ́ra mọ́.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: Ìtumọ̀ tààrà tí ó pa àkàwé ìmọ́lẹ̀ mọ́ láì dín un kù sí òye, ẹ̀rí-ọkàn, tàbí ipò ẹ̀mí nìkan.
- source_word: τὸ ἐν σοὶ
  choice: tí ó wà nínú rẹ
  rationale: Ó tú gbólóhùn asọtẹ́lẹ̀ náà ní ọ̀nà Yorùbá tí ó ṣe kedere, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Ìtumọ̀ tààrà tí ó pa ìtakora láàárín ìmọ́lẹ̀ àti òkùnkùn mọ́.
- source_word: ἐστίν
  choice: jẹ́
  rationale: Ọ̀rọ̀ àsopọ̀ rírọrùn; kò nílò ìfẹ̀ sí i.
theological_decisions:
- issue: Ìtumọ̀ àkàwé “ìmọ́lẹ̀” àti “òkùnkùn”
  choice: Pa àkàwé náà mọ́ nínú ẹsẹ̀ láì sọ pé ó túmọ̀ sí ẹ̀rí-ọkàn, òye, tàbí ipò ẹ̀mí nìkan.
  alternative: Kí a túmọ̀ ọ́ sí “òye inú rẹ” tàbí “ẹ̀rí-ọkàn rẹ.”
  rationale: Ọ̀rọ̀ Jesu ní àyè yìí ní ìtumọ̀ gbòòrò nípa bí ènìyàn ṣe ń rí ohun àti ipò inú rẹ. Gíríìkì kò sọ àkàwé náà di ẹ̀kọ́ kan pàtó, nítorí náà a kò yẹ kí ìtumọ̀ náà ṣe bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasan. “Ṣọ́ra” mú agbára ìkìlọ̀ σκόπει jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa yíyan “rí i dájú” mọ́.
