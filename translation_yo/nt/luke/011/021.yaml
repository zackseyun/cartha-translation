id: LUK.11.21
reference: Luke 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: yo
  text: Nígbà tí ọkùnrin alágbára tí ó dìhámọ́ra tán bá ń ṣọ́ àgbàlá tirẹ̀[a], àwọn ohun ìní rẹ̀ a wà ní ààbò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé ńlá tirẹ̀” tàbí “ilẹ̀ àti ilé tirẹ̀”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àgbàlá tàbí sí ilé àti gbogbo agbègbè tí ó jẹ́ tirẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “wà ní àlàáfíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Nígbà tí ... bá
  rationale: Ó fi ipò gbogbogbò kan tí ó ní ìtumọ̀ àkókò àti àdéhùn hàn; ìṣètò yìí jẹ́ èdè Yorùbá àdánidá fún ‘nígbà tí/nígbàkigbà tí.’
- source_word: ὁ ἰσχυρός
  choice: ọkùnrin alágbára
  rationale: Adjective tí a lò bí orúkọ ń tọ́ka sí ẹni akọ kan tí ó lágbára; a kò fi ẹni tí àkàwé náà dúró fún hàn gbangba nínú ẹsẹ yìí.
- source_word: καθωπλισμένος
  choice: tí ó dìhámọ́ra tán
  rationale: Perfect participle náà ń ṣàpèjúwe ẹni tí ó ti múra pẹ̀lú ohun ìjà, tí ó sì ṣì wà ní ipò yẹn; ‘tán’ ń mú ìtumọ̀ ìmúra ní kíkún jáde.
- source_word: φυλάσσῃ
  choice: bá ń ṣọ́
  rationale: Ó mú ìṣe ṣíṣọ́ tí ń lọ lọ́wọ́ nínú gbólóhùn ὅταν hàn.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: àgbàlá tirẹ̀
  rationale: αὐλή lè túmọ̀ sí àgbàlá tàbí gbogbo ilé àti agbègbè tí ó yí i ká; ‘tirẹ̀’ pa ìtẹnumọ́ ἑαυτοῦ mọ́.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: àwọn ohun ìní rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún gbogbo ohun tí ó jẹ́ tirẹ̀.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: a wà ní ààbò
  rationale: Ní àyíká ọ̀rọ̀ nípa ṣíṣọ́ ohun ìní, àpólà náà ń sọ pé ohun ìní náà kò ní ìdààmú, ó sì ní ààbò; àlàyé ìsàlẹ̀ pa àwòrán ‘àlàáfíà’ inú Gíríìkì mọ́.
theological_decisions:
- issue: Agbára àkàwé náà nínú àyíká ọ̀rọ̀
  choice: A túmọ̀ àwòrán ọkùnrin alágbára náà ní tààrà láì sọ ẹni tí ó dúró fún ní gbangba.
  alternative: Kí a pe ọkùnrin alágbára náà ní Sátánì nínú ẹsẹ yìí.
  rationale: Ẹsẹ náà fúnra rẹ̀ gbé àwòrán àkàwé kalẹ̀; àwọn ẹsẹ tó yí i ká ni ó ń ṣàlàyé agbára rẹ̀. Èyí ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. ‘Dìhámọ́ra tán’ jẹ́ ọ̀nà àdánidá láti sọ pé ẹni náà ní ohun ìjà ní kíkún; ‘a wà ní ààbò’ jẹ́ àdánidá ju lílo àlàáfíà fún àwọn ohun ìní lọ, nígbà tí àlàyé ìsàlẹ̀ ń tọ́ka sí ìtumọ̀ gangan.
