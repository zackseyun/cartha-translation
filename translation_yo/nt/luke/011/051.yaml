id: LUK.11.51
reference: Luke 11:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: yo
  text: láti ẹ̀jẹ̀ Ábẹ́lì títí dé ẹ̀jẹ̀ Sekaráyà[b], ẹni tí ó ṣègbé láàárín pẹpẹ àti ilé[a]. Bẹ́ẹ̀ ni, mo sọ fún yín, a óò béèrè rẹ̀ lọ́wọ́ ìran yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín pẹpẹ àti tẹ́ńpìlì”; ní Gíríìkì, ó túmọ̀ ní tààrà sí “láàárín pẹpẹ àti ilé.”
    reason: lexical_alternative
  - marker: b
    text: Àríyànjiyàn wà lórí ẹni tí Sekaráyà yìí jẹ́. Ó ṣeé ṣe kó jẹ́ Sekaráyà ọmọ Jehoiada (2 Kíróníkà 24:20–22), tàbí Sekaráyà ọmọ Berekiah.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ
  choice: láti ẹ̀jẹ̀ Ábẹ́lì
  rationale: Ó pa àwòrán ‘ẹ̀jẹ̀’ àti ìbẹ̀rẹ̀ ààlà tí ἀπό fi hàn mọ́, ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἕως αἵματος Ζαχαρίου
  choice: títí dé ẹ̀jẹ̀ Sekaráyà
  rationale: Ó bá ‘láti’ mu gẹ́gẹ́ bí ọ̀rọ̀ ààlà, ó sì pa àtúnṣe ọ̀rọ̀ ‘ẹ̀jẹ̀’ tí ó wà nínú Gíríìkì mọ́.
- source_word: τοῦ ἀπολομένου
  choice: ẹni tí ó ṣègbé
  rationale: ‘Ṣègbé’ fi ikú Sekaráyà hàn láì fi ẹni tó pa á kun ọ̀rọ̀ náà, bí participle Gíríìkì náà ṣe jẹ́.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: láàárín pẹpẹ àti ilé
  rationale: ‘Ilé’ ni ìtumọ̀ tààrà οἶκος; àyíká ọ̀rọ̀ fi hàn pé ilé tẹ́ńpìlì ni, ṣùgbọ́n àlàyé yẹn wà ní àlàyé ìsàlẹ̀.
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ìfìdí ọ̀rọ̀ múlẹ̀ tí ó bá Yorùbá òde òní mu, ó sì pa ìtẹnumọ́ náà mọ́.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì sún mọ́ ìṣètò àti ìtumọ̀ Gíríìkì.
- source_word: ἐκζητηθήσεται
  choice: a óò béèrè rẹ̀
  rationale: Ìlò ‘a’ aláìdárúkọ pa ànímọ́ passive náà mọ́, ‘béèrè rẹ̀’ sì gbé èrò ìjíhìn àti ìdájọ́ jáde láì dárúkọ ẹni tó ń béèrè.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: lọ́wọ́ ìran yìí
  rationale: ‘Lọ́wọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí a béèrè láti ọ̀dọ̀ ẹnì kan, ‘ìran yìí’ sì pa itọ́kasí γενεά mọ́.
theological_decisions:
- issue: Ta ni Sekaráyà tí ẹsẹ yìí ń tọ́ka sí, àti bí ìdájọ́ náà ṣe kan ‘ìran yìí’
  choice: A kò dá Sekaráyà náà mọ̀ sí ẹni pàtó nínú ọ̀rọ̀ àkọ́kọ́; a sì fi ‘ìran yìí’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe wí.
  alternative: Ó lè jẹ́ Sekaráyà ọmọ Jehoiada, Sekaráyà ọmọ Berekiah, tàbí aṣojú àwọn wòlíì tí a pa.
  rationale: Gíríìkì dárúkọ Sekaráyà nìkan láì fi orúkọ baba rẹ̀ kún un. Nítorí náà, ìtumọ̀ kò gbọ́dọ̀ yanju àríyànjiyàn ìtàn tàbí fa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé ‘ìran yìí’ lórí.
- issue: Ẹni tí yóò béèrè ìjíhìn
  choice: A lo ‘a óò béèrè rẹ̀’ gẹ́gẹ́ bí gbólóhùn aláìdárúkọ ẹni tó ṣe iṣẹ́ náà.
  alternative: Ọlọ́run yóò béèrè rẹ̀ lọ́wọ́ ìran yìí.
  rationale: Passive Gíríìkì kò dárúkọ Ọlọ́run ní tààrà. Bó tilẹ̀ jẹ́ pé àyíká ìdájọ́ lè tọ́ka sí i, a kò fi orúkọ tí orísun kò sọ kún ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ; a sì lo ‘pẹpẹ’ àti ‘ilé’ láti pa àwòrán Gíríìkì mọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún ‘tẹ́ńpìlì.’
