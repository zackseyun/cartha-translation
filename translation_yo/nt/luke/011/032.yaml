id: LUK.11.32
reference: Luke 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: yo
  text: Àwọn ọkùnrin ará Nínéfè yóò dìde ní ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronúpìwàdà ní ìdáhùn sí ìkéde Jónà. Ẹ sì wò ó, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ẹni tí ó tóbi ju Jónà lọ wà níhìn-ín” tàbí “ohun tí ó ju Jónà lọ wà níhìn-ín.” Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí aláìlábòpò; nítorí náà, lílo “ohun” lè tọ́ka ní fífẹ̀ sí ohun gidi tó tóbi ju tí ó wà nínú Jesu àti iṣẹ́ ìránṣẹ́ rẹ̀, kì í ṣe sí ìfiwéra ẹni nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Àwọn ọkùnrin ará Nínéfè
  rationale: Ọ̀rọ̀ náà tọ́ka ní pàtó sí àwọn ọkùnrin, nígbà tí ‘ará Nínéfè’ fi ìlú tí wọ́n ti wá hàn ní Yorùbá àdánidá.
- source_word: ἀναστήσονται
  choice: yóò dìde
  rationale: Ó pa àwòrán dídìde mọ́ nínú ọ̀rọ̀ ìdájọ́ ọjọ́ ìkẹyìn láì fi ‘jíǹde’ sí i gẹ́gẹ́ bí ìtumọ̀ tí a ti pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐν τῇ κρίσει
  choice: ní ìdájọ́
  rationale: Ó túmọ̀ iṣẹlẹ̀ ìdájọ́ náà ní ṣókí, ó sì tẹ̀lé ἐν láì fi ‘ọjọ́’ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pẹ̀lú ìran yìí
  rationale: ‘Pẹ̀lú’ pa ìtumọ̀ ìbákẹ́gbẹ́ μετά mọ́, ‘ìran yìí’ sì jẹ́ ọ̀nà àdánidá láti sọ γενεὰ αὕτη.
- source_word: κατακρινοῦσιν αὐτήν
  choice: wọn yóò sì dá a lẹ́bi
  rationale: ‘Dá … lẹ́bi’ fi ìdálẹ́bi, kì í ṣe ìdájọ́ lásán, hàn; ‘a’ ń tọ́ka padà sí ìran yìí.
- source_word: μετενόησαν
  choice: wọ́n ronú pìwà dà
  rationale: Gbólóhùn Yorùbá yìí sọ ìyípadà ọkàn àti ìwà tí ọ̀rọ̀ náà ní nínú àyíká àsọtẹ́lẹ̀, kì í ṣe yíyí èrò lásán.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: nígbà tí wọ́n gbọ́ ìkéde Jónà
  rationale: Ó mú ìdáhùn àwọn ará Nínéfè sí ìkéde Jónà jáde ní Yorùbá tí ó ṣe kedere, bí εἰς ṣe ń fi ohun tó fa ìrònúpìwàdà hàn níhìn-ín.
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó fa àfiyèsí olùgbọ́ sí ohun tí ó tẹ̀ lé ní ọ̀nà ọ̀wọ̀ àti ọ̀rọ̀ mímọ́.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ohun tí ó tóbi ju Jónà lọ wà níhìn-ín
  rationale: ‘Ohun’ pa ìrísí akọ-abo-àìlópìn πλεῖον mọ́, ó sì jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí ẹni Jesu àti òtítọ́ tó tóbi jù tí iṣẹ́ rẹ̀ mú wá, láì fi tipátipá sọ ọ́ di ìfiwéra ẹni nìkan.
theological_decisions:
- issue: Ohun tí πλεῖον Ἰωνᾶ ń tọ́ka sí àti agbára ọ̀rọ̀ náà
  choice: ohun tí ó tóbi ju Jónà lọ wà níhìn-ín
  alternative: ẹni tí ó tóbi ju Jónà lọ wà níhìn-ín; ohun tí ó ju Jónà lọ wà níhìn-ín
  rationale: 'πλεῖον jẹ́ ọ̀rọ̀ akọ-abo-àìlópìn ní Gíríìkì. Lílo ‘ohun’ pa àìdánilójú tòótọ́ yìí mọ́: Jesu wà nínú ohun tí a ń tọ́ka sí, ṣùgbọ́n gbólóhùn náà tún lè gba gbogbo òtítọ́ àti iṣẹ́ ìjọba Ọlọ́run tí ó wà nínú rẹ̀.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì yàgò fún àwọn ọ̀rọ̀ ìjọ kan pàtó. ‘Sì kíyèsí i’ pa ìtẹnumọ́ ἰδοὺ mọ́ ní ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́.
