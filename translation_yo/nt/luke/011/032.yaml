    rationale: Yorùbá kò ní ìrísí akọ-abo gírámà nínú ‘tóbi jù’; ó yẹ kí àlàyé náà fi hàn pé ìrísí aláìlábòpò náà wà nínú ọ̀rọ̀ Gíríìkì, àti pé ‘ohun’ ni a lò láti pa ìfẹ̀hónúhàn náà mọ́.
