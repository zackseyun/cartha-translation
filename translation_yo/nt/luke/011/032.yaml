  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà dá àwọn ẹ̀yà pàtàkì ti Gíríìkì dúró dáadáa: ‘àwọn ọkùnrin ará Nínéfè,’ ìdájọ́, ìran yìí, ìdálẹ́bi, àti ìfìwéra aláìlábòpò náà. Síbẹ̀, ‘nígbà tí wọ́n gbọ́ ìkéde Jónà’ fi ìṣe gbígbọ́ kún ọrọ̀ náà, tí εἰς τὸ κήρυγμα Ἰωνᾶ kò sọ ní pàtó. ‘Ní ìdáhùn sí ìkéde Jónà’ tú ìbáṣepọ̀ ìrònúpìwàdà wọn sí ìkéde náà ní òtítọ́ síi.'
  naturalness: ‘Wọ́n ronú pìwà dà’ lóye, ṣùgbọ́n ‘wọ́n ronúpìwàdà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó dára fún àkọsílẹ̀ Bíbélì òde òní. ‘Sì kíyèsí i’ kò dùn mọ́ etí ní ibẹ̀rẹ̀ gbólóhùn; ‘Ẹ sì wò ó’ jẹ́ ìfihàn ìtẹnumọ́ tí ó hàn gbangba, tó sì bá ἰδού mu.
  terminology: ‘Dá a lẹ́bi’ jẹ́ ìtumọ̀ péye fún κατακρινοῦσιν, ‘ìdájọ́’ sì yẹ fún κρίσις. ‘Ohun tí ó tóbi ju Jónà lọ’ dá ìrísí aláìlábòpò πλεῖον dúró. Àlàyé ẹsẹ̀ ìsàlẹ̀ yẹ kí ó sọ pé ọ̀rọ̀ Gíríìkì ni aláìlábòpò, kì í ṣe pé gbolohun Yorùbá náà fúnra rẹ̀ ní ìrísí akọ-abo.
