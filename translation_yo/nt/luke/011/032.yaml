revisions:
- from: Àwọn ọkùnrin ará Nínéfè yóò dìde ní ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronú pìwà dà nígbà tí wọ́n gbọ́ ìkéde Jónà. Sì kíyèsí i, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín.[a]
  to: Àwọn ọkùnrin ará Nínéfè yóò dìde ní ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronúpìwàdà ní ìdáhùn sí ìkéde Jónà. Ẹ sì wò ó, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín.[a]
  rationale: Àtúnṣe náà yọ ìṣe ‘gbọ́’ tí a fi kún un kúrò, ó sì fi ìdáhùn àwọn ará Nínéfè sí ìkéde Jónà hàn ní kedere. Ó tún mú ọ̀rọ̀ ìtẹnumọ́ ἰδού rọrùn síi ní Yorùbá, ó sì ṣàtúnṣe àlàyé ẹsẹ̀ ìsàlẹ̀ kí ó lè ṣàlàyé ìrísí gírámà Gíríìkì ní òtítọ́, láì sọ pé Yorùbá ní akọ-abo gírámà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:09Z'
