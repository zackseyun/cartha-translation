source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: yo
  text: Ègbé ni fún yín, nítorí ẹ dàbí àwọn ibojì tí a kò lè dá mọ̀; àwọn ènìyàn tí ń rìn lórí wọn kò sì mọ̀ pé ibojì ni wọ́n.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ègbé ni fún yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìkìlọ̀ àti ìdájọ́ tí ọ̀rọ̀ Gíríìkì οὐαί ń sọ, láì sọ ọ́ di èébú lasán.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: àwọn ibojì tí kò hàn
  rationale: ἄδηλα túmọ̀ sí ohun tí kò hàn tàbí tí a kò lè dá mọ̀. Gbólóhùn yìí pa àwòrán ibojì tí ẹni tó ń kọjá kò mọ̀ mọ́, ó sì yẹra fún fífi ‘tí kò ní àmì’ ṣe ìtumọ̀ pàtó kan ṣoṣo.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι níbí ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: περιπατοῦντες ἐπάνω
  choice: tí ń rìn lórí wọn
  rationale: Ó pa ìtumọ̀ gangan ti rírìn lórí àwọn ibojì náà mọ́, ó sì bá àwòrán inú ẹsẹ náà mu.
- source_word: οὐκ οἴδασιν
  choice: kò sì mọ̀
  rationale: Ó sọ àìmọ̀ wọn ní kedere; ohun tí wọn kò mọ̀ ni pé ibojì ni ohun tí wọn ń rìn lé lórí.
theological_decisions:
- issue: Ìtumọ̀ àwòrán àwọn ibojì tí kò hàn
  choice: A pa àwòrán náà mọ́ láì ṣàlàyé àbájáde ìbàjẹ́ ìsìn tàbí àìmọ́tótó nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a fi kún un pé rírìn lórí wọn sọ ènìyàn di aláìmọ́.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ àlàyé yẹn ní ẹsẹ yìí; fífi í kún un yóò mú ìtumọ̀ àṣà kan wọ inú ọ̀rọ̀ pàtàkì dípò pípa àfojúsùn àti ìfọ̀rọ̀wérọ̀ ẹsẹ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, a sì fi ààmì ohùn sí ibi tí ó bá yẹ.
