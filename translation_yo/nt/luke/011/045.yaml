  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: yo
  text: Nígbà náà, ọ̀kan lára àwọn amòfin[a] dáhùn, ó sì wí fún un pé, “Olùkọ́, bí o ṣe ń sọ nǹkan wọ̀nyí, o tún ń gàn wá[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan lára àwọn ògbóǹkangí nínú Òfin.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó jẹ́ onímọ̀ nípa Òfin àwọn Júù, kì í ṣe agbẹjọ́rò òde òní ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “o tún ń hùwà ẹ̀gàn sí wa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹ̀gàn tàbí ìtìjú bá ẹnì kan, kì í ṣe mímú inú ẹni bí nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Nígbà náà ... dáhùn
  rationale: Àkópọ̀ yìí ń fi ìdáhùn tuntun hàn nínú ìtàn; ‘Nígbà náà’ mú ìtẹ̀síwájú náà jáde lọ́nà àdánidá, ‘dáhùn’ sì pa iṣẹ́ participle mọ́.
- source_word: τις τῶν νομικῶν
  choice: ọ̀kan lára àwọn amòfin
  rationale: Nínú àyíká Lúùkù, νομικός túmọ̀ sí ẹni tó mọ Òfin Mósè jinlẹ̀, kì í ṣe agbẹjọ́rò òde òní ní pàtó. ‘Amòfin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣókí, tí àlàyé ìsàlẹ̀ sì ń ṣàlàyé ìtumọ̀ rẹ̀.
- source_word: λέγει αὐτῷ
  choice: ó sì wí fún un pé
  rationale: A tú historical present náà sí ọ̀nà ìtàn Yorùbá tó wọ́pọ̀; ‘wí fún un pé’ fi ẹni tí a bá sọ̀rọ̀ hàn kedere.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ taara àti àdánidá fún ẹni tí ń kọ́ni ní ọ̀nà ẹ̀sìn tàbí ìmọ̀.
- source_word: ταῦτα λέγων
  choice: bí o ṣe ń sọ nǹkan wọ̀nyí
  rationale: Ó fi hàn pé ọ̀rọ̀ tí Jésù ń sọ ni ìdí tí amòfin náà fi dáhùn, ó sì pa ìṣe tó ń lọ lọ́wọ́ nínú participle mọ́.
- source_word: καὶ ἡμᾶς
  choice: wá pẹ̀lú
  rationale: '‘Pẹ̀lú’ pa agbára àfikún καί mọ́: àwọn amòfin náà wà lára àwọn tí ọ̀rọ̀ náà kàn.'
- source_word: ὑβρίζεις
  choice: ń gàn
  rationale: ‘Gàn’ ní agbára ẹ̀gàn àti ṣíṣe ẹni ní abuku; ó lágbára ju ‘mú inú bí’ lọ, ó sì bá ọ̀rọ̀ ὑβρίζω mu nínú àyíká yìí.
theological_decisions: []
translation_notes:
  register: Yorùbá àjọṣe tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘amòfin’ ní ìtumọ̀ onímọ̀ nípa Òfin Mósè, kì í ṣe agbẹjọ́rò òde òní ní pàtó. Àmì ohùn ni a fi sí ibi tó yẹ.
