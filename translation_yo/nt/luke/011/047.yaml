  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: yo
  text: Ègbé ni fún yín, nítorí ẹ̀ ń kọ́ àwọn ibojì àwọn wòlíì[a], ṣùgbọ́n àwọn baba ńlá[b] yín ni ó pa wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibi ìrántí fún òkú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibojì tàbí ibi ìrántí ibojì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn baba ìran yín” tàbí “àwọn ìran ìṣáájú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àwọn wòlíì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédéé fún ìkìlọ̀ ìdájọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí ègbé náà fi dé hàn ní kedere.
- source_word: οἰκοδομεῖτε
  choice: ẹ̀ ń kọ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ tí wọ́n ń ṣe, láìfi ìtumọ̀ míì kún un.
- source_word: τὰ μνημεῖα
  choice: àwọn ibojì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ibojì tàbí ohun ìrántí lórí ibojì; ‘ibojì’ ló ṣe kedere jù fún ọ̀pọ̀ ènìyàn.
- source_word: τῶν προφητῶν
  choice: àwọn wòlíì
  rationale: Ó fi hàn pé àwọn ibojì náà jẹ́ ti àwọn wòlíì tàbí pé a ṣe wọ́n fún ìrántí wọn.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: ṣùgbọ́n àwọn baba ńlá yín
  rationale: ‘Àwọn baba ńlá’ mú ìtumọ̀ àwọn baba ìran àtijọ́ jáde; ‘ṣùgbọ́n’ sì pa ìyàtọ̀ tí δέ lè fi hàn mọ́ láìṣàlàyé àbájáde rẹ̀.
- source_word: ἀπέκτειναν αὐτούς
  choice: ni ó pa wọ́n
  rationale: ‘Pa wọ́n’ jẹ́ ìtumọ̀ tààrà; ìlànà ‘ni ó’ tẹnu mọ́ ẹni tí ó ṣe iṣẹ́ náà, gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ Gíríìkì ṣe gbé àwọn baba kalẹ̀ ní ìyàtọ̀.
theological_decisions:
- issue: Bóyá kí a sọ ìwà àgàbàgebè tàbí ìdájọ́ ìbáṣepọ̀ wọn pẹ̀lú àwọn baba wọn ní gbangba
  choice: A fi ìfarakanra ọ̀rọ̀ náà sílẹ̀ pé wọ́n ń kọ́ ibojì àwọn wòlíì, ṣùgbọ́n àwọn baba ńlá wọn pa àwọn wòlíì náà.
  alternative: Ẹ̀ ń kọ́ ibojì àwọn wòlíì tí àwọn baba ńlá yín pa.
  rationale: Ẹsẹ yìí fi àwọn ìṣe méjèèjì sí ẹ̀gbẹ́ ara wọn, ṣùgbọ́n kò tíì ṣàlàyé gbogbo àbájáde ìdájọ́ náà; ẹsẹ tó tẹ̀ lé ló ń tú u síwájú. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìforígbárí ọ̀rọ̀ náà ṣáájú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní. A lo ‘ẹ̀’ fún ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀, ‘Ègbé ni fún yín’ fún ìkéde ìdájọ́, àti ‘baba ńlá’ fún àwọn baba ìran àtijọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
