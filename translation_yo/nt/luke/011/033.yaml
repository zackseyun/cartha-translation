id: LUK.11.33
reference: Luke 11:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: yo
  text: Kò sí ẹni tí ó tan fìtílà tí yóò fi í sí ibi ìkọ̀kọ̀ kan[a] tàbí sábẹ́ agbọ̀n òṣùwọ̀n[b]; ṣùgbọ́n orí ìdúró fìtílà ni yóò gbé e sí, kí àwọn tí ń wọlé lè rí ìmọ́lẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “yàrá ìpamọ́ abẹ́lẹ̀” tàbí “ibi tí a fi pamọ́”; ọ̀rọ̀ Gíríìkì κρύπτη lè tọ́ka sí ibi ìkọ̀kọ̀, títí kan ibi ìpamọ́ abẹ́ ilẹ̀.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì μόδιος: òṣùwọ̀n ohun gbígbẹ, tàbí ohun èlò tí a fi ń wọn irú òṣùwọ̀n bẹ́ẹ̀; ní àṣà ìtumọ̀ kan, “búṣélì” tàbí “agbọ̀n búṣélì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Kò sí ẹni tí
  rationale: Ó fi ìsẹ́lọ́nà àìní ẹni kankan hàn ní Yorùbá àdánidá, ó sì bá ọ̀nà òwe tí gbólóhùn náà gbà mu.
- source_word: λύχνον
  choice: fìtílà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fìtílà kékeré tí a máa ń fi epo tàn, kì í ṣe abẹ́là ní pàtó.
- source_word: ἅψας
  choice: lẹ́yìn tí ó bá tan
  rationale: 'Ó pa ìtẹ̀lé ìṣe mọ́: títan fìtílà ṣẹlẹ̀ ṣáájú gbígbé e sí ibì kan.'
- source_word: εἰς κρύπτην
  choice: sí ibi ìkọ̀kọ̀ kan
  rationale: κρύπτη lè jẹ́ ibi tí a fi pamọ́ tàbí yàrá ìpamọ́ abẹ́lẹ̀; yíyan ọ̀rọ̀ gbòòrò yìí tẹnumọ́ fífi ìmọ́lẹ̀ pamọ́ láì fi irú ilé kan pàtó kún un.
- source_word: ὑπὸ τὸν μόδιον
  choice: sábẹ́ agbọ̀n òṣùwọ̀n
  rationale: μόδιος jẹ́ òṣùwọ̀n ohun gbígbẹ àti ohun èlò tí a fi ń wọn án; ‘agbọ̀n òṣùwọ̀n’ jẹ́ àwòrán tí ó ṣe kedere sí òǹkàwé òde òní.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: orí ìdúró fìtílà
  rationale: λυχνία túmọ̀ sí ohun tí a gbé fìtílà lé lórí, nítorí náà ọ̀rọ̀ yìí pa ohun tí Gíríìkì ń tọ́ka sí mọ́.
- source_word: οἱ εἰσπορευόμενοι
  choice: àwọn tí ń wọlé
  rationale: Ó ṣàfihàn àwọn ènìyàn tí wọ́n ń wọ inú ibẹ̀ gẹ́gẹ́ bí partísípù Gíríìkì ṣe rí.
- source_word: τὸ φέγγος
  choice: ìmọ́lẹ̀ náà
  rationale: φέγγος túmọ̀ sí ìmọ́lẹ̀ tàbí dídán; ‘ìmọ́lẹ̀’ jẹ́ ọ̀rọ̀ àdánidá jù lọ nínú àwòrán fìtílà yìí.
- source_word: βλέπωσιν
  choice: lè rí
  rationale: 'Ó sọ ète tí ἵνα àti subjunctive fi hàn ní Yorùbá àdánidá: kí àwọn tó wọlé lè rí ìmọ́lẹ̀.'
theological_decisions:
- issue: Ìtumọ̀ κρύπτη
  choice: ibi ìkọ̀kọ̀ kan
  alternative: yàrá ìpamọ́ abẹ́lẹ̀ tàbí yàrá ìpamọ́
  rationale: Kókó àpẹẹrẹ náà ni àìgbọ́gbọ́n fífi ìmọ́lẹ̀ pamọ́, kì í ṣe irú yàrá pàtó; ìtumọ̀ gbòòrò yìí pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìtumọ̀ μόδιος
  choice: agbọ̀n òṣùwọ̀n
  alternative: ohun èlò òṣùwọ̀n tàbí módíọ̀sì
  rationale: Yíyan yìí mú àwòrán fífi ohun èlò bo fìtílà ṣe kedere, ó sì tún fi iṣẹ́ ohun èlò náà gẹ́gẹ́ bí òṣùwọ̀n hàn.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A lo ìṣètò ‘lẹ́yìn tí ó bá… yóò…’ láti pa ìtẹ̀lé ìṣe mọ́, àti ‘dípò bẹ́ẹ̀’ láti mú ìyàtọ̀ ἀλλά hàn. A tún gbé àwọn àmì àlàyé sí lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, dípò fífi wọ́n sí ibi tí kò bá ìtumọ̀ mu.
