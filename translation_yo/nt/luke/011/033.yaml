  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì inú Gíríìkì mọ́: fìtílà, ibi ìkọ̀kọ̀/κρύπτη, ohun èlò òṣùwọ̀n/μόδιος, ìdúró fìtílà, àti ète kí àwọn tí ń wọlé lè rí ìmọ́lẹ̀. Ṣùgbọ́n “lẹ́yìn tí ó bá tan … yóò” ní ìrísí ọjọ́ iwájú/àdéhùn, níbi tí partísípù aorist Gíríìkì ń sọ ìṣe tán ṣáájú nínú ọ̀rọ̀ gbogbogbò. A tún ṣe àtúnṣe ìsopọ̀ ìyàtọ̀ ἀλλά sí “ṣùgbọ́n.”'
