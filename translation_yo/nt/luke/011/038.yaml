  edition: SBLGNT
  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: yo
  text: Ṣùgbọ́n Farisí náà, nígbà tí ó rí èyí, ẹnu yà á pé Jésù kò kọ́kọ́ ṣe ìwẹ̀[a] ṣáájú oúnjẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò kọ́kọ́ ṣe ìwẹ̀ ìwẹ̀mọ́ ṣáájú oúnjẹ.” Ọ̀rọ̀-ìṣe Gíríìkì náà ni a sábà máa ń lò fún “batisí,” ṣùgbọ́n níbí ó ń tọ́ka sí ìwẹ̀ ìwẹ̀mọ́ nínú àṣà àwọn Farisí ṣáájú oúnjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ohun tí Jésù ṣe àti ìhùwàpadà Farisí náà.
- source_word: ὁ Φαρισαῖος
  choice: Farisí náà
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí Farisí tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà.
- source_word: ἰδὼν
  choice: nígbà tí ... rí èyí
  rationale: Ó mú ìbáṣepọ̀ àkókò ti aorist participle náà jáde ní Yorùbá, ó sì fi ohun tí ó rí sílẹ̀ gẹ́gẹ́ bí ohun tí àyíká ọ̀rọ̀ ṣàlàyé.
- source_word: ἐθαύμασεν
  choice: ẹnu yà á
  rationale: Gbólóhùn Yorùbá àdánidá ni fún ìyàlẹ́nu; nínú àyíká yìí ó tún lè ní ìtumọ̀ àtakò tàbí àìtẹ́wọ́gbà láìfi èyí kún ọ̀rọ̀ náà ní tààrà.
- source_word: οὐ πρῶτον
  choice: kò kọ́kọ́
  rationale: 'Ó pa ìtẹ̀lé ìṣe mọ́: Farisí náà retí pé kí ìwẹ̀ náà ṣẹlẹ̀ ṣáájú jíjẹun.'
- source_word: ἐβαπτίσθη
  choice: wẹ ara rẹ̀
  rationale: Nínú àyíká àṣà ìwẹ̀mọ́ Farisí ṣáájú oúnjẹ, ọ̀rọ̀ náà túmọ̀ sí ìwẹ̀ àṣà, kì í ṣe batisí Kristẹni; ìtumọ̀ yìí tún pa ìṣe tí ẹni náà ṣe mọ́.
- source_word: πρὸ τοῦ ἀρίστου
  choice: ṣáájú oúnjẹ
  rationale: Ó túmọ̀ sí ṣáájú jíjẹun láìdá àkókò oúnjẹ náà mọ́ sí ọ̀sán tàbí òwúrọ̀.
theological_decisions:
- issue: Ìtumọ̀ ἐβαπτίσθη nínú àyíká jíjẹun Farisí
  choice: ìwẹ̀ ara gẹ́gẹ́ bí àṣà ìwẹ̀mọ́ ṣáájú oúnjẹ
  alternative: a batisí rẹ̀ tàbí ó rì ara rẹ̀ sínú omi
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìlànà ìwẹ̀mọ́ Farisí ṣáájú oúnjẹ, kì í ṣe batisí Kristẹni. Àlàyé ìsàlẹ̀ ojú ìwé pa ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì náà pẹ̀lú ‘batisí’ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀ àti èdè òde òní. A sọ “Jésù” ní kedere nítorí Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni kẹta, èyí sì dènà àìṣedéédé ẹni tí kò kọ́kọ́ wẹ̀.
