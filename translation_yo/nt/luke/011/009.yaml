id: LUK.11.9
reference: Luke 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: yo
  text: Èmi sì sọ fún yín pé,[a] ẹ béèrè, a ó sì fi fún yín; ẹ wá, ẹ ó sì rí; ẹ kan ilẹ̀kùn, a ó sì ṣí i fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè tú àwọn àṣẹ Gíríìkì náà pé: “ẹ máa béèrè … ẹ máa wá … ẹ máa kan ilẹ̀kùn,” láti fi ìṣe tí a ń tẹ̀ síwájú tàbí tí a ń ṣe léraléra hàn. Ìrísí ìsinsìnyí Gíríìkì lè ní ìtumọ̀ yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: Èmi náà sì
  rationale: Ó pa ìtẹnumọ́ ẹni àkọ́kọ́ àti ìsopọ̀ pẹ̀lú ẹ̀kọ́ tó ṣáájú mọ́, láìfi ìtumọ̀ kún un jù.
- source_word: λέγω
  choice: sọ fún
  rationale: 'Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ọ̀rọ̀ taara hàn: “mo sọ fún yín pé.”'
- source_word: αἰτεῖτε
  choice: ẹ máa béèrè
  rationale: Àṣẹ ìsinsìnyí Gíríìkì lè tọ́ka sí ìṣe tí a ń bá a lọ; “ẹ máa béèrè” jẹ́ àdánidá ní Yorùbá, ó sì jẹ́ kí agbára yẹn hàn láìsọ ohun tí a ń béèrè ní pàtó.
- source_word: δοθήσεται
  choice: a ó fi fún yín
  rationale: Ó tú ìṣe ọjọ́ iwájú aláìlórúkọ náà sí Yorùbá àdánidá, láìsọ ẹni tí yóò fún wọn.
- source_word: ζητεῖτε
  choice: ẹ máa wá
  rationale: “Wá” pa ìtumọ̀ fífi taratara ṣàwárí mọ́, ó sì lè ṣiṣẹ́ ní ti gidi tàbí ní àkàwé.
- source_word: εὑρήσετε
  choice: ẹ ó sì rí
  rationale: Ó pa ìlérí ọjọ́ iwájú àti ìbáramu àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta mọ́.
- source_word: κρούετε
  choice: ẹ máa kan ilẹ̀kùn
  rationale: Bí ó tilẹ̀ jẹ́ pé ohun tí a ń kàn kò farahàn ní Gíríìkì, Yorùbá àdánidá máa ń sọ “kan ilẹ̀kùn”; ọ̀rọ̀ tó tẹ̀ lé e tún fi ilẹ̀kùn náà hàn gbangba.
- source_word: ἀνοιγήσεται
  choice: a ó sì ṣí i fún yín
  rationale: Ọ̀nà yìí pa aláìlórúkọ ìṣe Gíríìkì mọ́, ó sì lo arọ́pò-orúkọ “i” fún ilẹ̀kùn tí gbólóhùn tó ṣáájú tọ́ka sí.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi hàn pé ìlérí náà dojú kọ gbogbo àwọn tí Jésù ń bá sọ̀rọ̀, ní irú ọ̀nà Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìrísí àwọn àṣẹ ìsinsìnyí αἰτεῖτε, ζητεῖτε, κρούετε
  choice: “ẹ máa béèrè … ẹ máa wá … ẹ máa kan ilẹ̀kùn”
  alternative: “ẹ béèrè … ẹ wá … ẹ kan ilẹ̀kùn”
  rationale: Ami “máa” ní Yorùbá lè fi ìṣe tí a ń tẹ̀ síwájú tàbí tí a ń ṣe léraléra hàn ní ti àdánidá. Èyí bá agbára tó ṣeé ṣe nínú àṣẹ ìsinsìnyí Gíríìkì mu, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ọ̀nà àṣẹ rírọrùn sílẹ̀ gẹ́gẹ́ bí àṣàyàn.
translation_notes:
  register: Yorùbá àkànṣe, olóòótọ́, tí ó ní àmì ohùn níbi tó yẹ. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ὑμεῖς/ὑμῖν, kì í ṣe ọ̀rọ̀ ọlá sí ẹnì kan ṣoṣo. Ìtẹ̀sí àwọn apá mẹ́tẹ̀ẹ̀ta àti àwọn ìlérí wọn ni a pa mọ́.
