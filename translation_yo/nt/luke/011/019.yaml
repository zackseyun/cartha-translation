- from: Ṣùgbọ́n bí èmi bá ń fi Béélísébúlù lé àwọn ẹ̀mí èṣù jáde, nípasẹ̀ ta ni àwọn ọmọ yín fi ń lé wọn jáde?[a] Nítorí náà, àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín.[b]
  to: Ṣùgbọ́n bí èmi bá ń fi Béélísébúlù lé àwọn ẹ̀mí èṣù jáde, àwọn ọmọ yín ń fi ta lé wọn jáde?[a] Nítorí náà, àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín.[b]
  rationale: Only the instrumental interrogative has been recast for idiomatic Yoruba and closer parallelism with the Greek argument. The literal reference to “àwọn ọmọ yín,” the personal reading in the main text, and the alternative means/power reading in footnote a are preserved. Footnote b remains correctly anchored to the emphatic pronoun in the conclusion.
