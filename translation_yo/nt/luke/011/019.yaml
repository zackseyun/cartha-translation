id: LUK.11.19
reference: Luke 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: yo
  text: Ṣùgbọ́n bí èmi bá ń fi Béélísébúlù lé àwọn ẹ̀mí èṣù jáde, àwọn ọmọ yín ń fi ta lé wọn jáde?[a] Nítorí náà, àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “nípasẹ̀ kí ni,” tàbí “nípasẹ̀ agbára wo ni àwọn ọmọ yín fi ń lé wọn jáde?”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì tẹnumọ́ “àwọn fúnra wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: δέ ní ìtumọ̀ ìtakora díẹ̀ nínú àríyànjiyàn Jésù; “Ṣùgbọ́n bí” mú ìbáṣepọ̀ yìí hàn lọ́nà àdánidá.
- source_word: ἐγὼ
  choice: èmi
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ mọ́, kí ìyàtọ̀ tó wà láàárín Jésù àti “àwọn ọmọ yín” lè hàn.
- source_word: ἐν Βεελζεβοὺλ
  choice: fi Béélísébúlù
  rationale: ἐν níbí ń tọ́ka sí ẹni tàbí agbára tí a fi ṣe iṣẹ́ náà. Ìtumọ̀ yìí kò fi ọ̀rọ̀ àlàyé “agbára” kún Gíríìkì, ó sì pa orúkọ náà mọ́ gẹ́gẹ́ bí àkọsílẹ̀-ohùn.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: lé àwọn ẹ̀mí èṣù jáde
  rationale: “Lé … jáde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìlé ẹ̀mí èṣù jáde; “àwọn ẹ̀mí èṣù” ń ṣàlàyé pé àwọn ẹ̀mí búburú ni δαιμόνια.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: àwọn ọmọ yín
  rationale: “Àwọn ọmọ yín” pa ìtumọ̀ ojú-ọ̀rọ̀ υἱοί mọ́ láì pinnu pé àwọn ọmọ-ẹ̀yìn, ọmọ orílẹ̀-èdè, tàbí ẹgbẹ́ mìíràn ni.
- source_word: ἐν τίνι
  choice: nípasẹ̀ ta ni
  rationale: Ìbéèrè náà lè tọ́ka sí ẹni tí wọ́n fi ń lé àwọn ẹ̀mí èṣù jáde; “nípasẹ̀ ta” mú agency yìí hàn, nígbà tí akọsilẹ̀ ẹsẹ̀ pa ìtumọ̀ means/power mọ́.
- source_word: ἐκβάλλουσιν
  choice: ń lé wọn jáde
  rationale: A tún ọ̀rọ̀-ìṣe kan náà lò láti bá ἐκβάλλω àkọ́kọ́ mu; “wọn” gba àwọn ẹ̀mí èṣù tí a mẹ́nu kàn tẹ́lẹ̀.
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Gbólóhùn yìí ń mú ìparí àríyànjiyàn jáde lọ́nà tó ṣókí, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín
  rationale: “Àwọn fúnra wọn” pa ìtẹnumọ́ αὐτοί mọ́; “onídàájọ́ yín” jẹ́ àkójọpọ̀ predicate tó bá Yorùbá mu.
theological_decisions:
- issue: Ta ni “àwọn ọmọ yín” ń tọ́ka sí?
  choice: A fi “àwọn ọmọ yín” sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ orísun.
  alternative: àwọn ọmọ-ẹ̀yìn yín; àwọn ènìyàn yín; àwọn Júù ẹlẹgbẹ́ yín
  rationale: Gíríìkì sọ “àwọn ọmọ yín,” kò sì dá ìdánimọ̀ wọn pàtó. Ìtumọ̀ náà kò yẹ kí ó yanjú àìdánilójú yìí ní ìkọ̀kọ̀.
- issue: Ìtẹnumọ́ αὐτοί
  choice: A túmọ̀ rẹ̀ sí “àwọn fúnra wọn.”
  alternative: àwọn ni yóò jẹ́ onídàájọ́ yín
  rationale: Arọ́pò-orúkọ Gíríìkì wà ní ipò ìtẹnumọ́, Yorùbá sì lè fi “fúnra wọn” hàn lọ́nà àdánidá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Béélísébúlù” jẹ́ àkọsílẹ̀-ohùn orúkọ Βεελζεβούλ.
