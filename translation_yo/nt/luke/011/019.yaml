review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional argument, instrumental force of ἐν Βεελζεβούλ, repeated exorcism verb, literal “your sons,” and the inferential conclusion. The explicit emphasis of αὐτοί is also appropriately retained in “àwọn fúnra wọn.” The wording “nípasẹ̀ ta ni” is less idiomatic Yoruba for this instrumental question and is needlessly different from the parallel “fi Béélísébúlù.”
  naturalness: Revise the interrogative clause to “àwọn ọmọ yín ń fi ta lé wọn jáde?” This is natural Standard Yoruba, directly mirrors the preceding “ń fi Béélísébúlù,” and retains the personal-agent sense without added interpretation.
  terminology: “Béélísébúlù,” “ẹ̀mí èṣù,” “àwọn ọmọ yín,” and “onídàájọ́ yín” are suitable and faithful. No doctrinal interpretation is imposed.
  issues:
  - severity: medium
    issue: The phrase “nípasẹ̀ ta ni àwọn ọmọ yín fi ń lé wọn jáde?” is awkward for the instrumental interrogative and does not maintain the direct syntactic parallel with the preceding clause.
    rationale: Greek ἐν τίνι repeats the instrumental construction used with Beelzebul. Yoruba “àwọn ọmọ yín ń fi ta lé wọn jáde?” naturally expresses “by whom do your sons cast them out?” and preserves the ambiguity addressed by the note.
  revised_text: Ṣùgbọ́n bí èmi bá ń fi Béélísébúlù lé àwọn ẹ̀mí èṣù jáde, àwọn ọmọ yín ń fi ta lé wọn jáde?[a] Nítorí náà, àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín.[b]
