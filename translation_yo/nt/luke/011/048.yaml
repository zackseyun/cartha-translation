id: LUK.11.48
reference: Luke 11:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin jẹ́ ẹlẹ́rìí, ẹ sì fọwọ́ sí àwọn iṣẹ́ àwọn baba ńlá yín; nítorí àwọn ni ó pa àwọn wòlíì, ṣùgbọ́n ẹ̀yin ni ẹ ń kọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, ẹ ń kọ́ ibojì àwọn wòlíì, gẹ́gẹ́ bí a ti sọ ní ẹsẹ tó ṣáájú.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí ó jáde láti inú ẹ̀sùn ẹsẹ tó ṣáájú hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: μάρτυρές ἐστε
  choice: ẹ̀yin jẹ́ ẹlẹ́rìí
  rationale: A pa àkópọ̀ ọ̀rọ̀ orúkọ náà mọ́; ìṣe wọn fúnra rẹ̀ ni ó ń jẹ́rìí sí ìbámu wọn pẹ̀lú àwọn baba ńlá wọn.
- source_word: συνευδοκεῖτε
  choice: ẹ sì fọwọ́ sí
  rationale: ‘Fọwọ́ sí’ sọ ìtẹ́wọ́gbà àti ìfaramọ́ pẹ̀lú ìṣe náà ní Yorùbá àdánidá.
- source_word: τοῖς ἔργοις
  choice: iṣẹ́
  rationale: Nínú àyíká yìí, ‘iṣẹ́’ túmọ̀ sí àwọn ìṣe wọn, ó sì pa agbára ìdájọ́ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῶν πατέρων ὑμῶν
  choice: àwọn baba ńlá yín
  rationale: Ó tọ́ka sí àwọn baba ìran wọn, kì í ṣe àwọn baba wọn lẹ́sẹ̀kẹsẹ̀ nìkan, ó sì pa ìsopọ̀ ìdílé inú ọ̀rọ̀ náà mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó mú ìdí tí ẹ̀sùn náà fi rí bẹ́ẹ̀ wọlé ní kedere.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: àwọn ni ó pa àwọn wòlíì
  rationale: ‘Àwọn ni’ pa ìtẹnumọ́ àti ìyàtọ̀ μέν…δέ mọ́; a sọ ‘àwọn wòlíì’ dípò arọ́pò-orúkọ kejì láti yẹra fún àìmọye ní Yorùbá, gẹ́gẹ́ bí àyíká ẹsẹ 47.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: ṣùgbọ́n ẹ̀yin ni ẹ ń kọ́ ibojì wọn
  rationale: ‘Ṣùgbọ́n ẹ̀yin ni’ pa ìtakora àti ìtẹnumọ́ mọ́. ‘Ibojì wọn’ ni ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí láti ẹsẹ tó ṣáájú, a sì mú un wọlé fún ìtumọ̀ Yorùbá tí ó péye.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí οἰκοδομεῖτε ń kọ́ ní tààrà nínú ọ̀rọ̀ àkọ́kọ́
  choice: A sọ ọ́ pé ‘ẹ ń kọ́ ibojì wọn.’
  alternative: 'Kí a fi ọ̀rọ̀-ìṣe náà sílẹ̀ láìsọ ohun tí wọ́n ń kọ́: ‘ẹ̀yin sì ń kọ́.’'
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ẹsẹ yìí kò tún ‘ibojì’ sọ, ẹsẹ 47 ló pèsè ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí. Yorùbá tó ṣe kedere nílò àfikún yìí, kò sì yí ìtumọ̀ tàbí ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà padà.
translation_notes:
  register: Yorùbá ìpele àárín, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ̀yin’ àti àkópọ̀ ọ̀rọ̀-ìṣe ‘ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni Jesu ń bá sọ̀rọ̀. Ọ̀rọ̀ náà pa ìtẹnumọ́ ‘àwọn ni… ṣùgbọ́n ẹ̀yin ni…’ mọ́.
