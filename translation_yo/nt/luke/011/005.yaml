id: LUK.11.5
reference: Luke 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ta ni nínú yín tí yóò ní ọ̀rẹ́ kan, tí yóò sì lọ bá a ní ọ̀gànjọ́ òru, tí yóò sì sọ fún un pé, ‘Ọ̀rẹ́, yá mi ní ìṣù búrẹ́dì mẹ́ta,’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Ta ni nínú yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti bẹ̀rẹ̀ ìbéèrè àsọyé tí a darí sí àwọn olùgbọ́.
- source_word: ἕξει
  choice: tí yóò ní
  rationale: A pa ìrísí ọ̀rọ̀-ìṣe ọjọ́ iwájú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ àsọyé náà lè gba ọ̀rọ̀-ìṣe àkókò ìsinsìnyí ní Yorùbá.
- source_word: φίλον / Φίλε
  choice: ọ̀rẹ́ / Ọ̀rẹ́
  rationale: Lílo ọ̀rọ̀ kan náà pa àtúnsọ inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bá àyíká náà mu.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: tí yóò sì lọ bá a
  rationale: “Lọ bá a” jẹ́ ọ̀nà àdánidá ní Yorùbá fún lílọ sí ọ̀dọ̀ ẹni kan, láìfi ìtumọ̀ míì kún un.
- source_word: μεσονυκτίου
  choice: ní ọ̀gànjọ́ òru
  rationale: Ó túmọ̀ àkókò àárín òru ní ṣókí, ní èdè Yorùbá tó ṣe déédéé.
- source_word: εἴπῃ αὐτῷ
  choice: tí yóò sì sọ fún un
  rationale: Ó tẹ̀ lé ìṣètò ìbéèrè náà, ó sì túmọ̀ λέγω ní tààrà.
- source_word: χρῆσόν μοι
  choice: yá ... fún mi
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń béèrè ohun tí a ó fi fún ẹni náà gẹ́gẹ́ bí ohun yíyá; gbolohun Yorùbá yìí jẹ́ kedere, ó sì bójú mu.
- source_word: τρεῖς ἄρτους
  choice: ìṣù búrẹ́dì mẹ́ta
  rationale: ἄρτους tọ́ka sí odindi ìṣù búrẹ́dì; “ìṣù búrẹ́dì” yà á sọ́tọ̀ kedere sí ẹ̀yà tàbí ege búrẹ́dì.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A pa ọjọ́ iwájú inú Gíríìkì mọ́ nínú ìbéèrè àsọyé, bí ó tilẹ̀ jẹ́ pé Yorùbá lè sọ ọ́ pẹ̀lú àkókò ìsinsìnyí. Àmi ohùn ni a fi sí gbogbo ibi tó yẹ.
