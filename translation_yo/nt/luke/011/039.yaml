id: LUK.11.39
reference: Luke 11:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa sọ fún un pé, “Ní báyìí, ẹ̀yin Farisí ń fọ apá òde ife àti àwo mọ́, ṣùgbọ́n inú yín kún fún ìwọra[a] àti ìwà búburú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “jíjà,” “ìfi-agbára-gbà,” tàbí “ìrẹ́jẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè Májẹ̀mú Tuntun tí ó bójú mu níhìn-ín; kì í ṣe ìkíni ọ̀wọ̀ lásán.
- source_word: Νῦν
  choice: Ní báyìí
  rationale: Ó pa àmì ìyípadà ọ̀rọ̀ àti agbára ìbáwí Jésù mọ́ ní Yorùbá àdánidá.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: ẹ̀yin Farisí
  rationale: “Ẹ̀yin” mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jáde lọ́nà àdánidá.
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: ẹ̀yìn ife àti àwo
  rationale: “Ẹ̀yìn” túmọ̀ sí apá òde àwọn ohun èlò náà; “ife” àti “àwo” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere.
- source_word: καθαρίζετε
  choice: ń fọ ... mọ́
  rationale: Ìṣe tí ń lọ tàbí tí wọ́n máa ń ṣe ni aorí ìsinsìnyí Gíríìkì fi hàn; gbolohun yìí jẹ́ àdánidá fún fífọ ohun èlò.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: ṣùgbọ́n inú yín
  rationale: Ó pa àkàwé ìyàtọ̀ láàárín òde àti inú mọ́ láì túmọ̀ “inú” sí ọkàn tàbí èrò-inú.
- source_word: γέμει
  choice: kún fún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan pọ̀ ní inú ẹnìkan tàbí ohun kan.
- source_word: ἁρπαγῆς
  choice: ìwọra
  rationale: Ó mú ìfẹ́ láti fi agbára tàbí àìṣòdodo gba ohun ẹni mìíràn jáde gẹ́gẹ́ bí ìwà inú; àlàyé ìsàlẹ̀ pa ìtumọ̀ tó túbọ̀ ṣe pàtó mọ́.
- source_word: πονηρίας
  choice: ìwà búburú
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ìwà ibi tó gbòòrò àti agbára ìbáwí náà jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Ohun tí “inú” ń tọ́ka sí nínú àkàwé náà
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí “inú yín,” láì sọ pé “ọkàn yín” tàbí “èrò-inú yín.”
  alternative: “ọkàn yín kún fún ìwọra àti ìwà búburú”
  rationale: Gíríìkì mọ̀ọ́mọ̀ fi mímọ́ òde wé ìbàjẹ́ inú. Pípa “inú” mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ti ẹ̀mí tí kò sí ní pàtó sínú ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ìwà rere-búburú ti ἁρπαγή
  choice: Lo “ìwọra” nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì tọ́ka sí jíjà, ìfi-agbára-gbà, tàbí ìrẹ́jẹ.
  alternative: “jíjà,” “ìfi-agbára-gbà,” tàbí “ìrẹ́jẹ” nínú ọ̀rọ̀ pàtàkì
  rationale: Ní àyíká ọ̀rọ̀ yìí, Jésù ń bá ìwà búburú inú wí, kì í ṣe pé ó ń sọ nípa ìṣẹ̀lẹ̀ ọ̀daràn kan ṣoṣo. “Ìwọra” mú èyí hàn, ṣùgbọ́n àlàyé náà pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. “Ẹ̀yin” ni a lò láti pa ìtẹnumọ́ Gíríìkì mọ́, “ń fọ ... mọ́” sì mú àwòrán fífọ ohun èlò ṣe kedere.
