  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: yo
  text: Lẹ́yìn tí ó jáde kúrò níbẹ̀, àwọn akọ̀wé àti àwọn Farisí bẹ̀rẹ̀ sí í hùwà ọ̀tá sí i gidigidi, wọ́n sì bẹ̀rẹ̀ sí í mú un sọ̀rọ̀ nípa ọ̀pọ̀ ọ̀ràn,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wọ́n ń fi ìbéèrè líle yẹ̀ ẹ́ wò,” tàbí “wọ́n ń mú un dáhùn lójijì.” Ọ̀rọ̀ Gíríìkì náà ṣọ̀wọ́n, ó sì dà bí ẹni pé ó ń sọ nípa fífi ìkanra fa àwọn ìdáhùn jáde lẹ́nu rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Nígbà tí ó sì jáde kúrò níbẹ̀
  rationale: Gbólóhùn yìí so ìṣẹ̀lẹ̀ tuntun mọ́ ibi tí ó ti wà, ó sì fi hàn pé jíjáde rẹ̀ ṣẹlẹ̀ ṣáájú ohun tí àwọn akọ̀wé àti Farisí ṣe.
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó mú ìtumọ̀ ìbẹ̀rẹ̀ ìṣe tí ó wà nínú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ tí a ti mọ̀ sí ẹ̀ka àwọn amòfin àti olùkọ́ Òfin nínú àyíká Ìhìn Rere, láìfi àlàyé iṣẹ́ wọn kún ọ̀rọ̀ orísun.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ni a mú wọ Yorùbá ní ọ̀nà tí ó ti wọ́pọ̀.
- source_word: δεινῶς ἐνέχειν
  choice: kọjú ìjà sí i gidigidi
  rationale: Àpapọ̀ ọ̀rọ̀ náà ń tọ́ka sí ìwà ọ̀tá líle àti fífi ipá ọ̀rọ̀ lé ẹni; yíyan yìí jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ orísun mọ́.
- source_word: ἀποστοματίζειν αὐτόν
  choice: ń ... mú un sọ̀rọ̀
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣọ̀wọ́n, ó sì lè túmọ̀ sí fífi ìbéèrè tàbí ìmúnibínú fa ọ̀rọ̀ jáde lẹ́nu ẹni. Ìtumọ̀ àkọ́kọ́ kò pinnu ọ̀nà náà ju ohun tí orísun sọ lọ.
- source_word: περὶ πλειόνων
  choice: fi ọ̀pọ̀lọpọ̀ ọ̀ràn
  rationale: Ó ń tọ́ka sí ọ̀pọ̀ kókó tàbí ọ̀ràn, kì í ṣe dandan pé ó ń fi iye kan wé òmíràn.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “kọjú ìjà sí i gidigidi” láti fi ìwà ọ̀tá àti ìkanra hàn, a sì fi àìdánilójú ọ̀rọ̀ ἀποστοματίζειν pamọ́ sínú àlàyé ìsàlẹ̀.
