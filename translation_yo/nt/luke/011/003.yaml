  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: yo
  text: Máa fún wa ní ọjọ́ kọ̀ọ̀kan ní búrẹ́dì wa tí a nílò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí ‘búrẹ́dì fún ọjọ́ tí ń bọ̀,’ ‘búrẹ́dì ojoojúmọ́,’ tàbí, èyí tí ó ṣeé ṣe kéré níbí, ‘búrẹ́dì tí ó ga ju ohun àdánidá lọ.’ Ọ̀rọ̀ ajẹtífù Gíríìkì náà ṣọ̀wọ́n, ìtumọ̀ rẹ̀ sì jẹ́ àríyànjiyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: oúnjẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ ní pàtó sí ‘àkàrà,’ ó lè dúró fún ohun ìgbẹ́mìíró ní àyíká àdúrà yìí. ‘Oúnjẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú ìtumọ̀ yẹn dé ọ̀dọ̀ òǹkàwé kedere.
- source_word: ἡμῶν
  choice: wa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tí ó bá ‘oúnjẹ’ mu.
- source_word: ἐπιούσιον
  choice: ojoojúmọ́
  rationale: Ọ̀rọ̀ àpèjúwe Gíríìkì yìí ṣọ̀wọ́n, ìtumọ̀ rẹ̀ sì ń fa àríyànjiyàn. Nínú Lúùkù, τὸ καθ’ ἡμέραν tẹnumọ́ ìpèsè ọjọ́ dé ọjọ́, nítorí náà ‘ojoojúmọ́’ jẹ́ yíyan tó ṣe kedere, nígbà tí àkọ́lé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
- source_word: δίδου
  choice: Máa fún
  rationale: Àṣẹ àsìkò ìsinsìnyí lè fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe déédéé hàn. ‘Máa fún’ mú ìtumọ̀ ìtẹ̀síwájú yìí jáde lọ́nà àdánidá.
- source_word: ἡμῖν
  choice: wa
  rationale: Ohun tí ìṣe ‘fún’ tọ́ sí ní tààrà.
- source_word: τὸ καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Gbólóhùn yìí fi ìpèsè tí a ń rí ní ọjọ́ kọ̀ọ̀kan hàn, ó sì pa ìtẹnumọ́ Lúùkù mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐπιούσιον nínú Àdúrà Olúwa
  choice: ojoojúmọ́
  alternative: tí ọjọ́ tí ń bọ̀; tí a nílò; tí ó ga ju ohun ti ara lọ
  rationale: Ọ̀rọ̀ náà ṣọ̀wọ́n, ìtumọ̀ rẹ̀ sì kò dájú. Gbólóhùn Lúùkù τὸ καθ’ ἡμέραν ṣe àtìlẹ́yìn fún ìtumọ̀ ìpèsè ojoojúmọ́, ṣùgbọ́n àkọ́lé ìsàlẹ̀ pa àìdánilójú ojúlówó náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan múlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. Àtúnṣe ‘Máa fún’ pa ìṣe tí ń bá a lọ mọ́, ‘lójoojúmọ́’ sì tẹnumọ́ ọjọ́ kọ̀ọ̀kan.
