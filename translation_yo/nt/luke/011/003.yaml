review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú àṣẹ ìsinsìnyí δίδου, ẹni-àkọ́kọ́ púpọ̀ ‘wa,’ àti ìtẹ̀síwájú τὸ καθ’ ἡμέραν wá. Síbẹ̀, ‘oúnjẹ’ gbooro ju ἄρτος (‘búrẹ́dì’) lọ, àti lílo ‘ojoojúmọ́’ pẹ̀lú ‘lójoojúmọ́’ nínú ọ̀rọ̀ kan dun bí ìtúnwí tí kò rọrùn. Àtúnṣe náà pa àwọn ìlànà méjèèjì mọ́ ní ọ̀nà tí ó túbọ̀ hàn gbangba.
  naturalness: ‘Máa fún wa ní oúnjẹ ojoojúmọ́ wa lójoojúmọ́’ kò rọrùn nínú Yorùbá òde òní, nítorí ‘ojoojúmọ́’ àti ‘lójoojúmọ́’ tún ọ̀rọ̀ kan náà ṣe lẹ́gbẹ̀ẹ́ ara wọn. ‘Máa fún wa ní ọjọ́ kọ̀ọ̀kan ní búrẹ́dì wa tí a nílò’ jẹ́ àdúrà tí ó dára síi, ó sì ń ka ní ti ẹ̀dá.
  terminology: ‘Búrẹ́dì’ pa ἄρτος mọ́ ní pàtó, láìjẹ́ kí òǹkàwé Yorùbá ro ‘àkàrà.’ ‘Tí a nílò’ jẹ́ ìtumọ̀ Yorùbá adayeba fún ìtumọ̀ kan tí ó ṣeé ṣe fún ἐπιούσιον; àkọsílẹ̀ ìsàlẹ̀ ń tọ́ka sí ‘fún ọjọ́ tí ń bọ̀’ àti àwọn ìtumọ̀ mìíràn, nítorí náà kò sọ ìtumọ̀ àríyànjiyàn kan di ìdánilójú.
  issues:
  - severity: medium
    issue: ‘oúnjẹ’ dipo ‘búrẹ́dì’
    rationale: ἄρτον jẹ́ ‘bread’ ní pàtó. Bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí ohun ìgbẹ́mìíró ní àyíká yìí, ‘búrẹ́dì’ ń pa ọ̀rọ̀ ìpilẹ̀ mọ́ dáadáa, ó sì yà kúrò nínú ‘àkàrà,’ tí ó lè ní ìtumọ̀ pàtó mìíràn ní Yorùbá.
  - severity: medium
    issue: Ìtúnwí ‘ojoojúmọ́ ... lójoojúmọ́’ kò rọrùn
    rationale: Gíríìkì náà ní ἐπιούσιον àti τὸ καθ’ ἡμέραν, ṣùgbọ́n ìtumọ̀ wọn méjèèjì gẹ́gẹ́ bí ‘ojoojúmọ́’ nínú Yorùbá dá ìtúnwí tí ó wúwo sílẹ̀. Yíyan ‘tí a nílò’ fún ọ̀rọ̀ àríyànjiyàn náà, àti ‘ní ọjọ́ kọ̀ọ̀kan’ fún τὸ καθ’ ἡμέραν, ń pa ìyàtọ̀ girama àti àìdánilójú ọ̀rọ̀ náà mọ́.
  - severity: low
    issue: ‘Ọ̀rọ̀ àpèjúwe’ nínú àkọsílẹ̀ ìsàlẹ̀
    rationale: ἐπιούσιον jẹ́ ọ̀rọ̀ ajẹtífù; ‘ọ̀rọ̀ ajẹtífù Gíríìkì náà’ jẹ́ ìsọ̀rọ̀ Yorùbá tó péye síi.
