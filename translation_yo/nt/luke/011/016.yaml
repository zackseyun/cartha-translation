id: LUK.11.16
reference: Luke 11:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn mìíràn, láti dán án wò, ń béèrè àmì kan láti ọ̀run lọ́wọ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì ọ̀run kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: àwọn mìíràn
  rationale: Ó fi ẹgbẹ́ yìí yàtọ̀ sí àwọn tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘others’ ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ìṣe ẹgbẹ́ yìí àti ohun tí ó ṣáájú.
- source_word: πειράζοντες
  choice: láti dán án wò
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí fífi Jésù sí àdánwò pẹ̀lú ète tí kò dára; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: σημεῖον
  choice: àmì kan
  rationale: ‘Àmì’ pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láìfi ‘iṣẹ́ ìyanu’ kún un níbi tí ọ̀rọ̀ náà kò ti sọ bẹ́ẹ̀ ní tààrà.
- source_word: ἐξ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó tọ́ka sí ibi tí àmì náà ti wá tàbí ìfọwọ́sí rẹ̀ láti ọ̀run.
- source_word: ἐζήτουν
  choice: ń béèrè
  rationale: Àmì àkókò aláìparí náà fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; ‘ń béèrè’ mú èyí jáde ní Yorùbá àdánidá.
- source_word: παρ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: Pẹ̀lú àpólà ìbéèrè ní Yorùbá, ‘béèrè ... lọ́wọ́ rẹ̀’ fi Jésù hàn gẹ́gẹ́ bí ẹni tí wọ́n ń béèrè àmì náà lọ́wọ́ rẹ̀.
theological_decisions:
- issue: Irú àmì tí wọ́n béèrè
  choice: àmì kan láti ọ̀run
  alternative: àmì ọ̀run kan
  rationale: Ìtumọ̀ yìí pa èrò orísun tàbí ìfọwọ́sí láti ọ̀run mọ́, láìdá ìdí pàtó tàbí ẹ̀kọ́ ìsìn mìíràn lé ọ̀rọ̀ Gíríìkì lórí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
