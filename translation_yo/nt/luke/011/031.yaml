id: LUK.11.31
reference: Luke 11:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: yo
  text: Ayaba Gúúsù yóò dìde nígbà ìdájọ́ pẹ̀lú àwọn ọkùnrin ìran yìí, yóò sì dá wọn lẹ́bi[a], nítorí ó wá láti ìkángun ilẹ̀ ayé láti gbọ́ ọgbọ́n Sólómọ́nì; ẹ wò ó[b], ohun kan tí ó tóbi ju Sólómọ́nì lọ wà níhìn-ín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni ẹni tí a sábà máa ń pè ní Ayaba Ṣébà (wo 1 Àwọn Ọba 10:1–13; 2 Kíróníkà 9:1–12).
    reason: cross_reference
  - marker: b
    text: Tàbí, “ẹni kan tí ó tóbi ju Sólómọ́nì lọ.” Gíríìkì lo ọ̀rọ̀ aláìní akọ tàbí abo, tí ó túmọ̀ ní tààrà sí “ohun kan tí ó tóbi ju Sólómọ́nì lọ”; èyí lè tẹnu mọ́ ohun tí ó ju fífi ènìyàn kan wé ẹlòmíràn lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Ayaba Gúúsù
  rationale: Ó tẹ̀ lé gbólóhùn Gíríìkì náà ní tààrà, ó sì pa ìtọ́kasí sí ẹni tí a mọ̀ nínú Májẹ̀mú Láéláé mọ́ láì fi ìdánimọ̀ rẹ̀ sí inú ọ̀rọ̀ pàtàkì.
- source_word: ἐγερθήσεται
  choice: yóò dìde
  rationale: Ó lè túmọ̀ sí dídìde níbi ìdájọ́, ó sì tún pa ìró ìjíǹde ọjọ́ ìkẹyìn mọ́ láì sọ ọ́ di pàtó jù.
- source_word: ἐν τῇ κρίσει
  choice: nígbà ìdájọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìdájọ́ kan tí a mọ̀, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé ìṣẹ̀lẹ̀ náà yóò ṣẹlẹ̀ níbi tàbí ní àkókò ìdájọ́.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: pẹ̀lú àwọn ọkùnrin
  rationale: ἀνδρῶν jẹ́ akọ ní pàtó; ‘àwọn ọkùnrin’ pa ìyàtọ̀ akọ náà mọ́.
- source_word: τῆς γενεᾶς ταύτης
  choice: ìran yìí
  rationale: Ó tọ́ka sí ìran àwọn alájọgbá Jésù, kì í ṣe sáà kan ní gbogbogbòò.
- source_word: κατακρινεῖ αὐτούς
  choice: yóò dá wọn lẹ́bi
  rationale: κατακρίνω lágbára ju ṣíṣe ìdájọ́ lásán lọ; ó túmọ̀ sí fífi ẹ̀bi hàn tàbí dídá lẹ́bi.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: láti òpin ilẹ̀ ayé
  rationale: Èyí jẹ́ àkànlò èdè fún ibi jíjìnnà púpọ̀; ‘ilẹ̀ ayé’ mú ìtumọ̀ gbígbòòrò rẹ̀ jáde.
- source_word: ἀκοῦσαι
  choice: láti gbọ́
  rationale: Àpólà aláìlẹ́ni náà fi ète ìwá rẹ̀ hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: ọgbọ́n Sólómọ́nì
  rationale: Ó jẹ́ ìtumọ̀ kedere, ó sì pa ọgbọ́n mọ́ gẹ́gẹ́ bí ohun tí ayaba náà wá láti gbọ́.
- source_word: ἰδοὺ
  choice: sì kíyèsí i
  rationale: Ó ṣiṣẹ́ gẹ́gẹ́ bí àmì ọ̀rọ̀ tí ń pe àfiyèsí sí gbólóhùn pàtàkì tí ó tẹ̀ lé, ní ìforúkọsílẹ̀ ọ̀wọ̀ Yorùbá.
- source_word: πλεῖον Σολομῶνος
  choice: ohun kan tí ó tóbi ju Sólómọ́nì lọ
  rationale: πλεῖον jẹ́ aláìní akọ tàbí abo ní Gíríìkì; ‘ohun kan’ pa àìdánilójú yẹn mọ́ dípò yíyí i sí ‘ẹni kan.’
- source_word: ὧδε
  choice: wà níhìn-ín
  rationale: Ó sọ wíwà ní ibi yìí ní ọ̀nà Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bóyá kí a sọ Ayaba Gúúsù ní Ayaba Ṣébà ní tààrà
  choice: A pa ‘Ayaba Gúúsù’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ayaba Ṣébà
  rationale: Ìtọ́kasí Májẹ̀mú Láéláé lágbára, ṣùgbọ́n Gíríìkì fúnra rẹ̀ sọ ‘Ayaba Gúúsù’; àlàyé ìsàlẹ̀ ni ó ṣe ìdánimọ̀ tí ó wọ́pọ̀.
- issue: Bóyá πλεῖον Σολομῶνος yẹ kí ó di ẹni kan ní pàtó
  choice: A lò ‘ohun kan tí ó tóbi ju Sólómọ́nì lọ.’
  alternative: ẹni kan tí ó tóbi ju Sólómọ́nì lọ
  rationale: Ìrísí aláìní akọ tàbí abo ti Gíríìkì lè ní agbára tí ó gbòòrò ju ìfiwéra àwọn ènìyàn méjì lọ; a pa ìdọ̀gbà ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Bóyá ἐγερθήσεται yẹ kí ó sọ ìjíǹde ní gbangba
  choice: A lò ‘yóò dìde.’
  alternative: a ó jí i dìde
  rationale: Nínú àyíká ìdájọ́, ọ̀rọ̀ náà lè jẹ́ dídìde láti jẹ́ ẹlẹ́rìí, ó sì lè ní ìró ìjíǹde; ìtumọ̀ náà kò fi ipa mú ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá; ìforúkọsílẹ̀ náà ní ọlá, ó sì ṣeé yé fún òǹkàwé òde òní. A yan ‘kíyèsí i’ fún ἰδού láti pa agbára ìpe àfiyèsí mọ́ láì lo ọ̀rọ̀ àtijọ́ tí ó le.
