id: LUK.11.1
reference: Luke 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń gbàdúrà ní ibi kan, nígbà tí ó dáwọ́ dúró, ọ̀kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀ sọ fún un pé, “Olúwa, kọ́ wa láti máa gbàdúrà, gẹ́gẹ́ bí Jòhánù náà ti kọ́ àwọn ọmọ-ẹ̀yìn rẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá òde òní tó bá ìlànà ìtàn Lúùkù mu, ó sì pa iṣẹ́ καί mọ́ nípasẹ̀ “sì,” láì lo ọ̀rọ̀ àtijọ́ tàbí èdè líle.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: bí ó ti ń gbàdúrà
  rationale: Ọ̀rọ̀ yìí fi hàn pé iṣẹ́ àdúrà náà ń lọ lọ́wọ́ ní àkókò ìṣẹ̀lẹ̀ náà; “ti ń” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν τόπῳ τινὶ
  choice: ní ibì kan
  rationale: Ó pa àìsọ pàtó ibi náà mọ́, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó ṣe kedere ní Yorùbá.
- source_word: ὡς ἐπαύσατο
  choice: nígbà tí ó dáwọ́ dúró
  rationale: “Dáwọ́ dúró” túmọ̀ sí pé ó ṣíwọ́ iṣẹ́ tí ó ń ṣe, èyí tó sún mọ́ ἐπαύσατο ju “parí” lọ, nítorí “parí” lè fi ìmọ̀ pé ó mú ohun gbogbo dé òpin kún un.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: ọ̀kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere jù lọ láti sọ ìtumọ̀ apá kan lára ẹgbẹ́ náà, láì fi ẹni náà hàn bí ẹni pé a mọ̀ ọ́n pàtó.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ọlá àti ìwọ̀n ìtumọ̀ κύριος mọ́ nínú ọ̀rọ̀ tí a ń bá Jésù sọ, láì dín un kù sí olùkọ́ lásán.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: kọ́ wa láti máa gbàdúrà
  rationale: Èyí tẹ̀ lé àkópọ̀ ọ̀rọ̀ Gíríìkì “kọ́ wa láti gbàdúrà”; “máa” mú un dun bí Yorùbá àdánidá, ó sì bá àṣà àdúrà tí a ń ṣe mu.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: gẹ́gẹ́ bí Jòhánù náà ti kọ́ àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Gẹ́gẹ́ bí” mú ìfiwéra καθώς jáde, “náà” sì dúró fún agbára àfikún καί lọ́nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí ọmọ-ẹ̀yìn ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ó pa gbogbo ìwọ̀n ọlá àti àkọlé Kristẹni tó lè wà nínú κύριος mọ́. “Ọ̀gá” lè mú kí ó dà bí ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ nìkan, èyí tí yóò dín àìfìdímúlẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ọ̀rọ̀ òde òní tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbo ènìyàn; a yẹra fún èdè ìjọ kan pàtó àti fún àṣà ọ̀rọ̀ tí ó ti gbó.
