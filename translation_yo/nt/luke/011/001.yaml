  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí gbogbo àwọn ẹ̀yà pàtàkì nínú Gíríìkì: ìṣẹ̀lẹ̀ ìtàn náà, ìṣe àdúrà tí ń lọ, ibi tí a kò sọ pàtó, dídáwọ́, ọmọ-ẹ̀yìn kan, ìpè náà “Olúwa,” àti ìfiwéra sí Jòhánù. “Láti máa gbàdúrà” jẹ́ ìtumọ̀ tí ó ṣeé gbà fún προσεύχεσθαι, bí ó tilẹ̀ jẹ́ pé ó fi ìmọ̀ ìṣe tí ń tẹ̀síwájú hàn díẹ̀.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tó ní ìgbọ́gbọ̀n, tí àwọn àmì ohùn rẹ̀ sì péye ní gbogbogbòò. Àmọ́, “ní ibì kan” kò yẹ níhìn-ín; “ní ibi kan” ni ìkọ̀wé boṣewa fún “in a certain place.” Àmi ìdákẹ́jẹ lẹ́yìn “pé” tún mú ìbẹ̀rẹ̀ gbólóhùn náà rọrùn láti ka.
  terminology: “Olúwa,” “ọmọ-ẹ̀yìn,” “gbàdúrà,” àti “Jòhánù” yẹ, wọ́n sì bá ìlò Yorùbá nínú ọ̀rọ̀ ìwé mímọ́ òde òní mu. “Gẹ́gẹ́ bí Jòhánù náà ti kọ́...” pa ipá àfikún καί mọ́ láì yí ẹni tí “náà” ń tọ́ka sí pa dà.
