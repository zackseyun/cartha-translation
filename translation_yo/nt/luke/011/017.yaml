source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: yo
  text: Ṣùgbọ́n òun, ní mímọ̀ èrò inú wọn, ó wí fún wọn pé, “Gbogbo ìjọba tí ó pínyà sí ara rẹ̀ di ahoro, ilé kan sì ń wó sórí ilé kan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdílé kan ń ṣubú sórí ìdílé kan.” Ọ̀rọ̀ Gíríìkì náà, οἶκος, lè túmọ̀ sí ilé tàbí ìdílé.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: níwọ̀n bí ó ti mọ
  rationale: Ó fi ìmọ̀ tí ó ní nípa èrò inú wọn hàn, ó sì so ọ́ mọ́ ọ̀rọ̀-ìṣe pàtàkì ní Yorùbá àdánidá.
- source_word: διανοήματα
  choice: èrò inú
  rationale: Ó tọ́ka sí ìrònú tàbí ìgbèrò tí ó wà lọ́kàn, láì fi ète búburú kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Πᾶσα βασιλεία
  choice: Gbogbo ìjọba
  rationale: Ó pa agbára ọ̀rọ̀ àpapọ̀ πᾶσα mọ́ nínú òwe gbogbogbò yìí.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: tí ó bá pínyà sí ara rẹ̀
  rationale: Ó sọ ìyapa inú àti ìtakò sí ara ẹni ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐρημοῦται
  choice: yóò di ahoro
  rationale: Ó mú ìparun àti ìsọdahoro tí ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí jáde; ọ̀nà ọjọ́ iwájú bá àbájáde òwe náà mu ní Yorùbá.
- source_word: οἶκος ἐπὶ οἶκον
  choice: ilé kan sì ń wó lé ilé mìíràn
  rationale: Ó pa àwòrán ilé mọ́, ó sì fi ìtumọ̀ ἐπί gẹ́gẹ́ bí ‘lé/lórí’ hàn, nígbà tí ó jẹ́ gbolohun Yorùbá tí ó ṣeé kà.
- source_word: πίπτει
  choice: ń wó
  rationale: Fún ilé, ‘wó’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣubú tàbí ìwópalẹ̀, ó sì pa ìṣe àsìkò-ìsinsìnyí ti òwe náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ οἶκος nínú apá kejì òwe náà
  choice: ilé
  alternative: agbo ilé / ìdílé
  rationale: οἶκος lè túmọ̀ sí ilé gẹ́gẹ́ bí ohun tí a kọ́ tàbí àwọn ará ilé. Àkọ́kọ́ pa àwòrán gangan àti àìdájú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àwùjọ rẹ̀ sílẹ̀ fún olùkà.
- issue: Bóyá ἐρημοῦται jẹ́ ìṣe tàbí àbájáde
  choice: yóò di ahoro
  alternative: a sọ ọ́ di ahoro
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ passive ní ìrísí, ṣùgbọ́n ó lè ṣàpèjúwe bí ìjọba náà ṣe parun. ‘Yóò di ahoro’ kò yan olùṣe kan tí ẹsẹ̀ náà kò dárúkọ, ó sì pa àbájáde líle náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘èrò inú’ àti ‘di ahoro’ fún ìtumọ̀ tó ṣe kedere sí òǹkàwé gbogbogbò, a sì pa àwòrán òwe náà mọ́.
