  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ jùlọ nínú ìtumọ̀ Gíríìkì wá dáadáa: ìmọ̀ Jesu nípa èrò inú wọn, òwe nípa ìjọba tí ó pín sí ara rẹ̀, àti àbájáde ìparun. Ṣùgbọ́n ‘níwọ̀n bí’ ń fi ìdí tàbí ìfẹ̀sẹ̀mulẹ̀ hàn (‘since/because’), níbi tí εἰδὼς ti jẹ́ apá-ìṣe tí ó ṣàpèjúwe Jesu. A tún ṣe gbolohun ìkẹyìn ní ọ̀nà tí ‘upon/on’ nínú ἐπὶ lè hàn kedere.'
