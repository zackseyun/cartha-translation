  terminology: ‘Èrò inú,’ ‘ìjọba,’ ‘pínyà sí ara rẹ̀,’ àti ‘di ahoro’ yẹ, wọ́n sì bá ọ̀rọ̀ àti ìpele ọ̀rọ̀ ẹsẹ̀ náà mu. A pa ‘ilé’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì fi ‘ìdílé’ sí ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí οἶκος lè ní.
