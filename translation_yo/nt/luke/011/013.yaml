  source_fidelity: Ìtumọ̀ náà pa àwọn ẹ̀yà pàtàkì Gíríìkì mọ́—ipò ènìyàn búburú, ẹ̀bùn rere fún àwọn ọmọ, Baba láti ọ̀run, àti Ẹ̀mí Mímọ́ fún àwọn tí ń béèrè lọ́wọ́ rẹ̀. Síbẹ̀, ọ̀nà ìfiwéra ‘mélòó mélòó ni ... yóò fi’ kò dáa ní Yorùbá nínú gbolóhùn yìí, ó sì lè dà bí ìbéèrè iye. Àtúnṣe náà mú ìjiyàn ‘how much more’ hàn kedere láì yí ìtumọ̀ padà.
  naturalness: ‘Bí ẹ̀yin tí ẹ jẹ́ ẹni búburú bá mọ bí a ti ń fi...’ jẹ́ gbolóhùn tí kò rọrùn tó, nítorí ‘ẹni’ jẹ́ ẹyọ kan, ‘bí a ti ń fi’ sì kéré sí ìtumọ̀ ‘know how to give.’ ‘Bí ẹ̀yin, bí ó tilẹ̀ jẹ́ pé ẹ jẹ́ ènìyàn búburú, ṣe mọ̀ bí ẹ ṣe lè fún...’ jẹ́ èdè Yorùbá boṣewa tí ó mọ́gbọ́n dání, tí ó sì pa agbára ìyọ̀ǹda/concessive ti participle Gíríìkì mọ́.
