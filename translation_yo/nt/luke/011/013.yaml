id: LUK.11.13
reference: Luke 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: yo
  text: Nítorí náà, bí ẹ̀yin, bí ó tilẹ̀ jẹ́ pé ẹ jẹ́ ènìyàn búburú, ṣe mọ̀ bí ẹ ṣe lè fún àwọn ọmọ yín ní ẹ̀bùn rere, mélòó mélòó ni Baba láti ọ̀run[a] yóò ha túbọ̀ fún àwọn tí ń bẹ̀ ẹ́ ní Ẹ̀mí Mímọ́![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ Gẹ̀ẹ́sì kan ka á sí ‘Baba yín tí ń bẹ ní ọ̀run,’ ní ìfarajọ Mátíù 7:11; ṣùgbọ́n èdè Gíríìkì Lúùkù ní ‘Baba láti ọ̀run.’
    reason: alternative_reading
  - marker: b
    text: Mátíù 7:11 ní ‘ohun rere’ níbi tí Lúùkù ti ní ‘Ẹ̀mí Mímọ́’; èyí pa ọ̀rọ̀ ọ̀tọ̀ ti Ìwé Ìhìn Rere kọ̀ọ̀kan mọ́.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: bí ẹ̀yin tí ẹ jẹ́ ẹni búburú
  rationale: 'Ó pa ìtumọ̀ àpèjúwe tí ó tún ní agbára ìyọ̀ǹda mọ́: àwọn olùgbọ́ jẹ́ ẹni búburú, síbẹ̀ wọ́n lè fún ọmọ ní ohun rere.'
- source_word: οἴδατε ... διδόναι
  choice: mọ bí a ti ń fi ... fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìmọ̀ tàbí agbára láti ṣe ohun kan.
- source_word: δόματα ἀγαθὰ
  choice: ẹ̀bùn rere
  rationale: Ẹ̀bùn túmọ̀ δόματα ní pàtó ju ọ̀rọ̀ gbogbogbò bí ‘ohun’ lọ, rere sì pa ànímọ́ ἀγαθὰ mọ́.
- source_word: τέκνοις ὑμῶν
  choice: àwọn ọmọ yín
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún àwọn ọmọ nínú àjọṣe ìdílé.
- source_word: πόσῳ μᾶλλον
  choice: mélòó mélòó ni
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìfiwéra láti ohun kékeré sí ohun tí ó pọ̀ jù hàn ní kedere.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Baba láti ọ̀run
  rationale: Ó tẹ̀ lé ἐξ οὐρανοῦ, ‘láti ọ̀run,’ kò sì fi ‘yín’ kún un tàbí mú un bá Mátíù 7:11 mu.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká Lúùkù, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Ọlọ́run, kì í ṣe ẹ̀mí mímọ́ kan lásán.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: àwọn tí ń béèrè lọ́wọ́ rẹ̀
  rationale: Ó tú participle ìsinsìnyí náà lọ́nà Yorùbá àdánidá, ó sì pa ọ̀rọ̀ arọ́pò-orúkọ αὐτόν mọ́.
theological_decisions:
- issue: Ìtọ́kasí πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí mímọ́ kan
  rationale: Àyíká Lúùkù fi Ẹ̀mí Ọlọ́run hàn gẹ́gẹ́ bí ẹ̀bùn tí Baba ń fúnni; lílo orúkọ pàtó kò fi ohun tí kò sí nínú ẹsẹ̀ náà kún un.
- issue: Ìbáṣepọ̀ pẹ̀lú Mátíù 7:11
  choice: Pa ọ̀rọ̀ Lúùkù ‘Baba láti ọ̀run’ àti ‘Ẹ̀mí Mímọ́’ mọ́
  alternative: Mú un bá Mátíù mu gẹ́gẹ́ bí ‘Baba yín tí ń bẹ ní ọ̀run’ àti ‘ohun rere’
  rationale: Ẹ̀rí Gíríìkì Lúùkù ní ọ̀rọ̀ tirẹ̀, ó sì yẹ kí ìtumọ̀ má ṣe pa ìyàtọ̀ ìwé Ìhìn Rere méjèèjì rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹni búburú’ jẹ́ ọ̀rọ̀ taara ṣùgbọ́n tí ó ṣeé lóye; ‘mélòó mélòó ni’ mú ìjiyàn a fortiori náà dun bí Yorùbá àdánidá. Àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
