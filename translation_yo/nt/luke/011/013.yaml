  to: Nítorí náà, bí ẹ̀yin, bí ó tilẹ̀ jẹ́ pé ẹ jẹ́ ènìyàn búburú, ṣe mọ̀ bí ẹ ṣe lè fún àwọn ọmọ yín ní ẹ̀bùn rere, mélòó mélòó ni Baba láti ọ̀run[a] yóò ha túbọ̀ fún àwọn tí ń bẹ̀ ẹ́ ní Ẹ̀mí Mímọ́![b]
  rationale: 'Àtúnṣe náà ṣe gbolóhùn náà ní Yorùbá boṣewa tó rọrùn, ó sì tìlẹ̀ mọ́ èdè Gíríìkì: ‘bí ó tilẹ̀ jẹ́ pé’ ń fi ipò concessive ti πονηροὶ ὑπάρχοντες hàn; ‘mọ̀ bí ẹ ṣe lè fún’ ń tú οἴδατε ... διδόναι; ‘mélòó mélòó ni ... yóò ha túbọ̀’ ń gbé πόσῳ μᾶλλον jáde. A kò fi ‘yín’ kún ‘Baba láti ọ̀run,’ a kò sì mú Ẹ̀mí Mímọ́ bá ‘ohun rere’ ti Mátíù mu.'
