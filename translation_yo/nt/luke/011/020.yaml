  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa: ó pa ipò àídájú náà mọ́, ó túmọ̀ ἐν δακτύλῳ θεοῦ gẹ́gẹ́ bí ohun èlò/agbára, ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ tí ἔφθασεν ń sọ pé ó ti ṣẹlẹ̀ mọ́. Àmọ́, ἄρα jẹ́ àmì ìfẹ̀hùnṣọ̀kan ìrònú ju àmì àkókò lọ; ‘ní ìdí èyí’ dá a hàn dáadáa ju ‘nígbà náà’ lọ.'
