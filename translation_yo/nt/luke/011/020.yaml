id: LUK.11.20
reference: Luke 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá fi ìka Ọlọ́run[a] lé àwọn ẹ̀mí èṣù jáde, ní ìdí èyí, ìjọba Ọlọ́run ti dé bá yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìka Ọlọ́run.” Gbólóhùn yìí jẹ́ àwòrán agbára Ọlọ́run tí ó ń ṣiṣẹ́ ní tààrà, ó sì rántí Ẹ́ksódù 8:19.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti dé ọ̀dọ̀ yín” tàbí “ti lé yín bá.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: fi ìka Ọlọ́run
  rationale: Èyí pa àwòrán ‘ìka Ọlọ́run’ mọ́, ó sì lo ‘fi’ láti fi hàn pé agbára tàbí ohun èlò Ọlọ́run ni iṣẹ́ náà fi ń ṣẹlẹ̀. Ó tún jẹ́ kí ìtumọ̀ náà rántí Ẹ́ksódù 8:19 láì tú àwòrán náà sí ọ̀rọ̀ míì.
- source_word: ἐκβάλλω
  choice: lé ... jáde
  rationale: ‘Lé ... jáde’ jẹ́ ọ̀nà Yorùbá àdánidá fún yíyọ ẹ̀mí búburú kúrò, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àwọn ẹ̀dá ẹ̀mí búburú tí δαιμόνια ń tọ́ka sí; a kò fi ‘àwọn ẹ̀mí àìmọ́’ rọ́pò rẹ̀ nítorí pé gbólóhùn Gíríìkì mìíràn ni ìyẹn ń túmọ̀.
- source_word: ἄρα
  choice: nígbà náà
  rationale: Ó fi ìparí ọgbọ́n tí ó jáde láti inú gbólóhùn àídájú hàn ní Yorùbá àdánidá.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: ti dé bá yín
  rationale: ‘Ti dé’ fi dídé tí ó ti ṣẹlẹ̀ hàn, ‘bá yín’ sì pa ìdarí dídé náà sí ọ̀dọ̀ àwọn olùgbọ́ mọ́ láì mú un dún bí ìdájọ́ nìkan.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì lè gba èrò ilẹ̀ ọba àti ìṣàkóso Ọlọ́run pọ̀ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
theological_decisions:
- issue: Ìtumọ̀ ‘ìka Ọlọ́run’
  choice: A pa á mọ́ gẹ́gẹ́ bí àwòrán agbára àti iṣẹ́ tààrà Ọlọ́run nínú bí Jésù ṣe ń lé àwọn ẹ̀mí èṣù jáde.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí Ẹ̀mí Mímọ́ nítorí ìfiwéra pẹ̀lú Mátíù 12:28.
  rationale: Lúùkù lo àwòrán ‘ìka Ọlọ́run’; ìtumọ̀ náà gbọ́dọ̀ pa ọ̀rọ̀ tirẹ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ẹ́ksódù mọ́, láì fi ọ̀rọ̀ Mátíù rọ́pò rẹ̀.
- issue: Agbára ọ̀rọ̀ ‘ìjọba Ọlọ́run ti dé bá yín’
  choice: Ó kéde pé ìjọba Ọlọ́run ti bẹ̀rẹ̀ sí í dé ní ti gidi nínú iṣẹ́ Jésù.
  alternative: Pé ìjọba náà jẹ́ ohun ọjọ́ iwájú nìkan, tàbí pé gbólóhùn náà túmọ̀ sí ìdájọ́ tí ó ti lé wọn bá nìkan.
  rationale: ἔφθασεν fi dídé tí ó ti ṣẹlẹ̀ hàn nínú àyíká yíyọ àwọn ẹ̀mí èṣù; ‘ti dé bá yín’ pa ìdí pàtàkì yìí mọ́ láì pinnu gbogbo ẹ̀kọ́ nípa òpin ayé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A fi àmì ohùn sí ọ̀rọ̀ ní kíkún. ‘Fi ... lé ... jáde’ jẹ́ àkójọpọ̀ ọ̀rọ̀ àdánidá; ‘ti dé bá yín’ sì pa ìtumọ̀ dídé tó ti ṣẹlẹ̀ mọ́ láì mú gbólóhùn náà dún bí ewu nìkan.
