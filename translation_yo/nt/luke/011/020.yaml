  to: Ṣùgbọ́n bí mo bá fi ìka Ọlọ́run[a] lé àwọn ẹ̀mí èṣù jáde, ní ìdí èyí, ìjọba Ọlọ́run ti dé bá yín[b].
  rationale: A rọ́pò ‘nígbà náà’ pẹ̀lú ‘ní ìdí èyí’ láti fi ipá ìfẹ̀hùnṣọ̀kan ti ἄρα hàn ní Yorùbá. A pa gbogbo àwọn ìpinnu ìtumọ̀ pàtàkì míì mọ́, pẹ̀lú àwòrán ‘ìka Ọlọ́run,’ ọ̀rọ̀ ìlé-ẹ̀mí ‘lé ... jáde,’ àti ìkéde pé ìjọba Ọlọ́run ti dé bá àwọn olùgbọ́.
