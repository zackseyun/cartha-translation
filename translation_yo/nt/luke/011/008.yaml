id: LUK.11.8
reference: Luke 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: yo
  text: Mo sọ fún yín, bí ó tilẹ̀ jẹ́ pé kò ní dìde láti fún un ní ohunkóhun nítorí pé ọ̀rẹ́ rẹ̀ ni, síbẹ̀ nítorí ìforítì rẹ̀ tí kò mọ ìtìjú[a], yóò dìde, yóò sì fún un ní ohun gbogbo tí ó nílò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nítorí ìgboyà rẹ̀,” “nítorí ìwà àfojúdi rẹ̀,” tàbí, ní ìtumọ̀ gangan jù, “nítorí àìní ìtìjú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ọ̀rọ̀ ìfìdí-múlẹ̀ Jésù hàn, ó sì pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: bí ó tilẹ̀ jẹ́ pé kò ní dìde láti fún un ní ohunkóhun
  rationale: “Bí ó tilẹ̀ jẹ́ pé” mú ìtumọ̀ ìyọ̀ǹda εἰ καί jáde. “Dìde” bá ipò ẹni tí ó wà lórí ibùsùn mu, a sì fi “ohunkóhun” kún un gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ láti inú àyíká ọ̀rọ̀.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: nítorí pé ọ̀rẹ́ rẹ̀ ni
  rationale: Ìtumọ̀ yìí pa ìdí tí gbólóhùn náà ń sọ àti ìbáṣepọ̀ ara ẹni tí φίλος tọ́ka sí mọ́.
- source_word: διά γε τὴν ἀναίδειαν αὐτοῦ
  choice: síbẹ̀ nítorí ìforítì aláìníjú rẹ̀
  rationale: “Síbẹ̀” mú ìyípadà ìtẹnumọ́ διά γε jáde. “Ìforítì aláìníjú” pa etí líle ti ἀναίδεια (“àìnítìjú”) mọ́, ó sì sọ bí ìbéèrè tí kò jáwọ́ ṣe rí nínú àyíká ọ̀rọ̀ náà.
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: yóò dìde, yóò sì fún un
  rationale: Nínú ìṣẹ̀lẹ̀ ilé yìí, ἐγερθεὶς túmọ̀ sí dídìde kúrò ní ibùsùn; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá.
- source_word: ὅσων χρῄζει
  choice: gbogbo ohun tí ó nílò
  rationale: Èyí mú ìtumọ̀ iye gbogbo ohun tí ẹni náà nílò jáde ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἀναίδεια nínú àkàwé náà
  choice: ìforítì aláìníjú
  alternative: ìgboyà; ìwà àfojúdi; àìnítìjú
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìpilẹ̀ ti àìní ìtìjú tàbí àìka ohun tí àwùjọ kà sí bó ṣe yẹ sí, ṣùgbọ́n nínú àyíká yìí ó kan ìbéèrè tí ẹni náà ń fi taratara tẹ̀ síwájú láìtìjú. A pa agbára ọ̀rọ̀ náà mọ́ láìsọ ọ́ di ẹ̀kọ́ pé ìwà àfojúdi fúnra rẹ̀ ni a ń yìn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé navnav.
