id: LUK.11.4
reference: Luke 11:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: yo
  text: Kí o sì dárí àwọn ẹ̀ṣẹ̀ wa jì wá, nítorí àwa fúnra wa pẹ̀lú ń dárí ji gbogbo ẹni tí ó jẹ wá ní gbèsè.[a] Má sì mú wa wọ inú ìdẹwò.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀ Gíríìkì níbí lo èdè gbèsè: “gbogbo ẹni tí ó jẹ wá ní gbèsè,” bí ó tilẹ̀ jẹ́ pé “ẹ̀ṣẹ̀” ni abala àkọ́kọ́ sọ.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdánwò” tàbí “àdánwò.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: dárí … jì wá
  rationale: Nínú àdúrà, ọ̀rọ̀ yìí túmọ̀ sí fífi ẹ̀ṣẹ̀ jì; gbólóhùn Yorùbá “dárí … jì” jẹ́ ọ̀nà àdánidá láti sọ ọ́.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: àwọn ẹ̀ṣẹ̀ wa
  rationale: ἁμαρτίας túmọ̀ sí “ẹ̀ṣẹ̀,” kì í ṣe “gbèsè” nínú abala àkọ́kọ́ yìí; “àwọn” tún fi hàn pé ọ̀rọ̀ náà jẹ́ ọ̀pọ̀.
- source_word: καὶ γὰρ
  choice: nítorí
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń fi ìdí ẹ̀bẹ̀ tó ṣáájú múlẹ̀; “nítorí” ṣe èyí ní Yorùbá àdánidá.
- source_word: αὐτοὶ
  choice: àwa fúnra wa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́; “àwa fúnra wa” pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἀφίομεν
  choice: ń dárí ji
  rationale: Yíyan ọ̀rọ̀ kan náà pẹ̀lú ἄφες pa ìsopọ̀ láàárín ìdáríjì Ọlọ́run àti ti ènìyàn mọ́.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: gbogbo ẹni tí ó jẹ wá ní gbèsè
  rationale: Èyí pa àwòrán gbèsè inú ọ̀rọ̀ Gíríìkì mọ́, kò sì sọ ọ́ di “ẹni tó ṣẹ̀ sí wa” nìkan.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: Má sì mú wa wọ inú ìdẹwò
  rationale: “Mú … wọ inú” tẹ̀lé ìtumọ̀ εἰσφέρω, ìyẹn “mú wọ inú,” ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: πειρασμόν
  choice: ìdẹwò
  rationale: “Ìdẹwò” jẹ́ ìtumọ̀ tó bá àdúrà yìí mu, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ìdánwò tàbí àdánwò; a tọ́ka sí èyí nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀bẹ̀ ìkẹyìn nípa πειρασμός
  choice: Má sì mú wa wọ inú ìdẹwò
  alternative: Má sì mú wa wọ inú ìdánwò
  rationale: A pa ọ̀nà tí Gíríìkì gbà sọ ọ́ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un nípa bí Ọlọ́run ṣe ní í ṣe pẹ̀lú ìdẹwò. Èyí jẹ́ kí ìṣòro àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ náà dúró bí ó ti rí.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Kí o …” fún ẹ̀bẹ̀ àkọ́kọ́ àti “Má …” fún àṣẹ òdì; a sì pa ìyàtọ̀ láàárín “ẹ̀ṣẹ̀” àti èdè “gbèsè” mọ́.
