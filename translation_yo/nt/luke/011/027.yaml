id: LUK.11.27
reference: Luke 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń sọ nǹkan wọ̀nyí, obìnrin kan láti inú ọ̀pọ̀ ènìyàn gbé ohùn rẹ̀ sókè, ó sì wí fún un pé, “Ìbùkún ni fún ilé-ọmọ tí ó gbé ọ[a], àti fún ọmú tí o mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó bí ọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígbé ọmọ nínú oyún tàbí bíbí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó pa ọ̀nà ìyípadà ìtàn Lúùkù mọ́ ní èdè Yorùbá òde òní láì lo gbólóhùn àtijọ́.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: bí ó ti ń sọ nǹkan wọ̀nyí
  rationale: Àmì “ń” fi hàn pé ọ̀rọ̀ rẹ̀ ṣì ń lọ lọ́wọ́, “wọ̀nyí” sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: obìnrin kan ... gbé ohùn rẹ̀ sókè
  rationale: Èyí jẹ́ àdàkọ Yorùbá àdánidá fún ọ̀rọ̀ àpèjúwe Gíríìkì náà, ó sì tú τις sí “kan” láì fi ìtumọ̀ àfikún kún un.
- source_word: ἐκ τοῦ ὄχλου
  choice: láti inú ọ̀pọ̀ ènìyàn
  rationale: Ó sọ orísun tí ohùn náà ti wá ní ọ̀nà tí ó ṣe kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: Μακαρία
  choice: Ìbùkún ni fún
  rationale: Ó fi ipò ẹni tí a ṣe ojúrere sí hàn ju ayọ̀ inú lásán lọ, ó sì yẹ fún ọ̀rọ̀ ọlá yìí.
- source_word: ἡ κοιλία
  choice: ilé-ọmọ
  rationale: Nínú àyíká ọ̀rọ̀ ìyá yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tí ọmọ ti wà nínú ìyá; “ilé-ọmọ” ṣe pàtó ju “inú” lọ.
- source_word: ἡ βαστάσασά σε
  choice: tí ó gbé ọ
  rationale: Ó pa àwòrán gbígbé ọmọ nínú oyún mọ́, láì fi ìbímọ nìkan ṣe ìtumọ̀ ọ̀rọ̀ náà.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: ọmú tí o mu
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti tààrà láti sọ pé Jesu mu ọmú wọ̀nyẹn nígbà ìkókó; ó pa àwòrán ara ìyá mọ́.
theological_decisions:
- issue: Ìtumọ̀ μακαρία nínú ọ̀rọ̀ tí ó ń bu ọlá fún ìyá Jesu
  choice: Ìbùkún ni fún ilé-ọmọ tí ó gbé ọ, àti fún ọmú tí o mu.
  alternative: Ayọ̀ ni fún ilé-ọmọ ... / Oríire ni fún ilé-ọmọ ...
  rationale: “Ìbùkún ni fún” pa agbára ọlá μακαρία mọ́, láì dín ọlá ìyá Jesu kù tàbí fi ẹ̀kọ́ nípa rẹ̀ tí kò sí nínú ẹsẹ yìí kún un.
translation_notes:
  register: Èdè Yorùbá tí ó bófin mu, tí ó ní ọlá ṣùgbọ́n tí ó ṣeé yé fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Gbé ohùn rẹ̀ sókè” jẹ́ àpèjúwe Yorùbá tí ó ṣe kedere, “ọmú tí o mu” sì yẹra fún ìtumọ̀ líle tí kò bá Yorùbá mu.
