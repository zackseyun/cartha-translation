  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: yo
  text: Nígbà tí ó sì dé, ó rí i pé a ti gbá a, a sì ti ṣètò rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti gbá a jáde, a sì ti ṣe é lọ́ṣọ̀ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: nígbà tí ó sì dé
  rationale: Aorist participle náà tọ́ka sí ìpadà ẹ̀mí àìmọ́ inú ẹsẹ tó ṣáájú; gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìsopọ̀ καί mọ́ pẹ̀lú “sì.”
- source_word: εὑρίσκει
  choice: ó rí i pé
  rationale: Ìṣe àsìkò ìsinsìnyí fún ìtàn ní agbára; “ó rí i pé” jẹ́ ọ̀nà Yorùbá àdánidá láti mú gbólóhùn tó ń ṣàlàyé ipò ohun tí a rí wọlé.
- source_word: σεσαρωμένον
  choice: a ti gbá a
  rationale: Ìkọ̀ participle perfect passive fi hàn pé a ti gbá ilé náà, ó sì wà ní ipò yẹn. Ìlò “a ti” jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí a kò dárúkọ tó ṣe iṣẹ́ náà àti àbájáde tó dúró.
- source_word: κεκοσμημένον
  choice: a sì ti ṣètò rẹ̀
  rationale: Nínú àyíká ilé, κοσμέω lè túmọ̀ sí ṣíṣe ohun létòletò tàbí ṣíṣe é lọ́ṣọ̀ọ́. “Ṣètò rẹ̀” bá àyíká ilé mu, ó sì pa ipò àbájáde perfect passive mọ́.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ ń tọ́ka sí
  choice: ó rí i pé a ti gbá a, a sì ti ṣètò rẹ̀
  alternative: ó rí ilé náà pé a ti gbá a, a sì ti ṣètò rẹ̀
  rationale: Gíríìkì kò tún “ilé” sọ ní kedere; arọ́pò-orúkọ Yorùbá pa ṣókí orísun náà mọ́, àyíká ẹsẹ 24 àti 26 sì mú ohun tí ó ń tọ́ka sí yé ni.
- issue: Bóyá κεκοσμημένον túmọ̀ sí ètò tàbí ọ̀ṣọ́
  choice: a ti ṣètò rẹ̀
  alternative: a ti ṣe é lọ́ṣọ̀ọ́
  rationale: Ní ti ilé, ìtumọ̀ ṣíṣe létòletò bá ọ̀rọ̀ mu dáadáa, ṣùgbọ́n ìtumọ̀ ọ̀ṣọ́ jẹ́ ojúlówó àṣàyàn; àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. Arọ́pò-orúkọ “ó” jẹ́ dandan ní Yorùbá, kò sì pinnu àríyànjiyàn nípa jíjẹ́ ènìyàn ti ẹ̀mí náà.
