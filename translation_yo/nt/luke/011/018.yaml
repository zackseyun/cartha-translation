id: LUK.11.18
reference: Luke 11:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: yo
  text: Ṣùgbọ́n bí Satani pàápàá bá pínyà sí ara rẹ̀, báwo ni ìjọba rẹ̀ yóò ṣe dúró? Nítorí ẹ sọ pé mo ń lé àwọn ẹ̀mí èṣù jáde nípasẹ̀ Beelsebulu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: Beelsebulu; àwọn ìtumọ̀ Gẹ̀ẹ́sì kan máa ń lo Beelsebubu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satani
  rationale: A lo ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú èdè Yorùbá, láì túmọ̀ rẹ̀ sí ọ̀rọ̀ míì.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: bá pínyà sí ara rẹ̀
  rationale: Èyí pa àwòrán ìpínyà inú mọ́, ó sì fi hàn pé Satani ń dojú kọ ara rẹ̀.
- source_word: πῶς σταθήσεται
  choice: báwo ni ... yóò ṣe dúró?
  rationale: Ó pa àwòrán ohun tí ó dúró ṣinṣin àti agbára ìbéèrè àsọyé Gíríìkì mọ́.
- source_word: βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún agbègbè tàbí àṣẹ ọba, ó sì bá àwòrán ìjọba tí ó pínyà mu.
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ṣàfihàn pé ẹ̀sùn àwọn olùgbọ́ ni ìdí tí Jesu fi gbé ìbéèrè náà kalẹ̀.
- source_word: ἐν Βεελζεβοὺλ
  choice: nípasẹ̀ Beelsebulu
  rationale: Nínú àyíká yìí, ἐν ń tọ́ka sí aṣojú tàbí ohun èlò; “nípasẹ̀” sọ ìtumọ̀ yẹn ní Yorùbá àdánidá láì fi “agbára” tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἐκβάλλειν ... τὰ δαιμόνια
  choice: lé àwọn ẹ̀mí èṣù jáde
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún lílé àwọn ẹ̀mí èṣù kúrò nínú ẹni.
- source_word: Βεελζεβοὺλ
  choice: Beelsebulu
  rationale: A ṣe àkọsílẹ̀ ìró orúkọ Gíríìkì Beelzebul ní ìbámu pẹ̀lú ìkọ̀wé Yorùbá, dípò fífi irú Beelzebub rọ́pò rẹ̀.
theological_decisions:
- issue: Irú ẹ̀sùn tí àwọn alatako Jesu fi kàn án
  choice: Wọ́n sọ pé Jesu ń lé àwọn ẹ̀mí èṣù jáde nípasẹ̀ Beelsebulu.
  alternative: Wọ́n sọ pé Jesu ń lé àwọn ẹ̀mí èṣù jáde nípa agbára Beelsebulu.
  rationale: A kò fi ọ̀rọ̀ “agbára” kún un, nítorí Gíríìkì kò sọ ọ́ ní tààrà; báyìí ni a ṣe pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹ̀sùn náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “pàápàá” fún καὶ láti mú ìtumọ̀ “Sátánì náà pàápàá” jáde. A gbé àmì àlàyé [a] sí ẹ̀gbẹ́ Beelsebulu, ibi tí àlàyé náà ń tọ́ka sí.
