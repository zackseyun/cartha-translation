  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ fi àwọn ohun tí ó wà nínú ṣe ìfẹ́rẹ̀ẹ́[a]; kíyèsí i, ohun gbogbo sì jẹ́ mímọ́ fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ṣe ìfẹ́rẹ̀ẹ́ nínú ohun tí ẹ ní.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ohun tí ó wà nínú tàbí ohun-ìní tí ẹnì kan ní lọ́wọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ àti àtúnṣe wá sí ọ̀rọ̀ ìwẹ̀nùmọ́ òde tí ó ṣáájú.
- source_word: τὰ ἐνόντα
  choice: àwọn ohun inú
  rationale: Ó tẹ̀ lé ìtumọ̀ gígúnná ti ‘àwọn ohun tí ó wà nínú,’ ó sì pa ìyàtọ̀ láàárín òde àti inú mọ́ gẹ́gẹ́ bí àyíká ẹsẹ náà.
- source_word: δότε ἐλεημοσύνην
  choice: ẹ fi ... fúnni gẹ́gẹ́ bí àánú
  rationale: Ó ṣàfihàn àṣẹ láti fi ohun kan ṣe ìrànlọ́wọ́ àánú láì fi ẹni tí a ó fún kún ọ̀rọ̀ Gíríìkì.
- source_word: ἰδοὺ
  choice: sì kíyè sí i
  rationale: Ọ̀rọ̀ yìí fa àfiyèsí sí àbájáde tí ó tẹ̀ lé e ní èdè Yorùbá àdánidá.
- source_word: πάντα καθαρὰ ὑμῖν ἐστιν
  choice: ohun gbogbo mọ́ fún un yín
  rationale: ‘Mọ́’ pa ìsopọ̀ mọ́ ọ̀rọ̀ ìwẹ̀nùmọ́, ‘fún un yín’ sì ṣàfihàn dátífù ὑμῖν ní ọ̀nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ τὰ ἐνόντα ní ìbáṣepọ̀ pẹ̀lú ìwẹ̀nùmọ́ àti fífúnni ní àánú
  choice: ‘àwọn ohun inú,’ ní ìtumọ̀ ohun tí ó wà nínú ènìyàn tàbí ohun èlò
  alternative: ‘ohun tí ẹ ní,’ ìyẹn dúkìá tí ó wà lọ́wọ́ ẹni
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń fi òde ife àti àwo wé inú wọn, nítorí náà ìtumọ̀ ‘àwọn ohun inú’ dá ìfọwọ́sowọ́pọ̀ ọ̀rọ̀ náà pamọ́. Síbẹ̀, Gíríìkì lè tọ́ka sí ohun-ìní tí ó wà lọ́wọ́ ẹni, nítorí náà a pa ìtumọ̀ yẹn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò. ‘Kíyè sí i’ jẹ́ àdánidá ju ìtumọ̀ líle ti ‘wo ó’ lọ, ṣùgbọ́n ó pa agbára ìpè sí àfiyèsí mọ́. Àmì ohùn ni a fi sí ibi tí ó yẹ.
