  naturalness: '‘Ẹ fi àwọn ohun inú fúnni gẹ́gẹ́ bí àánú’ kò dára ní Yorùbá àdánidá: ‘fúnni gẹ́gẹ́ bí àánú’ jẹ́ àkópọ̀ tí kò wọ́pọ̀, ‘àánú’ sì kì í ṣe ọ̀rọ̀ tó péye fún alms níbí. ‘Sì kíyè sí i’ dàbí ìkìlọ̀ ju àmì ìfàrọ̀wọ́sí ‘ἰδοὺ’ lọ. Àtúnṣe náà lo ‘ṣe ìfẹ́rẹ̀ẹ́’ àti ‘Kíyèsí i’ ní ọ̀nà tó rọrùn àti tó bójú mu.'
  terminology: ‘Ìfẹ́rẹ̀ẹ́’ jẹ́ ọ̀rọ̀ tó yẹ fún ἐλεημοσύνη, ìyẹn fífúnni fún àwọn aláìní. ‘Mímọ́’ yẹ fún καθαρά nínú àyíká ìwẹ̀nùmọ́/ìmọ́ ẹ̀sìn; ‘mọ́’ nínú àkọsílẹ̀ yìí kò lè ṣiṣẹ́ gẹ́gẹ́ bí àsọyé ‘clean.’
