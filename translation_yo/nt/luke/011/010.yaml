source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: yo
  text: Nítorí gbogbo ẹni tí ó ń béèrè ń gba, ẹni tí ó ń wá ń rí, a ó sì ṣí i fún ẹni tí ó ń kan ilẹ̀kùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní kedere sí i láti inú àyíká pé, “a ó ṣí ilẹ̀kùn fún ẹni tí ó ń kan án.” Ọ̀rọ̀ Gíríìkì kò sọ ohun tí a ó ṣí ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: gbogbo ẹni
  rationale: Ó fi ìtumọ̀ pínpín sí ẹnì kọ̀ọ̀kan hàn ní ọ̀nà tí ó bá Yorùbá òde òní mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa ọ̀rọ̀ ìṣàlàyé tí ó so ẹsẹ yìí mọ́ ìṣírí tó ṣáájú mọ́.
- source_word: ὁ αἰτῶν
  choice: ẹni tí ó ń béèrè
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ nínú participle present ni a fi “ń” hàn, láì sọ pé akọ nìkan ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: λαμβάνει
  choice: ń rí gbà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún gbígba ohun kan, ó sì bá àyíká ẹ̀bẹ̀ àti ìdáhùn mu.
- source_word: ὁ ζητῶν
  choice: ẹni tí ó ń wá
  rationale: Ó pa ìṣe ìwá kiri tí participle present náà sọ mọ́.
- source_word: εὑρίσκει
  choice: ń rí
  rationale: Ó jẹ́ ìtumọ̀ tààrà, kúkúrú, tí ó sì bá ìlànà ọ̀rọ̀ mẹ́ta inú ẹsẹ náà mu.
- source_word: τῷ κρούοντι
  choice: fún ẹni tí ó ń kan ilẹ̀kùn
  rationale: “Fún” fi ipa dative hàn; “kan ilẹ̀kùn” ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe kíkàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ilẹ̀kùn ní gbangba.
- source_word: ἀνοιγήσεται
  choice: a ó sì ṣí i sílẹ̀
  rationale: Ìṣe aláìsọ ẹni tó ṣe é nínú Yorùbá fi passive future náà hàn; “i” jẹ́ arọ́pò-orúkọ fún ohun tí Gíríìkì kò dárúkọ.
theological_decisions:
- issue: Ìwọ̀n àti agbára ìlérí tó kan gbogbo ènìyàn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò tí kò ní àfikún ààlà.
  alternative: Kí a pè é ní àsọdùn fún ìṣírí, tàbí kí a fi ọ̀rọ̀ bí “ẹni tí ó béèrè lọ́nà tó tọ́” kún un.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìlérí náà kalẹ̀ láìsọ ààlà kankan ní àyíká ẹ̀kọ́ nípa àdúrà; ìtumọ̀ kò gbọ́dọ̀ yanjú ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà nípa fífi ohun tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. Àtúnsọ “ń …, ń …, a ó sì …” pa ìlànà ọ̀rọ̀ mẹ́ta inú Gíríìkì mọ́, nígbà tí “ẹni” yẹra fún fífi akọ tàbí abo tí orísun kò tẹnumọ́ sí i.
