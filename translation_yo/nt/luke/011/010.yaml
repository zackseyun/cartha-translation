- from: Nítorí gbogbo ẹni tí ó ń béèrè ni ó ń rí gbà, ẹni tí ó ń wá sì ń rí, a ó sì ṣí i sílẹ̀ fún ẹni tí ó ń kan ilẹ̀kùn.[a]
  to: Nítorí gbogbo ẹni tí ó ń béèrè ń gba, ẹni tí ó ń wá ń rí, a ó sì ṣí i fún ẹni tí ó ń kan ilẹ̀kùn.[a]
  rationale: A rọ́pò “ń rí gbà” pẹ̀lú “ń gba” láti jẹ́ kí ìtumọ̀ λαμβάνει péye àti àdánidá. A sì yọ “sílẹ̀” kúrò nínú ìpínkẹta, kí a má bàa fi ìtumọ̀ àfikún sí ἀνοιγήσεται. A fi “i” silẹ̀ nínú ọ̀rọ̀ àkọ́kọ́ nítorí Gíríìkì kò dárúkọ ohun tí a ó ṣí; akọsilẹ̀ náà ṣàlàyé pé “ilẹ̀kùn” jẹ́ ìmúyẹ láti inú àyíká, kì í ṣe ohun tí ọ̀rọ̀ Gíríìkì sọ ní gbangba.
