id: LUK.11.14
reference: Luke 11:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: yo
  text: Ó sì ń lé ẹ̀mí èṣù kan tí ó ń múni di aláìlèsọ̀rọ̀ jáde. Nígbà tí ẹ̀mí èṣù náà sì jáde tán, ẹni tí kò lè sọ̀rọ̀ náà sọ̀rọ̀, ẹnu sì ya àwọn ènìyàn púpọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “adití.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “adití” tàbí “aláìlèsọ̀rọ̀,” ṣùgbọ́n nínú àyíká yìí “aláìlèsọ̀rọ̀” bá ohun tí ó ṣẹlẹ̀ mu, nítorí ẹni náà sọ̀rọ̀ lẹ́yìn tí ẹ̀mí èṣù náà jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: Ó sì ń lé ... jáde
  rationale: Àkójọpọ̀ ọ̀rọ̀-ìṣe aláìpé ἦν pẹ̀lú participle ἐκβάλλων ń fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn; “ń lé ... jáde” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yìí mọ́.
- source_word: δαιμόνιον
  choice: ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ náà tọ́ka tààrà sí ẹ̀mí búburú tàbí demon; “ẹ̀mí èṣù” jẹ́ èdè Yorùbá tí ó ṣe kedere, tí kò sì fi “ẹ̀mí àìmọ́” tí kò sí nínú ẹsẹ yìí kún un.
- source_word: κωφόν
  choice: odi
  rationale: κωφός lè túmọ̀ sí ẹni tí kò gbọ́ tàbí ẹni tí kò lè sọ̀rọ̀. Níbí, bí ẹni náà ṣe sọ̀rọ̀ lẹ́yìn tí ẹ̀mí èṣù jáde fi hàn pé àìlèsọ̀rọ̀ ni àfiyèsí ọ̀rọ̀ náà; “odi” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ipò yìí.
- source_word: ἐγένετο δὲ ... ἐξελθόντος
  choice: Nígbà tí ... jáde tán
  rationale: 'Èyí ń pa ìbáṣepọ̀ àkókò mọ́: jíjáde ẹ̀mí èṣù náà parí ṣáájú kí ọkùnrin náà tó sọ̀rọ̀. Yorùbá kò nílò kí a tú ἐγένετο lọ́tọ̀ gẹ́gẹ́ bí “ó sì ṣẹlẹ̀.”'
- source_word: ἐλάλησεν
  choice: sọ̀rọ̀
  rationale: “Sọ̀rọ̀” ni ìtumọ̀ tààrà àti àdánidá fún λαλέω; a kò fi èrò “bẹ̀rẹ̀ sí í sọ̀rọ̀” kún un.
- source_word: ὁ κωφός
  choice: ọkùnrin odi náà
  rationale: Adjective náà dúró bí orúkọ fún ẹni tí ìṣòro náà ń ṣe. “Ọkùnrin odi náà” mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ἐθαύμασαν
  choice: ẹnu sì ya
  rationale: Àpólà Yorùbá “ẹnu ya” fi ìyàlẹ́nu ńlá àti ìyanilẹ́nu tí ἐθαύμασαν ní hàn ní ọ̀nà tí ó wọ́pọ̀, tí ó sì bójú mu fún ìtàn.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀
  rationale: “Àwọn ogunlọ́gọ̀” pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí àwọn èrò púpọ̀.
theological_decisions:
- issue: Irú ìpọ́njú náà àti èdè ìlé ẹ̀mí èṣù jáde
  choice: A tú ẹsẹ náà bí ìtàn nípa ẹ̀mí èṣù gidi tí Jésù lé jáde, tí ọkùnrin náà sì lè sọ̀rọ̀ lẹ́yìn náà.
  alternative: Lílo ọ̀rọ̀ tí yóò dín ìtumọ̀ ohun àrà ọ̀tọ̀ kù, tàbí yí δαιμόνιον padà sí àpèjúwe àìsàn lásán.
  rationale: Gíríìkì pe ohun náà ní δαιμόνιον, ó sì sọ jíjáde rẹ̀ di ohun tí ó ṣẹlẹ̀ ṣáájú bí ọkùnrin náà ṣe sọ̀rọ̀. Ìtumọ̀ gbọ́dọ̀ pa ẹ̀rí ohun àrà ọ̀tọ̀ inú ọ̀rọ̀ náà mọ́ láìdín in kù tàbí fi àlàyé ẹ̀kọ́ ìjọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “odi” nítorí àyíká ọ̀rọ̀ fi àìlèsọ̀rọ̀ hàn; kò sí àmì àlàyé nítorí àṣàyàn yìí ṣe kedere nínú ẹsẹ náà, bí ó tilẹ̀ jẹ́ pé κωφός lè ní ìtumọ̀ míì ní àyíká ọ̀rọ̀ mìíràn.
