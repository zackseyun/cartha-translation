id: LUK.11.6
reference: Luke 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: yo
  text: nítorí ọ̀rẹ́ mi kan dé ọ̀dọ̀ mi láti ìrìn àjò[a], mi ò sì ní ohunkóhun láti gbé kalẹ̀ níwájú rẹ̀.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní tààràtà, ‘láti ọ̀nà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: nítorí
  rationale: Ó ń fi ìdí tí ẹni náà fi béèrè nínú àkàwé náà hàn; ‘nítorí’ jẹ́ ọ̀nà àdánidá láti sọ ìdí ní Yorùbá.
- source_word: φίλος μου
  choice: ọ̀rẹ́ mi kan
  rationale: ‘Kan’ pa ìtumọ̀ àìdájú ti φίλος tí kò ní article mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: παρεγένετο
  choice: dé
  rationale: Ọ̀rọ̀ náà tọ́ka sí dídé ẹni náà; ‘dé’ jẹ́ kedere, ó sì bá àyíká ọ̀rọ̀ mu pé ọ̀rẹ́ náà ti wà níbẹ̀ báyìí.
- source_word: ἐξ ὁδοῦ
  choice: láti ìrìn àjò
  rationale: Bí ó tilẹ̀ jẹ́ pé ní tààràtà ó túmọ̀ sí ‘láti ojú ọ̀nà,’ gbolohun náà ń tọ́ka sí wíwá láti ìrìn àjò; èyí ni Yorùbá àdánidá jù lọ.
- source_word: πρός με
  choice: ọ̀dọ̀ mi
  rationale: Ó pa ìtọ́sọ́nà sí ẹni tó ń sọ̀rọ̀ mọ́ láìfi ‘ilé’ tàbí ‘bẹ̀ mí wò’ kún ohun tí Gíríìkì kò sọ ní tààràtà.
- source_word: οὐκ ἔχω
  choice: èmi kò sì ní ohunkóhun
  rationale: Ó sọ àìní náà ní kedere, ‘sì’ sì so ó mọ́ ìdí tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: ὃ παραθήσω αὐτῷ
  choice: láti gbé kalẹ̀ níwájú rẹ̀
  rationale: Ó pa àwòrán ìṣe àlejò mọ́—gbígbé oúnjẹ kalẹ̀ níwájú àlejò—láìsọ ‘oúnjẹ’ ní tààràtà bí orísun náà kò ti sọ ọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbo. A lo ‘gbé kalẹ̀ níwájú rẹ̀’ láti pa àwòrán àlejò inú ọ̀rọ̀ Gíríìkì mọ́; àmì ẹsẹ̀ [a] wà lẹ́yìn ‘ìrìn àjò’ gẹ́gẹ́ bí a ti nílò.
