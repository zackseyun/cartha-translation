id: LUK.11.34
reference: Luke 11:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: yo
  text: Fìtílà ara rẹ ni ojú rẹ. Nígbà tí ojú rẹ bá dára[a], gbogbo ara rẹ náà máa ń kún fún ìmọ́lẹ̀; ṣùgbọ́n nígbà tí ojú rẹ bá burú[b], ara rẹ náà máa ń ṣókùnkùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ó mọ́ kedere,” “tí ó ní ìlera,” tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “kan ṣoṣo.” Ọ̀rọ̀ Gíríìkì náà lè ṣàpèjúwe ohun tí kò pínyà tàbí ohun tí ó sàn; níbí, ó ṣàpèjúwe ojú ní ìtakora sí ojú “burú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ibi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “burú” tàbí “ibi”; níbí, ó lè tọ́ka lẹ́ẹ̀kan náà sí ojú tí ó ní àbùkù àti sí ìríran inú tí ìwà búburú ti yí padà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: fìtílà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun èlò tí ń tan ìmọ́lẹ̀, kì í ṣe ìmọ́lẹ̀ lásán; “fìtílà” pa àwòrán gidi inú ọ̀rọ̀ náà mọ́.
- source_word: σῶμα
  choice: ara
  rationale: Ìtumọ̀ àkọ́kọ́ níbí ni ara ènìyàn, tí Jesu lò nínú àkàwé nípa ìríran àti ipò inú.
- source_word: ὀφθαλμός
  choice: ojú
  rationale: A pa ìtumọ̀ gidi “ojú” mọ́, nítorí àkàwé náà bẹ̀rẹ̀ láti ara ẹ̀yà ìríran sí òye inú.
- source_word: ὅταν ... ᾖ
  choice: nígbà tí ... bá
  rationale: Èyí sọ ipò tí ó lè máa ṣẹlẹ̀ ní gbogbogbòò; ìṣètò yìí jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ “nígbàkigbà tí” tàbí “nígbà tí.”
- source_word: ἁπλοῦς
  choice: péye
  rationale: Nínú àkàwé ojú tí ń mú kí ara ní ìmọ́lẹ̀, “péye” fi ojú tí ó jí péye, tí ó sì ń ṣiṣẹ́ bí ó ti yẹ hàn. Ó tún jẹ́ kí ìtumọ̀ nípa ojú tí kò pínyà tàbí tí ó mọ́ kedere ṣí sílẹ̀ láìfi “ọ̀làwọ́” múlẹ̀.
- source_word: ὅλον ... φωτεινόν
  choice: gbogbo ara rẹ náà máa ń kún fún ìmọ́lẹ̀
  rationale: Gbólóhùn yìí sọ φωτεινός gẹ́gẹ́ bí “kún fún ìmọ́lẹ̀,” ó sì pa ìyàtọ̀ rẹ̀ sí òkùnkùn mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐπὰν δὲ
  choice: ṣùgbọ́n nígbà tí ... bá
  rationale: Ó mú ìtakora àti ìbáradọ́gba pẹ̀lú gbólóhùn àkọ́kọ́ jáde ní ọ̀nà àdánidá.
- source_word: πονηρός
  choice: burú
  rationale: “Burú” lè tọ́ka sí ojú tí kò ṣiṣẹ́ dáadáa, ó sì tún lè ní ìtumọ̀ ìwà ibi; nítorí náà, ó pa ìṣiyèméjì Gíríìkì mọ́.
- source_word: σκοτεινόν
  choice: máa ń ṣókùnkùn
  rationale: Èyí fi ipò òkùnkùn hàn ní kedere, ó sì dáhùn taara sí “kún fún ìmọ́lẹ̀.”
theological_decisions:
- issue: Ìtumọ̀ ἁπλοῦς nínú gbólóhùn tó ṣàpèjúwe ojú
  choice: Lo “péye” nínú ọ̀rọ̀ pàtàkì.
  alternative: “mọ́ kedere,” “jí péye,” “kan ṣoṣo,” tàbí “ọ̀làwọ́”
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ojú gẹ́gẹ́ bí fìtílà ara àti lórí ìmọ́lẹ̀ tàbí òkùnkùn tí ó ń yọrí sí. “Péye” sọ iṣẹ́ ojú tí ó dára ní èdè òde òní, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ bí “kan ṣoṣo” tàbí “tí kò pínyà” mọ́. A kò yan “ọ̀làwọ́,” nítorí bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ yẹn ní ibòmíràn, kì í ṣe ìtumọ̀ tó hàn jù nínú àwòrán ojú àti ara ní ẹsẹ yìí.
- issue: Bóyá πονηρός túmọ̀ sí àìlera ojú tàbí ìwà ibi
  choice: Lo “burú,” kí ìtumọ̀ méjèèjì lè wà.
  alternative: “kò dára,” “kò ní ìlera,” tàbí “jẹ́ ibi”
  rationale: Àwòrán ara ń gba ìtumọ̀ ojú tí ó ní àbùkù láyè, nígbà tí àyíká ẹ̀kọ́ náà tún lè tọ́ka sí ìríran inú tí ìwà ibi ti yí po. “Burú” kò fi ọ̀kan ṣoṣo múlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Máa ń” mú ìtumọ̀ ipò gbogbogbòò inú àwọn gbólóhùn méjèèjì jáde. A lo àmì ohùn níbi tí ó ti bá ìkọ̀wé Yorùbá àdánidá mu, a sì pa ìbáradọ́gba ìmọ́lẹ̀ àti òkùnkùn mọ́.
