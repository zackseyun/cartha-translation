id: LUK.11.42
reference: Luke 11:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: yo
  text: Ṣùgbọ́n ègbé ni fún yín, ẹ̀yin Farisí, nítorí ẹ ń san ìdámẹ́wàá lára ewé míńtì, ewé rúù àti gbogbo irú ewébẹ̀, ṣùgbọ́n ẹ ń kọjá ìdájọ́ òdodo àti ìfẹ́ Ọlọ́run sílẹ̀. Ìwọ̀nyí ni ó yẹ kí ẹ ṣe, láì kọ àwọn nǹkan wọ̀nyẹn sílẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ègbé ni fún yín
  rationale: Ó pa ìkìlọ̀ líle àti ìkéde ìdájọ́ inú ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà tí ó wọ́pọ̀ nínú èdè Yorùbá Bíbélì.
- source_word: ἀποδεκατοῦτε
  choice: ẹ ń san ìdámẹ́wàá lára
  rationale: Ó túmọ̀ fífi ìdá kan nínú mẹ́wàá ohun tí a ní tàbí tí a kórè fún Ọlọ́run; ‘lára’ bá àkójọ ewébẹ̀ tó tẹ̀ lé mu.
- source_word: ἡδύοσμον
  choice: ewé míńtì
  rationale: Orúkọ ewé mint ni; àfikún ‘ewé’ mú un ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: πήγανον
  choice: ewé rúù
  rationale: Ó jẹ́ ewéko rue; lílo orúkọ àyálò pẹ̀lú ‘ewé’ yẹra fún fífi ewéko mìíràn rọ́pò ohun tí orísun sọ.
- source_word: πᾶν λάχανον
  choice: gbogbo irú ewébẹ̀
  rationale: λάχανον níbí tọ́ka sí àwọn ewébẹ̀ tàbí ewéko ọgbà ní gbogbogbòò, kì í ṣe ewébẹ̀ kan ṣoṣo.
- source_word: παρέρχεσθε
  choice: ẹ ń kọjá ... sílẹ̀
  rationale: Ó pa àwòrán gangan ti ‘kọjá lẹ́gbẹ̀ẹ́’ mọ́, dípò yíyí i padà sí ‘ṣàìnáání’ nìkan.
- source_word: κρίσιν
  choice: ìdájọ́ òdodo
  rationale: κρίσις lè túmọ̀ sí ìdájọ́ tàbí ìdájọ́ òdodo; àkópọ̀ yìí sọ ojúṣe ìwà òdodo di mímọ̀ láì dín ìtumọ̀ ìdájọ́ kù.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: 'Ó pa àìṣe kedere gírámà genitive mọ́: ó lè tọ́ka sí ìfẹ́ sí Ọlọ́run tàbí ìfẹ́ tí Ọlọ́run ń fi hàn.'
- source_word: ταῦτα ... κἀκεῖνα
  choice: Ìwọ̀nyí ... àwọn ìyókù
  rationale: Àwọn arọ́pò-orúkọ náà ń yà àwọn ohun pàtàkì—ìdájọ́ òdodo àti ìfẹ́ Ọlọ́run—sọ́tọ̀ kúrò nínú ìsan ìdámẹ́wàá tí a mẹ́nu kàn tẹ́lẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìdájọ́ òdodo, ìfẹ́ Ọlọ́run, àti ìsan ìdámẹ́wàá
  choice: Jésù tẹnumọ́ pé ó yẹ kí wọ́n ṣe àwọn ohun pàtàkì, láì kọ àwọn ìyókù sílẹ̀.
  alternative: Kí a túmọ̀ gẹ́gẹ́ bí ìfagilé ìsan ìdámẹ́wàá pátápátá.
  rationale: Gbólóhùn ἔδει ποιῆσαι κἀκεῖνα μὴ παρεῖναι kò fagilé àwọn ohun kejì; ó ṣe àtúnṣe ààyò wọn, ní fífi ìdájọ́ òdodo àti ìfẹ́ Ọlọ́run síwájú.
- issue: Ìtumọ̀ ‘ìfẹ́ Ọlọ́run’
  choice: Pa ọ̀rọ̀ náà mọ́ bí ‘ìfẹ́ Ọlọ́run’.
  alternative: ‘Ìfẹ́ tí ẹ ní sí Ọlọ́run’ tàbí ‘ìfẹ́ Ọlọ́run sí ènìyàn’.
  rationale: Àkópọ̀ τοῦ θεοῦ jẹ́ aláìṣe kedere ní orísun; fífi ọ̀kan lára àwọn ìtumọ̀ náà lé e lórí yóò tú ìjàmbá ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ Gíríìkì kò tú fúnra rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Míńtì’ àti ‘rúù’ jẹ́ orúkọ àyálò fún ewéko tí kò ní orúkọ Yorùbá boṣewa tó dájú; a fi ‘ewé’ ṣáájú wọn fún ìmọ̀ kedere. A pa ìfarahàn ‘kọjá ... sílẹ̀’ ti παρέρχεσθε mọ́.
