base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: yo
  text: Ẹ̀yin aláìgbọ́n! Ṣé ẹni tí ó dá òde kò dá inú náà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó wà ní òde ... ohun tí ó wà ní inú.” Ọ̀rọ̀ náà lè tọ́ka sí òde àti inú ohun èlò nínú àyíká ẹsẹ̀ yìí, ó sì tún lè kan ìwà ènìyàn níta àti nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Ẹ̀yin aláìlóye!
  rationale: Ọ̀rọ̀ àpèjúwe ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ ni; ó jẹ́ ìbáwí tààrà, ó sì mú agbára ọ̀rọ̀ Gíríìkì jáde láìlo ọ̀rọ̀ tí yóò dà bí èébú lásán.
- source_word: οὐχ ... ἐποίησεν;
  choice: Ṣé ... kò dá ... bí?
  rationale: Ìbéèrè òdì yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni. Ìṣètò ‘Ṣé ... kò ... bí?’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìbéèrè náà hàn.
- source_word: ὁ ποιήσας
  choice: ẹni tí ó dá
  rationale: Ó pa iṣẹ́ participle tí a fi article sọ di ẹni kan mọ́, ó sì fi ẹni náà sílẹ̀ láìfi ‘Ọlọ́run’ kún ibi tí Gíríìkì kò ti sọ ọ́ ní tààrà.
- source_word: τὸ ἔξωθεν
  choice: ti òde
  rationale: Ó lè tọ́ka sí apá òde ohun èlò nínú àyíká ẹsẹ̀ náà àti, ní ìtumọ̀ tí ó gbòòrò, sí ìgbésí ayé ẹni tí ó hàn síta.
- source_word: τὸ ἔσωθεν
  choice: ti inú
  rationale: 'Ó bá ‘ti òde’ ṣe àfiwé, ó sì pa ìtọ́kasí méjèèjì mọ́: inú ohun èlò àti inú ìwà ènìyàn.'
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Nínú ìbéèrè yìí, ó túmọ̀ sí pé ẹni tí ó dá ti òde dá ti inú bákan náà; ‘pẹ̀lú’ mú ìmọ̀lára ‘also’ náà jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ó dá’ ń tọ́ka sí
  choice: A pa ìtọ́kasí àìsọtààrà sí Ọlọ́run gẹ́gẹ́ bí Ẹlẹ́dàá mọ́, láìfi orúkọ ‘Ọlọ́run’ kún ọ̀rọ̀ náà.
  alternative: Kí a ka a sí ẹni tí ó ṣe ife tàbí àwo nìkan.
  rationale: Ọ̀rọ̀ náà ṣiṣẹ́ pẹ̀lú àpẹẹrẹ ohun èlò ní àyíká ẹsẹ̀, ó sì tún lè tọ́ka sí òtítọ́ pé Ọlọ́run dá ohun ti òde àti ti inú. Ìtumọ̀ yìí kò fi tipátipá yan ọ̀kan ṣoṣo nínú méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; ìbáwí náà lágbára ṣùgbọ́n kì í ṣe èébú àìnídìí.
