lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: wọ́n ń lúgọ dè é
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ń dúró ní ìkọ̀kọ̀ pẹ̀lú èrò búburú láti dẹ Jésù mú; ‘lúgọ dè’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa àwòrán ibùba mọ́.
- source_word: αὐτόν
  choice: è é
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù, a sì pa á mọ́ gẹ́gẹ́ bí arọ́pò-orúkọ bí ó ti rí nínú Gíríìkì.
- source_word: θηρεῦσαί
  choice: láti gbá … mú
  rationale: Ọ̀rọ̀ náà ní àwòrán pípa tàbí mímú ohun tí a ń ṣọdẹ; ‘gbá … mú’ jẹ́ èdè Yorùbá tó ṣe kedere, ó sì pa àwòrán mímú ohun mọ́ láì sọ ọ́ di àlàyé lásán.
- source_word: τι
  choice: ohun kan
  rationale: 'Èyí pa àìsọ pàtó inú ọ̀rọ̀ Gíríìkì mọ́: wọ́n ń retí láti rí ohun kan nínú ohun tí Jésù yóò sọ.'
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: tí yóò ti ẹnu rẹ̀ jáde
  rationale: Ìtumọ̀ yìí pa àwòrán ‘láti ẹnu rẹ̀’ mọ́, ṣùgbọ́n ó sọ ọ́ ní Yorùbá àdánidá; ohun tí ó ti ẹnu jáde túmọ̀ sí ọ̀rọ̀ tí ẹni náà sọ.
