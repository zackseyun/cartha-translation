language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Nígbà tí ẹ bá ń gbàdúrà, ẹ máa sọ pé, ‘Baba[a], kí a ka orúkọ rẹ sí mímọ́[b]. Kí ìjọba rẹ dé.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ Gẹ̀ẹ́sì kan ní “Baba wa,” bóyá nítorí àdúrà tí ó jọ èyí ní Mátíù 6:9; ṣùgbọ́n Gíríìkì níhìn-ín ní “Baba” nìkan.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí a ya orúkọ rẹ sí mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Nígbà tí ẹ bá ń gbàdúrà
  rationale: Ọ̀rọ̀ yìí fi ipò àkókò gbogbogbò hàn, ó sì bá ìṣe tí a máa ń ṣe mu; ìtumọ̀ náà jẹ́ Yorùbá àdánidá.
- source_word: λέγετε
  choice: ẹ máa wí pé
  rationale: Àṣẹ ìsinsìnyí náà lè tọ́ka sí ohun tí wọ́n yóò máa ṣe; ‘ẹ máa wí pé’ sọ ìtọ́ni àdúrà náà ní kedere.
- source_word: Πάτερ
  choice: Baba
  rationale: Ẹ̀dà Gíríìkì ní ‘Baba’ nìkan, kì í ṣe ‘Baba wa’; a kò dapọ̀ ọ́ mọ́ Mátíù 6:9.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: kí a ya orúkọ rẹ sí mímọ́
  rationale: 'Ó pa ohùn àìṣe àti agbára ẹ̀bẹ̀ mọ́: kí àwọn ènìyàn ka orúkọ Ọlọ́run sí mímọ́, láìdábàá pé orúkọ rẹ kò tíì mọ́.'
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Kí ìjọba rẹ dé
  rationale: ‘Kí ... dé’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi àṣẹ tí ó jẹ́ ẹ̀bẹ̀ hàn; ‘ìjọba’ pa ìtumọ̀ ìṣàkóso àti ilẹ̀ ọba mọ́.
theological_decisions:
- issue: Bí a ṣe ń pe Ọlọ́run ní Πάτερ
  choice: Baba
  alternative: Baba wa
  rationale: A tẹ̀lé SBLGNT, èyí tí ó ní Πάτερ nìkan, dípò fífi ọ̀rọ̀ inú Mátíù 6:9 kún un.
- issue: Ìtumọ̀ ἁγιασθήτω τὸ ὄνομά σου
  choice: kí a ya orúkọ rẹ sí mímọ́
  alternative: kí orúkọ rẹ jẹ́ mímọ́
  rationale: Ìyàn yìí pa ìtumọ̀ àìṣe àti ẹ̀bẹ̀ mọ́, ó sì fi hàn pé kí a bọ̀wọ̀ fún orúkọ Ọlọ́run gẹ́gẹ́ bí ohun mímọ́, kì í ṣe pé kí orúkọ náà ṣẹ̀ṣẹ̀ di mímọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn nítorí αὐτοῖς àti àwọn fọ́ọ̀mù ọ̀pọ̀ ènìyàn; ‘Baba’ kò ní ‘wa’ láti yàgò fún ìṣọ̀kan pẹ̀lú Mátíù.
