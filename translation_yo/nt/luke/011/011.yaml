  to: Ta ni baba kan láàárín yín tí, bí ọmọ rẹ̀ bá béèrè ẹja lọ́wọ́ rẹ̀, yóò fún un ní ejò dípò ẹja?
  rationale: A tún gbolohun náà ṣètò pẹ̀lú “bí ... bá” láti ṣàfihàn ìbéèrè àsọyé náà ní kedere, a sì lo “baba kan” láti jẹ́ kí ìtọ́kasí gbogbogbò náà dáa. A pa gbogbo àwọn ìtumọ̀ ọ̀rọ̀ pàtàkì mọ́ láì fi ìtumọ̀ tuntun kún un.
