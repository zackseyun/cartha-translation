id: LUK.11.11
reference: Luke 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: yo
  text: Ta ni baba kan láàárín yín tí, bí ọmọ rẹ̀ bá béèrè ẹja lọ́wọ́ rẹ̀, yóò fún un ní ejò dípò ẹja?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Ta ni baba láàárín yín
  rationale: Èyí mú ìbéèrè àsọyé Gíríìkì jáde ní Yorùbá àdánidá, ó sì tọ́ka sí baba kan láàárín àwọn olùgbọ́.
- source_word: αἰτήσει
  choice: yóò béèrè ... lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú, ó sì túmọ̀ sí béèrè ohun kan lọ́wọ́ ẹnì kan; ìṣètò yìí bá Yorùbá mu.
- source_word: ὁ υἱὸς
  choice: ọmọ rẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọmọ ọkùnrin baba ni a ń sọ; 'ọmọ rẹ̀' jẹ́ ọ̀nà Yorùbá tó rọrùn, tí kò sì fi ìtumọ̀ míì kún un.
- source_word: ἰχθύν / ἰχθύος
  choice: ẹja / ẹja
  rationale: A pa àpẹẹrẹ ohun kan náà mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì; Yorùbá kò nílò atókùn àìdájú fún un.
- source_word: ἀντὶ
  choice: dípò
  rationale: '''Dípò'' fi ìtumọ̀ fífi ohun kan rọ́pò òmíràn hàn ní kedere.'
- source_word: ὄφιν
  choice: ejò
  rationale: '''Ejò'' ni ọ̀rọ̀ Yorùbá àdánidá fún ὄφις, ó sì yẹ fún àyíká ọ̀rọ̀ yìí.'
- source_word: αὐτῷ ἐπιδώσει
  choice: yóò sì fún un
  rationale: Èyí pa ọjọ́ iwájú àti ìṣe fífi ohun náà fún ọmọ mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
