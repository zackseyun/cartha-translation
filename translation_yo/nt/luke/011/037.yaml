  to: Bí ó sì ti ń sọ̀rọ̀, Farisí kan sì bẹ̀ ẹ́ pé kí ó wá bá òun jẹun; ó wọlé, ó sì rọ̀gbọ̀kú láti jẹun.[a]
  rationale: Àtúnṣe náà fi ohun-ìṣe ἐρωτᾷ αὐτόν hàn ní kedere pẹ̀lú «bẹ̀ ẹ́ pé», ó sì ṣètò ọ̀rọ̀ ìrọ̀gbọ̀kú ní ọ̀nà Yorùbá tó rọrùn. Ó pa ìtumọ̀ ἀριστήσῃ mọ́ gẹ́gẹ́ bí jíjẹun láì sọ àkókò oúnjẹ pàtó, ó sì pa «pẹ̀lú rẹ̀» ti παρ’ αὐτῷ mọ́.
