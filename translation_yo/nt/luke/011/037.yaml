  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: yo
  text: Bí ó sì ti ń sọ̀rọ̀, Farisí kan sì bẹ̀ ẹ́ pé kí ó wá bá òun jẹun; ó wọlé, ó sì rọ̀gbọ̀kú láti jẹun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, ó rọ̀gbọ̀kú gẹ́gẹ́ bí àṣà jíjẹun níbi àsè ní ìgbà náà.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Bí ó sì ti ń sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìkésíni náà ṣẹlẹ̀ ní àkókò tí Jesu ń sọ̀rọ̀; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò tí àwọn ìṣe méjèèjì ń lọ pọ̀ mọ́.
- source_word: ἐρωτᾷ
  choice: ní kí ó wá
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘béèrè’ tàbí ‘rọ̀’; pẹ̀lú gbólóhùn tó tẹ̀ lé e, Yorùbá ‘ní kí ó wá’ sọ ìkésíni náà ní ọ̀nà àdánidá láì sọ ọ́ di ọ̀rọ̀ tó túmọ̀ sí ‘pè’ nìkan.
- source_word: Φαρισαῖος
  choice: Farisí kan
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí Yorùbá mọ̀, ‘kan’ sì bá ẹyọ anárọ̀ọ̀sì Gíríìkì mu.
- source_word: ὅπως ἀριστήσῃ
  choice: bá òun jẹun
  rationale: ἀριστάω lè tọ́ka sí oúnjẹ àárọ̀ tàbí oúnjẹ ọ̀sán, ṣùgbọ́n níbí ó túmọ̀ sí jíjẹun ní gbogbogbòò; ‘jẹun’ yẹra fún fífi àkókò oúnjẹ kan pàtó kún un.
- source_word: παρ’ αὐτῷ
  choice: bá òun
  rationale: Ìtumọ̀ rẹ̀ gan-an ni ‘pẹ̀lú rẹ̀’ tàbí ‘ní ọ̀dọ̀ rẹ̀.’ ‘Bá òun jẹun’ pa ìbáṣepọ̀ náà mọ́ láì fi ‘ní ilé rẹ̀’ kún ibi tí orísun kò sọ ní tààrà.
- source_word: εἰσελθὼν
  choice: ó sì wọlé
  rationale: Aoristi pàtísípù náà tọ́ka sí ìwọlé tó ṣáájú ìgbọ̀kú; gbólóhùn alápọ̀ yìí ṣe kedere ní Yorùbá.
- source_word: ἀνέπεσεν
  choice: ó rọ̀gbọ̀kú síbi oúnjẹ
  rationale: Ọ̀rọ̀ náà tọ́ka sí jíjẹun ní ipò ìrọ̀gbọ̀kú gẹ́gẹ́ bí àṣà àsè ìgbà náà, kì í ṣe jíjókòó lásán.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘òun’ láti mú kí ẹni tí Farisí náà ń bá Jesu jẹun ṣe kedere, a sì lo ‘rọ̀gbọ̀kú’ láti pa àṣà jíjẹun inú ọ̀rọ̀ Gíríìkì mọ́.
