review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìlànà ọ̀rọ̀ Gíríìkì mọ́ ní pàtàkì: ìṣẹ̀lẹ̀ náà wáyé nígbà tí Jesu ń sọ̀rọ̀, Farisí kan sì béèrè ìjẹun pẹ̀lú rẹ̀; Jesu wọlé, ó sì rọ̀gbọ̀kú fún oúnjẹ. Síbẹ̀, «ní kí ó wá» kò fi ẹni tí Farisí náà béèrè lọ́dọ̀ rẹ̀ (αὐτόν, ‘òun/Jésù’) hàn ní kedere. Àfikún «bẹ̀ ẹ́ pé» mú èyí padà bọ̀ sí ìtumọ̀ náà láì fi ìtumọ̀ míì kún un.'
  naturalness: «Farisí kan sì bẹ̀ ẹ́ pé kí ó wá bá òun jẹun» jẹ́ Yorùbá boṣewa tí ó dáa, ó sì yọ ìṣòro ìtọ́kasí ẹni tí «ní kí ó wá» lè dá sílẹ̀ kúrò. «Rọ̀gbọ̀kú síbi oúnjẹ» lè yé ẹni, ṣùgbọ́n «rọ̀gbọ̀kú láti jẹun» jẹ́ ọ̀nà tí ó rọrùn, tó sì jẹ́ àdánidá jù lọ níbí.
  terminology: «Farisí» yẹ fún Φαρισαῖος. «Bá òun jẹun» pa παρ’ αὐτῷ mọ́ gẹ́gẹ́ bí ‘pẹ̀lú rẹ̀,’ láì sọ pé ní ilé rẹ̀. «Rọ̀gbọ̀kú» dá ìṣe ἀνέπεσεν sílẹ̀ dáadáa, kì í ṣe jíjókòó lásán.
  issues:
  - severity: medium
    issue: Ẹni tí Farisí náà béèrè lọ́dọ̀ rẹ̀ kò hàn ní kedere.
    rationale: Gíríìkì ní αὐτόν, ‘ó béèrè lọ́dọ̀ rẹ̀.’ «Farisí kan ní kí ó wá...» lè jẹ́ kí ìtọ́kasí «ó» nínú gbolohun àbájọ náà dàrú. «Farisí kan sì bẹ̀ ẹ́ pé...» fi ohun tí orísun sọ hàn ní kedere.
  - severity: low
    issue: «Síbi oúnjẹ» kò rọrùn bí «láti jẹun.»
    rationale: Ìrọ̀gbọ̀kú náà jẹ́ ìpò fún oúnjẹ; «láti jẹun» jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá, ó sì ṣì dá ọ̀rọ̀ àsè orísun dúró.
