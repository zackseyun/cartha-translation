id: LUK.11.30
reference: Luke 11:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: yo
  text: Nítorí, gẹ́gẹ́ bí Jónà ṣe di àmì fún àwọn ará Nínéfè, bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò jẹ́ àmì fún ìran yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gangan, abala kejì ni: “bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò jẹ́ fún ìran yìí”; afiwe pẹ̀lú Jónà ló fi ìtumọ̀ “yóò jẹ́ àmì fún ìran yìí” hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “gẹ́gẹ́ bí” sì pa ìfiwéra καθώς mọ́ ní Yorùbá àdánidá.
- source_word: ἐγένετο
  choice: ti di
  rationale: “Ti di” fi hàn pé Jónà wá ń ṣiṣẹ́ gẹ́gẹ́ bí àmì, kì í ṣe pé ó kàn jẹ́ àmì láìsí ìyípadà tàbí àbájáde.
- source_word: Ἰωνᾶς
  choice: Jónà
  rationale: Orúkọ tí a ti mọ̀ sí Jónà ni Yorùbá, tí ó sì bá ìlò orúkọ Bíbélì mu.
- source_word: τοῖς Νινευίταις
  choice: fún àwọn ará Nínéfè
  rationale: “Fún” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ ìbáṣepọ̀ dative náà; “àwọn ará Nínéfè” túmọ̀ sí àwọn olùgbé ìlú náà.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” pa ìtumọ̀ ohun tí ń tọ́ka sí ìfihàn tàbí iṣẹ́ Ọlọ́run mọ́, láìdín in kù sí ẹ̀rí lásán tàbí àmì-àsọtẹ́lẹ̀ búburú.
- source_word: οὕτως ... καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ọ̀rọ̀ yìí mú ìbáṣepọ̀ afiwe “gẹ́gẹ́ bí ... bẹ́ẹ̀ náà” àti ipa àfikún καί jáde ní Yorùbá tó rọgbọ.
- source_word: ἔσται
  choice: yóò jẹ́
  rationale: Èyí jẹ́ ọjọ́ iwájú ti εἰμί; “yóò jẹ́” sún mọ́ fọ́ọ̀mù orísun ju “yóò di” lọ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa àkọlé ìbílẹ̀ náà mọ́, pẹ̀lú ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ gangan àti àkọlé tó ní ìró Mèsáyà àti ìran àsọtẹ́lẹ̀.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: fún ìran yìí
  rationale: “Fún” sọ ìtọ́kasí dative náà ní Yorùbá àdánidá, “ìran yìí” sì pa agbára àsọtẹ́lẹ̀ γενεά mọ́.
theological_decisions:
- issue: Ọ̀rọ̀-àpèjúwe tí a kò tún sọ nínú abala kejì
  choice: 'A fi “àmì” kún un gẹ́gẹ́ bí ohun tí afiwe náà túmọ̀ sí: “Ọmọ Ènìyàn yóò jẹ́ àmì fún ìran yìí.”'
  alternative: “Ọmọ Ènìyàn yóò jẹ́ fún ìran yìí.”
  rationale: Bí ó tilẹ̀ jẹ́ pé σημεῖον kò tún farahàn nínú Gíríìkì, ìṣètò afiwe náà fi í hàn kedere. Fífún un ní Yorùbá mú gbólóhùn náà ṣe kedere láìfi ẹ̀kọ́ tuntun kún un; àlàyé ìsàlẹ̀ ojú ewé sì pa fọ́ọ̀mù gangan mọ́.
- issue: Ìtumọ̀ “Ọmọ Ènìyàn”
  choice: A pa àkọlé “Ọmọ Ènìyàn” mọ́ láìfi àlàyé ìtumọ̀ kún un.
  alternative: “Ẹni tí ó jẹ́ ènìyàn” tàbí àtúnsọ tó tú àkọlé náà sí ìtumọ̀ kan ṣoṣo.
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ gangan, ó sì tún dà bí àkọlé nínú àwọn Ìhìn Rere. Pípa á mọ́ ń jẹ́ kí ìró rẹ̀ nípa Mèsáyà àti ìran àsọtẹ́lẹ̀ dúró láìyanju gbogbo ìṣòro ìtumọ̀ rẹ̀.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Nínéfè” àti “Jónà” tẹ̀lé ìlò orúkọ Bíbélì tí ó wọ́pọ̀, “Ọmọ Ènìyàn” sì jẹ́ àkọlé tí a mọ̀ dáadáa.
