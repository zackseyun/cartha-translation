id: LUK.11.49
reference: Luke 11:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: yo
  text: Nítorí ìdí èyí náà ni ọgbọ́n Ọlọ́run fi sọ pé,[a] ‘Èmi yóò rán àwọn wòlíì àti àwọn àpọ́sítélì sí wọn; wọn yóò pa, wọn yóò sì ṣe inúnibíni sí àwọn kan nínú wọn.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè lóye gbólóhùn náà gẹ́gẹ́ bí ṣíṣe ọgbọ́n àtọ̀runwá ní àwòrán ènìyàn, gẹ́gẹ́ bí ìpinnu ọgbọ́n Ọlọ́run, tàbí gẹ́gẹ́ bí ìtọ́ka tí Jésù ń ṣe sí ara rẹ̀ láìsọ ọ́ ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí ìdí èyí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdí tàbí àbájáde ọ̀rọ̀ tó ṣáájú hàn.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó pa agbára àfikún ọ̀rọ̀ Gíríìkì mọ́ nínú gbólóhùn náà.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: ọgbọ́n Ọlọ́run
  rationale: Ó sún mọ́ ìtumọ̀ gírámà Gíríìkì, ó sì fi ààyè sílẹ̀ fún onírúurú ọ̀nà tí a lè gbà lóye gbólóhùn náà.
- source_word: εἶπεν
  choice: sọ pé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti ṣàgbékalẹ̀ ọ̀rọ̀ tí a fa yọ.
- source_word: Ἀποστελῶ
  choice: Èmi yóò rán
  rationale: Ó mú ẹni tó ń sọ̀rọ̀ àti ìṣe ọjọ́ iwájú hàn kedere, bí fọ́ọ̀mù Gíríìkì ṣe rí.
- source_word: εἰς αὐτούς
  choice: sí wọn
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ‘rán,’ èyí ni ìtumọ̀ Yorùbá àdánidá fún ìtọ́sọ́nà sí àwọn ẹni náà.
- source_word: προφήτας
  choice: àwọn wòlíì
  rationale: ‘Wòlíì’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún προφήτης.
- source_word: ἀποστόλους
  choice: àwọn àpọ́sítélì
  rationale: Ó pa ìtumọ̀ oyè tàbí iṣẹ́ pàtó tí ọ̀rọ̀ náà sábà ní nínú Lúùkù àti Ìṣe àwọn Àpọ́sítélì mọ́.
- source_word: ἐξ αὐτῶν
  choice: àwọn kan lára wọn … àwọn mìíràn
  rationale: Ìtumọ̀ apá-kan nínú ẹgbẹ́ ni; pípín rẹ̀ sí ‘àwọn kan’ àti ‘àwọn mìíràn’ mú kí Yorùbá ṣe kedere pé kì í ṣe dandan kí ẹni kan náà ní ìṣe méjèèjì.
- source_word: ἀποκτενοῦσιν
  choice: wọn yóò pa
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó ṣe kedere, tí ó sì bá èdè Yorùbá òde òní mu.
- source_word: διώξουσιν
  choice: wọn yóò sì ṣe inúnibíni sí
  rationale: Nínú àyíká ọ̀tá yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ìyà jẹ tàbí lépa ẹni nítorí ìgbàgbọ́ tàbí iṣẹ́ rẹ̀, kì í ṣe lílépa lásán.
theological_decisions:
- issue: Ìtumọ̀ ‘ọgbọ́n Ọlọ́run’
  choice: A túmọ̀ ọ́ sí ‘ọgbọ́n Ọlọ́run’ láì sọ pé ó jẹ́ Jésù ní tààrà, Ìwé Mímọ́, tàbí ẹ̀dá ọ̀tọ̀ kan.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí fífi ọgbọ́n àtọ̀runwá ṣe ènìyàn, ìpinnu ọlọ́gbọ́n Ọlọ́run, tàbí ìtọ́ka tí Jésù ń ṣe sí ara rẹ̀ láìsọ ọ́ ní tààrà.
  rationale: Ọ̀rọ̀ Gíríìkì náà gba ju ọ̀nà ìtumọ̀ kan lọ; fífi ọ̀rọ̀ náà sílẹ̀ ní kedere bẹ́ẹ̀ ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó ti yẹ. ‘Àpọ́sítélì’ àti ‘wòlíì’ jẹ́ àwọn ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀. Àfikún ‘àwọn mìíràn’ jẹ́ ìṣàlàyé gírámà apá-kan ἐξ αὐτῶν, kì í ṣe ìfikún ẹ̀kọ́ ìgbàgbọ́.
