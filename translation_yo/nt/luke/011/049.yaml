  to: Nítorí ìdí èyí náà ni ọgbọ́n Ọlọ́run fi sọ pé,[a] ‘Èmi yóò rán àwọn wòlíì àti àwọn àpọ́sítélì sí wọn; wọn yóò pa, wọn yóò sì ṣe inúnibíni sí àwọn kan nínú wọn.’
