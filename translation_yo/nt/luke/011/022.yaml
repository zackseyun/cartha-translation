  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹni tí ó lágbára jù ú lọ bá wá sí i, tí ó sì ṣẹ́gun rẹ̀[a], ó gba gbogbo ìhámọ́ra rẹ̀[b] tí ó gbẹ́kẹ̀ lé, ó sì pín ohun ìkógun rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “borí rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “gbogbo ìhámọ́ra” túmọ̀ sí odindi ètò ìhámọ́ra.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ìkógun rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Ṣùgbọ́n nígbà tí ... bá
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí ó ṣáájú hàn, ìṣètò “nígbà tí ... bá” sì túmọ̀ ipa àkókò àti ipò tí ἐπάν ní ní Yorùbá àdánidá.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: ẹni tí ó lágbára jù ú lọ
  rationale: Èyí pa àfiwé agbára mọ́, kò sì fi ọ̀rọ̀ “ọkùnrin” kún un níbi tí Gíríìkì kò ti sọ orúkọ náà ní tààrà.
- source_word: ἐπελθὼν
  choice: dé bá a
  rationale: Ó fi ìtumọ̀ wíwá dé ọ̀dọ̀ ẹni náà nínú ìdojúkọ hàn láìfi ìtumọ̀ ogun tí ó le ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: νικήσῃ αὐτόν
  choice: ṣẹ́gun rẹ̀
  rationale: “Ṣẹ́gun” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún bí ẹni alágbára jù lọ ṣe borí ẹni kejì débi pé ó gba ìhámọ́ra rẹ̀.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: gbogbo ìhámọ́ra rẹ̀
  rationale: πανοπλία ń tọ́ka sí odindi ètò ìhámọ́ra; “gbogbo ìhámọ́ra” pa ìtumọ̀ pé ó pé ní kíkún mọ́ ní èdè Yorùbá tí ó rọrùn.
- source_word: αἴρει
  choice: ó gba
  rationale: Nínú àyíká yìí, “gba” fi hàn pé ẹni tí ó ṣẹ́gun mú ìhámọ́ra náà kúrò lọ́wọ́ ẹni tí a ṣẹ́gun.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: tí ó gbẹ́kẹ̀ lé
  rationale: “Gbẹ́kẹ̀ lé” sọ ìgbẹ́kẹ̀lé tí ó ti dúró ṣinṣin hàn, ó sì bá ìtumọ̀ fọ́ọ̀mù ọ̀rọ̀-ìṣe Gíríìkì mu.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: ohun ìkógun rẹ̀
  rationale: σκῦλα ni ohun tí a kó lọ́wọ́ ẹni tí a ṣẹ́gun; “ohun ìkógun” jẹ́ ọ̀rọ̀ Yorùbá tó bá àwòrán ìṣẹ́gun náà mu.
- source_word: διαδίδωσιν
  choice: ó sì pín
  rationale: “Pín” túmọ̀ fífi ohun ìkógun náà sí ìpín tàbí pínpín rẹ̀ fún àwọn ẹlòmíràn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ.
theological_decisions:
- issue: Bóyá kí a pe ẹni alágbára jù lọ ní “ọkùnrin alágbára jù ú lọ.”
  choice: ẹni tí ó lágbára jù ú lọ
  alternative: ọkùnrin tí ó lágbára jù ú lọ
  rationale: Ọ̀rọ̀ Gíríìkì lo àfiwé náà bí orúkọ láìsọ “ọkùnrin” ní tààrà. Àyíká ẹsẹ tó ṣáájú ti jẹ́ kí ẹni tí a ń sọ̀rọ̀ rẹ̀ yé ni, nítorí náà a kò fi ohun tí kò sí nínú gbólóhùn náà kún un.
- issue: Bí a ṣe lè túmọ̀ νικάω láìyanju àpẹẹrẹ ẹ̀kọ́ ìgbàgbọ́ tí àyíká náà ń tọ́ka sí.
  choice: ṣẹ́gun rẹ̀
  alternative: borí rẹ̀; tẹ̀ ẹ́ ba
  rationale: “Ṣẹ́gun” pa àwòrán ìdojúkọ àti ìborí tó yọrí sí gbígba ìhámọ́ra mọ́, láìsọ ní pàtó pé àwọn ènìyàn inú àpẹẹrẹ náà dúró fún ẹni kan nípa ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé lásán. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; ìṣètò gbólóhùn náà pa ìyàtọ̀, ìdojúkọ, ìgbẹ́kẹ̀lé, àti pínpín ohun ìkógun inú Gíríìkì mọ́.
