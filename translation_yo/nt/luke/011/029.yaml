id: LUK.11.29
reference: Luke 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: yo
  text: Bí àwọn èrò sì ti ń kóra jọ, ó bẹ̀rẹ̀ sí í sọ pé, “Ìran yìí jẹ́ ìran búburú. Ó ń wá àmì, a kò sì ní fún un ní àmì kankan, bí kò ṣe àmì Jónà.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àmì Jónà” lè tọ́ka sí Jónà fúnra rẹ̀ gẹ́gẹ́ bí àmì nípasẹ̀ iṣẹ́ àsọtẹ́lẹ̀ rẹ̀; ní ìbámu pẹ̀lú àwọn ìtàn Ihinrere tó jọra, ó tún lè mú ìbájọra pẹ̀lú ikú àti àjíǹde Jesu wá sí ọkàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: ń kóra jọ
  rationale: Ó fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn èrò ń péjọ.
- source_word: ἤρξατο λέγειν
  choice: ó bẹ̀rẹ̀ sí í sọ
  rationale: Ó pa agbára ìtumọ̀ ìbẹ̀rẹ̀ ìṣe inú èdè Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: γενεά
  choice: ìran
  rationale: “Ìran” ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún àwùjọ àwọn ènìyàn ìgbà kan, láì dín ìtọ́kasí náà kù sí àwọn alátakò díẹ̀ nìkan.
- source_word: πονηρά
  choice: búburú
  rationale: Ó sọ ìdájọ́ ìwà rere àti ìwà búburú náà ní tààràtà, ní èdè tí gbogbo ènìyàn lè lóye.
- source_word: σημεῖον
  choice: àmì
  rationale: Ó pa ìtumọ̀ gbooro ti ọ̀rọ̀ náà mọ́, láì fi “iṣẹ́ ìyanu” kún un níbi tí orísun kò ti sọ bẹ́ẹ̀ ní pàtó.
- source_word: ζητεῖ
  choice: ń wá
  rationale: Ó tẹ̀lé ìtumọ̀ pàtàkì ti ọ̀rọ̀ Gíríìkì, nígbà tí àyíká ọ̀rọ̀ ṣì lè fi ìwà ìbéèrè oníkátá hàn.
- source_word: δοθήσεται
  choice: a kò sì ní fún un
  rationale: Ìlò “a” aláìní ẹni pàtó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe aláìsọ ẹni tó ṣe é, ó sì pa ìtumọ̀ ọjọ́ iwájú mọ́.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Ó sọ ìyọkúrò kan ṣoṣo lẹ́yìn gbólóhùn ìkọ̀ ní kedere.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: àmì Jónà
  rationale: Ìsopọ̀ ọ̀rọ̀ náà ṣì ṣí sí ìtumọ̀ bí ti Gíríìkì, láì pinnu nínú ọ̀rọ̀ àkọ́kọ́ bóyá Jónà fúnra rẹ̀, iṣẹ́ rẹ̀, tàbí ìbájọra míì ni a ń tọ́ka sí.
theological_decisions:
- issue: Agbára ìdálẹ́bi tí “ìran yìí” ní
  choice: A fi í hàn gẹ́gẹ́ bí ìdájọ́ ìwà búburú lórí ìran àwọn ènìyàn ayé Jesu ní gbogbogbòò.
  alternative: Kí a mú un kàn àwọn alátakò kan pàtó tí ó wà níbẹ̀.
  rationale: Àtúnlò “ìran” nínú orísun fún ìdálẹ́bi náà ní agbára àwùjọ; a kò dín ìtọ́kasí rẹ̀ kù ju ohun tí Gíríìkì sọ lọ.
- issue: Ìtumọ̀ “àmì Jónà”
  choice: A pa gbólóhùn ìní tí ìtumọ̀ rẹ̀ ṣí sílẹ̀ mọ́ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí iṣẹ́ ìwàásù Jónà, tàbí sí ikú àti àjíǹde Jesu.
  rationale: Àyíká Lúùkù àti àwọn ìtàn Ihinrere tó jọra lè mú àwọn ìtumọ̀ wọ̀nyí wá sí ọkàn, ṣùgbọ́n gbólóhùn Gíríìkì fúnra rẹ̀ kò yan ọ̀kan ní pàtó ní ẹsẹ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Àwọn èrò” jẹ́ ọ̀nà àdánidá fún ọ̀pọ̀ ènìyàn tí ó péjọ; “ìran búburú” sì pa ìdálẹ́bi tààrà inú orísun mọ́.
