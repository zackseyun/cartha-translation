id: LUK.11.52
reference: Luke 11:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: yo
  text: “Ègbé ni fún ẹ̀yin amòye nínú Òfin[a], nítorí ẹ ti mú kọ́kọ́rọ́ ìmọ̀ kúrò; ẹ̀yin fúnra yín kò wọlé, ẹ sì dí àwọn tí ń wọlé lọ́wọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àwọn amọ̀ja nínú Òfin Júù; kì í ṣe agbẹjọ́rò ilé-ẹjọ́ òde òní.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àsọtẹ́lẹ̀ náà mọ́ ju ọ̀rọ̀ ìbànújẹ́ lasán lọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìkìlọ̀ líle ní Yorùbá.
- source_word: νομικοῖς
  choice: amòye nínú Òfin
  rationale: Ó fi hàn pé àwọn amọ̀ja nínú Òfin Mósè ni a ń sọ̀rọ̀ nípa wọn, kì í ṣe agbẹjọ́rò ilé-ẹjọ́ òde òní. A kọ “Òfin” ní lẹ́tà ńlá nítorí pé Òfin Júù ni ó wà ní àyíká ọ̀rọ̀ náà.
- source_word: ἤρατε
  choice: ẹ ti mú ... kúrò
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ αἴρω gẹ́gẹ́ bí yíyọ ohun kan kúrò, kì í ṣe gbígbé e lasán.
- source_word: κλεῖδα τῆς γνώσεως
  choice: kọ́kọ́rọ́ ìmọ̀
  rationale: Ó tẹ̀lé ìtumọ̀ àfiwé àti ìbáṣepọ̀ genitive Gíríìkì pẹ́kípẹ́kí láì sọ ohun tí ìmọ̀ náà jẹ́ ní pàtó.
- source_word: αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: Ó pa ìtẹnumọ́ àti ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐκ εἰσήλθατε
  choice: kò wọlé
  rationale: Ó pa àfiwé wíwọlé mọ́ láì fi ohun tí wọ́n wọ inú rẹ̀ kún ọ̀rọ̀ náà.
- source_word: τοὺς εἰσερχομένους
  choice: àwọn tí ń wọlé
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú participle present náà fara hàn nínú “ń wọlé,” láì fi èrò “ń gbìyànjú” kún un.
- source_word: ἐκωλύσατε
  choice: dí ... lọ́wọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ìdènà tàbí ìkọ́sẹ̀ sí ìṣe wọn, láì fi dandan mú un túmọ̀ sí pé wọ́n dá wọn dúró pátápátá.
theological_decisions:
- issue: Ohun tí “wọlé” àti “kọ́kọ́rọ́ ìmọ̀” ń tọ́ka sí nínú àfiwé
  choice: A pa àfiwé iwọle mọ́, a kò sì sọ ohun tí wọ́n ń wọ inú rẹ̀ ní pàtó.
  alternative: A lè ṣàlàyé rẹ̀ gẹ́gẹ́ bí wíwọ inú Ìjọba Ọlọ́run tàbí wíwọ inú ìmọ̀ Ọlọ́run tòótọ́.
  rationale: Ọ̀rọ̀ Gíríìkì kò dárúkọ ibi tàbí ohun tí a ń wọ inú rẹ̀. Ṣíṣàìfikún un pa àìdájú gidi inú ẹsẹ náà mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó níyì, tí ó sì ṣeé lóye ni a lò. “Ègbé ni fún” mú ohùn ìdájọ́ àsọtẹ́lẹ̀ jáde; “amòye nínú Òfin” yẹra fún ìtumọ̀ òde òní ti agbẹjọ́rò. Gbogbo àmì ohùn àti àmì abẹ́ lẹ́tà ni a fi sí ibi tí ó yẹ.
