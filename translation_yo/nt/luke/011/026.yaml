id: LUK.11.26
reference: Luke 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: yo
  text: Nígbà náà, ó lọ, ó sì mú ẹ̀mí[a] méje mìíràn bá ara rẹ̀ lọ, àwọn tí wọ́n burú ju ẹ̀mí náà lọ. Wọ́n sì wọ inú rẹ̀, wọ́n sì ń gbé níbẹ̀. Ipò ìkẹyìn ti ọkùnrin náà sì burú ju ipò rẹ̀ àkọ́kọ́ lọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n burúkú ju ẹ̀mí náà lọ.” Ọ̀rọ̀ Gíríìkì sọ pé “ẹ̀mí”; kò sọ ní pàtó pé “ẹ̀mí èṣù” tàbí “ẹ̀mí àìmọ́” nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ẹ̀mí búburú ni wọ́n.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ipo ìkẹyìn ti ọkùnrin náà sì burú ju ti ìbẹ̀rẹ̀ lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àkókò nínú àpèjúwe hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: ó lọ mú ... dání
  rationale: ‘Mú ... dání’ fi hàn pé ó mú àwọn ẹ̀mí náà bá ara rẹ̀ lọ, kì í ṣe pé ó kàn gbá wọn mú.
- source_word: ἕτερα πνεύματα ... ἑπτά
  choice: ẹ̀mí méje mìíràn
  rationale: Ó pa nọ́ńbà àti ọ̀rọ̀ gbogbogbò ‘ẹ̀mí’ mọ́ láì fi ‘ẹ̀mí àìmọ́’ tàbí ‘ẹ̀mí èṣù’ kún ohun tí ẹsẹ yìí sọ.
- source_word: πονηρότερα ἑαυτοῦ
  choice: tí ó burú ju òun fúnra rẹ̀ lọ
  rationale: Ó pa ìfiwéra mọ́ láàárín ẹ̀mí tó padà àti àwọn ẹ̀mí méje náà; ‘òun fúnra rẹ̀’ tọ́ka sí ẹ̀mí àkọ́kọ́.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Wọ́n sì wọlé, wọ́n ń gbé níbẹ̀
  rationale: Ọ̀rọ̀ apáṣe εἰσελθόντα jẹ́ ọ̀pọ̀, ó sì tọ́ka sí àwọn ẹ̀mí náà; Yorùbá ọ̀pọ̀ yìí mú ìtumọ̀ náà ṣe kedere bí ó tilẹ̀ jẹ́ pé κατοικεῖ wà ní ẹyọ nínú Gíríìkì.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: Ipò ìkẹyìn ... burú ju ti ìṣáájú lọ
  rationale: Ó sọ ọ̀rọ̀ àfiwé náà ní Yorùbá òde òní, ó sì pa ìyàtọ̀ láàárín ipò ìkẹyìn àti ipò ìṣáájú mọ́.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: ọkùnrin náà
  rationale: Ó tọ́ka sí ẹni pàtó nínú àpèjúwe Jesu, ó sì tẹ̀ lé ìpinnu láti má ṣe sọ ọ́ di ọ̀rọ̀ àìtọ́ka sí akọ tàbí abo.
theological_decisions:
- issue: Bóyá kí a pe àwọn ẹ̀mí náà ní ẹ̀mí èṣù tàbí ẹ̀mí àìmọ́ nínú àkọsílẹ̀ pàtàkì
  choice: ẹ̀mí
  alternative: ẹ̀mí àìmọ́; ẹ̀mí èṣù
  rationale: Ẹsẹ yìí fúnra rẹ̀ lo πνεύματα nìkan. Àyíká àti ọ̀rọ̀ ‘burú’ fi irú wọn hàn, nítorí náà a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ Gíríìkì.
- issue: Ìbámu nọ́ńbà nínú ‘εἰσελθόντα κατοικεῖ’
  choice: wọ́n wọlé, wọ́n ń gbé
  alternative: wọ́n wọlé, ó sì ń gbé
  rationale: A pa ìtọ́kasí ọ̀pọ̀ ti εἰσελθόντα mọ́, a sì lo ọ̀pọ̀ ní Yorùbá láti sọ ìṣe gbogbo àwọn ẹ̀mí náà ní ọ̀nà tó ṣe kedere, láì sọ pé ẹ̀mí kan ṣoṣo ló ń gbé níbẹ̀.
- issue: Ìtumọ̀ ἀνθρώπου
  choice: ọkùnrin náà
  alternative: ènìyàn náà
  rationale: Àkọsílẹ̀ náà ń tọ́ka sí ẹnì kọ̀ọ̀kan pàtó nínú àpèjúwe, a sì pa ìtọ́kasí akọ tí ìpinnu iṣẹ́ náà béèrè mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo gbolohun kúkúrú láti jẹ́ kí ìtẹ̀síwájú ìṣe náà ṣe kedere.
