revisions:
- from: Nítorí náà, bí gbogbo ara rẹ bá kún fún ìmọ́lẹ̀, tí kò sì ní apá òkùnkùn kankan, gbogbo rẹ̀ yóò kún fún ìmọ́lẹ̀, bí ìgbà tí fìtílà bá fi ìtànṣán rẹ̀ tan ìmọ́lẹ̀ sí ọ.[a]
  to: Nítorí náà, bí gbogbo ara rẹ bá kún fún ìmọ́lẹ̀, tí kò sì ní apá òkùnkùn kankan, ara rẹ náà yóò kún fún ìmọ́lẹ̀ pátápátá, gẹ́gẹ́ bí nígbà tí fìtílà bá tàn sí ọ pẹ̀lú ìtànṣán rẹ̀.[a]
  rationale: A ṣe àtúnṣe kékeré fún ìfiwéra ὡς ὅταν, ìtọ́kasí ara tí a tún sọ, àti ìṣètò ọ̀rọ̀ fìtílà. Àfikún ‘pátápátá’ ń fi ìtẹnumọ́ ὅλον kejì hàn ní Yorùbá. Àlàyé ìsàlẹ̀ ń dá àìdánilójú ìtumọ̀ τῇ ἀστραπῇ dúró láì sọ̀rọ̀ ìtumọ̀ kan di dandan.
