  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa àwòrán ‘ara,’ ‘ìmólẹ̀,’ apá òkùnkùn, àti ìfiwéra fìtílà mọ́ dáadáa. Ṣùgbọ́n ‘bí ìgbà tí’ kò ṣàfihàn ìfiwéra ὡς ὅταν ní Yorùbá tó rọrùn, àti ‘gbogbo rẹ̀’ lè mú kí a má rí i pé ‘ara’ kan náà ni a tún ń tọ́ka sí.
  naturalness: Àwọn ọ̀rọ̀ pàtàkì pọ̀ jù lọ jẹ́ Yorùbá àdánidá. Àtúnṣe sí ‘gẹ́gẹ́ bí nígbà tí’ mú ìfiwéra náà rọrùn, ‘ara rẹ náà’ sì mú ìtọ́kasí náà hàn kedere. ‘Tàn sí ọ pẹ̀lú ìtànṣán rẹ̀’ yọ ìtúnsọ ‘tan ìmọ́lẹ̀’ kúrò nígbà tí ó ṣì pa ohun èlò ìmọ́lẹ̀ àti ẹni tí a ń tàn sí mọ́.
  terminology: ‘Ara,’ ‘ìmólẹ̀,’ ‘òkùnkùn,’ àti ‘fìtílà’ bá ọ̀rọ̀ Gíríìkì mu. ‘Ìtànṣán’ jẹ́ yíyan tí ó bá àyíká fìtílà mu fún τῇ ἀστραπῇ, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ‘mànàmáná/ìmọ́lẹ̀ ojijì’ mọ́ gẹ́gẹ́ bí àṣàyàn.
