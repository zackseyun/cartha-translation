id: LUK.11.36
reference: Luke 11:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: yo
  text: Nítorí náà, bí gbogbo ara rẹ bá kún fún ìmọ́lẹ̀, tí kò sì ní apá òkùnkùn kankan, ara rẹ náà yóò kún fún ìmọ́lẹ̀ pátápátá, gẹ́gẹ́ bí nígbà tí fìtílà bá tàn sí ọ pẹ̀lú ìtànṣán rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn pé, ‘gẹ́gẹ́ bí nígbà tí fìtílà bá tàn sí ọ pẹ̀lú ìmọ́lẹ̀ ojijì.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mànàmáná, ìmọ́lẹ̀ ojijì, tàbí ìtànṣán; níhìn-ín ó ṣeé ṣe kí ó ń tọ́ka sí ìtànṣán fìtílà, kì í ṣe mànàmáná gangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: ara
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ara’ ní tààrà; yíyan ‘ara’ pa àwòrán tí Jésù lò nípa ojú, ara àti ìmọ́lẹ̀ mọ́ láì túmọ̀ rẹ̀ sí ipò inú lọ́nà àlàyé.
- source_word: ὅλον
  choice: gbogbo / gbogbo rẹ̀
  rationale: Ó pa agbára ìtumọ̀ pé kò sí apá kan tí a yọ sílẹ̀ mọ́, ó sì jẹ́ Yorùbá àdánidá ní ibi méjèèjì tí ọ̀rọ̀ náà ti fara hàn.
- source_word: φωτεινόν
  choice: kún fún ìmọ́lẹ̀
  rationale: Gbólóhùn yìí jẹ́ kedere, ó sì bá ìtakora pẹ̀lú ‘apá òkùnkùn’ mu ju ọ̀rọ̀ tí ó túmọ̀ sí dídán nìkan lọ.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: tí kò sì ní apá òkùnkùn kankan
  rationale: Ó mú àwòrán gidi ti apá kan tí ó ṣókùnkùn dúró, ní Yorùbá tí ó rọrùn láti lóye.
- source_word: ἔσται
  choice: yóò kún fún ìmọ́lẹ̀
  rationale: Ó fi ọ̀nà ọjọ́ iwájú ti ἔσται hàn, nígbà tí àfikún ‘kún fún ìmọ́lẹ̀’ mú àsọtẹ́lẹ̀ náà pé ní Yorùbá.
- source_word: ὡς ὅταν
  choice: bí ìgbà tí
  rationale: Ó ṣàfihàn ìfiwéra àti àkókò lẹ́ẹ̀kan náà ní ọ̀nà Yorùbá àdánidá.
- source_word: λύχνος
  choice: fìtílà
  rationale: λύχνος jẹ́ ohun èlò ìmọ́lẹ̀ kékeré tí a ń gbé, kì í ṣe ìmọ́lẹ̀ aláìlérò tàbí ibi tí a gbé fìtílà sí.
- source_word: τῇ ἀστραπῇ
  choice: fi ìtànṣán rẹ̀
  rationale: ἀστραπή lè túmọ̀ sí mọ̀nàmọ́ná, ìmọ́lẹ̀ tí ó kọ mànà, tàbí ìtànṣán; níbi tí fìtílà ti jẹ́ olùṣe, ‘ìtànṣán rẹ̀’ jẹ́ èyí tí ó bá àyíká mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn míì mọ́.
- source_word: φωτίζῃ σε
  choice: tan ìmọ́lẹ̀ sí ọ
  rationale: Ó pa ẹni kejì kan ṣoṣo σε mọ́, ó sì sọ ìṣe fífúnni ní ìmọ́lẹ̀ ní Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Agbára àpẹẹrẹ ‘ara’ àti ‘ìmọ́lẹ̀’
  choice: Pa àwòrán ara, òkùnkùn àti ìmọ́lẹ̀ mọ́ láì ṣàlàyé rẹ̀ gẹ́gẹ́ bí ọkàn tàbí ipò ìwà.
  alternative: Túmọ̀ ọ́ ní àlàyé gẹ́gẹ́ bí gbogbo ìgbésí ayé inú tàbí ipò ẹ̀mí ẹni.
  rationale: Àyíká ọ̀rọ̀ náà so ojú pọ̀ mọ́ fìtílà ara; títúmọ̀ àwọn àwòrán náà ní tààrà ń pa ìtumọ̀ ẹ̀kọ́ àti àìdánilójú tí ó yẹ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Fìtílà’ àti ‘tan ìmọ́lẹ̀ sí ọ’ jẹ́ ọ̀rọ̀ tí òǹkàwé nav wọ́pọ̀ lè lóye, nígbà tí ìṣètò gbólóhùn náà pa ìtẹnumọ́ ‘gbogbo’ méjèèjì mọ́.
