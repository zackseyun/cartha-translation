  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: yo
  text: Wọ́n sì ṣe bẹ́ẹ̀[a], wọ́n sì mú kí gbogbo wọn jókòó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ìrísí ọ̀rọ̀ náà, “wọ́n mú gbogbo wọn dùbúlẹ̀ fún oúnjẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ṣíṣètò àwọn ènìyàn fún oúnjẹ, níbi tí dídúbúlẹ̀ ti wọ́pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ìṣe yìí mọ́ àṣẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀síwájú nínú ìtàn Yorùbá.
- source_word: ἐποίησαν οὕτως
  choice: wọ́n ṣe bẹ́ẹ̀
  rationale: Gbólóhùn yìí tọ́ka padà sí àṣẹ Jésù nínú ẹsẹ tó ṣáájú, ó sì túmọ̀ οὕτως ní ọ̀nà ṣókí àti àdánidá.
- source_word: καὶ
  choice: wọ́n sì
  rationale: Ó pa ìsopọ̀ àwọn ìṣe méjèèjì mọ́ láì fi ìtumọ̀ àkókò míì kún un.
- source_word: κατέκλιναν
  choice: mú kí ... jókòó
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ti ìṣe okùnfà, ó sì ń tọ́ka sí ṣíṣètò àwọn ènìyàn sílẹ̀ fún oúnjẹ; ‘mú kí ... jókòó’ jẹ́ Yorùbá òde òní tó ṣe kedere, tó sì pa agbára okùnfà náà mọ́.
- source_word: ἅπαντας
  choice: gbogbo wọn
  rationale: Ó pa ìtumọ̀ àpapọ̀ mọ́, pé kò sí ẹni tí a yọ sílẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tó yẹ; ‘jókòó’ ni a yàn gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, nígbà tí àlàyé ìdúbúlẹ̀ fún oúnjẹ wà nínú àlàyé ìsàlẹ̀.
