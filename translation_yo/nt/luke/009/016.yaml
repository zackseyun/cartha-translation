id: LUK.9.16
reference: Luke 9:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: yo
  text: Nígbà náà, ó mú búrẹ́dì márùn-ún àti ẹja méjì náà, ó gbé ojú rẹ̀ sókè sí ọ̀run, ó bù kún wọn[a], ó ṣẹ́ wọ́n, ó sì ń fún àwọn ọmọ-ẹ̀yìn láti gbé wọn kalẹ̀ níwájú ogunlọ́gọ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dúpẹ́ fún wọn.” Ọ̀rọ̀ Gíríìkì níbí jẹ́ “ó bù kún,” ṣùgbọ́n àwọn ìtàn mìíràn tó jọ èyí lo ọ̀rọ̀ kan tó túmọ̀ sí “ó dúpẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: ó mú
  rationale: Aorist participle náà ṣáájú àwọn ìṣe pàtàkì; gbolohun aláìgbẹ́mìnira pẹ̀lú ‘ó mú’ jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ mọ́.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Ó ń so ìṣẹ̀lẹ̀ tuntun mọ́ ohun tó ṣáájú rẹ̀ nínú ìtàn láìfi ìtakora kún un.
- source_word: ἄρτους
  choice: ìṣù búrẹ́dì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan, kì í ṣe búrẹ́dì gẹ́gẹ́ bí oúnjẹ lápapọ̀.
- source_word: ἰχθύας
  choice: ẹja
  rationale: ‘Ẹja’ lè dúró fún ọ̀kan tàbí ọ̀pọ̀ ní Yorùbá; ‘méjì’ mú iye náà ṣe kedere.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ó gbé ojú sókè ọ̀run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wo òkè sí ọ̀run, ó sì pa ìrísí ìdúró adúrà náà mọ́.
- source_word: εὐλόγησεν αὐτοὺς
  choice: ó súre fún wọn
  rationale: Ó tẹ̀ lé ìtumọ̀ pàtó ti εὐλογέω àti arọ́pò-orúkọ ọ̀pọ̀ αὐτούς, tó tọ́ka sí búrẹ́dì àti ẹja náà.
- source_word: κατέκλασεν
  choice: ó bù wọ́n
  rationale: ‘Bù’ jẹ́ ọ̀rọ̀ Yorùbá tó bá pípín oúnjẹ sí wẹ́wẹ́ mu; arọ́pò-orúkọ náà mú ohun tí ó bù ṣe kedere.
- source_word: ἐδίδου
  choice: ó sì ń fi wọ́n fún
  rationale: Àmì ‘ń’ fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ó tẹ̀ lé ọ̀rọ̀ náà pẹ̀lú article láìṣàfikún ‘rẹ̀,’ èyí tí kò sí ní pàtó nínú Gíríìkì.
- source_word: παραθεῖναι
  choice: láti gbé wọn kalẹ̀ níwájú
  rationale: Ó pa ìtumọ̀ gidi ti fífi oúnjẹ síwájú àwọn ènìyàn mọ́ ju ọ̀rọ̀ ìtumọ̀ gbòòrò bí ‘láti pín’ lọ.
- source_word: ὄχλῳ
  choice: ogunlọ́gọ̀ náà
  rationale: ‘Ogunlọ́gọ̀’ fi hàn pé ọ̀pọ̀ ènìyàn tí ó péjọ ni ọ̀rọ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ οὐρανός ní àyíká adúrà
  choice: ọ̀run
  alternative: ojú ọ̀run
  rationale: Wíwo sókè bá ìbùkún tí a ń sọ níwájú Ọlọ́run mu; ‘ọ̀run’ pa ìtumọ̀ ẹ̀sìn náà mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Bí a ṣe túmọ̀ εὐλόγησεν
  choice: ó súre fún wọn
  alternative: ó dúpẹ́ nítorí wọn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ‘súre/bù kún,’ kì í ṣe ọ̀rọ̀ pàtó fún ‘dúpẹ́.’ Yíyan èyí kò fi ipa mú ẹsẹ̀ náà bá àwọn ìtàn tó jọ ọ́ mu, ó sì pa àìdánilójú ìtumọ̀ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ ti àdánidá; a lo ‘ìṣù búrẹ́dì’ fún loaf àti ‘ogunlọ́gọ̀’ fún crowd.
