source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: yo
  text: Ó sì rán wọn lọ láti kéde ìjọba Ọlọ́run[a] àti láti wò àwọn aláìsàn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣàkóso Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán wọn lọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘rán’ tàbí ‘rán jáde.’ ‘Rán wọn lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi iṣẹ́ tí a rán wọn ṣe hàn nínú àyíká ọ̀rọ̀ yìí.
- source_word: κηρύσσειν
  choice: kéde
  rationale: ‘Kéde’ fi ìtumọ̀ pípolongo ní gbangba hàn, láìfi ọ̀rọ̀ náà mọ́ iṣẹ́ ìwàásù inú ilé ìjọsìn nìkan.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ ọ̀rọ̀ Bíbélì tí ó ṣe kedere, ó sì lè gba ìtumọ̀ agbègbè ìjọba àti ti bí Ọlọ́run ṣe ń ṣàkóso.
- source_word: ἰᾶσθαι
  choice: wo ... sàn
  rationale: ‘Wo ... sàn’ jẹ́ gbólóhùn Yorùbá àdánidá fún mímú aláìsàn láradá.
- source_word: τοὺς ἀσθενεῖς
  choice: àwọn aláìsàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀσθενής tún lè túmọ̀ sí ẹni aláìlera, iṣẹ́ ìwòsàn nínú àyíká yìí fi hàn pé àwọn tí àìsàn ń ṣe ni a ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ pa fífẹ̀ ìtumọ̀ gbólóhùn Gíríìkì mọ́, nígbà tí ‘ìṣàkóso Ọlọ́run’ tẹnu mọ́ Ọlọ́run gẹ́gẹ́ bí ẹni tí ń jọba. A fi èkejì sí àlàyé ìsàlẹ̀ láti pa àṣàyàn ìtumọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye ni a lò. ‘Kéde’ yàgò fún ìtumọ̀ tó lè dín iṣẹ́ náà kù sí ìwàásù inú ilé ìjọsìn, ‘rán wọn lọ’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún iṣẹ́ tí a gbé lé wọn lọ́wọ́.
