id: LUK.9.10
reference: Luke 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: yo
  text: Nígbà tí àwọn àpọ́sítélì padà, wọ́n ròyìn fún un gbogbo ohun tí wọ́n ti ṣe. Ó sì mú wọn lọ pẹ̀lú rẹ̀, ó sì kúrò lọ ní àdáni sí ìlú kan tí a ń pè ní Bẹtisáídà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́tọ̀” tàbí “ní ìpamọ́.” Gbólóhùn náà fi hàn pé Jésù àti àwọn àpọ́sítélì yọ kúrò lọ́dọ̀ àwọn èrò; kò ṣe dandan kí ó túmọ̀ sí pé Jésù wà ní òun nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Nígbà tí ... padà
  rationale: Aorist participle náà fi ìṣẹ̀lẹ̀ tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn; gbólóhùn àsìkò yìí bójú mu ní Yorùbá.
- source_word: ἀπόστολοι
  choice: àwọn aposteli
  rationale: Ní Lúùkù, ọ̀rọ̀ náà jẹ́ orúkọ ìdánimọ̀ fún àwọn Méjìlá tí a rán lọ; ‘aposteli’ ni ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀.
- source_word: διηγήσαντο
  choice: ròyìn
  rationale: Ó túmọ̀ sí sísọ tàbí ṣíṣe àlàyé ohun tí ó ṣẹlẹ̀; ‘ròyìn’ bá ìpadà wọn láti iṣẹ́-ìránṣẹ́ mu láìfi ìlànà iṣẹ́ ọ́fíìsì kún un.
- source_word: ὅσα ἐποίησαν
  choice: gbogbo ohun tí wọ́n ti ṣe
  rationale: ὅσα ń tọ́ka sí gbogbo àwọn ohun tí wọ́n ṣe; ‘ti ṣe’ fi hàn pé iṣẹ́ náà ti wáyé ṣáájú ìròyìn wọn.
- source_word: παραλαβὼν αὐτούς
  choice: Ó sì mú wọn lọ pẹ̀lú rẹ̀
  rationale: Ó fi hàn pé Jésù mú wọn gẹ́gẹ́ bí ẹlẹgbẹ́ rẹ̀, kì í ṣe pé ó kàn gbé wọn.
- source_word: ὑπεχώρησεν
  choice: ó sì kúrò níbẹ̀ lọ
  rationale: Ọ̀rọ̀ náà ń sọ nípa yíyọ kúrò lọ́dọ̀ ọ̀pọ̀ ènìyàn tàbí iṣẹ́ gbangba; èyí jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí lọ́tọ̀ tàbí ní àdáni, ní pàtàkì kúrò lọ́dọ̀ àwọn èrò; kò túmọ̀ sí pé Jésù dá wà, nítorí ó mú àwọn aposteli lọ pẹ̀lú rẹ̀.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: sí ìlú kan tí a ń pè ní Bẹtisáídà
  rationale: πόλις lè jẹ́ ìlú ńlá tàbí ìlú kékeré; ‘ìlú’ pa ìwọ̀n rẹ̀ mọ́ láìpinnu rẹ̀. A ṣàkọsílẹ̀ orúkọ ibẹ̀ ní ìbámu pẹ̀lú ìró Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ κατ’ ἰδίαν nígbà tí àwọn aposteli wà pẹ̀lú Jésù
  choice: ní ìkọ̀kọ̀
  alternative: lọ́tọ̀; ní àdáni
  rationale: Àyíká ọ̀rọ̀ kò jẹ́ kí a túmọ̀ ọ́ sí pé Jésù dá wà. Ó ń tọ́ka sí yíyọ kúrò lọ́dọ̀ àwọn èrò fún àkókò àdáni.
translation_notes:
  register: Yorùbá àṣàṣe, ọlọ́lá, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu; a sì yàgò fún ọ̀rọ̀ tí yóò mú kí ó dà bí ẹni pé Jésù dá wà.
