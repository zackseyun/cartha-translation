  to: Nígbà tí àwọn àpọ́sítélì padà, wọ́n ròyìn fún un gbogbo ohun tí wọ́n ti ṣe. Ó sì mú wọn lọ pẹ̀lú rẹ̀, ó sì kúrò lọ ní àdáni sí ìlú kan tí a ń pè ní Bẹtisáídà.[a]
