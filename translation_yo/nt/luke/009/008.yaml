source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: yo
  text: Àwọn kan sì ń sọ pé, Èlíjà ti farahàn; àwọn mìíràn sì ń sọ pé, ọ̀kan lára àwọn wòlíì ìgbà àtijọ́ ti jí dìde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wòlíì kan láti ìgbà àtijọ́ ti jí dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: Àwọn mìíràn sì ń sọ pé ... àwọn mìíràn sì ń sọ pé
  rationale: Èdè Gíríìkì fi ẹni tí ìròyìn náà ti ọ̀dọ̀ rẹ̀ wá hàn ní ọ̀nà àkótán. Ṣíṣe e ní ‘àwọn mìíràn ń sọ pé’ jẹ́ èdè Yorùbá àdánidá, ó sì mú ìtumọ̀ gbolohun tí ó ṣáájú tẹ̀ síwájú.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń so àwọn èrò inú àtòjọ pọ̀ pẹ̀lú ìyàtọ̀ díẹ̀; ‘sì’ bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Èyí ni ìrísí orúkọ wòlíì náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ἐφάνη
  choice: ti farahàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó di ohun tí a lè rí tàbí pé ó farahàn. ‘Ti farahàn’ yà á sọ́tọ̀ kúrò nínú èdè jíjí dìde ní apá kejì.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ọ̀kan lára àwọn wòlíì ìgbà àtijọ́
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún wòlíì kan tí ó jẹ́ ti ẹgbẹ́ àwọn ẹni ìgbà àtijọ́, láì sọ ẹni tí ó jẹ́ ní pàtó.
- source_word: ἀνέστη
  choice: ti jí dìde
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ dídìde, àti nínú àyíká yìí ó ń tọ́ka sí jíjí dìde kúrò nínú òkú. Ìtumọ̀ náà kò fi ọ̀nà ìṣe àìṣe kan kún Gíríìkì.
theological_decisions:
- issue: Irú ohun tí àwọn ènìyàn ń sọ nípa wòlíì ìgbà àtijọ́
  choice: ti jí dìde
  alternative: ti padà wá; a ti jí i dìde
  rationale: ἀνέστη ń tọ́ka sí dídìde, tí àyíká ọ̀rọ̀ sì mú kí jíjí dìde kúrò nínú òkú ṣeé lóye. A pa èdè ìròyìn mọ́, láì fìdí òótọ́ èrò àwọn ènìyàn náà múlẹ̀ tàbí sọ wòlíì tí wọ́n ní lọ́kàn.
translation_notes:
  register: Yorùbá boṣewa, èdè ọ̀wọ̀ àti òde òní, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A tún ọ̀rọ̀-ìṣe ‘ń sọ pé’ ṣe láti mú àkótán Gíríìkì ṣe kedere àti àdánidá ní Yorùbá.
