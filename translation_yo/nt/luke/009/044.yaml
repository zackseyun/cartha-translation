  to: “Ẹ̀yin, ẹ fi àwọn ọ̀rọ̀ wọ̀nyí sí etí yín, nítorí a fẹ́ẹ́ fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́.[a]”
