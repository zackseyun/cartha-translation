language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: yo
  text: “Ẹ̀yin, ẹ fi àwọn ọ̀rọ̀ wọ̀nyí sí etí yín, nítorí a fẹ́ẹ́ fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a fẹ́ẹ́ fi Ọmọ Ènìyàn hàn ní ọ̀dàlẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fi lé lọ́wọ́,” “fi fún,” tàbí, ní àwọn àyíká kan, “fi hàn ní ọ̀dàlẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Ẹ̀yin, ẹ fi … sí etí yín
  rationale: Ọ̀rọ̀ yìí pa àwòrán Gíríìkì náà mọ́—‘fi sínú etí’—ní ọ̀nà tí ó ṣeé lóye ní Yorùbá. ‘Ẹ̀yin’ fi ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς hàn, imperatifi ‘ẹ fi’ sì ń béèrè fífetísílẹ̀ pẹ̀lú ìmọ̀ọ́mọ̀.
- source_word: τοὺς λόγους τούτους
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì tọ́ka sí ohun pàtó tí Jésù fẹ́ sọ.
- source_word: ὁ γὰρ
  choice: nítorí
  rationale: Ó pa ìbáṣepọ̀ ìdí tí γάρ mú wá mọ́, ó sì jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa oyè Jésù yìí mọ́ ní ọ̀nà ìbílẹ̀ àti tààrà, láì tú ìtumọ̀ rẹ̀ sí ẹ̀kọ́ kan ṣoṣo.
- source_word: μέλλει
  choice: láìpẹ́, a ó
  rationale: Ìṣètò yìí fi hàn pé ìṣẹ̀lẹ̀ náà sún mọ́lé, bí μέλλει ṣe túmọ̀ sí, láì fi èrò àyànmọ́ kún un.
- source_word: παραδίδοσθαι εἰς χεῖρας ἀνθρώπων
  choice: a ó fi … lé àwọn ènìyàn lọ́wọ́
  rationale: Gbólóhùn alá ẹni tí a kò dárúkọ ‘a ó fi’ ń fi ìṣe àìṣe-tara Gíríìkì hàn ní Yorùbá àdánidá. ‘Lé … lọ́wọ́’ pa àwòrán jíjẹ́ kí ẹni kan bọ́ sábẹ́ agbára àwọn ẹlòmíràn mọ́; ‘àwọn ènìyàn’ sì jẹ́ ìtumọ̀ tó bójú mu fún ἀνθρώπων láì fi akọ nìkan sí i.
theological_decisions:
- issue: Ìtumọ̀ oyè ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ìrísí oyè náà, àìdánilójú rẹ̀, àti ìró ìtọ́kasí rẹ̀ sí Dáníẹ́lì 7 mọ́ dáadáa ju àtúmọ̀ tó ń ṣàlàyé rẹ̀ lọ.
- issue: Ìwọ̀n ìtumọ̀ παραδίδοσθαι
  choice: fi … lé … lọ́wọ́
  alternative: tà … jẹ / fi … hàn ní ọ̀dàlẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹni lé ẹlòmíràn lọ́wọ́ tàbí jíjẹ ẹni níyàn. Ìtumọ̀ àkọ́kọ́ pa ìwọ̀n rẹ̀ gbòòrò mọ́, kò sì fi ìṣẹ̀lẹ̀ náà mọ Júúdásì nìkan ṣáájú àkókò.
- issue: Ìtumọ̀ ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ní àyíká yìí, ἄνθρωπος lè tọ́ka sí àwọn ẹ̀dá ènìyàn lápapọ̀. Yorùbá ‘àwọn ènìyàn’ pa ìtumọ̀ yẹn mọ́, ó sì ṣì mú ìyàtọ̀ láàárín ‘Ọmọ Ènìyàn’ àti àwọn ènìyàn tí a fi í lé lọ́wọ́ hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ọlọ́wọ̀, tààrà, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘sí etí yín’ mọ́ nítorí pé ó ṣe kedere, ó sì ń fún àṣẹ náà ní agbára.
