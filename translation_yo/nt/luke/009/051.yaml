id: LUK.9.51
reference: Luke 9:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí àwọn ọjọ́ gbígbé e sókè[a] ń pé, òun fúnra rẹ̀ pinnu ṣinṣin[b] láti lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọjọ́ ìgòkè rẹ̀ sí ọ̀run.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “gbígbé e sókè.”
    reason: alternative_reading
  - marker: b
    text: Ní ọ̀rọ̀ Gíríìkì, ó “fi ojú rẹ̀ múlẹ̀”; èyí jẹ́ àṣà ọ̀rọ̀ tó ń fi ìpinnu ṣinṣin hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Àgbékalẹ̀ yìí ń ṣàmì sí ìyípadà nínú ìtàn; “sì” gba ipa ìsopọ̀ δὲ láì fi ọ̀rọ̀ àkókò bí “nígbà náà” kún un.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: bí àwọn ọjọ́ ... ti ń pé
  rationale: “Bí” fi ìtumọ̀ àkókò hàn, “ti ń pé” sì pa ìlọsíwájú ìmú àkókò dé òpin mọ́, ní èdè Yorùbá àdánidá.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: ìgbà tí a ó gbé e sókè
  rationale: Ó pa ìtumọ̀ gbooro ti ἀνάλημψις, ‘gbígbé sókè,’ mọ́, láì fi dandan sọ ọ́ di ìgòkè re ọ̀run nìkan.
- source_word: καὶ αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó mú ìtẹnumọ́ inú αὐτὸς jáde ní kedere.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: mú ọkàn le
  rationale: Àṣà ọ̀rọ̀ Yorùbá yìí sọ ìpinnu tí ó fẹsẹ̀ múlẹ̀ ní èdè tí òǹkàwé òde òní lóye, dípò títúmọ̀ àwòrán ojú ní ọ̀rọ̀-ọ̀rọ̀.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: láti lọ sí Jerúsálẹ́m
  rationale: Ó sọ ète ìpinnu náà àti ibi tí ó ń lọ ní ọ̀nà Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀναλήμψεως αὐτοῦ
  choice: ìgbà tí a ó gbé e sókè
  alternative: ìgbà ìgòkè rẹ̀ re ọ̀run
  rationale: 'Àṣàyàn àkọ́kọ́ pa àìdánilójú tó bófin mu mọ́: ọ̀rọ̀ náà lè tọ́ka sí ìgòkè re ọ̀run, ṣùgbọ́n ó tún lè gba gbogbo ìrìnàjò sí ikú, àjíǹde àti gbígbé ga sínú.'
- issue: Agbára àṣà ọ̀rọ̀ τὸ πρόσωπον ἐστήρισεν
  choice: mú ọkàn le
  alternative: gbé ojú rẹ̀ kalẹ̀ ṣinṣin
  rationale: A fi ìpinnu Jésù tí kò yí padà hàn láì ṣàfikún ẹ̀kọ́ ìsìn tàbí ìtumọ̀ tí kò sí nínú orísun.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà ní ọlá, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “mú ọkàn le” gẹ́gẹ́ bí àṣà ọ̀rọ̀ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán ojú inú Gíríìkì mọ́.
