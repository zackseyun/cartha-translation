  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: yo
  text: Àwọn náà, tí wọ́n fara hàn nínú ògo, ń sọ̀rọ̀ nípa ìjáde rẹ̀, èyí tí ó fẹ́rẹ̀ máa mú ṣẹ ní Jerusalẹmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a tú sí “ìjáde” lè tọ́ka sí ikú Jesu àti gbogbo ọ̀nà tí yóò fi kúrò ní ayé; ó tún lè rán ènìyàn létí Eksodu, ìjáde àwọn ọmọ Israẹli kúrò ní Ejibiti.
    reason: Láti ṣàlàyé ìtumọ̀ gbooro àti ìṣàpẹẹrẹ Eksodu tí ἔξοδος lè ní, láì sọ pé ìtumọ̀ kan ṣoṣo ni ó dájú.
lexical_decisions:
- source_word: οἳ ὀφθέντες ἐν δόξῃ
  choice: Àwọn ẹni tí ó fara hàn nínú ògo
  rationale: Ó pa ìtumọ̀ participle náà mọ́ pé àwọn méjèèjì fara hàn, ó sì tú ἐν δόξῃ ní ọ̀nà àdánidá gẹ́gẹ́ bí “nínú ògo.”
- source_word: ἔλεγον
  choice: ń sọ̀rọ̀
  rationale: Imperfect náà fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń sọ̀rọ̀” jẹ́ Yorùbá àdánidá fún ìjíròrò wọn.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: ìjáde rẹ̀
  rationale: “Ìjáde” pa àwòrán gbooro ἔξοδος mọ́, tí ó lè tọ́ka sí ikú, ìjíǹde, àti ìlọkè Jesu láì dín un kù sí “ikú” nìkan.
- source_word: ἣν ἤμελλεν πληροῦν
  choice: èyí tí ó fẹ́ mú ṣẹ
  rationale: “Ó fẹ́” nínú àyíká yìí tú ìṣẹ̀lẹ̀ tó sún mọ́lẹ̀ tí ἤμελλεν ń tọ́ka sí; “mú ṣẹ” pa èrò πληροῦν mọ́ pé yóò mú ohun tí a pinnu tàbí sọ tẹ́lẹ̀ dé ìmúṣẹ.
- source_word: ἐν Ἰερουσαλήμ
  choice: ní Jerusalẹmu
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá ti ibi tí ìmúṣẹ náà yóò ti ṣẹlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἔξοδος gẹ́gẹ́ bí ọ̀nà tí Jesu yóò fi kúrò ayé
  choice: ìjáde rẹ̀
  alternative: ikú rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àfojúsùn tó gbooro ju ikú nìkan lọ, ó sì lè ru ìrántí Eksodu; a kò yẹ kí a yanju àìdánilójú yìí ní ìtumọ̀.
- issue: Ìtumọ̀ πληροῦν
  choice: mú ṣẹ
  alternative: ṣe parí
  rationale: “Mú ṣẹ” fi ìmúṣẹ ète Ọlọ́run hàn láì sọ kedere ju orísun lọ pé àsọtẹ́lẹ̀ pàtó kan ni.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó yẹ; ìlànà ọ̀rọ̀ jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Àwọn ẹni” ń bá ẹsẹ tó ṣáájú mu níwọ̀n bí ẹsẹ yìí ti bẹ̀rẹ̀ pẹ̀lú relative pronoun.
