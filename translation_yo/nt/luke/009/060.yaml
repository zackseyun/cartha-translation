- from: Ṣùgbọ́n ó sọ fún un pé, “Fi àwọn òkú sílẹ̀ kí wọ́n máa sin àwọn òkú tiwọn fúnra wọn; ṣùgbọ́n ìwọ, lọ, kí o sì máa kéde ìjọba Ọlọ́run.”[a]
  to: Ṣùgbọ́n ó sọ fún un pé, “Fi àwọn òkú sílẹ̀ kí wọ́n sin àwọn òkú tiwọn; ṣùgbọ́n ìwọ, lọ kí o sì máa kéde ìjọba Ọlọ́run.”[a]
  rationale: Àtúnṣe náà yọ ‘máa’ kúrò nínú ìsìnkú láti má fi ìtẹ̀síwájú tí Gíríìkì kò sọ kún un, ó sì mú ‘tiwọn’ nìkan lo fún ἑαυτῶν kí gbolohun náà lè dáa síi ní Yorùbá. A pa ìtúnlò ‘òkú,’ àṣẹ líle náà, àti ìtumọ̀ ‘ìjọba Ọlọ́run’ mọ́. Àkọsílẹ̀ [a] sì ṣàlàyé ìtumọ̀ tó ṣeé ṣe láì dá àìdájú inú ọ̀rọ̀ ẹsẹ̀ náà silẹ̀.
