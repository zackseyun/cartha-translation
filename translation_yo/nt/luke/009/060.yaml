id: LUK.9.60
reference: Luke 9:60
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Fi àwọn òkú sílẹ̀ kí wọ́n sin àwọn òkú tiwọn; ṣùgbọ́n ìwọ, lọ kí o sì máa kéde ìjọba Ọlọ́run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí ‘àwọn òkú’ àkọ́kọ́ tọ́ka sí àwọn tí kò dáhùn sí Ọlọ́run nípa tẹ̀mí, nígbà tí èkejì ń tọ́ka sí àwọn tí ara wọn kú. Gíríìkì lo ọ̀rọ̀ kan náà ní ibì méjèèjì, ìtumọ̀ yìí sì pa ìtúnlò náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Fi ... sílẹ̀
  rationale: Àṣẹ aorist yìí lágbára, ó sì ń pe ẹni náà láti jáwọ́ nínú iṣẹ́ tí ó béèrè láti ṣe; ‘Fi ... sílẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa agbára àṣẹ náà mọ́.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: àwọn òkú ... àwọn òkú tiwọn fúnra wọn
  rationale: A tún ‘òkú’ lò ní ibì méjèèjì láti pa ìtakora tó múni ronú nínú Gíríìkì mọ́, láì ṣàlàyé ọ̀kan gẹ́gẹ́ bí ti ẹ̀mí nínú ẹsẹ̀ náà.
- source_word: θάψαι
  choice: kí wọ́n máa sin
  rationale: Ó sọ ohun tí a fi àwọn òkú sílẹ̀ láti ṣe; ‘sin’ ni ọ̀rọ̀ Yorùbá àdánidá fún fífi òkú sínú ibojì.
- source_word: ἑαυτῶν
  choice: tiwọn fúnra wọn
  rationale: Ọ̀rọ̀ yìí pa ìtẹnumọ́ arọ́pò-orúkọ alápadà mọ́ ju ‘tiwọn’ nìkan lọ.
- source_word: ἀπελθὼν
  choice: lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé participle aorist ni, títúmọ̀ rẹ̀ sí ‘lọ’ nínú àtẹ̀lé àṣẹ jẹ́ Yorùbá tó ṣe déédé, ó sì pa ìṣísẹ̀ tí ó ṣáájú ìkéde mọ́.
- source_word: διάγγελλε
  choice: máa kéde
  rationale: Àṣẹ present náà tọ́ka sí ìṣe tí ó ń bá a lọ tàbí ìkéde ní gbangba; ‘máa kéde’ mú apá méjèèjì yìí jáde.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Bíbélì Yorùbá tó wọ́pọ̀, ó sì lè túmọ̀ sí agbègbè ìjọba àti ìṣàkóso Ọlọ́run láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn òkú’ ní ìgbà àkọ́kọ́ àti ìgbà kejì
  choice: Pa ‘àwọn òkú’ mọ́ ní ibì méjèèjì láì fi ‘nípa tẹ̀mí’ kún ọ̀rọ̀ inú ẹsẹ̀.
  alternative: Fi àwọn tí ó kú nípa tẹ̀mí sílẹ̀ kí wọ́n sin àwọn òkú tiwọn fúnra wọn.
  rationale: Ó ṣeé ṣe kí ‘àwọn òkú’ àkọ́kọ́ jẹ́ àkàwé fún àwọn tí kò dáhùn sí Ọlọ́run, nígbà tí èkejì ń tọ́ka sí àwọn tí ara wọn kú. Síbẹ̀, Gíríìkì lo ọ̀rọ̀ kan náà ní méjèèjì; nítorí náà, a pa àdììtú àti ìfúnpá ẹ̀kọ́ ọ̀rọ̀ Jesu mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Kí wọ́n máa sin’ àti ‘kí o sì máa kéde’ jẹ́ àtẹ̀lé àṣẹ àdánidá; àmì ẹsẹ̀ [a] wà lẹ́yìn ọ̀rọ̀ Jesu kí ó lè ṣàlàyé gbogbo àdììtú náà.
