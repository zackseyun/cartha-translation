  source_fidelity: Ìtumọ̀ náà pa ìtúnlò νεκρούς (‘òkú’) mọ́ ní ibì méjèèjì, ó sì túmọ̀ Ἄφες, θάψαι, διάγγελλε, àti βασιλείαν τοῦ θεοῦ pẹ̀lú ìdúróṣinṣin. Ṣùgbọ́n ‘kí wọ́n máa sin’ lè mú kí ìṣe ìsìnkú dà bí ohun tí ń ṣẹlẹ̀ léraléra; infinitive θάψαι ń tọ́ka sí ìṣe ìsìnkú náà láì fi àṣà ìtẹ̀síwájú hàn. ‘Fúnra wọn’ pẹ̀lú ‘tiwọn’ tún ń fi ìtẹnumọ́ reflexive hàn ju bí Yorùbá ṣe nílò lọ, bí ó tilẹ̀ jẹ́ pé ìtẹnumọ́ náà wà nínú Gíríìkì.
  naturalness: ‘Fi ... sílẹ̀ kí wọ́n sin ...’ jẹ́ Yorùbá boṣewa, kedere, ó sì rọrùn ju ‘kí wọ́n máa sin’ lọ nínú ọ̀rọ̀ ìpèníjà yìí. ‘Ṣùgbọ́n ìwọ, lọ kí o sì máa kéde’ ń ṣiṣẹ́ dáadáa gẹ́gẹ́ bí àtẹ̀lé àṣẹ, tí ó ń ṣàfihàn participle ἀπελθών àti imperative διάγγελλε.
  terminology: ‘Ìjọba Ọlọ́run’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó bójú mu. ‘Àwọn òkú’ ní ìgbà méjèèjì ń dáàbò bo àìdájú/ìtakora tí ọrọ̀ Gíríìkì ní; a kò gbọ́dọ̀ fi ‘nípa tẹ̀mí’ sínú ọ̀rọ̀ ẹsẹ̀.
