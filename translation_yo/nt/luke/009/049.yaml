id: LUK.9.49
reference: Luke 9:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: yo
  text: Nígbà náà ni Johanu dáhùn pé, “Olùkọ́, a rí ẹnì kan tí ó ń lé àwọn ẹ̀mí èṣù jáde ní orúkọ rẹ, a sì gbìyànjú láti dá a dúró, nítorí pé kò bá wa tẹ̀lé[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò tẹ̀lé wa.” Ní ti gidi, Gíríìkì sọ pé “kò tẹ̀lé pẹ̀lú wa,” èyí tó lè tẹnumọ́ pé kì í ṣe ara ẹgbẹ́ àwọn ọmọ-ẹ̀yìn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: Nígbà náà ni Johanu dáhùn pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà ìtàn Gíríìkì láti so ohun tí Johanu sọ mọ́ ọ̀rọ̀ tó ṣáájú; “Nígbà náà ni … dáhùn” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìdáhùn àti ìlọsíwájú ìtàn mọ́.
- source_word: Ἐπιστάτα
  choice: Olùkọ́
  rationale: Nínú Lúùkù, ọ̀rọ̀ ìpè yìí fi àṣẹ àti ipò aṣáájú Jesu hàn. “Olùkọ́” jẹ́ ọ̀rọ̀ ọlọ́lá, tí ó yé àwọn òǹkàwé Yorùbá, láìfi oyè ẹ̀kọ́ ìjọ kan kún un.
- source_word: εἴδομέν τινα
  choice: a rí ẹnì kan
  rationale: τινα kò dá ẹni náà mọ̀ ní pàtó; “ẹnì kan” pa àìdánimọ̀ yẹn mọ́ ní Yorùbá.
- source_word: ἐν τῷ ὀνόματί σου
  choice: ní orúkọ rẹ
  rationale: Èyí pa àpólà orísun mọ́, ó sì lè túmọ̀ sí ṣíṣe ohun kan lábẹ́ àṣẹ tàbí nípa agbára orúkọ Jesu.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: tí ó ń lé àwọn ẹ̀mí èṣù jáde
  rationale: “Lé … jáde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ἐκβάλλω nínú ọ̀rọ̀ ìlé ẹ̀mí èṣù jáde; “àwọn ẹ̀mí èṣù” jẹ́ ìtumọ̀ tó wọ́pọ̀, tó sì yé ènìyàn fún δαιμόνια.
- source_word: ἐκωλύομεν
  choice: a sì gbìyànjú láti dá a dúró
  rationale: Ìṣe aláìparí nínú Gíríìkì lè tọ́ka sí ìsapá tàbí ìṣe tó ń lọ lọ́wọ́. “Gbìyànjú láti dá a dúró” fi hàn pé wọ́n fẹ́ fòfin dè é, láìsọ pé wọ́n ṣàṣeyọrí dandan.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: nítorí pé kò bá wa tẹ̀ lé
  rationale: “Bá wa” dúró fún μεθ’ ἡμῶν, “tẹ̀ lé” sì dúró fún ἀκολουθεῖ. Gbólóhùn náà jẹ́ kí àfojúsùn ìtẹ̀lé wà ní ìfarapamọ́ bí ó ti rí nínú orísun, kò sì sọ pé ọkùnrin náà kọ Jesu sílẹ̀.
theological_decisions:
- issue: Àìdájú nípa ẹni tí ọkùnrin náà ń tẹ̀ lé àti bí ó ṣe jẹ́ ara ẹgbẹ́ àwọn ọmọ-ẹ̀yìn
  choice: kò bá wa tẹ̀ lé
  alternative: kò tẹ̀ lé wa
  rationale: 'μεθ’ ἡμῶν túmọ̀ sí “pẹ̀lú wa/bá wa,” kì í ṣe pé ó kan ń tẹ̀ lé “wa” gẹ́gẹ́ bí ohun tí ìṣe náà dojú kọ. Ìtumọ̀ yìí pa ìṣòro inú ìtàn mọ́: ẹ̀sùn Johanu lè jẹ́ pé ẹni náà kò darapọ̀ mọ́ ẹgbẹ́ wọn, kì í ṣe dandan pé ó kọ Jesu.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìjọ tàbí ìtumọ̀ tí yóò tú àìdájú orísun.
