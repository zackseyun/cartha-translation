source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: yo
  text: Ṣùgbọ́n Hẹ́rọ́dù wí pé, “Jòhánù ni èmi gé orí rẹ̀; ṣùgbọ́n ta ni ẹni yìí tí mo ń gbọ́ irú nǹkan bẹ́ẹ̀ nípa rẹ̀?” Ó sì ń wá láti rí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó máa ń wá láti rí i.” Ìṣe aláìparí nínú èdè Gíríìkì lè tọ́ka sí ìṣe tó ń bá a lọ tàbí ìṣe tí ó ń ṣẹlẹ̀ léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ń bá ìtàn lọ, ó sì fi ìyàtọ̀ díẹ̀ hàn láàárín àwọn ìròyìn tó ṣáájú àti ohun tí Hẹ́rọ́dù dáhùn.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Ìkọ̀wé orúkọ náà ní ìlànà Yorùbá tó wọ́pọ̀ nínú ìtumọ̀ Bíbélì.
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Ìkọ̀wé orúkọ náà ní ìlànà Yorùbá tó wọ́pọ̀ nínú ìtumọ̀ Bíbélì.
- source_word: ἐγὼ
  choice: Èmi ni mo
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ mọ́, kí ọ̀rọ̀ Hẹ́rọ́dù lè fi ara rẹ̀ hàn kedere gẹ́gẹ́ bí ẹni tó ṣe iṣẹ́ náà.
- source_word: ἀπεκεφάλισα
  choice: gé orí
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pípa ènìyàn nípa gígé orí rẹ̀; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì péye.
- source_word: τίς ... ἐστιν οὗτος
  choice: ta ni ẹni yìí
  rationale: Ó pa ìbéèrè àti ìdálọ́ọ̀rín tó wà nínú ọ̀rọ̀ atọ́ka Gíríìkì mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: περὶ οὗ
  choice: nípa rẹ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ ẹni tí àwọn ohun tí Hẹ́rọ́dù ń gbọ́ ń tọ́ka sí.
- source_word: ἀκούω
  choice: mo ń gbọ́
  rationale: Àmì ìṣe aláìparí Yorùbá ń fi ìgbọ́ tí ó ń ṣẹlẹ̀ lọ́wọ́ hàn ní ti ẹ̀dá.
- source_word: τοιαῦτα
  choice: irú àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́, láìdín in kù sí ‘ìròyìn’ nìkan.
- source_word: ἐζήτει
  choice: Ó sì ń wá ọ̀nà
  rationale: Ó fi ìṣe tó ń bá a lọ nínú imperfect Gíríìkì hàn, ṣùgbọ́n kò fi dandan sọ bóyá ó tún un ṣe léraléra.
- source_word: ἰδεῖν αὐτόν
  choice: láti rí i
  rationale: Ìtumọ̀ tààrà fún ìfẹ́ Hẹ́rọ́dù láti rí Jésù, láìyí i sí ‘láti pàdé rẹ̀.’
theological_decisions:
- issue: Ọ̀rọ̀ Hẹ́rọ́dù nípa Jòhánù àti ìfẹ́ rẹ̀ láti rí Jésù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí gbólóhùn ìtàn àti ìbéèrè tààrà.
  alternative: Kí a fi kún un pé Hẹ́rọ́dù bẹ̀rù pé Jòhánù ti jíǹde.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ pé Hẹ́rọ́dù ro Jésù sí Jòhánù tó jíǹde; nítorí náà, a kò fi ìtumọ̀ tàbí ẹ̀kọ́ tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘Èmi ni mo’ láti pa ìtẹnumọ́ Gíríìkì mọ́, a sì lo ‘ń wá ọ̀nà’ láti fi apá ìṣe tó ń bá a lọ hàn.
