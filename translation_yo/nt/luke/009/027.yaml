review_pass:
  verdict: revise
  source_fidelity: 'The verse’s core sense is retained: an emphatic assurance that some among those present will not experience death before seeing God’s kingdom. However, “mo sọ òtítọ́ fún yín” more naturally means “I tell you the truth,” whereas ἀληθῶς modifies the act of speaking (“truly”). The revision renders this adverbial force directly. The emphatic negative and the deliberately unexpanded “kingdom of God” are preserved.'
  naturalness: The revised wording is idiomatic standard Yorùbá and supplies the required tone marks on the plural pronoun wọ́n. “Tọ́ ikú wò” is retained as an established metaphorical expression corresponding closely to “taste death.”
  terminology: “Ìjọba Ọlọ́run” is appropriate for βασιλεία τοῦ θεοῦ and preserves its breadth. No interpretive identification of what it means to “see” the kingdom has been introduced.
  issues:
  - severity: medium
    issue: The phrase “mo sọ òtítọ́ fún yín” does not precisely render ἀληθῶς.
    rationale: It can mean “I tell you the truth,” treating “truth” as the object, while the Greek says that Jesus speaks truly. “Mo sọ fún yín ní òtítọ́” preserves the adverbial force.
  - severity: low
    issue: The pronoun wọ́n lacks its tone mark twice in the main text.
    rationale: Full tone marking is requested, and wọ́n (“they”) should be distinguished orthographically from wọ́n/other unmarked forms.
  - severity: low
    issue: Footnote a duplicates the main text rather than providing a lexical alternative.
    rationale: The main text already translates the partitive construction as “láàárín/lára àwọn …”; therefore the note adds no alternative information and its anchor should be removed.
  revised_text: Ṣùgbọ́n mo sọ fún yín ní òtítọ́ pé, àwọn kan wà lára àwọn tí ó dúró níhìn-ín tí wọ́n kì yóò tọ́ ikú wò rárá[a] títí wọ́n yóò fi rí ìjọba Ọlọ́run.
  revised_footnotes:
  - marker: a
    text: “Tọ́ ikú wò” jẹ́ àkànlò èdè tó túmọ̀ sí “ní ìrírí ikú,” ìyẹn ni, “kú.”
    reason: lexical_alternative
  revision_rationale: The revision makes “truly” adverbial in Yorùbá, restores full tone marks on wọ́n, and removes the redundant partitive footnote. The idiom for experiencing death, the Greek emphatic negation (“kì yóò … rárá”), the future temporal clause, and the unqualified “ìjọba Ọlọ́run” remain intact.
