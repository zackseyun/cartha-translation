revisions:
- from: Ṣùgbọ́n mo sọ òtítọ́ fún yín pé, àwọn kan wà lára àwọn tí ó dúró níhìn-ín[a] tí wọn kì yóò tọ́ ikú wò rárá[b] títí wọn yóò fi rí ìjọba Ọlọ́run.
  to: Ṣùgbọ́n mo sọ fún yín ní òtítọ́ pé, àwọn kan wà lára àwọn tí ó dúró níhìn-ín tí wọ́n kì yóò tọ́ ikú wò rárá[a] títí wọ́n yóò fi rí ìjọba Ọlọ́run.
  rationale: The revision makes “truly” adverbial in Yorùbá, restores full tone marks on wọ́n, and removes the redundant partitive footnote. The idiom for experiencing death, the Greek emphatic negation (“kì yóò … rárá”), the future temporal clause, and the unqualified “ìjọba Ọlọ́run” remain intact.
