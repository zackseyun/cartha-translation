  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín ní òtítọ́ pé, àwọn kan wà lára àwọn tí ó dúró níhìn-ín tí wọ́n kì yóò tọ́ ikú wò rárá[a] títí wọ́n yóò fi rí ìjọba Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tọ́ ikú wò” jẹ́ àkànlò èdè tó túmọ̀ sí “ní ìrírí ikú,” ìyẹn ni, “kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Ṣùgbọ́n mo sọ òtítọ́ fún yín pé
  rationale: “Ṣùgbọ́n” ṣe àfihàn δέ gẹ́gẹ́ bí àmì ìyípadà nínú ọ̀rọ̀; “mo sọ òtítọ́ fún yín” sì túmọ̀ ἀληθῶς lọ́nà àdánidá, tó ṣe kedere ní Yorùbá.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: àwọn kan wà lára àwọn tí ó dúró níhìn-ín
  rationale: “Àwọn kan wà lára” pa ìtumọ̀ aláìnípàtó ti τινες àti ìbáṣepọ̀ apá-nínú-àpapọ̀ ti genitive mọ́; “tí ó dúró níhìn-ín” fi hàn pé àwọn ènìyàn tí ó wà níbẹ̀ lọ́wọ́ ni a ń sọ̀rọ̀ nípa wọn.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: tí wọn kì yóò tọ́ ikú wò rárá
  rationale: “Kì yóò … rárá” mú ìtẹnumọ́ alágbára ti οὐ μή jáde. “Tọ́ ikú wò” pa àwòrán ọ̀rọ̀ γεύομαι mọ́ dípò yíyí i padà sí “kú” nìkan.
- source_word: ἕως ἂν ἴδωσιν
  choice: títí wọn yóò fi rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ààlà àkókò ọjọ́ iwájú tí ἕως ἄν pẹ̀lú subjunctive ń tọ́ka sí.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” jẹ́ ìtumọ̀ tó wọ́pọ̀, tó sì lè gbé ìtumọ̀ ìṣàkóso àti ilẹ̀-ọba tí βασιλεία lè ní láì dín ọ̀rọ̀ náà kù sí ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Ohun tí “rí ìjọba Ọlọ́run” ń tọ́ka sí nínú àyíká ọ̀rọ̀ náà
  choice: A fi gbólóhùn náà sílẹ̀ láì fi àlàyé ìtumọ̀ kan pàtó kún un.
  alternative: Ó lè tọ́ka sí ìyípadà ògo Jésù lórí òkè, àjíǹde àti ìgòkè re ọ̀run, ìparun Jerúsálẹ́mù, tàbí bí ìjọ ṣe tàn ká.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ èwo nínú àwọn ìṣẹ̀lẹ̀ wọ̀nyí ní pàtó. Fífi gbólóhùn náà sílẹ̀ bí ó ti rí ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, láì gbé èrò ẹ̀sìn kan wọ inú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa àwòrán “tọ́ ikú wò” mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
