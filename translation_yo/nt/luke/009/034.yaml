id: LUK.9.34
reference: Luke 9:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: yo
  text: Nígbà tí ó ń sọ àwọn ọ̀rọ̀ wọ̀nyí, ìkùukùu kan farahàn, ó sì ń bo wọ́n ní òjìji[a]; ẹ̀rù sì bà wọ́n bí wọ́n ṣe wọ inú ìkùukùu náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì bo wọ́n ní òjìji.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ títúmọ̀ ní ṣókí láì fi ìtumọ̀ pé ìṣe náà bẹ̀rẹ̀ sí i kún un.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ìkùukùu yìí mú àwọn ìṣẹ̀lẹ̀ inú Májẹ̀mú Láéláé wá sí ìrántí, níbi tí ìkùukùu ti ní í ṣe pẹ̀lú ìfarahàn Ọlọ́run; síbẹ̀, ẹsẹ yìí fúnra rẹ̀ kò sọ èyí ní tààrà.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀pọ̀, ó sì ń tọ́ka sí ohun tí Peteru ṣẹ̀ṣẹ̀ ń sọ; ‘àwọn ọ̀rọ̀ wọ̀nyí’ jẹ́ èdè Yorùbá àdánidá ju ‘àwọn nǹkan wọ̀nyí’ lọ ní àyíká ọ̀rọ̀ sísọ.
- source_word: αὐτοῦ λέγοντος
  choice: nígbà tí ó ṣì ń sọ
  rationale: Gbólóhùn genitive absolute pẹ̀lú present participle fi hàn pé ìṣe náà ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ kejì ṣẹlẹ̀. ‘Ṣì ń sọ’ mú ìtumọ̀ yìí jáde lọ́nà àdánidá.
- source_word: ἐγένετο νεφέλη
  choice: ìkùukùu kan farahàn
  rationale: Ẹ̀ka ọ̀rọ̀ yìí sọ bí ìkùukùu ṣe dé sí ojú ìṣẹ̀lẹ̀ láì sọ ibi tí ó ti wá; ‘farahàn’ jẹ́ kedere, kò sì fi àlàyé àfikún sí i.
- source_word: ἐπεσκίαζεν
  choice: ó sì bẹ̀rẹ̀ sí í ṣíji bò wọ́n
  rationale: Imperfect náà lè fi ìṣe tí ó ń bẹ̀rẹ̀ tàbí tí ó ń tẹ̀ síwájú hàn. ‘Bẹ̀rẹ̀ sí í ṣíji bò’ mú ìtumọ̀ inceptive yẹn jáde, ó sì pa àwòrán ìkùukùu tí ń bo wọ́n mọ́.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù sì bà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ọ̀wọ̀ láti sọ pé wọ́n bẹ̀rù tàbí pé ìbẹ̀rù dé bá wọn.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: bí wọ́n ti ń wọ
  rationale: Articular infinitive pẹ̀lú ἐν ń tọ́ka sí àkókò tí ìwọlé náà ń ṣẹlẹ̀. Arọ́pò-orúkọ ‘wọ́n’ pa àìdánilójú ẹni tí αὐτούς ń tọ́ka sí mọ́, láì fi orúkọ àwọn ènìyàn kan kún ẹsẹ náà.
- source_word: εἰς τὴν νεφέλην
  choice: inú ìkùukùu náà
  rationale: εἰς fi ìlọ sí inú ohun kan hàn, nítorí náà ‘wọ inú ìkùukùu náà’ dára ju sísọ pé wọ́n wà lábẹ́ rẹ̀ lọ.
theological_decisions:
- issue: Ìdánimọ̀ ìkùukùu àti ohun tí ó ń ṣe
  choice: Ṣàpèjúwe rẹ̀ gẹ́gẹ́ bí ìkùukùu tí ó farahàn tí ó sì bẹ̀rẹ̀ sí í ṣíji bo wọ́n, láì pe e ní ìfarahàn Ọlọ́run nínú ọ̀rọ̀ pàtàkì.
  alternative: Láti pè é ní ìkùukùu ògo tàbí àmì ìwàláàyè Ọlọ́run.
  rationale: Àyíká ẹsẹ náà lè mú kí òǹkàwé rántí àwọn ìṣẹ̀lẹ̀ inú Májẹ̀mú Láéláé níbi tí ìkùukùu ti bá ìfarahàn Ọlọ́run mu, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ìtumọ̀ yẹn ní tààrà. Ìtumọ̀ náà pa àwòrán àti ìdọ̀gbà ẹ̀kọ́ ìgbàgbọ́ mọ́ láì pinnu rẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì lo àwọn àṣàyàn àdánidá bí ‘ẹ̀rù bà wọ́n’ àti ‘àwọn ọ̀rọ̀ wọ̀nyí.’
