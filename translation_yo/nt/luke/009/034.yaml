revisions:
- from: Nígbà tí ó ṣì ń sọ àwọn ọ̀rọ̀ wọ̀nyí, ìkùukùu kan farahàn, ó sì bẹ̀rẹ̀ sí í ṣíji bò wọ́n[a]; ẹ̀rù sì bà wọ́n bí wọ́n ti ń wọ inú ìkùukùu náà.[b]
  to: Nígbà tí ó ń sọ àwọn ọ̀rọ̀ wọ̀nyí, ìkùukùu kan farahàn, ó sì ń bo wọ́n ní òjìji[a]; ẹ̀rù sì bà wọ́n bí wọ́n ṣe wọ inú ìkùukùu náà.[b]
  rationale: The revision replaces the non-idiomatic “ṣíji bò” and removes the explicit inceptive expansion “bẹ̀rẹ̀ sí í.” “Ń bo wọ́n ní òjìji” preserves the imperfect’s ongoing sense and the image of overshadowing. The temporal clause is adjusted to a natural Yoruba form without changing the referent or spatial movement.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the plural reference of ταῦτα, the contemporaneous force of the genitive absolute, the arrival/appearance of the cloud, the disciples’ fear, and their movement into the cloud. However, “bẹ̀rẹ̀ sí í ṣíji bò wọ́n” adds an unnecessarily explicit inceptive interpretation and uses an awkward expression for ἐπεσκίαζεν. The imperfect is better conveyed naturally as a continuing action.
  naturalness: “Ṣíji bò wọ́n” is not idiomatic Standard Yoruba in this context. “Ó sì ń bo wọ́n ní òjìji” naturally expresses the cloud’s overshadowing action. “Bí wọ́n ṣe wọ inú ìkùukùu náà” is a clear, natural rendering of the temporal infinitival clause.
  terminology: Ìkùukùu, ẹ̀rù bà wọ́n, and àwọn ọ̀rọ̀ wọ̀nyí are appropriate. The revision retains descriptive wording and does not identify the cloud doctrinally.
  issues:
  - severity: medium
    issue: The phrase “ó sì bẹ̀rẹ̀ sí í ṣíji bò wọ́n” is awkward and over-specifies the imperfect.
    rationale: ἐπεσκίαζεν denotes overshadowing in progress, but it need not mean explicitly “began to.” Moreover, “ṣíji bò” is not the most natural Standard Yoruba expression here.
  revised_text: Nígbà tí ó ń sọ àwọn ọ̀rọ̀ wọ̀nyí, ìkùukùu kan farahàn, ó sì ń bo wọ́n ní òjìji[a]; ẹ̀rù sì bà wọ́n bí wọ́n ṣe wọ inú ìkùukùu náà.[b]
  revised_footnotes:
