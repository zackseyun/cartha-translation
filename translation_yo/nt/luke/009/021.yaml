  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: yo
  text: Ṣùgbọ́n ó bá wọn wí gidigidi, ó sì pàṣẹ fún wọn pé kí wọn má ṣe sọ èyí fún ẹnikẹ́ni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n ó kìlọ̀ fún wọn gidigidi, ó sì pàṣẹ fún wọn pé kí wọn má ṣe sọ èyí fún ẹnikẹ́ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ìjẹ́wọ́ Pétérù ní ẹsẹ tó ṣáájú àti ìdáhùn Jésù.
- source_word: ἐπιτιμήσας
  choice: ó bá wọn wí gidigidi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí bíbániwí tàbí kíkìlọ̀ líle. Àfikún “gidigidi” mú agbára ọ̀rọ̀ Gíríìkì náà hàn ní Yorùbá àdánidá, láì sọ ọ́ di ẹ̀sùn pé àwọn ọmọ-ẹ̀yìn ti ṣẹ̀.
- source_word: παρήγγειλεν
  choice: ó pàṣẹ fún wọn
  rationale: Ó tọ́ka sí àṣẹ tí ẹni tó ní ọlá-àṣẹ fúnni, kì í ṣe ìmọ̀ràn lásán.
- source_word: μηδενὶ
  choice: fún ẹnikẹ́ni
  rationale: Pẹ̀lú “kí wọn má ṣe,” gbólóhùn yìí sọ ohun tí Gíríìkì túmọ̀ sí, ìyẹn pé wọn kò gbọdọ̀ sọ ọ́ fún ẹnikẹ́ni.
- source_word: λέγειν
  choice: sọ
  rationale: Nínú àkópọ̀ yìí, “sọ èyí fún ẹnikẹ́ni” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ fífi ọ̀rọ̀ kan tó ẹlòmíràn létí.
- source_word: τοῦτο
  choice: èyí
  rationale: Ó pa ìtọ́kasí Gíríìkì mọ́ sí ohun tí Pétérù ṣẹ̀ṣẹ̀ jẹ́wọ́, láì ṣàlàyé rẹ̀ ju bí ẹsẹ náà ṣe sọ lọ.
theological_decisions:
- issue: Agbára ìdènà Jésù lẹ́yìn ìjẹ́wọ́ Pétérù
  choice: Ìkìlọ̀ líle àti àṣẹ pé kí wọn má ṣe sọ ọ̀rọ̀ náà fún ẹnikẹ́ni ní àkókò yìí
  alternative: Ìkìlọ̀ pẹ̀lẹ́ pé kí wọn má mẹ́nu kàn án
  rationale: Àpapọ̀ ἐπιτιμήσας àti παρήγγειλεν fi hàn pé èyí ju ẹ̀bẹ̀ tàbí ìmọ̀ràn lásán lọ. Ìtumọ̀ náà pa ìfúnpá inú ìtàn mọ́ láì fi àlàyé ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Bá wọn wí gidigidi” pa líle ἐπιτιμάω mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì fi ìtumọ̀ míì, “kìlọ̀ ... gidigidi,” hàn.
