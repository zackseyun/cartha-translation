reference: Luke 9:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: yo
  text: Nígbà náà, àríyànjiyàn kan bẹ̀rẹ̀ láàárín wọn nípa ẹni wo nínú wọn tí ó lè tóbi jù lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrònú kan wọ inú wọn,” tàbí “ìjíròrò kan bẹ̀rẹ̀ láàárín wọn.”
    reason: Àwọn ìtumọ̀ míì tí ó ṣeé ṣe fún διαλογισμός ni ìrònú tàbí ìjíròrò, dípò àríyànjiyàn.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: bẹ̀rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà ni ‘wọlé,’ pẹ̀lú διαλογισμός ó ń tọ́ka sí ohun tí ó dìde tàbí bẹ̀rẹ̀ nínú ẹgbẹ́; ‘bẹ̀rẹ̀’ jẹ́ àdánidá ní Yorùbá.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn síwájú; ‘Nígbà náà’ bá ìṣàn ọ̀rọ̀ mu.
- source_word: διαλογισμὸς
  choice: àríyànjiyàn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí èrò inú, ìjíròrò, tàbí àríyànjiyàn. Nítorí pé wọ́n ń fi ipò ara wọn wé ara wọn, ‘àríyànjiyàn’ mú agbára ìdíje inú àyíká ọ̀rọ̀ náà jáde, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
- source_word: ἐν αὐτοῖς
  choice: láàárín wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ní tààràtà ó lè jẹ́ ‘nínú wọn,’ ‘láàárín wọn’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ohun tó ṣẹlẹ̀ nínú ẹgbẹ́ wọn.
- source_word: τὸ τίς ἂν εἴη
  choice: nípa ẹni tí ó lè jẹ́
  rationale: ‘Nípa’ ṣàfihàn kókó àríyànjiyàn, ‘lè jẹ́’ sì pa ìtumọ̀ àǹfààní tàbí àìdánilójú inú ἄν pẹ̀lú optative mọ́.
- source_word: μείζων
  choice: ẹni títóbi jù lọ
  rationale: Bó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ afiwéra ‘tóbi jù,’ nígbà tí a bá ń yan ẹnì kan nínú gbogbo ẹgbẹ́, Yorùbá ‘ẹni títóbi jù lọ’ mú ìtumọ̀ ipò gíga jù lọ náà jáde lọ́nà àdánidá.
- source_word: αὐτῶν
  choice: láàárín wọn
  rationale: Ó fi ẹgbẹ́ tí wọ́n ti ń ṣe ìfiwéra hàn; ‘láàárín wọn’ jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tó wà láàárín àwọn ọmọ-ẹ̀yìn
  choice: àríyànjiyàn
  alternative: èrò tàbí ìjíròrò
  rationale: Kò sí ẹ̀kọ́ ìgbàgbọ́ pàtàkì tí yíyan ọ̀rọ̀ yìí ń pinnu, ṣùgbọ́n ìbéèrè nípa ẹni tó tóbi jù fi ìdíje hàn. ‘Àríyànjiyàn’ bá àyíká náà mu láìpa àwọn ìtumọ̀ míì rẹ́; a ṣàkọsílẹ̀ wọn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàlágba, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì pa àìdánilójú ‘lè jẹ́’ àti ọ̀pọ̀ ìtumọ̀ διαλογισμός mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
