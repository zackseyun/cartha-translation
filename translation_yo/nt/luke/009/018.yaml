review_pass:
  verdict: revise
  source_fidelity: The draft conveys the temporal setting, Jesus’ prayer, the disciples’ presence, and the question accurately. However, “àwọn ogun ènìyàn” is not a natural or reliable rendering of οἱ ὄχλοι (‘the crowds’); it can be misunderstood and does not idiomatically designate a gathered multitude in this context.
  naturalness: “Ní òun nìkan” is awkward Standard Yoruba for ‘alone.’ “Ní àdádó” is a natural, concise equivalent. “Ọ̀pọ̀ ènìyàn” naturally conveys ‘the crowds/many people’ without importing an interpretation.
  terminology: “Àwọn ọmọ-ẹ̀yìn,” “gbàdúrà,” and “èmi” are appropriate. The revised wording preserves the source’s unresolved juxtaposition between solitary prayer and the disciples’ being with him.
  issues:
  - severity: medium
    issue: The expression “ní òun nìkan” is unnatural in this narrative use.
    rationale: It is a calqued or strained way to say ‘alone’ and should be replaced with the idiomatic “ní àdádó,” while retaining the Greek’s tension with the following clause.
  - severity: medium
    issue: “Àwọn ogun ènìyàn” does not naturally render οἱ ὄχλοι.
    rationale: The Greek refers to crowds or masses of people, not an ‘army’ or a phrase that may be read that way. “Ọ̀pọ̀ ènìyàn” is natural Yoruba and retains the reference to a crowd-like body of people.
  revised_text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń gbàdúrà ní àdádó, àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀. Ó sì bi wọ́n pé, “Ta ni ọ̀pọ̀ ènìyàn ń sọ pé èmi jẹ́?”
  revised_footnotes:
  - marker: a
    text: Tàbí, “ní ìkọ̀kọ̀.” Gbólóhùn Gíríìkì náà (κατὰ μόνας) lè tọ́ka sí wíwà ní ibi àdáni dípò pé kò sí ẹlòmíràn rárá níbẹ̀.
    reason: lexical_alternative
  revision_rationale: 'The revision replaces two non-idiomatic lexical choices with natural Standard Yoruba. It retains both clauses without harmonizing them: Jesus prays ‘ní àdádó,’ yet the disciples are ‘pẹ̀lú rẹ̀.’ The footnote preserves the viable alternative sense ‘in private.’'
