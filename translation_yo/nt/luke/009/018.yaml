id: LUK.9.18
reference: Luke 9:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti ń gbàdúrà ní àdádó, àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀. Ó sì bi wọ́n pé, “Ta ni ọ̀pọ̀ ènìyàn ń sọ pé èmi jẹ́?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà ìsọ̀rọ̀ ìtàn tí Lúùkù sábà máa ń lò; ‘Ó sì ṣẹlẹ̀ pé’ jẹ́ Yorùbá àdánidá tí ó tún pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí àmì ìtẹ̀síwájú ìtàn mọ́.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: bí ó ti ń gbàdúrà
  rationale: Èyí fi hàn pé ìgbà tí ó ń gbàdúrà ni ohun tí ó tẹ̀ lé ṣẹlẹ̀; ọ̀rọ̀ yìí jẹ́ mímọ́gbọ́n-dání ní Yorùbá.
- source_word: κατὰ μόνας
  choice: ní òun nìkan
  rationale: Gbólóhùn náà lè túmọ̀ sí pé ó wà ní òun nìkan tàbí ní ìkọ̀kọ̀. A yan ‘ní òun nìkan’ láti pa ìtumọ̀ pàtàkì mọ́, a sì fi àṣàyàn kejì sínú àlàyé ìsàlẹ̀.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀
  rationale: Èyí pa ìtumọ̀ ìbáṣepọ̀ rírọrùn ti Gíríìkì mọ́ láì sọ pé wọ́n ṣẹ̀ṣẹ̀ darapọ̀ mọ́ ọn tàbí pé wọ́n kàn wà nítòsí.
- source_word: ἐπηρώτησεν αὐτοὺς
  choice: Ó sì bi wọ́n pé
  rationale: ‘Bi wọ́n pé’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìbéèrè kan hàn.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Ta ni àwọn ogun ènìyàn ń sọ pé èmi jẹ́?
  rationale: Ètò yìí sọ ìbéèrè àìṣe-taara Gíríìkì di Yorùbá àdánidá, ó sì pa ‘àwọn ogun ènìyàn’ mọ́ fún οἱ ὄχλοι dípò ọ̀rọ̀ gbogbogbò bí ‘àwọn ènìyàn.’
theological_decisions:
- issue: Ìfarahàn ìtakora láàárín pé Jésù ń gbàdúrà ní òun nìkan àti pé àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀
  choice: 'A tú àwọn apá méjèèjì ní tààrà: ó ń gbàdúrà ní òun nìkan, àwọn ọmọ-ẹ̀yìn sì wà pẹ̀lú rẹ̀.'
  alternative: A lè tú κατὰ μόνας sí ‘ní ìkọ̀kọ̀’ tàbí ṣàlàyé pé àwọn ọmọ-ẹ̀yìn wà nítòsí rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìpẹ̀yà ìtumọ̀ yìí sílẹ̀. Ìtumọ̀ náà kò gbìyànjú láti mú un dọ́gba nípasẹ̀ àfikún ohun tí orísun kò sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì yé àwọn òǹkàwé lásán. A pa àmì ohùn mọ́ níbi tí ó bá yẹ, a sì yà gbolóhùn náà sí méjì fún ìṣàn ọ̀rọ̀ Yorùbá tó rọrùn láì pàdánù ìsopọ̀ ìtàn Gíríìkì.
