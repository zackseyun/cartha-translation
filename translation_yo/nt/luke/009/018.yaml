revisions:
- from: Ó sì ṣẹlẹ̀ pé bí ó ti ń gbàdúrà ní òun nìkan[a], àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀. Ó sì bi wọ́n pé, “Ta ni àwọn ogun ènìyàn ń sọ pé èmi jẹ́?”
  to: Ó sì ṣẹlẹ̀ pé, bí ó ti ń gbàdúrà ní àdádó, àwọn ọmọ-ẹ̀yìn wà pẹ̀lú rẹ̀. Ó sì bi wọ́n pé, “Ta ni ọ̀pọ̀ ènìyàn ń sọ pé èmi jẹ́?”
  rationale: 'The revision replaces two non-idiomatic lexical choices with natural Standard Yoruba. It retains both clauses without harmonizing them: Jesus prays ‘ní àdádó,’ yet the disciples are ‘pẹ̀lú rẹ̀.’ The footnote preserves the viable alternative sense ‘in private.’'
  reviewer_model: gpt-5.6-terra
