review_pass:
  verdict: revise
  source_fidelity: 'The core rendering follows the Greek well: Peter and his companions are heavily affected by sleep; after becoming fully awake they see Jesus’ glory and the two men standing with him. However, the first clause as written lacks the plural object required by the Yoruba idiom: “oorun ń wọ̀ lójú” does not clearly say that sleep was overcoming Peter and those with him. The perfect-state sense of βεβαρημένοι is also better conveyed with “ti wọ́n lójú.”'
  naturalness: “Nígbà tí ojú wọn já dáadáa” is natural and accurately communicates becoming fully alert. Adding “wọ́n” after “wọ” makes the opening idiom idiomatic and unambiguous. The plural resumptive pronoun in “tí wọ́n dúró” is more natural for the two men.
  terminology: “Ògo” appropriately renders δόξα in this context, and “àwọn ọkùnrin méjèèjì” accurately renders τοὺς δύο ἄνδρας. The footnote is accurate, preserves the lexical uncertainty of διαγρηγορήσαντες, and its anchor is correctly placed.
  issues:
  - severity: medium
    issue: The opening sleep idiom omits its plural object.
    rationale: In “Pétérù àti àwọn tí ó wà pẹ̀lú rẹ̀ ni oorun ń wọ̀ lójú gidigidi,” it is not explicit in Yoruba that sleep was affecting them. “Oorun ti wọ́n lójú gidigidi” clearly and naturally conveys that they were heavily sleepy/overcome by sleep.
  - severity: low
    issue: Plural relative clause for the two men can be made more idiomatic.
    rationale: “Àwọn ọkùnrin méjèèjì tí wọ́n dúró pẹ̀lú rẹ̀” uses the expected plural resumptive pronoun and retains the visual sense of συνεστῶτας.
  revised_text: Pétérù àti àwọn tí ó wà pẹ̀lú rẹ̀ ni oorun ti wọ́n lójú gidigidi; ṣùgbọ́n nígbà tí ojú wọn já dáadáa[a], wọ́n rí ògo rẹ̀ àti àwọn ọkùnrin méjèèjì tí wọ́n dúró pẹ̀lú rẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n jí,” tàbí “nígbà tí wọ́n jí pátápátá.” Ọ̀rọ̀-ìṣe Gíríìkì náà kò wọ́pọ̀; ó lè tẹnu mọ́ bí wọ́n ṣe jí, tí ojú wọn sì já dáadáa, dípò pé wọ́n dúró lójúfò ní gbogbo àkókò.
    reason: lexical_alternative
