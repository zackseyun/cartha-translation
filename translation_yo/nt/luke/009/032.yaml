revisions:
- from: Pétérù àti àwọn tí ó wà pẹ̀lú rẹ̀ ni oorun ń wọ̀ lójú gidigidi; ṣùgbọ́n nígbà tí ojú wọn já dáadáa[a], wọ́n rí ògo rẹ̀ àti àwọn ọkùnrin méjèèjì tí ó dúró pẹ̀lú rẹ̀.
  to: Pétérù àti àwọn tí ó wà pẹ̀lú rẹ̀ ni oorun ti wọ́n lójú gidigidi; ṣùgbọ́n nígbà tí ojú wọn já dáadáa[a], wọ́n rí ògo rẹ̀ àti àwọn ọkùnrin méjèèjì tí wọ́n dúró pẹ̀lú rẹ̀.
  rationale: The revision supplies the required plural object in the Yoruba sleep idiom and uses the perfect marker “ti” to reflect the Greek perfect participle’s resulting state. It also makes the relative clause referring to the two men explicitly plural. No theological interpretation or expansion has been added.
  reviewer_model: gpt-5.6-terra
