id: LUK.9.32
reference: Luke 9:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: yo
  text: Pétérù àti àwọn tí ó wà pẹ̀lú rẹ̀ ni oorun ti wọ́n lójú gidigidi; ṣùgbọ́n nígbà tí ojú wọn já dáadáa[a], wọ́n rí ògo rẹ̀ àti àwọn ọkùnrin méjèèjì tí wọ́n dúró pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n jí,” tàbí “nígbà tí wọ́n jí pátápátá.” Ọ̀rọ̀-ìṣe Gíríìkì náà kò wọ́pọ̀; ó lè tẹnu mọ́ bí wọ́n ṣe jí, tí ojú wọn sì já dáadáa, dípò pé wọ́n dúró lójúfò ní gbogbo àkókò.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: oorun ń wọ̀ wọ́n lójú gidigidi
  rationale: Ó fi agbára àkànlò èdè Gíríìkì hàn pé oorun di wọ́n mọ́lẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ìtumọ̀ líle bí ‘oorun di ẹrù lé wọn lórí’ lọ.
- source_word: διαγρηγορήσαντες
  choice: nígbà tí ojú wọn já dáadáa
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì tí kò wọ́pọ̀ yìí lè tọ́ka sí jíjí dé ipò ìmúrasílẹ̀ pípé; yíyan yìí bá ìyàtọ̀ sí bí oorun ti ń wọ̀ wọ́n lójú mu, láì sọ pé wọ́n kò sùn rárá.
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ ni ọ̀rọ̀ Yorùbá Bíbélì tí ó wọ́pọ̀ fún δόξα, ó sì pa ìtumọ̀ ìmọ́lẹ̀, ọlá, àti ìfarahàn ọ̀run nínú ìṣẹ̀lẹ̀ yìí mọ́.
- source_word: τοὺς δύο ἄνδρας
  choice: àwọn ọkùnrin méjèèjì
  rationale: Ó túmọ̀ ἀνήρ gẹ́gẹ́ bí ọkùnrin àgbà méjì, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn àti tó péye.
- source_word: συνεστῶτας αὐτῷ
  choice: tí ó dúró pẹ̀lú rẹ̀
  rationale: Ó pa àwòrán pé àwọn ọkùnrin náà dúró níbẹ̀ pẹ̀lú Jésù mọ́, dípò kí ó kàn sọ pé wọ́n wà pẹ̀lú rẹ̀.
- source_word: δὲ
  choice: ṣùgbọ́n (ní ibi kejì); kò ní ọ̀rọ̀ ọ̀tọ̀ ní ìbẹ̀rẹ̀
  rationale: δὲ àkọ́kọ́ ń tẹ ìtàn síwájú, èyí tí Yorùbá kò nílò láti túmọ̀ ní ọ̀rọ̀ ọ̀tọ̀; èkejì ń fi ìyàtọ̀ hàn láàárín oorun pípa wọ́n àti rírí ìran náà, nítorí náà ‘ṣùgbọ́n’ yẹ.
theological_decisions:
- issue: Ìtumọ̀ δόξα nínú ìṣẹ̀lẹ̀ ìyípadà àwòrán Jésù
  choice: ògo rẹ̀
  alternative: ìmọ́lẹ̀-ọlá rẹ̀; ọlá ńlá rẹ̀
  rationale: ‘Ògo’ pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú ìlò rẹ̀ jákèjádò Ìwé Mímọ́, láì ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
- issue: Bí a ṣe lóye διαγρηγορήσαντες
  choice: nígbà tí ojú wọn já dáadáa
  alternative: lẹ́yìn tí wọ́n jí; bí wọ́n ti dúró lójúfò
  rationale: Yíyan yìí fi hàn pé wọ́n dé ipò jíjí pípé lẹ́yìn oorun líle, ṣùgbọ́n ó pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀, láì fipá mú un túmọ̀ sí pé wọ́n dúró lójúfò ní gbogbo àkókò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. Àkànlò ‘oorun ń wọ̀ ... lójú gidigidi’ jẹ́ àdánidá fún òǹkàwé Yorùbá, nígbà tí ‘ojú wọn já dáadáa’ sọ ìmúrasílẹ̀ lẹ́yìn oorun ní kedere. Àmì ìsàlẹ̀ [a] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
