  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: yo
  text: Wọ́n sì dáhùn pé, “Jòhánù Onítẹ̀bọmi ni; àwọn mìíràn ní, Èlíjà ni; àwọn mìíràn sì ní pé, ọ̀kan lára àwọn wòlíì ìgbàanì ti dìde[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wòlíì kan láti ìgbà pípẹ́ sẹ́yìn ti dìde.” A lè lóye ọ̀rọ̀ Gíríìkì náà lọ́nà àdánidá yìí pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Wọ́n sì dáhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ participle àti finite verb yìí jẹ́ àṣà èdè Gíríìkì tí ipa èdè Semitic wà lára rẹ̀; “dáhùn pé” mú ìtumọ̀ rẹ̀ jáde ní Yorùbá àdánidá láìṣe àtúnwí tí kò pọndandan.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jòhánù Onítẹ̀bọmi
  rationale: “Jòhánù” ni àkọtọ̀ orúkọ tí ó wọ́pọ̀ ní Yorùbá, “Onítẹ̀bọmi” sì jẹ́ akọ́lé ìdánimọ̀ fún ẹni tí ń ṣe ìtẹ̀bọmi.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: àwọn mìíràn ní ... àwọn mìíràn sì ní
  rationale: Èyí pa ìṣètò àfiwé tí a tún ṣe nínú Gíríìkì mọ́, ó sì jẹ́ àkójọ tí ó ṣe kedere ní Yorùbá.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: Èyí ni ìrísí orúkọ wòlíì náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ὅτι
  choice: ní
  rationale: Nínú ọ̀rọ̀ tààrà yìí, “ní” ni Yorùbá àdánidá fún fífi ohun tí àwọn mìíràn sọ hàn.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ọ̀kan lára àwọn wòlíì ìgbàanì
  rationale: Ìtumọ̀ yìí mú àìdánimọ̀ τις àti ìbáṣepọ̀ genitive τῶν ἀρχαίων jáde ní Yorùbá tí ó ṣe kedere, láìsọ ẹni tí wòlíì náà jẹ́.
- source_word: ἀνέστη
  choice: ti jí dìde
  rationale: “Jí dìde” pa èrò dídìde mọ́, pẹ̀lú àfiyèsí rẹ̀ sí àjíǹde, ṣùgbọ́n kò fi kún ọ̀rọ̀ náà pé ó dájú pé àjíǹde òkú ni.
theological_decisions:
- issue: Bóyá ἀνέστη yẹ kí a túmọ̀ rẹ̀ ní ọ̀nà tí yóò sọ àjíǹde òkú ní pàtó
  choice: ti jí dìde
  alternative: ti dìde / ti tún padà wá
  rationale: “Ti jí dìde” pa ìfarahàn ìtumọ̀ àjíǹde mọ́, ṣùgbọ́n kò yanju ọ̀rọ̀ náà ju bí Gíríìkì ṣe sọ ọ́ lọ; “ti tún padà wá” yóò fi ìtumọ̀ tí kò hàn gbangba sínú rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ohùn wà níbi tí ó bá yẹ; ìtòlẹ́sẹẹsẹ àsọyé náà pa ìtẹ̀síwájú àwọn ìdáhùn mẹ́ta mọ́.
