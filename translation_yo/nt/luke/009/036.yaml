source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: yo
  text: Nígbà tí ohùn náà sì dún tán, a rí Jésù nìkan.[a] Wọ́n sì dákẹ́, wọn kò sì sọ ohunkóhun fún ẹnikẹ́ni ní àwọn ọjọ́ náà nípa ohun tí wọ́n ti rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù nìkan ló ṣẹ́ kù” tàbí “Jésù nìkan ni wọ́n rí.” Ní ti gangan, èdè Gíríìkì ní, “A rí Jésù nìkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Nígbà tí ohùn náà sì dún tán
  rationale: Ẹ̀ka ọ̀rọ̀ oníṣe-orúkọ pẹ̀lú ἐν fi àkókò hàn. ‘Ohùn náà dún tán’ jẹ́ Yorùbá àdánidá fún ìparí gbígbọ́ ohùn náà, láì sọ pé ohùn náà dé láti ibì kan.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: wọ́n rí i pé Jesu nìkan ni ó wà
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ náà mọ́ pé lẹ́yìn ohùn náà Jesu nìkan ni ó hàn níbẹ̀, ó sì jẹ́ àdánidá ju pípè é ní ‘a rí Jesu’ lọ ní Yorùbá. Àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan hàn.
- source_word: ἐσίγησαν
  choice: wọ́n dákẹ́
  rationale: ‘Wọ́n dákẹ́’ túmọ̀ sí pé wọn pa ohun tí wọ́n rí mọ́, ó sì bá ìtẹ̀síwájú gbolohun mu.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: wọn kò sì sọ ohunkóhun fún ẹnikẹ́ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere àti ti àdánidá láti sọ pé wọn kò ròyìn ohun náà fún ẹnikẹ́ni.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ náà
  rationale: Ìtumọ̀ tààrà fún gbólóhùn àkókò náà, tí kò fi àkókò pàtó míì kún un.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: ohunkóhun ... nípa ohun tí wọ́n ti rí
  rationale: Àkójọpọ̀ ‘ohunkóhun ... nípa ohun tí wọ́n ti rí’ pa agbára òdì àti ìbátan pẹ̀lú ohun tí wọn rí mọ́ ní Yorùbá tí ó mọ́gbọ́n dání.
theological_decisions:
- issue: Ìtumọ̀ ìtàn nípa pé Jesu nìkan ló wà lẹ́yìn ohùn ọ̀run
  choice: Ṣàpèjúwe rẹ̀ nìkan gẹ́gẹ́ bí ‘wọ́n rí i pé Jesu nìkan ni ó wà.’
  alternative: ‘Jesu nìkan ló ṣẹ́ kù’ tàbí ‘Jesu nìkan ni wọ́n rí.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ èsì ohun tí ó ṣẹlẹ̀ láì ṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ rẹ̀. Ìtumọ̀ yìí kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ohùn ... dún’ àti ‘wọ́n rí i pé ... ni ó wà’ fún Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ti εὑρέθη mọ́.
