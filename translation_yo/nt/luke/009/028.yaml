  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: yo
  text: Lẹ́yìn nǹkan bí ọjọ́ mẹ́jọ lẹ́yìn àwọn ọ̀rọ̀ wọ̀nyí[b][a], ó mú Peteru àti Johanu àti Jakọbu lọ pẹ̀lú rẹ̀, ó sì gòkè lọ sí òkè láti gbàdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn àwọn àsọyé wọ̀nyí.” Ọ̀rọ̀ Gíríìkì λόγους lè túmọ̀ sí “ọ̀rọ̀” tàbí “àsọyé” níbí.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nǹkan bí ọjọ́ mẹ́jọ”; ὡσεὶ fi hàn pé a sọ iye ọjọ́ náà ní ìsúnmọ́, kì í ṣe ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ìyípadà nínú ìtàn; ìṣàn gbólóhùn Yorùbá ti sọ ìbáṣepọ̀ náà di mímọ́ láìfi ọ̀rọ̀ àfikún bí ‘nígbà náà’ sí orísun.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: lẹ́yìn àwọn ọ̀rọ̀ wọ̀nyí
  rationale: λόγους tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ; ‘àwọn ọ̀rọ̀’ jẹ́ adayeba ní Yorùbá, ó sì pa ìtumọ̀ ‘words/sayings’ mọ́.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: ní nǹkan bí ọjọ́ mẹ́jọ
  rationale: ‘Nǹkan bí’ fi àfojúsùn tí ὡσεὶ ní hàn, kí iye ọjọ́ náà má bàa dà bí ohun tí a sọ ní pàtó.
- source_word: παραλαβὼν
  choice: ó mú ... lọ pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ yìí sọ pé Jesu mú àwọn mẹ́tẹ̀ẹ̀ta bá ara rẹ̀ lọ, ó sì jẹ́ adayeba ju ‘ó mú’ nìkan lọ ní Yorùbá.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Peteru àti Johanu àti Jakọbu
  rationale: A lo àwọn orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá, a sì pa àtúnṣe καί mọ́ láti tẹ̀lé ìlù ọ̀rọ̀ Gíríìkì.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ó sì gun orí òkè lọ
  rationale: ‘Gun ... lọ’ fi ìlọ sókè hàn; ‘orí òkè’ sọ ibi tí ó lọ sí ní Yorùbá adayeba láìjẹ́ kó dà bí ẹni pé a ti dárúkọ òkè náà tẹ́lẹ̀.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: ‘Láti’ sọ ète ìgòkè náà ní tààrà, gẹ́gẹ́ bí infinitive Gíríìkì.
theological_decisions:
- issue: Àfojúsùn àkókò ní ìbámu pẹ̀lú àwọn ìtàn tó jọra
  choice: ní nǹkan bí ọjọ́ mẹ́jọ
  alternative: ọjọ́ mẹ́jọ
  rationale: ὡσεὶ fi hàn pé iye náà jẹ́ àfojúsùn. A pa ìyàtọ̀ Luku mọ́, a kò sì mú un bá àwọn ìtàn Ihinrere mìíràn mu lọ́nà tí orísun kò gbà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A gbé àmì [b] lẹ́yìn gbólóhùn àkókò àti [a] lẹ́yìn ‘àwọn ọ̀rọ̀ wọ̀nyí’ kí ọkọọkan lè tọ́ka sí ohun tí àlàyé rẹ̀ ń ṣàlàyé.
