id: LUK.9.12
reference: Luke 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: yo
  text: Ọjọ́ náà bẹ̀rẹ̀ sí í rọ̀lẹ̀, Àwọn Méjìlá náà sì wá sọ́dọ̀ rẹ̀, wọ́n sì wí fún un pé, “Rán ogunlọ́gọ̀ náà lọ, kí wọ́n lè lọ sí àwọn abúlé àti ìgbèríko tó yí ibí ká, kí wọ́n rí ibi ìgbọ́sí, kí wọ́n sì rí oúnjẹ[a], nítorí a wà ní ibi ahoro[b] níbí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun ìpèsè oúnjẹ.” Ọ̀rọ̀ Gíríìkì ἐπισιτισμός lè túmọ̀ sí oúnjẹ tàbí ìpèsè oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ibi tí ènìyàn kò fi bẹ́ẹ̀ gbé.” Ọ̀rọ̀ Gíríìkì ἔρημος lè tọ́ka sí ibi tí kò sí olùgbé tàbí tí olùgbé rẹ̀ kò pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Ọjọ́ náà bẹ̀rẹ̀ sí í rọlẹ̀
  rationale: “Rọlẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọjọ́ ń lọ sí ìrọ̀lẹ́; ó pa ìṣípò àkókò àti díẹ̀ lára àwòrán κλίνειν mọ́.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: àwọn méjìlá náà sì tọ̀ ọ́ wá
  rationale: “Tọ̀ ọ́ wá” túmọ̀ sí pé wọ́n sún mọ́ Jesu, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀. “Àwọn méjìlá” pa orúkọ ẹgbẹ́ náà mọ́.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Rán ọ̀pọ̀ ènìyàn náà lọ
  rationale: Nínú àyíká yìí ἀπολύω túmọ̀ sí láti tú tàbí rán àwùjọ náà lọ; yíyan yìí ṣe kedere, ó sì bá Yorùbá mu.
- source_word: ἵνα πορευθέντες
  choice: kí wọ́n lè lọ
  rationale: Èyí fi ète ọ̀rọ̀ ἵνα àti ìṣe πορευθέντες hàn ní Yorùbá àdánidá láì sọ ọ́ di líle.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: sí àwọn abúlé àti ìgbèríko tó yí ibí ká
  rationale: “Àwọn abúlé” fún κώμας, “ìgbèríko” sì mú ìtumọ̀ agbègbè oko tàbí ilẹ̀ ìta ìlú nínú ἀγρούς; “tó yí ibí ká” pa κύκλῳ mọ́.
- source_word: καταλύσωσιν
  choice: kí wọ́n rí ibi gbé
  rationale: Níhìn-ín ọ̀rọ̀ náà ń tọ́ka sí wíwá ibi láti dúró tàbí sùn, kì í ṣe dídúró lásán.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: kí wọ́n sì rí oúnjẹ[a]
  rationale: ἐπισιτισμός jẹ́ oúnjẹ tàbí ohun ìpèsè fún jíjẹ; “rí oúnjẹ” jẹ́ ọ̀rọ̀ kedere fún òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó gbòòrò sí i hàn.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: nítorí ibi ahoro[b] ni a wà níbí
  rationale: “Ibi ahoro” fi agbègbè tí ènìyàn kò pọ̀ sí tàbí tí ohun àmúlò kò sí hàn, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un; “níbí” pa ὧδε mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìlànà ọ̀rọ̀ àdánidá, ọ̀wọ̀, àti èdè tó ṣeé yé fún òǹkàwé òde òní. A lo “rọlẹ̀” fún bí ọjọ́ ṣe ń lọ sí ìrọ̀lẹ́, a sì yà àwọn àlàyé ìtumọ̀ ἐπισιτισμός àti ἔρημος sí ìsàlẹ̀.
