id: LUK.9.48
reference: Luke 9:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹnikẹ́ni tí ó bá gba ọmọ yìí ní orúkọ mi[a], ó gba mí; ẹnikẹ́ni tí ó bá sì gba mí, ó gba ẹni tí ó rán mi. Nítorí ẹni tí ó kéré jù láàárín gbogbo yín—òun ni ó tóbi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gba” tún lè túmọ̀ sí “tẹ́wọ́ gba” ní gbogbo ibi tí ọ̀rọ̀ náà ti fara hàn nínú ẹsẹ yìí. Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbígba ẹni tàbí ṣíṣe àlejò rẹ̀. “Ní orúkọ mi” tún lè túmọ̀ sí “lórí ìpìlẹ̀ orúkọ mi” tàbí “nítorí orúkọ mi,” ìyẹn ni, gbígba ọmọ náà ní ìbáṣepọ̀ pẹ̀lú àṣẹ Jésù àti jíjẹ́ adúróṣinṣin sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: gba
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí gbígba, kíka ẹni sí, tàbí kíka ẹni káàbọ̀. “Gba” pa àsopọ̀ àtúnṣe ọ̀rọ̀ náà mọ́, ó sì lè gbé ìtumọ̀ gbígba ẹni àti ṣíṣe àlejò rẹ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
- source_word: παιδίον
  choice: ọmọ
  rationale: “Ọmọ” ni ìtumọ̀ Yorùbá tó ṣe kedere, láìfi dandan kún un pé ọmọ náà kéré gan-an.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Gbólóhùn yìí pa ìbáṣepọ̀ pẹ̀lú orúkọ, àṣẹ, àti aṣojú Jésù mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìdí kan ṣoṣo.
- source_word: τὸν ἀποστείλαντά με
  choice: ẹni tí ó rán mi
  rationale: Èyí tẹ̀lé participle oní-articular Gíríìkì ní ọ̀nà Yorùbá àdánidá, láìfi “Baba” tàbí “Ọlọ́run” kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: μικρότερος
  choice: ẹni tí ó kéré jù
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ipò ẹni tí a kà sí kékeré tàbí ẹni rírẹ̀lẹ̀ láàárín ẹgbẹ́, kì í ṣe ìwọ̀n ara tàbí ọjọ́-orí nìkan.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: láàárín gbogbo yín
  rationale: Èyí fi hàn pé a ń fi ipò ẹni náà wé ti gbogbo àwọn tó wà nínú ẹgbẹ́.
- source_word: οὗτός ἐστιν μέγας
  choice: òun ni ó tóbi
  rationale: “Òun ni” pa ìtẹnumọ́ demonstrative οὗτος mọ́, “ó tóbi” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìyípadà àròsọ nípa títóbi.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Ẹnikẹ́ni tí ó bá ... ẹnikẹ́ni tí ó bá sì
  rationale: Àkójọpọ̀ yìí sọ ipò gbogbogbò tí ó kan ẹnikẹ́ni, ó sì jẹ́ Yorùbá àdánidá.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Ó sì sọ fún wọn pé
  rationale: “Sì” ṣe aṣojú καί gẹ́gẹ́ bí àsopọ̀ ìtàn, láìfi ìtumọ̀ àkókò tuntun kún un.
theological_decisions:
- issue: Ẹni tí ó rán Jésù
  choice: A pa ìtọ́kasí náà mọ́ gẹ́gẹ́ bí “ẹni tí ó rán mi.”
  alternative: “Baba tí ó rán mi” tàbí “Ọlọ́run tí ó rán mi.”
  rationale: Gíríìkì kò dárúkọ Baba tàbí Ọlọ́run ní tààrà níbí; ìtumọ̀ náà pa ìbáṣepọ̀ iṣẹ́-ìránṣẹ́ Jésù mọ́ láìṣàfikún.
- issue: Gbígba ọmọ ní orúkọ Jésù
  choice: “Ní orúkọ mi” pa ìtumọ̀ gbígba ọmọ náà ní ìbáṣepọ̀ pẹ̀lú Jésù, àṣẹ rẹ̀, tàbí aṣojú rẹ̀ mọ́.
  alternative: “Nítorí orúkọ mi,” “nítorí tèmi,” tàbí “nítorí pé ọmọ náà jẹ́ ti tèmi.”
  rationale: Gbólóhùn orísun ní ìbú ìtumọ̀ tó ju inú-rere lásán lọ; a kò gbọdọ̀ dì í mọ́ ìtumọ̀ kan ṣoṣo.
- issue: Ìyàlẹ́nu nípa títóbi
  choice: Ẹni tí ó kéré jù láàárín wọn ni a pè ní ẹni tó tóbi.
  alternative: “Ẹni tí ó kéré jù ní ọjọ́-orí ni ó tóbi.”
  rationale: Àyíká náà dá lórí ipò àti ìrẹ̀lẹ̀ láàárín àwùjọ, kì í ṣe ọjọ́-orí nìkan; a pa ìyípadà iye tí Jésù sọ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “gba” léraléra láti pa ìsopọ̀ ọ̀rọ̀ orísun mọ́; “òun ni ó tóbi” sì pa ìtẹnumọ́ àti ìyàlẹ́nu ìparí mọ́.
