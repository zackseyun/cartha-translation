source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: yo
  text: Ó sì pe àwọn méjìlá náà jọ[a], ó fún wọn ní agbára àti àṣẹ lórí gbogbo ẹ̀mí èṣù àti láti wo àwọn àrùn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí ó ti pe àwọn méjìlá náà jọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: ó pe … jọ
  rationale: A tú àpólà aláìlópìn aorist middle náà sí ọ̀rọ̀-ìṣe tí ó bá Yorùbá mu, nígbà tí “jọ” pa ìtumọ̀ συν- mọ́. Àtẹ̀lé àwọn ọ̀rọ̀-ìṣe náà fi hàn pé pípè wọn jọ ṣáájú fífún wọn ní agbára àti àṣẹ.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ níbí; “sì” ń so ẹsẹ yìí mọ́ ohun tó ṣáájú láì sọ ọ́ di ìtakò.
- source_word: τοὺς δώδεκα
  choice: àwọn méjìlá náà
  rationale: Ó pa ọ̀rọ̀ Gíríìkì “àwọn méjìlá” mọ́ láì fi “ọmọ-ẹ̀yìn” tàbí “àpọ́sítélì” kún un.
- source_word: ἔδωκεν
  choice: ó fún wọn ní
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ pé ó fi ohun kan fún wọn.
- source_word: δύναμιν
  choice: agbára
  rationale: “Agbára” sọ ìlera tàbí agbára láti ṣe iṣẹ́ náà, ó sì yàtọ̀ sí àṣẹ.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: “Àṣẹ” ń tọ́ka sí ẹ̀tọ́ tàbí ọlá-àṣẹ tí a fi lé wọn lọ́wọ́, ní yíyàtọ̀ sí agbára.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: lórí gbogbo àwọn ẹ̀mí èṣù
  rationale: “Lórí” fi ìṣàkóso hàn; “gbogbo àwọn ẹ̀mí èṣù” sì jẹ́ ọ̀nà Yorùbá adayeba fún ọ̀rọ̀ ọ̀pọ̀ náà.
- source_word: νόσους θεραπεύειν
  choice: láti wo àwọn àrùn sàn
  rationale: “Wo … sàn” jẹ́ gbólóhùn Yorùbá adayeba fún ìwòsàn, “àwọn àrùn” sì dúró fún νόσους.
theological_decisions:
- issue: Ìyàtọ̀ láàárín δύναμις àti ἐξουσία
  choice: agbára àti àṣẹ
  alternative: agbára nìkan; tàbí àṣẹ àti ẹ̀tọ́
  rationale: A pa ọ̀rọ̀ méjèèjì mọ́ kí ìyàtọ̀ láàárín agbára láti ṣe ohun kan àti àṣẹ tí a fi léni lọ́wọ́ má bàa parẹ́.
- issue: Ẹni tí “àwọn méjìlá” ń tọ́ka sí
  choice: àwọn méjìlá náà
  alternative: àwọn ọmọ-ẹ̀yìn méjìlá; àwọn àpọ́sítélì méjìlá
  rationale: Gíríìkì kò fi “ọmọ-ẹ̀yìn” tàbí “àpọ́sítélì” sínú ẹsẹ yìí, nítorí náà a kò fi àlàyé tí kò sí nínú rẹ̀ kún un.
- issue: Bí àṣẹ/agára ṣe so mọ́ àwọn ẹ̀mí èṣù àti ìwòsàn
  choice: 'A fi ìṣọ̀kan Gíríìkì náà sílẹ̀: “lórí …, àti láti …”'
  alternative: ó fún wọn ní àṣẹ lórí àwọn ẹ̀mí èṣù, ó sì fún wọn ní agbára láti wo àrùn sàn
  rationale: Àtúnṣe mìíràn yóò pín “agbára” àti “àṣẹ” sí iṣẹ́ ọ̀tọ̀ọ̀tọ̀ tí Gíríìkì kò sọ ní kedere; a pa ìdíwọ̀n àti ìrọ̀rùn ìtumọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti ìgbàlódé, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lasán. A lo “ẹ̀mí èṣù” fún δαιμόνιον láti jẹ́ kó ṣe kedere ní Yorùbá, láì yí i padà sí “ẹ̀mí àìmọ́,” èyí tí kì í ṣe ọ̀rọ̀ inú ẹsẹ yìí.
