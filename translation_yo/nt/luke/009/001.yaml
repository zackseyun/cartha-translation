  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: pípe àwọn méjìlá jọ, agbára àti àṣẹ gẹ́gẹ́ bí ọ̀rọ̀ méjì ọ̀tọ̀ọ̀tọ̀, ìṣàkóso lórí gbogbo δαιμόνια, àti ìwòsàn àwọn νόσοι. Síbẹ̀, ìṣọ̀kan “àwọn ẹ̀mí èṣù, àti láti wo...” nínú àwòkọ́ṣe náà dùn bíi pé “àti láti” ń darapọ̀ mọ́ orúkọ “ẹ̀mí èṣù,” kì í ṣe mọ́ ohun tí a fún wọn ní agbára àti àṣẹ láti ṣe. Àtúnṣe kékeré kan mú ìbáṣepọ̀ náà hàn kedere.'
