  to: 'Bí wọ́n sì ti ń pínyà kúrò lọ́dọ̀ rẹ̀, Peteru sọ fún Jésù pé, “Olùdarí, ó dára kí a wà níbí. Ẹ jẹ́ kí a ṣe àgọ́ mẹ́ta[a]: ọ̀kan fún ọ, ọ̀kan fún Mósè, àti ọ̀kan fún Èlíjà.” Peteru kò mọ ohun tí ó ń sọ.'
  rationale: Àtúnṣe náà sọ Peteru di kókó-ọrọ̀ gangan nínú gbolohun ìkẹyìn, yí ìkíni náà sí “Olùdarí” fún ìforúkọsílẹ̀ ọ̀wọ̀ tó dára, ó sì yọ ìtumọ̀ ‘kékeré’ tí kò sí nínú Gíríìkì kúrò nínú àlàyé ìsàlẹ̀. Ìtumọ̀ àgọ́ àti ìfẹ̀yàrà àwòrán Àjọ Àgọ́ ni a pa mọ́ láìfi ìtumọ̀ kan lé e lórí.
