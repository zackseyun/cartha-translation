  source_fidelity: Ìtumọ̀ náà mú ọ̀nà ìṣẹ̀lẹ̀, ìyapa Mósè àti Èlíjà kúrò lọ́dọ̀ Jésù, àbá Peteru láti ṣe àgọ́ mẹ́ta, àti àìmọ̀ Peteru nígbà tó ń sọ̀rọ̀ hàn dáadáa. Síbẹ̀, gbolohun ìkẹyìn náà ní kókó-ọrọ̀ tí kò hàn gbangba; Gíríìkì náà sọ ní pàtó pé Peteru ni kò mọ ohun tí ó ń sọ. “Olùdarí” sì dáa ju “Ọ̀gá” lọ nínú ìforúkọsílẹ̀ ìjọ̀wọ̀ tí ó bójú mu fún Ἐπιστάτα nínú Yorùbá ìgbàlódé.
  naturalness: Ọ̀rọ̀ náà rọrùn láti ka, àwọn àmì ohùn sì péye ní gbogbogbòò. “Peteru kò mọ ohun tí ó ń sọ” jẹ́ ìtúmọ̀ kedere àti àdánidá ju “Kò mọ ohun tí ó ń sọ” lọ. “Olùdarí” yẹ fún ìkíni ọ̀wọ̀ nínú àyíká yìí, níbi tí “Ọ̀gá” ti lè dun bí ìpè iṣẹ́ ojoojúmọ́.
  terminology: '“Àgọ́” jẹ́ ìfẹ̀yàrà tó péye fún σκηνάς: ó pa ìtumọ̀ ibi ìsádi tàbí ibi ìgbé fún ìgbà díẹ̀ mọ́, láìfi ìdánimọ̀ Àjọ Àgọ́ lórí ẹsẹ náà. Àlàyé ìsàlẹ̀ yẹ kí ó má ṣàfikún ìtumọ̀ “kékeré,” nítorí Gíríìkì kò sọ ìwọ̀n àwọn àgọ́ náà.'
