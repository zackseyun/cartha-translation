id: LUK.9.33
reference: Luke 9:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: yo
  text: 'Bí wọ́n sì ti ń pínyà kúrò lọ́dọ̀ rẹ̀, Peteru sọ fún Jésù pé, “Olùdarí, ó dára kí a wà níbí. Ẹ jẹ́ kí a ṣe àgọ́ mẹ́ta[a]: ọ̀kan fún ọ, ọ̀kan fún Mósè, àti ọ̀kan fún Èlíjà.” Peteru kò mọ ohun tí ó ń sọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ibi ìsádi fún ìgbà díẹ̀” tàbí “àgọ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibi ìgbé fún ìgbà díẹ̀, ó sì lè mú àwòrán Àjọ Àgọ́ nínú Bíbélì wá sí ìrántí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Bí wọ́n sì ti ń pínyà kúrò lọ́dọ̀ rẹ̀
  rationale: Ó mú ìṣe tí ó ń lọ lọ́wọ́ àti ìyapa Mósè àti Èlíjà kúrò lọ́dọ̀ Jésù hàn, láìfi ọ̀rọ̀ ìtàn Gíríìkì náà ṣe àdàkọ líle.
- source_word: Ἐπιστάτα
  choice: Ọ̀gá
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkíni ọ̀wọ̀ fún ẹni tí ó ní àṣẹ. “Ọ̀gá” dá ìtumọ̀ yẹn dúró, kò sì sọ ọ́ di “Olùkọ́,” èyí tí ó sábà máa ń túmọ̀ διδάσκαλος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ó dára kí a wà níbí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdájọ́ Peteru pé wíwà wọn níbẹ̀ dára.
- source_word: ποιήσωμεν
  choice: Ẹ jẹ́ kí a ṣe
  rationale: Ó fi àbá ìṣírí ẹni-àkọ́kọ́ púpọ̀ hàn láìfikún ìtumọ̀ pàtó bí “kọ́” tí ποιέω kò béèrè fún.
- source_word: σκηνὰς
  choice: àgọ́
  rationale: “Àgọ́” lè tọ́ka sí ibi ìgbé tàbí ibi ààbò fún ìgbà díẹ̀, ó sì jẹ́ kí àwòrán àjọ Àgọ́ inú Bíbélì ṣeé gbọ́ láìfi tipátipá túmọ̀ ẹsẹ náà sí àjọ náà.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Kò mọ ohun tí ó ń sọ
  rationale: Ó pa àìmọ̀ Peteru mọ́ ní àkókò tí ó ń sọ̀rọ̀, láìyí i sí gbólóhùn pé kò lóye nìkan.
theological_decisions:
- issue: Bó ṣe yẹ kí a túmọ̀ σκηνάς ní ìṣẹ̀lẹ̀ ìyípadà ògo, níbi tí ó ti lè mú àjọ Àgọ́ wá sí ìrántí
  choice: àgọ́
  alternative: ibi ààbò fún ìgbà díẹ̀; àgọ́ ìjọsìn
  rationale: Ẹsẹ náà kò sọ ní tààrà pé Peteru ń tọ́ka sí àjọ Àgọ́ tàbí sí Àgọ́ Ìjọsìn. “Àgọ́” pa ìtumọ̀ ibi ìgbé fún ìgbà díẹ̀ àti àṣeéṣe ìró àwòrán Bíbélì mọ́ láìyan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. “Ọ̀gá” jẹ́ ìkíni ọ̀wọ̀ tí ó pa ìtumọ̀ àṣẹ ἐπιστάτης mọ́; “àgọ́” jẹ́ ọ̀rọ̀ tí ó ṣe kedere tí kò sì fi ìtumọ̀ ẹ̀sìn kan lé ẹsẹ náà lórí.
