  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: yo
  text: Ohùn kan sì wá láti inú ìkùukùu náà[a], ó ní, “Èyí ni Ọmọ mi, Ẹni tí a yàn náà; ẹ fetí sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “Ọmọ mi olùfẹ́,” dípò “Ọmọ mi, Ẹni tí a yàn náà.”
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Ohùn kan sì … wá
  rationale: Èyí sọ ìṣẹ̀lẹ̀ tí ohùn náà ṣẹlẹ̀ ní ọ̀nà àdánidá ní Yorùbá, láì tú ọ̀rọ̀ náà ní líle gẹ́gẹ́ bí ‘ohùn kan di wíwà.’
- source_word: ἐκ τῆς νεφέλης
  choice: ti inú ìkùukùu náà
  rationale: ἐκ tọ́ka sí ibi tí ohùn náà ti jáde; ‘ti inú ìkùukùu náà’ ṣe kedere pé ibẹ̀ ni ohùn náà ti wá.
- source_word: λέγουσα
  choice: ó ní
  rationale: Ní ìtàn Yorùbá, ‘ó ní’ jẹ́ ọ̀nà àdánidá láti ṣáájú ohun tí ohùn sọ.
- source_word: Οὗτός ἐστιν
  choice: Èyí ni
  rationale: Ó pa agbára ìdánimọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá àdánidá.
- source_word: ὁ υἱός μου
  choice: Ọmọ mi
  rationale: Ìtumọ̀ tààrà ni; lílo lẹ́tà ńlá fi hàn pé àkọlé Kristológì ni nínú àyíká ọ̀rọ̀, kì í ṣe pé ìtumọ̀ ọ̀rọ̀ náà yí padà.
- source_word: ὁ ἐκλελεγμένος
  choice: Ẹni Àyànfẹ́ náà
  rationale: Àpólà aláìṣe perfect náà túmọ̀ sí ẹni tí a ti yàn. ‘Ẹni Àyànfẹ́ náà’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání, ó sì yẹra fún fífi ‘mi’ kejì kún ibi tí kò ti sí nínú Gíríìkì.
- source_word: αὐτοῦ ἀκούετε
  choice: ẹ máa fetí sí i
  rationale: Àṣẹ present náà ní agbára ìgbọ́ràn àti fífetí sí ẹni náà lọ́wọ́lọ́wọ́; ‘ẹ máa fetí sí i’ pa ìtẹ̀síwájú àti agbára àṣẹ náà mọ́.
theological_decisions:
- issue: Orúkọ àpèjúwe Kristológì inú ohùn láti ọ̀run ní ìyàtọ̀ ẹ̀dà
  choice: ἐκλελεγμένος gẹ́gẹ́ bí ‘Ẹni Àyànfẹ́ náà’
  alternative: ἀγαπητός gẹ́gẹ́ bí ‘Ọmọ mi àyànfẹ́’ tàbí ‘Ọmọ mi olùfẹ́’
  rationale: A tẹ̀ lé SBLGNT tó ní ἐκλελεγμένος, a kò sì mú ọ̀rọ̀ Lúùkù bá àwọn ìtàn ìhìnrere mìíràn mu. A fi ẹ̀dà mìíràn sínú àlàyé ìsàlẹ̀, kí ìjẹ́ Ọmọ àti jíjẹ́ Àyànfẹ́ lè dúró papọ̀ bí Gíríìkì ṣe gbé wọn kalẹ̀.
translation_notes:
  register: Yorùbá à标准 tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó lọ́lá, tó sì yé òǹkàwé òde òní. ‘Ìkùukùu’ ni a lò fún νεφέλη; ‘ẹ máa fetí sí i’ jẹ́ àṣẹ ọ̀pọ̀ ènìyàn tó bá àwọn ọmọ-ẹ̀yìn mu.
