id: LUK.9.26
reference: Luke 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá tijú mi àti àwọn ọ̀rọ̀ mi, Ọmọ Ènìyàn yóò tijú ẹni náà nígbà tí ó bá dé nínú ògo tirẹ̀ àti ògo ti Baba àti ti àwọn áńgẹ́lì mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “nígbà tí ó bá dé nínú ògo tirẹ̀, àti nínú ògo ti Baba àti ti àwọn áńgẹ́lì mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Nítorí ẹnikẹ́ni tí ó bá
  rationale: “Nítorí” ń fi agbára àlàyé γάρ hàn, “ẹnikẹ́ni tí ó bá” sì ń mú ìtumọ̀ gbogbogbò ti ὃς ... ἄν jáde ní Yorùbá àdánidá.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: tí ó bá tijú ... yóò tijú
  rationale: Lílo “tijú” ní ibi méjèèjì pa ìbáramu àti ìdáhùnpadà tí ó wà nínú ọ̀rọ̀ Gíríìkì mọ́, láì mú un lágbára sí “kọ̀” tàbí “sẹ́” ẹni náà.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: mi àti àwọn ọ̀rọ̀ mi
  rationale: Èyí tẹ̀ lé àwọn ohun méjì tí ìṣe náà kàn, ó sì pa λόγους mọ́ gẹ́gẹ́ bí “àwọn ọ̀rọ̀,” dípò àlàyé tí ó túbọ̀ jìn sí i.
- source_word: τοῦτον
  choice: ẹni náà
  rationale: “Ẹni náà” tọ́ka padà sí “ẹnikẹ́ni” lọ́nà Yorùbá tí ó ṣe kedere, láì fi akọ tàbí abo kún ibi tí èdè Yorùbá kò ti fi hàn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà ní tààràtà, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àṣà ọ̀rọ̀ inú Ìwé Mímọ́.
- source_word: ὅταν ἔλθῃ
  choice: nígbà tí ó bá dé
  rationale: Ọ̀rọ̀ yìí ń fi ìṣẹ̀lẹ̀ ọjọ́ iwájú hàn ní ọ̀nà Yorùbá àdánidá; “dé” bá àwòrán bíbọ̀ síbi kan mu dáadáa.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: nínú ògo tirẹ̀ àti ògo ti Baba àti ti àwọn áńgẹ́lì mímọ́
  rationale: A tún “ògo” sọ lẹ́ẹ̀kan láti mú àkójọpọ̀ àwọn gbólóhùn ìní náà ṣe kedere ní Yorùbá, ṣùgbọ́n a kò yí ìbáṣepọ̀ ògo Ọmọ Ènìyàn, Baba, àti àwọn áńgẹ́lì padà.
- source_word: ἅγιοι ἄγγελοι
  choice: àwọn áńgẹ́lì mímọ́
  rationale: Ìtumọ̀ ajẹtífù tààràtà ni èyí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ní ọlá.
theological_decisions:
- issue: Ìkìlọ̀ gbogbogbò àti ọ̀rọ̀ arọ́pò tí ó tọ́ka padà sí ẹni náà
  choice: Ọmọ Ènìyàn yóò tijú ẹni náà
  alternative: Ọmọ Ènìyàn yóò tijú rẹ̀
  rationale: “Ẹni náà” jẹ́ kó ṣe kedere pé τοῦτον tọ́ka sí ẹnikẹ́ni tí ó tijú Jésù àti àwọn ọ̀rọ̀ rẹ̀. Yorùbá kò nílò fífi akọ tàbí abo tí èdè Gíríìkì lò gẹ́gẹ́ bí aṣojú gbogbogbò hàn.
- issue: Ògo tí ó ní í ṣe pẹ̀lú Ọmọ Ènìyàn, Baba, àti àwọn áńgẹ́lì mímọ́
  choice: nínú ògo tirẹ̀ àti ògo ti Baba àti ti àwọn áńgẹ́lì mímọ́
  alternative: nínú ògo tirẹ̀, àti nínú ògo ti Baba àti ti àwọn áńgẹ́lì mímọ́
  rationale: Àkọ́kọ́ pa ìṣọ̀kan èdè orísun mọ́, níbi tí ἐν ti fara hàn lẹ́ẹ̀kan ṣoṣo, ó sì jẹ́ kí ìbáṣepọ̀ ògo náà dúró láì ṣàlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó lógo, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “tijú” ní ìhà méjèèjì láti pa ìdáhùnpadà inú ẹsẹ náà mọ́.
