  source_fidelity: Ìtumọ̀ náà fi ìtumọ̀ gbogbogbò ti ὃς γὰρ ἂν hàn dáadáa pẹ̀lú “Nítorí ẹnikẹ́ni tí ó bá.” Ó pa ìbáramu ìṣe ἐπαισχυνθῇ/ἐπαισχυνθήσεται mọ́ nípa lílo “tijú” ní ìhà méjèèjì, ó sì tú τοῦτον sí “ẹni náà” ní kedere. “Ọmọ Ènìyàn” jẹ́ ìtumọ̀ oyè náà tó dáa. “Nígbà tí ó bá dé” jẹ́ ìtumọ̀ tí ó yẹ fún ọjọ́ iwájú ti ὅταν ἔλθῃ, bí ó tilẹ̀ jẹ́ pé “wá” tún lè ṣeé lò. Gbólóhùn ògo náà tẹ̀ lé ìṣètò Gíríìkì, láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìjọ kankan.
  naturalness: Yorùbá náà jẹ́ Yorùbá boṣewa tó rọrùn láti ka, pẹ̀lú àmì ohùn tó yẹ ní gbogbogbò. Ìforúkọ oyè àti ìforúkọ àwọn áńgẹ́lì mímọ́ ní ìwọ̀ntúnwọ̀nsì ìjọsìn tí ó yẹ fún ẹsẹ̀ náà, ṣùgbọ́n kò jẹ́ ti àtijọ́ tí kò ṣeé lóye.
  terminology: “Ọmọ Ènìyàn,” “Baba,” “ògo,” àti “àwọn áńgẹ́lì mímọ́” jẹ́ ọ̀rọ̀ tó yẹ, tó sì bá ìlò inú ìtumọ̀ Bíbélì Yorùbá mu. “Tijú” jẹ́ ìtumọ̀ tó sún mọ́ ἐπαισχύνομαι ju àwọn ọ̀rọ̀ tó túmọ̀ sí ìkọ̀sílẹ̀ ẹni tàbí ìkọ̀ rẹ̀ sílẹ̀ lọ.
