source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: yo
  text: 'Nígbà náà, wọ́n jáde, wọ́n sì ń rìn láàárín àwọn abúlé[a]. Ní ibi gbogbo, wọ́n ń kéde ìhìn rere[b], wọ́n sì ń mú ènìyàn láradá.


    [a] Tàbí, “wọ́n ń rìn láti abúlé kan sí òmíràn.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí wọ́n ṣe ń lọ láti abúlé dé abúlé.


    [b] Tàbí, “wọ́n ń wàásù ìhìn rere.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń rìn láti abúlé kan sí òmíràn.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí wọ́n ṣe ń lọ láti abúlé dé abúlé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń wàásù ìhìn rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: wọ́n jáde
  rationale: Ó fi hàn pé lẹ́yìn tí Jésù rán wọn, wọ́n kúrò níbi tí wọ́n wà, wọ́n sì bẹ̀rẹ̀ iṣẹ́ náà. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá, ó sì bá ìtẹ̀síwájú ìtàn mu.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín, δέ ń tẹ̀síwájú nínú ìtàn, ó sì so ohun tí àwọn ọmọ-ẹ̀yìn ṣe mọ́ àṣẹ tí Jésù ṣẹ̀ṣẹ̀ fún wọn.
- source_word: διήρχοντο
  choice: wọ́n ń rìn káàkiri
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka sí ìrìn-àjò tí ń bá a lọ láti ibì kan sí ibòmíràn; ‘ń rìn káàkiri’ sọ èyí ní Yorùbá àdánidá.
- source_word: κατὰ τὰς κώμας
  choice: àwọn abúlé
  rationale: κατά pẹ̀lú accusative níhìn-ín ní ìtumọ̀ aláàyè tàbí pínpín káàkiri, ìyẹn, ìrìn láàárín àwọn abúlé. Àkọlé ìsàlẹ̀ fi ‘láti abúlé kan sí òmíràn’ hàn gẹ́gẹ́ bí ọ̀nà míì tí a lè gbà túmọ̀ ọ́.
- source_word: εὐαγγελιζόμενοι
  choice: wọ́n ń kéde ìhìn rere
  rationale: Ó túmọ̀ sí pípolongo ìhìn rere. ‘Kéde ìhìn rere’ ṣe kedere ní Yorùbá òde òní láìfi èdè ẹ̀sìn amọ̀ṣẹ́ kan kún ọ̀rọ̀ náà.
- source_word: θεραπεύοντες
  choice: wọ́n sì ń mú àwọn ènìyàn láradá
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí wíwo àwọn aláìsàn sàn. Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ iṣẹ́ ìmúláradá.
- source_word: πανταχοῦ
  choice: níbi gbogbo
  rationale: Ó ń tẹnu mọ́ pé iṣẹ́ ìkéde àti ìmúláradá wọn dé ibi púpọ̀ káàkiri.
theological_decisions:
- issue: Ìtumọ̀ εὐαγγελιζόμενοι nínú iṣẹ́ tí a rán àwọn ọmọ-ẹ̀yìn sí
  choice: wọ́n ń kéde ìhìn rere
  alternative: wọ́n ń wàásù ìhìn rere
  rationale: Àṣàyàn yìí pa ìtumọ̀ pípolongo ìhìn rere mọ́, ṣùgbọ́n kò fi ìtumọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e tàbí èdè ìjọ kan pàtó lé ọ̀rọ̀ Gíríìkì náà lórí.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Ìlò ‘ń’ fi ìṣe tí ń bá a lọ nínú διήρχοντο àti àwọn participle méjèèjì hàn.
