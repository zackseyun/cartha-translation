id: LUK.9.24
reference: Luke 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ìyè rẹ̀ là yóò pàdánù rẹ̀[a]; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ìyè rẹ̀ nítorí mi, òun ni yóò gbà á là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí rẹ̀,” “ọkàn rẹ̀,” tàbí “ara ẹni”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìyè, ẹ̀mí, ọkàn, tàbí ara ẹni, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Nítorí ẹnikẹ́ni tí ó bá fẹ́
  rationale: “Ẹnikẹ́ni tí ó bá” fi ipò gbogbogbò tí ἄν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive hàn ní Yorùbá àdánidá; “Nítorí” sì pa ìsopọ̀ àlàyé γάρ mọ́.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ẹ̀mí ara rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ψυχή tọ́ka sí ìyè tàbí gbogbo ara ẹni tí ènìyàn lè gbìyànjú láti dáàbò bo. “Ẹ̀mí ara rẹ̀” bá àṣà ọ̀rọ̀ Yorùbá “gba ẹ̀mí là” mu, láìfi ìtumọ̀ rẹ̀ mọ́ ‘ọkàn’ aláìrí nìkan.
- source_word: σῶσαι / σώσει
  choice: gba … là / yóò gbà … là
  rationale: “Gba … là” jẹ́ ọ̀nà Yorùbá àdánidá fún pípa ẹ̀mí mọ́ tàbí gbígbà á là; lílo gbólóhùn kan náà ní ìbẹ̀rẹ̀ àti òpin pa ìfarawé àdììtú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: yóò pàdánù / bá pàdánù
  rationale: “Pàdánù” túmọ̀ sí ‘lose’ láìsọ pé ẹni náà mọ̀ọ́mọ̀ pa ara rẹ̀ run; ó sì pa ìyípadà àdììtú inú ọ̀rọ̀ náà mọ́.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: “Nítorí mi” lè fi ìdí tàbí ohun tí ó fa ìṣe náà hàn, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere nípa jíjẹ́ ọmọ-ẹ̀yìn Jesu.
- source_word: οὗτος
  choice: òun ni
  rationale: “Òun ni” mú ìtẹnumọ́ arọ́pò-orúkọ οὗτος jáde, ó sì yàn ẹni tí a ṣàpèjúwe náà ní pàtó.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ àdììtú Jesu
  choice: ẹ̀mí ara rẹ̀
  alternative: ìyè rẹ̀; ọkàn rẹ̀; gbogbo ara ẹni rẹ̀
  rationale: Àyíká ọ̀rọ̀ náà dá lórí kíkọ ara ẹni sílẹ̀ àti pípàdánù ìyè nítorí Jesu. Yíyan “ẹ̀mí ara rẹ̀” bá gbólóhùn Yorùbá mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa fífẹ̀ ìtumọ̀ ψυχή mọ́.
- issue: Ìtọ́kasí akọ tó dúró fún gbogbo ènìyàn
  choice: ẹnikẹ́ni … ara rẹ̀
  alternative: ọkùnrin yòówù … ẹ̀mí rẹ̀
  rationale: Yorùbá kò nílò fífi akọ tàbí abo hàn nínú gbólóhùn yìí. “Ẹnikẹ́ni” pa agbára gbogbogbò ti Gíríìkì mọ́, “ara rẹ̀” sì pa ẹyọ ọ̀rọ̀ náà mọ́ láìdín un sí ọkùnrin nìkan.
- issue: Ìtẹnumọ́ οὗτος
  choice: òun ni yóò gbà á là
  alternative: yóò gbà á là
  rationale: Gíríìkì fi οὗτος kun un láti tẹ ẹni yẹn gan-an mọ́lẹ̀. “Òun ni” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. Ìṣètò “ẹnikẹ́ni tí ó bá …” àti “òun ni …” jẹ́ ti Yorùbá àdánidá, wọ́n sì pa ipò gbogbogbò àti ìtẹnumọ́ orísun mọ́.
