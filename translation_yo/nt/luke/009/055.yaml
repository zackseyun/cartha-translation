lexical_decisions:
- source_word: στραφεὶς
  choice: ó yíjú
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe bí Jésù ṣe yí ara rẹ̀ sí àwọn ọmọ-ẹ̀yìn rẹ̀. “Ó yíjú” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe náà, ó sì pa ìtumọ̀ ọ̀rọ̀ ìṣe alábàápín Gíríìkì mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ fi ìyàtọ̀ díẹ̀ hàn láàárín ohun tí àwọn ọmọ-ẹ̀yìn béèrè ní ẹsẹ tó ṣáájú àti ìdáhùn Jésù. “Ṣùgbọ́n” bá ìbáṣepọ̀ yìí mu nínú ìtàn Yorùbá.
- source_word: ἐπετίμησεν
  choice: ó sì bá wọn wí
  rationale: ἐπιτιμάω túmọ̀ sí láti bá ẹnì kan wí tàbí láti fi ọ̀rọ̀ líle tọ́ ọ sọ́nà. “Bá wọn wí” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì fi àtúnṣe líle hàn láìṣe àfikún sí ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ yìí ń tọ́ka sí Jákọ́bù àti Jòhánù, tàbí àwọn ọmọ-ẹ̀yìn tí Jésù ń bá sọ̀rọ̀. Nínú gbólóhùn Yorùbá “bá wọn wí,” “wọn” ni ohun tí ìṣe náà kàn.
theological_decisions:
- issue: Àfikún ọ̀rọ̀ gígùn tó wà nínú àwọn ìwé àfọwọ́kọ tó wá lẹ́yìn náà
  choice: 'A túmọ̀ kìkì ọ̀rọ̀ SBLGNT nínú ẹsẹ náà: “Ṣùgbọ́n ó yíjú, ó sì bá wọn wí.”'
  alternative: “Ṣùgbọ́n ó yíjú, ó sì bá wọn wí, ó sì wí pé, ‘Ẹ̀yin kò mọ irú ẹ̀mí tí ẹ jẹ́ tirẹ̀; nítorí Ọmọ Ènìyàn kò wá láti pa ẹ̀mí àwọn ènìyàn run, bí kò ṣe láti gbà wọ́n là.’”
  rationale: Ọ̀rọ̀ orísun tí a pèsè ní kíkà kúkúrú nìkan. A kò fi àfikún tó wà nínú àwọn ìwé àfọwọ́kọ tó wá lẹ́yìn náà sínú ẹsẹ, ṣùgbọ́n a tọ́ka sí i ní àlàyé ìsàlẹ̀ nítorí pé ó ṣe pàtàkì, ó sì ti wọ́pọ̀ nínú ìtàn ìtumọ̀ Bíbélì.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. “Ó yíjú” àti “ó bá wọn wí” jẹ́ gbólóhùn àdánidá tí kò dín agbára ìbáwí Jésù kù.
