source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: yo
  text: Mo sì bẹ àwọn ọmọ-ẹ̀yìn rẹ pé kí wọ́n lé e jáde[a], ṣùgbọ́n wọn kò lè ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arọ́pò-orúkọ Gíríìkì náà lè tọ́ka sí ọmọkùnrin náà dípò ẹ̀mí náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: Mo sì bẹ
  rationale: Ọ̀rọ̀ náà ń fi ìbéèrè onítẹnumọ́ hàn, kì í ṣe bíbéèrè lásán; “bẹ” jẹ́ èdè Yorùbá àdánidá tó mú ìkánjú bàbá náà jáde.
- source_word: τῶν μαθητῶν σου
  choice: àwọn ọmọ-ẹ̀yìn rẹ
  rationale: “Ọmọ-ẹ̀yìn” pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa nínú àyíká Ìhìn Rere.
- source_word: ἵνα ἐκβάλωσιν
  choice: pé kí wọ́n lé e jáde
  rationale: Àkójọpọ̀ “pé kí” fi ète ìbéèrè náà hàn, “lé ... jáde” sì jẹ́ ọ̀nà Yorùbá àdánidá fún mímú ẹ̀mí búburú jáde.
- source_word: αὐτό
  choice: e
  rationale: Arọ́pò-orúkọ Yorùbá “e” kò fi akọ tàbí ohun aláìlẹ́mìí hàn, nítorí náà ó lè pa àìdánilójú nípa bóyá ẹ̀mí náà tàbí ọmọkùnrin náà ni a tọ́ka sí mọ́.
- source_word: οὐκ ἠδυνήθησαν
  choice: wọn kò lè ṣe bẹ́ẹ̀
  rationale: Èyí fi àìlágbára wọn hàn ní kedere, ó sì dára ní Yorùbá ju fífi ohun tí wọn kò lè ṣe tún sọ lọ.
theological_decisions:
- issue: Ohun tí αὐτό ń tọ́ka sí nínú àyíká ìlépa ẹ̀mí jáde
  choice: A lo “e,” èyí tó lè tọ́ka sí ẹ̀mí náà gẹ́gẹ́ bí àyíká ṣe mú un ṣeé ṣe jù.
  alternative: Ó tún lè tọ́ka sí ọmọkùnrin náà.
  rationale: Nínú àyíká ìlépa ẹ̀mí búburú jáde, ἐκβάλλω sábà máa ń gba ẹ̀mí náà gẹ́gẹ́ bí ohun tí a lé jáde; síbẹ̀, arọ́pò-orúkọ Yorùbá kò fi ìyàtọ̀ akọ tàbí abo hàn, nítorí náà a kò fi tipátipá parí àìdánilójú inú ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa ìkánjú ọ̀rọ̀ bàbá náà àti àìdánilójú arọ́pò-orúkọ mọ́.
