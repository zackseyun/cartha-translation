  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: yo
  text: 'Ó sì sọ fún ẹlòmíràn pé, “Tẹ̀lé mi.” Ṣùgbọ́n ó wí pé, “Olúwa, gbà mí láyè kí n kọ́kọ́ lọ, kí n sì sìnkú baba mi.”[a]


    [a] A tún lè túmọ̀ ọ́ sí, “Olúwa, jẹ́ kí n lọ kọ́kọ́ kí n sì sìnkú baba mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Olúwa, jẹ́ kí n lọ kọ́kọ́ kí n sì sìnkú baba mi.”
    reason: Àṣàyàn ìṣètò ọ̀rọ̀ fún ἐπίτρεψόν μοι ἀπελθόντι πρῶτον, tí ó pa ìbéèrè fún ìyọ̀ǹda àti pé ìlọ ṣáájú ìsìnkú mọ́.
lexical_decisions:
- source_word: ἕτερον
  choice: ẹlòmíràn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni mìíràn tí ó yàtọ̀ sí àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “ẹlòmíràn” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá láì fi àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: Àṣẹ ìsinsìnyí náà ń pe ẹni náà sí títẹ̀lé Jésù. “Máa tọ̀ mí lẹ́yìn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì lè ní ìtumọ̀ ti jíjẹ́ ọmọ-ẹ̀yìn láì fi ìtumọ̀ míì tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ ọ̀wọ̀ àti agbára orúkọ oyè κύριος mọ́ nígbà tí a fi ń bá Jésù sọ̀rọ̀; kò sọ ọ́ di ìkíni lasán.
- source_word: ἐπίτρεψόν μοι
  choice: gbà mí láyè
  rationale: Gbólóhùn yìí jẹ́ ìbéèrè fún àṣẹ tàbí ìyọ̀ǹda. “Gbà mí láyè” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì bá ọ̀wọ̀ inú ọ̀rọ̀ ẹni náà mu.
- source_word: ἀπελθόντι πρῶτον
  choice: kọ́kọ́ ... láti lọ
  rationale: 'Èyí pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́: ẹni náà ń béèrè láti lọ ṣáájú kí ó tó ṣe ìsìnkú. Àkọsílẹ̀ ìsàlẹ̀ fi ọ̀nà ìṣètò gbólóhùn mìíràn hàn.'
- source_word: θάψαι τὸν πατέρα μου
  choice: sìnkú baba mi
  rationale: “Sìnkú” sọ ìṣe ìsinkú jáde ní kedere, ó sì yẹra fún àìdánilójú tí “sin baba mi” lè ní ní Yorùbá òde òní.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí a ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìforígbárí tó wà láàárín ọ̀rọ̀ ọ̀wọ̀ àti orúkọ oyè tó lè ní ìtumọ̀ nípa ẹni tí Jésù jẹ́ mọ́. “Ọ̀gá” lè dín un kù sí ọ̀rọ̀ ọ̀wọ̀ láwùjọ nìkan.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí àwọn òǹkàwé òde òní lè lóye ni a lò. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tó yẹ. “Sìnkú” ni a yàn láti mú ìtumọ̀ ìsìnkú ṣe kedere, “Olúwa” sì pa ìwọ̀n ọ̀wọ̀ àti ìtumọ̀ ẹ̀kọ́ nípa Jésù mọ́.
