id: LUK.9.47
reference: Luke 9:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: yo
  text: Ṣùgbọ́n Jésù mọ ìrònú ọkàn wọn[a]; ó mú ọmọ kan, ó sì fi í dúró lẹ́gbẹ̀ẹ́ ara rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, èdè Gíríìkì ní “ìrònú ọkàn wọn,” níbi tí “ọkàn” ti jẹ́ ẹyọ ọ̀kan ṣùgbọ́n tí “wọn” ń tọ́ka sí ọ̀pọ̀ ènìyàn. A tún lè túmọ̀ rẹ̀ sí “ohun tí wọ́n ń rò nínú ọkàn wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “lẹ́gbẹ̀ẹ́ rẹ̀” tàbí “sí ẹ̀gbẹ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí mímọ̀ tàbí fífi ọkàn mọ ohun tí ó wà nínú ènìyàn; “mọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sọ ọ̀nà tí Jésù gbà mọ̀ ọ́.
- source_word: διαλογισμὸν
  choice: ìrònú
  rationale: “Ìrònú” mú ìtumọ̀ èrò inú àti ṣíṣe àgbéyẹ̀wò nínú ọkàn jáde, láì sọ ọ́ di ìjíròrò tí a sọ sóde.
- source_word: τῆς καρδίας αὐτῶν
  choice: ọkàn wọn
  rationale: Èdè Gíríìkì lo “ọkàn” ní ẹyọ ọ̀kan pẹ̀lú arọ́pò-orúkọ olówó púpọ̀. “Ọkàn wọn” bá ìṣètò yẹn mu, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐπιλαβόμενος
  choice: mú
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Jésù mú ọmọ náà. “Mú” ṣe àfihàn ìṣe gidi náà ní èdè Yorùbá tó rọrùn, láì fi agbára tàbí líle kún un.
- source_word: παιδίον
  choice: ọmọ kan
  rationale: “Ọmọ kan” jẹ́ ìtumọ̀ gbangba, àdánidá fún παιδίον, kò sì fi ọjọ́-orí pàtó tí orísun kò sọ kún un.
- source_word: ἔστησεν
  choice: fi í dúró
  rationale: Aoristi ìṣe-okùnfà yìí túmọ̀ sí “mú un dúró” tàbí “fi í sí ibì kan.” “Fi í dúró” pa àwòrán dídúró inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: παρ’ ἑαυτῷ
  choice: lẹ́gbẹ̀ẹ́ ara rẹ̀
  rationale: Gbólóhùn náà túmọ̀ sí pé ọmọ náà dúró nítòsí Jésù, lẹ́gbẹ̀ẹ́ rẹ̀. Fífi “ara rẹ̀” síbẹ̀ pa ìtumọ̀ arọ́pò-orúkọ ìpadà-sórí-olùṣe mọ́.
theological_decisions:
- issue: Bí Jésù ṣe mọ ìrònú inú wọn
  choice: Ẹsẹ náà sọ pé Jésù mọ ìrònú ọkàn wọn, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí ó gbà mọ̀ ọ́.
  alternative: Láti sọ ní pàtó pé agbára ìmọ̀ ohun gbogbo tó ju ti ẹ̀dá lọ ni, tàbí pé ó kàn fi òye ènìyàn kíyè sí wọn.
  rationale: Ìtumọ̀ náà pa ohun tí Lúùkù sọ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Arọ́pò-orúkọ “í” kò fi akọ tàbí abo kan ọmọ náà, èyí sì bá παιδίον mu. Semicolon náà jẹ́ kí ìtẹ̀síwájú ìṣe méjèèjì hàn kedere.
