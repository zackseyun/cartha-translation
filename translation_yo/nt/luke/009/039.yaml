revisions:
- from: Sì wò ó, ẹ̀mí kan[a] máa ń gbá a mú; lójijì ni ọmọ náà sì máa ń ké jáde. Ẹ̀mí náà a gbọ̀n ọn gidigidi, tí yóò fi yọ ìfófó lẹ́nu; kì í sì í tètè fi í sílẹ̀, ó ń pa á lára gidigidi.
  to: Kíyèsí i, ẹ̀mí kan[a] ń gbà á mú, lójijì ni ó sì ń ké jáde; ẹ̀mí náà ń mú un gbọ̀n pẹ̀lú ìfófó lẹ́nu, ó sì kì í fi ìrọ̀rùn kúrò lára rẹ̀, nígbà tí ó ń pa á lára gidigidi.
  rationale: The revision preserves the Greek’s lexical restraint concerning πνεῦμα and its forceful sequence of actions. It replaces unclear wording for the boy’s convulsions, uses a natural Yoruba attention marker, and avoids treating the Greek present forms as obligatorily habitual. The final participial action remains contemporaneous with the spirit’s departure.
  reviewer_model: gpt-5.6-terra
