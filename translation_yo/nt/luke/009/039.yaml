id: LUK.9.39
reference: Luke 9:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: yo
  text: Kíyèsí i, ẹ̀mí kan[a] ń gbà á mú, lójijì ni ó sì ń ké jáde; ẹ̀mí náà ń mú un gbọ̀n pẹ̀lú ìfófó lẹ́nu, ó sì kì í fi ìrọ̀rùn kúrò lára rẹ̀, nígbà tí ó ń pa á lára gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ẹ̀mí búburú kan” tàbí “ẹ̀mí èṣù kan”; Gíríìkì níbí sọ “ẹ̀mí kan” nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ọ̀rọ̀ yìí jẹ́ àmì àsọyé tí ó ń pe àfiyèsí sí ohun tí bàbá ọmọ náà ń ṣàpèjúwe. ‘Wò ó’ mú ìwàláàyè ọ̀rọ̀ náà jáde ní Yorùbá òde òní láì lo ọ̀rọ̀ àtijọ́.
- source_word: πνεῦμα
  choice: ẹ̀mí kan
  rationale: Gíríìkì sọ ‘ẹ̀mí’ nìkan níbí, kò fi àpèjúwe bí ‘àìmọ́’ tàbí ọ̀rọ̀ pàtó fún ‘ẹ̀mí èṣù’ kún un. Àyíká fi hàn pé ẹ̀mí ọ̀tá ni, ṣùgbọ́n a pa àìṣe-pàtó inú ẹsẹ yìí mọ́.
- source_word: λαμβάνει
  choice: máa ń gbá a mú
  rationale: Ní àyíká ìkọlù ẹ̀mí, ‘gbá a mú’ sọ agbára àti ìṣàkóso òjijì jáde ju ‘mú un’ lásán lọ. ‘Máa ń’ tún fi ìṣe tí ó ń ṣẹlẹ̀ léraléra nínú àpèjúwe bàbá náà hàn.
- source_word: ἐξαίφνης
  choice: lójijì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìṣẹ̀lẹ̀ tí ó bẹ̀rẹ̀ láìròtẹ́lẹ̀.
- source_word: κράζει
  choice: ọmọ náà sì máa ń ké jáde
  rationale: Ọmọ náà ni kókó-ọrọ̀ tí a lóye fún ọ̀rọ̀-ìṣe Gíríìkì náà. A dárúkọ ‘ọmọ náà’ láti mú ẹni tó ń ké ṣe kedere, láì sọ ní ìtumọ̀ pé ẹ̀mí náà ‘mú un ké.’
- source_word: σπαράσσει αὐτόν
  choice: Ẹ̀mí náà a gbọ̀n ọn gidigidi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gbígbọ̀n ara líle tàbí wárìrì. Ìtumọ̀ yìí ṣe àpèjúwe ipa rẹ̀ lórí ara ní Yorùbá tó ṣe kedere, láì fi ìpalára kan pàtó kún un.
- source_word: μετὰ ἀφροῦ
  choice: tí yóò fi yọ ìfófó lẹ́nu
  rationale: Gbólóhùn yìí sọ pé ìfófó ẹnu bá gbígbọ̀n ara náà rìn. Ìtumọ̀ yìí jẹ́ adayeba ju lílo ‘pẹ̀lú ìfófó’ lọ ní Yorùbá.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: kì í tètè fi í sílẹ̀
  rationale: Èyí mú èrò pé ẹ̀mí náà kì í yára tàbí kì í fi ìrọ̀rùn kúrò lára rẹ̀ jáde. Ó tún bá ìṣe tí bàbá náà ń sọ pé ó máa ń ṣẹlẹ̀ mu.
- source_word: συντρῖβον αὐτόν
  choice: ó ń pa á lára gidigidi
  rationale: Ọ̀rọ̀ Gíríìkì náà fi ìpalára tó le koko hàn nígbà tí ẹ̀mí náà bá ń kúrò. ‘Pa á lára gidigidi’ pa líle ìṣe náà mọ́ láì sọ irú ọgbẹ́ ara kan tí ẹsẹ náà kò dárúkọ.
theological_decisions:
- issue: Bóyá kí a pe πνεῦμα ní ẹ̀mí èṣù ní pàtó nínú ọ̀rọ̀ àkọ́kọ́
  choice: ẹ̀mí kan
  alternative: ẹ̀mí búburú kan; ẹ̀mí èṣù kan
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ìtàn náà fi hàn pé ẹ̀mí ọ̀tá ni, ẹsẹ yìí fúnra rẹ̀ lo πνεῦμα láìsí àpèjúwe míì. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ọ́ di pàtó ju orísun Gíríìkì lọ.
translation_notes:
  register: A lo Yorùbá Àfẹnukò tó bójú mu, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ adayeba. Àwọn fọ́ọ̀mù ‘máa ń’ àti ‘a’ fi hàn pé bàbá náà ń ṣàpèjúwe ìṣẹ̀lẹ̀ tí ó sábà máa ń ṣẹlẹ̀, ní ìbámu pẹ̀lú àwọn ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí inú Gíríìkì.
