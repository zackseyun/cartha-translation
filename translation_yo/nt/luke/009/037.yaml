  register: Èdè Yorùbá boṣewa, ti òde òní, tó níyì, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. A pa ìṣàn ìtàn mọ́ láìlo àsopọ̀ atọwọ́dọwọ́ tí orísun kò béèrè.
