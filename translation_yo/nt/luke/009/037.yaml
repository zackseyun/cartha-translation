  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: yo
  text: Ní ọjọ́ kejì[a], nígbà tí wọ́n sọ̀kalẹ̀ láti orí òkè náà, ọ̀pọ̀ ènìyàn pàdé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ní ọjọ́ tí ó tẹ̀ lé e.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Gbólóhùn yìí ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn ní Gíríìkì. Bíbẹ̀rẹ̀ pẹ̀lú “Ní ọjọ́ kejì” jẹ́ àdánidá ní Yorùbá, kò sì fi ọ̀rọ̀ àsìkò kan tí kò sí nínú orísun kún un.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Ní ọjọ́ kejì
  rationale: Èyí fi ọjọ́ tí ó tẹ̀ lé e hàn ní kedere, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn láti lóye.
- source_word: κατελθόντων αὐτῶν
  choice: nígbà tí wọ́n sọ̀kalẹ̀
  rationale: Àpólà aláìlórúkọ yìí pèsè ipò tó yí ìṣe pàtàkì ká. “Nígbà tí” pa ìbáṣepọ̀ àsìkò mọ́ láìfipá pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀπὸ τοῦ ὄρους
  choice: láti orí òkè náà
  rationale: “Òkè” ni ìtumọ̀ Yorùbá tó yẹ fún ὄρος ní àyíká yìí; àmì ìtọ́kasí náà bá òkè tí ìtàn ti mẹ́nu kàn mu.
- source_word: συνήντησεν αὐτῷ
  choice: pàdé rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ pé ogunlọ́gọ̀ náà bá a pàdé, láìfi èrò pé wọ́n mọ̀ọ́mọ̀ jáde lọ pàdé rẹ̀ kún un.
- source_word: ὄχλος πολύς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá fún ogunlọ́gọ̀ ńlá, ó sì mú ìtẹnumọ́ πολύς jáde ní kedere.
