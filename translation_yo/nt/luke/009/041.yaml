id: LUK.9.41
reference: Luke 9:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dáhùn pé, “Ìran aláìgbàgbọ́, tí ó sì ti yí kúrò ní ọ̀nà, títí di ìgbà wo ni èmi yóò fi wà pẹ̀lú yín, tí èmi yóò sì faradà yín? Mú ọmọ rẹ wá síbí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: ìran
  rationale: Ó túmọ̀ sí àwọn ènìyàn ìgbà tàbí àkókò kan; ‘ìran’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé pẹ̀lú rẹ̀.
- source_word: ἄπιστος
  choice: aláìgbàgbọ́
  rationale: Ó pa ìtumọ̀ àìní ìgbàgbọ́ tàbí àìgbọ́kànlé inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διεστραμμένη
  choice: oníwà híhà
  rationale: Ọ̀rọ̀ náà ní èrò ohun tí a ti yí tàbí há kúrò ní ọ̀nà tó tọ́; nípa ìran ènìyàn, ‘oníwà híhà’ jẹ́ àdánidá, ó sì pa àwòrán yẹn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
- source_word: ἀνέξομαι ὑμῶν
  choice: èmi yóò máa fara dà yín
  rationale: ‘Fara da’ sọ ìfaradà ẹni sí ìwà tàbí ipò àwọn ẹlòmíràn ní Yorùbá àdánidá.
- source_word: προσάγαγε ὧδε
  choice: mú ... wá síbí
  rationale: Ó ṣàfihàn àṣẹ taara láti mú ọmọ náà tọ Jésù wá.
theological_decisions:
- issue: Àwọn tí Jésù ń pè ní ‘ìran aláìgbàgbọ́ àti oníwà híhà’
  choice: A kò sọ ní pàtó ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ju bí orísun ṣe sọ lọ.
  alternative: Láti fi ‘ẹ̀yin ọmọ-ẹ̀yìn’ tàbí ‘ẹ̀yin ènìyàn’ kún un.
  rationale: Ọ̀rọ̀ Gíríìkì fi ẹni tí a bá wí sílẹ̀ ní ìwọ̀n àìdánilójú; fífi ẹgbẹ́ kan sí i yóò tú ìṣòro náà láìní ẹ̀rí nínú ẹsẹ yìí.
- issue: Ìtumọ̀ διεστραμμένη
  choice: oníwà híhà
  alternative: oníwà búburú / aláyídá
  rationale: Yíyan yìí pa àwòrán ohun tí ó há tàbí yí kúrò ní ọ̀nà tó tọ́ mọ́, láìdín rẹ̀ kù sí ìwà búburú lásán.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó ní iyì, tó sì yé òǹkàwé òde òní. A lo ‘yín’ nítorí àwọn ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀; ‘rẹ’ nínú àṣẹ ìkẹyìn jẹ́ ẹyọ kan. Àmì ohùn ni a fi sí gbogbo ibi tó bá yẹ.
