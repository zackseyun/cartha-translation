  naturalness: ‘Yóò ti pẹ́ tó tí...’ kò jẹ́ ọ̀nà Yorùbá tó rọrùn fún ìbéèrè àkókò ní ibi yìí. ‘Títí di ìgbà wo ni èmi yóò fi...?’ jẹ́ àdánidá. ‘Faradà yín’ sì jẹ́ ọ̀rọ̀ kan tó péye ju ‘máa fara dà yín’ lọ nínú ìtumọ̀ ‘bear with you.’
