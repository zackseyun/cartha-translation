  to: Ṣùgbọ́n Jésù dáhùn pé, “Ìran aláìgbàgbọ́, tí ó sì ti yí kúrò ní ọ̀nà, títí di ìgbà wo ni èmi yóò fi wà pẹ̀lú yín, tí èmi yóò sì faradà yín? Mú ọmọ rẹ wá síbí.”
