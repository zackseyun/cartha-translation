source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ṣùgbọ́n ẹ̀yin ńkọ́, ta ni ẹ̀yin sọ pé èmi jẹ́?” Pétérù dáhùn pé, “Mèsáyà Ọlọ́run ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi Ọlọ́run ni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ẹ̀yin ńkọ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn kedere, ó sì ní ìtẹnumọ́ àti ìyàtọ̀ sí ohun tí àwọn ẹlòmíràn sọ; ‘ẹ̀yin ńkọ́’ fi ìyàtọ̀ yìí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τίνα με λέγετε εἶναι
  choice: ta ni ẹ̀yin sọ pé èmi jẹ́
  rationale: Èyí tú ìbéèrè àti ọ̀rọ̀ àìṣe-pàṣẹ λέγετε + εἶναι jáde ní Yorùbá tó ṣe kedere, láìyí ìtumọ̀ rẹ̀ padà.
- source_word: ἀποκριθεὶς εἶπεν
  choice: dáhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe alábápín àti ọ̀rọ̀-ìṣe pàtàkì náà jẹ́ ọ̀nà Gíríìkì láti sọ pé ẹni náà dáhùn; ‘dáhùn pé’ ni Yorùbá àdánidá.
- source_word: χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, kì í ṣe orúkọ ara ẹni; ‘Mèsáyà’ pa ipa oyè náà mọ́ nínú àyíká ìjẹ́wọ́ Pétérù.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ oníjẹnítífù náà ni a pa mọ́ nínú gbólóhùn ‘Mèsáyà Ọlọ́run,’ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: δέ
  choice: sì / ṣùgbọ́n
  rationale: δέ àkọ́kọ́ ń so ìtàn náà pọ̀, nítorí náà ‘sì’ bójú mu; èkejì ń fi àwọn ọmọ-ẹ̀yìn wé àwọn ẹlòmíràn, nítorí náà ‘ṣùgbọ́n’ àti ‘ńkọ́’ mú ìyàtọ̀ náà hàn.
theological_decisions:
- issue: Bí a ṣe tú χριστός nínú ìjẹ́wọ́ Pétérù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ṣiṣẹ́ gẹ́gẹ́ bí oyè fún ẹni àmì-òróró tí Ọlọ́run yàn. ‘Mèsáyà’ jẹ́ kí oyè náà ṣe kedere, nígbà tí àṣàyàn ìbílẹ̀ ‘Kristi’ wà nínú àlàyé ìsàlẹ̀ láìfipá yan ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ̀yin ńkọ́’ mú ìtẹnumọ́ Ὑμεῖς àti ìyàtọ̀ δέ jáde lọ́nà tí àwọn òǹkàwé Yorùbá lè lóye nírọ̀rùn; ‘ni ọ́’ sì jẹ́ kí ìdáhùn kúkúrú náà péye ní Yorùbá.
