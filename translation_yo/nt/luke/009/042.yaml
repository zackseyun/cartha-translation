- from: 'Ṣùgbọ́n bí ó ti ń sún mọ́ ọn, ẹ̀mí èṣù náà gbé e ṣánlẹ̀, ó sì mú un gbọ̀n jìnnìjìnnì. Ṣùgbọ́n Jésù bá ẹ̀mí àìmọ́ náà wí, ó wo ọmọkùnrin náà sàn, ó sì dá a padà fún baba rẹ̀.[a]


