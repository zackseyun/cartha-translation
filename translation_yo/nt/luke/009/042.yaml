review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì lápapọ̀: ó pa ìṣe ìsúnmọ́, ìju ọmọ náà lulẹ̀, ìgbọn ara, ìbáwí Jésù sí ẹ̀mí àìmọ́, ìwòsàn ọmọ náà, àti ìpadà rẹ̀ sí baba rẹ̀ mọ́. Síbẹ̀, “bí ó ti ń” kò sọ ἔτι (“ṣì”) ní kedere, nítorí náà a fi “ṣì” kún un. Àkọsílẹ̀-ẹsẹ̀ náà tún yẹ kí ó fúnni ní àṣàyàn tó bá ἀπέδωκεν mu ní tààràtà.'
  naturalness: “Ṣì ń sún mọ́ ọn” jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún ‘was still coming near.’ “Mú un gbọ̀n jìnnìjìnnì” dára fún ìgbọ̀n/ìfọ̀rọ̀wọ́ ara líle. Àtúnṣe àkọsílẹ̀-ẹsẹ̀ náà sì kúrò nínú ìsọ tí ó lè dà bí fífi ọmọ náà sí abójútó baba rẹ̀, dípò ìdápadà rẹ̀.
  terminology: “Ẹ̀mí èṣù” fún δαιμόνιον àti “ẹ̀mí àìmọ́” fún πνεῦμα ἀκάθαρτον jẹ́ ọ̀rọ̀ tó pé, tí ó sì pa ìyàtọ̀ kékeré nínú ọ̀rọ̀ orísun mọ́. “Bá ... wí,” “wo ... sàn,” àti “dá ... padà fún” yẹ fún ìforúkọsílẹ̀ ìtàn náà.
  issues:
  - severity: medium
    issue: A kò fi ‘ṣì’ hàn nínú gbolohun àkọ́kọ́.
    rationale: ἔτι ń fi hàn pé ọmọ náà ṣì wà nínú ìṣe ìsúnmọ́ nígbà tí ẹ̀mí èṣù náà ṣe é ní ìpalára. “Bí ó ti ń” nìkan sọ ìṣe tó ń lọ, ṣùgbọ́n kì í sọ ‘still’ ní kedere.
  - severity: low
    issue: Àkọsílẹ̀-ẹsẹ̀ [a] kò ṣe àfihàn àṣàyàn ‘returned him to his father’ ní tààràtà.
    rationale: “Ó fi í lé baba rẹ̀ lọ́wọ́ padà” lè túmọ̀ sí fífi ẹni kan sí ìtọ́jú baba rẹ̀. “Ó dá a padà sí baba rẹ̀” pa ìtumọ̀ ἀπέδωκεν—ìpadà tàbí ìmúpadàbọ̀—mọ́ dáadáa.
