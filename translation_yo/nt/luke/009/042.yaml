id: LUK.9.42
reference: Luke 9:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: yo
  text: 'Ṣùgbọ́n bí ó ṣì ń sún mọ́ ọn, ẹ̀mí èṣù náà gbé e ṣánlẹ̀, ó sì mú un gbọ̀n jìnnìjìnnì. Ṣùgbọ́n Jésù bá ẹ̀mí àìmọ́ náà wí, ó wo ọmọkùnrin náà sàn, ó sì dá a padà fún baba rẹ̀.[a]


    [a] Tàbí, “ó dá a padà sí baba rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dá a padà sí baba rẹ̀.”
    reason: Àṣàyàn ọ̀rọ̀ míì fún ἀπέδωκεν; ó ṣàfihàn ìtumọ̀ ‘padà/ṣe ìmúpadàbọ̀ sí baba rẹ̀’ ní tààràtà.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Ṣùgbọ́n bí ó ti ń
  rationale: “Bí ó ti ń” fi hàn pé ìṣe náà ṣì ń lọ lọ́wọ́, “ṣùgbọ́n” sì jẹ́ ìyípadà kékeré nínú ìtàn gẹ́gẹ́ bí δέ.
- source_word: προσερχομένου αὐτοῦ
  choice: ó ti ń sún mọ́ ọn
  rationale: Ó pa ìṣe tí ó ń ṣẹlẹ̀ ní àkókò kan náà mọ́, ó sì fi ìlọsíwájú sí ọ̀dọ̀ Jésù hàn láìsọ ohun tí Gíríìkì kò sọ.
- source_word: ἔρρηξεν αὐτὸν
  choice: gbé e ṣánlẹ̀
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ẹ̀mí èṣù ṣe fi agbára ju ọmọ náà lulẹ̀; gbólóhùn Yòrùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: τὸ δαιμόνιον
  choice: ẹ̀mí èṣù náà
  rationale: Èyí túmọ̀ aṣojú ẹ̀mí búburú ẹni-láàyè ní tààràtà, ó sì yà díẹ̀ sí “ẹ̀mí àìmọ́” tí ó tẹ̀ lé e.
- source_word: συνεσπάραξεν
  choice: mú un gbọ̀n jìnnìjìnnì
  rationale: Ó sọ ìgbọ̀n líle tí ara kò lè ṣàkóso ní èdè tí òǹkàwé Yòrùbá òde òní lè lóye.
- source_word: ἐπετίμησεν
  choice: bá ... wí
  rationale: “Bá ... wí” fi ọ̀rọ̀ àṣẹ àti ìkìlọ̀ líle Jésù hàn ní ọ̀nà àdánidá ní Yòrùbá.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ẹ̀mí àìmọ́ náà
  rationale: Ó pa ìtumọ̀ àìmọ́ ní ti ìwà àti ìsìn mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: ἰάσατο
  choice: wo ... sàn
  rationale: Èyí ni ọ̀nà Yòrùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún ìmúláradá.
- source_word: τὸν παῖδα
  choice: ọmọkùnrin náà
  rationale: Ní àyíká ọ̀rọ̀ yìí, παῖς tọ́ka sí ọmọ ọkùnrin; yíyan yìí kò fi ìtumọ̀ “ìránṣẹ́” kún un.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: ó sì dá a padà fún baba rẹ̀
  rationale: Ó mú ìtumọ̀ pípè ọmọ náà padà sọ́dọ̀ baba rẹ̀ jáde, lẹ́yìn ìdáǹdè àti ìwòsàn rẹ̀.
theological_decisions:
- issue: Èdè tí a lò fún ìpọ́njú ẹ̀mí èṣù
  choice: A túmọ̀ δαιμόνιον àti πνεῦμα ἀκάθαρτον ní tààràtà sí “ẹ̀mí èṣù” àti “ẹ̀mí àìmọ́.”
  alternative: Kí a pè é ní agbára búburú tí kì í ṣe ẹni-láàyè tàbí kí a sọ ọ́ di àìsàn ọpọlọ nìkan.
  rationale: Gíríìkì gbé ẹ̀mí èṣù kalẹ̀ gẹ́gẹ́ bí aṣojú ẹni-láàyè, ó sì tún pè é ní ẹ̀mí àìmọ́. Bákan náà, ẹsẹ náà sọ pé Jésù wo ọmọ náà sàn; nítorí náà, ìtumọ̀ náà pa ìdáǹdè kúrò lọ́wọ́ ẹ̀mí èṣù àti ìwòsàn pọ̀ mọ́ra láìdín ọ̀kan kù.
translation_notes:
  register: Èdè náà jẹ́ Yòrùbá àgbàdojú, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìyàtọ̀ tó wà láàárín “ẹ̀mí èṣù” àti “ẹ̀mí àìmọ́” mọ́.
