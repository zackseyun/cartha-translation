id: LUK.9.11
reference: Luke 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn èrò náà gbọ́ nípa rẹ̀, wọ́n tẹ̀ lé e. Ó sì fi inú rere gba wọ́n, ó ń sọ̀rọ̀ sí wọn nípa ìjọba Ọlọ́run, ó sì ń wo àwọn tí wọ́n nílò ìwòsàn sàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì ń wo àwọn tí wọ́n nílò ìtọ́jú sàn.” Ọ̀rọ̀ Gíríìkì θεραπεία lè túmọ̀ sí “ìwòsàn” tàbí “ìtọ́jú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Ṣùgbọ́n ... àwọn èrò náà
  rationale: “Ṣùgbọ́n” fi ìyípadà kékeré nínú ìtàn hàn, “àwọn èrò” sì pa ọ̀pọ̀ ὄχλοι mọ́.
- source_word: γνόντες
  choice: nígbà tí ... gbọ́ nípa rẹ̀
  rationale: Ọ̀rọ̀ àkókò yìí fi hàn pé lẹ́yìn tí wọ́n mọ ohun tó ṣẹlẹ̀ ni wọ́n tẹ̀ lé Jesu; “gbọ́ nípa rẹ̀” jẹ́ èdè Yorùbá àdánidá láì sọ ohun tí wọ́n gbọ́ ní pàtó ju Gíríìkì lọ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wọ́n tẹ̀ lé e
  rationale: Ìtumọ̀ Yorùbá tó wọ́pọ̀ fún títẹ̀ lé ẹnì kan ni ti ara, tí ó sì tún jẹ́ kí ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn lè dún láì fi í kún ọ̀rọ̀.
- source_word: ἀποδεξάμενος αὐτούς
  choice: Ó sì fi tayọ̀tayọ̀ gba wọ́n
  rationale: Ó mú ìtumọ̀ gbígba wọn tọkàntọkàn àti pẹ̀lú inú rere jáde, kì í ṣe gbígba wọn lásán.
- source_word: ἐλάλει αὐτοῖς
  choice: ó ń sọ̀rọ̀ fún wọn
  rationale: Àmì “ń” pa ìṣe tí ó ń lọ lọ́wọ́ nínú imperfect mọ́.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: nípa ìjọba Ọlọ́run
  rationale: Ó pa gbólóhùn pàtàkì yìí mọ́ ní ọ̀nà tó ṣe kedere, tó sì mọ́ àwọn òǹkàwé Yorùbá lára.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: àwọn tí ó nílò ìwòsàn
  rationale: θεραπεία lè túmọ̀ sí ìwòsàn tàbí ìtọ́jú; “nílò ìwòsàn” jẹ́ èdè Yorùbá tó ṣe kedere nínú àyíká yìí.
- source_word: ἰᾶτο
  choice: ó sì ń ... sàn
  rationale: Ìkọ̀lé “ń ... sàn” fi ìṣe ìwòsàn tí ó ń bá a lọ hàn gẹ́gẹ́ bí imperfect Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  alternative: ìṣàkóso Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” ni gbólóhùn Bíbélì tó fìdí múlẹ̀ jù, ó sì lè ní ìtumọ̀ agbára ìṣàkóso àti ilẹ̀ ọba láì dín ọ̀rọ̀ náà kù sí ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá ìpele àárín, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àwọn imperfect méjèèjì ni a fi “ń” hàn.
