revisions:
- from: Ṣùgbọ́n nígbà tí àwọn èrò náà gbọ́ nípa rẹ̀, wọ́n tẹ̀ lé e. Ó sì fi tayọ̀tayọ̀ gba wọ́n, ó ń sọ̀rọ̀ fún wọn nípa ìjọba Ọlọ́run, ó sì ń wo àwọn tí ó nílò ìwòsàn sàn.[a]
  to: Ṣùgbọ́n nígbà tí àwọn èrò náà gbọ́ nípa rẹ̀, wọ́n tẹ̀ lé e. Ó sì fi inú rere gba wọ́n, ó ń sọ̀rọ̀ sí wọn nípa ìjọba Ọlọ́run, ó sì ń wo àwọn tí wọ́n nílò ìwòsàn sàn.[a]
  rationale: Àtúnṣe náà yọ ìtẹnumọ́ tí kò wà nínú Gíríìkì kúrò nínú ìtumọ̀ ἀποδεξάμενος, ó sì mú ìkọ̀lé ìbánisọ̀rọ̀ náà rọrùn àti kedere ní Yorùbá. Gbogbo àwọn ìbáṣepọ̀ ìtumọ̀ pàtàkì, àìpé imperfect, ìjọba Ọlọ́run, àti akọsílẹ̀ ìtumọ̀ míràn fún θεραπεία ni a pa mọ́.
