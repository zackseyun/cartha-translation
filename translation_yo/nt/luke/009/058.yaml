id: LUK.9.58
reference: Luke 9:58
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Àwọn akátá ní ihò[a], àwọn ẹyẹ ojú ọ̀run[b] sì ní ìtẹ́, ṣùgbọ́n Ọmọ Ènìyàn[c] kò ní ibì kankan tí yóò gbé orí rẹ̀ lé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibùgbé” tàbí “ihò ìfarapamọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “àwọn ẹyẹ ọ̀run”; a tún lè túmọ̀ ọ́ sí “àwọn ẹyẹ afẹ́fẹ́.”
    reason: lexical_alternative
  - marker: c
    text: “Ọmọ Ènìyàn” ni orúkọ tí Jésù sábà máa ń fi pe ara rẹ̀; ó sì lè mú Dáníẹ́lì 7:13–14 wá sí ọkàn.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: àwọn kọ̀lọ̀kọ̀lọ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fox; a pa orúkọ ẹranko náà mọ́ láì sọ ọ́ di ọ̀rọ̀ gbogbogbò.
- source_word: φωλεοὺς
  choice: ihò
  rationale: Nínú ọ̀rọ̀ nípa kọ̀lọ̀kọ̀lọ̀, ‘ihò’ jẹ́ ọ̀nà àdánidá láti sọ ibi ìfarapamọ́ tàbí ibùgbé ẹranko, ó sì bá àwòrán Gíríìkì mu.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: Ó tẹ̀ lé ìtumọ̀ gidi ‘àwọn ẹyẹ ọ̀run’ ní èdè Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: κατασκηνώσεις
  choice: ìtẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ibi ìjókòó tàbí ibi ìgbé; nípa ẹyẹ, ‘ìtẹ́’ ni ọ̀rọ̀ Yorùbá tí ó yẹ jù lọ.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa àkọlé tí Jésù fi ń pe ara rẹ̀ mọ́ ní irú rẹ̀ tí a mọ̀ dáadáa, láì túmọ̀ rẹ̀ ní ọ̀nà tí yóò fòpin sí ìtumọ̀ rẹ̀ tó lè ní ìbáṣepọ̀ pẹ̀lú Dáníẹ́lì 7:13–14.
- source_word: οὐκ ἔχει ποῦ
  choice: kò ní ibì kankan
  rationale: Ìkọ̀ Gíríìkì pẹ̀lú ποῦ túmọ̀ sí pé kò sí ibi rárá; ‘kò ní ibì kankan’ jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: tí yóò gbé orí rẹ̀ lé
  rationale: Èyí pa àwòrán gidi ti fífi orí lé ibi kan mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ nípa ibi ìsinmi tàbí ibi ìsùn.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àwọn ẹranko tí wọ́n ní ibi ìgbé àti Ọmọ Ènìyàn tí kò ní ibi fífi orí lé.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sì wí fún un pé
  rationale: Ìtumọ̀ tààrà àti ọ̀nà ìtàn àdánidá fún gbólóhùn Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ orúkọ tí Jésù fi ń pe ara rẹ̀, υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ọmọ Ènìyàn / Ènìyàn náà
  rationale: ‘Ọmọ Ènìyàn’ pa ìrísí àkọlé náà àti ìfarahàn rẹ̀ tó lè tọ́ka sí Dáníẹ́lì 7:13–14 mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Wí fún un pé’ ní ìró ìwé mímọ́ díẹ̀ ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì àlàyé ẹsẹ̀ ni a so mọ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
