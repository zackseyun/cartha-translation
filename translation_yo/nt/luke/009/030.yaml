id: LUK.9.30
reference: Luke 9:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: yo
  text: Sì kíyèsí i, àwọn ọkùnrin méjì ń bá a sọ̀rọ̀, àwọn náà ni Mósè àti Èlíjà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa àmì ìtàn tí ń pe àfiyèsí sí ìṣẹ̀lẹ̀ òjijì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó ní iyì.
- source_word: ἄνδρες δύο
  choice: àwọn ọkùnrin méjì
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọkùnrin méjì pàtó, Mósè àti Èlíjà; ìtumọ̀ yìí jẹ́ ti ẹ̀dá àti ti ara Yorùbá.
- source_word: συνελάλουν
  choice: ń bá a sọ̀rọ̀
  rationale: Àmì ìṣe àìparí nínú Gíríìkì fi ìjíròrò tó ń lọ lọ́wọ́ hàn; “ń bá a sọ̀rọ̀” pa ìtumọ̀ ìbánisọ̀rọ̀ mọ́.
- source_word: αὐτῷ
  choice: a
  rationale: Nínú gbólóhùn “ń bá a sọ̀rọ̀,” arọ́pò-orúkọ yìí fi hàn pé Jésù ni wọ́n ń bá sọ̀rọ̀, kì í ṣe pé wọ́n kàn ń sọ ohun kan sí i.
- source_word: οἵτινες
  choice: Mósè àti Èlíjà sì ni wọ́n
  rationale: Ìṣètò Yorùbá yìí dá àwọn ọkùnrin méjì náà mọ̀ ní tààràtà, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ọ̀nà tí a sábà ń gbà kọ orúkọ náà ní Yorùbá.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Èyí ni ọ̀nà Yorùbá tí a mọ̀ dáadáa fún orúkọ wòlíì náà.
theological_decisions:
- issue: Ìdánimọ̀ àwọn ọkùnrin méjì nígbà ìyípadà ògo
  choice: A dá wọn mọ̀ ní tààràtà gẹ́gẹ́ bí Mósè àti Èlíjà.
  alternative: Ṣíṣe àlàyé ipa àmì tàbí ìtumọ̀ ọjọ́ ìkẹyìn tí Mósè àti Èlíjà lè ní.
  rationale: Ọ̀rọ̀ Gíríìkì kàn dá àwọn méjèèjì mọ̀; kò ṣe àlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ wọn níbí, nítorí náà a kò fi irú àlàyé bẹ́ẹ̀ kún un.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní àmì ohùn kíkún, tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. “Sì kíyèsí i” pa agbára ἰδοὺ mọ́ láìlo ọ̀rọ̀ àtijọ́ tí kò rọrùn fún òǹkàwé òde òní.
