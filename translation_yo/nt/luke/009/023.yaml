id: LUK.9.23
reference: Luke 9:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: yo
  text: Ó sì ń sọ fún gbogbo wọn pé, “Bí ẹnikẹ́ni bá fẹ́ wá lẹ́yìn mi, kí ó sẹ́ ara rẹ̀, kí ó sì gbé àgbélébùú rẹ̀ lójoojúmọ́, kí ó sì máa tọ̀ mí lẹ́yìn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, “ẹnikẹ́ni” àti àwọn àṣẹ tí ó tẹ̀ lé e wà ní ẹni-ẹyọ gbogbogbòò. A lè sọ ọ́ ní ọ̀pọ̀ pẹ̀lú: “Bí àwọn ènìyàn bá fẹ́ wá lẹ́yìn mi, kí wọ́n sẹ́ ara wọn, kí wọ́n sì gbé àgbélébùú wọn lójoojúmọ́, kí wọ́n sì máa tọ̀ mí lẹ́yìn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ó sì ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń sọ” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: πρὸς πάντας
  choice: fún gbogbo wọn
  rationale: Ó fi hàn pé Jésù ń bá gbogbo àwọn tó wà níbẹ̀ sọ̀rọ̀, kì í ṣe àwọn ọmọ-ẹ̀yìn díẹ̀ nìkan.
- source_word: Εἴ τις θέλει
  choice: Bí ẹnikẹ́ni bá fẹ́
  rationale: “Ẹnikẹ́ni” dúró fún ẹni tí a kò dá mọ̀, “bá fẹ́” sì sọ ìfẹ́ tàbí ìpinnu inú ẹni náà ní ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: wá lẹ́yìn mi
  rationale: Ìtumọ̀ yìí pa àwòrán lílọ lẹ́yìn Jésù mọ́, láì dapọ̀ mọ́ ọ̀rọ̀ ἀκολουθείτω tó tẹ̀ lé e.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: kí ó kọ ara rẹ̀
  rationale: “Kọ ara rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún kíkọ ìfẹ́ ara ẹni sílẹ̀ tàbí ṣíṣe àìmọ̀ ara ẹni, ó sì pa agbára àṣẹ náà mọ́.
- source_word: ἀράτω
  choice: kí ó sì gbé
  rationale: “Gbé” fi ìṣe gbígbé àgbélébùú sókè tàbí gbígbà á lé ara ẹni hàn, dípò fífi ìtumọ̀ rẹ̀ mọ́ ìrù ẹrù lásán.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: àgbélébùú rẹ̀
  rationale: A pa ọ̀rọ̀ gidi “àgbélébùú” mọ́, pẹ̀lú ohun-ìní ẹni kọ̀ọ̀kan tí αὐτοῦ tọ́ka sí.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó túmọ̀ sí “ní ọjọ́ kọ̀ọ̀kan,” ó sì pa ìtẹnumọ́ Lúùkù lórí ìtẹ̀síwájú ojoojúmọ́ mọ́.
- source_word: ἀκολουθείτω μοι
  choice: kí ó sì máa tọ̀ mí lẹ́yìn
  rationale: “Máa tọ̀ mí lẹ́yìn” fi àṣẹ tí ó ń bá a lọ hàn, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún títẹ̀lé ẹni.
theological_decisions:
- issue: Ìtumọ̀ àgbélébùú nínú jíjẹ́ ọmọ-ẹ̀yìn
  choice: Pa “àgbélébùú” mọ́ gẹ́gẹ́ bí ohun gidi tí ọ̀rọ̀ náà sọ.
  alternative: Túmọ̀ ọ́ sí “ẹrù,” “ìjìyà,” tàbí “ẹbọ.”
  rationale: σταυρός jẹ́ ọ̀rọ̀ gidi fún àgbélébùú, tí ó tún ní ìtumọ̀ àpẹẹrẹ jinlẹ̀ nípa jíjẹ́ ọmọ-ẹ̀yìn. Ìtumọ̀ kò gbọ́dọ̀ dín àìlójú àti agbára àwòrán náà kù sí ẹrù tàbí ìjìyà lásán.
- issue: Ẹni kan tí ó dúró fún gbogbo ènìyàn nínú τις àti àwọn àṣẹ ẹyọ
  choice: Lo “ẹnikẹ́ni” àti àwọn arọ́pò-orúkọ ẹyọ “ó/ara rẹ̀.”
  alternative: 'Lo ọ̀pọ̀: “kí wọ́n kọ ara wọn, kí wọ́n gbé àgbélébùú wọn.”'
  rationale: Gíríìkì lo ẹni ẹyọ tí ó dúró fún ẹnikẹ́ni lápapọ̀. Yorùbá “ẹnikẹ́ni ... kí ó ... ara rẹ̀” pa ìṣètò yìí mọ́ láì fi akọ tàbí abo kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, àti òde-òní; “kí ó” pa àwọn àṣẹ ẹni-kẹta mọ́, “máa tọ̀ mí lẹ́yìn” sì sọ ìtẹ̀síwájú títẹ̀lé di mímọ̀.
