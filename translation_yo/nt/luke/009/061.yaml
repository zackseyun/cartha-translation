id: LUK.9.61
reference: Luke 9:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: yo
  text: Ẹlòmíràn pẹ̀lú sì wí pé, “Olúwa, èmi yóò tọ̀ ọ́ lẹ́yìn; ṣùgbọ́n kọ́kọ́ gbà mí láyè láti dágbére fún àwọn tí ó wà ní ilé mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: ẹlòmíràn
  rationale: Ó tọ́ka sí ẹnì kan mìíràn tí ó yàtọ̀ sí àwọn tí a mẹ́nu kàn ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Ἀκολουθήσω σοι
  choice: èmi yóò máa tọ̀ ọ́ lẹ́yìn
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà sọ ìpinnu olùsọ̀rọ̀; ‘tọ̀ ọ́ lẹ́yìn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ jíjẹ́ ọmọ-ẹ̀yìn.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ ìbọ̀wọ̀ àti agbára ẹ̀kọ́ nípa ẹni tí Jesu jẹ́ mọ́, láì dín un kù sí ‘ọ̀gá’ tàbí ‘sir’.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi hàn pé ohun tí olùsọ̀rọ̀ ń béèrè fẹ́ ṣe ní àkọ́kọ́ ṣáájú títẹ̀lé Jesu.
- source_word: ἐπίτρεψόν μοι
  choice: gbà mí láyè
  rationale: Àṣẹ tí ó dà bí ẹ̀bẹ̀ fún ìyọ̀ǹda ni; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: ἀποτάξασθαι
  choice: láti dágbére fún
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí kíkí àwọn ènìyàn nígbà ìyapa tàbí lílọ, kì í ṣe ṣíṣètò ọ̀ràn ilé.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: fún àwọn tí ó wà ní ilé mi
  rationale: Ó tọ́ka sí àwọn ènìyàn ní ilé rẹ̀ tàbí àwọn tó jẹ́ ti ilé rẹ̀, láì fi dandan túmọ̀ wọn sí gbogbo agbo ilé gẹ́gẹ́ bí ẹgbẹ́ àwùjọ kan.
- source_word: δὲ καὶ
  choice: pẹ̀lú sì
  rationale: Ó pa ìsopọ̀ mọ́ ọ̀rọ̀ tó ṣáájú àti agbára àfikún pé ẹlòmíràn tún sọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριε nígbà tí a ń bá Jesu sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá; Aláṣẹ
  rationale: ‘Olúwa’ pa àyè ìtumọ̀ náà mọ́ láti orúkọ ìbọ̀wọ̀ títí dé ìjẹ́wọ́ ẹni tí Jesu jẹ́, láì fi tipátipá yan ìtumọ̀ kékeré tàbí èyí tó péye jù.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘dágbére’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún kíkí nígbà ìyapa.
