source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ má ṣe mú ohunkóhun fún ìrìn àjò náà—kì í ṣe ọ̀pá ìrìn, kì í ṣe àpò[a], kì í ṣe búrẹ́dì, kì í ṣe owó[b]; ẹ má sì ní ẹ̀wù inú méjì fún ẹnì kọ̀ọ̀kan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àpò arìnrìn-àjò tí a fi ń gbé ìpèsè.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘fàdákà’ ni ọ̀rọ̀ náà ní tààrà; níhìn-ín ó túmọ̀ sí owó.
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn Gíríìkì náà túmọ̀ sí ẹ̀wù inú méjì fún ẹnì kọ̀ọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Ẹ má ṣe mú ohunkóhun fún ìrìn àjò náà
  rationale: Ó sọ ìfòfindè náà ní Yorùbá àdánidá, ó sì pa èrò ohun tí a ó mú lọ fún ìrìn àjò mọ́.
- source_word: ῥάβδον
  choice: ọ̀pá ìrìn
  rationale: Nínú àyíká ìrìn àjò, ọ̀pá tí arìnrìn-àjò fi ń rìn ni ọ̀rọ̀ náà tọ́ka sí.
- source_word: πήραν
  choice: àpò
  rationale: ‘Àpò’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì lè dúró fún àpò ìpèsè arìnrìn-àjò; àlàyé pàtó wà ní àlàyé ìsàlẹ̀.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: Ó pa ohun tí Gíríìkì sọ ní pàtó mọ́ dípò fífẹ̀ ọ́ sí ‘oúnjẹ’ lápapọ̀.
- source_word: ἀργύριον
  choice: owó
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘fàdákà,’ ohun tí ó túmọ̀ sí nínú àyíká yìí ni owó tí a lè ná.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: kí ẹnikẹ́ni nínú yín má sì ní ẹ̀wù inú méjì
  rationale: ‘Ẹnikẹ́ni nínú yín’ mú agbára pínpín ἀνά hàn, ìyẹn méjì fún olúkúlùkù; ‘ẹ̀wù inú’ sì fi irú aṣọ χιτών hàn ní ọ̀nà tí òǹkàwé Yorùbá lè lóye.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ èdè ọ̀wọ̀, tó ṣe kedere, tí ó sì bójú mu fún òǹkàwé òde òní. A lo ‘bóyá … tàbí’ láti gbé àtòjọ àwọn ohun tí a kò gbọ́dọ̀ mú kalẹ̀ lọ́nà àdánidá.
