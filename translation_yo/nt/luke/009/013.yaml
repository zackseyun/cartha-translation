revisions:
- from: Ṣùgbọ́n ó sọ fún wọn pé, “Ẹ̀yin fúnra yín ni kí ẹ fún wọn ní ohun tí wọn yóò jẹ.” Wọ́n sì sọ pé, “A kò ní ju ìṣù búrẹ́dì márùn-ún àti ẹja méjì lọ—àfi bí àwa fúnra wa bá lọ ra oúnjẹ fún gbogbo àwọn ènìyàn wọ̀nyí.”
  to: Ṣùgbọ́n ó sọ fún wọn pé, “Ẹ̀yin fúnra yín, ẹ fún wọn ní ohun tí wọ́n yóò jẹ.” Ṣùgbọ́n wọ́n sọ pé, “A kò ní ju búrẹ́dì márùn-ún àti ẹja méjì lọ—àfi bí àwa bá lọ ra oúnjẹ fún gbogbo àwọn ènìyàn wọ̀nyí.”
  rationale: The revision makes Jesus’ words a natural direct imperative while retaining the emphasis of ὑμεῖς through “Ẹ̀yin fúnra yín.” It retains the limiting force of οὐκ ... πλεῖον ἢ, the conditional protest introduced by εἰ μήτι, and the explicit “we” in the proposed buying action. No footnote is needed because the translation communicates the relevant emphasis naturally.
