id: LUK.9.13
reference: Luke 9:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ẹ̀yin fúnra yín, ẹ fún wọn ní ohun tí wọ́n yóò jẹ.” Ṣùgbọ́n wọ́n sọ pé, “A kò ní ju búrẹ́dì márùn-ún àti ẹja méjì lọ—àfi bí àwa bá lọ ra oúnjẹ fún gbogbo àwọn ènìyàn wọ̀nyí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δότε ... ὑμεῖς φαγεῖν
  choice: Ẹ̀yin fúnra yín ni kí ẹ fún wọn ní ohun tí wọn yóò jẹ
  rationale: Ọ̀rọ̀-arọ́pò orúkọ ὑμεῖς ní ìtẹnumọ́; “ẹ̀yin fúnra yín” mú un hàn ní Yorùbá. Àkójọpọ̀ Δότε ... φαγεῖν jẹ́ àṣẹ láti fún wọn ní ohun tí wọn yóò jẹ, kì í ṣe “fún wọn láti jẹ” ní ọ̀nà líle.
- source_word: πλεῖον ἢ
  choice: kò ní ju ... lọ
  rationale: Pẹ̀lú ìsẹ́ Οὐκ εἰσὶν ἡμῖν, gbólóhùn náà fi ààlà ohun tí wọ́n ní hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ἄρτοι πέντε
  choice: ìṣù búrẹ́dì márùn-ún
  rationale: ἄρτοι tọ́ka sí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan; “ìṣù búrẹ́dì” dá iye náà mọ́ kedere ju “búrẹ́dì” lásán lọ.
- source_word: ἰχθύες δύο
  choice: ẹja méjì
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εἰ μήτι
  choice: àfi bí ... bá
  rationale: Ó ń ṣí ọ̀nà àyọkà sílẹ̀, ó sì tún lè ní ìmọ̀lára àní-àní tàbí ìtakò inú; “àfi bí ... bá” pa ìtumọ̀ pàtàkì náà mọ́ láìfi ìmọ̀lára míì kún un.
- source_word: πορευθέντες ... ἀγοράσωμεν
  choice: bá lọ ra
  rationale: 'Ọ̀nà Yorùbá àdánidá ni láti sọ participle àti subjunctive náà gẹ́gẹ́ bí ìṣe tó tẹ̀ lé ara wọn: lọ ra.'
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: gbogbo àwọn ènìyàn wọ̀nyí
  rationale: λαός níbí jẹ́ àwùjọ àwọn ènìyàn; ìtumọ̀ yìí pa πάντα àti τοῦτον mọ́ láìdì í mọ́ “ọ̀pọ̀ ènìyàn” nìkan.
- source_word: βρώματα
  choice: oúnjẹ
  rationale: Bí ó tilẹ̀ jẹ́ ọ̀pọ̀ nínú Gíríìkì, orúkọ àkójọpọ̀ “oúnjẹ” ni ó bá Yorùbá mu jù ní àyíká yìí.
theological_decisions:
- issue: Ìtẹnumọ́ àṣẹ Jésù àti ohùn ìdáhùn àwọn ọmọ-ẹ̀yìn
  choice: Fi ìtẹnumọ́ ὑμεῖς hàn pẹ̀lú “ẹ̀yin fúnra yín,” ṣùgbọ́n má ṣe fi ìbínú, ẹ̀gàn, tàbí ìbáwí tí Gíríìkì kò sọ kún un.
  alternative: Láti túmọ̀ àṣẹ náà láìsí “fúnra yín,” tàbí láti mú ìdáhùn àwọn ọmọ-ẹ̀yìn dun bí ìbínú tó lágbára.
  rationale: Ẹsẹ náà ní àṣẹ tààrà àti ìdáhùn tó dá lórí àìní ohun àmúlò. Ìtumọ̀ yìí pa ìtẹnumọ́ ọ̀rọ̀-arọ́pò orúkọ mọ́, ṣùgbọ́n kò pinnu ìmọ̀lára tí ọ̀rọ̀ náà kò sọ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ìṣù búrẹ́dì” jẹ́ kedere fún àwọn nǹkan márùn-ún tí a lè kà; “àwọn ènìyàn wọ̀nyí” pa ìtumọ̀ συλλογικόν λαός àti atọ́ka τοῦτον mọ́.
