id: LUK.9.5
reference: Luke 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: yo
  text: Gbogbo àwọn tí kò bá gbà yín[a], bí ẹ ti ń jáde kúrò ní ìlú náà[b], ẹ gbọn erùpẹ̀ kúrò ní ẹsẹ̀ yín gẹ́gẹ́ bí ẹ̀rí lòdì sí wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò bá tẹ́wọ́ gbà yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba tàbí títẹ́wọ́ gbà àwọn ońṣẹ́ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìlú ńlá náà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìlú kékeré tàbí ìlú ńlá, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται
  choice: gbogbo àwọn tí kò bá gbà yín
  rationale: “Gbogbo àwọn tí ... bá” mú ìtumọ̀ àìdánimọ̀ àti àpapọ̀ ὅσοι ἂν jáde. “Gbà yín” lè túmọ̀ sí gbígba àwọn ońṣẹ́ wọlé, kíkọ́wọ́ gbà wọ́n, àti títẹ́wọ́ gbà wọ́n, láì dín ọ̀rọ̀ náà kù sí fífún wọn ní ibùgbé nìkan.
- source_word: ὑμᾶς
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, ó sì tọ́ka sí àwọn ọmọ-ẹ̀yìn tí a rán.
- source_word: ἐξερχόμενοι
  choice: bí ẹ ti ń jáde
  rationale: Ó fi hàn pé jíjáde náà ń ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú àṣẹ láti gbọn erùpẹ̀ kúrò ní ẹsẹ̀ wọn.
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: kúrò ní ìlú náà
  rationale: “Ìlú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè dúró fún town tàbí city; “náà” pa ìtọ́kasí ἐκείνης mọ́.
- source_word: τὸν κονιορτὸν
  choice: erùpẹ̀
  rationale: Erùpẹ̀ ni ohun kéékèèké gbígbẹ tí ó wà lórí ilẹ̀, ó sì bá àwòrán ìṣe àmì yìí mu.
- source_word: ἀπὸ τῶν ποδῶν ὑμῶν
  choice: kúrò ní ẹsẹ̀ yín
  rationale: Ó sọ ibi tí erùpẹ̀ náà wà àti ibi tí a ó ti mú un kúrò ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἀποτινάσσετε
  choice: ẹ gbọn ... kúrò
  rationale: Àṣẹ yìí pa àwòrán yíyọ erùpẹ̀ kúrò nípa gbígbọn mọ́, dípò lílé e mọ́ tàbí fífọ ọ́ nù.
- source_word: εἰς μαρτύριον
  choice: gẹ́gẹ́ bí ẹ̀rí
  rationale: Ó pa ipa ìṣe náà gẹ́gẹ́ bí ohun tí ń jẹ́rìí tàbí fi ẹ̀rí hàn mọ́.
- source_word: ἐπ’ αὐτούς
  choice: lòdì sí wọn
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, ó fi ipa ìkìlọ̀ àti ti ìdájọ́ ẹ̀rí náà hàn, kì í ṣe àmì tí kò dúró sí ẹ̀gbẹ́ kankan.
theological_decisions:
- issue: Agbára ìtumọ̀ ìṣe gbígbọn erùpẹ̀ kúrò ní ẹsẹ̀
  choice: A túmọ̀ ìṣe náà sí ẹ̀rí lòdì sí àwọn tí kò gba àwọn ońṣẹ́ náà.
  alternative: A lè sọ ọ́ di àmì lásán sí wọn, tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìkéde ìdálẹ́bi ìkẹyìn láti ọ̀dọ̀ Ọlọ́run.
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς ní agbára ìkìlọ̀ àti ti ìdájọ́ ju àmì tí kò dúró sí ẹ̀gbẹ́ kankan lọ, ṣùgbọ́n ẹsẹ yìí kò sọ pé ó jẹ́ ìkéde ìdálẹ́bi ìkẹyìn. “Ẹ̀rí lòdì sí wọn” pa ìfẹ̀sẹ̀mulẹ̀ àti àìmọ́ tí ó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá àkókò-òde tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àmì ohùn wà níbi tí ó yẹ. “Ìlú” kò fi dandan sọ bóyá ibẹ̀ jẹ́ ìlú kékeré tàbí ńlá, “gbà yín” sì pa ìtumọ̀ gbígba àti títẹ́wọ́ gbà mọ́.
