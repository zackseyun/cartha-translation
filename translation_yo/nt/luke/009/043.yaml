source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: yo
  text: 'Ẹnu sì ya gbogbo wọn nítorí ọláńlá Ọlọ́run.[a] Ṣùgbọ́n, bí gbogbo wọn ṣe ń ṣe kàyéfì sí gbogbo ohun tí ó ń ṣe, ó sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títóbi Ọlọ́run.” Ọ̀rọ̀ Gíríìkì μεγαλειότης lè túmọ̀ sí títóbi, ọláńlá, tàbí ìtayọlọ́lá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu sì ya ...
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle hàn. Àṣìṣe aláìpé Gíríìkì náà ṣàpèjúwe bí ìyàlẹ́nu ṣe ń bá wọn lọ, èyí tí àyíká gbólóhùn Yorùbá náà mú jáde lọ́nà àdánidá.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó pa ìtẹnumọ́ pé gbogbo àwọn tó wà níbẹ̀ ni ìṣẹ̀lẹ̀ náà yà lẹ́nu mọ́.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: sí ọláńlá Ọlọ́run
  rationale: “Ọláńlá” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún títóbi, ọlá àti ìtayọlọ́lá tí μεγαλειότης túmọ̀ sí nípa Ọlọ́run; “sí” sì tọ́ka sí ohun tó fa ìyàlẹ́nu wọn.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Ṣùgbọ́n nígbà tí gbogbo ènìyàn ń ṣe kàyéfì
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tó ṣe déédé fún Yorùbá. “Ń ṣe kàyéfì” tún yà θαυμάζω sọ́tọ̀ kúrò nínú ìyàlẹ́nu líle tí ἐκπλήσσομαι fi hàn ní apá àkọ́kọ́.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: sí gbogbo ohun tí ó ń ṣe
  rationale: Ó mú gbogbo ohun tó jẹ́ kókó ìkàyéfì wọn jáde, ó sì pa ìṣe tó ń lọ lọ́wọ́ inú imperfect ἐποίει mọ́.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ó sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé àti tó ṣe kedere láti sọ pé ó bá àwọn ọmọ-ẹ̀yìn tirẹ̀ sọ̀rọ̀.
theological_decisions:
- issue: Ẹni tí “ó” ń tọ́ka sí nínú οἷς ἐποίει àti εἶπεν
  choice: “Ó” ń tọ́ka sí Jésù
  alternative: Kí a tẹnumọ́ pé Ọlọ́run ni olùṣe nítorí gbólóhùn tó ṣáájú, “ọláńlá Ọlọ́run”
  rationale: Nínú ìtàn náà, Jésù ni ẹni tó ń ṣe àwọn iṣẹ́ náà, òun náà sì ni ẹni tó bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀. Síbẹ̀, ẹsẹ náà sọ pé ọláńlá Ọlọ́run ni iṣẹ́ Jésù fi hàn, nítorí náà a pa ìyàtọ̀ àti ìsopọ̀ méjèèjì mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹnu ya” àti “ṣe kàyéfì” jẹ́ àdánidá, wọ́n sì pa ìyàtọ̀ agbára tó wà láàárín àwọn ọ̀rọ̀ Gíríìkì méjì fún ìyàlẹ́nu mọ́.
