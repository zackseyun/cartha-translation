source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: yo
  text: Bí ó sì ti ń gbàdúrà, ìrísí ojú rẹ̀ di òmíràn[a], aṣọ rẹ̀ sì funfun, ó sì ń dàn bí mànàmáná[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “ìrísí ojú rẹ̀ yí padà.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí, “aṣọ rẹ̀ funfun, ó sì ń dán yanran”; participli Gíríìkì náà ń mú àwòrán ìmọ́lẹ̀ tí ń dàn bí mànàmáná wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Bí ó sì ti ń gbàdúrà
  rationale: Gbólóhùn yìí mú ìtumọ̀ àkókò inú ọ̀nà ìkọ̀wé Lúùkù jáde ní Yorùbá àdánidá, láì fi ọ̀rọ̀ líle bí ‘ó sì ṣẹlẹ̀’ kún un.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: ìrísí ojú rẹ̀
  rationale: εἶδος ń tọ́ka sí ohun tí ojú rí, πρόσωπον sì túmọ̀ sí ‘ojú’; ‘ìrísí ojú rẹ̀’ ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ἕτερον
  choice: di òmíràn
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘òmíràn’ tàbí ‘èyí tí ó yàtọ̀.’ ‘Di òmíràn’ pa ọ̀rọ̀ Lúùkù mọ́, ó sì fi hàn pé ìyípadà kan wáyé láì ṣàfikún pé ojú rẹ̀ tàn.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ἱματισμός jẹ́ aṣọ tí ènìyàn wọ̀; ‘aṣọ rẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì ní iyì.
- source_word: λευκὸς
  choice: funfun
  rationale: λευκός túmọ̀ sí ‘funfun’; a fi àlàyé ìmọ́lẹ̀ sí apá participle tó tẹ̀ lé e, kì í ṣe sínú ọ̀rọ̀ yìí fúnra rẹ̀.
- source_word: ἐξαστράπτων
  choice: ó ń kọ mànà bí mọ̀nàmọ́ná
  rationale: Participli náà ní àwòrán ìmọ́lẹ̀ tó ń kọ bí mọ̀nàmọ́ná; gbolohun yìí pa àwòrán alágbára náà mọ́ ju ‘ó ń dán’ lásán lọ.
theological_decisions:
- issue: Àpèjúwe ìyípadà ìrísí Jésù
  choice: A tú ọ̀rọ̀ Lúùkù sí ìyípadà tí ojú lè rí, ‘ìrísí ojú rẹ̀ di òmíràn.’
  alternative: ‘Ìrísí ojú rẹ̀ yí padà’ tàbí ‘ojú rẹ̀ tàn.’
  rationale: Ọ̀rọ̀ Lúùkù sọ pé ìrísí náà di òmíràn, ṣùgbọ́n kò sọ níbí pé ojú rẹ̀ tàn. Yíyan yìí kò da ọ̀rọ̀ inú àwọn Ìhìn Rere mìíràn pọ̀ mọ́ ti Lúùkù, kò sì sọ ohun tí Gíríìkì kò sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Kọ mànà bí mọ̀nàmọ́ná’ pa àwòrán Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá.
