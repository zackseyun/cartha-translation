  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: yo
  text: Ó sì rán àwọn òjíṣẹ́ ṣáájú rẹ̀.[a] Wọ́n sì lọ wọ abúlé kan ti àwọn ará Samáríà[b] láti pèsè sílẹ̀ fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀: “níwájú ojú rẹ̀.”'
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “abúlé Samáríà kan.” Èdè Gíríìkì náà ní ọ̀rọ̀-fún-ọ̀rọ̀ pé, “abúlé kan ti àwọn ará Samáríà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó rán wọn lọ fún iṣẹ́ kan; ‘rán’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì ṣe déédé pẹ̀lú aorist náà.
- source_word: ἀγγέλους
  choice: àwọn aṣojú
  rationale: Nínú àyíká ìtàn yìí, àwọn ènìyàn tí a rán ṣáájú ni, kì í ṣe àwọn áńgẹ́lì ọ̀run; ‘aṣojú’ fi ipa wọn hàn kedere.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ṣáájú rẹ̀
  rationale: Èyí fi ìtumọ̀ àṣà-ọrọ náà, ‘níwájú ojú rẹ̀,’ hàn ní Yorùbá àdánidá gẹ́gẹ́ bí lílọ ṣáájú rẹ̀.
- source_word: πορευθέντες
  choice: wọ́n sì lọ
  rationale: Aorist participle náà tọ́ka sí lílọ wọn tó ṣáájú wíwọlé; gbolohun ọ̀rọ̀-ìṣe tó tẹ̀ léra yìí jẹ́ àdánidá ní Yorùbá.
- source_word: εἰσῆλθον
  choice: wọ́n wọ
  rationale: ‘Wọ’ túmọ̀ sí wíwọ inú ibì kan, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ ‘entered.’
- source_word: κώμην
  choice: ìletò kan
  rationale: κώμη ń tọ́ka sí abúlé tàbí ìletò kékeré; ‘ìletò’ jẹ́ ọ̀rọ̀ ọlọ́lá tó ṣe kedere láì mú kí ibẹ̀ dà bí ìlú ńlá.
- source_word: Σαμαριτῶν
  choice: ti àwọn ará Samáríà
  rationale: Èyí pa ẹ̀dá genitive plural Gíríìkì mọ́, ó sì lè túmọ̀ sí ìletò tí àwọn ará Samáríà ń gbé tàbí tí ó jẹ́ tiwọn.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: láti pèsè sílẹ̀ fún un
  rationale: ὡς pẹ̀lú infinitive ń fi ète hàn níbí; ọ̀rọ̀ náà kò sọ ohun tí wọ́n máa pèsè ní pàtó, nítorí náà ìtumọ̀ Yorùbá náà kò fi kún un.
