- from: Ó sì rán àwọn aṣojú ṣáájú rẹ̀.[a] Wọ́n sì lọ, wọ́n wọ ìletò kan ti àwọn ará Samáríà[b] láti pèsè sílẹ̀ fún un.
  to: Ó sì rán àwọn òjíṣẹ́ ṣáájú rẹ̀.[a] Wọ́n sì lọ wọ abúlé kan ti àwọn ará Samáríà[b] láti pèsè sílẹ̀ fún un.
  rationale: A rọ́pò ‘aṣojú’ pẹ̀lú ‘òjíṣẹ́’ láti fara mọ́ ἀγγέλους ní àyíká ìtàn, a sì rọ́pò ‘ìletò’ pẹ̀lú ‘abúlé’ fún ọ̀rọ̀ tí ó wọ́pọ̀ jù fún κώμη. A pa ète ‘láti pèsè sílẹ̀ fún un’ mọ́, láì fi ohun tí wọ́n ń pèsè kún un. A tún ṣàtúnṣe àwọn àlàyé ìsàlẹ̀ kí wọ́n ṣe kedere, kí wọ́n sì bá àwọn àmì [a] àti [b] mu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú ìtàn Gíríìkì náà jáde dáadáa: a rán àwọn ènìyàn ṣáájú rẹ̀, wọ́n wọ abúlé àwọn ará Samáríà, ète wọn sì ni láti pèsè sílẹ̀ fún un. Síbẹ̀, ‘òjíṣẹ́’ sún mọ́ ἀγγέλους (‘messengers/envoys’) ju ‘aṣojú’ lọ, àti ‘abúlé’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye jù fún κώμη.'
  naturalness: 'Àtúnṣe náà ń lo Yorùbá òde òní tí ó rọrùn: ‘Wọ́n sì lọ wọ...’ jẹ́ ọ̀nà àdánidá láti sọ participle lílọ àti ìṣe wíwọlé. ‘Abúlé’ ló wọ́pọ̀ jù ‘ìletò’ lọ nínú ìtumọ̀ ẹsẹ Ìwé Mímọ́.'
  terminology: ‘Òjíṣẹ́’ jẹ́ ìtumọ̀ tó bá àyíká ọ̀rọ̀ mu fún ἀγγέλους láì tọ́ka sí áńgẹ́lì ọ̀run. ‘Abúlé’ ń ṣàfihàn κώμη gẹ́gẹ́ bí ìbugbe kékeré. ‘Àwọn ará Samáríà’ pa genitive plural náà mọ́. Àwọn àlàyé ìsàlẹ̀ ni a tún ṣe kí àlàyé (b) má bàa tún ìtumọ̀ inú ẹsẹ̀ náà sọ lásán.
  issues:
  - severity: low
    issue: ‘Àwọn aṣojú’ kéré sí ìtumọ̀ taara ‘messengers’ ju ‘àwọn òjíṣẹ́’ lọ.
    rationale: Aṣojú lè túmọ̀ sí aṣojú ìjọba tàbí aṣojú ẹgbẹ́; òjíṣẹ́ ń ṣàfihàn ẹni tí a rán ní kedere, ó sì bá àyíká ọ̀rọ̀ náà mu.
  - severity: low
    issue: ‘Ìletò’ kò wọ́pọ̀ bí ‘abúlé’ fún κώμη.
    rationale: Ìletò lè ní ìmọ̀ ‘settlement’ tàbí ibùdó; abúlé ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún village.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ (b) kò fi ìyàtọ̀ gidi hàn láti inú ìtumọ̀ tó wà nínú ẹsẹ̀ náà.
    rationale: Àtúnṣe náà fi ‘abúlé Samáríà kan’ hàn gẹ́gẹ́ bí ọ̀nà Yorùbá tí ó ṣókí, nígbà tí ó tún ṣàlàyé ìtúmọ̀ gígùn ti Gíríìkì.
