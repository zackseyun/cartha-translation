translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘aṣojú’ dípò ‘áńgẹ́lì’ nítorí àyíká náà fi hàn pé ènìyàn ni wọn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
