source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: yo
  text: Nítorí àǹfààní wo ni ènìyàn ń rí bí ó bá jèrè gbogbo ayé, ṣùgbọ́n tí ó pàdánù ara rẹ̀ tàbí tí ó jìyà ìpàdánù ara rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìyè rẹ̀” tàbí “ẹ̀mí rẹ̀.” Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ arọ́pò-orúkọ àfarawà, ìyẹn “ara rẹ̀,” kì í ṣe ọ̀rọ̀ tí a sábà máa ń lò fún “ìyè” tàbí “ẹ̀mí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Nítorí èrè wo ni ó jẹ́ fún
  rationale: Ó pa ìbéèrè àsọyé àti agbára ìṣàlàyé γὰρ mọ́, ó sì sọ èrò àǹfààní ὠφελεῖται ní Yorùbá àdánidá.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn kan gẹ́gẹ́ bí aṣojú gbogbo ènìyàn; “ènìyàn” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: bí ó bá jèrè gbogbo ayé
  rationale: Ilana “bí ó bá” mú ipò àròsọ tí participle náà ní hàn, “jèrè gbogbo ayé” sì pa ìyàtọ̀ ọ̀rọ̀ mọ́ láàárín κερδαίνω àti ὠφελέω.
- source_word: ἑαυτὸν δὲ ἀπολέσας
  choice: ṣùgbọ́n tí ó pàdánù ara rẹ̀
  rationale: “Ara rẹ̀” túmọ̀ reflexive pronoun náà láì dín un kù sí ọkàn tàbí ẹ̀mí; “ṣùgbọ́n” mú ìtakora δέ hàn.
- source_word: ἢ ζημιωθείς
  choice: tàbí tí ara rẹ̀ sì di ohun ìpàdánù fún un
  rationale: Ó pa ἢ gẹ́gẹ́ bí “tàbí” mọ́, ó sì gbìmọ̀ láti fi passive nuance ζημιωθείς hàn yàtọ̀ sí “pàdánù,” ìyẹn pé ẹni náà jìyà ìpàdánù nípa ara rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἑαυτόν nípa ohun tí ènìyàn lè pàdánù
  choice: ara rẹ̀
  alternative: ẹ̀mí rẹ̀; ìyè rẹ̀
  rationale: Orísun Gíríìkì lo arọ́pò-orúkọ àfarawà, kì í ṣe ψυχή. “Ara rẹ̀” níbí túmọ̀ sí gbogbo ẹni náà, kì í ṣe ara ẹran nìkan, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tóóró kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àmi ohùn wà níbi tí ó bá yẹ. Gbólóhùn náà pa ìbéèrè àsọyé, ìtakora, àti ìyàtọ̀ tó wà láàárín àwọn ọ̀rọ̀ méjì fún ìpàdánù mọ́.
