source:
  edition: SBLGNT
  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: yo
  text: Nítorí iye àwọn ọkùnrin náà fẹ́rẹ̀ẹ́ jẹ́ ẹgbẹ̀rún márùn-ún[a]. Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ mú kí wọ́n jókòó sílẹ̀; ẹ pín wọn sí ẹgbẹ́-ẹgbẹ́, tí ẹgbẹ́ kọ̀ọ̀kan yóò fẹ́rẹ̀ẹ́ jẹ́ àádọ́ta.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ni “àwọn ọkùnrin,” ó sì ń tọ́ka sí àwọn ọkùnrin àgbà dípò gbogbo ogunlọ́gọ̀; a kò kà àwọn obìnrin àti àwọn ọmọdé sínú iye yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ mú kí wọ́n rọ̀gbọ̀ sílẹ̀; ẹ pín wọn sí ẹgbẹ́-ẹgbẹ́, tí ẹgbẹ́ kọ̀ọ̀kan yóò fẹ́rẹ̀ẹ́ jẹ́ àádọ́ta.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka ní pàtó sí rírọ̀gbọ̀ tàbí dídùbúlẹ̀ fún jíjẹun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: tó ìwọ̀n / bí
  rationale: Ọ̀rọ̀ náà fi hàn pé iye náà kì í ṣe iye pàtó; àwọn ọ̀nà méjèèjì jẹ́ èdè Yorùbá àdánidá fún ìsúnmọ́ iye.
- source_word: ἄνδρες
  choice: àwọn ọkùnrin
  rationale: ἀνήρ tọ́ka sí àwọn ọkùnrin àgbà ní pàtó, kì í ṣe gbogbo ènìyàn lápapọ̀.
- source_word: πεντακισχίλιοι
  choice: ẹgbẹ̀rún márùn-ún
  rationale: Èyí tú nọ́ńbà inú Gíríìkì jáde ní tààràtà.
- source_word: Κατακλίνατε
  choice: Ẹ mú kí wọ́n jókòó sílẹ̀
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ sí mímú kí ènìyàn rọgbọ tàbí dùbúlẹ̀ fún oúnjẹ; ní Yorùbá òde òní, ‘jókòó sílẹ̀’ jẹ́ ọ̀nà àdánidá tó ṣeé lóye, nígbà tí àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ ibi jíjẹun náà.
- source_word: κλισίας
  choice: ní àwùjọ-àwùjọ
  rationale: Ọ̀pọ̀ nọ́ńbà ọ̀rọ̀ náà tọ́ka sí àwọn ìpín tàbí ẹgbẹ́ tí a ṣètò; àtúnwí ‘àwùjọ-àwùjọ’ mú ìtumọ̀ pípín wọn sí ẹgbẹ́ hàn kedere.
- source_word: ἀνὰ πεντήκοντα
  choice: bí àádọ́ta ní ọ̀kọ̀ọ̀kan
  rationale: ἀνά pẹ̀lú nọ́ńbà fi ìpínkiri hàn; ‘ní ọ̀kọ̀ọ̀kan’ sọ pé àádọ́ta ni ó fẹ́rẹ̀ẹ́ wà nínú àwùjọ kọ̀ọ̀kan.
- source_word: γὰρ ... δὲ
  choice: Nítorí ... sì
  rationale: ‘Nítorí’ pa agbára àlàyé γάρ mọ́, ‘sì’ sì jẹ́ àsopọ̀ ìtàn àdánidá fún δέ.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó pa arọ́pò-orúkọ ohun-ìní αὐτοῦ mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí a bá sọ̀rọ̀ sí.
