  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún un pé, “Ẹ má ṣe dá a dúró,[a] nítorí ẹni tí kò bá lòdì sí yín wà fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe dí i lọ́wọ́,” tàbí “Ẹ má ṣe fòfin dè é.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Ṣùgbọ́n Jésù sọ fún un pé
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà kékeré tí δέ mú wá hàn gẹ́gẹ́ bí ìdáhùn sí ọ̀rọ̀ Jòhánù; ‘fún un’ pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi orúkọ Jòhánù sínú ọ̀rọ̀ náà.
- source_word: Μὴ κωλύετε
  choice: Ẹ má ṣe dá a dúró
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀pọ̀ ènìyàn, nítorí náà ‘Ẹ’ fi hàn pé Jésù ń bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀. ‘Dá a dúró’ jẹ́ ọ̀nà Yorùbá àdánidá fún dídènà ẹni náà láti máa ṣe ohun tó ń ṣe.
- source_word: ὃς γὰρ
  choice: nítorí ẹni tí
  rationale: ‘Nítorí’ ṣàfihàn γάρ, ‘ẹni tí’ sì lè tọ́ka sí ẹni náà nínú ìṣẹ̀lẹ̀ yìí, nígbà kan náà ó sì lè sọ ìlànà tó gbòòrò.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: kò bá lòdì sí yín
  rationale: ‘Lòdì sí’ sọ ìtumọ̀ κατά pẹ̀lú ọ̀rọ̀-orúkọ olùní nípa ìtakò; ‘yín’ pa ẹnìkejì ọ̀pọ̀ mọ́.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: wà fún yín
  rationale: ‘Wà fún yín’ pa ìfiwéra tó wà láàárín ‘lòdì sí yín’ àti ‘fún yín’ mọ́, kò sì fi ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn Jésù
  choice: Lo ‘ẹni tí’ láti jẹ́ kí ọ̀rọ̀ náà ṣiṣẹ́ gẹ́gẹ́ bí ìlànà gbogbogbò, láìgé asopọ̀ rẹ̀ pẹ̀lú ẹni tí wọ́n ń sọ̀rọ̀ nípa rẹ̀.
  alternative: ‘Ẹni náà tí kò lòdì sí yín wà fún yín,’ èyí tó lè mú kí ọ̀rọ̀ náà dà bí ẹni pé ó mọ sí ọkùnrin náà nìkan.
  rationale: Arọ́pò-orúkọ ὅς lè tọ́ka sí ẹni tó wà nínú àyíká ọ̀rọ̀, ó sì tún lè gbé òtítọ́ gbogbogbò jáde. ‘Ẹni tí’ pa àwọn ìtumọ̀ méjèèjì sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ẹ’ láti ṣàfihàn pé àṣẹ Gíríìkì jẹ́ ọ̀pọ̀ ènìyàn, kì í ṣe àmì ọ̀wọ̀ sí ẹni kan ṣoṣo.
