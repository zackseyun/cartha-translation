    rationale: Ní Yorùbá, ‘kọ̀ fún un’ sábà máa ń ní ìtumọ̀ kọ́ láti ṣe ohun kan fún ẹni náà, tàbí kọ́ ìbéèrè rẹ̀; ó lè yí ojúlówó ìmọ̀ ọrọ̀ náà kúrò nínú ‘dènà’ tàbí ‘fòfin de.’ A gbọdọ̀ rọ́pò ó pẹ̀lú àṣàyàn tó ṣe kedere.
