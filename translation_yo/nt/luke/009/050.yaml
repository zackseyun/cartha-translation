  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń pa àwọn kókó Gíríìkì mọ́ dáadáa: Jésù ń bá ẹni tí ó ṣẹ̀ṣẹ̀ sọ̀rọ̀ pọ̀ sọ̀rọ̀ nípasẹ̀ arọ́pò-orúkọ, àṣẹ náà jẹ́ sí ọ̀pọ̀ ènìyàn, ‘lòdì sí yín’ àti ‘fún yín’ sì ń bá ara wọn mu. ‘Ẹni tí kò bá lòdì sí yín’ lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò ní Yorùbá.'
  naturalness: ‘Ẹ má ṣe dá a dúró’ jẹ́ Yorùbá boṣewa, ó sì ṣàfihàn ìdènà ẹni náà nínú ohun tí ó ń ṣe. Gbólóhùn náà kedere, ó sì yẹ fún ìforúkọsílẹ̀ ìwé mímọ́ òde òní.
  terminology: Kò sí ọ̀rọ̀ ẹ̀sìn pàtàkì tí a tú ní ọ̀nà àìtọ́ nínú ẹsẹ̀ yìí. Síbẹ̀, ‘Ẹ má ṣe kọ̀ fún un’ nínú àlàyé-ẹsẹ̀ lè túmọ̀ sí má ṣe kọ́ tàbí má ṣe kọ̀ láti fún un ní ohun kan; kì í ṣe àṣàyàn kedere fún κωλύετε (‘dènà/fòfin de’).
