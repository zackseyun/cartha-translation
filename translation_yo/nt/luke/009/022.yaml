id: LUK.9.22
reference: Luke 9:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: yo
  text: Ó ní pé, “Ó di dandan[a] kí Ọmọ Ènìyàn jìyà ọ̀pọ̀lọpọ̀ nǹkan, kí àwọn alàgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé kọ̀ ọ́ sílẹ̀, kí a pa á, àti kí a jí i dìde[b] ní ọjọ́ kẹta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọmọ Ènìyàn ní láti jìyà ọ̀pọ̀lọpọ̀ nǹkan …”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ọ̀rọ̀ àìṣe: “kí a jí i dìde”; kò dárúkọ ẹni tó jí i dìde. A tún lè túmọ̀ rẹ̀ sí “kí ó jí dìde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: Ó ní pé
  rationale: Aorist participle náà ń mú ọ̀rọ̀ Jésù wọlé, ó sì so ó mọ́ ìtàn tó ṣáájú. “Ó ní pé” jẹ́ ọ̀nà Yorùbá àdánidá láti ṣe iṣẹ́ yìí láìfi líle Gíríìkì mú un.
- source_word: Δεῖ
  choice: Ó di dandan
  rationale: Ó fi ìjẹ́dandan tó wà nínú ètò Ọlọ́run hàn, kì í ṣe pé ohun náà kàn yẹ tàbí rọrùn. Ó tún pa ìṣètò aláìlẹ́ni Gíríìkì mọ́ níwọ̀n tó ṣeé ṣe ní Yorùbá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù fi ń pe ara rẹ̀; ó pa ìtumọ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú lílò Bíbélì mìíràn mọ́.
- source_word: πολλὰ παθεῖν
  choice: jìyà ohun púpọ̀
  rationale: Ó ṣàfihàn ọ̀pọ̀lọpọ̀ ohun tí yóò mú ìyà wá, dípò kíkó gbogbo rẹ̀ jọ sí “jìyà púpọ̀” nìkan.
- source_word: ἀποδοκιμασθῆναι
  choice: kọ̀ ọ́ sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn aṣáájú yóò yẹ̀ ẹ́ wò, wọn yóò sì kọ̀ ọ́. “Kọ̀ ọ́ sílẹ̀” jẹ́ èdè Yorùbá tó ṣe kedere fún ìkọ̀sílẹ̀ bẹ́ẹ̀.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: àwọn alàgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé
  rationale: Àwọn orúkọ wọ̀nyí pa àwọn ẹgbẹ́ aṣáájú Júù mẹ́ta tí Gíríìkì dárúkọ mọ́, láìsọ wọn di ẹgbẹ́ kan ṣoṣo.
- source_word: ἀποκτανθῆναι
  choice: kí wọ́n pa á
  rationale: Yorùbá sábà máa ń fi ẹni tó ṣe ìṣe hàn níbi tí Gíríìkì ti lo ọ̀rọ̀ àìṣe. Àwọn aṣáájú tí a ṣẹ̀ṣẹ̀ dárúkọ ni àtẹ̀lé gírámà tó sún mọ́ ọn, ṣùgbọ́n gbólóhùn náà kò ṣàlàyé gbogbo àwọn aṣojú ikú náà.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún dative àkókò náà, ó sì pa ìlànà ọjọ́ kẹta mọ́.
- source_word: ἐγερθῆναι
  choice: kí a jí i dìde
  rationale: Ìṣètò yìí pa ìṣe tí a ṣe sí Ọmọ Ènìyàn mọ́, kò sì dárúkọ ẹni tó jí i dìde, gẹ́gẹ́ bí Gíríìkì ṣe lo passive.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ àjíǹde ní passive
  choice: kí a jí i dìde
  alternative: kí ó jí dìde
  rationale: Gíríìkì fi hàn pé a ṣe ìṣe náà sí i, ṣùgbọ́n kò dárúkọ olùṣe. Ìtumọ̀ yìí pa ìmọ̀ràn iṣẹ́ Ọlọ́run mọ́ láìfi orúkọ olùṣe kún ẹsẹ náà.
- issue: Agbára Δεῖ
  choice: Ó di dandan
  alternative: Ọmọ Ènìyàn ní láti
  rationale: Èyí pa ìjẹ́dandan nínú ètò ìràpadà Ọlọ́run àti ìṣètò aláìlẹ́ni ti Gíríìkì mọ́, láìṣàlàyé ohun tó fa dandan náà ju bí ẹsẹ ṣe sọ lọ.
- issue: Ta ni ó pa Ọmọ Ènìyàn?
  choice: kí wọ́n pa á
  alternative: kí a pa á
  rationale: Yorùbá nílò ìṣètò tó ṣe kedere ju passive Gíríìkì lọ. “Wọ́n” tọ́ka sí àwọn alatakò tí a dárúkọ ṣáájú, ṣùgbọ́n a kò fi ẹ̀bi náà lé ẹ̀yà ènìyàn kan tàbí kó gbogbo ìtàn ikú Jésù wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. “Ọmọ Ènìyàn,” “àwọn alàgbà,” “àwọn olórí àlùfáà,” àti “àwọn akọ̀wé” pa àwọn ọ̀rọ̀ oyè àti ẹgbẹ́ inú Ìhìn Rere mọ́.
