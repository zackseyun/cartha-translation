source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: yo
  text: Bí wọ́n sì ti ń lọ ní ojú ọ̀nà, ẹnì kan sọ fún un pé, “Èmi yóò tẹ̀lé ọ́ ní ibikíbi tí o bá lọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà sí i, “ní ibikíbi tí o bá lọ kúrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Bí wọ́n sì ti ń lọ
  rationale: Ọ̀rọ̀ alábápín tó wà nínú genitive absolute fi ìṣe tó ń lọ lọ́wọ́ ní àkókò kan náà hàn; èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ àkókò náà mọ́.
- source_word: ἐν τῇ ὁδῷ
  choice: ní ojú ọ̀nà
  rationale: Ó pa àyíká ìrìn-àjò gidi mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ láì mú ìtumọ̀ ìṣàpẹẹrẹ wọlé.
- source_word: εἶπέν τις
  choice: ẹnì kan sọ
  rationale: τις kò sọ ẹni náà di ọkùnrin tàbí ẹni pàtó; “ẹnì kan” pa àìsọ pàtó náà mọ́.
- source_word: πρὸς αὐτόν
  choice: sọ fún un
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún πρός lẹ́yìn ọ̀rọ̀-ìṣe sísọ.
- source_word: Ἀκολουθήσω σοι
  choice: Èmi yóò máa tọ̀ ọ́ lẹ́yìn
  rationale: Ó fi ìpinnu ọjọ́ iwájú hàn, ó sì pa ìtumọ̀ méjèèjì—títẹ̀lé ní ìrìn àti títẹ̀lé gẹ́gẹ́ bí ọmọ-ẹ̀yìn—mọ́ láì ṣàlàyé ju orísun lọ.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: ní ibikíbi tí o bá lọ
  rationale: “Ibikíbi ... bá” fi ìbátan àìlópin ὅπου ἐάν pẹ̀lú subjunctive hàn; “lọ” jẹ́ àdánidá ní àyíká yìí, bí ó tilẹ̀ jẹ́ pé ἀπέρχομαι tún lè túmọ̀ sí kúrò tàbí lọ kúrò.
theological_decisions:
- issue: Ìtumọ̀ jíjìn ti ọmọ-ẹ̀yìn nínú ἀκολουθέω
  choice: tọ̀ ọ́ lẹ́yìn
  alternative: di ọmọ-ẹ̀yìn rẹ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ títẹ̀lé gẹ́gẹ́ bí ọmọ-ẹ̀yìn nínú Lúùkù, ṣùgbọ́n “tọ̀ ọ́ lẹ́yìn” pa ìtumọ̀ ìrìn gidi àti ti ọmọ-ẹ̀yìn mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. “Ẹnì kan” kò fi akọ tàbí abo kún orísun; “tọ̀ ọ́ lẹ́yìn” sì pa àwọ̀ ìtumọ̀ ọmọ-ẹ̀yìn mọ́.
