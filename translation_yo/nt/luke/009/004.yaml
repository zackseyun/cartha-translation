  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: yo
  text: Ilé yòówù tí ẹ bá wọ̀, ẹ dúró síbẹ̀, kí ẹ sì jáde kúrò níbẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκίαν
  choice: ilé
  rationale: “Ilé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ilé tí a wọ̀, ó sì lè tọ́ka sí agbo ilé tàbí àwọn ará ilé gẹ́gẹ́ bí àyíká ṣe béèrè.
- source_word: μένετε
  choice: ẹ dúró síbẹ̀
  rationale: Ó mú ìtumọ̀ pé kí wọ́n máa gbé tàbí dúró ní ilé náà fún àkókò iṣẹ́ wọn, láìfi ìtumọ̀ míì kún un.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: láti ibẹ̀ náà ni kí ẹ sì ti jáde
  rationale: 'Ó pa ìtẹnumọ́ orísun ìjáde mọ́: ilé kan náà tí wọ́n dúró sí ni kí wọ́n ti jáde nígbà tí wọ́n bá ń lọ.'
