translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn “ẹ” bá ẹni tí Jesu ń bá sọ mu.
