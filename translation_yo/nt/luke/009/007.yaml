  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: yo
  text: Hẹ́rọ́dù, alákòóso ìpín mẹ́rin náà, gbọ́ nípa gbogbo ohun tí ń ṣẹlẹ̀, ó sì dàrú nítorí àwọn kan ń sọ pé a ti jí Jòhánù dìde kúrò láàárín àwọn òkú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jòhánù ti jí dìde kúrò láàárín àwọn òkú.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí passive; ní tààràtà, “a ti jí i dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: gbọ́ nípa
  rationale: Ní Yorùbá, “gbọ́ nípa” fi hàn ní ti ẹ̀dá pé Hẹ́rọ́dù gba ìròyìn nípa àwọn ìṣẹ̀lẹ̀ náà, kì í ṣe pé ó kàn gbọ́ ohùn.
- source_word: δὲ
  choice: a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: δέ jẹ́ àsopọ̀ ìtàn tó rọrùn níbí; bí a ṣe bẹ̀rẹ̀ gbólóhùn náà pẹ̀lú Hẹ́rọ́dù ń jẹ́ kí ìtàn náà tẹ̀ síwájú láìfi ìyàtọ̀ tàbí àkókò tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: ὁ τετραάρχης
  choice: tetrarki
  rationale: A pa orúkọ ipò ìṣèlú ìtàn náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àyálò, dípò fífi “ọba” tàbí “alákòóso” lásán rọ́pò rẹ̀, èyí tí yóò sọ ìtumọ̀ rẹ̀ di gbòòrò jù.
- source_word: τὰ γινόμενα πάντα
  choice: gbogbo ohun tí ń ṣẹlẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìṣe tó ń lọ lọ́wọ́ inú participle náà mọ́.
- source_word: διηπόρει
  choice: ọ̀rọ̀ náà sì rú u lójú
  rationale: Àpólà Yorùbá yìí túmọ̀ ipò àìmọ̀ àti ìdàrúdàpọ̀ ọkàn tí διαπορέω ń tọ́ka sí ní èdè tó ṣe kedere fún òǹkàwé òde òní.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: nítorí àwọn kan ń sọ pé
  rationale: Ó sọ ìdí náà ní Yorùbá tó rọ̀, ó sì pa ẹni tí a kò dárúkọ ní pàtó—“àwọn kan”—mọ́.
- source_word: ἠγέρθη
  choice: a ti jí Jòhánù dìde
  rationale: Ìlò “a” aláìdárúkọ pa ìṣe àìṣe-láti-ọ̀dọ̀ ẹni tí a dárúkọ (passive) mọ́, láìsọ ẹni tó jí i dìde.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí pa àwòrán Gíríìkì “láti àárín àwọn òkú” mọ́, ó sì ṣì ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ọ̀rọ̀ àjíǹde nínú ìròyìn nípa Jòhánù
  choice: a ti jí Jòhánù dìde kúrò láàárín àwọn òkú
  alternative: Jòhánù ti jí dìde kúrò láàárín àwọn òkú
  rationale: Gíríìkì lo fáàbù passive ἠγέρθη. Àyànfẹ́ náà pa ìrísí passive mọ́, láìyanju ẹni tó ṣe ìṣe náà; àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá intransitive tí ó wọ́pọ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Tetrarki” jẹ́ orúkọ ipò ìtàn àyálò; àwọn gbólóhùn yòókù jẹ́ ti Yorùbá àdánidá òde òní. A gbe àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ àjíǹde tí àlàyé náà ń ṣàlàyé.
