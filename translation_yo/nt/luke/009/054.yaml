  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn náà, Jákọ́bù àti Jòhánù, rí èyí, wọ́n wí pé, “Olúwa, ṣé o fẹ́ kí a sọ pé[a] kí iná sọ̀kalẹ̀ láti ọ̀run, kí ó sì jó wọn run?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “kí a pàṣẹ kí iná sọ̀kalẹ̀ láti ọ̀run, kí ó sì pa wọ́n run,” tàbí, “kí a pe iná láti ọ̀run wá pa wọ́n run.” Gíríìkì sọ ní tààrà pé, “kí a sọ pé kí iná sọ̀kalẹ̀ láti ọ̀run, kí ó sì jẹ wọ́n run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí ... rí èyí
  rationale: A tú apólówó aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu. A fi ‘èyí’ kún un láti tọ́ka sí bí àwọn ará Samáríà ṣe kọ̀ láti gba Jésù ní ẹsẹ tó ṣáájú, bó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ohun tí wọ́n rí ní tààrà.
- source_word: δὲ
  choice: a fi ìtumọ̀ rẹ̀ sínú ‘Nígbà tí’
  rationale: Níbi yìí, δέ ń so ìṣẹ̀lẹ̀ tuntun mọ́ ohun tó ṣáájú; Yorùbá àdánidá kò nílò kí a tú u sí ọ̀rọ̀ ọ̀tọ̀.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: àwọn ọmọ-ẹ̀yìn náà, Jákọ́bù àti Jòhánù
  rationale: Àfikún orúkọ méjèèjì fi hàn pé Jákọ́bù àti Jòhánù ni àwọn ọmọ-ẹ̀yìn tí a ń sọ̀rọ̀ nípa wọn.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ọ̀rọ̀ Yorùbá tó yẹ fún κύριος gẹ́gẹ́ bí ọ̀rọ̀ ìkíni tààrà sí Jésù ní àyíká yìí.
- source_word: θέλεις
  choice: ṣé o fẹ́
  rationale: Ìtumọ̀ rẹ̀ níbí ni ìfẹ́ tàbí ìfọwọ́sí; ọ̀nà yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: εἴπωμεν
  choice: kí a sọ pé
  rationale: A pa ìtumọ̀ ìpìlẹ̀ λέγω, ‘sọ,’ mọ́ dípò fífi ọ̀rọ̀ tó lágbára bí ‘pàṣẹ’ sínú ẹsẹ náà. Àkópọ̀ rẹ̀ pẹ̀lú gbólóhùn tó tẹ̀ lé e ṣì fi hàn pé àwọn ọmọ-ẹ̀yìn ń béèrè láti pe ìdájọ́ iná wá.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: kí iná sọ̀kalẹ̀ láti ọ̀run
  rationale: Èyí pa àwòrán iná tó ń sọ̀kalẹ̀ láti ọ̀run mọ́, ó sì tẹ̀ lé ìṣètò gbólóhùn Yorùbá tó mọ́gbọ́n dání.
- source_word: ἀναλῶσαι
  choice: kí ó sì jó wọn run
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘run’ tàbí ‘jẹ run.’ Nítorí iná ni kókó ọ̀rọ̀, ‘jó wọn run’ jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ìparun nípasẹ̀ iná mọ́.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ènìyàn abúlé Samáríà tí a mẹ́nu kàn ṣáájú.
theological_decisions:
- issue: Ohun tí àwọn ọmọ-ẹ̀yìn rí
  choice: A fi ‘èyí’ kún un láti tọ́ka sí ìkọ̀sílẹ̀ àwọn ará Samáríà.
  alternative: ‘Nígbà tí ... rí i’ tàbí ‘Bí ... ti rí’ láìsọ ohun tí wọ́n rí.
  rationale: Gíríìkì kò ní ohun tí ἰδόντες gbà gẹ́gẹ́ bí àfẹ̀yìntì ní tààrà. ‘Èyí’ mú ìsopọ̀ pẹ̀lú ẹsẹ tó ṣáájú kedere láìfi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Agbára ọ̀rọ̀ ìbéèrè àwọn ọmọ-ẹ̀yìn
  choice: ‘kí a sọ pé kí iná sọ̀kalẹ̀’
  alternative: ‘kí a pàṣẹ fún iná pé kí ó sọ̀kalẹ̀’ tàbí ‘kí a pe iná sọ̀kalẹ̀’
  rationale: Gíríìkì lo λέγω (‘sọ’), kì í ṣe ọ̀rọ̀ pàtó fún ‘pàṣẹ.’ A pa ọ̀rọ̀ yẹn mọ́ ní ojú ìwé, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ àdánidá míì hàn, láìdín ìfẹ́ wọn láti pe ìdájọ́ ọ̀run wá kù.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ṣé o fẹ́’ jẹ́ ọ̀nà àdánidá fún ìbéèrè; ‘wọ́n wí pé’ sì ń pa ìrísí ìtàn mímọ́ tó ní iyì mọ́. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbogbo ọ̀rọ̀ tí àlàyé náà kan.
