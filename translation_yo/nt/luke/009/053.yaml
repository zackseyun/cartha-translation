source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: yo
  text: Wọ́n kò sì gbà á[a], nítorí pé ojú rẹ̀ ń dojú kọ Jerúsálẹ́m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kò tẹ́wọ́ gbà á,” tàbí “wọ́n kò gbà á gẹ́gẹ́ bí àlejò.” Ó ṣeé ṣe kí ọ̀rọ̀ náà níhìn-ín tọ́ka sí kíkọ̀ láti ṣe àlejò rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “ojú rẹ̀ ń lọ sí Jerúsálẹ́m.” Àkànlò èdè náà fi ìdarí ìrìn rẹ̀ sí Jerúsálẹ́m hàn, ó sì lè tún fi ìfọkànsìn rẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: gbà á
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí gbígba, títẹ́wọ́ gbà, tàbí gbígba ẹnì kan sílé. “Gbà á” pa ìtumọ̀ pàtàkì rẹ̀ mọ́, ó sì bá àyíká tí àwọn ará abúlé kọ̀ láti tẹ́wọ́ gba Jésù mu.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: ó dojú ìrìn àjò rẹ̀ kọ
  rationale: Ní ti gidi, ọ̀rọ̀ Gíríìkì sọ nípa “ojú rẹ̀.” Gbólóhùn Yorùbá yìí pa àwòrán dídarí ojú àti ìrìn àjò sí ibi kan mọ́ láì mú kí ẹsẹ náà dà bí èdè àjèjì.
- source_word: ἦν πορευόμενον
  choice: ó dojú ìrìn àjò rẹ̀ kọ
  rationale: Ìkọ́lé ọ̀rọ̀ náà fi ìlọsíwájú ìrìn hàn. A kò fi “pinnu” kún un ní tààràtà, kí a má bàa yanju bóyá gbólóhùn náà ń tẹnumọ́ ìpinnu tàbí ibi tí ìrìn náà ń lọ.
- source_word: εἰς Ἰερουσαλήμ
  choice: kọ Jerúsálẹ́m
  rationale: “Kọ” lẹ́yìn “dojú ... kọ” fi ìdarí sí Jerúsálẹ́m hàn ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ṣàlàyé ìdí tí wọn kò fi gba Jésù.
theological_decisions:
- issue: Agbára àkànlò èdè “ojú rẹ̀ ń lọ sí Jerúsálẹ́m”
  choice: Ṣe é ní “ó dojú ìrìn àjò rẹ̀ kọ Jerúsálẹ́m,” tí ó fi ìdarí ìrìn náà hàn, tó sì tún pa àwòrán “dojú kọ” mọ́.
  alternative: “Ojú rẹ̀ ń lọ sí Jerúsálẹ́m” tàbí “ó pinnu láti lọ sí Jerúsálẹ́m.”
  rationale: Àṣàyàn náà yàgò fún Yorùbá tí kò wọ́pọ̀ nínú ìtumọ̀ gidi-gidi, kò sì fi “ó pinnu” sínú ọ̀rọ̀ bí ẹni pé ìtumọ̀ yẹn nìkan ló ṣeé ṣe. Ó pa ìfọkànsìn àti ìdarí sí Jerúsálẹ́m mọ́ láì ṣàlàyé ẹ̀kọ́ ìgbàgbọ́ sí i.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. “Gbà á” rọrùn fún òǹkàwé òde òní, “ó dojú ìrìn àjò rẹ̀ kọ” sì jẹ́ ọ̀rọ̀ àdánidá tí ó ní iyì, tí kò sọ àkànlò Gíríìkì di aláìlóye.
