lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó pa ìsopọ̀ ìtàn rírọrùn mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: ἐπορεύθησαν
  choice: wọ́n lọ
  rationale: Ọ̀rọ̀-ìṣe πορεύομαι túmọ̀ sí lílọ tàbí rírìn-àjò; “wọ́n lọ” jẹ́ ọ̀nà àdánidá, kedere ní Yorùbá fún ìṣípò lọ sí ibòmíràn.
- source_word: εἰς
  choice: sí
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìṣípò, εἰς ń tọ́ka sí ibi tí wọ́n ń lọ; “sí” ni ìbámu Yorùbá tó ṣe déédé.
- source_word: ἑτέραν
  choice: mìíràn
  rationale: ἕτερος lè túmọ̀ sí ohun mìíràn tàbí ohun tó yàtọ̀; “mìíràn” jẹ́ èdè àdánidá, ó sì pa ààyè ìtumọ̀ méjèèjì mọ́ ní àyíká yìí.
- source_word: κώμην
  choice: abúlé
  rationale: κώμη ń tọ́ka sí ìletò kékeré ju ìlú ńlá lọ; “abúlé” ni ọ̀rọ̀ Yorùbá tó péye jù.
