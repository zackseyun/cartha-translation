  to: Gbogbo wọn sì jẹun, wọ́n sì yó. A sì kó àwọn àjẹkù[b] tí ó ṣẹ́ kù fún wọn jọ[a], ó sì kún agbọ̀n méjìlá.
  rationale: A rọ́pò ìpèníjà “ó tó agbọ̀n méjìlá” pẹ̀lú “ó sì kún agbọ̀n méjìlá” kí ìtumọ̀ náà lè fi hàn kedere pé àwọn àjẹkù tí a kó jọ ni ó kún agbọ̀n méjìlá. A pa ìtumọ̀ àìdánilójú αὐτοῖς (“fún wọn”) mọ́, a sì dá àwọn àmì ìsàlẹ̀ àti ìtumọ̀ wọn dúró.
