base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: yo
  text: Gbogbo wọn sì jẹun, wọ́n sì yó. A sì kó àwọn àjẹkù[b] tí ó ṣẹ́ kù fún wọn jọ[a], ó sì kún agbọ̀n méjìlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ἤρθη sí “A sì gbé ... sókè.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn, àwọn ẹ̀yà tí a bù; tàbí “àwọn ẹ̀yà kéékèèké.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: jẹun
  rationale: Ọ̀rọ̀-ìṣe aorist náà sọ ìṣẹ̀lẹ̀ náà ní tààrà; “jẹun” jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n jẹ oúnjẹ.
- source_word: ἐχορτάσθησαν
  choice: wọ́n sì yó
  rationale: “Yó” túmọ̀ sí pé oúnjẹ tó wọn, wọ́n sì jẹ títí wọ́n fi ní ìtẹ́lọ́rùn; ó jẹ́ Yorùbá àdánidá ju ìtumọ̀ líle bí “a sì kún wọn” lọ.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé gbogbo àwọn tó wà níbẹ̀ ló jẹ.
- source_word: ἤρθη
  choice: A sì kó ... jọ
  rationale: Ìlò aláìlórúkọ ẹni tó ṣe iṣẹ́ náà (“A sì ...”) mú ohùn àìṣe Gíríìkì jáde ní Yorùbá àdánidá; “kó ... jọ” bá ọ̀rọ̀ kíkó àjẹkù mu.
- source_word: τὸ περισσεῦσαν
  choice: tí ó ṣẹ́ kù
  rationale: Ó fi ìtumọ̀ ohun tó ṣẹ́ kù lẹ́yìn tí gbogbo wọn jẹ hàn ní kedere.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó pa dative Gíríìkì tí kò ṣe kedere pátápátá mọ́, láì yí i sí “láti ọ̀dọ̀ wọn” tàbí “nípasẹ̀ wọn” láìní ẹ̀rí tó tó.
- source_word: κλασμάτων
  choice: àwọn àjẹkù
  rationale: “Àjẹkù” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn ẹ̀yà oúnjẹ tí ó ṣẹ́ kù; àlàyé ìsàlẹ̀ fi ìtumọ̀ “ẹ̀yà tí a bù” hàn.
- source_word: κόφινοι δώδεκα
  choice: ó tó agbọ̀n méjìlá
  rationale: Ó sọ iye náà ní Yorùbá àdánidá, láì fi ohun èlò tí a fi ṣe agbọ̀n kún ohun tí orísun kò tẹnumọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, àdánidá. A lo gbolohun aláìlórúkọ ẹni “A sì kó ... jọ” láti ṣe àfihàn passive Gíríìkì láì jẹ́ kí èdè náà le.
