id: LUK.9.45
reference: Luke 9:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: yo
  text: Ṣùgbọ́n wọn kò lóye ọ̀rọ̀ yìí[a]; a sì ti fi í pamọ́ fún wọn, kí wọn má bàa mọ̀ ọ́n[b]. Ẹ̀rù sì ń bà wọ́n láti béèrè lọ́wọ́ rẹ̀ nípa ọ̀rọ̀ yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọ̀rọ̀” (ῥῆμα) tún lè túmọ̀ sí “ohun tí ó sọ,” “gbólóhùn,” tàbí “ọ̀ràn.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì sọ pé “a ti fi í pamọ́ fún wọn,” ṣùgbọ́n kò dárúkọ ẹni tó fi í pamọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: wọn kò lóye
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí pé wọn kò lè lóye ohun tí Jésù sọ, kì í ṣe pé wọn kò gbọ́ ọ̀rọ̀ náà rárá.
- source_word: ῥῆμα
  choice: ọ̀rọ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí ọ̀rọ̀ pàtó tí Jésù ṣẹ̀ṣẹ̀ sọ. “Ọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá, ó sì lè gba ìtumọ̀ gbólóhùn tàbí ọ̀ràn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
- source_word: παρακεκαλυμμένον
  choice: a ti fi í pamọ́
  rationale: Èyí pa ìtumọ̀ ohun tí a fi pamọ́ mọ́, ó sì lo “a” aláìdárúkọ kí a má ṣe fi ẹni tó ṣe é kún ohun tí ẹsẹ náà sọ.
- source_word: ἀπ’ αὐτῶν
  choice: fún wọn
  rationale: Nínú àkópọ̀ Yorùbá “fi ohun pamọ́ fún ẹnìkan,” “fún wọn” sọ pé a kò jẹ́ kí wọn rí tàbí mọ ohun náà, ó sì jẹ́ ọ̀nà àdánidá láti gbé ἀπό jáde ní àyíká yìí.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: kí wọn má bàa mọ̀ ọ́n
  rationale: “Mọ̀ ọ́n” gbé ìtumọ̀ rí i tàbí mọ ohun tí ọ̀rọ̀ náà túmọ̀ sí jáde, ó sì yà díẹ̀ sí “lóye” tí a lò fún ἠγνόουν.
- source_word: ἐφοβοῦντο
  choice: ẹ̀rù sì ń bà wọ́n
  rationale: Ìkọ́ yìí jẹ́ èdè Yorùbá àdánidá fún ìbẹ̀rù tí ó ń bá a lọ, gẹ́gẹ́ bí àkókò imperfect ṣe fi hàn.
- source_word: ἐρωτῆσαι
  choice: láti béèrè lọ́wọ́ rẹ̀
  rationale: Èyí sọ ní kedere àti ní èdè Yorùbá àdánidá pé wọn bẹ̀rù láti bi Jésù ní ìbéèrè nípa ọ̀rọ̀ náà.
theological_decisions:
- issue: Ẹni tó fi ọ̀rọ̀ náà pamọ́ fún wọn
  choice: 'A pa ìṣe náà mọ́ láìdárúkọ ẹni tó ṣe é: “a sì ti fi í pamọ́ fún wọn.”'
  alternative: Kí a sọ pé Ọlọ́run ló fi í pamọ́, tàbí kí a sọ pé ọ̀rọ̀ náà kàn ṣókùnkùn sí wọn.
  rationale: Ìkọ́ Gíríìkì jẹ́ passive, kò sì dárúkọ ẹni tó ṣe ìṣe náà. Lílo “a” aláìdárúkọ ní Yorùbá pa àìdájú àti ìfọ̀kànsìn ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ láìfi olùṣe kan kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà tó mọ́gbọ́n dání, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn gbólóhùn “wọn kò lóye,” “ẹ̀rù ń bà wọ́n,” àti “béèrè lọ́wọ́ rẹ̀” jẹ́ àdánidá ní Yorùbá, nígbà tí “a ti fi í pamọ́” pa passive aláìdárúkọ ti Gíríìkì mọ́.
