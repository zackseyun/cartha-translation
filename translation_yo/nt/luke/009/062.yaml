id: LUK.9.62
reference: Luke 9:62
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ pé, “Ẹnikẹ́ni tí ó bá ti fi ọwọ́ rẹ̀ lé ohun ìtúlẹ̀, tí ó sì ń wo ẹ̀yìn, kò yẹ fún ìjọba Ọlọ́run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò bá ìjọba Ọlọ́run mu,” tàbí “kò wúlò fún ìjọba Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí jíjẹ́ ẹni tí ó yẹ, tí ó bá ohun kan mu, tàbí tí ó wúlò fún ète kan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ oníwọ̀nba hàn láàárín ọ̀rọ̀ Jésù àti ohun tí ẹni náà ṣẹ̀ṣẹ̀ sọ.
- source_word: Οὐδεὶς
  choice: Ẹnikẹ́ni ... kò
  rationale: Ìṣètò àtakò yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ náà mọ́ pé kò sí ẹnikẹ́ni tí a yọ sílẹ̀.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: tí ó bá ti fi ọwọ́ lé ohun ìtúlẹ̀
  rationale: Ó pa àwòrán iṣẹ́ àgbẹ̀ àti ìgbésẹ̀ ìbẹ̀rẹ̀ iṣẹ́ ìtúlẹ̀ mọ́; ‘bá ti’ tún fi hàn pé ó ti bẹ̀rẹ̀ ṣáájú wíwo ẹ̀yìn.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: tí ó sì ń wo ẹ̀yìn
  rationale: ‘Ń wo’ mú ìṣe tí ń bá a lọ tàbí ìwà tí ó ń ṣe déédéé jáde, láìyí àwòrán náà sí ‘padà sẹ́yìn.’
- source_word: εὔθετός
  choice: yẹ
  rationale: Ní àyíká yìí ‘yẹ fún’ túmọ̀ sí pé ẹni náà bá ohun kan mu tàbí pé ó péye fún un; kò fi dandan túmọ̀ sí yíyẹ nípa ìwà tàbí ìgbàlà.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: fún ìjọba Ọlọ́run
  rationale: Dative náà bá ‘yẹ fún’ mu, ‘ìjọba Ọlọ́run’ sì jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Ìtumọ̀ εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: kò yẹ fún ìjọba Ọlọ́run
  alternative: kò wúlò nínú iṣẹ́ ìjọba Ọlọ́run; kò yẹ láti wọ ìjọba Ọlọ́run
  rationale: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ìkìlọ̀ nípa bí ẹni ṣe bá ìjọba Ọlọ́run mu àti ìfọkànsìn aláìpín, láìdá a lójú pé ó ń sọ ní pàtó nípa ìwọlé sínú ìjọba tàbí ìpò ìgbàlà ìkẹyìn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti èyí tí ó ṣeé lóye ni a lò. ‘Ohun ìtúlẹ̀’ jẹ́ kedere sí òǹkàwé lásán ju ọ̀rọ̀ àkànṣe iṣẹ́ àgbẹ̀ lọ, ‘tí ó bá ti fi ọwọ́ lé’ sì pa àwòrán mímú iṣẹ́ ìtúlẹ̀ bẹ̀rẹ̀ mọ́. A gbe àmì àlàyé [a] sí òpin gbólóhùn tí ó kan.
