language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: yo
  text: Sì wò ó, ọkùnrin kan láti inú ogunlọ́gọ̀ náà ké jáde, ó ní, “Olùkọ́, mo bẹ̀ ọ́, bojú wo ọmọkùnrin mi, nítorí òun ni ọmọ kan ṣoṣo tí mo ní.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun ni ọmọkùnrin kan ṣoṣo tí mo ní.” Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ ní tààrà sí ẹni “kan ṣoṣo/àrà ọ̀tọ̀” fún mi. Níwọ̀n bí a ti sọ tẹ́lẹ̀ pé ọmọkùnrin ni, ìtumọ̀ méjèèjì ṣeé ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ipa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ohun tí ń fa àfiyèsí sí ìṣẹ̀lẹ̀ tuntun nínú ìtàn, ní èdè Yorùbá tí ó ṣeé lóye.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Ó fi hàn ní pàtó pé ọkùnrin ni, bí ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: láti inú ogunlọ́gọ̀ náà
  rationale: Ó túmọ̀ sí pé ọkùnrin náà jẹ́ ọ̀kan lára àwọn ènìyàn tí ó péjọ.
- source_word: ἐβόησεν
  choice: ké jáde
  rationale: Ó mú ohùn gíga àti ìkánjú ẹ̀bẹ̀ ọkùnrin náà jáde.
- source_word: λέγων
  choice: pé
  rationale: Ìsopọ̀ àdánidá ni èyí fún fífi ọ̀rọ̀ tààrà bẹ̀rẹ̀ ní Yorùbá, láìjẹ́ kí gbolohun náà wuwo.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ìtumọ̀ tààrà tí ó wọ́pọ̀ fún ẹni tí ń kọ́ni ni, láìfi ìtumọ̀ ‘ọ̀gá’ kún un.
- source_word: δέομαί σου
  choice: mo bẹ̀ ọ́
  rationale: Ó fi ẹ̀bẹ̀ líle àti ìkánjú hàn, ju ìbéèrè lásán lọ.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: bojú wo
  rationale: Ní Yorùbá, ‘bojú wo’ lè túmọ̀ sí kí ẹni fi àfiyèsí àti àánú tọ́jú ọ̀ràn ẹnì kan, kì í ṣe wíwo lásán.
- source_word: τὸν υἱόν μου
  choice: ọmọkùnrin mi
  rationale: Ó pa ìtọ́kasí sí ọmọ tí ó jẹ́ akọ mọ́ ní kedere.
- source_word: μονογενής
  choice: ọmọ kan ṣoṣo tí mo ní
  rationale: Ó fi ìtumọ̀ pé ọmọ náà ni àtọmọdọ́mọ rẹ̀ kan ṣoṣo hàn, nígbà tí ‘ọmọkùnrin’ tí a ti sọ tẹ́lẹ̀ ń pa akọ rẹ̀ mọ́.
- source_word: μοί ἐστιν
  choice: tí mo ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìní tí dátífù pẹ̀lú εἰμί ń fi hàn.
theological_decisions:
- issue: Bóyá μονογενής túmọ̀ sí ọmọ rẹ̀ kan ṣoṣo tàbí ọmọkùnrin rẹ̀ kan ṣoṣo
  choice: ọmọ kan ṣoṣo tí mo ní
  alternative: ọmọkùnrin kan ṣoṣo tí mo ní
  rationale: Níwọ̀n bí a ti pè é ní ‘ọmọkùnrin mi’ tẹ́lẹ̀, ọ̀rọ̀ yìí tẹnu mọ́ pé òun nìkan ni ọmọ ọkùnrin náà ní; síbẹ̀, ọ̀nà kejì tún ṣeé ṣe nítorí pé ọmọ náà ti jẹ́ mímọ̀ sí akọ nínú àyíká ọ̀rọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. ‘Sì kíyèsí i’ ń pa àwọ̀ ìtàn Lúùkù mọ́; ‘bojú wo’ sì ń sọ àfiyèsí oníàánú ju wíwo ojú lásán lọ. Àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
