source:
  edition: SBLGNT
  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n kún fún ìbínú aṣiwèrè[a], wọ́n sì ń bá ara wọn jíròrò ohun tí wọ́n lè ṣe sí Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kún fún ìwèrè” tàbí “wọ́n kún fún ìwà òmùgọ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àìní làákàyè, ìwà òmùgọ̀, tàbí ìwèrè.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́ nínú Gíríìkì, ó sì fi àwọn alátakò wọ̀nyí ṣe ìyàtọ̀ sí Jésù àti ẹni tí a mú lára dá. Nínú Yorùbá, ‘wọ́n’ pẹ̀lú ‘Ṣùgbọ́n’ sọ ìyàtọ̀ náà ní ọ̀nà àdánidá láìfi ọ̀rọ̀ líle kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìhùwàsí wọn ṣe ìyàtọ̀ sí ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe; ‘Ṣùgbọ́n’ mú agbára ìtakora náà jáde lọ́nà àdánidá.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: wọ́n kún fún ìbínú tí kò mọ́gbọ́n dání
  rationale: A pa àwòrán ọ̀rọ̀ náà mọ́ pé ohun kan ‘kún’ inú wọn. ἄνοια túmọ̀ sí àìní làákàyè, ìwà òmùgọ̀, tàbí ìhùwàsí bí ẹni tí kò mọ ohun tó ń ṣe; nínú àyíká ọ̀rọ̀ yìí, ó jẹ́ ìbínú ọ̀tá tí kò mọ́gbọ́n dání, kì í ṣe àpèjúwe àìsàn ọpọlọ.
- source_word: διελάλουν
  choice: wọ́n sì ń bá ara wọn jíròrò
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi hàn pé wọ́n ń bá ìfọ̀rọ̀wérọ̀ àti ìgbìmọ̀ wọn lọ; ‘ń bá ara wọn jíròrò’ jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Ó fi ìfọ̀rọ̀wérọ̀ láàárín wọn hàn, ó sì bá ‘jíròrò’ mu lọ́nà àdánidá.
- source_word: τί ἂν ποιήσαιεν
  choice: ohun tí wọ́n lè ṣe
  rationale: τί pẹ̀lú ἄν àti ọ̀rọ̀-ìṣe optative fi ìṣírò ohun tó ṣeé ṣe hàn. ‘Ohun tí wọ́n lè ṣe’ pa ìdánilójú tí kò pé náà mọ́, láìsọ ọ́ di ohun tí ó yẹ kí wọ́n ṣe.
- source_word: τῷ Ἰησοῦ
  choice: sí Jésù
  rationale: Dative náà tọ́ka sí ẹni tí ìṣe tí wọ́n ń rò yóò kàn. ‘Sí Jésù’ pa ọ̀rọ̀ Gíríìkì mọ́ láìfi ‘lòdì sí’ kún un, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi ète búburú wọn hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀνοίας láìsọ àwọn alátakò di aláìsàn ọpọlọ tàbí láìsọ agbára ìbínú inú àyíká ọ̀rọ̀ di kékeré
  choice: ìbínú tí kò mọ́gbọ́n dání
  alternative: wèrè; ìwà òmùgọ̀
  rationale: Yíyan ọ̀rọ̀ yìí pa àìní làákàyè àti agbára ìbínú ọ̀tá wọn mọ́, ṣùgbọ́n kò fi ìtumọ̀ ìṣègùn òde òní sí ‘wèrè.’ Ẹsẹ̀ náà ń ṣàpèjúwe ìhùwàsí tí kò mọ́gbọ́n dání lẹ́yìn ìwòsàn ọjọ́ Ìsinmi, kì í ṣe ìdánilẹ́kọ̀ọ́ nípa àìsàn ọpọlọ.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtumọ̀ àìdánilójú àti àwòrán ‘kún fún’ inú Gíríìkì mọ́.
