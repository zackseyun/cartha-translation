  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan lára àwọn Farisí wí pé, “Èé ṣe tí ẹ fi ń ṣe ohun tí kò bófin mu ní ọjọ́ Ìsinmi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: àwọn kan
  rationale: Ó tọ́ka sí díẹ̀ lára ẹgbẹ́ àwọn Farisí, kì í ṣe gbogbo wọn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí ìṣe tí a ṣàpèjúwe nínú ẹsẹ tó ṣáájú, ó sì mú ìdojúkọ náà wọlé lọ́nà àdánidá.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Èyí ni ìkọ̀wé orúkọ ẹgbẹ́ Júù náà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: εἶπαν
  choice: wí pé
  rationale: Aorist náà sọ ìṣẹ̀lẹ̀ ọ̀rọ̀ náà ní ṣókí; “wí pé” bá ìtàn mímọ́ tí ó ní iyì mu.
- source_word: Τί ποιεῖτε
  choice: Èé ṣe tí ẹ fi ń ṣe
  rationale: Bí ó tilẹ̀ jẹ́ pé Τί lè túmọ̀ sí “kí ni,” nínú ìbéèrè ìtakò yìí ó ní agbára “kí ló dé/èé ṣe,” present ποιεῖτε sì ń tọ́ka sí ìṣe tí ń lọ lọ́wọ́.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ohun tí kò bófin mu
  rationale: Ó pa ìtumọ̀ ohun tí òfin tàbí àṣà ẹ̀sìn kò fàyè gba mọ́, ní èdè Yorùbá àdánidá.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ Ìsinmi
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ plural, ó jẹ́ àṣà ọ̀rọ̀ Gíríìkì tó wọ́pọ̀ fún ọjọ́ Sábáàtì; singular Yorùbá ni ó sọ ìtumọ̀ náà kedere láì dá òye rú.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ Sábáàtì plural náà
  choice: ní ọjọ́ Ìsinmi
  alternative: ní àwọn ọjọ́ Ìsinmi
  rationale: τοῖς σάββασιν jẹ́ plural ní ìrísí, ṣùgbọ́n ó lè ṣiṣẹ́ gẹ́gẹ́ bí àṣà ọ̀rọ̀ fún ọjọ́ Sábáàtì kan. Yorùbá singular jẹ́ àdánidá jù, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn. “Àwọn Farisí” àti “ọjọ́ Ìsinmi” tẹ̀ lé àwọn ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa.
