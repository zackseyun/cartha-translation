id: LUK.6.48
reference: Luke 6:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: yo
  text: Ó dàbí ọkùnrin kan tí ń kọ́ ilé[a], ẹni tí ó walẹ̀ jinlẹ̀, tí ó sì fi ìpìlẹ̀ lélẹ̀ lórí àpáta. Nígbà tí ìkún omi sì dé, odò náà kọlu ilé yẹn, kò sì lè mì í, nítorí a ti kọ́ ọ dáadáa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnì kan.” Ọ̀rọ̀ Gíríìkì náà lo akọ ẹyọ “ọkùnrin” gẹ́gẹ́ bí ẹni aṣojú nínú ìfiwéra náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Ó dàbí
  rationale: Ọ̀nà àdánidá ní Yorùbá láti sọ ìfiwéra tààrà nínú àkàwé.
- source_word: ἀνθρώπῳ
  choice: ọkùnrin kan
  rationale: Ó pa àpẹẹrẹ akọ ẹyọ kan tí ọ̀rọ̀ Gíríìkì lò mọ́, láì sọ agbára aṣojú àkàwé náà nù.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: tí ń kọ́ ilé
  rationale: Gbólóhùn Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ tí ń lọ lọ́wọ́ mu.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: ó walẹ̀ jinlẹ̀
  rationale: Ó ṣàkópọ̀ àwọn ọ̀rọ̀-ìṣe méjèèjì lọ́nà àdánidá, ó sì pa ìtẹnumọ́ ijinlẹ̀ ìwalẹ̀ mọ́.
- source_word: ἔθηκεν θεμέλιον
  choice: fi ìpìlẹ̀ lélẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi foundation ilé sílẹ̀.
- source_word: ἐπὶ τὴν πέτραν
  choice: lórí àpáta
  rationale: Ó pa àwòrán àpáta gẹ́gẹ́ bí ohun tí ìpìlẹ̀ dúró lé mọ́, láì túmọ̀ rẹ̀ sí bedrock ní pàtó.
- source_word: πλημμύρης δὲ γενομένης
  choice: Nígbà tí ìkún omi sì dé
  rationale: Ó fi ipò àkókò tí genitive absolute náà ń tọ́ka sí hàn ní Yorùbá tó rọrùn.
- source_word: προσέρηξεν ὁ ποταμὸς
  choice: odò náà ru lu
  rationale: “Ru lu” ń fi agbára ìkọlù omi hàn ju “lu” lásán lọ, ó sì bá àyíká ìkún omi mu.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν
  choice: kò sì lè mì í
  rationale: Ó pa àìlágbára láti mì tàbí yí ilé náà kúrò ní ìdúró rẹ̀ mọ́ ní ṣókí.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: nítorí a ti kọ́ ọ dáadáa
  rationale: Ó pa ìdí tí διά fi hàn àti ohùn àìṣe-tààrà passive mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ akọ nínú ἀνθρώπῳ gẹ́gẹ́ bí àpẹẹrẹ aṣojú
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Ọ̀rọ̀ náà gbé akọ ẹyọ kan kalẹ̀ nínú àkàwé Jesu. A pa akọ náà mọ́, nígbà tí àyíká ṣì fi hàn pé àpẹẹrẹ ni.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “walẹ̀ jinlẹ̀” àti “odò náà ru lu” láti pa agbára àwòrán ìkọ́lé àti ìkún omi inú orísun mọ́.
