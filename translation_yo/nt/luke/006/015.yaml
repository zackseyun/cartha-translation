source:
  edition: SBLGNT
  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: yo
  text: àti Mátíù àti Tọ́másì, àti Jákọ́bù ọmọ Álífíọ́sì, àti Símónì tí a ń pè ní Onítara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹni onítara.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ orúkọ àpèjúwe; òun nìkan kò fi hàn dandan pé Símónì jẹ́ ọmọ ẹgbẹ́ òṣèlú kan tí a dá sílẹ̀ lẹ́yìn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ Yorùbá tó wọ́pọ̀ ni “àti”; a tún un ṣe gẹ́gẹ́ bí Gíríìkì ṣe tún un ṣe láti pa ìrísí àtòjọ náà mọ́.
- source_word: Μαθθαῖον
  choice: Mátíù
  rationale: Ìkọ orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: Θωμᾶν
  choice: Tọ́másì
  rationale: Ìkọ orúkọ náà ní ọ̀nà Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Jákọ́bù ọmọ Álífíọ́sì
  rationale: Nínú àkójọ orúkọ irú èyí, ẹ̀yà oníjẹ́nítífù náà sábà ń tọ́ka sí ìbátan ọmọ sí baba; “ọmọ” sọ ìbátan náà di adayeba ní Yorùbá.
- source_word: Σίμωνα
  choice: Símónì
  rationale: Ìkọ orúkọ náà ní ọ̀nà Yorùbá tó ti wọ́pọ̀.
- source_word: τὸν καλούμενον
  choice: tí a ń pè ní
  rationale: Ó fi hàn pé èyí ni orúkọ àpèjúwe tí àwọn ènìyàn fi ń dá Símónì mọ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá adayeba.
- source_word: Ζηλωτὴν
  choice: Olùtara
  rationale: Ó mú èrò ẹni tó ní ìtara jáde, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àpèjúwe láìfipá pinnu pé ẹni náà jẹ́ ọmọ ẹgbẹ́ òṣèlú kan pàtó.
theological_decisions:
- issue: Bóyá Ζηλωτής jẹ́ orúkọ ẹgbẹ́ òṣèlú tàbí orúkọ àpèjúwe ẹni onítara
  choice: Olùtara
  alternative: ẹni onítara; ọmọ ẹgbẹ́ àwọn Olùtara
  rationale: Ọ̀rọ̀ Gíríìkì dájú pé ó jẹ́ àmì ìdánimọ̀ Símónì, ṣùgbọ́n òun nìkan kò yanju bóyá ó jẹ́ ọmọ ẹgbẹ́ ìṣèlú kan ní pàtó. Ìtumọ̀ náà àti àlàyé ìsàlẹ̀ ojú ìwé pa àìdájú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì pa àtòjọ orúkọ àti àìdájú inú Ζηλωτής mọ́.
