id: LUK.6.9
reference: Luke 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Mo béèrè lọ́wọ́ yín, ṣé ó bófin mu ní ọjọ́ Ìsinmi láti ṣe rere tàbí láti ṣe ibi[a], láti gba ìyè là tàbí láti pa á run[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ṣe ìpalára.” Ọ̀rọ̀ Gíríìkì náà fi ṣíṣe rere wé ṣíṣe ibi tàbí ìpalára.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti gba ẹ̀mí là tàbí láti pa á run.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka ní pàtàkì sí ìyè ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré àti ìyípadà inú ìtàn hàn bí Jésù ṣe dáhùn sí àyíká náà.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Mo béèrè lọ́wọ́ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè tààrà tí ó ní agbára ìpèníjà.
- source_word: εἰ ἔξεστιν
  choice: ṣé ó bófin mu
  rationale: Ó pa ìtumọ̀ ohun tí òfin tàbí àṣà fàyè gbà mọ́ nínú àríyànjiyàn nípa ọjọ́ Ìsinmi.
- source_word: τῷ σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ọjọ́ Sábáàtì tí a yà sọ́tọ̀ fún ìsinmi.
- source_word: ἀγαθοποιῆσαι
  choice: láti ṣe rere
  rationale: Ó pa ìtakora ìwà rere àti ìwà búburú inú Gíríìkì mọ́.
- source_word: κακοποιῆσαι
  choice: láti ṣe ibi
  rationale: Ó jẹ́ ìtumọ̀ gbooro tí ó pa ìtakora pẹ̀lú ‘ṣe rere’ mọ́; ó lè tún túmọ̀ sí ṣíṣe ohun tí ó ń ṣe ẹlòmíràn ní ibi.
- source_word: ψυχὴν
  choice: ẹ̀mí
  rationale: Nínú gbólóhùn yìí, ‘ẹ̀mí’ ń tọ́ka sí ìyè ènìyàn, kì í ṣe dandan apá àìrí ènìyàn; àlàyé ìsàlẹ̀ sọ ìtumọ̀ náà di mímọ́.
- source_word: σῶσαι
  choice: láti gba ... là
  rationale: Ọ̀rọ̀ Yorùbá yìí bá ìtumọ̀ pípa ìyè mọ́ mu, ó sì pa agbára ọ̀rọ̀ ìgbàlà mọ́.
- source_word: ἀπολέσαι
  choice: láti pa á run
  rationale: Ó pa agbára ìtakora pẹ̀lú ‘gba là’ mọ́ láì dín ọ̀rọ̀ Gíríìkì kù sí ‘láti pa’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: A lo ‘ẹ̀mí’ ní ìtumọ̀ ìyè ènìyàn, a sì ṣàlàyé pé ‘ìyè’ tún ṣeé lò.
  alternative: láti gba ìyè là tàbí láti pa á run
  rationale: Àyíká ìwòsàn ní ọjọ́ Ìsinmi dá lórí pípa ìyè ènìyàn mọ́ tàbí ṣíṣe é ní ibi, kì í ṣe fífi ẹ̀kọ́ kan pàtó lélẹ̀ nípa ara àti ọkàn.
- issue: Ìtakora ἀγαθοποιῆσαι àti κακοποιῆσαι
  choice: ṣe rere tàbí ṣe ibi
  alternative: ṣe rere tàbí ṣe ohun tó ń ṣe ni ní ibi
  rationale: ‘Ṣe ibi’ pa ìtakora ìwà rere àti ìwà búburú mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ìpalára inú àyíká náà hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. ‘Ọjọ́ Ìsinmi’ jẹ́ ọ̀rọ̀ tí òǹkà Yorùbá lè lóye nírọ̀rùn fún Sábáàtì.
