revisions:
- from: Fún olúkúlùkù ẹni tí ó bá béèrè lọ́wọ́ rẹ, kí o sì fi fún un; ẹni tí ó bá sì gba ohun tí í ṣe tìrẹ, má ṣe béèrè rẹ̀ padà lọ́wọ́ rẹ̀.[a]
  to: Ẹnikẹ́ni tí ó béèrè lọ́wọ́ rẹ, fún un; ẹni tí ó mú ohun tí ó jẹ́ tìrẹ kúrò lọ́wọ́ rẹ, má ṣe béèrè ohun náà padà lọ́wọ́ rẹ̀.[a]
  rationale: Àtúnṣe náà yọ ìtúnlò tí kò ṣe kedere kúrò nínú àṣẹ àkọ́kọ́, ó sì mú ìtumọ̀ αἴρω hàn nípa fífi “mú ... kúrò lọ́wọ́ rẹ” sílẹ̀. Ó pa ìfẹ̀hàn gbòòrò, ìṣesí àṣẹ, àti àìdánilójú tó wà nínú ἀπαιτέω mọ́. Àmì ìsàlẹ̀ náà wà ní ìparí gbolohun tí ó kan, ó sì ń ṣàfihàn aṣàyàn ‘demand back’ láì fi ìtumọ̀ ẹ̀sìn tàbí òfin kún un.
  reviewer_model: gpt-5.6-terra
