  source_fidelity: Ìtumọ̀ náà ń pa ìfẹ̀hàn gbòòrò ti παντί, ìbéèrè αἰτοῦντί, àti ìfẹ̀hàn ìdènà μὴ ἀπαίτει mọ́ ní pàtàkì. Síbẹ̀, ìkọ́lé apá àkọ́kọ́ náà tún ìṣe fífún ṣe ní ọ̀nà tí kò ṣe kedere, àti “gba” nínú apá kejì lè túmọ̀ sí ìgbọ́wọ́ tàbí ìgbàgbọ́ ohun, kì í ṣe mímú ohun ẹni kúrò lọ́wọ́ rẹ̀.
  naturalness: '“Fún olúkúlùkù ẹni tí ó bá béèrè lọ́wọ́ rẹ, kí o sì fi fún un” jẹ́ àtúnlò tí ó díẹ̀ lójú: “Fún” ti jẹ́ àṣẹ pátápátá tẹ́lẹ̀, “kí o sì fi fún un” sì ní ohun tí a kò sọ. “Ẹnikẹ́ni tí ó béèrè lọ́wọ́ rẹ, fún un” jẹ́ Yorùbá òde òní tí ó rọrùn, tó sì kedere. “Má ṣe béèrè ohun náà padà lọ́wọ́ rẹ̀” tún jẹ́ ìkọ́lé tó hàn gbangba.'
  terminology: “Ẹnikẹ́ni” yẹ fún παντί nínú àyíká yìí. “Mú ... kúrò lọ́wọ́ rẹ” ṣàfihàn αἴρω dáadáa ju “gba” lọ láì pè é ní jíjí. “Béèrè ... padà” pa àìdánilójú tó wà láàárín ‘ask back’ àti ‘demand back’ mọ́; àlàyé ìsàlẹ̀ ń fúnni ní aṣàyàn alágbára jù.
