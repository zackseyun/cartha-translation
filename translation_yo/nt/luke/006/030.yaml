base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó béèrè lọ́wọ́ rẹ, fún un; ẹni tí ó mú ohun tí ó jẹ́ tìrẹ kúrò lọ́wọ́ rẹ, má ṣe béèrè ohun náà padà lọ́wọ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “má ṣe fi dandan béèrè ohun náà padà lọ́wọ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: olúkúlùkù ẹni tí ó bá béèrè lọ́wọ́ rẹ
  rationale: 'Ọ̀rọ̀ yìí fi ìtumọ̀ pínpín àti gbígbòòrò hàn: ẹnikẹ́ni tí ó bá béèrè nǹkan lọ́wọ́ ẹni tí a ń bá sọ̀rọ̀. “Béèrè lọ́wọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fi kún un pé ẹni náà jẹ́ alágbe.'
- source_word: δίδου
  choice: kí o sì fi fún un
  rationale: Àṣẹ ìsinsìnyí ni; gbolohun yìí sọ àṣẹ náà ní Yorùbá àdánidá láì fi ọ̀rọ̀ àfikún mú kí ó túmọ̀ sí ìṣe tí kò dáwọ́ dúró nìkan.
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: ẹni tí ó bá sì gba ohun tí í ṣe tìrẹ
  rationale: “Gba” lè ṣàpèjúwe mímú ohun kúrò lọ́wọ́ ẹni láì fi dandan sọ pé olè jí i; “ohun tí í ṣe tìrẹ” pa ìwọ̀n gbígbòòrò τὰ σὰ mọ́.
- source_word: μὴ ἀπαίτει
  choice: má ṣe béèrè rẹ̀ padà lọ́wọ́ rẹ̀
  rationale: ἀπαιτέω lè túmọ̀ sí béèrè tàbí fi agbára béèrè ohun padà. Èyí jẹ́ Yorùbá kedere, ó sì pa èrò gbígba ohun náà padà mọ́.
theological_decisions:
- issue: Ìwọ̀n àti agbára àwọn àṣẹ ìwà rere Jésù nínú ọ̀rọ̀ yìí
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà gẹ́gẹ́ bí àṣẹ gbígbòòrò, tààrà, láì dín ìwọ̀n wọn kù.
  alternative: A lè ka wọn sí àsọdùn, dín wọn mọ́ fífún aláìní, tàbí dín apá kejì mọ́ ọ̀ràn jíjí ohun àti ìsanpadà lábẹ́ òfin.
  rationale: Gíríìkì lo àwọn àṣẹ tààrà àti èdè tí ó gbòòrò. Ìtumọ̀ gbọ́dọ̀ pa ìdọ̀tí àti ìpèníjà ìwà rere inú ọ̀rọ̀ náà mọ́, dípò kí ó pinnu bí a ṣe gbọdọ̀ lò ó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé gbogbogbò. A yan “ohun tí í ṣe tìrẹ” dípò ọ̀rọ̀ tó lè dín ìtumọ̀ mọ́ ohun ìní nìkan.
