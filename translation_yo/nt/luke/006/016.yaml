id: LUK.6.16
reference: Luke 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: yo
  text: àti Júdà ọmọ Jákọ́bù[a], àti Júdà Iskariotu, ẹni tí ó di ọ̀dàlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Júdà arákùnrin Jákọ́bù”; èdè Gíríìkì kàn sọ pé, “Júdà ti Jákọ́bù.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Júdà ọmọ Jákọ́bù
  rationale: Ọ̀rọ̀ ìní Ἰακώβου kò sọ irú ìbátan náà ní pàtó. Fífi “ọmọ” kún un mú kí àkójọ orúkọ náà ṣe kedere ní Yorùbá, ó sì jẹ́ ìtumọ̀ tí ó ṣeé gbà jù lọ; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn tí ó ṣeé ṣe mọ́.
- source_word: Ἰσκαριὼθ
  choice: Iskariotu
  rationale: Orúkọ tàbí àpèjúwe ẹni ni; a kọ ọ́ ní ìbámu pẹ̀lú bí a ṣe ń kọ àwọn orúkọ Bíbélì ní Yorùbá dípò títúmọ̀ rẹ̀.
- source_word: ὃς ἐγένετο
  choice: ẹni tí ó di
  rationale: “Di” pa agbára ọ̀rọ̀-ìṣe γίνομαι mọ́, ó sì fi hàn pé ó wá gba ipò tàbí ìwà tí a ń sọ yìí, dípò kí a kàn sọ pé ó jẹ́ bẹ́ẹ̀.
- source_word: προδότης
  choice: ọ̀dàlẹ̀
  rationale: “Ọ̀dàlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó da ẹlòmíràn tàbí ẹgbẹ́ rẹ̀, ó sì bá lílo orúkọ yìí mu.
- source_word: καὶ
  choice: àti
  rationale: Àtúnlò “àti” so àwọn orúkọ méjèèjì pọ̀ ní ọ̀nà tó ṣe tààrà, gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìbátan tí Ἰακώβου ń tọ́ka sí nínú “Júdà ti Jákọ́bù”
  choice: Júdà ọmọ Jákọ́bù nínú ọ̀rọ̀ pàtàkì
  alternative: Júdà arákùnrin Jákọ́bù
  rationale: Gíríìkì fi ìbátan náà sílẹ̀ láì sọ ọ́ ní pàtó. “Ọmọ Jákọ́bù” jẹ́ àṣàyàn tí ó wọ́pọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí àìdánilójú inú ọ̀rọ̀ ìpilẹ̀ àti ìtumọ̀ “arákùnrin” tí ó ṣeé ṣe wà ní gbangba.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa ìtẹ̀síwájú àkójọ orúkọ náà mọ́ pẹ̀lú “àti” ní ìbẹ̀rẹ̀.
