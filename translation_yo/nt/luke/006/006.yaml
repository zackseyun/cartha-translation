source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ Ìsinmi mìíràn pé ó wọ inú sínágọ́gù, ó sì ń kọ́ni. Ọkùnrin kan sì wà níbẹ̀, ọwọ́ ọ̀tún rẹ̀ sì rọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbẹ” tàbí “ṣúgẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè ṣàpèjúwe ohun tí ó gbẹ tàbí tí ó rọ; níhìn-ín, ó ń tọ́ka sí ọwọ́ ọ̀tún ọkùnrin náà tí ó ní àìlera.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀
  rationale: Èyí jẹ́ ọ̀nà tí Lúùkù fi ń darí ìtàn lọ sí ìṣẹ̀lẹ̀ tuntun. “Sì” ń mú iṣẹ́ ìsopọ̀ δέ jáde láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: ní ọjọ́ Ìsinmi mìíràn
  rationale: Ó tọ́ka sí ọjọ́ Sábáàtì mìíràn, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún òǹkàwé òde òní.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: pé ó wọ inú sínágọ́gù
  rationale: A sọ infinitive Gíríìkì di gbólóhùn aláṣeyọrí ní Yorùbá, nígbà tí “wọ inú” pa ìtumọ̀ ìwọlé mọ́.
- source_word: καὶ διδάσκειν
  choice: ó sì ń kọ́ni
  rationale: Àmì “ń” fi ìṣe tí ó ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí aspect aláìparí ti present infinitive Gíríìkì.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Ọkùnrin kan sì wà níbẹ̀
  rationale: “Ọkùnrin” bá akọ tí ọ̀rọ̀ náà ń tọ́ka sí mu, “kan” sì mú ìfihàn ẹni tuntun nínú ìtàn ṣe kedere.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: ọwọ́ ọ̀tún rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọwọ́ pàtó náà, ìyẹn ọwọ́ ọ̀tún.
- source_word: ξηρά
  choice: rọ
  rationale: Nínú ọ̀rọ̀ nípa ọwọ́ aláìlera, “rọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọwọ́ tí ó ti rẹ̀ tàbí tí kò ṣiṣẹ́ dáadáa; àlàyé ìsàlẹ̀ ojú ewé pa àwòrán “gbẹ” inú Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àtijọ́-díẹ̀ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn Júù tí a mọ̀, a sì fi àmì ohùn sí ibi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí ó ń ṣàlàyé, kì í ṣe lẹ́yìn “kọ́ni.”
