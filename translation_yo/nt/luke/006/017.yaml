id: LUK.6.17
reference: Luke 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: yo
  text: Ó sì bá wọn sọ̀kalẹ̀, ó dúró ní ibi pẹ̀lẹ́bẹ̀ kan,[a] pẹ̀lú ogunlọ́gọ̀ àwọn ọmọ-ẹ̀yìn rẹ̀ àti ọ̀pọ̀ ènìyàn láti gbogbo Jùdíà àti Jerúsálẹ́mù, àti láti agbègbè etíkun Tírè àti Sídónì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí pẹ̀tẹ́lẹ̀ kan.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí “lórí ibi pẹ̀lẹ́bẹ̀ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: bá wọn sọ̀kalẹ̀
  rationale: Ó pa ìtumọ̀ ìṣíkiri sí ìsàlẹ̀ mọ́, ó sì so μετ’ αὐτῶν mọ́ ọn ní Yorùbá àdánidá.
- source_word: ἔστη
  choice: ó dúró
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere jù lọ láti sọ pé ó gba ipò dúró níbẹ̀.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: sí ibi pẹ̀lẹ́bẹ̀ kan
  rationale: ‘Ibi pẹ̀lẹ́bẹ̀’ ń fi ìrísí ilẹ̀ tí ó fẹ́rẹ̀ẹ́ dọ́gba hàn láì fi dandan sọ pé pẹ̀tẹ́lẹ̀ ńlá ni.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: ọ̀pọ̀lọpọ̀ àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Ó sọ ní kedere pé àwùjọ ńlá náà jẹ́ ti àwọn ọmọ ẹ̀yìn rẹ̀, ní èdè Yorùbá tí ó rọrùn.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Ó yà ọ̀pọ̀ ènìyàn gbogbogbò náà sọ́tọ̀ kúrò lọ́dọ̀ àwọn ọmọ ẹ̀yìn, bí Gíríìkì ṣe ṣe.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: láti gbogbo Jùdíà
  rationale: Ó pa ìtumọ̀ àpapọ̀ πάσης mọ́ ní ọ̀nà tó wọ́pọ̀ ní Yorùbá.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Àkọtọ̀ Yorùbá tó bá ìpè orúkọ náà mu.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: láti agbègbè etíkun Tírè àti Sídónì
  rationale: Ó tú παράλιος sí agbègbè tó wà lẹ́gbẹ̀ẹ́ òkun, tí ó sì ní í ṣe pẹ̀lú Tírè àti Sídónì.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ìrísí ilẹ̀ àti ibi tí ìwàásù náà ti ṣẹlẹ̀
  choice: ibi pẹ̀lẹ́bẹ̀ kan
  alternative: pẹ̀tẹ́lẹ̀ kan
  rationale: Ìtumọ̀ náà tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì láì mú kí ó jẹ́ pẹ̀tẹ́lẹ̀ ńlá dandan, láì sì gbìyànjú láti mú un bá àkọsílẹ̀ Mátíù mu.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. Àmì ẹsẹ̀ àárín gbólóhùn ní òpin ń tẹ̀ lé pé ẹsẹ̀ yìí ń bá a lọ sínú ẹsẹ̀ tó tẹ̀ lé e.
