  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: yo
  text: Ẹ máa súre fún àwọn tí ń bú yín; ẹ máa gbàdúrà fún àwọn tí ń hùwà ìkà sí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwọn tí ń fi yín ṣe ẹlẹ́yà” tàbí “fún àwọn tí ń ṣe yín ní ìkà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí onírúurú ìwà ọ̀tá, bí ìlòkulò tàbí ẹ̀gàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Ẹ máa súre fún
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Súre fún” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé kí ènìyàn ké pe ìbùkún sórí ẹlòmíràn, ó sì pa ìyàtọ̀ tó lágbára mọ́ láàárín súre àti búni.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: àwọn tí ń bú yín
  rationale: Participle pẹ̀lú article ń tọ́ka sí àwọn ènìyàn tí wọ́n ń ṣe ìṣe náà. “Àwọn tí ń bú yín” jẹ́ èdè Yorùbá àdánidá, ó sì fi ìṣe ọ̀rọ̀ ọ̀tá náà hàn kedere.
- source_word: προσεύχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Ó jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Ẹ máa” fi àṣẹ àti ìṣe tí ó yẹ kí ó máa bá a lọ hàn láìfi ìtumọ̀ aspect lé e ju bó ṣe yẹ lọ.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: fún àwọn tí ń hùwà búburú sí yín
  rationale: Pẹ̀lú προσεύχομαι, περί níbí túmọ̀ sí “fún” tàbí “nípa.” Ἐπηρεάζω lè ní ìtumọ̀ ìkà, èébú, tàbí onírúurú ìlòkulò; “hùwà búburú sí” gbooro tó láti gba gbogbo ìpele náà, ó sì yé àwọn òǹkàwé òde òní.
theological_decisions:
- issue: Ìwọ̀n àṣẹ láti nífẹ̀ẹ́ àwọn ọ̀tá
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà gẹ́gẹ́ bí àṣẹ ìwà rere ní tààràtà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: Ṣàlàyé irú ìbùkún tàbí àdúrà tí àṣẹ náà béèrè.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ pa á láṣẹ pé kí ẹni tó ń tẹ̀lé Jesu dáhùn sí ìkórìíra pẹ̀lú ìbùkún àti àdúrà. Ìtumọ̀ yẹ kí ó pa agbára àti ìforígbárí ìwà rere yìí mọ́ láìyanjú rẹ̀ pẹ̀lú àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “ẹ máa” láti fi àṣẹ fún ọ̀pọ̀ ènìyàn àti ìṣe tí ó yẹ kí ó máa bá a lọ hàn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
