id: LUK.6.8
reference: Luke 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: yo
  text: Ṣùgbọ́n ó mọ èrò inú wọn[a], ó sì sọ fún ọkùnrin tí ọwọ́ rẹ̀ rọ[b] pé, “Dìde, kí o sì dúró ní àárín.”[c] Ó sì dìde, ó dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrònú wọn” tàbí “ìgbèrò wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọwọ́ rẹ̀ gbẹ” tàbí “ọwọ́ rẹ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “sínú àárín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ó mọ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìmọ̀ ní àkókò ìtàn yìí; ‘ó mọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, láì ṣàlàyé bí ó ṣe mọ̀ ọ́n.
- source_word: διαλογισμοὺς
  choice: èrò inú
  rationale: Ó lè túmọ̀ sí àwọn èrò tàbí ìrònú tí ènìyàn ń gbé yẹ̀ wò nínú ara rẹ̀. ‘Èrò inú’ bá àyíká ọ̀rọ̀ mu, ó sì fi àṣàyàn míì sílẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ἀνδρὶ
  choice: ọkùnrin
  rationale: ἀνήρ ń tọ́ka sí akọ ọ̀dọ́lagbà; ‘ọkùnrin’ pa ìtọ́kasí akọ náà mọ́.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: ọwọ́ rẹ̀ rọ
  rationale: Nínú Yorùbá àgbéléwò, ‘ọwọ́ rẹ̀ rọ’ jẹ́ àpèjúwe àìlera ọwọ́ tó ṣeé lóye, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán gangan ti ‘gbẹ’ mọ́.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: ‘Dìde’ ń sọ ìgbésẹ̀ kíkúrò níbi tí ẹni náà wà, ó sì yàtọ̀ sí àṣẹ tó tẹ̀ lé e láti dúró.
- source_word: στῆθι
  choice: dúró
  rationale: ‘Dúró’ pa àṣẹ kejì mọ́ láì da a pọ̀ mọ́ ‘dìde.’
- source_word: εἰς τὸ μέσον
  choice: ní àárín
  rationale: Gbólóhùn náà tọ́ka sí àárín àwọn tó péjọ; ‘ní àárín’ jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ṣàfihàn ìtọ́sọ́nà ‘sínú àárín.’
- source_word: ἀναστὰς ἔστη
  choice: Ó sì dìde, ó dúró níbẹ̀
  rationale: 'Ìtumọ̀ yìí pa ìgbésẹ̀ méjèèjì mọ́: ó kọ́kọ́ dìde, lẹ́yìn náà ó dúró.'
theological_decisions:
- issue: Ìmọ̀ Jésù nípa èrò inú àwọn ẹlòmíràn
  choice: Sọ ní tààrà pé ó mọ èrò inú wọn, láì fi ọ̀nà tí ó gbà mọ̀ ọ́n kún un.
  alternative: Ó mọ ète wọn; tàbí ó fi agbára àtọ̀runwá mọ ìrònú wọn.
  rationale: Ẹsẹ̀ náà sọ pé Jésù mọ àwọn èrò wọn, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí ó gbà mọ̀ wọ́n. Ìtumọ̀ náà kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ kún un.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó ṣeé lóye fún òǹkàwé òde òní. A pa àṣẹ méjì náà—‘dìde’ àti ‘dúró’—mọ́ lọ́tọ̀, a sì yẹra fún fífi ọ̀nà tí Jésù gbà mọ èrò wọn kún ọ̀rọ̀ orísun.
