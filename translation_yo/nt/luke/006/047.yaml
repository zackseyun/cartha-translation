  source_fidelity: Ìtumọ̀ náà ń gbé èrò pàtàkì ẹsẹ̀ náà kalẹ̀, ṣùgbọ́n “tọ̀ mí wá” kì í jẹ́ ìbámu tó péye jù lọ fún ἐρχόμενος πρός με, ó sì lè túmọ̀ sí wíwá ẹnì kan. Pẹ̀lú náà, “ṣe wọ́n” kò rọrùn ní Yorùbá níbi tí aṣojú rẹ̀ jẹ́ “àwọn ọ̀rọ̀.”
