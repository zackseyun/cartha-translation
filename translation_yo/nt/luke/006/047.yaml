  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó wá sọ́dọ̀ mi, tí ó ń gbọ́ ọ̀rọ̀ mi, tí ó sì ń ṣe ohun tí wọ́n sọ—ẹ̀mí yóò fi ẹni tí ó dà bí hàn yín:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì ní, “ẹni tí ó dà bí”; ìdí nìyí tí ìtumọ̀ náà fi ń tọ́ka sí ẹni tí ó jọ, kì í ṣe sí irú ẹni tí ó jẹ́ lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Ẹnikẹ́ni tí ó bá tọ̀ mí wá
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ gbogbogbò pé ẹnikẹ́ni láìsí àfiwé; “tọ̀ mí wá” sì fi ìṣípò sí ọ̀dọ̀ Jésù hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀκούων μου τῶν λόγων
  choice: tí ó gbọ́ àwọn ọ̀rọ̀ mi
  rationale: Èyí pa ìtumọ̀ tààrà ti gbígbọ́ ẹ̀kọ́ Jésù mọ́, láìfi ìtumọ̀ ìgbọ́ràn kún un ṣáájú gbólóhùn tó tẹ̀ lé.
- source_word: ποιῶν αὐτούς
  choice: tí ó sì ṣe wọ́n
  rationale: “Ṣe wọ́n” pa àjọṣe tààrà mọ́ láàárín àwọn ọ̀rọ̀ náà àti fífi wọn sí ìṣe, ó sì tẹ̀ lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì.
- source_word: ὑποδείξω ὑμῖν
  choice: èmi yóò fi ... hàn yín
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìlérí Jésù pé òun yóò ṣàlàyé àfiwé tó ń bọ̀.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: ẹni tí ó jọ
  rationale: 'Èyí pa àkópọ̀ ìbéèrè àfiwé náà mọ́: ní ti gírámà, ó túmọ̀ sí “ẹni tí ó jọ,” kì í ṣe àpèjúwe ànímọ́ rẹ̀ lásán.'
theological_decisions:
- issue: Ìtọ́ka sí ẹnì kan nínú gbólóhùn àfiwé
  choice: Lo “ẹni” tí kò fi akọ tàbí abo hàn
  alternative: Lo aṣojú-ọ̀rọ̀ akọ gẹ́gẹ́ bí Gíríìkì ṣe ní fọ́ọ̀mù akọ ẹyọ
  rationale: Èdè Yorùbá kò fi akọ tàbí abo hàn nínú “ó/ẹni.” Èyí pa ìtumọ̀ gbogbogbò ti Gíríìkì mọ́ láìṣàfikún akọ tí èdè àfojúsùn kò nílò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “tí ó bá” fún ìtumọ̀ gbogbogbò, kì í ṣe láti sọ pé ìṣe náà kò dájú.
