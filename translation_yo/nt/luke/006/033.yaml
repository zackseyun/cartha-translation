id: LUK.6.33
reference: Luke 6:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: yo
  text: Bí ẹ̀yin bá sì ń ṣe rere sí àwọn tí ń ṣe rere sí yín, ìyìn wo ni èyí jẹ́ fún yín?[a] Àní àwọn ẹlẹ́ṣẹ̀ ń ṣe bákan náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oore-ọ̀fẹ́ wo ni èyí jẹ́ fún yín?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “oore-ọ̀fẹ́,” “ojúrere,” “ọpẹ́,” tàbí “ìyìn”; níbí, ó ń tọ́ka sí ìyìn tàbí ìmọrírì fún rere tí a fi san rere padà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: ń ṣe rere
  rationale: Ó túmọ̀ sí ṣíṣe ohun rere tàbí ṣíṣe rere sí ẹlòmíràn; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú apá tó tẹ̀ lé e.
- source_word: τοὺς ἀγαθοποιοῦντας ὑμᾶς
  choice: àwọn tí ń ṣe rere fún yín
  rationale: A tún lo ‘ṣe rere’ láti pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́, ‘fún yín’ sì fi hàn pé àwọn olùgbọ́ ni wọ́n ń ṣe rere sí.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: ìyìn wo ni ẹ̀yin tọ́ sí fún ìyẹn?
  rationale: Nínú ọ̀rọ̀ ìwà rere yìí, χάρις ń tọ́ka sí ìyìn, ojúrere, tàbí ìmọrírì tí ìṣe kan lè yẹ; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, kò sì fa ìtumọ̀ oore-ọ̀fẹ́ ìgbàlà wọ inú ẹsẹ náà.
- source_word: οἱ ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe tààrà jù fún ẹ̀ka ènìyàn tí Lúùkù pè ní ‘àwọn ẹlẹ́ṣẹ̀,’ láìrọ̀ ọ́ lójú.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ń ṣe bákan náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye láti sọ pé wọ́n ń ṣe ohun kan náà.
- source_word: καὶ
  choice: sì / àní ... pàápàá
  rationale: ‘Sì’ so ẹsẹ náà mọ́ ọ̀rọ̀ tó ṣáájú; ‘àní ... pàápàá’ fi agbára ìtẹnumọ́ καὶ kejì hàn pé àwọn ẹlẹ́ṣẹ̀ gan-an ń ṣe bẹ́ẹ̀.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú ẹ̀kọ́ nípa ìwà rere
  choice: ìyìn tàbí ìmọrírì tí ènìyàn tọ́ sí
  alternative: oore-ọ̀fẹ́; ojúrere; ọpẹ́
  rationale: Ìbéèrè àsọyé náà ń béèrè ìyìn tàbí ojúrere wo ni ó yẹ fún ẹni tó kàn ń san rere padà. ‘Ìyìn wo ni ẹ̀yin tọ́ sí’ dá èrò yìí dúró láìfi ìtumọ̀ ẹ̀kọ́ ìgbàlà kún χάρις.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ìtẹnumọ́ wà nínú ‘ẹ̀yin’; gbólóhùn náà jẹ́ kedere fún òǹkàwé òde òní. A lo àfihàn ìṣe tó ń lọ (‘ń ṣe’) gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún gbólóhùn àṣà tàbí ìṣe tí a máa ń ṣe.
