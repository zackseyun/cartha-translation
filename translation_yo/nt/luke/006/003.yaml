id: LUK.6.3
reference: Luke 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: yo
  text: Jésù sì dá wọn lóhùn pé, “Ṣé ẹ kò tilẹ̀ ka ohun tí Dáfídì ṣe nígbà tí ebi pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: dá wọn lóhùn pé
  rationale: Àkójọpọ̀ participle àti ọ̀rọ̀-ìṣe yìí túmọ̀ sí ‘dáhùn, ó sì sọ’; ‘dá wọn lóhùn pé’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ mọ́ láìṣe àtúnlò ọ̀rọ̀.
- source_word: πρὸς αὐτοὺς
  choice: wọn
  rationale: Ó pa àwọn tí Jésù ń dá lóhùn mọ́ gẹ́gẹ́ bí object nínú gbólóhùn Yorùbá.
- source_word: Οὐδὲ τοῦτο
  choice: ẹ kò tilẹ̀ ka ohun
  rationale: ‘tilẹ̀’ ń fi agbára οὐδέ (‘kódà ... kò’) hàn nínú ìbéèrè àtakò, nígbà tí ‘ohun tí’ ń so ọ̀rọ̀ náà mọ́ àpẹẹrẹ Dáfídì lọ́nà àdánidá.
- source_word: ἀνέγνωτε
  choice: Ṣé ẹ kò ... ka
  rationale: Ìbéèrè àtakò Yorùbá yìí tọ́ka sí ìmọ̀ wọn nípa Ìwé Mímọ́, ó sì bá agbára aorist Gíríìkì mu nínú àyíká yìí.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: ohun tí Dáfídì ṣe
  rationale: Ìtumọ̀ tààrà, tí ó sì jẹ́ Yorùbá àdánidá fún relative clause náà.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Ìkọ̀wé orúkọ ẹni náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: ὁπότε
  choice: nígbà tí
  rationale: Ó fi àkókò ìṣẹ̀lẹ̀ hàn ní kedere àti lọ́nà àdánidá.
- source_word: ἐπείνασεν
  choice: ebi pa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún jíjẹ́ ẹni tí ebi ń pa; kò fi agbára ‘ebi ń pa gan-an’ kún ọ̀rọ̀ Gíríìkì.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: òun àti àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: ‘òun’ pa pronoun tí a tẹnumọ́ mọ́, ‘àwọn tí ó wà pẹ̀lú rẹ̀’ sì tẹ̀lé participial phrase náà láìṣe àlàyé wọn gẹ́gẹ́ bí ‘àwọn alábàákẹ́gbẹ́’.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, kì í ṣe ọ̀rọ̀ ọ̀wọ̀ sí ẹnì kan ṣoṣo.
