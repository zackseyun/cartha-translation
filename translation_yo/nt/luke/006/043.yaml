  source_fidelity: 'Ìtumọ̀ náà ń pa ìṣọ̀kan àtakò Gíríìkì mọ́: igi rere kò mú èso σαπρός jáde, igi σαπρός sì kò mú èso rere jáde. Ṣùgbọ́n “jíjẹrà” kì í ṣe ọ̀nà tí ó rọrùn jù lọ nínú Yorùbá òde òní láti ṣàpèjúwe igi; “tí ó bàjẹ́” jẹ́ kedere, ó sì yẹ fún èso àti igi láìyí àwòrán iṣẹ́ àgbẹ̀ náà padà.'
