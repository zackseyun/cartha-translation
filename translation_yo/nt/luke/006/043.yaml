id: LUK.6.43
reference: Luke 6:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: yo
  text: Nítorí kò sí igi rere tí ń so èso tí ó bàjẹ́, bẹ́ẹ̀ ni kò sí igi tí ó bàjẹ́ tí ń so èso rere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γάρ
  choice: Nítorí kò sí
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “kò sí” sì fi ìsẹ́ nípa àìsí ohun tí Οὐ ... ἐστιν sọ hàn ní Yorùbá àdánidá.
- source_word: δένδρον
  choice: igi
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún igi, ó sì bá àwòrán igi eléso mu níbí.
- source_word: καλὸν
  choice: rere
  rationale: “Rere” lè tọ́ka sí ohun tó dára tàbí tó yè kooro, ó sì pa ìtumọ̀ iṣẹ́ àgbẹ̀ àti ti ìwà mọ́ láìṣe àlàyé àfikún.
- source_word: ποιοῦν καρπὸν
  choice: tí ń so èso
  rationale: Nípa igi, “so èso” ni ọ̀nà Yorùbá àdánidá fún mímú èso jáde, ó sì pa ipa participle náà mọ́.
- source_word: σαπρόν
  choice: jíjẹrà
  rationale: “Jíjẹrà” pa àwòrán ohun tí ó bàjẹ́ tàbí rà mọ́, dípò yíyí ọ̀rọ̀ náà sí ìdájọ́ ìwà lasán.
- source_word: οὐδὲ πάλιν
  choice: bẹ́ẹ̀ ni kò sí
  rationale: Gbólóhùn yìí so ìsẹ́ kejì mọ́ ti àkọ́kọ́ gẹ́gẹ́ bí òdìkejì tó tún jẹ́ òtítọ́, ní Yorùbá tó ṣe kedere.
- source_word: καρπὸν καλόν
  choice: èso rere
  rationale: Ó pa ìfiwéra òdìkejì tó wà láàárín “èso jíjẹrà” àti “èso rere” mọ́.
theological_decisions:
- issue: Bí a ṣe lè pa agbára àkàwé iṣẹ́ àgbẹ̀ àti ìtumọ̀ ìwà mọ́
  choice: Lo “jíjẹrà” fún σαπρός ní ibi méjèèjì
  alternative: “búburú” tàbí “tí kò dára”
  rationale: “Jíjẹrà” jẹ́ kí àwòrán igi àti èso dúró ní kedere, kí òǹkàwé sì rí ìtumọ̀ ìwà tó ń jáde láti inú àkàwé náà láìfi ẹ̀kọ́ ìsìn pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ọ̀nà ọ̀rọ̀ tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo àtúnṣe gbolohun tó jọra ní apá méjèèjì láti pa ìfiwéra Gíríìkì mọ́.
