id: LUK.6.32
reference: Luke 6:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: yo
  text: Bí ẹ̀yin bá nífẹ̀ẹ́ àwọn tí wọ́n nífẹ̀ẹ́ yín, ìyìn wo ni èyí jẹ́ fún yín?[a] Nítorí àwọn ẹlẹ́ṣẹ̀ pàápàá nífẹ̀ẹ́ àwọn tí wọ́n nífẹ̀ẹ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Oore-ọ̀fẹ́ wo ni èyí jẹ́ fún yín?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “oore-ọ̀fẹ́,” “ojú rere,” tàbí “ìyìn”; níbí, ó ń tọ́ka sí ohun tí ó yẹ fún ìtẹ́wọ́gbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: nífẹ̀ẹ́
  rationale: A lo ọ̀rọ̀ kan náà ní gbogbo ibi mẹ́ta láti pa àsopọ̀ àti àtúnṣe ọ̀rọ̀ Gíríìkì mọ́; ó sì jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ‘fẹ́ràn/love’ ní àyíká yìí.
- source_word: ποία
  choice: kí ni
  rationale: Ìbéèrè náà ń béèrè ohun tí ó yẹ fún ìyìn tàbí ohun rere pàtàkì tí ó wà nínú ìṣe náà; ‘kí ni’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí kò fi àlàyé kún un.
- source_word: χάρις
  choice: kí ni ó yẹ kí a yìn yín fún
  rationale: Ní àyíká yìí, χάρις ń tọ́ka sí ohun tó yẹ fún ìyìn tàbí ìtẹ́wọ́gbà, kì í ṣe pàápàá sí oore-ọ̀fẹ́ ìgbàlà. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìbéèrè àsọyé náà mọ́.
- source_word: ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó wọ́pọ̀, fún ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ láti tọ́ka sí àwọn ènìyàn ẹlẹ́ṣẹ̀.
- source_word: καὶ γὰρ
  choice: Nítorí … pàápàá
  rationale: ‘Nítorí’ mú iṣẹ́ àlàyé γάρ jáde, ‘pàápàá’ sì mú ìtẹnumọ́ καί hàn ní Yorùbá àdánidá.
- source_word: ὑμῖν
  choice: yín
  rationale: A fi arọ́pò-orúkọ náà sínú gbólóhùn ‘kí ni ó yẹ kí a yìn yín fún?’ kí ìtumọ̀ dátífù náà lè ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú ọ̀rọ̀ Jésù yìí
  choice: ohun tó yẹ fún ìyìn tàbí ìtẹ́wọ́gbà
  alternative: oore-ọ̀fẹ́; ojú rere; ọpẹ́
  rationale: Àyíká náà ń fi ìfẹ́ tí kò yàtọ̀ sí ti àwọn ẹlẹ́ṣẹ̀ wé ìfẹ́ tí Jésù ń béèrè lọ́wọ́ àwọn olùgbọ́ rẹ̀. Nítorí náà, ohun tó yẹ fún ìyìn ni ó wà níwájú jù, bí ó tilẹ̀ jẹ́ pé χάρις ní ìtumọ̀ tó gbòòrò; àkọsílẹ̀ ìsàlẹ̀ pa ìyẹn mọ́ láì mú ẹ̀kọ́ nípa oore-ọ̀fẹ́ ìgbàlà wọ inú ẹsẹ yìí.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘ẹ̀yin/yín’ gẹ́gẹ́ bí ó ṣe wà nínú Gíríìkì, a sì pa àtúnṣe ‘nífẹ̀ẹ́’ mọ́ ní gbogbo ibi mẹ́ta.
