revisions:
- from: Bí ẹ̀yin bá sì nífẹ̀ẹ́ àwọn tí ó nífẹ̀ẹ́ yín, kí ni ó yẹ kí a yìn yín fún?[a] Nítorí àwọn ẹlẹ́ṣẹ̀ pàápàá nífẹ̀ẹ́ àwọn tí ó nífẹ̀ẹ́ wọn.
  to: Bí ẹ̀yin bá nífẹ̀ẹ́ àwọn tí wọ́n nífẹ̀ẹ́ yín, ìyìn wo ni èyí jẹ́ fún yín?[a] Nítorí àwọn ẹlẹ́ṣẹ̀ pàápàá nífẹ̀ẹ́ àwọn tí wọ́n nífẹ̀ẹ́ wọn.
  rationale: A rọ́pò àlàyé “kí ni ó yẹ kí a yìn yín fún?” pẹ̀lú “ìyìn wo ni èyí jẹ́ fún yín?” kí ìtumọ̀ náà lè tẹ̀lé ποία ὑμῖν χάρις ἐστίν ní pẹkipẹki, láì sọ pé ìwà wọn kò lè yẹ fún ìyìn rárá. A tún ṣàfikún “wọ́n” nínú àwọn gbólóhùn ìbátan fún ìmúlò Yorùbá tó ṣe kedere. “Sì” lẹ́yìn “Bí ẹ̀yin bá” ni a yọ kúrò, nítorí καὶ εἰ níbí jẹ́ ìbẹ̀rẹ̀ ìbéèrè míràn, kò sì nílò ìsopò afikun nínú Yorùbá.
