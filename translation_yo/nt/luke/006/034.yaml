id: LUK.6.34
reference: Luke 6:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: yo
  text: Bí ẹ bá sì yá nǹkan fún àwọn tí ẹ ń retí láti gba padà lọ́wọ́ wọn, ìyìn[a] wo ni ẹ yẹ fún? Àwọn ẹlẹ́ṣẹ̀ pàápàá máa ń yá nǹkan fún àwọn ẹlẹ́ṣẹ̀, kí wọn lè gba ìwọ̀n kan náà padà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ojú rere wo ni ẹ yẹ fún?” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ọpẹ́,” ṣùgbọ́n níhìn-ín ó ṣeé ṣe kí ó túmọ̀ sí ìyìn tàbí ojú rere tí ìṣe kan yẹ fún.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: yá nǹkan fún
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi owó tàbí ohun kan yá ẹlòmíràn, láì fi àlàyé tí Gíríìkì kò sọ kún un.
- source_word: παρ’ ὧν
  choice: àwọn ... lọ́wọ́ wọn
  rationale: Ìṣètò yìí fi hàn pé àwọn tí a yá nǹkan fún ni a ń retí láti gba ohun náà padà lọ́wọ́ wọn, ó sì bá ìlò Yorùbá mu.
- source_word: ἐλπίζετε λαβεῖν
  choice: ẹ ń retí láti gba padà
  rationale: “Ń retí” lè túmọ̀ ìfojúsọ́nà tí ó dá lórí ìsanpadà; “gba padà” mú ìtumọ̀ ọ̀rọ̀ yíyá ṣe kedere ní àyíká ọ̀rọ̀ yìí.
- source_word: ποία ... χάρις ἐστίν
  choice: ìyìn wo ni ẹ tọ́ sí?
  rationale: Ní àyíká yìí, χάρις ń tọ́ka sí ìyìn tàbí ojú rere tí ìṣe kan lè tọ́ sí, kì í ṣe oore-ọ̀fẹ́ ìgbàlà. Ìbéèrè yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Jesu mọ́.
- source_word: ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ẹ̀ka ìwà rere tí Lúùkù lò mọ́.
- source_word: ἵνα ἀπολάβωσιν
  choice: kí wọn lè gba ... padà
  rationale: Ó sọ ète fífúnni ní yá, ìyẹn láti gba ohun tí a yá náà padà, ní ọ̀nà tí ó ṣe kedere tí ó sì sún mọ́ Gíríìkì.
- source_word: τὰ ἴσα
  choice: ìwọ̀n kan náà
  rationale: Ó fi ìsanpadà tó dọ́gba hàn láì sọ pé èlé tàbí èrè wà nínú rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú ìbéèrè Jesu
  choice: A túmọ̀ rẹ̀ sí “ìyìn” gẹ́gẹ́ bí ohun rere tí ìṣe kan tọ́ sí.
  alternative: “oore-ọ̀fẹ́,” “ọpẹ́,” tàbí “ojú rere”
  rationale: Àyíká ọ̀rọ̀ ń béèrè ohun tí ó mú ìṣe ọmọ-ẹ̀yìn yàtọ̀ sí ti àwọn ẹlẹ́ṣẹ̀; kò ń lo χάρις gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ nípa oore-ọ̀fẹ́ ìgbàlà.
- issue: Irú ohun tí ẹni tí ó yá nǹkan ń retí láti rí gbà
  choice: A sọ ọ́ ní àìdásí gẹ́gẹ́ bí gbígba ìwọ̀n kan náà padà.
  alternative: Ìsanpadà pẹ̀lú èlé tàbí èrè
  rationale: τὰ ἴσα sọ ìdọ́gba, ṣùgbọ́n kò sọ pé èlé tàbí èrè wà; nítorí náà, a kò fi èrò ọrọ̀-ajé tàbí ìwà rere míì kún ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. “Yá nǹkan fún” jẹ́ ọ̀nà àdánidá láti ṣàfihàn owó tàbí ohun èlò láì dín ìtumọ̀ kù sí owó nìkan; “pàápàá” fi agbára καί ṣáájú “àwọn ẹlẹ́ṣẹ̀” hàn.
