id: LUK.6.22
reference: Luke 6:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: yo
  text: Alábùkún-fún ni ẹ̀yin, nígbà tí àwọn ènìyàn bá kórìíra yín, tí wọ́n bá sì yà yín sọ́tọ̀, tí wọ́n gàn yín, tí wọ́n sì sọ orúkọ yín nù gẹ́gẹ́ bí ohun búburú[a] nítorí Ọmọ Ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n sì polongo yín ní ẹni búburú”; ìyẹn ni pé, kí wọ́n kọ̀ yín ní gbangba tàbí kí wọ́n ka orúkọ yín sí ti àwọn ẹni oníwà ìbàjẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: Alábùkún-fún
  rationale: Ó pa ìrísí ọ̀rọ̀ ìbùkún mọ́, ó sì ní ìwọ̀n ẹ̀sìn àti ọlá tó yẹ ju ọ̀rọ̀ tó túmọ̀ sí ayọ̀ inú lásán lọ.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ipò tí ó lè ṣẹlẹ̀ lọ́jọ́ iwájú tàbí nígbàkigbà.
- source_word: μισήσωσιν
  choice: kórìíra
  rationale: Ó sọ ìkórìíra àti ọ̀tá ní kedere ní èdè Yorùbá òde òní.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἀφορίσωσιν
  choice: yà ... sọ́tọ̀
  rationale: Nínú àyíká inúnibíni yìí, ó túmọ̀ sí mímú ẹni kúrò nínú àwùjọ tàbí ìbáṣepọ̀ àwọn ẹlòmíràn.
- source_word: ὀνειδίσωσιν
  choice: gàn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún fífi ọ̀rọ̀ ẹ̀gàn tàbí àbùkù kan ẹni.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: kọ orúkọ yín sílẹ̀
  rationale: Ó mú ìtumọ̀ ìkọ̀ tàbí ìtakété sí orúkọ ẹni jáde ní Yorùbá àdánidá, láì fi ìtumọ̀ pàtó kan ṣoṣo lé ọ̀rọ̀ Gíríìkì aláwòrán náà lórí.
- source_word: ὡς πονηρὸν
  choice: bí ohun búburú
  rationale: Ó pa ìdájọ́ ìwà búburú tí ọ̀rọ̀ Gíríìkì ń sọ mọ́, ó sì bá ‘orúkọ’ mu lọ́nà àdánidá.
- source_word: ἕνεκα
  choice: nítorí
  rationale: Ó fi ìdí tàbí ohun tó fa inúnibíni náà hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa oyè tí Jésù máa ń lò fún ara rẹ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ Bíbélì mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbolohun ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: kọ orúkọ yín sílẹ̀ bí ohun búburú
  alternative: lé orúkọ yín jáde bí ohun búburú; polongo yín ní ẹni búburú
  rationale: Yíyan yìí jẹ́ Yorùbá tó ṣeé lóye, ó ń tọ́ka sí gbígbé orúkọ tàbí rere ẹni sẹ́gbẹ̀ẹ́, ó sì ṣì jẹ́ kí àìdánilójú nípa ọ̀nà ìkọ̀sílẹ̀ náà wà. Àlàyé ìsàlẹ̀ fi ìtumọ̀ àwùjọ rẹ̀ hàn láì di ẹsẹ náà mọ́ ìtumọ̀ kan ṣoṣo.
- issue: Ìtọ́kasí οἱ ἄνθρωποι lápapọ̀
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Àwọn tí a ń sọ̀rọ̀ nípa wọn ni ènìyàn lápapọ̀, kì í ṣe akọ nìkan.
- issue: Ìtumọ̀ τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: Oyè àtẹ̀dọ́wọ́ yìí pa ọ̀rọ̀ Gíríìkì, lílò rẹ̀ nínú àwọn Ìhìn Rere, àti ìró àwọn ẹsẹ Bíbélì mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ìtẹ̀síwájú ‘nígbà tí ... bá’ lẹ́ẹ̀kan, a sì so àwọn ìṣe tó tẹ̀ lé e pọ̀ ní ọ̀nà Yorùbá àdánidá. Àmì ohùn kún ibi tí ó yẹ.
