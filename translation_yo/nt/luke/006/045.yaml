id: LUK.6.45
reference: Luke 6:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: yo
  text: Ènìyàn rere ń mú ohun rere jáde láti inú ìṣúra rere ọkàn rẹ̀, ẹni búburú sì ń mú ohun búburú jáde láti inú ìṣúra búburú rẹ̀; nítorí ẹnu rẹ̀ ń sọ̀rọ̀ láti inú àkúnwọ́sílẹ̀ ọkàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ìpọ̀lọpọ̀”: “nítorí ẹnu rẹ̀ ń sọ̀rọ̀ láti inú ìpọ̀lọpọ̀ ọkàn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: Ènìyàn rere
  rationale: “Ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἄνθρωπος ní òwe tí ó ń ṣàpẹẹrẹ gbogbo ènìyàn; “ọkùnrin” yóò fi ìtumọ̀ akọ kún un ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ ní àyíká yìí.
- source_word: θησαυροῦ
  choice: ìṣúra
  rationale: Ó pa àwòrán ohun iyebíye tàbí ohun tí a kó jọ sínú ibi kan mọ́, láìtú àkàwé náà sí “ibi ìpamọ́.”
- source_word: καρδίας
  choice: ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún inú ẹni—èrò, ìfẹ́ àti ìpinnu rẹ̀—ó sì pa àkàwé orísun Gíríìkì mọ́.
- source_word: προφέρει
  choice: ń mú … jáde
  rationale: Ó fi hàn pé ohun tí ó wà ní inú ẹni ni ó ń jáde síta, ó sì ṣiṣẹ́ lọ́nà àdánidá nínú ìpele méjèèjì.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: búburú / ohun búburú
  rationale: “Búburú” pa ìyàtọ̀ ìwà rere àti ìwà ibi mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó bá “rere” dọ́gba.
- source_word: περισσεύματος
  choice: àkúnwọ́sílẹ̀
  rationale: Ó mú àwòrán ohun tí ó pọ̀ débi pé ó ń ṣàn jáde; a pa “ọ̀pọ̀lọpọ̀ ohun” mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: λαλεῖ
  choice: ń sọ̀rọ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìsọ̀rọ̀ ní òwe yìí, láìsọ ọ́ di èdè àìbọ̀wọ̀.
- source_word: τὸ στόμα αὐτοῦ
  choice: ẹnu rẹ̀
  rationale: A pa “ẹnu” mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́, kí ìfarahàn ohun tí ó wà nínú ọkàn síta lè hàn gbangba.
theological_decisions:
- issue: Ìyàtọ̀ ìwà rere àti ìwà búburú nínú ἀγαθός/πονηρός
  choice: A lo “rere” àti “búburú” gẹ́gẹ́ bí ẹ̀ka ìwà.
  alternative: “ẹni tó dára … ẹni tí kò dára” tàbí àwọn ọ̀rọ̀ tó kan bí ohun ṣe ń ṣiṣẹ́ nìkan
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìwà ẹni àti ohun tí ìwà inú rẹ̀ ń mú jáde; kò yẹ kí a sọ agbára ìdájọ́ ìwà inú ọ̀rọ̀ Gíríìkì di rírọ̀.
- issue: Ìtumọ̀ àpẹẹrẹ ἄνθρωπος
  choice: “Ènìyàn” gẹ́gẹ́ bí ẹni aṣojú gbogbo ènìyàn
  alternative: “Ọkùnrin” gẹ́gẹ́ bí akọ pàtó
  rationale: Nínú òwe yìí ἄνθρωπος ń tọ́ka sí irú ènìyàn kan, kì í ṣe láti fi ẹ̀kọ́ náà mọ́ akọ nìkan; Yorùbá “ènìyàn” pa ìtumọ̀ yẹn mọ́ láìdín àgbègbè rẹ̀ kù.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere ni a lò. Ìṣọ̀kan “rere/búburú” àti àwòrán “ìṣúra—ọkàn—ẹnu” ni a pa mọ́; ìtúmọ̀ náà yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
