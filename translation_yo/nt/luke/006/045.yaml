- from: Ènìyàn rere ń mú ohun rere jáde láti inú ìṣúra rere ọkàn rẹ̀, ẹni búburú sì ń mú ohun búburú jáde láti inú ìṣúra búburú rẹ̀; nítorí láti inú àkúnwọ́sílẹ̀ ọkàn[a] ni ẹnu rẹ̀ ti ń sọ̀rọ̀.
  to: Ènìyàn rere ń mú ohun rere jáde láti inú ìṣúra rere ọkàn rẹ̀, ẹni búburú sì ń mú ohun búburú jáde láti inú ìṣúra búburú rẹ̀; nítorí ẹnu rẹ̀ ń sọ̀rọ̀ láti inú àkúnwọ́sílẹ̀ ọkàn[a].
  rationale: Àtúnṣe náà gbe àmì [a] sí ‘àkúnwọ́sílẹ̀,’ ìyẹn ni ọ̀rọ̀ Gíríìkì περισσεύματος tí àlàyé náà kan. A tún ṣe àlàyé náà kúrú, kí ó jẹ́ àṣàyàn ìtumọ̀ tí ó sun mọ́ ‘abundance,’ a sì ṣàtúnṣe ìtòlẹ́sẹẹsẹ gbólóhùn ìkẹyìn fún Yorùbá tí ó rọrùn. Ìtumọ̀ ẹsẹ̀ kò yí padà.
