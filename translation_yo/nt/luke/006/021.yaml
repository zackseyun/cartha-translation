id: LUK.6.21
reference: Luke 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: yo
  text: Alábùkún-fún ni ẹ̀yin tí ebi ń pa nísinsin yìí[a], nítorí ẹ ó yó[b]. Alábùkún-fún ni ẹ̀yin tí ẹ ń sọkún nísinsin yìí, nítorí ẹ ó rẹ́rìn-ín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Alábùkún-fún ni àwọn tí ebi ń pa nísinsin yìí … Alábùkún-fún ni àwọn tí ń sọkún nísinsin yìí.” Gíríìkì lo àpilẹ̀kọ pẹ̀lú participle, ṣùgbọ́n àyíká ọ̀rọ̀ náà àti àwọn ọ̀rọ̀-ìṣe ẹni kejì ọ̀pọ̀ ṣe àtìlẹ́yìn fún ọ̀rọ̀ tààrà sí “ẹ̀yin.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹ ó ní ìtẹ́lọ́rùn.” Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí jíjẹ títí ebi fi dá, ó sì tún lè túmọ̀ sí níní ìtẹ́lọ́rùn kíkún.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Alábùkún-fún ni
  rationale: Ọ̀rọ̀ yìí pa ìrísí ọ̀rọ̀ ìbùkún Jesu mọ́, ó sì ní ìwọ̀n ẹ̀sìn tó yẹ ju lílo ọ̀rọ̀ tó túmọ̀ sí ìmọ̀lára ayọ̀ lásán lọ.
- source_word: οἱ πεινῶντες
  choice: ẹ̀yin tí ebi ń pa
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àpilẹ̀kọ pẹ̀lú participle, àwọn ọ̀rọ̀-ìṣe ọjọ́ iwájú jẹ́ ẹni kejì ọ̀pọ̀, àyíká ẹsẹ̀ náà sì jẹ́ ọ̀rọ̀ tààrà sí àwọn ọmọ-ẹ̀yìn.
- source_word: νῦν
  choice: nísinsin yìí
  rationale: Ó mú ìyàtọ̀ láàárín ipò ìsinsin yìí àti ìyípadà ọjọ́ iwájú hàn ní èdè Yorùbá àdánidá.
- source_word: χορτασθήσεσθε
  choice: ẹ ó yó
  rationale: Ó pa àwòrán jíjẹ títí tí ebi fi dá sílẹ̀ mọ́, kò sì fi ẹni tó máa mú ìmúṣẹ náà wá kún ohun tí Gíríìkì sọ.
- source_word: οἱ κλαίοντες
  choice: ẹ̀yin tí ẹ ń sọkún
  rationale: “Sọkún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún κλαίω, ó sì kò fi ìtumọ̀ rẹ̀ mọ́ ọ̀fọ̀ ẹni tó kú nìkan.
- source_word: γελάσετε
  choice: ẹ ó rẹ́rìn-ín
  rationale: Ó pa àwòrán gidi ti ẹ̀rín àti ìyípadà láti inú ẹkún sílẹ̀, dípò kí a túmọ̀ rẹ̀ ní ọ̀nà àlàyé sí ayọ̀ nìkan.
theological_decisions:
- issue: Ọ̀rọ̀ tààrà sí ẹni kejì tàbí gbólóhùn gbogbogbò nípa ẹni kẹta
  choice: “ẹ̀yin tí ebi ń pa” àti “ẹ̀yin tí ẹ ń sọkún”
  alternative: “àwọn tí ebi ń pa” àti “àwọn tí ń sọkún”
  rationale: Àwọn ọ̀rọ̀-ìṣe ọjọ́ iwájú nínú Gíríìkì jẹ́ ẹni kejì ọ̀pọ̀, àyíká Lúùkù sì fi hàn pé Jesu ń bá àwọn ọmọ-ẹ̀yìn rẹ̀ sọ̀rọ̀ tààrà.
- issue: Irú àti àkókò ìyípadà tí a ṣèlérí
  choice: Pa “ẹ ó yó” àti “ẹ ó rẹ́rìn-ín” mọ́ gẹ́gẹ́ bí àwòrán gidi láì ṣàlàyé àkókò tàbí ọ̀nà ìmúṣẹ rẹ̀
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìtẹ́lọ́rùn ti ẹ̀mí nìkan tàbí ìmúṣẹ ní òpin ayé nìkan
  rationale: Ẹsẹ̀ náà ṣèlérí ìyípadà, ṣùgbọ́n kò sọ ní kedere níbí bóyá ó jẹ́ ti ara, ti ẹ̀mí, ti ìsinsin yìí, tàbí ti ọjọ́ ìkẹyìn.
- issue: Ẹni tó ń mú kí àwọn tí ebi ń pa yó
  choice: “ẹ ó yó,” láì dárúkọ olùṣe
  alternative: “Ọlọ́run yóò mú yín yó”
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ passive, ó sì lè tọ́ka sí iṣẹ́ Ọlọ́run, ṣùgbọ́n ẹsẹ̀ náà kò dárúkọ olùṣe ní tààrà; ìtumọ̀ náà kò gbọdọ̀ fi í kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. “Alábùkún-fún ni” pa ìwọ̀n ọ̀rọ̀ ìbùkún mọ́; “nísinsin yìí,” “ẹ ó yó,” àti “ẹ ó rẹ́rìn-ín” jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé lasan. A kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó lé àwọn ìlérí náà lórí.
