id: LUK.6.40
reference: Luke 6:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: yo
  text: Ọmọ-ẹ̀yìn[a] kò ga ju olùkọ́ rẹ̀ lọ, ṣùgbọ́n gbogbo ẹni tí ó ti gba ìdánilẹ́kọ̀ọ́ ní ẹ̀kúnrẹ́rẹ́[b] yóò dà bí olùkọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Akẹ́kọ̀ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó ti múra tán pátápátá,” tàbí “tí ó ti péye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ọmọ-ẹ̀yìn
  rationale: “Ọmọ-ẹ̀yìn” fi ìbáṣepọ̀ akẹ́kọ̀ọ́ pẹ̀lú olùkọ́ tí ó ń tọ́ ọ́ sí ọ̀nà kan hàn, ó sì lágbára ju ọ̀rọ̀ ilé-ẹ̀kọ́ lásán lọ.
- source_word: ὑπὲρ
  choice: ga ju ... lọ
  rationale: Nínú àfiwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ipò tàbí ọlá; “ga ju ... lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan kò sí lókè ẹlòmíràn.
- source_word: διδάσκαλος
  choice: olùkọ́
  rationale: “Olùkọ́” ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ nípa kíkọ́ni mu.
- source_word: κατηρτισμένος
  choice: ẹni tí a bá ti kọ́ ní ẹ̀kúnrẹ́rẹ́
  rationale: Ìṣe àṣeyọrí aláìṣe-tirẹ̀ nínú Gíríìkì fi ẹni tí ìmúrasílẹ̀ tàbí ìkọ́ni rẹ̀ ti péye hàn. Nínú àyíká ọmọ-ẹ̀yìn àti olùkọ́, “kọ́ ní ẹ̀kúnrẹ́rẹ́” mú apá ìdánilẹ́kọ̀ọ́ náà jáde láìpa àwọn ìtumọ̀ mìíràn rẹ́.
- source_word: πᾶς
  choice: gbogbo ẹni
  rationale: Ọ̀rọ̀ náà ní agbára àpapọ̀ nínú òwe yìí; “gbogbo ẹni” jẹ́ Yorùbá àdánidá tí ó kan ẹnikẹ́ni tó bá wà ní ipò náà.
- source_word: ὡς
  choice: dà bí
  rationale: '“Dà bí” sọ àfiwé náà ní Yorùbá tó ṣe kedere: ẹni tí a kọ́ tán yóò jọ olùkọ́ rẹ̀.'
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ Yorùbá “rẹ̀” pa ìtọ́kasí ẹnì kọ̀ọ̀kan mọ́ láìfi akọ tàbí abo kún ohun tí èdè Yorùbá kò fi hàn.
theological_decisions:
- issue: Ìbáṣepọ̀ ọmọ-ẹ̀yìn àti olùkọ́
  choice: 'Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àfiwé ipò àti ìdánilẹ́kọ̀ọ́: ọmọ-ẹ̀yìn kò ga ju olùkọ́ lọ, ẹni tí a sì kọ́ péye yóò dà bí i.'
  alternative: Túmọ̀ “olùkọ́” sí “ọ̀gá” tàbí “olúwa.”
  rationale: διδάσκαλος túmọ̀ sí olùkọ́ ní pàtàkì. “Ọ̀gá” tàbí “olúwa” lè kó ìtumọ̀ àṣẹ tàbí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò fi dandan mú wọlé.
- issue: Ìtumọ̀ κατηρτισμένος
  choice: “tí a bá ti kọ́ ní ẹ̀kúnrẹ́rẹ́,” ní ìbámu pẹ̀lú àyíká ìkọ́ni.
  alternative: “tí a ti múra sílẹ̀ pátápátá” tàbí “tí a ti mú padà bọ̀ sípò.”
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí mímúrasílẹ̀, mímúpéye, tàbí àtúnṣe ní àwọn àyíká mìíràn. Àyíká ọmọ-ẹ̀yìn àti olùkọ́ mú ìtumọ̀ ìdánilẹ́kọ̀ọ́ lágbára, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn ìtumọ̀ mọ́.
- issue: Ìtọ́kasí akọ nínú òwe Gíríìkì
  choice: Lo “gbogbo ẹni ... olùkọ́ rẹ̀,” èyí tí kò samisi akọ tàbí abo ní Yorùbá.
  alternative: Fi ọ̀rọ̀ akọ kan kún un láti fara wé gírámà akọ ẹyọ Gíríìkì.
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú “ẹni” àti “rẹ̀.” Fífi ọ̀rọ̀ akọ kún un yóò jẹ́ àfikún tí orísun kò béèrè, nígbà tí ẹyọ àti ìtọ́kasí ara ẹni ṣì wà ní pípa mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ. Ìṣètò gbolohun pa irú òwe inú Gíríìkì mọ́, nígbà tí “tí a bá ti kọ́ ní ẹ̀kúnrẹ́rẹ́” jẹ́ ọ̀nà Yorùbá àdánidá fún participle passive náà.
