id: LUK.6.25
reference: Luke 6:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: yo
  text: Ègbé ni fún yín, ẹ̀yin tí ẹ ti yó ní báyìí[a], nítorí ebi yóò pa yín. Ègbé ni[b] fún ẹ̀yin tí ẹ ń rẹ́rìn-ín ní báyìí, nítorí ẹ ó ṣọ̀fọ̀, ẹ ó sì sọkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin tí a ti mú yó ní báyìí.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ igbe ìbànújẹ́ pé, “Ó mà ṣe fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ègbé ni fún
  rationale: Ó pa agbára ìkìlọ̀ àsọtẹ́lẹ̀ àti ìdájọ́ mọ́; kò sọ ọ́ di àánú lásán.
- source_word: ἐμπεπλησμένοι
  choice: ẹ yó
  rationale: Ó fi ipò ìtẹ́lọ́rùn tí ó wà nísinsìnyí hàn ní èdè Yorùbá àdánidá, ó sì dá ìyàtọ̀ rẹ̀ sí ebi ọjọ́ iwájú dúró.
- source_word: νῦν
  choice: ní báyìí
  rationale: Ó pa ìyàtọ̀ àkókò láàárín ipò ìsinsìnyí àti ìyípadà ọjọ́ iwájú mọ́.
- source_word: πεινάσετε
  choice: ebi yóò pa yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ebi yóò dé bá wọn lọ́jọ́ iwájú.
- source_word: γελῶντες
  choice: ẹ ń rẹ́rìn-ín
  rationale: Ó fi ìṣe tí wọ́n ń ṣe ní báyìí hàn, láì mú ìtumọ̀ rẹ̀ gbòòrò sí ayọ̀ lápapọ̀.
- source_word: πενθήσετε
  choice: ẹ óò ṣọ̀fọ̀
  rationale: Ó dá ìtumọ̀ ọ̀fọ̀ àti ìbànújẹ́ jíjinlẹ̀ dúró, ó sì yà á sọ́tọ̀ kúrò nínú sísọkún.
- source_word: κλαύσετε
  choice: ẹ ó sì sọkún
  rationale: Ó pa ìgbésókè ọ̀rọ̀ láti ṣọ̀fọ̀ dé sísọkún mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tàbí ìpìlẹ̀ fún ọ̀rọ̀ ègbé ní Yorùbá òde òní tí ó ṣe kedere.
theological_decisions:
- issue: Irú ọ̀rọ̀ ègbé yìí
  choice: Ìkìlọ̀ àsọtẹ́lẹ̀ nípa ìyípadà àti ìdájọ́ tí ń bọ̀ sórí àwọn tí ó yó tí wọ́n sì ń rẹ́rìn-ín ní báyìí
  alternative: Àkíyèsí lásán nípa bí ipò ayé ṣe máa ń yí padà
  rationale: Àtúnsọ ‘ègbé,’ àwọn ọ̀rọ̀ ìṣe ọjọ́ iwájú, àti ìfarawé rẹ̀ pẹ̀lú àwọn ìbùkún tó yí i ká fi hàn pé ìkìlọ̀ tó jinlẹ̀ ju àkíyèsí nípa ayé lọ ni; síbẹ̀, a kò ṣàlàyé ọ̀nà tí ìyípadà náà yóò gbà ṣẹlẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. ‘Ègbé ni fún’ pa agbára ọ̀rọ̀ ìdájọ́ mọ́, nígbà tí ‘ebi yóò pa yín,’ ‘ṣọ̀fọ̀,’ àti ‘sọkún’ jẹ́ àwọn àṣàyàn Yorùbá àdánidá.
