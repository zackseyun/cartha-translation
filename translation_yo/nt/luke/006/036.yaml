  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: yo
  text: Ẹ jẹ́ aláàánú[a], gẹ́gẹ́ bí Baba yín ṣe jẹ́ aláàánú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ jẹ́ ẹni tí ó ní ìyọ́nú.” Ọ̀rọ̀ ajẹtífù Gíríìkì náà lè tọ́ka sí ẹni tí ìyọ́nú ń sún láti fi àánú hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Ẹ máa
  rationale: Àṣẹ onítẹ̀síwájú fún ọ̀pọ̀ ènìyàn ni; “Ẹ máa” fi ìṣe tí ó yẹ kí ó jẹ́ ìwà wọn ní gbogbo ìgbà hàn lọ́nà Yorùbá àdánidá.
- source_word: οἰκτίρμονες
  choice: ṣàánú
  rationale: Ọ̀rọ̀-ìṣe “ṣàánú” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ jíjẹ́ ẹni aláàánú, ó sì lè ní ìtumọ̀ ìyọ́nú àti fífi àánú hàn.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí ... ti
  rationale: Ó fi ìfiwéra àti àpẹẹrẹ hàn, kì í ṣe ìdí; ìwà Baba ni a gbé kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ.
- source_word: πατὴρ ὑμῶν
  choice: Baba yín
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì láì fi “ọ̀run” kún un, nítorí kò sí irú àfikún bẹ́ẹ̀ nínú ẹsẹ yìí.
- source_word: οἰκτίρμων
  choice: ń ṣàánú
  rationale: A lo gbólóhùn kan náà ní ìtumọ̀ pẹ̀lú àkọ́kọ́ láti pa ìsopọ̀ ọ̀rọ̀ náà mọ́, ní Yorùbá tí ó ṣe àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ àṣẹ náà pẹ̀lú ìwà Baba
  choice: 'Ìṣàánú Baba ni àpẹẹrẹ fún ìwà àwọn ọmọ-ẹ̀yìn: “Ẹ máa ṣàánú, gẹ́gẹ́ bí Baba yín ti ń ṣàánú.”'
  alternative: Ẹ máa ṣàánú, nítorí Baba yín ń ṣàánú.
  rationale: καθὼς jẹ́ ìfiwéra (“gẹ́gẹ́ bí”), kì í ṣe gbólóhùn tó ń sọ ìdí (“nítorí”); èyí pa àpẹẹrẹ ìwà Baba mọ́ láì fi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. A yan “Ẹ máa ṣàánú” dípò gbólóhùn orúkọ-àpèjúwe tí ó le koko, kí àṣẹ onítẹ̀síwájú náà lè ṣe àdánidá, kedere, àti ọ̀wọ̀ ní èdè Yorùbá òde òní.
