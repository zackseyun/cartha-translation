  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: yo
  text: Àwọn tí wọ́n wá láti gbọ́ ọ àti láti wò sàn nínú àwọn àìsàn wọn; àwọn tí àwọn ẹ̀mí àìmọ́ ń yọ lẹ́nu sì ń rí ìwòsàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: Àwọn tí wọ́n wá
  rationale: Ọ̀rọ̀ arọ́pò-asopọ̀ οἳ ń tọ́ka sí ọ̀pọ̀ ènìyàn inú ẹsẹ tó ṣáájú; ‘Àwọn tí wọ́n wá’ jẹ́ ìtẹ̀síwájú àdánidá ní Yorùbá.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: láti gbọ́ ọ̀rọ̀ rẹ̀
  rationale: Ète ni infinitive náà ń fi hàn. Ní Yorùbá, ‘gbọ́ ọ̀rọ̀ rẹ̀’ túmọ̀ sí fífetí sí ohun tí ó ń kọ́ni, ó sì dùn ju ‘gbọ́ ọ’ lọ ní àyíká yìí.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: láti rí ìwòsàn kúrò nínú àwọn àìsàn wọn
  rationale: ‘Rí ìwòsàn’ jẹ́ ọ̀nà Yorùbá àdánidá fún passive ‘to be healed’; ‘kúrò nínú’ pa ìtumọ̀ ìyapa tí ἀπό ní mọ́.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: àwọn tí àwọn ẹ̀mí àìmọ́ ń yọ lẹ́nu
  rationale: Present passive participle náà ṣàpèjúwe àwọn tí àwọn ẹ̀mí náà ń da láàmú. ‘Ń yọ lẹ́nu’ kò fi ìwọ̀n ìyà tó lágbára ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ béèrè lọ.
- source_word: ἐθεραπεύοντο
  choice: ń rí ìwòsàn
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ tàbí tí ń ṣẹlẹ̀ léraléra, èyí tí imperfect Gíríìkì lè tọ́ka sí, hàn.
theological_decisions:
- issue: Ìtumọ̀ πνευμάτων ἀκαθάρτων ní àyíká ìdààmú ẹ̀mí búburú
  choice: àwọn ẹ̀mí àìmọ́
  alternative: àwọn ẹ̀mí búburú; àwọn ẹ̀mí èṣù
  rationale: ‘Ẹ̀mí àìmọ́’ pa àwòrán ọ̀rọ̀ Gíríìkì àti ọ̀nà tí àwọn Ìhìn Rere gbà ń pè wọ́n mọ́, láì túmọ̀ ọ́ sí ọ̀rọ̀ míì tó túbọ̀ jẹ́ àlàyé.
- issue: Aspect ti ἐθεραπεύοντο
  choice: ń rí ìwòsàn
  alternative: rí ìwòsàn
  rationale: Imperfect náà lè ṣàfihàn ìwòsàn tí ń lọ lọ́wọ́ tàbí tí ń ṣẹlẹ̀ sí ọ̀pọ̀ ènìyàn léraléra; ‘ń’ pa ìtumọ̀ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A kò fi àlàyé ẹ̀kọ́ ìjọ kankan kún un.
