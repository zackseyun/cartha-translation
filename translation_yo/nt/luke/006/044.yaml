  source_fidelity: Ìtumọ̀ náà pa ìṣọ̀kan ọ̀rọ̀ òwe náà, ìtumọ̀ ‘igi kọ̀ọ̀kan,’ ‘ẹ̀so tirẹ̀,’ ọ̀pọ̀tọ́, àti èso àjàrà mọ́. Ṣùgbọ́n ‘ewéko ẹlẹ́gùn-ún’ àti ‘igbó ẹlẹ́gùn-ún’ kò jẹ́ ọ̀rọ̀ Yorùbá boṣewa tó dájú fún ἀκάνθαι àti βάτος, ó sì yẹ kí a fi ìyàtọ̀ tó hàn kedere sí àwọn méjèèjì.
