revisions:
- from: Nítorí igi kọ̀ọ̀kan ni a fi èso tirẹ̀ mọ̀. Nítorí wọn kì í ká ọ̀pọ̀tọ́ lára àwọn ewéko ẹlẹ́gùn-ún, bẹ́ẹ̀ ni wọn kì í ká èso àjàrà lára igbó ẹlẹ́gùn-ún.[a]
  to: Nítorí a máa ń fi èso tirẹ̀ dá igi kọ̀ọ̀kan mọ̀. Nítorí wọn kì í ká ọ̀pọ̀tọ́ láàrín ẹ̀gún, bẹ́ẹ̀ ni wọn kì í ká èso àjàrà láti inú igbó ẹ̀gún.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò dájú, ‘ẹlẹ́gùn-ún,’ pẹ̀lú ‘ẹ̀gún’ àti ‘igbó ẹ̀gún.’ Ó pa ìyàtọ̀ láàrin ἀκανθῶν (ẹ̀gún ní ọ̀pọ̀) àti βάτος (igbó ẹ̀gún) mọ́, láì sọ irú ọ̀gbìn pàtó kan. A tún mú gbolohun àkọ́kọ́ wá sí ìlò òwe Yorùbá tó wọ́pọ̀, láì yí ìtumọ̀ tàbí agbára àpẹẹrẹ rẹ̀ padà.
