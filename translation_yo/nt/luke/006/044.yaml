id: LUK.6.44
reference: Luke 6:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: yo
  text: Nítorí a máa ń fi èso tirẹ̀ dá igi kọ̀ọ̀kan mọ̀. Nítorí wọn kì í ká ọ̀pọ̀tọ́ láàrín ẹ̀gún, bẹ́ẹ̀ ni wọn kì í ká èso àjàrà láti inú igbó ẹ̀gún.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: igi kọ̀ọ̀kan
  rationale: Ó pa ìtumọ̀ pínpín ti ἕκαστον mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘igi kọ̀ọ̀kan.’
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé ti γάρ mọ́ nínú gbólóhùn méjèèjì.
- source_word: ἐκ τοῦ ἰδίου καρποῦ γινώσκεται
  choice: ni a fi èso tirẹ̀ mọ̀
  rationale: Àkójọpọ̀ ‘a fi ... mọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ohun tí a fi ń dá ohun kan mọ̀; ‘tirẹ̀’ pa ìtẹnumọ́ ἰδίου mọ́.
- source_word: ἀκανθῶν
  choice: àwọn ewéko ẹlẹ́gùn-ún
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ewéko tàbí igbó onígun ní gbogbogbòò; yíyan yìí kò fi irú ewéko kan pàtó lé e lórí.
- source_word: συλλέγουσιν
  choice: ká
  rationale: ‘Ká’ bá ìkórè èso mu, ó sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó ṣe déédéé ní Yorùbá.
- source_word: σῦκα
  choice: ọ̀pọ̀tọ́
  rationale: Èyí ni orúkọ Yorùbá tó wọ́pọ̀ fún èso fig.
- source_word: βάτου
  choice: igbó ẹlẹ́gùn-ún
  rationale: Ó sọ irú igbó kékeré onígun tí βάτος ń tọ́ka sí láì dá irú ọ̀gbìn pàtó kan mọ́.
- source_word: σταφυλήν
  choice: èso àjàrà
  rationale: Ó mú ìtumọ̀ èso grape jáde lọ́nà àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ẹyọ.
- source_word: τρυγῶσιν
  choice: ká
  rationale: Ní Yorùbá, ‘ká’ ni ọ̀nà àdánidá fún kíkórè èso àjàrà; fífi ọ̀rọ̀ mìíràn lélẹ̀ láti fi ìyàtọ̀ sí συλλέγουσιν lè dà bí èdè àjèjì.
theological_decisions:
- issue: Agbára àpẹẹrẹ inú àwòrán èso
  choice: Pa òwe iṣẹ́ àgbẹ̀ náà mọ́ láì ṣàlàyé pé ó túmọ̀ sí ìwà tàbí iṣẹ́ ènìyàn.
  alternative: Fẹ̀ ọ́ sí i ní ìtumọ̀ pé èso dúró fún ìwà rere tàbí iṣẹ́ ènìyàn.
  rationale: Gíríìkì fi àwòrán igi àti èso hàn ní tààrà; àyíká ni yóò jẹ́ kí olùkà rí ìlò rẹ̀, nítorí náà ìtumọ̀ kò gbọ́dọ̀ pinnu àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘a fi ... mọ̀’ fún gbolohun àṣà-òwe; a sì lo ‘wọn kì í’ gẹ́gẹ́ bí ẹni-àìsọ pàtó, bí Gíríìkì ṣe rí.
