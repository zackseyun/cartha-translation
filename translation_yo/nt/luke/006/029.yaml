id: LUK.6.29
reference: Luke 6:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: yo
  text: Ẹni tí ó lù ọ ní ẹ̀rẹ̀kẹ́[a], fi ẹ̀rẹ̀kẹ́ kejì rẹ hàn án náà[b]; ẹni tí ó sì gba aṣọ àwọ̀lékè rẹ[c], má ṣe dí i lọ́wọ́ láti gba aṣọ àwọ̀tẹ́lẹ̀ rẹ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní egungun ẹ̀rẹ̀kẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “fi ẹ̀rẹ̀kẹ́ kejì hàn án náà” tàbí “fún un náà”; kì í ṣe dandan pé “yí ẹ̀rẹ̀kẹ́ kejì sí i.”
    reason: alternative_reading
  - marker: c
    text: “Aṣọ àwọ̀lékè” (ἱμάτιον) ni aṣọ òde; “aṣọ àwọ̀tẹ́lẹ̀” (χιτών) sì ni aṣọ inú.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: Ẹni tí ó bá gbá ọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ articular participle náà ń tọ́ka sí ẹnikẹ́ni tó bá ṣe ìṣe náà. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: ní ẹ̀rẹ̀kẹ́
  rationale: σιαγών lè túmọ̀ sí ẹ̀rẹ̀kẹ́ tàbí egungun ẹ̀rẹ̀kẹ́. Nínú ọ̀rọ̀ nípa lílu ojú, “ẹ̀rẹ̀kẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ, láìfi apá ara pàtó kan kún un ju ti Gíríìkì lọ.
- source_word: πάρεχε καὶ τὴν ἄλλην
  choice: fi èkejì hàn án pẹ̀lú
  rationale: παρέχω túmọ̀ sí fífúnni, fífi síwájú, tàbí fífi hàn. “Fi èkejì hàn án” pa ìṣe fífi ẹ̀rẹ̀kẹ́ kejì síwájú mọ́, láìyá ọ̀rọ̀ Lúùkù sí “yí” tí kò sí nínú gbólóhùn Gíríìkì yìí; “pẹ̀lú” sì dúró fún καί.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: ẹni tí ó bá sì gba ... rẹ
  rationale: αἴρω níbí ní ìtumọ̀ gbígbà tàbí mímú ohun kúrò lọ́dọ̀ ẹni. “Gba ... rẹ” jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìṣe yẹn nínú àyíká ọ̀rọ̀ yìí.
- source_word: τὸ ἱμάτιον
  choice: aṣọ àwọ̀lékè
  rationale: ἱμάτιον ni aṣọ òde tí a wọ lé aṣọ mìíràn. Ọ̀rọ̀ àpèjúwe yìí pa ìyàtọ̀ rẹ̀ sí χιτών mọ́, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: τὸν χιτῶνα
  choice: aṣọ àwọ̀tẹ́lẹ̀
  rationale: χιτών jẹ́ aṣọ inú tí a wọ sábà ní abẹ́ aṣọ òde. “Aṣọ àwọ̀tẹ́lẹ̀” jẹ́ kedere, ó sì yẹra fún fífi irú aṣọ òde òní kan pàtó rọ́pò rẹ̀.
- source_word: μὴ κωλύσῃς
  choice: má ṣe dí i lọ́wọ́
  rationale: κωλύω túmọ̀ sí dídènà tàbí dídá ẹnìkan dúró. Gbólóhùn Yorùbá yìí pa àṣẹ òdì náà mọ́, ó sì bá àyíká ẹni tó ń gba aṣọ mu.
theological_decisions:
- issue: Bóyá kí a mú ọ̀rọ̀ Lúùkù bá gbólóhùn Mátíù tó gbajúmọ̀, “yí ẹ̀rẹ̀kẹ́ kejì,” mu
  choice: Pa ọ̀rọ̀ Lúùkù mọ́ gẹ́gẹ́ bí fífi ẹ̀rẹ̀kẹ́ kejì hàn
  alternative: yí ẹ̀rẹ̀kẹ́ kejì sí i
  rationale: Ọ̀rọ̀ Gíríìkì ni πάρεχε, “fi síwájú/fúnni,” kì í ṣe ọ̀rọ̀-ìṣe tó túmọ̀ sí “yí.” Èyí pa ìyàtọ̀ inú ìròyìn Lúùkù mọ́, kò sì fa ọ̀rọ̀ láti inú ìwé Mímọ́ mìíràn wọlé.
- issue: Bóyá kí a fi àlàyé tó rọ àṣẹ náà tàbí tó sọ bó ṣe yẹ kí a lò ó kún ọ̀rọ̀ pàtàkì
  choice: Túmọ̀ àwọn àṣẹ náà ní tààrà láìfi ààlà ìtumọ̀ kún un
  alternative: Fi àlàyé nípa àìgbẹ̀san tàbí àsọdùn kún ọ̀rọ̀ pàtàkì
  rationale: Ẹsẹ̀ náà fi àwọn àṣẹ sí ẹni kejì ní tààrà. Ìtumọ̀ gbọ́dọ̀ pa agbára àti ìnira ẹ̀kọ́ Jésù mọ́, láìyanju àríyànjiyàn ìtumọ̀ nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹni tí ó bá” ń sọ àṣẹ gbogbogbò ní ọ̀nà àdánidá; “fi èkejì hàn án” sì yẹra fún dídàpọ̀ ọ̀rọ̀ Lúùkù mọ́ ti Mátíù. Àwọn ọ̀rọ̀ aṣọ jẹ́ àpèjúwe kedere dípò ọ̀rọ̀ àtijọ́ tí ọ̀pọ̀ òǹkàwé lè má mọ̀.
