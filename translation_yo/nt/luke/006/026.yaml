source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: yo
  text: Ègbé ni fún yín nígbà tí gbogbo ènìyàn bá sọ ohun rere nípa yín[a], nítorí bákan náà ni àwọn baba wọn[b] ńṣe nígbà gbogbo sí àwọn wòlíì èké.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá sọ̀rọ̀ rere nípa yín.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “àwọn baba wọn”; ìyẹn ni, àwọn ìran wọn ṣáájú.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ àti ìdájọ́ àwọn wòlíì mọ́; fífi “fún yín” kún un mú ẹni tí a ń bá sọ hàn ní Yorùbá, gẹ́gẹ́ bí ὑμᾶς ṣe fi hàn nínú gbólóhùn náà.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ipò tí ó lè ṣẹlẹ̀ ní gbogbo ìgbà, ó sì pa agbára ìkìlọ̀ náà mọ́.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: bá ń sọ̀rọ̀ rere nípa yín
  rationale: Ó tú ìtumọ̀ àpólà náà jáde gẹ́gẹ́ bí sísọ ohun rere tàbí ọ̀rọ̀ ojú rere nípa ẹnìkan, kì í ṣe sísọ̀rọ̀ lọ́nà tó tọ́ nìkan.
- source_word: πάντες οἱ ἄνθρωποι
  choice: gbogbo ènìyàn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó kó gbogbo ènìyàn jọ láìfi akọ tàbí abo sí i.
- source_word: κατὰ τὰ αὐτά
  choice: bákan náà
  rationale: 'Ó mú ìtumọ̀ ìfiwéra náà jáde ní ṣókí: àwọn ìran àtijọ́ hùwà lọ́nà kan náà sí àwọn wòlíì èké.'
- source_word: γάρ
  choice: nítorí
  rationale: Ó fi ìdí tí a fi sọ ègbé náà hàn ní kedere, gẹ́gẹ́ bí àsopọ̀ ìṣàlàyé nínú Gíríìkì.
- source_word: ἐποίουν
  choice: ti máa ń ṣe
  rationale: Ó fi ìṣe àṣà tàbí ìṣe tí ó ń ṣẹlẹ̀ léraléra ní àkókò àtijọ́ hàn, bí imperfect Gíríìkì ṣe ń tọ́ka sí.
- source_word: τοῖς ψευδοπροφήταις
  choice: sí àwọn wòlíì èké
  rationale: “Sí” fi àwọn ẹni tí ìṣe náà dojú kọ hàn, “wòlíì èké” sì jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún ψευδοπροφήταις.
- source_word: οἱ πατέρες αὐτῶν
  choice: àwọn baba wọn
  rationale: Ó tẹ̀ lé àwòrán ìbílẹ̀ Gíríìkì, ó sì pa agbára ìfiwéra láàárín àwọn ìran mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó túmọ̀ sí àwọn ìran wọn àtijọ́.
theological_decisions:
- issue: Ohun tí ìfiwéra pẹ̀lú àwọn wòlíì èké ń tọ́ka sí àti agbára rẹ̀
  choice: Ẹsẹ̀ náà kìlọ̀ pé ìyìn tí gbogbo ènìyàn ń fi fún ẹni lè bá àpẹẹrẹ bí àwọn ìran àtijọ́ ṣe hù sí àwọn wòlíì èké mu.
  alternative: Kí a túmọ̀ rẹ̀ bí ìdálẹ́bi gbogbo ọ̀rọ̀ rere tí ẹnikẹ́ni bá sọ nípa ọmọ-ẹ̀yìn, láìsí ààlà kankan.
  rationale: γάρ àti κατὰ τὰ αὐτά so ègbé náà mọ́ àpẹẹrẹ ìtàn kan. Ìtumọ̀ yìí pa ìkìlọ̀ sí ìtẹ́wọ́gbà gbogbo ènìyàn mọ́ láìsọ ọ́ di ìkọ̀sílẹ̀ gbogbo ìyìn rere.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó ṣe kedere sí òǹkàwé òde òní. “Ègbé ni fún yín” pa ohùn ìkìlọ̀ àwọn wòlíì mọ́, “ti máa ń ṣe” sì mú ìṣe àṣà àtijọ́ tí imperfect Gíríìkì ń fi hàn jáde. Àwọn àmì ìsàlẹ̀ ojú ìwé [a] àti [b] wà níbi tí wọ́n bá ọ̀rọ̀ mu.
