revisions:
- from: Ní àwọn ọjọ́ wọ̀nyẹn, ó ṣẹlẹ̀ pé ó jáde lọ sí orí òkè láti gbàdúrà, ó sì fi gbogbo òru náà gbàdúrà sí Ọlọ́run.[a]
  to: Ní àwọn ọjọ́ wọ̀nyẹn, ó ṣẹlẹ̀ pé ó jáde lọ sí òkè láti gbàdúrà, ó sì lo gbogbo òru náà nínú àdúrà sí Ọlọ́run.[a]
  rationale: Àtúnṣe náà yọ ìtumọ̀ àfikún “orí” kúrò nínú ibi tí Gíríìkì ti sọ “òkè” nìkan. Ó tún tún apá kejì ṣe sí “lo gbogbo òru náà nínú àdúrà sí Ọlọ́run” láti pa ìtumọ̀ durative àti gbolohun ἐν τῇ προσευχῇ τοῦ θεοῦ mọ́ ní Yorùbá adayeba. Àmì ìsàlẹ̀ ojú ìwé náà wà ní ibi tó tọ́, ó sì pa àṣàyàn ìrísí durative mọ́.
