id: LUK.6.12
reference: Luke 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, ó ṣẹlẹ̀ pé ó jáde lọ sí òkè láti gbàdúrà, ó sì lo gbogbo òru náà nínú àdúrà sí Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń bá a lọ nínú àdúrà sí Ọlọ́run ní gbogbo òru náà.”
    reason: Àṣàyàn yìí mú ìṣe tí ń bá a lọ nínú ἦν διανυκτερεύων hàn ní ọ̀nà tó sún mọ́ ìrísí Gíríìkì.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ó ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà tí Lúùkù fi ń bẹ̀rẹ̀ ìṣẹ̀lẹ̀ tuntun. ‘Ó ṣẹlẹ̀ pé’ mú ìtumọ̀ náà jáde ní Yorùbá àdánidá láì fi ọ̀rọ̀ àsopọ̀ tí kò pọndandan kún un.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Gbólóhùn àkókò yìí tọ́ka sí àkókò tí ìtàn tó yí ẹsẹ yìí ká ń sọ̀rọ̀ nípa rẹ̀; ‘àwọn ọjọ́ wọ̀nyẹn’ tún pa agbára ταύταις mọ́.
- source_word: ἐξελθεῖν αὐτὸν
  choice: ó jáde lọ
  rationale: ‘Jáde lọ’ pa ìṣípòpadà inú ἐξέρχομαι mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: εἰς τὸ ὄρος
  choice: sí orí òkè
  rationale: ‘Orí òkè’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún ibi gíga tí ὄρος ń tọ́ka sí, láì dá irú òkè náà mọ̀ ju ohun tí orísun sọ lọ.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: Ó fi ète tí ó fi jáde lọ hàn ní kedere, gẹ́gẹ́ bí infinitive ète inú Gíríìkì.
- source_word: ἦν διανυκτερεύων
  choice: ó sì fi gbogbo òru náà gbàdúrà
  rationale: Ìtumọ̀ yìí mú ìṣe tó ń bá a lọ àti lílo gbogbo òru tí periphrastic imperfect náà fi hàn jáde ní Yorùbá tó rọrùn láti lóye.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: gbàdúrà sí Ọlọ́run
  rationale: ‘Sí Ọlọ́run’ ka genitive náà gẹ́gẹ́ bí ẹni tí àdúrà ń lọ sí, èyí tó bá àyíká ọ̀rọ̀ mu, tí kò sì dà bí ẹni pé Ọlọ́run fúnra rẹ̀ ni ó ń gbàdúrà.
theological_decisions:
- issue: Ìbáṣepọ̀ τοῦ θεοῦ pẹ̀lú àdúrà Jésù
  choice: àdúrà sí Ọlọ́run
  alternative: àdúrà Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ fi Jésù hàn gẹ́gẹ́ bí ẹni tó ń darí àdúrà rẹ̀ sí Ọlọ́run. Ìtumọ̀ yìí kò sọ pé Ọlọ́run ni olúwa àdúrà náà tàbí pé òun fúnra rẹ̀ ni ó ń gbàdúrà, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo ‘ó jáde lọ’ àti ‘fi gbogbo òru náà gbàdúrà’ nítorí pé wọ́n jẹ́ àdánidá fún òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn durative tó sún mọ́ ìrísí Gíríìkì mọ́.
