  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìbéèrè àbáwí náà, ìtẹnumọ́ αὐτός, ìbéèrè ìfẹ̀yọ̀ǹda ‘jẹ́ kí n’, àti àṣẹ pé kí a kọ́kọ́ yọ ohun ńlá náà. Síbẹ̀, ‘ìdí igi’ sábà máa ń túmọ̀ sí gbòǹgbò tàbí ìpìlẹ̀ igi, kì í ṣe δοκός, ìyẹn igi ìkọ́lé ńlá/àkọ́lé. ‘Ojú ara rẹ’ tún fi ‘ara’ kún ọ̀rọ̀ tí kò sí nínú Gíríìkì, níbi tí ‘ojú rẹ’ ti tó.
  naturalness: ‘Báwo ni ìwọ ṣe lè sọ’ àti ‘jẹ́ kí n yọ’ jẹ́ Yorùbá boṣewa tó rọrùn. ‘Igi ìkọ́lé ńlá’ jẹ́ àṣàyàn tó ṣe kedere, tó sì dá àwòrán àsọdùn ohun kékeré nínú ojú sí igi ìkọ́lé ńlá nínú ojú dúró. ‘Ìwọ yóò rí kedere’ jẹ́ ìṣètò gbolohun tó rọrùn ju ‘ìwọ yóò sì ríran kedere’ lọ nínú àyíká yìí.
  terminology: ‘Arákùnrin’ pa akọ-ẹyọ ἀδελφός mọ́; ‘alágàbàgebè’ bá ὑποκριτά mu gẹ́gẹ́ bí ìbáwí tààrà. A tún lo ‘èérún igi’ fún κάρφος. A rọ́pò ‘ìdí igi’ pẹ̀lú ‘igi ìkọ́lé ńlá’ fún δοκός, nítorí pé ọ̀rọ̀ tuntun náà tọ́ka sí igi ńlá tí a fi ń kọ́lé, kì í ṣe gbòǹgbò igi.
