  - severity: low
    issue: ‘Yóò sì ríran kedere’
    rationale: ‘Yóò rí kedere’ jẹ́ ìkọ̀wé Yorùbá tó rọrùn, ó sì pa διαβλέψεις mọ́ láì yí àwòrán rírí padà sí òye àfiwé.
