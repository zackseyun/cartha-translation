id: LUK.6.42
reference: Luke 6:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: yo
  text: Báwo ni ìwọ ṣe lè sọ fún arákùnrin rẹ[a] pé, ‘Arákùnrin, jẹ́ kí n yọ èérún igi tí ó wà ní ojú rẹ,’ nígbà tí ìwọ fúnra rẹ kò rí igi ìkọ́lé ńlá tí ó wà ní ojú rẹ? Alágàbàgebè! Kọ́kọ́ yọ igi ìkọ́lé ńlá náà kúrò ní ojú rẹ[b], nígbà náà ni ìwọ yóò sì rí kedere láti yọ èérún igi tí ó wà ní ojú arákùnrin rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì ἀδελφός, ọ̀rọ̀ ìbátan akọ, ẹyọ kan. Ẹ̀kọ́ náà lè kan àwọn ẹlòmíràn pẹ̀lú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì jẹ́ akọ.
    reason: cultural_note
  - marker: b
    text: “Igi ìkọ́lé ńlá” túmọ̀ Gíríìkì δοκός, ìyẹn igi ńlá tí a fi ń kọ́lé. A tún lè pè é ní “pákó ńlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Báwo ni ìwọ ṣe lè sọ
  rationale: Ó pa ìbéèrè àtakò nípa bí ẹni náà ṣe lè ṣe bẹ́ẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: arákùnrin / Arákùnrin / arákùnrin
  rationale: Ó tẹ̀ lé ọ̀rọ̀ ìbátan akọ ẹyọ kan tí Gíríìkì lò, láì sọ ọ́ di ọ̀rọ̀ tí kò ní akọ tàbí abo.
- source_word: ἄφες ἐκβάλω
  choice: jẹ́ kí n yọ
  rationale: ἄφες jẹ́ ìbéèrè fún àṣẹ níbí; ‘jẹ́ kí n’ ni àfihàn Yorùbá tó bá a mu jù.
- source_word: κάρφος
  choice: èérún igi
  rationale: Ó fi ohun kékeré gbígbẹ tí ó lè wọ ojú hàn, ó sì dá ìyàtọ̀ rẹ̀ sí δοκός dúró kedere.
- source_word: δοκός
  choice: ìdí igi
  rationale: Ó ń tọ́ka sí igi ńlá tí a fi ń gbé ilé ró; yíyan yìí pa àwòrán àsọdùn mọ́ ní Yorùbá.
- source_word: αὐτός
  choice: ìwọ fúnra rẹ
  rationale: Ó mú ìtẹnumọ́ àti ìfiwéra inú ọ̀rọ̀ Gíríìkì jáde.
- source_word: οὐ βλέπων
  choice: kò rí
  rationale: Ó sọ àìrí tàbí àìfiyèsí ẹni náà ní ọ̀nà Yorùbá tó rọrùn, láì túmọ̀ àwòrán náà sí òmíràn.
- source_word: ὑποκριτά
  choice: Alágàbàgebè!
  rationale: Ọ̀rọ̀ ìbáwí tààrà fún ẹni kan ni; ‘alágàbàgebè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ìṣe rẹ̀ kò bá ohun tí ó ń fi ara hàn mu.
- source_word: διαβλέψεις
  choice: yóò ... ríran kedere
  rationale: Ó pa ìtumọ̀ rírí dáadáa tàbí kedere mọ́, ó sì bá àwòrán ojú mu.
- source_word: ἐκβάλω / ἔκβαλε / ἐκβαλεῖν
  choice: yọ / yọ ... kúrò / láti yọ
  rationale: ‘Yọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún mímú ohun kan kúrò ní ojú, ó sì jẹ́ kí ìṣe náà wà ní ìṣọ̀kan jálẹ̀ ẹsẹ náà.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφός nínú ẹ̀kọ́ ìwà rere
  choice: arákùnrin
  alternative: ẹlẹgbẹ́ onígbàgbọ́; arákùnrin tàbí arábìnrin
  rationale: Gíríìkì jẹ́ akọ, ẹyọ kan nínú gbogbo ìtọ́kasí mẹ́tẹ̀ẹ̀ta. Ìtumọ̀ náà tẹ̀ lé ìrísí orísun, bó tilẹ̀ jẹ́ pé ìlànà ẹ̀kọ́ náà lè kan gbogbo ènìyàn.
- issue: Ìyàtọ̀ àsọdùn láàárín κάρφος àti δοκός
  choice: èérún igi ... ìdí igi
  alternative: kókó kékeré ... igi ńlá; èérún ... pákó
  rationale: Ó pa àwòrán ohun kékeré gan-an sí igi ìkọ́lé ńlá mọ́, láì dín líle ìbáwí náà kù tàbí sọ àsọdùn náà di gbolohun lasan.
- issue: Ìtumọ̀ διαβλέψεις gẹ́gẹ́ bí rírí tàbí òye ìwà rere
  choice: ríran kedere
  alternative: lóye kedere
  rationale: Orísun ń bá àwòrán ojú lọ. ‘Ríran kedere’ pa àwòrán náà mọ́, láì fi ìtumọ̀ àlàyé kan rọ́pò rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘èérún igi’ àti ‘ìdí igi’ láti mú àsọdùn inú àwòrán Gíríìkì yé òǹkàwé òde òní.
