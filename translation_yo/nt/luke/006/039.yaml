source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: yo
  text: Ó sì tún sọ àkàwé kan fún wọn pé, “Ṣé afọ́jú lè darí afọ́jú?[a] Ṣé àwọn méjèèjì kò ní ṣubú sínú kòtò?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ méjèèjì wà ní ìrísí akọ ẹyọ, ṣùgbọ́n a lò wọ́n gẹ́gẹ́ bí aṣojú fún ẹnikẹ́ni. Èdè Yorùbá “afọ́jú” kò fi akọ tàbí abo hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kòtò omi.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí kòtò tàbí irú kòtò bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: tún
  rationale: Lẹ́yìn δὲ, καὶ ní agbára àfikún; “tún” fi hàn pé Jésù tún sọ àkàwé kan, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: παραβολὴν
  choice: àkàwé
  rationale: Níhìn-ín, ọ̀rọ̀ náà tọ́ka sí àpẹẹrẹ tàbí ọ̀rọ̀ àfiwé tí ń kọ́ni; “àkàwé” mú ìtumọ̀ yìí jáde ní èdè Yorùbá òde òní láì fi í mọ́ òwe lásán.
- source_word: Μήτι δύναται
  choice: Ṣé ... lè
  rationale: Μήτι ń bẹ̀rẹ̀ ìbéèrè tí ó ń retí ìdáhùn òdì. “Ṣé ... lè” pa ìrísí ìbéèrè àti agbára ọ̀rọ̀ náà mọ́ ní Yorùbá.
- source_word: τυφλὸς ... τυφλὸν
  choice: afọ́jú ... afọ́jú
  rationale: Àpèjúwe Gíríìkì náà dúró bí orúkọ fún ẹni tí kò ríran. “Afọ́jú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, kò sì fi akọ tàbí abo kún ibi tí èdè Yorùbá kò ti ń yà wọ́n sọ́tọ̀.
- source_word: ὁδηγεῖν
  choice: ṣe amọ̀nà
  rationale: “Ṣe amọ̀nà” túmọ̀ sí dídarí ẹnì kan ní ọ̀nà, ó sì bá àwòrán ẹni afọ́jú tí ń darí ẹlòmíràn mu.
- source_word: οὐχὶ
  choice: Ṣé ... kò ní
  rationale: οὐχί ń gbé ìbéèrè kalẹ̀ tí ó ń retí ìdáhùn rere. Ìkọ̀lé “Ṣé ... kò ní” ṣe iṣẹ́ kan náà ní Yorùbá.
- source_word: ἀμφότεροι
  choice: àwọn méjèèjì
  rationale: Èyí fi hàn kedere pé àwọn ẹni méjì náà lápapọ̀ ni yóò ṣubú.
- source_word: βόθυνον
  choice: kòtò
  rationale: βόθυνος lè jẹ́ ihò jíjìn tàbí ọ̀nà omi tí a gbẹ́. “Kòtò” jẹ́ yíyan gbooro, tó ṣe àdánidá, tí ó sì pa àwòrán ewu náà mọ́.
- source_word: ἐμπεσοῦνται
  choice: ní ṣubú sínú
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà jẹ́ àsọtẹ́lẹ̀ ohun tí yóò ṣẹlẹ̀; “ní ṣubú sínú” tú u jáde lọ́nà Yorùbá tó rọrùn, ó sì pa εἰς mọ́ nípasẹ̀ “sínú.”
theological_decisions:
- issue: Ìrísí akọ ti τυφλός tí a lò fún àpẹẹrẹ gbogbogbò
  choice: afọ́jú ... afọ́jú
  alternative: ọkùnrin afọ́jú ... ọkùnrin afọ́jú
  rationale: Gíríìkì lo ìrísí akọ ẹyọ ṣùgbọ́n ó ní agbára aṣojú nínú ọ̀rọ̀ àpẹẹrẹ. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú “afọ́jú”; fífi “ọkùnrin” kún un yóò mú ìtumọ̀ dín kù ju ti orísun lọ. Àlàyé ẹsẹ̀ ìsàlẹ̀ sọ ìrísí Gíríìkì náà di mímọ̀ láì yí agbára gbogbogbò rẹ̀ padà.
translation_notes:
  register: A lo èdè Yorùbá tí ó lọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. “Ṣé” mú agbára àwọn ìbéèrè àsọyé méjèèjì jáde lọ́nà àdánidá; “àkàwé” sì yẹra fún ìdàrúdàpọ̀ pẹ̀lú òwe àṣà lásán.
