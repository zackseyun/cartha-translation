  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́, ó pe àwọn ọmọ-ẹ̀yìn rẹ̀ jọ,[a] ó sì yan méjìlá lára wọn, ó sì pè wọ́n ní àwọn àpọ́sítélì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ké sí àwọn ọmọ-ẹ̀yìn rẹ̀,” tàbí “ó bá àwọn ọmọ-ẹ̀yìn rẹ̀ sọ̀rọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípe ènìyàn sí ọ̀dọ̀ ẹni tàbí bíbá a sọ̀rọ̀; àyíká yìí tọ́ka sí pé ó kó wọn jọ fún yíyan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó fún wọn ní orúkọ àpọ́sítélì.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífúnni ní orúkọ tàbí pípè ní orúkọ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé òru ti kọjá, ọ̀sán sì dé, láìlo gbólóhùn líle tí yóò tẹ̀ lé èdè Gíríìkì lẹ́yọ-ọ̀rọ̀.
- source_word: προσεφώνησεν
  choice: ó pe … jọ
  rationale: Nínú àyíká yìí, Jésù ń pe àwọn ọmọ-ẹ̀yìn rẹ̀ sí ọ̀dọ̀ ara rẹ̀ fún yíyan; ‘pe … jọ’ sọ ìṣe ìkójọpọ̀ náà ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé ó bá wọn sọ̀rọ̀.
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ẹni tí ń kọ́ lábẹ́ olùkọ́ àti ẹni tí ń tẹ̀ lé e mọ́.
- source_word: ἐκλεξάμενος
  choice: ó sì yan
  rationale: ‘Yan’ jẹ́ ọ̀rọ̀ kedere, ṣókí, tí ó sì fi ìṣe yíyan láti inú ẹgbẹ́ ńlá hàn.
- source_word: ἀπ’ αὐτῶν
  choice: lára wọn
  rationale: ‘Lára wọn’ fi hàn pé àwọn méjìlá náà ni a yàn láti inú ẹgbẹ́ àwọn ọmọ-ẹ̀yìn tó pọ̀ ju wọ́n lọ.
- source_word: δώδεκα
  choice: méjìlá
  rationale: Èyí ni nọ́ńbà Yorùbá tààrà fún méjìlá.
- source_word: ἀποστόλους
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí ti di orúkọ oyè tí a mọ̀ fún àwọn tí a rán, pàápàá àwọn Méjìlá; lílo ‘àpọ́sítélì’ pa agbára orúkọ oyè náà mọ́ ju ‘ìránṣẹ́’ tàbí ‘àwọn tí a rán’ lọ.
- source_word: ὠνόμασεν
  choice: tí ó tún pè ní
  rationale: Gbólóhùn yìí fi hàn pé Jésù fún wọn ní ìdánimọ̀ tàbí orúkọ oyè ‘àpọ́sítélì’; ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ‘named/called.’
theological_decisions:
- issue: Bóyá kí ἀποστόλους jẹ́ ‘àwọn tí a rán’ tàbí orúkọ oyè ‘àpọ́sítélì’
  choice: àpọ́sítélì
  alternative: àwọn tí a rán; àwọn ońṣẹ́
  rationale: Nínú ẹsẹ yìí, Jésù ń fún àwọn méjìlá ní ìdánimọ̀ pàtàkì, kì í ṣe pé ó kàn ń ṣàpèjúwe iṣẹ́ ìránṣẹ́ kan. ‘Àpọ́sítélì’ pa ipa ọ̀rọ̀ náà gẹ́gẹ́ bí orúkọ oyè mọ́ láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó rọrùn fún gbogbo ènìyàn. ‘Ilẹ̀ mọ́’ àti ‘pe … jọ’ jẹ́ àsọyé Yorùbá àdánidá; ‘àpọ́sítélì’ sì pa orúkọ oyè inú ìtàn Lúùkù mọ́. A gbe àmì àlàyé [a] síbi ọ̀rọ̀ προσεφώνησεν, àti [b] síbi ὠνόμασεν, kí àlàyé kọ̀ọ̀kan lè bá ọ̀rọ̀ tí ó ń ṣàlàyé mu.
