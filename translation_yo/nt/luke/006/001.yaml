translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘ọjọ́ ìsinmi’ fún Sabbath àti ‘ṣírí ọkà’ fún στάχυας.
