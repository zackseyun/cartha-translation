  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ ìsinmi kan pé Jésù ń gba inú àwọn oko ọkà kọjá, àwọn ọmọ-ẹ̀yìn rẹ̀ sì ń fa àwọn ìpà ọkà[a], wọ́n ń fọ́ wọ́n mọ́ra nínú ọwọ́ wọn, wọ́n sì ń jẹ wọ́n.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni orí tàbí etí ọkà, apá irúgbìn tí hóró ọkà wà.
    reason: lexical_alternative
  - marker: b
    text: Wọ́n ń fọ́ àwọn ìpà ọkà náà mọ́ra nínú ọwọ́ wọn láti ya hóró ọkà tí wọ́n lè jẹ kúrò nínú rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó mú ọ̀nà ìbẹ̀rẹ̀ ìṣẹ̀lẹ̀ àti àsopọ̀ ìtàn Lúùkù jáde lọ́nà Yorùbá tó ṣe déédé, láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν σαββάτῳ
  choice: ní ọjọ́ ìsinmi kan
  rationale: Àìsí atíkù pàtó nínú Gíríìkì fàyè gba ìtumọ̀ ọjọ́ ìsinmi kan tí a kò tíì dá mọ̀ ṣáájú.
- source_word: διαπορεύεσθαι αὐτὸν
  choice: Jésù ń gba ... kọjá
  rationale: A lo orúkọ Jésù dípò arọ́pò-orúkọ níbi tí Yorùbá fi nílò ìtumọ̀ tó ṣe kedere; ‘ń gba ... kọjá’ pa ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: διὰ σπορίμων
  choice: inú àwọn oko ọkà
  rationale: Ó túmọ̀ sí àwọn oko tí a gbìn ní ọkà, láìsọ irúgbìn pàtó tí orísun kò sọ.
- source_word: ἔτιλλον
  choice: ń já
  rationale: ‘Ń’ pa ìṣe tí ó ń bá a lọ nínú imperfect Gíríìkì mọ́.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀nà àdánidá àti ọ̀wọ̀ fún ìtumọ̀ gbólóhùn ohun-ìní náà ní Yorùbá.
- source_word: καὶ ἤσθιον
  choice: wọ́n sì ń jẹ ẹ́
  rationale: Ó pa ìṣe jíjẹ tí ó ń lọ lẹ́gbẹ̀ẹ́ ìjá ọkà mọ́.
- source_word: τοὺς στάχυας
  choice: ṣírí ọkà
  rationale: ‘Ṣírí ọkà’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún apá orí irúgbìn tí àwọn èso ọkà wà lára rẹ̀.
- source_word: ψώχοντες ταῖς χερσίν
  choice: wọ́n ń fi ọwọ́ pa wọ́n pọ̀
  rationale: Ó ṣàpèjúwe ìṣe fífi ọwọ́ fọ́ tàbí pa ṣírí náà pọ̀ láti yọ èso ọkà tó ṣeé jẹ jáde, láìsọ ìtumọ̀ tó rékọjá ohun tí Gíríìkì sọ.
