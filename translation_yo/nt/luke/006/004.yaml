id: LUK.6.4
reference: Luke 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: yo
  text: bí ó ti wọ inú ilé Ọlọ́run, tí ó mú àwọn búrẹ́dì tí a gbé sí iwájú Ọlọ́run[a], ó jẹ wọ́n, ó sì fún àwọn tí ó wà pẹ̀lú rẹ̀—àwọn búrẹ́dì tí kò bófin mu fún ẹnikẹ́ni láti jẹ, bí kò ṣe fún àwọn àlùfáà nìkan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn búrẹ́dì ìwájú Ọlọ́run”; ní ìbílẹ̀, “àkàrà ìfihàn” tàbí “showbread.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: bí ó ti
  rationale: Ó ṣàgbékalẹ̀ bí ìbéèrè aláìṣe-taara nípa ohun tí Dáfídì ṣe, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: wọ inú ilé Ọlọ́run
  rationale: Èyí pa ìṣípò wọ inú ibi kan mọ́, ó sì tú οἶκος ní tààrà gẹ́gẹ́ bí ‘ilé’ dípò fífi ‘tẹ́ńpìlì’ kún un.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: àwọn ìṣù àkàrà ìfihàn
  rationale: ‘Àwọn ìṣù’ fi ọ̀pọ̀ nọ́ńbà ἄρτους hàn; ‘àkàrà ìfihàn’ tọ́ka sí àkàrà mímọ́ tí a gbé kalẹ̀ níwájú Ọlọ́run, láìlo ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: λαβὼν ἔφαγεν
  choice: mú ... ó jẹ ẹ́
  rationale: A tú participle àti ọ̀rọ̀-ìṣe pàtàkì náà sí ìṣe méjì tó tẹ̀ lé ara wọn ní Yorùbá àdánidá.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: ó sì fún àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Èyí fara mọ́ Gíríìkì láìfi ‘díẹ̀’ kún un, ó sì pa καί mọ́ pẹ̀lú ‘sì.’
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: kò bófin mu fún ẹnikẹ́ni láti jẹ
  rationale: ‘Kò bófin mu’ pa ìtumọ̀ òfin àti ìyọ̀ǹda ẹ̀sìn mọ́; ‘fún ẹnikẹ́ni’ mú ìṣètò gbolohun Yorùbá náà ṣe kedere.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: bí kò ṣe àwọn àlùfáà nìkan
  rationale: Èyí pa ìyasọ́tọ̀ méjèèjì ti εἰ μή àti μόνους mọ́, pé àwọn àlùfáà nìkan ni a yọ sílẹ̀.
theological_decisions:
- issue: Ìdènà òfin-ìjọsìn lórí jíjẹ àkàrà mímọ́
  choice: kò bófin mu
  alternative: a kò gbà láàyè
  rationale: Àpẹẹrẹ Jésù sinmi lórí ìdènà tí òfin ìjọsìn Ísírẹ́lì gbé kalẹ̀, kì í ṣe àṣà àwùjọ lásán; ‘kò bófin mu’ pa ìfọkànsìn yẹn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé, ìyẹn ‘àkàrà ìfihàn.’
