id: LUK.6.23
reference: Luke 6:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: yo
  text: Ẹ yọ̀ ní ọjọ́ náà, ẹ sì fò sókè fún ayọ̀[a], nítorí, wò ó, èrè yín pọ̀ ní ọ̀run; nítorí bákan náà ni àwọn baba wọn ti máa ń ṣe sí àwọn wòlíì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí inú yín dùn ní ọjọ́ náà, kí ẹ sì fò sókè.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, ọrọ̀ Gíríìkì náà ní, “ní ìbámu pẹ̀lú ohun kan náà ni àwọn baba wọn ti máa ń ṣe sí àwọn wòlíì”; idiomu náà túmọ̀ sí pé àwọn baba wọn hùwà sí àwọn wòlíì ní ọ̀nà kan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Ẹ yọ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe ọ̀pọ̀ ènìyàn láti fi ayọ̀ hàn; “Ẹ yọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì níyì.
- source_word: σκιρτήσατε
  choice: kí ẹ sì fò sókè fún ayọ̀
  rationale: Ó ń tọ́ka sí fífi ayọ̀ tó pọ̀ hàn nípa ìṣe ara; gbolohun yìí mú ìfò sókè àti ìdí ayọ̀ náà jáde lọ́nà àdánidá.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó fa àfiyèsí sí ìdí tó tẹ̀ lé e, ó sì bá ìforúkọsílẹ̀ Bíbélì tó níyì mu.
- source_word: μισθὸς
  choice: èrè
  rationale: Ní ibi yìí, ọ̀rọ̀ náà túmọ̀ sí ohun rere tí a ó fi san padà, kì í ṣe owó iṣẹ́ lásán.
- source_word: πολὺς
  choice: pọ̀
  rationale: “Èrè yín pọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá láti sọ pé èrè náà tóbi tàbí lọ́pọ̀.
- source_word: ἐν τῷ οὐρανῷ
  choice: ní ọ̀run
  rationale: Ó pa ìtọ́kasí sí ibùgbé ọ̀run mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: κατὰ τὰ αὐτά
  choice: bákan náà
  rationale: Èyí mú ìtumọ̀ “ní ọ̀nà kan náà” jáde lọ́nà Yorùbá tó rọrùn.
- source_word: ἐποίουν
  choice: ti máa ń ṣe sí
  rationale: “Máa ń” mú ìṣe àṣà tó ń ṣẹlẹ̀ léraléra nínú àkókò àtijọ́ jáde; “ṣe sí” sì pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τοῖς προφήταις
  choice: sí àwọn wòlíì
  rationale: Ó pa ìbáṣepọ̀ dative Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ ń fi hàn pé ìṣe búburú ni.
- source_word: οἱ πατέρες αὐτῶν
  choice: àwọn baba wọn
  rationale: Ó pa àwòrán ìdílé inú ọ̀rọ̀ Gíríìkì mọ́; ní àyíká yìí, ó ń tọ́ka sí àwọn baba ńlá wọn.
theological_decisions:
- issue: Irú èrè tí a ṣèlérí àti ibi tí ó wà
  choice: èrè yín pọ̀ ní ọ̀run
  alternative: èrè yín lọ́pọ̀ lọ́dọ̀ Ọlọ́run ní ọ̀run
  rationale: Ẹsẹ̀ náà sọ pé èrè náà wà ní ọ̀run, ṣùgbọ́n kò fi “lọ́dọ̀ Ọlọ́run” kún un; ìtumọ̀ yìí pa ọ̀rọ̀ àti ìfarapamọ́ ọjọ́ iwájú rẹ̀ mọ́.
- issue: Àwọn tí “àwọn baba wọn” ń tọ́ka sí
  choice: àwọn baba wọn
  alternative: àwọn baba ńlá wọn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn baba ńlá àwọn tó ń ṣe inúnibíni, ṣùgbọ́n yíyan “àwọn baba wọn” pa ọ̀rọ̀ ìdílé Gíríìkì mọ́ láìṣàlàyé rẹ̀ jù.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà níyì, ó sì ṣe kedere fún òǹkàwé òde òní. “Kíyèsí i” àti “wòlíì” pa àwọ̀ Bíbélì mọ́, nígbà tí “fò sókè fún ayọ̀” jẹ́ àdánidá, ó sì hàn gbangba.
