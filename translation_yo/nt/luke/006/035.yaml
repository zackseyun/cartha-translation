  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: àwọn àṣẹ mẹ́ta náà, àìretí ìsanpadà, ẹ̀san púpọ̀, oyè Ọlọ́run, àti inúure rẹ̀ sí aláìmoore àti ẹni búburú wà níbẹ̀. Síbẹ̀, ó yẹ kí a fi ọ̀pọ̀ ọrọ̀ υἱοὶ hàn ní ọ̀rọ̀ àkọ́kọ́ gẹ́gẹ́ bí ‘àwọn ọmọ,’ kì í ṣe ‘ọmọ’ ní ẹyọ kan.'
  naturalness: ‘Ẹ fẹ́ràn … ẹ ṣe rere … kí ẹ sì yáni’ jẹ́ Yorùbá òde òní tí ó dára. A tún ọ̀rọ̀ ìpadà ṣe sí ‘láìretí ohunkóhun padà,’ èyí tí ó kúrú, tí ó sì dára ní àyíká yíyáni. A kọ oyè náà sí ‘Ẹni Gíga Jùlọ,’ bí ó ti wọ́pọ̀ sí i.
  terminology: ‘Ẹni Gíga Jùlọ’ pa Ὑψίστου mọ́; ‘onínúure,’ ‘aláìmoore,’ àti ‘àwọn ẹni búburú’ sì bójú mu fún χρηστός, ἀχαρίστους, àti πονηρούς. ‘Àwọn ọmọ’ ń pa iye ọ̀pọ̀ ti υἱοὶ mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé akọ-púpọ̀ Gíríìkì láìfi ìtumọ̀ tí kò sí nínú Yorùbá kún un.
