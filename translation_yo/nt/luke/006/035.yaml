    rationale: Bí ó tilẹ̀ jẹ́ pé ‘ọmọ’ lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àkójọpọ̀ ní Yorùbá nígbà míì, ‘àwọn ọmọ’ dá iye ọ̀pọ̀ inú Gíríìkì hàn kedere, ó sì bá aṣàmúlò ‘ẹ’ ọlọ́pọ̀ mu.
  - severity: low
    issue: Ìkọ̀wé oyè náà ‘Ẹni Gíga Jù Lọ’ lè jẹ́ ‘Ẹni Gíga Jùlọ.’
