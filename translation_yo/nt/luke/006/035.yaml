id: LUK.6.35
reference: Luke 6:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ fẹ́ràn àwọn ọ̀tá yín, ẹ ṣe rere, kí ẹ sì yáni ní nǹkan láìretí ohunkóhun padà[a]. Nígbà náà, ẹ̀san yín yóò pọ̀, ẹ ó sì jẹ́ àwọn ọmọ Ẹni Gíga Jùlọ[b], nítorí òun fúnra rẹ̀ jẹ́ onínúure sí àwọn aláìmoore àti àwọn ẹni búburú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn Gíríìkì náà ṣòro láti túmọ̀ dájú. Ìtumọ̀ mìíràn, tí ó kéré sí i ní ìṣeéṣe, ni “láìsọ ìrètí nù nípa ẹnikẹ́ni” tàbí “láìjáwọ́ nínú ìrètí.” Ní àyíká ọ̀rọ̀ yíyáni yìí, a mú un gẹ́gẹ́ bí àìretí ìsanpadà tàbí ohun kan padà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ púpọ̀, ìyẹn “àwọn ọmọkùnrin,” ó sì lè dúró fún gbogbo àwọn tó jẹ́ ọmọ Ẹni Gíga Jùlọ níhìn-ín. Ọ̀rọ̀ Yorùbá “ọmọ” fúnra rẹ̀ kò fi akọ tàbí abo hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín àṣẹ yìí àti ìfẹ́ tí ó dá lórí ohun tí ènìyàn ń retí láti rí gbà padà nínú àwọn ẹsẹ tó ṣáájú.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: ẹ fẹ́ràn àwọn ọ̀tá yín
  rationale: Ó pa àṣẹ tààrà náà àti agbára ọ̀rọ̀ ‘àwọn ọ̀tá yín’ mọ́ láìrọ̀ ọ́.
- source_word: ἀγαθοποιεῖτε
  choice: ẹ ṣe rere
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì fi hàn pé kí wọ́n máa ṣe ohun rere fún ẹlòmíràn.
- source_word: δανίζετε
  choice: kí ẹ sì yáni ní nǹkan
  rationale: Ó túmọ̀ sí fífi ohun kan yá ẹlòmíràn; ‘nǹkan’ kò fi dandan sọ pé owó nìkan ni, gẹ́gẹ́ bí Gíríìkì náà kò ṣe sọ bẹ́ẹ̀.
- source_word: μηδὲν ἀπελπίζοντες
  choice: láìretí pé ẹ ó rí ohunkóhun gbà padà
  rationale: Ní àyíká ọ̀rọ̀ yíyáni, èyí ló bá ìtumọ̀ àìretí ìsanpadà mu jù; àìdánilójú inú gbólóhùn Gíríìkì náà wà nínú àlàyé ìsàlẹ̀.
- source_word: μισθὸς ὑμῶν πολύς
  choice: ẹ̀san yín yóò pọ̀
  rationale: ‘Ẹ̀san’ bá ọ̀rọ̀ ìwà rere àti ohun tí Ọlọ́run yóò fi san padà mu, ‘yóò pọ̀’ sì ṣe àfihàn πολύς lọ́nà àdánidá.
- source_word: υἱοὶ Ὑψίστου
  choice: ọmọ Ẹni Gíga Jù Lọ
  rationale: ‘Ọmọ’ ni ọ̀rọ̀ Yorùbá àdánidá fún ìbátan yìí, kò sì ní ìyàtọ̀ akọ tàbí abo nínú ìrísí rẹ̀; àlàyé ìsàlẹ̀ tọ́ka sí akọ púpọ̀ inú Gíríìkì.
- source_word: χρηστός
  choice: onínúure
  rationale: Ó ṣàfihàn inú rere Ọlọ́run sí àwọn tí kò yẹ fún un lọ́nà Yorùbá tó ṣe kedere.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: àwọn aláìmoore àti àwọn ẹni búburú
  rationale: ‘Aláìmoore’ túmọ̀ ἀχαρίστους ní kedere, ‘àwọn ẹni búburú’ sì pa ìtumọ̀ ènìyàn inú πονηρούς mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ υἱοὶ Ὑψίστου ní ti akọ àti abo
  choice: ọmọ Ẹni Gíga Jù Lọ
  alternative: àwọn ọmọkùnrin Ẹni Gíga Jù Lọ
  rationale: Gíríìkì lo ọ̀rọ̀ akọ púpọ̀ υἱοί, ṣùgbọ́n ‘ọmọ’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún ‘son/child’ láìfi akọ tàbí abo hàn. Lílo ‘ọmọkùnrin’ lè mú kí òǹkàwé rò pé àwọn ọkùnrin nìkan ni àṣẹ àti ìlérí náà kàn. Àlàyé ìsàlẹ̀ pa ìrísí akọ inú Gíríìkì àti agbára aṣojú rẹ̀ mọ́.
- issue: Ìtumọ̀ μηδὲν ἀπελπίζοντες lẹ́yìn àṣẹ láti yáni
  choice: láìretí pé ẹ ó rí ohunkóhun gbà padà
  alternative: láìsọ ìrètí nù nípa ẹnikẹ́ni / láìjáwọ́ nínú ìrètí
  rationale: Àyíká ọ̀rọ̀ náà dá lórí yíyáni àti àìṣe rere nítorí ìsanpadà, nítorí náà àìretí ohun padà ni a mú sí ọ̀rọ̀ àkọ́kọ́. Síbẹ̀, a kò fi ìtumọ̀ mìíràn tó ṣeé ṣe pamọ́; ó wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àgbàlágà tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì lo àṣẹ ọlọ́pọ̀ ènìyàn ‘ẹ’ déédéé. ‘Ẹni Gíga Jù Lọ’ pa oyè Ọlọ́run Ὕψιστος mọ́ ní ọ̀nà tó ṣe kedere.
