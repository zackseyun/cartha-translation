  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ọmọ Ènìyàn ni Olúwa ọjọ́ Ìsinmi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ọmọ Ènìyàn ni Olúwa lórí ọjọ́ Ìsinmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” ń bá ìtàn náà lọ gẹ́gẹ́ bí àsopọ̀ rírọrùn, láìfi ìtumọ̀ àkókò míì kún ọ̀rọ̀ Gíríìkì.
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì lè fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń sọ” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí túmọ̀ arọ́pò-orúkọ dative plural náà ní tààrà, láìsọ ẹni tí “wọn” jẹ́ ní pàtó ju bí orísun ṣe sọ lọ.
- source_word: Κύριος
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ọ̀rọ̀ oyè tó bójú mu fún àṣẹ gíga tí gbólóhùn náà fi fún Ọmọ Ènìyàn; kò dín un kù sí ọ̀rọ̀ ìbọ̀wọ̀ lásán.
- source_word: τοῦ σαββάτου
  choice: ọjọ́ Ìsinmi
  rationale: “Ọjọ́ Ìsinmi” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún Sábáàtì gẹ́gẹ́ bí ọjọ́ àti ètò ìsinmi mímọ́. Ìsopọ̀ “Olúwa ọjọ́ Ìsinmi” pa genitive Gíríìkì mọ́ ní ṣókí.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ oyè náà tó ti fìdí múlẹ̀, ó sì pa ìpilẹ̀ ọ̀rọ̀ Semitic àti ìbáṣepọ̀ tó ṣeé ṣe pẹ̀lú Dáníẹ́lì 7 mọ́.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ẹni Kristi àti ọjọ́ Ìsinmi
  choice: “Ọmọ Ènìyàn ni Olúwa ọjọ́ Ìsinmi”
  alternative: “Ọmọ Ènìyàn ni ẹni tó ní àṣẹ lórí ọjọ́ Ìsinmi”
  rationale: Ìtumọ̀ àkọ́kọ́ pa oyè “Olúwa” àti ìsopọ̀ genitive Gíríìkì mọ́, ó sì sọ àṣẹ Ọmọ Ènìyàn nípa ọjọ́ Ìsinmi ní kedere láìfi “àní” tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ọjọ́ Ìsinmi” dípò àkọsílẹ̀ fáwẹ́lì Gíríìkì “Sábáàtì” kí ìtumọ̀ lè hàn gbangba, nígbà tí lẹ́tà ńlá fi ipò ọjọ́/ètò pàtó náà hàn.
