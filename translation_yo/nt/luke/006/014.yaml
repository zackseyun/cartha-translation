id: LUK.6.14
reference: Luke 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: yo
  text: Símónì, ẹni tí ó tún pe ní Pétérù, àti Áńdérù arákùnrin rẹ̀, àti Jákọ́bù àti Jòhánù, àti Fílípì àti Bátólómíù,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Símónì
  rationale: Ìrísí orúkọ yìí ni ó wọ́pọ̀ nínú Bíbélì Yorùbá, ó sì ṣàfihàn orúkọ ẹni náà lọ́nà tí olùkà Yorùbá lè pè ní ti ẹ̀dá.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: ẹni tí ó tún sọ orúkọ rẹ̀ ní Pétérù
  rationale: ὀνομάζω níbí ń tọ́ka sí fífi orúkọ fún ẹni; ọ̀rọ̀ yìí ṣe kedere pé Jésù fún Símónì ní orúkọ Pétérù, dípò pé ó kàn máa ń pè é bẹ́ẹ̀.
- source_word: Πέτρον
  choice: Pétérù
  rationale: Ìrísí orúkọ Pétérù ni ó ti fìdí múlẹ̀ nínú àṣà Bíbélì Yorùbá.
- source_word: Ἀνδρέαν
  choice: Áńdérù
  rationale: Àkọsílẹ̀ orúkọ yìí bá ìpè Yorùbá mu, ó sì jẹ́ ìrísí tí a mọ̀ nínú Bíbélì Yorùbá.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: ἀδελφός ní àyíká yìí túmọ̀ sí arákùnrin gidi; ‘arákùnrin rẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: Ἰάκωβον
  choice: Jákọ́bù
  rationale: Orúkọ Gíríìkì Ἰάκωβος bá orúkọ Jákọ́bù mu ní ìtàn àti ní èdè; yíyan Jákọ́bù tún yàgò fún gbígbé àṣà orúkọ Gẹ̀ẹ́sì ‘James’ wọ inú Yorùbá.
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Jòhánù ni ìrísí Yorùbá tí ó ti wọ́pọ̀ fún orúkọ Ἰωάννης.
- source_word: Φίλιππον
  choice: Fílípì
  rationale: Àkọsílẹ̀ yìí ń fi ohùn orúkọ Gíríìkì hàn lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: Βαρθολομαῖον
  choice: Bátólómíù
  rationale: Ìrísí yìí bá ìpè orúkọ náà mu ní Yorùbá, ó sì jẹ́ orúkọ tí olùkà Bíbélì Yorùbá lè dá mọ̀.
- source_word: καὶ
  choice: àti / tún
  rationale: Nínú àtòjọ náà, καί ni a túmọ̀ sí ‘àti’; nínú ὃν καὶ ὠνόμασεν, ó ń fi àfikún hàn, nítorí náà ‘tún’ ni ó bá iṣẹ́ rẹ̀ mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye. A pa ìṣọ̀kan àtòjọ Gíríìkì mọ́ nípasẹ̀ ‘àti,’ a sì lo àmì àárín-gbólóhùn láti mú kí àtòjọ àwọn orúkọ rọrùn láti kà. Gbólóhùn náà mọ̀ọ́mọ̀ parí pẹ̀lú àmì kọ́mà nítorí ẹsẹ yìí jẹ́ apá kan àtòjọ tí ó ń bá a lọ.
