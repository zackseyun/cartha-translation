id: LUK.6.37
reference: Luke 6:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: yo
  text: “Ẹ má ṣe dájọ́, a kì yóò sì dájọ́ yín rárá; ẹ má sì ṣe dá ẹlòmíràn lẹ́bi, a kì yóò sì dá yín lẹ́bi rárá. Ẹ tú ẹlòmíràn sílẹ̀,[a] a ó sì tú yín sílẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ dáríjì, a ó sì dáríjì yín.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí “tú sílẹ̀,” “dá sílẹ̀,” tàbí, nínú àyíká ọ̀rọ̀ yìí, “dáríjì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: dájọ́
  rationale: “Dájọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé pẹ̀lú ìtumọ̀ κρίνω níbí, ó sì pa ìbáramu mọ́ pẹ̀lú ọ̀rọ̀ ìṣe aláìṣe tó tẹ̀ lé e.
- source_word: οὐ μὴ κριθῆτε
  choice: a kì yóò sì dájọ́ yín rárá
  rationale: Àpapọ̀ οὐ μή jẹ́ ìkọ̀ tí a tẹnumọ́ gidigidi; “kì yóò … rárá” fi agbára ìkọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: καταδικάζετε
  choice: dá ẹlòmíràn lẹ́bi
  rationale: καταδικάζω lágbára ju κρίνω lọ, ó túmọ̀ sí pípolongo ẹnì kan ní ẹlẹ́bi tàbí dídálẹ́bi; “dá … lẹ́bi” pa ìgbésókè ìtumọ̀ náà mọ́.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: a kì yóò sì dá yín lẹ́bi rárá
  rationale: Ìtumọ̀ yìí tún fi ìkọ̀ tẹnumọ́ οὐ μή hàn, ó sì bá ìlà tó ṣáájú mu.
- source_word: ἀπολύετε
  choice: tú ẹlòmíràn sílẹ̀
  rationale: ἀπολύω lè túmọ̀ sí tú sílẹ̀, dá sílẹ̀, tàbí dárí jì ní àyíká ọ̀rọ̀ yìí. “Tú … sílẹ̀” pa ìwọ̀n ìtumọ̀ rẹ̀ mọ́ láì dín in kù sí ìdáríjì nìkan.
- source_word: ἀπολυθήσεσθε
  choice: a ó sì tú yín sílẹ̀
  rationale: Ìtumọ̀ yìí pa ìbáramu ọ̀rọ̀ ìṣe mọ́ láàárín àṣẹ àti èsì rẹ̀, gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: καὶ
  choice: sì
  rationale: “Sì” ni àsopọ̀ Yorùbá àdánidá tó pa ìtẹ̀lé àti ìbáramu àwọn gbólóhùn Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἀπολύετε ní pàtó sí “dárí jì” tàbí ní gbòòrò sí “tú sílẹ̀”
  choice: “Ẹ tú ẹlòmíràn sílẹ̀” nínú ọ̀rọ̀ pàtàkì
  alternative: “Ẹ dárí jì”
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa dídájọ́ àti dídálẹ́bi, ἀπολύω sì lè tọ́ka sí títú ẹni sílẹ̀ kúrò nínú ẹ̀sùn tàbí ohun tí a ń béèrè lọ́wọ́ rẹ̀. “Tú sílẹ̀” pa àìdánilójú àti fífẹ̀ ìtumọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi “dárí jì” hàn gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún àṣẹ ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn síbi tó yẹ. “Ẹlòmíràn” jẹ́ àfikún tí gírámà Yorùbá nílò láti mú àwọn àṣẹ àkọ́kọ́ àti ìkẹta yege, kì í ṣe láti dín ẹni tí ọ̀rọ̀ náà kan kù.
