id: LUK.6.7
reference: Luke 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: yo
  text: Àwọn akọ̀wé àti àwọn Farisí sì ń ṣọ́ ọ́ pẹ̀kípẹ̀kí láti rí i bóyá yóò mú un láradá ní ọjọ́ Sábáàtì[a], kí wọ́n lè rí ẹ̀sùn kan láti fi kàn án.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sábáàtì ni ọjọ́ ìsinmi àwọn Júù.
    reason: cultural_clarification
  - marker: b
    text: Ó tún lè jẹ́, “kí wọ́n lè rí ọ̀nà láti fẹ̀sùn kàn án,” tàbí ní ṣókí, “kí wọ́n lè fẹ̀sùn kàn án.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé wọ́n ń wá ìpìlẹ̀ fún ẹ̀sùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: ń ṣọ́ ọ pẹkipẹki
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì mú ìtumọ̀ wíwo pẹkipẹki pẹ̀lú ète búburú tó wà nínú àyíká ọ̀rọ̀ náà jáde. Ọ̀rọ̀ arọ́pò-orúkọ ‘ọ’ tọ́ka sí Jésù láti inú àyíká ọ̀rọ̀.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ẹgbẹ́ àwọn amòye òfin yìí nínú ìtàn Ìhìn Rere, ó sì pa ìtòlẹ́sẹẹsẹ ọ̀rọ̀ orísun mọ́.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ ni; ìkọ̀wé yìí tẹ̀ lé bí a ṣe ń pe orúkọ náà ní Yorùbá.
- source_word: εἰ
  choice: láti mọ̀ bóyá
  rationale: Lẹ́yìn ọ̀rọ̀ tó túmọ̀ sí ṣíṣọ́ tàbí àkíyèsí, gbólóhùn yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìbéèrè àìṣe-taara hàn.
- source_word: ἐν τῷ σαββάτῳ
  choice: ní ọjọ́ ìsinmi
  rationale: Ó fi àkókò hàn ní ọ̀nà tí ó bá Yorùbá mu, ó sì jẹ́ kí ọjọ́ Sábáàtì yé òǹkàwé lasán.
- source_word: θεραπεύει
  choice: yóò mú un láradá
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìsinsìnyí, nínú ìbéèrè àìṣe-taara yìí ó ń tọ́ka sí ohun tí wọ́n ń retí láti rí i bóyá Jésù yóò ṣe. ‘Mú un láradá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìwòsàn ẹni tí àyíká ọ̀rọ̀ tọ́ka sí.
- source_word: ἵνα εὕρωσιν
  choice: kí wọ́n lè rí
  rationale: Ó pa ète ìṣe wọn mọ́ gẹ́gẹ́ bí gbólóhùn ìdí.
- source_word: κατηγορεῖν αὐτοῦ
  choice: rí ẹ̀sùn kan láti fi kàn án
  rationale: Ó sọ èrò wíwá ìpìlẹ̀ tàbí àǹfààní láti fẹ̀sùn kàn án ní Yorùbá àdánidá, láìfi ohun tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ète àwọn alátakò
  choice: A fi wọn hàn bí ẹni tí ń ṣọ́ Jésù pẹkipẹki pẹ̀lú ète láti rí ẹ̀sùn kàn án.
  alternative: A lè sọ ọ́ lọ́nà dídọ́gba sí i pé wọ́n ń kíyè sí i bóyá yóò ṣe ìwòsàn.
  rationale: Àpapọ̀ παρατηρέω ní àkókò aláìparí àti gbólóhùn ète ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ fi hàn pé kì í ṣe àkíyèsí lásán, bí kò ṣe ṣíṣọ́ tí ó darí sí fífẹ̀sùn kàn án. Ìtumọ̀ náà kò fi ìkọlù tó ju ohun tí ẹsẹ̀ sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ọjọ́ ìsinmi’ mú ìtumọ̀ Sábáàtì yé ẹni tí kò mọ ọ̀rọ̀ àṣà Júù, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀rọ̀ orísun mọ́.
