language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: yo
  text: Gbogbo ogunlọ́gọ̀ náà sì ń gbìyànjú láti fọwọ́ kàn án, nítorí agbára ń jáde láti ọ̀dọ̀ rẹ̀[a], ó sì ń wo gbogbo wọn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń jáde lára rẹ̀.”
    reason: Ìyípadà ìpèdè fún παρ’ αὐτοῦ ἐξήρχετο tí ó pa ìtumọ̀ pé agbára náà ń jáde láti ọ̀dọ̀ rẹ̀ mọ́.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo èrò náà
  rationale: Ọ̀rọ̀ yìí tọ́ka sí gbogbo àwùjọ ènìyàn náà gẹ́gẹ́ bí odindi kan; ‘gbogbo èrò náà’ jẹ́ Yorùbá àdánidá tí ó sì pa ìtumọ̀ àkójọpọ̀ náà mọ́.
- source_word: ἐζήτουν
  choice: ń gbìyànjú
  rationale: Àkókò imperfect fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ‘ń gbìyànjú’ mú èyí jáde láì fi ìtẹnumọ́ míì kún un.
- source_word: ἅπτεσθαι
  choice: láti fọwọ́ kàn án
  rationale: Nínú àyíká ìwòsàn yìí, gbólóhùn náà túmọ̀ sí fífi ọwọ́ kan ẹni; ìtumọ̀ yìí jẹ́ mímọ́ àti àdánidá ní Yorùbá.
- source_word: δύναμις
  choice: agbára
  rationale: ‘Agbára’ pa ìtumọ̀ gbogbogbò δύναμις mọ́, kò sì fi ọ̀rọ̀ ‘iṣẹ́ ìyanu’ kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: ń ti ọ̀dọ̀ rẹ̀ jáde
  rationale: Ìtumọ̀ yìí fi hàn pé agbára náà ń jáde láti ọ̀dọ̀ Jésù, ó sì pa ìṣe tí ń bá a lọ nínú imperfect mọ́.
- source_word: ἰᾶτο
  choice: ó sì ń wo ... sàn
  rationale: Fọ́ọ̀mù imperfect náà tọ́ka sí ìwòsàn tí ń ṣẹlẹ̀ nígbà náà; arọ́pò-orúkọ ‘ó’ ń tọ́ka sí ‘agbára’ gẹ́gẹ́ bí kókó-ọrọ̀ tó sún mọ́ ọn jù.
- source_word: πάντας
  choice: gbogbo wọn
  rationale: Èyí tọ́ka sí gbogbo àwọn tí agbára ìwòsàn náà dé bá; ‘gbogbo wọn’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere láì dín ìwọ̀n ‘gbogbo’ kù.
theological_decisions:
- issue: Ìwà agbára tí ń jáde láti ọ̀dọ̀ Jésù
  choice: A túmọ̀ ọ́ pé ‘agbára ń ti ọ̀dọ̀ rẹ̀ jáde’ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: ‘agbára iṣẹ́ ìyanu ń ti ọ̀dọ̀ rẹ̀ jáde’
  rationale: Ẹsẹ náà gbé Jésù kalẹ̀ gẹ́gẹ́ bí orísun agbára ìwòsàn tó ń ṣiṣẹ́. Ìtumọ̀ náà pa ìjẹ́rìí yìí mọ́ ṣùgbọ́n kò fi ‘iṣẹ́ ìyanu’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Èrò’ jẹ́ ọ̀rọ̀ àdánidá fún àwùjọ ènìyàn, ‘fọwọ́ kàn án’ sì ṣe àfihàn ìfọwọ́kàn ní kedere. A pa ìṣe tí ń bá a lọ nínú àwọn ọ̀rọ̀ imperfect mọ́ pẹ̀lú ‘ń’.
