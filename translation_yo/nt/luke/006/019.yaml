  to: Gbogbo ogunlọ́gọ̀ náà sì ń gbìyànjú láti fọwọ́ kàn án, nítorí agbára ń jáde láti ọ̀dọ̀ rẹ̀[a], ó sì ń wo gbogbo wọn sàn.
