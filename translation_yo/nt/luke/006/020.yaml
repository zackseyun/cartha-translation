id: LUK.6.20
reference: Luke 6:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: yo
  text: Ó sì gbé ojú rẹ̀ sókè sí àwọn ọmọ-ẹ̀yìn rẹ̀, ó ń sọ pé, “Alábùkún fún ni ẹ̀yin tálákà[a][b], nítorí tiyín ni ìjọba Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìrísí gírámà Gíríìkì, a tún lè túmọ̀ rẹ̀ pé, “Alábùkún fún ni àwọn tálákà.” Ṣùgbọ́n “tiyín” tó tẹ̀ lé e fi hàn pé ó ń bá wọn sọ̀rọ̀ tààrà.
    reason: lexical_alternative
  - marker: b
    text: Lúùkù sọ “tálákà,” kì í ṣe “tálákà ní ẹ̀mí” (fi wé Mátíù 5:3).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: gbé ojú rẹ̀ sókè
  rationale: Ó pa àwòrán gíríìkì mọ́ pé Jésù gbé ojú rẹ̀ sókè; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: sí àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Sí” fi ìtọ́sọ́nà ojú rẹ̀ sí àwọn ọmọ-ẹ̀yìn hàn láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ἔλεγεν
  choice: ó ń sọ pé
  rationale: Àmì “ń” fi ipa imperfect hàn gẹ́gẹ́ bí ọ̀rọ̀ tó ń lọ tàbí ìbẹ̀rẹ̀ àsọyé, dípò ṣíṣe e ní ìṣẹ̀lẹ̀ kan ṣoṣo.
- source_word: Μακάριοι
  choice: Alábùkún-fún ni
  rationale: Ó mú ìtumọ̀ ìbùkún nínú ọ̀rọ̀ ayọ̀ yìí jáde dáadáa ju “aláyọ̀” lọ, èyí tó lè dà bí ìmọ̀lára lásán.
- source_word: οἱ πτωχοί
  choice: ẹ̀yin tálákà
  rationale: “Tálákà” ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn òtòṣì; “ẹ̀yin” sì bá ὑμετέρα tó tẹ̀ lé e mu, nígbà tí àkọsílẹ̀ ẹsẹ̀ ń pa ìrísí ẹni-kẹta inú Gíríìkì mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ìdáhùn sí ìbùkún náà hàn ní Yorùbá àdánidá.
- source_word: ὑμετέρα ἐστὶν
  choice: tiyín ni
  rationale: Ó pa ìtẹnumọ́ ohun-ìní àti ọ̀rọ̀ sí ẹni-kejì púpọ̀ mọ́ ní ṣókí.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tó gbòòrò, tó sì mọ́gbọ́n dání, láìdín βασιλεία kù sí ìṣe ìṣàkóso nìkan.
theological_decisions:
- issue: Bóyá πτωχοί yẹ kí a túmọ̀ rẹ̀ nípa ipò ti ara tàbí kí a fi “nínú ẹ̀mí” kún un
  choice: tálákà
  alternative: tálákà ní ẹ̀mí
  rationale: Lúùkù sọ “àwọn tálákà” lásán; fífi “nínú ẹ̀mí” kún un yóò mú ọ̀rọ̀ Mátíù 5:3 wọ inú ẹsẹ̀ yìí, yóò sì yanjú ìtẹnumọ́ Lúùkù láìní ẹ̀rí nínú orísun.
- issue: Bóyá a ó pa ìrísí ẹni-kẹta “àwọn tálákà” mọ́ tàbí lo àdírẹ́sì tààrà “ẹ̀yin tálákà”
  choice: ẹ̀yin tálákà
  alternative: àwọn tálákà
  rationale: οἱ πτωχοί jẹ́ ẹni-kẹta ní ìrísí, ṣùgbọ́n ὑμετέρα (“tiyín”) mú kí àsọyé náà jẹ́ àdírẹ́sì tààrà sí àwọn ọmọ-ẹ̀yìn. Àkọsílẹ̀ [a] pa ìyàtọ̀ girama náà mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, tó ṣe déédéé, tí àwọn òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹnumọ́ àdírẹ́sì tààrà àti àìṣàfikún “nínú ẹ̀mí” mọ́.
