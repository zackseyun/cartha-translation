id: LUK.6.46
reference: Luke 6:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: yo
  text: Èé ṣe tí ẹ fi ń pè mí ní[a] ‘Olúwa, Olúwa,’ tí ẹ kò sì ṣe ohun tí mo sọ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Ọ̀gá, Ọ̀gá.” Ní èdè Gíríìkì: “Kyrios, kyrios.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú àṣà ọ̀rọ̀ yìí, τί ń béèrè ìdí, kì í ṣe ohun kan; “Èé ṣe” ni ìbéèrè Yorùbá àdánidá tó pa agbára ìbáwí náà mọ́.
- source_word: δέ
  choice: —
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ onírẹ̀lẹ̀; ìṣàn ọ̀rọ̀ Yorùbá kò béèrè pé kí a túmọ̀ rẹ̀ ní ọ̀tọ̀ ní ìbẹ̀rẹ̀ ìbéèrè yìí.
- source_word: με καλεῖτε
  choice: ẹ fi ń pè mí ní
  rationale: Ẹni kejì ọ̀pọ̀ ni καλεῖτε, “pè mí ní” sì ni ọ̀nà Yorùbá àdánidá láti sọ pé a ń fi orúkọ oyè kan pe ẹnì kan.
- source_word: Κύριε κύριε
  choice: Olúwa, Olúwa
  rationale: A pa àtúnwí ọ̀rọ̀ ìpè náà mọ́ fún ìtẹnumọ́ àti fún ìyàtọ̀ tó wà láàárín jíjẹ́wọ́ ẹnu àti àìgbọ́ràn.
- source_word: καὶ οὐ ποιεῖτε
  choice: tí ẹ kò sì ṣe
  rationale: “kò sì” fi àsopọ̀ àti ìtakora inú καὶ οὐ hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἃ λέγω
  choice: ohun tí mo sọ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkóónú ohun tí Jésù ń sọ; gbolohun Yorùbá yìí rọrùn, ó sì dúró sún mọ́ Gíríìkì.
theological_decisions:
- issue: Títúmọ̀ κύριος gẹ́gẹ́ bí oyè tí a fi ń pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ oyè κύριος àti agbára rẹ̀ nínú ọ̀rọ̀ nípa ẹni tí Jésù jẹ́ mọ́; “Ọ̀gá” ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ míì, ṣùgbọ́n ó lè dín ìwọ̀n oyè náà kù.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé lásán ni a lò. A lo “ẹ” fún ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí fọ́ọ̀mù Gíríìkì, a sì fi àmì ohùn síbi tí ó yẹ.
