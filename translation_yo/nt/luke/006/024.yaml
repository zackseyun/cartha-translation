  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: yo
  text: Ṣùgbọ́n ègbé ni fún yín, ẹ̀yin ọlọ́rọ̀, nítorí ẹ ti gba ìtùnú yín.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ti gba ìtùnú yín ní ẹ̀kúnrẹ́rẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì lè ní ìtumọ̀ lati gba ohun tí ó yẹ fún ẹni ní ẹ̀kúnrẹ́rẹ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfọ̀kànbalẹ̀ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìkìlọ̀ yìí ṣe ìyàtọ̀ líle sí àwọn ọ̀rọ̀ ìbùkún tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οὐαὶ
  choice: ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àti ìkìlọ̀ àwọn wòlíì mọ́; ‘àánú’ tàbí ọ̀rọ̀ ẹ̀dùn lásán yóò mú un rọ̀ jù.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: fún yín, ẹ̀yin ọlọ́rọ̀
  rationale: Ó pa ìtọ́kasí tààrà sí àwọn olùgbọ́ mọ́, ó sì sọ ẹgbẹ́ tí Jésù ń bá wí ní kedere.
- source_word: ἀπέχετε
  choice: ẹ ti gba
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí pé ẹni kan ti gba ohun tí ó yẹ fún un, àní ní ẹ̀kúnrẹ́rẹ́. Ìtumọ̀ yìí fi hàn pé ìtùnú náà ti wà lọ́wọ́ wọn báyìí, láìfi gbogbo ìtumọ̀ ‘ní ẹ̀kúnrẹ́rẹ́’ sínú ọ̀rọ̀ pàtàkì.
- source_word: παράκλησιν
  choice: ìtùnú
  rationale: ‘Ìtùnú’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè gbé ìtumọ̀ comfort tàbí consolation nínú àyíká yìí.
theological_decisions:
- issue: Irú ìkìlọ̀ tí a ń fún àwọn ọlọ́rọ̀
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìkéde ègbé tààrà sí àwọn ọlọ́rọ̀.
  alternative: Kí a sọ ọ́ di ọ̀rọ̀ ẹ̀dùn lásán, tàbí kí a fikún un pé àwọn tó gbẹ́kẹ̀ lé ọrọ̀ ni.
  rationale: Gíríìkì sọ ‘ẹ̀yin ọlọ́rọ̀’ ní tààrà, kò sì sọ pé ‘àwọn tó gbẹ́kẹ̀ lé ọrọ̀.’ Ìtumọ̀ náà kò gbọ́dọ̀ dín agbára ọ̀rọ̀ Jésù kù tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ yìí kún un.
- issue: Àkókò àti ìtumọ̀ ἀπέχετε
  choice: ‘ẹ ti gba’ fi ipò tí ó ti ṣẹlẹ̀, tí èso rẹ̀ sì wà lọ́wọ́ wọn báyìí hàn.
  alternative: ‘ẹ ń gba’ tàbí ‘ẹ ti gba ní ẹ̀kúnrẹ́rẹ́.’
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí, ṣùgbọ́n ó tún ní ìtumọ̀ àkànṣe ti gbígba ohun tí ó yẹ ní ẹ̀kúnrẹ́rẹ́. Ọ̀rọ̀ pàtàkì àti àlàyé ìsàlẹ̀ pa ìṣòro ìtumọ̀ méjèèjì mọ́ láìyanju rẹ̀ ní ọ̀nà tó le jù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Fífọ ọ̀rọ̀ náà sí ‘fún yín, ẹ̀yin ọlọ́rọ̀’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìbáwí ẹni-kejì-púpọ̀ mọ́.
