source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: yo
  text: 'Ṣùgbọ́n mo sọ fún ẹ̀yin tí ẹ ń gbọ́[a] pé: Ẹ nífẹ̀ẹ́ àwọn ọ̀tá yín; ẹ ṣe rere sí àwọn tí ń kórìíra yín,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin tí ẹ ń fetí sílẹ̀.” Ọ̀rọ̀-ìṣe alájọpín Gíríìkì náà lè túmọ̀ sí “àwọn tí ń gbọ́”; ìtumọ̀ “ẹ̀yin tí ẹ ń fetí sílẹ̀” ń fi ìmọ̀ pé wọ́n ń fetí mọ́ ọ̀rọ̀ náà hàn ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá àti ṣókí láti bẹ̀rẹ̀ gbólóhùn náà ní Yorùbá.
- source_word: ὑμῖν λέγω
  choice: mo sọ fún ẹ̀yin
  rationale: Ó pa ọ̀rọ̀ ẹni kìíní àti ìtọ́kasí tààrà sí ọ̀pọ̀ ènìyàn mọ́, láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τοῖς ἀκούουσιν
  choice: ẹ̀yin tí ẹ ń fetí sílẹ̀
  rationale: Àpólà alásìkò ìsinsìnyí náà ń tọ́ka sí fífetí sílẹ̀ tó ń lọ lọ́wọ́ àti gbígba ọ̀rọ̀ náà sí ọkàn; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ìtumọ̀ gígúnná ‘tí ẹ ń gbọ́’ lọ ní àyíká yìí.
- source_word: ἀγαπᾶτε
  choice: Ẹ nífẹ̀ẹ́
  rationale: Ó túmọ̀ àṣẹ ọ̀pọ̀ ènìyàn ní tààrà, ó sì pa ìtumọ̀ ìfẹ́ mọ́ láìsọ ọ́ di ìmọ̀lára nìkan.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: àwọn ọ̀tá yín
  rationale: Ìtumọ̀ tààrà àti àdánidá ni fún ohun tí àṣẹ náà dojú kọ àti arọ́pò-orúkọ olóhun.
- source_word: καλῶς ποιεῖτε
  choice: ẹ ṣe rere
  rationale: Ó mú iṣẹ́ àti ìwà rere inú gbólóhùn Gíríìkì náà jáde ní Yorùbá tó ṣe kedere, láìfẹ̀ sí i ju bó ṣe wà lọ.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: sí àwọn tí ó kórìíra yín
  rationale: ‘Kórìíra’ pa agbára ìtumọ̀ μισέω mọ́ láìrọ̀ ọ́; ‘sí’ sì bá ‘ṣe rere’ mu ní Yorùbá.
theological_decisions:
- issue: Àwọn àṣẹ ìwà rere sí àwọn alátakò
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà gẹ́gẹ́ bí àṣẹ tààrà sí gbogbo olùgbọ́, láìdín ààlà wọn kù.
  alternative: Kí a fi kún un pé ọ̀tá ara ẹni nìkan ni, tàbí kí a sọ pé àsọdùn lásán ni.
  rationale: Àwọn ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn, kò sì sí ààlà bẹ́ẹ̀ nínú Gíríìkì. Ìtumọ̀ náà ní láti pa agbára àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú àṣẹ náà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ̀yin/ẹ/yín’ ní ìbámu pẹ̀lú Gíríìkì, a sì fi àmì ohùn sí ibi tí ó yẹ.
