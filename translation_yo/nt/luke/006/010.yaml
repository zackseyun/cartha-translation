  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: yo
  text: Lẹ́yìn tí ó wo gbogbo wọn yíká, ó wí fún un pé, “Na ọwọ́ rẹ̀ jáde.” Ó sì ṣe bẹ́ẹ̀, ọwọ́ rẹ̀ sì padà bọ̀ sí ipò tí ó yẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọwọ́ rẹ̀ sì sàn.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé ọwọ́ rẹ̀ padà sí ipò tí ó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Lẹ́yìn tí ó wo … yíká
  rationale: Àpólà aṣáájú ọ̀rọ̀ aorist yìí fi hàn pé Jésù kọ́kọ́ wo àwọn tó wà níbẹ̀ yíká kí ó tó sọ̀rọ̀; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹ̀lé ìṣe náà mọ́.
- source_word: πάντας αὐτούς
  choice: gbogbo wọn
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé kò sí ọ̀kan lára àwọn tó wà níbẹ̀ tí kò wò.
- source_word: εἶπεν αὐτῷ
  choice: ó wí fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ó bá ọkùnrin náà sọ̀rọ̀, láìfi ìtumọ̀ míì kún irú ọ̀rọ̀ tí ó sọ.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Na ọwọ́ rẹ jáde
  rationale: Ó tú àṣẹ tààrà náà sí Yorùbá àdánidá, ó sì pa χείρ mọ́ gẹ́gẹ́ bí ‘ọwọ́,’ kì í ṣe ‘apá.’
- source_word: ὁ δὲ ἐποίησεν
  choice: Ó sì ṣe bẹ́ẹ̀
  rationale: ποιέω ń tọ́ka padà sí àṣẹ tí a ṣẹ̀ṣẹ̀ pa; ‘ṣe bẹ́ẹ̀’ sọ ìdáhùn ìgbọ́ràn náà ní kedere.
- source_word: ἀπεκατεστάθη ἡ χεὶρ αὐτοῦ
  choice: ọwọ́ rẹ sì padà bọ̀ sí bó ṣe yẹ
  rationale: Àpólà yìí pa èrò ìmúpadàbọ̀ sí ipò tó yẹ nínú ἀποκαθίστημι mọ́, dípò kí ó fi ọ̀rọ̀ ìṣègùn kan rọ́pò rẹ̀ ní tààrà.
theological_decisions:
- issue: Bí a ṣe máa sọ irú iṣẹ́ ìyanu inú ἀπεκατεστάθη
  choice: Lílo èdè ìmúpadàbọ̀ sí ipò tó yẹ
  alternative: ọwọ́ rẹ sì sàn; ọwọ́ rẹ sì di pípé
  rationale: Ọ̀rọ̀ Gíríìkì tẹnumọ́ pé ọwọ́ náà padà sí ipò tó yẹ. Ìtumọ̀ yìí jẹ́ kí iṣẹ́ ìyanu náà hàn gbangba láìsọ ọ́ di ọ̀rọ̀ ìṣègùn tàbí láìfi èrò ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa tó ṣe kedere, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan ‘wí’ fún ìró ìtàn Bíbélì tó ní iyì láìjẹ́ àtijọ́ jù.
