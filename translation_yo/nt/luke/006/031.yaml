id: LUK.6.31
reference: Luke 6:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: yo
  text: Gẹ́gẹ́ bí ẹ ṣe fẹ́ kí àwọn ènìyàn ṣe sí yín, ẹ̀yin náà ṣe bẹ́ẹ̀ sí wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Bí
  rationale: Ó fi ìwọ̀n ìfiwéra hàn ní ọ̀nà tí ó bá Yorùbá àdánidá mu.
- source_word: θέλετε
  choice: ẹ ti fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ohun tí ẹni ń fẹ́ ní èdè Yorùbá òde òní, láìsọ ọ́ di ọ̀rọ̀ gíga jù.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: kí àwọn ènìyàn ṣe sí yín
  rationale: Ìṣètò yìí fi ohun tí wọ́n fẹ́ hàn, ó sì pa ìtumọ̀ gbogbogbò ti ποιέω mọ́; ‘sí yín’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tí a ṣe sí ẹnì kan.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ποιεῖτε αὐτοῖς
  choice: ẹ ṣe bẹ́ẹ̀ gẹ́gẹ́ sí wọn
  rationale: Ó pa àṣẹ àti ìbáṣepọ̀ àtúnṣe mọ́, ó sì tún lo gbólóhùn ‘ṣe sí’ gẹ́gẹ́ bí apá àkọ́kọ́.
- source_word: ὁμοίως
  choice: pẹ̀lú
  rationale: Ní ìṣọ̀kan pẹ̀lú ‘bẹ́ẹ̀ gẹ́gẹ́,’ ó fi hàn pé kí wọ́n ṣe ohun kan náà fún àwọn ẹlòmíràn.
theological_decisions:
- issue: Ìtọ́kasí gbogbogbò ti ἄνθρωποι
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin; aráyé
  rationale: Ọ̀rọ̀ náà jẹ́ ti gbogbo ènìyàn, kò ní ìtumọ̀ akọ nìkan; ‘àwọn ènìyàn’ jẹ́ kedere, ó sì jẹ́ ti Yorùbá àdánidá.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kedere, ọlọ́lá, ó sì lo ‘ẹ’ púpọ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ ẹni kejì ọ̀pọ̀.
