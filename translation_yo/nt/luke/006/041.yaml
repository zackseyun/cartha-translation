id: LUK.6.41
reference: Luke 6:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: yo
  text: Ṣùgbọ́n, èé ṣe tí o fi ń rí èérún tí ó wà ní ojú arákùnrin rẹ[a], tí o kò sì kíyè sí igi ńlá tí ó wà ní ojú ara rẹ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì akọ-ẹyọ kan; síbẹ̀, ẹ̀kọ́ náà kan àwọn ẹlòmíràn lápapọ̀, kì í ṣe arákùnrin akọ tàbí ọmọ ìyá kan nìkan.
    reason: cultural_note
  - marker: b
    text: “Igi ńlá” lè túmọ̀ sí igi ìkọ́lé ńlá, bíi ìtí igi tàbí pátákó ńlá; ó yàtọ̀ gidigidi sí èérún kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: èé ṣe
  rationale: Nínú ìbéèrè ìbáwí yìí, τί ní agbára ìdí pé ‘èé ṣe,’ kì í ṣe ‘kí ni.’
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó ń fi ìyípadà onírẹ̀lẹ̀ tí ó ní ìtakora hàn nínú ẹ̀kọ́ náà.
- source_word: βλέπεις
  choice: ń rí
  rationale: Ó pa àwòrán ojú àti ríran mọ́ ní èdè Yorùbá àdánidá.
- source_word: κάρφος
  choice: èérún igi
  rationale: Ó túmọ̀ sí ẹ̀yà kékeré gbígbẹ bí èérún tàbí koríko; ‘èérún igi’ mú ìyàtọ̀ rẹ̀ sí δοκός ṣe kedere.
- source_word: ἀδελφοῦ
  choice: arákùnrin rẹ
  rationale: Ó pa akọ ẹyọ kan tí ọ̀rọ̀ Gíríìkì lò mọ́, láì dí ìtumọ̀ àpẹẹrẹ rẹ̀ sí arákùnrin inú ilé nìkan.
- source_word: δοκόν
  choice: ìdà igi
  rationale: Δοκός jẹ́ igi ńlá tí a fi ń kọ́ ilé; ‘ìdà igi’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe àfihàn igi ńlá bẹ́ẹ̀.
- source_word: ἰδίῳ
  choice: ìwọ fúnra rẹ
  rationale: Ó mú ìtẹnumọ́ ohun-ìní inú ἰδίῳ jáde, ní ìtakora sí ojú arákùnrin rẹ.
- source_word: κατανοεῖς
  choice: kíyè sí
  rationale: Ó túmọ̀ sí ṣíṣe àkíyèsí tàbí fífi ọkàn wo ohun; ó dá ìtakora pẹ̀lú ‘rí’ sílẹ̀ dáadáa.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφοῦ
  choice: arákùnrin
  alternative: ẹlẹgbẹ́ / arákùnrin tàbí arábìnrin
  rationale: Orísun náà lo akọ ẹyọ kan nínú àpẹẹrẹ ìwà rere. A pa èyí mọ́ nínú ìtumọ̀, a sì ṣàlàyé pé ẹ̀kọ́ náà gbòòrò ju arákùnrin akọ tàbí ọmọ ìyá kan ṣoṣo lọ.
translation_notes:
  register: Èdè Yorùbá òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Èérún igi’ àti ‘ìdà igi’ pa àsọdùn àwòrán ìpilẹ̀ṣẹ̀ mọ́, wọ́n sì ṣe ìyàtọ̀ ohun kékeré àti ohun ńlá kedere.
