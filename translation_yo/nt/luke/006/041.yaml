  to: Ṣùgbọ́n, èé ṣe tí o fi ń rí èérún tí ó wà ní ojú arákùnrin rẹ[a], tí o kò sì kíyè sí igi ńlá tí ó wà ní ojú ara rẹ[b]?
  rationale: A rọ́pò ọ̀rọ̀ tí ó lè ní ìtumọ̀ “idà” pẹ̀lú “igi ńlá” láti mú δοκός hàn ní kedere, a sì tún ìṣètò “ojú tirẹ̀” ṣe sí ìlò Yorùbá tó wọ́pọ̀. Ìbéèrè àròjinlẹ̀, ìtakora ‘rí/kíyè sí,’ akọ-ẹyọ “arákùnrin,” àti ìtẹnumọ́ ohun-ìní ni a pa mọ́.
