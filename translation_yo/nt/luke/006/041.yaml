  source_fidelity: 'Ìtumọ̀ náà gba ìbéèrè ìbáwí náà, ìyàtọ̀ láàárín ohun kékeré nínú ojú arákùnrin àti ohun ńlá nínú ojú ẹni fúnra rẹ̀, àti ìtẹnumọ́ ἰδίῳ, lọ́nà tó dáa. Ṣùgbọ́n “ìdà igi” kò yẹ fún δοκός níhìn-ín: “ìdà” ní ìlò Yorùbá òde òní sábà máa ń túmọ̀ sí idà (ohun ìjà), ó sì lè dá ìtumọ̀ àwòrán náà rú. “Igi ńlá” ń fi ìtumọ̀ igi ìkọ́lé ńlá/beam hàn kedere.'
