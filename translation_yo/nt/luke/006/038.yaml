id: LUK.6.38
reference: Luke 6:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: yo
  text: 'Ẹ fúnni, a ó sì fún yín: ìwọ̀n rere—tí a tẹ̀ mọ́lẹ̀, tí a mì mú kó wọ́ra, tí ó sì ń dà kọjá[a]—ni wọ́n yóò da sínú àpò aṣọ yín[b]. Nítorí ìwọ̀n tí ẹ fi ń wọ̀n ni a ó fi wọ̀n padà fún yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ń ṣàn kọjá.” Àwòrán náà ni ti ohun ìwọ̀n tí a kún débi pé ohun tó wà nínú rẹ̀ ń dà kọjá etí rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “sínú àyà yín.” Èyí ń tọ́ka sí ìdì iwájú aṣọ gígùn tí ènìyàn lè lò láti gba ọkà tàbí ọjà mìíràn.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Ẹ fúnni
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni. Èdè yìí jẹ́ ti àdánidá, ó sì fi ìṣírí gbogbogbò sí fífúnni hàn láìfi dandan túmọ̀ aspect ọ̀rọ̀ Gíríìkì sí ‘ẹ máa bá a nìṣó láti fúnni.’
- source_word: δοθήσεται ὑμῖν
  choice: a ó sì fún yín
  rationale: Ìṣe ọjọ́ iwájú ní ohùn àìṣe ni Gíríìkì. Lílò ‘a’ gẹ́gẹ́ bí olùṣe tí a kò dárúkọ jẹ́ ọ̀nà Yorùbá àdánidá láti pa olùṣe náà mọ́ láìsọ.
- source_word: μέτρον καλὸν
  choice: ìwọ̀n rere
  rationale: ‘Ìwọ̀n’ lè tọ́ka sí iye tí a wọ̀n tàbí ohun èlò ìwọ̀n, ó sì pa àwòrán ọjà inú ọ̀rọ̀ náà mọ́. ‘Rere’ kò fi ìtumọ̀ ‘ọ̀pọ̀ lọ́pọ̀’ kún un ju ohun tí καλόν sọ lọ.
- source_word: πεπιεσμένον
  choice: tí a tẹ̀ mọ́lẹ̀
  rationale: Ó ṣàpèjúwe ọjà bí ọkà tí a tẹ̀ sínú ohun ìwọ̀n kí ó lè wọ̀ púpọ̀ sí i.
- source_word: σεσαλευμένον
  choice: tí a mì mú kó wọ́ra
  rationale: Gbólóhùn náà sọ ní èdè Yorùbá àdánidá pé a mì ohun tó wà nínú ìwọ̀n kí àwọn èròjà rẹ̀ lè tẹ̀ síra, láìpàdánù àwòrán ìwọ̀n.
- source_word: ὑπερεκχυννόμενον
  choice: tí ó sì ń dà kọjá
  rationale: Ó fi ohun tí ó kún débi tí ó ń dà kọjá etí àpò tàbí ohun ìwọ̀n hàn ní kedere. Àlàyé ẹsẹ̀ ìwé pa àṣàyàn ‘ń ṣàn kọjá’ mọ́.
- source_word: δώσουσιν
  choice: wọ́n yóò da
  rationale: Gíríìkì ní olùṣe ọ̀pọ̀ ènìyàn tí a kò sọ ẹni tí wọ́n jẹ́. ‘Wọ́n’ pa àìdánimọ̀ olùṣe náà mọ́; ‘da’ sì bá àwòrán ohun tí a wọ̀n tí a ń dà sínú aṣọ mu.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: sínú ìpọ́ aṣọ ní iwájú yín
  rationale: κόλπος níbí tọ́ka sí apá aṣọ gígùn tí a pò sí iwájú láti gba ọjà, kì í ṣe kìkì apá ara. Ìtumọ̀ yìí mú àṣà ìgbà náà yé òǹkàwé òde òní.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Nítorí ìwọ̀n tí ẹ fi ń wọ̀n
  rationale: Ó pa ìtumọ̀ gangan àti àwòrán ohun èlò ìwọ̀n mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣàn dáadáa.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: ni a ó fi wọ̀n padà fún yín
  rationale: ‘Padà’ fi ìdáhùn tí ἀντί ń tọ́ka sí hàn, ‘a’ sì jẹ́ kí olùṣe má ṣe di ẹni tí a dárúkọ, bí ó ti rí nínú orísun.
theological_decisions:
- issue: Bóyá kí fífúnni nínú ẹsẹ yìí túmọ̀ sí owó tàbí ìtọrẹ nìkan
  choice: A fi ọ̀rọ̀ fífúnni àti ìwọ̀n sílẹ̀ ní ìtumọ̀ gbòòrò wọn.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí fífún tálákà tàbí sí ọ̀rọ̀ owó.
  rationale: Àyíká Lúùkù 6 ní àánú, àìdájọ́, ìdáríjì àti ọ̀làwọ́ nínú. Gíríìkì kò fi àṣẹ náà mọ́ owó nìkan; nítorí náà, ìtumọ̀ kò sọ ọ́ di ẹ̀kọ́ ọrọ̀-ajé tàbí ìlérí ọrọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa àwòrán ìwọ̀n ọjà àti olùṣe tí a kò dárúkọ mọ́. A gbé àmì ẹsẹ̀ ìwé [a] sí ọ̀rọ̀ ìṣàn kọjá àti [b] sí ìpọ́ aṣọ, níbi tí àlàyé kọ̀ọ̀kan ti bá ọ̀rọ̀ mu.
