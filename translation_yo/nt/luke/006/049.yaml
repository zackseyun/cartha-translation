id: LUK.6.49
reference: Luke 6:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó gbọ́ tí kò sì ṣe[a] dàbí ọkùnrin kan tí ó kọ́ ilé sórí ilẹ̀ láìsí ìpìlẹ̀. Nígbà tí odò kọlu ilé náà, ó wó lulẹ̀ lẹ́sẹ̀kẹsẹ̀, ìparun ilé náà sì tóbi gidigidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sì ṣe é,” tàbí “tí kò sì fi í sílò.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ “ṣe” ní ṣókí; nínú àyíká yìí, ó ń tọ́ka sí ṣíṣe ohun tí Jésù sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìṣubú ilé náà sì tóbi.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìfọ́ tàbí ìparun tí ó ṣẹlẹ̀ nígbà tí ilé wó; “ìparun” bá àyíká ọ̀rọ̀ yìí mu dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Ṣùgbọ́n ẹni tí ó gbọ́, tí kò sì ṣe ohun tí mo sọ
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ẹni tí ó gbọ́ tí kò sì ṣe. Fífi “ohun tí mo sọ” kún un mú ìtọ́kasí sí ọ̀rọ̀ Jésù nínú ẹsẹ tó ṣáájú hàn ní Yorùbá àdánidá, láìyí ìtumọ̀ padà.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: dàbí ọkùnrin kan
  rationale: “Dàbí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àfiwé; “ọkùnrin kan” pa àwòrán ẹnìkọ̀ọ̀kan akọ nínú orísun mọ́.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: tí ó kọ́ ilé sórí ilẹ̀ láìsí ìpìlẹ̀
  rationale: Ó fi gbogbo àwòrán ìkọ́lé náà hàn ní èdè Yorùbá tó rọrùn, ó sì pa kókó pé kò sí ìpìlẹ̀ mọ́.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Nígbà tí odò ya lu ilé náà
  rationale: προσρήγνυμι ń tọ́ka sí ìkọlù líle; “ya lu” fi agbára ìkọlù odò hàn, “ilé náà” sì jẹ́ ohun tí arọ́pò-orúkọ Gíríìkì ń tọ́ka sí.
- source_word: εὐθὺς συνέπεσεν
  choice: lẹ́sẹ̀kẹsẹ̀ ni ó wó lulẹ̀
  rationale: “Lẹ́sẹ̀kẹsẹ̀” pa ìtumọ̀ εὐθύς mọ́, “wó lulẹ̀” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ilé tó ṣubú patapata.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: ìparun ilé náà sì pọ̀ gidigidi
  rationale: ῥῆγμα lè túmọ̀ sí yíya, àlàfo, tàbí ìparun tó jẹ́ àbájáde ìwólulẹ̀. “Ìparun” bá àyíká ilé tó wó mu, “pọ̀ gidigidi” sì sọ μέγα ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Èdè akọ aṣojú nínú àfiwé
  choice: ọkùnrin kan
  alternative: ẹnìkan
  rationale: ἀνθρώπῳ jẹ́ ẹyọ akọ nínú àfiwé yìí; ìtumọ̀ náà pa àwòrán orísun mọ́ láìsọ pé ẹ̀kọ́ náà kan àwọn ọkùnrin nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ya lu” àti “wó lulẹ̀” láti mú agbára àwòrán náà jáde ní èdè òde òní.
