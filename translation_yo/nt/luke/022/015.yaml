  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Mo ti fẹ́ gidigidi[a] láti jẹ Ìrékọjá yìí[b] pẹ̀lú yín kí n tó jìyà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù: “Pẹ̀lú ìfẹ́-ọkàn ni mo ti fẹ́.” Gíríìkì lo ọ̀rọ̀ méjì tó jọra láti tẹnumọ́ bí ìfẹ́-ọkàn Jésù ṣe lágbára.'
    reason: lexical_alternative
  - marker: b
    text: “Ìrékọjá yìí” lè tọ́ka ní pàtó sí àsè Ìrékọjá.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá òde òní láti sọ ọ̀rọ̀ ìtàn pé ẹni kan bá àwọn mìíràn sọ̀rọ̀; ó tún pa ìtumọ̀ πρός + accusative mọ́.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Mo ti fẹ́ gidigidi
  rationale: Àkójọpọ̀ orúkọ àti ọ̀rọ̀-ìṣe tó jọra yìí ń fi ìfẹ́-ọkàn Jésù hàn ní kíkankíkan. “fẹ́ gidigidi” mú ìtẹnumọ́ náà jáde ní Yorùbá àdánidá láìṣe àdàkọ gbólóhùn Gíríìkì ní líle.
- source_word: τοῦτο τὸ πάσχα
  choice: Ìrékọjá yìí
  rationale: πάσχα lè tọ́ka sí àjọ̀dún Ìrékọjá tàbí àsè rẹ̀. Nítorí ọ̀rọ̀ “jẹ,” àsè náà wà lọ́kàn nínú àyíká ọ̀rọ̀, ṣùgbọ́n a kò fi “àsè” kún ọ̀rọ̀ pàtàkì, kí àyè ìtumọ̀ inú Gíríìkì lè wà.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: Ìtumọ̀ tààrà àti àdánidá fún φαγεῖν ni “láti jẹ”; kò nílò àfikún.
- source_word: μεθ’ ὑμῶν
  choice: pẹ̀lú yín
  rationale: Ó sọ ìbákẹ́gbẹ́ ní kedere, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: πρὸ τοῦ με παθεῖν
  choice: kí n tó jìyà
  rationale: Gbólóhùn yìí sọ pé jíjẹ Ìrékọjá náà yóò ṣáájú ìjìyà Jésù. “Kí n tó jìyà” jẹ́ kedere, ó sì yẹ fún Yorùbá òde òní láìṣe àlàyé ohun tí ìjìyà náà yóò ní nínú.
theological_decisions:
- issue: Ìtumọ̀ πάσχα nínú àyíká ọ̀rọ̀
  choice: A lo “Ìrékọjá yìí” nínú ọ̀rọ̀ pàtàkì láìfi “àsè” kún un.
  alternative: àsè Ìrékọjá yìí
  rationale: Àyíká ọ̀rọ̀ jíjẹ fi hàn pé àsè Ìrékọjá ni a ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní “Ìrékọjá.” Yíyan ọ̀rọ̀ tó kéré sí i pa ìṣòro ìtumọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì mú un ṣe kedere.
- issue: Agbára ìtẹnumọ́ Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Mo ti fẹ́ gidigidi
  alternative: Pẹ̀lú ìfẹ́-ọkàn ni mo ti fẹ́
  rationale: Yíyan yìí fi ìfẹ́-ọkàn tó lágbára hàn ní Yorùbá tó rọrùn, láìsọ gbólóhùn náà di àjèjì tàbí fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Ìrékọjá” ni a lo gẹ́gẹ́ bí orúkọ àjọ̀dún náà, a sì jẹ́ kí àyíká ọ̀rọ̀ àti àlàyé ìsàlẹ̀ ṣàlàyé pé àsè ni a ń jẹ.
