source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: yo
  text: Wọ́n sì lọ, wọ́n sì rí i gẹ́gẹ́ bí ó ti sọ fún wọn, wọ́n sì pèsè Ìrékọjá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “oúnjẹ Ìrékọjá” tàbí “ọ̀dọ́-àgùntàn Ìrékọjá.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ayẹyẹ Ìrékọjá lápapọ̀, tàbí ní pàtó sí oúnjẹ rẹ̀ tàbí ohun tí wọ́n fi rúbọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: Nítorí náà, wọ́n lọ
  rationale: Aorist participle náà ń tọ́ka sí ohun tí wọ́n kọ́kọ́ ṣe ṣáájú rí-rí; δέ sì ń tẹ ìtàn náà síwájú gẹ́gẹ́ bí èsì sí ìtọ́ni Jésù. Gbólóhùn aláìlẹ́gbẹ́ yìí jẹ́ ti Yorùbá àdánidá.
- source_word: εὗρον
  choice: wọ́n sì rí i
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé wọ́n rí ohun tí wọ́n ń wá. Àrọ́pò-orúkọ “i” dúró fún ipò àti àwọn ìṣètò tí Jésù ti ṣàpèjúwe, bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: καθὼς
  choice: gan-an gẹ́gẹ́ bí
  rationale: Èyí fi hàn pé ohun tí wọ́n rí bá ọ̀rọ̀ Jésù mu pátápátá, láìfi ìtumọ̀ míì kún un.
- source_word: εἰρήκει αὐτοῖς
  choice: ó ti sọ fún wọn
  rationale: Àkókò pluperfect Gíríìkì fi hàn pé Jésù ti sọ ọ́ ṣáájú kí wọ́n tó lọ; “ó ti sọ fún wọn” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtẹ̀lé àkókò náà mọ́.
- source_word: ἡτοίμασαν
  choice: wọ́n sì pèsè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun gbogbo ṣetán; “pèsè” ṣe kedere, ó sì bá àyíká oúnjẹ àti ayẹyẹ mu.
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: “Ìrékọjá” pa ìfẹ̀ Gíríìkì mọ́ láìfi dandan sọ pé oúnjẹ, ọ̀dọ́-àgùntàn, tàbí gbogbo ayẹyẹ náà ni ọ̀rọ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ πάσχα nínú àyíká ọ̀rọ̀
  choice: Ìrékọjá
  alternative: oúnjẹ Ìrékọjá; ọ̀dọ́-àgùntàn Ìrékọjá
  rationale: πάσχα lè tọ́ka sí ayẹyẹ Ìrékọjá lápapọ̀, oúnjẹ rẹ̀, tàbí ẹran ìrúbọ rẹ̀. Bí ó tilẹ̀ jẹ́ pé àyíká náà dá lórí oúnjẹ, lílo “Ìrékọjá” nínú ọ̀rọ̀ pàtàkì pa ìfẹ̀ ọ̀rọ̀ Gíríìkì àti àìdájú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “gan-an gẹ́gẹ́ bí” láti sọ ìbámu pípé ní ọ̀nà àdánidá, a sì pa “Ìrékọjá” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí kò dín ìtumọ̀ πάσχα kù.
