  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: yo
  text: Èmi sì fi ìjọba kan fún yín[a], gẹ́gẹ́ bí Baba mi ti fi ọ̀kan fún mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo bá yín dá májẹ̀mú nípa ìjọba kan … gẹ́gẹ́ bí Baba mi ti bá mi dá májẹ̀mú.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ ṣíṣe májẹ̀mú tàbí ṣíṣe ìpinnu/ètò, pẹ̀lú ìtumọ̀ fífi tàbí fífúnni.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Èmi sì fi fún yín, gẹ́gẹ́ bí Baba mi ti fi fún mi, ìjọba kan.” Ìtò yìí sún mọ́ ìtò ọ̀rọ̀ Gíríìkì, níbi tí “ìjọba kan” ti wà ní òpin tí ó sì ń ṣiṣẹ́ pẹ̀lú àwọn ọ̀rọ̀-ìṣe méjèèjì.
    reason: previous_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: Èmi náà sì
  rationale: Ó pa ìsopọ̀ καί mọ́, ó sì fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ἐγώ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: διατίθεμαι / διέθετό
  choice: fi … fún / ti fi … fún
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ṣíṣe ètò, fífi nǹkan fún ẹnì kan, tàbí ṣíṣe májẹ̀mú. ‘Fi … fún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè gbé ìtumọ̀ fífi tàbí yíyan ìjọba fún wọn láìfi ìtumọ̀ májẹ̀mú lé e lórí. A tún lo gbólóhùn kan náà fún ìṣe Jésù àti ti Baba rẹ̀ láti pa ìbáradọ́gba Gíríìkì mọ́.
- source_word: ὑμῖν / μοι
  choice: fún yín / fún mi
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí fi àwọn olùgbà ohun tí a fi fúnni hàn ní kedere àti ní Yorùbá àdánidá.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó lágbára hàn láàárín ohun tí Jésù ń ṣe àti ohun tí Baba ti ṣe fún un.
- source_word: ὁ πατήρ μου
  choice: Baba mi
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì pa ìbátan Ọmọ àti Baba mọ́.
- source_word: βασιλείαν
  choice: ìjọba kan
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìjọba tàbí àṣẹ ọba tí a fi fúnni; ‘ìjọba kan’ bá àìní árítíkù nínú Gíríìkì mu, ó sì bá ọ̀rọ̀ nípa tábìlì àti àwọn ìtẹ́ nínú ẹsẹ tó tẹ̀ lé e mu.
theological_decisions:
- issue: Bóyá kí a tú διατίθεμαι pẹ̀lú ọ̀rọ̀ májẹ̀mú ní tààrà
  choice: fi … fún
  alternative: bá … dá májẹ̀mú nípa ìjọba kan
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ májẹ̀mú, ṣùgbọ́n ó tún lè túmọ̀ sí fífi tàbí yíyan ohun kan fún ẹnì kan. Ọ̀rọ̀ inú ẹsẹ yìí kò fi dandan mú wa yan ìtumọ̀ májẹ̀mú nìkan; nítorí náà, àkọsílẹ̀ ìsàlẹ̀ ni a ti pa àṣàyàn yẹn mọ́.
- issue: Ìbáṣepọ̀ βασιλείαν pẹ̀lú àwọn ọ̀rọ̀-ìṣe méjèèjì
  choice: A sọ ‘ìjọba kan’ lẹ́yìn ìṣe Jésù, a sì lo ‘ọ̀kan’ fún ìṣe Baba
  alternative: Kí ‘ìjọba kan’ wà ní òpin, gẹ́gẹ́ bí ìtò Gíríìkì, kí ó sì jẹ́ ohun tí àwọn ọ̀rọ̀-ìṣe méjèèjì ń tọ́ka sí
  rationale: Nínú Gíríìkì, βασιλείαν wà ní òpin, ó sì lè jẹ́ àfojúsùn àwọn ọ̀rọ̀-ìṣe méjèèjì. Ìtò yẹn kò rọrùn ní Yorùbá; lílo ‘ọ̀kan’ mú gbólóhùn náà ṣe kedere láìyí ìtumọ̀ rẹ̀ padà, a sì fi ìtò mìíràn sínú àkọsílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan ‘fi … fún’ dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè fi ìtumọ̀ ẹ̀kọ́ kan pàtó lé ẹsẹ náà lórí.
