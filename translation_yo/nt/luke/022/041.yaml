  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: yo
  text: Ó sì ya ara rẹ̀ kúrò lọ́dọ̀ wọn ní nǹkan bí ìwọ̀n ìjù òkúta kan[a]; ó kúnlẹ̀[b], ó sì ń gbàdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní nǹkan bí jíjìn tí a lè ju òkúta kan dé.”
    reason: lexical_alternative
  - marker: b
    text: Ní gangan, “ó gbé àwọn eékún kalẹ̀,” ìyẹn ni pé, “ó kúnlẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: ya ara rẹ̀ kúrò lọ́dọ̀ wọn
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ìṣe aláìṣe ní ìrísí, ní àyíká yìí ó túmọ̀ sí pé Jesu ya ara rẹ̀ sọ́tọ̀ kúrò lọ́dọ̀ àwọn ọmọ-ẹ̀yìn; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì fi ìyapa náà hàn láìjẹ́ líle.
- source_word: ὡσεὶ λίθου βολήν
  choice: tó ìwọ̀n ibi tí òkúta tí a ju lè dé
  rationale: Èyí fi àfojúsùn jíjìn tí jíju òkúta kan lè dé hàn, ó sì pa agbára ìsúnmọ́ ti ὡσεὶ mọ́.
- source_word: θεὶς τὰ γόνατα
  choice: ó kúnlẹ̀
  rationale: Ìtumọ̀ gangan ni ‘nígbà tí ó gbé àwọn eékún kalẹ̀,’ ṣùgbọ́n ó jẹ́ ọ̀nà Gíríìkì fún kíkúnlẹ̀; ‘ó kúnlẹ̀’ jẹ́ Yorùbá àdánidá tí ó pa ìdúró ara náà mọ́.
- source_word: προσηύχετο
  choice: ó sì ń gbàdúrà
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí imperfect Gíríìkì, dípò kí a sọ ọ́ di ìṣe ẹẹ̀kan ṣoṣo.
- source_word: αὐτὸς
  choice: ó
  rationale: Àrọ́pò-orúkọ náà ní ìtẹnumọ́ díẹ̀, ṣùgbọ́n àyíká Yorùbá ti mú ẹni tí a ń sọ̀rọ̀ rẹ̀ hàn kedere; fífi ‘fúnra rẹ̀’ kún un lè mú ìtẹnumọ́ tí kò pọ̀ bẹ́ẹ̀ wọ inú ẹsẹ náà.
- source_word: καὶ
  choice: Ó sì / ó sì
  rationale: ‘Sì’ jẹ́ asopọ̀ ìtàn Yorùbá tó bá καὶ mu, láìfi ìtumọ̀ àfikún bí ‘nígbà náà’ sí i.
theological_decisions:
- issue: Ìdúró adúrà àti bí a ṣe ṣàpẹẹrẹ Kristi
  choice: A sọ ní tààrà pé Jesu ya ara rẹ̀ kúrò, ó kúnlẹ̀, ó sì ń gbàdúrà.
  alternative: Kí a fi àlàyé ìfọkànsìn tàbí ẹ̀kọ́ ìgbàgbọ́ míì kún ìṣe rẹ̀.
  rationale: Ẹsẹ náà ń ròyìn ìṣe, ìdúró ara, àti adúrà Jesu; kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ ẹgbẹ́ ìsìn tàbí àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, pẹ̀lú èdè ìtàn tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘tó ìwọ̀n ibi tí òkúta tí a ju lè dé’ láti yàgò fún àkójọpọ̀ ọ̀rọ̀ tí kò bá Yorùbá mu, a sì lo ‘ń gbàdúrà’ láti pa ìṣe tí ó ń bá a lọ mọ́.
