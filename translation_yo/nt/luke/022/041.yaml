- from: Ó sì ya ara rẹ̀ kúrò lọ́dọ̀ wọn, tó ìwọ̀n ibi tí òkúta tí a ju lè dé[a]; ó kúnlẹ̀[b], ó sì ń gbàdúrà.
  to: Ó sì ya ara rẹ̀ kúrò lọ́dọ̀ wọn ní nǹkan bí ìwọ̀n ìjù òkúta kan[a]; ó kúnlẹ̀[b], ó sì ń gbàdúrà.
  rationale: The revision replaces only the non-idiomatic distance construction with a natural approximate-distance expression. It retains the source’s ambiguity regarding the passive form of ἀπεσπάσθη while rendering its contextual sense naturally, and it preserves the imperfect aspect of προσηύχετο with ‘ń gbàdúrà.’
