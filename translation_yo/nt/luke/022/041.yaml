review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents Jesus’ separation from the disciples, the approximate distance, his kneeling posture, and the ongoing sense of the imperfect ‘he was praying.’ The initial distance expression, however, is syntactically awkward in Yoruba: ‘tó ìwọ̀n ibi’ can read as a result/endpoint rather than an approximate distance.'
  naturalness: ‘Ní nǹkan bí ìwọ̀n ìjù òkúta kan’ is a more idiomatic and concise Standard Yoruba way to express ‘about a stone’s throw.’ The remaining narrative wording is clear and appropriately dignified.
  terminology: ‘Ya ara rẹ̀ kúrò lọ́dọ̀ wọn,’ ‘kúnlẹ̀,’ and ‘ń gbàdúrà’ are suitable modern Standard Yoruba renderings. The revised note preserves the literal image of placing the knees without claiming more than the Greek states.
  issues:
  - severity: medium
    issue: The phrase ‘tó ìwọ̀n ibi tí òkúta tí a ju lè dé’ is awkward and may be read as ‘up to the place where a thrown stone can reach,’ rather than as an approximate measure of distance.
    rationale: ὡσεὶ marks approximation and λίθου βολήν is a conventional distance expression. A Yoruba measure phrase better preserves both features naturally.
  revised_text: Ó sì ya ara rẹ̀ kúrò lọ́dọ̀ wọn ní nǹkan bí ìwọ̀n ìjù òkúta kan[a]; ó kúnlẹ̀[b], ó sì ń gbàdúrà.
