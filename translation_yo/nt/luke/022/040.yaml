  terminology: “Ìdẹwò” is an appropriate primary equivalent for πειρασμόν in this context. The footnote responsibly preserves the broader possible senses, “àdánwò” and “àkókò ìdánwò.” Tone marks, the divine/register-neutral language, and the footnote anchor are all correctly handled.
