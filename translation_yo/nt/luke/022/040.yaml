id: LUK.22.40
reference: Luke 22:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: yo
  text: Nígbà tí ó dé ibi náà, ó sọ fún wọn pé, “Ẹ máa gbàdúrà kí ẹ má bàa wọ inú ìdẹwò[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àdánwò” tàbí “àkókò ìdánwò.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdẹwò láti ṣe ohun búburú, tàbí sí ìgbà tí a ń dán ènìyàn wò ní ọ̀nà tó gbòòrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Nígbà tí ó dé ibi náà
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé ó kọ́kọ́ dé ibi tí a ti mẹ́nu kàn, lẹ́yìn náà ni ó sọ̀rọ̀. Ó mú ìtumọ̀ àkókò inú participle náà jáde láì jẹ́ kí gbólóhùn le.
- source_word: εἶπεν αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: Èyí túmọ̀ λέγω ní kedere, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún fífi ọ̀rọ̀ tí ẹni kan sọ hàn.
- source_word: Προσεύχεσθε
  choice: Ẹ máa gbàdúrà
  rationale: Àṣẹ present tense náà lè tọ́ka sí ìṣe tí wọ́n gbọ́dọ̀ máa bá a lọ. “Ẹ máa gbàdúrà” jẹ́ ti ẹ̀dá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: μὴ εἰσελθεῖν
  choice: kí ẹ má bàa wọ inú
  rationale: “Wọ inú” dúró nítòsí ìtumọ̀ εἰσέρχομαι, dípò lílo ọ̀rọ̀ bí “ṣubú sínú,” èyí tí yóò fi àlàyé kún ọ̀rọ̀ orísun.
- source_word: πειρασμόν
  choice: ìdẹwò
  rationale: Nínú àyíká yìí, “ìdẹwò” bá ìkìlọ̀ nípa ewu ìṣubú nípa tẹ̀mí mu jù. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí àdánwò tàbí àkókò ìdánwò; àlàyé ìsàlẹ̀ ni ó pa ìtumọ̀ yẹn mọ́.
theological_decisions:
- issue: Ìtumọ̀ πειρασμός nínú ìkìlọ̀ Jésù
  choice: ìdẹwò
  alternative: àdánwò tàbí àkókò ìdánwò
  rationale: Àyíká náà ń sọ̀rọ̀ nípa ewu tí àwọn ọmọ-ẹ̀yìn yóò fi kùnà nípa tẹ̀mí, nítorí náà “ìdẹwò” bá a mu. Bí ó tilẹ̀ rí bẹ́ẹ̀, a kò yẹ kí a pa ìtumọ̀ gbòòrò ti àdánwò tàbí ìpọ́njú tí ọ̀rọ̀ Gíríìkì lè ní rẹ́; a fi í sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A gbe àmì àlàyé [a] lẹ́yìn “ìdẹwò,” ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
