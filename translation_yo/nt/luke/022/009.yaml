lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ‘wọ́n’ tọ́ka sí àwọn ọmọ-ẹ̀yìn nínú àyíká ọ̀rọ̀; ‘sì’ fi ìsopọ̀ δέ hàn lọ́nà àdánidá láìfi ìtakora kún un.
- source_word: εἶπαν αὐτῷ
  choice: bi í pé
  rationale: Bí ó tilẹ̀ jẹ́ pé èyí túmọ̀ ní ọ̀nà gígún sí ‘wọ́n sọ fún un,’ ọ̀rọ̀ tí ó tẹ̀ lé e jẹ́ ìbéèrè; ‘bi í pé’ jẹ́ Yorùbá àdánidá tí ó pa ìṣe sísọ sí ẹni náà mọ́.
- source_word: Ποῦ
  choice: Níbo ni
  rationale: Ó béèrè ibi tí ìmúrasílẹ̀ yóò ti ṣẹlẹ̀; ‘Níbo ni’ jẹ́ ìbéèrè ibi ní Yorùbá àdánidá.
- source_word: θέλεις
  choice: o fẹ́
  rationale: ‘Fẹ́’ sọ ìfẹ́ tàbí èrò inú tí θέλω ní di mímọ̀ ní èdè Yorùbá òde òní.
- source_word: ἑτοιμάσωμεν
  choice: kí a ti pèsè rẹ̀ sílẹ̀
  rationale: Ọ̀nà ‘o fẹ́ kí a…’ mú àjọṣe θέλεις pẹ̀lú subjunctive ènìyàn àkọ́kọ́ ọ̀pọ̀ hàn lọ́nà àdánidá. ‘Rẹ̀’ jẹ́ ohun tí a kò dárúkọ nínú Gíríìkì, ṣùgbọ́n àyíká ẹsẹ tó ṣáájú fi hàn pé oúnjẹ Àjọ̀dún Ìrékọjá ni.
