translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó ti yẹ, pẹ̀lú èdè òde òní tí ó ní iyì. ‘Pèsè rẹ̀ sílẹ̀’ jẹ́ kedere sí òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ọ̀rọ̀ gígún ‘múra sílẹ̀’ àti ohun tí Gíríìkì fi sí òye àyíká mọ́.
