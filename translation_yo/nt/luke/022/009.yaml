review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tọ́ka dáadáa sí àwọn ọmọ-ẹ̀yìn, ìbéèrè ibi, ìfẹ́ Jésù, àti ìmúrasílẹ̀ tí a ń béèrè nípa rẹ̀. Ṣùgbọ́n «kí a ti pèsè rẹ̀ sílẹ̀» lè jẹ́ kí «ti» dà bí àmì ìpilẹ̀ ibi (‘láti ibo’) tàbí àmì àsìkò, nígbà tí Ποῦ ti ti sọ ibi náà ní kedere. Yíyọ «ti» kúrò mú ìbéèrè náà ṣe kedere, ó sì sún mọ́ gírámà Yorùbá.
  naturalness: «Wọ́n sì bi í pé» jẹ́ Yorùbá àdánidá fún ọ̀rọ̀ tí ìbéèrè tẹ̀ lé. «Níbo ni o fẹ́ kí a pèsè e sílẹ̀?» jẹ́ ọ̀nà kedere, òde òní, àti ọ̀wọ̀ fún ìbéèrè náà. Arọ́pò-orúkọ «e» ń jẹ́ kí ohun tí àyíká ti fi hàn wà ní ìtumọ̀ láìdárúkọ rẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
  terminology: «Pèsè ... sílẹ̀» bá ἑτοιμάζω mu dáadáa ní àyíká ṣíṣe ìmúrasílẹ̀ fún oúnjẹ Ìrékọjá. Àlàyé ìsàlẹ̀ ojú ìwé yẹ kí ó pe ohun tí a ń tọ́ka sí ní «oúnjẹ Ìrékọjá», kì í ṣe «Àjọ̀dún Ìrékọjá», nítorí ìmúrasílẹ̀ fún oúnjẹ ni àyíká ẹsẹ 8–9.
  issues:
