translation:
  language: yo
  text: Wọ́n sì bi í pé, “Níbo ni o fẹ́ kí a pèsè e sílẹ̀?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà míì: “Níbo ni o fẹ́ kí a múra sílẹ̀?” Gíríìkì kò dárúkọ ohun tí a ó pèsè nínú ẹsẹ yìí; àyíká ẹsẹ tó ṣáájú fi hàn pé oúnjẹ Ìrékọjá ni.'
