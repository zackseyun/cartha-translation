id: LUK.22.11
reference: Luke 22:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: yo
  text: 'Ẹ ó sì sọ fún olórí ilé náà pé: “Olùkọ́ náà sọ fún ọ pé, ‘Níbo ni yàrá àlejò náà wà, níbi tí mo ti lè jẹ àsè Ìrékọjá pẹ̀lú àwọn ọmọ-ẹ̀yìn mi?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: olórí ilé náà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tó jẹ́ olórí agbo ilé. ‘Olórí ilé náà’ jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì pa ìtumọ̀ ipò àṣẹ náà mọ́ láì fi dandan sọ pé òun ni ó ni ilé náà.
- source_word: ὁ διδάσκαλος
  choice: Olùkọ́ náà
  rationale: διδάσκαλος jẹ́ oyè tí wọ́n fi ń dá Jésù mọ̀ níbí. ‘Olùkọ́’ túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà, kò sì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn.
- source_word: κατάλυμα
  choice: yàrá àlejò
  rationale: Ní àyíká ilé tí ẹsẹ yìí ń sọ̀rọ̀ nípa rẹ̀, κατάλυμα tọ́ka sí ibi tí àlejò lè wọ̀ sí tàbí yàrá àlejò. ‘Yàrá àlejò’ bá ọ̀rọ̀ náà mu ní ti ẹ̀dá, kò sọ ọ́ di ilé èrò, bẹ́ẹ̀ ni kò ṣáájú ẹsẹ tó tẹ̀ lé láti pè é ní yàrá òkè.
- source_word: τὸ πάσχα
  choice: àsè Ìrékọjá
  rationale: πάσχα lè tọ́ka sí ayẹyẹ Ìrékọjá tàbí oúnjẹ ayẹyẹ náà. Nítorí ọ̀rọ̀-ìṣe ‘jẹ’ níbí, ‘àsè Ìrékọjá’ mú ohun tí àyíká ọ̀rọ̀ ń tọ́ka sí yé kedere láì pàdánù orúkọ ayẹyẹ Júù náà.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn mi
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ìtumọ̀ Yorùbá tó yẹ fún μαθητής, ó sì ní ìtumọ̀ ẹni tó ń tẹ̀ lé olùkọ́, tó ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀, kì í ṣe akẹ́kọ̀ọ́ inú kíláàsì lásán.
- source_word: φάγω
  choice: tí èmi ti lè jẹ
  rationale: Aorist subjunctive nínú gbólóhùn yìí ń fi iṣẹ́ tí a ń gbèrò tàbí ibi tí iṣẹ́ náà yóò ti ṣe hàn. ‘Tí èmi ti lè jẹ’ pa ìtumọ̀ ‘where I may/can eat’ mọ́ láì sọ ọ́ di ìdánilójú ọjọ́ iwájú.
- source_word: ἐρεῖτε
  choice: Ẹ ó sì sọ
  rationale: Future indicative náà ń ṣiṣẹ́ gẹ́gẹ́ bí ìtọ́ni nípa ohun tí àwọn ọmọ-ẹ̀yìn yóò sọ. ‘Ẹ ó sì sọ’ pa ìrísí ọjọ́ iwájú náà mọ́, ó sì bá ọ̀rọ̀ ìtọ́ni mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ oyè διδάσκαλος tí Jésù fi tọ́ka sí ara rẹ̀
  choice: Olùkọ́ náà
  alternative: Ọ̀gá náà
  rationale: ‘Olùkọ́’ ni ìtumọ̀ tààrà fún διδάσκαλος, ó sì fi oyè tí àwọn olùgbọ́ mọ̀ dá Jésù mọ̀. ‘Ọ̀gá’ lè fi ìtumọ̀ àṣẹ tó gbòòrò sí i kún ọ̀rọ̀ náà ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: A lo Yorùbá ìpele àárín tó mọ́gbọ́n dání, tó bójú mu fún kíkà ní gbangba, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Olórí ilé,’ ‘yàrá àlejò,’ àti ‘ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé Yorùbá òde òní. A pa ọ̀rọ̀ inú ọ̀rọ̀ mọ́ pẹ̀lú àmì àyọlò méjì.
