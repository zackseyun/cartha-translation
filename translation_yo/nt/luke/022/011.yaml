    rationale: κατάλυμα ń tọ́ka sí ibi ìgbọ̀sí/ibùgbé àlejò, kì í ṣe ibi tí ènìyàn ti ń wọlé. Èyí lè ṣi òǹkàwé lọ nípa ìtumọ̀ ọ̀rọ̀ náà.
  - severity: low
