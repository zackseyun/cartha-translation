    rationale: Fífi ‘níbi tí mo ti lè jẹ’ lẹ́yìn gbólóhùn pàtàkì náà jẹ́ kí ìbéèrè náà rọrùn láti ka, láì yí ìtumọ̀ Gíríìkì padà.
