review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì ẹsẹ náà dáadáa: ìtọ́ni ọjọ́ iwájú náà, oyè ‘Olùkọ́,’ yàrá àlejò, Ìrékọjá, àti àwọn ọmọ-ẹ̀yìn ni a ti pa mọ́. Síbẹ̀, a tún un ṣe díẹ̀ kí ìbéèrè nípa ibi náà lè rọrùn sí i nínú Yorùbá, kí ó sì fi ìbáṣepọ̀ ‘yàrá náà—níbi tí’ hàn kedere.'
  naturalness: ‘Níbo ni yàrá àlejò náà wà, níbi tí mo ti lè jẹ …?’ jẹ́ ìṣètò tó mọ́gbọ́n dání ju gbólóhùn ìbátan tó wà nínú àkọ́kọ́ lọ. Àmì ìdánudúró lẹ́yìn ‘pé’ tún bá ìlò Yorùbá mu.
  terminology: ‘Olórí ilé náà,’ ‘Olùkọ́ náà,’ ‘yàrá àlejò,’ ‘àsè Ìrékọjá,’ àti ‘àwọn ọmọ-ẹ̀yìn mi’ bójú mu. Àkọsílẹ̀ ìsàlẹ̀ àkọ́kọ́ ní ‘ibi tí àlejò ti ń wọ̀ sí,’ èyí tí ó yí κατάλυμα padà sí ibi ìwọlé, kì í sì í ṣe ibi ìgbọ̀sí; a ti ṣàtúnṣe èyí.
  issues:
