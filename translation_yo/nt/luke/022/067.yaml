- from: wọ́n ń wí pé, “Bí ìwọ bá ni Mèsáyà[a], sọ fún wa.” Ṣùgbọ́n ó sọ fún wọn pé, “Bí mo bá sọ fún yín, ẹ̀yin kì yóò gbàgbọ́ rárá;”
  to: wọ́n ń wí pé, “Bí ìwọ bá jẹ́ Mèsáyà[a], sọ fún wa.” Ṣùgbọ́n ó sọ fún wọn pé, “Bí mo bá sọ fún yín, ẹ̀yin kì yóò gbàgbọ́ rárá;”
  rationale: Changed only “bá ni” to “bá jẹ́” so that the Yoruba faithfully expresses the Greek predicate “you are the Messiah.” All other wording and the footnote are retained.
  reviewer_model: gpt-5.6-terra
