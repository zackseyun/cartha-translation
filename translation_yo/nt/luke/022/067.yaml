  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: yo
  text: wọ́n ń wí pé, “Bí ìwọ bá jẹ́ Mèsáyà[a], sọ fún wa.” Ṣùgbọ́n ó sọ fún wọn pé, “Bí mo bá sọ fún yín, ẹ̀yin kì yóò gbàgbọ́ rárá;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ ìṣe àbọ̀ tí ó ń lọ lọ́wọ́ yìí so ohun tí ìgbìmọ̀ náà sọ mọ́ ìtàn ẹsẹ tó ṣáájú; ‘wọ́n ń wí pé’ jẹ́ Yorùbá àdánidá tí ó sì pa ìsopọ̀ náà mọ́.
- source_word: Εἰ σὺ εἶ
  choice: Bí ìwọ bá ni
  rationale: Ó pa ìrísí gbólóhùn oníṣ شرط ti Gíríìkì mọ́, pẹ̀lú ìtẹnumọ́ lórí ‘ìwọ,’ dípò yíyí i padà sí ìbéèrè tààrà.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Ní àyíká ìfọ̀rọ̀wánilẹ́nuwò Júù yìí, Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ mú ìtumọ̀ àti ìfojúsọ́nà Júù náà hàn dáadáa.
- source_word: εἰπὸν ἡμῖν
  choice: sọ fún wa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún àṣẹ ‘tell us,’ ó sì pa agbára àṣẹ náà mọ́.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ṣùgbọ́n ó sọ fún wọn pé
  rationale: δέ níbí fi ìyàtọ̀ kékeré hàn láàárín ohun tí wọ́n béèrè àti ìdáhùn Jésù; ‘Ṣùgbọ́n’ mú èyí hàn lọ́nà àdánidá.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Bí mo bá sọ fún yín
  rationale: Ó pa ìtumọ̀ oníṣ шарт ti aorist subjunctive mọ́ ní Yorùbá àdánidá.
- source_word: οὐ μὴ πιστεύσητε
  choice: ẹ̀yin kì yóò gbàgbọ́ rárá
  rationale: οὐ μή pẹ̀lú subjunctive jẹ́ ìkọ̀ tí a tẹnumọ́ gidigidi; ‘kì yóò … rárá’ fi agbára yẹn hàn kedere.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká yìí, ó sì ní í ṣe pẹ̀lú ìrètí Mèsáyà àwọn Júù. ‘Mèsáyà’ pa ìtumọ̀ yẹn mọ́; àkọsílẹ̀ ìsàlẹ̀ fún ‘Kristi’ gẹ́gẹ́ bí ọ̀nà míì tí a mọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A pa ìrísí oníṣ шарт àti ìkọ̀ tí a tẹnumọ́ nínú Gíríìkì mọ́.
