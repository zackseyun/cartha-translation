review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the participial speech introduction, the conditional challenge, the title “Messiah,” the imperative, and the emphatic future denial. However, “Bí ìwọ bá ni Mèsáyà” means roughly “If you have a Messiah” rather than “If you are the Messiah.”
  naturalness: Apart from the predicate error with “ní,” the wording is clear, modern Standard Yoruba and retains the Greek conditional and emphatic negation naturally.
  terminology: “Mèsáyà” is an appropriate translation of ὁ χριστός in this setting, and the footnote “Kristi” properly supplies the conventional alternative. “gbọ́gbọ́ rárá” is not needed; the retained “kì yóò gbàgbọ́ rárá” is idiomatic and emphatic.
  issues:
  - severity: high
    issue: Incorrect rendering of εἰ σὺ εἶ ὁ χριστός
    rationale: 'The verb “ní” ordinarily expresses possession, so “Bí ìwọ bá ni Mèsáyà” does not identify the addressee as the Messiah. Yoruba requires the copular/predicative verb “jẹ́”: “Bí ìwọ bá jẹ́ Mèsáyà.”'
  revised_text: wọ́n ń wí pé, “Bí ìwọ bá jẹ́ Mèsáyà[a], sọ fún wa.” Ṣùgbọ́n ó sọ fún wọn pé, “Bí mo bá sọ fún yín, ẹ̀yin kì yóò gbàgbọ́ rárá;”
  revised_footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
  revision_rationale: Changed only “bá ni” to “bá jẹ́” so that the Yoruba faithfully expresses the Greek predicate “you are the Messiah.” All other wording and the footnote are retained.
