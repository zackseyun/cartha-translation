id: LUK.22.31
reference: Luke 22:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: yo
  text: '“Símónì, Símónì, kíyèsí i: Satani ti béèrè pé kí a fi gbogbo yín fún un, láti gbọn yín nínú àlẹ̀ bí àlìkámà.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: wò ó!
  rationale: Ó jẹ́ ọ̀rọ̀ ìkìlọ̀ tí ń pe Símónì pé kí ó fiyè sí ohun pàtàkì tí Jésù fẹ́ sọ.
- source_word: ἐξῃτήσατο
  choice: ti béèrè láti gba
  rationale: Ọ̀rọ̀ náà túmọ̀ sí béèrè ohun kan fún ara ẹni pẹ̀lú ìtẹnumọ́; yíyan yìí mú èrò ìbéèrè líle náà jáde láìfi ohun tí a kò sọ kún un.
- source_word: ὑμᾶς
  choice: gbogbo yín … yín
  rationale: Arọ́pò-orúkọ Gíríìkì náà jẹ́ ọ̀pọ̀ ènìyàn. ‘Gbogbo’ mú kí ó ṣe kedere ní Yorùbá pé Satani béèrè àwọn ọmọ-ẹ̀yìn náà lápapọ̀, kì í ṣe Símónì nìkan.
- source_word: σινιάσαι ὡς τὸν σῖτον
  choice: fọn yín bí àlìkámà
  rationale: ‘Fọn’ jẹ́ ọ̀rọ̀ àgbẹ̀ Yorùbá tó bá àwòrán yíyan ọkà kúrò lára ìyàngbò mu, ó sì pa àfiwé inú orísun mọ́.
theological_decisions:
- issue: Ẹni tí Satani béèrè lọ́wọ́ rẹ̀ kò hàn gbangba nínú ẹsẹ náà.
  choice: A kò sọ ẹni tí Satani béèrè lọ́wọ́ rẹ̀.
  alternative: ‘Satani ti béèrè lọ́wọ́ Ọlọ́run…’
  rationale: Orísun Gíríìkì kò dárúkọ ẹni tí a béèrè lọ́wọ́ rẹ̀; fífi ‘Ọlọ́run’ kún un yóò tú àìṣedéédé gidi náà ní ọ̀nà tí ẹsẹ náà fúnra rẹ̀ kò ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣe kedere fún òǹkàwé lásán. Àtúnṣe ọ̀pọ̀ ènìyàn nínú ‘gbogbo yín’ ṣe pàtàkì nítorí Yorùbá lè lo ‘yín’ fún ọ̀pọ̀ ènìyàn tàbí fún ẹnì kan ní ọ̀wọ̀.
