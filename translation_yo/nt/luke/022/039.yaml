id: LUK.22.39
reference: Luke 22:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: yo
  text: Ó sì jáde, ó lọ sí Òkè Ólífì gẹ́gẹ́ bí àṣà rẹ̀; àwọn ọmọ-ẹ̀yìn náà sì tẹ̀ lé e.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Ó sì jáde
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì; fífi í hàn gẹ́gẹ́ bí ìṣe tó tẹ̀ lé ìtàn jẹ́ èdè Yorùbá àdánidá, láì mú un le ju bó ṣe yẹ lọ.
- source_word: ἐπορεύθη
  choice: ó lọ
  rationale: Πορεύομαι jẹ́ ọ̀rọ̀ ìrìn tí ó wọ́pọ̀; “ó lọ” mú ìtumọ̀ rẹ̀ jáde ní kedere àti ní èdè òde òní.
- source_word: κατὰ τὸ ἔθος
  choice: gẹ́gẹ́ bí àṣà rẹ̀
  rationale: Gbólóhùn náà ń tọ́ka sí ohun tí Jésù máa ń ṣe déédéé. Yorùbá àdánidá nílò ẹni tí àṣà náà jẹ́ tirẹ̀ níbí, àyíká ọ̀rọ̀ sì fi hàn pé Jésù ni.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sí Òkè Ólífì
  rationale: Èyí ni orúkọ ibi tí ó ti fìdí múlẹ̀ ní Yorùbá, ó sì bá ìtumọ̀ orúkọ Gíríìkì mu.
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé e
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ gangan ti títẹ̀ lé ẹnì kan mọ́, ó sì yẹ fún ìrìn àwọn ọmọ-ẹ̀yìn pẹ̀lú Jésù.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Àtúmọ̀ yìí jẹ́ èdè Yorùbá tí ó wọ́pọ̀ fún àwọn μαθηταί; a kò fi “rẹ̀” kún un nítorí kò sí ní gbangba nínú Gíríìkì.
- source_word: καὶ … δὲ … καὶ
  choice: sì … sì … náà
  rationale: Àwọn ọ̀rọ̀-asopọ̀ wọ̀nyí ń tẹ ìtàn síwájú, “náà” sì pa agbára àfikún ti καὶ tó wà níwájú “àwọn ọmọ-ẹ̀yìn” mọ́.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé àṣà náà jẹ́ ti Jésù
  choice: gẹ́gẹ́ bí àṣà rẹ̀
  alternative: gẹ́gẹ́ bí àṣà
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò lo arọ́pò-orúkọ ohun-ìní ní gbangba, àyíká ọ̀rọ̀ fi Jésù hàn gẹ́gẹ́ bí ẹni tí ó ní àṣà náà. “Gẹ́gẹ́ bí àṣà rẹ̀” jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá láì yí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ìṣàmì ohùn ní kíkún, a sì pa ìṣàn ìtàn Gíríìkì mọ́ ní ọ̀nà àdánidá.
