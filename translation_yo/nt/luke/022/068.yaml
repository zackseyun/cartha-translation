  text: But if I ask[a], you will certainly not answer.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá béèrè[a], ẹ̀yin kì yóò dáhùn rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ìrísí ọ̀rọ̀ Gíríìkì, “ẹ̀yin kì yóò dáhùn ní ọ̀nàkankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: bí … bá
  rationale: Ìṣètò ‘bí … bá’ ni ọ̀nà àdánidá ní Yorùbá láti fi gbé gbólóhùn oní شرط tí ó ń tọ́ka sí ohun tí ó lè ṣẹlẹ̀ síwájú kalẹ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ọ̀rọ̀ yìí àti ohun tí ó yí i ká.
- source_word: ἐρωτήσω
  choice: mo bá béèrè
  rationale: ‘Béèrè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì fi ìtumọ̀ ìfọ̀rọ̀wánilẹ́nuwò líle kún ọ̀rọ̀ Gíríìkì.
- source_word: οὐ μὴ
  choice: kì yóò … rárá
  rationale: Àpapọ̀ ‘kì yóò’ àti ‘rárá’ mú ìkọ̀ tí ó lágbára nínú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἀποκριθῆτε
  choice: ẹ̀yin … dáhùn
  rationale: ‘Dáhùn’ ni ìbámu tààrà, ó sì bójú mu ọ̀rọ̀ ìbéèrè àti ìdáhùn nínú àyíká yìí; ‘ẹ̀yin’ mú ẹni kejì ọ̀pọ̀ tí ó wà nínú fáwẹ́lì Gíríìkì hàn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtẹnumọ́ οὐ μή ni a fi ‘kì yóò … rárá’ hàn láì sọ ìtumọ̀ rẹ̀ di ‘láéláé,’ èyí tí ó lè fi àkókò gígùn tí kò sí nínú orísun kún un.
