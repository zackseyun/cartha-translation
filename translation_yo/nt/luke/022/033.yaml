source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Olúwa, mo ti múra tán láti bá ọ lọ sí ẹ̀wọ̀n àti sí ikú.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n ó
  rationale: Àpilẹ̀kọ náà dúró gẹ́gẹ́ bí arọ́pò-orúkọ fún Peteru, δέ sì fi ìyàtọ̀ pẹ̀lẹ́ hàn sí ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ọ̀rọ̀ tí a sọ tààrà hàn, láì sọ ẹni tí αὐτῷ ń tọ́ka sí ní pàtó ju Gíríìkì lọ.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ ọ̀wọ̀ àti ìwọ̀n ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ mọ́, láì sọ ọ́ di “Olùkọ́” nìkan.
- source_word: μετὰ σοῦ
  choice: bá ọ lọ
  rationale: Ìṣètò “bá … lọ” jẹ́ ọ̀nà Yorùbá àdánidá fún ìrìn papọ̀ tí μετά pẹ̀lú ọ̀rọ̀ oníṣe olùní ń sọ.
- source_word: ἕτοιμός εἰμι
  choice: mo ti múra tán
  rationale: Gbólóhùn yìí fi ìmúrasílẹ̀ àti ìfẹ́ Peteru láti ṣe ohun náà hàn ní Yorùbá tó ṣe kedere.
- source_word: καὶ ... καὶ
  choice: sí ẹ̀wọ̀n àti sí ikú
  rationale: Àtúnṣe “sí” níwájú ohun méjèèjì pa ìfarajọ àti ìtẹnumọ́ ìṣètò Gíríìkì mọ́.
- source_word: εἰς φυλακὴν
  choice: sí ẹ̀wọ̀n
  rationale: Nínú àyíká yìí, φυλακή túmọ̀ sí dídè tàbí fífi sínú ẹ̀wọ̀n; “sí ẹ̀wọ̀n” jẹ́ kúkúrú, ó sì ṣe kedere.
- source_word: εἰς θάνατον
  choice: sí ikú
  rationale: Èyí pa ìtọ́sọ́nà εἰς àti ìfarajọ rẹ̀ pẹ̀lú “sí ẹ̀wọ̀n” mọ́.
- source_word: πορεύεσθαι
  choice: láti ... lọ
  rationale: “Lọ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ìrìn tàbí títẹ̀lé ipa-ọ̀nà tí ọ̀rọ̀ yìí ń sọ níbí.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí orúkọ oyè fún Jésù
  choice: Olúwa
  alternative: Olùkọ́
  rationale: “Olúwa” pa ọlá orúkọ oyè náà àti agbára ìtumọ̀ rẹ̀ nípa Jésù mọ́, láì fi ẹ̀kọ́ ìjọ kan pàtó kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lasán. A fi àmì ohùn sí gbogbo ibi tí ó yẹ, a sì pa ìfọkànsìn Peteru tó lágbára mọ́ nínú “mo ti múra tán.”
