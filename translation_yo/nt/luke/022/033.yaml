  source_fidelity: 'Ìtumọ̀ náà fi Peteru hàn gẹ́gẹ́ bí ẹni tó dáhùn sí Jésù, ó sì pa ìtumọ̀ àwọn apá pàtàkì Gíríìkì mọ́: ìyàtọ̀ pẹ̀lẹ́ nínú δέ, ìpè “Κύριε,” ìmúrasílẹ̀ ẹni tí ń sọ, ìbáṣepọ̀ “pẹ̀lú rẹ,” àti àwọn ibi méjèèjì—ẹ̀wọ̀n àti ikú. “Mo ti múra tán” jẹ́ ọ̀nà Yorùbá tí ó dára láti ṣàfihàn ipò ìmúrasílẹ̀ tí ἕτοιμός εἰμι ń sọ.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé, ó ní ìwọ̀ntúnwọ̀nsì àti ìwọ̀n ọlá tó yẹ fún ọ̀rọ̀ Peteru sí Jésù. “Bá ọ lọ sí ẹ̀wọ̀n àti sí ikú” jẹ́ èdè kedere, ó sì pa ìfarajọ àwọn apá méjèèjì mọ́. Àmì ohùn àti ìkọ̀wé náà bójú mu.
