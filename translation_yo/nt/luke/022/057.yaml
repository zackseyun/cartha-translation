  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì: ẹni náà sẹ́, ó sì sọ pé kò mọ Jesu; γύναι sì jẹ́ ìpè tààrà sí obìnrin. Ṣùgbọ́n àfikún “ẹ̀” lẹ́yìn “sẹ́” kò yẹ kí a pa mọ́, nítorí Gíríìkì fi ohun tí ó sẹ́ sílẹ̀ láìsọ, ó sì lè jẹ́ aláìmọ́gbọ́n-dání gẹ́gẹ́ bí àrọ́pò-orúkọ ní Yorùbá.'
