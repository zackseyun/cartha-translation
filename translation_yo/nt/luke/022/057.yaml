  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sẹ́, ó ní, “Obìnrin, èmi kò mọ̀ ọ́n.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ó sẹ́ ẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti sẹ́ tàbí kọ ohun kan. Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ohun tí ó sẹ́ ní tààrà, èdè Yorùbá àdánidá ń fẹ́ àrọ́pò-orúkọ ohun níbí; “ẹ̀” tọ́ka sí ọ̀rọ̀ ẹ̀sùn tí obìnrin náà sọ, kì í ṣe pé a fi “òun” ṣe Jesu ní pàtó.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí fi ọ̀rọ̀ tí ó sọ láti sẹ́ ẹ̀ hàn ní èdè Yorùbá tí ó ṣe déédéé, láìdi ìsopọ̀ ọ̀rọ̀ náà di líle.
- source_word: Οὐκ οἶδα
  choice: èmi kò mọ̀
  rationale: Èyí túmọ̀ ìkọ̀ tí ó wà pẹ̀lú ọ̀rọ̀-ìṣe “mọ̀” ní tààrà; “èmi” tún mú ìtẹnumọ́ tí ó bá ìdáhùn Pétérù mu wá.
- source_word: αὐτόν
  choice: ọ́n
  rationale: Àrọ́pò-orúkọ náà tọ́ka sí Jesu. “Ọ́n” jẹ́ àrọ́pò-orúkọ ẹni ẹlẹ́ẹ̀kẹta tí ó bójú mu ní Yorùbá, láìfi “ọkùnrin yìí” kún ohun tí Gíríìkì kò sọ.
- source_word: γύναι
  choice: Obìnrin
  rationale: Èyí pa ìpè tààrà γύναι mọ́. Àwọn ọ̀rọ̀ bí “ìyá” tàbí “madam” yóò mú ìtumọ̀ ìbòwọ̀ tàbí ìbáṣepọ̀ kan wọlé tí kò ṣe kedere nínú Gíríìkì.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí Pétérù sẹ́ ní gbangba
  choice: A lo “ó sẹ́ ẹ̀,” níbi tí “ẹ̀” ti tọ́ka sí ẹ̀sùn tàbí ọ̀rọ̀ tí a ṣẹ̀ṣẹ̀ sọ.
  alternative: “Ó sẹ́, ó ní …” tàbí “ó sẹ́ Jesu, ó ní …”
  rationale: Gíríìkì kò ní àfikún ohun lẹ́yìn ἠρνήσατο. “Ẹ̀” jẹ́ kí Yorùbá dùn bí èdè àdánidá, ṣùgbọ́n kò sọ pé Jesu fúnra rẹ̀ ni ohun gírámà tí ó sẹ́; èyí pa àìṣe-kedere inú orísun mọ́ dé ìwọ̀n tí ó yẹ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. A gbe “Obìnrin” sí iwájú gẹ́gẹ́ bí ìṣètò ọ̀rọ̀ Yorùbá tí ó rọrùn, bí ó tilẹ̀ jẹ́ pé ó wà ní òpin gbólóhùn Gíríìkì; ìtumọ̀ àti agbára ìpè tààrà náà kò yí padà.
