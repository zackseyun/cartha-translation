base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún un pé, “Júdásì, ṣé ìwọ fi ìfẹnukonu ń da Ọmọ Ènìyàn?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà gangan síi, “Júdásì, ṣé ìwọ fi ìfẹnukonu ń fi Ọmọ Ènìyàn lé ọwọ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Asọ̀pọ̀ δέ rọra fi ìdáhùn Jésù dojú kọ ohun tí Júdásì ń ṣe; “Ṣùgbọ́n” mú ìyàtọ̀ yìí hàn lọ́nà àdánidá.
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Èyí dúró fún ọ̀rọ̀-ìṣe náà àti arọ́pò-orúkọ αὐτῷ, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tààrà.
- source_word: Ἰούδα
  choice: Júdásì
  rationale: Orúkọ ẹni tí a ń pè ní tààrà ni; “Júdásì” ni ìrísí orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: φιλήματι
  choice: ìfẹnukonu ni ìwọ fi
  rationale: Dative yìí ń tọ́ka sí ohun èlò tàbí ọ̀nà tí a fi ṣe ohun náà; ìṣètò “ni ... fi” jẹ́ Yorùbá àdánidá, ó sì tẹ ìfẹnukonu náà mọ́lẹ̀ gẹ́gẹ́ bí ohun èlò ìfini-lọ́wọ́.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa àkọlé tí Jésù máa ń lò fún ara rẹ̀ mọ́, pẹ̀lú ìrísí rẹ̀ nínú Gíríìkì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì.
- source_word: παραδίδως
  choice: ń fi ... lé wọn lọ́wọ́
  rationale: Ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ náà ni fífi ẹnìkan lé ẹlòmíràn lọ́wọ́; nínú àyíká yìí ó ní agbára ìwà ọ̀dàlẹ̀, ṣùgbọ́n yíyan ọ̀rọ̀ gangan yìí pa àwọ̀ méjèèjì mọ́, ó sì ṣàfihàn ìṣe tí ó ń lọ lọ́wọ́.
theological_decisions:
- issue: Ìtumọ̀ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” ni àkọlé Kristi tí a ti mọ̀ nínú Ìhìn Rere; ó pa ìṣètò Gíríìkì àti ìró Dáníẹ́lì mọ́ láì sọ ọ́ di ọ̀rọ̀ gbogbogbò nípa ènìyàn.
- issue: Ìtumọ̀ παραδίδως nínú ọ̀rọ̀ ìwà ọ̀dàlẹ̀
  choice: ń fi ... lé wọn lọ́wọ́
  alternative: ń dà ...
  rationale: Àyíká náà fi hàn pé ìwà ọ̀dàlẹ̀ ni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí fífi ẹni lé ẹlòmíràn lọ́wọ́. Ìtumọ̀ yìí pa ìṣe gangan àti ìtumọ̀ búburú inú àyíká náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọlọ́wọ̀, àdánidá, ó sì ṣe kedere fún òǹkàwé òde òní. Ìbéèrè náà pa ìbáwí àti ìyàlẹ́nu inú ọ̀rọ̀ Jésù mọ́.
