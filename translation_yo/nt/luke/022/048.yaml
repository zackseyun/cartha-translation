  source_fidelity: Àkọlé náà, orúkọ náà, ìbéèrè oníwà-ìbáwí, àti àkókò ìṣe tí ń lọ lọwọ́ ni a pa mọ́. Síbẹ̀, “fi ... lé wọn lọ́wọ́” fi olùgbọ́/ẹgbẹ́ tí kò sí nínú Gíríìkì (“wọn”) kún un, ó sì jẹ́ kí gbolóhùn náà dùn bíi pé ohun kan ni Júdásì ń lò láti fi Jésù fún ẹgbẹ́ kan. Ìtumọ̀ àtúnṣe náà lo “ń da” fún agbára ọ̀dàlẹ̀ tí παραδίδως ní nínú àyíká yìí.
  naturalness: “Ìfẹnukonu ni ìwọ fi ń fi ...” ní lílò “fi” lẹ́ẹ̀mejì, ó sì wúwo díẹ̀. “Ṣé ìwọ fi ìfẹnukonu ń da Ọmọ Ènìyàn?” jẹ́ Yorùbá boṣewa, ó ṣe kedere, ó sì pa ìbéèrè ìbáwí Jésù mọ́.
  terminology: “Jésù,” “Júdásì,” “ìfẹnukonu,” àti “Ọmọ Ènìyàn” yẹ, wọ́n sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu. “Ń da” jẹ́ ìtumọ̀ àdánidá fún ìṣe ìfìlélọ́wọ́ tí ó jẹ́ ìwà ọ̀dàlẹ̀ nínú àyíká ẹsẹ̀ yìí. Àlàyé ẹsẹ̀-ìsàlẹ̀ gbọdọ̀ jẹ́ yíyàn gangan “fífi lé ọwọ́,” kì í ṣe àtúnsọ “ń da.”
