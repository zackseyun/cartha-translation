  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: yo
  text: kí ẹ lè jẹ, kí ẹ sì mu ní tábìlì mi nínú ìjọba mi, ẹ ó sì jókòó lórí àwọn ìtẹ́, níbi tí ẹ ó ti ṣe ìdájọ́[a] àwọn ẹ̀yà Ísírẹ́lì méjìlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣàkóso àwọn ẹ̀yà Ísírẹ́lì méjìlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí àbájáde ìlérí tó ṣáájú hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ète mọ́.
- source_word: ἔσθητε καὶ πίνητε
  choice: jẹ, kí ẹ sì mu
  rationale: Àwọn ọ̀rọ̀ méjèèjì wà lábẹ́ ἵνα; ìtumọ̀ yìí mú kí ète náà ṣe kedere láìdi gbolohun náà lọ́wọ́.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: ní tábìlì mi
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ jíjẹun papọ̀ ní tábìlì, láìtúmọ̀ ἐπί ní ọ̀nà tí yóò dà bí ẹni pé wọ́n wà lókè tábìlì gan-an.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: nínú ìjọba mi
  rationale: βασιλεία lè túmọ̀ sí ìjọba gẹ́gẹ́ bí agbègbè tàbí ìṣàkóso; àwòrán àsè àti àwọn ìtẹ́ níbí ṣe àtìlẹ́yìn fún “ìjọba,” tó sì tún ní ìtumọ̀ ọlá ọba nínú.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: ẹ ó sì jókòó lórí àwọn ìtẹ́
  rationale: Ó pa àwòrán ìjókòó lórí ìtẹ́ àti ìtumọ̀ ọjọ́ iwájú mọ́ ní Yorùbá tó mọ́.
- source_word: κρίνοντες
  choice: kí ẹ máa ṣe ìdájọ́
  rationale: κρίνω túmọ̀ ní tààrà sí ṣíṣe ìdájọ́, bí ó tilẹ̀ jẹ́ pé ó tún lè ní èrò ìṣàkóso nínú; yíyan yìí pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: àwọn ẹ̀yà Ísírẹ́lì méjìlá
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa ìtọ́kasí májẹ̀mú sí ẹ̀yà Ísírẹ́lì méjìlá mọ́.
theological_decisions:
- issue: Irú ipa tí àwọn ọmọ-ẹ̀yìn yóò kó nínú κρίνοντες àwọn ẹ̀yà Ísírẹ́lì méjìlá
  choice: ṣe ìdájọ́
  alternative: ṣàkóso
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ iṣẹ́ adájọ́ àti ti alákòóso. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ tààrà “ṣe ìdájọ́” mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì tọ́ka sí ìtumọ̀ ìṣàkóso láìfi ipa mú ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tó ní κρίνοντες, nítorí àlàyé náà kan “ṣe ìdájọ́,” kì í ṣe “ìjọba mi.”
