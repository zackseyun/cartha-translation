  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: yo
  text: Àjọ̀dún Búrẹ́dì Àìwú[a], èyí tí a ń pè ní Ìrékọjá, ń sún mọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìrékọjá àti Àjọ̀dún Búrẹ́dì Àìwú ní ìbáṣepọ̀ tímọ́tímọ́; nínú ìlò àwọn Júù, a lè lo àwọn orúkọ náà pọ̀, tàbí kí orúkọ ọ̀kan dúró fún gbogbo àkókò àjọ̀dún náà.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: ń sún mọ́lé
  rationale: 'Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣẹ̀lẹ̀ tí ń lọ lọ́wọ́ hàn: àjọ̀dún náà ń bọ̀ síwájú, ó sì ti fẹ́ dé. ‘Ń sún mọ́lé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.'
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Níhìn-ín δέ jẹ́ àmì ìyípadà kékeré nínú ìtàn, kì í ṣe àtakò tó lágbára. Yorùbá kò nílò kí a fi ọ̀rọ̀ bí ‘Ǹjẹ́’ tàbí ‘Ṣùgbọ́n’ sí i ní dandan.
- source_word: ἑορτὴ
  choice: Àjọ̀dún
  rationale: ἑορτή túmọ̀ sí àjọ̀dún ẹ̀sìn; ‘àjọ̀dún’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì bá ìforúkọsílẹ̀ àjọ̀dún Júù mu.
- source_word: τῶν ἀζύμων
  choice: Àkàrà Àìwú
  rationale: ἄζυμα tọ́ka sí oúnjẹ àkàrà tí kò ní ìwú. ‘Àkàrà Àìwú’ jẹ́ orúkọ ṣókí, tó ṣe kedere fún àjọ̀dún náà, láìfi ohun tí orísun kò sọ kún un.
- source_word: ἡ λεγομένη
  choice: èyí tí a ń pè ní
  rationale: Gbólóhùn yìí pa agbára àlàyé ti participle Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Πάσχα
  choice: Ìrékọjá
  rationale: ‘Ìrékọjá’ jẹ́ orúkọ Yorùbá tí a mọ̀ fún àjọ̀dún Pásíkà àwọn Júù, ó sì mú èrò ìrékọjá tó wà lẹ́yìn orúkọ náà jáde fún òǹkàwé.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín Àjọ̀dún Àkàrà Àìwú àti Ìrékọjá
  choice: 'Fi ọ̀rọ̀ Lúùkù sílẹ̀ gẹ́gẹ́ bí ìdánimọ̀ àlàyé: ‘Àjọ̀dún Àkàrà Àìwú, èyí tí a ń pè ní Ìrékọjá.’'
  alternative: Ṣe àfihàn wọn gẹ́gẹ́ bí àjọ̀dún méjì tí a ya sọ́tọ̀ pátápátá.
  rationale: Ìkọ̀wé Gíríìkì fúnra rẹ̀ fi ‘Ìrékọjá’ hàn gẹ́gẹ́ bí orúkọ tí a ń pe àjọ̀dún náà. Ìtumọ̀ náà kò fi ìyàtọ̀ ọjọ́ tàbí ìṣọ̀kan tó ju ohun tí Lúùkù sọ lọ lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A yàgò fún fífi àsopọ̀ ìbẹ̀rẹ̀ tí kò pọn dandan sí δέ.
