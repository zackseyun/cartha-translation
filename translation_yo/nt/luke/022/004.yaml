  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: yo
  text: Ó sì lọ bá àwọn olórí àlùfáà àti àwọn ọ̀gá ẹ̀ṣọ́ sọ̀rọ̀ nípa bí yóò ṣe fi í lé wọn lọ́wọ́[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí yóò ṣe dà á.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fi í lé ẹlòmíràn lọ́wọ́,” “fà á lé ẹlòmíràn lọ́wọ́,” tàbí, nínú àyíká yìí, “dà á.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn ọ̀gá ẹ̀ṣọ́” wọ̀nyí jẹ́ àwọn aláṣẹ tẹ́ńpìlì tàbí àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì, kì í ṣe ọmọ ogun Róòmù.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: Ó sì lọ
  rationale: Ọ̀rọ̀ ìṣe àkókò aorist yìí ṣáájú ọ̀rọ̀ ìṣe pàtàkì, ó sì fi hàn pé Júdásì kọ́kọ́ lọ. Èdè Yorùbá àdánidá lè sọ ọ́ ní ṣókí pé “ó sì lọ” láì sọ ìtẹ̀lé ìṣẹ̀lẹ̀ náà nù.
- source_word: συνελάλησεν
  choice: bá ... sọ̀rọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísọ̀rọ̀ papọ̀ tàbí ṣíṣe ìgbìmọ̀. “Bá ... sọ̀rọ̀” jẹ́ èdè Yorùbá tó ṣe kedere, tí àyíká gbólóhùn sì fi hàn pé ìjíròrò ète ni.
- source_word: ἀρχιερεῦσιν
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe ọ̀pọ̀ ẹni tó ń di ipò olórí àlùfáà kan náà mú lẹ́ẹ̀kan náà.
- source_word: στρατηγοῖς
  choice: àwọn ọ̀gágun
  rationale: “Ọ̀gágun” mú ìtumọ̀ aláṣẹ tàbí olórí ẹgbẹ́ ẹ̀ṣọ́ jáde. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé àwọn aláṣẹ tẹ́ńpìlì tàbí olórí ẹ̀ṣọ́ tẹ́ńpìlì ni wọ́n ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí.
- source_word: τὸ πῶς
  choice: nípa bí ... ṣe
  rationale: Ìkọ̀lé yìí ń ṣàgbékalẹ̀ kókó ìjíròrò náà; “nípa bí ... ṣe” jẹ́ ìtumọ̀ Yorùbá tó bójú mu.
- source_word: παραδῷ
  choice: yóò ṣe fi í lé wọn lọ́wọ́
  rationale: “Fi ... lé ... lọ́wọ́” pa ìtumọ̀ gbooro ti fífi ẹni lé ẹlòmíràn lọ́wọ́ mọ́, láì fi ìtumọ̀ pàtó ti ìwà ọ̀dàlẹ̀ sínú ọ̀rọ̀ náà ní dandan.
- source_word: αὐτοῖς ... αὐτόν
  choice: fi í lé wọn lọ́wọ́
  rationale: “Í” tọ́ka sí Jésù, “wọn” sì tọ́ka sí àwọn olórí àlùfáà àti àwọn ọ̀gágun; ìkọ̀lé Yorùbá náà ya àwọn arọ́pò-orúkọ méjèèjì sọ́tọ̀ kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδῷ nínú ìṣe Júdásì
  choice: fi í lé wọn lọ́wọ́
  alternative: dà á / fi í hàn fún wọn ní ọ̀nà ọ̀dàlẹ̀
  rationale: Àyíká fi hàn pé ìwà ọ̀dàlẹ̀ ni Júdásì ń ṣe, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbooro sí i, ìyẹn fífi ẹni lé ẹlòmíràn lọ́wọ́. Nítorí náà, ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ gbooro náà mọ́, àlàyé [a] sì fi ìtumọ̀ ọ̀dàlẹ̀ hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. “Àlùfáà” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀ fún ἱερεύς; “olórí àlùfáà” sì ṣe ìyàtọ̀ láàárín àwọn aṣáájú àlùfáà àti ẹni kan ṣoṣo tó wà ní ipò olórí àlùfáà. Gbólóhùn náà jẹ́ àdánidá, ó sì pa ìdánimọ̀ àwọn arọ́pò-orúkọ àti àìdájú ìtumọ̀ παραδίδωμι mọ́.
