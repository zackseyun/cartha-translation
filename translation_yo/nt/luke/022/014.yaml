  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: yo
  text: Nígbà tí wákàtí náà dé, ó rọgbọ̀kú síbi tábìlì, àwọn àpọ́sítélì náà sì rọgbọ̀kú pẹ̀lú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ìrọ̀gbọ̀kú, ìdúró tí ó wọ́pọ̀ nígbà oúnjẹ ní ayé ìgbàanì.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Nígbà tí wákàtí náà dé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àwòrán ‘wákàtí náà dé’ mọ́, pẹ̀lú ìtumọ̀ àkókò pàtó tí a ti yàn, láì sọ ọ́ di ‘àkókò’ lásán.
- source_word: ἀνέπεσεν
  choice: ó jókòó tìgbọ̀nwọ́ sílẹ̀ níbi tábìlì
  rationale: Ọ̀rọ̀ náà tọ́ka sí bí àwọn ènìyàn ṣe máa ń rọgbọ̀kú, tí wọ́n sì máa ń fi ìgbọ̀nwọ́ ti ara wọn lẹ́gbẹ̀ẹ́ tábìlì nígbà oúnjẹ. Àyànfẹ́ yìí jẹ́ kó yé òǹkàwé òde òní ju ‘ó jókòó’ lásán lọ.
- source_word: οἱ ἀπόστολοι
  choice: àwọn àpọ́sítélì
  rationale: Èyí túmọ̀ ọ̀rọ̀ orúkọ tí ó ní atókùn pàtó ní tààrà, láì fi ‘tirẹ̀’ kún ohun tí Gíríìkì kò sọ.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì fi ìbáṣepọ̀ tí σύν ń sọ hàn.
- source_word: Καὶ
  choice: sì
  rationale: ‘Sì’ so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá nínú Yorùbá, bí καί ṣe ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn.
theological_decisions:
- issue: Ìdúró ara níbi oúnjẹ Pásíkà
  choice: ó jókòó tìgbọ̀nwọ́ sílẹ̀ níbi tábìlì
  alternative: ó jókòó láti jẹun
  rationale: A pa ìṣe ìgbàanì tí ọ̀rọ̀ Gíríìkì tọ́ka sí mọ́, dípò kí a sọ ọ́ di ìjókòó òde òní lásán. Ìpinnu ọ̀rọ̀ àti àṣà ni èyí, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún. A lo ‘wákàtí’ láti pa ìpàtó ọ̀rọ̀ Gíríìkì mọ́, a sì ṣàlàyé ìdúró ara níbi oúnjẹ ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
