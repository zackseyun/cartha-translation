language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: yo
  text: Lẹ́yìn tí ó gba ago kan[a], tí ó sì dúpẹ́, ó wí pé, “Ẹ gba èyí, kí ẹ sì pín in láàárín ara yín[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ago náà.” Ní Gíríìkì, ọ̀rọ̀ náà kò ní àmì ìdánimọ̀, bí ó tilẹ̀ jẹ́ pé àyíká oúnjẹ náà lè tọ́ka sí ago pàtó kan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “kí ẹ sì pín èyí láàárín ara yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “pín” tàbí “pín káàkiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: Lẹ́yìn tí ó gba
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú ọ̀rọ̀ tí Jesu sọ hàn. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘gbà’ mọ́ láì sọ ọ́ di ‘mú’ lásán.
- source_word: ποτήριον
  choice: ife kan
  rationale: Orúkọ Gíríìkì náà kò ní article; ‘ife kan’ fi ìrísí yẹn hàn, láì fi dandan sọ pé ife pàtó kan ni.
- source_word: εὐχαριστήσας
  choice: tí ó sì dúpẹ́
  rationale: Èyí túmọ̀ sí pé ó dúpẹ́ ṣáájú kí ó tó sọ̀rọ̀, ó sì lo èdè ìtàn ojoojúmọ́ dípò ọ̀rọ̀ ìsìn àkànṣe.
- source_word: εἶπεν
  choice: ó wí pé
  rationale: Gíríìkì sọ ‘ó wí’ lásán, kò sì sọ ẹni tí ó bá sọ̀rọ̀ ní tààrà; a kò fi ‘fún wọn’ kún un.
- source_word: Λάβετε
  choice: Ẹ gba
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; ‘Ẹ gba’ bá ìṣe gbígba ife náà mu, ó sì tún ṣeé lò ní ti ohun tí a fi fúnni.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò-afihan náà ń tọ́ka sí ife tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ṣùgbọ́n Gíríìkì kò tún orúkọ ‘ife’ sọ.
- source_word: διαμερίσατε
  choice: ẹ sì pín in
  rationale: ‘Pín’ lè túmọ̀ sí yíyà ohun sí apá tàbí pínpín rẹ̀ fún àwọn ènìyàn; àyíká ọ̀rọ̀ àti ‘láàárín ara yín’ mú ìtumọ̀ pínpín fún ara wọn ṣe kedere.
- source_word: εἰς ἑαυτούς
  choice: láàárín ara yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe tí ẹgbẹ́ náà ṣe fún ara wọn hàn, láì jẹ́ kí ó dà bí ohun tí olúkúlùkù kó pamọ́ fún ara rẹ̀.
theological_decisions:
- issue: Bóyá kí a lo èdè ìlànà Oúnjẹ Alẹ́ Olúwa fún εὐχαριστήσας àti ποτήριον
  choice: 'A lo èdè ìtàn lasan: ‘ife kan’ àti ‘ó dúpẹ́.’'
  alternative: ‘ife náà’ tàbí ọ̀rọ̀ ìsìn àkànṣe tó lè mú ìtumọ̀ sakiramenti wọ inú ẹsẹ náà.
  rationale: Gíríìkì ń sọ ìṣe Jesu níbi oúnjẹ, kò sì béèrè pé kí a fi ìtumọ̀ ẹ̀kọ́ ìjọ ti ìgbà tó tẹ̀ lé e kún un. Èyí pa ìṣẹ̀lẹ̀ ìtàn àti ohun tí ọ̀rọ̀ náà sọ ní tààrà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ó wí pé’ bá ìtàn mímọ́ mu láì di ọ̀rọ̀ àtijọ́ tí kò rọrùn, ‘láàárín ara yín’ sì jẹ́ gbólóhùn tí òǹkàwé Yorùbá òde òní lè lóye ní kedere.
