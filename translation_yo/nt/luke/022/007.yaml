  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: yo
  text: Nígbà náà ni ọjọ́ Àjọ̀dún Àkàrà Aláìwú dé, ọjọ́ tí ó yẹ kí a fi ẹran Ìrékọjá rú ẹbọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìrékọjá,” “ọ̀dọ́-àgùntàn Ìrékọjá,” tàbí “ẹbọ Ìrékọjá.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àjọ̀dún Ìrékọjá tàbí, nínú àyíká yìí, sí ẹran tí a fi rú ẹbọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: dé
  rationale: Ọ̀rọ̀ náà ń sọ ní àkàwé pé àkókò tàbí ọjọ́ kan dé; “dé” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń mú ìtàn tẹ̀ síwájú ní ìtẹ̀lé; “Nígbà náà ni” fi ìtẹ̀lé náà hàn kedere.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: ọjọ́ Àkàrà Aláìwú
  rationale: Èyí pa nọ́ńbà ẹyọ “ọjọ́” mọ́, ó sì lo orúkọ àjọ̀dún tí ó ṣe kedere fún òǹkàwé Yorùbá.
- source_word: ᾗ
  choice: ọjọ́ tí
  rationale: Èyí tọ́ka padà sí “ọjọ́” ó sì pa agbára ìbátan àti ti àkókò mọ́ ní Yorùbá àdánidá.
- source_word: ἔδει
  choice: ó yẹ kí
  rationale: Ó fi dandan tàbí ohun tí ìlànà ń béèrè hàn láì sọ ọ́ di dandan ti ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò fi lélẹ̀.
- source_word: θύεσθαι
  choice: a fi ... rú ẹbọ
  rationale: Nínú àyíká ìrúbọ, θύω túmọ̀ sí pípa ohun ọ̀sìn gẹ́gẹ́ bí ẹbọ; gbólóhùn yìí sọ ìtumọ̀ ìsìn náà ní Yorùbá àdánidá.
- source_word: τὸ πάσχα
  choice: ẹran Ìrékọjá
  rationale: Pẹ̀lú θύεσθαι, πάσχα tọ́ka sí ẹran tí a fi rú ẹbọ Ìrékọjá. “Ẹran Ìrékọjá” yàgò fún fífi “ọ̀dọ́ àgùntàn” kún ọ̀rọ̀ Gíríìkì, ó sì jẹ́ kí àìdánilójú irú ẹran náà wà.
theological_decisions:
- issue: Ohun tí τὸ πάσχα ń tọ́ka sí nínú àyíká ìrúbọ
  choice: ẹran Ìrékọjá
  alternative: ọ̀dọ́ àgùntàn Ìrékọjá; ẹbọ Ìrékọjá; Ìrékọjá
  rationale: Ọ̀rọ̀ πάσχα lè túmọ̀ sí àjọ̀dún, oúnjẹ, tàbí ẹran ìrúbọ rẹ̀. Nítorí θύεσθαι, ẹran ìrúbọ ni àyíká yìí ń tọ́ka sí, ṣùgbọ́n Gíríìkì kò sọ “ọ̀dọ́ àgùntàn” ní pàtó; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá. “Àkàrà Aláìwú” àti “Ìrékọjá” ni a lò gẹ́gẹ́ bí orúkọ àjọ̀dún; “rú ẹbọ” mú àyíká ìrúbọ hàn kedere.
