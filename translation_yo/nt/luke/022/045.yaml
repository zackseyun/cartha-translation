id: LUK.22.45
reference: Luke 22:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: yo
  text: Lẹ́yìn tí ó dìde kúrò nínú àdúrà, ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó sì bá wọn níbi tí wọ́n ti ń sùn nítorí ìbànújẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì bá wọn níbi tí oorun ti mú wọn nítorí ìbànújẹ́.”
    reason: Àṣàyàn yìí fi ipò jíjẹ́ ẹni tí oorun ti mú hàn dípò fífi ìṣe sísùn tẹnumọ́; méjèèjì ṣeé ṣe fún κοιμωμένους.
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Nígbà tí ó dìde kúrò ní àdúrà
  rationale: Èyí fi hàn pé dídìde rẹ̀ lẹ́yìn àdúrà ṣáájú bí ó ṣe lọ sọ́dọ̀ àwọn ọmọ-ẹ̀yìn; ó sì pa àwòrán ‘kúrò ní àdúrà’ mọ́ láì sọ ọ́ di ọ̀rọ̀ àlàyé jù.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: ó tọ àwọn ọmọ-ẹ̀yìn rẹ̀ wá
  rationale: ‘Tọ ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìlọ sí ọ̀dọ̀ ẹnì kan; ‘àwọn ọmọ-ẹ̀yìn’ sì ni ọ̀rọ̀ tí a sábà lò fún μαθηταί nínú ìtàn àwọn Ìhìn Rere.
- source_word: εὗρεν κοιμωμένους αὐτούς
  choice: ó bá wọn tí wọ́n ń sùn
  rationale: ‘Ó bá wọn’ túmọ̀ εὗρεν lọ́nà àdánidá nínú àyíká yìí, ‘wọ́n ń sùn’ sì pa ìṣe tí participle κοιμωμένους ń ṣàpèjúwe mọ́.
- source_word: ἀπὸ τῆς λύπης
  choice: nítorí ìbànújẹ́
  rationale: ἀπό pẹ̀lú λύπη níhìn-ín ṣeé lóye gẹ́gẹ́ bí ohun tó fa oorun wọn. ‘Ìbànújẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá λύπη mu láì fi àlàyé ọkàn míì kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ ìbànújẹ́ àti oorun àwọn ọmọ-ẹ̀yìn
  choice: 'A sọ ìbànújẹ́ gẹ́gẹ́ bí ohun tó fa oorun wọn: ‘nítorí ìbànújẹ́.’'
  alternative: A lè mú un gẹ́gẹ́ bí pé wọ́n ń sùn nígbà tí inú wọn bàjẹ́, láì tẹnumọ́ ìdí àti àbájáde tó bẹ́ẹ̀.
  rationale: ἀπὸ τῆς λύπης sábà ń tọ́ka sí ohun tó fa ipò náà. Ìtumọ̀ yìí kò fi àlàyé nípa ìṣesí ọkàn tàbí ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, èdè ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ náà ṣe kedere, ó sì yẹ fún òǹkàwé lásán láì di èdè líle tàbí èdè ẹ̀ya ìjọ kan.
