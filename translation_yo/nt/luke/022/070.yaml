revisions:
- from: Nígbà náà ni gbogbo wọn wí pé, “Ǹjẹ́ ìwọ ni Ọmọ Ọlọ́run?” Ó sì wí fún wọn pé, “Ẹ̀yin fúnra yín ni ẹ̀ ń sọ pé èmi ni.”[a]
  to: Gbogbo wọn sì wí pé, “Ǹjẹ́ ìwọ ni Ọmọ Ọlọ́run?” Ó sì wí fún wọn pé, “Ẹ̀yin fúnra yín ni ẹ sọ pé èmi ni.”[a]
  rationale: A ṣàtúnṣe arọ́pò àti àmì iṣe-ọrọ̀ nínú ìdáhùn Jésù láti ‘ẹ̀ ń sọ’ sí ‘ẹ sọ,’ kí ẹni kejì ọ̀pọ̀ Gíríìkì (Ὑμεῖς ... λέγετε) lè hàn dáadáa ní Yorùbá. A tún mú ìṣàn ìtàn ìbẹ̀rẹ̀ ẹsẹ̀ náà di ‘Gbogbo wọn sì wí,’ láì yí ìtumọ̀ rẹ̀ padà. Àlàyé ìsàlẹ̀ ojú-ewé ni a ṣàtúnṣe láti ba ọ̀rọ̀ pàtàkì mu, àti láti fúnni ní àwọn àṣàyàn Yorùbá tí ó dára.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn eroja pàtàkì Gíríìkì mọ́: πάντες (‘gbogbo wọn’), ìbéèrè ìfọ̀rónú οὖν (‘Ǹjẹ́’), oyè náà ‘Ọmọ Ọlọ́run,’ àti ìdáhùn tí ó da ọ̀rọ̀ padà sí àwọn olùbéèrè. Ṣùgbọ́n ìlànà gírámà nínú ìdáhùn Jésù lọwọlọwọ—‘Ẹ̀yin fúnra yín ni ẹ̀ ń sọ’—kò tọ́ ní Yorùbá, nítorí ‘ẹ̀ ń’ jẹ́ àmì ẹni kẹta aláìlórúkọ, kì í bá arọ́pò ẹni kejì ọ̀pọ̀ ‘ẹ̀yin’ mu.'
  naturalness: ‘Ẹ̀yin fúnra yín ni ẹ sọ pé èmi ni’ jẹ́ Yorùbá boṣewa, ó sì mú ìtẹnumọ́ Ὑμεῖς wá láì sọ ìmúdájú náà di ohun tí ó lágbára jù bí Gíríìkì ṣe sọ. ‘Gbogbo wọn sì wí pé’ sì jẹ́ ìṣàn ọ̀rọ̀ ìtàn tó rọrùn.
  terminology: ‘Ọmọ Ọlọ́run’ jẹ́ ọ̀rọ̀ ìjọsìn Yorùbá tó ti fìdí múlẹ̀, tó sì bá ὁ υἱὸς τοῦ θεοῦ mu. ‘Wí’ yẹ fún ìforúkọsílẹ̀ mímọ́ náà. A pa àìdájú tó wà nínú ìdáhùn náà mọ́; a kò sọ ọ́ di ‘Bẹ́ẹ̀ ni’ nínú ọ̀rọ̀ pàtàkì.
  issues:
