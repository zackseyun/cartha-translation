source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: yo
  text: Gbogbo wọn sì wí pé, “Ǹjẹ́ ìwọ ni Ọmọ Ọlọ́run?” Ó sì wí fún wọn pé, “Ẹ̀yin fúnra yín ni ẹ sọ pé èmi ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà Yorùbá tó rọrùn sí i pé, “Ẹ̀yin ló sọ bẹ́ẹ̀,” tàbí, “Ó rí gẹ́gẹ́ bí ẹ ti sọ.” Nínú àyíká ọ̀rọ̀ yìí, ìdáhùn Jésù jẹ́ ìmúdájú; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà túmọ̀ sí tààrà pé, “Ẹ̀yin fúnra yín ni ẹ sọ pé èmi ni.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí gbogbo ẹgbẹ́ náà; ‘gbogbo wọn’ pa ìtẹnumọ́ àpapọ̀ mọ́ ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Ǹjẹ́
  rationale: Nínú ìbéèrè yìí, οὖν ń fa ìparí kan jáde láti inú ọ̀rọ̀ tó ṣáájú; ‘Ǹjẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbéèrè ìmúdájú bẹ́ẹ̀ hàn.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí jẹ́ oyè nípa Kristi; ‘Ọmọ Ọlọ́run’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìwọ̀n oyè náà mọ́.
- source_word: ἔφη
  choice: wí
  rationale: ‘Wí’ jẹ́ ọ̀rọ̀ tó bójú mu, tó sì ní iyì fún iṣẹ́-ọrọ̀ yìí; kò sí dandan láti mú apá àkókò ọ̀rọ̀ Gíríìkì náà hàn lọ́nà àrà ọ̀tọ̀.
- source_word: Ὑμεῖς
  choice: Ẹ̀yin fúnra yín
  rationale: Arọ́pò-orúkọ tí a sọ jáde ní Gíríìkì ní ìtẹnumọ́; ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ náà àti pípa ọ̀rọ̀ náà padà sí ẹnu àwọn olùbéèrè mọ́.
- source_word: λέγετε
  choice: ẹ̀ ń sọ
  rationale: Ìṣe àkókò ìsinsìnyí náà ni a túmọ̀ sí ọ̀rọ̀ Yorùbá àdánidá ‘ẹ̀ ń sọ,’ pẹ̀lú àmi ọ̀pọ̀ ẹni kejì.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàgbékalẹ̀ ohun tí wọ́n sọ; ‘pé’ pa ìsopọ̀ gírámà náà mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: ἐγώ εἰμι
  choice: èmi ni
  rationale: ‘Èmi ni’ jẹ́ ìtumọ̀ Yorùbá tààrà fún ọ̀rọ̀ kúkúrú àti ìtẹnumọ́ Gíríìkì náà, láì ṣàfikún ohun tí kò sí nínú rẹ̀.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ìdáhùn Jésù sí ìmúdájú tó ṣe tààrà, tàbí sí ìdáhùn tí kò sọ ohun gbogbo ní gbangba
  choice: “Ẹ̀yin fúnra yín ni ẹ̀ ń sọ pé èmi ni.”
  alternative: “Bẹ́ẹ̀ ni ẹ̀yin sọ,” tàbí “Ó rí gẹ́gẹ́ bí ẹ ti sọ.”
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ṣiṣẹ́ gẹ́gẹ́ bí ìdáhùn ìmúdájú nínú àyíká rẹ̀, ṣùgbọ́n ó gbé ọ̀rọ̀ náà padà sí ẹnu àwọn olùbéèrè. Ìtumọ̀ pàtàkì pa ìrísí àti ìjàkadì ìtumọ̀ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé sọ àwọn ọ̀nà Yorùbá tó rọrùn sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘wí’ fún ìforúkọsílẹ̀ mímọ́ tó ní iyì, àti ‘Ǹjẹ́’ láti mú agbára ìbéèrè ìmúdájú οὖν jáde.
