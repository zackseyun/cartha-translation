    rationale: ‘Ẹ̀ ń’ ń tọ́ka sí ẹni kẹta kan (‘ó ń’), nígbà tí Gíríìkì λέγετε àti ‘Ẹ̀yin’ jẹ́ ẹni kejì ọ̀pọ̀. ‘Ẹ sọ’ ni ó yẹ, ó sì tún sún mọ́ àkókò ìsinsìnyí gbogbogbò ti Gíríìkì.
