  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìwàpọ̀ Jesu pẹ̀lú wọn ní tẹ́ńpìlì, àìgbọ́ ọwọ́ wọn sí i nígbà yẹn, ‘wákàtí’ tí ó jẹ́ tiwọn, àti àṣẹ òkùnkùn. Ṣùgbọ́n ‘láti mú mi’ ṣàfikún ète ìmú ẹni tí kò hàn ní tààrà nínú Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí ìmú ẹni. A yọ ọ́ kúrò kí ìtumọ̀ lè pa àìlékọjá ọ̀rọ̀ orísun mọ́. A tún ṣàfikún ‘yín’ lẹ́yìn ‘ọwọ́’ láti ṣàfihàn τὰς χεῖρας yín kedere.'
  naturalness: ‘Lójoojúmọ́’ jẹ́ ọ̀nà Yorùbá òde òní tó rọrùn, tó sì ń fúnni ní ìmọ̀ ‘day after day.’ ‘Ẹ kò na ọwọ́ yín sí mi’ jẹ́ gbólóhùn tó mọ́, tó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́. Yíyọ àmì ìdákẹ́jẹ kúrò ṣáájú ‘àti’ mú ìṣàn gbólóhùn náà dára síi.
  terminology: ‘Tẹ́ńpìlì,’ ‘wákàtí yín,’ àti ‘àṣẹ òkùnkùn’ bójú mu. ‘Àṣẹ òkùnkùn’ ń pa ἐξουσία τοῦ σκότους mọ́ láì yí i padà sí Sátánì tàbí ibi ní tààrà. Àmì ìsàlẹ̀ náà ń fúnni ní ‘agbára òkùnkùn’ gẹ́gẹ́ bí yíyàn ìtumọ̀ míràn.
