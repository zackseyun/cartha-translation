source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: yo
  text: Lójoojúmọ́, nígbà tí mo wà pẹ̀lú yín nínú tẹ́ńpìlì, ẹ kò na ọwọ́ yín sí mi. Ṣùgbọ́n èyí ni wákàtí yín àti àṣẹ òkùnkùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “agbára òkùnkùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Ní ọjọ́ kọ̀ọ̀kan
  rationale: Ó fi ìṣẹ̀lẹ̀ ojoojúmọ́ tí ó ń tún ara rẹ̀ ṣe hàn ní Yorùbá àdánidá.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: nígbà tí mo wà pẹ̀lú yín
  rationale: Ó tú genitive absolute náà sí gbólóhùn àsìkò Yorùbá láì pàdánù ìtumọ̀ rẹ̀.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀; ọ̀rọ̀ yìí ṣe kedere, ó sì wọ́pọ̀ fún òǹkàwé.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: ẹ kò na ọwọ́ sí mi láti mú mi
  rationale: Ó pa àwòrán gíríìkì ti níná ọwọ́ sí ẹni mọ́, ó sì mú ìdí ìṣe náà—ìmú ẹni—hàn gbangba nínú àyíká ọ̀rọ̀.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Ṣùgbọ́n èyí ni wákàtí yín
  rationale: “Wákàtí yín” pa agbára ọ̀rọ̀ ὥρα gẹ́gẹ́ bí àkókò pàtó tí ó dé mọ́, dípò yíyí i sí àkókò lásán.
- source_word: ἐξουσία
  choice: àṣẹ
  rationale: Àṣẹ lè túmọ̀ sí ẹ̀tọ́ tàbí agbára láti ṣiṣẹ́, ó sì yà á sọ́tọ̀ kúrò nínú ipá ara lásán.
- source_word: τοῦ σκότους
  choice: òkùnkùn
  rationale: Ó pa àpẹẹrẹ àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ ti “òkùnkùn” mọ́ láì sọ ọ́ di Sátánì tàbí ibi ní tààrà.
theological_decisions:
- issue: Bóyá kí a ṣàlàyé “àṣẹ òkùnkùn” ní tààrà gẹ́gẹ́ bí àṣẹ Sátánì tàbí ìjọba ibi
  choice: àṣẹ òkùnkùn
  alternative: agbára òkùnkùn; àṣẹ Sátánì; ìjọba ibi
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo “òkùnkùn,” kò sì dárúkọ Sátánì. Mímú àpẹẹrẹ náà mọ́ ń dáàbò bo àìṣe kedere àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀.
translation_notes:
  register: Yorùbá àpéwọ̀, ọlọ́lá, tí ó sì yé òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῶν ṣe fi hàn. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó kan.
