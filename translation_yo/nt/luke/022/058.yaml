  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbò: ìfẹ̀sùn ẹni kejì náà, ìdánimọ̀ pẹ̀lú ẹgbẹ́ náà, àti ìdáhùn Peteru wà níbẹ̀. Ṣùgbọ́n “Èmi kì í ṣe bẹ́ẹ̀” yí ìkọ̀sílẹ̀ ἐλλειπτικός náà sí ìkọ̀ “èmi kì í ṣe báyìí/irú bẹ́ẹ̀,” ó sì lè ní ìtumọ̀ habitual; kò jẹ́ ìbámu tó dára pẹ̀lú οὐκ εἰμί (“Èmi kì í ṣe”). “Dáhùn” tún ṣàfikún ìtúmọ̀ ìdáhùn tí ἔφη kò sọ ní pàtó, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ń jẹ́ kó ṣeé lóye.'
  naturalness: “Lẹ́yìn ìgbà díẹ̀” àti “Ìwọ náà jẹ́ ọ̀kan lára wọn” jẹ́ Yorùbá boṣewa, tí ó hàn gbangba. “Ọkùnrin” gẹ́gẹ́ bí ìpè taara pa ìbínú/ìdáàbòbò ọ̀rọ̀ náà mọ́, bí ó tilẹ̀ jẹ́ pé ó le hàn díẹ̀ bí èdè ìtàn. “Èmi kì í ṣe” dára ju “Èmi kì í ṣe bẹ́ẹ̀” lọ nítorí ó pa ìṣókí ìdáhùn náà mọ́.
  terminology: “Peteru” jẹ́ ìtúmọ̀ orúkọ Bíbélì Yorùbá tí ó wọ́pọ̀. “Ọ̀kan lára wọn” jẹ́ ìbámu tó pé fún ἐξ αὐτῶν ní àyíká ìbáṣepọ̀ ẹgbẹ́, kì í ṣe ibi ìpilẹ̀ ẹni.
  issues:
