    rationale: Ἔφη jẹ́ olùbẹ̀rẹ̀ ọ̀rọ̀ ìtàn tó rọrùn, ‘ó sì wí pé’; “dáhùn” jẹ́ ìtúmọ̀ tí àyíká lè gba ṣùgbọ́n tí kò sí nínú ọ̀rọ̀ orísun fúnra rẹ̀.
  - severity: low
