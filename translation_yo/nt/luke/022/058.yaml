    rationale: Ìsàlẹ̀ náà gbọ́dọ̀ bá ọ̀rọ̀ àkọ́kọ́ tí a ṣe àtúnṣe mu, kí ó sì ṣàlàyé pé ohun tí a ń sẹ́ ni a fi sílẹ̀ nínú Gíríìkì.
