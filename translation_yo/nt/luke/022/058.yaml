source:
  edition: SBLGNT
  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: yo
  text: Lẹ́yìn ìgbà díẹ̀, ọkùnrin mìíràn rí i, ó sì wí pé, “Ìwọ náà jẹ́ ọ̀kan lára wọn.” Ṣùgbọ́n Peteru sì wí pé, “Ọkùnrin, èmi kì í ṣe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kedere sí i, “Èmi kì í ṣe ọ̀kan lára wọn.” Ọ̀rọ̀ Gíríìkì kàn sọ pé, “Èmi kì í ṣe,” ó sì fi ohun tí ó ń sẹ́ silẹ̀ kí a lè lóye rẹ̀ láti inú ẹ̀sùn tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Lẹ́yìn ìgbà díẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò kúkúrú kọjá, ó sì pa ìtumọ̀ gbólóhùn Gíríìkì mọ́.
- source_word: ἕτερος
  choice: ọkùnrin mìíràn
  rationale: ἕτερος túmọ̀ sí ẹlòmíràn; fífi “ọkùnrin” kún un mú ẹni tí ń fẹ̀sùn kan Peteru ṣe kedere ní Yorùbá, ó sì bá ẹni akọ tó wà nínú ọ̀rọ̀ náà mu.
- source_word: ἰδὼν αὐτὸν
  choice: rí i
  rationale: Ó fi ìṣe participle aorist hàn ní ṣókí gẹ́gẹ́ bí ìṣe tó ṣáájú ọ̀rọ̀ ẹni náà, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ἔφη
  choice: ó sì wí pé
  rationale: “Wí pé” jẹ́ ọ̀nà ìtàn tó ní iyì, tó sì ṣe kedere fún fífi ọ̀rọ̀ taara bẹ̀rẹ̀.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Ìwọ náà jẹ́ ọ̀kan lára wọn
  rationale: “Ọ̀kan lára wọn” sọ ìdánimọ̀ pẹ̀lú ẹgbẹ́ náà ní Yorùbá àdánidá, dípò kí a tú ἐξ gẹ́gẹ́ bí ibi tí ẹni ti wá.
- source_word: Ἄνθρωπε
  choice: Ọkùnrin
  rationale: Ó pa àdírẹ́sì taara àti ohùn ìdáhùn líle ti ἄνθρωπε mọ́, láìyí i sí ọ̀rọ̀ ọ̀wọ̀ bí “Ọ̀gbẹ́ni.”
- source_word: οὐκ εἰμί
  choice: èmi kì í ṣe bẹ́ẹ̀
  rationale: Gíríìkì sọ ní ṣókí pé “èmi kì í ṣe,” nígbà tí ohun tí Peteru kọ̀ ti hàn nínú ẹ̀sùn tó ṣáájú. “Kì í ṣe bẹ́ẹ̀” jẹ́ ìkọ̀sílẹ̀ Yorùbá àdánidá tó pa ìṣókí àti ìtumọ̀ tí a fi sílẹ̀ láti lóye mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “Peteru” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tó wọ́pọ̀ nínú Bíbélì Yorùbá.
