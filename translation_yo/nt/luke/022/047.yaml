  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àti èrò pàtàkì ti Gíríìkì náà wá: Jésù ṣì ń sọ̀rọ̀, ọ̀pọ̀ ènìyàn dé, Júdásì ń ṣáájú wọn, ó sì sún mọ́ Jésù pẹ̀lú ète láti fi ẹnu kò ó. Ṣùgbọ́n “Bí ó sì ti” fi ìsopọ̀ “sì” kún ibẹ̀rẹ̀ tí kò hàn nínú ọ̀rọ̀ orísun, “...lẹ́nu” sì lè sọ ibi tí wọ́n ti fi ẹnu kọ ara wọn di pàtó ju Gíríìkì ṣe sọ lọ.'
