id: LUK.22.47
reference: Luke 22:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀, wò ó, ọ̀pọ̀ ènìyàn kan dé; ẹni tí a ń pè ní Júdásì, ọ̀kan lára àwọn méjìlá, ń lọ níwájú wọn,[a] ó sì sún mọ́ Jésù láti fi ẹnu kò ó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń ṣáájú wọn” tàbí “ó ń darí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Bí ó sì ti ń sọ̀rọ̀ lọ́wọ́
  rationale: Gbólóhùn yìí fi hàn pé ọ̀rọ̀ rẹ̀ ṣì ń lọ lọ́wọ́ nígbà tí ohun tó tẹ̀ lé e ṣẹlẹ̀; ó jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ ìgbà kan náà mọ́.
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó pa ipa àmì àsọyé náà mọ́, èyí tó ń pe àfiyèsí sí ìfarahàn ọ̀pọ̀ ènìyàn náà lójijì.
- source_word: ὄχλος
  choice: ọ̀pọ̀ ènìyàn kan dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwùjọ tàbí ọ̀pọ̀ ènìyàn; fífi “dé” kún un mú gbólóhùn náà pé ní Yorùbá, ó sì bá ìṣẹ̀lẹ̀ náà mu láì ṣe àfikún ìtumọ̀ tí kò sí.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: ẹni tí a ń pè ní Júdásì
  rationale: Ó tẹ̀ lé ọ̀nà ìdánimọ̀ Gíríìkì náà pẹkipẹki, láì fi ìdájọ́ tàbí ẹ̀gàn kún un.
- source_word: εἷς τῶν δώδεκα
  choice: ọ̀kan lára àwọn méjìlá
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere, tó sì pa ìdánimọ̀ Júdásì gẹ́gẹ́ bí ọ̀kan nínú àwọn méjìlá mọ́.
- source_word: προήρχετο αὐτούς
  choice: ń lọ níwájú wọn
  rationale: Ó pa abala ìṣe tó ń lọ lọ́wọ́ mọ́, kò sì fi dandan sọ pé Júdásì ni olórí wọn, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè ní ìtumọ̀ pé ó ń ṣáájú wọn.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: ó sì sún mọ́ Jésù
  rationale: Ó sọ ìsúnmọ́ tàbí ìtọ̀sí sí Jésù ní ọ̀nà Yorùbá tó ṣe kedere àti àdánidá.
- source_word: φιλῆσαι αὐτόν
  choice: láti fi ẹnu kò ó lẹ́nu
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífi ẹnu kọ ẹnì kan lẹ́nu; kò fi àlàyé ìdí ìṣe náà kún ọrọ̀ orísun.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ìṣe Júdásì nínú ìtàn náà
  choice: A túmọ̀ ìsúnmọ́ àti fífi ẹnu kò Jésù lẹ́nu gẹ́gẹ́ bí ọrọ̀ náà ṣe wí, láì fi “láti fi í hàn fún àwọn ọ̀tá” tàbí “láti dà á” kún un.
  alternative: láti fi ẹnu kò ó lẹ́nu láti dà á
  rationale: Àyíká ẹsẹ náà mú ìdà Jésù hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ ṣàpèjúwe ìsúnmọ́ àti ète láti fi ẹnu kò ó lẹ́nu. Ìtumọ̀ náà pa ìfẹ̀hónúhàn àti ìfarapamọ́ inú ìtàn orísun mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn níbi tó yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Kíyè sí i” jẹ́ àmì àsọyé tó ní ọlá ju “wò ó” lọ, ó sì pa ìgbóná ìtàn mọ́.
