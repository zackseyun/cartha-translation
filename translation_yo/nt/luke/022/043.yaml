- from: Nígbà náà, áńgẹ́lì kan láti ọ̀run farahàn án[a], ó sì ń fún un lókun.
  to: Nígbà náà, áńgẹ́lì kan láti ọ̀run farahàn sí i[a], ó sì ń fi agbára fún un.
  rationale: 'The revision improves Yorùbá idiom while preserving every element of the supplied Greek: narrative progression, an indefinite heavenly angel, appearance directed to Jesus, and the angel’s continuing action of strengthening him. The footnote remains anchored at the verse and preserves the textual uncertainty without deciding it.'
