id: LUK.22.43
reference: Luke 22:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: yo
  text: Nígbà náà, áńgẹ́lì kan láti ọ̀run farahàn sí i[a], ó sì ń fi agbára fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kò ní ẹsẹ 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: farahàn
  rationale: Ọ̀rọ̀ náà jẹ́ àfihàn pé ẹ̀dá ọ̀run kan fi ara hàn; ‘farahàn’ jẹ́ ọ̀nà Yorùbá àdánidá, ó sì yẹ fún gbólóhùn ìfarahàn ju ‘a rí i’ lọ.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú; ‘Nígbà náà’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: αὐτῷ
  choice: án
  rationale: Arọ́pò-orúkọ olùgbà pẹ̀lú ὤφθη túmọ̀ sí ẹni tí áńgẹ́lì náà farahàn sí; ‘farahàn án’ jẹ́ ìkọ̀wé Yorùbá tó bójú mu.
- source_word: ἄγγελος
  choice: áńgẹ́lì kan
  rationale: Nítorí pé láti ọ̀run ni ó ti wá, ìtumọ̀ rẹ̀ níhìn-ín ni áńgẹ́lì, kì í ṣe ońṣẹ́ ènìyàn; ‘kan’ pa àìní atọ́ka pàtó nínú Gíríìkì mọ́.
- source_word: ἀπ’ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó tọ́ka sí ibi tí áńgẹ́lì náà ti wá; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ orísun ọ̀run mọ́.
- source_word: ἐνισχύων
  choice: ó sì ń fún un lókun
  rationale: Ọ̀rọ̀ arọ́pò-ìṣe yìí fi ìṣe tó ń bá ìfarahàn náà lọ hàn. ‘Ń fún un lókun’ pa ìtumọ̀ fífi agbára kún un mọ́, kò sì dín un kù sí kíkàn níṣìírí.
- source_word: αὐτόν
  choice: un
  rationale: Ó ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí áńgẹ́lì náà ń fún lókun.
theological_decisions:
- issue: Ipò ẹsẹ Lúùkù 22:43 nínú àwọn àfọwọ́kọ
  choice: Fi ẹsẹ náà sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí ó ti wà nínú SBLGNT tí a pèsè.
  alternative: Àwọn àfọwọ́kọ kan kò ní ẹsẹ 43–44.
  rationale: A túmọ̀ ọ̀rọ̀ Gíríìkì tí a pèsè, ṣùgbọ́n a fi àríyànjiyàn nípa àfọwọ́kọ hàn ní àlàyé ìsàlẹ̀ kí a má bàa fi ìyàtọ̀ pàtàkì náà pamọ́ tàbí dá a parí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ; ìtòlẹ́sẹẹsẹ náà jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣe tí ń lọ lọ́wọ́ nínú ἐνισχύων mọ́.
