source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: yo
  text: Wọ́n sì bẹ̀rẹ̀ sí í bá ara wọn jíròrò pé ta ni nínú wọn tí ó lè jẹ́ ẹni tí ó fẹ́rẹ̀ẹ́ ṣe èyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “Wọ́n sì bẹ̀rẹ̀ sí í bá ara wọn jíròrò nípa ẹni wo nínú wọn tí ó lè jẹ́ ẹni tí ó fẹ́rẹ̀ẹ́ ṣe èyí.” Nínú àyíká ọ̀rọ̀ náà, “èyí” ń tọ́ka sí fífi Jésù lé àwọn ọ̀tá lọ́wọ́, èyí tí a sọ ní ẹsẹ tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ọ̀rọ̀ yìí fi ìbẹ̀rẹ̀ ìṣe náà hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: συζητεῖν
  choice: jíròrò
  rationale: ‘Jíròrò’ túmọ̀ sí pé wọ́n ń bá ara wọn sọ̀rọ̀ láti wádìí ọ̀ràn náà, láìfi ìjà tàbí àríyànjiyàn líle kún ohun tí Gíríìkì sọ.
- source_word: πρὸς ἑαυτούς
  choice: bá ara wọn
  rationale: Èyí mú ìtumọ̀ ìbáṣepọ̀ láàárín àwọn ọmọ ẹgbẹ́ náà jáde ní Yorùbá àdánidá.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: nípa ẹni wo nínú wọn tí ó lè jẹ́
  rationale: Ìtumọ̀ yìí pa ìbéèrè tí kò tíì ní ìdáhùn àti àìdánilójú tí optative εἴη ní mọ́; a kò fi ἄρα ṣe ọ̀rọ̀ ọ̀tọ̀ nítorí agbára ìrònú rẹ̀ ti hàn nínú gbólóhùn Yorùbá náà.
- source_word: μέλλων πράσσειν
  choice: ẹni tí yóò ṣe
  rationale: ‘Yóò ṣe’ tọ́ka sí ìṣe tó ń bọ̀ láìyí μέλλω padà sí ète inú ẹni náà; ó tún dùn mọ́ etí ju ìtumọ̀ líle bí ‘tí ó fẹ́rẹ̀ẹ́ ṣe’ lọ nínú àyíká yìí.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka náà ń tọ́ka sí ìṣe tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, nítorí náà a pa ọ̀rọ̀ gbogbogbò ‘èyí’ mọ́.
theological_decisions:
- issue: Bóyá kí a sọ ìṣe ìdàrúdàpọ̀ náà ní kedere gẹ́gẹ́ bí ìdásílẹ̀ Jésù fún àwọn ọ̀tá rẹ̀
  choice: Pa ‘ṣe èyí’ mọ́ nínú ẹsẹ náà.
  alternative: ‘ẹni tí yóò fi í lé àwọn ọ̀tá lọ́wọ́’ tàbí ‘ẹni tí yóò dà á’
  rationale: Gíríìkì ẹsẹ yìí sọ τοῦτο, ‘èyí,’ kò sì tún sọ ìṣe náà ní kedere. Àyíká ẹsẹ tó ṣáájú ló ń ṣàlàyé ohun tí ‘èyí’ ń tọ́ka sí; fífi ọ̀rọ̀ pàtó kún un nínú ẹsẹ yìí yóò túmọ̀ kọjá ohun tí orísun sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa àìdánilójú ìbéèrè àwọn ọmọ-ẹ̀yìn mọ́, kò sì sọ pé wọ́n ń jiyàn líle.
