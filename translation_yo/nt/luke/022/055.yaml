  rationale: Àtúnṣe náà mú ìṣáájú àwọn participle aorist méjèèjì hàn nípasẹ̀ “Lẹ́yìn tí” àti “ti,” ó sì rọ́pò ọ̀nà tí kò ṣe kedere tó láti sọ ìdáná iná. A pa imperfect ἐκάθητο mọ́ pẹ̀lú “ń jókòó,” a sì pa ibi Peteru nínú ẹgbẹ́ wọn mọ́ pẹ̀lú “láàárín wọn.”
