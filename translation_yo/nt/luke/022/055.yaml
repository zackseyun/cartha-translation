  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà dáadáa: iná kan ní àárín àgbàlá, ìjókòó àwọn ènìyàn náà papọ̀, àti Peteru tí ó wà láàárín wọn. Ṣùgbọ́n “Nígbà tí” fi ìbáṣepọ̀ àkókò “when” hàn, níbi tí àwọn participle aorist Gíríìkì méjèèjì ti ń fi ìṣe tó ṣáájú ìṣe pàtàkì hàn. “Lẹ́yìn tí” àti “ti” nínú àwọn gbolohun abẹ́lé méjèèjì dá ìbáṣepọ̀ náà dúró dáadáa.'
