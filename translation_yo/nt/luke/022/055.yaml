source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti tan iná ní àárín àgbàlá, tí wọ́n sì ti jókòó papọ̀, Peteru ń jókòó láàárín wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “Peteru jókòó láàárín wọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ “jókòó” lásán, ṣùgbọ́n “ń jókòó” túbọ̀ fi hàn pé ìṣe náà ń lọ lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: tí wọ́n ti dá iná
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú ìṣe pàtàkì hàn; ‘dá iná’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n tan iná.
- source_word: πῦρ
  choice: iná
  rationale: Ní Yorùbá, ‘iná’ kò nílò àfihàn bí article Gẹ̀ẹ́sì, àyíká ọ̀rọ̀ sì mú kí ó ṣe kedere pé iná kan pàtó ni.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: sí àárín àgbàlá
  rationale: Ó pa ìtumọ̀ ibi gidi mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: συγκαθισάντων
  choice: tí wọ́n sì jókòó papọ̀
  rationale: ‘Papọ̀’ pa ìtumọ̀ σύν mọ́ pé wọ́n jókòó pẹ̀lú ara wọn; aorist participle náà wà ní ìbámu pẹ̀lú ìṣe tó ṣáájú.
- source_word: ἐκάθητο
  choice: ń jókòó
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ ní àkókò ìtàn hàn, ó sì bá imperfect Gíríìkì mu.
- source_word: μέσος αὐτῶν
  choice: láàárín wọn
  rationale: Ó túmọ̀ sí pé Peteru wà nínú ẹgbẹ́ wọn, láìfi dandan sọ pé ó wà ní àárín gbùngbùn gangan.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ tó bá δέ mu ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá àkókò-òde, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá yẹ; ‘àgbàlá’ dúró fún courtyard ilé olórí àlùfáà, ‘láàárín wọn’ sì pa ìtumọ̀ pé Peteru wà nínú ẹgbẹ́ náà mọ́.
