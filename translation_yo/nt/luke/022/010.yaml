id: LUK.22.10
reference: Luke 22:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ wò ó, nígbà tí ẹ bá wọ ìlú náà, ọkùnrin kan tí ó ń gbé ìkòkò omi yóò pàdé yín. Ẹ tẹ̀lé e lọ sínú ilé tí ó ń wọ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá òde òní láti pe àfiyèsí àwọn olùgbọ́, ó sì pa agbára ìtọ́kasí Ἰδοὺ mọ́ láì lo ọ̀rọ̀ àtijọ́ tí kò rọrùn.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: nígbà tí ẹ bá wọ ìlú náà
  rationale: Ó tú genitive absolute náà sí gbólóhùn àkókò tí ó bá èdè Yorùbá mu, ó sì fi hàn pé ìpàdé náà yóò ṣẹlẹ̀ nígbà ìwọlé wọn.
- source_word: συναντήσει ὑμῖν
  choice: yóò pàdé yín
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì jẹ́ ọ̀rọ̀ àdánidá fún future active pẹ̀lú dative object nínú àyíká yìí.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nínú àyíká yìí, ẹni tí a ń tọ́ka sí jẹ́ akọ; ‘ọkùnrin kan’ mú ìtumọ̀ náà jáde ní kedere.
- source_word: κεράμιον ὕδατος
  choice: ìkòkò omi
  rationale: ‘Ìkòkò omi’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun èlò tí a fi ń gbé omi; kò fi ohun èlò amọ̀ kún un ní pàtó ju bí ọ̀rọ̀ inú àyíká ṣe béèrè lọ.
- source_word: βαστάζων
  choice: tí ó gbé
  rationale: Ó fi ìṣe tí ọkùnrin náà ń ṣe hàn ní ọ̀nà tí ó rọrùn, tí ó sì bá ìtàn Yorùbá mu.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Ẹ tọ̀ ọ́ lẹ́yìn
  rationale: Àṣẹ tààrà yìí mú ìtumọ̀ aorist imperative náà jáde ní Yorùbá àdánidá.
- source_word: οἰκίαν
  choice: ilé
  rationale: ‘Ilé’ ni ìbámu tó ṣe kedere jù lọ fún οἰκία nínú ìtọ́sọ́nà ibi tí wọ́n ń lọ.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: tí ó bá wọ̀
  rationale: Gbólóhùn ìbátan yìí dá ilé pàtó tí ọkùnrin náà wọ̀ mọ̀, ó sì pa ìtumọ̀ ìlọ sínú rẹ̀ mọ́ ní Yorùbá ṣókí.
