revisions:
- from: Ó sì wí fún wọn pé, “Ẹ wò ó, nígbà tí ẹ bá wọ ìlú náà, ọkùnrin kan tí ó gbé ìkòkò omi yóò pàdé yín. Ẹ tọ̀ ọ́ lẹ́yìn lọ sínú ilé tí ó bá wọ̀.”
  to: Ó sì wí fún wọn pé, “Ẹ wò ó, nígbà tí ẹ bá wọ ìlú náà, ọkùnrin kan tí ó ń gbé ìkòkò omi yóò pàdé yín. Ẹ tẹ̀lé e lọ sínú ilé tí ó ń wọ̀.”
  rationale: The revision preserves the draft’s meaning and register while making the Greek present participle βαστάζων and present verb εἰσπορεύεται explicit as actions in progress. It also uses the customary direct Yoruba imperative for following a person. No footnotes are necessary in Yoruba for the retained broad rendering “ìkòkò omi.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense accurately: Jesus tells the disciples that, on entering the city, they will meet a man carrying a water jar and must follow him. However, the two participial/present actions are better represented as ongoing actions in Yoruba. In particular, “tí ó bá wọ̀” is conditional/completive and can suggest ‘if/when he has entered,’ whereas the Greek identifies the house as the one he is entering.'
  naturalness: The register is clear Standard Yoruba. “Ẹ tọ̀ ọ́ lẹ́yìn” is understandable, but “Ẹ tẹ̀lé e” is the more direct and idiomatic imperative for following a person. “Ẹ wò ó” is retained as a natural attention-getter in this context.
  terminology: “Ìkòkò omi” adequately renders κεράμιον ὕδατος without unnecessarily specifying earthenware. “Ọkùnrin kan” correctly preserves the masculine referent. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: 'The man’s carrying is expressed as completed: “tí ó gbé ìkòkò omi.”'
    rationale: βαστάζων is a present participle and depicts him as carrying the jar at the time they meet him. “Tí ó ń gbé ìkòkò omi” more clearly preserves that ongoing action.
  - severity: medium
    issue: The house clause reads “ilé tí ó bá wọ̀.”
    rationale: The conditional marker bá and completive wọ̀ do not naturally represent εἰς ἣν εἰσπορεύεται, ‘the house into which he enters.’ “Ilé tí ó ń wọ̀” identifies the house he is entering and retains the present, directional narrative action.
  - severity: low
    issue: “Ẹ tọ̀ ọ́ lẹ́yìn” is less direct than the normal Yoruba command for following someone.
    rationale: “Ẹ tẹ̀lé e” is concise, idiomatic, and faithfully renders ἀκολουθήσατε αὐτῷ.
  revised_text: Ó sì wí fún wọn pé, “Ẹ wò ó, nígbà tí ẹ bá wọ ìlú náà, ọkùnrin kan tí ó ń gbé ìkòkò omi yóò pàdé yín. Ẹ tẹ̀lé e lọ sínú ilé tí ó ń wọ̀.”
  revised_footnotes: []
  revision_rationale: The revision preserves the draft’s meaning and register while making the Greek present participle βαστάζων and present verb εἰσπορεύεται explicit as actions in progress. It also uses the customary direct Yoruba imperative for following a person. No footnotes are necessary in Yoruba for the retained broad rendering “ìkòkò omi.”
