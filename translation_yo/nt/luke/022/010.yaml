translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo ọ̀rọ̀ ọlọ́wọ̀ àti ọ̀pọ̀ ènìyàn ‘ẹ’ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń bá àwọn ọmọ-ẹ̀yìn méjì sọ̀rọ̀. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní.
