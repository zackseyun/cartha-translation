id: LUK.22.18
reference: Luke 22:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò tún mu nínú èso àjàrà[a] títí ìjọba Ọlọ́run yóò fi dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wáìnì.” Gíríìkì ní “èso àjàrà,” gbólóhùn tó gbòòrò sí i, tí ó ṣeé ṣe kí ó tọ́ka sí ohun tó wà nínú ife láì lo ọ̀rọ̀ tí a sábà máa ń lò fún wáìnì.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: ‘Mo sọ fún yín’ jẹ́ ọ̀nà àdánidá láti túmọ̀ ọ̀rọ̀ ìfihàn tààrà yìí; ‘Nítorí’ pa ìsopọ̀ àlàyé γάρ mọ́.
- source_word: οὐ μὴ πίω
  choice: dájúdájú, èmi kì yóò mu ... mọ́
  rationale: οὐ μή pẹ̀lú aorist subjunctive jẹ́ ìkọ̀ tí ó lágbára nípa ọjọ́ iwájú. ‘Dájúdájú ... kì yóò’ fi agbára náà hàn, ‘mọ́’ sì bá ààlà àkókò tó tẹ̀ lé e mu láì sọ ọ́ di ‘láéláé.’
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsin yìí lọ
  rationale: Ó tọ́ka sí ìbẹ̀rẹ̀ láti àkókò tí a wà yìí, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: lára èso àjàrà
  rationale: γένημα túmọ̀ sí ohun tí irúgbìn mú jáde, ìyẹn èso tàbí ohun àmújáde. ‘Èso àjàrà’ pa gbólóhùn orísun mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ‘wáìnì’ nìkan; ‘lára’ ṣe àfihàn ἀπό lẹ́yìn ọ̀rọ̀ ìmú.
- source_word: ἕως οὗ
  choice: títí ... yóò fi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ààlà àkókò tí ἕως οὗ ń fi hàn.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ pa ìtumọ̀ ọba àti àgbègbè ìṣàkóso βασιλεία mọ́, ó sì jẹ́ gbólóhùn tí a mọ̀ dáadáa nínú Yorùbá.
- source_word: ἔλθῃ
  choice: yóò fi dé
  rationale: Aorist subjunctive lẹ́yìn ἕως οὗ ń tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú; ‘yóò fi dé’ jẹ́ àdánidá nínú gbólóhùn ‘títí ... yóò fi’.
theological_decisions:
- issue: Bóyá a ó túmọ̀ γενήματος τῆς ἀμπέλου sí ‘wáìnì’ tàbí ‘èso àjàrà’
  choice: èso àjàrà
  alternative: wáìnì
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ‘wáìnì’ lọ, ó sì ní ìrísí gbólóhùn pàtó nínú àyíká oúnjẹ náà. Yíyan ‘èso àjàrà’ kò fi ìtumọ̀ tóóró tí orísun kò sọ kún un.
- issue: Ìtumọ̀ ọ̀rọ̀ nípa bí ìjọba Ọlọ́run yóò ṣe dé
  choice: títí ìjọba Ọlọ́run yóò fi dé
  alternative: títí ìjọba Ọlọ́run yóò fi dé ní ẹ̀kúnrẹ́rẹ́
  rationale: Ẹsẹ̀ náà fi ààlà ọjọ́ iwájú hàn, ṣùgbọ́n kò ṣàlàyé ìpele tàbí ọ̀nà tí ìjọba náà yóò gbà dé. Ìtumọ̀ yìí pa àìsọtẹ́lẹ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ìsinsin yìí’ àti ‘dájúdájú’ láti jẹ́ kí ìtẹnumọ́ àti àkókò hàn ní ti ẹ̀dá Yorùbá.
