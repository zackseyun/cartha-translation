    issue: ‘láti ara èso àjàrà’/‘lára èso àjàrà’ nínú ọ̀rọ̀ ìmú
    rationale: ‘Lára’ lè tọ́ka sí apá kan nínú ọ̀pọ̀ nǹkan, dípò orísun ohun tí a ń mu. ‘Nínú’ jẹ́ ìsọ̀rọ̀ tí ó wà lásán jù lọ fún ‘drink of/from the fruit of the vine.’
  - severity: low
    issue: Ìtẹnumọ́ ‘dájúdájú’
    rationale: Kì í ṣe àṣìṣe ìtumọ̀, ṣùgbọ́n ipò rẹ̀ nínú gbólóhùn jẹ́ kí ọ̀rọ̀ náà ní ìdúró díẹ̀. Ìkọ̀ ‘èmi kì yóò tún ...’ ń sọ ìtẹnumọ́ ọjọ́ iwájú náà ní ọ̀nà Yorùbá tí ó rọrùn.
