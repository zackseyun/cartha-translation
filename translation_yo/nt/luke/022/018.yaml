revisions:
- from: Nítorí mo sọ fún yín pé, láti ìsinsin yìí lọ, dájúdájú, èmi kì yóò mu lára èso àjàrà[a] mọ́ títí ìjọba Ọlọ́run yóò fi dé.
  to: Nítorí mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò tún mu nínú èso àjàrà[a] títí ìjọba Ọlọ́run yóò fi dé.
  rationale: Àtúnṣe náà rọ́pò ‘lára’ pẹ̀lú ‘nínú’ kí ìsọ̀rọ̀ náà lè dáa nínú Yorùbá, ó sì tún ṣètò ìkọ̀ náà sí ọ̀nà tí ó kedere. Ó pa ‘èso àjàrà,’ àìdánilójú nípa wáìnì, àti ààlà ọjọ́ iwájú ti ìjọba Ọlọ́run mọ́.
  reviewer_model: gpt-5.6-terra
