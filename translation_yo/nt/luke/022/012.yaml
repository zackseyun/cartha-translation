  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: yo
  text: Òun yóò sì fi yàrá ńlá kan lókè, tí a ti ṣètò sílẹ̀[a], hàn yín; ẹ pèsè níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yàrá ńlá kan lókè tí a ti pèsè sílẹ̀,” tàbí, “yàrá ńlá kan lókè tí a ti tẹ́ àwọn ohun èlò kalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Òun yóò sì
  rationale: Àkópọ̀ καί àti ἐκεῖνος ń tẹ̀síwájú nínú ìtọ́ni, ó sì ń tọ́ka sí ọkùnrin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. “Òun ... sì” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìtọ́kasí àti ìtẹ̀síwájú náà jáde.
- source_word: ὑμῖν δείξει
  choice: fi ... hàn yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún “yóò fi hàn yín,” ó sì pa ọjọ́ iwájú àti ẹni púpọ̀ tí ọ̀rọ̀ náà ń bá sọ mọ́.
- source_word: ἀνάγαιον μέγα
  choice: yàrá ńlá kan tí ó wà lókè
  rationale: ἀνάγαιον túmọ̀ sí yàrá ní apá òkè ilé; “tí ó wà lókè” ṣe kedere sí òǹkàwé Yorùbá òde òní láì fi kún ohun tí Gíríìkì kò sọ.
- source_word: ἐστρωμένον
  choice: tí a ti ṣètò sílẹ̀
  rationale: Participle perfect passive yìí ṣàpèjúwe yàrá náà gẹ́gẹ́ bí èyí tí a ti tẹ́ ohun kalẹ̀ tàbí ṣètò rẹ̀. “Ṣètò sílẹ̀” pa ìtumọ̀ ipò tí ó ti wà ní ìmúrasílẹ̀ mọ́, láì pinnu bóyá ohun èlò ilé tàbí ohun àsè pàtó ni a tẹ́ kalẹ̀.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: ẹ pèsè sílẹ̀ níbẹ̀
  rationale: Àṣẹ ẹni púpọ̀ ni ἑτοιμάσατε; “ẹ pèsè sílẹ̀” pa agbára àṣẹ náà mọ́. A kò fi ohun tí wọ́n ní láti pèsè sínú ẹsẹ yìí, nítorí Gíríìkì náà fi í sílẹ̀ fún àyíká ọ̀rọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “yàrá ... tí ó wà lókè” dípò ọ̀rọ̀ àkànṣe tí ó lè ṣòro, a sì pa àìsọ ohun tí àṣẹ “ẹ pèsè” ń tọ́ka sí mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
