  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: yo
  text: Àríyànjiyàn tún dìde láàárín wọn nípa ẹni wo nínú wọn ni a kà sí ẹni tí ó ga jù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni wo nínú wọn ni ó dà bí ẹni pé ó ga jù.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “a kà sí” tàbí “ó dà bí ẹni pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bẹ̀rẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ bí ipò kan ṣe ṣẹ̀ṣẹ̀ dìde. “Bẹ̀rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àríyànjiyàn náà dìde láàárín wọn.
- source_word: δὲ καὶ
  choice: tún
  rationale: “Tún” fi agbára àfikún καί hàn, ó sì so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú láìfi ìtakora tí kò sí nínú Gíríìkì kún un. A kò fi ọ̀rọ̀ ìbẹ̀rẹ̀ bí “Ǹjẹ́” tàbí “Ní báyìí” kún un.
- source_word: φιλονεικία
  choice: àríyànjiyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìjàkadì tàbí awuyewuye tí ìfẹ́ ipò ń fà. “Àríyànjiyàn” ṣe kedere, ó sì bá ọ̀rọ̀ nípa ẹni ńlá jù mu ní Yorùbá òde òní.
- source_word: ἐν αὐτοῖς
  choice: láàárín wọn
  rationale: Èyí fi hàn pé àríyànjiyàn náà wáyé nínú ẹgbẹ́ àwọn ọmọ-ẹ̀yìn náà.
- source_word: τὸ τίς αὐτῶν
  choice: lórí ẹni ... nínú wọn
  rationale: Àpilẹ̀kọ τὸ mú ìbéèrè tí ó tẹ̀ lé e jẹ́ kókó àríyànjiyàn náà. “Lórí ẹni ... nínú wọn” sọ èyí ní Yorùbá àdánidá.
- source_word: δοκεῖ
  choice: wọ́n kà sí
  rationale: Nínú ọ̀rọ̀ nípa ipò láàárín ẹgbẹ́, “wọ́n kà sí” mú ìtumọ̀ ìdájọ́ tàbí èrò àwọn ẹlòmíràn jáde. A tọ́ka sí ìtumọ̀ mìíràn, “ó dà bí ẹni pé,” nínú àlàyé ìsàlẹ̀.
- source_word: εἶναι μείζων
  choice: sí ẹni ńlá jù
  rationale: “Ẹni ńlá” ń tọ́ka sí ipò tàbí ọlá, kì í ṣe ìwọ̀n ara. Ìlò “jù” ni ọ̀nà Yorùbá àdánidá láti fi ìfiwéra μείζων hàn nínú ẹgbẹ́ tí a mẹ́nu kàn.
theological_decisions:
- issue: Ọ̀rọ̀ ipò láàárín àwọn ọmọ-ẹ̀yìn
  choice: ẹni ńlá jù nínú wọn
  alternative: ẹni pàtàkì jù nínú wọn
  rationale: Μείζων jẹ́ ọ̀rọ̀ ìfiwéra, kì í ṣe ọ̀rọ̀ tó sọ “ẹni tó ga jù lọ” ní tààràtà. “Ẹni ńlá jù nínú wọn” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìfiwéra ipò náà mọ́, láìṣàlàyé irú ọlá tàbí àṣẹ tí wọ́n ń jiyàn lé lórí.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn, tó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Àríyànjiyàn” kò le bí “ìjà,” ṣùgbọ́n ó ṣì mú ìforígbárí ọ̀rọ̀ náà jáde; “ẹni ńlá” ń sọ ipò àti ọlá, kì í sọ bí ara ṣe tóbi.
