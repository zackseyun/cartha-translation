  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: yo
  text: Ṣùgbọ́n, ẹ wò ó, ọwọ́ ẹni tí ń fi mí lé wọn lọ́wọ́ wà pẹ̀lú mi lórí tábìlì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tó ṣáájú, gẹ́gẹ́ bí ‘ṣùgbọ́n’ ṣe máa ń ṣe ní Yorùbá.
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ọ̀rọ̀ ìpe àfiyèsí ni; ‘wò ó’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì mọ́gbọ́n dání.
- source_word: ἡ χεὶρ
  choice: ọwọ́
  rationale: A pa àwòrán ara inú Gíríìkì mọ́ dípò yíyí i sí ‘ẹni náà,’ nítorí ọwọ́ náà ń fi ìsúnmọ́ ẹni tó máa fi Jésù lé wọn lọ́wọ́ hàn.
- source_word: τοῦ παραδιδόντος με
  choice: ẹni tí ń fi mí lé wọn lọ́wọ́
  rationale: Ìṣe lọwọlọwọ náà ni a pa mọ́ pẹ̀lú ‘ń’; ‘fi ... lé wọn lọ́wọ́’ túmọ̀ sí fífi ẹni kan fún àwọn aláṣẹ tàbí ọ̀tá, láìfi ọ̀rọ̀ ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: wà pẹ̀lú mi lórí tábìlì
  rationale: Ó tẹ̀lé ìṣètò àti àwòrán orísun pé ọwọ́ náà wà pẹ̀lú Jésù lórí tábìlì.
theological_decisions:
- issue: Ìtumọ̀ παραδιδόντος gẹ́gẹ́ bí ‘betraying’ tàbí ‘handing over’
  choice: ẹni tí ń fi mí lé wọn lọ́wọ́
  alternative: ẹni tí ń dà mí
  rationale: Yíyan ‘fi mí lé wọn lọ́wọ́’ pa ìtumọ̀ ìṣe Gíríìkì náà mọ́ ní kíkún, kò sì fi ìdájọ́ ọkàn tàbí ìtumọ̀ ẹ̀kọ́ ìsìn tó ju ohun tí ẹsẹ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá àgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lasán. Àmì ohùn ni a lò níbi tó yẹ; a pa àwòrán ‘ọwọ́ ... lórí tábìlì’ mọ́.
