  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: yo
  text: Ó sì wà nínú ìrora ọkàn[a], ó sì ń túbọ̀ gbàdúrà gidigidi;[c] ìlagùn rẹ̀ sì dà bí àwọn ìṣokùn ẹ̀jẹ̀[b] tí ń ṣubú sí ilẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìdààmú líle” tàbí “nínú ìjàkadì líle.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “bí àwọn ìṣokùn tàbí ìdì ẹ̀jẹ̀.” Èyí jẹ́ àfiwé; kò sọ ní tààrà pé ìlagùn náà fúnra rẹ̀ jẹ́ ẹ̀jẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé àfọwọ́kọ kan kò ní Lúùkù 22:43–44; àwọn mìíràn ní wọn. SBLGNT fi àwọn ẹsẹ wọ̀nyí sínú àmì àkámọ́ láti fi àìdánilójú ọ̀rọ̀ inú ìwé àfọwọ́kọ hàn.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: Ó sì wà nínú ìrora ọkàn
  rationale: Gbólóhùn yìí fi ipò ìjàkadì àti ìrora líle tí Jésù wà nínú rẹ̀ hàn. ‘Ìrora ọkàn’ jẹ́ èdè Yorùbá àdánidá tí ó lè yé òǹkàwé òde òní, láì sọ ọ́ di ìrora ara nìkan.
- source_word: ἐκτενέστερον
  choice: kíkankíkan sí i
  rationale: Ọ̀rọ̀ náà jẹ́ afiwéra, ó ń tọ́ka sí pé bí ó ṣe ń gbàdúrà le sí i. ‘Kíkankíkan sí i’ pa agbára afiwéra náà mọ́.
- source_word: προσηύχετο
  choice: ó ń gbàdúrà
  rationale: Àkókò imperfect nínú Gíríìkì tọ́ka sí ìṣe tí ń bá a lọ; àmì ‘ń’ mú ìtẹ̀síwájú yìí hàn ní Yorùbá.
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: òógùn rẹ̀ sì dà
  rationale: ‘Dà’ ní ìtumọ̀ ‘wá dà bí’ ṣe àfihàn ìyípadà tàbí ipò tí ó yọrí sí, ní èdè Yorùbá tí ó rọrùn.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: bí àwọn ìṣẹ̀ ẹ̀jẹ̀
  rationale: ‘Bí’ pa àfiwé ὡσεὶ mọ́, kò sì sọ pé òógùn náà jẹ́ ẹ̀jẹ̀ ní pàtó. ‘Ìṣẹ̀’ ń sọ àwọ̀n omi tó tóbi tàbí tó nípọn tí ń ṣubú.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: tí ń ṣubú sí ilẹ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìrìn-sísàlẹ̀ àwọn ìṣẹ̀ náà títí dé ilẹ̀.
theological_decisions:
- issue: Irú àjọṣe tó wà nínú ‘bí àwọn ìṣẹ̀ ẹ̀jẹ̀’
  choice: 'A pa àfiwé mọ́: òógùn rẹ̀ dà bí àwọn ìṣẹ̀ ẹ̀jẹ̀.'
  alternative: Òógùn rẹ̀ jẹ́ ẹ̀jẹ̀ ní ti gidi.
  rationale: ὡσεὶ jẹ́ àmì àfiwé kedere. Nítorí náà, ìtumọ̀ kò gbọ́dọ̀ sọ àfiwé di ìdánimọ̀, tàbí fi ẹ̀kọ́ ìṣègùn tàbí iṣẹ́ ìyanu kan kún ohun tí Gíríìkì sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé yé fún òǹkàwé òde òní. A lo ‘ìrora ọkàn’ fún anguish/agony, ‘kíkankíkan sí i’ láti pa comparative mọ́, àti ‘bí’ láti dáàbò bo àfiwé Gíríìkì. Gbogbo àmì àlàyé [a], [b], [c] farahàn nínú ọ̀rọ̀ pàtàkì.
