  to: 'Nítorí, ta ni ó ga jù lọ: ẹni tí ó jókòó níbi oúnjẹ[a] tàbí ẹni tí ń ṣe ìránṣẹ́? Ṣé kì í ṣe ẹni tí ó jókòó níbi oúnjẹ? Ṣùgbọ́n èmi wà láàárín yín bí ẹni tí ń ṣe ìránṣẹ́.'
