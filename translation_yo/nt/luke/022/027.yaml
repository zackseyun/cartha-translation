id: LUK.22.27
reference: Luke 22:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: yo
  text: 'Nítorí, ta ni ó ga jù lọ: ẹni tí ó jókòó níbi oúnjẹ[a] tàbí ẹni tí ń ṣe ìránṣẹ́? Ṣé kì í ṣe ẹni tí ó jókòó níbi oúnjẹ? Ṣùgbọ́n èmi wà láàárín yín bí ẹni tí ń ṣe ìránṣẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú àṣà àsè ìgbà náà, àwọn tó ń jẹun sábà máa ń rọ̀gbọ̀kú ní tábìlì, nígbà tí àwọn mìíràn ń sìn wọ́n. Ní ìtumọ̀ gangan, ọ̀rọ̀ Gíríìkì náà lè jẹ́, “ẹni tí ó rọ̀gbọ̀kú.”
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Nítorí ta ni ó pọ̀jù ní ipò
  rationale: “Ta” fi ìbéèrè ẹni hàn, “nítorí” sì pa ipa ìṣàlàyé γάρ mọ́. Àfikún “ní ipò” mú ìtumọ̀ ìfiwéra ipò tàbí ọlá inú μείζων ṣe kedere láì sọ ọ́ di ìtumọ̀ ẹ̀kọ́ ìsìn kan.
- source_word: ὁ ἀνακείμενος
  choice: ẹni tí ó jókòó jẹun
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ó rọ̀gbọ̀kú níbi àsè ní àṣà ìgbà náà. Bí ó tilẹ̀ jẹ́ pé “jókòó” kì í ṣe ìrísí ara gangan, ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ó wà níbi oúnjẹ gẹ́gẹ́ bí àlejò; àlàyé ìsàlẹ̀ ojú ìwé pa àṣà rírògbọ̀kú mọ́.
- source_word: ὁ διακονῶν
  choice: ẹni tí ń ṣe ìránṣẹ́
  rationale: Ó pa ìṣe sísìn mọ́ nínú àyíká oúnjẹ, kò sì yí participle náà padà sí orúkọ ẹrú tàbí sí ipò iṣẹ́ ìjọ.
- source_word: οὐχὶ
  choice: Kì í ha ṣe
  rationale: Ìtumọ̀ yìí jẹ́ ìbéèrè àsọyé tí ó ń retí ìdáhùn pé bẹ́ẹ̀ ni.
- source_word: ἐγὼ δὲ
  choice: Ṣùgbọ́n èmi
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ hàn láàárín ìlànà ipò tí àwọn ènìyàn mọ̀ àti àpẹẹrẹ Jésù; fífi “èmi” síwájú tún pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: wà láàárín yín
  rationale: “Láàárín yín” jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì sun mọ́ ìtumọ̀ gangan ti wíwà ní àárín ẹgbẹ́ kan.
- source_word: ὡς ὁ διακονῶν
  choice: bí ẹni tí ń ṣe ìránṣẹ́
  rationale: “Bí” pa ipa ìfiwéra tàbí ọ̀nà ìhùwàsí ὡς mọ́, ìṣe “ń ṣe ìránṣẹ́” sì fi iṣẹ́ tí ń lọ lọ́wọ́ hàn.
theological_decisions:
- issue: Ọ̀nà tí a fi sọ bí Jésù ṣe ṣàpèjúwe ara rẹ̀ nípa iṣẹ́ ìránṣẹ́
  choice: Ṣùgbọ́n èmi wà láàárín yín bí ẹni tí ń ṣe ìránṣẹ́.
  alternative: Ṣùgbọ́n èmi wà láàárín yín bí ìránṣẹ́.
  rationale: Gíríìkì lo participle διακονῶν, kì í ṣe orúkọ δοῦλος. Nítorí náà, “ẹni tí ń ṣe ìránṣẹ́” pa ìṣe sísìn àti ìyàtọ̀ inú àyíká oúnjẹ mọ́, láì fi ìtumọ̀ ẹrú tàbí ipò iṣẹ́ ìjọ kún un.
- issue: Ìtumọ̀ μείζων gẹ́gẹ́ bí ìfiwéra ipò
  choice: pọǹjù ní ipò
  alternative: tóbi jù
  rationale: Nínú àyíká ẹni tí ń jẹun àti ẹni tí ń ṣe ìránṣẹ́, ọ̀rọ̀ náà kan ipò tàbí ọlá láwùjọ. “Ní ipò” dènà kí a má ka a sí ìtóbi ara, ṣùgbọ́n ó ṣì pa ìfiwéra náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Jókòó jẹun” ni a lò fún ìmúlẹ̀ àdánidá ní Yorùbá, nígbà tí àlàyé [a] ṣe àfihàn àṣà àsè àti ìtumọ̀ gangan.
