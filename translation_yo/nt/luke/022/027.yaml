review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two contrasted roles, the rhetorical question expecting an affirmative response, and Jesus’ contrasting self-description. Its explanatory addition “ní ipò” is contextually defensible for μείζων, but “pọ̀jù ní ipò” is not the most idiomatic Yoruba expression for comparative social standing.
  naturalness: 'A small revision improves idiomatic public-reading Yoruba: “ga jù lọ” naturally expresses relative rank, and “Ṣé kì í ṣe ...?” more clearly carries the affirmative rhetorical force of οὐχί. “Jókòó níbi oúnjẹ” avoids making the source participle mean specifically ‘eating,’ while the note retains the historical nuance of reclining.'
  terminology: “Ẹni tí ń ṣe ìránṣẹ́” appropriately retains the verbal service sense of διακονῶν without turning it into the stronger term ‘ẹrú.’ “Ga jù lọ” is a natural rendering of μείζων in this status-oriented context. The cultural note should use clear Yoruba and state that the literal Greek sense is reclining.
  issues:
  - severity: medium
    issue: “ó pọ̀jù ní ipò” is awkward for comparative rank.
    rationale: Although it seeks to clarify μείζων as status, “ga jù lọ” is more natural Standard Yoruba for ‘greater/higher in rank’ and retains the comparison.
  - severity: low
    issue: The second rhetorical question, “Kì í ha ṣe ...?”, is less clear and less natural in modern public-reading Yoruba.
    rationale: “Ṣé kì í ṣe ...?” clearly conveys a question that expects agreement, matching οὐχί.
  - severity: low
    issue: The footnote wording “Ní gígùn sí ọ̀rọ̀ Gíríìkì” is not idiomatic, and “lẹ́gbẹ̀ẹ́ ibi oúnjẹ” can suggest lying beside rather than reclining at a table.
    rationale: A revised note gives the banquet custom accurately and uses the natural expression “Ní ìtumọ̀ gangan.”},{
