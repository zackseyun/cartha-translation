  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù sọ pé, “Ọkùnrin, èmi kò mọ̀ ohun tí o ń sọ.” Lẹ́sẹ̀kẹsẹ̀, nígbà tí ó ṣì ń sọ̀rọ̀, àkùkọ kan kọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora nínú ìtàn hàn, bí Pétérù ṣe tún tako ẹ̀sùn tí wọ́n fi kàn án.
- source_word: Ἄνθρωπε
  choice: Ọkùnrin
  rationale: Ọ̀rọ̀ àpèjúwe yìí ń bá ọkùnrin kan sọ̀rọ̀ ní tààràtà, ó sì pa ìró líle díẹ̀ ti ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di ọ̀rọ̀ ọ̀wọ̀ bí ‘Ọ̀gá.’
- source_word: οὐκ οἶδα
  choice: èmi kò mọ̀
  rationale: Ó túmọ̀ ìsẹ́ náà ní ìtumọ̀ àsìkò ìsinsìnyí; fífi ‘èmi’ sí i tún tẹnumọ́ ìkọ̀ Pétérù.
- source_word: ὃ λέγεις
  choice: ohun tí o ń sọ
  rationale: Ó pa ìtumọ̀ tààràtà mọ́, kò sì tú u sí ‘ohun tí o ní lọ́kàn,’ èyí tí yóò jẹ́ àlàyé ju orísun lọ.
- source_word: παραχρῆμα
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ohun tó ṣẹlẹ̀ láìjáfara.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: nígbà tí ó ṣì ń sọ̀rọ̀
  rationale: Ó fi hàn pé kíké àkùkọ náà ṣẹlẹ̀ ní àkókò kan náà tí Pétérù ṣì ń sọ̀rọ̀.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: àkùkọ kan kọ
  rationale: ‘Àkùkọ kọ’ ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ ohùn àkùkọ; ‘kan’ sì bá àìsí atọ́ka pàtó nínú Gíríìkì mu.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbòò. A lo àmì ohùn níbi tí ó ti yẹ, a sì pa ìtẹnumọ́ àti ìyára ìṣẹ̀lẹ̀ inú orísun Gíríìkì mọ́.
