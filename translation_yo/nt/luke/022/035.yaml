    issue: The verb “ṣaláìní” is nonstandard/malformed in this context.
    rationale: For the meaning ‘to lack,’ Standard Yoruba uses “ṣàìní” (or an equivalent construction such as “ṣe aláìní”). Correcting it is necessary for natural, grammatically sound Yoruba and does not alter the meaning.
