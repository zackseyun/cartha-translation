  naturalness: The sentence is generally clear and suitably formal. However, “ṣaláìní” is not the standard natural form for ‘lack/be without’ here. “ṣàìní” corrects the form while retaining the direct sense of ὑστερέω.
  terminology: “Àpò owó” and “àpò ìrìn-àjò” are accurate, readable choices. “Bàtà” is an acceptable general Yoruba term for the Greek sandals/footwear in this context. The alternative footnote appropriately preserves the knapsack sense of πήρα without overstating a precise bag type.
