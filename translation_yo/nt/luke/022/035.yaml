id: LUK.22.35
reference: Luke 22:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Nígbà tí mo rán yín jáde láìsí àpò owó, àpò ìrìn-àjò[a] àti bàtà, ǹjẹ́ ẹ ṣàìní ohunkóhun?” Wọ́n sì dáhùn pé, “Rárá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àpò tí a máa ń gbé lé ẹ̀yìn.”
    reason: πήρα lè túmọ̀ sí àpò ìpèsè ìrìn-àjò tàbí àpò ẹ̀yìn; àfikún yìí pa àṣàyàn ọ̀rọ̀ náà mọ́ láìdín ìtumọ̀ rẹ̀ kù.
lexical_decisions:
- source_word: ἄτερ
  choice: láìsí
  rationale: Ó fi hàn pé wọn kò mú àwọn ohun náà lọ; ‘láìsí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ absence/lack ní àyíká yìí.
- source_word: βαλλαντίου
  choice: àpò owó
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àpò tí a fi ń kó owó; ‘àpò owó’ ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: πήρας
  choice: àpò ìrìn-àjò
  rationale: πήρα jẹ́ àpò fún ohun èlò tàbí oúnjẹ ìrìn-àjò. ‘Àpò ìrìn-àjò’ sọ iṣẹ́ rẹ̀ ní kedere láìfi irú àpò kan pàtó múlẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ὑποδημάτων
  choice: bàtà
  rationale: ‘Bàtà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a wọ̀ sí ẹsẹ̀, ó sì yẹ fún bàtà ìrìn ní àṣà ìgbà náà láìjẹ́ kí gbolohun náà dun bí èdè àjèjì.
- source_word: μή τινος ὑστερήσατε
  choice: ǹjẹ́ ẹ ṣaláìní ohunkóhun?
  rationale: ‘Ṣaláìní’ mú ìtumọ̀ ὑστερέω, ìyẹn láti ní àìní tàbí láti ṣe aláìní, wá sí Yorùbá. Ìbéèrè náà tún ń retí ìdáhùn òdì gẹ́gẹ́ bí μή ṣe ń tọ́ka sí.
- source_word: Οὐθενός
  choice: Rárá.
  rationale: Nínú Yorùbá, ‘Rárá’ ni ìdáhùn kúkúrú, àdánidá sí irú ìbéèrè òdì yìí, ó sì túmọ̀ sí pé wọn kò ṣaláìní ohunkóhun.
- source_word: ἀπέστειλα
  choice: mo rán yín jáde
  rationale: ‘Rán ... jáde’ mú agbára iṣẹ́-ìránṣẹ́ inú ἀποστέλλω hàn ju ‘rán’ nìkan lọ.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu. Ìdáhùn ‘Rárá’ pa kúkúrú ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà Yorùbá tó ṣeé gbọ́.
