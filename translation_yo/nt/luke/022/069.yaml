source:
  edition: SBLGNT
  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: yo
  text: Ṣùgbọ́n láti ìsinsìnyí lọ, Ọmọ Ènìyàn yóò jókòó ní ọwọ́ ọ̀tún agbára Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsìnyí lọ
  rationale: Ó jẹ́ ọ̀rọ̀ àkókò àdánidá ní Yorùbá, ó sì fi hàn pé láti àsìkò yìí lọ ni ohun tí a sọ yóò bẹ̀rẹ̀ sí í wáyé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó fi ìyàtọ̀ tàbí ìyípadà sí apá tuntun nínú ìdáhùn Jésù hàn.
- source_word: ἔσται
  choice: yóò jókòó
  rationale: Àpapọ̀ rẹ̀ pẹ̀lú καθήμενος ni a túmọ̀ sí ọ̀nà àdánidá ní Yorùbá; ó tọ́ka sí ipò tí Ọmọ Ènìyàn yóò wà.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa orúkọ oyè Jésù mọ́ ní ọ̀nà gangan, pẹ̀lú ìtumọ̀ àti ìtọ́kasí rẹ̀ sí àwòrán inú Dáníẹ́lì.
- source_word: καθήμενος
  choice: jókòó
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì lè gbé àwòrán jíjókòó lórí ìtẹ́ àti ipò ọlá gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἐκ δεξιῶν
  choice: ní ọwọ́ ọ̀tún
  rationale: Èyí pa àkànlò èdè Bíbélì mọ́ fún ipò ọlá àti àṣẹ gíga jù lọ.
- source_word: τῆς δυνάμεως
  choice: agbára
  rationale: Ó túmọ̀ δύναμις ní tààrà, láì sọ ọ́ di orúkọ àpèjúwe Ọlọ́run ní ọ̀rọ̀ pàtàkì.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ó sọ ní kedere pé agbára Ọlọ́run ni ọ̀rọ̀ náà ń tọ́ka sí, gẹ́gẹ́ bí gbólóhùn Gíríìkì ṣe wí.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ìgbéga Ọmọ Ènìyàn àti àṣẹ Ọlọ́run
  choice: Ọmọ Ènìyàn yóò jókòó ní ọwọ́ ọ̀tún agbára Ọlọ́run
  alternative: Ọmọ Ènìyàn yóò jókòó ní ọwọ́ ọ̀tún Agbára
  rationale: Ìtumọ̀ náà pa ìjẹ́pàtàkì jíjókòó ní ipò ọlá àti àṣẹ mọ́, pẹ̀lú ìró orin Sáàmù 110 àti Dáníẹ́lì 7, láì ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ. Àlàyé ìsàlẹ̀ pa òye pé ‘Agbára’ lè jẹ́ ọ̀nà ìbọ̀wọ̀ láti tọ́ka sí Ọlọ́run mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “jókòó” dípò gbólóhùn aláìṣe àdánidá bí “yóò wà ní jíjókòó,” a sì pa àkànlò “ní ọwọ́ ọ̀tún” mọ́ nítorí ìtumọ̀ Bíbélì rẹ̀.
