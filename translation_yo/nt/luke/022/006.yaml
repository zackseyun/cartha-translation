id: LUK.22.6
reference: Luke 22:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: yo
  text: Ó sì gbà, ó sì bẹ̀rẹ̀ sí í wá àǹfààní láti fi í lé wọn lọ́wọ́[a] láìsí ogunlọ́gọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti dà á.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gangan “láti fi í lé wọn lọ́wọ́” tàbí “láti fà á silẹ̀ fún wọn”; nínú ipa Júdásì nínú ìṣẹ̀lẹ̀ náà, “láti dà á” jẹ́ ìtumọ̀ mìíràn tó bá àyíká ọ̀rọ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: Ó sì gbà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé Júdásì fara mọ́ ohun tí àwọn olórí àlùfáà àti àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì fẹ́ ṣe; “gbà” jẹ́ ọ̀nà àdánidá láti sọ ìfaramọ́ yìí ní Yorùbá.
- source_word: ἐζήτει
  choice: ó sì bẹ̀rẹ̀ sí í wá
  rationale: Àkókò imperfect náà lè fi ìṣe tí ń lọ lọ́wọ́ tàbí ìbẹ̀rẹ̀ ìṣe hàn. Gbólóhùn yìí mú ìtẹ̀síwájú ìtàn náà jáde lẹ́yìn tí ó fara mọ́ ète wọn.
- source_word: εὐκαιρίαν
  choice: àǹfààní
  rationale: “Àǹfààní” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àkókò tàbí ipò tó rọrùn, tó sì yẹ fún ṣíṣe ohun kan.
- source_word: τοῦ παραδοῦναι αὐτὸν
  choice: láti fi í lé wọn lọ́wọ́
  rationale: Yíyan “fi í lé wọn lọ́wọ́” pa ìtumọ̀ gangan ti παραδίδωμι mọ́, ìyẹn fífi ẹnì kan lé ẹlòmíràn lọ́wọ́, láì fi ìtumọ̀ àlàyé “dà á” rọ́pò rẹ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἄτερ ὄχλου
  choice: nígbà tí ogunlọ́gọ̀ kò bá sí
  rationale: Èyí sọ ní Yorùbá àdánidá pé Júdásì ń wá àkókò tí ogunlọ́gọ̀ kì yóò wà níbẹ̀.
- source_word: αὐτοῖς
  choice: wọn lọ́wọ́
  rationale: “Wọn” tọ́ka sí àwọn olórí àlùfáà àti àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; àkópọ̀ “fi í lé wọn lọ́wọ́” mú ipa wọn gẹ́gẹ́ bí olùgbà hàn kedere.
theological_decisions:
- issue: Bóyá a ó tú παραδοῦναι sí fífi Jésù lé wọn lọ́wọ́ tàbí dídà á
  choice: fi í lé wọn lọ́wọ́
  alternative: dà á
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbooro ti “fifúnni lé ẹlòmíràn lọ́wọ́.” Nínú ipa Júdásì, “dà á” jẹ́ ìtumọ̀ tó bá àyíká mu, ṣùgbọ́n ọ̀rọ̀ pàtàkì pa ìtumọ̀ gangan àti ìṣọ̀kan ọ̀rọ̀ nínú ìtàn ìjìyà Jésù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Ogunlọ́gọ̀” jẹ́ ọ̀rọ̀ tó ṣe kedere fún ὄχλος, a sì lo “nígbà tí ... kò bá sí” dípò ìtumọ̀ líle ti “láìsí ogunlọ́gọ̀” kí gbólóhùn náà lè ṣàn dáadáa fún òǹkàwé òde òní.
