id: LUK.22.36
reference: Luke 22:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí, ẹni tí ó bá ní àpò owó, kí ó mú un; kí ó sì mú àpò ìrìn-àjò bákan náà[a]. Ẹni tí kò bá ní idà, kí ó ta aṣọ òde rẹ̀, kí ó sì ra idà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àpò’ tàbí ‘àpò ẹrù kékeré.’ Ọ̀rọ̀ Gíríìkì πήρα ń tọ́ka sí àpò tí arìnrìn-àjò ń gbé.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì μάχαιρα lè tún tọ́ka sí abẹ́ ogun tàbí idà kúkúrú. Nínú Gíríìkì, ohun tí ‘ẹni tí kò bá ní’ kò ní ni a kò sọ ní gbangba; àyíká ọ̀rọ̀ ló mú kí a fi ‘idà’ hàn nínú ìtumọ̀.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Ṣùgbọ́n ní báyìí
  rationale: Ó pa agbára ìyàtọ̀ ἀλλά mọ́ sí ohun tí Jésù sọ ṣáájú, ó sì fi ìtumọ̀ àkókò νῦν hàn ní Yorùbá àdánidá.
- source_word: ὁ ἔχων
  choice: ẹni tí ó bá ní
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ti ẹnikẹ́ni lápapọ̀, kò sì fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ.
- source_word: βαλλάντιον
  choice: àpò owó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àpò tí a fi ń gbé owó; yíyan yìí ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἀράτω
  choice: kí ó mú un
  rationale: Ó fi àṣẹ láti mú un lọ tàbí láti gbé e dání hàn ní ọ̀nà Yorùbá tí ó bójú mu fún ìmúrasílẹ̀ ìrìn-àjò.
- source_word: ὁμοίως καὶ πήραν
  choice: kí ó sì mú àpò ìrìn-àjò bákan náà
  rationale: πήρα jẹ́ àpò arìnrìn-àjò; ‘bákan náà’ pa ìtumọ̀ ὁμοίως mọ́.
- source_word: ὁ μὴ ἔχων
  choice: Ẹni tí kò bá ní idà
  rationale: Gíríìkì kò tún ohun tí ẹni náà kò ní sọ ní gbangba, ṣùgbọ́n àṣẹ tí ó tẹ̀ lé láti ra μάχαιρα mú kí ‘idà’ jẹ́ ohun tí Yorùbá nílò láti sọ kí gbólóhùn náà lè ṣe kedere. Àlàyé ìsàlẹ̀ fi àìsọ ohun náà ní Gíríìkì hàn.
- source_word: πωλησάτω
  choice: kí ó ta
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún àṣẹ láti ta ohun kan.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: ẹ̀wù àwọ̀lékè rẹ̀
  rationale: ἱμάτιον ń tọ́ka sí aṣọ òde pàtàkì tí ènìyàn ń wọ lókè aṣọ mìíràn.
- source_word: ἀγορασάτω
  choice: kí ó sì ra
  rationale: Ó fi àṣẹ Gíríìkì hàn ní Yorùbá tí ó rọrùn, tí ó sì ṣe àdánidá.
- source_word: μάχαιραν
  choice: idà
  rationale: μάχαιρα lè jẹ́ idà kúkúrú tàbí abẹ́ ogun ńlá, ṣùgbọ́n ‘idà’ jẹ́ ọ̀rọ̀ Yorùbá gbòòrò tí kò fi ìwọ̀n tí Gíríìkì kò dá lójú kún un.
theological_decisions:
- issue: Bóyá kí a dín agbára àṣẹ Jésù láti ra idà kù tàbí kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí àpẹẹrẹ lásán.
  choice: kí ó sì ra idà
  alternative: kí ó múra sí ewu / kí ó ra ohun ìjà
  rationale: Gíríìkì lo μάχαιρα ní tààrà, ó sì lo ọ̀nà àṣẹ. Ìtumọ̀ náà pa ìforígbárí àti ìbéèrè ìtumọ̀ ẹ̀kọ́ ìsìn mọ́, láìfi ìdájọ́ nípa ìjà tàbí àpẹẹrẹ sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì bá ọ̀rọ̀ àṣẹ mu láìdi èdè àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn kan pàtó.
