source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi ń sùn? Ẹ dìde, kí ẹ sì gbàdúrà, kí ẹ má bàa bọ́ sínú ìdánwò.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: ẹ ń sùn
  rationale: Ó túmọ̀ sí pé wọ́n ń sùn; àkókò ìṣe tí ó ń lọ bá ọ̀rọ̀ ìbéèrè náà mu ní Yorùbá.
- source_word: ἀναστάντες
  choice: Ẹ dìde
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí dídìde kúrò ní ipò tí wọ́n wà, ó sì ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ ní àyíká ọ̀rọ̀ yìí.
- source_word: προσεύχεσθε
  choice: kí ẹ sì máa gbàdúrà
  rationale: Ìtumọ̀ àdúrà ni a lò, pẹ̀lú ìṣe tí ó ń bá a lọ gẹ́gẹ́ bí fọ́ọ̀mù Gíríìkì ṣe lè tọ́ka sí.
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: kí ẹ má bàa bọ́ sínú ìdánwò
  rationale: Ó pa ète ìkìlọ̀ mọ́, ó sì tún pa àwòrán ‘wọ inú’ mọ́ ní ọ̀nà Yorùbá tí ó ṣe àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πειρασμόν
  choice: ìdánwò
  alternative: ìdẹwò
  rationale: ‘Ìdánwò’ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, nítorí ó lè túmọ̀ sí àdánwò tàbí ipò tí ń fà ènìyàn sínú ẹ̀ṣẹ̀; ‘ìdẹwò’ nìkan lè dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ títọ́, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní.
