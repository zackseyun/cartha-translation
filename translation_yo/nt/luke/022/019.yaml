id: LUK.22.19
reference: Luke 22:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: yo
  text: Ó sì mú búrẹ́dì, lẹ́yìn tí ó dúpẹ́, ó bù ú, ó sì fi fún wọn, ó ní, “Èyí ni ara mi[c], tí a ń fi fún yín[b]. Ẹ máa ṣe èyí ní ìrántí mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan kò ní: “tí a ń fi fún yín. Ẹ máa ṣe èyí ní ìrántí mi.”'
    reason: textual_variant
  - marker: b
    text: 'Tàbí: “tí a fi fún yín.”'
    reason: lexical_alternative
  - marker: c
    text: A túmọ̀ “Èyí ni ara mi” gẹ́gẹ́ bí a ti kọ ọ́. Àwọn kan túmọ̀ rẹ̀ sí “Èyí ṣàpẹẹrẹ ara mi,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo “ni.”
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: Ó sì mú búrẹ́dì
  rationale: ‘Mú’ ń sọ ìṣe gbígba náà ní Yorùbá àdánidá, ‘búrẹ́dì’ sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lóye kedere fún ἄρτος nínú àyíká oúnjẹ yìí.
- source_word: εὐχαριστήσας
  choice: lẹ́yìn tí ó dúpẹ́
  rationale: Ó fi hàn pé ìdúpẹ́ ṣáájú bíbu búrẹ́dì, láì fi ẹni tí a dúpẹ́ lọwọ rẹ̀ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: ó bù ú, ó sì fi fún wọn
  rationale: ‘Bù ú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bíbu apá kan nínú búrẹ́dì; arọ́pò-orúkọ ohun náà mú ohun tí a fi fún wọn ṣe kedere.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Èyí ni ara mi
  rationale: A pa ọ̀rọ̀ àsopọ̀ ἐστιν mọ́ gẹ́gẹ́ bí ‘ni,’ láì túmọ̀ rẹ̀ sí ‘ṣàpẹẹrẹ’ tàbí ‘dúró fún.’
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: tí a fi fún yín
  rationale: Gbólóhùn ìbátan aláìlẹ́ni tí ó ṣe iṣẹ́ náà jẹ́ Yorùbá àdánidá fún àkópọ̀ article-participle; ‘fún yín’ pa ìtumọ̀ anfàní tàbí dípò ẹni mọ́ láì pinnu ẹ̀kọ́ ìsìn kan.
- source_word: τοῦτο ποιεῖτε
  choice: Ẹ máa ṣe èyí
  rationale: ‘Máa ṣe’ ń fi agbára àṣẹ ìsinsìnyí tí ó tọ́ka sí ìṣe tí a ń tẹ̀ síwájú tàbí tún ṣe hàn.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: ní ìrántí mi
  rationale: Ó jẹ́ ọ̀nà Yorùbá kedere fún ìṣe ìrántí tàbí ayẹyẹ ìrántí, kì í ṣe ìrántí inú ọkàn lásán.
theological_decisions:
- issue: Ìtumọ̀ ‘Èyí ni ara mi’ nínú àyíká Oúnjẹ Alẹ́ Olúwa
  choice: A pa ọ̀rọ̀ náà mọ́ pé ‘Èyí ni ara mi.’
  alternative: ‘Èyí ṣàpẹẹrẹ ara mi’ tàbí ‘Èyí dúró fún ara mi.’
  rationale: Gíríìkì lo ọ̀rọ̀ àsopọ̀ ‘ni’; ìtumọ̀ kò gbọ́dọ̀ yanjú àríyànjiyàn ẹ̀kọ́ ìsìn nípasẹ̀ àlàyé tí kò sí nínú ọ̀rọ̀ náà.
- issue: Ipò àyípadà àfọwọ́kọ fún apá gígùn Lúùkù 22:19
  choice: A fi apá ‘tí a fi fún yín. Ẹ máa ṣe èyí ní ìrántí mi’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Ọ̀rọ̀ kúkúrú tí ó parí lẹ́yìn ‘Èyí ni ara mi.’
  rationale: SBLGNT tí a pèsè ní apá gígùn náà, bí ó tilẹ̀ jẹ́ pé ó fi àmì hàn pé ẹ̀rí àfọwọ́kọ ní ìjíròrò; àlàyé ìsàlẹ̀ pa àyípadà pàtàkì náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Búrẹ́dì’ ni a yàn dípò ‘àkàrà’ láti yẹra fún ìdàrúdàpọ̀ pẹ̀lú oúnjẹ ẹ̀wà tí ‘àkàrà’ sábà máa ń túmọ̀ sí ní Yorùbá òde òní. Àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ’ bá àyíká àwọn ọmọ-ẹ̀yìn mu.
