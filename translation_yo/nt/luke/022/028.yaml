  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin ni àwọn tí ẹ ti dúró pẹ̀lú mi nínú àwọn ìdánwò mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú àwọn ìdẹwò mi.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdẹwò tàbí ìdánwò; níbí, ó ṣeé ṣe kó ń tọ́ka sí àwọn ìpọ́njú tí Jésù fara dà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ẹni kejì ọ̀pọ̀ wà ní iwájú fún ìtẹnumọ́; “ẹ̀yin” jẹ́ kí ìtẹnumọ́ náà hàn ní Yorùbá.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tó ṣáájú, nítorí náà “Ṣùgbọ́n” bá àyíká ọ̀rọ̀ mu.
- source_word: οἱ διαμεμενηκότες
  choice: àwọn tí ẹ ti dúró ṣinṣin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ kan tí wọ́n tẹ̀ síwájú láti dúró títí dé àkókò yìí; “ti dúró ṣinṣin” mú ìfaradà àti ipa perfect náà jáde lọ́nà àdánidá.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: Èyí fi ìbákẹ́gbẹ́ àti wíwà papọ̀ hàn ní kedere.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: nínú àwọn ìdánwò mi
  rationale: πειρασμός lè túmọ̀ sí ìdánwò, àdánwò, tàbí ìtànjẹ sí ẹ̀ṣẹ̀. “Ìdánwò” jẹ́ ọ̀rọ̀ Yorùbá tó lè pa ìwọ̀n ìtumọ̀ náà mọ́, nígbà tí àyíká ọ̀rọ̀ ń tọ́ka sí àwọn ìnira tí Jésù fara dà.
theological_decisions:
- issue: Ìtumọ̀ πειρασμοῖς nígbà tí ó ń tọ́ka sí Jésù
  choice: àwọn ìdánwò/ìpọ́njú tí Jésù fara dà
  alternative: àwọn ìdẹwò tí Jésù ní ìrírí wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìdánwò tàbí ìdẹwò. Nínú àyíká ẹsẹ̀ yìí, Jésù ń yìn àwọn ọmọ-ẹ̀yìn rẹ̀ pé wọ́n dúró pẹ̀lú rẹ̀ láàárín ìnira àti àtakò; síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ kejì náà ṣì hàn.
translation_notes:
  register: Èdè Yorùbá àtẹ̀jáde jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
