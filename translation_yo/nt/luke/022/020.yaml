id: LUK.22.20
reference: Luke 22:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: yo
  text: Lẹ́yìn oúnjẹ alẹ́ náà, ó sì ṣe bẹ́ẹ̀ pẹ̀lú ago náà, ó ní, “Ago yìí ni májẹ̀mú tuntun[a] nínú ẹ̀jẹ̀ mi, tí a ń dà sílẹ̀ fún yín[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “májẹ̀mú” tún lè túmọ̀ sí “ìfẹ́ ẹni nípa ogún” tàbí “testament”; síbẹ̀, “májẹ̀mú” ló bá àyíká ẹ̀jẹ̀ tí ń fi májẹ̀mú múlẹ̀ mu jù.
    reason: alternative_reading
  - marker: b
    text: Nínú ìṣètò ọ̀rọ̀ Gíríìkì, “tí a ń dà sílẹ̀ fún yín” wà lẹ́yìn gbogbo gbólóhùn náà; ìtumọ̀ tó bójú mu jù ni pé ẹ̀jẹ̀ Jesu ni a ń dà sílẹ̀ fún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: ago
  rationale: “Ago” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ohun èlò mímu; kò fi èdè àṣà ìjọ kan kún Gíríìkì.
- source_word: ὡσαύτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ìṣe yìí mọ́ ìṣe tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ “lọ́nà kan náà” ní Yorùbá.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: lẹ́yìn tí wọ́n jẹun alẹ́ tán
  rationale: Ó pa ìtẹ̀lé àkókò Gíríìkì mọ́, ó sì ṣe kedere pé oúnjẹ alẹ́ ti parí.
- source_word: λέγων
  choice: ó sì wí pé
  rationale: A yí ọ̀rọ̀ ìṣe alábàápín Gíríìkì padà sí gbólóhùn Yorùbá tó ṣe déédéé láìyí ìtumọ̀ rẹ̀.
- source_word: καινὴ
  choice: tuntun
  rationale: “Tuntun” ni ìtumọ̀ tó bá àyíká májẹ̀mú mu, dípò ọ̀rọ̀ tó túmọ̀ sí ohun tó ṣẹ̀ṣẹ̀ jẹ́ tàbí tó tutù.
- source_word: διαθήκη
  choice: májẹ̀mú
  rationale: Nínú àyíká ẹ̀jẹ̀ àti ìdásílẹ̀ ìbáṣepọ̀ Ọlọ́run pẹ̀lú ènìyàn, “májẹ̀mú” pa ìpìlẹ̀ inú Májẹ̀mú Láéláé mọ́ ju “ìwé ogún” lọ.
- source_word: ἐν τῷ αἵματί μου
  choice: nínú ẹ̀jẹ̀ mi
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, ó sì pa àìmọ́ pàtó iṣẹ́ ọ̀rọ̀ ἐν mọ́ dípò yíyan “nípasẹ̀” tàbí “pẹ̀lú” láìsí dandan.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: tí a ń dà sílẹ̀ fún yín
  rationale: Ó fi ìtumọ̀ àdánidá hàn pé ẹ̀jẹ̀ Jesu ni a ń dà sílẹ̀ fún wọn; “fún yín” pa agbára ὑπὲρ mọ́ láìfi ẹ̀kọ́ pàtó kan nípa ètùtù kún un.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú ọ̀rọ̀ májẹ̀mú àti oúnjẹ Olúwa
  choice: májẹ̀mú tuntun
  alternative: ìwé ogún tuntun
  rationale: Ọ̀rọ̀ nípa ẹ̀jẹ̀ tó ń fi májẹ̀mú múlẹ̀ rántí àyíká Májẹ̀mú Láéláé; “májẹ̀mú” ló yẹ jù, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn tí ọ̀rọ̀ Gíríìkì lè ní hàn.
- issue: Ohun tí τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον ń tọ́ka sí
  choice: ẹ̀jẹ̀ Jesu ni a ń dà sílẹ̀ fún wọn
  alternative: kí gbolohun náà so mọ́ ago ní tààrà gẹ́gẹ́ bí ìbámu gírámà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ alábàápín náà dúró lẹ́yìn gbogbo gbólóhùn, ìtumọ̀ tó bójú mu jù ni pé ẹ̀jẹ̀ ni a ń dà sílẹ̀, kì í ṣe ohun èlò ago fúnra rẹ̀. Àlàyé ìsàlẹ̀ jẹ́ kí ìṣètò Gíríìkì àti ìṣòro ìtọ́kasí náà hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A fi “ó mú ago” kún un gẹ́gẹ́ bí ọ̀rọ̀ ìṣe tí Gíríìkì fi sílẹ̀ nítorí pé ó hàn nínú ẹsẹ tó ṣáájú; èyí jẹ́ dandan fún gbólóhùn Yorùbá tó pé. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
