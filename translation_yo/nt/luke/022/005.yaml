  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: yo
  text: Inú wọn sì dùn, wọ́n sì bá a fohùn ṣọ̀kan láti fún un ní owó[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “fàdákà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fàdákà gan-an tàbí owó lápapọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: Inú wọn dùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé inú àwọn ènìyàn dùn sí ohun kan; ó pa agbára ìdáhùn ẹ̀dùn ọkàn inú ọ̀rọ̀ Gíríìkì mọ́ láì di ọ̀rọ̀ àjèjì.
- source_word: συνέθεντο
  choice: wọ́n bá a dá májẹ̀mú
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n dé sí àdéhùn pẹ̀lú rẹ̀. “Bá a dá májẹ̀mú” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àdéhùn láàárín àwọn ẹgbẹ́ méjì, kò sì túmọ̀ rẹ̀ sí ìlérí nìkan.
- source_word: αὐτῷ
  choice: fún un
  rationale: Arọ́pò-orúkọ dative náà ni ẹni tí wọn yóò fún; “fún un” sọ ìbáṣepọ̀ yìí ní kedere ní Yorùbá.
- source_word: ἀργύριον
  choice: owó
  rationale: Nínú ọ̀rọ̀ ìṣòwò yìí, ἀργύριον túmọ̀ sí ohun tí a fi ń san owó, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà lè jẹ́ fàdákà. “Owó” ló yé òǹkàwé òde òní jù, a sì pa “fàdákà” mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: δοῦναι
  choice: láti fún un ní
  rationale: Infinitive náà sọ ohun tí wọ́n fohùn ṣọ̀kan láti ṣe. “Láti fún un ní” tẹ̀ lé ìtumọ̀ ‘láti fi fún’ ní tààràtà, kò sì fi ìtumọ̀ àfikún “láti san” kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Inú wọn dùn” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, àti “dá májẹ̀mú” láti fi àdéhùn hàn ní kedere. Àmì ohùn ni a fi síbi tí ó yẹ.
