  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: yo
  text: Nígbà tí àwọn tí ó wà ní àyíká rẹ̀ rí ohun tí ó fẹ́ ṣẹlẹ̀, wọ́n wí pé, “Olúwa, ṣé kí a fi idà[a] kọlù?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú idà kan.” Ọ̀rọ̀ Gíríìkì náà, μάχαιρα, lè túmọ̀ sí idà tàbí ohun ìjà kúkúrú bí idà kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí ... rí
  rationale: A túmọ̀ aorist participle náà gẹ́gẹ́ bí gbólóhùn àkókò ní Yorùbá, èyí tó sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì di mímọ́ láì mú kí èdè le.
- source_word: οἱ περὶ αὐτὸν
  choice: àwọn tí ó wà ní àyíká rẹ̀
  rationale: Èyí tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì, kò sì fi kún un pé àwọn ọmọ-ẹ̀yìn ni bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí àwọn ni.
- source_word: τὸ ἐσόμενον
  choice: ohun tí ó fẹ́ ṣẹlẹ̀
  rationale: Ọ̀nà àdánidá ní Yorùbá ni láti fi hàn pé ìṣẹ̀lẹ̀ náà ti sún mọ́lé.
- source_word: εἶπαν
  choice: wọ́n wí pé
  rationale: A pa ìtumọ̀ pàtàkì λέγω mọ́ gẹ́gẹ́ bí ‘wí,’ bó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ tó tẹ̀ lé e.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tó yẹ fún κύριος nígbà tí a fi ń pe Jésù, ó sì pa ìwọ̀n ọlá àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: εἰ πατάξομεν
  choice: ṣé kí a ... kọlù wọ́n?
  rationale: εἰ pẹ̀lú future indicative níbí jẹ́ ìbéèrè ìpinnu. ‘Ṣé kí a...?’ ni ọ̀nà àdánidá tí Yorùbá fi ń béèrè irú ìbéèrè bẹ́ẹ̀; ‘kọlù wọ́n’ mú agbára πατάσσω hàn nínú àyíká ìjà.
- source_word: ἐν μαχαίρῃ
  choice: fi idà
  rationale: ἐν jẹ́ ti irinṣẹ́ níbí. ‘Fi idà’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, nígbà tí idà lè dúró fún ohun ìjà olójú méjì tàbí abẹ́ kúkúrú.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí a ń pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ọlá orúkọ oyè náà àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́; ‘Ọ̀gá’ lè dín in kù sí ọlá láàárín ènìyàn lásán.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn kíkún níbi tí ó bá ṣe àdánidá. ‘Ṣé kí a...?’ jẹ́ ìbéèrè ìpinnu tó rọrùn fún òǹkàwé, ‘wọ́n’ sì jẹ́ ohun tí ọ̀rọ̀-ìṣe ‘kọlù’ ń tọ́ka sí láti mú gbólóhùn Yorùbá péye, bí ó tilẹ̀ jẹ́ pé a kò sọ object náà ní gbangba nínú Gíríìkì.
