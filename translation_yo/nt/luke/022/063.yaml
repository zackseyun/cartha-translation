  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: yo
  text: Àwọn ọkùnrin tí wọ́n ń dì í mú sì ń fi í ṣe ẹlẹ́yà bí wọ́n ṣe ń lù ú.[a]
  philosophy: optimal-equivalence
  footnotes:
