    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn Yorùbá tó bá καί mu láìfi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: οἱ ἄνδρες
  choice: àwọn ọkùnrin
  rationale: Gíríìkì sọ “àwọn ọkùnrin” ní pàtó; a kò sọ ọ́ di “àwọn olùṣọ́” tàbí “àwọn ọmọ ogun,” nítorí ìyẹn yóò dín ìtumọ̀ ọ̀rọ̀ náà kù sí ohun tí àyíká nìkan lè tọ́ka sí.
- source_word: οἱ συνέχοντες αὐτόν
  choice: tí wọ́n ń dì í mú
  rationale: Àṣàyàn yìí fi hàn pé wọ́n ń dá a dúró, wọ́n sì ń mú un wà lábẹ́ àkóso wọn, ó sì pa ìtumọ̀ ti ara ti συνέχω mọ́ láìsọ pé ó jẹ́ ìfiṣọ́wọ́ sí ẹ̀wọ̀n lọ́nà òfin.
- source_word: ἐνέπαιζον αὐτῷ
  choice: fi í ṣe ẹlẹ́yà
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí fífi ẹnì kan ṣe yẹ̀yẹ́ tàbí ìfi ẹ̀gàn hàn sí i, ó sì bá ìwà ọ̀tá inú ἐμπαίζω mu.
- source_word: δέροντες
  choice: wọ́n sì ń lù ú
  rationale: Àmì “ń” pa ìṣe tó ń lọ lọ́wọ́ mọ́, “lù” sì ṣàfihàn fífi ìlù ara ṣe é láìsọ ọ́ di fífi pàṣán nà, èyí tí Gíríìkì kò sọ ní pàtó.
theological_decisions:
- issue: Ta ni àwọn tó ń ṣe Jésù ní ibi?
  choice: àwọn ọkùnrin tí wọ́n ń dì í mú
  alternative: àwọn olùṣọ́ tí wọ́n ń ṣọ́ ọ
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ lo ἄνδρες, “àwọn ọkùnrin.” Bó tilẹ̀ jẹ́ pé àyíká fi hàn pé àwọn tó ń ṣọ́ ọ ni, ìtumọ̀ kò gbọ́dọ̀ sọ ìdánimọ̀ wọn di pàtó ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá àkànṣe, pẹ̀lú àmì ohùn níbi tó bá yẹ. Èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “dì í mú” fún ìṣọ́wọ́ ara, “fi í ṣe ẹlẹ́yà” fún ẹ̀gàn, àti “ń lù ú” láti pa ìṣe alábàáṣiṣẹ́ tó ń lọ lọ́wọ́ mọ́.
