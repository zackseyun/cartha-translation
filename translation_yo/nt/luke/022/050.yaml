id: LUK.22.50
reference: Luke 22:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: yo
  text: Ọ̀kan nínú wọn sì kọlù ẹrú olórí àlùfáà, ó sì gé etí ọ̀tún rẹ̀ kúrò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìránṣẹ́ olórí àlùfáà.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí ẹrú tàbí ìránṣẹ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: kọlu
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi agbára lu ẹnì kan; “kọlu” jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere, tí kò sì dín líle ìṣe náà kù.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: ọ̀kan nínú wọn
  rationale: Ó pa ìtumọ̀ àìsọ ẹni náà ní pàtó mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: ẹrú olórí àlùfáà
  rationale: δοῦλος níbí jẹ́ ipò ẹni tí ó wà lábẹ́ àṣẹ olórí àlùfáà. “Ẹrú” pa ipò ìdè àti ìṣàkóso tó wà nínú ọ̀rọ̀ Gíríìkì mọ́ ju “ìránṣẹ́” lọ.
- source_word: ἀφεῖλεν
  choice: gé ... kúrò
  rationale: Nínú àyíká ìpalára yìí, gbólóhùn náà fi hàn pé a gé etí náà kúrò, kì í ṣe pé a kàn mú un kúrò.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: etí ọ̀tún rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé, ó sì pa ẹ̀kúnrẹ́rẹ́ pé etí ọ̀tún ni mọ́.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú ẹsẹ yìí, δοῦλος ń tọ́ka sí ipò àwùjọ gidi lábẹ́ ìdè àti àṣẹ. “Ẹrú” ni a lò nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a fi “ìránṣẹ́” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tí ó ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì pa ìtẹ̀síwájú ìṣe méjèèjì mọ́ pẹ̀lú “sì” àti “ó sì.”
