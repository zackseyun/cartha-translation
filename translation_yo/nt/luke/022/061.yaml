id: LUK.22.61
reference: Luke 22:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: yo
  text: Olúwa sì yíjú, ó sì tẹjú mọ́ Pétérù[a]. Pétérù sì rántí ọ̀rọ̀ Olúwa, bí ó ti sọ fún un pé, “Kí àkùkọ tó kọ lónìí, ìwọ yóò sẹ́ mi lẹ́ẹ̀mẹ́ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó wò Pétérù tààrà”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwo ẹnì kan fínnífínní tàbí tẹ́jú mọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: yíjú
  rationale: Ọ̀rọ̀ yìí fi hàn pé Olúwa kọ́kọ́ yí sí ọ̀dọ̀ Pétérù kí ó tó wò ó; “yíjú” jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà ní Yorùbá.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” pa ipò-orúkọ tí a lò fún Jésù mọ́, ó sì bá lílò rẹ̀ nínú Májẹ̀mú Tuntun mu láì dín agbára rẹ̀ kù.
- source_word: ἐνέβλεψεν
  choice: tẹjú mọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwo ẹnì kan tààrà tàbí fínnífínní. “Tẹjú mọ́” sọ ìwò tààrà náà ní Yorùbá àdánidá, láì fi ìtumọ̀ ẹ̀dùn ọkàn tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: ὑπεμνήσθη
  choice: rántí
  rationale: Bó tilẹ̀ jẹ́ pé fọ́ọ̀mù náà lè ní ìmọ̀ pé a mú un rántí, ohun pàtàkì nínú àyíká ọ̀rọ̀ ni pé ọ̀rọ̀ Olúwa padà sí ìrántí Pétérù; “rántí” ni èdè Yorùbá tó ṣe kedere jù.
- source_word: λόγου
  choice: ọ̀rọ̀
  rationale: Níhìn-ín, λόγος tọ́ka sí ohun pàtó tí Olúwa sọ; “ọ̀rọ̀ Olúwa” jẹ́ gbolohun tó bójú mu, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: ὡς
  choice: bí ó ti
  rationale: Níhìn-ín ὡς ṣàlàyé ohun tí Pétérù rántí, ìyẹn bí Olúwa ti sọ ọ́ fún un; “bí ó ti” mú ìbáṣepọ̀ yìí jáde lọ́nà àdánidá.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Kí àkùkọ tó kọ
  rationale: πρίν pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ṣàfihàn ohun tí yóò kọ́kọ́ ṣẹlẹ̀. Àìsí àrítíkù pẹ̀lú ἀλέκτορα bá “àkùkọ” mu, Yorùbá kò sì nílò ọ̀rọ̀ atọ́ka mìíràn níhìn-ín.
- source_word: σήμερον
  choice: lónìí
  rationale: “Lónìí” ni ìtumọ̀ tààrà, tó sì pa kánjúkánjú àsọtẹ́lẹ̀ náà mọ́.
- source_word: ἀπαρνήσῃ
  choice: yóò sẹ́ mi
  rationale: “Sẹ́ mi” sọ ìkọ̀ tàbí ìṣàìjẹ́wọ́ ìbáṣepọ̀ pẹ̀lú Jésù, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó péye fún àyíká ìtàn ìjìyà náà.
- source_word: τρίς
  choice: lẹ́ẹ̀mẹ́ta
  rationale: “Lẹ́ẹ̀mẹ́ta” jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere láti sọ “ìgbà mẹ́ta.”
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ipò-orúkọ Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìwọ̀n ìtàn àti ìtumọ̀ nípa ẹni tí Jésù jẹ́ mọ́. “Ọ̀gá” lè dín ọ̀rọ̀ náà sí ipò olùkọ́ tàbí ẹni tó ga lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní ọlá ni a lò. A yan “tẹjú mọ́” láti pa agbára ἐμβλέπω mọ́, ṣùgbọ́n àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
