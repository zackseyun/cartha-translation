id: LUK.22.16
reference: Luke 22:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé, dájúdájú, èmi kì yóò jẹ ẹ́ títí di ìgbà tí yóò fi ní ìmúṣẹ nínú ìjọba Ọlọ́run[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi kì yóò tún jẹ ẹ́ láéláé títí yóò fi ní ìmúṣẹ nínú ìjọba Ọlọ́run.” Ọ̀rọ̀ Gíríìkì tẹnu mọ́ ìkọ̀ nípa jíjẹ ní ọjọ́ iwájú; àwọn ìtumọ̀ kan fi “tún” hàn nítorí àyíká ọ̀rọ̀, ṣùgbọ́n ọ̀rọ̀ náà kò sí ní tààrà nínú Gíríìkì.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ́” tọ́ka sí Ìrékọjá tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: “Mo sọ fún yín” jẹ́ ọ̀nà àdánidá láti túmọ̀ ọ̀rọ̀ ìṣáájú yìí; “Nítorí” pa ìsopọ̀ àlàyé γάρ mọ́ ẹsẹ tó ṣáájú.
- source_word: οὐ μὴ φάγω
  choice: dájúdájú, èmi kì yóò jẹ ẹ́
  rationale: οὐ μή pẹ̀lú aorist subjunctive jẹ́ ìkọ̀ tí ó lágbára nípa ohun ọjọ́ iwájú. “Dájúdájú” àti fífi “èmi” hàn mú agbára ìkọ̀ náà jáde ní Yorùbá òde òní.
- source_word: αὐτό
  choice: ẹ́
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Ìrékọjá tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; “ẹ́” pa ìsọ̀rọ̀ Gíríìkì mọ́ láì fi ọ̀rọ̀ àlàyé kún un nínú ẹsẹ náà.
- source_word: ἕως ὅτου
  choice: títí yóò fi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ààlà àkókò tí gbólóhùn Gíríìkì náà ń tọ́ka sí.
- source_word: πληρωθῇ
  choice: ní ìmúṣẹ
  rationale: Ìtumọ̀ yìí pa èrò ìmúṣẹ tàbí ìparí ohun tí a pinnu mọ́, pẹ̀lú ìró ìtàn ìgbàlà tí ọ̀rọ̀ náà lè ní.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: nínú ìjọba Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” jẹ́ gbólóhùn Bíbélì tí ó mọ́gbọ́n dání, ó sì pa àwọn èrò ìṣàkóso àti ilẹ̀ ìjọba mọ́.
theological_decisions:
- issue: Ohun tí αὐτό (“ẹ́”) ń tọ́ka sí
  choice: Arọ́pò-orúkọ náà tọ́ka sí Ìrékọjá tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ní ẹsẹ tó ṣáájú.
  alternative: Ó lè tọ́ka sí ayẹyẹ tàbí ìṣẹ̀lẹ̀ Ìrékọjá ní ìtumọ̀ tó gbòòrò.
  rationale: Fífi “ẹ́” sílẹ̀ gẹ́gẹ́ bí arọ́pò-orúkọ pa ìkójọpọ̀ ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìtumọ̀ tóóró kan lé e lórí.
- issue: Ìtumọ̀ “ní ìmúṣẹ nínú ìjọba Ọlọ́run”
  choice: A pa èdè ìmúṣẹ ọjọ́ iwájú mọ́ láì sọ pàtó bí Ìrékọjá yóò ṣe ní ìmúṣẹ.
  alternative: A lè ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìmúṣẹ nípasẹ̀ dídé ìjọba Ọlọ́run tàbí níbi àsè Mèsáyà.
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí ìmúṣẹ ọjọ́ iwájú, ṣùgbọ́n kò sọ ìṣẹ̀lẹ̀ tàbí ọ̀nà pàtó; nítorí náà a pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Dájúdájú, èmi kì yóò” ń gbé ìkọ̀ líle οὐ μή jáde láì lo èdè àtijọ́; a sì pa ìtumọ̀ ọjọ́ iwájú àti àìsọ pàtó nípa irú ìmúṣẹ náà mọ́.
