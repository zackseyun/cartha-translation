translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye ni a lò. A yan ‘ọmọbìnrin ìránṣẹ́’ dípò ‘ẹrúbìnrin’ nítorí àyíká náà kò tẹnu mọ́ ipò ìdè rẹ̀. Àmì ẹsẹ̀ [a] wà lẹ́yìn gbólóhùn tí àlàyé rẹ̀ kàn.
