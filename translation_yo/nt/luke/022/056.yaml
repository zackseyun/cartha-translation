id: LUK.22.56
reference: Luke 22:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: yo
  text: Nígbà náà, ọmọbìnrin ìránṣẹ́ kan rí i bí ó ti jókòó lẹ́gbẹ̀ẹ́ ìmọ́lẹ̀,[a] ó sì tẹjú mọ́ ọn, ó ní, “Ọkùnrin yìí náà wà pẹ̀lú rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ìmọ́lẹ̀.” Gbólóhùn Gíríìkì náà lè tọ́ka sí jíjókòó nítòsí orísun ìmọ́lẹ̀, ó sì tún lè túmọ̀ sí wíwà ní ibi tí ìmọ́lẹ̀ dé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: rí i
  rationale: Aorist participle ὁράω ń sọ nípa bí ọmọbìnrin náà ṣe ṣàkíyèsí Pétérù; ‘rí i’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá nínú ìtàn.
- source_word: δὲ
  choice: Nígbà náà
  rationale: δέ ń tẹ ìtàn náà síwájú níbí, kò sì fi ìtakora líle hàn.
- source_word: παιδίσκη τις
  choice: ọmọbìnrin ìránṣẹ́ kan
  rationale: παιδίσκη túmọ̀ sí ọ̀dọ́bìnrin tó jẹ́ ìránṣẹ́ tàbí ẹrú; àyíká ẹsẹ̀ yìí kò tẹnu mọ́ ipò ẹrú rẹ̀, nígbà tí τις sì jẹ́ kí ẹni náà wà láìjẹ́ ẹni pàtó.
- source_word: καθήμενον
  choice: bí ó ti jókòó
  rationale: Ó ṣàpèjúwe ipò Pétérù nígbà tí ọmọbìnrin náà rí i, ó sì bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: πρὸς τὸ φῶς
  choice: lẹ́gbẹ̀ẹ́ ìmọ́lẹ̀
  rationale: πρός pẹ̀lú accusative níbí lè tọ́ka sí ipò nítòsí orísun ìmọ́lẹ̀ tàbí ní agbègbè tí ìmọ́lẹ̀ dé; ‘lẹ́gbẹ̀ẹ́ ìmọ́lẹ̀’ pa ìtumọ̀ ipò náà mọ́ láìfi ‘iná’ tí kò sí nínú gbólóhùn kún un.
- source_word: ἀτενίσασα αὐτῷ
  choice: tẹjú mọ́ ọn
  rationale: ἀτενίζω ń fi wíwo ẹni pẹ̀lú àfiyèsí gidigidi hàn; ‘tẹjú mọ́ ọn’ jẹ́ gbolohun Yorùbá tó ṣe kedere, tí kò sì rọ̀ jù.
- source_word: Καὶ οὗτος
  choice: Ọkùnrin yìí náà
  rationale: οὗτος jẹ́ ọ̀rọ̀ atọ́ka tó ń dá ẹni náà mọ̀, καί sì ní ìtumọ̀ ‘náà’ níbí.
- source_word: σὺν αὐτῷ ἦν
  choice: wà pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ tààrà fún ìbáṣepọ̀ tàbí jíjẹ́ alábàákẹ́gbẹ́ ni, láìfi àlàyé mìíràn kún un.
