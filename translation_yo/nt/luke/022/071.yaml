source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: yo
  text: Nígbà náà, wọ́n wí pé,[a] “Kí ni a tún nílò ẹ̀rí fún? Nítorí àwa fúnra wa ti gbọ́ ọ láti ẹnu rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èé ṣe tí a fi ṣì nílò ẹ̀rí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Nígbà náà ni wọ́n wí pé
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn síwájú; ‘Nígbà náà’ fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn láìfi ìtakò tí kò sí sínú ọ̀rọ̀ náà.
- source_word: Τί ἔτι
  choice: Èé ṣe tí a fi ṣì
  rationale: Nínú ìbéèrè àròsọ yìí, gbolohun náà túmọ̀ sí ‘kí ló dé tí ... ṣì’; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ἔτι mọ́.
- source_word: ἔχομεν μαρτυρίας χρείαν
  choice: nílò ẹ̀rí
  rationale: χρείαν ἔχειν túmọ̀ sí ‘nílò,’ μαρτυρία sì tọ́ka sí ẹ̀rí tàbí ọ̀rọ̀ ẹlẹ́rìí nínú ọ̀rọ̀ ìdájọ́. ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: αὐτοὶ γὰρ
  choice: Nítorí àwa fúnra wa
  rationale: ‘Àwa fúnra wa’ pa ìtẹnumọ́ αὐτοὶ mọ́, pé àwọn fúnra wọn ni wọ́n gbọ́ ọ̀rọ̀ náà.
- source_word: ἠκούσαμεν
  choice: ti gbọ́ ọ
  rationale: Àkókò pípé Yorùbá ‘ti gbọ́’ fi hàn pé ohun tí wọ́n ṣẹ̀ṣẹ̀ gbọ́ ní àbájáde tó wúlò fún ìpinnu wọn báyìí; ‘ọ’ jẹ́ arọ́pò ohun tí wọ́n gbọ́ láìṣàlàyé rẹ̀ sí i.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: láti ẹnu rẹ̀ fúnra rẹ̀
  rationale: Èyí pa àwòrán ‘láti ẹnu rẹ̀’ àti ìtẹnumọ́ pé ọ̀rọ̀ náà jáde lọ́dọ̀ Jesu fúnra rẹ̀ mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí wọ́n gbọ́ ní pàtó gẹ́gẹ́ bí ẹ̀rí tàbí ọ̀rọ̀ tí Jesu fi dá ara rẹ̀ lẹ́bi
  choice: 'A fi ohun tí wọ́n gbọ́ sílẹ̀ láìsọ irú rẹ̀ ní pàtó: ‘àwa fúnra wa ti gbọ́ ọ láti ẹnu rẹ̀ fúnra rẹ̀.’'
  alternative: ‘àwa fúnra wa ti gbọ́ ẹ̀rí náà láti ẹnu rẹ̀’ tàbí ‘a ti gbọ́ ohun tí ó sọ nípa ara rẹ̀.’
  rationale: Gíríìkì kò fi àfikún ohun kan sí ἠκούσαμεν. Sísọ pé ‘ẹ̀rí’ tàbí ‘ẹ̀sùn’ ni wọ́n gbọ́ yóò túmọ̀ ohun tí ọ̀rọ̀ náà kò sọ ní gbangba, nítorí náà a pa àìsọ pàtó àti agbára ọ̀rọ̀ ìdájọ́ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Wí pé’ bá ìforúkọsílẹ̀ Bíbélì mu, ṣùgbọ́n gbogbo gbolohun náà ṣì ṣe kedere fún òǹkàwé lásán; ‘ẹ̀rí’ sì bá àyíká ìdájọ́ mu.
