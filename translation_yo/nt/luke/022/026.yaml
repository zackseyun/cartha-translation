  to: Ṣùgbọ́n kò gbọdọ̀ rí bẹ́ẹ̀ láàárín yín.[a] Kàkà bẹ́ẹ̀, kí ẹni tí ó ga ní ipò láàárín yín di bí ẹni tí ó kéré ní ọjọ́ orí,[b] kí ẹni tí ń darí sì di bí ẹni tí ń sin.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ iye ‘pọ̀jù’ pẹ̀lú ọ̀rọ̀ ipò ‘ga ní ipò,’ ó sì dá νεώτερος padà sí ìtumọ̀ rẹ̀ gangan nínú ẹsẹ̀ pàtàkì. A pa àlàyé nípa ìfẹ̀hónúhàn awùjọ mọ́ nínú àlàyé ìsàlẹ̀, kí ìtumọ̀ má bà a ṣe sọ ohun tí orísun kò sọ ní tààrà. ‘Di’ tún pa ìtumọ̀ γινέσθω (‘become’) mọ́ ju ‘dà bí’ lọ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:09Z'
