id: LUK.22.26
reference: Luke 22:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: yo
  text: Ṣùgbọ́n kò gbọdọ̀ rí bẹ́ẹ̀ láàárín yín.[a] Kàkà bẹ́ẹ̀, kí ẹni tí ó ga ní ipò láàárín yín di bí ẹni tí ó kéré ní ọjọ́ orí,[b] kí ẹni tí ń darí sì di bí ẹni tí ń sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n kì í ṣe bẹ́ẹ̀ láàárín yín.” Gbólóhùn Gíríìkì náà kuru, ó sì fi àwọn ọmọ-ẹ̀yìn Jésù yà sọ́tọ̀ gidigidi sí ìlò àṣẹ àwọn alákòóso tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
    reason: alternative_reading
  - marker: b
    text: Ní gígán, “ẹni tí ó kéré ní ọjọ́ orí.” Ní àṣà ìgbà náà, ẹni tí ó kéré ní ọjọ́ orí sábà máa ń ní ipò awùjọ tó rẹlẹ̀; nítorí náà, àfiwé náà kò dá lórí ọjọ́ orí nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Ṣùgbọ́n kí ó má ṣe rí bẹ́ẹ̀ láàárín yín
  rationale: Ó pa ìyàtọ̀ líle mọ́ láàárín àwọn ọmọ-ẹ̀yìn Jésù àti ìwà fífẹ́ ipò tí ẹsẹ tó ṣáájú ṣàpèjúwe, ó sì fi àṣẹ tí gbólóhùn Gíríìkì náà fi sílẹ̀ nítorí àkópọ̀ ọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: ἀλλ’
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyípadà alágbára sí ìtọ́ni rere Jésù hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: ẹni tí ó pọ̀jù láàárín yín
  rationale: Ọ̀rọ̀ náà jẹ́ afiwéra, ó sì tọ́ka sí ẹni tí a kà sí ẹni gíga tàbí pàtàkì jù láàárín àwùjọ, kì í ṣe dandan ẹni tí ó tóbi jù lọ pátápátá.
- source_word: γινέσθω
  choice: kí ... dà bí
  rationale: Ìṣètò yìí mú agbára àṣẹ àti ìpè sí gbígba ìwà tàbí ipò tuntun jáde ní Yorùbá tó rọrùn, láì sọ ọ́ di àlàyé pẹ̀lú.
- source_word: ὡς ὁ νεώτερος
  choice: dà bí ẹni tí ó kéré ní ipò
  rationale: νεώτερος lè túmọ̀ sí ẹni kékeré ní ọjọ́ orí, ṣùgbọ́n nínú àṣà ọ̀rọ̀ yìí ó tún ní ìtumọ̀ ẹni tí ipò rẹ̀ kéré; a mú ìtumọ̀ awùjọ náà hàn, a sì tọ́ka sí ààyè ìtumọ̀ gangan nínú àlàyé ìsàlẹ̀.
- source_word: ὁ ἡγούμενος
  choice: ẹni tí ń ṣe olórí
  rationale: Ó pa ìṣe aṣáájú mọ́ láì fi èrò nípa ipò ìjọ tàbí agbára ìṣèlú tí ọ̀rọ̀ náà kò fi dandan sílẹ̀ kún un.
- source_word: ὡς ὁ διακονῶν
  choice: dà bí ẹni tí ń ṣe ìránṣẹ́
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́—sísìn àwọn ẹlòmíràn—mọ́, dípò yíyí ọ̀rọ̀ náà sí oyè tàbí ipò àjọ kan.
theological_decisions:
- issue: Irú ìtọ́ni Jésù nípa ipò àti aṣáájú
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìyípadà ìlànà ipò láàárín àwọn ọmọ-ẹ̀yìn, níbi tí ẹni gíga àti aṣáájú ti gbọ́dọ̀ gba ìwà ẹni kékeré àti ti olùránṣẹ́.
  alternative: Lílo èdè tó túbọ̀ fi ipò àṣẹ tàbí ọ́fíìsì ìjọ múlẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fi ‘ẹni tí ó pọ̀jù’ àti ‘ẹni tí ń ṣe olórí’ wé ẹni kékeré àti ẹni tí ń ṣe ìránṣẹ́. Ìtumọ̀ náà pa ìpè sí ìrẹ̀lẹ̀ àti iṣẹ́ ìsìn mọ́ láì gbé ètò ìjọ ti àkókò tó tẹ̀ lé e wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ṣe olórí” fún aṣáájú láì sọ ọ́ di oyè àjọ, àti “ṣe ìránṣẹ́” láti tẹnu mọ́ iṣẹ́ sísìn. Gbogbo àmì ohùn àti àmì ìsàlẹ̀ ni a fi sí ibi tí ó yẹ.
