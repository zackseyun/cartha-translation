  verdict: revise
  source_fidelity: Ìtumọ̀ ìbẹ̀rẹ̀ àti àṣẹ ‘kí ... di’ mú ìyàtọ̀ àti agbára ìtọ́ni Gíríìkì náà hàn dáadáa. Ṣùgbọ́n ‘ẹni tí ó pọ̀jù’ ń tọ́ka sí iye púpọ̀ dípò ipò gíga, nítorí náà kò bá ὁ μείζων mu dáadáa. ‘Ẹni tí ó kéré ní ipò’ sì ti mú ìtumọ̀ awùjọ kan wọ inú ọ̀rọ̀ pàtàkì, níbi tí νεώτερος ti jẹ́ ‘ẹni tí ó kéré ní ọjọ́ orí’ ní ìtumọ̀ gangan.
  naturalness: 'A tún ọ̀rọ̀ náà ṣe sí Yorùbá boṣewa tó dára: ‘ẹni tí ó ga ní ipò’ fún ẹni tí a kà sí ẹni gíga, ‘di’ fún γινέσθω, àti ‘ẹni tí ń darí’ fún ẹni tí ń ṣe aṣáájú. Èdè náà wà ní ìforúkọsílẹ̀ ọlọ́lá ṣugbọn ó rọrùn fún òǹkàwé òde òní.'
  terminology: ‘Ẹni tí ó ga ní ipò’ yẹ fún μείζων nínú àyíká ìpò awùjọ yìí, láì yi afiwéra náà di ọ̀rọ̀ ògo-jùlọ. ‘Ẹni tí ó kéré ní ọjọ́ orí’ pa νεώτερος mọ́ ní ìtumọ̀ gangan; àlàyé ìsàlẹ̀ ṣàlàyé ìfẹ̀hónúhàn rẹ̀ nípa ipò awùjọ. ‘Ẹni tí ń sin’ mú διακονῶν gẹ́gẹ́ bí iṣẹ́ sísìn, kì í ṣe oyè ìjọ, hàn.
