id: LUK.22.54
reference: Luke 22:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti mú un, wọ́n darí rẹ̀ lọ, wọ́n sì mú un wọ inú ilé olórí àlùfáà; ṣùgbọ́n Pétérù ń tọ̀ ọ́ lẹ́yìn ní òkèèrè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ibi jíjìn,” tàbí, ní ọ̀nà ìbílẹ̀, “ní ọ̀nà jíjìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Lẹ́yìn tí wọ́n mú un
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú àwọn ọ̀rọ̀-ìṣe pàtàkì hàn. “Mú un” bá ọ̀rọ̀ àtìmọ́lé mu, “Lẹ́yìn tí” sì mú ìbátan àkókò náà ṣe kedere ní Yorùbá àdánidá.
- source_word: ἤγαγον
  choice: wọ́n fà á lọ
  rationale: ἄγω túmọ̀ sí dídarí tàbí mímú ẹnì kan lọ. “Fà á lọ” fi hàn pé ó wà lábẹ́ agbára àwọn tó mú un, ó sì yàtọ̀ sí ọ̀rọ̀ tó tẹ̀ lé e nípa wíwọ inú ilé.
- source_word: εἰσήγαγον
  choice: wọ́n sì mú un wọ inú
  rationale: εἰσάγω ní agbára ìtọ́sọ́nà sí inú ibi kan. “Mú un wọ inú” pa ìtumọ̀ yẹn mọ́ ní Yorùbá tó ṣe kedere.
- source_word: οἰκίαν
  choice: ilé
  rationale: Ní àyíká yìí, οἰκία ń tọ́ka sí ilé gẹ́gẹ́ bí ibi, kì í ṣe gbogbo agbo ilé tàbí ìdílé.
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún oyè ἀρχιερεύς nínú Májẹ̀mú Tuntun.
- source_word: ἠκολούθει
  choice: ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò imperfect fi ìṣe tí ń bá a lọ nígbà náà hàn; àmì “ń” pa ìrísí ìṣe tó ń tẹ̀ síwájú mọ́.
- source_word: μακρόθεν
  choice: láti òkèèrè
  rationale: Ọ̀rọ̀ adverb yìí ń tọ́ka sí àlàfo ibi. “Láti òkèèrè” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́ láì fi ìdí ọkàn Pétérù kún un.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: δὲ kejì fi ìyàtọ̀ kékeré hàn láàárín bí wọ́n ṣe mú Jésù wọ ilé àti bí Pétérù ṣe ń tọ̀ ọ́ lẹ́yìn ní ọ̀nà jíjìn.
theological_decisions:
- issue: Àpèjúwe ìbáṣepọ̀ Pétérù pẹ̀lú Jésù nígbà ìmúṣẹ̀
  choice: “ń tọ̀ ọ́ lẹ́yìn láti òkèèrè” ni a lò láì fi ìdájọ́ nípa ìdí ọkàn Pétérù kún un.
  alternative: A lè sọ pé ó ń tọ̀ ọ́ lẹ́yìn ní ìkọ̀kọ̀ tàbí nítorí ìbẹ̀rù.
  rationale: Ẹsẹ̀ náà sọ nípa ibi tí Pétérù wà àti ìṣe tó ń ṣe, ṣùgbọ́n kò túmọ̀ ìdí ọkàn rẹ̀ ní tààrà. Ìtumọ̀ náà pa ìfàsẹ́yìn inú ìtàn mọ́ láì fi àlàyé ọkàn kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtẹ̀síwájú “ń tọ̀ ọ́ lẹ́yìn” jẹ́ kó ṣeé gbọ́ ní ti àdánidá, ó sì pa aspect imperfect mọ́.
