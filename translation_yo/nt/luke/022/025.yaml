id: LUK.22.25
reference: Luke 22:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Àwọn ọba àwọn tí kì í ṣe Júù[a] ń jẹ gàba lórí wọn, àwọn tí ń lo àṣẹ lórí wọn sì ni wọ́n ń pè ní ‘Olóore.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: “Olóore” jẹ́ oyè ọlá tí wọ́n máa ń fi fún àwọn alákòóso tàbí àwọn ọlọ́lá alágbára tí a kà sí ẹni tí ń ṣe rere fún gbogbo ènìyàn.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: àwọn ọba
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ọba ní pàtó, kì í ṣe àwọn olórí lápapọ̀.
- source_word: τῶν ἐθνῶν
  choice: àwọn tí kì í ṣe Júù
  rationale: Nínú ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ἔθνη ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘àwọn orílẹ̀-èdè’ sílẹ̀ gẹ́gẹ́ bí ohun mìíràn tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí.
- source_word: κυριεύουσιν
  choice: ń jẹ gaba lé wọn lórí
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé wọ́n ń lo agbára ìṣàkóso lórí àwọn ènìyàn, ó sì mú ìtumọ̀ líle tí ọ̀rọ̀ Gíríìkì ní nínú àfiwé Jésù jáde.
- source_word: ἐξουσιάζοντες
  choice: àwọn tí ń lo àṣẹ lórí wọn
  rationale: A ṣe é bí ọ̀rọ̀ ìṣe láti pa èrò pé wọ́n ń fi àṣẹ ṣiṣẹ́ mọ́, dípò pé wọ́n wà ní ipò àṣẹ lásán.
- source_word: εὐεργέται
  choice: Olóore
  rationale: ‘Olóore’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ń ṣe rere fún ẹlòmíràn; àmì ọ̀rọ̀ àti lẹ́tà ńlá fi hàn pé oyè ọlá ni ó jẹ́ níbí.
- source_word: καλοῦνται
  choice: ni wọ́n ń pè ní
  rationale: Èyí sọ ìṣe aláìlẹ́ni-dárúkọ inú ọ̀rọ̀ Gíríìkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ọ̀rọ̀ Jésù àti àríyànjiyàn àwọn ọmọ-ẹ̀yìn tó ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν nínú àyíká ọ̀rọ̀
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè
  rationale: Ìtumọ̀ àkọ́kọ́ bá lílo ọ̀rọ̀ náà nínú Lúùkù–Ìṣe àti àfiwé pẹ̀lú ìṣàkóso àwọn ènìyàn òde mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro ‘àwọn orílẹ̀-èdè’ mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣeé yé fún òǹkàwé òde òní. ‘Ń jẹ gaba lé wọn lórí’ mú agbára ìṣàkóso tí κυριεύουσιν ní jáde; ‘Olóore’ sì dúró gẹ́gẹ́ bí oyè ọlá, pẹ̀lú àlàyé àṣà ní ìsàlẹ̀.
