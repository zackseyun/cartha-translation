  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ pé, “Mo sọ fún ọ, Pétérù, àkùkọ kì yóò kọ lónìí títí tí ìwọ ó fi sẹ́ lẹ́ẹ̀mẹ́ta pé o mọ̀ mí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àkùkọ kì yóò kọ lónìí kí o tó sẹ́ lẹ́ẹ̀mẹ́ta pé o mọ̀ mí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ṣùgbọ́n ó sọ pé
  rationale: Ṣùgbọ́n fi ìyàtọ̀ díẹ̀ tí δέ ní hàn nínú ìfọ̀rọ̀wérọ̀ náà, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú èdè Yorùbá.
- source_word: Λέγω σοι
  choice: Mo sọ fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ọ̀rọ̀ tààrà λέγω mọ́.
- source_word: Πέτρε
  choice: Pétérù
  rationale: A kọ orúkọ náà ní ìrísí tí ó ti wọ́pọ̀ nínú èdè Yorùbá.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: àkùkọ kì yóò kọ lónìí
  rationale: Pẹ̀lú ἀλέκτωρ gẹ́gẹ́ bí olùṣe, φωνήσει túmọ̀ sí kí àkùkọ kọ; àkùkọ láìsí atọ́ka pàtó tún bá àìní àpilẹ̀kọ nínú Gíríìkì mu.
- source_word: ἕως
  choice: títí ... fi
  rationale: Ìṣètò Yorùbá yìí fi ààlà àkókò tí ἕως ń tọ́ka sí hàn lẹ́yìn gbólóhùn òdì.
- source_word: τρίς
  choice: ní ẹ̀ẹ̀mẹ́ta
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tó ṣe kedere fún ‘ìgbà mẹ́ta.’
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: sẹ́ ... pé o mọ̀ mí
  rationale: 'Àpólà náà sọ ohun tí Pétérù yóò sẹ́ ní pàtó: pé òun mọ Jésù. Ìtumọ̀ yìí kò dín un kù sí sísẹ́ Jésù lásán.'
theological_decisions:
- issue: Irú ìsẹ́ tí a sọ tẹ́lẹ̀ pé Pétérù yóò ṣe
  choice: sẹ́ ní ẹ̀ẹ̀mẹ́ta pé o mọ̀ mí
  alternative: sẹ́ mi ní ẹ̀ẹ̀mẹ́ta
  rationale: εἰδέναι wà nínú ọ̀rọ̀ Gíríìkì, ó sì yẹ kí ìtumọ̀ fi hàn pé Pétérù yóò sẹ́ pé òun mọ Jésù, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìṣètò àsọtẹ́lẹ̀ náà mọ́ láìṣàlàyé rẹ̀ kọjá ohun tí orísun Gíríìkì sọ.
