source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: yo
  text: Nígbà náà ni Satani wọ inú Júdásì, ẹni tí a ń pè ní Iskariotu, ẹni tí ó jẹ́ ọ̀kan lára àwọn méjìlá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹni tí ó wà nínú iye àwọn méjìlá”; ó tún lè jẹ́, “ọ̀kan lára àwọn méjìlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Nígbà náà ni ... wọ
  rationale: δέ ń tẹ ìtàn náà síwájú, a sì lo “nígbà náà” fún ìṣàn èdè Yorùbá; “wọ” pẹ̀lú “inú” fi agbára εἰσῆλθεν ... εἰς hàn.
- source_word: Σατανᾶς
  choice: Satani
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí ó sì ṣe kedere nínú Yorùbá.
- source_word: εἰς Ἰούδαν
  choice: inú Júdásì
  rationale: “Wọ inú Júdásì” ṣàfihàn εἰς ní tààràtà, kò sì sọ ọ́ di pé Satani kàn ní ipa lórí rẹ̀.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: ẹni tí a ń pè ní Isikariotu
  rationale: Ó túmọ̀ participle adjectival náà ní èdè Yorùbá àdánidá, ó sì dá Júdásì yìí mọ̀ nípa orúkọ Isikariotu.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: tí ó sì wà lára àwọn méjìlá
  rationale: “Wà lára” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ó jẹ́ ọ̀kan nínú ẹgbẹ́ tí a kà sí méjìlá, láìfi gbolohun líle tàbí àjèjì ṣe é.
theological_decisions:
- issue: Irú ìṣe Satani nínú Júdásì
  choice: “Satani wọ inú Júdásì”
  alternative: “Satani ní ipa lórí Júdásì” tàbí “Satani gba Júdásì”
  rationale: Gíríìkì lo εἰσῆλθεν ... εἰς, èyí tí ó sọ ìwọlé ní ọ̀nà líle. A pa ọ̀rọ̀ náà mọ́ láìṣàlàyé bóyá ó jẹ́ ohun tí ẹ̀kọ́ ìsìn kan máa pè ní ìnúnibíni ẹ̀mí, àti láìyọ ojúṣe ènìyàn kúrò.
- issue: Ìdánimọ̀ ẹgbẹ́ àwọn méjìlá
  choice: “àwọn méjìlá” ní lẹ́tà kékeré
  alternative: “Àwọn Méjìlá” gẹ́gẹ́ bí orúkọ ẹgbẹ́ pàtó
  rationale: Gíríìkì kò ní ìyàtọ̀ lẹ́tà ńlá àti kékeré ní irú ọ̀nà yìí; lẹ́tà kékeré pa àìdánilójú ara ìkọ̀wé mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn méjìlá tí a mọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Wọ inú” pa àwòrán líle ti orísun mọ́; “wà lára” sì yẹra fún ìtumọ̀ gangan tí yóò dun bí èdè àjèjì.
