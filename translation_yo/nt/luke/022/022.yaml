id: LUK.22.22
reference: Luke 22:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí ohun tí a ti pinnu, ṣùgbọ́n ègbé ni fún ọkùnrin náà tí a fi Ọmọ Ènìyàn lé lọ́wọ́ nípasẹ̀ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a fi Ọmọ Ènìyàn hàn nípasẹ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fi lé lọ́wọ́” tàbí “fi hàn,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀, ó sì bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà tí ó wọ́pọ̀, tí ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú àwọn ẹsẹ Ìwé Mímọ́ mìíràn.
- source_word: μέν … πλὴν
  choice: … ṣùgbọ́n
  rationale: Ní Yorùbá, ìyàtọ̀ tí àwọn ọ̀rọ̀ méjèèjì dá sílẹ̀ hàn kedere nípasẹ̀ ‘ṣùgbọ́n’; fífi ọ̀rọ̀ míì kún μέν yóò mú gbólóhùn náà wúwo láìṣe pàtàkì.
- source_word: κατὰ τὸ ὡρισμένον
  choice: gẹ́gẹ́ bí a ti pinnu rẹ̀
  rationale: Ó pa ìtumọ̀ ohun tí a ti pinnu tẹ́lẹ̀ àti ìṣe aláìlórúkọ inú èdè Gíríìkì mọ́, láìsọ ẹni tí ó pinnu rẹ̀ ní tààrà.
- source_word: πορεύεται
  choice: ń lọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ipa ọ̀nà tí Jésù ń gbà lọ sí ikú rẹ̀.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ègbé ni fún ọkùnrin náà
  rationale: Ó pa agbára ìkéde ìdájọ́ tàbí ẹkún àsọtẹ́lẹ̀ náà mọ́, ó sì tọ́ka sí ọkùnrin kan pàtó.
- source_word: δι’ οὗ
  choice: ẹni tí a tipasẹ̀ rẹ̀
  rationale: ‘Tipasẹ̀’ fi ìtumọ̀ agency tàbí ohun èlò tí διά pẹ̀lú genitive ní hàn.
- source_word: παραδίδοται
  choice: fi Ọmọ Ènìyàn hàn
  rationale: Nínú àyíká Júdásì, ‘fi … hàn’ sọ ìwà ọ̀dàlẹ̀ náà ní Yorùbá àdánidá; àfikún ‘Ọmọ Ènìyàn’ mú ẹni tí ọ̀rọ̀-arọ́pò-orúkọ náà tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ ète tí a ti pinnu pẹ̀lú ojúṣe ènìyàn
  choice: 'A pa méjèèjì mọ́: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti pinnu, síbẹ̀ ègbé wà fún ẹni tí ó fi í hàn.'
  alternative: Kí a rọ ìpinnu náà tàbí kí a dín ẹ̀bi ẹni tí ó fi í hàn kù.
  rationale: Èdè Gíríìkì fi ète tí a ti pinnu àti ojúṣe ẹni tí ó fi Jésù hàn sí ẹ̀gbẹ́ ara wọn; ìtumọ̀ kò gbọ́dọ̀ yanjú ìfàsíra yìí ní ojúrere ètò ẹ̀kọ́ ìgbàgbọ́ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo ènìyàn.
