revisions:
- from: Nítorí Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti pinnu rẹ̀, ṣùgbọ́n ègbé ni fún ọkùnrin náà, ẹni tí a tipasẹ̀ rẹ̀ fi Ọmọ Ènìyàn hàn.[a]
  to: Nítorí Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí ohun tí a ti pinnu, ṣùgbọ́n ègbé ni fún ọkùnrin náà tí a fi Ọmọ Ènìyàn lé lọ́wọ́ nípasẹ̀ rẹ̀.[a]
  rationale: Àtúnṣe náà ṣàtúnṣe ìkọ̀wé ‘nípasẹ̀,’ ó rọ́pò ọ̀rọ̀-arọ́pò ‘rẹ̀’ tí kò mọ́ ẹni tí ó ń tọ́ka sí pẹ̀lú ‘ohun tí a ti pinnu,’ ó sì fi ‘fi ... lé lọ́wọ́’ ṣe ìtumọ̀ àkọ́kọ́ fún παραδίδοται. Èyí pa passive Greek náà, ipa ‘through whom,’ àti ìyàtọ̀ láàárín ìpinnu tí a ti ṣe àti ẹ̀bi ènìyàn mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:05Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìyàtọ̀ tó wà láàárín ọ̀nà Ọmọ Ènìyàn tí a ti pinnu àti ìdájọ́ ẹni tí ó jẹ̀bi rẹ̀ hàn. Ṣùgbọ́n ‘gẹ́gẹ́ bí a ti pinnu rẹ̀’ lè jẹ́ aláìmọ́ ẹni tí ‘rẹ̀’ ń tọ́ka sí, ‘a tipasẹ̀ rẹ̀’ kò jẹ́ ìkọ̀wé Yorùbá tó tọ́, àti ‘fi ... hàn’ kì í jẹ́ ọ̀nà tó péye jù lọ láti ṣàfihàn παραδίδοται nínú ẹsẹ yìí.
  naturalness: Àtúnṣe náà lo Yorùbá boṣewa, ti òde òní, tó sì mọ́gbọ́n dání. ‘Tí a fi Ọmọ Ènìyàn lé lọ́wọ́ nípasẹ̀ rẹ̀’ pa ìṣe passive àti ‘through whom’ mọ́, bí ó tilẹ̀ jẹ́ pé a ṣàlàyé aṣàyàn ‘fi hàn’ nínú àlàyé ìsàlẹ̀.
  terminology: ‘Ọmọ Ènìyàn’ yẹ fún ὁ υἱὸς τοῦ ἀνθρώπου; ‘ègbé ni fún’ ń pa agbára οὐαί mọ́; ‘ohun tí a ti pinnu’ ń ṣàfihàn τὸ ὡρισμένον láìdárúkọ ẹni tí ó pinnu rẹ̀. ‘Fi ... lé lọ́wọ́’ dáa fún παραδίδοται, pẹ̀lú ‘fi hàn’ gẹ́gẹ́ bí aṣàyàn àlàyé.
  issues:
  - severity: medium
    issue: ‘gẹ́gẹ́ bí a ti pinnu rẹ̀’
    rationale: ‘Rẹ̀’ lè tọ́ka sí Ọmọ Ènìyàn dípò ‘ohun tí a ti pinnu’; gbolohun náà kò ṣàfihàn substantival neuter τὸ ὡρισμένον ní kedere.
  - severity: high
    issue: ‘ẹni tí a tipasẹ̀ rẹ̀’
    rationale: Ìṣọ̀kan ‘a tipasẹ̀’ kò tọ́ nínú Yorùbá, ó sì mú ìbáṣepọ̀ δι’ οὗ àti passive παραδίδοται ṣókùnfà ìdàrúdàpọ̀.
  - severity: medium
    issue: ‘fi Ọmọ Ènìyàn hàn’ gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́
    rationale: Ó lè túmọ̀ sí ìfihàn ẹni kan tàbí ìṣípayá rẹ̀, kì í sì fi ìtumọ̀ ‘hand over/deliver up’ ti παραδίδοται hàn ní kíkún. ‘Fi ... lé lọ́wọ́’ yẹ kó jẹ́ ìtumọ̀ àkọ́kọ́; ‘fi hàn’ lè wà gẹ́gẹ́ bí aṣàyàn nínú àlàyé ìsàlẹ̀.
