language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: yo
  text: 'Nítorí mo sọ fún yín pé, ohun tí a kọ yìí ní láti ṣẹ nínú mi: “A sì kà á mọ́ àwọn aláìlófin.”[a] Nítorí ohun tí ó kan mi ń dé ìparí.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtúmọ̀ ìbílẹ̀ ṣe sábà máa ń wí, “A sì kà á mọ́ àwọn arúfin” (Aísáyà 53:12).
    reason: alternative_reading
  - marker: b
    text: Tàbí “ohun tí ó kan mi ń dé ìmúṣẹ / ń parí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: “Mo sọ fún yín” jẹ́ ọ̀nà Yorùbá àdánidá fún λέγω ... ὑμῖν, “Nítorí” sì pa ìsopọ̀ àlàyé γάρ mọ́.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: ohun tí a kọ yìí
  rationale: Èyí pa àmì atọ́ka àti ìtumọ̀ ohun tí a ti kọ mọ́, láì fi ọ̀rọ̀ “Ìwé Mímọ́” kún ibi tí Gíríìkì kò ti sọ ọ́ ní tààrà.
- source_word: δεῖ τελεσθῆναι
  choice: ní láti ṣẹ
  rationale: “Ní láti” fi agbára dandan δεῖ hàn, “ṣẹ” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìmúṣẹ ohun tí a kọ tẹ́lẹ̀.
- source_word: ἐν ἐμοί
  choice: nínú mi
  rationale: Ìtumọ̀ yìí tẹ̀ lé ἐν ní pẹkipẹki, ó sì fi ààyè sílẹ̀ fún ìtumọ̀ pé ohun tí a kọ náà ṣẹ nínú ẹni Jesu àti nínú ohun tí yóò ṣẹlẹ̀ sí i.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: A sì kà á mọ́ àwọn aláìgbọ́ràn sí òfin
  rationale: “Kà á mọ́” mú èrò ἐλογίσθη μετὰ jáde lọ́nà Yorùbá tó ṣe kedere; “àwọn aláìgbọ́ràn sí òfin” fi ìtumọ̀ ἀνόμων hàn láì sọ wọ́n di àwọn tí kò ní òfin rárá.
- source_word: τὸ περὶ ἐμοῦ
  choice: ohun tí ó jẹ mọ́ mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tó kan Jesu tàbí ohun tó ń ṣẹlẹ̀ nípa rẹ̀.
- source_word: τέλος ἔχει
  choice: ń dé òpin rẹ̀
  rationale: Yíyan yìí pa àìdánilójú tó wà láàárín òpin, ìparí àti ìmúṣẹ mọ́, ó sì yẹra fún ṣíṣe ìtumọ̀ náà ní pàtó ju Gíríìkì lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àyọlò Aísáyà 53:12 àti ἀνόμων
  choice: A sì kà á mọ́ àwọn aláìgbọ́ràn sí òfin
  alternative: A sì kà á mọ́ àwọn arúfin
  rationale: Ọ̀rọ̀ àkọ́kọ́ fi èrò “lawless” hàn ní kedere; àṣàyàn “àwọn arúfin,” tí ó wọ́pọ̀ nínú ìtúmọ̀ ìbílẹ̀ Aísáyà 53:12, wà nínú àlàyé ìsàlẹ̀ láti pa ìbáṣepọ̀ náà mọ́.
- issue: Ìtumọ̀ τέλος ἔχει nínú ọ̀rọ̀ ìjìyà Jesu
  choice: ń dé òpin rẹ̀
  alternative: ń dé ìmúṣẹ rẹ̀ / ń parí
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí òpin tàbí sí ìparí nípasẹ̀ ìmúṣẹ. Ọ̀rọ̀ àkọ́kọ́ pa ìfọ̀kànbalẹ̀ yẹn mọ́, kò sì yan ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìrísí àyọlò àsọtẹ́lẹ̀ àti àìdánilójú gbólóhùn ìkẹyìn mọ́.
