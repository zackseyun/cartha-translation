  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ìṣètò àti ìtumọ̀ pàtàkì Gíríìkì dáadáa: γάρ, δεῖ, τελεσθῆναι, ἐν ἐμοί, àti τέλος ἔχει ni a ti pa mọ́. Síbẹ̀, “aláìgbọ́ràn sí òfin” tú ἀνόμων sí ìwà ìgbọràn-kògbọràn, nígbà tí ọ̀rọ̀ náà fúnra rẹ̀ túmọ̀ sí àwọn aláìlófin/lawless. “Ohun tí ó jẹ mọ́ mi” tún lè dà bí ohun-ìní mi; “ohun tí ó kan mi” kúnrẹ́rẹ́ fún τὸ περὶ ἐμοῦ.'
