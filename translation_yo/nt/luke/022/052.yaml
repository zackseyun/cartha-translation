id: LUK.22.52
reference: Luke 22:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún àwọn ẹni tí wọ́n wá dojú kọ ọ—àwọn olórí àlùfáà, àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì, àti àwọn àgbààgbà—pé, “Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀pá bí ẹni pé ẹ ń wá mú ọlọ́ṣà[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “adigunjalè” tàbí “ọ̀daràn ọlọ̀tẹ̀.” Ọ̀rọ̀ Gíríìkì náà, λῃστής, lè túmọ̀ sí ọlọ́ṣà, adigunjalè, tàbí irú ọ̀daràn tí ó lè kópa nínú ìṣọ̀tẹ̀; níhìn-ín Jésù ń fi bí wọ́n ṣe mú ohun ìjà wá wé ọ̀nà tí a lè gbà dojú kọ ọ̀daràn eléwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn bí Jésù ṣe dáhùn sí ìṣe ìmúni náà.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: tí wọ́n wá sí i láti dojú kọ ọ
  rationale: ἐπί pẹ̀lú accusative nínú àyíká ìmúni yìí tọ́ka sí wíwá pẹ̀lú ète ọ̀tá; ọ̀rọ̀ yìí mú ìtumọ̀ náà ṣe kedere láìṣe àfikún èrò.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ẹgbẹ́ àwọn aṣáájú àlùfáà, kì í ṣe ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì
  rationale: Ó tọ́ka sí àwọn aláṣẹ tó ń bójú tó ààbò tẹ́ńpìlì; yíyan yìí ṣe iṣẹ́ wọn kedere ní Yorùbá òde òní.
- source_word: πρεσβυτέρους
  choice: àwọn àgbààgbà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn aṣáájú tí a mọ̀ sí àgbààgbà láàárín àwọn Júù, kì í ṣe àwọn arúgbó lásán.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: bí ẹni pé ẹ wá mú ọlọ́ṣà
  rationale: Ó mú àkànlò èdè Gíríìkì tó túmọ̀ sí lílọ jáde láti dojú kọ tàbí mú ẹnì kan, ó sì pa agbára ìbéèrè Jésù mọ́.
- source_word: ἐξήλθατε
  choice: ni ẹ ṣe jáde wá
  rationale: Ó tọ́ka sí ìgbésẹ̀ tí wọ́n ṣẹ̀ṣẹ̀ gbé láti jáde wá mú un, ó sì dùn mọ́ etí ní Yorùbá.
- source_word: μαχαιρῶν
  choice: idà
  rationale: Èyí ni ìtumọ̀ tó wọ́pọ̀, tó sì bá àyíká ìmúni ológun mu.
- source_word: ξύλων
  choice: kùmọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ní í ṣe pẹ̀lú ohun igi, nínú àyíká yìí ó jẹ́ ohun ìjà igi tí a fi ń lù; ‘kùmọ̀’ sọ ìtumọ̀ náà ní ṣókí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní ọlá ni a lò. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, ‘tẹ́ńpìlì’ fún ibi mímọ́ náà, àti ‘kùmọ̀’ fún ohun ìjà igi. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
