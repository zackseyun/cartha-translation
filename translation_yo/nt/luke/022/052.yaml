revisions:
- from: Ṣùgbọ́n Jésù sọ fún àwọn olórí àlùfáà, àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì, àti àwọn àgbààgbà tí wọ́n wá sí i láti dojú kọ ọ pé, “Ṣé bí ẹni pé ẹ wá mú ọlọ́ṣà[a] ni ẹ ṣe jáde wá pẹ̀lú idà àti kùmọ̀?”
  to: Ṣùgbọ́n Jésù sọ fún àwọn ẹni tí wọ́n wá dojú kọ ọ—àwọn olórí àlùfáà, àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì, àti àwọn àgbààgbà—pé, “Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀pá bí ẹni pé ẹ ń wá mú ọlọ́ṣà[a]?”
  rationale: The revision makes the participial description apply unambiguously to all three leadership groups, improves the natural Yoruba form of Jesus’ rhetorical question, and uses “ọ̀pá” for the wooden weapons. The footnote retains the lexical range of λῃστής without making a historically or politically over-specific claim.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal groups, the hostile approach, and the armed rhetorical question. However, the relative clause placed after “àwọn àgbààgbà” can grammatically restrict “tí wọ́n wá sí i láti dojú kọ ọ” to the elders alone, whereas the Greek describes the entire assembled group. The wording for the final weapon is also better rendered with the broadly clear “ọ̀pá” in this context.
  naturalness: “tí wọ́n wá sí i láti dojú kọ ọ” is redundant and somewhat awkward, since “sí i” and “dójú kọ ọ” both carry the object reference. “Ṣé bí ẹni pé ẹ wá mú ọlọ́ṣà ni ẹ ṣe jáde wá” is understandable but less idiomatic than framing the rhetorical comparison directly with the armed departure.
  terminology: “Àwọn olórí àlùfáà,” “àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì,” and “àwọn àgbààgbà” suitably convey the official groups. “Ọlọ́ṣà” is a valid primary rendering of λῃστής; its wider possible sense should remain in a restrained lexical footnote. “Ọ̀pá” naturally covers the wooden clubs/sticks (ξύλα) without implying a specific modern implement.
  issues:
  - severity: medium
    issue: The clause describing those who came against Jesus appears to modify only the elders.
    rationale: In the Greek, τοὺς παραγενομένους ἐπ’ αὐτὸν governs the chief priests, temple officers, and elders collectively. Recasting the sentence makes that scope clear in Yoruba.
  - severity: low
    issue: The wording of the question is awkward and “kùmọ̀” is less broadly transparent for ξύλα.
    rationale: A direct Yoruba rhetorical question with “ọ̀pá” is natural and retains the source’s comparison and armed setting.
  - severity: low
    issue: The footnote’s phrase “olóṣèlú ọ̀daràn tó ń jagun sí ìjọba” is overly specific.
    rationale: λῃστής may in some settings include an insurgent-type outlaw, but the word itself does not require a modern political identity or explicit warfare against a government.
  revised_text: Ṣùgbọ́n Jésù sọ fún àwọn ẹni tí wọ́n wá dojú kọ ọ—àwọn olórí àlùfáà, àwọn olórí ẹ̀ṣọ́ tẹ́ńpìlì, àti àwọn àgbààgbà—pé, “Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀pá bí ẹni pé ẹ ń wá mú ọlọ́ṣà[a]?”
  revised_footnotes:
  - marker: a
    text: Tàbí, “adigunjalè” tàbí “ọ̀daràn ọlọ̀tẹ̀.” Ọ̀rọ̀ Gíríìkì náà, λῃστής, lè túmọ̀ sí ọlọ́ṣà, adigunjalè, tàbí irú ọ̀daràn tí ó lè kópa nínú ìṣọ̀tẹ̀; níhìn-ín Jésù ń fi bí wọ́n ṣe mú ohun ìjà wá wé ọ̀nà tí a lè gbà dojú kọ ọ̀daràn eléwu.
    reason: lexical_alternative
  revision_rationale: The revision makes the participial description apply unambiguously to all three leadership groups, improves the natural Yoruba form of Jesus’ rhetorical question, and uses “ọ̀pá” for the wooden weapons. The footnote retains the lexical range of λῃστής without making a historically or politically over-specific claim.
