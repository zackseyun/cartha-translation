id: LUK.22.2
reference: Luke 22:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti àwọn akọ̀wé sì ń wá bí wọ́n ṣe lè pa á[a], nítorí wọ́n bẹ̀rù àwọn ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí wọ́n ṣe lè mú un kúrò láàyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Àkókò imperfect fi hàn pé ìwá-ọ̀nà náà ń bá a lọ nígbà àtijọ́; “ń wá” mú ìṣe tí ó ń tẹ̀ síwájú yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà ní Jerusalẹmu, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń di ipò àlùfáà àgbà kan náà mú lẹ́ẹ̀kan ṣoṣo.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì ti fìdí múlẹ̀ fún àwọn amòye Ìwé Mímọ́ àti òfin nínú ìtàn àwọn Ìhìn Rere; “àwọn olùkọ́ òfin” yóò túmọ̀ iṣẹ́ wọn síwájú ju ọ̀rọ̀ Gíríìkì náà lọ.
- source_word: τὸ πῶς
  choice: ọ̀nà tí
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí bí a ó ṣe ohun kan tàbí ọ̀nà tí a ó gbà ṣe é; “ọ̀nà tí … fi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: ἀνέλωσιν
  choice: tí wọn yóò fi pa á
  rationale: Nínú àyíká yìí, ἀναιρέω túmọ̀ sí pípa ènìyàn. “Pa á” ṣe kedere, ó sì pa agbára èrò búburú wọn mọ́ láìfi ọ̀nà ìdájọ́ pàtó kún un.
- source_word: ἐφοβοῦντο
  choice: wọ́n bẹ̀rù
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ipò ìbẹ̀rù tí ó ń bá a lọ. Yorùbá àdánidá máa ń lo “wọ́n bẹ̀rù” níbí; àyíká gbólóhùn náà mú ìtẹ̀síwájú ipò náà hàn.
- source_word: τὸν λαόν
  choice: àwọn ènìyàn
  rationale: λαός tọ́ka sí àwọn ènìyàn gẹ́gẹ́ bí àwùjọ lápapọ̀. “Àwọn ènìyàn” kò dín ìtọ́kasí náà kù sí ogunlọ́gọ̀ tí ó pé jọ ní ibi kan ṣoṣo.
theological_decisions:
- issue: Agbára ἀνέλωσιν nínú ète àwọn aṣáájú
  choice: pa á
  alternative: mú un kúrò láàyè
  rationale: “Pa á” kò rọ ìkórìíra àti ète ikú wọn kù, bẹ́ẹ̀ ni kò sọ pé wọ́n ti pinnu irú ìlànà òfin tàbí ìdájọ́ tí wọn yóò lò.
- issue: Ohun tí λαός ń tọ́ka sí
  choice: àwọn ènìyàn
  alternative: ogunlọ́gọ̀
  rationale: Èyí pa ìtumọ̀ àpapọ̀ mọ́, ó sì dáàbò bo ìforígbárí inú ìtàn náà pé àwọn aṣáájú kò gbé ìgbésẹ̀ nítorí ìbẹ̀rù ohun tí àwọn ènìyàn yóò ṣe.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, tí ó níyì, tí ó sì ṣe kedere fún òǹkàwé lásán. “Àwọn olórí àlùfáà” àti “àwọn akọ̀wé” jẹ́ àwọn ọ̀rọ̀ tí ó bá àyíká ìtàn ẹ̀sìn mu; ìṣètò “ń wá ọ̀nà tí wọn yóò fi” mú ìṣe tí ó ń bá a lọ àti ète tí wọn ń gbèrò jáde lọ́nà àdánidá.
