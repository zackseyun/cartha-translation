    issue: The imperative ‘Sọ àsọtẹ́lẹ̀!’ is less idiomatic than the single Yoruba verb ‘Sọtẹ́lẹ̀!’
    rationale: Greek Προφήτευσον is directly an imperative ‘Prophesy!’ Standard Yoruba normally expresses this with ‘Sọtẹ́lẹ̀!’; the revision is more natural while retaining the same imperative force and mockery.
