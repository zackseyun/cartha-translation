  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti bo ojú rẹ̀[a], wọ́n ń béèrè lọ́wọ́ rẹ̀ léraléra pé, “Sọtẹ́lẹ̀! Ta ni ẹni tí ó lù ọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n sì ti di ojú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: nígbà tí wọ́n sì ti bo ojú rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi nǹkan bo tàbí ṣíbo mọ́ ènìyàn. ‘Bo ojú rẹ̀’ jẹ́ èdè Yorùbá àdánidá tí ó fi hàn pé wọ́n dí ìríran rẹ̀, láì sọ ọ̀nà pàtó tí wọ́n gbà ṣe bẹ́ẹ̀; àlàyé ìsàlẹ̀ ojú ìwé sì pa ìtumọ̀ ‘di ojú rẹ̀’ mọ́.
- source_word: ἐπηρώτων
  choice: wọ́n ń béèrè lọ́wọ́ rẹ̀ léraléra
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ‘ń béèrè ... léraléra’ mú agbára yẹn jáde ní kedere.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣáájú ọ̀rọ̀ tí wọ́n ń sọ, ó sì ṣe iṣẹ́ participle náà láì mú gbólóhùn wuwo.
- source_word: Προφήτευσον
  choice: Sọ àsọtẹ́lẹ̀!
  rationale: Èyí pa àṣẹ ẹlẹ́yà náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye ní kedere.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Ta ni ẹni tí ó lù ọ́?
  rationale: ‘Ẹni tí ó lù ọ́’ ṣe àfihàn articular participle ὁ παίσας, ‘ẹni tí ó lù ọ́,’ ní ọ̀nà tí ó sun mọ́ Gíríìkì, tí ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ ní pàtó pé wọ́n di ojú Jésù
  choice: Lo ọ̀rọ̀ gbogbogbò ‘bo ojú rẹ̀’ nínú ẹsẹ̀ pàtàkì
  alternative: ‘di ojú rẹ̀’
  rationale: Àyíká ọ̀rọ̀ fi hàn pé wọ́n dí ìríran rẹ̀, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí bíbò tàbí ṣíṣíbo. Ìtumọ̀ pàtàkì kò sọ ohun tí orísun kò sọ ní pàtó; àlàyé ìsàlẹ̀ ojú ìwé sì fi ìtumọ̀ míì tó wọ́pọ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tó bá yẹ; ‘léraléra’ mú ìṣe tí ó ń tẹ̀ síwájú jáde, ‘Sọ àsọtẹ́lẹ̀!’ sì pa ẹ̀gàn inú àṣẹ náà mọ́.
