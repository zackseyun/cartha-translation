  verdict: revise
  source_fidelity: The temporal participle, the imperfect’s continuing/repeated force, the mocking imperative, and the substantival participle are all represented faithfully. Rendering περικαλύψαντες as ‘bo ojú rẹ̀’ is a natural contextual Yoruba expression and does not materially exceed the sense of covering/veiling in this setting.
  naturalness: The sentence is clear, idiomatic Standard Yoruba, and appropriately retains the taunting register. The imperative is more natural and lexically exact as ‘Sọtẹ́lẹ̀!’ rather than the periphrastic ‘Sọ àsọtẹ́lẹ̀!’
  terminology: ‘Sọtẹ́lẹ̀’ is the established natural Yoruba verb for ‘prophesy.’ The footnote appropriately preserves the alternative ‘di ojú rẹ̀’ (blindfold).
  issues:
