id: LUK.22.8
reference: Luke 22:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: yo
  text: Ó sì rán Pétérù àti Jòhánù, ó ní, “Ẹ lọ pèsè Ìrékọjá sílẹ̀ fún wa, kí a lè jẹ ẹ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘àsè Ìrékọjá.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí Ìrékọjá ní ọ̀nà tó gbòòrò, ṣùgbọ́n níbí, pípèsè rẹ̀ àti jíjẹ ẹ́ tọ́ka sí àsè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó rán wọn lọ; ‘rán’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtàn náà mu.
- source_word: εἰπών
  choice: ó ní
  rationale: Bí ó tilẹ̀ jẹ́ pé participle ni nínú Gíríìkì, ‘ó ní’ ni ọ̀nà àdánidá láti mú ọ̀rọ̀ tí ó tẹ̀ lé e wọ inú Yorùbá láì yí ìbáṣepọ̀ rẹ̀ pẹ̀lú fífi wọn ránṣẹ́ padà.
- source_word: Πορευθέντες
  choice: Ẹ lọ
  rationale: Nínú àṣẹ yìí, participle náà ní agbára àṣẹ ìbẹ̀rẹ̀; ‘Ẹ lọ’ jẹ́ àdánidá, ó sì fi ọ̀wọ̀/ọ̀pọ̀ ènìyàn hàn.
- source_word: ἑτοιμάσατε
  choice: pèsè … sílẹ̀
  rationale: Ó ń tọ́ka sí ṣíṣe gbogbo ohun tó yẹ ní mímúra Ìrékọjá; ‘pèsè … sílẹ̀’ jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dative náà fi ẹni tí ìpèsè náà jẹ́ fún hàn, láì fi ‘gbogbo wa’ kún ohun tí kò sí nínú orísun.
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: ‘Ìrékọjá’ pa ìtúmọ̀ ọ̀rọ̀ náà mọ́ ní gbígbòòrò, dípò kí a dín in kù sí àsè tàbí ọ̀dọ́-àgùntàn nìkan.
- source_word: ἵνα φάγωμεν
  choice: kí a lè jẹ ẹ́
  rationale: ‘Kí a lè’ sọ ète ἵνα pẹ̀lú subjunctive di mímọ̀; ‘ẹ́’ ń tọ́ka sí Ìrékọjá gẹ́gẹ́ bí ohun tí wọn yóò jẹ.
theological_decisions:
- issue: Ohun tí ‘Ìrékọjá’ ń tọ́ka sí
  choice: A lo ‘Ìrékọjá’ láì sọ ní pàtó pé àsè Ìrékọjá ni tàbí ọ̀dọ́-àgùntàn Ìrékọjá.
  alternative: ‘àsè Ìrékọjá’ tàbí ‘ọ̀dọ́-àgùntàn Ìrékọjá’
  rationale: Àyíká ọ̀rọ̀ pípèsè àti jíjẹ́ fi hàn pé àsè náà wà lọ́kàn, ṣùgbọ́n πάσχα lè ní ìtumọ̀ tó gbòòrò; ìtumọ̀ yìí pa àìdánilójú tòótọ́ inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Peteru’ àti ‘Johanu’ tẹ̀ lé ìṣàkọsílẹ̀ orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá.
