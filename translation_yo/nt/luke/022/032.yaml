id: LUK.22.32
reference: Luke 22:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: yo
  text: Ṣùgbọ́n mo ti gbàdúrà fún ọ[a], kí ìgbàgbọ́ rẹ má bàa kùnà; àti ìwọ, nígbà tí o bá ti yí padà[b], mú àwọn arákùnrin rẹ lè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí ìdúróṣinṣin rẹ nínú ìgbàgbọ́ má bàa kùnà” tàbí “kí ìgbẹ́kẹ̀lé rẹ má bàa kùnà.” Ọ̀rọ̀ Gíríìkì náà lè ní àwọn ìtumọ̀ wọ̀nyí tí wọ́n yí ká ara wọn.
    reason: alternative_reading
  - marker: b
    text: Tàbí “nígbà tí o bá ti padà” tàbí “nígbà tí o bá tún yí padà.” Ọ̀rọ̀ náà tọ́ka sí ìmúpadàbọ̀ sípò lẹ́yìn ìkùnà Pétérù tó ń bọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: mo ti gbàdúrà
  rationale: Ó sọ ẹ̀bẹ̀ àdúrà tí a ti ṣe, tí ó sì ní ìtumọ̀ fún ipò tí ó wà níwájú; ọ̀rọ̀ yìí jẹ́ ti ara Yorùbá, kò sì fi agbára ẹ̀bẹ̀ náà hàn ju ti Gíríìkì lọ.
- source_word: περὶ σοῦ
  choice: fún ọ
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe àdúrà, περί pẹ̀lú genitive túmọ̀ sí gbígbàdúrà nítorí ẹnì kan tàbí ní àǹfààní rẹ̀; “fún ọ” ni ìsọ̀rọ̀ Yorùbá tó bá a mu jù.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: kí ... má bàa kùnà
  rationale: ἐκλείπω lè túmọ̀ sí kí ohun kan má ṣiṣẹ́ mọ́, má tán, tàbí má kùnà. “Má bàa kùnà” bá àyíká ìdánwò Peteru mu láì sọ pé ìgbàgbọ́ rẹ̀ yóò parun pátápátá.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” pa ìtumọ̀ gbígbàgbọ́ àti ìgbẹ́kẹ̀lé mọ́ láì dín ọ̀rọ̀ náà kù sí ìṣòtítọ́ nìkan.
- source_word: ποτε
  choice: nígbà tí
  rationale: Nínú àyíká yìí, ποτέ tọ́ka sí àkókò kan ní ọjọ́ iwájú; “nígbà tí” jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn pẹ̀lú participle tó tẹ̀ lé e.
- source_word: ἐπιστρέψας
  choice: tí o bá ti yí padà
  rationale: Ó pa àwòrán yíyí tàbí pípadà bọ̀ mọ́, ó sì jẹ́ kí òye ìrònúpìwàdà àti ìmúpadàbọ̀sípò wà láì fi ọ̀kan ṣoṣo múlẹ̀ gẹ́gẹ́ bí gbogbo ìtumọ̀ rẹ̀.
- source_word: στήρισον
  choice: fún ... lókun
  rationale: Àṣẹ náà ni pé kí Peteru mú àwọn yòókù dúró ṣinṣin. “Fún ... lókun” jẹ́ Yorùbá àdánidá tó lè kan ìtìlẹ́yìn nípa ẹ̀mí àti nípa àjọṣe.
- source_word: ἀδελφούς
  choice: àwọn arákùnrin rẹ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, àwọn ọmọ-ẹ̀yìn ọkùnrin tí wọ́n wà pẹ̀lú Jesu sì ni àyíká ọ̀rọ̀ tọ́ka sí ní tààràtà.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí ìgbàgbọ́, ìgbẹ́kẹ̀lé, àti ìṣòtítọ́ ti lè yí ká ara wọn
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: “Ìgbàgbọ́” pa fífẹ̀ ìtumọ̀ Gíríìkì mọ́. Àlàyé ìsàlẹ̀ fi àwọn òye mìíràn hàn láì fi ipa mú ọ̀kan wọ inú ẹsẹ̀ náà.
- issue: Ìtumọ̀ ἐπιστρέψας nípa ohun tí yóò ṣẹlẹ̀ sí Peteru lẹ́yìn ìkùnà rẹ̀
  choice: nígbà tí o bá ti yí padà
  alternative: nígbà tí o bá ti padà; nígbà tí o bá tún yí padà
  rationale: Èyí pa àwòrán ìpadàbọ̀ mọ́, ó sì gba òye ìmúpadàbọ̀sípò àti ìrònúpìwàdà láàyè láì sọ “ronúpìwàdà” ní tààràtà níbi tí Gíríìkì kò ti fi ọ̀rọ̀ pàtó yẹn sí.
- issue: Bí a ṣe túmọ̀ ἀδελφούς nínú àyíká yìí
  choice: àwọn arákùnrin rẹ
  alternative: àwọn arákùnrin àti arábìnrin rẹ; àwọn onígbàgbọ́ ẹlẹgbẹ́ rẹ
  rationale: Àwọn ọmọ-ẹ̀yìn ọkùnrin ni àyíká ìṣẹ̀lẹ̀ náà tọ́ka sí lẹ́sẹ̀kẹsẹ̀; nítorí náà, a pa akọ tí ọ̀rọ̀ Gíríìkì lò mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A lo “Ṣùgbọ́n” láti pa ìyàtọ̀ δέ mọ́, a sì lo “àti ìwọ” láti fi ìtẹnumọ́ καὶ σύ hàn.
