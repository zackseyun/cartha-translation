  source_fidelity: 'Ìtumọ̀ pàtàkì náà fara mọ́ Gíríìkì: ἐδεήθην jẹ́ “mo ti gbàdúrà,” περὶ σοῦ jẹ́ “fún ọ,” ἵνα μὴ ἐκλίπῃ ni a ti mú gẹ́gẹ́ bí “kí ... má bàa kùnà,” àti ἐπιστρέψας ni “nígbà tí o bá ti yí padà.” Ìtẹnumọ́ nínú καὶ σύ àti àṣẹ στήρισον náà wà nínú ìtumọ̀ náà. A tún pa “arákùnrin” mọ́ gẹ́gẹ́ bí ìtọ́kasí sí ẹgbẹ́ àwọn ọmọ-ẹ̀yìn ọkùnrin nínú àyíká yìí.'
