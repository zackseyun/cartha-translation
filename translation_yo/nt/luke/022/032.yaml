  terminology: “Ìgbàgbọ́” jẹ́ ìtumọ̀ gbooro tó yẹ fún πίστις. Ṣùgbọ́n “ìṣòtítọ́” túmọ̀ sí truthfulness/honesty ní Yorùbá, kì í ṣe ìtumọ̀ tó péye fún “faithfulness” nínú àlàyé ìsàlẹ̀. “Ìdúróṣinṣin nínú ìgbàgbọ́” ń fi ìtumọ̀ àfidípò náà hàn dáadáa láì dín πίστις kù nínú ọ̀rọ̀ àkọ́kọ́.
