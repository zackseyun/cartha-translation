  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́[a], ìgbìmọ̀ àwọn àgbààgbà ènìyàn—àwọn olórí àlùfáà àti àwọn akọ̀wé—péjọ; wọ́n sì mú un lọ sí ìgbìmọ̀ wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó di ọ̀sán,” tàbí “ní kùtùkùtù òwúrọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí ibi ìpàdé ìgbìmọ̀ wọn,” tàbí “níwájú ìgbìmọ̀ wọn.” Ọ̀rọ̀ Gíríìkì συνέδριον lè túmọ̀ sí ìgbìmọ̀ fúnra rẹ̀, ìpàdé rẹ̀, tàbí ibi tí wọ́n ti ń pàdé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Nígbà tí ilẹ̀ sì mọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún bí ọjọ́ ṣe dé tàbí bí ilẹ̀ ṣe mọ́, ó sì pa ìtumọ̀ àkókò inú gbólóhùn Gíríìkì mọ́.
- source_word: συνήχθη
  choice: péjọ
  rationale: Ó sọ ní kedere pé gbogbo ẹgbẹ́ náà kóra jọ, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: ìgbìmọ̀ àwọn àgbààgbà àwọn ènìyàn
  rationale: πρεσβυτέριον ń tọ́ka sí ẹgbẹ́ àwọn àgbààgbà tí ń ṣe ìgbìmọ̀, kì í ṣe ipò àgbà nìkan.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: àwọn olórí àlùfáà àti àwọn akọ̀wé
  rationale: Ìtumọ̀ yìí jẹ́ mímọ́, ó sì ṣàfihàn àwọn ẹgbẹ́ méjèèjì tí τε καί so pọ̀.
- source_word: ἀπήγαγον
  choice: wọ́n mú un lọ
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ mímú tàbí ṣíṣáájú ẹnìkan lọ; ‘mú un lọ’ jẹ́ Yorùbá àdánidá tí kò sọ pé wọ́n lo ipá ju ohun tí orísun sọ lọ.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: sí ìgbìmọ̀ wọn
  rationale: συνέδριον lè tọ́ka sí ìgbìmọ̀ fúnra rẹ̀, ìpàdé rẹ̀, tàbí ibi ìpàdé; ọ̀rọ̀ àkọ́kọ́ pa ìṣiyèméjì yìí mọ́, àlàyé ìsàlẹ̀ sì ṣàfihàn àwọn àṣàyàn náà.
theological_decisions:
- issue: Orúkọ fún ẹgbẹ́ aṣáájú àwọn Júù
  choice: ìgbìmọ̀ wọn
  alternative: Sàníhẹ́dírìn wọn; ibi ìpàdé ìgbìmọ̀ wọn; níwájú ìgbìmọ̀ wọn
  rationale: Lílo ‘ìgbìmọ̀’ tú ọ̀rọ̀ Gíríìkì náà sí Yorùbá dípò gbígbé orúkọ àyálò wọlé, ó sì yàgò fún fífi dandan pinnu bóyá ẹgbẹ́ náà, ìpàdé náà, tàbí ibi ìpàdé ni a ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ‘sì’ méjèèjì ń tẹ̀ lé Καὶ inú orísun láìsọ gbolohun náà di líle.
