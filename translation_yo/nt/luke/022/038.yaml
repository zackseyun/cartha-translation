id: LUK.22.38
reference: Luke 22:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: yo
  text: Wọ́n sì sọ pé, “Olúwa, wò ó, idà méjì nìyí.” Ó sì sọ fún wọn pé, “Ó tó.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èyí ti tó”; ó lè túmọ̀ sí pé kí ìjíròrò náà dópin, dípò pé idà méjì náà tó.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì sọ pé
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; “sì” ń tẹ ìtàn náà síwájú láì fi ìtakora tí ó lágbára kún un. “sọ pé” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún εἶπαν.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” bá ọ̀rọ̀ ìpè sí Jésù mu, ó sì tún pa ìlò κύριος gẹ́gẹ́ bí oyè mọ́.
- source_word: ἰδοὺ
  choice: wò ó
  rationale: “Wò ó” fi agbára ọ̀rọ̀ tí ń pe àfiyèsí hàn ní Yorùbá àdánidá, láì lo èdè àtijọ́.
- source_word: μάχαιραι
  choice: idà
  rationale: μάχαιρα túmọ̀ sí ohun ìjà olójú; “idà” jẹ́ yíyan tó wọ́pọ̀ tí kò sọ irú tàbí gígùn ohun ìjà náà ju ohun tí Gíríìkì sọ lọ.
- source_word: ὧδε δύο
  choice: idà méjì nìyí
  rationale: “nìyí” mú ìtọ́kasí ὧδε jáde, “méjì” sì pa nọ́ńbà náà mọ́ ní ìṣètò ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Ἱκανόν ἐστιν
  choice: Ó tó
  rationale: “Ó tó” lè túmọ̀ sí pé iye náà pé, ó sì tún lè jẹ́ ọ̀nà láti dá ìjíròrò dúró; nítorí náà, ó pa àìdánilójú inú Gíríìkì mọ́.
theological_decisions:
- issue: Àìdánilójú ìtumọ̀ ìdáhùn Jésù, Ἱκανόν ἐστιν
  choice: Ó tó
  alternative: Ó ti tó / Ẹ jẹ́ ká dá ọ̀rọ̀ náà dúró
  rationale: Gíríìkì lè jẹ́ ìdájọ́ pé idà méjì tó, tàbí ọ̀rọ̀ tí ń parí ìjíròrò. Ọ̀rọ̀ inú ẹsẹ̀ náà kò yan ọ̀kan nínú wọn, àlàyé ìsàlẹ̀ ojú ìwé sì tọ́ka sí ìtumọ̀ kejì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “sọ” dípò “wí” fún àdánidá, a sì pa àsopọ̀ àti àtúnlò ọ̀rọ̀ εἶπεν mọ́.
