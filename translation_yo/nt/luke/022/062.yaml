  text: And after going outside, he wept bitterly.
translation:
  language: yo
  text: Ó sì jáde síta, ó sunkún kíkorò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí ó jáde síta, ó sunkún kíkorò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tí ó rọrùn ni; “sì” pa ìbáṣepọ̀ pẹ̀lú ohun tó ṣáájú mọ́ láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἐξελθὼν
  choice: jáde lọ
  rationale: Ọ̀rọ̀ alábápín aorist yìí ń tọ́ka sí ìjáde tí ó ṣẹlẹ̀ kí ìṣe pàtàkì, sunkún, tó wáyé; ìtẹ̀lé àwọn ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì mú ìtumọ̀ náà jáde.
- source_word: ἔξω
  choice: síta
  rationale: Ó sọ ibi tàbí ìdarí ìjáde náà pàtó; “síta” ni ọ̀rọ̀ Yorùbá àdánidá fún un.
- source_word: ἔκλαυσεν
  choice: ó sunkún
  rationale: “Sunkún” túmọ̀ κλαίω ní kedere, ó sì bá ìbànújẹ́ gidi inú àyíká ọ̀rọ̀ náà mu.
- source_word: πικρῶς
  choice: kíkorò
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá láti ṣàpèjúwe bí ẹkún náà ṣe kún fún ìrora àti ìbànújẹ́ líle.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbà lítíréṣọ̀ tó bójú mu, ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “jáde lọ síta” láti pa méjèèjì ἐξελθών àti ἔξω mọ́, bí ó tilẹ̀ jẹ́ pé wọ́n ní ìtumọ̀ tó sún mọ́ra.
