  terminology: “Sunkún” àti “kíkorò” jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún ἔκλαυσεν πικρῶς. A kò nílò ìpinnu ẹ̀kọ́ ìsìn kankan nínú ẹsẹ̀ yìí.
