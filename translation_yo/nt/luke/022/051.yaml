  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dáhùn pé, “Ẹ jẹ́ kí ó tó bẹ́ẹ̀!” Ó sì fọwọ́ kan etí ọkùnrin náà, ó sì mú un láradá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Ẹ dáwọ́ rẹ̀ dúró!
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ẹ jẹ́ kí ó tó èyí’ tàbí ‘ẹ jẹ́wọ́ rẹ̀ títí dé ìwọ̀nyí’; nínú àyíká ìkọlù náà, àṣẹ pé kí wọ́n dá ohun tí wọ́n ń ṣe dúró ni ó bá èdè Yorùbá àdánidá mu, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: fọwọ́ kan etí ọkùnrin náà
  rationale: ‘Fọwọ́ kan’ sọ ìṣe ἅπτομαι ní kedere; ‘ọkùnrin náà’ mú ẹni tí αὐτόν ń tọ́ka sí yé, gẹ́gẹ́ bí àyíká ẹsẹ tó ṣáájú.
- source_word: ἰάσατο αὐτόν
  choice: mú un láradá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ìwòsàn ènìyàn tí ἰάομαι ń sọ.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ Ἐᾶτε ἕως τούτου
  choice: Ẹ dáwọ́ rẹ̀ dúró!
  alternative: Ẹ jẹ́ kí ó tó èyí!
  rationale: Àwọn ọ̀rọ̀ Gíríìkì ní àìdánilójú díẹ̀, ṣùgbọ́n àyíká lẹ́sẹ̀kẹsẹ̀—ìlù idà àti ìwòsàn—ṣe àtìlẹ́yìn fún àṣẹ láti dá ìwà ipá dúró. A kò sọ pé Jésù ń kọ gbogbo ìlò agbára ní gbogbo ipò, nítorí ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé tó bẹ́ẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ’ nítorí Ἐᾶτε jẹ́ ọ̀pọ̀.
