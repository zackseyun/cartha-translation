base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: yo
  text: ó ń wí pé, “Baba, bí ìwọ bá fẹ́, mú[a] ife yìí[b] kúrò lọ́dọ̀ mi. Síbẹ̀, kì í ṣe ìfẹ́ mi, ṣùgbọ́n ìfẹ́ rẹ ni kí ó ṣẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀-ìṣe Gíríìkì náà sí “yọ ... kúrò.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Ìwé Mímọ́, “ife” lè jẹ́ àpẹẹrẹ ìpín tí a yàn fún ẹnì kan, ní ọ̀pọ̀ ìgbà ó sì máa ń tọ́ka sí ìjìyà tàbí ìdájọ́.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: ó ń wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń tẹ̀ síwájú láti inú àyíká gbolohun, ó sì ń ṣàgbékalẹ̀ ohun tí Jésù sọ nínú àdúrà rẹ̀.
- source_word: Πάτερ
  choice: Baba
  rationale: Ìpè tààrà sí Ọlọ́run ni; “Baba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ọlọ́wọ̀, tí kò sì nílò àfikún ọ̀rọ̀ àtijọ́.
- source_word: εἰ βούλει
  choice: bí ìwọ bá fẹ́
  rationale: Ó pa ìbéèrè onípele mọ́, ó sì fi ìfẹ́ tàbí ìmúratán Baba hàn láìyí i padà sí àṣẹ tàbí ètò.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: mú ... kúrò lọ́dọ̀ mi
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìbéèrè hàn pé kí a mú ife náà kúrò lọ́dọ̀ Jésù; ó ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τοῦτο τὸ ποτήριον
  choice: ife yìí
  rationale: A pa àwòrán “ife” mọ́ nítorí ìtumọ̀ rẹ̀ nínú Ìwé Mímọ́ gẹ́gẹ́ bí ìpín tí a yàn fún ẹnì kan, pàápàá ìjìyà tàbí ìdájọ́.
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó mú ìyípadà alágbára láti inú ìbéèrè Jésù sí ìtẹríba rẹ̀ hàn ní Yorùbá tó ṣe déédéé.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: kì í ṣe ìfẹ́ mi, bí kò ṣe tìrẹ
  rationale: Ó pa ìyàtọ̀ tó wà nínú Gíríìkì láàárín ìfẹ́ Jésù àti ti Baba mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: γινέσθω
  choice: ni kí ó ṣẹ
  rationale: Ó fi àṣẹ ẹni-kẹta hàn pé kí ìfẹ́ Baba wá sí ìmúṣẹ; “kí ó ṣẹ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àdúrà mu.
theological_decisions:
- issue: Ìbáṣepọ̀ ìfẹ́ Jésù pẹ̀lú ìfẹ́ Baba
  choice: kì í ṣe ìfẹ́ mi, bí kò ṣe tìrẹ, ni kí ó ṣẹ
  alternative: kì í ṣe ohun tí mo fẹ́, bí kò ṣe ohun tí ìwọ fẹ́
  rationale: A fi ìyàtọ̀ tí ẹsẹ náà sọ hàn ní tààrà, pẹ̀lú ìtẹríba Jésù sí ìfẹ́ Baba, láìdín ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà kù tàbí fi àlàyé ẹ̀sìn kan lé e lórí.
- issue: Agbára àpẹẹrẹ inú ọ̀rọ̀ “ife”
  choice: Pa “ife” mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: ìjìyà yìí; ìdánwò yìí
  rationale: Ìtumọ̀ àpẹẹrẹ náà ní ìbáṣepọ̀ pẹ̀lú ọ̀pọ̀ ibi nínú Ìwé Mímọ́; ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí “ìjìyà” nínú ọ̀rọ̀ pàtàkì yóò dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó ní iyì, tó bóde mu, tí ó sì yé òǹkàwé lásán ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì pa ìṣọ̀kan gbolohun àdúrà àti àwòrán “ife” mọ́.
