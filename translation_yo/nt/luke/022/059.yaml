  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: yo
  text: Lẹ́yìn bí wákàtí kan tí ó kọjá, ọkùnrin mìíràn[a] ń fi tẹnu mọ́ ọn pé, “Lóòótọ́, ọkùnrin yìí náà wà pẹ̀lú rẹ̀, nítorí ará Gálílì ni òun náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹni mìíràn.” Ọ̀rọ̀ τις jẹ́ aláìpàtó; ṣùgbọ́n ἄλλος àti λέγων wà ní fọ́ọ̀mù akọ nínú Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Lẹ́yìn bí wákàtí kan
  rationale: Ó fi hàn pé àkókò tó fẹ́rẹ̀ẹ́ tó wákàtí kan ti kọjá; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ àsìkò mọ́.
- source_word: ἄλλος τις
  choice: ọkùnrin mìíràn
  rationale: Gbólóhùn Gíríìkì náà kò sọ akọ tàbí abo ní pàtó, ṣùgbọ́n ọ̀rọ̀ tó yí i ká tọ́ka sí ẹni tí ó ṣeé ṣe kó jẹ́ ọkùnrin. Àlàyé ìsàlẹ̀ fi àṣàyàn tí kò sọ akọ tàbí abo hàn.
- source_word: διϊσχυρίζετο
  choice: tẹnu mọ́ ọn pé
  rationale: Ó mú ìtẹnumọ́ alágbára àti ìṣe tó ń bá a lọ nínú ọ̀rọ̀-ìṣe Gíríìkì náà jáde ní Yorùbá àdánidá.
- source_word: Ἐπ’ ἀληθείας
  choice: Lóòótọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti bẹ̀rẹ̀ ìjẹ́rìí tàbí ìfẹsẹ̀múlẹ̀ tó lágbára.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó pa agbára ìtọ́ka taara sí Peteru mọ́ dípò lílo arọ́pò-orúkọ lásán.
- source_word: μετ’ αὐτοῦ ἦν
  choice: wà pẹ̀lú rẹ̀
  rationale: Ó túmọ̀ ìbáṣepọ̀ tí gbólóhùn Gíríìkì sọ láìfi àlàyé ẹ̀kọ́ mìíràn kún un.
- source_word: καὶ γὰρ
  choice: nítorí ... òun náà
  rationale: “Nítorí” sọ ìdí tí a fi ṣe ẹ̀sùn náà, “náà” sì pa ìtumọ̀ καί mọ́.
- source_word: Γαλιλαῖός ἐστιν
  choice: ará Gálílì ni òun náà
  rationale: Ó dá Peteru mọ̀ nípasẹ̀ agbègbè tó ti wá, gẹ́gẹ́ bí Gíríìkì ṣe sọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó ṣe déédéé, tó ní iyì, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó bá àṣà ìkọ̀wé Yorùbá mu, a sì pa ìtẹnumọ́ àti ọ̀nà ìfisùn ẹsẹ náà mọ́.
