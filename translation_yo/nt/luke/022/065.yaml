  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: yo
  text: Wọ́n sì ń fi ọ̀pọ̀ ọ̀rọ̀-òdì mìíràn sọ̀rọ̀ sí i[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọ̀pọ̀ ọ̀rọ̀ ẹ̀gàn mìíràn” tàbí “ọ̀pọ̀ ọ̀rọ̀ àbùkù mìíràn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìsọ̀rọ̀ ẹ̀gàn tàbí àbùkù ní gbogbogbò; “ọ̀rọ̀-òdì” sì pa agbára rẹ̀ mọ́ níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “lòdì sí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní ìtumọ̀ gidi sí pé a darí ọ̀rọ̀ náà “sí i”; ní àyíká ìsọ̀rọ̀ ọ̀tá yìí, “lòdì sí i” tún ṣee ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wọ́n sì
  rationale: “Sì” jẹ́ àsopọ̀ Yorùbá tó ṣe àfihàn pé ìṣe yìí ń bá ìwà ìkà tí ẹsẹ tó ṣáájú sọ̀rọ̀ nípa rẹ̀ lọ.
- source_word: ἕτερα πολλὰ
  choice: ọ̀pọ̀lọpọ̀ ... mìíràn
  rationale: Èyí mú ọ̀pọ̀ ohun àti àfikún wọn sí àwọn ohun tí a ti sọ tẹ́lẹ̀ jáde lọ́nà Yorùbá àdánidá.
- source_word: βλασφημοῦντες
  choice: ọ̀rọ̀-òdì
  rationale: “Ọ̀rọ̀-òdì” pa agbára βλασφημέω mọ́, ó sì lè tọ́ka sí ọ̀rọ̀ ẹ̀gàn, ọ̀rọ̀ ìkà, tàbí ọ̀rọ̀ tó ba ẹni mímọ́ jẹ́; a kò sọ ọ́ di ẹ̀gàn lásán.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àmì ìṣe “ń” fi ìṣe tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: εἰς αὐτόν
  choice: sí i
  rationale: Nínú àyíká ọ̀rọ̀ ọ̀tá yìí, “sí i” lè túmọ̀ sí pé wọ́n darí ọ̀rọ̀ náà sí Jesu, pẹ̀lú agbára pé ó lòdì sí i, láìfi ohun tí Gíríìkì lè túmọ̀ sí pa mọ́.
theological_decisions:
- issue: Bóyá kí βλασφημοῦντες jẹ́ ọ̀rọ̀ ẹ̀gàn lásán tàbí kí a pa ìwọ̀n agbára rẹ̀ mọ́
  choice: Pa agbára rẹ̀ mọ́ pẹ̀lú “ọ̀rọ̀-òdì”
  alternative: “ọ̀rọ̀ ẹ̀gàn” tàbí “ọ̀rọ̀ ìkà”
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ tó gbòòrò ju ẹ̀gàn lásán lọ, ó sì lè ní ìwọ̀n ọ̀rọ̀ àbùkù tó lágbára. “Ọ̀rọ̀-òdì” pa ìwọ̀n yẹn mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọpò ọ̀rọ̀ tó bójú mu. Gbólóhùn náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ọ̀rọ̀-òdì” jẹ́ ọ̀rọ̀ tó ní ìwọ̀n mímọ́ tó yẹ fún àyíká náà, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì mọ́.
