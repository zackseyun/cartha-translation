  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: yo
  text: títí èmi yóò fi sọ àwọn ọ̀tá rẹ di àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ̀rọ̀ náà ní tààrà sí i, “títí èmi yóò fi fi àwọn ọ̀tá rẹ ṣe àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: títí èmi yóò fi
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí ààlà ìgbà kan ní ọjọ́ iwájú; “títí ... yóò fi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: θῶ
  choice: sọ ... di
  rationale: Bí ó tilẹ̀ jẹ́ pé τίθημι túmọ̀ ní pàtàkì sí “fi/sí,” nínú àwòrán inú Sáàmù 110:1 ó ní ìtumọ̀ àbájáde; “sọ ... di” ṣe àfihàn rẹ̀ lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: τοὺς ἐχθρούς σου
  choice: àwọn ọ̀tá rẹ
  rationale: Èyí túmọ̀ accusative object àti possessive pronoun náà tààrà láìrẹ̀wẹ̀sì ìtumọ̀ ìṣọ̀tá rẹ̀.
- source_word: ὑποπόδιον
  choice: àpótí ìtìsẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun èlò kékeré tí a fi ń ti ẹsẹ̀ lé; “àpótí ìtìsẹ̀” pa àwòrán náà mọ́ ní Yorùbá.
- source_word: τῶν ποδῶν σου
  choice: fún ẹsẹ̀ rẹ
  rationale: Ní ti gírámà, ó jẹ́ “ti àwọn ẹsẹ̀ rẹ,” ṣùgbọ́n “fún ẹsẹ̀ rẹ” jẹ́ àdánidá pẹ̀lú àpótí ìtìsẹ̀, ó sì pa àwòrán Gíríìkì mọ́ láìṣàlàyé rẹ̀ ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Àwòrán ìtẹríba àwọn ọ̀tá nínú àyọlò Sáàmù 110:1
  choice: Pa àkàwé “sọ àwọn ọ̀tá rẹ di àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ” mọ́.
  alternative: “fi àwọn ọ̀tá rẹ sí abẹ́ ẹsẹ̀ rẹ”
  rationale: Àyọlò náà ń bá Sáàmù 110:1 lọ, ó sì yẹ kí a pa àwòrán ọba àti Mèsáyà rẹ̀ mọ́ láìtúmọ̀ rẹ̀ sí ìṣẹ́gun pátápátá tàbí ìṣàkóso lọ́nà àfikún.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “àpótí ìtìsẹ̀” fún footstool, a sì pa àwòrán inú ẹsẹ náà mọ́.
