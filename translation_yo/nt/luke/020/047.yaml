  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbò: ‘jẹ ... run’ mú agbára àfiwé κατεσθίουσιν wá; ‘ilé àwọn opó’ pa àìdánilójú metonymy οἰκίας mọ́; ìṣe ọjọ́ iwájú nínú ‘yóò gba’ sì bá λήμψονται mu. Síbẹ̀, ‘bí àwáwí’ kò ṣe ìṣiṣẹ́ προφάσει dáadáa nínú gbolohun Yorùbá náà; ‘fún ìṣehàn’ fi ìwà ìfarahàn èké tí ọ̀rọ̀ náà ń tọ́ka sí hàn kedere.'
  naturalness: ‘Fún ìṣehàn’ jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àdúrà ìfarahàn mu. ‘Ń gbàdúrà fún ìgbà pípẹ́’ tún jẹ́ ìsọ̀rọ̀ òde òní tó móye ju ‘ń gbàdúrà pípẹ́’ lọ. Fífi ‘lọ’ kún ìfiwéra náà jẹ́ kí ‘tí ó le jù lọ’ péye nínú Yorùbá.
  terminology: A pa ‘ìdájọ́’ mọ́ fún κρίμα, dípò ‘ìdálẹ́bi,’ kí ìbú ọ̀rọ̀ Gíríìkì má bàa dín kù. ‘Ìṣehàn’ nínú àyíká yìí ń ṣàfihàn ìfẹ́ láti hàn níta, láìfi ẹ̀kọ́ tàbí èrò mìíràn kún ọ̀rọ̀ náà.
