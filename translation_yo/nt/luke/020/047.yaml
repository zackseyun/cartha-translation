  - severity: low
    issue: Ìfiwéra nínú ‘ìdájọ́ tí ó le jù’
    rationale: ‘Jù’ sábà máa ń nílò ‘lọ’ nínú ìkọ̀wé Yorùbá tó péye. ‘Tí ó le jù lọ’ jẹ́ ìsọ̀rọ̀ tó dáa jù, ó sì pa ìtumọ̀ περισσότερον mọ́.
