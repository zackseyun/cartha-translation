  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: yo
  text: àwọn tí wọ́n ń jẹ ilé àwọn opó run, tí wọ́n sì ń gbàdúrà fún ìgbà pípẹ́ fún ìṣehàn[a]. Àwọn wọ̀nyí yóò gba ìdájọ́ tí ó le jù lọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwáwí” tàbí “láti fi ṣe ìbojú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdálẹ́bi tí ó pọ̀ jù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: ń jẹ ... run
  rationale: Ọ̀rọ̀ yìí mú àwòrán jíjẹ ohun run wá, ó sì fi ìfiniṣèjẹ àti ìkógun hàn ní àfiwé, kì í ṣe jíjẹ ní ti gidi.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: ilé àwọn opó
  rationale: Èyí dúró sítòsí ọ̀rọ̀ Gíríìkì; ‘ilé’ tún lè tọ́ka sí ohun-ìní tàbí gbogbo ohun tí opó ní, láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: προφάσει
  choice: bí àwáwí
  rationale: Ó pa èrò ìṣehàn èké tàbí lílo àdúrà gẹ́gẹ́ bí ohun ìbojú mọ́, láìṣàlàyé ohun tí wọ́n ń fi í bo ju ohun tí Gíríìkì sọ lọ.
- source_word: μακρὰ προσεύχονται
  choice: ń gbàdúrà pípẹ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n ń lo àkókò gígùn nínú àdúrà.
- source_word: λήμψονται
  choice: yóò gba
  rationale: Ó sọ àbájáde ìdájọ́ ọjọ́ iwájú ní ọ̀nà tó ṣe déédé, tó sì ní ìwọ̀ntúnwọ̀nsì.
- source_word: περισσότερον κρίμα
  choice: ìdájọ́ tí ó le jù
  rationale: ‘Tí ó le jù’ sọ bí ìdájọ́ náà ṣe le tó ní àyíká ọ̀rọ̀ yìí, nígbà tí ‘ìdájọ́’ pa ìbú ọrọ̀ κρίμα mọ́ dípò yíyan ‘ìdálẹ́bi’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ κρίμα nínú àyíká ọ̀rọ̀
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ìdájọ́ Ọlọ́run tí kò dára ni, ṣùgbọ́n ‘ìdájọ́’ pa ìbú ọ̀rọ̀ Gíríìkì mọ́, kò sì dín in kù sí ìdálẹ́bi nìkan.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘jẹ ... run’ láti pa agbára àfiwé Gíríìkì mọ́; a sì lo ‘àwáwí’ àti ‘ìdájọ́’ láti yẹra fún ṣíṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ju orísun lọ.
