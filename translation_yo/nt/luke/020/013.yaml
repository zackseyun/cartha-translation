  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: yo
  text: Nígbà náà ni olówó ọgbà àjàrà náà sọ pé[a], ‘Kí ni èmi yóò ṣe? Èmi yóò rán ọmọkùnrin mi àyànfẹ́; bóyá wọn yóò bọ̀wọ̀ fún un.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ̀rọ̀ náà ní tààrà sí i, “olúwa ọgbà àjàrà náà.”
    reason: lexical_alternative
  - marker: b
    text: “Bọ̀wọ̀ fún” túmọ̀ ọ̀rọ̀ ìṣe kan tí ó tún lè túmọ̀ sí “tìjú níwájú” tàbí “fi ìtẹríba hàn sí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: olówó
  rationale: Nínú àkàwé iṣẹ́ àgbẹ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ọgbà àjàrà jẹ́ tirẹ̀. ‘Olówó ọgbà àjàrà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì yẹra fún fífi oyè ti ẹ̀kọ́ nípa Kristi lé ẹni inú ìtàn náà lórí.
- source_word: ἀμπελῶνος
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún vineyard, ibi tí wọ́n ti ń gbin àjàrà.
- source_word: Τί ποιήσω;
  choice: Kí ni èmi yóò ṣe?
  rationale: Ó pa ìbéèrè ìrònú ẹni sí ara rẹ̀ mọ́, pẹ̀lú ìtẹnumọ́ díẹ̀ lórí ‘èmi’ gẹ́gẹ́ bí ó ti bá ìpinnu tí ó tẹ̀ lé e mu.
- source_word: πέμψω
  choice: Èmi yóò rán
  rationale: Ó fi ìpinnu olówó náà hàn ní Yorùbá àdánidá.
- source_word: υἱόν
  choice: ọmọ
  rationale: Ní Yorùbá, ‘ọmọ’ lè tọ́ka sí ọmọkùnrin tàbí ọmọbìnrin, ṣùgbọ́n àyíká àti àrọ́pò-orúkọ ‘un’ kò tako pé ọmọkùnrin ni orísun Gíríìkì ń sọ. ‘Ọmọkùnrin’ jẹ́ yíyan mìíràn tí ó túmọ̀ akọ ní pàtó, ṣùgbọ́n ‘ọmọ mi àyànfẹ́’ dá ìró àdánidá àti ìṣọ̀kan pẹ̀lú èdè Lúùkù sí.
- source_word: ἀγαπητόν
  choice: àyànfẹ́
  rationale: ‘Àyànfẹ́’ jẹ́ ọ̀rọ̀ Yorùbá ọlọ́lá tí ó lè túmọ̀ ẹni tí a fẹ́ràn gidigidi, ó sì pa ìró pàtàkì ti gbolohun ‘ọmọ àyànfẹ́’ mọ́ láìfikún àlàyé.
- source_word: ἴσως
  choice: bóyá
  rationale: Ó ṣàfihàn ìrètí tí kò dájú ní Yorùbá ojoojúmọ́ tí ó bójú mu.
- source_word: τοῦτον
  choice: fún un
  rationale: Àrọ́pò-orúkọ Yorùbá ni ó dára jù lọ nínú gbolohun ‘bọ̀wọ̀ fún un’; àyíká fi hàn gbangba pé ọmọ náà ni a ń tọ́ka sí.
- source_word: ἐντραπήσονται
  choice: wọn yóò bọ̀wọ̀ fún un
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọ̀wọ̀ tàbí ìtẹríba hàn sí ẹnì kan. Ìtumọ̀ nípa títìjú níwájú rẹ̀ ṣì ṣeé ṣe, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé tí ẹni náà lè dúró fún Ọlọ́run
  choice: olówó ọgbà àjàrà
  alternative: olúwa ọgbà àjàrà
  rationale: Ìtumọ̀ yìí fi ẹni tí ọgbà jẹ́ tirẹ̀ hàn ní ipele ìtàn, ó sì jẹ́ kí òǹkàwé rí ìbájọ ẹ̀kọ́ nípa Ọlọ́run fúnra rẹ̀ láìfi oyè ‘Olúwa’ lé ọ̀rọ̀ náà lórí.
- issue: Ìró ẹ̀kọ́ nípa Kristi nínú τὸν υἱόν μου τὸν ἀγαπητόν
  choice: ọmọ mi àyànfẹ́
  alternative: ọmọ mi, ẹni tí mo fẹ́ràn
  rationale: ‘Ọmọ mi àyànfẹ́’ pa ìró tí ó jọ èdè nípa Ọmọ ní ìrìbọmi àti ìyípadà ògo nínú Lúùkù mọ́, láìṣàlàyé àkàwé náà ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: A lo Yorùbá boṣewa, ọlọ́lá, tí ó ṣeé yé fún òǹkàwé òde òní. A lo ‘olówó ọgbà àjàrà’ fún ìtumọ̀ àdánidá, a sì fi yíyan gangan ‘olúwa ọgbà àjàrà’ sínú àlàyé ìsàlẹ̀. Àwọn àmì ohùn àti àmì ẹsẹ̀ [a], [b] wà ní kíkún.
