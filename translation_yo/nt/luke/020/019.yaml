id: LUK.20.19
reference: Luke 20:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: yo
  text: Àwọn akọ̀wé àti àwọn olórí àlùfáà sì wá ọ̀nà láti gbé ọwọ́ lé e ní wákàtí náà gan-an[a], ṣùgbọ́n wọ́n bẹ̀rù àwọn ènìyàn, nítorí wọ́n mọ̀ pé ó sọ òwe yìí lòdì sí wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti mú un” tàbí “láti fi í sí àtìmọ́lé”; ní tààrà, “láti gbé ọwọ́ lé e.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pé ó sọ òwe yìí sí wọn” tàbí “nípa wọn.” Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé òwe náà dojú kọ wọ́n.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: wá ọ̀nà
  rationale: Ó fi ète àti ìgbìyànjú wọn hàn láìsọ pé wọ́n ṣàṣeyọrí.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ẹgbẹ́ àwọn amòfin ẹ̀sìn yìí, ó sì pa ìdánimọ̀ ẹgbẹ́ náà mọ́.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀pọ̀ ἀρχιερεῖς tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà, kì í ṣe ọ̀pọ̀ ẹni tí gbogbo wọn ń ṣe olórí àlùfáà ní àsìkò kan náà.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: láti gbé ọwọ́ lé e
  rationale: Ó pa àwòrán àsọyé Gíríìkì mọ́, ó sì lè túmọ̀ sí mímú un tàbí sísìnkú un sí àtìmọ́lé gẹ́gẹ́ bí àyíká ṣe fi hàn.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ní wákàtí náà gan-an
  rationale: Ó pa ìtẹnumọ́ àsìkò náà àti ìjẹ́kánjú mọ́.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: wọ́n bẹ̀rù àwọn ènìyàn
  rationale: λαός tọ́ka sí àwọn ènìyàn lápapọ̀ níbí, kì í ṣe ogunlọ́gọ̀ tí ó kàn péjọ nìkan.
- source_word: ἔγνωσαν
  choice: wọ́n mọ̀
  rationale: Ìtumọ̀ tààrà ni, ó sì fi ìdánimọ̀ wọn nípa ẹni tí òwe náà ń tọ́ka sí hàn.
- source_word: πρὸς αὐτοὺς
  choice: pa òwe yìí sí wọn
  rationale: Àsọyé Yorùbá yìí lè fi hàn pé òwe náà dojú kọ wọ́n, nígbà tí ó tún pa ìtumọ̀ ‘sí wọn’ mọ́ láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ jù.
- source_word: παραβολὴν
  choice: òwe
  rationale: ‘Òwe’ jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó sì lè ṣàpèjúwe ìtàn àkàwé olùkọ́ni nínú àyíká yìí.
theological_decisions:
- issue: Agbára ìtumọ̀ πρὸς αὐτοὺς nípa òwe Jésù
  choice: ó pa òwe yìí sí wọn
  alternative: ó pa òwe yìí lòdì sí wọn; ó pa òwe yìí nípa wọn
  rationale: Àyíká fi hàn pé àwọn aṣáájú náà mọ̀ pé òwe náà ń dá wọn lẹ́bi. ‘Pa òwe sí wọn’ pa ìdojúkọ náà mọ́, ṣùgbọ́n kò pa àwọn ìtumọ̀ ‘sí wọn’ tàbí ‘nípa wọn’ rẹ́ patapata.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Àwọn akọ̀wé’ àti ‘àwọn olórí àlùfáà’ pa ìdánimọ̀ àwọn ẹgbẹ́ ìtàn náà mọ́; àsọyé ‘gbé ọwọ́ lé e’ sì pa àwòrán orísun mọ́. Gbogbo àmì àlàyé [a], [b] wà nínú ẹsẹ̀ náà.
