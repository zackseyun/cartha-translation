base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: yo
  text: Ìbatisí Jòhánù, ṣé láti ọ̀run ni, tàbí láti ọ̀dọ̀ ènìyàn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀dọ̀ Ọlọ́run”; ní ti gidi, Gíríìkì ní, “láti ọ̀run,” òwe ìbọ̀wọ̀ tí a fi ń sọ nípa orísun tàbí àṣẹ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ìbatisí
  rationale: Ó tọ́ka sí ìṣe ìbatisí tí Jòhánù ń ṣe; ‘ìbatisí’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀, ó sì bá ìtumọ̀ nínú àyíká yìí mu.
- source_word: Ἰωάννου
  choice: Jòhánù
  rationale: Ìbátan onígbẹ̀yìn nínú Gíríìkì ni a fi hàn lọ́nà àdánidá gẹ́gẹ́ bí ‘Ìbatisí Jòhánù,’ ìyẹn ìbatisí tí ó ní í ṣe pẹ̀lú Jòhánù.
- source_word: ἐξ οὐρανοῦ
  choice: láti ọ̀run ni ó ti wá
  rationale: Èyí pa àwòrán Gíríìkì ‘láti ọ̀run’ mọ́, ó sì sọ orísun tàbí àṣẹ rẹ̀ ní Yorùbá àdánidá láì túmọ̀ ọ́ ní tààrà sí ‘lọ́dọ̀ Ọlọ́run.’
- source_word: ἐξ ἀνθρώπων
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: ‘Ènìyàn’ níbí jẹ́ ti gbogbo ènìyàn, kì í ṣe ti akọ nìkan; ó sì fi orísun ènìyàn ṣe ìyàtọ̀ sí orísun ọ̀run.
- source_word: ἦν
  choice: ni ó ti wá
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà jẹ́ copula ní Gíríìkì, ‘ni ó ti wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè nípa orísun ohun kan.
- source_word: ἢ
  choice: tàbí
  rationale: Ó fi àwọn àṣàyàn méjì tí ìbéèrè náà gbé kalẹ̀ yà sọ́tọ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘láti ọ̀run’ nípa ìbatisí Jòhánù
  choice: Pa ‘láti ọ̀run’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: láti ọ̀dọ̀ Ọlọ́run
  rationale: Gbólóhùn náà ń tọ́ka sí orísun tàbí àṣẹ láti ọ̀dọ̀ Ọlọ́run, ṣùgbọ́n Gíríìkì sọ ní pàtó pé ‘láti ọ̀run.’ Pípa àkànlò yìí mọ́ kò fi ìtumọ̀ kan lé e lórí ju ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò.
