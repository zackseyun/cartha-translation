source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: yo
  text: “Ẹ fi dẹ́nárì kan hàn mí.[a] Àwòrán àti àkọlé ẹni ta ni ó wà lórí rẹ̀?” Wọ́n dáhùn pé, “Ti Késárì ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dẹ́nárì jẹ́ owó Róòmù tí wọ́n sábà máa ń lò ní àsìkò náà; a pa orúkọ owó náà mọ́ kí ipò ìtàn náà lè hàn kedere.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Ẹ fi … hàn mí
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ tààrà, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ‘show me’ mu ní ti ẹ̀dá.
- source_word: δηνάριον
  choice: owó dẹ́nárì kan
  rationale: A pa orúkọ owó Róòmù náà mọ́ láti dáàbò bo ìtàn àti pàtó ọ̀rọ̀ Gíríìkì, a sì fi ‘owó’ kún un fún òye kedere.
- source_word: τίνος
  choice: ta ni
  rationale: Nínú ìbéèrè nípa àwòrán àti àkọlé tó wà lára owó, ‘ta ni’ jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ẹni tí wọ́n jẹ́ tirẹ̀ tàbí ẹni tí wọ́n ń tọ́ka sí.
- source_word: εἰκόνα
  choice: àwòrán
  rationale: ‘Àwòrán’ bo ìtumọ̀ likeness/image dáadáa, ó sì yẹ fún àwòrán ojú ẹni lórí owó.
- source_word: ἐπιγραφήν
  choice: àkọlé
  rationale: ‘Àkọlé’ níbí túmọ̀ sí ọ̀rọ̀ tí a kọ sí ara owó; ó ṣe kedere sí òǹkàwé òde òní ju gbólóhùn gígùn lọ.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Wọ́n dáhùn pé
  rationale: Èyí tú àkópọ̀ participle àti ọ̀rọ̀-ìṣe Gíríìkì sí Yorùbá tó rọrùn, láì pàdánù ìṣàn ìtàn.
- source_word: Καίσαρος
  choice: Ti Késárì ni
  rationale: A pa ìdáhùn kúkúrú oní-genitive náà mọ́ ní ọ̀nà Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘Ẹ’ gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn, bí fọ́ọ̀mù ọ̀rọ̀ Gíríìkì ṣe fi hàn.
