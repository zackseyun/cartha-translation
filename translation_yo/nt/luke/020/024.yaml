revisions:
- from: Ó ní, “Ẹ fi owó dẹ́nárì kan hàn mí.[a] Àwòrán àti àkọlé ta ni ó wà lára rẹ̀?” Wọ́n dáhùn pé, “Ti Késárì ni.”
  to: “Ẹ fi dẹ́nárì kan hàn mí.[a] Àwòrán àti àkọlé ẹni ta ni ó wà lórí rẹ̀?” Wọ́n dáhùn pé, “Ti Késárì ni.”
  rationale: A yọ àfikún tí kò sí nínú Gíríìkì kúrò, a sì tún ìbéèrè náà ṣe kí ìbáṣepọ̀ genitive “ti ta ni?” àti ipò àwòrán/àkọlé lórí owó le ṣe kedere. Àkọsílẹ̀ àlàyé náà ṣì pa ìtàn dẹ́nárì mọ́, pẹ̀lú èdè Yorùbá tó rọrùn.
  reviewer_model: gpt-5.6-terra
