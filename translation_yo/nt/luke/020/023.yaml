  text: κατανοήσας δὲ αὐτῶν τὴν πανουργίαν εἶπεν πρὸς ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó mọ àrékérekè wọn[a], ó wí fún wọn pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọgbọ́n àrékérekè,” “ẹ̀tàn,” tàbí “ìwà ẹ̀tàn.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ọgbọ́n tí kò tọ́ tí a fi ń tan ènìyàn jẹ tàbí tí a fi ń dẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: nígbà tí ó mọ
  rationale: Aorist participle náà fi hàn pé Jésù kọ́kọ́ mọ ohun tí wọ́n ń pète kí ó tó sọ̀rọ̀. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì mú ìfòyemọ̀ inú ọkàn jáde láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àmì ìyípadà tàbí ìtakora díẹ̀ nínú ìtàn; “Ṣùgbọ́n” bá bí Jésù ṣe dáhùn sí ète búburú wọn mu.
- source_word: αὐτῶν
  choice: wọn
  rationale: A lo ọ̀rọ̀ arọ́pò-orúkọ oníhun Yorùbá láti so πανουργίαν mọ́ àwọn ẹni tí wọ́n ń dán Jésù wò.
- source_word: πανουργίαν
  choice: ète àrékérekè
  rationale: πανουργία túmọ̀ sí ọgbọ́n búburú tí a fi ń pète láti tan ẹlòmíràn jẹ. “Ète àrékérekè” pa apá ìṣírò ọgbọ́n àti ìwà àìṣòótọ́ rẹ̀ mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: εἶπεν
  choice: ó wí
  rationale: Èyí jẹ́ ìtumọ̀ ìtàn tí ó bójú mu fún aorist λέγω, ó sì ní ìforúkọsílẹ̀ ọ̀wọ̀ tí ó yẹ fún ọ̀rọ̀ Bíbélì.
- source_word: πρὸς αὐτούς
  choice: fún wọn
  rationale: Lẹ́yìn ọ̀rọ̀ ìsọ̀rọ̀, πρός pẹ̀lú accusative tọ́ka sí àwọn tí a bá sọ̀rọ̀; “fún wọn” jẹ́ ìlò Yorùbá àdánidá níbí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. A yan “ó wí” dípò “ó sọ” láti bá ìṣàn ọ̀rọ̀ Bíbélì mu láìdi èdè náà sí àtijọ́ jù.
