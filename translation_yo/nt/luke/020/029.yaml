  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: yo
  text: Àwọn arákùnrin méje sì wà; ẹni àkọ́kọ́ fẹ́ aya[a], ó sì kú láìní ọmọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì ní, “mú aya”; ìtumọ̀ rẹ̀ nínú àyíká yìí ni “fẹ́ aya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: méje
  rationale: Nọ́ńbà náà túmọ̀ sí méje, ó sì ń ṣàpèjúwe iye àwọn arákùnrin.
- source_word: οὖν
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Ó ń so àpẹẹrẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú. Ìṣàn gbólóhùn Yorùbá ti fi ìbáṣepọ̀ náà hàn láìfi ọ̀rọ̀ bí ‘nítorí náà’ kún un, èyí tó lè mú ìtumọ̀ ìrònú rẹ̀ le ju ti Gíríìkì lọ.
- source_word: ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ọmọkùnrin tí wọ́n jẹ́ arákùnrin ara wọn nínú àpẹẹrẹ ìgbéyàwó yìí.
- source_word: ὁ πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Ó tọ́ka sí ẹni àkọ́kọ́ nínú ìtẹ̀lé náà, láìsọ pé òun ni àkọ́bí tàbí ẹni tó dàgbà jù.
- source_word: λαβὼν γυναῖκα
  choice: fẹ́ aya
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà jẹ́ àṣà-ọrọ fún gbígbéyàwó; ‘fẹ́ aya’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti àdánidá.
- source_word: ἀπέθανεν
  choice: ó sì kú
  rationale: Ìtumọ̀ tààrà àti kedere ni fún ọ̀rọ̀-ìṣe náà.
- source_word: ἄτεκνος
  choice: láìní ọmọ
  rationale: Ó fi hàn pé nígbà tó kú, kò ní ọmọ; ó tún pa ìjẹ́pàtàkì ọ̀rọ̀ náà mọ́ nínú àyíká òfin ìgbéyàwó.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Ẹni àkọ́kọ́’ yẹra fún fífi èrò pé òun ni àkọ́bí kún ọ̀rọ̀ náà; ‘láìní ọmọ’ sì ṣe kedere láìyí ìtumọ̀ padà.
