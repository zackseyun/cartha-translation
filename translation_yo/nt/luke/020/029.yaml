  rationale: Àtúnṣe náà yọ “kan” kúrò kí iye méje dúró gẹ́gẹ́ bí iye pàtó nínú ìpilẹ̀-ọrọ. A lo “sì” láti ṣàfihàn ìlọsíwájú ọ̀rọ̀ οὖν ní ọ̀nà tí kò fi ìbáṣepọ̀ ìrònú tó lágbára ju ti orísun lọ. A tún ṣe àtúnṣe àlàyé ẹsẹ̀-ìsàlẹ̀ kí ó ṣe ìyàtọ̀ láàárín ìtumọ̀ tààrà àti ìtumọ̀ àṣà-ọrọ Gíríìkì.
