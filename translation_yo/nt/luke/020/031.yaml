source:
  edition: SBLGNT
  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: yo
  text: Ẹ̀kẹta sì fẹ́ ẹ[a]; bákan náà, gbogbo àwọn méje náà kò fi ọmọ sílẹ̀, wọ́n sì kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbà á ṣe aya.” Gíríìkì sọ ní tààrà pé “mú un,” èyí tó jẹ́ ọ̀nà ìsọ̀rọ̀ fún gbígba obìnrin ṣe aya nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: ẹ̀kẹta
  rationale: Gíríìkì sọ ní tààrà pé ‘ẹ̀kẹta’ láì tún ‘arákùnrin’ sọ; Yorùbá lè pa àfohùn yìí mọ́ lọ́nà àdánidá.
- source_word: ἔλαβεν αὐτήν
  choice: fẹ́ ẹ
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó arọ́pò yìí, gbólóhùn náà túmọ̀ sí pé ó gbà á ṣe aya. ‘Fẹ́ ẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yẹ fún ọ̀rọ̀ yìí; fífi ‘mú un’ sílẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe rí lè dá òye rú.
- source_word: ὡσαύτως δὲ καὶ
  choice: bákan náà
  rationale: Ó fi hàn pé ohun kan náà ń ṣẹlẹ̀ lọ́wọ́ àwọn tó tẹ̀ lé e; ‘bákan náà’ jẹ́ Yorùbá àdánidá tó pa ìbáṣepọ̀ náà mọ́.
- source_word: οἱ ἑπτὰ
  choice: gbogbo àwọn méje náà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àpapọ̀ àwọn arákùnrin méje; ‘gbogbo’ mú ìtumọ̀ àpapọ̀ náà hàn kedere.
- source_word: οὐ κατέλιπον τέκνα
  choice: kò fi ọmọ sílẹ̀
  rationale: καταλείπω pẹ̀lú τέκνα túmọ̀ sí pé wọn kò fi ọmọ tàbí irú-ọmọ kankan sílẹ̀ nígbà ikú; gbólóhùn Yorùbá yìí pa ìsopọ̀ mọ́ ikú mọ́.
- source_word: τέκνα
  choice: ọmọ
  rationale: ‘Ọmọ’ ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bójú mu fún τέκνα nínú àyíká yìí.
- source_word: ἀπέθανον
  choice: wọ́n sì kú
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘kú’ ní tààrà; a kò rọ ọ̀rọ̀ náà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ọ̀pọ̀-orúkọ ‘wọ́n’ lẹ́yìn àkójọpọ̀ àwọn méje gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
