source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: yo
  text: Wọ́n lé e jáde kúrò nínú ọgbà àjàrà, wọ́n sì pa á. Nítorí náà, kí ni olúwa ọgbà àjàrà náà[a] yóò ṣe sí wọn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ni ọgbà àjàrà náà” tàbí “ọ̀gá ọgbà àjàrà náà.” Ọ̀rọ̀ Gíríìkì náà ni kyrios, tí a sábà máa ń túmọ̀ sí “Olúwa” nígbà tí ó bá jẹ́ oyè; ṣùgbọ́n níbí, ó ń tọ́ka sí ẹni tí ó ni ọgbà àjàrà nínú òwe náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Lẹ́yìn tí wọ́n sì lé e jáde
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú pípa rẹ̀. ‘Lé e jáde’ jẹ́ Yorùbá àdánidá tí ó sì fi agbára ìléjáde hàn.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: kúrò nínú ọgbà àjàrà
  rationale: Gbólóhùn náà ń tọ́ka sí gbígbé ẹni kan láti inú ọgbà lọ sí òde; ‘kúrò nínú’ sọ ìṣípò yìí ní kedere ní Yorùbá.
- source_word: ἀπέκτειναν
  choice: wọ́n pa á
  rationale: Èyí ni ìtumọ̀ tààrà fún pípa ènìyàn, láìfi àfikún ìdájọ́ bí ‘wọ́n ṣìkà pa á’ sínú ọ̀rọ̀ Gíríìkì.
- source_word: τί οὖν
  choice: Nítorí náà, kí ni
  rationale: Ó pa agbára ìyọrísí οὖν mọ́, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìbéèrè náà ní Yorùbá.
- source_word: ποιήσει ... αὐτοῖς
  choice: yóò ṣe sí wọn
  rationale: ποιέω níbí jẹ́ ọ̀rọ̀ gbòòrò nípa ìgbésẹ̀ tí yóò gbé, αὐτοῖς sì ń tọ́ka sí àwọn àgbẹ̀ náà gẹ́gẹ́ bí ẹni tí ìgbésẹ̀ náà yóò kàn.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: olúwa ọgbà àjàrà náà
  rationale: ‘Olúwa’ lè túmọ̀ sí ẹni tó ni tàbí ọ̀gá ohun kan ní àyíká òwe yìí, ó sì pa ìbáṣepọ̀ lexical pẹ̀lú κύριος mọ́ láìjẹ́ kí a fi dandan mú un gẹ́gẹ́ bí oyè Ọlọ́run.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος níbi tí ó ti ń tọ́ka sí ẹni inú òwe, kì í ṣe oyè Ọlọ́run ní tààrà
  choice: olúwa ọgbà àjàrà
  alternative: ẹni tó ni ọgbà àjàrà; ọ̀gá ọgbà àjàrà
  rationale: Nínú ìtàn òwe náà, ẹni tó ni ọgbà àjàrà ni ọ̀rọ̀ náà ń tọ́ka sí. ‘Olúwa’ pa ìwọ̀n ìtumọ̀ κύριος mọ́, àlàyé ìsàlẹ̀ sì mú kí ó ṣe kedere pé iṣẹ́ rẹ̀ nínú ìtàn ni a ń sọ, láìsẹ́ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan sí i.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Lé e jáde kúrò nínú’ sọ ìléjáde ní kedere; ‘wọ́n pa á’ sì jẹ́ kúkúrú, tààrà, láìṣàfikún ìtumọ̀ tí kò sí nínú orísun.
