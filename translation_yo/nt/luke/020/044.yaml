source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: yo
  text: Nítorí náà, Dáfídì ń pè é ní Olúwa; báwo sì ni ó ṣe jẹ́ ọmọ rẹ̀[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àtọmọdọ́mọ rẹ̀.’ Ọ̀rọ̀ Gíríìkì náà ní, ‘ọmọ rẹ̀’; nínú ọ̀rọ̀ ìran ọba, èyí lè túmọ̀ sí àtọmọdọ́mọ. Ṣùgbọ́n ọ̀rọ̀ inú ẹsẹ̀ náà pa ọ̀rọ̀ tí a sọ ní kedere mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Èyí ni ìkọ̀wé orúkọ Dáfídì tí ó wọ́pọ̀, tí ó sì ṣe déédé ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìbéèrè yìí jẹ́ àbájáde ọ̀rọ̀ tí a ṣẹ̀ṣẹ̀ tọ́ka sí, ó sì pa agbára ìtumọ̀ ìdáláre ọ̀rọ̀ Gíríìkì mọ́.
- source_word: αὐτὸν κύριον
  choice: ń pè é ní ‘Olúwa’
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ‘ó pè é ní Olúwa.’ ‘Olúwa’ pa ọlá àti ipò gíga tí κύριος ní nínú àríyànjiyàn Mèsáyà yìí mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: καλεῖ
  choice: ń pè
  rationale: Àkókò ìṣe tí ń lọ ní báyìí bá ọ̀rọ̀-ìṣe Gíríìkì ti àsìkò ìsinsìnyí mu, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìṣe yìí ní Yorùbá.
- source_word: πῶς
  choice: báwo
  rationale: Èyí ni ìtumọ̀ Yorùbá tààrà àti àdánidá fún ìbéèrè ọ̀nà tàbí bí ohun kan ṣe rí.
- source_word: αὐτοῦ υἱός
  choice: ọmọ rẹ̀
  rationale: ‘Ọmọ rẹ̀’ pa ọ̀rọ̀ υἱός mọ́, ó sì tún lè ní agbára ìtumọ̀ ìran tàbí àtọmọdọ́mọ gẹ́gẹ́ bí àyíká ọba ṣe lè béèrè. A kò yí i sí ‘àtọmọdọ́mọ’ nínú ẹsẹ̀ pàtàkì, kí ìforígbárí inú ìbéèrè náà má bàa rọ̀.
- source_word: ἐστιν
  choice: ó ṣe jẹ́
  rationale: Nínú ìbéèrè ‘báwo ni ó ṣe jẹ́...,’ ọ̀nà yìí ni Yorùbá àdánidá fún ‘is,’ ó sì pa ìbéèrè àsọyé náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú àríyànjiyàn nípa Mèsáyà àti Kristi
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ ọlá àti ipò gíga tí Dáfídì fi fún ẹni náà mọ́. ‘Ọ̀gá’ ṣeé ṣe ní apá kan, ṣùgbọ́n ó lè dín agbára àkọlé náà kù nínú àyíká Sáàmù 110.
- issue: Bóyá kí υἱός di ‘àtọmọdọ́mọ’ nínú ẹsẹ̀ pàtàkì
  choice: ọmọ rẹ̀
  alternative: àtọmọdọ́mọ rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘ọmọ,’ ìbéèrè Jésù sì gbára lé ìpè yẹn. Bí ó tilẹ̀ jẹ́ pé ‘ọmọ’ lè tọ́ka sí àtọmọdọ́mọ nínú ọ̀rọ̀ ìran ọba, fífi ‘àtọmọdọ́mọ’ sínú ẹsẹ̀ pàtàkì yóò tú díẹ̀ lára ìforígbárí tí ẹsẹ̀ náà fẹ́ pa mọ́.
translation_notes:
  register: A lo Yorùbá àkókò yìí tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. ‘Báwo wá ni’ mú ìtẹ̀sí ìbéèrè àsọyé náà jáde, nígbà tí àmì àyọlò yí ‘Olúwa’ ká fi hàn pé èyí ni àkọlé tí Dáfídì fi ń pe ẹni náà. A gbé àmì àlàyé [a] lẹ́yìn ‘ọmọ rẹ̀,’ nítorí ibẹ̀ ni àlàyé ‘àtọmọdọ́mọ’ ti jẹ mọ́.
