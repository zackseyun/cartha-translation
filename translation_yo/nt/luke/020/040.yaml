  text: οὐκέτι ⸀γὰρ ἐτόλμων ἐπερωτᾶν αὐτὸν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/040.yaml
  text: For they no longer dared to ask him anything.
translation:
  language: yo
  text: Nítorí wọn kò sì tún láyà láti bi í ní ohunkóhun mọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: kò sì tún … mọ́
  rationale: Àkópọ̀ ‘kò tún … mọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé ohun tí wọ́n ń ṣe tẹ́lẹ̀ ti dáwọ́ dúró; ‘sì’ tún so gbólóhùn náà mọ́ àyíká rẹ̀.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé tàbí ìdí mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐτόλμων
  choice: láyà
  rationale: Ọ̀rọ̀ ‘láyà’ sọ àìní ìgboyà láti ṣe ohun kan ní Yorùbá àdánidá; pẹ̀lú ‘kò tún … mọ́,’ ó mú ìtumọ̀ ìṣe tí ó dáwọ́ dúró jáde.
- source_word: ἐπερωτᾶν
  choice: láti bi … ní
  rationale: ‘Bi ẹnìkan ní ohun kan’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ṣíṣe ìbéèrè ní àyíká yìí.
- source_word: αὐτὸν
  choice: í
  rationale: Arọ́pò-orúkọ olùgbà ‘í’ tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọ́n fẹ́ bi ní ìbéèrè.
- source_word: οὐδέν
  choice: ohunkóhun
  rationale: Nínú gbólóhùn àìsọ̀rọ̀ bẹ́ẹ̀, ‘ohunkóhun’ fi ìwọ̀n gbogbo ohun tí wọn kò láyà láti béèrè hàn lọ́nà àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Kò sí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí a fi kún un.
