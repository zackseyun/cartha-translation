source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá sọ pé, ‘Láti ọ̀dọ̀ ènìyàn ni,’ gbogbo àwọn ènìyàn yóò fi òkúta sọ wá, nítorí ó dá wọn lójú pé wòlíì ni Jòhánù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “pé Jòhánù jẹ́ wòlíì.” Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ kò fi àsìkò pàtó hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ṣùgbọ́n bí a bá sọ pé
  rationale: ‘Bí ... bá’ fi ipò àní-àní tí ἐὰν pẹ̀lú subjunctive hàn ní Yorùbá àdánidá; ‘Ṣùgbọ́n’ sì pa ipa ìtakora δέ mọ́.
- source_word: Ἐξ ἀνθρώπων
  choice: Láti ọ̀dọ̀ ènìyàn ni
  rationale: Ó pa àkótán ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí orísun ìrìbọmi tàbí àṣẹ Jòhánù láì ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ὁ λαὸς ἅπας
  choice: gbogbo àwọn ènìyàn
  rationale: Ó mú ìtumọ̀ àpapọ̀ λαός àti ìtẹnumọ́ ἅπας jáde ní ọ̀nà tó ṣe déédéé ní Yorùbá.
- source_word: καταλιθάσει
  choice: yóò sọ wá ní òkúta
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún fífi òkúta kọlu ẹni; a kò fi ‘pa wá’ kún un, nítorí ọ̀rọ̀ Gíríìkì kò sọ ikú ní tààrà.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: nítorí ó dá wọn lójú
  rationale: Ọ̀rọ̀ náà fi ìdánilójú àwọn ènìyàn hàn; ọ̀pọ̀-orúkọ ‘wọn’ bá àkójọpọ̀ ‘gbogbo àwọn ènìyàn’ mu ní Yorùbá.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: pé wòlíì ni Jòhánù
  rationale: Àwọn ọ̀rọ̀ Yorùbá yìí jẹ́ àìlásìkò bí infinitive εἶναι, nítorí náà ó lè tọ́ka sí ipò Jòhánù ní àkókò ìgbàgbọ́ wọn láì fi ‘jẹ́’ tàbí ‘jẹ́ nígbà náà’ yanju àní-àní náà.
theological_decisions:
- issue: Bí a ṣe máa sọ ìgbà tí àwọn ènìyàn ka Jòhánù sí wòlíì
  choice: pé wòlíì ni Jòhánù
  alternative: pé Jòhánù jẹ́ wòlíì
  rationale: Infinitive εἶναι fúnra rẹ̀ kò sọ àsìkò. Ìṣètò ‘wòlíì ni Jòhánù’ jẹ́ ti Yorùbá àdánidá, ó sì pa àìdánilójú àsìkò náà mọ́ dípò yíyan ‘jẹ́’ gẹ́gẹ́ bí ohun tó ti kọjá tàbí ‘ṣì jẹ́’ gẹ́gẹ́ bí ohun tó wà lọ́wọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘wòlíì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí ó ti wọ́pọ̀.
