source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: yo
  text: Jésù sì sọ fún wọn pé, “Èmi náà kì yóò sọ fún yín irú àṣẹ tí mo fi ń ṣe àwọn nǹkan wọ̀nyí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jésù sì sọ fún wọn pé
  rationale: ‘Sì’ so ìdáhùn Jésù mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá, ‘sọ fún wọn’ sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: Οὐδὲ ἐγώ
  choice: Èmi náà kì yóò
  rationale: Èyí fi ìdáhùn Jésù wé bí àwọn aṣáájú náà ṣe kọ̀ láti dáhùn ní ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: λέγω ὑμῖν
  choice: sọ fún yín
  rationale: Nínú àyíká yìí, λέγω túmọ̀ sí fífi ìdáhùn kan hàn fún wọn; ‘sọ fún yín’ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: irú àṣẹ wo ni mo fi
  rationale: ‘Àṣẹ’ ń tọ́ka sí ẹ̀tọ́ tàbí ọlá-àṣẹ tí ẹnìkan fi ń ṣe ohun kan, kì í ṣe agbára lásán; ìlànà ‘ni mo fi’ sọ ìpìlẹ̀ tàbí àṣẹ tí iṣẹ́ náà dúró lé lórí.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀-nọ́mbà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí àwọn iṣẹ́ Jésù tí wọ́n ń bi í léèrè nípa wọn.
- source_word: ποιῶ
  choice: ń ṣe
  rationale: Àmì ‘ń’ fi iṣe tó ń lọ tàbí tó jẹ́ àṣà hàn lọ́nà àdánidá nínú Yorùbá.
theological_decisions:
- issue: Kíkọ̀ Jésù láti dá àwọn aṣáájú lóhùn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkọ̀ tààrà láti sọ orísun àṣẹ rẹ̀ fún wọn, láìfi àlàyé ìtumọ̀ ẹ̀sìn kún un.
  alternative: Láti mú kí ọ̀rọ̀ náà dà bí ẹni pé Jésù ń yẹra fún ìbéèrè wọn tàbí pé ó ń kéde ìdájọ́ lórí àìgbàgbọ́ wọn ní kedere.
  rationale: Ẹsẹ yìí sọ pé Jésù kò ní sọ àṣẹ tí ó fi ń ṣe àwọn nǹkan wọ̀nyí; kò sọ ìdí rẹ̀ ní tààrà, nítorí náà a pa ìṣòro àti agbára ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Kò sí àlàyé ẹsẹ̀ ìsàlẹ̀ nítorí ‘àṣẹ tí mo fi’ ni ọ̀nà Yorùbá àdánidá tó gba ìtumọ̀ ‘by/with what authority’ sínú ara ẹsẹ náà láìní àfidípò lexical.
