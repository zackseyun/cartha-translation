source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: yo
  text: 'Nígbà náà, ó bẹ̀rẹ̀ sí í sọ àkàwé yìí fún àwọn ènìyàn pé: “Ọkùnrin kan gbin ọgbà àjàrà kan, ó yá a fún àwọn àgbẹ̀, ó sì lọ sí ibòmíràn[a] fún ìgbà pípẹ́.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó lọ sí ilẹ̀ òkèèrè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹni kan jìnnà kúrò ní agbègbè ilé rẹ̀, títí kan lílọ sí orílẹ̀-èdè mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Nígbà náà, ó bẹ̀rẹ̀ sí í
  rationale: Ó fi ìlọsíwájú ìtàn tí δέ ń tọ́ka sí hàn, ó sì pa ìtumọ̀ ìbẹ̀rẹ̀ ọ̀rọ̀ inú ἤρξατο mọ́ ní Yorùbá àdánidá.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: sọ ... fún àwọn ènìyàn
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún sísọ ohun kan sí àwùjọ; “àwọn ènìyàn” pa ìtumọ̀ àpapọ̀ λαός mọ́ láì sọ ọ́ di ogunlọ́gọ̀ ní dandan.
- source_word: τὴν παραβολὴν ταύτην
  choice: àkàwé yìí
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ìtàn àpẹẹrẹ, ó sì yà á sọ́tọ̀ sí òwe kúkúrú.
- source_word: Ἄνθρωπος
  choice: Ọkùnrin kan
  rationale: Ọ̀rọ̀ Gíríìkì náà ń fi ẹni akọ kan hàn nínú ìtàn yìí; “ọkùnrin kan” pa èyí mọ́.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: gbin ọgbà àjàrà kan
  rationale: “Gbin” túmọ̀ φυτεύω ní tààrà, “ọgbà àjàrà” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ἀμπελών.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ó fi í yá fún àwọn àgbẹ̀
  rationale: “Fi í yá” sọ ètò lílo ohun ìní fún àkókò kan, “àwọn àgbẹ̀” sì dúró fún àwọn olùṣọ́gbà tàbí agbẹ̀ tí γεωργοί ń tọ́ka sí.
- source_word: ἀπεδήμησεν
  choice: ó sì kúrò níbẹ̀
  rationale: Yíyan yìí pa ìtumọ̀ pé ó lọ kúrò ní agbègbè náà mọ́ láì pinnu bóyá ó dé ilẹ̀ òkèèrè, ohun tí ọ̀rọ̀ náà lè túmọ̀ sí ṣùgbọ́n tí kò fi dandan múlẹ̀.
- source_word: χρόνους ἱκανούς
  choice: fún ìgbà pípẹ́
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí àkókò tó pọ̀ tàbí tó gùn; “fún ìgbà pípẹ́” jẹ́ Yorùbá àdánidá tó mú ìtumọ̀ náà jáde.
theological_decisions:
- issue: Ìdánimọ̀ akọ nínú Ἄνθρωπος
  choice: Ọkùnrin kan
  alternative: Ẹnì kan
  rationale: Nínú àkàwé náà, ẹni tí a mú wọlé jẹ́ ọkùnrin kan pàtó; a kò sọ ọ́ di ọ̀rọ̀ gbogbogbò nípa ènìyàn.
- issue: Ibi tí ẹni náà lọ nínú ἀπεδήμησεν
  choice: ó kúrò níbẹ̀
  alternative: ó lọ sí ilẹ̀ òkèèrè
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí jíjìnà sí ilẹ̀ ẹni, títí kan lílọ sí òkèèrè, ṣùgbọ́n kò sọ ibi tí ó lọ ní pàtó. Àkọ́kọ́ pa àìdájú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Àkàwé” ni a lò dípò “òwe” kí irú ìtàn náà lè ṣe kedere sí òǹkàwé lónìí.
