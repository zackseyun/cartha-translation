id: LUK.20.35
reference: Luke 20:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn tí a ti kà sí ẹni tí ó yẹ láti ní ìpín nínú ìgbà náà[b] àti nínú àjíǹde kúrò láàárín àwọn òkú, wọn kì í gbéyàwó, bẹ́ẹ̀ ni a kì í fi wọ́n fún ẹni mìíràn ní ìgbéyàwó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì í fẹ́ ọkọ tàbí aya, bẹ́ẹ̀ ni a kì í fi wọ́n fún ẹni mìíràn ní ìgbéyàwó.” Ọ̀rọ̀ Gíríìkì kejì jẹ́ aláìṣe, ó sì yàtọ̀ sí ọ̀rọ̀ àkọ́kọ́ fún ìgbéyàwó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbà tí ń bọ̀.” Ní tààràtà, “ìgbà náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: àwọn tí a bá kà sí ẹni yíyẹ
  rationale: 'Ó pa ìtumọ̀ aláìṣe (passive) mọ́: àwọn tí a ṣe ìdájọ́ pé wọ́n yẹ, kì í ṣe ìsọ pé wọ́n ní yíyẹ nínú ara wọn.'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ayé ìgbà náà
  rationale: ‘Ayé ìgbà’ sọ αἰών gẹ́gẹ́ bí sáà tàbí ètò ayé kan, ‘náà’ sì pa atọ́ka ἐκείνου mọ́ láì fi ‘tí ń bọ̀’ kún ọ̀rọ̀ pàtó náà.
- source_word: τυχεῖν
  choice: láti ní ìpín nínú
  rationale: Nínú ìlò rẹ̀ pẹ̀lú ọ̀rọ̀ inú genitive, ó túmọ̀ sí láti rí tàbí ní ohun kan; ‘ní ìpín nínú’ jẹ́ Yorùbá àdánidá tí ó bá àwọn ohun méjèèjì—ayé ìgbà náà àti àjíǹde—mu.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: àjíǹde kúrò láàárín àwọn òkú
  rationale: Ó fi agbára ἐκ hàn pé jíǹde náà jẹ́ kíkúrò láàárín àwọn òkú, láì pinnu àwọn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò ṣàlàyé.
- source_word: γαμοῦσιν
  choice: wọn kì í gbéyàwó
  rationale: ‘Gbéyàwó’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fífi ìgbéyàwó sílẹ̀; nínú gbolohun méjì yìí ó dúró fún ipa ẹni tí ń fẹ́.
- source_word: γαμίζονται
  choice: a kì í sì í fi wọn fún ẹlòmíràn ní ìgbéyàwó
  rationale: 'Ó pa ìyàtọ̀ sí γαμοῦσιν àti ìtumọ̀ aláìṣe mọ́: ẹlòmíràn ni ó fi ẹni náà fún ọkọ tàbí aya ní ìgbéyàwó.'
theological_decisions:
- issue: Bóyá καταξιωθέντες túmọ̀ sí pé ènìyàn fi iṣẹ́ tirẹ̀ jèrè ìyè àjíǹde
  choice: àwọn tí a bá kà sí ẹni yíyẹ
  alternative: àwọn tí ó yẹ fún ayé ìgbà náà
  rationale: Ìtumọ̀ yìí pa ìdájọ́ tàbí ìkà-sí-yíyẹ tó wà nínú fọ́ọ̀mù aláìṣe Gíríìkì mọ́, ṣùgbọ́n kò sọ ẹni tó ń ṣe ìdájọ́ ní pàtó, bẹ́ẹ̀ ni kò sọ pé wọ́n fi ẹ̀tọ́ ara wọn jèrè rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘ayé ìgbà’ fún αἰών láti yẹra fún ìdàrúdàpọ̀ pẹ̀lú ‘ọ̀rúndún’; a sì pa ìtumọ̀ aláìṣe àti ìyàtọ̀ àwọn ọ̀rọ̀ ìgbéyàwó méjì mọ́. Gbogbo àmì àlàyé [a], [b] wà nínú ẹsẹ̀.
