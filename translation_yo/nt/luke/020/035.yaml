  to: Ṣùgbọ́n àwọn tí a ti kà sí ẹni tí ó yẹ láti ní ìpín nínú ìgbà náà[b] àti nínú àjíǹde kúrò láàárín àwọn òkú, wọn kì í gbéyàwó, bẹ́ẹ̀ ni a kì í fi wọ́n fún ẹni mìíràn ní ìgbéyàwó.[a]
