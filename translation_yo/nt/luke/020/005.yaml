id: LUK.20.5
reference: Luke 20:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n jíròrò láàárín ara wọn pé, “Bí a bá sọ pé, ‘Láti ọ̀run,’ yóò sọ pé, ‘Èé ṣe tí ẹ kò fi gba ọ̀rọ̀ rẹ̀ gbọ́?[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò fi gbẹ́kẹ̀ lé e?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gba ọ̀rọ̀ ẹni gbọ́” tàbí “gbẹ́kẹ̀ lé ẹni,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: wọ́n jíròrò láàárín ara wọn
  rationale: Àpapọ̀ ọ̀rọ̀ náà ṣàpèjúwe bí ẹgbẹ́ kan ṣe ń ronú, tí wọ́n sì ń bá ara wọn gbèrò. ‘Jíròrò láàárín ara wọn’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfọ̀rọ̀wérọ̀ onírònú mọ́.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú ìtàn Yorùbá, ‘pé’ ló ṣe àfihàn ọ̀rọ̀ tí ó tẹ̀ lé lọ́nà àdánidá, láìjẹ́ dandan láti túmọ̀ participle náà sí ‘wọ́n ń sọ pé’ lọ́tọ̀.
- source_word: Ἐὰν εἴπωμεν
  choice: Bí a bá sọ pé
  rationale: Èyí ń fi ipò àìdánilójú hàn lọ́nà Yorùbá tó ṣe déédé pẹ̀lú third-class condition Gíríìkì.
- source_word: Ἐξ οὐρανοῦ
  choice: Láti ọ̀run
  rationale: Ó pa àkànlò èdè Gíríìkì mọ́, dípò lílo ‘Láti ọ̀dọ̀ Ọlọ́run,’ èyí tí yóò túmọ̀ ìtumọ̀ inú rẹ̀ síta ju bí orísun ṣe sọ lọ.
- source_word: ἐρεῖ
  choice: yóò sọ pé
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘yóò sọ’; ìbéèrè inú àyọlò tó tẹ̀ lé fúnra rẹ̀ ló ń mú kí ó dà bí ìbéèrè.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: ẹ kò fi gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: πιστεύω pẹ̀lú dative níbí tọ́ka sí gbígba ẹ̀rí tàbí ọ̀rọ̀ ẹni náà gbọ́. Ìtumọ̀ yìí yẹra fún ‘gbà á gbọ́’ tí ó lè dún bí ìgbàgbọ́ sínú ẹni náà ní ọ̀nà tó lágbára ju ohun tí syntax béèrè lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘Láti ọ̀run’ gẹ́gẹ́ bí orísun tàbí àṣẹ ìbatisí Johanu
  choice: Pa àkànlò ‘Láti ọ̀run’ mọ́
  alternative: Láti ọ̀dọ̀ Ọlọ́run
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí orísun àti àṣẹ àtọ̀runwá, ṣùgbọ́n Gíríìkì fúnra rẹ̀ lo ‘ọ̀run.’ Pípa rẹ̀ mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ πιστεύω pẹ̀lú αὐτῷ
  choice: gba ọ̀rọ̀ rẹ̀ gbọ́
  alternative: gbẹ́kẹ̀ lé e / ní ìgbàgbọ́ nínú rẹ̀
  rationale: Àyíká ọ̀rọ̀ náà dá lórí bóyá wọ́n gba ẹ̀rí Johanu gbọ́, kì í ṣe dandan ìgbàgbọ́ ìgbàlà tàbí ìgbẹ́kẹ̀lé ara ẹni tó jinlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘jíròrò láàárín ara wọn’ láti ṣọ̀kan ìrònú àti ìfọ̀rọ̀wérọ̀ ẹgbẹ́ tí συνελογίσαντο πρὸς ἑαυτοὺς ń fi hàn. Àmì ohùn ni a fi sí ibi tí ó yẹ.
