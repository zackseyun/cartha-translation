  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí ìtumọ̀ Gíríìkì: àkókò tí ó yẹ, rírán ẹrú sí àwọn àgbẹ̀ ọgbà àjàrà, ète láti gba apá kan nínú èso, lílù ú, àti rírán án lọ ní òfo. Ṣùgbọ́n “rán an padà” lè fi ìtumọ̀ ‘back/return’ kún ἐξαπέστειλαν, níbi tí ọ̀rọ̀ Gíríìkì ti ń tẹnu mọ́ rírán án lọ/kúrò.'
