source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: yo
  text: Ní àkókò tí ó yẹ, ó rán ẹrú kan[a] sí àwọn àgbẹ̀ ọgbà àjàrà, kí wọ́n lè fún un ní díẹ̀ nínú èso ọgbà àjàrà náà. Ṣùgbọ́n àwọn àgbẹ̀ náà lù ú, wọ́n sì rán án lọ́wọ́ òfo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìránṣẹ́”; “ẹrú” mú ipò ẹni tí ó wà lábẹ́ olúwa hàn kedere sí i ní àyíká yìí.
    reason: alternative_reading
  - marker: b
    text: Ní ti gidi, “ní òfo”; ìyẹn ni pé, wọ́n kò fún un ní èso ọgbà àjàrà kankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: ní àkókò tí ó yẹ
  rationale: Ó fi àkókò tí ó bójú mu tàbí tí a yàn hàn, láì fi kún un pé àkókò ìkórè gan-an ni.
- source_word: γεωργούς
  choice: àwọn àgbẹ̀ ọgbà àjàrà
  rationale: Ọ̀rọ̀ yìí dá iṣẹ́ àgbẹ̀ nínú ọgbà àjàrà mọ́, láì pinnu ní tààrà pé ayálégbé ni wọ́n.
- source_word: δοῦλον
  choice: ẹrú
  rationale: ‘Ẹrú’ pa ipò ẹni tí ó wà lábẹ́ àṣẹ olúwa mọ́ ní kedere; ‘ìránṣẹ́’ tún lè jẹ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ní àwọn àyíká kan.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: kí wọ́n lè fún un
  rationale: Ìtúmọ̀ yìí sọ ète tí ó fi rán ẹrú náà lọ ní Yorùbá àdánidá.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: lára èso ọgbà àjàrà náà
  rationale: ‘Lára’ mú ìtumọ̀ pé apá kan nínú èso náà ni, láì sọ iye tàbí ẹ̀tọ́ òfin kan tí Gíríìkì kò sọ.
- source_word: ἐξαπέστειλαν ... δείραντες
  choice: lù ú, wọ́n sì rán an padà
  rationale: 'Ó pa ìṣe méjèèjì mọ́: wọ́n kọ́kọ́ lù ú, lẹ́yìn náà wọ́n rán an kúrò.'
- source_word: κενόν
  choice: lọ́wọ́ òfo
  rationale: Àpólà Yorùbá yìí sọ ní àdánidá pé kò gba ohunkóhun padà, ó sì bá ‘empty’ mu ní àyíká yìí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Àwọn àgbẹ̀ ọgbà àjàrà’ yàgò fún fífi ipò òfin ayálégbé kún ọ̀rọ̀ náà, ‘lọ́wọ́ òfo’ sì jẹ́ àpólà Yorùbá àdánidá.
