  text: καὶ προσέθετο ⸂τρίτον πέμψαι⸃· οἱ δὲ καὶ τοῦτον τραυματίσαντες ἐξέβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: yo
  text: Ó sì tún rán ìránṣẹ́ kẹta[a]; ṣùgbọ́n wọ́n ṣe é ní ọgbẹ́, wọ́n sì jù ú síta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, Gíríìkì ní, “ó fi kún un láti rán ẹnìkẹta,” ìsọ̀rí ọ̀rọ̀ kan tí ó túmọ̀ sí “ó tún rán ẹnìkẹta” tàbí “ó tẹ̀ síwájú láti rán ẹnìkẹta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Ó sì tún rán
  rationale: Ọ̀rọ̀ náà pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni túmọ̀ sí pé ó tẹ̀ síwájú láti ṣe ohun kan. “Tún rán” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìtẹ̀síwájú àti àtúnṣe ìṣe náà hàn.
- source_word: τρίτον πέμψαι
  choice: rán ìránṣẹ́ kẹta
  rationale: Ní Gíríìkì, ohun tí a rán kò tún farahàn nítorí àyíká ọ̀rọ̀ ti fi hàn pé ìránṣẹ́ ni. Fífi “ìránṣẹ́” kún un mú Yorùbá ṣe kedere, láì yí ohun tí àyíká ọ̀rọ̀ sọ padà.
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: δέ yí ìtàn padà sí ìhùwàsí àwọn ayálégbé, ó sì ní agbára ìtakora níbí; “Ṣùgbọ́n” mú ìtakora náà hàn ní Yorùbá.
- source_word: καὶ τοῦτον
  choice: ẹni yìí náà
  rationale: “Náà” fi hàn pé ohun burúkú kan náà ṣẹlẹ̀ sí ìránṣẹ́ yìí pẹ̀lú, ó sì pa ìtẹnumọ́ καί mọ́.
- source_word: τραυματίσαντες
  choice: ṣe ... ní ọgbẹ́
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ni láti dá ọgbẹ́ sí ẹnì kan. Gbólóhùn yìí jẹ́ kedere, ó sì lágbára ju ọ̀rọ̀ gbogbogbò bí “ṣe ... léṣe” lọ.
- source_word: ἐξέβαλον
  choice: jù ú síta
  rationale: Èyí fi ìṣe oníjàgídíjàgan ti yíyọ ẹni náà síta hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A fi “ìránṣẹ́” tí àyíká ọ̀rọ̀ tọ́ka sí hàn gbangba kí gbólóhùn Yorùbá lè ṣàn dáadáa.
