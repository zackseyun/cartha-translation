id: LUK.20.21
reference: Luke 20:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: yo
  text: Wọ́n sì bi í léèrè pé, “Olùkọ́, àwa mọ̀ pé ohun tí o ń sọ àti ohun tí o ń kọ́ni tọ́, o kì í sì í ṣe ojúsàájú[a], ṣùgbọ́n òtítọ́ ni o fi ń kọ́ni ní ọ̀nà Ọlọ́run[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “o kì í gba ojú”; àkànlò-èdè kan tí ó túmọ̀ sí pé o kì í ṣe ojúsàájú, bẹ́ẹ̀ ni ipò tàbí ìrísí ènìyàn kì í darí rẹ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “ṣùgbọ́n ní òtítọ́, o ń kọ́ni ní ọ̀nà Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: bi í léèrè
  rationale: Ó túmọ̀ sí pé wọ́n béèrè lọ́wọ́ rẹ̀ tàbí wọ́n bi í léèrè. Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì ṣì lè gba ète ìdánwò tí àyíká ẹsẹ̀ náà fi hàn láì fi ìkórìíra kún ọ̀rọ̀ náà.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ọ̀rọ̀ ìpè Yorùbá tí ó bá ìtumọ̀ διδάσκαλος mu ní kedere.
- source_word: οἴδαμεν
  choice: àwa mọ̀
  rationale: Ó pa ìjẹ́wọ́ ìdánilójú àwọn olùsọ̀rọ̀ mọ́; lílo “àwa” fi ìtẹnumọ́ arọ́pò-orúkọ inú Gíríìkì hàn ní Yorùbá.
- source_word: ὀρθῶς λέγεις καὶ διδάσκεις
  choice: ohun tí o ń sọ àti ohun tí o ń kọ́ni tọ́
  rationale: Ó pa àwọn ìṣe méjèèjì, sísọ àti kíkọ́ni, mọ́, ó sì jẹ́ ọ̀nà àdánidá láti jẹ́ kí ὀρθῶς kan àwọn méjèèjì ní Yorùbá.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: o kì í ṣe ojúsàájú
  rationale: Gbólóhùn náà jẹ́ àkànlò-èdè tí ó túmọ̀ sí àìṣe ojúsàájú tàbí àìjẹ́ kí ipò tàbí ìrísí ènìyàn darí ìdájọ́. Ìtumọ̀ fún èrò rẹ̀ dára ju títúmọ̀ “gba ojú” ní tààrà lọ.
- source_word: ἐπ’ ἀληθείας
  choice: òtítọ́ ni o fi
  rationale: Ó ṣàlàyé ọ̀nà tí Jesu fi ń kọ́ni—ní ìbámu pẹ̀lú òtítọ́—láì pinnu láìnídìí bóyá gbólóhùn náà lè tún dúró gẹ́gẹ́ bí “ní òtítọ́.”
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ọ̀nà Ọlọ́run
  rationale: Ó pa àwòrán “ọ̀nà” àti ìtumọ̀ ẹ̀kọ́ rẹ̀ mọ́ gẹ́gẹ́ bí ìfẹ́, ìlànà, tàbí ọ̀nà ìgbésí ayé tí Ọlọ́run fẹ́.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìṣe ojúsàájú àti kíkọ́ni ní òtítọ́.
theological_decisions:
- issue: Àkànlò-èdè nípa àìṣe ojúsàájú
  choice: “o kì í ṣe ojúsàájú”
  alternative: “o kì í wo ojú ènìyàn” tàbí “ìrísí ènìyàn kì í darí rẹ”
  rationale: Àṣàyàn náà mú kókó ìwà rere inú àkànlò-èdè Gíríìkì jáde ní Yorùbá òde òní, láì jẹ́ kí olùkà rò pé ojú ní ti ara ni ọ̀rọ̀ náà ń sọ nípa rẹ̀.
- issue: Ìbáṣepọ̀ ἐπ’ ἀληθείας pẹ̀lú διδάσκεις
  choice: “òtítọ́ ni o fi ń kọ́ni”
  alternative: “ní òtítọ́, o ń kọ́ni ní ọ̀nà Ọlọ́run”
  rationale: Gíríìkì lè jẹ́ kí a gbọ́ ọ gẹ́gẹ́ bí ọ̀nà tí ó fi ń kọ́ni tàbí ìtẹnumọ́ pé ní tòótọ́ ni ó ń ṣe bẹ́ẹ̀. Ọ̀rọ̀ àkọ́kọ́ pa ìtumọ̀ pàtàkì mọ́, àkọsílẹ̀ ẹsẹ̀ sì tọ́ka sí àṣàyàn kejì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó lọ́lá, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó. “Bi í léèrè” àti “ojúsàájú” jẹ́ àdánidá, nígbà tí “ọ̀nà Ọlọ́run” pa àwòrán àti ìwọ̀n ẹ̀kọ́ inú orísun Gíríìkì mọ́.
