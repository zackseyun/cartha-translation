source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: yo
  text: Ọlọ́run kì í ṣe Ọlọ́run àwọn òkú, bí kò ṣe ti àwọn alààyè, nítorí gbogbo wọn wà láàyè fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí gbogbo wọn wà láàyè níwájú rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Ní àyíká ìgbàgbọ́ Júù pé Ọlọ́run kan ṣoṣo ni ó wà, θεός níhìn-ín dájú pé Ọlọ́run ni, bí ó tilẹ̀ jẹ́ pé kò ní article ní Gíríìkì.
- source_word: δὲ
  choice: kò ṣe àfihàn lọ́tọ̀
  rationale: δέ ń so ọ̀rọ̀ yìí mọ́ èyí tó ṣáájú pẹ̀lú ìyípadà kékeré; ìlànà Yorùbá àti ìtakora kì í ṣe ... bí kò ṣe ti mú ìbáṣepọ̀ náà hàn láìfi ọ̀rọ̀ àfikún sí i.
- source_word: νεκρῶν
  choice: àwọn òkú
  rationale: Adjective substantival tó wà ní genitive ni; ‘àwọn òkú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtakora mu.
- source_word: ζώντων
  choice: àwọn alààyè
  rationale: Participle substantival ni, ‘àwọn alààyè’ sì pa ìtakora pẹ̀lú ‘àwọn òkú’ mọ́.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó pa ìtúmọ̀ gbooro náà mọ́, ṣùgbọ́n ‘wọn’ ń jẹ́ kí gbolohun Yorùbá rọrùn, ó sì lè tọ́ka sí àwọn tí a ń sọ̀rọ̀ nípa wọn láìfi àlàyé míì kún un.
- source_word: αὐτῷ
  choice: sí i
  rationale: Dative náà ní ìtúmọ̀ tí a kò lè fi ọ̀nà kan ṣoṣo dè; ‘sí i’ dúró sún mọ́ Gíríìkì, ó sì pa ìbáṣepọ̀ wọn pẹ̀lú Ọlọ́run mọ́ láìyanjú gbogbo ìṣòro ìtumọ̀ náà.
- source_word: ζῶσιν
  choice: wà láàyè
  rationale: Present active náà lè túmọ̀ sí ‘ń gbé’ tàbí ‘wà láàyè’; ní Yorùbá, ‘wà láàyè’ jẹ́ àdánidá jù lọ nínú àríyànjiyàn nípa òkú àti àjíǹde.
theological_decisions:
- issue: Ìtumọ̀ αὐτῷ nínú πάντες γὰρ αὐτῷ ζῶσιν
  choice: nítorí gbogbo wọn wà láàyè sí i
  alternative: nítorí gbogbo wọn wà láàyè níwájú rẹ̀
  rationale: ‘Sí i’ pa ìfúnpọ̀ ìtumọ̀ dative Gíríìkì mọ́, ó sì fi hàn pé ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run ni wọ́n fi wà láàyè, láìgbé ẹ̀kọ́ ìsìn kan wọ inú ọ̀rọ̀ ju ohun tí gbolohun náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìṣọ̀kan ‘Ọlọ́run ... Ọlọ́run’ pa àpẹẹrẹ Gíríìkì mọ́; ‘kì í ṣe ... bí kò ṣe’ ń sọ ìtakora οὐκ ... ἀλλά ní Yorùbá àdánidá.
