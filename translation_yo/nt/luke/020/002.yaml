id: LUK.20.2
reference: Luke 20:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Sọ fún wa, àṣẹ wo ni ó fi ń ṣe nǹkan wọ̀nyí? Tàbí ta ni ẹni tí ó fún ọ ní àṣẹ yìí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ìbéèrè yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ àkókò míì kún un.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: Wọ́n sọ fún un pé
  rationale: Èyí sọ ìtumọ̀ ọ̀rọ̀ ìṣáájú náà ní Yorùbá àdánidá, láìṣàtúnṣe àṣejù tí ìṣe-àpọnlé λέγοντες ní nínú Gíríìkì.
- source_word: Εἰπὸν ἡμῖν
  choice: Sọ fún wa
  rationale: Ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àṣẹ aorist mu ni èyí.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: àṣẹ wo ni o fi
  rationale: Ìlò ‘fi’ ní Yorùbá ń fi ìpìlẹ̀ tàbí agbára-àṣẹ tí ẹni fi ń ṣe ohun kan hàn lọ́nà àdánidá.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà arọ́pò-orúkọ Gíríìkì mọ́, ó sì tọ́ka sí àwọn ohun tí Jésù ń ṣe ní àyíká tẹ́ńpìlì.
- source_word: ποιεῖς
  choice: ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ hàn, ó bá àkóónú ìdojúkọ yìí àti present Gíríìkì mu.
- source_word: ἢ
  choice: Tàbí
  rationale: Ó mú ìbéèrè kejì wá gẹ́gẹ́ bí ọ̀nà mìíràn láti béèrè nípa orísun àṣẹ náà.
- source_word: τίς ἐστιν ὁ δούς
  choice: ta ni ẹni tí ó fún
  rationale: ‘Ẹni tí’ pa agbára articular participle ὁ δούς mọ́ díẹ̀ ju kí a sọ ‘ta ló fún’ nìkan lọ.
- source_word: σοι
  choice: ọ
  rationale: Arọ́pò-orúkọ olùgbà náà wọ inú gbólóhùn Yorùbá ‘fún ọ’ lọ́nà àdánidá.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: àṣẹ yìí
  rationale: ‘Àṣẹ’ níbí túmọ̀ sí ẹ̀tọ́ tàbí agbára tí a fi léni lọ́wọ́ láti ṣe ohun kan, kì í ṣe agbára ara lásán.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú ìdojúkọ Jésù ní tẹ́ńpìlì
  choice: àṣẹ
  alternative: agbára; ẹ̀tọ́
  rationale: Àwọn aṣáájú ń béèrè nípa bóyá Jésù ní ìfúnniláṣẹ àti ibi tí ó ti rí i, kì í ṣe nípa agbára láti ṣe ohun kan lásán. ‘Àṣẹ’ pa ìtumọ̀ ìṣàkóso àti ti ẹ̀sìn tó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àṣẹ wo ni o fi’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ἐν ποίᾳ ἐξουσίᾳ; a sì pa ìbéèrè méjèèjì àti ọ̀pọ̀ ‘nǹkan wọ̀nyí’ mọ́.
