id: LUK.20.20
reference: Luke 20:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: yo
  text: 'Lẹ́yìn tí wọ́n ti ṣọ́ ọ́n fínnífínní, wọ́n rán àwọn amí tí wọ́n dígbọ́n bí ẹni pé olódodo ni wọ́n, kí wọ́n lè fi ọ̀rọ̀ ẹnu rẹ̀ mú un,[a] kí wọ́n sì tipasẹ̀ bẹ́ẹ̀ fi í lé ìṣàkóso àti àṣẹ gómìnà lọ́wọ́.[b]


    [a] Tàbí, ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì, “kí wọ́n lè di ọ̀rọ̀ rẹ̀ mú.”


    [b] Àwọn ọ̀rọ̀ méjèèjì, “ìṣàkóso” àti “àṣẹ,” tẹnu mọ́ ẹ̀tọ́ gómìnà láti ṣàkóso àti agbára rẹ̀ láti gbé ìgbésẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì, “kí wọ́n lè di ọ̀rọ̀ rẹ̀ mú.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọ̀rọ̀ méjèèjì, “ìṣàkóso” àti “àṣẹ,” tẹnu mọ́ ẹ̀tọ́ gómìnà láti ṣàkóso àti agbára rẹ̀ láti gbé ìgbésẹ̀.
    reason: lexical_clarification
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: Lẹ́yìn tí wọ́n ti ṣọ́ ọ́n fínnífínní
  rationale: Ó fi hàn pé wọ́n ti ń ṣọ́ Jesu pẹ̀lú ète búburú kí wọ́n tó rán àwọn amí náà; “fínnífínní” mú ìtumọ̀ ìṣọ́ra tó le koko jáde.
- source_word: ἐγκαθέτους
  choice: àwọn amí
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn tí a fi sípò ní ìkọ̀kọ̀ láti dẹkùn mú ẹlòmíràn; “àwọn amí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì mú ète ìkọ̀kọ̀ náà jáde.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: tí wọ́n díbọ́n bí ẹni pé olódodo ni wọ́n
  rationale: “Díbọ́n” sọ ìfarahàn ẹ̀tàn náà ní èdè àdánidá, “olódodo” sì pa ìtumọ̀ ìwà rere àti ti ẹ̀sìn inú δίκαιος mọ́.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: kí wọ́n lè fi ọ̀rọ̀ ẹnu rẹ̀ mú un
  rationale: Èyí sọ ète wọn láti fi ohun tí Jesu bá sọ dẹkùn mú un ní Yorùbá tó ṣe kedere, láìpa àwòrán mímú ẹni nípasẹ̀ ọ̀rọ̀ rẹ̀ run.
- source_word: ὥστε
  choice: kí wọ́n sì tipasẹ̀ bẹ́ẹ̀
  rationale: 'Ó pa ìbáṣepọ̀ èsì tàbí àbájáde mọ́: bí wọ́n bá ti fi ọ̀rọ̀ rẹ̀ mú un, ìyẹn yóò jẹ́ ọ̀nà láti fà á lé gómìnà lọ́wọ́.'
- source_word: παραδοῦναι
  choice: fi í lé ... lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ fífi ẹni lé aláṣẹ lọ́wọ́ fún ìdájọ́.
- source_word: τῇ ἀρχῇ
  choice: ìṣàkóso
  rationale: Níbí, ἀρχή kò túmọ̀ sí ìbẹ̀rẹ̀, bí kò ṣe ipò tàbí agbègbè ìṣàkóso; yíyan ọ̀rọ̀ yìí tún jẹ́ kí ó yàtọ̀ sí ἐξουσία.
- source_word: τῇ ἐξουσίᾳ
  choice: àṣẹ
  rationale: “Àṣẹ” sọ ẹ̀tọ́ àti agbára tí a fún olórí láti gbé ìgbésẹ̀, ó sì bá ìtumọ̀ ἐξουσία mu.
- source_word: τοῦ ἡγεμόνος
  choice: gómìnà
  rationale: “Gómìnà” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí gbogbo ènìyàn lóye fún olórí ìjọba agbègbè Róòmù.
theological_decisions:
- issue: Ìtumọ̀ δίκαιος níbi tí àwọn amí ti ń díbọ́n pé ìwà wọn tọ́
  choice: olódodo
  alternative: ẹni rere; ẹni tí ó dúró ṣinṣin
  rationale: “Olódodo” pa àwọ̀ ìtumọ̀ ìwà rere àti ti ẹ̀sìn mọ́; kò dín ohun tí wọ́n ń díbọ́n sí ìwà ọmọlúwàbí lásán.
- issue: Ìbáṣepọ̀ ἀρχή àti ἐξουσία
  choice: ìṣàkóso àti àṣẹ
  alternative: àṣẹ ìjọba
  rationale: Pípa ọ̀rọ̀ méjèèjì mọ́ kò jẹ́ kí a da ìtumọ̀ wọn pọ̀; ó fi ìpò ìṣàkóso àti agbára òfin gómìnà hàn láìfi ẹ̀kọ́ ẹ̀sìn kankan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. “Díbọ́n,” “àwọn amí,” àti “fi í lé ... lọ́wọ́” jẹ́ àkójọpọ̀ ọ̀rọ̀ àdánidá; “ìṣàkóso àti àṣẹ” sì pa ìyàtọ̀ inú àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
