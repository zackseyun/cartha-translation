translation:
  language: yo
  text: Lẹ́yìn náà[a], obìnrin náà pẹ̀lú kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ìkẹyìn, obìnrin náà náà kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Lẹ́yìn náà
  rationale: Ó ń tọ́ka sí àkókò tó tẹ̀ lé àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Níhìn-ín, καί túmọ̀ sí pé obìnrin náà tún ní ìrírí ikú bí àwọn arákùnrin náà; ‘pẹ̀lú’ sọ ìtumọ̀ àfikún yìí ní Yorùbá àdánidá.
- source_word: ἡ γυνή
  choice: obìnrin náà
  rationale: γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya,’ ṣùgbọ́n ‘obìnrin náà’ dá ẹni tí a ń tọ́ka sí mọ̀ láì mú kí ó dà bí ẹni pé aya ọkùnrin kan ṣoṣo ni nínú ọ̀ràn ìgbéyàwó yìí.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ọ̀rọ̀ náà sọ ikú rẹ̀ ní tààràtà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀; ‘kú’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tí kò sì rọ ọ̀rọ̀ náà.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èdè òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá jẹ́ àdánidá, a sì pa gbolohun náà mọ́ ní ṣókí bí ti orísun Gíríìkì.
