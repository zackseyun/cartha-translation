  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: yo
  text: Nígbà náà, àwọn kan lára àwọn akọ̀wé dáhùn pé, “Olùkọ́, ohun tí o sọ dára.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olùkọ́, ohun tí o sọ tọ́,” tàbí, “Olùkọ́, o sọ̀rọ̀ lọ́nà tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist participle tí ó ń ṣàfihàn ìdáhùn ẹnu; lílo ọ̀rọ̀-ìṣe pípé ‘dáhùn’ jẹ́ àdánidá ní Yorùbá.
- source_word: δέ
  choice: Nígbà náà
  rationale: δέ jẹ́ àmì ìyípadà díẹ̀ nínú ìtàn; ‘Nígbà náà’ bá ìṣàn ọ̀rọ̀ mu láìfi àtakò tí kò sí sínú rẹ̀.
- source_word: τινες τῶν γραμματέων
  choice: àwọn kan lára àwọn akọ̀wé
  rationale: Èyí pa ìtumọ̀ partitive mọ́, ó sì fi hàn pé kì í ṣe gbogbo àwọn akọ̀wé ni wọ́n dáhùn.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: ‘Àwọn akọ̀wé’ ni ìtumọ̀ ìbílẹ̀ àti èyí tí a mọ̀ dáadáa fún γραμματεῖς nínú àyíká àwọn Ìhìn Rere; kò fi àlàyé ìtumọ̀ kun ọ̀rọ̀ náà.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ tààrà fún vocative διδάσκαλος, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: καλῶς εἶπας
  choice: ohun tí o sọ dára
  rationale: Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìyìn tó gbòòrò nínú καλῶς mọ́; ó lè tọ́ka sí bí ọ̀rọ̀ náà ṣe dára tàbí bí ó ṣe tọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. ‘Àwọn akọ̀wé’ pa ọ̀rọ̀ ìtàn ìbílẹ̀ mọ́; àmì àlàyé [a] tẹ̀ lé gbólóhùn tí ó ń ṣàlàyé.
