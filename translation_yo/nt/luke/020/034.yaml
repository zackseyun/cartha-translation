  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: yo
  text: Jésù sì sọ fún wọn pé, “Àwọn ọmọ ìgbà ayé yìí[a] ń gbéyàwó, a sì ń fi wọn ṣe ìyàwó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “Àwọn ọmọkùnrin ìgbà ayé yìí.” Ọ̀rọ̀ náà wà ní ìrísí akọ ní Gíríìkì, ṣùgbọ́n ó dúró fún gbogbo àwọn ènìyàn tí ó jẹ́ ti ìgbà ayé ìsinsin yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sì sọ fún wọn pé
  rationale: “Sì” pa ìsopọ̀ ìtàn tí Καὶ ní mọ́ láìfi ìtumọ̀ àkókò kún un; “sọ fún wọn” sì túmọ̀ εἶπεν αὐτοῖς ní Yorùbá àdánidá.
- source_word: Οἱ υἱοὶ
  choice: Àwọn ọmọ
  rationale: Ní àkójọpọ̀ ọ̀rọ̀ yìí, gbolohun Gíríìkì “àwọn ọmọkùnrin” jẹ́ ọ̀nà aṣojú láti sọ gbogbo àwọn tí ó jẹ́ ti ìgbà ayé yìí. “Àwọn ọmọ” jẹ́ àdánidá ní Yorùbá, ó sì pa àkàwé ìbátan náà mọ́ láìjẹ́ kí òǹkàwé rò pé àwọn ọkùnrin nìkan ni a ń sọ; àlàyé ìsàlẹ̀ fi ìrísí Gíríìkì hàn.
- source_word: τοῦ αἰῶνος τούτου
  choice: ìgbà ayé yìí
  rationale: αἰών ń tọ́ka sí sáà tàbí ètò ayé ìsinsin yìí, ní ìyàtọ̀ sí ìgbà ayé tí ń bọ̀; “ìgbà ayé” ṣe kedere ju “ayé” lásán lọ.
- source_word: γαμοῦσιν
  choice: ń gbéyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ṣíṣe ìgbéyàwó, ó sì bá ìṣe aláṣẹ inú Gíríìkì mu.
- source_word: γαμίσκονται
  choice: a sì ń fi wọn fúnni ní ìgbéyàwó
  rationale: Ìtumọ̀ yìí pa ìṣe àìṣe-taara (passive) Gíríìkì mọ́, ó sì yà á sọ́tọ̀ kúrò nínú “ń gbéyàwó” tí ó ṣáájú.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tí a lò gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: Àwọn ọmọ ìgbà ayé yìí
  alternative: Àwọn ọmọkùnrin ìgbà ayé yìí
  rationale: Bí ó tilẹ̀ jẹ́ pé υἱοὶ jẹ́ akọ ní Gíríìkì, níbí ó dúró fún àwọn ènìyàn tí ó jẹ́ ti ìgbà ayé yìí lápapọ̀. “Àwọn ọmọ” pa àkàwé jíjẹ́ ti ìgbà kan mọ́, nígbà tí àlàyé ìsàlẹ̀ ń jẹ́ kí ìrísí akọ inú orísun hàn.
- issue: αἰών gẹ́gẹ́ bí sáà nínú ètò ìgbà ìkẹyìn
  choice: ìgbà ayé yìí
  alternative: ayé yìí
  rationale: “Ìgbà ayé yìí” pa ìyàtọ̀ tí àyíká ọ̀rọ̀ ṣe láàárín sáà ìsinsin yìí àti ìgbà ayé tí ń bọ̀ mọ́, láìyí αἰών padà sí ayé ẹlẹ́dàá tàbí ilẹ̀ ayé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tí ó ṣeé lóye. “Ìgbà ayé” ni a lò láti jẹ́ kí ìtumọ̀ sáà ti αἰών ṣe kedere; a sì pa ìyàtọ̀ láàárín ìṣe aláṣẹ àti ìṣe àìṣe-taara ti àwọn ọ̀rọ̀ ìgbéyàwó méjèèjì mọ́.
