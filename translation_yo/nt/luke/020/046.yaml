id: LUK.20.46
reference: Luke 20:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: yo
  text: Ẹ máa ṣọ́ra fún àwọn akọ̀wé[a] tí wọ́n fẹ́ máa rìn káàkiri nínú aṣọ gígùn[b], tí wọ́n sì fẹ́ràn ìkíni ọlá ní àwọn ibi ọjà, àwọn ìjókòó ọlá[c] nínú àwọn sínágọ́gù, àti àwọn ipò ọlá[d] níbi àsè,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ ṣọ́ra fún àwọn akọ̀wé.”
    reason: lexical_alternative
  - marker: b
    text: “Aṣọ gígùn” jẹ́ aṣọ tí ó hàn gbangba, tí ó sì lè fi ipò àti ọlá ẹni hàn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn ìjókòó àkọ́kọ́” nínú àwọn sínágọ́gù.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “àwọn ibi àkọ́kọ́” níbi àsè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Ẹ máa ṣọ́ra fún
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni gbólóhùn Gíríìkì náà, ó sì ń kéde ìkìlọ̀ pé kí àwọn olùgbọ́ máa ṣọ́ra nípa ẹgbẹ́ yìí. ‘Ẹ máa ṣọ́ra fún’ jẹ́ Yorùbá àdánidá tí ó pa agbára ìkìlọ̀ náà mọ́.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: ‘Akọ̀wé’ ni ọ̀rọ̀ ìbílẹ̀ tí ó sún mọ́ γραμματεύς, ó sì yẹ fún ẹgbẹ́ àwọn amòfin àti olùkọ́ Ìwé Mímọ́ ní àkókò náà láì mú ìtumọ̀ tí ó gbòòrò ju ọ̀rọ̀ orísun lọ wọlé.
- source_word: τῶν θελόντων περιπατεῖν
  choice: àwọn tí ó fẹ́ máa rìn káàkiri
  rationale: Ó pa ìfẹ́ tàbí ìtẹ̀sí ọkàn tí θελόντων fi hàn mọ́, ‘rìn káàkiri’ sì mú ìṣe ìfarahàn ní gbangba jáde láì ṣe àfikún ìdájọ́ tí kò sí nínú ọ̀rọ̀ náà.
- source_word: ἐν στολαῖς
  choice: nínú aṣọ gígùn
  rationale: στολή ń tọ́ka sí aṣọ gígùn tàbí aṣọ ọlá; ‘aṣọ gígùn’ ṣe kedere sí òǹkàwé Yorùbá òde òní, ẹsẹ̀ ìsàlẹ̀ sì ṣàlàyé iṣẹ́ rẹ̀ gẹ́gẹ́ bí àmì ipò.
- source_word: φιλούντων ἀσπασμοὺς
  choice: tí wọ́n sì fẹ́ràn kí a máa kí wọn ní ọ̀wọ̀
  rationale: ἀσπασμοί ní àyíká yìí ju ìkíni lasán lọ; ó ní ìtumọ̀ ìkíni tí ń fi ọlá hàn. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì mú ìfẹ́ wọn sí ìyìn gbangba hàn.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ní àwọn ibi ọjà
  rationale: ἀγορά jẹ́ ibi ọjà tàbí gbàgede ìgboro tí àwọn ènìyàn ti ń pàdé; ‘ibi ọjà’ jẹ́ ọ̀rọ̀ tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: àwọn ìjókòó ọlá nínú àwọn sínágọ́gù
  rationale: πρωτοκαθεδρία jẹ́ ìjókòó tí ó ga jù ní ọlá, kì í ṣe dandan ìjókòó tí ó dára jù ní ìtura. ‘Ìjókòó ọlá’ pa iṣẹ́ àṣà àti ìtumọ̀ ipò rẹ̀ mọ́.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: àwọn ipò ọlá níbi àsè
  rationale: πρωτοκλισία tọ́ka sí ibi ìgbọ̀nsẹ̀ tàbí ipò tí a yàn fún ẹni ọlá ní àsè. ‘Ipò ọlá’ sọ iṣẹ́ àṣà náà ní kedere láì fi àṣà tábìlì òde òní kún un.
theological_decisions:
- issue: Ìbáwí Jésù sí àwọn akọ̀wé
  choice: A pa ìkìlọ̀ sí ‘àwọn akọ̀wé’ mọ́, àwọn gbólóhùn tí ó tẹ̀ lé sì ṣàpèjúwe ìwà ìfarahàn àti ìfẹ́ sí ọlá tí a ń bá wọn wí fún.
  alternative: Kí a sọ ọ́ di ìdálẹ́bi gbogbo akọ̀wé kọ̀ọ̀kan, tàbí kí a dín ìbáwí náà kù sí irú aṣọ wọn nìkan.
  rationale: Gíríìkì ń dárúkọ ẹgbẹ́ náà, ó sì fi àwọn participle ṣàpèjúwe ìwà wọn. Ìtumọ̀ náà kò tú ìfọkànsìn ẹgbẹ́ náà ká, bẹ́ẹ̀ ni kò fi ìdálẹ́bi tí ó kọjá àwọn ìwà tí ẹsẹ náà sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó lóye fún òǹkàwé òde òní, ó sì pa ìtòlẹ́sẹẹsẹ gígùn ti ẹsẹ Gíríìkì mọ́ nítorí pé ẹsẹ 46 ń tẹ̀ sí ẹsẹ 47. ‘Sínágọ́gù’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ àyálò tí ó ti wọ́pọ̀, láì sọ ọ́ di ilé ìjọsìn Kristẹni.
