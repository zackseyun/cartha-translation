id: LUK.20.42
reference: Luke 20:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: yo
  text: Nítorí Dáfídì fúnra rẹ̀ sọ nínú Ìwé Sáàmù[a] pé, “Olúwa sọ fún Olúwa mi pé, ‘Jókòó ní ọwọ́ ọ̀tún mi.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá tẹ̀ lé ọ̀rọ̀ Hébérù inú Sáàmù 110:1: “OLÚWA sọ fún Olúwa mi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Nítorí Dáfídì fúnra rẹ̀
  rationale: “Nítorí” fi hàn pé γάρ ń mú àlàyé wá, “fúnra rẹ̀” sì pa ìtẹnumọ́ αὐτός mọ́ lọ́nà Yorùbá àdánidá.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Ìkọ̀wé orúkọ ẹni náà tẹ̀ lé àṣà ìtumọ̀ Bíbélì Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: λέγει
  choice: sọ
  rationale: Ìsinsìnyí inú ọ̀nà àyọlò ọ̀rọ̀ ìtọ́kasí lè jẹ́ “sọ” ní Yorùbá, èyí tó bá ìṣe lítíréṣọ̀ mu láìfi àkókò àfikún sí i.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: nínú Ìwé Sáàmù
  rationale: Ó pa “ìwé” àti ọ̀pọ̀ orúkọ àwọn sáàmù mọ́, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀, tó ṣe kedere ní Yorùbá.
- source_word: Εἶπεν
  choice: sọ
  rationale: Aorist náà jẹ́ ìṣe tó pé nínú àyọlò Sáàmù; “sọ” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ, tí àyíká gbólóhùn fi àkókò rẹ̀ hàn.
- source_word: κύριος
  choice: Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì κύριος ni a túmọ̀ sí “Olúwa”; a kò yí i padà sí orúkọ àdáni Ọlọ́run nínú ọ̀rọ̀ àkọ́kọ́, bí ó tilẹ̀ jẹ́ pé Hébérù Sáàmù 110:1 ní YHWH.
- source_word: τῷ κυρίῳ μου
  choice: fún Olúwa mi
  rationale: Dative náà ni “fún” ṣe àfihàn, “Olúwa mi” sì pa ìtumọ̀ κύριος àti ìnira ẹ̀kọ́ nípa Mèsáyà mọ́ ju “ọ̀gá mi” lọ.
- source_word: Κάθου
  choice: Jókòó
  rationale: Àṣẹ náà jẹ́ kúkúrú, àdánidá, ó sì bá ìtumọ̀ κάθημαι mu láìfikún ohun tí kò sí nínú orísun.
- source_word: ἐκ δεξιῶν μου
  choice: ní ọwọ́ ọ̀tún mi
  rationale: Èyí ni ọ̀nà àdánidá Yorùbá fún ipò ọlá ní ẹ̀gbẹ́ ọ̀tún ẹni, ó sì pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú κύριος àkọ́kọ́ nínú àyọlò Sáàmù 110:1, nígbà tí Hébérù ní orúkọ Ọlọ́run YHWH
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì tí a ń túmọ̀ ní κύριος, nítorí náà àkọ́kọ́ tẹ̀ lé e pẹ̀lú “Olúwa.” Àlàyé ìsàlẹ̀ fi ẹ̀rí Hébérù hàn láìjẹ́ kí ó borí orísun Gíríìkì.
- issue: Bí a ṣe máa tú κύριος kejì nínú àyọlò tó ní ìjẹ́pàtàkì nípa Mèsáyà
  choice: Olúwa mi
  alternative: ọ̀gá mi
  rationale: “Olúwa mi” pa ìtumọ̀ gígùn κύριος àti ìforígbárí ẹ̀kọ́ tí Jésù ń gbé kalẹ̀ mọ́; “ọ̀gá mi” ṣeé ṣe nípa ọ̀rọ̀, ṣùgbọ́n ó lè dín agbára ìtọ́kasí náà kù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn kíkún. A lo “fúnra rẹ̀” fún ìtẹnumọ́, “Ìwé Sáàmù” fún orúkọ ìwé mímọ́, àti “ní ọwọ́ ọ̀tún mi” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún àwòrán ipò ọlá.
