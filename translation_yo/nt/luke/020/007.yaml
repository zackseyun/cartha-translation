  text: So they answered that they did not know where it was from[a].
translation:
  language: yo
  text: Nítorí náà, wọ́n dáhùn pé àwọn kò mọ ibi tí ó ti wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “láti ibi wo.” Ọ̀rọ̀ Gíríìkì náà ń béèrè nípa ibi ìpilẹ̀ṣẹ̀ tàbí orísun.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nítorí náà
  rationale: Nínú ìṣàn ìtàn yìí, καὶ ń tẹ̀ síwájú láti inú ìṣírò wọn ní ẹsẹ tó ṣáájú; “Nítorí náà” fi ìyọrísí náà hàn ní Yorùbá àdánidá.
- source_word: ἀπεκρίθησαν
  choice: wọ́n dáhùn
  rationale: Ọ̀rọ̀-ìṣe aorist yìí túmọ̀ sí pé wọ́n fèsì sí ìbéèrè; “wọ́n dáhùn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: μὴ εἰδέναι
  choice: pé àwọn kò mọ
  rationale: Infinitive pẹ̀lú μή lẹ́yìn ọ̀rọ̀-ìṣe ìdáhùn ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ tí a ròyìn; “pé àwọn kò mọ” jẹ́ àdánidá ní Yorùbá. Lílo “àwọn” nínú gbólóhùn abẹ́ yà á sọ́tọ̀ kúrò lọ́dọ̀ ẹni tó ń ròyìn.
- source_word: πόθεν
  choice: ibi tí ó ti wá
  rationale: πόθεν tọ́ka sí orísun tàbí ibi ìpilẹ̀ṣẹ̀. Ọ̀rọ̀ náà ń tọ́ka sẹ́yìn sí ìbatisí Jòhánù, ṣùgbọ́n a kò fi orúkọ rẹ̀ kún un, kí àkótán inú Gíríìkì lè dúró.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tó sì rọrùn fún gbogbo ènìyàn. A fi ààmì ohùn sí ibi tó yẹ, a sì pa àìsọ pàtó nípa ohun tí “ó” ń tọ́ka sí mọ́ gẹ́gẹ́ bí orísun Gíríìkì.
