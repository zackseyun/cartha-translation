- from: Nígbà náà, àwọn kan lára àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí[a], tọ̀ ọ́ wá, wọ́n sì bi í léèrè.
  to: Nígbà náà, àwọn kan lára àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí[a], wá sọ́dọ̀ rẹ̀, wọ́n sì bi í léèrè.
  rationale: The revision corrects the approach verb while preserving the narrative progression, the partitive sense, the Sadducees’ denial of resurrection, and the probing act of questioning. The footnote supplies the alternative denial-oriented phrasing without altering the verse’s meaning.
