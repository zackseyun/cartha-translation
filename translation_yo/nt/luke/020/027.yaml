id: LUK.20.27
reference: Luke 20:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: yo
  text: Nígbà náà, àwọn kan lára àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí[a], wá sọ́dọ̀ rẹ̀, wọ́n sì bi í léèrè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n kọ̀ pé àjíǹde wà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n sún mọ́ Jésù láti bá a sọ̀rọ̀; ‘tọ̀ ọ́ wá’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣísẹ̀ sí ọ̀dọ̀ ẹni.
- source_word: δέ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn síwájú ju pé ó ń fi ìtakora hàn; ‘Nígbà náà’ bá ìṣàn ìtàn Yorùbá mu.
- source_word: τινες τῶν Σαδδουκαίων
  choice: àwọn kan lára àwọn Sadusí
  rationale: Èyí pa ìtumọ̀ apá-kan-nínú-ọ̀pọ̀ tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì ṣe kedere pé kì í ṣe gbogbo àwọn Sadusí ni ẹsẹ yìí sọ pé wọ́n wá.
- source_word: οἱ ἀντιλέγοντες
  choice: tí wọ́n ń sọ pé
  rationale: Pẹ̀lú gbólóhùn tó tẹ̀ lé e, participle náà ń ṣàlàyé ohun tí wọ́n gbà gbọ́ nípa àjíǹde. ‘Tí wọ́n ń sọ pé’ jẹ́ èdè Yorùbá tó ṣe déédé, kò sì fi ìtumọ̀ tó le ju ti orísun lọ kún un.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: àjíǹde kò sí
  rationale: Èyí túmọ̀ gbólóhùn infinitive náà gẹ́gẹ́ bí àkóónú ohun tí wọ́n ń sọ, ó sì pa ìkọ̀sílẹ̀ wíwà àjíǹde mọ́ láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ míì.
- source_word: ἐπηρώτησαν αὐτόν
  choice: wọ́n sì bi í léèrè
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí béèrè tàbí fi ìbéèrè dán ẹni wò. ‘Bi í léèrè’ jẹ́ ọ̀nà Yorùbá tó bójú mu, tí àyíká àwọn ẹsẹ tó tẹ̀ lé e yóò sì fi irú ìbéèrè náà hàn.
theological_decisions:
- issue: Bí a ṣe máa sọ ìdúró àwọn Sadusí nípa àjíǹde
  choice: tí wọ́n ń sọ pé àjíǹde kò sí
  alternative: tí wọ́n sẹ́ pé àjíǹde wà
  rationale: Àṣàyàn yìí tẹ̀ lé ẹ̀dá gbólóhùn Gíríìkì pé wọ́n ń sọ pé àjíǹde kò sí. Ó pa ìdúró wọn mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí wọ́n sọ, láìfi ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò mẹ́nu kàn sí i.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ, a sì lo ‘Sadusí’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní Yorùbá.
