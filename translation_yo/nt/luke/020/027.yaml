review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the partitive reference to some Sadducees, their stated denial of resurrection, and their questioning of Jesus. However, “tọ̀ ọ́ wá” normally conveys following/tracking someone rather than approaching or coming to them, so it does not safely render Προσελθόντες.
  naturalness: The wording is generally clear and appropriately formal in Standard Yorùbá. Replacing “tọ̀ ọ́ wá” with “wọ́n wá sọ́dọ̀ rẹ̀” gives a natural, unambiguous expression for approaching him. Tone marking is retained.
  terminology: “Sadusí” and “àjíǹde” are suitable established biblical terms. “tí wọ́n ń sọ pé àjíǹde kò sí” faithfully conveys the group’s position without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: “tọ̀ ọ́ wá” is not an appropriate rendering of Προσελθόντες.
    rationale: In ordinary Yorùbá usage, tọ ẹni wá means to follow, trail, or pursue someone. The Greek means that they approached/came to Jesus. “Wọ́n wá sọ́dọ̀ rẹ̀” expresses that movement toward him clearly.
  revised_text: Nígbà náà, àwọn kan lára àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí[a], wá sọ́dọ̀ rẹ̀, wọ́n sì bi í léèrè.
  revised_footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n kọ̀ pé àjíǹde wà.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the approach verb while preserving the narrative progression, the partitive sense, the Sadducees’ denial of resurrection, and the probing act of questioning. The footnote supplies the alternative denial-oriented phrasing without altering the verse’s meaning.
