id: LUK.20.22
reference: Luke 20:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: yo
  text: “Ṣé ó bófin mu fún wa láti san owó-orí[a] fún Késárì, tàbí bẹ́ẹ̀ kọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “owó òde” tàbí “owó-orí sí alákòóso.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí owó-orí tí a ń san fún agbára ìjọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: ó bófin mu
  rationale: Ọ̀rọ̀ yìí fi ìbéèrè nípa ohun tí a fàyè gbà tàbí tí ó tọ́ lábẹ́ òfin hàn, kì í ṣe nípa agbára láti ṣe é. Gbólóhùn náà kò sọ bóyá òfin Róòmù tàbí òfin ẹ̀sìn ni a ń tọ́ka sí.
- source_word: ἡμᾶς
  choice: fún wa
  rationale: Èyí ń tẹ̀ lé ìtumọ̀ àkójọpọ̀ accusative àti infinitive, láìfi ‘àwa Júù’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Καίσαρι
  choice: fún Késárì
  rationale: ‘Késárì’ pa orúkọ oyè alákòóso Róòmù mọ́, ó sì ṣàfihàn pàtó ẹni tí wọ́n ń san owó náà fún.
- source_word: φόρον
  choice: owó òde
  rationale: ‘Owó òde’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ owó tí agbára ìjọba ń gbà; àlàyé ìsàlẹ̀ fi ìtumọ̀ owó-orí tàbí owó tí ilẹ̀ abẹ́ àṣẹ ń san hàn.
- source_word: δοῦναι
  choice: láti san
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘láti fún,’ ‘láti san owó òde’ ni ọ̀nà àdánidá àti pípé ní Yorùbá.
- source_word: ἢ οὔ
  choice: tàbí kò bófin mu
  rationale: Àtúnsọ ọ̀rọ̀ ìṣe náà mú ìbéèrè àṣàyàn méjì yìí ṣe kedere àti àdánidá ní Yorùbá.
theological_decisions:
- issue: Irú òfin tí ἔξεστιν ń tọ́ka sí
  choice: A lò ‘ó bófin mu’ láìsọ bóyá òfin ìjọba Róòmù tàbí ohun tí òfin Ọlọ́run fàyè gbà ni.
  alternative: ‘Ṣé òfin Róòmù fàyè gbà...’ tàbí ‘Ṣé ó tọ́ níwájú Ọlọ́run...’
  rationale: Ọ̀rọ̀ Gíríìkì fi ìdí òfin tí wọ́n ń béèrè nípa rẹ̀ sílẹ̀ láìsọ ọ́; títúmọ̀ rẹ̀ ní pàtó sí òfin ìjọba tàbí òfin ẹ̀sìn yóò yanjú àìdánilójú àti ìforígbárí tí ọ̀rọ̀ náà mọ̀ọ́mọ̀ ní.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Fọ́ọ̀mù ìbéèrè ‘Ǹjẹ́’ àti ‘ó bófin mu’ pa ìwúwo ìdánwò ti ọ̀rọ̀ náà mọ́.
