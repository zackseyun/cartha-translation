    reason: lexical_alternative
  revision_rationale: The revision uses the transparent modern term ‘owó-orí’ for the tribute tax while preserving the source’s political nuance in the footnote. It also renders ἢ οὔ with the idiomatic, non-expansive Yoruba alternative ‘tàbí bẹ́ẹ̀ kọ́?’ and leaves unspecified whether the permissibility in question is civil, religious, or both.
