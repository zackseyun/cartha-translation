source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: yo
  text: 'Ṣùgbọ́n ó wo wọ́n lójú, ó sì wí pé, “Kí wá ni ohun tí a kọ sílẹ̀ yìí: ‘Òkúta tí àwọn tí ń kọ́ ilé kọ̀ sílẹ̀, òun náà ni ó di orí igun[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òkúta igun”; ní ọ̀nà mìíràn, “òkúta òkè.” Gíríìkì sọ ní tààrà pé, “orí igun.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tẹjú mọ́ wọn
  rationale: Ó fi hàn pé ó mọ̀ọ́mọ̀ wo wọ́n tààrà, láì fi agbára ọ̀rọ̀ Gíríìkì hàn ju bó ṣe yẹ lọ.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Kí wá ni ohun tí a ti kọ yìí túmọ̀ sí pé
  rationale: Èdè Yorùbá àdánidá nílò ‘túmọ̀ sí’ láti mú ìbéèrè àsọyé náà ṣe kedere; ‘a ti kọ’ sì pa ìtumọ̀ perfect passive mọ́.
- source_word: Λίθον
  choice: Òkúta
  rationale: Ó tọ́ka sí òkúta pàtó inú ọ̀rọ̀ Ìwé Mímọ́ tí a fa yọ, bí ó tilẹ̀ jẹ́ pé kò sí article nínú Gíríìkì.
- source_word: ἀπεδοκίμασαν
  choice: kọ̀ sílẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé wọ́n ṣàyẹ̀wò rẹ̀, wọn kò sì gbà á.
- source_word: οἰκοδομοῦντες
  choice: àwọn olùkọ́lé
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún participle tí a lò gẹ́gẹ́ bí orúkọ, ó sì pa àwòrán iṣẹ́ ìkọ́lé mọ́.
- source_word: οὗτος
  choice: òun náà
  rationale: Ó pa ìtẹnumọ́ demonstrative náà mọ́, láì yí òkúta náà padà sí ẹni ní tààrà nínú ọ̀rọ̀ ìtumọ̀.
- source_word: ἐγενήθη εἰς
  choice: ni ó di
  rationale: Ó sọ ìyípadà sí ipò tuntun ní Yorùbá àdánidá, pẹ̀lú ìtẹnumọ́ lórí òkúta tí a kọ̀ sílẹ̀.
- source_word: κεφαλὴν γωνίας
  choice: orí igun ilé
  rationale: Ìtumọ̀ yìí sún mọ́ àwòrán Gíríìkì ‘orí igun,’ kò sì pinnu láìsí ẹ̀rí bóyá òkúta ìpìlẹ̀ igun tàbí òkúta orí ilé ni.
theological_decisions:
- issue: Àwòrán iṣẹ́ ìkọ́lé nínú ọ̀rọ̀ tí a fa yọ láti Sáàmù 118:22
  choice: orí igun ilé
  alternative: òkúta pàtàkì igun ilé; tàbí, òkúta orí ilé
  rationale: Gbólóhùn Gíríìkì κεφαλὴ γωνίας lè tọ́ka sí onírúurú òkúta pàtàkì nínú ilé. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́, àlàyé ìsàlẹ̀ sì fúnni ní àwọn ìtumọ̀ mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. ‘Tẹjú mọ́’ mú ìwò tààrà náà hàn; ‘orí igun ilé’ sì pa àwòrán àti àìdánilójú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
