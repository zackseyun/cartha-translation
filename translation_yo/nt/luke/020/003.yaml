  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Èmi náà yóò béèrè ìbéèrè kan[a] lọ́wọ́ yín, ẹ sì sọ fún mi:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tí ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “Èmi náà yóò béèrè ọ̀rọ̀ kan” tàbí “ọ̀ràn kan” lọ́wọ́ yín. Ọ̀rọ̀ Gíríìkì náà, λόγον, lè túmọ̀ sí “ọ̀rọ̀” tàbí “ọ̀ràn,” ṣùgbọ́n nínú gbólóhùn yìí ó ń ṣiṣẹ́ gẹ́gẹ́ bí “ìbéèrè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Ṣùgbọ́n ó dá wọn lóhùn pé
  rationale: Àkójọpọ̀ yìí fi agbára ìdáhùn participle ἀποκριθείς àti ọ̀rọ̀-ìṣe pàtàkì εἶπεν hàn ní Yorùbá àdánidá; “Ṣùgbọ́n” sì mú ìyípadà tàbí ìtakora kékeré tí δέ ní nínú àyíká yìí jáde.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Èmi náà yóò bi yín
  rationale: “Èmi náà” pa ìtẹnumọ́ àti ìtumọ̀ ìfèsì inú κἀγώ mọ́; “yín” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: λόγον
  choice: ìbéèrè kan
  rationale: Bí ó tilẹ̀ jẹ́ pé λόγος lè túmọ̀ sí “ọ̀rọ̀” tàbí “ọ̀ràn,” pẹ̀lú ἐρωτάω níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ohun tí a béèrè, nítorí náà “ìbéèrè kan” ni Yorùbá òde òní tí ó ṣe kedere jù.
- source_word: καὶ εἴπατέ μοι
  choice: ẹ sì sọ fún mi
  rationale: Ó pa àṣẹ ọ̀pọ̀ ènìyàn εἴπατε àti ẹni tí wọ́n gbọdọ̀ sọ fún, μοι, mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yan “dá wọn lóhùn” láti yẹra fún àtúnṣe aláìlẹ́wà ti participle àti main verb Gíríìkì.
