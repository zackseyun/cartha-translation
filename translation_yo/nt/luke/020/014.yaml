language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn àgbẹ̀ ọgbà àjàrà náà[a] rí i, wọ́n jíròrò láàárín ara wọn, wọ́n ní, “Èyí ni ajogún náà. Ẹ jẹ́ ká pa á, kí ogún náà lè di tiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àgbẹ̀” tàbí “àwọn ayálégbé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó ń ṣe iṣẹ́ àgbẹ̀; nínú àkàwé yìí, nínú ọgbà àjàrà ni wọ́n ń ṣiṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: àwọn àgbẹ̀ ọgbà àjàrà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó ń ṣe iṣẹ́ àgbẹ̀; nínú àkàwé yìí, ọgbà àjàrà ni wọ́n ń ṣiṣẹ́. Àṣàyàn yìí pa ìtumọ̀ iṣẹ́ àgbẹ̀ àti àyíká ọgbà àjàrà mọ́ láìfi ipa wọn gẹ́gẹ́ bí ayálégbé kún ọ̀rọ̀ náà.
- source_word: διελογίζοντο
  choice: wọ́n bá ara wọn gbèrò
  rationale: Ó fi hàn pé wọ́n ń ronú jinlẹ̀, tí wọ́n sì ń fi èrò pa pọ̀ láàárín ara wọn; ó yẹ fún ìṣe aláìparí tí ọ̀rọ̀ Gíríìkì náà ń fi hàn.
- source_word: πρὸς ἀλλήλους
  choice: ara wọn
  rationale: Ó ṣàfihàn ìbáṣepọ̀ alábàápín láàárín àwọn àgbẹ̀ náà ní ọ̀nà àdánidá ní Yorùbá.
- source_word: κληρονόμος
  choice: ajogún
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó ní ẹ̀tọ́ láti jogún ohun-ìní.
- source_word: ἀποκτείνωμεν
  choice: Ẹ jẹ́ ká pa á
  rationale: Ó pa agbára ọ̀rọ̀ ìṣírí ẹni àkọ́kọ́ ọ̀pọ̀ mọ́, ó sì túmọ̀ ìṣe pípa ní tààrà láìfi ìdájọ́ míì kún un.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: kí ogún náà lè di tiwa
  rationale: Ó pa gbólóhùn ète mọ́, ó sì fi ìtumọ̀ ‘di’ tàbí ‘wá jẹ́’ tí γένηται ní hàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà ìtàn àti ìtakora kékeré sí ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ hàn.
- source_word: ἰδόντες
  choice: nígbà tí ... rí i
  rationale: Ìtumọ̀ àsìkò yìí jẹ́ ọ̀nà Yorùbá tó rọrùn láti fi aorist participle náà hàn.
theological_decisions:
- issue: Ìtumọ̀ γεωργοὶ nínú àkàwé ọgbà àjàrà
  choice: àwọn àgbẹ̀ ọgbà àjàrà
  alternative: àwọn ayálégbé; àwọn àgbẹ̀; àwọn olùṣọ́gbà àjàrà
  rationale: Àṣàyàn náà tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì fún àwọn òṣìṣẹ́ àgbẹ̀, ó sì jẹ́ kí àyíká ọgbà àjàrà ṣe kedere. Bí ó tilẹ̀ jẹ́ pé gbogbo àkàwé náà fi hàn pé wọ́n gba ilẹ̀ náà lò, ọ̀rọ̀ γεωργοί fúnra rẹ̀ kò fi ipò òfin ayálégbé múlẹ̀.
translation_notes:
  register: A lo Yorùbá àṣàjọ, tó ní àmì ohùn níbi tó yẹ, pẹ̀lú èdè tó ṣe kedere, tó lọ́lá, tí àwọn òǹkàwé òde òní sì lè lóye. “Ẹ jẹ́ ká” jẹ́ ọ̀nà àdánidá láti sọ ìṣírí ẹgbẹ́, nígbà tí “ogún náà lè di tiwa” pa ète àti ìrètí àwọn àgbẹ̀ náà mọ́.
