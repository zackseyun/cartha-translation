source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ǹjẹ́, ẹ dá ohun tí ó jẹ́ ti Késárì padà fún Késárì,[a] àti ohun tí ó jẹ́ ti Ọlọ́run padà fún Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ fi ohun tí ó jẹ́ ti Késárì fún Késárì … àti ohun tí ó jẹ́ ti Ọlọ́run fún Ọlọ́run.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífúnni, sísan, tàbí dídá ohun tí ó tọ́ sí ẹnì kan padà fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Ṣùgbọ́n ó sọ fún wọn pé
  rationale: “Ṣùgbọ́n” fi ìyípadà kékeré tí δέ mú wá hàn láìfi àtakò líle kún un; “sọ fún wọn pé” jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ taara.
- source_word: Τοίνυν
  choice: Ǹjẹ́
  rationale: “Ǹjẹ́” ń tọ́ka sí ìparí tí a fà jáde láti inú ohun tí ó ṣáájú, ó sì bá ìlò ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: ἀπόδοτε
  choice: ẹ dá … padà fún
  rationale: Àṣàyàn yìí pa ìtumọ̀ fífi ohun tí ó yẹ tàbí tí ó jẹ́ ti ẹnì kan fún un mọ́; àlàyé ìsàlẹ̀ fi àyè sílẹ̀ fún ìtumọ̀ fífúnni tàbí sísan ohun tí ó yẹ.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: ohun tí ó jẹ́ ti Késárì padà fún Késárì
  rationale: Ó pa ìwọ̀n gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, láìdín in kù sí owó orí nìkan.
- source_word: Καίσαρος / Καίσαρι
  choice: Késárì
  rationale: A ṣe àkọsílẹ̀ orúkọ oyè náà ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí “ọba ilẹ̀ Róòmù.”
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: ohun tí ó jẹ́ ti Ọlọ́run padà fún Ọlọ́run
  rationale: Ó pa ìfarawé gbolohun méjèèjì àti ìyàtọ̀ tó wà láàárín Késárì àti Ọlọ́run mọ́.
theological_decisions:
- issue: Ìwọ̀n àṣẹ ìjọba àti ohun tí ó jẹ́ ti Ọlọ́run
  choice: A pa ojúṣe méjèèjì mọ́ láìsọ pàtó ibi tí ààlà ọ̀kọ̀ọ̀kan wà.
  alternative: Kí a túmọ̀ ọ́ sí ìyapa pátápátá láàárín ìjọba àti ẹ̀sìn, sí àṣẹ ìjọba tí kò ní ààlà, tàbí sí sísan owó orí nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé kí a fún ọ̀kọ̀ọ̀kan ní ohun tí ó jẹ́ tirẹ̀, ṣùgbọ́n kò ṣàlàyé gbogbo ààlà ìṣèlú àti ẹ̀kọ́ nípa Ọlọ́run; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìṣòro náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A tún ọ̀rọ̀-ìṣe náà sọ nínú apá kejì láti jẹ́ kí ìfarawé gbolohun náà ṣe kedere ní Yorùbá, láìyí ìtumọ̀ Gíríìkì padà.
