  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: yo
  text: 'Nígbà tí gbogbo àwọn ènìyàn ń gbọ́[a], ó sì sọ fún àwọn ọmọ ẹ̀yìn pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí gbogbo àwọn ènìyàn ti ń gbọ́, ó sì sọ fún àwọn ọmọ ẹ̀yìn pé.” Ìkọ́lé genitive absolute nínú èdè Gíríìkì ń fi ipò tí ó wà nígbà tí ó ń sọ̀rọ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: nígbà tí ... ń gbọ́
  rationale: Ọ̀rọ̀-ìṣe alábápín ti àkókò ìsinsìnyí yìí fi hàn pé gbígbọ́ wọn ń lọ lọ́wọ́ ní àkókò tí ó ń sọ̀rọ̀. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” bá iṣẹ́ yìí mu láìfi ìtakora tí kò sí sínú ọ̀rọ̀ náà.
- source_word: παντὸς τοῦ λαοῦ
  choice: gbogbo àwọn ènìyàn
  rationale: Ó ń tọ́ka sí gbogbo àwọn ènìyàn tí ó wà níbẹ̀ gẹ́gẹ́ bí àwùjọ kan, kì í ṣe kìkì ogunlọ́gọ̀ aláìlórúkọ.
- source_word: εἶπεν
  choice: ó sọ
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ fún aorist λέγω nínú ìtàn.
- source_word: τοῖς μαθηταῖς
  choice: fún àwọn ọmọ ẹ̀yìn
  rationale: “Àwọn ọmọ ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún μαθηταί. A kò fi “tirẹ̀” kún un, nítorí pé kò sí nínú Gíríìkì.
theological_decisions:
- issue: Ìyàtọ̀ láàárín àwọn tí wọ́n ń gbọ́ àti àwọn tí a ń bá sọ̀rọ̀ ní tààrà
  choice: Ó bá àwọn ọmọ ẹ̀yìn sọ̀rọ̀ nígbà tí gbogbo àwọn ènìyàn ń gbọ́.
  alternative: Kí a ka gbogbo àwọn ènìyàn sí àwọn tí ó ń bá sọ̀rọ̀ ní tààrà, tàbí kí a ka ọ̀rọ̀ náà sí ìjíròrò àdáni pẹ̀lú àwọn ọmọ ẹ̀yìn.
  rationale: Gbólóhùn aláìdúró genitive náà ṣètò ipò gbangba tí gbogbo àwọn ènìyàn ti ń gbọ́, ṣùgbọ́n dative τοῖς μαθηταῖς sọ àwọn ọmọ ẹ̀yìn di àwọn tí ó ń bá sọ̀rọ̀ ní tààrà. Ìtumọ̀ náà pa méjèèjì mọ́ láìda wọn pọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ṣe déédéé, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Ń gbọ́” pa àìsọ ohun tí wọ́n ń gbọ́ mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì; “sì” ń so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú.
