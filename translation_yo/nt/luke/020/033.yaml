source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: yo
  text: Nítorí náà, ní àjíǹde náà[a], aya ta ni obìnrin náà yóò di láàárín wọn[b]? Nítorí àwọn méje náà ní obìnrin náà gẹ́gẹ́ bí aya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà àjíǹde náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Nínú wọn, aya ẹni wo ni yóò jẹ́?”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ní obìnrin náà gẹ́gẹ́ bí aya”; a tún lè túmọ̀ rẹ̀ sí, “fẹ́ obìnrin náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: obìnrin náà
  rationale: Ìṣẹ̀lẹ̀ àkọ́kọ́ tọ́ka sí obìnrin tí wọ́n ti ń sọ̀rọ̀ rẹ̀; nítorí náà, “obìnrin náà” dára ju “aya náà” lọ níbí.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó ń tẹ̀ síwájú nínú ìbéèrè ìjiyàn àwọn Sadusí, ó sì bá èdè Yorùbá àdánidá mu láìfi agbára ìyọrísí kún un.
- source_word: ἐν τῇ ἀναστάσει
  choice: nígbà àjíǹde náà
  rationale: Èyí sọ àsìkò tí àjíǹde bá dé ní Yorùbá àdánidá; a kò fi “àwọn òkú” kún ọ̀rọ̀ Gíríìkì náà.
- source_word: τίνος αὐτῶν
  choice: aya ta ... láàárín wọn
  rationale: Gíríìkì béèrè nípa ẹni tí ìbáṣepọ̀ ìgbéyàwó náà jẹ́ tirẹ̀; ọ̀nà yìí pa ìtumọ̀ “whose among them” mọ́.
- source_word: γίνεται
  choice: yóò di
  rationale: “Di” pa ìtumọ̀ ìyípadà tàbí ipò tí ó yọrí sí nínú γίνομαι mọ́, dípò kí a túmọ̀ rẹ̀ sí “jẹ́” lásán.
- source_word: γυνή
  choice: aya
  rationale: Ní ipò àpèjúwe yìí, ọ̀rọ̀ náà túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: οἱ γὰρ ἑπτὰ
  choice: àwọn méje náà
  rationale: Ó tọ́ka sí àwọn arákùnrin méje tí a ti mẹ́nu kàn; a kò fi “gbogbo” kún un nítorí kò sí ọ̀rọ̀ bẹ́ẹ̀ ní Gíríìkì.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ní i ṣe aya
  rationale: Èyí pa ìtumọ̀ pé ọ̀kọ̀ọ̀kan wọn ní obìnrin náà gẹ́gẹ́ bí aya mọ́; ó sún mọ́ Gíríìkì ju “fẹ́ ẹ” lọ, èyí tí ó lè tẹnumọ́ ìṣe ìgbéyàwó.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ àjíǹde nínú ìbéèrè àwọn Sadusí
  choice: àjíǹde
  alternative: àjíǹde àwọn òkú
  rationale: Ẹsẹ̀ náà lo ἀνάστασις nìkan. A pa ọ̀rọ̀ náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìbéèrè àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
