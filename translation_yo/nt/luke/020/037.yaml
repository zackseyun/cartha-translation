  source_fidelity: 'Ìtumọ̀ náà mú ìpìlẹ̀ ẹsẹ̀ náà dáadáa: Mósè ni a sọ pé ó fi àjíǹde àwọn òkú hàn, a sì pa àtúnsọ “Ọlọ́run” mọ́. Ṣùgbọ́n “igbó kékeré” kò tọ́ fún βάτος; igbó túmọ̀ sí ilẹ̀ igbó/igbo, kì í ṣe igi ẹ̀gún kan. “A ń jí” sì lè dà bí ìṣe tí ń lọ lọ́wọ́ nísinsìnyí ju gbólóhùn gbogbogbò̀ ti Gíríìkì lọ.'
