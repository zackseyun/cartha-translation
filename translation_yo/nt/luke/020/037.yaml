  to: Ṣùgbọ́n pé àwọn òkú ń jí dìde, Mósè pàápàá fi hàn nínú apá Ìwé Mímọ́ nípa igi ẹ̀gún náà[a], níbi tí ó ti pe Olúwa[b] ní Ọlọ́run Ábúráhámù, àti Ọlọ́run Ísáákì, àti Ọlọ́run Jékọ́bù.
