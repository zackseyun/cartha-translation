id: LUK.20.37
reference: Luke 20:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: yo
  text: Ṣùgbọ́n pé àwọn òkú ń jí dìde, Mósè pàápàá fi hàn nínú apá Ìwé Mímọ́ nípa igi ẹ̀gún náà[a], níbi tí ó ti pe Olúwa[b] ní Ọlọ́run Ábúráhámù, àti Ọlọ́run Ísáákì, àti Ọlọ́run Jékọ́bù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níbi igi ẹ̀gún náà”—gbólóhùn Gíríìkì lè tọ́ka sí ibi ìṣẹ̀lẹ̀ náà fúnra rẹ̀, tàbí, gẹ́gẹ́ bí ọ̀nà ìtọ́ka, sí apá Ìwé Mímọ́ nípa igi ẹ̀gún tí ń jó (Eksodu 3).
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Olúwa”; èyí bá ọ̀nà tí Septuagint sábà ń gbà túmọ̀ orúkọ Ọlọ́run nínú Eksodu 3 mu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: a ń jí ... dìde
  rationale: Ọ̀rọ̀ yìí pa ìṣe aláìṣe-taara ti Gíríìkì mọ́, ó sì fi hàn pé ẹnì kan—nínú àyíká yìí, Ọlọ́run—ni ó ń jí àwọn òkú dìde, láìfi ẹ̀kọ́ míì kún un.
- source_word: οἱ νεκροὶ
  choice: àwọn òkú
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé fún àpapọ̀ àwọn ènìyàn tí ó ti kú.
- source_word: ἐμήνυσεν
  choice: fi hàn
  rationale: Ó mú ìtumọ̀ ‘sọ di mímọ̀’ tàbí ‘tọ́ka sí’ jáde, láìsọ ọ́ di ìkéde àṣẹ.
- source_word: ἐπὶ τῆς βάτου
  choice: nínú ẹsẹ Ìwé Mímọ́ nípa igbó kékeré náà
  rationale: Ó tú ìlò àkànṣe yìí sí Yorùbá òde òní gẹ́gẹ́ bí ìtọ́ka sí apá Ìwé Mímọ́ nípa igbó tí ń jó, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ibi ìṣẹ̀lẹ̀ náà mọ́.
- source_word: ὡς λέγει
  choice: níbi tí ó ti pe
  rationale: Ìkọ̀lé Gíríìkì fi hàn pé Mósè pe Olúwa ní Ọlọ́run Ábúráhámù àti bẹ́ẹ̀ bẹ́ẹ̀ lọ; ọ̀nà yìí sì dùn mọ́ etí ní Yorùbá.
- source_word: κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún akọ́lé κύριος nígbà tí a lò ó fún Ọlọ́run.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Ọlọ́run Ábúráhámù, àti Ọlọ́run Ísáákì, àti Ọlọ́run Jékọ́bù
  rationale: Àtúnsọ ‘Ọlọ́run’ ni a pa mọ́ láti fi ìtẹnumọ́ àti ìlù ọ̀rọ̀ ẹsẹ Gíríìkì àti àyọlò Eksodu hàn.
theological_decisions:
- issue: Èdè àjíǹde nínú àríyànjiyàn Jésù pẹ̀lú àwọn Sadusí
  choice: a ń jí àwọn òkú dìde
  alternative: àwọn òkú ń dìde
  rationale: Àṣàyàn náà pa fọ́ọ̀mù aláìṣe-taara mọ́, ó sì jẹ́ kí ìṣe Ọlọ́run tí a túmọ̀ sí wà láìsọ ọ́ ní tààràtà tàbí fi ẹ̀kọ́ mìíràn kún ẹsẹ náà.
- issue: Ìtumọ̀ κύριος nínú àyọlò tí ó ń tọ́ka sí Ọlọ́run Ísírẹ́lì
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ κύριον, nítorí náà a lo ‘Olúwa’ nínú ẹsẹ; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú bí Septuagint ṣe sábà túmọ̀ orúkọ Ọlọ́run.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A pa àtúnsọ ‘Ọlọ́run’ mọ́ fún ìtẹnumọ́; ‘ẹsẹ Ìwé Mímọ́’ mú ìtọ́ka lítíréṣọ̀ yé kedere, nígbà tí àlàyé [a] pa àìdánilójú Gíríìkì mọ́.
