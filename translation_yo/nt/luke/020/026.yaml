source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: yo
  text: 'Wọ́n kò sì lè fi ọ̀rọ̀ rẹ̀ mú un níwájú àwọn ènìyàn[a]. Nígbà tí ìdáhùn rẹ̀ yà wọ́n lẹ́nu, wọ́n sì dákẹ́.


    [a] Tàbí, “wọn kò lè mú un nínú ọ̀rọ̀ tí ó sọ níwájú àwọn ènìyàn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò lè mú un nínú ọ̀rọ̀ tí ó sọ níwájú àwọn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσχυσαν
  choice: wọn kò sì lè
  rationale: Ó fi àìlágbára tàbí àìní agbára láti ṣe ohun kan hàn ní Yorùbá àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: ἐπιλαβέσθαι
  choice: fi … mú un
  rationale: Ọ̀rọ̀ yìí ní àwòrán dídìmú; nínú àyíká yìí, gbólóhùn Yorùbá náà sọ ìgbìyànjú láti fi ohun tí Jésù sọ dẹkùn mú un.
- source_word: τοῦ ῥήματος
  choice: ọ̀rọ̀ rẹ̀
  rationale: ῥῆμα ń tọ́ka sí ọ̀rọ̀ tí a sọ níbí, kì í ṣe ‘Ọ̀rọ̀’ gẹ́gẹ́ bí orúkọ ẹ̀kọ́ ìgbàgbọ́. ‘Rẹ̀’ wá láti inú àyíká tí ó fi hàn pé ọ̀rọ̀ Jésù ni.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: níwájú àwọn ènìyàn
  rationale: Ó pa ìtumọ̀ ‘níwájú’ tàbí ‘ní ojú’ mọ́, ó sì tú λαός sí àwọn ènìyàn dípò kí ó dín in kù sí ogunlọ́gọ̀ kan ṣoṣo.
- source_word: θαυμάσαντες
  choice: ẹnu sì yà wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìdáhùn náà yà wọ́n lẹ́nu gidigidi.
- source_word: ἀποκρίσει
  choice: ìdáhùn
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tí ó sì bá àríyànjiyàn àti ìbéèrè inú àyíká mu.
- source_word: ἐσίγησαν
  choice: wọ́n sì dákẹ́
  rationale: Ọ̀rọ̀-ìṣe náà fi hàn pé wọ́n wọ ipò ìdákẹ́jẹ lẹ́yìn ìyàlẹ́nu wọn; ‘dákẹ́’ sọ ìyípadà yẹn ní kedere.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Gbólóhùn ‘fi ọ̀rọ̀ rẹ̀ mú un’ pa àwòrán Gíríìkì mọ́ ní ọ̀nà tí Yorùbá lè gbà, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń mú ìtumọ̀ dídẹkùn mú un nínú ohun tí ó sọ ṣe kedere.
