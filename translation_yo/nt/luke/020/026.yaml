  to: 'Wọ́n kò sì lè fi ọ̀rọ̀ rẹ̀ mú un níwájú àwọn ènìyàn[a]. Nígbà tí ìdáhùn rẹ̀ yà wọ́n lẹ́nu, wọ́n sì dákẹ́.


