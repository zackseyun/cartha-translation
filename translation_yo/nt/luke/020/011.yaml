source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: yo
  text: Ó sì tún rán ẹrú[a] mìíràn; ṣùgbọ́n wọ́n lu ẹnì yẹn náà, wọ́n sì fi ìtìjú bá a, wọ́n sì rán an lọ ní ọwọ́ òfo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìránṣẹ́.’ Ọ̀rọ̀ Gíríìkì δοῦλος ń tọ́ka sí ẹni tí ó jẹ́ ẹrú lábẹ́ olúwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Ó sì tún
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́gbẹ́ πέμψαι, προσέθετο túmọ̀ sí pé ó tẹ̀ síwájú láti ṣe ohun kan lẹ́ẹ̀kan sí i. ‘Ó sì tún’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹ̀síwájú ìtàn náà hàn.
- source_word: ἕτερον
  choice: mìíràn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹrú mìíràn tí ó yàtọ̀ sí ti àkọ́kọ́.
- source_word: πέμψαι
  choice: rán
  rationale: ‘Rán’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí ó sì bá ìṣe olúwa ọgbà àjàrà mu.
- source_word: δοῦλον
  choice: ẹrú
  rationale: ‘Ẹrú’ pa ipò ẹni tí ó wà lábẹ́ àṣẹ àti ohun-ìní olúwa rẹ̀ mọ́ nínú àkàwé náà; ‘ìránṣẹ́’ lè mú ìdè ipò yìí rọ̀ ju bó ṣe yẹ lọ.
- source_word: κἀκεῖνον
  choice: àwọn náà ... ẹni yẹn
  rationale: Àkójọpọ̀ yìí pa ìtumọ̀ ‘ẹni yẹn pẹ̀lú’ mọ́, ó sì ń ṣàfihàn bí ìwà wọn sí ẹrú kejì ṣe jọ ti àkọ́kọ́.
- source_word: δείραντες
  choice: lu
  rationale: ‘Lu’ fi ìpalára ara hàn láì fi irú ohun tí wọ́n fi lù ú kun ohun tí orísun kò sọ.
- source_word: ἀτιμάσαντες
  choice: tàbùkù sí i
  rationale: ‘Tàbùkù sí i’ sọ ìwà àìbọ̀wọ̀ àti fífi ẹni sí ipò ẹ̀gàn tí ἀτιμάζω ní lọ́nà Yorùbá àdánidá.
- source_word: ἐξαπέστειλαν
  choice: rán an lọ
  rationale: Ọ̀rọ̀ yìí mú èrò fífi ẹni náà jáde kúrò níbẹ̀ hàn láì ṣe àfikún pé ó dé ọ̀dọ̀ olúwa rẹ̀.
- source_word: κενόν
  choice: ní ọwọ́ òfo
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κενόν túmọ̀ sí pé kò mú èso tí a retí lọ; ‘ní ọwọ́ òfo’ ni ọ̀nà Yorùbá àdánidá fún ìtumọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àkàwé náà
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìbáṣepọ̀ ohun-ìní àti àṣẹ olúwa ọgbà àjàrà sí ẹni tí ó rán ṣe pàtàkì nínú àkàwé náà. ‘Ẹrú’ pa òtítọ́ àwùjọ tí δοῦλος ń tọ́ka sí mọ́ láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà jẹ́ ti ìtàn, ó ṣe kedere, ó sì ní iyì; a lo ‘tàbùkù sí i’ láti pa abala ẹ̀gàn àti àìbọ̀wọ̀ mọ́.
