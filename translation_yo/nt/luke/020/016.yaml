  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: àwọn ọjọ́ iwájú méjì náà, ìparun àwọn γεωργοί, fífi ọgbà àjàrà fún àwọn mìíràn, àti ìdáhùn ìkọ̀sílẹ̀ tó lágbára náà wà níbẹ̀. ‘Àgbẹ̀ ayálégbé’ bá àyíká àkàwé náà mu, bí ó tilẹ̀ jẹ́ pé ipò ayálégbé jẹ́ ohun tí àyíká fi hàn ju bí ọ̀rọ̀ γεωργός fúnra rẹ̀ ṣe sọ lọ.'
