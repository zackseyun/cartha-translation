id: LUK.20.16
reference: Luke 20:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: yo
  text: “Ó yóò wá, yóò sì pa àwọn àgbẹ̀ ayálégbé wọ̀nyí run[a], yóò sì fi ọgbà àjàrà náà fún àwọn ẹlòmíràn.” Ṣùgbọ́n nígbà tí wọ́n gbọ́ èyí, wọ́n ní[b], “Kí ó má ṣẹlẹ̀ láé!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn àgbẹ̀’ tàbí ‘àwọn ayálégbé’; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó ń ṣiṣẹ́ lórí ilẹ̀ tí í ṣe ti ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Rárá o!” tàbí “Kò gbọdọ̀ rí bẹ́ẹ̀!” Gbólóhùn Gíríìkì náà jẹ́ ìtakò líle; ní tààrà, “Kí ó má ṣẹlẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Òun yóò wá
  rationale: Ó túmọ̀ sí pé olúwa ọgbà náà yóò wá; a kò fi èrò àfikún bí ‘padà wá’ sínú rẹ̀.
- source_word: ἀπολέσει
  choice: yóò pa ... run
  rationale: ‘Pa run’ pa ìwúwo ìdájọ́ àti ìparun inú ἀπόλλυμι mọ́, láì fi dandan sọ pé pípa ní ti ara nìkan ni.
- source_word: γεωργοὺς
  choice: àwọn àgbẹ̀ ayálégbé
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí wọ́n gba ilẹ̀ ẹlòmíràn lálégbé tí wọ́n sì ń ṣiṣẹ́ lórí rẹ̀, kì í ṣe òṣìṣẹ́ oko lásán.
- source_word: τούτους
  choice: wọ̀nyí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka tó sún mọ́ ẹni mọ́, ó sì ń tọ́ka sí àwọn ayálégbé pàtó tí a ń sọ̀rọ̀ wọn.
- source_word: δώσει
  choice: yóò fi ... fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ‘yóò fún,’ ó sì pa ìtumọ̀ gbígbé ọgbà náà lé àwọn mìíràn lọ́wọ́ mọ́.
- source_word: ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa àwòrán àkàwé náà mọ́.
- source_word: ἄλλοις
  choice: àwọn ẹlòmíràn
  rationale: Ó pa àìsọ pàtó àwọn tí yóò gba ọgbà náà mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́ èyí
  rationale: Ó fi ìbáṣepọ̀ àkókò ti participle aorist hàn ní Yorùbá tó rọrùn láti lóye.
- source_word: Μὴ γένοιτο
  choice: Kí ó má ṣẹlẹ̀ láé!
  rationale: Ó pa ìrísí ìfẹ́-àdúrà àti ìkọ̀sílẹ̀ líle ti optative Gíríìkì mọ́, ó sì bá ìyàlẹ́nu àwọn olùgbọ́ mu.
theological_decisions:
- issue: Agbára ìdáhùn Μὴ γένοιτο
  choice: Kí ó má ṣẹlẹ̀ láé!
  alternative: Rárá o! / Kò gbọdọ̀ rí bẹ́ẹ̀!
  rationale: Ìtumọ̀ tí a yàn fi hàn pé wọ́n ń fi ìbànújẹ́ àti ìkọ̀sílẹ̀ líle kọ ìdájọ́ tí a kéde, kì í ṣe pé wọ́n ń tako ọ̀rọ̀ kan lásán; kò sì fi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì lo ‘àgbẹ̀ ayálégbé’ láti ṣàlàyé ipa àwọn γεωργοί láì sọ àkàwé náà di gígùn.
