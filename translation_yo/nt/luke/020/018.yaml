id: LUK.20.18
reference: Luke 20:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá ṣubú lé òkúta náà yóò fọ́ túútúú[a]; ṣùgbọ́n ẹni tí òkúta náà bá ṣubú sórí rẹ̀, òkúta náà yóò lọ ọ́ lúúlúú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò fọ́ sí wẹ́wẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “yóò lọ ọ́ di etu” tàbí “yóò tú u ká bí ìyàngbò ọkà”; ọ̀rọ̀ Gíríìkì náà lágbára ju kíkàn án lásán lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Ẹnikẹ́ni tí ó bá ṣubú
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni láìsí ààlà. Ìlò ‘ẹnikẹ́ni tí ó bá’ jẹ́ Yorùbá àdánidá fún participle onírúurú ẹni, ó sì pa ìtumọ̀ gbogbo ènìyàn mọ́.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: lé òkúta náà
  rationale: ‘Lé’ fi ìṣípòpadà sí orí ohun hàn lẹ́yìn ọ̀rọ̀ ṣubú, ‘náà’ sì pa agbára demonstrative ἐκεῖνον mọ́ nínú àyíká ọ̀rọ̀.
- source_word: συνθλασθήσεται
  choice: yóò fọ́ túútúú
  rationale: Gbólóhùn yìí fi àbájáde líle ti ohun tí a fọ́ sí wẹ́wẹ́ hàn, láìfi ọ̀nà pàtó tí ó gbà ṣẹlẹ̀ kún ọrọ orísun.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ṣùgbọ́n ẹni tí òkúta náà bá ṣubú lé
  rationale: ‘Ẹni tí … bá’ mú ìtumọ̀ ipò aláìlẹ́ni-pàtó ti relative clause pẹ̀lú ἄν àti subjunctive jáde, ó sì pa ìbáramu àwọn abala méjèèjì mọ́.
- source_word: λικμήσει
  choice: òkúta náà yóò lọ̀ ọ́ lúúlúú
  rationale: ‘Lọ̀ … lúúlúú’ mú agbára líle ti lílọ tàbí fífọ́ ohun di kéékèèké jáde. A tún sọ ‘òkúta náà’ gẹ́gẹ́ bí olùṣe kí itọ́kasí kedere ní Yorùbá, láìyí àwòrán ìdájọ́ padà.
- source_word: αὐτόν
  choice: ọ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ohun kan ṣoṣo yìí tọ́ka padà sí ẹni náà. Ní Yorùbá, ‘ọ́’ kò fi akọ tàbí abo hàn, ṣùgbọ́n ó pa iye ẹyọ kan àti itọ́kasí ẹni mọ́ gẹ́gẹ́ bí èdè náà ṣe ń ṣiṣẹ́.
theological_decisions:
- issue: Àwòrán ìdájọ́ nípasẹ̀ òkúta
  choice: A pa òkúta mọ́ gẹ́gẹ́ bí ohun tí ó ń mú ìparun líle wá, a kò sì rọ àkàwé náà.
  alternative: Kí a sọ ọ́ di ìkọsẹ̀ tàbí ọgbẹ́ kékeré nìkan.
  rationale: Nínú àyíká ẹsẹ náà, àwọn ọ̀rọ̀ συνθλασθήσεται àti λικμήσει lágbára, wọ́n sì ń fi ìdájọ́ tó lágbára hàn. Ìtumọ̀ náà pa agbára yìí mọ́ láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
- issue: Arọ́pò-orúkọ akọ ẹyọ kan tó dúró fún gbogbo ènìyàn
  choice: A lo ‘ọ́,’ arọ́pò-orúkọ ẹyọ kan tí Yorùbá ń lò fún ẹni láìfi akọ tàbí abo hàn.
  alternative: Kí a tún ‘ẹni náà’ sọ ní kíkún tàbí kí a fi ìyàtọ̀ akọ hàn tí Yorùbá kò nílò.
  rationale: Gíríìkì ní αὐτόν, akọ ẹyọ kan pẹ̀lú agbára gbogbogbò. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni ẹyọ kẹta; ‘ọ́’ ni ìbámu gírámà àti ìtumọ̀ tó pé jù.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Túútúú’ àti ‘lúúlúú’ jẹ́ ọ̀rọ̀ àdánidá tí ó mú ìparun líle hàn; àlàyé ìsàlẹ̀ ojú ìwé sì pa àwọn ìtumọ̀ mìíràn ti àwọn ọ̀rọ̀ Gíríìkì mọ́.
