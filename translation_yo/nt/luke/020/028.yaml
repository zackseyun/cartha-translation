id: LUK.20.28
reference: Luke 20:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: yo
  text: wọ́n wí pé, “Olùkọ́, Mósè kọ̀wé fún wa pé bí arákùnrin ẹnì kan bá kú tí ó ní aya[a], tí kò sì ní ọmọ, kí arákùnrin rẹ̀ fẹ́ aya náà, kí ó sì gbé irú-ọmọ dìde fún arákùnrin tí ó kú náà[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó fi aya sílẹ̀”; ní ti gidi, èdè Gíríìkì sọ pé, “ó kú nígbà tí ó ní aya.”
    reason: lexical_alternative
  - marker: b
    text: “Gbé irú-ọmọ dìde” jẹ́ ìtúnṣọ ọ̀rọ̀ òfin inú Diutarónómì 25:5, tó ń tọ́ka sí pípèsè àtọmọdọ́mọ tí a ó kà sí ti arákùnrin tó kú; ní ti gidi, “gbé irúgbìn dìde.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ ìpè tààrà sí Jesu ni; ‘Olùkọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ipò yìí mu.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Mósè kọ̀wé fún wa
  rationale: ‘Fún wa’ fi hàn pé òfin náà wúlò fún àwọn ọmọ Ísírẹ́lì, kì í ṣe pé Mósè kọ lẹ́tà sí wọn.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: bí arákùnrin ẹnì kan bá kú
  rationale: Ó pa ìtumọ̀ àìdájú τινος mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἔχων γυναῖκα
  choice: nígbà tí ó ní aya
  rationale: Èyí tẹ̀ lé ìtumọ̀ gangan ti ọ̀rọ̀ Gíríìkì, ‘ó ní aya,’ láì túmọ̀ ọ́ sí ‘ó fi aya sílẹ̀’ nínú ọ̀rọ̀ pàtàkì.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: tí ó sì kú láìbí ọmọ
  rationale: ‘Láìbí ọmọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé olóògbé náà kò ní ọmọ, ó sì so ọ̀rọ̀ náà mọ́ ikú rẹ̀ láìfi kún un pé ọmọ irú wo ni.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: kí arákùnrin rẹ̀ fẹ́ aya náà
  rationale: Nínú àṣà àti ọ̀rọ̀ òfin yìí, λάβῃ τὴν γυναῖκα túmọ̀ sí gbígbé obìnrin náà níyàwó; ‘fẹ́ aya náà’ jẹ́ kedere ju ‘mú aya náà’ lọ ní Yorùbá.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: gbé irú-ọmọ dìde
  rationale: Ó pa àwòrán àti àsọyé òfin ‘gbé irú-ọmọ dìde’ mọ́, nígbà tí ‘irú-ọmọ’ ṣe kedere ju ‘irúgbìn’ lọ fún àwọn òǹkàwé òde òní.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fún arákùnrin rẹ̀
  rationale: ‘Fún’ fi hàn pé a ó ka irú-ọmọ náà sí ti arákùnrin tó kú.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ èdè òfin nípa kí arákùnrin olóògbé fẹ́ opó rẹ̀ láìfi àlàyé ẹ̀kọ́ ìsìn tàbí àṣà kún ọ̀rọ̀ náà
  choice: kí arákùnrin rẹ̀ fẹ́ aya náà, kí ó sì gbé irú-ọmọ dìde fún arákùnrin rẹ̀
  alternative: kí arákùnrin rẹ̀ mú aya náà, kí ó sì bí ọmọ fún arákùnrin rẹ̀
  rationale: Àṣàyàn náà jẹ́ kí ìlànà òfin tó wà nínú Diutarónómì 25:5 ṣe kedere, ṣùgbọ́n ó pa àsọyé orísun náà mọ́, kò sì sọ pé arákùnrin náà fúnra rẹ̀ ni yóò ‘bí’ ọmọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn. A lo ‘fẹ́ aya náà’ fún ìtumọ̀ tó ṣe kedere ní Yorùbá, nígbà tí àlàyé ẹsẹ̀ pa ìtumọ̀ gangan ‘ní aya’ àti àsọyé ‘irúgbìn’ mọ́.
