language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Báwo ni wọ́n ṣe ń sọ pé Mèsáyà[a] jẹ́ ọmọ Dáfídì[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Oyè Gíríìkì Χριστός ni a túmọ̀ sí “Mèsáyà” níhìn-ín nítorí àyíká náà ń sọ ní pàtó nípa olùdáǹdè láti ìran Dáfídì tí àwọn ènìyàn ń retí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ọmọkùnrin Dáfídì kan” tàbí “Ọmọ Dáfídì.” Gíríìkì náà ní ní tààrà pé “ọmọ Dáfídì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ; “Ṣùgbọ́n” bá ìyípadà ọ̀rọ̀ mu níbi tí Jésù ti gbé ìbéèrè amúnisìn kalẹ̀ lẹ́yìn ìjíròrò tó ṣáájú.
- source_word: πρὸς αὐτούς
  choice: fún wọn
  rationale: Nínú gbólóhùn tó ní í ṣe pẹ̀lú sísọ̀rọ̀, “sọ fún wọn” ni ọ̀nà Yorùbá tó ṣe déédé jù láti fi ìtọ́sọ́nà πρὸς hàn.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Èyí ni ìkọ́lé Yorùbá àdánidá fún ìbéèrè nípa bí ọ̀rọ̀ kan ṣe lè rí bẹ́ẹ̀ tàbí ìdí ọgbọ́n tó wà lẹ́yìn rẹ̀.
- source_word: λέγουσιν
  choice: wọ́n ṣe ń sọ
  rationale: “Wọ́n” pa olùṣe ọ̀pọ̀ tí a kò dárúkọ mọ́; àmì “ń” sì fi ìṣe tí ó ń lọ tàbí ohun tí àwọn ènìyàn máa ń sọ hàn.
- source_word: τὸν χριστόν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níhìn-ín, ó sì wà nínú àyíká ìrètí olùdáǹdè ọba láti ìran Dáfídì; “Mèsáyà” mú ìtumọ̀ oyè yìí jáde kedere.
- source_word: εἶναι
  choice: jẹ́
  rationale: Lẹ́yìn “sọ pé,” Yorùbá máa ń lo gbólóhùn aláìlẹ́gbẹ́ pẹ̀lú “jẹ́,” èyí tó fi ìbáṣepọ̀ tí infinitive Gíríìkì ń sọ hàn lọ́nà àdánidá.
- source_word: Δαυὶδ υἱόν
  choice: ọmọ Dáfídì
  rationale: “Ọmọ Dáfídì” jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìran akọ láti ọ̀dọ̀ Dáfídì, ó sì pa àìdánilójú nípa bí a ṣe máa túmọ̀ ìsọ̀rí ọ̀rọ̀ náà mọ́ láìfi oyè pàtó kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká náà dá lórí olùdáǹdè ọba tí a ń retí láti ìran Dáfídì. “Mèsáyà” fi ìtumọ̀ oyè Jù yìí sí iwájú, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí “Kristi” dúró gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- issue: Ọ̀rọ̀ nípa jíjẹ́ ọmọ Dáfídì
  choice: ọmọ Dáfídì
  alternative: ọmọkùnrin Dáfídì; Ọmọ Dáfídì
  rationale: Ìkọ́lé Gíríìkì kò ní article níwájú υἱόν. “Ọmọ Dáfídì” pa ọ̀rọ̀ ìran àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tí Jésù yóò tẹ̀ síwájú láti ṣàyẹ̀wò mọ́, láìsọ ọ́ di oyè pàtó tàbí ọmọkùnrin tààrà.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. “Sọ fún wọn” àti “Báwo ni wọ́n ṣe ń sọ” jẹ́ ìkọ́lé àdánidá fún olùkà gbogbo ènìyàn. A lo àmì ohùn níbi tí ó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan ṣoṣo.
