id: LUK.20.1
reference: Luke 20:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọ̀kan lára àwọn ọjọ́ náà pé, bí ó ti ń kọ́ àwọn ènìyàn nínú tẹ́ńpìlì[b], tí ó sì ń kéde ìhìn rere[a], àwọn olórí àlùfáà àti àwọn akọ̀wé, pẹ̀lú àwọn àgbààgbà, dé sí ọ̀dọ̀ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń wàásù ìhìnrere.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó pa ọ̀nà ìtàn Lúùkù mọ́ ní èdè Yorùbá àdánidá, láì lo ọ̀rọ̀ àtijọ́ tí ó le.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ní ọ̀kan lára àwọn ọjọ́ náà
  rationale: Ó fi ìtumọ̀ apá kan nínú ọ̀pọ̀ ọjọ́ hàn, ó sì tọ́ka sí àkókò ìtàn tí ó ń lọ lọ́wọ́.
- source_word: διδάσκοντος αὐτοῦ
  choice: bí ó ti ń kọ́
  rationale: Ó tú gírámà genitive absolute sí gbólóhùn àkókò tí ó ṣe kedere pé iṣẹ́ náà ń lọ lọ́wọ́.
- source_word: τὸν λαὸν
  choice: àwọn ènìyàn
  rationale: λαός níbí túmọ̀ sí àwọn ènìyàn lápapọ̀, kì í ṣe ogunlọ́gọ̀ nìkan.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn; àlàyé ìsàlẹ̀ ṣàlàyé pé ἱερόν ni gbogbo àgbègbè tẹ́ńpìlì.
- source_word: εὐαγγελιζομένου
  choice: ń kéde ìhìn rere
  rationale: Ó pa ìtumọ̀ fífi ìròyìn rere kéde mọ́, láì sọ ọ́ di ọ̀rọ̀ ìjọ tí ó ti ní ìtumọ̀ pàtó jù.
- source_word: ἐπέστησαν
  choice: tọ̀ ọ́ wá
  rationale: Ó sọ bí wọ́n ṣe dé ọ̀dọ̀ rẹ̀ tààrà, láì fi ìtakora tàbí ìjà kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà, kì í ṣe ọ̀pọ̀ ẹni tí gbogbo wọn ń ṣe ipò olórí àlùfáà gíga kan náà.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Ó pa orúkọ ẹgbẹ́ ìtàn náà mọ́ ní ọ̀nà tó ṣe tààrà.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: pẹ̀lú àwọn àgbààgbà
  rationale: Ó fi ìbáṣiṣẹ́ àwọn ẹgbẹ́ aṣáájú wọ̀nyí hàn gẹ́gẹ́ bí σύν ṣe sọ.
theological_decisions:
- issue: Bí a ṣe máa tú εὐαγγελιζομένου nínú ìtàn iṣẹ́ Jesu
  choice: ń kéde ìhìn rere
  alternative: ń wàásù ìhìnrere
  rationale: Àṣàyàn yìí pa ìtumọ̀ fífi ìròyìn rere kéde mọ́ ní èdè tí gbogbo ènìyàn lè lóye, kò sì fi ìtumọ̀ ìlànà ìjọ tí ó wá lẹ́yìn náà lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A gbé àwọn àmì ìsàlẹ̀ [a] àti [b] sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé, dípò ibi tí wọ́n wà nínú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì, nítorí pé àkóónú àwọn àlàyé náà fi hàn pé àwọn àmì ibẹ̀ ti yí ipò padà.
