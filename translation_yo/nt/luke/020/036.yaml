id: LUK.20.36
reference: Luke 20:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: yo
  text: Nítorí wọn kò lè kú mọ́; nítorí wọ́n dàbí àwọn áńgẹ́lì,[a] wọ́n sì jẹ́ ọmọ Ọlọ́run,[b] níwọ̀n bí wọ́n ti jẹ́ ọmọ àjíǹde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n dọ́gba pẹ̀lú àwọn áńgẹ́lì.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘ọmọ Ọlọ́run’ àti ‘ọmọ àjíǹde.’ Nínú Yorùbá, ‘ọmọ’ lè kan akọ àti abo; níhìn-ín ó ń sọ ipò àti ìdánimọ̀, kì í ṣe ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: wọn kò lè kú mọ́
  rationale: 'Ó fi agbára tàbí àìlágbára hàn ní tààrà: wọn kò tún wà lábẹ́ ikú mọ́. ‘Kò lè kú mọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì túmọ̀ ἔτι sí ‘mọ́’ láìfi èrò pé ikú kan ṣáájú èyí kún un.'
- source_word: ἰσάγγελοι
  choice: wọ́n dàbí àwọn áńgẹ́lì
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘wọ́n dọ́gba pẹ̀lú àwọn áńgẹ́lì’ tàbí ‘wọ́n dàbí àwọn áńgẹ́lì.’ ‘Wọ́n dàbí’ ṣe àfiwé ní kedere láìsọ pé ènìyàn yóò di áńgẹ́lì.
- source_word: υἱοί ... θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: Ní Yorùbá, ‘ọmọ’ kò fi akọ tàbí abo hàn, ṣùgbọ́n ó pa èrò ipò, ìdánimọ̀ àti ìbátan inú υἱοί mọ́ lọ́nà àdánidá.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: níwọ̀n bí wọ́n ti jẹ́ ọmọ àjíǹde
  rationale: Ó pa àwòrán ‘ọmọ àjíǹde’ mọ́, ó sì jẹ́ kí participle ὄντες ní ìtumọ̀ àlàyé tàbí ìdí láìdì í mọ́ ìtumọ̀ kan ṣoṣo pátápátá.
- source_word: γάρ ... γάρ
  choice: Nítorí ... nítorí
  rationale: Àtúnṣe ‘nítorí’ pa ìsopọ̀ àlàyé méjèèjì mọ́, ó sì ṣe kedere àti àdánidá nínú Yorùbá.
theological_decisions:
- issue: Èdè ọmọ nínú ọ̀rọ̀ nípa àjíǹde
  choice: Pa ‘ọmọ Ọlọ́run’ àti ‘ọmọ àjíǹde’ mọ́ nínú ẹsẹ̀ náà
  alternative: àwọn ọmọ Ọlọ́run / àwọn ènìyàn àjíǹde
  rationale: Υἱοί méjèèjì ń sọ ipò àti ìdánimọ̀. ‘Ọmọ’ jẹ́ èdè Yorùbá tó yẹ fún akọ àti abo, ó sì pa àtúnṣe àti àwòrán orísun mọ́ láìfi ọkùnrin nìkan sí i.
- issue: Ìbáṣepọ̀ àwọn ẹni tí a jí dìde pẹ̀lú àwọn áńgẹ́lì
  choice: wọ́n dàbí àwọn áńgẹ́lì
  alternative: wọ́n dọ́gba pẹ̀lú àwọn áńgẹ́lì
  rationale: Ἰσάγγελοι gba ìtumọ̀ méjèèjì. Àkọ́kọ́ jẹ́ Yorùbá tó rọrùn, kò sì túmọ̀ àfiwé náà sí ìyípadà àwọn ènìyàn di áńgẹ́lì; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. Àwòrán ‘ọmọ àjíǹde’ ni a pa mọ́, nígbà tí ‘wọ́n dàbí àwọn áńgẹ́lì’ ń jẹ́ kí àfiwé náà wọ́pọ̀ ní etí Yorùbá.
