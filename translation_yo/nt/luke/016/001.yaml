id: LUK.16.1
reference: Luke 16:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: yo
  text: Ó sì tún ń sọ fún àwọn ọmọ-ẹ̀yìn pé, “Ọkùnrin ọlọ́rọ̀ kan wà tí ó ní olùṣàkóso dúkìá[a]; wọ́n sì fẹ̀sùn kan olùṣàkóso náà fún ọlọ́rọ̀ náà pé ó ń fi ohun ìní ọlọ́rọ̀ náà ṣòfò.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “alábòójútó ilé”; οἰκονόμος ni ẹni tí a gbé àbójútó ilé tàbí dúkìá lé lọ́wọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ròyìn rẹ̀ fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹ̀sùn kan tàbí fífi ìròyìn tí kò dára sọ nípa ẹnìkan; kò fi hàn dandan pé ẹ̀sùn náà ti fìdí múlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ tàbí ìtẹ̀síwájú ìtàn hàn; ‘ń sọ’ mú èyí jáde ní Yorùbá àdánidá.
- source_word: δὲ καὶ
  choice: sì tún
  rationale: ‘Sì’ samisi ìyípadà tàbí ìtẹ̀síwájú ọ̀rọ̀, ‘tún’ sì fi ìtumọ̀ καί (‘pẹ̀lú/also’) hàn.
- source_word: πρὸς τοὺς μαθητάς
  choice: fún àwọn ọmọ-ẹ̀yìn
  rationale: Èyí túmọ̀ ìdarí ọ̀rọ̀ sí àwọn ọmọ-ẹ̀yìn láìfi ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Ọkùnrin ọlọ́rọ̀ kan wà
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ẹni pàtó kan nínú àkàwé.
- source_word: οἰκονόμον
  choice: olùṣàkóso dúkìá
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí a fi àbójútó ilé tàbí dúkìá lé lọ́wọ́; yíyan yìí ṣe kedere fún òǹkàwé òde òní.
- source_word: διεβλήθη αὐτῷ
  choice: wọ́n fẹ̀sùn kan ... lọ́dọ̀ rẹ̀
  rationale: Ìkọ́lé aláìlẹ́ni-nọ́ńbà ‘wọ́n’ ń ṣàfihàn passive Gíríìkì, ‘lọ́dọ̀ rẹ̀’ sì pa ẹni tí a mú ẹ̀sùn náà tọ̀ wá mọ́.
- source_word: ὡς διασκορπίζων
  choice: pé ó ń ... ṣòfò
  rationale: Ó ṣàlàyé ohun tí ẹ̀sùn náà dá lé; ‘fi ... ṣòfò’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ohun ìní ṣòfò.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ohun ìní rẹ̀
  rationale: Ó pa àfihàn gbòòrò sí ohun gbogbo tí ó jẹ́ ti ọkùnrin ọlọ́rọ̀ náà mọ́.
theological_decisions:
- issue: Bóyá ẹ̀sùn náà ti fìdí múlẹ̀
  choice: A lo ‘fẹ̀sùn kan’ láìsọ pé ẹ̀sùn náà jẹ́ òtítọ́.
  alternative: ‘wọ́n fi hàn pé ó ń fi ohun ìní rẹ̀ ṣòfò’
  rationale: διαβάλλω lè túmọ̀ sí fífi ẹ̀sùn kan tàbí jíjẹ́rìí búburú sí ẹnìkan; ẹsẹ̀ náà kò fi hàn pé a ti dá ẹ̀sùn náà lẹ́jọ́ gẹ́gẹ́ bí òtítọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere. ‘Olùṣàkóso dúkìá’ yàgò fún ọ̀rọ̀ ìbílẹ̀ tí ọ̀pọ̀ òǹkàwé lè má lóye, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àṣàyàn ‘ìríjú ilé’ mọ́.
