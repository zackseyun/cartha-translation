translation:
  language: yo
  text: Ọkùnrin tálákà kan sì wà, orúkọ rẹ̀ ń jẹ́ Lasaru. A ti gbé e kalẹ̀ ní ẹnu-ọ̀nà ọkùnrin ọlọ́rọ̀ náà[a], ó sì kún fún egbò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A ti ju u sí ẹnu-ọ̀nà ọkùnrin ọlọ́rọ̀ náà.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ jíju ẹnì kan síbì kan, èyí tó lè tẹnu mọ́ àìlera Lasaru àti bí a kò ṣe bìkítà fún un.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “egbò bo ara rẹ̀.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé Lasaru ní egbò ọgbẹ́ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: ọkùnrin tálákà
  rationale: “Tálákà” sọ ipò àìní rẹ̀ ní èdè Yorùbá àdánidá, láì fi kún un pé alágbe ni.
- source_word: τις
  choice: kan
  rationale: “Ọkùnrin … kan” ni ọ̀nà Yorùbá tó wọ́pọ̀ láti fi ẹni tuntun tí a kò tíì dá mọ̀ wọ inú ìtàn.
- source_word: ὀνόματι Λάζαρος
  choice: orúkọ rẹ̀ ń jẹ́ Lasaru
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn Gíríìkì tó túmọ̀ sí pé Lasaru ni orúkọ rẹ̀.
- source_word: ἐβέβλητο
  choice: A ti gbé e sí
  rationale: Ìṣe aláìṣe náà fi hàn pé àwọn ẹlòmíràn ló gbé e síbẹ̀, ó sì pa ìtumọ̀ ipò tó ti wà tẹ́lẹ̀ mọ́. Àlàyé ìsàlẹ̀ pa ìtumọ̀ líle, ‘ju u sí,’ mọ́.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: sí ẹnu-ọ̀nà ọkùnrin ọlọ́rọ̀ náà
  rationale: “Ẹnu-ọ̀nà” bá πυλών gẹ́gẹ́ bí ẹnu-bọ̀nà ilé ńlá mu, “ọkùnrin ọlọ́rọ̀ náà” sì mú ẹni tí αὐτοῦ ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: εἱλκωμένος
  choice: egbò sì bo gbogbo ara rẹ̀
  rationale: Gbólóhùn yìí sọ ní kedere pé egbò ọgbẹ́ púpọ̀ ń yọ ọ́ lẹ́nu, ó sì jẹ́ èdè Yorùbá tó ṣeé lóye ju lílo ọ̀rọ̀ ìṣègùn lọ.
