id: LUK.16.8
reference: Luke 16:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: yo
  text: Ọ̀gá náà[a] sì yin olùṣàkóso aláìṣòdodo náà, nítorí ó ṣe é pẹ̀lú ọgbọ́n. Nítorí àwọn ọmọ ayé yìí[b] ní ọgbọ́n ju àwọn ọmọ ìmọ́lẹ̀ lọ ní ìbáṣepọ̀ wọn pẹ̀lú ìran tiwọn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa náà.” Níhìn-ín, “ọ̀gá” ló ṣeéṣe jù nítorí κύριος dàbí ẹni pé ó tọ́ka sí ọ̀gá inú òwe náà, kì í ṣe Jesu tàbí Ọlọ́run ní tààràtà.
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì ní ti gidi, “àwọn ọmọ ìgbà ayé yìí” àti “àwọn ọmọ ìmọ́lẹ̀.” Àwọn ọ̀rọ̀ yìí fi àwọn tí ìgbà ayé ìsinsìnyí ń darí wé àwọn tí ó jẹ́ ti ìmọ́lẹ̀ Ọlọ́run.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ní ọ̀nà tó sún mọ́ Gíríìkì sí i, “àwọn ọmọ ayé yìí ní ọgbọ́n ju àwọn ọmọ ìmọ́lẹ̀ lọ fún ìran tiwọn.” Gbólóhùn Gíríìkì náà ṣòro; ìtumọ̀ inú ẹsẹ mú èrò bí wọ́n ṣe ń hùwà pẹ̀lú ìran tàbí ẹgbẹ́ tiwọn hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Ọ̀gá náà
  rationale: Nínú àyíká òwe náà, ọ̀rọ̀ yìí tọ́ka sí ọlọ́rọ̀ tí ó jẹ́ ọ̀gá olùṣàkóso náà. ‘Ọ̀gá’ mú ipa rẹ̀ nínú ìtàn náà hàn láìfi dandan sọ pé Jesu tàbí Ọlọ́run ló yin ìwà náà.
- source_word: οἰκονόμον
  choice: olùṣàkóso
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe ẹni tí a fi ìṣàkóso ohun ìní ilé tàbí ọrọ̀ lé lọ́wọ́. ‘Olùṣàkóso’ jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: τῆς ἀδικίας
  choice: aláìṣòdodo
  rationale: Àpèjúwe yìí pa ìdájọ́ ìwà ẹni náà mọ́, láìdín ìtumọ̀ rẹ̀ kù sí irú àìṣòótọ́ kan ṣoṣo.
- source_word: φρονίμως / φρονιμώτεροι
  choice: fi ọgbọ́n inú ṣe / ní ọgbọ́n inú ju
  rationale: ‘Ọgbọ́n inú’ túmọ̀ sí lílo làákàyè tó bá ipò mu láti dé ibi tí ẹni ń lọ. Ó pa ìyìn ọgbọ́n ìṣe mọ́, ṣùgbọ́n kò sọ pé ìwà aláìṣòdodo náà dára ní ti ìwà rere.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: àwọn ọmọ ayé yìí
  rationale: Èyí jẹ́ ọ̀nà àdéhùn èdè láti sọ àwọn tí ìgbà ayé ìsinsìnyí ń ṣe àkóso ìwà wọn. Ìtumọ̀ náà pa àwòrán ‘ọmọ’ mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe é lóye.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: àwọn ọmọ ìmọ́lẹ̀
  rationale: Ìtumọ̀ yìí pa àwòrán orísun mọ́, ó sì bá ‘àwọn ọmọ ayé yìí’ ṣe àfiwé ní tààràtà.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: ní ìbálò wọn pẹ̀lú àwọn ènìyàn ìran tiwọn
  rationale: Gbólóhùn Gíríìkì náà ṣòro ní ìtumọ̀ gangan. Ìtumọ̀ yìí mú èrò ìbáṣepọ̀ pẹ̀lú àwọn alájọgbá tàbí ẹgbẹ́ tiwọn yé ni, láìsọ pé ìtumọ̀ kan ṣoṣo ni ó ṣeé ṣe.
theological_decisions:
- issue: Ta ni ὁ κύριος nínú apá àkọ́kọ́?
  choice: Ọ̀gá inú òwe náà
  alternative: Olúwa, ìyẹn Jesu tàbí Ọlọ́run
  rationale: Ohun tí ó wà lẹ́sẹ̀kẹsẹ̀ nínú ìtàn tọ́ka sí ọlọ́rọ̀ tó ní olùṣàkóso. A fi àṣàyàn mìíràn sínú àlàyé ìsàlẹ̀ kí àìdánilójú ọ̀rọ̀ κύριος má bàa parẹ́.
- issue: Ìdájọ́ ìwà olùṣàkóso náà
  choice: A yin ọgbọ́n inú rẹ̀, kì í ṣe àìṣòdodo rẹ̀
  alternative: A fọwọ́ sí gbogbo ìṣe rẹ̀ gẹ́gẹ́ bí ọgbọ́n rere
  rationale: Ẹsẹ náà pè é ní aláìṣòdodo, síbẹ̀ ó sọ pé ó fi ọgbọ́n inú ṣe. Ìtumọ̀ náà pa ìforígbárí yìí mọ́, kò sì sọ ọ́ di ìyìn ìwà búburú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ọgbọ́n inú’ pa ìtumọ̀ làákàyè ìṣe mọ́ láìsọ ọ́ di ìyìn ìwà rere, ‘àwọn ọmọ ayé yìí’ àti ‘àwọn ọmọ ìmọ́lẹ̀’ sì pa àfiwé àwòrán orísun mọ́.
