  source_fidelity: Ìtumọ̀ náà tọ́ka ὁ κύριος sí ọ̀gá inú òwe náà ní ìbámu pẹ̀lú àyíká, ó sì pa ìforígbárí tó wà láàárín ‘aláìṣòdodo’ àti ìyìn fún ọgbọ́n ìṣe mọ́. Àfiwé ‘àwọn ọmọ ayé yìí’ àti ‘àwọn ọmọ ìmọ́lẹ̀’ náà wà ní ìbámu pẹ̀lú Gíríìkì.
