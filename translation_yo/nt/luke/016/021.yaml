  to: Ó sì ń fẹ́ gidigidi kí ó lè fi ohun tí ń jábọ́ láti orí tábìlì ọkùnrin ọlọ́rọ̀ náà bọ́ inú rẹ̀[a]. Ṣùgbọ́n àwọn ajá pàápàá ń wá, wọ́n sì ń lá àwọn egbò rẹ̀.
