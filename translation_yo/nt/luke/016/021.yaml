source:
  edition: SBLGNT
  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: yo
  text: Ó sì ń fẹ́ gidigidi kí ó lè fi ohun tí ń jábọ́ láti orí tábìlì ọkùnrin ọlọ́rọ̀ náà bọ́ inú rẹ̀[a]. Ṣùgbọ́n àwọn ajá pàápàá ń wá, wọ́n sì ń lá àwọn egbò rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó lè fi àwọn àjẹkù tí ń jábọ́ láti orí tábìlì ọkùnrin ọlọ́rọ̀ náà bọ́ inú rẹ̀.” Ní tààrà, èdè Gíríìkì sọ pé “ohun tí ń jábọ́”; àyíká àsè ni ó mú kí a lè lóye rẹ̀ sí “àwọn àjẹkù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: ń fẹ́
  rationale: Ó ṣàfihàn ìfẹ́ tí ó ń bá a lọ nínú àyíká yìí, láìfi ìtumọ̀ tí ó pọ̀ ju ti Gíríìkì lọ kún un.
- source_word: χορτασθῆναι
  choice: kí a ... bọ́ òun
  rationale: Ìṣe aláìṣe-taara náà túmọ̀ sí pé ó fẹ́ kí ẹlòmíràn fún un ní oúnjẹ tó máa tó o; ọ̀rọ̀ yìí bá àyíká oúnjẹ mu ní Yorùbá.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: fi ohun tí ń jábọ́ ... bọ́ òun
  rationale: A pa àpólà oníṣe tí a lò bí orúkọ àti ìṣe tí ń lọ lọ́wọ́ mọ́; a kò fi ‘àjẹkù’ sínú ọ̀rọ̀ pàtàkì nítorí pé Gíríìkì kò sọ ọ́ ní tààrà.
- source_word: τράπεζης
  choice: tábìlì
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún ohun èlò jíjẹun yìí.
- source_word: τοῦ πλουσίου
  choice: ọkùnrin ọlọ́rọ̀ náà
  rationale: Ajẹtífù Gíríìkì dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ọkùnrin ọlọ́rọ̀ inú àkàwé náà.
- source_word: ἀλλὰ καὶ
  choice: Ṣùgbọ́n ... pàápàá
  rationale: Ó pa ìyàtọ̀ àti ohun ìyàlẹ́nu tí àkópọ̀ Gíríìkì náà tẹnumọ́ mọ́.
- source_word: οἱ κύνες
  choice: àwọn ajá
  rationale: Ìtumọ̀ tààrà ti orúkọ ọ̀pọ̀; kò sí ìdí nínú àyíká láti rọ̀ ọ́ tàbí láti ṣàlàyé irú ajá náà.
- source_word: ἐρχόμενοι
  choice: máa ń wá
  rationale: A so àbájáde oníṣe náà mọ́ ìṣe pàtàkì lọ́nà àdánidá ní Yorùbá, pẹ̀lú ìtumọ̀ ìṣe tí ó ń ṣẹlẹ̀ léraléra.
- source_word: ἐπέλειχον
  choice: máa ń ... lá
  rationale: ‘Máa ń’ fi ìṣe àṣà tàbí ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn, ó sì pa ipa imperfect Gíríìkì mọ́.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: àwọn egbò rẹ̀
  rationale: ‘Egbò’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọgbẹ́ tí ó ṣí tàbí ọgbẹ́ oníbàjẹ́, láìdi ọ̀rọ̀ ìṣègùn líle.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. ‘Máa ń wá láti lá’ pa ìṣe tí ó ń ṣẹlẹ̀ léraléra mọ́, nígbà tí àlàyé ìsàlẹ̀ fún [a] pa ìtumọ̀ tààrà àti ìtumọ̀ tí àyíká oúnjẹ ń tọ́ka sí sọ́tọ̀.
