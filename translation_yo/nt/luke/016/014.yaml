id: LUK.16.14
reference: Luke 16:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: yo
  text: Àwọn Farisí, tí wọ́n jẹ́ olùfẹ́ owó, ń gbọ́ gbogbo nǹkan wọ̀nyí, wọ́n sì ń fi í ṣe ẹlẹ́yà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń fi ẹ̀gàn ṣẹ̀sín sí i.” Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí fífi ìtẹ́gàn hàn ní gbangba tàbí ṣíṣe yẹ̀yẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: ń gbọ́
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ìgbọ́ náà ń lọ lọ́wọ́ nígbà ìṣẹ̀lẹ̀ náà; “ń gbọ́” mú apá yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: wọ́n sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn tó rọ̀, kì í ṣe ìtakora líle; “sì” so ìṣe méjèèjì pọ̀ ní Yorùbá láìfi “ní báyìí” tí kò sí nínú orísun kún un.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí gbogbo ẹ̀kọ́ tí Jésù ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: οἱ Φαρισαῖοι
  choice: Àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ Júù náà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: tí wọ́n jẹ́ olùfẹ́ owó
  rationale: Ó pa ìtumọ̀ pàtó ti fífẹ́ owó mọ́, dípò ọ̀rọ̀ gbòòrò bí “oníwọra,” ó sì fi hàn pé àpèjúwe ìwà wọn ni.
- source_word: ἐξεμυκτήριζον
  choice: ń fi í ṣe ẹlẹ́yà
  rationale: Àìpé ọ̀rọ̀-ìṣe náà tọ́ka sí ìṣe tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra; gbolohun yìí sọ ẹ̀gàn ní èdè Yorùbá tó ṣe kedere.
- source_word: αὐτόν
  choice: í
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọ́n ń fi ṣe ẹlẹ́yà.
theological_decisions:
- issue: Àpèjúwe ẹ̀ṣẹ̀ àwọn Farisí nínú φιλάργυροι
  choice: olùfẹ́ owó
  alternative: oníwọra; olójúkòkòrò
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífẹ́ owó ní pàtó. Yíyan “olùfẹ́ owó” pa ìsopọ̀ rẹ̀ mọ́ ẹ̀kọ́ Jésù nípa ọrọ̀, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà níyì, ó sì rọrùn fún òǹkàwé òde òní. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó kan ἐξεμυκτήριζον, kì í ṣe lẹ́yìn “Àwọn Farisí,” nítorí àlàyé náà jẹ́ ti ọ̀rọ̀-ìṣe ẹ̀gàn.
