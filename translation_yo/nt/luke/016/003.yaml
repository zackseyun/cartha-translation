review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the manager's internal deliberation, the ongoing removal of his managerial office, his lack of strength for digging, and his shame at begging. The paired renderings alábòójútó / iṣẹ́ àbójútó appropriately retain the cognate relationship of οἰκονόμος and οἰκονομία.
  naturalness: The wording sọ nínú ara rẹ̀ is understandable but is less idiomatic for internal speech in contemporary Standard Yoruba. Wí fún ara rẹ̀ pé is more natural and retains the sense of speaking to oneself.
  terminology: Ọ̀gá is appropriate for κύριος in this non-divine parable setting. Alábòójútó and iṣẹ́ àbójútó are clear, modern equivalents. The footnote should distinguish the alternative personal designation from the alternative term for the office.
  issues:
  - severity: low
    issue: Internal-speech idiom is somewhat literal.
    rationale: Greek ἐν ἑαυτῷ denotes speech or deliberation directed inwardly. In Yoruba, wí fún ara rẹ̀ pé is a more idiomatic way to express this than sọ nínú ara rẹ̀ pé.
  - severity: low
    issue: Footnote does not clearly state the alternative term for the person.
    rationale: The note gives ìríjú as though it were directly interchangeable with alábòójútó, while the personal alternative should be explicitly identified as ẹni ìríjú; iṣẹ́ ìríjú then corresponds to the office.
