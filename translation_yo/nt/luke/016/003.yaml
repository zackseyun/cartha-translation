id: LUK.16.3
reference: Luke 16:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: yo
  text: Nígbà náà ni alábòójútó náà[a] wí fún ara rẹ̀ pé, “Kí ni èmi yóò ṣe, níwọ̀n bí ọ̀gá mi ti ń gba iṣẹ́ àbójútó náà kúrò lọ́wọ́ mi? Agbára mi kò tó láti walẹ̀, ojú sì ń tì mí láti ṣagbe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ àwọn ọ̀rọ̀ náà sí “ẹni ìríjú” àti “iṣẹ́ ìríjú.” Ọ̀rọ̀ Gíríìkì lo àwọn ọ̀rọ̀ tó jọ ara wọn fún ẹni náà àti ipò iṣẹ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: alábòójútó / iṣẹ́ àbójútó
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì jọ ní ìbátan, wọ́n sì ń tọ́ka sí ẹni tí a fi ohun ìní tàbí ọ̀ràn ẹlòmíràn sí lọ́wọ́ àti ojúṣe rẹ̀. Àwọn yíyan Yorùbá yìí pa ìbátan ọ̀rọ̀ náà mọ́, wọ́n sì ṣe kedere ní èdè òde òní.
- source_word: ἐν ἑαυτῷ
  choice: sọ nínú ara rẹ̀
  rationale: Àkànlò yìí ń fi ọ̀rọ̀ inú tàbí ìrònú tí ẹni náà bá ara rẹ̀ sọ hàn.
- source_word: Τί ποιήσω
  choice: Kí ni èmi yóò ṣe
  rationale: Ìbéèrè inú yìí ń ronú lórí ohun tí yóò ṣe lọ́jọ́ iwájú; fífi “èmi” hàn mú ìdààmú ara ẹni náà ṣe kedere láìfi ohun míì kún orísun.
- source_word: κύριός
  choice: ọ̀gá mi
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà tọ́ka sí ẹni tó ní àṣẹ lórí alábòójútó, kì í ṣe oyè Ọlọ́run. “Ọ̀gá” jẹ́ èdè Yorùbá àdánidá fún ìbáṣepọ̀ iṣẹ́ yìí.
- source_word: ἀφαιρεῖται
  choice: ń gba ... kúrò lọ́wọ́ mi
  rationale: Èyí pa ìtumọ̀ yíyọ ojúṣe náà kúrò ní ìkáwọ́ ẹni náà mọ́, ó sì ṣàfihàn ἀπ’ ἐμοῦ ní kedere.
- source_word: σκάπτειν
  choice: láti walẹ̀
  rationale: Ó túmọ̀ sí iṣẹ́ líle ti fífi ọwọ́ wa ilẹ̀; “walẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà.
- source_word: οὐκ ἰσχύω
  choice: Agbára mi kò tó
  rationale: Ní ìbámu pẹ̀lú iṣẹ́ wíwa ilẹ̀, ọ̀rọ̀ náà tẹnu mọ́ àìní okun ara ju àìlèṣe lásán lọ.
- source_word: ἐπαιτεῖν / αἰσχύνομαι
  choice: ojú sì ń tì mí láti ṣagbe
  rationale: Èyí sọ ìtìjú ẹni náà nípa ṣíṣagbe ní èdè Yorùbá tó wọ́pọ̀, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος níbi tí kò ti ń tọ́ka sí Ọlọ́run
  choice: ọ̀gá
  alternative: olúwa; ẹni tó ni ohun ìní náà
  rationale: Ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ni ọkùnrin ọlọ́rọ̀ inú àkàwé. “Ọ̀gá” pa àṣẹ rẹ̀ lórí alábòójútó mọ́, kò sì mú kí òǹkàwé rò pé oyè Ọlọ́run ni.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Alábòójútó / iṣẹ́ àbójútó” ṣe kedere fún òǹkàwé lasán, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa “ìríjú / iṣẹ́ ìríjú,” èyí tó jẹ́ àṣàyàn ìbílẹ̀, mọ́.
