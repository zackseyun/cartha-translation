  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: yo
  text: Mo ti mọ ohun tí màá ṣe, kí wọ́n lè gbà mí sínú ilé wọn nígbà tí a bá yọ mí kúrò nínú ipò ìríjú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí a bá lé mi kúrò nínú ìríjú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνων
  choice: Mo mọ
  rationale: Aorist náà ní agbára ìmọ̀ tí ó ṣẹ̀ṣẹ̀ yọ sí ẹni náà lẹ́nu; “Mo mọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó ti rí ohun tí yóò ṣe.
- source_word: τί ποιήσω
  choice: ohun tí èmi yóò ṣe
  rationale: Deliberative subjunctive náà ń tọ́ka sí ìgbésẹ̀ tí ó pinnu láti gbé; “yóò ṣe” mú èrò ìpinnu ọjọ́ iwájú náà hàn.
- source_word: ἵνα ὅταν
  choice: kí ... nígbà tí
  rationale: 'Àkójọpọ̀ yìí pa ète àti iṣẹ̀lẹ̀ ọjọ́ iwájú tí ète náà sin mọ́: kí wọ́n lè gbà á nígbà tí yíyọ kúrò ní ipò bá ṣẹlẹ̀.'
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: a bá yọ mí kúrò ní ipò olùṣàkóso
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyọ ẹni kúrò nínú ojúṣe tàbí ipò ìṣàkóso ilé; àfihàn yìí ṣe kedere, ó sì yẹ fún àyíká òwe náà.
- source_word: δέξωνταί με
  choice: wọ́n lè gbà mí
  rationale: δέχομαι lè túmọ̀ sí gbígba tàbí kíkọ́ ẹni káàbọ̀; “gbà mí” pa ìtumọ̀ ìṣàlejò mọ́ láìfi ọ̀yàyà tí kò dájú kún un.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: sí ilé wọn
  rationale: Nínú àyíká gbígba ẹni wọlé, “ilé wọn” jẹ́ èdè Yorùbá àdánidá, ó sì ṣojú reflexive ἑαυτῶν dáadáa.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. A yan “ipò olùṣàkóso” dípò ọ̀rọ̀ ẹ̀sìn pàtó, nítorí àyíká náà jẹ́ ti ìṣàkóso ilé. A fi àmì àlàyé [a] sí òpin gbólóhùn tí àṣàyàn ọ̀rọ̀ náà kan.
