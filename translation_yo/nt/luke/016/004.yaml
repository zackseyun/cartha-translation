  to: Mo ti mọ ohun tí màá ṣe, kí wọ́n lè gbà mí sínú ilé wọn nígbà tí a bá yọ mí kúrò nínú ipò ìríjú.[a]
  rationale: A tún ọ̀rọ̀ náà ṣe ní ìwọ̀n kékeré láti fi ìmọ̀ tí ó ti dé (‘Mo ti mọ’), ìwọlé sínú ilé, àti ipò ìríjú ilé hàn ní kedere. Àmì ẹsẹ̀ náà wà ní òpin gbólóhùn, ó sì tọ́ka sí àṣàyàn ìtumọ̀ fún μετασταθῶ ἐκ τῆς οἰκονομίας.
