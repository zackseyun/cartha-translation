  source_fidelity: 'Ìtumọ̀ náà ní ìbámu tó dáa pẹ̀lú Gíríìkì: ìmọ̀/ìpinnu olùríjú náà, ète rẹ̀, yíyọ kúrò ní ipò rẹ̀, àti gbígba a sínú ilé àwọn ènìyàn náà. Àtúnṣe kékeré náà mú ‘ἐκ τῆς οἰκονομίας’ hàn gẹ́gẹ́ bí ipò ìríjú/ìṣàkóso, ó sì sọ ‘into’ ní εἰς di mímọ́ síi.'
