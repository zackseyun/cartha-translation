id: LUK.16.16
reference: Luke 16:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: yo
  text: “Òfin àti àwọn Wòlíì wà títí dé ìgbà Jòhánù; láti ìgbà náà ni a ti ń kéde ìjọba Ọlọ́run gẹ́gẹ́ bí ìhìn rere, olúkúlùkù sì ń fi agbára wọ inú rẹ̀.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olúkúlùkù sì ń tẹ̀ wọ inú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìlọ tí a fi agbára ṣe; ìtumọ̀ inú ẹsẹ yìí fi ìkanra láti wọ inú ìjọba hàn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lóye apá ìkẹyìn náà ní ọ̀nà òdì díẹ̀ nítorí ọ̀rọ̀ tó jọ ọ́ ní Mátíù 11:12. Ṣùgbọ́n níhìn-ín, “olúkúlùkù” ni olùṣe ọ̀rọ̀ ìṣe Gíríìkì náà, kì í ṣe “ìjọba.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: Òfin
  rationale: Ó tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ẹ̀ka Ìwé Mímọ́, kì í ṣe òfin lápapọ̀; lílo lẹ́tà ńlá fi ẹ̀ka yìí hàn.
- source_word: οἱ προφῆται
  choice: àwọn Wòlíì
  rationale: Ní ìṣọ̀kan pẹ̀lú ‘Òfin,’ ó jẹ́ orúkọ ẹ̀ka Ìwé Mímọ́ àwọn Júù, kì í ṣe àwọn ènìyàn wòlíì nìkan.
- source_word: μέχρι Ἰωάννου
  choice: títí dé ìgbà Johanu
  rationale: Ó fi ààlà àkókò hàn; fífi ‘ìgbà’ kún un mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà. Johanu Apẹ̀bì ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: ἀπὸ τότε
  choice: láti ìgbà náà
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìyípadà àkókò tí ó bẹ̀rẹ̀ nígbà náà tí ó sì ń bá a lọ.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó pa ìtumọ̀ βασιλεία mọ́ gẹ́gẹ́ bí ìjọba tàbí àkóso, láì dín un kù sí ọ̀kan ṣoṣo.
- source_word: εὐαγγελίζεται
  choice: a ti ń kéde ... gẹ́gẹ́ bí ìhìn rere
  rationale: Ìṣe aláìlórúkọ olùṣe náà fi ìkéde tí ń tẹ̀ síwájú hàn, ‘gẹ́gẹ́ bí ìhìn rere’ sì pa èrò εὐαγγελίζω mọ́ ní kedere.
- source_word: πᾶς
  choice: olúkúlùkù
  rationale: Ó fi ipa pínpín ti ọ̀rọ̀ Gíríìkì ẹyọ hàn lọ́nà Yorùbá tí ó jẹ́ àdánidá.
- source_word: εἰς αὐτὴν
  choice: wọ inú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka padà sí ìjọba, ó sì fi ìlọsí inú rẹ̀ hàn.
- source_word: βιάζεται
  choice: ń fi agbára wọ
  rationale: Fọ́ọ̀mù náà ní ìtumọ̀ tí ó nira, ṣùgbọ́n pẹ̀lú πᾶς àti εἰς αὐτήν, ó ṣeé lóye bí ẹni tí ń tẹ̀ tàbí ń fi agbára wọ inú ìjọba; yíyan yìí pa ìkanra àti ìsapá ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ βιάζεται ní ìbáṣepọ̀ pẹ̀lú ìjọba Ọlọ́run
  choice: Gbólóhùn náà ṣàpèjúwe àwọn ènìyàn tí ń fi ìkanra àti agbára wọ inú ìjọba.
  alternative: Àwọn kan lè lóye rẹ̀ ní ọ̀nà òdì díẹ̀ ní ìmọ́lẹ̀ Mátíù 11:12, bí ìwà ipá ṣe kan ìjọba.
  rationale: Nínú Lúùkù yìí, πᾶς (‘olúkúlùkù’) ni olùṣe βιάζεται, εἰς αὐτήν sì tọ́ka sí ìlọ wọ inú ìjọba. A kò túmọ̀ rẹ̀ sí ẹ̀kọ́ pé ènìyàn lè fi iṣẹ́ tirẹ̀ jèrè ìjọba; a fi ìkanra tó wà nínú ọ̀rọ̀ náà sílẹ̀, a sì tọ́ka sí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Òfin’ àti ‘àwọn Wòlíì’ ni a ṣe bí orúkọ ẹ̀ka Ìwé Mímọ́; ‘kéde ... gẹ́gẹ́ bí ìhìn rere’ jẹ́ kedere sí òǹkàwé lásán, nígbà tí ‘fi agbára wọ’ pa ìṣòro àti ìkanra βιάζεται mọ́.
