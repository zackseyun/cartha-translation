id: LUK.16.15
reference: Luke 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ̀yin ni àwọn tí ń dá ara yín láre níwájú àwọn ènìyàn[a], ṣùgbọ́n Ọlọ́run mọ̀ ọkàn yín. Nítorí ohun tí a gbé ga láàárín àwọn ènìyàn[b] jẹ́ ohun ìríra níwájú Ọlọ́run[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lójú àwọn ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí àwọn ènìyàn kà sí iyebíye.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ohun tí Ọlọ́run kórìíra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: ń dá ara yín láre
  rationale: Ó fi ìṣe tí wọn ń bá a lọ hàn, ó sì pa ohun àfojúsùn alápadà ‘ara yín’ mọ́. ‘Dá ... láre’ lè túmọ̀ sí fífi ara ẹni hàn gẹ́gẹ́ bí olódodo tàbí ẹni tí kò lẹ́bi, láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: ‘Níwájú’ pa àwòrán ìdájọ́ ní ojú ẹlòmíràn mọ́; ‘àwọn ènìyàn’ sì jẹ́ ọ̀rọ̀ àkópọ̀ tí ó bá ἀνθρώπων mu láìdín un sí akọ nìkan.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: mọ̀ ọkàn yín
  rationale: Èdè Yorùbá máa ń lo ‘ọkàn yín’ lọ́nà àkópọ̀ níbi yìí. Ó pa ìtumọ̀ ọkàn gẹ́gẹ́ bí inú ẹni, èrò, àti ìfẹ́-ọkàn mọ́.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ohun tí a gbé ga láàárín àwọn ènìyàn
  rationale: ‘Gbé ga’ pa àwòrán gíga inú ὑψηλόν mọ́, ó sì lè tọ́ka sí ohun tí àwùjọ gbé lárugẹ tàbí kà sí pàtàkì láìyan ìtumọ̀ kan ṣoṣo.
- source_word: βδέλυγμα
  choice: ohun ìríra
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá adayeba tí ó lágbára fún ohun tí ó burú, tí ó sì korira níwájú Ọlọ́run; ó tún pa ìrísí ọ̀rọ̀-orúkọ Gíríìkì mọ́.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó bá ‘níwájú àwọn ènìyàn’ mu, ó sì mú ìyàtọ̀ láàárín ìdájọ́ ènìyàn àti ìdájọ́ Ọlọ́run hàn kedere.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Ẹ̀yin ni àwọn tí ...
  rationale: ‘Ẹ̀yin ni’ mú ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì jáde, ó sì jẹ́ ẹ̀sùn tààrà sí àwọn tí Jésù ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ àkópọ̀ ἀνθρώπων nínú gbólóhùn méjèèjì
  choice: àwọn ènìyàn
  alternative: àwọn ọmọ ènìyàn
  rationale: Nínú ẹsẹ yìí, ọ̀rọ̀ Gíríìkì ń tọ́ka sí ènìyàn lápapọ̀ ní ìyàtọ̀ sí Ọlọ́run. ‘Àwọn ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá adayeba tí ó ní ìtumọ̀ àkópọ̀ náà.
- issue: Agbára ìtumọ̀ τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ohun tí a gbé ga láàárín àwọn ènìyàn
  alternative: ohun tí àwọn ènìyàn kà sí iyebíye
  rationale: Àkọ́kọ́ pa àwòrán gíga mọ́, ó sì jẹ́ kí gbólóhùn náà lè kan ipò gíga, ògo, tàbí ohun tí àwùjọ mọyì; àyípadà kejì ṣàlàyé ìtumọ̀ ìmọyì ní kedere sí i.
- issue: Ìríra Ọlọ́run nínú βδέλυγμα ἐνώπιον τοῦ θεοῦ
  choice: ohun ìríra níwájú Ọlọ́run
  alternative: ohun tí Ọlọ́run kórìíra
  rationale: Àkọ́kọ́ pa ọ̀rọ̀-orúkọ βδέλυγμα àti ìbáradọ́gba ‘níwájú’ mọ́, láìyí ọ̀rọ̀ náà padà sí gbólóhùn ìṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ adayeba. Ìṣètò gbólóhùn náà pa ìtẹnumọ́ ‘Ẹ̀yin ni,’ ìyàtọ̀ ‘ènìyàn/Ọlọ́run,’ àti àwòrán ‘gbé ga’ Gíríìkì mọ́.
