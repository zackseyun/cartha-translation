id: LUK.16.10
reference: Luke 16:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: yo
  text: Ẹni tí ó jẹ́ olóòtítọ́ nínú ohun tí ó kéré jù lọ[a], olóòtítọ́ ni nínú ohun púpọ̀ pẹ̀lú; ẹni tí ó jẹ́ aláìṣòdodo[b] nínú ohun tí ó kéré jù lọ, aláìṣòdodo ni nínú ohun púpọ̀ pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ohun tí ó kéré jù lọ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí ó kéré gan-an tàbí tí a kò ka sí pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “aláìṣòótọ́” tàbí “tí kò ṣe òdodo.” Ọ̀rọ̀ Gíríìkì náà gbòòrò ju àìṣòótọ́ nípa owó lọ, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ yẹn bá àyíká ọ̀rọ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: olóòtítọ́
  rationale: Nínú ọ̀rọ̀ yìí, ó ń tọ́ka sí ẹni tí a lè gbẹ́kẹ̀ lé ní ṣíṣe ohun tí a fi lé e lọ́wọ́, kì í ṣe sí ẹni tí ó kàn gbàgbọ́ nìkan. “Olóòtítọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú ìgbẹ́kẹ̀lé àti ìdúróṣinṣin yìí jáde.
- source_word: ἐν ἐλαχίστῳ
  choice: nínú ohun tí ó kéré jù lọ
  rationale: Èyí pa ìtumọ̀ ibi tàbí ipò tí ẹni ti hùwà mọ́, ó sì fi ìtakora pẹ̀lú “nínú ohun púpọ̀” hàn kedere.
- source_word: πολλῷ
  choice: nínú ohun púpọ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìwọ̀n tàbí iye púpọ̀, ní ìtakora pẹ̀lú ohun tí ó kéré jù lọ. A kò sọ ọ́ di “ọ̀pọ̀lọpọ̀ ohun” nítorí ẹyọ aláìdásí akọ tàbí abo inú Gíríìkì.
- source_word: ἄδικος
  choice: aláìṣòdodo
  rationale: “Aláìṣòdodo” pa ẹ̀ka ìwà búburú tó gbòòrò mọ́, dípò kí ó dín ọ̀rọ̀ náà kù sí àìṣòtítọ́ nípa owó nìkan, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ní í ṣe pẹ̀lú ìríjú àti ọrọ̀.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: ẹni tí ó bá jẹ́ olóòtítọ́ ... ẹni tí ó sì jẹ́ aláìṣòdodo
  rationale: Àpilẹ̀kọ Gíríìkì pẹ̀lú ajẹtífù dúró gẹ́gẹ́ bí orúkọ ẹni. “Ẹni tí...” jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi akọ tàbí abo tí orísun kò tẹnumọ́ kún un.
- source_word: καὶ
  choice: pẹ̀lú / sì
  rationale: “Pẹ̀lú” mú agbára àfikún ‘also’ jáde nínú gbólóhùn méjèèjì, “sì” sì so ìdajì kejì mọ́ ti àkọ́kọ́ ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ ìwà ἄδικος nínú àyíká ìríjú
  choice: aláìṣòdodo
  alternative: aláìṣòótọ́ tàbí aláìdúróṣinṣin
  rationale: Ọ̀rọ̀ náà sọ ìlànà ìwà gbogbogbò, kì í ṣe ọ̀rọ̀ ìṣúná nìkan. “Aláìṣòdodo” kò dín ìtumọ̀ rẹ̀ kù sí jíjẹ́ aláìṣòótọ́ nípa owó, ó sì bá àyíká ẹsẹ̀ náà mu.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo àtúnṣe ọ̀rọ̀ àsọtẹ́lẹ̀ “yóò jẹ́” láti mú ìlànà gbogbogbò tí gbólóhùn orúkọ Gíríìkì ń sọ jáde; kò túmọ̀ sí àsọtẹ́lẹ̀ ọjọ́ iwájú nìkan.
