id: LUK.16.25
reference: Luke 16:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: yo
  text: Ṣùgbọ́n Ábúráhámù wí pé, “Ọmọ, rántí pé nígbà ayé rẹ, o gba[a] àwọn ohun rere tirẹ, Lásárù sì gba àwọn ohun búburú bákan náà; ṣùgbọ́n nísinsìnyí, a ń tù ú nínú níhìn-ín, ìwọ sì wà nínú ìrora ńlá.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “o gba àwọn ohun rere tirẹ ní kíkún.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbígba ohun tí a pín fún ẹni tàbí gbígba ohun ní kíkún.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ń dá ọ lóró.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìrora ara tàbí ìpọ́njú ọkàn tó le koko.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Ọmọ
  rationale: Ọ̀rọ̀ ìpè yìí fi ìbáṣepọ̀ oníyọ̀ọ́nú àti ipò àgbà sí kékeré hàn, láìfi dandan sọ pé ọmọ bíbí ni.
- source_word: μνήσθητι
  choice: rántí
  rationale: Ó jẹ́ àṣẹ tààrà láti pe ohun tó ti kọjá padà sí ọkàn; “rántí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì mọ́gbọ́n dání.
- source_word: ἀπέλαβες
  choice: o gba
  rationale: “Gba” dá ìtumọ̀ gbígba ohun tí ó jẹ́ ti ẹni mú; a fi àlàyé sí àlàyé ìsàlẹ̀ nítorí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí gbígba ohun ní kíkún.
- source_word: τὰ ἀγαθά σου
  choice: àwọn ohun rere tirẹ
  rationale: Èyí pa ìtumọ̀ gbòòrò ti ohun tó dára tàbí tó dùn mọ́, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ bí “ìbùkún.”
- source_word: ἐν τῇ ζωῇ σου
  choice: nígbà ayé rẹ
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún àkókò gbogbo ìgbésí ayé ẹni lórí ayé.
- source_word: ὁμοίως
  choice: bákan náà
  rationale: Ó fi ìfarawé tó wà láàárín ohun tí ọkùnrin ọlọ́rọ̀ gba àti ohun tí Lásárù gba hàn, bó tilẹ̀ jẹ́ pé àwọn ohun náà yàtọ̀ síra.
- source_word: τὰ κακά
  choice: àwọn ohun búburú
  rationale: Ó pa ìtumọ̀ gbòòrò ti àwọn ohun ìnira tàbí ohun tí kò dára tí Lásárù nírìírí mọ́; kò túmọ̀ sí pé ó ṣe ìwà búburú.
- source_word: παρακαλεῖται
  choice: a ń tù ú nínú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé Lásárù ń gba ìtùnú; ìṣèdá palolo Yorùbá yìí sọ ìyẹn ní kedere.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó tọ́ka sí ibi tí Ábúráhámù àti Lásárù wà nínú ìtàn náà.
- source_word: ὀδυνᾶσαι
  choice: ìwọ sì wà nínú ìrora ńlá
  rationale: Ó fi ìrora tàbí ìpọ́njú tó le koko hàn, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ tó ṣàpèjúwe ìjìyà lẹ́yìn ikú
  choice: ìwọ sì wà nínú ìrora ńlá
  alternative: a ń dá ọ lóró
  rationale: Ìtumọ̀ yìí jẹ́ kí ìjìyà tó le koko hàn, ṣùgbọ́n kò fi dandan pinnu bóyá ẹnì kan ló ń dá a lóró tàbí ìrora ni ipò tó wà ń fà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Ọmọ” pa ìrẹ̀lẹ̀ inú ọ̀rọ̀ ìpè náà mọ́; “àwọn ohun rere/àwọn ohun búburú” sì pa ìfarawé àti ìyàtọ̀ inú Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
