base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: yo
  text: Ṣùgbọ́n Ábúráhámù wí pé, “Wọ́n ní Mósè àti àwọn Wòlíì[a]; kí wọ́n fetí sí wọn[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mósè àti àwọn Wòlíì” ń tọ́ka sí ẹ̀rí Ìwé Mímọ́ tí ó ní í ṣe pẹ̀lú Mósè àti àwọn ìwé àwọn wòlíì.
    reason: cross_reference
  - marker: b
    text: Tàbí, ní ìtumọ̀ tí ó túbọ̀ tẹ̀ lé ọ̀rọ̀ gangan, “kí wọ́n gbọ́ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Ṣùgbọ́n … wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìtàn ní àkókò ìsinsìnyí ní Gíríìkì, ṣùgbọ́n ‘wí pé’ bá ìtàn Yorùbá mu lọ́nà àdánidá. ‘Ṣùgbọ́n’ fi ìyípadà àti ìtakora díẹ̀ nínú ìdáhùn náà hàn.
- source_word: Ἀβραάμ
  choice: Ábúráhámù
  rationale: A lo ìrísí orúkọ yìí tí ó ti wọ́pọ̀ nínú èdè Yorùbá.
- source_word: Ἔχουσι
  choice: Wọ́n ní
  rationale: Ó sọ pé ohun tí a mẹ́nu kàn wà lọ́wọ́ wọn tàbí pé wọ́n ní àǹfààní sí i ní ìsinsìnyí.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Mósè àti àwọn Wòlíì
  rationale: A pa gbólóhùn kúkúrú ti Gíríìkì mọ́; ó lè tọ́ka sí Mósè àti àwọn wòlíì, àti nípa àkàwé sí ẹ̀rí Ìwé Mímọ́ tí ó so mọ́ wọn.
- source_word: ἀκουσάτωσαν
  choice: kí wọ́n fetí sí
  rationale: Àṣẹ ẹni kẹta ọ̀pọ̀ ni; ‘kí wọ́n fetí sí’ fi hàn pé kí wọ́n gbọ́ pẹ̀lú àfiyèsí, kí wọ́n sì gba ọ̀rọ̀ náà sí ọkàn.
- source_word: αὐτῶν
  choice: wọn
  rationale: Arọ́pò-orúkọ náà padà tọ́ka sí Mósè àti àwọn Wòlíì; ‘fetí sí wọn’ jẹ́ ọ̀nà àdánidá láti sọ ìbáṣepọ̀ tí àkópọ̀ ọ̀rọ̀ Gíríìkì náà ní.
theological_decisions:
- issue: Ohun tí ‘Mósè àti àwọn Wòlíì’ ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ gẹ́gẹ́ bí ó ti rí, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó tún dúró fún ẹ̀rí Ìwé Mímọ́ tí ó so mọ́ wọn.
  alternative: Kí a túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘Òfin Mósè àti àwọn ìwé àwọn Wòlíì.’
  rationale: Lílò rẹ̀ nínú àṣà Júù àti nínú Lúùkù sábà máa ń tọ́ka sí Ìwé Mímọ́. Síbẹ̀, fífi gbólóhùn gangan náà pamọ́ kò jẹ́ kí ìtumọ̀ náà di fífẹ̀ ju Gíríìkì lọ, kò sì pa ìtọ́kasí sí àwọn ènìyàn náà rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘fetí sí’ láti mú ìtumọ̀ gbígbọ́ pẹ̀lú ìgbọràn tàbí àfiyèsí jáde láìfi ẹ̀kọ́ ìsìn kan kún un.
