    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ohun tòótọ́”; nínú àyíká yìí, ìtumọ̀ rẹ̀ ni ohun ìní tòótọ́, ní ìyàtọ̀ sí ọrọ̀ àìṣòdodo.
    reason: lexical_alternative
  revision_rationale: 'The revision makes two limited fidelity improvements: it renders the Greek ἐν with Yoruba ‘nínú’ rather than the broader ‘nípa,’ and it corrects the explanatory contrast in footnote b to ‘ọrọ̀ àìṣòdodo.’ Adding ‘ti’ in the conditional naturally presents the source’s aorist as a prior demonstrated failure without imposing a doctrinal interpretation. No textual ambiguity is removed beyond the idiomatic supplied noun ‘ohun ìní,’ which remains explicitly identified in the note.'
