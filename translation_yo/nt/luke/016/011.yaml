review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional argument, the contrast between unrighteous wealth and τὸ ἀληθινόν, and πιστεύσει as entrusting rather than believing. Revising ‘nípa’ to ‘nínú’ better represents ἐν as the sphere in which faithfulness is demonstrated. The conditional is adjusted with ‘ti’ to reflect the retrospective force naturally conveyed by οὐκ ἐγένεσθε in context.
  naturalness: The revised wording is standard, natural Yoruba. ‘Olóòtítọ́ nínú ọrọ̀’ is a clear stewardship expression, and ‘fi ... lé yín lọ́wọ́’ is idiomatic for entrusting.
  terminology: ‘Ọ̀rọ̀ àìṣòdodo’ retains the moral qualification of ἀδίκῳ without narrowing it to fraud. ‘Ohun ìní tòótọ́’ is an appropriately restrained idiomatic completion of the substantival adjective τὸ ἀληθινόν. The second note now contrasts it directly with the phrase actually used in the verse, rather than adding ‘worldly’ as the contrast category.
  issues:
  - severity: low
    issue: ‘Nípa’ weakens the force of ἐν.
    rationale: ‘Nípa ọrọ̀’ can mean ‘concerning wealth,’ whereas ἐν indicates the sphere or context in which faithfulness is shown. ‘Nínú ọrọ̀’ preserves this relationship more directly and remains idiomatic.
  - severity: low
    issue: Footnote b says ‘ọrọ̀ ayé’ (‘worldly wealth’).
    rationale: The Greek contrast is explicitly with ‘unrighteous mammon,’ not directly with ‘worldly wealth.’ The note should preserve the wording and moral coloring of the source.
  revised_text: Nítorí náà, bí ẹ̀yin kò bá ti jẹ́ olóòtítọ́ nínú ọrọ̀ àìṣòdodo[a], ta ni yóò fi ohun ìní tòótọ́[b] lé yín lọ́wọ́?
