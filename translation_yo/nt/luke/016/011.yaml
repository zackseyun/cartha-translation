id: LUK.16.11
reference: Luke 16:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: yo
  text: Nítorí náà, bí ẹ̀yin kò bá ti jẹ́ olóòtítọ́ nínú ọrọ̀ àìṣòdodo[a], ta ni yóò fi ohun ìní tòótọ́[b] lé yín lọ́wọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọrọ̀ aláìṣòdodo”; ní Gíríìkì, “mámónì àìṣòdodo.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ohun tòótọ́”; nínú àyíká yìí, ìtumọ̀ rẹ̀ ni ohun ìní tòótọ́, ní ìyàtọ̀ sí ọrọ̀ àìṣòdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: àìṣòdodo
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí kò bá òdodo mu. Ó pa àwọ̀ ìwà rere inú Gíríìkì mọ́, láì dín ìtumọ̀ rẹ̀ kù sí ọrọ̀ tí a fi ẹ̀tàn rí nìkan.
- source_word: μαμωνᾷ
  choice: ọrọ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ọrọ̀ tàbí ohun ìní; ‘ọrọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì gbòòrò ju owó lásán lọ.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: nípa ọrọ̀ àìṣòdodo
  rationale: ‘Nípa’ fi hàn pé ìṣòtítọ́ wọn ni a ń dán wò nínú bí wọ́n ṣe ń lò tàbí bójú tó ọrọ̀ náà; ó jẹ́ Yorùbá àdánidá ju títúmọ̀ ἐν ní ọ̀rọ̀-ọ̀rọ̀ lọ.
- source_word: πιστοὶ
  choice: olóòtítọ́
  rationale: Nínú ọ̀rọ̀ iṣẹ́ ìríjú yìí, ó ṣàpèjúwe ẹni tí a lè gbẹ́kẹ̀ lé, tí ó sì ń ṣe ojúṣe rẹ̀ ní òtítọ́.
- source_word: οὐκ ἐγένεσθε
  choice: kò bá jẹ́
  rationale: Pẹ̀lú ajẹtífù gẹ́gẹ́ bí àpólà àṣeparí, γίνομαι lè túmọ̀ sí jíjẹ́ tàbí fífi ara ẹni hàn gẹ́gẹ́ bí; ìtumọ̀ yìí jẹ́ àdánidá nínú gbólóhùn àdéhùn Yorùbá.
- source_word: τὸ ἀληθινὸν
  choice: ohun ìní tòótọ́
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, kò sì sọ orúkọ ohun náà ní kedere. ‘Ohun ìní tòótọ́’ mú ìyàtọ̀ rẹ̀ sí ọrọ̀ ayé hàn, ṣùgbọ́n àmì àlàyé pa àìsọ pàtó inú Gíríìkì mọ́.
- source_word: πιστεύσει
  choice: yóò fi ... lé yín lọ́wọ́
  rationale: Pẹ̀lú ẹni tí a fi ohun fún àti ohun tí a fi fún un, πιστεύω túmọ̀ sí fífi ohun sí ìkáwọ́ ẹni tàbí fífi í lé e lọ́wọ́, kì í ṣe ‘gbàgbọ́.’
theological_decisions:
- issue: Ìtumọ̀ τὸ ἀληθινὸν ní ìyàtọ̀ sí ọrọ̀ àìṣòdodo
  choice: ohun ìní tòótọ́
  alternative: ohun tòótọ́
  rationale: Gíríìkì fi orúkọ ohun náà sílẹ̀ láìsọ, ṣùgbọ́n ìyàtọ̀ pẹ̀lú μαμωνᾷ fi hàn pé ohun iyebíye tàbí ọrọ̀ tòótọ́ ni a ń tọ́ka sí. ‘Ohun ìní’ jẹ́ àfikún fún Yorùbá tó ṣe kedere, kì í ṣe fífi ẹ̀kọ́ ìsìn kan sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘ẹ̀yin/yín’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμεῖς/ὑμῖν, a sì pa ìbéèrè àsọyé àti ìyàtọ̀ tó wà nínú Gíríìkì mọ́.
