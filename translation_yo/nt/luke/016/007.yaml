id: LUK.16.7
reference: Luke 16:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: yo
  text: Lẹ́yìn náà, ó sọ fún ẹlòmíràn pé, “Ìwọ ńkọ́, iye mélòó ni o jẹ ní gbèsè?” Ó dáhùn pé, “Ọgọ́rùn-ún kórì[b] àlìkámà.” Ó sọ fún un pé, “Gba ìwé gbèsè rẹ[a], kí o sì kọ ọgọ́rin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àdéhùn tí a kọ sílẹ̀” tàbí “àwọn ìwé rẹ”; Gíríìkì ní “àwọn ìkọ̀wé rẹ” (τὰ γράμματα), èyí tó ń tọ́ka sí ìwé tàbí àkọsílẹ̀ gbèsè ajigbèsè náà níbí.
    reason: lexical_alternative
  - marker: b
    text: Kórì jẹ́ òṣùwọ̀n ńlá fún ohun gbígbẹ, bí irúgbìn ọkà, ní ayé àtijọ́.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ti ẹni tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἑτέρῳ
  choice: fún ẹlòmíràn
  rationale: Ó tọ́ka sí ẹlòmíràn tó yàtọ̀ sí ajigbèsè àkọ́kọ́ láìfi akọ tàbí abo kún ohun tí Gíríìkì sọ.
- source_word: Σὺ δὲ
  choice: Ìwọ ńkọ́
  rationale: Ó mú ìtẹnumọ́ arọ́pò-orúkọ náà àti ìyípadà sí ajigbèsè kejì jáde ní Yorùbá àdánidá.
- source_word: πόσον ὀφείλεις
  choice: iye mélòó ni o jẹ ní gbèsè
  rationale: Ó sọ gbèsè owó tàbí ohun-ìní ní kedere, ó sì pa ìbéèrè nípa iye náà mọ́.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Ọgọ́rùn-ún kórì àlìkámà
  rationale: A pa orúkọ òṣùwọ̀n pàtó ìgbàanì náà mọ́ gẹ́gẹ́ bí “kórì,” dípò lílo “òṣùwọ̀n” lásán; àlìkámà ni σῖτος túmọ̀ sí ní àyíká yìí.
- source_word: λέγει αὐτῷ
  choice: Ó sọ fún un
  rationale: Ìṣe ọ̀rọ̀ náà ṣe kedere; èdè Yorùbá kò nílò ìyàtọ̀ fọ́ọ̀mù ọ̀rọ̀-ìṣe láti fi historical present Gíríìkì hàn.
- source_word: Δέξαι
  choice: Gba
  rationale: Àṣẹ náà ni pé kí ajigbèsè náà gba ìwé náà sí ọwọ́ rẹ̀, “Gba” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: σου τὰ γράμματα
  choice: ìwé gbèsè rẹ
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì túmọ̀ ní tààrà sí “àwọn ìwé rẹ,” àyíká náà fi hàn pé ìwé tí a kọ iye gbèsè sí ni.
- source_word: γράψον ὀγδοήκοντα
  choice: kí o sì kọ ọgọ́rin
  rationale: Ó pa àṣẹ láti kọ iye tuntun náà mọ́, láìṣàlàyé sí i ju ohun tí orísun sọ lọ.
