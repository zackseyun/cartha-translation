translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ. “Ìwọ ńkọ́” mú ìtẹnumọ́ àti ìyípadà ẹni tí a ń bá sọ̀rọ̀ jáde; “kórì” sì pa òṣùwọ̀n ìgbàanì pàtó náà mọ́ pẹ̀lú àlàyé ìsàlẹ̀ ojú-ewé.
