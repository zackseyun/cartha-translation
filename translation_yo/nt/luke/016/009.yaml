  source_fidelity: Ìtumọ̀ náà ń pa àṣẹ náà, ìtumọ̀ ohun-èlò ti ἐκ, àìjẹ́-kíkọ olùṣe ἐκλίπῃ ní pàtó, àti aṣojú àìmòye ti δέξωνται mọ́. Síbẹ̀, ‘ọ̀rọ̀ àìṣòdodo’ lè dà bí ‘ọ̀rọ̀/mátà’ fún ọ̀pọ̀ olùkà òde òní, kì í sì jẹ́ ìtumọ̀ tó hàn gbangba fún μαμωνᾶς gẹ́gẹ́ bí ìní tàbí ọrọ̀ ọlọ́rọ̀.
