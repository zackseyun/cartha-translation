revisions:
- from: Èmi sì wí fún yín pé, ẹ fi ọrọ̀ àìṣòdodo ṣe ọ̀rẹ́ fún ara yín,[a] kí nígbà tí ó bá kùnà,[b] wọn lè gbà yín sínú àwọn ibùgbé ayérayé.[c]
  to: Èmi sì wí fún yín pé, ẹ lo ìní àìṣòdodo náà láti ṣe ọ̀rẹ́ fún ara yín,[a] kí nígbà tí ó bá dópin,[b] wọn lè gbà yín sínú àwọn ibùgbé ayérayé.[c]
  rationale: Àtúnṣe náà ń mú μαμωνᾶς hàn kedere sí olùkà Yorùbá òde òní nípa lílo ‘ìní,’ nígbà tí ó ń pa ìfẹ̀sùn gbooro ti ‘àìṣòdodo’ mọ́. A tún lo ‘dópin’ fún ìparí ìní, ṣùgbọ́n a fi òye yíyàtọ̀—pẹ̀lú ikú ẹni—sílẹ̀ nínú àlàyé. A kò dárúkọ ẹni tí ‘wọn’ jẹ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:38Z'
