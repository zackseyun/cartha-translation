id: LUK.16.9
reference: Luke 16:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: yo
  text: Èmi sì wí fún yín pé, ẹ lo ìní àìṣòdodo náà láti ṣe ọ̀rẹ́ fún ara yín,[a] kí nígbà tí ó bá dópin,[b] wọn lè gbà yín sínú àwọn ibùgbé ayérayé.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “ẹ ṣe ọ̀rẹ́ fún ara yín láti inú Mámónì àìṣòdodo.” “Mámónì” jẹ́ ọ̀rọ̀ ìbílẹ̀ fún ìní tàbí owó.'
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí “nígbà tí ẹ̀yin bá dópin,” ìyẹn, nígbà tí ẹ bá kú, tàbí “nígbà tí ó bá tán.” Gíríìkì kò sọ olùṣe ọ̀rọ̀-ìṣe náà ní gbangba; ọ̀pọ̀ ló ka a sí ìní tí ń dópin, àwọn mìíràn sì ka a sí ikú ènìyàn.
    reason: alternative_reading
  - marker: c
    text: Tàbí “wọ́n lè tẹ́wọ́ gbà yín sínú àwọn àgọ́ ayérayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: ẹ fi ... ṣe ọ̀rẹ́ fún ara yín
  rationale: 'Ó mú ìtumọ̀ àṣẹ àti ọ̀rọ̀ arọ́pò aṣojú padà ní Yorùbá àdánidá: kí àwọn olùgbọ́ lo ọrọ̀ láti ṣe ọ̀rẹ́ fún ara wọn.'
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: ẹ fi ọrọ̀ àìṣòdodo
  rationale: “Fi” sọ agbára ohun èlò tí ἐκ ní nínú àyíká yìí; “ọrọ̀” túmọ̀ μαμωνᾶς ní kedere láìfi dandan sọ ọ́ di ẹni kan, “àìṣòdodo” sì pa ìtumọ̀ ἀδικία mọ́ láìdín un kù sí owó tí a rí gbà nípasẹ̀ ẹ̀tàn nìkan.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: kí nígbà tí ó bá kùnà
  rationale: “Ó” tọ́ka sí ọrọ̀ gẹ́gẹ́ bí ohun tí ó sún mọ́ ọ̀rọ̀-ìṣe jù lọ, “kùnà” sì pa ìtumọ̀ pé ó dópin tàbí pé kò lè ran ni lọ́wọ́ mọ́; àlàyé ìsàlẹ̀ pa àwọn òye mìíràn mọ́.
- source_word: δέξωνται ὑμᾶς
  choice: wọn lè gbà yín
  rationale: Ó pa ẹni tí “wọn” ń tọ́ka sí mọ́ láìsọ ní pàtó, bí Gíríìkì náà ti ṣe; “gbà ... sínú” jẹ́ ọ̀nà Yorùbá àdánidá fún ìtẹ́wọ́gbà sí ibùgbé.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: sínú àwọn ibùgbé ayérayé
  rationale: “Ibùgbé” mú èrò ibi gbígbé inú σκηναί jáde ní Yorùbá tí ó ṣe kedere, “ayérayé” sì bá αἰωνίους mu; “àgọ́” wà nínú àlàyé gẹ́gẹ́ bí ìtumọ̀ tààrà.
theological_decisions:
- issue: Ìtumọ̀ “ọrọ̀ àìṣòdodo”
  choice: Ọrọ̀ ayé tí àìṣòdodo ní í ṣe pẹ̀lú, láìsọ pé gbogbo rẹ̀ jẹ́ ohun tí a rí gbà ní ẹ̀tàn
  alternative: Ọrọ̀ tí a rí gbà lọ́nà àìṣòótọ́; tàbí Mámónì tí a sọ di ẹni kan
  rationale: Gbólóhùn náà kò yẹ kí a dín kù sí ọrọ̀ jíjẹ tàbí ẹ̀tàn nìkan, bẹ́ẹ̀ ni kò fi dandan sọ Mámónì di ẹni kan ní ẹsẹ yìí.
- issue: Ẹni tàbí ohun tí ó jẹ́ olùṣe ἐκλίπῃ
  choice: Ọrọ̀ náà kùnà tàbí dópin
  alternative: Ẹ̀yin kùnà, ìyẹn, ẹ kú; tàbí àwọn ohun ìní ayé lápapọ̀ dópin
  rationale: μαμωνᾶς ni ohun tí ó sún mọ́ ọ̀rọ̀-ìṣe jù lọ, ṣùgbọ́n Gíríìkì kò tún olùṣe náà sọ ní gbangba; a pa àwọn òye mìíràn mọ́ nínú àlàyé.
- issue: Àwọn wo ni “wọn” nínú δέξωνται
  choice: A kò sọ ẹni tí “wọn” jẹ́ ní pàtó
  alternative: Àwọn ọ̀rẹ́ tí a ṣe; àwọn tálákà tàbí ènìyàn Ọlọ́run; àwọn ẹ̀dá ọ̀run
  rationale: Gíríìkì fi olùṣe ọ̀rọ̀-ìṣe náà sílẹ̀ láìdárúkọ rẹ̀; fífi ẹni kan kun un yóò túmọ̀ ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ” fún ọ̀pọ̀ ènìyàn nítorí ὑμῖν/ὑμᾶς jẹ́ ọ̀pọ̀.
