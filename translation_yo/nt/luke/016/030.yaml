- from: Ṣùgbọ́n ó ní, “Rárá, Bàbá Ábúráhámù. Ṣùgbọ́n bí ẹnì kan bá lọ sọ́dọ̀ wọn láti àárín àwọn òkú[a], wọn yóò ronú pìwà dà.”
  to: Ṣùgbọ́n ó ní, “Rárá, Bàbá Ábúráhámù. Ṣùgbọ́n bí ẹnì kan bá lọ sọ́dọ̀ wọn láti àárín àwọn òkú[a], wọn yóò ronúpìwàdà.”
  rationale: The revision standardizes the Yoruba repentance term as “ronúpìwàdà,” preserving the full ethical and spiritual force of μετανοέω. It also adjusts the lexical-alternative footnote to retain the Greek plural “dead.” No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
