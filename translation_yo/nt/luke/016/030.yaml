source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: yo
  text: Ṣùgbọ́n ó ní, “Rárá, Bàbá Ábúráhámù. Ṣùgbọ́n bí ẹnì kan bá lọ sọ́dọ̀ wọn láti àárín àwọn òkú[a], wọn yóò ronúpìwàdà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ṣókí, “láti inú àwọn òkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐχί
  choice: Rárá
  rationale: Ọ̀rọ̀ ìkọ̀ yìí lágbára, ó sì tako ohun tí Ábúráhámù ṣẹ̀ṣẹ̀ sọ. “Rárá” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πάτερ Ἀβραάμ
  choice: Bàbá Ábúráhámù
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè tí ó fi hàn pé ọkùnrin náà ń bẹ Ábúráhámù gẹ́gẹ́ bí baba ńlá rẹ̀.
- source_word: ἀλλ’ ἐάν
  choice: Ṣùgbọ́n bí
  rationale: Ó fi àtúnṣe àti ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn, ó sì mú gbólóhùn oní条件̀ wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: τις
  choice: ẹ̀nì kan
  rationale: Ó tọ́ka sí ẹni tí a kò dárúkọ ní ẹyọ; “ẹ̀nì kan” ni ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: ἀπὸ νεκρῶν
  choice: láti àárín àwọn òkú
  rationale: Ìtumọ̀ yìí jẹ́ kí èrò pé ẹni náà jáde láti inú ẹgbẹ́ tàbí ipò àwọn òkú ṣe kedere, láìpa àṣàyàn kíkà tó rọrùn run.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: bá lọ sọ́dọ̀ wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ sí ọ̀dọ̀ àwọn ẹni tí a ń sọ̀rọ̀ nípa wọn; ìṣètò yìí bá Yorùbá àdánidá mu.
- source_word: μετανοήσουσιν
  choice: wọn yóò ronú pìwà dà
  rationale: Gbólóhùn Yorùbá yìí ń sọ ìrònúpìwàdà tó ní ìyípadà ọkàn àti ìwà nínú, kì í ṣe yíyí èrò lasán.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìrònúpìwàdà
  choice: wọn yóò ronú pìwà dà
  alternative: wọn yóò yí èrò wọn padà
  rationale: Nínú àyíká ọ̀rọ̀ Lúùkù yìí, μετανοήσουσιν ń tọ́ka sí ìdáhùn sí ìkìlọ̀ Ọlọ́run tí ó yí ọkàn àti ìwà padà. “Ronú pìwà dà” pa agbára ẹ̀mí àti ti ìwà rere náà mọ́, láìdín in kù sí àtúnrò ọpọlọ nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn. “Bàbá Ábúráhámù” pa ìbáṣepọ̀ baba ńlá mọ́, “ronú pìwà dà” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìrònúpìwàdà.
