source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: yo
  text: Nítorí mo ní arákùnrin márùn-ún, kí ó lè kìlọ̀ fún wọn gidigidi[a], kí àwọn náà má bàa wá sí ibi ìrora yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó lè jẹ́rìí fún wọn,” tàbí, “kí ó lè kìlọ̀ fún wọn pẹ̀lú ìtẹnumọ́.” Ọ̀rọ̀ Gíríìkì náà ní èrò jíjẹ́rìí tàbí kíkìlọ̀ pẹ̀lú ìtẹnumọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: nítorí mo ní
  rationale: γάρ ṣàlàyé ìdí ẹ̀bẹ̀ tí ó ṣáájú, ἔχω sì jẹ́ ọ̀rọ̀ ìní lasán; ‘nítorí mo ní’ jẹ́ Yorùbá àdánidá.
- source_word: πέντε ἀδελφούς
  choice: arákùnrin márùn-ún
  rationale: ἀδελφούς jẹ́ ọ̀pọ̀ akọ, ó sì tọ́ka sí àwọn arákùnrin ọkùnrin ní àyíká yìí.
- source_word: ὅπως
  choice: kí ó lè
  rationale: Ó ṣàfihàn ète; ‘kí ó lè’ sọ ète náà ní Yorùbá tí ó ṣe kedere.
- source_word: διαμαρτύρηται
  choice: fi ọ̀rọ̀ ṣe ìkìlọ̀ líle fún wọn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí jíjẹ́rìí tàbí kìlọ̀ pẹ̀lú ìtẹnumọ́. Nínú àyíká yìí, ìkìlọ̀ ni ipa pàtàkì rẹ̀, ṣùgbọ́n ‘fi ọ̀rọ̀ ṣe’ tún pa ojú ìtumọ̀ jíjẹ́rìí mọ́.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: kí àwọn náà má bàa wá
  rationale: ἵνα μή sọ ète odi, καὶ αὐτοὶ sì túmọ̀ sí ‘àwọn náà’; ‘má bàa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdènà ète.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: sí ibi ìrora yìí
  rationale: εἰς tọ́ka sí ibi tí a ń lọ, βάσανος sì jẹ́ ìrora tàbí ìjìyà líle. ‘Ibi ìrora yìí’ pa àpèjúwe ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Àpèjúwe ibi lẹ́yìn ikú nínú ọ̀rọ̀ ọkùnrin ọlọ́rọ̀
  choice: ibi ìrora yìí
  alternative: ibi ìjìyà yìí
  rationale: ‘Ìrora’ ṣàfihàn βάσανος gẹ́gẹ́ bí ìrírí ìpọ́njú líle, láìmú ìtumọ̀ rẹ̀ di ìdájọ́ tàbí ìjìyà ní pàtó ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘má bàa’ fún ète odi, a sì pa ìtẹnumọ́ àti àìdánilójú inú διαμαρτύρηται mọ́ nípasẹ̀ àkọsílẹ̀ ìsàlẹ̀.
