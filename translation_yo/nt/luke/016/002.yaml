revisions:
- from: Ó sì pè é wá, ó sì wí fún un pé, “Kí ni èyí tí mo ń gbọ́ nípa rẹ? Fi ìṣirò iṣẹ́ ìríjú rẹ lé mi lọ́wọ́,[a] nítorí ìwọ kò lè ṣe ìríjú mọ́.”[b]
  to: Ó sì pè é wá, ó sì wí fún un pé, “Kí ni èyí tí mo ń gbọ́ nípa rẹ? Fún mi ní ìṣirò iṣẹ́ ìríjú rẹ,[a] nítorí ìwọ kò lè máa ṣe iṣẹ́ ìríjú mọ́.”[b]
  rationale: 'The revision retains the source’s sequence and administrative metaphor, while using a more idiomatic Yoruba form for demanding an account. It also corrects the lexical category in footnote b: olùríjú denotes a steward, whereas ìríjú denotes stewardship or stewarding work.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the summons, the rhetorical question, the demand for an accounting, and the stated inability to continue in the stewarding role. The expression “Fi … lé mi lọ́wọ́” is understandable, but “Fún mi ní …” is more idiomatic for requiring an account.
  naturalness: The main wording is clear Standard Yoruba. Revising the final clause to “ṣe iṣẹ́ ìríjú” makes the verbal expression more natural and maintains the role sense already established in the preceding phrase. The alternative reading in footnote b should refer to a person serving as steward (olùríjú), rather than treating ìríjú itself as a person.
  terminology: Ìríjú suitably conveys stewardship/estate management in this context. “Ìṣirò iṣẹ́ ìríjú rẹ” preserves the administrative-accounting sense of λόγος while retaining the role-specific sense of οἰκονομία.
  issues:
  - severity: low
    issue: The imperative construction is slightly less idiomatic than it can be.
    rationale: “Fi ìṣirò … lé mi lọ́wọ́” is intelligible, but “Fún mi ní ìṣirò …” is a more natural Yoruba demand for an accounting.
  - severity: medium
    issue: Footnote b uses ìríjú as though it were the person holding the office.
    rationale: The phrase “gẹ́gẹ́ bí ìríjú” is unnatural for “as a steward”; “gẹ́gẹ́ bí olùríjú” correctly denotes the person. The main text can naturally say “ṣe iṣẹ́ ìríjú” for perform the stewarding work.
  revised_text: Ó sì pè é wá, ó sì wí fún un pé, “Kí ni èyí tí mo ń gbọ́ nípa rẹ? Fún mi ní ìṣirò iṣẹ́ ìríjú rẹ,[a] nítorí ìwọ kò lè máa ṣe iṣẹ́ ìríjú mọ́.”[b]
  revised_footnotes:
