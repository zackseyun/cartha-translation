id: LUK.16.2
reference: Luke 16:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: yo
  text: Ó sì pè é wá, ó sì wí fún un pé, “Kí ni èyí tí mo ń gbọ́ nípa rẹ? Fún mi ní ìṣirò iṣẹ́ ìríjú rẹ,[a] nítorí ìwọ kò lè máa ṣe iṣẹ́ ìríjú mọ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Fi àkọsílẹ̀ bí o ṣe ṣàkóso ohun-ìní mi hàn mí,” tàbí, “Jọ̀wọ́ ìṣirò iṣẹ́ ìríjú rẹ fún mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ìwọ kò lè máa ṣiṣẹ́ gẹ́gẹ́ bí olùríjú mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: Ó sì pè é wá
  rationale: Aorist participle náà tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘pè é wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó pè tàbí ránṣẹ́ pe ẹni náà síwájú rẹ̀.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Kí ni èyí tí mo ń gbọ́ nípa rẹ?
  rationale: Èyí pa agbára ìbéèrè Gíríìkì mọ́, ó sì fi περὶ σοῦ hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἀπόδος τὸν λόγον
  choice: Fi ìṣirò … lé mi lọ́wọ́
  rationale: Nínú ọ̀rọ̀ ìṣàkóso ohun-ìní, λόγος túmọ̀ sí àkọsílẹ̀ tàbí ìṣirò tí ẹni gbọ́dọ̀ fi hàn; ‘fi … lé mi lọ́wọ́’ mú ìlànà pàṣẹ ἀπόδος jáde lọ́nà àdánidá.
- source_word: τῆς οἰκονομίας σου
  choice: iṣẹ́ ìríjú rẹ
  rationale: οἰκονομία níbí ni ojúṣe ṣíṣàkóso ilé tàbí ohun-ìní ẹlòmíràn; ‘iṣẹ́ ìríjú’ dá ìtumọ̀ ipa pàtó yìí mọ́ ju ọ̀rọ̀ ìṣàkóso gbogbogbò lọ.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: nítorí ìwọ kò lè ṣe ìríjú mọ́
  rationale: ‘kò lè … mọ́’ fi δύνῃ àti ἔτι hàn ní kíkún, ‘ṣe ìríjú’ sì pa ìbátan rẹ̀ mọ́ pẹ̀lú οἰκονομία.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò; ‘ìríjú’ ni a lò láti pa àwòrán iṣẹ́ olùṣàkóso ohun-ìní mọ́.
