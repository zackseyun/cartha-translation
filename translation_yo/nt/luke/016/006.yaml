  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: yo
  text: Ó dáhùn pé, “Ọgọ́rùn-ún bátù òróró ólífì ni.”[a] Ó sì sọ fún un pé, “Gba ìwé gbèsè rẹ,[b] jókòó kíákíá, kí o sì kọ àádọ́ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bátù jẹ́ ìwọ̀n ohun olómi ní ayé àtijọ́. Ní èdè Gíríìkì, ó ní, “ọgọ́rùn-ún bátù òróró ólífì.”
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “ìwé àdéhùn rẹ” tàbí “àwọn ìwé rẹ.” Ní èdè Gíríìkì, “àwọn ohun tí a kọ” ni; nínú àyíká yìí, ó ń tọ́ka sí ìwé tàbí àkọsílẹ̀ gbèsè ajigbèsè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: bato
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ ìwọ̀n omi kan pàtó ní ayé àtijọ́; lílo ‘bato’ pa ẹ̀kúnrẹ́rẹ́ ìwọ̀n náà mọ́ dípò yíyí i sí ‘ìwọ̀n’ lásán.
- source_word: ἐλαίου
  choice: òróró ólífì
  rationale: Nínú àyíká yìí, ἔλαιον ń tọ́ka sí òróró tí a fi èso ólífì ṣe; ìtumọ̀ yìí ṣe kedere ju ‘òróró’ lásán lọ.
- source_word: Δέξαι
  choice: Gba
  rationale: Àṣẹ náà ní kí ajigbèsè gba ìwé náà sí ọwọ́ rẹ; ‘Gba’ jẹ́ ọ̀nà àdánidá láti sọ ìṣe yìí ní Yorùbá.
- source_word: τὰ γράμματα
  choice: ìwé gbèsè rẹ
  rationale: Ní ti gidi ó túmọ̀ sí ‘àwọn ìwé/ohun tí a kọ,’ ṣùgbọ́n nínú ọ̀rọ̀ gbèsè yìí ó tọ́ka sí àkọsílẹ̀ tàbí ìwé ẹ̀rí gbèsè ẹni náà.
- source_word: καθίσας
  choice: jókòó
  rationale: Participle náà bá àṣẹ tó tẹ̀ lé e lọ; àṣẹ alájọṣe ‘jókòó ... kí o sì kọ’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe náà mọ́.
- source_word: ταχέως
  choice: kíákíá
  rationale: Ọ̀rọ̀ náà ń fi yíyára hàn; ‘kíákíá’ jẹ́ ìbádọ́gba tó ṣe tààrà, tó sì bá ìtàn mu.
- source_word: γράψον
  choice: kọ
  rationale: Ó ní kí ẹni náà kọ iye tuntun sínú ìwé gbèsè; ‘kọ’ pa ọ̀rọ̀ orísun mọ́ láìfi àlàyé tí kò sí níbẹ̀ kún un.
- source_word: πεντήκοντα
  choice: àádọ́ta
  rationale: Èyí ni nọ́ńbà àádọ́ta ní tààrà; kò nílò ìtúmọ̀ àfikún.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘bato’ gẹ́gẹ́ bí orúkọ ìwọ̀n àtijọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀; ‘ìwé gbèsè’ mú iṣẹ́ τὰ γράμματα nínú àyíká náà hàn láìpa ìtumọ̀ gbooro rẹ̀ mọ́, nítorí náà a tọ́ka sí àwọn àṣàyàn míì nínú àlàyé ìsàlẹ̀.
