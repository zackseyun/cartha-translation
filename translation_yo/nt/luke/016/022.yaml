  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé ọkùnrin tálákà náà kú, àwọn áńgẹ́lì sì gbé e lọ sí àyà Ábúráhámù[a]. Ọkùnrin ọlọ́rọ̀ náà pẹ̀lú kú, a sì sin ín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ẹ̀gbẹ́ Ábúráhámù.” Gbólóhùn Gíríìkì náà ní tààràtà, “sí àyà Ábúráhámù”; ó jẹ́ àwòrán ìsúnmọ́ra, ọlá, àti ìbákẹ́gbẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó mú ọ̀nà ìtàn Lúùkù tí ó fi iṣẹ̀lẹ̀ tuntun hàn jáde lọ́nà Yorùbá adayébá, láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: ọkùnrin tálákà náà kú
  rationale: Èdè Yorùbá adayébá yí infinitive Gíríìkì náà padà sí gbólóhùn pípé; “tálákà” túmọ̀ πτωχός láìfi èrò “alágbe” tí kò hàn nínú gbólóhùn yìí kún un.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: àwọn áńgẹ́lì sì gbé e lọ
  rationale: 'Ìṣètò active yìí jẹ́ adayébá ní Yorùbá, ó sì pa olùṣe tí Gíríìkì sọ ní kedere mọ́: àwọn áńgẹ́lì ni wọ́n gbé e lọ.'
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: sí oókan àyà Ábúráhámù
  rationale: “Oókan àyà” pa àwòrán κόλπος mọ́ gẹ́gẹ́ bí ibi tímọ́tímọ́ lẹ́gbẹ̀ẹ́ ẹni, dípò lílo ọ̀rọ̀ ìtumọ̀ tí yóò pinnu ohun tí àwòrán náà túmọ̀ sí nípa ayé lẹ́yìn ikú.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Ọkùnrin ọlọ́rọ̀ náà pẹ̀lú kú
  rationale: “Pẹ̀lú” ṣojú καί, ó sì pa ìfiwé ikú àwọn ọkùnrin méjèèjì mọ́.
- source_word: ἐτάφη
  choice: a sì sin ín
  rationale: Passive aláìdárúkọ olùṣe ni “a sì sin ín,” èyí tí ó jẹ́ ọ̀nà Yorùbá adayébá láti sọ pé a sin ẹni náà.
theological_decisions:
- issue: Ìtumọ̀ εἰς τὸν κόλπον Ἀβραάμ
  choice: sí oókan àyà Ábúráhámù
  alternative: sí ẹ̀gbẹ́ Ábúráhámù
  rationale: Ìtumọ̀ yìí pa àwòrán Gíríìkì àti ìdàrúdàpọ̀ ìtumọ̀ rẹ̀ mọ́—ìsúnmọ́ra, ọlá àti ìbákẹ́gbẹ́—láìsọ ọ́ di orúkọ ibi kan pàtó tàbí fi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìrísí ìtàn kúkúrú àti ìfiwé àwọn ikú méjèèjì mọ́.
