id: LUK.16.26
reference: Luke 16:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: yo
  text: Yàtọ̀ sí gbogbo èyí[a], a ti fi ọ̀gbun ńlá kan múlẹ̀ láàárín àwa àti ẹ̀yin, kí àwọn tí ó fẹ́ kọjá láti ìhín lọ sọ́dọ̀ yín má lè ṣe bẹ́ẹ̀, bẹ́ẹ̀ ni kò sí ẹni tí ó lè kọjá láti ibẹ̀ wá sọ́dọ̀ wa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú gbogbo nǹkan wọ̀nyí.” Gbólóhùn Gíríìkì náà lè mú èrò mìíràn wá gẹ́gẹ́ bí ìfikún ní ọ̀nà tí ó bá èdè mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: láfikún sí gbogbo èyí
  rationale: Ó fi hàn ní Yorùbá àdánidá pé ọ̀rọ̀ míì tún ń tẹ̀ lé ohun tí a ti sọ, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé sì pa ìtumọ̀ tí ó túbọ̀ tẹ̀ mọ́ ìṣètò Gíríìkì mọ́.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: láàárín àwa àti ẹ̀yin
  rationale: Ó pa ìyàtọ̀ ẹgbẹ́ méjèèjì àti ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ń tọ́ka sí mọ́.
- source_word: χάσμα μέγα
  choice: ọ̀gbun ńlá kan
  rationale: “Ọ̀gbun” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àlàfo jíjìn tí kò rọrùn láti ré kọjá; “ńlá” pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: ἐστήρικται
  choice: a ti fi ... múlẹ̀
  rationale: Ìṣe àìṣedéédé tí ó ti parí tí ó sì ń bá a lọ ni perfect passive náà ń fi hàn; gbólóhùn yìí sọ pé ìpín náà dúró ṣinṣin láìsọ ẹni tí ó gbé e kalẹ̀.
- source_word: ὅπως
  choice: kí ... má bàa
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète tàbí àbájáde tí ó mú kí wọn kò lè ré kọjá.
- source_word: οἱ θέλοντες
  choice: àwọn tí ó fẹ́
  rationale: Ó tú participle tí a lò bí orúkọ sí Yorùbá tí ó ṣe kedere, láìfi ohun míì kún ìfẹ́ wọn.
- source_word: διαβῆναι
  choice: ré kọjá
  rationale: Ó sọ ìrìn láti ẹ̀gbẹ́ kan dé òmíràn ní kedere, ó sì bá àwòrán ọ̀gbun mu.
- source_word: ἔνθεν
  choice: láti ìhín
  rationale: Ó pa ojú-ìwòye ẹni tí ń sọ̀rọ̀ mọ́.
- source_word: μὴ δύνωνται
  choice: má bàa lè ṣe bẹ́ẹ̀
  rationale: Ó fi àìlágbára hàn, kì í ṣe pé a kàn fòfin dè wọ́n.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: bẹ́ẹ̀ ni àwọn láti ibẹ̀ kò lè ré kọjá wá sọ́dọ̀ wa
  rationale: Ó pa ìbáramu ọ̀nà méjèèjì àti àìṣeéṣe ìrékọjá mọ́; a mú ẹni tí a kò sọ ní gbangba nínú Gíríìkì yé ní Yorùbá gẹ́gẹ́ bí “àwọn láti ibẹ̀.”
theological_decisions:
- issue: Irú ìyapa tí ó wà láàárín agbègbè méjèèjì nínú àkàwé náà
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìyapa tí a ti fi múlẹ̀ tí kò sì ṣeé ré kọjá, láìsọ pé àwòrán ilẹ̀ ayé lẹ́yìn ikú ni ní ti gidi tàbí pé àpẹẹrẹ lásán ni.
  alternative: Láti sọ ọ̀gbun náà di apá kan pàtó nínú ẹ̀kọ́ ìgbé ayé lẹ́yìn ikú, tàbí láti mú agbára ìyapa tí ó dúró ṣinṣin kúrò nínú rẹ̀.
  rationale: Ẹsẹ náà tẹnu mọ́ pé ìyapa náà dúró ṣinṣin àti pé kò ṣeé ré kọjá; ìtumọ̀ náà pa agbára yìí mọ́ láìfi ẹ̀kọ́ ìsìn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. “Ẹ̀yin/yín” fi ọ̀pọ̀ ènìyàn tí Gíríìkì ń tọ́ka sí hàn; “ọ̀gbun ńlá” àti “fi múlẹ̀” pa ìwúwo àti ìdúróṣinṣin ọ̀rọ̀ náà mọ́.
