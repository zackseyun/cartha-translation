source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: yo
  text: Ṣùgbọ́n ó rọrùn fún ọ̀run àti ayé láti kọjá lọ ju kí ìlà kékeré kan nínú Òfin ṣubú lọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì kékeré kan nínú lẹ́tà”—ìyẹn ni, ìlà kékeré kan tí ó ń fi lẹ́tà kan yàtọ̀ sí òmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: ó rọrùn ... ju
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìfiwéra ‘ó rọrùn jù’ hàn, ó sì pa agbára ìfiwéra Gíríìkì mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ sí ohun tí ó ṣáájú hàn, bí δέ ṣe ń ṣe ní àyíká ọ̀rọ̀ yìí.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: ọ̀run àti ayé
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì tí ń tọ́ka sí gbogbo ohun tí a dá mọ́.
- source_word: παρελθεῖν
  choice: láti kọjá lọ
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí píparẹ́ tàbí lílọ kúrò; ‘kọjá lọ’ pa àwòrán ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: νόμου
  choice: Òfin
  rationale: Ní àyíká ọ̀rọ̀ Lúùkù, ó tọ́ka sí Òfin inú Ìwé Mímọ́, kì í ṣe òfin lápapọ̀; lẹ́tà ńlá ń fi ìtọ́kasí yìí hàn.
- source_word: μίαν κεραίαν
  choice: àmì kékeré kan
  rationale: κεραία jẹ́ ìlà tàbí àmì kékeré lórí lẹ́tà; yíyan yìí ṣe kedere fún òǹkàwé Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé rẹ̀ sí i.
- source_word: πεσεῖν
  choice: ṣubú
  rationale: Ó pa àwòrán gangan ti Gíríìkì mọ́, tí ó ń sọ pé apá kékeré kan nínú Òfin kò ní ṣubú tàbí di asán.
theological_decisions:
- issue: Ohun tí νόμος ń tọ́ka sí
  choice: Òfin gẹ́gẹ́ bí Òfin inú Ìwé Mímọ́
  alternative: òfin lápapọ̀
  rationale: Àyíká ọ̀rọ̀ Júù nínú Lúùkù àti ìtọ́kasí sí kúlẹ̀kúlẹ̀ ohun tí a kọ sínú rẹ̀ ṣe àtìlẹ́yìn fún Òfin Ìwé Mímọ́, láì sọ ju ohun tí ẹsẹ náà sọ lọ.
- issue: Bí a ṣe túmọ̀ κεραία
  choice: àmì kékeré kan
  alternative: ìlà kékeré kan lórí lẹ́tà
  rationale: Èyí mú kókó náà—pé àní kúlẹ̀kúlẹ̀ tí ó kéré jù lọ nínú Òfin dúró ṣinṣin—yé òǹkàwé, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ìkọ̀wé pàtó mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá bá èdè mu; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba.
