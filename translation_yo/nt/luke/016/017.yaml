  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìfiwéra Gíríìkì náà, ‘ọ̀run àti ayé’ gẹ́gẹ́ bí àpapọ̀ ẹ̀dá, àti àwòrán ‘ṣubú’ mọ́. Síbẹ̀, ‘àmì kékeré’ kì í sọ ìtumọ̀ κεραία—ìlà kékeré/projection nínú ìrísí lẹ́tà—di mímọ́ tó; àlàyé náà sì sọ pé ó wà ‘lórí lẹ́tà,’ ohun tí kò wà nínú ọ̀rọ̀ Gíríìkì.
