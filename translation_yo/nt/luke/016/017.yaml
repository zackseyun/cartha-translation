  terminology: ‘Òfin’ pẹ̀lú lẹ́tà ńlá jẹ́ ìtọ́kasí tó yẹ sí νόμος nínú àyíká yìí. ‘Ìlà kékeré kan’ ṣàfihàn κεραία láì lo ọ̀rọ̀ ìjọsìn àtijọ́ tàbí ṣàfikún ìtumọ̀ ẹ̀kọ́-ìsìn.
