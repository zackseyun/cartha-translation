id: LUK.16.5
reference: Luke 16:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: yo
  text: Ó sì pe olúkúlùkù nínú àwọn ajigbèsè ọ̀gá rẹ̀ wá sọ́dọ̀ rẹ̀, ó sì ń bi ẹni àkọ́kọ́ pé, “Èló ni o jẹ ọ̀gá mi ní gbèsè?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì κύριος sábà máa ń jẹ́ “Olúwa,” ṣùgbọ́n níbí ó ń tọ́ka sí ọ̀gá ènìyàn tí olùṣàkóso náà ń ṣiṣẹ́ fún; nítorí náà, “ọ̀gá” bá àyíká ọ̀rọ̀ mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe ... wá sọ́dọ̀ rẹ̀
  rationale: Èyí mú ìtumọ̀ aorist middle participle náà jáde gẹ́gẹ́ bí pípe àwọn ènìyàn wá sí ọ̀dọ̀ ara rẹ̀, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἕνα ἕκαστον
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ yìí fi agbára ìpínkiri hàn pé ó pe ẹnì kọ̀ọ̀kan; “olúkúlùkù” sọ èyí ní ṣókí láìfi kún un.
- source_word: χρεοφειλετῶν
  choice: àwọn ajigbèsè
  rationale: Ó tọ́ka sí àwọn tí wọ́n jẹ ẹlòmíràn ní gbèsè nínú ọ̀ràn ìṣòwò tàbí ìṣàkóso ohun-ìní.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: ọ̀gá rẹ̀
  rationale: κύριος níbí ni ọ̀gá ènìyàn tí ìránṣẹ́ náà ń ṣiṣẹ́ fún, ἑαυτοῦ sì tọ́ka padà sí ìránṣẹ́ náà.
- source_word: ἔλεγεν
  choice: ó sì ń bi
  rationale: Àmì “ń” pa ìhà imperfect mọ́, ó sì bá ìṣe tí ń lọ tàbí tí a ń ṣe sí ẹnì kọ̀ọ̀kan mu.
- source_word: τῷ πρώτῳ
  choice: ẹni àkọ́kọ́
  rationale: Èyí tú dative ordinal náà ní Yorùbá tó ṣe kedere àti tó wọ́pọ̀.
- source_word: Πόσον ὀφείλεις
  choice: Èló ni o jẹ ... ní gbèsè?
  rationale: Ìbéèrè Yorùbá àdánidá ni èyí fún iye gbèsè tí ẹnì kan jẹ.
- source_word: τῷ κυρίῳ μου
  choice: ọ̀gá mi
  rationale: Ó pa ọ̀rọ̀ ẹni-kìíní μου mọ́, ó sì yẹ fún ọ̀gá ènìyàn nínú àkóónú òwe náà.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká ìṣàkóso ilé àti ọrọ̀ ajé
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Ẹni tí a ń tọ́ka sí ní ẹsẹ yìí ni ọ̀gá ènìyàn tí olùṣàkóso ohun-ìní ń ṣiṣẹ́ fún, kì í ṣe orúkọ oyè fún Ọlọ́run tàbí Kristi. “Ọ̀gá” yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú àyíká náà wọ̀ ọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé yé fún gbogbo ènìyàn ni a lò. “Ajigbèsè” jẹ́ ọ̀rọ̀ ṣókí fún ẹni tí ó jẹ ẹlòmíràn ní gbèsè; àtúnṣe “jẹ ... ní gbèsè” nínú ìbéèrè jẹ́ àdánidá. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
