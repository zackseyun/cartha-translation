  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: yo
  text: Ní Hédíìsì[a], ó gbé ojú rẹ̀ sókè, bí ó ti wà nínú ìjìyà, ó sì rí Ábúráhámù ní jíjìnnà réré, àti Lásárù ní àyà Ábúráhámù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibùgbé àwọn òkú.” Hédíìsì ni ọ̀rọ̀ Gíríìkì fún ibùgbé àwọn òkú; kì í ṣe ọ̀rọ̀ kan náà pẹ̀lú Géhẹ́nà, ibi ìdájọ́ ìkẹyìn.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “ní àwọn àyà rẹ̀”; èyí jẹ́ ìsọ̀rọ̀ àwòrán fún ìsúnmọ́ tímọ́tímọ́. Ní àṣà ìtumọ̀ Bíbélì, “ní àyà Ábúráhámù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: Hédíìsì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní èdè Yorùbá láti pa ìyàtọ̀ rẹ̀ mọ́ sí Gẹ́hẹ́nà, kí a má sì fi ìtumọ̀ ibi ìdájọ́ ìkẹyìn kún ẹsẹ náà.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ó gbé ojú rẹ̀ sókè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa àwòrán ìṣe inú Gíríìkì mọ́.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: bí ó ti ń jìyà
  rationale: Gbólóhùn yìí fi ipò tí ó wà nínú rẹ̀ hàn gẹ́gẹ́ bí àyíká ìṣe náà, ó sì sọ ìrora líle náà ní Yorùbá àdánidá.
- source_word: ὁρᾷ
  choice: ó sì rí
  rationale: Yorùbá kò fi àmì àkókò ọ̀rọ̀-ìṣe hàn bí Gíríìkì; ọ̀rọ̀ yìí jẹ́ kó ṣeé ka ìṣẹ̀lẹ̀ náà lọ́nà ààyè láìfi àkókò mìíràn lé e lórí.
- source_word: ἀπὸ μακρόθεν
  choice: ní ọ̀nà jíjìn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì tẹnu mọ́ bí wọ́n ṣe jìnnà sí ara wọn.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: ní oókan àyà rẹ̀
  rationale: Èyí pa àwòrán κόλπος mọ́, ó sì sọ ìsúnmọ́ àti ìbáṣepọ̀ tímọ́tímọ́ ní ọ̀nà tí àwọn òǹkàwé Yorùbá lè lóye.
theological_decisions:
- issue: Ìtumọ̀ ᾅδης nínú ẹsẹ tí a sábà ń lò nínú ìjíròrò nípa ipò àwọn òkú àti ìjìyà ìkẹyìn
  choice: Hédíìsì
  alternative: ilẹ̀ àwọn òkú; ọ̀run àpáàdì
  rationale: Àkọsílẹ̀ orúkọ náà pa ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹra fún dídá Hédíìsì àti Gẹ́hẹ́nà pọ̀ tàbí yanjú ìjíròrò ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò yanjú.
- issue: Àwòrán κόλπος tí a mọ̀ sí ‘oókan àyà Ábúráhámù’
  choice: ní oókan àyà rẹ̀
  alternative: lẹ́gbẹ̀ẹ́ rẹ̀; ní apá rẹ̀
  rationale: Yíyan yìí pa àwòrán orísun mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó níyì, tó ń fi ìsúnmọ́ àti ààbò hàn láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ tó kọjá ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi àmì ẹsẹ̀ [b] sí ibi tó jẹ mọ́ κόλποις, dípò lẹ́yìn ọ̀rọ̀ ìjìyà.
