id: LUK.16.24
reference: Luke 16:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: yo
  text: Ó sì ké jáde, ó ní, “Baba Ábúráhámù, ṣàánú mi, kí o sì rán Lásárù kí ó bọ́ ṣóńṣó ìka rẹ̀ sínú omi, kí ó sì mú ahọ́n mi tutù, nítorí mo wà nínú ìrora líle nínú ọ̀wọ́ iná yìí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí a ń dá mi lóró nínú ọ̀wọ́ iná yìí.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè tọ́ka sí ìjìyà líle tàbí dídáni lóró.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: ké jáde
  rationale: Ó fi ohùn gíga àti ẹ̀bẹ̀ kánjú hàn ní Yorùbá àdánidá.
- source_word: ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ẹ̀bẹ̀ àánú.
- source_word: πέμψον
  choice: rán
  rationale: Ó túmọ̀ àṣẹ náà ní tààrà láìfi ìtumọ̀ míì kún un.
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: tẹ ṣóńṣó ìka rẹ̀ bọ inú omi
  rationale: Ó pa àwòrán fífi ṣóńṣó ìka bọ omi fún ìgbà díẹ̀ mọ́, gẹ́gẹ́ bí βάπτω ṣe túmọ̀ sí níhìn-ín.
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: mú ahọ́n mi tutù
  rationale: Ó jẹ́ àfihàn ara tí ó ṣe kedere, ó sì pa ìṣe mímú-nǹkan-tutù mọ́ ju fífi ‘tù mí lára’ rọ́pò rẹ̀ lọ.
- source_word: ὀδυνῶμαι
  choice: mo ń jìyà gidigidi
  rationale: Ó fi ìrora líle hàn láìfi èrò ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ orísun kò sọ ní pàtó kún un.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: nínú ọwọ́ iná yìí
  rationale: ‘Ọwọ́ iná’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí flame, ó sì pa àwòrán iná tó ń jó mọ́.
- source_word: Πάτερ Ἀβραάμ
  choice: Baba Ábúráhámù
  rationale: Ó pa ìpè baba àti ẹ̀bẹ̀ sí baba ńlá ìran náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìjìyà ọkùnrin ọlọ́rọ̀ náà
  choice: mo ń jìyà gidigidi nínú ọwọ́ iná yìí
  alternative: a ń dá mi lóró nínú ọwọ́ iná yìí
  rationale: ‘Ń jìyà gidigidi’ fi agbára ὀδυνῶμαι hàn, ṣùgbọ́n kò sọ ẹni kan di olùdálóró tàbí fi èrò ẹ̀kọ́ ìgbàgbọ́ sí ohun tí Gíríìkì fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ké jáde’ fún ìpè kánjú, àti ‘ṣóńṣó ìka’ fún ìtumọ̀ àdánidá ti ‘tip of his finger.’
