  to: Bí ẹ̀yin kò sì bá jẹ́ olóòótọ́ nínú ohun tí ó jẹ́ ti ẹlòmíràn,[a][c] ta ni yóò fi ohun tí ó jẹ́ tiyín fún yín?[b]
