id: LUK.16.12
reference: Luke 16:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: yo
  text: Bí ẹ̀yin kò sì bá jẹ́ olóòótọ́ nínú ohun tí ó jẹ́ ti ẹlòmíràn,[a][c] ta ni yóò fi ohun tí ó jẹ́ tiyín fún yín?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun ìní ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí ó jẹ́ ti ẹ̀yin fúnra yín.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí ìyàtọ̀ yìí tọ́ka sí jíjẹ́ olóòótọ́ pẹ̀lú ọrọ̀ ayé nísinsìnyí ní ìfiwéra pẹ̀lú gbígba ọrọ̀ tòótọ́ tàbí ọrọ̀ tí ó dúró pẹ́ lẹ́yìn náà; ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ ohun tí àwọn méjèèjì dúró fún ní pàtó.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: ohun tí ó jẹ́ ti ẹlòmíràn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró bí orúkọ níhìn-ín, ó sì túmọ̀ sí ohun ìní ẹlòmíràn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ohun-ìní mọ́.
- source_word: πιστοὶ
  choice: olóòótọ́
  rationale: Nínú àyíká iṣẹ́ ìríjú yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí a lè gbẹ́kẹ̀ lé, kì í ṣe sí ìgbàgbọ́ nìkan.
- source_word: οὐκ ἐγένεσθε
  choice: kò bá ... jẹ́
  rationale: Ìkọ̀lé àídájú Yorùbá yìí fi hàn pé wọn kò fi ara wọn hàn gẹ́gẹ́ bí olóòótọ́, ó sì bá gbolohun àídájú Gíríìkì mu lọ́nà àdánidá.
- source_word: τὸ ὑμέτερον
  choice: ohun tí ó jẹ́ tiyín
  rationale: Ó pa ìfiwéra tó wà láàárín ohun ti ẹlòmíràn àti ohun tiwọn mọ́, láì sọ ohun tí àwọn méjèèjì dúró fún ní pàtó.
- source_word: δώσει ὑμῖν
  choice: yóò fi ... fún yín
  rationale: Èyí túmọ̀ δίδωμι ní tààrà gẹ́gẹ́ bí ‘fún,’ dípò kí a fi ìtumọ̀ ‘fi sí ìkáwọ́’ kún un láti inú àyíká.
- source_word: καὶ εἰ
  choice: Bí ... bá sì
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti so ẹsẹ̀ náà mọ́ èyí tó ṣáájú, kí ó sì mú àídájú náà wọlé.
- source_word: τίς
  choice: ta ni
  rationale: Ìbéèrè àfojúdi Gíríìkì náà yí padà sí Yorùbá tààrà àti àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìyàtọ̀ láàárín ‘ohun tí ó jẹ́ ti ẹlòmíràn’ àti ‘ohun tí ó jẹ́ tiyín’
  choice: A fi ìyàtọ̀ náà sílẹ̀ láì sọ ohun tí àwọn ọ̀rọ̀ méjèèjì dúró fún ní pàtó nínú ẹsẹ̀ pàtàkì.
  alternative: A lè túmọ̀ wọn ní pàtó sí ọrọ̀ ayé àti ọrọ̀ tòótọ́, tàbí sí iṣẹ́ ìríjú ayé àti ogún ọjọ́ iwájú.
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ kò sọ àwọn ohun tí a ń fi wéra ní pàtó. Fífi wọn sílẹ̀ lọ́nà tí kò há ìtumọ̀ mọ́ ọn ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ rẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘olóòótọ́’ fún ìgbẹ́kẹ̀lé nínú iṣẹ́ ìríjú, a sì yàgò fún ṣíṣe ìtumọ̀ àwọn ohun tí a ń fi wéra ní pàtó.
