  terminology: “Olóòótọ́” yẹ fún πιστοί ní àyíká ìríjú, kì í sì í fi ìtumọ̀ ‘onígbàgbọ́’ wọ̀ ọ́. “Ohun tí ó jẹ́ ti ẹlòmíràn” àti “ohun tí ó jẹ́ tiyín” pa ìyàtọ̀ ìní inú ọ̀rọ̀ Gíríìkì mọ́ láì pinnu ìtọ́kasí ẹ̀kọ́ ìsìn.
