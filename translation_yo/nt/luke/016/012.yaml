  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ἀλλοτρίῳ ni a gbé kalẹ̀ gẹ́gẹ́ bí ohun ti ẹlòmíràn, πιστοί gẹ́gẹ́ bí olóòótọ́ nínú ìríjú, àti τὸ ὑμέτερον gẹ́gẹ́ bí ohun tiyín. Ìbéèrè àfojúdi àti ìfiwéra tí kò sọ ohun tí ó ń tọ́ka sí ní pàtó ni a pa mọ́.'
