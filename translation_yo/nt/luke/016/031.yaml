  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Bí wọn kò bá fetí sí[a] Mósè àti àwọn Wòlíì, kódà bí ẹni kan bá jí dìde láti inú àwọn òkú[b], kò ní dá wọn lójú[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “gbọ́” tàbí “kíyè sí.” Ọ̀rọ̀ Gíríìkì náà lè ní gbígbọ́ àti fífi ọkàn sí ohun tí a gbọ́ nínú.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ọ̀nà mìíràn: “láàárín àwọn òkú.”'
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, “kò ní mú wọn ní ìdánilójú.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí yíyí ènìyàn lọ́kàn tàbí mímú un ní ìdánilójú; kò fi dandan túmọ̀ sí “gbàgbọ́” ní ìtumọ̀ ẹ̀kọ́ ìsìn tóóró.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ṣùgbọ́n ó sọ fún un pé
  rationale: “Ṣùgbọ́n” fi ìyípadà oní ìtakora díẹ̀ tí δέ ní hàn; “ó sọ fún un pé” sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ọ̀rọ̀ taara.
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Ìṣọ̀kan “bí ... bá” ni ọ̀nà Yorùbá àdánidá láti fi ipò àídájú hàn.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Mósè àti àwọn Wòlíì
  rationale: A pa àkànṣe ọ̀rọ̀ Júù náà mọ́ gẹ́gẹ́ bí ìtọ́kasí sí ẹ̀rí Ìwé Mímọ́, láì túmọ̀ ọ́ sí “Ìwé Mímọ́” nínú ara ẹsẹ̀.
- source_word: οὐκ ἀκούουσιν
  choice: wọn kò bá fetí sí
  rationale: “Fetí sí” lè ní ìtumọ̀ gbígbọ́ àti fífi ọkàn sí ohun tí a gbọ́, láì mú un dé ìgbọràn pípé.
- source_word: οὐδ’ ἐάν
  choice: bí ... tilẹ̀ ... kò ní
  rationale: '“Tilẹ̀” papọ̀ mọ́ ìkọ̀ “kò ní” ń fi agbára ọ̀rọ̀ náà hàn: kódà ní irú ipò yìí, àbájáde náà kò ní yí padà.'
- source_word: τις
  choice: ẹnì kan
  rationale: Ó pa ìtọ́kasí aláìlórúkọ ẹyọ kan mọ́ ní Yorùbá àdánidá.
- source_word: ἐκ νεκρῶν
  choice: láàárín àwọn òkú
  rationale: Èyí fi ìtumọ̀ “láti inú àwọn ẹni tí ó ti kú” hàn kedere, ó sì yẹ fún èdè àjíǹde.
- source_word: ἀναστῇ
  choice: jí dìde
  rationale: “Jí dìde” jẹ́ gbólóhùn Yorùbá tí ó mọ́gbọ́n dání fún dídìde kúrò nínú ikú, “bá ... tilẹ̀” sì gbé ipò subjunctive náà.
- source_word: πεισθήσονται
  choice: kò ní dá wọn lójú
  rationale: Èyí túmọ̀ sí pé wọn kò ní gba ìdánilójú; kò dín ìtumọ̀ náà kù sí ìgbàgbọ́ ìgbàlà tàbí ìrònúpìwàdà.
theological_decisions:
- issue: Ìtumọ̀ “Mósè àti àwọn Wòlíì”
  choice: Àkànṣe ọ̀rọ̀ fún ẹ̀rí Ìwé Mímọ́ tí a ti fi fún Ísírẹ́lì
  alternative: Ìtọ́kasí tóóró sí Mósè àti àwọn wòlíì gẹ́gẹ́ bí ènìyàn nìkan
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà dúró fún ẹ̀rí Ìwé Mímọ́. A pa àkànṣe ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ láì fi “Ìwé Mímọ́” rọ́pò rẹ̀.
- issue: Agbára πεισθήσονται
  choice: Gbígba ìdánilójú ní ìtumọ̀ gbogbogbò
  alternative: “Wọn kì yóò gbàgbọ́” tàbí “wọn kì yóò ronúpìwàdà”
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ nípa yíyí ọkàn padà nípasẹ̀ ìdánilójú; kò sọ ìgbàgbọ́ ìgbàlà tàbí ìrònúpìwàdà ní pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ọ̀wọ̀, ti òde òní, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún ọ̀rọ̀ ìjọ kan pàtó tàbí ìtumọ̀ ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì kò sọ.
