id: LUK.16.18
reference: Luke 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá kọ aya rẹ̀ sílẹ̀, tí ó sì fẹ́ obìnrin mìíràn ní aya[a], ṣe panṣágà; ẹni tí ó sì fẹ́ obìnrin tí a ti kọ̀ sílẹ̀ kúrò lọ́dọ̀ ọkọ[b] ṣe panṣágà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó sì fẹ́ òmíràn ní aya.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “obìnrin tí a ti kọ̀ sílẹ̀ kúrò lọ́dọ̀ ọkọ”; ìyẹn ni, obìnrin tí a ti kọ̀ sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ gbólóhùn gbogbogbò tí ó kan gbogbo ẹni tó bá ṣe ohun tí a mẹ́nu kàn.
- source_word: ἀπολύων
  choice: kọ ... sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó, gbólóhùn Yorùbá yìí túmọ̀ sí fífi ìyàwó sílẹ̀ tàbí yíyà sílẹ̀, kì í ṣe kìkì rírán ẹni lọ.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: Nítorí àyíká ọ̀rọ̀ náà jẹ́ ti ìgbéyàwó, γυνή túmọ̀ sí aya níbí.
- source_word: γαμῶν ἑτέραν
  choice: fẹ́ òmíràn ní aya
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ‘fẹ́ ẹlòmíràn,’ ó sì pa ìtumọ̀ ἑτέραν mọ́ láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: μοιχεύει
  choice: ṣe panṣágà
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ṣíṣe àgbèrè nínú ìgbéyàwó.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρὸς
  choice: obìnrin tí ọkọ rẹ̀ ti kọ̀ sílẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì fi ipò obìnrin náà gẹ́gẹ́ bí ẹni tí a ti kọ̀ sílẹ̀ hàn; àlàyé ìsúnmọ́-ọrọ̀ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìwọ̀n àti agbára ọ̀rọ̀ Jésù nípa ìkọ̀sílẹ̀
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìkéde ìwà rere tó kan gbogbo ẹni, láìfi àyọkúrò kankan kún un.
  alternative: A lè fi àyọkúrò tó wà nínú Mátíù kún un tàbí fi ọ̀rọ̀ náà mọ́ ipò òfin Júù kan pàtó.
  rationale: Lúùkù sọ ọ́ ní ọ̀nà kúkúrú, gbogbogbò, kò sì fi àyọkúrò kankan sínú ẹsẹ yìí. Ìtumọ̀ kò gbọ́dọ̀ mú ìbámu láti ibòmíràn wọlé tàbí yanjú ìnira ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà dá sílẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Gbólóhùn “fẹ́ ... ní aya” mú ìtumọ̀ ìgbéyàwó ṣe kedere; a kò fi àyọkúrò ẹ̀kọ́ ìjọ kankan kún ọ̀rọ̀ náà.
