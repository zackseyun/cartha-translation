id: LUK.16.13
reference: Luke 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: yo
  text: Kò sí ìránṣẹ́ ilé kankan tí ó lè sin ọ̀gá méjì; nítorí yálà yóò kórìíra ọ̀kan, yóò sì fẹ́ràn èkejì, tàbí yóò faramọ́ ọ̀kan, yóò sì kẹ́gàn èkejì. Ẹ kò lè sin Ọlọ́run àti Mámónì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìní” tàbí “owó.” Gíríìkì lo ọ̀rọ̀ náà Mámónì fún ọrọ̀ tàbí ìní, tí a gbé kalẹ̀ níbí bí ọ̀gá alátakò.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: ìránṣẹ́ ilé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó ń ṣiṣẹ́ ìránṣẹ́ nínú agbo ilé, kì í ṣe ìránṣẹ́ lásán. “Ìránṣẹ́ ilé” pa àyíká ilé àti ipò ìsìn mọ́ láìfi ìtumọ̀ tí ó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: κυρίοις
  choice: ọ̀gá
  rationale: Nínú òwe yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn ọ̀gá tí ìránṣẹ́ wà lábẹ́ wọn. “Ọ̀gá” jẹ́ èdè Yorùbá àdánidá, ó sì yà á sọ́tọ̀ kúrò nínú orúkọ oyè Ọlọ́run.
- source_word: δουλεύειν
  choice: sin
  rationale: “Sin” fi iṣẹ́ àti ìgbọràn ẹni tí ó wà lábẹ́ ọ̀gá hàn, ó sì bá ìfarawé tó wà láàárín sísin ọ̀gá ènìyàn àti sísin Ọlọ́run tàbí Mámónì mu.
- source_word: μισήσει
  choice: kórìíra
  rationale: Èyí pa agbára ìtakora ọ̀rọ̀ Gíríìkì mọ́; a kò rọ ọ́ di “fẹ́ràn díẹ̀” nítorí pé ìtumọ̀ pàtàkì rẹ̀ ni ìkórìíra.
- source_word: ἀγαπήσει
  choice: fẹ́ràn
  rationale: Èyí ni ìtumọ̀ àdánidá tí ó sì dúró ní ìtakora tààrà sí “kórìíra.”
- source_word: ἀνθέξεται
  choice: rọ̀ mọ́
  rationale: “Rọ̀ mọ́” ń sọ ìdìmú ṣinṣin àti ìfaramọ́ ẹni kan, ó sì pa àwòrán ìdìmú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καταφρονήσει
  choice: kẹ́gàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí lílo ojú ẹni kan sílẹ̀ pẹ̀lú ẹ̀gàn; “kẹ́gàn” jẹ́ ṣókí, ó sì lágbára tó.
- source_word: θεῷ
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere fún θεός níbí.
- source_word: μαμωνᾷ
  choice: Mámónì
  rationale: A pa ọ̀rọ̀ àyálò náà mọ́ gẹ́gẹ́ bí orúkọ ẹni nítorí ẹsẹ̀ náà gbé ọrọ̀ kalẹ̀ bí ọ̀gá alátakò Ọlọ́run. Àlàyé ìsàlẹ̀ ojú ìwé sọ ìtumọ̀ rẹ̀ fún òǹkàwé òde òní.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ μαμωνᾷ ní ìtakora sí θεῷ
  choice: Mámónì
  alternative: owó tàbí ọrọ̀
  rationale: “Mámónì” pa ìsọ̀rọ̀-ẹni àti àwòrán ọ̀gá alátakò mọ́; kò túmọ̀ sí pé Mámónì jẹ́ ọlọ́run gidi kan. Àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ ọrọ̀ rẹ̀ ṣe kedere.
- issue: Ẹni tí àwọn ọ̀rọ̀-ìṣe ẹyọ kan ń tọ́ka sí
  choice: A fi olùṣe tí a ti mẹ́nu kàn sílẹ̀ nínú “yóò …” gẹ́gẹ́ bí ìlò Yorùbá àdánidá
  alternative: Lílo “òun” léraléra tàbí yí gbolóhùn náà padà sí ọ̀pọ̀ ènìyàn
  rationale: Gíríìkì lo ẹyọ kan gẹ́gẹ́ bí àpẹẹrẹ gbogbo ènìyàn. Yorùbá lè tọ́ka sí ìránṣẹ́ náà nípasẹ̀ “yóò” láìfi akọ tàbí abo tí kò sí nínú ọ̀rọ̀ náà kún un, láìyí ẹyọ padà sí ọ̀pọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní ibi tí ó bá yẹ. “Ìránṣẹ́ ilé,” “ọ̀gá,” àti “rọ̀ mọ́” jẹ́ àdánidá ní Yorùbá, wọ́n sì pa àyíká agbo ilé, agbára ọ̀gá, àti ìfaramọ́ tó wà nínú orísun mọ́.
