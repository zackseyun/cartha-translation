  to: Ọkùnrin ọlọ́rọ̀ kan sì wà[a]; ó máa ń wọ aṣọ àlùkò àti aṣọ ọ̀gbọ̀ dáradára, ó sì máa ń ṣe àsè ọlọ́lá lójoojúmọ́.
