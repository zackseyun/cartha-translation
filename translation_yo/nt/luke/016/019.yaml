source:
  edition: SBLGNT
  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: yo
  text: Ọkùnrin ọlọ́rọ̀ kan sì wà[a]; ó máa ń wọ aṣọ àlùkò àti aṣọ ọ̀gbọ̀ dáradára, ó sì máa ń ṣe àsè ọlọ́lá lójoojúmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó máa ń yọ̀ lọ́nà ọlọ́lá lójoojúmọ́.” Ọ̀rọ̀ Gíríìkì εὐφραινόμενος lè túmọ̀ sí yíyọ̀ tàbí ṣíṣe àjọyọ̀, ó sì lè ní jíjẹ àsè nínú; λαμπρῶς sì tẹnu mọ́ ìlòkìkí ọlọ́lá àti ìgbádùn olówó iyebíye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: Ọkùnrin kan sì wà
  rationale: ‘Ọkùnrin kan’ fi ẹni tí a kò tíì dárúkọ hàn, ‘sì’ sì ń gbé ìtàn lọ síwájú láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: πλούσιος
  choice: ọlọ́rọ̀
  rationale: Ó túmọ̀ sí ẹni tí ó ní ọrọ̀ púpọ̀; ‘ọlọ́rọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì bá àyíká ìtàn mu.
- source_word: ἐνεδιδύσκετο
  choice: ó máa ń wọ
  rationale: Àkókò imperfect fi ìṣe àṣà tàbí ohun tí ó máa ń ṣe hàn; ‘máa ń wọ’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: πορφύραν
  choice: aṣọ aláwọ̀ elése àlùkò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí aṣọ tí a fi àwọ̀ elése àlùkò ṣe, àmì ọlá àti ọrọ̀ ní àṣà ìgbà náà.
- source_word: βύσσον
  choice: aṣọ ọ̀gbọ̀ dáradára
  rationale: βύσσος jẹ́ aṣọ ọ̀gbọ̀ tó ní ìwọ̀n gíga; ‘dáradára’ fi didara àti iye rẹ̀ hàn láìsọ ju orísun lọ.
- source_word: εὐφραινόμενος
  choice: ó ń jẹ ayẹyẹ
  rationale: Ó lè túmọ̀ sí yíyọ̀, ṣíṣe àjọyọ̀, tàbí jíjẹ àsè; nínú àyíká ìgbé-ayé adùn, ‘jẹ ayẹyẹ’ jẹ́ àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ míì mọ́.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ohun tí ó ń ṣẹlẹ̀ ní gbogbo ọjọ́.
- source_word: λαμπρῶς
  choice: lọ́nà ológo
  rationale: Ó fi ọlá ńlá, ẹwà, àti ìgbádùn olówó iyebíye hàn; ‘lọ́nà ológo’ pa ìmọ́lẹ̀ ọlá inú ọ̀rọ̀ náà mọ́.
