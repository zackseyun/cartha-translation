  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ó fi ọkùnrin kan tí ó lọ́rọ̀, ìṣe àṣà rẹ̀ nínú wíwọ aṣọ iyebíye, àti ayẹyẹ ojoojúmọ́ hàn. Síbẹ̀, ‘aṣọ aláwọ̀ elése àlùkò’ kò ṣe pàtó tàbí ṣe àdánidá gẹ́gẹ́ bí ìtumọ̀ πορφύραν; ‘aṣọ àlùkò’ jẹ́ kedere. ‘Ó ń jẹ ayẹyẹ’ sì kéré sí ìlò Yorùbá àtẹnudẹ́nu fún εὐφραινόμενος nínú àyíká yìí ju ‘ó máa ń ṣe àsè’ lọ.'
  naturalness: ‘Ó máa ń ṣe àsè ọlọ́lá lójoojúmọ́’ jẹ́ gbolohun Yorùbá tó rọrùn, tó sì mú ìṣe tí ó máa ń ṣẹlẹ̀ ní ìgbà gbogbo jáde. ‘Ológo’ lè dún bí ohun tí ó ní í ṣe pẹ̀lú ògo ju bí ó ṣe ń ṣàlàyé ìgbádùn/ìlòkìkí nínú ọ̀rọ̀ λαμπρῶς lọ; ‘ọlọ́lá’ bá àyíká aṣọ àti àsè mu dáadáa.
  terminology: ‘Ọlọ́rọ̀,’ ‘aṣọ àlùkò,’ àti ‘aṣọ ọ̀gbọ̀ dáradára’ jẹ́ ìlò tó bá ìforígbárí ohun-ìní àti aṣọ iyebíye inú orísun mu. A pa ààyè ìtumọ̀ εὐφραινόμενος mọ́ nínú àlàyé ìsàlẹ̀.
