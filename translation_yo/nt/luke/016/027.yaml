revisions:
- from: Ó sì wí pé, “Ǹjẹ́ mo bẹ̀ ọ́, bàbá, kí o rán an lọ sí ilé bàbá mi.”[a]
  to: Ó sì wí pé, “Nítorí náà, mo béèrè lọ́wọ́ rẹ, bàbá, kí o rán an lọ sí ilé bàbá mi,”[a]
  rationale: The revision renders οὖν with an idiomatic consequential connective, uses a Yoruba request expression aligned with the basic lexical force of ἐρωτῶ, and retains the earnest ‘I beg’ sense as a footnoted alternative. The verse-ending comma is retained because the Greek sentence continues into the following verse.
