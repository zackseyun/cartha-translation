id: LUK.16.27
reference: Luke 16:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: yo
  text: Ó sì wí pé, “Nítorí náà, mo béèrè lọ́wọ́ rẹ, bàbá, kí o rán an lọ sí ilé bàbá mi,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “mo bẹ̀ ọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìbéèrè tọkàntọkàn hàn, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìpìlẹ̀ rẹ̀ ni “béèrè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ó sì wí pé
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára yìí hàn.
- source_word: Ἐρωτῶ
  choice: mo bẹ̀ ọ́
  rationale: ἐρωτάω túmọ̀ sí béèrè tàbí ṣe ìbéèrè; nínú àyíká yìí, “bẹ̀” fi hàn pé ìbéèrè tọkàntọkàn ni, láìsọ ọ́ di ẹ̀bẹ̀ alágbára jù bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
- source_word: σε οὖν
  choice: Ǹjẹ́ ... ọ́
  rationale: οὖν so ìbéèrè yìí mọ́ ìkọ̀ tí ó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú tàbí àbájáde; “Ǹjẹ́” mú ìbáṣepọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: πάτερ
  choice: bàbá
  rationale: Ọ̀rọ̀ ìpè yìí tọ́ka sí Abrahamu gẹ́gẹ́ bí baba ńlá, kì í ṣe sí Ọlọ́run gẹ́gẹ́ bí orúkọ oyè.
- source_word: ἵνα πέμψῃς
  choice: kí o rán
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe yìí sọ ohun tí olùsọ ń béèrè; “kí o rán” jẹ́ ìṣètò Yorùbá tó bójú mu fún ìbéèrè náà.
- source_word: αὐτὸν
  choice: an
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Lasaru nínú àyíká tó ṣáájú.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: lọ sí ilé bàbá mi
  rationale: εἰς fi ibi tí a ń lọ hàn, οἶκος sì lè túmọ̀ sí ilé tàbí agbo ilé; “lọ sí ilé bàbá mi” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ ibi-àfojúsùn mọ́.
theological_decisions:
- issue: Ìpè πάτερ nínú àkàwé náà
  choice: bàbá
  alternative: Bàbá gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run
  rationale: Olówó náà ń bá Abrahamu sọ̀rọ̀ gẹ́gẹ́ bí baba ńlá rẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ mú kí ó dà bí ẹni pé ó ń pe Ọlọ́run ní tààrà.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ǹjẹ́” láti fi ìtẹ̀síwájú οὖν hàn, “bàbá” sì wà ní lẹ́tà kékeré nítorí Abrahamu ni a ń pè, kì í ṣe Ọlọ́run.
