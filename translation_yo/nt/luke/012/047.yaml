  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: δοῦλος jẹ́ “ẹrú,” γνοὺς ń tọ́ka sí ìmọ̀ tẹ́lẹ̀, ìṣe méjì tí a kò ṣe ni a pa mọ́, ìjọba ọjọ́ iwájú passive náà sì wà nínú “a ó lù ú.” “Ní ọ̀pọ̀ ìgbà” jẹ́ ọ̀nà Yorùbá tí ó dára láti fi πολλάς, tí orúkọ rẹ̀ fara sin, hàn.'
