id: LUK.12.47
reference: Luke 12:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: yo
  text: Ṣùgbọ́n ẹrú náà, ẹni tí ó mọ ìfẹ́ olúwa rẹ̀, tí kò sì múra sílẹ̀ tàbí ṣe gẹ́gẹ́ bí ìfẹ́ olúwa rẹ̀, a ó lù ú ní ọ̀pọ̀lọpọ̀ ìgbà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, “a ó lù ú ní ọ̀pọ̀ ìgbà.” Gíríìkì fi orúkọ tí “ọ̀pọ̀” ń ṣàpèjúwe sílẹ̀, ṣùgbọ́n ọ̀rọ̀ náà ń tọ́ka sí lùlù léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ó wà lábẹ́ àṣẹ olúwa gẹ́gẹ́ bí ohun-ìní, kì í ṣe òṣìṣẹ́ tí a yá; “ẹrú” pa agbára ìbáṣepọ̀ inú àkàwé náà mọ́.
- source_word: γνοὺς
  choice: ẹni tí ó mọ
  rationale: Ó fi hàn pé ẹrú náà ti mọ ìfẹ́ olúwa rẹ̀ tẹ́lẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún participle Gíríìkì náà.
- source_word: θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́” lè túmọ̀ sí ohun tí olúwa fẹ́ kí a ṣe, ó sì bójú mu nínú àyíká yìí.
- source_word: κυρίου αὐτοῦ
  choice: olúwa rẹ̀
  rationale: Nínú àkàwé ilé yìí, κύριος ni ẹni tó ni ẹrú tí ó sì ń pàṣẹ fún un; “olúwa rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ láìfi oyè Ọlọ́run kún un ní tààrà.
- source_word: ἑτοιμάσας
  choice: múra sílẹ̀
  rationale: Ó túmọ̀ sí mímúra tàbí ṣíṣe ohun kan ní imurasilẹ; èdè yìí jẹ́ ti òde òní, ó sì jẹ́ kí ohun tí Gíríìkì kò sọ ní kedere dúró láìdáhùn.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: tàbí ṣe gẹ́gẹ́ bí ìfẹ́ rẹ̀
  rationale: Ó pa ìyàtọ̀ láàárín àìní ìmúrasílẹ̀ àti àìṣe ohun tó bá ìfẹ́ olúwa mu mọ́.
- source_word: δαρήσεται πολλάς
  choice: a ó lù ú ní ọ̀pọ̀lọpọ̀ ìgbà
  rationale: Future passive δαρήσεται ni “a ó lù ú”; πολλάς jẹ́ adjective plural tí orúkọ rẹ̀ fara sin. Ìtumọ̀ yìí pa àwòrán ìlù léraléra mọ́ láìfi orúkọ tí Gíríìkì kò sọ sí i.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé ìdílé
  choice: olúwa
  alternative: Olúwa; ọ̀gá
  rationale: “Olúwa rẹ̀” ṣàfihàn ẹni tó ni ẹrú àti aláṣẹ rẹ̀ nínú àkàwé, láìpinnu pé ọ̀rọ̀ náà jẹ́ oyè Ọlọ́run ní tààrà nínú gbólóhùn yìí.
- issue: Gbólóhùn ìyà πολλάς
  choice: ní ọ̀pọ̀lọpọ̀ ìgbà
  alternative: pẹ̀lú ọ̀pọ̀ ìlù; gidigidi
  rationale: Gíríìkì fi orúkọ tí πολλάς ń ṣàpèjúwe sílẹ̀ láìsọ ọ́. “Ní ọ̀pọ̀lọpọ̀ ìgbà” pa ìtumọ̀ ìlù léraléra àti àìsọ orúkọ náà mọ́; àlàyé ìsàlẹ̀ sọ àwọn ọ̀nà mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A yan “ẹrú” dípò “ìránṣẹ́” láti pa ìbáṣepọ̀ ìní àti àṣẹ inú àkàwé mọ́. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
