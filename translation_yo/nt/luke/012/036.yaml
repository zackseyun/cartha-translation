  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: yo
  text: Kí ẹ̀yin náà sì dà bí àwọn ènìyàn tí ń dúró de olúwa wọn nígbà tí ó bá padà láti ibi àsè ìgbéyàwó, kí wọ́n sì ṣí ilẹ̀kùn fún un lẹ́sẹ̀kẹsẹ̀ nígbà tí ó bá dé, tí ó sì kan ilẹ̀kùn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοι ἀνθρώποις
  choice: dà bí àwọn ènìyàn
  rationale: Ó fi àfiwé Gíríìkì hàn ní Yorùbá àdánidá, láìfi ọ̀rọ̀ kankan kún un.
- source_word: τὸν κύριον ἑαυτῶν
  choice: olúwa wọn
  rationale: “Olúwa” pa ìtumọ̀ κύριος mọ́ nínú àjọṣe ẹni tó ní àṣẹ lórí àwọn ìránṣẹ́, ó sì yẹra fún yíyan ìtumọ̀ náà sí “ọ̀gá” nìkan.
- source_word: προσδεχομένοις
  choice: tí ń dúró de
  rationale: Ó mú èrò ìretí àti dídúró de ẹnì kan jáde ní èdè Yorùbá tó mọ́gbọ́n dání.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: nígbà tí yóò padà láti ibi àsè ìgbéyàwó
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀναλύσῃ túmọ̀ sí pípadà, γάμοι sì ń tọ́ka sí ayẹyẹ tàbí àsè ìgbéyàwó.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: kí wọn lè tètè ṣí ilẹ̀kùn fún un
  rationale: “Tètè” fi ìtumọ̀ ẹsẹ̀kẹsẹ̀ εὐθέως hàn, “ṣí ilẹ̀kùn” sì sọ ohun tí wọ́n ṣí ní kedere gẹ́gẹ́ bí Yorùbá ṣe máa ń sọ ọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé náà
  choice: olúwa wọn
  alternative: ọ̀gá wọn
  rationale: “Olúwa” pa ìwọ̀n ọ̀rọ̀ orísun àti ìfarahàn rẹ̀ nínú àkàwé mọ́, láìpinnu bóyá a gbọ́dọ̀ ka gbogbo ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ sí i ní ẹsẹ yìí.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti èdè tí àwọn òǹkàwé òde òní lè lóye. A lo “ẹ̀yin” láti pa ẹni kejì ọ̀pọ̀ mọ́, “àwọn ènìyàn” sì tẹ̀lé ọ̀rọ̀ orísun láìfi ìbálòpọ̀ akọ le e lórí.
