  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹ mọ èyí: bí baálé ilé bá mọ ní wákàtí wo ni olè náà ń bọ̀, kì bá ti jẹ́ kí a já wọ ilé rẹ̀.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “kí a walẹ̀ gba ilé rẹ̀”; èyí ń tọ́ka sí bí àwọn olè ṣe máa ń walẹ̀ gba ògiri ilé wọlé.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Ṣùgbọ́n ẹ mọ èyí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn láti mọ tàbí lóye ohun tí ó tẹ̀ lé; “Ṣùgbọ́n” sì fi ìyípadà tàbí ìtakora tí δέ ń tọ́ka sí hàn.
- source_word: οἰκοδεσπότης
  choice: baálé ilé
  rationale: “Baálé ilé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó jẹ́ olórí ilé, ó sì pa ìtumọ̀ ipa ẹni náà mọ́ ju ọ̀rọ̀ tó kan jíjẹ́ olówó ilé nìkan lọ.
- source_word: ποίᾳ ὥρᾳ
  choice: wákàtí tí
  rationale: Èyí pa ìtọ́kasí pàtó sí wákàtí mọ́, ó sì bá àyíká ọ̀rọ̀ nípa wíwà lójúfò mu.
- source_word: ὁ κλέπτης ἔρχεται
  choice: olè ń bọ̀
  rationale: Ìṣísẹ̀ aláìparí “ń bọ̀” fi ìṣe tí a ń retí láti ojú ìwòye baálé ilé hàn, ó sì sun mọ́ àkókò ìsinsìnyí tí èdè Gíríìkì lò.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: kì bá ti jẹ́ kí
  rationale: Ìṣọ̀kan “kì bá ti” sọ ipò àròsọ tí kò ṣẹlẹ̀ ní ti gidi jáde ní Yorùbá, nígbà tí “jẹ́ kí” túmọ̀ sí fífàyè gba.
- source_word: διορυχθῆναι
  choice: kí a já wọ inú
  rationale: Èyí sọ ìtumọ̀ jíjá wọ ilé lọ́nà tí ó ṣe kedere fún òǹkàwé òde òní; àlàyé ìṣe gangan ti jíjá tàbí walẹ̀ gba ògiri ni a fi sínú àlàyé ìsàlẹ̀.
- source_word: τὸν οἶκον αὐτοῦ
  choice: ilé rẹ̀
  rationale: “Ilé rẹ̀” jẹ́ ìbádọ́gba tààrà fún gbólóhùn Gíríìkì náà, ó sì bá àwòrán jíjá wọ ilé mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ” nítorí àṣẹ Gíríìkì náà jẹ́ fún ọ̀pọ̀ ènìyàn; a sì lo àmì ohùn níbi tí ó bá yẹ.
