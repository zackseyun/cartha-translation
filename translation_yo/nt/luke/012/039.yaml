    rationale: Gbólóhùn Gíríìkì náà béèrè wákàtí pàtó tí olè yóò fi dé. ‘Ní wákàtí wo ni’ pa ìbéèrè aláìmọ̀ náà mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ ‘walẹ̀ gba ilé rẹ̀’ lè dà bíi pé a walẹ̀ gba gbogbo ilé.
    rationale: διορυχθῆναι ní àyíká yìí ń tọ́ka sí walẹ̀ gba ògiri ilé láti wọlé; fífi ‘ògiri’ kún un jẹ́ kí àwòrán ìtàn náà ṣe kedere.
