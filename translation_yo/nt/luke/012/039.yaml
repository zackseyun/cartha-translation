  to: 'Ṣùgbọ́n ẹ mọ èyí: bí baálé ilé bá mọ ní wákàtí wo ni olè náà ń bọ̀, kì bá ti jẹ́ kí a já wọ ilé rẹ̀.[a]'
  rationale: A tún ‘wákàtí tí’ ṣe sí ‘ní wákàtí wo ni’ kí ìbéèrè pàtó nínú ποίᾳ ὥρᾳ má bàa sọnù. A tún mú àlàyé ìsàlẹ̀ náà ṣe kedere nípa ògiri ilé, láì yí ìtumọ̀ àfọwọ́kọ tàbí àwòrán ‘jíjá wọlé’ nínú ọ̀rọ̀ pàtàkì padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:33Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìlànà àṣẹ náà, ipò àròsọ tí kò ṣẹlẹ̀, àti ìtumọ̀ gbogbogbò ti jíjá wọ ilé mọ́ dáadáa. Síbẹ̀, ποίᾳ ὥρᾳ ní ìbéèrè pàtó (‘ní wákàtí wo’), èyí tí ‘wákàtí tí’ kò fi hàn ní kíkún.
  naturalness: Ìgbékalẹ̀ náà dára, ṣùgbọ́n ‘ní wákàtí wo ni’ jẹ́ Yorùbá àdánidá àti kedere ju ‘wákàtí tí’ lọ ní àyíká yìí. ‘Kì bá ti jẹ́ kí’ ń sọ àbájáde àròsọ àtijọ́ tí kò ṣẹlẹ̀ ní ti gidi jáde dáadáa.
  terminology: ‘Baálé ilé,’ ‘olè,’ àti ‘ilé rẹ̀’ yẹ, wọ́n sì bá ìforígbárí ilé nínú ọ̀rọ̀ Gíríìkì náà mu. ‘Já wọ ilé’ jẹ́ ọ̀nà ìgbàlódé tó wúlò fún διορυχθῆναι; àlàyé ìsàlẹ̀ gbọ́dọ̀ sọ ìtumọ̀ gangan ‘walẹ̀ gba ògiri’ ní kedere.
  issues:
