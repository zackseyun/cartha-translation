  source_fidelity: 'Ìtumọ̀ náà pa ìlànà ìkọ̀sẹ̀ méjì inú Gíríìkì mọ́ dáadáa: kò sí ohun tí a fi pamọ́ tí a kò ní ṣípayá, bẹ́ẹ̀ sì ni kò sí ohun ìkọ̀kọ̀ tí a kò ní di mímọ̀. Síbẹ̀, ‘a kì yóò’ kì í ṣe ọ̀nà Yorùbá boṣewa fún ìkọ̀sẹ̀ ọjọ́ iwájú nínú gbólóhùn yìí; ‘a kò ní’ ni ó tọ́, ó sì dá ìtumọ̀ ọjọ́ iwájú Gíríìkì dúró.'
