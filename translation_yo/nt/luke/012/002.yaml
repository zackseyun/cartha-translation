source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: yo
  text: Ṣùgbọ́n kò sí ohun tí a ti bò mọ́lẹ̀ tí a kò ní ṣí payá,[a][c] bẹ́ẹ̀ ni kò sí ohun tí ó farapamọ́ tí a kò ní mọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ‘bò mọ́lẹ̀’ sí ‘fi pamọ́’; Gíríìkì lo àwòrán ohun tí a bò, tí a ó sì ṣí payá lẹ́yìn náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘ohun tí ó farapamọ́’ sí ‘ohun ìkọ̀kọ̀.’
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ yìí lè tọ́ka sí ìṣípayá ní gbogbogbò, yálà ní àkókò ìsinsin yìí tàbí ní ìdájọ́ ìkẹyìn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: kò sí ohun
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìkọ̀sẹ̀ pátápátá náà pé ‘kò sí ohunkóhun,’ ó sì pa ìtẹnumọ́ gbogbo ohun mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń tẹ̀síwájú pẹ̀lú ìyàtọ̀ díẹ̀ sí ọ̀rọ̀ tó ṣáájú; ‘Ṣùgbọ́n’ bá àyíká ìkìlọ̀ mu.
- source_word: συγκεκαλυμμένον
  choice: tí a bò mọ́lẹ̀
  rationale: Ó pa àwòrán Gíríìkì ti ohun tí a ti bò mọ́lẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìfipamọ́ tàbí ìbòmọ́lẹ̀.
- source_word: ἀποκαλυφθήσεται
  choice: tí a kì yóò ṣí payá
  rationale: ‘Ṣí payá’ dáhùn sí ‘bò mọ́lẹ̀’ ní ti àwòrán àti ìtumọ̀, ó sì fi ìṣe ọjọ́ iwájú hàn láì sọ ẹni tó máa ṣe é.
- source_word: κρυπτὸν
  choice: ohun tí ó farapamọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun tí ó wà ní ìkọ̀kọ̀ tàbí tí a kò rí; ‘farapamọ́’ jẹ́ àdánidá, ó sì yà díẹ̀ sí ‘bò mọ́lẹ̀.’
- source_word: γνωσθήσεται
  choice: tí a kì yóò mọ̀
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ohun náà yóò di mímọ̀.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: tí a kì yóò
  rationale: Àkójọpọ̀ yìí pa àwọn gbólóhùn ìbátan méjèèjì àti ìkọ̀sẹ̀ wọn mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n àti agbára ọ̀rọ̀ náà
  choice: Ìlànà gbogbogbò pé ohun tí a fi pamọ́ nísinsin yìí yóò di ṣíṣípayá tàbí mímọ̀ nígbẹ̀yìn.
  alternative: Ó lè tọ́ka ní pàtó sí ìṣípayá ní ìdájọ́ ìkẹyìn, tàbí sí ìfarahàn àgàbàgebè ní àkókò ìsinsin yìí.
  rationale: Àwọn ọ̀rọ̀ ìṣe ọjọ́ iwájú tí a ṣe sí olùgbà nínú Gíríìkì fi ìṣípayá ọjọ́ iwájú hàn, ṣùgbọ́n wọn kò sọ àkókò rẹ̀ ní pàtó; ìtumọ̀ náà kò fi tipátipá yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ. Ìfihàn ‘bò mọ́lẹ̀ / ṣí payá’ pa àwòrán ìtakora inú Gíríìkì mọ́, nígbà tí ‘farapamọ́ / mọ̀’ pa ìṣọ̀kan gbólóhùn kejì mọ́.
