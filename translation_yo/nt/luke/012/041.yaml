id: LUK.12.41
reference: Luke 12:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: yo
  text: Peteru sì wí pé, “Olúwa, ṣé ìwọ ń sọ àkàwé yìí fún wa, tàbí fún gbogbo ènìyàn náà[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún gbogbo wọn.” Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀ akọ nípa gírámà, ṣùgbọ́n níbí ó ń tọ́ka sí gbogbo àwọn olùgbọ́ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: sì wí pé
  rationale: “Wí pé” ń ṣàfihàn ìṣe sísọ ní kedere, “sì” sì ń so ọ̀rọ̀ Peteru mọ́ ohun tó ṣáájú gẹ́gẹ́ bí δέ ṣe rí, láì fi ìtumọ̀ tuntun kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ọ̀rọ̀ àdírẹ́sì tó yẹ fún κύριος; ó pa ọ̀wọ̀ àti ìtumọ̀ Kristi mọ́ láì sọ ohun tí ẹsẹ̀ náà kò sọ ní pàtó.
- source_word: πρὸς ἡμᾶς
  choice: àwa ni ... fún
  rationale: Ètò ọ̀rọ̀ Yorùbá yìí dá àwa sí àfiyèsí, ó sì fi hàn pé Peteru ń béèrè bóyá àwọn ni Jésù ń bá sọ̀rọ̀.
- source_word: τὴν παραβολὴν ταύτην
  choice: àkàwé yìí
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún παραβολή nínú ẹ̀kọ́ àpẹẹrẹ Jésù, “yìí” sì pa itọ́ka ταύτην mọ́.
- source_word: λέγεις
  choice: o ń sọ
  rationale: Àmì “ń” ń fi ìṣe tó ń lọ lọ́wọ́ hàn, èyí tó bá present λέγεις mu ní àyíká ìbéèrè Peteru.
- source_word: ἢ καὶ
  choice: tàbí ... pẹ̀lú
  rationale: “Tàbí” pa ìyàtọ̀ àwọn àṣàyàn méjì mọ́, “pẹ̀lú” sì gbé agbára àfikún καί jáde.
- source_word: πρὸς πάντας
  choice: fún gbogbo ènìyàn
  rationale: πάντας ń tọ́ka sí gbogbo àwọn olùgbọ́ ní gbogbogbò, kì í ṣe àwọn ọkùnrin nìkan; “gbogbo ènìyàn” jẹ́ Yorùbá àdánidá tó mú ìtumọ̀ yẹn jáde.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí Peteru ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ ọ̀wọ̀ àti ìṣípayá Kristi tó ṣeé ṣe mọ́, láì fipá mú ẹsẹ̀ náà sínú ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
- issue: Ìtọ́kasí πάντας tó jẹ́ akọ ní gírámà Gíríìkì
  choice: gbogbo ènìyàn
  alternative: gbogbo wọn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn olùgbọ́ lápapọ̀, kì í ṣe akọ nìkan. “Gbogbo ènìyàn” sọ ìtọ́kasí gbogbogbò náà di mímọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. “Sì wí pé” jẹ́ àsopọ̀ ìtàn tó rọrùn; ìṣètò “àwa ni ... fún” sì jẹ́ àdánidá ní Yorùbá, ó ń pa ìfọkànsí ìbéèrè Gíríìkì mọ́.
