  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín, ẹ̀yin ọ̀rẹ́ mi, ẹ má ṣe bẹ̀rù àwọn tí ń pa ara, tí lẹ́yìn ìyẹn wọn kò lè ṣe ohunkóhun mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe bẹ̀rù àwọn tí ń pa ara, tí lẹ́yìn ìyẹn wọn kò ní ohun mìíràn tí wọ́n lè ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Ṣùgbọ́n mo sọ
  rationale: δέ jẹ́ àsopọ̀ tó ń yí ọ̀rọ̀ padà díẹ̀, tí ó sì lè ní ìtumọ̀ ìtakora pẹ̀lẹ́; “Ṣùgbọ́n” mú ìyípadà náà jáde láì fi ìtakora tó pọ̀ sí i.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: fún yín, ẹ̀yin ọ̀rẹ́ mi
  rationale: Gbólóhùn dátífù náà ṣàlàyé àwọn tí Jesu ń bá sọ̀rọ̀, ó sì pa ọ̀rọ̀ arọ́pò-orúkọ àti ìpè onífẹ̀ẹ́ “ọ̀rẹ́ mi” mọ́.
- source_word: μὴ φοβηθῆτε
  choice: Ẹ má ṣe bẹ̀rù
  rationale: Ìlànà ìdènà ni fọ́ọ̀mù yìí; èdè Yorùbá yìí jẹ́ ti àdánidá, ó sì fi agbára àṣẹ náà hàn.
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: àwọn tí ń pa
  rationale: ἀπό lẹ́yìn φοβέομαι ń tọ́ka sí ẹni tí ìbẹ̀rù náà dojú kọ; partísípù àsìkò ìsinsìnyí níbí jẹ́ àpèjúwe gbogbogbò fún àwọn apànìyàn.
- source_word: τὸ σῶμα
  choice: ara
  rationale: σῶμα ń tọ́ka sí ara ti ẹran-ara níbí; “ara” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ nínú àyíká yìí.
- source_word: καὶ μετὰ ταῦτα
  choice: tí lẹ́yìn èyí
  rationale: Gbólóhùn náà jẹ́ ti àsìkò, ó ń sọ ohun tó ṣẹlẹ̀ lẹ́yìn pípa ara; “lẹ́yìn èyí” jẹ́ ti àdánidá, ó sì pa ìtẹ̀lé náà mọ́.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: kò sì ní ohun mìíràn tí wọ́n lè ṣe
  rationale: Ó ń tẹnumọ́ ààlà agbára àwọn apànìyàn lẹ́yìn ikú ara; ìtumọ̀ yìí pa “ohunkóhun sí i” àti àìlè ṣe é mọ́ láì ṣàfikún ohun tí ẹsẹ náà kò sọ.
theological_decisions:
- issue: Ààlà agbára ènìyàn lẹ́yìn ikú ara
  choice: A sọ pé àwọn onínúnibíni lè pa ara, ṣùgbọ́n lẹ́yìn náà wọn kò ní ohun mìíràn tí wọ́n lè ṣe.
  alternative: Láti ṣàfikún ní kedere pé wọn kò lè pa ọkàn.
  rationale: Ẹsẹ yìí kò dárúkọ ọkàn, bí ó tilẹ̀ jẹ́ pé ẹsẹ tó tẹ̀ lé e ń fi ààlà agbára ènìyàn wé àṣẹ Ọlọ́run. Ìtumọ̀ náà pa ọ̀rọ̀ ẹsẹ yìí mọ́ láì mú àlàyé ẹsẹ tó tẹ̀ lé e wọ inú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. “Ẹ̀yin ọ̀rẹ́ mi” jẹ́ ìpè onífẹ̀ẹ́ tó bá ọ̀pọ̀ olùgbọ́ mu; ìlò “ẹ” pa ọ̀wọ̀ àti ọ̀pọ̀ ènìyàn tí ὑμῖν tọ́ka sí mọ́.
