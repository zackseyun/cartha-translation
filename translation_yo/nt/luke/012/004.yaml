  to: Ṣùgbọ́n mo sọ fún yín, ẹ̀yin ọ̀rẹ́ mi, ẹ má ṣe bẹ̀rù àwọn tí ń pa ara, tí lẹ́yìn ìyẹn wọn kò lè ṣe ohunkóhun mọ́.[a]
  rationale: Àtúnṣe náà mú kí àìlè ṣe ohunkóhun sí i lẹ́yìn pípa ara hàn ní kedere, ní ìbámu pẹ̀lú περισσότερόν τι ποιῆσαι. Ó tún mú àmì-ìdúró rọrùn, ó sì ṣètọ́jú ìdánilójú ẹsẹ náà láì ṣàfikún ohun tí kò sí nínú rẹ̀.
