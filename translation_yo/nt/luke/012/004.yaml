  - severity: low
    issue: Àmì-amúnisọ̀rọ̀ lẹ́yìn “ẹ̀yin ọ̀rẹ́ mi” kò ṣe pàtàkì.
    rationale: Èyí jẹ́ ìpè tó wà láàárín gbolohun kan; àmì-ìyà jẹ́ ìṣàn ọrọ̀ Yorùbá tó dára jù lọ.
