  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: ó pe àwọn olùgbọ́ ní “ọ̀rẹ́ mi,” ó fi ìdènà ìbẹ̀rù hàn, ó sì ní ìdíwọ̀n agbára àwọn tí ń pa ara láì ṣàfikún “ọkàn.” Síbẹ̀, ọ̀rọ̀ “kò sì ní ohun mìíràn” lè dà bí ìní tàbí ìwájú-ìgbà, níbi tí Gíríìkì ti ń sọ kedere pé wọn kò lè ṣe ohunkóhun sí i.'
  naturalness: “Lẹ́yìn ìyẹn wọn kò lè ṣe ohunkóhun mọ́” jẹ́ Yorùbá boṣewa tó mọ́gbọ́n dání, ó sì sọ ìtumọ̀ ìdíwọ̀n yẹn ní kedere. Àmì-ìdúró pẹ̀lú àmì-ìyà yẹ kí ó rọ́pò àmì-amúnisọ̀rọ̀ nínú gbolohun kan ṣoṣo.
  terminology: “Ara” jẹ́ ìtumọ̀ tó bójú mu fún σῶμα ní àyíká yìí. “Ẹ̀yin ọ̀rẹ́ mi” dá ìpè onífẹ̀ẹ́ náà dúró, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
  issues:
