translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìṣe tí ń lọ lọ́wọ́ àti ìṣe àṣà inú àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́.
