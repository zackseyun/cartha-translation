revisions:
- from: Ó sì tún ń sọ fún àwọn ọ̀pọ̀ ènìyàn pé, “Nígbà tí ẹ bá rí ìkùukùu kan tí ó ń gòkè láti ìwọ̀-oòrùn, lẹ́sẹ̀kẹsẹ̀ ni ẹ máa ń sọ pé, ‘Òjò ń bọ̀,’ ó sì máa ń rí bẹ́ẹ̀.”
  to: Ó sì tún ń sọ fún àwọn ogunlọ́gọ̀ pé, “Nígbà tí ẹ bá rí ìkùukùu kan tí ń yọ láti ìwọ̀-oòrùn, lẹ́sẹ̀kẹsẹ̀ ni ẹ máa ń sọ pé, ‘Òjò ń bọ̀,’ ó sì máa ń ṣẹlẹ̀ bẹ́ẹ̀.”
  rationale: The revision replaces an unnatural final predicate with ṣẹlẹ̀, which directly conveys γίνεται, and uses a more idiomatic rendering of “crowds.” All other elements retain the draft’s faithful representation of the Greek’s aspect, direction, and generalized weather proverb.
