id: LUK.12.54
reference: Luke 12:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: yo
  text: Ó sì tún ń sọ fún àwọn ogunlọ́gọ̀ pé, “Nígbà tí ẹ bá rí ìkùukùu kan tí ń yọ láti ìwọ̀-oòrùn, lẹ́sẹ̀kẹsẹ̀ ni ẹ máa ń sọ pé, ‘Òjò ń bọ̀,’ ó sì máa ń ṣẹlẹ̀ bẹ́ẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ó sì tún ń sọ
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ń sọ” pa abala yìí mọ́ ní Yorùbá àdánidá.
- source_word: δὲ καὶ
  choice: sì tún
  rationale: “Sì” so ọ̀rọ̀ náà mọ́ ohun tó ṣáájú, “tún” sì mú agbára àfikún καί jáde láìfi ìtumọ̀ tí kò sí sínú rẹ̀.
- source_word: τοῖς ὄχλοις
  choice: fún àwọn ọ̀pọ̀ ènìyàn
  rationale: Èyí pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí àwọn ènìyàn púpọ̀ tí wọ́n péjọ.
- source_word: Ὅταν ἴδητε
  choice: Nígbà tí ẹ bá rí
  rationale: Àkópọ̀ “nígbà tí ... bá” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣẹ̀lẹ̀ gbogbogbò tí a retí tàbí tí ó lè ṣẹlẹ̀.
- source_word: νεφέλην
  choice: ìkùukùu kan
  rationale: νεφέλη túmọ̀ sí ìkùukùu; a kò fi “ìkùukùu òjò” kún un nítorí pé àyíká ọ̀rọ̀ fúnra rẹ̀ ló ń fi ojú-ọjọ́ hàn.
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: tí ó ń gòkè láti ìwọ̀-oòrùn
  rationale: “Ń gòkè” pa àwòrán ìkùukùu tó ń yọ sókè mọ́, “láti ìwọ̀-oòrùn” sì sọ ibi tí ó ti ń bọ̀ ní kedere gẹ́gẹ́ bí àyíká ojú-ọjọ́ ṣe béèrè.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ “ní kíákíá, láìjáfara” mọ́.
- source_word: λέγετε
  choice: ẹ máa ń sọ
  rationale: Ìṣesí àṣà tàbí ohun tí wọ́n sábà máa ń ṣe ni ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí náà ń tọ́ka sí; “máa ń” mú èyí jáde dáadáa.
- source_word: Ὄμβρος
  choice: Òjò
  rationale: ὄμβρος lè túmọ̀ sí òjò lápapọ̀ tàbí òjò líle; “òjò” jẹ́ yíyan tó ṣe kedere tí kò sì fi agbára tí ọ̀rọ̀ náà kò dájú pé ó ní kún un.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Èyí fi ìsúnmọ́lẹ̀ ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá.
- source_word: καὶ γίνεται οὕτως
  choice: ó sì máa ń rí bẹ́ẹ̀
  rationale: Gbólóhùn yìí pa ìtumọ̀ pé ohun tí wọ́n sọ máa ń ṣẹ gẹ́gẹ́ bí wọ́n ti sọ mọ́, ó sì bá ìwòye gbogbogbò inú ẹsẹ náà mu.
