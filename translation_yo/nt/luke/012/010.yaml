id: LUK.12.10
reference: Luke 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá sọ ọ̀rọ̀ lòdì sí Ọmọ Ènìyàn[a], a ó dárí jì í[b]; ṣùgbọ́n ẹni tí ó bá sọ̀rọ̀-òdì sí Ẹ̀mí Mímọ́, a kì yóò dárí jì í.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnikẹ́ni tí ó bá sọ ọ̀rọ̀ kan lòdì sí Ọmọ Ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó jẹ́ “a ó dárí jì í”; ohun tí a dárí jì—ìyẹn ẹ̀ṣẹ̀ tàbí ọ̀rọ̀ náà—wà ní àṣírí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Ọ̀rọ̀ yìí fi ìtumọ̀ gbogbogbò àti ti ẹnì kọ̀ọ̀kan hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐρεῖ λόγον
  choice: sọ ọ̀rọ̀
  rationale: Ó pa λόγον (‘ọ̀rọ̀’) mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: εἰς τὸν υἱὸν τοῦ ἀνθρώπου
  choice: lòdì sí Ọmọ Ènìyàn
  rationale: Nínú àyíká ọ̀rọ̀ burúkú àti blasfēmí, εἰς ń tọ́ka sí ìlòdìsí; ‘Ọmọ Ènìyàn’ pa àkọ́lé náà mọ́.
- source_word: ἀφεθήσεται αὐτῷ
  choice: a ó dárí rẹ̀ jì í
  rationale: Yorùbá máa ń sọ ìdáríjì sí ẹni pẹ̀lú ohun tí a dárí jì ní àṣírí tàbí nípasẹ̀ arọ́pò-orúkọ; ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa passive àìdárúkọ olùṣe mọ́.
- source_word: τῷ ... βλασφημήσαντι
  choice: ẹni tí ó bá sọ̀rọ̀-òdì
  rationale: Substantival participle náà di gbólóhùn ẹni-gbogbo; ‘sọ̀rọ̀-òdì’ mú ìtumọ̀ ọ̀rọ̀ ẹ̀gàn sí ohun mímọ́ jáde láìfi ìtumọ̀ àsìkò tí ó pọ̀ ju ti Gíríìkì lọ.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá ìgbàlódé tí a mọ̀ dáadáa fún Ẹ̀mí Ọlọ́run tí ẹsẹ̀ náà ń dárúkọ.
- source_word: οὐκ ἀφεθήσεται
  choice: a kì yóò dárí rẹ̀ jì í
  rationale: Ó fi ọjọ́ iwájú tí a sẹ́ hàn ní kedere, ó sì pa bí ọ̀rọ̀ náà ṣe le tó mọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín sísọ ọ̀rọ̀ lòdì sí Ọmọ Ènìyàn àti sísọ̀rọ̀-òdì sí Ẹ̀mí Mímọ́
  choice: A pa ìyàtọ̀ tí ẹsẹ̀ Gíríìkì fúnra rẹ̀ ṣe mọ́, láìṣàlàyé irú ẹ̀ṣẹ̀ tí a kò ní dárí jì nínú ìtumọ̀.
  alternative: Kí a túmọ̀ apá àkọ́kọ́ gẹ́gẹ́ bí ẹ̀ṣẹ̀ àìmọ̀, kí a sì ṣàlàyé apá kejì gẹ́gẹ́ bí àìronúpìwàdà títí dé òpin.
  rationale: Ẹsẹ̀ náà sọ pé a lè dárí ọ̀kan jì, a kò sì ní dárí èkejì jì, ṣùgbọ́n kò ṣàlàyé ìlànà ẹ̀kọ́ níbí; nítorí náà, a kò gbọ́dọ̀ yanjú àríyànjiyàn ẹ̀kọ́ nínú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ náà jẹ́ ti ìgbàlódé, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lasán. A lo ‘sọ̀rọ̀-òdì’ fún βλασφημέω láti yà á sọ́tọ̀ kúrò nínú sísọ ọ̀rọ̀ lòdì sí ẹnì kan lásán.
