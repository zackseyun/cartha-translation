id: LUK.12.59
reference: Luke 12:59
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: yo
  text: Mo sọ fún ọ pé, dájúdájú, ìwọ kì yóò jáde kúrò níbẹ̀ títí tí o fi san àní lépítónì tó kẹ́yìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí tí o fi san ẹyọ owó kékeré tó kẹ́yìn.” Ọ̀rọ̀ Gíríìkì náà, λεπτόν (lépítónì), ń tọ́ka sí ẹyọ owó tí iye rẹ̀ kéré gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Mo sọ fún ọ
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ọ̀rọ̀ tààrà sọ fún ẹni kan, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: dájúdájú, ìwọ kì yóò jáde
  rationale: Àpapọ̀ οὐ μή pẹ̀lú aorist subjunctive jẹ́ ìkọ̀ tí a tẹnumọ́ nípa ohun ọjọ́ iwájú; “dájúdájú ... kì yóò” fi ìtẹnumọ́ náà hàn ní Yorùbá òde òní.
- source_word: ἐκεῖθεν
  choice: kúrò níbẹ̀
  rationale: Adverb náà túmọ̀ sí ‘láti ibẹ̀’; pẹ̀lú ‘jáde,’ gbólóhùn ‘jáde kúrò níbẹ̀’ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἕως
  choice: títí ... fi
  rationale: Ìṣètò ‘títí ... fi’ jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ààlà àkókò tí ἕως ń tọ́ka sí.
- source_word: καὶ τὸ ἔσχατον
  choice: tí ó kẹ́yìn pàápàá
  rationale: Níhìn-ín καί ń tẹnumọ́ pé gbogbo gbèsè ni a ó san pátápátá; ‘pàápàá’ mú ìtẹnumọ́ yẹn jáde, ‘kẹ́yìn’ sì dúró fún ἔσχατον.
- source_word: λεπτόν
  choice: owó lépítónì
  rationale: Ìyípadà orúkọ owó náà sí ‘lépítónì’ pa ìdánimọ̀ owó ìgbàanì mọ́; ‘owó’ mú kí òǹkàwé mọ̀ lẹ́sẹ̀kẹsẹ̀ pé ẹyọ owó ni.
- source_word: ἀποδῷς
  choice: yóò fi san
  rationale: Nínú gbólóhùn àkókò yìí, ‘títí ... yóò fi san’ fi hàn pé jíjáde kò ní ṣẹlẹ̀ kí sísan náà tó pé; ‘san’ bá àyíká gbèsè àti ẹjọ́ mu.
theological_decisions:
- issue: Irú ohun tí àpẹẹrẹ gbèsè àti ẹ̀wọ̀n ń tọ́ka sí
  choice: A pa àwòrán gbèsè, ìhámọ́, àti sísan pátápátá mọ́ láì sọ ohun pàtó tí ó dúró fún.
  alternative: Kí a sọ pé ó ń tọ́ka sí ìyọrísí ẹjọ́ ayé, ìdájọ́ Ọlọ́run, tàbí ìjìyà purgatory.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò dá ohun tí àwòrán náà dúró fún mọ́; ìtumọ̀ tí kò fi ẹ̀kọ́ ìjọ kan kún un ń pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá tó péye, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A pa ọ̀rọ̀ tààrà àti àwòrán ẹjọ́-gbèsè mọ́, a sì ṣàlàyé orúkọ owó ìgbàanì nínú àlàyé ìsàlẹ̀.
