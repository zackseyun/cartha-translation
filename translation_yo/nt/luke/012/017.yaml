  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: yo
  text: Ó sì ń ronú nínú ọkàn ara rẹ̀ pé, “Kí ni màá ṣe? Nítorí kò sí ibi tí màá kó èso oko mi jọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: ń ronú
  rationale: Ọ̀rọ̀ yìí fi ìgbésẹ̀ ìrònú inú tí ó ń lọ lọ́wọ́ hàn; àmì àkókò aláìpé nínú Gíríìkì ni a fi “ń” ṣe àfihàn.
- source_word: ἐν ἑαυτῷ
  choice: nínú ara rẹ̀
  rationale: Ó tọ́ka sí ìrònú tí ó wáyé nínú ọkàn rẹ̀, kì í ṣe dandan pé ó sọ ọ́ sókè.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá àdánidá, “pé” ló fi àkóónú ọ̀rọ̀ inú rẹ̀ bẹ̀rẹ̀ láìjẹ́ kí gbolohun náà wuwo.
- source_word: Τί ποιήσω
  choice: Kí ni èmi yóò ṣe
  rationale: Èyí pa ìbéèrè ìgbìmọ̀-ọkàn mọ́, ó sì jẹ́ ọ̀nà tí ó mọ́gbọ́n dání ní Yorùbá òde òní.
- source_word: ὅτι
  choice: níwọ̀n ìgbà tí
  rationale: Ó sọ ìdí tí ìbéèrè náà fi dìde, gẹ́gẹ́ bí ìtumọ̀ ìdí ti ὅτι níbí.
- source_word: οὐκ ἔχω ποῦ
  choice: èmi kò ní ibi tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò sí ààyè tí ó ní fún ohun tí ó fẹ́ ṣe.
- source_word: συνάξω
  choice: kó ... sí
  rationale: “Kó ... sí” mú ìtumọ̀ kíkó ohun ọ̀gbìn jọ sí ibi kan mu, ó sì bá ọ̀rọ̀ ibi ìpamọ́ nínú àyíká ẹsẹ̀ náà mu.
- source_word: τοὺς καρπούς μου
  choice: èso oko mi
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀, καρποί túmọ̀ sí gbogbo èso tàbí ohun tí oko mú jáde, kì í ṣe èso igi nìkan.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àtúnṣe ọ̀rọ̀ Yorùbá àdánidá fún ìrònú inú, a sì pa àìsọ pàtó bóyá καρποί jẹ́ irúgbìn tàbí gbogbo èso oko mọ́ nínú àlàyé ìsàlẹ̀.
