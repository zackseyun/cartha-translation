  source_fidelity: Ìtumọ̀ náà mú ìrònú inú ẹni náà, ìbéèrè ìgbìmọ̀-ọkàn rẹ̀, ìdí àìní ibi, àti ikójọpọ̀ èso oko rẹ̀ dáadáa. Ṣùgbọ́n ìlànà ọ̀rọ̀ náà lè jẹ́ adayeba síi, a sì lè yọ ìtẹnumọ́ “èmi” tí kò sí nínú Gíríìkì kúrò.
