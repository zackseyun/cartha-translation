id: LUK.12.56
reference: Luke 12:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: yo
  text: Ẹ̀yin alágàbàgebè! Ẹ mọ bí ẹ ṣe lè tú ìrísí ilẹ̀ àti ojú ọ̀run, ṣùgbọ́n báwo ni ẹ kò ṣe mọ bí ẹ ṣe lè tú àsìkò yìí[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “ìgbà yìí” tàbí “àsìkò pàtàkì yìí.” Ọ̀rọ̀ Gíríìkì καιρός lè túmọ̀ sí àkókò tó ní ìtumọ̀ pàtàkì tàbí àkókò àǹfààní, kì í ṣe àkókò lásán nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ẹ̀yin alágàbàgebè
  rationale: Ó jẹ́ ọ̀rọ̀ ìbáwí tààrà sí àwọn tí ìṣe wọn kò bá ohun tí wọ́n ń fi ara hàn mu; ‘alágàbàgebè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì mú ìtumọ̀ òṣèré wọ inú ẹsẹ náà.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: ìrísí ilẹ̀ àti ojú ọ̀run
  rationale: πρόσωπον níbí túmọ̀ sí ìrísí tí ojú ń rí. ‘Ilẹ̀’ àti ‘ojú ọ̀run’ bá ọ̀rọ̀ nípa àmì ojú ọjọ́ mu ní Yorùbá àdánidá.
- source_word: οἴδατε δοκιμάζειν
  choice: ẹ mọ bí ẹ ṣe lè mọ ohun tí ... ń sọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń sọ nípa agbára láti yẹ àmì wò, kí a sì mọ ìtumọ̀ rẹ̀. Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò ìtumọ̀ tàbí ìfòye mọ́.
- source_word: τὸν καιρὸν τοῦτον
  choice: ìgbà yìí
  rationale: ‘Ìgbà yìí’ tọ́ka sí àkókò tí wọ́n wà nínú rẹ̀ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún ọ̀rọ̀ Gíríìkì; àlàyé ìsàlẹ̀ fi agbára ìtumọ̀ καιρός hàn.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: báwo ni ẹ kò ṣe mọ bí ẹ ṣe lè mọ ohun tí ... ń sọ?
  rationale: Ìbéèrè yìí pa agbára ìbáwí àti ìyàlẹ́nu inú πῶς mọ́, ó sì tún àpẹẹrẹ ọ̀rọ̀ apá àkọ́kọ́ ṣe gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ καιρός nínú ìbáwí Jésù
  choice: ìgbà yìí
  alternative: àsìkò pàtàkì yìí; àsìkò àǹfààní yìí
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìgbà tó ní ìtumọ̀ pàtàkì nínú iṣẹ́ Jésù, ṣùgbọ́n kíkọ ‘pàtàkì’ sínú ọ̀rọ̀ pàtàkì yóò tú ìṣòro ìtumọ̀ náà ju ohun tí Gíríìkì sọ lọ. Àlàyé ìsàlẹ̀ ló dára fún àwọn ìtumọ̀ míì.
translation_notes:
  register: A lo Yorùbá tó mọ́, tó ní iyì, tí àwọn òǹkàwé òde òní lè lóye. Ìsọ̀rọ̀ ‘ohun tí ... ń sọ’ jẹ́ àkànlò èdè àdánidá fún fífi àmì hàn tàbí túmọ̀ rẹ̀; ó yẹra fún gbólóhùn líle bí ‘ṣe àgbéyẹ̀wò ìrísí.’
