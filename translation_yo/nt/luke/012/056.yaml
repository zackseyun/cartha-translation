  to: Ẹ̀yin alágàbàgebè! Ẹ mọ bí ẹ ṣe lè tú ìrísí ilẹ̀ àti ojú ọ̀run, ṣùgbọ́n báwo ni ẹ kò ṣe mọ bí ẹ ṣe lè tú àsìkò yìí[a]?
