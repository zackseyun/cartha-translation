  terminology: ‘Ọ̀gá,’ ‘ẹrú,’ ‘aláìṣòótọ́,’ àti ‘aláìgbàgbọ́’ yẹ sí àyíká àkàwé náà àti sí ìwọ̀n ìtumọ̀ ἀπίστων. Àlàyé a ń pa ìtumọ̀ mìíràn ti διχοτομήσει mọ́, láìmú ìtumọ̀ àsọyé náà wọ inú ọ̀rọ̀ àkọ́kọ́.
