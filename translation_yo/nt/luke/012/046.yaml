  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní ọ̀pọ̀lọpọ̀ ibi: ‘Ọ̀gá’/‘ẹrú,’ àìretí ọjọ́ náà, àìmọ̀ wákàtí náà, àti àwòrán gígé sí méjì ni a pa mọ́. Síbẹ̀, ‘yóò pín ìpín rẹ̀ pẹ̀lú’ lè túmọ̀ sí pípín ohun kan láàárín àwọn ènìyàn, kì í ṣe fífi ìpín ẹni náà sọ́dọ̀ àwọn aláìṣòótọ́ gẹ́gẹ́ bí θήσει ... μετὰ τῶν ἀπίστων ṣe sọ.'
