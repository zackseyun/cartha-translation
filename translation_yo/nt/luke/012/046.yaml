id: LUK.12.46
reference: Luke 12:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: yo
  text: Ọ̀gá ẹrú náà yóò dé ní ọjọ́ tí ẹrú náà kò retí dídé rẹ̀, àti ní wákàtí tí kò mọ̀; yóò sì gé e sí méjì[a], yóò sì fi ìpín tirẹ̀ fún un láàrín àwọn aláìṣòótọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò gé e sí wẹ́wẹ́”; àwọn kan ka gbólóhùn yìí sí ọ̀nà àsọyé tó túmọ̀ sí, “yóò fi ìyà líle jẹ ẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn aláìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ọ̀gá
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ni àṣẹ lórí ẹrú, kì í ṣe dandan orúkọ oyè ‘Olúwa.’
- source_word: δοῦλος
  choice: ẹrú
  rationale: ‘Ẹrú’ fi ìbáṣepọ̀ ìní àti àṣẹ tó wà nínú δοῦλος hàn kedere ju ‘ìránṣẹ́’ lọ nínú àyíká ilé yìí.
- source_word: ἥξει
  choice: yóò dé
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídé ọ̀gá; ‘yóò dé’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: ní ọjọ́ tí kò retí rẹ̀
  rationale: Ó pa ìtumọ̀ àìretí dídé ọ̀gá mọ́; arọ́pò-orúkọ ‘rẹ̀’ ń tọ́ka sí ọ̀gá.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: ní wákàtí tí kò mọ̀
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ‘retí’ àti ‘mọ̀’ nínú àwọn gbólóhùn Gíríìkì méjèèjì mọ́.
- source_word: διχοτομήσει
  choice: yóò gé e sí méjì
  rationale: Ìtumọ̀ gangan ti ọ̀rọ̀-ìṣe náà ni láti gé sí méjì. Èyí pa àwòrán ìdájọ́ tó le koko mọ́ láìrọ̀ ọ́.
- source_word: τὸ μέρος αὐτοῦ
  choice: ìpín rẹ̀
  rationale: μέρος túmọ̀ sí ìpín tàbí ohun tí ó bá ẹni kan; ‘ìpín rẹ̀’ pa àwòrán ti àyànmọ́ tí a yàn fún un mọ́.
- source_word: ἀπίστων
  choice: àwọn aláìṣòótọ́
  rationale: Àyíká àkàwé náà dá lórí ẹrú tí kò ṣe olóòótọ́. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí àwọn aláìgbàgbọ́, a sì fi èyí sínú àlàyé ìsàlẹ̀.
- source_word: θήσει
  choice: yóò pín ìpín rẹ̀ pẹ̀lú
  rationale: Ní àkójọpọ̀ ọ̀rọ̀ yìí, τίθημι ń sọ nípa fífi ẹni sí ipò tàbí ìpín kan; gbólóhùn Yorùbá yìí sọ ìdájọ́ yẹn lọ́nà tó ṣe kedere.
theological_decisions:
- issue: Bóyá kí a túmọ̀ àwòrán ìjìyà náà ní tààràtà tàbí gẹ́gẹ́ bí ọ̀nà àsọyé fún ìjìyà líle
  choice: A pa àwòrán tààrà ‘yóò gé e sí méjì’ mọ́ nínú ẹsẹ̀ náà.
  alternative: ‘Yóò jẹ ẹ́ ní ìyà líle.’
  rationale: Èdè Gíríìkì lò àwòrán tó le koko; fífi í hàn ní tààràtà kò dín agbára ìkìlọ̀ náà kù. Àlàyé ìsàlẹ̀ sọ pé àwọn kan gbà pé ọ̀nà àsọyé ni.
- issue: Bóyá ἀπίστων túmọ̀ sí àwọn aláìṣòótọ́ tàbí àwọn aláìgbàgbọ́
  choice: A lo ‘àwọn aláìṣòótọ́’ nínú ẹsẹ̀ náà.
  alternative: ‘Àwọn aláìgbàgbọ́.’
  rationale: Ìṣòótọ́ ẹrú sí ọ̀gá rẹ̀ ni àyíká tó sún mọ́ jù, ṣùgbọ́n a pa ìtumọ̀ ‘aláìgbàgbọ́’ mọ́ nínú àlàyé ìsàlẹ̀ nítorí pé ọ̀rọ̀ Gíríìkì náà lè gbà á.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. ‘Ọ̀gá’ àti ‘ẹrú’ pa ipò àṣẹ inú àkàwé mọ́; àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu. A ṣètò àwọn àmì àlàyé lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
