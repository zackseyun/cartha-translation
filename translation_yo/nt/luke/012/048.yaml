id: LUK.12.48
reference: Luke 12:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí kò mọ̀[a], síbẹ̀ tí ó ṣe ohun tó yẹ fún lílù, a ó lù ú ní ìgbẹ́ díẹ̀. Ọ̀pọ̀ ni a ó béèrè lọ́wọ́ olúkúlùkù ẹni tí a fún ní ọ̀pọ̀; ẹni tí wọ́n sì fi ọ̀pọ̀ lé lọ́wọ́[b], ọ̀pọ̀ sí i ni wọ́n yóò béèrè lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, kò mọ ohun tí olúwa rẹ̀ fẹ́, gẹ́gẹ́ bí ọ̀rọ̀ tó ṣáájú ṣe fi hàn.
    reason: contextual_clarification
  - marker: b
    text: Tàbí, “ẹni tí wọ́n fi ọ̀pọ̀ sí ìtọ́jú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: ẹni tí kò mọ̀
  rationale: Ó mú àpólà alábápín orúkọ àti àìní ìmọ̀ jáde ní Yorùbá àdánidá, láì sọ pé ẹni náà mọ̀ọ́mọ̀ ṣe àìgbọ́ràn.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: tí ó ṣe ohun tó yẹ fún lílù
  rationale: Ó pa ìbáṣepọ̀ láàárín ohun tí a ṣe àti ìyà tí ó tọ́ sí mọ́, ó sì yẹra fún èdè àtijọ́.
- source_word: πληγῶν / δαρήσεται ὀλίγας
  choice: a ó lù ú ní ìlù díẹ̀
  rationale: Gíríìkì sọ lílù ní kedere; ìtumọ̀ yìí pa àwòrán ìjìyà ara àti ìwọ̀n kékeré rẹ̀ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: olúkúlùkù ẹni tí a fún ní ọ̀pọ̀
  rationale: Ó gbé òfin gbogbogbò nípa ojúṣe ẹni tí ó gba púpọ̀ kalẹ̀ lọ́nà Yorùbá àdánidá.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: Ọ̀pọ̀ ni a ó béèrè lọ́wọ́ ...
  rationale: ‘Béèrè lọ́wọ́’ lè túmọ̀ sí ohun tí a ń retí tàbí béèrè gẹ́gẹ́ bí ojúṣe; ó tún ṣe àfihàn παρά pẹ̀lú ẹ̀yà atọ́ka.
- source_word: παρέθεντο
  choice: wọ́n ... fi ọ̀pọ̀ lé lọ́wọ́
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ohun tàbí ojúṣe sí ìtọ́jú ẹnì kan.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: ọ̀pọ̀ sí i ni wọn yóò béèrè lọ́wọ́ rẹ̀
  rationale: Ó pa ìtumọ̀ ìbéèrè tó pọ̀ ju tẹ́lẹ̀ lọ mọ́, ó sì jẹ́ kí ẹni tí a ń béèrè lọ́wọ́ rẹ̀ hàn gbangba.
theological_decisions:
- issue: Irú àwòrán ìjìyà náà
  choice: Pa àwòrán lílù àti ìlù díẹ̀ mọ́ ní kedere.
  alternative: Lílo ọ̀rọ̀ gbogbogbò bí ‘ìjìyà,’ tàbí fífi irinṣẹ́ kan pàtó sí i bí pàṣán.
  rationale: Ẹsẹ̀ náà ń lo àwòrán òwe nípa ìjìyà tó ní ìwọ̀n gẹ́gẹ́ bí ìmọ̀ àti ojúṣe ṣe rí; kò yẹ kí a sọ ọ́ di àìṣedéédé tàbí fi ètò ìdájọ́ pàtó kan kún un.
- issue: Olùṣe nínú gbólóhùn ìkẹyìn
  choice: Pa ẹni-kẹta ọ̀pọ̀ aláìlórúkọ ‘wọ́n/wọn’ mọ́.
  alternative: Sísọ pé Ọlọ́run tàbí àwọn ènìyàn ni wọ́n fi ohun lé e lọ́wọ́ tí wọ́n sì béèrè lọ́wọ́ rẹ̀.
  rationale: Àwọn ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹni-kẹta ọ̀pọ̀ láìsọ olùṣe ní pàtó; yíyan olùṣe kan yóò túmọ̀ kọjá ohun tí ẹsẹ̀ náà sọ.
- issue: Ìbáṣepọ̀ ìmọ̀ àti ojúṣe
  choice: Ṣe àfihàn pé àìmọ̀ dín iye lílù kù, ṣùgbọ́n kò mú ojúṣe kúrò.
  alternative: Sísọ pé àìmọ̀ dá ẹni náà láre pátápátá, tàbí pé kò ní ipa kankan lórí ìwọ̀n ìjìyà.
  rationale: 'Ọ̀rọ̀ náà fúnra rẹ̀ pa ìfojúsùn méjèèjì mọ́: ẹni náà kò mọ̀, síbẹ̀ ohun tí ó ṣe yẹ fún lílù díẹ̀.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye. ‘Fi ... lé lọ́wọ́’ àti ‘béèrè lọ́wọ́’ jẹ́ àṣà-ọrọ Yorùbá àdánidá fún ìgbẹ́kẹ̀lé àti jíjíyìn.
