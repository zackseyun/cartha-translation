  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní ìlànà rẹ̀: ẹni tí kò mọ̀ ṣùgbọ́n tó ṣe ohun tó yẹ fún ìgbẹ́ yóò gba ìgbẹ́ díẹ̀; a ó béèrè púpọ̀ lọ́wọ́ ẹni tí a fún ní púpọ̀; ẹni tí a fi púpọ̀ lé lọ́wọ́ yóò ní ohun tó pọ̀ sí i tí a béèrè lọ́wọ́ rẹ̀. Ṣùgbọ́n ‘ìlù díẹ̀’ kò lè jẹ́ ‘few blows,’ nítorí ìlù sábà túmọ̀ sí ìlú tàbí ohun èlò orin.'
  naturalness: Àwọn ìkọ̀wé ‘fi ... lé lọ́wọ́’ àti ‘béèrè lọ́wọ́’ jẹ́ Yorùbá àdánidá. ‘A ó lù ú ní ìgbẹ́ díẹ̀’ jẹ́ kedere, ó sì pa àwòrán ìgbẹ́/ìlùmọ̀ọ́kà ara mọ́. A tún yẹ kí aṣojú ẹni-kẹta ọ̀pọ̀ jẹ́ ‘wọ́n,’ kì í ṣe ‘wọn,’ níbi tí ó ti jẹ́ kókó ọ̀rọ̀-ìṣe.
