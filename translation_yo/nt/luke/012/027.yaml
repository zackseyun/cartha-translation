id: LUK.12.27
reference: Luke 12:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: yo
  text: 'Ẹ kíyè sí àwọn òdòdó lílì[a], bí wọ́n ti ń dàgbà: wọn kì í ṣiṣẹ́ kára, wọn kì í sì í yí òwú. Síbẹ̀, mo sọ fún yín pé, kódà Solomoni, nínú gbogbo ògo rẹ̀[b], kò tilẹ̀ wọ aṣọ bí ọ̀kan nínú àwọn wọ̀nyí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn òdòdó igbó’ tàbí ‘àwọn òdòdó’; ọ̀rọ̀ Gíríìkì náà sọ ‘àwọn òdòdó lílì’ ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘nínú gbogbo ọlá ńlá rẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Ẹ kíyè sí
  rationale: Ó fi àṣẹ láti wo ohun kan pẹ̀lú àfiyèsí àti láti ronú nípa rẹ̀ hàn, kì í ṣe wíwo lásán.
- source_word: τὰ κρίνα
  choice: àwọn òdòdó lílì
  rationale: κρίνα tọ́ka ní pàtó sí àwọn òdòdó lílì; a pa ìtumọ̀ pàtó yìí mọ́ dípò lílo ‘òdòdó’ lásán.
- source_word: πῶς αὐξάνει
  choice: bí wọ́n ti ń dàgbà
  rationale: Yorùbá nílò ìbámu ọ̀pọ̀ nínú ọ̀rọ̀ arọ́pò-orúkọ; ‘bí’ sì pa ìfojúsùn sí ọ̀nà tí wọ́n fi ń dàgbà mọ́.
- source_word: οὐ κοπιᾷ
  choice: wọn kì í ṣiṣẹ́ kára
  rationale: κοπιάω túmọ̀ sí ṣíṣiṣẹ́ tàbí làálàá gidigidi; gbolohun yìí jẹ́ èdè Yorùbá àdánidá fún un.
- source_word: οὐδὲ νήθει
  choice: wọn kì í sì í rán òwú
  rationale: νήθω ni yíyan okùn láti inú ohun bí òwú; ‘rán òwú’ dá iṣẹ́ náà mọ̀ kúrò nínú híhun tàbí rírán aṣọ.
- source_word: λέγω δὲ ὑμῖν
  choice: Síbẹ̀, mo sọ fún yín pé
  rationale: ‘Síbẹ̀’ fi ìyípadà àti ìtakora kékeré tí δέ ní nínú ọ̀rọ̀ náà hàn.
- source_word: οὐδὲ Σολομὼν
  choice: Solomoni pàápàá
  rationale: '‘Pàápàá’ mú ìtẹnumọ́ οὐδέ jáde: kódà ọba olókìkí yìí kò tó àwọn òdòdó náà ní ìfiwéra.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: nínú gbogbo ògo rẹ̀
  rationale: ‘Ògo’ lè tọ́ka sí ọlá àti ọ̀ṣọ́ ọba ní àyíká yìí, ó sì pa ìgbòòrò ìtumọ̀ δόξα mọ́.
- source_word: περιεβάλετο
  choice: kò wọṣọ
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán wíwọ aṣọ; ‘wọṣọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé láì pinnu ẹni tó wọ aṣọ náà fún un.
- source_word: ὡς ἓν τούτων
  choice: bí ọ̀kan nínú àwọn wọ̀nyí
  rationale: Ó pa ìfiwéra tààrà mọ́, ‘àwọn wọ̀nyí’ sì tọ́ka padà sí àwọn òdòdó lílì.
theological_decisions:
- issue: Ohun tí àwòrán òdòdó náà ń tọ́ka sí
  choice: A pa ‘àwọn òdòdó lílì’ mọ́.
  alternative: àwọn òdòdó; àwọn òdòdó igbó
  rationale: Gíríìkì κρίνα jẹ́ ọ̀rọ̀ pàtó ju ‘òdòdó’ lọ; kò sí ìdí ẹ̀kọ́ ìgbàgbọ́ láti mú un gbòòrò sí i.
- issue: Ìtumọ̀ δόξα nínú àpèjúwe Solomoni
  choice: ògo
  alternative: ọlá ńlá; ọ̀ṣọ́ ológo
  rationale: ‘Ògo’ jẹ́ èdè tó yé ni àyíká yìí, ó sì pa ìbáṣepọ̀ pẹ̀lú ìtumọ̀ gbòòrò ti δόξα mọ́ láì sọ ọ́ di ọ̀ṣọ́ nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. A gbé àmì àlàyé [b] sí lẹ́yìn ‘ògo rẹ̀,’ nítorí ibẹ̀ ni àṣàyàn ọ̀rọ̀ inú àlàyé náà ti jẹ mọ́.
