id: LUK.12.40
reference: Luke 12:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: yo
  text: Ẹ̀yin náà gbọdọ̀ múra sílẹ̀,[a] nítorí Ọmọ Ènìyàn[c] ń bọ̀ ní wákàtí tí ẹ kò retí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Ẹ̀yin náà, ẹ múra sílẹ̀.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní wákàtí tí ẹ kò rò’ tàbí ‘nígbà tí ẹ kò fojú sọ́nà fún un.’
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, ‘Ọmọ Ènìyàn’; akọ́lé tí Jésù máa ń lò fún ara rẹ̀, ó sì ṣeé ṣe kí ó ń tọ́ka sí Dáníẹ́lì 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: 'Ó fi ìfọkànsìn àti ìkópa àwọn olùgbọ́ hàn: àwọn náà, gẹ́gẹ́ bí àwọn ìránṣẹ́ inú àkàwé tó ṣáájú, gbọ́dọ̀ wà ní ìmúrasílẹ̀.'
- source_word: γίνεσθε ἕτοιμοι
  choice: gbọdọ̀ múra sílẹ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe wọ́n sí ipò ìmúrasílẹ̀ tí ó ń bá a lọ. ‘Gbọdọ̀ múra sílẹ̀’ jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára àti ìkánjú àṣẹ náà mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó mú ìdí fún àṣẹ náà wọlé ní kedere.
- source_word: ᾗ ὥρᾳ
  choice: ní wákàtí tí
  rationale: Gbólóhùn dative relative náà tọ́ka sí àkókò; ìtumọ̀ yìí pa àwòrán ‘wákàtí’ inú Gíríìkì mọ́ láì sọ pé àkókò pàtó kan ni wọ́n mọ̀.
- source_word: οὐ δοκεῖτε
  choice: ẹ kò retí
  rationale: Nínú ìkìlọ̀ yìí, δοκέω ní agbára ìrètí tàbí ìfojúsọ́nà; ‘ẹ kò retí’ jẹ́ èdè Yorùbá tó ṣe kedere jù ‘ẹ kò rò’ lọ nínú àyíká yìí.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa ìrísí akọ́lé náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7:13–14 mọ́, láì sọ ọ́ di ọ̀rọ̀ gbogbogbò nípa ènìyàn.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Ó ṣàfihàn present tense Gíríìkì pẹ̀lú ìtumọ̀ ọjọ́ iwájú, ó sì pa ìmọ̀lára pé ìbọ̀ náà sún mọ́lé àti agbára ìkìlọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ akọ́lé Kristi, ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ ni ìtumọ̀ tààrà àti akọ́lé tí a mọ̀ dáadáa; ó pa ìró Dáníẹ́lì àti agbára Mèsáyà/apokaliptiki rẹ̀ mọ́ láì fi ẹ̀kọ́ ẹ̀sìn àfikún sínú ẹsẹ̀ náà.
- issue: Agbára àkókò ἔρχεται nínú ọ̀rọ̀ nípa ìbọ̀ ọjọ́ iwájú
  choice: ń bọ̀
  alternative: yóò wá
  rationale: Present Gíríìkì lè ní ìtọ́ka sí ọjọ́ iwájú. ‘Ń bọ̀’ pa ìmúra-ẹni-sílẹ̀ àti ìkìlọ̀ tó lágbára mọ́, láì pinnu ètò ẹ̀kọ́ nípa ìgbà ìkẹyìn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. A lo ‘ẹ̀yin/ẹ’ fún plural ὑμεῖς, ‘múra sílẹ̀’ fún ìmúrasílẹ̀ tó ń bá a lọ, àti ‘ń bọ̀’ láti pa ìwà present tense Gíríìkì mọ́. Àwọn àmì ohùn ni a fi sí ibi tó yẹ.
