id: LUK.12.37
reference: Luke 12:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: yo
  text: Alábùkún ni àwọn ẹrú wọ̀nyẹn tí Olúwa[a], nígbà tí ó bá dé, bá rí pé wọ́n ń ṣọ́nà. Lóòótọ́ ni mo sọ fún yín pé, yóò di aṣọ rẹ̀ mọ́ra láti ṣe iṣẹ́[b], yóò sì mú wọn jókòó síbi tábìlì láti jẹun; yóò sì wá sìn wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá”; ọ̀rọ̀ Gíríìkì náà, kyrios, lè túmọ̀ sí méjèèjì nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “yóò di ara rẹ̀ ní àmùrè.” Èyí túmọ̀ sí pé yóò di aṣọ rẹ̀ mọ́ra kí ó lè múra sí iṣẹ́.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Aláyọ̀ ni
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ ní Yorùbá láti sọ ipò rere ẹni tí Ọlọ́run ṣe ojúrere sí; kò fi ìtumọ̀ rẹ̀ mọ́ ìmọ̀lára ayọ̀ lásán.
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: Nínú àkàwé ilé yìí, ìbáṣepọ̀ ẹni tí ó ní àwọn ẹrú sí àwọn ẹrú rẹ̀ hàn gbangba; “ẹrú” fi ipò ìdè náà hàn ju “ìránṣẹ́” lọ.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ ẹni tó jẹ́ olórí ilé mọ́, ó sì tún jẹ́ kí ìró orúkọ oyè náà dúró láìfi dandan pinnu pé “ọ̀gá” nìkan ni.
- source_word: γρηγοροῦντας
  choice: ń ṣọ́nà
  rationale: Ó sọ jíjí lójú oorun àti wíwà ní ìmúrasílẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ó pa ìtẹnumọ́ àgbékalẹ̀ Gíríìkì mọ́ ní èdè Yorùbá tó jẹ́ ti òde òní.
- source_word: περιζώσεται
  choice: yóò di aṣọ mọ́ ẹ̀gbẹ́ rẹ̀ láti ṣe iṣẹ́
  rationale: Ó pa àwòrán ìṣe ìgbàanì ti dídì aṣọ mọ́ra mọ́, ó sì ṣàlàyé ète rẹ̀ gẹ́gẹ́ bí ìmúrasílẹ̀ fún iṣẹ́.
- source_word: ἀνακλινεῖ αὐτούς
  choice: yóò mú wọn jókòó láti jẹun
  rationale: Ìṣe náà tọ́ka sí gbígbé ènìyàn síbi àsè láti jẹun; “jókòó” jẹ́ àdánidá ju fífi ìlànà ìgbọ̀nsẹ̀ ìgbàanì pé kí wọ́n rọgbọkú lọ.
- source_word: παρελθὼν
  choice: yóò sì wá
  rationale: Ó fi ìṣísẹ̀ Olúwa tọ àwọn tí yóò ṣe ìránṣẹ́ fún hàn láìfi ìtumọ̀ tí kò dájú kún un.
- source_word: διακονήσει αὐτοῖς
  choice: ṣe ìránṣẹ́ fún wọn
  rationale: Ó mú iṣẹ́ títọ́jú wọn níbi oúnjẹ hàn, kò sì sọ ọ́ di ọ̀rọ̀ iṣẹ́ ìjọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé ilé tí ó tún lè ní ìró nípa Kristi
  choice: Olúwa
  alternative: ọ̀gá
  rationale: 'Àyíká àkàwé lè gba “ọ̀gá,” ṣùgbọ́n “Olúwa” pa ìfọ̀rọ̀wérọ̀ méjèèjì mọ́: ẹni tó jẹ́ olórí ilé àti ìró oyè Olúwa, láìfipá yan ọ̀kan ṣoṣo.'
- issue: Ìtumọ̀ δοῦλος nínú ìbáṣepọ̀ ilé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ipò ẹni tí ó wà lábẹ́ àṣẹ olówó rẹ̀ jẹ́ apá pàtàkì àwòrán náà; “ẹrú” fi èyí hàn ní tààrà, nígbà tí “ìránṣẹ́” lè dín agbára ìbáṣepọ̀ náà kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹrú” láti fi ìbáṣepọ̀ ilé inú àkàwé hàn, “ń ṣọ́nà” fún jíjí àti ìmúrasílẹ̀, a sì tú àṣà dídì aṣọ mọ́ra sí ọ̀nà tí òǹkàwé Yorùbá lè lóye. Àwọn àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
