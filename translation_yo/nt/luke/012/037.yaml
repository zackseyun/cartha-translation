- from: Aláyọ̀ ni àwọn ẹrú wọ̀nyẹn tí Olúwa[a] yóò bá tí wọ́n ń ṣọ́nà nígbà tí ó bá dé. Lóòótọ́ ni mo sọ fún yín pé, òun yóò di aṣọ mọ́ ẹ̀gbẹ́ rẹ̀ láti ṣe iṣẹ́[b], yóò sì mú wọn jókòó láti jẹun, yóò sì wá ṣe ìránṣẹ́ fún wọn.
  to: Alábùkún ni àwọn ẹrú wọ̀nyẹn tí Olúwa[a], nígbà tí ó bá dé, bá rí pé wọ́n ń ṣọ́nà. Lóòótọ́ ni mo sọ fún yín pé, yóò di aṣọ rẹ̀ mọ́ra láti ṣe iṣẹ́[b], yóò sì mú wọn jókòó síbi tábìlì láti jẹun; yóò sì wá sìn wọ́n.
  rationale: A tún gbolóhùn àkọ́kọ́ kọ́ kí ó lè ṣàfihàn ìbáṣepọ̀ “àwọn ẹrú tí Olúwa bá rí” nínú Gíríìkì náà ní Yorùbá tó péye. A yí “Aláyọ̀” sí “Alábùkún” fún ìbámu tó sún mọ́ μακάριοι, a sì mú àyíká tábìlì/àsè hàn kedere. Àwọn àlàyé ìsàlẹ̀ àti àmì wọn wà ní ipò tó bá ọ̀rọ̀ wọn mu.
