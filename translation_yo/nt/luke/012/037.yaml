  naturalness: 'Àtúnṣe náà lo Yorùbá boṣewa, tó rọrùn: “nígbà tí ó bá dé, bá rí pé wọ́n ń ṣọ́nà.” “Mú wọn jókòó síbi tábìlì” jẹ́ ọ̀nà àdánidá láti ṣàfihàn fífi wọn síbi àsè; ó mọ̀ pé ìṣe ìgbàanì jẹ́ rírògbọkú nígbà jíjẹun. “Sìn wọ́n” jẹ́ ìtumọ̀ kedere fún διακονήσει nínú àyíká àsè.'
