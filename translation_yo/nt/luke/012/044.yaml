  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Lóòótọ́ ni” ń mú ìtẹnumọ́ ἀληθῶς wá; “mo sọ fún yín” ń pa λέγω ὑμῖν mọ́; “yóò fi í ṣe olórí” ń ṣàfihàn καταστήσει ἐπὶ gẹ́gẹ́ bí fífi ẹni sí ipò àbójútó; “gbogbo ohun tí ó ní” sì ń gbé πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ kalẹ̀ láì dín ìwọ̀n rẹ̀ kù. Àwọn arọ́pò-orúkọ kò ṣàfikún ìtumọ̀ tí kò sí nínú ọ̀rọ̀ ìpilẹ̀.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tí ó rọrùn, tí àmì ohùn rẹ̀ péye, tí ó sì yẹ fún ọ̀nà ìsọ̀rọ̀ tó ní àṣẹ nínú àsọyé náà. “Fi í ṣe olórí” jẹ́ ọ̀nà ìsọ̀rọ̀ tó dára fún yíyan ẹni sí ipò àṣẹ nínú àyíká àkàwé yìí.
  terminology: “Olórí” pẹ̀lú “fi í ṣe” ṣàfihàn ìgbékalẹ̀ ẹni sí ipò ìṣàkóso/àbójútó, kì í ṣe ìní lásán. “Gbogbo ohun tí ó ní” ń pa ìtumọ̀ gbòòrò “ohun ìní” mọ́, àti àlàyé ìsàlẹ̀ ń fúnni ní àwọn àṣàyàn tó bá a mu.
