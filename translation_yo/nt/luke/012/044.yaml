id: LUK.12.44
reference: Luke 12:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: yo
  text: Lóòótọ́ ni mo sọ fún yín pé, yóò fi í ṣe olórí gbogbo ohun tí ó ní[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun ìní rẹ̀,” tàbí “gbogbo dúkìá rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Lóòótọ́ ni
  rationale: Ó tẹnumọ́ òtítọ́ àti ìdánilójú ọ̀rọ̀ náà, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa àdírẹ́sì tààrà sí ọ̀pọ̀ ènìyàn mọ́, ó sì jẹ́ ọ̀nà ìsọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ àkóónú ohun tí a sọ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀ Yorùbá tó bójú mu.
- source_word: ἐπὶ
  choice: olórí
  rationale: Pẹ̀lú καταστήσει, ó fi àṣẹ àti ojúṣe lórí ohun kan hàn; ‘fi í ṣe olórí’ jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: gbogbo ohun tí ó ní
  rationale: Ó pa ìtúmọ̀ gbòòrò ti gbogbo ohun tó jẹ́ tirẹ̀ mọ́ láì fi àlàyé kún un pé ohun ìní ilẹ̀ tàbí dúkìá nìkan ni.
- source_word: καταστήσει
  choice: yóò fi í ṣe
  rationale: Nínú àyíká yìí, ó túmọ̀ sí yíyan tàbí fífi ẹnì kan sí ipò àṣẹ; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: αὐτόν
  choice: í
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ìránṣẹ́ ọkùnrin inú àkàwé; ‘í’ pa ẹni kan ṣoṣo mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ.
theological_decisions:
- issue: Arọ́pò-orúkọ akọ nínú àkàwé
  choice: Lo arọ́pò-orúkọ Yorùbá ‘ó/í’ tó tọ́ka sí ẹni kan ṣoṣo
  alternative: Ṣàfikún ‘ọkùnrin náà’ láti fi akọ hàn ní gbangba
  rationale: Gíríìkì tọ́ka sí akọ kan ṣoṣo, ṣùgbọ́n Yorùbá kò ní arọ́pò-orúkọ ẹni-kẹta tó yà akọ sí ọ̀tọ̀. Àfikún ‘ọkùnrin’ yóò jẹ́ ìtumọ̀ ju ohun tí gbólóhùn yìí sọ lọ; àyíká àkàwé ló ń mú ẹni tí a tọ́ka sí ṣe kedere.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A lo ‘fi í ṣe olórí’ láti sọ ìyàn sí ipò àṣẹ ní kedere.
