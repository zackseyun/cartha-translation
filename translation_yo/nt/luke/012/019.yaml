language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: yo
  text: Èmi yóò sì wí fún ọkàn mi[a] pé, ‘Ọkàn mi, o ní ohun rere púpọ̀ tí a kó pamọ́ sílẹ̀ fún ọ̀pọ̀ ọdún. Sinmi, jẹun, mu, sì máa yọ̀[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ara mi” tàbí “ẹ̀mí ayé mi.” Ọ̀rọ̀ Gíríìkì ψυχή lè ní ọ̀kan lára àwọn ìtumọ̀ wọ̀nyí gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí inú rẹ dùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: Èmi yóò sì sọ
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe ọjọ́ iwájú; fífi ‘Èmi’ sí iwájú jẹ́ kí ìpinnu ọkùnrin náà hàn kedere, ‘sì’ sì so ọ̀rọ̀ yìí mọ́ ète rẹ̀ nínú àpẹẹrẹ náà.
- source_word: ψυχῇ / Ψυχή
  choice: ọkàn mi / Ọkàn mi
  rationale: Nínú ọ̀rọ̀ yìí, ọkùnrin náà ń bá ara inú rẹ̀ sọ̀rọ̀. ‘Ọkàn mi’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún irú ọ̀rọ̀ sí ara ẹni bẹ́ẹ̀, láìsọ ψυχή di ẹ̀kọ́ pàtó nípa ìdá ènìyàn.
- source_word: πολλὰ ἀγαθὰ
  choice: ọ̀pọ̀lọpọ̀ ohun rere
  rationale: Ó pa ìtumọ̀ gbòòrò ἀγαθὰ mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó ń tọ́ka sí ohun ìní àti ọ̀pọ̀ èso tí ó kó pamọ́.
- source_word: κείμενα
  choice: tí a tò jọ
  rationale: Nínú àyíká yìí, participle κεῖμαι ń sọ nípa àwọn ohun tí ó ti wà ní ìpamọ́. ‘Tò jọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a ti kó pamọ́ sílẹ̀.
- source_word: εἰς ἔτη πολλά
  choice: fún ọ̀pọ̀ ọdún
  rationale: Ó fi iye àkókò ọjọ́ iwájú tí ọkùnrin náà ń fojú inú wò hàn ní ṣókí, ó sì tẹ̀ lé Gíríìkì pẹ́kípẹ́kí.
- source_word: ἀναπαύου
  choice: Sinmi
  rationale: Àṣẹ náà pè é sí ìsinmi àti àìníyàn; ‘Sinmi’ ṣe é sọ ní tààràtà àti ní èdè òde òní.
- source_word: φάγε
  choice: jẹun
  rationale: Àṣẹ tààràtà ni; ‘jẹun’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá ju ‘jẹ’ lọ nígbà tí ohun tí a ó jẹ kò jẹ́ orúkọ.
- source_word: πίε
  choice: mu
  rationale: Ó túmọ̀ àṣẹ Gíríìkì náà ní tààràtà láìfi ohun mímu kan pàtó kún un.
- source_word: εὐφραίνου
  choice: kí inú rẹ sì dùn
  rationale: Ó mú èrò ayọ̀ àti gbígbádùn ara ẹni inú εὐφραίνου jáde ní Yorùbá tó rọrùn, láìfi ìtumọ̀ ẹ̀sìn rere tí ‘máa yọ̀’ lè ní sí i.
theological_decisions:
- issue: Ìtumọ̀ ψυχή níbi tí ọkùnrin náà ti ń bá ara rẹ̀ sọ̀rọ̀
  choice: ọkàn mi
  alternative: ara mi; ẹ̀mí ayé mi
  rationale: Ẹsẹ̀ náà kò pọn dandan pé ó ń kọ́ni ní ẹ̀kọ́ ìpín ara àti ẹ̀mí ènìyàn; ó ń fi ọkùnrin kan hàn tí ó ń bá ara inú rẹ̀ sọ̀rọ̀. ‘Ọkàn mi’ pa àwòrán ìwé àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Agbára àṣẹ inú εὐφραίνου
  choice: kí inú rẹ sì dùn
  alternative: máa yọ̀; ṣe fàájì
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ayọ̀ àti ìgbádùn mọ́, bó tilẹ̀ jẹ́ pé ó lo àkójọpọ̀ ‘kí’ tí ó jẹ́ àdánidá ní Yorùbá dípò àṣẹ oníṣọ̀kan gangan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àtúnṣe ọ̀rọ̀ ‘ọ̀pọ̀lọpọ̀ … ọ̀pọ̀ ọdún’ mọ ìtẹnumọ́ méjèèjì nínú Gíríìkì, àwọn àṣẹ tó kúkúrú sì pa ìró ìgbẹ́kẹ̀lé ara ẹni inú àpẹẹrẹ náà mọ́.
