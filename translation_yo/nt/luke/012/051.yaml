id: LUK.12.51
reference: Luke 12:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: yo
  text: Ṣé ẹ rò pé mo wá láti fún ayé ní àlàáfíà? Rárá, mo sọ fún yín, bí kò ṣe ìpínya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: Ṣé ẹ̀yin rò pé
  rationale: Ó gbé ìbéèrè àtakò tí a darí sí ọ̀pọ̀ olùgbọ́ jáde ní Yorùbá àdánidá, ó sì pa ìpèníjà tààrà mọ́.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àlàáfíà àti ìbágbépọ̀ láì fi ìtumọ̀ náà mọ́ ìbàlẹ̀ ọkàn nìkan.
- source_word: παρεγενόμην δοῦναι
  choice: mo wá láti mú ... wá
  rationale: Ìsọ̀rọ̀ Yorùbá àdánidá fún wíwá pẹ̀lú ète; àtúnsọ ‘mú ... wá’ tú δοῦναι ní ọ̀nà tó yege ju ‘fún ayé ní àlàáfíà’ lọ.
- source_word: ἐν τῇ γῇ
  choice: sí ayé
  rationale: γῆ níbí ní ìwọ̀n gbòòrò, ‘ayé’ sì yẹ ju ‘ilẹ̀’ tó lè dín un kù sí agbègbè kan lọ.
- source_word: οὐχί
  choice: Rárá
  rationale: Ìdáhùn òdì tó lágbára, kedere, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa ọ̀rọ̀ tààrà sí ọ̀pọ̀ olùgbọ́ mọ́ ní èdè Yorùbá tó ṣe déédéé.
- source_word: ἀλλ’ ἢ
  choice: bí kò ṣe
  rationale: 'Ó fi ìyàtọ̀ líle hàn lẹ́yìn ìkọ̀sílẹ̀: kì í ṣe àlàáfíà, bí kò ṣe ìpínya.'
- source_word: διαμερισμόν
  choice: ìpínya
  rationale: Ó tú ìyapa tàbí pínyà láàárín àwọn ènìyàn ní tààrà, gẹ́gẹ́ bí àyíká ẹsẹ 52–53 ṣe fi hàn.
theological_decisions:
- issue: Bóyá kí a rọ ìtakò láàárín àlàáfíà àti ìpínya kí ó má bàa dà bí ẹni pé ó ta ko àwọn ẹsẹ míì nípa àlàáfíà
  choice: 'A pa ìtakò líle náà mọ́: kì í ṣe àlàáfíà, bí kò ṣe ìpínya.'
  alternative: Kí a túmọ̀ rẹ̀ ní ìtumọ̀ àlàyé bí ‘ìjà’ tàbí kí a fi hàn pé àbájáde àìròtẹ́lẹ̀ nìkan ni.
  rationale: Gíríìkì náà mọ̀ọ́mọ̀ lágbára. Àyíká sọ nípa bí iṣẹ́ Jesu ṣe máa ń pín àwọn ènìyàn, pàápàá nínú ìdílé; kò yẹ kí ìtumọ̀ yanjú tàbí rọ ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fúnra rẹ̀ pa mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún. Ìforúkọ ‘ẹ̀yin’ jẹ́ kí ọ̀pọ̀ ènìyàn inú δοκεῖτε àti ὑμῖν hàn kedere. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
