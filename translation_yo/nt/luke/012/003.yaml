id: LUK.12.3
reference: Luke 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: yo
  text: Nítorí náà, gbogbo ohun tí ẹ sọ nínú òkùnkùn ni a ó gbọ́ nínú ìmọ́lẹ̀; ohun tí ẹ sì sọ sí etí ní àwọn yàrá inú ni a ó kéde lórí àwọn òrùlé ilé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti orí àwọn òrùlé.” Àwòrán náà jẹ́ ti kíkéde ọ̀rọ̀ ní gbangba láti orí òrùlé pẹlẹbẹ àwọn ilé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Nítorí náà
  rationale: Àpólà yìí ń fi ìyọrísí ọ̀rọ̀ ẹsẹ tó ṣáájú hàn. “Nítorí náà” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìtumọ̀ ìfèròyìn yìí.
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ó mú ìtumọ̀ aláìlópin náà jáde, pé kò sí ohun tí a sọ ní ìkọ̀kọ̀ tí a yọ sílẹ̀.
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: nínú òkùnkùn … nínú ìmọ́lẹ̀
  rationale: A pa àwòrán àti ìtakora tó wà láàárín òkùnkùn àti ìmọ́lẹ̀ mọ́, kí ó lè tọ́ka sí ìkọ̀kọ̀ àti ìfihàn láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἀκουσθήσεται
  choice: ni a ó gbọ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ọ̀rọ̀ aṣebí tí ó ń bọ̀, láìsọ ẹni tí yóò mú un ṣẹ.
- source_word: πρὸς τὸ οὖς
  choice: sọ sí etí
  rationale: A pa àwòrán gíríìkì ti sísọ ọ̀rọ̀ sí etí mọ́; ó ń fi ọ̀rọ̀ àṣírí tàbí ọ̀rọ̀ kẹ́lẹ́kẹ́lẹ́ hàn láìfi ọ̀rọ̀ àlàyé kún ẹsẹ náà.
- source_word: ἐν τοῖς ταμείοις
  choice: ní àwọn yàrá inú
  rationale: ταμεῖον lè jẹ́ yàrá inú, yàrá ìpamọ́, tàbí yàrá àdáni. “Àwọn yàrá inú” pa ìtumọ̀ ibi tó fara sin mọ́ láìdín un kù sí ilé ìpamọ́ nìkan.
- source_word: κηρυχθήσεται
  choice: ni a ó kéde
  rationale: “Kéde” sọ ìpolongo ní gbangba, ó sì yẹ ju ọ̀rọ̀ tí yóò túmọ̀ sí ìwàásù ẹ̀sìn nìkan lọ ní àyíká yìí.
- source_word: ἐπὶ τῶν δωμάτων
  choice: lórí àwọn òrùlé ilé
  rationale: Èyí tẹ̀ lé àwòrán àwọn òrùlé pẹlẹbẹ tí a ti lè kéde ọ̀rọ̀ fún gbogbo ènìyàn láti gbọ́.
theological_decisions:
- issue: Ìtumọ̀ àwòrán bí ohun ìkọ̀kọ̀ yóò ṣe di mímọ̀ ní gbangba
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìkìlọ̀ pé ohun tí a fi pamọ́ tàbí tí a sọ ní ìkọ̀kọ̀ yóò di mímọ̀ ní gbangba, láìsọ àsìkò tàbí ọ̀nà tí èyí yóò gbà ṣẹlẹ̀.
  alternative: Kí a sọ ọ́ ní pàtó pé ó ń tọ́ka sí ìdájọ́ ìkẹyìn, tàbí sí bí àgàbàgebè ṣe máa ń tú síta nínú ìtàn ayé.
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa àgàbàgebè tí a ó tú síta, ṣùgbọ́n ẹsẹ náà fúnra rẹ̀ kò fi àsìkò tàbí ọ̀nà ìfihàn náà sí ibi kan ṣoṣo. Ìtumọ̀ náà pa àìdánilójú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ. Àwọn gbolohun méjèèjì pa ìfiwéra òkùnkùn/ìmọ́lẹ̀ àti yàrá inú/òrùlé mọ́.
