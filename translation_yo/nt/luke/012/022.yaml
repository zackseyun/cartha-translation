  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì SBLGNT dáadáa: ó pa ẹni tí ó ń sọ̀rọ̀, àwọn ọmọ-ẹ̀yìn rẹ̀, ìsopọ̀ ìdí Διὰ τοῦτο, ìkìlọ̀ lòdì sí μεριμνᾶτε, àti ìfararora ìyè/oúnjẹ pẹ̀lú ara/aṣọ mọ́. A tún ṣètò apá kejì gẹ́gẹ́ bí ìdálẹ́kọ̀ọ́ mìíràn lábẹ́ ìkìlọ̀ kan náà, kí μηδέ má bàa dà bí yíyan ‘tàbí’ lásán.'
