id: LUK.12.22
reference: Luke 12:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: yo
  text: 'Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Nítorí èyí, mo sọ fún yín: ẹ má ṣe ṣàníyàn[a] nípa ìyè yín[b], nípa ohun tí ẹ ó jẹ; bẹ́ẹ̀ ni ẹ má ṣe ṣàníyàn nípa ara yín, nípa ohun tí ẹ ó wọ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe dààmú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ọkàn yín.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “ìyè” ní ọ̀nà ìwàláàyè ènìyàn lórí ayé, gẹ́gẹ́ bí ó ti rí níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Ó sì sọ
  rationale: “Sì” jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó bá δέ mu, ó sì ń mú ìtàn náà tẹ̀ síwájú láìfi ìyàtọ̀ líle kún un.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún μαθηταί, “rẹ̀” sì pa αὐτοῦ mọ́.
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó tọ́ka sí ẹ̀kọ́ tó ṣáájú, ó sì pa agbára ìdí tàbí àbájáde inú gbólóhùn Gíríìkì mọ́.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá adayeba fún ìsọ̀rọ̀ tààrà sí ọ̀pọ̀ ènìyàn.
- source_word: μὴ μεριμνᾶτε
  choice: ẹ má ṣe ṣàníyàn
  rationale: μεριμνάω níbí ń tọ́ka sí àníyàn tàbí ìdààmú ọkàn nípa ohun tí a nílò; “ṣàníyàn” ṣe kedere, ó sì yẹ fún ọ̀rọ̀ ọlọ́lá tó ṣeé lóye.
- source_word: τῇ ψυχῇ
  choice: nípa ìyè yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, ψυχή ń tọ́ka sí ìyè ènìyàn ní ayé, pàápàá bí ó ṣe ní í ṣe pẹ̀lú oúnjẹ, kì í ṣe dandan sí ọkàn aláìlẹ́ran gẹ́gẹ́ bí ẹ̀ka ẹ̀kọ́ ìgbàgbọ́.
- source_word: τί φάγητε
  choice: ohun tí ẹ ó jẹ
  rationale: Ó sọ ìbéèrè tí a rò nínú ọkàn nípa ọjọ́ iwájú ní Yorùbá adayeba.
- source_word: μηδὲ τῷ σώματι
  choice: tàbí nípa ara yín
  rationale: “Tàbí” wà lábẹ́ ìkọ̀nà “ẹ má ṣe,” ó sì so apá kejì mọ́ àkọ́kọ́ bí μηδέ ṣe ń ṣe.
- source_word: τί ἐνδύσησθε
  choice: ohun tí ẹ ó wọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayeba fún wíwọ aṣọ, ó sì bá ìṣètò “ohun tí ẹ ó jẹ” dọ́gba.
theological_decisions:
- issue: Ìtumọ̀ ψυχή ní àyíká ọ̀rọ̀ yìí
  choice: ìyè
  alternative: ọkàn tàbí ẹ̀mí
  rationale: Ìfiwéra oúnjẹ fún ψυχή pẹ̀lú aṣọ fún σώμα fi hàn pé ìyè ènìyàn ní ayé ni ọ̀rọ̀ náà ń tọ́ka sí níbí. Yíyan “ìyè” kò fi ìtumọ̀ oníṣọ̀kan ara àti ọkàn tí ẹsẹ̀ náà kò béèrè lé e lórí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn míì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tó ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà péye ni a fi sí i. A pa ìbáṣepọ̀ tó wà láàárín oúnjẹ/ìyè àti aṣọ/ara mọ́, láìjẹ́ kí èdè di líle tàbí àjèjì.
