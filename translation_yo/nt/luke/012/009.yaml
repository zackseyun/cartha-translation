source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó bá sẹ́ mi níwájú àwọn ènìyàn[a], a ó sẹ́ ẹni náà níwájú àwọn áńgẹ́lì Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘àwọn ẹ̀dá ènìyàn’; Gíríìkì fi àwọn ènìyàn wé àwọn áńgẹ́lì Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè túmọ̀ ọ́ sí ‘a ó kọ ẹni náà sílẹ̀.’ Ọ̀rọ̀ Gíríìkì níbí jọ ọ̀rọ̀ tí a túmọ̀ sí ‘sẹ́,’ ṣùgbọ́n ó lè ní ìtumọ̀ tó lágbára sí i. Ìtumọ̀ inú ẹsẹ̀ náà pa ìfararora náà mọ́: ‘sẹ́ … a ó sẹ́.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνησάμενός
  choice: ẹni tí ó bá sẹ́
  rationale: Àpólà alábápín ọ̀rọ̀-ìṣe tí ó ní árítíkù ń tọ́ka sí ‘ẹni tí ó sẹ́.’ Ìṣètò ‘tí ó bá’ sọ òfin gbogbogbò yìí ní Yorùbá àdánidá, ‘sẹ́’ sì pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἀπαρνηθήσεται.
- source_word: με
  choice: mi
  rationale: A pa arọ́pò-orúkọ tí ó ń tọ́ka sí Jésù mọ́ gẹ́gẹ́ bí olùgbà ìṣe náà.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ohun tí a ṣe ní gbangba tàbí ní ojú ẹnì kan.
- source_word: τῶν ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι túmọ̀ sí àwọn ènìyàn lápapọ̀, ní ìyàtọ̀ sí àwọn áńgẹ́lì Ọlọ́run; yíyan ‘àwọn ènìyàn’ jẹ́ àdánidá, ó sì yẹra fún fífi akọ nìkan hàn.
- source_word: ἀπαρνηθήσεται
  choice: a ó sẹ́ ẹni náà
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà wà ní ìrísí àìsọ olùṣe. Ìkọ̀wé Yorùbá ‘a ó’ fi olùṣe sílẹ̀ láìdárúkọ, ‘sẹ́’ sì pa àfiwé ọ̀rọ̀-ìṣe ‘sẹ́ … sẹ́’ mọ́. Lílo ‘ẹni náà’ mú ẹni tí ìṣe náà kàn ṣe kedere.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: àwọn áńgẹ́lì Ọlọ́run
  rationale: Ó pa àjọṣe gẹnitífù àti àwòrán àgbàlá ọ̀run inú Gíríìkì mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ẹsẹ yìí àti ọ̀rọ̀ ìjẹ́wọ́ inú ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Ta ni olùṣe tí a kò dárúkọ nínú ‘a ó sẹ́ ẹni náà’?
  choice: A kò sọ olùṣe náà ní pàtó.
  alternative: Kí a sọ pé Ọmọ Ènìyàn tàbí Ọlọ́run ni yóò sẹ́ ẹni náà.
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe aláìsọ olùṣe, kò sì dárúkọ ẹni tó ń ṣe ìṣe náà. Àyíká lè mú kí òǹkàwé ronú nípa Jésù tàbí ìṣe Ọlọ́run, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ pinnu ohun tí ẹsẹ náà fúnra rẹ̀ kò sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò ‘ẹni tí ó bá … a ó …’ jẹ́ àdánidá fún òfin gbogbogbò, ó sì pa ìwọ̀ntúnwọ̀nsì àti ìkìlọ̀ mímúná inú Gíríìkì mọ́.
