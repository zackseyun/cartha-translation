    reason: lexical_alternative
  revision_rationale: The revision corrects the mistranslation of ‘sow,’ removes an unsupported concessive connector, and improves the final comparative idiom. It retains the concrete ravens, the two distinct storage locations, God’s ongoing care, and the rhetorical force of the conclusion.
