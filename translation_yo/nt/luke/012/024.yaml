id: LUK.12.24
reference: Luke 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: yo
  text: Ẹ wo àwọn ẹyẹ ìwò, kí ẹ sì ronú nípa wọn:[a] wọn kì í gbin, wọn kì í kórè; wọn kò ní yàrá ìpamọ́ tàbí ilé ìpamọ́ ọkà,[b] Ọlọ́run sì ń bọ́ wọn. Ẹ ní iye ju àwọn ẹyẹ lọ púpọ̀!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ fara balẹ̀ kíyè sí àwọn ẹyẹ ìwò.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ọ̀rọ̀ méjì ọ̀tọ̀: ταμεῖον fún yàrá ìpamọ́ àti ἀποθήκη fún ilé ìpamọ́ ọkà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Ẹ wo ... kí ẹ sì ronú nípa wọn
  rationale: Ọ̀rọ̀ àṣẹ náà ń pe àwọn olùgbọ́ láti kíyè sí àwọn ẹyẹ náà, kí wọ́n sì fara balẹ̀ ronú nípa wọn; gbolohun méjì yìí mú ìtumọ̀ ìṣàkíyèsí àti ìrònú jinlẹ̀ jáde ní Yorùbá àdánidá.
- source_word: κόρακας
  choice: àwọn ẹyẹ ìwò
  rationale: Kókó ọ̀rọ̀ Gíríìkì túmọ̀ sí raven ní pàtó; ‘ẹyẹ ìwò’ pa àwòrán ẹyẹ kan náà mọ́, dípò lílo ‘ẹyẹ’ lásán.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: wọn kì í fún irúgbìn, wọn kì í sì í ká
  rationale: Èyí pa ìṣọ̀kan àwọn iṣẹ́ àgbẹ̀ méjèèjì mọ́, ó sì lo àkókò ìṣe àṣà tí ó bá ọ̀rọ̀ Gíríìkì mu.
- source_word: ταμεῖον
  choice: yàrá ìkó-nǹkan sí
  rationale: Ó túmọ̀ sí yàrá inú ilé tí a fi ń tọ́jú nǹkan; yíyan yìí jẹ́ kó yàtọ̀ sí abà.
- source_word: ἀποθήκη
  choice: abà
  rationale: ‘Abà’ jẹ́ ibi tí a fi ń tọ́jú èso oko tàbí oúnjẹ, ó sì bá àyíká iṣẹ́ àgbẹ̀ mu.
- source_word: τρέφει
  choice: ń bọ́
  rationale: ‘Ń bọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run ń fún àwọn ẹyẹ ní oúnjẹ ní ìtẹ̀síwájú.
- source_word: πόσῳ μᾶλλον ... διαφέρετε
  choice: Ẹ sì níye lórí tó ju ... lọ púpọ̀
  rationale: Èyí mú àfiwé láti ohun kékeré sí ohun títóbi jáde, ó sì fi ìtumọ̀ iye tàbí pàtàkì hàn dípò ìyàtọ̀ lásán.
- source_word: τῶν πετεινῶν
  choice: àwọn ẹyẹ
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ gbogbogbò fún àwọn ẹyẹ; lẹ́yìn mẹ́nu kan ẹyẹ ìwò ní pàtó, àfiwé náà gbòòrò sí gbogbo ẹyẹ.
theological_decisions:
- issue: Ìpèsè àti ìtọ́jú Ọlọ́run nínú àfiwé náà
  choice: síbẹ̀ Ọlọ́run ń bọ́ wọn
  alternative: Ọlọ́run ń pèsè oúnjẹ fún wọn
  rationale: Gbolohun yìí pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ń ṣe iṣẹ́ náà, gẹ́gẹ́ bí Gíríìkì ṣe sọ, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
- issue: Ìtumọ̀ διαφέρετε nínú àfiwé
  choice: Ẹ sì níye lórí tó ju àwọn ẹyẹ lọ púpọ̀
  alternative: Ẹ sì ṣe pàtàkì ju àwọn ẹyẹ lọ púpọ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí iye tàbí pàtàkì ènìyàn ní ìfiwéra pẹ̀lú ẹyẹ, kì í ṣe ìyàtọ̀ lásán. ‘Níye lórí’ pa ìtumọ̀ iye náà mọ́ láì ṣàlàyé ohun tí ẹsẹ̀ kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμεῖς. Àmì ìyanu ní ìparí mú agbára àfiwé ọ̀rọ̀ Gíríìkì hàn.
