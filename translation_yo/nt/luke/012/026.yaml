    rationale: Ìsopọ̀ “jù bẹ́ẹ̀” ń fi ìfiwéra hàn (‘kéré ju bẹ́ẹ̀ lọ’), níbi tí èdè Gíríìkì ti ń sọ ohun tó kéré jù nínú gbogbo wọn. “Ohun tí ó kéré jù lọ” ni ìbámu tó péye.
  - severity: low
    issue: Ìfihàn οὖν àti οὐδέ
    rationale: “Ǹjẹ́” lè ṣiṣẹ́ gẹ́gẹ́ bí ìṣí ìbéèrè, ṣùgbọ́n “Nítorí náà” ń tú ìsopọ̀ ìrònú οὖν jáde ní kedere; “kò tilẹ̀” sì dara ju “... pàápàá” tí a fi lẹ́yìn gbolohun lọ fún agbára odi οὐδέ.
