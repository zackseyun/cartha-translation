id: LUK.12.26
reference: Luke 12:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: yo
  text: Nítorí náà, bí ẹ kò tilẹ̀ lè ṣe ohun tí ó kéré jù lọ, èé ṣe tí ẹ fi ń ṣàníyàn nípa àwọn ohun yòókù?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ǹjẹ́ bí ... bá
  rationale: Àkójọpọ̀ yìí mú ìtumọ̀ àídájú àti ìsopọ̀ ìrònú inferential náà jáde ní Yorùbá àdánidá; “Ǹjẹ́” so ìbéèrè náà mọ́ àríyànjiyàn tó ṣáájú.
- source_word: οὐδὲ ἐλάχιστον
  choice: kò ... ohun tí ó kéré jù bẹ́ẹ̀ pàápàá
  rationale: “Ohun tí ó kéré jù” mú ἐλάχιστον tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ jáde, “pàápàá” sì fi agbára οὐδέ hàn.
- source_word: δύνασθε
  choice: kò bá lè ṣe
  rationale: “Lè ṣe” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ agbára tàbí àìlágbára láti ṣe ohun kan.
- source_word: τί
  choice: èé ṣe
  rationale: Nínú ìbéèrè àsọyé yìí, τί ń béèrè ìdí, nítorí náà “èé ṣe” ni ìbámu àdánidá.
- source_word: περὶ τῶν λοιπῶν
  choice: nípa àwọn ohun tó kù
  rationale: Ó pa ìtumọ̀ àwọn ọ̀ràn tàbí ohun yòókù mọ́, ó sì yàgò fún fífi ìtumọ̀ míì kún un.
- source_word: μεριμνᾶτε
  choice: ẹ fi ń ṣàníyàn
  rationale: “Ń ṣàníyàn” fi ìṣe tó ń bá a lọ hàn, ó sì tọ́ka sí àníyàn tí ọ̀rọ̀ inú àyíká ń tako, kì í ṣe gbogbo ìṣọ́ra ọlọ́gbọ́n.
theological_decisions:
- issue: Ìtumọ̀ μεριμνάω nínú ẹ̀kọ́ Jésù nípa gbígbẹ́kẹ̀ lé Ọlọ́run
  choice: ń ṣàníyàn
  alternative: ń ṣe àníyàn / ń dààmú
  rationale: “Ń ṣàníyàn” bá àyíká Lúùkù 12 mu, ó sì ṣọ́ ìyàtọ̀ láàárín àníyàn tí kò tọ́ àti ìṣọ́ra tó bófin mu láìfi ẹ̀kọ́ ẹ̀sìn kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, nítorí δύνασθε àti μεριμνᾶτε jẹ́ ọ̀pọ̀.
