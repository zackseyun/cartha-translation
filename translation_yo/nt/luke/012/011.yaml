  to: Ṣùgbọ́n nígbàkígbà tí wọ́n bá mú yín wá síwájú àwọn sínágọ́gù, àwọn alákòóso àti àwọn aláṣẹ,[a] ẹ má ṣe ṣàníyàn nípa bí tàbí ohun tí ẹ ó fi gbèjà ara yín,[b] tàbí ohun tí ẹ ó sọ;
