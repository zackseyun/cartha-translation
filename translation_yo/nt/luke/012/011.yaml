source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: yo
  text: Ṣùgbọ́n nígbàkígbà tí wọ́n bá mú yín wá síwájú àwọn sínágọ́gù, àwọn alákòóso àti àwọn aláṣẹ,[a] ẹ má ṣe ṣàníyàn nípa bí tàbí ohun tí ẹ ó fi gbèjà ara yín,[b] tàbí ohun tí ẹ ó sọ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn sínágọ́gù, àwọn alákòóso àti àwọn aláṣẹ” ń tọ́ka sí àwọn ẹgbẹ́ ẹ̀sìn àti ìjọba tí ó lè pe àwọn ọmọ-ẹ̀yìn wá fún ìwádìí tàbí ìdájọ́.
    reason: cultural_note
  - marker: b
    text: 'Ní ìtumọ̀ tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “bí tàbí ohun tí ẹ ó fi dáhùn láti gbèjà ara yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí … bá
  rationale: “Nígbà tí … bá” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ó lè máa ṣẹlẹ̀ hàn, “Ṣùgbọ́n” sì pa ìsopọ̀ onírẹ̀lẹ̀ ti δέ mọ́ nínú àyíká ọ̀rọ̀.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: wọ́n bá mú yín wá
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún mímú ẹnì kan wá síwájú ilé ẹjọ́ tàbí àwọn aláṣẹ.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: síwájú àwọn sínágọ́gù, àwọn alákòóso àti àwọn aláṣẹ
  rationale: “Síwájú” mú àyíká ìdájọ́ hàn; a pa ìyàtọ̀ láàárín sínágọ́gù, alákòóso àti aláṣẹ mọ́.
- source_word: συναγωγάς
  choice: àwọn sínágọ́gù
  rationale: A pa orúkọ ibi náà mọ́ dípò ṣíṣe ìtumọ̀ rẹ̀ ní pàtó sí ‘ilé ẹjọ́ sínágọ́gù,’ bí ó tilẹ̀ jẹ́ pé ó dúró fún ẹgbẹ́ ìdájọ́ ní àyíká yìí.
- source_word: μὴ μεριμνήσητε
  choice: ẹ má ṣe ṣàníyàn
  rationale: Ó sọ ìdènà ìdààmú ọkàn tàbí àníyàn tí ń gba èrò ẹni kan, ní èdè Yorùbá òde òní.
- source_word: πῶς ἢ τί
  choice: bí … tàbí ohun tí
  rationale: A pa ìbéèrè nípa ọ̀nà àti nípa ohun tí a ó sọ mọ́, láìsọ méjèèjì di ohun kan.
- source_word: ἀπολογήσησθε
  choice: ẹ ó ṣe gbèjà ara yín … ohun tí ẹ ó sọ láti fi gbèjà ara yín
  rationale: “Gbèjà ara yín” mú ìtumọ̀ ọ̀rọ̀ ilé ẹjọ́ àti ìrísí middle ti ọ̀rọ̀ Gíríìkì hàn; àtúnsọ díẹ̀ náà jẹ́ dandan láti sọ “bí tàbí ohun tí” di Yorùbá tí ó ṣe kedere.
- source_word: ἢ τί εἴπητε
  choice: tàbí ohun tí ẹ ó sọ
  rationale: A pa gbólóhùn yìí yàtọ̀ sí ọ̀rọ̀ gbígbèjà ara ẹni, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ “ẹ/yín” fún ὑμᾶς, a sì fi àmì ohùn sí ibi tí ó yẹ. A pa àtúnsọ tó wà nínú Gíríìkì mọ́ díẹ̀, kí ìyàtọ̀ láàárín gbígbèjà ara ẹni àti ohun mìíràn tí wọn yóò sọ má bàjẹ́.
