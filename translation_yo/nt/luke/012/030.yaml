id: LUK.12.30
reference: Luke 12:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: yo
  text: Nítorí gbogbo nǹkan wọ̀nyí ni àwọn orílẹ̀-èdè ayé ń fi taratara wá[a], ṣùgbọ́n Baba yín mọ̀ pé ẹ nílò àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Kèfèrí ayé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn Kèfèrí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí oúnjẹ, ohun mímu àti àwọn ohun kòṣeémáàní míì tí ọ̀rọ̀ inú àyíká ẹsẹ yìí mẹ́nu kàn; ó sì pa gbogbo àti ọ̀rọ̀ arọ́pò-orúkọ ìtọ́kasí náà mọ́.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: àwọn orílẹ̀-èdè ayé
  rationale: ἔθνη lè túmọ̀ sí àwọn orílẹ̀-èdè tàbí àwọn Kèfèrí. Ìtumọ̀ yìí pa gbólóhùn Gíríìkì náà mọ́ ní ọ̀nà gbígbòòrò láì dín un kù sí ẹ̀yà kan ṣoṣo.
- source_word: ἐπιζητοῦσιν
  choice: ń fi taratara wá
  rationale: Ọ̀rọ̀-ìṣe ἐπιζητέω ń sọ nípa wíwá ohun kan gidigidi tàbí lílépa rẹ̀. ‘Ń fi taratara wá’ jẹ́ èdè Yorùbá àdánidá tí ó fi agbára ọ̀rọ̀ náà hàn.
- source_word: ὑμῶν ... ὁ πατὴρ
  choice: Baba yín
  rationale: Èyí túmọ̀ ìbátan tí ọ̀rọ̀ Gíríìkì sọ ní tààrà; a kò fi ‘ti ọ̀run’ kún un nítorí kò sí nínú ẹsẹ yìí.
- source_word: οἶδεν
  choice: mọ̀
  rationale: 'Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì rẹ̀ dà bí perfect, ìtumọ̀ rẹ̀ níbí jẹ́ ti àkókò ìsinsìnyí: ‘mọ̀.’'
- source_word: χρῄζετε
  choice: ẹ nílò
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún ‘ẹ ní àìní’ tàbí ‘ẹ nílò.’
- source_word: τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Àtúnsọ ọ̀rọ̀ ìtọ́kasí náà tẹ̀ lé Gíríìkì, ó sì jẹ́ kí ohun tí a ń tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ohun tí àwọn ènìyàn ayé ń lépa àti ìgbẹ́kẹ̀lé àwọn ọmọ-ẹ̀yìn nínú Baba wọn
  choice: Pa ‘àwọn orílẹ̀-èdè ayé’ àti ‘Baba yín’ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún wọn.
  alternative: Lo ‘àwọn Kèfèrí ayé,’ tàbí fi ‘ti ọ̀run’ kún ‘Baba.’
  rationale: Ẹsẹ náà fi ìlépa àwọn ayé wé ìbátan àwọn ọmọ-ẹ̀yìn pẹ̀lú Ọlọ́run gẹ́gẹ́ bí Baba wọn. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láì fi ohun tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ń fi taratara wá’ láti fi ìlépa alágbára hàn; ‘Baba’ ní lẹ́tà ńlá nítorí ó ń tọ́ka sí Ọlọ́run.
