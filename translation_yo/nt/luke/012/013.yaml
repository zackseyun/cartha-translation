  to: Nígbà náà, ẹnì kan nínú ọ̀pọ̀ ènìyàn náà sọ fún un pé, “Olùkọ́, sọ fún arákùnrin mi pé kí ó pín ogún náà pẹ̀lú mi.”[a]
