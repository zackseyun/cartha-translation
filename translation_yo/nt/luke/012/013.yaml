  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: yo
  text: Nígbà náà, ẹnì kan nínú ọ̀pọ̀ ènìyàn náà sọ fún un pé, “Olùkọ́, sọ fún arákùnrin mi pé kí ó pín ogún náà pẹ̀lú mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó bá mi pín ogún náà,” tàbí, “kí ó fún mi ní ìpín ogún náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Nígbà náà, ... sọ
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ tí kò fi ìtakora líle hàn; ‘Nígbà náà’ ń mú ìtẹ̀síwájú ìtàn jáde lọ́nà àdánidá.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: ẹnì kan lára èrò náà
  rationale: Ó tọ́ka sí ẹni tí a kò dárúkọ láàárín àwọn ènìyàn tí ó péjọ; ‘lára èrò náà’ mú ìtumọ̀ orísun ἐκ τοῦ ὄχλου hàn.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ẹni tí a ń bá sọ̀rọ̀, ìyẹn Jésù.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Orúkọ ìpè fún ẹni tí ń kọ́ni; ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi ìtumọ̀ àṣẹ míì kún un.
- source_word: εἰπὲ
  choice: sọ fún ... pé kí
  rationale: Àṣẹ aorist λέγω níbí jẹ́ ìbéèrè pé kí Jésù bá arákùnrin náà sọ̀rọ̀; ìgbékalẹ̀ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: τῷ ἀδελφῷ μου
  choice: arákùnrin mi
  rationale: Ó pa ìbátan àti ohun-ìní ẹni àkọ́kọ́ mọ́ ní tààràtà.
- source_word: μερίσασθαι
  choice: kí ó pín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípin tàbí pínpín sí ìpín; ‘pín’ bá ọ̀rọ̀ ogún mu, ó sì pa àìdánilójú nípa bí ìpín náà ṣe rí mọ́.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: Ó pa ìtumọ̀ ìkópa tàbí ìbáṣepọ̀ μετά pẹ̀lú genitive mọ́ láìtúmọ̀ rẹ̀ sí ‘láàárín àwa méjèèjì’.
- source_word: τὴν κληρονομίαν
  choice: ogún náà
  rationale: ‘Ogún’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun-ìní tí a jogún, láìsọ irú ohun-ìní náà ní pàtó.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtumọ̀ náà tẹ̀ lé ọ̀nà optimal-equivalence, ó sì lo ìgbékalẹ̀ ‘sọ fún ... pé kí’ fún èdè Yorùbá àdánidá.
