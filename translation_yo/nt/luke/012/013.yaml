  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa èrò pàtàkì Gíríìkì náà mọ́: ẹni kan láti inú ìjọ ènìyàn náà bá Jésù sọ̀rọ̀, ó sì bẹ̀ ẹ́ pé kí ó sọ fún arákùnrin rẹ̀ láti pín ogún náà pẹ̀lú rẹ̀. Ṣùgbọ́n “èrò náà” kì í ṣe ọ̀rọ̀ tí ó dára fún ὄχλος ní àyíká yìí; ó lè túmọ̀ sí ìrònú tàbí àwọn arìnrìn-àjò. “Ọ̀pọ̀ ènìyàn náà” jẹ́ ìbámu tó ṣe kedere fún “the crowd.”'
  naturalness: “Ẹnì kan nínú ọ̀pọ̀ ènìyàn náà” jẹ́ Yorùbá boṣewa, ó sì ṣàfihàn “from/out of the crowd” ní ti ara. Ìgbékalẹ̀ “sọ fún arákùnrin mi pé kí ó pín...” jẹ́ àdánidá, ó sì bójú mu ní ọ̀rọ̀ ìbéèrè ọlọ́wọ̀.
  terminology: “Olùkọ́” bá Διδάσκαλε mu dáadáa, “arákùnrin mi” pa ìbátan náà mọ́, “ogún” sì jẹ́ ọ̀rọ̀ tó yẹ fún κληρονομίαν. A tún ṣàtúnṣe ọ̀rọ̀ àfikún ẹsẹ̀ kí yíyan “apportion ... to me” má ṣe sọ pé ogún náà ti di ti ẹni tí ń sọ̀rọ̀ tẹ́lẹ̀.
