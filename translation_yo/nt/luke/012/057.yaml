  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: yo
  text: Èé sì ti ṣe tí ẹ̀yin fúnra yín kò fi ìdájọ́ yín pinnu ohun tí ó tọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó jẹ́ òdodo” tàbí “ohun tó yẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Èé sì ti ṣe jẹ́ pé
  rationale: Ọ̀rọ̀ yìí so ìbéèrè náà mọ́ àríyànjiyàn tó ṣáájú, ó sì gbé e kalẹ̀ gẹ́gẹ́ bí ìbéèrè àsọyé tó ń tẹ́ àwọn olùgbọ́ lọ́kàn. Gbólóhùn Yorùbá yìí jẹ́ àdánidá ju títú àwọn patíkù Gíríìkì kọ̀ọ̀kan lọ.
- source_word: ἀφ’ ἑαυτῶν
  choice: ẹ̀yin fúnra yín
  rationale: Ó tọ́ka sí ṣíṣe àyẹ̀wò tàbí ìpinnu láti inú òye àti ìdájọ́ ẹni fúnra rẹ̀. ‘Ẹ̀yin fúnra yín’ fi ìtẹnumọ́ orísun náà hàn ní Yorùbá àdánidá.
- source_word: οὐ κρίνετε
  choice: kò fi ìdájọ́ mọ
  rationale: κρίνω níhìn-ín túmọ̀ sí ṣíṣe àyẹ̀wò kí ẹni lè mọ tàbí pinnu ohun tó yẹ. ‘Fi ìdájọ́ mọ’ pa agbára ìṣírò àti ìpinnu ọ̀rọ̀ náà mọ́ láì jẹ́ kí ó dà bí ìdájọ́ ilé-ẹjọ́ nìkan.
- source_word: τὸ δίκαιον
  choice: ohun tí ó tọ́
  rationale: 'Àjẹtífù akọláìdábọ̀ náà ń ṣiṣẹ́ bí orúkọ: ohun tó tọ́ tàbí tó bá ìdájọ́ òdodo mu. ‘Ohun tí ó tọ́’ jẹ́ Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ ìwà rere àti ìdájọ́ òdodo méjèèjì mọ́.'
theological_decisions:
- issue: Ìtumọ̀ τὸ δίκαιον
  choice: ohun tí ó tọ́
  alternative: ohun tí ó jẹ́ òdodo; ohun tó yẹ
  rationale: Àyíká ọ̀rọ̀ náà ń béèrè fún òye láti mọ ìṣe tó tọ́, kì í ṣe gbólóhùn ẹ̀kọ́ ìgbàgbọ́ pàtó nípa òdodo. Yíyan ‘ohun tí ó tọ́’ pa ìtumọ̀ náà gbòòrò, láì dín in kù sí òfin ilé-ẹjọ́ nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ̀yin’ nítorí ẹni púpọ̀ ni àwọn ọ̀rọ̀-orúkọ Gíríìkì tọ́ka sí.
