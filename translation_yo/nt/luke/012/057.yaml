review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè àsọyé náà, ìtọ́kasí sí ìdájọ́ láti ọ̀dọ̀ àwọn olùgbọ́ fúnra wọn (ἀφ’ ἑαυτῶν), àti τὸ δίκαιον gẹ́gẹ́ bí ‘ohun tí ó tọ́’ dáadáa. Síbẹ̀, ‘kò fi ìdájọ́ mọ’ kò hàn gbangba gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá láti sọ κρίνετε (‘ẹ ṣe ìdájọ́/pinnu’).
  naturalness: ‘Èé sì ti ṣe tí’ jẹ́ ìbẹ̀rẹ̀ ìbéèrè tó yẹ ní Yorùbá boṣewa, ṣùgbọ́n a nílò ọ̀rọ̀-ìṣe tó mọ́gbọ́n dánilẹ́kọ̀ọ́ ju ‘fi ìdájọ́ mọ’ lọ. ‘Fi ìdájọ́ yín pinnu’ jẹ́ kedere, ó sì dá ìtumọ̀ ‘judge/decide’ hàn ní èdè òde òní.
  terminology: ‘Ohun tí ó tọ́’ yẹ fún τὸ δίκαιον ní àyíká yìí, nítorí ó pa ìtumọ̀ ‘ohun tí ó yẹ/ohun tí ó jẹ́ òdodo’ mọ́ láì fi í sínú ọ̀rọ̀ òfin nìkan. Àwọn àṣàyàn inú àlàyé abẹ́lẹ̀ jẹ́ péye.
  issues:
  - severity: medium
    issue: ‘kò fi ìdájọ́ mọ’ jẹ́ ìṣọ̀kan ọ̀rọ̀ tí kò dáa tó fún οὐ κρίνετε.
