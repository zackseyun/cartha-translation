reference: Luke 12:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: yo
  text: Mo sì sọ fún yín pé, ẹnikẹ́ni tí ó bá jẹ́wọ́ mi níwájú àwọn ènìyàn,[a] Ọmọ Ènìyàn pẹ̀lú yóò jẹ́wọ́ rẹ̀ níwájú àwọn áńgẹ́lì Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnikẹ́ni tí ó bá jẹ́rìí sí mi ní gbangba níwájú àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí jíjẹ́wọ́ tàbí jíjẹ́rìí sí ẹni ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Mo sì sọ fún yín pé
  rationale: Ọ̀rọ̀ yìí ń bá ohun tí ó ṣáájú lọ, ó sì jẹ́ ìkéde pàtàkì. “Sì” mú ìsopọ̀ δέ jáde láìsọ ọ́ di àtakò líle.
- source_word: πᾶς ὃς ἂν
  choice: olúkúlùkù ẹni tí ó bá
  rationale: Ó fi ipò gbogbogbò tí ó kan ẹnikẹ́ni hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún indefinite general condition.
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: jẹ́wọ́ … yóò jẹ́wọ́
  rationale: “Jẹ́wọ́” lè túmọ̀ sí mímọ̀ tàbí jíjẹ́rìí ní gbangba pé ẹni mọ Jesu; lílo ọ̀rọ̀ kan náà ní ẹ̀ẹ̀mejì pa ìbádọ́gba ìṣe náà mọ́.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: mi … rẹ̀
  rationale: Pẹ̀lú ὁμολογέω, ἐν + dative jẹ́ àkójọpọ̀ ọ̀rọ̀ tí ìtumọ̀ rẹ̀ jẹ́ jíjẹ́wọ́ tàbí mímọ̀ ẹni ní gbangba. “Jẹ́wọ́ mi … jẹ́wọ́ rẹ̀” jẹ́ Yorùbá àdánidá ju ìtumọ̀ líle “nínú mi … nínú rẹ̀” lọ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: “Níwájú” pa ìtumọ̀ wíwà ní ojú àwọn míì mọ́; ἄνθρωποι níbí ń tọ́ka sí ènìyàn lápapọ̀, èyí tí “àwọn ènìyàn” sọ ní kedere.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa oyè tí Jesu fi ń pe ara rẹ̀ mọ́, pẹ̀lú ìwúwo rẹ̀ nínú Ìwé Mímọ́.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: níwájú àwọn áńgẹ́lì Ọlọ́run
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán jíjẹ́rìí ní gbangba ní iwájú àwọn áńgẹ́lì Ọlọ́run mọ́.
theological_decisions:
- issue: Ìtumọ̀ ọ̀nà ọ̀rọ̀ ὁμολογέω pẹ̀lú ἐν + dative
  choice: jẹ́wọ́ mi … yóò jẹ́wọ́ rẹ̀
  alternative: jẹ́wọ́ nínú mi … yóò jẹ́wọ́ nínú rẹ̀
  rationale: Ìtumọ̀ àdánidá náà ń sọ ìmọ̀ tàbí ìjẹ́rìí ní gbangba, láìfi ẹ̀kọ́ ìsìn mìíràn kún un. Ó tún pa ìbádọ́gba láàárín ìjẹ́wọ́ Jesu àti ìjẹ́wọ́ ẹni náà mọ́.
- issue: Agbára ìtọ́kasí ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; “àwọn ènìyàn” mú agbára gbogbogbò náà jáde ní Yorùbá.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Olúkúlùkù ẹni tí ó bá” jẹ́ kedere fún òǹkàwé òde òní, “Ọmọ Ènìyàn” sì pa oyè Bíbélì náà mọ́.
