id: LUK.12.33
reference: Luke 12:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: yo
  text: Ẹ ta àwọn ohun-ìní yín, kí ẹ sì fún àwọn aláìní ní ìtọrẹ.[a] Ẹ ṣe àwọn àpò owó fún ara yín tí kì í gbó, ìṣúra tí kì í tán ní àwọn ọ̀run,[b] níbi tí olè kankan kì í sún mọ́ ọn, tí kòkòrò aṣọ kì í sì í bà á jẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ sì ṣe ìtọrẹ àánú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìfúnni àánú fún àwọn aláìní.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “ní ọ̀run.” Nínú Gíríìkì, ọ̀rọ̀ náà wà ní ọ̀pọ̀: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Ẹ ta
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “Ẹ ta” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láì fi ìtumọ̀ pé kí wọ́n ta gbogbo rẹ̀ pátápátá kún un.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: àwọn ohun-ìní yín
  rationale: Ó tọ́ka sí ohun-ìní tàbí dúkìá tí ó jẹ́ ti àwọn tí a ń bá sọ̀rọ̀.
- source_word: δότε ἐλεημοσύνην
  choice: kí ẹ sì fi fún àwọn aláìní gẹ́gẹ́ bí iṣẹ́ àánú
  rationale: Èyí fi hàn pé fífún àwọn aláìní ni irú iṣẹ́ àánú tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Ẹ ṣe ... fún ara yín
  rationale: Ó pa agbára ọ̀rọ̀ àṣẹ àti ìtumọ̀ pé ohun tí wọ́n ṣe náà jẹ́ fún àǹfààní ara wọn mọ́.
- source_word: βαλλάντια
  choice: àpò owó
  rationale: Ó pa àwòrán àpò tí a fi ń kó owó mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μὴ παλαιούμενα
  choice: tí kì í gbó
  rationale: Ó sọ pé àpò náà kì í di ogbó tàbí wọ́ tán; ìsọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: ìṣúra tí kì í tán
  rationale: ἀνέκλειπτος túmọ̀ sí ohun tí kì í kùnà tàbí tán; “tí kì í tán” ṣe àfihàn rẹ̀ ní kedere.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ nǹkan tí ọ̀rọ̀ Gíríìkì lò mọ́, bí ó tilẹ̀ jẹ́ pé “ní ọ̀run” tún wọ́pọ̀ ní Yorùbá.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: níbi tí olè kankan kì í sún mọ́ ọn
  rationale: Ó pa àwòrán olè tí kò lè dé ibi ìṣúra náà mọ́ láì túmọ̀ ἐγγίζει sí ìjíjà fúnra rẹ̀.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: tí kòkòrò aṣọ kì í sì í bà á jẹ́
  rationale: σής ni kòkòrò tó ń jẹ aṣọ; “bà á jẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìparun tí ó ń ṣe.
theological_decisions:
- issue: Ìtumọ̀ ἐλεημοσύνην nínú àṣẹ nípa ohun-ìní
  choice: fún àwọn aláìní gẹ́gẹ́ bí iṣẹ́ àánú
  alternative: ṣe ìtọrẹ àánú
  rationale: Yíyan yìí sọ ẹni tí ìfúnni náà ń lọ sí di mímọ́ gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ náà, láì sọ ọ́ di ètò ọrọ̀-ajé tàbí ẹ̀kọ́ ẹ̀sìn kan.
- issue: Ọ̀pọ̀ nǹkan nínú ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  alternative: ní ọ̀run
  rationale: A pa ìrísí ọ̀pọ̀ nǹkan inú Gíríìkì mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé Yorùbá tún lè sọ ọ́ ní ẹyọ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwọn àwòrán àpò owó, ìṣúra, olè àti kòkòrò aṣọ mọ́.
