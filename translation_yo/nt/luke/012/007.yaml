id: LUK.12.7
reference: Luke 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: yo
  text: Ṣùgbọ́n àní gbogbo irun orí yín ni a ti kà. Ẹ má bẹ̀rù; ẹ ní iye ju ọ̀pọ̀ ológoṣẹ́ lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ṣùgbọ́n àní
  rationale: “Ṣùgbọ́n” pa ìyàtọ̀ mọ́ sí èrò tó ṣáájú, “àní” sì mú ìtẹnumọ́ pé àní irun orí wọn pàápàá wà lábẹ́ ìmọ̀ Ọlọ́run.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: gbogbo irun orí yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa àwòrán pàtó àti ìtumọ̀ πᾶσαι mọ́.
- source_word: ἠρίθμηνται
  choice: ni a ti kà
  rationale: Àpólà “a ti kà” fi iṣẹ́ tó ti ṣẹlẹ̀ àti èsì rẹ̀ tó ṣì wà hàn, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere. Ìṣe aláìlórúkọ náà kò sọ ẹni tó kà á ní tààràtà, bí Gíríìkì ṣe rí.
- source_word: μὴ φοβεῖσθε
  choice: Ẹ má bẹ̀rù
  rationale: Àṣẹ òdì ní irú ọ̀rọ̀ Yorùbá tó ṣe déédéé, tí ó sì bá ẹni púpọ̀ mu.
- source_word: πολλῶν στρουθίων
  choice: ọ̀pọ̀ ológoṣẹ́
  rationale: “Ológoṣẹ́” tọ́ka sí ẹyẹ kékeré náà, ó sì pa ìṣọ̀kan pẹ̀lú àyíká ẹsẹ̀ tó ṣáájú mọ́.
- source_word: διαφέρετε
  choice: ẹ níye lórí ju ... lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń fi iye ẹni wé iye ohun mìíràn; ìtumọ̀ yìí ṣe kedere láìfi èrò àjèjì kún un.
theological_decisions:
- issue: Ìfiwéra iye àwọn ọmọ-ẹ̀yìn pẹ̀lú ológoṣẹ́
  choice: ẹ níye lórí ju ọ̀pọ̀ ológoṣẹ́ lọ
  alternative: ẹ ṣe pàtàkì ju ọ̀pọ̀ ológoṣẹ́ lọ
  rationale: “Níye lórí ju” fi ìtumọ̀ ìfiwéra διαφέρετε hàn ní àyíká ìtọ́jú Ọlọ́run, láìsọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́ tó kọjá ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “ẹ/yín” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú Gíríìkì.
