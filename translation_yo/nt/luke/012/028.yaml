id: LUK.12.28
reference: Luke 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: yo
  text: Ṣùgbọ́n bí Ọlọ́run bá ń wọ koríko inú pápá[a] ní aṣọ báyìí—èyí tí ó wà lónìí, tí a ó sì sọ sínú ààrò[b] lọ́la—mélòómélòó ni yóò ha wọ yín ní aṣọ, ẹ̀yin tí ìgbàgbọ́ yín kéré!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ewéko” tàbí “koríko pápá.”
    reason: lexical_alternative
  - marker: b
    text: “Ààrò” níbí ni ibi ìdáná fún ṣíṣe oúnjẹ; a lè lo koríko pápá tí ó ti gbẹ gẹ́gẹ́ bí ìdáná.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: koríko
  rationale: “Koríko” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ewéko kéékèèké inú pápá; ó bá àwòrán ohun tí ó rọrùn láti gbẹ tí a sì lè fi dá iná mu.
- source_word: ἐν ἀγρῷ
  choice: inú pápá
  rationale: Ó sọ ibi tí koríko náà wà ní ọ̀nà àdánidá, láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: èyí tí ó wà lónìí, tí a ó sì sọ ... lọ́la
  rationale: A tú gbólóhùn aláápọn Gíríìkì sí ọ̀nà tí Yorùbá lè ṣàn dáadáa, nígbà tí a pa ìyàtọ̀ láàárín lónìí àti lọ́la mọ́.
- source_word: κλίβανον
  choice: ààrò
  rationale: “Ààrò” lè tọ́ka sí ibi ìdáná tí a fi ń ṣe oúnjẹ; ó yẹ ju ọ̀rọ̀ tí yóò dà bí ilé-ìná ilé-iṣẹ́ lọ. Àlàyé ìṣe koríko gbígbẹ gẹ́gẹ́ bí epo iná wà ní àlàyé ìsàlẹ̀.
- source_word: ἀμφιέζει
  choice: fi ... wọ aṣọ
  rationale: Ìfihàn yìí pa àkàwé wíwọ aṣọ mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere ní àyíká ẹsẹ náà.
- source_word: πόσῳ μᾶλλον
  choice: mélòómélòó ... jù bẹ́ẹ̀ lọ
  rationale: Ó mú àríyànjiyàn láti ohun kékeré sí ohun ńlá jáde ní ọ̀nà Yorùbá tí ó ṣe àdánidá.
- source_word: ὀλιγόπιστοι
  choice: ẹ̀yin onígbàgbọ́ kékeré
  rationale: Ó pa ìbáwí tààrà ṣùgbọ́n tí kò le koko mọ́, láì sọ ọ́ di ẹ̀kọ́ pàtó nípa ìgbàlà tàbí ìṣubú kúrò nínú ìgbàgbọ́.
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí ... bá
  rationale: Ó fi ìtẹ̀síwájú pẹ̀lú ìyípadà díẹ̀ hàn, ó sì lo ìṣètò gbólóhùn àídájú Yorùbá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà fún olùṣe tí Gíríìkì sọ ní kedere.
- source_word: οὕτως
  choice: báyìí
  rationale: Ó tọ́ka sí ọ̀nà tí Ọlọ́run gbà ń fi koríko wọ aṣọ, ní ṣókí àti ní kedere.
theological_decisions:
- issue: Agbára ὀλιγόπιστοι nínú ọ̀rọ̀ tí Jésù sọ sí àwọn ọmọ-ẹ̀yìn
  choice: 'Ìbáwí tààrà ṣùgbọ́n pẹ̀lẹ́: “ẹ̀yin onígbàgbọ́ kékeré”'
  alternative: Ìbáwí líle nítorí ìbínú, tàbí àpèjúwe lasán nípa àìní ìgbẹ́kẹ̀lé
  rationale: Ọ̀rọ̀ náà ń bá ìgbẹ́kẹ̀lé wọn nínú Ọlọ́run wí, ṣùgbọ́n kò dá ẹ̀kọ́ pàtó sílẹ̀ nípa ìgbàgbọ́ ìgbàlà tàbí ìpẹ̀yìndà. A pa ìdíwọ̀n àti ìfọ̀kànbalẹ̀ ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, òde òní, ó sì ṣeé lóye fún òǹkàwé lasán. A lo àkàwé “wọ aṣọ” kí ìbáṣepọ̀ rẹ̀ pẹ̀lú àyíká ẹsẹ náà lè hàn.
