  to: Ṣùgbọ́n bí Ọlọ́run bá ń wọ koríko inú pápá[a] ní aṣọ báyìí—èyí tí ó wà lónìí, tí a ó sì sọ sínú ààrò[b] lọ́la—mélòómélòó ni yóò ha wọ yín ní aṣọ, ẹ̀yin tí ìgbàgbọ́ yín kéré!
