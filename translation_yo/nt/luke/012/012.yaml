  terminology: “Ẹ̀mí Mímọ́” jẹ́ ọ̀rọ̀ ìtumọ̀ tí ó wọ́pọ̀, tó sì bójú mu fún τὸ ἅγιον πνεῦμα. “Wákàtí” àti “gbọ́dọ̀ sọ” tún bá ìtumọ̀ àti ìwọ̀n ọ̀rọ̀ ìpilẹ̀ mu. Àkọsílẹ̀ [a] ní ìdí tó bójú mu, ó sì ṣàlàyé ìyàtọ̀ ìtumọ̀ àkókò láìfi èrò mìíràn kún ẹsẹ̀ náà.
