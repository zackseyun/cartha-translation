  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: yo
  text: Nítorí Ẹ̀mí Mímọ́ yóò kọ́ yín ní wákàtí náà gan-an ní ohun tí ẹ gbọ́dọ̀ sọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní àkókò náà gan-an.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ àkókò pàtó tí ẹ ó nílò ìrànlọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àlàyé tí ó so ẹsẹ̀ yìí mọ́ ìdánilójú inú ẹsẹ̀ ṣáájú mọ́.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá ìgbàlódé tí ó wọ́pọ̀, tí ó sì tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí olùṣe ìṣe náà.
- source_word: διδάξει
  choice: yóò kọ́
  rationale: Ó ṣe àfihàn ìṣe ọjọ́ iwájú ti διδάσκω ní tààrà, ó sì pa ìlérí ìrànlọ́wọ́ mọ́.
- source_word: ὑμᾶς
  choice: yín
  rationale: Orúkọ arọ́pò ẹni kejì ọ̀pọ̀ ni; “yín” fi ọ̀pọ̀ hàn ní Yorùbá.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ní wákàtí náà gan-an
  rationale: “Gan-an” mú ìtẹnumọ́ αὐτῇ jáde, ó sì tọ́ka sí àkókò pàtó tí ìrànlọ́wọ́ yóò ṣe pàtàkì.
- source_word: ἃ
  choice: ohun tí
  rationale: Ọ̀nà àdánidá ní Yorùbá láti fi gbé àkóónú ohun tí wọn yóò sọ kalẹ̀.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: Ó fi dandan tàbí ohun tí ipò náà béèrè hàn láìrẹ̀wẹ̀sì agbára ọ̀rọ̀ Gíríìkì.
- source_word: εἰπεῖν
  choice: sọ
  rationale: Ó jẹ́ ìtumọ̀ àdánidá ti λέγω nínú àyíká ọ̀rọ̀ nípa ohun tí àwọn ọmọ-ẹ̀yìn yóò sọ.
theological_decisions:
- issue: Ìtọ́kasí “Ẹ̀mí Mímọ́”
  choice: Ẹ̀mí Mímọ́ ni olùṣe ìṣe ti yóò kọ́ àwọn ọmọ-ẹ̀yìn ohun tí wọn yóò sọ.
  alternative: Kí a ka á sí agbára tàbí ìmísí àìlẹ́ni-nínú lásán.
  rationale: Ẹ̀mí Mímọ́ ni kókó-ọrọ̀ fún ọ̀rọ̀-ìṣe “yóò kọ́”; ìtumọ̀ náà pa ìṣe ara ẹni tí ẹsẹ̀ náà sọ mọ́ láìfi àlàyé ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. “Ẹ” àti “yín” pa ọ̀pọ̀ inú ὑμᾶς mọ́.
