language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ẹ ṣọ́ra, kí ẹ sì máa ṣọ́ ara yín kúrò lọ́wọ́ gbogbo irú ojúkòkòrò[a], nítorí ìyè ènìyàn kì í wà nínú bí ohun ìní rẹ̀ ṣe pọ̀ tó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú gbogbo ìwọra.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ojúkòkòrò, ìwọra, tàbí ìfẹ́ láti máa ní sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Ẹ ṣọ́ra
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni, ó sì ní agbára ìkìlọ̀; “Ẹ ṣọ́ra” jẹ́ ọ̀nà Yorùbá àdánidá láti pe ènìyàn sí ìfiyèsí ewu.
- source_word: φυλάσσεσθε
  choice: kí ẹ sì máa pa ara yín mọ́
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìdáàbòbo ara ẹni; gbolohun yìí pa ìtumọ̀ afẹ̀yìntì náà mọ́, kò sì dàpọ̀ mọ́ “Ẹ ṣọ́ra.”
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: kúrò nínú gbogbo onírúurú ojúkòkòrò
  rationale: πλεονεξία tọ́ka sí ìfẹ́ láti ní sí i tàbí láti kó ohun jọ láìní ìtẹ́lọ́rùn. “Gbogbo onírúurú” fi agbára πάσης hàn, “ojúkòkòrò” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó yé ni lónìí.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìdí tí ìkìlọ̀ náà fi yẹ wá, gẹ́gẹ́ bí asopọ̀ oníṣe-okùnfà.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: bí ohun ìní ènìyàn tilẹ̀ pọ̀ tó, kì í ṣe nínú rẹ̀ ni ìyè rẹ̀ wà
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ mọ́ pé ọ̀pọ̀lọpọ̀ ohun ìní kì í ṣe ohun tí ìyè ènìyàn dúró lé tàbí wà nínú rẹ̀.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: ohun ìní ènìyàn
  rationale: ὑπάρχοντα níbí túmọ̀ sí àwọn ohun tí ènìyàn ní. “Ohun ìní” jẹ́ kúkúrú, ó wọ́pọ̀, ó sì bá àyíká ọrọ̀ mu.
theological_decisions:
- issue: Ìkìlọ̀ nípa πλεονεξία
  choice: gbogbo onírúurú ojúkòkòrò
  alternative: gbogbo ìwọra
  rationale: “Ojúkòkòrò” bo ìfẹ́ àṣejù sí ohun ìní àti ìfẹ́ láti ní sí i, láìfi ìtumọ̀ náà mọ́ ìfẹ́ ohun ẹlòmíràn nìkan.
- issue: Ìtumọ̀ ìyè àti ọ̀pọ̀ ohun ìní
  choice: kì í ṣe nínú rẹ̀ ni ìyè rẹ̀ wà
  alternative: ìyè rẹ̀ kò dá lórí ọ̀pọ̀ ohun ìní rẹ̀
  rationale: Yíyan yìí tẹ̀lé àwòrán gíríìkì pé ìyè kò “wà nínú” ọ̀pọ̀ ohun ìní, ó sì yẹra fún ṣíṣe ìtumọ̀ “ìyè” di ìgbésí ayé ti ara nìkan.
- issue: Ọ̀rọ̀ akọ tí a lò fún gbogbo ènìyàn
  choice: ènìyàn ... ìyè rẹ̀
  alternative: ọkùnrin kan ... ìyè rẹ̀
  rationale: τινί àti αὐτοῦ jẹ́ ti ẹyọ kan ṣùgbọ́n wọ́n dúró fún ẹnikẹ́ni; “ènìyàn” fi ìtumọ̀ àpapọ̀ náà hàn láìsọ pé ọkùnrin nìkan ni a ń bá sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. Àṣẹ “Ẹ” fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ; àtúnṣe ohun orin àti àmì ohùn ni a fi sí ibi tí ó yẹ.
