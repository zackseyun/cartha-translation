  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: yo
  text: “Mo wá láti ju iná sí ilẹ̀ ayé[a], báwo ni mo ṣe fẹ́ kí a ti tanná iná náà!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ pẹ́kípẹ́kí: “kí sì ni mo fẹ́ bí iná náà bá ti tanná?” Gbólóhùn Gíríìkì náà ṣòro; ọ̀rọ̀ inú ẹsẹ̀ fi ìtumọ̀ tí ó ṣeé ṣe jù hàn, ìyẹn ìfẹ́ ọkàn tó lágbára.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: Iná
  rationale: Ó pa àwòrán Gíríìkì mọ́ láì túmọ̀ rẹ̀ sí ìdájọ́, ìwẹ̀nùmọ́, Ẹ̀mí Mímọ́, tàbí ìpínyà.
- source_word: ἦλθον
  choice: ni mo wá
  rationale: Ìṣẹ̀dá ọ̀rọ̀ yìí jẹ́ ti iṣẹ́ tí Jésù wá ṣe; ìtẹnumọ́ “ni” bá ìṣètò gbolohun Gíríìkì mu ní Yorùbá àdánidá.
- source_word: βαλεῖν
  choice: láti dà
  rationale: “Dà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi iná sí ibi kan, ó sì tún pa ìgbésẹ̀ alágbára inú βάλλω mọ́ ju “mú wá” lọ.
- source_word: ἐπὶ τὴν γῆν
  choice: sí orí ilẹ̀ ayé
  rationale: “Ilẹ̀ ayé” fi ìwọ̀n gbogbo ayé hàn, kì í sì í dín γῆ kù sí ilẹ̀ agbègbè kan.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: mo sì fẹ́ gidigidi kí ó ti jó!
  rationale: Ìtumọ̀ yìí gbé gbólóhùn líle náà kalẹ̀ gẹ́gẹ́ bí ìkéde ìfẹ́ ọkàn tó lágbára, ní Yorùbá tó ṣe kedere; àlàyé ìsàlẹ̀ fi ìtumọ̀ gígúnlẹ̀ mọ́.
- source_word: ἤδη
  choice: ti
  rationale: Nínú àkójọpọ̀ “kí ó ti jó,” “ti” ń fi hàn pé ìṣẹ̀lẹ̀ náà yẹ kí ó ti ṣẹlẹ̀ tẹ́lẹ̀, èyí tó bá ἤδη mu.
- source_word: ἀνήφθη
  choice: jó
  rationale: Fún iná, “jó” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bójú mu fún “a ti dá a sílẹ̀/ti tanná”; àkópọ̀ gbolohun náà yàgò fún èdè àjèjì.
theological_decisions:
- issue: Ìtumọ̀ “iná” nínú ọ̀rọ̀ Jésù
  choice: Fi àwòrán náà sílẹ̀ gẹ́gẹ́ bí “iná” láì ṣàlàyé ohun kan ṣoṣo tí ó dúró fún.
  alternative: Ìdájọ́; ìwẹ̀nùmọ́; Ẹ̀mí Mímọ́; tàbí ìyapa àti ìjà tí iṣẹ́ Jésù mú wá.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò sọ ìtumọ̀ àwòrán náà ní pàtó; fífi “iná” sílẹ̀ ń pa àìdánilójú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ orísun mọ́.
- issue: Agbára gbólóhùn τί θέλω εἰ ἤδη ἀνήφθη
  choice: 'Túmọ̀ ọ́ gẹ́gẹ́ bí ìkéde ìfẹ́ ọkàn tó lágbára: “mo sì fẹ́ gidigidi kí ó ti jó!”'
  alternative: 'Ìbéèrè gígúnlẹ̀: “kí sì ni mo fẹ́ bí ó bá ti tanná?”'
  rationale: Gíríìkì náà ṣòro, ṣùgbọ́n ìtumọ̀ ìkéde ìfẹ́ ọkàn bá àyíká ọ̀rọ̀ mu, ó sì dára ní Yorùbá. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gígúnlẹ̀ tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. “Dà sí orí ilẹ̀ ayé” pa àwòrán líle mọ́, nígbà tí “fẹ́ gidigidi” sọ agbára ìfẹ́ ọkàn náà ní èdè àdánidá.
