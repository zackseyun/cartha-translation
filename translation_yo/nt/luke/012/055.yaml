source:
  edition: SBLGNT
  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: yo
  text: Nígbà tí ẹ̀fúùfù gúúsù bá ń fẹ́[a], ẹ máa ń sọ pé, ‘Ooru gbígbóná yóò wá[b],’ ó sì máa ń ṣẹlẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘gúúsù’—èyíinì ni, ẹ̀fúùfù gúúsù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ooru’ tàbí ‘ooru tí ń jóni.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: ẹ̀fúùfù gúúsù
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘gúúsù’ tàbí ‘ẹ̀fúùfù gúúsù’; pẹ̀lú πνέοντα (‘ń fẹ́’), ìtumọ̀ ojú-ọjọ́ náà hàn gbangba, èdè Yorùbá àdánidá sì béèrè ‘ẹ̀fúùfù gúúsù.’
- source_word: πνέοντα
  choice: bá ... ń fẹ́
  rationale: Ọ̀rọ̀ àbọ̀ ìsinsìnyí náà ń ṣàpèjúwe ẹ̀fúùfù tí ń fẹ́ lọ́wọ́; ‘bá ń fẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tí ń lọ lọ́wọ́ nínú gbólóhùn àsìkò.
- source_word: λέγετε
  choice: ẹ máa ń sọ
  rationale: Àmì ‘máa ń’ fi ìṣe àṣà tàbí ohun tí wọ́n sábà ń ṣe hàn, bí ìsinsìnyí gbogbogbò nínú Gíríìkì ṣe túmọ̀ sí níhìn-ín.
- source_word: Καύσων
  choice: ooru gbígbóná
  rationale: Καύσων tọ́ka sí ooru líle tí ń jóni; ‘ooru gbígbóná’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ἔσται
  choice: yóò mú
  rationale: Nípa àsọtẹ́lẹ̀ ojú-ọjọ́, ‘ooru ... yóò mú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ipò ooru yóò dé.
- source_word: γίνεται
  choice: ó sì máa ń rí bẹ́ẹ̀
  rationale: Èyí fi hàn pé àsọtẹ́lẹ̀ náà sábà máa ń ṣẹ gẹ́gẹ́ bí wọ́n ti sọ; ó bá ìtumọ̀ ìṣe àṣà nínú àyíká ọ̀rọ̀ mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Ẹ máa ń sọ’ àti ‘ó máa ń rí bẹ́ẹ̀’ mú ìṣe tí ó sábà ń ṣẹ hàn; àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ.
