id: LUK.12.5
reference: Luke 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: yo
  text: 'Ṣùgbọ́n èmi yóò fi ẹni tí ẹ yẹ kí ẹ bẹ̀rù hàn yín: Ẹ bẹ̀rù ẹni tí, lẹ́yìn tí ó ti pa ènìyàn, ó ní àṣẹ láti ju ènìyàn sínú Gẹhẹ́nà.[a] Bẹ́ẹ̀ ni, mo sọ fún yín, ẹ bẹ̀rù ẹni yìí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àpáàdì.” Ọ̀rọ̀ Gíríìkì náà ni Gẹhẹ́nà, ọ̀rọ̀ ìdájọ́ tí àwòrán rẹ̀ ní gbòǹgbò nínú Àfonífojì Hínómù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: èmi yóò fi … hàn yín
  rationale: Ó mú ìtumọ̀ fífi ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ hàn kedere, ó sì pa ọ̀nà ọ̀rọ̀ ọjọ́ iwájú mọ́ láìfi ìtumọ̀ ‘kìlọ̀’ kún un.
- source_word: τίνα φοβηθῆτε
  choice: ẹni tí ẹ yẹ kí ẹ bẹ̀rù
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àìtààrà náà, ó sì pa agbára ìtọ́ni rẹ̀ mọ́.
- source_word: φοβήθητε
  choice: ẹ bẹ̀rù
  rationale: Ọ̀rọ̀ àṣẹ náà tún ara rẹ̀ ṣe fún ìtẹnumọ́; ‘ẹ bẹ̀rù’ pa ìsopọ̀ ọ̀rọ̀ náà àti ìkìlọ̀ líle rẹ̀ mọ́.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: lẹ́yìn tí ó bá ti pa ènìyàn
  rationale: Ó fi ìtẹ̀lé àsìkò hàn ní Yorùbá àdánidá. Fífi ‘ènìyàn’ hàn mú gbolóhùn tí ọ̀rọ̀-ìṣe rẹ̀ nílò àbọ̀ yé ni Yorùbá, láìsọ irú ẹni náà ní pàtó.
- source_word: ἔχοντα ἐξουσίαν
  choice: ó ní àṣẹ
  rationale: ‘Àṣẹ’ sọ ἐξουσία gẹ́gẹ́ bí ẹ̀tọ́ tàbí ọlá-àṣẹ, kì í ṣe agbára lásán.
- source_word: ἐμβαλεῖν εἰς
  choice: láti ju … sínú
  rationale: ‘Ju … sínú’ jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere fún fífi agbára sọ ohun tàbí ẹni kan sínú ibì kan.
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ Gíríìkì náà mọ́ ní àkọsílẹ̀-ohùn Yorùbá, kí a má bàa fi gbogbo àwọn ìtumọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e rọ́pò àwòrán ìdájọ́ tó wá láti Àfonífojì Hínómù.
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó mú ìmúdájú àti ìtẹnumọ́ ọ̀rọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: τοῦτον
  choice: ẹni yìí
  rationale: Ó pa agbára arọ́pò-orúkọ aṣọ́ka náà mọ́ ju lílo ‘òun’ nìkan lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ γέεννα nínú ọ̀rọ̀ ìdájọ́
  choice: Gẹhẹ́nà
  alternative: àpáàdì
  rationale: Pípa orúkọ ibi náà mọ́ yàgò fún fífi àwọn èrò ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ọ̀rọ̀ Gíríìkì láìjẹ́ dandan. Àlàyé ìsàlẹ̀ ojú ìwé fi ọ̀nà ìtumọ̀ tí àwọn òǹkàwé mọ̀ sí i hàn.
- issue: Ẹni tí Jesu ń tọ́ka sí gẹ́gẹ́ bí ẹni tó ní àṣẹ
  choice: A kò dárúkọ ẹni náà ní pàtó
  alternative: Ọlọ́run
  rationale: Gíríìkì lo ‘ẹni náà’ láìdárúkọ Ọlọ́run ní tààràtà. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ tó yí ẹsẹ náà ká lè tọ́ka sí Ọlọ́run, ìtumọ̀ náà pa ìtọ́ka tí kò dárúkọ ẹni náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. Àtúnwí ‘ẹ bẹ̀rù’ àti ìtẹnumọ́ ‘ẹni yìí’ ni a pa mọ́.
