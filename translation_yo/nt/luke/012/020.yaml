source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run sọ fún un pé, ‘Aláìgbọ́n! Ní òru yìí gan-an ni a ń gba ìyè rẹ padà lọ́wọ́ rẹ[a]; àwọn ohun tí o sì ti pèsè sílẹ̀, ti ta ni wọn yóò jẹ́?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí rẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìyè” tàbí “ẹ̀mí,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Aláìgbọ́n!
  rationale: Ọ̀rọ̀ ànagbé yìí jẹ́ ìbáwí tààrà sí ẹni náà. “Aláìgbọ́n” jẹ́ ọ̀rọ̀ Yorùbá adayeba, ó sì pa agbára ìbáwí náà mọ́ láìfi ẹ̀gàn tí kò sí nínú Gíríìkì kún un.
- source_word: ταύτῃ τῇ νυκτί
  choice: Ní òru yìí gan-an
  rationale: “Gan-an” mú ìtẹnumọ́ àti ìkánjú tí àfihàn Gíríìkì náà ní jáde ní Yorùbá adayeba.
- source_word: ψυχήν
  choice: ẹ̀mí
  rationale: Nínú àyíká ikú tó sún mọ́lé, ψυχή lè tọ́ka sí ìyè ẹni tàbí ẹ̀mí rẹ̀. “Ẹ̀mí” jẹ́ yíyan adayeba ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn “ìyè” mọ́, kí a má bàa yanjú ìtumọ̀ tó ní ẹ̀ka méjì náà láìnídí.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: ni a ó béèrè ... lọ́wọ́ rẹ
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí béèrè ohun tí ó yẹ kí a dá padà tàbí gba ohun kan lọ́wọ́ ẹni. Ẹni tó ń ṣe ìbéèrè náà kò hàn gbangba nínú Gíríìkì; lílo “a” aláìtọ́kasí ní Yorùbá kò dá aṣojú tuntun sílẹ̀.
- source_word: ἃ δὲ ἡτοίμασας
  choice: àwọn ohun tí o sì ti pèsè sílẹ̀
  rationale: Èyí tọ́ka sí gbogbo ohun ìní tí ọkùnrin náà ti kójọ, ó sì jẹ́ Yorùbá tó ṣe kedere tí ó sún mọ́ ìtumọ̀ Gíríìkì.
- source_word: τίνι ἔσται
  choice: ti ta ni wọn yóò jẹ́?
  rationale: Ìbéèrè náà jẹ́ nípa ẹni tí àwọn ohun náà yóò jẹ́ tirẹ̀. Gbólóhùn yìí jẹ́ kúkúrú, adayeba, ó sì pa agbára ìbéèrè àsọyé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχή ní àyíká ikú
  choice: ẹ̀mí
  alternative: ìyè
  rationale: “Ẹ̀mí” lè jẹ́ ohun tí a ń béèrè lọ́wọ́ ẹni ní alẹ́ ikú rẹ̀ ní Yorùbá adayeba, ṣùgbọ́n ψυχή tún lè túmọ̀ sí ìyè. A fi àṣàyàn kejì sí àlàyé ìsàlẹ̀ láti pa àìdánilójú ìtumọ̀ Gíríìkì mọ́, láìfi ẹ̀kọ́ pàtó nípa ẹ̀dá ènìyàn wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìbáwí, ìkánjú, àti ìbéèrè àsọyé inú orísun Gíríìkì mọ́. “A ó béèrè” jẹ́ àkójọpọ̀ aláìtọ́kasí tó yẹ fún ọ̀rọ̀-ìṣe ọ̀pọ̀ tí kò sọ ẹni tó ṣe é.
