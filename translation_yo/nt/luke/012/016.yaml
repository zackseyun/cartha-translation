  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: yo
  text: Ó sì sọ àkàwé kan fún wọn pé, “Ilẹ̀ ọkùnrin ọlọ́rọ̀ kan mú èso jáde lọ́pọ̀lọpọ̀.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “so èso púpọ̀,” tàbí “jẹ́ ọlọ́mújáde gidigidi.”
    reason: Ìtumọ̀ míì fún εὐφόρησεν, ọrọ̀ tí ó lè túmọ̀ sí pé ilẹ̀ náà so èso púpọ̀ tàbí mú jáde lọ́pọ̀lọpọ̀.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ó sì pa
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó bá δέ mu, “pa àkàwé” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan sọ àkàwé.
- source_word: παραβολὴν
  choice: àkàwé kan
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìtàn àpẹẹrẹ tí ń kọ́ni, ó sì pa irú lítíréṣọ̀ àti ìtumọ̀ παραβολή mọ́.
- source_word: πρὸς αὐτοὺς
  choice: fún wọn
  rationale: Èyí fi hàn pé àwọn ni a bá sọ̀rọ̀, ní ọ̀nà tí ó ṣe déédé ní Yorùbá.
- source_word: λέγων
  choice: pé
  rationale: “Pé” ṣí ọ̀rọ̀ inú àkàwé náà sílẹ̀ lọ́nà Yorùbá àdánidá láìjẹ́ kí gbolohun náà le koko.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: ọkùnrin ọlọ́rọ̀ kan
  rationale: “Kan” ṣe aṣojú τινός, “ọkùnrin” sì pa akọ ẹnì kọ̀ọ̀kan inú orísun mọ́; ìbáṣepọ̀ onílé farahàn nípa fífi “ilẹ̀” síwájú rẹ̀.
- source_word: εὐφόρησεν
  choice: mú èso jáde lọ́pọ̀lọpọ̀
  rationale: Àṣàyàn yìí sọ ìmújáde rere àti ọ̀pọ̀ yanturu ti ilẹ̀ ọ̀gbìn ní kedere, ó sì jẹ́ èdè Yorùbá tí ó rọrùn.
- source_word: ἡ χώρα
  choice: Ilẹ̀
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀ yìí, χώρα túmọ̀ sí ilẹ̀ tàbí ilẹ̀ ọ̀gbìn ohun-ìní, kì í ṣe orílẹ̀-èdè.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “pa àkàwé” gẹ́gẹ́ bí ọ̀rọ̀ ìṣe Yorùbá tí ó dúró ṣinṣin.
