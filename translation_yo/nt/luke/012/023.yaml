  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: “Nítorí pé” ń ṣàfihàn γάρ; ìyè ń bá ψυχή mu nínú àyíká ìpèsè àti àníyàn; ìfiwéra ìyè/oúnjẹ àti ara/aṣọ sì péye. “Ṣe pàtàkì ju … lọ” ṣàlàyé ìfiwéra iye tí πλεῖον ń sọ ní ọ̀nà tí ó bá àyíká mu, láì fi ẹ̀kọ́ ẹ̀sìn kún un.'
