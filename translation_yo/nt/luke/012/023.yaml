id: LUK.12.23
reference: Luke 12:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: yo
  text: Nítorí pé ìyè ṣe pàtàkì ju oúnjẹ lọ[a], ara sì ṣe pàtàkì ju aṣọ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ọkàn”: ọ̀rọ̀ Gíríìkì ψυχή lè túmọ̀ sí “ìyè,” “ẹni fúnra rẹ̀,” tàbí “ọkàn”; níbí, àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún “ìyè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi ìdí àṣẹ tó ṣáájú múlẹ̀; ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìdí.
- source_word: ψυχή
  choice: ìyè
  rationale: Nínú ọ̀rọ̀ nípa jíjẹ, àníyàn, àti ohun tí ara nílò, ψυχή túmọ̀ sí ìyè ẹni, kì í ṣe dandan ọkàn gẹ́gẹ́ bí apá tí kì í ṣe ti ara.
- source_word: πλεῖόν
  choice: ṣe pàtàkì ju ... lọ
  rationale: Ìfiwéra náà ń tọ́ka sí iye àti pàtàkì ohun; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún ìtumọ̀ líle bí ‘pọ̀ ju.’
- source_word: τροφή
  choice: oúnjẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ohun tí a ń jẹ láti gbé.
- source_word: σῶμα
  choice: ara
  rationale: Ó ń tọ́ka sí ara ènìyàn ní ti gidi, ní ìbámu pẹ̀lú aṣọ.
- source_word: ἔνδυμα
  choice: aṣọ
  rationale: Ọ̀rọ̀ Yorùbá tó rọrùn, tó sì wọ́pọ̀ fún ohun tí a fi bo ara.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ẹ̀kọ́ nípa àníyàn àti ìpèsè
  choice: ìyè
  alternative: ọkàn
  rationale: Ìfiwéra ψυχή pẹ̀lú oúnjẹ àti ara pẹ̀lú aṣọ fi hàn pé ìyè ẹni ní ayé ni àyíká ọ̀rọ̀ náà ń tọ́ka sí. Èyí kò tako àwọn ibi míì tí ψυχή ti lè túmọ̀ sí ‘ọkàn.’
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ṣe kedere fún òǹkàwé gbogbogbò. A tún ‘ṣe pàtàkì ju ... lọ’ sọ nínú ìdajì kejì kí ìfiwéra náà péye, bó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀ náà sílẹ̀ níbẹ̀.
