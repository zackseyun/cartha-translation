source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa wá ìjọba rẹ̀[b][a], a ó sì fi àwọn nǹkan wọ̀nyí kún ohun tí ẹ ní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘ìjọba Ọlọ́run’; ọ̀rọ̀ Gíríìkì ní ‘ìjọba rẹ̀,’ àyíká ọ̀rọ̀ sì fi ẹni tí ‘rẹ̀’ ń tọ́ka sí hàn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘ìjọba Ọlọ́run’ dípò ‘ìjọba rẹ̀.’
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ohun tí Jésù ń pàṣẹ yàtọ̀ sí lílépa àwọn ohun àìní ti ara tí ó ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn; ‘Ṣùgbọ́n’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára ìyàtọ̀ náà mọ́.
- source_word: ζητεῖτε
  choice: ẹ máa wá
  rationale: Àṣẹ ìsinsìnyí tọ́ka sí ìwá tí ó ń bá a lọ. ‘Ẹ máa wá’ fi ìtẹ̀síwájú yìí hàn ní Yorùbá àdánidá.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: ‘Ìjọba’ jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn mọ̀, ó sì lè gba ìtumọ̀ agbára ìṣàkóso àti ilẹ̀ tàbí àgbègbè ìjọba, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe lè túmọ̀ sí.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ọlọ́run nínú àyíká ẹsẹ̀ náà. ‘Rẹ̀’ pa ìrísí Gíríìkì mọ́ láìfi orúkọ tí kò sí nínú ọ̀rọ̀ àkọ́kọ́ kún un.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ohun kòṣeémánìí tí a mẹ́nu kàn ní àyíká ọ̀rọ̀ náà. A kò fi ‘gbogbo’ kún un, nítorí kò sí nínú ẹ̀rí àkọ́kọ́ tí a tẹ̀ lé ní Lúùkù.
- source_word: προστεθήσεται
  choice: a ó sì fi … kún un
  rationale: Ìtumọ̀ yìí pa àwòrán fífi ohun kan kún ohun mìíràn mọ́, ó sì lo ọ̀nà àìdárúkọ olùṣe tí ó wọ́pọ̀ ní Yorùbá láti ṣojú ọ̀rọ̀ ìṣe aláìṣe Gíríìkì.
- source_word: ὑμῖν
  choice: fún yín
  rationale: ‘Fún yín’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé àwọn ohun náà ni a ó fi kún ohun tí àwọn olùgbọ́ yóò rí gbà.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (‘rẹ̀’) ń tọ́ka sí
  choice: A pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí ‘ìjọba rẹ̀,’ nígbà tí àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni ó ń tọ́ka sí.
  alternative: A lè sọ ọ́ ní tààràtà pé ‘ìjọba Ọlọ́run.’
  rationale: Àyíká ọ̀rọ̀ sọ̀rọ̀ nípa Baba àti ìtọ́jú Ọlọ́run, nítorí náà ẹni tí ‘rẹ̀’ ń tọ́ka sí ṣe kedere. Síbẹ̀, pípa ọ̀rọ̀ arọ́pò-orúkọ mọ́ bọ̀wọ̀ fún irú ọ̀rọ̀ Gíríìkì, kò sì mú ìtumọ̀ kan tí ó ju ohun tí ẹsẹ̀ náà sọ lọ wọlé.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. ‘Ẹ máa wá’ mú ìṣe tí ń bá a lọ hàn; ìkọ̀wé ‘a ó fi … kún un fún yín’ pa àwòrán ìfikún àti àìdárúkọ olùṣe mọ́.
