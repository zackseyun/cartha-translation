reference: Luke 12:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: yo
  text: Nítorí níbi tí ìṣúra yín wà, ibẹ̀ ni ọkàn yín yóò wà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí níbi yòówù tí ìṣúra yín wà, ibẹ̀ ni ọkàn yín yóò wà náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ibi tí ... bá wà
  rationale: Ó ṣe àfihàn ibi ní ọ̀nà àdánidá nínú Yorùbá, ó sì lè gbé ìtumọ̀ ‘where’ tàbí ‘wherever’ gẹ́gẹ́ bí ọ̀rọ̀ òwe.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé tí ó so ẹsẹ̀ yìí mọ́ ìtọ́ni tó ṣáájú mọ́.
- source_word: θησαυρός
  choice: ìṣúra
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ohun iyebíye tí a kó pamọ́, ó sì pa agbára ìtumọ̀ gidi àti àkàwé mọ́.
- source_word: καρδία
  choice: ọkàn
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Bíbélì àti Yorùbá àdánidá fún àárín ìfẹ́, èrò, àti ìfaramọ́ ènìyàn, láì dín ìtumọ̀ rẹ̀ kù sí apá kan ṣoṣo.
- source_word: ἐκεῖ
  choice: ibẹ̀
  rationale: Ó pa ìbámu ibi tí ... ibẹ̀ mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ní ipò yìí, ‘pẹ̀lú’ fi hàn pé ọkàn náà ń tẹ̀ lé ibi tí ìṣúra wà.
- source_word: ἔσται
  choice: yóò wà
  rationale: Ó pa àkókò ọjọ́ iwájú tó hàn gbangba nínú Gíríìkì mọ́, ó sì bá Yorùbá òde òní mu.
- source_word: ὑμῶν
  choice: yín
  rationale: Ó ṣe àfihàn arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ nínú àwọn ibi méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ ọkàn nínú ẹ̀kọ́ nípa ènìyàn
  choice: A pa ‘ọkàn’ mọ́ gẹ́gẹ́ bí àárín ìfẹ́, èrò, àti ìfaramọ́ ènìyàn.
  alternative: Kí a túmọ̀ rẹ̀ ní ọ̀nà ìtumọ̀ sí ‘ìfẹ́-ọkàn’ tàbí ‘èrò inú’.
  rationale: Ọ̀rọ̀ òwe yìí sọ pé ìṣípayá inú ènìyàn ń tẹ̀ lé ohun tí ó kà sí iyebíye. ‘Ọkàn’ pa ìjìnlẹ̀ àti àgbègbè ìtumọ̀ Gíríìkì mọ́ láì fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A lo ‘ibi tí ... bá wà’ láti pa ìṣòro yíyan láàárín ‘where’ àti ‘wherever’ mọ́, pẹ̀lú àlàyé ẹsẹ̀ ìsàlẹ̀ fún ọ̀nà tó túbọ̀ gbòòrò.
