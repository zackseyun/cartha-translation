  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: yo
  text: Àti ẹ̀yin, ẹ má ṣe máa wá ohun tí ẹ ó jẹ àti ohun tí ẹ ó mu, ẹ má sì ṣe yọ ara yín lẹ́nu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe dààmú,” “ẹ má ṣe jẹ́ kí ọkàn yín rú”; tàbí, ní ìtumọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí àwòrán rẹ̀, “ẹ má ṣe wà ní ìfojúsọ́nà aláìbalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ní ìtẹnumọ́; “Ẹ̀yin náà” mú ìyàtọ̀ sí àwọn ẹyẹ inú àyíká ẹsẹ náà jáde lọ́nà àdánidá.
- source_word: ζητεῖτε
  choice: ẹ má ṣe máa wá
  rationale: “Má ṣe máa wá” fi ìwà tí ń bá a lọ nínú àṣẹ ìdènà hàn, ó sì tọ́ka sí fífi ọkàn lé wíwá ohun ìjẹun, kì í ṣe ìṣètò ojoojúmọ́ lásán.
- source_word: τί φάγητε
  choice: ohun tí ẹ ó jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbéèrè tí kò tíì ní ìdáhùn nípa oúnjẹ, láì sọ ọ́ di àsọtẹ́lẹ̀ tó dájú jù.
- source_word: τί πίητε
  choice: ohun tí ẹ ó mu
  rationale: Ó bá ìṣètò tí φάγητε mu, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àníyàn nípa ohun mímu.
- source_word: μετεωρίζεσθε
  choice: ẹ má sì ṣe jẹ́ kí àníyàn mú yín
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdàrúdàpọ̀ ọkàn tàbí wíwà nínú ìfojúsọ́nà aláìbalẹ̀. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán “wíwà ní ìdádúró” mọ́.
- source_word: καὶ ... καὶ ... καὶ
  choice: náà ... àti ... sì
  rationale: A ṣe àtúnṣe ìsopọ̀ náà sí ìlò Yorùbá àdánidá, nígbà tí a pa ìkójọpọ̀ àwọn àṣẹ àti àwọn ohun méjèèjì mọ́.
theological_decisions:
- issue: Bí a ṣe máa sọ ìdènà nípa oúnjẹ àti ohun mímu láì fi ẹ̀kọ́ pé ohun ti ara kò dára sí i
  choice: Ìdènà fún wíwá ohun ìjẹun pẹ̀lú àníyàn àti ìdàrúdàpọ̀ ọkàn
  alternative: Ìdènà fún gbogbo ìṣètò oúnjẹ àti ohun mímu
  rationale: Àyíká ọ̀rọ̀ náà dá lórí àníyàn nípa ohun tí ara nílò, kì í ṣe pé a kò gbọ́dọ̀ pèsè fún ìgbésí ayé ojoojúmọ́ tàbí pé oúnjẹ àti ohun mímu jẹ́ ohun búburú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμεῖς, a sì fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
