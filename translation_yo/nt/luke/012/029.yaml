  source_fidelity: 'Ìtumọ̀ náà gba ìpìlẹ̀ ẹsẹ náà dáadáa: ìdènà lórí wíwá ohun tí a ó jẹ àti ohun tí a ó mu, pẹ̀lú ìdènà lórí ìdààmú ọkàn. Ṣùgbọ́n “Ẹ̀yin náà” túmọ̀ sí “ẹ̀yin pẹ̀lú/ẹ̀yin náà,” tí ó lè fi ìtumọ̀ “too/also” kún ìtẹnumọ́ ὑμεῖς àti καί láìní ìdí tó lágbára nínú ọ̀rọ̀ Gíríìkì. “Ẹ̀yin” nìkan, lẹ́yìn “Àti,” dá ìtẹnumọ́ náà mú dáadáa.'
  naturalness: “Ẹ má ṣe máa wá” àti “ohun tí ẹ ó jẹ ... ohun tí ẹ ó mu” jẹ́ Yorùbá òde òní tó mọ́. A tún ọ̀rọ̀ ìkẹyìn ṣe sí “ẹ má sì ṣe yọ ara yín lẹ́nu,” èyí tí ó jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn fún ìdààmú tàbí ìdàrúdàpọ̀ ọkàn nínú àyíká yìí. Àlàyé ìsàlẹ̀ ojú ìwé ti di mímọ́ sí i, ó sì yàgò fún gbólóhùn àwòrán tí kò rọrùn, “wà ní ìdádúró aláìbalẹ̀.”
