source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún un pé, “Ọkùnrin, ta ni ó yàn mí ṣe onídàájọ́ tàbí olùpín lórí yín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ ìpè tààrà sí ọkùnrin náà; èyí jẹ́ Yorùbá àdánidá, ó sì pa ìwọ̀n ọ̀rọ̀ Jesu mọ́ láìfi ẹ̀gàn kún un.
- source_word: κριτὴν
  choice: onídàájọ́
  rationale: Ó túmọ̀ sí ẹni tí a yàn láti dá ẹjọ́ tàbí pinnu àríyànjiyàn.
- source_word: μεριστὴν
  choice: olùpín ogún
  rationale: Ní àyíká ẹsẹ tó ṣáájú, ohun tí wọ́n fẹ́ kí Jesu pín ni ogún; àfikún ‘ogún’ mú iṣẹ́ náà ṣe kedere ní Yorùbá, láìyí ìtumọ̀ rẹ̀ padà.
- source_word: ἐφ’ ὑμᾶς
  choice: láàárín yín
  rationale: Nínú àríyànjiyàn ìpín ogún, gbolohun náà tọ́ka sí àṣẹ láti dájọ́ tàbí pín nǹkan láàárín àwọn méjèèjì.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jesu kọ gbogbo ipa rẹ̀ gẹ́gẹ́ bí onídàájọ́
  choice: Pa ìbéèrè ìfèsì náà mọ́ gẹ́gẹ́ bí ìdáhùn sí ẹni tó fẹ́ fi í ṣe adájọ́ ìpín ogún.
  alternative: Túmọ̀ ọ́ bí ìkọ̀ gbogbo àṣẹ ìdájọ́ Jesu.
  rationale: Ẹsẹ náà ń sọ ní pàtó nípa ẹni tó ‘yàn’ án sí ipa yìí nínú àríyànjiyàn wọn; kò yẹ kí ìtumọ̀ fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò sí i kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ṣùgbọ́n’ fún δέ, a sì jẹ́ kí ìbéèrè náà dúró ní fọ́ọ̀mù ìfèsì rẹ̀.
