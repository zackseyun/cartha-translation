id: LUK.12.25
reference: Luke 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: yo
  text: Ta sì ni nínú yín tí ó lè, nípa àníyàn, fi ìwọ̀n ìgbọ̀nwọ́ kan kún ìgbà ayé rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ìwọ̀n ìgbọ̀nwọ́ kan kún ìga rẹ̀?” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbà ayé tàbí ìga.
    reason: Láti pa ìtumọ̀ méjèèjì tí ἡλικία lè ní mọ́, láìyanjú àìdánilójú inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ ní ìkọ̀kọ̀.
lexical_decisions:
- source_word: μεριμνῶν
  choice: nípa ṣíṣe àníyàn
  rationale: Ó túmọ̀ sí jíjẹ́ kí ọkàn máa dààmú tàbí ṣíṣe àníyàn; gbólóhùn yìí ṣe àfihàn ọ̀nà tí ẹni náà fi ń gbìyànjú láti mú ohun kan ṣẹ.
- source_word: ἡλικίαν
  choice: ìgbà ayé
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọjọ́-orí, ìgbà ayé, tàbí ìga ara. Nítorí àwòrán fífi ìgbọ̀nwọ́ kan kún un àti àyíká ọ̀rọ̀ nípa àníyàn fún ìyè, ‘ìgbà ayé’ bá ọ̀rọ̀ mu, ṣùgbọ́n a pa ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: πῆχυν
  choice: ìgbọ̀nwọ́ kan
  rationale: Ìwọ̀n láti igunpa dé ṣóńṣó ọwọ́ ni πῆχυς; lílo orúkọ ìwọ̀n náà pa àwòrán ìpilẹ̀ṣẹ̀ mọ́ dípò yíyí i padà sí ìwọ̀n àkókò.
- source_word: δύναται … προσθεῖναι
  choice: tí ó lè fi … kún
  rationale: Ó fi agbára tàbí àìlágbára ẹni láti ṣe ohun náà hàn ní kedere, ó sì tẹ̀ lé ìtumọ̀ ‘láti fi kún un.’
theological_decisions:
- issue: Bóyá ἡλικία ń tọ́ka sí ìgbà ayé tàbí ìga ara
  choice: ìgbà ayé
  alternative: ìga ara
  rationale: Àyíká ọ̀rọ̀ Lúùkù 12 ń sọ nípa àníyàn fún ìyè, aṣọ, àti oúnjẹ, nítorí náà ‘ìgbà ayé’ ṣeé ṣe gan-an. Síbẹ̀, èdè Gíríìkì kò mú ‘ìga ara’ kúrò pátápátá, torí náà àlàyé ìsàlẹ̀ jẹ́ kí àìdánilójú gidi náà dúró.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. ‘Ta sì ni nínú yín’ pa δέ mọ́ gẹ́gẹ́ bí ìtẹ̀síwájú ọ̀rọ̀, ‘nípa ṣíṣe àníyàn’ sì jẹ́ àdàkọ àdánidá fún participle Gíríìkì.
