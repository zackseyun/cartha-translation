id: LUK.12.45
reference: Luke 12:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹrú[a] náà bá sọ nínú ọkàn rẹ̀ pé, ‘Ọ̀gá mi[b] ń pẹ́ láti dé,’ tí ó sì bẹ̀rẹ̀ sí í lu àwọn ìránṣẹ́ ọkùnrin àti àwọn ìránṣẹ́ obìnrin, àti sí í jẹ, sí í mu, àti sí í mutí yó,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì δοῦλος ń tọ́ka sí ẹni tí ó wà ní ipò ẹrú lábẹ́ ọ̀gá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “olúwa mi.” Níbí, ọ̀rọ̀ Gíríìkì κύριος ń tọ́ka sí ọ̀gá ilé nínú àkàwé náà.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” fi ipò ẹni tí ó wà lábẹ́ agbára olówó rẹ̀ hàn kedere ju “ìránṣẹ́” lọ, èyí sì bá ètò ilé àti jíjíhìn tí àkàwé náà tẹnumọ́ mu.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nínú ọkàn rẹ̀
  rationale: Ó pa àwòrán èdè Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó bójú mu láti fi èrò ìkọ̀kọ̀ inú ẹni hàn.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: ń pẹ́ láti dé
  rationale: Ó sọ ìdádúró tí ó ń lọ lọ́wọ́ ní èdè Yorùbá àdánidá, “dé” sì mú ìrètí ipadà ọ̀gá náà ṣe kedere.
- source_word: κύριός μου
  choice: Ọ̀gá mi
  rationale: Nínú àkàwé ilé yìí, κύριος ni ẹni tí ó ga ju ẹrú lọ; “ọ̀gá” fi ìbáṣepọ̀ ènìyàn yẹn hàn láì mú kí a kọ́kọ́ ka ọ́ sí orúkọ oyè Ọlọ́run.
- source_word: ἄρξηται τύπτειν
  choice: bẹ̀rẹ̀ sí í lu
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe náà mọ́, “lu” sì lè sọ ìwà ìkà tí ó ń bá a lọ ní àyíká yìí.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: àwọn ìránṣẹ́ ọkùnrin àti àwọn ìránṣẹ́ obìnrin
  rationale: Ó pa ìyàtọ̀ akọ àti abo inú Gíríìkì mọ́, ó sì yẹra fún dídájọ́ pé gbogbo àwọn tí a ń lù náà jẹ́ ẹrú nígbà tí παῖς/παιδίσκη lè túmọ̀ sí ìránṣẹ́ nínú àyíká ilé.
- source_word: μεθύσκεσθαι
  choice: ń mutí yó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì sọ mímu ọtí dé ipò ìmutípara ní kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος níbi tí ó ti ń tọ́ka sí olórí ilé ènìyàn nínú àkàwé
  choice: ọ̀gá
  alternative: olúwa
  rationale: “Ọ̀gá” bá ìbáṣepọ̀ inú ilé mu, ó sì dènà kí òǹkàwé má ṣe fi tipátipá ka κύριος níhìn-ín sí oyè Ọlọ́run tàbí Mèsáyà, bí ó tilẹ̀ jẹ́ pé àkàwé náà ní ìtumọ̀ ẹ̀kọ́ ìsìn.
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé yìí
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìṣàkóso, jíjíhìn, àti agbára ọ̀gá lórí ẹni náà ṣe pàtàkì nínú àyíká; “ẹrú” pa ipò ìdè rẹ̀ mọ́ ju ọ̀rọ̀ gbogbogbò “ìránṣẹ́” lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá. A pa ọ̀rọ̀ inú ọkàn àti ìtẹ̀síwájú àwọn ìṣe náà mọ́, a sì fi kọ́mà sí òpin nítorí gbolohun náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
