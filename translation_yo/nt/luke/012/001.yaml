  to: Ní àkókò náà[a], nígbà tí àwọn ogunlọ́gọ̀ ènìyàn ti péjọ pọ̀, débi pé wọ́n ń tẹ ara wọn, ó bẹ̀rẹ̀ sí í sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ lákọ̀ọ́kọ́ pé, “Ẹ ṣọ́ra fún ìwúkàrà àwọn Farisí[b], èyí tí í ṣe àgàbàgebè.”
