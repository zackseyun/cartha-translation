id: LUK.12.1
reference: Luke 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: yo
  text: Ní àkókò náà[a], nígbà tí àwọn ogunlọ́gọ̀ ènìyàn ti péjọ pọ̀, débi pé wọ́n ń tẹ ara wọn, ó bẹ̀rẹ̀ sí í sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ lákọ̀ọ́kọ́ pé, “Ẹ ṣọ́ra fún ìwúkàrà àwọn Farisí[b], èyí tí í ṣe àgàbàgebè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní àárín àwọn ìṣẹ̀lẹ̀ wọ̀nyí.”
    reason: Ó pa àṣàyàn ìtumọ̀ àkókò àti ipò inú Ἐν οἷς mọ́.
  - marker: b
    text: Tàbí, “Ẹ máa ṣọ́ ara yín fún ìwúkàrà àwọn Farisí.”
    reason: Ó fi àṣàyàn tó tú ἑαυτοῖς àti ἀπό jáde ní kíkún hàn.
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Lákòókò náà, nígbà tí
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí so mọ́ ohun tó ṣáájú rẹ̀, ó sì jẹ́ ọ̀rọ̀ àkókò àti ipò, kì í ṣe ti ibi.
- source_word: ἐπισυναχθεισῶν
  choice: péjọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọ̀pọ̀ ènìyàn ti kóra jọ; ìtumọ̀ aláìṣe tààrà kò lágbára tó nínú àyíká yìí láti béèrè gbolohun líle.
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: ẹgbẹẹgbẹ̀rún púpọ̀ ènìyàn
  rationale: μυριάδες lè túmọ̀ sí ẹgbẹ̀rún mẹ́wàá lọ́nà pàtó tàbí ọ̀pọ̀lọpọ̀ ènìyàn ní gbogbogbòò; yíyan yìí fi bí ogunlọ́gọ̀ náà ṣe pọ̀ hàn láìfi iye pàtó tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: tó bẹ́ẹ̀ tí wọ́n fi ń tẹ ara wọn mọ́lẹ̀
  rationale: Ó ṣàfihàn àbájáde ìpéjọpọ̀ náà àti bí ìtẹ̀mọ́lẹ̀ náà ṣe ń lọ lọ́wọ́.
- source_word: ἤρξατο λέγειν
  choice: ó bẹ̀rẹ̀ sí í sọ
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ọ̀rọ̀ mọ́ ní Yorùbá tó ṣe déédé.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: ó kọ́kọ́ ... sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ìṣètò yìí fi hàn pé àwọn ọmọ-ẹ̀yìn ni ó kọ́kọ́ bá sọ̀rọ̀, láìsọ pé ó dájú pé ọ̀rọ̀ míì tẹ̀ lé e.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Ẹ ṣọ́ra fún
  rationale: Èyí ni ìkìlọ̀ Yorùbá àdánidá tó ní agbára, ó sì ní èrò ìṣọ́ra fún ààbò ẹni nínú rẹ̀.
- source_word: τῆς ζύμης
  choice: ìwúkàrà
  rationale: Ó pa àwòrán ohun tó ń mú ìyẹ̀fun wú mọ́, dípò fífi ìtumọ̀ àkóràn tàbí ẹ̀kọ́ sí i láti inú ìtumọ̀ onítumọ̀.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: èyí tí í ṣe àgàbàgebè
  rationale: Ó ṣàlàyé ohun tí àwòrán ìwúkàrà ń tọ́ka sí ní tààrà, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: τῶν Φαρισαίων
  choice: àwọn Farisí
  rationale: Ó fi ìwúkàrà náà hàn gẹ́gẹ́ bí ohun tó jẹ́ ti àwọn Farisí tàbí tó ń ṣàpèjúwe wọn.
theological_decisions:
- issue: Agbára àpẹẹrẹ ‘ìwúkàrà’
  choice: Pa ‘ìwúkàrà’ mọ́ gẹ́gẹ́ bí àpẹẹrẹ, kí ọ̀rọ̀ náà fúnra rẹ̀ sì dá a mọ̀ sí àgàbàgebè.
  alternative: Túmọ̀ ọ́ ní tààrà sí ‘ẹ̀kọ́’ tàbí ‘agbára búburú tó ń tàn ká.’
  rationale: Lúùkù fúnra rẹ̀ ṣàlàyé àpẹẹrẹ náà; nítorí náà, kò yẹ kí ìtumọ̀ rọ́pò àwòrán náà pẹ̀lú ìtumọ̀ ẹ̀kọ́ ìsìn tóóró.
- issue: Ohun tí πρῶτον ń ṣe àfihàn
  choice: Jésù kọ́kọ́ bá àwọn ọmọ-ẹ̀yìn rẹ̀ sọ̀rọ̀.
  alternative: Ka a sí àmì ìbẹ̀rẹ̀ ọ̀rọ̀ pé, ‘Lákọ̀ọ́kọ́ ná.’
  rationale: Gíríìkì lè gba méjèèjì, ṣùgbọ́n ìtumọ̀ yìí pa ìtẹnumọ́ ẹni tí ó kọ́kọ́ ń bá sọ̀rọ̀ mọ́ láìfi ìtẹ̀síwájú tí a kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tó ṣe déédé fún òǹkàwé òde òní. ‘Ìwúkàrà’ àti ‘àgàbàgebè’ pa àwòrán Bíbélì àti ìtẹnumọ́ ìwà ẹ̀sìn àgàbàgebè mọ́.
