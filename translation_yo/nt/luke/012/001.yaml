  source_fidelity: Ìtumọ̀ náà mú ìbáṣepọ̀ àkókò ti Ἐν οἷς, ìpéjọpọ̀ ọ̀pọ̀ ènìyàn, àbájáde ìtẹ̀ ara wọn, àwòrán ìwúkàrà, àti ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí àgàbàgebè hàn dáadáa. Síbẹ̀, “ó kọ́kọ́ bẹ̀rẹ̀ sí í sọ” lè túmọ̀ sí pé ìbẹ̀rẹ̀ sí í sọ ni ó wà ní àkọ́kọ́, dípò pé àwọn ọmọ-ẹ̀yìn ni Jésù kọ́kọ́ bá sọ̀rọ̀. A tún yẹ kí a fi ọ̀rọ̀ tó sun mọ́ ‘ogunlọ́gọ̀’ lò fún μυριάδες.
