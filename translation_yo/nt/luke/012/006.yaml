id: LUK.12.6
reference: Luke 12:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: yo
  text: Ṣé a kì í ta ẹyẹ ológoṣẹ́ márùn-ún ní asáríà méjì? Síbẹ̀, kò sí ọ̀kan nínú wọn tí a gbàgbé níwájú Ọlọ́run.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní owó idẹ kéékèèké méjì”; asáríà jẹ́ owó idẹ Róòmù kéékèèké.
    reason: cultural_note
  - marker: b
    text: Tàbí, “a kò fojú fo ọ̀kan nínú wọn níwájú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: ẹyẹ ológoṣẹ́
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí ẹyẹ ológoṣẹ́ ní àyíká ọ̀rọ̀ yìí; ó ṣe pàtó ju ‘àwọn ẹyẹ kéékèèké’ lọ, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: πωλοῦνται
  choice: ohun tí a ń tà
  rationale: Èyí fi ìṣe àìsọ ẹni tó ń ṣe é (passive) inú Gíríìkì hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀσσαρίων δύο
  choice: ní asáríà méjì
  rationale: A pa orúkọ owó Róòmù àtijọ́ náà mọ́ láì fi iye owó òde òní tí kò péye rọ́pò rẹ̀; àlàyé wà ní àlàyé ìsàlẹ̀.
- source_word: ἐπιλελησμένον
  choice: tí a gbàgbé
  rationale: Ìtumọ̀ yìí sún mọ́ ipò pípé tí participle náà ń sọ, ó sì mọ́gbọ́n dání ní Yorùbá ju gbólóhùn bí ‘tí kò sí ní ìrántí’ lọ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì pa èrò pé ohun náà wà ní ojú tàbí níwájú Ọlọ́run mọ́ láì túmọ̀ rẹ̀ sí ẹ̀kọ́ ìsìn tó gbòòrò sí i.
- source_word: οὐχὶ ... ;
  choice: Ṣé ... kì í ṣe ...?
  rationale: Ìbéèrè ọ̀rọ̀-àtakò yìí ń retí ìdáhùn ìfẹ̀sẹ̀múlẹ̀, èyí sì jẹ́ ọ̀nà àdánidá láti fi agbára náà hàn ní Yorùbá.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: Síbẹ̀, kò sí ọ̀kan nínú wọn
  rationale: ‘Síbẹ̀’ mú ìyàtọ̀ láàárín iye tí ó kéré tí wọ́n fi ń tà àwọn ẹyẹ náà àti bí Ọlọ́run kò ṣe gbàgbé ọ̀kan pàápàá hàn, láì yí èrò Gíríìkì padà.
theological_decisions:
- issue: Èdè nípa ìrántí àti àbójútó Ọlọ́run
  choice: kò sí ọ̀kan nínú wọn tí a gbàgbé níwájú Ọlọ́run
  alternative: Ọlọ́run kò fojú fo ọ̀kan nínú wọn
  rationale: ‘Tí a gbàgbé níwájú Ọlọ́run’ sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìṣe pàtó rẹ̀ mọ́; kò sọ̀rọ̀ náà di ẹ̀kọ́ nípa àbójútó Ọlọ́run tó ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Ṣé’ àti ‘Síbẹ̀’ jẹ́ àdánidá fún òǹkàwé gbogbogbò, nígbà tí ‘asáríà’ pa àṣà àti pàtó ọrọ̀ orísun mọ́; gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
