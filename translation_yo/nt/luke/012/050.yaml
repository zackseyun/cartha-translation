source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: yo
  text: Ṣùgbọ́n mo ní ìbatisí kan láti gba,[a] báwo ni ó sì ti ń tẹ̀ mí mọ́lẹ̀ títí a ó fi mú un ṣẹ![b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, ‘Mo ní ìbatisí kan tí mo gbọ́dọ̀ gba.’ Gíríìkì náà tún ọ̀rọ̀ ‘ìbatisí’ náà ṣe nínú ìṣe-ọrọ náà.
    reason: lexical_alternative
  - marker: b
    text: ‘Ìbatisí’ níhìn-ín jẹ́ àkàwé fún ìjìyà líle tí Jésù fẹ́ dojú kọ; ní àyíká yìí, èyí ní í ṣe pẹ̀lú ikú rẹ̀.
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ apá yìí pé, ‘Báwo ni mo ṣe wà lábẹ́ ìkálọ́wọ́kò,’ tàbí ‘Bí ohun náà ti ń tẹ̀ mí mọ́lẹ̀ tó,’ títí a ó fi mú un ṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ìbatisí kan
  rationale: A pa àwòrán ìbatisí inú Gíríìkì mọ́, dípò fífi ‘ìjìyà’ tàbí ‘ikú’ rọ́pò rẹ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἔχω βαπτισθῆναι
  choice: mo ní ìbatisí kan tí a ó fi baptisi mi
  rationale: Ìtúmọ̀ yìí pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́—‘ìbatisí…baptisi’—ó sì fi hàn pé ohun náà ń bọ̀ wá ṣẹlẹ̀ sí Jésù.
- source_word: πῶς συνέχομαι
  choice: ìpọ́njú sì pọ̀ mí tó
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìmọ̀lára líle ti ẹni tí ohun ń tẹ̀ mọ́lẹ̀ tàbí tí ó wà lábẹ́ ìkálọ́wọ́kò, láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ ju ẹ̀rí Gíríìkì lọ.
- source_word: ἕως ὅτου
  choice: títí tí
  rationale: Ó sọ ibi tí àkókò ìpọ́njú náà yóò parí ní Yorùbá àdánidá.
- source_word: τελεσθῇ
  choice: yóò fi parí
  rationale: Ó mú ìtumọ̀ píparí ohun tí a ti pinnu ṣẹ̀, láìgbe ọ̀rọ̀ pàtó láti inú Jòhánù 19:30 wọlé.
theological_decisions:
- issue: Ohun tí ‘ìbatisí’ dúró fún ní àkàwé
  choice: A pa àwòrán ìbatisí mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ó tọ́ka sí ìjìyà àti ikú Jésù tí ń bọ̀.
  alternative: Kí a túmọ̀ rẹ̀ tààrà sí ‘ìjìyà,’ tàbí kí a kà á sí ìbatisí omi gangan.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìjìyà Jésù tí ń bọ̀, ṣùgbọ́n àwòrán ìbatisí jẹ́ apá pàtàkì nínú bí Jésù ṣe sọ ọ́; nítorí náà, a kò yọ ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní; a lo ‘ìbatisí/baptisi’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì pa àwòrán àti àìdájú συνέχομαι mọ́ nípasẹ̀ ọ̀rọ̀ pàtàkì àti àlàyé ìsàlẹ̀.
