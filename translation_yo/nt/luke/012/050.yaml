revisions:
- from: Ṣùgbọ́n mo ní ìbatisí kan tí a ó fi baptisi mi,[a][b] ìpọ́njú sì pọ̀ mí tó títí tí yóò fi parí![c]
  to: Ṣùgbọ́n mo ní ìbatisí kan láti gba,[a] báwo ni ó sì ti ń tẹ̀ mí mọ́lẹ̀ títí a ó fi mú un ṣẹ![b][c]
  rationale: A rọ́pò ìṣọ̀kan tí kò dára náà pẹ̀lú ‘láti gba,’ èyí tí ó jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti sọ ìbatisí tí Jésù ní láti gba. A tún rọ́pò ‘ìpọ́njú sì pọ̀ mí tó’ pẹ̀lú ‘ó ń tẹ̀ mí mọ́lẹ̀,’ kí ìtumọ̀ συνέχομαι—wíwà lábẹ́ ìtẹ̀, ìkálọ́wọ́kò, tàbí ìdààmú—má bàa sọnù. ‘Títí a ó fi mú un ṣẹ’ ń pa èrò τελεσθῇ, ìyẹn píparí/mímú ìbatisí náà ṣẹ, mọ́ láìfi ọ̀rọ̀ pàtó inú Jòhánù 19:30 wọlé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:40Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe ni a nílò. Ọ̀rọ̀ náà gbọdọ̀ pa ‘ìbatisí’ gẹ́gẹ́ bí àwòrán mọ́, kí ó sì sọ ìdààmú/ìkálọ́wọ́kò tí συνέχομαι ń fi hàn láìyí i padà sí gbolohun tí ó dà bí pé ìpọ́njú fúnra rẹ̀ ‘pọ̀’ sí ẹni. ‘A ó fi baptisi mi’ tún jẹ́ ìṣọ̀kan ọ̀rọ̀ tí kò dára ní Yorùbá boṣewa nínú àyíká yìí.
  naturalness: ‘Mo ní ìbatisí kan láti gba’ jẹ́ Yorùbá àdánidá, ó sì bójú mu fún ìdíwọ̀n/ìṣẹ̀lẹ̀ tí ń bọ̀. ‘Bí ó ti ń tẹ̀ mí mọ́lẹ̀’ ń mú ìbéèrè-ìyàlẹ́nu πῶς àti ìmọ̀lára ìkálọ́wọ́kò συνέχομαι hàn ní kedere.
  terminology: A dá ‘ìbatisí’ sílẹ̀ nínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ náà ṣàlàyé ìtumọ̀ àkàwé rẹ̀ ní àyíká ìjìyà Jésù, ṣùgbọ́n kò jẹ́ kí àlàyé náà rọ́pò àwòrán inú ọ̀rọ̀ Gíríìkì.
  issues:
  - severity: medium
    issue: ‘ìbatisí kan tí a ó fi baptisi mi’ kò jẹ́ ìkọ̀wé Yorùbá tó rọrùn tàbí tó péye.
    rationale: Ìlò ‘fi’ níbí kò bá ìtumọ̀ ἔχω βαπτισθῆναι mu dáadáa. ‘Láti gba’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ ìbatisí tí ènìyàn yóò gba.
  - severity: medium
