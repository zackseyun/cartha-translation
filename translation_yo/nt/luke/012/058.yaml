id: LUK.12.58
reference: Luke 12:58
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: yo
  text: Nítorí bí ìwọ ti ń bá ẹni tí ó fẹ̀sùn kàn ọ́ lọ síwájú aláṣẹ, ṣe ìsapá ní ọ̀nà láti bọ́ lọ́wọ́ rẹ̀[a], kí ó má bàa fà ọ́ lọ sí ọ̀dọ̀ onídàájọ́, kí onídàájọ́ sì fi ọ́ lé òṣìṣẹ́ ilé-ẹjọ́ lọ́wọ́, kí òṣìṣẹ́ ilé-ẹjọ́ sì sọ ọ́ sínú ilé-ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti yanjú ọ̀ràn náà pẹ̀lú rẹ̀.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “láti bọ́ lọ́wọ́ rẹ̀,” ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó túmọ̀ sí yíyanjú ẹjọ́ náà kí ó tó dé ọ̀dọ̀ onídàájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: ẹni tí ó fẹ̀sùn kàn ọ́
  rationale: Ó ṣàlàyé ẹni ìjà òfin tí ó ń mú ẹjọ́ wá, ó sì jẹ́ Yorùbá àdánidá ju gbólóhùn gbogbogbò bí ‘ọ̀tá’ lọ.
- source_word: ἄρχοντα
  choice: aláṣẹ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ó ní àṣẹ ìjọba tàbí ìṣàkóso nínú àyíká òfin; ‘aláṣẹ’ ṣe àfihàn ìtumọ̀ yẹn láì fi ètò ilé ẹjọ́ òde òní kan pàtó lé e lórí.
- source_word: δὸς ἐργασίαν
  choice: ṣe gbogbo ìsapá
  rationale: Ó mú ìpè sí ìgbìyànjú taratara jáde ní èdè Yorùbá tí ó mọ́gbọ́n dání.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: láti bọ́ lọ́wọ́ rẹ̀
  rationale: Ó dúró sítòsí èrò Gíríìkì pé kí a tú ẹni sílẹ̀ kúrò lọ́wọ́ ẹnìkejì, láì pinnu ní pàtó pé ìfẹ̀nukò ni.
- source_word: κατασύρῃ
  choice: wọ́ ọ lọ
  rationale: ‘Wọ́’ pa agbára àti ìfipámú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κριτήν / κριτής
  choice: onídàájọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ń dá ẹjọ́.
- source_word: παραδώσει
  choice: fi ọ́ lé … lọ́wọ́
  rationale: Àpólà náà jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ fífi ẹni lé aláṣẹ mìíràn lọ́wọ́ mọ́.
- source_word: πράκτορι / πράκτωρ
  choice: ọlọ́pàá ilé ẹjọ́
  rationale: Ó ṣàlàyé òṣìṣẹ́ tí ń mú àṣẹ onídàájọ́ ṣẹ láì gbára lé oyè òfin ilẹ̀ mìíràn.
- source_word: βαλεῖ εἰς φυλακήν
  choice: sọ ọ́ sínú ẹ̀wọ̀n
  rationale: ‘Sọ … sínú’ pa líle àti ìkánjú βάλλω mọ́ ju ‘fi … sí’ lọ.
- source_word: ὡς γὰρ
  choice: Nítorí bí
  rationale: Ó pa ìsopọ̀ àlàyé γάρ àti ìfarawé ὡς mọ́.
- source_word: ἐν τῇ ὁδῷ
  choice: ní ọ̀nà
  rationale: Ó lè túmọ̀ sí ibi gidi àti àkókò ṣáájú dídé ilé ẹjọ́, bí Gíríìkì ṣe ní í.
theological_decisions:
- issue: Bó ṣe yẹ kí àwòrán òfin náà jẹ́ pàtó nípa ẹ̀kọ́ ìgbàgbọ́
  choice: Pa àwòrán ẹjọ́ mọ́ láì sọ pé ó ń tọ́ka ní tààrà sí ìlàjà pẹ̀lú Ọlọ́run tàbí ìdájọ́ ìkẹyìn.
  alternative: Túmọ̀ rẹ̀ ní gbangba gẹ́gẹ́ bí ìkìlọ̀ láti bá Ọlọ́run làjà ṣáájú ìdájọ́ ìkẹyìn.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo àpẹẹrẹ òfin, kò sì sọ àwọn ẹni inú àpẹẹrẹ náà di àwọn ẹni tàbí ohun ti ẹ̀kọ́ ìgbàgbọ́ kan pàtó. Ìtumọ̀ náà fi ìlò rẹ̀ sílẹ̀ fún àyíká ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àlàyé kékeré bí ‘ọlọ́pàá ilé ẹjọ́’ fún πράκτωρ, nítorí pé kò sí oyè Yorùbá kan ṣoṣo tí ó bá ipa òṣìṣẹ́ náà mu láì mú ètò òfin ilẹ̀ kan wọ inú ẹsẹ̀ náà.
