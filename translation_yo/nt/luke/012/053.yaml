id: LUK.12.53
reference: Luke 12:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: yo
  text: 'Wọ́n yóò pínyà[a]: baba dojú kọ ọmọkùnrin, ọmọkùnrin sì dojú kọ baba; ìyá dojú kọ ọmọbìnrin, ọmọbìnrin sì dojú kọ ìyá; ìyá ọkọ dojú kọ aya ọmọ rẹ̀[b], aya ọmọ sì dojú kọ ìyá ọkọ rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n yóò yapa.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ìyapa tó wáyé nínú àwùjọ kan tàbí agbo ilé kan.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “aya ọmọ” tún lè túmọ̀ sí “ìyàwó tuntun” ní àwọn àyíká mìíràn; ṣùgbọ́n fífi í sí ẹ̀gbẹ́ “ìyá ọkọ” níbí fi hàn pé aya ọmọ ni a ń sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: Wọn yóò pínyà
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú aláìṣe yìí ṣàpèjúwe bí ìyapa yóò ṣe wáyé láàárín àwọn ará ilé; ‘pínyà’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ìyapa mọ́ láì sọ ẹni tó fa á.
- source_word: ἐπὶ
  choice: dojú kọ
  rationale: Nínú àtòjọ ìbátan yìí, ἐπί ń tọ́ka sí ìtakò. ‘Dojú kọ’ sọ ìtakò náà ní Yorùbá tó ṣe kedere, tó sì yẹ fún gbogbo àwọn méjì-méjì.
- source_word: πατήρ / υἱός
  choice: baba / ọmọkùnrin
  rationale: Àwọn ọ̀rọ̀ yìí pa ìbátan ọkùnrin tó wà nínú Gíríìkì mọ́.
- source_word: μήτηρ / θυγάτηρ
  choice: ìyá / ọmọbìnrin
  rationale: Àwọn ọ̀rọ̀ ìbátan wọ̀nyí jẹ́ ìtumọ̀ tààrà, wọ́n sì pa ìyàtọ̀ abo inú orísun mọ́.
- source_word: πενθερά
  choice: ìyá ọkọ
  rationale: Ní àjọṣe rẹ̀ pẹ̀lú νύμφη níbí, ó túmọ̀ sí ìyá ọkọ aya ọmọ; ‘ìyá ọkọ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìbátan náà.
- source_word: νύμφη
  choice: aya ọmọ
  rationale: Bí ó tilẹ̀ jẹ́ pé νύμφη lè túmọ̀ sí ‘ìyàwó tuntun,’ fífi í sí ẹ̀gbẹ́ πενθερά níbí fi hàn pé aya ọmọ ni a ń sọ.
- source_word: αὐτῆς
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ ohun-ìní náà mọ́ nínú ‘aya ọmọ rẹ̀’; a tún lò ó ní gbólóhùn ìkẹyìn fún Yorùbá tó ṣe kedere àti àdánidá, bí ó tilẹ̀ jẹ́ pé kò fara hàn níbẹ̀ nínú Gíríìkì.
theological_decisions:
- issue: Irú ìyapa tí ẹsẹ náà ń ṣàpèjúwe
  choice: A fi í hàn gẹ́gẹ́ bí ìjà àti ìtakò tó ń ṣẹlẹ̀ láàárín àwọn ará ilé nítorí iṣẹ́ Jesu nínú àyíká ọ̀rọ̀ náà, kì í ṣe bí àṣẹ láti kórìíra ìdílé.
  alternative: Kí a túmọ̀ ọ́ sí òwe gbogbogbò nípa awuyewuye ìdílé.
  rationale: Àyíká ẹsẹ ṣáájú ń sọ nípa ìyapa, ẹsẹ yìí sì ṣe àlàyé rẹ̀ pẹ̀lú àwọn ìbátan tó ń dojú kọ ara wọn. Ìtumọ̀ náà pa líle ọ̀rọ̀ mọ́ láì fi ìtẹ́wọ́gbà ìjà ìdílé kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lò ‘dojú kọ’ léraléra láti pa ìṣọ̀kan àti ìtakò alápadà inú Gíríìkì mọ́.
