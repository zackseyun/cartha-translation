  source_fidelity: Ìtumọ̀ náà pa ìṣètò onípààrò àwọn ìbátan àti ìtumọ̀ ìtakò ti ἐπί mọ́ dáadáa. ‘Pínyà’ yẹ fún διαμερισθήσονται, àti ‘dojú kọ’ jẹ́ ìtumọ̀ kedere fún ìtakò náà. Àmì akọsílẹ̀ [a], bí ó ti wà, kò wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ διαμερισθήσονται tí akọsílẹ̀ náà ń ṣàlàyé; yíyí ibùdó rẹ̀ padà yóò mú ìtọ́kasí rẹ̀ péye. Ìyípadà ‘pín sí méjì’ nínú akọsílẹ̀ náà sì lè fi iye méjì tí Gíríìkì kò sọ kún un.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì yẹ fún kíkà ní gbangba. Fífà ‘yóò’ kúrò nínú gbogbo apá méjì-méjì lẹ́yìn gbólóhùn ìṣáájú jẹ́ kí ìlànà àtòjọ náà rọrùn, ó sì pa agbára ọjọ́ iwájú ti ‘Wọ́n yóò pínyà’ mọ́.
  terminology: ‘Baba,’ ‘ọmọkùnrin,’ ‘ìyá,’ ‘ọmọbìnrin,’ ‘ìyá ọkọ,’ àti ‘aya ọmọ’ jẹ́ àwọn ọ̀rọ̀ ìbátan tó bójú mu ní àyíká yìí. ‘Aya ọmọ rẹ̀’ ń fi ohun-ìní αὐτῆς hàn; ‘ìyá ọkọ rẹ̀’ ní ìparí jẹ́ ìmú-kedere Yorùbá tó bá ìbátan onípààrò náà mu, bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ náà kò fara hàn nínú gbolohun Gíríìkì ìkẹyìn.
