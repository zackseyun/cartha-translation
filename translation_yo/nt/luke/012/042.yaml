id: LUK.12.42
reference: Luke 12:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: yo
  text: 'Olúwa sì wí pé, “Ta ni nígbà náà jẹ́ alábòójútó olóòótọ́ àti olóye[a], ẹni tí ọ̀gá rẹ̀ yóò yàn sí orí àwọn ìránṣẹ́ ilé rẹ̀ láti máa fún wọn ní ìpín oúnjẹ[b] ní àkókò tó yẹ?”


    [a] Tàbí “ọlọ́gbọ́n.”

    [b] Ní tààrà, “ìpín ọkà tí a díwọ̀n,” ìyẹn ni, ìpín oúnjẹ tí a yàn fún ìránṣẹ́ kọ̀ọ̀kan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọlọ́gbọ́n.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ìpín ọkà tí a díwọ̀n,” ìyẹn ni, ìpín oúnjẹ tí a yàn fún ìránṣẹ́ kọ̀ọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa / ọ̀gá
  rationale: Ní ìbẹ̀rẹ̀ ẹsẹ náà, κύριος jẹ́ orúkọ oyè fún Jésù, nítorí náà “Olúwa” ni a lò. Nínú àpèjúwe ilé, ọ̀rọ̀ kan náà ń tọ́ka sí ẹni tó ni ilé àti àwọn ìránṣẹ́, nítorí náà “ọ̀gá” mú ìtumọ̀ àyíká náà hàn ní Yorùbá tó ṣe kedere.
- source_word: πιστός
  choice: olóòótọ́
  rationale: Ó ṣàpèjúwe ẹni tí a lè fọkàn tán pé yóò ṣe ojúṣe tí a gbé lé e; “olóòótọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìwà yìí.
- source_word: οἰκονόμος
  choice: alábòójútó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a fi ìṣàkóso ilé tàbí ohun-ìní lé lọ́wọ́. “Alábòójútó” jẹ́ ọ̀rọ̀ òde òní tó yé kedere, ó sì pa èrò ojúṣe tí a fi lé ẹni lọ́wọ́ mọ́.
- source_word: φρόνιμος
  choice: olóye
  rationale: Ó ń tọ́ka sí òye tó wúlò àti ìdájọ́ tó dára nínú ṣíṣe ojúṣe. “Olóye” jẹ́ àdámọ̀ ní àyíká yìí; àlàyé ìsàlẹ̀ fún “ọlọ́gbọ́n” gẹ́gẹ́ bí ìtumọ̀ mìíràn tó bófin mu.
- source_word: καταστήσει
  choice: yóò yàn sí orí
  rationale: Ó túmọ̀ sí fífi ẹnì kan sí ipò ojúṣe. Gbólóhùn yìí sọ ìyànsípò àti àṣẹ lórí ẹgbẹ́ náà ní Yorùbá àdánidá.
- source_word: θεραπείας
  choice: àwọn ìránṣẹ́ ilé
  rationale: Níbí, θεραπεία kì í ṣe ìtọ́jú àìsàn, bí kò ṣe gbogbo àwọn olùránṣẹ́ tàbí alábojútó inú ilé. “Àwọn ìránṣẹ́ ilé” mú ìtumọ̀ ẹgbẹ́ ènìyàn náà hàn kedere.
- source_word: ἐν καιρῷ
  choice: ní àkókò tó yẹ
  rationale: Gbólóhùn náà ń sọ àkókò tó bá a mu tàbí tí a yàn; ìtumọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: σιτομέτριον
  choice: ìpín oúnjẹ
  rationale: Ó jẹ́ ìwọ̀n oúnjẹ, ní pàtàkì ọkà, tí a pín fún ẹnì kọ̀ọ̀kan. “Ìpín oúnjẹ” yé òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán ọkà tí a díwọ̀n mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος méjèèjì nínú ìtàn àti nínú àpèjúwe
  choice: “Olúwa” fún Jésù tó ń sọ̀rọ̀; “ọ̀gá” fún ẹni tó ni ilé nínú àpèjúwe
  alternative: “Olúwa” ní ibi méjèèjì
  rationale: Gíríìkì lo ọ̀rọ̀ kan náà ní ibi méjèèjì, ṣùgbọ́n ipa rẹ̀ yàtọ̀ nínú àyíká. Yíyan ọ̀rọ̀ Yorùbá méjì tó wà láàárín ìtumọ̀ κύριος ń jẹ́ kí ipele ìtàn àti ẹni inú àpèjúwe yà kedere láìfi ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ φρόνιμος
  choice: “olóye,” pẹ̀lú “ọlọ́gbọ́n” nínú àlàyé ìsàlẹ̀
  alternative: “ọlọ́gbọ́n” nínú ọ̀rọ̀ pàtàkì
  rationale: φρόνιμος lè túmọ̀ sí ọlọ́gbọ́n, olóye, tàbí ẹni tó ní ìdájọ́ tó dára. “Olóye” tẹnu mọ́ ọgbọ́n ìṣe tí iṣẹ́ alábòójútó béèrè, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. “Alábòójútó” ni a yàn dípò ọ̀rọ̀ ìjọ àtijọ́ kan fún steward, “àwọn ìránṣẹ́ ilé” sì ṣàlàyé ẹgbẹ́ tí θεραπεία ń tọ́ka sí. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
