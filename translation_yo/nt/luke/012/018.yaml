  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: yo
  text: 'Ó sì wí pé, ‘Èyí ni èmi yóò ṣe: Èmi yóò wó àwọn àká ọkà mi lulẹ̀, èmi yóò sì kọ́ àwọn àká ọkà tí ó tóbi jù; níbẹ̀ ni èmi yóò kó gbogbo ọkà[a] náà àti ohun ìní mi[b] jọ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọkà” (σῖτος) lè túmọ̀ sí “àlìkámà” ní pàtó nínú àwọn àyíká kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ohun rere mi” fún “ohun ìní mi” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Ohun tí èmi yóò ṣe nìyí
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ τοῦτο àti èrò ohun tí yóò ṣe mọ́.
- source_word: καθελῶ
  choice: Èmi yóò wó ... lulẹ̀
  rationale: Ó fi ìṣe fífi àwọn ilé ìpamọ́ tí ó wà tẹ́lẹ̀ wó hàn ní kedere.
- source_word: ἀποθήκας
  choice: àwọn àká ọkà
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀ yìí, ‘àká ọkà’ jẹ́ ibi tí a fi ń pa ọkà mọ́, ó sì ṣe kedere sí òǹkàwé Yorùbá.
- source_word: μείζονας οἰκοδομήσω
  choice: èmi yóò sì kọ́ àwọn tí ó tóbi jù wọ́n lọ
  rationale: Ó mú orúkọ tí a fi sílẹ̀ nínú Gíríìkì padà lọ́nà Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfiwéra mọ́.
- source_word: συνάξω ἐκεῖ
  choice: níbẹ̀ ni èmi yóò kó ... jọ sí
  rationale: Ó pa ìtumọ̀ kíkó àwọn nǹkan jọ sí ibì kan mọ́ láì fi ìtumọ̀ àfikún sí i.
- source_word: πάντα τὸν σῖτον
  choice: gbogbo ọkà mi
  rationale: ‘Ọkà’ pa ìtumọ̀ gbogbogbòò σῖτος mọ́; ‘mi’ bá ojú ìwòye olùsọ̀rọ̀ àti τὰ ἀγαθά μου tí ó tẹ̀ lé e mu.
- source_word: τὰ ἀγαθά μου
  choice: gbogbo ohun ìní mi
  rationale: Ó túmọ̀ sí àwọn ohun rere tàbí ohun ìní ti ara láì dín un kù sí owó nìkan.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere ni a lò. Àtúnṣe ‘Èmi’ pa ìtẹnumọ́ àti ìmọtara-ẹni-nìkan inú ọ̀rọ̀ ọkùnrin náà mọ́ láì fi ẹ̀kọ́ ìsìn kún un. ‘Àká ọkà’ ni a yan dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ tí ó lè túmọ̀ sí ibi ìpamọ́ gbogbogbòò.
