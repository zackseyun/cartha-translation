- from: 'Ó sì wí pé, ‘Ohun tí èmi yóò ṣe nìyí: Èmi yóò wó àwọn àká ọkà mi lulẹ̀, èmi yóò sì kọ́ àwọn tí ó tóbi jù wọ́n lọ; níbẹ̀ ni èmi yóò kó gbogbo ọkà[a] mi àti gbogbo ohun ìní mi[b] jọ sí.’'
  to: 'Ó sì wí pé, ‘Èyí ni èmi yóò ṣe: Èmi yóò wó àwọn àká ọkà mi lulẹ̀, èmi yóò sì kọ́ àwọn àká ọkà tí ó tóbi jù; níbẹ̀ ni èmi yóò kó gbogbo ọkà[a] náà àti ohun ìní mi[b] jọ.’'
  rationale: Àtúnṣe náà yọ aṣàmúlò ìní ẹni kúrò nínú ‘ọkà,’ nítorí kò sí nínú Gíríìkì; ó tún mú ‘gbogbo’ kàn mọ́ ọkà nìkan. A tún ṣe gbolohun náà ní Yorùbá ìgbàlódé tó ṣe kedere, nípa pípa ‘àká ọkà’ mọ́ nínú apá ìfiwéra àti ṣíṣe ‘níbẹ̀ ni ... kó ... jọ’ ní ọ̀nà àdánidá.
