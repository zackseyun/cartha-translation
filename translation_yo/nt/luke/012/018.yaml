  source_fidelity: 'Ìtumọ̀ náà ń fara mọ́ Gíríìkì ní pàtàkì: ìwó àwọn ibi ìpamọ́, kíkọ́ àwọn tí ó tóbi sí i, àti kíkó ọkà àti ohun ìní jọ. Síbẹ̀, ‘mi’ nínú ‘gbogbo ọkà mi’ kò sí nínú πάντα τὸν σῖτον; ó yẹ kí a má fi ìní ẹni kún ọkà náà. ‘Gbogbo’ sì yẹ kí ó kàn mọ́ ọkà, kì í ṣe ohun ìní.'
