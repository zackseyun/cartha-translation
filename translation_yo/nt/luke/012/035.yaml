  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: yo
  text: “Kí ẹ di àmùrè mọ́ ìbàdí yín, kí fìtílà yín sì máa jó.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ múra tán fún ìṣe.” Àwòrán náà ni ti kíkó aṣọ gígùn jọ, tí a sì fi àmùrè dì í múlẹ̀ kí ènìyàn lè múra tán.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Ẹ jẹ́ kí ...
  rationale: Ọ̀rọ̀-ìṣe àṣẹ ẹni-kẹta ọ̀pọ̀ ni; ‘Ẹ jẹ́ kí ...’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkìlọ̀ tàbí ìṣírí yìí hàn.
- source_word: ὑμῶν
  choice: yín
  rationale: Arọ́pò-orúkọ olóhun tó kan ‘ẹ̀gbẹ́’ àti ‘àwọn fìtílà’ méjèèjì ni.
- source_word: ὀσφύες
  choice: ẹ̀gbẹ́
  rationale: Ó ń tọ́ka sí agbègbè ìbàdí tàbí ẹ̀gbẹ́ ara; ‘ẹ̀gbẹ́’ bá àwòrán dídì àmùrè mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé nínú gbólóhùn yìí.
- source_word: περιεζωσμέναι
  choice: di àmùrè mọ́
  rationale: Ó pa àwòrán gidi ti fífi àmùrè dì aṣọ múlẹ̀ mọ́, nígbà tí perfect participle náà ń fi ipò ìmúrasílẹ̀ tó ti wà ní mímú hàn.
- source_word: λύχνοι
  choice: àwọn fìtílà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fìtílà epo, kì í ṣe ìmọ́lẹ̀ lásán.
- source_word: καιόμενοι
  choice: máa jó
  rationale: 'Ó pa ìtumọ̀ ìṣe tó ń bá a lọ mọ́: kí fìtílà náà wà ní jíjó, kì í ṣe pé a kàn ti tan án rí.'
theological_decisions:
- issue: Àwòrán ìmúrasílẹ̀ nínú ọ̀rọ̀ àṣà
  choice: Pa àwòrán dídì àmùrè mọ́ ẹ̀gbẹ́ sínú ọ̀rọ̀ pàtàkì
  alternative: Ẹ múra sílẹ̀ fún iṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì lo àwòrán pàtó ti kíkó aṣọ gígùn jọ, tí a sì fi àmùrè dì í fún ìmúrasílẹ̀. Títúmọ̀ àwòrán náà ní tààrà díẹ̀ ń pa ìtumọ̀ àti agbára ọ̀rọ̀ rẹ̀ mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘àmùrè’ láti pa àwòrán ìpilẹ̀ṣẹ̀ mọ́, a sì ṣàlàyé ìtumọ̀ àṣà rẹ̀ ní àlàyé ìsàlẹ̀.
