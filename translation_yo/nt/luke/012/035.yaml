  terminology: «Àmùrè», «ìbàdí», àti «fìtílà» yẹ fún àwọn ọ̀rọ̀ Gíríìkì náà. A tún dín «àwọn fìtílà yín» kù sí «fìtílà yín», èyí tí ó lè jẹ́ ọ̀pọ̀ nínú àyíká yìí, láìpadanu ìtumọ̀.
