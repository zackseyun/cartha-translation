  source_fidelity: Ìtumọ̀ náà pa àṣẹ ìmúrasílẹ̀ àti àwòrán fìtílà tí ń jó mọ́. Ṣùgbọ́n «ẹ̀gbẹ́» túmọ̀ sí apá/ẹgbẹ́ ara, kì í ṣe ὀσφύες (‘ìbàdí’/‘ìbàdí-ẹ̀gbẹ́’), nítorí náà ó yí apá ara tí ọ̀rọ̀ náà ń tọ́ka sí padà.
