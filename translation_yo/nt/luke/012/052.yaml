  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: yo
  text: 'Nítorí láti ìsinsìnyí lọ, ènìyàn márùn-ún yóò wà ní ilé kan[a], wọ́n yóò sì yà sí ara wọn: mẹ́ta lòdì sí méjì, méjì sì lòdì sí mẹ́ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní agbo ilé kan.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilé fúnra rẹ̀ tàbí sí ìdílé, ìyẹn àwọn ènìyàn tí wọ́n ń gbé inú ilé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ènìyàn márùn-ún yóò wà
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; fífi “ènìyàn” kún un mú kí ó ṣe kedere ní Yorùbá pé àwọn mẹ́ńbà ilé ni a ń sọ̀rọ̀ nípa wọn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àlàyé ọ̀rọ̀ náà mọ́, ó sì so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ ìpínyà tó ṣáájú.
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsìnyí lọ
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ìtumọ̀ àkókò tí ó bẹ̀rẹ̀ nísinsìnyí tí ó sì ń bá a lọ.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: ní ilé kan
  rationale: “Ilé” lè tọ́ka sí ibi tí wọ́n ń gbé tàbí sí agbo ilé; ó pa àìdájú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διαμεμερισμένοι
  choice: wọn yóò sì pínyà sí ara wọn
  rationale: Ó sọ ipò ìyapa àti ìtakora láàárín àwọn ènìyàn náà ní Yorùbá àdánidá, dípò kí ó dà bí pípín ohun kan sí apá.
- source_word: τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν
  choice: mẹ́ta lòdì sí méjì, méjì sì lòdì sí mẹ́ta
  rationale: “Lòdì sí” mú ìtakora tí ἐπί pẹ̀lú dative ní ní àyíká yìí jáde, ó sì pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́.
theological_decisions:
- issue: Bóyá kí οἶκος túmọ̀ sí ilé gẹ́gẹ́ bí ibi tàbí agbo ilé gẹ́gẹ́ bí ìdílé
  choice: ilé
  alternative: agbo ilé tàbí ìdílé
  rationale: Ẹsẹ̀ tó tẹ̀ lé e fi hàn pé àwọn ìbátan inú ìdílé ni a ní lọ́kàn, ṣùgbọ́n “ilé” pa ààyè ìtumọ̀ méjèèjì ti ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ni ó tọ́ka sí ìtumọ̀ kejì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ilé” nínú ẹsẹ̀ láti pa ìtumọ̀ gbooro οἶκος mọ́, a sì ṣàlàyé “agbo ilé/ìdílé” ní àlàyé ìsàlẹ̀.
