  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: yo
  text: “Má bẹ̀rù, ẹ̀yin agbo àgùntàn kékeré, nítorí ó wù Baba yín láti fi ìjọba náà fún yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìjọba” tún lè túmọ̀ sí “ìṣàkóso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Ọ̀rọ̀ ìṣẹ̀ ní odi yìí jẹ́ ìkìlọ̀ tààrà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ‘má fòyà’ tàbí ‘má ṣe bẹ̀rù.’
- source_word: τὸ μικρὸν ποίμνιον
  choice: agbo kékeré
  rationale: Ó pa àkàwé agbo àgùntàn mọ́, ó sì fi hàn pé iye wọn kéré; ọ̀rọ̀ náà tún ní ìfẹ́ inú bí ìpè tààrà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí wọn kò fi gbọdọ̀ bẹ̀rù hàn ní kedere.
- source_word: εὐδόκησεν
  choice: ó dùn mọ́
  rationale: Ó sọ inú dídùn àti ìfẹ́ rere Baba, láì sọ ọ́ di èdè ẹ̀kọ́ ìgbàgbọ́ tó ju ohun tí Gíríìkì sọ lọ.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yín
  rationale: Ó tẹ̀ lé Gíríìkì láì fi ‘ọ̀run’ kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: δοῦναι ὑμῖν
  choice: láti fi … fún yín
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún fífún ẹni ní ohun kan.
- source_word: τὴν βασιλείαν
  choice: ìjọba náà
  rationale: ‘Ìjọba’ lè tọ́ka sí agbègbè ọba àti sí ìṣàkóso rẹ̀; àfihàn náà pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία
  choice: ìjọba náà
  alternative: ìṣàkóso náà
  rationale: ‘Ìjọba’ pa ìtumọ̀ méjèèjì—ìṣàkóso ọba àti ohun tàbí àwọn ènìyàn tí ó wà lábẹ́ rẹ̀—mọ́, dípò kí a dín ọ̀rọ̀ náà kù sí ọ̀kan ṣoṣo.
- issue: Ìtumọ̀ εὐδόκησεν nípa ìfẹ́ Ọlọ́run
  choice: ó dùn mọ́
  alternative: ó fi inú rere yàn
  rationale: Èyí tẹnumọ́ inú rere Baba, ṣùgbọ́n kò fi èrò ẹ̀kọ́ nípa àṣẹ àyànmọ́ tí kò hàn gbangba sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àkàwé olùṣọ́-àgùntàn àti ìfẹ́ inú ọ̀rọ̀ ‘agbo kékeré’ mọ́.
