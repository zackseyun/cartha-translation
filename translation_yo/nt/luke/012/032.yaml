  to: “Má bẹ̀rù, ẹ̀yin agbo àgùntàn kékeré, nítorí ó wù Baba yín láti fi ìjọba náà fún yín.”[a]
  rationale: A tún “ó dùn mọ́ Baba yín” ṣe sí “ó wù Baba yín” fún ìsọ̀rọ̀ Yorùbá tó dájú àti ìfaramọ́ tó sún mọ́ εὐδόκησεν. A fi “àgùntàn” hàn nínú àpèjúwe agbo kí ìtumọ̀ ποίμνιον le ṣe kedere. A sì dín àlàyé ìsàlẹ̀ kù kí ó má ṣe yan ìtumọ̀ kan ṣoṣo fún βασιλεία tàbí fi ohun tí kò sí nínú ẹsẹ kún un.
