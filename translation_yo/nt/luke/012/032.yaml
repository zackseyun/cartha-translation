  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìkìlọ̀ náà, àpèjúwe agbo, ìdí ìtùnú, àti ẹ̀bùn ìjọba mọ́. Síbẹ̀, “ó dùn mọ́ Baba yín” kò ṣe àfihàn εὐδόκησεν ní ọ̀nà tó rọrùn tó sì dájú jù lọ nínú Yorùbá òde òní; “ó wù Baba yín” ń ṣàfihàn ìfẹ́ rere tàbí ìfẹ́-inú náà dáadáa.
  naturalness: “Agbo kékeré” jẹ́ ìtumọ̀ tí ó ṣeé lóye, ṣùgbọ́n “agbo àgùntàn kékeré” sọ àkàwé ποίμνιον di mímọ́ síi fún òǹkàwé Yorùbá, láì fi ìtumọ̀ tuntun kún un. Ètò gbolohun tí a ṣe àtúnṣe jẹ́ ti ẹnu Yorùbá boṣewa.
  terminology: “Ìjọba náà” yẹ fún βασιλεία, ó sì fi àìdájú tó wà láàárín ìjọba gẹ́gẹ́ bí ìṣàkóso àti ìjọba gẹ́gẹ́ bí agbègbè pamọ́. A kò fi “Ọlọ́run” tàbí “ọba ọ̀run” kún ibi tí Gíríìkì ti ní “Baba yín” nìkan.
