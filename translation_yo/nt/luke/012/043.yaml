  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: yo
  text: Alábùkún ni ìránṣẹ́ náà tí olúwa rẹ̀[a], nígbà tí ó bá dé, yóò bá a níbi tí ó ti ń ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọ̀gá” nínú àkàwé ìdílé yìí, tàbí sí “Olúwa” nígbà tí a bá wo ìtumọ̀ tó gbooro.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Alábùkún
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìbùkún mọ́, ó sì ní agbára ẹ̀sìn tó ju ọ̀rọ̀ tí ó kan ìdùnnú inú lọ.
- source_word: δοῦλος
  choice: ìránṣẹ́
  rationale: Nínú àkàwé ilé yìí, ọ̀rọ̀ náà tẹnumọ́ ẹni tó wà lábẹ́ àṣẹ olúwa tí ó sì ní iṣẹ́ láti ṣe; “ìránṣẹ́” jẹ́ èdè Yorùbá àdánidá tí gbogbo ènìyàn lè lóye, láìfi ọ̀ràn ipò ẹrú ṣe kókó ẹsẹ̀ náà.
- source_word: κύριος
  choice: olúwa
  rationale: “Olúwa” lè tọ́ka sí baálé tàbí ọ̀gá ìránṣẹ́ nínú àwòrán ilé, ó sì tún lè ní ìtumọ̀ “Olúwa” nínú ìlò ẹ̀sìn; nítorí náà ó dá àìdánilójú gidi inú Gíríìkì sí.
- source_word: ἐλθὼν
  choice: nígbà tí ó bá dé
  rationale: Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa bí dídé ṣe ṣáájú rírí ìránṣẹ́ mọ́.
- source_word: εὑρήσει
  choice: yóò bá a
  rationale: Ó fi àkókò ọjọ́ iwájú hàn kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan rí ẹlòmíràn ní ipò kan.
- source_word: ποιοῦντα οὕτως
  choice: tí ó ń ṣe bẹ́ẹ̀
  rationale: Ó tọ́ka padà sí ìṣe tí a ti ṣàpèjúwe ṣáájú, ó sì jẹ́ kúkúrú àti èdè Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: náà
  rationale: '“Náà” fi ìtẹnumọ́ àti ìtọ́kasí pàtó hàn: ìránṣẹ́ yẹn tí a ń sọ̀rọ̀ rẹ̀.'
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí olórí ilé tàbí gẹ́gẹ́ bí Olúwa nínú ìtumọ̀ tó gbooro
  choice: A lo “olúwa” nínú ẹsẹ̀ náà
  alternative: A lè túmọ̀ ọ́ ní pàtó sí “ọ̀gá” tàbí “Olúwa.”
  rationale: “Olúwa” bá àjọṣe olórí ilé àti ìránṣẹ́ mu, ó sì tún jẹ́ kí ìtọ́kasí tó ṣeé ṣe sí Olúwa àti ìpadàbọ̀ rẹ̀ wà láìfi tipátipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣeé lóye ní ìgbà òde òní ni a lò. A yan “olúwa” láti pa ìtumọ̀ méjèèjì tó ṣeé ṣe mọ́; àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ náà.
