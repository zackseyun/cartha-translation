  to: Alábùkún ni ìránṣẹ́ náà tí olúwa rẹ̀[a], nígbà tí ó bá dé, yóò bá a níbi tí ó ti ń ṣe bẹ́ẹ̀.
  rationale: A tún ọ̀rọ̀ ìpínlẹ̀ ìṣe náà ṣe sí “yóò bá a níbi tí ó ti ń ṣe bẹ́ẹ̀” nìkan, kí Yorùbá náà lè jẹ́ èdè àdánidá tí ó sì ṣetán láti sọ ìtumọ̀ participle ποιοῦντα (“nígbà tí ó ń ṣe”) àti οὕτως (“bẹ́ẹ̀”) ní tòótọ́. A tún ṣàtúnṣe àlàyé [a] díẹ̀ kí “ìdílé” àti ìyàtọ̀ “ọ̀gá/Olúwa” hàn kedere. Kò sí ìyípadà sí ìtumọ̀ ẹsẹ̀ náà.
