base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: yo
  text: Bẹ́ẹ̀ ni ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ níwájú Ọlọ́run.”
    reason: Àṣàyàn ìtumọ̀ míì fún εἰς θεὸν.
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó fa ìlò òwe tí ó ṣáájú wá sí ẹni tí ó ń hùwà bẹ́ẹ̀, ó sì pa agbára ọ̀rọ̀ kúkúrú Gíríìkì mọ́.
- source_word: ὁ θησαυρίζων
  choice: ẹni tí ó ń kó ìṣúra jọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́ni pàtó yìí tọ́ka sí ẹnikẹ́ni tí ìṣe yìí ń ṣàpèjúwe; “kó ìṣúra jọ” tún pa ìtumọ̀ ìṣúra àti ìkójọ rẹ̀ mọ́.
- source_word: ἑαυτῷ
  choice: fún ara rẹ̀
  rationale: Ó fi hàn pé ẹni náà ń ṣe ìkójọ náà fún àǹfààní ara rẹ̀.
- source_word: καὶ μὴ
  choice: tí kò sì
  rationale: Ìsopọ̀ yìí jẹ́ ti àdàpọ̀, kì í ṣe dandan ti ìtakora; ọ̀nà yìí sì jẹ́ àdánidá ní Yorùbá.
- source_word: εἰς θεὸν
  choice: sí Ọlọ́run
  rationale: “Sí” pa ìdarí àti ìbáṣepọ̀ tí εἰς ní mọ́ láì dín gbólóhùn náà kù sí ohun tí Ọlọ́run kàn fọwọ́ sí.
- source_word: πλουτῶν
  choice: jẹ́ ọlọ́rọ̀
  rationale: Ó sọ ìtumọ̀ ìwà ọlọ́rọ̀ ní Yorùbá àdánidá, ó sì dá ìyàtọ̀ rẹ̀ sí kíkó ìṣúra ayé jọ dúró.
theological_decisions:
- issue: Ẹni akọ kan gẹ́gẹ́ bí àpẹẹrẹ nínú ọ̀rọ̀ ìwà rere
  choice: ẹni tí ó
  alternative: ọkùnrin tí ó
  rationale: Bí ó tilẹ̀ jẹ́ pé àbùdá Gíríìkì jẹ́ akọ ẹyọ kan, ó ń ṣiṣẹ́ gẹ́gẹ́ bí àpẹẹrẹ gbogbogbò. “Ẹni tí ó” jẹ́ Yorùbá àdánidá, kò sì yí ìlò gbogbogbò náà padà.
- issue: Ìtumọ̀ jíjẹ́ ọlọ́rọ̀ εἰς θεὸν
  choice: ọlọ́rọ̀ sí Ọlọ́run
  alternative: ọlọ́rọ̀ níwájú Ọlọ́run
  rationale: A pa ọ̀rọ̀ ìbáṣepọ̀ tí ó ní ìtumọ̀ jíjinlẹ̀ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un. Àṣàyàn inú àlàyé ìsàlẹ̀ fi ìtumọ̀ “níwájú Ọlọ́run” hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kúkúrú, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní.
