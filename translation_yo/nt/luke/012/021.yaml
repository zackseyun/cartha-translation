revisions:
- from: Bẹ́ẹ̀ náà ni ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ sí Ọlọ́run[a].
  to: Bẹ́ẹ̀ ni ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run[a].
  rationale: The revision replaces the non-idiomatic collocation 'ọlọ́rọ̀ sí Ọlọ́run' with 'ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run,' which is natural Standard Yoruba while preserving the relational ambiguity of εἰς θεόν. It also tightens the introductory application formula to 'Bẹ́ẹ̀ ni.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the application formula, the generic substantival participle, the reflexive dative ('for himself'), and the coordinated negative participle. Its rendering of εἰς θεόν as 'sí Ọlọ́run' is formally directional but is not idiomatic with ọlọ́rọ̀ in Standard Yoruba.
  naturalness: '''Bẹ́ẹ̀ ni'' is the more direct, proverbial Yoruba equivalent of οὕτως in this concluding application. More importantly, ''jẹ́ ọlọ́rọ̀ sí Ọlọ́run'' is awkward Yoruba collocation. ''Jẹ́ ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run'' naturally conveys richness in relation to/before God without defining that richness.'
  terminology: Ìṣúra, fún ara rẹ̀, and Ọlọ́run are appropriate. 'Ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run' preserves the deliberately suggestive theological expression and avoids doctrinal expansion.
  issues:
  - severity: medium
    issue: The phrase 'jẹ́ ọlọ́rọ̀ sí Ọlọ́run' is not idiomatic Standard Yoruba.
    rationale: Although sí can reproduce the directional force of εἰς literally, ọlọ́rọ̀ does not naturally take sí for this relational sense. 'Lọ́dọ̀ Ọlọ́run' is an established, natural expression for being rich in relation to/before God and retains the source phrase's openness.
  - severity: low
    issue: '''Bẹ́ẹ̀ náà ni'' is slightly less concise than the Greek application formula.'
    rationale: '''Bẹ́ẹ̀ ni'' gives the proverbial concluding force of οὕτως more directly, with no change in meaning.'
  revised_text: Bẹ́ẹ̀ ni ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run[a].
  revised_footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ń kó ìṣúra jọ fún ara rẹ̀, tí kò sì jẹ́ ọlọ́rọ̀ níwájú Ọlọ́run.”
    reason: Àṣàyàn ìtumọ̀ míì fún εἰς θεὸν.
  revision_rationale: The revision replaces the non-idiomatic collocation 'ọlọ́rọ̀ sí Ọlọ́run' with 'ọlọ́rọ̀ lọ́dọ̀ Ọlọ́run,' which is natural Standard Yoruba while preserving the relational ambiguity of εἰς θεόν. It also tightens the introductory application formula to 'Bẹ́ẹ̀ ni.'
