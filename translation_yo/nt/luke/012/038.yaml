id: LUK.12.38
reference: Luke 12:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: yo
  text: Bí ó tilẹ̀ dé ní ìṣọ́ kejì[a], tàbí ní ìṣọ́ kẹta, tí ó bá sì rí wọn bẹ́ẹ̀, alábùkún ni àwọn ìránṣẹ́ wọ̀nyẹn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kíkún sí i, “ní ìṣọ́ kejì òru, tàbí ní ìṣọ́ kẹta òru.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gangan, “Alábùkún ni àwọn wọ̀nyẹn.” Àwọn tí ọ̀rọ̀ náà ń tọ́ka sí ni àwọn ìránṣẹ́ tí a mẹ́nu kàn nínú àyíká ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Kódà bí ... tàbí kódà
  rationale: Àtúmọ̀ yìí fi ipò àìdánilójú tó ní ìtẹnumọ́ hàn, ó sì pa àtúnwí tó wà nínú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: ní ìṣọ́ kejì ... ní ìṣọ́ kẹta
  rationale: φυλακή níbí ń tọ́ka sí àkókò ìṣọ́ ní òru, kì í ṣe ẹ̀wọ̀n tàbí ibi tí olùṣọ́ dúró. Àlàyé pé ìṣọ́ òru ni wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: ἔλθῃ
  choice: ó bá dé
  rationale: Ọ̀rọ̀-ìṣe aorist subjunctive nínú gbólóhùn àdéhùn yìí ń sọ nípa ohun tó lè ṣẹlẹ̀ lọ́jọ́ iwájú; ‘ó bá dé’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: εὕρῃ οὕτως
  choice: tí ó sì bá wọn ní ipò bẹ́ẹ̀
  rationale: οὕτως ń tọ́ka sẹ́yìn sí bí àwọn ìránṣẹ́ náà ṣe wà ní ìmúrasílẹ̀. Fífi ‘wọn’ àti ‘ipò’ kún un mú ìtumọ̀ àyíká náà ṣe kedere láìfi èrò tuntun sí i.
- source_word: μακάριοί
  choice: alábùkún-fún
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ipò rere àti ojúrere mọ́, ó sì ní ìwọ̀n ẹ̀sìn tó jinlẹ̀ ju ‘aláyọ̀’ tàbí ‘olóríire’ lọ.
- source_word: ἐκεῖνοι
  choice: àwọn ìránṣẹ́ náà
  rationale: Ní ti gangan, ἐκεῖνοι túmọ̀ sí ‘àwọn náà,’ ṣùgbọ́n ẹni tí ó ń tọ́ka sí ni àwọn ìránṣẹ́ inú àyíká ẹsẹ tó ṣáájú. Ṣíṣe ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kedere yọ àìṣedéédé kúrò.
theological_decisions:
- issue: Ṣíṣe ẹni tí ἐκεῖνοι ń tọ́ka sí kedere
  choice: àwọn ìránṣẹ́ náà
  alternative: àwọn náà
  rationale: 'Gíríìkì lo arọ́pò-orúkọ atọ́ka, ẹni tí ó sì ń tọ́ka sí hàn gbangba nínú àyíká lẹ́sẹ̀kẹsẹ̀: àwọn ìránṣẹ́ ọ̀gá náà. Fífi ‘ìránṣẹ́’ hàn mú ọ̀rọ̀ yé ni, kò sì fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un. Nítorí δοῦλος kò sí nínú ẹsẹ yìí fúnra rẹ̀, àṣàyàn yìí kì í pinnu àríyànjiyàn ‘ẹrú’ tàbí ‘ìránṣẹ́’ fún ọ̀rọ̀ Gíríìkì náà.'
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. ‘Ìṣọ́’ pa àwòrán àkókò ìṣọ́ òru ayé ìgbàanì mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé rẹ̀.
