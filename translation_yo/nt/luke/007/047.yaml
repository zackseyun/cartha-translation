revisions:
- from: Nítorí ìdí èyí, mo sọ fún ọ pé, a ti dárí àwọn ẹ̀ṣẹ̀ rẹ̀ tí ó pọ̀ jì—nítorí ó ní ìfẹ́ púpọ̀.[a] Ṣùgbọ́n ẹni tí a dárí díẹ̀ jì máa ń ní ìfẹ́ díẹ̀.
  to: Nítorí èyí, mo sọ fún ọ pé, a ti dárí àwọn ẹ̀ṣẹ̀ rẹ̀ tí ó pọ̀ jì, nítorí ó nífẹ̀ẹ́ púpọ̀.[a] Ṣùgbọ́n ẹni tí a dárí díẹ̀ jì máa ń nífẹ̀ẹ́ díẹ̀.
  rationale: Àtúnṣe náà ṣe pàtàkì láti mú ìṣe aorist ‘ó fẹ́ràn/ó nífẹ̀ẹ́ púpọ̀’ jáde dípò ìpo ‘ó ní ìfẹ́ púpọ̀.’ Ó tún mú ìbẹ̀rẹ̀ gbólóhùn rọrùn sí “Nítorí èyí.” Ìsopọ̀ “nítorí” àti àlàyé ìsàlẹ̀ ni a ti pa mọ́, kí ìforígbárí ìtumọ̀ inú àyíká ọ̀rọ̀ má bàa sọnù.
