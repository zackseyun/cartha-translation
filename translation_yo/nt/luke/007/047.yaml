id: LUK.7.47
reference: Luke 7:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: yo
  text: Nítorí èyí, mo sọ fún ọ pé, a ti dárí àwọn ẹ̀ṣẹ̀ rẹ̀ tí ó pọ̀ jì, nítorí ó nífẹ̀ẹ́ púpọ̀.[a] Ṣùgbọ́n ẹni tí a dárí díẹ̀ jì máa ń nífẹ̀ẹ́ díẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí náà, ó nífẹ̀ẹ́ púpọ̀.” A lè lóye ọ̀rọ̀ ìsopọ̀ Gíríìkì náà gẹ́gẹ́ bí èyí tó tẹnu mọ́ pé ìfẹ́ rẹ̀ jẹ́ ẹ̀rí pé a ti dárí jì í, kì í ṣe okùnfà ìdáríjì rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Nítorí ìdí èyí
  rationale: Ó fi ipa ìsopọ̀ oníṣẹ̀lẹ̀ tàbí oníyọrísí ọ̀rọ̀ Gíríìkì hàn ní Yorùbá adayébá.
- source_word: ἀφέωνται
  choice: a ti dárí ... jì
  rationale: Ìṣe aláìṣe ní àkókò pípé ń tọ́ka sí ìdáríjì tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣì wà.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: àwọn ẹ̀ṣẹ̀ rẹ̀ tí ó pọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayébá láti sọ pé ẹ̀ṣẹ̀ obìnrin náà pọ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó pa ìtumọ̀ okùnfà Gíríìkì mọ́, láì mú ìṣòro ìtumọ̀ inú àyíká ọ̀rọ̀ kúrò.
- source_word: ἠγάπησεν πολύ
  choice: ó ní ìfẹ́ púpọ̀
  rationale: Ó sọ bí ìfẹ́ rẹ̀ ṣe pọ̀ ní Yorùbá tí ó ṣe kedere, láì sọ pé ìfẹ́ náà ra ìdáríjì.
- source_word: ᾧ δὲ
  choice: Ṣùgbọ́n ẹni tí
  rationale: Ó jẹ́ gbólóhùn gbogbogbò tí kò fi akọ tàbí abo kún ohun tí Gíríìkì kò béèrè.
- source_word: ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ
  choice: a dárí díẹ̀ jì máa ń ní ìfẹ́ díẹ̀
  rationale: Ó pa ìfiwéra àti agbára ọ̀rọ̀ òwe kékeré náà mọ́ ní Yorùbá adayébá.
theological_decisions:
- issue: Bóyá ὅτι túmọ̀ sí pé ìfẹ́ obìnrin náà ni ó jẹ́ okùnfà tí ó fi gba ìdáríjì
  choice: Lo “nítorí” nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ fi hàn pé ìfẹ́ náà tún lè jẹ́ ẹ̀rí ipò ìdáríjì rẹ̀.
  alternative: Lo “nítorí náà, ó ní ìfẹ́ púpọ̀,” kí ìfẹ́ jẹ́ àbájáde ìdáríjì ní gbangba.
  rationale: Ọ̀rọ̀ Gíríìkì gba ìtumọ̀ okùnfà ní tààrà, ṣùgbọ́n àkàwé tó ṣáájú àti ẹsẹ 50 lè jẹ́ kí a rí ìfẹ́ rẹ̀ gẹ́gẹ́ bí ẹ̀rí tàbí àbájáde ìdáríjì. Àlàyé ìsàlẹ̀ pa àìdánilójú àti ìfàṣẹ́yìn ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì yẹ fún òǹkàwé òde òní. “Máa ń” nínú gbólóhùn ìkẹyìn mú ipa òwe gbogbogbò ti ọ̀rọ̀ náà jáde.
