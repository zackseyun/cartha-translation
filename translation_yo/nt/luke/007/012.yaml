id: LUK.7.12
reference: Luke 7:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: yo
  text: Bí ó sì ti sún mọ́ ẹnubodè ìlú náà, wò ó, wọ́n ń gbé òkú ọkùnrin kan jáde. Ọmọkùnrin kan ṣoṣo ti ìyá rẹ̀ ni; ìyá náà sì jẹ́ opó, ọ̀pọ̀ ènìyàn láti inú ìlú náà sì wà pẹ̀lú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọkùnrin rẹ̀ ẹyọ kan ṣoṣo.”
    reason: Ó pa ọ̀nà mìíràn láti sọ μονογενὴς υἱός mọ́, pẹ̀lú ìtumọ̀ ‘ọmọkùnrin kan ṣoṣo,’ láìyọ ‘ọmọkùnrin’ kúrò nínú ìtumọ̀ náà.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Bí ó sì ti sún mọ́
  rationale: Ó fi ìṣẹ̀lẹ̀ àsìkò àti ìtẹ̀síwájú ìtàn hàn lọ́nà àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé ó ń sún mọ́ ibi kan mọ́.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: ẹnubodè ìlú náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ibodè tí a fi ń wọ ìlú olódi.
- source_word: καὶ ἰδοὺ
  choice: sì kíyèsí i
  rationale: Ó ń pe olùkà láti fiyè sí ìran tuntun lojijì, gẹ́gẹ́ bí ἰδού ṣe ń ṣiṣẹ́ nínú ìtàn.
- source_word: ἐξεκομίζετο
  choice: wọ́n ń gbé ... jáde
  rationale: Ìlànà yìí fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì bá àyíká ètò ìsìnkú mu.
- source_word: τεθνηκώς
  choice: òkú ọkùnrin kan
  rationale: Ó sọ ní ṣókí pé ọkùnrin náà ti kú, ní èdè Yorùbá tí ó wọ́pọ̀ nínú àyíká bí wọ́n ṣe ń gbé òkú lọ.
- source_word: μονογενὴς υἱός
  choice: Ọmọkùnrin kan ṣoṣo tí ìyá rẹ̀ bí
  rationale: Ó fi hàn pé òun nìkan ni ọmọkùnrin—àní ọmọ kan ṣoṣo—ti obìnrin náà bí, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: opó sì ni ìyá náà
  rationale: Ó ṣe ìdánimọ̀ obìnrin náà kedere, ó sì pa ìtẹnumọ́ tí αὐτή ní mọ́.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: ogunlọ́gọ̀ ènìyàn láti inú ìlú náà
  rationale: ‘Ogunlọ́gọ̀’ fi iye ènìyàn tí ó pọ̀ tó nínú ἱκανός hàn, ‘láti inú ìlú náà’ sì fi orísun wọn hàn.
- source_word: ἦν σὺν αὐτῇ
  choice: wà pẹ̀lú rẹ̀
  rationale: Ó túmọ̀ ìbáṣepọ̀ àti ìtẹ̀lé obìnrin náà ní ọ̀nà tó rọrùn, tó sì ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ μονογενής ní àyíká tí kì í ṣe ti Kristi
  choice: ọmọkùnrin kan ṣoṣo tí ìyá rẹ̀ bí
  alternative: ọmọ rẹ̀ kan ṣoṣo, ọmọkùnrin
  rationale: Níhìn-ín, μονογενής ń ṣàpèjúwe ìbáṣepọ̀ ọmọ náà sí ìyá rẹ̀, ìtumọ̀ rẹ̀ sì ni ọmọ kan ṣoṣo. A kò gbé ìtumọ̀ pàtàkì tí ọ̀rọ̀ náà lè ní ní àwọn àyíká nípa Kristi wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti ìtàn tí ó ṣe kedere ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A pín gbólóhùn Gíríìkì gígùn náà sí méjì kí ó lè ṣe àdánidá ní Yorùbá, láìsọ ìbáṣepọ̀ àwọn èrò inú rẹ̀ nù. A gbé àmì àlàyé [a] sí lẹ́yìn ọ̀rọ̀ tí ó ń ṣàlàyé, dípò ibi tí ó wà nínú consultation layer Gẹ̀ẹ́sì, nítorí àlàyé náà jẹ́ ti μονογενὴς υἱός.
