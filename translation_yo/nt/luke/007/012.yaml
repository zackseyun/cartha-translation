- from: Bí ó sì ti sún mọ́ ẹnubodè ìlú náà, sì kíyèsí i, wọ́n ń gbé òkú ọkùnrin kan jáde. Ọmọkùnrin kan ṣoṣo tí ìyá rẹ̀ bí[a] ni, opó sì ni ìyá náà; ogunlọ́gọ̀ ènìyàn láti inú ìlú náà sì wà pẹ̀lú rẹ̀.
  to: Bí ó sì ti sún mọ́ ẹnubodè ìlú náà, wò ó, wọ́n ń gbé òkú ọkùnrin kan jáde. Ọmọkùnrin kan ṣoṣo ti ìyá rẹ̀ ni; ìyá náà sì jẹ́ opó, ọ̀pọ̀ ènìyàn láti inú ìlú náà sì wà pẹ̀lú rẹ̀.[a]
  rationale: A rọ́pò ọ̀rọ̀ ìfẹ́sọ́nà náà pẹ̀lú ‘wò ó,’ a dín ìwọ̀n ogunlọ́gọ̀ kù sí ‘ọ̀pọ̀ ènìyàn’ kí ó bá ἱκανός mu, a sì ṣàtúnṣe àlàyé ìsàlẹ̀ ìwé kí ó pa ìtumọ̀ υἱός mọ́. Ìpín gbólóhùn méjì àti ìtẹnumọ́ pé ìyá náà jẹ́ opó ni a pa mọ́.
