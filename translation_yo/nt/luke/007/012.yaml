  terminology: ‘Ẹnubodè,’ ‘òpó,’ ‘òkú,’ àti ‘ọmọkùnrin kan ṣoṣo’ bá ìtumọ̀ Gíríìkì mu. Àlàyé ìsàlẹ̀ ìwé àkọ́kọ́ yí ìtumọ̀ padà sí ‘ọmọ kan ṣoṣo’ (eyiti ó lè yọ ọmọbìnrin kúrò nínú ìtumọ̀), nítorí náà a tún un ṣe kí ó má bà a kúrò nínú ‘ọmọkùnrin’ ti υἱός.
