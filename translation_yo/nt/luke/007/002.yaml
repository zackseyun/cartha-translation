id: LUK.7.2
reference: Luke 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: yo
  text: Ẹrú kan ti balógun ọgọ́rùn-ún kan ń ṣàìsàn, ó sì fẹ́rẹ̀ kú; ó sì jẹ́ ẹni iyebíye gan-an lójú balógun náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: balógun ọgọ́rùn-ún kan
  rationale: “Balógun ọgọ́rùn-ún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ipò olórí ọmọ ogun ọgọ́rùn-ún, “kan” sì pa àìlẹ́gbẹ́ tí τινος fi hàn mọ́.
- source_word: δέ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn tó rọ̀; “sì” so gbólóhùn náà mọ́ ohun tó ṣáájú láìfi ìtumọ̀ àkókò bí “nígbà náà” kún un.
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” pa ipò ìdè àti ìṣàkóso tó wà nínú δοῦλος mọ́ dáadáa ju “ìránṣẹ́” lọ nínú àyíká ilé ọ̀gágun yìí.
- source_word: κακῶς ἔχων
  choice: ń ṣàìsàn
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí pé ara rẹ̀ kò dára; “ń ṣàìsàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá àyíká àìsàn mu.
- source_word: ἤμελλεν τελευτᾶν
  choice: fẹ́rẹ̀ kú
  rationale: “Fẹ́rẹ̀ kú” fi hàn pé ikú ti sún mọ́lé, gẹ́gẹ́ bí μέλλω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ṣe túmọ̀ sí níbí.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: ẹrú náà sì ṣeyebíye púpọ̀ lójú balógun náà
  rationale: Àtúnsọ orúkọ méjèèjì mú ẹni tí àwọn arọ́pò-orúkọ tọ́ka sí ṣe kedere ní Yorùbá, “ṣeyebíye púpọ̀ lójú” sì pa ìtumọ̀ ọlá tàbí iye gíga ti ἔντιμος mọ́ láìfi ìfẹ́ ọkàn tí ọ̀rọ̀ náà kò sọ kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àyíká ẹrú ilé ọ̀rúndún kìíní
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àyíká náà ní ìbáṣepọ̀ ìdè àti ìṣàkóso nínú rẹ̀. “Ẹrú” fi èyí hàn ní tààrà, nígbà tí “ìránṣẹ́” lè dín agbára ìtumọ̀ náà kù; àmọ́ a tọ́ka sí i gẹ́gẹ́ bí àṣàyàn míì nítorí pé δοῦλος lè ní ìtumọ̀ yẹn ní àwọn àyíká kan.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnsọ “ẹrú náà” àti “balógun náà” yàgò fún àìdánilójú arọ́pò-orúkọ.
