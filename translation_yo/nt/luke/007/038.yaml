id: LUK.7.38
reference: Luke 7:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: yo
  text: Ó dúró lẹ́yìn rẹ̀ níbi ẹsẹ̀ rẹ̀, ó ń sọkún. Ó bẹ̀rẹ̀ sí fi omijé rẹ̀ rin ẹsẹ̀ rẹ̀, ó sì ń fi irun orí rẹ̀ nù wọ́n. Ó ń fi ẹnu kò ẹsẹ̀ rẹ̀ léraléra[a], ó sì ń fi òróró olóòórùn dídùn[b] pa wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń fi ẹnu kò ẹsẹ̀ rẹ̀.” Ọ̀rọ̀ Giriki náà ní agbára ìtẹnumọ́, ìrísí ọ̀rọ̀-ìṣe rẹ̀ sì lè fi hàn pé ó ń ṣe bẹ́ẹ̀ léraléra.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ikunra” tàbí “òróró olóòórùn dídùn”; ọ̀rọ̀ Giriki náà ń tọ́ka sí òróró tàbí ikunra tí a fi òórùn dídùn ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: Ó dúró
  rationale: Aorist participle náà ṣètò ìran náà; gbólóhùn olódì Yoruba yìí jẹ́ ti ẹ̀dá, ó sì pa ìṣe dídúró mọ́.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: lẹ́yìn rẹ̀ níbi ẹsẹ̀ rẹ̀
  rationale: 'Èyí pa méjèèjì mọ́: obìnrin náà wà lẹ́yìn Jesu, nítòsí ẹsẹ̀ rẹ̀, gẹ́gẹ́ bí ìdúró ẹni tí ó jókòó rọ̀gbọ̀kú níbi oúnjẹ ṣe jẹ́ kí ó ṣeé ṣe.'
- source_word: κλαίουσα
  choice: ó ń sọkún
  rationale: Àmì ‘ń’ fi hàn pé ẹkún náà ń bá a lọ, kì í ṣe ìṣẹ̀lẹ̀ ẹẹ̀kan ṣoṣo.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: Ó bẹ̀rẹ̀ sí fi omijé rẹ̀ rin
  rationale: ‘Bẹ̀rẹ̀ sí’ pa ìbẹ̀rẹ̀ ìṣe tí ἤρξατο tọ́ka sí mọ́; ‘fi … rin’ jẹ́ ọ̀nà Yoruba àdánidá fún mímú ohun kan tutù.
- source_word: ἐξέμασσεν
  choice: ó sì ń fi irun orí rẹ̀ nù wọ́n
  rationale: ‘Ń … nù’ pa ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì ṣàfihàn pípa omijé náà kúrò lára ẹsẹ̀; ‘irun orí rẹ̀’ tẹ̀lé àwòrán kíkún inú Giriki.
- source_word: κατεφίλει
  choice: Ó ń fi ẹnu ko … léraléra
  rationale: Ọ̀rọ̀ náà lè ní agbára ìfẹ́ni, imperfect náà sì dábàá ìṣe tí ó ń tẹ̀ síwájú tàbí tí a ń ṣe léraléra. ‘Léraléra’ jẹ́ kó ṣe kedere láìfi ìtumọ̀ ìfọkànsìn kún un.
- source_word: ἤλειφεν
  choice: ó sì ń fi … pa wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yoruba tó wọ́pọ̀ fún fífi òróró tàbí ikunra sí ara ohun kan, ‘ń’ sì pa imperfect aspect mọ́.
- source_word: τῷ μύρῳ
  choice: òróró olóòórùn dídùn
  rationale: μύρον túmọ̀ sí òróró tàbí ikunra tí ó ní òórùn dídùn; yíyan yìí ṣe kedere fún òǹkàwé òde òní láìdín ìtumọ̀ náà sí lọ́fíńdà olómi nìkan.
theological_decisions:
- issue: Àwọn ìṣe obìnrin náà sí ẹsẹ̀ Jesu
  choice: A sọ àwọn ìṣe ara rẹ̀ ní kedere, pẹ̀lú ẹkún, pípa ẹsẹ̀ nù, fífi ẹnu kò ó léraléra, àti fífi òróró sí i.
  alternative: Lílo ọ̀rọ̀ ìtumọ̀ bí ‘ó ń fi ìfọkànsìn hàn’ tàbí fífi ìfẹnukonu náà rọ̀.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ṣàpèjúwe àwọn ìṣe onírẹ̀lẹ̀ àti ti ìmọ̀lára tó lágbára, ṣùgbọ́n kò sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ wọn ní tààràtà; ìtumọ̀ náà kò gbọ́dọ̀ fi irú àlàyé bẹ́ẹ̀ kún un.
translation_notes:
  register: Yoruba boṣewa tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pín gbólóhùn Giriki gígùn náà sí gbólóhùn mẹ́ta fún ìṣàn Yoruba àdánidá, láìyí ìtẹ̀lé àwọn ìṣe padà. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
