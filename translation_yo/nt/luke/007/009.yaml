id: LUK.7.9
reference: Luke 7:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: yo
  text: Nígbà tí Jésù gbọ́ àwọn nǹkan wọ̀nyí, ẹnu yà á sí ọkùnrin náà. Ó sì yíjú sí ọ̀pọ̀ ènìyàn tí ń tọ̀ ọ́ lẹ́yìn, ó ní, “Mo sọ fún yín, àní ní Ísírẹ́lì, èmi kò rí irú ìgbàgbọ́ báyìí[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ tó tóbi tó bẹ́ẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbẹ́kẹ̀lé”; ọ̀rọ̀ Gíríìkì náà ni a sábà máa ń túmọ̀ sí “ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Nígbà tí Jésù gbọ́ àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ yìí mú ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì jáde lọ́nà àdánidá, ó sì pa ọ̀pọ̀ nínú ταῦτα mọ́.
- source_word: ἐθαύμασεν αὐτόν
  choice: ẹnu yà á sí ọkùnrin náà
  rationale: “Ẹnu yà á” jẹ́ ọ̀nà Yorùbá àdánidá fún ìyàlẹ́nu gidi; “sí ọkùnrin náà” mú kí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere láì fi orúkọ oyè tí Gíríìkì kò tún sọ kún un.
- source_word: στραφεὶς
  choice: Ó sì yíjú
  rationale: Ó ṣàfihàn yíyípadà sí ọ̀dọ̀ àwọn ènìyàn ní ọ̀nà ìtàn Yorùbá tó rọrùn.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: sí ọ̀pọ̀ ènìyàn tí ń tọ̀ ọ́ lẹ́yìn
  rationale: Àmì ìṣe tó ń bá a lọ nínú ἀκολουθοῦντι wà nínú “tí ń tọ̀ ọ́ lẹ́yìn,” ọ̀rọ̀ náà sì yé àwọn òǹkàwé òde òní.
- source_word: Λέγω ὑμῖν
  choice: Mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tààrà, àdánidá, tó sì pa agbára ọ̀rọ̀ Jésù mọ́.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: àní ní Ísírẹ́lì
  rationale: “Àní” mú ìtẹnumọ́ οὐδέ jáde, “ní Ísírẹ́lì” sì pa ìtumọ̀ ibi tàbí àárín àwọn ènìyàn Ísírẹ́lì mọ́.
- source_word: τοσαύτην πίστιν
  choice: irú ìgbàgbọ́ báyìí
  rationale: Èyí pa ìwọn tàbí irú ìgbàgbọ́ tí τοσαύτην ń tẹnumọ́ mọ́ láì pinnu bóyá ìtẹnumọ́ náà jẹ́ “ńlá” nìkan; àlàyé ìsàlẹ̀ fún ọ̀nà míì wà.
- source_word: εὗρον
  choice: èmi kò rí
  rationale: Fífi “èmi” hàn mú ìtẹnumọ́ ẹni tó ń sọ̀rọ̀ jáde; àkókò ìṣe Yorùbá náà bá ìkéde ohun tí Jésù ti rí títí di àsìkò yẹn mu.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìgbẹ́kẹ̀lé balógun ọ̀rún nínú àṣẹ Jésù. “Ìgbàgbọ́” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀, ṣùgbọ́n a pa “ìgbẹ́kẹ̀lé” mọ́ gẹ́gẹ́ bí ọ̀nà ìtumọ̀ tó ṣeé ṣe.
- issue: Ibi tí “Ísírẹ́lì” ń tọ́ka sí
  choice: ní Ísírẹ́lì
  alternative: láàárín àwọn ènìyàn Ísírẹ́lì
  rationale: Gíríìkì lè ṣiṣẹ́ gẹ́gẹ́ bí ibi tàbí gẹ́gẹ́ bí ìtọ́ka sí àwọn ènìyàn Ísírẹ́lì. A pa ọ̀rọ̀ kúkúrú orísun náà mọ́ láì yan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “ọ̀pọ̀ ènìyàn” dípò ọ̀rọ̀ líle tàbí àtijọ́ fún ὄχλος.
