source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: yo
  text: Ìròyìn yìí nípa rẹ̀ sì tàn ká gbogbo Jùdíà àti gbogbo agbègbè tó yí i ká.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀rọ̀ yìí nípa rẹ̀” tàbí “Àlàyé yìí nípa rẹ̀.”
    reason: Àwọn ìtumọ̀ wọ̀nyí tún lè dúró fún λόγος nínú àyíká ọ̀rọ̀ yìí.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: tàn ká
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń ṣàpèjúwe bí ìròyìn ṣe dé ibi gbogbo; “tàn ká” jẹ́ èdè Yorùbá àdánidá tó sì pa àwòrán ìtànkálẹ̀ mọ́.
- source_word: ὁ λόγος οὗτος
  choice: Ìròyìn yìí
  rationale: λόγος níbí túmọ̀ sí ohun tí àwọn ènìyàn ń ròyìn nípa iṣẹ́ Jesu, kì í ṣe ọ̀rọ̀ kan ṣoṣo. “Ìròyìn” bá àyíká ìtàn náà mu.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: ká gbogbo Jùdíà
  rationale: Àkójọpọ̀ “tàn ká gbogbo” fi hàn pé ìròyìn náà dé jákèjádò Jùdíà.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì ṣe kedere fún περί pẹ̀lú ẹ̀yà ọ̀rọ̀ oníjìnlẹ̀.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: gbogbo agbègbè tó yí i ká
  rationale: Gbólóhùn yìí túmọ̀ περίχωρος gẹ́gẹ́ bí gbogbo ilẹ̀ tàbí agbègbè tó wà ní àyíká Jùdíà, ní èdè Yorùbá òde òní.
- source_word: καὶ ... καὶ
  choice: sì ... àti
  rationale: “Sì” so ẹsẹ̀ náà mọ́ ohun tó ṣáájú, “àti” sì so àwọn agbègbè méjèèjì pọ̀ láì sọ agbára àkójọpọ̀ náà nù.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó ṣe déédéé, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “tàn ká” dípò ìtumọ̀ gẹ́gẹ́ bí “jáde” nítorí pé ó jẹ́ àdánidá jù lọ fún ìròyìn tó ń lọ káàkiri.
