reference: Luke 7:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: yo
  text: 'Ó sì dá wọn lóhùn pé, “Ẹ lọ sọ fún Jòhánù ohun tí ẹ ti rí, tí ẹ sì ti gbọ́: àwọn afọ́jú ń ríran[a], àwọn arọ ń rìn, àwọn adẹ́tẹ̀ ni a ń sọ di mímọ́, àwọn adití ń gbọ́, àwọn òkú ni a ń jí dìde, a sì ń kéde ìhìn rere fún àwọn òtòṣì[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn afọ́jú tún ń ríran.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríran padà tàbí gbígbé ojú sókè; níbí, ó ń tọ́ka sí ríran.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn òtòṣì ni a ń wàásù ìhìn rere fún.” Nínú Gíríìkì, a kò dárúkọ ẹni tí ń kéde ìhìn rere náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Ó sì dá wọn lóhùn pé
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù ń fèsì sí ohun tí wọ́n béèrè; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìdáhùn mọ́.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Ẹ lọ sọ fún
  rationale: Participle náà bá àṣẹ náà ṣiṣẹ́ gẹ́gẹ́ bí ìṣe tó tẹ̀ lé e; “Ẹ lọ sọ fún” jẹ́ ọ̀nà Yorùbá àdánidá láti gbé àṣẹ méjèèjì jáde.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: ohun tí ẹ ti rí, tí ẹ sì ti gbọ́
  rationale: Ìtumọ̀ yìí pa ẹ̀rí ohun tí àwọn aṣojú náà ti rí àti ohun tí wọ́n ti gbọ́ mọ́.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: àwọn afọ́jú ń ríran
  rationale: “Ń ríran” ṣàlàyé pé wọ́n gba agbára ìrí; àlàyé ẹsẹ̀ pa ìtumọ̀ míì, “tún ń ríran,” mọ́.
- source_word: χωλοὶ περιπατοῦσιν
  choice: àwọn arọ ń rìn
  rationale: Ó jẹ́ ìtumọ̀ tààrà, kedere, tí ó sì bójú mu ní Yorùbá òde òní.
- source_word: λεπροὶ καθαρίζονται
  choice: àwọn adẹ́tẹ̀ ni a ń sọ di mímọ́
  rationale: “Sọ di mímọ́” pa èrò ìwòsàn àti ìmúpadàbọ̀ sí ipò mímọ́ mọ́, dípò kí a dín un kù sí ìwòsàn ara nìkan.
- source_word: κωφοὶ ἀκούουσιν
  choice: àwọn adití ń gbọ́ràn
  rationale: Pẹ̀lú ἀκούουσιν, κωφοί túmọ̀ sí àwọn tí kò gbọ́; “ń gbọ́ràn” níbí túmọ̀ sí pé etí wọn ń gbọ́ ohun, kì í ṣe ìgbọ́ràn sí àṣẹ.
- source_word: νεκροὶ ἐγείρονται
  choice: àwọn òkú ni a ń jí dìde
  rationale: Ìṣísẹ̀ aláìlórúkọ yìí pa passive Gíríìkì mọ́, kò sì fi ẹni tó ń ṣe iṣẹ́ náà kún ọ̀rọ̀.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: a sì ń kéde ìhìn rere fún àwọn òtòṣì
  rationale: Yorùbá kò fi bẹ́ẹ̀ gba passive yìí lọ́nà àdánidá; ìtumọ̀ yìí pa àkóónú rẹ̀ mọ́ pé àwọn òtòṣì ni a ń kéde ìhìn rere fún, láì lo ọ̀rọ̀ ẹ̀sìn tí kò ṣe kedere.
theological_decisions:
- issue: Àkójọ iṣẹ́ ìyanu gẹ́gẹ́ bí ẹ̀rí nípa ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀
  choice: A túmọ̀ àwọn gbólóhùn náà gẹ́gẹ́ bí iṣẹ́ ìmúpadàbọ̀ tí a lè rí, láì fi kún un ní tààrà pé àsọtẹ́lẹ̀ Mèsáyà ni ó ń ṣẹ.
  alternative: Ṣíṣe ìtọ́kasí ìmúṣẹ àsọtẹ́lẹ̀ Aísáyà ní gbangba nínú ọ̀rọ̀ pàtàkì.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ fi iṣẹ́ Jésù hàn gẹ́gẹ́ bí ìròyìn tí a ó mú lọ fún Jòhánù; ó yẹ kí ìtumọ̀ pa ìtọ́kasí tí kò sọ ara rẹ̀ ní gbangba mọ́, láì fi ìparí ẹ̀kọ́ ìsìn kún un.
- issue: Agbára àwọn ọ̀rọ̀ passive nínú àkójọ náà
  choice: A kò sọ Ọlọ́run tàbí Jésù ní gbangba gẹ́gẹ́ bí olùṣe níbi tí Gíríìkì kò ti sọ olùṣe.
  alternative: “Ọlọ́run ń jí àwọn òkú dìde” tàbí “Mo ń kéde ìhìn rere fún àwọn òtòṣì.”
  rationale: Ìwé Gíríìkì fi olùṣe sílẹ̀ láì dárúkọ; fífi orúkọ olùṣe kún un yóò túmọ̀ ọ̀rọ̀ kọjá ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A lo “ẹ” ọ̀pọ̀ ènìyàn fún àwọn aṣojú Jòhánù. Àwọn àmì ohùn ni a fi sí ibi tí wọ́n ti jẹ́ ti ẹ̀dá; a sì yàgò fún ọ̀rọ̀ ẹ̀sìn àkànṣe tí ó lè fi ẹ̀kọ́ ẹgbẹ́ kan kún ẹsẹ̀ náà.
