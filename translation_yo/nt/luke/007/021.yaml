  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: yo
  text: Ní wákàtí yẹn[a], ó wo ọ̀pọ̀ ènìyàn sàn kúrò lọ́wọ́ àìsàn, ìpọ́njú líle[b], àti àwọn ẹ̀mí búburú; ó sì fi ojú rírí fún ọ̀pọ̀ afọ́jú ní oore[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní wákàtí yẹn gan-an.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ bí ohun náà ṣe ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ ní àkókò yẹn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìyà líle” tàbí “àjàkálẹ̀-àìsàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pàṣán ní ti gidi, tàbí sí ìpọ́njú ara tó le gan-an ní ìtumọ̀ fífẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ó fi oore fún ọ̀pọ̀ afọ́jú láti rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Ní wákàtí yẹn
  rationale: Ó pa ìtọ́kasí àkókò pàtó tí Lúùkù lò mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἐθεράπευσεν πολλοὺς
  choice: ó wo ọ̀pọ̀ ènìyàn sàn
  rationale: ‘Wo … sàn’ ni ọ̀nà àdánidá ní Yorùbá láti sọ pé a mú ènìyàn láradá; ‘ènìyàn’ mú ẹni tí ‘ọ̀pọ̀’ ń tọ́ka sí ṣe kedere láì fi ìtumọ̀ tuntun kún un.
- source_word: ἀπὸ νόσων
  choice: kúrò lọ́wọ́ àìsàn
  rationale: ‘Kúrò lọ́wọ́’ fi ìtumọ̀ ìyapa tàbí ìdáǹdè inú ἀπό hàn ní Yorùbá àdánidá.
- source_word: μαστίγων
  choice: ìpọ́njú líle
  rationale: Nínú àyíká ìwòsàn, ọ̀rọ̀ náà lè túmọ̀ sí ìyà líle tàbí àìsàn tí ń dá ènìyàn lóró, kì í ṣe pàṣán gangan nìkan.
- source_word: πνευμάτων πονηρῶν
  choice: àwọn ẹ̀mí búburú
  rationale: Èyí túmọ̀ πονηρῶν ní tààrà gẹ́gẹ́ bí ‘búburú,’ kò sì yí àwọn ẹ̀mí náà padà sí àpèjúwe àìsàn lásán.
- source_word: τυφλοῖς πολλοῖς
  choice: ọ̀pọ̀ afọ́jú
  rationale: Ó fi àwọn olùgbà iṣẹ́ náà hàn láì fi akọ tàbí abo tí Gíríìkì kò sọ kún un.
- source_word: ἐχαρίσατο βλέπειν
  choice: fi oore fún … láti ríran
  rationale: ‘Fi oore fún’ pa ìtumọ̀ fífúnni lọ́fẹ̀ẹ́ tàbí pẹ̀lú oore inú χαρίζομαι mọ́, nígbà tí ‘láti ríran’ tẹ̀lé infinitive βλέπειν ní kedere.
theological_decisions:
- issue: Irú iṣẹ́ tí Jésù ṣe sí àwọn tí àwọn ẹ̀mí búburú ń pọ́n lójú
  choice: A túmọ̀ πνευμάτων πονηρῶν sí ‘àwọn ẹ̀mí búburú,’ ní mímú ìtumọ̀ ẹ̀mí ẹni-ara rẹ̀ dúró.
  alternative: Kí a ka gbólóhùn náà sí àpèjúwe àìsàn ọpọlọ tàbí ti ara tí kò ní í ṣe pẹ̀lú ẹ̀mí.
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí àwọn ẹ̀mí búburú ní tààrà; ìtumọ̀ náà kò gbọ́dọ̀ sọ ọ́ di àrùn lásán tàbí fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àmì adákọ ya àwọn iṣẹ́ ìwòsàn sí méjì láì sọ ìbáṣepọ̀ wọn di ohun tí Gíríìkì kò sọ.
