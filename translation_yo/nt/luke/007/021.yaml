revisions:
- from: Ní wákàtí yẹn[a], ó wo ọ̀pọ̀ ènìyàn sàn kúrò lọ́wọ́ àìsàn, ìpọ́njú líle[b], àti àwọn ẹ̀mí búburú; ó sì fi oore fún ọ̀pọ̀ afọ́jú láti ríran[c].
  to: Ní wákàtí yẹn[a], ó wo ọ̀pọ̀ ènìyàn sàn kúrò lọ́wọ́ àìsàn, ìpọ́njú líle[b], àti àwọn ẹ̀mí búburú; ó sì fi ojú rírí fún ọ̀pọ̀ afọ́jú ní oore[c].
  rationale: Àtúnṣe náà yọ ìṣòro gírámà nínú ‘láti ríran,’ ó sì rọ́pò rẹ̀ pẹ̀lú ‘fi ojú rírí fún ... ní oore.’ Èyí pa ‘sight’ mọ́, ó sì fi hàn pé ìfẹ́-ọ̀fẹ́ ni ìṣe χαρίζομαι, láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn kankan. Àwọn ìtọ́kasí àti àmì ìsàlẹ̀ wà ní ipò tó yẹ.
