  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ẹsẹ̀ Gíríìkì náà dáadáa: àkókò pàtó, ìwòsàn kúrò nínú àìsàn/ìpọ́njú/ẹ̀mí búburú, àti fífún àwọn afọ́jú ní agbára ìríran. Síbẹ̀, ‘láti ríran’ lẹ́yìn ‘láti’ kò dára gẹ́gẹ́ bí ìlò Yorùbá nínú gbólóhùn yìí.'
