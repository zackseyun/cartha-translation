id: LUK.7.46
reference: Luke 7:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: yo
  text: Ìwọ kò fi òróró kun orí mi, ṣùgbọ́n obìnrin yìí fi òróró olóòórùn dídùn[a] kun ẹsẹ̀ mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun ìkunra olóòórùn dídùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: fi òróró
  rationale: Ọ̀rọ̀ náà jẹ́ dative ti ohun èlò; “òróró” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere láìfi “ólífì” kún un níbi tí àyíká kò ti béèrè rẹ̀.
- source_word: ἤλειψας / ἤλειψεν
  choice: fi ... kun
  rationale: ἀλείφω túmọ̀ sí fífi òróró tàbí ohun olóòórùn dídùn sí ara. “Fi ... kun” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì yẹra fún èrò pé ìṣe náà jẹ́ ìyàsímímọ́ ní dandan.
- source_word: κεφαλήν μου
  choice: orí mi
  rationale: Ìtumọ̀ tààrà ti ọ̀rọ̀ olùgbà pẹ̀lú arọ́pò-orúkọ ohun-ìní.
- source_word: αὕτη δὲ
  choice: ṣùgbọ́n obìnrin yìí
  rationale: αὕτη ń tọ́ka sí obìnrin tó wà níbẹ̀ pẹ̀lú ìtẹnumọ́; “obìnrin yìí” mú ìyàtọ̀ láàárín ìwọ àti òun hàn gbangba.
- source_word: μύρῳ
  choice: fi òróró olóòórùn dídùn
  rationale: μύρον jẹ́ òróró tàbí ohun ìkunra olóòórùn dídùn. Gbólóhùn yìí jẹ́ kedere ní Yorùbá, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí òróró lásán nínú gbólóhùn àkọ́kọ́.
- source_word: τοὺς πόδας μου
  choice: ẹsẹ̀ mi
  rationale: Ìtumọ̀ tààrà àti àdánidá ní Yorùbá; “ẹsẹ̀” lè tọ́ka sí ẹsẹ̀ méjèèjì gẹ́gẹ́ bí àyíká ṣe fi hàn.
theological_decisions:
- issue: Ìyàtọ̀ ọlá-àlejò nínú ìbáwí Jésù
  choice: Lo ọ̀rọ̀ àdánidá “fi ... kun” láti sọ ìṣe fífi òróró sí ara láìfi ìtumọ̀ ayẹyẹ ìyàsímímọ́ kún un.
  alternative: Lo “fìòróró yàn,” èyí tó lè gbé ìtumọ̀ ìyàsímímọ́ tàbí ipò Mèsáyà wọlé ju ohun tí àyíká yìí ń béèrè lọ.
  rationale: Àyíká ẹsẹ náà ń fi àìṣe ọlá-àlejò Símónì wé ọlá ńlá tí obìnrin náà fi fún Jésù; kò yẹ kí ìtumọ̀ tú ìṣe náà sí ẹ̀kọ́ ìsìn pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé yé fún òǹkàwé gbogbogbò. Àtúnṣe náà pa ìfiwéra tó wà láàárín òróró lásán àti òróró olóòórùn dídùn mọ́.
