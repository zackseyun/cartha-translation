base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: yo
  text: Ọ̀kan lára àwọn Farisí sì ń béèrè lọ́wọ́ rẹ̀ pé kí ó bá òun jẹun[a]. Lẹ́yìn tí ó wọ ilé Farisí náà, ó rọ̀gbọ̀ sílẹ̀ fún oúnjẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń bẹ̀ ẹ́ pé kí ó bá òun jẹun.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, ó gba ipò tí wọ́n máa ń gbà ní àsè nígbà náà, ní rírògbọ̀ sílẹ̀ dípò jíjókòó ní gígún.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: ń bẹ̀ ẹ́
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn; “ń bẹ̀ ẹ́” pa apá yìí mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó jẹ́ ìpè sí oúnjẹ.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn náà síwájú láìfi ìtakora tó lágbára kún un.
- source_word: τις τῶν Φαρισαίων
  choice: ọ̀kan lára àwọn Farisí
  rationale: Èyí fi ìtumọ̀ apá-nínú-àpapọ̀ hàn ní Yorùbá àdánidá.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: pé kí ó bá òun jẹun
  rationale: Ìtumọ̀ yìí tẹ̀lé ìṣètò ète ἵνα pẹ̀lú ọ̀rọ̀-ìṣe àṣẹ̀sọ, ó sì ya “òun” tí ń tọ́ka sí Farisí náà sọ́tọ̀ kúrò lọ́dọ̀ “ó” tí ń tọ́ka sí Jésù.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: nígbà tí ó wọ ilé Farisí náà
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist náà ṣáájú ìṣe pàtàkì; “nígbà tí ó wọ” sọ ìtẹ̀lé ìṣẹ̀lẹ̀ náà ní Yorùbá tó rọrùn.
- source_word: κατεκλίθη
  choice: ó rọ̀gbọ̀ síbi tábìlì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ara rọ̀gbọ̀ fún oúnjẹ gẹ́gẹ́ bí àṣà àsè nígbà náà, kì í ṣe jíjókòó lásán.
theological_decisions: []
translation_notes:
  register: Yorùbá àjùmọ̀lò tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Farisí” ni ìkọ̀wé orúkọ ẹgbẹ́ náà. Àwọn arọ́pò-orúkọ “ó” àti “òun” mú ẹni tí ọ̀kọ̀ọ̀kan ń tọ́ka sí ṣe kedere láìfi àlàyé tí kò sí nínú orísun kún un.
