id: LUK.7.27
reference: Luke 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: yo
  text: 'Èyí ni ẹni tí a kọ nípa rẹ̀ pé: “Wò ó, mo ń rán aṣojú mi[a] ṣáájú rẹ[b], ẹni tí yóò pèsè ọ̀nà rẹ níwájú rẹ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “aṣojú” sí “áńgẹ́lì”; ṣùgbọ́n níbí, Jòhánù ni ọ̀rọ̀ náà ń tọ́ka sí gẹ́gẹ́ bí ènìyàn tí a rán.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, èdè Gíríìkì sọ pé, “níwájú ojú rẹ”; ìtumọ̀ tó rọrùn ní Yorùbá ni “ṣáájú rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Èyí ni ẹni
  rationale: Ó tọ́ka sí Jòhánù pẹ̀lú ìtẹnumọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘this is he.’
- source_word: περὶ οὗ γέγραπται
  choice: tí a kọ nípa rẹ̀
  rationale: Ó pa ìlànà ọ̀rọ̀ ìtọ́kasí Ìwé Mímọ́ mọ́ ní èdè Yorùbá tó ṣe kedere, láìfi àlàyé kún un.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó mú ìpè láti kíyèsí ohun tí ó tẹ̀ lé jáde, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ àsọtẹ́lẹ̀ mu.
- source_word: ἀποστέλλω
  choice: mo ń rán
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ sọ ìṣe náà di ohun tó hàn gbangba, ó sì bá present tense Gíríìkì mu.
- source_word: ἄγγελόν
  choice: aṣojú
  rationale: Ní ibi yìí, ọ̀rọ̀ náà ń tọ́ka sí Jòhánù gẹ́gẹ́ bí ènìyàn tí a rán, kì í ṣe dandan sí ẹ̀dá ọ̀run.
- source_word: πρὸ προσώπου σου
  choice: ṣáájú rẹ
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ẹni tí a rán lọ ṣáájú ẹlòmíràn; àwòrán gangan ti ‘ojú’ wà nínú àlàyé ìsàlẹ̀.
- source_word: κατασκευάσει
  choice: yóò pèsè
  rationale: Ó túmọ̀ ìmúrasílẹ̀ tàbí ṣíṣe ohun kan sí mímúra ní kedere.
- source_word: τὴν ὁδόν σου
  choice: ọ̀nà rẹ
  rationale: ‘Ọ̀nà’ lè dúró fún ipa-ọ̀nà gangan àti ìtumọ̀ àpẹẹrẹ tó wà nínú àsọtẹ́lẹ̀.
- source_word: ἔμπροσθέν σου
  choice: níwájú rẹ
  rationale: Ó ṣe àfihàn ipò ẹni náà níwájú ẹni kejì, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Lílo ọ̀rọ̀ inú Málákì/Ẹ́kísódù fún Jòhánù ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Jésù
  choice: 'Pa gbogbo arọ́pò-orúkọ ẹni kejì mọ́: ‘rẹ,’ ‘ọ̀nà rẹ,’ àti ‘níwájú rẹ.’'
  alternative: Fi àlàyé kún un pé aṣojú náà ń pèsè ọ̀nà fún Olúwa tàbí Mèsáyà.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò ṣàlàyé ẹni tí arọ́pò-orúkọ kọ̀ọ̀kan ń tọ́ka sí ju bí ọ̀rọ̀ Gíríìkì ṣe gbé e kalẹ̀ lọ. Pípa wọn mọ́ ń dáàbò bo agbára ẹ̀kọ́ ìgbàgbọ́ inú lílo ọ̀rọ̀ náà láìfi ìtumọ̀ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Wò ó” pa ohùn ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́; “aṣojú” yàgò fún fífi òye ẹ̀dá ọ̀run lé ἄγγελος lórí ní ibi tí ó ń tọ́ka sí Jòhánù. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ.
