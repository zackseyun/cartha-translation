source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: yo
  text: 'Ó sì sún mọ́ ọn, ó sì fọwọ́ kan àkéte ìgbé òkú náà[a]; àwọn tí ń gbé e sì dúró jẹ́ẹ́. Ó sì wí pé, “Ọ̀dọ́mọkùnrin, mo wí fún ọ: dìde!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pósí” tàbí “pẹpẹ ìgbé òkú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a fi gbé òkú nínú ìrìn ìsìnkú; kò pọndandan pé ó jẹ́ pósí tí a pa mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ó sún mọ́ ọn
  rationale: Aorist participle náà fi hàn pé Jésù kọ́kọ́ sún mọ́ ibi tí wọ́n ti ń gbé òkú náà, kí ó tó fọwọ́ kàn án. Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìṣe náà mọ́.
- source_word: ἥψατο
  choice: ó fọwọ́ kan
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọwọ́ kan ohun kan; kò pọndandan pé ó dì í mú. “Fọwọ́ kan” ṣe kedere láìfi ohun tí ẹsẹ náà kò sọ kún un.
- source_word: σοροῦ
  choice: pẹpẹ ìgbé òkú
  rationale: σορός lè tọ́ka sí pẹpẹ tàbí ohun tí a fi gbé òkú nínú ìrìn ìsìnkú, kì í sì í ṣe pósí tí a pa mọ́ ní gbogbo ìgbà. “Pẹpẹ ìgbé òkú” ṣe àlàyé ohun náà ní èdè tí òǹkàwé òde òní lè lóye, láìdá a mọ́ pósí nìkan.
- source_word: οἱ δὲ βαστάζοντες
  choice: àwọn tí ń gbé e
  rationale: Ó tọ́ka sí àwọn ẹni tí wọ́n ń ru pẹpẹ ìgbé òkú náà. Arọ́pò-orúkọ “e” mú ìtumọ̀ náà pé ní Yorùbá.
- source_word: ἔστησαν
  choice: dúró jẹ́ẹ́
  rationale: Ọ̀rọ̀ náà fi hàn pé wọ́n dá ìrìn wọn dúró, wọ́n sì dúró síbi kan. “Dúró jẹ́ẹ́” pa ìtumọ̀ méjèèjì mọ́ ní ọ̀nà àdánidá.
- source_word: Νεανίσκε
  choice: Ọ̀dọ́mọkùnrin
  rationale: Èyí jẹ́ ọ̀rọ̀ ìpè tààrà sí ọkùnrin ọ̀dọ́ kan, “Ọ̀dọ́mọkùnrin” sì jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere tí ó sì bójú mu.
- source_word: σοὶ λέγω
  choice: ìwọ ni mo ń sọ fún
  rationale: Fífi “ìwọ” sí ipò ìtẹnumọ́ pa agbára àti tààràtà ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: ἐγέρθητι
  choice: dìde
  rationale: Nínú ọ̀rọ̀ tí a sọ tààrà, “dìde” jẹ́ àṣẹ Yorùbá tí ó ṣe kedere, ó sì lè gbé ìtumọ̀ dídìde kúrò nínú ikú nínú àyíká ìtàn náà láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ohùn àti agbára àṣẹ Jésù sí ọ̀dọ́mọkùnrin tí ó kú
  choice: “dìde!”
  alternative: “jẹ́ kí a jí ọ dìde” tàbí “gbéra dìde”
  rationale: “Dìde!” jẹ́ àṣẹ tààrà, tí ó lágbára, tí ó sì bá èdè Yorùbá mu. Kò sọ ọ́ di ọ̀rọ̀ ìjíròrò, bẹ́ẹ̀ ni kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé fọ́ọ̀mù Gíríìkì tí ó lè dà bí passive/deponent lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo “pẹpẹ ìgbé òkú” dípò “pósí” nínú ọ̀rọ̀ pàtàkì láti yẹra fún fífi àwòrán pósí òde òní lé àṣà ìsìnkú ìgbà náà; àlàyé ìsàlẹ̀ fúnni ní àwọn ọ̀nà míì.
