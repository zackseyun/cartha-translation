id: LUK.7.32
reference: Luke 7:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: yo
  text: 'Wọ́n dà bí àwọn ọmọdé tí wọ́n jókòó ní ọjà, tí wọ́n ń pè ara wọn pé: “Àwa fẹ́ fèrè fún yín[a], ẹ̀yin kò sì jó; àwa kọ orin ìṣọ̀fọ̀[b], ẹ̀yin kò sì sunkún.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwa ta fèrè fún yín.” Ọ̀rọ̀ Gíríìkì náà tọ́ka ní pàtó sí fífẹ́ tàbí títà fèrè/paipu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwa ké arò” tàbí “àwa kọ orin ìsìnkú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíké arò, títí kan arò ìsìnkú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Wọ́n dà bí
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti bẹ̀rẹ̀ àfiwé, ó sì pa ìtumọ̀ Gíríìkì mọ́.
- source_word: παιδίοις
  choice: àwọn ọmọdé
  rationale: Ó tọ́ka sí àwọn ọmọ láì sọ ọjọ́-orí tàbí akọ-abo wọn ní pàtó.
- source_word: ἐν ἀγορᾷ καθημένοις
  choice: tí wọ́n jókòó ní ọjà
  rationale: Ó mú ipò àti ibi tí àwọn ọmọ náà wà jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: tí wọ́n sì ń ké pe ara wọn
  rationale: Ó fi hàn pé wọ́n ń pe ara wọn sókè ní gbangba, ó sì pa ìṣe alábàápín ἀλλήλοις mọ́.
- source_word: ἃ λέγει
  choice: pé
  rationale: Àwọn ẹ̀dà Gíríìkì ní ìṣòro kékeré nínú gbólóhùn ìbátan yìí; lílo “pé” jẹ́ ọ̀nà Yorùbá tó rọrùn láti mú ọ̀rọ̀ tí wọ́n ké sọ wọlé láì fi àìdánilójú gírámà kún un.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Àwa fun fèrè fún yín
  rationale: αὐλέω túmọ̀ sí fífún fèrè tàbí ohun èlò afẹ́fẹ́ kan; “fun fèrè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, kì í ṣe orin lásán.
- source_word: οὐκ ὠρχήσασθε
  choice: ẹ̀yin kò sì jó
  rationale: Ó túmọ̀ ìdáhùn tí a retí sí orin ayọ̀ ní ọ̀nà tó ṣe tààrà.
- source_word: ἐθρηνήσαμεν
  choice: àwa kọ orin arò
  rationale: θρηνέω lè túmọ̀ sí kíké arò tàbí kíkọ orin ọ̀fọ̀; “kọ orin arò” pa ìṣe eré àwọn ọmọ àti ìyàtọ̀ rẹ̀ sí fífún fèrè mọ́.
- source_word: οὐκ ἐκλαύσατε
  choice: ẹ̀yin kò sì sunkún
  rationale: κλαίω túmọ̀ sí sísunkún; yíyan ọ̀rọ̀ yìí pa àwòrán ọ̀rọ̀ náà mọ́ láì túmọ̀ rẹ̀ sí ẹ̀kọ́ mìíràn.
theological_decisions:
- issue: Bí a ṣe máa pa agbára àkàwé àwọn ìṣe méjèèjì mọ́ láì ṣàlàyé ìlò rẹ̀ jù.
  choice: 'Lo àwọn ìṣe tó ṣe kedere: “fun fèrè,” “jó,” “kọ orin arò,” àti “sunkún.”'
  alternative: Túmọ̀ wọn ní ìtumọ̀ ìṣàlàyé bí “ṣe ayẹyẹ” àti “ṣọ̀fọ̀.”
  rationale: Ẹsẹ yìí fúnra rẹ̀ gbé àkàwé kalẹ̀, kò sì tíì túmọ̀ rẹ̀. Àwọn ọ̀rọ̀ ìṣe gidi pa àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ inú rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo “ọjà” fún ἀγορά gẹ́gẹ́ bí àgbègbè gbangba tí ìtajà àti ìpéjọpọ̀ ti máa ń wáyé. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
