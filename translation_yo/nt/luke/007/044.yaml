source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: yo
  text: Ó sì yíjú sí obìnrin náà, ó sọ fún Símónì pé, “Ǹjẹ́ o rí obìnrin yìí? Mo wọ ilé rẹ; ìwọ kò fún mi ní omi fún ẹsẹ̀ mi,[a] ṣùgbọ́n òun fi omijé rẹ̀ rin ẹsẹ̀ mi, ó sì fi irun rẹ̀ nù wọ́n.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tí ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “ìwọ kò fún mi ní omi sórí ẹsẹ̀ mi.” Ohun tí a ní lọ́kàn ni àṣà fífún àlejò ní omi fún fífọ̀ ẹsẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: Ó sì yíjú sí obìnrin náà
  rationale: Ó mú ìyípadà ara Jesu sí ọ̀dọ̀ obìnrin náà jáde ní Yorùbá àdánidá, ó sì bá iṣe tí ó ṣáájú ọ̀rọ̀ rẹ̀ mu.
- source_word: τῷ Σίμωνι ἔφη
  choice: ó sọ fún Símónì pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ó bá Símónì sọ̀rọ̀ nínú ìtàn.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Ǹjẹ́ o rí obìnrin yìí?
  rationale: Ó pa ìbéèrè tààrà àti ìtẹnumọ́ tí ọ̀rọ̀ atọ́ka ταύτην ní mọ́.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Mo wọ ilé rẹ
  rationale: Ìtumọ̀ kúkúrú, tààrà, tí ó bá aorist àti οἰκία mu.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: ìwọ kò fún mi ní omi láti wẹ ẹsẹ̀ mi
  rationale: Ó sọ ìṣe àṣà tí omi náà wà fún ní Yorùbá tí ó ṣe kedere, láìsọ pé Símónì fúnra rẹ̀ ni yóò wẹ ẹsẹ̀ náà.
- source_word: αὕτη δὲ
  choice: ṣùgbọ́n òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ òun mú ìyàtọ̀ láàárín ohun tí Símónì kò ṣe àti ohun tí obìnrin náà ṣe hàn gbangba.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: fi omijé rẹ̀ rin ẹsẹ̀ mi
  rationale: Ó pa omijé mọ́ gẹ́gẹ́ bí ohun èlò tí ó fi mú ẹsẹ̀ Jesu tutù, láìfikún àlàyé tí kò sí nínú Gíríìkì.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: ó sì fi irun rẹ̀ nù wọ́n
  rationale: Ó túmọ̀ ìṣe pípa tàbí nù ẹsẹ̀ náà ní ọ̀nà Yorùbá àdánidá; wọ́n tọ́ka padà sí ẹsẹ̀ méjèèjì.
theological_decisions: []
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àkọsílẹ̀ Yorùbá mu, a sì pa ìyàtọ̀ tí Jesu ṣe láàárín Símónì àti obìnrin náà mọ́.
