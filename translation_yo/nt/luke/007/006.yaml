id: LUK.7.6
reference: Luke 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: yo
  text: Jésù sì bá wọn lọ. Ṣùgbọ́n nígbà tí kò jìnnà sí ilé náà mọ́, balógun ọgọ́rùn-ún náà rán àwọn ọ̀rẹ́ rẹ̀ lọ sọ fún un pé, “Olúwa[a], má ṣe yọ ara rẹ lẹ́nu, nítorí èmi kò yẹ[b] kí o wọ abẹ́ òrùlé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà ni “Olúwa” (κύριε); ó lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, ó sì tún lè fi hàn pé ó mọ àṣẹ Jésù.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kò tóótun” tàbí “kò péye.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹni kan tó tàbí pé ó yẹ; níbí, ó fi ìrẹ̀lẹ̀ balógun ọgọ́rùn-ún náà níwájú Jésù hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο σὺν αὐτοῖς
  choice: Jésù bá wọn lọ
  rationale: Ó sọ ìrìn Jésù pẹ̀lú wọn ní ọ̀nà Yorùbá tó ṣe déédéé, nígbà tí ó sì pa ìtumọ̀ àìpé ọ̀rọ̀-ìṣe náà mọ́ nínú ìtẹ̀síwájú ìtàn.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: Nígbà tí Jésù sì ti dé ibi tí kò jìnnà sí ilé náà
  rationale: Èyí pa ìtumọ̀ àkókò àti gbólóhùn ‘kò jìnnà sí ilé’ mọ́, láì sọ ọ́ di pé ó ti dé ilé náà.
- source_word: ἔπεμψεν φίλους ὁ ἑκατοντάρχης
  choice: balógun ọ̀rún náà rán àwọn ọ̀rẹ́ rẹ̀
  rationale: ‘Balógun ọ̀rún’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ipò ológun Róòmù náà; fífi ‘rẹ̀’ kún ‘àwọn ọ̀rẹ́’ jẹ́ ohun tí èdè Yorùbá ń béèrè lọ́nà àdánidá nínú àyíká yìí.
- source_word: Κύριε
  choice: Olúwa
  rationale: 'Ó pa àkọlé κύριος àti àìdánilójú rẹ̀ mọ́: ó lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, ó sì tún lè fi ìdánimọ̀ àṣẹ Jésù hàn.'
- source_word: μὴ σκύλλου
  choice: má ṣe yọ ara rẹ lẹ́nu
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè ọlọ́wọ̀ pé kí ẹni náà má ṣe dá ara rẹ̀ láàmú.
- source_word: οὐ γὰρ ἱκανός εἰμι
  choice: nítorí èmi kò yẹ
  rationale: ‘Kò yẹ’ lè sọ ìrẹ̀lẹ̀ àti àìtóye ẹni náà ní àyíká yìí, láì pa ìtumọ̀ ‘kò tóótun’ run.
- source_word: ὑπὸ τὴν στέγην μου εἰσέλθῃς
  choice: kí o wọ abẹ́ òrùlé mi
  rationale: Ó pa àwòrán gíríìkì ti wíwọ abẹ́ òrùlé ẹni mọ́ dípò yíyí i padà sí ‘wọ ilé mi’ lásán.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí balógun ọ̀rún ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa àkọlé náà mọ́, ó sì jẹ́ kí ó lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ tàbí gẹ́gẹ́ bí ìdánimọ̀ àṣẹ Jésù, láì fi ìjẹ́wọ́ ẹ̀kọ́ nípa Kristi tí ọ̀rọ̀ náà kò sọ ní kedere kún un.
- issue: Ìtumọ̀ ἱκανός nínú ìrẹ̀lẹ̀ balógun ọ̀rún
  choice: kò yẹ
  alternative: kò tóótun / kò péye
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń fi ìrẹ̀lẹ̀ hàn, ṣùgbọ́n ó tún lè túmọ̀ sí àìpéye tàbí àìtóótun; àlàyé ìsàlẹ̀ pa ààyè yẹn mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A tún gbé àmì àlàyé [a] sí ‘Olúwa’ àti [b] sí ‘kò yẹ,’ nítorí ibẹ̀ ni àwọn àlàyé wọn ti bá ọ̀rọ̀ inú ẹsẹ̀ mu.
