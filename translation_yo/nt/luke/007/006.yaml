revisions:
- from: Nítorí náà, Jésù bá wọn lọ. Nígbà tí Jésù sì ti dé ibi tí kò jìnnà sí ilé náà, balógun ọ̀rún náà rán àwọn ọ̀rẹ́ rẹ̀ sí Jésù láti sọ fún un pé, “Olúwa[a], má ṣe yọ ara rẹ lẹ́nu, nítorí èmi kò yẹ[b] kí o wọ abẹ́ òrùlé mi.”
  to: Jésù sì bá wọn lọ. Ṣùgbọ́n nígbà tí kò jìnnà sí ilé náà mọ́, balógun ọgọ́rùn-ún náà rán àwọn ọ̀rẹ́ rẹ̀ lọ sọ fún un pé, “Olúwa[a], má ṣe yọ ara rẹ lẹ́nu, nítorí èmi kò yẹ[b] kí o wọ abẹ́ òrùlé mi.”
  rationale: A yí ìṣọ̀kan ìbẹ̀rẹ̀ padà kí ó má fi ìdí-ẹ̀rí kún ọ̀rọ̀ Gíríìkì. A tún gbolohun àkókò náà ṣe kí ó sọ pé Jésù kò jìnnà sí ilé náà, kì í ṣe pé ó ti dé ibi kan. A ṣàtúnṣe orúkọ ipò ológun náà láti “balógun ọ̀rún” sí “balógun ọgọ́rùn-ún,” kí ìtumọ̀ rẹ̀ ba ἑκατοντάρχης mu. A pa àwọn àmì àlàyé mọ́ níbi tí wọ́n ti tọ́ka sí nínú ẹsẹ̀.
