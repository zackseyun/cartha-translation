  to: Nítorí ó ní ìfẹ́ sí orílẹ̀-èdè wa, òun fúnra rẹ̀ sì ni ó kọ́ sínágọ́gù náà fún wa.[a]
  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a rọ́pò ìlò “nífẹ̀ẹ́” pẹ̀lú “ní ìfẹ́ sí” fún Yorùbá àpapọ̀ tó kedere àti tó dáa sí etí. Ìyókù gbólóhùn náà, pẹ̀lú ìtẹnumọ́ “òun fúnra rẹ̀” àti àìdájú tó wà ní “kọ́,” ni a pa mọ́. Àmì akọsilẹ̀ náà wà lẹ́yìn ìṣe ìkọ́, ibi tí ìtumọ̀ àfidípò rẹ̀ ti kan.'
