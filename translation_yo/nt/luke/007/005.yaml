source:
  edition: SBLGNT
  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: yo
  text: Nítorí ó ní ìfẹ́ sí orílẹ̀-èdè wa, òun fúnra rẹ̀ sì ni ó kọ́ sínágọ́gù náà fún wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun fúnra rẹ̀ ló jẹ́ kí wọ́n kọ́ sínágọ́gù náà fún wa.” Ọ̀rọ̀ Gíríìkì kan sọ pé ó “kọ́” ọ́; èyí lè túmọ̀ sí pé ó kópa fúnra rẹ̀ tàbí pé ó jẹ́ alágbátẹrù iṣẹ́ náà, ó sì náwó sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: nífẹ̀ẹ́
  rationale: Ó fi agbára ìyìn náà hàn ní ọ̀nà àdánidá, kò sì sọ ọ́ di ìfẹ́ inú rere lásán.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìbéèrè àwọn alàgbà ní ẹsẹ tó ṣáájú, ó sì fi ìdí tí wọ́n fi bẹ̀bẹ̀ hàn.
- source_word: τὸ ἔθνος ἡμῶν
  choice: orílẹ̀-èdè wa
  rationale: Níhìn-ín, àwọn olùsọ̀rọ̀ ń tọ́ka sí àwọn Júù gẹ́gẹ́ bí àwùjọ ẹ̀yà àti orílẹ̀-èdè wọn.
- source_word: τὴν συναγωγήν
  choice: sínágọ́gù náà
  rationale: Ó pa ìtumọ̀ ilé ìpàdé ìsìn Júù mọ́, àmì ìdámọ̀ náà sì tọ́ka sí sínágọ́gù tí gbogbo wọn mọ̀ ní àdúgbò.
- source_word: αὐτός
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ᾠκοδόμησεν
  choice: kọ́
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìṣe náà ní tààrà; èdè Yorùbá náà jẹ́ kí ó lè túmọ̀ sí pé ó kópa tàbí pé òun ni alágbátẹrù rẹ̀ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó fi hàn pé ó kọ́ ọ fún àǹfààní àwùjọ wọn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá; ọ̀rọ̀ náà jẹ́ kedere, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. “Sínágọ́gù” ni a lò láti pa ìdámọ̀ ilé ìpàdé ìsìn Júù mọ́.
