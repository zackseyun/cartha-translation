  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: γάρ jẹ́ ìdí, τὸ ἔθνος ἡμῶν jẹ́ “orílẹ̀-èdè wa,” αὐτός gba ìtẹnumọ́, àti ᾠκοδόμησεν wà ní ìṣe ìgbẹ́yìn tó ṣí sílẹ̀ fún ìtumọ̀ ìkópa tàbí ìfọwọ́sí alágbátẹrù. Síbẹ̀, a tún ọ̀rọ̀ ìfẹ́ ṣe kí ìbáṣepọ̀ náà jẹ́ kedere, àdánidá, kí ó sì pa agbára ἀγαπᾷ mọ́.'
