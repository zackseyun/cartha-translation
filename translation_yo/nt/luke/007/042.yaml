  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: yo
  text: Níwọ̀n bí wọn kò ti ní ohun tí wọ́n lè fi san án padà, ó dárí ji àwọn méjèèjì lọ́fẹ̀ẹ́.[a] Nítorí náà, ta ni nínú wọn yóò nífẹ̀ẹ́ rẹ̀ jù?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó fagilé gbèsè àwọn méjèèjì.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífúnni lọ́fẹ̀ẹ́ tàbí jíjẹ́ kí ohun tí a jẹ ní gbèsè lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Nígbà tí wọn kò sì ní ohun tí wọn ì bá fi san án padà
  rationale: 'Gbólóhùn yìí fi ipò tí àwọn ajigbèsè wà hàn: wọn kò ní ohun tàbí agbára láti san gbèsè náà padà. ‘Nígbà tí’ bá ẹ̀ka genitive absolute mu láì sọ ìdí pàtó ju ohun tí Gíríìkì sọ lọ.'
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: ó fi tọ̀fẹ́tọ̀fẹ́ dárí ji àwọn méjèèjì
  rationale: ‘Dárí ji’ lè ṣiṣẹ́ fún jíjẹ́ kí gbèsè lọ, ó sì tún pa ìbáṣepọ̀ rẹ̀ mọ́ ìdáríjì nínú àyíká ìtàn náà. ‘Fi tọ̀fẹ́tọ̀fẹ́’ mú èrò fífúnni lọ́fẹ̀ẹ́ àti ojúrere inú χαρίζομαι jáde.
- source_word: τίς οὖν αὐτῶν
  choice: Nítorí náà, ta ni nínú wọn
  rationale: ‘Nítorí náà’ ṣì mú ìtumọ̀ ìparí tàbí àbájáde οὖν wá ní Yorùbá adayeba.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: yóò nífẹ̀ẹ́ rẹ̀ jù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìfẹ́ tí ó pọ̀ ju ti ẹlòmíràn lọ, ó sì pa ìtumọ̀ ọjọ́ iwájú ἀγαπήσει mọ́.
theological_decisions:
- issue: Ìtumọ̀ χαρίζομαι nínú àkàwé gbèsè àti ìdáríjì
  choice: ó fi tọ̀fẹ́tọ̀fẹ́ dárí ji àwọn méjèèjì
  alternative: ó pa gbèsè àwọn méjèèjì rẹ́
  rationale: Àṣàyàn àkọ́kọ́ pa ìtumọ̀ fífi gbèsè jì àti ojúrere mọ́, ó sì bá àkòrí ìdáríjì àti ìfẹ́ nínú àyíká Lúùkù mu láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Tọ̀fẹ́tọ̀fẹ́’ sọ ojúrere àti fífúnni lọ́fẹ̀ẹ́ ní ọ̀nà tí òǹkàwé lasán lè lóye; àlàyé ìtumọ̀ gbèsè tó ṣe pàtó wà nínú àlàyé ìsàlẹ̀.
