- from: Nígbà tí wọn kò sì ní ohun tí wọn ì bá fi san án padà, ó fi tọ̀fẹ́tọ̀fẹ́ dárí ji àwọn méjèèjì.[a] Nítorí náà, ta ni nínú wọn yóò nífẹ̀ẹ́ rẹ̀ jù?
