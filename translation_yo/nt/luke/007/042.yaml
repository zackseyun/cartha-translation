    reason: lexical_alternative
  revision_rationale: The revision retains the source’s explanatory genitive absolute, its debt context, the free/gracious sense of χαρίζομαι, and the future comparative question. It corrects Yoruba grammar and improves idiomatic flow without adding theological interpretation.
