id: LUK.7.43
reference: Luke 7:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: yo
  text: Símónì dáhùn pé,[a] “Mo rò pé ẹni tí a dárí gbèsè tó pọ̀ jù lọ jì.” Ó sì wí fún un pé, “Ìdájọ́ rẹ tọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo lérò pé” tàbí “Bí mo ṣe rò ni pé”; ọ̀rọ̀ Gíríìkì náà fi ìrònú tí kò ní ìdánilójú pípé hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: dáhùn pé
  rationale: Àkójọpọ̀ participle àti ọ̀rọ̀-ìṣe yìí jẹ́ ọ̀nà Gíríìkì láti fi ìdáhùn hàn; ‘dáhùn pé’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ mọ́.
- source_word: Ὑπολαμβάνω
  choice: Mo rò pé
  rationale: Ó fi ìpinnu oníyèméjì tàbí àfojúsùn tí kò lágbára hàn, kì í ṣe ìdánilójú pípé.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: ẹni tí ó dárí gbèsè púpọ̀ jù fún
  rationale: Nínú àkàwé àwọn ajigbèsè, χαρίζομαι túmọ̀ sí fífi oore dá gbèsè jì; fífi ‘gbèsè’ hàn mú àwòrán ọ̀rọ̀ náà ṣe kedere, ‘púpọ̀ jù’ sì tọ́ka sí ìfiwéra àwọn méjèèjì.
- source_word: Ὀρθῶς ἔκρινας
  choice: Ìdájọ́ rẹ tọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìdájọ́ tàbí àyẹ̀wò tí ó péye mọ́.
theological_decisions:
- issue: Ìtumọ̀ èdè ìdáríjì nínú àkàwé náà
  choice: dárí gbèsè ... fún
  alternative: fi oore dá a sílẹ̀; fagilé gbèsè rẹ̀
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ jẹ́ ti gbèsè tí ayánilówó dá jì. Yíyan ‘dárí gbèsè’ pa àwòrán gbèsè àti ìsopọ̀ rẹ̀ mọ́ ìdáríjì ẹ̀ṣẹ̀ nínú àyíká gbooro mọ́, láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. ‘Ìdájọ́ rẹ tọ́’ jẹ́ ọ̀nà àdánidá láti sọ ìfọwọ́sí ìdáhùn Símónì; àmì ẹsẹ̀ [a] wà lẹ́yìn gbólóhùn ìfihàn ìdáhùn.
