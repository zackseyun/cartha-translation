source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: yo
  text: Nítorí náà, èmi kò tilẹ̀ ka ara mi sí ẹni tí ó yẹ láti wá sọ́dọ̀ rẹ. Ṣùgbọ́n sọ ọ̀rọ̀ kan, kí ìránṣẹ́ mi sì sàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọkùnrin mi” tàbí “ọmọ mi”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọmọ, ọmọkùnrin, tàbí ìránṣẹ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tó ṣáájú hàn, ó sì pa ìsopọ̀ ọgbọ́n inú gbólóhùn náà mọ́ ní Yorùbá àdánidá.
- source_word: οὐδὲ
  choice: kò tilẹ̀
  rationale: 'Ó mú ìkọ̀sílẹ̀ náà lágbára: ọ̀gágun náà kò tilẹ̀ ka ara rẹ̀ sí ẹni tó yẹ.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: ka ara mi sí ẹni tí ó yẹ
  rationale: Ó túmọ̀ ìṣe ἀξιόω gẹ́gẹ́ bí kí ẹnìkan ka ara rẹ̀ sí ẹni tó yẹ, ó sì pa ìtumọ̀ arọ́pò-orúkọ afarabale mọ́.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: láti tọ̀ ọ́ wá
  rationale: Ọ̀nà Yorùbá àdánidá ni fún wíwá sí ọ̀dọ̀ ẹni kan tàbí sún mọ́ ọn.
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó ṣàfihàn ìyàtọ̀ láàárín àìníyì ara rẹ̀ àti ẹ̀bẹ̀ tó tẹ̀ lé e.
- source_word: εἰπὲ λόγῳ
  choice: sọ ọ̀rọ̀ kan
  rationale: Dative λόγῳ jẹ́ ọ̀nà Gíríìkì fún pípa ọ̀rọ̀ jáde; “ọ̀rọ̀ kan” pa àìsí article mọ́, ó sì fi ìgbẹ́kẹ̀lé nínú àṣẹ ọ̀rọ̀ Jesu hàn láìfi “àṣẹ” kún un ní tààrà.
- source_word: ἰαθήτω
  choice: kí a sì wo ... sàn
  rationale: Ó pa ipa àṣẹ ẹni-kẹta ti aorist passive imperative mọ́; “kí a wo ... sàn” jẹ́ Yorùbá àdánidá fún ìbéèrè pé kí ìwòsàn ṣẹlẹ̀ sí ẹni náà.
- source_word: ὁ παῖς μου
  choice: ìránṣẹ́ mi
  rationale: παῖς lè túmọ̀ sí ọmọ, ọmọdékùnrin, tàbí ìránṣẹ́. Nínú àyíká ọ̀gágun àti ẹni tó wà lábẹ́ àṣẹ rẹ̀, “ìránṣẹ́” bá ìtàn mu jù, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ παῖς nínú ìtàn ọ̀gágun
  choice: ìránṣẹ́ mi
  alternative: ọmọdékùnrin mi; ọmọ mi
  rationale: Àyíká ìtàn fi ẹni tó wà lábẹ́ àṣẹ ọ̀gágun hàn, nítorí náà “ìránṣẹ́” ni yíyan tó ṣe kedere jù. Síbẹ̀, ọrọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò, torí náà a pa àwọn ìtumọ̀ míì mọ́ nínú àlàyé ìsàlẹ̀ láìyanjú ìbáṣepọ̀ náà ju ẹ̀rí lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò. “Tọ̀ ọ́ wá” jẹ́ ọ̀nà àdánidá fún pípa ìtọ́sọ́nà πρὸς σὲ mọ́; “kí a wo ... sàn” sì pa fọ́ọ̀mù àṣẹ passive mọ́ dípò yíyí i sí àsọtẹ́lẹ̀ ọjọ́ iwájú.
