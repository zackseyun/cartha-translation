  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: yo
  text: Ó ránṣẹ́ sí Olúwa pé, “Ṣé ìwọ ni Ẹni Tí Ń Bọ̀[a], tàbí kí a retí ẹlòmíràn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ń bọ̀.” Gbólóhùn Gíríìkì náà lè jẹ́ àpèjúwe lásán, ṣùgbọ́n ó ṣeé ṣe kó jẹ́ oyè Mèsáyà níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν πρὸς τὸν κύριον
  choice: Ó ránṣẹ́ sí Olúwa
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó ṣẹlẹ̀ nígbà àtijọ́ àti ibi tí ìránṣẹ́ náà lọ hàn. ‘Ránṣẹ́ sí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó rán ẹni tàbí ọ̀rọ̀ sí ẹnì kan, nígbà tí ‘Olúwa’ pa ìwọ̀n àti ìtumọ̀ κύριος mọ́.
- source_word: λέγων
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni tí a rán sọ; ó mú ìsopọ̀ participle Gíríìkì náà jáde láì jẹ́ kí gbólóhùn le.
- source_word: Σὺ εἶ ὁ ἐρχόμενος
  choice: Ṣé ìwọ ni Ẹni Tí Ń Bọ̀
  rationale: ‘Ṣé ìwọ ni’ jẹ́ ìbéèrè Yorùbá tó ṣe déédéé. ‘Ẹni Tí Ń Bọ̀’ pa àwòrán participle ὁ ἐρχόμενος mọ́, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Mèsáyà nínú àyíká yìí.
- source_word: ἢ ἄλλον προσδοκῶμεν
  choice: tàbí kí a máa retí ẹlòmíràn
  rationale: ‘Tàbí’ mú àṣàyàn kejì wọlé; ‘kí a máa retí’ fi ìbéèrè ìmọ̀ràn àti ìfojúsọ́nà tí ń tẹ̀ síwájú hàn, ‘ẹlòmíràn’ sì bá ἄλλον mu.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè Jésù
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος ní àyíká Lúùkù, ó sì pa ìwọ̀n ẹ̀sìn àti ọlá oyè náà mọ́ ju ‘ọ̀gá’ lọ.
- issue: Bóyá ὁ ἐρχόμενος jẹ́ oyè Mèsáyà tàbí àpèjúwe lásán
  choice: Ẹni Tí Ń Bọ̀
  alternative: ẹni tí ó ń bọ̀
  rationale: Lílò lẹ́tà ńlá fi hàn pé gbólóhùn náà lè jẹ́ oyè ẹni tí a ń retí, ṣùgbọ́n ọ̀rọ̀ náà ṣì pa ìtumọ̀ àpèjúwe Gíríìkì mọ́, láì fi ‘Mèsáyà’ kún un ní tààrà.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ní ọlá ni a lò. ‘Ṣé’ àti ‘kí a máa retí’ jẹ́ ọ̀rọ̀ àdánidá fún òǹkàwé Yorùbá, nígbà tí ‘Ẹni Tí Ń Bọ̀’ pa agbára oyè àti àìdánilójú ọ̀rọ̀ ìpilẹ̀ mọ́.
