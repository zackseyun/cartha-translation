source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Farisí àti àwọn amòfin kọ ète Ọlọ́run fún ara wọn sílẹ̀[a], láì gba ìbatisí lọ́wọ́ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ète Ọlọ́run nípa ara wọn,” tàbí “ìmọ̀ràn Ọlọ́run lòdì sí ara wọn.”
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni Johanu Oníbatisí.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: àwọn amòfin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ó mọ Òfin Mósè jinlẹ̀. “Àwọn amòfin” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì dá wọn pọ̀ mọ́ àwọn akọ̀wé.
- source_word: βουλὴν
  choice: ète
  rationale: “Ète” lè sọ ìpinnu tàbí èrò tí Ọlọ́run ní, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá láì fi dandan túmọ̀ rẹ̀ sí ìmọ̀ràn lásán.
- source_word: ἠθέτησαν
  choice: kọ ... sílẹ̀
  rationale: Ó fi ìkọ̀ tàbí àìgba ète Ọlọ́run hàn ní ọ̀nà tó ṣe kedere, ó sì bá ἀθετέω mu.
- source_word: εἰς ἑαυτούς
  choice: fún ara wọn
  rationale: Ó pa ìtumọ̀ pé ète Ọlọ́run kan àwọn fúnra wọn mọ́, láì pinnu ìtumọ̀ náà sí “lòdì sí ara wọn.”
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: níwọ̀n bí wọn kò ti gba ìbatisí lọ́wọ́ rẹ̀
  rationale: Ó sọ ipò tí participle Gíríìkì fi hàn ní Yorùbá àdánidá. “Níwọ̀n bí” lè tọ́ka sí ìdí tàbí ipò tó bá ìṣe náà rìn láì mú ìsopọ̀ náà le jù.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ inú Gíríìkì mọ́; àlàyé ẹsẹ̀ ni ó sọ pé Johanu Oníbatisí ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí ẹsẹ̀ tó ṣáájú sọ hàn.
theological_decisions:
- issue: Ìtumọ̀ βουλή Ọlọ́run nípa àwọn Farisí àti àwọn amòfin
  choice: ète Ọlọ́run fún ara wọn
  alternative: ète Ọlọ́run nípa ara wọn; ìmọ̀ràn Ọlọ́run lòdì sí ara wọn
  rationale: 'Èyí pa ìdààmú ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́: wọ́n kọ ohun tí Ọlọ́run pinnu nípa wọn sílẹ̀, ṣùgbọ́n a kò fi ọ̀rọ̀ tí ó ju ti Gíríìkì lọ yanju bí èyí ṣe kan ìfẹ́ Ọlọ́run tó ga jù.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. “Ìbatisí” ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀; “gba ìbatisí lọ́wọ́” jẹ́ àdánidá ju passive gígùn lọ.
