  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: yo
  text: Síbẹ̀, gbogbo àwọn ọmọ rẹ̀ fi hàn pé ọgbọ́n tọ́.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a dá ọgbọ́n láre,” tàbí “a fi hàn pé ọgbọ́n tọ́.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ọmọ” jẹ́ àkàwé fún àwọn tí ìfẹ̀hùn wọn tàbí ọ̀nà ìgbésí ayé wọn fi òtítọ́ ọgbọ́n hàn.
    reason: lexical_alternative
  - marker: c
    text: Mátíù 11:19 ní, “a fi hàn pé ọgbọ́n tọ́ nípasẹ̀ àwọn iṣẹ́ rẹ̀.”
    reason: cross_reference
lexical_decisions:
- source_word: ἐδικαιώθη
  choice: fi hàn pé ... jẹ́ òdodo
  rationale: Ọ̀rọ̀ náà níbí túmọ̀ sí pé a fi ohun kan hàn tàbí a jẹ́rìí sí i pé ó tọ́; kì í ṣe ìdáláre ní ìtumọ̀ pàtó ti Pọ́ọ̀lù. Ìṣọ̀rọ̀ Yorùbá yìí pa ìtumọ̀ ìmúdájú ní gbangba mọ́.
- source_word: σοφία
  choice: ọgbọ́n
  rationale: Èyí ni ìtumọ̀ tààrà fún σοφία, ó sì jẹ́ kí àkàwé tí ó sọ ọgbọ́n di ẹni dúró.
- source_word: ἀπὸ πάντων
  choice: gbogbo ... ni ó fi hàn
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe aláìṣe yìí, ἀπό lè tọ́ka sí àwọn tí ó jẹ́ ẹ̀rí tàbí ohun tí ìmúdájú ti ọ̀dọ̀ wọn wá. A yí gbólóhùn náà sí ìṣọ̀rọ̀ Yorùbá tó ṣe kedere láì pàdánù ipa wọn gẹ́gẹ́ bí ẹlẹ́rìí.
- source_word: τέκνων
  choice: àwọn ọmọ
  rationale: A pa ìtumọ̀ tààrà àti àkàwé ‘ọmọ’ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ‘iṣẹ́’ tàbí ‘àbájáde’ nínú ọ̀rọ̀ pàtàkì.
- source_word: αὐτῆς
  choice: ọmọ ọgbọ́n
  rationale: Yorùbá kò lo arọ́pò-orúkọ akọ tàbí abo fún ohun aláìlẹ́mìí bí Gẹ̀ẹ́sì. Àpapọ̀-orúkọ ‘ọmọ ọgbọ́n’ pa ìbáṣepọ̀ náà àti àkàwé ìbí mọ́.
- source_word: καὶ
  choice: Síbẹ̀
  rationale: Nínú àyíká ọ̀rọ̀, καί ní agbára ìyàtọ̀ díẹ̀ lẹ́yìn àríwísí ìran náà; ‘Síbẹ̀’ mú ìyàtọ̀ yìí jáde láì fi ohun tí kò sí kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn ọmọ’ ọgbọ́n
  choice: A pa á mọ́ gẹ́gẹ́ bí àkàwé fún àwọn tí ìdáhùn tàbí ìgbésí ayé wọn fi òtítọ́ ọgbọ́n hàn.
  alternative: Ó lè tọ́ka sí àbájáde tàbí èso ọgbọ́n; Mátíù 11:19 sì ní ‘àwọn iṣẹ́ rẹ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì Lúùkù ni τέκνων (‘àwọn ọmọ’), nítorí náà a kò rọ́pò àwòrán náà pẹ̀lú ìtumọ̀ kan ṣoṣo tàbí fi í bá Mátíù mu. Èyí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ìṣọ̀rọ̀ alágbára ‘ni ó fi hàn’ láti mú gbolohun aláìṣe Gíríìkì náà jẹ́ ti ẹ̀dá Yorùbá, nígbà tí àlàyé ẹsẹ̀ ṣàfihàn àwọn ọ̀nà ìtumọ̀ mìíràn.
