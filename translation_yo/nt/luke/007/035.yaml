  to: Síbẹ̀, gbogbo àwọn ọmọ rẹ̀ fi hàn pé ọgbọ́n tọ́.[a][b][c]
  rationale: Àtúnṣe náà rọ́pò “jẹ́ òdodo” pẹ̀lú “tọ́” kí ìtumọ̀ ἐδικαιώθη—pé a fi ọgbọ́n hàn tàbí fìdí rẹ̀ múlẹ̀ pé ó tọ́—le hàn kedere. Ó pa “gbogbo,” “àwọn ọmọ,” àti ìsọni ẹni ti ọgbọ́n mọ́, láì pinnu pé “àwọn ọmọ” túmọ̀ sí iṣẹ́ tàbí àbájáde nínú ọ̀rọ̀ pàtàkì. A tún ṣàtúnṣe àlàyé Mátíù kí ó jẹ́ ìsọ̀rọ̀ Yorùbá tó dára, tó sì bá àfọwọ́kà Gíríìkì mu.
