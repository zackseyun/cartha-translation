language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: yo
  text: Ìwọ kò fi ẹnu kò mí[a], ṣùgbọ́n obìnrin yìí kò tíì dáwọ́ fífi ẹnu kò ẹsẹ̀ mi[b] láti ìgbà tí mo wọlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ kò fi ẹnu kí mi”; fífi ẹnu kò ẹni jẹ́ àṣà ìkíni àti ọ̀nà ìgbàlejò.
    reason: cultural_note
  - marker: b
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi fífi ẹnu kò ẹni pẹ̀lú ìfẹ́ tàbí léraléra hàn: “kò tíì dáwọ́ fífi ẹnu kò ẹsẹ̀ mi léraléra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: fi ẹnu kò
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹnu kò ẹnì kan; gbólóhùn Yorùbá yìí jẹ́ èyí tó ṣe déédé, tó sì bá àṣà ìkíni inú àyíká náà mu láìfi àlàyé kún ọ̀rọ̀ pàtàkì.
- source_word: μοι
  choice: mí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ẹni tí a fẹnu kò; ‘mí’ ni ìsọ̀rọ̀ Yorùbá tó bá àyíká yìí mu.
- source_word: ἔδωκας
  choice: fi ẹnu kò
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘fún,’ ìṣọ̀kan φίλημα δίδωμι jẹ́ ọ̀nà Gíríìkì fún fífi ẹnu kò; Yorùbá kò ní sọ ọ́ lọ́nà àdàkọ pé ‘fún mi ní ìfẹnu-koni.’
- source_word: αὕτη δὲ
  choice: ṣùgbọ́n ... obìnrin yìí
  rationale: Ó mú ìyàtọ̀ tó wà láàárín ohun tí Símónì kò ṣe àti ohun tí obìnrin náà ṣe hàn kedere, ó sì pa agbára atọ́ka αὕτη mọ́.
- source_word: ἀφ’ ἧς
  choice: láti ìgbà tí
  rationale: Ó fi ìbẹ̀rẹ̀ àkókò ìṣe náà hàn ní kedere, gẹ́gẹ́ bí gbólóhùn Gíríìkì.
- source_word: εἰσῆλθον
  choice: mo ti wọlé
  rationale: ‘Wọlé’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún wíwọ inú ilé ní àyíká àlejò yìí.
- source_word: οὐ διέλιπεν
  choice: kò dáwọ́ ... dúró
  rationale: Ó sọ ìṣe tí kò sinmi láti ìgbà tí Jésù wọlé títí di àkókò ọ̀rọ̀ náà; àkójọpọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: καταφιλοῦσά
  choice: fífi ẹnu kò
  rationale: Ìtumọ̀ pàtàkì ni fífi ẹnu kò; agbára ìfẹ́ tàbí àtúnṣe tó lè wà nínú ọ̀rọ̀ Gíríìkì ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: μου τοὺς πόδας
  choice: ẹsẹ̀ mi
  rationale: Ní Yorùbá, ‘ẹsẹ̀ mi’ lè tọ́ka sí ẹsẹ̀ méjèèjì lọ́nà àdánidá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀pọ̀.
theological_decisions:
- issue: Àṣà fífi ẹnu kòni gẹ́gẹ́ bí ìkíni àti ìgbàlejò
  choice: Fi ìṣe náà hàn ní ṣókí nínú ọ̀rọ̀ pàtàkì, kí a sì ṣàlàyé àṣà náà ní àlàyé ìsàlẹ̀.
  alternative: Ìwọ kò fi ẹnu kí mi gẹ́gẹ́ bí àṣà.
  rationale: Gíríìkì sọ ìṣe náà ní tààrà, kò sì ṣàlàyé àṣà náà. Ìtumọ̀ yìí pa ìyàtọ̀ láàárín àìṣe Símónì àti ìfọkànsìn obìnrin náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘wọlé’ àti ‘dáwọ́ ... dúró’ fún ìsọ̀rọ̀ àdánidá; a kò fi àlàyé àṣà sínú ọ̀rọ̀ pàtàkì.
