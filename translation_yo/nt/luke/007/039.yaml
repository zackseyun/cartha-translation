reference: Luke 7:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: yo
  text: Nígbà tí Farisí tí ó pè é wá jẹun rí èyí, ó wí nínú ọkàn rẹ̀ pé, “Ìbá ṣe pé wòlíì ni ọkùnrin yìí, ìbá mọ ẹni tí obìnrin tí ń fọwọ́ kàn án yìí jẹ́ àti irú obìnrin wo ni ó jẹ́[a], nítorí pé ẹlẹ́ṣẹ̀ ni obìnrin náà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí obìnrin yìí jẹ́ àti irú obìnrin tí ó jẹ́.” Èdè Gíríìkì tẹnu mọ́ ìdánimọ̀ rẹ̀ àti irú ìwà tàbí orúkọ tí ó ní láwùjọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pé ẹlẹ́ṣẹ̀ ni obìnrin náà.” A lè lóye gbólóhùn Gíríìkì yìí gẹ́gẹ́ bí ohun tí ó yẹ kí ó mọ̀, tàbí gẹ́gẹ́ bí ìdí tí Farisí fi ṣe ìdájọ́ irú ẹni tí obìnrin náà jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nígbà tí ... rí èyí
  rationale: Aorist participle náà ṣàfihàn ipò àkókò tó ṣáájú ọ̀rọ̀ pàtàkì; “rí èyí” tọ́ka sí ohun tí obìnrin náà ṣẹ̀ṣẹ̀ ṣe ní àyíká ọ̀rọ̀.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: Farisí tí ó pè é wá jẹun
  rationale: Nínú àyíká àsè, καλέω túmọ̀ sí pípe ènìyàn wá sí oúnjẹ, kì í ṣe pípe lásán.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: ó sọ nínú ara rẹ̀ pé
  rationale: Èyí jẹ́ ọ̀rọ̀ inú ọkàn; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì yẹra fún ṣíṣe àtúnṣe “sọ ... wí pé” méjì.
- source_word: Οὗτος
  choice: ọkùnrin yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ní ìfarahàn jíjìnnà tàbí àìgbọ́wọ́ díẹ̀; “ọkùnrin yìí” mú un hàn lọ́nà àdánidá.
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: Ìbá ṣe pé wòlíì ni ... ìbá mọ
  rationale: Àkópọ̀ εἰ pẹ̀lú àkókò àìpé àti ἄν fi ipò tí olùsọ̀rọ̀ kò gbà pé ó jẹ́ òótọ́ hàn; ìṣètò “ìbá ... ìbá ...” pa agbára yẹn mọ́.
- source_word: τίς καὶ ποταπὴ
  choice: ẹni tí ... jẹ́ àti irú ẹni tí ó jẹ́
  rationale: Ó pa ìbéèrè méjèèjì mọ́—ìdánimọ̀ obìnrin náà àti ìwà tàbí orúkọ rẹ̀ láwùjọ.
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: obìnrin tí ń fọwọ́ kàn án yìí
  rationale: Ìsinsìnyí ἅπτεται fi ìṣe tó ń lọ lọ́wọ́ hàn; “ń fọwọ́ kàn án” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìfọwọ́kàn.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: nítorí pé ẹlẹ́ṣẹ̀ ni obìnrin náà
  rationale: ὅτι lè ṣàfihàn ìdí tàbí àkóónú ohun tí ó yẹ kí ó mọ̀; ọ̀rọ̀ inú ẹsẹ yìí lo ìtumọ̀ ìdí, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
theological_decisions:
- issue: Agbára gbólóhùn àdéhùn nípa jíjẹ́ wòlíì
  choice: “Ìbá ṣe pé wòlíì ni ọkùnrin yìí, ìbá mọ ...”
  alternative: “Bí ọkùnrin yìí bá jẹ́ wòlíì, yóò mọ ...”
  rationale: Èdè Gíríìkì fi iyèméjì Farisí àti ohun tí kò gbà gbọ́ hàn. Ìtumọ̀ náà pa ìforígbárí ìtàn mọ́ láìjẹ́rìí sí ìdájọ́ Farisí.
- issue: Ìbáṣepọ̀ ὅτι ἁμαρτωλός ἐστιν
  choice: 'Gẹ́gẹ́ bí ìdí: “nítorí pé ẹlẹ́ṣẹ̀ ni obìnrin náà”'
  alternative: 'Gẹ́gẹ́ bí àkóónú ìmọ̀: “pé ẹlẹ́ṣẹ̀ ni obìnrin náà”'
  rationale: Ìtumọ̀ méjèèjì ṣeé gbọ́ nínú Gíríìkì. Ọ̀rọ̀ pàtàkì yan ìtumọ̀ ìdí tó bá ìṣàn ọ̀rọ̀ mu, àlàyé [b] sì jẹ́ kí àìdánilójú gidi náà wà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ ti ẹ̀dá. “Pè é wá jẹun” mú àyíká àsè hàn; “sọ nínú ara rẹ̀” sì ṣàfihàn ọ̀rọ̀ inú ọkàn. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
