translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Fi taratara bẹ̀ ẹ́’ jẹ́ àdánidá fún ẹ̀bẹ̀ ọlọ́wọ̀ tí ó ní ìtara; ìtumọ̀ àkọ́kọ́ pa èrò ‘fún/jíǹkí’ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi àṣàyàn gbòòrò ‘ṣe èyí fún un’ hàn.
