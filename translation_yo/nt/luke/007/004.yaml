  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: yo
  text: Nígbà tí wọ́n dé ọ̀dọ̀ Jésù, wọ́n fi ìtara bẹ̀ ẹ́ pé, “Ó yẹ kí o ṣe èyí fún un.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: dé ọ̀dọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwá tàbí dídé sí ibi kan; ‘dé ọ̀dọ̀ Jésù’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n wá sí iwájú rẹ̀.
- source_word: παρεκάλουν
  choice: bẹ̀ ẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ ìbéèrè pẹ̀lú ọ̀wọ̀ àti ìtara. ‘Bẹ̀ ẹ́’ ṣe àfihàn ẹ̀bẹ̀ náà láì mú un le ju bí orísun ṣe sọ lọ.
- source_word: σπουδαίως
  choice: fi taratara
  rationale: Ó ń fi ìtara àti bí ọ̀rọ̀ náà ṣe ṣe pàtàkì sí wọn hàn; ‘fi taratara’ jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó sì bá ìṣe bíbẹ̀ mu.
- source_word: Ἄξιός
  choice: Ó yẹ ní ẹni
  rationale: Èyí pa èrò pé ọkùnrin náà yẹ tàbí tọ́ sí ojúrere náà mọ́, dípò kí a túmọ̀ ọ́ gẹ́gẹ́ bí ìwà rere pàtó tí orísun kò sọ.
- source_word: ᾧ
  choice: ẹni tí ... fún
  rationale: Ọ̀rọ̀ arọ́pò orúkọ dative náà ń tọ́ka sí balógun ọ̀rún; ìṣètò ‘ẹni tí ... fún’ mú ìbáṣepọ̀ náà hàn ní Yorùbá.
- source_word: παρέξῃ
  choice: yóò fi ... jíǹkí
  rationale: παρέχω lè túmọ̀ sí pípèsè, fífún, tàbí jíjíǹkí. ‘Fi èyí jíǹkí rẹ̀’ pa ohùn ìbéèrè ọlọ́wọ̀ mọ́, ó sì yàtọ̀ díẹ̀ sí àṣàyàn gbòòrò ‘ṣe èyí fún un.’
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ ìtọ́ka náà ń tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ béèrè; ‘èyí’ jẹ́ ìtumọ̀ tààrà láì fi àlàyé tí kò sí nínú orísun kún un.
