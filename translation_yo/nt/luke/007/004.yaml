  to: Nígbà tí wọ́n dé ọ̀dọ̀ Jésù, wọ́n fi ìtara bẹ̀ ẹ́ pé, “Ó yẹ kí o ṣe èyí fún un.”
  rationale: 'A tún gbolohun ìsọ̀rọ̀ ẹni tí wọ́n ń bẹ̀ fún ṣe pátápátá nítorí pé ọ̀rọ̀ àkọ́kọ́ kò tọ́ ní gírámà Yorùbá, ó sì lo ọ̀rọ̀ kan tí kò ṣàfihàn ìṣe παρέχω ní àyíká náà. “Ó yẹ kí o ṣe èyí fún un” pa ìwífún àwọn àgbààgbà náà mọ́: ẹni náà yẹ fún ohun tí Jésù máa ṣe fún un. A tún yí “fi taratara” sí “fi ìtara” fún ìlò Yorùbá tó rọrùn sí i, a sì pa àmì àlàyé ìsàlẹ̀ ojú ewé mọ́ gẹ́gẹ́ bí àṣàyàn ìtumọ̀.'
