  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: yo
  text: '“Àwọn ènìyàn méjì jẹ olùyá owó kan ní gbèsè: ọ̀kan jẹ ẹ̀ẹ́dẹ́gbẹ̀ta dínárì[a], èkejì sì jẹ àádọ́ta dínárì.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dínárì jẹ́ ẹyọ owó fàdákà ti ilẹ̀ Róòmù; iye rẹ̀ sábà máa ń bá owó iṣẹ́ ọjọ́ kan fún òṣìṣẹ́ mu.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: àwọn ajígbèsè
  rationale: Ó túmọ̀ sí àwọn ẹni tí wọ́n jẹ gbèsè; ‘àwọn ajígbèsè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì bá àyíká òwe náà mu.
- source_word: δανιστῇ τινι
  choice: ẹni kan tí ń yáni lówó ní gbèsè
  rationale: δανιστής tọ́ka sí ẹni tí ń yá àwọn ẹlòmíràn lówó, τινι sì fi hàn pé ẹni kan pàtó ni, bí ó tilẹ̀ jẹ́ pé a kò dárúkọ rẹ̀.
- source_word: ὤφειλεν
  choice: jẹ
  rationale: Nínú Yorùbá, ‘jẹ gbèsè’ ni ọ̀nà àdánidá láti sọ pé ẹnì kan ní gbèsè tí kò tíì san; ó mú ipò gbèsè inú ọ̀rọ̀ Gíríìkì jáde.
- source_word: δηνάρια
  choice: owó dínárì
  rationale: A pa orúkọ ẹyọ owó ìgbà Róòmù mọ́ dípò yíyí i padà sí iye owó òde òní; àlàyé rẹ̀ wà ní àkọsílẹ̀ ìsàlẹ̀.
- source_word: πεντακόσια
  choice: ẹ̀ẹ́dẹ́gbẹ̀ta
  rationale: Èyí ni iye ẹ̀ẹ́dẹ́gbẹ̀ta ní Yorùbá.
- source_word: ἕτερος
  choice: èkejì
  rationale: Ó ṣe àfikún sí ‘ọ̀kan’ ní ọ̀nà tó ṣe kedere, ó sì dúró fún ẹni kejì nínú àwọn méjèèjì.
- source_word: πεντήκοντα
  choice: àádọ́ta
  rationale: Èyí ni iye àádọ́ta ní Yorùbá; ‘owó dínárì’ tí a mẹ́nu kàn ṣáájú ni a lóye pé ó tún ń ṣàlàyé iye yìí.
