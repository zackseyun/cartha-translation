translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A pa àwòrán gbèsè àti ẹyọ owó ìtàn náà mọ́, a sì fi àmì ohùn sí ibi tó yẹ.
