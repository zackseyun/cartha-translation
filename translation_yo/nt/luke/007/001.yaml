  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: yo
  text: Nígbà tí ó ti parí gbogbo ọ̀rọ̀ rẹ̀ ní ìgbọ́ àwọn ènìyàn, ó wọ Kápánáúmù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Nígbà tí
  rationale: Ọ̀rọ̀ náà ń ṣàfihàn àsìkò nínú ìtẹ̀síwájú ìtàn, kì í ṣe okùnfà; “Nígbà tí” jẹ́ Yorùbá àdánidá.
- source_word: ἐπλήρωσεν
  choice: ti parí
  rationale: Pẹ̀lú ῥήματα, ó túmọ̀ sí pé ó parí sísọ; àmì “ti” fi hàn pé ìṣe yìí ti ṣẹlẹ̀ ṣáájú wíwọ̀ Kápánáúmù.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: gbogbo ọ̀rọ̀ rẹ̀
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì tọ́ka sí gbogbo ohun tí Jesu sọ láìfi “wọ̀nyí” kún un.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: ní etígbọ́ àwọn ènìyàn
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ mọ́ pé àwọn ènìyàn gbọ́ ọ̀rọ̀ náà, bí ó tilẹ̀ jẹ́ pé Yorùbá àdánidá lè sọ pé “fún àwọn ènìyàn láti gbọ́.”
- source_word: λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó gbé agbára àkójọpọ̀ λαός jáde láìsọ ọ́ di “ọ̀pọ̀ ènìyàn” tàbí “àwùjọ” ní pàtó.
- source_word: εἰσῆλθεν
  choice: ó wọ
  rationale: “Ó wọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìwọlé sínú ìlú mu.
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: Àkọsílẹ̀ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró rẹ̀, pẹ̀lú àmì ohùn Yorùbá.
