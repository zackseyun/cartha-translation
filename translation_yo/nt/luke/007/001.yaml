revisions:
- from: Nígbà tí ó sì ti parí gbogbo ọ̀rọ̀ rẹ̀ ní etígbọ́ àwọn ènìyàn[a], ó wọ Kápánáúmù.
  to: Nígbà tí ó ti parí gbogbo ọ̀rọ̀ rẹ̀ ní ìgbọ́ àwọn ènìyàn, ó wọ Kápánáúmù.
  rationale: A yọ “sì” tí kò sí nínú orísun kúrò, a sì rọ́pò ìsọ tí kò dára “ní etígbọ́” pẹ̀lú “ní ìgbọ́ àwọn ènìyàn,” láti pa ìtumọ̀ ‘níbi tí àwọn ènìyàn ti gbọ́ ọ’ mọ́ ní Yorùbá adayeba. A yọ àlàyé ìsàlẹ̀ náà nítorí kò fi ìyàtọ̀ ìtumọ̀ tó wúlò hàn, ó sì ń gbé gbolohun Yorùbá tí kò rọrùn kalẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:37:50Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtẹ̀síwájú àsìkò ti Ἐπειδὴ, ìparí ọ̀rọ̀ náà, àti ìwọlé Jesu sí Kápánáúmù dáadáa. Ṣùgbọ́n “sì” kò sí nínú ọ̀rọ̀ Gíríìkì, nítorí náà a yọ ọ́ kúrò. “Ní ìgbọ́ àwọn ènìyàn” ṣàfihàn εἰς τὰς ἀκοὰς τοῦ λαοῦ ní kedere àti lọ́nà Yorùbá tó rọrùn ju “ní etígbọ́” lọ.
  naturalness: “Ní etígbọ́ àwọn ènìyàn” kò wọ́pọ̀ gẹ́gẹ́ bí ọ̀nà Yorùbá boṣewa fún ‘in the hearing of the people.’ “Ní ìgbọ́ àwọn ènìyàn” jẹ́ èdè adayeba, ó sì pa ìtumọ̀ ìgbọ́ olùgbọ́ mọ́.
  terminology: “Gbogbo ọ̀rọ̀ rẹ̀,” “àwọn ènìyàn,” “ó wọ,” àti “Kápánáúmù” yẹ, wọ́n sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá ọlọ́lá mu. A kò nílò àlàyé ìsàlẹ̀ nítorí ìyàtọ̀ ‘sí etí’ jẹ́ ìtumọ̀ ọ̀rọ̀ dé ọ̀rọ̀ tí kò dára gẹ́gẹ́ bí gbolohun Yorùbá.
  issues:
  - severity: medium
    issue: Ọ̀rọ̀ “sì” ni a fi kún gbolohun náà.
    rationale: SBLGNT kò ní ọrọ̀ asopò tó bá “sì” mu nínú ẹsẹ̀ yìí; fifi í kún un ń ṣàfikún ìbáṣepọ̀ ìtàn tí orísun kò sọ ní pàtó.
  - severity: medium
    issue: “Ní etígbọ́ àwọn ènìyàn” kò dára gẹ́gẹ́ bí ìsọ Yorùbá boṣewa.
    rationale: Ó dà bí àkójọpọ̀ ọ̀rọ̀ tí kò wọ́pọ̀. “Ní ìgbọ́ àwọn ènìyàn” jẹ́ kedere, adayeba, ó sì bá ìtumọ̀ Gíríìkì náà mu.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ náà pè ìtumọ̀ kan tí ó lo “sí etí” ní ‘ìtumọ̀ tààrà.’
    rationale: Bí ó tilẹ̀ jẹ́ pé εἰς lè jẹ́ ‘sí/sínú,’ ìtumọ̀ bẹ́ẹ̀ kò jẹ́ gbolohun Yorùbá adayeba nínú àyíká yìí, kò sì ṣàfikún ìtumọ̀ pàtàkì kan ju ìtumọ̀ àkọ́kọ́ lọ.
