source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: yo
  text: Àwọn tí wọ́n jọ jókòó jẹun pẹ̀lú rẹ̀ sì bẹ̀rẹ̀ sí í sọ fún ara wọn[a] pé, “Ta ni ẹni yìí, tí ó tilẹ̀ ń dárí ẹ̀ṣẹ̀ jì?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ nínú ọkàn ara wọn.” Èdè Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ tí wọ́n ń sọ fún ara wọn tàbí sí ohun tí ọ̀kọ̀ọ̀kan wọn ń rò nínú ọkàn rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó fi ìbẹ̀rẹ̀ ìṣe tí aorist ingressive náà ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: συνανακείμενοι
  choice: àwọn tí wọ́n jọ jókòó jẹun pẹ̀lú rẹ̀
  rationale: Ó pa àyíká àsè mọ́, ó sì mú ìtumọ̀ συν- (‘jọ…pẹ̀lú’) jáde; ‘jókòó jẹun’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju fífi ìṣe ìrọ̀gbọ̀kú ti ayé àtijọ́ túmọ̀ ní líle lọ.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: sọ láàárín ara wọn
  rationale: Ó bá ọ̀pọ̀ àlejò mu, ó sì pa àìdánilójú mọ́ bóyá wọ́n ń bá ara wọn sọ̀rọ̀ tàbí ọ̀kọ̀ọ̀kan ń rò ó lọ́kàn.
- source_word: Τίς οὗτός ἐστιν
  choice: Ta ni ẹni yìí
  rationale: Ó pa ìbéèrè kúkúrú náà mọ́ láì fi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ.
- source_word: καὶ
  choice: tilẹ̀
  rationale: Níbi yìí καί ń fi ìyàlẹ́nu àti ìtẹnumọ́ hàn; ‘tilẹ̀’ mú agbára yẹn jáde.
- source_word: ἁμαρτίας ἀφίησιν
  choice: ń dárí ẹ̀ṣẹ̀ jì
  rationale: Èyí ni gbólóhùn Yorùbá tí ó ṣe kedere, tí a sì mọ̀ dáadáa fún fífi ẹ̀ṣẹ̀ jì.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ Jésù láti dárí ẹ̀ṣẹ̀ jì
  choice: A fi ìbéèrè àwọn tí wọ́n wà níbi àsè sílẹ̀ láì ṣàlàyé ẹni tí Jésù jẹ́ tàbí orísun àṣẹ rẹ̀.
  alternative: Láti fi ‘ọkùnrin’ tàbí àlàyé nípa àṣẹ Ọlọ́run kún un.
  rationale: Ẹsẹ̀ náà ń gbé ìbéèrè nípa ẹni tí Jésù jẹ́ dìde, ṣùgbọ́n kò dáhùn rẹ̀ níhìn-ín; ìtumọ̀ náà pa ìyàlẹ́nu àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘jókòó jẹun’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún wíwà níbi tábìlì, dípò ìtumọ̀ líle ti ìrọ̀gbọ̀kú nígbà àsè ayé àtijọ́.
