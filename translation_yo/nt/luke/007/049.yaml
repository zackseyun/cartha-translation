  naturalness: Ọ̀rọ̀ àkọ́kọ́ náà jẹ́ Yorùbá ìgbàlódé tí ó rọrùn. Ṣùgbọ́n ‘sọ nínú ara wọn’ nínú akọsílẹ̀ abẹ́lẹ̀ kò jẹ́ ọ̀nà àdánidá láti sọ ìrònú inú ẹni tàbí ọ̀rọ̀ ìkọ̀kọ̀; ó lè dà bí ohun tí a sọ nínú ara ẹni ní ti gidi. A tún lè mú gbolohun ‘sọ láàárín ara wọn’ rọrùn sí i nípa lílo ‘sọ fún ara wọn,’ nígbà tí akọsílẹ̀ abẹ́lẹ̀ yóò pa àìdánilójú ìtumọ̀ náà mọ́.
  terminology: ‘Dárí ẹ̀ṣẹ̀ jì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó péye, tí ó wọ́pọ̀, tí ó sì yẹ fún ἀφίησιν ἁμαρτίας. ‘Ta ni ẹni yìí?’ pa kúkúrú àti ìfẹ̀hónúhàn ìbéèrè Gíríìkì mọ́. ‘Tilẹ̀’ sì gbé agbára ascensive ti καί jáde dáadáa.
