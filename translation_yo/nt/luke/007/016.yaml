id: LUK.7.16
reference: Luke 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: yo
  text: Ẹ̀rù sì ba gbogbo wọn[a], wọ́n sì ń yin Ọlọ́run lógo, wọ́n ń wí pé, “Wòlíì ńlá kan ti dìde láàárín wa[b], Ọlọ́run sì ti bẹ àwọn ènìyàn rẹ̀ wò[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀rù” níhìn-ín tún lè ní ìmọ̀lára ọ̀wọ̀ jíjinlẹ̀ àti ìyanu nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ti gbé wòlíì ńlá kan dìde láàárín wa,” èyí tó lè tẹnu mọ́ Ọlọ́run gẹ́gẹ́ bí ẹni tó gbé e dìde.
    reason: lexical_alternative
  - marker: c
    text: “Bẹ ... wò” jẹ́ èdè Bíbélì fún bí Ọlọ́run ṣe yíjú sí àwọn ènìyàn rẹ̀ pẹ̀lú àbójútó, tó sì ń ṣiṣẹ́ fún wọn.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν δὲ φόβος πάντας
  choice: Ẹ̀rù sì ba gbogbo wọn
  rationale: Òwe Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé ìbẹ̀rù dé bá gbogbo wọn lójijì. Ó pa agbára φόβος mọ́ láì sọ ọ́ di ìyanu tàbí ọ̀wọ̀ nìkan.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: wọ́n sì ń yin Ọlọ́run lógo
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ tàbí tí wọ́n ń ṣe léraléra hàn, gẹ́gẹ́ bí imperfect ἐδόξαζον; ‘yin ... lógo’ tún pa ìtumọ̀ δοξάζω mọ́.
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ tí wọ́n fi ń yin Ọlọ́run lógo, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu.
- source_word: Προφήτης μέγας
  choice: Wòlíì ńlá kan
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún wòlíì kan tí ó tóbi tàbí tí ó ṣe pàtàkì.
- source_word: ἠγέρθη
  choice: ti dìde
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn fún ‘has arisen,’ nígbà tí ó ṣì lè jẹ́ kí òǹkàwé gbọ́ ìtumọ̀ pé Ọlọ́run ló gbé wòlíì náà dìde.
- source_word: ἐν ἡμῖν
  choice: láàárín wa
  rationale: Ó túmọ̀ sí pé wòlíì náà ti farahàn ní àárín àwùjọ wọn.
- source_word: Ἐπεσκέψατο
  choice: ti bẹ ... wò
  rationale: ‘Bẹ ... wò’ pa àwòrán ìbẹ̀wò inú Bíbélì mọ́, èyí tí ó lè ní ìtumọ̀ àbójútó àti ìgbésẹ̀ ìgbàlà, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τὸν λαὸν αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, ó sì pa ìbáṣepọ̀ Ọlọ́run pẹ̀lú àwọn ènìyàn tirẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ φόβος lẹ́yìn iṣẹ́ ìyanu
  choice: ẹ̀rù
  alternative: ìbẹ̀rù ọlọ́wọ̀ tàbí ìyanu
  rationale: ‘Ẹ̀rù’ pa agbára àti ìfọ̀kànbalẹ̀ ọ̀rọ̀ Gíríìkì mọ́. Yíyàn ‘ìyanu’ nìkan yóò tú ìforígbárí tó wà nínú ìdáhùn wọn sílẹ̀ ju bó ṣe yẹ lọ.
- issue: Ìtumọ̀ ἠγέρθη nípa wòlíì
  choice: ti dìde
  alternative: a ti gbé e dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ passive, ó sì lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tó gbé wòlíì náà dìde. Ọ̀rọ̀ inú àkọ́kọ́ jẹ́ àdánidá, àkọsílẹ̀ ìsàlẹ̀ sì pa ìṣe Ọlọ́run tó ṣeé ṣe mọ́.
- issue: Ìtumọ̀ Ἐπεσκέψατο nígbà tí Ọlọ́run ṣe ìṣe
  choice: Ọlọ́run ... ti bẹ àwọn ènìyàn rẹ̀ wò
  alternative: Ọlọ́run ti wá ran àwọn ènìyàn rẹ̀ lọ́wọ́
  rationale: Èdè ìbẹ̀wò pa ìtumọ̀ Bíbélì tó ní í ṣe pẹ̀lú àbójútó àti ìgbàlà mọ́, láì dín un kù sí ìrànlọ́wọ́ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìṣàn ìtàn àti ìṣe tó ń lọ lọ́wọ́ mọ́.
