base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: yo
  text: Ó sì sọ fún obìnrin náà pé, “Ìgbàgbọ́ rẹ[a] ti gbà ọ́ là[b]. Lọ ní àlàáfíà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìgbẹ́kẹ̀lé rẹ”; níbí sì ni ó kéré sí i pé, “Ìṣòtítọ́ rẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti mú ọ lára dá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbà là,” “yọ kúrò nínú ewu,” tàbí “mú lára dá”; ṣùgbọ́n níbí, àyíká ọ̀rọ̀ náà tẹnu mọ́ ìdáríjì àti ìgbàlà.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ó sọ
  rationale: Ọ̀rọ̀ aoristi λέγω túmọ̀ sí pé ó sọ ohun kan; ‘sọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: δὲ
  choice: sì
  rationale: δέ ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn; ‘sì’ ni àsopọ̀ Yorùbá tó yẹ níbí.
- source_word: πρὸς τὴν γυναῖκα
  choice: fún obìnrin náà
  rationale: γυνή ń tọ́ka sí obìnrin tó wà nínú ìṣẹ̀lẹ̀ náà, kì í ṣe aya; ‘sọ fún obìnrin náà’ jẹ́ ìṣọ̀rọ̀ Yorùbá àdánidá.
- source_word: Ἡ πίστις σου
  choice: Ìgbàgbọ́ rẹ
  rationale: πίστις níbí ń tọ́ka sí ìgbẹ́kẹ̀lé obìnrin náà nínú Jésù. ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún ìtumọ̀ yìí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ìgbẹ́kẹ̀lé’ àti ‘ìṣòtítọ́’ mọ́.
- source_word: σέσωκέν σε
  choice: ti gbà ọ́ là
  rationale: Perfect σῴζω ń fi iṣẹ́ tí a ti parí, tí àbájáde rẹ̀ sì ń bá a lọ hàn. ‘Ti gbà ọ́ là’ dáàbò bo ìtumọ̀ ìgbàlà nínú àyíká ìdáríjì ẹ̀ṣẹ̀, láìpa ìtumọ̀ yíyá lódì sí àìsàn rẹ́.
- source_word: πορεύου
  choice: máa lọ
  rationale: ‘Máa lọ’ jẹ́ àṣẹ Yorùbá àdánidá fún πορεύου, ó sì lè fi ìtẹ̀síwájú tó wà nínú present imperative hàn.
- source_word: εἰς εἰρήνην
  choice: ní àlàáfíà
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς lè túmọ̀ sí ‘sínú,’ gbólóhùn náà jẹ́ ọ̀rọ̀ àṣà tó túmọ̀ sí kí ẹni náà lọ pẹ̀lú àlàáfíà; ‘ní àlàáfíà’ jẹ́ Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìtumọ̀ σῴζω ní ìbámu pẹ̀lú ìdáríjì àti ìgbàlà
  choice: ‘ti gbà ọ́ là’
  alternative: ‘ti mú ọ lára dá’ tàbí ‘ti wo ọ́ sàn’
  rationale: Àyíká Lúùkù 7:36–50 dá lórí ìdáríjì ẹ̀ṣẹ̀ àti ìgbẹ́kẹ̀lé obìnrin náà nínú Jésù. ‘Ti gbà ọ́ là’ pa ìwúwo ọ̀rọ̀ náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí mímú ẹni lára dá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Máa lọ ní àlàáfíà’ jẹ́ gbólóhùn àdánidá tí òǹkàwé Yorùbá òde òní lè lóye ní rọrùn.
