id: LUK.7.8
reference: Luke 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: yo
  text: Nítorí èmi náà jẹ́ ẹni tí a fi sí abẹ́ àṣẹ, mo sì ní àwọn ọmọ-ogun lábẹ́ mi. Mo sọ fún eléyìí pé, ‘Lọ,’ ó sì lọ; mo sọ fún ẹlòmíràn pé, ‘Wá,’ ó sì wá; mo sì sọ fún ẹrú mi pé, ‘Ṣe èyí,’ ó sì ṣe é.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́ mi” dípò “ẹrú mi.” Ọ̀rọ̀ Gíríìkì náà, doulos, ń tọ́ka sí ẹni tó wà ní ìdè tàbí ní ipò ìní ẹlòmíràn, bí ó tilẹ̀ jẹ́ pé ní àwọn àyíká kan a lè túmọ̀ rẹ̀ ní gbogbogbòò sí “ìránṣẹ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: Ó mú ìtumọ̀ àlàyé γάρ jáde ní Yorùbá àdánidá; καί níbí kò nílò kí a túmọ̀ rẹ̀ lọ́tọ̀.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: èmi náà jẹ́ ẹni
  rationale: “Èmi náà” pa ìtẹnumọ́ àti ìfiwéra mọ́; “ẹni” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà wà nínú ipò kan, láìsọ ìtumọ̀ ἄνθρωπος di ohun míì.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: tí a fi sí abẹ́ àṣẹ
  rationale: Ó pa ìṣe aláìṣe taara ti τασσόμενος àti ètò ìpele àṣẹ ológun mọ́.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: mo sì ní àwọn ọmọ-ogun lábẹ́ mi
  rationale: Ó jẹ́ Yorùbá tí ó ṣe kedere, ó sì pa àwòrán àwọn ọmọ-ogun tí wọ́n wà lábẹ́ àṣẹ ọ̀gágun náà mọ́.
- source_word: λέγω τούτῳ· Πορεύθητι
  choice: Mo sọ fún eléyìí pé, ‘Lọ’
  rationale: “Eléyìí” pa agbára atọ́ka τούτῳ mọ́, “Lọ” sì jẹ́ àṣẹ kúkúrú tó bá Πορεύθητι mu.
- source_word: καὶ ἄλλῳ· Ἔρχου
  choice: mo sọ fún ẹlòmíràn pé, ‘Wá’
  rationale: Ó pa ìṣọ̀kan àṣẹ àti ìdáhùn inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: τῷ δούλῳ μου
  choice: ẹrú mi
  rationale: δοῦλος ń tọ́ka sí ẹni tó wà ní ipò ìdè tàbí ohun-ìní; ìpele àṣẹ yìí ṣe pàtàkì nínú àpẹẹrẹ ọ̀gágun náà.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘Ṣe èyí,’ ó sì ṣe é
  rationale: Ó pa ìfarajọ ọ̀rọ̀ àṣẹ àti ìgbọràn mọ́, pẹ̀lú arọ́pò-orúkọ Yorùbá tó yẹ.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àpẹẹrẹ ọ̀gágun
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nítorí ipò ẹni tó wà lábẹ́ àṣẹ ni àárín àpẹẹrẹ náà, “ẹrú” pa òtítọ́ awùjọ àti agbára ọ̀rọ̀ Gíríìkì mọ́. Síbẹ̀, “ìránṣẹ́” lè bá díẹ̀ lára àwọn àyíká δοῦλος mu, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìṣọ̀kan àṣẹ–ìdáhùn ti ẹsẹ náà mọ́.
