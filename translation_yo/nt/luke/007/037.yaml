  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: yo
  text: Sì kíyèsí i, obìnrin kan tí ó wà ní ìlú náà, tí ó jẹ́ ẹlẹ́ṣẹ̀[a], gbọ́ pé ó rọ̀gbọ̀kú[b] ní ilé Farisí náà; ó sì mú ìgò alábásítà kan ti ìkunra olóòórùn dídùn wá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “obìnrin ẹlẹ́ṣẹ̀.” Gíríìkì kàn pè é ní “ẹlẹ́ṣẹ̀”; kò sọ irú ẹ̀ṣẹ̀ tí ó dá.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé ó rọ̀gbọ̀kú ní ìlànà tí àwọn ènìyàn máa ń gbà jẹun níbi àsè ní àsìkò náà.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ìgò alábásítà kan ti òróró ìkunra olóòórùn dídùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa ipa ọ̀rọ̀ yìí mọ́ gẹ́gẹ́ bí àmì ìtàn tó ń pe àfiyèsí sí ohun tuntun tàbí ohun ìyanu, láì lo ọ̀rọ̀ àtijọ́ tí kò rọrùn fún òǹkàwé òde òní.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: tí ó wà ní ìlú náà
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, kò sì fi kún un pé ibẹ̀ ni ó ń gbé tàbí pé gbogbo ará ìlú mọ̀ ọ́n.
- source_word: ἁμαρτωλός
  choice: ẹni tí ó jẹ́ ẹlẹ́ṣẹ̀
  rationale: Ó pa ìṣe ọ̀rọ̀-orúkọ náà mọ́, kò sì sọ irú ẹ̀ṣẹ̀ tí obìnrin náà dá, nítorí Gíríìkì kò sọ ọ́.
- source_word: ἐπιγνοῦσα
  choice: gbọ́ pé
  rationale: Nínú Yorùbá àdánidá, gbọ́ pé ń fi hàn pé ó rí ìròyìn náà gbà ṣáájú ìgbésẹ̀ pàtàkì rẹ̀.
- source_word: κατάκειται
  choice: rọ̀gbọ̀kú níbi oúnjẹ
  rationale: Ó fi ipò tí àwọn ènìyàn máa ń gbà jẹun ní àsìkò náà hàn, dípò kíkàn sọ pé ó jókòó tàbí pé ó ń jẹun.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: ní ilé Farisí náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ilé tí ó jẹ́ ti Farisí pàtó kan.
- source_word: κομίσασα
  choice: ó sì mú ... wá
  rationale: Ó sọ ní kedere pé obìnrin náà gbé ohun náà wá sí ibi tí Jesu wà.
- source_word: ἀλάβαστρον μύρου
  choice: ìgò alábásítérì kan tí ó kún fún òróró olóòórùn dídùn
  rationale: Ìgò alábásítérì ń tọ́ka sí ohun èlò náà, òróró olóòórùn dídùn sì ń sọ ohun inú rẹ̀ ní èdè Yorùbá tí ó yé òǹkàwé òde òní.
theological_decisions:
- issue: Ìṣàpèjúwe ìwà obìnrin náà
  choice: ẹni tí ó jẹ́ ẹlẹ́ṣẹ̀
  alternative: obìnrin ẹlẹ́ṣẹ̀; panṣágà
  rationale: Ọ̀rọ̀ Gíríìkì ἁμαρτωλός pè é ní ẹlẹ́ṣẹ̀, ṣùgbọ́n kò sọ irú ẹ̀ṣẹ̀ rẹ̀. Nítorí náà, a kò dá a mọ̀ gẹ́gẹ́ bí panṣágà tàbí fi ẹ̀ṣẹ̀ pàtó kún ọ̀rọ̀ náà.
- issue: Ẹni tí ó rọ̀gbọ̀kú níbi oúnjẹ
  choice: a pa arọ́pò-orúkọ ó mọ́
  alternative: Jesu
  rationale: Gíríìkì ní arọ́pò-orúkọ tí ó fara sin nínú ọ̀rọ̀-ìṣe, ẹni tí àyíká ìtàn ń tọ́ka sí. Lílo ó pa ìṣètò ọ̀rọ̀ orísun àti ìtọ́kasí àyíká mọ́, láì fi orúkọ tí kò sí nínú ẹsẹ yìí kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó yẹ. “Kíyèsí i” ń gbé ìtẹnumọ́ ìtàn náà jáde; “rọ̀gbọ̀kú níbi oúnjẹ” sì pa àṣà jíjẹun ìgbà náà mọ́ láì sọ ọ́ di jíjókòó lásán.
