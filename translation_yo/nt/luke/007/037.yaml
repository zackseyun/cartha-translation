  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì mọ́: obìnrin náà jẹ́ ‘ẹlẹ́ṣẹ̀’ láì sọ irú ẹ̀ṣẹ̀ rẹ̀, ó sì mọ̀ pé ẹni náà ń rọ̀gbọ̀kú ní ilé Farisí náà. Ṣùgbọ́n ‘tí ó kún fún’ fi ìtumọ̀ ‘kún fún’ kún ἀλάβαστρον μύρου, èyí tí orísun kò sọ ní tààrà; bákan náà, ‘òróró’ lè dín μύρον kù sí irú nǹkan pàtó ju ‘ìkunra olóòórùn dídùn’ lọ.'
