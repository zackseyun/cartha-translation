revisions:
- from: Sì kíyèsí i, obìnrin kan tí ó wà ní ìlú náà, ẹni tí ó jẹ́ ẹlẹ́ṣẹ̀[a], gbọ́ pé ó rọ̀gbọ̀kú níbi oúnjẹ ní ilé Farisí náà[b]; ó sì mú ìgò alábásítérì kan tí ó kún fún òróró olóòórùn dídùn wá[c].
  to: Sì kíyèsí i, obìnrin kan tí ó wà ní ìlú náà, tí ó jẹ́ ẹlẹ́ṣẹ̀[a], gbọ́ pé ó rọ̀gbọ̀kú[b] ní ilé Farisí náà; ó sì mú ìgò alábásítà kan ti ìkunra olóòórùn dídùn wá[c].
  rationale: Àtúnṣe náà yọ ‘tí ó kún fún’ kúrò nítorí pé orísun kò sọ ìwọ̀n ohun inú ìgò náà. Ó tún lo ‘ìkunra olóòórùn dídùn’ fún μύρον, ó sì mú ìṣàpèjúwe obìnrin náà rọrùn nínú Yorùbá láì fi ẹ̀ṣẹ̀ pàtó kún un. Àmì akọsilẹ̀ ìtọ́kasí ìlànà jíjẹun ni a gbe sún mọ́ ‘rọ̀gbọ̀kú.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:30Z'
