  terminology: ‘Farisí’ àti ‘alábásítà’ jẹ́ ọ̀rọ̀ tó yẹ. ‘Ìgò alábásítà kan ti ìkunra olóòórùn dídùn’ ń pa ìtumọ̀ ohun èlò alábásítà àti μύρον mọ́ láì sọ pé ó kún fún un tàbí pé òróró lásán ni.
