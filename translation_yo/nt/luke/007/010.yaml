  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: yo
  text: Nígbà tí àwọn tí a rán lọ padà sí ilé náà, wọ́n rí ẹrú náà[a] ní ìlera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, δοῦλος (doulos), lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: nígbà tí ... padà
  rationale: Ọ̀rọ̀-orúkọ-ìṣe aorist yìí ń fi àkókò hàn ṣáájú ìṣe pàtàkì; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: εἰς τὸν οἶκον
  choice: sí ilé
  rationale: εἰς pẹ̀lú accusative ń tọ́ka sí ìlọ sí ibi kan; “sí ilé” dára ní Yorùbá láì fi ìtumọ̀ míì kún un.
- source_word: οἱ πεμφθέντες
  choice: àwọn tí a rán lọ
  rationale: Ó pa ìṣe-àfarawà passive participle mọ́, kò sì fi orúkọ bí “àwọn oníṣẹ́” tàbí “àwọn aṣojú” tí kò sí nínú Gíríìkì kún un.
- source_word: εὗρον
  choice: wọ́n bá
  rationale: Nínú ìtàn Yorùbá, “bá” jẹ́ ọ̀nà àdánidá láti sọ pé àwọn tó dé ibi kan rí ẹni náà ní ipò kan.
- source_word: τὸν δοῦλον
  choice: ẹrú
  rationale: δοῦλος lè túmọ̀ sí ẹrú tàbí ìránṣẹ́ gẹ́gẹ́ bí àyíká ọ̀rọ̀. Níhìn-ín, “ẹrú” pa ipò ẹni tí ó wà lábẹ́ ohun-ìní àti àṣẹ ọ̀gágun náà mọ́; àṣàyàn “ìránṣẹ́” wà nínú àlàyé ìsàlẹ̀.
- source_word: ὑγιαίνοντα
  choice: ní ara líle
  rationale: ὑγιαίνω túmọ̀ sí wíwà ní ìlera tàbí ní ara dáadáa. “Ní ara líle” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kò sì sọ ní tààrà pé a ti “wòsàn,” bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí ìpadàbọ̀ sí ìlera.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú ìtàn ìwòsàn yìí
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ipò ìbákẹ́gbẹ́ lábẹ́ àṣẹ àti ohun-ìní ọ̀gágun náà ṣe pàtàkì nínú àyíká ọ̀rọ̀. “Ẹrú” pa ìtumọ̀ awùjọ Gíríìkì mọ́ dáadáa, nígbà tí àlàyé ìsàlẹ̀ ń jẹ́ kí òǹkàwé mọ àṣàyàn “ìránṣẹ́” tí ó tún ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “wọ́n bá ... ní ara líle” gẹ́gẹ́ bí ìsọ̀rọ̀ ìtàn àdánidá, a sì gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ “ẹrú,” ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
