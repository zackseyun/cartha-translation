  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: yo
  text: Ìbùkún sì ni fún ẹni tí kò bá kọsẹ̀ nítorí mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò bá bínú sí mi,” tàbí, “tí kò bá ṣubú kúrò nínú ìgbàgbọ́ nítorí mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ẹni ìbùkún
  rationale: Ó pa ìwúwo ẹ̀sìn àti ti ìbùkún Ọlọ́run mọ́ nínú ọ̀rọ̀ Jesu; ‘aláyọ̀’ lè túmọ̀ sí ìmọ̀lára ayọ̀ lásán.
- source_word: ὃς ἐὰν μή
  choice: ẹni tí kò bá
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún arọ́pò-orúkọ olùtọ́ka ẹyọ kan pẹ̀lú ipò gbogbogbò tí ἐὰν μή ń fi hàn.
- source_word: σκανδαλισθῇ
  choice: kọsẹ̀
  rationale: ‘Kọsẹ̀’ pa àwòrán ìkọsẹ̀ mọ́, ó sì lè ní ìtumọ̀ jíjẹ́ kí ohun kan di ìdènà sí ìgbàgbọ́, láì dín ọ̀rọ̀ náà kù sí bíbínú lásán tàbí túmọ̀ rẹ̀ pátápátá sí ìṣubú kúrò nínú ìgbàgbọ́.
- source_word: ἐν ἐμοί
  choice: nítorí mi
  rationale: Nínú àṣà ọ̀rọ̀ yìí, ἐν ἐμοί ń tọ́ka sí Jesu gẹ́gẹ́ bí ohun tí ó fa tàbí jẹ́ àǹfààní ìkọsẹ̀; ‘nítorí mi’ jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa pa ìforígbárí inú èdè ìkọsẹ̀ nípa Jesu mọ́
  choice: kọsẹ̀ nítorí mi
  alternative: bínú sí mi; ṣubú kúrò nínú ìgbàgbọ́ nítorí mi
  rationale: 'Àṣàyàn náà pa àwòrán àti àìdánilójú gidi ti ọ̀rọ̀ Gíríìkì mọ́: ó lè jẹ́ kí Jesu di ohun ìkọsẹ̀ fún ẹni kan, ṣùgbọ́n kò fi dandan sọ pé ìmọ̀lára bíbínú lásán ni tàbí pé ẹni náà ti ṣubú kúrò nínú ìgbàgbọ́ pátápátá.'
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo ‘Ẹni ìbùkún’ láti pa àkójọpọ̀ ọ̀rọ̀ ìbùkún náà mọ́, a sì lo ‘kọsẹ̀’ fún àwòrán σκανδαλίζω. Àmì ohùn ni a fi sí ibi tí ó yẹ.
