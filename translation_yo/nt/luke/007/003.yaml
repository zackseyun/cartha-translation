source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: yo
  text: Nígbà tí ó gbọ́ nípa Jésù, ó rán àwọn àgbà Júù sí ọ̀dọ̀ rẹ̀, láti bẹ̀ ẹ́ pé kí ó wá gba ẹrú rẹ̀ là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìránṣẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí. A lo “ẹrú” níbí láti fi ipò ẹrú ẹni náà hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: Nígbà tí ó gbọ́ nípa Jésù
  rationale: Ọ̀rọ̀ àbọ̀ aorist náà fi ohun tí ó ṣẹlẹ̀ ṣáájú ìránṣẹ́ hàn; “Nígbà tí ó gbọ́” jẹ́ Yorùbá àdánidá. δέ jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́, kò sì nílò ìtumọ̀ lọ́tọ̀ níbí.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ó rán ... sí i
  rationale: Èyí tẹ̀ lé ìtumọ̀ taara pé ó rán àwọn ènìyàn tí a dárúkọ sí Jésù, láìfi “àwọn aṣojú” kún ọ̀rọ̀ Gíríìkì.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: àwọn àgbààgbà àwọn Júù
  rationale: πρεσβύτεροι ń tọ́ka sí àwọn olórí tí àwùjọ mọ̀ sí ipò, kì í ṣe kìkì àwọn àgbàlagbà ní ọjọ́ orí.
- source_word: ἐρωτῶν αὐτὸν
  choice: ó ń bẹ̀ ẹ́
  rationale: Nínú àyíká yìí, ἐρωτάω jẹ́ ìbéèrè pẹ̀lú ẹ̀bẹ̀; “ń bẹ̀ ẹ́” sọ ìbéèrè ọlọ́wọ̀ náà ní Yorùbá àdánidá.
- source_word: ὅπως ἐλθὼν
  choice: pé kí ó wá
  rationale: ὅπως pẹ̀lú subjunctive sọ ohun tí wọ́n fẹ́ kí ó ṣe; “pé kí ó wá” jẹ́ ìṣètò Yorùbá tó ṣe kedere.
- source_word: διασώσῃ
  choice: gba ... là
  rationale: διασῴζω lè túmọ̀ sí gbà là, dá sí, tàbí mú lára dá nínú àyíká àìsàn. “Gba ... là” pa ìtumọ̀ gbòòrò rẹ̀ mọ́ láìdín in kù sí ìwòsàn nìkan.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: ẹrú rẹ̀
  rationale: δοῦλος níbí tọ́ka sí ẹni tí ó wà lábẹ́ àṣẹ ọ̀gágun náà gẹ́gẹ́ bí ohun ìní ilé; “ẹrú” pa ipò ìdè rẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé ó tún ń ṣe iṣẹ́ ìránṣẹ́.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àyíká ilé ọ̀gágun
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: “Ẹrú” fi òtítọ́ ipò ìdè ẹni náà hàn kedere. “Ìránṣẹ́” lè tẹnu mọ́ iṣẹ́ tí ó ń ṣe, ṣùgbọ́n ó lè bo ipò àwùjọ àti ti òfin tí δοῦλος ń tọ́ka sí ní àyíká yìí.
translation_notes:
  register: A lo Yorùbá àfọwọ́ṣe, ọlọ́wọ̀, àti ti òde òní pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Àwọn àgbààgbà àwọn Júù” dúró fún àwọn olórí àwùjọ; “gba ... là” sì pa fífẹ̀ ìtumọ̀ διασῴζω mọ́.
