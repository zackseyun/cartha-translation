  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “Símónì, mo ní ohun kan láti sọ fún ọ.” Símónì sì wí pé, “Olùkọ́, sọ ọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dá a lóhùn
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ gẹ́gẹ́ bí ìdáhùn nínú ìtàn, bí ó tilẹ̀ jẹ́ pé ohun tí Símónì sọ ṣáájú kò hàn nínú ẹsẹ yìí.
- source_word: εἶπεν πρὸς αὐτόν
  choice: pé
  rationale: Pẹ̀lú “dá a lóhùn,” èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà láì tún “sọ” ṣe lọ́nà líle.
- source_word: Σίμων
  choice: Símónì
  rationale: Ìkọ̀wé orúkọ náà tẹ̀ lé bí a ṣe máa ń pe Simon ní Yorùbá.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: mo ní ohun kan láti sọ fún ọ
  rationale: Ó ṣàfihàn σοί ní kedere, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédéé.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ìtumọ̀ pàtó ti διδάσκαλος ni ẹni tí ń kọ́ni; “Olùkọ́” kò fi agbára àfikún tí “Ọ̀gá” lè mú wọlé.
- source_word: εἰπέ
  choice: sọ ọ́
  rationale: Àṣẹ náà túmọ̀ sí kí Jésù sọ ohun tí ó ní lọ́kàn; arọ́pò-orúkọ “ọ́” jẹ́ kí Yorùbá náà péye, bí ohun tí a ń tọ́ka sí ti fara sin nínú Gíríìkì.
- source_word: φησίν
  choice: ó sì wí pé
  rationale: A lo àsìkò ìtàn Yorùbá dípò lílé mọ́ historical present Gíríìkì; “wí pé” tún yẹ fún ìforúkọsílẹ̀ mímọ́ tí ó ní iyì.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ṣe kedere, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa àkójọpọ̀ ìṣe “dá a lóhùn pé” mọ́ ní ọ̀nà Yorùbá àdánidá. Kò sí àlàyé ìsàlẹ̀ tí ó pọndandan; àlàyé Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé àmì [a] wà lẹ́yìn “him,” ṣùgbọ́n ọ̀rọ̀ àlàyé rẹ̀ ń tọ́ka sí “Teacher, say it,” nítorí náà a kò gbe àmì tí kò bá ibi rẹ̀ mu wọ inú ẹsẹ Yorùbá.
