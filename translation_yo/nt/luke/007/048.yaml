translation:
  language: yo
  text: Nígbà náà, ó sì wí fún un pé, “A ti dárí ẹ̀ṣẹ̀ rẹ jì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ẹ̀ṣẹ̀ rẹ ti gba ìdáríjì.” Perfect passive Gíríìkì lè tẹnu mọ́ ìṣe tí a ti parí àti àbájáde rẹ̀ tí ó ṣì dúró.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: ó sọ
  rationale: Aorist λέγω túmọ̀ sí ìṣe sísọ ní ọ̀nà tó ṣe déédé; “ó sọ” jẹ́ èdè Yorùbá àdánidá fún ọ̀rọ̀ tààrà.
- source_word: δὲ
  choice: Nígbà náà
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn síwájú; “Nígbà náà” mú ìṣàn ìtàn náà jáde láì fi ìtakora tí kò sí sínú rẹ̀.
- source_word: αὐτῇ
  choice: fún obìnrin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà tọ́ka sí obìnrin tí àyíká ẹsẹ̀ yìí ti sọ̀rọ̀ nípa rẹ̀; fífi “obìnrin náà” hàn mú Yorùbá ṣe kedere, ó sì bá àtẹ̀jáde náà mu.
- source_word: Ἀφέωνταί
  choice: A ti dárí … jì
  rationale: Perfect passive ἀφίημι ń fi ìṣe tí a ti parí hàn pẹ̀lú ipò àbájáde rẹ̀ tí ó ń bá a lọ. Ilana “A ti dárí … jì” jẹ́ àdánidá ní Yorùbá, ó sì pa agbára perfect passive náà mọ́.
- source_word: σου
  choice: rẹ … ọ́
  rationale: σου jẹ́ genitive ẹni kejì ẹyọ; Yorùbá àdánidá fi “rẹ” hàn gẹ́gẹ́ bí ohun-ìní, ó sì sábà tún ẹni tí a dárí jì sọ ní “ọ́” lẹ́yìn ọ̀rọ̀-ìṣe náà.
- source_word: αἱ ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Plural ἁμαρτίαι ni “àwọn ẹ̀ṣẹ̀”; ó tọ́ka sí àwọn ìrékọjá níwájú Ọlọ́run nínú àyíká yìí.
theological_decisions:
- issue: Agbára perfect passive Ἀφέωνταί nínú ìkéde ìdáríjì
  choice: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.
  alternative: A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́, wọ́n sì wà ní dídáríjì.
  rationale: “A ti dárí” fi ìṣe tí ó ti ṣẹlẹ̀ àti àbájáde rẹ̀ tó dúró hàn láì pinnu ẹni tó ṣe ìṣe náà ní kedere ju passive Gíríìkì lọ. Ó tún yẹra fún àlàyé nípa àkókò tàbí ọ̀nà ìdáríjì tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, ìgbàlódé, àti ọ̀wọ̀ ni a lò. “Dárí ẹ̀ṣẹ̀ jì” jẹ́ gbólóhùn àdánidá tí gbogbo ènìyàn lè lóye. Àmì ohùn ni a fi sí ibi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn ìṣáájú gẹ́gẹ́ bí ipele ìtumọ̀ Gẹ̀ẹ́sì, bí ó tilẹ̀ jẹ́ pé àlàyé náà dá lórí ọ̀rọ̀ ìkéde tó tẹ̀ lé e.
