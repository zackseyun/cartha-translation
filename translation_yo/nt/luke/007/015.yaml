reference: Luke 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: yo
  text: Òkú náà sì dìde jókòó, ó sì bẹ̀rẹ̀ sí í sọ̀rọ̀; Jésù sì fi í fún ìyá rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù sì fi í padà fún ìyá rẹ̀,” tàbí “Jésù sì dá a padà fún ìyá rẹ̀.” Gíríìkì sọ lásán pé, “ó fi í fún ìyá rẹ̀”; àyíká ìtàn ló fi hàn pé ó dá ọmọ náà padà fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: dìde jókòó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ẹni tí ó dùbúlẹ̀ gbé ara rẹ̀ sókè sí ipò ìjókòó. “Dìde jókòó” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “sat up,” láì sọ pé ó dìde dúró.
- source_word: ὁ νεκρός
  choice: Òkú náà
  rationale: Àpilẹ̀kọ náà ń tọ́ka sí ọkùnrin tí ó ti kú tí a mẹ́nu kàn ṣáájú. “Òkú náà” jẹ́ kedere, ó sì bá ìtàn Yorùbá mu láì fi ìtumọ̀ mìíràn kún un.
- source_word: ἤρξατο λαλεῖν
  choice: bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Èyí fi ìbẹ̀rẹ̀ ìṣe hàn gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà, ó sì jẹ́ Yorùbá tí ó ṣe déédéé, tí ó ní iyì.
- source_word: λαλεῖν
  choice: sọ̀rọ̀
  rationale: “Sọ̀rọ̀” jẹ́ ìtumọ̀ Yorùbá àdánidá fún sísọ tàbí bíbáni sọ̀rọ̀, ó sì yẹ fún ìforúkọsílẹ̀ ìtàn yìí.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Jésù sì fi í fún ìyá rẹ̀
  rationale: Gíríìkì sọ ní tààrà pé “ó fi í fún ìyá rẹ̀.” A sọ “Jésù” dípò arọ́pò-orúkọ nítorí Yorùbá kò fi akọ tàbí abo hàn nínú “ó,” kí ẹni tó ṣe ìṣe náà lè ṣe kedere; kò fi ìtumọ̀ tuntun kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé Jésù dá ọmọ náà padà fún ìyá rẹ̀
  choice: Fi ọ̀rọ̀ rọrùn náà sílẹ̀ pé “Jésù sì fi í fún ìyá rẹ̀”
  alternative: “Jésù sì dá a padà fún ìyá rẹ̀” tàbí “Jésù sì fi í padà fún ìyá rẹ̀”
  rationale: Àyíká ìtàn fi ìdápadà náà hàn, ṣùgbọ́n δίδωμι túmọ̀ sí “fún” lásán, kò sì ní ọ̀rọ̀ kan tí ó sọ “padà” ní gbangba. Ìtumọ̀ náà pa ìfarahàn yìí mọ́, ó sì fi àṣàyàn onítumọ̀ sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá tí ó ṣe déédéé, tí ó ní àmì ohùn ní kíkún, tí ó sì ní ìyì ṣùgbọ́n tí ó yé òǹkàwé òde òní. A lo àmì àbọ̀ [a] nínú ọ̀rọ̀ pàtàkì, gẹ́gẹ́ bí àlàyé ìsàlẹ̀.
