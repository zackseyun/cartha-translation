base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, láìpẹ́ lẹ́yìn náà, ó lọ sí ìlú kan tí a ń pè ní Náínì,[a] àwọn ọmọ-ẹ̀yìn rẹ̀ àti ogunlọ́gọ̀ ènìyàn sì ń bá a lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “ní ọjọ́ kejì” dípò “láìpẹ́ lẹ́yìn náà.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó mú ọ̀nà ìtàn Lúùkù tí ń ṣí ìṣẹ̀lẹ̀ tuntun sílẹ̀ jáde ní Yorùbá àdánidá, láì lo ọ̀rọ̀ àtijọ́ tí ó le.
- source_word: ἐν τῷ ἑξῆς
  choice: ní ọjọ́ kejì
  rationale: Nínú ọ̀rọ̀ yìí, gbólóhùn náà tọ́ka sí ọjọ́ tí ó tẹ̀ lé e; èyí tún bá àkọsílẹ̀ SBLGNT mu.
- source_word: ἐπορεύθη
  choice: ó lọ
  rationale: Ìtumọ̀ àdánidá ti πορεύομαι nínú ìtàn ni ‘lọ’; ó ṣe kedere, ó sì yẹ fún Yorùbá òde òní.
- source_word: εἰς πόλιν
  choice: sí ìlú kan
  rationale: ‘Ìlú’ lè bo ìtumọ̀ πόλις láì fi dandan sọ pé ibẹ̀ jẹ́ ìlú ńlá; ‘sí’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìdarí ìrìn náà.
- source_word: καλουμένην Ναΐν
  choice: tí a ń pè ní Náínì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún orúkọ ibi, pẹ̀lú àkọsílẹ̀ orúkọ Náínì ní ìbámu pẹ̀lú ìró Gíríìkì.
- source_word: συνεπορεύοντο
  choice: ń bá a lọ
  rationale: Àmì àkókò tí ń lọ lọ́wọ́ pa ìṣe aláìparí imperfect mọ́, ‘bá a lọ’ sì fi ìrìn papọ̀ hàn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún μαθητής.
- source_word: ὄχλος πολύς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Gbólóhùn yìí sọ ìjọ ènìyàn púpọ̀ ní Yorùbá àdánidá; kò fi ìtumọ̀ míì tí ‘ńlá’ lè ní kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A pa ìṣàn ìtàn àti ìṣe tí ń lọ lọ́wọ́ mọ́.
