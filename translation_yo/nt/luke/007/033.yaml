  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: yo
  text: Nítorí Johanu Onítẹ̀bọmi ti wá, láì jẹ búrẹ́dì, láì sì mu wáìnì, ẹ̀yin sì ń wí pé, “Ó ní ẹ̀mí èṣù[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, lọ́nà tí ó túbọ̀ bá èdè Yorùbá mu, “Ẹ̀mí èṣù wọ̀ ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: ti wá
  rationale: Ọ̀rọ̀-ìṣe pípé náà fi hàn pé Johanu ti dé, ìwá rẹ̀ sì ṣì ṣe pàtàkì nínú ọ̀rọ̀ tí a ń sọ; “ti wá” pa agbára yìí mọ́ ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ọ̀rọ̀ tó ṣáájú; “Nítorí” jẹ́ ọ̀nà àdánidá láti so àlàyé náà pọ̀ mọ́ ọ̀rọ̀ ìṣáájú.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Johanu Onítẹ̀bọmi
  rationale: Èyí ni orúkọ àti àkọlé tí ó mọ́gbọ́n dání ní Yorùbá, ó sì fi ipa Johanu gẹ́gẹ́ bí ẹni tó ń ṣe ìtẹ̀bọmi hàn kedere.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: kò jẹ búrẹ́dì, kò sì mu ọtí wáìnì
  rationale: A pa àwọn ohun pàtó méjèèjì, búrẹ́dì àti wáìnì, mọ́ dípò yíyí ἄρτον padà sí “oúnjẹ”; ìṣètò náà tún ṣàpèjúwe ìgbé ayé ìkóra-ẹni-níjàánu Johanu lọ́nà àdánidá.
- source_word: λέγετε
  choice: ẹ̀yin sì ń wí pé
  rationale: Àrọ́pò orúkọ “ẹ̀yin” mú ẹni tí Jésù ń bá sọ hàn gbangba, “ń wí” sì fi ìṣe tí wọ́n máa ń ṣe tàbí tí ó ń bá a lọ hàn.
- source_word: Δαιμόνιον ἔχει
  choice: Ó ní ẹ̀mí èṣù
  rationale: Èyí tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì pé ẹni náà “ní” ẹ̀mí èṣù, láì yí i padà sí ọ̀rọ̀ míì tó túmọ̀ sí ẹ̀mí àìmọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δαιμόνιον nínú ẹ̀sùn tí wọ́n fi kan Johanu
  choice: ẹ̀mí èṣù
  alternative: ẹ̀mí àìmọ́
  rationale: δαιμόνιον tọ́ka sí ẹ̀mí èṣù níbí; “ẹ̀mí àìmọ́” jẹ́ gbólóhùn Gíríìkì mìíràn tí Lúùkù tún máa ń lò, nítorí náà a kò dapọ̀ àwọn ọ̀rọ̀ náà.
- issue: Bí a ṣe pa àwòrán Δαιμόνιον ἔχει mọ́
  choice: Ó ní ẹ̀mí èṣù
  alternative: Ẹ̀mí èṣù wọ̀ ọ́
  rationale: Àkọ́kọ́ pa ìṣètò àti líle ẹ̀sùn inú orísun mọ́; èkejì jẹ́ ọ̀nà Yorùbá tó túbọ̀ jẹ́ àdánidá, a sì fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Búrẹ́dì” àti “ọtí wáìnì” pa àwòrán ohun tí orísun mẹ́nu kàn mọ́, “Johanu Onítẹ̀bọmi” sì jẹ́ àkọlé tó yé òǹkàwé lásán.
