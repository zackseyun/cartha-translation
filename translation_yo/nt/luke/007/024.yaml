  to: Lẹ́yìn tí àwọn oníjíṣẹ́ Johanu ti lọ, ó bẹ̀rẹ̀ sí í sọ̀rọ̀ fún àwọn èrò nípa Johanu pé, “Kí ni ẹ jáde lọ sínú aginjù láti wò? Esùsú tí afẹ́fẹ́ ń mì bí?”
  rationale: 'A tún ọ̀rọ̀ méjì ṣe nìkan: ‘àwọn oníjíṣẹ́’ fún àwọn aṣojú Johanu, àti ìtòlẹ́sẹẹsẹ ‘fún àwọn èrò nípa Johanu’ láti bá ìkọ́lé Gíríìkì mu, kí Yorùbá náà sì rọrùn. Gbogbo àwòrán, ìbéèrè, àti ìdákẹ́jẹ ìtumọ̀ àfiwé nínú ìpilẹ̀ṣẹ̀ ni a pa mọ́.'
