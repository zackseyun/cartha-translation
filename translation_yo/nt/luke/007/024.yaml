id: LUK.7.24
reference: Luke 7:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: yo
  text: Lẹ́yìn tí àwọn oníjíṣẹ́ Johanu ti lọ, ó bẹ̀rẹ̀ sí í sọ̀rọ̀ fún àwọn èrò nípa Johanu pé, “Kí ni ẹ jáde lọ sínú aginjù láti wò? Esùsú tí afẹ́fẹ́ ń mì bí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Lẹ́yìn tí ... ti lọ
  rationale: Ọ̀rọ̀ aláṣepọ̀ aorist nínú genitive absolute fi àkókò hàn; èyí mú kí ó ṣe kedere pé àwọn oníṣẹ́ náà kọ́kọ́ lọ kí Jesu tó bẹ̀rẹ̀ sí í sọ̀rọ̀.
- source_word: ἀγγέλων
  choice: àwọn oníṣẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, àwọn ènìyàn tí Johanu rán ni, kì í ṣe àwọn áńgẹ́lì ọ̀run.
- source_word: Ἰωάννου
  choice: Johanu
  rationale: Orúkọ ẹni náà ni a túmọ̀ gẹ́gẹ́ bí Johanu; genitive àkọ́kọ́ fi ẹni tí ó rán wọn hàn, èkejì sì jẹ́ ‘nípa Johanu.’
- source_word: ἤρξατο λέγειν
  choice: ó bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Ìtumọ̀ yìí pa agbára ìbẹ̀rẹ̀ ọ̀rọ̀ náà mọ́, ó sì jẹ́ Yorùbá àdánidá fún ọ̀rọ̀ tí a ń bá ọ̀pọ̀ ènìyàn sọ.
- source_word: πρὸς τοὺς ὄχλους
  choice: fún àwọn èrò
  rationale: ὄχλους jẹ́ ọ̀pọ̀; ‘àwọn èrò’ tọ́ka sí àwọn àwùjọ ènìyàn tí Jesu ń bá sọ̀rọ̀.
- source_word: περὶ Ἰωάννου
  choice: nípa Johanu
  rationale: Èyí ni ìtumọ̀ àdánidá ti περί pẹ̀lú genitive nínú àyíká ọ̀rọ̀.
- source_word: Τί ἐξήλθατε
  choice: Kí ni ẹ jáde lọ
  rationale: τί béèrè ohun tí wọ́n jáde lọ láti rí, kì í ṣe ìdí tí wọ́n fi lọ ní pàtàkì.
- source_word: εἰς τὴν ἔρημον
  choice: sínú aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tí ó yẹ fún agbègbè tí ènìyàn kò pọ̀, níbi tí Johanu ti ń ṣe iṣẹ́ rẹ̀.
- source_word: θεάσασθαι
  choice: láti wò
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí rí tàbí wo ohun pẹ̀lú àkíyèsí; ‘láti wò’ jẹ́ kedere, ó sì bá ìbéèrè àfiwé náà mu.
- source_word: κάλαμον
  choice: esùsú
  rationale: Ó tọ́ka sí irú ewéko esùsú tí afẹ́fẹ́ lè mì nírọ̀rùn, tí ó sì pa àwòrán àfiwé náà mọ́.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: tí afẹ́fẹ́ ń mì
  rationale: Ó ṣàpèjúwe esùsú tí afẹ́fẹ́ ń gbé síhìn-ín sóhùn-ún; ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì pa agbára àwòrán náà mọ́.
theological_decisions:
- issue: Agbára àfiwé inú ìbéèrè nípa Johanu
  choice: 'Pa àwòrán gangan mọ́: “Esùsú tí afẹ́fẹ́ ń mì bí?”'
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ọkùnrin aláìnídìí tàbí ẹni tí ọkàn rẹ̀ ń yí padà bí?’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbé àwòrán kan kalẹ̀, ó sì fi ohun tí àwòrán náà túmọ̀ sí sílẹ̀ fún olùgbọ́ láti lóye. Kíkò ṣàlàyé àfiwé náà nínú ara ẹsẹ pa ìfojúsùn àti agbára ọ̀rọ̀ Jesu mọ́.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘àwọn oníṣẹ́’ fún àwọn aṣojú ènìyàn Johanu, ‘aginjù’ fún ἔρημος, àti ‘esùsú’ láti pa àwòrán àfiwé mọ́.
