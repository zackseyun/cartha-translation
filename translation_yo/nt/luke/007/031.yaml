id: LUK.7.31
reference: Luke 7:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: yo
  text: Nítorí náà, kí ni èmi yóò fi àwọn ènìyàn ìran yìí wé? Kí sì ni wọ́n dà bí?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι is generic here, referring to the people of the generation rather than specifically to males; “àwọn ènìyàn” is the natural inclusive Yoruba equivalent.
- source_word: τῆς γενεᾶς ταύτης
  choice: ìran yìí
  rationale: Preserves the ordinary temporal and social sense of γενεά as the contemporary generation.
- source_word: ὁμοιώσω / ὅμοιοι
  choice: fi … wé / dà bí
  rationale: Uses idiomatic Yoruba expressions while retaining the source's paired comparison language.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Marks the inferential transition explicitly and naturally.
theological_decisions:
- issue: Whether ἀνθρώπους should be rendered as specifically male
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: The Greek plural is generic in context; a male-specific Yoruba term would narrow the referent without contextual warrant.
- issue: Whether to identify the speaker explicitly
  choice: Retain the first-person form without adding a name
  alternative: Add “Jésù” as the subject
  rationale: The Greek verb itself supplies the first-person speaker, and the verse does not repeat the speaker's name.
translation_notes:
  register: Standard Yorùbá with full tone marks, using dignified but current syntax. The two rhetorical questions and their semantic parallelism are preserved.
source_grounding:
  english_pob_role: consult_only
