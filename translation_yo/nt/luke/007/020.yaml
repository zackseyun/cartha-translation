revisions:
- from: Nígbà tí àwọn ọkùnrin náà dé ọ̀dọ̀ rẹ̀, wọ́n ní, “Jòhánù Onítẹ̀bọmi rán wa sí ọ, ó ní, ‘Ṣé ìwọ ni Ẹni Tí ń Bọ̀, tàbí kí á máa retí ẹlòmíràn?’”
  to: Nígbà tí àwọn ọkùnrin náà dé ọ̀dọ̀ rẹ̀, wọ́n ní, “Jòhánù ẹni tí ń ṣe ìtẹ̀bọmi rán wa sí ọ, ó ní, ‘Ṣé ìwọ ni Ẹni tí ń Bọ̀ náà, tàbí kí a retí ẹlòmíràn?’”
  rationale: 'The revision preserves every source-level component while regularizing Yorùbá title capitalization, making John’s designation more readily intelligible, marking the definite referent with náà, and removing an unnecessary habitual nuance from the final question. No footnote is necessary: the messianic resonance is preserved in the wording without an interpretive gloss.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:38:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the men’s arrival, their male identity, John’s sending of them, and the two-part question. “Ẹni Tí ń Bọ̀” retains the messianic/eschatological force of ὁ ἐρχόμενος without prematurely identifying the figure as the Messiah. A small revision better represents the Greek definite expression and avoids adding a habitual-continuative nuance to προσδοκῶμεν.
  naturalness: The sentence is generally clear and idiomatic. In contemporary Standard Yorùbá, “Jòhánù ẹni tí ń ṣe ìtẹ̀bọmi” is more transparent than the compressed title “Jòhánù Onítẹ̀bọmi,” and “tàbí kí a retí ẹlòmíràn?” is a more direct natural equivalent than “tàbí kí á máa retí ẹlòmíràn?”
  terminology: “ìtẹ̀bọmi” appropriately renders baptism, and “Ẹni tí ń Bọ̀ náà” preserves the recognized expectational designation while using normal Yorùbá capitalization rather than English-style title capitalization.
  issues:
  - severity: low
    issue: The capitalization in “Ẹni Tí ń Bọ̀” follows English title style rather than normal Yorùbá orthography.
    rationale: Capitalizing each lexical word is not natural Standard Yorùbá usage. “Ẹni tí ń Bọ̀ náà” can retain the title-like referent through context and the capitalization of the initial noun.
  - severity: low
    issue: “máa” in “kí á máa retí” can suggest continuing or habitual expectation.
    rationale: προσδοκῶμεν asks whether they should expect another; it does not explicitly stress ongoing or habitual action. Omitting “máa” is closer and smoother.
  - severity: low
    issue: “Jòhánù Onítẹ̀bọmi” is understandable but less transparent than a descriptive rendering.
    rationale: “Jòhánù ẹni tí ń ṣe ìtẹ̀bọmi” clearly communicates ὁ βαπτιστής in current Standard Yorùbá and does not alter the designation.
  revised_text: Nígbà tí àwọn ọkùnrin náà dé ọ̀dọ̀ rẹ̀, wọ́n ní, “Jòhánù ẹni tí ń ṣe ìtẹ̀bọmi rán wa sí ọ, ó ní, ‘Ṣé ìwọ ni Ẹni tí ń Bọ̀ náà, tàbí kí a retí ẹlòmíràn?’”
  revised_footnotes: []
  revision_rationale: 'The revision preserves every source-level component while regularizing Yorùbá title capitalization, making John’s designation more readily intelligible, marking the definite referent with náà, and removing an unnecessary habitual nuance from the final question. No footnote is necessary: the messianic resonance is preserved in the wording without an interpretive gloss.'
