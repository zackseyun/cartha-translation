id: LUK.7.20
reference: Luke 7:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: yo
  text: Nígbà tí àwọn ọkùnrin náà dé ọ̀dọ̀ rẹ̀, wọ́n ní, “Jòhánù ẹni tí ń ṣe ìtẹ̀bọmi rán wa sí ọ, ó ní, ‘Ṣé ìwọ ni Ẹni tí ń Bọ̀ náà, tàbí kí a retí ẹlòmíràn?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Nígbà tí … dé ọ̀dọ̀ rẹ̀
  rationale: 'Ó fi àyíká ìṣẹ̀lẹ̀ tí aorist participle ń ṣàlàyé hàn ní Yorùbá àdánidá: wọ́n dé ibi tí ó wà kí wọ́n tó sọ̀rọ̀.'
- source_word: οἱ ἄνδρες
  choice: àwọn ọkùnrin náà
  rationale: Ó pa ìtọ́kasí pàtó sí àwọn akọ tí a rán mọ́, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Jòhánù Onítẹ̀bọmi
  rationale: Orúkọ oyè Yorùbá tí ó wọ́pọ̀, tí ó sì fi iṣẹ́ ẹni tí ń ṣe ìtẹ̀bọmi hàn.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ
  choice: rán wa sí ọ
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ríran àwọn aṣojú lọ sí ọ̀dọ̀ ẹnì kan.
- source_word: λέγων
  choice: ó ní
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ iṣẹ́ tí Jòhánù fún wọn láti sọ ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: ὁ ἐρχόμενος
  choice: Ẹni Tí ń Bọ̀
  rationale: Ó pa àwòrán ẹni tí ń bọ̀ àti agbára rẹ̀ gẹ́gẹ́ bí oyè ìretí mọ́, láì túmọ̀ rẹ̀ sí ‘Mèsáyà’ ní tààrà.
- source_word: ἄλλον προσδοκῶμεν
  choice: kí á máa retí ẹlòmíràn
  rationale: Ó mú ìbéèrè ìfọ̀nọ́hàn náà jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘retí/dúró de’ mọ́.
theological_decisions:
- issue: Agbára Mèsáyà nínú ὁ ἐρχόμενος
  choice: Ẹni Tí ń Bọ̀
  alternative: ẹni tí yóò wá
  rationale: Lílò rẹ̀ bí oyè tí a kọ ní lẹ́tà ńlá ń tọ́ka sí ìretí pàtó nínú àyíká yìí, ṣùgbọ́n kò sọ ní gbangba ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá àgbàlágba tí ó níyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìsọ̀rọ̀ tààrà àti ìtẹ̀síwájú ìtàn ni a pa mọ́.
