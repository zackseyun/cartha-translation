  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn Jòhánù sì ròyìn gbogbo nǹkan wọ̀nyí fún un. Jòhánù sì pe àwọn méjì kan lára àwọn ọmọ-ẹ̀yìn rẹ̀,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pe méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn Gíríìkì náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e; àmì kọ́má tó wà ní òpin fi hàn pé ọ̀rọ̀ náà kò tíì parí.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: ròyìn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ kí ẹnì kan mọ ohun tí ó ṣẹlẹ̀ tàbí mímú ìròyìn wá; “ròyìn” bá ọ̀rọ̀ ìtàn mu láìfi ìlànà àṣẹ kún un.
- source_word: Ἰωάννῃ
  choice: fún Jòhánù / fún un
  rationale: Dátífù náà fi ẹni tí wọ́n ròyìn fún hàn. A darúkọ Jòhánù ní ìbẹ̀rẹ̀ kí ẹni tí “àwọn ọmọ-ẹ̀yìn rẹ̀” ń tọ́ka sí lè ṣe kedere, lẹ́yìn náà a lo “fún un” lọ́nà Yorùbá àdánidá.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn Jòhánù
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθητής, ó sì pa ìbáṣepọ̀ olùkọ́ àti ẹni tí ń tẹ̀ lé e mọ́. Fífi orúkọ Jòhánù sí i yọ ìṣiyèméjì tó lè wá láti “rẹ̀” kúrò.
- source_word: περὶ πάντων τούτων
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Pẹ̀lú “ròyìn,” Yorùbá kò nílò ọ̀rọ̀ ìbáṣepọ̀ míì; gbólóhùn yìí pa ìtẹnumọ́ πάντων àti ìtọ́ka τούτων mọ́.
- source_word: προσκαλεσάμενος
  choice: pe
  rationale: Ó fi hàn pé Jòhánù pe wọ́n wá sọ́dọ̀ rẹ̀; “pe” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kò sì fi ìmúnibíni tàbí àṣẹ líle tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: δύο τινὰς
  choice: àwọn méjì kan
  rationale: “Méjì kan” pa ìtumọ̀ àìdáni-lórúkọ ti τινάς mọ́, ó sì dára ju yíyọ ọ́ kúrò pátápátá lọ.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: '“Lára” mú ipa jẹnítífù alápá hàn: ó yan méjì láti inú gbogbo ẹgbẹ́ àwọn ọmọ-ẹ̀yìn rẹ̀.'
