id: LUK.7.34
reference: Luke 7:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: yo
  text: Ọmọ Ènìyàn ti wá, ó ń jẹ, ó sì ń mu; ẹ̀yin sì ń sọ pé, “Wò ó, ọkùnrin kan tí í ṣe alájẹjù àti ọ̀mùtí, ọ̀rẹ́ àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: ti wá
  rationale: Ọ̀rọ̀-ìṣe perfect náà ń fi hàn pé ó ti wá, ìwá rẹ̀ sì ní ipa títí di àsìkò tí a ń sọ̀rọ̀; “ti wá” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ Yorùbá tí a mọ̀ dáadáa fún orúkọ oyè tí Jésù fi ń pe ara rẹ̀; ó tún pa ìṣòro àti ìtumọ̀ tó lè ní ìbáṣepọ̀ pẹ̀lú Dáníẹ́lì mọ́.
- source_word: ἐσθίων καὶ πίνων
  choice: ó ń jẹ, ó sì ń mu
  rationale: Àwọn participle yìí ṣàpèjúwe bí Ọmọ Ènìyàn ṣe wá; gbólóhùn Yorùbá yìí jẹ́ kedere, ó sì pa ìṣe méjèèjì mọ́.
- source_word: λέγετε
  choice: ẹ̀yin sì ń sọ pé
  rationale: Fọ́ọ̀mù present ní Gíríìkì jẹ́ ọ̀rọ̀ tí a darí sí ọ̀pọ̀ ènìyàn; “ń sọ” pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó mú agbára ìtọ́kasí àti ìkéde ọ̀rọ̀ Gíríìkì jáde ní Yorùbá òde òní láì lo èdè àtijọ́.
- source_word: ἄνθρωπος φάγος
  choice: ọ̀jẹun ... ni ọkùnrin yìí
  rationale: “Ọ̀jẹun” jẹ́ ẹ̀sùn pé ẹni náà máa ń jẹ àjẹjù; fífi “ọkùnrin yìí” kún un pa ἄνθρωπος mọ́ ní ọ̀nà Yorùbá tó ṣàn.
- source_word: οἰνοπότης
  choice: ọ̀mùtí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtìjú àti líle ẹ̀sùn náà mọ́; ìtumọ̀ gẹ́gẹ́ bí “ọ̀muwáìnì” wà nínú àlàyé ìsàlẹ̀.
- source_word: φίλος
  choice: ọ̀rẹ́
  rationale: Ìtumọ̀ tààrà yìí bá apposition inú ẹ̀sùn náà mu.
- source_word: τελωνῶν
  choice: àwọn agbowó-orí
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún àwọn tó ń gba owó-orí.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Ó pa àkọlé ẹ̀sìn àti àwùjọ tí àwọn alatako Jésù lò mọ́ láì tú u sí ọ̀rọ̀ mìíràn.
theological_decisions:
- issue: Ìtumọ̀ orúkọ oyè ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” pa ìrísí orúkọ oyè Kristọ́lójì àti ìbáṣepọ̀ tó ṣeé ṣe pẹ̀lú Dáníẹ́lì mọ́; yíyí i sí “Ẹni Ènìyàn” lè dín agbára oyè náà kù.
- issue: Agbára àwọn ẹ̀sùn tí wọ́n fi kan Jésù
  choice: ọ̀jẹun àti ọ̀mùtí
  alternative: ọkùnrin alájẹjù àti ọ̀muwáìnì
  rationale: Ẹsẹ̀ náà ń ròyìn ọ̀rọ̀ ìbanijẹ́ àwọn alatako, kì í ṣe ìdájọ́ tí akọ̀wé fọwọ́ sí. Àṣàyàn náà pa líle ẹ̀sùn mọ́ ní Yorùbá àdánidá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìrísí ọ̀rọ̀ ẹ̀sùn inú àsọyé tààrà mọ́.
