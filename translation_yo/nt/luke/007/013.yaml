  source_fidelity: The temporal clause, title “Olúwa,” and imperative “Má sunkún” accurately represent the Greek. However, “àánú rẹ̀ ṣe é” can be structurally/pronominally unclear in this context and is less direct than the Greek’s explicit subject, the Lord, who has compassion for her.
  naturalness: “Ó ṣàánú rẹ̀” is clear, idiomatic Standard Yoruba and directly states that the Lord had compassion on the woman. The footnote is also smoothed to avoid redundant wording.
  terminology: “Olúwa” appropriately retains κύριος as Luke’s elevated title. “Ṣàánú” naturally conveys ἐσπλαγχνίσθη without adding theological interpretation.
