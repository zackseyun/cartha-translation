id: LUK.7.13
reference: Luke 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: yo
  text: Nígbà tí Olúwa rí i, ó ṣàánú rẹ̀, ó sì sọ fún un pé, “Má sunkún.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má ké,” tàbí “Dá ẹkún dúró.” Èdè Gíríìkì náà lè túmọ̀ sí ìdènà gbogbogbò tàbí àṣẹ fún un láti dá ẹkún tí ó ń sunkún nígbà náà dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nígbà tí ... rí i
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn àsìkò yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Nínú ìtàn Lúùkù, κύριος jẹ́ orúkọ oyè fún Jésù; “Olúwa” pa ìtumọ̀ Kristọ́lójì náà mọ́ láìfi ohun míì kún un.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτῇ
  choice: àánú rẹ̀ ṣe é
  rationale: Ọ̀rọ̀ náà fi ìyọ́nú jíjinlẹ̀ tí ó dojú kọ obìnrin náà hàn. “Àánú rẹ̀ ṣe é” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìyọ́nú jíjinlẹ̀ mú un.
- source_word: εἶπεν αὐτῇ
  choice: ó sì sọ fún un
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti “ó sọ fún un,” ó sì pa ìtọ́kasí ẹni tí a bá sọ̀rọ̀ mọ́.
- source_word: Μὴ κλαῖε
  choice: Má sunkún
  rationale: κλαίω túmọ̀ sí sunkún; ìyàn yìí kò pinnu bóyá àṣẹ náà jẹ́ ìdènà gbogbogbò tàbí pé kí ó dá ẹkún tó ń sunkún dúró.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí orúkọ oyè fún Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa bí Lúùkù ṣe lo κύριος gẹ́gẹ́ bí orúkọ oyè gíga fún Jésù mọ́; “Ọ̀gá” lè sọ agbára ìtumọ̀ náà di kékeré.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “àánú rẹ̀ ṣe é” fún ọ̀rọ̀ àdánidá àti láti pa agbára ìmọ̀lára ἐσπλαγχνίσθη mọ́.
