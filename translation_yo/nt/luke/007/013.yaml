    issue: Ambiguity in “àánú rẹ̀ ṣe é”
    rationale: The possessive and object pronouns can obscure who feels compassion and who receives it. The source explicitly presents the Lord as the one moved with compassion toward the woman.
  - severity: low
    issue: Footnote wording is somewhat repetitive
    rationale: “ẹkún tó ń sunkún” repeats the same notion and can be made more natural while preserving the present-imperative ambiguity.
