id: LUK.7.26
reference: Luke 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ẹ jáde lọ wò? Wòlíì ni? Bẹ́ẹ̀ ni, mo sọ fún yín, ó sì ju wòlíì lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìbéèrè yìí ṣe ìyàtọ̀ sí ìbéèrè àfiwé tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti so ọ̀rọ̀ náà pọ̀ ní Yorùbá.
- source_word: τί
  choice: kí ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníbéèrè yìí ni ohun tí wọ́n jáde lọ láti rí, nítorí náà ‘kí ni’ ló bá a mu, kì í ṣe ‘kí ló dé’.
- source_word: ἐξήλθατε
  choice: ẹ jáde lọ
  rationale: Ó jẹ́ ìṣe àtijọ́ ní ẹni kejì ọ̀pọ̀; ‘ẹ jáde lọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ ìlọ jáde mọ́.
- source_word: ἰδεῖν
  choice: wò
  rationale: Infinitive yìí sọ ète tí wọ́n fi jáde lọ; ‘lọ wò’ jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu.
- source_word: προφήτην
  choice: Wòlíì kan
  rationale: Orúkọ àpapọ̀ ni, ó sì dúró gẹ́gẹ́ bí ìbéèrè kúkúrú; ‘kan’ mú ìbéèrè náà dún bí Yorùbá àdánidá.
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ìdáhùn ìmúdájú tó lágbára sí ìbéèrè àsọyé náà.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó tọ́ àti àdánidá fún gbólóhùn àsọyé tí Jésù sábà máa ń lò.
- source_word: καὶ περισσότερον προφήτου
  choice: ó tilẹ̀ ju wòlíì lọ
  rationale: ‘Ó tilẹ̀’ mú ìgbésẹ̀ gíga ti καὶ hàn, ‘ju wòlíì lọ’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún àfiwé περισσότερον pẹ̀lú genitive, láì ṣàfikún ohun tí ẹsẹ̀ náà kò ṣàlàyé.
theological_decisions:
- issue: Ìdánimọ̀ àti ipò Jòhánù Onítẹ̀bọmi nínú àpèjúwe Jésù
  choice: Jésù jẹ́rìí pé Jòhánù jẹ́ wòlíì, ó sì ju wòlíì lọ.
  alternative: Láti sọ ní pàtó pé Jòhánù ni wòlíì tó tóbi jù lọ tàbí pé òun gan-an ni ìránṣẹ́ ìkẹyìn tí a ti sọ tẹ́lẹ̀.
  rationale: Ẹsẹ̀ yìí kò ṣàlàyé irú ọ̀nà tí Jòhánù fi ju wòlíì lọ; ìtumọ̀ náà pa gbólóhùn kúkúrú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́, láì yanju rẹ̀ ní ipò àyíká tó tẹ̀ lé e.
translation_notes:
  register: Èdè Yorùbá tó ṣe déédéé, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A lò ‘ẹ/yín’ fún ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí Gíríìkì. Gbólóhùn ‘ó tilẹ̀ ju wòlíì lọ’ pa àfiwé náà mọ́ láì fi ẹ̀kọ́ ìtumọ̀ míì kún un. Kò sí àmì àlàyé ìsàlẹ̀ nítorí àṣàyàn Yorùbá náà lè fi àfiwé Gíríìkì hàn lọ́nà àdánidá láì nílò àṣàyàn mìíràn.
