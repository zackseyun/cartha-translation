  terminology: ‘Wòlíì’ jẹ́ ọ̀rọ̀ tó bójú mu fún προφήτης. A kò yẹ kí a sọ irú ipò gíga Jòhánù náà di mímọ̀ ju bí ẹsẹ̀ ṣe sọ lọ.
