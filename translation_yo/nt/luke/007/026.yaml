  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìbéèrè àsọtúnsọ, ìṣe ìgbàlàáyé ‘ẹ jáde lọ wò,’ ìmúdájú náà, àti àfiwé ‘ju wòlíì lọ’ mú dáadáa. Ṣùgbọ́n ‘ó tilẹ̀’ ń fi ìtẹnumọ́ ‘gẹ́gẹ́ bí ó tilẹ̀ jẹ́ pé’ kún un díẹ̀ ju καὶ (‘àti’) lọ, nígbà tí ‘Wòlíì kan bí?’ kò dá ìbéèrè elípítíkì προφήτην? hàn ní ọ̀nà tó rọrùn jù.
