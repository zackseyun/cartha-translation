id: LUK.7.28
reference: Luke 7:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: yo
  text: Mo sọ fún yín pé,[a] nínú àwọn tí obìnrin bí,[b] kò sí ẹni tí ó tóbi ju Jòhánù lọ; síbẹ̀ ẹni tí ó kéré jù lọ nínú ìjọba Ọlọ́run[c] tóbi ju Jòhánù lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀ sí i: “Mo wí fún yín.”'
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “àwọn tí obìnrin bí,” jẹ́ ọ̀nà àsọyé fún àwọn ènìyàn lápapọ̀.
    reason: cultural_note
  - marker: c
    text: 'A tún lè túmọ̀ rẹ̀ sí: “ẹni tí ó kéré jù lọ nínú ìjọba Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè gba àlàyé gbólóhùn ìbátan yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Mo sọ fún yín pé
  rationale: Ó jẹ́ ọ̀nà àsọyé tààrà tí ó bá èdè Yorùbá òde òní mu, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μείζων
  choice: tóbi ju ... lọ
  rationale: Ó pa agbára ìfiwéra mọ́ láì sọ pé irú ọlá, ipò, tàbí ìtóbi wo ni a ń tọ́ka sí.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: nínú àwọn tí obìnrin bí
  rationale: Ó jẹ́ ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀, ó sì pa àkànṣe àsọyé náà mọ́ gẹ́gẹ́ bí ọ̀nà láti tọ́ka sí ènìyàn lápapọ̀.
- source_word: Ἰωάννου
  choice: Jòhánù
  rationale: Èyí ni àkọsílẹ̀ orúkọ John tí ó ti wọ́pọ̀ nínú Yorùbá Bíbélì.
- source_word: οὐδείς ἐστιν
  choice: kò sí ẹni
  rationale: Ọ̀nà Yorùbá àdánidá fún gbólóhùn àìsí ẹni kankan ni.
- source_word: ὁ δὲ μικρότερος
  choice: síbẹ̀ ẹni tí ó kéré jù lọ
  rationale: Ó mú ìtakora δέ jáde, ó sì tú àpólà aláìlórúkọ Gíríìkì sí ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: nínú ìjọba Ọlọ́run
  rationale: Ó pa ìtumọ̀ ibi tàbí ààyè ἐν àti ọ̀rọ̀ Bíbélì tí ó mọ́ọ̀mọ́ wọ́pọ̀ mọ́.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: tóbi ju òun lọ
  rationale: Ó jẹ́ ìfiwéra Yorùbá tí ó ṣe kedere, tí ó sì fi αὐτοῦ tọ́ka padà sí Jòhánù láì ṣàlàyé ìdí ìtóbi náà.
theological_decisions:
- issue: Ìtumọ̀ ìfiwéra láàárín Jòhánù àti ẹni tí ó kéré jù lọ nínú ìjọba Ọlọ́run
  choice: A pa ìfiwéra alárinrin náà mọ́ láì ṣàlàyé ohun tí ‘tóbi’ dúró fún.
  alternative: A lè túmọ̀ rẹ̀ sí pé ẹni tí ó kéré jù lọ nínú ìjọba ní àǹfààní májẹ̀mú, ipò ẹ̀mí, tàbí ọlá tí ó ju ti Jòhánù lọ.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìpìlẹ̀ ìfiwéra náà; nítorí náà, a kò gbọ́dọ̀ fi ẹ̀kọ́ ẹ̀sìn kan tàbí ìtumọ̀ pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àkànṣe àsọyé ‘àwọn tí obìnrin bí’ mọ́, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
