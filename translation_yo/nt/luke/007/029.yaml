  to: Nígbà tí gbogbo àwọn ènìyàn, títí kan àwọn agbowó-orí, gbọ́ èyí, wọ́n jẹ́wọ́ pé Ọlọ́run ni ó tọ́,[a] lẹ́yìn tí wọ́n ti gba ìbatisí Jòhánù.[b]
