id: LUK.7.29
reference: Luke 7:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: yo
  text: Nígbà tí gbogbo àwọn ènìyàn, títí kan àwọn agbowó-orí, gbọ́ èyí, wọ́n jẹ́wọ́ pé Ọlọ́run ni ó tọ́,[a] lẹ́yìn tí wọ́n ti gba ìbatisí Jòhánù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó tẹ̀ lé ọ̀rọ̀ Greek pẹ́kípẹ́kí: “wọ́n dá Ọlọ́run láre.” Ìtumọ̀ rẹ̀ ni pé wọ́n jẹ́wọ́ pé Ọlọ́run ni ó tọ́.'
    reason: lexical_alternative
  - marker: b
    text: 'Ó tún ṣeé ṣe láti lóye gbólóhùn yìí gẹ́gẹ́ bí okùnfà: “nítorí pé wọ́n ti gba ìbatisí Jòhánù.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: gbogbo àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ àkójọpọ̀ tí ó ní ìtumọ̀ gbígbòòrò; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìwọ̀n ‘gbogbo’ mọ́.
- source_word: ἀκούσας
  choice: Nígbà tí ... gbọ́ èyí
  rationale: A tú participle aorist náà gẹ́gẹ́ bí gbólóhùn àkókò; ‘èyí’ ń tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ọ̀rọ̀.
- source_word: καὶ οἱ τελῶναι
  choice: títí kan àwọn agbowó-orí
  rationale: Èyí fi hàn pé àwọn agbowó-orí wà lára gbogbo àwọn ènìyàn tí a mẹ́nu kàn, láìfi ìtẹnumọ́ tí Greek kò béèrè kún un.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: wọ́n jẹ́wọ́ pé Ọlọ́run wà ní ẹ̀tọ́
  rationale: δικαιόω níbí túmọ̀ sí pé wọ́n mọ̀, wọ́n sì fìdí rẹ̀ múlẹ̀ pé Ọlọ́run jẹ́ ẹni tí ó tọ́; kò túmọ̀ sí pé àwọn ènìyàn sọ Ọlọ́run di olódodo.
- source_word: βαπτισθέντες
  choice: wọ́n sì ti gba ìbatisí
  rationale: Ìsọ̀rọ̀ yìí sọ ipò tàbí ohun tó ti ṣẹlẹ̀ sí wọn, láìsọ ní pàtó pé ó jẹ́ ìdí tí wọ́n fi jẹ́wọ́ Ọlọ́run.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: ìbatisí Jòhánù
  rationale: Ìtumọ̀ kúkúrú, àdánidá ni èyí fún cognate construction náà, ó sì ṣe kedere pé ìbatisí tí Jòhánù ń ṣe ni.
theological_decisions:
- issue: Ìtumọ̀ ‘ἐδικαίωσαν τὸν θεόν’
  choice: Wọ́n jẹ́wọ́ pé Ọlọ́run wà ní ẹ̀tọ́.
  alternative: Wọ́n dá Ọlọ́run láre.
  rationale: Àṣàyàn pàtàkì yìí yẹra fún èrò pé ènìyàn lè sọ Ọlọ́run di olódodo, ṣùgbọ́n ó pa àwọ̀ ìdájọ́ inú ọ̀rọ̀ Greek mọ́.
- issue: Agbára participle ‘βαπτισθέντες’
  choice: A sọ ọ́ gẹ́gẹ́ bí ipò tàbí ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ sí wọn, láìsọ ìbáṣepọ̀ náà di ti okùnfà.
  alternative: Nítorí pé wọ́n ti gba ìbatisí Jòhánù.
  rationale: Àyíká lè jẹ́ kí participle náà ní ìtumọ̀ okùnfà, ṣùgbọ́n fọ́ọ̀mù Greek fúnra rẹ̀ kò fi dandan mú ìtumọ̀ yẹn; nítorí náà, a pa àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Agbowó-orí’ àti ‘ìbatisí’ jẹ́ ọ̀rọ̀ tó yé àwọn òǹkàwé lónìí. Ìṣètò gbólóhùn náà jẹ́ ti ẹ̀dá Yorùbá, ó sì pa àìdánilójú ìbáṣepọ̀ participle ìkẹyìn mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ìwé.
