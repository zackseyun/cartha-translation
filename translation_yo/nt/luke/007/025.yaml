language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ẹ̀yin jáde lọ wò? Ọkùnrin kan tí ó wọ aṣọ rírọ̀ bí? Ẹ wò ó, àwọn tí wọ́n wọ aṣọ ológo[a], tí wọ́n sì ń gbé nínú ìgbádùn, inú àwọn ààfin ọba[b] ni wọ́n wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ olówó iyebíye.” Ọ̀rọ̀ náà ń tọ́ka sí aṣọ alárẹwà, tí ó rọ̀, tí ó sì bá ìgbádùn mu; kì í ṣe ìdájọ́ nípa ìwà ẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àgbàlá àwọn ọba.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibùgbé ọba tàbí àyíká ilé ẹjọ́ ọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó ń tẹ̀ síwájú nínú àwọn ìbéèrè àsọyé Jésù, ó sì fi ìyàtọ̀ hàn sí ohun tí ó ṣáájú.
- source_word: ἐξήλθατε ἰδεῖν
  choice: ẹ̀yin jáde lọ wò
  rationale: Ó fi ìṣe tí wọ́n ṣe nígbà àtijọ́ àti ète jíjáde náà hàn ní Yorùbá àdánidá.
- source_word: ἄνθρωπον
  choice: Ọkùnrin kan
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ọkùnrin kan pàtó nínú ìbéèrè àsọyé náà.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: tí ó wọ aṣọ rírọ̀
  rationale: Ó pa àwòrán aṣọ tí ó rọ̀, tí ó sì jẹ́ ti ìgbádùn mọ́ láìsọ ọ́ di àbùkù ìwà.
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ ìpe àfiyèsí ni, tí ó bá èdè Yorùbá òde òní mu.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: wọ aṣọ olówó iyebíye
  rationale: Ó sọ ọlá, ẹwà àti ọ̀pọ̀lọpọ̀ iye aṣọ náà di mímọ̀ ní ọ̀nà tí òǹkàwé Yorùbá lè lóye ní kánkán.
- source_word: τρυφῇ
  choice: ń gbé nínú adùn
  rationale: Ó túmọ̀ sí ìgbé ayé adùn àti ìgbádùn, kì í ṣe ohun ìní olówó nìkan.
- source_word: ἐν τοῖς βασιλείοις
  choice: inú ààfin àwọn ọba
  rationale: Ó tọ́ka sí ibùgbé tàbí àyíká ilé ọba; ọ̀pọ̀ nínú Gíríìkì ni a fi “àwọn ọba” hàn ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ μαλακοῖς ní àyíká ọ̀rọ̀
  choice: Aṣọ rírọ̀ tí ó bá ìgbádùn mu
  alternative: Aṣọ aláìlágbára tàbí aṣọ tí a fi ń ṣàpèjúwe ìwà ọkùnrin
  rationale: Ìtọ́kasí aṣọ olówó iyebíye, ìgbé ayé adùn àti ààfin ọba fi hàn pé ìyàtọ̀ ti ipò ìgbé ayé ni Jésù ń ṣe, kì í ṣe ìdájọ́ nípa ìwà tàbí akọ-n-bábo.
- issue: Ìtumọ̀ βασιλείοις
  choice: ààfin àwọn ọba
  alternative: àgbàlá àwọn ọba
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ibùgbé ọba tàbí àyíká ilé ẹjọ́ ọba; “ààfin àwọn ọba” jẹ́ kedere, ó sì pa ìtumọ̀ ibùgbé ọba mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ̀yin” nítorí ọ̀pọ̀ ẹni tí fáàbù Gíríìkì tọ́ka sí, àti “Ẹ wò ó” gẹ́gẹ́ bí ìpe àfiyèsí àdánidá.
