  to: Ṣùgbọ́n kí ni ẹ̀yin jáde lọ wò? Ọkùnrin kan tí ó wọ aṣọ rírọ̀ bí? Ẹ wò ó, àwọn tí wọ́n wọ aṣọ ológo[a], tí wọ́n sì ń gbé nínú ìgbádùn, inú àwọn ààfin ọba[b] ni wọ́n wà.
