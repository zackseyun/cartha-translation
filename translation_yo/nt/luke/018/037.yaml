source:
  edition: SBLGNT
  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Jésù ará Násárétì ń kọjá lọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: wọ́n sọ fún un
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjíṣẹ́ ìròyìn tàbí sísọ ohun kan fún ẹnì kan; ní ibi yìí, gbólóhùn Yorùbá yìí bá ìdáhùn ìjíròrò mu, ó sì ṣe àfihàn ohun tí a sọ fún ọkùnrin náà.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù náà ni a fi ọ̀nà àdánidá hàn nínú Yorùbá gẹ́gẹ́ bí ẹni tí wọ́n sọ ìròyìn náà fún.
- source_word: ὅτι
  choice: pé
  rationale: Pé ń ṣàgbékalẹ̀ ọ̀rọ̀ tí wọ́n ròyìn ní ọ̀nà àdánidá nínú Yorùbá, láìyí àkóónú rẹ̀ padà.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí a mọ̀ sí ìkọ orúkọ Ἰησοῦς ní Yorùbá.
- source_word: ὁ Ναζωραῖος
  choice: ará Násárẹ́tì
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti tọ́ka sí ẹni tí ìlú Násárẹ́tì dá mọ̀; ó pa ìtumọ̀ ìdánimọ̀ àgbègbè ti Ναζωραῖος mọ́ láìfi ẹ̀kọ́ ìsìn kún un.
- source_word: παρέρχεται
  choice: ń kọjá lọ
  rationale: Fọ́ọ̀mù àsìkò ìsinsìnyí náà ń fi ìṣe tí ó ń lọ lọ́wọ́ hàn bí Jésù ṣe ń kọjá níbi náà.
theological_decisions:
- issue: Ìtumọ̀ àmì ìdánimọ̀ Jésù, Ναζωραῖος
  choice: ará Násárẹ́tì
  alternative: Násárẹ́nì
  rationale: Àmì yìí jẹ́ ìdánimọ̀ tí ó ní í ṣe pẹ̀lú Násárẹ́tì. “Ará Násárẹ́tì” ṣe kedere, ó sì jẹ́ Yorùbá àdánidá; a kò mú un gẹ́gẹ́ bí oyè ẹ̀kọ́ ìgbàgbọ́ tàbí fi ìtumọ̀ míì kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá.
