translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ṣagbe’ dípò gbólóhùn gígùn bí ‘béèrè fún ọrẹ àánú,’ nítorí ó ṣe kedere sí òǹkàwé gbogbo. A gbé àmì àlàyé [b] mọ́ ‘afọ́jú kan,’ ibi tí ọ̀rọ̀ Gíríìkì τις ti kan ní tààrà.
