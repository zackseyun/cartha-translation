  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: yo
  text: Bí ó ti ń sún mọ́ Jẹ́ríkò[a], afọ́jú kan[b] ń jókòó lẹ́gbẹ̀ẹ́ ọ̀nà, ó sì ń ṣagbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí ó ń sún mọ́ Jẹ́ríkò.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì τις lè kan túmọ̀ sí “kan” nìkan, ṣùgbọ́n ó ní ìtọ́ka díẹ̀ sí ẹni kan pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: A kò fi ọ̀rọ̀ ọ̀tọ̀ túmọ̀ rẹ̀
  rationale: Níhìn-ín, gbólóhùn náà jẹ́ ọ̀nà ìṣípayá ìṣẹ̀lẹ̀ nínú ìtàn ju pé ó ń sọ pé ‘ó ṣẹlẹ̀’ lọ. Ìbẹ̀rẹ̀ ‘Bí ó ti…’ mú ìyípadà ìtàn náà wọ èdè Yorùbá àdánidá láì fi ọ̀rọ̀ àṣejù kún un.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν
  choice: Bí ó ti ń sún mọ́
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì náà fi hàn pé àwọn ìṣe méjèèjì ń lọ ní àkókò kan náà; ‘ń sún mọ́’ tún pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: εἰς Ἰεριχὼ
  choice: Jẹ́ríkò
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘sún mọ́,’ orúkọ ìlú náà nìkan ló yẹ ní Yorùbá, nítorí ‘mọ́’ ti fi ìtọ́sọ́nà sí ibi náà hàn.
- source_word: τυφλός τις
  choice: afọ́jú kan
  rationale: ‘Afọ́jú kan’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí a kò tíì dá mọ̀, ó sì ń pa agbára àìdánimọ̀ àti ìtọ́ka díẹ̀ tí τις ní mọ́.
- source_word: ἐκάθητο
  choice: jókòó
  rationale: Àyíká gbólóhùn àti ‘ó ń ṣagbe’ gbé ìṣe tí ó ń bá a lọ jáde; ‘jókòó’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu fún àwòrán ìṣẹ̀lẹ̀ náà.
- source_word: παρὰ τὴν ὁδὸν
  choice: lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: Ó túmọ̀ ipò ẹni náà ní ẹ̀gbẹ́ ọ̀nà, kì í ṣe lórí ọ̀nà tàbí ní ibi jíjìnnà sí i.
- source_word: ἐπαιτῶν
  choice: ó ń ṣagbe
  rationale: Èyí sọ ìṣe rẹ̀ gẹ́gẹ́ bí alágbe ní èdè Yorùbá òde òní, ó sì pa ìṣe tí ó ń lọ nígbà náà mọ́.
