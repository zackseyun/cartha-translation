id: LUK.18.14
reference: Luke 18:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: yo
  text: 'Mo sọ fún yín pé, ọkùnrin yìí ni ó sọ̀kalẹ̀ lọ sí ilé rẹ̀ gẹ́gẹ́ bí ẹni tí a ti dá láre ju ẹni yẹn lọ[a]. Nítorí gbogbo ẹni tí ń gbé ara rẹ̀ ga ni a ó rẹ̀ sílẹ̀, ṣùgbọ́n ẹni tí ń rẹ ara rẹ̀ sílẹ̀ ni a ó gbé ga.


    [a] Tàbí, “gẹ́gẹ́ bí ẹni tí a ti dá láre ní ìfiwéra pẹ̀lú ẹni yẹn.” Gbólóhùn náà fi ọkùnrin yìí wé olùjọ́sìn kejì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ẹni tí a ti dá láre ní ìfiwéra pẹ̀lú ẹni yẹn.” Gbólóhùn náà fi ọkùnrin yìí wé olùjọ́sìn kejì.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: gẹ́gẹ́ bí ẹni tí a ti dá láre
  rationale: Ó pa ìtumọ̀ ìdájọ́ ojú rere Ọlọ́run àti àbájáde tí ó ń bá a lọ mọ́, láìfi gbogbo ètò ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ yìí lórí.
- source_word: παρ’ ἐκεῖνον
  choice: dípò ẹni yẹn
  rationale: Ó sọ ìyàtọ̀ láàárín agbowó-orí àti Farisí náà ní Yorùbá tí ó ṣe kedere; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìfiwéra tí ó tún ṣeé ṣe hàn.
- source_word: κατέβη
  choice: sọ̀kalẹ̀ lọ
  rationale: Ó pa àwòrán ìrìn láti ibi gíga tẹ́ńpìlì sọ̀kalẹ̀ mọ́ dípò ṣíṣe e ní ‘padà lọ’ lásán.
- source_word: οἶκον αὐτοῦ
  choice: ilé rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: gbogbo ẹni tí ń gbé ara rẹ̀ ga
  rationale: Ó fi òfin gbogbogbò àti agbára ọ̀rọ̀ arọ́pò-orúkọ ara ẹni hàn ní ọ̀nà àdánidá.
- source_word: ταπεινωθήσεται
  choice: a ó rẹ̀ sílẹ̀
  rationale: Ìkọ̀wé aláìdárúkọ olùṣe yìí pa ohùn àìṣe Gíríìkì mọ́, kò sì sọ ẹni tó ṣe é ní gbangba.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: ṣùgbọ́n ẹni tí ń rẹ ara rẹ̀ sílẹ̀
  rationale: Ó pa ìtakora àti ìṣọ̀kan ìgbékalẹ̀ pẹ̀lú abala àkọ́kọ́ mọ́.
- source_word: ὑψωθήσεται
  choice: a ó gbé ga
  rationale: Ó bá ‘gbé ara rẹ̀ ga’ mu, ó sì pa ohùn àìṣe àti ìyípadà ipò inú ọ̀rọ̀ Jesu mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi hàn pé òwe tó tẹ̀ lé e ni ìdí fún ìdájọ́ tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí agbowó-orí náà ní kedere, ó sì fi í ṣe ìyàtọ̀ sí Farisí náà.
theological_decisions:
- issue: Ìtumọ̀ δικαιόω ní ìparí àkàwé náà
  choice: ìdájọ́ ojú rere Ọlọ́run, ‘ẹni tí a ti dá láre’
  alternative: ìfìdí ẹ̀tọ́ ẹni múlẹ̀ ní ọ̀nà gbogbogbò
  rationale: Àyíká ọ̀rọ̀ náà fi Farisí tó gbẹ́kẹ̀ lé òdodo ara rẹ̀ wé agbowó-orí tó bẹ Ọlọ́run fún àánú. Ọ̀rọ̀ yìí pa ìwúwo ìdájọ́ ojú rere Ọlọ́run mọ́ láìṣe àfikún ètò ẹ̀kọ́ ìgbàgbọ́ kan sí ẹsẹ náà.
- issue: Olùṣe tí a kò dárúkọ nínú ταπεινωθήσεται àti ὑψωθήσεται
  choice: lo ‘a ó ...’ láìdárúkọ Ọlọ́run ní tààrà
  alternative: sọ ní gbangba pé Ọlọ́run ni yóò rẹ̀ ẹni sílẹ̀ tàbí gbé e ga
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe, ṣùgbọ́n Gíríìkì fi olùṣe sílẹ̀ láìdárúkọ; ìtumọ̀ náà pa ìfipamọ́ yìí mọ́.
- issue: Ìbáṣepọ̀ tí παρ’ ἐκεῖνον ń sọ
  choice: ìyàtọ̀, ‘dípò ẹni yẹn,’ pẹ̀lú àlàyé ìfiwéra ní ìsàlẹ̀
  alternative: ‘ní ìfiwéra pẹ̀lú ẹni yẹn’ tàbí ‘ju ẹni yẹn lọ’
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ ti ìyàtọ̀ tàbí ìfiwéra. Ọ̀rọ̀ inú ẹsẹ mú ìyàtọ̀ àwọn olùjọ́sìn méjèèjì hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì, ó ṣe kedere fún òǹkàwé lasán, ó sì pa àwòrán ‘sọ̀kalẹ̀,’ ìtakora àwọn ọkùnrin méjì, àti ìṣọ̀kan ‘gbé ga/rẹ̀ sílẹ̀’ mọ́.
