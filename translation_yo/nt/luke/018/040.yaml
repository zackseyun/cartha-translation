  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: yo
  text: Jésù sì dúró, ó sì pàṣẹ pé kí wọ́n mú ọkùnrin náà wá sọ́dọ̀ òun.[a] Nígbà tí ó sún mọ́ ọn, Jésù bi í pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “kí wọ́n darí rẹ̀ wá sọ́dọ̀ òun.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ènìyàn wá tàbí dídarí rẹ̀ wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: dúró
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist passive ti ἵστημι tí a lò ní ìtumọ̀ intransitive; “dúró” ní Yorùbá àdánidá fi hàn pé Jésù dá ìrìn rẹ̀ dúró.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò ní ìtakora líle; “Nígbà náà ni” so iṣẹlẹ̀ yìí mọ́ ohun tó ṣáájú rẹ̀ lọ́nà àdánidá.
- source_word: ἐκέλευσεν
  choice: pàṣẹ
  rationale: κελεύω túmọ̀ sí fífi àṣẹ; “pàṣẹ” pa agbára ọ̀rọ̀ orísun mọ́ nínú Yorùbá òde òní.
- source_word: ἀχθῆναι
  choice: kí wọ́n mú ... wá
  rationale: Infinitive passive ti ἄγω lè túmọ̀ sí kí a mú un tàbí darí rẹ̀ wá; ìṣètò Yorùbá yìí jẹ́ àdánidá, ó sì pa passive tí a kò dárúkọ olùṣe rẹ̀ mọ́.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ òun
  rationale: πρός pẹ̀lú accusative tọ́ka sí ìlọ sí ọ̀dọ̀ Jésù; “sọ́dọ̀ òun” tún mú kí ẹni tí pronoun náà ń tọ́ka sí ṣe kedere.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Nígbà tí ó sún mọ́ ọn
  rationale: Genitive absolute náà ní ìtumọ̀ àsìkò; ẹni tí ó sún mọ́ Jésù ni ọkùnrin afọ́jú tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐπηρώτησεν
  choice: bi í pé
  rationale: ἐπερωτάω túmọ̀ sí béèrè; “bi í pé” jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ ìbéèrè tó ń tẹ̀ lé.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ Jésù tí ó wọ́pọ̀ nínú Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A tún sọ “Jésù” ní apá kejì láti yẹra fún àìdánilójú pronoun méjì nínú Yorùbá. Àmì ẹsẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó kan ἀχθῆναι.
