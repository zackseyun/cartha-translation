  source_fidelity: Ìtumọ̀ náà pa ètò ìṣẹ̀lẹ̀, ìpànìyàn, àti àkókò ‘ní ọjọ́ kẹta’ mọ́. Síbẹ̀, ‘nà án’ nìkan lè túmọ̀ sí lílu lásán, nígbà tí μαστιγώσαντες tọ́ka ní pàtó sí fífi pàṣán nà. Àmì ọjọ́ iwájú náà tún yẹ kí ó hàn nínú gbólóhùn abẹ́lẹ̀ náà pẹ̀lú ‘bá ti’.
  naturalness: 'Àtúnṣe náà lo Yorùbá boṣewa tí ó ṣàn dáadáa: ‘Lẹ́yìn tí wọ́n bá ti fi pàṣán nà án’ sọ ìṣe tí yóò ṣáájú ìpànìyàn, ‘wọ́n’ ní àmì ohùn tó tọ́, ‘yóò sì jí dìde’ sì jẹ́ ìlò àdánidá.'
  terminology: ‘Fi pàṣán nà’ jẹ́ ìtumọ̀ tó péye fún ìfìyàjẹni tí μάστιξ/μαστιγόω ń tọ́ka sí. ‘Pa á’ jẹ́ ìtumọ̀ tààrà fún ἀποκτενοῦσιν. ‘Jí dìde’ pa ìtumọ̀ intransitive ti ἀναστήσεται mọ́; àkọsílẹ̀ ṣàfihàn aṣàyàn passive láìfẹ́sùn ìtumọ̀ kan.
