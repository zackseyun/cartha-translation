source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n bá ti fi pàṣán nà án, wọ́n yóò pa á; ní ọjọ́ kẹta, yóò sì jí dìde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó jí i dìde.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tààrà pé, “yóò jí dìde.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: Lẹ́yìn tí wọ́n bá nà án
  rationale: Aorist participle náà ṣàfihàn ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì. ‘Nà án’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì fi ìwà ìkà ìjìyà náà hàn láìlo ọ̀rọ̀ àtijọ́ tàbí àlàyé tí Gíríìkì kò sọ.
- source_word: ἀποκτενοῦσιν
  choice: wọn yóò pa á
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú, ẹnìkẹta ọ̀pọ̀, ni; ‘pa á’ ni ìtumọ̀ tó ṣe tààrà, láìfi ìdájọ́ ìwà bí ‘pànìyàn’ kún un.
- source_word: αὐτόν
  choice: án / á
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Jésù; ìrísí ‘án’ lẹ́yìn ‘nà’ àti ‘á’ lẹ́yìn ‘pa’ ni ìlò Yorùbá tó bá àyíká ohùn mu.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: ní ọjọ́ kẹta
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àkókò náà, ó sì pa ìtọ́ka sí ọjọ́ kẹta mọ́ láìfikún ìtumọ̀ míì.
- source_word: ἀναστήσεται
  choice: yóò jí dìde
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ future middle tí a lè lò gẹ́gẹ́ bí intransitive; ‘jí dìde’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún dídìde kúrò nínú ikú, ó sì tẹ̀lé ìrísí Gíríìkì pé òun fúnra rẹ̀ yóò dìde.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àjíǹde
  choice: yóò jí dìde
  alternative: a ó jí i dìde
  rationale: Future middle ni Gíríìkì, kì í ṣe passive ní tààrà. ‘Yóò jí dìde’ pa ìrísí orísun mọ́; ‘a ó jí i dìde’ jẹ́ òtítọ́ tí àwọn ẹsẹ Bíbélì mìíràn sọ, ṣùgbọ́n ó fi aṣojú ìṣe kan hàn gbangba ju bí ẹsẹ yìí ṣe sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbo. A lo ‘jí dìde’ dípò passive láti pa ìrísí àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
