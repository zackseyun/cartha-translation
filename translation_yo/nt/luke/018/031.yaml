  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ àkọ́kọ́ Gíríìkì dáadáa: Jésù mú àwọn Méjìlá náà sí ẹ̀gbẹ́ kan, ó kìlọ̀ pé wọ́n ń gòkè lọ sí Jerúsálẹ́mù, àti pé gbogbo ohun tí a ti kọ yóò dé ìmúṣẹ ní ìbáṣepọ̀ pẹ̀lú Ọmọ Ènìyàn. Síbẹ̀, ‘tí àwọn wòlíì ti kọ’ ń sọ àwọn wòlíì di akọ̀wé ní tààràtà, níbi tí διὰ τῶν προφητῶν fi wọ́n hàn gẹ́gẹ́ bí ọ̀nà/olùlàjà. ‘Yóò ní ìmúṣẹ’ sì tú τελεσθήσεται hàn kedere ju ‘yóò ṣẹ’ lọ.'
