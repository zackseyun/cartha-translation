id: LUK.18.31
reference: Luke 18:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: yo
  text: Lẹ́yìn náà, ó mú àwọn méjìlá náà lọ sí ẹ̀gbẹ́ kan, ó sì sọ fún wọn pé, “Ẹ wò ó, à ń gòkè lọ sí Jerúsálẹ́mù, gbogbo ohun tí a ti kọ nípasẹ̀ àwọn wòlíì nípa Ọmọ Ènìyàn[a] yóò sì ní ìmúṣẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí a ti kọ nípasẹ̀ àwọn wòlíì fún Ọmọ Ènìyàn.” A lè tú ìṣètò ọ̀rọ̀ Gíríìkì náà bẹ́ẹ̀ ní tààràtà, ṣùgbọ́n ó ṣeé ṣe jù pé ó túmọ̀ sí ohun tí àwọn wòlíì kọ nípa rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: ó mú ... lọ sí ẹ̀gbẹ́ kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú àwọn méjìlá náà pẹ̀lú rẹ̀; nínú àyíká ọ̀rọ̀ yìí, gbólóhùn Yorùbá yìí fi hàn pé ó yà wọ́n sọ́tọ̀ fún ìkọ́ni àdáni láì sọ ju ohun tí àyíká ọ̀rọ̀ gbà lọ.
- source_word: τοὺς δώδεκα
  choice: àwọn méjìlá náà
  rationale: Ó pa orúkọ tí a fi mọ ẹgbẹ́ inú ti Jésù mọ́, láì fi “ọmọ-ẹ̀yìn” kún ohun tí Gíríìkì kò sọ.
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Àṣẹ yìí ń pe àfiyèsí àwọn olùgbọ́ sí ohun pàtàkì tí ó fẹ́ sọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bójú mu.
- source_word: ἀναβαίνομεν
  choice: à ń gòkè lọ
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ àti ìtumọ̀ gígòkè sí Jerúsálẹ́mù mọ́.
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ìkọ̀wé orúkọ ìlú náà tí ó wọ́pọ̀, pẹ̀lú àmì ohùn Yorùbá.
- source_word: τελεσθήσεται
  choice: yóò ṣẹ
  rationale: Nínú ọ̀rọ̀ àsọtẹ́lẹ̀, “ṣẹ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí a kọ yóò dé ìmúṣẹ rẹ̀.
- source_word: πάντα τὰ γεγραμμένα
  choice: gbogbo ohun tí ... ti kọ
  rationale: Ó pa ìtumọ̀ gbogbo rẹ̀ àti ipò pé a ti kọ ọ́ sílẹ̀ mọ́ nínú Yorùbá tí ó rọrùn.
- source_word: διὰ τῶν προφητῶν
  choice: tí àwọn wòlíì ti kọ
  rationale: Ìhun yìí jẹ́ àdánidá ní Yorùbá, ó sì fi àwọn wòlíì hàn gẹ́gẹ́ bí àwọn tí a tipasẹ̀ wọn kọ ọ̀rọ̀ náà, bó tilẹ̀ jẹ́ pé Yorùbá kò tún ìhun Gíríìkì ṣe ní tààràtà.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: nípa Ọmọ Ènìyàn
  rationale: Dátífù Gíríìkì lè túmọ̀ sí “fún,” ṣùgbọ́n nínú ìhun yìí ó ṣeé ṣe jù pé ó ń tọ́ka sí ohun tí a kọ nípa rẹ̀; àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ oyè Kristi náà, ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” pa ọ̀rọ̀ oyè náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì mọ́, láì sọ ọ́ di ọ̀rọ̀ gbogbogbò tàbí yanju ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀.
- issue: Ìtumọ̀ dátífù τῷ υἱῷ τοῦ ἀνθρώπου
  choice: nípa Ọmọ Ènìyàn
  alternative: fún Ọmọ Ènìyàn
  rationale: “Nípa” bá ìtumọ̀ ohun tí àwọn wòlíì kọ nípa rẹ̀ mu dáadáa nínú àyíká ọ̀rọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “fún” tí ìhun Gíríìkì lè gbà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tí ó níyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “Ẹ wò ó” gẹ́gẹ́ bí ọ̀rọ̀ ìpe àfiyèsí. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí àlàyé náà ń ṣàlàyé.
