  source_fidelity: Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ àti àwọn àṣẹ Gíríìkì náà jáde dáadáa. Síbẹ̀, “owó rẹ̀” fi ohun tí a ó pín di owó ní kedere, nígbà tí Gíríìkì kò sọ ohun náà ní kedere; ó jẹ́ ohun tí a lè lóye láti inú àṣẹ pé kí ó ta ohun-ìní rẹ̀, ṣùgbọ́n a kò gbọ́dọ̀ sọ ọ́ di ọ̀rọ̀ pàtó nínú ìtumọ̀.
  naturalness: Yorùbá náà rọrùn láti kà. “Wá, kí o máa tọ̀ mí lẹ́yìn” jẹ́ àdánidá, ṣùgbọ́n “lẹ́yìn náà” ṣàfikún ìtọ́kasí àsìkò tí δεῦρο καὶ kò sọ ní pàtó. A tún lè lo ìpè taara, “wá, tọ̀ mí lẹ́yìn,” láì sọ agbára present imperative di ìtumọ̀ tí ó ju bó ṣe yẹ lọ.
