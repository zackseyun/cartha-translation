  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: yo
  text: Nígbà tí Jésù gbọ́ èyí, ó sọ fún un pé, “Ohun kan ṣì kù fún ọ:[a] ta gbogbo ohun tí o ní, kí o sì pín fún àwọn òtòṣì; ìwọ yóò sì ní ìṣúra ní ọ̀run.[b] Wá, tọ̀ mí lẹ́yìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun kan ni o ṣì ṣaláìní.” Gíríìkì sọ ní ti gidi pé, “Ohun kan ṣì kù fún ọ.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, ọ̀rọ̀ náà wà ní ọ̀pọ̀: “ní àwọn ọ̀run”; ṣùgbọ́n “ní ọ̀run” ni Yorùbá àdánidá máa ń lò ní àyíká yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Nígbà tí Jésù gbọ́ èyí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò Yorùbá tó ṣe àfihàn bí ìṣẹ̀lẹ̀ náà ṣe tẹ̀ lé ọ̀rọ̀ tó ṣáájú.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Ohun kan ṣì kù fún ọ
  rationale: Èyí pa ‘ohun kan’ mọ́ gẹ́gẹ́ bí subject, ó sì mú ìtumọ̀ λείπει (‘kù’ tàbí ‘ṣaláìsí’) jáde ní Yorùbá àdánidá.
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: ta gbogbo ohun tí o ní
  rationale: Ó pa agbára àṣẹ àti ìkúnrẹ́rẹ́ πάντα ὅσα mọ́ láì lo ọ̀rọ̀ líle tàbí àjèjì.
- source_word: διάδος πτωχοῖς
  choice: pín owó rẹ̀ fún àwọn òtòṣì
  rationale: διαδίδωμι túmọ̀ sí pín tàbí pín ká; ‘owó rẹ̀’ tọ́ka sí èrè ohun tí a tà ní ọ̀nà tó ṣe kedere ní Yorùbá, láì sọ pé gbogbo rẹ̀ jẹ́ owó láti ìbẹ̀rẹ̀.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: ìwọ yóò sì ní ìṣúra ní ọ̀run
  rationale: ‘Ìṣúra’ bá θησαυρός mu, ‘ọ̀run’ sì jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ibi ọ̀run bó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni οὐρανοῖς nínú Gíríìkì.
- source_word: δεῦρο ἀκολούθει μοι
  choice: lẹ́yìn náà, wá, kí o máa tọ̀ mí lẹ́yìn
  rationale: ‘Wá’ mú δεῦρο jáde, ‘kí o máa tọ̀ mí lẹ́yìn’ sì fi ìṣe tó ń bá a lọ nínú present imperative ἀκολούθει hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìkọ̀sílẹ̀ ohun-ìní àti jíjẹ́ ọmọ-ẹ̀yìn
  choice: A pa á mọ́ gẹ́gẹ́ bí àṣẹ gidi tí Jésù fún ọkùnrin yìí, tí ó sì parí sí ìpè láti tọ̀ ọ́ lẹ́yìn.
  alternative: Kí a sọ ọ́ di òfin gbogbo ayé fún gbogbo onígbàgbọ́, tàbí kí a sọ pé àpẹẹrẹ lásán ni tí kò ní ìbéèrè ọrọ̀-ajé gidi.
  rationale: Gíríìkì sọ àṣẹ pàtó fún ẹni tí Jésù ń bá sọ̀rọ̀, ṣùgbọ́n ẹsẹ yìí nìkan kò sọ bóyá aṣẹ kan náà kan gbogbo ọmọ-ẹ̀yìn ní ọ̀nà kan náà. Ìtumọ̀ náà fi ìfarapa ẹ̀kọ́ yìí sílẹ̀ láì yanjú rẹ̀ nípa ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘àwọn òtòṣì’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún àwọn ènìyàn aláìní, a sì yàgò fún èdè ẹ̀kọ́ ìjọ kan pàtó.
