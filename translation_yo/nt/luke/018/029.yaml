id: LUK.18.29
reference: Luke 18:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Lóòótọ́ ni mo sọ fún yín, kò sí ẹni tí ó fi ilé tàbí aya tàbí àwọn arákùnrin tàbí òbí tàbí ọmọ sílẹ̀ nítorí ìjọba Ọlọ́run,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ ìdánilójú náà jáde ní Yorùbá adayeba, nígbà tí ó tún pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́ dé ìwọ̀n tó yẹ.
- source_word: ἀφῆκεν
  choice: fi ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí fífi nǹkan tàbí ẹni kan sílẹ̀; àyíká ọ̀rọ̀ náà kò béèrè pé kí a fi ìtumọ̀ míì kún un.
- source_word: οἰκίαν
  choice: ilé
  rationale: Ó lè tọ́ka sí ilé gẹ́gẹ́ bí ibùgbé tàbí agbo ilé; ‘ilé’ pa ìwọ̀n ìtumọ̀ yẹn mọ́ ní Yorùbá.
- source_word: γυναῖκα
  choice: aya
  rationale: Nínú àkójọ ìbátan yìí, ‘aya’ ni ìtumọ̀ tó bá ọ̀rọ̀ náà mu jù.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Fọ́ọ̀mù akọ púpọ̀ ni Gíríìkì lò; a pa ìfarahàn akọ náà mọ́ láì sọ ọ́ di ‘ará’ lápapọ̀.
- source_word: γονεῖς
  choice: òbí
  rationale: ‘Òbí’ jẹ́ ọ̀rọ̀ Yorùbá adayeba tó lè gba baba àti ìyá lápapọ̀.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: nítorí ìjọba Ọlọ́run
  rationale: Ó túmọ̀ ìdí tàbí ohun tí ẹni náà ṣe é fún ní tààrà, láì fi àlàyé ẹ̀kọ́ ìsìn kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘ìjọba Ọlọ́run’
  choice: ìjọba Ọlọ́run
  alternative: àkóso Ọlọ́run
  rationale: A yan gbolohun tó gbòòrò tó sì ti mọ́ ní Yorùbá, tí ó lè gba ìtumọ̀ ìjọba gẹ́gẹ́ bí àkóso àti agbègbè rẹ̀ láì fi ipá yan ọ̀kan ṣoṣo.
- issue: Irú fífi àwọn ìbátan sílẹ̀
  choice: fi ... sílẹ̀
  alternative: kọ ... sílẹ̀ patapata
  rationale: Gíríìkì kò sọ ní pàtó pé ẹni náà kọ ìdílé rẹ̀ tì patapata; ìtumọ̀ yìí pa àìṣedéédé ìwọ̀n àti ìnira ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àtẹ̀jáde, ọ̀wọ̀, àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A pa ìlànà àkójọ Gíríìkì mọ́, a sì fi àmì kọ́má sí òpin nítorí ẹsẹ̀ yìí ń bá ọ̀rọ̀ lọ sí ẹsẹ̀ 30.
