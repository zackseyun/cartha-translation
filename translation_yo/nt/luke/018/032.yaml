  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí fífi Ọmọ Ènìyàn lé àwọn tí kì í ṣe Júù lọ́wọ́, ìfẹ̀sín, ẹ̀gàn, àti títutọ́ sí i. Síbẹ̀, lílo ‘wọn yóò’ fún àwọn ìṣe mẹ́ta tó kàn lè mú kí a ronú pé ẹgbẹ́ kan náà ni a ti sọ ní kedere gẹ́gẹ́ bí olùṣe; Gíríìkì náà jẹ́ àwọn ọ̀rọ̀-ìṣe aláìṣe-ẹni-nǹkan. ‘A ó’ aláìdárúkọ ń ṣiṣẹ́ dáadáa ní Yorùbá láti pa ìrísí yẹn mọ́. ‘Ṣe é ní ẹ̀gàn’ sì gbòòrò ju ‘gàn án’ lọ fún ὑβρισθήσεται, tí ó lè túmọ̀ sí ìtìjú tàbí ìlòkulò tí ó ní ẹ̀gàn.
  naturalness: ‘A ó fi í lé ... lọ́wọ́’ àti ìtẹ̀lé ‘a ó sì’ jẹ́ Yorùbá ìgbàlódé tó mọ́, tó sì ń ṣàn dáadáa. ‘Ṣe é ní ẹ̀gàn’ jẹ́ ọ̀nà tó dára láti sọ ìtọ́jú ẹni ní ìtìjú/ẹ̀gàn, láì fi í di ẹ̀gàn ẹnu nìkan.
  terminology: ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ ìjẹ́mímọ́ tí a ti mọ̀ nínú ìforígbárí Bíbélì Yorùbá fún τὰ ἔθνη nínú àyíká yìí. Àlàyé ẹsẹ̀-ìsàlẹ̀ náà ń jẹ́ kó hàn pé a kò túmọ̀ ọ́ sí gbogbo àwọn orílẹ̀-èdè lásán.
