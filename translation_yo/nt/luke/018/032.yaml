source:
  edition: SBLGNT
  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: yo
  text: Nítorí a ó fi í lé àwọn Kèfèrí lọ́wọ́[a], a ó sì fi í ṣe ẹlẹ́yà, a ó sì ṣe é ní ẹ̀gàn[b], a ó sì tutọ́ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.” Níhìn-ín, ìtumọ̀ rẹ̀ ni àwọn tí kì í ṣe Júù, ìyẹn àwọn Kèfèrí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó sì gàn án,” “a ó sì fi ìtìjú bá a,” tàbí “a ó sì hùwà búburú sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: a ó fi í lé ... lọ́wọ́
  rationale: Ọ̀rọ̀ yìí pa ìṣe àìṣe-ẹni-nǹkan mọ́, ó sì túmọ̀ sí fífi ẹni kan lé ẹlòmíràn lọ́wọ́; kò fi kún un pé ìwà ọ̀dàlẹ̀ ni.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń ṣàlàyé àsọtẹ́lẹ̀ tó ṣáájú.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká ìtàn yìí, ó tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè lásán.
- source_word: ἐμπαιχθήσεται
  choice: wọn yóò fi í ṣe ẹlẹ́yà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ìwọ̀n láti sọ ìfiniṣe-ẹ̀sín àti ìyọṣùtì.
- source_word: ὑβρισθήσεται
  choice: wọn yóò gàn án
  rationale: ‘Gàn án’ mú ìtìjú àti ẹ̀gàn inú ọ̀rọ̀ Gíríìkì jáde, láì dín ìtumọ̀ rẹ̀ kù sí ọ̀rọ̀ ẹnu nìkan.
- source_word: ἐμπτυσθήσεται
  choice: wọn yóò tutọ́ sí i
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe pàtó àti ìtìjú yìí.
theological_decisions:
- issue: Ẹni tí àwọn ọ̀rọ̀-ìṣe àìṣe-ẹni-nǹkan náà ń tọ́ka sí
  choice: A lo arọ́pò-orúkọ ‘í/án/i’ fún Ọmọ Ènìyàn tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
  alternative: Kí a tún fi ‘Ọmọ Ènìyàn’ sílẹ̀ gẹ́gẹ́ bí olùṣe kedere.
  rationale: Ọ̀rọ̀ Gíríìkì kò tún sọ olùṣe náà ní ẹsẹ yìí, ṣùgbọ́n àyíká Lúùkù 18:31 mú un ṣe kedere. Arọ́pò-orúkọ jẹ́ àdánidá ní Yorùbá, kò sì fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé lásán. A pa àtẹ̀lé àwọn ọ̀rọ̀-ìṣe ọjọ́ iwájú mọ́, a sì lo àpẹẹrẹ ‘wọn yóò’ nítorí pé Yorùbá àdánidá sábà máa ń yí ọ̀rọ̀-ìṣe àìṣe-ẹni-nǹkan Gíríìkì padà sí ìṣe tí olùṣe rẹ̀ kò ní orúkọ pàtó.
