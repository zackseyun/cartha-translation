  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé Gíríìkì dáadáa ní gbogbo rẹ̀: Jésù pè àwọn ọmọ náà sí ọ̀dọ̀ rẹ̀, ó pàṣẹ kí a jẹ́ kí wọ́n wá, kí a má sì dí wọn lọ́wọ́, ó sì sọ pé ìjọba Ọlọ́run jẹ́ ti irú wọn. Àtúnṣe kékeré kan ń mú arọ́pò-orúkọ αὐτά hàn ní tààrà síi, ó sì yọ ìlò ''ara rẹ̀'' tí kò rọrùn nínú àyíká yìí kúrò.'
