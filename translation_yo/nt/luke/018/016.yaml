  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù pè wọ́n sí ọ̀dọ̀ rẹ̀, ó sì ní, “Ẹ jẹ́ kí àwọn ọmọ wá sọ́dọ̀ mi, ẹ má sì ṣe dí wọn lọ́wọ́, nítorí ìjọba Ọlọ́run jẹ́ ti irú àwọn wọ̀nyí[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtúmọ̀ tí ó sún mọ́ ìrísí Gíríìkì: “nítorí ti irú àwọn wọ̀nyí ni ìjọba Ọlọ́run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: pe àwọn ọmọ náà sí ọ̀dọ̀ ara rẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà ní ohùn àárín, ó sì túmọ̀ sí pé Jésù pè wọ́n láti wá sí ọ̀dọ̀ rẹ̀. A sọ αὐτά di ‘àwọn ọmọ náà’ kí ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí lè ṣe kedere ní Yorùbá.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Ẹ jẹ́ kí àwọn ọmọ wá sọ́dọ̀ mi
  rationale: ‘Ẹ jẹ́ kí’ fi àṣẹ ìyọ̀ǹda hàn lọ́nà àdánidá, ‘àwọn ọmọ’ sì túmọ̀ παιδία láìfi ìtumọ̀ ọjọ́-orí kan kun un ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ.
- source_word: μὴ κωλύετε αὐτά
  choice: ẹ má sì ṣe dá wọn lẹ́kun
  rationale: ‘Dá … lẹ́kun’ ní ìtumọ̀ dídènà tàbí ṣíṣe ìdíwọ́, ó sì pa àṣẹ náà mọ́ láìpinnu bóyá ìṣe dídènà náà ti ń lọ lọ́wọ́.
- source_word: τῶν γὰρ τοιούτων
  choice: nítorí … ti irú àwọn ẹni bí àwọn wọ̀nyí
  rationale: Gbólóhùn yìí kọjá àwọn ọmọ pàtó tí ó wà níbẹ̀, ó sì ń tọ́ka sí irú àwọn ẹni tí àwọn ọmọ náà dúró fún, láìsọ irú ànímọ́ wo gan-an tí Jésù ní lọ́kàn.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà àti ọ̀nà àdánidá láti sọ ọ̀rọ̀ Gíríìkì náà ní Yorùbá.
theological_decisions:
- issue: Ìwọ̀n ìtọ́kasí τῶν τοιούτων
  choice: Ó ń tọ́ka sí irú àwọn ẹni tí àwọn ọmọ wọ̀nyí dúró fún, kì í ṣe àwọn ọmọ pàtó náà nìkan.
  alternative: Ó ń tọ́ka sí àwọn ọmọ tí a mú wá sọ́dọ̀ Jésù nìkan.
  rationale: τοιοῦτος sábà máa ń fi àwọn ẹni tí ohun tí a mẹ́nu kàn ṣojú hàn. Ìtumọ̀ náà kò sọ irú ànímọ́ ọmọ wo ni a ń béèrè, nítorí ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé rẹ̀.
- issue: Ìbáṣepọ̀ ìjọba Ọlọ́run pẹ̀lú ‘irú àwọn ẹni bẹ́ẹ̀’
  choice: ìjọba Ọlọ́run jẹ́ ti irú àwọn ẹni bí àwọn wọ̀nyí
  alternative: ti irú àwọn ẹni bí àwọn wọ̀nyí ni ìjọba Ọlọ́run
  rationale: ‘Jẹ́ ti’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìbáṣepọ̀ tàbí jíjẹ́ ti ẹnì kan hàn, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìrísí gírámà Gíríìkì tó túbọ̀ sun mọ́ ọ̀rọ̀-oríṣun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé gbogbo; ‘àwọn ọmọ’ yẹra fún fífi ọjọ́-orí pàtó kan kun παιδία.
