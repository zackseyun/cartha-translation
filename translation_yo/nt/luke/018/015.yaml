  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: yo
  text: Wọ́n ń mú àwọn ọmọ ọwọ́ pàápàá wá sọ́dọ̀ rẹ̀, kí ó lè fọwọ́ kàn wọ́n[a]. Ṣùgbọ́n nígbà tí àwọn ọmọ-ẹ̀yìn rí èyí[c], wọ́n bá àwọn tí ń mú àwọn ọmọ ọwọ́ náà wá wí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ jòjòló.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ọmọ kékeré gan-an, ní pàtó àwọn ọmọ ọwọ́.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, àwọn tí ń mú àwọn ọmọ ọwọ́ náà wá sọ́dọ̀ Jésù.
    reason: lexical_alternative
  - marker: c
    text: Nínú àwọn ìtàn tó jọra, bí Jésù ṣe fọwọ́ kàn àwọn ọmọ náà ní í ṣe pẹ̀lú ìbùkún wọn àti gbígbé ọwọ́ lé wọn (wo Mátíù 19:13; Máàkù 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: ń mú ... wá sọ́dọ̀ rẹ̀
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; ‘ń mú ... wá’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ní ìfarahàn kejì, δὲ fi ìyàtọ̀ ìṣe àwọn ọmọ-ẹ̀yìn sí ohun tí àwọn ènìyàn ń ṣe hàn; ‘Ṣùgbọ́n’ bá ìsopọ̀ náà mu láìsọ ọ́ di líle ju.
- source_word: καὶ τὰ βρέφη
  choice: àwọn ọmọ ọwọ́ pàápàá
  rationale: βρέφη tọ́ka sí àwọn ọmọ kékeré gan-an, pàápàá ọmọ ọwọ́; καὶ níbí ní agbára ìtẹnumọ́ tí ‘pàápàá’ mú jáde.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: kí ó lè fi ọwọ́ kàn wọ́n
  rationale: ἵνα ṣàfihàn ète, ἅπτομαι sì túmọ̀ sí ‘fọwọ́ kàn.’ A kò fi ‘bù kún’ sínú ọ̀rọ̀ pàtàkì, nítorí pé ìyẹn ju ohun tí Lúùkù sọ ní tààrà lọ.
- source_word: ἰδόντες
  choice: nígbà tí ... rí èyí
  rationale: A tú participle aorist náà sí gbólóhùn àsìkò tó ṣe kedere, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐπετίμων αὐτοῖς
  choice: wọ́n bá àwọn tí ń mú wọn wá wí
  rationale: ἐπιτιμάω ní agbára ìbániwí tàbí ìdálẹ́bi. Ṣíṣe ẹni tí αὐτοῖς tọ́ka sí ní kedere yọ ìdàrúdàpọ̀ Yorùbá kúrò, ṣùgbọ́n àlàyé ìtọ́kasí náà wà ní àkọ́lé ìsàlẹ̀ pẹ̀lú.
theological_decisions:
- issue: Irú ìṣe tí Jésù fẹ́ ṣe sí àwọn ọmọ náà
  choice: fi ọwọ́ kàn wọ́n
  alternative: bù kún wọn; gbé ọwọ́ lé wọn
  rationale: Ọ̀rọ̀ Gíríìkì ἅπτηται sọ ‘fọwọ́ kàn’ ní tààrà. Bó tilẹ̀ jẹ́ pé àwọn ìtàn tó jọra so fífi ọwọ́ kàn mọ́ ìbùkún àti gbígbé ọwọ́ lé wọn, a pa ọ̀rọ̀ Lúùkù mọ́ láìfi ìtumọ̀ ìtúmọ̀ sí i.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. ‘Ọmọ ọwọ́’ jẹ́ ọ̀rọ̀ àdánidá fún βρέφος; ‘ọmọ jòjòló’ wà gẹ́gẹ́ bí àṣàyàn. A ṣe αὐτοῖς ní kedere nínú ọ̀rọ̀ pàtàkì láti yẹra fún pípa ìbániwí náà mọ́ àwọn ọmọ ọwọ́ dípò àwọn tó mú wọn wá.
