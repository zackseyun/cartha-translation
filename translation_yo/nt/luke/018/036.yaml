  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: yo
  text: Nígbà tí ó sì gbọ́ ogunlọ́gọ̀ ènìyàn tí wọ́n ń kọjá lọ, ó ń béèrè ohun tí èyí jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, ‘ó ń béèrè ohun tí èyí lè jẹ́.’ Ọ̀rọ̀-ìṣe náà lè fi hàn pé ó ń béèrè léraléra, ọ̀nà optative nínú ìbéèrè tí kì í ṣe tààrà náà sì lè ní ìtumọ̀ àìdánilójú díẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nígbà tí ó … gbọ́
  rationale: Aorist participle náà ń fi ipò àkókò hàn; gbólóhùn ‘Nígbà tí ó … gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣàn ìtàn náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakora líle hàn; ‘sì’ bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: ὄχλου
  choice: ọ̀pọ̀ ènìyàn kan
  rationale: Ó túmọ̀ sí àwùjọ tàbí ogunlọ́gọ̀; ‘ọ̀pọ̀ ènìyàn kan’ ṣe kedere, ó sì jẹ́ èdè tí òǹkàwé òde òní lóye nírọ̀rùn.
- source_word: διαπορευομένου
  choice: tí wọ́n ń kọjá lọ
  rationale: Participle present náà fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń kọjá lọ’ bá àwòrán àwọn ènìyàn tí ń kọjá níbi tí ọkùnrin náà wà mu.
- source_word: ἐπυνθάνετο
  choice: ó ń béèrè
  rationale: Imperfect middle náà lè tọ́ka sí ìbéèrè tí ń bá a lọ tàbí tí a ń tún ṣe; àpẹẹrẹ ‘ń béèrè’ pa ìfarahàn yìí mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τί εἴη τοῦτο
  choice: ohun tí èyí jẹ́
  rationale: Èyí jẹ́ ìbéèrè àìṣe tààrà pẹ̀lú optative. ‘Ohun tí èyí jẹ́’ jẹ́ Yorùbá àdánidá, ó sì sún mọ́ ìtumọ̀ gangan ju ‘ohun tí èyí túmọ̀ sí’ lọ.
