translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Gbólóhùn náà pa ìbéèrè àìṣe tààrà àti àìdánilójú tó ṣeé ṣe nínú Gíríìkì mọ́ ní àlàyé ìsàlẹ̀ ojú ìwé.
