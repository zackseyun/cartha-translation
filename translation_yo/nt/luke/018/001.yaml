  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: yo
  text: Ó sì ń sọ àkàwé kan fún wọn nípa bí ó ti yẹ kí wọ́n máa gbàdúrà nígbà gbogbo, kí àárẹ̀ má sì mú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti fi hàn pé ó yẹ kí wọ́n máa gbàdúrà nígbà gbogbo, kí wọ́n má sì rẹ̀wẹ̀sì.”
    reason: πρὸς τὸ δεῖν lè tọ́ka sí ète àkàwé náà ní tààrà, ἐγκακεῖν sì tún lè jẹ́ “rẹ̀wẹ̀sì.”
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ó sì ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ tàbí ìtẹ̀síwájú ìtàn hàn; “ń sọ” mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń gbé ìtàn lọ síwájú; “sì” bá ìlò Yorùbá mu láì sọ ọ́ di àmì àkókò tó lágbára.
- source_word: παραβολὴν
  choice: àkàwé kan
  rationale: “Àkàwé” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún παραβολή nínú àwọn ìwé Ìhìn Rere.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó dúró gẹ́gẹ́ bí ẹni tí a ń sọ ọ̀rọ̀ náà fún.
- source_word: πρὸς τὸ δεῖν
  choice: nípa bí ó ti yẹ
  rationale: Ìtumọ̀ yìí pa ìtọ́kasí tàbí ète gbólóhùn náà mọ́, ó sì tún gbé ìmọ̀lára dandan inú δεῖν jáde lọ́nà Yorùbá tó rọrùn.
- source_word: πάντοτε προσεύχεσθαι
  choice: kí wọ́n máa gbàdúrà nígbà gbogbo
  rationale: “Máa” fi ìtẹ̀síwájú hàn, “nígbà gbogbo” sì tú πάντοτε ní tààrà láì fi dandan kún un pé adúrà ẹnu kò gbọdọ̀ dá dúró rárá.
- source_word: μὴ ἐγκακεῖν
  choice: kí àárẹ̀ má sì mú wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti rẹ̀wẹ̀sì, sọ ìgboyà nù, tàbí juwọ́ sílẹ̀; àṣàyàn yìí jẹ́ àdánidá, ó sì dá ìfaradà nínú adúrà sí.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jesu nípa dandan àti ìfaradà nínú adúrà
  choice: “bí ó ti yẹ kí wọ́n máa gbàdúrà”
  alternative: “láti fi hàn pé wọ́n gbọ́dọ̀ máa gbàdúrà”
  rationale: “Ó yẹ” pa agbára δεῖν mọ́ láì mú un wọ ẹ̀kọ́ ìjọ kan pàtó nípa bí adúrà ṣe ń ṣiṣẹ́; àlàyé ìsàlẹ̀ fi àṣàyàn ète tó ṣeé ṣe hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “àkàwé” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó mọ́gbọ́n dání, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
