id: LUK.18.39
reference: Luke 18:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: yo
  text: Àwọn tí ń lọ níwájú sì ń bá a wí pé kí ó dákẹ́; ṣùgbọ́n òun túbọ̀ ń ké sí i pé, “Ọmọ Dáfídì, ṣàánú fún mi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: àwọn tí ń lọ níwájú
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí a lò gẹ́gẹ́ bí orúkọ, ó sì tọ́ka sí àwọn ènìyàn tí wọ́n wà níwájú nínú ọ̀pọ̀ ènìyàn; yíyan yìí pa ìtumọ̀ ibi mọ́ láì fi ipa aṣáájú kún un.
- source_word: ἐπετίμων
  choice: ń bá a wí
  rationale: Imperfect náà fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; “ń bá a wí” jẹ́ ọ̀nà Yorùbá àdánidá fún ìbáwí líle.
- source_word: ἵνα σιγήσῃ
  choice: pé kí ó dákẹ́
  rationale: ἵνα pẹ̀lú subjunctive sọ ète ìbáwí wọn; gbólóhùn yìí jẹ́ kedere, ó sì dára ní Yorùbá òde òní.
- source_word: αὐτὸς δὲ
  choice: ṣùgbọ́n òun
  rationale: “Òun” mú ìtakora àti ìtẹnumọ́ inú ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà jáde.
- source_word: πολλῷ μᾶλλον
  choice: túbọ̀
  rationale: “Túbọ̀” sọ pé ó ṣe bẹ́ẹ̀ sí i ju tẹ́lẹ̀ lọ, láì fi ọ̀rọ̀ bí “ní ohùn rara” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἔκραζεν
  choice: ń ké sí i
  rationale: Imperfect náà tọ́ka sí kíké tí ó ń bá a lọ; “ń ké sí i” jẹ́ àdánidá, ó sì fi ìforítì rẹ̀ hàn.
- source_word: Υἱὲ Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: A túmọ̀ oyè Dáfídì-Mèsáyà náà, nígbà tí a kọ orúkọ Dáfídì ní ìrísí Yorùbá tí a sábà lò.
- source_word: ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí jẹ́ ẹ̀bẹ̀ pàjáwìrì tí ó bá ọ̀nà tí Yorùbá ń gbà sọ “have mercy on me” mu, tí ó sì pa ìtumọ̀ àánú mọ́.
theological_decisions:
- issue: Ìtumọ̀ Mèsáyà inú Υἱὲ Δαυίδ
  choice: Ọmọ Dáfídì
  alternative: Kí a ka a sí ọ̀rọ̀ ọlá lásán tàbí kí a ṣàlàyé rẹ̀ sí “Mèsáyà” nínú ẹsẹ̀ náà
  rationale: Oyè náà ní ìtumọ̀ ọba láti ìran Dáfídì àti ìtumọ̀ Mèsáyà nínú ìtàn Lúùkù. Títúmọ̀ rẹ̀ ní tààrà pa ìtumọ̀ yẹn mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A pa ipa imperfect mọ́ nípasẹ̀ “ń” àti “túbọ̀,” a sì lo àmì àyọkà Yorùbá tó bójú mu.
