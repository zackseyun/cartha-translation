  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: yo
  text: Ó wí pé, “Onídàájọ́ kan wà ní ìlú kan, ẹni tí kò bẹ̀rù Ọlọ́run, tí kò sì ka ẹnikẹ́ni sí[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sì bọ̀wọ̀ fún ènìyàn.” Ọ̀rọ̀ Gíríìkì náà lo “ènìyàn” ní ẹyọ kan, ṣùgbọ́n ó ń tọ́ka sí gbogbo ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Ó wí pé
  rationale: Ọ̀rọ̀ aláìparí yìí ń mú ọ̀rọ̀ àkàwé Jésù wọlé, ó sì so ẹsẹ yìí mọ́ èyí tó ṣáájú; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá.
- source_word: Κριτής τις
  choice: Onídàájọ́ kan
  rationale: “Kan” fi àìdánimọ̀ τις hàn láì sọ ẹni náà ní orúkọ, ó sì bá ìtàn àkàwé mu.
- source_word: ἦν
  choice: wà
  rationale: “Wà” ni ọ̀nà Yorùbá tó ṣe déédéé láti mú ẹni tuntun wọ inú ìtàn.
- source_word: ἔν τινι πόλει
  choice: ní ìlú kan
  rationale: “Kan” tún ṣàfihàn àìdánimọ̀ kejì tí τις ní, ní ọ̀nà tó rọrùn ní Yorùbá.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó yẹ fún Ọlọ́run nínú àyíká ẹ̀sìn yìí.
- source_word: μὴ φοβούμενος
  choice: kò bẹ̀rù
  rationale: Ó fi ìwà onídàájọ́ náà tó máa ń bá a lọ hàn, ó sì pa ìtumọ̀ ìbẹ̀rù Ọlọ́run mọ́.
- source_word: ἄνθρωπον
  choice: ẹnikẹ́ni
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ kan, a lò ó ní ìtumọ̀ gbogbo ènìyàn; “ẹnikẹ́ni” jẹ́ adayeba ní Yorùbá, ó sì pa ìtumọ̀ àìní ọ̀wọ̀ fún ènìyàn kankan mọ́.
- source_word: μὴ ἐντρεπόμενος
  choice: kò sì ka … sí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé kò bìkítà fún, kò sì fi ọ̀wọ̀ tàbí ìkíyèsí tó yẹ fún ẹlòmíràn; “ka … sí” sọ èyí ní Yorùbá adayeba.
theological_decisions:
- issue: Ẹyọ ἄνθρωπον tí a lò fún gbogbo ènìyàn, ní ìyàtọ̀ sí Ọlọ́run
  choice: ẹnikẹ́ni
  alternative: ènìyàn
  rationale: “Ẹnikẹ́ni” mú ìtumọ̀ gbogbogbò náà jáde kedere ní Yorùbá, láì jẹ́ kí olùkà rò pé ọkùnrin nìkan ni a ń tọ́ka sí. Àkọ́lé ìsàlẹ̀ ṣàfihàn pé ẹyọ “ènìyàn” ni Gíríìkì ní.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ti ìgbàlódé, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbo. A pa ìtẹ̀sí àkàwé àti ìyàtọ̀ tó wà láàárín bẹ̀rù Ọlọ́run àti fífi ọ̀wọ̀ fún ènìyàn mọ́.
