  source_fidelity: Ìtumọ̀ náà ń fi opó náà, ìlú náà, àti ìwà wíwá rẹ̀ léraléra hàn dáadáa. Ṣùgbọ́n “ń tọ̀ ọ́ wá” túmọ̀ sí lílépa ẹni kan ju wíwá sí ọ̀dọ̀ rẹ̀ lọ, nítorí náà kò péye gẹ́gẹ́ bí ἤρχετο πρὸς αὐτόν. “Ṣe ìdájọ́ fún mi lòdì sí alátakò mi” pa ìbéèrè ìdájọ́/ìdáláre nínú Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου mọ́ láì sọ̀rọ̀ nípa gbígbẹ̀san ara ẹni.
