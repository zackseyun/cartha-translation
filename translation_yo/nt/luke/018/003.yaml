  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: yo
  text: Opó kan sì wà ní ìlú yẹn, ó sì máa ń wá sí ọ̀dọ̀ rẹ̀, ó ń wí pé, ‘Ṣe ìdájọ́ fún mi lòdì sí alátakò mi.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Dáláre mi lọ́wọ́ alátakò mi,” tàbí, “Fún mi ní ìdájọ́ òdodo lòdì sí ẹni tí mo ń jà ẹjọ́ pẹ̀lú rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ rí ìdájọ́ òdodo tàbí ìdáláre nípasẹ̀ òfin; kò fi dandan túmọ̀ sí gbígbẹ̀san ara ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tí ó ṣe déédé fún obìnrin tí ọkọ rẹ̀ ti kú, ó sì pa ipò àwùjọ rẹ̀ nínú àkàwé náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: Ó so ìtàn náà pọ̀ mọ́ ohun tí ó ṣáájú láì fi ìtakora tí kò sí sínú rẹ̀.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: wà ní ìlú yẹn
  rationale: Ìtumọ̀ àdánidá ní Yorùbá fún gbólóhùn tí ń sọ pé ẹni kan wà ní ibì kan.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: ń tọ̀ ọ́ wá léraléra
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé ó máa ń wá sí ọ̀dọ̀ rẹ̀ ní ìgbà púpọ̀; ‘léraléra’ mú ìforítì náà hàn gbangba.
- source_word: λέγουσα
  choice: ó ń wí pé
  rationale: Ó fi ọ̀rọ̀ tí opó náà ń sọ nígbà tí ó ń tọ adájọ́ náà wá hàn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: Ἐκδίκησόν με
  choice: Dájọ́ òdodo fún mi
  rationale: Nínú àyíká ẹjọ́ yìí, ἐκδικέω túmọ̀ sí mímú kí ẹni rí ìdájọ́ òdodo tàbí ìdáláre, kì í ṣe gbígbẹ̀san ara ẹni ní pàtàkì.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: lórí ọ̀ràn tí mo ní pẹ̀lú alátakò mi
  rationale: ἀντίδικος jẹ́ ẹni tí ó dojú kọ ẹlòmíràn nínú ẹjọ́. Ìtumọ̀ yìí jẹ́ kó ṣe kedere pé àríyànjiyàn òfin ni, láì sọ pé alátakò náà jẹ́ olùfisùn ní dandan.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ń tọ̀ ọ́ wá léraléra’ mú ìṣe tí ń ṣẹlẹ̀ lemọ́lemọ́ hàn, ‘Dájọ́ òdodo fún mi’ sì jẹ́ ọ̀rọ̀ tó rọrùn fún òǹkàwé lónìí ní àyíká ẹjọ́.
