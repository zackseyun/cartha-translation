id: LUK.18.8
reference: Luke 18:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: yo
  text: Mo sọ fún yín pé yóò ṣe ìdájọ́ òdodo fún wọn ní kíákíá[a]. Síbẹ̀, nígbà tí Ọmọ Ènìyàn bá dé, ṣé yóò rí ìgbàgbọ́ ní ilẹ̀ ayé ní tòótọ́[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò dá wọn láre” tàbí “yóò fún wọn ní ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí dídá ẹnì kan láre níwájú ilé ẹjọ́ tàbí sí ṣíṣe ìdájọ́ òdodo fún un.
    reason: lexical_alternative
  - marker: b
    text: “Ìgbàgbọ́” tún lè ní ìtumọ̀ “ìgbẹ́kẹ̀lé” tàbí “ìdúróṣinṣin” níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: yóò ṣe ìdájọ́ òdodo fún wọn
  rationale: Gbólóhùn náà tọ́ka sí ṣíṣe ìdájọ́ tí ó dá àwọn tí a ni lára láre, gẹ́gẹ́ bí àyíká ẹjọ́ opó náà ṣe fi hàn. ‘Fún wọn’ mú kí ipa αὐτῶν gẹ́gẹ́ bí àwọn tí ìdájọ́ náà ṣe fún ṣe kedere, láìfi ìtumọ̀ ẹ̀san kún un ju bó ṣe yẹ lọ.
- source_word: ἐν τάχει
  choice: láìjáfara
  rationale: Ó sọ pé a ó ṣe ohun náà ní kíákíá tàbí láìfi falẹ̀; ‘láìjáfara’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi dandan sọ ìgbà tí yóò ṣẹlẹ̀.
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó pa ìyípadà alátakò tó lágbára mọ́ láàárín ìdájọ́ Ọlọ́run àti ìbéèrè àwárí tó tẹ̀ lé e.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ akọ́lé tí Jésù fi ń pe ara rẹ̀, ó sì pa ìtọ́kasí rẹ̀ sí Dáníẹ́lì 7 mọ́.
- source_word: ἐλθὼν
  choice: nígbà tí ... bá dé
  rationale: Aorist participle náà ní ipa àsìkò níbí; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì mọ́.
- source_word: ἆρα
  choice: ní tòótọ́
  rationale: Ọ̀rọ̀ náà fún ìbéèrè náà ní agbára ìrònú àti ìwádìí; ‘ní tòótọ́’ mú ìtẹnumọ́ yìí jáde láìsọ ìdáhùn fún ìbéèrè náà.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ pa ìtumọ̀ gbòòrò πίστις mọ́, láìdín in kù sí ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé nìkan.
- source_word: ἐπὶ τῆς γῆς
  choice: ní orí ilẹ̀ ayé
  rationale: Ìtumọ̀ yìí bá àfojúsùn gbogbo ayé ti ọ̀rọ̀ náà mu, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní àyíká tí ó lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìṣòtítọ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Àyíká náà tẹnumọ́ ìgbẹ́kẹ̀lé tí ó dúró ṣinṣin nínú àdúrà, ṣùgbọ́n ‘ìgbàgbọ́’ ló pa àlà ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ jù, láìyanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ lábẹ́lẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi gbogbo tí ó yẹ. Ìbéèrè ìparí pa ìrísí àwárí àti ìdààmú ọ̀rọ̀ Gíríìkì mọ́; a kò fi ìdáhùn tí orísun kò sọ sínú rẹ̀.
