revisions:
- from: Ṣùgbọ́n agbowó òde náà dúró ní òkèèrè; kò tilẹ̀ fẹ́ gbé ojú rẹ̀ sókè ọ̀run, ṣùgbọ́n ó ń lu ara rẹ̀ ní àyà, ó ń wí pé, ‘Ọlọ́run, ṣàánú fún èmi ẹlẹ́ṣẹ̀ yìí.[a]’
  to: Ṣùgbọ́n olùgbọ́ owó orí náà, tí ó dúró ní òkèèrè, kò tilẹ̀ fẹ́ gbé ojú rẹ̀ sókè sí ọ̀run; ṣùgbọ́n ó ń lu àyà rẹ̀, ó ń wí pé, ‘Ọlọ́run, ṣàánú mi, èmi ẹlẹ́ṣẹ̀ náà.[a]’
  rationale: Àtúnṣe náà mú orúkọ τελώνης di kedere, ó ṣètò gbolohun náà ní Yorùbá àdánidá, ó sì tún ìbéèrè àánú náà ṣe gẹ́gẹ́ bí ìlò Yorùbá tó pé. A pa imperfect “ó ń lu” mọ́, a sì pa ìtẹnumọ́ τῷ ἁμαρτωλῷ mọ́ pẹ̀lú “èmi ẹlẹ́ṣẹ̀ náà” láìfikún ìtumọ̀ tuntun. Àlàyé ìsàlẹ̀ náà ń pa aṣayan lexical àti ìbátan ọ̀rọ̀ náà pẹ̀lú ètùtù mọ́ ní ìṣọ́ra.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:29:06Z'
