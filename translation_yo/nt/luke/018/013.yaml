id: LUK.18.13
reference: Luke 18:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: yo
  text: Ṣùgbọ́n olùgbọ́ owó orí náà, tí ó dúró ní òkèèrè, kò tilẹ̀ fẹ́ gbé ojú rẹ̀ sókè sí ọ̀run; ṣùgbọ́n ó ń lu àyà rẹ̀, ó ń wí pé, ‘Ọlọ́run, ṣàánú mi, èmi ẹlẹ́ṣẹ̀ náà.[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ ojú rere sí mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìbátan pẹ̀lú èdè ètùtù àti ìmú ìbínú rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: agbowó òde
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ń gba owó orí fún ìjọba, ó sì bá ipò ẹni náà nínú àyíká Ìhìn Rere mu.
- source_word: μακρόθεν ἑστὼς
  choice: dúró ní òkèèrè
  rationale: Ó fi ìdúró rẹ̀ àti jíjìnnà rẹ̀ hàn ní ọ̀nà àdánidá, láìfi ìtumọ̀ ìrẹ̀lẹ̀ tí àyíká lè mú wá sínú ọ̀rọ̀ náà ní tààràtà.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: kò tilẹ̀ fẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ tàbí ìmúratán inú θέλω mọ́, ó sì mú οὐδέ gẹ́gẹ́ bí ‘tilẹ̀.’
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: gbé ojú rẹ̀ sókè ọ̀run
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tí ó pa ìtọ́sọ́nà sí ọ̀run mọ́.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: ó ń lu ara rẹ̀ ní àyà
  rationale: Àmì ‘ń’ fi ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn, gẹ́gẹ́ bí imperfect Giriki; ‘àrà rẹ̀ ní àyà’ sì jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání.
- source_word: ἱλάσθητί μοι
  choice: ṣàánú fún èmi
  rationale: ‘Ṣàánú’ jẹ́ ìbéèrè àánú Ọlọ́run tí ó yé òǹkàwé lónìí; àlàyé ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú ètùtù wà nínú àlàyé ìsàlẹ̀.
- source_word: τῷ ἁμαρτωλῷ
  choice: èmi ẹlẹ́ṣẹ̀ yìí
  rationale: Ó pa ìtẹnumọ́ article Giriki mọ́ ní Yorùbá àdánidá, ó sì yà á sọ́tọ̀ kúrò nínú ìtumọ̀ tí ó rọrùn jù lọ, ‘ẹlẹ́ṣẹ̀ kan.’
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἱλάσθητί μοι nínú àdúrà sí Ọlọ́run
  choice: ṣàánú fún èmi
  alternative: ṣe ètùtù fún mi / jẹ́ ẹni tí ó mú ìbínú rẹ kúrò lórí mi
  rationale: Ọ̀rọ̀-ìṣe náà ní ìbáṣepọ̀ pẹ̀lú ètùtù àti mímú ìbínú kúrò, ṣùgbọ́n nínú àdúrà tààrà yìí, ‘ṣàánú fún èmi’ jẹ́ kedere, àdánidá, ó sì yẹ fún ọ̀pọ̀ ènìyàn. A kò fi èrò ẹ̀kọ́ ìsìn kan pàtó lé ọ̀rọ̀ náà lórí; ìjinlẹ̀ ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Agbowó òde’ ni a lò fún τελώνης; a pa ìtẹnumọ́ ‘the sinner’ mọ́ pẹ̀lú ‘èmi ẹlẹ́ṣẹ̀ yìí.’
