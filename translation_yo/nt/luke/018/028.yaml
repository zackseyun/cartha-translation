id: LUK.18.28
reference: Luke 18:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: yo
  text: Nígbà náà ni Pétérù sọ pé, “Wò ó, àwa ti fi ohun tí í ṣe tiwa sílẹ̀[a], a sì ti tẹ̀ lé ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ohun tí ó jẹ́ tiwa” tàbí “àwọn ohun ìní wa.” Gbólóhùn Gíríìkì náà gbòòrò; kò sọ ohun tí Pétérù àti àwọn yòókù fi sílẹ̀ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Nígbà náà ni … sọ pé
  rationale: Èyí fi ìtẹ̀síwájú ìtàn àti ìyípadà kékeré tí δέ ń tọ́ka sí hàn, láì sọ ọ́ di àtakò líle.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí olùgbọ́; “Wò ó” jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere, tí ó sì ní agbára tó yẹ.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Lílo ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere pa ìtẹnumọ́ inú Gíríìkì mọ́.
- source_word: ἀφέντες τὰ ἴδια
  choice: ti fi ohun tí í ṣe tiwa sílẹ̀
  rationale: Gbólóhùn yìí pa ìtumọ̀ gbígbòòrò τὰ ἴδια mọ́, láì dín un kù sí ilé, dúkìá, tàbí ohun ìní nìkan.
- source_word: ἠκολουθήσαμέν σοι
  choice: a sì ti tẹ̀ lé ọ
  rationale: “Tẹ̀ lé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἀκολουθέω, ó sì pa ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn mọ́ láì ṣe àlàyé àfikún.
theological_decisions:
- issue: Ohun tí Pétérù àti àwọn yòókù fi sílẹ̀
  choice: ohun tí í ṣe tiwa
  alternative: àwọn ohun ìní wa
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ gbígbòòrò, kò sì sọ pàtó bóyá ohun-ìní, ilé, ẹbí, tàbí gbogbo ohun tí ó jẹ́ tiwọn ni; a kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó kún un.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu, a sì yẹra fún ọ̀rọ̀ ìjọ kan pàtó.
