source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó ríran[a], ó sì ń tẹ̀lé e[b], ó ń yin Ọlọ́run lógo. Nígbà tí gbogbo àwọn ènìyàn sì rí èyí, wọ́n fi ìyìn fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ó tún ríran” tàbí “ojú rẹ̀ là.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹnì kan gba agbára láti ríran padà; “ó ríran” kò sọ bóyá ó ti ríran rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ó sì tẹ̀lé e.” Fọ́ọ̀mù imperfect Gíríìkì lè tẹnu mọ́ pé ìṣe títẹ̀lé náà ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ láìjáfara; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá tó sì dá agbára àkókò inú Gíríìkì mọ́.
- source_word: ἀνέβλεψεν
  choice: ó ríran
  rationale: Nínú àyíká ìwòsàn afọ́jú, ọ̀rọ̀ náà túmọ̀ sí gbígba agbára láti ríran. ‘Ó ríran’ jẹ́ kedere, ó sì yẹra fún fífi dájú pé ó ti ríran rí, ohun tí àyíká náà kò sọ ní pàtó.
- source_word: ἠκολούθει
  choice: ó sì ń tọ̀ ọ́ lẹ́yìn
  rationale: Àmì ‘ń’ ṣe àfihàn ìṣe tó ń bá a lọ, gẹ́gẹ́ bí imperfect Gíríìkì, ní èdè Yorùbá àdánidá.
- source_word: δοξάζων
  choice: ó ń yin Ọlọ́run lógo
  rationale: Ó ṣàfihàn ìṣe tó ń lọ papọ̀ pẹ̀lú títọ Jesu lẹ́yìn, ó sì pa èrò fífi ògo fún Ọlọ́run mọ́ láìlo gbólóhùn kan náà pẹ̀lú αἶνον.
- source_word: λαός
  choice: gbogbo àwọn ènìyàn
  rationale: Ó tọ́ka sí gbogbo àwọn ènìyàn tó péjọ; èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: ἰδὼν
  choice: Nígbà tí ... rí èyí
  rationale: Ìtumọ̀ yìí sọ ìṣe rírí di àdánidá ní Yorùbá, ‘èyí’ sì ń tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ rí nínú ìtàn náà láìfi àlàyé míì kún un.
- source_word: ἔδωκεν αἶνον
  choice: wọ́n fi ìyìn fún
  rationale: Ó pa àwòrán gbólóhùn Gíríìkì ‘fún ní ìyìn’ mọ́, ó sì jẹ́ Yorùbá tó ṣeé lóye.
- source_word: θεός / θεῷ
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá boṣewa fún θεός; a pa ìtúnrántí rẹ̀ mọ́ láti fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ọkùnrin náà àti àwọn ènìyàn ń yìn.
theological_decisions:
- issue: Ìwà ìṣe títọ Jesu lẹ́yìn lẹ́yìn ìmúláradá
  choice: ó sì ń tọ̀ ọ́ lẹ́yìn
  alternative: ó sì tọ̀ ọ́ lẹ́yìn
  rationale: Imperfect ἠκολούθει lè tẹnu mọ́ ìṣe tó ń bá a lọ. Lílò ‘ń’ pa ìtumọ̀ yẹn mọ́ láìfi ẹ̀kọ́ ìsìn àfikún sí i.
- issue: Bí a ṣe máa tú collective singular πᾶς ὁ λαός
  choice: gbogbo àwọn ènìyàn ... wọ́n
  alternative: gbogbo ìjọ ènìyàn ... ó
  rationale: Yorùbá àdánidá máa ń tọ́ka sí àkójọpọ̀ àwọn ènìyàn pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀ ‘wọ́n’; èyí kò yí ìtumọ̀ ẹ̀kọ́ ìsìn padà.
- issue: Ohun tí ἰδών ní gẹ́gẹ́ bí àfojúsùn rẹ̀
  choice: rí èyí
  alternative: rí i
  rationale: Gíríìkì kò sọ àfojúsùn náà ní gbangba. ‘Èyí’ jẹ́ kí ìtọ́kasí sí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ ṣeé lóye, láìdín un kù sí ìwòsàn nìkan tàbí títọ lẹ́yìn nìkan.
translation_notes:
  register: A lo Yorùbá boṣewa, ológo ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A ya ‘yin Ọlọ́run lógo’ sọ́tọ̀ kúrò ní ‘fi ìyìn fún Ọlọ́run’ láti pa ìyàtọ̀ δοξάζων àti αἶνον mọ́. Arọ́pò-orúkọ ‘ọ́’ pa ìtọ́kasí Gíríìkì sí Jesu mọ́ láìtún orúkọ rẹ̀ sọ.
