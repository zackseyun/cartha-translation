source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: yo
  text: Nígbà tí Jésù rí i, ó sì wí pé, “Bí ó ti ṣòro tó fún àwọn tí ó ní ọ̀pọ̀ ìní láti wọ ìjọba Ọlọ́run!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nígbà tí ... rí i
  rationale: Ọ̀rọ̀-ìṣe alábàápín aorist yìí ń tọ́ka sí ohun tí ó ṣẹlẹ̀ nígbà tí Jésù rí ọkùnrin náà; ìtumọ̀ àsìkò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ọ̀rọ̀-ìṣe pàtàkì.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: αὐτόν
  choice: i
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí olórí ọlọ́rọ̀ tí a mẹ́nu kàn ṣáájú.
- source_word: Πῶς δυσκόλως
  choice: Ẹ wo bí ó ti ṣòro tó
  rationale: Àkójọpọ̀ yìí jẹ́ gbólóhùn ìyàlẹ́nu tí ó tẹnu mọ́ bí ohun náà ti ṣòro tó. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: àwọn tí ó ní ọrọ̀
  rationale: Ó túmọ̀ ní tààrà sí àwọn tí ó ní owó, ohun ìní, tàbí ọrọ̀. “Àwọn tí ó ní ọrọ̀” pa àpèjúwe alábàápín náà mọ́, kò sì sọ wọ́n di kíláàsì kan lásán.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: láti wọ ìjọba Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” jẹ́ ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún gbólóhùn Gíríìkì náà; “wọ” sọ ìṣípò sínú rẹ̀ ní èdè Yorùbá àdánidá.
- source_word: εἰσπορεύονται
  choice: láti wọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí wíwọlé. Ìlànà “ó ṣòro fún ... láti wọ” jẹ́ èdè Yorùbá tí ó rọrùn, ó sì pa ìtumọ̀ ọ̀rọ̀-ìṣe náà mọ́.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù nípa àwọn ọlọ́rọ̀ àti ìjọba Ọlọ́run
  choice: Ó ṣòro fún àwọn tí ó ní ọrọ̀ láti wọ ìjọba Ọlọ́run.
  alternative: Kò ṣeé ṣe rárá fún àwọn ọlọ́rọ̀ láti wọ ìjọba Ọlọ́run.
  rationale: Gíríìkì sọ pé ó ṣòro, kò sọ nínú ẹsẹ yìí pé kò ṣeé ṣe. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láìfikún ohun tí ẹsẹ yìí kò sọ.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ wo bí ... tó” mú ìró ìyàlẹ́nu inú Πῶς δυσκόλως jáde láìsọ ọ̀rọ̀ náà di ohun tí kò ṣeé ṣe.
