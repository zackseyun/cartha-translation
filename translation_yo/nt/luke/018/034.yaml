id: LUK.18.34
reference: Luke 18:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: yo
  text: Wọn kò sì lóye ọ̀kan nínú àwọn nǹkan wọ̀nyí; ọ̀rọ̀ yìí sì farapamọ́ fún wọn,[a] wọn kò sì mọ ohun tí a ń sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fífarapamọ́ fún wọn kò sọ ẹni tàbí ohun tó fi ọ̀rọ̀ náà pamọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: lóye
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí lílóye ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; “lóye” jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ ọpọlọ mọ́.
- source_word: οὐδὲν τούτων
  choice: ọ̀kan nínú àwọn nǹkan wọ̀nyí
  rationale: Ìtumọ̀ yìí fi hàn pé kò sí ìkankan nínú ọ̀pọ̀ ọ̀rọ̀ tó ṣáájú tí wọ́n lóye.
- source_word: τὸ ῥῆμα τοῦτο
  choice: ọ̀rọ̀ yìí
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí a sọ tàbí ìhìn rẹ̀, ó sì bá ààyè yìí mu láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: farapamọ́ fún wọn
  rationale: Ó pa ipò tí ohun náà wà ní fífarapamọ́ mọ́, kò sì sọ ẹni tàbí ohun tó fi í pamọ́.
- source_word: ἐγίνωσκον
  choice: mọ
  rationale: “Mọ” pa ìyàtọ̀ ọ̀rọ̀ mọ́ láàárín γινώσκω àti συνίημι (“lóye”), bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún ní èrò àìlóye.
- source_word: τὰ λεγόμενα
  choice: ohun tí a ń sọ
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ nínú participle present passive náà mọ́.
theological_decisions:
- issue: Irú fífarapamọ́ tí ó fa àìlóye àwọn ọmọ-ẹ̀yìn
  choice: Pa gbólóhùn náà mọ́ ní passive láì sọ ẹni tàbí ohun tó fi ọ̀rọ̀ náà pamọ́.
  alternative: Sọ ní pàtó pé Ọlọ́run ló fi í pamọ́, tàbí pé ìdàrúdàpọ̀ ọkàn wọn nìkan ló fà á.
  rationale: Gíríìkì kò dárúkọ olùṣe fífarapamọ́ náà; ìtumọ̀ náà gbọ́dọ̀ pa àìsọtẹ́lẹ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; a yà “lóye” sílẹ̀ kúrò ní “mọ” láti pa ìyàtọ̀ àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́.
