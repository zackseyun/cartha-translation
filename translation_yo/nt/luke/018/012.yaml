  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: yo
  text: Mo máa ń gbààwẹ̀ lẹ́ẹ̀mejì lọ́sẹ̀[a]; mo sì máa ń san ìdámẹ́wàá nínú gbogbo ohun tí mo bá rí gbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gígún, “lẹ́ẹ̀mejì ti Sábáàtì”; àṣà-ọrọ̀ náà túmọ̀ sí “lẹ́ẹ̀mejì lọ́sẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Mo máa ń gbààwẹ̀
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí níbí ń ṣàpèjúwe àṣà tí ẹni náà sọ pé òun ń ṣe déédéé; “máa ń” mú ìtumọ̀ àṣà yìí hàn ní Yorùbá.
- source_word: δὶς
  choice: lẹ́ẹ̀mejì
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ìgbà méjì.
- source_word: τοῦ σαββάτου
  choice: lọ́sẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìbátan pẹ̀lú Sábáàtì ní ti gírámà, gbólóhùn Gíríìkì yìí jẹ́ àṣà-ọrọ̀ fún àkókò ọ̀sẹ̀ kan; “lọ́sẹ̀” sọ ìwọ̀n ìgbà náà ní Yorùbá adayébá.
- source_word: ἀποδεκατῶ
  choice: mo máa ń san ìdámẹ́wàá
  rationale: Ọ̀rọ̀ ìṣe náà túmọ̀ sí fífúnni ní ìdá kan nínú mẹ́wàá; “san ìdámẹ́wàá” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, “máa ń” sì tún fi hàn pé àṣà déédéé ni.
- source_word: πάντα ὅσα
  choice: nínú gbogbo ohun tí
  rationale: Àkójọpọ̀ yìí mú gbogbo ohun tó wà lábẹ́ ìṣe náà sínú; “nínú gbogbo ohun tí” jẹ́ kedere pé ìdámẹ́wàá ni a yọ lára ohun gbogbo náà.
- source_word: κτῶμαι
  choice: mo bá rí gbà
  rationale: Ọ̀rọ̀ àárín yìí tọ́ka sí ohun tí ẹni kan rí gbà tàbí ní fún ara rẹ̀. “Rí gbà” pa ìtumọ̀ gbígba ohun tuntun mọ́, dípò yíyí i sí ohun tí ẹni náà kàn ní tẹ́lẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τοῦ σαββάτου nínú ọ̀rọ̀ nípa gbígba àwẹ̀
  choice: 'Ìtumọ̀ àkókò ti àṣà-ọrọ̀: “lọ́sẹ̀”'
  alternative: 'Ìtumọ̀ gígún régé: “ti Sábáàtì”'
  rationale: Gbólóhùn náà ń sọ iye ìgbà tí ó ń gbààwẹ̀, kì í ṣe ẹ̀kọ́ nípa pípa Sábáàtì mọ́. Ìtumọ̀ adayébá yìí kò jẹ́ kí òǹkàwé rò pé Sábáàtì gan-an ni ọjọ́ àwẹ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, tó lọ́wọ́, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Máa ń” fi ìṣe àṣà hàn, “rí gbà” sì yà κτῶμαι sọ́tọ̀ kúrò nínú ìtumọ̀ pé ẹni náà kàn ní ohun-ìní.
