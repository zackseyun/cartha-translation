source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: yo
  text: Ọkùnrin méjì gòkè lọ sí tẹ́ńpìlì láti gbàdúrà[a]; ọ̀kan jẹ́ Farisí, èkejì sì jẹ́ agbowó òde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí ilé-iṣẹ́ tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Ọkùnrin méjì
  rationale: Ní bí ἄνθρωποι tilẹ̀ lè túmọ̀ sí ènìyàn lápapọ̀, àwọn àpèjúwe akọ tó tẹ̀ lé e fi hàn pé ọkùnrin méjì ni a ń sọ̀rọ̀ nípa wọn.
- source_word: ἀνέβησαν
  choice: gòkè lọ
  rationale: Ó pa ìtumọ̀ lílọ sókè mọ́, èyí tó bá jíjìnà àti ipò gíga Jerúsálẹ́mù àti tẹ́ńpìlì mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εἰς τὸ ἱερόν
  choice: sí àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì nìkan; ‘àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ yìí hàn ní kedere láì nílò àlàyé ìsàlẹ̀.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: Aorist infinitive náà ń sọ ète tí wọ́n fi lọ; ‘láti gbàdúrà’ jẹ́ ìtumọ̀ Yorùbá tó tààrà, tó sì wọ́pọ̀.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: ọ̀kan ... èkejì
  rationale: Ọ̀nà yìí fi ìpín àwọn méjèèjì àti ìyàtọ̀ wọn hàn ní Yorùbá àdánidá.
- source_word: Φαρισαῖος
  choice: Farisí
  rationale: Èyí ni àkọsílẹ̀ orúkọ ẹgbẹ́ Júù náà ní ọ̀nà tó ṣeé kà ní Yorùbá.
- source_word: τελώνης
  choice: agbowó òde
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ń gba owó orí tàbí owó ibodè fún ìjọba; ‘agbowó òde’ jẹ́ ọ̀rọ̀ Yorùbá tó ti fìdí múlẹ̀, tó sì yà iṣẹ́ náà sọ́tọ̀ kúrò lọ́dọ̀ agbowó lásán.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ἱερόν àti ναός
  choice: àgbàlá tẹ́ńpìlì
  alternative: tẹ́ńpìlì
  rationale: Àyíká ọ̀rọ̀ ἱερόν ni gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà pàtó. Fífi ‘àgbàlá’ kun un dáàbò bo ìyàtọ̀ yìí láì gbé ìtumọ̀ ẹ̀kọ́ ìsìn kan wọ inú ẹsẹ náà.
- issue: Ìṣàmì akọ nínú ἄνθρωποι
  choice: ọkùnrin
  alternative: ènìyàn
  rationale: Bí ọ̀rọ̀ náà tilẹ̀ lè jẹ́ ti gbogbo ènìyàn, ọ̀rọ̀ Gíríìkì tó tẹ̀ lé e àti àwọn ẹni tí a dárúkọ tọ́ka sí ọkùnrin méjì níhìn-ín.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi ìtumọ̀ ἱερόν hàn ní pàtó nínú ọ̀rọ̀ gangan, nítorí náà kò sí àmì tàbí àlàyé ìsàlẹ̀ tó nílò.
