  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: yo
  text: Nígbà náà, àwọn tí wọ́n gbọ́ ọ̀rọ̀ náà sọ pé, “Ta wá ni a lè gbà là?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: béèrè pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tààrà ni ‘sọ,’ ọ̀rọ̀ tí wọ́n sọ jẹ́ ìbéèrè; ‘béèrè pé’ jẹ́ Yorùbá àdánidá, ó sì pa iṣẹ́ ọ̀rọ̀ náà mọ́.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti ìdáhùn sí ọ̀rọ̀ Jesu tó ṣáájú hàn.
- source_word: οἱ ἀκούσαντες
  choice: àwọn tí ó gbọ́ ọ̀rọ̀ náà
  rationale: Àpólà alábápín náà ń tọ́ka sí àwọn ènìyàn tí wọ́n gbọ́ ohun tí Jesu ṣẹ̀ṣẹ̀ sọ; ‘ọ̀rọ̀ náà’ mú ohun tí a gbọ́ yé kedere ní Yorùbá láìfi èrò tuntun kún un.
- source_word: Καὶ
  choice: wá
  rationale: Nínú ìbéèrè Yorùbá, ‘wá’ fi ìyàlẹ́nu àti ìtẹ̀síwájú èrò tí καί ní sílẹ̀ lọ́nà àdánidá.
- source_word: τίς
  choice: Ta
  rationale: Ó jẹ́ ọ̀rọ̀ ìbéèrè nípa ẹni tí ó ṣeé ṣe kí ó rí ìgbàlà.
- source_word: δύναται
  choice: lè
  rationale: Ó sọ agbára tàbí ṣíṣeéṣe di mímọ̀ ní Yorùbá tó rọrùn.
- source_word: σωθῆναι
  choice: là
  rationale: ‘Là’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbàlà ní ìtumọ̀ ẹ̀mí nínú àyíká yìí, ó sì pa ìrísí àìṣe ti Gíríìkì mọ́ láìsọ ẹni tó ń gbà là.
theological_decisions:
- issue: Ìtumọ̀ σωθῆναι nínú àyíká ọ̀rọ̀
  choice: là ní ìtumọ̀ ìgbàlà
  alternative: bó là tàbí gba ìdáǹdè kúrò nínú ewu kan
  rationale: Àyíká náà ń sọ nípa wíwọ ìjọba Ọlọ́run àti ìṣòro ìgbàlà; nítorí náà, ìtumọ̀ ẹ̀mí ni ó ga jù, ṣùgbọ́n a kò fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘Ta wá’ láti fi ìyàlẹ́nu ìbéèrè hàn lọ́nà àdánidá; a kò lo àmì àlàyé nítorí kò sí ìyàtọ̀ pàtàkì tó nílò àlàyé.
