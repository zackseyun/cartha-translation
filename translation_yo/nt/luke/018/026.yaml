  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ gbogbogbò ti ẹsẹ̀ náà, ó sì tọ́ka sí àwọn olùgbọ́ ọ̀rọ̀ Jesu àti sí ìgbàlà. Síbẹ̀, ‘béèrè pé’ yí ọrọ̀-ìṣe aorist Εἶπαν (‘wọ́n sọ’) sí ‘wọ́n béèrè’; bí ó tilẹ̀ jẹ́ pé ohun tí wọ́n sọ jẹ́ ìbéèrè, ìyípadà yìí kò ṣe pàtó nínú Gíríìkì. Bákan náà, ‘Ta wá ni ó lè là?’ lè túmọ̀ sí ẹni tó lè sá tàbí tó lè yè, dípò ìrísí aláìṣe σωθῆναι, ‘láti gba ẹni là / láti ní ìgbàlà.’
  naturalness: ‘Nígbà náà’ àti ‘àwọn tí wọ́n gbọ́ ọ̀rọ̀ náà’ jẹ́ Yorùbá ìgbàlódé tó yéni. ‘Ta wá ni a lè gbà là?’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó dá ìbéèrè náà sí ìrísí ìgbàlà aláìṣe, ó sì yẹ fún ìyàlẹ́nu inú ọ̀rọ̀ náà.
  terminology: A yẹ kí a lo ‘gbà là’ fún σωθῆναι nínú àyíká yìí. Ó ṣe kedere ju ‘là’ lọ pé ọ̀rọ̀ náà jẹ́ ti ìgbàlà, kì í ṣe sá kúrò nínú ewu lasán. A pa ‘wá’ mọ́ láti fi ìtẹ̀síwájú/ìyàlẹ́nu ti καί hàn láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
