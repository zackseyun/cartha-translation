source:
  edition: SBLGNT
  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: yo
  text: Ó sì kígbe pé, “Jésù, Ọmọ Dáfídì[a], ṣàánú mi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Dáfídì” jẹ́ oyè Mèsáyà, ó ń ránni létí ọba tí a ṣèlérí láti ìran Dáfídì; ó tún lè túmọ̀ sí “àtọmọdọ́mọ Dáfídì” ní ìtumọ̀ gbogbogbò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: ó kígbe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíké ní ohùn rara. “Ó kígbe” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìró ohùn àti ìkánjú ẹ̀bẹ̀ náà hàn.
- source_word: λέγων
  choice: pé
  rationale: Ní ìtàn Yorùbá, “pé” ló fi ọ̀rọ̀ tí ẹni náà sọ tààrà bẹ̀rẹ̀ lọ́nà àdánidá; kò pọn dandan láti tún fi “ó ń sọ” kún un.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí a fi ń kọ orúkọ Ἰησοῦς ní Yorùbá, níhìn-ín sì ni a lò ó gẹ́gẹ́ bí ọ̀rọ̀ ìpè.
- source_word: υἱὲ Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: “Ọmọ Dáfídì” pa ìrísí oyè ọba-Mèsáyà inú ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí ẹni tí ó jẹ́ àtọmọdọ́mọ Dáfídì.
- source_word: ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí jẹ́ ẹ̀bẹ̀ tààrà fún ìṣe àánú, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó níyì, tí ó sì pa ìkánjú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ oyè υἱὲ Δαυίδ gẹ́gẹ́ bí oyè Mèsáyà
  choice: Ọmọ Dáfídì
  alternative: Àtọmọdọ́mọ Dáfídì
  rationale: Nínú àyíká ìtàn Lúùkù, ọ̀rọ̀ yìí ní agbára gẹ́gẹ́ bí oyè ọba tí a ṣèlérí láti ìran Dáfídì. “Ọmọ Dáfídì” pa ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ yẹn mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó níyì, tí àwọn òǹkàwé lásán lè lóye. “Kígbe” fi ohùn rara àti ìkánjú hàn, “ṣàánú fún mi” sì jẹ́ ẹ̀bẹ̀ àdánidá tí kò ní àmì ẹ̀kọ́ ìjọ kan pàtó.
