  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: yo
  text: Olórí kan béèrè lọ́wọ́ rẹ̀ pé, “Olùkọ́ rere, kí ni mo gbọdọ̀ ṣe láti jogún ìyè àìnípẹ̀kun?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Kí ni, lẹ́yìn tí mo bá ti ṣe é, ni èmi yóò jogún ìyè àìnípẹ̀kun?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti béèrè tàbí fi ìbéèrè kan ẹni; ‘béèrè lọ́wọ́ rẹ̀’ jẹ́ èdè Yorùbá àdánidá nínú ìtàn.
- source_word: τις ἄρχων
  choice: Olórí kan
  rationale: ‘Kan’ fi hàn pé ẹni náà kò jẹ́ ẹni tí a dárúkọ, ‘olórí’ sì pa ìtumọ̀ ẹni tí ó ní ipò àṣẹ mọ́ láìsọ irú ọ́fíìsì rẹ̀ ní pàtó.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Olùkọ́ rere
  rationale: Ó pa ìtumọ̀ ìpè taara náà mọ́, pẹ̀lú ọ̀rọ̀ ‘rere’ tí Jésù yóò dáhùn sí ní ẹsẹ tó tẹ̀ lé e.
- source_word: τί ποιήσας
  choice: kí ni mo gbọdọ̀ ṣe
  rationale: Ó mú ipa ọ̀nà tàbí ohun tí ẹni náà rò pé ó jẹ́ dandan nínú participle aorist náà jáde ní Yorùbá tó ṣe kedere, láìjẹ́wọ́ pé ìrònú rẹ̀ pé iṣẹ́ ni yóò mú ìyè wá tọ́.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání fún ìyè tí kò ní òpin, ó sì bá lílo ọ̀rọ̀ náà nínú Lúùkù mu.
- source_word: κληρονομήσω
  choice: jogún
  rationale: ‘Jogún’ pa àwòrán ogún inú ọ̀rọ̀ Gíríìkì mọ́ dípò lílo ọ̀rọ̀ gbogbogbò bí ‘rí gbà.’
theological_decisions:
- issue: Ìbéèrè ìgbàlà tí a gbé kalẹ̀ nípa ohun tí ènìyàn ṣe
  choice: kí ni mo gbọdọ̀ ṣe láti jogún ìyè àìnípẹ̀kun?
  alternative: kí ni èmi yóò ṣe, tí èmi yóò fi jogún ìyè àìnípẹ̀kun?
  rationale: Ìtumọ̀ náà pa bí olórí náà ṣe gbé ìbéèrè rẹ̀ kalẹ̀ nípa iṣẹ́ tí ó yẹ kí ó ṣe mọ́, láìfi èrò ẹ̀kọ́ ìgbàlà mìíràn sínú ọ̀rọ̀ rẹ̀ tàbí yanjú ìforígbárí ẹ̀kọ́ ìsìn náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Olórí’ fún ẹni tó ní àṣẹ láìsọ ipò rẹ̀ ní pàtó; a sì lo ‘jogún’ láti pa àwòrán ogún inú orísun mọ́.
