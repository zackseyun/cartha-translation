  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: yo
  text: Olúwa sì wí pé, “Ẹ gbọ́ ohun tí onídàájọ́ aláìṣòdodo[a] náà ń sọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀-ọ̀rọ̀: “onídàájọ́ ti àìṣòdodo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: wí pé
  rationale: Aorist náà jẹ́ ọ̀rọ̀ ìtàn ní àkókò tí ó ti kọjá; “wí pé” jẹ́ ọ̀nà àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: “Sì” fi ìtẹ̀síwájú ìtàn hàn láì sọ ọ́ di àmì àkókò pàtó.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Ní ìtàn Lúùkù, ọ̀rọ̀ náà ń tọ́ka sí Jésù gẹ́gẹ́ bí oyè; “Olúwa” pa ìwọ̀n oyè àti ìtumọ̀ rẹ̀ mọ́.
- source_word: Ἀκούσατε
  choice: Ẹ gbọ́
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì ń pè wọ́n láti fetí sí ohun tí yóò tẹ̀ lé.
- source_word: τί
  choice: ohun tí
  rationale: Ó ń tọ́ka sí àkóónú ọ̀rọ̀ onídàájọ́ náà, kì í ṣe ọ̀nà tí ó gbà sọ ọ́.
- source_word: ὁ κριτὴς
  choice: onídàájọ́ náà
  rationale: “Onídàájọ́” ni ìtumọ̀ tààrà, “náà” sì fi hàn pé ẹni tí a ti mẹ́nu kàn nínú àkàwé ni.
- source_word: τῆς ἀδικίας
  choice: aláìṣòdodo
  rationale: Genitive náà ń ṣàpèjúwe ìwà onídàájọ́. “Aláìṣòdodo” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìwà búburú àti àìṣe òdodo mọ́.
- source_word: λέγει
  choice: ń sọ
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ pa ìwúrí present tense Gíríìkì mọ́, ó sì bá Yorùbá mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí ó ń tọ́ka sí Jésù
  choice: Olúwa
  alternative: ọ̀gá
  rationale: “Olúwa” pa ìwọ̀n oyè tí Lúùkù lò fún Jésù mọ́; “ọ̀gá” lè dín un kù sí ipò àjọṣe láàárín ènìyàn lásán.
- issue: Bí a ṣe túmọ̀ τῆς ἀδικίας
  choice: aláìṣòdodo
  alternative: ti àìṣòdodo
  rationale: Gíríìkì lè túmọ̀ ní ọ̀rọ̀-ọ̀rọ̀ sí “onídàájọ́ ti àìṣòdodo,” ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí àpèjúwe ìwà rẹ̀. Ìtumọ̀ àdánidá kò yanjú bí àìṣòdodo náà ṣe hàn ju ohun tí ẹsẹ̀ sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “Ẹ” nítorí àṣẹ náà jẹ́ fún ọ̀pọ̀ olùgbọ́, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
