id: LUK.18.7
reference: Luke 18:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: yo
  text: Ǹjẹ́ Ọlọ́run kì yóò ṣe ìdájọ́ òdodo fún àwọn àyànfẹ́ rẹ̀, àwọn tí ń ké sí i ní ọ̀sán àti ní òru? Ṣé yóò sì pẹ́ láti ṣe ìdájọ́ náà fún wọn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó tilẹ̀ jẹ́ pé ó ń ní sùúrù sí wọn,” tàbí, “ṣé ó ń ní sùúrù sí wọn?” Gbólóhùn Gíríìkì náà lè tọ́ka sí sùúrù tàbí ìfaradà dípò ìpẹ́ nínú ṣíṣe ìdájọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: mú ìdájọ́ òdodo wá
  rationale: Ó pa ìtumọ̀ àtúnṣe ẹjọ́ àti dídá ẹni láre mọ́ nínú àyíká adájọ́ aláìṣòdodo, láìfi èrò ìgbẹ̀san ara ẹni kún un.
- source_word: ἐκλεκτῶν
  choice: àwọn àyànfẹ́
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ fún àwọn tí Ọlọ́run yàn; ‘àwọn àyànfẹ́’ jẹ́ èdè Yorùbá tó mọ́gbọ́n dání, kò sì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan pàtó lé e lórí.
- source_word: βοώντων
  choice: tí wọ́n ń ké pè é
  rationale: Ó fi agbára àti ìtẹ̀síwájú ẹ̀bẹ̀ wọn hàn, ó sì bá ọ̀rọ̀ àdúrà nínú àyíká náà mu.
- source_word: ἡμέρας καὶ νυκτός
  choice: tọ̀sán-tòru
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá yìí pa ìtumọ̀ pípè ní ọ̀sán àti ní òru mọ́.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Ṣé yóò sì pẹ́ láti dá wọn lóhùn?
  rationale: Nínú àyíká ẹsẹ tó tẹ̀ lé e, gbolohun yìí lè béèrè bóyá Ọlọ́run yóò falẹ̀ láti ṣe ìdájọ́ fún wọn. Ìtumọ̀ ìpamọ́ra tàbí sùúrù tí ọ̀rọ̀ Gíríìkì tún lè ní ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οὐ μὴ ποιήσῃ
  choice: kì yóò mú ... wá
  rationale: Ìbéèrè àsọyé yìí ń retí ìdáhùn rere, ó sì gbé ìtẹnumọ́ ìkọ̀ Gíríìkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún θεός nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ μακροθυμεῖ ἐπ’ αὐτοῖς nípa ìwà Ọlọ́run àti bí ó ṣe ń ṣiṣẹ́
  choice: 'A gbé e kalẹ̀ gẹ́gẹ́ bí ìbéèrè nípa fífalẹ̀ láti dá wọn lóhùn: ‘Ṣé yóò sì pẹ́ láti dá wọn lóhùn?’'
  alternative: Ó lè túmọ̀ sí ‘bí ó tilẹ̀ ń ní sùúrù sí wọn’ tàbí ‘ṣé ó ń ní sùúrù sí wọn?’
  rationale: Èdè Gíríìkì lè tọ́ka sí sùúrù tàbí ìpamọ́ra, ṣùgbọ́n àyíká lẹ́sẹ̀kẹsẹ̀, pàápàá ẹsẹ 8, tẹnumọ́ bí Ọlọ́run yóò ṣe tètè dá àwọn ènìyàn rẹ̀ láre. Ọ̀rọ̀ inú ẹsẹ náà pa ìṣàn ìbéèrè mọ́, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́ láìyanjú gbogbo àìdánilójú náà.
translation_notes:
  register: Yorùbá àpapọ̀, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘Ǹjẹ́’ àti ‘Ṣé’ mú ìbéèrè àsọyé náà jáde lọ́nà àdánidá; ‘tọ̀sán-tòru’ pa àwòrán àkókò Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
