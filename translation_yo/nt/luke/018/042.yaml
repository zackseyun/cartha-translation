  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Kí ojú rẹ kí ó là[a]; ìgbàgbọ́ rẹ ti gbà ọ́ là[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Kí ojú rẹ tún là.” Nínú àyíká ìwòsàn, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríran padà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbàgbọ́ rẹ ti mú ọ láradá” tàbí “ìgbàgbọ́ rẹ ti wò ọ́ sàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwòsàn àti sí ìgbàlà.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìtàn tó ṣáájú láìfi ìtumọ̀ míì kún un.
- source_word: εἶπεν αὐτῷ
  choice: wí fún un
  rationale: Èyí jẹ́ ọ̀nà àdánidá, tó sì ní iyì, láti sọ pé Jésù bá ọkùnrin náà sọ̀rọ̀ ní tààràtà.
- source_word: Ἀνάβλεψον
  choice: Kí ojú rẹ ríran
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí ríríran tàbí pípadà ríran, kì í ṣe wíwo sókè lásán. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún fífi dandan sọ pé ẹni náà ti ríran rí.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Níhìn-ín, ó tọ́ka sí bí ọkùnrin náà ṣe gbẹ́kẹ̀ lé Jésù. “Ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ ẹ̀sìn àti ti ìgbẹ́kẹ̀lé mọ́.
- source_word: σέσωκέν
  choice: ti gbà ọ́ là
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígbàlà, mímú lára dá, tàbí wíwòsàn. “Ti gbà ọ́ là” pa ìtumọ̀ gbígbòòrò náà mọ́, láìdín un kù sí ìwòsàn ara nìkan.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ σῴζω nínú ìtàn ìwòsàn
  choice: ti gbà ọ́ là
  alternative: ti mú ọ lára dá; ti wò ọ́ sàn
  rationale: Àyíká náà ní í ṣe pẹ̀lú ìmúláradá ojú, ṣùgbọ́n ọ̀rọ̀ náà tún lè ní ìtumọ̀ gbígbàlà tó jinlẹ̀. Yíyan “ti gbà ọ́ là” pa ìforígbárí ìtumọ̀ yìí mọ́ dípò kí ó yanjú rẹ̀ sí ìwòsàn ara nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Wí fún un” bá ìforúkọsílẹ̀ ìtàn mímọ́ mu láìjẹ́ ọ̀rọ̀ àtijọ́ tó ṣòro; “Kí ojú rẹ ríran” sì jẹ́ àdánidá fún ọ̀rọ̀ ìwòsàn.
