  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: yo
  text: Ṣùgbọ́n ó ní, “Àwọn ohun tí kò ṣeé ṣe fún ènìyàn ni ó ṣeé ṣe fún Ọlọ́run.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: àwọn ohun tí kò ṣeé ṣe
  rationale: Àjídì neuter plural tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ni; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àwọn ohun tí agbára kò ká mọ́.
- source_word: παρὰ ἀνθρώποις
  choice: fún ènìyàn
  rationale: παρά pẹ̀lú dative fi ojú-ìwòye tàbí agbègbè agbára hàn níbí. “Fún ènìyàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ohun tí kò ṣeé ṣe ní ipò ẹ̀dá ènìyàn; “ènìyàn” níbí ń tọ́ka sí gbogbo aráyé.
- source_word: δυνατά
  choice: ṣeé ṣe
  rationale: Ó jẹ́ òdìkejì ἀδύνατα nínú ìṣètò neuter plural kan náà; “ṣeé ṣe” ni ìbámu Yorùbá tó tààrà jù lọ.
- source_word: παρὰ τῷ θεῷ
  choice: fún Ọlọ́run
  rationale: Gẹ́gẹ́ bí παρά pẹ̀lú ἀνθρώποις, ó ń fi ojú-ìwòye tàbí agbègbè agbára hàn. “Fún Ọlọ́run” pa ìyàtọ̀ láàárín àìlèṣe ènìyàn àti agbára Ọlọ́run mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὁ δὲ εἶπεν
  choice: Ṣùgbọ́n ó ní
  rationale: δέ jẹ́ asopọ̀ alátakò díẹ̀ tàbí ìyípadà ìtàn. “Ṣùgbọ́n ó ní” bá ìdáhùn sí ọ̀rọ̀ tó ṣáájú mu, ó sì jẹ́ àṣà ìtàn Yorùbá.
theological_decisions:
- issue: Ìwọ̀n ohun tí ó ṣeé ṣe fún Ọlọ́run
  choice: Ẹsẹ̀ náà sọ pé àwọn ohun tí kò ṣeé ṣe fún ènìyàn ṣeé ṣe fún Ọlọ́run, ní àyíká ọ̀rọ̀ ìgbàlà.
  alternative: Kí a túmọ̀ rẹ̀ sí òwe kan nípa agbára Ọlọ́run lórí gbogbo ohun àròjinlẹ̀ láìsí ààlà kankan.
  rationale: Gíríìkì fi àìlèṣe ènìyàn àti agbára Ọlọ́run wéra nínú àyíká ọ̀rọ̀ ìgbàlà àti bí ọlọ́rọ̀ ṣe lè wọ ìjọba Ọlọ́run. Ìtumọ̀ náà pa gbólóhùn gbooro rẹ̀ mọ́ láìfi ẹ̀kọ́ ìmọ̀-òye tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A yan “ènìyàn” gẹ́gẹ́ bí orúkọ àpapọ̀ fún ἀνθρώποις. Kò sí àmì àlàyé ẹsẹ̀ nítorí “fún ènìyàn / fún Ọlọ́run” ti fi ìtumọ̀ παρά hàn ní ọ̀nà àdánidá.
