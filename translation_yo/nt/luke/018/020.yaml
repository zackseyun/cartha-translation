  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: yo
  text: 'O mọ àwọn àṣẹ náà: ‘Má ṣe ṣe àgbèrè[a]; má ṣe pààyàn; má ṣe jalè; má ṣe jẹ́rìí èké; bọ̀wọ̀ fún baba rẹ àti ìyá rẹ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà ìbílẹ̀ sí i: “Ìwọ kò gbọdọ̀ ṣe àgbèrè ... Ìwọ kò gbọdọ̀ pààyàn ... Ìwọ kò gbọdọ̀ jalè ... Ìwọ kò gbọdọ̀ jẹ́rìí èké.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: àwọn àṣẹ náà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn àṣẹ tí a mọ̀ dáadáa, pàápàá àwọn àṣẹ inú Òfin Mẹ́wàá; “àwọn àṣẹ náà” pa ìtumọ̀ àṣẹ aláṣẹ mọ́ ní Yorùbá àdánidá.
- source_word: οἶδας
  choice: O mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, ìtumọ̀ rẹ̀ ní Koiné jẹ́ ti àsìkò ìsinsìnyí; “O mọ” ni Yorùbá tó ṣe déédé.
- source_word: Μὴ μοιχεύσῃς
  choice: Má ṣe ṣe àgbèrè
  rationale: “Ṣe àgbèrè” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìbálòpọ̀ pẹ̀lú ẹni tí kì í ṣe ọkọ tàbí aya ẹni; “Má ṣe” fi agbára ìfòfinṣè hàn.
- source_word: Μὴ φονεύσῃς
  choice: má ṣe pààyàn
  rationale: φονεύω túmọ̀ sí pípa ènìyàn lọ́nà ìpànìyàn, kì í ṣe gbogbo irú pípa; “pààyàn” pa ìyàtọ̀ yìí mọ́.
- source_word: Μὴ κλέψῃς
  choice: má ṣe jalè
  rationale: “Jalè” ni ọ̀rọ̀ Yorùbá àdánidá, tó sì bá ìtumọ̀ κλέπτω mu ní tààràtà.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: má ṣe jẹ́rìí èké
  rationale: Gbólóhùn yìí pa èdè ẹ̀rí àti ìfarahàn rẹ̀ nínú Òfin Mẹ́wàá mọ́, dípò yíyí i sí ọ̀rọ̀ gbogbogbò nípa irọ́.
- source_word: Τίμα
  choice: bọ̀wọ̀ fún
  rationale: “Bọ̀wọ̀ fún” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ọlá àti iyì tó yẹ fún àwọn òbí.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: baba rẹ àti ìyá rẹ
  rationale: Ìtumọ̀ náà dárúkọ àwọn òbí méjèèjì ní kedere, ó sì tún aṣípò oní-nǹkan náà sọ ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn ìfòfinṣè tó dà bí ti Òfin Mẹ́wàá
  choice: Lo ìfòfinṣè Yorùbá òde òní, “Má ṣe ...”
  alternative: Lo ọ̀nà àtọwọ́dọ́wọ́ bí “Ìwọ kò gbọdọ̀ ...”
  rationale: Aorist subjunctive pẹ̀lú μή ní Gíríìkì ní agbára ìfòfinṣè. “Má ṣe ...” sọ agbára náà ní kedere àti ní Yorùbá òde òní láìfi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àwọn ìfòfinṣè náà jẹ́ kúkúrú láti pa ìró Òfin Mẹ́wàá mọ́.
