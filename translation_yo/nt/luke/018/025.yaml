language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: yo
  text: Nítorí, ó rọrùn fún ràkúnmí láti gba ojú abẹ́rẹ́ kọjá ju fún ọlọ́rọ̀ láti wọ inú ìjọba Ọlọ́run lọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ̀rọ̀ náà ní tààràtà sí i, “láti gba ojú abẹ́rẹ́ kan kọjá.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan ti dábàá àwọn àlàyé bí ẹnubodè tóóró kan tí a ń pè ní “Ojú Abẹ́rẹ́,” tàbí pé “okùn” ni ọ̀rọ̀ náà túmọ̀ sí dípò “ràkúnmí”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà níbí ni κάμηλον, ìyẹn “ràkúnmí.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: ó rọrùn ... ju ... lọ
  rationale: Èyí ni ọ̀nà àdánidá tí Yorùbá fi ń sọ ìfiwéra; ó fi ìtumọ̀ comparative náà hàn kedere.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ipa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àlàyé tó so òwe yìí mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: κάμηλον
  choice: ràkúnmí
  rationale: Ìtumọ̀ déédéé ti κάμηλος ni ‘ràkúnmí’; kò sí ẹ̀rí nínú ọ̀rọ̀ Gíríìkì yìí láti fi ‘okùn’ rọ́pò rẹ̀.
- source_word: διὰ τρήματος βελόνης
  choice: láti gba ojú abẹ́rẹ́ wọlé
  rationale: ‘Ojú abẹ́rẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ihò kékeré inú abẹ́rẹ́, ‘gba ... wọlé’ sì mú ìdarí ìṣípò διὰ ... εἰσελθεῖν jáde.
- source_word: εἰσελθεῖν
  choice: láti ... wọlé / láti wọ
  rationale: Àwọn ọ̀nà méjèèjì jẹ́ àdánidá ní àyíká wọn, wọ́n sì túmọ̀ sí wíwọ inú ohun kan gẹ́gẹ́ bí infinitive Gíríìkì náà.
- source_word: πλούσιον
  choice: ọlọ́rọ̀
  rationale: Adjective Gíríìkì náà dúró gẹ́gẹ́ bí orúkọ ẹni; ‘ọlọ́rọ̀’ ṣe bẹ́ẹ̀ pẹ̀lú ní Yorùbá láìfi akọ tàbí abo tí ọ̀rọ̀ náà kò nílò kún un.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: láti wọ ìjọba Ọlọ́run
  rationale: Ó pa ìdarí εἰς àti gbólóhùn pàtàkì ‘ìjọba Ọlọ́run’ mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ àwòrán ràkúnmí àti ojú abẹ́rẹ́
  choice: 'Pa àwòrán àsọdùn gidi náà mọ́: ràkúnmí ń gba ojú abẹ́rẹ́ wọlé.'
  alternative: Kí ‘ojú abẹ́rẹ́’ túmọ̀ sí ẹnubodè kékeré kan, tàbí kí ‘okùn’ rọ́pò ‘ràkúnmí.’
  rationale: Ọ̀rọ̀ Gíríìkì tí a fún wa ka κάμηλον, ‘ràkúnmí,’ àwòrán náà sì mọ̀ọ́mọ̀ fi ohun tí kò ṣeé ṣe hàn láti tẹnumọ́ bí ọ̀rọ̀ náà ti ṣòro tó. Kò yẹ kí a mú àlàyé àṣà tó wá lẹ́yìn wọ inú ẹsẹ̀ náà láìsí ẹ̀rí ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. Ìṣètò ‘ó rọrùn ... ju ... lọ’ jẹ́ ti Yorùbá àdánidá, ‘ojú abẹ́rẹ́’ sì pa àwòrán orísun mọ́.
