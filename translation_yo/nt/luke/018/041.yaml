id: LUK.18.41
reference: Luke 18:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: yo
  text: “Kí ni o fẹ́ kí n ṣe fún ọ?” Ó sì wí pé, “Olúwa[a], kí n lè tún ríran.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá”; κύριε ní èdè Gíríìkì lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí a fi ń pe ẹnì kan, bó tilẹ̀ jẹ́ pé “Olúwa” ni ìtumọ̀ àkọ́kọ́ wa fún κύριος.
    reason: alternative_reading
  - marker: b
    text: Tàbí “kí n lè gba ìríran mi padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Kí ni
  rationale: Ọ̀rọ̀ ìbéèrè yìí ń béèrè ohun pàtó tí ọkùnrin náà fẹ́; ‘Kí ni’ ni ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: σοι
  choice: fún ọ
  rationale: Dátífù náà ní ìtumọ̀ ẹni tí iṣẹ́ náà máa ṣe àǹfààní fún; ‘fún ọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: θέλεις ποιήσω
  choice: o fẹ́ kí n ṣe
  rationale: Àkópọ̀ yìí ń sọ ìfẹ́ ẹni nípa ohun tí olùbánisọ̀rọ̀ yóò ṣe; èdè Yorùbá àdánidá ni ‘o fẹ́ kí n ṣe.’
- source_word: ὁ δὲ εἶπεν
  choice: Ó sì dáhùn pé
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakò líle hàn. Nítorí pé ọ̀rọ̀ rẹ̀ jẹ́ ìdáhùn sí ìbéèrè, ‘dáhùn’ ṣe kedere, ó sì jẹ́ ti àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ọ̀wọ̀ àti àǹfààní ìtumọ̀ tó jinlẹ̀ nípa ẹni tí Jésù jẹ́ mọ́; ‘Ọ̀gá’ tún ṣeé ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀.
- source_word: ἵνα
  choice: kí n lè
  rationale: Nínú àyíká ìbéèrè yìí, ó ń ṣàfihàn ohun tí ẹni náà ń fẹ́ kí ó ṣẹlẹ̀; ‘kí n lè’ jẹ́ Yorùbá tó mọ́gbọ́n dání.
- source_word: ἀναβλέψω
  choice: ríran padà
  rationale: Nínú àyíká ìwòsàn, ọ̀rọ̀ náà túmọ̀ sí ríríran lẹ́ẹ̀kan sí i tàbí ríríran tí ó sọnù padà, kì í ṣe wíwo sókè lásán.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí a fi ń pe Jésù ní tààrà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni ìtumọ̀ àkọ́kọ́ fún κύριος, ó sì pa àìdánilójú tó wà láàárín ọ̀rọ̀ ọ̀wọ̀ lásán àti ìmọ̀ ẹni tí Jésù jẹ́ mọ́, dípò kí a fi tipátipá yan ọ̀kan.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti àdánidá. Ìbéèrè Jésù jẹ́ tààrà, ìdáhùn ọkùnrin náà sì kúkúrú bíi ti orísun Gíríìkì.
