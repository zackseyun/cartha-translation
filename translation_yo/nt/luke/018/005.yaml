source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: yo
  text: Síbẹ̀, nítorí pé opó yìí ń yọ mí lẹ́nu, èmi yóò ṣe ìdájọ́ òdodo fún un[a], kí ó má bàa máa wá nígbà gbogbo, kí ó sì rẹ̀ mí tán[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “èmi yóò dá a láre.” Ní àwọn àyíká kan, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbẹ̀san fún un,” ṣùgbọ́n níbí ó ń tọ́ka sí fífún un ní ìdájọ́ lábẹ́ òfin.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “lù mí lábẹ́ ojú”; gẹ́gẹ́ bí àkànlò èdè, “rẹ̀ mí tán” tàbí “dá mi lágara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: síbẹ̀, nítorí pé … ń yọ mí lẹ́nu
  rationale: «διά» pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni tí a sọ di orúkọ fi ìdí hàn, «γε» sì tẹnumọ́ ọn. «ń yọ mí lẹ́nu» jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdààmú tí ó ń bá a lọ.
- source_word: τὴν χήραν ταύτην
  choice: opó yìí
  rationale: Ó pa orúkọ ẹni náà àti àìlera ipò rẹ̀ nínú àwùjọ mọ́, gẹ́gẹ́ bí àyíká òwe náà ṣe béèrè.
- source_word: ἐκδικήσω αὐτήν
  choice: èmi yóò ṣe ìdájọ́ òdodo fún un
  rationale: Nínú àyíká ilé-ẹjọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí fífún un ní ìdájọ́ tàbí ìtúnṣe ẹ̀tọ́, kì í ṣe gbígbẹ̀san ara ẹni.
- source_word: ἵνα μὴ
  choice: kí ó má bàa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète adájọ́ náà hàn.
- source_word: εἰς τέλος ἐρχομένη
  choice: bí ó ṣe ń wá nígbà gbogbo
  rationale: Ó fi ìwá léraléra hàn láìfi dandan pinnu pé «títí láé» ni ìtumọ̀ náà.
- source_word: ὑπωπιάζῃ με
  choice: rẹ̀ mí tán
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ ní tààràtà sí lílù lábẹ́ ojú, nínú àyíká yìí ó jẹ́ àkànlò èdè fún dídáni lágara tàbí rírẹni tán.
theological_decisions:
- issue: Ìtumọ̀ ἐκδικήσω nínú òwe nípa àdúrà àti ìdájọ́
  choice: èmi yóò ṣe ìdájọ́ òdodo fún un
  alternative: èmi yóò gbẹ̀san fún un; èmi yóò dá a láre
  rationale: Àyíká náà jẹ́ ti ìtúnṣe ẹ̀tọ́ lábẹ́ òfin. Yíyan «ìdájọ́ òdodo» pa ìsopọ̀ mọ́ bí Ọlọ́run ṣe ń fún àwọn àyànfẹ́ rẹ̀ ní ìdájọ́ nínú àwọn ẹsẹ tó yí i ká, láìfi èrò ìgbẹ̀san ara ẹni kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
