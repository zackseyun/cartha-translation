source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἤθελεν ἐπὶ χρόνον, μετὰ ⸂ταῦτα δὲ⸃ εἶπεν ἐν ἑαυτῷ· Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι ⸂οὐδὲ ἄνθρωπον⸃ ἐντρέπομαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: yo
  text: Ó sì kọ̀ fún ìgbà díẹ̀, ṣùgbọ́n lẹ́yìn náà ó sọ fún ara rẹ̀ pé, ‘Bí ó tilẹ̀ jẹ́ pé èmi kò bẹ̀rù Ọlọ́run, tí èmi kò sì bọ̀wọ̀ fún ẹnikẹ́ni,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: ó kọ̀
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ó ń bá a lọ ní kíkọ̀ fún àkókò kan; ‘ó kọ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ àìfẹ́ rẹ̀ láti ṣe ohun tí obìnrin náà béèrè.
- source_word: ἐπὶ χρόνον
  choice: fún ìgbà díẹ̀
  rationale: Gbólóhùn náà túmọ̀ sí àkókò kan tí a kò sọ bí ó ti gùn tó; ‘fún ìgbà díẹ̀’ ṣe èyí ní Yorùbá àdánidá.
- source_word: μετὰ ταῦτα δὲ
  choice: ṣùgbọ́n lẹ́yìn náà
  rationale: Ó pa ìtẹ̀lé àkókò àti ìyípadà kékeré inú ìtàn mọ́.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: ó sọ nínú ara rẹ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ inú ọkàn mọ́ dípò yíyí i padà sí ‘ó rò’ nìkan.
- source_word: Εἰ καὶ
  choice: Bí ó tilẹ̀ jẹ́ pé
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà jẹ́ ìfàyègba ohun tí onídàájọ́ náà mọ̀ nípa ara rẹ̀, kì í ṣe àní-àní.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: èmi kò bẹ̀rù Ọlọ́run
  rationale: ‘Bẹ̀rù Ọlọ́run’ pa ọ̀rọ̀ orísun àti ìtumọ̀ ìwà rere ẹ̀sìn rẹ̀ mọ́ láìdín líle ọ̀rọ̀ onídàájọ́ náà kù.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: bẹ́ẹ̀ ni èmi kò bọ̀wọ̀ fún ẹnikẹ́ni
  rationale: Níbi yìí ἐντρέπομαι túmọ̀ sí fífi ọ̀wọ̀ tàbí iyì fún ẹlòmíràn. Bí ἄνθρωπον tilẹ̀ jẹ́ ẹyọ ní Gíríìkì, ó jẹ́ àpapọ̀ ní ìtumọ̀; ‘ẹnikẹ́ni’ ni Yorùbá àdánidá tí ó sì kan gbogbo ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπον gẹ́gẹ́ bí ẹyọ àpapọ̀
  choice: ẹnikẹ́ni
  alternative: ènìyàn
  rationale: Gíríìkì fi ọ̀rọ̀ ẹyọ tí ó dúró fún gbogbo ènìyàn wé ‘Ọlọ́run’ ní ìtakò. ‘Ẹnikẹ́ni’ sọ ìtumọ̀ àpapọ̀ náà ní Yorùbá tí ó ṣe kedere, láìfi akọ tàbí abo kún ohun tí orísun kò fi sí.
- issue: Ìtumọ̀ φοβοῦμαι nípa Ọlọ́run
  choice: bẹ̀rù Ọlọ́run
  alternative: bọ̀wọ̀ fún Ọlọ́run
  rationale: Orísun lè ní ìtumọ̀ ìbẹ̀rù pẹ̀lú ìbọ̀wọ̀, ṣùgbọ́n ọ̀rọ̀ onídàájọ́ náà mọ̀ọ́mọ̀ le; ‘bẹ̀rù’ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn yìí mọ́ láìyanju rẹ̀ sí ‘bọ̀wọ̀’ nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ó kọ̀’ fún ìkọ̀ tí ó tẹ̀ síwájú, ‘ẹnikẹ́ni’ sì fi ìtumọ̀ àpapọ̀ ἄνθρωπον hàn.
