id: LUK.18.30
reference: Luke 18:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: yo
  text: ẹni tí yóò gba ohun tí ó pọ̀ ní ìlọ́po púpọ̀ dájúdájú ní àkókò yìí àti ní ayé tí ń bọ̀[a], ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní sáà tí ń bọ̀.”
    reason: ‘Ayé tí ń bọ̀’ ń túmọ̀ αἰῶνι τῷ ἐρχομένῳ ní ọ̀nà tó pa èrò ayé/ètò ọjọ́ iwájú mọ́; ‘sáà tí ń bọ̀’ jẹ́ àṣàyàn tó ń fi ipa ‘age’ hàn kedere.
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ẹni tí a ṣàpèjúwe ní ẹsẹ tó ṣáájú, ó sì ń bá gbólóhùn náà lọ.
- source_word: οὐχὶ μὴ
  choice: ó dájú pé yóò
  rationale: Àpapọ̀ ọ̀rọ̀ ìkọ̀ méjì pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń fi ìdánilójú tó lágbára hàn. Èdè Yorùbá àdánidá fi agbára náà hàn nípa ‘ó dájú pé yóò,’ dípò lílo ìkọ̀ méjì tí kò ní ṣàn dáadáa.
- source_word: ἀπολάβῃ
  choice: gba
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘gba padà’ tàbí ‘gba.’ Níhìn-ín, ‘gba’ jẹ́ èdè àdánidá, àyíká ẹsẹ sì ti fi èrò èrè ìsanpadà hàn.
- source_word: πολλαπλασίονα
  choice: ọ̀pọ̀lọpọ̀ ìlọ́po
  rationale: Èyí pa èrò ohun tí ó pọ̀ ní ìlọ́po púpọ̀ mọ́, láìfi ohun kan tí Gíríìkì kò dárúkọ kún un.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: ní àkókò yìí
  rationale: καιρός tọ́ka sí àkókò tàbí sáà pàtó; ‘ní àkókò yìí’ ṣe ìyàtọ̀ rẹ̀ sí ayé tí ń bọ̀ ní kedere.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: ní ayé tí ń bọ̀
  rationale: ‘Ayé tí ń bọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ nípa sáà tàbí ètò ọjọ́ iwájú tí gbolohun Gíríìkì ń tọ́ka sí.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání, tó sì wọ́pọ̀, fún ìyè tí kò ní òpin nínú àyíká ẹ̀kọ́ nípa ọjọ́ iwájú.
theological_decisions:
- issue: Ìtumọ̀ αἰῶνι τῷ ἐρχομένῳ
  choice: ayé tí ń bọ̀
  alternative: sáà tí ń bọ̀
  rationale: ‘Ayé tí ń bọ̀’ pa ìyàtọ̀ ẹ̀kọ́ Bíbélì láàárín àkókò ìsinsìnyí àti ètò ọjọ́ iwájú mọ́, láìsọ ọ́ di ọjọ́ iwájú lásán tàbí pinnu gbogbo bí a ṣe gbọdọ̀ lóye rẹ̀.
- issue: Agbára ìdánilójú οὐχὶ μὴ
  choice: ó dájú pé yóò gba
  alternative: kò ní kùnà láti gba
  rationale: Àṣàyàn náà pa ìdánilójú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá tó ṣàn, láìjẹ́ kí ìtumọ̀ náà dà bí ẹni pé ó ń sọ nípa ṣíṣe àṣìṣe tàbí kíkùnà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà jẹ́ àfikún sí ẹsẹ tó ṣáájú, nítorí náà a bẹ̀rẹ̀ pẹ̀lú ‘ẹni tí.’ A lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
