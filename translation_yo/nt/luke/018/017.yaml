  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn apá pàtàkì ti Gíríìkì hàn ní òtítọ́: ọ̀rọ̀ ìmúdájú ἀμὴν, àdírẹ́sì ọ̀pọ̀ ènìyàn, ipò gbogbogbò ὃς ἄν, ìgbà/tẹ́wọ́gbà ìjọba Ọlọ́run, àfiwé ὡς παιδίον, àti ìkọ̀ tó lágbára οὐ μὴ. ‘Dájúdájú, kì yóò wọ inú rẹ̀’ ń mú agbára ìkọ̀ náà jáde láì fi ìtumọ̀ míì kún un.'
  naturalness: Yorùbá náà jẹ́ Yorùbá boṣewa, ó ní ohùn ìbáwí tó yẹ fún ọ̀rọ̀ Jésù, ó sì rọrùn láti ka. ‘Lóòótọ́ ni mo sọ fún yín’ àti ‘ẹnikẹ́ni tí kò bá gba’ jẹ́ ìṣètò tí ó dáa, tí ó sì bá ọ̀nà ìsọ Yorùbá mu. Àmì ohùn àti ìtọ́kasí ‘rẹ̀’ wà ní ibi tó yẹ.
  terminology: ‘Ìjọba Ọlọ́run’ jẹ́ ọ̀rọ̀ ìtumọ̀ tó wọ́pọ̀, tó sì bá βασιλεία τοῦ θεοῦ mu. ‘Gba’ pa ìtumọ̀ δέξηται mọ́ láì dín un kù sí ìgbàgbọ́, ìrẹ̀lẹ̀, tàbí ìgbẹ́kẹ̀lé nìkan. Àlàyé ẹsẹ̀ [a] tọ́ka sí àìdánilójú nípa ànímọ́ pàtó tí àfiwé ọmọ ń tẹnumọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
