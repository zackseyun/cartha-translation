id: LUK.18.17
reference: Luke 18:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: yo
  text: “Lóòótọ́ ni mo sọ fún yín, ẹnikẹ́ni tí kò bá gba ìjọba Ọlọ́run bí ọmọ[a], dájúdájú, kì yóò wọ inú rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ọmọ.” Gbólóhùn náà lè tẹnumọ́ ìmúrasílẹ̀ ọmọ láti gba, ìgbẹ́kẹ̀lé, ìrẹ̀lẹ̀, tàbí gbígbára lé ẹlòmíràn; Gíríìkì kò sọ ànímọ́ pàtó tí ó ní lọ́kàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó fi agbára ọ̀rọ̀ ìmúdájú tí Jésù fi ń bẹ̀rẹ̀ ọ̀rọ̀ rẹ̀ hàn ní Yorùbá àdánidá, láì lo àkọsílẹ̀ ‘Àmín’ tí ó lè ṣókùnkùn ní ipò yìí.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ tí a sọ tààrà sí àwọn olùgbọ́ púpọ̀.
- source_word: ὃς ἂν μὴ δέξηται
  choice: ẹnikẹ́ni tí kò bá gba
  rationale: ‘Ẹnikẹ́ni’ àti ‘kò bá’ mú ipò àìnídìí gbogbogbò tí ὃς ἂν ń sọ jáde; ‘gba’ sì pa ìtumọ̀ gbígbà tàbí tẹ́wọ́ gbà mọ́ láì tú àkàwé náà ju bó ṣe yẹ lọ.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tó mọ́gbọ́n dání, tó sì wọ́pọ̀ fún βασιλεία τοῦ θεοῦ; kò dín un kù sí ilẹ̀ ìjọba nìkan tàbí fi ‘ìṣàkóso’ rọ́pò rẹ̀.
- source_word: ὡς παιδίον
  choice: bí ọmọ
  rationale: Ó pa àfiwé Gíríìkì mọ́, ó sì jẹ́ kí ọ̀rọ̀ náà má ṣe pinnu bóyá ìtẹnumọ́ wà lórí ìrẹ̀lẹ̀, ìgbẹ́kẹ̀lé, gbígbára lé ẹlòmíràn, tàbí ìmúrasílẹ̀ láti gba.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: dájúdájú, kì yóò wọ inú rẹ̀
  rationale: ‘Dájúdájú, kì yóò’ mú ìkọ̀ emphatic οὐ μή jáde, ‘wọ inú rẹ̀’ sì tọ́ka padà sí ìjọba náà ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ gbígba ìjọba Ọlọ́run ‘bí ọmọ’
  choice: A pa àfiwé náà mọ́ láì sọ ànímọ́ ọmọ kan pàtó.
  alternative: A lè tú u sí ‘pẹ̀lú ìrẹ̀lẹ̀ ọmọ,’ ‘pẹ̀lú ìgbẹ́kẹ̀lé ọmọ,’ tàbí ‘gẹ́gẹ́ bí ẹni tí ó jẹ́ ọmọ.’
  rationale: Gíríìkì kò sọ ànímọ́ pàtó tí àfiwé náà ń tẹnumọ́; ṣíṣàlàyé rẹ̀ sí ọ̀nà kan ṣoṣo yóò yanjú àìṣedéédé ìtumọ̀ tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ fi sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ; ‘yín’ pa àdírẹ́sì ọ̀pọ̀ ènìyàn mọ́.
