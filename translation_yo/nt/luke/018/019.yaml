id: LUK.18.19
reference: Luke 18:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù wí fún un pé, “Èé ṣe tí o fi ń pè mí ní ẹni rere? Kò sí ẹni rere, àfi Ọlọ́run nìkan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ àti agbára ìdáhùn Jésù sí ọ̀rọ̀ ọkùnrin náà hàn; ‘Nígbà náà’ tàbí ‘Ó sì’ ṣeé ṣe, ṣùgbọ́n ‘Ṣùgbọ́n’ bá àyíká ọ̀rọ̀ mu jù.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Jésù wí
  rationale: Ó túmọ̀ λέγω ní tààrà gẹ́gẹ́ bí ‘wí/sọ,’ láìfi ìtumọ̀ àfikún ‘dáhùn’ kún un.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó pa arọ́pò-orúkọ Gíríìkì mọ́ láìfi ‘ọkùnrin náà’ kún ọ̀rọ̀.
- source_word: Τί
  choice: Èé ṣe tí
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, τί ń béèrè ìdí; ‘Èé ṣe tí’ ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: με λέγεις ἀγαθόν
  choice: o fi ń pè mí ní ẹni rere
  rationale: Ó mú ìtumọ̀ pé ẹni náà ń pe Jésù ní rere jáde ní Yorùbá àdánidá, tí ‘ẹni’ sì jẹ́ kí àpèjúwe náà bá ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ mu.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: ẹni rere
  rationale: A lo ‘rere’ ní ìṣọ̀kan ní ibi méjèèjì; a kò fi ‘ní ìwà rere’ kún un, nítorí ìyẹn yóò dín ìtumọ̀ ọ̀rọ̀ Gíríìkì kù.
- source_word: οὐδεὶς
  choice: Kò sí ẹni
  rationale: Ó sọ ìkọ̀sílẹ̀ gbogbo ènìyàn ní kedere àti ní Yorùbá òde òní.
- source_word: εἰ μὴ εἷς
  choice: bí kò ṣe ẹnì kan ṣoṣo
  rationale: Ó pa ọ̀rọ̀ ìyọkúrò àti ìtẹnumọ́ ‘ọ̀kan’ mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún referent náà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ohun tí ìbéèrè Jésù lè túmọ̀ sí nípa ẹni tí Kristi jẹ́
  choice: A pa ìbéèrè náà mọ́ gẹ́gẹ́ bí ìbéèrè, láìsọ ọ́ di pé Jésù ń sẹ́ pé òun dára tàbí pé ó ń kéde Ọlọ́run rẹ̀ ní tààrà.
  alternative: Láti túmọ̀ ọ́ bí ìsẹ́ rere Jésù ní ìtumọ̀ pípé, tàbí bí ìjẹ́wọ́ Ọlọ́run rẹ̀ ní gbangba.
  rationale: Gíríìkì fi ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà sílẹ̀ láìyanju rẹ̀ ní ẹsẹ yìí; ìtumọ̀ náà gbọ́dọ̀ ṣe bẹ́ẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Wí’ ní ìfarahàn Bíbélì díẹ̀ ṣùgbọ́n ó ṣì wọ́pọ̀, ‘ń pè mí ní ẹni rere’ sì jẹ́ àdánidá.
