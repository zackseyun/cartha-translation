id: LUK.18.11
reference: Luke 18:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: yo
  text: Farisí náà dúró lọ́tọ̀, ó sì ń gbàdúrà àwọn ọ̀rọ̀ wọ̀nyí pé, “Ọlọ́run, mo dúpẹ́ lọ́wọ́ rẹ pé èmi kò dà bí àwọn ènìyàn yòókù—àwọn alọ́nilọ́wọ́gbà, aláìṣòdodo, alágbèrè—tàbí bí agbowó òde yìí pàápàá.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ó tún lè jẹ́: “Farisí náà dúró, ó sì ń gbàdúrà àwọn ọ̀rọ̀ wọ̀nyí sí ara rẹ̀.” Gbólóhùn Gíríìkì náà, πρὸς ἑαυτόν, lè túmọ̀ sí pé ó dúró lọ́tọ̀, tàbí pé àdúrà rẹ̀ ń lọ sí ara rẹ̀ lọ́nà ẹ̀gàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ Φαρισαῖος
  choice: Farisí náà
  rationale: Ó jẹ́ orúkọ ẹgbẹ́ ẹ̀sìn kan tí ó yẹ kí a ṣe àfihàn rẹ̀ ní ìkọ̀wé Yorùbá, pẹ̀lú àpèjúwe pàtó tí àpilẹ̀kọ Gíríìkì náà ń fún.
- source_word: σταθεὶς
  choice: dúró
  rationale: Ọ̀rọ̀ aláìlópìn aorist yìí ń sọ ìdúró tàbí ìpo rẹ̀ ṣáájú àdúrà; ‘dúró’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí kò sì fi àlàyé kún un.
- source_word: πρὸς ἑαυτὸν
  choice: ní àdáwà
  rationale: Ó lè tọ́ka sí pé ó dúró lọ́tọ̀; yíyan ‘ní àdáwà’ jẹ́ kí ìtàn náà ṣàn dáadáa, nígbà tí a pa ìtumọ̀ míì, ‘sí ara rẹ̀,’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ταῦτα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Èyí pa ọ̀pọ̀ demonstrative náà mọ́, ó sì tọ́ka ní ti ẹ̀dá sí ohun tí àdúrà tó tẹ̀ lé ní nínú.
- source_word: προσηύχετο
  choice: ó sì ń gbàdúrà
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí imperfect Gíríìkì náà.
- source_word: εὐχαριστῶ σοι
  choice: mo dúpẹ́ lọ́wọ́ rẹ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífi ọpẹ́ fún ẹnì kan, ó sì pa ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: dà bí àwọn ènìyàn yòókù
  rationale: ‘Àwọn ènìyàn’ bo gbogbo ènìyàn ní ti ẹ̀dá, ‘yòókù’ sì pa λοιποί mọ́ láìfi akọ nìkan sí ibi tí Gíríìkì ń lò ἄνθρωποι ní ìtumọ̀ gbogbogbò.
- source_word: ἅρπαγες
  choice: àwọn afipámúnilówógbà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tó ń gba ohun ìní lọ́wọ́ ẹlòmíràn nípasẹ̀ ipá tàbí ìnilára; ó yẹ ju ọ̀rọ̀ tó lè túmọ̀ sí olè lasan lọ.
- source_word: ἄδικοι
  choice: aláìṣòdodo
  rationale: Ó pa ìtumọ̀ ìwà àti ti ẹ̀sìn tí ἄδικος ní mọ́, kì í sì í dín un kù sí àìṣèdájọ́ òfin nìkan.
- source_word: μοιχοί
  choice: alágbèrè
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àpèjúwe àdánidá fún àwọn tó ń ṣẹ̀ nípa ìbálòpọ̀ pẹ̀lú ọkọ tàbí aya ẹlòmíràn.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: tàbí bí agbowó òde yìí pàápàá
  rationale: ‘Pàápàá’ mú ìtẹnumọ́ καί jáde, ‘agbowó òde’ sì jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún τελώνης nínú àyíká ìjọba Róòmù.
theological_decisions:
- issue: Ìtumọ̀ πρὸς ἑαυτόν nínú àdúrà Farisí náà
  choice: A túmọ̀ rẹ̀ ní ọ̀nà ibi gẹ́gẹ́ bí ‘ní àdáwà’ nínú ẹsẹ̀ náà.
  alternative: ‘Sí ara rẹ̀,’ èyí tó lè túmọ̀ sí pé ara rẹ̀ ni àdúrà náà ń yí ká tàbí pé ó ń gbà á ní ìkọ̀kọ̀.
  rationale: Gíríìkì náà lè túmọ̀ sí pé ó dúró lọ́tọ̀ tàbí pé ó ń gbàdúrà ‘sí ara rẹ̀.’ A kò yanju ìṣòro ìtumọ̀ yìí ní ìkọ̀kọ̀; a fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘Farisí’ àti ‘agbowó òde’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí òǹkàwé Yorùbá mọ̀, a sì pa ìrísí àdúrà àti ìtẹnumọ́ ẹsẹ̀ Gíríìkì mọ́.
