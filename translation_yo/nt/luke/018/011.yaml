revisions:
- from: Farisí náà dúró ní àdáwà, ó sì ń gbàdúrà àwọn ọ̀rọ̀ wọ̀nyí pé, “Ọlọ́run, mo dúpẹ́ lọ́wọ́ rẹ pé èmi kò dà bí àwọn ènìyàn yòókù—àwọn afipámúnilówógbà, aláìṣòdodo, alágbèrè—tàbí bí agbowó òde yìí pàápàá.”[a]
  to: Farisí náà dúró lọ́tọ̀, ó sì ń gbàdúrà àwọn ọ̀rọ̀ wọ̀nyí pé, “Ọlọ́run, mo dúpẹ́ lọ́wọ́ rẹ pé èmi kò dà bí àwọn ènìyàn yòókù—àwọn alọ́nilọ́wọ́gbà, aláìṣòdodo, alágbèrè—tàbí bí agbowó òde yìí pàápàá.”[a]
  rationale: Àtúnṣe náà yí àwọn ọ̀rọ̀ méjì tí kò dára jù lọ nínú Yorùbá padà nìkan. Ó pa ìtumọ̀ ibi ti a yàn fún πρὸς ἑαυτόν mọ́, ó sì fi ìtumọ̀ kejì tí ó ṣeé ṣe pamọ́ sínú àlàyé ìsàlẹ̀. Ó tún lo ‘alọ́nilọ́wọ́gbà,’ ọ̀rọ̀ tó mọ́gbọ́n dání fún ἅρπαγες.
  reviewer_model: gpt-5.6-terra
