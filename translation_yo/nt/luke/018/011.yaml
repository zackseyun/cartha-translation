  naturalness: ‘Dúró ní àdáwà’ lè dún bí ìṣe ní ìkọ̀kọ̀ ju bí ìdúró lọ́tọ̀ sí àwọn ẹlòmíràn. ‘Dúró lọ́tọ̀’ jẹ́ Yorùbá ìgbàlódé tó ṣe kedere sí i nínú àyíká yìí. Bákan náà, ‘afipámúnilówógbà’ kì í ṣe ọ̀rọ̀ tí ó rọrùn tàbí tí ó wọ́pọ̀; ‘alọ́nilọ́wọ́gbà’ jẹ́ ọ̀rọ̀ tó dára sí i fún ẹni tó ń gba ohun lọwọ́ ẹlòmíràn nípasẹ̀ ìnilára tàbí ìfìyàjẹni.
  terminology: A pa ‘Farisí,’ ‘Ọlọ́run,’ ‘aláìṣòdodo,’ ‘alágbèrè,’ àti ‘agbowó òde’ mọ́. ‘Alọ́nilọ́wọ́gbà’ ṣàfihàn ἅρπαγες dáadáa láìdín un kù sí olè lasan.
  issues:
  - severity: medium
    issue: ‘ní àdáwà’ nínú ìtumọ̀ πρὸς ἑαυτόν
    rationale: Ó lè túmọ̀ sí ṣíṣe nǹkan ní ìkọ̀kọ̀ tàbí ní ìpamọ́. ‘Lọ́tọ̀’ fi ìtumọ̀ ibi (‘by himself’) hàn ní kedere, nígbà tí àlàyé ìsàlẹ̀ ń dá ìtumọ̀ ‘sí ara rẹ̀’ sí.
  - severity: medium
    issue: ‘àwọn afipámúnilówógbà’ fún ἅρπαγες
    rationale: Ìṣọ̀kan ọ̀rọ̀ yìí kò wọ́pọ̀, ó sì lè ṣòro fún òǹkàwé láti lóye. ‘Àwọn alọ́nilọ́wọ́gbà’ jẹ́ ọ̀rọ̀ Yorùbá tó dára sí i fún àwọn afipá-gba ohun tàbí afìyàjẹni.
