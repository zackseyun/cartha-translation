source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: yo
  text: 'Ó sì tún sọ àkàwé yìí sí àwọn kan tí wọ́n ní ìgbẹ́kẹ̀lé nínú ara wọn pé àwọn jẹ́ olódodo, tí wọ́n sì ń kẹ́gàn àwọn yòókù:[a]


    [a] Tàbí, “tí wọ́n sì ń fojú tẹ́ńbẹ́lú àwọn ẹlòmíràn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n sì ń fojú tẹ́ńbẹ́lú àwọn ẹlòmíràn.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ἐξουθενοῦντας τοὺς λοιπούς, tí ó tẹnu mọ́ fífi ojú kékeré wo àwọn ẹlòmíràn.
lexical_decisions:
- source_word: Εἶπεν
  choice: sọ
  rationale: Nítorí pé àkàwé ni ohun tí ó sọ, “sọ àkàwé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣe λέγω hàn.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó tẹ ìtàn náà síwájú láìfi ìtakora líle kún un.
- source_word: καὶ
  choice: tún
  rationale: Níhìn-ín καί ní ìtumọ̀ àfikún; “tún” fi hàn pé èyí jẹ́ ẹ̀kọ́ mìíràn tí Jesu sọ.
- source_word: πρός τινας
  choice: fún àwọn kan
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe sísọ, πρός tọ́ka sí àwọn tí a bá sọ̀rọ̀; “fún àwọn kan” jẹ́ àdánidá ní Yorùbá.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: tí wọ́n gbẹ́kẹ̀ lé ara wọn
  rationale: “Gbẹ́kẹ̀ lé ara wọn” pa ìgbẹ́kẹ̀lé ara ẹni tí ἐφ’ ἑαυτοῖς ń sọ mọ́, ó sì bá ipò ìdánilójú tí perfect participle náà fi hàn mu.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: pé àwọn jẹ́ olódodo
  rationale: “Olódodo” pa èdè pàtàkì ti ìwà rere àti ìdájọ́ níwájú Ọlọ́run mọ́, nígbà tí àyíká ọ̀rọ̀ fúnra rẹ̀ fi àríwísí ìgbéraga wọn hàn.
- source_word: ἐξουθενοῦντας
  choice: ń kẹ́gàn
  rationale: “Kẹ́gàn” túmọ̀ sí yíyẹ ẹlòmíràn sí ẹni tí kò níye tàbí fífi ẹ̀gàn hàn sí i; ó mú agbára active participle náà jáde ní ṣókí.
- source_word: τοὺς λοιπούς
  choice: àwọn yòókù
  rationale: “Àwọn yòókù” jẹ́ ìtumọ̀ tààrà fún λοιποί, ó sì pa ìyàtọ̀ “ara wọn” sí “gbogbo àwọn tó kù” mọ́.
- source_word: τὴν παραβολὴν ταύτην
  choice: àkàwé yìí
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún παραβολή gẹ́gẹ́ bí irú ẹ̀kọ́ aláwòrán tí a rí nínú àwọn Ìhìn Rere.
theological_decisions:
- issue: Ìtumọ̀ δίκαιοι ní àyíká ìgbéraga nínú òdodo ara ẹni
  choice: olódodo
  alternative: ẹni tí ó tọ́ / ẹni tí kò lẹ́bi
  rationale: Gíríìkì lo δίκαιοι láìfi ọ̀rọ̀ ẹ̀gàn kún un. “Olódodo” jẹ́ kí ọ̀rọ̀ ìmọ̀-ẹ̀sìn náà dúró, ó sì jẹ́ kí àyíká ọ̀rọ̀—kì í ṣe ìtumọ̀ tí a fi kún un—fi àríwísí ìgbẹ́kẹ̀lé ara ẹni hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti kedere ni a lò. “Sọ àkàwé” rọrùn fún òǹkàwé òde òní ju àṣà àtijọ́ “pa òwe” lọ; “ń kẹ́gàn” sì jẹ́ ṣókí, àdánidá, ó sì pa líle ọ̀rọ̀ Gíríìkì mọ́.
