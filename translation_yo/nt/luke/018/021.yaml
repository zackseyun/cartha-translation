  text: ὁ δὲ εἶπεν· Ταῦτα πάντα ⸀ἐφύλαξα ἐκ νεότητος ⸀μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: yo
  text: Ó sì wí pé, “Gbogbo nǹkan wọ̀nyí ni mo ti pa mọ́ láti ìgbà èwe mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, bí a bá sọ ohun tí àyíká ọ̀rọ̀ ń tọ́ka sí ní kedere, “Gbogbo àwọn òfin wọ̀nyí.” Ọ̀rọ̀ Gíríìkì náà kàn sọ pé “gbogbo nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ó sì wí pé
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú ìtàn; ‘sì’ ń tẹ̀síwájú nínú ìtàn láìfi ìtakora tí ó lágbára kún un.
- source_word: Ταῦτα πάντα
  choice: Gbogbo nǹkan wọ̀nyí
  rationale: Èyí túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà; àwọn òfin ni àyíká ọ̀rọ̀ ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ náà kò sọ ‘àwọn òfin’ ní kedere.
- source_word: ἐφύλαξα
  choice: ni mo ti pa mọ́
  rationale: φυλάσσω níhìn-ín túmọ̀ sí pípa tàbí mímú àwọn òfin ṣẹ; ‘mo ti pa mọ́’ sọ pé ẹni náà ń wo ìgbésí ayé rẹ̀ láti ìgbà èwe títí dé àkókò yìí.
- source_word: ἐκ νεότητος μου
  choice: láti ìgbà èwe mi
  rationale: ἐκ pẹ̀lú ọ̀rọ̀ abínibí ń fi ibi ìbẹ̀rẹ̀ àkókò hàn; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ ‘láti ìgbà èwe mi’ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìṣedéédé òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Pa mọ́’ jẹ́ gbólóhùn Bíbélì Yorùbá tí ó tún ṣeé lóye gẹ́gẹ́ bí mímú òfin ṣẹ.
