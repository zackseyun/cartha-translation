  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó gbọ́ nǹkan wọ̀nyí, ó banújẹ́ gidigidi,[a] nítorí ó jẹ́ ọlọ́rọ̀ gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ní ìbànújẹ́ jíjinlẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìbànújẹ́ tàbí ìpọ́njú ọkàn tó lágbára gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ó gbọ́
  rationale: Aorist participle náà ní ìtumọ̀ àkókò ní àyíká yìí; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa bí ìgbọ́ ṣe ṣáájú ìdáhùn rẹ̀ mọ́.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; ‘nǹkan wọ̀nyí’ pa ọ̀pọ̀ rẹ̀ mọ́ láì fi ‘ọ̀rọ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: περίλυπος
  choice: inú rẹ̀ bàjẹ́ gidigidi
  rationale: Àpèjúwe náà ń tọ́ka sí ìbànújẹ́ tàbí ìpọ́njú ọkàn tó lágbára gan-an; gbolohun yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbànújẹ́ jíjinlẹ̀.
- source_word: ἐγενήθη
  choice: inú rẹ̀ bàjẹ́
  rationale: γίνομαι fi hàn pé ó wọ ipò ìbànújẹ́ lẹ́yìn ohun tí ó gbọ́; ìṣe Yorùbá yìí ń fi ìyípadà sí ipò náà hàn, kì í ṣe pé ó wà níbẹ̀ tẹ́lẹ̀ nìkan.
- source_word: πλούσιος
  choice: olọ́rọ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ẹni tí ó ní ọrọ̀ púpọ̀.
- source_word: σφόδρα
  choice: púpọ̀
  rationale: Ní ìṣọ̀kan pẹ̀lú ‘olọ́rọ̀,’ ‘púpọ̀’ ń fi bí ọrọ̀ rẹ̀ ṣe pọ̀ gan-an hàn ní Yorùbá tó rọrùn láti lóye.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín ohun tí Jésù sọ àti ìdáhùn ọkùnrin náà jáde kedere.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí ìbànújẹ́ rẹ̀ fi jinlẹ̀; ‘nítorí’ jẹ́ àsopọ̀ Yorùbá àdánidá fún ìbáṣepọ̀ ìdí yìí.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. ‘Inú rẹ̀ bàjẹ́ gidigidi’ jẹ́ àdánidá ju ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ lọ, nígbà tí àlàyé ìsàlẹ̀ ojú-ìwé pa àṣàyàn ‘ó banújẹ́ gidigidi’ àti agbára περίλυπος mọ́.
