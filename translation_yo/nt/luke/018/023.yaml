- from: Ṣùgbọ́n nígbà tí ó gbọ́ nǹkan wọ̀nyí, inú rẹ̀ bàjẹ́ gidigidi,[a] nítorí ó jẹ́ ọlọ́rọ̀ púpọ̀.
  to: Ṣùgbọ́n nígbà tí ó gbọ́ nǹkan wọ̀nyí, ó banújẹ́ gidigidi,[a] nítorí ó jẹ́ ọlọ́rọ̀ gidigidi.
  rationale: The revision replaces an expression that can include displeasure or general upset with a direct Yoruba expression for becoming deeply sorrowful, matching περίλυπος and the ingressive force of ἐγενήθη. It also renders σφόδρα with the more natural emphatic collocation “ọlọ́rọ̀ gidigidi.” The footnote remains anchored at the sorrow expression and supplies a legitimate close alternative.
