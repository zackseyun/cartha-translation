  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: yo
  text: Ṣùgbọ́n òun gba àárín wọn kọjá, ó sì ń bá ọ̀nà rẹ̀ lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà wà ní kedere, ó sì ní ìtẹnumọ́ díẹ̀. “Òun” pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá láì fi ọ̀rọ̀ kún un ju bó ṣe yẹ lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ète búburú àwọn ènìyàn náà ní ẹsẹ tó ṣáájú àti bí Jésù ṣe kúrò láìfarapa.
- source_word: διελθὼν
  choice: gba ... kọjá
  rationale: Àpólà-ìṣe aorist yìí sọ ìṣípò láti inú àyè kan kọjá; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì so iṣẹ́ náà mọ́ ìṣe pàtàkì tó tẹ̀ lé e.
- source_word: διὰ μέσου αὐτῶν
  choice: gba àárín wọn kọjá
  rationale: Gbólóhùn náà ṣàpèjúwe Jésù bí ó ṣe kọjá ní àárín ẹgbẹ́ náà. Ó pa àwòrán ipò inú orísun mọ́ láìsọ bí ó ṣe ṣeé ṣe.
- source_word: ἐπορεύετο
  choice: ó sì ń bá ọ̀nà rẹ̀ lọ
  rationale: Ìṣe aláìpé náà fi ìlọsíwájú hàn. “Ń bá ọ̀nà rẹ̀ lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó tẹ̀ síwájú ní lílọ.
theological_decisions:
- issue: Bóyá kí ẹsẹ náà sọ tàbí tọ́ka ní pàtó pé àsálà náà jẹ́ iṣẹ́ ìyanu
  choice: 'Ọ̀rọ̀ aláìṣègbè: “gba àárín wọn kọjá, ó sì ń bá ọ̀nà rẹ̀ lọ”'
  alternative: Ọ̀rọ̀ tó sọ ní pàtó pé ó fi agbára ìyanu kọjá láàárín wọn
  rationale: Gíríìkì sọ bí Jésù ṣe kọjá láàárín ogunlọ́gọ̀ náà, ṣùgbọ́n kò ṣàlàyé bí èyí ṣe ṣẹlẹ̀. Ìtumọ̀ náà kò fi iṣẹ́ ìyanu kún ohun tí ọrọ̀ sọ ní tààrà, bẹ́ẹ̀ ni kò dí òye irú bẹ́ẹ̀ lọ́wọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá.
