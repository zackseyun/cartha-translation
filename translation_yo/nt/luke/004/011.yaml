  source_fidelity: 'Ìtumọ̀ náà ń mú ìtumọ̀ Gíríìkì náà jáde dáadáa ní pàtàkì: ọwọ́ àwọn tó ń ru ẹni náà, ìdènà kí ẹsẹ̀ má kọlu òkúta, àti ẹsẹ̀ kan ṣoṣo. Síbẹ̀, “Lórí ọwọ́ wọn ni wọn yóò gbé ọ sókè” lè fi ìtumọ̀ “lift up” kún un díẹ̀. Ìṣètò tí a tún ṣe ń so “lórí ọwọ́ wọn” mọ́ ìṣe gbígbé náà taara, láìfi ìtumọ̀ ìgòkè kún un.'
