  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: yo
  text: àti pé, “Wọ́n yóò gbé ọ lórí ọwọ́ wọn[a], kí o má bàa fi ẹsẹ̀ rẹ kọlu òkúta.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n yóò gbé ọ ró.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí o má bàa fi ẹsẹ̀ rẹ gbá òkúta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti
  rationale: Ó ń tẹ̀ síwájú nínú ọ̀rọ̀ tí a fa yọ láti ẹsẹ tó ṣáájú, ó sì jẹ́ àsopọ̀ tó wọ́pọ̀ ní Yorùbá.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ó ń ṣe àfihàn ohun tí Ìwé Mímọ́ sọ; “pé” ni ọ̀nà àdánidá láti mú ọ̀rọ̀ àyọlò náà wọlé ní Yorùbá.
- source_word: Ἐπὶ χειρῶν
  choice: Lórí ọwọ́ wọn
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ mọ́ pé ọwọ́ àwọn áńgẹ́lì ni yóò gbé ẹni náà ró.
- source_word: ἀροῦσίν σε
  choice: ni wọn yóò gbé ọ sókè
  rationale: αἴρω níhìn-ín túmọ̀ sí gbígbé ẹni sókè tàbí gbígbé e ró; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: μήποτε
  choice: kí ... má bàa
  rationale: Ìṣètò yìí fi ète ìdènà tàbí àbájáde tí a fẹ́ yẹra fún hàn lọ́nà àdánidá ní Yorùbá.
- source_word: προσκόψῃς
  choice: fi ... kọlu
  rationale: Pẹ̀lú “ẹsẹ̀” àti “òkúta,” ọ̀rọ̀ náà ń tọ́ka sí fífi ẹsẹ̀ lu ohun kan; “kọlu” pa ìtumọ̀ gidi yẹn mọ́.
- source_word: πρὸς λίθον
  choice: kọlu òkúta
  rationale: Nínú àyíká ọ̀rọ̀ yìí, πρός ń fi ìfarakanra mọ́ ohun kan hàn; Yorùbá máa ń sọ pé ẹsẹ̀ kọlu òkúta.
- source_word: τὸν πόδα σου
  choice: ẹsẹ̀ rẹ
  rationale: A pa nọ́ńbà ẹyọ tó wà nínú Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ àyọlò Sáàmù náà ní Yorùbá tó ṣe kedere láìsọ àwòrán ààbò rẹ̀ nù
  choice: “wọn yóò gbé ọ sókè”
  alternative: “wọn yóò gbé ọ ró”
  rationale: Àwọn méjèèjì fi ààbò àwọn áńgẹ́lì hàn, ṣùgbọ́n “gbé ọ sókè” rọrùn fún òǹkàwé òde òní, kò sì yanjú ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan lọ́nà ẹlẹ́gbẹ́ kan.
translation_notes:
  register: Èdè Yorùbá tó ṣe kedere, tó níyì, tí ó sì bá ìlò òde òní mu ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àwòrán ọwọ́ tó ń gbé ẹni sókè àti ewu ẹsẹ̀ tó lè kọlu òkúta mọ́.
