  terminology: A pa “ọwọ́,” “gbé,” “ẹsẹ̀,” àti “òkúta” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó bá àwòrán àti ìtumọ̀ àyọlò Sáàmù nínú Gíríìkì mu. Àmì ohùn wà ní àwọn ibi tó yẹ.
