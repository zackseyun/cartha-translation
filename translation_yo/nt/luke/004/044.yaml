id: LUK.4.44
reference: Luke 4:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: yo
  text: Ó sì ń wàásù nínú àwọn sínágọ́gù ní Jùdíà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “Gálílì” dípò “Jùdíà.” Ọ̀rọ̀ inú ẹsẹ yìí tẹ̀ lé “Jùdíà” gẹ́gẹ́ bí ó ṣe wà nínú ọ̀rọ̀ Gíríìkì tí a lò níbí.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: ń wàásù
  rationale: Ìhun ọ̀rọ̀ yìí jẹ́ imperfect periphrastic, ó sì ń fi iṣẹ́ tí ó ń bá a lọ tàbí tí a ń ṣe léraléra ní àkókò àtijọ́ hàn. “Ń wàásù” sọ ìtumọ̀ yẹn ní Yorùbá àdánidá.
- source_word: κηρύσσων
  choice: wàásù
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pípolongo ní gbangba; “wàásù” bá iṣẹ́ rẹ̀ nínú sínágọ́gù mu, ó sì yé àwọn òǹkàwé Yorùbá òde òní.
- source_word: εἰς τὰς συναγωγάς
  choice: nínú àwọn sínágọ́gù
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń tọ́ka sí lílọ sínú ibì kan, níbí ó ń tọ́ka sí ibi tí iṣẹ́ ìwàásù ti ń ṣẹlẹ̀. “Nínú” ni Yorùbá àdánidá jù lọ fún ìtumọ̀ yìí.
- source_word: συναγωγάς
  choice: àwọn sínágọ́gù
  rationale: Ní àyíká yìí, συναγωγή ni ibi ìpéjọsìn àwọn Júù. Ọ̀rọ̀ àyálò “sínágọ́gù” jẹ́ èyí tí a mọ̀, ó sì péye.
- source_word: Ἰουδαίας
  choice: Jùdíà
  rationale: A tẹ̀ lé ẹ̀rí inú SBLGNT, tí ó ka “Jùdíà,” láì ṣe àtúnṣe rẹ̀ sí “Gálílì” nítorí àyíká ìtàn.
theological_decisions:
- issue: Orúkọ agbègbè τῆς Ἰουδαίας ní ìbámu pẹ̀lú àyíká ìtàn Gálílì
  choice: Jùdíà
  alternative: Gálílì; tàbí gbígba Jùdíà ní ìtumọ̀ fífẹ̀ gẹ́gẹ́ bí gbogbo ilẹ̀ àwọn Júù
  rationale: Ìtumọ̀ náà pa ohun tí SBLGNT kà mọ́, kò sì mú un bá àyíká mu nípa yíyí orúkọ agbègbè padà. Àlàyé ìsàlẹ̀ ojú ìwé fi ẹ̀dà míì hàn láì pinnu bí a ṣe gbọ́dọ̀ tú ìforígbárí àyíká náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; “sínágọ́gù” ni a lò fún ọ̀rọ̀ pàtó ti ibi ìpéjọsìn àwọn Júù.
