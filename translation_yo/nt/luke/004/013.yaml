source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: yo
  text: Nígbà tí Èṣù parí gbogbo ìdẹwò[a], ó kúrò lọ́dọ̀ rẹ̀ títí di àkókò tó yẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àdánwò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìdẹwò” tàbí “àdánwò”; ṣùgbọ́n nítorí ipa Èṣù nínú ìṣẹ̀lẹ̀ yìí, “ìdẹwò” ni ìtumọ̀ tó bá àyíká mu jù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Lẹ́yìn tí ... parí
  rationale: Ọ̀rọ̀ ìṣe aláìlẹ́gbẹ́ yìí tọ́ka sí ohun tí Èṣù ṣe ṣáájú ìṣe pàtàkì náà; gbólóhùn yìí fi ìtẹ̀lé àkókò náà hàn ní Yorùbá àdánidá.
- source_word: πάντα πειρασμόν
  choice: gbogbo ìdánwò
  rationale: “Gbogbo” mú ìtumọ̀ pẹ̀lú pé Èṣù ti parí gbogbo ìdánwò tó mú wá. “Ìdánwò” lè ní ìtumọ̀ ìdẹwò tàbí àdánwò, bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
- source_word: διάβολος
  choice: Èṣù
  rationale: Nínú àyíká ìtàn Lúùkù, ọ̀rọ̀ náà ń tọ́ka sí ọ̀tá ẹ̀mí náà gẹ́gẹ́ bí ẹni kan pàtó; “Èṣù” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù fún un.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ó kúrò lọ́dọ̀ rẹ̀
  rationale: Èyí sọ ní kedere àti ní Yorùbá àdánidá pé Èṣù fi Jésù sílẹ̀, ó sì yọ ara rẹ̀ kúrò ní ọ̀dọ̀ rẹ̀.
- source_word: ἄχρι καιροῦ
  choice: títí di àkókò tí ó yẹ
  rationale: καιρός kì í ṣe àkókò lásán; ó lè jẹ́ àkókò tó bá iṣẹlẹ̀ kan mu tàbí àǹfààní tó yẹ. Ìtumọ̀ yìí tún fi hàn pé kíkúrò Èṣù jẹ́ fún ìgbà díẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πειρασμός nínú ohun tí Jésù dojú kọ
  choice: ìdánwò, pẹ̀lú ìtumọ̀ ìdẹwò gẹ́gẹ́ bí èrò àkọ́kọ́ nínú àyíká yìí
  alternative: àdánwò tàbí ìdánilẹ́kọ̀ọ́ láti fi ẹni hàn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdẹwò sí búburú tàbí àdánwò tó ń fi ẹni hàn. Nítorí Èṣù ni olùṣe nínú àyíká yìí, ìdẹwò ni ìtumọ̀ tó ṣeé ṣe jù; síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “Èṣù” gẹ́gẹ́ bí orúkọ àṣà Yorùbá fún διάβολος, láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
