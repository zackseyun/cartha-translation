revisions:
- from: “Háà! Kí ni àárín àwa àti ìwọ, Jesu ará Násárẹ́tì?[a] Ṣé o wá láti pa wá run ni? Mo mọ ẹni tí ìwọ jẹ́—Ẹni Mímọ́ Ọlọ́run.”[b]
  to: “Háà! Kí ni àwa ní í ṣe pẹ̀lú rẹ, Jésù ará Násárétì?[a] Ṣé o wá láti pa wá run ni?[b] Mo mọ ẹni tí o jẹ́—Ẹni Mímọ́ Ọlọ́run.”[c]
  rationale: A ṣàtúnṣe aṣìṣe nínú àlàyé ìsàlẹ̀ nípa nọ́mbà ọ̀rọ̀ Gíríìkì, a sì lo ọ̀nà Yorùbá tí ó túbọ̀ jẹ́ àdánidá fún ọ̀nà-ọrọ̀ τί ἡμῖν καὶ σοί. A pa àìdánilójú ti ọ̀pọ̀ ἡμᾶς mọ́, a kò sì tú àkọlé Kristi náà sí ìtumọ̀ ẹ̀kọ́ ìjọ kankan. Àwọn àlàyé ìsàlẹ̀ tuntun ní àwọn àmì tí ó so mọ́ ibi tí ó yẹ nínú ẹsẹ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:04:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì àwọn gbolohun Gíríìkì náà mọ́: igbe ìbànújẹ/àtakò, ìbéèrè ìyàsọ́tọ̀ náà, arọ́pò-orúkọ ọ̀pọ̀ «wá», ìbéèrè nípa wíwá láti parun, àti àkọlé «Ẹni Mímọ́ Ọlọ́run». Ṣùgbọ́n àlàyé ìsàlẹ̀ a sọ ní aṣìṣe pé «wá» ni ọ̀pọ̀ nínú Gíríìkì; «ἡμᾶς» (‘wá’) ni ọ̀pọ̀, kì í ṣe «ἦλθες» (‘o wá’).'
  naturalness: «Kí ni àwa ní í ṣe pẹ̀lú rẹ?» jẹ́ Yorùbá boṣewa tí ó dára, ó sì ń mú àtakò inú ọ̀nà-ọrọ̀ Semitic náà jáde ní ti ẹ̀dá ju «Kí ni àárín àwa àti ìwọ?» lọ. «Jésù» àti «Násárétì» jẹ́ àkọsílẹ̀ orúkọ tó bá ìlò Yorùbá mu. «Mo mọ ẹni tí o jẹ́» jẹ́ ìsọ̀rọ̀ òde-òní, tó ní ìwọ̀ntúnwọ̀nsì.
  terminology: «Ẹni Mímọ́ Ọlọ́run» pa ὁ ἅγιος τοῦ θεοῦ mọ́ dáadáa, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún un. «Pa wá run» jẹ́ ìtumọ̀ tó yẹ fún ἀπολέσαι ní àyíká ọ̀rọ̀ yìí. Àwọn àmì ìsàlẹ̀ ni a pín sí ibi tí ọkọọkan ti yẹ kí ó wà.
  issues:
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ a sọ pé «Ọ̀rọ̀ ‘wá’ jẹ́ ọ̀pọ̀ nínú Gíríìkì».
    rationale: 'Èyí kò tọ́ ní ti èdè orísun: ἦλθες, tí a túmọ̀ sí «o wá», jẹ́ ẹni kejì ẹyọ; ἡμᾶς, tí a túmọ̀ sí «wá», ni ọ̀pọ̀. A gbọdọ̀ tún un ṣe kí ó má bàa tan olùkà jẹ.'
  - severity: low
    issue: «Kí ni àárín àwa àti ìwọ» kò jẹ́ ọ̀nà Yorùbá tó rọrùn jù láti sọ ọ̀nà-ọrọ̀ náà.
    rationale: «Kí ni àwa ní í ṣe pẹ̀lú rẹ?» jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ìyàsọ́tọ̀ tàbí àtakò mọ́, láì sọ ohun tí kò sí nínú Gíríìkì.
  - severity: low
    issue: Àkọsílẹ̀ àwọn àlàyé orúkọ, ọ̀nà-ọrọ̀, àti ọ̀pọ̀ ni a kó sínú àmì ìsàlẹ̀ kan ṣoṣo.
    rationale: Pípin wọn sí àmì ọ̀tọ̀ọ̀tọ̀ ń mú ìtọ́kasí ìsàlẹ̀ hàn gbangba, ó sì so ìtumọ̀ kọ̀ọ̀kan mọ́ ọ̀rọ̀ tó yẹ nínú ẹsẹ náà.
