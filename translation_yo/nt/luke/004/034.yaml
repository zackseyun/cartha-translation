  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: yo
  text: “Háà! Kí ni àwa ní í ṣe pẹ̀lú rẹ, Jésù ará Násárétì?[a] Ṣé o wá láti pa wá run ni?[b] Mo mọ ẹni tí o jẹ́—Ẹni Mímọ́ Ọlọ́run.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “Kí ni fún àwa àti fún ìwọ?” Èyí jẹ́ ọ̀nà ọ̀rọ̀ Semitic tí ń fi ìyàsọ́tọ̀ tàbí àtakò hàn. Tàbí, “Jésù ọmọ Násárétì.”
    reason: cultural_note
  - marker: b
    text: «Wá» jẹ́ ọ̀pọ̀ nínú Gíríìkì, ṣùgbọ́n a kò sọ ẹni tàbí àwọn ẹni tí ó tọ́ka sí ní pàtó.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “Ẹni Mímọ́ tí ó jẹ́ ti Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Háà!
  rationale: Ó pa ìró ẹnu òjijì tí ń fi ìbẹ̀rù tàbí àtakò hàn mọ́, láì túmọ̀ ọ́ ní kíkún sí ‘Fi wá sílẹ̀!’
- source_word: τί ἡμῖν καὶ σοί
  choice: Kí ni àárín àwa àti ìwọ
  rationale: Èyí jẹ́ ọ̀nà àdéhùn Semitic tí ó ń fi jíjìnnà sí ara ẹni tàbí àtakò hàn; gbolohun Yorùbá yìí pa àwòrán orísun àti agbára ìbéèrè náà mọ́.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesu ará Násárẹ́tì
  rationale: Ó jẹ́ àdírẹ́sì vocative tí ń dá Jesu mọ̀ pẹ̀lú ibi tí ó ti wá; ‘ará Násárẹ́tì’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: Ṣé o wá láti pa wá run ni?
  rationale: Ó fi ìdí dédé wíwá rẹ̀ àti ìparun tí a ń bẹ̀rù hàn ní Yorùbá àdánidá, nígbà tí ‘wá’ ṣì jẹ́ ọ̀pọ̀ ènìyàn bíi ti Gíríìkì.
- source_word: οἶδά σε τίς εἶ
  choice: Mo mọ ẹni tí ìwọ jẹ́
  rationale: Ìtumọ̀ tààrà tí ó pa ìjẹ́wọ́ ìdánimọ̀ náà mọ́ láìfi àlàyé kún un.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Ẹni Mímọ́ Ọlọ́run
  rationale: Ó pa àkọlé Kristológì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run mọ́ ní ọ̀nà Yorùbá tí ó níyì.
theological_decisions:
- issue: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ἡμᾶς nínú ọ̀rọ̀ ẹ̀mí èṣù
  choice: A túmọ̀ ọ́ sí ‘wá’ láì sọ àwọn tí ó tọ́ka sí ní pàtó.
  alternative: Ó lè tọ́ka sí ẹ̀mí èṣù náà gẹ́gẹ́ bí aṣojú ilẹ̀ àwọn ẹ̀mí èṣù, tàbí sí òun àti ọkùnrin tí ó wọ̀.
  rationale: Gíríìkì fi ọ̀pọ̀ hàn ṣùgbọ́n kò sọ ààlà ìtọ́kasí rẹ̀; pípa ‘wá’ mọ́ ń yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Àkọlé ὁ ἅγιος τοῦ θεοῦ
  choice: Ẹni Mímọ́ Ọlọ́run
  alternative: Ẹni Mímọ́ tí ó jẹ́ ti Ọlọ́run
  rationale: A pa àkọlé náà mọ́ bí ẹsẹ náà ṣe sọ ọ́, láì ṣàfikún ìtumọ̀ Mèsáyà tàbí èdè ìjẹ́wọ́ ìgbàgbọ́ tó wá lẹ́yìn náà.
translation_notes:
  register: Yorùbá boṣewa, òde-òní, ọlọ́lá, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Háà!’ jẹ́ igbe ẹnu òjijì; ‘Ṣé’ jẹ́ àdánidá fún ìbéèrè ọ̀rọ̀ ẹnu, nígbà tí gbogbo gbolohun náà ṣì ní ìwọ̀ntúnwọ̀nsì tó yẹ fún Bíbélì.
