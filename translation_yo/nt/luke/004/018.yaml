id: LUK.4.18
reference: Luke 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: yo
  text: Ẹ̀mí Olúwa ń bẹ lára mi, nítorí ó ti fi òróró yàn mí láti kéde ìhìn rere fún àwọn òtòṣì. Ó ti rán mi láti kéde ìtúsílẹ̀[a] fún àwọn ìgbèkùn àti ìríran padà fún àwọn afọ́jú, láti rán àwọn tí a ti tẹ̀ mọ́lẹ̀[b] jáde ní ìtúsílẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ìdáríjì” fún “ìtúsílẹ̀” (Gíríìkì: ἄφεσις); níbí, ọ̀rọ̀ nípa àwọn ìgbèkùn àti àwọn tí a tẹ̀ mọ́lẹ̀ mú kí ìtumọ̀ ìdáǹdè bójú mu jù.'
    reason: lexical_alternative
  - marker: b
    text: Ní ti gangan, “àwọn tí a ti fọ́ túútúú”; “àwọn tí a ti tẹ̀ mọ́lẹ̀” mú ìtumọ̀ àpèjúwe náà jáde nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: Ẹ̀mí Olúwa
  rationale: Ó ṣe àfihàn ìbáṣepọ̀ tí ọ̀rọ̀ Gíríìkì náà ní, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ‘Ẹ̀mí Olúwa’ mu.
- source_word: ἐπ’ ἐμέ
  choice: ń bẹ lára mi
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe tí a kọ sí Gíríìkì, gbolohun Yorùbá nílò rẹ̀; ‘ń bẹ lára mi’ pa àwòrán pé Ẹ̀mí wà lórí ẹni náà mọ́ ní èdè àdánidá.
- source_word: οὗ εἵνεκεν
  choice: nítorí
  rationale: Ó mú ìtumọ̀ ìdí tí àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní jáde ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: ἔχρισέν με
  choice: ó ti fi òróró yàn mí
  rationale: ‘Fi òróró yàn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìyànní nípa fífi òróró kàn ẹni, ó sì pa ìtumọ̀ Mèsáyà tó wà nínú χρίω mọ́. ‘Ó ti’ fi ipa iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì ń bá a lọ hàn.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: láti kéde ìhìn rere fún àwọn òtòṣì
  rationale: ‘Kéde ìhìn rere’ mú iṣẹ́ pípolongo náà jáde láìlo ọ̀rọ̀ ẹ̀sìn tí ó lè nira; ‘àwọn òtòṣì’ kò fi kún bóyá òṣì owó tàbí ipò àwùjọ ni a ń tọ́ka sí.
- source_word: ἀπέσταλκέν με
  choice: Ó ti rán mi
  rationale: Ó pa ìtumọ̀ iṣẹ́ rírán tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí ipa rẹ̀ ń bá a lọ mọ́.
- source_word: κηρύξαι
  choice: láti kéde
  rationale: ‘Kéde’ tọ́ka sí pípolongo ní gbangba, ó sì bójú mu ju ọ̀rọ̀ tí a lè kà sí iṣẹ́ ìwàásù nìkan lọ.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: ìtúsílẹ̀ fún àwọn ìgbèkùn
  rationale: Ní àyíká ọ̀rọ̀ Aísáyà yìí, ἄφεσις ń tọ́ka sí dídá àwọn ìgbèkùn sílẹ̀. ‘Ìtúsílẹ̀’ pa àwòrán òmìnira náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń tọ́ka sí ‘ìdáríjì’ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: ìríran padà fún àwọn afọ́jú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ríran tàbí gba ìríran padà; ‘ìríran padà’ pa agbára ἀνάβλεψις mọ́ ju ‘ìríran’ lásán lọ.
- source_word: ἀποστεῖλαι
  choice: láti rán ... jáde
  rationale: Ó pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe ‘rán’ mọ́, dípò yíyí rẹ̀ padà sí ‘dá sílẹ̀’ nìkan.
- source_word: τεθραυσμένους
  choice: àwọn tí a ti tẹ̀ mọ́lẹ̀
  rationale: Ní ti gangan, ọ̀rọ̀ náà ń sọ nípa àwọn tí a ti fọ́ tàbí pa lára; ní àyíká ìtúsílẹ̀ yìí, ‘àwọn tí a ti tẹ̀ mọ́lẹ̀’ jẹ́ Yorùbá tó ṣe kedere fún ìtumọ̀ rẹ̀ ní àpèjúwe.
- source_word: ἐν ἀφέσει
  choice: ní ìtúsílẹ̀
  rationale: Ó tún lo ‘ìtúsílẹ̀’ bí Gíríìkì ṣe tún ἄφεσις sọ, ó sì pa ìsopọ̀ ọ̀rọ̀ àsọyé méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄφεσις nínú àyọlò Aísáyà yìí
  choice: ìtúsílẹ̀
  alternative: ìdáríjì
  rationale: Àwọn ọ̀rọ̀ tó yí i ká—àwọn ìgbèkùn, àwọn afọ́jú, àti àwọn tí a tẹ̀ mọ́lẹ̀—ń tẹnu mọ́ ìdáǹdè àti ìmúpadàbọ̀sípò. Síbẹ̀, nítorí ἄφεσις tún lè túmọ̀ sí ìdáríjì, àlàyé ìsàlẹ̀ ojú ewé pa àṣàyàn yẹn mọ́ láìfi í ṣe ìtumọ̀ pàtàkì níbí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. ‘Fi òróró yàn,’ ‘kéde,’ àti ‘ìtúsílẹ̀’ pa ìró Ìwé Mímọ́ àti àwòrán ìdáǹdè inú àyọlò náà mọ́, ṣùgbọ́n gbolohun náà ṣì ṣeé lóye fún òǹkàwé Yorùbá lónìí.
