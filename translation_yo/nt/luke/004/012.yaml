id: LUK.4.12
reference: Luke 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “A ti sọ pé, ‘Ìwọ kò gbọdọ̀ dán Olúwa Ọlọ́run rẹ wò.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ àṣà sábà máa ń ní, “A ti kọ ọ́ pé.” Ṣùgbọ́n Gíríìkì níhìn-ín sọ ní tààrà pé, “A ti sọ pé.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ yìí jẹ́ àyọlò láti Deuteronomi 6:16, níbi tí Hébérù ti ní orúkọ Ọlọ́run YHWH, tí a sábà máa ń túmọ̀ sí “OLÚWA.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: dá a lóhùn pé
  rationale: Àpapọ̀ participle àti finite verb yìí jẹ́ ọ̀nà Gíríìkì tí ó ní ipa èdè Semitic, tó túmọ̀ sí pé ẹni náà dá ẹlòmíràn lóhùn; Yorùbá adayébá ni ‘dá a lóhùn pé.’
- source_word: αὐτῷ
  choice: a
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà tọ́ka sí Èṣù nínú àyíká ẹsẹ̀ yìí; ‘a’ ni Yorùbá adayébá fún un gẹ́gẹ́ bí object.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ṣe àfihàn àkóónú ọ̀rọ̀ tí Jésù sọ, ó sì bá ìṣètò gbolohun Yorùbá mu.
- source_word: Εἴρηται
  choice: A ti sọ pé
  rationale: Perfect passive ti λέγω túmọ̀ sí ‘a ti sọ’; yíyan yìí pa ọ̀rọ̀ orísun mọ́ dípò lílo ‘a ti kọ ọ́,’ bó tilẹ̀ jẹ́ pé ó jẹ́ ọ̀rọ̀ àyọlò láti inú Ìwé Mímọ́.
- source_word: Οὐκ ἐκπειράσεις
  choice: Ìwọ kò gbọdọ̀ dán ... wò
  rationale: ἐκπειράζω túmọ̀ sí fífi ẹnìkan tàbí ohun kan sínú àdánwò láti mọ̀ bó ṣe máa hù; ‘dán ... wò’ ṣe kedere, kò sì túmọ̀ sí dídẹ ẹnìkan sínú ẹ̀ṣẹ̀.
- source_word: κύριον
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος nínú ọ̀rọ̀ àyọlò yìí.
- source_word: τὸν θεόν σου
  choice: Ọlọ́run rẹ
  rationale: Èyí pa ìtumọ̀ apposition náà àti ọ̀rọ̀ májẹ̀mú ‘Ọlọ́run rẹ’ mọ́ ní Yorùbá adayébá.
theological_decisions:
- issue: Ọ̀nà ìtọ́ka sí Ìwé Mímọ́ (Εἴρηται)
  choice: A ti sọ pé
  alternative: A ti kọ ọ́ pé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ perfect passive ti λέγω (‘sọ’), kì í ṣe γράφω (‘kọ’). Nítorí náà, àkọ́kọ́ ọrọ̀ tẹ̀ lé orísun Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ àṣà hàn.
- issue: Ìtumọ̀ κύριος nínú àyọlò Deuteronomi 6:16
  choice: Olúwa
  alternative: OLÚWA
  rationale: SBLGNT ní κύριον, nítorí náà ‘Olúwa’ ni a lò nínú àkọ́kọ́ ọrọ̀. Síbẹ̀, orísun Hébérù ní orúkọ Ọlọ́run YHWH; àlàyé ìsàlẹ̀ pa ìbáṣepọ̀ yẹn mọ́ láì fi ọ̀nà Hébérù rọ́pò ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Dá a lóhùn’ àti ‘dán ... wò’ jẹ́ ọ̀rọ̀ adayébá, nígbà tí ‘A ti sọ pé’ pa ìyàtọ̀ orísun Gíríìkì mọ́.
