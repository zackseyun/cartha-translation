id: LUK.4.25
reference: Luke 4:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín ní òtítọ́ pé, àwọn opó púpọ̀ wà ní Ísírẹ́lì ní àwọn ọjọ́ Èlíjà, nígbà tí a ti ojú ọ̀run pa fún ọdún mẹ́ta àti oṣù mẹ́fà, tí ìyàn ńlá sì ṣẹlẹ̀ káàkiri gbogbo ilẹ̀ náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n lóòótọ́ ni mo sọ fún yín pé
  rationale: Ó fi ìtakò δὲ àti ìtẹnumọ́ ἐπ’ ἀληθείας hàn ní Yorùbá àdánidá, láì sọ ọ́ di ìbúra.
- source_word: χῆραι
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn obìnrin tí ọkọ wọn ti kú; àyíká Gíríìkì fi hàn pé opó obìnrin ni.
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: ojú ọ̀run sé
  rationale: Ó pa àwòrán Gíríìkì mọ́ pé ọ̀run ni a sé, èyí tí ó túmọ̀ sí pé òjò kò rọ̀.
- source_word: λιμὸς μέγας
  choice: ìyàn ńlá
  rationale: Ìtumọ̀ tààrà, tó sì ṣe kedere fún àjálù àìní oúnjẹ tó le.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: káàkiri gbogbo ilẹ̀ náà
  rationale: Ó pa ìwọ̀n gbólóhùn orísun mọ́; ‘ilẹ̀ náà’ lè tọ́ka sí gbogbo agbègbè tí ọ̀rọ̀ náà ń sọ nípa rẹ̀ láì fi dandan túmọ̀ sí gbogbo ayé.
theological_decisions:
- issue: Bóyá ἐπ’ ἀληθείας jẹ́ ìbúra tàbí ìtẹnumọ́ òtítọ́
  choice: lóòótọ́ ni mo sọ fún yín
  alternative: ní òtítọ́ ni mo sọ fún yín
  rationale: Gbólóhùn náà ń tẹnumọ́ ìgbẹ́kẹ̀lé ọ̀rọ̀ Jésù, ṣùgbọ́n kò pọndandan kí a ka a sí ìbúra pàtó.
- issue: Ìwọ̀n ‘gbogbo ilẹ̀’
  choice: gbogbo ilẹ̀ náà
  alternative: gbogbo ayé
  rationale: γῆ lè túmọ̀ sí ilẹ̀ tàbí agbègbè; yíyan ‘ilẹ̀ náà’ yẹra fún fífi ìtumọ̀ àgbáyé kan lé ọ̀rọ̀ tí ó lè ní ààlà agbègbè.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ojú ọ̀run sé’ láti pa àwòrán orísun mọ́.
