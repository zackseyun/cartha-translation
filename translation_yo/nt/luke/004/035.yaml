id: LUK.4.35
reference: Luke 4:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: yo
  text: Jésù sì bá a wí gidigidi pé, “Dákẹ́[a], kí o sì jáde kúrò lára rẹ̀.” Ẹ̀mí èṣù náà sì ju ọkùnrin náà sí àárín wọn, ó sì jáde kúrò lára ọkùnrin náà láìṣe é ní ìpalára kankan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ti gidi, “Dí ẹnu rẹ mú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láìṣe é ní ìpalára rárá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: bá a wí
  rationale: Ọ̀rọ̀ yìí fi ìbáwí líle àti àṣẹ Jésù hàn; arọ́pò-orúkọ náà tọ́ka sí ẹ̀mí èṣù tí Jésù ń bá sọ̀rọ̀.
- source_word: Φιμώθητι
  choice: Dákẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé φιμόω lè túmọ̀ ní ti gidi sí dí ẹnu ohun kan, nínú àṣẹ sí ẹni tó ń sọ̀rọ̀, “Dákẹ́” ni Yorùbá àdánidá tó pa agbára àṣẹ náà mọ́.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: kí o sì jáde kúrò lára rẹ̀
  rationale: Èyí sọ àṣẹ ìlépa ẹ̀mí èṣù jáde ní kedere, ó sì tẹ̀ lé èrò ἀπό pé kí ó kúrò lára ọkùnrin náà.
- source_word: ῥίψαν αὐτὸν εἰς τὸ μέσον
  choice: gbé ọkùnrin náà ṣán sí àárín wọn
  rationale: “Gbé ... ṣán” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ju ẹni kan lọ́nà líle; “àárín wọn” mú ipò tó yé nínú àyíká náà jáde láìfi ìtumọ̀ tuntun kún un.
- source_word: τὸ δαιμόνιον
  choice: ẹ̀mí èṣù náà
  rationale: Yíyan yìí dá ìwà ẹ̀dá ẹ̀mí búburú tí ìtàn náà ń sọ̀rọ̀ nípa rẹ̀ dúró, ó sì jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé Yorùbá.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: láìṣe é léṣe rárá
  rationale: Gbólóhùn yìí fi ìtẹnumọ́ μηδέν hàn pé, láìka bí ẹ̀mí náà ṣe gbé e ṣán sílẹ̀ sí, kò ṣe ọkùnrin náà ní ìpalára kankan.
theological_decisions:
- issue: Bí a ṣe máa ṣàfihàn δαιμόνιον nínú ìtàn ìlépa ẹ̀mí èṣù
  choice: Túmọ̀ ọ́ sí “ẹ̀mí èṣù,” kí a sì pa àfihàn ẹsẹ náà mọ́ pé ẹ̀dá ẹ̀mí búburú kan ni Jésù bá wí, tí ó sì jáde kúrò lára ọkùnrin náà.
  alternative: Túmọ̀ ọ́ lọ́nà àfojúrí sí “agbára búburú” tàbí àìsàn ọpọlọ.
  rationale: Gíríìkì náà fi ìbánisọ̀rọ̀ tààrà àti jíjáde kúrò lára ẹni hàn; ìtumọ̀ kò gbọ́dọ̀ sọ ìtàn náà di ohun àfojúrí ju bí orísun ṣe sọ ọ́ lọ.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. A yan “bá a wí” fún àṣẹ líle Jésù, “Dákẹ́” fún àṣẹ kúkúrú tó lágbára, àti “láìṣe é léṣe rárá” láti pa ìtẹnumọ́ pé ọkùnrin náà kò fara pa mọ́.
