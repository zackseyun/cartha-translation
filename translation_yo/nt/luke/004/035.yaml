  source_fidelity: 'Ìtumọ̀ náà gba ìlànà ìtumọ̀ Gíríìkì mọ́ ní pàtàkì: Jésù bá ẹ̀mí búburú náà wí, ó pàṣẹ pé kí ó dákẹ́ kí ó sì jáde; ẹ̀mí náà ju ọkùnrin náà sí àárín, ó sì jáde láìpa á lára. Síbẹ̀, “bá a wí” nìkan lè túmọ̀ sí sísọ fún un, kì í fi ìbáwí líle ἐπετίμησεν hàn dáadáa. “Gbé ... ṣán” kò ṣàfihàn ῥίψαν ní tààrà bí “ju” ṣe ń ṣe, àti “láìṣe é léṣe” kò dájú gẹ́gẹ́ bí ọ̀nà Yorùbá òde òní fún ‘láìṣe ìpalára.’'
