  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: yo
  text: 'Wọ́n sì fi àkájọ ìwé wòlíì Aísáyà lé e lọ́wọ́[a]. Lẹ́yìn tí ó tú àkájọ ìwé náà, ó rí ibi tí a ti kọ ọ́ pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwé.” Ọ̀rọ̀ Gíríìkì náà, βιβλίον, lè túmọ̀ sí ìwé tàbí àkọsílẹ̀ lápapọ̀, ṣùgbọ́n ní àyíká sínágọ́gù yìí, ó ṣeé ṣe jù lọ pé àkájọ ìwé ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: Wọ́n sì fi … lé e lọ́wọ́
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ìṣe aláìṣe, èdè Yorùbá máa ń lo ìṣe olùṣe tí a kò dárúkọ fún irú ọ̀rọ̀ yìí; ó sì bá bí a ṣe ń fi ohun fún ẹni láti kà mu.
- source_word: βιβλίον
  choice: àkájọ ìwé
  rationale: Ní àyíká sínágọ́gù ọ̀rúndún kìíní, ohun tí ọ̀rọ̀ náà ń tọ́ka sí ṣeé ṣe jù lọ láti jẹ́ ìwé tí a ká, kì í ṣe ìwé oníewé bí ti òde òní.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: wòlíì Aísáyà
  rationale: Èyí fi hàn pé Aísáyà ni wòlíì tí àkájọ ìwé náà jẹ́ tirẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀναπτύξας
  choice: Lẹ́yìn tí ó tú àkájọ ìwé náà
  rationale: Ó fi hàn gbangba pé ó kọ́kọ́ tú àkájọ náà kí ó tó rí ibi náà, ó sì bá ìrísí àkájọ ìwé mu ju ‘ṣí’ lọ.
- source_word: εὗρεν
  choice: ó rí
  rationale: Ìtumọ̀ tààrà àti ti ẹ̀dá fún wíwá ibi kan nínú ohun tí a kọ.
- source_word: τόπον
  choice: ibi
  rationale: Ó pa àwòrán ‘ibi’ kan nínú àkọsílẹ̀ mọ́ láì sọ ọ́ di ‘ẹsẹ̀’ tàbí ‘apá’ tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó.
- source_word: οὗ ἦν γεγραμμένον
  choice: ibi tí a ti kọ ọ́ pé
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí fún gbolohun tí ó ń tọ́ka sí ohun tí a ti kọ tẹ́lẹ̀, tí ó sì ń ṣáájú ọ̀rọ̀ àyọlò tó tẹ̀ lé e.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. A lo ‘àkájọ ìwé’ láti fi irú ohun ìkọ̀wé ti ìgbà náà hàn, a sì lo ‘wọ́n fi … lé e lọ́wọ́’ gẹ́gẹ́ bí ọ̀nà Yorùbá tó ṣe kedere fún ìṣe aláìṣe Gíríìkì.
