  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: yo
  text: Nítorí a ti kọ ọ́ sílẹ̀ pé, “Yóò pàṣẹ fún àwọn áńgẹ́lì rẹ̀ nípa rẹ, láti ṣọ́ ọ[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí “láti dáàbò bo ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún títọ́ka sí ohun tí a kọ sínú Ìwé Mímọ́, ó sì pa ìtumọ̀ perfect passive mọ́ pé ohun tí a kọ náà ṣì ní agbára.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa iṣẹ́ àlàyé tí γὰρ ń ṣe mọ́, ní sísopọ̀ àyọlò Ìwé Mímọ́ yìí mọ́ ọ̀rọ̀ ìdánwò tó ṣáájú.
- source_word: ὅτι
  choice: pé
  rationale: Lẹ́yìn ‘a ti kọ ọ́,’ pé ni ọ̀nà Yorùbá àdánidá láti fi ṣí ọ̀rọ̀ tí a fa yọ.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: fún àwọn áńgẹ́lì rẹ̀
  rationale: Dative náà bá ‘pàṣẹ fún’ mu ní Yorùbá, possessive αὐτοῦ sì jẹ́ ‘rẹ̀.’
- source_word: ἐντελεῖται
  choice: Yóò pàṣẹ
  rationale: Ó fi ìtumọ̀ fífúnni ní àṣẹ tàbí ìtọ́ni hàn ní ṣókí, ó sì pa àkókò ọjọ́ iwájú mọ́.
- source_word: περὶ σοῦ
  choice: nípa rẹ
  rationale: ‘Nípa rẹ’ jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún περί pẹ̀lú genitive, láì yí i sí ‘fún ọ.’
- source_word: τοῦ διαφυλάξαι σε
  choice: láti máa ṣọ́ ọ
  rationale: ‘Láti’ fi ipa purpose infinitive hàn, ‘máa ṣọ́ ọ’ sì mú ìtumọ̀ ìṣọ́ àti ààbò διαφυλάσσω jáde ní èdè àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àyọlò Sáàmù nínú ọ̀rọ̀ Èṣù
  choice: Túmọ̀ ọ̀rọ̀ Lúùkù gẹ́gẹ́ bí ó ṣe wà, láì fi apá Sáàmù tí kò sí nínú ẹsẹ yìí kún un.
  alternative: Kí a lo gbólóhùn ìbílẹ̀ tàbí kí a fi ọ̀rọ̀ Sáàmù 91:11 tó kù kún àyọlò náà.
  rationale: Lúùkù ṣe àkọsílẹ̀ apá tí a fa yọ níbí nìkan. Fífún un ní kíkún láti inú Sáàmù yóò fi ọ̀rọ̀ tí kò sí nínú Giriki ẹsẹ yìí kún un, ó sì lè bo bí ẹni tó ń dán Jésù wò ṣe lo Ìwé Mímọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà Ìwé Mímọ́ ní gbangba. A lo ‘áńgẹ́lì’ gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn Yorùbá tí gbogbo ènìyàn mọ̀.
