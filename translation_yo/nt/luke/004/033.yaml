source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: yo
  text: Nínú sínágọ́gù náà, ọkùnrin kan wà tí ó ní ẹ̀mí èṣù àìmọ́ kan[a], ó sì ké jáde pẹ̀lú ohùn rara,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí àìmọ́ kan ti èṣù.” Gíríìkì lo ọ̀rọ̀ méjèèjì fún “ẹ̀mí” àti “èṣù.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ Yorùbá míì, “ó sì ké rara.”
    reason: previous_rendering
lexical_decisions:
- source_word: συναγωγῇ
  choice: sínágọ́gù
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ibi tí àwọn Júù ti máa ń péjọ fún ìjọsìn; ‘sínágọ́gù’ ni ọ̀rọ̀ Yorùbá tó péye jù lọ ní àyíká yìí.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ẹni kan ṣoṣo tí a ń sọ̀rọ̀ rẹ̀ jẹ́ akọ nínú ìtàn náà, nítorí náà ‘ọkùnrin kan’ bójú mu ju ọ̀rọ̀ gbogbogbò lọ.
- source_word: ἔχων
  choice: tí ó ní
  rationale: Èyí túmọ̀ sí ‘ní’ ní tààràtà, ó sì yẹra fún fífi ìtumọ̀ àlàyé bí ‘tí ẹ̀mí èṣù ń gbé inú rẹ̀’ kún ọ̀rọ̀ Gíríìkì.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: ẹ̀mí àìmọ́ ti ẹ̀mí èṣù
  rationale: Ìtumọ̀ yìí pa ‘ẹ̀mí’ àti ‘ẹ̀mí èṣù’ méjèèjì mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ní wọn, ó sì fi ìbáṣepọ̀ àfikún-orúkọ inú gbólóhùn náà hàn láì dín un kù sí ‘ẹ̀mí búburú’ nìkan.
- source_word: ἀνέκραξεν
  choice: ké jáde
  rationale: Ó sọ ìgbésẹ̀ kíké lójijì àti ní agbára ní èdè Yorùbá àdánidá, láì fi àwòrán tó lágbára ju ti orísun lọ kún un.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohùn náà ga, ó sì pa àwòrán ‘ohùn’ inú Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe tú àwọn ọ̀rọ̀ tó ní í ṣe pẹ̀lú ẹ̀mí èṣù
  choice: ẹ̀mí àìmọ́ ti ẹ̀mí èṣù
  alternative: ẹ̀mí èṣù àìmọ́ kan; ẹ̀mí àìmọ́ kan
  rationale: Gíríìkì ní πνεῦμα àti δαιμόνιον ní kedere. Ìtumọ̀ tí a yàn pa àwọn méjèèjì mọ́, kò dín ìṣẹ̀lẹ̀ àgbàyanu náà kù, kò sì fi ẹ̀kọ́ ìsìn míì tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn síbi tí ó bá jẹ́ àdánidá. ‘Sínágọ́gù’ jẹ́ ọ̀rọ̀ ìtàn àti ẹ̀sìn tó péye; ‘ẹ̀mí àìmọ́ ti ẹ̀mí èṣù’ mọ̀ọ́mọ̀ pa ìtẹ̀sí ọ̀rọ̀ Gíríìkì tí ó ṣàjèjì díẹ̀ mọ́.
