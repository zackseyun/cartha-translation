id: LUK.4.23
reference: Luke 4:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: yo
  text: 'Ó sì wí fún wọn pé, “Dájúdájú, ẹ̀yin yóò sọ òwe yìí fún mi: ‘Oníṣègùn, wo ara rẹ sàn.’ Gbogbo ohun tí a gbọ́ pé ó ṣẹlẹ̀ ní Kápánáúmù[a], ṣe bẹ́ẹ̀ níhìn-ín pẹ̀lú, ní ìlú ìbílẹ̀ rẹ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà jù, ọ̀rọ̀ Gíríìkì náà ní εἰς, ìyẹn “sí” tàbí “sínú,” níwájú “Kápánáúmù”; ṣùgbọ́n nínú àyíká yìí, ó ń tọ́ka sí ibi tí ohun náà ti ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Dájúdájú
  rationale: Ó fi ìdánilójú hàn pé Jésù mọ ohun tí wọn yóò sọ; ó sì bá ọ̀rọ̀ àsọtẹ́lẹ̀ inú ọ̀rọ̀-ìṣe ọjọ́ iwájú mu.
- source_word: ἐρεῖτέ μοι
  choice: ẹ̀yin yóò sọ ... fún mi
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú mọ́ gẹ́gẹ́ bí àsọtẹ́lẹ̀, kì í ṣe àṣẹ tàbí àfojúsùn lásán.
- source_word: παραβολὴν
  choice: òwe
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí gbólóhùn òwe kúkúrú, kì í ṣe àkàwé onítàn.
- source_word: Ἰατρέ
  choice: Oníṣègùn
  rationale: Ó túmọ̀ sí ẹni tó ń ṣe iṣẹ́ ìwòsàn, ó sì pa ìrísí òwe ọlọ́lá mọ́ ní Yorùbá.
- source_word: θεράπευσον σεαυτόν
  choice: wo ara rẹ sàn
  rationale: Ó jẹ́ àṣẹ tààrà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘heal yourself.’
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Gbogbo ohun tí a gbọ́ pé ó ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ ohun tí a gbọ́ nípa àwọn ìṣẹ̀lẹ̀ náà mọ́, láì sọ ní pàtó pé ẹni kan ló ṣe wọn nígbà tí Gíríìkì kò fi bẹ́ẹ̀ hàn gbangba.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: ní Kápánáúmù
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń túmọ̀ sí ‘sí/sínú,’ pẹ̀lú ohun tó ṣẹlẹ̀, ìtumọ̀ ibi ni ó bá àyíká yìí mu jù.
- source_word: ποίησον καὶ ὧδε
  choice: ṣe é níhìn-ín pẹ̀lú
  rationale: Ó pa àṣẹ aorist àti agbára καί mọ́, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ πατρίδι σου
  choice: ní ìlú ìbílẹ̀ rẹ
  rationale: Ní àyíká Násárẹ́tì, πατρίς ń tọ́ka sí ibi tàbí ìlú ẹni, kì í ṣe dandan sí orílẹ̀-èdè.
theological_decisions:
- issue: Ìrú παραβολή ní àyíká yìí
  choice: òwe
  alternative: àkàwé; ọ̀rọ̀ àpèjúwe
  rationale: ‘Oníṣègùn, wo ara rẹ sàn’ jẹ́ òwe kúkúrú, kì í ṣe àkàwé onítàn; ìpinnu ọ̀rọ̀ ni èyí, kì í ṣe fífi ẹ̀kọ́ ìsìn kan kún un.
- issue: Bí a ṣe máa túmọ̀ γενόμενα
  choice: ó ṣẹlẹ̀
  alternative: tí a ṣe
  rationale: Apá-ọrọ̀ náà sọ ní tààrà nípa ohun tó wáyé, láì dárúkọ olùṣe. ‘Ó ṣẹlẹ̀’ pa àìsọ pàtó yẹn mọ́, bó tilẹ̀ jẹ́ pé àyíká náà lè jẹ́ kí a lóye àwọn iṣẹ́ agbára tí Jésù ṣe.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Ẹ̀yin’ bá ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀ mu; ‘ìlú ìbílẹ̀’ sì ṣe kedere fún ibi tí ẹni ti dàgbà tàbí ti wá.
