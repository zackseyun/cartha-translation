review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí ìṣe mẹ́ta nínú Gíríìkì: Jésù dúró lókè obìnrin náà, ó bá ibà náà wí, ibà náà sì fi í sílẹ̀. Síbẹ̀, “dúró lé e lórí” lè túmọ̀ sí pé ó dúró lórí ara rẹ̀; “dúró lókè rẹ̀” pa ipò ἐπάνω αὐτῆς mọ́ ní kedere. Ìṣe imperfect διηκόνει dára jù láti jẹ́ “ó sì ń ṣe ìránṣẹ́ fún wọn” ju fífi ìtumọ̀ inceptive “bẹ̀rẹ̀ sí í” dì mú lọ.'
  naturalness: “Ó sì dúró lókè rẹ̀” jẹ́ Yorùbá tó rọrùn, tó sì yà kúrò nínú àìnídìí ti “lé e lórí.” “Lẹ́sẹ̀kẹsẹ̀” jẹ́ ọ̀nà ìgbàlódé tí ó ṣe kedere fún παραχρῆμα. “Ń ṣe ìránṣẹ́ fún wọn” jẹ́ ìsọ̀rọ̀ àdánidá fún iṣẹ́ ìtọ́jú/ìsìn tí a sọ nínú ẹsẹ̀ yìí.
  terminology: '“Bá ibà náà wí” pa ἐπετίμησεν mọ́ gẹ́gẹ́ bí ìbáwí tó ní àṣẹ, láìfi èrò pé ẹ̀mí èṣù ló fa ibà náà kún un. “Ibà náà” dájú fún τῷ πυρετῷ. A tún ṣe àtúnṣe àlàyé ẹsẹ̀ ìsàlẹ̀ kí ó bá ọ̀rọ̀ Gíríìkì mu: kókó-ọrọ̀ “ibà” ni a lóye, bí ó tilẹ̀ jẹ́ pé a kò tún darúkọ rẹ̀.'
