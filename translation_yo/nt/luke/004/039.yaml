    rationale: Imperfect διηκόνει lè jẹ́ ìṣe tí ń lọ ní ìgbà náà; kò dájú pé inceptive ni. “Ó sì ń ṣe ìránṣẹ́” pa àìdájú náà mọ́.
  - severity: low
