source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: yo
  text: Ó sì dúró lókè rẹ̀, ó bá ibà náà wí, ibà náà sì fi obìnrin náà sílẹ̀.[a] Lẹ́sẹ̀kẹsẹ̀, obìnrin náà dìde, ó sì ń ṣe ìránṣẹ́ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, a kò tún darúkọ ibà náà ní gbangba nínú gbolóhùn yìí; ibà náà ni kókó-ọrọ̀ tí a lóye pé ó fi obìnrin náà sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: Ó sì dúró lé e lórí
  rationale: Ọ̀rọ̀ yìí pa àwòrán bí Jésù ṣe dúró lókè obìnrin náà mọ́, láìfi àlàyé míì kún un.
- source_word: ἐπετίμησεν
  choice: ó bá ... wí
  rationale: ‘Bá ... wí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáwí líle tí ó ní àṣẹ nínú àyíká yìí.
- source_word: τῷ πυρετῷ
  choice: ibà náà
  rationale: A darúkọ ibà fúnra rẹ̀ gẹ́gẹ́ bí ohun tí Jésù bá wí, bí Gíríìkì ṣe ṣe, dípò ṣíṣe àlàyé rẹ̀ sí ‘àìsàn’ lápapọ̀.
- source_word: ἀφῆκεν αὐτήν
  choice: ibà náà sì fi obìnrin náà sílẹ̀
  rationale: Yíyan ibà gẹ́gẹ́ bí ẹni tí ó fi obìnrin náà sílẹ̀ mú ìtumọ̀ ọ̀rọ̀ Gíríìkì tí a kò tún sọ kedere hàn, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: παραχρῆμα
  choice: Lójú ẹsẹ̀
  rationale: Ó fi bí ìwòsàn náà ṣe ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ hàn ní ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: ἀναστᾶσα
  choice: obìnrin náà dìde
  rationale: Ó sọ ìṣe rẹ̀ lẹ́sẹ̀kẹsẹ̀ ní ọ̀nà tí ó rọrùn, tí ó sì bójú mu.
- source_word: διηκόνει αὐτοῖς
  choice: ó sì bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún wọn
  rationale: ‘Bẹ̀rẹ̀ sí í’ mú ìbẹ̀rẹ̀ ìṣe tí imperfect náà lè tọ́ka sí hàn; ‘ṣe ìránṣẹ́ fún wọn’ sì yẹra fún ìtumọ̀ ṣọ́ọ̀ṣì tí kò pọndandan.
theological_decisions:
- issue: Bóyá ìbáwí tí Jésù bá ibà wí yẹ kí a túmọ̀ rẹ̀ bí ẹni pé ẹ̀mí èṣù ló fa àìsàn náà
  choice: Pa ọ̀rọ̀ náà mọ́ pé Jésù ‘bá ibà náà wí’
  alternative: Sọ pé ó pàṣẹ fún àìsàn náà tàbí pé ó lé ẹ̀mí àìmọ́ jáde
  rationale: Gíríìkì sọ pé Jésù bá ibà náà wí, ṣùgbọ́n kò ṣàlàyé pé ẹ̀mí èṣù ni. Ìtumọ̀ yìí pa àṣẹ Jésù àti ìfihàn Lúùkù mọ́ láìyanju ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó níyì, tí ó sì ṣe kedere ni a lò. A pa àwòrán ìbáwí sí ibà mọ́, láìsọ pé ibà náà jẹ́ ẹ̀mí èṣù. Àmì ohùn kíkún ni a lò níbi tí ó bá jẹ́ ti ẹ̀dá.
