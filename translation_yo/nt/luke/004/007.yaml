source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: yo
  text: Nítorí náà, bí ìwọ bá forí balẹ̀ níwájú mi[a], gbogbo rẹ̀ yóò jẹ́ tìrẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jọ́sìn fún mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fíforí balẹ̀ tàbí ìjọ́sìn; nínú àyíká yìí, Èṣù ń béèrè ọlá ẹ̀sìn tí ó yẹ fún Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn gbangba nínú Gíríìkì láti tẹnu mọ́ ẹni tí a ń bá sọ̀rọ̀; “ìwọ” dá ìtẹnumọ́ yẹn sí ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìgbésẹ̀ ọgbọ́n inú àbá Èṣù hàn, ó sì so ẹsẹ yìí mọ́ ohun tí ó sọ ṣáájú.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi gbólóhùn oníṣ şart hàn.
- source_word: προσκυνήσῃς
  choice: forí balẹ̀ fún mi
  rationale: Gbólóhùn yìí lè sọ ìwólẹ̀ tàbí ìtẹríba, ó sì lè ní agbára ìtumọ̀ ìjọ́sìn nínú àyíká ọ̀rọ̀ yìí; ó pa ìṣòro ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ láì sọ ọ́ di ohun kan ṣoṣo.
- source_word: ἐνώπιον ἐμοῦ
  choice: fún mi
  rationale: Nínú àkójọpọ̀ “forí balẹ̀ fún mi,” ìṣe náà jẹ́ èyí tí a ṣe níwájú ẹni tí a ń fi ọlá fún; Yorùbá àdánidá kò nílò àfikún “níwájú mi” lẹ́ẹ̀kan sí i.
- source_word: ἔσται σοῦ
  choice: yóò jẹ́ tìrẹ
  rationale: Ó sọ ohun-ìní ọjọ́ iwájú ní Yorùbá àdánidá.
- source_word: πᾶσα
  choice: gbogbo rẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí gbogbo ohun tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú, láì fi orúkọ tuntun kún un.
theological_decisions:
- issue: Bóyá προσκυνέω túmọ̀ sí ìwólẹ̀ lasan tàbí ìjọ́sìn ẹ̀sìn
  choice: forí balẹ̀ fún mi
  alternative: jọ́sìn fún mi
  rationale: “Forí balẹ̀ fún mi” pa ààyè ìtumọ̀ ìwólẹ̀ àti ọlá ẹ̀sìn mọ́. Àyíká ìdánwò náà àti ìdáhùn Jésù ní ẹsẹ tó tẹ̀ lé fi hàn pé ìjọ́sìn Ọlọ́run ni ọ̀ràn náà kan, ṣùgbọ́n a kò yẹ kí a pa ìtumọ̀ ìṣe ara tí ọ̀rọ̀ Gíríìkì náà tún lè ní rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ẹ̀dá ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Forí balẹ̀ fún mi” jẹ́ gbólóhùn tí òǹkàwé lasán lè lóye, ó sì pa ìtumọ̀ méjèèjì tí ọ̀rọ̀ orísun lè ní mọ́.
