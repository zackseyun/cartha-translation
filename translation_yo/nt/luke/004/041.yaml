  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: àwọn ẹ̀mí èṣù ń jáde lára ọ̀pọ̀ ènìyàn, wọ́n ń ké, wọ́n sì ń jẹ́wọ́ Jesu gẹ́gẹ́ bí Ọmọ Ọlọ́run; Jesu bá wọn wí, kò sì jẹ́ kí wọ́n sọ̀rọ̀ nítorí wọ́n mọ̀ pé òun ni Mèsáyà. Síbẹ̀, ‘Ṣùgbọ́n’ lè fún δέ ní agbára ìyàtọ̀/adversative tí kò dájú nínú ọ̀rọ̀ ìpilẹ̀. Bákan náà, fífi ‘ń’ sí ‘bá wọn wí’ máa ń mú imperfect ἐπιτιμῶν hàn ní kedere.'
  naturalness: ‘Àwọn ẹ̀mí èṣù,’ ‘láti/lára ọ̀pọ̀ ènìyàn,’ ‘ń ké jáde,’ ‘Ọmọ Ọlọ́run,’ àti ‘Mèsáyà’ jẹ́ Yorùbá boṣewa, ó sì rọrùn fún òǹkàwé òde òní. ‘Ó sì ń bá wọn wí’ jẹ́ ọ̀nà àdánidá láti fi ìbáwí aláṣẹ tí ó ń tẹ̀síwájú hàn.
  terminology: A pa ‘Ọmọ Ọlọ́run’ àti ‘Mèsáyà’ mọ́ gẹ́gẹ́ bí oyè méjì tó yàtọ̀, bí Gíríìkì ṣe ṣe. Àlàyé ‘Kristi’ gẹ́gẹ́ bí yíyàn mìíràn yẹ, ó sì yẹ kí a ṣàlàyé Χριστός ní ọ̀nà Yorùbá tó mọ́gbọn-dánilẹ́kọ̀ọ́.
  issues:
  - severity: low
    issue: ‘Ṣùgbọ́n’ fún δέ ní ìyàtọ̀ tó lágbára díẹ̀.
    rationale: δέ níbí lè jẹ́ ìsopọ̀ ìtẹ̀síwájú lásán (‘ó sì’/‘nígbà náà’), kì í ṣe ìtakò pátápátá. ‘Ó sì’ dá ambiguity Gíríìkì dúró dáadáa.
  - severity: low
    issue: Ìṣe imperfect nínú ‘ἐπιτιμῶν’ kò hàn kedere tó nínú ‘ó bá wọn wí.’
    rationale: ‘Ó sì ń bá wọn wí’ ń pa ipa ìṣe tí ó ń tẹ̀síwájú tàbí tí ó ń ṣẹlẹ̀ léraléra mọ́, ní ìbámu pẹ̀lú imperfect ‘οὐκ εἴα’ (‘kò sì jẹ́’).
  - severity: low
    issue: Ọ̀rọ̀ àlàyé ‘Ẹni Àmì-òróró’ lè yọ̀ọ́ síta díẹ̀ nínú àkọsílẹ̀.
    rationale: ‘Ẹni tí a fi òróró yàn’ ṣàlàyé ìtumọ̀ Χριστός ní Yorùbá tó kún àti tó mọ́gbọ́n-dánilẹ́kọ̀ọ́.
