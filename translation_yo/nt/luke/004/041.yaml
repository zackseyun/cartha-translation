revisions:
- from: Àwọn ẹ̀mí èṣù sì ń jáde lára ọ̀pọ̀ ènìyàn, wọ́n ń ké jáde pé, “Ìwọ ni Ọmọ Ọlọ́run!” Ṣùgbọ́n ó bá wọn wí, kò sì jẹ́ kí wọ́n sọ̀rọ̀, nítorí wọ́n mọ̀ pé òun ni Mèsáyà.[a]
  to: Àwọn ẹ̀mí èṣù sì ń jáde lára ọ̀pọ̀ ènìyàn, wọ́n ń ké jáde pé, “Ìwọ ni Ọmọ Ọlọ́run!” Ó sì ń bá wọn wí, kò sì jẹ́ kí wọ́n sọ̀rọ̀, nítorí wọ́n mọ̀ pé òun ni Mèsáyà.[a]
  rationale: Àtúnṣe náà yọ ìtumọ̀ ìtakò tí kò dájú kúrò nínú ‘Ṣùgbọ́n’ nípa lílo ‘Ó sì,’ ó sì fi àmì ìṣe tí ó ń tẹ̀síwájú sí ìbáwí Jesu. A tún ṣe ọ̀rọ̀ àlàyé náà ní ìròrùn kí ìtumọ̀ oyè Χριστός lè ṣe kedere, láì yí ìtumọ̀ ẹsẹ̀ náà padà.
