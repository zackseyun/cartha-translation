id: LUK.4.41
reference: Luke 4:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: yo
  text: Àwọn ẹ̀mí èṣù sì ń jáde lára ọ̀pọ̀ ènìyàn, wọ́n ń ké jáde pé, “Ìwọ ni Ọmọ Ọlọ́run!” Ó sì ń bá wọn wí, kò sì jẹ́ kí wọ́n sọ̀rọ̀, nítorí wọ́n mọ̀ pé òun ni Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός, ìyẹn “Mèsáyà/Ẹni tí a fi òróró yàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún àwọn ẹ̀mí búburú tí ọ̀rọ̀ Gíríìkì δαιμόνια ń tọ́ka sí; a kò lò ‘àwọn ẹ̀mí àìmọ́’ nítorí kì í ṣe gbólóhùn Gíríìkì tó wà níbí.
- source_word: ἐξήρχετο
  choice: ń jáde
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: ἀπὸ πολλῶν
  choice: lára ọ̀pọ̀ ènìyàn
  rationale: Gíríìkì fi ohun tí ‘ọ̀pọ̀’ ń tọ́ka sí sílẹ̀ láì sọ ọ́ ní kíkún; Yorùbá nílò kí a mú ‘ènìyàn’ hàn kí gbólóhùn lè ṣe kedere àti àdánidá.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: wọ́n ń ké jáde pé
  rationale: Ó pa ariwo líle mọ́, nígbà tí ‘pé’ ń ṣàgbékalẹ̀ ọ̀rọ̀ tí wọ́n sọ lọ́nà Yorùbá tó rọrùn.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa oyè Kristi yìí mọ́ ní kedere àti ní ọ̀nà tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa.
- source_word: ἐπιτιμῶν
  choice: ó bá wọn wí
  rationale: Gbólóhùn yìí fi ìbáwí aláṣẹ hàn ní Yorùbá àdánidá, láì sọ ọ́ di ìkìlọ̀ lásán.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: kò sì jẹ́ kí wọ́n sọ̀rọ̀
  rationale: Ó túmọ̀ àìfàyègbà náà ní Yorùbá tó ṣe kedere; imperfect náà bá ìṣe tó ń ṣẹlẹ̀ léraléra mu nínú àyíká.
- source_word: ᾔδεισαν
  choice: wọ́n mọ̀
  rationale: Fọ́ọ̀mù ọ̀rọ̀-ìṣe Gíríìkì ní ìtumọ̀ ipò ìmọ̀, èyí tí simple past/stative Yorùbá ‘wọ́n mọ̀’ gbé jáde dáadáa.
- source_word: τὸν χριστὸν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí, ìyẹn Ẹni Àmì-òróró; ‘Mèsáyà’ pa iṣẹ́ oyè náà mọ́ dípò lílò ‘Kristi’ bí ẹni pé orúkọ ni.
- source_word: αὐτὸν εἶναι
  choice: pé òun ni
  rationale: ‘Òun’ jẹ́ arọ́pò-orúkọ ìtẹnumọ́ tó ń tọ́ka sí ẹni tí wọ́n mọ̀ pé ó jẹ́ Mèsáyà, ó sì bá accusative-infinitive Gíríìkì mu lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ìdánimọ̀ tí àwọn ẹ̀mí èṣù mọ̀
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní àyíká yìí, kì í ṣe bí orúkọ; ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni àmì-òróró wá sí iwájú.
- issue: Ìbáṣepọ̀ láàárín ‘Ọmọ Ọlọ́run’ àti ‘Mèsáyà’
  choice: 'Pa oyè méjèèjì mọ́ lọ́tọ̀: àwọn ẹ̀mí èṣù pe e ní Ọmọ Ọlọ́run, akọ̀wé sì ṣàlàyé pé wọ́n mọ̀ pé òun ni Mèsáyà'
  alternative: Darapọ̀ oyè méjèèjì sí ìdánimọ̀ kan ṣoṣo
  rationale: Gíríìkì gbé àwọn oyè méjèèjì kalẹ̀ ní ọ̀nà tó jọra ṣùgbọ́n tó yàtọ̀; ìtumọ̀ náà kò tú ìṣòro ẹ̀kọ́-ìgbàgbọ́ yìí ká tàbí sọ wọ́n di ohun kan náà.
- issue: Ẹni tí Jesu bá wí
  choice: ‘wọn’ tọ́ka sí àwọn ẹ̀mí èṣù
  alternative: Lílo arọ́pò-orúkọ aláìlẹ́mìí
  rationale: Gíríìkì lo neuter αὐτά nítorí ìbámu gírámà pẹ̀lú δαιμόνια; Yorùbá kò ní ìyàtọ̀ akọ/abo/neuter nínú ‘wọn’, nítorí náà ó jẹ́ adayeba láì dín jíjẹ́ ẹ̀dá aṣojú wọn kù.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀mí èṣù’ dípò gbígbé ọ̀rọ̀ àjèjì wọlé, ‘ń jáde’ sì pa ìṣe léraléra ti imperfect mọ́. Àmì àlàyé [a] wà lẹ́yìn ‘Mèsáyà’ níbi tó yẹ.
