  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: yo
  text: Ó sì sọ̀ kalẹ̀ lọ sí Káfáránáúmù, ìlú kan ní Gálílì. Ó sì ń kọ́ wọn ní àwọn ọjọ́ ìsinmi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó rọrùn sí i, a lè sọ pé, “ní ọjọ́ ìsinmi.” Ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà: “ní àwọn ọjọ́ ìsinmi”; ó ṣeé ṣe kí ó tọ́ka sí ọ̀pọ̀ ìgbà ọjọ́ ìsinmi tí Jésù ń kọ́ wọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: sọ̀ kalẹ̀ lọ
  rationale: Ó pa ìtumọ̀ ìrìnàjò sí ibi tí ó rẹlẹ̀ mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ìrìnàjò bẹ́ẹ̀ mu.
- source_word: Καφαρναοὺμ
  choice: Kápánáúmù
  rationale: A lo ìkọ̀wé orúkọ ibi tí ó rọrùn fún òǹkàwé Yorùbá láti dá mọ̀, pẹ̀lú àmì ohùn tó bá ìpè rẹ̀ mu.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: ìlú kan ní Gálílì
  rationale: “Ìlú kan” fi àìní atọ́ka ọ̀rọ̀ Gíríìkì hàn; “ní Gálílì” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí ìlú náà wà.
- source_word: ἦν διδάσκων
  choice: ń kọ́ wọn
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ “ń” pa ìtumọ̀ ìṣe tí ó ń bá a lọ nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: αὐτοὺς
  choice: wọn
  rationale: A pa arọ́pò-orúkọ náà mọ́ láì fi ẹni tí a kò dárúkọ nínú ẹsẹ yìí kún un.
- source_word: ἐν τοῖς σάββασιν
  choice: ní àwọn ọjọ́ ìsinmi
  rationale: “Àwọn” pa ọ̀pọ̀ nínú σάββασιν mọ́, ó sì lè tọ́ka sí ìkọ́ni ní ọ̀pọ̀ ọjọ́ ìsinmi.
theological_decisions:
- issue: Bí a ó ṣe tú ọ̀pọ̀ σάββασιν
  choice: ní àwọn ọjọ́ ìsinmi
  alternative: ní ọjọ́ ìsinmi
  rationale: Yíyan ọ̀pọ̀ pa ẹ̀rí ọ̀rọ̀ Gíríìkì àti ìtumọ̀ ìṣẹ̀lẹ̀ tí ó lè máa tún wáyé mọ́, láì sọ ọ́ di ọjọ́ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá àdánidá mu, a sì pa ìtẹ̀sí ìṣe tí ń lọ lọ́wọ́ àti ọ̀pọ̀ “ọjọ́ ìsinmi” mọ́.
