id: LUK.4.22
reference: Luke 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: yo
  text: Gbogbo wọn sì ń sọ ohun rere nípa rẹ̀, ẹnu sì ń yà wọ́n nípa àwọn ọ̀rọ̀ oore-ọ̀fẹ́ tí ń jáde láti ẹnu rẹ̀[a]; wọ́n sì ń wí pé, “Èyí kì í ṣe ọmọ Jósẹ́fù bí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọ̀rọ̀ tí ó kún fún ojúrere” tàbí “àwọn ọ̀rọ̀ dídùn.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ tí ó ní ìwà oore-ọ̀fẹ́, ojúrere, tàbí ìfanimọ́ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: ń sọ̀rọ̀ rere nípa rẹ̀
  rationale: Gbólóhùn Gíríìkì náà lè túmọ̀ sí jíjẹ́rìí nípa ẹni kan tàbí sísọ ohun rere nípa rẹ̀. Ní àyíká yìí, ìtumọ̀ ìfọwọ́sí ni ó bá ìyàlẹ́nu wọn mu jù.
- source_word: ἐθαύμαζον
  choice: ẹnu sì ń yà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàlẹ́nu tí ó ń bá a lọ, gẹ́gẹ́ bí ìṣe aláìparí inú Gíríìkì ṣe fi hàn.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: sí àwọn ọ̀rọ̀ oore-ọ̀fẹ́
  rationale: ‘Sí’ fi ohun tí ó fa ìyàlẹ́nu hàn; ‘ọ̀rọ̀ oore-ọ̀fẹ́’ sì pa ìsopọ̀ genitive mọ́ láì dájú bóyá ó túmọ̀ sí ọ̀rọ̀ tí ó kún fún oore-ọ̀fẹ́, ojúrere, tàbí ìfanimọ́ra.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: tí ń ti ẹnu rẹ̀ jáde
  rationale: Ó pa àwòrán gidi ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: Οὐχὶ
  choice: kọ́ ni èyí bí?
  rationale: Ìbéèrè Yorùbá yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni, gẹ́gẹ́ bí Οὐχί ṣe ń ṣiṣẹ́ nínú Gíríìkì.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Ọmọ Jósẹ́fù
  rationale: Ó túmọ̀ ìbátan tí genitive náà sọ ní ṣókí àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtọ́ka sí Jésù gẹ́gẹ́ bí ọmọ Jósẹ́fù ní ìbámu pẹ̀lú oyún láìsí ìbálòpọ̀
  choice: Túmọ̀ ọ̀rọ̀ àwọn ènìyàn náà tààrà gẹ́gẹ́ bí ‘Ọmọ Jósẹ́fù’ láìfi àlàyé kún un.
  alternative: Fi ọ̀rọ̀ ìtumọ̀ tàbí àlàyé kún un láti yà á sọ́tọ̀ kúrò nínú ìtàn oyún láìsí ìbálòpọ̀.
  rationale: Ẹsẹ̀ náà ń ròyìn bí àwọn ènìyàn ṣe mọ Jésù, kì í ṣe àtúnṣe ẹ̀kọ́ láti ọ̀dọ̀ akọ̀wé. Ìtúmọ̀ gbọ́dọ̀ pa ìforígbárí inú ìtàn náà mọ́.
- issue: Ìtumọ̀ τῆς χάριτος
  choice: Lo ‘ọ̀rọ̀ oore-ọ̀fẹ́,’ kí ìtumọ̀ náà lè ní ààyè fún ọ̀rọ̀ tí oore-ọ̀fẹ́, ojúrere, tàbí ìfanimọ́ra ń ṣàpèjúwe.
  alternative: Lo ‘ọ̀rọ̀ dídùn’ nìkan, èyí tí yóò fi ìfanimọ́ra hàn ṣùgbọ́n tí yóò dín ìtumọ̀ χάρις kù.
  rationale: Ìkọ̀wé Gíríìkì ní ààyè fún ìtumọ̀ onírúurú; a kò gbọ́dọ̀ fi tipátipá yàn ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
