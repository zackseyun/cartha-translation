  to: Gbogbo wọn sì ń sọ ohun rere nípa rẹ̀, ẹnu sì ń yà wọ́n nípa àwọn ọ̀rọ̀ oore-ọ̀fẹ́ tí ń jáde láti ẹnu rẹ̀[a]; wọ́n sì ń wí pé, “Èyí kì í ṣe ọmọ Jósẹ́fù bí?”
  rationale: A ṣe àwọn àtúnṣe kékeré fún ìṣàn Yorùbá àti gírámà, nígbà tí a pa ìtumọ̀ Gíríìkì, ìrísí ìṣe aláìparí, ìbéèrè retóríkà, àti àìdájú tó wà nínú τῆς χάριτος mọ́.
