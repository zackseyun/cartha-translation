  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìfọwọ́sí àwọn ènìyàn, ìyàlẹ́nu wọn sí ọ̀rọ̀ Jésù, àti ìbéèrè tí ń retí ìdáhùn ‘bẹ́ẹ̀ ni’ hàn dáadáa. Ṣùgbọ́n ‘ẹnu ... yà ... sí’ kò rọrùn gẹ́gẹ́ bí ọ̀nà tí ó dára jù lọ láti so ohun tí ìyàlẹ́nu náà jẹ mọ́ ọn; ‘nípa’ dáa sí i. ‘Láti ẹnu rẹ̀’ sì jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tí ó rọrùn ju ‘tí ń ti ẹnu rẹ̀ jáde’ lọ, láì pàdánù ìtumọ̀ participle náà.
  naturalness: Àtúnṣe náà mú ìṣàn gbólóhùn náà rọrùn, ó sì lo ‘Èyí kì í ṣe ọmọ Jósẹ́fù bí?’ gẹ́gẹ́ bí ìbéèrè Yorùbá àdánidá tí ó pa agbára Οὐχί mọ́. A pa ìṣe aláìparí Gíríìkì mọ́ pẹ̀lú ‘ń’ ní gbogbo ibi tí ó yẹ.
  terminology: ‘Àwọn ọ̀rọ̀ oore-ọ̀fẹ́’ lè dúró gẹ́gẹ́ bí ìtumọ̀ tí ó ṣí silẹ̀ fún λόγοι τῆς χάριτος, bí ó tilẹ̀ jẹ́ pé ó lè ní ìgbọ́kànlé ẹ̀sìn ní etí àwọn kan. Àlàyé ìsàlẹ̀ ṣàlàyé àwọn ìfẹ̀hónúhàn ‘ojúrere’ àti ‘ìfanimọ́ra’ láì fi ìtumọ̀ kan tipátipá mú.
