  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: yo
  text: Ẹnu sì yà wọ́n nípa ẹ̀kọ́ rẹ̀, nítorí ọ̀rọ̀ rẹ̀ ní àṣẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìhìn rẹ̀ ní àṣẹ” tàbí “ohun tí ó sọ ní àṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu sì ń yà wọ́n
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle tí ó ń bá a lọ hàn; lílo “ń” tún ṣàfihàn ìṣe tí imperfect Gíríìkì ń tọ́ka sí.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sí ẹ̀kọ́ rẹ̀
  rationale: “Sí” fi ohun tí ó mú kí ẹnu yà wọ́n hàn, “ẹ̀kọ́” sì lè túmọ̀ sí iṣẹ́ kíkọ́ni àti ohun tí a ń kọ́ni.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí ẹnu fi ń yà wọ́n ní kedere.
- source_word: ἐν ἐξουσίᾳ
  choice: ní àṣẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ pé ọ̀rọ̀ náà ní agbára àti ẹ̀tọ́ aláṣẹ, láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ.
- source_word: ὁ λόγος αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: Ó pa ìṣókí λόγος mọ́, ó sì lè tọ́ka sí ohun tí Jésù sọ tàbí ìhìn tí ó ń kéde.
theological_decisions:
- issue: Irú àṣẹ tí ọ̀rọ̀ Jésù ní
  choice: ọ̀rọ̀ rẹ̀ ní àṣẹ
  alternative: ó ń sọ̀rọ̀ pẹ̀lú àṣẹ
  rationale: A ṣàpèjúwe ọ̀rọ̀ Jésù gẹ́gẹ́ bí èyí tó ní àṣẹ, ṣùgbọ́n a kò ṣàlàyé orísun àṣẹ náà ju ohun tí ẹsẹ yìí fúnra rẹ̀ sọ lọ.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣe kedere fún òǹkàwé òde òní. Gbólóhùn “Ẹnu ń yà wọ́n” jẹ́ ọ̀nà àdánidá láti fi ìyàlẹ́nu hàn; “ọ̀rọ̀ rẹ̀ ní àṣẹ” pa ìṣókí àti ìfojúsùn Gíríìkì mọ́.
