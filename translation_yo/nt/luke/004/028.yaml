lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: kún fún
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ àìṣe ti aorist mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìmọ̀lára kan gba ènìyàn patapata.
- source_word: πάντες
  choice: Gbogbo àwọn tí ó wà
  rationale: Èyí tọ́ka sí gbogbo àwọn ènìyàn tí ó wà níbẹ̀, ó sì mú ìtumọ̀ ẹgbẹ́ tí ọ̀rọ̀ Gíríìkì náà ní hàn ní Yorùbá àdánidá.
- source_word: θυμοῦ
  choice: ìbínú
  rationale: θυμός níbí túmọ̀ sí ìbínú líle. “Ìbínú” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì fi ipá kún ọ̀rọ̀ orísun ju bó ṣe yẹ lọ.
- source_word: ἐν τῇ συναγωγῇ
  choice: nínú sínágọ́gù
  rationale: Èyí pa ìtumọ̀ ibi tí àwọn ènìyàn náà wà mọ́ ní tààràtà.
- source_word: ἀκούοντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Ọ̀rọ̀ participle yìí ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú fífún wọn ní ìbínú; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Èyí tọ́ka padà sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, láì fi “ọ̀rọ̀” kún un níbi tí Gíríìkì kò ti ṣe pàtó bẹ́ẹ̀.
