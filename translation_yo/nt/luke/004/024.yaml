id: LUK.4.24
reference: Luke 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: yo
  text: Ó sì wí pé, “Lóòótọ́ ni mo wí fún yín pé, kò sí wòlíì kan tí a tẹ́wọ́ gbà ní ìlú ìbílẹ̀ rẹ̀.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní agbègbè ìbílẹ̀ rẹ̀” tàbí “ní ilẹ̀ ìbílẹ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì πατρίς lè tọ́ka sí ìlú, agbègbè, tàbí ilẹ̀ ìbílẹ̀ ẹni; níbí, “ìlú ìbílẹ̀” bá ìṣẹ̀lẹ̀ tó wáyé ní Násárétì mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ó sì wí pé
  rationale: Ọ̀rọ̀ náà ń bá ìtàn lọ pẹ̀lú àsopọ̀ onírẹ̀lẹ̀; ‘sì’ kò fi ìtakora tó lágbára kún un, ‘wí’ sì bá ìforúkọsílẹ̀ Bíbélì tó ní iyì mu.
- source_word: Ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ní ẹnu Jésù, ọ̀rọ̀ yìí jẹ́ ìfìdí ọ̀rọ̀ múlẹ̀ lọ́nà ọ̀wọ̀; ‘Lóòótọ́ ni’ sọ agbára rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín
  rationale: Ó pa ìtọ́ka sí ẹni tó ń sọ̀rọ̀ àti àwọn tí ó ń bá sọ̀rọ̀ mọ́, ó sì ní ìforúkọsílẹ̀ tó yẹ fún ọ̀rọ̀ mímọ́.
- source_word: οὐδεὶς προφήτης
  choice: kò sí wòlíì kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìkọ̀sílẹ̀ pátápátá náà, láìfi ohunkóhun kún ọ̀rọ̀ Gíríìkì.
- source_word: δεκτός
  choice: tí a tẹ́wọ́ gbà
  rationale: Gbólóhùn yìí mú ìtumọ̀ jíjẹ́ ẹni tí àwọn ènìyàn gbà tàbí tí wọ́n fi ojú rere rí jáde; ó ju ìkíni àlejò lasán lọ.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: ní ìlú ìbílẹ̀ rẹ̀
  rationale: πατρίς lè túmọ̀ sí ìlú, agbègbè, tàbí ilẹ̀ ìbílẹ̀ ẹni. Nítorí pé Násárétì ni ibi ìṣẹ̀lẹ̀ náà, ‘ìlú ìbílẹ̀’ bá àyíká ìtàn mu jù lọ, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ tó gbòòrò mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó sì ní iyì. A yan ‘wí’ àti ‘Lóòótọ́ ni’ láti pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Bíbélì mọ́, nígbà tí ‘tẹ́wọ́ gbà’ jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn.
