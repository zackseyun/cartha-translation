  to: Wọ́n sì dìde, wọ́n lé e jáde kúrò ní ìlú náà, wọ́n sì mú un lọ sí etí òkè tí a ti kọ ìlú wọn sí lórí rẹ̀, kí wọ́n lè ju ú lulẹ̀.
  rationale: Àtúnṣe náà mú ìtumọ̀ ìṣe jíju lulẹ̀ tí κατακρημνίσαι ń sọ wá sí kedere, ó sì tún gbólóhùn tó ń ṣàlàyé òkè tí ìlú wọn ti wà ṣe kí ó bá passive pluperfect Gíríìkì mu. Kò ṣàfikún “àpáta gíga,” ìpànìyàn, tàbí ìtúmọ̀ ẹ̀kọ́ ìsìn kankan.
