id: LUK.4.29
reference: Luke 4:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: yo
  text: Wọ́n sì dìde, wọ́n lé e jáde kúrò ní ìlú náà, wọ́n sì mú un lọ sí etí òkè tí a ti kọ ìlú wọn sí lórí rẹ̀, kí wọ́n lè ju ú lulẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: wọ́n dìde
  rationale: Ó pa ìṣe àìròtẹ́lẹ̀ tí participle aorist náà fi hàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐξέβαλον
  choice: wọ́n lé e jáde
  rationale: ‘Lé … jáde’ fi ìfipá àti ìkọ̀sílẹ̀ hàn láì fi ìtumọ̀ ẹ̀sìn kan tí kò yẹ kún un.
- source_word: πόλεως
  choice: ìlú
  rationale: ‘Ìlú’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún πόλις, yálà ibi náà tóbi tàbí ó kéré.
- source_word: ἤγαγον
  choice: wọ́n mú un lọ
  rationale: Ó túmọ̀ ìtumọ̀ gbòòrò ἄγω ní Yorùbá àdánidá; ‘wọ́n wọ́ ọ lọ’ yóò fi ìfipá tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ní kedere kún un.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: sí etí òkè
  rationale: ὀφρύς ń tọ́ka sí etí tàbí bèbè ibi gíga; ‘etí òkè’ ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: tí wọ́n tẹ ìlú wọn dó lé
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìlú wọn wà lórí òkè náà; ‘tẹ … dó lé’ sọ èyí ní Yorùbá tó rọ̀ láì pàdánù αὐτῶν, ‘wọn.’
- source_word: ὥστε
  choice: kí wọ́n lè
  rationale: Pẹ̀lú infinitive, ó ń fi ète tàbí àbájáde tí a pinnu hàn; nínú àyíká yìí, ète àwọn ènìyàn náà ló ṣe pàtàkì.
- source_word: κατακρημνίσαι
  choice: sọ ọ́ kalẹ̀ láti ibẹ̀
  rationale: Ó fi ète láti ju ẹni náà lulẹ̀ láti ibi gíga hàn, ṣùgbọ́n kò fi ‘àpáta gíga’ kún ohun tí Gíríìkì sọ ní tààrà.
theological_decisions:
- issue: Bí ìwà ipá àwọn ènìyàn náà ṣe lágbára tó
  choice: Fi ìfipá àti ète láti sọ Jésù kalẹ̀ hàn nípasẹ̀ ìtẹ̀lé àwọn ìṣe náà, láì pe e ní ‘ìgbìyànjú láti pa á.’
  alternative: Láti lo ọ̀rọ̀ tó le sí i bí ‘wọ́n wọ́ ọ’ tàbí láti sọ ní tààrà pé wọ́n fẹ́ pa á.
  rationale: Ẹsẹ̀ náà fi ète ikú hàn gbangba, ṣùgbọ́n ìtumọ̀ yẹ kí ó jẹ́ kí èyí jáde láti inú ọ̀rọ̀ orísun fúnra rẹ̀ dípò fífi àlàyé kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé lasan. A kò lo àlàyé ẹ̀kọ́ ìsìn ẹgbẹ́ kankan.
