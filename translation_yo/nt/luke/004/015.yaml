id: LUK.4.15
reference: Luke 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: yo
  text: Ó sì ń kọ́ni nínú àwọn sínágọ́gù wọn, gbogbo ènìyàn sì ń fi ògo fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ènìyàn sì ń yìn ín” tàbí “gbogbo ènìyàn sì ń bọ̀wọ̀ fún un.” Ọ̀rọ̀ Gíríìkì náà, δοξαζόμενος, lè túmọ̀ sí ìyìn tàbí ọlá tí a ń fi fún ẹnì kan ní gbangba; “ń fi ògo fún un” pa ìbáṣepọ̀ rẹ̀ mọ́ èdè ògo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tó rọrùn ni καὶ; “sì” so ẹsẹ yìí mọ́ ohun tó ṣáájú láìfi ìtumọ̀ àkókò kún un.
- source_word: αὐτὸς
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Jésù. Yorùbá kò nílò láti fi ìtẹnumọ́ “òun fúnra rẹ̀” kún un níbí, nítorí ìtẹnumọ́ bẹ́ẹ̀ kò lágbára nínú ọ̀rọ̀ Gíríìkì.
- source_word: ἐδίδασκεν
  choice: ń kọ́ni
  rationale: Ìṣe aláìpé náà fi ìṣe tó ń lọ tàbí tó máa ń ṣẹlẹ̀ hàn; “ń kọ́ni” mú apá yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: nínú àwọn sínágọ́gù wọn
  rationale: Èyí pa ibi ìṣe náà àti ọ̀rọ̀ arọ́pò-orúkọ “wọn” mọ́, ó sì lo ọ̀rọ̀ Yorùbá tí a mọ̀ fún ilé ìpàdé àwọn Júù.
- source_word: δοξαζόμενος
  choice: ń fi ògo fún un
  rationale: Gbólóhùn yìí pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú “ògo,” nígbà tó sì tún lè túmọ̀ sí ìyìn tàbí ọlá tí àwọn ènìyàn ń fi fún Jésù ní gbangba.
- source_word: ὑπὸ πάντων
  choice: gbogbo ènìyàn
  rationale: ὑπό pẹ̀lú ọ̀rọ̀ onípò genitive sọ ẹni tó ń ṣe ìṣe passive náà; ìṣètò Yorùbá yìí mú “gbogbo ènìyàn” ṣe olùṣe ní kedere láìsọ pé ó pọn dandan kí ó túmọ̀ sí olúkúlùkù ènìyàn láìsí àfikún.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοξαζόμενος nípa Jésù
  choice: gbogbo ènìyàn sì ń fi ògo fún un
  alternative: gbogbo ènìyàn sì ń yìn ín; gbogbo ènìyàn sì ń bọ̀wọ̀ fún un
  rationale: “Fi ògo fún un” pa agbára àti ìbáṣepọ̀ ọ̀rọ̀ δοξάζω mọ́ pẹ̀lú èdè ògo, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ní àyíká yìí ó tún lè tọ́ka sí ìyìn tàbí ọlá tí gbogbo ènìyàn ń fi fún un. Èyí kò fi ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní àmì ohùn níbi tí ó ti jẹ́ àdánidá. Ìtumọ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a sì pa ìṣe tó ń lọ nínú ἐδίδασκεν àti δοξαζόμενος mọ́.
