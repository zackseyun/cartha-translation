  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: yo
  text: fún ogójì ọjọ́, tí Èṣù ń dán an wò.[a] Kò sì jẹ ohunkóhun ní àwọn ọjọ́ wọ̀nyẹn; nígbà tí wọ́n sì parí, ebi pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “tí Èṣù ń dẹ̀ ẹ́ wò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “dán wò” tàbí “dẹ̀ wò”; nítorí pé Èṣù ni olùṣe níhìn-ín, ìtumọ̀ ìdẹwò sí ibi bá àyíká ọ̀rọ̀ mu dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: fún ogójì ọjọ́
  rationale: Ọ̀rọ̀ yìí tọ́ka sí bí àkókò náà ṣe gùn; “fún ogójì ọjọ́” jẹ́ ọ̀nà àdánidá láti sọ iye àkókò ní Yorùbá.
- source_word: πειραζόμενος
  choice: tí Èṣù ń dán an wò
  rationale: “Dán … wò” lè gbé ìtumọ̀ ìdánwò tàbí ìdẹwò, ó sì pa ìwọ̀n àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́. Nítorí pé Èṣù ni olùṣe, àyíká ọ̀rọ̀ náà tẹ̀ sí ìdẹwò sí ibi.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: tí Èṣù ń …
  rationale: “Èṣù” ni orúkọ àdánidá tí àwọn olùkà Yorùbá mọ̀ fún ẹni pàtó tí διάβολος ń tọ́ka sí níhìn-ín; ìṣètò gbólóhùn aṣiṣe-ṣe yìí sì dára ju ìtumọ̀ àkànṣe aláìṣe lọ ní Yorùbá.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Kò sì jẹ ohunkóhun
  rationale: Èyí sọ ìkọ̀ pátápátá náà ní kedere àti ní Yorùbá òde òní.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Gbólóhùn yìí tọ́ka sí gbogbo àkókò ogójì ọjọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: nígbà tí wọ́n sì pé
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò Yorùbá. “Tí wọ́n pé” túmọ̀ sí pé àwọn ọjọ́ náà dé òpin wọn, láìdi ọ̀rọ̀ náà mú.
- source_word: ἐπείνασεν
  choice: ebi pa á
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ó wà ní ipò ebi lẹ́yìn àkókò náà.
theological_decisions:
- issue: Ìtumọ̀ πειραζόμενος nípa ohun tí Jésù ní ìrírí rẹ̀ ní aginjù
  choice: tí Èṣù ń dán an wò
  alternative: tí Èṣù ń dẹ̀ ẹ́ wò
  rationale: “Dán an wò” jẹ́ kí ìtumọ̀ ìdánwò àti ìdẹwò tí ọ̀rọ̀ Gíríìkì lè ní dúró, nígbà tí dídárúkọ Èṣù gẹ́gẹ́ bí olùṣe fi hàn pé ìdẹwò sí ibi ni ó bá àyíká ọ̀rọ̀ mu jù. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún àwọn olùkà òde òní. A lo “Èṣù” gẹ́gẹ́ bí orúkọ tí a mọ̀ fún διάβολος, a sì lo àmì ẹsẹ̀ [a] láti pa ìtumọ̀ mìíràn ti πειραζόμενος mọ́.
