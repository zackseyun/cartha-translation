revisions:
- from: Ẹnu ya gbogbo wọn, wọ́n sì ń bá ara wọn sọ̀rọ̀ pé, “Ọ̀rọ̀ wo ni èyí, tí ó fi àṣẹ àti agbára pàṣẹ fún àwọn ẹ̀mí àìmọ́, tí wọ́n sì ń jáde?”[a]
  to: Gbogbo wọn sì yà á lẹ́nu, wọ́n sì ń bá ara wọn sọ̀rọ̀ pé, “Ọ̀rọ̀[a] wo ni èyí? Ó fi àṣẹ àti agbára pàṣẹ fún àwọn ẹ̀mí àìmọ́, wọ́n sì ń jáde.”
  rationale: A tún gbolóhùn náà kọ́ láti mú ìbáṣepọ̀ ὅτι àti àwọn iṣẹ́-ọrọ̀ méjèèjì kedere ní Yorùbá, láì ṣàfikún tàbí yí ìtumọ̀ ọrọ̀ náà padà. “Gbogbo wọn sì yà á lẹ́nu” jẹ́ ìtumọ̀ àdánidá fún ìyàlẹ́nu tí ó dé bá gbogbo wọn. A pa ìgbà ìṣe tí ń lọ nínú συνελάλουν àti ἐξέρχονται mọ́ pẹ̀lú “ń bá ara wọn sọ̀rọ̀” àti “ń jáde.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn eroja pàtàkì Gíríìkì mọ́: ìyàlẹ́nu gbogbo ènìyàn, ìjíròrò tí ń lọ, àṣẹ àti agbára, àwọn ẹ̀mí àìmọ́, àti ìjáde wọn. Síbẹ̀, ìṣọ̀kan gbolóhùn tí ó tẹ̀lé ìbéèrè náà kò ṣe kedere ní Yorùbá: àwọn ìbáṣepọ̀ "tí ó fi" àti "tí wọ́n sì ń" lè dà bí ẹni pé wọ́n ń ṣàlàyé "ọ̀rọ̀" tàbí "àwọn ẹ̀mí" ní ọ̀nà tí kò bójú mu. Àtúnṣe náà mú ὅτι hàn gẹ́gẹ́ bí àlàyé ohun tí ìyàlẹ́nu náà jẹ́, ó sì jẹ́ kí ẹni tí ń pàṣẹ hàn gẹ́gẹ́ bí ẹni tí a ti mọ̀ nínú àyíká ọ̀rọ̀.'
  naturalness: '"Ẹnu ya gbogbo wọn" jẹ́ èdè tí a lè lóye, ṣùgbọ́n "Gbogbo wọn sì yà á lẹ́nu" jẹ́ ìsọ̀rọ̀ Yorùbá boṣewa tí ó rọrùn, ó sì bá ìtumọ̀ θάμβος mu dáadáa. Ìtòlẹ́sẹẹsẹ gbolóhùn tí a tún ṣe jẹ́ ti òde òní, ó ní ìfẹ̀sẹ̀mulẹ̀, ó sì yọ ìdààmú ìtọ́kasí kúrò.'
  terminology: '"àṣẹ àti agbára" jẹ́ ìpèníjà tó péye fún ἐξουσία καὶ δύναμις. "Àwọn ẹ̀mí àìmọ́" jẹ́ ìtumọ̀ tààrà, tó ti fìdí múlẹ̀, fún τοῖς ἀκαθάρτοις πνεύμασιν; kò yẹ kí a rọ́pò rẹ̀ pẹ̀lú "ẹ̀mí búburú," nítorí èyí yóò jẹ́ àfikún ìtumọ̀. Àkọsílẹ̀ ìsàlẹ̀ nípa λόγος wúlò, ṣùgbọ́n a gbé àmì rẹ̀ sún mọ́ "Ọ̀rọ̀" tí ó ń ṣàlàyé.'
  issues:
