id: LUK.4.36
reference: Luke 4:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: yo
  text: Gbogbo wọn sì yà á lẹ́nu, wọ́n sì ń bá ara wọn sọ̀rọ̀ pé, “Ọ̀rọ̀[a] wo ni èyí? Ó fi àṣẹ àti agbára pàṣẹ fún àwọn ẹ̀mí àìmọ́, wọ́n sì ń jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìhìn wo ni èyí?” Ọ̀rọ̀ Gíríìkì náà, logos, lè túmọ̀ sí “ọ̀rọ̀,” “ìhìn,” tàbí “ọ̀ràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: Ẹnu ya
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìyàlẹ́nu ńlá tàbí ìtalẹ́nu; ‘ẹnu ya’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó fi agbára ìtumọ̀ náà hàn.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: Ẹnu ya gbogbo wọn
  rationale: Dípò lílo àkójọpọ̀ ọ̀rọ̀ tí kò wọ́pọ̀ ní Yorùbá fún ohun tí ó ‘dé bá’ wọn, gbólóhùn yìí sọ ipa ìyàlẹ́nu náà lọ́nà àdánidá, ó sì pa πάντας mọ́ gẹ́gẹ́ bí ‘gbogbo wọn.’
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: wọ́n sì ń bá ara wọn sọ̀rọ̀
  rationale: Àmì àkókò aláìparí nínú Gíríìkì fi ìbánisọ̀rọ̀ tí ń lọ lọ́wọ́ hàn; ‘ń bá ara wọn sọ̀rọ̀’ mú ìtumọ̀ ìfèsì méjì-ẹni-tàbí-jù-bẹ́ẹ̀-lọ náà jáde.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Ọ̀rọ̀ wo ni èyí
  rationale: ‘Ọ̀rọ̀’ lè gba ìtumọ̀ ohun tí a sọ, àṣẹ, tàbí iṣẹ́lẹ̀/ọ̀ràn, bí λόγος ṣe ní àyè ìtumọ̀ gbígbòòrò níhìn-ín.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: ó fi àṣẹ àti agbára
  rationale: ‘Fi’ sọ ipa irinṣẹ́ tàbí ọ̀nà tí ἐν ní nínú gbólóhùn náà; ‘àṣẹ’ àti ‘agbára’ sì pa ìyàtọ̀ ἐξουσία àti δύναμις mọ́.
- source_word: ἐπιτάσσει
  choice: pàṣẹ fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún fífi àṣẹ tàbí òfin fún ẹnì kan, ó sì pa ìgbà ìsinsìnyí aláwòrán nínú Gíríìkì mọ́.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: àwọn ẹ̀mí àìmọ́
  rationale: Ó túmọ̀ ἀκάθαρτος ní tààrà gẹ́gẹ́ bí ‘àìmọ́,’ ó sì pa èdè ìtàn ìlépa ẹ̀mí búburú àti àgbékalẹ̀ ìwà mímọ́ mọ́.
- source_word: ἐξέρχονται
  choice: wọ́n sì ń jáde
  rationale: ‘Jáde’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún àwọn ẹ̀mí tí ń fi ẹni tí wọ́n wà nínú rẹ̀ sílẹ̀; ‘ń’ tún pa ìgbà ìsinsìnyí aláwòrán mọ́.
theological_decisions:
- issue: Bí a ṣe pe àwọn ẹ̀dá ẹ̀mí nínú ìtàn ìlépa ẹ̀mí búburú
  choice: àwọn ẹ̀mí àìmọ́
  alternative: àwọn ẹ̀mí aláìmọ́ / àwọn ẹ̀mí búburú
  rationale: ‘Àwọn ẹ̀mí àìmọ́’ tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó pa àgbékalẹ̀ ẹ̀mí gidi nínú ìtàn náà mọ́, kò sì ṣe àfikún ìtumọ̀ ‘búburú’ tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. A lo ‘ẹnu ya’ fún ìyàlẹ́nu ńlá, àti ‘ń bá ara wọn sọ̀rọ̀’ láti fi ìṣe tí ń lọ lọ́wọ́ hàn.
