    issue: Ìbáṣepọ̀ àwọn gbolóhùn "tí ó fi ..." àti "tí wọ́n sì ń jáde" kò ṣe kedere.
    rationale: Nínú ọ̀rọ̀ àkọ́kọ́, àwọn gbolóhùn wọ̀nyí lè dà bí ìsọ̀rí tí ń ṣàlàyé "Ọ̀rọ̀ wo ni èyí" tàbí "àwọn ẹ̀mí àìmọ́," dípò kí wọ́n sọ pé ẹni tí a mọ̀ nínú àyíká ni ó ń pàṣẹ, àti pé àwọn ẹ̀mí náà ń jáde. Gíríìkì ní ὅτι, gbolóhùn àlàyé pẹ̀lú kókó-ọrọ tí a fi pamọ́ (ó), lẹ́yìn ìbéèrè náà.
