source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: yo
  text: Ó sì mú un gòkè lọ, ó sì fi gbogbo àwọn ìjọba ayé tí ènìyàn ń gbé hàn án ní ìṣẹ́jú àáyá kan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn ìjọba ayé.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “ayé tí ènìyàn ń gbé”; nígbà mìíràn, ó lè tọ́ka pàtó sí ayé ọ̀làjú tàbí ilẹ̀ ìjọba ńlá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àkókò kúkúrú gan-an.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: mú un gòkè lọ
  rationale: Ó pa ìtumọ̀ gbígbé tàbí mímú ẹni gòkè mọ́, láìfi ‘òrí òkè’ kún un láti inú ẹsẹ tó bá a mu ní Mátíù.
- source_word: ἔδειξεν
  choice: fi ... hàn án
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ‘ó fi hàn án,’ ó sì bá ètò ọ̀rọ̀ Gíríìkì mu.
- source_word: πάσας τὰς βασιλείας
  choice: gbogbo ìjọba
  rationale: Nínú àyíká yìí, βασιλεία túmọ̀ sí àwọn ìjọba tàbí ilẹ̀ ìṣàkóso, kì í ṣe ìṣàkóso gẹ́gẹ́ bí èrò àfojúrí.
- source_word: τῆς οἰκουμένης
  choice: inú ayé tí ènìyàn ń gbé
  rationale: Ó mú ìtumọ̀ pàtó οἰκουμένη, ‘ayé tí a ń gbé,’ jáde, láìdín in kù sí Ilẹ̀ Ọba Róòmù.
- source_word: ἐν στιγμῇ χρόνου
  choice: ní ìṣẹ́jú kan
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àkókò kúkúrú gidigidi; ‘ní ìṣẹ́jú kan’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, pẹ̀lú àlàyé pé ó tún lè túmọ̀ sí ‘ní ìṣẹ́jú àáyá kan.’
theological_decisions:
- issue: Irú ọ̀nà tí Èṣù gbà fi àwọn ìjọba náà hàn
  choice: Ṣàpèjúwe ìṣẹ̀lẹ̀ náà nìkan, láìsọ bóyá ó jẹ́ ìran, iṣẹ́ agbára àrà, tàbí ohun tí a rí láti ibi gíga kan.
  alternative: Kí a pè é ní ìran tàbí kí a sọ pé láti orí òkè gíga ni wọ́n ti rí i.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ó fi àwọn ìjọba hàn án nìkan; kò ṣàlàyé ọ̀nà tí èyí gbà ṣẹlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún òǹkàwé òde òní. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n jọ ń ṣàlàyé.
