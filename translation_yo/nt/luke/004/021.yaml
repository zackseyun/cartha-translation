source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: yo
  text: Ó sì bẹ̀rẹ̀ sí í sọ fún wọn pé, “Lónìí ni ọ̀rọ̀ Ìwé Mímọ́ yìí ti ṣẹ ní etí yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ní etí yín”; ìyẹn ni, nígbà tí ẹ̀ ń gbọ́ ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: Ó sì bẹ̀rẹ̀ sí í sọ
  rationale: ‘Bẹ̀rẹ̀ sí í sọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbẹ̀rẹ̀ ọ̀rọ̀ Jesu hàn; ‘sì’ ń tẹ ìtàn náà síwájú láìsọ δέ di àtakò líle.
- source_word: πρὸς αὐτοὺς
  choice: fún wọn
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe ‘sọ,’ ‘sọ fún wọn’ ni ìtumọ̀ Yorùbá àdánidá fún ẹni tí a ń bá sọ̀rọ̀.
- source_word: Σήμερον
  choice: Lónìí
  rationale: Ó pa ìtumọ̀ àkókò àti ìtẹnumọ́ ọ̀rọ̀ tí ó wà ní ìbẹ̀rẹ̀ gbólóhùn náà mọ́.
- source_word: πεπλήρωται
  choice: ti ṣẹ
  rationale: ‘Ti ṣẹ’ fi hàn pé ìmúṣẹ náà ti dé, abájáde rẹ̀ sì dúró nísinsìnyí, bí perfect passive Gíríìkì ṣe ń tọ́ka sí.
- source_word: ἡ γραφὴ αὕτη
  choice: ọ̀rọ̀ Ìwé Mímọ́ yìí
  rationale: Ní àyíká yìí, γραφή ń tọ́ka sí ọ̀rọ̀ Ìwé Mímọ́ tí Jesu ṣẹ̀ṣẹ̀ kà; yíyàn yìí yà á sọ́tọ̀ kúrò nínú ìtumọ̀ pé gbogbo ìwé kan ni ó ṣẹ.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: bí ẹ ti ń gbọ́ ọ̀
  rationale: Èyí jẹ́ Yorùbá àdánidá fún àpólà Gíríìkì náà, ó sì pa èrò pé ìmúṣẹ náà ń ṣẹlẹ̀ ní gbígbọ́ àwọn olùgbọ́ mọ́.
theological_decisions:
- issue: Irú ìmúṣẹ tí Jesu ń kéde
  choice: A sọ pé ọ̀rọ̀ Ìwé Mímọ́ náà ti ṣẹ, láìfi ‘nípasẹ̀ mi’ tàbí àlàyé míì kún un.
  alternative: “Lónìí ni àsọtẹ́lẹ̀ yìí ti ṣẹ nípasẹ̀ mi bí ẹ ti ń gbọ́ ọ̀.”
  rationale: Àyíká náà ń tọ́ka sí ipa Jesu, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ‘nípasẹ̀ mi,’ bẹ́ẹ̀ ni kò lo ọ̀rọ̀ pàtó fún ‘àsọtẹ́lẹ̀.’ Ìtumọ̀ náà pa agbára àti àìṣàlàyé gbólóhùn Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. ‘Ẹ’ jẹ́ ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῶν.
