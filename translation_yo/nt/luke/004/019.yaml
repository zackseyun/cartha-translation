id: LUK.4.19
reference: Luke 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: yo
  text: láti kéde ọdún ojú rere Olúwa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti kéde ọdún ìtẹ́wọ́gbà Olúwa.”
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ ìbílẹ̀ ni, “ọdún ìtẹ́wọ́gbà Olúwa.” Gbólóhùn náà ń tọ́ka sí Aísáyà 61:2, ó sì lè mú èrò ọdún Jùbílì wá sí ọkàn.
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: láti kéde
  rationale: Ọ̀rọ̀ yìí ń tẹ̀ síwájú nínú ète tí a bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú; “kéde” sì pa ìtumọ̀ ìpolongo ní gbangba mọ́ láì dín un kù sí ìwàásù nìkan.
- source_word: ἐνιαυτὸν
  choice: ọdún
  rationale: Ìtumọ̀ rẹ̀ ní pàtàkì ni ọdún; a pa á mọ́ nítorí ìtọ́kasí sí Aísáyà 61:2, dípò fífi ọ̀rọ̀ gbòòrò bí “àkókò” rọ́pò rẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níbí, ó sì bá ọ̀rọ̀ tí a fa láti inú Aísáyà mu láì fi ìtumọ̀ míì tí Gíríìkì kò sọ kún un.
- source_word: δεκτόν
  choice: ojú rere
  rationale: Nínú gbólóhùn yìí, “ojú rere” sọ ìtẹ́wọ́gbà tàbí oore Olúwa ní èdè Yorùbá òde òní tó ṣe kedere, dípò gbólóhùn tí ó lè dà bí pé ènìyàn nìkan ló ‘gba’ ọdún náà.
theological_decisions:
- issue: Ìtọ́kasí sí Aísáyà 61:2 àti ohun tó lè mú ọdún Jùbílì wá sí ọkàn
  choice: A pa “ọdún” àti ìtumọ̀ ojú rere Olúwa mọ́, ṣùgbọ́n a kò fi “Jùbílì” sínú ọ̀rọ̀ pàtàkì.
  alternative: láti kéde Jùbílì Olúwa
  rationale: Gbólóhùn Gíríìkì ń dún bí Aísáyà 61:2, ó sì lè mú Jùbílì wá sí ọkàn, ṣùgbọ́n kò lo ọ̀rọ̀ “Jùbílì” ní tààrà.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: OLÚWA
  rationale: “Olúwa” pa orúkọ oyè Gíríìkì mọ́, ó sì yẹra fún ṣíṣe ìpinnu nínú ọ̀rọ̀ pàtàkì pé a gbọ́dọ̀ fi àṣà ìtumọ̀ orúkọ Ọlọ́run hàn ní gbogbo lẹ́tà ńlá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojú, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. “Kéde” ní agbára ìpolongo ní gbangba; “ojú rere Olúwa” jẹ́ gbólóhùn àdánidá tó pa ìtumọ̀ oore tàbí ìtẹ́wọ́gbà mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
