  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣísẹ̀ ìtàn Gíríìkì dáadáa: ó mú Jesu lọ sí Jerusalẹmu, ó fi í sí ibi kan lórí tẹ́ńpìlì, ó sì paṣẹ fún un láti ju ara rẹ̀ sọ̀kalẹ̀. Síbẹ̀, “ṣóńṣó” lè mú kí πτερύγιον dà bí ipò kan pàtó ju bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ lọ; ìtumọ̀ kan tó fi “etí” àti ìtumọ̀ ibi gíga hàn dáàbò bo àìnídìí ìtumọ̀ ayaworan náà dáadáa.'
  naturalness: “Ó mú un lọ ... ó sì gbé e dúró” àti “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run” jẹ́ Yorùbá ìgbàlódé tó ye ẹni tí ń ka. “Aṣọdẹ” nínú àwọn àlàyé sílẹ̀ kò yẹ níhìn-ín, nítorí ó túmọ̀ sí ọdẹ/hunter, kì í ṣe ẹni tí ń dan wò tàbí aṣòdẹ nínú ìtàn náà.
  terminology: “Tẹ́ńpìlì,” “Ọmọ Ọlọ́run,” àti “ju ara rẹ sílẹ̀” yẹ. A tún ìtumọ̀ πτερύγιον ṣe sí “etí òkè tẹ́ńpìlì” láti má ṣe pinnu irú apá ilé náà ní pàtó, a sì ṣàtúnṣe àwọn àlàyé tó pe ẹni tó ń sọ̀rọ̀ ní “aṣọdẹ.”
