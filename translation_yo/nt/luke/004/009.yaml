  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: yo
  text: Lẹ́yìn náà, ó mú un lọ sí Jerusalẹmu, ó sì gbé e dúró lórí etí òkè tẹ́ńpìlì[a][b]. Ó wí fún un pé, “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run[c], ju ara rẹ sílẹ̀ láti ibí yìí;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí ìyẹ́ tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí etí ilé tó yọ síta tàbí ibi gíga kan nínú àgbègbè tẹ́ńpìlì.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe yàrá mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
  - marker: c
    text: Ó tún ṣeé túmọ̀ sí, “Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run.” Gbólóhùn ìṣèjọba náà nínú Gíríìkì lè ní ìtumọ̀ bẹ́ẹ̀, ṣùgbọ́n a lo “Bí” níhìn-ín láti pa agbára ìpèníjà náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν
  choice: ó mú un lọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú tàbí ṣíṣamọ̀nà ẹnì kan lọ sí ibòmíràn. ‘Ó mú un lọ’ jẹ́ èdè Yorùbá àdánidá, kò sì sọ ọ̀nà ìrìn náà ní pàtó ju Gíríìkì lọ.
- source_word: δὲ
  choice: Lẹ́yìn náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú. ‘Lẹ́yìn náà’ fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn lọ́nà tó ṣe kedere.
- source_word: Ἰερουσαλήμ
  choice: Jerusalẹmu
  rationale: Èyí ni ọ̀nà tí orúkọ ìlú náà gbà wọ́pọ̀ nínú Yorùbá.
- source_word: ἔστησεν
  choice: ó gbé e dúró
  rationale: Ìṣe náà jẹ́ ti mímú kí ẹnì kan dúró ní ibi kan. Ìtumọ̀ yìí pa ìtumọ̀ causative Gíríìkì mọ́.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: lórí ṣóńṣó
  rationale: πτερύγιον lè tọ́ka sí etí ilé tó yọ síta tàbí ibi gíga kan. ‘Ṣóńṣó’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe àfihàn ibi gíga tó léwu, nígbà tí àlàyé ìsàlẹ̀ fi àwòrán ‘ìyẹ́’ inú ọ̀rọ̀ Gíríìkì pamọ́.
- source_word: τοῦ ἱεροῦ
  choice: tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe yàrá mímọ́ inú rẹ̀ nìkan. ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, a sì ṣàlàyé ìwọ̀n ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run
  rationale: ‘Bí ... bá’ pa ìpèníjà inú gbólóhùn conditional Gíríìkì mọ́, láì sọ pé aṣọdẹ náà kò mọ ẹni tí Jesu jẹ́. Fífi ‘ìwọ’ hàn fún un ní agbára ìpèníjà.
- source_word: βάλε σεαυτὸν
  choice: ju ara rẹ sílẹ̀
  rationale: Imperative βάλε níhìn-ín ń pàṣẹ kí ó fi agbára ju ara rẹ̀. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá ìṣísẹ̀ sọ̀kalẹ̀ mu.
- source_word: ἐντεῦθεν κάτω
  choice: láti ibí yìí
  rationale: ‘Láti ibí yìí’ sọ ibi tí ìṣísẹ̀ náà ti bẹ̀rẹ̀; ‘sílẹ̀’ tó wà pẹ̀lú ọ̀rọ̀-ìṣe ti fi ìtọ́sọ́nà sí ìsàlẹ̀ hàn.
theological_decisions:
- issue: Ìpèníjà aṣọdẹ náà nípa ẹni tí Jesu jẹ́
  choice: Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run
  alternative: Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run
  rationale: εἰ pẹ̀lú indicative lè ní agbára tó sún mọ́ ‘níwọ̀n bí’ nínú àwọn àyíká kan. Síbẹ̀, ‘Bí ... bá’ dáàbò bo ìpèníjà àti ìdánwò inú ìtàn yìí, láì pinnu pé akọ̀ròyìn ń ṣiyèméjì nípa ìdánimọ̀ Jesu.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. ‘Tẹ́ńpìlì’ àti ‘ṣóńṣó’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye; àwọn àlàyé ìsàlẹ̀ sì pa ìyàtọ̀ lexical àti ìtumọ̀ àṣà inú Gíríìkì mọ́.
