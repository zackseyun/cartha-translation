id: LUK.4.3
reference: Luke 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: yo
  text: Nígbà náà ni Èṣù sọ fún un pé[a], “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run, sọ fún òkúta yìí pé kí ó di búrẹ́dì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run.” Ìkọ̀lé àídájú náà nínú èdè Gíríìkì lè túmọ̀ sí pé Èṣù gba ọ̀rọ̀ náà gẹ́gẹ́ bí ohun tí ó jẹ́ òtítọ́ fún ìpèníjà rẹ̀; ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ náà pa ìrísí àídájú náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ nínú ìtàn yìí; “Nígbà náà ni” fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: διάβολος
  choice: Èṣù
  rationale: Nínú àyíká yìí, διάβολος jẹ́ orúkọ ẹni tí a mọ̀ sí Satani; “Èṣù” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere.
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Ìlànà “Bí ... bá” pa ìrísí gbólóhùn oníṣ条件 mọ́, láì pinnu bóyá olùdánwò ń ṣiyèméjì tàbí ó gba ohun tí ó sọ gẹ́gẹ́ bí òtítọ́ fún ìpèníjà náà.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Nínú àyíká Kristi yìí, ọ̀rọ̀ náà jẹ́ oyè pàtó, kì í ṣe ‘ọ̀kan lára àwọn ọmọ Ọlọ́run.’
- source_word: εἰπὲ
  choice: sọ fún
  rationale: “Sọ fún” jẹ́ Yorùbá àdánidá fún àsọyé àṣẹ sí òkúta; kò fi agbára tó ju λέγω lọ kún un bí “pa á láṣẹ” ṣe lè ṣe.
- source_word: τῷ λίθῳ τούτῳ
  choice: òkúta yìí
  rationale: “Òkúta” bá λίθος mu ju “àpáta” lọ, a sì pa atọ́ka “yìí” mọ́.
- source_word: ἵνα γένηται
  choice: pé kí ó di
  rationale: Ìkọ̀lé “sọ fún ... pé kí ó di” jẹ́ Yorùbá tó dùn, ó sì fi àkóónú/àbájáde ọ̀rọ̀ àṣẹ náà hàn.
- source_word: ἄρτος
  choice: búrẹ́dì
  rationale: “Búrẹ́dì” túmọ̀ ἄρτος ní tààrà; kò fi ìtumọ̀ ‘oúnjẹ’ tó gbòòrò tàbí ‘ìṣù búrẹ́dì’ tó ṣe pàtó ju orísun lọ kún un.
theological_decisions:
- issue: Agbára gbólóhùn εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run
  alternative: Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run
  rationale: A pa ìrísí gbólóhùn oníṣ条件 Gíríìkì mọ́, kí a má bàa tú ìfọ̀rọ̀wérọ̀ ìdánwò náà sí ìtumọ̀ kan ṣoṣo tàbí sẹ́ jíjẹ́ Ọmọ Ọlọ́run ti Jesu.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán láti lóye.
