id: LUK.4.37
reference: Luke 4:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο ἦχος περὶ αὐτοῦ εἰς πάντα τόπον τῆς περιχώρου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: yo
  text: Ìròyìn nípa rẹ̀ sì ń tàn dé gbogbo ibi ní agbègbè àyíká náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun tí wọ́n ń sọ nípa rẹ̀ sì ń jáde lọ sí gbogbo ibi ní agbègbè àyíká náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ yìí mọ́ ìṣẹ̀lẹ̀ tó ṣáájú lọ́nà àdánidá nínú èdè Yorùbá, láìfi ìtumọ̀ míì kún un.
- source_word: ἐξεπορεύετο
  choice: ń tàn dé
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń tọ́ka sí ohun tó ń bá a lọ ní àkókò àtijọ́; “ń tàn dé” jẹ́ ọ̀nà àdánidá láti sọ bí ìròyìn ṣe ń jáde, tó sì ń dé ibòmíràn.
- source_word: ἦχος
  choice: Ìròyìn
  rationale: Bó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ìró, nínú àyíká ọ̀rọ̀ yìí ó ń tọ́ka sí ìròyìn tàbí ohun tí àwọn ènìyàn ń gbọ́ nípa Jésù.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Ó fi ohun tí ìròyìn náà dá lé lórí hàn ní kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: εἰς πάντα τόπον
  choice: dé gbogbo ibi
  rationale: Ó pa èrò ìlọ sí ibi kọ̀ọ̀kan mọ́, dípò gbólóhùn àkótán bí “káàkiri” nìkan.
- source_word: τῆς περιχώρου
  choice: ní agbègbè àyíká náà
  rationale: Ó ṣàfihàn agbègbè tàbí ìlú àwọn ibi tó yí ibi ìṣẹ̀lẹ̀ náà ká, láìsọ ààlà rẹ̀ ju bí Gíríìkì ṣe sọ lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. “Ìròyìn” mú ìtumọ̀ ἦχος nínú àyíká ọ̀rọ̀ yìí jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ tó sún mọ́ “ohun tí wọ́n ń sọ” àti “ń jáde lọ” mọ́.
