source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: yo
  text: Jésù, tí ó kún fún Ẹ̀mí Mímọ́, padà láti odò Jọ́dánì; Ẹ̀mí náà sì ń darí rẹ̀[a] ní aginjù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì ń darí rẹ̀ nínú Ẹ̀mí ní aginjù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní ọ̀nà gangan yìí, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó ṣeé ṣe jù pé Ẹ̀mí ni ó ń darí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: tí ó kún fún Ẹ̀mí Mímọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Ẹ̀mí Mímọ́ kún inú Jésù; ó jẹ́ àpèjúwe ipò rẹ̀, kì í ṣe dandan pé ìkún náà ṣẹlẹ̀ ní àkókò yẹn gan-an.
- source_word: ὑπέστρεψεν
  choice: padà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: láti odò Jọ́dánì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì sọ ‘Jọ́dánì’ nìkan, fífi ‘odò’ kún un jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì ń mú ibi tí a ń tọ́ka sí ṣe kedere láìyí ìtumọ̀ padà.
- source_word: ἤγετο
  choice: ń darí rẹ̀
  rationale: Àkókò ọ̀rọ̀-ìṣe Gíríìkì fi ìṣe tó ń bá a lọ hàn. Yorùbá máa ń sọ gbólóhùn yìí lọ́nà àdánidá pẹ̀lú ẹni tó ń darí gẹ́gẹ́ bí olùṣe.
- source_word: ἐν τῷ πνεύματι
  choice: Ẹ̀mí náà sì ń darí rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà lè fi Ẹ̀mí hàn gẹ́gẹ́ bí ẹni tó ń darí Jésù. ‘Ẹ̀mí náà’ tọ́ka padà sí Ẹ̀mí Mímọ́ tí a ṣẹ̀ṣẹ̀ dárúkọ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ lè túmọ̀ sí ilẹ̀ àdáwà tàbí ilẹ̀ aṣálẹ̀, nítorí náà kò fi dandan mú kí òǹkàwé ronú nípa ilẹ̀ yanrìn nìkan.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ ìtàn Yorùbá tó bá ìyípadà kékeré tí δέ ń fihàn mu.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ nínú ἐν τῷ πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ ni ó ń darí Jésù
  alternative: Ó lè ṣàpèjúwe Jésù bí ẹni tó ń lọ ‘nínú Ẹ̀mí,’ dípò kí ó sọ Ẹ̀mí gẹ́gẹ́ bí olùdarí ní tààràtà.
  rationale: Gbólóhùn tó wà níwájú rẹ̀ sọ pé Ẹ̀mí Mímọ́ kún inú Jésù, ìtẹnumọ́ Lúùkù lórí iṣẹ́ Ẹ̀mí sì mú kí ó ṣeé gbà jù pé Ẹ̀mí kan náà ni ó ń darí rẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà ìtumọ̀ gangan sí i mọ́.
translation_notes:
  register: A lo Yorùbá àjọsọ tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àgbékalẹ̀ ‘Jésù sì, tí ó kún fún…’ pa bí àwọn gbólóhùn Gíríìkì ṣe tẹ̀ lé ara wọn mọ́, nígbà tí ‘ń darí rẹ̀’ mú ìṣe tó ń bá a lọ hàn ní Yorùbá àdánidá.
