id: LUK.4.40
reference: Luke 4:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: yo
  text: Bí oòrùn ṣe ń wọ̀[a], gbogbo àwọn tí ó ní àwọn aláìsàn tí onírúurú àrùn ń ṣe mú wọn wá sọ́dọ̀ rẹ̀. Ó sì gbé ọwọ́ rẹ̀ lé olúkúlùkù wọn, ó sì mú wọn láradá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Nígbà tí oòrùn ń wọ̀.” Èdè Gíríìkì fi hàn pé bí oòrùn ṣe ń wọ̀ lọ́wọ́ ni àwọn ìṣẹ̀lẹ̀ wọ̀nyí ń ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Bí oòrùn ti ń wọ̀
  rationale: Gbólóhùn yìí fi ìgbà tí ìṣẹ̀lẹ̀ náà ń ṣẹlẹ̀ hàn, ó sì pa ìṣe tí ó ń lọ lọ́wọ́ inú ọ̀rọ̀ Gíríìkì mọ́. A kò fi ọ̀rọ̀ kan tí yóò túmọ̀ sí ‘nísinsìnyí’ kún un.
- source_word: ἅπαντες ὅσοι
  choice: gbogbo àwọn tí
  rationale: 'Ó pa ìtumọ̀ àkópọ̀ tó lágbára mọ́: kò sí ẹni tí ó wà nínú ẹgbẹ́ yìí tí a yọ sílẹ̀.'
- source_word: εἶχον ἀσθενοῦντας
  choice: tí ó ní àwọn aláìsàn
  rationale: ‘Ní’ níbí ń tọ́ka sí àwọn ènìyàn tí aláìsàn wà ní abẹ́ àbójútó wọn tàbí nínú agbo ilé wọn; a kò fi ìbátan pàtó tí orísun kò sọ kún un.
- source_word: νόσοις ποικίλαις
  choice: tí onírúurú àrùn ń ṣe
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé oríṣiríṣi àrùn ni ó ń ṣe àwọn aláìsàn náà.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: mú wọn wá sọ́dọ̀ rẹ̀
  rationale: ‘Mú … wá sọ́dọ̀’ bá ìṣe mímú àwọn aláìsàn tọ Jesu wá mu ní èdè Yorùbá tó ṣe kedere.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: olúkúlùkù wọn
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé Jesu fọwọ́ kan ẹnì kọ̀ọ̀kan, kì í ṣe ẹgbẹ́ náà lápapọ̀ nìkan.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: gbé ọwọ́ rẹ̀ lé
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún fífi ọwọ́ lé ẹnì kan, ó sì pa ìṣe ara tí orísun sọ mọ́ láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
- source_word: ἐθεράπευεν
  choice: mú wọn lára dá
  rationale: Ọ̀rọ̀ yìí sọ ìwòsàn ní ọ̀nà Yorùbá tó wọ́pọ̀. Àkópọ̀ rẹ̀ pẹ̀lú ‘olúkúlùkù’ ń fi ìṣe tí Jesu ṣe léraléra sí ẹnì kọ̀ọ̀kan hàn.
theological_decisions:
- issue: Fífi ọwọ́ lé àwọn aláìsàn
  choice: gbé ọwọ́ rẹ̀ lé olúkúlùkù wọn
  alternative: ń gbé ọwọ́ rẹ̀ lé ẹnì kọ̀ọ̀kan wọn
  rationale: A pa ìṣe gidi àti àkíyèsí tí Jesu fún ẹnì kọ̀ọ̀kan mọ́, ṣùgbọ́n a kò sọ pé ìṣe náà ní ìtumọ̀ sakramenti tàbí àṣà ìjọ tí orísun kò mẹ́nu kàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘onírúurú àrùn’ àti ‘mú wọn lára dá’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, láìdín ìtẹnumọ́ orísun lórí ẹnì kọ̀ọ̀kan kù.
