id: LUK.4.14
reference: Luke 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: yo
  text: Jésù sì padà sí Galili nínú agbára Ẹ̀mí. Ìròyìn[a] nípa rẹ̀ sì tàn ká gbogbo agbègbè àyíká náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìròyìn tuntun,” “òkìkí,” tàbí “ahesọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìròyìn kan tó tàn káàkiri, láìsọ bóyá ìròyìn náà dára tàbí ó burú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: padà
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù lọ padà sí ibi kan; “padà” jẹ́ ọ̀nà àdánidá tí Yorùbá fi sọ ìpadà nínú ìtàn.
- source_word: ἐν τῇ δυνάμει
  choice: nínú agbára
  rationale: Èyí pa àwòrán gbólóhùn Gíríìkì mọ́, ó sì lè tọ́ka sí ipò tàbí ọ̀nà tí Jésù gbà padà láìfi dandan túmọ̀ rẹ̀ sí ohun èlò tí a fi ṣe iṣẹ́ náà.
- source_word: τοῦ πνεύματος
  choice: Ẹ̀mí
  rationale: Àyíká Lúùkù 4 fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí. Lílo “Ẹ̀mí” nìkan pa ọ̀rọ̀ orísun mọ́, nítorí “Mímọ́” kò sí ní ẹsẹ yìí.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: “Sí Galili” jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ibi tí ẹni ń lọ.
- source_word: φήμη
  choice: ìròyìn
  rationale: “Ìròyìn” lè jẹ́ ohun tí a gbọ́ tí ó tàn ká, láìsọ pé ó dára tàbí pé ó burú. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tó ṣeé ṣe hàn.
- source_word: ἐξῆλθεν
  choice: tàn ká
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní àwòrán ohun tí ó “jáde,” “tàn ká” ni ọ̀nà Yorùbá àdánidá fún bí ìròyìn ṣe dé ibi gbogbo.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: ká gbogbo agbègbè àyíká náà
  rationale: Èyí mú ìtumọ̀ pé ìròyìn náà dé gbogbo àgbègbè tó yí ibi náà ká.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: “Nípa rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédé, tó sì bá ìtumọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ohun tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí, ìyẹn Ẹ̀mí Mímọ́ gẹ́gẹ́ bí àyíká ṣe fi hàn
  alternative: ẹ̀mí kan tí a kò dá mọ̀ pàtó
  rationale: Àwọn ẹsẹ tó ṣáájú nínú Lúùkù 4 ń sọ nípa Ẹ̀mí Mímọ́ nínú ìdánwò Jésù àti ìbẹ̀rẹ̀ iṣẹ́ rẹ̀. Síbẹ̀, a kò fi “Mímọ́” kún àkọsílẹ̀ pàtàkì, nítorí kò sí nínú ọ̀rọ̀ Gíríìkì ẹsẹ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tó yẹ; orúkọ “Jésù” àti “Galili” tẹ̀ lé ìlò Yorùbá tó wọ́pọ̀.
