  to: Ọ̀pọ̀ àwọn adẹ́tẹ̀ sì ni ó wà ní Ísírẹ́lì ní àkókò Èlíṣà wòlíì, kò sì sí ẹni kankan nínú wọn tí a sọ di mímọ́, bí kò ṣe Náámánì ará Síríà.
  rationale: 'Àtúnṣe kékeré ni: a rọ́pò alásopò ìtakò pẹ̀lú ‘sì’ láti bá καὶ mu, a sì ṣàtúnṣe ọ̀nà tí a gbà sọ àkókò Èlíṣà wòlíì. Gbogbo ìtumọ̀ pàtàkì—ìwẹ̀numọ́, iye àwọn adẹ́tẹ̀, àti ìyàsọ́tọ̀ Náámánì ará Síríà—wà ní ìpamọ́.'
