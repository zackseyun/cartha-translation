  revised_text: Ọ̀pọ̀ àwọn adẹ́tẹ̀ sì ni ó wà ní Ísírẹ́lì ní àkókò Èlíṣà wòlíì, kò sì sí ẹni kankan nínú wọn tí a sọ di mímọ́, bí kò ṣe Náámánì ará Síríà.
