id: LUK.4.27
reference: Luke 4:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: yo
  text: Ọ̀pọ̀ àwọn adẹ́tẹ̀ sì ni ó wà ní Ísírẹ́lì ní àkókò Èlíṣà wòlíì, kò sì sí ẹni kankan nínú wọn tí a sọ di mímọ́, bí kò ṣe Náámánì ará Síríà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: àwọn adẹ́tẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kúkúrú, tó sì wọ́pọ̀ fún àwọn tí àrùn ẹ̀tẹ̀ ń ṣe; ó bá lílo ọ̀rọ̀ Gíríìkì gẹ́gẹ́ bí àpèjúwe tí a fi ṣe orúkọ mu.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: ní Ísírẹ́lì
  rationale: Ó fi ibi tàbí àyíká hàn láìfi kún un pé ilẹ̀ náà tàbí àwọn ènìyàn náà nìkan ni a ń tọ́ka sí.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: nígbà wòlíì Èlíṣà
  rationale: Pẹ̀lú ọ̀rọ̀ orúkọ ní ẹ̀yà genitive, ἐπί níhìn-ín ń tọ́ka sí àkókò; ‘nígbà’ jẹ́ Yorùbá àdánidá tó ṣe kedere.
- source_word: ἐκαθαρίσθη
  choice: a sọ di mímọ́
  rationale: Èyí pa ìtumọ̀ ìwẹ̀numọ́ mọ́, èyí tí ó lè kan ìmúláradá ara àti ìpadà kúrò nínú àìmọ́ ní ìlànà ẹ̀sìn, dípò kí a dín un kù sí ‘a mú láradá’ nìkan.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Gbólóhùn Yorùbá yìí ń fi ẹni kan ṣoṣo tí a yọ sílẹ̀ hàn lọ́nà àdánidá.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Náámánì ará Síríà
  rationale: ‘Ará Síríà’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìdánimọ̀ ẹ̀yà rẹ̀ mọ́, ó sì tẹnu mọ́ pé àjèjì ni ẹni tí a sọ di mímọ́.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìwẹ̀numọ́ ní ìbámu pẹ̀lú ẹ̀tẹ̀
  choice: a sọ di mímọ́
  alternative: a mú láradá; a wẹ̀ mọ́
  rationale: ‘A sọ di mímọ́’ pa ìdílé ọ̀rọ̀ καθαρίζω àti ìró èdè Ìwé Mímọ́ mọ́, láìsọ pé ìmúláradá ìṣègùn nìkan ni ó túmọ̀ sí tàbí láìfi ẹ̀kọ́ míì kún un.
- issue: Agbára ìdánimọ̀ Náámánì gẹ́gẹ́ bí ará Síríà
  choice: Pa ‘ará Síríà’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Náámánì kan, tí ó jẹ́ ará Síríà
  rationale: 'Èyí pa ìyàtọ̀ ọ̀rọ̀ Jésù mọ́: ẹni tí a sọ di mímọ́ jẹ́ àjèjì tí a mọ̀ sí ará Síríà, kì í ṣe ọ̀kan lára ọ̀pọ̀ àwọn adẹ́tẹ̀ ní Ísírẹ́lì.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìtòlẹ́sẹẹsẹ náà pa ìtẹnumọ́ ‘ọ̀pọ̀ ... kò sí ẹnikẹ́ni ... bí kò ṣe’ mọ́.
