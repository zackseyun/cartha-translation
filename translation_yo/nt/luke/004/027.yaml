  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ọ̀pọ̀ adẹ́tẹ̀ ní Ísírẹ́lì, àkókò Èlíṣà wòlíì, ìsọdimímọ́ wọn, àti ìyàsọ́tọ̀ Náámánì ará Síríà. Síbẹ̀, ‘ṣùgbọ́n’ fún καὶ fi ìdàkọ̀sílẹ̀ ìtakò kan kún ọ̀rọ̀ náà; ìtakò tó wà nínú ‘kò sí ẹni kankan ... bí kò ṣe’ ti tó láti gbé èrò Gíríìkì náà.
  naturalness: ‘Kò sì sí ẹni kankan nínú wọn’ jẹ́ ìṣọ̀kan Yorùbá adayeba, ó sì ń tẹ̀lé ìbẹ̀rẹ̀ pẹ̀lú ‘Ọ̀pọ̀ ... sì ni’. ‘ní àkókò Èlíṣà wòlíì’ tún hàn kedere ju ‘nígbà wòlíì Èlíṣà’ lọ, nípasẹ̀ títọ́ka sí àkókò wòlíì náà.
  terminology: ‘Àwọn adẹ́tẹ̀,’ ‘a sọ di mímọ́,’ àti ‘Náámánì ará Síríà’ yẹ, wọ́n sì pa ìforúkọsílẹ̀ Bíbélì àti ìdánimọ̀ ẹ̀yà Náámánì mọ́. Kò sí àlàyé ẹsẹ̀ tàbí àmì ìsàlẹ̀ tí ó nílò àtúnṣe.
  issues:
  - severity: low
    issue: ‘ṣùgbọ́n’ ni a lò fún καὶ.
    rationale: καὶ níhìn-ín jẹ́ ‘àti/ sì’; bí ó tilẹ̀ jẹ́ pé ìtakò wà nínú èrò gbolóhùn náà, ‘ṣùgbọ́n’ jẹ́ ìmúlẹ̀ ìtakò tí kò hàn ní ọ̀rọ̀ orísun. ‘Kò sì sí’ pa ìṣọ̀kan náà mọ́ láìkún ìtumọ̀.
  - severity: low
    issue: Ìtòlẹ́sẹẹsẹ ‘nígbà wòlíì Èlíṣà’ lè jẹ́ aláìdánilójú díẹ̀.
