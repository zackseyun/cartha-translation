  to: Ó sì dìde kúrò ní sínágọ́gù, ó wọ ilé Símónì. Ìbà líle sì ń mú ìyá aya Símónì, wọ́n sì béèrè lọ́wọ́ rẹ̀ nípa obìnrin náà.[a]
