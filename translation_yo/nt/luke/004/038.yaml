id: LUK.4.38
reference: Luke 4:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: yo
  text: Ó sì dìde kúrò ní sínágọ́gù, ó wọ ilé Símónì. Ìbà líle sì ń mú ìyá aya Símónì, wọ́n sì béèrè lọ́wọ́ rẹ̀ nípa obìnrin náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ́n bẹ̀ ẹ́ fún un.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà ni “wọ́n béèrè lọ́wọ́ rẹ̀ nípa rẹ̀,” ó sì ṣeé ṣe pé nínú àyíká yìí wọ́n ń bẹ̀ ẹ́ pé kí ó ràn án lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Ó sì dìde kúrò ní sínágọ́gù
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú wíwọ ilé hàn. Èdè Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìtumọ̀ dídìde àti kíkúrò ní sínágọ́gù mọ́.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ó wọ ilé Símónì
  rationale: ‘Wọ ilé’ sọ ìṣípò wọ inú ibi kan ní ṣókí àti ní èdè Yorùbá tí ó ṣe déédéé.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: ìyá ìyàwó Símónì
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ìyá ọkọ tàbí ìyá aya; ní ti ọkùnrin bí Símónì, ‘ìyá ìyàwó’ ni ọ̀nà Yorùbá tí ó ṣe kedere jù láti sọ ìbátan náà.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: Ìbà líle sì ń mú
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ṣàpèjúwe ẹni tí àìsàn dì mú. ‘Ìbà líle ń mú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ibà ń ṣe gidigidi, ó sì pa agbára passive náà mọ́.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: wọ́n sì béèrè lọ́wọ́ rẹ̀ nípa obìnrin náà
  rationale: Èyí dúró sítòsí ìtumọ̀ gangan pé wọ́n béèrè lọ́wọ́ rẹ̀ nípa rẹ̀, láì sọ ní pàtó pé wọ́n ní kí ó wò ó sàn; àyíká ọ̀rọ̀ lè fi hàn pé ẹ̀bẹ̀ fún ìrànlọ́wọ́ wà nínú rẹ̀.
theological_decisions:
- issue: Ohun tí πενθερά fi hàn nípa ìgbéyàwó Símónì
  choice: Túmọ̀ ìbátan náà ní tààrà sí ‘ìyá ìyàwó Símónì.’
  alternative: Ṣàlàyé síwájú pé Símónì ní aya.
  rationale: Ẹsẹ náà sọ ìbátan ìdílé náà ní kedere, ṣùgbọ́n kò yẹ kí ìtumọ̀ fi àlàyé ẹ̀kọ́ tàbí ìtàn kún ohun tí ọ̀rọ̀ náà sọ.
- issue: Ìtumọ̀ ẹ̀bẹ̀ nínú ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: Lo ‘wọ́n sì béèrè lọ́wọ́ rẹ̀ nípa obìnrin náà’ nínú ẹsẹ.
  alternative: ‘Wọ́n sì bẹ̀ ẹ́ pé kí ó ran obìnrin náà lọ́wọ́.’
  rationale: Àyíká ìwòsàn mú kí ẹ̀bẹ̀ fún ìrànlọ́wọ́ ṣeé ṣe gan-an, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ìrànlọ́wọ́ tàbí ìwòsàn ní pàtó. Ìtumọ̀ yìí pa ìfọ̀rọ̀wọ̀rọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ míràn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe òde òní, pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà tí ó níyì tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó ti wọ́pọ̀ fún ibi ìpàdé àti ìjọsìn àwọn Júù.
