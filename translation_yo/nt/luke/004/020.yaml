id: LUK.4.20
reference: Luke 4:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: yo
  text: Lẹ́yìn tí ó ká ìwé àkájọ náà pọ̀[a], tí ó sì dá a padà fún olùrànlọ́wọ́[b], ó jókòó. Ojú gbogbo àwọn tí ó wà nínú sínágọ́gù náà sì wà lórí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun ìkọ̀wé ní gbogbogbòò, ṣùgbọ́n nínú àyíká sínágọ́gù yìí, ìwé àkájọ ni yóò jẹ́.
    reason: lexical_alternative
  - marker: b
    text: Èyí ni olùrànlọ́wọ́ sínágọ́gù tó ń bójú tó àwọn ìwé àkájọ.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: ká ... pọ̀
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí a ṣe ká ìwé àkájọ padà, kì í ṣe bí a ṣe ń ti ìwé oníṣẹ́lẹ̀ mọ́; ‘ká ... pọ̀’ bá ohun tí a ń lò nínú sínágọ́gù ìgbà náà mu.
- source_word: βιβλίον
  choice: ìwé àkájọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwé ní gbogbogbòò, ìwé àkájọ ni a máa ń lò fún kíkà Ìwé Mímọ́ nínú sínágọ́gù ní ọ̀rúndún kìíní.
- source_word: ἀποδοὺς
  choice: dá a padà
  rationale: Ó fi hàn pé ó fi ohun tí ó lò padà fún ẹni tí ó ń bójú tó o; èdè yìí sì jẹ́ ti Yorùbá àdánidá.
- source_word: ὑπηρέτῃ
  choice: olùrànlọ́wọ́
  rationale: Nínú àyíká sínágọ́gù, ẹni yìí ni olùrànlọ́wọ́ tó ń bójú tó àwọn ìwé àkájọ àti iṣẹ́ ìpàdé, kì í ṣe ‘ẹrú’ tàbí òṣìṣẹ́ ìjọba.
- source_word: ἐκάθισεν
  choice: ó jókòó
  rationale: Ó sọ ìṣe náà ní tààrà, láìfi àlàyé tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: Ojú gbogbo àwọn tí ó wà
  rationale: Ìtumọ̀ yìí pa àwòrán ‘ojú’ mọ́, ó sì sọ pé gbogbo ẹni tó wà níbẹ̀ ni ọ̀rọ̀ náà kàn.
- source_word: ἀτενίζοντες αὐτῷ
  choice: tẹ̀ mọ́ ọn
  rationale: Ó fi ìwòye tí ó tẹ̀síwájú, tí ó sì jinlẹ̀ hàn ní Yorùbá àdánidá, láìsọ pé wọ́n ń wò ó pẹ̀lú ìkórìíra.
- source_word: συναγωγῇ
  choice: sínágọ́gù
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ibi ìpàdé àti ìjọsìn àwọn Júù.
theological_decisions:
- issue: Irú ohun tí βιβλίον jẹ́ nínú ìjọsìn sínágọ́gù
  choice: ìwé àkájọ
  alternative: ìwé
  rationale: Yíyan ‘ìwé àkájọ’ dá lórí ohun tí wọ́n ń lò ní ìtàn yìí, kì í ṣe lórí ẹ̀kọ́ ìsìn kan; ó mú àyíká ọ̀rúndún kìíní hàn kedere láìyí ìtumọ̀ padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye, ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. Àwọn gbólóhùn abẹ́ ‘Lẹ́yìn tí ...’ ń gbé ìtẹ̀lé àwọn participle Gíríìkì jáde ní ọ̀nà Yorùbá àdánidá, nígbà tí ‘ojú ... tẹ̀ mọ́ ọn’ pa àwòrán àti agbára ọ̀rọ̀ orísun mọ́.
