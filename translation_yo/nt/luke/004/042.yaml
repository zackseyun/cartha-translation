translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí àlàyé wọn ń tọ́ka sí, dípò kí wọ́n tẹ̀ lé àwọn ọ̀rọ̀ mìíràn tí kò bá àlàyé náà mu.
