source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́, ó jáde, ó sì lọ sí ibi àdáni kan.[a] Àwọn ogunlọ́gọ̀ sì ń wá a; wọ́n dé ọ̀dọ̀ rẹ̀, wọ́n sì ń gbìyànjú láti dá a dúró[b] kí ó má bàa kúrò lọ́dọ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ibi ahoro kan’ tàbí ‘ibi aginjù kan.’ Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe ibi tí ó ya sọ́tọ̀ tàbí tí ènìyàn kò gbé.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘wọ́n ń ní í mọ́’ tàbí ‘wọ́n ń dí i lọ́wọ́.’ Èrò ọ̀rọ̀ náà ni pé àwọn ogunlọ́gọ̀ ń gbìyànjú láti dènà rẹ̀ kí ó má lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Èyí jẹ́ gbólóhùn àkókò tí ó fi hàn pé òwúrọ̀ ti dé. ‘Nígbà tí ilẹ̀ mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọjọ́ bẹ̀rẹ̀.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ó jáde, ó sì lọ
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi ìjáde àti lílọ sí ibòmíràn hàn. Àtúmọ̀ yìí pa ìṣe méjèèjì mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: εἰς ἔρημον τόπον
  choice: sí ibi ahoro kan
  rationale: ἔρημος níhìn-ín tọ́ka sí ibi tí ènìyàn kò pọ̀ sí tàbí ibi àdáni, kì í ṣe dandan pé ó jẹ́ aṣálẹ̀. ‘Ibi ahoro’ pa ìtumọ̀ ìdákẹ́jẹ àti àìsí olùgbé mọ́.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọ̀pọ̀ ènìyàn tí wọ́n péjọ; ‘àwọn ogunlọ́gọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ọ̀pọ̀ ènìyàn.
- source_word: ἐπεζήτουν αὐτόν
  choice: ń wá a
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ lọ́wọ́ hàn. ‘Ń wá a’ sọ ìwá kiri tí ó ń tẹ̀ síwájú ní ṣókí àti ní ti ẹ̀dá.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: wọ́n dé ọ̀dọ̀ rẹ̀
  rationale: Gbólóhùn náà fi hàn pé wọ́n dé ibi tí ó wà. ‘Dé ọ̀dọ̀ rẹ̀’ jẹ́ Yorùbá àdánidá tí ó ṣe kedere ju títúmọ̀ ἕως lọ ní ọ̀rọ̀-ọ̀rọ̀.
- source_word: κατεῖχον αὐτὸν
  choice: wọ́n sì ń gbìyànjú láti dá a dúró
  rationale: κατέχω lè túmọ̀ sí dídì ẹnì kan mú, dídá a dúró, tàbí dídènà rẹ̀ láti lọ. Ọ̀rọ̀ yìí fi ìsapá àwọn ogunlọ́gọ̀ hàn láìfipá pinnu pé wọ́n dì í mú nípa ti ara.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: kí ó má bàa kúrò lọ́dọ̀ wọn
  rationale: 'Ìtòlẹ́sẹẹsẹ infinitive náà ṣàlàyé ohun tí wọ́n fẹ́ dènà: kí ó má lọ kúrò ní ọ̀dọ̀ wọn. Àtúmọ̀ Yorùbá yìí jẹ́ mímọ́ tónítóní, ó sì pa ìbáṣepọ̀ ète yẹn mọ́.'
