  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: ó pa ìyípadà sí òwúrọ̀, ìjáde àti lílọ Jesu, ibi ìdáwà, ìwá tí ó ń tẹ̀ síwájú ti ogunlọ́gọ̀, àti ìfẹ́ wọn láti dènà ìkúrò rẹ̀ mọ́. Síbẹ̀, ‘ibi ahoro’ lè gbé ìtumọ̀ ‘àwọn àwókù ilé/ibi tí ó ti bàjẹ́’ wá, èyí tí kò ṣe pàtó nínú ἔρημος.'
  naturalness: ‘Nígbà tí ilẹ̀ mọ́’ àti ‘wọ́n dé ọ̀dọ̀ rẹ̀’ jẹ́ Yorùbá àdánidá. ‘Ibi àdáni kan’ jẹ́ kedere síi ju ‘ibi ahoro kan’ lọ fún ibi tí ènìyàn kò sí tàbí ibi ìdáwà. Àlàyé [b] tún nílò àtúnṣe kékeré nítorí àṣàyàn àkọ́kọ́ rẹ̀ tún sọ gẹ́gẹ́ bí ọ̀rọ̀ inú ìtumọ̀.
  terminology: ‘Àwọn ogunlọ́gọ̀’ bójú mu fún οἱ ὄχλοι. ‘Dá a dúró’ pa ìtumọ̀ κατεῖχον mọ́ láìsọ pé wọ́n fi agbára ara mú un. ‘Ibi àdáni’ yẹ fún ἔρημον τόπον nínú àyíká yìí, nígbà tí àlàyé ìsàlẹ̀ ń pa àwọn àṣàyàn ‘ibi ahoro’ àti ‘ibi aginjù’ sílẹ̀.
