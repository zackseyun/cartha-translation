id: LUK.4.43
reference: Luke 4:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Mo ní láti kéde ìhìn rere[a] nípa ìjọba Ọlọ́run fún àwọn ìlú mìíràn pẹ̀lú, nítorí èyí ni a fi rán mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wàásù ìhìn rere.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ète yìí ni a ṣe rán mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: Ṣùgbọ́n ó sọ fún wọn pé
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ tí δέ ń fi hàn nínú àyíká ọ̀rọ̀ náà jáde, nígbà tí “ó sọ fún wọn pé” jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ọ̀rọ̀ tààrà kalẹ̀.
- source_word: εὐαγγελίσασθαί
  choice: kéde ìhìn rere
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe εὐαγγελίζω mọ́ gẹ́gẹ́ bí mímú tàbí kíkéde ìròyìn rere, láì sọ ọ́ di ọ̀rọ̀ ẹ̀sìn amọ̀dájú kan ṣoṣo.
- source_word: δεῖ
  choice: Mo ní láti
  rationale: Gbólóhùn yìí fi dandan tó lágbára hàn, ó sì bá ìtumọ̀ iṣẹ́ tí a gbé lé Jesu lọ́wọ́ mu.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: nípa ìjọba Ọlọ́run
  rationale: “Ìjọba Ọlọ́run” pa gbólóhùn pàtàkì Luku mọ́; “nípa” mú ìbáṣepọ̀ rẹ̀ pẹ̀lú “ìhìn rere” ṣe kedere ní Yorùbá láì pinnu bóyá ìjọba náà túmọ̀ sí ìṣàkóso tàbí ilẹ̀ ìjọba nìkan.
- source_word: ἑτέραις πόλεσιν
  choice: fún àwọn ìlú mìíràn
  rationale: Ó tọ́ka sí àwọn ìlú tí ó yàtọ̀ sí ibi tí Jesu wà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: Καὶ
  choice: pẹ̀lú
  rationale: “Pẹ̀lú” mú ìtumọ̀ àfikún καί jáde, pé iṣẹ́ náà tún kan àwọn ìlú mìíràn.
- source_word: ἐπὶ τοῦτο
  choice: nítorí èyí
  rationale: Ó fi ète tàbí ìdí iṣẹ́ náà hàn ní ọ̀nà ṣókí, àdánidá.
- source_word: ἀπεστάλην
  choice: a fi rán mi
  rationale: Ó pa ohùn àìṣe àti èrò iṣẹ́ tí a rán ẹni ṣe mọ́, láì fi orúkọ olùránṣẹ́ kún ohun tí ẹsẹ náà sọ.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jesu nípa iṣẹ́ tí a rán án ṣe
  choice: “Mo ní láti” fi dandan iṣẹ́ náà hàn, “a fi rán mi” sì pa olùránṣẹ́ mọ́ láìdárúkọ.
  alternative: A lè túmọ̀ dandan náà sí ohun tí Ọlọ́run pinnu, kí a sì sọ Ọlọ́run ní tààrà gẹ́gẹ́ bí ẹni tó rán Jesu.
  rationale: δεῖ sábà máa ń ní agbára dandan láti ọ̀dọ̀ Ọlọ́run nínú Luku, ἀπεστάλην sì ń tọ́ka sí iṣẹ́ tí a rán Jesu ṣe. Síbẹ̀, ẹsẹ yìí kò dárúkọ olùránṣẹ́, nítorí náà a kò fi í kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. “Kéde ìhìn rere” jẹ́ àdánidá, kò sì di ọ̀rọ̀ náà mọ́ èdè ìjọ kan; “a fi rán mi” pa àìsọ ẹni tó rán án mọ́.
