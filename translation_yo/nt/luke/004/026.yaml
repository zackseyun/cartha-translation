source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: yo
  text: A kò sì rán Èlíjà sí ọ̀dọ̀ ẹnikẹ́ni nínú wọn[a], àfi sí Sáréfátì ti Sídónì, sí ọ̀dọ̀ obìnrin opó kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “Sárépta ti Sídónì”; a máa ń dá a mọ̀ pọ̀ mọ́ Sáréfátì nínú Májẹ̀mú Láéláé (1 Àwọn Ọba 17:9).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: a rán
  rationale: Ọ̀rọ̀ ìṣe aláìṣe yìí túmọ̀ sí pé ‘a rán’; ó jẹ́ kí ẹni tó rán an má ṣe hàn gbangba, gẹ́gẹ́ bí Gíríìkì.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: sí ọ̀kan nínú wọn
  rationale: Pẹ̀lú ‘kò,’ gbólóhùn yìí sọ ní Yorùbá àdánidá pé a kò rán an sí ẹnikẹ́ni nínú wọn, ó sì pa ìtẹnumọ́ ìyọkúrò mọ́.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Èyí ni ìkọ̀wé orúkọ wòlíì náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Nínú àyíká yìí, ó jẹ́ ọ̀rọ̀ ìyọkúrò, kì í ṣe gbólóhùn oníṣ شرط; ‘bí kò ṣe’ jẹ́ Yorùbá àdánidá fún ‘àfi.’
- source_word: Σάρεπτα
  choice: Sáréfátì
  rationale: A lo orúkọ ibi náà gẹ́gẹ́ bí ó ti di mímọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú fọ́ọ̀mù Gíríìkì.
- source_word: τῆς Σιδωνίας
  choice: ti Sídónì
  rationale: Ẹ̀yà ìní Gíríìkì so Sáréfátì mọ́ Sídónì; ‘ti Sídónì’ pa ìbáṣepọ̀ náà mọ́ láìfi kún un pé ó wà ‘nínú’ ìlú tàbí agbègbè náà.
- source_word: γυναῖκα χήραν
  choice: obìnrin opó kan
  rationale: Èyí ń ṣàfihàn àwọn ọ̀rọ̀ méjèèjì, ‘obìnrin’ àti ‘opó,’ ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ẹni tó rán Èlíjà kò jẹ́ dídárúkọ nínú ọ̀rọ̀ ìṣe aláìṣe
  choice: 'Pa ẹni tó rán an mọ́ láìdárúkọ: ‘a kò ... rán Èlíjà’'
  alternative: 'Sọ Ọlọ́run ní gbangba: ‘Ọlọ́run kò rán Èlíjà’'
  rationale: Àyíká tọ́ka sí iṣẹ́ Ọlọ́run, ṣùgbọ́n Gíríìkì kò dárúkọ ẹni tó rán an. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ohun tí ọ̀rọ̀ náà kò sọ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A yan ‘bí kò ṣe’ láti jẹ́ kí ìyọkúrò hàn kedere, a sì pa ìṣe aláìṣe Gíríìkì mọ́ láìdárúkọ Ọlọ́run gẹ́gẹ́ bí olùránṣẹ́.
