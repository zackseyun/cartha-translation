language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “A ti kọ ọ́ pé, ‘Kí o jọ́sìn fún Olúwa, Ọlọ́run rẹ,[a] kí o sì sìn fún òun nìkan.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ gangan jù: “Kí o foríbalẹ̀ fún Olúwa, Ọlọ́run rẹ.”'
    reason: lexical_alternative
  - marker: b
    text: Àyọlò yìí ń ṣe àtúnsọ Diutarónómì 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: dá a lóhùn pé
  rationale: 'Èyí sọ ìtumọ̀ ọ̀rọ̀ àpapọ̀ Gíríìkì náà ní Yorùbá àdánidá: Jésù fèsì sí ẹni tí ó ń bá sọ̀rọ̀, ó sì sọ ohun tí ó tẹ̀ lé e.'
- source_word: Γέγραπται
  choice: A ti kọ ọ́ pé
  rationale: Ọ̀nà Yorùbá yìí jẹ́ àgbékalẹ̀ àdánidá fún fífi ẹsẹ Ìwé Mímọ́ hàn, ó sì pa agbára perfect passive mọ́ pé ohun tí a kọ ṣì dúró.
- source_word: Κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: “Olúwa” pa ìtumọ̀ κύριος nínú àyọlò Ìwé Mímọ́ mọ́, “Ọlọ́run rẹ” sì fi ìbáṣepọ̀ tí θεόν σου ń sọ hàn.
- source_word: προσκυνήσεις
  choice: kí o máa jọ́sìn fún
  rationale: Nínú ọ̀rọ̀ nípa ìfọkànsìn sí Ọlọ́run nìkan, “jọ́sìn fún” sọ ipa ẹ̀sìn ọ̀rọ̀ náà ní kedere; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ti fíforíbalẹ̀ kún un.
- source_word: λατρεύσεις
  choice: kí o máa sìn
  rationale: “Sìn” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bójú mu iṣẹ́ ìjọsìn tí a ń ṣe fún Ọlọ́run.
- source_word: αὐτῷ μόνῳ
  choice: òun nìkan
  rationale: Ìtẹnumọ́ “òun nìkan” pa àìlábápín iṣẹ́ ìsìn náà mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò Ìwé Mímọ́ tí ó ń tọ́ka sí Ọlọ́run
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì Lúùkù ní κύριον, nítorí náà a túmọ̀ rẹ̀ sí “Olúwa” láì fi ọ̀nà tí a fi ń ṣàfihàn YHWH nínú Májẹ̀mú Láéláé wọ inú ọ̀rọ̀ Májẹ̀mú Tuntun.
- issue: Agbára ọ̀rọ̀ ọjọ́ iwájú προσκυνήσεις àti λατρεύσεις nínú àṣẹ Ìwé Mímọ́
  choice: ni kí o máa … fún / ni kí o máa sìn
  alternative: ìwọ yóò …
  rationale: Àwọn ọ̀rọ̀ ọjọ́ iwájú Gíríìkì níbí ní agbára àṣẹ. Àgbékalẹ̀ “ni kí o” sọ àṣẹ àti ìtẹnumọ́ náà ní Yorùbá àdánidá, dípò kí ó dà bí àsọtẹ́lẹ̀ lásán.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo “dá a lóhùn” àti “A ti kọ ọ́ pé” gẹ́gẹ́ bí àgbékalẹ̀ àdánidá; “òun nìkan” pa ìtẹnumọ́ àti àìlábápín ọ̀rọ̀ Gíríìkì mọ́.
