language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: yo
  text: Ó sì wá sí Násárà,[a] níbi tí wọ́n ti tọ́ ọ dàgbà. Gẹ́gẹ́ bí àṣà rẹ̀, ó wọ inú sínágọ́gù ní ọjọ́ Ìsinmi, ó sì dìde láti kà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Násárẹ́tì.” Nínú Gíríìkì, orúkọ náà jẹ́ Násárà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Násárà
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú fọ́ọ̀mù Gíríìkì Ναζαρά, dípò kí a mú un bá fọ́ọ̀mù ìbílẹ̀ Násárẹ́tì mu.
- source_word: τεθραμμένος
  choice: níbi tí a ti tọ́ ọ dàgbà
  rationale: Gbólóhùn yìí túmọ̀ sí ibi tí wọ́n ti tọ́ Jesu láti kékeré dé ìgbà tí ó dàgbà; ó jẹ́ ọ̀nà Yorùbá àdánidá fún àbájáde tí perfect passive participle náà ń fi hàn.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: gẹ́gẹ́ bí àṣà rẹ̀
  rationale: Ó ṣàfihàn ohun tí ó máa ń ṣe déédéé, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: ní ọjọ́ Ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé σαββάτων jẹ́ ọ̀pọ̀ nínú Gíríìkì, odindi gbólóhùn náà jẹ́ ọ̀rọ̀ àṣà tó ń tọ́ka sí ọjọ́ Sábáàtì kan ṣoṣo.
- source_word: συναγωγήν
  choice: sínágọ́gù
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà ń tọ́ka sí ilé ìpéjọsìn wọn; àyálò-ọ̀rọ̀ yìí dá ìtumọ̀ pàtó náà mọ́.
- source_word: ἀνέστη ἀναγνῶναι
  choice: ó dìde láti kàwé
  rationale: Ọ̀rọ̀-ìṣe àti infinitive náà fi hàn pé ó dìde fún ète kíkà; ìtumọ̀ yìí sún mọ́ Gíríìkì, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ orúkọ ibi Ναζαρά
  choice: Násárà
  alternative: Násárẹ́tì
  rationale: A tẹ̀ lé bí orúkọ náà ṣe rí gan-an nínú ẹsẹ yìí ní Gíríìkì, láì mú un bá fọ́ọ̀mù tí ó wọ́pọ̀ jù lọ mu; akọsilẹ̀ ìsàlẹ̀ pa fọ́ọ̀mù tí àwọn òǹkàwé mọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn níbi tí ó bá jẹ́ àdánidá. “Ọjọ́ Ìsinmi” ni a lò fún Sábáàtì, “sínágọ́gù” sì pa àyíká Júù mọ́.
