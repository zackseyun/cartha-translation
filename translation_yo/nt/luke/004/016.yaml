  to: Ó sì wá sí Násárà,[a] níbi tí wọ́n ti tọ́ ọ dàgbà. Gẹ́gẹ́ bí àṣà rẹ̀, ó wọ inú sínágọ́gù ní ọjọ́ Ìsinmi, ó sì dìde láti kà.
