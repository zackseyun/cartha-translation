  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ Gíríìkì dáadáa: ó wá sí Násárà, ibẹ̀ ni a ti tọ́ ọ dàgbà, ó wọ sínágọ́gù gẹ́gẹ́ bí ìṣe rẹ̀ ní ọjọ́ Ìsinmi, ó sì dìde fún ìfẹ́ kíkà. Síbẹ̀, “kàwé” lè túmọ̀ sí kíkẹ́kọ̀ọ́ tàbí ẹ̀kọ́ ní Yorùbá òde òní, kì í sì dá ìṣe ἀναγνῶναι (“láti kà”) mọ́ dáadáa.'
