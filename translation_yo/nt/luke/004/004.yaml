id: LUK.4.4
reference: Luke 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “A ti kọ ọ́ sílẹ̀ pé, ‘Èèyàn kì yóò wà láàyè nípa búrẹ́dì nìkan.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èèyàn kì yóò wà láàyè nípa oúnjẹ nìkan.”
    reason: lexical_alternative
  - marker: b
    text: Jésù ń fa ọ̀rọ̀ yọ láti inú Deuterónómì 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: dá a lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fèsì sí ẹni tí ó bá a sọ̀rọ̀; kò tẹ̀ lé ìtumọ̀ gígún ti πρός lọ́nà tí kò bá èdè Yorùbá mu.
- source_word: Γέγραπται
  choice: A ti kọ ọ́ pé
  rationale: Ọ̀rọ̀ yìí jẹ́ àgbékalẹ̀ tí a fi ń tọ́ka sí Ìwé Mímọ́. ‘A ti kọ ọ́’ pa ìtumọ̀ perfect passive mọ́ pé ohun tí a kọ sílẹ̀ ṣì dúró gẹ́gẹ́ bí ọ̀rọ̀ aláṣẹ.
- source_word: ὅτι
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti mú ọ̀rọ̀ àyọlò wọlé lẹ́yìn ‘A ti kọ ọ́’; àmì ìfọ̀rọ̀wérọ̀ tún fi àyọlò náà hàn kedere.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: nípa oúnjẹ nìkan
  rationale: ἄρτος lè túmọ̀ sí búrẹ́dì ní pàtó, ṣùgbọ́n nínú àyọlò Deuterónómì 8:3 ó dúró fún oúnjẹ tí ń gbé ara ró. ‘Oúnjẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́, ‘nípa ... nìkan’ sì fi ìgbẹ́kẹ̀lé gẹ́gẹ́ bí ìpìlẹ̀ ìyè hàn.
- source_word: ζήσεται
  choice: kì yóò wà láàyè
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá òde òní tí ó ṣe kedere fún future ‘yóò wà láàyè,’ pẹ̀lú àtakò οὐκ.
- source_word: ὁ ἄνθρωπος
  choice: Èèyàn
  rationale: Níbí, ἄνθρωπος jẹ́ ẹyọ ọ̀rọ̀ aṣojú fún gbogbo ènìyàn. ‘Èèyàn’ jẹ́ ẹyọ ọ̀rọ̀ Yorùbá tí ó ní ìtumọ̀ gbogbogbò láìfi akọ tàbí abo kún ohun tí àyíká ọ̀rọ̀ ń sọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ὁ ἄνθρωπος, ẹyọ ọ̀rọ̀ aṣojú, nínú àyọlò Ìwé Mímọ́
  choice: Èèyàn
  alternative: Ọmọ ènìyàn
  rationale: ‘Èèyàn’ pa ẹyọ ọ̀rọ̀ àti ìtumọ̀ gbogbogbò fún aráyé mọ́. ‘Ọmọ ènìyàn’ lè dá òǹkàwé lójú pé ó jẹ́ orúkọ oyè tàbí gbólóhùn Kristológì, èyí tí kò yẹ níbí.
- issue: Bí a ṣe máa ṣàfihàn ἄρτος nínú Deuterónómì 8:3
  choice: oúnjẹ
  alternative: búrẹ́dì
  rationale: Nínú Yorùbá, ‘oúnjẹ’ dára jù fún ohun tí ń gbé ìyè ara ró, èyí sì bá ìtumọ̀ ọ̀rọ̀ inú àyíká mu. ‘Búrẹ́dì’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ sí i, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A fi àmì [a] àti [b] sí lẹ́yìn àyọlò nínú ọ̀rọ̀ pàtàkì, ó sì bá àlàyé ìsàlẹ̀ mu.
