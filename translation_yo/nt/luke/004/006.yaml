id: LUK.4.6
reference: Luke 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: yo
  text: Bìlísì sì sọ fún un pé, “Èmi yóò fún ọ ní gbogbo àṣẹ yìí àti ògo wọn[a], nítorí a ti fi í fún mi, mo sì ń fi í fún ẹnikẹ́ni tí mo bá fẹ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdánilẹ́wà wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ògo, ìdánilẹ́wà, tàbí ọlá ńlá ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Èṣù
  rationale: Èyí ni orúkọ àpèjúwe tí ó ti fìdí múlẹ̀ ní Yorùbá fún ẹni tí ó ń dán Jésù wò; ó tọ́ka sí ẹni náà, kì í ṣe kìkì ìtumọ̀ gbòǹgbò ọ̀rọ̀ náà, ‘abanijẹ́.’
- source_word: Σοὶ δώσω
  choice: Èmi yóò fún ọ ní
  rationale: Lílo ‘Èmi’ ní ìbẹ̀rẹ̀ gbólóhùn mú ìtẹnumọ́ arọ́pò-orúkọ tí a gbé síwájú nínú Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ sọ agbára tàbí ẹ̀tọ́ láti ṣàkóso, èyí tí ó bá ọ̀rọ̀ àwọn ìjọba nínú àyíká ẹsẹ náà mu ju agbára ti ara lọ.
- source_word: ταύτην ἅπασαν
  choice: gbogbo ... yìí
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ sí gbogbo ohun tí a ṣẹ̀ṣẹ̀ fihàn mọ́.
- source_word: δόξαν αὐτῶν
  choice: ògo wọn
  rationale: ‘Ògo’ pa ìsopọ̀ ọ̀rọ̀ Bíbélì mọ́, nígbà tí ó tún lè túmọ̀ sí ọlá àti ìtayọ̀ àwọn ìjọba tí a mẹ́nu kàn ní ẹsẹ 5.
- source_word: παραδέδοται
  choice: a ti fi í fún mi
  rationale: Àpólà yìí pa ohùn àìṣe ẹni mọ́, ó sì fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì dúró hàn, láìfi ọ̀rọ̀ kún un pé fífi náà bófin mu tàbí pé a gbẹ́kẹ̀ lé Èṣù.
- source_word: ᾧ ἂν θέλω
  choice: ẹnikẹ́ni tí mo bá fẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni àìdánimọ̀ tí ìfẹ́ olùsọ̀rọ̀ yàn.
- source_word: δίδωμι αὐτήν
  choice: mo sì ń fi í fún
  rationale: Àmì ‘ń’ mú ìṣe tí ó máa ń ṣẹlẹ̀ tàbí ẹ̀tọ́ tí olùsọ̀rọ̀ sọ pé òun ń lò hàn; ‘í’ tọ́ka padà sí ‘àṣẹ,’ gẹ́gẹ́ bí akọ abo ọ̀rọ̀ Gíríìkì ṣe fi hàn.
theological_decisions:
- issue: Bí ìtumọ̀ yóò ṣe mú ọ̀rọ̀ Èṣù nípa àṣẹ lórí àwọn ìjọba ayé hàn
  choice: A sọ ọ́ tààrà gẹ́gẹ́ bí ọ̀rọ̀ tí Èṣù fúnra rẹ̀ sọ, láìfi àlàyé amúrasílẹ̀ kún un.
  alternative: Láti fi ọ̀rọ̀ bí ‘ó sọ pé’ tàbí ‘gẹ́gẹ́ bí ó ti sọ’ kún un láti mú kí òǹkàwé jìnnà sí ìjẹ́rìí náà.
  rationale: Gíríìkì fi ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ọ̀rọ̀ tààrà láti ẹnu Èṣù. Àyíká ìtàn ti sọ ẹni tí ń sọ̀rọ̀ di mímọ̀; nítorí náà, ìtumọ̀ kò yẹ kí ó fọwọ́ sí ìjẹ́rìí rẹ̀ tàbí kí ó sọ ọ́ di aláìlágbára.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. Àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti yẹ. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí ó kan, ‘ògo wọn,’ dípò lẹ́yìn ‘sọ fún un.’
