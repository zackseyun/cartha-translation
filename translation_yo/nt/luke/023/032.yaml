source:
  edition: SBLGNT
  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: yo
  text: Wọ́n sì ń mú àwọn méjì mìíràn, tí wọ́n jẹ́ ọ̀daràn,[a] lọ pẹ̀lú rẹ̀ láti pa wọ́n.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣebi” tàbí “olùṣe ibi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó ṣe ohun búburú tí wọ́n sì ti dá lẹ́bi ìwà ọ̀daràn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti pa wọ́n gẹ́gẹ́ bí ìdájọ́.” Ohun tí Gíríìkì sọ níhìn-ín ni “láti pa wọ́n”; kò sọ ọ̀nà tí a ó fi pa wọ́n pàtó, bí ó tilẹ̀ jẹ́ pé àyíká ìtàn fi hàn pé kíkàn mọ́ àgbélébùú ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: Wọ́n sì ń mú ... lọ
  rationale: Ìṣe aláìpé ní ohùn àgbàfiyèsí fi hàn pé mímú wọn lọ ń lọ lọ́wọ́ ní àkókò náà. Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi ẹni tó ń ṣe ìṣe náà sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí Gíríìkì.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: καὶ ἕτεροι
  choice: àwọn méjì mìíràn
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn mìíràn yàtọ̀ sí Jésù. Ìtòlẹ́sẹẹsẹ Yorùbá yìí sọ ìtumọ̀ náà ní kedere, láìjẹ́ kí ó dà bí ẹni pé Jésù wà lára àwọn ọ̀daràn.
- source_word: κακοῦργοι δύο
  choice: tí wọ́n jẹ́ ọ̀daràn
  rationale: “Ọ̀daràn” jẹ́ ọ̀rọ̀ Yorùbá òde òní fún ẹni tí a dá lẹ́bi ìwà ọ̀daràn. Gbólóhùn alábùdá “tí wọ́n jẹ́” mú kí ó ṣe kedere pé àwọn méjì mìíràn náà ni a ń pè ní ọ̀daràn.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní kíkún, ó sì jẹ́ ọ̀nà àdánidá jù lọ ní Yorùbá.
- source_word: ἀναιρεθῆναι
  choice: láti pa wọ́n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ikú pa ènìyàn ní àyíká ìdájọ́. Àṣàyàn yìí kò sọ ọ̀nà ikú pàtó, bí ó tilẹ̀ jẹ́ pé àyíká ìtàn fi hàn pé kíkàn mọ́ àgbélébùú ni.
theological_decisions:
- issue: Bóyá kí a sọ pé a mú wọn lọ láti kàn wọ́n mọ́ àgbélébùú
  choice: Lo ọ̀rọ̀ gbogbogbò “láti pa wọ́n.”
  alternative: láti kàn wọ́n mọ́ àgbélébùú
  rationale: Àyíká ìtàn fi hàn pé ikú orí àgbélébùú ni, ṣùgbọ́n ἀναιρεθῆναι fúnra rẹ̀ kò sọ ọ̀nà ikú náà pàtó. Ìtumọ̀ náà pa ààlà ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ èdè òde òní, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo “wọ́n ń mú ... lọ” dípò àgbékalẹ̀ àgbàfiyèsí líle, nítorí pé èyí ni ọ̀nà àdánidá ní Yorùbá láti fi aṣojú ìṣe sílẹ̀ láìdárúkọ.
