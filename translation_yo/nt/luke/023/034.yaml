  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù ń wí pé,[a] “Baba, dáríjì wọ́n, nítorí wọn kò mọ̀ ohun tí wọ́n ń ṣe.” Wọ́n sì pín aṣọ rẹ̀, wọ́n sì ṣẹ́ kèké.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan kò ní àwọn ọ̀rọ̀ wọ̀nyí: “Baba, dáríjì wọ́n, nítorí wọn kò mọ̀ ohun tí wọ́n ń ṣe.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń wí pé
  rationale: Àkókò imperfect nínú Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń wí pé’ pa apá yìí mọ́ ju ‘wí pé’ lásán lọ.
- source_word: Πάτερ
  choice: Baba
  rationale: Ọ̀rọ̀ ìpè tààrà ni; ‘Baba’ jẹ́ ọ̀nà àdánidá láti bá Ọlọ́run sọ̀rọ̀ láìfi ọ̀rọ̀ ìní tí kò sí nínú Gíríìkì kún un.
- source_word: ἄφες
  choice: dárí jì
  rationale: Nínú àdúrà sí Ọlọ́run nípa àwọn tó ṣẹ̀, ‘dárí jì’ ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
- source_word: αὐτοῖς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì kò sọ ní pàtó ẹni tí gbogbo wọn jẹ́; ‘wọ́n’ pa àìsọ pàtó yẹn mọ́.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: nítorí wọn kò mọ ohun tí wọ́n ń ṣe
  rationale: ‘Mọ’ túmọ̀ οἴδασιν ní tààrà, láìfi èrò ‘lóye’ tí ó túmọ̀ sí ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
- source_word: διαμεριζόμενοι
  choice: pín
  rationale: Ó sọ ìṣe pípín aṣọ Jésù; ‘pín’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye nínú àyíká yìí.
- source_word: ἱμάτια
  choice: aṣọ
  rationale: ‘Aṣọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ohun ìwọ̀, ó sì bá ìforúkọsílẹ̀ ìtàn mímọ́ mu.
- source_word: ἔβαλον κλήρους
  choice: dìbò lé wọn lórí
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún lílo kèké tàbí ohun irú rẹ̀ láti pinnu ẹni tí yóò gba ọ̀kọ̀ọ̀kan.
- source_word: δὲ
  choice: Ṣùgbọ́n / sì
  rationale: δὲ àkọ́kọ́ ń fi ìyípadà tàbí ìyàtọ̀ díẹ̀ hàn, nítorí náà ‘Ṣùgbọ́n’ yẹ; èkejì ń tẹ̀síwájú nínú ìtàn, ‘sì’ sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ náà, ‘Baba, dárí jì wọ́n, nítorí wọn kò mọ ohun tí wọ́n ń ṣe,’ jẹ́ apá ojúlówó ẹsẹ náà
  choice: A fi ọ̀rọ̀ náà sínú àkọ́kọ́ ẹsẹ
  alternative: Àwọn ìwé àfọwọ́kọ kan kò ní ọ̀rọ̀ náà
  rationale: SBLGNT tẹ ọ̀rọ̀ náà sínú àkọ́kọ́, ṣùgbọ́n àmì àtúnṣe rẹ̀ fi hàn pé ẹ̀rí àwọn ìwé àfọwọ́kọ yàtọ̀. Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì tí a pèsè, ó sì sọ ìyàtọ̀ pàtàkì náà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘ń wí pé’ láti pa ìṣe tí ń lọ lọ́wọ́ mọ́, a sì fi ‘dìbò lé wọn lórí’ sọ àṣà kèké ní ọ̀nà Yorùbá àdánidá.
