  text: Ọkùnrin yìí lọ bá Pílátù, ó sì béèrè fún ara Jésù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka náà ń tọ́ka padà sí Jósẹ́fù ará Arimatíà nínú ẹsẹ tó ṣáájú; ‘Ọkùnrin yìí’ mú ìtọ́kasí náà hàn kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: lọ bá Pílátù
  rationale: Ọ̀rọ̀ iṣe alábàápín aorist náà ṣáájú ìbéèrè, ó sì túmọ̀ sí pé ó tọ Pílátù lọ; ‘lọ bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan lọ sí ọ̀dọ̀ ẹlòmíràn.
- source_word: ᾐτήσατο
  choice: béèrè fún
  rationale: Ní ibi yìí αἰτέω túmọ̀ sí béèrè tàbí tọrọ ohun kan; ‘béèrè fún’ bá ohun tí ó tẹ̀ lé e mu ní Yorùbá.
- source_word: τὸ σῶμα
  choice: òkú
  rationale: Ní àyíká ìtàn yìí, σῶμα ń tọ́ka sí ara Jesu lẹ́yìn ikú rẹ̀. ‘Òkú Jesu’ jẹ́ gbólóhùn Yorùbá àdánidá fún ara ẹni tí ó ti kú, láìlo ọ̀rọ̀ líle tàbí aláìbọ̀wọ̀.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Ẹ̀ka genitive náà fi ẹni tí ara náà jẹ́ hàn; Yorùbá máa ń sọ èyí ní ṣókí gẹ́gẹ́ bí ‘òkú Jesu,’ láìní àfikún ọ̀rọ̀ ìní.
