  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: yo
  text: Ó sì ń béèrè lọ́wọ́ rẹ̀ pẹ̀lú ọ̀rọ̀ púpọ̀[a], ṣùgbọ́n òun kò dá a lóhùn rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pẹ̀lú ọ̀rọ̀ púpọ̀” tàbí “pẹ̀lú ìbéèrè púpọ̀.” Gbólóhùn Gíríìkì náà tẹnu mọ́ bí ìbéèrè náà ṣe gùn, tí ó sì ní ọ̀rọ̀ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ó ń bi í
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé Hẹ́rọ́dù ń bá a lọ ní bí Jésù léèrè; “ó ń bi í” sọ ìṣe tí ó ń tẹ̀ síwájú yìí ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Nítorí náà / ṣùgbọ́n
  rationale: δὲ àkọ́kọ́ jẹ́ àsopọ̀ ìtàn tí “Nítorí náà” mú jáde ní ọ̀nà àdánidá; èkejì fi ìyàtọ̀ hàn láàárín bíbéèrè Hẹ́rọ́dù àti ìdákẹ́ Jésù, nítorí náà “ṣùgbọ́n” yẹ.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: ní ọ̀pọ̀lọpọ̀ ọ̀rọ̀ fún ìgbà pípẹ́
  rationale: Gbólóhùn náà tẹnu mọ́ ọ̀pọ̀ ọ̀rọ̀ àti bí ìfọ̀rọ̀wánilẹ́nuwò náà ṣe gùn; ìtumọ̀ yìí pa àwòrán “ọ̀rọ̀ púpọ̀” mọ́, ó sì mú ìtẹ̀síwájú ìṣe náà ṣe kedere.
- source_word: αὐτὸς
  choice: òun
  rationale: '“Òun” ní ipò yìí mú ìtẹnumọ́ àti ìyàtọ̀ tí αὐτός ní wá: Hẹ́rọ́dù ń béèrè, ṣùgbọ́n Jésù fúnra rẹ̀ kò dáhùn.'
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: kò dá a lóhùn rárá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò fún un ní ìdáhùn kankan; “rárá” mú ìkìlọ̀ οὐδέν lágbára láìfi ohun míì kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán; a fi àlàyé ẹsẹ̀ sílẹ̀ láti pa àìdánilójú λόγοις mọ́.
