id: LUK.23.14
reference: Luke 23:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: yo
  text: Ó sọ fún wọn pé, “Ẹ ti mú ọkùnrin yìí wá sọ́dọ̀ mi bí ẹni tí ń mú àwọn ènìyàn ṣìnà[a]. Ẹ kíyèsi, lẹ́yìn tí mo ti ṣe ìwádìí rẹ̀ níwájú yín, mi ò rí ìdí ẹ̀sùn kankan nínú ọkùnrin yìí nípa àwọn ohun tí ẹ fi ń fẹ̀sùn kàn án[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹni tí ń yí àwọn ènìyàn kúrò ní ọ̀nà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yí kúrò ní ọ̀nà tàbí mú ṣìnà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mi ò rí ọkùnrin yìí ní ẹ̀bi kankan nípa àwọn ohun tí ẹ fi ń fẹ̀sùn kàn án.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Ẹ mú ... wá sọ́dọ̀ mi
  rationale: Ó fi hàn pé àwọn olùgbọ́ náà ti mú Jesu wá sí ọ̀dọ̀ Pilatu, ó sì bá ọ̀rọ̀ ilé-ẹjọ́ mu ní Yorùbá àdánidá.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ọkùnrin yìí
  rationale: ἄνθρωπος tọ́ka sí ọkùnrin kan pàtó níhìn-ín; ìtumọ̀ yìí ṣe kedere, ó sì bójú mu.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: bí ẹni tí ń mú àwọn ènìyàn ṣìnà
  rationale: ἀποστρέφω lè túmọ̀ sí yí ènìyàn padà tàbí mú un ṣìnà. Àṣàyàn yìí mú agbára ẹ̀sùn náà jáde láìfi ọ̀rọ̀ líle bí ‘ń ru àwọn ènìyàn sókè’ kún un.
- source_word: ἰδοὺ
  choice: Ẹ sì wò ó
  rationale: Ó pa iṣẹ́ ἰδού mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìpe àfiyèsí, ní èdè Yorùbá tí ó lọ́wọ́lọ́wọ́, tí ó sì ní iyì.
- source_word: ἐνώπιον ὑμῶν
  choice: níwájú yín
  rationale: Ó tẹnumọ́ pé ìwádìí náà ṣẹlẹ̀ ní gbangba níbi tí àwọn olùgbọ́ wà.
- source_word: ἀνακρίνας
  choice: lẹ́yìn tí mo ti wádìí ọ̀ràn rẹ̀
  rationale: Nínú àyíká ilé-ẹjọ́, ἀνακρίνω túmọ̀ sí ṣàyẹ̀wò tàbí ṣe ìwádìí. ‘Wádìí ọ̀ràn rẹ̀’ jẹ́ àdánidá, ó sì pa ìtumọ̀ òfin mọ́.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: n kò rí ohun kan tí ... jẹ̀bi
  rationale: Ọ̀rọ̀ yìí sọ àbájáde ìwádìí ilé-ẹjọ́ ní Yorùbá àdánidá. Kò sọ pé Pilatu ń ṣe ìdájọ́ gbogbo ìwà ọkùnrin náà; ó ní í ṣe pẹ̀lú àwọn ẹ̀sùn tí wọ́n gbé kalẹ̀.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: nínú àwọn ohun tí ẹ fi ń fẹ̀sùn kàn án
  rationale: Ó pa èdè ẹ̀sùn ilé-ẹjọ́ àti ìtọ́kasí sí ohun tí wọ́n ń fi kàn án mọ́.
theological_decisions:
- issue: Irú ìkéde Pilatu
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àbájáde ìwádìí ilé-ẹjọ́ pé kò rí i pé ọkùnrin náà jẹ̀bi àwọn ohun tí wọ́n fi ń fẹ̀sùn kàn án.
  alternative: A lè sọ pé, “n kò rí ìdí ẹ̀sùn kankan lára ọkùnrin yìí.”
  rationale: Àwọn ọ̀rọ̀ ἀνακρίνω, αἴτιον àti κατηγορέω fi àyíká òfin hàn. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ìkéde Pilatu di ìdájọ́ ìwà pípé tí ó kọjá àwọn ẹ̀sùn tó wà níwájú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì, ó rọrùn fún òǹkàwé òde òní, ó sì pa àyíká ilé-ẹjọ́ àti ọ̀rọ̀ tààrà Pilatu mọ́.
