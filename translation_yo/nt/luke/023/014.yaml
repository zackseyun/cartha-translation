  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì mọ́: ìfihàn Pilatu, ẹ̀sùn pé ọkùnrin náà ń mú àwọn ènìyàn ṣìnà, ìwádìí níwájú wọn, àti àyíká ilé-ẹjọ́. Síbẹ̀, “n kò rí ohun kan tí ọkùnrin yìí jẹ̀bi nínú àwọn ohun” kò ṣe kedere ní Yorùbá, kò sì mú αἴτιον, ìyẹn ìdí/ìpìlẹ̀ ẹ̀sùn, hàn dáadáa. Bákan náà, “Ẹ mú ... wá” lè hàn bí àṣẹ lọwọlọwọ ju ìrántí ohun tí wọ́n ti ṣe lọ.'
  naturalness: A nílò àmì àsìkò “ti” nínú “Ẹ ti mú ... wá.” “Ẹ kíyèsi” jẹ́ ọ̀nà Yorùbá tó dáa láti gbé agbára ἰδού (“ẹ wò ó/wo nísinsìnyí”) jáde láìsọ pé kí wọ́n wo Jesu ní ti gidi. “Mi ò rí ìdí ẹ̀sùn kankan ...” jẹ́ gbólóhùn tó rọrùn, tó sì bá ọ̀rọ̀ òfin mu.
  terminology: “Fẹ̀sùn kàn án,” “ṣe ìwádìí,” àti “ìdí ẹ̀sùn” jẹ́ ọ̀rọ̀ Yorùbá boṣewa tí ó pa ìforúkọsílẹ̀ ilé-ẹjọ́ mọ́. Àkọsílẹ̀ a tún yẹ kí ó sọ “yí ... kúrò ní ọ̀nà” dípò “yí ... padà,” nítorí èyí lè dà bí ìyípadà lasan, kì í ṣe yíyí ènìyàn kúrò.
