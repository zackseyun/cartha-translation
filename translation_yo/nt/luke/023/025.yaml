revisions:
- from: Nítorí náà, ó dá ọkùnrin náà sílẹ̀, ẹni tí a ti jù sínú ẹ̀wọ̀n nítorí ìṣọ̀tẹ̀ àti ìpànìyàn[a], ẹni tí wọ́n ń béèrè fún[b]; ṣùgbọ́n ó fi Jésù lé ìfẹ́ wọn lọ́wọ́.
  to: Ó sì dá ọkùnrin náà sílẹ̀, ẹni tí a ti jù sínú ẹ̀wọ̀n nítorí ìṣọ̀tẹ̀ àti ìpànìyàn[a], ẹni tí wọ́n ń béèrè fún[b]; ṣùgbọ́n ó fi Jésù lé wọn lọ́wọ́ gẹ́gẹ́ bí ìfẹ́ wọn.
  rationale: A rọ́pò asopọ̀ ìdí-nítorí tí kò wà nínú δέ pẹ̀lú ‘Ó sì.’ A tún ṣàtúnṣe gbolohun nípa fífi Jésù lé ‘wọn’ lọ́wọ́, lẹ́yìn náà a sì ṣàlàyé pé ìfẹ́ wọn ni ìwọ̀n ìṣe náà. Èyí pa ìtumọ̀ ìfọwọ́sowọ́pọ̀/ìfìjìlẹ̀ ti παρέδωκεν àti θέλημα αὐτῶν mọ́, ó sì jẹ́ Yorùbá rọrùn.
