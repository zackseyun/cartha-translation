  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: yo
  text: Ó sì dá ọkùnrin náà sílẹ̀, ẹni tí a ti jù sínú ẹ̀wọ̀n nítorí ìṣọ̀tẹ̀ àti ìpànìyàn[a], ẹni tí wọ́n ń béèrè fún[b]; ṣùgbọ́n ó fi Jésù lé wọn lọ́wọ́ gẹ́gẹ́ bí ìfẹ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti fi sínú ẹ̀wọ̀n.” Ọ̀rọ̀ Gíríìkì náà túbọ̀ ní àwòrán alágbára pé “a ti jù sínú ẹ̀wọ̀n.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí wọ́n fẹ́ kí a dá sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: ó dá ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún dídá ẹlẹ́wọ̀n sílẹ̀, ó sì bá àyíká ìdájọ́ mu.
- source_word: διὰ στάσιν καὶ φόνον
  choice: nítorí ìṣọ̀tẹ̀ àti ìpànìyàn
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ohun tó fa ìfìwọ̀n; ìṣọ̀tẹ̀ fi ìtumọ̀ στάσις gẹ́gẹ́ bí ìdìtẹ̀ tàbí ìrúkèrúdò sí ìjọba hàn, kì í ṣe àríyànjiyàn lásán.
- source_word: βεβλημένον εἰς φυλακήν
  choice: a ti jù sínú ẹ̀wọ̀n
  rationale: ‘Jù sínú’ pa àwòrán alágbára ti βάλλω mọ́, nígbà tí ‘a ti’ fi ipò tí ìṣe tó ti ṣẹ̀ dá sílẹ̀ hàn.
- source_word: ὃν ᾐτοῦντο
  choice: ẹni tí wọ́n ń béèrè fún
  rationale: ‘Ń béèrè fún’ ṣe àfihàn imperfect ᾐτοῦντο gẹ́gẹ́ bí ìbéèrè tó ń lọ lọ́wọ́, láì mú un le ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ.
- source_word: παρέδωκεν
  choice: ó fi ... lé ... lọ́wọ́
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún fífi ẹnì kan lé ẹlòmíràn lọ́wọ́, ó sì pa ìtumọ̀ ìyípadà àṣẹ tàbí ìṣàkóso mọ́.
- source_word: τῷ θελήματι αὐτῶν
  choice: lé ìfẹ́ wọn lọ́wọ́
  rationale: ‘Ìfẹ́ wọn’ pa ìtumọ̀ θέλημα gẹ́gẹ́ bí ohun tí wọ́n fẹ́ kí ó ṣẹlẹ̀ mọ́; àkópọ̀ gbólóhùn náà jẹ́ ti Yorùbá àdánidá.
- source_word: δὲ ... δὲ
  choice: Nítorí náà ... ṣùgbọ́n
  rationale: Àkọ́kọ́ ń tẹ ìtàn síwájú, èkejì sì fi ìyàtọ̀ tó wà láàárín ọkùnrin náà àti Jésù hàn kedere.
theological_decisions:
- issue: Bí a ṣe máa fi ìyàtọ̀ láàárín ẹni ìṣọ̀tẹ̀ tí a dá sílẹ̀ àti Jésù hàn láì fi ẹ̀kọ́ ìràpadà kún ọ̀rọ̀ náà
  choice: A fi ìyàtọ̀ inú ìtàn hàn kedere, ṣùgbọ́n a kò fi ọ̀rọ̀ bí ‘ní ipò Jésù’ kún un.
  alternative: Ṣíṣe àlàyé sí i pé a dá ọkùnrin náà sílẹ̀ ‘ní ipò Jésù.’
  rationale: Ẹsẹ̀ náà sọ ohun tí Pílátù ṣe àti bí ó ṣe tẹ̀ lé ìfẹ́ àwọn ènìyàn; kò sọ ẹ̀kọ́ pàṣípààrọ̀ ní tààrà, nítorí náà a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A yan ‘ẹ̀wọ̀n,’ ‘ìṣọ̀tẹ̀,’ àti ‘ìpànìyàn’ gẹ́gẹ́ bí ọ̀rọ̀ tó mọ́gbọ́n dání nínú àyíká òfin àti ìtàn.
