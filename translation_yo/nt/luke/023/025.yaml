  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì ní pàtàkì: ó fi ìdí ìfìmọ́nilẹ́ ọkùnrin náà hàn (‘nítorí ìṣọ̀tẹ̀ àti ìpànìyàn’), ó pa agbára βεβλημένον mọ́ (‘a ti jù sínú ẹ̀wọ̀n’), ó sì ṣàfihàn ìṣe tí ń lọ nínú ᾐτοῦντο (‘wọ́n ń béèrè fún’). Ṣùgbọ́n ‘Nítorí náà’ túmọ̀ δέ bí ìpẹ̀yà ìdí-nítorí, èyí tí kò hàn gbangba nínú ọ̀rọ̀ Gíríìkì. Bákan náà, ‘ó fi Jésù lé ìfẹ́ wọn lọ́wọ́’ kì í ṣe àkópọ̀ ọ̀rọ̀ Yorùbá tó rọrùn jù fún παρέδωκεν τῷ θελήματι αὐτῶν.'
  naturalness: ‘Ó sì dá ... sílẹ̀’ jẹ́ ìtẹ̀síwájú ìtàn tó dára fún δέ. ‘Ó sì fi Jésù lé wọn lọ́wọ́ gẹ́gẹ́ bí ìfẹ́ wọn’ jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ pé Pílátù fi Jésù sí ìkáwọ́ wọn ní ìbámu pẹ̀lú ohun tí wọ́n fẹ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
  terminology: ‘Ìṣọ̀tẹ̀,’ ‘ìpànìyàn,’ ‘ẹ̀wọ̀n,’ àti ‘dá ... sílẹ̀’ yẹ fún àyíká òfin àti ìṣàkóso. ‘Ìfẹ́ wọn’ dáa fún θέλημα níbí; àtúnṣe kan ṣoṣo ni láti gbé e sínú àkópọ̀ gbolohun tó mọ́ Yorùbá.
