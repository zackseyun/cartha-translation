  - severity: medium
    issue: ‘ó fi Jésù lé ìfẹ́ wọn lọ́wọ́’
    rationale: Ìṣètò náà kò rọrùn nínú Yorùbá, nítorí ẹni ni a sábà máa ń ‘fi lé ẹni lọ́wọ́,’ kì í ṣe ‘lé ìfẹ́ lọ́wọ́.’ ‘Ó fi Jésù lé wọn lọ́wọ́ gẹ́gẹ́ bí ìfẹ́ wọn’ jẹ́ àdánidá, ó sì dúró ṣinṣin pẹ̀lú τῷ θελήματι αὐτῶν.
