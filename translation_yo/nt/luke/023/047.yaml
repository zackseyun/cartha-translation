id: LUK.23.47
reference: Luke 23:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: yo
  text: Nígbà tí balógun ọ̀rún náà rí ohun tí ó ṣẹlẹ̀, ó yin Ọlọ́run lógo, ó ní, “Dájúdájú, olódodo[a] ni ọkùnrin yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aláìlẹ́bi” tàbí “ẹni tí kò jẹ̀bi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tó ní ìwà òdodo tàbí ẹni tí kò jẹ̀bi níwájú òfin, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nígbà tí ... rí
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; gbólóhùn yìí jẹ́ Yorùbá àdánidá tí ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ìṣe pàtàkì.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Asopọ̀ ìtàn kékeré ni δέ; ìṣàn gbólóhùn Yorùbá ti fi hàn láìfi ‘ṣùgbọ́n’ tàbí ọ̀rọ̀ míì kun un tí yóò mú ìtakora tí kò sí wá.
- source_word: ἑκατοντάρχης
  choice: balógun ọ̀rún
  rationale: Ó sọ ipò olórí ọmọ-ogun Róòmù tí ó ń ṣe àkóso ẹgbẹ́ ọmọ-ogun tó tó ọgọ́rùn-ún; ó péye ju ‘ọ̀gá ọmọ-ogun’ lọ.
- source_word: τὸ γενόμενον
  choice: ohun tí ó ṣẹlẹ̀
  rationale: Ó tọ́ka sí ìṣẹ̀lẹ̀ tí balógun náà ṣẹ̀ṣẹ̀ rí, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: ó fi ògo fún Ọlọ́run
  rationale: Ó pa èrò δοξάζω mọ́ ní ọ̀nà Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì jẹ́ imperfect, àyíká ọ̀rọ̀ kò béèrè pé kí a fi ‘bẹ̀rẹ̀ sí’ tàbí ‘ń’ kún un dandan.
- source_word: λέγων
  choice: ó ní
  rationale: Ọ̀nà Yorùbá àdánidá ni láti ṣàgbékalẹ̀ ohun tí ẹni náà sọ, dípò ìtumọ̀ líle bí ‘ní sísọ pé.’
- source_word: Ὄντως
  choice: Dájúdájú
  rationale: Ó fi ìmúdájú líle tí adverb Gíríìkì náà ní hàn ní Yorùbá òde òní.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ọkùnrin yìí
  rationale: ἄνθρωπος tọ́ka sí Jésù gẹ́gẹ́ bí ọkùnrin kan níbí.
- source_word: δίκαιος
  choice: olódodo
  rationale: Ó pa ìtumọ̀ ìwà rere àti ìwọ̀n òdodo ọ̀rọ̀ Gíríìkì náà mọ́; ìtumọ̀ ‘aláìlẹ́bi’ tó bá àyíká ẹjọ́ mu wà nínú àlàyé ìsàlẹ̀.
- source_word: ἦν
  choice: ni ... yìí
  rationale: Gbólóhùn aláìṣe Yorùbá yìí sọ ìdánimọ̀/àpèjúwe náà ní ọ̀nà àdánidá; ìtọ́kasí sí ẹni tí ó ti kú nínú àyíká náà ń pa ìtọ́ka àkókò Gíríìkì mọ́ láìfi ‘jẹ́’ tí kò rọrùn sí i.
theological_decisions:
- issue: Ìtumọ̀ δίκαιος nínú ọ̀rọ̀ balógun náà
  choice: olódodo
  alternative: aláìlẹ́bi; ẹni tí ó ṣe déédé
  rationale: ‘Olódodo’ pa agbára ìwà rere àti ti ẹ̀kọ́ nípa Ọlọ́run mọ́ láìsọ ọ̀rọ̀ balógun náà di ìjẹ́wọ́ Kristoloji tí ó ju ohun tí Lúùkù kọ lọ. Nítorí àyíká ìdájọ́ àti ikú Jésù, ‘aláìlẹ́bi’ tún ṣeé ṣe; àlàyé ìsàlẹ̀ pa àìdánilójú gidi yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. ‘Balógun ọ̀rún’ pa ipò ọmọ-ogun Róòmù mọ́, ‘fi ògo fún Ọlọ́run’ sì jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá.
