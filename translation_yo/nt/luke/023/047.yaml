  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: gbólóhùn àkókò náà, balógun ọ̀rún, ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀, ìyin Ọlọ́run, àti ìdánilójú pé Jésù jẹ́ δίκαιος wà níbẹ̀. Síbẹ̀, ‘yin Ọlọ́run lógo’ jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání ju ‘fi ògo fún Ọlọ́run’ lọ fún ἐδόξαζεν nínú àyíká yìí.'
