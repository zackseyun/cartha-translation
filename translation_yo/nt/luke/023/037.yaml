source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: yo
  text: wọ́n sì ń sọ pé, “Bí ìwọ bá jẹ́ Ọba àwọn Júù[a], gba ara rẹ là.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì Ἰουδαίων lè túmọ̀ sí àwọn Júù tàbí àwọn ará Jùdíà, ó sinmi lórí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: wọ́n sì ń sọ pé
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìṣe inú ẹsẹ tó ṣáájú, ó sì pa ipa participle mọ́ lọ́nà Yorùbá àdánidá láì fi ‘ẹ̀gàn’ kún ọ̀rọ̀-ìṣe náà.
- source_word: Εἰ σὺ εἶ
  choice: Bí ìwọ bá jẹ́
  rationale: ‘Bí ... bá’ fi ìpèníjà oníhàméjì hàn, nígbà tí ‘ìwọ’ ń pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ὁ βασιλεὺς
  choice: Ọba
  rationale: ‘Ọba’ ni ìtumọ̀ àdánidá fún akọ́lé ọba pàtó yìí; Yorùbá kò nílò article ọ̀tọ̀ níbí.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú àyíká ìjìyà náà, gbólóhùn yìí jẹ́ akọ́lé ìṣèlú àti ti Mèsáyà tí wọ́n fi ń fẹ̀sùn kan Jésù, tí wọ́n sì fi ń ṣẹ̀sín; ‘àwọn Júù’ ni ọ̀nà Yorùbá tí ó wọ́pọ̀ jù, ṣùgbọ́n àṣàyàn agbègbè ‘àwọn ará Jùdíà’ wà nínú àlàyé ìsàlẹ̀.
- source_word: σῶσον σεαυτόν
  choice: gba ara rẹ là
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún àṣẹ láti gba ara ẹni là, ó sì pa ìtumọ̀ σῴζω mọ́.
theological_decisions:
- issue: Ìtumọ̀ akọ́lé βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  alternative: Ọba àwọn ará Jùdíà
  rationale: Àṣàyàn àkọ́kọ́ bá akọ́lé tí a fi ń fẹ̀sùn kan Jésù àti ìṣẹ̀sín ní àyíká agbelebu mu, láì dín irony ìjọba rẹ̀ kù; àlàyé ìsàlẹ̀ pa ìtumọ̀ agbègbè tàbí ẹ̀yà tí Ἰουδαῖος tún lè ní mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo ‘wọ́n’ nítorí subject ọ̀pọ̀ wà nínú ẹsẹ tó ṣáájú.
