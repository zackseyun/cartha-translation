id: LUK.23.35
reference: Luke 23:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: yo
  text: Àwọn ènìyàn náà dúró, wọ́n sì ń wò ó. Ṣùgbọ́n àwọn olórí pàápàá ń fi í ṣe ẹlẹ́yà, wọ́n ń sọ pé, “Ó gba àwọn ẹlòmíràn là; kí ó gba ara rẹ̀ là, bí ẹni yìí bá jẹ́ Mèsáyà Ọlọ́run, ẹni tí a yàn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Ọlọ́run, Ẹni Tí a Yàn.”
    reason: Ó pèsè ọ̀nà mìíràn láti túmọ̀ àwọn oyè ὁ χριστὸς τοῦ θεοῦ àti ὁ ἐκλεκτός, láìyí ìtumọ̀ pàtàkì wọn padà.
lexical_decisions:
- source_word: εἱστήκει
  choice: dúró
  rationale: Ọ̀rọ̀-ìṣe náà ń ṣàpèjúwe bí àwọn ènìyàn ṣe wà níbẹ̀ ní ìdúró; “dúró” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti gbé ìṣẹ̀lẹ̀ náà kalẹ̀.
- source_word: θεωρῶν
  choice: ń wò ó
  rationale: Àpólà náà fi hàn pé wọ́n ń bá a lọ ní wíwo ohun tó ń ṣẹlẹ̀; àmì “ń” pa ìtẹ̀síwájú iṣẹ́ náà mọ́.
- source_word: ἐξεμυκτήριζον
  choice: ń fi í ṣe ẹlẹ́yà
  rationale: Èyí túmọ̀ sí ẹ̀gàn tàbí ìfi ẹni ṣe ẹlẹ́yà pẹ̀lú ìkórìíra; àrọ́pò-orúkọ “í” tọ́ka sí Jésù gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἄρχοντες
  choice: àwọn olórí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tó ní àṣẹ; “àwọn olórí” jẹ́ èdè Yorùbá tó mọ́gbọ́n dání, tí kò sì fi irú àṣẹ wọn kun ohun tí ẹsẹ náà sọ.
- source_word: Ἄλλους ἔσωσεν
  choice: Ó gba àwọn ẹlòmíràn là
  rationale: “Gba … là” jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìgbàlà tàbí ìdálà; ó sì jẹ́ kí àtúnlò ọ̀rọ̀ σῴζω hàn nínú gbolóhùn tó tẹ̀ lé e.
- source_word: σωσάτω ἑαυτόν
  choice: kí ó gba ara rẹ̀ là
  rationale: Ìtumọ̀ yìí pa agbára àṣẹ ẹlẹ́gàn náà mọ́, ó sì tún “gba … là” lò bíi ti gbólóhùn àkọ́kọ́.
- source_word: εἰ οὗτός ἐστιν
  choice: bí ẹni yìí bá jẹ́
  rationale: “Ẹni yìí” pa agbára ọ̀rọ̀ atọ́ka οὗτός mọ́, títí kan ìró ẹ̀gàn tó lè ní nínú àyíká yìí.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Mèsáyà Ọlọ́run
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” pa ìtumọ̀ oyè ẹni àmì-òróró náà mọ́. Ìsopọ̀ Ọlọ́run ni a ṣe ní ọ̀nà ìní tó bá èdè Yorùbá mu.
- source_word: ὁ ἐκλεκτός
  choice: Ẹni Àyànfẹ́ náà
  rationale: Àpólà náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; lílo lẹ́tà ńlá àti “náà” ń fi agbára oyè pàtó náà hàn láìfi ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí Χριστός jẹ́ oyè kedere, kì í ṣe apá kan orúkọ; “Mèsáyà” mú ìtumọ̀ ẹni àmì-òróró náà jáde ní kedere.
- issue: Agbára ὁ ἐκλεκτός
  choice: Ẹni Àyànfẹ́ náà
  alternative: Ẹni tí a yàn náà
  rationale: Ọ̀rọ̀ náà jẹ́ oyè níbí. “Ẹni Àyànfẹ́ náà” jẹ́ èdè tó ṣe déédéé, ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láìṣàlàyé oyè náà kọjá ohun tí orísun sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìró ẹ̀gàn àwọn olórí àti ìtẹ̀síwájú ìṣe inú ìṣẹ̀lẹ̀ náà mọ́.
