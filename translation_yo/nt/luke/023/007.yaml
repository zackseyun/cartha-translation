id: LUK.23.7
reference: Luke 23:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: yo
  text: Nígbà tí ó sì mọ̀ pé Jesu wà lábẹ́ ìṣàkóso Hẹ́rọ́dù[a], ó rán an sí Hẹ́rọ́dù, tí óun náà sì wà ní Jerusalẹmu ní àwọn ọjọ́ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wà lábẹ́ àṣẹ Hẹ́rọ́dù.” Gbólóhùn Gíríìkì náà ń tọ́ka sí agbègbè tí Hẹ́rọ́dù ń ṣàkóso tàbí sí ẹ̀tọ́ òfin rẹ̀ láti gbọ́ ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Nígbà tí ó sì mọ̀
  rationale: Ọ̀rọ̀ arọ́pò-ìṣe aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó fi ìbátan àkókò náà hàn.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Jesu wà lábẹ́ àṣẹ ìṣàkóso Hẹ́rọ́dù
  rationale: Àkópọ̀ ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí agbègbè tàbí ẹ̀tọ́ ìṣàkóso Hẹ́rọ́dù nínú ọ̀ràn ìdájọ́. Fífi ‘Jesu’ sípò arọ́pò-orúkọ mú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere ní Yorùbá láì yí ìtumọ̀ padà.
- source_word: ἀνέπεμψεν
  choice: ó rán an
  rationale: Nínú ọ̀rọ̀ ìdájọ́, ọ̀rọ̀ náà lè túmọ̀ sí fífi ẹni tàbí ẹjọ́ rẹ̀ ránṣẹ́ sí aláṣẹ mìíràn; ‘ó rán an’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: πρὸς Ἡρῴδην
  choice: sí Hẹ́rọ́dù
  rationale: πρός pẹ̀lú accusative ń fi ìlọsí ẹni kan hàn; ‘sí Hẹ́rọ́dù’ ni ìtumọ̀ àdánidá.
- source_word: ὄντα καὶ αὐτὸν
  choice: ẹni tí òun náà wà
  rationale: Èyí so gbólóhùn náà mọ́ Hẹ́rọ́dù, ó sì pa ìtẹnumọ́ καὶ αὐτόν mọ́ pé Hẹ́rọ́dù náà wà níbẹ̀.
- source_word: ἐν Ἱεροσολύμοις
  choice: ní Jerusalẹmu
  rationale: Èyí ni orúkọ ìlú náà ní Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ náà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘ní àwọn ọjọ́ wọ̀nyí,’ ‘ní àwọn ọjọ́ náà’ bá ìwòye oníròyìn àti ìlò Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ ìṣèlú àti ti òfin fún ἐξουσία nípa Hẹ́rọ́dù
  choice: àṣẹ ìṣàkóso
  alternative: àṣẹ; agbègbè ìṣàkóso
  rationale: Ní àyíká yìí, ἐξουσία jẹ́ ẹ̀tọ́ ìṣàkóso tàbí agbára òfin Hẹ́rọ́dù lórí agbègbè tí Jesu ti wá, kì í ṣe agbára ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo ‘àṣẹ ìṣàkóso’ láti mú àyíká òfin àti ìṣèlú hàn, a sì pa ìtẹnumọ́ pé Hẹ́rọ́dù náà wà ní Jerusalẹmu mọ́.
