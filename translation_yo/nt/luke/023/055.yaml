language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: yo
  text: 'Àwọn obìnrin tí wọ́n ti bá a wá láti Galili náà sì tẹ̀ lé lọ, wọ́n rí ibojì náà àti bí a ṣe gbé ara rẹ̀ sínú ibojì náà.[a]


    [a] Tàbí, “tí wọ́n ti bá a rìnrìn àjò láti Galili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n ti bá a rìnrìn àjò láti Galili.”
    reason: 'Ó fi ìtumọ̀ mìíràn ti συνεληλυθυῖαι ... αὐτῷ hàn: àwọn obìnrin náà ti bá a lọ ní ìrìn-àjò láti Galili.'
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: tẹ̀ lé lọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó fi ìṣe tó ṣáájú rírí ibojì hàn. “Tẹ̀ lé lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n tọ̀ lẹ́yìn, láìfi ẹni tí wọ́n tẹ̀ lé kún un nígbà tí Gíríìkì kò sọ ẹni náà ní tààràtà.
- source_word: δέ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀; “sì” ń bá ìtàn lọ ní Yorùbá láìfi ìtumọ̀ ‘nísinsìnyí’ tí kò sí nínú orísun kún un.
- source_word: αἱ γυναῖκες
  choice: Àwọn obìnrin
  rationale: Àpilẹ̀kọ Gíríìkì tọ́ka sí ẹgbẹ́ àwọn obìnrin tí a ti mọ̀ nínú ìtàn.
- source_word: αἵτινες
  choice: tí wọ́n
  rationale: Ó dá àwọn obìnrin náà mọ̀ sí i; “tí wọ́n” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: tí wọ́n ti bá a wá láti Galili
  rationale: 'Ìṣètò ọ̀rọ̀ náà tọ́ka sí ìṣe tí ó ti ṣẹlẹ̀ tẹ́lẹ̀: wọ́n ti wá pẹ̀lú rẹ̀ láti Galili. “Bá a wá” pa ìtumọ̀ ìbákẹ́gbẹ́ àti ibi tí wọ́n ti wá mọ́.'
- source_word: ἐθεάσαντο
  choice: wọ́n rí
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ wíwo pẹ̀lú àkíyèsí, ṣùgbọ́n “rí” jẹ́ èdè Yorùbá tó wọ́pọ̀, ohun tí wọ́n rí lẹ́yìn rẹ̀ sì mú ìtumọ̀ náà ṣe kedere.
- source_word: τὸ μνημεῖον
  choice: ibojì náà
  rationale: Nínú ọ̀rọ̀ ìsìnkú yìí, “ibojì” ni ọ̀rọ̀ Yorùbá tó péye jù lọ; “náà” fi ẹgbẹ́ àpilẹ̀kọ pàtó inú Gíríìkì hàn.
- source_word: ὡς
  choice: bí
  rationale: Níhìn-ín ὡς ń ṣàlàyé ọ̀nà tí a gbà tẹ́ ara náà sí; “bí” ni ìbámu Yorùbá àdánidá.
- source_word: ἐτέθη
  choice: a ṣe tẹ́ ... síbẹ̀
  rationale: Fọ́ọ̀mù passive náà di ìṣe aláìsọ ẹni tó ṣe é ní Yorùbá nípasẹ̀ “a”; “tẹ́ ... síbẹ̀” bá ipò ìsìnkú mu, ó sì ní iyì.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ara rẹ̀
  rationale: “Ara rẹ̀” túmọ̀ σῶμα αὐτοῦ ní tààràtà, láìrọ́pò ‘ara’ pẹ̀lú ‘òkú,’ èyí tí yóò fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìtẹ̀lé ìṣe participle κατακολουθήσασαι àti ọ̀rọ̀-ìṣe pàtàkì ἐθεάσαντο
  choice: 'A sọ ọ́ gẹ́gẹ́ bí ìṣe méjì tó tẹ̀ lé ara wọn: “tẹ̀ lé lọ; wọ́n rí”'
  alternative: “Lẹ́yìn tí wọ́n tẹ̀ lé ... wọ́n rí”
  rationale: Ìpinnu ìṣètò èdè ni, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa bí ìṣẹ̀lẹ̀ náà ṣe tẹ̀ lé ara rẹ̀ mọ́.
- issue: Ẹni tí àwọn obìnrin tẹ̀ lé
  choice: 'A kò sọ ẹni náà ní tààràtà: “tẹ̀ lé lọ”'
  alternative: “tẹ̀ lé e lọ” tàbí “tẹ̀ lé Jósẹ́fù lọ”
  rationale: Gíríìkì kò ní object tí ó sọ ẹni tí wọ́n tẹ̀ lé ní gbangba. Kí a má bàa yanjú ohun tí ọ̀rọ̀ orísun fi sílẹ̀ fún àyíká ìtàn, a kò fi orúkọ tàbí arọ́pò-orúkọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó jẹ́ èdè ìtàn tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn, a sì yẹra fún fífi “nísinsìnyí” kún δέ.
