  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí mo bá ti fi ìyà kàn án[a], èmi yóò dá a sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí mo bá ti fún un ní ìbáwí” tàbí “lẹ́yìn tí mo bá ti jẹ ẹ́ níyà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbáwí tàbí ìjìyà tí a ń ṣe fún àtúnṣe. Àwọn kan lóye ìjìyà náà níbí gẹ́gẹ́ bí lílù ní pàṣán, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ìtumọ̀ tó gbòòrò ju bẹ́ẹ̀ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: lẹ́yìn tí mo bá fi ìyà jẹ ẹ́
  rationale: Aorist participle náà ní agbára ìgbà níbí, ó sì tọ́ka sí ìgbésẹ̀ ìjìyà nínú ọ̀ràn ìdájọ́. ‘Fi ìyà jẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sọ ọ̀nà ìjìyà kan pàtó bí lílù ní pàṣán.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára ìparí tàbí ìyọrísí ọ̀rọ̀ Pilatu mọ́, dípò kí a mú un kàn jẹ́ àmì ìtẹ̀síwájú.
- source_word: αὐτόν
  choice: ẹ́ / a
  rationale: Àrọ́pò-orúkọ náà tọ́ka sí Jésù; ‘ẹ́’ tẹ̀ lé ‘jẹ’, ‘a’ sì tẹ̀ lé ‘dá ... sílẹ̀’ gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
- source_word: ἀπολύσω
  choice: èmi yóò dá a sílẹ̀
  rationale: Nínú àyíká òfin àti àtìmọ́lé, ‘dá a sílẹ̀’ túmọ̀ sí yíyọ ẹni kúrò ní àhámọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ παιδεύω nínú àbá Pilatu
  choice: fi ìyà jẹ, ní ìtumọ̀ ìjìyà ti ilé-ẹjọ́
  alternative: kọ́ ní ẹ̀kọ́ ìbáwí; bá wí; nà ní pàṣán
  rationale: Àyíká ìdájọ́ fi hàn pé ìjìyà ni a ní lọ́kàn, kì í ṣe ẹ̀kọ́ lasan. Síbẹ̀, Gíríìkì kò sọ pàtó pé lílù ní pàṣán ni, nítorí náà a kò fi ìtumọ̀ tóóró yẹn sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà ní ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. Fífi ‘èmi’ hàn ń pa ìtẹnumọ́ ẹni àkọ́kọ́ inú ἀπολύσω mọ́ ní ọ̀nà àdánidá.
