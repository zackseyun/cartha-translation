  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: yo
  text: Nígbà tí wọ́n dé ibi tí a ń pè ní Agbárí[a], níbẹ̀ ni wọ́n kàn án mọ́ àgbélébùú, pẹ̀lú àwọn ọ̀daràn náà, ọ̀kan ní apá ọ̀tún, èkejì sì ní apá òsì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi tí a ń pè ní Agbárí náà.” Ọ̀rọ̀ Gíríìkì Κρανίον túmọ̀ ní tààrà sí “agbárí.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ọ̀kan láti ọ̀tún, ọ̀kan sì láti òsì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Aorist ἔρχομαι nínú ìtàn yìí ń tọ́ka sí dídé wọn sí ibi náà; “wọ́n dé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní ọ̀rọ̀-ọ̀rọ̀ gẹ́gẹ́ bí “wọ́n wá” lọ.
- source_word: ἐπὶ τὸν τόπον
  choice: ibi
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìṣípò ἦλθον, gbólóhùn náà túmọ̀ sí dídé ibi kan; “wọ́n dé ibi” mú ìdarí náà jáde ní Yorùbá àdánidá.
- source_word: τὸν καλούμενον Κρανίον
  choice: tí a ń pè ní Agbárí
  rationale: Κρανίον túmọ̀ ní tààrà sí agbárí. Títúmọ̀ orúkọ ibi náà pa ìtumọ̀ Gíríìkì mọ́ láì fi irú orúkọ àṣà míì kún un.
- source_word: ἐσταύρωσαν
  choice: wọ́n kàn án mọ́ àgbélébùú
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì péye fún σταυρόω; kò fi àlàyé nípa èékánná kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: κακούργους
  choice: àwọn ọ̀daràn
  rationale: κακοῦργος ń tọ́ka sí àwọn tó hu ìwà ọ̀daràn. “Àwọn ọ̀daràn” jẹ́ ọ̀rọ̀ òde òní, ó sì yẹra fún ṣíṣe ọ̀rọ̀ Lúùkù ní “àwọn olè” tàbí “àwọn ọlọ̀tẹ̀.”
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: ọ̀kan ní apá ọ̀tún, èkejì sì ní apá òsì
  rationale: Ìkọ́lé náà pín àwọn ọ̀daràn méjèèjì sí ipò ọ̀tún àti òsì. A kò fi “rẹ̀” kún un nítorí pé bí ó tilẹ̀ jẹ́ pé àyíká mú un yé, kò fara hàn gbangba nínú Gíríìkì.
theological_decisions:
- issue: Títúmọ̀ Κρανίον
  choice: Agbárí
  alternative: ibi tí a ń pè ní Agbárí náà; tàbí Kranion
  rationale: Orúkọ ibi yìí wá láti orúkọ ohun kan tí ìtumọ̀ rẹ̀ ṣe pàtàkì. “Agbárí” pa ìtumọ̀ orísun mọ́, kò sì fa orúkọ ìbílẹ̀ tí ó wá láti àwọn ẹsẹ míì wọ inú ẹsẹ yìí.
- issue: Àpèjúwe àwọn ọkùnrin méjì tí a kàn mọ́ àgbélébùú pẹ̀lú Jésù
  choice: àwọn ọ̀daràn
  alternative: àwọn aṣebi; àwọn olè
  rationale: Ọ̀rọ̀ Lúùkù, κακοῦργοι, gbòòrò ju “àwọn olè” lọ. “Àwọn ọ̀daràn” kò fi ẹ̀sùn pàtó tí Gíríìkì kò sọ kún un, kò sì mú Lúùkù bá ọ̀rọ̀ inú àwọn Ìhìn Rere mìíràn mu láìnídìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “kàn án mọ́ àgbélébùú” gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìkànmọ́ àgbélébùú, a sì pa àìsọ ẹni tí ọ̀tún àti òsì jẹ́ tirẹ̀ mọ́ gẹ́gẹ́ bí Gíríìkì.
