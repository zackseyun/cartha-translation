  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: yo
  text: Nígbà tí oòrùn ṣókùnkùn[a], aṣọ ìkélé inú tẹ́ńpìlì náà sì ya ní àárín[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘nígbà tí ìmọ́lẹ̀ oòrùn kú.’ Àwọn kan túmọ̀ ọ́ ní pàtó sí, ‘òṣùpá bo oòrùn,’ ṣùgbọ́n ìtumọ̀ yẹn sọ ohun tó ju ohun tí èdè Gíríìkì fúnra rẹ̀ béèrè lọ.
    reason: alternative_reading
  - marker: c
    text: Tàbí, ‘ya láti àárín’ tàbí ‘ya sí méjì.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: òòrùn sì ṣókùnkùn
  rationale: Ọ̀rọ̀-ìṣe ἐκλείπω lè túmọ̀ sí pé ohun kan kùnà, dáwọ́ dúró, tàbí ṣókùnkùn. Nínú àyíká ọ̀rọ̀ yìí, ‘òòrùn ṣókùnkùn’ jẹ́ èdè Yorùbá àdánidá tó sọ ohun tí a rí láì fi ìtumọ̀ ìmọ̀ ìràwọ̀ kan pàtó kún un.
- source_word: ἐσχίσθη
  choice: ya
  rationale: ‘Ya’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù lọ fún bí aṣọ ṣe fàya; ó tún pa ìṣe aláìlórúkọ olùṣe inú èdè Gíríìkì mọ́.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ pẹ̀lẹ́ tó bá δέ mu níbí, láì sọ ọ́ di ìtakora líle.
- source_word: τὸ καταπέτασμα
  choice: aṣọ ìkélé
  rationale: ‘Aṣọ ìkélé’ jẹ́ ọ̀rọ̀ òde òní, tó ṣe kedere fún aṣọ tí a fi ń pín ibi sí méjì; ó yẹ fún aṣọ ìkélé ibi mímọ́ náà.
- source_word: τοῦ ναοῦ
  choice: tẹ́ńpìlì náà
  rationale: ναός ń tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbàlá tẹ́ńpìlì; ṣùgbọ́n ‘tẹ́ńpìlì náà’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tí a sì mọ̀ dáadáa nínú àkópọ̀ yìí.
- source_word: μέσον
  choice: ní àárín
  rationale: ‘Ní àárín’ tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, láì fi àbájáde náà hàn ní pàtó gẹ́gẹ́ bí ‘sí méjì.’
theological_decisions:
- issue: Ìtumọ̀ ἐκλιπόντος nípa oòrùn
  choice: 'A túmọ̀ rẹ̀ láì sọ ọ́ di ọ̀rọ̀ ìmọ̀ ìràwọ̀ pàtó: ‘òòrùn sì ṣókùnkùn.’'
  alternative: ‘ìmọ́lẹ̀ oòrùn sì kú’ tàbí ‘oòrùn sì ṣe òṣùpá bo.’
  rationale: Àwọn ọ̀rọ̀ náà ṣàpèjúwe òkùnkùn tó ṣẹlẹ̀ nígbà ikú Jésù, ṣùgbọ́n èdè Gíríìkì kò fipá mú wa láti sọ pé ìṣẹ̀lẹ̀ náà jẹ́ eclipse. Yíyan ‘ṣókùnkùn’ pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́ láì fi àlàyé sáyẹ́ǹsì tí ẹsẹ náà kò sọ kún un.
- issue: Bí a ṣe túmọ̀ καταπέτασμα
  choice: A lò ‘aṣọ ìkélé’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘aṣọ ìbòjú.’
  rationale: ‘Aṣọ ìkélé’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ohun tí ọ̀rọ̀ náà ń tọ́ka sí mu, láì gbẹ́kẹ̀ lé ọ̀rọ̀ ẹ̀sìn àtijọ́ kan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lò ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ tí gbogbo ènìyàn mọ̀, a sì lò ‘aṣọ ìkélé’ dípò ọ̀rọ̀ ìjọ àtijọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ ní ti àdánidá.
