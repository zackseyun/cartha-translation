source:
  edition: SBLGNT
  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n ń tẹnumọ́ ìbéèrè wọn pẹ̀lú ohùn rara[a], wọ́n ń béèrè pé kí a kàn án mọ́ àgbélébùú; ohùn wọn sì borí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú igbe rara”; ní apá ìkẹyìn, a tún lè túmọ̀ rẹ̀ sí, “igbe wọn sì borí.” Ọ̀rọ̀ kan náà fún “ohùn” ni èdè Gíríìkì tún lò ní apá méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: wọ́n ń ... tẹnumọ́ ọn
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí fi hàn pé wọ́n ń bá a lọ láti fi agbára tẹnumọ́ ohun tí wọ́n ń béèrè, kì í ṣe pé wọ́n sọ ọ́ lẹ́ẹ̀kan ṣoṣo.
- source_word: φωναῖς μεγάλαις
  choice: pẹ̀lú ohùn rara
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń fi ohùn líle àti gíga tẹnumọ́ ohun tí wọ́n fẹ́, láìfi pàtó sọ pé irú igbe kan ni.
- source_word: αἰτούμενοι
  choice: wọ́n ń béèrè
  rationale: ‘Béèrè’ pa ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì mọ́; ‘tẹnumọ́’ àti ‘ohùn rara’ ti fi ipá inú àyíká náà hàn láìyí ọ̀rọ̀ náà sí ‘béèrè lórí dandan.’
- source_word: αὐτὸν σταυρωθῆναι
  choice: pé kí a kàn án mọ́ àgbélébùú
  rationale: 'Gbólóhùn yìí jẹ́ ti Yorùbá tó ṣe kedere, ó sì pa ìṣe àìṣe-taara inú ọ̀rọ̀ Gíríìkì mọ́: àwọn mìíràn ni yóò ṣe ìkànmọ́ àgbélébùú náà sí i.'
- source_word: κατίσχυον
  choice: borí
  rationale: ‘Borí’ fi hàn pé ohùn wọn gba ipò agbára, ó sì ń yọrí sí àbájáde tí wọ́n fẹ́ nínú ìgbẹ́jọ́ náà.
- source_word: αἱ φωναὶ αὐτῶν
  choice: ohùn wọn
  rationale: Àtúnsọ ‘ohùn’ pa ìsopọ̀ ọ̀rọ̀ φωνή méjèèjì mọ́, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá tó wọ́pọ̀, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìtẹnumọ́ tó ń bá a lọ, àtúnsọ ‘ohùn,’ àti bí igbe wọn ṣe borí mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
