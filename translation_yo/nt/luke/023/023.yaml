- from: Ṣùgbọ́n wọ́n ń fi ohùn rara[a] tẹnumọ́ ọn, wọ́n ń béèrè pé kí a kàn án mọ́ àgbélébùú; ohùn wọn sì borí.
  to: Ṣùgbọ́n wọ́n ń tẹnumọ́ ìbéèrè wọn pẹ̀lú ohùn rara[a], wọ́n ń béèrè pé kí a kàn án mọ́ àgbélébùú; ohùn wọn sì borí.
  rationale: The revision changes only the ambiguous first-clause object. “Tẹnumọ́ ìbéèrè wọn” naturally expresses the crowd’s continuing insistence and retains the durative force without unnecessarily naming Pilate or altering the request’s content. The repeated “ohùn” and the lexical-alternative footnote are retained.
