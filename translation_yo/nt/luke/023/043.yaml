  source_fidelity: 'Ìtumọ̀ náà ń fi gbogbo àwọn èròjà pàtàkì Gíríìkì hàn dáadáa: ìfìdí-múlẹ̀ Ἀμήν, ẹni tí a ń bá sọ̀rọ̀, ìlérí ọjọ́ iwájú, ‘pẹ̀lú mi,’ àti Párádísè. Ìka-kika àkọ́kọ́, tí ‘lónìí’ ń ṣàlàyé ‘ìwọ yóò wà,’ ni èyí tí ó sún mọ́ ìṣètò àti ìṣàn ọ̀rọ̀ Gíríìkì jù lọ. Àlàyé ìsàlẹ̀ ń pa ìka-kika mìíràn mọ́ láì fi ẹ̀kọ́ ìjọ kankan kún un.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ṣùgbọ́n fífi ‘ni’ lẹ́yìn ‘lónìí’ lè jẹ́ ìtẹnumọ́ àfikún tí Gíríìkì kò fi hàn gbangba. Fífi àmì ìdádúró sílẹ̀ lẹ́yìn ‘ọ’ sì mú ìlérí náà rọrùn láti ka. ‘Lóòótọ́ ni mo sọ fún ọ’ jẹ́ ọ̀nà tí ó yẹ ní ìforúkọ ọrọ̀ mímọ́.
  terminology: ‘Lóòótọ́ ni,’ ‘pẹ̀lú mi,’ àti ‘Párádísè’ bá ìtumọ̀ orísun mu, wọ́n sì bá ìforúkọ Yorùbá ti ọ̀rọ̀ mímọ́ mu. ‘Párádísè’ gẹ́gẹ́ bí orúkọ ibi jẹ́ ìlò tí ó ṣeé gbà.
