language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Lóòótọ́ ni mo sọ fún ọ pé, lónìí[a], ìwọ yóò wà pẹ̀lú mi ní Párádísè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ṣùgbọ́n kò ṣeé ṣe tó bẹ́ẹ̀: “Lóòótọ́ ni mo sọ fún ọ lónìí, ìwọ yóò wà pẹ̀lú mi ní Párádísè.” Àwọn ìwé ọwọ́ Gíríìkì àtijọ́ kò ní àwọn àmì ìdádúró òde òní; ìtumọ̀ yìí so “lónìí” mọ́ “mo sọ fún ọ” dípò “ìwọ yóò wà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Lóòótọ́ ni
  rationale: Nínú àwọn ọ̀rọ̀ Jesu, ἀμήν jẹ́ ìfìdí ọ̀rọ̀ múlẹ̀ lọ́nà ọlá àti àṣẹ. ‘Lóòótọ́ ni’ jẹ́ Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ náà mọ́.
- source_word: σοι λέγω
  choice: mo sọ fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì sún mọ́ gbólóhùn Gíríìkì náà.
- source_word: σήμερον
  choice: lónìí
  rationale: Ó ṣeé ṣe jù lọ pé ọ̀rọ̀ àsìkò yìí ń ṣàlàyé ìgbà tí ẹni náà yóò wà pẹ̀lú Jesu; síbẹ̀, àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ mìíràn tí àmì ìdádúró lè mú wá.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: Ìtumọ̀ tààrà tí ó pa ìtumọ̀ ìbáṣepọ̀ ara ẹni mọ́.
- source_word: ἔσῃ
  choice: ìwọ yóò wà
  rationale: Ọ̀nà Yorùbá àdánidá láti tú ọ̀rọ̀-ìṣe ọjọ́ iwájú εἰμί; fífi ‘ìwọ’ hàn ń tẹnumọ́ ẹni tí Jesu ń bá sọ̀rọ̀.
- source_word: παραδείσῳ
  choice: Párádísè
  rationale: ‘Párádísè’ ni ọ̀rọ̀ tí a mọ̀ sí ìtumọ̀ παράδεισος ní àyíká ọ̀rọ̀ nípa ibi ìbùkún àwọn olódodo; a lò ó gẹ́gẹ́ bí orúkọ ibi nínú Yorùbá.
theological_decisions:
- issue: Ibi tí σήμερον (‘lónìí’) bá nínú gbólóhùn tí àmì ìdádúró rẹ̀ sinmi lórí ìtumọ̀, tí ó sì kan ẹ̀kọ́ nípa ipò lẹ́yìn ikú
  choice: So ‘lónìí’ mọ́ ‘ìwọ yóò wà pẹ̀lú mi ní Párádísè’
  alternative: So ‘lónìí’ mọ́ ‘mo sọ fún ọ’
  rationale: Àwọn àfọwọ́kọ Gíríìkì ìjímìjí kò ní àmì ìdádúró òde òní. Bí gbólóhùn náà ṣe ń lọ àti lílo èdè Gíríìkì Koiné mú kí ó ṣeé ṣe jù pé ‘lónìí’ ń sọ ìgbà tí ìlérí náà yóò ṣẹ. A kò fi ìtumọ̀ kejì pamọ́, nítorí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti ọlá, ó ṣe kedere, ó sì rọrùn fún òǹkàwé òde òní. A pa àìdánilójú tí àmì ìdádúró Gíríìkì ń mú wá mọ́ nínú àlàyé ìsàlẹ̀.
