id: LUK.23.15
reference: Luke 23:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: yo
  text: Ṣùgbọ́n Hẹ́rọ́dù pàápàá kò rí i lẹ́bi, nítorí ó rán an padà sí wa. Ẹ wò ó, kò sí ohun tí ó ti ṣe tí ó yẹ fún ikú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ
  choice: Ṣùgbọ́n Hẹ́rọ́dù náà kò rí i lẹ́bi
  rationale: Àkópọ̀ ọ̀rọ̀ náà ń fi ìyàtọ̀ hàn, ó sì fi Hẹ́rọ́dù kún àwọn aláṣẹ tí kò rí ẹ̀ṣẹ̀ ikú mú Jesu. A mú gbólóhùn tí a fi sílẹ̀ nínú Gíríìkì pé ní Yorùbá kí ìtumọ̀ lè ṣe kedere.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Ìkọ̀wé orúkọ náà tẹ̀ lé bí a ṣe máa ń kọ orúkọ Herod ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἀνέπεμψεν
  choice: rán ... padà
  rationale: Nínú àyíká ìdájọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ẹni tí a ti rán wá padà sí ẹni tó kọ́kọ́ rán an.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Pílátù fi lè tọ́ka sí ìdájọ́ Hẹ́rọ́dù.
- source_word: αὐτὸν πρὸς ἡμᾶς
  choice: ó rán an padà sí wa
  rationale: πρὸς ἡμᾶς túmọ̀ sí ‘sí wa,’ ìṣe ἀναπέμπω àti àyíká ìtàn sì fi hàn pé ó jẹ́ ìpadàbọ̀ sọ́dọ̀ Pílátù.
- source_word: καὶ ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ó jẹ́ àmì ọ̀rọ̀ tí ń pe àwọn olùgbọ́ láti kíyè sí àbájáde náà; ‘Ẹ wò ó’ jẹ́ ọ̀rọ̀ Yorùbá adayeba, tó ní iyì, tí ó sì pa ìmúnilójú mọ́.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: kò ṣe ohun kan tí ó yẹ fún ikú
  rationale: Ó sọ pé kò sí ìṣe kankan tó yẹ kí a fi ìjìyà ikú dá a lẹ́bi.
- source_word: ἐστὶν πεπραγμένον
  choice: kò ṣe
  rationale: Perfect periphrastic náà tọ́ka sí ìṣe tí ó ti ṣẹlẹ̀, tí ó sì ṣe pàtàkì fún ìdájọ́ lọ́wọ́lọ́wọ́; ìtumọ̀ Yorùbá yìí sọ ọ́ ní ọ̀nà adayeba.
- source_word: αὐτῷ
  choice: ó ṣe
  rationale: 'A lóye dative náà gẹ́gẹ́ bí ẹni tó ṣe ìṣe: kò sí ohun tó yẹ fún ikú tí Jesu ṣe. Ìṣàtúnṣe sí gbólóhùn aláṣe jẹ́ Yorùbá adayeba, ó sì yàgò fún ìtumọ̀ pé a ṣe ohun náà sí i.'
theological_decisions:
- issue: Ìtumọ̀ αὐτῷ pẹ̀lú πεπραγμένον
  choice: 'Ẹni tó ṣe ìṣe: ‘kò ṣe ohun kan’'
  alternative: 'Ìtọ́kasí: ‘a kò rí ohun kan nínú rẹ̀’; tàbí ìbáṣepọ̀: ‘a kò ṣe ohun kan sí i’'
  rationale: Àyíká náà jẹ́ ìkéde Pílátù pé Jesu kò jẹ̀bi ẹ̀ṣẹ̀ tó yẹ fún ikú. Nítorí náà, ọ̀rọ̀ náà dá lórí ohun tí Jesu ṣe, kì í ṣe ohun tí a ṣe sí i.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, tí àwọn ènìyàn lásán lè lóye. A lo ‘rí i lẹ́bi’ láti mú àfojúdi gírámà Gíríìkì kún ní ọ̀nà tó bá àyíká ilé-ẹjọ́ mu, láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
