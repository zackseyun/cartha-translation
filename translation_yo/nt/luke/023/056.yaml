source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: yo
  text: Nígbà tí wọ́n padà dé[a], wọ́n pèsè àwọn èròjà olóòórùn dídùn àti òróró olóòórùn dídùn[b]. Ní ọjọ́ Ìsinmi, wọ́n sì sinmi gẹ́gẹ́ bí àṣẹ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Lẹ́yìn tí wọ́n padà dé.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé ìpadà wọn ṣáájú ìpèsè náà.
    reason: lexical_alternative
  - marker: b
    text: “Òróró olóòórùn dídùn” tún lè jẹ́ “ohun ìkunra olóòórùn dídùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Nígbà tí wọ́n padà dé
  rationale: Ọ̀rọ̀ aláṣe aorist yìí tọ́ka sí ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé àwọn obìnrin náà kọ́kọ́ padà dé.
- source_word: δὲ
  choice: sì
  rationale: Ó ń so ìtàn náà tẹ̀ síwájú lọ́nà pẹ̀lẹ́; “sì” bá ìlò Yorùbá mu láìfi ìtumọ̀ tó lágbára kún un.
- source_word: ἡτοίμασαν
  choice: wọ́n pèsè
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún mímú àwọn ohun tí a ó lò sílẹ̀.
- source_word: ἀρώματα
  choice: àwọn èròjà olóòórùn dídùn
  rationale: Nínú ọ̀rọ̀ ìsìnkú, ó ń tọ́ka sí àwọn ohun olóòórùn tí a fi ń tọ́jú tàbí fi ń kun òkú; “èròjà” yà á sọ́tọ̀ kúrò lọ́dọ̀ òróró.
- source_word: μύρα
  choice: òróró olóòórùn dídùn
  rationale: μύρον túmọ̀ sí òróró tàbí ohun ìkunra olóòórùn; yíyan “òróró” bá àyíká ìmúrasílẹ̀ fún ìsìnkú mu, ó sì yàtọ̀ sí ἀρώματα.
- source_word: τὸ μὲν σάββατον
  choice: Ní ọjọ́ Ìsinmi
  rationale: Èyí sọ ọ́ di gbólóhùn àkókò tó bá Yorùbá mu; μέν jẹ́ àmì ìyípadà pẹ̀lẹ́ tí kò nílò ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: ἡσύχασαν
  choice: wọ́n sinmi
  rationale: Nínú àyíká ọjọ́ Sábáàtì, ọ̀rọ̀ náà túmọ̀ sí dídá iṣẹ́ dúró àti sísinmi.
- source_word: κατὰ τὴν ἐντολήν
  choice: gẹ́gẹ́ bí àṣẹ náà ti wí
  rationale: Ó pa àṣẹ kan ṣoṣo náà mọ́, ó sì sọ ìbámu pẹ̀lú àṣẹ náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí “àṣẹ náà” ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “àṣẹ náà,” ní àyíká àṣẹ Mósè nípa ọjọ́ Ìsinmi.
  alternative: Àṣẹ Ọlọ́run lápapọ̀ tàbí àṣà tí wọ́n ń tẹ̀ lé.
  rationale: Àyíká náà tọ́ka sí àṣẹ Tórà nípa ìsinmi ọjọ́ Sábáàtì, ṣùgbọ́n a kò ṣàlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “ọjọ́ Ìsinmi” fún Sábáàtì ní àyíká yìí, a sì pa ìyàtọ̀ láàárín ἀρώματα àti μύρα mọ́.
