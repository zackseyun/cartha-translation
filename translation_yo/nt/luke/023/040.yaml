id: LUK.23.40
reference: Luke 23:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: yo
  text: Ṣùgbọ́n èkejì dáhùn, ó sì bá a wí pé, “Ṣé ìwọ náà kò tilẹ̀ bẹ̀rù Ọlọ́run, níwọ̀n bí o ti wà lábẹ́ ìdájọ́ kan náà[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “lábẹ́ ìdálẹ́bi kan náà” tàbí “nínú ẹjọ́ kan náà.” Ọ̀rọ̀ Gíríìkì κρίμα lè túmọ̀ sí ìdájọ́, ìpinnu ẹjọ́, tàbí ìjìyà tí a dá; níbí, ó ń tọ́ka sí àbájáde ìjìyà kan náà tí àwọn méjèèjì ń fara dà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Ṣùgbọ́n èkejì dáhùn
  rationale: δὲ fi ìyàtọ̀ kékeré hàn láàárín ìhùwàsí àwọn ọ̀daràn méjèèjì, nítorí náà “Ṣùgbọ́n” bá àyíká mu. “Èkejì dáhùn” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kejì fèsì.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: ó sì bá a wí pé
  rationale: “Bá a wí” mú agbára ìbáwí inú ἐπιτιμάω jáde, “pé” sì ṣí ọ̀rọ̀ tààrà tí ó tẹ̀ lé e. Ìtumọ̀ yìí kò tún ọ̀rọ̀ ìṣáájú ṣe láìnídìí ní Yorùbá.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Ṣé ìwọ náà kò tilẹ̀ bẹ̀rù Ọlọ́run
  rationale: “Kò tilẹ̀” fi ìtẹnumọ́ οὐδέ hàn, nígbà tí “ìwọ náà” mú àfiyèsí tí ọ̀rọ̀-arọ́pò-orúkọ σὺ ní jáde. “Bẹ̀rù Ọlọ́run” pa àṣà ọ̀rọ̀ Bíbélì àti ìtumọ̀ ìjíhìn sí Ọlọ́run mọ́ láìsọ ọ́ di “bọ̀wọ̀ fún” nìkan.
- source_word: ὅτι
  choice: níwọ̀n bí
  rationale: Níhìn-ín ὅτι sọ ìdí tí ìbáwí náà fi yẹ; “níwọ̀n bí” jẹ́ ọ̀nà Yorùbá tí ó bá ìsopọ̀ ìdí yìí mu.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: o ti wà lábẹ́ ìdájọ́ kan náà
  rationale: “Lábẹ́ ìdájọ́ kan náà” jẹ́ èdè Yorùbá tó ṣe kedere fún ipò òfin àti ìjìyà tí àwọn méjèèjì ń pín, síbẹ̀ ó pa fífẹ̀ ìtumọ̀ κρίμα mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘bẹ̀rù Ọlọ́run’ nínú ìbáwí náà
  choice: bẹ̀rù Ọlọ́run
  alternative: bọ̀wọ̀ fún Ọlọ́run; ní ìbẹ̀rù ọlọ́wọ̀ fún Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì φοβέομαι níbí ní ìtumọ̀ ìbẹ̀rù ọlọ́wọ̀ àti mímọ̀ pé ènìyàn yóò jíhìn fún Ọlọ́run. Fífi “bẹ̀rù Ọlọ́run” sílẹ̀ pa agbára àti àìṣàlàyé tí ó ju ohun tí ẹsẹ náà sọ lọ mọ́.
- issue: Ìtumọ̀ κρίμα nínú àyíká ìkànmọ́ àgbélébùú
  choice: lábẹ́ ìdájọ́ kan náà
  alternative: nínú ìdálẹ́bi kan náà; nínú ẹjọ́ kan náà
  rationale: Krima lè tọ́ka sí ìdájọ́, ìpinnu ẹjọ́, tàbí ìjìyà tí ìpinnu náà fà. “Ìdájọ́” pa fífẹ̀ ọ̀rọ̀ náà mọ́, nígbà tí “lábẹ́” jẹ́ kí àbájáde ìjìyà tí wọ́n jọ ń fara dà hàn gbangba.
translation_notes:
  register: A lo Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ṣé” mú ìbéèrè ìbáwí náà dún bí èdè àdánidá; “kò tilẹ̀” sì pa ìtẹnumọ́ Gíríìkì mọ́. Àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
