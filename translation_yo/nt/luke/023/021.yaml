  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n ń ké sí i pé, “Kàn án mọ́ àgbélébùú! Kàn án mọ́ àgbélébùú!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà míì tó ṣàlàyé síi, “Pa á nípa kíkàn án mọ́ àgbélébùú! Pa á nípa kíkàn án mọ́ àgbélébùú!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: Ọ̀rọ̀-arọ́pò orúkọ náà ń tọ́ka sí àwọn ènìyàn tí a mẹ́nu kàn ṣáájú, δέ sì fi ìyàtọ̀ hàn pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐπεφώνουν
  choice: wọ́n ń bá a lọ láti ké
  rationale: Àkókò imperfect fi hàn pé igbe náà ń bá a lọ tàbí pé wọ́n ń tún un ṣe; ‘ké’ sì mú ohùn líle tí ọ̀rọ̀ náà ní jáde.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá àdánidá, ‘pé’ ló fi ohun tí wọ́n ń ké sọ̀rọ̀ hàn láìsí àfikún tí kò pọndandan.
- source_word: Σταύρου σταύρου
  choice: Kàn án mọ́ àgbélébùú! Kàn án mọ́ àgbélébùú!
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí pípa ènìyàn nípa kíkàn án mọ́ àgbélébùú; títún gbogbo gbólóhùn náà sọ pa ìkanra àti ìforígbárí ogunlọ́gọ̀ mọ́ ní Yorùbá àdánidá.
- source_word: αὐτόν
  choice: án
  rationale: ‘án’ ni ọ̀rọ̀-arọ́pò orúkọ olùgbà tí ó bá ‘him’ mu nínú gbólóhùn àṣẹ yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìbéèrè ìpànìyàn σταύρου
  choice: Kàn án mọ́ àgbélébùú
  alternative: Pa á lórí àgbélébùú
  rationale: Yíyàn ‘Kàn án mọ́ àgbélébùú’ pa àwòrán àti ọ̀nà ìpànìyàn pàtó tí σταυρόω ń tọ́ka sí mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì tún gbogbo àṣẹ náà sọ kí ìtẹnumọ́ àti ìkanra inú orísun Gíríìkì lè yé òǹkàwé dáadáa.
