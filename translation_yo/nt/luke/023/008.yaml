  to: Nígbà tí Herodu rí Jésù, inú rẹ̀ dùn gidigidi, nítorí ó ti ń fẹ́ láti rí i fún ìgbà pípẹ́, nítorí ó ti ń gbọ́ nípa rẹ̀[a]; ó sì ń retí láti rí àmì kan[b] tí Jésù yóò ṣe.
