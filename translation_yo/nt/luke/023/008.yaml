id: LUK.23.8
reference: Luke 23:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: yo
  text: Nígbà tí Herodu rí Jésù, inú rẹ̀ dùn gidigidi, nítorí ó ti ń fẹ́ láti rí i fún ìgbà pípẹ́, nítorí ó ti ń gbọ́ nípa rẹ̀[a]; ó sì ń retí láti rí àmì kan[b] tí Jésù yóò ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘nítorí ó ti gbọ́ nípa rẹ̀.’ Ìrísí ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìròyìn tí ó ń gbọ́ léraléra tàbí tí ó ń bá a lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, ‘iṣẹ́ ìyanu kan.’ Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘àmì’ (σημεῖον), ó sì lè tọ́ka sí iṣẹ́ ìyanu tí a wo gẹ́gẹ́ bí àmì tó ní ìtumọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης
  choice: Herodu
  rationale: A kò fi ọ̀rọ̀ àfikún bí ‘nísinsìnyí’ sí i; δέ ń tẹ ìtàn náà síwájú, èyí tí ìṣètò gbólóhùn Yorùbá lè fi hàn láìsí àsopọ̀ àfikún.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: Nígbà tí Herodu rí Jesu
  rationale: ‘Nígbà tí’ fi ìbáṣepọ̀ àkókò tí participle aorist náà ní pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì hàn ní Yorùbá àdánidá.
- source_word: ἐχάρη λίαν
  choice: inú rẹ̀ dùn gidigidi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó yọ̀ gidigidi, ó sì pa agbára λίαν mọ́.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: ó ti ń fẹ́ láti rí i fún ìgbà pípẹ́
  rationale: ‘Fún ìgbà pípẹ́’ kò sọ iye ọdún tí Gíríìkì kò sọ; ‘ti ń fẹ́’ sì fi ìfẹ́ tí ó ti ń bá a lọ hàn.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: nítorí ó ti ń gbọ́ nípa rẹ̀
  rationale: ‘Nítorí’ fi ìdí tàbí okùnfà hàn, ‘ti ń gbọ́’ sì pa ìtumọ̀ gbígbọ́ tí ó ń ṣẹlẹ̀ léraléra tàbí tí ó ń bá a lọ mọ́.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ó ń retí láti rí iṣẹ́ àmì kan
  rationale: ‘Ń retí’ bá imperfect mu, ‘iṣẹ́ àmì’ sì pa σημεῖον mọ́ gẹ́gẹ́ bí iṣẹ́ alágbára tí ó ní ìtumọ̀ àmì, dípò yíyí i padà sí ‘iṣẹ́ ìyanu’ nìkan.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: tí Jesu yóò ṣe
  rationale: Àtúnsọ orúkọ Jesu mú ẹni tí yóò ṣe iṣẹ́ náà ṣe kedere ní Yorùbá, ó sì pa agency tí ὑπό fi hàn mọ́; ọ̀nà ọjọ́ iwájú bá ohun tí Herodu ń retí láti rí mu.
theological_decisions:
- issue: Ìtumọ̀ σημεῖον
  choice: iṣẹ́ àmì
  alternative: iṣẹ́ ìyanu
  rationale: A pa èrò ‘àmì’ tí ó lè tọ́ka sí ìṣe alágbára tí ó ní ìtumọ̀ pàtàkì mọ́, láìdín ọ̀rọ̀ náà kù sí iṣẹ́ ìyanu lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A yà gbólóhùn náà sí apá méjì pẹ̀lú àmì olóṣùwọ̀n láti jẹ́ kí ọ̀pọ̀ gbólóhùn abẹ́ inú rẹ̀ rọrùn fún òǹkàwé òde òní.
