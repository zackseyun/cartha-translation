id: LUK.23.22
reference: Luke 23:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: yo
  text: Ó sì wí fún wọn lẹ́ẹ̀kẹta[a] pé, “Kí ló dé? Kí ni ohun búburú tí ọkùnrin yìí ṣe? Èmi kò rí ẹ̀sùn kankan nínú rẹ̀ tí ó yẹ fún ikú.[b] Nítorí náà, lẹ́yìn tí mo bá ti fi ìyà jẹ ẹ̀,[c] èmi yóò dá a sílẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì tún wí fún wọn ní ìgbà kẹta.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Èmi kò rí ìdí kankan nínú rẹ̀ fún ìdájọ́ ikú,” tàbí “Èmi kò rí ohun kan nínú rẹ̀ tí ó yẹ fún ikú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “lẹ́yìn tí mo bá ti bá a wí,” tàbí “lẹ́yìn tí mo bá ti nà án.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìbáwí tàbí ìjìyà, ṣùgbọ́n òun fúnra rẹ̀ kò sọ irú ìjìyà náà pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: lẹ́ẹ̀kẹta
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ìṣe náà ṣẹlẹ̀ ní ìgbà kẹta, ó sì pa ìtẹnumọ́ inú ìtàn mọ́.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Kí ló dé? Ibi wo ni ọkùnrin yìí ṣe?
  rationale: “Kí ló dé?” mú àtakò kúkúrú tí Τί lè dúró fún jáde, nígbà tí “Ibi wo ni…” pa ìbéèrè nípa κακόν mọ́ pẹ̀lú agbára ìwà rere àti búburú rẹ̀.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: ẹ̀bi kankan … tí ó yẹ fún ikú
  rationale: Ní àyíká ìdájọ́, αἴτιον tọ́ka sí ẹ̀sùn tàbí ìdí tó lè fìdí ìdájọ́ múlẹ̀. Gbólóhùn yìí ṣe kedere pé kò sí ẹ̀bi tí ó yẹ fún ìdájọ́ ikú.
- source_word: εὗρον ἐν αὐτῷ
  choice: Èmi kò rí … nínú rẹ̀
  rationale: Èyí tẹ̀ lé àwòrán èdè Gíríìkì ní pẹkipẹki, ó sì jẹ́ Yorùbá tó ṣeé yé; fífi “Èmi” síwájú tún mú ìdájọ́ Pílátù hàn gbangba.
- source_word: παιδεύσας
  choice: lẹ́yìn tí mo bá fi ìyà jẹ ẹ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìbáwí oníyà tàbí ìjìyà, ṣùgbọ́n kò dá irú ìjìyà náà pàtó. “Fi ìyà jẹ ẹ́” pa ìtumọ̀ gbogbogbò náà mọ́ láì sọ pé lílù pàṣán ni dandan.
- source_word: ἀπολύσω
  choice: èmi yóò dá a sílẹ̀
  rationale: “Dá a sílẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún ìtúsílẹ̀ ẹni tí a wà lábẹ́ àṣẹ ìdájọ́.
theological_decisions:
- issue: Irú ìgbésẹ̀ tí Pílátù fẹ́ gbé nínú παιδεύσας
  choice: A túmọ̀ ọ́ ní gbogbogbò gẹ́gẹ́ bí fífi ìyà jẹ ẹni, láì dá irú ìjìyà náà pàtó.
  alternative: “Lẹ́yìn tí mo bá bá a wí nípa ìjìyà” tàbí, bóyá ní pàtó sí i, “lẹ́yìn tí mo bá nà án.”
  rationale: 'Ẹsẹ̀ náà mú ìforígbárí náà dúró: Pílátù sọ pé Jésù kò lẹ́bi tí ó yẹ fún ikú, síbẹ̀ ó fẹ́ fi ìjìyà kan jẹ ẹ́. Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò, nítorí náà a kò fi àtúnṣe ìtàn kan lé e lórí.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé yé fún òǹkàwé òde òní. A lo “ọkùnrin yìí” fún οὗτος láti jẹ́ kí ẹni tí Pílátù ń tọ́ka sí ṣe kedere. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà ni a fi sí ibi tí ó yẹ.
