  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì náà dáadáa: ìsọ̀rọ̀ ní ìgbà kẹta, ìbéèrè àtakò, àìsí ẹ̀sùn tó yẹ fún ikú, ìjìyà kékeré, àti ìtúsílẹ̀. Síbẹ̀, àmì ohùn nínú ọ̀rọ̀ arọ́pò-orúkọ ''ẹ́'' yí ìtumọ̀ apá παιδεύσας padà sí ''ìwọ'' dípò ẹni kẹta (''ẹ̀'').'
  naturalness: '''Kí ló dé?'' jẹ́ Yorùbá àdánidá fún ìbéèrè àtakò náà. ''Kí ni ohun búburú tí ọkùnrin yìí ṣe?'' rọrùn sí i, ó sì ṣe kedere ju ''Ibi wo ni ... ṣe?'' lọ nínú Yorùbá òde òní.'
