  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n túbọ̀ ń tẹnu mọ́ ọn pé, “Ó ń ru àwọn ènìyàn sókè[a] nípa kíkọ́ni jákèjádò gbogbo Jùdíà[b], ó sì bẹ̀rẹ̀ láti Gálílì títí dé ibí yìí[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ń ru àwọn ènìyàn sí ìrúkèrúdò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ríru àwọn ènìyàn sókè ní ọ̀nà tí ó ń fa ìdàrúdàpọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Jùdíà” lè túmọ̀ sí agbègbè Jùdíà pàtó, tàbí ní àwọn àyíká ọ̀rọ̀ kan, gbogbo ilẹ̀ àwọn Júù tí ọ̀rọ̀ náà kàn. Níhìn-ín, ó ṣeé ṣe kí wọ́n ń tẹnu mọ́ bí iṣẹ́ rẹ̀ ṣe tàn káàkiri.
    reason: cultural_note
  - marker: c
    text: Tàbí, “títí dé ibi gan-an.” Gbólóhùn náà tọ́ka sí ìtànkálẹ̀ láti Gálílì dé ibi tí wọ́n ti dúró níwájú Pilatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: wọ́n túbọ̀ ń tẹnu mọ́ ọn
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìtẹ̀síwájú àti agbára ẹ̀sùn wọn hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún bí wọ́n ṣe ń fi agbára tẹnu mọ́ ọ̀rọ̀ náà.
- source_word: Ἀνασείει
  choice: ń ru àwọn ènìyàn sókè
  rationale: Ó pa àwòrán ìrúkèrúdò inú ọ̀rọ̀ Gíríìkì mọ́ láì sọ ẹ̀sùn náà di ọ̀tẹ̀ olóṣèlú pàtó ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: τὸν λαὸν
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí àwọn ará ìlú lápapọ̀, kì í ṣe ogunlọ́gọ̀ kan ṣoṣo tí ó péjọ.
- source_word: διδάσκων
  choice: nípa kíkọ́ni
  rationale: Ó fi hàn pé kíkọ́ni ni wọ́n gbé kalẹ̀ gẹ́gẹ́ bí ọ̀nà tí ó fi ń ru àwọn ènìyàn sókè; ó tún mú ìbáṣepọ̀ participle náà hàn ní Yorùbá àdánidá.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: jákèjádò gbogbo Jùdíà
  rationale: Ó pa ìtẹnumọ́ ìtànkálẹ̀ iṣẹ́ náà ká gbogbo agbègbè mọ́.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: ó bẹ̀rẹ̀ láti Gálílì
  rationale: Ó sọ ibi tí iṣẹ́ tí wọ́n fẹ̀sùn kàn án ti bẹ̀rẹ̀ ní kedere, gẹ́gẹ́ bí ἀπό ṣe ń tọ́ka sí orísun.
- source_word: ἕως ὧδε
  choice: títí dé ibí yìí
  rationale: Ó pa ìtọ́ka sí ibi tí Pilatu wà nígbà náà mọ́, ó sì fi bí ẹ̀sùn náà ṣe fẹ̀ dé ibi gbogbo hàn.
theological_decisions:
- issue: Irú ẹ̀sùn tí wọ́n fi kan Jésù
  choice: Ó ń ru àwọn ènìyàn sókè
  alternative: Ó ń ru àwọn ènìyàn sí ìṣọ̀tẹ̀
  rationale: Àṣàyàn náà pa ẹ̀sùn ìrúkèrúdò mọ́ ṣùgbọ́n kò fi ìtumọ̀ ọ̀daràn olóṣèlú pàtó kún Ἀνασείει ju bí ọ̀rọ̀ Gíríìkì ṣe fi lé e lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo “tẹnu mọ́ ọn” láti fi agbára tí ẹ̀sùn wọn ń ní sí i hàn, a sì lo “ru ... sókè” láti pa àìdánilójú Ἀνασείει mọ́.
