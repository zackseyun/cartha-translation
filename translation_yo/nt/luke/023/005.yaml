  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa: ó mú ipa aláìpé tí ἐπίσχυον ní, ẹ̀sùn Ἀνασείει tí kò sọ ọ́ di ẹ̀sùn ìṣọ̀tẹ̀ pàtó, ìtànkálẹ̀ ká gbogbo Jùdíà, àti ipò ìbẹ̀rẹ̀ láti Gálílì dé ibi tí wọ́n wà. A nílò ìṣàtúnṣe kékeré kan láti jẹ́ kí καὶ, tó so apá ìkẹyìn mọ́ ìjọba ọ̀rọ̀ náà, hàn ní Yorùbá.'
