id: LUK.23.42
reference: Luke 23:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: yo
  text: Ó sì wí pé,[a] “Jésù, rántí mi nígbà tí o bá dé nínú ìjọba rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, nínú àwọn ìwé-àfọwọ́kọ kan, “nígbà tí o bá dé sínú ìjọba rẹ.” Àkọsílẹ̀ SBLGNT ní “nínú ìjọba rẹ.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Asopọ̀ ìtàn tó rọrùn ni καὶ; ‘sì’ pa ìtẹ̀síwájú ìtàn mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ἔλεγεν
  choice: ń sọ pé
  rationale: Àìpé ἔλεγεν lè fi ìṣe tó ń lọ hàn; ‘ń sọ pé’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìfihàn yìí.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ ẹni ní ipò ìpè; a lo àkọsílẹ̀ orúkọ tó wọ́pọ̀ ní Yorùbá.
- source_word: μνήσθητί μου
  choice: rántí mi
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì jẹ́ àdánidá ní Yorùbá; nínú ẹ̀bẹ̀, ó tún lè ní ìmọ̀ pé kí ẹni náà ṣe rere sí olùbẹ̀bẹ̀, ṣùgbọ́n a kò fi ìtumọ̀ yẹn lé ọ̀rọ̀ lórí.
- source_word: ὅταν ἔλθῃς
  choice: nígbà tí o bá dé
  rationale: ὅταν pẹ̀lú subjunctive tọ́ka sí ohun ọjọ́ iwájú; ‘nígbà tí o bá dé’ jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ wíwá/dídé náà jáde.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: nínú ìjọba rẹ
  rationale: SBLGNT ní ἐν, tí ìtumọ̀ rẹ̀ tó sún mọ́ jù jẹ́ ‘nínú’; pẹ̀lú ọ̀rọ̀ dídé, gbolohun Yorùbá yìí lè jẹ́ kí a gbọ́ dídé ní ipò ìjọba láìyí ἐν sí ọ̀rọ̀ ìtọ́sọ́nà ‘sínú.’
- source_word: βασιλείᾳ
  choice: ìjọba
  rationale: βασιλεία lè túmọ̀ sí ìjọba tàbí ìṣàkóso ọba; ‘ìjọba’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì lè gba àwọn ìtumọ̀ méjèèjì ní àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ ọjọ́ iwájú nínú ẹ̀bẹ̀ sí Jésù
  choice: Olùsọ̀rọ̀ bẹ Jésù pé kí ó rántí òun nígbà tí Jésù bá dé nínú ìjọba rẹ.
  alternative: Ó lè tọ́ka sí dídé Jésù pẹ̀lú agbára ọba tàbí sí ìmúṣẹ ìjọba náà ní ọjọ́ iwájú.
  rationale: Ẹsẹ̀ náà sọ ìjọba ọjọ́ iwájú Jésù, ṣùgbọ́n kò ṣàlàyé àkókò tàbí ètò ẹ̀kọ́ nípa rẹ̀; ìtumọ̀ náà pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá ìlòde-òní tó níyì, tó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó yẹ. ‘Ó sì ń sọ pé’ pa àbùdá imperfect mọ́; ‘nínú ìjọba rẹ’ tẹ̀lé ἐν inú SBLGNT, láìfi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀.
