  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n Pílátù tún bá wọn sọ̀rọ̀, pẹ̀lú ìfẹ́ láti dá Jésù sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tún pè wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Pílátù ṣe ìgbésẹ̀ yìí lẹ́ẹ̀kan sí i; “tún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ṣókí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó samí sí ìyípadà kékeré tàbí ìtakora nínú ìtàn náà, nígbà tí Pílátù dáhùn sí ohun tí àwọn ènìyàn ń béèrè.
- source_word: ὁ Πιλᾶτος
  choice: Pílátù
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń pè é ní Yorùbá.
- source_word: προσεφώνησεν
  choice: ké sí wọn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pípe tàbí sísọ̀rọ̀ sí àwọn ènìyàn; “ké sí wọn” mú ìtumọ̀ ohùn gbangba nínú ìṣẹ̀lẹ̀ yìí jáde, láìfi ohun míì kún un.
- source_word: θέλων
  choice: nítorí ó fẹ́
  rationale: Ó ṣàfihàn ìfẹ́ tàbí ète Pílátù ní àkókò tó ń bá wọn sọ̀rọ̀; àkópọ̀ yìí jẹ́ adayeba ní Yorùbá.
- source_word: ἀπολῦσαι
  choice: dá ... sílẹ̀
  rationale: Ó bá ọ̀rọ̀ ìtúsílẹ̀ ẹni tí a fi pamọ́ tàbí tí ó wà lábẹ́ àṣẹ mu.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tó wọ́pọ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó mọ́, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ké sí wọn” láti pa agbára ohùn gbangba mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ “bá wọn sọ̀rọ̀” hàn.
