id: LUK.23.28
reference: Luke 23:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù yíjú sí wọn, ó sọ pé, “Ẹ̀yin ọmọbìnrin Jerusalẹmu[a], ẹ má sunkún nítorí mi; kàkà bẹ́ẹ̀, ẹ sunkún nítorí ara yín àti nítorí àwọn ọmọ yín,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin obìnrin Jerusalẹmu.” Ní ti gidi, Gíríìkì náà ní, “Ẹ̀yin ọmọbìnrin Jerusalẹmu,” ọ̀nà ìpè tó dà bí èdè àsọtẹ́lẹ̀, tí a pa mọ́ nínú ọ̀rọ̀ ìtumọ̀ àkọ́kọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: yíjú
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù yí ara rẹ̀ sí ọ̀dọ̀ àwọn obìnrin náà; ‘yíjú sí wọn’ jẹ́ ọ̀nà àdánidá láti sọ ìṣe náà ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ ń mú ìyípadà díẹ̀ tàbí ìtakora wá nínú ìtàn; ‘Ṣùgbọ́n’ bá ìyípadà láti inú ẹkún àwọn obìnrin sí ọ̀rọ̀ Jésù mu.
- source_word: πρὸς αὐτὰς
  choice: sí wọn
  rationale: πρός pẹ̀lú accusative tọ́ka sí ibi tí ìṣe náà dojú kọ; ‘sí wọn’ mú ìtumọ̀ ìdarí yẹn jáde ní Yorùbá àdánidá.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Ẹ̀yin ọmọbìnrin Jerusalẹmu
  rationale: Èyí pa àwòrán ìbátan àti ìró èdè àsọtẹ́lẹ̀ inú Gíríìkì mọ́, dípò yíyí i padà sí ‘àwọn obìnrin’ nínú ẹsẹ̀ pàtàkì.
- source_word: μὴ κλαίετε
  choice: ẹ má sunkún
  rationale: Àṣẹ ìsinsìnyí pẹ̀lú μή lè jẹ́ ìdènà gbogbogbò tàbí dídá ohun tí ń lọ lọ́wọ́ dúró; ‘ẹ má sunkún’ pa àìdánilójú yẹn mọ́ láìfipá sọ pé kí wọ́n dá ẹkún tí wọ́n ti bẹ̀rẹ̀ dúró.
- source_word: ἐπ’ ἐμέ
  choice: nítorí mi
  rationale: Lẹ́yìn κλαίω, ἐπί lè tọ́ka sí ẹni tàbí ohun tó fa ẹkún; ‘nítorí mi’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: πλὴν
  choice: kàkà bẹ́ẹ̀
  rationale: 'Níhìn-ín, πλήν ń ṣe àtúnṣe ìdojúkọ: kì í ṣe nítorí Jésù, bí kò ṣe nítorí ara wọn; ‘kàkà bẹ́ẹ̀’ mú ìtakora yẹn hàn kedere.'
- source_word: ἐφ’ ἑαυτὰς
  choice: nítorí ara yín
  rationale: Èyí tẹ̀ lé ìṣọ̀kan gbolohun ‘nítorí mi’ ó sì pa ìtumọ̀ reflexive náà mọ́.
- source_word: τὰ τέκνα ὑμῶν
  choice: àwọn ọmọ yín
  rationale: τέκνα túmọ̀ sí àwọn ọmọ nínú ìbátan ìdílé; ‘àwọn ọmọ yín’ jẹ́ èdè Yorùbá tó rọrùn, tó sì péye ní àyíká yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ ìpè Θυγατέρες Ἰερουσαλήμ
  choice: Ẹ̀yin ọmọbìnrin Jerusalẹmu
  alternative: Ẹ̀yin obìnrin Jerusalẹmu
  rationale: Gbólóhùn náà ní ìró èdè àsọtẹ́lẹ̀ àti àwòrán àjọṣe tí a rí nínú Ìwé Mímọ́. Mímú ‘ọmọbìnrin’ dúró pa ìwúwo yẹn mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. ‘Ó sì sọ pé’ jẹ́ àdánidá ju ‘ó wí pé’ lọ fún ọ̀pọ̀ òǹkàwé òde òní, nígbà tí ‘Ẹ̀yin ọmọbìnrin Jerusalẹmu’ pa ìró Ìwé Mímọ́ àti àwòrán àsọtẹ́lẹ̀ inú orísun mọ́.
