revisions:
- from: Nígbà náà ni Pílátù béèrè lọ́wọ́ rẹ̀ pé, “Ṣé ìwọ ni ọba àwọn Júù[a]?” Ó sì dá a lóhùn pé, “Ìwọ ni ó sọ bẹ́ẹ̀.”[b]
  to: Nígbà náà ni Pílátù béèrè lọ́wọ́ rẹ̀ pé, “Ṣé ìwọ ni ọba àwọn Júù[a]?” Ó sì dá a lóhùn pé, “Ìwọ ló sọ bẹ́ẹ̀.”[b]
  rationale: 'The revision is limited to the concise reply and its corresponding alternative. It preserves the ambiguity of Σὺ λέγεις: Jesus neither gives an unqualified “yes” nor denies Pilate’s formulation, but places the wording on Pilate’s lips.'
