id: LUK.23.3
reference: Luke 23:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: yo
  text: Nígbà náà ni Pílátù béèrè lọ́wọ́ rẹ̀ pé, “Ṣé ìwọ ni ọba àwọn Júù[a]?” Ó sì dá a lóhùn pé, “Ìwọ ló sọ bẹ́ẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àwọn ará Jùdíà.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù tàbí àwọn ará Jùdíà, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘Ìwọ ló sọ ọ́,’ tàbí ‘Bẹ́ẹ̀ ni, bí o ṣe sọ ni.’ Ìdáhùn Gíríìkì náà ṣókí, ó sì ṣeé lóye gẹ́gẹ́ bí ìfọwọ́sí tí a fi ààlà sí.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn síwájú; ọ̀rọ̀ yìí bá ìṣàn ìtàn Yorùbá mu láì fi ìtakora líle kún un.
- source_word: ἠρώτησεν αὐτόν λέγων
  choice: béèrè lọ́wọ́ rẹ̀ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìṣe bíbéèrè àti ọ̀rọ̀ tí ó tẹ̀ lé e jáde, láì tún ‘sọ pé’ ṣe ní ọ̀nà tí yóò le létí.
- source_word: Σὺ εἶ
  choice: Ṣé ìwọ ni
  rationale: Ó mú ìbéèrè Gíríìkì jáde ní kedere, ó sì tẹnumọ́ ‘ìwọ’ gẹ́gẹ́ bí orísun ṣe rí.
- source_word: βασιλεὺς
  choice: ọba
  rationale: ‘Ọba’ ni ìtumọ̀ tààrà fún oyè ìjọba tí Pílátù ń béèrè nípa rẹ̀; ‘alákóso’ yóò dín agbára ẹ̀sùn náà kù.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, ‘ọba àwọn Júù’ ni oyè ìṣèlú àti ẹ̀sìn tí ó bá àyíká mu jù; àṣàyàn ‘àwọn ará Jùdíà’ wà ní àlàyé ìsàlẹ̀.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Ó sì dá a lóhùn pé
  rationale: Ó pa ìtumọ̀ ìdáhùn àti ẹni tí a dá lóhùn mọ́, ní èdè Yorùbá tí ó rọrùn tí ó sì wọ́pọ̀.
- source_word: Σὺ λέγεις
  choice: Ìwọ ni ó sọ bẹ́ẹ̀
  rationale: Ìdáhùn náà ṣókí, ó sì fi gbólóhùn náà sí ẹnu Pílátù; èyí kò sọ ọ́ di ‘bẹ́ẹ̀ ni’ lásán, bẹ́ẹ̀ ni kò sọ ọ́ di ìkọ̀sí.
theological_decisions:
- issue: Agbára ìdáhùn Jésù, Σὺ λέγεις
  choice: Ìjẹ́wọ́ tí a fi ààlà sí, ‘Ìwọ ni ó sọ bẹ́ẹ̀.’
  alternative: ‘Bẹ́ẹ̀ ni, bí o ṣe sọ ni’ tàbí ‘Ìwọ sọ ọ́.’
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì lè jẹ́ ìfọwọ́sí tí kò péye tàbí ọ̀nà láti fi ọ̀rọ̀ náà sí ẹnu Pílátù. Ìtumọ̀ yìí pa ìṣòro ọ̀rọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì sọ ọ́ di ‘bẹ́ẹ̀ ni’ tààrà tàbí ìkọ̀sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ṣé ìwọ ni’ àti ‘dá a lóhùn’ jẹ́ ọ̀rọ̀ àdánidá fún òǹkàwé lasán, nígbà tí ‘Ìwọ ni ó sọ bẹ́ẹ̀’ pa ìkápá àti àìdájú ìdáhùn orísun mọ́.
