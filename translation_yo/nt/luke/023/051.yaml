id: LUK.23.51
reference: Luke 23:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: yo
  text: Ọkùnrin yìí kò fohùn ṣọ̀kan pẹ̀lú ìpinnu àti ìṣe wọn[a]—ó wá láti Arimátíà, ìlú àwọn Júù, ó sì ń dúró de ìjọba Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fara mọ́ ìmọ̀ràn àti ohun tí wọ́n ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ọ̀rọ̀ atọ́ka náà tún ń tọ́ka sí Jósẹ́fù pẹ̀lú ìtẹnumọ́; ‘Ọkùnrin yìí’ jẹ́ èdè Yorùbá àdánidá tó sì pa ìtẹnumọ́ náà mọ́.
- source_word: συγκατατεθειμένος
  choice: kò fohùn ṣọ̀kan pẹ̀lú
  rationale: Èyí fi hàn pé Jósẹ́fù kò fara mọ́ ohun tí àwọn yòókù pinnu; ó tún bá ìtumọ̀ ìdúró tí ó ti mú tẹ́lẹ̀ mu láì sọ ní pàtó pé ìdìbò kan wáyé.
- source_word: βουλῇ
  choice: ìpinnu
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí àwọn aṣáájú pinnu, kì í ṣe sí ìgbìmọ̀ gẹ́gẹ́ bí àjọ.
- source_word: πράξει
  choice: ìṣe
  rationale: ‘Ìṣe’ tọ́ka sí ohun tí wọ́n ṣe ní ti gidi, ó sì ya ìpinnu wọn sọ́tọ̀ kúrò nínú ìmúṣẹ rẹ̀.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: ó wá láti Arimátíà, ìlú àwọn Júù
  rationale: Ìtumọ̀ yìí tẹ̀ lé àfikún àlàyé Gíríìkì ní ọ̀nà tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá, láì fi ìtumọ̀ ẹ̀yà tàbí agbègbè tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: προσεδέχετο
  choice: ń dúró de
  rationale: Àmì àsìkò aláìpé náà ṣàfihàn ìdúró tí ń bá a lọ pẹ̀lú ìrètí; ‘ń dúró de’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún un.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì pa ìwúwo ọ̀rọ̀ náà mọ́ nínú ìwé Lúùkù.
theological_decisions:
- issue: Bí Jósẹ́fù ṣe ya ara rẹ̀ sọ́tọ̀ kúrò nínú ipa ìgbìmọ̀ àwọn Júù nínú ikú Jésù
  choice: A sọ pé kò fohùn ṣọ̀kan pẹ̀lú ìpinnu àti ìṣe wọn.
  alternative: A lè sọ pé kò fara mọ́ ìmọ̀ràn àti ohun tí wọ́n ṣe, tàbí pé kò dìbò fún ìpinnu wọn.
  rationale: Gíríìkì sọ pé kò fara mọ́ βουλή àti πρᾶξις wọn, ṣùgbọ́n kò sọ ní pàtó pé wọ́n dìbò. Nítorí náà, a kò fi àlàyé ìtàn tó dín ìtumọ̀ náà kù kún ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A gbe àmì àlàyé [a] síbi gbólóhùn tí àlàyé náà ń ṣàlàyé, dípò lẹ́yìn orúkọ Arimátíà.
