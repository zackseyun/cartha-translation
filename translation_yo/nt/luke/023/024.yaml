  source_fidelity: Ìtumọ̀ náà gbé ìmọ̀ ìdájọ́ nínú ἐπέκρινεν kalẹ̀ dáadáa nípasẹ̀ “dájọ́.” Ṣùgbọ́n “kí wọ́n ṣe ohun tí wọ́n ń béèrè” ní koko-ọrọ àìlójúfẹ́ (“wọ́n”) tí Gíríìkì kò sọ, ó sì ń mú ìbéèrè náà dà bí ohun tí wọ́n ṣì ń béèrè, níbi tí αἴτημα αὐτῶν ti ń tọ́ka sí ohun tí wọ́n ti béèrè.
