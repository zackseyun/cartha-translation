  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: yo
  text: Pilatu sì dájọ́ pé kí ohun tí wọ́n béèrè ṣẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ìṣètò ọ̀rọ̀ náà: “Pilatu sì ṣe ìdájọ́ pé kí ìbéèrè wọn ṣẹ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn Yorùbá tó bá àyíká mu, tí kò fi ìtumọ̀ àkókò kún ọ̀rọ̀ Gíríìkì.
- source_word: Πιλᾶτος
  choice: Pilatu
  rationale: Ìkọ orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: ἐπέκρινεν
  choice: dájọ́
  rationale: Ó fi hàn pé Pilatu ṣe ìpinnu gẹ́gẹ́ bí onídàájọ́; kò dín un kù sí ìpinnu lásán, bẹ́ẹ̀ ni kò sọ ọ́ di ìdájọ́ ikú ní pàtó.
- source_word: γενέσθαι
  choice: pé kí wọ́n ṣe
  rationale: Nínú gbólóhùn yìí, infinitive náà ń tọ́ka sí mímú ohun tí a béèrè ṣẹ; èdè yìí jẹ́ ti Yorùbá àdánidá.
- source_word: τὸ αἴτημα αὐτῶν
  choice: ohun tí wọ́n ń béèrè
  rationale: Ó pa ìtumọ̀ ‘ìbéèrè/ohun tí a ń béèrè’ mọ́, ó sì jẹ́ kí àyíká ìtẹnumọ́ wọn fi agbára ìbéèrè náà hàn láìfi ‘ìbéèrè líle’ sínú ọ̀rọ̀ ní dandan.
theological_decisions:
- issue: Ìtumọ̀ ti òfin nínú ìṣe Pilatu
  choice: Pilatu dájọ́ pé kí wọ́n ṣe ohun tí wọ́n ń béèrè
  alternative: Pilatu pinnu pé kí a gba ohun tí wọ́n béèrè
  rationale: ‘Dájọ́’ pa agbára ìpinnu onídàájọ́ tí ἐπέκρινεν ní mọ́, ṣùgbọ́n kò fi kún un pé Pilatu fúnra rẹ̀ sọ ìdájọ́ ikú kan ní ọ̀nà tí ọ̀rọ̀ náà kò sọ ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ń béèrè’ láti bá ìtẹnumọ́ àwọn ènìyàn nínú àyíká mu, a sì lo ‘dájọ́’ láti pa àwọ̀ òfin ọ̀rọ̀ Gíríìkì mọ́.
