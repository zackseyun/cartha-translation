id: LUK.23.48
reference: Luke 23:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: yo
  text: Gbogbo àwọn èrò tí wọ́n péjọ nítorí ohun ìwòran yìí[a], lẹ́yìn tí wọ́n rí ohun tí ó ṣẹlẹ̀, wọ́n ń padà lọ, wọ́n sì ń lu àyà wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìran yìí.”
    reason: lexical_alternative
  - marker: b
    text: Lílu àyà jẹ́ àmì ìbànújẹ́, ọ̀fọ̀, tàbí ìpayà.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: tí wọ́n péjọ
  rationale: Ó fi hàn pé àwọn ènìyàn náà wá sí ibẹ̀, wọ́n sì kóra jọ; ‘péjọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi àfikún σύν- túmọ̀ ju bó ṣe yẹ lọ.
- source_word: ὄχλοι
  choice: àwọn èrò
  rationale: ‘Àwọn èrò’ bá nọ́ńbà púpọ̀ inú Gíríìkì mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá ìsinsìnyí fún ọ̀pọ̀ ènìyàn tí ó péjọ sí ibi kan.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: nítorí ohun ìwòran yìí
  rationale: θεωρία lè túmọ̀ sí ohun tí àwọn ènìyàn wá wò tàbí ìran tí ó wà ní gbangba. ‘Ohun ìwòran’ pa ìtumọ̀ rírí ní ojú mọ́ láì sọ ìṣẹ̀lẹ̀ náà di eré àṣefihàn.
- source_word: θεωρήσαντες τὰ γενόμενα
  choice: lẹ́yìn tí wọ́n rí ohun tí ó ṣẹlẹ̀
  rationale: ‘Lẹ́yìn tí’ fi hàn pé rírí ohun tí ó ṣẹlẹ̀ ṣáájú pípadà wọn, gẹ́gẹ́ bí àpólà aláìlórúkọ aorist ṣe tọ́ka sí.
- source_word: τύπτοντες τὰ στήθη
  choice: wọ́n sì ń lu àyà wọn
  rationale: Èyí pa ìṣe ara tí Gíríìkì sọ mọ́ ní èdè Yorùbá àdánidá, láì pinnu ìmọ̀lára tàbí ipò ẹ̀mí tí ó fà á.
- source_word: ὑπέστρεφον
  choice: wọ́n ń padà lọ
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ lọ́wọ́ inú imperfect Gíríìkì hàn, dípò kí ó sọ ọ́ bí ìṣe ẹ̀ẹ̀kan ṣoṣo tí ó parí.
theological_decisions:
- issue: Ìtumọ̀ ìmọ̀lára tí fífi ọwọ́ lu àyà wọn ní
  choice: A fi ìṣe ara náà sílẹ̀ láì sọ pé wọ́n ronúpìwàdà tàbí pé wọ́n mọ ẹ̀bi ara wọn.
  alternative: Kí a túmọ̀ ìṣe náà ní tààrà gẹ́gẹ́ bí ìrònúpìwàdà, ìbànújẹ́, tàbí ìpayà.
  rationale: Gíríìkì sọ ohun tí wọ́n ṣe, ṣùgbọ́n kò ṣàlàyé ipò ọkàn wọn ní pàtó; nítorí náà, ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti ìsinsìnyí, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘àwọn èrò’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó le ju, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
