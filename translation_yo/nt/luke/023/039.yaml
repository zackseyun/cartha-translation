  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: yo
  text: Ọ̀kan lára àwọn ọ̀daràn tí wọ́n so kọ́ níbẹ̀ ń sọ̀rọ̀-òdì sí i pé, “Ṣé ìwọ kọ́ ni Mèsáyà náà?[a] Gba ara rẹ àti wa là!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Kristi náà.” Ní èdè Gíríìkì: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Ọ̀kan
  rationale: δέ jẹ́ àmì ìtẹ̀síwájú tàbí ìyàtọ̀ díẹ̀ nínú ìtàn; èdè Yorùbá kò nílò àsopọ̀ ọ̀tọ̀ níbí.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: lára àwọn ọ̀daràn tí wọ́n so kọ́ níbẹ̀
  rationale: “Àwọn ọ̀daràn” túmọ̀ κακούργων lọ́nà àdánidá; “tí wọ́n so kọ́” pa ìtumọ̀ κρεμασθέντων mọ́ láìfi ọ̀rọ̀ tó túbọ̀ pàtó sí i.
- source_word: ἐβλασφήμει αὐτόν
  choice: ń sọ̀rọ̀-òdì sí i
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀gàn tàbí ọ̀rọ̀ àbùkù sí Jésù; àmì “ń” tún fi ìṣe tí ń bá a lọ hàn gẹ́gẹ́ bí imperfect.
- source_word: λέγων
  choice: pé
  rationale: “Pé” ni ọ̀nà Yorùbá tó rọrùn láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni kan sọ.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός
  choice: Ṣé ìwọ kọ́ ni Mèsáyà náà?
  rationale: “Ṣé … kọ́” pa agbára ìbéèrè ẹ̀gàn tí ó ń retí ìdáhùn bẹ́ẹ̀ni mọ́; “Mèsáyà” fi Χριστός hàn gẹ́gẹ́ bí oyè.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Gba ara rẹ àti àwa náà là
  rationale: “Gba … là” jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìgbàlà kúrò nínú ikú tó sún mọ́lé, ó sì pa ìsopọ̀ pẹ̀lú èrò ìgbàlà mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹ̀gàn yìí, Χριστός jẹ́ oyè, kì í ṣe orúkọ lasán; “Mèsáyà” pa ìtumọ̀ oyè náà àti àyíká ìrètí àwọn Júù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “sọ̀rọ̀-òdì” láti yẹra fún fífi ìtumọ̀ ẹ̀sìn tóóró sí ἐβλασφήμει, a sì fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
