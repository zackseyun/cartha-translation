- from: Ọ̀kan lára àwọn ọ̀daràn tí wọ́n so kọ́ níbẹ̀ ń sọ̀rọ̀-òdì sí i pé, “Ṣé ìwọ kọ́ ni Mèsáyà náà?[a] Gba ara rẹ àti àwa náà là!”
  to: Ọ̀kan lára àwọn ọ̀daràn tí wọ́n so kọ́ níbẹ̀ ń sọ̀rọ̀-òdì sí i pé, “Ṣé ìwọ kọ́ ni Mèsáyà náà?[a] Gba ara rẹ àti wa là!”
  rationale: A tún ọ̀rọ̀ ìpè ikẹ́yìn ṣe sí fọ́ọ̀mù Yorùbá tó dáa jù, a sì yọ “náà” kúrò nítorí pé orísun Gíríìkì kan sọ “àwa” péré. Àwọn apá míì wà ní ìbámu pẹ̀lú orísun, nítorí náà a pa wọ́n mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó ṣàfihàn ọ̀kan nínú àwọn ọ̀daràn tí a so kọ́, ìsọ̀rọ̀-òdì tí ń tẹ̀síwájú, ìbéèrè ẹ̀gàn nípa Mèsáyà, àti àṣẹ láti gba ara ẹni àti àwọn mìíràn là. “Mèsáyà” yẹ fún ὁ χριστός gẹ́gẹ́ bí oyè, ìsàlẹ̀-ojúewé náà sì pa yíyàn “Kristi” mọ́.'
  naturalness: “Gba ara rẹ àti àwa náà là” kò rọrùn níbi ipò ohun-ìṣe. Fọ́ọ̀mù ohun-ìṣe tí kò ní ìtẹnumọ́, “wa,” ni ó yẹ; “náà” kò wà nínú Gíríìkì, nítorí náà a yọ ọ́ kúrò fún ìbámu tó sún mọ́ ọ̀rọ̀ orísun.
  terminology: “Ọ̀daràn,” “sọ̀rọ̀-òdì sí i,” “Mèsáyà,” àti “gba … là” bójú mu nínú Yorùbá boṣewa àti nínú àyíká ẹsẹ̀ yìí. “So kọ́” ń pa ọ̀rọ̀ κρεμασθέντων mọ́ láìsọ pé a kàn wọ́n mọ́ àgbélébùú.
  issues:
  - severity: low
    issue: Àwọn ohun-ìṣe nínú ìpè ikẹ́yìn
    rationale: Nínú “Gba ara rẹ àti àwa náà là,” “àwa” jẹ́ fọ́ọ̀mù alómìnira/olùtẹnumọ́; “wa” ni ohun-ìṣe àdánidá. Pẹ̀lú èyí, “náà” fi ìtumọ̀ “also” kún un bí ó tilẹ̀ jẹ́ pé kò sí nínú ἡμᾶς.
  revised_text: Ọ̀kan lára àwọn ọ̀daràn tí wọ́n so kọ́ níbẹ̀ ń sọ̀rọ̀-òdì sí i pé, “Ṣé ìwọ kọ́ ni Mèsáyà náà?[a] Gba ara rẹ àti wa là!”
