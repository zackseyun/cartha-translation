id: LUK.23.12
reference: Luke 23:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: yo
  text: Hẹ́rọ́dù àti Pílátù sì di ọ̀rẹ́ ara wọn[a] ní ọjọ́ náà gan-an, nítorí pé tẹ́lẹ̀ rí, wọ́n ti wà ní ìṣọ̀tá sí ara wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bẹ̀rẹ̀ sí í bá ara wọn ṣe bí ọ̀rẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ti jẹ́ ọ̀tá ara wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: di
  rationale: Ọ̀rọ̀ yìí fi ìyípadà ipò ìbáṣepọ̀ hàn; ‘di’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n bẹ̀rẹ̀ sí í jẹ́ ohun tí wọn kò jẹ́ tẹ́lẹ̀.
- source_word: φίλοι
  choice: ọ̀rẹ́ ara wọn
  rationale: Èyí túmọ̀ predicate plural náà ní tààràtà, ó sì lè tọ́ka sí ìbáṣepọ̀ ọ̀rẹ́ tàbí àjọṣepọ̀ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Hẹ́rọ́dù àti Pílátù
  rationale: ‘Àti’ so àwọn méjèèjì pọ̀ lọ́nà Yorùbá tí ó ṣe kedere; kò pọn dandan láti tún fi ‘àwọn méjèèjì’ kún un.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: ní ọjọ́ náà gan-an
  rationale: ‘Gan-an’ pa ìtẹnumọ́ inú gbólóhùn Gíríìkì mọ́ pé ọjọ́ kan náà pàtó ni.
- source_word: μετ’ ἀλλήλων
  choice: ara wọn
  rationale: Ó sọ ìbáṣepọ̀ alábàápín láàárín àwọn méjèèjì ní Yorùbá àdánidá.
- source_word: προϋπῆρχον
  choice: tẹ́lẹ̀ rí, wọ́n ti wà
  rationale: Àkójọpọ̀ yìí fi ipò tí ó ti ń bá a lọ ṣáájú ọjọ́ náà hàn, ó sì mú ìyàtọ̀ àkókò náà ṣe kedere.
- source_word: ἐν ἔχθρᾳ
  choice: ní ìṣọ̀tá
  rationale: ‘Ìṣọ̀tá’ pa àwòrán orúkọ-àfojúsùn Gíríìkì mọ́, ó sì sọ ìtakò nínú ìbáṣepọ̀ wọn ní kedere.
- source_word: πρὸς αὑτούς
  choice: sí ara wọn
  rationale: Èyí pa agbára ìtọ́sọ́nà πρός àti ìtumọ̀ pé ìṣọ̀tá náà jẹ́ ti ara wọn sí ara wọn mọ́.
theological_decisions:
- issue: Irú ìyípadà ìbáṣepọ̀ láàárín Hẹ́rọ́dù àti Pílátù
  choice: A sọ pé wọ́n di ọ̀rẹ́ ara wọn, láìsọ pé ó jẹ́ ọ̀rẹ́ tímọ́tímọ́ tàbí ìyípadà ọkàn.
  alternative: A lè túmọ̀ rẹ̀ ní ọ̀nà tí ó rọrùn sí i pé wọ́n bẹ̀rẹ̀ sí í bá ara wọn ṣe bí ọ̀rẹ́.
  rationale: φίλοι lè tọ́ka sí ọ̀rẹ́ tàbí àjọṣepọ̀; ẹsẹ náà kò ṣàlàyé ìdí inú wọn tàbí pàtàkì ẹ̀kọ́ ìsìn kan, nítorí náà a kò fi ìtumọ̀ tí ó ju ọ̀rọ̀ náà lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tí ó tún ṣeé lóye fún òǹkàwé òde òní. ‘Sì’ ṣàfihàn δὲ gẹ́gẹ́ bí àsopọ̀ ìtàn; ìtòlẹ́sẹẹsẹ gbólóhùn náà jẹ́ ti Yorùbá àdánidá.
