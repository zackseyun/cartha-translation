  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Pilatu gbọ́ èyí, ó béèrè bóyá ọkùnrin náà jẹ́ ará Galili,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatu
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn nínú ìtàn bí Pilatu ṣe fèsì sí ohun tí ó gbọ́.
- source_word: ἀκούσας
  choice: nígbà tí ... gbọ́ èyí
  rationale: Ó tú participle aorist náà sí gbólóhùn àkókò Yorùbá tí ó ṣe àdánidá; “èyí” tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ọ̀rọ̀.
- source_word: ἐπηρώτησεν
  choice: ó béèrè
  rationale: Ìtumọ̀ taara, tí ó sì wọ́pọ̀ fún fífi ìbéèrè ṣe.
- source_word: εἰ
  choice: bóyá
  rationale: Ọ̀nà Yorùbá tí ó ṣe àdánidá láti bẹ̀rẹ̀ ìbéèrè aláìṣe-taara.
- source_word: ὁ ἄνθρωπος
  choice: ọkùnrin náà
  rationale: Ó pa ìtọ́kasí pàtó ti àpilẹ̀kọ Gíríìkì mọ́ láìfi àmì ìfihàn tí kò sí nínú orísun kún un.
- source_word: Γαλιλαῖός
  choice: ará Galili
  rationale: Ó sọ ìdánimọ̀ ẹkùn ẹni náà ní ọ̀nà Yorùbá tí ó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ἐστιν
  choice: ni
  rationale: Yorùbá kò nílò yíyí àsìkò ọ̀rọ̀-ìṣe padà nínú irú ìbéèrè aláìṣe-taara yìí; “ni” pa ìtumọ̀ present Gíríìkì mọ́ ní ọ̀nà àdánidá.
