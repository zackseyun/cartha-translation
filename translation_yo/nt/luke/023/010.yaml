  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti àwọn akọ̀wé sì dúró níbẹ̀, wọ́n ń fi ìkanra fẹ̀sùn kàn án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń fi líle koko fẹ̀sùn kàn án” tàbí “wọ́n ń fẹ̀sùn kàn án gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: dúró níbẹ̀
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí wọ́n ṣe wà ní ìdúró níbi ìṣẹ̀lẹ̀ náà; “dúró níbẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ yìí hàn.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn náà síwájú; “sì” bá ìṣiṣẹ́ yìí mu láìfi ìtakora líle kún un.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí tọ́ka sí àwọn aṣáájú aláṣẹ nínú àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń ṣe ipò àlùfáà àgbà kan náà lẹ́ẹ̀kan náà.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” jẹ́ ìtumọ̀ tààrà, tí a sì mọ̀ dáadáa nínú àyíká ìtàn Ìhìn Rere; àwọn ìtumọ̀ bí “olùkọ́ òfin” yóò túmọ̀ iṣẹ́ wọn síwájú ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: εὐτόνως
  choice: fi ìkanra
  rationale: Ọ̀rọ̀ náà fi agbára àti líle ìṣe wọn hàn. “Fi ìkanra” jẹ́ Yorùbá àdánidá tí ó pa kíkankíkan ẹ̀sùn náà mọ́.
- source_word: κατηγοροῦντες
  choice: wọ́n ń … fẹ̀sùn kàn
  rationale: Ọ̀rọ̀-orúkọ ìṣe tí ó wà ní àsìkò ìsinsìnyí fi ìṣe tí ń bá a lọ hàn nígbà tí wọ́n dúró; “wọ́n ń fẹ̀sùn kàn” sọ ìṣe ẹjọ́ náà ní kedere.
- source_word: αὐτοῦ
  choice: án
  rationale: Ẹni tí wọ́n ń fẹ̀sùn kàn ni àrọ́pò-orúkọ náà tọ́ka sí; “fẹ̀sùn kàn án” jẹ́ gbólóhùn Yorùbá tí ó péye.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, ní èdè ìgbàlódé tí ó ní iyì. A lo “àwọn akọ̀wé” gẹ́gẹ́ bí akọ́lé ìtàn Bíbélì tí ó wọ́pọ̀, a sì lo “fi ìkanra” láti mú agbára εὐτόνως jáde láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
