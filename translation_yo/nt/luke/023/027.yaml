id: LUK.23.27
reference: Luke 23:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: yo
  text: Ọ̀pọ̀lọpọ̀ ènìyàn sì ń tẹ̀ lé e, pẹ̀lú àwọn obìnrin tí wọ́n ń lu àyà wọn, tí wọ́n sì ń ṣọ̀fọ̀ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: ń tẹ̀ lé e
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń tẹ̀ lé e” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtẹ̀síwájú náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ìtàn tó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn, láìfi ìtakora kún un.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: ọ̀pọ̀ ènìyàn ńlá
  rationale: Èyí túmọ̀ àwùjọ ènìyàn púpọ̀ ní èdè Yorùbá tó ṣe kedere, dípò títẹ̀ lé àkójọpọ̀ ẹ̀yà gírámà Gíríìkì ní ọ̀rọ̀ sí ọ̀rọ̀.
- source_word: γυναικῶν
  choice: pẹ̀lú àwọn obìnrin
  rationale: Ó fi hàn pé àwọn obìnrin wà lára àwọn tó ń tẹ̀ lé e, ó sì mú kí ẹni tí gbólóhùn ìbátan tó tẹ̀ lé ń tọ́ka sí ṣe kedere.
- source_word: αἳ
  choice: tí wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ abo ọ̀pọ̀ náà ń tọ́ka pàtó sí àwọn obìnrin; ìṣètò Yorùbá yìí pa ìtọ́kasí náà mọ́.
- source_word: ἐκόπτοντο
  choice: ń lu àyà wọn
  rationale: Nínú àṣà ọ̀fọ̀, ọ̀rọ̀ náà tọ́ka sí lílu ara, ní pàtàkì àyà, gẹ́gẹ́ bí àmì ìbànújẹ́; ìtumọ̀ yìí ṣe ìṣe náà kedere.
- source_word: ἐθρήνουν
  choice: ń ṣọ̀fọ̀
  rationale: Ó sọ ìkérora àti ìbànújẹ́ ọ̀fọ̀ tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ní Yorùbá àdánidá.
- source_word: αὐτόν
  choice: rẹ̀
  rationale: Ó pa Jésù mọ́ gẹ́gẹ́ bí ẹni tí wọ́n ń ṣọ̀fọ̀ nítorí rẹ̀, ní ìlò Yorùbá tó rọrùn.
