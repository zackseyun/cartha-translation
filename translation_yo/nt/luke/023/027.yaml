- from: Ọ̀pọ̀ ènìyàn ńlá sì ń tẹ̀ lé e, pẹ̀lú àwọn obìnrin tí wọ́n ń lu àyà wọn, tí wọ́n sì ń ṣọ̀fọ̀ rẹ̀.
  to: Ọ̀pọ̀lọpọ̀ ènìyàn sì ń tẹ̀ lé e, pẹ̀lú àwọn obìnrin tí wọ́n ń lu àyà wọn, tí wọ́n sì ń ṣọ̀fọ̀ rẹ̀.
  rationale: The revision is limited to the opening noun phrase. It preserves the source’s large multitude, the inclusion of women, and the ongoing mourning actions, while avoiding the misleading sense that the people themselves were “large.”
