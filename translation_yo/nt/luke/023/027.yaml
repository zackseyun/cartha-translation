  register: Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún, a sì pa ìṣe tí ń lọ lọ́wọ́ nínú àwọn ọ̀rọ̀-ìṣe aláìpé Gíríìkì mọ́.
