  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: yo
  text: Àwọn ọmọ ogun náà sì fi í ṣe ẹlẹ́yà; wọ́n sún mọ́ ọn, wọ́n sì ń gbé wáìnì kíkan fún un[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọtí kíkan.” Ọ̀rọ̀ Gíríìkì náà, ὄξος, túmọ̀ sí wáìnì tí ó ti di kíkan, ohun mímu olówó pọ́ọ̀kú tí ó wọ́pọ̀ nígbà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ yìí fi ẹ̀gàn àti ìfiṣẹ̀sín ọ̀tá hàn ní èdè Yorùbá àdánidá, láì sọ ọ́ di eré tí kò lágbára.
- source_word: δὲ ... καὶ
  choice: náà sì
  rationale: Àpapọ̀ náà ń tẹ ìtàn síwájú, ó sì fi àwọn ọmọ ogun kún àwọn tí wọ́n ti ń fi Jésù ṣe ẹlẹ́yà.
- source_word: οἱ στρατιῶται
  choice: àwọn ọmọ ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá àwọn sójà Róòmù nínú ìṣẹ̀lẹ̀ náà mu.
- source_word: προσερχόμενοι
  choice: wọ́n sún mọ́ ọn
  rationale: Ó pa ìtumọ̀ ìṣípò wọn sí ọ̀dọ̀ Jésù mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ participle náà ní Yorùbá.
- source_word: ὄξος
  choice: ọtí wáìnì kíkan
  rationale: ὄξος jẹ́ ọtí wáìnì tí ó ti kan, ohun mímu olówó pọ́ọ̀kú tí a mọ̀ ní ayé ìgbà náà; yíyan yìí yẹra fún ìtumọ̀ òde òní ti ‘ọ̀tí kíkan’ gẹ́gẹ́ bí vinegar lasan.
- source_word: προσφέροντες
  choice: wọ́n sì fún un ní
  rationale: Ó sọ ìṣe fífi ohun mímu náà fún Jésù ní kedere, láì fi ète àánú tàbí ìkà sí ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ìdí tí àwọn ọmọ ogun fi fún Jésù ní ὄξος
  choice: A sọ ìṣe náà ní ọ̀nà àìṣègbè, ní àárín ìṣẹ̀lẹ̀ ẹlẹ́yà.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ìṣe àánú díẹ̀ tàbí gẹ́gẹ́ bí ìyọṣùtì nìkan.
  rationale: Àyíká ẹsẹ náà fi ẹlẹ́yà hàn, ṣùgbọ́n ẹsẹ yìí kò ṣàlàyé ète inú wọn ní pàtó; nítorí náà, ìtumọ̀ náà kò fi ìdájọ́ ọkàn tí ọ̀rọ̀ kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àwọn gbólóhùn aláṣẹ tó tẹ̀ lé ara wọn mú àwọn participle Gíríìkì wá sí Yorùbá àdánidá, nígbà tí semicolon pa ìbáṣepọ̀ àwọn ìṣe náà mọ́.
