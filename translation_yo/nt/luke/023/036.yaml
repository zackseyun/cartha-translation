  source_fidelity: 'Ìtumọ̀ náà mú ìfiṣẹ̀sín àwọn ọmọ ogun, ìsúnmọ́ Jésù, àti fífi ὄξος fún un hàn dáadáa. Ṣùgbọ́n “wọ́n sì fún un ní” lè dà bí ìṣe tí a ti parí (“wọn gave him”), níbi tí προσφέροντες jẹ́ participle tí ó ṣàpèjúwe ìṣe tí ń lọ pẹ̀lú ìfiṣẹ̀sín náà: wọ́n ń fún/un offer him the drink.'
  naturalness: “Àwọn ọmọ ogun náà sì fi í ṣe ẹlẹ́yà” àti “wọ́n sún mọ́ ọn” jẹ́ Yorùbá boṣewa, adayeba. “Wọ́n sì ń gbé wáìnì kíkan fún un” jẹ́ ọ̀nà adayeba láti fi ìṣe ìfúnni tí ń lọ hàn, ó sì yà kúrò nínú ìtumọ̀ pé wọ́n ti fi ẹ̀bùn náà lé e lọ́wọ́.
  terminology: “Àwọn ọmọ ogun” yẹ fún οἱ στρατιῶται, “fi í ṣe ẹlẹ́yà” yẹ fún ἐνέπαιξαν, àti “wáìnì kíkan” fi ìtumọ̀ ohun mímu acidic ti ὄξος hàn dáadáa láì dín un sí kíkán/condiment nìkan. Àlàyé ẹsẹ̀-ìsàlẹ̀ yẹ kí ó sọ pé ó jẹ́ wáìnì tí ó ti di kíkan, kì í ṣe pé “tí ó ti kan,” èyí tí kò pé ní Yorùbá.
