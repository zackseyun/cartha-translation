  to: Ṣùgbọ́n Hẹ́rọ́dù náà, pẹ̀lú àwọn ọmọ-ogun rẹ̀, kẹ́gàn rẹ̀, wọ́n sì fi í ṣe ẹlẹ́yà. Wọ́n wọ aṣọ ológo fún un[a], wọ́n sì rán an padà sí ọ̀dọ̀ Pílátù.
