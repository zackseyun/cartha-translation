id: LUK.23.11
reference: Luke 23:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: yo
  text: Ṣùgbọ́n Hẹ́rọ́dù náà, pẹ̀lú àwọn ọmọ-ogun rẹ̀, kẹ́gàn rẹ̀, wọ́n sì fi í ṣe ẹlẹ́yà. Wọ́n wọ aṣọ ológo fún un[a], wọ́n sì rán an padà sí ọ̀dọ̀ Pílátù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ dídán.” λαμπρὰν tún lè túmọ̀ sí “dídán”; ó sì ṣeé ṣe kí aṣọ náà jẹ́ apá kan nínú bí wọ́n ṣe ń fi ọlá èké ṣe ẹlẹ́yà Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: fi ẹ̀gàn ṣe é
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n kà á sí ẹni tí kò níye, wọ́n sì hùwà sí i pẹ̀lú ẹ̀gàn; gbólóhùn Yorùbá yìí mú ìṣe ìtìjú ní gbangba jáde lọ́nà àdánidá.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ogun rẹ̀
  rationale: Ó túmọ̀ sí àwọn ọmọ-ogun tàbí ẹgbẹ́ ológun; ‘àwọn ọmọ-ogun rẹ̀’ ṣe kedere, ó sì bá ìtàn náà mu.
- source_word: ἐμπαίξας
  choice: fi ṣe ẹlẹ́yà
  rationale: Ó túmọ̀ sí ṣíṣe ẹlẹ́yà tàbí fífi ẹni ṣe yẹ̀yẹ́; èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ní iyì fún àyíká ìtàn ìjìyà náà.
- source_word: περιβαλὼν
  choice: wọ ... fún un
  rationale: Ìṣe náà ni fífi aṣọ wọ ẹni; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì so ìṣe náà mọ́ aṣọ tó tẹ̀ lé e.
- source_word: ἐσθῆτα λαμπρὰν
  choice: aṣọ ológo
  rationale: ἐσθής jẹ́ aṣọ, λαμπρός sì lè jẹ́ dídán, ọ̀lá ńlá, tàbí ẹlẹ́wà. ‘Aṣọ ológo’ kò sọ pé aṣọ àwọ̀lékè kan ṣoṣo ni, ó sì pa ìtumọ̀ ọlá ẹ̀gàn tí àyíká náà lè ní mọ́.
- source_word: ἀνέπεμψεν
  choice: rán an padà
  rationale: Nínú àyíká ìdájọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí rírán ẹni padà sọ́dọ̀ aláṣẹ tó wà tẹ́lẹ̀.
- source_word: τῷ Πιλάτῳ
  choice: sí ọ̀dọ̀ Pílátù
  rationale: Orúkọ ẹni náà ni a kọ ní ọ̀nà tó bá ìpè Yorùbá mu; ‘sí ọ̀dọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ẹni tí a rán Jésù sí.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀gàn tó wà nínú fífi aṣọ wọ Jésù
  choice: A lo ‘aṣọ ológo’ láti pa ìrísí ọlá àti ẹ̀gàn tó wà nínú àyíká náà mọ́ láì sọ pàtó ju Gíríìkì lọ.
  alternative: A lè pè é ní aṣọ ọba pàtó, tàbí túmọ̀ rẹ̀ ní pàtàkì gẹ́gẹ́ bí àmì wèrè tàbí ìwà asán.
  rationale: Ẹsẹ̀ náà sọ ẹ̀gàn àti ṣíṣe ẹlẹ́yà, ó sì ṣeé ṣe kí aṣọ ológo náà jẹ́ apá kan ẹ̀gàn náà. Síbẹ̀, Gíríìkì kò sọ ní pàtó pé aṣọ ọba ni tàbí pé ó ní àmì míì; nítorí náà a pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A tún Hẹ́rọ́dù sọ ní gbólóhùn kejì láti jẹ́ kí ẹni tó ṣe ìṣe náà ṣe kedere, níwọ̀n bí àwọn ọmọ-ogun ti jẹ́ ọ̀pọ̀ nínú gbólóhùn àkọ́kọ́.
