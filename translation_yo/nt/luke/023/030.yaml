  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: yo
  text: Nígbà náà ni wọn yóò bẹ̀rẹ̀ sí í sọ fún àwọn òkè ńlá[a] pé, ‘Ẹ wó sórí wa,’ àti fún àwọn òkè kéékèèké[b] pé, ‘Ẹ bo wa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ yìí ń dún bí èdè àsọtẹ́lẹ̀ nípa ìdájọ́, pàápàá jù lọ Hóséà 10:8.
    reason: cross_reference
  - marker: b
    text: Tàbí, “Ẹ fi wa pamọ́.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “bo,” ṣùgbọ́n níbí ó tún ní èrò fífarapamọ́ kúrò lọ́wọ́ ìdájọ́ tó ń bọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó ń tọ́ka sí ìgbà tí ohun tí a sọ tẹ́lẹ̀ yóò ṣẹlẹ̀; ó sì jẹ́ ọ̀nà àdánidá láti fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní Yorùbá.
- source_word: ἄρξονται λέγειν
  choice: ni wọn yóò bẹ̀rẹ̀ sí í sọ
  rationale: Ìtumọ̀ yìí pa agbára ìbẹ̀rẹ̀ tó wà nínú ἄρξονται mọ́, dípò kí a túmọ̀ rẹ̀ sí ‘wọn yóò sọ’ lásán.
- source_word: τοῖς ὄρεσιν
  choice: fún àwọn òkè ńlá
  rationale: ὄρος lè túmọ̀ sí òkè, ṣùgbọ́n ‘òkè ńlá’ mú ìyàtọ̀ rẹ̀ sí βουνός tó tẹ̀ lé e hàn kedere.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Ẹ wó lu wa
  rationale: Πέσετε jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn ohun, ἐπί pẹ̀lú accusative sì ń fi ìṣípò sí orí tàbí sí ara wọn hàn; ‘wó lu wa’ jẹ́ Yorùbá àdánidá tó pa àwòrán náà mọ́.
- source_word: τοῖς βουνοῖς
  choice: fún àwọn òkè kéékèèké
  rationale: βουνός sábà ń tọ́ka sí òkè tí kò tóbi bí ὄρος; àṣàyàn yìí pa ìyàtọ̀ ọ̀rọ̀ méjèèjì mọ́.
- source_word: Καλύψατε ἡμᾶς
  choice: Ẹ bo wa mọ́lẹ̀
  rationale: καλύπτω túmọ̀ ní pàtàkì sí ‘bo’; ‘bo wa mọ́lẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì tún lè gbé èrò fífarapamọ́ kúrò níwájú ìdájọ́.
theological_decisions:
- issue: Èdè àsọtẹ́lẹ̀ nípa ìdájọ́
  choice: A pa igbe gidi sí àwọn òkè ńlá àti àwọn òkè kéékèèké mọ́ láì fi àlàyé ìtumọ̀ kún un nínú ẹsẹ náà.
  alternative: Kí a túmọ̀ ọ́ lọ́nà ìtumọ̀ jinlẹ̀ sí ẹ̀bẹ̀ láti fara pamọ́ fún ìdájọ́.
  rationale: Ọ̀rọ̀ náà ń dún bí Hóséà 10:8, ó sì lo àwòrán gidi láti sọ ìbẹ̀rù ìdájọ́. Pípa àwòrán náà mọ́ kò yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘òkè ńlá’ àti ‘òkè kéékèèké’ láti pa ìyàtọ̀ ὄρος/βουνός mọ́; àwọn àmì ohùn ni a fi sí ibi tó yẹ.
