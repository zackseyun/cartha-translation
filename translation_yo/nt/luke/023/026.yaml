id: LUK.23.26
reference: Luke 23:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: yo
  text: Nígbà tí wọ́n ń mú Jésù lọ, wọ́n gbá Símónì ará Kírénè kan mú, ẹni tí ó ń bọ̀ láti ìgbèríko[a]. Wọ́n sì gbé àgbélébùú[b] lé e, kí ó gbé e lẹ́yìn Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti oko.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí oko kan ní pàtó tàbí sí ìgbèríko lápapọ̀ níta ìlú.
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan gbà pé “àgbélébùú” níbí ń tọ́ka ní pàtó sí igi apá rẹ̀; ṣùgbọ́n ohun tí ọ̀rọ̀ Gíríìkì sọ ní tààrà ni “àgbélébùú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: wọ́n ń mú Jésù lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú tàbí ṣíṣamọ̀nà ẹnì kan lọ. Fífi orúkọ Jésù dípò arọ́pò-orúkọ mú kí Yorùbá ṣe kedere láì yí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí padà.
- source_word: ἐπιλαβόμενοι
  choice: wọ́n gbá ... mú
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé wọ́n dìímú lójijì tàbí láì fún un ní ààyè láti kọ̀, ó sì bá ìṣe líle tí ọ̀rọ̀ Gíríìkì náà ń sọ mu.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: Símónì ará Kírénè kan
  rationale: ‘Kan’ pa ìtumọ̀ τινα mọ́, ‘ará Kírénè’ sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó jẹ́ ẹni láti Kírénè.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: ẹni tí ó ń bọ̀ láti ìgbèríko
  rationale: ἀγρός lè tọ́ka sí oko pàtó tàbí sí agbègbè ìgbèríko níta ìlú. ‘Ìgbèríko’ bá àwòrán ẹni tí ń wọ ìlú láti òde mu, àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ ‘oko’ mọ́ gẹ́gẹ́ bí àṣàyàn.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: wọ́n gbé àgbélébùú lé e
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbígbé ẹrù kan lé ẹnì kan, ó sì pa ìtumọ̀ pé wọ́n fi ẹrù náà lé e lọ́rùn mọ́.
- source_word: τὸν σταυρὸν
  choice: àgbélébùú
  rationale: σταυρός túmọ̀ sí àgbélébùú ní tààrà; kò yẹ kí a mú un ṣe pàtó sí igi àgbélébùú apá nítorí ọ̀rọ̀ Gíríìkì kò sọ bẹ́ẹ̀.
- source_word: φέρειν ὄπισθεν τοῦ Ἰησοῦ
  choice: kí ó gbé e lẹ́yìn Jésù
  rationale: Gbólóhùn yìí pa ìṣe gbígbé ohun kan àti ipò Símónì lẹ́yìn Jésù mọ́ láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bóyá σταυρός yẹ kí a túmọ̀ rẹ̀ ní pàtó sí igi àgbélébùú apá
  choice: àgbélébùú
  alternative: igi àgbélébùú apá
  rationale: Orísun Gíríìkì lo σταυρός, kì í ṣe ọ̀rọ̀ kan tó ń sọ apá igi náà ní pàtó. ‘Àgbélébùú’ tẹ̀ lé ìtumọ̀ ọ̀rọ̀ náà, kò sì fi àlàyé ìtàn tí ẹsẹ̀ náà kò sọ sí i.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
