source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: yo
  text: Sì wò ó, ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jósẹ́fù, tí ó jẹ́ ọmọ ìgbìmọ̀, ọkùnrin rere àti olódodo[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọkùnrin rere àti ẹni tí ó ń ṣe ohun tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa àmì ìtàn Lúùkù àti ọ̀rọ̀ tí ń pe àfiyèsí mọ́, láì mú un kúrò nítorí dídán ọ̀rọ̀.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Níhìn-ín, ἀνήρ ń tọ́ka sí ọkùnrin àgbà kan pàtó; ‘ọkùnrin kan’ jẹ́ ọ̀nà àdánidá láti fi ẹni tuntun hàn nínú ìtàn Yorùbá.
- source_word: ὀνόματι Ἰωσὴφ
  choice: tí orúkọ rẹ̀ ń jẹ́ Jósẹ́fù
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìlànà fífi orúkọ ẹni náà hàn mọ́.
- source_word: βουλευτὴς ὑπάρχων
  choice: tí ó jẹ́ ọmọ ìgbìmọ̀
  rationale: βουλευτής túmọ̀ sí ẹni tó jẹ́ ara ìgbìmọ̀ alákòóso; ‘ọmọ ìgbìmọ̀’ ṣe kedere sí òǹkàwé òde òní, kò sì sọ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: ọkùnrin rere àti olódodo
  rationale: A tún ‘ọkùnrin’ sọ gẹ́gẹ́ bí Gíríìkì ṣe tún ἀνήρ sọ fún ìtẹnumọ́. ‘Rere’ bá ἀγαθός mu, ‘olódodo’ sì pa ìtumọ̀ ìwà rere àti ìbámu pẹ̀lú òdodo inú δίκαιος mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δίκαιος nínú àpèjúwe ìwà Jósẹ́fù
  choice: olódodo
  alternative: ẹni tí ó ń ṣe ohun tí ó tọ́
  rationale: ‘Olódodo’ lè sọ ìwà títọ́ níwájú Ọlọ́run àti ènìyàn, láì sọ ọ́ di ẹ̀kọ́ ìgbàlà pàtó. Àfikún ìsàlẹ̀ fi ààyè sílẹ̀ fún ìtumọ̀ ìdájọ́ tàbí ìwà títọ́ tí δίκαιος tún lè ní.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Sì kíyèsí i’ láti pa agbára ἰδού mọ́; a sì fi àmì ìdádúró gígùn sí òpin nítorí gbólóhùn náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
