  to: Nítorí, kíyèsí i, ọjọ́ ń bọ̀ nígbà tí wọn yóò sọ pé, ‘Alábùkún ni àwọn obìnrin àgàn, àti àwọn ilé-ọmọ tí kò bímọ rí, àti àwọn ọmú tí kò fún ọmọ ní ọmú rí.’
