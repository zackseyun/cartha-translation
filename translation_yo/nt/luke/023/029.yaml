language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: yo
  text: Nítorí, kíyèsí i, ọjọ́ ń bọ̀ nígbà tí wọn yóò sọ pé, ‘Alábùkún ni àwọn obìnrin àgàn, àti àwọn ilé-ọmọ tí kò bímọ rí, àti àwọn ọmú tí kò fún ọmọ ní ọmú rí.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: ẹ wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìkíni tó ń fa àfiyèsí sí ohun tó dájú pé ó ń bọ̀; ‘ẹ wò ó’ jẹ́ èdè Yorùbá àdánidá, ó sì bá ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀ mu.
- source_word: στεῖραι
  choice: àwọn obìnrin tí wọn yàgàn
  rationale: Ó sọ ní kedere nípa àwọn obìnrin tí wọn kò lè bímọ, láìfi ìtumọ̀ ẹ̀sìn míì kún un.
- source_word: κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: àwọn ilé-ọmọ tí kò bímọ rí
  rationale: A pa àwòrán ara inú ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà tí ó ṣeé lóye ní Yorùbá; ‘rí’ ń fi hàn pé wọn kò bímọ rárá títí di àkókò náà.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: àwọn ọmú tí kò fún ọmọ ní ọmú rí
  rationale: Nínú àyíká yìí, ἔθρεψαν túmọ̀ sí fífún ọmọ ní ọmú; yíyan ọ̀rọ̀ yìí jẹ́ kedere, ó sì pa ìfararọ̀ gbolóhùn náà mọ́.
- source_word: Μακάριαι
  choice: Alábùkún-fún ni
  rationale: Ó gbé ìkéde pé a ó ka irú àwọn ẹni wọ̀nyí sí alábùkún-fún jáde, láìsọ pé àìlèbímọ fúnra rẹ̀ ni ìbùkún ní gbogbo ipò.
theological_decisions:
- issue: Ìtumọ̀ ìkéde ‘alábùkún-fún’ ní àárín ìdájọ́ tó ń bọ̀
  choice: 'Pa ìyípadà tó múni lẹ́rù mọ́: a ó pe àwọn tí wọn kò bímọ ní alábùkún-fún.'
  alternative: Ṣàlàyé nínú ẹsẹ̀ náà pé wọn ní oríire nítorí àwọn ọmọ kò ní jìyà.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìdí náà ní tààrà; fífi àlàyé náà sínú ẹsẹ̀ yóò dín agbára àti ìfarapamọ́ ọ̀rọ̀ Jésù kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A pa ìtẹ̀síwájú mẹ́ta—àwọn obìnrin, àwọn ilé-ọmọ, àti àwọn ọmú—mọ́, pẹ̀lú àwòrán líle tí ọ̀rọ̀ orísun ní. Kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún un.
