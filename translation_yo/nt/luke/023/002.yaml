id: LUK.23.2
reference: Luke 23:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: yo
  text: Wọ́n sì bẹ̀rẹ̀ sí í fẹ̀sùn kàn án pé, “A rí ọkùnrin yìí tí ó ń mú orílẹ̀-èdè wa ṣìnà[a], tí ó sì ń dí wa lọ́wọ́ láti san owó-orí fún Késárì[b], tí ó sì ń sọ pé òun fúnra rẹ̀ ni Mèsáyà[c], ọba kan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ó ń da orílẹ̀-èdè wa rú” tàbí “tí ó ń ṣamọ̀nà orílẹ̀-èdè wa sí ọ̀nà àìtọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì φόρους túmọ̀ sí owó-orí tàbí owó-ìjọba tí a ń san fún alákòóso Romu.
    reason: cultural_note
  - marker: c
    text: Tàbí “tí ó ń sọ pé òun fúnra rẹ̀ ni Kristi, ọba kan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Wọ́n sì bẹ̀rẹ̀ sí í fẹ̀sùn kàn án
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ inú ἤρξαντο mọ́, ó sì lo ọ̀rọ̀ Yorùbá tó bójú mu fún ẹ̀sùn níwájú ilé-ẹjọ́.
- source_word: Τοῦτον εὕραμεν
  choice: A rí ọkùnrin yìí
  rationale: “Ọkùnrin yìí” jẹ́ ọ̀nà àdánidá láti fi demonstrative náà hàn, pẹ̀lú agbára ìtọ́ka rẹ̀ nínú ẹ̀sùn.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: tí ó ń mú orílẹ̀-èdè wa ṣìnà
  rationale: “Mú ... ṣìnà” jẹ́ Yorùbá òde òní tí ó ṣe kedere, tí kò sì fi dandan pinnu bóyá ẹ̀sùn náà jẹ́ ti ìṣèlú tàbí ti ìtanilẹ́kọ̀ọ́ èké.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: tí ó sì ń kọ̀ fún wa láti san owó-orí fún Kesari
  rationale: “Ń kọ̀ fún wa” fi ẹ̀sùn ìdènà tàbí ìfòfin dè hàn; “owó-orí” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún φόρους, Kesari sì pa orúkọ oyè Romu mọ́.
- source_word: λέγοντα αὑτὸν
  choice: tí ó sì ń sọ pé òun fúnra rẹ̀
  rationale: “Òun fúnra rẹ̀” pa ìtẹnumọ́ reflexive αὑτόν mọ́.
- source_word: χριστὸν βασιλέα εἶναι
  choice: ni Messia, ọba kan
  rationale: “Messia” fi Χριστός hàn gẹ́gẹ́ bí oyè ẹni àmì òróró; “ọba kan” pa βασιλέα mọ́ lọ́tọ̀ láì da àwọn méjèèjì pọ̀ sí oyè kan ṣoṣo.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ χριστός nínú ẹ̀sùn ìṣèlú yìí
  choice: Messia
  alternative: Kristi
  rationale: Níhìn-ín χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọba ẹni àmì òróró, kì í ṣe bí orúkọ ẹni; “Messia” pa àyíká Júù àti agbára ìṣèlú ẹ̀sùn náà mọ́.
- issue: Ìbáṣepọ̀ χριστόν àti βασιλέα
  choice: Messia, ọba kan
  alternative: Messia Ọba náà
  rationale: Gíríìkì fi àwọn ọ̀rọ̀ méjèèjì sílẹ̀ gẹ́gẹ́ bí àpèjúwe ẹni náà. Ìtumọ̀ yìí kò da wọn pọ̀ sí àkọlé ẹ̀kọ́ ìgbàgbọ́ kan, ó sì pa ìṣòro ìtumọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “fẹ̀sùn kàn” fún àyíká ilé-ẹjọ́, “Kesari” fún oyè Romu, àti “Messia” gẹ́gẹ́ bí oyè.
