  source_fidelity: 'Ìtumọ̀ gbólóhùn náà tọ́ka dáadáa sí ojúṣe/ìdí dandan láti dá ọkùnrin kan sílẹ̀ fún wọn ní àjọ̀dún. Síbẹ̀, “Ó sì pọn dandan fún un” kì í ṣe ọ̀nà Yorùbá boṣewa, tí ó rọrùn, láti sọ èrò náà. Pẹ̀lú èyí, àlàyé ìsàlẹ̀ ti gba ẹ̀sùn àṣìṣe nínú ọ̀nà ìtàn-àfọwọ́kọ Gẹ̀ẹ́sì: Codex Sinaiticus (א) wà lára àwọn ẹlẹ́rìí àkọ́kọ́ tí ó fi ẹsẹ náà sílẹ̀, kì í ṣe ẹlẹ́rìí tí ó ní i.'
