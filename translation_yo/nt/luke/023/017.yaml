revisions:
- from: Ó sì pọn dandan fún un láti dá ọkùnrin kan sílẹ̀ fún wọn ní àkókò àjọ̀dún náà.[a]
  to: Ó sì ní ojúṣe láti dá ọkùnrin kan sílẹ̀ fún wọn ní àjọ̀dún náà.[a]
  rationale: A tún ìtumọ̀ gbolohun pàtàkì náà ṣe sí Yorùbá adayeba, ní mímú ìtumọ̀ “had an obligation/was under necessity” àti àsopọ̀ δέ (“sì”) mọ́. A pa “ọkùnrin kan,” “fún wọn,” àti àkókò àjọ̀dún mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ní wọn. A sì ṣàtúnṣe àlàyé ìsàlẹ̀ fún òtítọ́ ìtàn-àfọwọ́kọ, ní pàtàkì nípa Sinaiticus, láì sọ ìjìnlẹ̀ ìdí tí ẹsẹ náà fi wà tàbí kò sí gẹ́gẹ́ bí ohun tí a ti dájú pátápátá.
  reviewer_model: gpt-5.6-terra
