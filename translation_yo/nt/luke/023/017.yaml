  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: yo
  text: Ó sì ní ojúṣe láti dá ọkùnrin kan sílẹ̀ fún wọn ní àjọ̀dún náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbogbo ẹsẹ yìí kò sí nínú ọ̀pọ̀ lára àwọn àfọwọ́kọ Gíríìkì ìjímìjí, títí kan Pápírù 75 ti ọ̀rúndún kẹta àti àwọn códẹ́ẹ̀sì Vaticanus àti Sinaiticus ti ọ̀rúndún kẹrin; bẹ́ẹ̀ ni kò sí nínú àwọn ẹ̀dà Kọ́pítì ìjímìjí kan. Ó wà nínú àwọn àfọwọ́kọ Gíríìkì mìíràn, nínú àṣà àfọwọ́kọ Látìn, àti nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ Baisántíìnì tí ó wá lẹ́yìn náà. Ó lè jẹ́ pé àwọn akọ̀wé fi kún un láti mú kí ìtàn Lúùkù bá àṣà ìdásílẹ̀ tí Mátíù 27:15 àti Máàkù 15:6 mẹ́nu kàn mu. Àwọn àfọwọ́kọ kan fi gbólóhùn yìí sí lẹ́yìn ẹsẹ 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: Ó sì pọn dandan fún un
  rationale: Ọ̀rọ̀ àdàpọ̀ Gíríìkì yìí túmọ̀ sí pé ohun náà jẹ́ dandan tàbí ojúṣe fún un; èdè Yòrùbá yìí jẹ́ àdánidá, ó sì fi ìfipámú àṣà tàbí ojúṣe náà hàn.
- source_word: ἀπολύειν
  choice: dá … sílẹ̀
  rationale: Nínú ọ̀rọ̀ ẹjọ́ àti ìgbèkùn, gbólóhùn yìí túmọ̀ sí yíyọ ẹnì kan kúrò ní àhámọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí pa ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́ sí àwọn ènìyàn tí a ó dá ẹlẹ́wọ̀n náà sílẹ̀ fún.
- source_word: κατὰ ἑορτήν
  choice: ní àkókò àjọ̀dún náà
  rationale: Èyí sọ àṣà tí a ń ṣe ní àkókò àjọ̀dún Pásíkà ní èdè Yòrùbá tí ó ṣe kedere, láì fi orúkọ àjọ̀dún tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἕνα
  choice: ọkùnrin kan
  rationale: Nọ́ńbà akọ ẹyọ kan ní Gíríìkì ń tọ́ka sí ẹlẹ́wọ̀n ọkùnrin kan; yíyan ‘ọkùnrin kan’ jẹ́ kedere ní àyíká ọ̀rọ̀ náà.
- source_word: δέ
  choice: sì
  rationale: ‘Sì’ ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀ onírẹ̀lẹ̀, láì sọ ọ́ di àmì àkókò bí ‘ní báyìí.’
theological_decisions: []
translation_notes:
  register: Èdè Yòrùbá boṣewa, títọ́, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn nítorí pé àlàyé náà kan gbogbo ẹsẹ.
