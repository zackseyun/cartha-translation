  terminology: “ojúṣe,” “dá … sílẹ̀,” àti “àjọ̀dún” jẹ́ àwọn ọ̀rọ̀ tó bá ìforúkọsílẹ̀ òfin/àṣà àti ọ̀rọ̀ ìsìn inú ẹsẹ náà mu. A kò darúkọ Pásíkà nínú ìtumọ̀, nítorí ẹsẹ Gíríìkì kò darúkọ rẹ̀. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ láti má ṣe sọ pé Sinaiticus ní ẹsẹ náà.
