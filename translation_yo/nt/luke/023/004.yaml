  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: yo
  text: Nígbà náà ni Pilatu sọ fún àwọn olórí àlùfáà àti àwọn ogunlọ́gọ̀ pé, “Èmi kò rí ìdí kankan[a] láti fi ẹ̀sùn kàn ọkùnrin yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Èmi kò rí ẹ̀bi kankan lára ọkùnrin yìí.” Ọ̀rọ̀ Gíríìkì αἴτιον lè túmọ̀ sí “ẹ̀bi,” ṣùgbọ́n níhìn-ín ó ní ìtumọ̀ ilé-ẹjọ́: kò sí ìdí tó bófin mu láti fi ẹ̀sùn kàn án.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ; “Nígbà náà ni” ń mú ìtẹ̀síwájú ìtàn Lúùkù jáde ní Yorùbá àdánidá láìfi ìtakora tí kò pọndandan sí i.
- source_word: Πιλᾶτος
  choice: Pilatu
  rationale: Ìkọ orúkọ ẹni náà ní ìbámu pẹ̀lú àṣà ìkọ orúkọ Bíbélì ní Yorùbá.
- source_word: εἶπεν πρὸς
  choice: sọ fún
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí pé ó bá wọn sọ̀rọ̀; “sọ fún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà, kì í ṣe pé gbogbo wọn ló ń di ipò àlùfáà àgbà kan ṣoṣo mú.
- source_word: ὄχλους
  choice: àwọn ogunlọ́gọ̀
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, ó sì tọ́ka sí ọ̀pọ̀ àwọn ènìyàn tí ó péjọ.
- source_word: Οὐδὲν εὑρίσκω
  choice: Èmi kò rí ... kankan
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdájọ́ tí Pilatu ń sọ ní àkókò náà, ó sì pa agbára àìní náà mọ́.
- source_word: αἴτιον
  choice: ìdí ... láti fi ẹ̀sùn kan
  rationale: Nínú ọ̀rọ̀ ilé-ẹjọ́ yìí, αἴτιον túmọ̀ sí ìpìlẹ̀ tó bófin mu fún ẹ̀sùn; gbolóhùn yìí mú ìtumọ̀ òfin náà ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: kan ọkùnrin yìí
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν lè túmọ̀ sí “nínú,” ọ̀rọ̀ ilé-ẹjọ́ náà ń béèrè fún Yorùbá àdánidá “fi ẹ̀sùn kan”; “ọkùnrin yìí” sì pa akọ àti atọ́ka náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéwọ̀n, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “àwọn olórí àlùfáà” fún aṣáájú ẹgbẹ́ àlùfáà, àti “àwọn ogunlọ́gọ̀” láti pa ọ̀pọ̀ nọ́ńbà orísun mọ́. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí ó kan.
