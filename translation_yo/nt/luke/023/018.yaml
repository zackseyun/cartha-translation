source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo wọn jọ ké jáde pé, “Mú ọkùnrin yìí kúrò, kí o sì dá Bárábà sílẹ̀ fún wa!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: ké jáde
  rationale: Ọ̀rọ̀ náà túmọ̀ sí igbe ohùn rara; ‘ké jáde’ jẹ́ èdè Yorùbá àdánidá tí ó pa agbára igbe náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níhìn-ín, δέ fi ìyàtọ̀ sí ohun tí ó ṣáájú hàn, nítorí náà ‘Ṣùgbọ́n’ bá ìṣàn ọ̀rọ̀ mu.
- source_word: παμπληθεὶ
  choice: gbogbo wọn jọ
  rationale: Ó fi hàn pé gbogbo àwùjọ náà ṣe ohun kan náà ní ìṣọ̀kan, láìfi kún un pé ohùn wọn jẹ́ ọ̀kan ní ti gidi.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣàgbékalẹ̀ ohun tí wọ́n ké sọ.
- source_word: Αἶρε
  choice: Mú ... kúrò
  rationale: Àṣẹ náà béèrè pé kí a yọ Jesu kúrò níwájú wọn; ‘Mú ... kúrò’ jẹ́ àdánidá, ó sì pa agbára àṣẹ náà mọ́ láìsọ ìpànìyàn ní tààràtà ju Gíríìkì lọ.
- source_word: τοῦτον
  choice: ọkùnrin yìí
  rationale: Ó pa ìtọ́kasí ẹni tí ó wà níwájú wọn mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere ju ‘ẹni yìí’ lọ nínú àyíká yìí.
- source_word: ἀπόλυσον
  choice: dá ... sílẹ̀
  rationale: ‘Dá ... sílẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún yíyọ ẹni kan kúrò ní àhámọ́ tàbí àtìmọ́lé.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dátífù náà tọ́ka sí àwọn tí ìtúsílẹ̀ náà jẹ́ fún; ‘fún wa’ jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸν Βαραββᾶν
  choice: Bárábà
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá, pẹ̀lú àmì ohùn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘gbogbo wọn jọ’ láti fi ìṣe àpapọ̀ hàn, àti ‘Mú ọkùnrin yìí kúrò’ láti pa àṣẹ Gíríìkì mọ́ láìṣàlàyé àbájáde rẹ̀ ju bí orísun ṣe sọ lọ.
