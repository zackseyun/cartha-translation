  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: yo
  text: Ìkọ̀wé kan sì wà lókè rẹ̀, tí a kọ pé, “Èyí ni Ọba àwọn Júù.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àmì,” “ìkéde,” tàbí “ẹ̀sùn tí a kọ sílẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní orí rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, Gíríìkì ní, “Ọba àwọn Júù, ẹni yìí.”
    reason: lexical_alternative
  - marker: d
    text: Ní àwọn àyíká ọ̀rọ̀ kan, “àwọn Júù” lè túmọ̀ sí “àwọn ará Jùdíà”; ṣùgbọ́n nínú àkọlé àgbélébùú tí a mọ̀ yìí, “àwọn Júù” ni ìtumọ̀ tó bá àṣà àti àyíká ọ̀rọ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: àkọlé
  rationale: Ó tọ́ka sí ohun tí a kọ sí ibi tí gbogbo ènìyàn lè rí; “àkọlé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ gígùn náà mọ́ láì fi dandan sọ pé ẹ̀sùn òfin ni.
- source_word: ἐπ’ αὐτῷ
  choice: lókè rẹ̀
  rationale: Nínú ọ̀rọ̀ nípa àgbélébùú, gbólóhùn náà ń tọ́ka sí ibi tí àkọlé náà wà ní ìbámu pẹ̀lú Jésù; “lókè rẹ̀” jẹ́ èdè Yorùbá àdánidá, ó sì fi ipò náà hàn.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Èyí ni Ọba àwọn Júù
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níhìn-ín, ó sì fi οὗτος tẹnumọ́ ẹni tí àkọlé náà ń tọ́ka sí. Yorùbá ń lo “ni” lọ́nà àdánidá láti so àwọn apá náà pọ̀, “Èyí” sì pa agbára ìtọ́ka náà mọ́.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú àkọlé àgbélébùú yìí, “àwọn Júù” ni ìtumọ̀ ẹ̀yà àti ìṣèlú tó bá àyíká ọ̀rọ̀ mu, ó sì jẹ́ ìtumọ̀ tí a mọ̀ dáadáa.
- source_word: δὲ καὶ
  choice: sì ... pẹ̀lú
  rationale: “Sì” so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú, “pẹ̀lú” sì mú agbára àfikún καί jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú àkọlé tí a gbé sí àgbélébùú
  choice: Túmọ̀ ọ̀rọ̀ tí a kọ síbẹ̀ gẹ́gẹ́ bí àkọlé tó ń pe Jésù ní “Ọba àwọn Júù,” láì fi àlàyé kún un nípa ẹ̀gàn, ẹ̀sùn òfin, tàbí ìjẹ́wọ́ Mèsáyà.
  alternative: Túmọ̀ ọ́ ní pàtó gẹ́gẹ́ bí ẹ̀sùn òfin, tàbí ṣàfikún ìtumọ̀ ẹ̀gàn tàbí ìṣèlú.
  rationale: Ẹsẹ̀ náà kàn ròyìn pé àkọlé wà àti ohun tí a kọ sínú rẹ̀. Ìtumọ̀ yẹ kí ó pa ìdánimọ̀ àti ìforígbárí inú ọ̀rọ̀ náà mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò hàn gbangba sínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A yan “àkọlé” dípò ọ̀rọ̀ àjèjì bí “ìkọ̀wé,” a sì pa àìdánilójú nípa bóyá ẹ̀sùn òfin, ẹ̀gàn, tàbí ìjẹ́wọ́ ni àkọlé náà mọ́.
