- from: Nítorí bí wọ́n bá ń ṣe nǹkan wọ̀nyí sí igi tútù[a][b], kí ni yóò ṣẹlẹ̀ sí igi gbígbẹ?
  to: Nítorí bí wọ́n bá ń ṣe nǹkan wọ̀nyí nígbà tí igi bá jẹ́ tútù[a][b], kí ni yóò ṣẹlẹ̀ nígbà tí ó bá gbẹ?
  rationale: Àtúnṣe náà yọ «sí» kúrò nítorí pé ó ń sọ ibi/àkókò àkàwé Gíríìkì di ohun tí ìṣe náà kan. «Nígbà tí» tẹ̀lé ìlànà ìtumọ̀ Gẹ̀ẹ́sì POB, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìyàtọ̀ igi tútù àti igi gbígbẹ mọ́. Àwòrán náà, ìbéèrè àsọyé, àti àìdánilójú nípa ẹni tí ó dúró fún igi kọ̀ọ̀kan wà ní ipamọ́.
  reviewer_model: gpt-5.6-terra
