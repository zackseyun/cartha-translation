id: LUK.23.31
reference: Luke 23:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: yo
  text: Nítorí bí wọ́n bá ń ṣe nǹkan wọ̀nyí nígbà tí igi bá jẹ́ tútù[a][b], kí ni yóò ṣẹlẹ̀ nígbà tí ó bá gbẹ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú igi tútù … nínú igi gbígbẹ.” Gíríìkì pa àwòrán náà mọ́ lọ́nà gangan; ìtumọ̀ inú ẹsẹ̀ sọ ọ́ gẹ́gẹ́ bí ìyàtọ̀ àsìkò láàárín igi tútù àti igi gbígbẹ kí ó lè hàn gedegbe ní Yorùbá.
    reason: lexical_alternative
  - marker: b
    text: 'Ó ṣeé ṣe kí àwòrán náà máa lọ láti ohun tí ó kéré sí ohun tí ó pọ̀ jù: bí wọ́n bá ń ṣe irú nǹkan bẹ́ẹ̀ nígbà tí igi bá jẹ́ tútù, kí ni yóò ṣẹlẹ̀ nígbà tí ó bá gbẹ?'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń fi ìdí ọ̀rọ̀ ìkìlọ̀ àti ẹkún tí ó ṣáájú hàn; “Nítorí” pa agbára ìdí náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: sí igi tútù
  rationale: “Sí” mú ìtumọ̀ pé ohun tí wọ́n ń ṣe kan igi náà jáde lọ́nà àdánidá, nígbà tí “igi tútù” pa àwòrán igi tuntun tí kò rọrùn láti jó mọ́.
- source_word: ὑγρῷ
  choice: tútù
  rationale: Nínú ìyàtọ̀ rẹ̀ sí ξηρός, ọ̀rọ̀ náà túmọ̀ sí igi tuntun tàbí igi tí ọ̀rin ṣì wà nínú rẹ̀; “tútù” ni ọ̀rọ̀ Yorùbá tó bójú mu láìsọ àwòrán náà di àlàyé.
- source_word: ξύλῳ
  choice: igi
  rationale: ξύλον lè jẹ́ igi, pákó tàbí ohun èlò igi; níbí, “igi” gba ìtumọ̀ àkàwé náà láyè láìfi ìtumọ̀ kan pàtó lé e lórí.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Èyí pa ọ̀pọ̀-orúkọ arọ́pò-orúkọ Gíríìkì mọ́, ó sì tọ́ka sí gbogbo ohun tí wọ́n ń ṣe láìdín ìtọ́kasí rẹ̀ kù.
- source_word: ποιοῦσιν
  choice: wọ́n bá ń ṣe
  rationale: “Wọ́n” pa ẹni tí ó ń ṣe é mọ́ láìsọ ẹni pàtó, “ń ṣe” sì fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: ἐν τῷ ξηρῷ
  choice: sí igi gbígbẹ
  rationale: A tún “igi” sọ kí ìyàtọ̀ láàárín igi tútù àti igi gbígbẹ ṣe kedere, kí àwòrán Gíríìkì sì dúró.
- source_word: τί γένηται
  choice: kí ni yóò ṣẹlẹ̀
  rationale: Ìbéèrè àsọyé náà ń tọ́ka sí àbájáde tí a ń retí; gbólóhùn yìí sọ agbára rẹ̀ ní Yorùbá òde òní.
theological_decisions:
- issue: Àwòrán àkàwé igi tútù àti igi gbígbẹ
  choice: Pa àwòrán náà mọ́ nínú ẹsẹ̀ láìsọ àwọn tí igi méjèèjì dúró fún.
  alternative: Ṣàlàyé “igi tútù” gẹ́gẹ́ bí Jésù, kí a sì sọ “igi gbígbẹ” di Jerusalẹmu tàbí àwọn ènìyàn rẹ̀; tàbí ka á sí òwe gbogbogbò láti ohun kékeré sí ohun tí ó pọ̀ jù.
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka láti inú ìjìyà aláìṣòdodo Jésù sí ìdájọ́ ńlá tí ń bọ̀, ṣùgbọ́n Gíríìkì kò sọ àwọn ẹni tí àwòrán náà dúró fún ní pàtó. Fífi àwòrán náà sílẹ̀ pa àìdánilójú àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “igi tútù” àti “igi gbígbẹ” gẹ́gẹ́ bí ìyàtọ̀ àdánidá, a sì yàgò fún ṣíṣàlàyé ẹni tí àwòrán kọ̀ọ̀kan dúró fún nínú ẹsẹ̀ fúnra rẹ̀.
