source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: yo
  text: Àwa náà sì ń gba ìyà tí ó yẹ fún ohun tí a ṣe[a], nítorí ó tọ́ sí wa[b]; ṣùgbọ́n ẹni yìí kò ṣe ohun tí kò tọ́ kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “à ń gba ohun tí ó yẹ fún ohun tí a ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “à ń jìyà lọ́nà tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: ó tọ́ sí wa
  rationale: Ó fi hàn pé ìjìyà wọn bá ohun tí wọ́n ṣe mu, ó sì pa ìtumọ̀ ìdájọ́ òdodo mọ́ ní Yorùbá àdánidá.
- source_word: ἄξια
  choice: ohun tí àwọn iṣẹ́ wa tọ́ sí
  rationale: Pẹ̀lú ἀπολαμβάνομεν, gbólóhùn yìí túmọ̀ sí àbájáde tí ó bá ìṣe wọn mu; ìtumọ̀ yìí ṣe kedere ní Yorùbá.
- source_word: ὧν ἐπράξαμεν
  choice: àwọn iṣẹ́ wa
  rationale: Ó ṣàkójọ ohun tí wọ́n ti ṣe gẹ́gẹ́ bí ìpìlẹ̀ fún ìjìyà tí wọ́n ń jẹ.
- source_word: ἀπολαμβάνομεν
  choice: a ń gba
  rationale: Àmì “ń” pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, bí ó ṣe wà nínú ọ̀rọ̀ ìṣe àkókò ìsinsìnyí Gíríìkì.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí Jésù, ó sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: οὐδὲν ἄτοπον
  choice: kò ṣe ohun tí kò tọ́ rárá
  rationale: Ó sọ àìlẹ́bi Jésù ní kedere láì fi ìtumọ̀ òfin tàbí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἔπραξεν
  choice: ṣe
  rationale: Ọ̀rọ̀ ìṣe Yorùbá “ṣe” bá ìtumọ̀ ìṣe tí a ti parí mu, ó sì dùn mọ́ etí nínú gbólóhùn yìí.
theological_decisions:
- issue: Bí a ṣe máa sọ ẹ̀rí ọ̀daràn náà nípa àìlẹ́bi Jésù
  choice: ṣùgbọ́n ọkùnrin yìí kò ṣe ohun tí kò tọ́ rárá
  alternative: ṣùgbọ́n ẹni yìí kò ṣe ohun àìbójúmu kankan
  rationale: Ìtumọ̀ náà pa ẹ̀rí ènìyàn sí àìlẹ́bi Jésù mọ́ nínú ọ̀rọ̀ ìdájọ́ tó yí i ká, láì mú un lọ sí ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu; a sì pa ìyàtọ̀ tó wà láàárín “àwa” àti “ọkùnrin yìí” mọ́.
