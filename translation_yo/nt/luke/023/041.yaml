  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń gbé èrò pàtàkì ẹsẹ̀ náà kalẹ̀: àwọn olùsọ̀rọ̀ méjì ń gba ìyà tí ó bá ohun tí wọ́n ṣe mu, ẹni yìí sì jẹ́ aláìlẹ́bi. Ṣùgbọ́n “ó tọ́ sí wa” kò dùn mọ́ etí gẹ́gẹ́ bí ọ̀nà Yorùbá láti sọ pé ìjìyà náà yẹ fún wọn, ó sì fi ohun tí wọ́n ń gbà sílẹ̀ ní àìmọ̀. Ìtúnṣe náà sọ ìjìyà tí àyíká ọ̀rọ̀ béèrè fún ní kedere, láì sọ ohun tí Gíríìkì kò pinnu.'
  naturalness: “Àti àwa pẹ̀lú” jẹ́ ìṣọ̀kan tí kò rọrùn, nítorí “àti” àti “pẹ̀lú” ń ṣe iṣẹ́ kan náà níbẹ̀. “Àwa náà sì” jẹ́ ọ̀nà Yorùbá ìgbàlódé tí ó dára, tó sì pa ìyàtọ̀ μὲν/δὲ mọ́. “Ohun tí kò tọ́ kankan” dára ju “ohun tí kò tọ́ rárá” lọ níbi tí ìkọ̀lù òdì “kò ... kankan” ti pé.
  terminology: “Ìyà tí ó yẹ fún ohun tí a ṣe” ń sọ ἄξια ... ἀπολαμβάνομεν ní ọ̀nà ìdájọ́ tó ṣe kedere. “Ẹni yìí” ń pa agbára ọ̀rọ̀ atọ́ka οὗτος mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìjọsìn kún un. “Ohun tí kò tọ́ kankan” ń fi ἄτοπον hàn gẹ́gẹ́ bí ohun tí kò yẹ/tabi tí kò tọ́, kì í sì ṣe ìpinnu òfin tó dín ìtumọ̀ náà kù.
  issues:
