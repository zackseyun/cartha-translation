    issue: “Àti àwa pẹ̀lú, ó tọ́ sí wa” kò dára gẹ́gẹ́ bí Yorùbá àdánidá, ó sì fi ohun tí ó tọ́ sí wọn sílẹ̀ ní àìmọ̀.
    rationale: δικαίως ní àyíká yìí ń sọ pé ìjìyà tí wọ́n ń gba yẹ fún wọn. Ṣíṣe ìyà náà ní kedere ń jẹ́ kí ìtumọ̀ náà rọrùn, ó sì ń tẹ̀lé ἀπολαμβάνομεν àti ἄξια.
  - severity: low
    issue: “rárá” lẹ́yìn “kò ṣe ohun tí kò tọ́” jẹ́ ìfikún ìfọwọ́sí tí kò nílò níbi tí “kankan” ti lè gbe ìtumọ̀ οὐδὲν dáadáa.
    rationale: Ìkọ̀lù “kò ... kankan” jẹ́ ìlò Yorùbá tí ó mọ́, tó sì ń fi “nothing” hàn láì tún ìkọ̀lù náà ṣe.
