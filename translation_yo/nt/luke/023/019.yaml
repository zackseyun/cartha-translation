id: LUK.23.19
reference: Luke 23:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: yo
  text: ẹni tí a ti jù sínú ẹ̀wọ̀n nítorí ìṣọ̀tẹ̀ kan tí ó ṣẹlẹ̀ ní ìlú náà[a], àti nítorí ìpànìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdìde sí ìjọba.” Ọ̀rọ̀ Gíríìkì στάσις lè túmọ̀ sí ìṣọ̀tẹ̀, ìdìde sí ìjọba, tàbí ìrúkèrúdò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Bárábà ní pàtó; ‘ẹni tí’ jẹ́ ọ̀nà àdánidá láti so àlàyé náà mọ́ ẹni tí a mẹ́nu kàn ṣáájú.
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative, διὰ ń fi ìdí tàbí ohun tí ó fà á hàn; ‘nítorí’ mú ìtumọ̀ yẹn jáde ní kedere.
- source_word: στάσιν τινὰ
  choice: ìṣọ̀tẹ̀ kan
  rationale: στάσις níhìn-ín ń tọ́ka sí ìdàrúdàpọ̀ olóṣèlú tàbí ìdìde sí àṣẹ. ‘Ìṣọ̀tẹ̀’ pa agbára ìtumọ̀ náà mọ́, ‘kan’ sì ṣe àfihàn àìsọ pàtó tí τινά ní.
- source_word: γενομένην ἐν τῇ πόλει
  choice: tí ó ṣẹlẹ̀ ní ìlú náà
  rationale: A sọ participle náà di gbólóhùn ìbátan ní Yorùbá kí ìṣe tí ó ṣẹlẹ̀ hàn gbangba, láì sọ pé ìlú náà ni Jerúsálẹ́mù nígbà tí Gíríìkì kò dárúkọ rẹ̀.
- source_word: φόνον
  choice: ìpànìyàn
  rationale: φόνος túmọ̀ sí pípa ènìyàn lọ́nà ọ̀daràn, kì í ṣe pípa lásán; ‘ìpànìyàn’ bá àyíká ẹ̀sùn ọ̀daràn mu.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: a ti jù sínú ẹ̀wọ̀n
  rationale: ‘Jù sínú ẹ̀wọ̀n’ pa agbára βάλλω mọ́, ‘ti’ sì fi hàn pé fífi í sẹ́wọ̀n ti ṣẹlẹ̀ ṣáájú ìṣẹ̀lẹ̀ tí a ń sọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bófin mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A pa ìlànà gbólóhùn náà mọ́ gẹ́gẹ́ bí àlàyé nípa Bárábà, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
