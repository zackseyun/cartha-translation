  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa: Jésù ké ní ohùn rara, ó bá Baba sọ̀rọ̀, ó fi ẹ̀mí rẹ̀ lé e lọ́wọ́, lẹ́yìn náà ó kú. Síbẹ̀, a tún un ṣe díẹ̀ láti mú ìṣe kígbe jáde hàn kedere àti láti lo ọ̀rọ̀ Yorùbá tó péye fún ‘breathed his last.’'
  naturalness: “Ké jáde ní ohùn rara” jẹ́ ọ̀nà tó rọrùn, tó sì dára ní Yorùbá òde-òní fún φωνήσας φωνῇ μεγάλῃ. “Ó mí ìmí ìkẹyìn” jẹ́ ìsọ̀rọ̀ tó péye ju “ó mí ìkẹyìn” lọ, nítorí ó sọ ohun tí a mí di mímọ́.
  terminology: “Baba,” “ọwọ́ rẹ,” àti “ẹ̀mí mi” dáa, wọ́n sì pa ìtumọ̀ àti ìwọ̀n ọ̀rọ̀ orísun mọ́. Àlàyé ìsàlẹ̀ nípa Sáàmù yẹ kí ó sọ “ẹ̀dà Gíríìkì ti Ìwé Mímọ́” dípò “Ìwé Mímọ́ Gíríìkì,” kí a má bà a dà bíi pé a ń tọ́ka sí apá ìwé mímọ́ kan tí a ń pè ní Gíríìkì.
