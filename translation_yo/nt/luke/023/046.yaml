source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: yo
  text: Jésù sì ké jáde ní ohùn rara, ó ní, “Baba, ọwọ́ rẹ ni mo fi ẹ̀mí mi lé.” Nígbà tí ó sì ti sọ èyí tan, ó mí ìmí ìkẹyìn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kú”; ní tààràtà, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí mímí jáde.
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ yìí ń ṣe ìrántí Sáàmù 31:5 nínú ẹ̀dà Gíríìkì ti Ìwé Mímọ́: “Ọwọ́ rẹ ni mo fi ẹ̀mí mi lé.”'
    reason: cross_reference
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: ké ní ohùn rara
  rationale: Ó mú ìtumọ̀ kíké tàbí pípe jáde pẹ̀lú ohùn tí ó ga hàn ní Yorùbá àdánidá, ó sì pa ìtẹnumọ́ orísun mọ́.
- source_word: Πάτερ
  choice: Baba
  rationale: Àpèjúwe taara ni; a kò fi ọ̀rọ̀ arọ́pò-orúkọ ‘mi’ kún un nítorí kò sí nínú Gíríìkì.
- source_word: εἰς χεῖράς σου παρατίθεμαι
  choice: ọwọ́ rẹ ni mo fi … lé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan fi ohun kan sí ìtọju ẹlòmíràn; ó tún pa àwòrán ‘ọwọ́’ mọ́.
- source_word: τὸ πνεῦμά μου
  choice: ẹ̀mí mi
  rationale: ‘Ẹ̀mí’ pa ìwọ̀n ìtumọ̀ πνεῦμα àti ìjìnlẹ̀ ọ̀rọ̀ àdúrà yìí mọ́ ju ‘èémí’ tí ó lè dà bí ìmí ara nìkan lọ.
- source_word: τοῦτο δὲ εἰπών
  choice: Nígbà tí ó sì ti sọ èyí tan
  rationale: Ó fi hàn ní kedere pé ọ̀rọ̀ náà ni ó kọ́kọ́ sọ kí ìṣẹ̀lẹ̀ pàtàkì tó tẹ̀ lé e ṣẹlẹ̀.
- source_word: ἐξέπνευσεν
  choice: ó mí ìkẹyìn
  rationale: Ọ̀rọ̀ àdánidá àti ọlọ́lá ní Yorùbá fún ikú ni, ó sì pa àwòrán mímí jáde tí ọ̀rọ̀ Gíríìkì ní mọ́.
theological_decisions:
- issue: Ìtumọ̀ τὸ πνεῦμά μου
  choice: ẹ̀mí mi
  alternative: èémí mi
  rationale: Àyíká àdúrà tí Jésù fi ara rẹ̀ lé Baba lọ́wọ́ ń tẹ̀ sí ‘ẹ̀mí’; síbẹ̀, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún ohun tí ẹsẹ náà sọ.
- issue: Ìṣe παρατίθεμαι gẹ́gẹ́ bí ìfara-ẹni-lé-ẹlòmíràn-lọ́wọ́
  choice: ọwọ́ rẹ ni mo fi ẹ̀mí mi lé
  alternative: mo fi ẹ̀mí mi sí ìtọju rẹ
  rationale: Ìtumọ̀ yìí mú ìṣe tí Jésù mọ̀ọ́mọ̀ ṣe láti fi ẹ̀mí rẹ̀ lé Baba lọ́wọ́ hàn, láìyanjú gbogbo ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó lè wà nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa tó lọ́lá, tó ṣe kedere, tí ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn níbi tí ó ti yẹ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
