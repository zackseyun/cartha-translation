  - severity: low
    issue: “Ìwé Mímọ́ Gíríìkì” nínú àlàyé ìsàlẹ̀ lè jẹ́ aláìṣalaye.
    rationale: Ohun tí a túmọ̀ sí ni ẹ̀dà Gíríìkì ti Sáàmù (Septuagint); “ẹ̀dà Gíríìkì ti Ìwé Mímọ́” ṣe é kedere.
