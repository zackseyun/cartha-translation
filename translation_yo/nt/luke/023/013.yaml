  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: yo
  text: Ṣùgbọ́n Pilatu pe àwọn olórí àlùfáà, àwọn alákòóso àti àwọn ènìyàn jọ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatu
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó bá ìlò Yorùbá mu, láì tú ìtumọ̀ orúkọ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré nínú ìtàn hàn, ó sì dára sí ìpadà ìtàn náà sọ́dọ̀ ìgbésẹ̀ Pilatu.
- source_word: συγκαλεσάμενος
  choice: pe ... jọ
  rationale: Gbólóhùn Yorùbá àdánidá yìí mú ìtumọ̀ pípè àwọn ènìyàn láti péjọ mú, ó sì pa ìṣe tí ó ṣáájú mọ́.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀pọ̀ orúkọ náà ń tọ́ka sí àwọn aṣáájú nínú àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo ló wà ní ipò lẹ́ẹ̀kan náà.
- source_word: ἄρχοντας
  choice: àwọn alákòóso
  rationale: Ó pa ìtumọ̀ àwọn ẹni tí wọ́n ní ipò ìṣàkóso tàbí àṣẹ mọ́ ju ọ̀rọ̀ gbogbogbò bí ‘aṣáájú’ lọ.
- source_word: λαὸν
  choice: àwọn ènìyàn
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún ẹgbẹ́ àwọn ènìyàn ní àpapọ̀, láì dín wọn kù sí ogunlọ́gọ̀ nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo. A lo ‘pe ... jọ’ láti jẹ́ kí àkójọpọ̀ ọ̀rọ̀ náà dun bí Yorùbá àdánidá, nígbà tí a ṣì pa ìbáṣepọ̀ àwọn ìṣe inú Gíríìkì mọ́.
