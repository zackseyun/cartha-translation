review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ ‘fẹ́rẹ̀ẹ́ tó’ yí ìwọ̀n-ìfojúsùn ὡσεὶ (‘nǹkan bí/about’) padà sí ‘ó sún mọ́ àkókò náà/almost.’ Ó yẹ kí a tún un ṣe kí ó máa fi hàn pé àkókò náà jẹ́ nǹkan bí wákàtí kẹfà. Ìyókù, pẹ̀lú ‘ilẹ̀’ àti àkọsílẹ̀ yíyàn ‘ayé,’ ń pa àìdájú γῆ mọ́ dáadáa.
  naturalness: ‘Ó ti jẹ́ nǹkan bí wákàtí kẹfà’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún ‘it was already about the sixth hour.’ Àkọsílẹ̀ àkókò náà tún yẹ kí ó lo ọ̀rọ̀ ìṣírò aago tí ó mọ́gbọ́n dání, kì í ṣe ‘ọ̀sán gangan,’ nítorí ὡσεὶ ń fi ìfojúsùn hàn.
  terminology: ‘Òkùnkùn,’ ‘ilẹ̀,’ ‘ayé,’ ‘wákàtí kẹfà,’ àti ‘wákàtí kẹsàn-án’ bá ọ̀rọ̀ orísun mu, wọ́n sì bójú mu nínú Yorùbá ìlànà. ‘Ilẹ̀’ nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú ‘ayé’ nínú àkọsílẹ̀, yẹ kí a dá dúró.
