source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: yo
  text: Ó sì ti jẹ́ nǹkan bí wákàtí kẹfà[a], òkùnkùn sì bo gbogbo ilẹ̀[b] títí di wákàtí kẹsàn-án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni pé, láti nǹkan bí aago méjìlá ọ̀sán títí di nǹkan bí aago mẹ́ta ọ̀sán.
    reason: cultural_note
  - marker: b
    text: Tàbí, “gbogbo ayé.” Ọ̀rọ̀ Gíríìkì γῆ lè túmọ̀ sí “ilẹ̀” tàbí “ayé.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: ó ti
  rationale: Ó fi hàn pé ìtàn náà ti dé àkókò yìí; ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: ὡσεὶ
  choice: fẹ́rẹ̀ẹ́ tó
  rationale: Ó pa ìtumọ̀ àfojúsùn mọ́, pé kì í ṣe àkókò pípé déédéé.
- source_word: ὥρα ἕκτη
  choice: wákàtí kẹfà
  rationale: Ó pa ọ̀nà tí orísun gbà sọ àkókò mọ́; àlàyé àkókò òde òní wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ jù lọ fún òkùnkùn ní àyíká ọ̀rọ̀ yìí.
- source_word: ἐγένετο
  choice: bo
  rationale: Pẹ̀lú òkùnkùn gẹ́gẹ́ bí olùṣe, ‘bo’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìṣẹ̀lẹ̀ náà hàn láìfikún ìtumọ̀ mìíràn.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: bo gbogbo ilẹ̀
  rationale: γῆ lè túmọ̀ sí ‘ilẹ̀’ agbègbè tàbí ‘gbogbo ayé.’ ‘Ilẹ̀’ kò fi dandan sọ pé gbogbo àgbáyé ni, ṣùgbọ́n àṣàyàn kejì wà nínú àkọsílẹ̀.
- source_word: ἕως ὥρας ἐνάτης
  choice: títí di wákàtí kẹsàn-án
  rationale: Ó pa ìsọ̀rí àkókò orísun mọ́, ó sì bá ‘wákàtí kẹfà’ mu.
theological_decisions:
- issue: Ìwọ̀n ibi tí γῆ tọ́ka sí nínú ọ̀rọ̀ nípa òkùnkùn
  choice: ilẹ̀
  alternative: gbogbo ayé
  rationale: Ọ̀rọ̀ Gíríìkì náà gba ìtumọ̀ agbègbè àti ti gbogbo àgbáyé. Ọ̀rọ̀ inú ẹsẹ̀ lo ‘ilẹ̀’ tí kò fi ìwọ̀n náà múlẹ̀ ju bó ṣe yẹ lọ, àkọsílẹ̀ sì pa ìtumọ̀ tó gbòòrò mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A pa ìṣírò wákàtí ìgbàanì mọ́ nínú ọ̀rọ̀, a sì ṣàlàyé rẹ̀ ní ìsàlẹ̀. Àwọn àmì ohùn ni a lò níbi tí ó bá yẹ.
