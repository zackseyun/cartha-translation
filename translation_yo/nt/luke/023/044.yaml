  to: Ó sì ti jẹ́ nǹkan bí wákàtí kẹfà[a], òkùnkùn sì bo gbogbo ilẹ̀[b] títí di wákàtí kẹsàn-án.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tó lè túmọ̀ sí ‘almost’ pẹ̀lú ‘nǹkan bí,’ láti pa ìfojúsùn ὡσεὶ mọ́. Ó tún mú àkọsílẹ̀ nípa ìṣírò aago bá ìfojúsùn náà mu. Kò yí ìtumọ̀, ìwọ̀n γῆ, tàbí ìforúkọsílẹ̀ ẹsẹ̀ padà.
