  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: yo
  text: Ó sì jẹ́ ọjọ́ Ìmúrasílẹ̀, ọjọ́ Ìsinmi sì ń bẹ̀rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan, “ọjọ́ Ìsinmi sì ń mọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ń mọ́” tàbí “ń bẹ̀rẹ̀”; níhìn-ín ó ń tọ́ka sí ìbẹ̀rẹ̀ ọjọ́ Ìsinmi ní ìrọ̀lẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: ọjọ́ Ìmúrasílẹ̀
  rationale: Nínú ìlò Gíríìkì àwọn Júù, παρασκευή jẹ́ orúkọ ọjọ́ tí wọ́n fi ń múra sílẹ̀ fún ọjọ́ Ìsinmi. Ìtumọ̀ yìí pa ìtumọ̀ ọ̀rọ̀ náà mọ́, kò sì fi ‘Ọjọ́ Ẹtì’ rọ́pò rẹ̀.
- source_word: σάββατον
  choice: ọjọ́ Ìsinmi
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún Sábáàtì àwọn Júù nínú àyíká yìí; bí ó tilẹ̀ jẹ́ pé àtẹ̀jáde Gíríìkì kò lo atọ́ka, ohun tí a ń tọ́ka sí dájú nínú àyíká ọ̀rọ̀.
- source_word: ἐπέφωσκεν
  choice: ń bẹ̀rẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘ń mọ́’ tàbí ‘ń bẹ̀rẹ̀.’ Níhìn-ín, ọjọ́ Ìsinmi ń wọlé ní ìrọ̀lẹ́; ‘ń bẹ̀rẹ̀’ jẹ́ èdè Yorùbá àdánidá tí kò ní mú kí òǹkàwé rò pé òwúrọ̀ ni.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: ó jẹ́ ọjọ́ Ìmúrasílẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìṣètò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ fi ìṣọ̀kan ìtàn àti ìbáṣepọ̀ àwọn gbólóhùn méjèèjì hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἐπέφωσκεν nípa ìbẹ̀rẹ̀ ọjọ́ Ìsinmi
  choice: Ọjọ́ Ìsinmi ń bẹ̀rẹ̀ ní ìrọ̀lẹ́.
  alternative: Ọjọ́ Ìsinmi ń mọ́.
  rationale: Àwọn Júù ń ka ọjọ́ láti ìrọ̀lẹ́ dé ìrọ̀lẹ́, ìsìnkú náà sì wáyé kí ìsinmi Sábáàtì tó bẹ̀rẹ̀. A lo ‘ń bẹ̀rẹ̀’ nínú ọ̀rọ̀ pàtàkì, a sì pa ìtumọ̀ gangan míì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. A kọ ‘Ìmúrasílẹ̀’ àti ‘Ìsinmi’ pẹ̀lú lẹ́tà ńlá gẹ́gẹ́ bí orúkọ ọjọ́ pàtó nínú àyíká àwọn Júù; àmì ohùn sì pé níbi tí ó ti yẹ.
