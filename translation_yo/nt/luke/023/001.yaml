id: LUK.23.1
reference: Luke 23:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: yo
  text: Nígbà náà, gbogbo àpéjọ wọn dìde, wọ́n sì mú un lọ sọ́dọ̀ Pílátù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ọ̀pọ̀ ènìyàn wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nígbà náà, ... sì
  rationale: Asopọ̀ ìtàn náà ń tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn èyí tó ṣáájú; “Nígbà náà” àti “sì” mú ìṣàn ìtàn náà ṣe déédéé ní Yorùbá láìfi ìtumọ̀ àfikún sí i.
- source_word: ἀναστὰν
  choice: dìde
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; “dìde” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé wọ́n kọ́kọ́ dìde kí wọ́n tó mú Jésù lọ.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: gbogbo àpéjọ wọn
  rationale: “Gbogbo” pa agbára ἅπαν mọ́, “àpéjọ” sì fi ẹgbẹ́ tí ó péjọ fún ìgbéjọ́ hàn láìsọ ọ́ di ilé-iṣẹ́ ìjọba pàtó ju ohun tí Gíríìkì sọ lọ; “wọn” tún pa αὐτῶν mọ́.
- source_word: ἤγαγον
  choice: wọ́n sì mú un lọ
  rationale: ἄγω lè túmọ̀ sí dárí, mú, tàbí kó ẹnì kan lọ. Nínú ọ̀rọ̀ àyíká ìdádúró yìí, “mú un lọ” jẹ́ Yorùbá àdánidá tó fi hàn pé wọ́n kó Jésù lọ sí ọ̀dọ̀ Pílátù.
- source_word: αὐτὸν
  choice: un
  rationale: Arọ́pò-orúkọ olùgbà tí ó tọ́ka sí Jésù ni; “un” ni irú rẹ̀ tó yẹ lẹ́yìn “mú” nínú gbolohun náà.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: sọ́dọ̀ Pílátù
  rationale: ἐπί pẹ̀lú accusative lẹ́yìn ọ̀rọ̀-ìṣe ìṣípò ń fi ìlọ sí ọ̀dọ̀ ẹni kan hàn; “sọ́dọ̀ Pílátù” jẹ́ àdánidá, ó sì yẹra fún fífi “níwájú Pílátù” kún un gẹ́gẹ́ bí ìtumọ̀ tó ti túbọ̀ ṣàlàyé.
- source_word: Πιλᾶτον
  choice: Pílátù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó wọ́pọ̀, tó sì bá ìró Yorùbá mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ kókó olùṣe tó jẹ́ ẹgbẹ́ nínú ọ̀rọ̀ àyíká ìgbéjọ́
  choice: gbogbo àpéjọ wọn
  alternative: gbogbo ọ̀pọ̀ ènìyàn wọn
  rationale: “Àpéjọ” bá ẹgbẹ́ tí ó ṣẹ̀ṣẹ̀ parí ìgbéjọ́ Jésù mu, ṣùgbọ́n kò sọ pé ilé-iṣẹ́ ìjọba pàtó ni ju bí πλῆθος ṣe sọ lọ. Àlàyé ìsàlẹ̀ pa ìtumọ̀ “ọ̀pọ̀ ènìyàn” mọ́ gẹ́gẹ́ bí àṣàyàn lexical.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbolohun náà tẹ̀ lé ìṣàn ìtàn àdánidá Yorùbá, ó sì pa ìtẹ̀lé ìṣe—dìde, lẹ́yìn náà mú un lọ—mọ́.
