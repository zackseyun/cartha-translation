  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: yo
  text: Ó sì sọ̀ ọ́ kalẹ̀, ó fi aṣọ ọ̀gbọ̀ dì í, ó sì fi í sí ibojì tí a gbẹ́ nínú àpáta,[a] níbi tí ẹnikẹ́ni kò tíì dùbúlẹ̀ sí rí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibojì gbígbẹ́ kan,” tàbí “ibojì tí a gbẹ́ jáde nínú àpáta.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “níbi tí a kò tíì fi ẹnikẹ́ni sí rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: sọ̀ ọ́ kalẹ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí yíyọ òkú Jésù kúrò lórí àgbélébùú. ‘Sọ̀ ọ́ kalẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà láìfi àlàyé míì kún un.
- source_word: ἐνετύλιξεν
  choice: dì í
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi aṣọ yí nǹkan ká tàbí dí i; ‘dì í’ ṣe kedere, ó sì bá ọ̀rọ̀ ìsìnkú mu.
- source_word: σινδόνι
  choice: fi aṣọ ọ̀gbọ̀
  rationale: Dative yìí fi ohun èlò tí a lò hàn. σινδών jẹ́ aṣọ ọ̀gbọ̀, nítorí náà gbolohun yìí bójú mu, kò sì fi ìtumọ̀ ‘aṣọ ìsìnkú’ tí ó túbọ̀ ṣe pàtó kún ọ̀rọ̀ náà.
- source_word: ἔθηκεν
  choice: tẹ́ ẹ sí
  rationale: Nínú àyíká ìsìnkú, ‘tẹ́ ẹ sí ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún fífi òkú sí ibojì.
- source_word: μνήματι
  choice: ibojì
  rationale: μνῆμα túmọ̀ sí ibi ìsìnkú tàbí ibojì; ‘ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere.
- source_word: λαξευτῷ
  choice: tí a gbẹ́ sínú àpáta
  rationale: λαξευτός ṣàpèjúwe ohun tí a gbẹ́ tàbí gé jáde nínú òkúta. ‘Tí a gbẹ́ sínú àpáta’ sọ irú ibojì náà ní kedere.
- source_word: οὗ
  choice: níbi tí
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí ibojì; ‘níbi tí’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: a kò tíì tẹ́ ẹnikẹ́ni sí rí
  rationale: Ìkójọpọ̀ ọ̀rọ̀ náà fi hàn pé wọn kò tíì fi ẹnikẹ́ni sínú ibojì náà. Ìtumọ̀ yìí pa οὔπω mọ́ gẹ́gẹ́ bí ‘kò tíì,’ ‘rí’ sì mú àìlò ibojì náà rí ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Àpèjúwe ìsìnkú àti irú ibojì náà
  choice: Jósẹ́fù tẹ́ Jésù sí ibojì tí a gbẹ́ sínú àpáta, tí a kò tíì tẹ́ ẹnikẹ́ni sí rí.
  alternative: Jósẹ́fù tẹ́ Jésù sí ibojì gbígbẹ́ kan, níbi tí ẹnikẹ́ni kò tíì dùbúlẹ̀ sí rí.
  rationale: Ẹsẹ náà jẹ́ àpèjúwe ìṣẹ̀lẹ̀, kì í ṣe gbólóhùn ẹ̀kọ́ ìgbàgbọ́ tí ariyanjiyan wà lórí rẹ̀. Ìtumọ̀ náà pa kúlẹ̀kúlẹ̀ ìtàn mọ́ láìfi ohun tí àwọn ìwé Ìhìn Rere míì sọ tàbí ẹ̀kọ́ àfikún kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé yé fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo ‘aṣọ ọ̀gbọ̀’ dípò ọ̀rọ̀ tó lè fi ìtumọ̀ aṣọ ìsìnkú pàtó kún orísun.
