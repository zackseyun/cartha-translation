  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtòlẹ́sẹẹsẹ Gíríìkì dáadáa: ìmú ara rẹ̀ sọ̀kalẹ̀, fífi aṣọ línìnì/ọ̀gbọ̀ dì í, fífi í sínú ibojì tí a gbẹ́ nínú àpáta, àti pé kò sí ẹni tí ó ti dùbúlẹ̀ síbẹ̀ rí. Àmọ́, ‘a kò tíì tẹ́ ẹnikẹ́ni sí rí’ yí ojú-ìwòye gbolohun orísun padà sí ohun tí ẹni kan ṣe sí ẹlòmíràn, dípò àlàyé pé kò sí ẹni tí ó ti dùbúlẹ̀ nínú ibojì náà.'
