revisions:
- from: Ó sì sọ̀ ọ́ kalẹ̀, ó fi aṣọ ọ̀gbọ̀ dì í, ó sì tẹ́ ẹ sí ibojì tí a gbẹ́ sínú àpáta,[a] níbi tí a kò tíì tẹ́ ẹnikẹ́ni sí rí.[b]
  to: Ó sì sọ̀ ọ́ kalẹ̀, ó fi aṣọ ọ̀gbọ̀ dì í, ó sì fi í sí ibojì tí a gbẹ́ nínú àpáta,[a] níbi tí ẹnikẹ́ni kò tíì dùbúlẹ̀ sí rí.[b]
  rationale: Àtúnṣe náà mú ọ̀rọ̀ ìṣe ‘fi í sí’ rọrùn, ó sì tún ṣe gbolohun ìkẹyìn kí ó lè ṣàfihàn ìtumọ̀ κείμενος—pé kò sí ẹni tí ó ti dùbúlẹ̀ síbẹ̀—láìfi ohun mìíràn kún un. Àmì ìsàlẹ̀ dúró lẹ́gbẹ̀ẹ́ àwọn ẹ̀ka ọ̀rọ̀ tí wọ́n ṣàlàyé.
