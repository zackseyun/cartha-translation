  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo àwọn ojúlùmọ̀ rẹ̀, àti àwọn obìnrin tí wọ́n ti bá a tẹ̀ lé láti Gálílì, ń dúró ní òkèèrè, wọ́n sì ń wo àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: ń dúró
  rationale: Ìṣe tí ó ń bá a lọ ni ọ̀rọ̀-ìṣe náà ń ṣàpèjúwe níbí; “ń dúró” fi hàn pé wọ́n wà ní ipò yẹn fún àkókò kan, kì í ṣe pé wọ́n ṣẹ̀ṣẹ̀ dìde dúró.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyípadà díẹ̀ tàbí ìyàtọ̀ sí ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ hàn; “Ṣùgbọ́n” bá ìlọsíwájú ìtàn náà mu.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: gbogbo àwọn tí wọ́n mọ̀ ọ́n
  rationale: γνωστοί lè túmọ̀ sí àwọn ojúlùmọ̀ tàbí àwọn ẹni tí ó mọ̀ ọ́n. Gbólóhùn yìí ṣe kedere ní Yorùbá, kò sì fi dandan túmọ̀ wọn sí ọ̀rẹ́ tímọ́tímọ́.
- source_word: μακρόθεν
  choice: ní òkèèrè
  rationale: Ó tọ́ka sí jíjìnnà ibi tí wọ́n dúró sí; “ní òkèèrè” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: γυναῖκες
  choice: àwọn obìnrin
  rationale: Àpilẹ̀kọ àti àpèjúwe tó tẹ̀ lé e tọ́ka sí ẹgbẹ́ obìnrin kan pàtó tí ìtàn náà ti mọ̀.
- source_word: συνακολουθοῦσαι αὐτῷ
  choice: tí wọ́n ti bá a tẹ̀ lé
  rationale: Àpólà náà dá àwọn obìnrin náà mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n ti ń bá Jesu rìn láti ìṣáájú; “ti bá a tẹ̀ lé” fi ìbáṣepọ̀ àti ìṣe ṣáájú ìṣẹ̀lẹ̀ yìí hàn.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: láti Gálílì
  rationale: Ó sọ agbègbè tí wọ́n ti bẹ̀rẹ̀ sí í bá a tẹ̀ lé e.
- source_word: ὁρῶσαι ταῦτα
  choice: wọ́n sì ń wo àwọn nǹkan wọ̀nyí
  rationale: Ó fi hàn pé wọ́n ń fi ojú ara wọn ṣàkíyèsí àwọn ìṣẹ̀lẹ̀ náà; ọ̀rọ̀ yìí tún pa ọ̀pọ̀ nǹkan inú ταῦτα mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ní òkèèrè” àti “ń wo” mú ìṣísẹ̀ àwòrán náà wà láàyè, nígbà tí “àwọn tí wọ́n mọ̀ ọ́n” yàgò fún fífi ìbátan tímọ́tímọ́ tí Gíríìkì kò fi dandan sọ kún un.
