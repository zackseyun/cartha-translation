  to: Ṣùgbọ́n gbogbo àwọn ojúlùmọ̀ rẹ̀, àti àwọn obìnrin tí wọ́n ti bá a tẹ̀ lé láti Gálílì, ń dúró ní òkèèrè, wọ́n sì ń wo àwọn nǹkan wọ̀nyí.
