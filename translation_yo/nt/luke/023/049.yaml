  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń gba ìtumọ̀ gbogbogbòò ẹsẹ náà dáadáa: ẹgbẹ́ àwọn ènìyàn náà àti àwọn obìnrin Gálílì náà wà ní jíjìnnà wọ́n sì ń wo ohun tí ń ṣẹlẹ̀. Ṣùgbọ́n “àwọn tí wọ́n mọ̀ ọ́n” lè dà bí ẹni pé ó ń sọ pé àwọn ni wọ́n mọ Jesu, nígbà tí γνωστοὶ αὐτῷ ní ìtumọ̀ tí ó dára jù lọ níbí ni “àwọn ojúlùmọ̀ rẹ̀” (àwọn ẹni tí Jesu mọ̀/àwọn alábàákẹ́gbẹ́ rẹ̀).'
  naturalness: “Ní òkèèrè” àti “ń wo àwọn nǹkan wọ̀nyí” jẹ́ èdè Yorùbá àdánidá. Àtúnṣe náà mú kí ìbátan γνωστοί αὐτῷ hàn kedere, ó sì yàgò fún lílo ọ̀rọ̀-ìṣe ìsinsìnyí “mọ̀” tí ó lè má fi àjọṣe tí a ń pè ní ojúlùmọ̀ hàn dáadáa.
  terminology: “Àwọn ojúlùmọ̀ rẹ̀” jẹ́ ọ̀rọ̀ tó bá γνωστοί mu dáadáa. A yẹ kí a má ṣe lo “alábàáṣiṣẹ́pọ̀” nínú àlàyé-ẹsẹ̀, nítorí ó sábà máa ń tọ́ka sí alábàáṣiṣẹ́ tàbí ẹni tí ń ṣiṣẹ́ pọ̀, kì í ṣe ojúlùmọ̀ lásán.
