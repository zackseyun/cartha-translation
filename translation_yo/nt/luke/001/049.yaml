  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: yo
  text: Nítorí Ẹni Alágbára ti ṣe àwọn ohun ńlá fún mi, orúkọ rẹ̀ sì jẹ́ mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mímọ́ sì ni orúkọ rẹ̀.” Gíríìkì gbé “mímọ́” síwájú “orúkọ rẹ̀” láti tẹnu mọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí Màríà fi ń gbé Olúwa ga hàn, ó sì pa agbára ọ̀rọ̀ ìdí nínú Gíríìkì mọ́.
- source_word: ἐποίησέν
  choice: ti ṣe
  rationale: Ọ̀nà yìí fi iṣẹ́ tí Ọlọ́run ti parí, tí ipa rẹ̀ sì ṣì wà lórí Màríà, hàn lọ́nà àdánidá ní Yorùbá.
- source_word: μοι
  choice: fún mi
  rationale: 'Dátífù náà ní ìtumọ̀ àǹfààní níbí: ohun tí Ọlọ́run ṣe jẹ́ fún ire Màríà.'
- source_word: μεγάλα
  choice: ohun ńlá
  rationale: Àjẹtífù aláìlóru púpọ̀ náà dúró gẹ́gẹ́ bí orúkọ; ‘ohun ńlá’ jẹ́ Yorùbá àdánidá tí kò fi irú iṣẹ́ náà mọ́ sí ohun kan pàtó.
- source_word: ὁ δυνατός
  choice: Olódùmarè
  rationale: Àjẹtífù tó ní àtíkùlù náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Ọlọ́run. ‘Olódùmarè’ jẹ́ orúkọ ìbílẹ̀ Yorùbá tó bójú mu fún Ẹni alágbára gbogbo, ó sì jẹ́ ọ̀rọ̀ ọ̀wọ̀ tó yé àwọn òǹkàwé.
- source_word: ἅγιον
  choice: mímọ́
  rationale: Ó ṣàpèjúwe orúkọ Ọlọ́run gẹ́gẹ́ bí èyí tí a yà sọ́tọ̀, tí kò sì ní àbàwọ́n; ‘mímọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún ìtumọ̀ náà.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: orúkọ rẹ̀
  rationale: Ó pa ‘orúkọ’ inú Gíríìkì mọ́, ó sì sọ ọ́ ní ìtòlẹ́sẹẹsẹ Yorùbá àdánidá.
theological_decisions:
- issue: Ṣíṣe ὁ δυνατός gẹ́gẹ́ bí orúkọ oyè Ọlọ́run
  choice: Olódùmarè
  alternative: Ẹni Alágbára
  rationale: Gíríìkì mú àjẹtífù náà lò bí orúkọ fún Ọlọ́run. ‘Olódùmarè’ jẹ́ ọ̀rọ̀ Yorùbá ọ̀wọ̀ àti àdánidá; ‘Ẹni Alágbára’ sì lè tẹ̀ lé ìrísí Gíríìkì ní tààrà sí i.
- issue: Ìtò ọ̀rọ̀ καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: orúkọ rẹ̀ sì jẹ́ mímọ́
  alternative: mímọ́ sì ni orúkọ rẹ̀
  rationale: Yíyan àkọ́kọ́ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, nígbà tí àfikún ẹsẹ̀ ń tọ́ka pé Gíríìkì gbé ‘mímọ́’ síwájú fún ìtẹnumọ́, èyí tí a lè túmọ̀ sí ‘mímọ́ sì ni orúkọ rẹ̀.’
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn kíkún; èdè náà ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo ‘Olódùmarè’ gẹ́gẹ́ bí orúkọ oyè àdánidá fún Ọlọ́run, láìfi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
