source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: yo
  text: nítorí ìyọ́nú jíjinlẹ̀ Ọlọ́run wa, nípasẹ̀ rẹ̀ ni ìmọ́lẹ̀ òwúrọ̀ láti òkè yóò ṣèbẹ̀wò sí wa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìfẹ̀mọ́júmọ́.” Ἀνατολή tún lè mú oyè Mèsáyà náà, “Ẹ̀ka,” wá sí ọkàn nínú Májẹ̀mú Láéláé ní èdè Gíríìkì.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative, διά ń fi ìdí tàbí ohun tó fa ìṣe hàn; “nítorí” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: σπλάγχνα ἐλέους
  choice: ìyọ́nú oníjẹ̀lẹ́ńkẹ́
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí ìyọ́nú jíjinlẹ̀ tó ti inú wá. Yíyan yìí pa ìmọ̀lára jíjinlẹ̀ àti inú rere mọ́ láìlo àpèjúwe gangan tí kò ní ṣe àdánidá ní Yorùbá.
- source_word: θεοῦ ἡμῶν
  choice: Ọlọ́run wa
  rationale: Ó jẹ́ ìbátan ohun-ìní; ètò ọ̀rọ̀ Yorùbá tó bá ìlò mu ni “Ọlọ́run wa.”
- source_word: ἐν οἷς
  choice: nípasẹ̀ èyí tí
  rationale: Ó tọ́ka padà sí ìyọ́nú Ọlọ́run gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ tí ìbẹ̀wò náà fi dé; “nípasẹ̀ èyí tí” mú ipa yẹn jáde ní Yorùbá àdánidá.
- source_word: ἐπισκέψεται
  choice: yóò fi bẹ̀ wá wò
  rationale: Ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú, ó sì lè túmọ̀ sí wíwá bẹ ẹni wò pẹ̀lú ìrànlọ́wọ́ oore-ọ̀fẹ́. “Bẹ̀ wá wò” pa àwòrán ìbẹ̀wò náà mọ́, kí àyíká ọ̀rọ̀ sì ṣàlàyé ipa ìgbàlà rẹ̀.
- source_word: ἀνατολὴ
  choice: ìmọ́lẹ̀ òwúrọ̀
  rationale: Ní àyíká ẹsẹ tó tẹ̀ lé, ọ̀rọ̀ náà ń tọ́ka sí ìràwọ̀ òwúrọ̀ tàbí ìmọ́lẹ̀ tó ń yọ. “Ìmọ́lẹ̀ òwúrọ̀” jẹ́ àdánidá, ó sì pa àwòrán ìmọ́lẹ̀ mọ́; ìtumọ̀ Mèsáyà bí “Ẹ̀ka” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐξ ὕψους
  choice: láti òkè
  rationale: Yíyan yìí sún mọ́ Gíríìkì, ó sì lè tọ́ka sí ibi gíga ti ọ̀run láìfi “ọ̀run” kún un ní kedere ju orísun lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀνατολή nínú àyíká Mèsáyà
  choice: ìmọ́lẹ̀ òwúrọ̀
  alternative: ìdájí; Ẹ̀ka; ẹni tí ń yọ
  rationale: Àyíká Lúùkù 1:78–79 tẹnumọ́ ìmọ́lẹ̀ tó ń ràn sí àwọn tó jókòó nínú òkùnkùn, nítorí náà àwòrán ìdájí tàbí ìmọ́lẹ̀ òwúrọ̀ ló ṣe pàtàkì jù. Síbẹ̀, ἀνατολή lè tún mú èdè Mèsáyà nípa “Ẹ̀ka” nínú Septuagint wá sí ọkàn; a pa ìṣeéṣe náà mọ́ nínú àlàyé ìsàlẹ̀ láìdá a lójú nínú ẹsẹ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ìyọ́nú oníjẹ̀lẹ́ńkẹ́” fún ọ̀rọ̀ àpèjúwe inú-jíjinlẹ̀, “ìmọ́lẹ̀ òwúrọ̀” sì pa àwòrán ìmọ́lẹ̀ mọ́ láìparẹ́ ìtumọ̀ Mèsáyà mìíràn.
