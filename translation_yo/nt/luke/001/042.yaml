  source_fidelity: Ìtumọ̀ náà ń gbé ìtumọ̀ pàtàkì ẹsẹ̀ náà kalẹ̀, ṣùgbọ́n ó darapọ̀ ìṣe méjì nínú ἀνεφώνησεν ... καὶ εἶπεν sí ìṣọ̀kan kan. Ìtúnyẹ̀wò náà dá wọn sílẹ̀ lọ́tọ̀ gẹ́gẹ́ bí orísun Gíríìkì. Ó tún mú κραυγῇ μεγάλῃ hàn ní ọ̀nà tí ó sún mọ́ ‘ohùn ńlá.’
