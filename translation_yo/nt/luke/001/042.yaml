source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: yo
  text: Ó sì ké jáde ní ohùn ńlá[a], ó sì wí pé, “Ìwọ ni a bù kún láàárín àwọn obìnrin, a sì bù kún èso inú rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìké ńlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: ké jáde
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí sísọ jáde ní ohùn líle tàbí kíké jáde; “ké jáde” fi agbára àti gbígbọ́ ohùn náà hàn láìdá a sí ìké nítorí ìbànújẹ́.
- source_word: κραυγῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Gbólóhùn dátífù yìí ń sọ bí ó ṣe ké jáde. “Ní ohùn rara” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ohùn líle tí gbogbo ènìyàn lè gbọ́ hàn.
- source_word: Εὐλογημένη
  choice: Alábùkún-fún ni ìwọ
  rationale: Partisípọ̀ pípé aláìṣiṣẹ́ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àsọyé, ó sì ní ìrísí ọ̀rọ̀ ìbùkún. Yíyan yìí pa ìtẹnumọ́ àti ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́.
- source_word: ἐν γυναιξίν
  choice: láàárín àwọn obìnrin
  rationale: Ó ń fi ipò Màríà tí ó yàtọ̀ hàn ní ìfiwéra pẹ̀lú àwọn obìnrin; a kò fi “gbogbo” kún un nítorí kò sí ní pàtó nínú Gíríìkì.
- source_word: εὐλογημένος
  choice: alábùkún-fún sì ni
  rationale: Ó bá ọ̀rọ̀ ìbùkún tí a kọ́kọ́ sọ sí Màríà mu, ó sì pa ìfararora láàárín ìyá àti ọmọ inú rẹ mọ́.
- source_word: ὁ καρπὸς
  choice: èso
  rationale: “Èso” pa àkàwé orísun náà mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí Yorùbá lè lóye nípa ọmọ tí obìnrin lóyún rẹ̀.
- source_word: τῆς κοιλίας σου
  choice: inú rẹ
  rationale: Nínú àyíká oyún, κοιλία tọ́ka sí inú obìnrin gẹ́gẹ́ bí ibi tí ọmọ wà. “Èso inú rẹ” jẹ́ gbólóhùn Yorùbá àdánidá tí ó pa àwòrán ìyá mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ ìbùkún tí a sọ sí Màríà
  choice: Alábùkún-fún ni ìwọ láàárín àwọn obìnrin
  alternative: Ìwọ ni a bù kún láàárín àwọn obìnrin
  rationale: Yíyan náà fi ìbùkún tí Elisabẹti sọ hàn láìfi ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà tàbí dín ipò Màríà kù; ó tún pa ìrísí ìkéde ìbùkún ti orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní; a lo “alábùkún-fún” láti pa ìrísí ìkéde ìbùkún àti ìfararora àwọn apá méjèèjì mọ́.
