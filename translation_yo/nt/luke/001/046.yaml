id: LUK.1.46
reference: Luke 1:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: yo
  text: Màríà sì wí pé, “Ọkàn mi ń gbé Olúwa ga,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọkàn mi ń kéde bí Olúwa ti tóbi tó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí tẹ̀ síwájú nínú ìtàn láìfi ìtumọ̀ àkókò kún un.
- source_word: εἶπεν
  choice: wí pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bá ìṣáájú ọ̀rọ̀ taara mu, ó sì ṣàfihàn ìṣe aorist náà ní ti ìtàn.
- source_word: Μαριάμ
  choice: Màríà
  rationale: A lo ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: Μεγαλύνει
  choice: ń gbé ... ga
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìyìn ẹni gẹ́gẹ́ bí ẹni ńlá mọ́; àmì ‘ń’ tún fi ìṣe tó ń lọ hàn.
- source_word: ἡ ψυχή μου
  choice: Ọkàn mi
  rationale: ‘Ọkàn mi’ pa ọ̀rọ̀ ewì tó ń tọ́ka sí gbogbo inú ènìyàn mọ́, dípò yíyí i sí ‘èmi’ nìkan.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Olúwa ni akọ́lé ọ̀wọ̀ fún Ọlọ́run tó bá κύριος mu nínú àyíká orin ìyìn yìí.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyíká ìyìn sí Ọlọ́run, ‘Olúwa’ ni ó pa ìwọ̀n àti ìtumọ̀ akọ́lé mímọ́ náà mọ́; ‘Ọ̀gá’ kéré jù ní ìtumọ̀.
- issue: Ọ̀rọ̀ nípa ẹ̀dá ènìyàn nínú ἡ ψυχή μου
  choice: Ọkàn mi
  alternative: Èmi / gbogbo inú mi
  rationale: ‘Ọkàn mi’ pa ìfihàn ewì àti ìtumọ̀ inú-jinlẹ̀ náà mọ́ láìdín un kù sí arọ́pò-orúkọ tàbí ṣàlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ náà sọ.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a pa ìró ewì orin Màríà mọ́.
