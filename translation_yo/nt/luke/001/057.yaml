source:
  edition: SBLGNT
  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: yo
  text: Àkókò fún Élísábẹ́t láti bímọ sì pé[a], ó sì bí ọmọkùnrin kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà èdè tó rọrùn sí i, “Àkókò ìbímọ Élísábẹ́t dé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nígbà tí
  rationale: A kò túmọ̀ δὲ lọ́tọ̀ gẹ́gẹ́ bí ‘nísinsìnyí’; ìtẹ̀síwájú ìtàn rẹ̀ hàn nípa ìṣọ̀kan gbólóhùn Yorùbá.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: àkókò ... pé
  rationale: ‘Àkókò pé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìparí àkókò oyún hàn, ó sì pa àwòrán pé àkókò náà dé ẹ̀kúnrẹ́rẹ́ mọ́.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: Élísábẹ́t láti bímọ
  rationale: Ó sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní kedere, ‘bímọ’ sì jẹ́ èdè Yorùbá àdánidá fún ìbímọ.
- source_word: ἐγέννησεν
  choice: ó bí
  rationale: Ọ̀rọ̀ ìṣe náà ṣàpèjúwe ìbímọ tí ó ṣẹlẹ̀ tán; ‘ó bí’ jẹ́ ṣókí, ó sì bá Yorùbá mu.
- source_word: υἱόν
  choice: ọmọkùnrin kan
  rationale: Ó pa ìtumọ̀ pàtó pé ọmọ ọkùnrin mọ́, dípò ọ̀rọ̀ gbogbogbò fún ọmọ.
- source_word: Ἐλισάβετ
  choice: Élísábẹ́t
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìpè àti ìkọ̀wé Yorùbá tó wọ́pọ̀.
