translation:
  language: yo
  text: 'Ó ti sọ àwọn aláṣẹ kalẹ̀ kúrò lórí àwọn ìtẹ́,

    ó sì ti gbé àwọn onírẹ̀lẹ̀ ga.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn alágbára” dípò “àwọn aláṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ènìyàn alágbára ní gbogbogbòò, ṣùgbọ́n “kúrò lórí àwọn ìtẹ́” ṣe atilẹyin fún ìtumọ̀ àwọn aláṣẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn tí ipò wọn rẹlẹ̀” dípò “àwọn onírẹ̀lẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn onírẹ̀lẹ̀ àti/tàbí àwọn tí ipò wọn rẹlẹ̀ láwùjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: sọ ... kalẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ẹni kúrò ní ipò gíga. “Sọ ... kalẹ̀” jẹ́ èdè Yorùbá àdánidá tí kò fi dandan túmọ̀ sí ìwópalẹ̀ oníjà.
- source_word: δυνάστας
  choice: àwọn aláṣẹ̀
  rationale: Ó lè tọ́ka sí àwọn alágbára tàbí àwọn olùṣàkóso; gbólóhùn “kúrò lórí ìtẹ́” mú kí ìtumọ̀ àwọn aláṣẹ̀ hàn kedere jù.
- source_word: ἀπὸ θρόνων
  choice: kúrò lórí ìtẹ́ wọn
  rationale: “Ìtẹ́” pa àwòrán gidi inú Gíríìkì mọ́. A fi “wọn” kún un nítorí ó jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, láìyí ìtumọ̀ padà.
- source_word: ὕψωσεν
  choice: gbé ... ga
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì ní ìtumọ̀ gbígbé ẹni sókè ní ipò tàbí ọlá.
- source_word: ταπεινούς
  choice: àwọn onírẹ̀lẹ̀
  rationale: Ó pa ìtumọ̀ ìrẹ̀lẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí àwọn ẹni ipò wọn rẹlẹ̀.
theological_decisions:
- issue: Ìrísí àti àkókò àwọn ọ̀rọ̀-ìṣe aorist nínú orin Màríà
  choice: Lo “Ó ti ... ó sì ti ...” láti fi iṣẹ́ tí Ọlọ́run ti ṣe pẹ̀lú ipa tó ń bá a lọ hàn.
  alternative: 'Lo àkókò àtijọ́ lasan: “Ó sọ ... kalẹ̀, ó sì gbé ... ga.”'
  rationale: Ìtumọ̀ pẹ̀lú “ti” mú agbára iṣẹ́ tí a ṣe parí tí ó sì ṣì ní ìjẹ́pàtàkì wá sí èdè Yorùbá, láìdájọ́ bóyá aorist náà jẹ́ àsọtẹ́lẹ̀, àkótán ìyìn, tàbí iṣẹ́ Ọlọ́run tí a ń wo bí ohun tó dájú.
- issue: Ìtumọ̀ ταπεινούς
  choice: àwọn onírẹ̀lẹ̀
  alternative: àwọn ẹni ipò wọn rẹlẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ìwà ìrẹ̀lẹ̀ àti ipò àwùjọ tí ó rẹlẹ̀; a pa ìṣòro yíyan láàárín wọn mọ́ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Ìlà méjì náà pa ìṣọ̀kan ewì àti ìyípadà láàárín àwọn aláṣẹ̀ àti àwọn onírẹ̀lẹ̀ mọ́; ààmì ohùn kún ibi tí ó bá yẹ.
