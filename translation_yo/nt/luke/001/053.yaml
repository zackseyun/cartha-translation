  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa àwọn participle substantival náà mọ́ gẹ́gẹ́ bí ẹgbẹ́ ènìyàn (‘àwọn tí ebi ń pa,’ ‘àwọn ọlọ́rọ̀’), ó sì túmọ̀ ἐνέπλησεν, ἀγαθῶν, ἐξαπέστειλεν, àti κενούς láìfi ìtumọ̀ ẹ̀sìn tàbí àfikún mìíràn kún un. ‘Ó ti’ jẹ́ ọ̀nà tí ó bójú mu láti ṣàfihàn ìṣe aorist nínú àyíká orin ìyìn yìí.'
  naturalness: Yorùbá náà jẹ́ boṣewa, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Fi ohun rere kún’ àti ‘rán ... lọ ní òfo’ jẹ́ ìṣọ̀kan gbolohun tí ó ní ìtumọ̀ kedere. ‘Ní òfo’ pa ìtumọ̀ gbòòrò ‘empty’ mọ́ ju kí a fi ‘lọ́wọ́ òfo’ ṣe ọ̀rọ̀ pàtó nínú ọ̀rọ̀ àkọ́kọ́.
  terminology: ‘Àwọn tí ebi ń pa’ àti ‘àwọn ọlọ́rọ̀’ jẹ́ àṣàyàn tí ó dáa fún ìyàtọ̀ awùjọ tó wà nínú ọ̀rọ̀ Gíríìkì. ‘Ohun rere’ sì jẹ́ ìtumọ̀ tààrà fún ἀγαθῶν. Àlàyé ẹsẹ̀-ìsàlẹ̀ náà fi hàn dáadáa pé ‘lọ́wọ́ òfo’ jẹ́ àṣàyàn àlàyé, kì í ṣe ìtumọ̀ tí a fi dandan kún ọ̀rọ̀ náà.
