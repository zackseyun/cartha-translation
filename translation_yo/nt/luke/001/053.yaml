id: LUK.1.53
reference: Luke 1:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: yo
  text: Ó ti fi ohun rere kún àwọn tí ebi ń pa, ó sì rán àwọn ọlọ́rọ̀ lọ ní òfo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó rán àwọn ọlọ́rọ̀ lọ lọ́wọ́ òfo.”
    reason: Àṣàyàn ìtumọ̀ fún κενούς; ‘lọ́wọ́ òfo’ mú àwòrán ẹni tí kò mú nǹkan lọ hàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ‘ní òfo’ ní gbòòrò.
lexical_decisions:
- source_word: πεινῶντας
  choice: àwọn tí ebi ń pa
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ̀ tó ń ṣiṣẹ́ bí orúkọ ni; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì tọ́ka sí àwọn ènìyàn tí ebi ń pa láìsọ pé ebi náà ti dé ààlà ikú.
- source_word: ἐνέπλησεν
  choice: ó ti fi … kún
  rationale: Ó pa ìtumọ̀ fífún kún mọ́, nígbà tí ‘ó ti’ fi iṣẹ́ Ọlọ́run tí ó ti ṣẹlẹ̀ ní ìpinnu hàn gẹ́gẹ́ bí ó ṣe bá ọ̀nà orin Màríà mu.
- source_word: ἀγαθῶν
  choice: ohun rere
  rationale: Ẹ̀yà ọ̀rọ̀ yìí sọ ohun tí a fi kún wọn; ‘ohun rere’ jẹ́ títọ́ àti àdánidá, kò sì fi èrò ‘ẹ̀bùn’ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: πλουτοῦντας
  choice: àwọn ọlọ́rọ̀
  rationale: Ó pa ìyàtọ̀ awùjọ tó ṣe kedere mọ́ láàárín àwọn tí ebi ń pa àti àwọn ọlọ́rọ̀, láìsọ ọ́ di àpẹẹrẹ ẹ̀mí nìkan.
- source_word: ἐξαπέστειλεν
  choice: ó rán … lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún rírán ènìyàn kúrò tàbí lọ, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κενούς
  choice: ní òfo
  rationale: Ó ṣàpèjúwe ipò àwọn ọlọ́rọ̀ nígbà tí a rán wọn lọ. Ó pa ìtumọ̀ gbòòrò ‘empty’ mọ́; ‘lọ́wọ́ òfo’ jẹ́ ìtumọ̀ àlàyé tó ṣeé ṣe.
theological_decisions:
- issue: Ìyípadà ipò awùjọ àti ẹ̀kọ́ nípa Ọlọ́run nínú orin Màríà
  choice: A pa ìyàtọ̀ gidi mọ́ láàárín ‘àwọn tí ebi ń pa’ àti ‘àwọn ọlọ́rọ̀.’
  alternative: Kí a túmọ̀ àwọn tí ebi ń pa sí aláìní nípa ẹ̀mí, tàbí àwọn ọlọ́rọ̀ sí agbéraga tàbí ẹni tó rò pé kò nílò ohunkóhun.
  rationale: Gíríìkì sọ̀rọ̀ nípa àwọn ènìyàn tí ebi ń pa àti àwọn ọlọ́rọ̀ ní ọ̀nà tó ṣe kedere. Bó tilẹ̀ jẹ́ pé ẹ̀kọ́ nípa ẹ̀mí lè wà nínú rẹ̀, ìtumọ̀ náà kò gbọ́dọ̀ sọ ìtumọ̀ awùjọ tó hàn gbangba di àpẹẹrẹ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ebi ń pa’ àti ‘àwọn ọlọ́rọ̀’ láti jẹ́ kí ìyàtọ̀ inú ẹsẹ náà dúró ní ṣókí àti ní àdánidá.
