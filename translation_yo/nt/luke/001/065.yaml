source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: yo
  text: Ẹ̀rù[b] sì bá gbogbo àwọn tí ń gbé ní àyíká wọn, a sì ń sọ gbogbo ọ̀rọ̀ wọ̀nyí[a] káàkiri gbogbo agbègbè olókè ilẹ̀ Jùdíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn ọ̀rọ̀ wọ̀nyí,” tàbí “gbogbo àwọn ọ̀ràn wọ̀nyí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ọ̀rọ̀ tí a sọ tàbí sí àwọn ìṣẹ̀lẹ̀ tí a ń sọ nípa wọn.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ̀rù” níhìn-ín lè tún ní ìtumọ̀ ìbẹ̀rù ọlọ́wọ̀ ní ìdáhùn sí iṣẹ́ Ọlọ́run tí ó hàn gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας ... φόβος
  choice: Ẹ̀rù sì ba gbogbo...
  rationale: Ọ̀rọ̀ Yorùbá pé ‘ẹ̀rù ba ẹni’ fi hàn ní ti ẹ̀dá èdè pé ẹ̀rù bẹ̀rẹ̀ sí í mú wọn; ó sì pa agbára gbólóhùn Gíríìkì mọ́ láì túmọ̀ ἐγένετο lọ́nà líle gẹ́gẹ́ bí ‘ó ṣẹlẹ̀.’
- source_word: φόβος
  choice: Ẹ̀rù
  rationale: ‘Ẹ̀rù’ ni ìtumọ̀ tààrà, ó sì ṣí àyè sílẹ̀ fún ìmọ̀lára ìbẹ̀rù pẹ̀lú ọ̀wọ̀ jíjinlẹ̀ níwájú iṣẹ́ Ọlọ́run, bí àyíká ẹsẹ náà ṣe lè tọ́ka sí.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: àwọn tí ń gbé ní àyíká wọn
  rationale: Èyí tẹ̀lé ìtumọ̀ περιοικέω pé kí ènìyàn máa gbé yí àwọn ẹlòmíràn ká tàbí nítòsí wọn, láì dín un kù sí ‘àwọn aládùúgbò’ nìkan.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: ní gbogbo ilẹ̀ olókè Jùdíà
  rationale: ‘Ilẹ̀ olókè’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ agbègbè òkè tí ἡ ὀρεινή ń tọ́ka sí; ‘gbogbo’ sì mú ìtẹnumọ́ ὅλῃ jáde.
- source_word: διελαλεῖτο
  choice: a sì ń sọ ... ká
  rationale: Ìlò ‘ń’ fi iṣẹ́ tí ń lọ lọ́wọ́ hàn gẹ́gẹ́ bí imperfect Gíríìkì, ‘sọ ... ká’ sì fi hàn pé àwọn ènìyàn ń sọ̀rọ̀ nípa rẹ̀ káàkiri agbègbè náà.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: gbogbo ọ̀rọ̀ wọ̀nyí
  rationale: ‘Ọ̀rọ̀’ lè túmọ̀ sí ohun tí a sọ tàbí ọ̀ràn/ìṣẹ̀lẹ̀ tí a ń sọ nípa rẹ̀; nítorí náà, ó pa fífẹ̀ ìtumọ̀ ῥήματα mọ́.
theological_decisions:
- issue: Ìtumọ̀ φόβος nígbà tí iṣẹ́ Ọlọ́run hàn gbangba
  choice: Ẹ̀rù
  alternative: ìbẹ̀rù ọlọ́wọ̀ tàbí ẹ̀rù pẹ̀lú ìyanu
  rationale: A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà nínú ẹsẹ. ‘Ẹ̀rù’ pa ìtumọ̀ tààrà mọ́, nígbà tí àyíká àti àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí òǹkàwé mọ̀ pé ọ̀wọ̀ jíjinlẹ̀ tàbí ìyanu lè wà nínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé Yorùbá, ó sì pa ìṣe tí ń lọ lọ́wọ́, àgbègbè ilẹ̀ olókè, àti àìdánilójú inú φόβος àti ῥήματα mọ́.
