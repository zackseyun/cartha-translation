id: LUK.1.41
reference: Luke 1:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí Elisabeti gbọ́ ìkíni[a] Maria, ọmọ náà fò sókè nínú ilé-ọmọ rẹ̀, Elisabeti sì kún fún Ẹ̀mí Mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ ìkíni.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ἀσπασμός.
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó ṣe àfihàn ọ̀nà ìtàn Luku ní èdè Yorùbá àdánidá, láì lo gbólóhùn àtijọ́ tàbí èyí tí ó le.
- source_word: ὡς
  choice: nígbà tí
  rationale: Nínú àkópọ̀ àkókò yìí, ó fi hàn pé ohun tí ó tẹ̀ lé ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ nígbà tí Elisabeti gbọ́ ìkíni náà.
- source_word: ἀσπασμός
  choice: ìkíni
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìkíni tí Maria sọ; “ìkíni” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí ó sì bá àyíká mu.
- source_word: Μαρίας
  choice: Maria
  rationale: 'A lo orúkọ Maria ní ìtumọ̀ àjọṣe oníhun: “ìkíni Maria,” gẹ́gẹ́ bí èdè Yorùbá ṣe máa ń sọ ọ́.'
- source_word: ἐσκίρτησεν
  choice: fò sókè
  rationale: Ó pa ìṣípòpadà òjijì, alágbára tí ọ̀rọ̀ Gíríìkì ń ṣàpèjúwe mọ́.
- source_word: βρέφος
  choice: ọmọ náà
  rationale: Ó tọ́ka sí Johanu tí kò tíì bí; “ọmọ náà” jẹ́ ọ̀rọ̀ àdánidá, ó sì yẹ nítorí pé àyíká ilé-ọmọ mú ìtumọ̀ náà ṣe kedere.
- source_word: κοιλία
  choice: ilé-ọmọ rẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka pàtó sí ilé-ọmọ, kì í ṣe inú ní ìtumọ̀ gbòòrò.
- source_word: ἐπλήσθη
  choice: kún fún
  rationale: Ó tú ìṣe aláìṣe Gíríìkì náà sí Yorùbá àdánidá, láì ṣàlàyé ẹni tí ó mú un ṣẹlẹ̀ ju bí ẹsẹ náà ṣe sọ lọ.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere láti tọ́ka sí Ẹ̀mí Ọlọ́run nínú àyíká ìmísí àsọtẹ́lẹ̀ ti Luku.
theological_decisions:
- issue: Ẹni tí πνεύματος ἁγίου ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́, ìyẹn Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí mímọ́ kan
  rationale: Nínú Luku–Ìṣe àwọn Aposteli, gbólóhùn yìí sábà máa ń tọ́ka sí Ẹ̀mí Ọlọ́run, àyíká yìí sì jẹ́ ti ìmísí àsọtẹ́lẹ̀. Lílo lẹ́tà ńlá fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Ìtumọ̀ βρέφος nípa Johanu tí kò tíì bí
  choice: ọmọ náà
  alternative: ọmọ ọwọ́; ọmọ kékeré
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ọmọ kékeré gan-an, ó sì tọ́ka sí Johanu nínú ilé-ọmọ níbí. Ìtumọ̀ yìí pa ìtọ́kasí gidi náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó bá yẹ. Ìṣètò gbólóhùn náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a sì gbé àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ tí ó ń ṣàlàyé.
