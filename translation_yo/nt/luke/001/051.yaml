id: LUK.1.51
reference: Luke 1:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: yo
  text: Ó ti fi apá rẹ̀ hàn pé òun lágbára; ó ti tú àwọn agbéraga ká nínú ìrònú ọkàn wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ sí: “ó ti tú àwọn agbéraga ká nítorí ète ọkàn wọn,” tàbí “nínú ohun tí ọkàn wọn ń rò.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: Ó ti fi ... hàn pé òun lágbára
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ‘ṣe agbára,’ ṣùgbọ́n ó jẹ́ àṣà ọ̀rọ̀ fún fífi agbára hàn. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára tí a fi hàn mọ́.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: fi apá rẹ̀
  rationale: ἐν níbí ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò. ‘Fi apá rẹ̀’ pa àwòrán ara ènìyàn tí ó ń tọ́ka sí agbára Ọlọ́run mọ́ láì sọ ọ́ di ọ̀rọ̀ tí kò bá Yorùbá mu.
- source_word: διεσκόρπισεν
  choice: ó ti tú ... ká
  rationale: ‘Tú ... ká’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún pípín àwọn ènìyàn ká tàbí fífi wọn fọ́nká.
- source_word: ὑπερηφάνους
  choice: àwọn agbéraga
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù tí a lò bí orúkọ fún àwọn ènìyàn onígbèéraga; ‘àwọn agbéraga’ ṣe ìtumọ̀ ìwà yẹn ní ṣókí.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: nínú ìrònú ọkàn wọn
  rationale: Ìtumọ̀ yìí pa àsọyé inú-ẹni ti Gíríìkì àti ìrísí ọ̀rọ̀ Sẹ́mítì mọ́. Ó tún fi àyè sílẹ̀ fún διανοίᾳ láti jẹ́ agbègbè ìrònú tàbí ète inú.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn ọ̀rọ̀-ìṣe aorist nínú orin Màríà
  choice: Lo ‘Ó ti ...’ láti fi ìṣe tí ó ti ṣẹlẹ̀, tí ìtumọ̀ rẹ̀ sì ṣì wà, hàn
  alternative: 'Lo àkókò tí ó kọjá lásán: ‘Ó fi ... hàn; ó tú ... ká’'
  rationale: Aorist lè ṣàkójọpọ̀ àwọn iṣẹ́ Ọlọ́run tí ó dájú, ó sì lè ní agbára àsọtẹ́lẹ̀ nínú orin náà. ‘Ó ti’ jẹ́ kí ìṣe tí ó pé àti ìjẹ́pàtàkì rẹ̀ títí di ìsinsìnyí hàn láì pinnu gbogbo àríyànjiyàn náà.
- issue: Ìbáṣepọ̀ διανοίᾳ pẹ̀lú ‘àwọn agbéraga’ àti ‘ọkàn wọn’
  choice: ‘nínú ìrònú ọkàn wọn’
  alternative: ‘nítorí ète ọkàn wọn’ tàbí ‘nínú ìròyìn ọkàn wọn’
  rationale: Ilana Gíríìkì lè tọ́ka sí agbègbè ìrònú wọn tàbí sí ète inú wọn. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àìdájú gidi yìí mọ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. A lo ‘apá’ láti pa àwòrán agbára Ọlọ́run mọ́, ‘tú ... ká’ fún ọ̀rọ̀ àdánidá, àti ‘ìrònú ọkàn’ láti ṣètọ́jú àsọyé inú-ẹni ti orísun.
