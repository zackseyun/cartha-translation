  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa. “Ó ti fi apá rẹ̀ hàn pé òun lágbára” ń sọ Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ ní ọ̀nà Yorùbá tó ṣeé yé, ó sì pa àwòrán ‘apá’ Ọlọ́run mọ́. “Ó ti tú àwọn agbéraga ká” bá διεσκόρπισεν ὑπερηφάνους mu. Àsọyé “nínú ìrònú ọkàn wọn” ń pa àìdájú tó wà nínú διανοίᾳ καρδίας αὐτῶν mọ́, àti àlàyé ìsàlẹ̀ ń fúnni ní àwọn ìfẹ̀hónúhàn míì láì fi ìtumọ̀ kan lélẹ̀ gẹ́gẹ́ bí èyí kan ṣoṣo.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìpele àpéjọ tó dára, ó sì ní àmì ohùn tó pé níbi tí ó yẹ. “Fi apá rẹ̀ hàn pé òun lágbára” àti “tú ... ká” jẹ́ ìsọ̀rọ̀ àdánidá. “Ìrònú ọkàn wọn” tún bá ẹ̀wẹ̀ ìlò Bíbélì mu.
  terminology: “Apá” tọ́jú àwòrán ìṣàpẹẹrẹ orísun náà; “agbéraga” sì mú ὑπερήφανοι hàn ní kedere gẹ́gẹ́ bí àwọn ènìyàn onígbèéraga. Kò sí ìpinnu ẹ̀kọ́ ìjọ kan tí a fi kún ẹsẹ̀ náà.
