language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: yo
  text: Òun yóò sì yí ọ̀pọ̀ nínú àwọn ọmọ Ísírẹ́lì padà sí Olúwa, Ọlọ́run wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ọmọkùnrin Ísírẹ́lì” tàbí “àwọn ará Ísírẹ́lì.” Èdè Gíríìkì ní “àwọn ọmọkùnrin Ísírẹ́lì,” ọ̀rọ̀ májẹ̀mú ìbílẹ̀ tí ń tọ́ka sí àwọn ènìyàn Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ẹsẹ tó ṣáájú; fífi “Ó” kún un mú kí gbólóhùn Yorùbá péye nípa títọ́ka sí Jòhánù.
- source_word: πολλοὺς
  choice: ọ̀pọ̀lọpọ̀ nínú
  rationale: Adjective náà dúró bí nọ́ọ̀nù, ó sì ń tọ́ka sí ọ̀pọ̀ ènìyàn láti inú ẹgbẹ́ tí ọ̀rọ̀ tó tẹ̀ lé sọ.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: “Àwọn ọmọ Ísírẹ́lì” jẹ́ ọ̀rọ̀ májẹ̀mú tí ó ti fìdí múlẹ̀ nínú èdè Bíbélì Yorùbá; ó tún lè túmọ̀ sí àwọn ọmọkùnrin ní tààrà, ṣùgbọ́n nínú àṣà ọ̀rọ̀ yìí ó ń tọ́ka sí àwọn ọmọ Ísírẹ́lì lápapọ̀.
- source_word: ἐπιστρέψει
  choice: máa yí ... padà
  rationale: 'Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí ní agbára aláṣeyọrí: Jòhánù ni yóò jẹ́ ohun èlò láti yí ọ̀pọ̀ ènìyàn padà, kì í ṣe pé àwọn fúnra wọn nìkan ni yóò padà.'
- source_word: ἐπὶ
  choice: sọ́dọ̀
  rationale: Pẹ̀lú ἐπιστρέφω àti accusative, ó fi ìdarí padà sí ẹni kan hàn; “sọ́dọ̀” jẹ́ èdè Yorùbá àdánidá fún ìpadà tọ Ọlọ́run lọ.
- source_word: κύριον
  choice: Olúwa
  rationale: Ní àyíká yìí κύριος ń tọ́ka sí Ọlọ́run Ísírẹ́lì, kì í ṣe ọ̀gá ènìyàn; “Olúwa” pa ìwọ̀n ẹ̀sìn àti májẹ̀mú rẹ̀ mọ́.
- source_word: τὸν θεὸν αὐτῶν
  choice: Ọlọ́run wọn
  rationale: Gbólóhùn náà dúró ní apposition sí “Olúwa,” ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ májẹ̀mú náà.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ májẹ̀mú τῶν υἱῶν Ἰσραὴλ
  choice: àwọn ọmọ Ísírẹ́lì
  alternative: àwọn ọmọkùnrin Ísírẹ́lì; àwọn ará Ísírẹ́lì
  rationale: Èdè Yorùbá “ọmọ” lè gba akọ tàbí abo, ó sì pa ọ̀rọ̀ ìbílẹ̀ májẹ̀mú mọ́ láìfi akọ kún un níbi tí gbólóhùn Gíríìkì ti lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àpapọ̀ fún àwọn ará Ísírẹ́lì.
- issue: Ẹni tí κύριον τὸν θεὸν αὐτῶν ń tọ́ka sí
  choice: Olúwa Ọlọ́run wọn
  alternative: ọ̀gá wọn, Ọlọ́run wọn
  rationale: Apposition náà fi hàn pé “Olúwa” ni Ọlọ́run Ísírẹ́lì; nítorí náà, “Olúwa” ni ìtumọ̀ tó bá agbára ẹ̀kọ́ Ọlọ́run àti èdè májẹ̀mú mu.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “yí ... padà sọ́dọ̀” láti pa ipa aláṣeyọrí ἐπιστρέψει mọ́, a sì lo “àwọn ọmọ Ísírẹ́lì” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tó mọ́gbọ́n dání.
