id: LUK.1.2
reference: Luke 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: yo
  text: gẹ́gẹ́ bí àwọn tí wọ́n jẹ́ ẹlẹ́rìí ohun tí wọ́n fi ojú ara wọn rí láti ìbẹ̀rẹ̀, tí wọ́n sì di ìránṣẹ́ ọ̀rọ̀ náà, ṣe fi àwọn nǹkan wọ̀nyí lé wa lọ́wọ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn náà.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí “ọ̀rọ̀,” “ìhìn,” tàbí “àkọsílẹ̀”; níbí, ó ṣeé ṣe jù lọ pé ó ń tọ́ka sí ìhìn tí a kéde nípa Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu ẹsẹ yìí pẹ̀lú gbólóhùn tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: παρέδοσαν
  choice: ti fi àwọn nǹkan wọ̀nyí lé wa lọ́wọ́
  rationale: Àṣàyàn yìí fi ìtumọ̀ fífi ìròyìn tàbí àṣà tí a gbà sílẹ̀ fún àwọn ẹlòmíràn hàn; ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí wà nínú ẹsẹ 1.
- source_word: ἡμῖν
  choice: wa
  rationale: Ó túmọ̀ sí ‘fún wa’ gẹ́gẹ́ bí ẹni tí a fi ohun náà lé lọ́wọ́.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: àwọn tí ... láti ìbẹ̀rẹ̀
  rationale: Ó pa ìtọ́kasí sí àwọn ènìyàn tí wọ́n wà níbẹ̀ láti ìbẹ̀rẹ̀ mọ́.
- source_word: αὐτόπται
  choice: ẹlẹ́rìí ohun tí wọ́n fi ojú ara wọn rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé wọ́n rí àwọn ìṣẹ̀lẹ̀ náà fúnra wọn.
- source_word: ὑπηρέται
  choice: ìránṣẹ́
  rationale: ‘Ìránṣẹ́’ sọ iṣẹ́ ìsìn wọn ní kedere láìfi ipò àjọ ẹ̀sìn kan kún ọ̀rọ̀ náà.
- source_word: γενόμενοι
  choice: tí wọ́n sì di
  rationale: Ó pa ìtumọ̀ ‘wọ́n di’ mọ́, dípò kí a sọ pé wọ́n kàn jẹ́ ìránṣẹ́, ó sì tẹ̀ lé àtúnyẹ̀wò orísun pẹkipẹki.
- source_word: τοῦ λόγου
  choice: ọ̀rọ̀ náà
  rationale: Ó pa ìgbòòrò ìtumọ̀ λόγος mọ́, bó tilẹ̀ jẹ́ pé níbí ó ṣeé ṣe kó túmọ̀ sí ìhìn tí a kéde nípa Jésù.
theological_decisions:
- issue: Ohun tí ‘ọ̀rọ̀ náà’ (τοῦ λόγου) ń tọ́ka sí
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà; àkọsílẹ̀ náà
  rationale: Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ìhìn tí a kéde nípa Jésù, kì í ṣe dandan sí Logos gẹ́gẹ́ bí orúkọ oyè Kristi. Àyọkà pàtàkì pa ọ̀rọ̀ tó gbòòrò mọ́, àlàyé ìsàlẹ̀ sì fi àṣàyàn tó ṣeé ṣe hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn náà jẹ́ apá kan nínú gbólóhùn gígùn tí ó bẹ̀rẹ̀ ní ẹsẹ 1, nítorí náà a pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ‘gẹ́gẹ́ bí’ àti àmì kọ́má ní òpin.
