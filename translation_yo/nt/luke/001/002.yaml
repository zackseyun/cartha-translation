  to: gẹ́gẹ́ bí àwọn tí wọ́n jẹ́ ẹlẹ́rìí ohun tí wọ́n fi ojú ara wọn rí láti ìbẹ̀rẹ̀, tí wọ́n sì di ìránṣẹ́ ọ̀rọ̀ náà, ṣe fi àwọn nǹkan wọ̀nyí lé wa lọ́wọ́,[a]
