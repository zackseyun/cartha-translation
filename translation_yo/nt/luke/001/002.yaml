  source_fidelity: Ìtumọ̀ náà gbé ìbáṣepọ̀ καθὼς, ìjẹ́-ẹlẹ́rìí láti ìbẹ̀rẹ̀, ‘wọ́n di’ fún γενόμενοι, àti fífi àṣà/ìròyìn lé àwọn olùgbà lọ́wọ́ hàn dáadáa. ‘Àwọn nǹkan wọ̀nyí’ ń ṣàfihàn ohun tí a fi lé wọn lọ́wọ́, tí a gbọ́dọ̀ ka láti inú àyíká ẹsẹ 1; kò yí ìtumọ̀ padà.
