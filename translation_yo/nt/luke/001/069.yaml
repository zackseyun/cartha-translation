  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: yo
  text: ó sì gbé ìwo ìgbàlà dìde fún wa nínú ilé Dáfídì, ìránṣẹ́ rẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olùgbàlà alágbára.” Ní tààràtà, “ìwo ìgbàlà”; àwòrán Bíbélì ni fún agbára tó ń mú ìdáǹdè wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: gbé ... dìde
  rationale: Ó pa àwòrán ìṣe Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tí ó gbé agbára ìgbàlà dìde; àkókò tí ọ̀rọ̀ orin ìyìn yìí wà nínú rẹ̀ jẹ́ kí a lo ìṣe tó ti ṣẹlẹ̀ láìfi ọ̀rọ̀ àfikún kún un.
- source_word: κέρας σωτηρίας
  choice: ìwo ìgbàlà
  rationale: Ó pa àwòrán Bíbélì nípa ìwo gẹ́gẹ́ bí àmì agbára àti ìṣẹ́gun mọ́, dípò yíyanju rẹ̀ sí ‘Olùgbàlà alágbára.’
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dátífù náà fi ẹni tí ìṣe náà ṣe àǹfààní fún hàn.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: nínú ilé Dáfídì
  rationale: ‘Ilé’ tọ́ka sí ìdílé tàbí ìlà ọba Dáfídì, ó sì pa èdè májẹ̀mú Dáfídì mọ́; ‘nínú’ tẹ̀ lé ἐν láìṣàlàyé rẹ̀ ju bó ṣe yẹ lọ.
- source_word: παιδὸς αὐτοῦ
  choice: ìránṣẹ́ rẹ̀
  rationale: Nípa Dáfídì, παῖς nínú èdè Bíbélì túmọ̀ sí ìránṣẹ́ Ọlọ́run; ‘ọmọ rẹ̀’ lè mú òye tí kò tọ́ wá.
theological_decisions:
- issue: Bóyá kí a pa àpẹẹrẹ ‘ìwo ìgbàlà’ mọ́ tàbí kí a túmọ̀ rẹ̀ sí oyè bí ‘Olùgbàlà alágbára.’
  choice: Pa ‘ìwo ìgbàlà’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Olùgbàlà alágbára
  rationale: Gíríìkì lo àwòrán Bíbélì tó ní ìbáṣepọ̀ pẹ̀lú agbára ọba, ìṣẹ́gun, àti ìdáǹdè. Pípa àwòrán náà mọ́ kò dín ìtumọ̀ rẹ̀ kù sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá àkókò yìí tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ìwo ìgbàlà’ jẹ́ àpẹẹrẹ tí kò wọ́pọ̀ nínú ọ̀rọ̀ ojoojúmọ́, ṣùgbọ́n a pa á mọ́ nítorí ìjìnlẹ̀ ìtumọ̀ Bíbélì rẹ̀, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
