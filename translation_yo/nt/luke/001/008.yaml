  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí Sekaráyà ń ṣe iṣẹ́ àlùfáà níwájú Ọlọ́run gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ ẹgbẹ́ àlùfáà rẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ń ṣiṣẹ́ gẹ́gẹ́ bí àlùfáà níwájú Ọlọ́run ní àkókò ìṣiṣẹ́ ẹgbẹ́ àlùfáà rẹ̀.”
    reason: Àṣàyàn ọ̀rọ̀ fún ìtumọ̀ ἐν τῷ ἱερατεύειν àti ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ó ṣẹlẹ̀ pé
  rationale: Ó mú ọ̀nà ìtàn tí gbólóhùn Gíríìkì yìí ń gbà ṣí ìṣẹ̀lẹ̀ tuntun jáde, láì lo ọ̀rọ̀ Yorùbá àtijọ́ tàbí fi ìtakò líle kún δέ.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: nígbà tí Sekaráyà ń ṣe iṣẹ́ àlùfáà
  rationale: Ẹ̀ka ọ̀rọ̀ ἐν pẹ̀lú infinitive náà ń tọ́ka sí àkókò; fífi orúkọ Sekaráyà hàn mú kí Yorùbá ṣe kedere, nígbà tí ‘ṣe iṣẹ́ àlùfáà’ pa ìtumọ̀ iṣẹ́ ìsìn àlùfáà mọ́.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ ẹgbẹ́ iṣẹ́ rẹ̀
  rationale: τάξις ń tọ́ka sí ètò tí a yàn kalẹ̀, ἐφημερία sì jẹ́ ẹgbẹ́ àwọn àlùfáà tí ń ṣiṣẹ́ ní àkókò tí a pín fún wọn; yíyàn yìí ṣe kedere fún òǹkàwé òde òní.
- source_word: ἔναντι τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún iṣẹ́ tí a ń ṣe ní iwájú tàbí ní ojú Ọlọ́run.
theological_decisions:
- issue: Ọ̀rọ̀ nípa iṣẹ́ ìsìn tẹ́ńpìlì Sekaráyà
  choice: ń ṣe iṣẹ́ àlùfáà níwájú Ọlọ́run, gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ ẹgbẹ́ iṣẹ́ rẹ̀
  alternative: ń ṣiṣẹ́ gẹ́gẹ́ bí àlùfáà níwájú Ọlọ́run ní àkókò ìṣiṣẹ́ ẹgbẹ́ rẹ̀
  rationale: Ìtumọ̀ tí a yàn pa àyíká iṣẹ́ àwọn àlùfáà ní tẹ́ńpìlì àti ìpín wọn sí ẹgbẹ́ mọ́, láì kó èrò ìjọ tàbí ẹ̀kọ́ ìsìn ìgbà tó tẹ̀ lé e wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn láti lóye. A lo ‘Sekaráyà’ dípò arọ́pò-orúkọ nítorí ìtumọ̀ ẹsẹ kan ṣoṣo nílò kí ẹni tí ‘αὐτόν’ ń tọ́ka sí ṣe kedere láti inú àyíká.
