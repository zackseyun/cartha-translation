review_pass:
  verdict: revise
  source_fidelity: Àkọsílẹ̀ náà tọ́ka sí ῥῆμα gẹ́gẹ́ bí “ọ̀rọ̀,” ó sì dá παρὰ τοῦ θεοῦ lórí orísun náà dáadáa. Ṣùgbọ́n “tí yóò ṣòroó ṣe” yí ìtumọ̀ pada sí ohun tí ó ṣòro láti ṣe, dípò ohun tí kò ṣeé ṣe; ó tún fi ẹni tí yóò ṣe e sílẹ̀ láìsọ.
