  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: yo
  text: Nítorí kò sí ọ̀rọ̀ kankan láti ọ̀dọ̀ Ọlọ́run tí yóò jẹ́ aláìṣeéṣe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí kò sí ohun kan tí yóò jẹ́ aláìṣeéṣe fún Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí ọ̀rọ̀ Gébúrẹ́lì tó ṣáájú.
- source_word: οὐκ ἀδυνατήσει
  choice: kò sí ... tí yóò ṣòroó ṣe
  rationale: Èyí sọ ìtumọ̀ pé kò lè ṣeé ṣe ní Yorùbá àdánidá, ó sì bá ọ̀nà tí a gbà lo àìlódì pẹ̀lú πᾶν mu.
- source_word: παρὰ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Παρά pẹ̀lú genitive lè tọ́ka sí orísun; níbí ó so ῥῆμα mọ́ ọ̀rọ̀ tí ó ti ọ̀dọ̀ Ọlọ́run wá.
- source_word: πᾶν
  choice: kò sí ... kankan
  rationale: Bí ó tilẹ̀ jẹ́ pé πᾶν túmọ̀ sí ‘gbogbo,’ àkópọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-àìlódì ni a sọ lọ́nà àdánidá ní Yorùbá pé ‘kò sí ... kankan.’
- source_word: ῥῆμα
  choice: ọ̀rọ̀
  rationale: ‘Ọ̀rọ̀’ pa ìtumọ̀ gbólóhùn tàbí ìkéde mọ́, ó sì yẹ fún ọ̀rọ̀ tí Gébúrẹ́lì kéde ní àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Kò sí ọ̀rọ̀ kankan láti ọ̀dọ̀ Ọlọ́run tí yóò ṣòroó ṣe.
  alternative: Nítorí kò sí ohun kan tí kò lè ṣeé ṣe lọ́dọ̀ Ọlọ́run.
  rationale: Ọ̀nà méjèèjì ṣeé gbà gẹ́gẹ́ bí gírámà Gíríìkì. Àkọ́kọ́ pa ῥῆμα (‘ọ̀rọ̀’) mọ́, ó sì bá ìkéde Gébúrẹ́lì mu; àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ ‘lọ́dọ̀ Ọlọ́run’ mọ́ láìfipá yanju ìyàtọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ṣòroó ṣe’ yàgò fún gbólóhùn líle, ó sì jẹ́ kí ìtumọ̀ àìṣeéṣe hàn kedere.
