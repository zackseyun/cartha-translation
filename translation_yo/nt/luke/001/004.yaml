  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń mú ète ἵνα, ìmọ̀ ἐπιγνῷς, ìdánilójú ἀσφάλεια, àti ìkọ́ni àìṣe κατηχήθης jáde dáadáa. Síbẹ̀, fífi “nípa” kún un ń sọ ìbáṣepọ̀ περί ὧν hàn kedere: Teófílù máa mọ ìdánilójú nípa àwọn ohun tí a ti kọ́ ọ, kì í ṣe kìkì gba ìdánilójú gẹ́gẹ́ bí ohun aláìní kókó.'
