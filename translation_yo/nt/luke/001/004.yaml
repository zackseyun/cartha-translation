  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: yo
  text: kí o lè mọ ìdánilójú[a] nípa àwọn ohun tí a ti kọ́ ọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé” tàbí “bí ó ṣe ṣeé gbára lé”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdánilójú tàbí ìgbẹ́kẹ̀lé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “a ti fún ọ ní ìtọ́nisọ́nà nípa wọn”; ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka sí ìkọ́ni tí a fi ọ̀rọ̀ ẹnu ṣe, ó sì jẹ́ orísun ọ̀rọ̀ Gẹ̀ẹ́sì náà “catechized.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí o lè
  rationale: Ó mú gbólóhùn ète Lúùkù jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘kí ó lè ṣẹlẹ̀ pé’ mọ́.
- source_word: ἐπιγνῷς
  choice: mọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí mímọ̀ tàbí dídámọ̀ dáadáa; ‘mọ’ ṣe kedere, kò sì fi agbára àfikún tí ọ̀rọ̀ Gíríìkì kò fi dandan béèrè kún un.
- source_word: περὶ ὧν … λόγων
  choice: àwọn ohun tí
  rationale: Nínú àyíká yìí, λόγων ń tọ́ka sí kókó tàbí àkóónú àwọn ohun tí a ti kọ́ Teófílù, kì í ṣe ‘àwọn ọ̀rọ̀’ lásán. ‘Àwọn ohun tí’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́.
- source_word: κατηχήθης
  choice: a ti kọ́ ọ
  rationale: Ó pa ohùn àìṣe Gíríìkì mọ́, ó sì sọ ìkọ́ni tí Teófílù ti gbà jáde láìfi èdè ìjọ ti àkókò tó wá lẹ́yìn náà wọ ọ́.
- source_word: τὴν ἀσφάλειαν
  choice: ìdánilójú
  rationale: ‘Ìdánilójú’ lè sọ pé ohun náà dájú àti pé ẹni lè ní ìgbẹ́kẹ̀lé nínú rẹ̀; ó bá fífẹ̀ ìtumọ̀ ἀσφάλεια mu láìdín in kù sí ìmọ̀lára inú tàbí ẹ̀rí ìtàn nìkan.
theological_decisions:
- issue: Irú ìdánilójú tí Lúùkù fẹ́ kí Teófílù ní
  choice: ìdánilójú
  alternative: ìṣeé-gbára-lé tàbí ìfọkànbalẹ̀ inú
  rationale: ἀσφάλεια lè tọ́ka sí bí ẹ̀kọ́ náà ṣe dájú, bí ó ṣe ṣeé gbára lé, àti ìfọkànbalẹ̀ tí ìmọ̀ yẹn ń mú wá. A kò fi ìtumọ̀ náà mọ́ ọ̀kan ṣoṣo lára àwọn apá wọ̀nyí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘kí o lè’ gẹ́gẹ́ bí ọ̀nà àdánidá láti fi ète hàn, a sì pa àmì ohùn mọ́ níbi tí ó yẹ.
