  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: yo
  text: gẹ́gẹ́ bí àṣà iṣẹ́ àlùfáà, a ṣẹ́ ìbò, ìbò sì kan án láti sun tùràrí nígbà tí ó wọ inú ibi mímọ́ Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “inú tẹ́ńpìlì Olúwa.” Ọ̀rọ̀ Gíríìkì náà, ναός, sábà máa ń tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbàlá tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: gẹ́gẹ́ bí àṣà iṣẹ́ àlùfáà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun tí ó ṣẹlẹ̀ bá ìlànà tí a ti ń tẹ̀ lé nínú iṣẹ́ àlùfáà mu; “iṣẹ́ àlùfáà” tún pa ìtumọ̀ ipò àti iṣẹ́ ἱερατεία mọ́.
- source_word: ἔλαχε
  choice: ìbò kan án
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ojúṣe kan bá ẹnì kan nípasẹ̀ yíyan ìbò, láìfi ẹni tí ó ṣe yíyan kún ohun tí Gíríìkì kò sọ.
- source_word: τοῦ θυμιᾶσαι
  choice: láti sun tùràrí
  rationale: Ó sọ iṣẹ́ tí ìbò náà yàn án fún ní kedere, ó sì pa ìtumọ̀ fífi tùràrí jóná mọ́.
- source_word: εἰσελθὼν
  choice: nígbà tí ó wọ inú
  rationale: Ó fi ìbáṣepọ̀ àkókò participle náà hàn láìpinnu bóyá ìwọlé náà ti parí pátápátá ṣáájú fífi tùràrí jóná.
- source_word: εἰς τὸν ναὸν τοῦ κυρίου
  choice: wọ inú ibi mímọ́ Olúwa
  rationale: Nínú ọ̀rọ̀ nípa fífi tùràrí rú, ναός ń tọ́ka sí ilé mímọ́ inú tẹ́ńpìlì, kì í sábà tọ́ka sí gbogbo àgbàlá tẹ́ńpìlì; “ibi mímọ́ Olúwa” mú ìtumọ̀ yẹn jáde ní Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìtumọ̀ ναός nínú ọ̀rọ̀ iṣẹ́ tẹ́ńpìlì
  choice: ibi mímọ́ Olúwa
  alternative: tẹ́ńpìlì Olúwa
  rationale: Nítorí Sakaríà wọlé láti sun tùràrí, ibi mímọ́ inú ilé tẹ́ńpìlì ni ọ̀rọ̀ náà ṣeé ṣe kí ó túmọ̀ sí. A yan ọ̀rọ̀ tó ṣe pàtó yìí, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìyàtọ̀ rẹ̀ sí gbogbo àgbègbè tẹ́ńpìlì hàn.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Ìbò kan án” jẹ́ gbólóhùn àdánidá fún yíyan nípa ìbò, “tùràrí” sì jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún incense.
