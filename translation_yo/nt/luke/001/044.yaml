id: LUK.1.44
reference: Luke 1:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: yo
  text: Nítorí, kíyè sí i, nígbà tí ohùn ìkíni rẹ dé etí mi, ọmọ náà fò sókè fún ayọ̀ nínú ilé-ọmọ mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọ náà fò sókè nínú ìdùnnú ńlá nínú ilé-ọmọ mi.”
    reason: Àṣàyàn yìí fi ìtumọ̀ gígùn ἐν ἀγαλλιάσει, ìyẹn ayọ̀ ńlá tàbí ìdùnnú tó kún àkúnya, hàn ní kíkún sí i.
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ tó ń pe olùgbọ́ láti fiyè sí ohun tó tẹ̀ lé mọ́, ó sì jẹ́ Yorùbá òde òní tó bójú mu.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí ọ̀rọ̀ tí Elisabeti sọ ṣáájú.
- source_word: ὡς ἐγένετο ... εἰς τὰ ὦτά μου
  choice: nígbà tí ... dé etí mi
  rationale: Ọ̀rọ̀ yìí sọ àsìkò tí ohun náà dé etí Elisabeti, ó sì pa àwòrán ìgbọ́ràn gidi mọ́ ní Yorùbá àdánidá.
- source_word: φωνὴ τοῦ ἀσπασμοῦ σου
  choice: ohùn ìkíni rẹ
  rationale: ‘Ohùn’ tọ́ka sí ohun tí a gbọ́, ‘ìkíni’ sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ἀσπασμός.
- source_word: ἐσκίρτησεν
  choice: fò sókè
  rationale: Ó mú ìṣípòpadà ọmọ náà tó ṣẹlẹ̀ lójijì àti tó lágbára jáde ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐν ἀγαλλιάσει
  choice: fún ayọ̀
  rationale: Ó sọ ìtumọ̀ ayọ̀ ńlá tàbí ìdùnnú tó hàn gbangba ní èdè Yorùbá àdánidá, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: τὸ βρέφος
  choice: ọmọ náà
  rationale: βρέφος ń tọ́ka sí ọmọ tí ó ṣì wà nínú ilé-ọmọ níhìn-ín; ‘ọmọ náà’ jẹ́ ọ̀nà àdánidá láti tọ́ka sí Jòhánù tí a mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: nínú ilé-ọmọ mi
  rationale: ‘Ilé-ọmọ’ jẹ́ ọ̀rọ̀ tó ṣe pàtó fún ibi tí ọmọ inú oyún wà, ó sì yẹra fún àìmọ́ye tó lè wà nínú ‘nínú mi’ nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ βρέφος nípa Jòhánù tí kò tíì bí
  choice: ọmọ náà
  alternative: ọmọ kékeré náà; ọmọ inú oyún náà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọmọ ọwọ́ tàbí ọmọ tí kò tíì bí. Ní àyíká yìí, ‘ọmọ náà’ pa ìtumọ̀ ọ̀rọ̀ náà mọ́, ‘nínú ilé-ọmọ mi’ sì mú ipò rẹ̀ ṣe kedere láìfi ẹ̀kọ́ ìjọ kan kun ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kíyè sí i’ gẹ́gẹ́ bí àmì ọ̀rọ̀ ìpe àfiyèsí, ‘dé etí mi’ gẹ́gẹ́ bí àpólà àdánidá, àti ‘ilé-ọmọ’ láti mú ibi tí ọmọ náà wà ṣe pàtó.
