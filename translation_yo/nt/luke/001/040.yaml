  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: yo
  text: ó sì wọ ilé Sekaráyà, ó sì kí Elisabeti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: ó sì
  rationale: Àwọn καί méjèèjì so àwọn ìṣe tó tẹ̀ lé ara wọn pọ̀. “Ó sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìṣàn ìtàn náà mọ́.
- source_word: εἰσῆλθεν
  choice: wọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwọ inú ibi kan; “wọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá εἰς τὸν οἶκον mu.
- source_word: οἶκον
  choice: ilé
  rationale: Níhìn-ín, οἶκος ń tọ́ka sí ibi tí a wọ̀, nítorí náà “ilé” dára ju ìtumọ̀ tó lè tọ́ka sí agbo ilé lọ.
- source_word: Ζαχαρίου
  choice: Sekaráyà
  rationale: A lo ìrísí orúkọ tí ó ti wọ́pọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: ἠσπάσατο
  choice: kí
  rationale: Ní àyíká yìí, ἀσπάζομαι túmọ̀ sí kíkí ẹnì kan. “Kí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kò sì fi ìmọ̀lára tàbí ayẹyẹ tí kò sí nínú Gíríìkì kún un.
- source_word: Ἐλισάβετ
  choice: Elisabeti
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó rọrùn fún olùkà Yorùbá láti ka àti pè.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, kedere, ọlọ́lá, tí ó sì bá ìtàn àtẹ̀lé mu. A kò fi àlàyé tí kò sí nínú orísun kún ẹsẹ náà.
