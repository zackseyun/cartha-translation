id: LUK.1.79
reference: Luke 1:79
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: yo
  text: láti tàn sí àwọn tí ó jókòó nínú òkùnkùn àti òjìji ikú[a], láti darí ẹsẹ̀ wa sí ọ̀nà àlàáfíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan tú gbólóhùn náà sí “òkùnkùn biribiri,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì mẹ́nu kan “ikú” ní kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: láti tàn sí
  rationale: Ó pa àwòrán ìmọ́lẹ̀ tí ń yọ sí àwọn tó wà nínú òkùnkùn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: àwọn tí ó jókòó nínú òkùnkùn
  rationale: Ìtumọ̀ yìí pa ìṣe ‘jókòó’ mọ́ dípò kí ó sọ ọ́ di ‘gbé,’ nítorí àwòrán ewì àti ìbáṣepọ̀ rẹ̀ pẹ̀lú èdè Aísáyà.
- source_word: σκότει
  choice: òkùnkùn
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún σκότος, tí ó sì lè ru ìtumọ̀ gidi àti àpẹẹrẹ láìfi àlàyé kún un.
- source_word: σκιᾷ θανάτου
  choice: òjìji ikú
  rationale: Ó pa ọ̀rọ̀ ‘ikú’ tó fara hàn gbangba nínú Gíríìkì àti àwòrán òjìji mọ́.
- source_word: τοῦ κατευθῦναι
  choice: láti darí
  rationale: ‘Darí’ bá àpẹẹrẹ ẹsẹ̀ àti ọ̀nà mu, ó sì sọ ìtọ́sọ́nà jáde láìtú àwòrán náà ká.
- source_word: τοὺς πόδας ἡμῶν
  choice: ẹsẹ̀ wa
  rationale: Ó pa àwòrán ara tó wà nínú Gíríìkì mọ́ dípò ṣíṣàkóso rẹ̀ sí ‘àwa.’
- source_word: εἰς ὁδὸν εἰρήνης
  choice: sí ọ̀nà àlàáfíà
  rationale: ‘Ọ̀nà àlàáfíà’ jẹ́ èdè Yorùbá tó ṣe déédé, ó sì pa àwòrán ọ̀nà àti ìtumọ̀ àlàáfíà mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú àwòrán òkùnkùn, òjìji ikú, ẹsẹ̀ àti ọ̀nà
  choice: Pa gbogbo àwòrán náà mọ́ láìṣàlàyé wọn nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí àìmọ̀ nípa ẹ̀mí, ewu ikú, tàbí ìwà rere tó ń mú àlàáfíà wá.
  rationale: Ẹsẹ yìí jẹ́ ewì, ó sì ní ìtọ́kasí sí èdè Ìwé Mímọ́ àtijọ́; fífi àwòrán náà sílẹ̀ pa ìṣòro àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ewì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àlàáfíà’ fún εἰρήνη nítorí pé ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè gba ìtumọ̀ ìbágbépo àti ìlera pípé.
