  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: yo
  text: Ẹnu rẹ̀ ṣí lẹ́sẹ̀kẹsẹ̀, ahọ́n rẹ̀ náà sì ṣí[a]; ó sì bẹ̀rẹ̀ sí í sọ̀rọ̀[b], ó ń fi ìbùkún fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan ní, “a sì tú ahọ́n rẹ̀,” ṣùgbọ́n Gíríìkì níbí sọ ní tààrà pé, “ahọ́n rẹ̀ náà”; ó mẹ́nuba ìpadàbọ̀ agbára ọ̀rọ̀ láì fi “a tú” kún un.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ń sọ̀rọ̀, ó ń fi ìbùkún fún Ọlọ́run.” Ọ̀rọ̀-ìṣe imperfect náà lè tẹnu mọ́ ìtẹ̀síwájú sísọ̀rọ̀ dípò ìbẹ̀rẹ̀ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: ṣí
  rationale: Ọ̀rọ̀-ìṣe yìí jẹ́ aorist passive, ṣùgbọ́n gbólóhùn Yorùbá “ẹnu rẹ̀ ṣí” ń sọ ìpadàbọ̀ agbára ọ̀rọ̀ lọ́nà àdánidá láì fi ẹni tó ṣe é kún ohun tí Gíríìkì sọ.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn náà síwájú; “sì” bá ìṣàn èdè Yorùbá mu láì dá ìtakora sílẹ̀.
- source_word: στόμα
  choice: ẹnu
  rationale: Èyí ni ìtumọ̀ ara taara, ó sì yẹ fún àyíká ìpadàbọ̀ agbára láti sọ̀rọ̀.
- source_word: παραχρῆμα
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ohun náà ṣẹlẹ̀ lójijì, láìsí ìdádúró.
- source_word: γλῶσσα
  choice: ahọ́n rẹ̀ pẹ̀lú
  rationale: Ó pa ìtọ́kasí Gíríìkì sí ẹnu àti ahọ́n mọ́, kò sì fi ọ̀rọ̀ bí “tú” kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: ἐλάλει
  choice: ó bẹ̀rẹ̀ sí í sọ̀rọ̀
  rationale: Imperfect náà lè tọ́ka sí ìbẹ̀rẹ̀ tàbí ìtẹ̀síwájú ọ̀rọ̀. Nínú àyíká ìmúpadàbọ̀ láti inú ìdákẹ́jẹ, “bẹ̀rẹ̀ sí í” mú agbára ìtàn náà jáde lọ́nà àdánidá.
- source_word: εὐλογῶν
  choice: ó ń fi ìbùkún fún
  rationale: Participle yìí ṣàlàyé bí ó ṣe ń sọ̀rọ̀ tàbí ohun tó ń sọ; “fi ìbùkún fún” jẹ́ ìtumọ̀ tó sún mọ́ ọ̀rọ̀ orísun ju “yin” lọ.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni olùgbà ìbùkún náà, ó sì jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń tọ́ka sí Ọlọ́run níbí.
