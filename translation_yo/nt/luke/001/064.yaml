translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn, ó lọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “Lẹ́sẹ̀kẹsẹ̀” fún ìyára ìṣẹ̀lẹ̀, a sì yàgò fún fífi aṣojú tí a kò sọ nínú Gíríìkì kún ṣíṣí ẹnu náà.
