  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí ìṣẹ̀lẹ̀ lẹ́sẹ̀kẹsẹ̀, sí ẹnu àti ahọ́n méjèèjì, àti sí sísọ̀rọ̀ nígbà tí Sakaria ń fi ìbùkún fún Ọlọ́run. Ṣùgbọ́n nínú gbólóhùn àkọ́kọ́, ìṣe tí ó kan ahọ́n jẹ́ ellipsis tí kò pé ní Yorùbá: “ahọ́n rẹ̀ pẹ̀lú” kò lè dúró gẹ́gẹ́ bí apá gbólóhùn tó pé. Fífi “ṣí” sí i ń mú ohun tí a fi sílẹ̀ nínú Gíríìkì hàn, láì rọ́pò ó pẹ̀lú “a tú.”'
