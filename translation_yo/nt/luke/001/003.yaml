id: LUK.1.3
reference: Luke 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: yo
  text: Ó dára lójú mi pẹ̀lú, lẹ́yìn tí mo ti tọpasẹ̀ gbogbo nǹkan pẹkipẹki láti ìbẹ̀rẹ̀, láti kọ ìtàn náà sí ọ ní ìtòlẹ́sẹẹsẹ[a], Teofilu, ọlọ́lá jùlọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní tẹ̀lé-tẹ̀lé”; gbólóhùn náà lè tọ́ka sí ìṣètò tó létòletò dípò ìtòlẹ́sẹẹsẹ àkókò gédégédé.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: Ó sì dára lójú mi
  rationale: Ọ̀rọ̀ yìí fi ìdájọ́ tàbí ìpinnu tí a fara balẹ̀ ṣe hàn, ó sì pa ìlànà ọ̀rọ̀ ìṣáájú Luku mọ́.
- source_word: κἀμοὶ
  choice: lójú mi pẹ̀lú
  rationale: Ó fi Luku kún àwọn tó ti kọ ìtàn ṣáájú rẹ̀, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: παρηκολουθηκότι
  choice: lẹ́yìn tí mo ti tọpa
  rationale: “Tọpa” lè gbé ìtumọ̀ títẹ̀lé pẹkipẹki àti ṣíṣe ìwádìí jáde láìfi ipa mú ọ̀kan ṣoṣo nínú wọn.
- source_word: ἄνωθεν
  choice: láti ìbẹ̀rẹ̀
  rationale: Nínú àyíká ìkọ̀wé ìtàn yìí, ọ̀rọ̀ náà tọ́ka sí ìpilẹ̀ṣẹ̀ àwọn ìṣẹ̀lẹ̀, kì í ṣe “láti òkè.”
- source_word: πᾶσιν
  choice: ohun gbogbo
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ gbogbo àwọn ọ̀ràn tàbí ìṣẹ̀lẹ̀ tí Luku ń tọpa.
- source_word: ἀκριβῶς
  choice: pẹ̀lú ìṣọ́ra
  rationale: Ó fi ìtẹnumọ́ lórí ìwádìí pẹkipẹki àti pípé hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: καθεξῆς
  choice: ní ọ̀nà tó létòletò
  rationale: Ó pa èrò ìṣètò tàbí tẹ̀lé-tẹ̀lé mọ́ láìsọ pé ó pọn dandan kí ó jẹ́ ìtòlẹ́sẹẹsẹ àkókò gédégédé.
- source_word: σοι γράψαι
  choice: láti kọ ọ́ sílẹ̀ fún ọ
  rationale: “Fún ọ” fi ẹni tí a kọ ìwé náà fún hàn, “ọ́” sì tọ́ka sí gbogbo ọ̀ràn tó wà nínú àyíká ọ̀rọ̀.
- source_word: κράτιστε
  choice: ọlọ́lá jù lọ
  rationale: Ó jẹ́ ọ̀rọ̀ ọlá tó bá àdírẹ́sì onípò gíga mu, ó sì pa ìforúkọṣílẹ̀ ọ̀wọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Θεόφιλε
  choice: Teofilu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti àkọtọ Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ καθεξῆς nípa bí a ṣe ṣètò ìtàn
  choice: ní ọ̀nà tó létòletò
  alternative: ní ìtòlẹ́sẹẹsẹ àkókò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìṣètò tàbí tẹ̀lé-tẹ̀lé, ṣùgbọ́n kò fi dandan mú kí Luku sọ pé gbogbo ohun wà ní ìtòlẹ́sẹẹsẹ àkókò gédégédé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì yẹ fún ọ̀rọ̀ ìṣáájú ìwé. A lo àmi ohùn ní kíkún níbi tó bá ti ṣe àdánidá. Àkọlé ọlá “ọlọ́lá jù lọ” ṣètìlẹ́yìn fún ìforúkọṣílẹ̀ gíga ti κράτιστε.
