id: LUK.1.76
reference: Luke 1:76
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: yo
  text: Ìwọ náà, ọmọ kékeré, a ó pè ọ́ ní wòlíì Ẹni Gíga Jù Lọ, nítorí ìwọ yóò lọ ṣáájú Olúwa[a] láti pèsè àwọn ọ̀nà rẹ̀ sílẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwájú Olúwa.” Gbólóhùn náà lè túmọ̀ sí lílọ ṣáájú ẹnì kan tàbí ṣíṣe iṣẹ́ ìránṣẹ́ níwájú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí ń rántí àwọn ìlérí àsọtẹ́lẹ̀ nípa pípèsè ọ̀nà níwájú Olúwa (fi wé Aísáyà 40:3; Málákì 3:1). Nínú ìtàn Lúùkù, iṣẹ́ ìránṣẹ́ Johanu níwájú Jésù ni ó mú èyí ṣẹ.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Àti ìwọ pẹ̀lú
  rationale: Ó fi ìyípadà ọ̀rọ̀ àti ìtẹnumọ́ ẹni tí a ń bá sọ̀rọ̀ hàn, ó sì pa agbára àfikún náà mọ́ ní Yorùbá àdánidá.
- source_word: παιδίον
  choice: ọmọ yìí
  rationale: Ọ̀rọ̀ ìpè sí Johanu nígbà tó ṣì jẹ́ ìkókó ni; ó ṣe kedere, ó sì bá ọ̀rọ̀ Yorùbá mu láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún ẹni tí ń sọ ọ̀rọ̀ Ọlọ́run.
- source_word: Ὑψίστου
  choice: Ọ̀gá-ògo
  rationale: Orúkọ oyè ọ̀wọ̀ fún Ọlọ́run ni, tí ó túmọ̀ sí Ẹni Gíga Jù Lọ; àkọsílẹ̀ ìní inú Gíríìkì wà nínú ‘wòlíì Ọ̀gá-ògo.’
- source_word: κληθήσῃ
  choice: a ó pè ọ́ ní
  rationale: Ó pa ìṣe ọjọ́ iwájú tí ẹni mìíràn yóò ṣe mọ́, ó sì lè tọ́ka sí ìyàn tàbí ìdánimọ̀ ẹni náà.
- source_word: προπορεύσῃ
  choice: yóò lọ ṣáájú
  rationale: Ó sọ ìlọ níwájú ẹni mìíràn tààrà, ó sì bá iṣẹ́ aṣáájú-ọ̀nà Johanu mu.
- source_word: ἐνώπιον κυρίου
  choice: ṣáájú Olúwa
  rationale: Ó pa ìtumọ̀ ìlọ níwájú Olúwa mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn, ‘níwájú Olúwa,’ hàn.
- source_word: ἑτοιμάσαι
  choice: láti pèsè ... sílẹ̀
  rationale: Ó fi ète ìlọ rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ὁδοὺς αὐτοῦ
  choice: àwọn ọ̀nà rẹ̀
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì tún dá ohùn àwọn àsọtẹ́lẹ̀ nípa pípèsè ọ̀nà Olúwa.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú àsọtẹ́lẹ̀ aṣáájú-ọ̀nà
  choice: A tú κύριος sí ‘Olúwa’ láì sọ ẹni tí ó ń tọ́ka sí ní pàtó nínú ẹsẹ náà.
  alternative: Ó lè tọ́ka sí Olúwa Ọlọ́run gẹ́gẹ́ bí abẹ́lẹ̀ Aísáyà àti Málákì, tàbí sí Jésù gẹ́gẹ́ bí ìmúṣẹ inú ìtàn Lúùkù.
  rationale: Àwọn ọ̀rọ̀ náà ń dún bí àwọn àsọtẹ́lẹ̀ Májẹ̀mú Láéláé nípa pípèsè ọ̀nà níwájú Olúwa, nígbà tí Lúùkù fi Johanu hàn gẹ́gẹ́ bí aṣáájú-ọ̀nà Jésù. ‘Olúwa’ pa ìdíjú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ọmọ yìí’ gẹ́gẹ́ bí ọ̀rọ̀ ìpè àdánidá, ‘Ọ̀gá-ògo’ fún oyè Ọlọ́run, àti ‘àwọn ọ̀nà rẹ̀’ láti pa ọ̀pọ̀ inú Gíríìkì àti ìró àsọtẹ́lẹ̀ mọ́.
