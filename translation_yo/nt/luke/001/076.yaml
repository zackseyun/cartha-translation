  to: Ìwọ náà, ọmọ kékeré, a ó pè ọ́ ní wòlíì Ẹni Gíga Jù Lọ, nítorí ìwọ yóò lọ ṣáájú Olúwa[a] láti pèsè àwọn ọ̀nà rẹ̀ sílẹ̀[b],
