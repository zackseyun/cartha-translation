  to: Ọmọ náà sì ń dàgbà, ó sì ń lágbára ní ẹ̀mí[a]. Ó sì wà ní àwọn aginjù[b] títí di ọjọ́ ìfarahàn rẹ̀ ní gbangba sí Israẹli[c].
  rationale: Àtúnṣe náà ṣàtúnṣe ìtumọ̀ dative πνεύματι sí ‘ní ẹ̀mí,’ ó lo ‘sí Israẹli’ fún ìtọ́sọ́nà πρός, ó sì mú ‘ἦν’ wá gẹ́gẹ́ bí ‘ó sì wà.’ Ó pa ìbánisọ̀rọ̀ àti àìdánilójú ìtumọ̀ nípa Ẹ̀mí Mímọ́ mọ́ nínú àlàyé ìsàlẹ̀.
