  source_fidelity: Ìtumọ̀ náà mú ìdàgbàsókè àti lílágbára tí àwọn imperfect Gíríìkì ń sọ, ọ̀pọ̀ ‘aginjù,’ àti ìfarahàn Johanu ní gbangba dáadáa. Ṣùgbọ́n ‘nípa ẹ̀mí’ máa ń túmọ̀ sí ọ̀nà/ohun èlò (‘by means of spirit’) nínú Yorùbá, kì í sì pa dative πνεύματι mọ́ gẹ́gẹ́ bí agbègbè tàbí apá tí ó ti ń lágbára. ‘Fún Israẹli’ sì lè yọrí sí èrò àǹfààní; ‘sí Israẹli’ dáa jù fún ìtọ́sọ́nà ìfarahàn náà.
  naturalness: ‘Ń dàgbà’ àti ‘ń lágbára’ jẹ́ Yorùbá àdánidá. ‘Ó sì wà ní àwọn aginjù’ jẹ́ ìtumọ̀ rọrùn, tó bá imperfect ‘ἦν’ mu, ju ‘ó sì ń gbé’ lọ. ‘Ọjọ́ ìfarahàn rẹ̀ ní gbangba sí Israẹli’ jẹ́ kedere, ó sì pa orúkọ-ìṣe Gíríìkì náà mọ́.
  terminology: A ti yí ‘nípa ẹ̀mí’ sí ‘ní ẹ̀mí’ láti má ṣe pinnu pé Ẹ̀mí Mímọ́ ni a túmọ̀ sí, tàbí pé ẹ̀mí ni ọ̀nà tí a fi fún un lókun. Àlàyé ìsàlẹ̀ náà ń dáàbò bo ìtumọ̀ mìíràn ‘nínú Ẹ̀mí.’ ‘Israẹli’ jẹ́ ìkọ̀wé tó yẹ.
  issues:
