source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: yo
  text: Ọmọ náà sì ń dàgbà, ó sì ń lágbára ní ẹ̀mí[a]. Ó sì wà ní àwọn aginjù[b] títí di ọjọ́ ìfarahàn rẹ̀ ní gbangba sí Israẹli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí.” Gíríìkì náà lè túmọ̀ sí pé ó ń lágbára nínú ẹ̀mí rẹ̀ tàbí ní ti ìwà inú rẹ̀, tàbí pé ó ń lágbára ní ìbáṣepọ̀ pẹ̀lú Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀; ní tààrà, “ní àwọn agbègbè aginjù” tàbí “ní àwọn ibi ahoro.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “títí di ọjọ́ ìfarahàn rẹ̀ níwájú Israẹli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: Ọmọ náà
  rationale: Ó tọ́ka sí Johanu ní ìgbà èwe rẹ̀ láìfi ọjọ́-orí pàtó lé e lórí; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: ηὔξανε
  choice: ń dàgbà
  rationale: Àkókò imperfect Gíríìkì ń fi ìṣe tó ń bá a lọ hàn; ‘ń dàgbà’ pa ìtumọ̀ yẹn mọ́.
- source_word: ἐκραταιοῦτο
  choice: ń lágbára
  rationale: Ó sọ nípa bí agbára rẹ̀ ṣe ń pọ̀ sí i lọ́nà tó ń bá a lọ, láìpinnu bóyá a ń fún un lókun tàbí òun fúnra rẹ̀ ń lágbára.
- source_word: πνεύματι
  choice: nípa ẹ̀mí
  rationale: 'Ó pa àìdánilójú Gíríìkì mọ́: ó lè tọ́ka sí agbára inú tàbí ti ẹ̀mí, tàbí sí ìbáṣepọ̀ pẹ̀lú Ẹ̀mí Mímọ́, láìfi ìtumọ̀ kejì múlẹ̀ nínú ọ̀rọ̀ pàtàkì.'
- source_word: ἐν ταῖς ἐρήμοις
  choice: ní àwọn aginjù
  rationale: Ó pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì lè túmọ̀ sí àwọn agbègbè aṣálẹ̀ tàbí ibi tí kò sí ènìyàn púpọ̀.
- source_word: ἀναδείξεως
  choice: farahàn ní gbangba
  rationale: Ó mú ìtumọ̀ fífi ẹni hàn tàbí ìjáde rẹ̀ síta ní gbangba déédé, láìlo ọ̀rọ̀ ẹ̀sìn àkànṣe.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: fún Israẹli
  rationale: Nínú àkópọ̀ yìí, πρός fi Israẹli hàn gẹ́gẹ́ bí àwọn ènìyàn tí ìfarahàn Johanu dojú kọ; ‘fún Israẹli’ jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πνεύματι nínú bí Johanu ṣe ń dàgbà
  choice: nípa ẹ̀mí
  alternative: nínú Ẹ̀mí
  rationale: Gíríìkì kò ní article, kò sì sọ Ẹ̀mí Mímọ́ ní pàtó. Ìtumọ̀ pàtàkì náà jẹ́ kí ó lè túmọ̀ sí agbára inú tàbí ti ẹ̀mí, nígbà tí àlàyé ìsàlẹ̀ sọ pé ìtọ́ka sí Ẹ̀mí Mímọ́ tún ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àwọn àsopọ̀ ‘sì’ pa ìṣàn ìtàn Gíríìkì mọ́ láìjẹ́ kí gbólóhùn náà le.
