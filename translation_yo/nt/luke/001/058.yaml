id: LUK.1.58
reference: Luke 1:58
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: yo
  text: Àwọn aládùúgbò rẹ̀ àti àwọn ìbátan rẹ̀ sì gbọ́ pé Olúwa ti fi àánú ńlá hàn sí i,[a] wọ́n sì bá a yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “Olúwa ti sọ àánú rẹ̀ di ńlá pẹ̀lú rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίοικοι
  choice: àwọn aládùúgbò rẹ̀
  rationale: Ó ń tọ́ka sí àwọn tí ń gbé ní àyíká rẹ̀; ‘àwọn aládùúgbò’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ipò náà mu.
- source_word: συγγενεῖς
  choice: àwọn ìbátan rẹ̀
  rationale: Ó túmọ̀ sí àwọn ènìyàn tí ìbátan ẹ̀jẹ̀ tàbí ẹbí so pọ̀ mọ́ ọn; ‘ìbátan’ ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ἐμεγάλυνεν
  choice: ti fi … ńlá hàn
  rationale: Ní ìtumọ̀ gbolohun yìí, ọ̀rọ̀ náà sọ pé Olúwa mú kí títóbi àánú rẹ̀ hàn gbangba; yíyan yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ‘sọ di ńlá’ mọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: Ní àyíká yìí, κύριος jẹ́ orúkọ oyè pàtó fún Ọlọ́run; ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó bójú mu.
- source_word: ἔλεος
  choice: àánú
  rationale: ‘Àánú’ ń sọ ìṣe ìyọ́nú àti inú rere sí ẹni tí a ṣàánú, ó sì bá lílo ἔλεος nínú ìtàn ìbẹ̀rẹ̀ Lúùkù mu.
- source_word: μετ’ αὐτῆς
  choice: sí i
  rationale: Bí ó tilẹ̀ jẹ́ pé μετά pẹ̀lú ẹ̀yà genitive sábà túmọ̀ sí ‘pẹ̀lú,’ nínú àkópọ̀ ọ̀rọ̀ yìí Yorùbá àdánidá ń sọ pé a fi àánú hàn ‘sí’ ẹnì kan.
- source_word: συνέχαιρον αὐτῇ
  choice: wọ́n sì bá a yọ̀
  rationale: Gbólóhùn yìí fi ayọ̀ tí wọ́n jọ pín hàn; ‘bá a yọ̀’ jẹ́ ìtumọ̀ Yorùbá tààrà, tí ó sì dára.
theological_decisions:
- issue: Ìtumọ̀ àkópọ̀ ọ̀rọ̀ ἐμεγάλυνεν … τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Olúwa ti fi àánú ńlá hàn sí i
  alternative: Olúwa ti sọ àánú rẹ̀ di ńlá pẹ̀lú rẹ̀
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ pé Olúwa ṣe àánú púpọ̀ fún un jáde. Àlàyé ìsàlẹ̀ ojú ewé pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́ láìfi gbólóhùn líle tàbí àjèjì sínú àkọ́kọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní; a lo ‘bá a yọ̀’ láti fi ayọ̀ àjọpín hàn, a sì fi àlàyé sílẹ̀ fún ìtumọ̀ ọ̀rọ̀ Gíríìkì tí ó túbọ̀ jẹ́ tààrà.
