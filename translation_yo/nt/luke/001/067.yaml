id: LUK.1.67
reference: Luke 1:67
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: yo
  text: 'Sákáríà, baba rẹ̀, sì kún fún Ẹ̀mí Mímọ́, ó sì sọ àsọtẹ́lẹ̀ pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Sákáríà
  rationale: A lo ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Bíbélì Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìbátan náà, ó sì pa ìtọ́ka sí ọmọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ́.
- source_word: ἐπλήσθη
  choice: kún fún
  rationale: 'Ó pa ìtumọ̀ ìṣe tí ó ṣẹlẹ̀ mọ́: Ẹ̀mí Mímọ́ kún inú rẹ̀. Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ passive, gbólóhùn Yorùbá yìí ni ọ̀nà àdánidá láti fi ìṣẹ̀lẹ̀ náà hàn.'
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká Lúùkù, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Ọlọ́run; lẹ́tà ńlá bá ìlò Yorùbá Bíbélì mu.
- source_word: ἐπροφήτευσεν
  choice: sọ àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì ṣàfihàn pé ohun tí ó sọ jẹ́ ọ̀rọ̀ àsọtẹ́lẹ̀ láti ọ̀dọ̀ Ọlọ́run, láìfi àlàyé míì kún un.
- source_word: λέγων
  choice: 'pé:'
  rationale: Nítorí ọ̀rọ̀ tí ó sọ ń tẹ̀ lé e, “pé:” ni ìṣàgbékalẹ̀ Yorùbá tó rọrùn, tó sì ṣe iṣẹ́ participle Gíríìkì náà.
- source_word: Καὶ
  choice: sì
  rationale: “Sì” so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá nínú ìtàn Yorùbá.
theological_decisions:
- issue: Ohun tí πνεύματος ἁγίου ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Nínú Lúùkù–Ìṣe Àwọn Àpọ́sítélì, gbólóhùn yìí ní àyíká ìmísí ọ̀rọ̀ Ọlọ́run sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a fi àmì ohùn kún ọ̀rọ̀ níbi tó yẹ. A yan “Sákáríà” gẹ́gẹ́ bí ìkọ̀wé orúkọ tó mọ́ ní àṣà Bíbélì Yorùbá.
