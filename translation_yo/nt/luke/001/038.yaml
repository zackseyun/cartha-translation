id: LUK.1.38
reference: Luke 1:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: yo
  text: Màríà sì wí pé, “Wò ó, èmi ni ìránṣẹ́bìnrin Olúwa[a]. Kí ó ṣẹlẹ̀ sí mi gẹ́gẹ́ bí ọ̀rọ̀ rẹ[b].” Áńgẹ́lì náà sì kúrò lọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹrúbìnrin Olúwa.” Ọ̀rọ̀ Gíríìkì δούλη lè túmọ̀ sí ẹrú obìnrin tàbí ìránṣẹ́ obìnrin; níhìn-ín, ọ̀rọ̀ inú ẹsẹ náà tẹnumọ́ bí Màríà ṣe rẹ ara rẹ̀ sílẹ̀, tí ó sì tẹríba fún Ọlọ́run.
    reason: alternative_reading
  - marker: b
    text: Tàbí “Kí ó jẹ́ sí mi gẹ́gẹ́ bí ọ̀rọ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ onírẹ̀lẹ̀ ni; “sì” ń tẹ ìtàn náà síwájú láìfi ìtumọ̀ àkókò kún un.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ìfihàn ara ẹni tí ó ní ọ̀wọ̀ àti ìtẹnumọ́ mọ́, ó sì ṣeé lóye ní Yorùbá òde òní.
- source_word: δούλη
  choice: ìránṣẹ́bìnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹrú tàbí ìránṣẹ́ obìnrin. Nínú àyíká yìí, ìrẹ̀lẹ̀ Màríà àti fífi ara rẹ̀ sábẹ́ Olúwa ni a tẹnumọ́; a fi ìtumọ̀ líle sí i, “ẹrúbìnrin,” sínú àlàyé ìsàlẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ orúkọ oyè fún Ọlọ́run níhìn-ín; àkójọpọ̀ “ìránṣẹ́bìnrin Olúwa” sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá.
- source_word: γένοιτό μοι
  choice: Kí ó ṣẹlẹ̀ sí mi
  rationale: Ó fi ìfẹ́ àti ìfọwọ́sí tí ọ̀rọ̀ optative náà ní hàn, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú lásán.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: gẹ́gẹ́ bí ọ̀rọ̀ rẹ
  rationale: Ó pa ìtumọ̀ pé kí ohun náà bá ìkéde tí áńgẹ́lì sọ mu mọ́; “ọ̀rọ̀” tún pa ìsopọ̀ pẹ̀lú ohun tí a sọ mọ́.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: kúrò lọ́dọ̀ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé áńgẹ́lì náà fi Màríà sílẹ̀, láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: ὁ ἄγγελος
  choice: Áńgẹ́lì náà
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe ońṣẹ́ ènìyàn lásán.
theological_decisions:
- issue: Ìtumọ̀ bí Màríà ṣe pe ara rẹ̀ ní δούλη
  choice: ìránṣẹ́bìnrin Olúwa
  alternative: ẹrúbìnrin Olúwa
  rationale: δούλη lè túmọ̀ sí ẹrú obìnrin gan-an, ṣùgbọ́n àyíká yìí tẹnumọ́ ìrẹ̀lẹ̀ àti ìtẹríba Màríà sí ìfẹ́ Ọlọ́run. A kò pa ìtumọ̀ ìdè ẹrú náà mọ́lẹ̀, nítorí a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Agbára γένοιτό μοι
  choice: Kí ó ṣẹlẹ̀ sí mi gẹ́gẹ́ bí ọ̀rọ̀ rẹ
  alternative: Kí ó rí fún mi gẹ́gẹ́ bí ọ̀rọ̀ rẹ
  rationale: Ọ̀rọ̀ yìí jẹ́ ìfọwọ́sí onítara tàbí ìfẹ́ pé ohun tí a sọ kí ó ṣẹ, kì í ṣe gbólóhùn pé ó máa ṣẹlẹ̀ lásán. Ìtumọ̀ àkọ́kọ́ ṣe kedere ní Yorùbá òde òní, nígbà tí èkejì sun mọ́ ìṣètò ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tí ó bójú mu, ṣùgbọ́n tí ó ṣì ṣeé lóye fún òǹkàwé òde òní. “Wò ó” pa ìtẹnumọ́ Ἰδοὺ mọ́; “Kí ó ṣẹlẹ̀ sí mi” sì mú ìfọwọ́sí Màríà jáde lọ́nà àdánidá. Gbogbo àmì ohùn àti àmì àlàyé ìsàlẹ̀ ni a fi sí ibi tí ó yẹ.
