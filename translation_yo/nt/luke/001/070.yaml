  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: yo
  text: gẹ́gẹ́ bí ó ti sọ láti ẹnu àwọn wòlíì mímọ́ rẹ̀ láti ìgbà àtijọ́ wá,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti àwọn ìgbà àtijọ́”; gbólóhùn náà lè tọ́ka sí ìgbà pípẹ́ gan-an sẹ́yìn. Àwọn kan túmọ̀ ọ́ ní líle sí i pé, “láti ayérayé,” ṣùgbọ́n ìtọ́kasí àwọn wòlíì níhìn-ín ń ṣètìlẹ́yìn fún ìtumọ̀ “láti ìgbà àtijọ́ wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu ohun tí a ṣẹ̀ṣẹ̀ sọ pẹ̀lú ọ̀rọ̀ tí Ọlọ́run ti sọ tẹ́lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἐλάλησεν
  choice: ó ti sọ
  rationale: Àkókò ọ̀rọ̀ náà tọ́ka sí ohun tí Ọlọ́run sọ ní ìgbà àtijọ́; ‘sọ’ sì bá gbólóhùn ‘láti ẹnu’ mu.
- source_word: διὰ στόματος
  choice: láti ẹnu
  rationale: Èyí pa àwòrán gidi ti ẹnu mọ́, ó sì fi hàn pé àwọn wòlíì ni Ọlọ́run fi sọ̀rọ̀.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: àwọn wòlíì mímọ́ rẹ̀
  rationale: ‘Mímọ́’ ṣe àpèjúwe àwọn wòlíì gẹ́gẹ́ bí ẹni tí a yà sọ́tọ̀ fún Ọlọ́run, αὐτοῦ sì túmọ̀ sí ‘rẹ̀.’
- source_word: ἀπ’ αἰῶνος
  choice: láti ìgbà àtijọ́ wá
  rationale: Nínú àyíká ọ̀rọ̀ nípa àwọn wòlíì, gbólóhùn náà tọ́ka sí ìgbà pípẹ́ sẹ́yìn, láì fi dandan sọ pé láti ayérayé.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀπ’ αἰῶνος
  choice: ìgbà àtijọ́ nínú ìtàn ìgbàlà
  alternative: láti ayérayé
  rationale: Ìtọ́kasí àwọn wòlíì lẹ́sẹ̀kẹsẹ̀ lẹ́yìn rẹ̀ mú kí ‘láti ìgbà àtijọ́ wá’ bá àyíká ọ̀rọ̀ mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa agbára ìtumọ̀ gbólóhùn náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ‘ẹnu’ mọ́ dípò yíyọ ọ́ kúrò, a sì lo ‘wòlíì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí gbogbo ènìyàn mọ̀.
