  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: yo
  text: Lẹ́yìn àwọn ọjọ́ wọ̀nyí, Elisabeti, aya rẹ̀, lóyún,[a] ó sì ń fi ara rẹ̀ pamọ́ fún oṣù márùn-ún, ó ń wí pé,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘Lẹ́yìn àwọn ọjọ́ wọ̀nyẹn.’ Ọ̀rọ̀ atọ́ka Gíríìkì náà lè tọ́ka sí ‘wọ̀nyí,’ ṣùgbọ́n ‘wọ̀nyẹn’ tún lè bá ìtàn ohun tó ti kọjá mu.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé ‘ó fi ara rẹ̀ pamọ́’ tàbí ‘ó ya ara rẹ̀ sọ́tọ̀.’ Ìrísí ọ̀rọ̀-ìṣe Gíríìkì náà fi hàn pé ìṣe yìí ń bá a lọ jálẹ̀ oṣù márùn-ún náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Lẹ́yìn àwọn ọjọ́ wọ̀nyí
  rationale: μετά pẹ̀lú accusative ń tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn àkókò kan; ταύτας jẹ́ ‘wọ̀nyí.’ A kò ya δέ sọ́tọ̀ nítorí ìsopọ̀ rẹ̀ rọrùn, àmọ́ a fi ìbáṣepọ̀ ìtàn hàn nípasẹ̀ ìṣètò gbólóhùn.
- source_word: συνέλαβεν
  choice: lóyún
  rationale: Nínú àyíká yìí, συλλαμβάνω túmọ̀ sí pé obìnrin bẹ̀rẹ̀ sí í ní ọmọ nínú. ‘Lóyún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì yé àwọn òǹkàwé lónìí.
- source_word: Ἐλισάβετ
  choice: Elisabeti
  rationale: Àkọsílẹ̀ orúkọ náà ní ìrísí tó bá èdè Yorùbá mu.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: aya rẹ̀
  rationale: γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’; ohun tí ẹsẹ yìí ń sọ àti ọ̀rọ̀ aṣàpèjúwe αὐτοῦ fi hàn pé ‘aya rẹ̀’ ni.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: ó sì fi ara rẹ̀ pamọ́
  rationale: Gbólóhùn yìí pa ìtumọ̀ reflexive mọ́. Imperfect Gíríìkì fi hàn pé ìfarapamọ́ náà ń bá a lọ, èyí tí àkókò ‘fún oṣù márùn-ún’ tún mú kedere.
- source_word: μῆνας πέντε
  choice: fún oṣù márùn-ún
  rationale: Accusative náà ń sọ bí ìṣe náà ṣe pé tó; ‘fún’ jẹ́ ọ̀nà àdánidá láti sọ iye àkókò ní Yorùbá.
- source_word: λέγουσα
  choice: ó ń sọ pé
  rationale: Ìrísí participle yìí ṣí ọ̀rọ̀ Elisabeti tí yóò tẹ̀ lé ní ẹsẹ tó kàn; ‘ó ń sọ pé’ pa ìṣe tó ń lọ àti ìsopọ̀ náà mọ́.
