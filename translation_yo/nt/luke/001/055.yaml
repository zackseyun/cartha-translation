  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó mọ́, tí ó sì ní àmì ohùn tó pé. Àtúnlò “fún” ṣàlàyé ìbáṣepọ̀ àwọn ẹgbẹ́ dátífù náà ní ọ̀nà tí ó rọrùn láti ka. Gbólóhùn náà dára gẹ́gẹ́ bí ìtẹ̀síwájú ọ̀rọ̀ Màríà nínú ẹsẹ̀ tí ó ṣáájú.
