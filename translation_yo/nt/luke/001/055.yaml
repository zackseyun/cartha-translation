id: LUK.1.55
reference: Luke 1:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: yo
  text: gẹ́gẹ́ bí ó ti sọ fún àwọn baba wa[a], fún Ábúráhámù àti fún irú-ọmọ rẹ̀[b] títí láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn baba ńlá wa.’ Ní ti gangan, Gíríìkì sọ pé ‘àwọn baba wa.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘irúgbìn rẹ̀,’ tàbí ‘àwọn àtọmọdọ́mọ rẹ̀.’ Gíríìkì lo ọ̀rọ̀ àpapọ̀ kan ní ẹyọ tó lè túmọ̀ sí ‘irúgbìn,’ ‘irú-ọmọ,’ tàbí ‘àwọn àtọmọdọ́mọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu pẹ̀lú ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun náà ṣẹlẹ̀ ní ìbámu pẹ̀lú ohun tí a ti sọ.
- source_word: ἐλάλησεν
  choice: ó ti sọ
  rationale: Ìṣe àsìkò àtijọ́ náà tọ́ka sí ọ̀rọ̀ tí Ọlọ́run ti sọ tẹ́lẹ̀; ‘ó ti sọ’ jẹ́ mímọ́, ó sì bójú mu ní Yorùbá.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: fún àwọn baba wa
  rationale: Ó pa àwòrán akọ tó wà nínú Gíríìkì mọ́, ó sì lè tọ́ka sí àwọn baba ńlá Ísírẹ́lì nínú ìtàn májẹ̀mú.
- source_word: τῷ Ἀβραὰμ
  choice: fún Ábúráhámù
  rationale: A tún ọ̀rọ̀-atọ́ka ‘fún’ lò láti mú àfikún orúkọ Ábúráhámù ṣe kedere ní Yorùbá.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: fún irú-ọmọ rẹ̀
  rationale: ‘Irú-ọmọ’ jẹ́ ọ̀rọ̀ àpapọ̀ tó lè gba ọmọ kan tàbí àwọn àtọmọdọ́mọ, nítorí náà ó pa àìdánilójú àti ìró májẹ̀mú inú σπέρμα mọ́ dáadáa ju fífi iye hàn lọ.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún ohun tó ń bá a lọ láìní òpin.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πατέρας ἡμῶν nínú àyíká májẹ̀mú
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa
  rationale: ‘Àwọn baba wa’ tẹ̀lé akọ ọ̀pọ̀ inú Gíríìkì, ó sì pa ìró àwọn baba ìgbàgbọ́ àti ìtàn májẹ̀mú mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘àwọn baba ńlá’ hàn.
- issue: Bí a ṣe máa túmọ̀ σπέρματι αὐτοῦ nínú ìlérí fún Ábúráhámù
  choice: irú-ọmọ rẹ̀
  alternative: irúgbìn rẹ̀; àwọn àtọmọdọ́mọ rẹ̀
  rationale: ‘Irú-ọmọ’ jẹ́ àpapọ̀ ní Yorùbá, ó sì yẹra fún pípa ìtumọ̀ náà mọ́ ọmọ kan ṣoṣo tàbí sí ọ̀pọ̀ àtọmọdọ́mọ. Àlàyé ìsàlẹ̀ pa àwòrán ‘irúgbìn’ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àmì ohùn ni a fi sí ibi tí ó bá yẹ. Àtúnlò ‘fún’ mú ìbáṣepọ̀ gírámà pẹ̀lú àwọn baba, Ábúráhámù, àti irú-ọmọ rẹ̀ ṣe kedere láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun kún un.
