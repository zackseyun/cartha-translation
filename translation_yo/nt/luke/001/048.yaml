source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: yo
  text: nítorí ó ti bojú wo ipò ìrẹ̀lẹ̀[a] ẹrúbìnrin rẹ̀.[b] Wò ó, láti ìsinsìnyí lọ gbogbo ìran yóò máa pè mí ní alábùkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipò ìrẹ̀sílẹ̀” tàbí “ipò ìtìjú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò kíkéré tàbí ìrẹ̀sílẹ̀ rẹ̀, kì í ṣe ìwà ìrẹ̀lẹ̀ inú nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìránṣẹ́bìnrin.” Ọ̀rọ̀ Gíríìkì náà jẹ́ abo, ó sì lè túmọ̀ sí “ẹrúbìnrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: ó ti bojú wo
  rationale: Ọ̀rọ̀ yìí fi hàn pé Ọlọ́run darí àfiyèsí rẹ̀ sí Màríà, pẹ̀lú ìtumọ̀ ojúrere nínú àyíká orin náà. ‘Ó ti bojú wo’ jẹ́ èdè Yorùbá àdánidá tó sì jẹ́ kí ìṣe náà ní ipa títí dé àsìkò ọ̀rọ̀ Màríà.
- source_word: ταπείνωσιν
  choice: ipò ìrẹ̀lẹ̀
  rationale: Nínú àyíká yìí, ó tọ́ka sí ipò Màríà tí ó rẹlẹ̀, tí kò ga láwùjọ, kì í ṣe ìwà ìrẹ̀lẹ̀ inú ọkàn nìkan. Àṣàyàn yìí tún fi àyè sílẹ̀ fún ìtumọ̀ ìrẹ̀sílẹ̀ tàbí ìtìjú.
- source_word: δούλης
  choice: ẹrúbìnrin
  rationale: Fọ́ọ̀mù Gíríìkì náà jẹ́ abo, ó sì ń sọ nípa ẹni tí ó jẹ́ ti olúwa rẹ̀. ‘Ẹrúbìnrin’ pa ìtumọ̀ ìdè àti jíjẹ́ ohun-ìní olúwa mọ́, dípò lílo ‘ìránṣẹ́’ tó lè rọ ìtumọ̀ náà.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìpe sí àfiyèsí mọ́ ní èdè Yorùbá ọlọ́lá tí òde òní lóye.
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsìnyí lọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi hàn pé ohun tí a sọ bẹ̀rẹ̀ nísinsìnyí, yóò sì tẹ̀ síwájú.
- source_word: μακαριοῦσίν με
  choice: yóò máa pè mí ní ẹni alábùkún
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé àwọn ènìyàn yóò jẹ́wọ́ tàbí kéde pé Màríà jẹ́ ẹni tí a bù kún. ‘Yóò máa’ mú ìṣe tí àwọn ìran tó ń bọ̀ yóò ṣe léraléra hàn.
- source_word: πᾶσαι αἱ γενεαί
  choice: gbogbo ìran
  rationale: Ó pa ìtumọ̀ gbogbo ìran ènìyàn tó ń tẹ̀ lé ara wọn mọ́ láì fi ‘ọjọ́ iwájú’ kún ohun tí ‘láti ìsinsìnyí lọ’ ti fi hàn tẹ́lẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δούλη, orúkọ tí Màríà fi pe ara rẹ̀
  choice: ẹrúbìnrin rẹ̀
  alternative: ìránṣẹ́bìnrin rẹ̀
  rationale: Àṣàyàn náà pa ọ̀rọ̀ Màríà nípa jíjẹ́ ti Ọlọ́run pátápátá àti ìdè tó wà nínú δούλη mọ́, láì fi ẹ̀kọ́ ìjọ kan pàtó kún un. Àlàyé ìsàlẹ̀ fi ọ̀nà tí ó rọrùn sí i hàn.
- issue: Ìtumọ̀ ταπείνωσις nínú orin Màríà
  choice: ipò ìrẹ̀lẹ̀
  alternative: ìrẹ̀sílẹ̀ tàbí ìtìjú
  rationale: Èyí tọ́ka ní pàtàkì sí ipò rẹ̀ tí ó rẹlẹ̀ láwùjọ, kì í ṣe pé ó ń yin ìwà ìrẹ̀lẹ̀ ara rẹ̀ nìkan. Síbẹ̀, àlàyé ìsàlẹ̀ pa agbára ìtumọ̀ ìrẹ̀sílẹ̀ mọ́.
translation_notes:
  register: A lo èdè Yorùbá ọlọ́lá, àdánidá, tó bá orin ìyìn mu. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Ẹrúbìnrin’ jẹ́ ọ̀rọ̀ tó lágbára, ṣùgbọ́n a mọ̀ọ́mọ̀ lò ó láti pa ìtumọ̀ δούλη mọ́; àlàyé ìsàlẹ̀ pèsè ‘ìránṣẹ́bìnrin’ gẹ́gẹ́ bí ọ̀nà mìíràn.
