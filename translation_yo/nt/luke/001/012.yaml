id: LUK.1.12
reference: Luke 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: yo
  text: Sekaráyà sì dàrú nígbà tí ó rí i[a], ẹ̀rù sì bà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ti rí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní ọ̀nà tó tẹ̀ lé ìrísí rẹ̀ gan-an, ṣùgbọ́n “nígbà tí ó rí i” mú agbára àkókò rẹ̀ hàn kedere nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: dàrú
  rationale: Ọ̀rọ̀ yìí fi hàn pé inú Sekaráyà kò balẹ̀, ó sì dààmú gidigidi; “dàrú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò mú ìtumọ̀ náà le ju bí φόβος ṣe tún sọ̀rọ̀ nípa ẹ̀rù lọ.
- source_word: Ζαχαρίας
  choice: Sekaráyà
  rationale: Èyí ni àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìlànà kíkọ Yorùbá.
- source_word: ἰδών
  choice: nígbà tí ó rí i
  rationale: Aorist participle náà ní agbára àkókò níbí; gbolohun yìí sọ ọ́ ní Yorùbá àdánidá. Arọ́pò-orúkọ ohun “i” tọ́ka sí áńgẹ́lì inú ẹsẹ tó ṣáájú.
- source_word: φόβος
  choice: ẹ̀rù
  rationale: “Ẹ̀rù” jẹ́ ìtumọ̀ Yorùbá tó tààrà, tí kò sì fi agbára tó ju ti ọ̀rọ̀ Gíríìkì náà lọ kún un.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: bà á
  rationale: Bí ó tilẹ̀ jẹ́ pé àwòrán gangan ni “ṣubú lé e lórí,” “ẹ̀rù bà á” ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹ̀rù dé bá ènìyàn lojijì, ó sì pa agbára ọ̀rọ̀ náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ gbolohun tẹ̀ lé ìṣàn ọ̀rọ̀ Gíríìkì, nígbà tí “ẹ̀rù bà á” jẹ́ àṣà ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ mu.
