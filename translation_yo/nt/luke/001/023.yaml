source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí àwọn ọjọ́ iṣẹ́ ìsìn rẹ̀[b] pé, ó lọ sí ilé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ilé tí ó ń gbé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilé tí a kọ́ fúnra rẹ̀ tàbí, ní ìtumọ̀ gbígbòòrò, sí ibi ìgbé tàbí agbo ilé rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Iṣẹ́ ìsìn” ń tọ́ka sí iṣẹ́ tẹ́ńpìlì tí a yàn fún Sekaráyà láti ṣe gẹ́gẹ́ bí àlùfáà.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó pa ìlànà ìtàn Lúùkù mọ́ ní èdè Yorùbá àdánidá, láì lo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó wuwo.
- source_word: ὡς
  choice: nígbà tí
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣe àfihàn àkókò; “nígbà tí” ni ó bá Yorùbá mu jù.
- source_word: ἐπλήσθησαν
  choice: pé
  rationale: Ó túmọ̀ sí pé iye ọjọ́ tí a yàn fún iṣẹ́ náà dé òpin rẹ̀; lílo “pé” jẹ́ kíkún, kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: λειτουργίας
  choice: iṣẹ́ ìsìn
  rationale: Nínú àyíká yìí, ó tọ́ka sí iṣẹ́ tí Sekaráyà ń ṣe gẹ́gẹ́ bí àlùfáà nínú tẹ́ńpìlì. “Iṣẹ́ ìsìn” pa ìtumọ̀ iṣẹ́ mímọ́ náà mọ́ láì fi àlàyé tí ó pọ̀ sí ọ̀rọ̀ inú ẹsẹ náà.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Èyí ni ọ̀nà Yorùbá tí ó rọrùn, tí ó sì bá ìṣe ìlọ kúrò lọ sí ibòmíràn mu.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: sí ilé rẹ̀
  rationale: “Ilé” lè tọ́ka sí ilé tí a kọ́ tàbí sí ibi ìgbé àti agbo ilé ẹni, nítorí náà ó pa ààyè ìtumọ̀ οἶκος mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A fi àmì ẹsẹ̀-alábẹ́ [b] mọ́ “iṣẹ́ ìsìn” àti [a] mọ́ “ilé rẹ̀” kí ìtọ́kasí wọn lè ṣe kedere.
