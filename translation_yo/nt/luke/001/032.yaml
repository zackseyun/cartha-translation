id: LUK.1.32
reference: Luke 1:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: yo
  text: Ó[a] yóò jẹ́ ẹni ńlá, a ó sì pè é ní Ọmọ Ẹni Gíga Jùlọ[b]; Olúwa Ọlọ́run yóò sì fún un ní ìtẹ́ Dáfídì, baba rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni yìí yóò jẹ́ ẹni ńlá.” Ọ̀rọ̀ Gíríìkì bẹ̀rẹ̀ pẹ̀lú arọ́pò-orúkọ atọ́ka, “Ẹni yìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó sì sọ ọ́ ní Ọmọ Ẹni Gíga Jùlọ.”
    reason: lexical_alternative
  - marker: c
    text: “Baba rẹ̀” ń tọ́ka sí Dáfídì gẹ́gẹ́ bí baba ìran Jésù nínú ìlà ọba Dáfídì.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta yìí jẹ́ èdè Yorùbá àdánidá fún ọmọ tí áńgẹ́lì ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀; àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì lo arọ́pò-orúkọ atọ́ka, ‘Ẹni yìí.’
- source_word: ἔσται μέγας
  choice: yóò jẹ́ ẹni ńlá
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú mọ́, ‘ẹni ńlá’ sì gbé ìtumọ̀ μέγας kalẹ̀ láì dín in kù sí agbára tàbí ipò nìkan.
- source_word: υἱὸς Ὑψίστου
  choice: Ọmọ Ẹni Gíga Jù Lọ
  rationale: Ó pa àkọ́lé ìbátan ọmọ àti orúkọ oyè Ọlọ́run mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: κληθήσεται
  choice: a ó sì pè é ní
  rationale: Ìṣe aláìlórúkọ yìí fi hàn pé a ó fi orúkọ oyè náà pè é; ó jẹ́ ìtumọ̀ àdánidá fún passive ọjọ́ iwájú.
- source_word: κύριος ὁ θεὸς
  choice: Olúwa Ọlọ́run
  rationale: ‘Olúwa’ ni ìtumọ̀ κύριος, ‘Ọlọ́run’ sì túmọ̀ θεός; kò fi Tẹtiragírámatọ̀n kún ohun tí Gíríìkì kò sọ.
- source_word: δώσει αὐτῷ
  choice: yóò sì fún un ní
  rationale: Ó túmọ̀ ìṣe fífúnni àti ẹni tí a fún ní ohun náà ní kedere àti ní Yorùbá àdánidá.
- source_word: τὸν θρόνον Δαυὶδ
  choice: ìtẹ́ Dáfídì
  rationale: Ó pa àwòrán ìjọba àti ìlérí ìran Dáfídì mọ́ láì sọ ọ́ di àlàyé.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: baba rẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì pa èdè ìbátan ìran ọba mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé Dáfídì jẹ́ baba ńlá rẹ̀ nínú ìran ọba.
theological_decisions:
- issue: Orúkọ oyè Kristi nínú υἱὸς Ὑψίστου
  choice: Ọmọ Ẹni Gíga Jù Lọ
  alternative: ọmọ kan ti Ẹni Gíga Jù Lọ
  rationale: Gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè pàtó nínú ìkéde áńgẹ́lì; ìtumọ̀ yìí pa agbára ọ̀rọ̀ ìbátan Ọmọ mọ́ láì fi èdè ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: OLÚWA
  rationale: Gíríìkì ní κύριος, kì í ṣe orúkọ Hébérù YHWH ní tààrà; nítorí náà ‘Olúwa’ ni ìtumọ̀ tí kò sọ ohun tí orísun kò sọ.
- issue: Dáfídì gẹ́gẹ́ bí ‘baba rẹ̀’
  choice: baba rẹ̀
  alternative: baba ńlá rẹ̀
  rationale: Èyí pa ọ̀rọ̀ πατήρ àti ìtumọ̀ ìran ọba mọ́. Àlàyé ìsàlẹ̀ ló ṣàlàyé pé kì í ṣe baba tó bí i ní tààrà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà ṣàn lọ́nà àdánidá, ṣùgbọ́n ó tún pa ìtẹ́, orúkọ oyè Ọmọ, àti èdè ìran Dáfídì mọ́.
