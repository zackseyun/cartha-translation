id: LUK.1.22
reference: Luke 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó jáde, kò lè bá wọn sọ̀rọ̀, wọ́n sì mọ̀ pé ó ti rí ìran kan nínú ibi mímọ́[a]. Ó sì ń bá a lọ ní ṣíṣe àmì sí wọn, ó sì wà ní ipò tí kò lè sọ̀rọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ilé mímọ́ tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì wà ní ipò àìgbọ́rọ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹni tí kò lè sọ̀rọ̀, ó sì tún lè túmọ̀ sí ẹni tí kò gbọ́ ní àwọn àyíká kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: nígbà tí ó jáde
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì ń fi ìgbà àti ìtẹ̀lé ìṣẹ̀lẹ̀ hàn; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: kò lè bá wọn sọ̀rọ̀
  rationale: Èyí pa ìtumọ̀ àìlágbára láti sọ̀rọ̀ mọ́, ó sì fi αὐτοῖς hàn ní kedere.
- source_word: ἐπέγνωσαν
  choice: wọ́n sì mọ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n wá lóye ohun tí ó ṣẹlẹ̀ láti inú ẹ̀rí tí wọ́n rí; ‘wọ́n mọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ὀπτασίαν
  choice: ìran kan
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun àrà tàbí ìfihàn tí a rí; ‘ìran’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ ní àyíká yìí.
- source_word: ἐν τῷ ναῷ
  choice: nínú ibi mímọ́
  rationale: ναός níbí tọ́ka pàápàá sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì; ‘ibi mímọ́’ pa ìyàtọ̀ yẹn mọ́.
- source_word: ἦν διανεύων
  choice: ń bá a lọ ní fífi ọwọ́ ṣe àmì
  rationale: Ìṣọ̀kan ἦν pẹ̀lú participle fi ìṣe tó ń tẹ̀ síwájú hàn. ‘Ń bá a lọ’ mú ìfaradà ìṣe náà jáde, ‘fífi ọwọ́ ṣe àmì’ sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: διέμενεν
  choice: ó sì dúró
  rationale: Imperfect náà fi ipò tó ń bá a lọ hàn; ‘dúró’ níbí túmọ̀ sí pé ipò náà kò yí padà.
- source_word: κωφός
  choice: láìlè sọ̀rọ̀
  rationale: κωφός lè túmọ̀ sí ẹni tí kò lè sọ̀rọ̀ tàbí, ní àwọn àyíká kan, ẹni tí kò gbọ́. Àyíká ẹsẹ yìí tẹnumọ́ àìlè sọ̀rọ̀, nítorí náà a yan gbolohun tó dá lórí ìtumọ̀ yẹn, a sì fi àlàyé sí àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κωφός nípa ipò Sekaráyà
  choice: A túmọ̀ ipò náà sí àìlè sọ̀rọ̀, láìsọ ní pàtó pé kò gbọ́.
  alternative: ‘ó sì jẹ́ adití’ tàbí ‘ó sì jẹ́ adití tí kò lè sọ̀rọ̀’
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ pé kò lè sọ̀rọ̀, ó sì ń fi ọwọ́ ṣe àmì. Bó tilẹ̀ jẹ́ pé κωφός lè ní ìtumọ̀ àìgbọ́rọ̀, ẹsẹ yìí kò fi dandan mú wa sọ bẹ́ẹ̀; àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, tó sì ṣeé lóye fún gbogbo ènìyàn. Gbolohun ‘ibi mímọ́’ yà ναός sọ́tọ̀ kúrò nínú gbogbo tẹ́ńpìlì, ‘ń bá a lọ’ sì pa ìṣe tó ń tẹ̀ síwájú mọ́. A fi àmì ohùn kún ọ̀rọ̀ níbi tí ó ti yẹ.
