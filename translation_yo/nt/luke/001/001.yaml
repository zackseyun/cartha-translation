source:
  edition: SBLGNT
  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: yo
  text: Níwọ̀n bí ọ̀pọ̀ ènìyàn ti gbìyànjú láti ṣètò ìtàn kan nípa àwọn ohun tí a ti mú ṣẹ láàárín wa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tí a ti ṣe ní kíkún,” tàbí, “àwọn ohun tí a ti fìdí wọn múlẹ̀ dáadáa láàárín wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Níwọ̀n bí
  rationale: Ó fi ìdí tàbí àyíká ọ̀rọ̀ ìṣáájú Lúùkù hàn lọ́nà àdánidá, ó sì bá ìforúkọsílẹ̀ gíga mu.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó sọ iye ènìyàn di mímọ̀ láìfi ‘àwọn mìíràn’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐπεχείρησαν
  choice: ti gbìyànjú
  rationale: Ó túmọ̀ sí pé wọ́n bẹ̀rẹ̀ sí í ṣe iṣẹ́ náà; ní Yorùbá, kò pọndandan kí ọ̀rọ̀ yìí túmọ̀ sí pé iṣẹ́ náà kùnà.
- source_word: ἀνατάξασθαι
  choice: láti ṣètò
  rationale: Ó mú èrò ṣíṣe àti ṣíṣe àtòjọ ìtàn kan ní ìlànà jáde ní Yorùbá tó rọrùn.
- source_word: διήγησιν
  choice: àkọsílẹ̀
  rationale: Ó yẹ fún ìtàn tàbí àlàyé tí a kọ sílẹ̀, ó sì pa ìwòye ìtàn-alákọsílẹ̀ mọ́.
- source_word: περὶ
  choice: nípa
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí àkọsílẹ̀ náà dá lé.
- source_word: τῶν πεπληροφορημένων
  choice: tí a ti mú ṣẹ
  rationale: Ó ṣàfihàn ìtumọ̀ pé àwọn ohun náà ti dé ìmúṣẹ tàbí pé a ti ṣe wọ́n ní kíkún, láìpa àṣàyàn ìtumọ̀ mìíràn rẹ́.
- source_word: ἐν ἡμῖν
  choice: láàárín wa
  rationale: Ó pa ìtọ́kasí ẹgbẹ́ náà mọ́ láìsọ pé ‘wa’ túmọ̀ sí àwọn onígbàgbọ́ nìkan.
- source_word: πραγμάτων
  choice: àwọn ohun
  rationale: Ó jẹ́ gbòòrò bí ọ̀rọ̀ Gíríìkì, ó sì lè yí àwọn ìṣẹ̀lẹ̀, iṣẹ́, tàbí ọ̀ràn tí ìtàn náà sọ ká.
theological_decisions:
- issue: Ìtumọ̀ πεπληροφορημένων nínú ọ̀rọ̀ ìṣáájú Lúùkù
  choice: tí a ti mú ṣẹ
  alternative: tí a ti parí ní kíkún; tí a sì ti fi ìdí wọn múlẹ̀ dáadáa
  rationale: Pẹ̀lú πραγμάτων, ìtumọ̀ ìmúṣẹ tàbí àṣeparí bá àyíká àwọn ìṣẹ̀lẹ̀ ìgbàlà mu jù; síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ ìmúdájú ní kíkún mọ́ gẹ́gẹ́ bí àṣàyàn gidi.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó bá ọ̀rọ̀ ìṣáájú lítíréṣọ̀ Lúùkù mu, síbẹ̀ ó ṣeé yé fún òǹkàwé òde òní.
