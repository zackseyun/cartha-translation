  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀rọ̀ náà dà á láàmú gidigidi,[a] ó sì ń ronú léraléra pé, “Irú ìkíni wo ni èyí lè jẹ́?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ọ̀rọ̀ náà” tàbí “nítorí ohun tí a sọ.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí “ọ̀rọ̀,” “gbólóhùn,” tàbí “ìhìn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ń gbé e yẹ̀ wò” tàbí “ó sì ń ṣe kàyéfì.” Bí ọ̀rọ̀-ìṣe Gíríìkì ṣe rí fi hàn pé ìrònú náà ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn láti inú ìkíni áńgẹ́lì sí ìhùwàpadà Màríà.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ọ̀rọ̀ náà
  rationale: Ó tọ́ka sí ohun tí áńgẹ́lì ṣẹ̀ṣẹ̀ sọ; ‘ọ̀rọ̀’ lè túmọ̀ sí ọ̀rọ̀, gbólóhùn, tàbí iṣẹ́ tí a rán.
- source_word: διεταράχθη
  choice: dà á láàmú gidigidi
  rationale: Ó mú agbára ọ̀rọ̀-ìṣe tí ó túmọ̀ sí ìdàrúdàpọ̀ tàbí ìdààmú púpọ̀ jáde ní Yorùbá àdánidá.
- source_word: διελογίζετο
  choice: ó ń ronú léraléra
  rationale: Àkókò imperfect ń fi ìrònú inú tí ń bá a lọ hàn, kì í ṣe ìrònú ẹ̀ẹ̀kan ṣoṣo.
- source_word: ποταπὸς
  choice: irú ... tí
  rationale: Ó béèrè nípa irú tàbí ìwà ìkíni náà.
- source_word: εἴη
  choice: lè jẹ́
  rationale: Ó pa ìṣiyèméjì onírẹ̀lẹ̀ ti optative mọ́ nínú ọ̀rọ̀ tí a rò nínú.
- source_word: ἀσπασμὸς
  choice: ìkíni
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní, tó ṣe kedere fún ìkíni tí áńgẹ́lì ṣe.
- source_word: οὗτος
  choice: èyí
  rationale: Ó tọ́ka tààrà sí ìkíni tí a ṣẹ̀ṣẹ̀ sọ.
theological_decisions:
- issue: Irú ìhùwàpadà Màríà
  choice: Ọ̀rọ̀ tàbí ìkíni áńgẹ́lì ló dà á láàmú, ó sì ń ronú nípa ìtumọ̀ rẹ̀.
  alternative: Ìfarahàn áńgẹ́lì ló dẹ́rù bà á, tàbí ìhùwàpadà rẹ̀ fi àìgbàgbọ́ hàn.
  rationale: Gíríìkì so ìdààmú náà mọ́ ọ̀rọ̀ tí a sọ, ó sì ṣàpèjúwe ìrònú tó ń bá a lọ láìdá Màríà lẹ́jọ́ nípa ẹ̀ṣẹ̀, ìbẹ̀rù, tàbí àìgbàgbọ́.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìṣiyèméjì àti ìrònú tó ń bá a lọ mọ́.
