  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: yo
  text: Àwọn ènìyàn sì ń dúró de Sakaria, ó sì ń yà wọ́n lẹ́nu pé ó pẹ́ nínú ibi mímọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni ibi mímọ́ inú tẹ́ńpìlì gan-an, kì í ṣe gbogbo àgbàlá àti agbègbè tẹ́ńpìlì.
    reason: lexical_clarification
lexical_decisions:
- source_word: λαὸς
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo àwọn ènìyàn tí ó péjọ síta; ‘àwọn ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkójọpọ̀ yìí.
- source_word: προσδοκῶν
  choice: ń dúró de
  rationale: Ìṣọ̀kan ἦν pẹ̀lú participle náà fi ìṣe tí ó ń bá a lọ hàn; ‘ń dúró de’ pa ìtumọ̀ ìdúró-retí mọ́ ní Yorùbá àdánidá.
- source_word: Ζαχαρίαν
  choice: Sekaráyà
  rationale: A lo ìkọ̀wé orúkọ tí ó bá ìró Yorùbá mu, tí ó sì jẹ́ àfihàn orúkọ Bíbélì yìí ní ọ̀nà tí ó ṣeé kà.
- source_word: ἐθαύμαζον
  choice: ó ń yà wọ́n lẹ́nu
  rationale: Imperfect náà fi ìhùwàpadà tí ó ń bá a lọ hàn; gbólóhùn yìí túmọ̀ ìyàlẹ́nu wọn láì sọ ohun tí orísun kò sọ sí i.
- source_word: ἐν τῷ χρονίζειν
  choice: pé ó pẹ́
  rationale: Articular infinitive náà lè fi àkókò tàbí ohun tí ó fa ìyàlẹ́nu hàn; ‘pé ó pẹ́’ jẹ́ Yorùbá tí ó rọrùn, ó sì fi hàn pé ó lo àkókò ju bí wọ́n ti retí lọ.
- source_word: ναῷ
  choice: ibi mímọ́
  rationale: ναός níhìn-ín tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbàlá àti agbègbè tẹ́ńpìlì; nítorí náà ‘ibi mímọ́’ péye ju ‘tẹ́ńpìlì’ lọ.
- source_word: αὐτόν
  choice: ó
  rationale: 'Pronoun accusative náà ni olùṣe infinitive χρονίζειν; nínú Yorùbá, a sọ ọ́ gẹ́gẹ́ bí olùṣe gbólóhùn abẹ́: ‘pé ó pẹ́.’'
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtẹ̀sí imperfect méjèèjì ni a fi ‘ń’ hàn. A yan ‘ibi mímọ́’ láti pa ìyàtọ̀ ναός sí ἱερόν mọ́; àlàyé ìsàlẹ̀ mú ìtọ́kasí náà ṣe kedere.
