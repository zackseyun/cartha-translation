id: LUK.1.11
reference: Luke 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: yo
  text: Nígbà náà, áńgẹ́lì Olúwa kan farahàn án, ó dúró ní ìhà ọ̀tún pẹpẹ tùràrí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: farahàn án
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive ti ὁράω, ṣùgbọ́n nínú ìtàn ó sábà túmọ̀ sí pé ẹnì kan farahàn. “Farahàn án” jẹ́ Yorùbá àdánidá, ó sì fi ẹni tí ìfarahàn náà dé ọ̀dọ̀ rẹ̀ hàn.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń mú ìtàn tẹ̀ síwájú ju pé ó ń fi ìtakora hàn; “Nígbà náà” sọ ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà ní kedere.
- source_word: αὐτῷ
  choice: án
  rationale: Arọ́pò-orúkọ olùgbà pẹ̀lú “farahàn” ni a sọ ní Yorùbá gẹ́gẹ́ bí “farahàn án,” èyí tó jẹ́ kí Sekaráyà jẹ́ ẹni tí ó rí ìfarahàn náà.
- source_word: ἄγγελος
  choice: áńgẹ́lì
  rationale: Nínú àyíká ìran inú tẹ́ńpìlì yìí, ọ̀rọ̀ náà tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe ońṣẹ́ ènìyàn lásán.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Áńgẹ́lì Olúwa” jẹ́ ìtumọ̀ àdánidá fún ἄγγελος κυρίου, ó sì pa oyè κύριος mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἑστὼς
  choice: ó dúró
  rationale: Perfect participle náà ṣàpèjúwe ipò áńgẹ́lì nígbà tó farahàn. Gbólóhùn aláìlẹ́gbẹ́ “ó dúró” dùn mọ́ etí ní Yorùbá ju lílo participle líle lọ.
- source_word: ἐκ δεξιῶν
  choice: ní apá ọ̀tún
  rationale: Èyí pa ìtumọ̀ ibi sí ẹ̀gbẹ́ ọ̀tún mọ́, ó sì jẹ́ ọ̀nà tí Yorùbá òde òní fi máa ń sọ ọ́.
- source_word: θυσιαστηρίου
  choice: pẹpẹ
  rationale: “Pẹpẹ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi ìrúbọ tàbí altar; àfikún tó tẹ̀ lé e sọ irú pẹpẹ tí a ń sọ.
- source_word: τοῦ θυμιάματος
  choice: tùràrí
  rationale: Genitive náà ń dá pẹpẹ náà mọ̀ gẹ́gẹ́ bí pẹpẹ tí a ti ń sun tùràrí. “Pẹpẹ tùràrí” jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá tó ṣókí, tó sì ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ἄγγελος κυρίου
  choice: Olúwa
  alternative: olúwa
  rationale: Lílo lẹ́tà ńlá nínú “Olúwa” pa oyè Ọlọ́run mọ́ gẹ́gẹ́ bí àyíká tẹ́ńpìlì ṣe ń tọ́ka sí i, láìṣe àfikún ẹ̀kọ́ ìsìn sí ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “tùràrí” fún incense àti “pẹpẹ tùràrí” fún incense altar.
