  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: yo
  text: ìbúra tí ó bú fún Ábúráhámù baba wa[a], láti fún wa
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “baba wa ní ìran.” Ní Gíríìkì, ó sọ ní tààrà pé “baba wa,” èyí tí ó pa èdè májẹ̀mú nípa Ábúráhámù mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: ìbúra
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìbúra pàtó tí Ọlọ́run bú; ó sì ń bá gírámà ẹsẹ tó ṣáájú lọ gẹ́gẹ́ bí ohun tí a ń rántí.
- source_word: ὃν ὤμοσεν
  choice: tí ó bú
  rationale: Èyí túmọ̀ ìṣe búra ní tààrà, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ láàárín ‘ìbúra’ àti ‘bú’.
- source_word: πρὸς Ἀβραὰμ
  choice: fún Ábúráhámù
  rationale: Pẹ̀lú ọ̀rọ̀ ìbúra, πρός ń tọ́ka sí ẹni tí a búra fún; ‘fún Ábúráhámù’ jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸν πατέρα ἡμῶν
  choice: baba wa
  rationale: Ó pa àwòrán ìdílé àti májẹ̀mú tí Gíríìkì ní mọ́, dípò yíyí i padà sí ‘baba ńlá wa’ nínú ẹsẹ náà.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: láti fún wa
  rationale: Gbólóhùn aláìpẹ́ yìí lè sọ ète tàbí àbájáde ìbúra; ‘láti fún wa’ pa ìṣòro ìtumọ̀ yẹn mọ́, ó sì ṣí sí ohun tí ẹsẹ tó tẹ̀ lé yóò parí.
theological_decisions:
- issue: Èdè májẹ̀mú nípa Ábúráhámù
  choice: baba wa
  alternative: baba ńlá wa
  rationale: ‘Baba wa’ tẹ̀ lé τὸν πατέρα ἡμῶν ní pẹkipẹki, ó sì pa ìtumọ̀ ìbátan májẹ̀mú mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
- issue: Ìbáṣepọ̀ τοῦ δοῦναι pẹ̀lú ìbúra
  choice: láti fún wa
  alternative: nípa fífún wa
  rationale: Akọ́ṣe Gíríìkì lè fi ète tàbí àbájáde hàn; yíyan ‘láti fún wa’ jẹ́ èdè àdánidá tí kò fi tipátipá yan ọ̀kan ṣoṣo nínú méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó sì bá orin àsọtẹ́lẹ̀ Sekaráyà mu. A mọ̀ọ́mọ̀ fi ‘láti fún wa’ sílẹ̀ gẹ́gẹ́ bí gbólóhùn tí ẹsẹ tó tẹ̀ lé yóò parí, bí ó ti rí nínú orísun Gíríìkì.
