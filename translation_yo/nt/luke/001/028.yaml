id: LUK.1.28
reference: Luke 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: yo
  text: Ó sì wọlé sọ́dọ̀ rẹ̀, ó ní, “Mo kí ọ́[a], ìwọ ẹni tí a ti ṣe ojúrere sí[b]; Olúwa wà pẹ̀lú rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan, “Yọ̀.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà ìkíni, bí ó tilẹ̀ jẹ́ pé ní ìmọ̀ gírámà, ó jẹ́ àṣẹ láti yọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìwọ ẹni tí a ṣe ojúrere púpọ̀ sí,” “ìwọ ẹni tí a ti fi oore-ọ̀fẹ́ hàn sí,” tàbí, nínú ìtumọ̀ ìbílẹ̀, “ìwọ ẹni tí ó kún fún oore-ọ̀fẹ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí a ti fi oore-ọ̀fẹ́ tàbí ojúrere hàn sí.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: wọlé tọ̀ ọ́ lọ
  rationale: Aorist participle εἰσελθών and πρὸς αὐτήν describe his entering and approaching her. This rendering naturally preserves both the movement inward and its direction toward Mary.
- source_word: Χαῖρε
  choice: Mo kí ọ́
  rationale: Although formally an imperative meaning “rejoice,” Χαῖρε functions here as an ordinary salutation. “Mo kí ọ́” communicates that idiomatic force in clear modern Yorùbá without using an archaic formula.
- source_word: κεχαριτωμένη
  choice: ìwọ ẹni tí a ti fi ojúrere hàn sí
  rationale: The perfect passive participle identifies Mary as one who has received favor. The passive wording preserves bestowed favor without portraying grace as an intrinsic possession.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” is the standard reverent Yorùbá title for κύριος and here refers to God.
- source_word: μετὰ σοῦ
  choice: wà pẹ̀lú rẹ
  rationale: The supplied copula “wà” makes the Greek verbless expression natural in Yorùbá while retaining the affirmation of the Lord’s presence with Mary.
theological_decisions:
- issue: Rendering κεχαριτωμένη in a theologically sensitive Marian passage
  choice: ìwọ ẹni tí a ti fi ojúrere hàn sí
  alternative: ìwọ ẹni tí ó kún fún oore-ọ̀fẹ́
  rationale: 'The chosen wording follows the passive force of χαριτόω: Mary has been shown favor. It strongly affirms divine favor without importing the later traditional formulation “full of grace,” which could suggest an intrinsic store of grace.'
translation_notes:
  register: Standard Yorùbá with full tone marks, natural contemporary syntax, and a dignified biblical register. The greeting is idiomatic rather than archaic, while the footnotes preserve the formal sense and historically influential alternatives.
