revisions:
- from: Ó sì wọlé tọ̀ ọ́ lọ, ó ní, “Mo kí ọ́[a], ìwọ ẹni tí a ti fi ojúrere hàn sí[b]; Olúwa wà pẹ̀lú rẹ.”
  to: Ó sì wọlé sọ́dọ̀ rẹ̀, ó ní, “Mo kí ọ́[a], ìwọ ẹni tí a ti ṣe ojúrere sí[b]; Olúwa wà pẹ̀lú rẹ̀.”
  rationale: The revision improves idiomatic Yoruba syntax and restores required tone marks while retaining every semantic component of the Greek. It also removes a culturally misleading proposed equivalent from the greeting footnote. The wording for κεχαριτωμένη continues to express bestowed favor, while the footnote transparently preserves major lexical and traditional alternatives.
