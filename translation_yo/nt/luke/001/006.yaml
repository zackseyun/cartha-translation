id: LUK.1.6
reference: Luke 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: yo
  text: Àwọn méjèèjì sì jẹ́ olódodo níwájú Ọlọ́run,[a] wọ́n ń rìn láìlẹ́bi nínú gbogbo àwọn àṣẹ àti ìlànà Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: olódodo
  rationale: “Olódodo” dá ìtumọ̀ ìwà rere àti ìdúróṣinṣin níwájú Ọlọ́run dúró, láìdín un kù sí òdodo ti ilé-ẹjọ́ nìkan.
- source_word: ἀμφότεροι
  choice: àwọn méjèèjì
  rationale: Ó tẹnumọ́ pé àpèjúwe náà kan Sekaráyà àti Elisabẹti papọ̀.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó lè túmọ̀ sí wíwà ní ojú Ọlọ́run tàbí gẹ́gẹ́ bí Ọlọ́run ti ń wo wọn; ọ̀rọ̀ yìí pa ìtumọ̀ ìbáṣepọ̀ àti ìdájọ́ náà mọ́.
- source_word: πορευόμενοι
  choice: wọ́n ń rìn
  rationale: Ó pa àkàwé Bíbélì ti rírìn gẹ́gẹ́ bí ọ̀nà ìgbésí ayé mọ́, ó sì yé àwọn òǹkàwé Yorùbá.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: nínú gbogbo àwọn àṣẹ
  rationale: “Nínú” tẹ̀lé àwòrán rírìn láàárín gbogbo ohun tí Ọlọ́run pàṣẹ, “gbogbo” sì pa ìtẹnumọ́ πάσαις mọ́.
- source_word: δικαιώμασιν
  choice: ìlànà
  rationale: “Ìlànà” tọ́ka sí àwọn ohun tí a ti là kalẹ̀ fún ìgbọràn, ó sì yà díẹ̀ sí “àṣẹ” láìlo èdè òfin tí ó le jù.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó ní iyì, fún κύριος nígbà tí ó ń tọ́ka sí Ọlọ́run Ísírẹ́lì.
- source_word: ἄμεμπτοι
  choice: láìlẹ́bi
  rationale: Ó fi ìwà tí kò yẹ fún ẹ̀gàn hàn. A so ó mọ́ “wọ́n ń rìn” ní ti àdáṣe, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àǹfààní ìtumọ̀ ajẹtífù náà mọ́.
- source_word: ἦσαν δὲ
  choice: sì jẹ́
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn tó rọrùn fún δέ, “jẹ́” sì bá àpèjúwe ipò wọn mu.
theological_decisions:
- issue: Bóyá ἄμεμπτοι túmọ̀ sí pé wọn kò ní ẹ̀ṣẹ̀ rárá
  choice: A túmọ̀ ọ́ sí ìgbésí ayé tí kò lẹ́gàn nínú ìgbọràn sí Olúwa.
  alternative: Kí a ka á sí àìní ẹ̀ṣẹ̀ pátápátá.
  rationale: Ẹsẹ̀ náà ń sọ bí wọ́n ṣe ń rìn nínú àwọn àṣẹ àti ìlànà Olúwa; kò sọ ní tààrà pé wọn pé láìní ẹ̀ṣẹ̀. Ìtumọ̀ náà pa ọ̀rọ̀ líle “láìlẹ́bi” mọ́ láìfi ẹ̀kọ́ tí ọ̀rọ̀ náà kò sọ kún un.
- issue: Ìbáṣepọ̀ ἄμεμπτοι pẹ̀lú gbolóhùn náà
  choice: Nínú ọ̀rọ̀ àkọ́kọ́, a so “láìlẹ́bi” mọ́ bí wọ́n ṣe ń rìn; àlàyé [b] fi ìṣeéṣe pé ó ń ṣàpèjúwe àwọn méjèèjì hàn.
  alternative: Kí a yan ọ̀kan nínú ìtúpalẹ̀ méjèèjì láìfi èkejì hàn.
  rationale: Gírámà Gíríìkì gbà kí ἄμεμπτοι jẹ́ ajẹtífù fún àwọn méjèèjì, ṣùgbọ́n ó tún sún mọ́ gbolóhùn aláìpé πορευόμενοι; àlàyé pa àìdájú gidi yìí mọ́.
translation_notes:
  register: Èdè Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó ṣe kedere ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Rìn” pa àkàwé Bíbélì mọ́, “àṣẹ àti ìlànà” sì fi ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì hàn láìjẹ́ kí gbólóhùn náà di èdè òfin tí ó le.
