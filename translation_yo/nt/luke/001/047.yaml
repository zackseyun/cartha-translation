  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: yo
  text: ẹ̀mí mi sì ti yọ̀ gidigidi nínú Ọlọ́run Olùgbàlà mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí mi sì ti kún fún ayọ̀ nínú Ọlọ́run Olùgbàlà mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so gbólóhùn yìí mọ́ ti ẹsẹ tó ṣáájú nínú ìbáradọ́gba ewì; “sì” jẹ́ àsopọ̀ Yorùbá tó ṣe déédé.
- source_word: ἠγαλλίασεν
  choice: ti yọ̀ gidigidi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ayọ̀ tó kún rékọjá. Fífi “ti” kún un mú kí ìṣe aorist náà hàn gẹ́gẹ́ bí ohun tó ti ṣẹlẹ̀, nígbà tí “yọ̀ gidigidi” jẹ́ èdè Yorùbá àdánidá tó fi agbára ayọ̀ náà hàn.
- source_word: τὸ πνεῦμά μου
  choice: ẹ̀mí mi
  rationale: Èyí pa ọ̀rọ̀ orísun mọ́, ó sì dá ìyàtọ̀ rẹ̀ sí “ọkàn mi” ní ẹsẹ tó ṣáájú sí, láìfi ìtumọ̀ ẹ̀kọ́ nípa ìṣẹ̀dá ènìyàn kún un.
- source_word: ἐπὶ τῷ θεῷ
  choice: nínú Ọlọ́run
  rationale: Pẹ̀lú ἀγαλλιάω, gbólóhùn yìí lè fi ìpìlẹ̀ tàbí ohun tí ayọ̀ náà dá lé hàn. “Yọ̀ nínú Ọlọ́run” jẹ́ ọ̀nà Yorùbá tó bójú mu, tó sì pa ìdojúkọ ìbáṣepọ̀ náà mọ́.
- source_word: σωτῆρί μου
  choice: Olùgbàlà mi
  rationale: “Olùgbàlà” ni ìtumọ̀ tààrà àti èyí tí a mọ̀ dáadáa fún σωτήρ nínú Májẹ̀mú Tuntun; ó pa ìjẹ́wọ́ pé Ọlọ́run ni olùgbàlà Màríà mọ́.
theological_decisions:
- issue: Ìdánimọ̀ Ọlọ́run gẹ́gẹ́ bí Olùgbàlà Màríà
  choice: Ọlọ́run Olùgbàlà mi
  alternative: Ọlọ́run olùdáǹdè mi
  rationale: Èdè Gíríìkì dá Ọlọ́run mọ̀ tààrà gẹ́gẹ́ bí Olùgbàlà Màríà. Ìtumọ̀ náà pa ìjẹ́wọ́ yìí mọ́ láìrẹ̀ ẹ́ sílẹ̀ tàbí fi ìpinnu ẹ̀kọ́ mìíràn kún un.
- issue: Ìbáṣepọ̀ “ẹ̀mí mi” pẹ̀lú “ọkàn mi” nínú ìbáradọ́gba ewì
  choice: Pa àwọn ọ̀rọ̀ méjèèjì mọ́ gẹ́gẹ́ bí ọ̀tọ̀ọ̀tọ̀
  alternative: Túmọ̀ àwọn méjèèjì sí ọ̀rọ̀ kan náà
  rationale: Ìbáradọ́gba ewì fi hàn pé ìtumọ̀ wọn sún mọ́ra, ṣùgbọ́n orísun lo ọ̀rọ̀ méjì tó yàtọ̀. “Ẹ̀mí mi” pa ìyàtọ̀ yẹn àti àìdánilójú ẹ̀kọ́ tó wà nínú rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye ni a lò. Àmì ohùn ni a fi sí ibi tó yẹ. “Yọ̀ gidigidi” mú agbára ἠγαλλίασεν jáde ní ọ̀nà àdánidá, nígbà tí àlàyé ìsàlẹ̀ fúnni ní àṣàyàn “kún fún ayọ̀.”
