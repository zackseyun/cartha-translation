  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: yo
  text: Òun yóò sì lọ ṣáájú rẹ̀ nínú ẹ̀mí àti agbára Èlíjà[c], láti yí ọkàn àwọn baba padà sí ọ̀dọ̀ àwọn ọmọ[a], àti láti yí àwọn aláìgbọ́ràn padà sí òye àwọn olódodo[b], láti pèsè ènìyàn kan tí a ti múra sílẹ̀ fún Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “sí àwọn ọmọ.” Gbólóhùn yìí ń ṣàtúnrọ́ sí Málákì 4:6, ó sì lè ní ìtumọ̀ ìpadàbọ̀sípò àlàáfíà láàárín àwọn mọ̀lẹ́bí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “sí ìrònú àwọn olódodo” tàbí “nínú ìṣọ́ra àwọn olódodo.”
    reason: lexical_alternative
  - marker: c
    text: “Nínú ẹ̀mí àti agbára Èlíjà” ń tọ́ka sí iṣẹ́ wòlíì àti agbára tó dà bí ti Èlíjà; kò sì fi hàn dandan pé Èlíjà fúnra rẹ̀ padà wá.
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: yóò lọ ṣáájú rẹ̀
  rationale: Ó sọ pé ẹni náà yóò ṣáájú ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí. Èdè yìí bá iṣẹ́ aṣáájú-ọ̀nà wòlíì mu, kò sì fi orúkọ ẹni tí Gíríìkì kò darúkọ kún un.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: nínú ẹ̀mí àti agbára Èlíjà
  rationale: Ó pa ìfarajọ iṣẹ́ wòlíì àti agbára tó ní í ṣe pẹ̀lú Èlíjà mọ́, láì sọ pé ẹni náà ni Èlíjà fúnra rẹ̀.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: láti yí ọkàn àwọn baba padà sí ọ̀dọ̀ àwọn ọmọ
  rationale: “Yí ... padà” mú ète infinitive náà àti ìtumọ̀ ìpadàbọ̀sípò jáde; “sí ọ̀dọ̀” jẹ́ Yorùbá àdánidá fún ìtọ́sọ́nà ọkàn sí àwọn ọmọ, ó sì pa àṣàyàn ìtumọ̀ ἐπί mọ́.
- source_word: ἀπειθεῖς
  choice: àwọn aláìgbọ́ràn
  rationale: Ó gba ìtumọ̀ àìfẹ́ láti gbàgbọ́ tàbí láti tẹ̀lé, ó sì bá ìyàtọ̀ ìwà tó wà pẹ̀lú “àwọn olódodo” mu.
- source_word: ἐν φρονήσει δικαίων
  choice: sí ìrònú ọlọ́gbọ́n àwọn olódodo
  rationale: φρόνησις tọ́ka sí òye tàbí ìrònú tó ní ìṣọ́ra nínú ìṣe. Àtúnṣe “yí ... padà sí” mú ipa ìtọ́sọ́nà gbólóhùn náà hàn ní Yorùbá.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: láti pèsè àwọn ènìyàn tí a ti múra sílẹ̀ fún Olúwa
  rationale: “Tí a ti múra sílẹ̀” pa ipò ìmúrasílẹ̀ tó jẹ́ àbájáde iṣẹ́ àtijọ́ mọ́; “fún Olúwa” ṣe àfihàn dative κυρίῳ lọ́nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ ẹni tó ń wá nínú ẹ̀mí àti agbára Èlíjà
  choice: A ṣàpèjúwe iṣẹ́ rẹ̀ gẹ́gẹ́ bí iṣẹ́ wòlíì tó dà bí ti Èlíjà, tó sì ní agbára irú tirẹ̀.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé Èlíjà fúnra rẹ̀ ló padà wá.
  rationale: Ọ̀rọ̀ Gíríìkì sọ “nínú ẹ̀mí àti agbára Èlíjà,” kì í ṣe pé ẹni náà ni Èlíjà. Èyí pa ìtọ́kasí sí Málákì mọ́ láìfi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- issue: Ẹni tí “rẹ̀” àti “Olúwa” ń tọ́ka sí
  choice: A pa ọ̀rọ̀ arọ́pò-orúkọ “rẹ̀” àti oyè “Olúwa” mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ní wọn.
  alternative: Kí a fi “Mèsáyà” tàbí “Jésù” sínú ẹsẹ̀ náà láti tú ìtọ́kasí náà yanjú.
  rationale: Àyíká ló ń ṣàlàyé ẹni tí a ń tọ́ka sí; ẹsẹ̀ fúnra rẹ̀ kò darúkọ rẹ̀. Ìtumọ̀ náà kò yẹ kí ó yanjú ohun tí ọ̀rọ̀ orísun fi sílẹ̀ fún àyíká.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. “Òun yóò sì” tẹnu mọ́ αὐτός díẹ̀, “lọ ṣáájú rẹ̀” sì jẹ́ àdánidá ju ìtumọ̀ líle “níwájú rẹ̀” lọ nínú àyíká iṣẹ́ aṣáájú-ọ̀nà.
