  source_fidelity: 'Ìtumọ̀ náà ń pa ìlànà gbolohun Gíríìkì mọ́ ní pàtàkì: ẹni náà yóò ṣáájú rẹ̀, ní ẹ̀mí àti agbára Èlíjà, láti mú ìyípadà ọkàn àti ìwà ṣẹ, àti láti múra àwọn ènìyàn sílẹ̀ fún Olúwa. Síbẹ̀, “ìrònú ọlọ́gbọ́n àwọn olódodo” kì í ṣe ọ̀nà tó ṣe kedere jù lọ láti fi φρονήσει δικαίων hàn; “òye àwọn olódodo” dáa síi. Pẹ̀lú náà, λαόν jẹ́ “ènìyàn kan/àwọn ènìyàn gẹ́gẹ́ bí ẹgbẹ́,” kì í ṣe ìpọ̀lọpọ̀ ẹni lásán.'
  naturalness: 'Yorùbá náà ní ìforúkọsílẹ̀ tó yẹ, àmì ohùn sì péye ní gbogbogbò. Àtúnṣe kékeré ń mú gbolohun náà rọrùn síi: lílo “ènìyàn kan” ń fi ipa akojọpọ̀ λαόν hàn, “òye” sì jẹ́ ìsọ̀rọ̀ Yorùbá adayeba fún ìmọ̀/ìṣọ́ra tó wà nínú φρόνησις.'
  terminology: “Ẹ̀mí àti agbára Èlíjà,” “àwọn aláìgbọ́ràn,” “àwọn olódodo,” àti “Olúwa” yẹ, wọ́n sì bá ọ̀rọ̀ orísun mu. A ti tún ọ̀rọ̀ àlàyé ẹsẹ̀-ìsàlẹ̀ c ṣe kí ó má bàa dà bí ìpinnu ẹ̀kọ́ tí ó pọ̀ ju; ó kan ṣàlàyé pé gbolohun náà kò dá ìdánimọ̀ Èlíjà fúnra rẹ̀ lórí ẹni náà.
