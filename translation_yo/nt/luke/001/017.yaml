  to: Òun yóò sì lọ ṣáájú rẹ̀ nínú ẹ̀mí àti agbára Èlíjà[c], láti yí ọkàn àwọn baba padà sí ọ̀dọ̀ àwọn ọmọ[a], àti láti yí àwọn aláìgbọ́ràn padà sí òye àwọn olódodo[b], láti pèsè ènìyàn kan tí a ti múra sílẹ̀ fún Olúwa.
