id: LUK.1.15
reference: Luke 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: yo
  text: Nítorí yóò jẹ́ ẹni ńlá níwájú Olúwa; kò ní mu wáìnì tàbí ọtí líle rárá,[a][b] a ó sì fi Ẹ̀mí Mímọ́ kún un láti ìgbà tí ó ti wà nínú oyún ìyá rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò gbọ́dọ̀ mu wáìnì tàbí ọtí líle láéláé.” Ọ̀rọ̀ Gíríìkì kọ ìṣe náà ní ìtẹnumọ́; àyíká náà tún lè jẹ́ kí a lóye rẹ̀ gẹ́gẹ́ bí ohun tí ìyàsímímọ́ rẹ̀ béèrè.
    reason: lexical_alternative
  - marker: b
    text: “Ọtí líle” níbí túmọ̀ sí ohun mímu tó ń múni yó mìíràn tí kì í ṣe wáìnì.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nígbà tí ó ṣì wà nínú oyún ìyá rẹ̀,” tàbí “láti inú oyún ìyá rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: ẹni ńlá
  rationale: Ó pa ìtumọ̀ títóbi ní ipò àti pàtàkì mọ́ láì fi irú ọlá náà hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: níwájú Olúwa
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìmọ̀ pé ó jẹ́ ńlá lójú tàbí níwájú Olúwa mọ́.
- source_word: οἶνον καὶ σίκερα
  choice: wáìnì tàbí ọtí líle
  rationale: “Wáìnì” jẹ́ orúkọ ohun mímu àjàrà, “ọti líle” sì ṣàpèjúwe ohun mímu amúnisọ̀rọ̀ mìíràn tí kì í ṣe wáìnì, láì dín σίκερα kù sí irú kan ṣoṣo.
- source_word: οὐ μὴ πίῃ
  choice: kì yóò sì mu ... rárá
  rationale: Ìkọ̀ Gíríìkì náà lágbára; “rárá” mú ìtẹnumọ́ rẹ̀ jáde, nígbà tí ọjọ́-ọ̀la “kì yóò” pa irisi àsọtẹ́lẹ̀ náà mọ́.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: a ó sì fi Ẹ̀mí Mímọ́ kún un
  rationale: Èyí pa ohùn àìṣe ti πλησθήσεται mọ́, ó sì jẹ́ kí iṣẹ́ Ọlọ́run hàn láì sọ ẹni tó ń ṣe é ní kedere ju orísun lọ.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: láti inú oyún ìyá rẹ̀ pàápàá
  rationale: Ó mú ìbẹ̀rẹ̀ kutukutu tí ἐκ àti ìtẹnumọ́ ἔτι wá sí Yorùbá, láì pinnu bóyá ìtumọ̀ náà jẹ́ “láti ìgbà inú oyún” tàbí “nígbà tí ó ṣì wà nínú oyún.”
theological_decisions:
- issue: Agbára οὐ μὴ πίῃ nínú ìkéde àsọtẹ́lẹ̀
  choice: 'Ìkọ̀ ọjọ́-ọ̀la tí a tẹnumọ́: “kì yóò ... rárá”'
  alternative: 'Àṣẹ tàbí ojúṣe: “kò gbọ́dọ̀ ... láéláé”'
  rationale: Ẹ̀dá Gíríìkì jẹ́ ìkọ̀ ọjọ́-ọ̀la tó lágbára. Ìtumọ̀ yìí pa agbára náà mọ́ láì yí i padà sí àṣẹ ní kedere, bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí ìyàsímímọ́ Jòhánù.
- issue: Ìtọ́kasí πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí mímọ́ gẹ́gẹ́ bí agbára tàbí ìwà tí kì í ṣe ẹni
  rationale: Lílo ọ̀rọ̀ náà nínú Lúùkù àti àyíká ìkéde áńgẹ́lì ń tọ́ka sí Ẹ̀mí Ọlọ́run; lẹ́tà ńlá bá ìlò Yorùbá Kristẹni tó wọ́pọ̀ mu.
- issue: Àkókò tí Ẹ̀mí Mímọ́ fi kún un
  choice: “láti inú oyún ìyá rẹ̀ pàápàá”
  alternative: “nígbà tí ó ṣì wà nínú oyún ìyá rẹ̀”
  rationale: Gíríìkì lè tẹnumọ́ ibi ìbẹ̀rẹ̀ tàbí pé ó ṣẹlẹ̀ nígbà tó ṣì wà nínú oyún; a pa àyè fún ìtumọ̀ méjèèjì mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìtànkálẹ̀ tó rọrùn fún òǹkàwé òde òní. A lo “oyún ìyá rẹ̀” dípò gbolohun ara tó le, a sì lo “a ó fi ... kún un” láti mú ohùn àìṣe Gíríìkì jáde lọ́nà Yorùbá tó dára.
