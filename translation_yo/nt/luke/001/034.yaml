source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: yo
  text: Ṣùgbọ́n Màríà sọ fún áńgẹ́lì náà pé, “Báwo ni èyí yóò ṣe rí, níwọ̀n bí èmi kò ti mọ ọkùnrin rí[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà ìtumọ̀ tí ó ṣe kedere: “níwọ̀n bí èmi kò ti ní ìbálòpọ̀ pẹ̀lú ọkùnrin rí.” Nínú Gíríìkì, “mọ ọkùnrin” jẹ́ ọ̀nà ìsọ̀rọ̀ oníwọ̀ntúnwọ̀nsì láti tọ́ka sí ìbálòpọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tó wà láàárín ìkéde áńgẹ́lì náà àti ìbéèrè Màríà hàn, láìsọ ìtakora náà di ohun tó lágbára jù.
- source_word: Μαριὰμ
  choice: Màríà
  rationale: Èyí ni ọ̀nà tí orúkọ náà gbà wọ́pọ̀ nínú Yorùbá.
- source_word: πρὸς τὸν ἄγγελον
  choice: fún áńgẹ́lì náà
  rationale: Nínú ìtàn yìí, ἄγγελος ń tọ́ka sí ẹ̀dá ọ̀run tí Ọlọ́run rán, kì í ṣe òjíṣẹ́ ènìyàn lásán.
- source_word: Πῶς ἔσται τοῦτο
  choice: Báwo ni èyí yóò ṣe rí
  rationale: Ó pa ìbéèrè nípa bí ohun tí a kéde náà yóò ṣe wáyé mọ́, ó sì tẹ̀ lé ìrọ̀rùn ọ̀rọ̀ Gíríìkì láìfi àlàyé kún un.
- source_word: ἐπεὶ
  choice: níwọ̀n bí ... ti
  rationale: Ìṣopọ̀ Yorùbá àdánidá yìí fi ìdí tí Màríà fi béèrè ìbéèrè náà hàn.
- source_word: ἄνδρα
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ọkùnrin tàbí ọkọ, ṣùgbọ́n nínú gbólóhùn àfiwé yìí, ‘ọkùnrin’ pa ààyè ìtumọ̀ orísun mọ́, kò sì dín un kù sí ‘ọkọ’ nìkan.
- source_word: οὐ γινώσκω
  choice: èmi kò ti mọ ... rí
  rationale: A pa àfiwé oníwọ̀ntúnwọ̀nsì ‘mọ ọkùnrin’ mọ́ nínú ọ̀rọ̀ pàtàkì; ‘kò ti ... rí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé irú ìrírí bẹ́ẹ̀ kò tíì sí títí di àsìkò ọ̀rọ̀ náà.
theological_decisions:
- issue: Ọ̀rọ̀ Màríà àti oyún Jésù
  choice: A pa àfiwé náà mọ́ pé ‘èmi kò ti mọ ọkùnrin rí,’ pẹ̀lú àlàyé ìsàlẹ̀ ìwé.
  alternative: ‘níwọ̀n bí èmi kò ti ní ìbálòpọ̀ pẹ̀lú ọkùnrin rí’ tàbí ‘níwọ̀n bí mo ti jẹ́ wúńdíá’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé Màríà ‘kò mọ ọkùnrin,’ èyí tí ó ń tọ́ka sí àìní ìbálòpọ̀ nínú àyíká ọ̀rọ̀ náà. Ìtumọ̀ yìí kò fi ‘wúńdíá’ rọ́pò àfiwé orísun, bẹ́ẹ̀ ni kò fi ohun tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa àfiwé oníwọ̀ntúnwọ̀nsì ti orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ìwé mú ìtumọ̀ rẹ̀ ṣe kedere fún òǹkàwé òde òní.
