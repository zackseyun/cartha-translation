id: LUK.1.77
reference: Luke 1:77
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: yo
  text: láti fún àwọn ènìyàn rẹ̀ ní ìmọ̀ ìgbàlà nínú ìdáríjì ẹ̀ṣẹ̀ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nípasẹ̀ ìdáríjì ẹ̀ṣẹ̀ wọn” tàbí “nítorí ìdáríjì ẹ̀ṣẹ̀ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: láti fún
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́ni articular yìí ń sọ ète tí ó sinmi lórí ẹsẹ tó ṣáájú; “láti fún” jẹ́ ọ̀nà àdánidá láti pa agbára infinitive náà mọ́ ní Yorùbá.
- source_word: γνῶσιν
  choice: ìmọ̀
  rationale: γνῶσις túmọ̀ sí ìmọ̀ tàbí òye; “ìmọ̀” ni ìtumọ̀ tó ṣe tààrà jù, tí kò sì fi irú ìmọ̀ náà hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: “Ìmọ̀ ìgbàlà” dúró fún ìbáṣepọ̀ genitive náà lọ́nà àdánidá, ó sì bá ọ̀nà tí Lúùkù gbà lo ọ̀rọ̀ náà nípa ìgbàlà mu.
- source_word: τῷ λαῷ αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Dative náà ń tọ́ka sí àwọn olùgbà ìmọ̀ náà. “Àwọn ènìyàn rẹ̀” jẹ́ Yorùbá àdánidá fún λαός pẹ̀lú αὐτοῦ nínú àyíká májẹ̀mú yìí.
- source_word: ἐν ἀφέσει
  choice: nínú ìdáríjì
  rationale: ἐν pẹ̀lú dative lè tọ́ka sí ààyè ìtumọ̀ tàbí ọ̀nà; “nínú ìdáríjì” pa ìbáṣepọ̀ náà mọ́ láìfi dandan sọ pé ó jẹ́ ohun èlò tàbí ohun tó fa ìgbàlà.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: ẹ̀ṣẹ̀ wọn
  rationale: Ní Yorùbá, “ẹ̀ṣẹ̀” sábà máa ń dúró gẹ́gẹ́ bí orúkọ àkójọpọ̀ láìní àmì ọ̀pọ̀, ṣùgbọ́n “wọn” pa ìtọ́kasí sí àwọn ènìyàn náà mọ́; ó bo ọ̀pọ̀ ἁμαρτιῶν lọ́nà àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàlà pẹ̀lú ìdáríjì
  choice: Ẹsẹ náà fi ìgbàlà hàn gẹ́gẹ́ bí ohun tí àwọn ènìyàn Ọlọ́run mọ̀ nínú ìdáríjì ẹ̀ṣẹ̀ wọn.
  alternative: A tún lè túmọ̀ ọ́ pé wọ́n mọ ìgbàlà “nípasẹ̀” tàbí “nítorí” ìdáríjì ẹ̀ṣẹ̀ wọn.
  rationale: Gbólóhùn ἐν ἀφέσει ἁμαρτιῶν αὐτῶν lè ní ìtumọ̀ ààyè, ọ̀nà, tàbí ohun èlò. “Nínú” pa ìdàrúdàpọ̀ tó wà nínú Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ àwọn ìtumọ̀ mìíràn tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá ṣe àdánidá; èdè náà ní ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “àwọn ènìyàn rẹ̀” dípò ọ̀rọ̀ tó lè dà bí ẹgbẹ́ ẹ̀yà nìkan, àti “ẹ̀ṣẹ̀ wọn” gẹ́gẹ́ bí àkójọpọ̀ Yorùbá àdánidá.
