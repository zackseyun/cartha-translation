source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: yo
  text: Ó sì máa jọba lórí ilé Jákọ́bù títí láéláé; ìjọba rẹ̀ kì yóò sì ní òpin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεύσει
  choice: máa jọba
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ọjọ́ iwájú, ó sì ń tọ́ka sí lílo àṣẹ gẹ́gẹ́ bí ọba. “Máa jọba” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ ọba mọ́.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: lórí ilé Jákọ́bù
  rationale: “Lórí” fi agbára ìjọba hàn, “ilé Jákọ́bù” sì pa àpèjúwe Bíbélì náà àti ìtumọ̀ rẹ̀ gẹ́gẹ́ bí àwùjọ ìdílé májẹ̀mú mọ́ láì túmọ̀ rẹ̀ sí ohun mìíràn.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láéláé
  rationale: Àkànlò èdè Gíríìkì náà ń sọ nípa àkókò tí kò ní òpin. “Títí láéláé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti sọ ìtumọ̀ yẹn.
- source_word: βασιλείας
  choice: ìjọba
  rationale: Níhìn-ín, βασιλεία lè túmọ̀ sí ìṣàkóso tàbí ilẹ̀ ọba. “Ìjọba” pa ìfọ̀rọ̀wérọ̀ yẹn mọ́, ó sì bá gbólóhùn pé kò ní òpin mu lọ́nà àdánidá.
- source_word: οὐκ ἔσται τέλος
  choice: kì yóò ní òpin
  rationale: Èyí fi ìkọ̀sẹ̀ ọjọ́ iwájú hàn ní Yorùbá àdánidá, ó sì sọ ní kedere pé ìjọba náà kò ní dópin.
theological_decisions:
- issue: Ìwọ̀n ẹni tí “ilé Jákọ́bù” ń tọ́ka sí
  choice: A pa “ilé Jákọ́bù” mọ́ láì yí i sí “Ísírẹ́lì” tàbí “àwọn ènìyàn Ọlọ́run.”
  alternative: àwọn ènìyàn Ísírẹ́lì; àwọn ènìyàn Ọlọ́run
  rationale: Èyí pa ọ̀rọ̀ ìkéde áńgẹ́lì àti àìdánilójú ìmọ̀-ẹ̀sìn tó wà nínú àpèjúwe májẹ̀mú náà mọ́, láì fi ìtumọ̀ tó gbòòrò sí i sínú ọ̀rọ̀.
- issue: Gígùn ìjọba náà
  choice: “títí láéláé” àti “kì yóò ní òpin” ni a lò láti fi ìjọba tí kò lópin hàn.
  alternative: fún àwọn àkókò; títí dé àwọn àkókò
  rationale: Àkànlò Gíríìkì àti gbólóhùn tó tẹ̀ lé e jọ ń fi ìjọba ayérayé hàn. Yorùbá yìí sọ ìtumọ̀ náà ní kedere láì sọ agbára rẹ̀ di aláìlágbára.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ilé Jákọ́bù” ni a pa mọ́ gẹ́gẹ́ bí àpèjúwe Bíbélì. Àmì ìparí àsọyé ni a fi sílẹ̀ nítorí ẹsẹ yìí jẹ́ apá kan nínú ọ̀rọ̀ áńgẹ́lì tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú.
