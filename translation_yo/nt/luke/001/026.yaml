id: LUK.1.26
reference: Luke 1:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: yo
  text: Ní oṣù kẹfà[a], a rán áńgẹ́lì Gébúrẹ́lì láti ọ̀dọ̀ Ọlọ́run sí ìlú kan ní Galili, tí orúkọ rẹ̀ ń jẹ́ Násárẹ́tì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, oṣù kẹfà oyún Elisabeti; wo Lúùkù 1:24, 36.
    reason: cross_reference
  - marker: b
    text: Tàbí, “sí ìlú kan ti Galili, tí orúkọ rẹ̀ ń jẹ́ Násárẹ́tì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Ní oṣù kẹfà
  rationale: Gbólóhùn Ἐν pẹ̀lú dátífù jẹ́ àmì àkókò, ‘ní oṣù kẹfà.’ δέ jẹ́ àsopọ̀ pẹ̀lẹ́; kò pọn dandan láti túmọ̀ rẹ̀ lọ́tọ̀ ní Yorùbá níbí, kí a má bàa fi ìyàtọ̀ tí kò lágbára kún ọ̀rọ̀ náà.
- source_word: ἀπεστάλη
  choice: a rán
  rationale: Aorístì pásífù ἀποστέλλω túmọ̀ sí pé a rán ẹni náà. Ìṣètò Yorùbá yìí pa ìtumọ̀ pásífù mọ́ láìfi ẹni tó rán án sípò olùṣe nínú gbólóhùn.
- source_word: ὁ ἄγγελος
  choice: áńgẹ́lì
  rationale: Ní àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe òjíṣẹ́ ènìyàn lásán.
- source_word: Γαβριὴλ
  choice: Gébúrẹ́lì
  rationale: A kọ orúkọ náà ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: ἀπό pẹ̀lú génítífù tẹnu mọ́ orísun ibi tí a ti rán Gébúrẹ́lì, dípò kí ó sọ Ọlọ́run di olùṣe ní tààràtà.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: sí ìlú kan ní Galili
  rationale: εἰς fi ibi àfojúsùn hàn, τῆς Γαλιλαίας sì lè jẹ́ ‘ní Galili’ ní Yorùbá àdánidá. Èyí yẹra fún ọ̀rọ̀ aláìṣe-déédéé bí ‘ìlú kan ti Galili.’
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: tí orúkọ rẹ̀ ń jẹ́ Násárẹ́tì
  rationale: Èyí ń tẹ̀lé ìtumọ̀ gidi pé ‘orúkọ rẹ̀ ni Násárẹ́tì,’ ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ ìlú náà.
theological_decisions:
- issue: Ohun tí ‘oṣù kẹfà’ ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ‘oṣù kẹfà’ nínú ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ó ń tọ́ka sí oṣù kẹfà oyún Elisabeti.
  alternative: Oṣù kẹfà ọdún kan lápapọ̀.
  rationale: Àyíká Lúùkù 1:24, 36 fi hàn pé oyún Elisabeti ni a ń tọ́ka sí, ṣùgbọ́n Gíríìkì ẹsẹ yìí kò tún ohun náà sọ ní kedere. Nítorí náà, a pa àìsọ-kedere inú ọ̀rọ̀ mọ́, a sì fi ìrànlọ́wọ́ sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbo. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì yan ‘ní Galili’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìṣeéṣe génítífù ‘ti Galili’ mọ́.
