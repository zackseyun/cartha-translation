  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: yo
  text: Alábùkún ni obìnrin tí ó gbàgbọ́ pé ìmúṣẹ yóò wà fún àwọn ohun tí a sọ fún un láti ọ̀dọ̀ Olúwa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Alábùkún ni obìnrin tí ó gbàgbọ́, nítorí ìmúṣẹ yóò wà fún àwọn ohun tí a sọ fún un láti ọ̀dọ̀ Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “nítorí pé,” bí ó tilẹ̀ jẹ́ pé “pé,” tí ó ń fi ohun tí ó gbàgbọ́ hàn, ló ṣeé ka jù níbí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “dídé ìparí” tàbí “ìmúmú ṣẹ” fún “ìmúṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: Ìbùkún ni fún
  rationale: Ó pa ìtumọ̀ ẹ̀sìn àti ti ojúrere Ọlọ́run mọ́ ju ‘ó láyọ̀’ lọ, ó sì jẹ́ ọ̀nà àdánidá láti kéde ẹni náà ní alábùkún ní Yorùbá.
- source_word: ἡ πιστεύσασα
  choice: obìnrin náà tí ó gbàgbọ́
  rationale: Ó tú participle tí ó ní article náà gẹ́gẹ́ bí ẹni kan, ó sì fi ìṣe ìgbàgbọ́ tí ó ti ṣẹlẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: Ní ibi yìí, ὅτι ṣeé ka jù lọ gẹ́gẹ́ bí ohun tí obìnrin náà gbàgbọ́, ìyẹn ‘pé’; ṣùgbọ́n ìtumọ̀ onídí ‘nítorí pé’ ṣì ṣeé ṣe, a sì tọ́ka sí i ní àlàyé ìsàlẹ̀.
- source_word: τελείωσις
  choice: yóò ṣẹ
  rationale: Ní ọ̀rọ̀ ìlérí, ‘ṣẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá fún mímú ohun tí a sọ dé ìparí tàbí sí ìmúṣẹ.
- source_word: τοῖς λελαλημένοις
  choice: àwọn ohun tí … sọ fún un
  rationale: Ó fi akoonu ọ̀rọ̀ tí a ti sọ tẹ́lẹ̀ hàn, ó sì pa ìtọ́kasí sí ọ̀pọ̀ ohun náà mọ́.
- source_word: παρὰ κυρίου
  choice: tí Olúwa sọ fún un
  rationale: A tún gbólóhùn náà ṣe ní Yorùbá àdánidá láti fi Olúwa hàn gẹ́gẹ́ bí orísun ọ̀rọ̀ náà; ìtumọ̀ rẹ̀ ni ‘ohun tí ó wá láti ọ̀dọ̀ Olúwa,’ láìfi dandan sọ pé Olúwa bá a sọ̀rọ̀ ní tààrà.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún κύριος nígbà tí ó ń tọ́ka sí Ọlọ́run Ísírẹ́lì.
theological_decisions:
- issue: Ìbáṣepọ̀ ìbùkún Màríà, ìgbàgbọ́ rẹ̀, àti ọ̀rọ̀ ìlérí
  choice: A kéde obìnrin náà ní alábùkún, ẹni tí ó gbàgbọ́ pé ohun tí Olúwa sọ fún un yóò ṣẹ.
  alternative: A kéde rẹ̀ ní alábùkún nítorí pé àwọn ohun tí Olúwa sọ fún un yóò ṣẹ.
  rationale: Ìṣètò Gíríìkì ṣe àtìlẹ́yìn jù lọ fún ὅτι gẹ́gẹ́ bí gbólóhùn akoonu lẹ́yìn πιστεύσασα. Èyí pa ìtẹnumọ́ Lúùkù lórí gbígbàgbọ́ nínú ìlérí Ọlọ́run mọ́, láìfi ẹ̀kọ́ mìíràn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ìbùkún ni fún’ mú ìkéde μακαρία jáde ní kedere; ‘yóò ṣẹ’ sì jẹ́ ọ̀nà tí àwọn ènìyàn máa ń gbà sọ nípa ìlérí.
