  terminology: “Alábùkún,” “gbàgbọ́,” “ìmúṣẹ,” àti “Olúwa” bá ọ̀rọ̀ ìsìn àti ìlò Bíbélì Yorùbá mu. “Láti ọ̀dọ̀ Olúwa” dára fún παρὰ κυρίου nítorí ó fi orísun hàn láìpinnu nípa ọ̀nà tí ọ̀rọ̀ náà gbà dé ọ̀dọ̀ rẹ̀.
