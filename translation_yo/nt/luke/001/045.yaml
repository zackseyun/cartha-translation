revisions:
- from: Ìbùkún ni fún obìnrin náà tí ó gbàgbọ́ pé àwọn ohun tí Olúwa sọ fún un yóò ṣẹ[a][b].
  to: Alábùkún ni obìnrin tí ó gbàgbọ́ pé ìmúṣẹ yóò wà fún àwọn ohun tí a sọ fún un láti ọ̀dọ̀ Olúwa[a][b].
  rationale: Àtúnyẹ̀wò náà rọ́pò ìtumọ̀ tó ń sọ pé àwọn ohun náà “yóò ṣẹ” pẹ̀lú “ìmúṣẹ yóò wà fún,” kí τελείωσις lè hàn gẹ́gẹ́ bí ìmúṣẹ àwọn ohun tí a ti sọ. Ó tún rọ́pò ìṣe alákòóso “Olúwa sọ” pẹ̀lú “a sọ ... láti ọ̀dọ̀ Olúwa,” kí passive participle náà àti παρὰ κυρίου gẹ́gẹ́ bí orísun má bàa sọnù. Ìtumọ̀ ὅτι gẹ́gẹ́ bí gbólóhùn akoonu ni a pa mọ́, pẹ̀lú àṣàyàn onídí nínú àlàyé ìsàlẹ̀.
