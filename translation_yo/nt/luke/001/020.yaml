id: LUK.1.20
reference: Luke 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: yo
  text: Kíyèsí! Ìwọ yóò dákẹ́, ìwọ kì yóò sì lè sọ̀rọ̀ títí di ọjọ́ tí àwọn nǹkan wọ̀nyí yóò fi ṣẹlẹ̀, nítorí pé ìwọ kò gba àwọn ọ̀rọ̀ mi gbọ́; àwọn ọ̀rọ̀ náà yóò sì ní ìmúṣẹ ní àkókò tí a yàn fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò wọn tí ó yẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àkókò tó yẹ tàbí tí a ti yàn fún ìmúṣẹ àwọn ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ipa àmì-ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì bá ọ̀rọ̀ angẹli tó ní ọlá mu láì lo èdè àtijọ́ tí kò ṣeé lóye.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: ìwọ yóò dákẹ́, ìwọ kì yóò sì lè sọ̀rọ̀
  rationale: 'Ó pa àwọn apá méjèèjì mọ́: ipò ìdákẹ́jẹ àti àìlágbára láti sọ̀rọ̀. Èyí fi hàn pé kì í ṣe ìdákẹ́jẹ àtinúwá lásán.'
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: títí di ọjọ́ tí àwọn nǹkan wọ̀nyí yóò fi ṣẹlẹ̀
  rationale: Ìtumọ̀ àkókò náà ṣe kedere ní Yorùbá, ó sì tú γένηται ní ọ̀nà àdánidá gẹ́gẹ́ bí ‘ṣẹlẹ̀.’
- source_word: ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: nítorí pé ìwọ kò gba ọ̀rọ̀ mi gbọ́
  rationale: ‘Nítorí pé’ mú ìdí tàbí ìdáhùn tó wà nínú ἀνθ’ ὧν jáde, ‘gba ọ̀rọ̀ ... gbọ́’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbà ohun tí a sọ gbọ́.
- source_word: οἵτινες πληρωθήσονται
  choice: àwọn ọ̀rọ̀ náà yóò sì ṣẹ
  rationale: Àtúnṣe orúkọ náà yọ àìdánilójú ẹni tí arọ́pò-orúkọ ń tọ́ka sí kúrò ní Yorùbá, ‘ṣẹ’ sì jẹ́ ìsọ̀rọ̀ àdánidá fún ọ̀rọ̀ tàbí àsọtẹ́lẹ̀ tí ó ní ìmúṣẹ.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: ní àkókò tí a yàn fún wọn
  rationale: Ó pa ìtumọ̀ καιρός gẹ́gẹ́ bí àkókò tó yẹ tàbí tí a pinnu mọ́; fọ́ọ̀mù aláìdárúkọ ‘a yàn’ kò fi ẹni tó yan án kún ọ̀rọ̀ ní tààrà.
theological_decisions:
- issue: Irú ìdájọ́ tí Sekaráyà gba
  choice: Ìdákẹ́jẹ tí a fi lé e lórí, pẹ̀lú àìlágbára láti sọ̀rọ̀, títí ìlérí náà yóò fi ṣẹ
  alternative: Àṣẹ pé kí ó kàn dákẹ́ ní àtinúwá
  rationale: Àpapọ̀ σιωπῶν àti μὴ δυνάμενος λαλῆσαι fi àìlágbára gidi hàn, kì í ṣe yíyan láti má sọ̀rọ̀ lásán.
- issue: Ẹni tó yan àkókò ìmúṣẹ
  choice: Lo ‘àkókò tí a yàn fún wọn’ láì darúkọ ẹni tó yàn án
  alternative: ‘àkókò tí Ọlọ́run yàn’
  rationale: Àyíká lè túmọ̀ sí ìpinnu Ọlọ́run, ṣùgbọ́n Gíríìkì kò darúkọ Ọlọ́run ní gbólóhùn yìí; ìtumọ̀ náà yẹra fún fífi ohun tí kò hàn gbangba kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọlá, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtúnwí Gíríìkì nípa ìdákẹ́jẹ àti àìlágbára láti sọ̀rọ̀ mọ́.
