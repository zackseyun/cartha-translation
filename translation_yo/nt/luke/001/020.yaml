    text: Tàbí, “ní àkókò wọn tí ó yẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àkókò tó yẹ tàbí tí a ti yàn fún ìmúṣẹ àwọn ọ̀rọ̀ náà.
    reason: lexical_alternative
  revision_rationale: The revision corrects the unnatural opening attention formula, restores the source plural for “my words,” and uses an explicit Yoruba fulfillment expression. It preserves the imposed nature of the speechlessness, the causal relation to unbelief, and the source’s non-specification of the one who appoints the time.
