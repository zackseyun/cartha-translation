lexical_decisions:
- source_word: σωτηρίαν
  choice: ìgbàlà
  rationale: “Ìgbàlà” pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́, ó sì tún lè tọ́ka sí ìdáǹdè kúrò lọ́wọ́ àwọn agbára ọ̀tá gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: kúrò lọ́wọ́ àwọn ọ̀tá wa
  rationale: Ọ̀rọ̀ náà fi ìyapa tàbí ìdáǹdè kúrò ní abẹ́ ọ̀tá hàn. “Kúrò lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí láìfi “agbára” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐκ χειρὸς
  choice: kúrò lọ́wọ́
  rationale: Èdè àkànlò “lọ́wọ́” pa àwòrán “ọwọ́” inú orísun mọ́, ó sì ṣe kedere ní Yorùbá gẹ́gẹ́ bí ìdáǹdè kúrò lábẹ́ agbára tàbí ìṣàkóso ẹlòmíràn.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: gbogbo àwọn tí ó kórìíra wa
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìṣe tí ń bá a lọ tàbí ìwà tí ó wọ́pọ̀ nínú participle náà mọ́.
- source_word: καὶ
  choice: àti
  rationale: “Àti” so àwọn gbólóhùn méjèèjì pọ̀ ní tààrà láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Irú ìgbàlà tí àsọtẹ́lẹ̀ Sekaráyà ń ṣèlérí
  choice: Lo “ìgbàlà” ní ọ̀nà tí ó gba ìdáǹdè gidi kúrò lọ́wọ́ ọ̀tá àti ìtumọ̀ ìràpadà tó gbòòrò láyè.
  alternative: Ìdáǹdè ti orílẹ̀-èdè nìkan, tàbí ìgbàlà ẹ̀mí kúrò nínú ẹ̀ṣẹ̀ nìkan.
  rationale: Ẹsẹ̀ náà sọ ní tààrà nípa àwọn ọ̀tá àti àwọn tí ó kórìíra wa, ṣùgbọ́n “ìgbàlà” nínú Lúùkù 1 tún ní ìtumọ̀ ìràpadà. Ìtumọ̀ náà kò yẹ kí ó fi ipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá àwùjọ tí ó bójú mu, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo “kúrò lọ́wọ́” lẹ́ẹ̀mejì láti pa àwòrán ìwé mímọ́ àti ìtumọ̀ ìdáǹdè mọ́ ní èdè tí ó ṣe kedere fún òǹkàwé òde òní.
