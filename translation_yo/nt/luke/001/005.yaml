  source_fidelity: Àtúnṣe kékeré ni a nílò. “Ní ọjọ́ Hẹ́rọ́dù” yẹ kí ó jẹ́ “Ní àwọn ọjọ́ Hẹ́rọ́dù” láti fi púpọ̀ ἐν ταῖς ἡμέραις hàn, àti láti jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀. Àlàyé tí ń dá Hẹ́rọ́dù mọ̀ gẹ́gẹ́ bí Hẹ́rọ́dù Ńlá kọjá ohun tí ẹsẹ̀ náà sọ, nítorí náà a yọ ọ́. “Lára àwọn ọmọbìnrin Aaroni” pa ìfihàn ìdílé Gíríìkì mọ́, ṣùgbọ́n ó rọrùn síi nínú Yorùbá ju “láti inú” lọ ní àyíká aya ẹni.
