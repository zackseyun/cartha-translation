id: LUK.1.5
reference: Luke 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: yo
  text: Ní àwọn ọjọ́ Hẹ́rọ́dù, ọba Jùdíà, àlùfáà kan wà tí orúkọ rẹ̀ ń jẹ́ Sekaráyà, láti inú ìpín iṣẹ́ Abíjà[a]; ó sì ní aya kan lára àwọn ọmọbìnrin Aaroni[b], orúkọ rẹ̀ sì ń jẹ́ Elisabẹti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìpín iṣẹ́ Abíjà” jẹ́ ọ̀kan lára àwọn ẹgbẹ́ àlùfáà tí a pín sílẹ̀ láti máa ṣe iṣẹ́ tẹ́ńpìlì ní àsìkò wọn.
    reason: cultural_note
  - marker: b
    text: Ó tún lè jẹ́, “láti inú àwọn ọmọ ìran Aaroni.” Gíríìkì sọ ní tààrà pé, “láti inú àwọn ọmọbìnrin Aaroni,” èyí tí ó ń tọ́ka sí ìran àlùfáà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Ní ọjọ́ ... àlùfáà kan wà
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà ìbẹ̀rẹ̀ ìtàn tí ó fi ènìyàn tuntun hàn. ‘Ní ọjọ́ ... wà’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò àti wíwà mọ́.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Hẹ́rọ́dù, ọba Jùdíà
  rationale: Ó sọ ipò Hẹ́rọ́dù àti ilẹ̀ tí ó ń ṣàkóso ní tààrà; ‘Jùdíà’ tọ́ka sí agbègbè ìtàn náà.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: àlùfáà kan ... tí orúkọ rẹ̀ ń jẹ́ Sekaráyà
  rationale: ‘Kan’ mú àìdánimọ̀ τις jáde, nígbà tí gbólóhùn orúkọ náà jẹ́ ọ̀nà Yorùbá tó rọrùn láti fi ẹni tuntun hàn.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: láti inú ìpín iṣẹ́ Abíjà
  rationale: ἐφημερία jẹ́ ẹgbẹ́ tàbí ìpín àwọn àlùfáà tí ń ṣe iṣẹ́ tẹ́ńpìlì ní àkókò tí a yàn fún wọn; ‘ìpín iṣẹ́’ jẹ́ kedere láì ṣàlàyé rẹ̀ jù nínú ẹsẹ̀.
- source_word: γυνὴ αὐτῷ
  choice: ó sì ní aya kan
  rationale: Dátífù αὐτῷ ní agbára ohun-ìní níbí (‘aya kan wà fún un’); ‘ó ní aya kan’ ni Yorùbá àdánidá.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: láti inú àwọn ọmọbìnrin Aaroni
  rationale: Èyí pa àwòrán ìdílé inú Gíríìkì mọ́. Ní àyíká yìí, ó túmọ̀ sí pé Elisabẹti jẹ́ ọmọ ìran Aaroni.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: orúkọ rẹ̀ sì ń jẹ́ Elisabẹti
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún fífi orúkọ ẹni hàn, ó sì ṣe àfihàn καί pẹ̀lú ‘sì’.
theological_decisions:
- issue: Ọ̀rọ̀ ìran Elisabẹti
  choice: láti inú àwọn ọmọbìnrin Aaroni
  alternative: láti inú àwọn ọmọ ìran Aaroni
  rationale: A pa ọ̀rọ̀ Gíríìkì tó túmọ̀ ní tààrà sí ‘àwọn ọmọbìnrin Aaroni’ mọ́ nínú ẹsẹ̀, kí a má bàa mú àwòrán ìdílé rẹ̀ kúrò; àlàyé ìtumọ̀ ìran wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘àlùfáà’ fún ἱερεύς àti ‘ìpín iṣẹ́’ fún ètò iṣẹ́ àwọn àlùfáà.
