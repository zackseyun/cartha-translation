id: LUK.1.59
reference: Luke 1:59
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ ní ọjọ́ kẹjọ pé wọ́n wá láti kọ ọmọ náà ní ilà, wọ́n sì ń pè é ní Sekaráyà[a], gẹ́gẹ́ bí orúkọ baba rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì pe é ní Sekaráyà.” Imperfect Gíríìkì náà (“wọ́n sì ń pè é”) lè fi ìṣe tí ń lọ tàbí ìgbìyànjú láti fi orúkọ náà sọ ọ́ hàn, èyí tó bá àtúnṣe inú ẹsẹ tó tẹ̀ lé mu.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “wọ́n ń pè é ní ìbámu pẹ̀lú orúkọ baba rẹ̀, Sekaráyà.” Èyí ń tọ́ka sí àṣà fífi orúkọ ọmọ tẹ̀lé ti ọmọ ẹbí kan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣẹ̀lẹ̀ tuntun bẹ̀rẹ̀, ó sì pa agbára ọ̀rọ̀ ìtàn Lúùkù mọ́ láì lo èdè àtijọ́.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ní ọjọ́ kẹjọ
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àsìkò pàtó inú Gíríìkì mọ́.
- source_word: ἦλθον
  choice: wọ́n wá
  rationale: Gíríìkì fi ẹni tó ṣe iṣẹ́ náà sílẹ̀ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn tí a kò dárúkọ; “wọ́n wá” kò fi ẹgbẹ́ kankan kún un.
- source_word: περιτεμεῖν
  choice: láti kọ ... ní ilà
  rationale: Ọ̀rọ̀ náà fi ète wíwá wọn hàn. “Kọ ní ilà” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ìkọlà abẹ́, ó sì yẹ fún àyíká ẹ̀sìn yìí.
- source_word: τὸ παιδίον
  choice: ọmọ náà
  rationale: “Ọmọ náà” jẹ́ ìtumọ̀ tó ṣe tààrà, tó sì bá ọmọ ọwọ́ inú àyíká náà mu láì fi ìtumọ̀ míì kún un.
- source_word: ἐκάλουν
  choice: wọ́n sì ń pè é
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú Gíríìkì lè tọ́ka sí ìpinnu tí wọ́n ń gbìyànjú láti mú ṣẹ; “ń pè é” pa ìṣòro ìtumọ̀ yìí mọ́ fún àtúnṣe ẹsẹ tó tẹ̀ lé.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: bí orúkọ
  rationale: Nínú gbolohun Yorùbá yìí, “bí orúkọ baba rẹ̀” fi àṣà fífi orúkọ mọ̀lẹ́bí sọ ọmọ hàn ní ọ̀nà àdánidá.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: baba rẹ̀
  rationale: Èyí ni ọ̀nà ìní tó ṣe àdánidá ní Yorùbá.
- source_word: Ζαχαρίαν
  choice: Sekaráyà
  rationale: A lo fọ́ọ̀mù orúkọ tó wọ́pọ̀ nínú àṣà Bíbélì Yorùbá, tó sì jẹ́ àfihàn orúkọ Hébérù tó wà lẹ́yìn fọ́ọ̀mù Gíríìkì náà.
theological_decisions:
- issue: Bóyá fífi orúkọ náà ti parí tàbí wọ́n kàn ń gbìyànjú láti fi í sọ ọmọ náà
  choice: wọ́n sì ń pè é ní Sekaráyà
  alternative: wọ́n sì pe orúkọ rẹ̀ ní Sekaráyà
  rationale: Àṣàyàn náà pa àbùdá imperfect ἐκάλουν àti ìforígbárí tó wáyé ní ẹsẹ tó tẹ̀ lé mọ́, láì pinnu pé fífi orúkọ náà ti parí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀n tó ní àmì ohùn, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa ẹni ọ̀pọ̀ tí a kò dárúkọ mọ́ pẹ̀lú “wọ́n,” a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
