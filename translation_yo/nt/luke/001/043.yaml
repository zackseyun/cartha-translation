source:
  edition: SBLGNT
  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: yo
  text: Báwo ni ó ṣe jẹ́ pé ìyá Olúwa mi wá sí ọ̀dọ̀ mi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόθεν
  choice: Kí sì ni ó mú kí
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ ní pàtó sí ‘láti ibo,’ nínú ìbéèrè ìyàlẹ́nu yìí ó ń béèrè bí irú ojú rere bẹ́ẹ̀ ṣe dé bá ẹni náà. Gbólóhùn Yorùbá yìí sọ ìyàlẹ́nu náà lọ́nà àdánidá.
- source_word: μοι τοῦτο
  choice: a fi irú ọlá yìí fún mi
  rationale: Dátífù μοι tọ́ka sí ẹni tí àǹfààní àìròtẹ́lẹ̀ náà dé bá. Fífi ‘ọlá’ kún un mú ìtumọ̀ àṣà-ọ̀rọ̀ náà hàn ní Yorùbá, láìfi ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀ náà.
- source_word: ἵνα ἔλθῃ
  choice: tí ... fi wá
  rationale: Níbí, ἵνα ṣàlàyé ohun tí ó fa ìyàlẹ́nu náà, kì í ṣe ète kan. Ìlànà ‘tí ... fi’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣẹ̀lẹ̀ yìí hàn.
- source_word: ἡ μήτηρ
  choice: ìyá
  rationale: Ìtumọ̀ tààrà, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: τοῦ κυρίου μου
  choice: Olúwa mi
  rationale: ‘Olúwa’ pa ìbọ̀wọ̀ àti agbára orúkọ oyè κύριος mọ́, nígbà tí ‘mi’ pa ìjẹ́wọ́ Elisabẹti mọ́ láìṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tó kọjá ẹsẹ yìí.
- source_word: πρὸς ἐμέ
  choice: sọ́dọ̀ mi
  rationale: Ọ̀rọ̀ yìí fi ìṣípò sí ọ̀dọ̀ Elisabẹti hàn. ‘Sọ́dọ̀ mi’ jẹ́ Yorùbá àdánidá, kò sì ṣe àfikún ‘ilé mi,’ èyí tí Gíríìkì kò sọ.
theological_decisions:
- issue: Bí a ṣe máa tú κύριος nínú ‘ìyá Olúwa mi’
  choice: Olúwa mi
  alternative: ọ̀gá mi
  rationale: ‘Olúwa’ jẹ́ kí agbára ìjẹ́wọ́ nípa ẹni tí Màríà lóyún rẹ̀ dúró, láìdín in kù sí ọ̀gá lasán tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ ọjọ́ iwájú sínú ẹsẹ náà.
- issue: Bí a ṣe máa tú àṣà-ọ̀rọ̀ πόθεν μοι τοῦτο
  choice: Kí sì ni ó mú kí a fi irú ọlá yìí fún mi
  alternative: Láti ibo ni èyí ti wá sí mi
  rationale: Ìtumọ̀ tí ó sun mọ́ lẹ́tà gan-an lè ṣókùnkùn ní Yorùbá. Àṣàyàn yìí mú ìyàlẹ́nu Elisabẹti àti ìmọ̀lára pé ọlá àìròtẹ́lẹ̀ ni ó rí hàn, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà gangan ti Gíríìkì pamọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘irú ọlá yìí’ ṣàlàyé àṣà-ọ̀rọ̀ Gíríìkì lọ́nà àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
