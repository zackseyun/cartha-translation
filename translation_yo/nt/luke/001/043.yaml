  to: Báwo ni ó ṣe jẹ́ pé ìyá Olúwa mi wá sí ọ̀dọ̀ mi?
  rationale: A yọ ìtumọ̀ ìdí àti aṣojú-ṣe àìlódì sí ẹni tí “Kí sì ni ó mú kí a fi …” mú wá. Ìtúnṣe náà pa ìbéèrè ìyàlẹ́nu πόθεν, ìjẹ́wọ́ “Olúwa mi,” àti ìṣípadà ìyá náà sí ọ̀dọ̀ Elisabẹti mọ́. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ kí ó má pe ìrànlọ́wọ́ àṣà-ọ̀rọ̀ ní ìtumọ̀ gangan pátápátá.
