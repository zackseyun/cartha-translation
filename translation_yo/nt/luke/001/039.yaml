id: LUK.1.39
reference: Luke 1:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, Màríà dìde, ó sì lọ pẹ̀lú ìkánjú sí agbègbè olókè, sí ìlú kan ní ilẹ̀ Júdà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ìlú ńlá kan ní ilẹ̀ Júdà,” tàbí “sí ìlú kan ní Jùdíà.” Ọ̀rọ̀ Gíríìkì πόλις lè túmọ̀ sí ìlú ńlá tàbí ìlú kékeré; Ἰούδα sì lè tọ́ka sí agbègbè Júdà tàbí Jùdíà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: dìde
  rationale: Ọ̀rọ̀ ìṣe àpólà aorist yìí ṣáájú ọ̀rọ̀ ìṣe pàtàkì, ó sì ń fi bí Màríà ṣe dìde láti lọ hàn. “Dìde” pa tẹ̀léńtẹ̀lé ìtàn náà mọ́ láì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: δὲ
  choice: ó sì
  rationale: δὲ jẹ́ àmì ìlọsíwájú ìtàn tí kò lágbára. Nínú Yorùbá, “ó sì” so ìṣe náà mọ́ àyíká rẹ̀ lọ́nà àdánidá, láì fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Èyí pa ìtọ́kasí sí àkókò tó sún mọ́ àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐπορεύθη
  choice: lọ
  rationale: πορεύομαι níbí túmọ̀ sí lílọ tàbí rírìn àjò. “Lọ” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bo ìtumọ̀ náà dáadáa.
- source_word: εἰς τὴν ὀρεινὴν
  choice: sí ilẹ̀ olókè
  rationale: ὀρεινή tí a lò gẹ́gẹ́ bí orúkọ ń tọ́ka sí agbègbè òkè. “Ilẹ̀ olókè” jẹ́ èdè Yorùbá àdánidá fún agbègbè bẹ́ẹ̀.
- source_word: μετὰ σπουδῆς
  choice: yára
  rationale: σπουδή lè túmọ̀ sí ìtara, ìkánjú, tàbí ṣíṣe ohun ní kíákíá. Ní àyíká ìrìn àjò yìí, “yára” fi hàn pé Màríà lọ láìjáfara, láìfi ìdí inú tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: εἰς πόλιν Ἰούδα
  choice: sí ìlú kan ní ilẹ̀ Júdà
  rationale: πόλις lè jẹ́ ìlú ńlá tàbí ìlú kékeré; “ìlú kan” pa àìdánimọ̀ ibùdó náà mọ́. Ἰούδα sì ṣeé lóye jù lọ gẹ́gẹ́ bí orúkọ agbègbè, nítorí náà “ní ilẹ̀ Júdà” mú ìbáṣepọ̀ ilẹ̀ náà ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ Ἰούδα
  choice: Júdà gẹ́gẹ́ bí agbègbè tàbí ilẹ̀ ẹ̀yà
  alternative: Jùdíà gẹ́gẹ́ bí orúkọ agbègbè; tàbí ìlú kan tí orúkọ rẹ̀ ń jẹ́ Júdà
  rationale: Ìrísí Gíríìkì Ἰούδα lè dúró fún Júdà/Jùdíà ní ibámu pẹ̀lú àyíká. Níhìn-ín, ó ṣeé ṣe jù pé ó ń tọ́ka sí agbègbè Júdà. “Ilẹ̀ Júdà” dúró sún mọ́ ọ̀rọ̀ Gíríìkì, kò sì dá ìtumọ̀ orúkọ ìlú kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ, pẹ̀lú ìlò èdè ìtàn tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Màríà” àti “Júdà” gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ nínú Yorùbá; a sì pa àìdánilójú πόλις àti Ἰούδα mọ́ nínú àlàyé ìsàlẹ̀.
