id: LUK.1.60
reference: Luke 1:60
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: yo
  text: Ìyá rẹ̀ sì dáhùn pé, “Rárá, ṣùgbọ́n Jòhánù ni a ó pè é.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist participle tí ó ń ṣí ọ̀rọ̀ tààrà sílẹ̀; “dáhùn” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ “answered/replied” hàn.
- source_word: μήτηρ αὐτοῦ
  choice: Ìyá rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ ohun-ìní Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ gírámà Gíríìkì mu.
- source_word: Οὐχί
  choice: Rárá
  rationale: Nínú àyíká ìjíròrò yìí, ọ̀rọ̀ náà jẹ́ ìkọ̀ tí ó lágbára; “Rárá” jẹ́ ìdáhùn Yorùbá tí ó ṣe tààrà.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó ń ṣàtúnṣe èrò tí àwọn ènìyàn ní ní ẹsẹ 59; “ṣùgbọ́n” pa agbára ìtakora àti àtúnṣe náà mọ́.
- source_word: κληθήσεται
  choice: ni a ó pè é
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀-ìṣe ọjọ́ iwájú aláìlẹ́ni-mọ́ra mọ́, ó sì jẹ́ Yorùbá àdánidá fún fífi orúkọ sọ ọmọ.
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: “Jòhánù” ni àkọsílẹ̀ orúkọ náà tí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní ọlá, tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn níbi tí ó yẹ. Ìtòlẹ́sẹẹsẹ “Jòhánù ni a ó pè é” tẹnu mọ́ orúkọ tí ìyá náà ń fi ṣe àtúnṣe, gẹ́gẹ́ bí Gíríìkì ṣe gbé Ἰωάννης sí òpin ọ̀rọ̀ fún ìtẹnumọ́.
