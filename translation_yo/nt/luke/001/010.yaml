id: LUK.1.10
reference: Luke 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: yo
  text: Gbogbo ọ̀pọ̀ ènìyàn náà sì ń gbàdúrà ní òde ní àkókò tí a ń rú tùràrí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò sísun tùràrí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: gbogbo ọ̀pọ̀ ènìyàn náà
  rationale: Ọ̀rọ̀ yìí fi hàn pé gbogbo àwọn ènìyàn púpọ̀ tí ó péjọ ni a ń sọ̀rọ̀ nípa wọn; ó pa ìtumọ̀ àpapọ̀ ẹgbẹ́ náà àti ọ̀pọ̀ wọn mọ́.
- source_word: τοῦ λαοῦ
  choice: ènìyàn
  rationale: Nínú àkópọ̀ ọ̀rọ̀ ‘ọ̀pọ̀ ènìyàn,’ èyí túmọ̀ λαός lọ́nà àdánidá láìfi ‘Ísírẹ́lì’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: προσευχόμενον
  choice: ń gbàdúrà
  rationale: Àkópọ̀ ἦν àti participle yìí ń tọ́ka sí ìṣe tí ó ń lọ lọ́wọ́; àmì ‘ń’ mú ìtumọ̀ náà jáde ní Yorùbá.
- source_word: ἔξω
  choice: ní òde
  rationale: Ó túmọ̀ sí pé wọ́n wà lóde, láìsọ ní pàtó pé ‘ní òde ibi mímọ́,’ èyí tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ.
- source_word: τῇ ὥρᾳ
  choice: ní àkókò
  rationale: Àkókò jẹ́ ọ̀nà Yorùbá àdánidá fún ὥρα níbí, ó sì lè tọ́ka sí àkókò ìjọsìn tí a yàn.
- source_word: τοῦ θυμιάματος
  choice: tí a ń rú tùràrí
  rationale: Ní àyíká tẹ́ńpìlì, θυμίαμα ń tọ́ka sí tùràrí gẹ́gẹ́ bí ohun ìjọsìn; ‘rú tùràrí’ sọ ìṣe ìsìn náà ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ọ̀rọ̀ ìjọsìn tẹ́ńpìlì nínú θυμίαμα
  choice: tí a ń rú tùràrí
  alternative: àkókò tùràrí
  rationale: Yíyan ‘rú tùràrí’ pa àyíká iṣẹ́ ìjọsìn tẹ́ńpìlì mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un; síbẹ̀, ọ̀rọ̀ náà fúnra rẹ̀ lè túmọ̀ sí tùràrí tàbí ìṣe sísun/rírú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Rú tùràrí’ bá èdè ìjọsìn mu, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà ìtumọ̀ ‘sísun tùràrí’ mọ́.
