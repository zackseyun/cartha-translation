  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ‘gbogbo ọ̀pọ̀ ènìyàn náà’ ń ṣàfihàn πᾶν τὸ πλῆθος, ‘ń gbàdúrà’ ń gbé ìṣe tí ó ń lọ lọ́wọ́ nínú ἦν ... προσευχόμενον jáde, ‘ní òde’ kò ṣàfikún ibi pàtó, àti ‘ní àkókò tí a ń rú tùràrí’ ń yẹ fún τῇ ὥρᾳ τοῦ θυμιάματος. Kò fi Ísírẹ́lì, ibi mímọ́, tàbí ìtumọ̀ ẹ̀sìn mìíràn kún un.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa tí ó ní ìgbọràn sí ọ̀nà ìsọ̀rọ̀ ìjọsìn, ó sì lóye. ‘Rú tùràrí’ jẹ́ ọ̀nà àdánidá fún iṣẹ́ ìjọsìn tí a ń tọ́ka sí níbí. ‘Gbogbo ọ̀pọ̀ ènìyàn náà’ jẹ́ ìtúmọ̀ tó sún mọ́ ìṣọ̀kan ẹgbẹ́ ńlá náà; bí ó tilẹ̀ jẹ́ pé a lè sọ ọ́ ní ọ̀nà mìíràn, kò nílò àtúnṣe fún ìdúróṣinṣin ìtumọ̀.
  terminology: ‘Gbàdúrà’ yẹ fún προσεύχομαι; ‘tùràrí’ àti ‘rú tùràrí’ yẹ fún θυμίαμα nínú àyíká tẹ́ńpìlì. Àlàyé ìsàlẹ̀ ojú ìwé náà ń pa àṣàyàn ‘sísun tùràrí’ mọ́ láìyí ìtumọ̀ àkọ́kọ́ padà.
