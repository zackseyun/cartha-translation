id: LUK.1.36
reference: Luke 1:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: yo
  text: Sì kíyèsí i, Elisabẹti ìbátan rẹ náà ti lóyún ọmọkùnrin ní ọjọ́ ogbó rẹ̀; èyí sì ni oṣù kẹfà fún ẹni tí a ń pè ní àgàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa ìpè láti fiyè sí ohun ìyanu tí áńgẹ́lì ń sọ mọ́, ní èdè Yorùbá àdánidá.
- source_word: συγγενίς
  choice: ìbátan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí obìnrin kan tí wọ́n jọ jẹ́ ìdílé; “ìbátan” kò fi irú ìbátan pàtó kan kún un.
- source_word: συνείληφεν υἱὸν
  choice: ti lóyún ọmọkùnrin
  rationale: Ó sọ ìṣẹ̀lẹ̀ oyún àti pé ọmọ náà jẹ́ akọ ní kedere, gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐν γήρει αὐτῆς
  choice: ní ọjọ́ ogbó rẹ̀
  rationale: Ìtumọ̀ àdánidá tí ó pa ìtọ́ka sí ọjọ́ ogbó Elisabẹti mọ́.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: ẹni tí a ń pè ní àgàn
  rationale: Ó pa ìtumọ̀ pé àwọn ènìyàn ń pè é bẹ́ẹ̀ mọ́, láìsọ pé àgàn jẹ́ ìdánimọ̀ rẹ̀ títí láé.
theological_decisions:
- issue: Bóyá a ó túmọ̀ ἰδού gẹ́gẹ́ bí ọ̀rọ̀ ìyàlẹ́nu tàbí kí a yọ ọ́ sílẹ̀
  choice: Pa á mọ́ gẹ́gẹ́ bí “Sì wò ó”
  alternative: “Kíyèsí i” tàbí yíyọ ọ́ sílẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ apá gidi ti orísun, ó sì ń pe Maria láti fiyè sí àmì yìí; “Sì wò ó” jẹ́ kedere láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé láti lóye. A kò sọ irú ìbátan Elisabẹti àti Maria ní pàtó nítorí orísun kò ṣe bẹ́ẹ̀.
