  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: yo
  text: sí wúńdíá kan tí a ti fẹ́sọ́nà fún ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jósẹ́fù, láti inú ilé Dáfídì; orúkọ wúńdíá náà sì ni Màríà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “Màríámù,” ìkọ̀wé-orúkọ tí ó sún mọ́ ìrísí Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: wúńdíá
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí wúńdíá ní àyíká ọ̀rọ̀ yìí, Lúùkù sì tún un lò nínú ẹsẹ̀ kan náà; “ọ̀dọ́bìnrin” nìkan kò ní fi ìtumọ̀ pàtàkì náà hàn kedere.
- source_word: ἐμνηστευμένην
  choice: tí a ti sọ ní àfẹ́sọ́nà
  rationale: Ó fi ipò àfẹ́sọ́nà tí a ti fìdí rẹ̀ múlẹ̀ hàn, kì í ṣe ìbáṣepọ̀ ìfẹ́ lásán, bẹ́ẹ̀ ni kò sọ pé ìgbéyàwó ti pé.
- source_word: ἀνδρὶ
  choice: fún ọkùnrin kan
  rationale: “Ọkùnrin” bá ipò àfẹ́sọ́nà mu láì sọ ju ohun tí ẹsẹ̀ náà sọ lọ pé ó ti di ọkọ rẹ̀ ní ẹ̀kúnrẹ́rẹ́.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: tí orúkọ rẹ̀ ń jẹ́ Jósẹ́fù
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìlànà fífi orúkọ hàn nínú Gíríìkì.
- source_word: ἐξ οἴκου Δαυίδ
  choice: láti inú ilé Dáfídì
  rationale: “Ilé Dáfídì” pa àwòrán ìdílé-ọba àti ìran tí ọ̀rọ̀ Gíríìkì ní mọ́; “láti inú” sì dúró fún ἐξ.
- source_word: Μαριάμ
  choice: Màríà
  rationale: Màríà ni ìrísí orúkọ náà tí ó ti wọ́pọ̀ jù lọ ní Yorùbá; àlàyé ìsàlẹ̀ fi ìkọ̀wé-orúkọ tí ó sún mọ́ Gíríìkì hàn.
theological_decisions:
- issue: Bóyá kí παρθένος fi ìtumọ̀ wúńdíá tí ó ṣe pàtàkì nínú ìtàn ìbí Lúùkù hàn
  choice: wúńdíá
  alternative: ọ̀dọ́bìnrin
  rationale: Ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ tọ́ka kedere sí wúńdíá; yíyan èyí pa ìtumọ̀ ẹsẹ̀ náà mọ́ láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Bóyá ἀνδρί yẹ kí ó jẹ́ “ọkọ” tàbí “ọkùnrin” ní ipò àfẹ́sọ́nà
  choice: ọkùnrin
  alternative: ọkọ
  rationale: Gíríìkì lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n pẹ̀lú ọ̀rọ̀ àfẹ́sọ́nà, “ọkùnrin” kò fi ìgbéyàwó tí ó ti pé sí inú ẹsẹ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ilé Dáfídì” pa èdè ìdílé-ọba inú ẹsẹ̀ náà mọ́, “tí a ti sọ ní àfẹ́sọ́nà” sì ṣàlàyé ipò òfin àti àwùjọ náà ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
