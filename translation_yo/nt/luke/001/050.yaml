  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: yo
  text: Àánú rẹ̀ sì ń wà fún àwọn tí ń bẹ̀rù rẹ̀ láti ìran dé ìran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti Gíríìkì, ó jẹ́ “sí àwọn ìran àti àwọn ìran,” èyí tó ń fi hàn pé àánú rẹ̀ ń bá a lọ ní gbogbo ìran tí ń tẹ̀ lé ara wọn.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn tí ń bẹ̀rù rẹ̀” túmọ̀ sí àwọn tí wọ́n ní ìbẹ̀rù tí ó kún fún ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run; a tún lè túmọ̀ rẹ̀ sí “àwọn tí ó bọ̀wọ̀ fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: àánú
  rationale: “Àánú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìṣe rere àti ìyọ́nú sí ẹni tí ó nílò rẹ̀; ó bá ìró orin Màríà mu láìfi ìtumọ̀ míì kún un.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: láti ìran dé ìran
  rationale: Ọ̀rọ̀ yìí sọ pé àánú Ọlọ́run ń bá a lọ káàkiri àwọn ìran tí ń tẹ̀ lé ara wọn. Bí ó tilẹ̀ jẹ́ pé εἰς túmọ̀ sí ìtẹ̀síwájú sí àwọn ìran, ọ̀nà àdáyébá Yorùbá “láti ìran dé ìran” mú ìtumọ̀ náà jáde dáadáa.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: fún àwọn tí ó bẹ̀rù rẹ̀
  rationale: Dátífù náà fi àwọn olùgbà àánú hàn, nítorí náà “fún” bá a mu. “Bẹ̀rù rẹ̀” pa àwòrán Bíbélì mọ́, ó sì lè ní ìtumọ̀ ìbẹ̀rù ọlọ́wọ̀ àti ọ̀wọ̀ jíjinlẹ̀ sí Ọlọ́run.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so gbólóhùn yìí mọ́ àwọn ọ̀rọ̀ orin tó ṣáájú, ó sì jẹ́ àdáyébá nínú Yorùbá.
- source_word: αὐτοῦ / αὐτόν
  choice: rẹ̀ / rẹ̀
  rationale: Àwọn arọ́pò-orúkọ méjèèjì tọ́ka sí Ọlọ́run gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn; Yorùbá kò ní yà akọ àti abo sọ́tọ̀ nínú wọn.
theological_decisions:
- issue: Ìtumọ̀ “bẹ̀rù” nígbà tí Ọlọ́run jẹ́ ẹni tí a bẹ̀rù
  choice: A lo “àwọn tí ó bẹ̀rù rẹ̀” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú ìtumọ̀ ìbẹ̀rù ọlọ́wọ̀ fún Ọlọ́run.
  alternative: àwọn tí ó bọ̀wọ̀ fún un
  rationale: φοβουμένοις lè tọ́ka sí ìbẹ̀rù tí ó ní ọ̀wọ̀, ìfọkànsìn, àti ìmọ̀ ìtóbi Ọlọ́run nínú rẹ̀. Fífi “bẹ̀rù” sílẹ̀ pa ìfihàn Bíbélì àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, láìdín in kù sí ẹ̀rù lásán.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. Àmì ohùn wà níbi tí ó bá jẹ́ àdáyébá. Ìtòlẹ́sẹẹsẹ gbólóhùn jẹ́ ti Yorùbá, ṣùgbọ́n ó pa ìbáṣepọ̀ láàárín àánú, àwọn olùgbà rẹ̀, àti bí ó ṣe ń bá a lọ láti ìran dé ìran mọ́.
