id: LUK.1.68
reference: Luke 1:68
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: yo
  text: “Olùbùkún ni Olúwa, Ọlọ́run Ísírẹ́lì, nítorí ó ti ṣèbẹ̀wò, ó sì ti mú ìràpadà wá fún àwọn ènìyàn rẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Olùbùkún ni
  rationale: Ó pa ìrísí ọ̀rọ̀ ìyìn àti ìbùkún mọ́, ó sì jẹ́ ọ̀nà àdánidá, ọlọ́lá láti sọ àsọyé àdúrà ìyìn ní Yorùbá.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni akọ́lé àtọwọ́dọ́wọ́ àti èdè Yorùbá tó ṣe kedere fún κύριος nígbà tí ó ń tọ́ka sí Ọlọ́run Ísírẹ́lì.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: Ọlọ́run Ísírẹ́lì
  rationale: Ó fi ìbáṣepọ̀ àfikún orúkọ sí ‘Olúwa’ hàn ní tààrà, ó sì pa ìró àwọn Ìwé Mímọ́ àtijọ́ mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí a fi ń yin Ọlọ́run hàn ní kedere àti ní èdè Yorùbá òde òní.
- source_word: ἐπεσκέψατο
  choice: ó ti bẹ àwọn ènìyàn rẹ̀ wò
  rationale: ‘Bẹ̀ … wò’ pa àwòrán ìbẹ̀wò Ọlọ́run mọ́, nígbà tí àfojúsùn rẹ̀ nínú àyíká ọ̀rọ̀—àwọn ènìyàn rẹ̀—mú gbólóhùn náà jẹ́ àdánidá ní Yorùbá.
- source_word: ἐποίησεν λύτρωσιν
  choice: ó sì ti mú ìràpadà wá
  rationale: Itumọ̀ gangan ‘ṣe ìràpadà’ lè le ní etí Yorùbá; ‘mú ìràpadà wá’ sọ ìṣe àti àbájáde rẹ̀ ní kedere láì dín agbára ọ̀rọ̀ náà kù.
- source_word: λύτρωσιν
  choice: ìràpadà
  rationale: Ó pa èrò ìdáǹdè pẹ̀lú iye ìtúsílẹ̀ àti ìwọ̀n ẹ̀kọ́ ìgbàlà inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῷ λαῷ αὐτοῦ
  choice: fún wọn / àwọn ènìyàn rẹ̀
  rationale: A sọ ẹni tí ìràpadà jẹ́ fún un ní ‘fún wọn,’ lẹ́yìn tí ‘àwọn ènìyàn rẹ̀’ ti farahàn gẹ́gẹ́ bí ẹni tí Ọlọ́run bẹ̀ wò; èyí yẹra fún àtúnsọ orúkọ tí kò ṣe pàtàkì, ó sì pa ìtumọ̀ dative oníjèrè mọ́.
theological_decisions:
- issue: Èdè ìbẹ̀wò Ọlọ́run
  choice: ó ti bẹ àwọn ènìyàn rẹ̀ wò
  alternative: ó ti wá ràn àwọn ènìyàn rẹ̀ lọ́wọ́
  rationale: A pa àkàwé ìbẹ̀wò inú Ìwé Mímọ́ mọ́, kí a má bàa tú u sí ìtumọ̀ ìrànlọ́wọ́ nìkan; nínú àyíká yìí, ó ń tọ́ka sí ìfarahàn Ọlọ́run láti gbà là.
- issue: Ìtumọ̀ λύτρωσις
  choice: ìràpadà
  alternative: ìdáǹdè
  rationale: ‘Ìràpadà’ pa ìró ìtúsílẹ̀ àti ìgbàlà tó wà nínú ọ̀rọ̀ náà mọ́; ‘ìdáǹdè’ ṣeé ṣe, ṣùgbọ́n ó lè pàdánù apá ìtumọ̀ ìràpadà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìró orin ìyìn àti àwòrán ìbẹ̀wò Ọlọ́run mọ́.
