id: LUK.1.35
reference: Luke 1:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: yo
  text: Áńgẹ́lì náà sì dá a lóhùn pé, “Ẹ̀mí Mímọ́ yóò bà lé ọ, agbára Ẹni Gíga Jùlọ yóò sì ṣíji bò ọ; nítorí náà, ẹni mímọ́ tí a ó bí[a] ni a ó pè ní Ọmọ Ọlọ́run[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọ tí a ó bí.” Gbólóhùn Gíríìkì τὸ γεννώμενον túmọ̀ ní tààràtà sí “ẹni tí a ń bí” tàbí “ohun tí a ń bí.”
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Ọlọ́run” túmọ̀ gbólóhùn Gíríìkì kan tí kò ní árítíkù níwájú “Ọmọ”; síbẹ̀, nínú àyíká yìí ó ṣiṣẹ́ gẹ́gẹ́ bí oyè pàtó, kì í ṣe pé ó túmọ̀ sí ọ̀kan lára ọ̀pọ̀ ọmọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dá a lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ‘dáhùn,’ ó sì pa ìtumọ̀ pé áńgẹ́lì ń fèsì sí Màríà mọ́.
- source_word: ἄγγελος
  choice: áńgẹ́lì
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà tọ́ka sí ońṣẹ́ ọ̀run, kì í ṣe ońṣẹ́ ènìyàn lásán.
- source_word: Πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Ó tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí olùṣe iṣẹ́ náà; ìkọ̀wé yìí jẹ́ èyí tí ó wọ́pọ̀, tí ó sì bójú mu ní Yorùbá.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: yóò bà lé ọ
  rationale: ‘Bà lé ọ’ sọ ìgbésẹ̀ alágbára tí wíwá Ẹ̀mí náà ní, ó sì sún mọ́ àwòrán èdè Gíríìkì.
- source_word: δύναμις Ὑψίστου
  choice: agbára Ẹni Gíga Jù Lọ
  rationale: Ó pa ìtumọ̀ oyè Ὑψίστου mọ́ gẹ́gẹ́ bí orúkọ ìyìn fún Ọlọ́run, dípò fífi í ṣe àpèjúwe lásán.
- source_word: ἐπισκιάσει
  choice: yóò ṣíji bò ọ
  rationale: Ó pa àwòrán òjìji àti wíwà Ọlọ́run mọ́ láìfi àlàyé nípa ìbálòpọ̀ tàbí bí ara ṣe ń ṣiṣẹ́ kún un.
- source_word: διὸ καὶ
  choice: nítorí náà
  rationale: Ó mú ìyọrísí ohun tí a ṣẹ̀ṣẹ̀ sọ jáde ní Yorùbá àdánidá; ipa ìfikún καὶ hàn nínú ìṣàn gbogbo gbólóhùn náà.
- source_word: τὸ γεννώμενον
  choice: ẹni ... tí a ó bí
  rationale: Ó pa ìtọ́ka sí ẹni tí a ó bí mọ́, ó sì yàgò fún ṣíṣe àlàyé ju ohun tí Gíríìkì sọ lọ. Àlàyé ìsàlẹ̀ fi ‘ọmọ tí a ó bí’ hàn gẹ́gẹ́ bí ìtumọ̀ àdánidá mìíràn.
- source_word: ἅγιον
  choice: ẹni mímọ́
  rationale: Àpèjúwe náà ní í ṣe pẹ̀lú ẹni tí a ó bí; ‘ẹni mímọ́’ mú agbára ọ̀rọ̀ náà hàn ní Yorùbá tó ṣe kedere.
- source_word: κληθήσεται
  choice: ni a ó pè ní
  rationale: Ó pa ìtumọ̀ pípè tàbí fífi orúkọ/oyè mọ ẹni kan mọ́, láìdín un kù sí orúkọ ara ẹni nìkan.
- source_word: υἱὸς θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Nínú àyíká ìkéde yìí, gbólóhùn náà ṣiṣẹ́ gẹ́gẹ́ bí oyè pàtó, kì í ṣe bí ọ̀kan lára ọ̀pọ̀ ọmọ Ọlọ́run.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Πνεῦμα ἅγιον gẹ́gẹ́ bí ìtọ́ka sí Ẹ̀mí Ọlọ́run
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àyíká Lúùkù fi Ẹ̀mí Ọlọ́run hàn gẹ́gẹ́ bí olùṣe ìgbésẹ̀ náà. Ìtumọ̀ náà kò sọ ọ́ di agbára aláìlẹ́ni-nínú lásán.
- issue: Agbára oyè inú υἱὸς θεοῦ láìsí árítíkù Gíríìkì
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ kan ti Ọlọ́run
  rationale: Àìsí árítíkù kò sọ gbólóhùn náà di aláìdájú. Nínú ìkéde yìí ó jẹ́ oyè Kristi, ṣùgbọ́n Yorùbá kò nílò ọ̀rọ̀ kan tó bá ‘the’ mu láti fi ìdájú yìí hàn.
- issue: Kí a má ṣe ṣàlàyé ìṣe Ọlọ́run ní ọ̀nà ti ara tàbí ti ìbálòpọ̀
  choice: yóò ṣíji bò ọ
  alternative: yóò fi agbára rẹ̀ lóyún ọ
  rationale: Gíríìkì lo àwòrán ọ̀rọ̀ ọlọ́wọ̀ àti oníyì; ìtumọ̀ náà pa ààlà yẹn mọ́, kò sì fi ẹ̀kọ́ nípa bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó ní àmì ohùn, tó níyì, tó sì yé òǹkàwé òde òní. A lo “ṣíji bò” láti pa àwòrán ìpilẹ̀ṣẹ̀ mọ́, a sì gbe àwọn àmì àlàyé [a] àti [b] sí ibi tí ọ̀kọ̀ọ̀kan wọn ń ṣàlàyé gan-an.
