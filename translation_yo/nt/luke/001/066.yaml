id: LUK.1.66
reference: Luke 1:66
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: yo
  text: Gbogbo àwọn tí ó gbọ́ sì fi èyí sí ọkàn wọn, wọ́n ń wí pé, “Kí ni ọmọ yìí yóò wá dà?”[a] Nítorí ọwọ́ Olúwa[b] wà pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni ọmọ yìí yóò jẹ́?” Ọ̀rọ̀ ìṣe Gíríìkì túmọ̀ ní tààrà sí “yóò jẹ́,” ṣùgbọ́n nínú àyíká ọ̀rọ̀, ìbéèrè náà dá lórí ohun tí ọmọ náà yóò dà tàbí ipa tí yóò ní lọ́jọ́ iwájú.
    reason: lexical_alternative
  - marker: b
    text: “Ọwọ́ Olúwa” jẹ́ àkànlò èdè Bíbélì fún agbára, ojú rere, tàbí ìtọ́sọ́nà Ọlọ́run tó ń ṣiṣẹ́.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: fi èyí sí ọkàn wọn
  rationale: Ó pa àwòrán Gíríìkì náà mọ́—fífi ohun kan sínú ọkàn—ó sì ń sọ ìrántí àti àṣàrò tí a mọ̀ọ́mọ̀ ṣe, kì í ṣe ìmọ̀lára ojú-ẹsẹ̀ nìkan.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Gbogbo àwọn tí ó gbọ́
  rationale: Gbólóhùn alápartisípu náà tọ́ka sí gbogbo àwọn ènìyàn tí wọ́n gbọ́ nípa àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; ‘èyí’ mú ohun tí wọ́n gbọ́ yé kedere láìṣe àfikún ìtumọ̀ tuntun.
- source_word: Τί ἄρα
  choice: Kí ni ... yóò wá
  rationale: Ọ̀rọ̀ ‘wá’ nínú ìbéèrè Yorùbá fi ìtumọ̀ àbájáde tàbí ohun tí yóò tẹ̀ lé hàn, bí ἄρα ṣe ń ṣe nínú Gíríìkì.
- source_word: τὸ παιδίον τοῦτο
  choice: ọmọ yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, kò sì fi ọjọ́-orí tàbí ipò ọmọ náà kún ohun tí Gíríìkì sọ.
- source_word: ἔσται
  choice: yóò ... dà
  rationale: Bó tilẹ̀ jẹ́ pé ìṣe Gíríìkì náà túmọ̀ ní tààrà sí ‘yóò jẹ́,’ àyíká ọ̀rọ̀ ń béèrè nípa ohun tí ọmọ náà yóò dà tàbí ipa rẹ̀ lọ́jọ́ iwájú. ‘Yóò wá dà’ jẹ́ ìbéèrè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: Àpapọ̀ ọ̀rọ̀ náà ń ṣàlàyé ìdí tí ìbéèrè àwọn ènìyàn fi jẹ́ ohun tó yẹ; ‘Nítorí’ sọ ìbáṣepọ̀ yìí ní kedere àti ní ṣókí.
- source_word: χεὶρ κυρίου
  choice: ọwọ́ Olúwa
  rationale: A pa àkànlò èdè Bíbélì tó ń tọ́ka sí agbára, ojú rere, tàbí ìtọ́sọ́nà Ọlọ́run mọ́, dípò yíyan ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí.
- source_word: κυρίου
  choice: Olúwa
  rationale: Níhìn-ín κύριος ń tọ́ka sí Ọlọ́run; ‘Olúwa’ jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí ó bójú mu ní Yorùbá Bíbélì.
- source_word: μετ’ αὐτοῦ
  choice: wà pẹ̀lú rẹ̀
  rationale: μετά pẹ̀lú ọ̀rọ̀ inú ẹ̀ka genitive túmọ̀ sí ‘pẹ̀lú’; arọ́pò-orúkọ náà tọ́ka sí ọmọ náà láìfi irú iṣẹ́ Ọlọ́run kan pàtó kún un.
theological_decisions:
- issue: Ìtumọ̀ àkànlò èdè ‘ọwọ́ Olúwa wà pẹ̀lú rẹ̀’
  choice: Pa àwòrán ‘ọwọ́ Olúwa’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ nípa agbára, ojú rere, tàbí wíwà Ọlọ́run pẹ̀lú ọmọ náà, láìsọ ọ̀kan nínú wọn di ìtumọ̀ kan ṣoṣo.
  alternative: Olúwa ń ràn án lọ́wọ́; agbára Ọlọ́run wà lórí rẹ̀.
  rationale: Ọ̀rọ̀ náà fi hàn pé Ọlọ́run ń ṣiṣẹ́ nínú ìgbésí ayé ọmọ náà, ṣùgbọ́n kò sọ bóyá ààbò, agbára, ojú rere, tàbí gbogbo wọn ni pàtó. Pípa àkànlò náà mọ́ kò jẹ́ kí ìtumọ̀ ré kọjá ẹ̀rí ọ̀rọ̀.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘Fi èyí sí ọkàn wọn’ pa àwòrán orísun mọ́; ‘yóò wá dà’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè nípa ọjọ́ iwájú ọmọ náà. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
