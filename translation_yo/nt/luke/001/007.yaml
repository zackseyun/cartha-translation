reference: Luke 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: yo
  text: Wọ́n kò sì ní ọmọ, nítorí Elisabeti jẹ́ àgàn, àwọn méjèèjì sì ti dàgbà gan-an ní ọjọ́ orí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “wọ́n ti lọ síwájú nínú ọjọ́ wọn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: ọmọ
  rationale: Ọ̀rọ̀ náà wà ní ẹyọ kan, “ọmọ” sì jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọmọ tàbí irú-ọmọ láìfi púpọ̀ kún ìtumọ̀ Gíríìkì.
- source_word: καθότι
  choice: nítorí
  rationale: Ó ń ṣàlàyé ìdí tí wọn kò fi ní ọmọ; “nítorí” jẹ́ àsopọ̀ okùnfà tó ṣe kedere ní Yorùbá òde òní.
- source_word: στεῖρα
  choice: jẹ́ àgàn
  rationale: “Àgàn” ń tọ́ka sí àìlèbímọ, kì í ṣe ipò àìní ọmọ lásán; ó tipa bẹ́ẹ̀ pa ìyàtọ̀ tó wà láàárín okùnfà àti àbájáde mọ́.
- source_word: ἀμφότεροι
  choice: àwọn méjèèjì
  rationale: Ó tẹnu mọ́ ọn pé ọ̀rọ̀ nípa ọjọ́ orí kan Sekaráyà àti Elisabeti papọ̀.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: ti dàgbà ní ọjọ́ orí
  rationale: Èyí túmọ̀ sí pé ọjọ́ orí wọn ti lọ sókè. Gbólóhùn Yorùbá yìí jẹ́ ọ̀wọ̀, ó sì tún pa àwòrán “ọjọ́” inú ọ̀rọ̀ Gíríìkì mọ́ dé ìwọ̀n tó bá àdánidá mu.
- source_word: οὐκ ἦν αὐτοῖς
  choice: wọn kò sì ní
  rationale: Gíríìkì sọ ní tààrà pé “kò sí fún wọn,” ṣùgbọ́n Yorùbá máa ń lo ọ̀rọ̀ ohun-ìní “wọn kò ní” fún ìtumọ̀ yìí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá tí ó ṣe kedere, tí ó ní iyì, tí ó sì bá ọ̀rọ̀ ìtàn mu. “Àgàn” jẹ́ ọ̀rọ̀ kúkúrú tí a mọ̀ dáadáa fún àìlèbímọ, bí ó tilẹ̀ jẹ́ pé ó yẹ kí a ka a pẹ̀lú ìfọ̀rọ̀rora. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn ọjọ́ orí, níbi tí àlàyé náà ti jẹ mọ́.
