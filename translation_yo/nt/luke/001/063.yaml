id: LUK.1.63
reference: Luke 1:63
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: yo
  text: Ó sì béèrè fún pátákó ìkọ̀wé kan[a], ó kọ̀wé pé, “Jòhánù ni orúkọ rẹ̀.” Ẹnu sì ya gbogbo wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó rọrùn síi, “orúkọ rẹ̀ ni Jòhánù.” Gíríìkì náà sọ ní tààrà pé, “Jòhánù ni orúkọ rẹ̀,” èyí tí ó tẹnumọ́ ìmúdájú Sekaráyà nípa orúkọ tí Ọlọ́run fi fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτήσας
  choice: ó sì béèrè fún
  rationale: Ọ̀rọ̀ alábápín aorist náà fi hàn pé ó kọ́kọ́ béèrè fún pátákó náà kí ó tó kọ̀wé; ìtẹ̀lé àwọn ìṣe náà ṣe kedere nínú Yorùbá láìfi ọ̀rọ̀ kún un ju bó ṣe yẹ lọ.
- source_word: πινακίδιον
  choice: pátákó ìkọ̀wé kan
  rationale: Ó tọ́ka sí pátákó kékeré tí a fi ń kọ̀wé; àfikún “ìkọ̀wé” mú iṣẹ́ rẹ̀ ṣe kedere fún òǹkàwé òde òní.
- source_word: ἔγραψεν λέγων
  choice: ó kọ̀wé pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàfihàn ohun tí a kọ, ó sì pa ìtumọ̀ ἔγραψεν àti iṣẹ́ ìṣàfihàn λέγων mọ́ láìsọ ọ́ di líle.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Jòhánù ni orúkọ rẹ̀
  rationale: Ìṣètò yìí gbé orúkọ “Jòhánù” síwájú gẹ́gẹ́ bí Gíríìkì, ó sì tẹnumọ́ ìmúdájú Sekaráyà pé orúkọ ọmọ náà ti jẹ́ Jòhánù.
- source_word: ἐθαύμασαν πάντες
  choice: Gbogbo wọn sì yà á lẹ́nu
  rationale: Gbólóhùn Yorùbá yìí sọ ìyàlẹ́nu gbogbo àwọn tó wà níbẹ̀ jáde lọ́nà àdánidá, ó sì pa ìtẹnumọ́ πάντες mọ́.
theological_decisions:
- issue: Bóyá gbólóhùn orúkọ náà túmọ̀ sí ohun tó wà nísinsìnyí tàbí ìpinnu ọjọ́ iwájú
  choice: “Jòhánù ni orúkọ rẹ̀”
  alternative: “Jòhánù ni orúkọ rẹ̀ yóò jẹ́”
  rationale: Ọ̀rọ̀ Gíríìkì lo ìṣe ìsinsìnyí ἐστίν, kì í ṣe ọ̀nà ọjọ́ iwájú; ìtumọ̀ yìí kò sì sọ ọ́ di àsọtẹ́lẹ̀ tàbí ìpinnu tuntun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ìtàn mímọ́ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “Jòhánù” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ Bíbélì tó wọ́pọ̀ ní Yorùbá.
