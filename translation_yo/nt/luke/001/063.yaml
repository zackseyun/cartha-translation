  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: αἰτήσας ṣáájú ἔγραψεν, πινακίδιον jẹ́ pátákó ìkọ̀wé, àti ìtẹnumọ́ nínú “Jòhánù ni orúkọ rẹ̀” ni a pa mọ́. Ṣùgbọ́n gbolohun ìkẹyìn nínú àwòkọṣe náà yí ipa olùṣe àti ẹni tí ìṣẹ̀lẹ̀ kan sí pa dà.'
  naturalness: “Gbogbo wọn sì yà á lẹ́nu” túmọ̀ ní ìlò Yorùbá déédéé sí pé gbogbo wọn ni ó ṣe é/ẹni kan lẹ́nu; kò túmọ̀ sí pé ẹnu ya gbogbo wọn. “Ẹnu sì ya gbogbo wọn” jẹ́ ìlò àdánidá, ó sì fi ìyàlẹ́nu wọn hàn kedere.
  terminology: “Pátákó ìkọ̀wé” àti “Jòhánù” bá ìlò Yorùbá Bíbélì boṣewa mu. A fi àlàyé abẹ́lẹ̀ sí pátákó ìkọ̀wé gẹ́gẹ́ bí àkọsílẹ̀ Gẹ̀ẹ́sì.
  issues:
