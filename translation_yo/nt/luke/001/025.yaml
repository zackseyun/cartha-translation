id: LUK.1.25
reference: Luke 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: yo
  text: “Nítorí báyìí ni Olúwa ti ṣe fún mi ní àwọn ọjọ́ tí ó bojú wò mi, láti mú ẹ̀gàn mi[a] kúrò láàárín àwọn ènìyàn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àbùkù mi” tàbí “ìtìjú mi.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ẹ̀gàn tàbí àìgbọ́wọ̀ ní ojú àwùjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó lè ṣàlàyé ohun tí Elisabeti sọ tàbí ìdí rẹ̀; ‘Nítorí’ bá ọ̀rọ̀ inú àyíká ẹsẹ náà mu lọ́nà àdánidá.
- source_word: Οὕτως μοι πεποίηκεν
  choice: báyìí ni ... ṣe fún mi
  rationale: Èyí pa ìtẹnumọ́ ọ̀nà tí Olúwa gbà ṣe iṣẹ́ rẹ̀ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè tí Yorùbá máa ń lò fún Ọlọ́run ni àyíká yìí, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἐν ἡμέραις αἷς
  choice: ní àwọn ọjọ́ tí
  rationale: Ó tẹ̀lé àkójọpọ̀ ọ̀rọ̀ àkókò inú Gíríìkì, ó sì ṣàn dáadáa ní Yorùbá.
- source_word: ἐπεῖδεν
  choice: ó bojú wo mi
  rationale: ‘Bojú wo’ pa àwòrán wíwo pẹ̀lú àkíyèsí àti ojú rere mọ́; ‘mi’ ni a mú wá láti inú àyíká ọ̀rọ̀.
- source_word: ἀφελεῖν
  choice: láti mú ... kúrò
  rationale: Ó fi ète tàbí àbájáde iṣẹ́ Olúwa hàn ní kedere, bí infinitive Gíríìkì ṣe rí.
- source_word: ὄνειδός μου
  choice: ẹ̀gàn mi
  rationale: ‘Ẹ̀gàn’ tẹnumọ́ àbùkù tàbí àìbọ̀wọ̀ tí ń wá láti ọ̀dọ̀ àwùjọ, kì í ṣe ìmọ̀lára ìtìjú inú ọkàn nìkan.
- source_word: ἐν ἀνθρώποις
  choice: láàárín àwọn ènìyàn
  rationale: Ó ṣàfihàn àyíká àwùjọ tí ẹ̀gàn náà ti wà, ó sì jẹ́ ọ̀rọ̀ tí kò dá sí akọ tàbí abo.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa, ìyẹn Ọlọ́run
  alternative: Kò sí ìtumọ̀ pàtàkì mìíràn nínú àyíká yìí
  rationale: Elisabeti ń sọ̀rọ̀ nípa iṣẹ́ Ọlọ́run láti mú àìlóbìí rẹ̀ àti ẹ̀gàn tó bá a rìn kúrò; a kò fi ìtumọ̀ Kristoloji tó dín kù kún àyíká náà.
- issue: Ìtumọ̀ àwùjọ ti ὄνειδος
  choice: ẹ̀gàn mi
  alternative: àbùkù mi; ìtìjú mi
  rationale: Àyíká náà jẹ́ ti àìlóbìí gẹ́gẹ́ bí ohun tí àwùjọ fi ń kẹ́gàn ẹni. ‘Ẹ̀gàn’ dá abala ìbáṣepọ̀ àti àìbọ̀wọ̀ àwùjọ dúró láìsọ ọ́ di ìmọ̀lára inú ọkàn nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ; ìṣètò gbólóhùn náà pa ìtẹnumọ́ ‘Οὕτως’ àti àwòrán ‘wíwo’ inú ἐπεῖδεν mọ́.
