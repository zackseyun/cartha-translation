id: LUK.1.61
reference: Luke 1:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Kò sí ẹnì kankan nínú àwọn ìbátan rẹ tí a ń pè ní orúkọ yìí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: wọ́n sọ fún un
  rationale: Pẹ̀lú ọ̀rọ̀ sísọ, πρός + accusative tọ́ka sí ẹni tí a ń bá sọ̀rọ̀; “sọ fún un” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ náà hàn láìfi ìtumọ̀ àṣẹ tàbí ìtọ́nisọ́nà kún un.
- source_word: Οὐδείς ἐστιν
  choice: kò sí ẹnì kankan
  rationale: Èyí fi ìṣèní kúrò pátápátá hàn ní Yorùbá àdánidá, ó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐκ τῆς συγγενείας σου
  choice: nínú àwọn ìbátan rẹ
  rationale: συγγένεια ń tọ́ka sí àwọn ẹni tí ìbátan ẹ̀jẹ̀ tàbí ìdílé so pọ̀; “àwọn ìbátan rẹ” ṣe kedere sí òǹkàwé Yorùbá òde òní, “nínú” sì mú ìtumọ̀ partitive ἐκ jáde.
- source_word: ὃς καλεῖται
  choice: tí a ń pè
  rationale: Ìṣe lọwọlọwọ aláìsọ ẹni tó ń ṣe é ní Gíríìkì túmọ̀ sí ẹni tí a mọ̀ sí orúkọ kan; “tí a ń pè” jẹ́ ìfihàn Yorùbá tó ṣe déédé.
- source_word: τῷ ὀνόματι τούτῳ
  choice: ní orúkọ yìí
  rationale: “Ní orúkọ yìí” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi orúkọ tí a ń pè ènìyàn hàn, “yìí” sì pa ìtọ́kasí τούτῳ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti ìtàn, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ìbátan” dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tó lè dín συγγένεια kù sí agbo ilé nìkan.
