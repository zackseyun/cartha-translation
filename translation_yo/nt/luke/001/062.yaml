    rationale: A tún kọ ọ́ sí ìtumọ̀ tó sún mọ́ ìṣètò Gíríìkì, nígbà tí a fi “orúkọ wo” hàn gẹ́gẹ́ bí àlàyé tí ọ̀rọ̀ “pe” ń béèrè nínú Yorùbá.
