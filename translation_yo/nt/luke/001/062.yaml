  rationale: Àtúnṣe náà yọ ìdí ìṣe tí a fi kún un (“láti mọ”) kúrò, ó sì jẹ́ kí ìbéèrè tí ìṣe ṣíṣe àmì náà ń tọ́ka sí hàn ní tààrà. “Orúkọ wo” jẹ́ ìtúmọ̀ àlàyé tí ó dára ní Yorùbá nítorí ọ̀rọ̀ “pe ọmọ náà”; àlàyé ìsàlẹ̀ sì ń pa ìṣètò “ohun tí ó lè fẹ́” tí ó sún mọ́ Gíríìkì mọ́.
