  source_fidelity: Àfikún “láti mọ” tú ìbéèrè aláìtààrà Gíríìkì náà sí ìdí ìṣe tí a kò sọ ní tààrà. Gbólóhùn tí a tún ṣe ń fi ohun tí wọ́n fi àmì béèrè hàn ní tààrà, ó sì pa àìdájú pẹ̀lẹ́ ti ἂν θέλοι mọ́ nínú “ó fẹ́.”
  naturalness: “Wọ́n sì ṣe àmì sí baba rẹ̀ pé orúkọ wo ni ó fẹ́ kí a pe ọmọ náà” jẹ́ Yorùbá boṣewa tí ó dára, tí ó sì ṣàlàyé ìbéèrè náà ní ti ẹ̀dá. Yíyọ “máa” kúrò máa yẹra fún ìtumọ̀ ìṣe àtúnlò tí Gíríìkì kò béèrè fún.
  terminology: “Ṣe àmì sí” bá ἐνένευον mu dáadáa. “Kí a pe ọmọ náà” jẹ́ ọ̀nà Yorùbá àìsọ ẹni tí ó lè ṣojú fún infinitive pàsífù καλεῖσθαι, láì fi ẹ̀kọ́ ìsìn kankan kún un.
  issues:
