    rationale: Ọ̀rọ̀ náà ń mú ‘láti wádìí/ láti rí mọ́’ wá gẹ́gẹ́ bí ète ìṣe. Ìtumọ̀ Gíríìkì náà ń ṣàfihàn ohun tí wọ́n ṣe àmì rẹ̀—ìbéèrè pé kí ni Sakaraya fẹ́ kí a pe ọmọ náà—kì í sọ ète náà ní tààrà.
  - severity: low
    issue: “kí a máa pe”
    rationale: “Máa” lè fi ìṣe ìtẹ̀síwájú tàbí àtúnlò kún un. Infinitive Gíríìkì náà nílò ìtumọ̀ “kí a pe” lásán.
  - severity: low
