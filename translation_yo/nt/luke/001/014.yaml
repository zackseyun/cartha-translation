  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: yo
  text: Ìwọ yóò ní ayọ̀ àti ìdùnnú ńlá, ọ̀pọ̀ ènìyàn sì yóò yọ̀ nígbà ìbí rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “... ọ̀pọ̀ ènìyàn sì yóò yọ̀ nítorí ìbí rẹ̀.” Gbólóhùn Gíríìkì náà lè tọ́ka sí àkókò ayọ̀ náà tàbí ìdí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται ... σοι
  choice: Ìwọ yóò ní
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ní ti gidi ni pé ayọ̀ yóò wà fún Sekaráyà; ọ̀nà yìí jẹ́ Yorùbá àdánidá tó sì pa ìtumọ̀ ẹni tí ayọ̀ náà jẹ́ tirẹ̀ mọ́.
- source_word: χαρά
  choice: ayọ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ìmọ̀lára inú dídùn.
- source_word: ἀγαλλίασις
  choice: ìdùnnú ńlá
  rationale: Ó fi ìdùnnú ayẹyẹ tó lágbára hàn, ó sì yà á díẹ̀ sí 'ayọ̀' láìlo ọ̀rọ̀ àjèjì.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ nínú Gíríìkì; fífi 'ènìyàn' kún un jẹ́ kó ṣe kedere, kó sì dún bí Yorùbá àdánidá.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: nígbà ìbí rẹ̀
  rationale: ἐπί pẹ̀lú dative lè tọ́ka sí àkókò tàbí ìṣẹ̀lẹ̀ tó mú ayọ̀ wá; 'nígbà ìbí rẹ̀' pa ìtumọ̀ àkókò/àyẹ̀wò náà mọ́.
- source_word: χαρήσονται
  choice: yóò yọ̀
  rationale: Ọ̀rọ̀-ìṣe Yorùbá yìí bá χαίρω mu, ó sì pa ìbátan rẹ̀ pẹ̀lú χαρά ('ayọ̀') mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐπὶ τῇ γενέσει αὐτοῦ
  choice: nígbà ìbí rẹ̀
  alternative: nítorí ìbí rẹ̀
  rationale: Gíríìkì lè fi ìbí náà hàn gẹ́gẹ́ bí àkókò/ìṣẹ̀lẹ̀ ayọ̀ tàbí gẹ́gẹ́ bí ìdí ayọ̀. A yan ìtumọ̀ àkókò tó gbooro síi, a sì tọ́ka sí ìtumọ̀ ìdí nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye.
