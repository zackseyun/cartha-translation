id: LUK.1.13
reference: Luke 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: yo
  text: Ṣùgbọ́n áńgẹ́lì náà sọ fún un pé, “Má bẹ̀rù, Sakaria, nítorí a ti gbọ́ àdúrà rẹ[a]. Elisabẹti aya rẹ yóò bí ọmọkùnrin kan fún ọ, ìwọ yóò sì sọ orúkọ rẹ̀ ní Johanu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bẹ̀ rẹ.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ìwọ yóò pe orúkọ rẹ̀ ní Johanu”; èyí túmọ̀ sí pé ìwọ yóò sọ ọmọ náà ní Johanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ṣùgbọ́n ... sọ
  rationale: δέ jẹ́ àsopọ̀ ọ̀rọ̀ tí kò lágbára; “Ṣùgbọ́n” fi ìyípadà kékeré láti inú ìbẹ̀rù Sekaráyà sí ọ̀rọ̀ áńgẹ́lì hàn láìsọ ìtakora di ohun tó lágbára jù.
- source_word: ὁ ἄγγελος
  choice: áńgẹ́lì náà
  rationale: Nínú ìtàn yìí, ἄγγελος tọ́ka sí ìránṣẹ́ ọ̀run; “áńgẹ́lì” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yé ni kedere.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti tààrà fún ìfòfindè náà, ó sì bá ìbẹ̀rù Sekaráyà mu.
- source_word: Ζαχαρία
  choice: Sekaráyà
  rationale: A lo ìrísí orúkọ tí ó wọ́pọ̀ nínú èdè Yorùbá, pẹ̀lú àmì ohùn.
- source_word: διότι
  choice: nítorí
  rationale: Ọ̀rọ̀ náà ṣàlàyé ìdí tí Sekaráyà kò fi gbọdọ̀ bẹ̀rù.
- source_word: εἰσηκούσθη
  choice: a ti gbọ́
  rationale: Ìtumọ̀ àìdárúkọ ẹni tó ṣe iṣẹ́ náà pa passive inú Gíríìkì mọ́; ó jẹ́ kí a lóye pé Ọlọ́run ló gbọ́ àdúrà náà láìfi orúkọ rẹ̀ kún ẹsẹ̀.
- source_word: ἡ δέησίς σου
  choice: àdúrà rẹ
  rationale: δέησις túmọ̀ sí ẹ̀bẹ̀ tàbí ìbéèrè takuntakun tí a gbà sí Ọlọ́run; “àdúrà” jẹ́ ọ̀rọ̀ àdánidá fún gbogbo ènìyàn, a sì fi ìtumọ̀ tó ṣe pàtó sí àlàyé ìsàlẹ̀.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: Elisabẹti aya rẹ
  rationale: Pẹ̀lú σου àti àyíká ìgbéyàwó, γυνή túmọ̀ sí “aya,” kì í ṣe “obìnrin” lásán.
- source_word: γεννήσει υἱόν σοι
  choice: yóò bí ọmọkùnrin kan fún ọ
  rationale: Pẹ̀lú obìnrin gẹ́gẹ́ bí olùṣe, γεννάω túmọ̀ sí bíbí ọmọ; “fún ọ” fi dative σοι hàn ní ọ̀nà Yorùbá tó rọrùn.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: ìwọ yóò sì pe orúkọ rẹ̀ ní Johanu
  rationale: Ìtumọ̀ yìí pa àkànṣe gbolohun Gíríìkì náà mọ́, síbẹ̀ ó ṣì jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye; ó tún fi ìtẹnumọ́ ẹni kejì inú fọ́ọ̀mù ọ̀rọ̀-ìṣe hàn nípasẹ̀ “ìwọ.”
- source_word: Ἰωάννην
  choice: Johanu
  rationale: “Johanu” ni ìrísí orúkọ Ἰωάννης tí ó ti fìdí múlẹ̀ nínú lílo Bíbélì Yorùbá.
theological_decisions:
- issue: Ẹni tí ó gbọ́ àdúrà nínú passive εἰσηκούσθη
  choice: 'A fi ẹni náà sílẹ̀ láìdárúkọ gẹ́gẹ́ bí Gíríìkì: “a ti gbọ́ àdúrà rẹ.”'
  alternative: “Ọlọ́run ti gbọ́ àdúrà rẹ.”
  rationale: Àyíká àdúrà Júù fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ó gbọ́, ṣùgbọ́n orísun kò dárúkọ rẹ̀ níbí. Ìtumọ̀ yìí pa ìtumọ̀ iṣẹ́ Ọlọ́run mọ́ láìsọ ohun tí ọrọ̀ náà kò sọ ní tààrà.
- issue: Agbára ọ̀rọ̀ ọjọ́ iwájú καλέσεις nínú àṣẹ fífi orúkọ sọ ọmọ
  choice: “ìwọ yóò sì pe orúkọ rẹ̀”
  alternative: “ìwọ gbọdọ̀ sọ ọ́ ní Johanu”
  rationale: Fọ́ọ̀mù náà lè ṣiṣẹ́ gẹ́gẹ́ bí ìkéde ohun tí yóò ṣẹlẹ̀, tó sì tún ní agbára ìtọ́sọ́nà nínú àyíká ìkéde yìí. “Yóò” pa ìṣòro ìtumọ̀ méjèèjì mọ́ ju “ọdọ̀ rẹ ni” tàbí “gbọ́dọ̀” lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A yan “aya,” “bí ọmọkùnrin,” àti “pe orúkọ” láti pa ìṣètò àti ìwọ̀n ọ̀rọ̀ orísun mọ́ láìjẹ́ kí gbolohun di àjèjì.
