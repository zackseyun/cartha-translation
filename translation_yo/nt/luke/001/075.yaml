source:
  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: yo
  text: ní ìwà mímọ́ àti òdodo[a] níwájú rẹ̀ ní gbogbo ọjọ́ wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: ní
  rationale: “Ní” fi hàn pé ìwà mímọ́ àti òdodo ni ipò tàbí ọ̀nà tí iṣẹ́ ìsìn náà yóò gbà wáyé, ó sì bá ètò Gíríìkì mu lọ́nà àdánidá ní Yorùbá.
- source_word: ὁσιότητι
  choice: ìwà mímọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwà tí a yà sọ́tọ̀ fún Ọlọ́run àti ìfọkànsìn ẹni sí i; “ìwà mímọ́” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì yàtọ̀ sí òdodo.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ rọ́rọ́ tó so àwọn ọ̀rọ̀ orúkọ méjèèjì pọ̀.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” lè sọ ìwà títọ́ níwájú Ọlọ́run, ó sì bá ìṣọ̀kan rẹ̀ pẹ̀lú “ìwà mímọ́” mu. A pa ìtumọ̀ tó lè jẹ́ ìdájọ́ òdodo mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐνώπιον αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún wíwà ní ojú Ọlọ́run tàbí níwájú rẹ̀, tó sì pa ìtumọ̀ ìbáṣepọ̀ àti ìdánilẹ́kọ̀ọ́ rẹ̀ mọ́.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: ní gbogbo ọjọ́ wa
  rationale: Gbólóhùn yìí pa àwòrán “gbogbo ọjọ́ wa” inú Gíríìkì mọ́, ó sì túmọ̀ sí gbogbo ìgbà ayé wa láìfi ọ̀rọ̀ “ayé” tí kò sí ní tààrà sínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká ìwà rere tí kì í ṣe ti Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Níbi yìí, ọ̀rọ̀ náà dúró lẹ́gbẹ̀ẹ́ “ìwà mímọ́,” ó sì ṣàpèjúwe ìwà títọ́ níwájú Ọlọ́run. “Òdodo” pa ìtumọ̀ yẹn mọ́ dáadáa, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tó ní í ṣe pẹ̀lú ìdájọ́ òdodo tún ṣeé ṣe.
translation_notes:
  register: Yorùbá ìpele àárín tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ àjẹkù tó ń tẹ̀ síwájú láti ẹsẹ tó ṣáájú, gẹ́gẹ́ bí orísun Gíríìkì.
