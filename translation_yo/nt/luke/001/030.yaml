id: LUK.1.30
reference: Luke 1:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: yo
  text: Áńgẹ́lì náà sì sọ fún un pé, “Má bẹ̀rù, Màríà, nítorí o ti rí ojú rere[a] lọ́dọ̀ Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “oore-ọ̀fẹ́.” Ọ̀rọ̀ orúkọ Gíríìkì χάρις lè túmọ̀ sí “oore-ọ̀fẹ́” tàbí “ojú rere”; ṣùgbọ́n nínú àṣà-ọrọ “rí ojú rere lọ́dọ̀ Ọlọ́run,” “ojú rere” bá ọ̀rọ̀ ibí yìí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sọ fún un pé
  rationale: Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá fún fífi ọ̀rọ̀ tààrà hàn, ó sì bá ìṣe ìtàn ti aorist λέγω mu.
- source_word: ἄγγελος
  choice: áńgẹ́lì
  rationale: Nínú àyíká ìtàn ìbí ní Lúùkù, ẹni tí a ń tọ́ka sí jẹ́ ẹ̀dá ọ̀run, nítorí náà “áńgẹ́lì” ṣe pàtó ju “ońṣẹ́” lọ.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Ó jẹ́ ìfòfindè tààrà, ó sì jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe déédéé láti sọ pé kí ẹnì kan má ṣe bẹ̀rù.
- source_word: Μαριάμ
  choice: Màríà
  rationale: A lo ìkọ̀wé orúkọ tí ó wọ́pọ̀, tí ó sì rọrùn fún àwọn òǹkàwé Yorùbá.
- source_word: εὗρες
  choice: o ti rí
  rationale: “Ti rí” fi ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ àti ipò rẹ̀ tí ó ṣì wà nísinsìnyí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: χάριν
  choice: ojú rere
  rationale: Nínú àpólà εὗρες χάριν, “rí ojú rere” jẹ́ àṣà-ọrọ Yorùbá tí ó mú ìtumọ̀ ojú rere tàbí ìtẹ́wọ́gbà jáde, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé ọ̀rọ̀ náà lórí.
- source_word: παρὰ τῷ θεῷ
  choice: lọ́dọ̀ Ọlọ́run
  rationale: “Lọ́dọ̀ Ọlọ́run” bá ìbáṣepọ̀ tí παρά pẹ̀lú dative ń fi hàn mu, ó sì jẹ́ èdè Yorùbá àdánidá nínú àpólà “rí ojú rere lọ́dọ̀.”
theological_decisions:
- issue: Bí a ṣe túmọ̀ χάριν nínú ọ̀rọ̀ tí a sọ fún Màríà
  choice: ojú rere
  alternative: oore-ọ̀fẹ́
  rationale: Àpólà εὑρίσκω χάριν παρά + dative jẹ́ àṣà-ọrọ fún “rí ojú rere lọ́dọ̀.” Yíyan “ojú rere” pa ìtumọ̀ ìbáṣepọ̀ inú Gíríìkì mọ́, kò sì gbé ìtumọ̀ ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn wọ inú ẹsẹ̀ náà; àṣàyàn “oore-ọ̀fẹ́” wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ó jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “sọ fún un pé” fún ọ̀rọ̀ tààrà àti “Má bẹ̀rù” gẹ́gẹ́ bí ìfòfindè àdánidá.
