id: LUK.1.18
reference: Luke 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: yo
  text: Sekaráyà sì sọ fún áńgẹ́lì náà pé, “Báwo ni èmi yóò ṣe mọ èyí? Nítorí ọkùnrin arúgbó ni mí, aya mi sì ti di arúgbó.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: sọ
  rationale: Ọ̀rọ̀ ìtàn tó wọ́pọ̀ ni; “sọ” jẹ́ ọ̀nà àdánidá láti fi ọ̀rọ̀ ẹni hàn ní Yorùbá.
- source_word: πρὸς τὸν ἄγγελον
  choice: fún áńgẹ́lì náà
  rationale: Pẹ̀lú ọ̀rọ̀ ìsọ̀rọ̀, πρός ń tọ́ka sí ẹni tí a ń bá sọ̀rọ̀; “sọ fún” jẹ́ èdè Yorùbá àdánidá.
- source_word: Κατὰ τί γνώσομαι τοῦτο
  choice: Báwo ni èmi yóò ṣe mọ èyí?
  rationale: Ó béèrè ọ̀nà tàbí ìdánilójú tí yóò fi mọ̀ pé ohun tí a kéde yóò ṣẹlẹ̀; “yóò” pa ìtumọ̀ ọjọ́ iwájú γνώσομαι mọ́ láìyí i sí ìbéèrè nípa agbára.
- source_word: πρεσβύτης
  choice: arúgbó ọkùnrin
  rationale: Ó ń tọ́ka sí ọkùnrin tí ọjọ́ rẹ̀ ti pọ̀, kì í ṣe ipò àgbà nínú ẹ̀sìn.
- source_word: ἡ γυνή μου
  choice: aya mi
  rationale: Nínú àyíká yìí, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: ti di arúgbó
  rationale: Gbólóhùn Gíríìkì náà jẹ́ àkànlò-èdè fún ẹni tí ọjọ́ rẹ̀ ti pọ̀. “Ti di arúgbó” sọ ìtumọ̀ náà ní Yorùbá àdánidá, nígbà tí ìtumọ̀ gígún bí “ti tẹ̀ síwájú nínú ọjọ́ rẹ̀” kò ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἄγγελος
  choice: áńgẹ́lì
  alternative: ońṣẹ́
  rationale: Bó tilẹ̀ jẹ́ pé ἄγγελος lè túmọ̀ sí “ońṣẹ́,” àyíká ìṣẹ̀lẹ̀ yìí fi hàn pé Gébúrẹ́lì, áńgẹ́lì Ọlọ́run, ni a ń tọ́ka sí; “áńgẹ́lì” kò fi ẹ̀kọ́ àfikún kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “sọ fún” dípò àtẹ̀lé gígùn ti πρός, a sì tú àkànlò-èdè ọjọ́ ogbó sí “ti di arúgbó” kí ó lè jẹ́ àdánidá. A fi “èmi” hàn nítorí ἐγώ ní ìtẹnumọ́ nínú orísun.
