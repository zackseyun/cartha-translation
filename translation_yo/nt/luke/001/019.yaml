id: LUK.1.19
reference: Luke 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: yo
  text: Áńgẹ́lì náà sì dá a lóhùn pé, “Èmi ni Gébúrẹ́lì, ẹni tí ó dúró níwájú Ọlọ́run. A sì rán mi láti bá ọ sọ̀rọ̀ àti láti kéde ìhìn rere yìí fún ọ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti kéde ìhìn rere wọ̀nyí fún ọ.” Ní Gíríìkì, ìtòléṣẹẹsẹ ọ̀rọ̀ náà jẹ́ “láti kéde nǹkan wọ̀nyí gẹ́gẹ́ bí ìhìn rere fún ọ”; “nǹkan wọ̀nyí” ń tọ́ka sí ìhìn tí Gébúrẹ́lì ṣẹ̀ṣẹ̀ kéde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dá a lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tí ó ṣí ọ̀rọ̀ tààrà sílẹ̀; ‘dá a lóhùn’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé áńgẹ́lì náà fèsì sí i.
- source_word: ἄγγελος
  choice: áńgẹ́lì
  rationale: Ní àyíká ìtàn yìí, ẹni ọ̀run ni a ń tọ́ka sí, tí ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí Gébúrẹ́lì sì mú dájú; ‘áńgẹ́lì’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún un.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Èmi ni Gébúrẹ́lì
  rationale: ‘Èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́; a kọ orúkọ náà ní ìrísí tí ó bá ìlò Yorùbá mu.
- source_word: ὁ παρεστηκὼς
  choice: ẹni tí ó dúró
  rationale: Perfect participle náà ń tọ́ka sí ipò tí ó dúró ṣinṣin tí ó sì ń bá a lọ; àsìkò ìsinsìnyí ní Yorùbá sọ ìtumọ̀ náà ní àdánidá.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó pa ìtumọ̀ wíwà ní ojú Ọlọ́run mọ́, ó sì jẹ́ gbolohun Yorùbá tó mọ́gbọ́n dání ní àyíká ọlá ààfin ọ̀run.
- source_word: ἀπεστάλην
  choice: A sì rán mi
  rationale: Ó pa ohùn àìṣe ti aorist mọ́, láìsọ ẹni tí ó rán án ní gbangba ju bí orísun ṣe sọ lọ.
- source_word: λαλῆσαι πρὸς σὲ
  choice: láti bá ọ sọ̀rọ̀
  rationale: Gbolohun idi ni ó tẹ̀ lé ‘rán’; ‘bá ọ sọ̀rọ̀’ jẹ́ Yorùbá àdánidá fún sísọ̀rọ̀ sí ẹnì kan.
- source_word: εὐαγγελίσασθαί σοι
  choice: láti kéde ìhìn rere ... fún ọ
  rationale: ‘Kéde ìhìn rere’ mú iṣẹ́ ìkéde inú εὐαγγελίζω àti ìtumọ̀ ìròyìn rere jáde, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e.
- source_word: ταῦτα
  choice: yìí
  rationale: Arọ́pò-atọ́ka náà ń tọ́ka sí ìhìn tí Gébúrẹ́lì ṣẹ̀ṣẹ̀ kéde; fífi ‘yìí’ mọ́ ‘ìhìn rere’ jẹ́ àdánidá, ṣùgbọ́n àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gangan ‘nǹkan wọ̀nyí’ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ εὐαγγελίζω nínú ìkéde áńgẹ́lì
  choice: kéde ìhìn rere
  alternative: kéde ìhìnrere; wàásù ìhìnrere
  rationale: ‘Kéde ìhìn rere’ sọ ìtumọ̀ ọ̀rọ̀ náà ní gbangba nínú àyíká yìí, láìfi ìtumọ̀ ọ̀rọ̀ amọ̀-ẹ̀kọ́ Kristẹni tí ó lè dà bí ti ìgbà tó tẹ̀ lé e kún un.
- issue: Ẹni tí ó rán Gébúrẹ́lì
  choice: A rán mi
  alternative: Ọlọ́run rán mi
  rationale: Gíríìkì lo passive láìdárúkọ aṣojú náà. Bó tilẹ̀ jẹ́ pé àyíká fi Ọlọ́run hàn, a pa ìṣísẹ̀ orísun mọ́ dípò fífi orúkọ aṣojú náà kún ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ṣeé lóye fún òǹkàwé lásán. A lo ‘níwájú Ọlọ́run’ àti ‘kéde ìhìn rere’ láti pa ọlá àti ìtumọ̀ orísun mọ́ láìjẹ́ kí èdè di ti àtijọ́ tàbí ti ẹ̀kọ́ jinlẹ̀.
