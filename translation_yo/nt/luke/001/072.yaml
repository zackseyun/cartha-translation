source:
  edition: SBLGNT
  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: yo
  text: láti ṣe àánú fún àwọn baba wa[c][a], àti láti rántí májẹ̀mú mímọ́ rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘pẹ̀lú àwọn baba wa.’ Ọ̀rọ̀ Gíríìkì náà ní ‘pẹ̀lú’; nínú ọ̀rọ̀ náà, ó ń tọ́ka sí fífi àánú hàn ní ìbáṣepọ̀ pẹ̀lú àwọn baba ńlá Ísírẹ́lì.
    reason: lexical_alternative
  - marker: b
    text: Nínú èdè májẹ̀mú Bíbélì, ‘rántí’ sábà ń ní ìtumọ̀ fífi òtítọ́ mú ìlérí tí a ṣe tẹ́lẹ̀ ṣẹ, kì í ṣe ìrántí nínú ọkàn nìkan.
    reason: cultural_note
  - marker: c
    text: ‘Àwọn baba wa’ ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì, pàápàá àwọn baba ìpilẹ̀ṣẹ̀; a tún lè túmọ̀ ọ̀rọ̀ náà sí ‘àwọn baba ńlá wa.’
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: láti ṣe àánú
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí fífi àánú hàn. ‘Ṣe àánú’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ àpólà infinitive mọ́.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: sí àwọn baba wa
  rationale: Bí ó tilẹ̀ jẹ́ pé μετά pẹ̀lú genitive sábà túmọ̀ sí ‘pẹ̀lú,’ nínú àkójọpọ̀ ọ̀rọ̀ yìí ‘ṣe àánú sí’ ló jẹ́ èdè Yorùbá tó ṣe déédéé. ‘Àwọn baba wa’ pa ìtọ́kasí akọ àti ìró májẹ̀mú àwọn baba ńlá Ísírẹ́lì mọ́.
- source_word: μνησθῆναι
  choice: láti rántí
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì náà mọ́ láì fi ìtumọ̀ ‘mú ṣẹ’ kún un, bí ó tilẹ̀ jẹ́ pé nínú èdè májẹ̀mú, rírántí Ọlọ́run sábà ń yọrí sí ìṣe òtítọ́.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: májẹ̀mú mímọ́ rẹ̀
  rationale: ‘Májẹ̀mú’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún διαθήκη ní àyíká ìtàn ìgbàlà yìí; ‘mímọ́’ sì túmọ̀ ἁγίας ní tààrà, ‘rẹ̀’ sì pa arọ́pò-orúkọ αὐτοῦ mọ́.
theological_decisions:
- issue: Rírántí Ọlọ́run gẹ́gẹ́ bí ìṣe májẹ̀mú
  choice: láti rántí májẹ̀mú mímọ́ rẹ̀
  alternative: láti ṣe ní ìbámu pẹ̀lú májẹ̀mú mímọ́ rẹ̀; láti mú májẹ̀mú mímọ́ rẹ̀ ṣẹ
  rationale: Nínú Bíbélì, Ọlọ́run ‘rántí’ lè ní ìtumọ̀ pé ó ń fi òtítọ́ ṣe ohun tí ó ṣèlérí; síbẹ̀, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ‘rántí,’ nítorí náà a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ìtumọ̀ πατέρων ἡμῶν
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa; àwọn baba wa ìgbàanì
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ó sì ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì. ‘Àwọn baba wa’ pa ìró ìtàn àti ti májẹ̀mú mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń mú ibi tí ìtọ́kasí náà dé ṣe kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe déédéé fún kíkà ní gbangba. A lo ‘ṣe àánú sí’ gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá, a sì pa ‘àwọn baba wa’ àti ‘rántí’ mọ́ láti dáàbò bo ìró májẹ̀mú àti àìdájú ojúlówó inú orísun.
