  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: yo
  text: Ó ti ran Ísírẹ́lì, ìránṣẹ́ rẹ̀, lọ́wọ́[a], ní rírántí àánú[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ísírẹ́lì ọmọ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, παῖς (pais), lè túmọ̀ sí “ìránṣẹ́” tàbí “ọmọ.” A yan “ìránṣẹ́” níbí nítorí Májẹ̀mú Láéláé sábà máa ń pe Ísírẹ́lì ní ìránṣẹ́ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: “Àánú” tún lè ní ìtumọ̀ àánú inú májẹ̀mú tàbí ìdúróṣinṣin oníyọ̀ọ́nú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: Ó ti ran … lọ́wọ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí dídi ẹnì kan mú láti ràn án lọ́wọ́ tàbí láti gbé e ró. ‘Ran … lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó fi ìrànlọ́wọ́ Ọlọ́run hàn, nígbà tí ‘ti’ sì mú àkótán ìṣe aorist náà jáde.
- source_word: Ἰσραὴλ
  choice: Ísírẹ́lì
  rationale: A pa orúkọ náà mọ́ ní ìkọ̀wé Yorùbá tí ó wọ́pọ̀; ní àyíká yìí, ó dúró fún àwọn ènìyàn Ísírẹ́lì lápapọ̀.
- source_word: παιδὸς αὐτοῦ
  choice: ìránṣẹ́ rẹ̀
  rationale: παῖς lè túmọ̀ sí ‘ìránṣẹ́’ tàbí ‘ọmọ,’ ṣùgbọ́n èdè Májẹ̀mú Láéláé nípa Ísírẹ́lì gẹ́gẹ́ bí ìránṣẹ́ Ọlọ́run mú kí ‘ìránṣẹ́ rẹ̀’ yẹ jù níbí. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ mìíràn náà mọ́.
- source_word: μνησθῆναι
  choice: ní ìrántí
  rationale: A ṣe infinitive náà ní ọ̀nà tí ó so ìrànlọ́wọ́ Ọlọ́run pọ̀ mọ́ rírántí rẹ̀, láìfi dandan pinnu bóyá ó ń fi ète, àbájáde, tàbí ìṣe tí ó bá a lọ hàn.
- source_word: ἐλέους
  choice: àánú
  rationale: ‘Àánú’ ni ìtumọ̀ Yorùbá tààrà fún ἔλεος; ó tún lè ru ìtumọ̀ àánú olóòótọ́ inú májẹ̀mú ní àyíká yìí, ṣùgbọ́n a kò fi àfikún tí kò sí nínú Gíríìkì sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ παῖς nígbà tí ó ń tọ́ka sí Ísírẹ́lì
  choice: Ísírẹ́lì ìránṣẹ́ rẹ̀
  alternative: Ísírẹ́lì ọmọ rẹ̀
  rationale: Àwòrán Ísírẹ́lì gẹ́gẹ́ bí ìránṣẹ́ Ọlọ́run bá èdè Septuagint àti ti Aísáyà mu. Síbẹ̀, nítorí παῖς lè túmọ̀ sí ‘ọmọ,’ a jẹ́ kí àṣàyàn yẹn hàn nínú àlàyé.
- issue: Agbára ọ̀rọ̀ μνησθῆναι ἐλέους
  choice: ní ìrántí àánú
  alternative: láti rántí àánú; ó rántí àánú
  rationale: Ìtumọ̀ yìí pa ìsopọ̀ pẹ̀lú ìṣe ìrànlọ́wọ́ mọ́, ó sì yẹra fún fífi ‘rẹ̀’ kún ‘àánú,’ nítorí ọ̀rọ̀ arọ́pò-orúkọ bẹ́ẹ̀ kò sí nínú Gíríìkì. Ó tún fi ààyè sílẹ̀ fún ìtumọ̀ àánú májẹ̀mú láìfi í lélẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò ‘Ísírẹ́lì ìránṣẹ́ rẹ̀’ dúró létí Gíríìkì, nígbà tí ‘ran … lọ́wọ́’ jẹ́ àdánidá ní Yorùbá. Kọ́mà ìparí ń fi hàn pé ẹsẹ yìí ń tẹ̀ síwájú sínú ẹsẹ 55.
