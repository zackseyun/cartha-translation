  source_fidelity: Ìtumọ̀ náà ṣàfihàn ìlérí ọjọ́ iwájú ti ìlóyún, ìbímọ ọmọkùnrin, àti fífún ọmọ náà ní orúkọ Jésù ní ìbámu pẹ̀lú Gíríìkì. ‘Lóyún’ jẹ́ ọ̀nà Yorùbá tó pé láti ṣàfihàn συλλήμψῃ ἐν γαστρί, láìjẹ́ pé a nílò ìtúmọ̀ ‘nú ilé-ọmọ’ lọ́rọ̀ọ̀rọ̀.
  naturalness: ‘Sì kíyèsí i’ kì í ṣiṣẹ́ dáadáa gẹ́gẹ́ bí àmì ìfẹ́sẹ̀mulẹ̀ ἰδού nínú Yorùbá òde òní; ó lè dà bí àṣẹ pé kí ẹni kan fiyè sí ohun kan. ‘Wò ó’ jẹ́ ìpè akiyesi tó dáa, tó sì mú ipa ọrọ̀ náà. Àlàyé ìsàlẹ̀ tó ní ‘sọ ọ́ ní’ kò dára gẹ́gẹ́ bí ọ̀nà ìsọrúkọ; ‘fún un ní orúkọ’ jẹ́ àṣàyàn Yorùbá tó mọ́gbọ́n dání.
  terminology: ‘Ọmọkùnrin,’ ‘Jésù,’ àti ‘pe orúkọ rẹ̀ ní’ yẹ, wọ́n sì bá ìlò Bíbélì Yorùbá mu. A pa ìsọrúkọ pẹ̀lú ‘pe orúkọ rẹ̀ ní’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́.
