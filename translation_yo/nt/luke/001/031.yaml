id: LUK.1.31
reference: Luke 1:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: yo
  text: Wò ó, ìwọ yóò lóyún, ìwọ yóò sì bí ọmọkùnrin kan, ìwọ yóò sì pe orúkọ rẹ̀ ní Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó rọrùn sí i, “ìwọ yóò sì fún un ní orúkọ Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa ipa ọ̀rọ̀ amúnisí ἰδού mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ní iyì; ó fa àfiyèsí sí ìkéde angẹli láì di ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: ìwọ yóò lóyún
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àdánidá láti sọ pé obìnrin yóò lóyún. Yorùbá kò nílò kí a fi ‘nínú ilé-ọmọ rẹ’ kún un, nítorí ‘lóyún’ ti mú ìtumọ̀ náà pé.
- source_word: τέξῃ υἱόν
  choice: ìwọ yóò sì bí ọmọkùnrin kan
  rationale: ‘Bí’ túmọ̀ sí fífi ọmọ jóná, ‘ọmọkùnrin’ sì pa ìtọ́kasí akọ ti υἱός mọ́. ‘Kan’ ń ṣiṣẹ́ gẹ́gẹ́ bí àmì àìdánimọ̀ ní Yorùbá.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ìwọ yóò sì pe orúkọ rẹ̀ ní
  rationale: Ó pa ìṣètò gbolohun ìsọrúkọ inú orísun mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere. Ọ̀nà tí ó rọrùn sí i, ‘ìwọ yóò sì sọ ọ́ ní,’ wà nínú àlàyé ìsàlẹ̀.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí a ti ń kọ orúkọ Jesu ní Yorùbá Bíbélì àti nínú lílò Kristẹni tó wọ́pọ̀; ó ṣàfihàn orúkọ Gíríìkì Ἰησοῦς ní ìbámu pẹ̀lú èdè Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àgbékalẹ̀ ìsọrúkọ καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ìwọ yóò sì pe orúkọ rẹ̀ ní Jésù
  alternative: ìwọ yóò sì sọ ọ́ ní Jésù
  rationale: Kò sí àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ níbí. Àṣàyàn àkọ́kọ́ pa ìrísí àti ìró ìkéde ìsọrúkọ inú Ìwé Mímọ́ mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá tó túbọ̀ rọrùn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún ìkéde angẹli. ‘Sì kíyèsí i’ ń pa ìtẹ̀síwájú καὶ àti ipa amúnisí ἰδού mọ́.
