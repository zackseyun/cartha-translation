  - marker: b
    text: Tàbí, “lẹ́yìn tí a ti dá wa nídè kúrò lábẹ́ agbára àwọn ọ̀tá wa.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ náà tún lè jẹ́ “jọ́sìn rẹ̀,” pàápàá níbi tí iṣẹ́ ìsìn náà ti ń tọ́ sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: láìsí ìbẹ̀rù
  rationale: Ó túmọ̀ sí ‘láìsí ìbẹ̀rù’ tàbí ‘láìbẹ̀rù.’ Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: kúrò lọ́wọ́ àwọn ọ̀tá wa
  rationale: ‘Lọ́wọ́’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè túmọ̀ sí kíkúrò lábẹ́ agbára tàbí ìṣàkóso àwọn ọ̀tá. ‘Wa’ wá láti inú àyíká gbólóhùn náà, bí ó tilẹ̀ jẹ́ pé kò sí ní tààràtà nínú gbolohun Gíríìkì yìí.
- source_word: ῥυσθέντας
  choice: nígbà tí a bá ti gbà wá là
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist passive, ó ń fi ìgbàlà tí ó ṣáájú iṣẹ́ ìsìn hàn. Ìṣètò ‘bá ti’ fi ìbáṣepọ̀ àkókò náà hàn ní Yorùbá.
- source_word: λατρεύειν
  choice: máa sìn ín
  rationale: Nígbà tí a bá lò ó nípa Ọlọ́run, ó lè ní ìtumọ̀ sísìn pẹ̀lú ìfọkànsìn tàbí jíjọ́sìn. ‘Sìn ín’ pa ìtumọ̀ fífẹ̀ ti iṣẹ́ ìgbọràn àti ìfọkànsìn mọ́.
- source_word: αὐτῷ
  choice: ín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀; ní Yorùbá, ó darapọ̀ mọ́ ‘sìn’ gẹ́gẹ́ bí ‘sìn ín.’
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ λατρεύειν nígbà tí ó tọ́ka sí Ọlọ́run
  choice: máa sìn ín
  alternative: máa jọ́sìn rẹ̀
  rationale: ‘Sìn ín’ gba ìjọ́sìn, ìfọkànsìn, àti ìgbọràn sínú, láìfi ìtumọ̀ náà mọ́ sí iṣẹ́ ìjọ́sìn nìkan.
translation_notes:
  register: Yorùbá boṣewa, olóhùn, tí ó ní ọlá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘lọ́wọ́’ láti pa àwòrán Bíbélì mọ́, a sì lo ‘máa sìn ín’ fún iṣẹ́ ìfọkànsìn tí ó tẹ̀ síwájú.
