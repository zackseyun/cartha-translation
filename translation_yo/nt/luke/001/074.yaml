  text: pé lẹ́yìn tí a ti gbà wá là kúrò lọ́wọ́ àwọn ọ̀tá wa,[b] kí a lè sìn ín[c] láìsí ìbẹ̀rù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìbẹ̀rù.”
