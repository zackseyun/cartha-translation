  to: Màríà sì dúró pẹ̀lú rẹ̀ fún bí oṣù mẹ́ta[a], ó sì padà sí ilé rẹ̀.
  rationale: A rọ́pò “lọ́dọ̀ rẹ̀” pẹ̀lú “pẹ̀lú rẹ̀” láti fara mọ́ σύν (‘pẹ̀lú’) ní tààrà, a sì yọ “lẹ́yìn náà” kúrò kí ìsopọ̀ ìtàn má baà lágbára ju καί lọ. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí ó ṣàlàyé ìfojúsùn ὡς ní Yorùbá tí ó péye.
  reviewer_model: gpt-5.6-terra
