review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: Màríà dúró pẹ̀lú ẹni tí àpólà náà ń tọ́ka sí, ìgbà náà sì jẹ́ bí oṣù mẹ́ta, ó sì padà sí ilé rẹ̀. Síbẹ̀, “lẹ́yìn náà” ń sọ ìtẹ̀lé àkókò ní kedere ju καί (‘àti/sì’) nínú Gíríìkì lọ.'
  naturalness: “Dúró pẹ̀lú rẹ̀” jẹ́ Yorùbá òde òní tí ó ṣe kedere fún σύν αὐτῇ. Ìsopọ̀ “ó sì padà” sì ń dá ìṣàn ìtàn náà dúró ní ti ara.
  terminology: “Màríà,” “ilé rẹ̀,” àti “fún bí oṣù mẹ́ta” bá ọ̀rọ̀ orísun mu. Àlàyé ìsàlẹ̀ yẹ kí ó pe ὡς ní àmì ìfojúsùn/ìsúnmọ́ra, kì í ṣe “àfojúsùn,” tí ó lè ní ìtumọ̀ míràn ní Yorùbá.
  issues:
  - severity: low
    issue: “Lẹ́yìn náà” jẹ́ àfikún ìṣọ̀kan àkókò.
    rationale: καί níbi yìí kan so ìṣe méjèèjì pọ̀; bí ó tilẹ̀ jẹ́ pé ìpadà náà ṣẹlẹ̀ lẹ́yìn ìdúró náà ní ìtàn, “lẹ́yìn náà” sọ ìbáṣepọ̀ àkókò náà di mímú ju ọ̀rọ̀ orísun lọ.
  - severity: low
    issue: Ọ̀rọ̀ “àfojúsùn” nínú àlàyé ìsàlẹ̀ kò péye.
    rationale: Nínú ìlò Yorùbá, ó sábà ń tọ́ka sí ète tàbí ibi-afẹ́, kì í ṣe iye tí a fojú díwọ̀n. “Ìsúnmọ́ra” tàbí “ìwọ̀n tí kò ṣe pàtó” dáa sí i.
  revised_text: Màríà sì dúró pẹ̀lú rẹ̀ fún bí oṣù mẹ́ta[a], ó sì padà sí ilé rẹ̀.
