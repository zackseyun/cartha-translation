source:
  edition: SBLGNT
  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: yo
  text: Màríà sì dúró pẹ̀lú rẹ̀ fún bí oṣù mẹ́ta[a], ó sì padà sí ilé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bí oṣù mẹ́ta” fi hàn pé ìwọ̀n àkókò náà kò ṣe pàtó; ọ̀rọ̀ Gíríìkì ὡς lè fi ìsúnmọ́ra hàn nígbà tí ó bá wà níwájú ìwọ̀n àkókò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: dúró
  rationale: Ọ̀rọ̀ yìí fi hàn pé Màríà ń gbé níbẹ̀ fún àkókò kan; “dúró” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: “Sì” pa ìsopọ̀ ìtàn mọ́ láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: Μαριὰμ
  choice: Màríà
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: σὺν αὐτῇ
  choice: lọ́dọ̀ rẹ̀
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí pé Màríà dúró pẹ̀lú Elisabẹti níbi tí ó wà; “lọ́dọ̀ rẹ̀” jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé “pẹ̀lú rẹ̀” tún ṣeé ṣe.
- source_word: ὡς μῆνας τρεῖς
  choice: fún bí oṣù mẹ́ta
  rationale: “Bí” fi ìwọ̀n àkókò tí kò ṣe pàtó hàn, gẹ́gẹ́ bí ὡς ṣe ń ṣe níwájú ìwọ̀n àkókò.
- source_word: ὑπέστρεψεν
  choice: ó padà
  rationale: Èyí sọ ìpadà sí ibi tí ẹni náà ti wá ní Yorùbá tó ṣe kedere, tó sì rọrùn.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: sí ilé rẹ̀
  rationale: Níbí, οἶκος tọ́ka sí ibi tí Màríà ń gbé, kì í ṣe gbogbo ìdílé tàbí agbo ilé.
