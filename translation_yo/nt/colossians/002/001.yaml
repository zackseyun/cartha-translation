id: COL.2.1
reference: Colossians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: yo
  text: Nítorí mo fẹ́ kí ẹ mọ bí ìjàkadì tí mo ní fún yín, fún àwọn tí ó wà ní Laodíkíà, àti fún gbogbo àwọn tí kò tíì rí ojú mi ní ti ara[a], ti pọ̀ tó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ojúkojú” tàbí “ní ara gidi.” Ní tààrà, Gíríìkì náà sọ pé “nínú ẹran”; níhìn-ín, ó ń tọ́ka sí wíwà níbẹ̀ ní ti ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Nítorí mo fẹ́ kí ẹ mọ
  rationale: “Nítorí” so ọ̀rọ̀ yìí mọ́ èrò tí ó ṣáájú gẹ́gẹ́ bí γάρ ṣe ń ṣe; “mo fẹ́ kí ẹ mọ” sì jẹ́ ọ̀nà Yorùbá àdánidá fún θέλω ... ὑμᾶς εἰδέναι.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: bí ìjàkadì tí mo ń ṣe ... ti tóbi tó
  rationale: ἡλίκον tẹnu mọ́ bí ohun náà ti tóbi tó, ἀγών sì tọ́ka sí ìsapá líle tàbí ìjàkadì, kì í ṣe ìdíje eré ìdárayá níhìn-ín. “Mo ń ṣe” mú gbólóhùn náà jẹ́ Yorùbá àdánidá láìsọ ìtumọ̀ ἔχω nù.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Níhìn-ín ὑπέρ túmọ̀ sí pé ìjàkadì náà wà fún àǹfààní wọn tàbí nítorí ọ̀ràn wọn; “nítorí yín” gba ìtumọ̀ méjèèjì láyè ní Yorùbá.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: àwọn tí ó wà ní Laodíkíà
  rationale: Àpilẹ̀kọ náà pẹ̀lú gbólóhùn àsopọ̀ ń dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tó wà ní ìlú náà.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: gbogbo àwọn tí kò tíì rí
  rationale: “Gbogbo” pa agbára àkópọ̀ ὅσοι mọ́; “kò tíì rí” sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé títí di àkókò náà wọn kò ní ìrírí yìí.
- source_word: τὸ πρόσωπόν μου
  choice: ojú mi
  rationale: Èyí pa àwòrán gidi ti πρόσωπον mọ́ dípò kí a túmọ̀ rẹ̀ sí “wíwà mi” nìkan.
- source_word: ἐν σαρκί
  choice: ní ti ara
  rationale: Nínú àyíká yìí σάρξ tọ́ka sí wíwà ní ara gidi, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀. “Ní ti ara” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìtumọ̀ yìí.
theological_decisions:
- issue: Ìtumọ̀ σάρξ níbi tí ó ti ń tọ́ka sí ara gidi
  choice: ní ti ara
  alternative: nínú ẹran ara; lójúkojú
  rationale: Ọ̀rọ̀ náà ń sọ nípa rírí Pọ́ọ̀lù níwájú wọn ní ara gidi. A kò túmọ̀ ọ́ sí ìwà ẹlẹ́ṣẹ̀, bẹ́ẹ̀ ni a kò sọ pé “lójúkojú” nìkan, kí ìtọ́ka sí ara tó wà nínú Gíríìkì má bàa sọnù.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ “ẹ,” àti àmì ohùn ní kíkún. Ìkọ̀wé náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àwòrán “ojú mi” mọ́ bó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé ìtumọ̀ wíwà ní ara gidi.
