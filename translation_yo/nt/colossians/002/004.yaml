  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: yo
  text: Mo sọ èyí kí ẹnikẹ́ni má bàa fi ọ̀rọ̀ tí ó dáni lójú tàn yín jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú àríyànjiyàn tí ó ṣeé gbàgbọ́” tàbí “nípasẹ̀ ọ̀rọ̀ tí ó lè mú ẹni gbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹyọ kan yìí tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ tàbí sí ìlà èrò rẹ̀, láì pinnu ààlà ìtọ́kasí náà ju bí Gíríìkì ṣe ṣe lọ.
- source_word: λέγω
  choice: Mo sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá àti tààrà láti túmọ̀ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní ibi yìí.
- source_word: ἵνα μηδεὶς
  choice: kí ẹnikẹ́ni má bà a
  rationale: Ìtumọ̀ yìí fi ète ìkìlọ̀ ἵνα hàn, ó sì gbé ìtumọ̀ òdì μηδεὶς jáde ní Yorùbá àdánidá.
- source_word: ὑμᾶς
  choice: yín
  rationale: Yín fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
- source_word: παραλογίζηται
  choice: tàn yín jẹ́
  rationale: Ọ̀rọ̀ ìṣe náà túmọ̀ sí ṣíṣìnà tàbí ṣíṣe èèyàn ní ẹ̀tàn nípasẹ̀ ìrònú tí kò tọ́; ‘tàn yín jẹ́’ ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ἐν πιθανολογίᾳ
  choice: fi ọ̀rọ̀ tí ó lè múni gbàgbọ́
  rationale: ‘Fi’ fi ọ̀nà tàbí ohun èlò hàn, bí ἐν ṣe rí níbí. Gbólóhùn yìí mú agbára ọ̀rọ̀ láti yí ọkàn padà hàn láì sọ pé àríyànjiyàn náà jẹ́ òtítọ́.
theological_decisions:
- issue: Irú ìkìlọ̀ tí παραλογίζηται ἐν πιθανολογίᾳ ń ṣe
  choice: Ìkìlọ̀ gbogbogbò lòdì sí jíjẹ́ kí ọ̀rọ̀ tí ó ṣeé gbàgbọ́ tàn wọ́n jẹ
  alternative: Kí a sọ ọ́ di ìkìlọ̀ pàtó lòdì sí ìmọ̀ ọgbọ́n èké tàbí àsọyé olóòrọ̀ nìkan
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ kò dárúkọ ètò ẹ̀kọ́ kan pàtó. Nítorí náà, ìtumọ̀ náà pa ìkìlọ̀ gbogbogbò inú Gíríìkì mọ́, láì fi ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé lásán. ‘Má bà a’ jẹ́ ọ̀nà àdánidá láti sọ ète ìdènà, ‘tàn yín jẹ́’ sì jẹ́ gbólóhùn tó ṣe kedere fún ẹ̀tàn.
