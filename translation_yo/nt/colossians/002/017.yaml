  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí jẹ́ òjìji àwọn ohun tí ń bọ̀, ṣùgbọ́n ara náà jẹ́ ti Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n ohun gidi náà jẹ́ ti Mèsáyà.” Nínú àfiwé yìí, “ara” lè túmọ̀ sí ohun gidi tí òjìji ń ṣojú fún.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí yìí ń tọ́ka sí àwọn ọ̀ràn oúnjẹ, àjọ̀dún, òṣù tuntun àti ọjọ́ Ìsinmi tí ẹsẹ tó ṣáájú mẹ́nu kàn. Ìtumọ̀ yìí ṣe àtọ́kasí náà kedere ní Yorùbá.
- source_word: σκιὰ
  choice: òjìji
  rationale: Ó pa àwòrán Gíríìkì mọ́, ó sì mú ìyàtọ̀ tó wà láàárín òjìji àti ara hàn.
- source_word: τῶν μελλόντων
  choice: àwọn ohun tí ń bọ̀
  rationale: Ó pa ìtumọ̀ ohun tó ń bọ̀ lọ́jọ́ iwájú mọ́ láìfi dandan pinnu bóyá ọ̀rọ̀ náà ń tọ́ka sí ìmúṣẹ nípasẹ̀ Mèsáyà, àwọn ohun ìkẹyìn, tàbí àwọn méjèèjì.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára láàárín òjìji àti ara hàn ní Yorùbá àdánidá.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì, ó sì pa àkàwé òjìji àti ara mọ́. Àlàyé ìsàlẹ̀ fi hàn pé nínú àkópọ̀ yìí ó lè tọ́ka sí ohun gidi tí òjìji ń ṣojú fún.
- source_word: τοῦ Χριστοῦ
  choice: jẹ́ ti Mèsáyà
  rationale: Ọ̀nà yìí sọ ìbáṣepọ̀ oníwun inú ọ̀rọ̀ Gíríìkì ní Yorùbá tó ṣe kedere. “Mèsáyà” pa iṣẹ́ Χριστός gẹ́gẹ́ bí orúkọ oyè mọ́.
theological_decisions:
- issue: Ìtumọ̀ σῶμα ní ìyàtọ̀ sí σκιά
  choice: A lo “ara” nínú àkọ́kọ́ láti pa ọ̀rọ̀ Gíríìkì àti àkàwé rẹ̀ mọ́.
  alternative: “ohun gidi” tàbí “ohun pàtàkì gidi,” èyí tó ṣàlàyé ohun tí ara ń tọ́ka sí nínú àkàwé náà
  rationale: “Ara” kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ náà lórí, ó sì jẹ́ kí ìṣòro àti agbára àkàwé òjìji/ara dúró. Àlàyé ìsàlẹ̀ ń fún òǹkàwé ní ìtumọ̀ àfiwé tó ṣeé ṣe.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A pa àkàwé “òjìji/ara” àti àìdánilójú rẹ̀ mọ́.
