id: COL.2.5
reference: Colossians 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: yo
  text: Nítorí bí ó tilẹ̀ jẹ́ pé mo jìnnà sí yín ní ti ara, síbẹ̀ mo wà pẹ̀lú yín ní ti ẹ̀mí[a], mo ń yọ̀, mo sì ń rí ìṣètò rere yín àti ìdúróṣinṣin ìgbàgbọ́ yín nínú Mèsáyà[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ní ti ẹ̀mí” lè túmọ̀ sí pé Paulu wà pẹ̀lú wọn nínú ẹ̀mí tirẹ̀; ó tún lè jẹ́ pé ó ń sọ nípa wíwà pẹ̀lú wọn nípasẹ̀ Ẹ̀mí Mímọ́.
    reason: theological_ambiguity
  - marker: b
    text: Gíríìkì ní Χριστόν; níbí a túmọ̀ oyè náà sí “Mèsáyà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìdúróṣinṣin ìgbàgbọ́ yín nínú Mèsáyà”; ó tún ṣeé ṣe láti túmọ̀ apá gbólóhùn náà sí “ìdúróṣinṣin ìṣòtítọ́ yín sí Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: σαρκί
  choice: nípa ti ara
  rationale: Nínú àtakò pẹ̀lú πνεύματι, ọ̀rọ̀ náà ń tọ́ka sí àìsí Paulu ní ti ara, kì í ṣe sí ìwà ẹ̀ṣẹ̀.
- source_word: πνεύματι
  choice: nípa ti ẹ̀mí
  rationale: Èyí pa àtakò ‘nípa ti ara … nípa ti ẹ̀mí’ mọ́, ó sì kò kọjá ohun tí Gíríìkì sọ nípa bóyá ẹ̀mí Paulu ni tàbí Ẹ̀mí Mímọ́.
- source_word: χαίρων καὶ βλέπων
  choice: Mo ń yọ̀, mo sì ń rí
  rationale: Àwọn ọ̀rọ̀ aláìlópìn méjèèjì ń ṣàpèjúwe ohun tí Paulu ń ṣe ní àkókò kan náà; ìtumọ̀ yìí jẹ́ ti ẹ̀dá èdè Yorùbá, ó sì pa ìtẹ̀lé wọn mọ́.
- source_word: τάξιν
  choice: ìṣètò rere
  rationale: τάξις túmọ̀ sí ìṣètò tàbí ìwà létòlétò; ‘ìṣètò rere’ mú ìyìn inú àyíká ọ̀rọ̀ náà hàn láìfi ìtumọ̀ ológun lé e lórí.
- source_word: στερέωμα
  choice: ṣe dúró ṣinṣin
  rationale: Àkànlò yìí sọ ìdúróṣinṣin àti agbára ìgbàgbọ́ wọn ní Yorùbá àdánidá, dípò gbólóhùn orúkọ tí yóò le láti kà.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tó yẹ níbí; ìtumọ̀ ‘ìṣòtítọ́’ tí ó tún ṣeé ṣe wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς Χριστόν
  choice: nínú Mèsáyà
  rationale: εἰς ń fi ẹni tí ìgbàgbọ́ dojú kọ hàn, Χριστός sì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; nítorí náà ‘nínú Mèsáyà’ jẹ́ ọ̀nà àdánidá láti sọ ọ́.
theological_decisions:
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Kí a túmọ̀ rẹ̀ ní ọ̀nà tí ó lè tọ́ka sí wíwà Paulu pẹ̀lú wọn ní ẹ̀mí.
  alternative: Ó lè tọ́ka sí wíwà pẹ̀lú wọn nípasẹ̀ Ẹ̀mí Mímọ́.
  rationale: Àtakò pẹ̀lú àìsí ní ti ara mú kí ẹ̀mí Paulu ṣeé ṣe jù, ṣùgbọ́n Gíríìkì kò mú Ẹ̀mí Mímọ́ kúrò pátápátá; àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí ìgbàgbọ́ wọn wà nínú rẹ̀, nítorí náà ‘Mèsáyà’ ń pa agbára oyè náà mọ́.
- issue: Ìtumọ̀ πίστεως
  choice: ìgbàgbọ́ nínú Mèsáyà
  alternative: ìṣòtítọ́ sí Mèsáyà
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tó ṣeé ṣe jù nínú àkójọpọ̀ ọ̀rọ̀ yìí, ṣùgbọ́n ‘ìṣòtítọ́’ jẹ́ ìtumọ̀ mìíràn tí ó yẹ kí a má ṣe pa run.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn kejì jẹ́ ti ẹ̀dá èdè Yorùbá, ó sì pa ìyọ̀ Paulu, ìṣètò rere àwọn ará Kólósè, àti ìdúróṣinṣin ìgbàgbọ́ wọn mọ́ láìsọ àwòrán Gíríìkì di ọ̀rọ̀ ológun.
