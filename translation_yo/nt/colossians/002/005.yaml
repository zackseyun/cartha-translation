revisions:
- from: Nítorí bí mo tilẹ̀ kò sí nípa ti ara, síbẹ̀ mo wà pẹ̀lú yín nípa ti ẹ̀mí[a]. Mo ń yọ̀, mo sì ń rí ìṣètò rere yín àti bí ìgbàgbọ́ yín nínú Mèsáyà[b] ṣe dúró ṣinṣin[c].
  to: Nítorí bí ó tilẹ̀ jẹ́ pé mo jìnnà sí yín ní ti ara, síbẹ̀ mo wà pẹ̀lú yín ní ti ẹ̀mí[a], mo ń yọ̀, mo sì ń rí ìṣètò rere yín àti ìdúróṣinṣin ìgbàgbọ́ yín nínú Mèsáyà[b][c].
  rationale: Àtúnṣe náà yí ìfihàn àìsí Paulu padà sí “jìnnà sí yín,” kí ó lè fi ἄπειμι hàn dáadáa, ó sì lo “ìdúróṣinṣin ìgbàgbọ́” láti pa àkójọpọ̀ orúkọ τὸ στερέωμα τῆς ... πίστεως mọ́. A tún ṣàtúnṣe àlàyé ọrọ̀ Χριστόν fún ìdánilójú èdè. Àwọn àmì àlàyé ìsàlẹ̀ àti ìtumọ̀ pàtàkì mìíràn wà ní ìbámu pẹ̀lú orísun.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:49Z'
