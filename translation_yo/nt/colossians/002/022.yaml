  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: yo
  text: Gbogbo nǹkan wọ̀nyí máa ń ṣègbé nípa lílò[a], gẹ́gẹ́ bí àwọn àṣẹ àti ẹ̀kọ́ ti ènìyàn[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí gbogbo nǹkan wọ̀nyí máa ń ṣègbé nípa lílò.” Èdè Gíríìkì lè ṣe kúkúrú sí i, ó sì tẹnu mọ́ pé àwọn ohun tí àwọn ìlànà náà dá lé jẹ́ ohun ìgbà díẹ̀ tí a lè lò tán.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn àṣẹ àti ẹ̀kọ́ ti ènìyàn” máa rántí Aísáyà 29:13, láti tẹnu mọ́ pé ọ̀dọ̀ ènìyàn ni àwọn ìlànà wọ̀nyí ti wá.
    reason: cross_reference
  - marker: c
    text: Tàbí, “ti àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ti ẹ̀dá ènìyàn, ní ìyàtọ̀ sí ti Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ ... πάντα
  choice: Gbogbo nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ akọ́-abo-àìdásí púpọ̀ náà ń tọ́ka sí àwọn ohun tí àwọn ìfòfindè ẹsẹ tó ṣáájú dá lé; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tó sì pa ìtọ́kasí náà mọ́.
- source_word: εἰς φθοράν
  choice: ni yóò ṣègbé
  rationale: φθορά lè túmọ̀ sí ìparun, jíjẹrà tàbí píparẹ́; ní àyíká àwọn ohun tí lílò máa ń tán, ‘yóò ṣègbé’ fi àbájáde wọn hàn láìfi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- source_word: τῇ ἀποχρήσει
  choice: nígbà tí a bá lò wọ́n tán
  rationale: ἀπόχρησις tọ́ka sí lílò ohun dé òpin tàbí jíjẹ ẹ́ run nípa lílò; ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì mú ìbáṣepọ̀ lílò àti píparẹ́ ohun náà jáde.
- source_word: κατά
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìlànà tàbí orísun tí àwọn àṣẹ náà tẹ̀ lé hàn, ní ọ̀nà tó ṣe déédéé ní Yorùbá.
- source_word: ἐντάλματα
  choice: àwọn àṣẹ
  rationale: ‘Àṣẹ’ pa ìtumọ̀ òfin tàbí ohun tí a pàṣẹ mọ́, ó sì bá ìró ọ̀rọ̀ Aísáyà 29:13 mu.
- source_word: διδασκαλίας
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ohun tí a ń kọ́ni láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ onímọ̀ kan kún un.
- source_word: τῶν ἀνθρώπων
  choice: ènìyàn
  rationale: Nínú Yorùbá, ‘ènìyàn’ lè dúró fún ìran ènìyàn lápapọ̀; ó fi hàn pé orísun àwọn àṣẹ náà jẹ́ ti ẹ̀dá ènìyàn, kì í ṣe ti Ọlọ́run.
theological_decisions:
- issue: Bí gbólóhùn àlàyé náà ṣe ní í ṣe pẹ̀lú àwọn ìlànà ìkóra-ẹni-níjàánu
  choice: A jẹ́ kí ‘gbogbo nǹkan wọ̀nyí’ tọ́ka sí àwọn ohun tí a kà léèwọ̀, tí wọ́n sì máa ń parí nípa lílò; lẹ́yìn náà a ṣàpèjúwe àwọn ìlànà náà gẹ́gẹ́ bí àṣẹ àti ẹ̀kọ́ ènìyàn.
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà tó túbọ̀ le pé Pọ́ọ̀lù ń kọ àwọn ìlànà náà sílẹ̀ nítorí pé ohun tí lílò máa ń tán ni wọ́n dá lé.
  rationale: Èdè Gíríìkì fi ‘àwọn nǹkan wọ̀nyí’ ṣe olùṣe gbólóhùn píparẹ́, ṣùgbọ́n ìpele tó tẹ̀ lé e ń ṣàpèjúwe orísun ìlànà náà. Ìtumọ̀ yìí kò pinnu ju ẹ̀rí ọ̀rọ̀ náà lọ nípa ibi tí ìtẹnumọ́ Pọ́ọ̀lù wà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Lò wọ́n tán’ jẹ́ àdánidá fún ohun tí lílò tàbí jíjẹ máa ń parí, ‘àṣẹ àti ẹ̀kọ́ ènìyàn’ sì pa ìyàtọ̀ tó wà láàárín orísun ènìyàn àti ti Ọlọ́run mọ́. A tún pa ìṣòro ìsopọ̀ gírámà Gíríìkì mọ́ níwọ̀n tó ṣeé ṣe, láìṣàfikún ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan.
