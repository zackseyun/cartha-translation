  to: Gbogbo nǹkan wọ̀nyí máa ń ṣègbé nípa lílò[a], gẹ́gẹ́ bí àwọn àṣẹ àti ẹ̀kọ́ ti ènìyàn[c][b].
  rationale: Àtúnṣe náà yọ ìfihàn ọjọ́ iwájú tí kò ṣe pàtàkì kúrò, ó lo “nípa lílò” fún dative τῇ ἀποχρήσει, ó sì mú ìkọ̀lé genitive ‘ti ènìyàn’ hàn gbangba. A tún ṣe ẹsẹ̀-àlàfo a kí ó má bàa sọ lílò fúnra rẹ̀ di ohun tí ń parí. Àmì ẹsẹ̀-àlàfo àti ìtumọ̀ ìjìnlẹ̀ ìbéèrè ọrọ̀ náà ni a pa mọ́.
