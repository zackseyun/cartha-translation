id: COL.2.23
reference: Colossians 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí dà bí ẹni pé wọ́n ní ọgbọ́n[a] nítòótọ́, nínú ìjọsìn tí ènìyàn ṣètò fúnra rẹ̀[b], àti ìrẹ̀lẹ̀, àti líle sí ara; ṣùgbọ́n wọn kò ní iye kankan fún dídènà ìtẹ́lọ́rùn ẹran ara.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “wọ́n ní orúkọ pé wọ́n jẹ́ ọgbọ́n.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ìjọsìn tí ènìyàn fi lé ara rẹ̀ lórí”; ní àṣà ìtumọ̀ kan: “ìjọsìn nípa ìfẹ́ ara ẹni.”'
    reason: lexical_alternative
  - marker: c
    text: 'Gbólóhùn ìparí náà ṣòro. Ó tún lè túmọ̀ sí: “wọ́n kò fi ọlá kankan fún ara, fún ìtẹ́lọ́rùn ẹran ara,” tàbí “wọn kò ní ọlá kankan ní ìdojúkọ ìtẹ́lọ́rùn ẹran ara.”'
    reason: alternative_reading
  - marker: d
    text: “Ẹran ara” lè tọ́ka níbí sí àwọn ìfẹ́kúfẹ̀ẹ́ ènìyàn tó ti ṣubú sínú ẹ̀ṣẹ̀; fi wé bí Pọ́ọ̀lù ṣe ń lo ọ̀rọ̀ náà ní àwọn àyíká mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí àwọn ìlànà inú ẹsẹ 21–22, ó sì pa agbára arọ́pò-orúkọ ìtọ́kasí Gíríìkì mọ́.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: ní ìrísí ọgbọ́n nítòótọ́
  rationale: Àpólà náà ń sọ pé àwọn nǹkan wọ̀nyí dà bí ohun ọgbọ́n tàbí pé wọ́n ní orúkọ ọgbọ́n, nígbà tí μέν ń mú ìyọ̀ǹda tí ìtakò yóò tẹ̀ lé hàn.
- source_word: ἐθελοθρησκίᾳ
  choice: ìsìn tí ènìyàn dá sílẹ̀ fúnra rẹ̀
  rationale: Ọ̀rọ̀ tó ṣọ̀wọ́n yìí ń tọ́ka sí ìjọsìn tàbí àṣà ẹ̀sìn tí ó wá láti inú ìfẹ́ ènìyàn fúnra rẹ̀ dípò àṣẹ Ọlọ́run.
- source_word: ταπεινοφροσύνῃ
  choice: ìrẹ̀lẹ̀
  rationale: Èyí ni ìtumọ̀ ọ̀rọ̀ náà ní tààrà; àyíká náà ló ń fi hàn pé ó lè jẹ́ ìrẹ̀lẹ̀ àṣehàn tàbí ti ìnira ara.
- source_word: ἀφειδίᾳ σώματος
  choice: ṣíṣe ara ní ìkanra
  rationale: Ó sọ ìhùwàsí líle tí kò dá ara sí, gẹ́gẹ́ bí ìṣe àwọn afàyàfà ara, ní Yorùbá tó ṣeé lóye.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: wọn kò níye lórí
  rationale: Nínú ìtumọ̀ àkọ́kọ́ tí a yàn, τιμή ń tọ́ka sí iye tàbí anfàní gidi; àpólà náà sọ pé àwọn ìṣe náà kò lágbára tó wúlò.
- source_word: πρὸς πλησμονὴν
  choice: láti dènà ìtẹ́lọ́rùn
  rationale: Nínú àyíká yìí, πρός àti πλησμονή lè sọ ìbáṣepọ̀ pẹ̀lú kíkún tàbí fífún ìfẹ́ ní ìtẹ́lọ́rùn; ìtumọ̀ yìí bá ìtakò sí àwọn ìlànà afàyàfà ara mu.
- source_word: τῆς σαρκός
  choice: ti ẹran ara
  rationale: ‘Ẹran ara’ pa àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú σάρξ mọ́ láì sọ ọ́ di ‘ìwà ẹ̀ṣẹ̀’ ní pàtó.
theological_decisions:
- issue: 'Ìtumọ̀ gbólóhùn ìparí tó le koko: οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός'
  choice: Àwọn ìṣe afàyàfà ara náà kò níye tàbí agbára láti dènà ìtẹ́lọ́rùn ẹran ara.
  alternative: Wọn kò fi ọlá kankan fún ara, tàbí wọn ń ṣiṣẹ́ fún ìtẹ́lọ́rùn ẹran ara nìkan.
  rationale: Gíríìkì náà kúrú, ìsopọ̀ ọ̀rọ̀ rẹ̀ sì ṣòro. Ìtumọ̀ àkọ́kọ́ bá ìṣàn ọ̀rọ̀ Pọ́ọ̀lù mu pé àwọn ìlànà náà dà bí ọgbọ́n ṣùgbọ́n wọn kò lágbára lórí ìfẹ́ ẹran ara; àkọsílẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- issue: Ìtumọ̀ σάρξ nínú àyíká yìí
  choice: ẹran ara
  alternative: àwọn ìfẹ́kúfẹ̀ẹ́ ènìyàn tó ti ṣubú sínú ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ gígùn náà lè ṣàlàyé èrò Pọ́ọ̀lù, ṣùgbọ́n ‘ẹran ara’ pa ìfọ̀rọ̀wérọ̀ àti àìdánilójú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A yan ‘ìsìn tí ènìyàn dá sílẹ̀ fúnra rẹ̀’ fún ìtànkálẹ̀ tó ṣeé lóye, ‘ṣíṣe ara ní ìkanra’ fún líle sí ara, àti ‘ẹran ara’ láti pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó ní ẹ̀dọ̀fu mọ́. Gbogbo àmì àkọsílẹ̀ [a]–[d] wà nínú ọ̀rọ̀ àkọ́kọ́.
