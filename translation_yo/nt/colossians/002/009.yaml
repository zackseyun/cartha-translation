  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: yo
  text: Nítorí pé nínú rẹ̀ ni gbogbo ẹ̀kúnrẹ́rẹ́ ìwà Ọlọ́run ń gbé ní ti ara,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ẹ̀kúnrẹ́rẹ́ jíjẹ́ Ọlọ́run ń gbé nínú rẹ̀ ní ti ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó fi ìdí ọ̀rọ̀ ìkìlọ̀ tó ṣáájú múlẹ̀, ó sì pa agbára ìtumọ̀ ìdí tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ἐν αὐτῷ
  choice: inú rẹ̀ ni
  rationale: Ó jẹ́ gbólóhùn ibi tó tọ́ka sí Kristi láìfi ọ̀rọ̀ tó túmọ̀ sí ‘òun nìkan’ kún un.
- source_word: κατοικεῖ
  choice: ń gbé
  rationale: Ó fi hàn pé gbígbé náà ń bá a lọ, ó sì dúró ṣinṣin, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe túmọ̀ sí.
- source_word: πᾶν τὸ πλήρωμα
  choice: gbogbo ẹ̀kúnrẹ́rẹ́
  rationale: Ó pa ìtumọ̀ àpapọ̀ àti pípé mọ́; kò sí apá kankan nínú ẹ̀kúnrẹ́rẹ́ náà tó ṣẹ́ kù.
- source_word: τῆς θεότητος
  choice: ìwà Ọlọ́run
  rationale: Ní àyíká yìí, ó ń sọ nípa jíjẹ́ Ọlọ́run gan-an, kì í ṣe àwọn ànímọ́ bí ti Ọlọ́run lásán. ‘Ìwà Ọlọ́run’ jẹ́ èdè Yorùbá tó ṣeé lóye, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ṣe pàtó agbára ọ̀rọ̀ náà.
- source_word: σωματικῶς
  choice: ní ti ara
  rationale: Ó tú adverb náà ní ṣókí, ó sì pa ìtumọ̀ nípa ara mọ́ láìdín in kù sí ìṣẹ̀lẹ̀ ìwàláàyè nínú ẹran ara nìkan tàbí láìfi ìtumọ̀ ẹ̀sìn míì kún un.
theological_decisions:
- issue: Agbára ọ̀rọ̀ θεότης àti σωματικῶς nípa ẹni tí Kristi jẹ́
  choice: Gbogbo ẹ̀kúnrẹ́rẹ́ jíjẹ́ Ọlọ́run ń gbé inú Kristi ní ti ara.
  alternative: Kí a tú u bí àwọn ànímọ́ Ọlọ́run tàbí wíwà Ọlọ́run nìkan ṣe ń gbé inú Kristi.
  rationale: θεότης lágbára ju ọ̀rọ̀ tó túmọ̀ sí ànímọ́ bí ti Ọlọ́run lọ, σωματικῶς sì tọ́ka sí gbígbé ní ti ara. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ìjẹ́wọ́ gíga yìí di aláìlágbára, bẹ́ẹ̀ ni kò gbọ́dọ̀ ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀kúnrẹ́rẹ́’ láti fi totality πλήρωμα hàn, a sì fi àlàyé ìsàlẹ̀ ṣàfihàn agbára θεότης ní kedere.
