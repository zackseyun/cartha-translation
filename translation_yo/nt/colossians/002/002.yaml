  rationale: Àtúnṣe náà mú Yorùbá rọrùn, ó yọ ìtumọ̀ àkókò tí ‘nígbà tí’ fi kún participle Gíríìkì, ó sì yàgò fún ṣíṣàlàyé ìbáṣepọ̀ ‘ìdánilójú’ àti ‘òye’ ju bó ṣe yẹ lọ. Ó tún mú ìtumọ̀ ἐπίγνωσις hàn dáadáa pẹ̀lú ‘ìmọ̀ pípé,’ nígbà tí akọsilẹ̀ ń pa yíyàn ‘ìmọ̀’ mọ́. Àmì ẹsẹ̀ àti gbogbo àwọn akọsilẹ̀ wa ní ipò tó tọ́.
