review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ pàtàkì ti Gíríìkì: ìṣírí fún ọkàn, ìṣọ̀kan nínú ìfẹ́, ọrọ̀/ìdánilójú/òye, àti ohun ìjìnlẹ̀ Ọlọ́run, Mèsáyà. Ṣùgbọ́n ‘nígbà tí a ti so wọ́n ṣọ̀kan’ yí participle náà padà sí gbolohun àkókò, ‘dé inú gbogbo ọrọ̀’ kò dáa ní Yorùbá, àti ìbáṣepọ̀ ‘ìdánilójú ... tí òye ń mú wá’ jẹ́ ìtumọ̀ tí ó fi ohun tí Gíríìkì kò sọ ní kedere kún un.'
  naturalness: ‘Kí ọkàn wọn lè rí ìṣírí gbà’ kò rọrùn bí ‘kí ọkàn wọn lè ní ìṣírí.’ A tún ṣe àtúnṣe sí ìsọ̀kan gbolohun náà kí ó lè jẹ́ Yorùbá òde òní tí ó ní ìwọ̀n ìforígbárí tí ó yẹ fún lẹ́tà Pọ́ọ̀lù.
  terminology: ‘Ọkàn,’ ‘ìfẹ́,’ ‘ohun ìjìnlẹ̀,’ àti ‘Mèsáyà’ yẹ. ‘Ìmọ̀ pípé’ jẹ́ yíyàn àkọ́kọ́ tó dára fún ἐπίγνωσιν, pẹ̀lú akọsilẹ̀ fún ‘ìmọ̀’ gẹ́gẹ́ bí yíyàn mìíràn. A pa gbolohun kúkúrú, tí ó ní ìṣòro díẹ̀, ‘ohun ìjìnlẹ̀ Ọlọ́run, Mèsáyà’ mọ́ láì fi àlàyé apposition kún inú ọrọ̀ mímọ́.
  issues:
  - severity: medium
    issue: ‘nígbà tí a ti so wọ́n ṣọ̀kan’
    rationale: συμβιβασθέντες jẹ́ participle tí ó so mọ́ ìpinnu gbolohun náà; ‘nígbà tí’ ń sọ ọ́ di ìṣẹ̀lẹ̀ àkókò. Ọ̀rọ̀ náà tún jẹ́ passive, ṣùgbọ́n ‘a’ kò ní olùṣe tí a sọ.
  - severity: medium
    issue: ‘kí wọ́n sì dé inú gbogbo ọrọ̀’
    rationale: ‘Dé inú’ kò jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàfihàn dé sí ọrọ̀ tàbí ìní. A lè pa ìdarí/àbájáde εἰς mọ́ pẹ̀lú ‘kí wọ́n lè dé sí gbogbo ọrọ̀.’
  - severity: medium
    issue: ‘ìdánilójú kíkún tí òye ń mú wá’
    rationale: Ìtumọ̀ yìí fi hàn pé òye ni ó ń mú ìdánilójú wá. Gíríìkì ní ‘ìdánilójú pípé ti òye,’ èyí tí ó yẹ kí a má ṣe ṣàlàyé ìbáṣepọ̀ genitive rẹ̀ ju bó ṣe wà lọ.
  - severity: low
    issue: ‘rí ìṣírí gbà’ àti ìmọ̀ fún ἐπίγνωσιν
    rationale: ‘Ní ìṣírí’ jẹ́ ọ̀nà rọrùn ju ‘rí ìṣírí gbà’ lọ. Nítorí agbára ἐπίγνωσις, ‘ìmọ̀ pípé’ dara nínú ọrọ̀ mímọ́; akọsilẹ̀ lè tọ́ka sí ‘ìmọ̀’ gẹ́gẹ́ bí yíyàn mìíràn.
