source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: yo
  text: 'Kólósè 2:2


    Kí ọkàn wọn lè ní ìṣírí, kí a sì so wọ́n pọ̀ nínú ìfẹ́[a], kí wọ́n lè dé sí gbogbo ọrọ̀ ìdánilójú pípé ti òye, àti sí ìmọ̀ pípé[b] ohun ìjìnlẹ̀ Ọlọ́run, Mèsáyà[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a mú wọn wà ní ìṣọ̀kan nínú ìfẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí kíkó àwọn ènìyàn papọ̀ tàbí sísopọ̀ wọn tímọ́tímọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìmọ̀.” Ọ̀rọ̀ Gíríìkì ἐπίγνωσις lè ní ìtumọ̀ ìmọ̀ tí ó kún tàbí tí ó jinlẹ̀ ju ‘ìmọ̀’ lásán lọ.
    reason: lexical_alternative
  - marker: c
    text: 'Ọ̀rọ̀ Gíríìkì níbí kúrú, ó sì nira díẹ̀: “ohun ìjìnlẹ̀ Ọlọ́run, Mèsáyà.” Ìtumọ̀ yìí pa ìṣọ̀rọ̀ kúkúrú náà mọ́; a lè lóye “Mèsáyà” gẹ́gẹ́ bí àlàyé ohun ìjìnlẹ̀ Ọlọ́run.'
    reason: alternative_reading
  - marker: d
    text: Àwọn àfọwọ́kọ kan ní ọ̀rọ̀ gígùn sí i, bí “ohun ìjìnlẹ̀ Ọlọ́run, àní Baba, àti ti Mèsáyà.” Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ kúkúrú nínú ẹ̀dà Gíríìkì tí a pèsè.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: kí ọkàn wọn lè rí ìṣírí gbà
  rationale: Ó sọ ìfúnni ní ìgboyà àti okun inú, láì dín ìtumọ̀ náà kù sí ìtùnú nìkan.
- source_word: καρδίαι
  choice: ọkàn
  rationale: Ó pa àwòrán ìmọ̀-ènìyàn inú Bíbélì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún inú ènìyàn.
- source_word: συμβιβασθέντες
  choice: nígbà tí a ti so wọ́n ṣọ̀kan
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí kíkó àwọn ènìyàn papọ̀ tàbí sísopọ̀ wọn tímọ́tímọ́; ọ̀rọ̀ tí ó tẹ̀ lé e, ‘nínú ìfẹ́,’ ń ti ìtumọ̀ ìbáṣepọ̀ yìí lẹ́yìn.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ó fi ìfẹ́ hàn gẹ́gẹ́ bí ipò tàbí ìdè tí ìṣọ̀kan wọn wà nínú rẹ̀.
- source_word: εἰς πᾶν πλοῦτος
  choice: kí wọ́n sì dé inú gbogbo ọrọ̀
  rationale: ‘Dé inú’ pa ìdarí sí ibi àfojúsùn tàbí àbájáde tí εἰς ní mọ́, ‘gbogbo ọrọ̀’ sì sọ ọ̀pọ̀lọpọ̀ iye àti àǹfààní tí πλοῦτος ń tọ́ka sí.
- source_word: πληροφορίας τῆς συνέσεως
  choice: ìdánilójú kíkún tí òye ń mú wá
  rationale: Èyí sọ ìgbẹ́kẹ̀lé tí ó fìdí múlẹ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú òye ní Yorùbá àdánidá.
- source_word: ἐπίγνωσιν
  choice: ìmọ̀
  rationale: ‘Ìmọ̀’ jẹ́ èdè Yorùbá tó rọrùn, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè ní agbára ìtumọ̀ ìmọ̀ kíkún tàbí ìmọ̀ jíjinlẹ̀.
- source_word: μυστηρίου
  choice: ohun ìjìnlẹ̀
  rationale: Ó tọ́ka sí ète Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ṣí payá, láì mú un dà bí àṣírí lásán.
- source_word: θεοῦ, Χριστοῦ
  choice: Ọlọ́run, Mèsáyà
  rationale: Ó pa ìsọ̀rọ̀ kúkúrú àti díẹ̀ nira ti Gíríìkì mọ́, ó sì lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè fún Χριστός.
theological_decisions:
- issue: Ìbáṣepọ̀ apposition nínú τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: A fi sílẹ̀ ní ṣókí pé ‘ohun ìjìnlẹ̀ Ọlọ́run, Mèsáyà,’ kí Mèsáyà lè dúró gẹ́gẹ́ bí àlàyé ohun ìjìnlẹ̀ náà.
  alternative: ‘ohun ìjìnlẹ̀ Ọlọ́run, èyí tí í ṣe Mèsáyà’ tàbí kíkà ẹ̀rí àfọwọ́kọ gígùn pé ‘ti Ọlọ́run, àní Baba, àti ti Mèsáyà.’
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè kúrú, ó sì ní ìṣòro díẹ̀. Títúmọ̀ rẹ̀ ní ṣókí pa ìdánimọ̀ Mèsáyà gẹ́gẹ́ bí ohun ìjìnlẹ̀ Ọlọ́run mọ́ láì fi ọ̀rọ̀ àlàyé tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: A lo Yorùbá àgbàlágba tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A pa àwòrán ‘ọkàn,’ ‘sísopọ̀ ṣọ̀kan,’ àti ‘ọrọ̀’ mọ́, a sì yẹra fún lílo ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
