  source_fidelity: Àtúnṣe kékeré ni a nílò. Draft náà ń pa ìkọ̀kọ̀ Gíríìkì mọ́ nípa ìsin àti jíjí dìde pẹ̀lú Kristi, ìbatisí, ìgbàgbọ́, àti iṣẹ́ agbára Ọlọ́run. Ṣùgbọ́n “A sin yín pọ̀ mọ́ ọn” kò ṣe kedere tó gẹ́gẹ́ bí ìtumọ̀ συνταφέντες αὐτῷ; “pẹ̀lú rẹ̀” ni ó ń sọ ìpapọ̀ náà ní tààràtà àti ní ìbámu pẹ̀lú συνηγέρθητε.
  naturalness: “A sin yín pẹ̀lú rẹ̀” jẹ́ Yorùbá àdánidá, ó sì jẹ́ kí ìtumọ̀ ‘a sin yín pọ̀/tàbí pẹ̀lú Kristi’ hàn gbangba. Àwọn apá míì, pàápàá “nípasẹ̀ ìgbàgbọ́ nínú iṣẹ́ agbára Ọlọ́run,” jẹ́ ìforúkọsílẹ̀ tó bófin mu fún ọ̀rọ̀ mímọ́, bí ó tilẹ̀ jẹ́ pé ó tẹ̀lé gírámà Gíríìkì tímọ́tímọ́.
  terminology: “Ìbatisí,” “ìgbàgbọ́,” “Ọlọ́run,” àti “jí ... dìde” yẹ, wọ́n sì bá ìlò Yorùbá ìjọba/ìwé mímọ́ mu. A pa ìtumọ̀ ἐνέργεια mọ́ nínú “iṣẹ́ agbára.” Àlàyé a gbọdọ̀ lo “nínú Kristi” tàbí “nínú ẹni náà” dípò “nínú ẹni tí,” nítorí pé èyí tó wà nínú draft jẹ́ àìpé ní Yorùbá.
