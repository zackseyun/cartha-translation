id: COL.2.12
reference: Colossians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: yo
  text: A sin yín pẹ̀lú rẹ̀ nínú ìbatisí[a], nínú èyí tí a sì jí yín dìde pẹ̀lú rẹ̀ nípasẹ̀ ìgbàgbọ́[b] nínú iṣẹ́ agbára Ọlọ́run, ẹni tí ó jí i dìde kúrò láàárín àwọn òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ó ṣeé ṣe, “nínú Kristi,” bí a bá ka ọ̀rọ̀ arọ́pò-orúkọ náà sí èyí tó ń tọ́ka sí Kristi dípò ìbatisí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “nípasẹ̀ ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìṣòtítọ́” ní àwọn àyíká ọ̀rọ̀ kan, ṣùgbọ́n “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες
  choice: A sin yín pọ̀ mọ́ ọn
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist passive, ó sì ní ìtumọ̀ ‘a sin pọ̀ pẹ̀lú.’ Gbólóhùn Yorùbá yìí mú passive àti ìṣọ̀kan pẹ̀lú Kristi hàn lọ́nà àdánidá.
- source_word: αὐτῷ
  choice: mọ́ ọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Kristi nínú àyíká ọ̀rọ̀; lílo arọ́pò-orúkọ dá ìṣàn ọ̀rọ̀ Yorùbá mọ́.
- source_word: ἐν τῷ βαπτισμῷ
  choice: nínú ìbatisí
  rationale: ‘Nínú’ pa àpapọ̀ ìtumọ̀ ibi àti ọ̀nà tí ἐν lè ní mọ́, láìfi èrò ẹ̀kọ́ ìjọ kan kún un.
- source_word: ἐν ᾧ
  choice: nínú èyí
  rationale: Antecedent tó sún mọ́ ọn jù ni βαπτισμῷ; ‘nínú èyí’ tọ́ka sí ìbatisí, bí gírámà Gíríìkì ṣe ṣeé kà á jù lọ.
- source_word: συνηγέρθητε
  choice: a sì jí yín dìde pẹ̀lú rẹ̀
  rationale: Aorist passive ẹni-kejì ọ̀pọ̀ ni; ‘pẹ̀lú rẹ̀’ mú ìtumọ̀ συν- hàn gbangba.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tó yẹ jù nínú àyíká yìí, ‘nípasẹ̀’ sì fi hàn pé ó jẹ́ ọ̀nà tí ìkópa nínú iṣẹ́ Ọlọ́run gbà wáyé.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: nínú iṣẹ́ agbára Ọlọ́run
  rationale: ἐνέργεια túmọ̀ sí iṣẹ́ tàbí agbára tó ń ṣiṣẹ́ ní mímúná; ‘iṣẹ́ agbára’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò dín un kù sí agbára lásán.
- source_word: τοῦ ἐγείραντος αὐτὸν
  choice: ẹni tí ó jí i dìde
  rationale: Articular participle náà ṣàlàyé Ọlọ́run; relative clause yìí bá Yorùbá mu dáadáa.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí fi ìtumọ̀ ‘láti inú àwọn òkú’ hàn ní Yorùbá àdánidá, ó sì pa èdè àjíǹde mọ́.
theological_decisions:
- issue: Ohun tí ἐν ᾧ ń tọ́ka sí
  choice: 'Ó tọ́ka sí ìbatisí: ‘nínú èyí’'
  alternative: 'Ó lè tọ́ka sí Kristi: ‘nínú ẹni tí’ tàbí ‘nínú rẹ̀’'
  rationale: βαπτισμῷ ni antecedent tó sún mọ́ ọn jù, gírámà náà sì ṣe àtìlẹ́yìn fún un. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa àǹfààní ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ èdè ìbatisí
  choice: Pa ìsopọ̀ tó lágbára láàárín ìsin, àjíǹde pẹ̀lú Kristi, ìbatisí, àti ìgbàgbọ́ mọ́
  alternative: Kí a túmọ̀ ọ́ ní pàtó gẹ́gẹ́ bí iṣẹ́ sacramenti tàbí àmì lásán
  rationale: Ẹsẹ̀ náà kò dá àríyànjiyàn ẹ̀kọ́ ìjọ tó wá lẹ́yìn náà lórí ipa ìbatisí láre; nítorí náà, a kò fi ìtumọ̀ ẹ̀ya ìjọ kankan kún ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ πίστεως àti ἐνεργείας τοῦ θεοῦ
  choice: ‘ìgbàgbọ́ nínú iṣẹ́ agbára Ọlọ́run’
  alternative: ‘ìgbàgbọ́ tí iṣẹ́ agbára Ọlọ́run ń mú wá’
  rationale: Genitive náà lè ní ìfararora díẹ̀, ṣùgbọ́n àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún Ọlọ́run àti iṣẹ́ rẹ̀ gẹ́gẹ́ bí ohun tí a gbà gbọ́; a kò sọ pé Ọlọ́run ló fa ìgbàgbọ́ ní tààràtà nínú gbólóhùn yìí.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Ọ̀rọ̀ náà pa passive Gíríìkì àti àkòrí ìṣọ̀kan pẹ̀lú Kristi mọ́, láìfi ẹ̀kọ́ ìjọ pàtó kún un.
