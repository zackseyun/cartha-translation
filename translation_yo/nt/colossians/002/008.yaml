id: COL.2.8
reference: Colossians 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: yo
  text: Ẹ ṣọ́ra kí ẹnikẹ́ni má bàa mú yín ní ìgbèkùn nípasẹ̀ ìmòye àti ẹ̀tàn asán, gẹ́gẹ́ bí àṣà ènìyàn, gẹ́gẹ́ bí àwọn ìlànà ìpilẹ̀ ti ayé[a], kì í sì í ṣe gẹ́gẹ́ bí Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “àwọn ẹ̀mí ìpilẹ̀ ti ayé.” Gbólóhùn Gíríìkì náà lè tọ́ka sí àwọn ìlànà tàbí àwọn ohun ìpilẹ̀, tàbí sí àwọn agbára ẹ̀mí inú ayé.
    reason: alternative_reading
  - marker: b
    text: 'Gíríìkì: “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí pé ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè ṣe pàtàkì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Ẹ ṣọ́ra kí ẹnikẹ́ni má bàa
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ ìkìlọ̀ sí gbogbo àwọn olùgbọ́. ‘Ẹ ṣọ́ra’ jẹ́ Yorùbá àdánidá fún agbára ìkìlọ̀ náà, ‘kí ẹnikẹ́ni má bàa’ sì fi ewu tí ó ṣeé ṣe hàn.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: mú yín ní ìgbèkùn
  rationale: Ó pa àwòrán ẹni tí a kó lọ bí ìkógun mọ́, ṣùgbọ́n ó tún ṣe kedere ní Yorùbá òde òní.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: nípasẹ̀ ìmòye àti ẹ̀tàn asán
  rationale: ‘Nípasẹ̀’ fi ọ̀nà tàbí ohun èlò hàn; ‘àti’ sì pa àwọn ọ̀rọ̀-orúkọ méjèèjì mọ́ láì sọ pé ohun kan náà ni wọ́n ní dandan.
- source_word: φιλοσοφίας
  choice: ìmòye
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún philosophy, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí ilé-ẹ̀kọ́ ìrònú kan pàtó.
- source_word: κενῆς ἀπάτης
  choice: ẹ̀tàn asán
  rationale: ‘Ẹ̀tàn’ túmọ̀ ἀπάτη, ‘asán’ sì fi àìní ohun gidi tàbí èso inú κενός hàn ní ọ̀nà àdánidá.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: gẹ́gẹ́ bí àṣà ènìyàn
  rationale: ‘Gẹ́gẹ́ bí’ fi ìlànà tàbí òṣùwọ̀n hàn, ‘ènìyàn’ sì jẹ́ ti gbogbo ẹ̀dá ènìyàn, kì í ṣe ti akọ nìkan.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: gẹ́gẹ́ bí àwọn ìlànà ìpilẹ̀ ayé
  rationale: ‘Àwọn ìlànà ìpilẹ̀’ jẹ́ kíkà tí ó yé ni Yorùbá, tí kò sì pinnu pátápátá bóyá ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ẹ̀kọ́ ìbẹ̀rẹ̀ tàbí àwọn agbára ẹ̀mí.
- source_word: οὐ κατὰ Χριστόν
  choice: kì í sì í ṣe gẹ́gẹ́ bí Mèsáyà
  rationale: Ó pa ìyàtọ̀ tó wà láàárín òṣùwọ̀n ènìyàn/ayé àti ẹni tí a fòróró yàn mọ́. ‘Mèsáyà’ mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn.
theological_decisions:
- issue: Ìtumọ̀ στοιχεῖα τοῦ κόσμου
  choice: àwọn ìlànà ìpilẹ̀ ayé
  alternative: àwọn ẹ̀mí alágbára ìpilẹ̀ ayé
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ìlànà tàbí èròjà ìbẹ̀rẹ̀, ó sì tún lè tọ́ka sí àwọn agbára ẹ̀mí inú àgbáyé. Ọ̀rọ̀ inú ẹsẹ̀ kò yanjú rẹ̀ pátápátá; nítorí náà, a lo kíkà tí kò dín ìtumọ̀ rẹ̀ kù, a sì fi kíkà ẹ̀mí sí àlàyé ìsàlẹ̀.
- issue: Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός dúró gẹ́gẹ́ bí òṣùwọ̀n ẹni tí a yàn, ní ìtakò sí àṣà ènìyàn àti àwọn ìlànà ayé; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn ní kedere.
translation_notes:
  register: Yorùbá àpéjọ, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní ibi tí ó bá yẹ. ‘Ẹ ṣọ́ra’ àti ‘mú yín ní ìgbèkùn’ pa agbára ìkìlọ̀ àti àwòrán ìkógun inú Gíríìkì mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an.
