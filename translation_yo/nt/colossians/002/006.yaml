  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: yo
  text: Nítorí náà, gẹ́gẹ́ bí ẹ ti gba Mèsáyà náà, Jésù Olúwa[a], kí ẹ máa rìn nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: gẹ́gẹ́ bí ... bẹ́ẹ̀ ni
  rationale: Ètò ọ̀rọ̀ Yorùbá yìí mú ìfiwéra láàárín bí wọ́n ṣe gba Jésù àti bí wọ́n ṣe gbọ́dọ̀ máa hùwà síwájú hàn kedere.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìtumọ̀ ìyọrísí ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: παρελάβετε
  choice: ẹ ti gba
  rationale: Ó pa ìtumọ̀ gbígba ẹni náà àti ẹ̀kọ́ nípa rẹ̀ mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ túmọ̀ oyè náà, nígbà tí ‘Jésù’ jẹ́ orúkọ.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Ó jẹ́ oyè Kristẹni pàtàkì fún Jésù, ó sì dúró gẹ́gẹ́ bí àfikún ìdánimọ̀ sí ‘Mèsáyà Jésù.’
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù tó ṣókí àti ìtumọ̀ jíjinlẹ̀ ìṣọ̀kan pẹ̀lú Kristi mọ́ láìṣàlàyé rẹ̀ ju orísun lọ.
- source_word: περιπατεῖτε
  choice: kí ẹ máa rìn
  rationale: Ó pa àṣẹ ìṣe tí ń bá a lọ àti àpèjúwe ‘rírìn’ fún ìwàláàyè mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àkójọpọ̀ oyè Pọ́ọ̀lù
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Ní àyíká yìí, Χριστός ṣì ní agbára oyè; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
- issue: Ọ̀rọ̀ ìṣọ̀kan Pọ́ọ̀lù nínú ἐν αὐτῷ
  choice: nínú rẹ̀
  alternative: ní ìṣọ̀kan pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ yàn láti pa gbolohun Gíríìkì tó ṣókí àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ dípò ṣíṣe àlàyé sí i.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, tó bójú mu, tó sì ṣeé yé fún òǹkàwé òde òní. ‘Gẹ́gẹ́ bí ... bẹ́ẹ̀ ni’ jẹ́ ọ̀nà àdánidá láti pa ìfiwéra orísun mọ́; ‘kí ẹ máa rìn’ ń pa àpèjúwe àti ìṣe títẹ̀síwájú mọ́.
