id: COL.2.10
reference: Colossians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: yo
  text: A sì ti mú yín dé ẹ̀kúnrẹ́rẹ́ nínú rẹ̀,[a] òun sì ni orí gbogbo alákòóso àti aláṣẹ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti kún yín” tàbí “a ti mú yín dé kíkún.”
    reason: lexical_alternative
  - marker: b
    text: “Orí” pa àkàwé Gíríìkì mọ́; níhìn-ín, ó túmọ̀ sí pé Kristi ga jù gbogbo alákòóso àti aláṣẹ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ yìí pa ìtẹ̀síwájú ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: a ti mú yín dé ẹ̀kúnrẹ́rẹ́
  rationale: Ọ̀rọ̀ yìí fi ipò tí ìṣe tí ó ti ṣẹ̀ mú wá hàn, ó pa ohùn àìṣe àti àwòrán ẹ̀kúnrẹ́rẹ́ mọ́, ó sì so ẹsẹ yìí pọ̀ mọ́ ẹsẹ tó ṣáájú.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù nípa wíwà nínú Kristi mọ́ láì túmọ̀ rẹ̀ sí ẹ̀kọ́ kan pàtó.
- source_word: ὅς ἐστιν
  choice: òun sì ni
  rationale: Ó tọ́ka sí Kristi ní kedere, ó sì sọ gbólóhùn ìbátan Gíríìkì náà ní ọ̀nà Yorùbá tó rọrùn.
- source_word: κεφαλή
  choice: orí
  rationale: Ó pa àkàwé Gíríìkì mọ́ dípò kí a fi ìtumọ̀ ‘olórí’ tàbí ‘alákòóso’ rọ́pò rẹ̀.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: gbogbo alákòóso àti aláṣẹ
  rationale: ‘Gbogbo’ fi àpapọ̀ tí πάσης ní hàn; ‘alákòóso’ àti ‘aláṣẹ’ sọ àwọn agbára tí ń ṣàkóso ní èdè òde òní tí gbogbo ènìyàn lè lóye.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kúnrẹ́rẹ́ àwọn onígbàgbọ́ nínú Kristi
  choice: A sọ pé a ti mú wọn dé ẹ̀kúnrẹ́rẹ́ nínú Kristi, láì ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ ìpé tàbí àìní ẹ̀ṣẹ̀.
  alternative: Wọ́n pé pátápátá fún ìgbàlà; tàbí a fi ẹ̀kúnrẹ́rẹ́ Ọlọ́run kún wọn.
  rationale: Èdè yìí pa ìbáṣepọ̀ pẹ̀lú ẹ̀kúnrẹ́rẹ́ Kristi àti àìsọ̀rọ̀-pàtó inú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Agbára àkàwé κεφαλή lórí àwọn agbára
  choice: A pa ‘orí’ mọ́ nínú àkọsílẹ̀, pẹ̀lú ìtumọ̀ pé Kristi ga jù gbogbo alákòóso àti aláṣẹ lọ.
  alternative: Kristi ni orísun gbogbo alákòóso àti aláṣẹ.
  rationale: Nínú àyíká Kólósè, ọ̀rọ̀ náà ń tẹnumọ́ ipò gíga Kristi lórí àwọn agbára; síbẹ̀, pípa àkàwé ‘orí’ mọ́ kò jẹ́ kí ìtumọ̀ túmọ̀ ju orísun lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. Ìtẹnumọ́ ‘nínú rẹ̀ ni’ jẹ́ kí ìpìlẹ̀ ẹ̀kúnrẹ́rẹ́ náà hàn kedere; ‘òun sì ni’ yà ọ̀rọ̀ ní ọ̀nà àdánidá láì pàdánù ẹni tí ὅς ń tọ́ka sí.
