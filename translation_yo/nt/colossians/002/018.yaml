id: COL.2.18
reference: Colossians 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ẹnikẹ́ni sọ yín di aláìyẹ, ẹni tí ó ń gbádùn ìrẹ̀lẹ̀ àti jíjọ́sìn fún àwọn áńgẹ́lì[a], tí ó ń fi ara balẹ̀ lórí àwọn ohun tí ó ti rí[b][c], tí èrò inú ara rẹ̀ sì ń mú un gbéraga lásán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀sìn àwọn áńgẹ́lì,” tàbí “jíjọ́sìn pẹ̀lú àwọn áńgẹ́lì.” Gbolohun Gíríìkì náà lè ní ìtumọ̀ tó ju ọ̀kan lọ.
    reason: alternative_reading
  - marker: b
    text: Tàbí “tí ó ń wọ inú àwọn ohun tí ó ti rí.” Ọ̀rọ̀-ìṣe Gíríìkì náà ṣọ̀wọ́n, ìtumọ̀ rẹ̀ kò sì dájú.
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé àfọwọ́kọ kan ní “àwọn ohun tí kò rí” dípò “àwọn ohun tí ó ti rí”; nígbà náà, ìtumọ̀ rẹ̀ yóò dà bí “tí ó ń sọ̀rọ̀ nípa àwọn ohun tí kò rí.”
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: sọ yín di aláìyẹ
  rationale: Ó fi ìtumọ̀ adájọ́ tí ń dá ẹnì kan sílẹ̀ gẹ́gẹ́ bí ẹni tí kò yẹ hàn, láìfi ọ̀rọ̀ nípa ‘ẹ̀bùn’ kún ẹsẹ náà ní tààràtà.
- source_word: θέλων
  choice: tí ó ń gbádùn
  rationale: Nínú ìsopọ̀ ọ̀rọ̀ yìí, ó dára láti fi ìfẹ́ inú tàbí inú dídùn sí àwọn àṣà náà hàn ju ìfẹ́ láti ṣe nǹkan lásán lọ.
- source_word: ταπεινοφροσύνῃ
  choice: ìrẹ̀lẹ̀
  rationale: Èyí ni ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ náà; àyíká ìkìlọ̀ ni ó ń jẹ́ kí a rí i pé ó lè jẹ́ ìrẹ̀lẹ̀ àṣehàn tàbí ti ìnira ara ẹni.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: jíjọ́sìn fún àwọn áńgẹ́lì
  rationale: Ó tẹ̀ lé òye tí ó wọ́pọ̀ jù pé àwọn áńgẹ́lì ni wọ́n ń gba ìjọsìn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn òye mìíràn mọ́.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: tí ó ń fi ara balẹ̀ lórí àwọn ohun tí ó ti rí
  rationale: Ọ̀rọ̀-ìṣe ἐμβατεύω ṣọ̀wọ́n, ó sì ṣòro; gbolohun Yorùbá yìí fi ìfarabalẹ̀ jinlẹ̀ sí ohun tí ẹni náà sọ pé ó rí hàn láìsọ ìtumọ̀ náà di dandan ju ẹ̀rí Gíríìkì lọ.
- source_word: εἰκῇ
  choice: lásán
  rationale: Ó fi hàn pé ìgbéraga náà kò ní ìdí tó tọ́, kò sì ní èso.
- source_word: φυσιούμενος
  choice: mú kí ó wú fùkù
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa fífú tàbí wíwú nítorí ìgbéraga mọ́ nínú ọ̀rọ̀ Yorùbá tó ṣeé lóye.
- source_word: νοὸς
  choice: èrò inú
  rationale: ‘Èrò inú’ jẹ́ ọ̀nà àdánidá láti sọ νοῦς níbí, ó sì tọ́ka sí èrò àti ìwòye ẹni náà.
- source_word: σαρκὸς
  choice: ti ara
  rationale: Ó pa ìtumọ̀ gangan àti ìdọ̀tí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Pọ́ọ̀lù mọ́, dípò fífi ‘ìwà ẹ̀ṣẹ̀’ tí ó jẹ́ àlàyé sínú ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ θρησκείᾳ τῶν ἀγγέλων
  choice: ìjọsìn tí a ń ṣe fún àwọn áńgẹ́lì
  alternative: ẹ̀sìn àwọn áńgẹ́lì; tàbí jíjọ́sìn pẹ̀lú àwọn áńgẹ́lì
  rationale: Ìbáṣepọ̀ genitive náà ní Gíríìkì ní ju òye kan lọ. Ọ̀rọ̀ àkọ́kọ́ gba òye tí ó wọ́pọ̀ jù, ṣùgbọ́n àlàyé pa àìdánilójú gidi náà mọ́.
- issue: Ìtumọ̀ σάρξ nínú τῆς σαρκὸς αὐτοῦ
  choice: ara
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: ‘Ara’ jẹ́ kí ìforígbárí ìmọ̀-ẹ̀dá ènìyàn nínú ọ̀rọ̀ Pọ́ọ̀lù dúró, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan rọ́pò ọ̀rọ̀ orísun.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa àwòrán ‘wú fùkù’ àti ọ̀rọ̀ ‘ara’ mọ́, a sì ṣàlàyé àwọn ibi tí Gíríìkì kò ti dájú nínú àlàyé ìsàlẹ̀.
