id: COL.2.13
reference: Colossians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: yo
  text: Àti ẹ̀yin tí ẹ ti kú nínú àwọn ìrékọjá yín[a] àti nínú àìkọlà ara yín[b], ó sọ yín di alààyè papọ̀ pẹ̀lú rẹ̀, ó sì dárí gbogbo ìrékọjá wa jì wá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “nínú àwọn ẹ̀ṣẹ̀ yín.”
    reason: lexical_alternative
  - marker: b
    text: “Àìkọlà ara yín” tọ́ka ní tààrà jù lọ sí ipò àìkọlà nínú ara yín; síbẹ̀, nínú àyíká ọ̀rọ̀, ó tún ní ìjẹ́pàtàkì tẹ̀mí.
    reason: cultural_note
  - marker: c
    text: 'Ọ̀rọ̀ Gíríìkì yí padà láti “yín” sí “wa”: “ó sì dárí gbogbo ìrékọjá wa jì wá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: tí ẹ ti kú
  rationale: Ó sọ ipò ikú tẹ̀mí tí participle Gíríìkì náà fi hàn ní ọ̀nà Yorùbá tí ó ṣe kedere, láìsọ ọ́ di àpèjúwe míì.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: nínú àwọn ìrékọjá yín
  rationale: “Nínú” pa ἐν mọ́, ó sì jẹ́ kí àwòrán wíwà wọn nínú ipò àwọn ìrékọjá wọn dúró; “ìrékọjá” tún bá παράπτωμα mu láìdá a pọ̀ mọ́ gbogbo ìtumọ̀ ẹ̀ṣẹ̀ lápapọ̀.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: àìkọlà ara yín
  rationale: Gbólóhùn yìí tọ́ka ní tààrà sí ipò ara wọn tí a kò kọ ní ilà, nígbà tí àyíká ọ̀rọ̀ tún lè fún un ní ìtumọ̀ tẹ̀mí. “Ara” jẹ́ èdè Yorùbá àdánidá jù “ẹran ara” lọ níbi yìí.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: ó sọ yín di alààyè pọ̀ mọ́ ọn
  rationale: Ó pa agbára ọ̀rọ̀-àṣe àkópọ̀ συνεζωοποίησεν àti ìbáṣepọ̀ σύν mọ́, ó sì fi hàn pé jíjẹ́ alààyè náà ṣẹlẹ̀ papọ̀ pẹ̀lú ẹni tí αὐτῷ ń tọ́ka sí.
- source_word: χαρισάμενος
  choice: ó sì dárí ... jì wá
  rationale: Ìṣe ìdáríjì náà ni participle yìí ń sọ; ìsopọ̀ “ó sì” jẹ́ àdánidá ní Yorùbá, ó sì máa ń jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ìṣe pàtàkì dúró láìfi ìtúmọ̀ àkókò tàbí ohun tó fà á kún un.
- source_word: ἡμῖν πάντα τὰ παραπτώματα
  choice: gbogbo ìrékọjá wa jì wá
  rationale: Ó pa ìyípadà láti “ẹ̀yin/yín” sí “àwa/wa” mọ́, ó sì tún lo “ìrékọjá” fún παράπτωμα kí ìṣọ̀kan ọ̀rọ̀ lè dúró.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú τῆς σαρκὸς ὑμῶν
  choice: “ara” ní ìtumọ̀ gidi, pẹ̀lú ààyè fún ìtumọ̀ tẹ̀mí nínú àyíká ọ̀rọ̀
  alternative: “ìwà ẹlẹ́ṣẹ̀ yín” tàbí “ẹran ara yín”
  rationale: Àyíká Kólósè 2:11–12 mú kí àìkọlà ara jẹ́ ìtumọ̀ tààrà jù lọ. Ṣíṣe e ní “ìwà ẹlẹ́ṣẹ̀” yóò pinnu ohun tí ọ̀rọ̀ Gíríìkì kò pinnu ní kedere.
- issue: Ẹni tí αὐτῷ nínú σὺν αὐτῷ ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí arọ́pò-orúkọ “ọ́n,” tí àyíká rẹ̀ ń tọ́ka sí Kristi
  alternative: Fífi “Kristi” tààrà sínú ẹsẹ náà
  rationale: Àyíká ẹsẹ 12 ń sọ nípa jíjí dìde pẹ̀lú Kristi, ṣùgbọ́n pípa arọ́pò-orúkọ mọ́ sun mọ́ Gíríìkì, ó sì yẹra fún fífi orúkọ tí kò sí nínú ẹsẹ náà kún un.
- issue: Ìyípadà láti ὑμᾶς sí ἡμῖν
  choice: “yín” sí “wa”
  alternative: Ṣíṣe gbogbo rẹ̀ ní “yín” tàbí ṣíṣe ἡμῖν ní “ẹ̀yin àti àwa”
  rationale: Gíríìkì yí ẹni kejì ọ̀pọ̀ padà sí ẹni kìíní ọ̀pọ̀. A pa ìyípadà yìí mọ́ láìṣọ̀kan rẹ̀ tàbí tú ẹni tí “wa” kó sínú rẹ̀ síwájú.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Àìkọlà” àti “ìrékọjá” pa àwọn ọ̀rọ̀ pàtàkì inú àyíká mọ́, nígbà tí ìkọ̀wé náà ṣì ń ṣàn bí Yorùbá òde òní.
