  text: Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: yo
  text: “Ẹ má ṣe di í mú[a], ẹ má sì ṣe tọ́ ọ́ wò, ẹ má sì ṣe fọwọ́ kàn án,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe fọwọ́ kàn án, ẹ má sì ṣe tọ́ ọ́ wò, ẹ má sì ṣe fọwọ́ kàn án.” Ọ̀rọ̀ ìṣe àkọ́kọ́ (ἅψῃ) tún lè túmọ̀ sí “fọwọ́ kàn” tàbí “dì í mú”; a lo “di í mú” níhìn-ín láti fi ìyàtọ̀ rẹ̀ hàn sí θίγῃς (“fọwọ́ kàn”) tó wà lẹ́yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ἅψῃ
  choice: Ẹ má ṣe mú un lọ́wọ́
  rationale: Μή pẹ̀lú aorist subjunctive fi ìdènà hàn. ‘Mú un lọ́wọ́’ túmọ̀ ἅψῃ gẹ́gẹ́ bí ‘dì í mú/tọwọ́ bọ̀ ọ́,’ ó sì jẹ́ kí ó yàtọ̀ sí θίγῃς ní ìparí.
- source_word: μηδὲ
  choice: ẹ má sì ṣe
  rationale: Àtúnlò μηδέ so àwọn ìdènà náà pọ̀ ní ọ̀nà àkójọpọ̀; àtúnlò ‘ẹ má sì ṣe’ jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: γεύσῃ
  choice: tọ́ ọ wò
  rationale: γεύομαι túmọ̀ sí ‘tọ́wò’; ‘tọ́ ọ wò’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ohun kan sí ẹnu láti mọ adùn rẹ̀, láì mú ìtumọ̀ náà dé ‘jẹ’.
- source_word: θίγῃς
  choice: fọwọ́ kàn án
  rationale: θιγγάνω túmọ̀ sí ‘fọwọ́ kàn’; yíyan ọ̀rọ̀ yìí fún ọ̀rọ̀ ìṣe ìkẹyìn pa ìyàtọ̀ rẹ̀ mọ́ sí ἅψῃ, èyí tí a túmọ̀ sí ‘mú un lọ́wọ́.’
theological_decisions:
- issue: Ìwà àwọn ìdènà inú àyíká ọ̀rọ̀
  choice: Fi wọ́n hàn gẹ́gẹ́ bí ọ̀wọ́ àwọn òfin ìdènà kúkúrú, láì fi àlàyé kún wọn.
  alternative: Ṣàfikún àwọn ohun tí a kò dárúkọ, tàbí so wọ́n ní tààràtà mọ́ àwọn ìlànà ènìyàn.
  rationale: Gíríìkì ẹsẹ yìí kúrú, ó sì ní àwọn ìdènà mẹ́ta nìkan. Ìtumọ̀ náà pa ìkánjú àti àìṣàlàyé rẹ̀ mọ́, láì yanjú ohun tí àyíká ọ̀rọ̀ fi sílẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì. A lo àṣẹ ọ̀wọ̀/plural ‘Ẹ má ṣe’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìdènà àpapọ̀; a fi arọ́pò-orúkọ ohun kún un nítorí pé àwọn ọ̀rọ̀ ìṣe Yorùbá wọ̀nyí sábà máa ń béèrè ohun tí wọ́n ń ṣe sí, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò dárúkọ ohun náà.
