id: COL.2.19
reference: Colossians 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: yo
  text: kò sì di Orí náà mú ṣinṣin[a], láti ọ̀dọ̀ rẹ̀ ni gbogbo ara tí ń rí ohun tí ó nílò gbà, tí a sì ń so ó pọ̀ ṣọ̀kan nípasẹ̀ àwọn ibi ìsopọ̀ àti àwọn okùn ara[b], ó sì ń dàgbà ní ìdàgbàsókè ti Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “faramọ́ Orí náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí a ń bọ́, tí a sì ń hun pọ̀ ṣọ̀kan nípasẹ̀ àwọn ibi ìsopọ̀ àti àwọn okùn ara.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “ó ń dàgbà ní ìdàgbàsókè ti Ọlọ́run”; ó ṣeé ṣe jù pé gbólóhùn náà túmọ̀ sí ìdàgbàsókè tí ó ti ọ̀dọ̀ Ọlọ́run wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: di … mú ṣinṣin
  rationale: Ọ̀rọ̀ yìí fi hàn pé ẹni náà ń di ohun mú láìjẹ́ kí ó lọ, tàbí pé ó ń faramọ́ ọn ṣinṣin; ó lágbára ju ‘mú’ lásán lọ.
- source_word: κεφαλήν
  choice: Orí náà
  rationale: ‘Orí’ pa àwòrán ara mọ́; lílo lẹ́tà ńlá fi hàn pé Kristi ni ó ń tọ́ka sí nínú àyíká ọ̀rọ̀ náà.
- source_word: ἐξ οὗ
  choice: Láti ọ̀dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Orí, ó sì fi Orí hàn gẹ́gẹ́ bí orísun ohun tí ara ń rí gbà.
- source_word: πᾶν τὸ σῶμα
  choice: gbogbo ara
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ara náà lápapọ̀, ó sì pa àwòrán ìjọ gẹ́gẹ́ bí ara kan mọ́.
- source_word: ἁφῶν
  choice: àwọn oríkèé
  rationale: Nínú àwòrán ẹ̀yà ara, ‘oríkèé’ túmọ̀ sí àwọn ibi tí àwọn egungun tàbí ẹ̀yà ara ti pàdé.
- source_word: συνδέσμων
  choice: àwọn okùn ara
  rationale: Ó ń tọ́ka sí àwọn ohun ara tí ń so àwọn ẹ̀yà pọ̀; ‘okùn ara’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: ἐπιχορηγούμενον
  choice: ń rí ohun tí ó nílò gbà
  rationale: Èyí pa ìtumọ̀ pípèsè àti ìtọ́jú mọ́ láìfi dandan sọ pé oúnjẹ nìkan ni a ń pèsè.
- source_word: συμβιβαζόμενον
  choice: ń so ó pọ̀ ṣọ̀kan
  rationale: Ó sọ pé a ń mú gbogbo ara wá sínú ìṣọ̀kan tí ó sì dúró pọ̀.
- source_word: αὔξει
  choice: ń dàgbà
  rationale: Ó tẹ̀síwájú nínú àwòrán ara alààyè, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: ní ìdàgbàsókè ti Ọlọ́run
  rationale: Ìtumọ̀ yìí fara mọ́ ìṣọ̀kan ọ̀rọ̀ Gíríìkì, ó sì jẹ́ kí àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó ṣeé ṣe jù pé Ọlọ́run ni orísun ìdàgbàsókè náà.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú τὴν αὔξησιν τοῦ θεοῦ
  choice: Pa ọ̀rọ̀ náà mọ́ bí ‘ìdàgbàsókè ti Ọlọ́run,’ kí àlàyé sì tọ́ka sí ìtumọ̀ orísun.
  alternative: ‘ìdàgbàsókè tí ó ti ọ̀dọ̀ Ọlọ́run wá’ tàbí ‘ìdàgbàsókè tí Ọlọ́run ń fúnni.’
  rationale: Gíríìkì jẹ́ kúkúrú, ó sì lè gbà ju ìtúmọ̀ kan lọ; àyíká ọ̀rọ̀ náà ṣètìlẹ́yìn fún pé Ọlọ́run ni orísun ìdàgbàsókè, kì í ṣe pé Ọlọ́run fúnra rẹ̀ ń dàgbà.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Àwòrán Orí, ara, oríkèé àti okùn ara ni a pa mọ́, láìfi èrò ẹ̀kọ́ ìsìn ẹ̀gbẹ́ kan kún un.
