  source_fidelity: Ìtumọ̀ náà pa àwòrán Orí àti ara mọ́, ó sì tọ́ka sí Orí gẹ́gẹ́ bí orísun ìpèsè ara. Ṣùgbọ́n àmì-ìfẹ̀sẹ̀mulẹ̀ lẹ́yìn “Orí náà” ya gbolóhùn ìbátan ἐξ οὗ kúrò nínú gbolóhùn pàtàkì; a nílò àmì-idákẹ́jẹ dípò rẹ̀. A tún ṣàtúnṣe “oríkèé,” tí kì í ṣe ọ̀rọ̀ tó ṣe kedere fún àwọn ìpàdé/ìsopọ̀ ara nínú àwòrán yìí.
  naturalness: “Àwọn ibi ìsopọ̀ àti àwọn okùn ara” jẹ́ kedere, ó sì dára fún Yorùbá òde òní ju “àwọn oríkèé” lọ. Ìtúnṣe àwọn àmì ohùn nínú àwọn gbolóhùn ìbátan náà tún mú kí ọ̀rọ̀ náà rọrùn láti ka.
  terminology: “Orí” àti “ara” pa àwòrán Pọ́ọ̀lù mọ́. “Di ... mú ṣinṣin” yẹ fún κρατῶν. “Ìdàgbàsókè ti Ọlọ́run” ni a fi sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ gẹ̀ẹ́sì Gíríìkì, pẹ̀lú àlàyé pé ó ṣeé ṣe kí genitive náà fi Ọlọ́run hàn gẹ́gẹ́ bí orísun.
