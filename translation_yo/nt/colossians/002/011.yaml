id: COL.2.11
reference: Colossians 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: yo
  text: Nínú rẹ̀ ni a sì ti kọ yín ní ilà, pẹ̀lú ìkọlà tí a kò fi ọwọ́ ṣe, nínú yíyọ ara ti ẹran ara kúrò, nínú ìkọlà Mèsáyà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí Mèsáyà nínú àyíká ọ̀rọ̀ tó ṣáájú; ‘nínú rẹ̀’ jẹ́ èdè Yorùbá àdánidá tó sì pa èrò ìṣọ̀kan pẹ̀lú Mèsáyà mọ́.
- source_word: περιετμήθητε
  choice: a ti kọ yín ní ilà
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe aláìṣe aorist; ìtumọ̀ yìí sọ ìṣe tí a ṣe sí àwọn olùgbọ́ di mímọ̀, kò sì sọ àpèjúwe ìkọlà náà di àlàyé míì.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: pẹ̀lú ìkọlà tí ọwọ́ ènìyàn kò ṣe
  rationale: Ó pa ipa irinṣẹ́ tàbí ìbáṣepọ̀ dative náà mọ́, ó sì fi ìyàtọ̀ láàárín iṣẹ́ ènìyàn àti iṣẹ́ tí kì í ṣe ti ọwọ́ ènìyàn hàn.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: nípa yíyọ … kúrò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyọ tàbí bíbọ ohun kan kúrò; gbolohun yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ìyọkúrò pátápátá mọ́.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: ara ẹran ara
  rationale: A pa ìṣòro ìbáṣepọ̀ àwọn genitive Gíríìkì náà mọ́ láì túmọ̀ ọ́ sí ‘ìwà ẹlẹ́ṣẹ̀’ tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: σαρκός
  choice: ẹran ara
  rationale: ‘Ẹran ara’ pa ìtumọ̀ sarx mọ́ ní ọ̀nà tó ṣeé lóye, láì dín un kù sí ‘ìwà ẹlẹ́ṣẹ̀.’
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: nínú ìkọlà Mèsáyà
  rationale: A pa ἐν mọ́ gẹ́gẹ́ bí ‘nínú,’ a sì lo ‘Mèsáyà’ fún Χριστός; ìbáṣepọ̀ genitive náà wà ní ṣíṣí sí àwọn ìtumọ̀ tó ṣeé ṣe.
theological_decisions:
- issue: Ìtumọ̀ ‘ìkọlà Mèsáyà’
  choice: 'A lo gbolohun tó ṣí sí ìtumọ̀: ‘ìkọlà Mèsáyà.’'
  alternative: ìkọlà tí Mèsáyà ṣe; ìkọlà tí a ṣe fún Mèsáyà; ìkọlà tó jẹ́ ti Mèsáyà
  rationale: τοῦ Χριστοῦ lè tọ́ka sí ìkọlà tí Mèsáyà mú ṣẹ, èyí tó jẹ́ tirẹ̀, tàbí èyí tó ní ìbáṣepọ̀ pẹ̀lú rẹ̀. A kò pinnu ọ̀kan lára wọn sínú ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ ‘ara ẹran ara’
  choice: A pa àkópọ̀ ọ̀rọ̀ náà mọ́ láì fi ‘ìwà ẹlẹ́ṣẹ̀’ sí i.
  alternative: ara ti ẹran ara; ara ẹlẹ́ran-ara; ìwà ẹlẹ́ṣẹ̀
  rationale: Gbolohun Gíríìkì náà ṣòro, ó sì lè ní ìtumọ̀ ju ọ̀kan lọ. Ìtumọ̀ tó sun mọ́ ọ̀rọ̀ orísun yẹra fún fífi ẹ̀kọ́ nípa ìwà ènìyàn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọlọ́wọ̀, òde òní, ó sì yẹ fún kíkà ní gbangba. ‘Kọ ní ilà’ jẹ́ ọ̀nà Yorùbá àdánidá fún circumcision, nígbà tí ‘ẹran ara’ pa àwọ̀ Pauline sarx mọ́ láì ṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ju orísun lọ.
