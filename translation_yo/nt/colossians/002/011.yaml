  to: Nínú rẹ̀ ni a sì ti kọ yín ní ilà, pẹ̀lú ìkọlà tí a kò fi ọwọ́ ṣe, nínú yíyọ ara ti ẹran ara kúrò, nínú ìkọlà Mèsáyà.
