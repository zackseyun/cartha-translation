id: COL.2.20
reference: Colossians 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: yo
  text: 'Bí ẹ̀yin bá ti kú pẹ̀lú Mèsáyà, tí ẹ sì ti kúrò nínú àwọn ìlànà ìpilẹ̀ṣẹ̀ ti ayé[a], èé ṣe tí ẹ fi ń fi ara yín sábẹ́ àwọn àṣẹ[b], bí ẹni pé ẹ ṣì ń gbé nínú ayé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀mí alágbára ti ayé”; àṣàyàn mìíràn ni, “àwọn èròjà ìpilẹ̀ṣẹ̀ ayé.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí ló dé tí a fi ń fi àwọn ìlànà lé e yín lórí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Ó pa ìrísí gbólóhùn oníṣ条件 Greek mọ́, láì sọ ọ́ di ‘níwọ̀n ìgbà tí,’ bí ó tilẹ̀ jẹ́ pé Pọ́ọ̀lù lè máa gbà pé ọ̀rọ̀ náà jẹ́ òótọ́ nípa àwọn onígbàgbọ́.
- source_word: ἀπεθάνετε
  choice: ẹ̀yin bá kú
  rationale: Aorist náà tọ́ka sí ìṣẹ̀lẹ̀ pàtó tí ó ti ṣẹlẹ̀; ‘kú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àkókò ìṣe náà mu.
- source_word: σὺν Χριστῷ
  choice: pẹ̀lú Mèsáyà
  rationale: Χριστός jẹ́ oyè ‘Mèsáyà’ níbí; yíyan ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò lílò ó bí orúkọ lásán.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: bọ́ kúrò lábẹ́ àwọn ìlànà ìpilẹ̀ṣẹ̀ ti ayé
  rationale: ‘bọ́ kúrò lábẹ́’ fi ìyapa tí ἀπό ń tọ́ka sí hàn ní Yorùbá àdánidá. ‘Àwọn ìlànà ìpilẹ̀ṣẹ̀’ pa ìtumọ̀ στοιχεῖα gẹ́gẹ́ bí àwọn ìpìlẹ̀ tàbí ètò àkọ́kọ́ mọ́, láì pinnu pé ẹ̀mí ni wọ́n tàbí pé èròjà ayé lásán ni wọ́n.
- source_word: τί
  choice: èé ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìbéèrè ìdí tí τί ń gbé jáde níbí.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: bí ẹni pé ẹ ṣì ń gbé nínú ayé
  rationale: Ó pa ìfiwéra àti àfojúsùn ὡς mọ́; ‘ṣì’ mú agbára ọ̀rọ̀ Pọ́ọ̀lù hàn pé ikú wọn pẹ̀lú Mèsáyà ti yí ipò wọn padà.
- source_word: δογματίζεσθε
  choice: ẹ fi ń tẹrí ba fún àwọn àṣẹ
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ àárín tàbí àìṣe-taara. ‘Tẹrí ba fún’ fi ipa tí àwọn olùkà fúnra wọn ní nínú fífi ara wọn sábẹ́ àṣẹ hàn, láì pa ìtumọ̀ pé a lè fi àṣẹ lé wọn lórí rẹ́.
theological_decisions:
- issue: Ìtumọ̀ στοιχεῖα nínú lílo Pọ́ọ̀lù
  choice: àwọn ìlànà ìpilẹ̀ṣẹ̀ ti ayé
  alternative: àwọn ẹ̀mí alágbára ti ayé; àwọn èròjà ìpilẹ̀ṣẹ̀ ayé
  rationale: 'Ọ̀rọ̀ Greek náà ní àríyànjiyàn: ó lè tọ́ka sí àwọn ìlànà tàbí ètò ìpilẹ̀ṣẹ̀, àwọn agbára ẹ̀mí, tàbí àwọn èròjà àkọ́kọ́. Ọ̀rọ̀ inú ẹsẹ̀ pa àìdánilójú náà mọ́, àkọsílẹ̀ ìsàlẹ̀ sì ṣàfihàn àwọn àṣàyàn mìíràn.'
- issue: Ìtumọ̀ ohùn δογματίζεσθε
  choice: ẹ fi ń tẹrí ba fún àwọn àṣẹ
  alternative: kí ló dé tí a fi ń fi àwọn ìlànà lé e yín lórí?
  rationale: Fọ́ọ̀mù Greek lè jẹ́ àárín tàbí àìṣe-taara. Àkọ́kọ́ fi ìkópa àwọn olùkà hàn; àṣàyàn inú àkọsílẹ̀ pa ìtumọ̀ pé àwọn ẹlòmíràn ń fi ìlànà lé wọn lórí mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti àdánidá. ‘Ẹ̀yin’ mú ẹni kejì ọ̀pọ̀ hàn kedere; ‘Mèsáyà’ pa oyè Χριστός mọ́. Àmì ìdáwọ́ dúró ní àmì olójú méjì nítorí ẹsẹ̀ tó tẹ̀ lé e ló ṣe àlàyé àwọn àṣẹ náà.
