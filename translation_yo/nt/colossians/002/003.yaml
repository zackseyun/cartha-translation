  source_fidelity: Ìtumọ̀ náà tọ́ka sí Kristi gẹ́gẹ́ bí ẹni tí ᾧ ṣeé ṣe jù lọ láti tọ́ka sí, ó sì pa “gbogbo ìṣúra ọgbọ́n àti ìmọ̀” mọ́. Ṣùgbọ́n “ti fara pamọ́ sí” ní ìparí gbolohun náà kì í jẹ́ ọ̀nà Yorùbá tó péye láti sọ ibi tí ìṣúra náà wà; ó lè dà bí ẹni pé àwọn ìṣúra náà fara pamọ́ fún ẹni kan. “wà ní ìpamọ́” mú predicate ἀπόκρυφοι jáde ní kedere, láìgbẹ́ ìtumọ̀ rẹ̀ sí ọ̀nà ẹ̀kọ́ ìsìn kan.
