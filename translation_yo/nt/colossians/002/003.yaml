  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: yo
  text: Nínú ẹni tí gbogbo ìṣúra ọgbọ́n àti ìmọ̀ wà ní ìpamọ́[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú èyí tí,” bí a bá ka ohun tí ọ̀rọ̀ náà ń tọ́ka sí ní ọ̀nà gbígbòòrò gẹ́gẹ́ bí àṣírí Ọlọ́run dípò Kristi fúnra rẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “tí a pa mọ́ sípamọ́”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí ó fara pamọ́ tàbí tí a pa mọ́ fún ìgbà mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú ẹni tí ... sí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ṣeé ṣe jù lọ láti tọ́ka sí Kristi, ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ ní 2:2; àtẹ̀jáde yìí sì pa ìtumọ̀ ibi tí ἐν ní mọ́.
- source_word: πάντες οἱ θησαυροὶ
  choice: gbogbo ìṣúra
  rationale: Ó fi ìtumọ̀ àpapọ̀ tó dájú hàn, ìyẹn gbogbo ohun iyebíye tí a ń pè ní ìṣúra, láìfi àlàyé kún un.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: ọgbọ́n àti ìmọ̀
  rationale: Ó pa àwọn ọ̀rọ̀ méjèèjì mọ́ gẹ́gẹ́ bí ohun tí wọ́n jọra ṣùgbọ́n tí wọn kò jẹ́ ọ̀kan náà.
- source_word: ἀπόκρυφοι
  choice: ti fara pamọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ìṣúra náà wà ní ìpamọ́, láìpinnu bóyá a kò lè dé ọ̀dọ̀ wọn tàbí a kàn fi wọ́n pamọ́ sí ààbò.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: ti fara pamọ́ sí
  rationale: Àkójọpọ̀ yìí mú ìṣe ọ̀rọ̀-orúkọ àpèjúwe Gíríìkì náà jáde ní Yorùbá àdánidá, ó sì so ibi tí àwọn ìṣúra wà mọ́ Kristi.
theological_decisions:
- issue: Bóyá ἀπόκρυφοι túmọ̀ sí àṣírí tí kò ṣeé dé tàbí ohun tí a fi pamọ́ sí ààbò nínú Kristi
  choice: A túmọ̀ ọ́ láìṣe ojúsàájú sí “ti fara pamọ́.”
  alternative: “tí a tò jọ pamọ́” láti tẹnu mọ́ pípa mọ́ sí ààbò; tàbí “tí ó jẹ́ àṣírí” láti tẹnu mọ́ pé ó fara sin àwọn ẹlòmíràn.
  rationale: Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ kò yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo; nítorí náà, a pa ìforígbárí ìtumọ̀ náà mọ́.
- issue: Ohun tí ᾧ ń tọ́ka sí
  choice: 'A mú un gẹ́gẹ́ bí ó ṣe ń tọ́ka sí Kristi fúnra rẹ̀: “nínú ẹni tí.”'
  alternative: 'Ó lè tọ́ka ní ọ̀nà gbígbòòrò sí àṣírí Ọlọ́run: “nínú èyí tí.”'
  rationale: Kristi ni ẹni tí ó sún mọ́ ọ̀rọ̀ arọ́pò-orúkọ náà jù lọ nínú 2:2, ṣùgbọ́n ìtọ́kasí tó gbòòrò sí àṣírí Ọlọ́run ṣì ṣeé gbà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
