id: COL.2.7
reference: Colossians 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: yo
  text: Ẹ ti gbé gbòǹgbò nínú rẹ̀, a sì ń gbé yín ró nínú rẹ̀; a sì ń mú yín dúró ṣinṣin nínú ìgbàgbọ́[à], gẹ́gẹ́ bí a ti kọ́ yín, ẹ sì ń pọ̀ sí i nínú ìdúpẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: à
    text: Tàbí, “nínú ìgbàgbọ́” ní ìtumọ̀ gbígbẹ́kẹ̀lé; ó tún lè túmọ̀ sí “nínú ìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì pistis lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìṣòtítọ́; ṣùgbọ́n níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí ìgbàgbọ́ tí a ti kọ́ wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: ẹ ti ta gbòǹgbò
  rationale: Ó pa àwòrán ohun ọ̀gbìn mọ́, ó sì fi hàn pé gbígbòǹgbò náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ń bá a lọ.
- source_word: ἐποικοδομούμενοι
  choice: a sì ń gbé yín ró
  rationale: Ó pa àwòrán iṣẹ́ ìkọ́lé àti ìṣe tí ń bá a lọ mọ́; fọ́ọ̀mù aláìṣe tún fi hàn pé àwọn ni a ń gbé ró.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Kristi nínú àyíká ọ̀rọ̀, nítorí náà a pa arọ́pò-orúkọ náà mọ́ láì fi orúkọ tàbí oyè kún un.
- source_word: βεβαιούμενοι
  choice: a sì ń mú yín dúró ṣinṣin
  rationale: Ó sọ ìtumọ̀ jíjẹ́ ẹni tí a mú fìdí rẹ̀ múlẹ̀ tàbí tí a mú dúró ṣinṣin ní èdè Yorùbá àdánidá.
- source_word: τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Àyíká ọ̀rọ̀ àti ‘gẹ́gẹ́ bí a ti kọ́ yín’ tọ́ka sí ìgbàgbọ́ tí wọ́n ti kọ́ wọn, ṣùgbọ́n Yorùbá kò fi àṣàyàn àtẹ̀jáde Gíríìkì hàn ní ọ̀nà kan náà; a kò fi ‘ẹ̀kọ́ ìgbàgbọ́’ kún un kí a má bàa túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: καθὼς ἐδιδάχθητε
  choice: gẹ́gẹ́ bí a ti kọ́ yín
  rationale: Ó pa agbára ìfiwéra καθώς àti ohùn aláìṣe ti ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tó ṣeé lóye.
- source_word: περισσεύοντες
  choice: kí ẹ sì máa kún àkúnwọ́sílẹ̀
  rationale: Gbólóhùn yìí fi ọ̀pọ̀lọpọ̀ tàbí àkúnwọ́sílẹ̀ hàn, ó sì bá ìṣe tí ń tẹ̀ síwájú mu.
- source_word: ἐν εὐχαριστίᾳ
  choice: fún ọpẹ́
  rationale: ‘Ọpẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún εὐχαριστία; ìsopọ̀ rẹ̀ pẹ̀lú ‘kún àkúnwọ́sílẹ̀’ mú ìtumọ̀ ọ̀pọ̀ ọpẹ́ jáde láì di gbolohun líle.
theological_decisions:
- issue: Ìtumọ̀ τῇ πίστει
  choice: nínú ìgbàgbọ́, tí àyíká ọ̀rọ̀ fi hàn gẹ́gẹ́ bí ìgbàgbọ́ tàbí iṣẹ́ tí a ti kọ́ wọn
  alternative: nínú gbígbẹ́kẹ̀lé; nínú ìṣòtítọ́
  rationale: Àtẹ̀jáde náà àti gbólóhùn ‘gẹ́gẹ́ bí a ti kọ́ yín’ ṣe àtìlẹ́yìn fún ìtumọ̀ ohun tí wọ́n gbà gbọ́ tàbí ìgbàgbọ́ tí a kọ́ wọn. Síbẹ̀, a kò fi ọ̀rọ̀ àlàyé bí ‘ẹ̀kọ́ Kristẹni’ sínú ẹsẹ náà, nítorí πίστις lè ní ìtumọ̀ ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìṣòtítọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán méjèèjì—ta gbòǹgbò àti gbígbé ró—mọ́, a sì lò àwọn àmì ohùn ní kíkún níbi tí ó ti yẹ.
