revisions:
- from: Ó pa ìwé gbèsè tí ó kọ lòdì sí wa rẹ́, èyí tí ó dúró lòdì sí wa pẹ̀lú àwọn ìlànà rẹ̀[a]. Ó sì mú un kúrò ní àárín wa[b], ó kan án mọ́ àgbélébùú.
  to: Ó pa ìwé gbèsè tí ó wà lòdì sí wa nínú àwọn ìlànà[a] rẹ́, èyí tí ó lòdì sí wa; ó sì mú un kúrò ní ọ̀nà[b] nípa kíkàn án mọ́ àgbélébùú.
  rationale: A tún gbolóhùn náà ṣe kí “lòdì sí wa” lè ṣàpèjúwe ìwé gbèsè náà, kì í ṣe ìṣe kíkọ ìwé. A lo “nínú àwọn ìlànà” gẹ́gẹ́ bí ìtumọ̀ ìṣọ́ra fún dátífù τοῖς δόγμασιν, a sì fi àwọn ìtumọ̀ mìíràn sílẹ̀ nínú àlàyé [a]. A rọ́pò “ní àárín wa” pẹ̀lú àkànlò “ní ọ̀nà” láì fi ohun tí kò sí nínú Gíríìkì kún un, àti pé a fi “nípa kíkàn án mọ́” hàn gẹ́gẹ́ bí ọ̀nà tí a fi yọ ìwé náà kúrò.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:55Z'
