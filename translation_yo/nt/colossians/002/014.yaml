  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: yo
  text: Ó pa ìwé gbèsè tí ó wà lòdì sí wa nínú àwọn ìlànà[a] rẹ́, èyí tí ó lòdì sí wa; ó sì mú un kúrò ní ọ̀nà[b] nípa kíkàn án mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú àwọn ìlànà” tàbí “tí ó ní àwọn ìlànà nínú.” Ọ̀rọ̀ Gíríìkì náà ní ìbáṣepọ̀ gírámà tí kò dá lójú pátápátá; ó lè ṣàpèjúwe ìwé gbèsè náà gẹ́gẹ́ bí ohun tí a sọ nínú àwọn ìlànà tàbí tí ó ní í ṣe pẹ̀lú wọn. “Ìwé gbèsè” tún lè jẹ́ “ìwé ẹ̀rí gbèsè” tàbí “àkọsílẹ̀ tí a fi ọwọ́ kọ.”
    reason: lexical_alternative_and_syntactic_ambiguity
  - marker: b
    text: Ní ti gidi, “kúrò ní àárín.” Àkànlò Gíríìkì náà túmọ̀ sí yíyọ ohun kan kúrò gẹ́gẹ́ bí ìdènà.
    reason: idiomatic_alternative
lexical_decisions:
- source_word: ἐξαλείψας
  choice: Ó pa ... rẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pípa ohun tí a kọ sílẹ̀ rẹ́ tàbí mímú un kúrò pátápátá; àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: χειρόγραφον
  choice: ìwé gbèsè
  rationale: Ó pa àwòrán ìwé tí a fi ọwọ́ kọ sílẹ̀ gẹ́gẹ́ bí ẹ̀rí gbèsè tàbí ojúṣe mọ́, láì sọ ọ́ di ọ̀rọ̀ òfin pàtó ju bí Gíríìkì ṣe sọ lọ.
- source_word: καθ’ ἡμῶν
  choice: tí ó kọ lòdì sí wa
  rationale: Ó fi hàn pé àkọsílẹ̀ náà jẹ́ ohun tí ó dúró láti dá wa lẹ́bi tàbí lòdì sí wa.
- source_word: τοῖς δόγμασιν
  choice: pẹ̀lú àwọn ìlànà rẹ̀
  rationale: Dátífù náà ní ìtumọ̀ gírámà tí kò dá lójú pátápátá. Èyí so àwọn ìlànà mọ́ ìwé gbèsè náà, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn sílẹ̀.
- source_word: ὑπεναντίον
  choice: tí ó dúró lòdì sí wa
  rationale: Ó pa agbára ìtakò inú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἦρκεν
  choice: Ó sì mú un kúrò
  rationale: Perfect tense tọ́ka sí iṣẹ́ tí a ti parí tí àbájáde rẹ̀ sì ń bá a lọ; gbólóhùn Yorùbá yìí sọ ìmúkúrò náà ní kedere.
- source_word: ἐκ τοῦ μέσου
  choice: kúrò ní àárín wa
  rationale: Ó tẹ̀lé àwòrán ohun tí a mú kúrò láàárín gẹ́gẹ́ bí ìdènà, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé ìtumọ̀ àkànlò náà.
- source_word: προσηλώσας
  choice: ó kan án mọ́
  rationale: Ó fi ìṣe kíkàn mọ́ àgbélébùú hàn gẹ́gẹ́ bí ọ̀nà tí a fi mú ìwé náà kúrò.
- source_word: τῷ σταυρῷ
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún σταυρός nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ χειρόγραφον τοῖς δόγμασιν
  choice: ìwé gbèsè tí àwọn ìlànà rẹ̀ wà lòdì sí wa
  alternative: Òfin Mósè fúnra rẹ̀; àkọsílẹ̀ àwọn ẹ̀ṣẹ̀; ìwé ẹ̀sùn lábẹ́ òfin
  rationale: Ìtumọ̀ náà pa àwòrán ìwé gbèsè àti ojúṣe mọ́, ṣùgbọ́n kò dá a mọ́ ètò ẹ̀kọ́ ìsìn kan ṣoṣo. Àlàyé [a] tún jẹ́ kí àìdánilójú gírámà τοῖς δόγμασιν hàn.
- issue: Ẹni tí ó ṣe ìṣe ἦρκεν
  choice: Ó—ìyẹn Ọlọ́run nínú àyíká gbólóhùn náà—mú un kúrò
  alternative: Kí a fi olùṣe náà sílẹ̀ láì sọ ọ́
  rationale: Àyíká ẹsẹ tó ṣáájú tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe; Yorùbá sì nílò arọ́pò-orúkọ kókó níbí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. A yan “ìwé gbèsè” láti pa àwòrán àkọsílẹ̀ ojúṣe mọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A yà gbólóhùn náà sí méjì fún ìṣàn Yorùbá àdánidá, láì yí ìbáṣepọ̀ àwọn ìṣe náà padà.
