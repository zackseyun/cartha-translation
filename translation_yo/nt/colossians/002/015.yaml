id: COL.2.15
reference: Colossians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: yo
  text: Ó gba àwọn alákòóso àti àwọn aláṣẹ[a] ohun ìjà lọ́wọ́ wọn, ó sì fi wọ́n ṣe àfihàn ní gbangba, nípa mímú wọn rìn nínú ìtòlẹ́sẹẹsẹ ayẹyẹ ìṣẹ́gun nínú rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn alákòóso àti àwọn aláṣẹ” níbí ṣeé ṣe kí ó tọ́ka sí àwọn agbára ẹ̀mí tí ń tako Ọlọ́run.
    reason: Láti ṣàlàyé ìtọ́kasí àwọn ọ̀rọ̀ Pọ́ọ̀lù láì fi ẹ̀kọ́ ẹgbẹ́ ìjọ kan kún un.
  - marker: b
    text: “Nínú rẹ̀” lè túmọ̀ sí nínú Kristi; àwọn mìíràn sì lóye rẹ̀ gẹ́gẹ́ bí ìtọ́kasí sí àgbélébùú tí ẹsẹ tó ṣáájú mẹ́nu kàn.
    reason: Gíríìkì ἐν αὐτῷ ní ìtọ́kasí tí a ń jiyàn lórí; àlàyé náà pa àwọn ojútùú pàtàkì méjèèjì mọ́.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: Ó bọ́ ... ní ohun ìjà wọn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘bọ́ aṣọ kúrò lára’ tàbí ‘gba ohun ìjà/agbara lọ́wọ́.’ Nínú àyíká ìṣẹ́gun lórí àwọn agbára ọ̀run, gbolohun yìí sọ ìtumọ̀ ‘sọ wọ́n di aláìní ohun ìjà’ ní Yorùbá àdánidá, láì sọ pé wọn kò ní agbára kankan mọ́ láéláé.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: àwọn alákòóso àti àwọn aláṣẹ
  rationale: Èyí pa ìyàtọ̀ orúkọ méjèèjì mọ́, ó sì bá lílo Pọ́ọ̀lù fún àwọn agbára tí ó ju ti ènìyàn lọ mu; àlàyé ìsàlẹ̀ ojú ewé jẹ́ kí ìtọ́kasí náà ṣe kedere.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: ó sì fi wọ́n hàn ní gbangba gẹ́gẹ́ bí ẹni tí a ṣẹ́gun
  rationale: Ó mú èrò fífi àwọn ọ̀tá tí a ṣẹ́gun ṣe àfihàn ní gbangba jáde ní èdè Yorùbá tí ó ṣe kedere.
- source_word: θριαμβεύσας αὐτοὺς
  choice: nígbà tí ó mú wọn tẹ̀ lé ara rẹ̀ nínú ìtòlẹ́sẹẹsẹ ayẹyẹ ìṣẹ́gun
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìtòlẹ́sẹẹsẹ ayẹyẹ ìṣẹ́gun, nínú èyí tí ẹni tí ó ṣẹ́gun ń darí àwọn tí a ṣẹ́gun; yíyọ àwòrán yìí jáde dára ju lílo ‘ṣẹ́gun’ nìkan lọ.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì lè tọ́ka sí Kristi (‘nínú rẹ̀’) tàbí, gẹ́gẹ́ bí àwọn kan ṣe lóye rẹ̀, sí àgbélébùú tí ẹsẹ tó ṣáájú mẹ́nu kàn (‘nípasẹ̀ rẹ̀’). Yorùbá ‘nínú rẹ̀’ tẹ̀ lé ìtumọ̀ àkọ́kọ́, pẹ̀lú àlàyé fún ojútùú kejì.
theological_decisions:
- issue: Ta ni ó ṣe iṣẹ́ ìṣẹ́gun náà?
  choice: A fi kókó-ọ̀rọ̀ sílẹ̀ gẹ́gẹ́ bí ‘Ó,’ bí Gíríìkì ṣe ṣe.
  alternative: Láti sọ ní tààrà pé ‘Ọlọ́run’ tàbí ‘Kristi.’
  rationale: Kókó-ọ̀rọ̀ náà wà nínú ọ̀rọ̀-ìṣe Gíríìkì, kò sì tún darúkọ rẹ̀ ní ẹsẹ yìí. Àyíká tó ṣáájú sábà ń tọ́ka sí Ọlọ́run, ṣùgbọ́n yíyan orúkọ kan ní pàtó nínú ẹsẹ yìí yóò yanju ohun tí ìpilẹ̀ kò sọ ní tààrà.
- issue: Ìtọ́kasí ἐν αὐτῷ
  choice: nínú rẹ̀
  alternative: nípasẹ̀ àgbélébùú náà / nínú rẹ̀ gẹ́gẹ́ bí ohun kan
  rationale: Ìrísí ọ̀rọ̀ Gíríìkì fàyè gba ìtọ́kasí sí ẹni tàbí ohun. Ìtumọ̀ pàtàkì tẹ̀ lé ‘nínú Kristi,’ ní ìbámu pẹ̀lú àtúnyẹ̀wò tí a fún wa, ṣùgbọ́n àlàyé pa ojútùú àgbélébùú mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo àwòrán ìtòlẹ́sẹẹsẹ ayẹyẹ ìṣẹ́gun láti mú àkóónú Róòmù-Gíríìkì ti θριαμβεύω yé òǹkàwé, láì lo èdè ìjọ tí ó ṣòro.
