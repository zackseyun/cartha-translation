  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe jẹ́ kí ẹnikẹ́ni dá yín lẹ́jọ́[a] ní ti oúnjẹ tàbí ohun mímu[b], tàbí ní ti àjọ̀dún, oṣù tuntun, tàbí àwọn ọjọ́ Sábáàtì[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ìdájọ́ lé yín lórí.”
    reason: lexical_alternative
  - marker: b
    text: Èyí ni pé, ní ti àwọn ìlànà nípa ohun tí a lè jẹ tàbí mu.
    reason: cultural_note
  - marker: c
    text: 'Àtòjọ “àjọ̀dún, oṣù tuntun, àti àwọn ọjọ́ Sábáàtì” ń tẹ̀lé ìtòlẹ́sẹẹsẹ àwọn ọjọ́ mímọ́ Júù: ti ọdọọdún, ti oṣooṣù, àti ti ọ̀sẹ̀ọ̀sẹ̀.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Nítorí náà, ẹ má ṣe jẹ́ kí ẹnikẹ́ni
  rationale: οὖν jẹ́ àsopọ̀ ìyọrísí, nítorí náà a túmọ̀ rẹ̀ sí “Nítorí náà.” Μὴ pẹ̀lú κρινέτω jẹ́ ìfòfin-deni; ọ̀nà Yorùbá yìí sọ ó ní ti ẹ̀dá láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ὑμᾶς κρινέτω
  choice: dá yín lẹ́jọ́
  rationale: κρίνω níbí túmọ̀ sí dídá ènìyàn lẹ́jọ́ tàbí fífi ìdájọ́ lé e lórí nítorí àwọn ìṣe wọ̀nyí. “Dá yín lẹ́jọ́” jẹ́ gbolohun Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: ní ti oúnjẹ tàbí ohun mímu
  rationale: βρῶσις àti πόσις lè tọ́ka sí jíjẹ/mímu tàbí sí oúnjẹ/ohun mímu. Nínú àkójọ àwọn ọ̀ràn ìlànà yìí, ìtumọ̀ ẹ̀ka ohun tí a ń jẹ àti ohun tí a ń mu bá àyíká mu jù.
- source_word: ἐν μέρει ἑορτῆς
  choice: ní ti àjọ̀dún
  rationale: ἐν μέρει jẹ́ ọ̀rọ̀ àpólà tó túmọ̀ sí “ní ti” tàbí “nípa ọ̀ràn,” kì í ṣe “ní apá kan.” ἑορτή jẹ́ àjọ̀dún ẹ̀sìn.
- source_word: νουμηνίας
  choice: oṣù tuntun
  rationale: Ọ̀rọ̀ náà tọ́ka sí ayẹyẹ oṣù tuntun tí a máa ń ṣe lóṣooṣù. “Oṣù tuntun” pa àwòrán orísun mọ́ ní ọ̀nà tí ó ṣeé lóye.
- source_word: σαββάτων
  choice: àwọn ọjọ́ ìsinmi
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ ọ̀pọ̀, ó sì tọ́ka sí àwọn ọjọ́ Sábáàtì nínú ìtòlẹ́sẹẹsẹ ọdún, oṣù, àti ọ̀sẹ̀. “Àwọn ọjọ́ ìsinmi” jẹ́ èdè Yorùbá adayébá; àlàyé ìsàlẹ̀ ṣàlàyé àkànṣe Sábáàtì rẹ̀.
theological_decisions:
- issue: Ìwà àwọn ìṣe tí a tò sílẹ̀
  choice: Ẹsẹ̀ náà kọ̀ láti jẹ́ kí àwọn ẹlòmíràn dá àwọn onígbàgbọ́ lẹ́jọ́ ní ti ìlànà oúnjẹ, ohun mímu, àti àwọn ọjọ́ mímọ́, láìsọ nínú ẹsẹ̀ yìí pé gbogbo ìṣe náà ti di asán pátápátá.
  alternative: Kí a túmọ̀ ẹsẹ̀ náà bí ìparẹ́ gbogbo irú àjọ̀dún àti Sábáàtì, tàbí bí ohun tó kan àwọn òfin tí ènìyàn dá sílẹ̀ nìkan.
  rationale: Gíríìkì tẹnumọ́ dídá àwọn olùgbọ́ lẹ́jọ́ “ní ti” àwọn ọ̀ràn wọ̀nyí. Ẹsẹ̀ náà fúnra rẹ̀ kò parí gbogbo àríyànjiyàn nípa bóyá wọ́n lè máa ṣe àwọn ayẹyẹ náà; ìtumọ̀ náà kò gbé ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan wọ inú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo “ẹ” àti “yín” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμᾶς. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní tààrà.
