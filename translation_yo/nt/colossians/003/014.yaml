source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: yo
  text: Lórí gbogbo nǹkan wọ̀nyí, ẹ sì wọ ìfẹ́, èyí tí ó jẹ́ ìdè ìpípé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdè ìkúnrẹ́rẹ́” tàbí “ìdè ìdàgbà dé ẹ̀kúnrẹ́rẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Ṣùgbọ́n ju gbogbo nǹkan wọ̀nyí lọ
  rationale: Ó pa ìtẹnumọ́ ‘ju gbogbo wọn lọ’ mọ́, ó sì bá àkàwé aṣọ inú ọ̀rọ̀ tó yí i ká mu.
- source_word: τὴν ἀγάπην
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ṣe kedere fún ἀγάπη ní àyíká yìí.
- source_word: '[implicit verb from context]'
  choice: ẹ gbé ... wọ̀
  rationale: Ọ̀rọ̀-ìṣe ἐνδύσασθε ní ẹsẹ 12 ni acusative yìí gbára lé; ‘gbé ... wọ̀’ tẹ̀ síwájú nínú àkàwé wíwọ aṣọ.
- source_word: ὅ
  choice: èyí tí
  rationale: Ó mú gbólóhùn àlàyé wá láìfi tipátipá yan bóyá antecedent rẹ̀ jẹ́ ìfẹ́ tàbí gbogbo ìgbọ́ràn tó ṣáájú.
- source_word: σύνδεσμος
  choice: ìdè
  rationale: ‘Ìdè’ ṣàfihàn ohun tó so àwọn nǹkan pọ̀, ó sì kúrò nínú àlàyé anatọ́mì tí kò pọndandan.
- source_word: τῆς τελειότητος
  choice: ìpé
  rationale: ‘Ìpé’ lè gba ìtumọ̀ pípé, kíkún, tàbí dídàgbà dé ẹ̀kúnrẹ́rẹ́, ó sì pa kíkún ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ σύνδεσμος τῆς τελειότητος
  choice: A fi ìfẹ́ hàn gẹ́gẹ́ bí ìdè ìpé, láìṣàlàyé genitive náà ju bí Gíríìkì ṣe ṣe lọ.
  alternative: Ìfẹ́ ni ìdè tó so gbogbo ìwà rere pọ̀ dé ìkúnrẹ́rẹ́, tàbí ìdè tí ó jẹ́ ti ìpé.
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìdè tó ń mú ìkúnrẹ́rẹ́ wá, tàbí ìdè tó jẹ mọ́ ìpé. ‘Ìdè ìpé’ pa àìdánilójú tó tọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn.
