  source_fidelity: Ìtumọ̀ náà ń pa ìtumọ̀ gbogbogbò ti ὁ γὰρ ἀδικῶν, ìkìlọ̀ ìsanpadà ọjọ́ iwájú, àti àìsí προσωπολημψία mọ́. Ṣùgbọ́n “yóò gba àìṣòdodo tí ó ṣe padà” lè dà bí ẹni pé ẹni náà yóò gba ìwà àìṣòdodo kan lọwọ́ ẹlòmíràn, kì í ṣe pé yóò gba ohun tí ó yẹ fún àìṣòdodo rẹ̀. “Ẹ̀san fún” mú ìtumọ̀ ìsanpadà/recompense ti κομίσεται hàn kedere.
