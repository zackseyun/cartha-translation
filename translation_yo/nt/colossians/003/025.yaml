  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: yo
  text: Nítorí ẹni tí ó ń ṣe àìṣòdodo yóò gba ẹ̀san fún àìṣòdodo tí ó ṣe[a], kò sì sí ojúsàájú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni tí ó ṣe àìṣòdodo yóò gba ohun tí ó yẹ fún àìṣòdodo tí ó ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò sí ẹlẹ́yàmẹ̀yà.” Ní tààràtà, ọ̀rọ̀ náà ní í ṣe pẹ̀lú “gbígba ojú,” ìyẹn ni, dídájọ́ nípa ipò tàbí ìrísí ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Nítorí ẹni tí ó ń ṣe àìṣòdodo
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde; gbólóhùn “ẹni tí ó ń ṣe àìṣòdodo” sì pa ìtumọ̀ àpapọ̀ ti participle oní-artíkù mọ́ láìfi akọ tàbí abo kún ohun tí Gíríìkì ń sọ nípa gbogbo ènìyàn.
- source_word: κομίσεται
  choice: yóò gba ... padà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí gbígba ohun tí ó bá ìṣe ẹni mu padà. Ìtumọ̀ náà pa àwòrán ìdáhùn-padà mọ́, kò sì sọ ẹni tó ń san án ní pàtó níbi tí Gíríìkì kò ti sọ ọ́.
- source_word: ὃ ἠδίκησεν
  choice: àìṣòdodo tí ó ṣe
  rationale: Èyí so ọ̀rọ̀ náà mọ́ gbòǹgbò ἀδικέω, ó sì tọ́ka sí ìwà tàbí ohun tí kò tọ́ tí ẹni náà ti ṣe.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: kò sì sí ojúsàájú
  rationale: “Ojúsàájú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún fífi ipò, ìrísí, tàbí ẹni tí ẹnì kan jẹ́ ṣe ìdí ìdájọ́ aláìdọ́gba.
theological_decisions:
- issue: Irú àti àkókò ìdájọ́ tí ẹsẹ̀ náà ń tọ́ka sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ìkìlọ̀ gbogbogbò nípa gbígba ohun tí ìwà àìṣòdodo ẹni bá mu wá, láìsọ àkókò tàbí ọ̀nà tí ìdájọ́ náà yóò gbà ṣẹlẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ìdájọ́ ọjọ́ ìkẹyìn, tàbí kí a fi mọ́ ìbáṣepọ̀ ẹrú àti ọ̀gá nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìlànà ìsanpadà àti àìsí ojúsàájú ní gbangba, ṣùgbọ́n kò ṣàlàyé àkókò tàbí gbogbo ọ̀nà ìmúṣẹ rẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ẹni” láti pa ìtumọ̀ gbogbogbò mọ́, a sì fi àmì ohùn sí ibi tí ó bá ìkọ̀wé Yorùbá boṣewa mu.
