id: COL.3.2
reference: Colossians 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: yo
  text: Ẹ máa fi ọkàn yín sí àwọn ohun tí ó wà lókè[a], kì í ṣe àwọn ohun tí ó wà lórí ilẹ̀ ayé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa ronú nípa àwọn ohun tí ó wà lókè.” Ọ̀rọ̀ Gíríìkì náà kò túmọ̀ sí ríronú nìkan; ó tún kan fífi èrò, ìwà ọkàn, tàbí ìfẹ́ sí ohun kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ohun ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: àwọn ohun tí ó wà lókè
  rationale: Gbólóhùn yìí mú ìtumọ̀ ọ̀pọ̀ ti ẹ̀dá Gíríìkì àti ìyàtọ̀ ibi tó wà láàárín ohun òkè àti ohun ayé mọ́.
- source_word: φρονεῖτε
  choice: Ẹ máa fi ọkàn yín sí
  rationale: Ọ̀rọ̀ náà ju ríronú lásán lọ; ó ń tọ́ka sí bí ènìyàn ṣe ń darí èrò, ìfẹ́, àti ìwà ọkàn rẹ̀ sí ohun kan. “Ẹ máa” tún fi hàn pé àṣẹ náà jẹ́ ohun tí wọ́n gbọ́dọ̀ máa ṣe nígbà gbogbo.
- source_word: μὴ
  choice: kì í ṣe
  rationale: Ó fi ohun tí a kò gbọdọ̀ fi ọkàn sí wé ohun tí a pa láṣẹ pé kí a fi ọkàn sí.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: àwọn ohun tí ó wà lórí ilẹ̀ ayé
  rationale: Èyí pa àwòrán ibi nínú Gíríìkì mọ́, ó sì bá “àwọn ohun tí ó wà lókè” ṣe ìyàtọ̀ ní tààrà.
- source_word: γῆς
  choice: ilẹ̀ ayé
  rationale: Nínú ìyàtọ̀ àgbáyé yìí pẹ̀lú “òkè,” ọ̀rọ̀ náà túmọ̀ sí ayé, kì í ṣe ilẹ̀ tàbí agbègbè kan pàtó.
theological_decisions:
- issue: Irú ìṣírí tí φρονεῖτε ń sọ
  choice: Àṣẹ láti máa darí èrò, ìfẹ́, àti ìwà ọkàn sí àwọn ohun ti òkè
  alternative: Àṣẹ tó dín kù sí ríronú nípa ọ̀run nìkan
  rationale: Ìtumọ̀ φρονέω lè kan èrò, ìwà ọkàn, àti ohun tí ènìyàn kà sí pàtàkì. “Fi ọkàn sí” mú agbára ìwà rere àti ti ẹ̀mí yìí jáde láìfi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé yé ni a lò. “Ẹ máa fi ọkàn yín sí” jẹ́ àdánidá ní Yorùbá, ó sì mú ìṣe tí ń bá a lọ nínú present imperative Gíríìkì hàn. A lo “ilẹ̀ ayé” láti yẹra fún ìtumọ̀ ilẹ̀ agbègbè kan.
