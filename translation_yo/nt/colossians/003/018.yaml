source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: yo
  text: Ẹ̀yin aya, ẹ tẹríba fún[a] àwọn ọkọ yín, gẹ́gẹ́ bí ó yẹ[b] nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ fi ara yín sábẹ́ àwọn ọkọ yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ó ti yẹ nínú Olúwa.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìrísí àkókò tí ó kọjá, ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó ní ìtumọ̀ gbogbogbò tí ó ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: Ẹ̀yin aya
  rationale: Nínú ìtọ́ni ilé yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn obìnrin tí wọ́n ní ọkọ, kì í ṣe gbogbo obìnrin; “Ẹ̀yin” mú ìpè tààrà sí wọn hàn ní Yorùbá.
- source_word: ὑποτάσσεσθε
  choice: ẹ tẹríba fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ fífi ara ẹni sí abẹ́ ètò tàbí ìdarí ẹlòmíràn; ó yẹra fún ìtumọ̀ pé ẹlòmíràn fi ipá tẹ ẹni náà sábẹ́.
- source_word: ἀνδράσιν
  choice: àwọn ọkọ yín
  rationale: Ní ìbámu pẹ̀lú “aya” nínú àyíká ìtọ́ni ilé, ἀνήρ túmọ̀ sí ọkọ; “yín” mú ìbáṣepọ̀ náà ṣe kedere ní Yorùbá.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó ń fi ìlànà tàbí bí ohun náà ṣe yẹ hàn, kì í ṣe ìdí tí àṣẹ náà fi wà.
- source_word: ἀνῆκεν
  choice: ó ti yẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà ní ìrísí àkókò tí ó kọjá, gbólóhùn ìtọ́ni yìí lè ní agbára gbogbogbò pé ohun kan yẹ; “ó ti yẹ” jẹ́ àdánidá ní Yorùbá, ó sì pa ìfarahàn ìrísí náà mọ́ láìfi dandan sọ pé ó kan àkókò tí ó kọjá.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ yìí pa gbólóhùn Gíríìkì mọ́, ó sì fi hàn pé ohun tí ó yẹ náà wà láàárín ìbáṣepọ̀ pẹ̀lú Olúwa.
theological_decisions:
- issue: Ìwọ̀n àti ìpìlẹ̀ ìtọ́ni náà
  choice: A so ìtọ́ni náà mọ́ gbólóhùn “gẹ́gẹ́ bí ó ti yẹ nínú Olúwa,” kí ó lè dúró lábẹ́ ìbáṣepọ̀ àti ìfaramọ́ sí Olúwa.
  alternative: Kí a ka a sí àṣà gbogbogbò tí kò ní ààlà, tàbí kí “nínú Olúwa” kan ṣàpèjúwe àwọn aya nìkan.
  rationale: Ipò ἐν κυρίῳ nínú Gíríìkì so ó mọ́ ohun tí ó yẹ. A kò mú àlàyé ẹ̀kọ́ ìgbàgbọ́ míì wọ inú ẹsẹ náà, a sì pa ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Tẹríba fún” jẹ́ ọ̀rọ̀ tó yé òǹkàwé òde òní, ó sì pa ìtumọ̀ fífi ara ẹni sí abẹ́ ètò mọ́ láìsọ pé a fi ipá tẹ ẹni náà sábẹ́.
