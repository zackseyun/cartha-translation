id: COL.3.22
reference: Colossians 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: yo
  text: Ẹ̀yin ẹrú,[a] ẹ máa ṣègbọ́ràn sí àwọn olúwa yín nípa ti ara[c] nínú ohun gbogbo. Ẹ má ṣe ṣiṣẹ́ kìkì nígbà tí wọ́n bá ń wò yín,[b] bí àwọn tó ń wá ojú rere ènìyàn, ṣùgbọ́n ẹ ṣiṣẹ́ pẹ̀lú òtítọ́ inú ọkàn, ní ìbẹ̀rù Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Ẹrú” (Gíríìkì: δοῦλοι) lè tún jẹ́ “ìránṣẹ́,” ṣùgbọ́n ọ̀rọ̀ náà sábà máa ń tọ́ka sí ẹni tí a sọ di ẹrú, tí ó wà lábẹ́ àṣẹ olúwa.'
    reason: lexical_alternative
  - marker: b
    text: Èyí túmọ̀ sí ṣíṣe iṣẹ́ kìkì nígbà tí ẹni tó ń ṣọ́ ẹni bá wà níbẹ̀.
    reason: cultural_note
  - marker: c
    text: “Nípa ti ara” lè tún jẹ́ “ní ayé yìí”; ó tẹnumọ́ pé àṣẹ àwọn olúwa wọ̀nyí jẹ́ ti ìbáṣepọ̀ ènìyàn ní ayé yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Ẹ̀yin ẹrú
  rationale: “Ẹrú” sọ ipò ẹni tí ó wà lábẹ́ àṣẹ olúwa ní kedere, kò sì sọ ọ́ di ìbáṣepọ̀ òṣìṣẹ́ òde òní.
- source_word: ὑπακούετε κατὰ πάντα
  choice: ẹ máa ṣègbọ́ràn ... nínú ohun gbogbo
  rationale: Ó mú àṣẹ ìsinsìnyí àti ìwọ̀n gbólóhùn náà jáde ní Yorùbá àdánidá.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: àwọn olúwa yín nípa ti ara
  rationale: Ó pa ọ̀rọ̀ Paulu “nípa ti ara” mọ́, ó sì fi àṣẹ àwọn olúwa ènìyàn yà sọ́tọ̀ sí ti Olúwa.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: kì í ṣe nígbà tí wọ́n bá ń wò yín nìkan
  rationale: Dípò àkójọpọ̀ ọ̀rọ̀ tí kò wọ́pọ̀, èyí tú ìtumọ̀ rẹ̀ pé iṣẹ́ tí a ṣe kìkì níwájú ẹni tó ń ṣọ́ni.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: bí àwọn tó ń wá ojú rere ènìyàn
  rationale: Ọ̀rọ̀ Yorùbá yìí mú èrò ìwá ẹni tó ń ṣe nǹkan láti tẹ́ ènìyàn lọ́rùn jáde pẹ̀lú ìtumọ̀ àbùkù rẹ̀.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: ṣùgbọ́n pẹ̀lú òtítọ́ inú ọkàn
  rationale: Níhìn-ín ἁπλότης túmọ̀ sí inú tí kò ní ẹ̀tàn àti ìdúróṣinṣin, kì í ṣe àìní ọgbọ́n.
- source_word: φοβούμενοι τὸν κύριον
  choice: kí ẹ máa bẹ̀rù Olúwa
  rationale: Ó pa èrò ìbẹ̀rù Olúwa mọ́, kò sì rọ ọ́ di ọ̀wọ̀ lasán; “Olúwa” tún fi ẹni àtọ̀runwá yà sọ́tọ̀ sí àwọn olúwa ènìyàn.
theological_decisions:
- issue: Ìtọ́ni ìwà rere láàárín ètò ẹrú
  choice: Lo “ẹrú” àti “olúwa” láti sọ ipò ìgbàanì náà ní gbangba, kí a sì pa ìyàtọ̀ láàárín àwọn olúwa nípa ti ara àti Olúwa mọ́.
  alternative: Lílo “ìránṣẹ́” tàbí “òṣìṣẹ́” àti “agbanisíṣẹ́.”
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí ètò ẹrú, kì í ṣe àdéhùn iṣẹ́ òde òní; yíyí i padà sí èdè iṣẹ́ lè bo ìṣòro ìtàn àti ìwà rere inú ẹsẹ náà mọ́lẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A tú ὀφθαλμοδουλία sí gbólóhùn àdánidá dípò ṣíṣe àdàkọ ọ̀rọ̀ tí kì í ṣe Yorùbá. A fi àmì ohùn kún ọ̀rọ̀ níbi tí ó bá yẹ.
