  source_fidelity: 'Ìtúmọ̀ náà pa àwọn ọ̀rọ̀ pàtàkì mọ́ dáadáa: λόγος τοῦ Χριστοῦ jẹ́ “ọ̀rọ̀ Mèsáyà,” ìpè lọwọlọwọ ἐνοικείτω jẹ́ “kí ... máa gbé,” a sì ti fi àìdánilójú ἐν ὑμῖν àti ἐν χάριτι sí àwọn àlàyé ìsàlẹ̀. Ṣùgbọ́n ìṣètò gbolohun akọkọ yí ìbáṣepọ̀ sintasi ti Gíríìkì padà: àwọn sáàmù, orin ìyìn, àti orin tẹ̀mí gbọdọ̀ ṣiṣẹ́ pẹ̀lú ìkọ́ni àti ìkìlọ̀, kì í ṣe pẹ̀lú ìkọ́ni nìkan.'
