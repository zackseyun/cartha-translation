reference: Colossians 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: yo
  text: Kí ọ̀rọ̀ Mèsáyà máa gbé inú yín[a] lọ́pọ̀lọpọ̀ nínú gbogbo ọgbọ́n; ẹ máa fi àwọn sáàmù, orin ìyìn, àti orin tẹ̀mí kọ́ ara yín, kí ẹ sì máa kìlọ̀ fún ara yín; ẹ máa fi oore-ọ̀fẹ́[b] kọrin sí Ọlọ́run nínú ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín yín.” Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà jẹ́ ọ̀pọ̀; ó lè tẹnu mọ́ ọ̀rọ̀ náà tí ń gbé láàárín àwùjọ wọn tàbí nínú àwọn onígbàgbọ́ kọ̀ọ̀kan.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “pẹ̀lú ọpẹ́.” Gbólóhùn Gíríìkì ἐν χάριτι lè túmọ̀ sí oore-ọ̀fẹ́, ìwà rere, tàbí ọpẹ́ ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: ọ̀rọ̀ Mèsáyà
  rationale: “Ọ̀rọ̀” pa ìtúmọ̀ gbòòrò λόγος mọ́, “Mèsáyà” sì fi Χριστός hàn gẹ́gẹ́ bí oyè. Ìsopọ̀ ọ̀rọ̀ méjèèjì kò pinnu bóyá ọ̀rọ̀ náà ti ọ̀dọ̀ Mèsáyà wá tàbí pé ó jẹ́ ọ̀rọ̀ nípa rẹ̀.
- source_word: ἐνοικείτω
  choice: kí ... máa gbé
  rationale: Ìlànà yìí fi ìṣe tí ó ń bá a lọ hàn, ó sì pa àwòrán gbígbé inú ènìyàn tàbí àwùjọ mọ́.
- source_word: ἐν ὑμῖν
  choice: inú yín
  rationale: “Yín” jẹ́ ọ̀pọ̀, “inú yín” sì lè tọ́ka sí inú àwọn onígbàgbọ́ kọ̀ọ̀kan tàbí sí àárín àwùjọ wọn; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
- source_word: πλουσίως
  choice: lọ́pọ̀lọpọ̀
  rationale: Ó sọ ọ̀pọ̀ àti ẹ̀kúnrẹ́rẹ́ tí ọ̀rọ̀ náà fi gbé inú wọn ní Yorùbá àdánidá.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: nínú gbogbo ọgbọ́n
  rationale: A pa ìṣètò Gíríìkì mọ́ láì fi dandan so gbólóhùn náà mọ́ gbígbé nìkan tàbí iṣẹ́ kíkọ́ àti kìlọ̀ nìkan.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: ẹ máa ... kọ́ ara yín, kí ẹ sì máa kìlọ̀ fún ara yín
  rationale: “Kọ́” mú iṣẹ́ ìkọ́ni jáde, “kìlọ̀ fún” sì pa ipa ìtọ́nisọ́nà aláṣekára àti àtúnṣe νουθετέω mọ́. “Ara yín” fi ìṣe tí wọ́n ń ṣe fún ara wọn hàn.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: àwọn sáàmù, orin ìyìn, àti orin tẹ̀mí
  rationale: A pa oríṣi orin mẹ́tẹ̀ẹ̀ta yàtọ̀, a sì so πνευματικαῖς mọ́ “orin” gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ἐν χάριτι
  choice: fi oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” pa ìtumọ̀ χάρις tí ó sun mọ́ fọ́ọ̀mù ọ̀rọ̀ náà mọ́; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ “ọpẹ́” tí ó tún ṣeé ṣe.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: ẹ máa ... kọrin sí Ọlọ́run nínú ọkàn yín
  rationale: Èyí jẹ́ Yorùbá tí ó ṣe kedere, ó sì pa ẹni tí orin ń lọ sí àti ibi inú ọkàn tí orin náà ti ń jáde mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ oyè àti ìpìlẹ̀ Júù rẹ̀ mọ́.
- issue: Agbára àwùjọ tàbí ti ẹnì kọ̀ọ̀kan nínú ἐν ὑμῖν
  choice: inú yín
  alternative: láàárín yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀, ó sì lè ní agbára méjèèjì. Ọ̀rọ̀ àkọ́kọ́ pa fọ́ọ̀mù “inú” mọ́, àlàyé ìsàlẹ̀ sì dáàbò bo ìtumọ̀ àwùjọ.
- issue: Ìtumọ̀ ἐν χάριτι
  choice: fi oore-ọ̀fẹ́
  alternative: pẹ̀lú ọpẹ́
  rationale: χάρις lè túmọ̀ sí oore-ọ̀fẹ́, ìwà rere, tàbí ọpẹ́ ní àyíká yìí. A kò yanjú àìdánilójú náà ní ìkọ̀kọ̀; a fi ọ̀nà kejì sínú àlàyé.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ẹ” àti “yín” láti fi ọ̀pọ̀ ènìyàn hàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹ̀ka kan pàtó.
