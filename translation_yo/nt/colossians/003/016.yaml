  to: Kí ọ̀rọ̀ Mèsáyà máa gbé inú yín[a] lọ́pọ̀lọpọ̀ nínú gbogbo ọgbọ́n; ẹ máa fi àwọn sáàmù, orin ìyìn, àti orin tẹ̀mí kọ́ ara yín, kí ẹ sì máa kìlọ̀ fún ara yín; ẹ máa fi oore-ọ̀fẹ́[b] kọrin sí Ọlọ́run nínú ọkàn yín.
