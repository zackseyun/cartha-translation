id: COL.3.11
reference: Colossians 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: yo
  text: níbi tí kò sí Gíríìkì àti Júù, ìkọlà àti àìkọlà, àjèjì[a], ará Sítíà, ẹrú àti ẹni òmìnira, ṣùgbọ́n Mèsáyà[b] ni ohun gbogbo, ó sì wà nínú gbogbo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí àwọn Gíríìkì ka èdè tàbí àṣà rẹ̀ sí àjèjì; a tún máa ń túmọ̀ rẹ̀ sí “aláìlàjú.”
    reason: historical_context
  - marker: b
    text: Gíríìkì Christos; a túmọ̀ rẹ̀ sí “Mèsáyà” nítorí pé ó jẹ́ oyè níhìn-ín. Ní àṣà ìtumọ̀ kan, “Kristi.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “nínú gbogbo.” Ọ̀rọ̀ Gíríìkì náà kúrú, ó sì lè tọ́ka sí gbogbo ọmọ inú àwùjọ tí a sọ di tuntun; ó tún lè jẹ́ gbólóhùn tó fẹ̀ sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: níbi tí kò sí
  rationale: Ó fi ibi tàbí ipò ìgbésí ayé ẹni tuntun hàn, ó sì pa ìtumọ̀ pé àwọn ìyàtọ̀ wọ̀nyí kò sí nínú rẹ̀ mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: Gíríìkì àti Júù
  rationale: ‘Gíríìkì’ ni ọ̀rọ̀ orísun sọ ní pàtó, kì í ṣe gbogbo àwọn Kèfèrí lápapọ̀.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: ìkọlà àti àìkọlà
  rationale: Àwọn orúkọ àfojúrí méjèèjì dúró fún ìdánimọ̀ ẹ̀sìn àti àwùjọ, bí wọ́n ṣe rí nínú Gíríìkì.
- source_word: βάρβαρος
  choice: àjèjì
  rationale: Nínú àṣà Gíríìkì àtijọ́, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí èdè àti àṣà rẹ̀ yàtọ̀ sí ti Gíríìkì; ‘àjèjì’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye láìfi ẹ̀gàn tí kò pọndandan kún un.
- source_word: Σκύθης
  choice: ará Sítíà
  rationale: Orúkọ ẹ̀yà kan pàtó ni; fífi ‘ará’ kún un jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ẹni tó jẹ́ ọmọ ilẹ̀ tàbí ẹ̀yà náà.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ìyàtọ̀ rẹ̀ sí ẹni òmìnira mú ipò ìdè tó wà nínú ọ̀rọ̀ náà hàn gbangba.
- source_word: ἐλεύθερος
  choice: ẹni òmìnira
  rationale: Ó jẹ́ òdìkejì ‘ẹrú’ ní ti ipò láwùjọ, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ ń sọ ìtumọ̀ oyè náà.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtumọ̀ tó gbòòrò pé Mèsáyà ni gbogbo ohun mọ́, láìsọ ọ́ di ẹ̀kọ́ tóóró ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐν πᾶσιν
  choice: nínú gbogbo wọn
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí gbogbo àwọn tó wà nínú àwùjọ ẹni tuntun. ‘Gbogbo wọn’ jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń jẹ́ kí kíkuru àti fífẹ̀ ọ̀rọ̀ Gíríìkì náà hàn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἐν πᾶσιν
  choice: nínú gbogbo wọn
  alternative: nínú gbogbo; nínú gbogbo ènìyàn; nínú ohun gbogbo
  rationale: Àyíká ẹsẹ náà dá lórí àwọn ènìyàn inú àwùjọ tí a sọ di tuntun, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kúrú, ó sì lè ní ìtumọ̀ tó fẹ̀ sí i. A lo gbolohun tó bá Yorùbá mu, a sì sọ ààyè ìtumọ̀ náà nínú àlàyé.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ ń mú ìtumọ̀ oyè ẹni àmìòróró náà jáde, nígbà tí àlàyé ń tọ́ka sí àṣà ìtumọ̀ ‘Kristi.’
- issue: Bí a ṣe túmọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́; ìránṣẹ́ tí a dè mọ́ iṣẹ́
  rationale: Nítorí pé a fi í ṣe òdìkejì ẹni òmìnira, ipò ẹni tí ẹlòmíràn ní gẹ́gẹ́ bí ohun-ìní hàn gbangba; ‘ẹrú’ ló péye jù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àtòjọ tó rọ̀ mọ́ Gíríìkì mọ́, ṣùgbọ́n a lo ‘ẹni òmìnira’ àti ‘ará Sítíà’ láti jẹ́ kí gbolohun náà jẹ́ Yorùbá àdánidá.
