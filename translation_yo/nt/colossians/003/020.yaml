    rationale: Nítorí ìṣòro gírámà kan náà, a tún ẹsẹ̀-ìsàlẹ̀ náà ṣe kí ó tọ́ka sí “ohun ìtẹ́wọ́gbà” dípò gbolóhùn náà.
