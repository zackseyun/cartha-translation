source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: yo
  text: Ẹ̀yin ọmọ, ẹ máa ṣègbọràn sí àwọn òbí yín nínú ohun gbogbo, nítorí èyí jẹ́ ohun ìtẹ́wọ́gbà[a] nínú Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó dùn mọ́ni.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye “nínú Olúwa” gẹ́gẹ́ bí ṣíṣàpèjúwe ohun tí ó jẹ́ ìtẹ́wọ́gbà nínú ìbáṣepọ̀ ẹni pẹ̀lú Olúwa, kì í ṣe pé ó túmọ̀ sí “ohun tí Olúwa fẹ́” nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Ẹ̀yin ọmọ
  rationale: τέκνα ń tọ́ka sí àwọn ọmọ láì fi akọ tàbí abo sílẹ̀; “Ẹ̀yin ọmọ” jẹ́ ọ̀nà àdánidá láti bá wọn sọ̀rọ̀ ní Yorùbá.
- source_word: ὑπακούετε
  choice: ẹ máa ṣègbọràn
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí gbígbọ́ àti ṣíṣe ohun tí ẹni tó ní àṣẹ sọ. “Ẹ máa ṣègbọràn” fi agbára àṣẹ náà àti ìṣe tí ó ń bá a lọ hàn.
- source_word: τοῖς γονεῦσιν
  choice: sí àwọn òbí yín
  rationale: γονεῦσιν túmọ̀ sí àwọn òbí; “yín” jẹ́ ohun tí èdè Yorùbá ń béèrè lọ́nà àdánidá nínú ọ̀rọ̀ tí a ń sọ tààrà sí àwọn ọmọ.
- source_word: κατὰ πάντα
  choice: nínú ohun gbogbo
  rationale: Gbólóhùn náà ń sọ bí ìgbọràn náà ṣe gbòòrò tó, kì í ṣe pé kí wọ́n ṣègbọràn ní gbogbo ìgbà nìkan.
- source_word: τοῦτο γὰρ
  choice: nítorí èyí
  rationale: “Èyí” ń tọ́ka padà sí ìgbọràn tí a ṣẹ̀ṣẹ̀ pàṣẹ, “nítorí” sì fi ìdí àṣẹ náà hàn.
- source_word: εὐάρεστόν ἐστιν
  choice: jẹ́ ohun tí ó wu ni
  rationale: εὐάρεστος lè túmọ̀ sí ohun tí ó dùn mọ́ni tàbí ohun ìtẹ́wọ́gbà. Ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì jẹ́ kí ìtumọ̀ méjèèjì ṣì ṣeé rí.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: 'Ìtumọ̀ tààrà yìí pa àìdánilójú ti gbólóhùn Pọ́ọ̀lù mọ́: ó lè tọ́ka sí ohun tí ó wu ni láàárín ìbáṣepọ̀ ẹni pẹ̀lú Olúwa, dípò kí a dín in kù sí “tí ó wu Olúwa.”'
theological_decisions:
- issue: Ìbáṣepọ̀ “nínú ohun gbogbo” pẹ̀lú “nínú Olúwa”
  choice: A pa àwọn gbólóhùn méjèèjì mọ́ láì fi àfikún ààlà kankan sínú ẹsẹ náà.
  alternative: Kí a túmọ̀ “nínú Olúwa” gẹ́gẹ́ bí ààlà pé kí àwọn ọmọ ṣègbọràn kìkì nínú ohun tí ó bá ìfẹ́ Olúwa mu, tàbí gẹ́gẹ́ bí “nítorí èyí wu Olúwa.”
  rationale: Gíríìkì kò fi gbólóhùn ìyọkúrò kan kún “nínú ohun gbogbo,” kò sì so “nínú Olúwa” mọ́ ọ̀rọ̀ àṣẹ náà ní tààrà. Ìtumọ̀ náà pa ìfẹ̀ ẹsẹ náà àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́ láì yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó sì ṣeé lóye fún gbogbo ènìyàn. “Ẹ̀yin” àti àmì ọ̀pọ̀ “ẹ” mú kí àdírẹ́sì náà ṣe kedere, nígbà tí “nínú Olúwa” pa ọ̀nà ọ̀rọ̀ Pọ́ọ̀lù mọ́.
