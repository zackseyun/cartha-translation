    issue: “ohun tí ó wu ni” kò pé ní gírámà Yorùbá.
    rationale: Nínú Yorùbá, “wu” ní ìtumọ̀ ‘jẹ́ ohun tí ẹni kan fẹ́ tàbí tí ó dùn mọ́ ẹni’ sábà máa ń ní ẹni/àròkọ tí ó wù, bíi “ó wu ẹni” tàbí “ó wù ú.” Kò yẹ kí a fi ẹni tí Gíríìkì kò sọ sínú ẹsẹ náà. “Ohun ìtẹ́wọ́gbà” pa ìtumọ̀ ‘pleasing/acceptable’ mọ́ láì mú ìṣòro yìí wá.
