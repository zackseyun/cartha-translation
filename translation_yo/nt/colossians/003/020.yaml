  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń fi àwọn ìpín pàtàkì Gíríìkì hàn dáadáa: àdírẹ́sì sí àwọn ọmọ, àṣẹ láti ṣègbọràn sí òbí wọn, ìwọ̀n náà “nínú ohun gbogbo,” àti ìdí tí a fi fún un “nínú Olúwa.” Síbẹ̀, “ohun tí ó wu ni” kò pé ní gírámà Yorùbá, nítorí ìṣe náà sábà máa ń béèrè fún ẹni tí ohun náà wù. “Ohun ìtẹ́wọ́gbà” ń gba ìtumọ̀ εὐάρεστον ní ti tòótọ́ láì ṣàfikún ẹni tí kò sí nínú Gíríìkì.'
  naturalness: “Ẹ̀yin ọmọ, ẹ máa ṣègbọràn sí àwọn òbí yín nínú ohun gbogbo” jẹ́ Yorùbá ìgbàlódé, ó sì rọrùn láti lóye. A tún ìpín ìkẹyìn ṣe sí “èyí jẹ́ ohun ìtẹ́wọ́gbà nínú Olúwa” kí gbolóhùn náà le pé, kí ó sì máa dun dáadáa.
  terminology: “Olúwa” yẹ fún κυρίῳ. “Àwọn òbí yín” ṣọ́ ìtumọ̀ γονεῦσιν mọ́, láì sọ ọ́ di baba àti ìyá ní pàtó. “Ohun ìtẹ́wọ́gbà” jẹ́ ọ̀rọ̀ tó yẹ fún εὐάρεστον; àlàyé ẹsẹ̀-ìsàlẹ̀ náà sì fúnni ní “ohun tí ó dùn mọ́ni” gẹ́gẹ́ bí yíyàn ẹ̀ka-ọrọ̀ míràn.
  issues:
