revisions:
- from: Ẹ̀yin ọmọ, ẹ máa ṣègbọràn sí àwọn òbí yín nínú ohun gbogbo, nítorí èyí jẹ́ ohun tí ó wu ni[a] nínú Olúwa.[b]
  to: Ẹ̀yin ọmọ, ẹ máa ṣègbọràn sí àwọn òbí yín nínú ohun gbogbo, nítorí èyí jẹ́ ohun ìtẹ́wọ́gbà[a] nínú Olúwa.[b]
  rationale: Àtúnṣe náà yọ gbolóhùn tí kò pé ní gírámà kúrò, ó sì rọ́pò rẹ̀ pẹ̀lú “ohun ìtẹ́wọ́gbà,” èyí tí ó bá εὐάρεστόν mu dáadáa. Ó pa àìdánilójú ἐν κυρίῳ mọ́, kò sì fi ààlà tàbí ìtumọ̀ ẹ̀kọ́ ìjọsìn kún àṣẹ “nínú ohun gbogbo.” Àwọn àmì ẹsẹ̀-ìsàlẹ̀ a àti b wà ní ibi tí wọ́n yẹ, wọ́n sì bá ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
