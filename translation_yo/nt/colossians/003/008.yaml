  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: yo
  text: 'Ṣùgbọ́n ní báyìí, ẹ̀yin náà, ẹ mú gbogbo nǹkan wọ̀nyí kúrò lọ́dọ̀ yín: ìbínú, ìrunú, ìwà búburú, ọ̀rọ̀ ẹ̀gàn, àti ọ̀rọ̀ ẹlẹ́gbin láti ẹnu yín.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: ẹ mú ... kúrò lọ́dọ̀ yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan kúrò tàbí fífi í sílẹ̀; ìtumọ̀ yìí jẹ́ àṣẹ tó ṣe kedere ní Yorùbá, ó sì pa àwòrán ìkọ̀sílẹ̀ mọ́.
- source_word: ὀργήν
  choice: ìbínú
  rationale: Ó tọ́ka sí ìbínú tí ó dúró tàbí ìfẹ́ láti fèsì nítorí ohun búburú.
- source_word: θυμόν
  choice: ìrunú
  rationale: Ó yàtọ̀ sí ὀργή nípa fífi ìbínú gbígbóná tí ń ru sókè hàn.
- source_word: κακίαν
  choice: arankàn
  rationale: Nínú àkójọ ìwà tó ń ṣe ẹlòmíràn ní ibi yìí, ‘arankàn’ fi èrò búburú àti ìfẹ́ láti ṣe ibi hàn lọ́nà àdánidá.
- source_word: βλασφημίαν
  choice: ọ̀rọ̀ ẹ̀gàn
  rationale: Nínú àyíká ọ̀rọ̀ nípa ìbáṣepọ̀ ènìyàn, ó lè túmọ̀ sí ọ̀rọ̀ tó ń ba orúkọ ẹlòmíràn jẹ́ tàbí tó ń gàn án; a kò fi dandan sọ ọ́ di ọ̀rọ̀ ẹ̀gàn sí Ọlọ́run nìkan.
- source_word: αἰσχρολογίαν
  choice: ọ̀rọ̀ ìdọ̀tí
  rationale: Ó túmọ̀ sí ọ̀rọ̀ ẹlẹ́gbin, ìtìjú, tàbí ọ̀rọ̀ tí kò bójú mu; yíyan yìí jẹ́ gbígbòòrò bí ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ìtumọ̀ βλασφημία
  choice: ọ̀rọ̀ ẹ̀gàn
  alternative: ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Àyíká àṣẹ nípa ìwà àti ọ̀rọ̀ láàárín ènìyàn kò fi ohun tí a ń gàn hàn gbangba; ìtumọ̀ gbígbòòrò yìí kò fi dandan dín ọ̀rọ̀ náà sí ẹ̀ṣẹ̀ sí Ọlọ́run nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ohùn jẹ́ ti àṣẹ, ṣùgbọ́n ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin náà’ láti pa καὶ ὑμεῖς mọ́.
