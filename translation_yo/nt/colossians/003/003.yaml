translation:
  language: yo
  text: Nítorí ẹ ti kú, a sì ti fi ìyè yín pamọ́[b] pẹ̀lú Mèsáyà[a] nínú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oyè Gíríìkì náà, Χριστός, lè túmọ̀ sí “Mèsáyà” tàbí “Kristi”; níbí a túmọ̀ ọ́ gẹ́gẹ́ bí oyè láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìyè yín farapamọ́.” Perfect Gíríìkì náà lè tẹnu mọ́ ipò tó wà nísinsìnyí gẹ́gẹ́ bí àbájáde ìṣe tí a ti parí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: ẹ̀yin ti kú
  rationale: Ọ̀rọ̀-ìṣe aorist náà tọ́ka sí ikú pàtó kan ní àtijọ́; ìlò “ti kú” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣẹ̀lẹ̀ náà láìfi àlàyé míì kún un.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún ìṣílétí tó ṣáájú hàn; “Nítorí” pa ìsopọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ìyè yín
  rationale: “Ìyè” ni ìtumọ̀ tààrà àti àdánidá fún ζωή ní àyíká yìí; a kò ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ ní kedere.
- source_word: κέκρυπται
  choice: a ti fi … pamọ́
  rationale: Ìkọ́ṣe perfect passive náà sọ ìṣe tí a ti ṣe tí ipò rẹ̀ ṣì ń bá a lọ. Ọ̀nà aláìdárúkọ olùṣe yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára passive náà mọ́.
- source_word: σὺν τῷ Χριστῷ
  choice: pẹ̀lú Mèsáyà
  rationale: σύν túmọ̀ sí “pẹ̀lú,” ó sì fi ìbáṣepọ̀ tàbí ìṣọ̀kan hàn. Χριστός jẹ́ oyè ẹni tí a fòróró yàn, nítorí náà “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: ἐν τῷ θεῷ
  choice: nínú Ọlọ́run
  rationale: ἐν ń tọ́ka sí ibi tàbí àgbègbè ìwàláàyè níbí; “nínú Ọlọ́run” pa ọ̀rọ̀ àti agbára ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́ láìsọ ọ́ di “pẹ̀lú Ọlọ́run.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn. “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí “Kristi” tún jẹ́ ìtumọ̀ tí ó bófin mu.
- issue: Bí a ṣe máa fi perfect passive κέκρυπται hàn
  choice: a ti fi … pamọ́
  alternative: … farapamọ́
  rationale: Àṣàyàn náà mú ìṣe tí a ti parí àti ipò tó ń bá a lọ jọ, láìpinnu ẹni tó ṣe ìṣe náà. Àṣàyàn kejì tẹnu mọ́ ipò ìsinsìnyí ju ìṣe tó ti ṣẹlẹ̀ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ẹ̀yin” láti fi plural ὑμῶν hàn kedere.
