    rationale: Orísun náà ń lo gbolohun àkànlò “sons of disobedience.” Nínú Yorùbá, “àwọn ẹni àìgbọ́ràn” tàbí “àwọn tí àìgbọ́ràn jẹ́ àbùdá wọn” ń ṣàlàyé ìtumọ̀ rẹ̀, kì í ṣe “tàbí” tó ń rọ́pò ìrísí gbolohun náà ní ìpele kan náà.
