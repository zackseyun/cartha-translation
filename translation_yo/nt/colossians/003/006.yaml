  to: Nítorí àwọn nǹkan wọ̀nyí ni ìbínú Ọlọ́run ń bọ̀ sórí àwọn ọmọ àìgbọ́ràn[a].
  rationale: A pa ọ̀rọ̀ ẹsẹ̀ náà mọ́, nítorí ó jẹ́ olóòtítọ́ sí orísun, ó sì jẹ́ Yorùbá adayeba. A tún àlàyé ìsàlẹ̀ ṣe kí ó ṣàlàyé gbolohun àkànlò náà ní kedere, láì fi hàn pé ìtumọ̀ aláìkànlò jẹ́ àṣàyàn ọ̀rọ̀ tó dọ́gba pátápátá.
