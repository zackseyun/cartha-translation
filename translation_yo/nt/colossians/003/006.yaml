  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: yo
  text: Nítorí àwọn nǹkan wọ̀nyí ni ìbínú Ọlọ́run ń bọ̀ sórí àwọn ọmọ àìgbọ́ràn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àwọn tí àìgbọ́ràn jẹ́ àbùdá wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἃ
  choice: Nítorí àwọn nǹkan wọ̀nyí
  rationale: διά pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ ἃ ń fi ìdí hàn; gbólóhùn yìí tọ́ka sí àwọn ìwà búburú tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Ó pa ìṣe àsìkò ìsinsìnyí mọ́, ó sì lè sọ nípa ìdájọ́ Ọlọ́run tó ń bọ̀ láì sọ ìgbà rẹ̀ pàtó.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ìbínú Ọlọ́run
  rationale: Ìbínú jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ὀργή ní ọ̀rọ̀ ìdájọ́ Ọlọ́run, ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- source_word: ἐπὶ
  choice: sórí
  rationale: Pẹ̀lú accusative níbí, ἐπί ń tọ́ka sí àwọn tí ìbínú náà máa dé bá; “sórí” jẹ́ àfihàn àdánidá ní Yorùbá.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: àwọn ọmọ àìgbọ́ràn
  rationale: Èdè àkànlò Semitic yìí túmọ̀ sí àwọn ènìyàn tí àìgbọ́ràn jẹ́ àbùdá wọn. “Àwọn ọmọ àìgbọ́ràn” pa àwòrán orísun mọ́, ó sì yàgò fún fífi ọkùnrin nìkan hàn níbi tí gbolohun náà ti ń tọ́ka sí ẹgbẹ́ ènìyàn.
theological_decisions:
- issue: Bóyá kí a pa àkànlò “àwọn ọmọ àìgbọ́ràn” mọ́ tàbí kí a túmọ̀ ìtumọ̀ rẹ̀ tààrà
  choice: Pa “àwọn ọmọ àìgbọ́ràn” mọ́ nínú ẹsẹ, kí àlàyé wà ní àlàyé ìsàlẹ̀ ojú ìwé
  alternative: àwọn tí wọ́n jẹ́ aláìgbọ́ràn
  rationale: Yíyan yìí pa àwòrán àti ìfarahàn ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń ṣàlàyé pé kì í ṣe ìbátan ọmọ nípa ti ara ni gbolohun náà ń sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ adayeba, ọlọ́wọ̀, ó sì pa àkànlò àti ìmọ̀lára ìdájọ́ inú orísun mọ́.
