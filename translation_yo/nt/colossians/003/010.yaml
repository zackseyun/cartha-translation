  source_fidelity: Ìtumọ̀ náà fi ìtakora ‘ẹni tuntun’ àti ẹni àtijọ́ hàn, ó sì pa ìṣe tí ó ti ṣẹlẹ̀ nínú ἐνδυσάμενοι àti ìṣe àfaragà tí ń tẹ̀síwájú nínú ἀνακαινούμενον mọ́. ‘Ẹni tí ó dá a’ lè tọ́ka sí ẹni tuntun gẹ́gẹ́ bí αὐτόν ṣe ń ṣe. Síbẹ̀, ‘sí ìmọ̀’ lẹ́yìn ‘a ń sọ di tuntun’ kì í rọrùn nínú Yorùbá; ‘nínú ìmọ̀’ jẹ́ àdánidá, ó sì bá lílo εἰς ἐπίγνωσιν nínú àyíká yìí mu.
