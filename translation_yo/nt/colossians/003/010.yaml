source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: yo
  text: ẹ sì ti gbé ẹni tuntun[a] wọ̀, ẹni tí a ń sọ di tuntun nínú ìmọ̀[b], ní ìbámu pẹ̀lú àwòrán ẹni tí ó dá a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ènìyàn tuntun.” Ọ̀rọ̀ Gíríìkì yìí tako “ènìyàn àtijọ́” nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìmọ̀ kíkún.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìmọ̀ tí ó kún tàbí ìmọ̀ jinlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: ẹ sì ti gbé … wọ̀
  rationale: Ó pa àkàwé aṣọ mọ́, ó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ tí ń sọ nípa bíbọ́ ẹni àtijọ́ sílẹ̀ àti gbígbé ẹni tuntun wọ̀.
- source_word: τὸν νέον
  choice: ẹni tuntun
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ẹni tuntun ní ìtakora sí ẹni àtijọ́. ‘Ẹni tuntun’ jẹ́ Yorùbá àdánidá, kò sì fi ọ̀rọ̀ náà mọ́ akọ nìkan.
- source_word: ἀνακαινούμενον
  choice: ẹni tí a ń sọ di tuntun
  rationale: Ìtumọ̀ yìí pa ohùn àfaragà àti ìṣe tí ń bá a lọ mọ́.
- source_word: εἰς ἐπίγνωσιν
  choice: sí ìmọ̀
  rationale: ‘Sí’ fi ìlọsíwájú tàbí àbájáde ìsọdituntun hàn, nígbà tí ‘ìmọ̀’ kò fi agbára ọ̀rọ̀ náà ga ju ohun tí Gíríìkì sọ lọ.
- source_word: κατ’ εἰκόνα
  choice: ní ìbámu pẹ̀lú àwòrán
  rationale: Ó sọ pé àwòrán náà ni àwòṣe tàbí òṣùwọ̀n ìsọdituntun, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú èdè Gẹnẹsisi mọ́.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: Ẹni tí ó dá a
  rationale: Ó pa àgbékalẹ̀ apólówó Gíríìkì mọ́, ‘a’ sì lè tọ́ka sí ẹni tuntun láìfipá yan akọ.
theological_decisions:
- issue: Ìtumọ̀ τὸν νέον nínú ọ̀rọ̀ nípa irú ẹni tí onígbàgbọ́ di
  choice: ẹni tuntun
  alternative: ènìyàn tuntun
  rationale: ‘Ẹni tuntun’ pa ìtakora pẹ̀lú ẹni àtijọ́ mọ́, ó sì lè gba ìtumọ̀ ẹni kọ̀ọ̀kan àti ti àwùjọ láìfi akọ kún ohun tí ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Bí agbára ἐπίγνωσις ṣe yẹ kí ó hàn
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún
  rationale: ‘Ìmọ̀’ pa àìdánilójú ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ni ó mẹ́nu kan ìtumọ̀ ìmọ̀ tí ó kún tàbí jinlẹ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àkàwé gbígbé aṣọ wọ̀ àti ìlọsíwájú ìsọdituntun mọ́. Àwọn àmì àlàyé ni a tún tò kí ọkọọkan lè tẹ̀ lé ọ̀rọ̀ tí ó ń ṣàlàyé.
