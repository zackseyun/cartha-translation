  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: yo
  text: Ǹjẹ́ bí a bá[a] ti jí yín dìde pẹ̀lú Mèsáyà, ẹ máa wá àwọn ohun tí ó wà lókè, níbi tí Mèsáyà wà, tí ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Níwọ̀n bí a ti jí yín dìde pẹ̀lú Mèsáyà.” Èdè Gíríìkì pa ọ̀rọ̀ náà mọ́ ní ìrísí ‘bí ... bá’, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí Pọ́ọ̀lù máa gbé ọ̀rọ̀ náà kalẹ̀ gẹ́gẹ́ bí ohun tí ó jẹ́ òtítọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Ǹjẹ́ bí ... bá
  rationale: Ó pa ìrísí gbólóhùn oníṣ şart ti Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ọ̀rọ̀ ìparí èrò mọ́ ohun tí a ti sọ ṣáájú.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: a bá ti jí yín dìde pẹ̀lú Mèsáyà
  rationale: ‘Jí yín dìde’ fi ohùn àfarawà náà hàn, ‘pẹ̀lú’ sì pa ìtumọ̀ ìdàpọ̀ tàbí ìbáṣepọ̀ mọ́; ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè.
- source_word: τὰ ἄνω
  choice: àwọn ohun tí ó wà lókè
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà àti ìtúmọ̀ gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì fi ‘ọ̀run’ kún un nípasẹ̀ ìtumọ̀.
- source_word: ζητεῖτε
  choice: ẹ máa wá
  rationale: Àṣẹ oníṣe-títẹ̀síwájú yìí fi hàn pé kí wọ́n máa darí ìfẹ́ àti ìsapá wọn sí àwọn ohun náà nígbà gbogbo.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: tí ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ó pa àwòrán ipò ọlá àti àṣẹ mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí ó ṣeé lóye ní Yorùbá.
theological_decisions:
- issue: Agbára gbólóhùn oníṣ şart Εἰ
  choice: Pa ‘bí ... bá’ mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘Níwọ̀n bí a ti jí yín dìde...’
  rationale: Àyíká ọ̀rọ̀ lè fi hàn pé Pọ́ọ̀lù gbà á gẹ́gẹ́ bí òtítọ́, ṣùgbọ́n Gíríìkì lo ìrísí oníṣ şart; ìtumọ̀ náà kò yẹ kí ó mú ìṣòro yẹn kúrò láìdábàá.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí, oyè Ẹni Àmì-òróró náà ṣì ní agbára, nítorí náà ‘Mèsáyà’ ni a lò dípò yíyí ọ̀rọ̀ náà padà sí orúkọ lásán.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣeé lóye fún gbogbo ènìyàn. A lo ‘ẹ máa wá’ fún àṣẹ tí ń bá a lọ, a sì pa àwòrán ‘ọwọ́ ọ̀tún Ọlọ́run’ mọ́.
