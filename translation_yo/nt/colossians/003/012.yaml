id: COL.3.12
reference: Colossians 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: yo
  text: Nítorí náà, gẹ́gẹ́ bí àwọn àyànfẹ́ Ọlọ́run, àwọn ẹni mímọ́ àti àwọn tí a fẹ́ràn, ẹ gbé inú àánú wọ̀[a], pẹ̀lú inú rere, ìrẹ̀lẹ̀, ìwà tútù[b], àti sùúrù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘ẹ wọ àwọn ẹ̀yà inú àánú.’ Gíríìkì ń lo àwọn ẹ̀yà inú gẹ́gẹ́ bí àwòrán ibi tí ìmọ̀lára àánú jíjinlẹ̀ ti ń jáde.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘ìwà pẹ̀lẹ́.’
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni fífaradà fún ìgbà pípẹ́ láì tètè bínú.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: ẹ ... wọ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí ‘ẹ wọ̀’ ní àkàwé bí aṣọ; ó ń rọ àwọn onígbàgbọ́ láti gba àwọn ìwà rere wọ̀nyí gẹ́gẹ́ bí ohun tí wọ́n fi bo ara wọn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ ìyànjú yìí so mọ́ ohun tí ó ṣáájú.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: 'Ó pa agbára ìdánimọ̀ mọ́: kí ìwà wọn bá ipò tí wọ́n ní mu, láì sọ ọ́ di ìdí nìkan.'
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: àwọn àyànfẹ́ Ọlọ́run
  rationale: Ó sọ ní kedere pé Ọlọ́run ni ó yàn wọ́n, láì fi ètò ẹ̀kọ́ ìsìn kan pàtó kún ọ̀rọ̀ náà.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: ẹni mímọ́ àti olùfẹ́
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń ṣàpèjúwe àwọn àyànfẹ́ náà; ‘olùfẹ́’ fi hàn pé Ọlọ́run fẹ́ràn wọn, bí ó tilẹ̀ jẹ́ pé olùṣe ìfẹ́ náà kò tún hàn gbangba nínú Gíríìkì.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: inú àánú
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí àwọn ẹ̀yà inú tí a kà sí ibùdó ìmọ̀lára; ‘inú àánú’ jẹ́ àkànlò Yorùbá àdánidá fún àánú jíjinlẹ̀, ó sì pa àwòrán inú mọ́.
- source_word: χρηστότητα
  choice: inú rere
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere láti sọ ìwà rere sí ẹlòmíràn.
- source_word: ταπεινοφροσύνην
  choice: ìrẹ̀lẹ̀
  rationale: Ó fi ìrònú àti ìwà onírẹ̀lẹ̀ hàn ní èdè Yorùbá òde òní.
- source_word: πραΰτητα
  choice: ìwà tútù
  rationale: Ó túmọ̀ sí ìwà pẹ̀lẹ́ tí a kó níjàánu, kì í ṣe àìlera.
- source_word: μακροθυμίαν
  choice: sùúrù
  rationale: Nínú àkójọ ìwà rere yìí, ó tọ́ka sí fífaradà ènìyàn fún ìgbà pípẹ́ láì tètè bínú.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἐκλεκτοὶ τοῦ θεοῦ láì gbé ẹ̀kọ́ ìsìn kan pàtó wọ inú rẹ̀
  choice: àwọn àyànfẹ́ Ọlọ́run
  alternative: àwọn tí Ọlọ́run yàn
  rationale: ‘Àwọn àyànfẹ́ Ọlọ́run’ pa ìtumọ̀ yíyàn Ọlọ́run mọ́, ṣùgbọ́n ẹsẹ̀ yìí kò ṣàlàyé ọ̀nà tàbí ìtòlẹ́sẹẹsẹ yíyàn náà.
- issue: Ẹni tí ó fẹ́ràn àwọn olùgbọ́ nínú ἠγαπημένοι
  choice: olùfẹ́
  alternative: àwọn tí Ọlọ́run fẹ́ràn
  rationale: Ìyíká ọ̀rọ̀ náà lè tọ́ka sí ìfẹ́ Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò dárúkọ olùṣe; yíyan ‘olùfẹ́’ ń pa àìsọ̀rọ̀-kedere yẹn mọ́.
- issue: Agbára ìwà inú πραΰτης
  choice: ìwà tútù
  alternative: ìwà pẹ̀lẹ́
  rationale: ‘Ìwà tútù’ jẹ́ ìwà pẹ̀lẹ́ tí kì í túmọ̀ sí àìlera, ó sì yẹ fún àkójọ ìwà Kristẹni yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, a sì pa àkàwé wíwọ aṣọ mọ́. Ìtò ọrọ̀ ‘ẹ gbé inú àánú wọ̀’ jẹ́ ewì díẹ̀, ṣùgbọ́n ó jẹ́ àdánidá tó àti pé ó ń gbìmọ̀ pọ̀ mọ́ àwọn orúkọ ìwà rere tó tẹ̀ lé e.
