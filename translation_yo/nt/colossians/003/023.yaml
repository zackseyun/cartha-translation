  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: yo
  text: Ohunkóhun tí ẹ bá ń ṣe, ẹ ṣe é pẹ̀lú gbogbo ọkàn yín, gẹ́gẹ́ bí ẹni tí ń ṣiṣẹ́ fún Olúwa, kì í sì í ṣe fún ènìyàn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “láti inú ọkàn.” Ó tún lè túmọ̀ sí “tọkàntọkàn” tàbí “pẹ̀lú gbogbo ọkàn.”'
    reason: lexical_alternative
  - marker: b
    text: “Olúwa” lè ní ìfẹ̀hàn “Ọ̀gá” nínú àyíká ìtọ́ni fún àwọn ẹrú àti àwọn ọ̀gá. “Ènìyàn” níbí jẹ́ ọ̀rọ̀ gbogbogbò fún ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Ohunkóhun tí ẹ bá ń ṣe
  rationale: Àkópọ̀ ọ̀rọ̀ arọ́pò-orúkọ àìdánimọ̀ pẹ̀lú ἐάν ń tọ́ka sí ohun gbogbo tí ó lè jẹ́ pé wọ́n ń ṣe; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ἐκ ψυχῆς
  choice: ẹ fi gbogbo ọkàn yín
  rationale: Ní tààrà, gbólóhùn náà túmọ̀ sí ‘láti inú ọkàn/ẹ̀mí’; ní Yorùbá, ‘fi gbogbo ọkàn’ fi òótọ́ inú àti fífi gbogbo ara sí iṣẹ́ hàn ní kedere láì sọ àwòrán ọ̀rọ̀ náà nù.
- source_word: ἐργάζεσθε
  choice: ṣiṣẹ́
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pè wọ́n sí ṣíṣe iṣẹ́ pẹ̀lú ìsapá; ‘ṣiṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àyíká iṣẹ́ ilé mu.
- source_word: ὡς τῷ κυρίῳ
  choice: bí ẹni pé fún Olúwa ni
  rationale: ὡς ń fi ojú-ìwòye tàbí ọ̀nà ṣíṣe hàn; ‘bí ẹni pé fún Olúwa ni’ sọ ìdarí iṣẹ́ náà sí Olúwa ní Yorùbá àdánidá.
- source_word: καὶ οὐκ ἀνθρώποις
  choice: kì í ṣe fún ènìyàn
  rationale: ἀνθρώποις jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; Yorùbá lè lo ‘ènìyàn’ ní ẹyọ-orúkọ fún ẹ̀dá ènìyàn lápapọ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká ẹrú àti olúwa
  choice: Olúwa
  alternative: ọ̀gá
  rationale: Ní àyíká yìí, κύριος tọ́ka sí Kristi gẹ́gẹ́ bí Olúwa, bí ẹsẹ tó tẹ̀ lé e ṣe mú un túbọ̀ hàn. Síbẹ̀, àyíká ilé mú ìtumọ̀ ‘ọ̀gá’ wà ní abẹ́lẹ̀; àlàyé ìsàlẹ̀ pa ìfararora yìí mọ́ láì dá wọn pọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ọ̀rọ̀ ọ̀wọ̀/plural ‘ẹ’ gẹ́gẹ́ bí Gíríìkì ṣe lo ọ̀pọ̀ ènìyàn. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò.
