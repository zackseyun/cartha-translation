id: COL.3.5
reference: Colossians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: yo
  text: 'Nítorí náà, ẹ pa àwọn ẹ̀yà ara tí ó wà lórí ilẹ̀ ayé[a] run: ìṣekúṣe, ìwà àìmọ́, ìfẹ́kúfẹ̀ẹ́, ìfẹ́-ọkàn búburú, àti ojúkòkòrò[b], èyí tí í ṣe ìbọ̀rìṣà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun gbogbo inú yín tí ó jẹ́ ti ayé.” Gíríìkì sọ ní tààràtà pé, “àwọn ẹ̀yà ara tí ó wà lórí ilẹ̀ ayé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwọra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: ẹ pa … run
  rationale: Àṣẹ aorist náà ń béèrè ìgbésẹ̀ tó lágbára, tó sì ṣe pàtó; ‘pa … run’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa àwòrán ikú mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ yìí hàn láti inú àlàyé tó ṣáájú.
- source_word: μέλη
  choice: àwọn ẹ̀yà ara
  rationale: Ó pa àwòrán àwọn ẹ̀yà ara mọ́ láì yí i padà sí ‘ìwà ẹ̀dá ayé,’ èyí tí yóò ti túmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: tí ó wà lórí ilẹ̀ ayé
  rationale: Ìtumọ̀ yìí pa àwòrán ibi/sáyé inú Gíríìkì mọ́; àlàyé ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: πορνείαν
  choice: ìṣekúṣe
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà ìbálòpọ̀ tí kò tọ́, láì dín ìtumọ̀ Gíríìkì kù sí irú ẹ̀ṣẹ̀ kan ṣoṣo.
- source_word: ἀκαθαρσίαν
  choice: ìwà àìmọ́
  rationale: Ó dúró fún àìmọ́ nípa ìwà, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe máa ń rí nínú Pọ́ọ̀lù.
- source_word: πάθος
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Nínú àkójọ ìwà búburú yìí, ọ̀rọ̀ náà tọ́ka sí ìfẹ́ tàbí ìtara líle tí kò bófin mu; ‘ìfẹ́kúfẹ̀ẹ́’ ṣe kedere ní Yorùbá.
- source_word: ἐπιθυμίαν κακήν
  choice: ìfẹ́-ọkàn búburú
  rationale: Ó pa orúkọ ‘ìfẹ́-ọkàn’ àti àpèjúwe ìwà búburú rẹ̀ mọ́ ní kíkún.
- source_word: πλεονεξίαν
  choice: ojúkòkòrò
  rationale: Ó túmọ̀ sí ìfẹ́ oníwọra láti ní púpọ̀ sí i; ‘ojúkòkòrò’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, pẹ̀lú àṣàyàn mìíràn nínú àlàyé ìsàlẹ̀.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: èyí tí í ṣe ìbọ̀rìṣà
  rationale: Ó pa ìdánimọ̀ líle tí Pọ́ọ̀lù ṣe mọ́ láì sọ ọ́ di ‘ó dà bí’; ‘èyí’ ń tọ́ka lọ́nà àdánidá sí ojúkòkòrò tó wà lẹ́sẹ̀kẹsẹ̀ ṣáájú rẹ̀.
theological_decisions:
- issue: Ohun tí ‘èyí tí í ṣe ìbọ̀rìṣà’ ń tọ́ka sí
  choice: Ó tọ́ka pàtó sí ‘ojúkòkòrò.’
  alternative: Ó lè jẹ́ àkótán gbogbo àkójọ ìwà búburú tó ṣáájú.
  rationale: Arọ́pò-orúkọ Gíríìkì ἥτις jẹ́ abo ẹyọ kan, ó sì bá πλεονεξίαν, orúkọ abo ẹyọ kan tó sún mọ́ ọn jù lọ, mu.
- issue: Ìtumọ̀ ‘àwọn ẹ̀yà ara tí ó wà lórí ilẹ̀ ayé’
  choice: A pa àwòrán ẹ̀yà ara inú Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ohun gbogbo inú yín tí ó jẹ́ ti ayé; ìwà ẹ̀dá ayé yín.
  rationale: Gíríìkì sọ ‘àwọn ẹ̀yà ara’; àkójọ tó tẹ̀ lé e lè ṣàlàyé ohun tí àwòrán náà dúró fún. Pípa àwòrán náà mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò hàn gbangba sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní ìlànà ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí Νεκρώσατε ṣe jẹ́ ọ̀pọ̀.
