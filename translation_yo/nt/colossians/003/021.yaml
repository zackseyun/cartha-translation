  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: yo
  text: Ẹ̀yin baba, ẹ má ṣe mú inú àwọn ọmọ yín bí, kí wọ́n má bàa rẹ̀wẹ̀sì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n má bàa pàdánù ìgboyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Ẹ̀yin baba
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn baba ní pàtó; ó bójú mu àyíká àwọn ìtọ́ni fún onírúurú ipa nínú agbo ilé.
- source_word: μὴ ἐρεθίζετε
  choice: ẹ má ṣe mú ... bínú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí àwọn baba má ṣe hùwà tí yóò máa ru ìbínú tàbí ìrẹ̀wẹ̀sì sókè nínú àwọn ọmọ wọn.
- source_word: τὰ τέκνα ὑμῶν
  choice: àwọn ọmọ yín
  rationale: Ó jẹ́ ọ̀rọ̀ àpapọ̀ fún gbogbo ọmọ, láìfi akọ tàbí abo sílẹ̀.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ó pa agbára ète tàbí àbájáde tí ἵνα μή ní mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἀθυμῶσιν
  choice: kí ọkàn wọn má bàa rẹ̀wẹ̀sì
  rationale: Àṣàyàn yìí fi ìpàdánù ìgboyà àti okun inú tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n àwọn tí πατέρες ń bá sọ
  choice: Àwọn baba ní pàtó
  alternative: Àwọn òbí lápapọ̀
  rationale: Gíríìkì náà sọ ‘àwọn baba’ ní tààrà; bí ìlànà náà tilẹ̀ lè wúlò fún gbogbo òbí, ìtumọ̀ kò yẹ kí ó sọ ẹni tí a ń bá wí di gbòòrò ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé yé. ‘Ẹ̀yin baba’ jẹ́ àdírẹ́sì tààrà; ‘ọkàn wọn rẹ̀wẹ̀sì’ jẹ́ àfihàn Yorùbá àdánidá fún ìrẹ̀wẹ̀sì inú tàbí pípa ìgboyà nù.
