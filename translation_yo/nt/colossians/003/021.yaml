revisions:
- from: Ẹ̀yin baba, ẹ má ṣe mú àwọn ọmọ yín bínú, kí ọkàn wọn má bàa rẹ̀wẹ̀sì.[a]
  to: Ẹ̀yin baba, ẹ má ṣe mú inú àwọn ọmọ yín bí, kí wọ́n má bàa rẹ̀wẹ̀sì.[a]
  rationale: The revision retains the source’s specific address to fathers and its purposive warning, while using a broader, natural Yoruba expression for provoking or embittering children. The footnote is adjusted to a closer Yoruba equivalent of ‘lose heart.’
