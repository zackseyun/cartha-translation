  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: yo
  text: Ẹ̀yin ọkọ, ẹ fẹ́ràn àwọn aya yín, ẹ má sì ṣe hùwà líle sí wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe ní ìkorò sí wọn,” tàbí “ẹ má ṣe di ẹni oníìkorò sí wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí níní ìkorò sí wọn, ṣùgbọ́n nínú àyíká yìí ó tún ń tọ́ka sí ìwà líle tàbí ìwà ìbínú sí wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Ẹ̀yin ọkọ
  rationale: Ní àyíká ìtọ́ni ilé yìí, ἀνήρ ń tọ́ka sí ọkọ, kì í ṣe àwọn ọkùnrin lápapọ̀; ọ̀rọ̀ ìpè Yorùbá “Ẹ̀yin ọkọ” mú kí ẹni tí a ń bá sọ ṣe kedere.
- source_word: ἀγαπᾶτε
  choice: ẹ máa nífẹ̀ẹ́
  rationale: Ó fi àṣẹ ìṣe tí ó yẹ kí ó máa bá a lọ hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ἀγαπάω mọ́.
- source_word: τὰς γυναῖκας
  choice: àwọn aya yín
  rationale: γυνή túmọ̀ sí aya ní àyíká ìgbéyàwó yìí; “yín” jẹ́ ohun tí Yorùbá nílò láti fi ìbáṣepọ̀ àwọn ọkọ àti aya wọn hàn ní kedere.
- source_word: μὴ πικραίνεσθε
  choice: ẹ má sì máa fi ìkorò hùwà
  rationale: πικραίνω ní èrò ìkorò tàbí líle ọkàn nínú rẹ̀; gbólóhùn yìí sọ ipa rẹ̀ nínú ìbáṣepọ̀ lọ́nà Yorùbá tí ó ṣe kedere láì sọ pé ó jẹ́ ìwà líle nìkan.
- source_word: πρὸς αὐτάς
  choice: sí wọn
  rationale: Ó fi ẹni tí ìwà tàbí ìmọ̀lára náà dojú kọ hàn, ó sì bá ìlò Yorùbá mu.
theological_decisions:
- issue: Ìtọ́ni ilé àti ọ̀rọ̀ tí ó dá lórí akọ àti abo
  choice: Pa ìpè pàtó sí àwọn ọkọ àti ìtọ́ka sí aya wọn mọ́.
  alternative: Lo “àwọn ọkùnrin” àti “àwọn obìnrin” ní ìtumọ̀ gbòòrò.
  rationale: Àyíká Gíríìkì jẹ́ ti ìgbéyàwó ní pàtó, nítorí náà ẹsẹ̀ náà ń sọ fún àwọn ọkọ nípa bí wọn ṣe yẹ kí wọ́n hùwà sí aya wọn.
- issue: Ìtumọ̀ ìkorò nínú πικραίνεσθε
  choice: Lo “fi ìkorò hùwà” kí a lè pa ìkorò inú àti ìwà tí ó ń jáde láti inú rẹ̀ pọ̀ mọ́.
  alternative: “Má ṣe le sí wọn” tàbí “má ṣe di ẹni tí ó ní ìkorò sí wọn.”
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí dídi ẹni tí ó ní ìkorò tàbí sí ìwà líle tí ìkorò ń mú wá; àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn yẹn mọ́ láì fi tipátipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ máa” fún àwọn àṣẹ ọ̀pọ̀ ènìyàn, kí ìtọ́ni náà sì dún bí Yorùbá àdánidá.
