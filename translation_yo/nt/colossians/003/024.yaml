  terminology: “Olúwa” pa κύριος mọ́, “Mèsáyà” sì fara mọ́ ipinnu láti tú Χριστός gẹ́gẹ́ bí akọ́lé. “Sìn” bá δουλεύετε mu ní àyíká ìránṣẹ́/olúwa, láì fi ìtumọ̀ ẹ̀sìn tàbí ẹ̀kọ́ ìjọ kan kún un.
