base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: yo
  text: Ẹ mọ̀ pé lọ́wọ́ Olúwa ni ẹ ó gba ẹ̀san ogún náà. Olúwa Mèsáyà ni ẹ ń sìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ìkéde pé “ẹ ń sìn,” kì í ṣe àṣẹ tààrà pé “ẹ sin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Ẹ mọ̀ pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ń tẹ̀ síwájú láti inú ìṣírí ẹsẹ̀ tó ṣáájú. Èdè Yorùbá yìí jẹ́ ti ẹ̀dá, kò sì fi dandan sọ bóyá ìtumọ̀ rẹ̀ jẹ́ ‘nítorí pé’ tàbí ‘níwọ̀n bí.’
- source_word: ἀπὸ κυρίου
  choice: lọ́wọ́ Olúwa
  rationale: ‘Lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi orísun ẹni tí a ti rí ohun gbà hàn; ‘Olúwa’ sì pa akọ́lé κύριος mọ́.
- source_word: ἀπολήμψεσθε
  choice: ẹ ó ti gba
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe ọjọ́ iwájú tó túmọ̀ sí gbígba ohun padà tàbí gbígba ohun gẹ́gẹ́ bí ìdápadà. ‘Ẹ ó ti gba’ bá èdè Yorùbá mu, ‘ẹ̀san’ sì ru ìtumọ̀ ìdápadà náà.
- source_word: ἀνταπόδοσιν τῆς κληρονομίας
  choice: ẹ̀san ogún náà
  rationale: Ọ̀rọ̀ yìí pa ìsopọ̀ genitive Gíríìkì mọ́ láì pinnu ju bó ṣe yẹ lọ bóyá ogún náà ni ẹ̀san náà tàbí ẹ̀san tó ní í ṣe pẹ̀lú ogún.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Olúwa Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí akọ́lé níhìn-ín, nítorí náà ‘Mèsáyà’ fi ìtumọ̀ ẹni àmì òróró yàn hàn, ‘Olúwa’ sì dúró fún κύριος.
- source_word: δουλεύετε
  choice: ni ẹ ń sìn
  rationale: Ìṣètò ‘ni … ń’ mú kí gbolohun náà jẹ́ ìkéde tó ń lọ lọ́wọ́, gẹ́gẹ́ bí present indicative Gíríìkì, kì í ṣe àṣẹ tààrà. ‘Sìn’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún iṣẹ́ tí ẹni ń ṣe fún olúwa rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστῷ gẹ́gẹ́ bí akọ́lé
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àkójọpọ̀ τῷ κυρίῳ Χριστῷ, Χριστός ní agbára akọ́lé; ‘Mèsáyà’ mú èyí hàn dípò kí ó dà bí orúkọ lásán.
- issue: Agbára gírámà δουλεύετε
  choice: 'Ìkéde: ‘Olúwa Mèsáyà ni ẹ ń sìn’'
  alternative: 'Àṣẹ: ‘Ẹ sin Olúwa Mèsáyà’'
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ present active indicative, ẹni kejì ọ̀pọ̀. Ìtumọ̀ náà pa ìkéde tó ń fún àwọn olùgbọ́ ní ìṣírí mọ́, dípò yíyí i sí imperative.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. ‘Lọ́wọ́ Olúwa’ jẹ́ àdánidá ju ìtumọ̀ gígùn ‘láti ọ̀dọ̀ Olúwa’ lọ ní àyíká gbígba ohun; a sì lo ‘ni ẹ ń sìn’ láti mú indicative náà ṣe kedere.
