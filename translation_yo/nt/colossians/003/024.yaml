  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: εἰδότες ni a mú sí “Ẹ mọ̀ pé”; ἀπὸ κυρίου sí “lọ́wọ́ Olúwa”; ἀνταπόδοσιν τῆς κληρονομίας sí “ẹ̀san ogún náà”; àti δουλεύετε sí ìkéde “Olúwa Mèsáyà ni ẹ ń sìn.” Síbẹ̀, “ẹ ó ti gba” sábà máa ń ní ìtumọ̀ ọjọ́ iwájú pípé (‘ẹ will have received’), nígbà tí ἀπολήμψεσθε jẹ́ ọjọ́ iwájú lasan: ‘ẹ ó gba.’'
