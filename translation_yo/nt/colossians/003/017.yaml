id: COL.3.17
reference: Colossians 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: yo
  text: Ohun gbogbo tí ẹ bá ń ṣe, yálà ní ọ̀rọ̀ tàbí ní ìṣe,[a] ẹ ṣe gbogbo rẹ̀ ní orúkọ Olúwa Jésù,[b] kí ẹ sì máa dúpẹ́ lọ́wọ́ Ọlọ́run Baba nípasẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ohun tí ẹ ń sọ tàbí ní ohun tí ẹ ń ṣe.”
    reason: lexical_alternative
  - marker: b
    text: “Ní orúkọ” tún lè túmọ̀ sí “lábẹ́ àṣẹ” tàbí “gẹ́gẹ́ bí aṣojú Olúwa Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: Ohun gbogbo tí ẹ bá ń ṣe
  rationale: Gbólóhùn yìí fi ìtumọ̀ tí kò ní ààlà hàn, ó sì kan gbogbo ohun tí àwọn olùgbọ́ lè ṣe. Ìlò “bá ń ṣe” jẹ́ ti Yorùbá àdánidá, ó sì bá agbára present subjunctive mu.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: yálà ní ọ̀rọ̀ tàbí ní ìṣe
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń ṣe àfiwé ohun tí ènìyàn sọ àti ohun tí ó ṣe. “Ní ọ̀rọ̀…ní ìṣe” pa ìwòntúnwonsì àti ìṣọ̀kan gbólóhùn Gíríìkì mọ́.
- source_word: πάντα
  choice: gbogbo rẹ̀
  rationale: Ó kó gbogbo ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn jọ, ó sì tẹnu mọ́ pé kò sí apá kan tí a yọ sílẹ̀.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: ní orúkọ Olúwa Jesu
  rationale: Ìtumọ̀ tààrà yìí pa àkàwé Bíbélì mọ́; ó lè ní í ṣe pẹ̀lú àṣẹ, aṣojú, àti ìdánimọ̀ pẹ̀lú Jesu láì dín ìtumọ̀ náà kù sí ọ̀kan ṣoṣo.
- source_word: κυρίου
  choice: Olúwa
  rationale: Nínú ọ̀rọ̀ nípa Kristi yìí, κύριος jẹ́ orúkọ oyè tó ní ìwúwo ju “ọ̀gá” lọ; “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu.
- source_word: εὐχαριστοῦντες
  choice: kí ẹ sì máa dúpẹ́
  rationale: “Máa dúpẹ́” fi ìṣe tó ń bá a lọ hàn, ó sì so ìdúpẹ́ pọ̀ mọ́ gbogbo ìṣe tí ìlànà náà ń sọ.
- source_word: τῷ θεῷ πατρὶ
  choice: lọ́wọ́ Ọlọ́run Baba
  rationale: “Dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà àdánidá láti sọ ẹni tí a ń dúpẹ́ sí ní Yorùbá; “Ọlọ́run Baba” sì ṣe àfihàn apposition náà ní kedere.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Olúwa Jesu tó wà nítòsí jù lọ, “nípasẹ̀” sì pa èrò mediation inú διὰ mọ́.
theological_decisions:
- issue: Agbára ìtumọ̀ “ní orúkọ Olúwa Jesu”
  choice: A fi àkàwé náà sílẹ̀ gẹ́gẹ́ bí “ní orúkọ Olúwa Jesu” nínú ẹsẹ̀.
  alternative: “lábẹ́ àṣẹ Olúwa Jesu” tàbí “gẹ́gẹ́ bí aṣojú Olúwa Jesu”
  rationale: Àkàwé náà lè gba àṣẹ, aṣojú, ìdánimọ̀, àti ìfaramọ́ mọ́ra. Fífipamọ́ rẹ̀ kò jẹ́ kí ìtumọ̀ gbooro náà dín kù sí ọ̀nà kan ṣoṣo.
- issue: Ẹni tí “nípasẹ̀ rẹ̀” ń tọ́ka sí
  choice: Ó tọ́ka sí Olúwa Jesu gẹ́gẹ́ bí ẹni tí ìdúpẹ́ sí Ọlọ́run Baba ń gba ọ̀dọ̀ rẹ̀ kọjá.
  alternative: Kí a ka a sí ìtọ́kasí gbogbogbò láì tẹnu mọ́ ipa Jesu.
  rationale: “Olúwa Jesu” ni antecedent tó sún mọ́ ọn jù lọ, bẹ́ẹ̀ sì ni sintasi Gíríìkì ṣe ń tọ́ka.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìforúkọsí ọ̀pọ̀ ènìyàn “ẹ” bá ẹni kejì ọ̀pọ̀ inú ποιῆτε mu. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba.
