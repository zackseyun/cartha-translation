  source_fidelity: The draft accurately renders the prohibition, the reciprocal object, the aorist participle with a plausible grounding sense, and the clothing metaphor. “Pẹ̀lú àwọn ìṣe rẹ̀” properly conveys accompaniment, and the plural “àwọn ìṣe” is natural for the Greek plural.
  naturalness: 'The wording is generally clear Standard Yorùbá. Omitting “náà” after “ènìyàn àtijọ́” is a small but safe improvement: the bare definite conceptual expression is more idiomatic here, while the Greek definiteness remains clear from the established contrast in the context.'
  terminology: “Ẹ má ṣe purọ́,” “fún ara yín,” and “bọ́ … sílẹ̀” are suitable modern formal-register choices. “Ènìyàn àtijọ́” appropriately retains the ανθρωπος imagery without falsely limiting the referent to males. The footnotes preserve legitimate alternatives without imposing a theological interpretation.
