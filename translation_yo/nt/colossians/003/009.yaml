id: COL.3.9
reference: Colossians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: yo
  text: Ẹ má ṣe purọ́ fún ara yín, níwọ̀n bí ẹ ti bọ́ ènìyàn àtijọ́ pẹ̀lú àwọn ìṣe rẹ̀ sílẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ sì ti bọ́ … sílẹ̀,” tàbí “lẹ́yìn tí ẹ ti bọ́ … sílẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ṣiṣẹ́ ní àwọn ọ̀nà wọ̀nyí; níbí, ó ṣeé ṣe kó ń fi ìdí àṣẹ náà hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹni tí ẹ ti jẹ́ tẹ́lẹ̀ rí” tàbí “ẹ̀dá àtijọ́.” Èdè Gíríìkì ní “ènìyàn àtijọ́,” èyí tó pa ìyàtọ̀ mọ́ pẹ̀lú “ènìyàn tuntun” ní ẹsẹ tó tẹ̀ lé e.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Ẹ má ṣe purọ́
  rationale: Ọ̀rọ̀ ìfòfin sí ohun kan ni èdè Gíríìkì; “Ẹ má ṣe purọ́” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì bá àṣẹ fún ọ̀pọ̀ ènìyàn mu.
- source_word: εἰς ἀλλήλους
  choice: fún ara yín
  rationale: 'Èyí sọ ìtumọ̀ ìṣe alápàdé náà ní Yorùbá àdánidá: kí ẹnì kọ̀ọ̀kan má ṣe purọ́ fún ẹlòmíràn.'
- source_word: ἀπεκδυσάμενοι
  choice: níwọ̀n bí ẹ ti bọ́ … sílẹ̀
  rationale: Ó pa àwòrán bíbu aṣọ kúrò mọ́, ó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀. “Níwọ̀n bí” mú kí ìtumọ̀ pé èyí ni ìdí tàbí ìpìlẹ̀ àṣẹ náà ṣe kedere, bó tilẹ̀ jẹ́ pé àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ míì.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: ènìyàn àtijọ́ náà
  rationale: “Ènìyàn” bá ἄνθρωπος mu ju “ọkùnrin” lọ nínú àyíká yìí, nítorí ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá ènìyàn tàbí ẹni tí wọ́n ti jẹ́, kì í ṣe akọ nìkan. Ó tún pa ìyàtọ̀ Pọ́ọ̀lù láàárín ènìyàn àtijọ́ àti ènìyàn tuntun mọ́.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: pẹ̀lú àwọn ìṣe rẹ̀
  rationale: “Pẹ̀lú” fi ìbákẹ́gbẹ́ hàn, “àwọn ìṣe” sì gba ìtumọ̀ àwọn iṣẹ́ tàbí ìwà tí ènìyàn àtijọ́ náà ń hù. “Rẹ̀” tọ́ka padà sí “ènìyàn àtijọ́ náà” lọ́nà Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ τὸν παλαιὸν ἄνθρωπον
  choice: ènìyàn àtijọ́ náà
  alternative: ẹni tí ẹ ti jẹ́ tẹ́lẹ̀ rí; ẹ̀dá àtijọ́
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán ènìyàn àtijọ́ mọ́, ó sì ṣètìlẹ́yìn fún ìyàtọ̀ rẹ̀ pẹ̀lú ènìyàn tuntun ní ẹsẹ tó tẹ̀ lé e, láì sọ ọ́ di ọkùnrin nìkan tàbí fi ẹ̀kọ́ ìsìn kan kún un.
- issue: Ìbáṣepọ̀ ἀπεκδυσάμενοι pẹ̀lú àṣẹ náà
  choice: ìdí tàbí ìpìlẹ̀—“níwọ̀n bí”
  alternative: ìṣe tó bá a rìn—“ẹ sì ti bọ́”; àkókò—“lẹ́yìn tí ẹ ti bọ́”
  rationale: Nínú àyíká ẹsẹ 9–10, ìyípadà tí àwọn onígbàgbọ́ ti ní ni ó ṣeé ṣe kó jẹ́ ìpìlẹ̀ àṣẹ náà. Àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú gírámà Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí kókó Gíríìkì; “bọ́ … sílẹ̀” pa àwòrán aṣọ mọ́ ní ọ̀nà tí olùkà Yorùbá lè lóye. Àwọn àmì ohùn ni a fi sí ibi tó yẹ.
