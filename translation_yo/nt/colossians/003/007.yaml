  text: In these things you too once walked[a], when you were living in them.
translation:
  language: yo
  text: Nínú àwọn nǹkan wọ̀nyí ni ẹ̀yin náà ti máa ń rìn nígbà kan rí[a], nígbà tí ẹ ń gbé nínú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú àwọn nǹkan tí ẹ̀yin náà ti máa ń rìn nígbà kan rí, nígbà tí ẹ ń gbé nínú wọn.” Ọ̀rọ̀ arọ́pò orúkọ alátọ́ka Gíríìkì náà lè túmọ̀ ní tààràtà sí “nínú àwọn nǹkan tí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Nínú àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ìwà búburú tí a ṣẹ̀ṣẹ̀ dárúkọ. Gbólóhùn yìí jẹ́ kí ohun tí ó ń tọ́ka sí hàn kedere, ó sì pa ìtumọ̀ ἐν mọ́.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: Ó fi ìtẹnumọ́ sí i pé àwọn ará Kólósè fúnra wọn pẹ̀lú ti ní irú ìgbésí ayé bẹ́ẹ̀ rí.
- source_word: περιεπατήσατε
  choice: ti máa ń rìn
  rationale: Ó pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́, níbi tí ‘rírìn’ ti túmọ̀ sí bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀. ‘Máa ń’ fi hàn pé ó jẹ́ ìṣe wọn tẹ́lẹ̀, ó sì yàtọ̀ sí ἐζῆτε.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Ó fi àkókò ìgbésí ayé wọn tẹ́lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ὅτε
  choice: nígbà tí
  rationale: Ó so ìwà wọn tẹ́lẹ̀ pọ̀ mọ́ ipò ìgbésí ayé wọn ní àkókò náà.
- source_word: ἐζῆτε
  choice: ẹ ń gbé
  rationale: Ó ṣàfihàn ìgbésí ayé tí ó ń bá a lọ ní àkókò àtijọ́, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí àwòrán ‘rìn.’
- source_word: ἐν τούτοις
  choice: inú wọn
  rationale: ‘Wọn’ ń tọ́ka padà sí àwọn nǹkan búburú tí a dárúkọ, láì tún gbogbo gbólóhùn náà ṣe.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ‘rìn’ àti ‘ń gbé’ nínú àpèjúwe ìwà Pọ́ọ̀lù
  choice: A ya ìhùwàsí wọn tẹ́lẹ̀ (‘máa ń rìn’) sọ́tọ̀ sí ibi tàbí ipò ìgbésí ayé wọn tẹ́lẹ̀ (‘ń gbé inú wọn’).
  alternative: Kí a lo ‘gbé’ fún ọ̀rọ̀ ìṣe méjèèjì, bí ẹni pé ìtumọ̀ wọn kò yàtọ̀.
  rationale: Èyí ń pa ìyàtọ̀ tó wà láàárín περιπατέω àti ζάω mọ́, láì fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì pẹ̀lú àmì ohùn. Àwòrán ‘rìn’ jẹ́ ti èdè Bíbélì, ṣùgbọ́n ‘máa ń’ mú kí ó ṣe kedere fún òǹkàwé pé ọ̀nà ìgbésí ayé wọn tẹ́lẹ̀ ni a ń sọ.
