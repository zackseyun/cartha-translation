  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: yo
  text: Kí àlàáfíà Mèsáyà máa ṣàkóso nínú ọkàn yín[a]; sí àlàáfíà náà ni a sì pè yín nínú ara kan[b]. Kí ẹ sì jẹ́ ẹni ọpẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé kí àlàáfíà Mèsáyà “máa ṣe bí onídàájọ́” tàbí “máa pinnu ọ̀ràn” nínú ọkàn yín.
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé ṣe láti túmọ̀ rẹ̀ sí “sínú ara kan,” èyí tó tẹnu mọ́ pípapọ̀ wọn sínú ara ajọṣepọ̀ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún peace ni àlàáfíà; ó bá ìtumọ̀ ìbáṣepọ̀ àti ìṣọ̀kan àwùjọ nínú àyíká ọ̀rọ̀ yìí mu.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; “Mèsáyà” pa agbára oyè náà mọ́ dípò lílo àkọlẹ̀ orúkọ lásán.
- source_word: βραβευέτω
  choice: kí ... máa ṣàkóso
  rationale: Ìṣe náà lè tọ́ka sí onídàájọ́ eré tó ń pinnu ọ̀ràn; “máa ṣàkóso” jẹ́ ọ̀nà Yorùbá àdánidá tó fi ipa ìdarí àti ìpinnu rẹ̀ hàn láìsọ àwòrán náà di ohun tí kò mọ́gbọ́n dání.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Èyí pa àwòrán inú-ọkàn Gíríìkì mọ́, nígbà tí “yín” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: εἰς ἣν
  choice: àlàáfíà tí a ... pè yín sí
  rationale: Atúnṣe gírámà Yorùbá yìí mú kí ẹni tí ọ̀rọ̀ arọ́pò náà ń tọ́ka sí—àlàáfíà—ṣe kedere, ó sì pa ìtumọ̀ ibi-afẹ́ ìpè náà mọ́.
- source_word: καὶ ἐκλήθητε
  choice: tí a sì pè yín
  rationale: “Sì” gbé ìtẹnumọ́ καί jáde lọ́nà àdánidá; fọ́ọ̀mù aláìdárúkọ “a pè yín” ṣe aṣojú passive Gíríìkì láìfi ẹni tó pè wọ́n kún ọ̀rọ̀.
- source_word: ἐν ἑνὶ σώματι
  choice: nínú ara kan
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ara kan àti àìdánilójú díẹ̀ nípa sphere tàbí incorporation mọ́.
- source_word: εὐχάριστοι γίνεσθε
  choice: Kí ẹ sì máa dúpẹ́
  rationale: Àṣẹ onítẹ̀síwájú yìí jẹ́ Yorùbá àdánidá fún jíjẹ́ ẹni ọ̀pẹ́ tàbí didúpẹ́ nígbà gbogbo.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn. “Mèsáyà” pa agbára oyè náà mọ́ láìfi ẹ̀kọ́ ìjọ kan pàtó kún un.
- issue: Agbára βραβευέτω
  choice: máa ṣàkóso
  alternative: máa ṣe bí onídàájọ́ / máa pinnu
  rationale: “Ṣàkóso” mú ipa àlàáfíà gẹ́gẹ́ bí ohun tó ń darí ìgbésí ayé inú àti ti àwùjọ jáde, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwòrán onídàájọ́ eré mọ́.
- issue: Ìtumọ̀ ἐν ἑνὶ σώματι
  choice: nínú ara kan
  alternative: sínú ara kan
  rationale: “Nínú ara kan” tẹ̀lé ἐν pẹ̀lú dative, ó sì fi àwòrán ara ajọṣepọ̀ sílẹ̀ láìsọ ọ́ di “ìjọ” nínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá àṣàde tó ní àmì ohùn níbi tó yẹ, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti tó ṣeé lóye fún òǹkàwé òde òní. A lo “Mèsáyà” gẹ́gẹ́ bí oyè, a sì pa àwòrán “ọkàn” àti “ara kan” mọ́.
