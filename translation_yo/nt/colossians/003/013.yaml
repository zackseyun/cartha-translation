reference: Colossians 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: yo
  text: Ẹ máa farada ara yín, kí ẹ sì máa dáríjì ara yín, bí ẹnikẹ́ni bá ní ohun tí ó fi ń kùn sí ẹlòmíràn[a]. Gẹ́gẹ́ bí Olúwa ti dáríjì yín, bẹ́ẹ̀ náà ni kí ẹ̀yin náà ṣe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹnikẹ́ni bá ní ẹ̀sùn kan sí ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò tún ọ̀rọ̀-ìṣe náà sọ ní apá ìkẹyìn; ìtumọ̀ rẹ̀ ni pé, “bẹ́ẹ̀ náà ni kí ẹ̀yin náà máa dáríjì.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: Ẹ máa fara da ara yín
  rationale: Ó fi ìṣe tí ó ń bá a lọ hàn, ó sì mú ìtumọ̀ ìfaradà láàárín àwọn ọmọ ìjọ jáde ní Yorùbá àdánidá.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: kí ẹ sì máa dárí ji ara yín
  rationale: Nínú àyíká yìí, χαρίζομαι túmọ̀ sí dídárí ẹ̀ṣẹ̀ tàbí àṣìṣe ji; ‘ara yín’ fi ìṣe àpapọ̀ láàárín wọn hàn.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: bí ẹnikẹ́ni bá ní ẹ̀sùn kan sí ẹlòmíràn
  rationale: Ó pa àídájú gbólóhùn Gíríìkì mọ́; ‘ẹ̀sùn’ lè jẹ́ ìdí fún ìbáwí tàbí ohun tí ẹnì kan fi ń kùn sí ẹlòmíràn láìsọ ọ́ di ẹjọ́ òfin.
- source_word: καθὼς καὶ
  choice: Gẹ́gẹ́ bí ... bẹ́ẹ̀ náà
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìfiwéra tó wà nínú Gíríìkì mọ́.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó bójú mu fún akọ́lé κύριος, láìfi ẹni tí akọ́lé náà ń tọ́ka sí hàn ju bí Gíríìkì ṣe ṣe lọ.
- source_word: ἐχαρίσατο
  choice: ti dárí jì
  rationale: Ó bá χαριζόμενοι tó ṣáájú mu ní ìtumọ̀, ó sì sọ ìṣe ìdáríjì Olúwa ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: οὕτως καὶ ὑμεῖς
  choice: bẹ́ẹ̀ náà ni kí ẹ̀yin náà ṣe
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ fún olùkà láti lóye láti inú àyíká; Yorùbá nílò ìparí yìí fún ìṣàn gbólóhùn, ṣùgbọ́n ‘ṣe’ kò fi ìṣe mìíràn kún un.
theological_decisions:
- issue: Ẹni tí ὁ κύριος ń tọ́ka sí
  choice: Lo ‘Olúwa’ nìkan, èyí tí ó ṣeé lóye pé ó ń tọ́ka sí Kristi nínú àyíká lẹ́tà náà.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ‘Kristi’ tàbí kí a ka a sí Ọlọ́run ní gbogbogbòò.
  rationale: Àyíká Kólósè mú kí Kristi jẹ́ ẹni tí ó ṣeé ṣe jù lọ, ṣùgbọ́n fífi akọ́lé ‘Olúwa’ sílẹ̀ pa ìwọ̀n ìsọ Gíríìkì àti ààyè ìtumọ̀ rẹ̀ mọ́.
- issue: Ọ̀rọ̀-ìṣe tí a kò sọ ní apá ìkẹyìn
  choice: Lo ‘bẹ́ẹ̀ náà ni kí ẹ̀yin náà ṣe,’ kí ‘ṣe’ tọ́ka padà sí dídárí ji.
  alternative: Sọ ní kedere pé ‘bẹ́ẹ̀ náà ni kí ẹ̀yin náà máa dárí ji’ tàbí fi apá náà sílẹ̀ gẹ́gẹ́ bí ‘bẹ́ẹ̀ náà ni ẹ̀yin náà.’
  rationale: Gíríìkì jẹ́ kúkúrú, kò sì tún ọ̀rọ̀-ìṣe náà sọ. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò fi òfin alágbára míì kún un, ó sì jẹ́ kí àlàyé ẹsẹ̀ ṣàfihàn pé ọ̀rọ̀-ìṣe náà jẹ́ àfojúdi.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ohùn jẹ́ ti ìyànjú ọlọ́lá sí àwùjọ, ní lílo ọ̀rọ̀-orúkọ ọ̀pọ̀ ‘ẹ’ àti gbólóhùn tí ó ṣeé lóye fún òǹkàwé òde òní.
