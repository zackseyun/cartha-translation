  terminology: “Olúwa” dáa fún ὁ κύριος, ó sì pa àìsọ ẹni náà ní pàtó ju Gíríìkì lọ mọ́. “dáríjì” yẹ kí a kọ ọ́ pọ̀ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe boṣewa.
