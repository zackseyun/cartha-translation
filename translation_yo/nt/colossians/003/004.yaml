id: COL.3.4
reference: Colossians 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: yo
  text: Nígbà tí Mèsáyà[a], ẹni tí í ṣe ìyè yín[b], bá farahàn, nígbà náà ni ẹ̀yin náà yóò farahàn[c] pẹ̀lú rẹ̀ nínú ògo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ oyè Gíríìkì Χριστός lè jẹ́ “Mèsáyà” tàbí “Kristi”; “Mèsáyà” mú ìtumọ̀ oyè náà jáde.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “Mèsáyà, ìyè yín.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a ó fi ẹ̀yin náà hàn pẹ̀lú rẹ̀ nínú ògo.” Ọ̀rọ̀ ìṣe Gíríìkì níbí wá láti inú gbòǹgbò kan náà pẹ̀lú èyí tí a lò fún ìfarahàn Mèsáyà ní ìbẹ̀rẹ̀ ẹsẹ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Nígbà tí ... bá
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí fún gbólóhùn àsìkò tí ó ń tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí.
- source_word: ὁ Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níbí; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò kí a kàn kọ ọ́ gẹ́gẹ́ bí orúkọ.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: bá farahàn / yóò farahàn
  rationale: “Farahàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún jíjẹ́ kí ẹni hàn gbangba, ó sì pa àtúnlò gbòǹgbò ọ̀rọ̀ Gíríìkì kan náà mọ́ ní apá méjèèjì.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ẹni tí í ṣe ìyè yín
  rationale: 'A fi gbólóhùn alátọ́ka hàn láti mú ìbáṣepọ̀ àfikún-orúkọ Gíríìkì yé kedere ní Yorùbá: Mèsáyà ni ìyè àwọn onígbàgbọ́.'
- source_word: τότε καὶ ὑμεῖς
  choice: nígbà náà ni ẹ̀yin náà
  rationale: “Nígbà náà” pa ìtẹ̀lé àsìkò mọ́, “ẹ̀yin náà” sì fi ìtẹnumọ́ àti àkópọ̀ καὶ ὑμεῖς hàn.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ó sọ ìdàpọ̀ àwọn onígbàgbọ́ mọ́ Mèsáyà ní ìfarahàn náà ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἐν δόξῃ
  choice: nínú ògo
  rationale: Ó pa àwòrán gbólóhùn atọ́ka Gíríìkì àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì sọ ọ́ di ọ̀rọ̀ àpèjúwe lásán.
theological_decisions:
- issue: 'Bí a ṣe túmọ̀ Χριστός: orúkọ oyè tàbí bí orúkọ ẹni'
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ ὁ àti ọ̀rọ̀ Kristi ní àyíká yìí ń tọ́ka sí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde láì fi ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan kún un.
- issue: Ìdánimọ̀ Mèsáyà gẹ́gẹ́ bí ìyè àwọn olùgbọ́
  choice: ẹni tí í ṣe ìyè yín
  alternative: Mèsáyà, ìyè yín
  rationale: Ọ̀nà tí a yàn mú ìdánimọ̀ tó lágbára nínú Gíríìkì ṣe kedere ní Yorùbá, ṣùgbọ́n kò ṣàlàyé bí ìdánimọ̀ náà ṣe ń ṣiṣẹ́ kọjá ohun tí ẹsẹ náà sọ.
- issue: Ohun tí φανερόω túmọ̀ sí ní apá méjèèjì
  choice: farahàn ... farahàn
  alternative: fi ... hàn ... fi ... hàn
  rationale: A pa ìfararora ọ̀rọ̀ Gíríìkì mọ́, a sì yàgò fún fífi aṣojú tí yóò mú ìfarahàn náà ṣẹlẹ̀ sínú ẹsẹ nígbà tí Gíríìkì kò dárúkọ aṣojú náà.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. “Ẹ̀yin” àti “yín” jẹ́ ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí Gíríìkì; ìtẹnumọ́ “ẹ̀yin náà” pa ìfarakópa àwọn olùgbọ́ mọ́.
