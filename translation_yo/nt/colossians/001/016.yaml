id: COL.1.16
reference: Colossians 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: yo
  text: Nítorí nínú rẹ̀ ni a dá ohun gbogbo[a], ní àwọn ọ̀run àti lórí ilẹ̀[b], àwọn ohun tí a lè rí àti àwọn ohun tí a kò lè rí, yálà àwọn ìtẹ́ tàbí àwọn ipò ìṣàkóso[c] tàbí àwọn alákòóso tàbí àwọn aláṣẹ; ohun gbogbo ni a ti dá nípasẹ̀ rẹ̀ àti fún un[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé nínú rẹ̀ ni a dá ohun gbogbo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọ̀run àti ní ayé”; ọ̀pọ̀ iye ni ọ̀rọ̀ Gíríìkì fún “àwọn ọ̀run.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ipò olúwa” dípò “àwọn ipò ìṣàkóso”; ó ṣeé ṣe kí àwọn ọ̀rọ̀ wọ̀nyí tọ́ka sí onírúurú ipò àwọn agbára tí a dá.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “nípasẹ̀ rẹ̀ àti sí ọ̀dọ̀ rẹ̀ ni a ti dá ohun gbogbo”; “fún un” fi hàn pé òun ni ète ìṣẹ̀dá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó mú ìtumọ̀ ìdí tí ọ̀rọ̀ náà ní nínú àyíká rẹ̀ jáde, ó sì bá Yorùbá àdánidá mu.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Èyí pa ἐν mọ́ gẹ́gẹ́ bí ‘nínú,’ kò sì sọ ọ́ di ‘nípasẹ̀ rẹ̀,’ nítorí δι’ αὐτοῦ ti wà ní apá ìkẹyìn.
- source_word: ἐκτίσθη / ἔκτισται
  choice: a dá / a ti dá
  rationale: ‘A dá’ fi ìṣẹ̀lẹ̀ ìṣẹ̀dá hàn, ‘a ti dá’ sì fi ipò tí iṣẹ́ náà ti parí tí ó sì dúró hàn, ní ìbámu pẹ̀lú aorist àti perfect Gíríìkì.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó gbòòrò tó bí ọ̀rọ̀ Gíríìkì, kò sì fi àlàyé tí kò sí nínú rẹ̀ kún un.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ iye ọ̀rọ̀ οὐρανοῖς mọ́.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó wà ní orí ilẹ̀ ayé, ó sì bá ‘ní àwọn ọ̀run’ ṣe àtakò.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: àwọn ohun tí a lè rí àti àwọn ohun tí a kò lè rí
  rationale: Ìtumọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní, ó sì pa ìyàtọ̀ ohun tí ó hàn àti ohun tí kò hàn mọ́.
- source_word: εἴτε ... εἴτε ... εἴτε ... εἴτε
  choice: yálà ... tàbí ... tàbí ... tàbí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti pa ìtẹ̀lé àwọn ohun àṣàyàn inú Gíríìkì mọ́.
- source_word: θρόνοι
  choice: àwọn ìtẹ́
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí ipò tàbí àwọn agbára gíga láì ṣe àlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: κυριότητες
  choice: àwọn ìjọba
  rationale: ‘Àwọn ìjọba’ sọ agbègbè ìṣàkóso tàbí ipò agbára ní Yorùbá tí ó ṣeé lóye; àlàyé ìsàlẹ̀ fi ‘ipò olúwa’ hàn gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ìrísí ọ̀rọ̀ náà.
- source_word: ἀρχαὶ
  choice: àwọn alákòóso
  rationale: Ó mú èrò àwọn tí ń ṣàkóso jáde ní èdè òde òní láì lo ọ̀rọ̀ ẹ̀sìn àkànṣe.
- source_word: ἐξουσίαι
  choice: àwọn aláṣẹ
  rationale: Ó sọ àwọn tí ó ní àṣẹ ní kedere, ó sì yàtọ̀ sí ‘àwọn alákòóso.’
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ó pa ipa rẹ̀ gẹ́gẹ́ bí ọ̀nà tàbí aṣojú ìṣẹ̀dá mọ́.
- source_word: εἰς αὐτόν
  choice: fún un
  rationale: Èyí jẹ́ Yorùbá àdánidá fún pípa Ọmọ náà hàn gẹ́gẹ́ bí ète ìṣẹ̀dá; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ gangan ‘sí ọ̀dọ̀ rẹ̀.’
theological_decisions:
- issue: Ìbáṣepọ̀ Ọmọ náà pẹ̀lú ìṣẹ̀dá nínú ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: nínú rẹ̀ ... nípasẹ̀ rẹ̀ ... fún un
  alternative: nípasẹ̀ rẹ̀ ... nípasẹ̀ rẹ̀ ... sí ọ̀dọ̀ rẹ̀
  rationale: A pa ìyàtọ̀ àwọn àsọtẹ́lẹ̀ mẹ́tẹ̀ẹ̀ta mọ́, kí a má bàa sọ ìtumọ̀ wọn di ohun kan ṣoṣo tàbí yanjú ìfẹ̀ẹ́-ẹ̀kọ́ tó wà nínú wọn láìnídìí.
- issue: Irú àwọn ‘ìtẹ́ ... ìjọba ... alákòóso ... aláṣẹ’
  choice: A fi wọn sílẹ̀ gẹ́gẹ́ bí oríṣìíríṣìí ipò tàbí agbára tí a dá, láì sọ pé ẹ̀mí tàbí ènìyàn nìkan ni wọ́n.
  alternative: Láti pè wọ́n ní àwọn ipò áńgẹ́lì tàbí àwọn ètò ìṣèlú ènìyàn ní pàtó.
  rationale: Ẹsẹ náà kò sọ ní pàtó bóyá ẹ̀mí, ti ayé, tàbí méjèèjì ni àwọn ẹ̀ka agbára wọ̀nyí.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa gbólóhùn náà ṣọ̀kan pẹ̀lú àmì olóòjì láàárín àwọn apá méjì.
