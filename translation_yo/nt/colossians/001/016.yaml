  source_fidelity: Ìtumọ̀ náà pa ìpele ìdí ti ὅτι, ìyàtọ̀ ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν, àpapọ̀ τὰ πάντα, ọ̀pọ̀ iye ‘àwọn ọ̀run,’ àti àtòjọ àwọn ẹ̀ka àṣẹ mọ́ dáadáa. Síbẹ̀, ‘àwọn ìjọba’ ń tọ́ka ní pàtàkì sí àwọn ìjọba/àgbègbè ìjọba, kì í sì ṣe ìtumọ̀ tó péye fún κυριότητες, tó jẹ́ ẹ̀ka ìṣàkóso tàbí ipò olúwa. Àtúnṣe náà tún mú kí ‘ohun gbogbo’ hàn kedere gẹ́gẹ́ bí kókó-ọrọ ìṣẹ̀dá nínú gbolóhùn ìkẹyìn.
  naturalness: Yorùbá ìpele àárín náà jẹ́ àdánidá, ó sì yẹ fún ọ̀rọ̀ ìwé mímọ́ òde òní. ‘Àwọn ipò ìṣàkóso’ jẹ́ ìtúmọ̀ tí ó mọ́gbọ́n dání ju ‘àwọn ìjọba’ lọ nínú àtòjọ yìí. ‘Ohun gbogbo ni a ti dá nípasẹ̀ rẹ̀ àti fún un’ ń ṣàn dáadáa, ó sì yọ ìṣòro ìdárúdàpọ̀ kúrò nínú ìtòlẹ́sẹẹsẹ gbolóhùn àkọ́kọ́.
  terminology: A pa ‘ìtẹ́,’ ‘alákòóso,’ àti ‘aláṣẹ’ mọ́. A rọ́pò ‘ìjọba’ pẹ̀lú ‘ipò ìṣàkóso’ fún κυριότητες, láì pinnu pé àwọn ẹ̀ka náà jẹ́ ti áńgẹ́lì, ti ẹ̀mí, tàbí ti ìṣèlú ènìyàn. ‘Fún un’ pa ipa ète ti εἰς αὐτόν mọ́.
