id: COL.1.12
reference: Colossians 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: yo
  text: ẹ sì ń dúpẹ́ lọ́wọ́ Baba, ẹni tí ó mú yín[a] yẹ láti ní ìpín nínú ogún àwọn ènìyàn mímọ́ nínú ìmọ́lẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “wa” dípò “yín.”
    reason: textual_variant
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ìpín tí a pín fún àwọn ènìyàn mímọ́ nínú ìmọ́lẹ̀”; ọ̀rọ̀ Gíríìkì náà mú àwòrán ogún tàbí ilẹ̀ tí a pín fún ẹnì kọ̀ọ̀kan wá sí ọkàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: ẹ sì ń dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń tẹ̀ síwájú láti inú gbólóhùn tó ṣáájú. “Ẹ sì ń dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtumọ̀ ìṣe tí ń bá a lọ mọ́, láì sọ ọ́ di àṣẹ tuntun.
- source_word: τῷ πατρὶ
  choice: Baba
  rationale: Èdè Gíríìkì sọ “Baba” ní tààrà; a kò fi “Ọlọ́run” kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: ἱκανώσαντι
  choice: ẹni tí ó mú yín yẹ
  rationale: ἱκανόω túmọ̀ sí mímú ẹni tóótun tàbí mímú ẹni yẹ. “Mú yín yẹ” jẹ́ Yorùbá tó ṣe kedere, ó sì fi hàn pé Baba ni ó ṣe ìmúyẹ náà, kì í ṣe pé ó kàn fún wọn láàyè.
- source_word: ὑμᾶς
  choice: yín
  rationale: A tẹ̀ lé ὑμᾶς (“yín”) nínú SBLGNT. Àyípadà ἡμᾶς (“wa”) wà nínú àwọn àfọwọ́kọ kan, a sì tọ́ka sí i ní àlàyé ìsàlẹ̀.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: láti ní ìpín nínú ogún
  rationale: “Ìpín nínú ogún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó so μερίς (ìpín) àti κλῆρος (ogún tàbí ohun tí a pín fún ẹni) pọ̀, ó sì pa àwòrán ogún tí a pín mọ́.
- source_word: τῶν ἁγίων
  choice: àwọn ènìyàn mímọ́
  rationale: Èyí ń tọ́ka sí àwọn ènìyàn tí Ọlọ́run yà sọ́tọ̀ fún ara rẹ̀. Ọ̀rọ̀ yìí bójú mu “àwọn ẹni mímọ́” ní èdè Yorùbá tó ṣe kedere fún òǹkàwé òde òní.
- source_word: ἐν τῷ φωτί
  choice: nínú ìmọ́lẹ̀
  rationale: A pa àwòrán “ìmọ́lẹ̀” àti ìsopọ̀ gírámà rẹ̀ mọ́ láì ṣe àlàyé rẹ̀ kọjá ohun tí orísun sọ.
theological_decisions:
- issue: Àyípadà ọ̀rọ̀ arọ́pò-orúkọ ohun tí ìṣe kàn
  choice: yín
  alternative: wa
  rationale: SBLGNT ní ὑμᾶς (“yín”), nítorí náà ni ó wà nínú ọ̀rọ̀ pàtàkì. Nítorí ἡμᾶς (“wa”) jẹ́ àyípadà pàtàkì nínú àwọn àfọwọ́kọ kan, a fi sí àlàyé ìsàlẹ̀ dípò kí a pa á mọ́.
- issue: Àwòrán ogún tí a pín
  choice: ìpín nínú ogún
  alternative: ìpín tí a pín fún àwọn ènìyàn mímọ́
  rationale: Ìtumọ̀ pàtàkì pa ìpín àti ogún méjèèjì mọ́, láì pinnu ju bó ṣe yẹ lọ bóyá κλῆρος tẹnumọ́ ogún tàbí ìpín tí a fi kèké yan. Àlàyé ìsàlẹ̀ pa ọ̀nà kejì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ń bá èrò ẹsẹ tó ṣáájú lọ, nítorí náà a bẹ̀rẹ̀ pẹ̀lú “ẹ sì ń” dípò ṣíṣe e ní àṣẹ tuntun. A kò fi èrò ẹ̀sìn ẹ̀ka kan kún ọ̀rọ̀ orísun.
