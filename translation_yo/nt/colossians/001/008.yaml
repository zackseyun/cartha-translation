id: COL.1.8
reference: Colossians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: yo
  text: ẹni tí ó sì fi ìfẹ́ yín nínú Ẹ̀mí[a] hàn fún wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ yín nínú ẹ̀mí,” ìyẹn ni, ìfẹ́ yín ní ọ̀nà ti ẹ̀mí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: ẹni tí ó sì sọ ... di mí mọ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú participle náà tọ́ka padà sí Epafira ní ẹsẹ tí ó ṣáájú. Gbólóhùn ìbátan yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó jẹ́ ẹni tí ó tún fi ohun náà tó Pọ́ọ̀lù létí.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ìṣe yìí mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ nípa Epafira, ó sì lè gbé agbára àfikún καί jáde ní àdánidá.
- source_word: ἡμῖν
  choice: di mí mọ̀
  rationale: Yorùbá sábà máa ń lo “sọ ... di ẹni mọ̀” fún ẹni tí a fi ìròyìn náà tó létí; “mí” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ tí ó ní Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ nínú.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ Yorùbá tó ṣe déédé fún ἀγάπη ní àyíká yìí.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Èyí pa àwòrán ‘nínú’ mọ́, “Ẹ̀mí” sì fi ìtumọ̀ tó ṣeé ṣe jù lọ—Ẹ̀mí Mímọ́—hàn, láì tú ọ̀rọ̀ náà sí àsọyé gígùn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
theological_decisions:
- issue: Ẹni tàbí ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ ni ó ṣeé ṣe jù lọ nínú “ìfẹ́ yín nínú Ẹ̀mí”
  alternative: ìfẹ́ yín nípa ti ẹ̀mí, ìyẹn ìfẹ́ ti ẹ̀mí
  rationale: Gbólóhùn Gíríìkì kò ní article, ṣùgbọ́n ìlò Pọ́ọ̀lù lè tọ́ka sí Ẹ̀mí Mímọ́ bákan náà. Ọ̀rọ̀ àkọ́kọ́ yan ìtumọ̀ yẹn, nígbà tí àlàyé ìsàlẹ̀ fi àìdánilójú gidi náà sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye. “Ẹ̀mí” ní lẹ́tà ńlá tọ́ka sí Ẹ̀mí Mímọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ gbogbogbò nípa ẹ̀mí mọ́.
