id: COL.1.13
reference: Colossians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: yo
  text: ẹni tí ó gbà wá là kúrò lábẹ́ àṣẹ òkùnkùn, tí ó sì gbé wa lọ sínú ìjọba Ọmọ rẹ̀ àyànfẹ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “Ọmọ ìfẹ́ rẹ̀”; tàbí, “Ọmọ tí ó jẹ́ àyànfẹ́ rẹ̀.”'
    reason: Gbólóhùn Gíríìkì náà ní ìṣètò jẹ́nítífù ní tààrà, ṣùgbọ́n ó ń tọ́ka sí Ọmọ tí Baba fẹ́ràn ní pàtàkì. Àlàyé náà pa àṣàyàn ìtumọ̀ àti ìrísí ìṣètò Gíríìkì mọ́.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: gbà wá là
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a dá ẹnì kan nídè kúrò nínú ewu tàbí lọ́wọ́ agbára ọ̀tá; ó sì fi ìgbésẹ̀ ìgbàlà tí ó dájú hàn.
- source_word: ἐξουσίας
  choice: àṣẹ
  rationale: “Àṣẹ” fi ẹ̀tọ́ àti agbára láti ṣàkóso hàn ní tààrà, láì sọ ọ́ di “agbègbè ìṣàkóso,” èyí tí yóò túmọ̀ rẹ̀ síwájú ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: σκότους
  choice: òkùnkùn
  rationale: Èyí ni ìtumọ̀ tààrà; a fi ìtumọ̀ rẹ̀ nípa ìwà àti ti ẹ̀mí sílẹ̀ láìṣàlàyé rẹ̀ sínú ẹsẹ náà.
- source_word: μετέστησεν
  choice: mú wa wọ inú
  rationale: Ọ̀rọ̀ yìí sọ ìgbé ènìyàn kúrò lábẹ́ ìṣàkóso kan sínú òmíràn ní Yorùbá àdánidá, ó sì pa àwòrán ìyípadà ibi tàbí ipò mọ́.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: “Ìjọba” bá àwòrán wíwọlé sínú ibi tí Ọmọ ń ṣàkóso mu, ó sì tún ní èrò ìṣàkóso nínú.
- source_word: υἱοῦ
  choice: Ọmọ
  rationale: Èyí ni ìtumọ̀ tààrà fún υἱός; lẹ́tà ńlá fi hàn pé Ọmọ aláìlẹ́gbẹ́ tí àyíká ẹsẹ náà ń tọ́ka sí ni.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ àdánidá àti tààrà fún ἀγάπη, a sì pa ìṣètò ọ̀rọ̀ oníjẹ́nítífù náà mọ́ bí ó ti ṣeé ṣe.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Ọmọ ìfẹ́ rẹ̀
  rationale: Gbólóhùn yìí pa ìṣètò Gíríìkì náà mọ́, èyí tí ó túmọ̀ ní tààrà sí “Ọmọ ìfẹ́ rẹ̀.” Àwọn ìtumọ̀ Yorùbá tí ó túbọ̀ rọrùn wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ gbólóhùn jẹ́nítífù τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Ọmọ ìfẹ́ rẹ̀
  alternative: Ọmọ rẹ̀ àyànfẹ́; Ọmọ tí ó fẹ́ràn
  rationale: Ọ̀rọ̀ náà ń fi ìfẹ́ pàtàkì tí Baba ní sí Ọmọ hàn. Ọ̀rọ̀ inú ẹsẹ pa ìrísí àti ìfọ̀rọ̀wérọ̀ Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ ń pèsè àwọn ọ̀nà Yorùbá tí ó túbọ̀ ṣe kedere, láìfi ẹ̀kọ́ ẹ̀sìn àfikún kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ọ̀rọ̀ ọ̀wọ̀ tí ó ṣeé lóye fún òǹkàwé òde òní. “Gbà wá là kúrò lábẹ́” àti “mú wa wọ inú” jẹ́ àdánidá ní Yorùbá, nígbà tí “Ọmọ ìfẹ́ rẹ̀” mọ̀ọ́mọ̀ pa ìdíwọ̀n àti ìfarapamọ́ inú gbólóhùn Gíríìkì mọ́.
