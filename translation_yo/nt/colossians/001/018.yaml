id: COL.1.18
reference: Colossians 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: yo
  text: Òun sì ni orí ara náà, ìyẹn ni, ìjọ; òun ni ìbẹ̀rẹ̀[a], àkọ́bí láti inú àwọn òkú, kí òun fúnra rẹ̀ lè di ẹni tí ó ní ipò àkọ́kọ́ nínú ohun gbogbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “orísun” tàbí “olùṣàkóso” dípò “ìbẹ̀rẹ̀” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí òun fúnra rẹ̀ lè jẹ́ ẹni àkọ́kọ́ nínú ohun gbogbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: òun / òun fúnra rẹ̀
  rationale: Àrọ́pò-orúkọ náà ní ìtẹnumọ́. “Òun” fi ìtẹnumọ́ hàn ní ìbẹ̀rẹ̀, “òun fúnra rẹ̀” sì mú un ṣe kedere nínú gbólóhùn ìparí.
- source_word: κεφαλή
  choice: orí
  rationale: “Orí” pa àwòrán orí àti ara mọ́ láì dín ìtumọ̀ rẹ̀ kù sí àṣẹ tàbí orísun nìkan.
- source_word: σώματος
  choice: ara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún àwòrán ara àpapọ̀, ó sì bá “orí” mu.
- source_word: ἐκκλησίας
  choice: ìjọ
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ti fìdí múlẹ̀ fún àwùjọ àwọn ènìyàn Ọlọ́run ní àyíká yìí.
- source_word: ἀρχή
  choice: ìbẹ̀rẹ̀
  rationale: “Ìbẹ̀rẹ̀” bá ìtòlẹ́sẹẹsẹ pẹ̀lú “àkọ́bí láti inú àwọn òkú” mu, ó sì pa àìdánilójú ọ̀rọ̀ Gíríìkì náà mọ́; àwọn ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: πρωτότοκος
  choice: àkọ́bí
  rationale: “Àkọ́bí” pa ìrísí ọ̀rọ̀ àti ìtumọ̀ Bíbélì rẹ̀ mọ́, tó lè kan jíjẹ́ ẹni àkọ́kọ́ àti ipò ọlá.
- source_word: ἐκ τῶν νεκρῶν
  choice: láti inú àwọn òkú
  rationale: Ó ṣàfihàn jíjáde láàárín àwọn òkú ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἵνα γένηται
  choice: kí ... lè di
  rationale: Èyí pa agbára ète tàbí àbájáde ἵνα àti ìtumọ̀ ‘di’ ti γένηται mọ́.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ó ṣàfihàn ìtẹ̀sí gbogbo-ayé ti ọ̀rọ̀ náà láì fi “àwọn ènìyàn” sí i.
- source_word: πρωτεύων
  choice: ẹni tí ó ní ipò àkọ́kọ́
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ jíjẹ́ ẹni àkọ́kọ́ tàbí olórí jù lọ hàn láì mú àbá ẹ̀kọ́ míràn wọlé.
theological_decisions:
- issue: Ìtumọ̀ κεφαλή nínú àwòrán Kristi àti ara
  choice: Pa àwòrán náà mọ́ gẹ́gẹ́ bí “orí.”
  alternative: “olórí” tàbí “orísun” ara
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán ọlọ́rọ̀; “orí” kò pinnu pé àṣẹ nìkan tàbí orísun nìkan ni a túmọ̀ sí.
- issue: Ìtumọ̀ ἀρχή ní ìbáṣepọ̀ pẹ̀lú àjíǹde àti ìṣẹ̀dá tuntun
  choice: “ìbẹ̀rẹ̀”
  alternative: “orísun” tàbí “olùṣàkóso”
  rationale: Àyíká “àkọ́bí láti inú àwọn òkú” ṣe àtìlẹ́yìn fún “ìbẹ̀rẹ̀,” ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àwọn àṣàyàn ọ̀rọ̀ gidi náà hàn.
- issue: Agbára πρωτότοκος ἐκ τῶν νεκρῶν
  choice: “àkọ́bí láti inú àwọn òkú”
  alternative: “ẹni àkọ́kọ́ tí ó jí dìde kúrò nínú òkú”
  rationale: Ìtumọ̀ tí a yàn pa ọ̀rọ̀ “àkọ́bí” àti ìró Bíbélì rẹ̀ mọ́, ó sì jẹ́ kí gbólóhùn tó tẹ̀ lé ṣàlàyé ipò àkọ́kọ́ Kristi.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà níyì, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Èyíinì ni ìjọ” ṣàlàyé ìbáṣepọ̀ ara àti ìjọ láì tú àwòrán náà ká.
