id: COL.1.10
reference: Colossians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: yo
  text: kí ẹ lè máa gbé ìgbé ayé tí ó yẹ fún Olúwa, kí ẹ sì máa mú inú rẹ̀ dùn ní gbogbo ọ̀nà[a], kí ẹ máa so èso nínú gbogbo iṣẹ́ rere, kí ẹ sì máa dàgbà nínú ìmọ̀ Ọlọ́run[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún gbogbo ìtẹ́lọ́run.” Ní tààrà, Gíríìkì sọ pé “sí gbogbo ìtẹ́lọ́run”; ọ̀rọ̀ tó yí i ká fi hàn pé Olúwa ni ẹni tí a ń tẹ́ lọ́rùn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ìmọ̀ kíkún nípa Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìmọ̀ tí ó pé tàbí tí ó jinlẹ̀ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: máa gbé ìgbé ayé
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘rìn,’ ṣùgbọ́n níbí ó jẹ́ àpèjúwe fún bí ènìyàn ṣe ń gbé ìgbé ayé rẹ̀. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àpèjúwe Pọ́ọ̀lù mọ́.
- source_word: ἀξίως τοῦ κυρίου
  choice: tí ó yẹ fún Olúwa
  rationale: Ó fi hàn pé ìgbé ayé wọn gbọ́dọ̀ bá ohun tí Olúwa yẹ sí mu, láìfi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: kí ẹ sì máa mú inú rẹ̀ dùn ní gbogbo ọ̀nà
  rationale: Eyi jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì ṣe àdánidá láti sọ pé kí ìgbé ayé wọn tẹ́ Olúwa lọ́rùn ní gbogbo ọ̀nà. Àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé Gíríìkì kò sọ ẹni tí a ń tẹ́ lọ́rùn ní tààrà.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: kí ẹ máa so èso nínú gbogbo iṣẹ́ rere
  rationale: ‘So èso’ pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá lílo ọ̀rọ̀ náà ní Kólósè 1:6 mu.
- source_word: αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: kí ẹ sì máa dàgbà nínú ìmọ̀ Ọlọ́run
  rationale: 'A ka dative náà sí ààyè tàbí ọ̀nà ìdàgbàsókè: wọn ń dàgbà nínú ìmọ̀ Ọlọ́run. ‘Ìmọ̀’ jẹ́ kedere, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ ìmọ̀ tí ó jinlẹ̀ sí i mọ́.'
theological_decisions:
- issue: Ẹni tí ἀρεσκείαν ń tọ́ka sí
  choice: A sọ ọ́ ní Yorùbá àdánidá gẹ́gẹ́ bí ‘mú inú rẹ̀ dùn,’ níbi tí ‘rẹ̀’ ti ń tọ́ka sí Olúwa.
  alternative: ‘fún gbogbo ìtẹ́lọ́run,’ tí kò sọ ẹni tí a ń tẹ́ lọ́rùn ní tààrà.
  rationale: Gíríìkì fi ẹni náà sílẹ̀ láìsọ, ṣùgbọ́n ọ̀rọ̀ ‘Olúwa’ tó ṣáájú mú ẹni tí a ń tọ́ka sí hàn. Àkọsílẹ̀ ìsàlẹ̀ pa ìfarapamọ́ inú gbolohun Gíríìkì náà mọ́.
- issue: Ìtumọ̀ ἐπίγνωσις
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún tàbí ìmọ̀ jíjinlẹ̀
  rationale: ‘Ìmọ̀’ jẹ́ Yorùbá tó rọrùn, kò sì fi ìtumọ̀ imọ̀-ẹ̀kọ́ kan lé ọ̀rọ̀ náà lórí. Àkọsílẹ̀ ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì lè ní agbára ìtumọ̀ tó jinlẹ̀ sí i.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Máa gbé ìgbé ayé’ jẹ́ àdánidá ju títú àpèjúwe ‘rìn’ sílẹ̀ ní tààrà lọ; ‘so èso’ sì jẹ́ àpèjúwe Bíbélì tí ó mọ́gbọ́n dání ní Yorùbá. Àwọn ‘kí ẹ’ tó tẹ̀ lé ara wọn pa ìbáṣepọ̀ gírámà gbolohun yìí mọ́ pẹ̀lú àdúrà inú ẹsẹ tó ṣáájú.
