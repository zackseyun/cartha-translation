source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: yo
  text: A ń fi gbogbo agbára mú yín lágbára, ní ìbámu pẹ̀lú agbára ńlá ti ògo rẹ̀, fún gbogbo ìfaradà àti sùúrù pẹ̀lú ayọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ‘pẹ̀lú ayọ̀’ lè so mọ́ ‘ìfaradà àti sùúrù,’ tàbí mọ́ ‘dúpẹ́’ ní ẹsẹ̀ tó tẹ̀ lé e.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: nígbà tí a ń fi gbogbo agbára mú yín lágbára
  rationale: Ọ̀rọ̀ yìí fi iṣẹ́ tí ó ń bá a lọ hàn, ẹni tí ń ṣe iṣẹ́ náà kò sì hàn gbangba nínú Gíríìkì; àyíká àdúrà fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ń fún wọn ní agbára. ‘Fi gbogbo agbára mú yín lágbára’ jẹ́ èdè Yorùbá àdánidá, ó sì pa àtúnṣe ọ̀rọ̀ agbára inú Gíríìkì mọ́.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: ní ìbámu pẹ̀lú agbára ńlá ti ògo rẹ̀
  rationale: ‘Ní ìbámu pẹ̀lú’ fi ìwọ̀n tàbí àmì ìlà κατὰ hàn. ‘Agbára ńlá ti ògo rẹ̀’ pa ìbáṣepọ̀ genitive mọ́, láì sọ ọ́ di ‘agbára ológo rẹ̀’ nínú ẹsẹ̀ pàtàkì.
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: kí ẹ lè ní gbogbo ìfaradà àti sùúrù
  rationale: ‘Kí ẹ lè ní’ sọ ète tàbí àbájáde εἰς ní Yorùbá àdánidá. ‘Ìfaradà’ tọ́ka sí dídúró ṣinṣin lábẹ́ ìṣòro, ‘sùúrù’ sì pa ìyàtọ̀ tó wà pẹ̀lú μακροθυμία mọ́.
- source_word: μετὰ χαρᾶς
  choice: pẹ̀lú ayọ̀
  rationale: Ìtumọ̀ tààrà yìí pa ọ̀rọ̀-orúkọ χαρά mọ́, kò sì fi tipátipá pinnu bóyá ó so mọ́ sùúrù tàbí ohun tí ó tẹ̀ lé e.
theological_decisions:
- issue: Ìbáṣepọ̀ fífún àwọn onígbàgbọ́ ní agbára sí ògo Ọlọ́run
  choice: agbára ńlá ti ògo rẹ̀
  alternative: agbára ńlá rẹ̀ tí ó kún fún ògo
  rationale: Yíyan yìí pa gbólóhùn Gíríìkì tó ní ìwúwo mọ́, láì tú u sí ẹ̀kọ́ ìsìn tí ọrọ̀ náà kò sọ ní kedere.
- issue: Ẹni tí ń mú wọn lágbára
  choice: a ń fi ... mú yín lágbára
  alternative: Ọlọ́run ń fi ... mú yín lágbára
  rationale: Ìṣe náà jẹ́ passive nínú Gíríìkì, kò sì dárúkọ ẹni tó ń ṣe é. Àyíká tọ́ka sí Ọlọ́run, ṣùgbọ́n a kò fi orúkọ náà kún ẹsẹ̀ kí a má bàa yanjú ohun tí ìpilẹ̀ṣẹ̀ fi sílẹ̀ lọ́nà àìsọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A fi àmi ohùn sí ibi tí ó yẹ. Fọọmu ‘yín/ẹ’ bá àdúrà tí a ń gbà fún ọ̀pọ̀ ènìyàn mu; ‘nígbà tí’ ń jẹ́ kí participle náà bá ìṣàn gbólóhùn tó bẹ̀rẹ̀ ní àwọn ẹsẹ̀ ṣáájú mu.
