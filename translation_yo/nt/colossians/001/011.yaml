  terminology: ‘Agbára’/‘agbára ńlá’ ń pa ìyàtọ̀ δύναμις àti κράτος mọ́. ‘Ògo,’ ‘ìfaradà,’ ‘sùúrù,’ àti ‘ayọ̀’ jẹ́ ọ̀rọ̀ tó yẹ, tó sì rọrùn nínú Yorùbá òde òní. A pa genitive náà mọ́ nínú ‘agbára ńlá ti ògo rẹ̀,’ láì sọ ọ́ di àlàyé ẹ̀kọ́ ìsìn.
