  source_fidelity: 'Ìtumọ̀ náà mú àwọn ọ̀rọ̀ pàtàkì Gíríìkì náà dáadáa: ìmúlagbára tó ń bá a lọ, ìwọ̀n ‘agbára ńlá ti ògo rẹ̀,’ àti ìparapọ̀ ìfaradà pẹ̀lú sùúrù. Ṣùgbọ́n ‘nígbà tí’ sọ ìbáṣepọ̀ àkókò kan tí participle δυναμούμενοι kò sọ. Àtúnṣe náà ń fi òǹkọ̀wé passive náà sílẹ̀ láì dárúkọ olùṣe iṣẹ́ náà.'
