  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: yo
  text: nítorí ìrètí tí a fi pamọ́ fún yín ní àwọn ọ̀run[a], èyí tí ẹ ti gbọ́ nípa rẹ̀ tẹ́lẹ̀[b] nínú ọ̀rọ̀ òtítọ́, ìyẹn ìhìn rere[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí “ní ọ̀run.” Ní èdè Gíríìkì, ọ̀pọ̀ ni a lò: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé “èyí tí ẹ ti gbọ́ ṣáájú” tàbí “èyí tí ẹ ti gbọ́ nípa rẹ̀ tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: “Ọ̀rọ̀ òtítọ́” tún lè túmọ̀ sí “ìhìn òtítọ́” tàbí “ọ̀rọ̀ ìròyìn òtítọ́.” “Ìhìn rere” dúró gẹ́gẹ́ bí ọ̀rọ̀ ìdánimọ̀, ó ń ṣàlàyé “ọ̀rọ̀ òtítọ́” náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: nítorí ìrètí
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ìdí tàbí ìpìlẹ̀ níbí; “nítorí” mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá. “Ìrètí” sì jẹ́ ìtumọ̀ tó ṣe déédéé fún ἐλπίς láì sọ ọ́ di ìmọ̀lára ìfojúsọ́nà lásán.
- source_word: ἀποκειμένην
  choice: tí a fi pamọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a pa mọ́ tàbí tí a yà sọ́tọ̀ de ẹnì kan. “Fi pamọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa àwòrán ìṣúra tí a tọ́jú mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: 'Dative náà fi àǹfààní àwọn olùgbọ́ hàn: ìrètí náà wà ní ìpamọ́ fún wọn. “Yín” tún fi ọ̀pọ̀ ènìyàn tí Gíríìkì ń bá sọ̀rọ̀ hàn.'
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: Gíríìkì lo ọ̀pọ̀, nítorí náà “àwọn ọ̀run” pa ìrísí orísun mọ́. Àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá tó wọ́pọ̀ jù, “ní ọ̀run,” hàn.
- source_word: ἣν προηκούσατε
  choice: èyí tí ẹ ti gbọ́ nípa rẹ̀ tẹ́lẹ̀
  rationale: ἣν jẹ́ abo ẹyọ kan, ó sì tọ́ka padà sí “ìrètí.” προακούω ní ìtumọ̀ pé wọ́n ti gbọ́ ṣáájú; nítorí ohun tí wọ́n gbọ́ jẹ́ ìrètí, “gbọ́ nípa rẹ̀” jẹ́ Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: nínú ọ̀rọ̀ òtítọ́
  rationale: “Ọ̀rọ̀ òtítọ́” tẹ̀lé λόγος τῆς ἀληθείας pẹ̀kipẹ̀ki, ó sì tún ṣeé lóye gẹ́gẹ́ bí ọ̀rọ̀ tàbí iṣẹ́ tí ń jẹ́ òtítọ́. Àlàyé ìsàlẹ̀ tọ́ka sí “iṣẹ́ òtítọ́” gẹ́gẹ́ bí ìtumọ̀ àdánidá mìíràn.
- source_word: τοῦ εὐαγγελίου
  choice: ìyẹn ìhìn rere
  rationale: Genitive náà dára jù láti kà gẹ́gẹ́ bí apposition tó ń dá “ọ̀rọ̀ òtítọ́” mọ̀ sí “ìhìn rere.” “Ìyẹn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìdánimọ̀ yìí hàn, láì fi ìbáṣepọ̀ mìíràn kún un.
theological_decisions:
- issue: Ohun tí gbólóhùn ìbátan ἣν ń tọ́ka sí
  choice: Ó tọ́ka sí “ìrètí.”
  alternative: Kí a mú un gẹ́gẹ́ bí ohun tó tọ́ka sí gbogbo ìhìn rere tàbí gbogbo èrò tó ṣáájú.
  rationale: ἣν jẹ́ abo ẹyọ kan, ó bá ἐλπίδα (“ìrètí”) mu ní gírámà. Ìtumọ̀ náà pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ pé àwọn ará Kólósè ti gbọ́ nípa ìrètí yìí nínú ìhìn rere.
- issue: Ọ̀pọ̀ nínú οὐρανοῖς
  choice: Lo “àwọn ọ̀run” nínú ọ̀rọ̀ pàtàkì.
  alternative: Lo “ọ̀run” ní ẹyọ kan, gẹ́gẹ́ bí Yorùbá tó wọ́pọ̀.
  rationale: Ọ̀pọ̀ náà wà nínú orísun Gíríìkì; pípa á mọ́ yàgò fún ṣíṣe ọ̀rọ̀ náà bá àṣà ìtumọ̀ kan mu láìjẹ́ dandan.
- issue: Ìbáṣepọ̀ τοῦ εὐαγγελίου pẹ̀lú “ọ̀rọ̀ òtítọ́”
  choice: Ka “ìhìn rere” gẹ́gẹ́ bí apposition tó ń dá “ọ̀rọ̀ òtítọ́” mọ̀.
  alternative: Ka genitive náà bí “ọ̀rọ̀ òtítọ́ tí ó jẹ́ ti ìhìn rere.”
  rationale: Ìtò Gíríìkì fàyè gba ìdánimọ̀ appositional, èyí sì mú kí “ìhìn rere” ṣàlàyé ohun tí “ọ̀rọ̀ òtítọ́” jẹ́ láìgbé ẹ̀kọ́ ẹ̀sìn mìíràn wọ inú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ìbátan àti ìtò apposition ni a pa mọ́ bí ó ti ṣeé ṣe, ṣùgbọ́n a lo “nípa rẹ̀” àti “ìyẹn” kí Yorùbá lè ṣàn dáadáa.
