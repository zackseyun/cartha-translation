id: COL.1.22
reference: Colossians 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, a ti mú yín làjà[a] nínú ara ẹran ara rẹ̀ nípasẹ̀ ikú, láti mú yín wá síwájú rẹ̀ gẹ́gẹ́ bí àwọn ẹni mímọ́, aláìlábàwọ́n[b], tí a kò sì lè fẹ̀sùn kàn sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹ ti di ẹni tí a mú làjà.” Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àgbàṣe; kò dárúkọ ẹni tó ṣe iṣẹ́ náà nínú gbólóhùn yìí.
    reason: alternative_reading
  - marker: b
    text: “Aláìlábàwọ́n” tún lè túmọ̀ sí “tí kò ní àbùkù,” èyí tó pa àwòrán ẹbọ tí kò ní àbùkù mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: Ó pa ìyàtọ̀ tó lágbára mọ́ láàárín ipò wọn tẹ́lẹ̀ ní ẹsẹ 21 àti ohun tó ṣẹlẹ̀ nísinsin yìí.
- source_word: ἀποκατηλλάγητε
  choice: a ti mú yín padà bá a rékọjá
  rationale: Ìtumọ̀ yìí pa ìrísí àgbàṣe ọ̀rọ̀-ìṣe Gíríìkì mọ́, kò sì sọ ẹni tó ṣe iṣẹ́ náà ní pàtó níbi tí gírámà Gíríìkì kò ti sọ ọ́.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: nínú ara ẹran-ara rẹ̀
  rationale: Ó tẹnumọ́ ara gidi tó lè kú; ‘ẹran-ara’ níbí kò túmọ̀ sí ìwà ẹlẹ́ṣẹ̀.
- source_word: διὰ τοῦ θανάτου
  choice: nípasẹ̀ ikú
  rationale: Ó fi ikú hàn gẹ́gẹ́ bí ọ̀nà tí ìpadàbáré fi wáyé, láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: παραστῆσαι
  choice: láti mú yín wá síwájú
  rationale: Ó mú ète tàbí àbájáde ìpadàbáré jáde, ó sì bá àyíká ìdájọ́ mu.
- source_word: ἁγίους
  choice: ẹni mímọ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a yà sọ́tọ̀ fún Ọlọ́run, tó sì mọ́.
- source_word: ἀμώμους
  choice: aláìlábàwọ́n
  rationale: Ó jẹ́ ọ̀rọ̀ àdánidá fún ẹni tí kò ní àbùkù, ó sì tún lè gba ìtumọ̀ ẹbọ tí kò ní àbùkù.
- source_word: ἀνεγκλήτους
  choice: tí kò sì sí ẹ̀sùn kankan sí
  rationale: Ó pa ìtumọ̀ òfin mọ́ pé kò sí ẹ̀sùn tí a lè fi kàn wọ́n, ó sì yàtọ̀ sí ‘aláìlábàwọ́n.’
- source_word: κατενώπιον αὐτοῦ
  choice: síwájú rẹ̀
  rationale: Ó jẹ́ èdè Yorùbá àdánidá fún wíwà níwájú ẹni kan fún ìgbékalẹ̀ tàbí ìdájọ́, láìyan ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí.
theological_decisions:
- issue: Olùṣe iṣẹ́ nínú ἀποκατηλλάγητε
  choice: 'A lo ìrísí àgbàṣe: ‘a ti mú yín padà bá a rékọjá.’'
  alternative: ‘Ó ti mú yín padà bá ara rẹ̀ rékọjá.’
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àgbàṣe, nítorí náà a kò sọ olùṣe iṣẹ́ náà ní pàtó nínú àyọkà pàtàkì, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi ìṣe Ọlọ́run hàn.
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn ara
  choice: ‘ẹran-ara’ ní ìtumọ̀ ara gidi
  alternative: ‘ìwà ẹlẹ́ṣẹ̀’
  rationale: Àyíká ikú ń tọ́ka sí ara ènìyàn gidi ti Kristi, kì í ṣe agbègbè ìwà búburú.
- issue: Ìyàtọ̀ láàárín ἀμώμους àti ἀνεγκλήτους
  choice: ‘aláìlábàwọ́n’ àti ‘tí kò sí ẹ̀sùn kankan sí’
  alternative: ‘láìní àbùkù, láìní àléébù’
  rationale: Àṣàyàn náà kò da àwọn ọ̀rọ̀ méjèèjì pọ̀; ó pa ìṣàpẹẹrẹ ẹbọ àti ìtumọ̀ ẹ̀sùn níwájú ìdájọ́ mọ́.
- issue: Ẹni tí αὐτοῦ ń tọ́ka sí nínú κατενώπιον αὐτοῦ
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘rẹ̀.’
  alternative: ‘níwájú Ọlọ́run’ tàbí ‘níwájú Kristi’
  rationale: Arọ́pò-orúkọ Gíríìkì fúnra rẹ̀ kò dárúkọ ẹni náà; títú u sí Ọlọ́run tàbí Kristi ní pàtó yóò yanjú ohun tí àyọkà fi sílẹ̀ fún àyíká.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘a ti mú’ gẹ́gẹ́ bí àgbàṣe Yorùbá láti pa àìdárúkọ olùṣe iṣẹ́ nínú Gíríìkì mọ́. ‘Ara ẹran-ara’ jẹ́ gbólóhùn tó mọ̀ọ́mọ̀ lágbára díẹ̀ nítorí àyọkà Gíríìkì ń tẹnumọ́ jíjẹ́ ènìyàn ní ara gidi.
