id: COL.1.3
reference: Colossians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: yo
  text: A ń dúpẹ́ lọ́wọ́ Ọlọ́run, Baba Olúwa wa Jésù Mèsáyà[a], nígbà gbogbo, nígbà tí a ń gbàdúrà fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: À ń dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ọpẹ́ hàn; “dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ẹni tí a ń dúpẹ́ fún.
- source_word: τῷ θεῷ πατρὶ
  choice: Ọlọ́run, Baba
  rationale: 'Àwọn ọ̀rọ̀ méjèèjì wà ní ìbámu àpèjúwe: Ọlọ́run ni Baba náà. Àmì kọ́mà pa ìbáṣepọ̀ yìí mọ́ láì sọ wọ́n di ẹni méjì.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: “Olúwa” ni orúkọ oyè Yorùbá tí ó bójú mu fún κύριος, “wa” sì pa ìbáṣepọ̀ oníhun inú Gíríìkì mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ṣì ní agbára orúkọ oyè níhìn-ín, ó sì túmọ̀ sí ẹni tí a fòróró yàn. “Mèsáyà” mú ìtumọ̀ oyè náà hàn; “Jésù Kristi” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí “ní gbogbo ìgbà.” A gbé e lẹ́gbẹ̀ẹ́ gbólóhùn ìdúpẹ́ láti tẹ̀ lé ìtumọ̀ àkọ́kọ́ tí ó ṣeé ṣe jù lọ.
- source_word: περὶ ὑμῶν
  choice: fún yín
  rationale: Pẹ̀lú ọ̀rọ̀ àdúrà, περί pẹ̀lú ọ̀rọ̀ oníhun ń tọ́ka sí àwọn ẹni tí à ń gbàdúrà nítorí wọn; “fún yín” ni Yorùbá àdánidá.
- source_word: προσευχόμενοι
  choice: bí a ti ń gbàdúrà
  rationale: Ẹ̀yà ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí fi hàn pé àdúrà ń lọ papọ̀ pẹ̀lú ìdúpẹ́; “bí a ti ń” pa agbára àsìkò àti ipò rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ọ̀rọ̀ ìdúpẹ́ Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú ìtumọ̀ orúkọ oyè ẹni tí a fòróró yàn hàn, dípò kí Χριστός dà bí orúkọ ìdílé. “Kristi” jẹ́ ìtumọ̀ ìbílẹ̀ tí a fi sí àlàyé ìsàlẹ̀.
- issue: Ẹni tí πάντοτε ń ṣàlàyé
  choice: 'Ó ń ṣàlàyé ìdúpẹ́: “à ń dúpẹ́ ... nígbà gbogbo”'
  alternative: Ó lè sún mọ́ àdúrà pé “a máa ń gbàdúrà fún yín nígbà gbogbo”
  rationale: Ìṣètò gbólóhùn àti ìṣàmúlò Pọ́ọ̀lù ṣe àtìlẹ́yìn fún lílo rẹ̀ pẹ̀lú ọ̀rọ̀ ìṣe pàtàkì Εὐχαριστοῦμεν, bí ó tilẹ̀ jẹ́ pé bí àwọn ọ̀rọ̀ náà ṣe sún mọ́ra kò mú àṣàyàn kejì kúrò pátápátá.
translation_notes:
  register: Èdè Yorùbá ìwòde tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “À ń dúpẹ́ lọ́wọ́” àti “bí a ti ń gbàdúrà” jẹ́ ọ̀nà àdánidá, tí ó sì pa ìbáṣepọ̀ àwọn ọ̀rọ̀ inú Gíríìkì mọ́. Àmì àlàyé [a] wà lẹ́yìn “Mèsáyà,” ibi tí àṣàyàn “Kristi” ti kan ní tààrà.
