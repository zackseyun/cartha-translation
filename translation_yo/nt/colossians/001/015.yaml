id: COL.1.15
reference: Colossians 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: yo
  text: Òun ni àwòrán Ọlọ́run tí a kò lè rí, àkọ́bí gbogbo ìṣẹ̀dá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àkọ́bí” níbí lè túmọ̀ sí ẹni tó ní ipò gíga àti ẹ̀tọ́ ogún, kì í ṣe dandan pé ó jẹ́ ara ohun tí a dá. Wo àlàyé inú àwọn ẹsẹ tó tẹ̀ lé.
    reason: Ṣàlàyé ìtumọ̀ àpẹẹrẹ ọ̀rọ̀ πρωτότοκος ní àyíká rẹ̀, láì pa àìdánilójú gírámà rẹ̀ rẹ́.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Òun ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ọmọ tí ẹsẹ tó ṣáájú mẹ́nu kàn. “Òun ni” jẹ́ ọ̀nà Yorùbá àdánidá láti tẹnumọ́ ẹni tí a ń ṣàpèjúwe.
- source_word: εἰκὼν
  choice: àwòrán
  rationale: “Àwòrán” pa ìtumọ̀ aṣojú àti ìfihàn mọ́ láì fi àlàyé ìmọ̀-ẹ̀sìn kún ọ̀rọ̀ náà.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: Ọlọ́run tí a kò lè rí
  rationale: Èyí sọ àpèjúwe ἀοράτου ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé Ọlọ́run kò ṣeé rí mọ́.
- source_word: πρωτότοκος
  choice: àkọ́bí
  rationale: “Àkọ́bí” ni ìtumọ̀ tààrà tí ó tún lè gbé èrò ipò, ọlá àti ogún, yàtọ̀ sí jíjẹ́ ẹni tí a bí ṣáájú nìkan.
- source_word: πάσης κτίσεως
  choice: gbogbo ìṣẹ̀dá
  rationale: Ìtumọ̀ yìí tẹ̀lé ẹ̀ka ọ̀rọ̀ olùní Gíríìkì ní pẹkipẹki, ó sì pa àìdánilójú gidi tó wà nínú ìbáṣepọ̀ rẹ̀ pẹ̀lú “àkọ́bí” mọ́, dípò fífi “lórí” sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ πρωτότοκος πάσης κτίσεως nípa ìbáṣepọ̀ Kristi pẹ̀lú ìṣẹ̀dá
  choice: àkọ́bí gbogbo ìṣẹ̀dá
  alternative: àkọ́bí tó ga lórí gbogbo ìṣẹ̀dá
  rationale: Ọ̀rọ̀ pàtàkì náà pa àkópọ̀ ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́. Àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé “àkọ́bí” lè tọ́ka sí ipò àti ẹ̀tọ́ ogún, ní ìbámu pẹ̀lú àwọn ẹsẹ tó tẹ̀ lé, láì yí ìtumọ̀ náà padà sí ẹ̀kọ́ ìjọ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu fún kíkà ní gbangba. “Ìṣẹ̀dá” ni a lò fún κτίσις láti tọ́ka sí gbogbo ohun tí a dá gẹ́gẹ́ bí odindi.
