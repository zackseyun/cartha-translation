  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: yo
  text: àṣírí[a] tí a ti fi pamọ́ láti àwọn sáà àti láti àwọn ìran—ṣùgbọ́n ní báyìí ni a ṣí i payá fún àwọn ẹni mímọ́ rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun ìjìnlẹ̀.” Nígbà tí Pọ́ọ̀lù bá lo ọ̀rọ̀ yìí, ó sábà máa ń túmọ̀ sí ète Ọlọ́run tí a ti fi pamọ́ tẹ́lẹ̀, tí a sì ṣí payá ní báyìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ẹni tí a yà sí mímọ́ fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: àṣírí
  rationale: “Àṣírí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a ti fi pamọ́, tí a sì lè ṣí payá. Nínú ọ̀rọ̀ Pọ́ọ̀lù níbí, kò túmọ̀ sí ẹ̀kọ́ ìkọ̀kọ̀ fún àwọn ènìyàn díẹ̀ nìkan, bí kò ṣe ète Ọlọ́run tí ó ti fara sin tẹ́lẹ̀, tí a sì ti sọ di mímọ̀ nísinsin yìí.
- source_word: τὸ ἀποκεκρυμμένον
  choice: tí ó ti farapamọ́
  rationale: Ìtumọ̀ yìí fi ipò tí ó jẹ́ àbájáde fífi ohun náà pamọ́ tẹ́lẹ̀ hàn, gẹ́gẹ́ bí perfect passive participle náà, ó sì jẹ́ Yorùbá tí ó ṣe déédé.
- source_word: ἀπὸ τῶν αἰώνων
  choice: láti àwọn sáà
  rationale: “Àwọn sáà” tọ́ka sí àwọn àkókò tàbí ìgbà gígùn tí ó tẹ̀ lé ara wọn, dípò kí a tú αἰῶνες sí ayérayé. “Láti” pa agbára ἀπό mọ́.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: àti láti àwọn ìran
  rationale: Èyí pa ìbáradọ́gba gbólóhùn Gíríìkì mọ́ láàárín “àwọn sáà” àti “àwọn ìran,” láìfi “gbogbo” kún ọ̀rọ̀ orísun.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n nísinsin yìí
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín bí àṣírí náà ṣe farapamọ́ tẹ́lẹ̀ àti bí a ṣe ṣí i payá ní báyìí.
- source_word: ἐφανερώθη
  choice: a ti ṣí i payá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí ó fara sin ni a mú wá sí ìmọ̀; olùṣe iṣẹ́ náà kò sì hàn gbangba, gẹ́gẹ́ bí passive Gíríìkì.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: fún àwọn ẹni mímọ́ rẹ̀
  rationale: “Àwọn ẹni mímọ́” pa ìtumọ̀ àwọn tí a yà sí mímọ́ fún Ọlọ́run mọ́, kò sì dín wọn kù sí ẹgbẹ́ àwọn ènìyàn pàtàkì kan tí ilé ìjọsìn kan polongo lẹ́yìn ikú wọn.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ẹni mímọ́ rẹ̀”
  choice: Ó ń tọ́ka sí àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́, ìyẹn àwùjọ àwọn onígbàgbọ́.
  alternative: “Àwọn ènìyàn rẹ̀” tàbí kíkà á sí ẹgbẹ́ àwọn ẹni pàtàkì kan ṣoṣo.
  rationale: Nínú lílo Pọ́ọ̀lù, οἱ ἅγιοι sábà máa ń jẹ́ gbogbo àwọn tí Ọlọ́run yà sọ́tọ̀ fún ara rẹ̀. “Àwọn ẹni mímọ́” pa ìwọ̀n ọ̀rọ̀ àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi ìtumọ̀ ẹ̀ya ìjọ kan lé e lórí.
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ αὐτοῦ (“rẹ̀”) ń tọ́ka sí
  choice: A pa “rẹ̀” mọ́ gẹ́gẹ́ bí ó ti wà nínú orísun; ní àyíká ọ̀rọ̀, ó ṣeé ṣe jù pé ó ń tọ́ka sí Ọlọ́run.
  alternative: Láti rọ́pò “rẹ̀” pẹ̀lú “Ọlọ́run” nínú ara ẹsẹ náà.
  rationale: Fífi orúkọ “Ọlọ́run” síbẹ̀ yóò tú ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ. Ìtumọ̀ náà pa ìbáṣepọ̀ gírámà àti àyíká ọ̀rọ̀ mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó lọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àmì gígùn náà pa ìyàtọ̀ pàtàkì tó wà nínú νῦν δὲ mọ́. Ẹsẹ náà jẹ́ àfikún gírámà sí ẹsẹ tó ṣáájú, nítorí náà a kò sọ ọ́ di gbólóhùn òmìnira, a sì pa àmì kọ́má ìparí mọ́.
