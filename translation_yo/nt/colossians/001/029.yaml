id: COL.1.29
reference: Colossians 1:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: yo
  text: Nítorí èyí ni mo sì ń ṣiṣẹ́ kára[a], tí mo ń làkàkà[b] gẹ́gẹ́ bí iṣẹ́ rẹ̀[c], èyí tí ń ṣiṣẹ́ nínú mi pẹ̀lú agbára[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ète yìí” tàbí “fún èyí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí mo ń jàkadì.”
    reason: lexical_alternative
  - marker: c
    text: Èdè Gíríìkì ní “iṣẹ́ rẹ̀”; kò sọ ní pàtó nínú ẹsẹ yìí bóyá Ọlọ́run tàbí Kristi ni “rẹ̀” ń tọ́ka sí.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “èyí tí ń ṣiṣẹ́ nínú mi lọ́nà alágbára” tàbí “èyí tí ń ṣiṣẹ́ nínú mi nínú agbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Nítorí èyí
  rationale: Ó tọ́ka sẹ́yìn sí ète iṣẹ́ ìránṣẹ́ tí a ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘for this’; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ète míì mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ fi ìsapá Pọ́ọ̀lù kún ohun tí ó sọ ṣáájú ní ọ̀nà Yorùbá tó rọrùn.
- source_word: κοπιῶ
  choice: ń ṣiṣẹ́ kára
  rationale: Ọ̀rọ̀ náà túmọ̀ sí iṣẹ́ líle tí ń mú àárẹ̀; ‘ṣiṣẹ́ kára’ jẹ́ ti òde òní, ó sì ṣàfihàn ìsapá náà dáadáa.
- source_word: ἀγωνιζόμενος
  choice: tí mo ń làkàkà
  rationale: Ó ṣàfihàn ìjàkadì àti ìsapá líle; ‘làkàkà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sọ ìtumọ̀ náà di ẹ̀kọ́ pàtó.
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: 'Ó pa ìbáṣepọ̀ ìwọ̀n tàbí ìbámu mọ́: ìsapá Pọ́ọ̀lù bá iṣẹ́ agbára yẹn mu, kì í ṣe agbára ara rẹ̀ nìkan.'
- source_word: ἐνέργειαν
  choice: iṣẹ́
  rationale: Níhìn-ín, ‘iṣẹ́’ túmọ̀ sí ìṣiṣẹ́ tó ń mú ohun ṣẹ, láìlo ‘ẹ̀nàjì’ tí ó ní ìtumọ̀ sáyẹ́ǹsì ní èdè òde òní.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ náà mọ́ láìsọ ní pàtó pé Ọlọ́run tàbí Kristi ni, bí Gíríìkì náà ṣe rí.
- source_word: τὴν ἐνεργουμένην
  choice: èyí tí ń ṣiṣẹ́
  rationale: Ó fi ìṣiṣẹ́ tó ń tẹ̀ síwájú hàn, ó sì tún ìbátan ọ̀rọ̀ rẹ̀ pẹ̀lú ἐνέργεια ṣe ní Yorùbá.
- source_word: ἐν ἐμοὶ
  choice: nínú mi
  rationale: Èyí ni ìtumọ̀ taara jù lọ, ó sì pa àìdánilójú mọ́ láàárín agbára inú àti iṣẹ́ tí a ń ṣe nípasẹ̀ ẹni náà.
- source_word: ἐν δυνάμει
  choice: pẹ̀lú agbára
  rationale: Ó jẹ́ Yorùbá àdánidá fún ọ̀nà tí iṣẹ́ náà gbà ń ṣẹ, ó sì pa δύναμις mọ́ gẹ́gẹ́ bí orúkọ.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (‘rẹ̀’) ń tọ́ka sí
  choice: Pa ‘rẹ̀’ mọ́ láìdárúkọ ẹni náà.
  alternative: ‘iṣẹ́ Ọlọ́run’ tàbí ‘iṣẹ́ Kristi’
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò dárúkọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí. Fífi ‘rẹ̀’ sílẹ̀ pa àìdánilójú àti ìdọ́gba ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
translation_notes:
  register: 'Yorùbá boṣewa tó ní àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ti òde òní, ó sì ṣeé yé fún òǹkàwé gbogbogbò. Ìtẹ̀lé ọ̀rọ̀ jẹ́ ti optimal-equivalence: ó sún mọ́ ìṣètò Gíríìkì, ṣùgbọ́n ó lo gbólóhùn Yorùbá àdánidá.'
