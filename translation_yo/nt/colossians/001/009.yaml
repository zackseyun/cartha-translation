id: COL.1.9
reference: Colossians 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: yo
  text: Nítorí èyí, àwa náà, láti ọjọ́ tí a ti gbọ́, a kò dẹ́kun gbígbàdúrà fún yín àti bíbéèrè pé kí ẹ kún fún ìmọ̀[a] nípa ìfẹ́-inú rẹ̀, nínú gbogbo ọgbọ́n àti òye ti ẹ̀mí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìmọ̀ kíkún.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìmọ̀ tó péye tàbí tó jinlẹ̀ sí i.
    reason: lexical_alternative
  - marker: b
    text: “Ti ẹ̀mí” lè túmọ̀ sí ohun tó ní ànímọ́ ẹ̀mí tàbí ohun tí Ẹ̀mí Mímọ́ fi fúnni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó fi ìdí ohun tí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ṣe múlẹ̀ lórí ìròyìn tí wọ́n ṣẹ̀ṣẹ̀ gbọ́; gbólóhùn yìí pa agbára ìdí-okùnfà rẹ̀ mọ́.
- source_word: καὶ ἡμεῖς
  choice: àwa pẹ̀lú
  rationale: Ó tẹnu mọ́ pé Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ náà wà lára àwọn tí wọ́n dáhùn sí ìròyìn náà.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: láti ọjọ́ tí a ti gbọ́
  rationale: Ó tọ́ka sí ìbẹ̀rẹ̀ àkókò àdúrà wọn tí ó ń bá a lọ, ó sì pa àìsọ ohun tí wọ́n gbọ́ ní tààràtà mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: οὐ παυόμεθα
  choice: a kò dẹ́kun
  rationale: Ó sọ ìṣe tí ó bẹ̀rẹ̀ tẹ́lẹ̀ tí ó sì ń bá a lọ di èdè Yorùbá àdánidá.
- source_word: ὑπὲρ ὑμῶν
  choice: fún yín
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere jù láti sọ pé àdúrà náà jẹ́ nítorí àǹfààní wọn.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: gbígbàdúrà fún yín àti bíbéèrè
  rationale: A pa ìyàtọ̀ tó wà láàárín àdúrà lápapọ̀ àti ẹ̀bẹ̀ pàtó mọ́.
- source_word: ἵνα πληρωθῆτε
  choice: pé kí ẹ kún fún
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún àkóónú ẹ̀bẹ̀ náà, ó sì fi ẹni tó mú wọn kún sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe aláìṣe Gíríìkì.
- source_word: τὴν ἐπίγνωσιν
  choice: ìmọ̀
  rationale: “Ìmọ̀” jẹ́ èdè Yorùbá tó ṣe kedere, nígbà tí àǹfààní ìtumọ̀ “ìmọ̀ kíkún” wà nínú àlàyé ìsàlẹ̀.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: nípa ìfẹ́-inú rẹ̀
  rationale: “Ìfẹ́-inú” sọ ohun tí Ọlọ́run fẹ́ tàbí pinnu ní kedere ju “ìfẹ́” nìkan lọ, tí ó tún lè túmọ̀ sí ìfẹ́ni.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: nínú gbogbo ọgbọ́n àti òye ti ẹ̀mí
  rationale: Ó pa àgbègbè tàbí ọ̀nà tí ìmọ̀ náà ti ń ṣiṣẹ́ mọ́, ó sì jẹ́ kí “ti ẹ̀mí” kan ọgbọ́n àti òye pọ̀, láìfi dandan pinnu bóyá ó túmọ̀ sí ànímọ́ ẹ̀mí tàbí ohun tí Ẹ̀mí Mímọ́ ń fúnni.
- source_word: σοφίᾳ
  choice: ọgbọ́n
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọgbọ́n tí ó ní ìtumọ̀ àti ìlò tó tọ́.
- source_word: συνέσει
  choice: òye
  rationale: “Òye” ṣàfihàn agbára láti lóye ohun àti ìbáṣepọ̀ àwọn nǹkan, ó sì bá “ọgbọ́n” mu lọ́nà àdánidá.
theological_decisions:
- issue: Agbára ìtumọ̀ ἐπίγνωσις nínú àdúrà Pọ́ọ̀lù
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ìmọ̀ tó jinlẹ̀ tàbí tó péye, ṣùgbọ́n ìtumọ̀ àkọ́kọ́ kò gbọ́dọ̀ sọ ìtẹnumọ́ yẹn di dandan níbi tí gbólóhùn Gíríìkì kò ti fipá mú un; àlàyé ìsàlẹ̀ pa àǹfààní náà mọ́.
- issue: Ohun tí πνευματικῇ ń tọ́ka sí
  choice: “ti ẹ̀mí” tó kan ọgbọ́n àti òye méjèèjì láìdárúkọ Ẹ̀mí Mímọ́ ní tààràtà
  alternative: ọgbọ́n àti òye tí Ẹ̀mí Mímọ́ fi fúnni
  rationale: Ajẹtífù Gíríìkì lè ṣàpèjúwe ànímọ́ ẹ̀mí tàbí ìbáṣepọ̀ pẹ̀lú Ẹ̀mí Mímọ́. Ìtumọ̀ àkọ́kọ́ pa àìdánilójú yìí mọ́, àlàyé ìsàlẹ̀ sì sọ àwọn àǹfààní méjèèjì.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ìfẹ́-inú” láti yà ìfẹ́ Ọlọ́run gẹ́gẹ́ bí ohun tí ó fẹ́ tàbí pinnu sọ́tọ̀ kúrò nínú ìfẹ́ni.
