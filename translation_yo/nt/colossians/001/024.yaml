id: COL.1.24
reference: Colossians 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: yo
  text: Nísinsin yìí, mo ń yọ̀ nínú àwọn ìjìyà mi fún yín[a], mo sì ń kún ohun tí ó ṣì kù nínú àwọn ìpọ́njú Mèsáyà[b] nínú ara mi, fún ara rẹ̀, èyí tí í ṣe ìjọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Mo ń mú ohun tí ó kù nínú àwọn ìpọ́njú Kristi pé.” Paulu kò sọ pé iṣẹ́ ètùtù Mèsáyà ní àìpé; ẹsẹ yìí ń sọ nípa bí Paulu ṣe ń kópa nínú àwọn ìjìyà tí ó ní í ṣe pẹ̀lú Mèsáyà àti ara rẹ̀, ìjọ.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν
  choice: Nísinsin yìí
  rationale: Ó jẹ́ àmì àkókò tí ó fi ipò Paulu ní àkókò náà hàn ní ọ̀nà àdánidá.
- source_word: χαίρω
  choice: mo ń yọ̀
  rationale: Ó pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ àti ayọ̀ Paulu mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τοῖς παθήμασιν
  choice: nínú àwọn ìjìyà mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kìíní wá láti inú àyíká ọ̀rọ̀; ó mú un ṣe kedere pé ìjìyà Paulu fúnra rẹ̀ ni.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: 'Ó sọ ìtumọ̀ àǹfààní náà: Paulu ń jìyà fún ire wọn.'
- source_word: ἀνταναπληρῶ
  choice: mo ń mú ... pé
  rationale: Ó pa àwòrán pípe ohun tí ó ṣì kù mọ́ láì sọ pé iṣẹ́ ètùtù Mèsáyà ní àìpé.
- source_word: τὰ ὑστερήματα
  choice: ohun tí ó ṣì kù
  rationale: Ìtumọ̀ àdánidá ni fún ọ̀rọ̀ àkójọpọ̀ Gíríìkì náà, ó sì pa èrò ohun tí ó kù mọ́.
- source_word: τῶν θλίψεων
  choice: àwọn ìpọ́njú
  rationale: Ó yà θλῖψις sọ́tọ̀ díẹ̀ sí πάθημα, tí a túmọ̀ sí ‘ìjìyà’ ní apá àkọ́kọ́.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ pa agbára oyè àti àyíká Júù rẹ̀ mọ́.
- source_word: ἐν τῇ σαρκί μου
  choice: nínú ẹran ara mi
  rationale: Ó tọ́ka sí ìwàláàyè Paulu nínú ara tí a lè fojú rí, kì í ṣe ‘ìwà ẹlẹ́ṣẹ̀’; yíyan ‘ẹran ara’ tún pa ìyàtọ̀ σάρξ mọ́.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: nítorí ara rẹ̀
  rationale: Ó pa ìtumọ̀ pé ìjìyà náà wà fún ire ara Mèsáyà mọ́.
- source_word: σώματος
  choice: ara
  rationale: Ó pa àkàwé Paulu mọ́, èyí tí gbólóhùn tó tẹ̀ lé e túmọ̀ sí ìjọ.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: èyí tí í ṣe ìjọ
  rationale: Ó dá ara Mèsáyà mọ̀ pẹ̀lú ìjọ ní Yorùbá tí ó ṣe kedere, tí ó sì ní iyì.
theological_decisions:
- issue: Ìtumọ̀ ‘ohun tí ó ṣì kù nínú àwọn ìpọ́njú Mèsáyà’
  choice: Paulu ń sọ nípa bí òun fúnra rẹ̀ ṣe ń kópa nínú àwọn ìpọ́njú tí ó bá iṣẹ́ Mèsáyà àti ìjọ rẹ̀ lọ, kì í ṣe pé ikú ètùtù Mèsáyà ní àìpé.
  alternative: Pé ìjìyà Paulu ń mú iṣẹ́ ìràpadà Mèsáyà pé, tàbí pé Paulu ń tọ́ka sí ìwọ̀n kan pàtó ti ìpọ́njú ìgbà ìkẹyìn.
  rationale: Ìtumọ̀ náà pa gbólóhùn alágbára àti àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé kò jẹ́ kí a ka àìpé iṣẹ́ ètùtù sínú rẹ̀. θλίψεις àti ìtọ́kasí sí ara rẹ̀, ìjọ, ṣe atilẹyin kíkópa nínú ìpọ́njú iṣẹ́ ìránṣẹ́.
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός ní agbára oyè; ‘Mèsáyà’ pa ìtumọ̀ oyè yẹn mọ́.
translation_notes:
  register: Yorùbá tó péye, tó ní iyì, tí ó sì ṣeé lóye ni a lò. ‘Nínú ẹran ara mi’ mọ̀ọ́mọ̀ pa ìtumọ̀ ti ara ènìyàn tí σάρξ ní mọ́; àmì ohùn ni a fi sí ibi tí ó yẹ. Àmì [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
