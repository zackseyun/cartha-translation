id: COL.1.25
reference: Colossians 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: yo
  text: Èmi sì di ìránṣẹ́ ìjọ yìí gẹ́gẹ́ bí iṣẹ́ ìríjú láti ọ̀dọ̀ Ọlọ́run tí a fi fún mi nítorí yín, láti mú ọ̀rọ̀ Ọlọ́run ṣẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “láti jẹ́ kí a mọ ọ̀rọ̀ Ọlọ́run ní ẹ̀kúnrẹ́rẹ́,” tàbí “láti parí ọ̀rọ̀ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ìjọ yìí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ abo náà tọ́ka sí ἐκκλησία (‘ìjọ’) ní ẹsẹ tó ṣáájú; fífi ‘ìjọ yìí’ hàn gbangba jẹ́ ohun àdánidá ní Yorùbá.
- source_word: ἐγενόμην
  choice: Èmi sì di
  rationale: Ó fi hàn pé Pọ́ọ̀lù wọ ipò iṣẹ́ yìí, láì sọ ọ́ di gbolohun aláìṣe tí kò pọn dandan.
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Ó tọ́ka sí ẹni tó ń ṣe iṣẹ́ ìsìn, láì gbé orúkọ ipò ṣọ́ọ̀ṣì ti àkókò tó tẹ̀ lé e wọ inú ẹsẹ náà.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: gẹ́gẹ́ bí iṣẹ́ ìríjú láti ọ̀dọ̀ Ọlọ́run
  rationale: ‘Iṣẹ́ ìríjú’ pa àwòrán ojúṣe tí a fi lé ẹni lọ́wọ́ mọ́; ‘láti ọ̀dọ̀ Ọlọ́run’ fi orísun ìfúnni náà hàn.
- source_word: τὴν δοθεῖσάν μοι
  choice: tí a fi fún mi
  rationale: Ó pa ìtumọ̀ participle aláìṣe náà mọ́ ní ọ̀nà tó wọ́pọ̀ ní Yorùbá.
- source_word: εἰς ὑμᾶς
  choice: nítorí yín
  rationale: Ó sọ ìtọ́sọ́nà àti àǹfààní iṣẹ́ Pọ́ọ̀lù sí àwọn ará Kólósè ní kedere.
- source_word: πληρῶσαι
  choice: láti mú ... ṣẹ
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ‘mú ṣẹ/fún ní ẹ̀kúnrẹ́rẹ́’ mọ́, láì dá a mọ́ ìwàásù nìkan.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá tó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú èdè Ìwé Mímọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: láti mú ọ̀rọ̀ Ọlọ́run ṣẹ
  alternative: láti jẹ́ kí a mọ ọ̀rọ̀ Ọlọ́run ní ẹ̀kúnrẹ́rẹ́; láti mú ọ̀rọ̀ Ọlọ́run pé
  rationale: Gbolohun Gíríìkì náà lè tẹnu mọ́ mímú ọ̀rọ̀ náà ṣẹ, pípe rẹ̀, tàbí pípolongo rẹ̀ ní ẹ̀kúnrẹ́rẹ́. Ọ̀rọ̀ inú ẹsẹ pa ìfọ̀rọ̀wérọ̀ yìí mọ́, àlàyé ìsàlẹ̀ sì darúkọ àwọn ìtumọ̀ mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘iṣẹ́ ìríjú’ láti pa àpẹẹrẹ ojúṣe tí Ọlọ́run fi lé Pọ́ọ̀lù lọ́wọ́ mọ́; a sì tún orúkọ ‘ìjọ’ sọ dípò arọ́pò-orúkọ nítorí ìmúlò Yorùbá tó rọrùn.
