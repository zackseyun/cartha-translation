  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ‘ìjọ yìí’ tọ́ka sí ἐκκλησία tó wà ní ẹsẹ ṣáájú, ‘di ìránṣẹ́’ mú ἐγενόμην διάκονος wá, iṣẹ́ ìríjú tí Ọlọ́run fi fún un sì gbé κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι kalẹ̀ ní ìtumọ̀ tí kò fi ẹ̀kọ́ ẹ̀sìn kún un. ‘Láti mú ọ̀rọ̀ Ọlọ́run ṣẹ’ jẹ́ ìtumọ̀ tó ṣeé gbà fún πληρῶσαι, ó sì pa àìdánilójú ìtumọ̀ náà mọ́.'
