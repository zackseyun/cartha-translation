  to: Èmi sì di ìránṣẹ́ ìjọ yìí gẹ́gẹ́ bí iṣẹ́ ìríjú láti ọ̀dọ̀ Ọlọ́run tí a fi fún mi nítorí yín, láti mú ọ̀rọ̀ Ọlọ́run ṣẹ[a].
