  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: yo
  text: Nítorí pé gbogbo ẹ̀kúnrẹ́rẹ́ ní inú dídùn láti máa gbé inú rẹ̀[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí, “Nítorí gbogbo ẹ̀kúnrẹ́rẹ́ ní inú dídùn láti máa gbé inú rẹ̀.” Ọ̀rọ̀ àsopọ̀ náà lè ṣe àlàyé ohun tó ṣáájú ní ọ̀nà tó ju ẹyọ kan lọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀pọ̀ ìtumọ̀ máa ń sọ olùṣe tí wọ́n gbà pé a fi sílẹ̀ ní gbangba pé, “Nítorí Ọlọ́run ní inú dídùn láti jẹ́ kí gbogbo ẹ̀kúnrẹ́rẹ́ rẹ̀ máa gbé inú rẹ̀,” tàbí, “Nítorí Baba ní inú dídùn…” Gíríìkì kò sọ olùṣe náà ní tààràtà.
    reason: alternative_reading
  - marker: c
    text: A sábà máa ń lóye “gbogbo ẹ̀kúnrẹ́rẹ́” gẹ́gẹ́ bí ẹ̀kúnrẹ́rẹ́ Ọlọ́run; wo Kólósè 2:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ọ̀rọ̀ yìí ń ṣàlàyé ìdí fún àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ nípa Ọmọ náà. “Nítorí pé” jẹ́ ọ̀nà àdánidá láti fi agbára ìṣàlàyé rẹ̀ hàn ní Yorùbá.
- source_word: ἐν αὐτῷ
  choice: inú rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Ọmọ tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa rẹ̀. “Inú rẹ̀” pa ọ̀rọ̀ Gíríìkì mọ́ láìfi “Kristi” tàbí “Mèsáyà” kún un.
- source_word: εὐδόκησεν
  choice: ó jẹ́ ìdùnnú
  rationale: Gbólóhùn aláìdárúkọ ẹni yìí sọ èrò inú rere tàbí ìfẹ́ inú dídùn, ṣùgbọ́n kò fi “Ọlọ́run” tàbí “Baba” kún ọ̀rọ̀ tí Gíríìkì kò sọ ní kedere.
- source_word: πᾶν τὸ πλήρωμα
  choice: gbogbo ẹ̀kúnrẹ́rẹ́
  rationale: Ìtumọ̀ yìí pa agbára πᾶν àti ìwúwo ọ̀rọ̀ πλήρωμα mọ́, láìfi “ti Ọlọ́run” kún un níbi tí ẹsẹ yìí kò ti sọ ọ́ ní tààràtà.
- source_word: κατοικῆσαι
  choice: kí … máa gbé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé tàbí fífi ibùgbé múlẹ̀. “Máa gbé” jẹ́ èdè Yorùbá àdánidá, ó sì bá ìrísí ọ̀rọ̀ ẹ̀sìn tó níyì mu.
theological_decisions:
- issue: Ta ni olùṣe εὐδόκησεν?
  choice: A lo gbólóhùn aláìdárúkọ ẹni, “ó jẹ́ ìdùnnú,” láìsọ “Ọlọ́run” tàbí “Baba” ní pàtó.
  alternative: “Nítorí Ọlọ́run ní inú dídùn láti jẹ́ kí gbogbo ẹ̀kúnrẹ́rẹ́ rẹ̀ máa gbé inú rẹ̀” tàbí “Nítorí Baba ní inú dídùn…”
  rationale: Gíríìkì kò sọ olùṣe ọ̀rọ̀-ìṣe náà ní gbangba, πᾶν τὸ πλήρωμα sì lè jẹ́ kókó gbólóhùn náà nítorí ìrísí ọ̀rọ̀ náà. Ìtumọ̀ àkọ́kọ́ kò gbọ́dọ̀ yanju ìṣòro gírámà àti ìtumọ̀ yìí ní ìkọ̀kọ̀.
- issue: Ohun tí “gbogbo ẹ̀kúnrẹ́rẹ́” ń tọ́ka sí
  choice: A pa “gbogbo ẹ̀kúnrẹ́rẹ́” mọ́ láìṣàfikún “ti Ọlọ́run.”
  alternative: “gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run” tàbí “gbogbo ẹ̀kúnrẹ́rẹ́ rẹ̀”
  rationale: Àyíká ọ̀rọ̀ àti Kólósè 2:9 ń tọ́ka gidigidi sí ẹ̀kúnrẹ́rẹ́ Ọlọ́run, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ní àfikún ọ̀rọ̀ tó túmọ̀ sí “ti Ọlọ́run.”
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ó jẹ́ ìdùnnú” láti yẹra fún fífi olùṣe kan tí Gíríìkì kò dárúkọ kún ẹsẹ náà, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ojú ìwé fi àwọn ọ̀nà ìtumọ̀ míì hàn.
