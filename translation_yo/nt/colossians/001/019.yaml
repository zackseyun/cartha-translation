  rationale: Àtúnṣe náà yọ “ó jẹ́ ìdùnnú pé kí” kúrò, nítorí ó jẹ́ gbólóhùn aláìdárúkọ ẹni tí kò sún mọ́ gírámà orísun, tí ó sì kò ṣe àdánidá. Ó jẹ́ kí “gbogbo ẹ̀kúnrẹ́rẹ́” dúró gẹ́gẹ́ bí kókó-ọrọ “ní inú dídùn,” pẹ̀lú infinitive “láti máa gbé,” láìsọ pé Ọlọ́run tàbí Baba ni olùṣe. Àlàyé ìsàlẹ̀ ojú ìwé (a) náà ti di àṣàyàn gidi fún ὅτι.
