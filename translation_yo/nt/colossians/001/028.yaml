id: COL.1.28
reference: Colossians 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: yo
  text: Òun ni àwa ń kéde, tí a ń kìlọ̀ fún olúkúlùkù, tí a sì ń kọ́ olúkúlùkù ní gbogbo ọgbọ́n, kí a lè mú olúkúlùkù wá gẹ́gẹ́ bí ẹni tí ó dàgbà dénú nínú Kristi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: ń kéde
  rationale: Ó túmọ̀ sí pípolongo tàbí kíkéde ní gbangba; “ń kéde” jẹ́ èdè Yorùbá àdánidá tó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: νουθετοῦντες
  choice: ń kìlọ̀ fún
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ fífi ọgbọ́n síni lọ́kàn, pẹ̀lú ìkìlọ̀ àti ìtọ́nisọ́nà; “kìlọ̀ fún” bá àyíká yìí mu láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ẹ̀sìn pàtó.
- source_word: πάντα ἄνθρωπον
  choice: olúkúlùkù
  rationale: Ìtẹnumọ́ Gíríìkì náà jẹ́ lórí ẹnì kọ̀ọ̀kan; “olúkúlùkù” jẹ́ ti gbogbo ènìyàn, kò sì dá sí akọ tàbí abo.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: ní gbogbo ọgbọ́n
  rationale: Ó tẹ̀lé ìtumọ̀ àti ìṣètò ọ̀rọ̀ orísun ní ọ̀nà tó ṣeé lóye ní Yorùbá.
- source_word: παραστήσωμεν
  choice: mú ... wá síwájú Ọlọ́run
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí mímú ẹnì kan dúró tàbí fífi i hàn níwájú ẹlòmíràn. A fi “Ọlọ́run” hàn gẹ́gẹ́ bí ẹni tí a mú wọn tọ̀ wá síwájú rẹ̀, èyí tí àyíká lẹ́tà náà ń tọ́ka sí.
- source_word: τέλειον
  choice: ẹni tí ó dàgbà dénú
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìdàgbàsókè tàbí ìpéye nípa tẹ̀mí, kì í ṣe àìní àṣìṣe pátápátá.
- source_word: ἐν Χριστῷ
  choice: nínú Kristi
  rationale: Ó pa èdè ìṣọ̀kan Pọ́ọ̀lù mọ́, láì dín “ἐν” kù sí kìkì ohun èlò tàbí ọ̀nà.
theological_decisions:
- issue: Ìtumọ̀ τέλειον
  choice: ẹni tí ó dàgbà dénú
  alternative: ẹni pípé
  rationale: “Ẹni tí ó dàgbà dénú” yẹra fún ìtumọ̀ pé ẹni náà kò lè ní àṣìṣe mọ́, ó sì bá ìtumọ̀ ìdàgbàsókè sí ìpéye mu.
- issue: Ẹni tí παραστήσωμεν ń mú wọn wá síwájú rẹ̀
  choice: Ọlọ́run
  alternative: Kristi tàbí fífi ẹni náà sílẹ̀ láì dárúkọ ẹni tí a mú wọn tọ̀ wá síwájú rẹ̀
  rationale: Orísun kò sọ ẹni náà ní tààrà; àyíká Kolosse 1:22 àti lílo Pọ́ọ̀lù ń ṣàtìlẹ́yìn fún Ọlọ́run, ṣùgbọ́n a gbọ́dọ̀ mọ̀ pé àìsọ pàtó kan wà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Ìtẹnumọ́ ìgbà mẹ́ta ti πάντα ἄνθρωπον ni a pa mọ́ nípa lílo “olúkúlùkù” ní gbogbo ibi mẹ́tẹ̀ẹ̀ta.
