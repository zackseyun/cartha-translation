  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: yo
  text: Òun sì wà ṣáájú ohun gbogbo[b], ohun gbogbo sì dúró papọ̀ nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun gbogbo dúró ṣinṣin nínú rẹ̀,” tàbí “ohun gbogbo wà ní ìṣọ̀kan nínú rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ṣáájú ohun gbogbo” tún lè ní ìtumọ̀ pé ó ga ju ohun gbogbo lọ ní ipò, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kọ́kọ́ ń tọ́ka sí jíjẹ́ ṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: Òun
  rationale: Ọ̀rọ̀ arọ́pò orúkọ yìí ní ìtẹnumọ́ nítorí ipò rẹ̀ nínú èdè Gíríìkì; “Òun” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtẹnumọ́ náà mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: πρὸ πάντων
  choice: ṣáájú ohun gbogbo
  rationale: πρό pẹ̀lú ẹ̀yà genitive ní pàtàkì ń tọ́ka sí jíjẹ́ ṣáájú ní àkókò. Gbólóhùn yìí pa ìtumọ̀ àkọ́kọ́ náà mọ́, bí ó tilẹ̀ jẹ́ pé àyíká tún lè mú ìtumọ̀ ipò gíga wá.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó gbòòrò, ó sì kárí gbogbo ohun; yíyan yìí tún pa àtúnlò ọ̀rọ̀ inú àyíká mọ́ láìdín ìtumọ̀ rẹ̀ kù sí ìṣẹ̀dá nìkan.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Yíyan yìí pa ἐν mọ́ gẹ́gẹ́ bí ìbáṣepọ̀ inú ẹni tàbí ààyè tí ìdúróṣinṣin ti wá, dípò yíyí i padà sí “nípasẹ̀ rẹ̀” tàbí “láti ọwọ́ rẹ̀.”
- source_word: συνέστηκεν
  choice: dúró ṣinṣin
  rationale: Perfect tense náà ń sọ ipò tí ó wà nísinsìnyí nítorí ohun tí ó ti ṣẹlẹ̀. “Dúró ṣinṣin” jẹ́ Yorùbá àdánidá fún bí ohun gbogbo ṣe ń bá a lọ ní ìṣọ̀kan àti ètò, láìlo ọ̀rọ̀ imọ̀-ẹ̀kọ́ tí yóò ṣòro fún òǹkàwé.
theological_decisions:
- issue: Ìbáṣepọ̀ Kristi sí ìṣẹ̀dá nínú πρὸ πάντων
  choice: 'Jíjẹ́ ṣáájú ní àkókò ni a fi hàn nínú ọ̀rọ̀ pàtàkì: “ṣáájú ohun gbogbo.”'
  alternative: Jíjẹ́ lókè tàbí ní ipò gíga ju ohun gbogbo lọ.
  rationale: Èdè Gíríìkì kọ́kọ́ ń sọ nípa jíjẹ́ ṣáájú. Àyíká Kólósè 1:15–20 ní ìtumọ̀ tó jinlẹ̀ nípa ẹni Kristi, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ sọ gbogbo ẹ̀kọ́ náà di àlàyé inú ẹsẹ yìí.
- issue: Agbára συνέστηκεν
  choice: 'Ìṣọ̀kan àti ìdúróṣinṣin gbogbo ohun: “ohun gbogbo sì dúró ṣinṣin nínú rẹ̀.”'
  alternative: Gbogbo ohun ní ìpilẹ̀ ìwàláàyè wọn nínú rẹ̀ tàbí wọ́n wà papọ̀ nínú rẹ̀.
  rationale: Ọ̀rọ̀ náà ń fi Kristi hàn gẹ́gẹ́ bí ẹni tí gbogbo ohun ti ní ìṣọ̀kan àti ètò tí ó ń bá a lọ. “Dúró ṣinṣin” sọ èyí ní èdè Yorùbá tó ṣe kedere, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àwọn ojú ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “Òun” fún ìtẹnumọ́, “ṣáájú ohun gbogbo” fún priority, àti “dúró ṣinṣin nínú rẹ̀” láti pa ìtumọ̀ ìṣọ̀kan tí ó ń bá a lọ mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
