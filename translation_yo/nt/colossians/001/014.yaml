translation:
  language: yo
  text: Nínú ẹni náà ni a ní ìràpadà[a], ìdáríjì àwọn ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdásílẹ̀”; àwọn ọ̀rọ̀ Gíríìkì fún “ìràpadà” àti “ìdáríjì” lè ní èrò ìdásílẹ̀. Ó ṣeé ṣe kí Pọ́ọ̀lù lo “ìdáríjì àwọn ẹ̀ṣẹ̀” láti sọ ohun tí ìràpadà yìí jẹ́ níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: nínú ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ọmọ ayanfẹ́ tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; “nínú ẹni tí” pa ìtumọ̀ ìbáṣepọ̀ àti wíwà nínú Kristi mọ́, láì yí i sí ọ̀nà irinṣẹ́ bí “nípasẹ̀ ẹni tí.”
- source_word: ἔχομεν
  choice: àwa ti ní
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí, ó sì sọ pé ìràpadà yìí jẹ́ ohun tí àwọn onígbàgbọ́ ní nísinsìnyí. Fífi “àwa” hàn mú ẹni púpọ̀ inú ọ̀rọ̀ ìṣe Gíríìkì náà ṣe kedere ní Yorùbá.
- source_word: ἀπολύτρωσιν
  choice: ìràpadà
  rationale: “Ìràpadà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ nínú èdè Bíbélì fún ìdásílẹ̀ tí a mú wá ní iye kan; ó pa ìwúwo ọ̀rọ̀ Pọ́ọ̀lù mọ́ ju “ìdásílẹ̀” lásán lọ.
- source_word: ἄφεσιν
  choice: ìdáríjì
  rationale: Nínú ọ̀rọ̀ ẹ̀ṣẹ̀, “ìdáríjì” ni ọ̀nà Yorùbá tó ṣe kedere jù lọ láti sọ mímú ẹ̀bi tàbí gbèsè ẹ̀ṣẹ̀ kúrò; ó tún jẹ́ àlàyé ìràpadà nínú gbólóhùn náà.
- source_word: τῶν ἁμαρτιῶν
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Ẹ̀yà ọ̀rọ̀ yìí sọ ohun tí a dárí jì; “àwọn ẹ̀ṣẹ̀” jẹ́ ìtumọ̀ adayébá fún ọ̀pọ̀ nǹkan tí ọ̀rọ̀ Gíríìkì náà tọ́ka sí.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín “ìràpadà” àti “ìdáríjì àwọn ẹ̀ṣẹ̀”
  choice: 'A fi àwọn gbólóhùn-orúkọ méjèèjì tẹ̀ lé ara wọn gẹ́gẹ́ bí Gíríìkì: “ìràpadà, ìdáríjì àwọn ẹ̀ṣẹ̀.”'
  alternative: “ìràpadà, èyíinì ni, ìdáríjì àwọn ẹ̀ṣẹ̀”
  rationale: Gíríìkì fi “ìdáríjì àwọn ẹ̀ṣẹ̀” ṣe àfikún àlàyé sí “ìràpadà,” ṣùgbọ́n kò ní ọ̀rọ̀ tó túmọ̀ sí “èyíinì ni.” Ìtumọ̀ náà pa ìdánimọ̀ àti ìdààmú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì fi àlàyé tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bá ọ̀nà ìsọ Bíbélì mu. A yan “àwa ti ní” dípò “a ní” láti yà á sọ́tọ̀ kúrò nínú àṣẹ tàbí àsọyé aláìní ẹni, àti láti fi “ἔχομεν” hàn kedere.
