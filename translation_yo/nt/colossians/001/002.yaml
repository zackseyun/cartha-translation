  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: yo
  text: 'Sí àwọn arákùnrin mímọ́ àti olóòótọ́[a][b] nínú Mèsáyà[c] ní Kólósè: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run, Baba wa, wà fún yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “onígbàgbọ́”; ọ̀rọ̀ Gíríìkì πιστοῖς lè ṣàpèjúwe àwọn tí wọ́n gbàgbọ́ tàbí àwọn tí wọ́n jẹ́ olóòótọ́.
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” ni ọ̀rọ̀ Gíríìkì; nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí Pọ́ọ̀lù máa bá gbogbo ìjọ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ tí ó wọ́pọ̀ látijọ́ ni “nínú Kristi.” Oyè Gíríìkì Χριστός túmọ̀ sí “Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: tí wọ́n wà ní Kólósè
  rationale: Ọ̀rọ̀ yìí dá àwọn tí a kọ lẹ́tà sí mọ̀ nípa ibi tí wọ́n wà; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ibi mọ́.
- source_word: ἁγίοις
  choice: mímọ́
  rationale: Àpèjúwe yìí tọ́ka sí àwọn tí a yà sọ́tọ̀ fún Ọlọ́run, láìfi ìtumọ̀ ẹ̀sìn mìíràn kún ọ̀rọ̀ náà.
- source_word: πιστοῖς
  choice: olóòótọ́
  rationale: πιστός lè túmọ̀ sí ẹni tí ó jẹ́ olóòótọ́ tàbí ẹni tí ó gbàgbọ́. “Olóòótọ́” bá àpèjúwe àwọn arákùnrin mu dáadáa, a sì fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀.
- source_word: ἀδελφοῖς
  choice: arákùnrin
  rationale: Èyí ń tẹ̀ lé ọ̀rọ̀ Gíríìkì akọ ní ọ̀pọ̀; àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí Pọ́ọ̀lù máa bá gbogbo ìjọ, títí kan àwọn obìnrin, sọ̀rọ̀.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí Mèsáyà; “nínú” tún pa èdè Pọ́ọ̀lù nípa ìrẹ́pọ̀ pẹ̀lú Mèsáyà mọ́.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Kí oore-ọ̀fẹ́ àti àlàáfíà ... wà fún yín
  rationale: Èyí sọ ìkíni Pọ́ọ̀lù ní Yorùbá àdánidá, nígbà tí ó pa oore-ọ̀fẹ́ àti àlàáfíà àti ẹni tí wọ́n ń tọ̀ sí mọ́.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: láti ọ̀dọ̀ Ọlọ́run Baba wa
  rationale: Ìtumọ̀ náà ka “Baba wa” gẹ́gẹ́ bí àpèjúwe Ọlọ́run, láìfi àsopọ̀ tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ àṣà “Kristi” mọ́.
- issue: Ọ̀rọ̀ akọ ἀδελφοῖς àti gbogbo àwọn tí a ń bá sọ̀rọ̀
  choice: arákùnrin
  alternative: arákùnrin àti arábìnrin
  rationale: Ìtumọ̀ pàtàkì tẹ̀ lé fọ́ọ̀mù akọ ọ̀pọ̀ Gíríìkì; àlàyé ìsàlẹ̀ jẹ́ kí ó ṣe kedere pé ó ṣeé ṣe kí gbogbo ìjọ, pẹ̀lú àwọn obìnrin, wà nínú àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀.
- issue: Àìdánilójú ìtumọ̀ πιστοῖς
  choice: olóòótọ́
  alternative: onígbàgbọ́
  rationale: Ẹsẹ̀ náà kò fipá mú wa láti yan láàárín ìgbàgbọ́ àti ìṣòtítọ́ pátápátá; a yan “olóòótọ́” fún ọ̀rọ̀ inú ẹsẹ̀, a sì pa “onígbàgbọ́” mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún ìkíni lẹ́tà. A lo “Kí ... wà fún yín” láti mú ìkíni aláìṣe-ìṣe Gíríìkì dun bí Yorùbá àdánidá.
