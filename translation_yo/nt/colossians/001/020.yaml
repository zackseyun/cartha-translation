id: COL.1.20
reference: Colossians 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: yo
  text: àti nípasẹ̀ rẹ̀[a] láti mú ohun gbogbo[b] bá ara rẹ̀ làjà, nípa ṣíṣe àlàáfíà nípasẹ̀ ẹ̀jẹ̀ àgbélébùú rẹ̀—nípasẹ̀ rẹ̀[d]—ìbáà ṣe àwọn ohun tí ó wà lórí ilẹ̀ ayé tàbí àwọn ohun tí ó wà nínú àwọn ọ̀run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘lọ́dọ̀ rẹ̀’ fún àwọn ibi méjèèjì tí ‘nípasẹ̀ rẹ̀’ ti fara hàn.
    reason: lexical_alternative
  - marker: b
    text: A fi ‘ohun gbogbo’ sílẹ̀ ní ìtumọ̀ gbígbòòrò, gẹ́gẹ́ bí Gíríìkì àti gbólóhùn tó tẹ̀ lé e, ‘àwọn ohun tí ó wà lórí ilẹ̀ ayé tàbí àwọn ohun tí ó wà nínú àwọn ọ̀run.’ Ẹsẹ̀ yìí fúnra rẹ̀ kò ṣàlàyé bí ìlàjà náà ṣe kan ìgbàlà ìkẹyìn.
    reason: alternative_reading
  - marker: c
    text: Nínú Gíríìkì, ‘àwọn ọ̀run’ jẹ́ ọ̀pọ̀-nọ́mbà.
    reason: lexical_alternative
  - marker: d
    text: Àwọn ìwé àfọwọ́kọ kan kò ní ‘nípasẹ̀ rẹ̀’ kejì.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé òun ni ọ̀nà tàbí aṣojú tí iṣẹ́ ìlàjà fi ṣẹlẹ̀; ó sì pa ìtẹnumọ́ orin náà mọ́.
- source_word: ἀποκαταλλάξαι
  choice: láti mú ... bá ara rẹ̀ làjà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìmúpadàbọ̀ ìbáṣepọ̀ sí àlàáfíà, láìfi ìtumọ̀ àfikún bí ‘làjà pátápátá’ kún un.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìwọ̀n gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, ó sì bá àyíká ọ̀rọ̀ nípa gbogbo ìṣẹ̀dá mu.
- source_word: εἰς αὐτόν
  choice: bá ara rẹ̀
  rationale: Fọ́ọ̀mù afẹ̀yìntì yìí jẹ́ àdánidá ní Yorùbá, ó sì fi hàn pé Ọlọ́run ń mú ohun gbogbo padà sí ìbáṣepọ̀ pẹ̀lú ara rẹ̀ nípasẹ̀ Ọmọ.
- source_word: εἰρηνοποιήσας
  choice: nípa mímú àlàáfíà wá
  rationale: Ó fi ìṣe yìí hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ ìlàjà, láìfi ìbáṣepọ̀ àsìkò tó le koko lé ọ̀rọ̀ Gíríìkì lórí.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: nípasẹ̀ ẹ̀jẹ̀ àgbélébùú rẹ̀
  rationale: A pa ‘ẹ̀jẹ̀’ àti ‘àgbélébùú’ mọ́ ní tààràtà nítorí pàtàkì ìtàn àti ìrúbọ wọn, dípò yíyí wọn padà sí ‘ikú’ nìkan.
- source_word: εἴτε ... εἴτε
  choice: ìbáà ṣe ... tàbí
  rationale: Èyí jẹ́ àkójọpọ̀ Yorùbá tó ṣe kedere fún ìyàtọ̀ méjì tí ó kárí gbogbo ohun tí a mẹ́nu kàn.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: àwọn ohun tí ó wà lórí ilẹ̀ ayé
  rationale: Ó pa ìtakora àgbáyé mọ́ láàárín ilẹ̀ ayé àti àwọn ọ̀run.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: àwọn ohun tí ó wà nínú àwọn ọ̀run
  rationale: A lo ‘àwọn ọ̀run’ láti pa ọ̀pọ̀-nọ́mbà Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n ìlàjà nínú τὰ πάντα
  choice: A túmọ̀ rẹ̀ ní gbígbòòrò sí ‘ohun gbogbo,’ láìdín ohun tí ó ń tọ́ka sí kù tàbí sọ pé ó túmọ̀ sí ìgbàlà gbogbo ènìyàn níkẹyìn.
  alternative: ‘gbogbo ènìyàn’ tàbí ‘gbogbo àgbáyé tí a gbà là níkẹyìn’
  rationale: Ẹsẹ náà sọ̀rọ̀ nípa ìlàjà tó dé gbogbo ìṣẹ̀dá, ṣùgbọ́n kò ṣàlàyé bí ìlàjà yìí ṣe tan mọ́ ìgbàlà ìkẹyìn àwọn ẹ̀dá tó ní ìwà ènìyàn.
- issue: Ẹni tí ‘ara rẹ̀’ nínú εἰς αὐτόν ń tọ́ka sí
  choice: A lóye rẹ̀ pé Ọlọ́run ń mú ohun gbogbo bá ara rẹ̀ làjà nípasẹ̀ Ọmọ.
  alternative: Mèsáyà ń mú ohun gbogbo bá ara rẹ̀ làjà.
  rationale: Ìṣètò gbólóhùn náà ń tẹ̀ síwájú láti ẹsẹ 19, níbi tí inú Ọlọ́run ti dùn pé kí gbogbo ẹ̀kúnrẹ́rẹ́ máa gbé inú Ọmọ; síbẹ̀, ìtumọ̀ náà kò fi orúkọ ‘Ọlọ́run’ kún ọ̀rọ̀ ẹsẹ yìí.
- issue: Ìtumọ̀ ‘ẹ̀jẹ̀ àgbélébùú rẹ̀’
  choice: A pa èdè ẹ̀jẹ̀ àti àgbélébùú mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìrúbọ àti ìkànmọ́ àgbélébùú tó ṣe pàtó.
  alternative: ‘ikú rẹ̀ lórí àgbélébùú’
  rationale: Gíríìkì sọ ‘ẹ̀jẹ̀’ àti ‘àgbélébùú’ ní pàtó; pípa àwọn méjèèjì mọ́ kò fi ẹ̀kọ́ pàtó kan nípa ètùtù lé ẹsẹ náà lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá. ‘Mú ... bá ... làjà’ mú ìtumọ̀ ìpadàbọ̀ ìbáṣepọ̀ jáde kedere; ‘àwọn ọ̀run’ sì pa àwòrán àgbáyé àti ọ̀pọ̀-nọ́mbà orísun mọ́.
