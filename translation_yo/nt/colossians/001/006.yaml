id: COL.1.6
reference: Colossians 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: yo
  text: èyí tí ó ti dé ọ̀dọ̀ yín[a], gẹ́gẹ́ bí ó ti ń so èso, tí ó sì ń dàgbà ní gbogbo ayé[b], bẹ́ẹ̀ náà ni ó ṣe ń so èso, tí ó sì ń dàgbà láàárín yín[c], láti ọjọ́ tí ẹ ti gbọ́, tí ẹ sì wá mọ oore-ọ̀fẹ́ Ọlọ́run ní òtítọ́[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí ó wà pẹ̀lú yín” tàbí “èyí tí ó ti dé láàárín yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “káàkiri gbogbo ayé.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nínú yín.” Giriki lè tọ́ka sí iṣẹ́ ìhìnrere nínú àwùjọ náà lápapọ̀ tàbí nínú àwọn ènìyàn rẹ̀.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ní tòótọ́” tàbí “nínú òtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: èyí tí ó ti dé ọ̀dọ̀ yín
  rationale: Ọ̀rọ̀ náà ń bá àpèjúwe ìhìnrere ní ẹsẹ tó ṣáájú lọ. ‘Ti dé ọ̀dọ̀ yín’ jẹ́ Yorùbá àdánidá, ó sì fi ìrìn dé àti wíwà ìhìnrere pẹ̀lú wọn hàn.
- source_word: καθὼς καὶ ἐν παντὶ τῷ κόσμῳ
  choice: gẹ́gẹ́ bí ... ní gbogbo ayé
  rationale: Èyí pa ìfiwéra àti gbólóhùn àgbáyé ti Giriki mọ́ láì fi ìtumọ̀ ilẹ̀-ayé kun un.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: ó ti ń so èso, tí ó sì ń dàgbà
  rationale: Àwọn ọ̀rọ̀ ìṣe onítẹ̀síwájú fi iṣẹ́ tí ń bá a lọ hàn, wọ́n sì pa àkàwé ohun ọ̀gbìn mọ́.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: bẹ́ẹ̀ náà ni ó ṣe ń ṣiṣẹ́ láàárín yín
  rationale: ‘Láàárín yín’ bá àwùjọ àwọn onígbàgbọ́ mu, ‘ń ṣiṣẹ́’ sì mú iṣẹ́ ìhìnrere tí ọ̀rọ̀ náà tọ́ka sí yé ni Yorùbá láì dín un kù sí ìrírí inú ọkàn nìkan.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσατε
  choice: láti ọjọ́ tí ẹ ti gbọ́
  rationale: Ó fi ìbẹ̀rẹ̀ iṣẹ́ ìhìnrere láàárín wọn hàn, láì fi ‘ní àkọ́kọ́’ tí kò sí nínú Giriki kún un.
- source_word: ἐπέγνωτε
  choice: ẹ sì wá mọ
  rationale: ‘Wá mọ’ sọ ìyípadà sí ìmọ̀ gidi tàbí ìdánimọ̀ hàn, ṣùgbọ́n kò sọ ọ́ di ìmọ̀ pípé ju ẹ̀rí ọ̀rọ̀ náà lọ.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Èyí jẹ́ gbólóhùn ẹ̀kọ́ ìgbàgbọ́ tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ἐν ἀληθείᾳ
  choice: ní òtítọ́
  rationale: Ìtumọ̀ yìí lè tọ́ka sí bí wọ́n ṣe mọ̀ ọ́ ní tòótọ́ tàbí sí òtítọ́ gẹ́gẹ́ bí àyíká àti àkóónú ìmọ̀ náà; a kò fi tipátipá yan ọ̀kan.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn ‘ní gbogbo ayé’
  choice: A pa ọ̀rọ̀ àgbáyé ti Giriki mọ́ gẹ́gẹ́ bí àpèjúwe fífẹ̀ nípa bí ìhìnrere ṣe ń tàn ká.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí ẹ̀rí pé gbogbo ènìyàn àti gbogbo agbègbè lórí ilẹ̀ ayé ti gbọ́ ìhìnrere nígbà náà.
  rationale: Gbólóhùn náà ń tẹnumọ́ bí ìhìnrere ṣe tàn ká; ìtumọ̀ kò gbọ́dọ̀ fi àlàyé ilẹ̀-ayé tí Giriki kò sọ kún un.
- issue: Ìtumọ̀ ἐν ἀληθείᾳ
  choice: ní òtítọ́
  alternative: ní tòótọ́; nínú òtítọ́
  rationale: Giriki gba ìtumọ̀ ọ̀nà ìṣe àti ìtumọ̀ àyíká/àkóónú láàyè. Gbólóhùn àkọ́kọ́ pa ìṣiyèméjì yẹn mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìṣètò ‘gẹ́gẹ́ bí ... bẹ́ẹ̀ náà’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìfiwéra inú Giriki mọ́.
