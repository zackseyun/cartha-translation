  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: yo
  text: Pọ́ọ̀lù, àpọ́sítélì Mèsáyà Jésù[a] nípasẹ̀ ìfẹ́ Ọlọ́run, àti Tímótì, arákùnrin wa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Kristi Jésù.’ Akọ́lé Gíríìkì Χριστός túmọ̀ sí ẹni tí a fi òróró yàn; ‘Mèsáyà’ ni a lò níhìn-ín láti pa agbára akọ́lé náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, ‘arákùnrin náà’; ‘arákùnrin wa’ jẹ́ ọ̀nà adayébá láti sọ ìbáṣepọ̀ náà ní ìbẹ̀rẹ̀ lẹ́tà yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà ní ọ̀nà tí ó bá ìró Yorùbá mu.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ tí a ti mọ̀ ní Yorùbá fún ipò ẹni tí a rán pẹ̀lú àṣẹ; ó pa agbára akọ́lé Pọ́ọ̀lù mọ́ ju ‘òjíṣẹ́’ lọ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí akọ́lé níhìn-ín; ‘Mèsáyà’ fi ìtumọ̀ ẹni tí a fòróró yàn hàn, nígbà tí ‘Jésù’ jẹ́ orúkọ.
- source_word: διὰ θελήματος θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: Ní ọ̀rọ̀ yìí, διά pẹ̀lú ẹ̀yà oníṣe-orúkọ ń tọ́ka sí ìpìlẹ̀ tàbí ọ̀nà tí Ọlọ́run fi yan Pọ́ọ̀lù; gbolohun yìí jẹ́ adayébá ní Yorùbá.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ tó rọrùn láàárín Pọ́ọ̀lù àti Tímótì.
- source_word: Τιμόθεος
  choice: Tímótì
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ὁ ἀδελφὸς
  choice: arákùnrin wa
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ‘arákùnrin náà,’ ‘arákùnrin wa’ ń sọ ìbáṣepọ̀ ìdílé àwọn onígbàgbọ́ náà lọ́nà adayébá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ní agbára akọ́lé ní ìdánimọ̀ ‘àpọ́sítélì Mèsáyà Jésù’; ‘Mèsáyà’ pa ìtumọ̀ akọ́lé náà mọ́ láìsọ ọ́ di apá orúkọ lásán.
- issue: Agbára ìbáṣepọ̀ nínú ὁ ἀδελφός
  choice: arákùnrin wa
  alternative: arákùnrin náà
  rationale: ‘Wa’ jẹ́ kí ìbáṣepọ̀ àwùjọ àwọn onígbàgbọ́ tó wà nínú ọ̀rọ̀ náà hàn ní Yorùbá adayébá, láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa ìrísí ìbẹ̀rẹ̀ lẹ́tà náà mọ́, tó sì ń bá ẹsẹ̀ tó tẹ̀ lé e lọ.
