  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: yo
  text: níwọ̀n bí a ti gbọ́ nípa ìgbàgbọ́ yín nínú Mèsáyà Jésù àti ìfẹ́ tí ẹ ní sí gbogbo àwọn ènìyàn mímọ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúróṣinṣin yín nínú Mèsáyà Jésù” tàbí “ìgbẹ́kẹ̀lé yín nínú Mèsáyà Jésù.” Ọ̀rọ̀ Gíríìkì náà, pistis, lè ní àwọn ìtumọ̀ wọ̀nyí tó sún mọ́ra, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nígbà tí a gbọ́ nípa
  rationale: Ó pa ìsopọ̀ participle aorist mọ́ pẹ̀lú kókó ọ̀rọ̀ tí a lóye láti ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a gbọ́ ìròyìn nípa ohun kan.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις ní àyíká yìí, níbi tí ó ti ń tọ́ka sí ìgbẹ́kẹ̀lé àwọn ará Kólósè tí ó dúró nínú Mèsáyà Jésù; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ tó lè jẹ́ mọ́.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa ìtumọ̀ ìbáṣepọ̀ àti ipò tí ἐν ní mọ́, “Mèsáyà” sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè, nígbà tí “Jésù” jẹ́ orúkọ.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ἀγάπη mu ní àyíká yìí.
- source_word: ἣν ἔχετε
  choice: tí ẹ ní
  rationale: Ó fi gbólóhùn arọ́pò-orúkọ inú ẹ̀rí Gíríìkì hàn ní ọ̀nà Yorùbá tó ṣe àdánidá.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: sí gbogbo àwọn ènìyàn mímọ́
  rationale: “Sí” fi ìdarí ìfẹ́ náà hàn, “àwọn ènìyàn mímọ́” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ àwọn ẹni tí a yà sọ́tọ̀ fún Ọlọ́run.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí ọ̀rọ̀ tó dà bí orúkọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú gbólóhùn yìí, Χριστῷ jẹ́ oyè tó wà pẹ̀lú orúkọ Jésù; “Mèsáyà” mú ipa oyè náà hàn kedere.
- issue: Oríṣiríṣi ìtumọ̀ tí πίστις lè ní
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: Àyíká “nínú Mèsáyà Jésù” ṣe àtìlẹ́yìn fún ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa àǹfààní ìtumọ̀ “ìṣòtítọ́” mọ́ láìyanjú àríyànjiyàn náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. Gbólóhùn náà mọ̀ọ́mọ̀ bẹ̀rẹ̀ gẹ́gẹ́ bí abala tó so mọ́ ẹsẹ tó ṣáájú, bí participle Gíríìkì ṣe ń ṣiṣẹ́.
