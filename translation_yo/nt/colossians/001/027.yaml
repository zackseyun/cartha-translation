id: COL.1.27
reference: Colossians 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: yo
  text: Àwọn ẹni mímọ́ náà ni Ọlọ́run fẹ́ fi hàn bí ọrọ̀ ògo ohun ìjìnlẹ̀ yìí ti pọ̀ tó láàárín àwọn tí kì í ṣe Júù[a]. Ohun ìjìnlẹ̀ náà ni Mèsáyà nínú yín[b], ìrètí ògo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láàárín àwọn orílẹ̀-èdè.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “láàárín yín.” Gbólóhùn Gíríìkì náà lè tọ́ka sí Mèsáyà nínú àwọn onígbàgbọ́ tàbí sí wíwà rẹ̀ láàárín wọn gẹ́gẹ́ bí àwùjọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Àwọn ẹni mímọ́ náà ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ‘àwọn ẹni mímọ́’ ní ẹsẹ tó ṣáájú; ìtumọ̀ yìí mú ẹni tí Ọlọ́run fi ohun náà hàn ṣe kedere ní Yorùbá.
- source_word: ἠθέλησεν
  choice: fẹ́
  rationale: θέλω lè túmọ̀ sí fífẹ́, pípinnu tàbí yíyan láti ṣe ohun kan. ‘Fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi agbára yan ìtumọ̀ kan ṣoṣo nínú àwọn wọ̀nyí.
- source_word: γνωρίσαι
  choice: fi hàn
  rationale: Ó sọ ìṣe mímú ohun kan di mímọ̀. ‘Fi hàn’ bá èdè Yorùbá mu, ó sì pa èrò ìṣípayá ohun ìjìnlẹ̀ náà mọ́.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: bí ọrọ̀ ògo ... ti pọ̀ tó
  rationale: Gbólóhùn Gíríìkì náà ṣókí, ó sì ń tẹnumọ́ bí ọrọ̀ ògo náà ti tóbi tó. Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ yẹn mọ́ láìlo gbólóhùn tí kò wọ́pọ̀.
- source_word: μυστηρίου
  choice: ohun ìjìnlẹ̀
  rationale: Nínú ọ̀rọ̀ Paulu, èyí jẹ́ ète Ọlọ́run tí ó ti fara sin tẹ́lẹ̀ ṣùgbọ́n tí a ti sọ di mímọ̀, kì í ṣe àdììtú tí kò ṣeé mọ̀.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἔθνη ń tọ́ka pàápàá sí àwọn ènìyàn tí kì í ṣe Júù. Ìtumọ̀ yìí ṣe kedere, kò sì ní ìró ẹ̀gàn tí ‘Kèfèrí’ lè ní ní Yorùbá òde òní.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ní agbára oyè ẹni tí Ọlọ́run yàn, torí náà ‘Mèsáyà’ dá ìtumọ̀ oyè náà dúró ju lílò ‘Kristi’ bí orúkọ lọ.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì lè tọ́ka sí wíwà Mèsáyà nínú àwọn onígbàgbọ́. Nítorí ọ̀rọ̀ náà tún lè túmọ̀ sí ‘láàárín yín,’ a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: ìrètí ògo
  rationale: Ìtumọ̀ ṣókí yìí tẹ̀ lé ìsopọ̀ ọ̀rọ̀ Gíríìkì, kò sì pinnu ju bó ṣe yẹ lọ bóyá ògo ni ohun tí a ń retí tàbí ohun tó ń fúnni ní ìrètí.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Gbólóhùn náà ń ṣàlàyé ẹni tí ohun ìjìnlẹ̀ náà jẹ́, nítorí náà agbára oyè Χριστός hàn gbangba.
- issue: Ìtumọ̀ ἐν ὑμῖν
  choice: nínú yín
  alternative: láàárín yín
  rationale: Gíríìkì lè tọ́ka sí wíwà Mèsáyà nínú àwọn onígbàgbọ́ tàbí sí wíwà rẹ̀ láàárín wọn gẹ́gẹ́ bí àwùjọ. A fi ìtumọ̀ tààrà sínú ẹsẹ, a sì fi èkejì sínú àlàyé láti pa àìdánilójú náà mọ́.
- issue: Àwọn tí ἔθνη ń tọ́ka sí
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè
  rationale: Ìyàtọ̀ láàárín Júù àti àwọn ènìyàn mìíràn ṣe pàtàkì nínú àyíká ọ̀rọ̀ yìí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ ‘àwọn orílẹ̀-èdè’; àlàyé ìsàlẹ̀ pa èyí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn tí kì í ṣe Júù’ dípò ‘Kèfèrí’ láti yẹra fún ìró ẹ̀gàn, a sì lo ‘ohun ìjìnlẹ̀’ fún μυστήριον láti fi hàn pé ète Ọlọ́run tí a ti ṣí payá ni, kì í ṣe àdììtú lásán.
