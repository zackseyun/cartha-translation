source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: yo
  text: Àti ẹ̀yin[a] tí ẹ ti di àjèjì nígbà kan rí, tí ẹ sì jẹ́ ọ̀tá nínú èrò inú yín, nínú àwọn iṣẹ́ búburú—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì: “Àti ẹ̀yin tí ẹ ti di àjèjì nígbà kan rí, tí ẹ sì jẹ́ ọ̀tá nínú èrò inú, nínú àwọn iṣẹ́ búburú.” Gíríìkì náà ṣókí, kò sì sọ ẹni tí wọ́n yà kúrò lọ́dọ̀ rẹ̀ tàbí ẹni tí wọ́n jẹ́ ọ̀tá rẹ̀ ní tààrà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Àti ẹ̀yin
  rationale: Ó pa ìsopọ̀ mọ́ gbólóhùn tó ṣáájú, ó sì fi àwọn olùgbọ́ sínú iṣẹ́ ìlàjà Kristi.
- source_word: ποτε ὄντας
  choice: tí ẹ ... nígbà kan rí
  rationale: Gbólóhùn aláfarawé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò wọn tẹ́lẹ̀.
- source_word: ἀπηλλοτριωμένους
  choice: tí ẹ ti jìnnà sí Ọlọ́run
  rationale: Ó sọ ipò ìyapa àti àjèjì ní ìbáṣepọ̀; fífi ‘Ọlọ́run’ kún un mú ẹni tí wọn jìnnà sí hàn gbangba gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἐχθροὺς
  choice: ọ̀tá rẹ̀
  rationale: Ó pa àwòrán orúkọ Gíríìkì ‘àwọn ọ̀tá’ mọ́ dípò yíyí i sí àpèjúwe ìkórìíra nìkan.
- source_word: τῇ διανοίᾳ
  choice: nínú èrò inú yín
  rationale: Ó túmọ̀ dative of sphere/respect lọ́nà Yorùbá tó ṣe kedere, ní títọ́ka sí èrò àti ìwà inú.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: nínú àwọn iṣẹ́ búburú yín
  rationale: Ó pa ἐν (‘nínú’) mọ́, kò sì fi ìdí-okùnfà tàbí ọ̀rọ̀ aláfarawé tí kò sí nínú Gíríìkì kún un.
- source_word: ἔργοις
  choice: iṣẹ́
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìṣe tàbí iṣẹ́ tí ènìyàn ṣe; àyíká ‘búburú’ yọ ìtumọ̀ rẹ̀ kedere.
- source_word: πονηροῖς
  choice: búburú
  rationale: Ó gbé agbára ìdájọ́ ìwà rere Gíríìkì jáde ní èdè Yorùbá òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín jíjẹ́ ọ̀tá nínú èrò àti àwọn iṣẹ́ búburú
  choice: nínú èrò inú yín, nínú àwọn iṣẹ́ búburú yín
  alternative: ẹ ní èrò ọ̀tá, tí ẹ ń ṣe iṣẹ́ búburú
  rationale: Ìtúmọ̀ àkọ́kọ́ pa ìṣọ̀kan Gíríìkì mọ́, ó sì jẹ́ kí ἐν tọ́ka sí ààyè tàbí ìfarahàn ìṣọ̀tá láì sọ pé iṣẹ́ búburú ló fa á.
- issue: Ẹni tí ìyapa àti ìṣọ̀tá dojú kọ
  choice: Ọlọ́run ... ọ̀tá rẹ̀
  alternative: ẹ ti di àjèjì ... ẹ sì ní ọkàn ọ̀tá
  rationale: Àyíká ìlàjà pẹ̀lú Ọlọ́run fi ẹni tí ọ̀rọ̀ ń tọ́ka sí hàn; síbẹ̀, àlàyé ẹsẹ̀ kékeré jẹ́wọ́ pé àwọn ọ̀rọ̀ wọ̀nyí kò fara hàn ní tààrà nínú Gíríìkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. Ohùn gbólóhùn náà ń bá ẹsẹ̀ tó ṣáájú àti tó tẹ̀ lé e lọ, nítorí náà a pa àmì gígùn—mọ́ ní òpin. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
