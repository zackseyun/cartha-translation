  source_fidelity: Ìtumọ̀ náà mú ποτε, ipò ìyapa, ọ̀tá nínú èrò inú, àti àwọn iṣẹ́ búburú jáde dáadáa. Ṣùgbọ́n ‘sí Ọlọ́run’ àti ‘rẹ̀’ jẹ́ ìfikún tí kò fara hàn nínú ẹsẹ̀ Gíríìkì fúnra rẹ̀. Bó tilẹ̀ jẹ́ pé àyíká ẹsẹ̀ tó yí i ká ń tọ́ka sí Ọlọ́run, a kò gbọ́dọ̀ mú ìtọ́kasí yẹn wá sínú ọ̀rọ̀ àkọ́kọ́, nítorí Gíríìkì fi ẹni tí a yà kúrò lọ́dọ̀ rẹ̀ àti ẹni tí wọ́n jẹ́ ọ̀tá rẹ̀ sílẹ̀ láì sọ ọ́.
