id: COL.1.7
reference: Colossians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: yo
  text: gẹ́gẹ́ bí ẹ ti kọ́ ọ́ láti ọ̀dọ̀ Ẹ́páfírà, ẹlẹ́rú ẹlẹgbẹ́ wa tí a fẹ́ràn, ẹni tí ó jẹ́ ìránṣẹ́ olóòtítọ́ fún Mèsáyà ní ipò wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ka “ní ipò yín” dípò “ní ipò wa.” Gbólóhùn Gíríìkì náà tún lè túmọ̀ sí “nítorí wa.”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa agbára ìfiwéra àti ìbámu pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: ẹ ti kọ́ ọ láti ọ̀dọ̀ Ẹ́páfírà
  rationale: Aorist náà tọ́ka sí bí àwọn ará Kólósè ti gba ẹ̀kọ́ ìhìn rere; “láti ọ̀dọ̀” fi Ẹ́páfírà hàn gẹ́gẹ́ bí orísun ẹ̀kọ́ náà. Arọ́pò-orúkọ “ọ” jẹ́ ohun tí Yorùbá nílò ní ti èdè, ó sì tọ́ka sí ohun tí wọ́n gbọ́ tí àyíká ọ̀rọ̀ ṣáájú ti sọ.
- source_word: τοῦ ἀγαπητοῦ
  choice: olùfẹ́ wa
  rationale: Ó sọ ìfẹ́ tímọ́tímọ́ tí ọ̀rọ̀ Gíríìkì náà ní jáde ní Yorùbá àdánidá.
- source_word: συνδούλου ἡμῶν
  choice: ẹlẹ́rú ẹlẹgbẹ́ wa
  rationale: Ó pa àwòrán àwọn ẹni tí wọ́n jọ wà lábẹ́ Olúwa kan náà mọ́; “ẹlẹ́rú” lágbára ju “ìránṣẹ́” lọ, gẹ́gẹ́ bí σύνδουλος ṣe jẹ́.
- source_word: πιστὸς
  choice: olóòtítọ́
  rationale: Ó lè túmọ̀ sí ẹni tí ó dúró ṣinṣin, tí a sì lè gbẹ́kẹ̀ lé nínú iṣẹ́.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ó jẹ́ Yorùbá àdánidá fún iṣẹ́ tí a ṣe fún àǹfààní tàbí ní ipò àwọn mìíràn, láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
- source_word: διάκονος τοῦ Χριστοῦ
  choice: ìránṣẹ́ ... ti Mèsáyà
  rationale: διάκονος níbí ń tọ́ka sí ẹni tó ń ṣe iṣẹ́ ìránṣẹ́, kì í ṣe dandan ipò ṣọ́ọ̀ṣì kan; “Mèsáyà” pa ìtumọ̀ oyè Χριστός mọ́.
theological_decisions:
- issue: Ìtumọ̀ σύνδουλος
  choice: ẹlẹ́rú ẹlẹgbẹ́ wa
  alternative: ìránṣẹ́ ẹlẹgbẹ́ wa
  rationale: Àṣàyàn náà pa ìbáṣepọ̀ jíjẹ́ ohun-ìní Olúwa kan náà mọ́, bí ó tilẹ̀ jẹ́ pé “ìránṣẹ́ ẹlẹgbẹ́” rọrùn sí etí.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ẹ́páfírà ń sìn; “Mèsáyà” fi ìtumọ̀ oyè náà hàn.
- issue: Ìtumọ̀ ὑπὲρ ἡμῶν
  choice: nítorí wa
  alternative: ní ipò wa
  rationale: “Nítorí wa” lè gba èrò àǹfààní àti aṣojú méjèèjì; àkọsílẹ̀ ẹsẹ̀ fi ìtumọ̀ aṣojú tó lágbára jù hàn láìpa àìdánilójú náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. “Ẹlẹ́rú ẹlẹgbẹ́” mọ̀ọ́mọ̀ pa àwòrán Gíríìkì tó le koko mọ́; “ìránṣẹ́” ni a lò fún διάκονος láti yà iṣẹ́ ìránṣẹ́ sọ́tọ̀ kúrò nínú jíjẹ́ ẹrú.
