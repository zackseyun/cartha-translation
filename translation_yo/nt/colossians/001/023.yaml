id: COL.1.23
reference: Colossians 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: yo
  text: bí ẹ̀yin bá sì ń dúró nínú ìgbàgbọ́ nítòótọ́, tí a ti fìdí yín múlẹ̀, tí ẹ sì dúró ṣinṣin, láì yí yín kúrò nínú ìrètí ìhìn rere tí ẹ gbọ́, èyí tí a ti kéde nínú gbogbo ìṣẹ̀dá lábẹ́ ọ̀run[a]. Èmi Pọ́ọ̀lù sì di ìránṣẹ́ ìhìn rere náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “nínú gbogbo ìṣẹ̀dá lábẹ́ ọ̀run” tàbí “fún gbogbo ẹ̀dá lábẹ́ ọ̀run”; ọ̀rọ̀ Gíríìkì κτίσις lè túmọ̀ sí “ìṣẹ̀dá” tàbí, ní àwọn àyíká kan, “ẹ̀dá.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ διάκονος sí “òjíṣẹ́”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìránṣẹ́ tàbí òjíṣẹ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: bí ẹ̀yin bá sì ... nítòótọ́
  rationale: Ó pa agbára ọ̀rọ̀ àídájú εἰ mọ́, nígbà tí “nítòótọ́” ń fi ìtẹnumọ́ γε hàn láì sọ ọ́ di ohun tí ó ti dájú.
- source_word: ἐπιμένετε τῇ πίστει
  choice: ń dúró nínú ìgbàgbọ́
  rationale: “Ń dúró” fi ìtẹ̀síwájú ìṣe náà hàn; “nínú ìgbàgbọ́” sì pa ààyè ìtumọ̀ τῇ πίστει mọ́.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: tí a ti fi ìpìlẹ̀ múlẹ̀, tí ẹ sì dúró ṣinṣin
  rationale: “A ti fi ìpìlẹ̀ múlẹ̀” pa àkàwé ìpìlẹ̀ àti ipò tí ìṣe àtijọ́ ti mú wá mọ́; “dúró ṣinṣin” sọ ìdúróṣinṣin ἑδραῖοι ní Yorùbá àdánidá.
- source_word: μὴ μετακινούμενοι
  choice: láì jẹ́ kí a ṣí yín kúrò
  rationale: Ó pa ohùn àfaradà àti àwòrán yíyí ẹni kúrò ní ipò rẹ̀ mọ́.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: kúrò nínú ìrètí ìhìn rere
  rationale: Ó pa ìbáṣepọ̀ tí ó wà láàárín ìrètí àti ìhìn rere mọ́ láì pinnu bóyá ìhìn rere ni ó ń fúnni ní ìrètí tàbí ìrètí tí ó jẹ́ ti ìhìn rere.
- source_word: τοῦ κηρυχθέντος ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: èyí tí a ti kéde láàárín gbogbo ìṣẹ̀dá lábẹ́ ọ̀run
  rationale: “Kéde” mú agbára ìkéde gbangba κηρύσσω jáde; “gbogbo ìṣẹ̀dá” pa ìtumọ̀ gbooro κτίσις mọ́, pẹ̀lú àlàyé àṣàyàn nínú àkọsílẹ̀.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: Èmi Pọ́ọ̀lù sì ti di ìránṣẹ́ ìhìn rere náà
  rationale: Ó sọ ohun tí οὗ ń tọ́ka sí di mímọ́ ní Yorùbá, ó sì lo “ìránṣẹ́” fún διάκονος láì fi ipò ṣọ́ọ̀ṣì kan kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Agbára àídájú εἴ γε àti ìforítì nínú ìgbàgbọ́
  choice: bí ẹ̀yin bá sì ń dúró ... nítòótọ́
  alternative: níwọ̀n bí ẹ̀yin ti ń dúró; bí ẹ̀yin bá dúró gẹ́gẹ́ bí àídájú tí ó túmọ̀ sí pé a lè pàdánù ìgbàlà
  rationale: Gíríìkì gbé ìtẹ̀síwájú nínú ìgbàgbọ́ kalẹ̀ gẹ́gẹ́ bí àídájú, ṣùgbọ́n ẹsẹ̀ yìí nìkan kò parí àríyànjiyàn nípa ìforítì tàbí ìṣubú kúrò nínú ìgbàlà.
- issue: Ìtumọ̀ πίστις nínú τῇ πίστει
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: Nínú àyíká yìí, “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ tí ó bá ọ̀rọ̀ náà mu jù, láì dá a sí “ìṣòtítọ́.”
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti òde òní. A lo “ẹ̀yin” láti fi ẹni púpọ̀ hàn, a sì tún “ìhìn rere náà” sọ ní gbangba ní ìparí nítorí pé ọ̀rọ̀ arọ́pò Gíríìkì kì í ṣe àdánidá ní Yorùbá níbi yìí.
