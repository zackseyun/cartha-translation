id: COL.4.8
reference: Colossians 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: yo
  text: 'Mo rán an sí yín fún ìdí yìí gan-an: kí ẹ lè mọ bí àwa ṣe wà[a], àti kí ó lè fún ọkàn yín ní ìṣírí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kà á pé, “kí àwa lè mọ bí ẹ ṣe wà.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: an
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Tíkíkù ní ẹsẹ tó ṣáájú; “an” ni ìtumọ̀ Yorùbá tó bá ọ̀rọ̀ náà mu.
- source_word: ἔπεμψα
  choice: Mo rán
  rationale: Aorist indicative náà ń sọ ìṣe tí olùkọ̀wé ṣe; ọ̀nà àdánidá ni Yorùbá ni “Mo rán.”
- source_word: πρὸς ὑμᾶς
  choice: sí yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe rírán, gbólóhùn náà fi ibi tí ẹni náà ń lọ hàn.
- source_word: εἰς αὐτὸ τοῦτο
  choice: fún ìdí pàtàkì yìí gan-an
  rationale: “Gan-an” àti “pàtàkì” mú ìtẹnumọ́ inú αὐτὸ τοῦτο jáde ní Yorùbá àdánidá.
- source_word: ἵνα γνῶτε
  choice: kí ẹ lè mọ
  rationale: Ó pa ète rírán Tíkíkù mọ́, ó sì mú subjunctive inú gbólóhùn náà jáde láìfi ìtumọ̀ míì kún un.
- source_word: τὰ περὶ ἡμῶν
  choice: bí àwa ṣe wà
  rationale: Ó túmọ̀ sí ipò tàbí ìròyìn nípa Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀; “àwa” gba ìtẹnumọ́ tí ó yẹ nítorí àyípadà àfọwọ́kọ.
- source_word: παρακαλέσῃ
  choice: kí ó lè fún ... ní ìṣírí
  rationale: παρακαλέω lè túmọ̀ sí fífúnni ní ìṣírí, ìtùnú, tàbí ìgbaninímọ̀ràn; “fún ... ní ìṣírí” bá iṣẹ́ ìròyìn àti ìmú-ọkàn-lágbára mu láìdín ìtumọ̀ rẹ̀ kù jù.
- source_word: τὰς καρδίας ὑμῶν
  choice: ọkàn yín
  rationale: Ó pa àwòrán ara ènìyàn inú Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Àyípadà àfọwọ́kọ nínú ẹni tó máa mọ ipò ẹlòmíràn
  choice: “kí ẹ lè mọ bí àwa ṣe wà,” ní ìbámu pẹ̀lú γνῶτε τὰ περὶ ἡμῶν nínú SBLGNT.
  alternative: “kí àwa lè mọ bí ẹ ṣe wà.”
  rationale: Ọ̀rọ̀ pàtàkì tẹ̀lé ẹ̀rí orísun SBLGNT tí a pèsè. Àyípadà àfọwọ́kọ tó yí ẹni tó ń mọ̀ àti ẹni tí a ń mọ ipò rẹ̀ padà ṣe pàtàkì tó láti wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ/yín” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tó yẹ. Gbólóhùn náà pa ìtẹnumọ́ ète rírán àti àwòrán “ọkàn” mọ́.
