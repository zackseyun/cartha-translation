  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: yo
  text: Ẹ máa fi gbogbo ara yín sí àdúrà[a], kí ẹ sì máa wà lójúfò nínú rẹ̀ pẹ̀lú ìdúpẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa tẹ̀ síwájú láìyẹsẹ̀ nínú àdúrà, kí ẹ sì máa wà lójúfò nínú rẹ̀ pẹ̀lú ìdúpẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχῇ
  choice: àdúrà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àdúrà gẹ́gẹ́ bí àṣà tí onígbàgbọ́ ń ṣe, kì í ṣe sí àdúrà kan pàtó; nítorí náà, “àdúrà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: προσκαρτερεῖτε
  choice: Ẹ máa fi gbogbo ara yín sí
  rationale: Àṣẹ ìsinsìnyí náà ń béèrè fún ìfọkànsìn àti ìforítì tí ń bá a lọ. Gbólóhùn yìí fi ìfọkànsìn hàn ní Yorùbá òde òní láì sọ pé ẹni náà kan ń gbàdúrà nígbà gbogbo.
- source_word: γρηγοροῦντες
  choice: kí ẹ sì máa wà lójúfò
  rationale: 'Ó ṣàlàyé bí wọ́n ṣe gbọdọ̀ máa dúró nínú àdúrà: pẹ̀lú ìṣọ́ra àti ìmúrasílẹ̀, kì í ṣe dandan pé kí wọ́n má sùn.'
- source_word: ἐν αὐτῇ
  choice: nínú rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí àdúrà, bí ó ti rí nínú Gíríìkì, referent náà sì ṣe kedere ní Yorùbá.
- source_word: ἐν εὐχαριστίᾳ
  choice: pẹ̀lú ìdúpẹ́
  rationale: Ó sọ ìwà tàbí ẹ̀mí tí yóò bá ìṣọ́ra nínú àdúrà lọ; “pẹ̀lú ìdúpẹ́” jẹ́ èdè Yorùbá tó rọrùn, ó sì pa ìtumọ̀ ọpẹ́ mọ́.
theological_decisions: []
