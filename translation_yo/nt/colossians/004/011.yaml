  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: yo
  text: àti Jésù, ẹni tí à ń pè ní Jústù. Àwọn wọ̀nyí nìkan, lára àwọn tí ó jẹ́ ti ìkọlà[a], ni alábàáṣiṣẹ́ fún ìjọba Ọlọ́run[c], wọ́n sì ti di ìtùnú fún mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, “àwọn tí ó jẹ́ Júù.” Ní tààràtà, “àwọn tí ó wá láti inú ìkọlà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n sì ti di ìwúrí fún mi,” tàbí “wọ́n sì fi ara wọn hàn gẹ́gẹ́ bí ìtùnú fún mi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Àwọn wọ̀nyí nìkan ni alábàáṣiṣẹ́ fún ìjọba Ọlọ́run tí wọ́n sì jẹ́ ti ìkọlà.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ yìí ni a sábà máa ń lò fún Ἰησοῦς nínú Májẹ̀mú Tuntun, dípò Jósúà.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: ẹni tí à ń pè ní Jústù
  rationale: Ó fi orúkọ kejì tàbí orúkọ Róòmù ẹni náà hàn ní èdè Yorùbá àdánidá.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: Àwọn tí ó jẹ́ ti ìkọlà
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí àmì ìdánimọ̀ àwọn Júù, láì pinnu nínú àyọkà pé ó túmọ̀ sí ẹgbẹ́ ẹ̀kọ́ kan pàtó.
- source_word: οὗτοι μόνοι
  choice: àwọn wọ̀nyí nìkan
  rationale: Ó tẹnumọ́ pé láàárín ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ dárúkọ, àwọn wọ̀nyí nìkan ni Pọ́ọ̀lù ń sọ̀rọ̀ nípa wọn.
- source_word: συνεργοὶ
  choice: alábàáṣiṣẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí àwọn tí ń ṣiṣẹ́ pọ̀ pẹ̀lú ẹlòmíràn, ó sì yẹ fún àwọn alábàáṣiṣẹ́ Pọ́ọ̀lù nínú iṣẹ́ ìránṣẹ́.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: fún ìjọba Ọlọ́run
  rationale: “Fún” fi ète àti iṣẹ́ tí wọ́n ń ṣe ní ti ìjọba Ọlọ́run hàn lọ́nà tí ó bá Yorùbá òde òní mu.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: wọ́n sì ti di ìtùnú fún mi
  rationale: “Ti di” ṣàfihàn ìyípadà tàbí ohun tí wọ́n wá jẹ́ fún Pọ́ọ̀lù; “ìtùnú” sì mú ìtumọ̀ pàtàkì παρηγορία jáde, nígbà tí àlàyé ìsàlẹ̀ fi “ìwúrí” hàn gẹ́gẹ́ bí àṣàyàn.
theological_decisions:
- issue: Ìtumọ̀ “àwọn tí ó jẹ́ ti ìkọlà”
  choice: A fi gbólóhùn ìkọlà náà sílẹ̀ gẹ́gẹ́ bí àmì ìdánimọ̀ àwọn Júù.
  alternative: “Àwọn tí ó jẹ́ Júù,” tàbí ìtọ́ka sí ẹgbẹ́ àwọn olùgbèjà ìkọlà kan pàtó.
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn alábàáṣiṣẹ́ Pọ́ọ̀lù tí wọ́n jẹ́ Júù, ṣùgbọ́n fífi àwòrán ìkọlà sílẹ̀ kò jẹ́ kí ìtumọ̀ náà ju ohun tí Gíríìkì sọ lọ.
- issue: Ibi tí “nìkan” ti ń ṣe ààlà sí
  choice: Àwọn wọ̀nyí nìkan lára àwọn tí ó jẹ́ ti ìkọlà ni alábàáṣiṣẹ́ fún ìjọba Ọlọ́run.
  alternative: Àwọn wọ̀nyí ni àwọn alábàáṣiṣẹ́ fún ìjọba Ọlọ́run nìkan tí wọ́n jẹ́ ti ìkọlà.
  rationale: Ìṣètò Gíríìkì kọ́kọ́ dá ẹgbẹ́ “àwọn tí ó jẹ́ ti ìkọlà” sílẹ̀, lẹ́yìn náà ó sọ pé àwọn wọ̀nyí nìkan ni alábàáṣiṣẹ́; àlàyé [c] pa ìṣètò mìíràn tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “ìkọlà” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì fún circumcision, “alábàáṣiṣẹ́” fún συνεργός, àti “ìtùnú” fún παρηγορία. Àmì gígùn náà ń ran òǹkàwé lọ́wọ́ láti rí ìṣètò àti ìtẹnumọ́ gbólóhùn Gíríìkì.
