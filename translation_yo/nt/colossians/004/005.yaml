id: COL.4.5
reference: Colossians 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: yo
  text: Ẹ máa fi ọgbọ́n hùwà sí àwọn tí ó wà lóde[a], kí ẹ sì máa lo àkókò náà dáadáa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó wà ní òde”—ìyẹn, àwọn tí kì í ṣe ara àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ẹ máa ra àkókò náà”; àpẹẹrẹ ìṣòwò ni fún lílo àǹfààní tí àkókò náà mú wá dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: fi ọgbọ́n
  rationale: Ó pa ọ̀rọ̀-orúkọ σοφία mọ́, ó sì sọ ọ́n ní ọ̀nà Yorùbá àdánidá gẹ́gẹ́ bí ọ̀nà tàbí ìlànà ìwà.
- source_word: περιπατεῖτε
  choice: Ẹ máa ... rìn
  rationale: Ó pa àkàwé Pọ́ọ̀lù nípa rírìn gẹ́gẹ́ bí ìgbésí ayé mọ́, ó sì jẹ́ gbólóhùn tí a lè lóye ní Yorùbá.
- source_word: πρὸς τοὺς ἔξω
  choice: ní ìbáṣepọ̀ yín pẹ̀lú àwọn tí ó wà lóde
  rationale: πρός níbí ń tọ́ka sí ìwà ẹni sí àwọn ẹlòmíràn; ‘àwọn tí ó wà lóde’ pa àwòrán Gíríìkì mọ́ láì lo ọ̀rọ̀ tí ó lè dà bí ẹ̀gàn.
- source_word: τὸν καιρόν
  choice: gbogbo àǹfààní
  rationale: καιρός túmọ̀ sí àkókò tí ó bójú mu tàbí àǹfààní, kì í ṣe àkókò lásán; ‘àǹfààní’ mú ìtumọ̀ ọ̀rọ̀ náà hàn kedere ní Yorùbá.
- source_word: ἐξαγοραζόμενοι
  choice: máa lo ... ní kíkún
  rationale: Àpólà náà ní ìtumọ̀ àdánidá pé kí a lo àǹfààní dé ẹ̀kúnrẹ́rẹ́; èyí yẹra fún fífi èrò ìràpadà ẹ̀kọ́ ìgbàgbọ́ sí ibi tí kò sí.
theological_decisions:
- issue: Ṣíṣe ἐξαγοραζόμενοι bí ọ̀rọ̀ ìràpadà
  choice: Ìkìlọ̀ láti lo gbogbo àǹfààní ní ọgbọ́n ní ìbáṣepọ̀ pẹ̀lú àwọn tí kì í ṣe ara àwùjọ àwọn onígbàgbọ́
  alternative: ‘rí àkókò náà rà padà,’ èyí tí ó lè mú èrò ìràpadà ẹ̀ṣẹ̀ wọ inú ẹsẹ náà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà jẹ́ àpèjúwe okòwò fún lílo àǹfààní ní kíkún, kì í ṣe ọ̀rọ̀ nípa ètùtù tàbí ìràpadà ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. ‘Ẹ máa’ ṣàfihàn àṣẹ tí ó ń tẹ̀ síwájú, nígbà tí ‘àwọn tí ó wà lóde’ pa àwòrán orísun mọ́, tí àlàyé ìsàlẹ̀ ojú ewé sì ṣàlàyé ẹni tí a ń tọ́ka sí.
