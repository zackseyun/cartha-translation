  terminology: “Arákùnrin” pa ọ̀rọ̀ ìdílé-ìjọ ἀδελφός mọ́ ní ìbámu pẹ̀lú akọ-abo nínú Gíríìkì, láì ṣàfikún “nínú ìgbàgbọ́.” “Olóòótọ́” àti “olùfẹ́” yẹ fún πιστός àti ἀγαπητός nínú ìforígbọ́nṣẹ́ Pọ́ọ̀lù. Orúkọ Onésímù jẹ́ ìkọ̀wé tó bójú mu ní Yorùbá.
