id: COL.4.9
reference: Colossians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: yo
  text: Pẹ̀lú Onésímù, arákùnrin olóòótọ́ àti olùfẹ́, ẹni tí ó jẹ́ ọ̀kan lára yín.[a] Àwọn méjèèjì yóò jẹ́ kí ẹ mọ gbogbo ọ̀ràn níhìn-ín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ti àárín yín wá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo ohun tí ó wà níhìn-ín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν
  choice: pẹ̀lú
  rationale: Ọ̀rọ̀ náà fi ìbákẹ́gbẹ́ hàn; ó so Onésímù pọ̀ mọ́ Tíkíkù tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: Ὀνησίμῳ
  choice: Onésímù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìlànà tí ó bá ìró Gíríìkì àti ìlò Yorùbá mu.
- source_word: πιστῷ
  choice: olóòótọ́
  rationale: Ó lè túmọ̀ sí ẹni tí ó ní ìgbàgbọ́ tàbí ẹni tí a lè gbẹ́kẹ̀ lé; “olóòótọ́” pa ìtumọ̀ ìwà àti ìdúróṣinṣin náà mọ́ láì fi àlàyé kún un.
- source_word: ἀγαπητῷ
  choice: olùfẹ́
  rationale: “Olùfẹ́” jẹ́ ọ̀rọ̀ àdúrà àti ìfẹ́ tó yẹ fún àjọṣe àwọn onígbàgbọ́, ó sì bá ìtumọ̀ ἀγαπητός mu.
- source_word: ἀδελφῷ
  choice: arákùnrin
  rationale: Ọ̀rọ̀ náà tọ́ka sí arákùnrin kan nínú ìgbàgbọ́; a pa èdè ìdílé tí Gíríìkì lò mọ́.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: ẹni tí ó jẹ́ ọ̀kan lára yín
  rationale: Gbólóhùn yìí lè fi ibi tí ó ti wá tàbí jíjẹ́ ara ìjọ hàn. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa àwọn méjèèjì mọ́ dé ìwọ̀n tó ṣeé ṣe.
- source_word: γνωρίσουσιν
  choice: yóò jẹ́ kí ẹ mọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “wọn yóò sọ di mímọ̀” tàbí “wọn yóò fi tó yín létí.”
- source_word: πάντα τὰ ὧδε
  choice: gbogbo ọ̀ràn níhìn-ín
  rationale: Neuter plural náà kó gbogbo ohun tàbí ọ̀ràn tó kan ipò Pọ́ọ̀lù níbi tí ó wà jọ; “ọ̀ràn” yẹra fún ìtumọ̀ bí ohun èlò lasán.
theological_decisions:
- issue: Ìtumọ̀ ti ἀδελφῷ nínú ìjọ
  choice: arákùnrin
  alternative: arákùnrin nínú ìgbàgbọ́
  rationale: Gíríìkì sọ “arákùnrin” ní tààrà. Ìtumọ̀ náà pa èdè ìdílé ìjọ mọ́, kò sì fi ọ̀rọ̀ àlàyé tí kò sí nínú ẹsẹ náà kún un.
- issue: Agbára ọ̀rọ̀ ἐξ ὑμῶν
  choice: ẹni tí ó jẹ́ ọ̀kan lára yín
  alternative: ẹni tí ó ti àárín yín wá
  rationale: Èyí fi Onésímù hàn gẹ́gẹ́ bí ara àwọn onígbàgbọ́ Kólósè, ṣùgbọ́n kò kó ẹ̀kọ́ míì láti inú Fílémónì wọ ẹsẹ yìí.
- issue: Ẹni tí ọ̀rọ̀-ìṣe púpọ̀ γνωρίσουσιν ń tọ́ka sí
  choice: Àwọn méjèèjì
  alternative: Wọ́n
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ti ọ̀pọ̀, ó sì tọ́ka sí Tíkíkù àti Onésímù. “Àwọn méjèèjì” mú ìtọ́kasí náà ṣe kedere láì yí ẹni tí ẹsẹ náà ń sọ̀rọ̀ nípa padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn níbi tí ó bá yẹ. Ìbẹ̀rẹ̀ “Pẹ̀lú” mọ ìsopọ̀ ẹsẹ yìí mọ́ Tíkíkù nínú ẹsẹ tó ṣáájú; “Àwọn méjèèjì” sì mú ẹni méjì tí ọ̀rọ̀-ìṣe Gíríìkì tọ́ka sí hàn kedere.
