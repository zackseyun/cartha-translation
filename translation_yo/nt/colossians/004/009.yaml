  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa. “Pẹ̀lú” ń so Onésímù pọ̀ mọ́ Tíkíkù nínú ẹsẹ 8; “arákùnrin olóòótọ́ àti olùfẹ́” ń gbé πιστῷ καὶ ἀγαπητῷ ἀδελφῷ kalẹ̀ ní ìbámu; “ẹni tí ó jẹ́ ọ̀kan lára yín” ń pa ìmọ̀ ẹni/ìbílẹ̀ tí ἐξ ὑμῶν ń sọ mọ́. “Àwọn méjèèjì” jẹ́ ìtúmọ̀ tó tọ́ fun γνωρίσουσιν ẹni-púpọ̀ nítorí ìtọ́kasí rẹ̀ sí Tíkíkù àti Onésímù láti ẹsẹ tó ṣáájú. “Gbogbo ọ̀ràn níhìn-ín” ń fi πάντα τὰ ὧδε hàn láì sọ ìròyìn pàtó kan tí Gíríìkì kò sọ.
