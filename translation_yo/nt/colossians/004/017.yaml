id: COL.4.17
reference: Colossians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: yo
  text: Ẹ sì sọ fún Ákípù pé, “Kíyèsí iṣẹ́ ìránṣẹ́ tí o gbà nínú Olúwa,[a] kí o lè mú un ṣẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó sì ṣeé ṣe kí a túmọ̀ rẹ̀ sí, “iṣẹ́ ìránṣẹ́ tí o gbà láti ọ̀dọ̀ Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπατε
  choice: Ẹ sì sọ fún
  rationale: Aorist imperative plural addressed to the congregation; “Ẹ ... sọ fún” naturally preserves the plural command in Yorùbá, while “sì” carries the connective καί.
- source_word: Ἀρχίππῳ
  choice: Ákípù
  rationale: The personal name is transliterated in a form natural to Standard Yorùbá pronunciation and orthography.
- source_word: Βλέπε
  choice: Kíyè sí
  rationale: The present singular imperative calls for attentive, continuing care; “Kíyè sí” is clear, current Yorùbá and avoids an archaic expression.
- source_word: διακονίαν
  choice: iṣẹ́ ìránṣẹ́
  rationale: This denotes entrusted service or ministry. “Iṣẹ́ ìránṣẹ́” is broadly understandable and does not impose a specific church office.
- source_word: παρέλαβες
  choice: tí o gbà
  rationale: “Gbà” directly expresses receiving an entrusted responsibility without suggesting that Archippus originated it himself.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: This formally reflects ἐν κυρίῳ and preserves possible nuances of sphere or association rather than reducing it to source alone.
- source_word: ἵνα
  choice: kí ... lè
  rationale: The Yorùbá purpose construction “kí ... lè” naturally conveys the purposive force of ἵνα.
- source_word: πληροῖς
  choice: mú un ṣẹ
  rationale: “Mú ... ṣẹ” conveys carrying the entrusted service through to fulfillment and is idiomatic modern Yorùbá.
theological_decisions:
- issue: Nuance of ἐν κυρίῳ
  choice: nínú Olúwa
  alternative: láti ọ̀dọ̀ Olúwa
  rationale: The Greek has ἐν, so the main text retains “nínú Olúwa,” leaving open whether the phrase chiefly marks the sphere or relationship in which the ministry was received. A footnote records the possible source-oriented understanding without resolving the ambiguity.
translation_notes:
  register: Standard Yorùbá with full tone marks; dignified but accessible contemporary wording. The plural address to the congregation and singular charge to Ákípù are both made explicit. The expression “iṣẹ́ ìránṣẹ́” remains broad enough to denote Christian service without specifying an ecclesiastical office.
