    rationale: Ní Yorùbá, ‘a’ lè hàn bí olùṣe àìmọ̀ tàbí bí ‘àwa’; kò rọrùn láti rí i pé ‘ọ̀rọ̀ yín’ ni ohun tí a fi iyọ̀ dùn ún. Gíríìkì ἠρτυμένος jẹ́ participle passive tó so mọ́ λόγος. ‘Kí ó sì jẹ́ èyí tí a fi iyọ̀ dùn ún’ pa ìbáṣepọ̀ yẹn mọ́.
  - severity: low
    issue: ‘Tó ń bàjẹ́ni’ nínú àlàyé ẹsẹ̀-ìsàlẹ̀ b yí ìtumọ̀ ‘corrupting’ padà díẹ̀.
    rationale: Ó lè túmọ̀ sí ọ̀rọ̀ tó ń ṣe ènìyàn nípalára, dípò ọ̀rọ̀ tí ó bàjẹ́ tàbí tí kò bójú mu. ‘Tí ó bàjẹ́’ jẹ́ ìtumọ̀ tó sún mọ́ àkàwé náà ju.
