reference: Colossians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: yo
  text: Ẹ jẹ́ kí ọ̀rọ̀ yín máa wà pẹ̀lú oore-ọ̀fẹ́ nígbà gbogbo[a], kí ó sì jẹ́ èyí tí a fi iyọ̀ dùn ún[b], kí ẹ lè mọ bí ó ti yẹ kí ẹ dá olúkúlùkù lóhùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀nà onínúure.” Gbólóhùn “pẹ̀lú oore-ọ̀fẹ́” lè ṣàpèjúwe ọ̀rọ̀ tí inú rere, ìwà pẹ̀lẹ́, tàbí ojú rere hàn nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Kí ó sì jẹ́ èyí tí a fi iyọ̀ dùn ún” jẹ́ àkàwé fún ọ̀rọ̀ tó bójú mu, tó dùn mọ́ni, tó sì ní ọgbọ́n; kì í ṣe ọ̀rọ̀ tí kò ní adùn tàbí tí ó bàjẹ́.
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Nínú ìṣírí yìí, ọ̀rọ̀ ń tọ́ka sí bí àwọn onígbàgbọ́ ṣe ń sọ̀rọ̀. ‘Ọ̀rọ̀ yín’ jẹ́ èdè Yorùbá àdánidá, ó sì bá àṣẹ nípa dídá olúkúlùkù lóhùn mu.
- source_word: ἐν χάριτι
  choice: pẹ̀lú oore-ọ̀fẹ́
  rationale: Èyí pa àwòrán gbólóhùn orísun mọ́, ó sì lè túmọ̀ sí ọ̀rọ̀ tí inú rere àti inú-rere-ọ̀fẹ́ hàn nínú rẹ̀, láìṣe àlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἅλατι ἠρτυμένος
  choice: kí a fi iyọ̀ dùn ún
  rationale: Èyí pa àkàwé iyọ̀ mọ́ ní Yorùbá àdánidá, ó sì fi hàn pé ọ̀rọ̀ náà ní ànímọ́ tó yẹ, tó dùn mọ́ni, tó sì ní ọgbọ́n.
- source_word: εἰδέναι
  choice: kí ẹ lè mọ
  rationale: Ọ̀nà yìí so àìlópin ọ̀rọ̀ náà mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ète tàbí àbájáde, bó tilẹ̀ jẹ́ pé ìbáṣepọ̀ gírámà rẹ̀ ní Gíríìkì ní ìṣòro díẹ̀.
- source_word: δεῖ
  choice: ó ti yẹ
  rationale: ‘Ó ti yẹ’ sọ ohun tó bójú mu àti ojúṣe tó wà ní δεῖ, láìmú un le ju bí àyíká ọ̀rọ̀ ṣe béèrè lọ.
- source_word: ἑνὶ ἑκάστῳ
  choice: olúkúlùkù
  rationale: ‘Olúkúlùkù’ pa agbára pínpín gbólóhùn náà mọ́, ó sì tẹnumọ́ pé ìdáhùn gbọ́dọ̀ bá ẹni kọ̀ọ̀kan mu.
- source_word: ἀποκρίνεσθαι
  choice: dá … lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífún ẹnìkan ní ìdáhùn nínú ìjíròrò.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá tó pa ìwọ̀n gbogbo àkókò tí πάντοτε ní mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐν χάριτι
  choice: pẹ̀lú oore-ọ̀fẹ́
  alternative: pẹ̀lú inú rere / ní ọ̀nà onínúure
  rationale: A pa ‘oore-ọ̀fẹ́’ mọ́ láti gba ìtumọ̀ ìwà onínúure àti ìró Paulù nípa oore-ọ̀fẹ́ láàyè, láìfi tipátipá yan ọ̀kan ṣoṣo.
- issue: Ìbáṣepọ̀ εἰδέναι pẹ̀lú ìṣírí tó ṣáájú
  choice: kí ẹ lè mọ
  alternative: láti mọ
  rationale: Ìtumọ̀ ète tàbí àbájáde mú ọ̀rọ̀ náà ṣe kedere ní Yorùbá, ṣùgbọ́n kò sọ pé ìbáṣepọ̀ gírámà náà dájú ju bó ṣe rí nínú orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àkàwé iyọ̀ ni a pa mọ́, a sì lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῶν/ὑμᾶς ṣe fi hàn.
