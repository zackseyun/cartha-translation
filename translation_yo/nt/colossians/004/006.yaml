  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì mọ́ dáadáa: λόγος ni ọ̀rọ̀/síṣe-sọ̀rọ̀, πάντοτε ni ‘nígbà gbogbo,’ ἐν χάριτι ni ‘pẹ̀lú oore-ọ̀fẹ́,’ àkàwé iyọ̀ sì wà nípò rẹ̀. ‘Kí ẹ lè mọ bí ó ti yẹ kí ẹ dá olúkúlùkù lóhùn’ tún ṣàfihàn ìdí/àbájáde εἰδέναι àti agbára pínpín ἑνὶ ἑκάστῳ. Ṣùgbọ́n ‘kí a fi iyọ̀ dùn ún’ lè jẹ́ ọ̀rọ̀ àṣẹ sí ‘àwa,’ kì í sì fi kedere hàn pé ọ̀rọ̀ yín ni a ti fi iyọ̀ dùn ún, gẹ́gẹ́ bí participle passive Gíríìkì ṣe sọ.'
  naturalness: Àwòkọ́sẹ̀ náà jẹ́ Yorùbá boṣewa tó dára, ó sì ní àmì ohùn tó yẹ. Ṣíṣe gbolohun iyọ̀ náà sí ‘kí ó sì jẹ́ èyí tí a fi iyọ̀ dùn ún’ mú ìtọ́kasí padà sí ‘ọ̀rọ̀ yín,’ ó sì jẹ́ kí gírámà rẹ̀ rọrùn láti lóye.
  terminology: ‘Oore-ọ̀fẹ́’ pa ìmọ̀ ọrọ̀ χάρις mọ́, nígbà tí àlàyé ẹsẹ̀-ìsàlẹ̀ gba ‘onínúure’ gẹ́gẹ́ bí ìtumọ̀ míì láàyè. ‘Dá ... lóhùn’ àti ‘olúkúlùkù’ jẹ́ ọ̀nà àdánidá, tó pé, fún ἀποκρίνεσθαι àti ἑνὶ ἑκάστῳ. A tún ṣàtúnṣe apá ikẹyìn àlàyé iyọ̀ kí ó má sọ pé ọ̀rọ̀ náà ‘ń bàjẹ́ni’ (ìyẹn ni, ń pa ènìyàn lára), ṣùgbọ́n kí ó tọ́ka sí ọ̀rọ̀ tí ó ‘bàjẹ́,’ gẹ́gẹ́ bí àkàwé ‘corrupting’ ṣe túmọ̀ sí.
  issues:
