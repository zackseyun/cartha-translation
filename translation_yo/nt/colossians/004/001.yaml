id: COL.4.1
reference: Colossians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: yo
  text: Ẹ̀yin ọ̀gá, ẹ máa fún àwọn ẹrú yín ní ohun tí ó tọ́ àti ìtọ́jú tó déédéé,[a] ní mímọ̀ pé ẹ̀yin náà ní Olúwa kan ní ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó tọ́ àti ìdọ́gba.” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ìtọ́jú tó déédéé” tún lè túmọ̀ sí “ìdọ́gba” tàbí “ìwà déédéé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Ẹ̀yin ọ̀gá
  rationale: Nínú àyíká ìlànà agbo ilé yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ọ̀gá ènìyàn ní ìbáṣepọ̀ wọn pẹ̀lú àwọn ẹrú. “Ọ̀gá” jẹ́ èdè Yorùbá àdánidá, kò sì dá wọn pọ̀ mọ́ Olúwa ọ̀run.
- source_word: τὸ δίκαιον
  choice: ohun tí ó tọ́
  rationale: Ó túmọ̀ sí ohun tí ó bá òdodo mu tàbí ohun tí ó tọ́. Àṣàyàn yìí ṣe kedere, ó sì pa agbára ìwà rere inú ọ̀rọ̀ náà mọ́.
- source_word: τὴν ἰσότητα
  choice: lọ́nà tí ó bá ìdájọ́ òdodo mu
  rationale: ἰσότης lè túmọ̀ sí ìdọ́gba, ìṣe déédéé, tàbí ìṣe tí kò ṣe ojúsàájú. Gbólóhùn yìí sọ ìtọ́jú tó yẹ ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ “ìdọ́gba” mọ́.
- source_word: τοῖς δούλοις
  choice: sí àwọn ẹrú yín
  rationale: Ìbáṣepọ̀ ọ̀gá àti δοῦλος hàn gbangba níbí, nítorí náà “ẹrú” kò dín ipò ìdè wọn kù bí “ìránṣẹ́” ṣe lè ṣe.
- source_word: παρέχεσθε
  choice: ẹ máa ṣe ... kí ẹ sì máa hùwà
  rationale: Ọ̀rọ̀ àṣẹ náà ní ìtumọ̀ pípèsè tàbí fífúnni ní ohun kan. Ní Yorùbá, àtúnṣe yìí jẹ́ àdánidá fún fífi ohun tó tọ́ àti ìtọ́jú déédéé hàn.
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Ó pa ìṣe aláìlẹ́gbẹ́ participle náà mọ́, ó sì fi ìmọ̀ yìí hàn gẹ́gẹ́ bí ohun tó ń tẹ̀ lé tàbí ṣe ìdí fún àṣẹ náà láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: Ó tẹnu mọ́ pé àwọn ọ̀gá ènìyàn náà wà lábẹ́ àṣẹ ẹlòmíràn.
- source_word: κύριον
  choice: Olúwa kan
  rationale: “Olúwa” pa ìwúwo orúkọ oyè ti ọ̀run mọ́, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ “ọ̀gá” ènìyàn. “Kan” ń ṣàfihàn àìní article nínú Gíríìkì láìsọ pé ọ̀pọ̀ Olúwa ló wà.
- source_word: ἐν οὐρανῷ
  choice: ní ọ̀run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún gbólóhùn Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλοι nínú ìlànà agbo ilé
  choice: àwọn ẹrú
  alternative: àwọn ìránṣẹ́; àwọn ìránṣẹ́ tí a dè mọ́ iṣẹ́
  rationale: Ọ̀rọ̀ náà ń sọ ní tààrà nípa ìbáṣepọ̀ àwọn ọ̀gá sí àwọn ènìyàn tí wọ́n wà ní ipò ẹrú. “Ẹrú” pa òtítọ́ ipò àwùjọ àti ìdè wọn mọ́, kò sì rọ ọ́ sí “ìránṣẹ́.”
- issue: Bí a ṣe túmọ̀ ἰσότητα
  choice: lọ́nà tí ó bá ìdájọ́ òdodo mu
  alternative: ìdọ́gba; ìṣe déédéé; ìtọ́jú láìṣojúsàájú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìdọ́gba tàbí sí ìtọ́jú tó déédéé. Ọ̀rọ̀ inú ẹsẹ náà fi òdodo ìtọ́jú hàn ní Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa “ìdọ́gba” mọ́ gẹ́gẹ́ bí àṣàyàn pàtàkì, kí a má bà a yanjú àìdájú ọ̀rọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀rọ̀-orúkọ àṣẹ ọlọ́pọ̀ “ẹ” fún àwọn ọ̀gá, a sì yà “ọ̀gá” ènìyàn sọ́tọ̀ kúrò lọ́dọ̀ “Olúwa” ọ̀run. Àmì ohùn ni a fi sí ibi tí ó yẹ.
