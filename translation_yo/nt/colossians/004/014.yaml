  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: yo
  text: Lúùkù, oníṣègùn olùfẹ́, àti Démà ń kí yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: kí
  rationale: Nínú ọ̀rọ̀ lẹ́tà, ọ̀rọ̀ yìí túmọ̀ sí fífi ìkíni ránṣẹ́. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ẹyọ, ó wà ṣáájú àwọn olùṣe méjì; èdè Yorùbá sì lè lo “kí yín” lọ́nà àdánidá fún ìkíni wọn méjèèjì.
- source_word: ὑμᾶς
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, ó ń tọ́ka sí gbogbo àwọn tí a kọ lẹ́tà sí.
- source_word: Λουκᾶς
  choice: Lúùkù
  rationale: Ìkọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe mọ̀ ọ́ tí a sì ń pè é ní èdè Yorùbá.
- source_word: ἰατρὸς
  choice: oníṣègùn
  rationale: Ó túmọ̀ sí ẹni tí iṣẹ́ rẹ̀ jẹ́ ṣíṣe ìtọ́jú àìsàn; “oníṣègùn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ìgbà náà mu.
- source_word: ἀγαπητὸς
  choice: olùfẹ́
  rationale: Ó fi ìfẹ́ àti iyì tí wọ́n ní sí Lúùkù hàn, ní èdè tó ní ọlá tí ó sì yéni.
- source_word: καὶ
  choice: àti
  rationale: Ó so Démà pọ̀ mọ́ Lúùkù gẹ́gẹ́ bí àwọn méjèèjì tí ń kí àwọn olùgbà lẹ́tà.
- source_word: Δημᾶς
  choice: Démà
  rationale: Ìkọ orúkọ Gíríìkì náà ní ìrísí tó bá ìpè Yorùbá mu.
theological_decisions:
- issue: Ibi tí àpèjúwe “olùfẹ́” kàn sí
  choice: “Oníṣègùn olùfẹ́” ń ṣàpèjúwe Lúùkù nìkan.
  alternative: Kí gbólóhùn Yorùbá fi àyè sílẹ̀ bí ẹni pé “olùfẹ́” lè kan Démà pẹ̀lú.
  rationale: Ètò ọ̀rọ̀ Gíríìkì ὁ ἰατρὸς ὁ ἀγαπητός dúró lẹ́gbẹ̀ẹ́ orúkọ Λουκᾶς, ó sì fi àwọn àpèjúwe méjèèjì mọ́ Lúùkù ní pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní ọlá, tó rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tó yẹ, a sì pa ìṣókí àti ìrísí ìkíni inú lẹ́tà Gíríìkì mọ́.
