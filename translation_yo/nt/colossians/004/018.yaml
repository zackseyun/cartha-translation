id: COL.4.18
reference: Colossians 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: yo
  text: Èmi Pọ́ọ̀lù fi ọwọ́ ara mi kọ ìkíni yìí.[a] Ẹ máa rántí ẹ̀wọ̀n mi.[b] Kí oore-ọ̀fẹ́ wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, Pọ́ọ̀lù fúnra rẹ̀ ló fi ọwọ́ ara rẹ̀ kọ ìkíni ìparí lẹ́tà náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbèkùn mi” tàbí “ìdè mi.” Ní ti gidi, “ẹ̀wọ̀n mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: ìkíni
  rationale: Nínú àyíká lẹ́tà, ọ̀rọ̀ náà tọ́ka sí ìkíni ìparí; “ìkíni” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: Èmi Pọ́ọ̀lù fi ọwọ́ ara mi kọ
  rationale: Èyí sọ ọ̀rọ̀ Gíríìkì elípítíkà di Yorùbá àdánidá, ó sì pa ìtẹnumọ́ mọ́ pé Pọ́ọ̀lù fúnra rẹ̀ ló kọ ìkíni ìparí náà.
- source_word: μνημονεύετέ
  choice: Ẹ máa rántí
  rationale: Àṣẹ àsìkò ìsinsìnyí lè fi ìṣe tí ń bá a lọ hàn; “ẹ máa rántí” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: μου τῶν δεσμῶν
  choice: ẹ̀wọ̀n mi
  rationale: δεσμοί túmọ̀ ní ti gidi sí ohun ìdè tàbí ẹ̀wọ̀n, ó sì jẹ́ àwòrán gidi fún ìgbèkùn Pọ́ọ̀lù; “ẹ̀wọ̀n mi” pa àwòrán yẹn mọ́.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tó sì yẹ fún χάρις nínú ìbùkún ìparí lẹ́tà Pọ́ọ̀lù, láìfi ẹni tó ni oore-ọ̀fẹ́ náà kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: μεθ’ ὑμῶν
  choice: wà pẹ̀lú yín
  rationale: Yorùbá nílò ọ̀rọ̀-ìṣe nínú gbólóhùn ìbùkún yìí; “wà pẹ̀lú yín” jẹ́ ọ̀nà àdánidá láti sọ gbolohun Gíríìkì tí kò ní ọ̀rọ̀-ìṣe.
theological_decisions:
- issue: Ìbùkún ìparí Pọ́ọ̀lù tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì
  choice: Kí oore-ọ̀fẹ́ wà pẹ̀lú yín
  alternative: Oore-ọ̀fẹ́ pẹ̀lú yín
  rationale: Fífi “Kí ... wà” kún un mú kí ó jẹ́ ìbùkún Yorùbá tó péye, láìfi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” púpọ̀ nítorí ὑμῶν jẹ́ ọ̀pọ̀ ènìyàn.
