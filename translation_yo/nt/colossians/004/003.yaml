  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: yo
  text: Ẹ sì máa gbàdúrà fún wa pẹ̀lú ní àkókò kan náà[d], kí Ọlọ́run lè ṣí ilẹ̀kùn fún ọ̀rọ̀ náà fún wa[a], kí a lè sọ ohun ìjìnlẹ̀ Mèsáyà[b], nítorí èyí ni a fi dè mí pẹ̀lú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ilẹ̀kùn fún ìhìn náà’ tàbí ‘àǹfààní fún ọ̀rọ̀ náà.’
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: ‘ohun ìjìnlẹ̀ Kristi’; a lo ‘Mèsáyà’ níbí nítorí Χριστός jẹ́ oyè.'
    reason: alternative_reading
  - marker: c
    text: Tàbí ‘nítorí èyí ni mo fi wà nínú ẹ̀wọ̀n.’
    reason: lexical_alternative
  - marker: d
    text: Tàbí ‘Ní àkókò kan náà, ẹ sì máa gbàdúrà fún wa pẹ̀lú.’
    reason: previous_rendering
lexical_decisions:
- source_word: προσευχόμενοι
  choice: ẹ sì máa gbàdúrà
  rationale: Ọ̀rọ̀ náà jẹ́ present participle tí ó ń tẹ ìṣírí ẹsẹ tó ṣáájú lọ. Gbólóhùn Yorùbá yìí pa ìbáṣepọ̀ náà mọ́, ó sì bá àṣẹ tí ń bá a lọ mu.
- source_word: ἅμα καὶ
  choice: Ní àkókò kan náà … fún wa
  rationale: Èyí fi ìgbà-kan-náà hàn, ó sì fi àdúrà fún Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ kún àdúrà tí a ti ń sọ̀rọ̀ nípa rẹ̀.
- source_word: περὶ ἡμῶν
  choice: fún wa
  rationale: Pẹ̀lú ọ̀rọ̀ àdúrà, περί àti genitive túmọ̀ sí gbígbàdúrà fún ẹnì kan, kì í ṣe sísọ̀rọ̀ nípa rẹ̀ lásán.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ
  choice: kí Ọlọ́run lè ṣí … sílẹ̀
  rationale: Ìkọ̀lé ἵνα pẹ̀lú subjunctive sọ ohun tí wọ́n ń bẹ Ọlọ́run fún; ‘kí … lè’ jẹ́ ọ̀nà àdánidá láti sọ ète àti ẹ̀bẹ̀ ní Yorùbá.
- source_word: ἡμῖν θύραν τοῦ λόγου
  choice: ṣí ilẹ̀kùn fún ọ̀rọ̀ náà sílẹ̀ fún wa
  rationale: A pa àwòrán ilẹ̀kùn mọ́, dípò yíyí i padà sí ‘àǹfààní’ nìkan. ‘Ọ̀rọ̀ náà’ tọ́ka sí iṣẹ́ ìkéde ìhìn náà nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: λαλῆσαι
  choice: kí a lè sọ
  rationale: Èyí jẹ́ infinitive ti ète, ó sì ń ṣàlàyé ohun tí ilẹ̀kùn tí a ṣí yóò mú kí wọ́n ṣe; ‘sọ’ kò fi ìtumọ̀ iṣẹ́ ìwàásù tó ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: τὸ μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: ‘Ohun ìjìnlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ète Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ṣí payá; kò dín un kù sí àṣírí ènìyàn lásán.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà ‘Mèsáyà’ pa ìtumọ̀ oyè ẹni àmì òróró náà mọ́.
- source_word: δι’ ὃ
  choice: nítorí èyí
  rationale: διά pẹ̀lú accusative fi ìdí tàbí okùnfà hàn. ‘Èyí’ pa ìtọ́kasí rẹ̀ sí ohun ìjìnlẹ̀ tàbí ìhìn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mọ́ láì fi àlàyé míì wọ̀ ọ́.
- source_word: δέδεμαι
  choice: a fi dè mí
  rationale: Perfect passive sọ ipò ìdè tí ó wà nísinsìnyí látàrí ohun tí ó ti ṣẹlẹ̀. ‘A fi dè mí’ pa àwòrán ìdè mọ́, láì sọ ní pàtó ju Gíríìkì lọ bóyá ẹ̀wọ̀n ni.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός ní agbára oyè, kì í ṣe bí orúkọ lasán; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde ní kedere.
- issue: Àwòrán θύραν τοῦ λόγου
  choice: ilẹ̀kùn fún ọ̀rọ̀ náà
  alternative: àǹfààní láti kéde ìhìn náà
  rationale: A pa àkàwé ilẹ̀kùn ti Pọ́ọ̀lù mọ́, a kò sì tú u sí ìtumọ̀ kan ṣoṣo bí ‘àǹfààní,’ bí ó tilẹ̀ jẹ́ pé èyí ni ohun tí àwòrán náà lè túmọ̀ sí.
- issue: Ohun tí δι’ ὃ ń tọ́ka sí
  choice: nítorí èyí
  alternative: nítorí ìkéde ohun ìjìnlẹ̀ yìí
  rationale: Ọ̀rọ̀ arọ́pò náà lè tọ́ka sí ohun ìjìnlẹ̀ tàbí sí ìhìn/ìkéde tó wà nínú gbólóhùn náà. A pa ìtọ́kasí gbogbogbò rẹ̀ mọ́ dípò yíyan ọ̀kan ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. Gbólóhùn náà pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ìṣírí àdúrà inú ẹsẹ tó ṣáájú, ó sì pa àkàwé ‘ilẹ̀kùn’ àti àìdánilójú ìtọ́kasí ‘èyí’ mọ́.
