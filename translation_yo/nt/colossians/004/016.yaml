id: COL.4.16
reference: Colossians 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: yo
  text: 'Nígbà tí a bá sì ti ka lẹ́tà yìí láàárín yín,[a] ẹ rí i dájú pé a tún kà á nínú ìjọ àwọn ará Laodíkíà; kí ẹ̀yin náà sì ka èyí tí ó ti Laodíkíà wá.[b]


    [a] Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkà lẹ́tà náà sókè ní gbangba nígbà tí ìjọ péjọ.

    [b] Ní Gíríìkì, “èyí tí ó ti Laodíkíà wá” ni a kọ; ọ̀rọ̀ náà kò sọ lẹ́tà wo ni, bẹ́ẹ̀ ni kò fi hàn dájú pé Laodíkíà ni a kọ ọ́ sí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkà lẹ́tà náà sókè ní gbangba nígbà tí ìjọ péjọ.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “èyí tí ó ti Laodíkíà wá” ni a kọ; ọ̀rọ̀ náà kò sọ lẹ́tà wo ni, bẹ́ẹ̀ ni kò fi hàn dájú pé Laodíkíà ni a kọ ọ́ sí.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: a bá ti ka / ka
  rationale: “Kà” ni ìtumọ̀ pàtàkì; ó bá èdè Yorùbá mu, ó sì tún lè ní ìtumọ̀ kíkà sókè ní gbangba nínú ìpàdé ìjọ láìfi ìtumọ̀ yẹn lé ọ̀rọ̀ Gíríìkì lórí.
- source_word: παρ’ ὑμῖν
  choice: láàárín yín
  rationale: Èyí fi hàn pé a ka lẹ́tà náà nínú àwùjọ àwọn onígbàgbọ́ ní Kólósè, kì í ṣe pé àwọn náà nìkan ni ó ṣe iṣẹ́ kíkà.
- source_word: ἡ ἐπιστολή
  choice: lẹ́tà yìí
  rationale: Àpilẹ̀kọ Gíríìkì ń tọ́ka sí lẹ́tà tí Pọ́ọ̀lù ń kọ yìí; “lẹ́tà yìí” ṣe ìtọ́kasí náà ní kedere àti ní ti ẹ̀dá.
- source_word: ποιήσατε ἵνα
  choice: ẹ rí i dájú pé
  rationale: Àṣẹ náà ń rọ àwọn olùgbọ́ láti mú un dájú pé ohun tí ó tẹ̀ lé ṣẹlẹ̀; gbólóhùn Yorùbá yìí pa agbára àṣẹ náà mọ́.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: nínú ìjọ àwọn ará Laodíkíà
  rationale: 'Èyí pa ìṣètò àti ìtumọ̀ Gíríìkì mọ́: ìjọ tí àwọn ará Laodíkíà jẹ́ apá rẹ̀.'
- source_word: τὴν ἐκ Λαοδικείας
  choice: èyí tí ó ti Laodíkíà wá
  rationale: Ọ̀rọ̀ “lẹ́tà” wà ní àfihàn nínú àyíká ṣùgbọ́n a kò tún un sọ ní Gíríìkì. Ìtumọ̀ yìí pa àìsọ-orúkọ náà àti ìtumọ̀ ἐκ, “láti/ti … wá,” mọ́.
theological_decisions:
- issue: Ìdánimọ̀ lẹ́tà tí ó ti Laodíkíà wá
  choice: A túmọ̀ ọ́ láìdá lẹ́tà náà mọ̀ gẹ́gẹ́ bí “èyí tí ó ti Laodíkíà wá.”
  alternative: Lẹ́tà tí a kọ sí àwọn ará Laodíkíà; lẹ́tà kan tí a rán láti Laodíkíà; tàbí lẹ́tà alákáàkiri kan tí ó ní ìbáṣepọ̀ pẹ̀lú Laodíkíà.
  rationale: Gíríìkì sọ ìbáṣepọ̀ lẹ́tà náà pẹ̀lú Laodíkíà, ṣùgbọ́n kò sọ ìdánimọ̀ rẹ̀ tàbí ibi tí a kọ ọ́ sí. Nítorí náà, a kò yan ìtumọ̀ itan kan lórí àwọn mìíràn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ṣe kedere, tó ní ọ̀wọ̀, tí ó sì yẹ fún kíkà ní ìjọ. A lo àṣẹ ọ̀pọ̀ ènìyàn “ẹ,” a sì fi àmì ohùn sí ibi tí ó bá èdè àdáyébá mu.
