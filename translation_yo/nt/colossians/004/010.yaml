language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: yo
  text: Àrísítákù, ẹlẹgbẹ́ mi nínú ẹ̀wọ̀n, ń kí yín, àti Máàkù, ọmọ ìbátan Bánábà[a] (ẹni tí ẹ ti gba àwọn ìtọ́ni nípa rẹ̀—bí ó bá dé ọ̀dọ̀ yín, ẹ tẹ́wọ́ gbà á[b]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọ ẹ̀gbọ́n tàbí àbúrò ọkùnrin Bánábà.” Àwọn ìtumọ̀ àtijọ́ kan ń lo ìtumọ̀ yìí, ṣùgbọ́n ἀνεψιός nínú Gíríìkì Koiné túmọ̀ sí cousin ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ gbà á sí ọ̀dọ̀ yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹnì kan gẹ́gẹ́ bí àlejò; “ẹ tẹ́wọ́ gbà á” mú èrò yẹn hàn ní Yorùbá òde òní.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: ń kí yín
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ yìí ni Gíríìkì fi hàn nínú ìkíni lẹ́tà; ‘ń kí yín’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ náà mu.
- source_word: συναιχμάλωτός
  choice: ẹlẹgbẹ́ mi nínú ẹ̀wọ̀n
  rationale: Èyí pa ìtumọ̀ ẹni tí ó jẹ́ ẹlẹ́wọ̀n papọ̀ mọ́ Pọ́ọ̀lù mọ́, láì fi kún un pé ẹ̀wọ̀n náà jẹ́ ti ara tàbí àpẹẹrẹ ẹ̀mí.
- source_word: ἀνεψιὸς
  choice: ọmọ ẹ̀gbọ́n tàbí àbúrò Bánábà
  rationale: Nínú Gíríìkì Koiné, ọ̀rọ̀ náà ń tọ́ka sí cousin. Ọ̀rọ̀ Yorùbá yìí ṣàlàyé ìbátan náà ní pípé ju ‘ọmọ ìbátan’ lọ.
- source_word: ἐλάβετε ἐντολάς
  choice: ẹ ti gba àwọn ìtọ́ni
  rationale: ‘Àwọn ìtọ́ni’ fi àṣẹ tí ọ̀rọ̀ Gíríìkì ní hàn láì mú un le bí ‘àwọn àṣẹ’ tàbí ‘àwọn òfin,’ ó sì bá ọ̀rọ̀ ìrìn-àjò àti gbígba àlejò mu.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: bí ó bá dé ọ̀dọ̀ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ipò ọjọ́ iwájú tí ἐάν pẹ̀lú subjunctive ń sọ.
- source_word: δέξασθε αὐτόν
  choice: ẹ tẹ́wọ́ gbà á
  rationale: Nínú àyíká gbígba arìnrìn-àjò tàbí àlejò, gbólóhùn yìí túmọ̀ sí kí wọ́n kí i káàbọ̀, wọ́n sì gbà á láàrín wọn; ó tún pa agbára àṣẹ mọ́.
theological_decisions:
- issue: Irú ìbáṣepọ̀ Pọ́ọ̀lù àti Àrísítákù nínú συναιχμάλωτός μου
  choice: ẹlẹgbẹ́ mi nínú ẹ̀wọ̀n
  alternative: ẹlẹgbẹ́ mi tí a jọ ń jìyà nítorí Kristi
  rationale: Àyọkà náà kò sọ ní kedere bóyá ẹ̀wọ̀n gidi ni tàbí àpẹẹrẹ ìjìyà fún Kristi. Ìtumọ̀ náà kò pinnu ohun tí àyọkà kò pinnu.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A túmọ̀ ìbátan Máàkù sí gbólóhùn àlàyé dípò lílo ‘kúsìn’ nínú àyọkà pàtàkì, nítorí gbólóhùn náà ṣe kedere sí gbogbo òǹkàwé. Àmì gígùn ya ìtọ́ni nípa Máàkù sọ́tọ̀ láì yí àkópọ̀ gbolohun Gíríìkì padà.
