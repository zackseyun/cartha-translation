id: COL.4.12
reference: Colossians 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: yo
  text: Ẹpafira, ẹni tí ó jẹ́ ọ̀kan nínú yín, ń kí yín. Ó jẹ́ ẹrú Mèsáyà[a], ó sì ń tiraka fún yín nígbà gbogbo nínú àdúrà rẹ̀, kí ẹ lè dúró ní ìdàgbà dénú, tí ẹ sì ní ìdánilójú kíkún[b] nínú gbogbo ìfẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, “Ẹni Àmì-òróró.” A tún lè túmọ̀ ọ́ sí “Kristi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè, kò sì ní “Jésù” nínú ẹsẹ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí a ti fìdí yín múlẹ̀ pátápátá.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdánilójú kíkún tàbí ipò ìfìdímúlẹ̀ tó péye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: ń kí yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìkíni tí a máa ń lò ní òpin lẹ́tà.
- source_word: ὁ ἐξ ὑμῶν
  choice: ẹni tí ó jẹ́ ọ̀kan nínú yín
  rationale: Ó fi hàn pé Ẹpafira jẹ́ ara ìjọ àwọn ará Kólósè, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí ó jẹ́ ohun-ìní olúwa rẹ̀, ó sì fi ìfaramọ́ Ẹpafira fún Mèsáyà hàn ju ‘ìránṣẹ́’ lọ.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fi àmì òróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ láìfi orúkọ Jésù kún ẹsẹ̀ tí kò sí nínú Gíríìkì.
- source_word: ἀγωνιζόμενος
  choice: ń tiraka
  rationale: ‘Ń tiraka’ mú ìsapá líle àti ìjàkadì tí ọ̀rọ̀ Gíríìkì ní jáde láìfi àwòrán kan pàtó lé e lórí.
- source_word: ἐν ταῖς προσευχαῖς
  choice: nínú àdúrà rẹ̀
  rationale: Èyí fi hàn ní ti ẹ̀dá Yorùbá pé Ẹpafira ni ẹni tí ń gbàdúrà, àti pé àdúrà náà jẹ́ ohun tí ó ń ṣe léraléra.
- source_word: ἵνα σταθῆτε
  choice: kí ẹ lè dúró
  rationale: Ó pa àwòrán ‘dídúró’ inú ọ̀rọ̀ Gíríìkì mọ́, láìfi ‘ṣinṣin’ kún un bí ó tilẹ̀ jẹ́ pé ìtumọ̀ náà lè tọ́ka sí ìfìdímúlẹ̀.
- source_word: τέλειοι
  choice: gẹ́gẹ́ bí ẹni tí ó dàgbà dénú
  rationale: Nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó ń tọ́ka sí ìdàgbàsókè àti ìkúnrẹ́rẹ́ nípa tẹ̀mí, kì í ṣe àìlẹ́ṣẹ̀ pátápátá.
- source_word: πεπληροφορημένοι
  choice: ní ìdánilójú kíkún
  rationale: Ó fi ipò ìdánilójú tàbí ìgbọ́kànlé tó péye hàn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: nínú gbogbo ìfẹ́ Ọlọ́run
  rationale: Ìtumọ̀ yìí mọ̀ọ́mọ̀ pa fífi ọ̀rọ̀ náà sí abẹ́ ‘nínú’ mọ́, kí ó má bàa pinnu bóyá ó túmọ̀ sí gbogbo ohun tí Ọlọ́run fẹ́ tàbí ìdúró ní ìbámu pẹ̀lú ìfẹ́ rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú δοῦλος Χριστοῦ
  choice: ẹrú Mèsáyà
  alternative: ẹrú Kristi
  rationale: ‘Mèsáyà’ pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ‘Ẹni Àmì-òróró’ mọ́; a kò fi ‘Jésù’ kún un nítorí pé kò sí nínú ẹsẹ̀ Gíríìkì yìí.
- issue: Bí a ṣe túmọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú ọ̀rọ̀ ìdánimọ̀ yìí, ‘ẹrú’ pa ìtumọ̀ jíjẹ́ ti Mèsáyà àti ìfaramọ́ pátápátá mọ́, bó tilẹ̀ jẹ́ pé ‘ìránṣẹ́’ rọrùn sí etí.
- issue: Ìtumọ̀ πεπληροφορημένοι
  choice: ní ìdánilójú kíkún
  alternative: tí a fi ẹsẹ̀ yín múlẹ̀ pátápátá
  rationale: Ìtumọ̀ ìdánilójú ni iye ọ̀rọ̀ tó wọ́pọ̀ jù, ṣùgbọ́n ọ̀rọ̀ náà tún lè tọ́ka sí ipò ìfìdímúlẹ̀; a pa àṣàyàn kejì mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá bá ìlò àdánidá mu. A ya gbolohun ìkíni sí méjì kí ọ̀rọ̀ má bàa wuwo, ṣùgbọ́n a pa ìbáṣepọ̀ àwọn gbólóhùn Gíríìkì mọ́. ‘Ẹrú’ jẹ́ ọ̀rọ̀ líle ní Yorùbá bí ó ti rí ní Gíríìkì, a sì mọ̀ọ́mọ̀ pa agbára rẹ̀ mọ́.
