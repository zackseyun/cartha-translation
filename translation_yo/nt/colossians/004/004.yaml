  yaml_path: translation/nt/colossians/004/004.yaml
  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: yo
  text: kí n lè mú un hàn kedere[a], bí ó ti yẹ kí n sọ̀rọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣí i payá” tàbí “jẹ́ kí a mọ̀ ọ́.” Arọ́pò-orúkọ náà ń tọ́ka sí àṣírí tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “bí mo ṣe gbọdọ̀ sọ̀rọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó ń fi ète hàn; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára gbólóhùn ète Gíríìkì mọ́.
- source_word: φανερώσω
  choice: mú un hàn kedere
  rationale: Ó sọ ìfihàn ohun kan di mímọ̀ àti òye; ó bá àyíká ọ̀rọ̀ nípa pípolongo àṣírí náà mu láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: αὐτὸ
  choice: un
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àṣírí tí ẹsẹ tó ṣáájú mẹ́nu kàn; lílo arọ́pò-orúkọ pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὡς
  choice: bí ... ti
  rationale: Ó fi ọ̀nà tàbí ìlànà tí Pọ́ọ̀lù yẹ kí ó gbà sọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: δεῖ
  choice: ó yẹ kí n
  rationale: Ó fi ojúṣe tàbí ohun tí ó pọndandan hàn, láì mú un lágbára ju bí Gíríìkì ṣe béèrè lọ.
- source_word: με
  choice: n
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà ní accusative nínú Gíríìkì, Yorùbá fi aṣojú olùṣe ‘n’ hàn nínú gbólóhùn ‘ó yẹ kí n ...’.
- source_word: λαλῆσαι
  choice: sọ̀rọ̀
  rationale: Ó jẹ́ ìtumọ̀ gbogbogbò àti tààrà fún ‘láti sọ̀rọ̀’; ‘polongo’ yóò fi ìtumọ̀ pàtó sí i ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ nínú gbólóhùn yìí lọ.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ αὐτό ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí arọ́pò-orúkọ ‘un’ nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a sọ ní tààrà pé ‘àṣírí náà.’
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó tọ́ka sí àṣírí Kristi ní ẹsẹ tó ṣáájú, ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ; fífi bẹ́ẹ̀ sílẹ̀ kò jẹ́ kí ìtumọ̀ àyíká sọnù, kò sì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, tí ó ní iyì ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘mú un hàn kedere’ mú ìtumọ̀ ìfihàn àti ṣíṣe kedere pọ̀ ní ọ̀nà tí òǹkàwé òde òní lè lóye.
