  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: yo
  text: Ẹ kí àwọn arákùnrin tí wọ́n wà ní Laodíkíà, àti Nímfà, àti ìjọ tí ń péjọ ní ilé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀dà àfọwọ́kọ kan ní “Nímfásì àti ìjọ tí ń péjọ ní ilé rẹ̀,” níbi tí arọ́pò-orúkọ náà ti tọ́ka sí Nímfásì gẹ́gẹ́ bí ọkùnrin; àwọn mìíràn sì ní “ilé wọn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ó mú àṣẹ ọ̀rọ̀-ìṣe náà jáde ní Yorùbá àdánidá, ó sì fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: àwọn arákùnrin tí ó wà ní Laodíkíà
  rationale: “Àwọn arákùnrin” pa ìrísí akọ ọ̀pọ̀ ti orísun mọ́; nínú lílo Pọ́ọ̀lù, ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin.
- source_word: Νύμφαν
  choice: Nímfà
  rationale: Ó tẹ̀ lé kíkà SBLGNT gẹ́gẹ́ bí orúkọ obìnrin, pẹ̀lú àmì ohùn Yorùbá fún ìkàwé àdánidá.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: ìjọ tí ó wà nínú ilé rẹ̀
  rationale: Ó sọ ìtumọ̀ àpólà náà ní kedere láì fi ọ̀rọ̀ “tí ó máa ń péjọ” kún un, èyí tí yóò jẹ́ àlàyé ju bí orísun ṣe sọ lọ.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún àwùjọ àwọn Kristẹni nínú ọ̀rọ̀ Pọ́ọ̀lù.
theological_decisions:
- issue: Ìdánimọ̀ àti akọ tàbí abo Νύμφαν, àti arọ́pò-orúkọ tó bá a mu
  choice: Nímfà ... ilé rẹ̀ (abo)
  alternative: Nímfásì ... ilé rẹ̀ (akọ); tàbí ... ilé wọn
  rationale: Ọ̀rọ̀ SBLGNT tí a tẹ̀ jáde ní Νύμφαν àti αὐτῆς, èyí tí ó ṣe àtìlẹ́yìn fún orúkọ obìnrin àti “rẹ̀.” Nítorí àwọn ìyàtọ̀ inú àwọn ẹ̀dà àfọwọ́kọ, àkọsílẹ̀ ìsàlẹ̀ pa àwọn kíkà akọ àti ọ̀pọ̀ mọ́ láì dá àríyànjiyàn náà parí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. Àṣẹ “Ẹ kí” jẹ́ kedere, ó sì yẹ fún lẹ́tà. A pa “àwọn arákùnrin” mọ́ láti tẹ̀ lé ìrísí orísun, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó lè kó àwọn arábìnrin mọ́ra.
