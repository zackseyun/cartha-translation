revisions:
- from: Nítorí mo jẹ́rìí nípa rẹ̀ pé ó ń ṣe làálàá púpọ̀ nítorí yín àti nítorí àwọn tí ó wà ní Laodíkíà àti àwọn tí ó wà ní Hierápólì.[a]
  to: Nítorí mo jẹ́rìí nípa rẹ̀ pé ó ń ṣiṣẹ́ kára gidigidi fún yín àti fún àwọn tí ó wà ní Laodikea àti àwọn tí ó wà ní Hierapoli.[a]
  rationale: Àtúnṣe náà ń jẹ́ kí ìtumọ̀ ὑπέρ kedere síi ní Yorùbá, ń sọ πόνος gẹ́gẹ́ bí iṣẹ́/ìsapá líle dípò ìdààmú tí ẹni kan ń jìyà, ó sì ń mú ìkọ̀wé orúkọ ìlú bá ìlò Yorùbá Bíbélì mu. A kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kún ẹsẹ̀ náà, àti pé akọsilẹ̀ náà ń pa ìfẹ̀ẹ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní pàtàkì: μαρτυρῶ αὐτῷ ni “mo jẹ́rìí nípa rẹ̀,” àwọn ẹgbẹ́ mẹ́tẹ̀ẹ̀ta tí ὑπέρ ń darí sì wà ní kíkún. Síbẹ̀, “nítorí yín” lè dà bí ohun tí ó fa làálàá náà ní Yorùbá; “fún yín” dá ìtumọ̀ ὑπέρ (fún àǹfààní wọn/lórí tìrẹ wọn) hàn kedere. “Ó ń ṣe làálàá” sì jẹ́ àdánidá díẹ̀ kù ju ọ̀nà tí ó sọ iṣẹ́ líle Epafírà hàn lọ.'
  naturalness: 'A tún gbólóhùn náà ṣe sí Yorùbá òde òní tó rọrùn: “ó ń ṣiṣẹ́ kára gidigidi” ń gbé πόνον—iṣẹ́/ìsapá líle—jáde láìsọ pé ìṣòro tàbí ìdààmú ń ṣẹlẹ̀ sí i. A tún lo ìkọ̀wé orúkọ ìlú tí ó wọ́pọ̀ nínú Yorùbá, Laodikea àti Hierapoli.'
  terminology: “Jẹ́rìí nípa rẹ̀” jẹ́ ìtumọ̀ adayeba fún μαρτυρῶ αὐτῷ nínú àyíká ìmúyẹ Epafírà. “Ń ṣiṣẹ́ kára gidigidi” ń pa ìtumọ̀ pàtàkì πόνος mọ́; akọsilẹ̀ náà sì ń dáàbò bo àwọn ìtumọ̀ àfikún bí ìsapá àti àníyàn tó jinlẹ̀.
  issues:
  - severity: medium
    issue: “nítorí yín” fún ὑπὲρ ὑμῶν
    rationale: Nínú Yorùbá, “nítorí” sábà máa ń tọ́ka sí ìdí tàbí okùnfà. Nínú ẹsẹ̀ yìí ὑπέρ ń tọ́ka sí àwọn ẹni tí Epafírà ń ṣiṣẹ́ fún tàbí tí ó ń tọ́jú ní ọkàn; “fún” ṣetọju ìtumọ̀ yẹn dáadáa.
  - severity: low
    issue: “ó ń ṣe làálàá púpọ̀”
    rationale: Ó lè gbọ́ bí ẹni pé Epafírà ń ní ìdààmú púpọ̀, dípò iṣẹ́ líle tí ó ń ṣe. “Ó ń ṣiṣẹ́ kára gidigidi” jẹ́ èdè Yorùbá tí ó tú πόνος nípa iṣẹ́/ìsapá hàn kedere.
  - severity: low
    issue: Ìkọ̀wé àwọn orúkọ ìlú
    rationale: “Laodikea” àti “Hierapoli” jẹ́ àwọn ìrísí tí ó wọ́pọ̀ jù nínú ìlò Bíbélì Yorùbá; yíyípadà náà jẹ́ ti ìbámu orúkọ, kì í ṣe ìyípadà ìtumọ̀.
  revised_text: Nítorí mo jẹ́rìí nípa rẹ̀ pé ó ń ṣiṣẹ́ kára gidigidi fún yín àti fún àwọn tí ó wà ní Laodikea àti àwọn tí ó wà ní Hierapoli.[a]
