id: COL.4.13
reference: Colossians 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: yo
  text: Nítorí mo jẹ́rìí nípa rẹ̀ pé ó ń ṣiṣẹ́ kára gidigidi fún yín àti fún àwọn tí ó wà ní Laodikea àti àwọn tí ó wà ní Hierapoli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ní ìsapá púpọ̀,” “ó ní àníyàn ńlá,” tàbí “ó ní ìrora ọkàn jíjinlẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí iṣẹ́ líle tàbí ìsapá, ó sì lè tọ́ka sí àníyàn tó jinlẹ̀ nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: mo jẹ́rìí
  rationale: Ó túmọ̀ sí ìjẹ́rìí Pọ́ọ̀lù ní tààràtà, láìfi ìtumọ̀ agbára bí ‘mo lè jẹ́rìí’ kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ láàárín gbólóhùn yìí àti ẹsẹ tó ṣáájú.
- source_word: αὐτῷ
  choice: nípa rẹ̀
  rationale: Pẹ̀lú μαρτυρέω, dátífù náà lè tọ́ka sí ẹni tí ìjẹ́rìí náà dá lé; ‘nípa rẹ̀’ jẹ́ èdè Yorùbá àdánidá, ó sì yẹ fún bí Pọ́ọ̀lù ṣe ń jẹ́rìí nípa Epafírà.
- source_word: ἔχει πολὺν πόνον
  choice: ó ń ṣe làálàá púpọ̀
  rationale: Dípò ìtumọ̀ gígígírí pé ó ‘ní’ làálàá, ọ̀rọ̀ yìí fi ìsapá líle tó ń bá a lọ hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìpìlẹ̀ πόνος mọ́.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Ó fi hàn pé ìsapá náà jẹ́ fún àǹfààní wọn tàbí nítorí àníyàn rẹ̀ fún wọn; ‘yín’ tún pa ọ̀pọ̀ ènìyàn inú ὑμῶν mọ́.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: àwọn tí ó wà ní Laodíkíà
  rationale: Ó tú àpilẹ̀kọ àti gbólóhùn àsọtẹ́lẹ̀ Gíríìkì náà sí Yorùbá tó ṣe kedere, láìfi ‘àwọn onígbàgbọ́’ tí kò fara hàn gbangba sínú ọ̀rọ̀ náà.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: àwọn tí ó wà ní Hierápólì
  rationale: Ó tẹ̀ lé ìṣọ̀kan gbólóhùn tó ṣáájú, ó sì ṣe àkọsílẹ̀ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πόνος nípa iṣẹ́ ìránṣẹ́ Epafírà
  choice: làálàá púpọ̀
  alternative: ìsapá púpọ̀; àníyàn ńlá; ìrora ọkàn jíjinlẹ̀
  rationale: Àyíká ẹsẹ 4:12 ń sọ nípa bí Epafírà ṣe ń tiraka nínú àdúrà, ṣùgbọ́n πόνος ní ìtumọ̀ ìpìlẹ̀ ti làálàá tàbí iṣẹ́ líle. Yíyan ‘làálàá púpọ̀’ pa ìtumọ̀ tó gbòòrò mọ́, láìdín un kù sí ìmọ̀lára àníyàn tàbí àdúrà nìkan.
- issue: Agbára dátífù αὐτῷ pẹ̀lú μαρτυρῶ
  choice: jẹ́rìí nípa rẹ̀
  alternative: jẹ́rìí fún un; jẹ́rìí ní ipò rẹ̀
  rationale: Dátífù náà lè ní ìmọ̀ pé ìjẹ́rìí wà fún àǹfààní Epafírà, ṣùgbọ́n nínú Yorùbá, ‘jẹ́rìí nípa rẹ̀’ dá àkóónú ìjẹ́rìí Pọ́ọ̀lù hàn lọ́nà tó ṣe kedere, láìpa agbára ìyìn náà rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. Àwọn àmì ohùn wà níbi tó yẹ. ‘Ó ń ṣe làálàá púpọ̀’ jẹ́ àdánidá ju ìtumọ̀ gígígírí ‘ó ní làálàá púpọ̀’ lọ, nígbà tí akọsilẹ̀ ẹsẹ ń pa àwọn agbára ìtumọ̀ míì mọ́.
