id: COL.4.7
reference: Colossians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: yo
  text: Tíkíkù, arákùnrin olùfẹ́, ìránṣẹ́ olóòótọ́[b] àti ẹrú ẹlẹgbẹ́[c] nínú Olúwa, yóò jẹ́ kí ẹ mọ̀ gbogbo ohun tó kan mi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ọ̀ràn tó kan mi,” tàbí “gbogbo ipò mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òjíṣẹ́ olóòótọ́.” Ọ̀rọ̀ Gíríìkì διάκονος lè túmọ̀ sí ìránṣẹ́, òjíṣẹ́, tàbí, ní àwọn àyíká kan, díákónì gẹ́gẹ́ bí ipò nínú ìjọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìránṣẹ́ ẹlẹgbẹ́” tàbí “ẹrú alábàáṣiṣẹ́.” Ọ̀rọ̀ Gíríìkì σύνδουλος dá lórí δοῦλος, èyí tó lè tọ́ka sí ẹni tó wà nínú iṣẹ́ ìdè lábẹ́ ọ̀gá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: gbogbo ohun tí ó jẹ mọ́ mi
  rationale: Ọ̀rọ̀ yìí ní gbogbo ọ̀ràn tó kan Pọ́ọ̀lù—ipò rẹ̀, ohun tó ń ṣẹlẹ̀ sí i, àti àwọn àlámọ̀rí rẹ̀—láì fi ìtumọ̀ náà mọ́ ‘ipò’ nìkan.
- source_word: γνωρίσει ὑμῖν
  choice: yóò sọ ... di mímọ̀ fún yín
  rationale: Èyí fi ìṣe ọjọ́ iwájú àti èrò γνωρίζω, ìyẹn ‘mú kí ẹnì kan mọ̀,’ hàn ní Yorùbá àdánidá.
- source_word: Τυχικὸς
  choice: Tíkíkù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé bí a ṣe sábà ń kọ orúkọ Tychicus ní Yorùbá.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: arákùnrin olùfẹ́
  rationale: Ó pa ìfẹ́ àti ọlá inú ἀγαπητός mọ́, ó sì tọ́ka sí Tíkíkù gẹ́gẹ́ bí arákùnrin ọkùnrin.
- source_word: πιστὸς διάκονος
  choice: òjíṣẹ́ olóòótọ́
  rationale: Òjíṣẹ́ lè ṣàpèjúwe ẹni tó ń ṣe iṣẹ́ ìránṣẹ́ láì pinnu pé ipò ìjọ pàtó ni; olóòótọ́ sì mú ìgbẹ́kẹ̀lé inú πιστός jáde.
- source_word: σύνδουλος
  choice: ẹrú alábàáṣiṣẹ́
  rationale: Ẹrú pa agbára δοῦλος gẹ́gẹ́ bí ẹni tó wà lábẹ́ ọ̀gá mọ́, alábàáṣiṣẹ́ sì fi σύν- hàn pé Tíkíkù ń pín irú iṣẹ́ àti ipò náà pẹ̀lú Pọ́ọ̀lù.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí ààyè ìbáṣepọ̀ àti iṣẹ́ wọn lábẹ́ Olúwa, láì túmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ σύνδουλος àti èdè δοῦλος
  choice: ẹrú alábàáṣiṣẹ́
  alternative: ìránṣẹ́ alábàáṣiṣẹ́; ẹrú ẹlẹgbẹ́
  rationale: ‘Ẹrú’ mú ìtumọ̀ jíjẹ́ ti Olúwa àti iṣẹ́ lábẹ́ àṣẹ rẹ̀ jáde, nígbà tí ‘alábàáṣiṣẹ́’ fi hàn pé Tíkíkù àti Pọ́ọ̀lù ń pín ipò yìí. Àlàyé ìsàlẹ̀ pa ọ̀nà ‘ìránṣẹ́’ mọ́ fún àwọn tó lè gbọ́ ‘ẹrú’ pẹ̀lú àwọn ìtumọ̀ òde òní tí kò ṣe pàtàkì ní gbogbo àyíká Májẹ̀mú Tuntun.
- issue: Ààlà ìtumọ̀ διάκονος
  choice: òjíṣẹ́
  alternative: ìránṣẹ́; díákónì
  rationale: Àyíká yìí fi iṣẹ́ ìránṣẹ́ Tíkíkù àti ìgbẹ́kẹ̀lé rẹ̀ hàn, ṣùgbọ́n kò fi hàn dájú pé orúkọ ipò ìjọ ‘díákónì’ ni Pọ́ọ̀lù ń lò.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà tẹ̀ lé ìṣètò Yorùbá àdánidá, ṣùgbọ́n ó pa gbogbo àpèjúwe Tíkíkù àti ìbáṣepọ̀ wọn ‘nínú Olúwa’ mọ́. A kò fi ‘wa’ kún ‘arákùnrin,’ nítorí kò sí ní pàtó nínú orísun Gíríìkì.
