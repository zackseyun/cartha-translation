source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: yo
  text: Nítorí náà, bí o bá kà mí sí alábàápín rẹ, tẹ́wọ́ gba á[a] gẹ́gẹ́ bí ìwọ ṣe máa tẹ́wọ́ gba mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí o káàbọ̀ sí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹnì kan tọkàntọkàn tàbí gbígba ẹni náà sínú àjọṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Nítorí náà, bí
  rationale: Ó pa ìtumọ̀ ìjápọ̀ ọ̀rọ̀ οὖν mọ́, ó sì fi εἰ hàn gẹ́gẹ́ bí gbólóhùn àídájú ní Yorùbá àdánidá.
- source_word: ἔχεις κοινωνόν
  choice: o bá kà mí sí alábàáṣepọ̀
  rationale: κοινωνός ń tọ́ka sí ẹni tí ó ń pín ohun kan tàbí ìbáṣepọ̀ pẹ̀lú ẹlòmíràn. ‘Kà mí sí alábàáṣepọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìtumọ̀ ìbáṣepọ̀ náà láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó.
- source_word: προσλαβοῦ
  choice: gbà á sílẹ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí lè túmọ̀ sí gbígba ènìyàn tọkàntọkàn, káàbọ̀ fún un, tàbí gbígbà á sínú àjọṣe. ‘Gbà á sílẹ̀’ pa fífẹ̀ ìtumọ̀ náà mọ́ ju ọ̀rọ̀ tó dá lórí àlejò nìkan lọ.
- source_word: αὐτὸν
  choice: á
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Onesimu gẹ́gẹ́ bí àṣàyàn ọ̀rọ̀ inú ẹsẹ̀ yìí.
- source_word: ὡς ἐμέ
  choice: bí ìwọ ìbá ti gba èmi fúnra mi
  rationale: Ìfikún ‘fúnra mi’ ń gbé agbára arọ́pò-orúkọ ἐμέ jáde, ó sì sọ ìfiwéra náà di Yorùbá tó ṣe kedere àti àdánidá.
theological_decisions:
- issue: Agbára ìbáṣepọ̀ tí κοινωνός ní nínú ẹ̀bẹ̀ Pọ́ọ̀lù
  choice: alábàáṣepọ̀
  alternative: alábàápín; alábàákẹ́gbẹ́
  rationale: ‘Alábàáṣepọ̀’ fi ìdọ́gba àti àjọpín ìbáṣepọ̀ Pọ́ọ̀lù àti Filemoni hàn, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
