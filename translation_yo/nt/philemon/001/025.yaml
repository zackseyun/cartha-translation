  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa Jésù Mèsáyà wà pẹ̀lú ẹ̀mí yín.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Kí oore-ọ̀fẹ́ Olúwa Jésù Kristi wà pẹ̀lú ẹ̀mí yín.”
    reason: alternative_reading
  - marker: b
    text: “Yín” jẹ́ ọ̀pọ̀; èyí fi hàn pé ìbùkún ìparí náà kọjá Fílémónì nìkan, ó sì kan gbogbo àwọn olùgbà lẹ́tà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: 'Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìtumọ̀ inú ìkíni ìbùkún Paulu mu: ojúrere àti ìbùkún tí a kò tọ́ sí.'
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” pa ipò ọlá àti ìwọ̀n Kristológí tí κύριος ní nínú ìbùkún yìí mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ní agbára orúkọ oyè níhìn-ín; “Mèsáyà” mú ìtumọ̀ “Ẹni Àmì-Òróró” yẹn hàn, nígbà tí a fi “Jésù Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà ìbílẹ̀.
- source_word: μετὰ
  choice: wà pẹ̀lú
  rationale: Gíríìkì ní “pẹ̀lú” nínú gbólóhùn tí kò ní ọ̀rọ̀-ìṣe; fífi “wà” kún un mú kí ìbùkún náà jẹ́ Yorùbá àdánidá.
- source_word: πνεύματος
  choice: ẹ̀mí
  rationale: “Ẹ̀mí” tọ́ka sí inú ènìyàn tàbí ẹ̀mí àwọn olùgbà lẹ́tà; a kò fi ọ̀rọ̀ míì kún un láti sọ pé Ẹ̀mí Mímọ́ ni.
- source_word: ὑμῶν
  choice: yín
  rationale: “Yín” jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ní Yorùbá, ó sì pa ọ̀pọ̀ inú Gíríìkì mọ́ ní tààrà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú ìbùkún ìparí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ yìí, oyè náà ṣì ní ìtumọ̀ rẹ̀; “Mèsáyà” mú un hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ “Kristi” mọ́.
- issue: Ẹni tí “ẹ̀mí” ń tọ́ka sí nínú “ẹ̀mí yín”
  choice: ẹ̀mí tàbí inú àwọn olùgbà lẹ́tà
  alternative: Ẹ̀mí Mímọ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “yín” tọ́ka gidigidi sí ẹ̀mí àwọn olùgbà lẹ́tà. A pa ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ ní gbangba kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó ṣeé lóye fún gbogbo ènìyàn. Ìṣètò “Kí … wà” jẹ́ ọ̀nà àdánidá láti fi ìbùkún hàn; àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá àti àwọn orúkọ bí ó ti yẹ.
