source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: yo
  text: nítorí mo ń gbọ́ nípa ìfẹ́ rẹ àti ìgbàgbọ́ rẹ sí Olúwa Jesu àti sí gbogbo àwọn ẹni mímọ́[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá sọ ìtumọ̀ náà ní kedere sí i: “ìgbàgbọ́ rẹ sí Olúwa Jesu àti ìfẹ́ rẹ sí gbogbo àwọn ẹni mímọ́.”'
    reason: alternative_reading
  - marker: b
    text: Tàbí “ìdúróṣinṣin rẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìdúróṣinṣin.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ìfẹ́ àti ìgbàgbọ́ tí o ní.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: nítorí mo ń gbọ́
  rationale: Ọ̀rọ̀ aláìlópin náà sin gẹ́gẹ́ bí ìdí fún ọpẹ́ inú ẹsẹ tó ṣáájú; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún ἀγάπη.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí pa ìtumọ̀ àkọ́kọ́ ti πίστις mọ́; àṣàyàn ‘ìṣòtítọ́’ wà nínú àlàyé ìsàlẹ̀.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: sí Olúwa Jesu
  rationale: ‘Sí’ fi ìdarí tàbí ìfojúsùn sí ẹni kan hàn, ó sì bá πρός mu láì yí i sí ‘nínú’.
- source_word: κύριον
  choice: Olúwa
  rationale: Orúkọ oyè Kristi tí a sábà máa ń lò fún κύριος ni ‘Olúwa’.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: sí gbogbo àwọn ẹni mímọ́
  rationale: ‘Sí’ pa ìṣàn ọ̀rọ̀ Gíríìkì àti àìdánilójú ìbáṣepọ̀ àwọn ọ̀rọ̀ náà mọ́; ‘gbogbo àwọn ẹni mímọ́’ jẹ́ ìtumọ̀ kedere fún àwùjọ àwọn onígbàgbọ́.
- source_word: ἁγίους
  choice: àwọn ẹni mímọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì túmọ̀ ἅγιοι gẹ́gẹ́ bí orúkọ àwùjọ àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run.
theological_decisions:
- issue: Bí ‘ìfẹ́’ àti ‘ìgbàgbọ́’ ṣe ní í ṣe pẹ̀lú àwọn gbólóhùn méjèèjì tó tẹ̀ lé wọn
  choice: 'A tẹ̀ lé ìṣètò ojú-ọ̀rọ̀ Gíríìkì: ‘ìfẹ́ àti ìgbàgbọ́ rẹ ... sí Olúwa Jesu àti sí gbogbo àwọn ẹni mímọ́.’'
  alternative: ‘ìgbàgbọ́ rẹ sí Olúwa Jesu àti ìfẹ́ rẹ sí gbogbo àwọn ẹni mímọ́.’
  rationale: Ó ṣeé ṣe kí a pín àwọn ọ̀rọ̀ náà ní ìtumọ̀—ìgbàgbọ́ sí Jesu, ìfẹ́ sí àwọn ẹni mímọ́—ṣùgbọ́n Gíríìkì kò ṣe ìpín náà ní kedere. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́, àlàyé ìsàlẹ̀ sì sọ ìtumọ̀ pípín náà.
- issue: Ìtumọ̀ πίστις nínú àyíká yìí
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́, ṣùgbọ́n πίστις tún lè tọ́ka sí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́; a pa àṣàyàn náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. A pa ìṣàn àti àìdánilójú Gíríìkì mọ́ dípò yíyanju rẹ̀ nínú ọ̀rọ̀ àkọ́kọ́.
