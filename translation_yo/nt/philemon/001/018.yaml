  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá ti ṣe ọ́ ní ohun tí kò tọ́ kankan, tàbí tí ó jẹ ọ́ ní gbèsè kan, ka èyí sí àkọọ́lẹ̀ mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “fi èyí sí gbèsè mi.” Ọ̀rọ̀ ìṣe náà ní ìtumọ̀ ìṣirò owó: kíkà ohun kan sí àkọọ́lẹ̀ ẹnì kan tàbí fífi í sí gbèsè rẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ṣùgbọ́n bí
  rationale: Ó fi ipò àídájú hàn, ó sì ní ìyípadà kékeré sí ohun tí ó ṣáájú; “Ṣùgbọ́n bí” jẹ́ àdánidá ní Yorùbá.
- source_word: τι ἠδίκησέν σε
  choice: ó bá ti ṣe ọ́ ní àìṣòdodo ní ohunkóhun
  rationale: Àyànfẹ́ yìí pa ìtumọ̀ ἀδικέω mọ́ gẹ́gẹ́ bí ṣíṣe ohun tí kò tọ́ sí ẹnì kan, láìdín un kù sí jíjẹ owó tàbí ohun ìní nìkan.
- source_word: ἢ ὀφείλει
  choice: tàbí tí ó jẹ ọ́ ní gbèsè ohunkóhun
  rationale: Ó mú ìtumọ̀ gbèsè tàbí ojúṣe tí a jẹ ẹnì kan jáde kedere ní èdè Yorùbá.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ atọ́ka náà tọ́ka padà sí àìṣòdodo tàbí gbèsè tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐμοὶ ἐλλόγα
  choice: ka èyí sí àkọọ́lẹ̀ mi
  rationale: ἐλλογέω jẹ́ ọ̀rọ̀ ìṣirò owó, ìtumọ̀ rẹ̀ sì ni láti ka ohun kan sí àkọọ́lẹ̀ ẹnì kan; gbolohun yìí pa àwòrán ìṣirò náà mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbà lónìí tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ṣe ọ́ ní àìṣòdodo” láti pa ìtumọ̀ àìṣèdájọ́ òdodo mọ́, àti “ka ... sí àkọọ́lẹ̀ mi” láti ṣàfihàn àpẹẹrẹ ìṣirò owó inú ọ̀rọ̀ Gíríìkì.
