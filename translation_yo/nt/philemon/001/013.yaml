source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: yo
  text: Ẹni tí mo fẹ́ láti pa mọ́ sọ́dọ̀ mi, kí ó lè ṣe ìránṣẹ́ fún mi ní ipò rẹ nínú ẹ̀wọ̀n ìhìn rere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ẹ̀wọ̀n nítorí ìhìn rere”—ìyẹn ni, ẹ̀wọ̀n tí ó jẹ nítorí ìhìn rere.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Onesimu; “Ẹni tí” jẹ́ ọ̀nà Yorùbá àdánidá láti so gbólóhùn yìí mọ́ ohun tí ó ṣáájú.
- source_word: ἐβουλόμην
  choice: èmi fẹ́
  rationale: Ó fi ìfẹ́ tàbí èrò Paulu ní àkókò tí ó ti kọjá hàn; fífi “èmi” kún un pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: láti dá dúró sọ́dọ̀ mi
  rationale: Àkópọ̀ yìí túmọ̀ sí pé Paulu fẹ́ mú kí Onesimu má lọ, kí ó sì wà pẹ̀lú rẹ̀; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó pa ète ìfẹ́ Paulu mọ́ ní kedere.
- source_word: ὑπὲρ σοῦ
  choice: ní ipò rẹ
  rationale: Ní àyíká ọ̀rọ̀ yìí, iṣẹ́ Onesimu yóò dúró fún iṣẹ́ tí Filemoni ìbá ṣe fún Paulu; “ní ipò rẹ” mú agbára aṣojú ọ̀rọ̀ náà jáde láìsọ pé ìrọ́pò pípé ni.
- source_word: μοι διακονῇ
  choice: máa ṣe ìránṣẹ́ fún mi
  rationale: Ó ní ìtumọ̀ iṣẹ́ ìrànlọ́wọ́ fún Paulu, láìfi ìtumọ̀ ipò ìjọ kan lé e lórí.
- source_word: ἐν τοῖς δεσμοῖς
  choice: nígbà tí mo wà nínú ẹ̀wọ̀n
  rationale: δεσμοί lè tọ́ka sí ìdè tàbí ipò ẹlẹ́wọ̀n; Yorùbá yìí sọ ipò Paulu ní ọ̀nà tí ó ṣe kedere àti àdánidá.
- source_word: τοῦ εὐαγγελίου
  choice: nítorí ìhìn rere
  rationale: Jẹ́nítífù náà ṣeé lóye gẹ́gẹ́ bí ohun tó fa ẹ̀wọ̀n Paulu, ìyẹn pé ó wà ní ẹ̀wọ̀n nítorí ìhìn rere; àlàyé ìtumọ̀ tó sún mọ́ fọ́ọ̀mù Gíríìkì wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Agbára τοῦ εὐαγγελίου tí ó ń ṣàlàyé δεσμοῖς
  choice: nítorí ìhìn rere
  alternative: ẹ̀wọ̀n ìhìn rere
  rationale: Jẹ́nítífù náà ní Gíríìkì kéré ṣùgbọ́n ó lè fi ìdí tàbí ìbáṣepọ̀ hàn. Gbólóhùn àkọ́kọ́ lo ìtumọ̀ ohun tó fa ẹ̀wọ̀n, èyí tó ṣe kedere ní Yorùbá; àlàyé ìsàlẹ̀ pa ọ̀nà ìtumọ̀ tó tẹ̀ lé fọ́ọ̀mù Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ṣe ìránṣẹ́” yàgò fún ọ̀rọ̀ ẹ̀sìn oníṣẹ́-pàtó, “ní ipò rẹ” sì mú ìtumọ̀ aṣojú ὑπὲρ σοῦ jáde.
