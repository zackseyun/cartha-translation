  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: yo
  text: Nítorí mo ti ní ayọ̀ púpọ̀ àti ìṣírí nítorí ìfẹ́ rẹ, nítorí pé àwọn ọkàn àwọn ẹni mímọ́[a] ti rí ìtura nípasẹ̀ rẹ, arákùnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ti gidi jù lọ, “ìfẹ́-inú” àwọn ẹni mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: ayọ̀
  rationale: “Ayọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdùnnú inú tí χαρά ń tọ́ka sí.
- source_word: πολλὴν ἔσχον
  choice: mo ní ... púpọ̀
  rationale: Ó fi ìrírí tàbí níní ayọ̀ àti ìṣírí hàn ní ọ̀nà tó sún mọ́ ìṣètò Gíríìkì, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: παράκλησιν
  choice: ìṣírí
  rationale: Nínú àyíká ìbáṣepọ̀ yìí, “ìṣírí” mú ìtumọ̀ fífúnni ní okun ọkàn jáde; “ìtùnú” tún ṣeé ṣe.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: nítorí ìfẹ́ rẹ
  rationale: ἐπί pẹ̀lú dative níhìn-ín ń tọ́ka sí ìdí tí ayọ̀ àti ìṣírí Pọ́ọ̀lù fi wá.
- source_word: σπλάγχνα
  choice: ọkàn
  rationale: Ní ti àkànlò, ọ̀rọ̀ náà ń tọ́ka sí inú jíjinlẹ̀ ènìyàn, ibi ìfẹ́ni àti ìmọ̀lára; “ọkàn” ni àfiwé Yorùbá tó ṣe kedere jù lọ.
- source_word: τῶν ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Ó pa èrò àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sọ́tọ̀ fún Ọlọ́run mọ́ láì mú èrò ìsọdi-mímọ́ lẹ́yìn ikú wọ inú rẹ̀.
- source_word: ἀναπέπαυται
  choice: ti rí ìtura
  rationale: Perfect tense fi ipò ìtura tó jẹ́ àbájáde ohun tí Fílémónì ṣe hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: διὰ σοῦ
  choice: nípasẹ̀ rẹ
  rationale: Ó pa ìtumọ̀ ohun èlò tàbí aṣojú inú διά pẹ̀lú genitive mọ́.
- source_word: ἀδελφέ
  choice: arákùnrin
  rationale: Ó jẹ́ àdírẹ́sì ìdílé tààrà nínú àwùjọ Kristẹni, láì fi ọ̀rọ̀ ìfẹ́ni tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι
  choice: àwọn ẹni mímọ́
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: “Àwọn ẹni mímọ́” pa èdè Pọ́ọ̀lù nípa àwọn onígbàgbọ́ tí Ọlọ́run yà sọ́tọ̀ mọ́, láì dá a mọ́ ẹ̀kọ́ ìjọ kan pàtó.
- issue: Àkànlò nípa ẹ̀dá ènìyàn nínú σπλάγχνα
  choice: ọkàn
  alternative: inú jíjinlẹ̀
  rationale: “Ọkàn” sọ ibi ìfẹ́ni àti ìmọ̀lára jíjinlẹ̀ ní Yorùbá àdánidá; ìtumọ̀ apá ara ní tààrà yóò ṣìnà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “àwọn ẹni mímọ́” fún ἅγιοι, “ọkàn” gẹ́gẹ́ bí àkànlò fún σπλάγχνα, àti “ti rí ìtura” láti fi abajade tó ń bá a lọ ti perfect tense hàn.
