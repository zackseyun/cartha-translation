id: PHM.1.8
reference: Philemon 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: yo
  text: Nítorí náà, bí ó tilẹ̀ jẹ́ pé mo ní ìgboyà púpọ̀ nínú Mèsáyà[a] láti pàṣẹ fún ọ láti ṣe ohun tí ó yẹ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè tó túmọ̀ sí ẹni tí a fi àmì òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ohun tí ó bójú mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διό
  choice: Nítorí náà
  rationale: Ó fi hàn pé ohun tí Pọ́ọ̀lù fẹ́ sọ jẹ́ àbájáde ohun tó ti sọ ṣáájú; gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìsopọ̀ ọgbọ́n náà mọ́.
- source_word: πολλὴν ... παρρησίαν
  choice: ìgboyà púpọ̀
  rationale: Ó pa ọ̀rọ̀-orúkọ àti agbára πολλήν mọ́, láì fi dandan pinnu bóyá ìgbẹ́kẹ̀lé, òmìnira láti sọ̀rọ̀, tàbí sísọ̀rọ̀ láìbẹ̀rù ni a tẹnumọ́ jù.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: “Nínú” pa ìtumọ̀ ìbáṣepọ̀ tàbí àyíká iṣẹ́ tí ἐν sábà máa ń ní nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́; “Mèsáyà” sì mú ipa Χριστός gẹ́gẹ́ bí oyè hàn.
- source_word: ἔχων
  choice: bí ó tilẹ̀ jẹ́ pé mo ní
  rationale: Àyíká ọ̀rọ̀, pàápàá ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé yóò mú wá, fi hàn pé participle náà ní agbára ìfàyàtọ̀; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá.
- source_word: ἐπιτάσσειν σοι
  choice: láti pàṣẹ fún ọ
  rationale: “Pàṣẹ” pa agbára àṣẹ ἐπιτάσσω mọ́, “fún ọ” sì fi ẹni tí a ń bá sọ hàn lọ́nà Yorùbá tó yẹ.
- source_word: τὸ ἀνῆκον
  choice: láti ṣe ohun tí ó yẹ
  rationale: Ó túmọ̀ sí ohun tó bójú mu, tó yẹ, tàbí tó bá ipò mu. Fífi “láti ṣe” kún un jẹ́ ohun tí èdè Yorùbá béèrè fún kí ìtumọ̀ iṣẹ́ náà lè ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Mèsáyà” pa ìtumọ̀ ẹni tí a yàn tí a sì fi àmì òróró yàn mọ́ láì fi ẹ̀kọ́ ìjọ kan kún un; “Kristi” jẹ́ àṣàyàn tí ó wọ́pọ̀, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. Ìlànà gbólóhùn náà pa ìfàyàtọ̀ tí yóò pé ní ẹsẹ tó tẹ̀ lé mọ́, nítorí náà a fi àmì kọ́mà sí òpin rẹ̀.
