  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: yo
  text: Ní àkókò kan náà, tún pèsè ibi ìgbọ̀sí fún mi[a], nítorí mo ní ìrètí pé nípasẹ̀ àdúrà yín, a ó fún yín ní mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàlejò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàlejò tàbí ibi tí a pèsè fún àlejò láti gbé sí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó fi mí fún yín” tàbí “a ó fún yín ní mi pẹ̀lú oore-ọ̀fẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìmọ̀lára fífún lọ́fẹ̀ẹ́ tàbí pẹ̀lú oore-ọ̀fẹ́; ó lè jẹ́ pé Ọlọ́run ni olùṣe tí a kò dárúkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Ní àkókò kan náà, tún
  rationale: Ó fi ìbéèrè yìí kún èyí tí ó ṣáájú rẹ̀; ‘ní àkókò kan náà’ túmọ̀ ἅμα, ‘tún’ sì mú agbára καὶ jáde ní Yorùbá àdánidá.
- source_word: ἑτοίμαζέ μοι
  choice: pèsè … sílẹ̀ fún mi
  rationale: Àṣẹ ìsinsìnyí ni ἑτοίμαζέ; ‘pèsè … sílẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún mímú ohun tí a ó lò setán, ‘fún mi’ sì fi μοι hàn gẹ́gẹ́ bí ẹni tí ìpèsè náà wà fún.
- source_word: ξενίαν
  choice: yàrá àlejò kan
  rationale: Nínú ọ̀rọ̀ yìí, ohun tí a pèsè fún Pọ́ọ̀lù jẹ́ ibi tí yóò dé sí; ‘yàrá àlejò’ jẹ́ ìtumọ̀ gidi tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ìgbàlejò’ tàbí ‘ibi ìgbé àlejò’ sílẹ̀.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: nítorí mo ní ìrètí pé
  rationale: ‘Nítorí’ fi ìdí tí Pọ́ọ̀lù fi ṣe ìbéèrè náà hàn, ‘mo ní ìrètí pé’ sì mú ohun tí ó ń retí wọlé.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: nípasẹ̀ àdúrà yín
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ oníran ìní ń tọ́ka sí ọ̀nà tàbí ohun èlò; ‘nípasẹ̀’ pa ìtumọ̀ yẹn mọ́ láìsọ pé àdúrà fúnra rẹ̀ ni olùṣe.
- source_word: χαρισθήσομαι
  choice: a ó fi mí fún
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú aláìṣe-taara ni; ìtumọ̀ yìí pa Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí ẹni tí a ó fi fún wọn, láìfi ‘dásílẹ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà. Àlàyé ìsàlẹ̀ ṣàfihàn ìmọ̀lára fífún lọ́fẹ̀ẹ́ tàbí pẹ̀lú inú rere inú ọ̀rọ̀ náà.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó tọ́ka sí àwọn olùgbà lẹ́tà gẹ́gẹ́ bí àwọn ẹni tí a retí pé a ó fi Pọ́ọ̀lù fún.
theological_decisions:
- issue: Ìtumọ̀ χαρισθήσομαι àti ẹni tí ó ń ṣe iṣẹ́ náà
  choice: a ó fi mí fún yín
  alternative: Ọlọ́run yóò fi inú rere dá mi padà sọ́dọ̀ yín
  rationale: Fọ́ọ̀mù aláìṣe-taara lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe tí a kò dárúkọ, ó sì ní ìmọ̀lára oore tàbí fífún lọ́fẹ̀ẹ́. Síbẹ̀, ẹsẹ̀ náà kò dárúkọ Ọlọ́run tàbí sọ ‘dá padà’ ní tààrà, nítorí náà a kò fi àwọn ọ̀rọ̀ wọ̀nyẹn sínú àyọkà pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ títọ́, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘A ó fi mí fún yín’ mọ̀ọ́mọ̀ pa ìṣe aláìṣe-taara àti àìdárúkọ olùṣe mọ́; àlàyé ìsàlẹ̀ ló ṣàlàyé ààyè ìtumọ̀ ọ̀rọ̀ náà.
