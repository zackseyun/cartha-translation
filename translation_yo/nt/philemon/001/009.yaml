  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: yo
  text: Nítorí ìfẹ́[a], kàkà bẹ́ẹ̀ mo bẹ̀ ọ́—gẹ́gẹ́ bí ẹni tí mo jẹ́, èmi Pọ́ọ̀lù, arúgbó kan[b], àti ní ìsinsìnyí pẹ̀lú, ẹlẹ́wọ̀n Mèsáyà Jésù[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìfẹ́ náà ni mo fi kúkú bẹ̀ ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Pọ́ọ̀lù, aṣojú kan”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “arúgbó” lọ́nà tó ṣeé ṣe jù.
    reason: alternative_reading
  - marker: c
    text: 'Gíríìkì: “Kristi Jésù.” A tú Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: Nítorí ìfẹ́
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń fi ìdí tàbí ohun tó fa nǹkan hàn. “Nítorí ìfẹ́” jẹ́ Yorùbá àdánidá tó sì pa agbára ìtumọ̀ náà mọ́.
- source_word: μᾶλλον παρακαλῶ
  choice: kàkà bẹ́ẹ̀, mo kúkú fi ẹ̀bẹ̀ bẹ̀ ọ́
  rationale: μᾶλλον fi ìyàtọ̀ hàn láàárín àṣẹ tí Pọ́ọ̀lù lè pa ní ẹsẹ 8 àti ẹ̀bẹ̀ tí ó yàn láti bẹ̀. “Fi ẹ̀bẹ̀ bẹ̀” sọ παρακαλῶ ní ọ̀nà àdánidá, “kàkà bẹ́ẹ̀” àti “kúkú” sì mú ìfiwéra náà jáde.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: ẹni tí mo jẹ́ yìí, Pọ́ọ̀lù
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì ń tọ́ka sí ẹni tó ń sọ̀rọ̀. Ìtumọ̀ yìí pa ìtọ́ka ara ẹni àti àpèjúwe tó tẹ̀ lé mọ́ láì mú kí Yorùbá korò.
- source_word: πρεσβύτης
  choice: arúgbó kan
  rationale: Ìtumọ̀ ọ̀rọ̀ náà tó ṣeé ṣe jù ni ọkùnrin tó ti dàgbà, kì í ṣe ipò alàgbà ìjọ. “Arúgbó kan” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere nípa ọjọ́-orí.
- source_word: νυνὶ δὲ καὶ
  choice: àti nísinsìnyí pẹ̀lú
  rationale: Gbólóhùn yìí fi àpèjúwe mìíràn kún ti Pọ́ọ̀lù, ó sì tẹnu mọ́ àkókò ìsinsìnyí.
- source_word: δέσμιος
  choice: ẹlẹ́wọ̀n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a fi sẹ́wọ̀n. “Ẹlẹ́wọ̀n” ni ìtumọ̀ Yorùbá tó tààrà jù.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ṣi ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níbí. “Mèsáyà” mú ìtumọ̀ oyè náà hàn, bí genitive náà ṣe ń sọ ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú Jésù láì pinnu ju bó ṣe yẹ lọ bóyá ó jẹ́ ohun-ìní, iṣẹ́, tàbí ìdí ìsopọ̀ rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πρεσβύτης
  choice: Pọ́ọ̀lù ń pe ara rẹ̀ ní arúgbó.
  alternative: Aṣojú; tàbí alàgbà.
  rationale: πρεσβύτης túmọ̀ sí arúgbó ní ti àdánidá; ọ̀rọ̀ Gíríìkì fún “aṣojú” yàtọ̀, kò sì sí ìdí tó lágbára láti sọ ọ́ di ipò ìjọ níbí.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú Χριστοῦ Ἰησοῦ, agbára orúkọ oyè náà ṣì ṣe pàtàkì. “Mèsáyà” mú un hàn gbangba; àkọsílẹ̀ ìsàlẹ̀ sì pa “Kristi” mọ́ gẹ́gẹ́ bí àṣàyàn ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá. “Mo kúkú fi ẹ̀bẹ̀ bẹ̀ ọ́” jẹ́ ọ̀nà tí òǹkàwé òde òní lè lóye, ó sì pa ìyàtọ̀ láàárín àṣẹ àti ẹ̀bẹ̀ mọ́. Àmì gígùn ní òpin pa ìsopọ̀ gírámà mọ́ sí ẹsẹ tó tẹ̀ lé.
