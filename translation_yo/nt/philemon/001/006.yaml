revisions:
- from: kí ìdàpọ̀ tí ó wá láti inú ìgbàgbọ́ rẹ lè di alágbára nípa mímọ gbogbo ohun rere tí ó wà nínú wa fún Mèsáyà[a][b][c][d][e].
  to: kí àjọpín ìgbàgbọ́ rẹ lè di ohun tí ó ní ipa nípasẹ̀ ìmọ̀ gbogbo ohun rere tí ó wà nínú wa fún Mèsáyà[a][b][c][d][e].
  rationale: The revision uses àjọpín (‘sharing/participation’) as a suitable, modern Yoruba rendering that does not impose a single interpretation of κοινωνία. It corrects the effective/active sense of ἐνεργὴς γένηται, represents ἐπίγνωσις with ìmọ̀, preserves “nínú wa,” and keeps the difficult final εἰς Χριστόν phrase and its alternative visible in a non-dogmatic note.
  reviewer_model: gpt-5.6-terra
