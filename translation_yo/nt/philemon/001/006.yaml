id: PHM.1.6
reference: Philemon 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: yo
  text: kí àjọpín ìgbàgbọ́ rẹ lè di ohun tí ó ní ipa nípasẹ̀ ìmọ̀ gbogbo ohun rere tí ó wà nínú wa fún Mèsáyà[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “ìfọwọ́sowọ́pọ̀ nínú ìgbàgbọ́ rẹ” tàbí “ìbáṣepọ̀ nínú ìgbàgbọ́ rẹ.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “ìgbàgbọ́” tún lè túmọ̀ sí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé” ní àwọn àyíká ọ̀rọ̀ kan.
    reason: alternative_reading
  - marker: c
    text: Àwọn àfọwọ́kọ kan ní “nínú rẹ” dípò “nínú wa.”
    reason: textual_variant
  - marker: d
    text: Ó tún lè jẹ́, “fún Kristi.” A túmọ̀ oyè Χριστός sí “Mèsáyà” níbí.
    reason: lexical_alternative
  - marker: e
    text: A tún lè túmọ̀ apá ìkẹyìn náà sí “gbogbo ohun rere tí ó wà nínú wa, sí Mèsáyà.” Ìbáṣepọ̀ “sí/fún Mèsáyà” pẹ̀lú àwọn ọ̀rọ̀ tó ṣáájú kò dájú pátápátá.
    reason: previous_rendering
lexical_decisions:
- source_word: ὅπως
  choice: kí
  rationale: Ó ṣe àfihàn ète àdúrà Pọ́ọ̀lù ní Yorùbá àdánidá.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: ìdàpọ̀ tí ó wá láti inú ìgbàgbọ́ rẹ
  rationale: κοινωνία lè túmọ̀ sí ìdàpọ̀, àjọpín, tàbí ìfọwọ́sowọ́pọ̀. Àyànfẹ́ yìí pa ìtumọ̀ àjọṣepọ̀ mọ́ láì fi dandan sọ ọ́ di wíwàásù ìgbàgbọ́.
- source_word: πίστεώς
  choice: ìgbàgbọ́
  rationale: Ìgbàgbọ́ ni ìtumọ̀ tó wọ́pọ̀ jù ní àyíká ọ̀rọ̀ yìí; ìṣòótọ́ tàbí ìgbẹ́kẹ̀lé ṣì ṣeé ṣe gẹ́gẹ́ bí àṣàyàn.
- source_word: ἐνεργὴς γένηται
  choice: lè di alágbára
  rationale: Ó mú èrò ohun tí ń di èyí tí ń ṣiṣẹ́ tàbí tí ń ní ipa jáde ní Yorùbá tó ṣeé lóye.
- source_word: ἐν ἐπιγνώσει
  choice: nípa mímọ
  rationale: Ní àyíká yìí ἐν lè ṣàfihàn ọ̀nà tí ìdàpọ̀ náà fi ń ní ipa; mímọ tún lè ní ìtumọ̀ ìmọ̀ kíkún tàbí ìdánimọ̀ jinlẹ̀.
- source_word: παντὸς ἀγαθοῦ
  choice: gbogbo ohun rere
  rationale: Ó túmọ̀ neuter singular náà ní ti ara láì fi ọ̀rọ̀ bí ‘ẹ̀bùn’ kún un.
- source_word: τοῦ ἐν ἡμῖν
  choice: tí ó wà nínú wa
  rationale: Ó tẹ̀ lé ọ̀rọ̀ SBLGNT ἡμῖν, ó sì so gbólóhùn náà mọ́ ‘gbogbo ohun rere.’
- source_word: εἰς Χριστόν
  choice: fún Mèsáyà
  rationale: εἰς níbí ṣòro, ṣùgbọ́n ‘fún’ pa ìtọ́kasí tàbí ìdarí sí Mèsáyà mọ́ láì túmọ̀ rẹ̀ ju bí ó ti yẹ lọ; Χριστός jẹ́ oyè Mèsáyà.
theological_decisions:
- issue: Ìtumọ̀ κοινωνία τῆς πίστεώς σου
  choice: ìdàpọ̀ tí ó wá láti inú ìgbàgbọ́ rẹ
  alternative: àjọpín ìgbàgbọ́ rẹ; ìfọwọ́sowọ́pọ̀ nínú ìgbàgbọ́ rẹ
  rationale: Gbólóhùn Gíríìkì náà ní àìdánilójú gidi. Àkọ́kọ́ ọrọ̀ pa ìtumọ̀ àjọṣepọ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ àjọpín mọ́ láì yan ẹ̀kọ́ ìsìn kan ṣoṣo.
- issue: Ìtọ́kasí ἐν ἡμῖν
  choice: ‘nínú wa,’ tó lè tọ́ka sí Pọ́ọ̀lù, Fílémónì, àti àwọn onígbàgbọ́ mìíràn lápapọ̀
  alternative: àwọn àfọwọ́kọ kan ní ‘nínú rẹ’
  rationale: Ọ̀rọ̀ Gíríìkì tí a fún wa ní ἡμῖν, nítorí náà a pa ‘wa’ mọ́, a sì darúkọ àyípadà àfọwọ́kọ ní àlàyé.
- issue: Ìbáṣepọ̀ εἰς Χριστόν pẹ̀lú gbólóhùn tó ṣáájú
  choice: ‘fún Mèsáyà,’ ní ìsopọ̀ pẹ̀lú gbogbo ohun rere tí ó wà nínú wa
  alternative: ‘sí Mèsáyà’ tàbí kí a so ó mọ́ bí ìdàpọ̀ náà ṣe ń di alágbára
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì fi àìdánilójú sílẹ̀; ìtumọ̀ àkọ́kọ́ jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n àlàyé pa àṣàyàn míì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ìdàpọ̀’ jẹ́ ọ̀rọ̀ tí olùkà lásán lè lóye, ó sì pa àìdánilójú κοινωνία mọ́. ‘Mèsáyà’ ni a lò fún oyè Χριστός, nígbà tí ‘Kristi’ wà nínú àlàyé gẹ́gẹ́ bí àṣàyàn tí a mọ̀ dáadáa.
