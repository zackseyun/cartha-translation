  text: Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: yo
  text: Máàkù, Àrísítákù, Démásì àti Lúùkù, àwọn alábàáṣiṣẹ́ mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: Máàkù
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
- source_word: Ἀρίσταρχος
  choice: Àrísítákù
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà ní ọ̀nà tí ó bá ìró àti ìkọ̀wé Yorùbá mu.
- source_word: Δημᾶς
  choice: Démásì
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ọ̀nà tí ó ṣeé kà ní Yorùbá, láì túmọ̀ orúkọ náà.
- source_word: Λουκᾶς
  choice: Lúùkù
  rationale: Ọ̀nà Yorùbá tí ó wọ́pọ̀ fún àkọsílẹ̀ orúkọ Λουκᾶς.
- source_word: οἱ συνεργοί
  choice: àwọn alábàáṣiṣẹ́
  rationale: Ọ̀rọ̀ συνεργός ń tọ́ka sí àwọn tí ń ṣiṣẹ́ pọ̀ pẹ̀lú ẹlòmíràn; “àwọn alábàáṣiṣẹ́” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìfọwọ́sowọ́pọ̀ mọ́.
- source_word: μου
  choice: mi
  rationale: Arọ́pò-orúkọ olódùmarè ẹni àkọ́kọ́ nínú ìṣàpẹẹrẹ ìní tàbí ìbáṣepọ̀, tó ń fi hàn pé àwọn ẹni tí a dárúkọ jẹ́ alábàáṣiṣẹ́ Pọ́ọ̀lù.
