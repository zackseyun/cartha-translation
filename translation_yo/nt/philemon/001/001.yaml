source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: yo
  text: Pọ́ọ̀lù[a], ẹlẹ́wọ̀n Mèsáyà Jésù, àti Tímótì arákùnrin wa, sí Fílémónì, olùfẹ́ wa àti alábáṣiṣẹ́pọ̀ wa,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Pọ́ọ̀lù, ẹlẹ́wọ̀n nítorí Mèsáyà Jésù.” Ọ̀nà tí Gíríìkì gbà so àwọn ọ̀rọ̀ náà pọ̀ lè tọ́ka sí ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú Mèsáyà Jésù tàbí pé iṣẹ́ rẹ̀ fún un ló fa ìṣẹ̀wọ̀n rẹ̀.
    reason: alternative_reading
  - marker: b
    text: Nínú Gíríìkì, ọ̀rọ̀ náà ni Χριστός (“Kristi”); a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Àkọsílẹ̀ orúkọ Παῦλος ní ìbámu pẹ̀lú bí Yorùbá ṣe ń pe orúkọ náà.
- source_word: δέσμιος
  choice: ẹlẹ́wọ̀n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a dè tàbí tí ó wà ní ẹ̀wọ̀n; “ẹlẹ́wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá adayébá tí ó ṣe kedere.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ti Mèsáyà Jésù
  rationale: Ìtumọ̀ oníhun “ti” pa ìsopọ̀ genitive Gíríìkì mọ́ láì fi dandan pinnu bóyá ó túmọ̀ sí ìní, ìbáṣepọ̀, tàbí ohun tó fa ìṣẹ̀wọ̀n; Χριστός jẹ́ oyè níbí, nítorí náà “Mèsáyà” ni a lò.
- source_word: Τιμόθεος ὁ ἀδελφὸς
  choice: Tímótì arákùnrin wa
  rationale: “Arákùnrin wa” fi ìbáṣepọ̀ ìdílé àwọn onígbàgbọ́ hàn lọ́nà Yorùbá tí ó wọ́pọ̀, bí ó tilẹ̀ jẹ́ pé Gíríìkì ní “arákùnrin náà.”
- source_word: Φιλήμονι
  choice: sí Fílémónì
  rationale: Dative olùgbà lẹ́tà ni a túmọ̀ pẹ̀lú “sí,” gẹ́gẹ́ bí ìkíni lẹ́tà Yorùbá.
- source_word: τῷ ἀγαπητῷ
  choice: olùfẹ́ wa
  rationale: Ó pa ìfẹ́ jíjinlẹ̀ tí ἀγαπητός ń sọ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá adayébá.
- source_word: συνεργῷ ἡμῶν
  choice: alábáṣiṣẹ́pọ̀ wa
  rationale: Ọ̀rọ̀ yìí sọ ẹni tí ó ń ṣiṣẹ́ pọ̀ pẹ̀lú àwọn olùkọ̀wé; “alábáṣiṣẹ́pọ̀” ṣe àfihàn ìṣiṣẹ́ papọ̀ ju “alájọṣepọ̀” lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ìkíni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ní agbára oyè ẹni tí a yàn níbí, kì í ṣe orúkọ ìdílé lásán; “Mèsáyà” mú ìtumọ̀ oyè náà jáde.
- issue: Ìtumọ̀ genitive Χριστοῦ Ἰησοῦ lẹ́yìn δέσμιος
  choice: ẹlẹ́wọ̀n ti Mèsáyà Jésù
  alternative: ẹlẹ́wọ̀n nítorí Mèsáyà Jésù
  rationale: “Ti” pa àìdánilójú Gíríìkì mọ́ láàárín ìbáṣepọ̀ pẹ̀lú Jésù àti pé iṣẹ́ rẹ̀ fún Jésù ló fa ìṣẹ̀wọ̀n; àlàyé ẹsẹ̀ ìsàlẹ̀ sọ àṣàyàn kejì.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtẹ̀sí lẹ́tà Gíríìkì ni a pa mọ́, ṣùgbọ́n a ṣètò rẹ̀ lọ́nà tí ó ṣe adayébá ní Yorùbá.
