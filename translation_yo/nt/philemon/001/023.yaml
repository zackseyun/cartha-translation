source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: yo
  text: Ẹ̀páfírà, ẹni tí a jọ jẹ́ ẹlẹ́wọ̀n nínú Mèsáyà Jésù[a], ń kí ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ìbílẹ̀, “nínú Kristi Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: ń kí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kíkí ẹnì kan tàbí fífi ìkíni ránṣẹ́ sí i; “ń kí” jẹ́ ọ̀nà àdánidá àti ṣókí ní Yorùbá.
- source_word: σε
  choice: ọ
  rationale: Arọ́pò-orúkọ ẹni kejì ẹyọ ni, ó sì tọ́ka sí Fílémónì ní tààrà.
- source_word: Ἐπαφρᾶς
  choice: Ẹ̀páfírà
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró àti àkọtọ Yorùbá.
- source_word: ὁ συναιχμάλωτός μου
  choice: ẹni tí a jọ wà lẹ́wọ̀n
  rationale: Ìtumọ̀ rẹ̀ ni ẹni tí òǹkọ̀wé àti òun jọ jẹ́ ẹlẹ́wọ̀n; gbólóhùn yìí jẹ́ kedere, ó sì dára lórí etí ní Yorùbá.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èdè Páùlù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́, dípò yíyí rẹ̀ sí “nítorí”; “Mèsáyà” sì fi iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn.
theological_decisions:
- issue: Bí a ṣe máa tú Χριστῷ nínú gbólóhùn Páùlù ἐν Χριστῷ Ἰησοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ṣì ní agbára gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run, nítorí náà “Mèsáyà” ni a lò; a fi “Kristi” sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹni tí a jọ wà lẹ́wọ̀n” láti yẹra fún ọ̀rọ̀ àkójọpọ̀ tí kò ní dùn lórí etí, a sì pa “nínú” mọ́ nítorí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn Gíríìkì.
