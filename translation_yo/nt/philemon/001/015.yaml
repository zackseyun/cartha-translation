  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: τάχα jẹ́ ‘bóyá,’ πρὸς ὥραν jẹ́ ‘fún ìgbà díẹ̀,’ ἵνα jẹ́ ‘kí,’ àti ìtakora àárín àkókò kúkúrú àti ohun tí ó wà títí ni a pa mọ́. Ṣùgbọ́n ‘a fi yà á kúrò’ ń fi ‘fún ìdí èyí’ hàn bí ìrọ̀rùn àlàyé ti a fi ṣe ìyapa náà, níbi tí διὰ τοῦτο nínú ìṣọ̀kan ọ̀rọ̀ yìí dára jù lọ gẹ́gẹ́ bí ‘nítorí ìdí yìí’—ìdí tí ìyapa náà fi ṣẹlẹ̀. ‘A yà á kúrò’ tún pa ìṣe aláìṣe-pàtó ti ἐχωρίσθη mọ́ láì ṣàfikún ‘fi.’'
