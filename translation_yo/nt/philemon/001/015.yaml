  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: yo
  text: Nítorí bóyá nítorí ìdí yìí ni a yà á kúrò lọ́dọ̀ rẹ fún ìgbà díẹ̀, kí ìwọ lè ní i padà títí láé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kúrò lọ́dọ̀ rẹ fún ìgbà díẹ̀.” Ọ̀rọ̀ Gíríìkì náà wà ní ìṣe aláìṣe-pàtó, “a yà á kúrò”; ó lè jẹ́ ọ̀nà pẹ̀lẹ́ láti má ṣe dá ẹ̀bi lé ẹnikẹ́ni ní tààrà, ó sì tún lè fi àyè sílẹ̀ fún ète Ọlọ́run tí a kò dárúkọ.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: bóyá
  rationale: Ó pa ìfọ̀rọ̀ṣọ̀rọ̀ onírẹ̀lẹ̀ àti àìdánilójú tí Pọ́ọ̀lù lò mọ́, láì sọ ìrònú rẹ̀ di ohun tó dájú.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé inú ẹsẹ tó ṣáájú, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe ń ṣe.
- source_word: διὰ τοῦτο
  choice: fún ìdí èyí
  rationale: Ó fi agbára ọ̀rọ̀ tó ń tọ́ka sí ìdí tàbí ète hàn ní kedere.
- source_word: ἐχωρίσθη
  choice: a fi yà á kúrò lọ́dọ̀ rẹ
  rationale: Ìsọ̀rọ̀ aláìdárúkọ olùṣe yìí pa ìṣe àìṣe-pàtó inú ọ̀rọ̀ Gíríìkì mọ́; kò sọ pé Ọlọ́run tàbí Onesimu fúnra rẹ̀ ni ó ṣe é.
- source_word: πρὸς ὥραν
  choice: fún ìgbà díẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àkókò kúkúrú, kì í ṣe wákàtí kan ní ti gidi, ó sì ṣe ìyàtọ̀ sí ‘títí láé.’
- source_word: ἵνα
  choice: kí
  rationale: Ó fi ète tàbí àbájáde tí a ń retí hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: αἰώνιον
  choice: títí láé
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ bí àpèjúwe àkókò, ó sì tako ìyapa ‘fún ìgbà díẹ̀’ pẹ̀lú ìdápadà tó wà pẹ́ títí.
- source_word: αὐτὸν
  choice: á
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Onesimu gẹ́gẹ́ bí ẹni tí a yà kúrò tí a sì ní padà.
- source_word: ἀπέχῃς
  choice: kí ìwọ lè ní i padà
  rationale: Ó mú ìtumọ̀ jíjẹ́ kí Filemoni gba Onesimu padà, kí ó sì tún ní ìbáṣepọ̀ pẹ̀lú rẹ̀, jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ta ni ó ṣe ìyapa tí ọ̀rọ̀ àìṣe-pàtó ἐχωρίσθη ń tọ́ka sí?
  choice: A lo ‘a fi yà á kúrò’ láì dárúkọ Ọlọ́run tàbí Onesimu gẹ́gẹ́ bí olùṣe.
  alternative: ‘Ó kúrò lọ́dọ̀ rẹ’ tàbí ‘Ọlọ́run yà á kúrò lọ́dọ̀ rẹ.’
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù lè dín ẹ̀bi Onesimu kù, ó sì tún lè fi àyè sílẹ̀ fún ìṣètò Ọlọ́run láì sọ ọ́ ní tààrà. Ìtumọ̀ náà pa àìṣe-pàtó àti ìfọ̀rọ̀ṣọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó mọ́, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘A fi yà á kúrò’ jẹ́ ìsọ̀rọ̀ aláìdárúkọ olùṣe tó pa àìṣe-pàtó Gíríìkì mọ́; ‘ní i padà’ sì jẹ́ ọ̀rọ̀ àdánidá fún gbígba ẹni náà padà sínú ìbáṣepọ̀.
