  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: yo
  text: Ṣùgbọ́n láìsí ìfọwọ́sílẹ̀ rẹ, èmi kò fẹ́ ṣe ohunkóhun[a], kí ohun rere rẹ[b] má bàa dà bí ẹni pé a fipá ṣe é, ṣùgbọ́n kí ó jẹ́ ti atinuwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìsí ìtẹ́wọ́gbà rẹ” tàbí “láìgbọ́ èrò rẹ.”
    reason: lexical_alternative
  - marker: b
    text: “Ohun rere rẹ” tún lè túmọ̀ sí “ìwà rere rẹ” tàbí “inú rere rẹ”; Gíríìkì lè tọ́ka sí ohun rere kan tí Fílémónì yóò ṣe nínú ọ̀ràn yìí, tàbí sí ìwà rere rẹ lápapọ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ṣùgbọ́n ní ìbámu pẹ̀lú ohun tí ó jẹ́ ti atinuwa”; ìyẹn ni pé, “láti inú ìfẹ́ tirẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: láìsí ìfọ̀wọ́sí rẹ
  rationale: γνώμη lè túmọ̀ sí èrò, ìdájọ́, ète, tàbí ìfọ̀wọ́sí. Nínú ọ̀rọ̀ yìí, ìfọ̀wọ́sí fi hàn pé Pọ́ọ̀lù kò fẹ́ gbé ìgbésẹ̀ láìjẹ́ pé Fílémónì fọwọ́ sí i.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: èmi kò fẹ́ ṣe ohunkóhun
  rationale: θέλω ń sọ nípa ìfẹ́ tàbí ohun tí ẹni pinnu láti ṣe; gbolohun yìí pa ìtumọ̀ ìfẹ́ ara ẹni mọ́ láìsọ ọ́ di àṣẹ tàbí ìpinnu líle.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tí ἵνα μὴ ń tọ́ka sí hàn.
- source_word: ὡς κατὰ ἀνάγκην
  choice: bí èyí tí a fi ipá mú ọ ṣe
  rationale: ἀνάγκη níbí ń tọ́ka sí ìfipámúni tàbí ìkápá; “bí” pa ìrọ̀rùn tí ὡς mú wá mọ́, kì í sì í sọ pé a ti fi ipá mú Fílémónì ní tòótọ́.
- source_word: τὸ ἀγαθόν σου
  choice: iṣẹ́ rere rẹ
  rationale: Ọ̀rọ̀ ajẹtífù aláìlábùdá tí a lò gẹ́gẹ́ bí orúkọ yìí lè tọ́ka sí ohun rere kan tí Fílémónì yóò ṣe, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí ìwà rere tàbí inú rere rẹ.
- source_word: ᾖ
  choice: má bàa dà bí
  rationale: Ìṣètò yìí bá subjunctive lẹ́yìn ἵνα mu ní Yorùbá, ó sì pa ìtumọ̀ ète mọ́.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: bí kò ṣe èyí tí o fi ìfẹ́ inú rẹ ṣe
  rationale: ἑκούσιον tọ́ka sí ohun tí ènìyàn ṣe tinútinú, láti inú ìfẹ́ tirẹ̀, kì í ṣe nítorí ìfipámúni.
theological_decisions:
- issue: Irú ìdáhùn tí Pọ́ọ̀lù ń fẹ́ lọ́wọ́ Fílémónì
  choice: A fi ìdáhùn náà hàn gẹ́gẹ́ bí iṣẹ́ rere tí Fílémónì yóò ṣe láti inú ìfẹ́ tirẹ̀, kì í ṣe nítorí ìfipámúni.
  alternative: A lè tú τὸ ἀγαθόν σου ní ọ̀nà àfojúrí síi gẹ́gẹ́ bí “ìwà rere rẹ” tàbí “inú rere rẹ.”
  rationale: Ẹsẹ náà tẹnu mọ́ pé kí ìdáhùn Fílémónì jẹ́ ti tinútinú, kì í ṣe èyí tí a fi ipá mú un ṣe. Nítorí Gíríìkì kò sọ iṣẹ́ náà ní pàtó, a kò fi ẹ̀kọ́ ìsìn tàbí iṣẹ́ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. “Èmi” fi ìtẹnumọ́ Pọ́ọ̀lù hàn, “má bàa dà bí” sì pa ìyàtọ̀ tí ὡς ń mú wá mọ́.
