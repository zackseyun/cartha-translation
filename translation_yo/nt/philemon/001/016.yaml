  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ Gíríìkì mọ́: Onesimu kì í ṣe ẹrú mọ́ nìkan, ṣùgbọ́n ó ti di arákùnrin ẹni-ìfẹ́; ìfiwéra sí Filemoni àti ìfarakànra ‘nípa ti ara’/‘nínú Olúwa’ wà níbẹ̀. Bí ó ti wù kí ó rí, ‘mélòómélòó ni yóò tilẹ̀ jẹ́ sí ọ’ kò fi πόσῳ ... μᾶλλον hàn ní Yorùbá àdánidá, ó sì dà bí ohun tó ń ṣẹlẹ̀ lọ́jọ́ iwájú.'
  naturalness: A tún ọ̀rọ̀ náà ṣe kí ìbéèrè-àfiwéra náà lè dun bí Yorùbá ìgbàlódé. ‘Arákùnrin tí a fẹ́ràn’ yọ àìgbọ́kànlé kúrò nínú ‘arákùnrin olùfẹ́,’ èyí tí ó lè túmọ̀ sí arákùnrin tí ń fẹ́ràn ẹlòmíràn. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ (a), nítorí ‘ipò ìsìn’ lè tọ́ka sí ìjọsìn dípò ipò ìsọdọ.
  terminology: “Ẹrú” yẹ fún δοῦλος nínú àyíká Onesimu. “Nínú Olúwa” pa ἐν κυρίῳ mọ́, ‘nípa ti ara’ sì jẹ́ ìtumọ̀ tí ó ṣọ́ra fún ἐν σαρκί láì sọ ọ́ di ‘ẹ̀dá ẹlẹ́ṣẹ̀.’
