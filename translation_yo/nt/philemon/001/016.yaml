id: PHM.1.16
reference: Philemon 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: yo
  text: kì í ṣe gẹ́gẹ́ bí ẹrú mọ́[a], ṣùgbọ́n ó ju ẹrú lọ—arákùnrin tí a fẹ́ràn, pàápàá jù lọ fún mi. Ṣùgbọ́n mélòómélòó ni kò ní pọ̀ tó fún ọ[b], nípa ti ara àti nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gẹ́gẹ́ bí ìránṣẹ́” tàbí “gẹ́gẹ́ bí ẹrú tí a dè mọ́ iṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí onírúurú ipò ìsọdọ, ṣùgbọ́n níbí ó ṣeé ṣe kí ó tọ́ka sí ipò Onesimu gẹ́gẹ́ bí ẹni tí a dè mọ́ ẹlòmíràn.
    reason: alternative_reading
  - marker: b
    text: “Nípa ti ara” níbí lè túmọ̀ sí nínú ìbátan ayé tàbí ti àwùjọ, tàbí ní ojúkojú; kò túmọ̀ sí “ẹ̀dá ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: kì í ṣe gẹ́gẹ́ bí ẹrú mọ́
  rationale: Ó fi ìyípadà kúrò nínú ipò ìṣáájú hàn, ó sì pa ìtumọ̀ ipò ìdè tí δοῦλος ní nínú àyíká lẹ́tà náà mọ́.
- source_word: ὑπὲρ δοῦλον
  choice: ó ju ẹrú lọ
  rationale: ὑπέρ ń tọ́ka sí ipò tàbí iye tí ó ga ju ti ẹrú lọ; ọ̀rọ̀ yìí ṣe àfihàn ìfiwéra náà ní Yorùbá àdánidá.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: arákùnrin olùfẹ́
  rationale: Ó pa àwòrán ìbátan inú ìdílé àwọn onígbàgbọ́ àti ìfẹ́ tí ἀγαπητός ń sọ mọ́.
- source_word: μάλιστα ἐμοί
  choice: pàápàá jù lọ sí mi
  rationale: Ó mú ìtẹnumọ́ ìwọ̀n pàtàkì tí μάλιστα ní jáde.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: ṣùgbọ́n mélòómélòó ni yóò tilẹ̀ jẹ́ sí ọ
  rationale: Ó pa agbára ìbéèrè àfiwé ọ̀rọ̀ Gíríìkì mọ́, bí Paulu ṣe ń gbé ìbátan Filemoni ga ju tirẹ̀ lọ.
- source_word: ἐν σαρκὶ
  choice: nípa ti ara
  rationale: Ó pa ọ̀rọ̀ Paulu mọ́ láì túmọ̀ σάρξ sí ẹ̀dá ẹlẹ́ṣẹ̀; níbí ó lè tọ́ka sí ìbátan ayé, ti àwùjọ, tàbí ti ojúkojú.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Paulu nípa ìbátan tàbí ìṣọ̀kan nínú Olúwa mọ́ láì fi àlàyé ẹ̀kọ́ kan kún un.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ọ̀ràn Onesimu
  choice: ẹrú
  alternative: ìránṣẹ́; ẹrú tí a dè mọ́ iṣẹ́
  rationale: Àyíká lẹ́tà náà mú ipò àwùjọ tí a fi dè Onesimu ṣe pàtàkì. “Ẹrú” jẹ́ kí ìyàtọ̀ inú “ó ju ẹrú lọ” ní agbára rẹ̀.
- issue: Ìtumọ̀ ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: nípa ti ara àti nínú Olúwa
  alternative: ní ojúkojú àti nínú Olúwa; nínú ìbátan ayé àti nínú Olúwa
  rationale: Ọ̀rọ̀ náà ṣeé ṣe kí ó fi ìbátan ènìyàn tàbí ti àwùjọ wé ìbátan Kristẹni. A pa àìdánilójú àti ìṣòro ẹ̀kọ́ inú ọ̀rọ̀ Paulu mọ́ dípò yíyan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá àjọṣe tí ó ní iyì, tí ó sì yé òǹkàwé òde òní. A lo “ẹrú” láti sọ ipò àwùjọ náà ní kedere; a sì pa “nípa ti ara” àti “nínú Olúwa” mọ́ láti dáàbò bo ìfọ̀rọ̀wérọ̀ àti àìdánilójú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
