  verdict: revise
  source_fidelity: '‘Nítorí ọmọ mi’ can mean ‘for/on behalf of my child,’ whereas περὶ τοῦ ἐμοῦ τέκνου most directly introduces the topic: ‘concerning my child.’ Replacing it with ‘nípa ọmọ mi’ preserves that scope. The begetting metaphor and the concrete image of bonds are otherwise retained.'
  naturalness: The revised wording is idiomatic modern Standard Yoruba. ‘Mo bẹ̀ ọ́ nípa ...’ maintains the personal, earnest epistolary appeal, and tonal spelling of the personal name is supplied.
  terminology: ‘Ọmọ mi’ appropriately carries τέκνον’s affectionate metaphor without forcing ‘son.’ ‘Mo bí’ retains the source’s birth/begetting metaphor, while ‘ẹ̀wọ̀n mi’ keeps the bonds/chains image and can naturally carry its imprisoning context.
  issues:
  - severity: medium
    issue: ‘nítorí ọmọ mi’ shifts the relation expressed by περί.
    rationale: In this context, nítorí normally presents the basis or beneficiary of the appeal (‘because of/for my child’), while the Greek says that Onesimus is the subject concerning whom Paul appeals. ‘Nípa ọmọ mi’ is the closer Yoruba equivalent.
  - severity: low
    issue: The personal name lacks its customary Yoruba tonal spelling.
    rationale: ‘Onésímù’ is the conventional fully marked Yoruba form and better follows the requested orthographic variant.
