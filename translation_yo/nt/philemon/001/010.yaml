source:
  edition: SBLGNT
  text: παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς ⸀δεσμοῖς Ὀνήσιμον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: yo
  text: Mo bẹ̀ ọ́ nípa ọmọ mi[a], Onésímù, ẹni tí mo bí nínú ẹ̀wọ̀n mi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè tún túmọ̀ ọ̀rọ̀ náà sí, “ọmọ mi tí mo di baba fún nígbà tí mo wà lẹ́wọ̀n.” Ọ̀rọ̀ Gíríìkì lo àpèjúwe ìbímọ̀ láti sọ ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú Onésímù nípa ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: “Nínú ẹ̀wọ̀n mi” lè tún túmọ̀ sí “nígbà tí mo wà lẹ́wọ̀n”; Gíríìkì pa àwòrán ìdè mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Mo bẹ̀ ọ́
  rationale: Ó fi ẹ̀bẹ̀ àtọkànwá àti ti ìbáṣepọ̀ hàn, kì í ṣe àṣẹ líle tàbí ìbéèrè lásán.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: nítorí ọmọ mi
  rationale: Ní àyíká ẹ̀bẹ̀ yìí, ‘nítorí’ ń sọ ẹni tí Pọ́ọ̀lù ń bẹ̀bẹ̀ fún lọ́nà àdánidá; ‘ọmọ mi’ pa ìfẹ́ àti ìbáṣepọ̀ ẹ̀mí tí τέκνον ń tọ́ka sí mọ́.
- source_word: ὃν ἐγέννησα
  choice: ẹni tí mo bí
  rationale: Ó pa àpèjúwe ìbímọ̀ inú γεννάω mọ́. Ní Yorùbá, ọkùnrin lè lo ‘mo bí ọmọ’ nípa jíjẹ́ baba, nítorí náà ó bá ohùn Pọ́ọ̀lù mu láìṣàlàyé àpèjúwe náà jù.
- source_word: ἐν τοῖς δεσμοῖς
  choice: nínú ẹ̀wọ̀n mi
  rationale: ‘Ẹ̀wọ̀n’ pa àwòrán ìdè tàbí ṣẹ́kẹ́ṣẹkẹ̀ mọ́, ó sì lè tọ́ka sí ipò ẹlẹ́wọ̀n; ‘mi’ jẹ́ àfikún àdánidá láti inú ọ̀rọ̀ ẹni àkọ́kọ́.
- source_word: Ὀνήσιμον
  choice: Onesimu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Irú ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú Onesimu
  choice: Pa àpèjúwe pé Pọ́ọ̀lù bí i mọ́ gẹ́gẹ́ bí ìbáṣepọ̀ ẹ̀mí.
  alternative: ẹni tí mo di baba fún nígbà tí mo wà lẹ́wọ̀n
  rationale: Gíríìkì fi àpèjúwe ìbímọ̀ hàn, ó sì lè túmọ̀ sí pé Onesimu wá sínú ìgbàgbọ́ nípasẹ̀ Pọ́ọ̀lù; ṣùgbọ́n kò sọ ìyípadà ẹ̀sìn ní tààrà, nítorí náà a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ sí i.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. ‘Mo bẹ̀ ọ́’ jẹ́ ti ara ẹni, ‘ẹni tí mo bí’ sì pa àpèjúwe orísun mọ́. Gbólóhùn náà parí pẹ̀lú àmì kọ́mà nítorí pé ẹsẹ tó tẹ̀ lé e ń bá ìrònú náà lọ.
