source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni, arákùnrin, jẹ́ kí n jàǹfààní lọ́dọ̀ rẹ nínú Olúwa[a]; tù ọkàn mi lára[b] nínú Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá yìí sí ‘jẹ́ kí n rí àǹfààní gbà lọ́dọ̀ rẹ’ tàbí ‘jẹ́ kí n ní ayọ̀ láti ọ̀dọ̀ rẹ.’ Ó ṣeé ṣe kí Pọ́ọ̀lù máa fi orúkọ Onẹ́símù ṣeré-ọ̀rọ̀, nítorí orúkọ náà ní í ṣe pẹ̀lú jíjẹ́ ẹni tí ó wúlò tàbí pẹ̀lú àǹfààní.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, èdè Gíríìkì ní ‘àwọn ẹ̀yà inú mi’; ó jẹ́ àkànlò èdè fún ìmọ̀lára jíjinlẹ̀ tàbí gbogbo inú ẹni.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé ‘nínú Kristi.’ ‘Mèsáyà’ fi ìtumọ̀ oyè Χριστός, ẹni tí a fi òróró yàn, hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ìfìdí ọ̀rọ̀ múlẹ̀ pẹ̀lú ẹ̀bẹ̀ onífẹ̀ẹ́; ‘Bẹ́ẹ̀ ni’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἀδελφέ
  choice: arákùnrin
  rationale: Ọ̀rọ̀ ìpè ẹnì kan ṣoṣo ni, tí Pọ́ọ̀lù fi ń pe Filẹ́mónì gẹ́gẹ́ bí arákùnrin nínú ìgbàgbọ́.
- source_word: ἐγώ σου ὀναίμην
  choice: jẹ́ kí n jèrè lọ́dọ̀ rẹ
  rationale: Ó pa ìtumọ̀ èrè tàbí àǹfààní mọ́, ó sì dá ìrísí ẹ̀bẹ̀ inú ọ̀rọ̀ optative náà sí. Ó tún fi ààyè sílẹ̀ fún eré-ọ̀rọ̀ tí ó ṣeé ṣe pẹ̀lú orúkọ Onẹ́símù.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí ohun tí ó ṣẹlẹ̀ lábẹ́ ìṣọ̀kan àti àṣẹ Olúwa.
- source_word: ἀνάπαυσόν
  choice: tu … lára
  rationale: Àṣẹ náà ń béèrè ìtura tàbí ìtùnú gidi; ‘tu … lára’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì bá ọ̀rọ̀ inú ẹsẹ̀ 7 mu.
- source_word: μου τὰ σπλάγχνα
  choice: ọkàn mi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn ẹ̀yà inú ní tààrà, ó dúró fún ìmọ̀lára jíjinlẹ̀ tàbí gbogbo inú ẹni; ‘ọkàn mi’ ni àdàkọ Yorùbá tó ṣe kedere.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè fún ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ nínú Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn. ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè náà hàn, nígbà tí ‘Kristi’ jẹ́ àkọsílẹ̀ ohùn Gíríìkì tí ó lè dà bí orúkọ lásán.
- issue: Ìtumọ̀ κυρίῳ
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa oyè ìbọ̀wọ̀ àti ìlò Pọ́ọ̀lù mọ́ láìfi àjọṣe ọ̀gá àti ẹrú sí iwájú ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. Gbólóhùn náà pa ìgbóná ẹ̀bẹ̀ Pọ́ọ̀lù àti ìṣòro ìtumọ̀ ὀναίμην mọ́, láì sọ ọ́ di èrè owó nìkan.
