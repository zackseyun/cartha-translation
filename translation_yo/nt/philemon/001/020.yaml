    rationale: Bí ó tilẹ̀ jẹ́ pé ó lè gba ìtumọ̀ ὀναίμην, ‘jàǹfààní lọ́dọ̀ rẹ’ jẹ́ àdánidá síi fún àǹfààní tí Pọ́ọ̀lù ń béèrè, láì fi èrè ìṣòwò ṣáájú.
