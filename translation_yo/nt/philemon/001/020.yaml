  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa: ìpè náà jẹ́ ti arákùnrin, ὀναίμην wà gẹ́gẹ́ bí ẹ̀bẹ̀ pé kí ẹni tó ń sọ jàǹfààní láti ọ̀dọ̀ Filẹ́mónì, àwọn gbólóhùn ‘nínú Olúwa’ àti ‘nínú Mèsáyà’ sì wà ní ipò tí wọ́n yẹ. ‘Ọkàn mi’ jẹ́ ìtumọ̀ àdánidá tó yẹ fún τὰ σπλάγχνα nínú àyíká yìí.'
  naturalness: 'A nílò àtúnṣe kékeré sí ‘tu ọkàn mi lára’: ọ̀rọ̀ ìṣe ‘tù’ ní àmì ohùn kékeré, ‘tù ọkàn mi lára’ sì jẹ́ ìlò Yorùbá tó dára. ‘Jẹ́ kí n jàǹfààní lọ́dọ̀ rẹ’ dín ìmọ̀ ‘èrè’ owó kù, ó sì ṣì pa èrò àǹfààní/ìrànlọ́wọ́ ti ọ̀rọ̀ náà mọ́.'
