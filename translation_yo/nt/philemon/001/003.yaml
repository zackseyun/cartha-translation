  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà wà fún yín láti ọ̀dọ̀ Ọlọ́run, Baba wa, àti Olúwa Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè, “Mèsáyà,” tàbí, ní àwọn àyíká kan, bí apá orúkọ, “Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ ìkíni lẹ́tà Paulu mọ́, ó sì tún ru èrò oore tí Ọlọ́run ń fi fúnni láìtọ́sí.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀ ènìyàn; “fún yín” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìbùkún tí a ń fẹ́ kí ó wà lórí àwọn olùgbọ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àlàáfíà, ó sì lè gba ìtumọ̀ ìkíni àti ìgbésí-ayé pípé tó bá ìró shalom mu.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn ní Yorùbá àdánidá.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Ó ka “Baba wa” gẹ́gẹ́ bí àfikún tó ń ṣàlàyé ẹni tí Ọlọ́run jẹ́, bí gírámà Gíríìkì ṣe tọ́ka sí.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” pa agbára ọlá àti ìtumọ̀ Kristọ́lójì ti κύριος mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” jẹ́ fọ́ọ̀mù orúkọ tó ti fìdí múlẹ̀ ní Yorùbá; “Mèsáyà” sọ ìtumọ̀ oyè Χριστός di mímọ̀ dípò lílo “Kristi” bí ẹni pé ó kan jẹ́ apá orúkọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός lè ṣiṣẹ́ bí oyè “Mèsáyà” tàbí bí ọ̀rọ̀ tó ti dà bí apá orúkọ. Nínú ìkíni Paulu yìí, “Mèsáyà” pa ìtumọ̀ oyè náà hàn; àlàyé ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ ìtumọ̀ mìíràn láìpa àìdánilójú ojúlówó rẹ́ run.
translation_notes:
  register: 'Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tó yẹ. A lo ìṣètò ìbùkún àdánidá “Kí ... wà fún yín,” nígbà tí a pa orísun méjèèjì mọ́: Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà.'
