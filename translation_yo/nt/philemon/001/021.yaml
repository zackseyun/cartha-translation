id: PHM.1.21
reference: Philemon 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: yo
  text: Ní ìgbẹ́kẹ̀lé nínú ìgbọ́ràn rẹ ni mo kọ̀wé sí ọ, ní mímọ̀ pé ìwọ yóò ṣe àní ju ohun tí mo ń sọ lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ju ohun tí mo ń sọ lọ.” Ó lè jẹ́ pé Paulu ń fi hàn pé Fílémọnì yóò ṣe ju ohun pàtó tí ó béèrè fún lọ, ṣùgbọ́n ẹsẹ yìí kò sọ ní pàtó ohun tí ìyẹn jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: mo ní ìgbẹ́kẹ̀lé
  rationale: Ọ̀rọ̀ náà jẹ́ participle perfect tí ó fi ipò ìgbẹ́kẹ̀lé tí ó ti fìdí múlẹ̀ hàn. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì jẹ́ kí ìgbẹ́kẹ̀lé Paulu ṣe ìpìlẹ̀ fún kíkọ rẹ̀.
- source_word: τῇ ὑπακοῇ σου
  choice: nínú ìgbọ́ràn rẹ
  rationale: Ìgbọ́ràn pa agbára ìtumọ̀ ὑπακοή mọ́, dípò kí a sọ ọ́ di ìfaramọ́ lasán; 'nínú' tún bá dative Gíríìkì àti lílo Yorùbá mu.
- source_word: ἔγραψά σοι
  choice: mo kọ̀wé sí ọ
  rationale: Aorist náà lè jẹ́ past epistolary; 'mo kọ̀wé sí ọ' jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ iṣẹ́ kíkọ lẹ́tà náà.
- source_word: εἰδὼς
  choice: mo sì mọ̀
  rationale: Èyí sọ ìmọ̀ tí ó bá kíkọ lẹ́tà náà rìn, ó sì mú ìsopọ̀ participle náà jáde lọ́nà Yorùbá tí ó rọrùn.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: àní ju ohun tí mo ń sọ lọ
  rationale: ‘Àní ... ju ... lọ’ pa ìtẹnumọ́ καί àti ìtumọ̀ ὑπέρ mọ́, láì sọ ohun àfikún tí Paulu retí ní pàtó.
- source_word: ποιήσεις
  choice: ìwọ yóò ṣe
  rationale: Future indicative náà jẹ́ ìdánilójú nípa ohun tí Filimoni yóò ṣe; fífi ‘ìwọ’ hàn ń tẹnumọ́ ẹni tí Paulu ń bá sọ̀rọ̀ láì dín ààyè ìtumọ̀ ποιέω kù.
theological_decisions:
- issue: Agbára ὑπακοή nínú ẹ̀bẹ̀ Paulu
  choice: ìgbọ́ràn
  alternative: ìfaramọ́; ìmúratán láti dáhùn
  rationale: Ὑπακοή sọ ìgbọ́ràn ní tààrà, ó sì pa ìbáṣepọ̀ àṣẹ aposteli mọ́; síbẹ̀, ìtumọ̀ náà kò fi ipá tàbí ìfipámúni tí ọ̀rọ̀ náà kò sọ kún un.
- issue: Ohun tí ‘ju ohun tí mo ń sọ lọ’ ń tọ́ka sí
  choice: Fi í sílẹ̀ ní ṣíṣí láì sọ ìgbésẹ̀ àfikún náà ní pàtó
  alternative: Kí Filimoni dá Onesimu sílẹ̀; tàbí kí ó kàn tẹ́wọ́ gbà á lọ́pọ̀ yanturu
  rationale: Ọ̀rọ̀ Paulu ń fúnni ní àbá, ṣùgbọ́n kò sọ ohun tí ó túmọ̀ sí ní pàtó. Ìtumọ̀ náà pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo ‘ìgbọ́ràn’ láti pa agbára ọ̀rọ̀ orísun mọ́.
