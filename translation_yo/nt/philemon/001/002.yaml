id: PHM.1.2
reference: Philemon 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: yo
  text: 'àti sí Áfíà arábìnrin náà,[a] àti sí Ákípù, ọmọ-ogun ẹlẹgbẹ́ wa, àti sí ìjọ tí ó wà nínú ilé rẹ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “arábìnrin wa” dípò “arábìnrin náà.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Áfíà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń sọ àwọn ìró Gíríìkì ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἀδελφῇ
  choice: arábìnrin náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘arábìnrin’; atọ́ka τῇ ni ‘náà’ ń ṣàfihàn. A kò fi ‘wa’ kún un nítorí ἡμῶν kò sí nínú ọ̀rọ̀ SBLGNT tí a fún wa.
- source_word: Ἀρχίππῳ
  choice: Ákípù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ọ̀nà tó bá èdè Yorùbá mu, pẹ̀lú àmì ohùn.
- source_word: συστρατιώτῃ
  choice: ọmọ-ogun ẹlẹgbẹ́ wa
  rationale: Èyí pa àwòrán iṣẹ́ ológun inú ọ̀rọ̀ àkópọ̀ náà mọ́, ó sì sọ ìtumọ̀ ẹni tí ó jẹ́ ọmọ-ogun pẹ̀lú wa ní Yorùbá àdánidá.
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: ‘Ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún àwùjọ àwọn onígbàgbọ́ tí ń péjọ.
- source_word: κατ’ οἶκόν σου
  choice: tí ó wà nínú ilé rẹ
  rationale: Èyí dúró sítòsí Gíríìkì, kò sì fi ìtumọ̀ pàtó pé ‘tí ń péjọ’ kún ohun tí gbólóhùn náà kò sọ ní tààrà.
- source_word: καὶ
  choice: àti
  rationale: A pa àsopọ̀ tí a tún lò ní Gíríìkì mọ́ láti ṣàfihàn bí a ṣe ń fi àwọn olùgbà lẹ́tà náà kún ara wọn.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἀδελφῇ pẹ̀lú arọ́pò-orúkọ ohun-ìní ‘wa’
  choice: arábìnrin náà
  alternative: arábìnrin wa
  rationale: Ọ̀rọ̀ SBLGNT tí a fún wa ní τῇ ἀδελφῇ, kò ní ἡμῶν. Nítorí náà, a tẹ̀ lé ẹ̀rí orísun, a sì fi àyípadà àfọwọ́kọ sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa ìtẹ̀síwájú ìkíni lẹ́tà náà àti àwòrán ọmọ-ogun mọ́, láìfi ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
