  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: yo
  text: ẹni tí kò wúlò fún ọ rí[a], ṣùgbọ́n ní báyìí ó wúlò fún ọ àti fún mi méjèèjì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí Paulu ṣe eré ọ̀rọ̀ lórí orúkọ Onesimu, tí ó ní í ṣe pẹ̀lú jíjẹ́ ẹni tí ó wúlò tàbí tí ń ṣe àǹfààní.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: ẹni tí
  rationale: Àrótọ́ọ̀lù náà ń tọ́ka padà sí Onesimu, ó sì ń tẹ̀síwájú gẹ́gẹ́ bí gbólóhùn aláṣepọ̀; “ẹni tí” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ποτέ
  choice: rí
  rationale: “Rí” lẹ́yìn ọ̀rọ̀ ìṣe fi àkókò àtijọ́ hàn ní ṣókí, ó sì dojú kọ “ní báyìí.”
- source_word: σοι
  choice: fún ọ
  rationale: Ó sọ ẹni tí àìwúlò náà kan; “fún ọ” jẹ́ èdè Yorùbá àdánidá fún ìbáṣepọ̀ yìí.
- source_word: ἄχρηστον
  choice: kò wúlò
  rationale: Ó mú ìtumọ̀ “àìnílò” jáde ní èdè òde òní, ó sì pa ìtakora pẹ̀lú εὔχρηστον mọ́.
- source_word: νυνὶ δὲ
  choice: ṣùgbọ́n ní báyìí
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ohun tó ti kọjá àti ipò ìsinsìnyí.
- source_word: σοὶ καὶ ἐμοὶ
  choice: fún ìwọ àti èmi méjèèjì
  rationale: “Méjèèjì” mú ìsọ̀kan àwọn ẹni méjì náà ṣe kedere, ní ìbámu pẹ̀lú àkójọpọ̀ σοὶ καὶ ἐμοὶ.
- source_word: εὔχρηστον
  choice: ó wúlò
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, ó sì pa eré ọ̀rọ̀ àti ìtakora “kò wúlò/ó wúlò” mọ́.
theological_decisions:
- issue: Eré ọ̀rọ̀ tó ṣeé ṣe lórí orúkọ Onesimu àti ìyípadà rẹ̀
  choice: Pa ìtakora “kò wúlò/ó wúlò” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé eré ọ̀rọ̀ náà síwájú nínú ọ̀rọ̀ pàtàkì, bí “tó jẹ́ asán tẹ́lẹ̀... tó wúlò gan-an báyìí.”
  rationale: Gíríìkì fúnra rẹ̀ sọ ìtakora náà kedere láìfi àlàyé kún un; àlàyé ìsopọ̀ rẹ̀ mọ́ orúkọ Onesimu yẹ fún àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A tún “wúlò” ṣe ní ẹgbẹ́ méjèèjì láti pa ìtakora Gíríìkì àti eré ọ̀rọ̀ tó ṣeé ṣe mọ́. Àmì [a] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn gbólóhùn tí àlàyé náà kan.
