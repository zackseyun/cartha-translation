id: PHM.1.19
reference: Philemon 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: yo
  text: Èmi Pọ́ọ̀lù fi ọwọ́ ara mi kọ èyí pé, “Èmi yóò san án padà”—láì tilẹ̀ sọ fún ọ pé ìwọ pàápàá jẹ mí ní gbèsè—àní ara rẹ gan-an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó tẹ̀lé ìrísí Gíríìkì pẹ́kípẹ́kí: “Èmi Pọ́ọ̀lù fi ọwọ́ ara mi kọ èyí; èmi yóò san án padà; kí n má ṣe sọ fún ọ pé ìwọ pàápàá tún jẹ mí ní gbèsè—àní ara rẹ gan-an.”'
    reason: Àṣàyàn ìtumọ̀ tí ó pa àkókò ọ̀rọ̀-ìṣe àti ìrísí gbólóhùn Gíríìkì mọ́ sí i.
lexical_decisions:
- source_word: ἔγραψα
  choice: kọ
  rationale: Aorist náà lè túmọ̀ sí ‘kọ’ tàbí ‘ti kọ’; nínú lẹ́tà, Yorùbá lè lo ‘kọ èyí’ lọ́nà àdánidá bí ẹni tí ń tọ́ka sí ohun tí ó fi ọwọ́ ara rẹ kọ.
- source_word: τῇ ἐμῇ χειρί
  choice: fi ọwọ́ ara mi
  rationale: Èyí jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún fífi hàn pé Pọ́ọ̀lù fúnra rẹ̀ ni ó kọ ọ́, ó sì tẹnu mọ́ ìdánilójú tirẹ̀.
- source_word: ἀποτίσω
  choice: Èmi yóò san án padà
  rationale: Ó pa ìlérí ọjọ́ iwájú mọ́ pé òun yóò san ohun tí a jẹ tàbí ohun tí ó sọnù padà; ‘án’ tọ́ka sí gbèsè tàbí àdánù tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: ἵνα μὴ λέγω σοι
  choice: láì tilẹ̀ sọ fún ọ pé
  rationale: Gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ọgbọ́n tí ó ní ìfọ̀rọ̀wérọ̀ inú, kì í ṣe ète líle; ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ‘láì mẹ́nu kàn án’ mọ́.
- source_word: σεαυτόν
  choice: ara rẹ gan-an
  rationale: ‘Ara rẹ’ pa ọ̀rọ̀ arọ́pò afẹ̀yìntì mọ́, ‘gan-an’ sì mú ìtẹnumọ́ καί jáde láì sọ irú gbèsè náà di pàtó.
- source_word: προσοφείλεις
  choice: jẹ mí ní gbèsè
  rationale: Èyí sọ ìjẹ̀gbèsè ní kedere; ‘pàápàá’ nínú àyíká náà ń gbé ìtumọ̀ àfikún tí ó wà nínú ọ̀rọ̀ Gíríìkì jáde.
theological_decisions:
- issue: Irú gbèsè tí Fílémónì jẹ Pọ́ọ̀lù nínú ‘ìwọ pàápàá jẹ mí ní gbèsè ara rẹ gan-an’
  choice: Pa àwòrán ìjẹ̀gbèsè ti ara ẹni mọ́ láì sọ ìpìlẹ̀ rẹ̀ di pàtó.
  alternative: Kí a sọ pé Fílémónì jẹ Pọ́ọ̀lù ní gbèsè nítorí ìyípadà rẹ̀, ìgbàlà rẹ̀, tàbí ẹ̀mí ara rẹ̀.
  rationale: Gíríìkì fi ìjẹ̀gbèsè náà hàn gidigidi, ṣùgbọ́n kò sọ ohun pàtó tí ó dá lé. Ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ ìsìn tàbí ìtàn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún lẹ́tà. Lílo ‘Èmi’ lẹ́ẹ̀mejì pa ìtẹnumọ́ ἐγώ mọ́, ‘láì tilẹ̀ sọ’ sì mú ọgbọ́n ọ̀rọ̀ Pọ́ọ̀lù jáde.
