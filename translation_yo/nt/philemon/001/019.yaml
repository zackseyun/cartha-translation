  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: ìtẹnumọ́ ‘Èmi Pọ́ọ̀lù,’ ìfọwọ́sí ọwọ́ ara ẹni, ìlérí ọjọ́ iwájú láti san án padà, àti ọgbọ́n ọ̀rọ̀ ìkẹyìn náà wà níbẹ̀. Ṣùgbọ́n ‘jẹ mí ní gbèsè ara rẹ gan-an’ lè hàn bí ẹni pé ‘ara rẹ’ ni irú gbèsè kan, dípò kí ó túmọ̀ sí pé Fílémónì fúnra rẹ̀ jẹ Pọ́ọ̀lù ní gbèsè. Àtúnṣe kékeré kan mú ìtumọ̀ reflexive náà hàn kedere.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì yẹ fún ìwé lẹ́tà. ‘Láì tilẹ̀ sọ fún ọ pé’ jẹ́ ọ̀nà àdánidá láti gbé ìfọ̀rọ̀wérọ̀ ἵνα μὴ λέγω σοι jáde. Fífi ìdákẹ́jẹ sílẹ̀ kíákíá ṣáájú ‘àní ara rẹ gan-an’ jẹ́ kí ìtumọ̀ ìkẹyìn rọrùn sí i, kí ó má sì dà bí àfikún sí ọ̀rọ̀ ‘gbèsè.’
  terminology: ‘fi ọwọ́ ara mi,’ ‘san án padà,’ àti ‘jẹ mí ní gbèsè’ jẹ́ àwọn yíyan ọ̀rọ̀ tó péye. ‘Àní ara rẹ gan-an’ ń pa ìtẹnumọ́ καὶ σεαυτόν mọ́, láì pinnu bóyá gbèsè ìyípadà ẹni, ìgbàlà, tàbí ohun mìíràn ni Pọ́ọ̀lù túmọ̀ sí.
  issues:
  - severity: medium
    issue: ‘jẹ mí ní gbèsè ara rẹ gan-an’ lè jẹ́ gbólóhùn aláìní ìmúlò tó péye.
    rationale: Nínú Yorùbá, ìtẹ̀lé ‘ara rẹ’ lẹ́yìn ‘jẹ mí ní gbèsè’ lè jẹ́ kí olùkàgbọ́ ka a sí ‘gbèsè ara’ tàbí ‘gbèsè tí ó kan ara,’ dípò ìtẹnumọ́ pé ẹni náà fúnra rẹ̀ ni ó wà ní gbèsè. ‘jẹ mí ní gbèsè—àní ara rẹ gan-an’ pa ìtumọ̀ Gíríìkì mọ́ ní kedere.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ lo ‘kọ ọ́’ fún ohun tí Gíríìkì ń tọ́ka sí gẹ́gẹ́ bí ìkéde tí Pọ́ọ̀lù kọ.
    rationale: ‘kọ èyí’ bá ọ̀rọ̀ àkọ́kọ́ mu dáadáa, ó sì yàgò fún aṣojú-ọrọ̀ ‘ọ́’ tí ìtọ́kasí rẹ̀ lè má hàn gbangba.
