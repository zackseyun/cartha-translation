base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: yo
  text: Mo ń rán án padà sí ọ[a]—òun gan-an, ìyẹn ni, ọkàn mi gan-an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Mo ti rán án padà sí ọ” tàbí “Mo rán án padà sí ọ.” Ọ̀rọ̀-ìṣe aorist Gíríìkì náà lè fara hàn ní onírúurú ọ̀nà ní Yorùbá; ọ̀nà tí a lò nínú ẹsẹ yìí ń wo ìṣe náà bí lẹ́tà ṣe ń dé ọ̀dọ̀ Filemoni.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “àwọn ẹ̀yà inú mi”; gẹ́gẹ́ bí àkànlò èdè, ó ń tọ́ka sí ìfẹ́ jíjinlẹ̀ tàbí ìkẹ́dùn oníyọ̀ọ́nú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: an
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Onesimu gẹ́gẹ́ bí ẹni tí Paulu ń rán padà; “an” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ “òun” gẹ́gẹ́ bí àfikún ọ̀rọ̀-ìṣe.
- source_word: ἀνέπεμψά
  choice: Mo ń rán … padà
  rationale: Ọ̀rọ̀-ìṣe aorist ἀναπέμπω túmọ̀ sí láti rán ẹni kan padà. Lójú ìwòye lẹ́tà bí ó ti ń dé ọ̀dọ̀ Filemoni, “Mo ń rán … padà” mú ìṣe náà yé kedere, láìsọ pé aorist náà ní ìtumọ̀ àsìkò kan ṣoṣo.
- source_word: σοι
  choice: sí ọ
  rationale: Dative ẹni kejì ẹyọ kan ń fi ẹni tí a rán Onesimu padà sí hàn; “sí ọ” jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: αὐτόν
  choice: òun gan-an
  rationale: Àtúnsọ ọ̀rọ̀ arọ́pò-orúkọ náà ní agbára ìtẹnumọ́. “Òun gan-an” pa ìtẹnumọ́ yẹn mọ́ lẹ́yìn “an” tó ti wà nínú gbólóhùn.
- source_word: τοῦτ’ ἔστιν
  choice: ìyẹn ni
  rationale: Èyí jẹ́ gbólóhùn àlàyé tí Paulu fi ń ṣàlàyé ẹni tí “òun gan-an” túmọ̀ sí; “ìyẹn ni” jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: ọkàn mi gan-an
  rationale: Bí ó tilẹ̀ jẹ́ pé σπλάγχνα ń tọ́ka ní ti gidi sí àwọn ẹ̀yà inú, a máa ń lò ó fún ìfẹ́ jíjinlẹ̀ àti ìkẹ́dùn oníyọ̀ọ́nú. “Ọkàn mi gan-an” mú agbára ìmọ̀lára àti ìdánimọ̀ Paulu pẹ̀lú Onesimu jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Àpèjúwe nípa ènìyàn nínú σπλάγχνα
  choice: ọkàn mi gan-an
  alternative: àwọn ẹ̀yà inú mi; ìfẹ́ ọkàn mi tó jinlẹ̀
  rationale: Ìpinnu ọ̀rọ̀ àti àṣà èdè ni èyí, kì í ṣe fífi ẹ̀kọ́ ìsìn kan kún un. Ọ̀rọ̀ Gíríìkì náà ń sọ ìfẹ́ jíjinlẹ̀; títúmọ̀ rẹ̀ nípa ẹ̀yà ara gan-an lè ṣókùnkùn ìtumọ̀ rẹ̀ fún òǹkàwé Yorùbá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àtúnsọ “an … òun gan-an” pa ìtẹnumọ́ Gíríìkì mọ́ láìjẹ́ kí gbólóhùn náà le.
