  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: yo
  text: Mo máa ń dúpẹ́ lọ́wọ́ Ọlọ́run mi nígbà gbogbo, ní mímẹ́nu kàn ọ nínú àdúrà mi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ní rírántí ọ nínú àdúrà mi.” Ní ti gidi, èdè Gíríìkì sọ pé, “ní mímẹ́nu kàn ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Mo máa ń dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe àkókò ìsinsìnyí, ẹni àkọ́kọ́ ẹyọ; “Mo máa ń dúpẹ́ lọ́wọ́” jẹ́ Yorùbá àdánidá tí ó fi ìṣe ìdúpẹ́ hàn ní tààrà.
- source_word: τῷ θεῷ μου
  choice: Ọlọ́run mi
  rationale: Dative náà tọ́ka sí ẹni tí Pọ́ọ̀lù ń dúpẹ́ lọ́wọ́; “lọ́wọ́ Ọlọ́run mi” ni ìṣọ̀kan Yorùbá tó bójú mu, ó sì pa arọ́pò-orúkọ ohun-ìní “mi” mọ́.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó sọ ìgbà gbogbo tàbí ìṣe déédéé; “nígbà gbogbo” jẹ́ kedere, ó sì yẹ fún ọ̀rọ̀ ìdúpẹ́ yìí.
- source_word: μνείαν σου ποιούμενος
  choice: bí mo ṣe ń dárúkọ rẹ
  rationale: Ìṣọ̀kan Gíríìkì túmọ̀ ní ti gidi sí ṣíṣe ìrántí tàbí dídárúkọ ẹnì kan. Nítorí àyíká náà jẹ́ àdúrà, “dárúkọ rẹ” pa ìtumọ̀ pé Pọ́ọ̀lù ń mẹ́nu kan Fílémónì níwájú Ọlọ́run mọ́.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: nínú àdúrà mi
  rationale: ἐπί pẹ̀lú genitive nínú ìṣọ̀kan yìí túmọ̀ sí nígbà tàbí nínú àdúrà; “nínú àdúrà mi” jẹ́ Yorùbá àdánidá tí ó ṣe kedere.
