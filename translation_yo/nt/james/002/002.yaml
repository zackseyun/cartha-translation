id: JAS.2.2
reference: James 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: yo
  text: Nítorí bí ọkùnrin kan tí ó wọ òrùka wúrà, tí ó sì wọ aṣọ dídán bá wọ inú àpéjọ yín[a], tí ọkùnrin tálákà kan tí ó wọ aṣọ ẹlẹ́gbin bá wọ inú rẹ̀ pẹ̀lú,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínágọ́gù.” Ọ̀rọ̀ Gíríìkì náà ni synagōgē, èyí tí ó lè túmọ̀ sí “sínágọ́gù” tàbí “àpéjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: àpéjọ
  rationale: “Àpéjọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìpàdé àwọn ènìyàn, ó sì bá àyíká ìpéjọ àwọn onígbàgbọ́ mu láìfi dandan túmọ̀ sí ilé ìjọsìn Júù. A pa “sínágọ́gù” mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ kan; “ọkùnrin kan” pa ìtumọ̀ àti àwòrán àpẹẹrẹ náà mọ́.
- source_word: χρυσοδακτύλιος
  choice: tí ó wọ òrùka wúrà
  rationale: Èyí sọ ní Yorùbá àdánidá pé wúrà wà ní ìka ọkùnrin náà, gẹ́gẹ́ bí àmì ọrọ̀ àti ọlá, láìlo ìtumọ̀ gígùn tàbí aláìṣe-déédéé bí “ẹni tí ìka rẹ̀ jẹ́ wúrà.”
- source_word: ἐσθῆτι λαμπρᾷ
  choice: aṣọ dídán
  rationale: “Aṣọ dídán” pa agbára ojú-ìran λαμπρός mọ́, ó sì lè fi aṣọ ẹlẹ́wà tàbí olówó iyebíye hàn nínú àyíká náà.
- source_word: πτωχὸς
  choice: ọkùnrin tálákà kan
  rationale: Ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ, ó sì jẹ́ akọ ní ẹyọ kan, ní ìfiwéra pẹ̀lú ọkùnrin ọlọ́rọ̀ náà.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: aṣọ ẹlẹ́gbin
  rationale: “Ẹlẹ́gbin” mú ìtumọ̀ líle ti ῥυπαρός jáde dáadáa ju ọ̀rọ̀ tí yóò kàn túmọ̀ sí aṣọ àìlẹ́wà tàbí aṣọ àtijọ́ lọ.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: bá wọ inú ... sì wọlé pẹ̀lú
  rationale: Àwọn gbólóhùn méjèèjì pa ìṣe wíwọlé kan náà mọ́; ìyípadà kékeré láàárín “wọ inú” àti “wọlé” jẹ́ kí Yorùbá náà ṣàn ní ti ẹ̀dá, “pẹ̀lú” sì mú καί jáde.
- source_word: γὰρ
  choice: Nítorí
  rationale: “Nítorí” so àpẹẹrẹ yìí mọ́ ìkìlọ̀ ẹsẹ̀ tó ṣáájú nípa ojúsàájú, gẹ́gẹ́ bí γάρ ṣe ń fúnni ní ìdí tàbí àlàyé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ συναγωγή nínú lẹ́tà sí àwọn onígbàgbọ́
  choice: àpéjọ
  alternative: sínágọ́gù
  rationale: Ẹsẹ̀ náà kò ń pinnu ètò ìjọ tàbí irú ilé ìjọsìn kan. “Àpéjọ” mú ìtumọ̀ ìpàdé àwọn onígbàgbọ́ yé kedere, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀rọ̀ Gíríìkì tó lè túmọ̀ sí “sínágọ́gù” mọ́ fún ìṣípayá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà parí pẹ̀lú àmì kọ́ńmá nítorí pé àpẹẹrẹ onípò “bí” náà ń bá a lọ sínú ẹsẹ̀ tó tẹ̀ lé e.
