language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: yo
  text: bí ẹnì kan nínú yín sì sọ fún wọn pé, “Ẹ lọ ní àlàáfíà; ẹ máa gbóná[a], ẹ sì máa yó,” ṣùgbọ́n ẹ kò fún wọn ní àwọn ohun tí ara wọn nílò, àǹfààní wo ni èyí ní?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹ̀lú ìtumọ̀ mìíràn, “kí a mú yín gbóná, kí a sì fún yín ní oúnjẹ títí ẹ ó fi yó.” Àwọn fọ́ọ̀mù Gíríìkì náà lè túmọ̀ sí pé àwọn tìkára wọn ni yóò ṣe é, tàbí pé ẹlòmíràn ni yóò ṣe é fún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: bí ẹnì kan nínú yín sì sọ fún wọn pé
  rationale: Ọ̀rọ̀ náà gbé àpẹẹrẹ àròsọ kan kalẹ̀. “Ẹnì kan nínú yín” túmọ̀ ìtumọ̀ apá-inú-àpapọ̀ ἐξ ὑμῶν lọ́nà Yorùbá àdánidá, δέ sì fara hàn gẹ́gẹ́ bí “sì” láìfi ìtakora tí ó pọ̀ sí i.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Ẹ máa lọ ní àlàáfíà
  rationale: Èyí jẹ́ ọ̀nà ìdágbére tàbí ìbùkún tí ó wọ́pọ̀; ó sì pa agbára ẹ̀gàn inú ọ̀rọ̀ náà mọ́ ní àyíká ẹsẹ̀ yìí.
- source_word: θερμαίνεσθε
  choice: ẹ mú ara yín gbóná
  rationale: Fọ́ọ̀mù Gíríìkì lè ní ìtumọ̀ middle tàbí passive. Àṣàyàn yìí jẹ́ Yorùbá tó ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn passive pamọ́ kí a má bàa pa àìdánilójú orísun rẹ́.
- source_word: χορτάζεσθε
  choice: kí ẹ sì jẹun yó
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí jíjẹun títí ènìyàn yó. Yorùbá yìí jẹ́ àdánidá, ó sì bá àìní oúnjẹ nínú àyíká ọ̀rọ̀ mu.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: ṣùgbọ́n tí ẹ kò fún wọn
  rationale: “Ṣùgbọ́n” mú ìtakora tó wà láàárín ọ̀rọ̀ ìbùkún àti àìṣe ìrànlọ́wọ́ hàn, fọ́ọ̀mù “tí ẹ kò” sì bá àpẹẹrẹ àròsọ náà mu.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: àwọn ohun tí ara nílò
  rationale: Èyí sọ ìpèsè pàtàkì fún ara ní Yorùbá òde òní tó ṣe kedere, nígbà tí ó tún pa ìtẹnumọ́ lórí àìní ti ara mọ́.
- source_word: τί ὄφελος;
  choice: èrè wo ni ó wà nínú èyí?
  rationale: Ìbéèrè náà ń béèrè iye àǹfààní gidi tí ọ̀rọ̀ lásán ní. “Èrè” dúró sún mọ́ ὄφελος, gbólóhùn náà sì jẹ́ Yorùbá tó ṣe é lóye.
theological_decisions:
- issue: Ìtumọ̀ ohùn àwọn ọ̀rọ̀ àṣẹ θερμαίνεσθε àti χορτάζεσθε
  choice: A túmọ̀ wọn gẹ́gẹ́ bí ìṣírí tó bá ọ̀rọ̀ ojoojúmọ́ mu, láìsọ pé àwọn olùgbọ́ gbọ́dọ̀ ṣe gbogbo ohun náà fún ara wọn.
  alternative: “Kí a mú yín gbóná, kí a sì fún yín ní oúnjẹ títí ẹ ó fi yó.”
  rationale: Kókó Jákọ́bù ni pé ọ̀rọ̀ rere tí ìrànlọ́wọ́ gidi kò bá tẹ̀ lé kò ní èrè. Àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ passive tí Gíríìkì lè gbà fara hàn, láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. Ọ̀rọ̀ náà ṣàn lọ́nà àdánidá, ṣùgbọ́n ó pa ìbéèrè àríyànjiyàn àti ìtakora láàárín ọ̀rọ̀ rere àti àìṣe ìrànlọ́wọ́ mọ́.
