id: JAS.2.6
reference: James 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin ti ṣe ọkùnrin tálákà náà ní àìlọ́lá.[a] Ṣé kì í ṣe àwọn ọlọ́rọ̀ ni wọ́n ń ṣe yín ní ìnilára, tí àwọn fúnra wọn sì ń fà yín lọ sí àwọn ilé ẹjọ́ bí?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tálákà náà,” tàbí ní ìtumọ̀ gbogbogbò, “àwọn tálákà.” Ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ ọ̀rọ̀ akọ, ó sì ṣeé ṣe kó ń tọ́ka padà sí àpẹẹrẹ pàtó nínú àwọn ẹsẹ tó ṣáájú, bó tilẹ̀ jẹ́ pé ó tún dúró fún àwọn tálákà lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ilé ẹjọ́ òfin” tàbí “àwọn àgbàlá ìdájọ́.” Ọ̀rọ̀ Gíríìkì ń tọ́ka sí àwọn ibi ìdájọ́ òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: ti tàbùkù sí
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ṣe ẹni náà ní àìlọ́lá, wọ́n sì hù sí i pẹ̀lú ẹ̀gàn; ‘tàbùkù sí’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ọlá àti ẹ̀gàn mọ́.
- source_word: τὸν πτωχόν
  choice: ọkùnrin tálákà náà
  rationale: Ẹyọ ọ̀rọ̀ akọ tí ó ní atọ́ka náà tọ́ka padà sí ọkùnrin tálákà tí a ṣàpẹẹrẹ rẹ̀ ní àwọn ẹsẹ tó ṣáájú, bí ó tilẹ̀ jẹ́ pé ó tún lè dúró fún àwọn tálákà lápapọ̀.
- source_word: οἱ πλούσιοι
  choice: àwọn ọlọ́rọ̀
  rationale: Àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ yìí ń tọ́ka sí àwọn ènìyàn ọlọ́rọ̀ gẹ́gẹ́ bí ẹgbẹ́ kan.
- source_word: καταδυναστεύουσιν
  choice: ń ni yín lára
  rationale: Ó túmọ̀ sí lílo agbára lòdì sí ẹlòmíràn ní ọ̀nà ìkà tàbí ìnilára; gbólóhùn Yorùbá yìí ṣe àfihàn ìnilára náà ní èdè àdánidá.
- source_word: ἕλκουσιν
  choice: ń wọ́ yín lọ
  rationale: ‘Wọ́’ pa àwòrán fífi agbára fà ènìyàn lọ mọ́, ó sì bá ipò ẹjọ́ ọ̀tá yìí mu.
- source_word: κριτήρια
  choice: ilé ẹjọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tàbí àgbègbè ìdájọ́ òfin.
- source_word: καὶ αὐτοὶ
  choice: tí àwọn fúnra wọn sì
  rationale: ‘Àwọn fúnra wọn’ pa ìtẹnumọ́ mọ́ pé àwọn ọlọ́rọ̀ kan náà gan-an ni wọ́n ń ṣe èyí.
- source_word: οὐχ ... ;
  choice: kọ́ ni ... bí?
  rationale: Ìbéèrè àsọ̀rọ̀ tí ó ń retí ìdáhùn rere ni; ìṣètò Yorùbá yìí mú agbára rẹ̀ jáde lọ́nà àdánidá.
theological_decisions:
- issue: Ohun tí ‘ọkùnrin tálákà náà’ ń tọ́ka sí
  choice: Ọkùnrin tálákà aṣojú kan nínú àpẹẹrẹ ìpéjọ, pẹ̀lú ìtumọ̀ tó tún kan àwọn tálákà lápapọ̀
  alternative: Ẹyọ ọ̀rọ̀ aṣojú tí ó túmọ̀ sí ‘àwọn tálákà’ lápapọ̀
  rationale: Jákọ́bù ṣẹ̀ṣẹ̀ ṣàpèjúwe ọkùnrin tálákà kan pàtó nínú ìpéjọ ní 2:2–3; pípa ẹyọ ọ̀rọ̀ akọ náà mọ́ ń tẹ̀ lé ìṣàn ọ̀rọ̀ láìṣe ìdènà fún ìtumọ̀ aṣojú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ àti ‘yín’ láti pa ọ̀pọ̀ ènìyàn mọ́; ‘wọ́ yín lọ’ sì pa àwòrán ìfipá mú lọ sí ẹjọ́ mọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá.
