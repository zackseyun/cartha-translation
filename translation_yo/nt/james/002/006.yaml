  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba èrò pàtàkì Gíríìkì náà: ẹ̀yin ti bu ọlá ẹni tálákà kan, àwọn ọlọ́rọ̀ ń tẹ yín lórí, àwọn kan náà sì ń fi agbára mú yín lọ sí ilé-ẹjọ́. Síbẹ̀, ‘ń ni yín lára’ kò lágbára tó láti mú καταδυναστεύουσιν (‘ń ṣe yín ní ìnilára/ń tẹ yín lórí’) jáde dáadáa, ‘wọ́ yín lọ’ sì kéré ní ìdánilójú ju ‘fà yín lọ’ fún ἕλκουσιν.'
  naturalness: ‘Ti tàbùkù sí’ kì í ṣe ọ̀nà tí ó wọ́pọ̀ jù lọ nínú Yorùbá ìkọ̀wé òde òní fún ìṣe àìlọ́lá sí ènìyàn. ‘Ẹ ti ṣe ọkùnrin tálákà náà ní àìlọ́lá’ jẹ́ kedere, ó sì jẹ́ ti ẹ̀dá. Ìṣètò ìbéèrè náà tún lè rọrùn sí i pẹ̀lú ‘Ṣé kì í ṣe...?’
  terminology: ‘Ọkùnrin tálákà náà’ yẹ, nítorí ó pa ẹyọ ọ̀rọ̀ akọ àti ìtọ́ka sí àpẹẹrẹ tó ṣáájú mọ́. ‘Àwọn ọlọ́rọ̀’ yẹ. ‘Àwọn ilé ẹjọ́’ fi ọ̀pọ̀ κριτήρια hàn, nígbà tí ‘fúnra wọn’ ń pa ìtẹnumọ́ αὐτοὶ mọ́.
  issues:
