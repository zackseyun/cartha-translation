  to: Ṣùgbọ́n ẹ̀yin ti ṣe ọkùnrin tálákà náà ní àìlọ́lá.[a] Ṣé kì í ṣe àwọn ọlọ́rọ̀ ni wọ́n ń ṣe yín ní ìnilára, tí àwọn fúnra wọn sì ń fà yín lọ sí àwọn ilé ẹjọ́ bí?[b]
