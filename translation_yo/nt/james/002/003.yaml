id: JAS.2.3
reference: James 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: yo
  text: tí ẹ bá sì fi àfiyèsí sí ẹni tí ó wọ aṣọ dídán[a], tí ẹ sì sọ pé, “Ìwọ, jókòó síbí ní ibi rere,” tí ẹ sì sọ fún ọkùnrin tálákà náà pé, “Ìwọ, dúró níbẹ̀, tàbí kí o jókòó níbẹ̀[b] lábẹ́ àpótí ìtìsẹ̀ mi,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aṣọ tó dára” tàbí “aṣọ ológo.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan kò ní “tàbí kí o jókòó níbẹ̀”; ẹ̀dà tí a tẹ̀ tẹ̀lé ní ọ̀rọ̀ náà.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: fiyèsí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi àkíyèsí tàbí àfiyèsí sí ẹni kan. “Fiyèsí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ “ṣojúsàájú” kún ẹsẹ̀ náà ní tààràtà.
- source_word: φοροῦντα
  choice: tí ó wọ
  rationale: Nínú àyíká aṣọ, φορέω ń tọ́ka sí ohun tí ènìyàn wọ̀; “tí ó wọ” ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: aṣọ dídán
  rationale: ἐσθής ni aṣọ, λαμπρός sì lè túmọ̀ sí dídán, ológo tàbí aṣọ tó dára. “Aṣọ dídán” pa àwòrán aṣọ tó ń fa ojú mọ́ra mọ́ láì sọ ọ́ di aṣọ olówó ní pàtó.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Ìwọ, jókòó síbí ní ibi rere
  rationale: “Jókòó” pa àṣẹ náà mọ́, “síbí” dúró fún ὧδε, “ní ibi rere” sì fi ipò ìjókòó tí a ka sí rere hàn ní ìyàtọ̀ sí bí a ṣe bá tálákà náà sọ̀rọ̀.
- source_word: τῷ πτωχῷ
  choice: ọkùnrin tálákà náà
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ẹyọ kan tó ní àpèjúwe pàtó; “ọkùnrin tálákà náà” pa akọ àti ẹyọ náà mọ́.
- source_word: στῆθι
  choice: dúró
  rationale: Àṣẹ ẹyọ kan ni στῆθι; “dúró” ni ìtumọ̀ Yorùbá tó rọrùn, tó sì péye.
- source_word: ἢ κάθου ἐκεῖ
  choice: tàbí kí o jókòó níbẹ̀
  rationale: Gbólóhùn náà fún tálákà ní àṣàyàn mìíràn. “Níbẹ̀” pa ìjìnnà tí ἐκεῖ ń fi hàn mọ́.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: lábẹ́ àpótí ìtìsẹ̀ mi
  rationale: ὑπό pẹ̀lú accusative níbí túmọ̀ sí “lábẹ́.” Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà le koko ní ti àwòrán, ó ń fi ìrẹ̀sílẹ̀ tálákà hàn, nítorí náà a kò yí i sí “lẹ́gbẹ̀ẹ́.”
theological_decisions:
- issue: Ọ̀rọ̀ nípa ṣíṣe ojúsàájú láwùjọ
  choice: A túmọ̀ ìṣe àti ọ̀rọ̀ tí wọ́n sọ fún àwọn àlejò méjèèjì ní tààràtà, kí ìyàtọ̀ ọlá àti àbùkù náà lè hàn fúnra rẹ̀.
  alternative: Láti túmọ̀ ἐπιβλέψητε ní tààràtà sí “ṣojúsàájú” tàbí “fi ojú rere sí.”
  rationale: Àyíká ẹsẹ̀ náà dá ṣíṣe ojúsàájú lẹ́bi, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ ń ṣàpèjúwe ìṣe náà. Ìtumọ̀ yìí kò fi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí ní gbólóhùn náà kún un.
- issue: Akọ nínú πτωχῷ
  choice: ọkùnrin tálákà náà
  alternative: ẹni tálákà náà
  rationale: Ẹ̀dà Gíríìkì tọ́ka sí àlejò akọ kan ní ẹyọ; títúmọ̀ rẹ̀ gẹ́gẹ́ bí akọ pa àlàyé orísun náà mọ́ láì sọ pé gbogbo tálákà jẹ́ ọkùnrin.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ òde òní, àti àmì ohùn ní kíkún. Ìlànà ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀ àti ìyì, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé lásán. “Àpótí ìtìsẹ̀” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún ibi tí a gbé ẹsẹ̀ lé; “lábẹ́” sì pa líle àti ìrẹ̀sílẹ̀ tó wà nínú àwòrán Gíríìkì mọ́.
