    reason: textual_variant
  revision_rationale: The revision removes the unwarranted adversative conjunction and regularizes the paired conditional clauses while preserving the concrete contrast in the two commands. It retains the source’s ambiguity and degrading spatial imagery, as well as both supplied footnote anchors.
