id: JAS.2.18
reference: James 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: yo
  text: Ṣùgbọ́n ẹnì kan yóò sọ pé, “Ìwọ ní ìgbàgbọ́, èmi sì ní àwọn iṣẹ́.” Fi ìgbàgbọ́ rẹ hàn mí láìsí àwọn iṣẹ́[a][c], èmi ó sì fi ìgbàgbọ́ mi hàn ọ nípasẹ̀ àwọn iṣẹ́ mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “yàtọ̀ sí àwọn iṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíyà sọ́tọ̀ kúrò lọ́dọ̀ àwọn iṣẹ́ tàbí àìsí wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “láti inú àwọn iṣẹ́ mi.” Ọ̀rọ̀ aṣáájú Gíríìkì náà lè fi orísun tàbí ọ̀nà hàn; “nípasẹ̀ àwọn iṣẹ́ mi” sọ pé àwọn iṣẹ́ náà ń mú ìgbàgbọ́ hàn kedere.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì pistis; ó tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé,” tàbí ní àwọn àyíká kan, “jíjẹ́ olóòtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora tàbí àtakò ẹni tí a ń fojú inú wò hàn nínú ìjiyàn Jákọ́bù.
- source_word: ἐρεῖ τις
  choice: ẹnì kan yóò sọ pé
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ń mú ẹni tí a ń fojú inú wò wọ inú ìjiyàn; ìtumọ̀ yìí pa ìrísí àti agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Ìgbàgbọ́ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún πίστις ní àyíká yìí, ó sì pa ìforígbárí láàárín ohun tí ènìyàn sọ pé ó gbà gbọ́ àti àwọn iṣẹ́ rẹ̀ mọ́ láìyànjú rẹ̀ ṣáájú.
- source_word: ἔργα
  choice: àwọn iṣẹ́
  rationale: Ó pa àjọṣe ọ̀rọ̀ yìí mọ́ jálẹ̀ ìjíròrò Jákọ́bù nípa ìgbàgbọ́ àti iṣẹ́; fífi àmì ọ̀pọ̀ hàn bá Gíríìkì mu.
- source_word: δεῖξόν μοι
  choice: Fi ... hàn mí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá, tààrà, tí ó sì pa ìpèníjà fún ẹ̀rí tó ṣeé rí mọ́.
- source_word: χωρὶς τῶν ἔργων
  choice: láìsí àwọn iṣẹ́
  rationale: Ó túmọ̀ χωρίς ní ti àìsí tàbí yíyà sọ́tọ̀ kúrò lọ́dọ̀ àwọn iṣẹ́, láìfi ọ̀rọ̀ tí kò sí nínú ẹsẹ yìí kún un.
- source_word: κἀγώ σοι δείξω
  choice: èmi ó sì fi ... hàn ọ
  rationale: Fífi èmi sí iwájú pa ìtẹnumọ́ κἀγώ mọ́, 'sì' sì so ìdáhùn náà pọ̀ mọ́ ìpèníjà tó ṣáájú.
- source_word: ἐκ τῶν ἔργων μου
  choice: nípasẹ̀ àwọn iṣẹ́ mi
  rationale: Ní àyíká yìí ἐκ lè tọ́ka sí orísun tàbí ọ̀nà; 'nípasẹ̀' sọ pé àwọn iṣẹ́ ni ohun tí ń mú ìgbàgbọ́ hàn.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́ mi
  rationale: A tún orúkọ náà sọ ní kedere láti pa ìbáramu ọ̀rọ̀ Jákọ́bù mọ́; 'mi' wá láti μου tó so mọ́ àwọn iṣẹ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ tó ṣe pàtàkì sí ìjíròrò ìgbàgbọ́ àti iṣẹ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; jíjẹ́ olóòtítọ́
  rationale: “Ìgbàgbọ́” pa ọ̀rọ̀ ẹ̀kọ́ ìsìn àti àìdánilójú ìtumọ̀ rẹ̀ mọ́. “Jíjẹ́ olóòtítọ́” yóò tètè pinnu ìtumọ̀ tí ẹsẹ náà kò fi dandan pinnu.
- issue: Bí ἐκ ṣe ń so iṣẹ́ pọ̀ mọ́ fífi ìgbàgbọ́ hàn
  choice: nípasẹ̀ àwọn iṣẹ́ mi
  alternative: láti inú àwọn iṣẹ́ mi
  rationale: “Nípasẹ̀” mú iṣẹ́ gẹ́gẹ́ bí ọ̀nà tàbí ẹ̀rí tí ń fi ìgbàgbọ́ hàn, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ orísun mọ́ gẹ́gẹ́ bí ohun tó tún ṣeé ṣe.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A pa ìtẹnumọ́ “èmi” àti ìbáramu ìgbàgbọ́/àwọn iṣẹ́ mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
