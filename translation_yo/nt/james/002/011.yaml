  source_fidelity: 'Ìtumọ̀ náà gba ìṣètò ìjiyàn Gíríìkì náà dáadáa: ẹni kan náà ni ó sọ àwọn àṣẹ méjèèjì, àpẹẹrẹ ìdàmọ̀ràn náà sì parí pé ẹni náà ti di ẹni tí ó rú òfin. Ṣùgbọ́n “arúfin” lè má hàn gbangba gẹ́gẹ́ bí παραβάτης νόμου, nítorí náà ó yẹ kí a sọ ‘ẹni tí ó rú òfin’ kí ‘òfin’ hàn ní kedere.'
  naturalness: “Kò gbọdọ̀” jẹ́ òye, ṣùgbọ́n ọ̀nà àṣẹ tó rọrùn, tó sì wọ́pọ̀ nínú Yorùbá boṣewa fún ìfàmọ́ra àwọn àṣẹ wọ̀nyí ni “Má ṣe …”. “Pànìyàn” jẹ́ ọ̀rọ̀ tó péye ju “pààyàn” lọ nínú ìforúkọsílẹ̀ yìí, ó sì ṣàfihàn ìtumọ̀ φονεύω gẹ́gẹ́ bí ìpànìyàn.
