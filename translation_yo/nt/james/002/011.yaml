id: JAS.2.11
reference: James 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: yo
  text: Nítorí ẹni tí ó sọ pé, “Má ṣe panṣágà,” tún sọ pé, “Má ṣe pànìyàn.” Ṣùgbọ́n bí o kò ṣe panṣágà, tí o sì pànìyàn, o ti di ẹni tí ó rú òfin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: ẹni tí ó sọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí ó dá lórí participle náà ń tọ́ka sí ẹni kan pàtó láì fi orúkọ Ọlọ́run kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Μὴ μοιχεύσῃς
  choice: Ìwọ kò gbọdọ̀ ṣe panṣágà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ọ̀wọ̀ láti sọ àṣẹ ìdènà, ó sì mú ìtumọ̀ μοιχεύω, ìyẹn ṣíṣe panṣágà, jáde kedere.
- source_word: καί
  choice: òun náà ni
  rationale: Ní àyíká yìí καί tẹnumọ́ pé ẹni kan náà ló fúnni ní àṣẹ méjèèjì; gbólóhùn yìí mú ìjiyàn náà hàn kedere ní Yorùbá.
- source_word: Μὴ φονεύσῃς
  choice: Ìwọ kò gbọdọ̀ pààyàn
  rationale: φονεύω túmọ̀ sí pípa ènìyàn lọ́nà ìpànìyàn, kì í ṣe gbogbo irú pípa; “pààyàn” pa ìyàtọ̀ yẹn mọ́.
- source_word: εἰ δὲ
  choice: Ǹjẹ́ bí ... ṣùgbọ́n
  rationale: “Ǹjẹ́” yí ọ̀rọ̀ sí ìlò àpẹẹrẹ tí ó tẹ̀ lé, “ṣùgbọ́n” sì pa ìtakora δέ mọ́.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: ìwọ kò bá ṣe panṣágà, ṣùgbọ́n tí o pààyàn
  rationale: Àwọn present indicative náà jẹ́ àpẹẹrẹ gbogbogbò; àkójọpọ̀ “bí ... ṣùgbọ́n” jẹ́ Yorùbá àdánidá fún ìtakora náà.
- source_word: γέγονας
  choice: ìwọ ti di
  rationale: Perfect γίνομαι sọ ìyípadà tí àbájáde rẹ̀ ṣì wà; “ti di” pa ìtumọ̀ pé ẹni náà ti wọ ipò tuntun mọ́.
- source_word: παραβάτης νόμου
  choice: arúfin
  rationale: “Arúfin” jẹ́ ẹni tí ó rú òfin, ó sì jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, àdánidá tí ó pa ìforúkọsílẹ̀ òfin àti ìwà rere mọ́.
- source_word: νόμου
  choice: òfin (nínú arúfin)
  rationale: Àkópọ̀ ọ̀rọ̀ “arúfin” ní ìtumọ̀ ẹni tí ó rú òfin; ní àyíká yìí òfin náà ni òfin Ọlọ́run tí àwọn àṣẹ tí a ṣẹ̀ṣẹ̀ tọ́ka sí dúró fún.
theological_decisions:
- issue: Ta ni ó sọ àwọn àṣẹ náà?
  choice: “ẹni tí ó sọ” láì fi “Ọlọ́run” kún un
  alternative: “Ọlọ́run, ẹni tí ó sọ”
  rationale: Àyíká fi hàn pé Ọlọ́run ni olùsọ̀rọ̀, ṣùgbọ́n Gíríìkì kò dárúkọ rẹ̀ ní tààrà; ìtumọ̀ náà pa ìtọ́kasí ẹni náà mọ́ láì ṣe àfikún.
- issue: Ìwọ̀n rírú òfin nínú ìjiyàn Jakọbu
  choice: “ìwọ ti di arúfin”
  alternative: “ìwọ ti rú apá òfin yẹn”
  rationale: Jakọbu ń sọ pé rírú àṣẹ kan mú kí ẹni náà jẹ́ ẹni tí ó rú òfin, kì í ṣe kìkì apá kékeré kan; “arúfin” pa agbára ìtumọ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. “Pààyàn” ni a lò dípò ọ̀rọ̀ gbogbogbò fún pípa, kí ìtumọ̀ ìpànìyàn φονεύω lè ṣe kedere. Kò sí àlàyé ẹsẹ̀ tí a nílò.
