id: JAS.2.23
reference: James 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni ohun tí Ìwé Mímọ́ sọ pé, “Ábúráhámù gba Ọlọ́run gbọ́, a sì kà á sí òdodo fún un,” ṣẹ, a sì pe Ábúráhámù ní ọ̀rẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπληρώθη
  choice: ṣẹ
  rationale: Ní ọ̀rọ̀ Yorùbá nípa àsọtẹ́lẹ̀ tàbí Ìwé Mímọ́, ‘ṣẹ’ jẹ́ ọ̀nà àdánidá láti sọ pé ohun tí a kọ dé ìmúṣẹ, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: Ìwé Mímọ́ tí ó sọ pé
  rationale: Èyí fi γραφή hàn gẹ́gẹ́ bí Ìwé Mímọ́, ó sì tú participle λέγουσα sí gbólóhùn Yorùbá tó ṣe kedere.
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: Ábúráhámù gba Ọlọ́run gbọ́
  rationale: ‘Gba ... gbọ́’ tọ́ka sí gbígba ohun tí Ọlọ́run sọ gbọ́, ó sì bá dative Gíríìkì mu ju ‘ní ìgbàgbọ́ nínú Ọlọ́run’ lọ.
- source_word: ἐλογίσθη αὐτῷ
  choice: a sì kà á ... fún un
  rationale: ‘Kà á ... fún un’ pa àwòrán ìṣírò tàbí fífi ohun kan sí àkọọ́lẹ̀ ẹni mọ́, ní èdè Yorùbá tó ṣe kedere.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo
  rationale: ‘Òdodo’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún δικαιοσύνη nínú àyíká yìí, ó sì pa ìtumọ̀ Genesis mọ́ láìyí i sí ìdájọ́ òdodo láàárín ènìyàn.
- source_word: φίλος θεοῦ
  choice: ọ̀rẹ́ Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá tí ó pa ìbáṣepọ̀ tí genitive náà ń fi hàn mọ́.
- source_word: ἐκλήθη
  choice: a sì pe Ábúráhámù ní
  rationale: ‘A pe ... ní’ jẹ́ passive aláìdárúkọ olùṣe ní Yorùbá, ó sì jẹ́ kí ẹni tí ó ṣe ìpè náà wà ní àìsọ gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ Ábúráhámù àti iṣẹ́ rẹ̀ nínú àríyànjiyàn Jákọ́bù
  choice: Lo ‘Ìwé Mímọ́ ... ṣẹ’ kí ẹsẹ náà lè sọ pé ọ̀rọ̀ Ìwé Mímọ́ dé ìmúṣẹ, láìṣàlàyé ọ̀nà pàtó tí ìgbàgbọ́ àti iṣẹ́ ṣe ní ìbáṣepọ̀.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìdáláre nípa ìgbàgbọ́ nìkan tàbí bí iṣẹ́ ṣe rọ́pò ìgbàgbọ́.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́; ìtumọ̀ kò gbọ́dọ̀ yanju rẹ̀ nípa fífi èrò ẹ̀sìn kan kún un.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú àyọlò Genesis yìí, ‘òdodo’ bá ipò tàbí ìwà títọ́ tí a kà fún Ábúráhámù mu; ‘ìdájọ́ òdodo’ lè mú ọ̀rọ̀ náà lọ sí justice ní ọ̀nà tí àyíká kò béèrè.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Bẹ́ẹ̀ ni’ láti so ẹsẹ náà mọ́ ọ̀rọ̀ tó ṣáájú, níbi tí καί ti ń tẹ̀síwájú nínú àríyànjiyàn. A kò fi àfikún δέ sínú ọ̀rọ̀ àyọlò, nítorí pé Yorùbá kò nílò rẹ̀ níbí. Kò sí àlàyé ẹsẹ̀ ìsàlẹ̀, nítorí ‘kà á ... fún un’ ti mú nuance λογίζομαι jáde ní kedere.
