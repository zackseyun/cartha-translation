  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: yo
  text: Ìwọ rí i pé ìgbàgbọ́[a] ń ṣiṣẹ́ pọ̀ pẹ̀lú àwọn iṣẹ́ rẹ̀, a sì mú ìgbàgbọ́ náà dé ìmúṣẹ́ nípasẹ̀ àwọn iṣẹ́ náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé” tàbí “ìṣòtítọ́” fún “ìgbàgbọ́” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbàgbọ́ sì di pípé” tàbí “a sì mú ìgbàgbọ́ náà pé.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí dídé òpin ète tàbí ìdàgbàsókè tó pé.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Ìwọ rí i pé
  rationale: Ó pa ọ̀rọ̀ àsọyé tààrà sí ẹni kan mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ‘you see that.’
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις nínú àyíká yìí; ó pa ìtumọ̀ náà mọ́ láìfi tipátipá yan láàárín ìgbàgbọ́, ìgbẹ́kẹ̀lé àti ìṣòtítọ́.
- source_word: συνήργει
  choice: ń ṣiṣẹ́ pọ̀ pẹ̀lú
  rationale: Àmì ‘ń’ fi iṣẹ́ tó ń lọ lọ́wọ́ hàn, ‘ṣiṣẹ́ pọ̀ pẹ̀lú’ sì pa èrò ìfọwọ́sowọ́pọ̀ inú συνεργέω mọ́.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: pẹ̀lú àwọn iṣẹ́ rẹ̀
  rationale: ‘Àwọn iṣẹ́’ bá ọ̀rọ̀ James nípa ìgbàgbọ́ àti iṣẹ́ mu, ‘rẹ̀’ sì tọ́ka sí Abrahamu gẹ́gẹ́ bí αὐτοῦ ti ṣe.
- source_word: ἐκ τῶν ἔργων
  choice: nípasẹ̀ àwọn iṣẹ́ náà
  rationale: Ní àyíká yìí, ἐκ ń tọ́ka sí ohun tí ó jẹ́ ọ̀nà tàbí ohun tí ìmúṣẹ náà ti inú rẹ̀ wá; ‘nípasẹ̀’ sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: ἐτελειώθη
  choice: a mú ìgbàgbọ́ náà dé ìpé
  rationale: Ìkọ́lé aláìlórúkọ ẹni ‘a mú…’ pa ohùn àfaradà ti ọ̀rọ̀ Gíríìkì mọ́, ‘dé ìpé’ sì fi hàn pé ó dé ìmúṣẹ tàbí òpin tí ó yẹ láìsọ pé ìgbàgbọ́ náà ní àbùkù ìwà tẹ́lẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti iṣẹ́ nínú àríyànjiyàn James
  choice: A sọ pé ìgbàgbọ́ ń ṣiṣẹ́ pọ̀ pẹ̀lú àwọn iṣẹ́, àti pé nípasẹ̀ àwọn iṣẹ́ ni a fi mú un dé ìpé.
  alternative: A lè ṣàlàyé àwọn iṣẹ́ gẹ́gẹ́ bí ẹ̀rí ìgbàgbọ́ lójú ènìyàn nìkan, tàbí gẹ́gẹ́ bí ohun tó ń mú ìgbàgbọ́ dàgbà.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ìfọwọ́sowọ́pọ̀ àti dídé ìpé, ṣùgbọ́n kò ṣe àlàyé ẹ̀kọ́ ìdáláre kan ní kíkún. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyan ojú ìjọ kan.
- issue: Ìtumọ̀ πίστις nínú àyíká ẹ̀kọ́ ìgbàgbọ́ tó lè fa àríyànjiyàn
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: ‘Ìgbàgbọ́’ bá ọ̀rọ̀ àríyànjiyàn James 2 mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn níbi tó yẹ, ni a lò. Gbólóhùn náà jẹ́ tààrà, ó ní iyì, ó sì yẹ kí ó yé òǹkàwé Yorùbá òde òní. A pa ‘iṣẹ́’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú àríyànjiyàn James.
