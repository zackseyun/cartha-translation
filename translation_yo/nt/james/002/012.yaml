source:
  edition: SBLGNT
  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: yo
  text: Ẹ máa sọ̀rọ̀ báyìí, kí ẹ sì máa hùwà báyìí, bí àwọn tí a ó ṣe ìdájọ́ wọn nípasẹ̀ òfin òmìnira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Ẹ máa sọ̀rọ̀, kí ẹ sì máa hùwà
  rationale: Àwọn ọ̀rọ̀ àṣẹ onítẹ̀síwájú yìí ń pe àwọn olùgbọ́ sí ọ̀nà ìsọ̀rọ̀ àti ìgbé-ayé tí ó máa ń bá ìlànà náà mu; “hùwà” jẹ́ Yorùbá àdánidá fún ποιεῖτε nínú àyíká ìwà.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: bí àwọn tí a ó ṣe ìdájọ́ wọn
  rationale: Ó pa ìfiwéra ὡς mọ́, ó sì fi μέλλοντες àti ọ̀rọ̀ àìṣe kedere kúrò ní ẹni tó ń ṣe ìdájọ́ hàn lọ́nà Yorùbá tó ṣeé lóye.
- source_word: διὰ νόμου ἐλευθερίας
  choice: nípasẹ̀ òfin òmìnira
  rationale: “Nípasẹ̀” ń pa iye irinṣẹ́ tàbí ọ̀nà tí διὰ pẹ̀lú ọ̀rọ̀ apá-àbáwọlé lè ní mọ́, láì yí i sí “gẹ́gẹ́ bí” tàbí “lábẹ́”; “òfin òmìnira” tún pa ìṣọ̀kan ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ibasepọ̀ òfin òmìnira àti ìdájọ́
  choice: nípasẹ̀ òfin òmìnira
  alternative: nípasẹ̀ òfin tí ń fúnni ní òmìnira / gẹ́gẹ́ bí òfin òmìnira
  rationale: Ìtumọ̀ náà pa ìrọ̀rùn àti ìdọ̀tí ọ̀rọ̀ Gíríìkì νόμου ἐλευθερίας mọ́, kò sì pinnu láìní ẹ̀rí bóyá òfin náà ń mú òmìnira wá tàbí bóyá òmìnira ni ànímọ́ rẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. Àṣẹ “Ẹ máa ...” bá ọ̀pọ̀ ènìyàn tí lẹ́tà náà ń bá sọ̀rọ̀ mu. A kò fi àmì àlàyé ẹsẹ̀ sí i nítorí kò sí àfikún tó pọndandan.
