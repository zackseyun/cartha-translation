  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: yo
  text: Nítorí ẹni tí ó bá pa gbogbo òfin mọ́, ṣùgbọ́n tí ó kọsẹ̀ ní ohun kan, ó ti di ẹni tí ó jẹ̀bi ní ti gbogbo òfin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘kùnà ní ohun kan’ tàbí ‘rú apá kan nínú òfin.’ Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé ‘kọsẹ̀ ní ọ̀kan,’ ó sì lo ìkọsẹ̀ gẹ́gẹ́ bí àwòrán ìkùnà nípa ìwà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí ‘ó jẹ ẹni tí a lè mú ní ìdájọ́ ní ti gbogbo òfin.’ Gbólóhùn náà túmọ̀ sí pé rírú ohun kan jẹ́ kí ẹni náà jẹ̀bi ní ìbámu pẹ̀lú gbogbo òfin; kò fi dandan sọ pé ó ti rú gbogbo àṣẹ kọ̀ọ̀kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: ẹni tí ó bá
  rationale: Ó fi ìtumọ̀ arọ́pò-orúkọ aláìlẹ́nikan tó ń sọ ìlànà gbogbogbò hàn ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ὅλον τὸν νόμον
  choice: gbogbo òfin
  rationale: Ó pa ìtumọ̀ pé òfin náà lápapọ̀ mọ́ láìfi nǹkan kún un.
- source_word: τηρήσῃ
  choice: pa ... mọ́
  rationale: ‘Pa òfin mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún pípa tàbí ṣíṣe ohun tí òfin pàṣẹ.
- source_word: πταίσῃ
  choice: kọsẹ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, níbi tí ìkọsẹ̀ ti ń ṣàpẹẹrẹ ìkùnà nípa ìwà.
- source_word: ἐν ἑνί
  choice: ní apá kan
  rationale: Ó ṣàlàyé pé ìkọsẹ̀ náà wáyé ní ọ̀kan lára ohun tí òfin béèrè, láìdín ìtumọ̀ sí ìṣẹ̀lẹ̀ kan ṣoṣo.
- source_word: γέγονεν
  choice: ó ti di
  rationale: Ó fi ipò tí ó ti yọrí sí lẹ́yìn ìkọsẹ̀ hàn, gẹ́gẹ́ bí àkókò perfect Gíríìkì.
- source_word: πάντων
  choice: gbogbo rẹ̀
  rationale: ‘Rẹ̀’ tọ́ka sí gbogbo òfin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa ìtókasí àpapọ̀ mọ́.
- source_word: ἔνοχος
  choice: ẹni tí ó jẹ̀bi
  rationale: Ó mú ìtumọ̀ ẹ̀bi àti jíjíhìn níwájú òfin jáde ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n ẹ̀bi ẹni tó ṣẹ apá kan nínú òfin
  choice: Ẹni tó ṣẹ apá kan ti di ẹni tó jẹ̀bi ní ìbámu pẹ̀lú gbogbo òfin.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé ó ti dá gbogbo ẹ̀ṣẹ̀ kọ̀ọ̀kan, tàbí pé gbogbo ẹ̀ṣẹ̀ dọ́gba ní ìwọ̀n.
  rationale: πάντων ἔνοχος ń sọ jíjíhìn nípa gbogbo òfin; kò fi dandan sọ pé ẹni náà ti rú gbogbo àṣẹ kọ̀ọ̀kan tàbí pé gbogbo ìrúfin dọ́gba ní ìwọ̀n. Ìtumọ̀ náà pa agbára àti àìfìdí múlẹ̀ ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. ‘Kọsẹ̀’ pa àwòrán ìpilẹ̀ṣẹ̀ mọ́, àwọn àlàyé ìsàlẹ̀ sì ṣàfihàn àwọn ọ̀nà ìtumọ̀ mìíràn.
