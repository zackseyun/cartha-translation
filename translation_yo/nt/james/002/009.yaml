  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá ń ṣe ojúsàájú,[a] ẹ̀ṣẹ̀ lẹ ń ṣe, òfin sì ń dá yín lẹ́bi gẹ́gẹ́ bí àwọn arúfin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ń ṣe ojú ẹni kan ju ti ẹlòmíràn lọ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí dídájọ́ tàbí bíbá àwọn ènìyàn lò ní ìbámu pẹ̀lú ipò wọn tàbí ohun tí a rí lára wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òfin sì ń fi ẹ̀ṣẹ̀ yín hàn, ó sì ń kà yín sí àwọn tó rú òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ìtumọ̀ àídájú εἰ mọ́, ó sì fi ìyàtọ̀ pẹ̀lẹ́ tí δέ ń tọ́ka sí hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: προσωπολημπτεῖτε
  choice: ẹ bá ń ṣe ojúsàájú
  rationale: “Ṣe ojúsàájú” túmọ̀ sí ṣíṣe ojú ẹni kan ju ti ẹlòmíràn lọ nítorí ipò tàbí ohun tí a rí lára wọn; ó bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: ẹ ń dá ẹ̀ṣẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí ṣíṣe tàbí dídá ẹ̀ṣẹ̀; fọ́ọ̀mù tí ń lọ lọ́wọ́ tún fi agbára ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí hàn.
- source_word: ἐλεγχόμενοι
  choice: òfin sì ń dá yín lẹ́bi
  rationale: 'Ó fi ohùn àìṣe participle náà hàn ní ọ̀nà Yorùbá tó ṣe kedere: òfin ni ohun tó fi ìwà àìtọ́ wọn hàn, tó sì dá wọn lẹ́bi.'
- source_word: ὑπὸ τοῦ νόμου
  choice: òfin
  rationale: A kò sọ ọ́ di “Òfin Mósè” tàbí “òfin Ọlọ́run,” nítorí ọ̀rọ̀ Gíríìkì kò ṣe àlàyé tóóró bẹ́ẹ̀ níbí.
- source_word: ὡς παραβάται
  choice: gẹ́gẹ́ bí àwọn arúfin
  rationale: “Àwọn arúfin” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn tó ré òfin kọjá tàbí tó rú u, ó sì pa ìrísí ìdájọ́ inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Irú òfin tí Jákọ́bù ń tọ́ka sí nínú ìjíròrò ìwà rere rẹ̀
  choice: òfin
  alternative: Òfin Mósè; òfin Ọlọ́run
  rationale: A fi ìtóka náà sílẹ̀ ní fífẹ̀ bí Gíríìkì ṣe ṣe é, láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan kún un tàbí dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ni a lò. Èdè náà jẹ́ mímọ́, ọlọ́wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A yà participle Gíríìkì sí gbólóhùn aláṣẹ kejì pẹ̀lú “sì” kí ọ̀rọ̀ náà lè ṣàn dáadáa ní Yorùbá, láìyí ìbáṣepọ̀ rẹ̀ pẹ̀lú gbólóhùn àkọ́kọ́ padà.
