id: JAS.2.5
reference: James 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: yo
  text: Ẹ gbọ́, ẹ̀yin ará mi olùfẹ́[a]. Ọlọ́run kò ha yan àwọn tí ó jẹ́ tálákà ní ti ayé[b] gẹ́gẹ́ bí ọlọ́rọ̀ nínú ìgbàgbọ́[c] àti ajogún ìjọba tí Ọlọ́run ti ṣèlérí fún àwọn tí ó nífẹ̀ẹ́ rẹ̀?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì jẹ́ ‘àwọn arákùnrin mi,’ ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìpè tí ó kan gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin.
    reason: alternative_reading
  - marker: b
    text: Ó tún lè jẹ́ ‘àwọn tí ayé kà sí tálákà’ tàbí ‘àwọn tí ó jẹ́ tálákà ní ojú ayé.’
    reason: lexical_alternative
  - marker: c
    text: ‘Ìgbàgbọ́’ tún lè túmọ̀ sí ‘ìgbẹ́kẹ̀lé,’ tàbí, bí ó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó níbí, ‘ìdúróṣinṣin.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Ẹ fetí sílẹ̀
  rationale: Ọ̀rọ̀ àṣẹ náà ń pe ọ̀pọ̀ ènìyàn láti kíyè sí ohun tí yóò tẹ̀ lé. ‘Ẹ fetí sílẹ̀’ jẹ́ Yorùbá àdánidá tí ó sì pa agbára ìkìlọ̀ tàbí ìpè náà mọ́.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ẹ̀yin ará mi olùfẹ́
  rationale: ‘Ará’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọmọ ìjọ kan náà, ó sì lè kan ọkùnrin àti obìnrin láìpa ìtumọ̀ ìfẹ́ inú ἀγαπητοί run.
- source_word: οὐχ ... ἐξελέξατο
  choice: Ọlọ́run kò ha yan
  rationale: Ìbéèrè pẹ̀lú ‘kò ha’ fi hàn pé olùkọ̀wé ń retí ìdáhùn rere. ‘Yan’ túmọ̀ ἐξελέξατο ní tààrà láìfi èrò ẹ̀kọ́ ìsìn míì kún un.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: àwọn tí ó jẹ́ tálákà ní ti ayé
  rationale: ‘Ní ti ayé’ pa ìbáṣepọ̀ dative tí ó lè túmọ̀ sí ipò tàbí ìwọ̀n ayé mọ́, láìdá a mọ́ ‘ní ojú ayé’ nìkan.
- source_word: πλουσίους ἐν πίστει
  choice: ọlọ́rọ̀ nínú ìgbàgbọ́
  rationale: Ó pa àfiwé láàárín ipò òṣì ní ti ayé àti ọrọ̀ ní ti ìgbàgbọ́ mọ́. ‘Ìgbàgbọ́’ ni ìtumọ̀ tí ó bá àyíká yìí mu jù.
- source_word: κληρονόμους τῆς βασιλείας
  choice: ajogún ìjọba
  rationale: ‘Ajogún’ sọ ìtumọ̀ ìdílé àti ogún inú κληρονόμους ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: tí Ọlọ́run ṣe ìlérí rẹ̀ fún àwọn tí ó nífẹ̀ẹ́ rẹ̀
  rationale: A tún ‘Ọlọ́run’ sọ láti mú ẹni tí ó ṣe ìlérí náà ṣe kedere nínú Yorùbá; ‘àwọn tí ó nífẹ̀ẹ́ rẹ̀’ fi ìṣe tí ń ṣàpèjúwe wọn hàn.
theological_decisions:
- issue: Ìtumọ̀ yíyan Ọlọ́run
  choice: A lo ‘yan’ ní tààrà, láìṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ nípa àyànmọ́ tàbí ìpinnu ṣáájú.
  alternative: Lílo ọ̀rọ̀ tí yóò túmọ̀ yíyan náà gẹ́gẹ́ bí ìpinnu ìgbàlà láti ayérayé.
  rationale: Àyíká Jákọ́bù ń tako ojúsàájú, ó sì ń fi bí Ọlọ́run ṣe ka àwọn tálákà sí hàn; ẹsẹ yìí kò ṣàlàyé gbogbo ẹ̀kọ́ nípa ìyàn Ọlọ́run.
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: A lo ‘ará,’ ọ̀rọ̀ Yorùbá tí ó lè gba gbogbo àwọn onígbàgbọ́ inú àwùjọ náà.
  alternative: ‘Àwọn arákùnrin mi,’ tí yóò tẹ̀ lé akọ sloviki Gíríìkì ní tààrà ṣùgbọ́n tí ó lè dà bí ẹni pé ọkùnrin nìkan ni a ń bá sọ̀rọ̀.
  rationale: Nínú lẹ́tà, ἀδελφοί lè jẹ́ ọ̀rọ̀ ìpè fún gbogbo ìjọ. Àlàyé ìsàlẹ̀ fi ìrísí ọ̀rọ̀ Gíríìkì hàn.
- issue: Ìtumọ̀ πίστις
  choice: A lo ‘ìgbàgbọ́.’
  alternative: ‘Ìgbẹ́kẹ̀lé’ tàbí, èyí tí kò ṣeé ṣe tó níbí, ‘ìṣòtítọ́.’
  rationale: Nínú gbólóhùn ‘ọlọ́rọ̀ nínú ìgbàgbọ́,’ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé ni ìtumọ̀ tí ó bá àyíká mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ fetí sílẹ̀’ àti ìbéèrè ‘kò ha’ pa ìpè àti agbára ìbéèrè àsọyé Gíríìkì mọ́; àtúnlò ‘Ọlọ́run’ yọ ìṣiyèméjì girama Yorùbá kúrò láìyí ìtumọ̀ ẹ̀kọ́ ìsìn padà.
