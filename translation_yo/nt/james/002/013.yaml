id: JAS.2.13
reference: James 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: yo
  text: Nítorí ìdájọ́ kò ní àánú fún ẹni tí kò ṣe àánú; àánú ń ṣẹ́gun ìdájọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àánú ń yangàn lórí ìdájọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ fífi ara yangàn tàbí yọ ayọ̀ ìṣẹ́gun lórí ohun kan; níbí, a túmọ̀ rẹ̀ ní ọ̀nà àdánidá sí “ń ṣẹ́gun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: ìdájọ́
  rationale: Ó ń tọ́ka sí ìdájọ́ tàbí àyẹ̀wò onídàájọ́, ó sì pa ìtumọ̀ kan náà mọ́ ní ibi méjèèjì nínú ẹsẹ náà.
- source_word: ἀνέλεος
  choice: kì yóò ní àánú
  rationale: Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἔλεος, ‘àánú.’
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: fún ẹni tí kò ṣe àánú
  rationale: ‘Ṣe àánú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìṣe fífi àánú hàn, ó sì bá àṣà ọ̀rọ̀ orísun mu.
- source_word: κατακαυχᾶται
  choice: ń ṣẹ́gun
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí fífi ara yangàn tàbí yọ ayọ̀ ìṣẹ́gun lórí ohun kan; ‘ń ṣẹ́gun’ sọ agbára àkàwé náà ní Yorùbá tó ṣe kedere.
- source_word: ἔλεος
  choice: àánú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bójú mu fún mercy, ó sì jẹ́ kí àtúnlò ọ̀rọ̀ inú ẹsẹ náà hàn.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn κατακαυχᾶται ἔλεος κρίσεως
  choice: Àánú ń ṣẹ́gun ìdájọ́.
  alternative: Àánú ń yangàn lórí ìdájọ́.
  rationale: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí òwe àkótán tí kò ṣàlàyé ẹni tí àánú náà ti ọ̀dọ̀ rẹ̀ wá. Èyí kò fi tipátipá pinnu bóyá àánú Ọlọ́run, àánú tó ń ṣiṣẹ́ nígbà ìdájọ́, tàbí àánú tí onígbàgbọ́ ṣe ni a ń tẹnumọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ṣe àánú’ gẹ́gẹ́ bí gbólóhùn àdánidá, a sì fi àmì ohùn sí gbogbo ọ̀rọ̀ níbi tó yẹ.
