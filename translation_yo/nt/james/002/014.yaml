  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: yo
  text: Kí ni àǹfààní rẹ̀, ẹ̀yin ará mi[a], bí ẹnì kan bá sọ pé òun ní ìgbàgbọ́[b], ṣùgbọ́n tí kò ní àwọn iṣẹ́? Ṣé ìgbàgbọ́ yẹn[c] lè gbà á là?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “àwọn arákùnrin mi.” Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ, ṣùgbọ́n a máa ń lò ó gẹ́gẹ́ bí ọ̀rọ̀ ìkíni sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú πίστις sí “ìgbẹ́kẹ̀lé,” tàbí ní àwọn àyíká kan sí “ìṣòtítọ́”; “ìgbàgbọ́” bá ọ̀rọ̀ ẹni tó sọ pé òun ní í mu jù níbí.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé, “Ṣé irú ìgbàgbọ́ bẹ́ẹ̀ lè gbà á là?” Ní tààràtà, Gíríìkì ní “ìgbàgbọ́ náà,” ó sì ń tọ́ka padà sí ìgbàgbọ́ tí a sọ pé ó wà ṣùgbọ́n tí kò ní àwọn iṣẹ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: Kí ni àǹfààní rẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè àròsọ tí ó ń béèrè nípa àǹfààní tàbí èrè tó wúlò; ìtumọ̀ yìí bá èdè Yorùbá òde òní mu láì sọ ìbéèrè náà di gbólóhùn ìdájọ́.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin ará mi
  rationale: “Ará” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún pípè àwọn ọmọ ìjọ ní Yorùbá. Ó lè kan gbogbo àwùjọ, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí; àlàyé ìsàlẹ̀ tọ́ka sí èyí.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις níbi tí ẹnì kan ti sọ pé òun ní í. “Ìgbẹ́kẹ̀lé” ṣeé ṣe, ṣùgbọ́n “ìṣòtítọ́” kò bá ìkọ́lé yìí mu tó.
- source_word: λέγῃ τις ἔχειν
  choice: bí ẹnì kan bá sọ pé òun ní
  rationale: Ó tẹ̀ lé ìtumọ̀ gírámà Gíríìkì pé ẹni náà “sọ pé” ó ní ohun kan, láì fi ọ̀rọ̀ ìtumọ̀ tó lágbára bí “fẹnu kéde lásán” kún un.
- source_word: ἔργα δὲ μὴ ἔχῃ
  choice: ṣùgbọ́n tí kò ní àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” pa ìsopọ̀ ọ̀rọ̀ ἔργα mọ́ nínú gbogbo àríyànjiyàn Jákọ́bù 2. A kò fi “rere” kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: μὴ δύναται
  choice: Ṣé ... lè ...?
  rationale: Μή fi hàn pé ìbéèrè àròsọ náà ń retí ìdáhùn òdì. Ìbéèrè “Ṣé ... lè ...?” jẹ́ àdánidá ní Yorùbá, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi ìdáhùn tí a retí hàn.
- source_word: ἡ πίστις
  choice: ìgbàgbọ́ yẹn
  rationale: Atọ́ka náà ń tọ́ka padà sí ìgbàgbọ́ tí ẹni náà sọ pé òun ní ṣùgbọ́n tí kò ní àwọn iṣẹ́. “Yẹn” mú ìtọ́kasí padà yìí hàn láì sọ pé gbogbo ìgbàgbọ́ lápapọ̀ ni Jákọ́bù ń sẹ́.
- source_word: σῶσαι αὐτόν
  choice: gbà á là
  rationale: “Gbà ... là” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ìwọ̀n ẹ̀kọ́ ìgbàlà tó bá σῴζω mu ní àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti àwọn iṣẹ́ nínú ìbéèrè àròsọ
  choice: A túmọ̀ ἡ πίστις sí “ìgbàgbọ́ yẹn,” èyí tí ó tọ́ka sí ìgbàgbọ́ tí a ṣẹ̀ṣẹ̀ sọ pé kò ní àwọn iṣẹ́.
  alternative: “Ṣé ìgbàgbọ́ lè gbà á là?” tàbí “Ṣé irú ìgbàgbọ́ bẹ́ẹ̀ lè gbà á là?”
  rationale: Èyí pa ìtọ́kasí atọ́ka Gíríìkì mọ́, ó sì yàgò fún yíyanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ ju bí Jákọ́bù ṣe sọ ọ́ lọ. “Irú ... bẹ́ẹ̀” ṣeé ṣe, ṣùgbọ́n ó túmọ̀ sí i ní kedere ju ọ̀rọ̀ orísun lọ.
- issue: Ìrísí akọ nínú ọ̀rọ̀ ìkíni àti ẹni tí a ń tọ́ka sí
  choice: A lo “ẹ̀yin ará mi” fún àwùjọ, a sì lo “ẹ̀nì kan/òun/á” fún ẹni àpẹẹrẹ kan.
  alternative: “Ẹ̀yin arákùnrin mi” àti ọ̀rọ̀ akọ ní kedere.
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú àwọn arọ́pò-orúkọ wọ̀nyí. “Ará” jẹ́ ọ̀rọ̀ ìbátan tó bójú mu ní èdè Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa ìrísí akọ ọ̀rọ̀ Gíríìkì mọ́ fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún, ó sì ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá fún kíkà ní gbangba. A lo “Ṣé” fún ìbéèrè àròsọ òde òní, “àwọn iṣẹ́” láti pa àsopọ̀ pàtàkì nínú Jákọ́bù 2 mọ́, àti “gbà á là” gẹ́gẹ́ bí ọ̀rọ̀ ìgbàlà tó ṣe kedere.
