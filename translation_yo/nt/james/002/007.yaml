base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: yo
  text: Ṣé kì í ṣe àwọn fúnra wọn ni wọ́n ń sọ̀rọ̀-òdì sí orúkọ rere[a] tí a fi pè yín?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘orúkọ ọlọ́lá’ tàbí ‘orúkọ ológo.’
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, ‘tí a pè sórí yín.’ Ó ṣeé ṣe kí gbolohun náà tọ́ka sí orúkọ tí a fi ń dá àwọn onígbàgbọ́ mọ̀, bóyá pẹ̀lú àfọwọ́yẹ èdè májẹ̀mú tàbí ìrìbọmi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Àwọn fúnra wọn kọ́ ha ni
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè àròsọ tí ó ń retí ìdáhùn rere, ó sì tẹnu mọ́ pé àwọn ènìyàn kan náà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni wọ́n ń ṣe bẹ́ẹ̀. ‘Àwọn fúnra wọn’ pa ìtẹnumọ́ αὐτοὶ mọ́.
- source_word: βλασφημοῦσιν
  choice: ń sọ̀rọ̀-òdì sí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí sísọ̀rọ̀ ẹ̀gàn, ìbanilórúkọjẹ́, tàbí ọ̀rọ̀ àbùkù sí ènìyàn tàbí sí ohun mímọ́. ‘Sọ̀rọ̀-òdì sí’ jẹ́ èdè Yorùbá àdánidá tí ó pa agbára àti ìtumọ̀ ẹ̀sìn inú ọ̀rọ̀ náà mọ́ láì fi ìtumọ̀ kan pàtó kún un.
- source_word: τὸ καλὸν ὄνομα
  choice: orúkọ rere
  rationale: καλός níbí ní èrò ọlá, ìyì, àti ohun tí ó yẹ. ‘Orúkọ rere’ jẹ́ ọ̀rọ̀ Yorùbá tí ó yé kedere, tí ó sì lè tọ́ka sí orúkọ ọlọ́lá tí àwọn onígbàgbọ́ ń jẹ́ láì sọ ẹni tí orúkọ náà jẹ́ ní pàtó.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: tí a fi pè yín
  rationale: Ìtumọ̀ yìí sọ ọ̀nà àdánidá ní Yorùbá pé orúkọ náà ni a fi dá àwọn olùgbọ́ mọ̀. Ó yẹra fún gbolohun líle tí a bá tú ‘lórí yín’ ní tààràtà, nígbà tí àlàyé ìsàlẹ̀ ṣì pa àwòrán orúkọ tí a pè lé wọn lórí mọ́.
theological_decisions:
- issue: Ẹni tí ‘orúkọ rere’ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ náà sílẹ̀ ní gbígbòòrò gẹ́gẹ́ bí orúkọ ọlọ́lá tí àwọn onígbàgbọ́ ń jẹ́, ó sì ṣeé ṣe jù pé orúkọ Jésù/Olúwa ni.
  alternative: Kí a sọ ní tààràtà pé ‘orúkọ Kristi’ tàbí ‘orúkọ Ọlọ́run.’
  rationale: Gíríìkì kò dárúkọ Jésù ní ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé Jákọ́bù 2:1 mú kí ìtọ́kasí sí Jésù Olúwa ṣeé ṣe gidigidi. Nítorí náà, a kò fi ẹni tí orúkọ náà jẹ́ sínú ẹsẹ ní pàtó, kí àìdánilójú inú orísun má bàa parẹ́.
- issue: Àwòrán májẹ̀mú tàbí ìrìbọmi nínú ‘orúkọ tí a pè lé yín lórí’
  choice: A lo ‘tí a fi pè yín’ nínú ẹsẹ, a sì ṣàlàyé ìtumọ̀ gangan ní àlàyé ìsàlẹ̀.
  alternative: ‘Tí a pè lé yín lórí,’ èyí tí ó lè túmọ̀ àwòrán orísun ní tààràtà ṣùgbọ́n tí kò fi bẹ́ẹ̀ jẹ́ èdè Yorùbá àdánidá.
  rationale: Gbolohun Gíríìkì lè tọ́ka sí ìdánimọ̀ àwọn onígbàgbọ́, bóyá pẹ̀lú ìró èdè májẹ̀mú tàbí ìrìbọmi. A pa àǹfààní ìtumọ̀ wọ̀nyí mọ́ láì pinnu pé èyíkéyìí nìkan ni ó tọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ. Ìbéèrè àròsọ ‘kọ́ ha ni’ pa ìtẹnumọ́ àti ìretí ìdáhùn rere inú Gíríìkì mọ́.
