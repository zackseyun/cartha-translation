  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: yo
  text: Ẹ̀yin arákùnrin mi[a], ẹ má ṣe di ìgbàgbọ́ Olúwa wa Jesu Mèsáyà ológo[b][c][d] mú pẹ̀lú ojúsàájú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin arákùnrin àti arábìnrin mi.” Ọ̀rọ̀ Gíríìkì sọ pé “arákùnrin,” ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbàgbọ́ nínú Olúwa wa Jesu Mèsáyà.” Ìkọ̀lé Gíríìkì lè gba ìtumọ̀ ju ọ̀kan lọ.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìgbàgbọ́ Olúwa wa Jesu Mèsáyà ẹni ológo.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìgbàgbọ́ Olúwa wa Jesu Mèsáyà, Olúwa ògo.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ẹ̀yin arákùnrin mi
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlò gírámà, nítorí náà ‘arákùnrin’ pa ìtumọ̀ yẹn mọ́; àlàyé ìsàlẹ̀ fi hàn pé gbogbo àwùjọ àwọn onígbàgbọ́ ni a ń bá sọ̀rọ̀.
- source_word: μὴ ... ἔχετε
  choice: ẹ má ṣe ... di ... mú
  rationale: Àṣẹ ìdènà ni ọ̀rọ̀ Gíríìkì; ‘di ìgbàgbọ́ mú’ jẹ́ ọ̀nà Yorùbá àdánidá fún jíjẹ́wọ́ tàbí dídúró nínú ìgbàgbọ́.
- source_word: ἐν προσωπολημψίαις
  choice: fi ojúsàájú
  rationale: ‘Ojúsàájú’ sọ ìṣe fífi ojú rere kan ẹni kan ju ẹlòmíràn lọ ní èdè Yorùbá òde òní; ‘fi’ jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú dídì ìgbàgbọ́ mú ṣe kedere.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún πίστις, ó sì bójú mu nínú ọ̀rọ̀ nípa ìgbàgbọ́ Kristẹni.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Olúwa wa Jesu Mèsáyà
  rationale: A pa ìsopọ̀ ẹlẹ́ni-nǹkan Gíríìkì mọ́ ní ‘ìgbàgbọ́ Olúwa wa,’ láì fi tipátipá pinnu bóyá ó túmọ̀ sí ìgbàgbọ́ tí ó jẹ́ tirẹ̀ tàbí ìgbàgbọ́ nínú rẹ̀. Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà ‘Mèsáyà’ ni a lò.
- source_word: τῆς δόξης
  choice: ológo
  rationale: ‘Ológo’ jẹ́ Yorùbá àdánidá tó so ògo mọ́ Olúwa Jesu, ṣùgbọ́n àwọn ìtumọ̀ míì ti ìsopọ̀ Gíríìkì náà wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ oníṣẹ̀dá nínú τὴν πίστιν τοῦ κυρίου
  choice: ìgbàgbọ́ Olúwa wa Jesu Mèsáyà
  alternative: ìgbàgbọ́ nínú Olúwa wa Jesu Mèsáyà
  rationale: Ìkọ̀lé Gíríìkì lè gba ìtumọ̀ ju ọ̀kan lọ. Ọ̀rọ̀ àkọ́kọ́ pa ìṣòro náà mọ́ dé ibi tí Yorùbá ti lè gbà á, àlàyé sì fi ìtumọ̀ ‘nínú’ hàn.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àkójọpọ̀ oyè ‘Olúwa wa Jesu Mèsáyà,’ ìtumọ̀ oyè ẹni àmì-òróró ṣì lágbára; ‘Mèsáyà’ ni ó pa èyí mọ́ dáadáa.
- issue: Ìbáṣepọ̀ τῆς δόξης
  choice: ológo
  alternative: Olúwa ògo
  rationale: Gíríìkì lè jẹ́ àpèjúwe ‘ológo’ tàbí gbólóhùn oyè ‘Olúwa ògo.’ A yan Yorùbá àdánidá fún ọ̀rọ̀ àkọ́kọ́, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé.
- issue: Ìdánimọ̀ akọ nínú Ἀδελφοί
  choice: arákùnrin
  alternative: arákùnrin àti arábìnrin
  rationale: A pa akọ gírámà inú ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé jẹ́ kó yé pé ó ṣeé ṣe kí Jakọbu ń bá gbogbo àwùjọ onígbàgbọ́ sọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní. A lo ‘ojúsàájú’ dípò gbólóhùn àtijọ́ tó túmọ̀ ní tààrà sí gbígba ojú ẹni, a sì lo ‘di ìgbàgbọ́ mú’ fún ọ̀nà Yorùbá tó rọrùn láti lóye. Gbogbo àmì àlàyé [a]–[d] wà nínú ọ̀rọ̀ àkọ́kọ́.
