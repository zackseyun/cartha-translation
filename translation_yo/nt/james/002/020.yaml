source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: yo
  text: Ṣùgbọ́n, ìwọ ènìyàn òfo[a], ṣé o fẹ́ mọ̀ pé ìgbàgbọ́ láìsí àwọn iṣẹ́ kò wúlò[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwọ ènìyàn aláìnírònú” tàbí “ìwọ ènìyàn òmùgọ̀.” Ní gangan, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ènìyàn òfo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kò ṣiṣẹ́” tàbí “kò ní ipa.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí kò ṣiṣẹ́ tàbí tí kò mú èso jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Ṣùgbọ́n, ǹjẹ́ o fẹ́ mọ̀
  rationale: “Fẹ́ mọ̀” ṣàfihàn ìfẹ́ tàbí ìmúratán tí θέλεις ń sọ, “mọ̀” sì túmọ̀ γνῶναι ní tààrà; “Ṣùgbọ́n” gbé ipa δέ jáde nínú àríyànjiyàn náà.
- source_word: ὦ ἄνθρωπε κενέ
  choice: ìwọ ènìyàn aláìnírònú
  rationale: Àpèjúwe yìí jẹ́ ọ̀rọ̀ àdírẹ́sì sí ẹnì kan. “Aláìnírònú” jẹ́ Yorùbá àdánidá fún ẹni tí ọ̀rọ̀ rẹ̀ ṣófo tàbí tí kò ronú jinlẹ̀; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan “ènìyàn òfo” mọ́.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” bẹ̀rẹ̀ àkóónú ohun tí ó yẹ kí ẹni náà mọ̀, gẹ́gẹ́ bí ὅτι ṣe rí níbí.
- source_word: ἡ πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún πίστις nínú àríyànjiyàn Jákọ́bù.
- source_word: χωρὶς τῶν ἔργων
  choice: láìsí àwọn iṣẹ́
  rationale: “Láìsí” fi ìyapa tàbí àìsí tí χωρίς ń tọ́ka sí hàn, “àwọn iṣẹ́” sì pa ọ̀rọ̀ ἔργων mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἀργή ἐστιν
  choice: kò wúlò
  rationale: Nínú àyíká yìí, “kò wúlò” sọ ipa ἀργή gẹ́gẹ́ bí ohun tí kò ṣiṣẹ́, tí kò sì mú èso jáde, ní Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti àwọn iṣẹ́ nínú àríyànjiyàn Jákọ́bù
  choice: A sọ ní tààrà pé ìgbàgbọ́ láìsí àwọn iṣẹ́ kò wúlò.
  alternative: A lè sọ pé ó “jókòó lásán,” “kò ṣiṣẹ́,” tàbí pé “ó ti kú.”
  rationale: Ọ̀rọ̀ Gíríìkì ní ẹsẹ yìí ni ἀργή, kì í ṣe νεκρά. Nítorí náà, a kò rọ́pò rẹ̀ pẹ̀lú “ó ti kú” láti mú un bá àwọn ẹsẹ tó yí i ká mu, bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìsìn ẹgbẹ́ kankan sínú rẹ̀.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. “Ǹjẹ́” mú ìbéèrè náà ṣe kedere, àdírẹ́sì “ìwọ ènìyàn aláìnírònú” sì pa ìbáwí tó wà nínú orísun mọ́ láìdà bí ọ̀rọ̀ àjèjì.
