id: JAS.2.21
reference: James 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: yo
  text: Ṣé a kò dá Ábúráhámù baba wa láre nípa àwọn iṣẹ́, nígbà tí ó fi Ísáákì ọmọ rẹ̀ rú ẹbọ lórí pẹpẹ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi hàn pé ó jẹ́ olódodo,” tàbí “dá ẹ̀tọ́ rẹ̀ múlẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí kí a kéde ẹnì kan ní olódodo tàbí kí a fi hàn pé ó jẹ́ olódodo, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: baba wa
  rationale: Ó pa àwòrán ìbátan àti ìdánimọ̀ májẹ̀mú mọ́; ó tún jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédé ju ‘baba ńlá wa’ lọ ní àyíká yìí.
- source_word: ἐξ ἔργων
  choice: nípa àwọn iṣẹ́
  rationale: Ó fi iṣẹ́ hàn gẹ́gẹ́ bí ìpìlẹ̀ tàbí ọ̀nà tí ọ̀rọ̀ náà ní í ṣe pẹ̀lú, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún un.
- source_word: ἐδικαιώθη
  choice: dá ... láre
  rationale: ‘Dá láre’ ni ọ̀rọ̀ Yorùbá adayeba fún fífi ẹnì kan hàn tàbí kéde rẹ̀ gẹ́gẹ́ bí olódodo; àlàyé ìsàlẹ̀ pa àìdánilójú láàárín ìtumọ̀ ìkéde àti ìfihàn mọ́.
- source_word: ἀνενέγκας
  choice: nígbà tí ó fi ... rú ẹbọ
  rationale: Ó mú agbára àkókò ti apá-ìṣe aorist náà àti ìtumọ̀ ìrúbọ inú ἀναφέρω jáde ní Yorùbá adayeba.
- source_word: θυσιαστήριον
  choice: pẹpẹ
  rationale: Ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ibi ìrúbọ ni ‘pẹpẹ’; ọ̀rọ̀ ‘rú ẹbọ’ nínú gbólóhùn náà mú irú pẹpẹ tí a ń sọ ṣe kedere.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Ṣé a kò dá ... láre ...?
  rationale: Ó pa ìbéèrè àsọyé Gíríìkì tí ó ń retí ìdáhùn bẹ́ẹ̀ ni mọ́, ó sì jẹ́ ìṣètò ọ̀rọ̀ Yorùbá ti òde òní.
theological_decisions:
- issue: Ìtumọ̀ δικαιόω ní Jákọ́bù 2:21 ní ìbámu pẹ̀lú àwọn iṣẹ́
  choice: dá ... láre
  alternative: fi hàn pé ó jẹ́ olódodo; dá ẹ̀tọ́ rẹ̀ múlẹ̀; kéde rẹ̀ ní olódodo
  rationale: Àṣàyàn yìí pa ìsopọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú àríyànjiyàn nípa ìdáláre, láì pinnu pé agbára rẹ̀ jẹ́ ti ìkéde nìkan tàbí ti ìfihàn nìkan. Àwọn ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Ṣé’ mú ìbéèrè àsọyé náà dun bí Yorùbá adayeba, nígbà tí ‘a kò dá ... láre’ pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
