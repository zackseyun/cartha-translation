  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: yo
  text: 'Bẹ́ẹ̀ náà ni ìgbàgbọ́[a]: bí kò bá ní iṣẹ́, ó jẹ́ òkú ní ara rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé”; èyí tí kò ṣeé fẹ́ràn jù níbí ni “ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì pistis lè ní àwọn ìtumọ̀ wọ̀nyí, ṣùgbọ́n “ìgbàgbọ́” ló bá àríyànjiyàn Jákọ́bù nínú ẹsẹ yìí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni ó rí pẹ̀lú
  rationale: Gbólóhùn yìí so ọ̀rọ̀ náà mọ́ àpẹẹrẹ tó ṣáájú, ó sì fi ìbámu hàn ní Yorùbá àdánidá.
- source_word: ἡ πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àríyànjiyàn Jákọ́bù níhìn-ín, ọ̀rọ̀ náà tọ́ka sí ìgbàgbọ́ tí ẹni kan ní tàbí tí ó jẹ́wọ́ pé òun ní; “ìgbàgbọ́” pa ìtumọ̀ àti ìforígbárí ẹ̀kọ́ inú ẹsẹ náà mọ́.
- source_word: ἐὰν μὴ ἔχῃ
  choice: bí kò bá ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó bá gbólóhùn oníṣ条件 mu láì fi ìtumọ̀ míì kún un.
- source_word: ἔργα
  choice: iṣẹ́
  rationale: “Iṣẹ́” lè túmọ̀ sí àwọn ìṣe tí ó hàn gbangba, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú àríyànjiyàn tó yí ẹsẹ náà ká.
- source_word: νεκρά
  choice: ó jẹ́ òkú
  rationale: Èyí pa àkàwé líle tí Jákọ́bù lò mọ́, dípò lílọ sí ọ̀rọ̀ tó rọrùn bí “kò ní ẹ̀mí.”
- source_word: καθ’ ἑαυτήν
  choice: ní ara rẹ̀
  rationale: Ó fi ìgbàgbọ́ tí a yà sọ́tọ̀ kúrò lọ́dọ̀ iṣẹ́ hàn, láì ṣàlàyé ọ̀rọ̀ náà ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πίστις nínú ọ̀rọ̀ tó kan ìgbàgbọ́ àti iṣẹ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: “Ìgbàgbọ́” ló bá àríyànjiyàn Jákọ́bù mu jù níbí. A kò túmọ̀ ẹsẹ náà lọ́nà tó máa yanjú ìjiyàn ẹ̀kọ́ ìsìn ní ìdákẹ́jẹ̀; a pa gbólóhùn pé ìgbàgbọ́ tí kò ní iṣẹ́ jẹ́ òkú mọ́ gẹ́gẹ́ bí ó ti rí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Bẹ́ẹ̀ náà ni ó rí pẹ̀lú” jẹ́ àsopọ̀ àdánidá sí àpẹẹrẹ tó ṣáájú; “ní ara rẹ̀” sì pa ìtumọ̀ ìyàsọ́tọ̀ καθ’ ἑαυτήν mọ́.
