  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: yo
  text: Ẹ̀yin rí i pé nípa iṣẹ́ ni a ń dá ènìyàn láre[a][b], kì í ṣe nípa ìgbàgbọ́ nìkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “a ń fi hàn pé ó jẹ́ olódodo” tàbí “a ń fi hàn pé ó wà ní ẹ̀tọ́.” A pa ọ̀rọ̀ Jakọbu mọ́ láì pinnu àríyànjiyàn nípa bí lílo ọ̀rọ̀ yìí ṣe ní í ṣe pẹ̀lú lílo “dá láre” nínú àwọn lẹ́tà Paulu.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “ènìyàn” ní ọ̀nà aṣojú, ìyẹn ẹ̀dá ènìyàn lápapọ̀.
    reason: cultural_note
  - marker: c
    text: Fún “ìgbàgbọ́,” ó tún ṣeé ṣe láti túmọ̀ ọ̀rọ̀ Gíríìkì náà sí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé”; síbẹ̀, “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ nínú ìtumọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Ẹ̀yin rí i
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìfihàn sí ọ̀pọ̀ olùgbọ́, kì í ṣe àṣẹ. “Ẹ̀yin rí i” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ẹni kejì ọ̀pọ̀ àti ìtọ́kasí sí àpẹẹrẹ tó ṣáájú mọ́.
- source_word: ἐξ ἔργων
  choice: nípa iṣẹ́
  rationale: ἐξ pẹ̀lú ọ̀rọ̀-orúkọ oníbáàlà ń tọ́ka sí ìpìlẹ̀ tàbí ohun tí ọ̀rọ̀ náà gbára lé. “Nípa iṣẹ́” sọ èyí ní Yorùbá tó ṣe kedere láì fi ìtumọ̀ míì kún un.
- source_word: δικαιοῦται
  choice: a ń dá … láre
  rationale: “Dá … láre” ni ọ̀nà Yorùbá tó wọ́pọ̀ fún ìdáláre, ó sì lè gbé ìtumọ̀ pípè ní olódodo tàbí fífi hàn pé ẹni náà wà ní ẹ̀tọ́. A kò yanjú àríyànjiyàn ìtumọ̀ náà nínú ọ̀rọ̀ pàtàkì.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Nínú kókó yìí, ἄνθρωπος dúró fún ẹ̀dá ènìyàn lápapọ̀. “Ènìyàn” ni ìbámu Yorùbá tó péye, ó sì ní ìtumọ̀ aṣojú yìí láì dá ọ̀rọ̀ náà sí ọkùnrin nìkan.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ àti èyí tó wọ́pọ̀ jù lọ fún πίστις níbí; ó tún pa ìyàtọ̀ tó wà láàárín iṣẹ́ àti ìgbàgbọ́ mọ́.
- source_word: μόνον
  choice: nìkan
  rationale: “Nìkan” tẹnumọ́ ìyasọ́tọ̀ tí μόνον ní, ó sì wà lẹ́yìn “ìgbàgbọ́” ní ọ̀nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ δικαιοῦται àti bí ó ṣe kan ẹ̀kọ́ ìdáláre
  choice: a ń dá … láre
  alternative: a ń fi hàn pé … jẹ́ olódodo; a ń fi hàn pé … wà ní ẹ̀tọ́
  rationale: A pa ọ̀rọ̀ ìdáláre mọ́ nínú ọ̀rọ̀ pàtàkì kí a má bàa mú Jakọbu bá ìtumọ̀ ẹ̀kọ́ kan pàtó mu. Àlàyé ìsàlẹ̀ ojú ìwé fi àwọn ìtumọ̀ tó ṣeé ṣe nínú àyíká hàn.
- issue: Ìtumọ̀ aṣojú ti ἄνθρωπος
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ nípa gírámà, ἄνθρωπος níbí túmọ̀ sí ènìyàn lápapọ̀. Yorùbá “ènìyàn” pa agbára aṣojú rẹ̀ mọ́ dáadáa ju “ọkùnrin” lọ.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: Àyíká náà fi iṣẹ́ wé ìgbàgbọ́ tí ó dá wà. A yan ìtumọ̀ àkọ́kọ́ “ìgbàgbọ́,” ṣùgbọ́n a jẹ́ kí àlàyé tọ́ka sí àwọn ìtumọ̀ míì tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn “nípa iṣẹ́ ni” lo ìtẹnumọ́ Yorùbá láti pa ìyàtọ̀ ἐξ ἔργων … οὐκ ἐκ πίστεως μόνον mọ́, nígbà tí “a ń dá ènìyàn láre” pa ìrísí aláìsọ olùṣe ti Gíríìkì mọ́.
