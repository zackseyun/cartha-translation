id: JAS.2.26
reference: James 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí ara láìsí ẹ̀mí[a] ṣe jẹ́ òkú, bẹ́ẹ̀ náà ni ìgbàgbọ́[b] láìsí iṣẹ́ ṣe jẹ́ òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìsí èémí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ẹ̀mí” tàbí “èémí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí ìgbẹ́kẹ̀lé tàbí ìdúróṣinṣin; níbí, a lo ìtumọ̀ tí ó wọ́pọ̀ jù, “ìgbàgbọ́,” nínú ẹsẹ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé γὰρ mọ́, “gẹ́gẹ́ bí” sì ṣí àfiwé ὥσπερ sílẹ̀ ní Yorùbá àdánidá.
- source_word: τὸ σῶμα
  choice: ara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ara ènìyàn nípa ti ẹran mu.
- source_word: χωρὶς πνεύματος
  choice: láìsí ẹ̀mí
  rationale: “Láìsí” túmọ̀ χωρίς ní tààrà; “ẹ̀mí” sì pa ìtumọ̀ pàtàkì πνεῦμα mọ́, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí èémí tàbí mímí.
- source_word: νεκρόν ἐστιν
  choice: ṣe jẹ́ òkú
  rationale: “Jẹ́ òkú” sọ ipò ikú ní kedere, ó sì pa agbára àwòrán ọ̀rọ̀ Gíríìkì mọ́; “ṣe” mú ìhun àfiwé “gẹ́gẹ́ bí … bẹ́ẹ̀ náà ni” pé ní Yorùbá.
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó fi apá kejì àfiwé náà hàn ní ọ̀nà Yorùbá tí ó ṣe déédéé, ó sì pa ìtumọ̀ “bẹ́ẹ̀ pẹ̀lú” mọ́.
- source_word: ἡ πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ àti èyí tí ó bá àríyànjiyàn Jákọ́bù mu jù; a fi “ìṣòtítọ́” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó ṣeé ṣe.
- source_word: χωρὶς ἔργων
  choice: láìsí iṣẹ́
  rationale: Ó túmọ̀ gbólóhùn náà ní tààrà, ó sì pa ìsopọ̀ “iṣẹ́” mọ́ pẹ̀lú àríyànjiyàn gbogbo orí náà. Yorùbá lè lo “iṣẹ́” gẹ́gẹ́ bí orúkọ àkójọpọ̀ láìfi àmì ọ̀pọ̀ hàn.
- source_word: νεκρά ἐστιν
  choice: ṣe jẹ́ òkú
  rationale: Àtúnlò ọ̀rọ̀ kan náà pa ìbáramu àti agbára àsọyé Jákọ́bù mọ́.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος nínú àfiwé náà
  choice: ẹ̀mí
  alternative: èémí tàbí mímí
  rationale: “Ẹ̀mí” pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì àti àwòrán ohun tí ń fún ara ní ìyè mọ́. “Èémí/mímí” tún ṣeé ṣe, nítorí náà a kò fi pamọ́, ṣùgbọ́n a gbé e sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πίστις ní Jákọ́bù 2:26
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ nínú àyíká yìí, ó sì yàgò fún yíyanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ nípasẹ̀ àtúmọ̀ àsọyé. A tọ́ka sí “ìṣòtítọ́” gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ọ̀rọ̀ náà lè ní.
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti iṣẹ́
  choice: pa àfiwé “ìgbàgbọ́ láìsí iṣẹ́ … òkú” mọ́ ní tààrà
  alternative: ṣàlàyé irú ìgbàgbọ́ tàbí iṣẹ́ tí a ní lọ́kàn nínú ara ẹsẹ̀ náà
  rationale: Ọ̀rọ̀ Gíríìkì kò fi àlàyé àfikún bẹ́ẹ̀ sí i; fífi í kun un lè yanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí Jákọ́bù fi sílẹ̀ láìtọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìhun “gẹ́gẹ́ bí … bẹ́ẹ̀ náà ni” jẹ́ àdánidá, ó ní iyì, ó sì pa ìbáramu àfiwé Gíríìkì mọ́. A lo “òkú” lẹ́ẹ̀mejì láti pa àtúnlò àti ìtẹnumọ́ orísun mọ́.
