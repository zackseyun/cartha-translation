id: JAS.2.8
reference: James 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá ń mú òfin ọba[a] ṣẹ gẹ́gẹ́ bí Ìwé Mímọ́ ti wí pé, “Kí o fẹ́ aládùúgbò rẹ gẹ́gẹ́ bí ara rẹ,” ẹ ń ṣe dáadáa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “òfin ti ọba” tàbí “òfin ìjọba.” Ọ̀rọ̀ Gíríìkì náà ní “òfin ọba,” èyí tí ó lè tẹnu mọ́ pé láti ọ̀dọ̀ Ọba ni òfin náà ti wá tàbí pé ó ní ipò gíga jù lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Ṣùgbọ́n bí ẹ bá
  rationale: Ó pa ipò àídájú εἰ mọ́, ó sì fi ìyàtọ̀ kékeré tí μέντοι ń fi hàn kún un ní Yorùbá àdánidá.
- source_word: νόμον ... βασιλικὸν
  choice: òfin ọba
  rationale: Ó túmọ̀ βασιλικός ní ọ̀nà tó sún mọ́ ‘òfin tí ó jẹ́ ti ọba’ láì pinnu bóyá ìtumọ̀ náà dá lórí orísun rẹ̀ tàbí ipò gíga rẹ̀.
- source_word: τελεῖτε
  choice: ń mú ... ṣẹ
  rationale: Gbólóhùn yìí fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì mú èrò pípa ohun tí òfin béèrè ṣẹ jáde.
- source_word: κατὰ τὴν γραφήν
  choice: gẹ́gẹ́ bí Ìwé Mímọ́ ti wí pé
  rationale: Ó sọ ìbámu pẹ̀lú ohun tí Ìwé Mímọ́ sọ ní Yorùbá tó ṣe kedere, ó sì pa ẹyọ kan γραφή mọ́.
- source_word: Ἀγαπήσεις
  choice: Kí ìwọ kí ó fẹ́
  rationale: Ó pa agbára àṣẹ inú ọ̀rọ̀ ọjọ́ iwájú Gíríìkì mọ́, ó sì ní ìró ọ̀rọ̀ Ìwé Mímọ́ tó yẹ.
- source_word: τὸν πλησίον σου
  choice: aládùúgbò rẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni ẹlẹgbẹ́ ẹni nínú àṣẹ ìwà rere yìí.
- source_word: ὡς σεαυτόν
  choice: gẹ́gẹ́ bí ara rẹ
  rationale: Ó pa ìfiwéra kúkúrú inú Gíríìkì mọ́ láì fi ọ̀rọ̀ àlàyé kún un.
- source_word: καλῶς ποιεῖτε
  choice: ẹ ń ṣe dáadáa
  rationale: Ó jẹ́ ìfọwọ́sí ìṣe tó tọ́, ó sì pa àkókò ìsinsìnyí inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘òfin ọba’
  choice: A fi sílẹ̀ gẹ́gẹ́ bí òfin tí a pè ní ti ọba, láì sọ pàtó bóyá Ọba ni ó fún un tàbí pé ó ga jù lọ lára àwọn òfin.
  alternative: ‘òfin tó ga jù lọ’ tàbí ‘òfin ìjọba’
  rationale: βασιλικός lè tọ́ka sí ohun tí ó jẹ́ ti ọba, ipò gíga, tàbí ìbáṣepọ̀ pẹ̀lú ìjọba; ìtumọ̀ náà kò yẹ kí ó yan ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà ní ọlá, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ẹni-kejì ọ̀pọ̀ nínú Gíríìkì.
