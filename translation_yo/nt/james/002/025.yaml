id: JAS.2.25
reference: James 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: yo
  text: Bẹ́ẹ̀ náà sì ni Ráhábù, obìnrin aṣẹ́wó náà, a kò ha dá láre[a] nípasẹ̀ iṣẹ́, nígbà tí ó gba àwọn òjíṣẹ́ náà wọlé[b], tí ó sì rán wọn jáde ní ọ̀nà mìíràn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “fi hàn pé ó jẹ́ olódodo” tàbí “kéde pé ó jẹ́ olódodo.” Gíríìkì sọ pé “dá láre”; a pa ọ̀rọ̀ yẹn mọ́ láìyanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ohun tí a tẹnumọ̀ níhìn-ín.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “àwọn òjíṣẹ́.” Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn ọkùnrin tí Ráhábù gbà sí ilé (Joṣua 2), kì í ṣe àwọn áńgẹ́lì.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Bẹ́ẹ̀ náà sì ni
  rationale: Ó so àpẹẹrẹ Ráhábù mọ́ ti Ábúráhámù ní ẹsẹ tó ṣáájú, ó sì pa agbára ìfiwéra àti àfikún inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: Ῥαὰβ
  choice: Ráhábù
  rationale: Ìkọ orúkọ yìí tẹ̀ lé bí a ṣe máa ń mú àwọn orúkọ Bíbélì wọ èdè Yorùbá.
- source_word: ἡ πόρνη
  choice: obìnrin aṣẹ́wó náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí obìnrin tó ń ṣe iṣẹ́ aṣẹ́wó. Yíyan ọ̀rọ̀ yìí ṣe kedere, ó sì pa agbára ìtumọ̀ Gíríìkì mọ́ láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò ṣe kedere.
- source_word: οὐκ ... ἐδικαιώθη
  choice: a kò ha dá ... láre
  rationale: Gbólóhùn aláìlórúkọ olùṣe yìí fi ìṣe àìṣe ti Gíríìkì hàn, ó sì pa ìbéèrè tí ìdáhùn rẹ̀ hàn gbangba mọ́. “Dá láre” ni ọ̀rọ̀ Yorùbá tó bá δικαιόω mu jù láìfi tipátipá pinnu bóyá ohun tí a tẹnumọ̀ ni ìkéde òdodo tàbí fífi òdodo hàn.
- source_word: ἐξ ἔργων
  choice: nípa àwọn iṣẹ́
  rationale: Ó fi iṣẹ́ hàn gẹ́gẹ́ bí ìpìlẹ̀ tàbí ọ̀nà tí a ń sọ̀rọ̀ nípa rẹ̀ nínú àríyànjiyàn Jákọ́bù, ó sì bá ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ mu.
- source_word: ὑποδεξαμένη
  choice: nígbà tí ó gba ... wọlé
  rationale: Ó mú ìtumọ̀ gbígba àwọn àlejò tọkàntọkàn jáde, “nígbà tí” sì fi ìbáṣepọ̀ participle náà hàn lọ́nà tó rọrùn.
- source_word: τοὺς ἀγγέλους
  choice: àwọn òjíṣẹ́ náà
  rationale: ἄγγελος lè túmọ̀ sí áńgẹ́lì tàbí òjíṣẹ́. Nínú ìtàn Ráhábù, àwọn ènìyàn tí a rán ni a ń sọ̀rọ̀ nípa wọn; “òjíṣẹ́” pa ìtumọ̀ ọ̀rọ̀ náà mọ́ láìfi “amí” kún un tí Gíríìkì kò sọ ní tààrà.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: tí ó sì rán wọn jáde gba ọ̀nà mìíràn
  rationale: Níbí, ἐκβάλλω túmọ̀ sí ríran wọn jáde, kì í ṣe lílé wọn jáde pẹ̀lú agbára. “Gba ọ̀nà mìíràn” fi ìyàtọ̀ inú ἑτέρᾳ ὁδῷ hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ δικαιόω nínú Jákọ́bù 2:25 ní ìbáṣepọ̀ pẹ̀lú ìgbàgbọ́ àti iṣẹ́
  choice: Pa “dá láre” mọ́ nínú ọ̀rọ̀ pàtàkì láìdín ìtumọ̀ rẹ̀ kù sí ìdáláre níwájú ilé ẹjọ́ nìkan tàbí fífi òdodo ẹni hàn nìkan.
  alternative: “fi hàn pé ó jẹ́ olódodo” tàbí “kéde rẹ̀ ní olódodo”
  rationale: Ọ̀rọ̀ Jákọ́bù mọ̀ọ́mọ̀ pa ìfọ̀rọ̀wérọ̀ lórí ìdáláre àti iṣẹ́ mọ́. “Dá láre” pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ Gíríìkì àti àríyànjiyàn tó yí i ká mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé jẹ́wọ́ àwọn ìtumọ̀ míì láìyanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìbéèrè “a kò ha...” pa ìrísí ìbéèrè Gíríìkì tí ó retí ìdáhùn rere mọ́. A yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó, a sì pa ìṣòro ìtumọ̀ δικαιόω mọ́.
