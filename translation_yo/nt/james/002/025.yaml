  source_fidelity: Ìtumọ̀ náà ń pa ìbéèrè retóríkà Gíríìkì, Ráhábù gẹ́gẹ́ bí obìnrin aṣẹ́wó, ìdáláre, gbígba àwọn òjíṣẹ́, àti rírán wọn jáde ní ọ̀nà mìíràn mọ́. Ṣùgbọ́n “nípa àwọn iṣẹ́” lè túmọ̀ sí ‘nípa/kíkọ̀ọ́rọ̀ iṣẹ́,’ kì í ṣe ìpìlẹ̀ tàbí ọ̀nà ti ἐξ ἔργων dájú. “Nípasẹ̀ iṣẹ́” sun mọ́ ìbátan náà jù.
  naturalness: Ọ̀rọ̀ náà ní ìforúkọsílẹ̀ Yorùbá òde òní tó bófin mu. A tún ọ̀nà gbólóhùn ṣe díẹ̀ kí àfikún Ráhábù àti àpèjúwe rẹ̀ lè hàn kedere, a sì rọ́pò “gba ọ̀nà mìíràn” pẹ̀lú “ní ọ̀nà mìíràn,” èyí tó rọrùn sí i nínú àyíká rírán ènìyàn jáde.
  terminology: “Dá láre” jẹ́ ìbámu tó dára fún ἐδικαιώθη, ó sì yẹ kí ó wà nínú ọ̀rọ̀ pàtàkì láìpinnu ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́. “Òjíṣẹ́” ń tú ἀγγέλους ní ìbámu pẹ̀lú àyíká Joṣua 2, láìpe àwọn ọkùnrin náà ní áńgẹ́lì tàbí amí nínú ọ̀rọ̀ pàtàkì.
  issues:
