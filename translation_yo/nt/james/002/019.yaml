id: JAS.2.19
reference: James 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: yo
  text: Ìwọ gbàgbọ́ pé Ọlọ́run jẹ́ ọ̀kan[a]; o ṣe dáadáa. Àwọn ẹ̀mí èṣù pàápàá gbàgbọ́, wọ́n sì ń wárìrì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run kan ni ó wà.” Gíríìkì lè gba ìtumọ̀ méjèèjì; “Ọlọ́run jẹ́ ọ̀kan” sún mọ́ bí Gíríìkì ṣe gbé ọ̀rọ̀ kalẹ̀, ó sì lè tọ́ka sí ìjẹ́wọ́ àwọn Júù pé Ọlọ́run jẹ́ ọ̀kan.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “wọ́n sì ń gbọ̀n rìrì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì láti tẹnu mọ́ ẹni tí Jákọ́bù ń bá sọ̀rọ̀; “Ìwọ” pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
- source_word: πιστεύεις / πιστεύουσιν
  choice: gbàgbọ́ / gbàgbọ́
  rationale: Ìtúmọ̀ kan náà ni a lò ní ibi méjèèjì láti pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́, nítorí ìfiwéra ìgbàgbọ́ ẹni náà pẹ̀lú ti àwọn ẹ̀mí èṣù ṣe pàtàkì sí àríyànjiyàn náà.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Ọlọ́run jẹ́ ọ̀kan
  rationale: Èyí tẹ̀ lé ìsọ Gíríìkì pé “Ọlọ́run jẹ́ ọ̀kan,” ó sì pa ìṣeéṣe ìtọ́kasí sí ìjẹ́wọ́ pé Ọlọ́run jẹ́ ọ̀kan mọ́ láì fi “kan ṣoṣo” kún ọ̀rọ̀ orísun.
- source_word: καλῶς ποιεῖς
  choice: o ṣe dáadáa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìyìn kúkúrú náà, ó sì pa agbára ọ̀rọ̀ tó tẹ̀ lé e mọ́.
- source_word: καὶ
  choice: Àní ... pàápàá
  rationale: 'Àkójọpọ̀ yìí mú ipa ìgòkè καί jáde: kì í ṣe “àti” lásán, ṣùgbọ́n pé àwọn ẹ̀mí èṣù pàápàá ní irú ìgbàgbọ́ yìí.'
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: “Àwọn ẹ̀mí èṣù” jẹ́ ìsọ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ δαιμόνια mu láì sọ ọ́ di ohun míì.
- source_word: φρίσσουσιν
  choice: ń gbọ̀n rìrì
  rationale: Ọ̀rọ̀ yìí fi ìhùwà ara tí ẹ̀rù ń fà hàn ní Yorùbá, ó sì mú agbára φρίσσω jáde ju “ń bẹ̀rù” lásán lọ.
theological_decisions:
- issue: Ìsọ ìjẹ́wọ́ pé εἷς ἐστιν ὁ θεός
  choice: Ọlọ́run jẹ́ ọ̀kan
  alternative: Ọlọ́run kan ni ó wà
  rationale: Ìsọ tí a yàn sún mọ́ ètò àti ìtẹnumọ́ Gíríìkì, ó sì lè dún bí ìjẹ́wọ́ ìgbàgbọ́ Ísírẹ́lì. Àṣàyàn kejì ṣeé ṣe, ṣùgbọ́n ó yí ìtẹnumọ́ sí wíwà Ọlọ́run kan.
- issue: Ìyàtọ̀ láàárín ìgbàgbọ́ ẹni àti ìgbàgbọ́ àwọn ẹ̀mí èṣù
  choice: Àní àwọn ẹ̀mí èṣù pàápàá gbàgbọ́—wọ́n sì ń gbọ̀n rìrì
  alternative: Àwọn ẹ̀mí èṣù náà gbàgbọ́, wọ́n sì ń wárìrì
  rationale: '“Àní ... pàápàá” àti àmì ìdádúró gígùn mú ìfiwéra Jákọ́bù yọ dáadáa láì fi ẹ̀kọ́ kún ọ̀rọ̀: gbígba òtítọ́ kan gbọ́ nìkan kò tó.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, pẹ̀lú àmì ohùn ní kíkún. “Ìwọ” fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn; “Àní ... pàápàá” sì jẹ́ ọ̀nà àdánidá láti mú ipa ascensive καί jáde.
