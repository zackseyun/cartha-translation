  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: yo
  text: Bí arákùnrin kan tàbí arábìnrin kan kò bá ní aṣọ tó péye, tí kò sì ní oúnjẹ ojoojúmọ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wà ní ìhòòhò”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí kò wọ aṣọ rárá, ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí ẹni tí kò ní aṣọ tó péye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Bí ... bá
  rationale: Ó ṣe àfihàn gbólóhùn àdéhùn ní Yorùbá lọ́nà àdánidá, ó sì pa agbára ìròyìn ohun tí ó lè ṣẹlẹ̀ mọ́.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: arákùnrin kan tàbí arábìnrin kan
  rationale: Ó tú akọ àti abo tí Gíríìkì sọ ní pàtó jáde, ó sì pa èdè ìbátan àwọn onígbàgbọ́ mọ́.
- source_word: γυμνοὶ
  choice: kò ... ní aṣọ tó tó láti wọ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà túmọ̀ sí àìní aṣọ tó péye ju ìhòòhò pátápátá lọ; ìtumọ̀ yìí ṣe kedere ní Yorùbá òde òní.
- source_word: ὑπάρχωσιν
  choice: bá ní
  rationale: Ọ̀rọ̀-ìṣe náà ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ tó ń sọ ipò ẹni; ìṣètò ‘bá ní’ bá gbólóhùn àdéhùn Yorùbá mu.
- source_word: λειπόμενοι
  choice: kò sì ní
  rationale: Ó fi àìní tó ń bá a lọ hàn ní ọ̀nà tó rọrùn, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: oúnjẹ ojoojúmọ́
  rationale: Ó túmọ̀ sí oúnjẹ tí a nílò fún ọjọ́ kọ̀ọ̀kan, ó sì bá ìlò Yorùbá mu.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀδελφὸς ἢ ἀδελφή nínú àwùjọ Kristẹni
  choice: Pa ‘arákùnrin kan tàbí arábìnrin kan’ mọ́ gẹ́gẹ́ bí èdè ìbátan tí Jákọ́bù lò, tí ó ṣeé ṣe kí ó tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́.
  alternative: Ẹnikẹ́ni tó jẹ́ aláìní lápapọ̀
  rationale: Àyíká ọ̀rọ̀ náà lo èdè arákùnrin àti arábìnrin fún àwọn ọmọ ìjọ; ìtumọ̀ náà pa ọ̀rọ̀ yẹn mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. Lílò ‘wọn’ lẹ́yìn ‘arákùnrin kan tàbí arábìnrin kan’ jẹ́ arọ́pò-orúkọ alákòóso abo ní Yorùbá, kì í ṣe ọ̀pọ̀ ènìyàn dandan.
