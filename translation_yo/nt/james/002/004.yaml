source:
  edition: SBLGNT
  text: ⸀οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/004.yaml
  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: yo
  text: Ṣé ẹ kò ha ṣe ìyàtọ̀ láàárín ara yín,[a] tí ẹ sì di àwọn onídàájọ́ tí èrò wọn burú?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹ kò ha fi ojúsàájú hàn láàárín ara yín?” Ọ̀rọ̀ ìṣe náà tún lè túmọ̀ sí “ní ìpínyà láàárín ara yín” tàbí, nínú àwọn àyíká ọ̀rọ̀ míì, “ṣiyèméjì”; ṣùgbọ́n níbí, àyíká ọ̀rọ̀ ń tọ́ka sí ṣíṣe ìyàtọ̀ aláìtọ́ sí àwọn ènìyàn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “àwọn onídàájọ́ àwọn ìrònú búburú,” tàbí “àwọn onídàájọ́ èrò búburú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: ṣe ìyàtọ̀
  rationale: Nínú àyíká ọ̀rọ̀ Jakọbu 2:1–3, ọ̀rọ̀ náà ń tọ́ka sí ṣíṣe ìyàtọ̀ aláìtọ́ láàárín ọlọ́rọ̀ àti tálákà. “Ṣe ìyàtọ̀” pa ìtumọ̀ ìpìlẹ̀ mọ́ láì fi “ojúsàájú” tí ó túmọ̀ sí ohun tóóró díẹ̀ rọ́pò rẹ̀.
- source_word: ἐν ἑαυτοῖς
  choice: láàárín ara yín
  rationale: Èyí bá ipò ìjọ tí wọ́n ti ń hùwà sí ara wọn mu, ó sì ṣàfihàn pé ìyàtọ̀ náà wà láàárín àwọn ọmọ ẹgbẹ́.
- source_word: ἐγένεσθε
  choice: di
  rationale: '“Di” jẹ́ ọ̀nà Yorùbá àdánidá láti fi àbájáde ìṣe wọn hàn: nípa ṣíṣe ìyàtọ̀, wọ́n ti di irú àwọn onídàájọ́ kan.'
- source_word: κριταὶ
  choice: àwọn onídàájọ́
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì pa agbára ọ̀rọ̀ ìbáwí àti ìdájọ́ mọ́.
- source_word: διαλογισμῶν πονηρῶν
  choice: tí èrò wọn burú
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún àwọn onídàájọ́ tí ìrònú tàbí ìgbèrò búburú ń darí, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐ
  choice: Ṣé ẹ kò ha
  rationale: Ìṣètò yìí mú kí ìbéèrè àròsọ tí ó ń retí ìdáhùn bẹ́ẹ̀ ni àti agbára ìbáwí rẹ̀ ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ διακρίνω ní ìbámu pẹ̀lú ojúsàájú
  choice: Ẹsẹ̀ náà ń bá ṣíṣe ìyàtọ̀ aláìtọ́ láàárín àwọn onígbàgbọ́ wí.
  alternative: Ẹsẹ̀ náà ń sọ pé ọkàn wọn pín tàbí pé wọ́n ń ṣiyèméjì.
  rationale: Àyíká ọ̀rọ̀ tó sún mọ́ ọn jù lọ, Jakọbu 2:1–3, jẹ́ nípa bí wọ́n ṣe gbé ọlọ́rọ̀ ga ju tálákà lọ. Nítorí náà, ìtumọ̀ ṣíṣe ìyàtọ̀ bá àríyànjiyàn náà mu ju ìtumọ̀ ṣíṣiyèméjì lọ, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè ní àwọn ìtumọ̀ míì ní ibòmíràn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé yé fún gbogbo ènìyàn. “Ṣé … kò ha” pa ohùn ìbéèrè àròsọ àti ìbáwí mọ́; “láàárín ara yín” sì bá ipò àwùjọ ìjọ mu. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
