  to: Ẹ̀yin arákùnrin mi[a], igi ọ̀pọ̀tọ́ ha lè so èso ólífì, tàbí àjàrà so èso ọ̀pọ̀tọ́ bí? Bẹ́ẹ̀ náà ni omi iyọ̀ kò lè mú omi tí kò ní iyọ̀ jáde.[b]
