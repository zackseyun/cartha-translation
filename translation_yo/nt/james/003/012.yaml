  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: yo
  text: Ẹ̀yin arákùnrin mi[a], igi ọ̀pọ̀tọ́ ha lè so èso ólífì, tàbí àjàrà so èso ọ̀pọ̀tọ́ bí? Bẹ́ẹ̀ náà ni omi iyọ̀ kò lè mú omi tí kò ní iyọ̀ jáde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin arákùnrin àti arábìnrin mi.” Ọ̀rọ̀ Gíríìkì náà ní “arákùnrin,” ọ̀rọ̀ akọ ní ọ̀pọ̀ tí a lè lò fún àwùjọ tí àwọn ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gidi, “omi dídùn.” Nínú àyíká yìí, ìtumọ̀ rẹ̀ ni omi tí kò ní iyọ̀. Gbólóhùn Gíríìkì náà kuru, a sì tún lè lóye rẹ̀ ní ìbámu pẹ̀lú àwòrán orísun omi ní ẹsẹ tó ṣáájú pé: “Orísun omi iyọ̀ kò sì lè mú omi tí kò ní iyọ̀ jáde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Ẹ̀yin arákùnrin mi
  rationale: Ó pa ọ̀rọ̀ ìpè akọ ní ọ̀pọ̀ mọ́ gẹ́gẹ́ bí Gíríìkì, bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́; àlàyé ìsàlẹ̀ fún ìtumọ̀ tí ó kó obìnrin mọ́ ọn.
- source_word: μὴ δύναται
  choice: ha lè ... bí?
  rationale: μή mú kí ìbéèrè náà retí ìdáhùn òdì; ìbéèrè pẹ̀lú ‘ha lè ... bí?’ jẹ́ Yorùbá àdánidá tí ó fi ìretí yẹn hàn.
- source_word: συκῆ
  choice: igi ọ̀pọ̀tọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí igi náà, kì í ṣe èso nìkan.
- source_word: ἐλαίας ποιῆσαι
  choice: so èso ólífì
  rationale: ποιέω ní àyíká yìí túmọ̀ sí mímú èso jáde; ‘so èso’ ni ọ̀rọ̀ Yorùbá àdánidá fún ohun tí igi ń ṣe.
- source_word: ἄμπελος
  choice: àjàrà
  rationale: Ó jẹ́ orúkọ Yorùbá tí ó wọ́pọ̀ fún grapevine, ó sì bá àwòrán iṣẹ́ ọ̀gbìn mu.
- source_word: σῦκα
  choice: èso ọ̀pọ̀tọ́
  rationale: Ó túmọ̀ sí àwọn èso ọ̀pọ̀tọ́; Yorùbá kò fi dandan samisi ọ̀pọ̀ lẹ́yìn ọ̀rọ̀-ìṣe yìí.
- source_word: οὔτε ἁλυκὸν
  choice: Bẹ́ẹ̀ ni omi iyọ̀ kò lè
  rationale: Gíríìkì náà kuru, ἁλυκόν sì jẹ́ àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ. ‘Omi iyọ̀’ pa ìtumọ̀ mọ́ láì pinnu pé ‘orísun omi iyọ̀’ ni dandan.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: mú omi tútù jáde
  rationale: γλυκύς túmọ̀ ní ti gidi sí ‘dídùn,’ ṣùgbọ́n nígbà tí a bá ń sọ̀rọ̀ nípa omi, ó ń ṣe ìyàtọ̀ sí omi iyọ̀, ìtumọ̀ rẹ̀ sì ni omi tí kò ní iyọ̀. ‘Omi tútù’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fresh water ní àyíká yìí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘so èso’ fún ìṣelọpọ èso igi, a sì pa àìdájú inú gbólóhùn ìkẹyìn mọ́ nínú àlàyé ìsàlẹ̀.
