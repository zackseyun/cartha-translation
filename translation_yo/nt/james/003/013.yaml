source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: yo
  text: Ta ni ó gbọ́n, tí ó sì ní òye láàárín yín? Kí ó fi àwọn iṣẹ́ rẹ̀ hàn nípasẹ̀ ìwà rere rẹ̀, pẹ̀lú ìwà tútù tí ọgbọ́n ń mú wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìwà tútù ọgbọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Ta ni ó gbọ́n, tí ó sì ní òye láàárín yín?
  rationale: Ó ṣe àfihàn ìbéèrè àsọyé náà ní Yorùbá àdánidá; “gbọ́n” tọ́ka sí ọgbọ́n ìwà àti ìṣe, “ní òye” sì mú ìtumọ̀ ẹni tó mọ ohun tí ó ń ṣe jáde.
- source_word: δειξάτω
  choice: Kí ó ... hàn
  rationale: Ìkọ̀sẹ̀ àṣẹ ẹni kẹta ẹyọ kan ni, ó sì pa ìtumọ̀ aṣojú ẹni kọ̀ọ̀kan nínú àwùjọ mọ́.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: nípa ... ìwà rere rẹ̀
  rationale: ἀναστροφή túmọ̀ sí ìwà tàbí ìlànà ìgbésí ayé; “ìwà rere” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àyíká ìkìlọ̀ ìwà mu. ἐκ níbí fi ọ̀nà tàbí orísun ìfihàn hàn.
- source_word: τὰ ἔργα αὐτοῦ
  choice: àwọn iṣẹ́ rẹ̀
  rationale: “Àwọn iṣẹ́” pa ìsopọ̀ ọ̀rọ̀ ἔργα mọ́ pẹ̀lú ìtẹnumọ́ Jákọ́bù lórí iṣẹ́, αὐτοῦ sì jẹ́ “rẹ̀.”
- source_word: ἐν πραΰτητι σοφίας
  choice: pẹ̀lú ìrẹ̀lẹ̀ tí ó ti inú ọgbọ́n wá
  rationale: Ó ṣàlàyé ìbáṣepọ̀ genitive náà lọ́nà Yorùbá àdánidá gẹ́gẹ́ bí ìrẹ̀lẹ̀ tàbí ìwà tútù tí ọgbọ́n ń mú wá, láì sọ πραΰτης di àìlera.
theological_decisions:
- issue: Àṣẹ ẹyọ kan àti agbára aṣojú rẹ̀
  choice: Kí ó ...
  alternative: Kí irú ẹni bẹ́ẹ̀ ...
  rationale: Gíríìkì lo àṣẹ ẹni kẹta ẹyọ kan. Yorùbá “ó” kò fi akọ tàbí abo hàn, ṣùgbọ́n ó pa ẹyọ kan àti agbára aṣojú ẹni kankan nínú àwùjọ mọ́ láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
- issue: Ìbáṣepọ̀ πραΰτητι àti σοφίας
  choice: ìrẹ̀lẹ̀ tí ó ti inú ọgbọ́n wá
  alternative: ìrẹ̀lẹ̀ ọgbọ́n
  rationale: Genitive náà lè tọ́ka sí ànímọ́ tàbí orísun. Àyípadà àkọ́kọ́ jẹ́ Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa àṣàyàn tí ó sun mọ́ ìṣètò Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A kò nílò àlàyé ìsàlẹ̀ fún akọ nítorí arọ́pò-orúkọ Yorùbá “ó” kò ní akọ tàbí abo.
