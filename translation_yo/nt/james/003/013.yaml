  to: Ta ni ó gbọ́n, tí ó sì ní òye láàárín yín? Kí ó fi àwọn iṣẹ́ rẹ̀ hàn nípasẹ̀ ìwà rere rẹ̀, pẹ̀lú ìwà tútù tí ọgbọ́n ń mú wá.[a]
  rationale: 'Àtúnṣe náà tún ìtòlẹ́sẹẹsẹ gbolóhùn Gíríìkì ṣe: àwọn iṣẹ́ ni a ń fi hàn, ìwà rere sì ni ọ̀nà tàbí ìpìlẹ̀ ìfihàn wọn. Ó tún yàn “ìwà tútù” fún πραΰτης, nígbà tí àlàyé ìsàlẹ̀ ń pa ọ̀nà tí ó sún mọ́ ìṣètò Gíríìkì, “ìwà tútù ọgbọ́n,” mọ́. Àìdánilójú genitive σοφίας ni a kò fọ́ tán; ìtumọ̀ àkọ́kọ́ náà ń fi í hàn gẹ́gẹ́ bí ìwà tútù tí ọgbọ́n ń mú wá.'
