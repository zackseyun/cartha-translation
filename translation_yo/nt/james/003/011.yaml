  source_fidelity: Ìtumọ̀ náà fi ìbéèrè àròsọ μήτι hàn dáadáa nípasẹ̀ “Ṣé … lè … bí?”, èyí tí ó ń retí ìdáhùn òdì. “Orísun,” “láti ẹnu kan náà,” àti “tú … jáde” fara mọ́ πηγή, ἐκ τῆς αὐτῆς ὀπῆς, àti βρύει. “Omi dídùn àti omi kíkorò” ṣàfihàn àwọn ajẹtífù tí a lò bí nọ́ńbà nínú Gíríìkì, láì fi ìtumọ̀ àfikún kún un.
