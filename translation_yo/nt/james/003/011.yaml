  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: yo
  text: Ṣé orísun kan lè máa tú omi dídùn àti omi kíkorò jáde láti ẹnu kan náà bí?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτι
  choice: Ṣé ... lè ... bí?
  rationale: μήτι mú ìbéèrè àròsọ tí a ń retí ìdáhùn òdì wá. Ìlànà ‘Ṣé ... lè ... bí?’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìbéèrè náà hàn.
- source_word: πηγή
  choice: orísun
  rationale: Ní àyíká yìí, πηγή túmọ̀ sí orísun omi àdánidá; ‘orísun’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: láti ẹnu kan náà
  rationale: ὀπή túmọ̀ sí ihò tàbí ààyè tí ohun ti ń jáde. ‘Ẹnu’ jẹ́ àwòrán àdánidá ní Yorùbá fún ibi tí omi orísun ti ń jáde, kò sì mú kí gbólóhùn náà le.
- source_word: βρύει
  choice: máa tú ... jáde
  rationale: βρύω ń tọ́ka sí ohun tí ń sun tàbí ń tú jáde lọ́pọ̀. ‘Máa tú ... jáde’ pa àwòrán omi tí ń jáde mọ́, ó sì bá ìbéèrè nípa ohun tí orísun lè ṣe mu.
- source_word: τὸ γλυκὺ καὶ τὸ πικρόν
  choice: omi dídùn àti omi kíkorò
  rationale: Àwọn ajẹtífù Gíríìkì náà dúró gẹ́gẹ́ bí nọ́ńbà, wọ́n sì ń tọ́ka sí omi. Fífi ‘omi’ hàn ní Yorùbá mú ìtumọ̀ náà ṣe kedere, nígbà tí ‘dídùn’ àti ‘kíkorò’ pa ìyàtọ̀ gangan mọ́.
