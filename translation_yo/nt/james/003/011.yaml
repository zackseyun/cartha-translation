  terminology: 'Àwọn ọ̀rọ̀ pàtàkì náà yẹ: orísun fún orísun omi, omi dídùn àti omi kíkorò fún ìyàtọ̀ γλυκύ/πικρόν. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí ìtumọ̀ ẹgbẹ́-ẹ̀sìn tí a fi kún un.'
