translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó lóye fún gbogbo ènìyàn, ó sì pa ìbéèrè àròsọ tí ó ń retí ìdáhùn òdì mọ́.
