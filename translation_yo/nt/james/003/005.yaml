source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ahọ́n jẹ́ ẹ̀yà ara kékeré, síbẹ̀ ó ń fọ́nnu nípa ohun ńlá. Ẹ wo bí iná kékeré[a] kan ṣe ń sun igbó ńlá tó bẹ́ẹ̀!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìgbọ́yé ìyàlẹ́nu: “Ẹ wo iná tóbi tó tí ó ń sun igbó tóbi tó!” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ìkíni ìyàlẹ́nu; ṣùgbọ́n ìtumọ̀ inú ọ̀rọ̀ náà ń tẹ̀lé àfiwéra ahọ́n gẹ́gẹ́ bí ẹ̀yà ara kékeré tí ó lè ní ipa ńlá.'
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: ahọ́n
  rationale: Ó pa àwòrán ẹ̀yà ara mọ́ dípò kí a túmọ̀ rẹ̀ sí ọ̀rọ̀ sísọ.
- source_word: μικρὸν μέλος
  choice: ẹ̀yà ara kékeré
  rationale: Èyí jẹ́ Yorùbá àdánidá, ó sì pa ìfiwéra pẹ̀lú àwọn ẹ̀yà ara tó wà ní àyíká ẹsẹ náà mọ́.
- source_word: μεγάλα αὐχεῖ
  choice: ó ń fọ́nnu nípa àwọn ohun ńlá
  rationale: Ó fi ìtumọ̀ ọ̀rọ̀ Gíríìkì hàn gẹ́gẹ́ bí ìsọ̀rọ̀ ìgbéraga tàbí fífi ohun ńlá yangàn, láì sọ ohun tí a ń fọ́nnu lé lórí ní pàtó.
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ Yorùbá òde òní tó ń pe àfiyèsí olùgbọ́ sí àpẹẹrẹ tó tẹ̀ lé ni.
- source_word: ἡλίκον πῦρ
  choice: iná kékeré
  rationale: Àyíká ọ̀rọ̀ ń tẹnumọ́ bí ohun kékeré ṣe lè fa àbájáde ńlá, bí ahọ́n ṣe jẹ́ ẹ̀yà kékeré.
- source_word: ἡλίκην ὕλην
  choice: igbó ńlá kan
  rationale: ὕλη lè túmọ̀ sí igbó, igi, tàbí ohun ìdáná; “igbó” mú àwòrán iná tó ń tàn ká ibi gbígbòòrò yé ni Yorùbá.
- source_word: ἀνάπτει
  choice: lè jó ... run
  rationale: Ìsọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì fi hàn pé iná náà mú kí igbó jó gidigidi.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, tó ṣe kedere, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yà ara” dípò ọ̀rọ̀ amọ̀ṣẹ́dunjú, a sì lo “igbó” fún àwòrán ὕλη.
