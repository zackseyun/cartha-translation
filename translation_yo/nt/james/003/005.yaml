revisions:
- from: Bẹ́ẹ̀ náà ni ahọ́n jẹ́ ẹ̀yà ara kékeré, síbẹ̀ ó ń fọ́nnu nípa àwọn ohun ńlá. Ẹ wò ó, iná kékeré lè jó igbó ńlá kan run![a]
  to: Bẹ́ẹ̀ náà ni ahọ́n jẹ́ ẹ̀yà ara kékeré, síbẹ̀ ó ń fọ́nnu nípa ohun ńlá. Ẹ wo bí iná kékeré[a] kan ṣe ń sun igbó ńlá tó bẹ́ẹ̀!
  rationale: A rọ́pò ọ̀rọ̀ tí ń fi ìṣeéṣe àti ìparun pátápátá kún ìtumọ̀ náà pẹ̀lú ìṣe lọwọlọwọ tó bá ἀνάπτει mu. A tún gbé àmì ẹsẹ̀-ìsàlẹ̀ sí ọ̀dọ̀ “kékeré,” ibi tí ìtumọ̀ ἡλίκον tí a ń jiyàn kan sí, a sì tún ọ̀rọ̀ ẹsẹ̀-ìsàlẹ̀ kọ́ kí ó jẹ́ Yorùbá kedere, kí ó má sì pa àìdájú ìtumọ̀ rẹ̀ rẹ́.
