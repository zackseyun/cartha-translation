id: JAS.3.15
reference: James 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: yo
  text: Ọgbọ́n yìí kì í ṣe ọgbọ́n tí ó ń sọ̀kalẹ̀ láti òkè wá; kàkà bẹ́ẹ̀, ó jẹ́ ti ayé, ti ẹ̀dá lásán[a], àti ti ẹ̀mí èṣù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò jẹ́ ti Ẹ̀mí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí ó jẹ́ ti ìgbésí ayé ẹ̀dá lásán, ní ìtakora sí ohun tí ó jẹ́ ti Ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Ọgbọ́n yìí
  rationale: Ó tọ́ka ní tààrà sí irú ọgbọ́n tí àyíká ọ̀rọ̀ ṣáájú ṣẹ̀ṣẹ̀ ṣàpèjúwe, láìfi àlàyé mìíràn kún un.
- source_word: ἄνωθεν
  choice: láti òkè
  rationale: Èyí pa ìtumọ̀ ibi-orísun náà mọ́, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ohun tí ó wá láti ọ̀dọ̀ Ọlọ́run nínú Jákọ́bù dúró láìtúmọ̀ ọ́ ní pàtó sí ‘láti ọ̀run.’
- source_word: κατερχομένη
  choice: tí ń sọ̀kalẹ̀ ... wá
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ ni participle náà ń fi hàn; ọ̀nà yìí sì jẹ́ èdè Yorùbá àdánidá fún ohun tí ń ti òkè sọ̀kalẹ̀.
- source_word: ἐπίγειος
  choice: ti ayé
  rationale: Ó pa ìtakora pẹ̀lú ‘láti òkè’ mọ́, ó sì yẹra fún fífi ìtumọ̀ ìwà búburú tí ó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ψυχική
  choice: ti ẹ̀dá lásán[a]
  rationale: Ó fi ohun tí ó jẹ́ ti ìgbésí ayé ẹ̀dá nìkan hàn ní ìtakora sí ohun ti Ẹ̀mí, láìlo ‘ti ara,’ èyí tí ó lè mú òye ọ̀tọ̀ nípa ẹran ara wọ inú ọ̀rọ̀ náà.
- source_word: δαιμονιώδης
  choice: ti àwọn ẹ̀mí èṣù
  rationale: Ó sọ ní kedere pé irú ọgbọ́n náà ní ìbáṣepọ̀ tàbí ìwà tí ó bá ti àwọn ẹ̀mí èṣù mu, láìdín un kù sí ìwà búburú lásán.
theological_decisions:
- issue: Agbára ìtumọ̀ ψυχική nínú ìtakora ohun ti ẹ̀dá sí ohun ti Ẹ̀mí
  choice: ti ẹ̀dá lásán
  alternative: tí kò jẹ́ ti Ẹ̀mí
  rationale: ‘Ti ẹ̀dá lásán’ pa àìdájú ọ̀rọ̀ náà mọ́ láàárín ‘natural’ àti ‘unspiritual,’ ó sì jẹ́ kí àyíká ọ̀rọ̀ fi ìtakora rẹ̀ sí ohun tí ó wá láti òkè hàn. Àṣàyàn kejì tú ìtakora sí Ẹ̀mí Ọlọ́run ní pàtó ju bí adjective náà fúnra rẹ̀ ṣe sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó lọ́lá, tí ó sì ṣeé lóye. Àtòjọ ‘ti ayé, ti ẹ̀dá lásán, àti ti àwọn ẹ̀mí èṣù’ pa ìtẹ̀lé àwọn adjective mẹ́ta inú orísun mọ́; àmì àlàyé [a] sì wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ ψυχική tí ó ń ṣàlàyé.
