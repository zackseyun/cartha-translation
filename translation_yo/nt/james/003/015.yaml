  to: Ọgbọ́n yìí kì í ṣe ọgbọ́n tí ó ń sọ̀kalẹ̀ láti òkè wá; kàkà bẹ́ẹ̀, ó jẹ́ ti ayé, ti ẹ̀dá lásán[a], àti ti ẹ̀mí èṣù.
