  source_fidelity: 'Àwọn ẹ̀yà pàtàkì ti ẹsẹ náà wà nínú ìtumọ̀ náà: ‘Ọgbọ́n yìí’ ń ṣojú αὕτη ἡ σοφία; ‘láti òkè’ ń pa ìtumọ̀ ἄνωθεν mọ́; àti ìtẹ̀lé ‘ti ayé, ti ẹ̀dá lásán, ... ti ẹ̀mí èṣù’ ń tẹ̀lé àwọn adjective mẹ́ta nínú Gíríìkì. Síbẹ̀, ‘kì í ṣe èyí tí ń sọ̀kalẹ̀’ lè dà bí pé ọgbọ́n náà kì í ṣe ‘ẹni kan/ohun kan’ pàtó. Ṣíṣe ‘ọgbọ́n tí ó ń sọ̀kalẹ̀’ mú ìbáṣepọ̀ participle náà pẹ̀lú σοφία hàn kedere.'
  naturalness: 'Àtúnṣe kékeré náà jẹ́ Yorùbá ìgbàlódé tí ó dára sí i: ‘kì í ṣe ọgbọ́n tí ó ń sọ̀kalẹ̀ láti òkè wá.’ ‘Ti ẹ̀mí èṣù’ tún jẹ́ ọ̀nà àdánidá, gígùn-kúrú láti sọ δαιμονιώδης, láìfi iye àwọn ẹ̀mí kan pàtó kún un.'
  terminology: ‘Ti ẹ̀dá lásán’ jẹ́ àṣàyàn tí ó lè gba ψυχική dáadáa níbí, níwọ̀n bí ó ti ń tọ́ka sí ohun tí ó ní í ṣe pẹ̀lú ìyè/ìwà ẹ̀dá lásán, ní ìtakora sí ohun tí ó jẹ́ ti Ẹ̀mí. Àlàyé ìsàlẹ̀ ń pa àṣàyàn ‘tí kò jẹ́ ti Ẹ̀mí’ mọ́. ‘Ẹ̀mí èṣù’ yẹ fún δαιμονιώδης, kò sì dín agbára rẹ̀ kù sí ‘búburú’ lásán.
