id: JAS.3.9
reference: James 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: yo
  text: Pẹ̀lú rẹ̀ ni a fi ń bùkún fún Olúwa àti Baba[a], pẹ̀lú rẹ̀ náà sì ni a fi ń bú àwọn ènìyàn[b] tí a dá ní ìrí Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan, “Olúwa àti Baba”; a lè lóye rẹ̀ gẹ́gẹ́ bí “Olúwa, ẹni tí í ṣe Baba,” tàbí gẹ́gẹ́ bí orúkọ oyè méjì tí a fi pe Ọlọ́run.
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn ẹ̀dá ènìyàn”; ọ̀rọ̀ Gíríìkì níbí ń tọ́ka sí gbogbo aráyé, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: Pẹ̀lú rẹ̀ ni a fi ń
  rationale: Ó tọ́ka sí ahọ́n nínú ọ̀rọ̀ tó ṣáájú, ó sì fi ahọ́n hàn gẹ́gẹ́ bí ohun èlò; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: εὐλογοῦμεν
  choice: a fi ń yin
  rationale: Nígbà tí Ọlọ́run jẹ́ ẹni tí a ń ṣe sí, ‘yin’ sọ ìtumọ̀ ìbùkún tàbí sísọ rere sí Ọlọ́run ní Yorùbá àdánidá, láìsọ agbára ìyàtọ̀ rẹ̀ pẹ̀lú ‘bú’ nù.
- source_word: κύριον καὶ πατέρα
  choice: Olúwa àti Baba
  rationale: Ó pa àkójọpọ̀ orúkọ méjèèjì mọ́, láìfipá mú un jẹ́ ìtumọ̀ apposition tàbí ẹni méjì ọ̀tọ̀.
- source_word: καταρώμεθα
  choice: a fi ń bú
  rationale: ‘Bú’ jẹ́ ọ̀rọ̀ Yorùbá tààrà fún fífi èébú tàbí ègún lé ẹni, ó sì dúró ní ìtakora pẹ̀lú yíyin Ọlọ́run.
- source_word: ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: ní ìrí Ọlọ́run
  rationale: ‘Ìrí’ túmọ̀ sí ìjọra tàbí likeness ní Yorùbá Bíbélì tó mọ́gbọ́n dání, ó sì pa ìtọ́kasí sí èdá ènìyàn mọ́.
- source_word: γεγονότας
  choice: tí a dá
  rationale: Nínú àyíká ìjọra Ọlọ́run, ó fi ìṣẹ̀dá àti ipò tí ó ti yọrí sí hàn ní kedere, pẹ̀lú Ọlọ́run gẹ́gẹ́ bí olùṣe tí a kò darúkọ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπους tó kan gbogbo ènìyàn
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ náà kan gbogbo aráyé tí a dá ní ìrí Ọlọ́run, kì í ṣe akọ nìkan.
- issue: Ìbáṣepọ̀ ‘Olúwa àti Baba’
  choice: Olúwa àti Baba
  alternative: Olúwa, ẹni tí í ṣe Baba
  rationale: Èdè Gíríìkì lè jẹ́ kí orúkọ kejì ṣàlàyé ti àkọ́kọ́, tàbí kí ó jẹ́ àpèjúwe méjì tí a so pọ̀; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣe kedere fún òǹkàwé òde òní. Àtúnṣe ‘pẹ̀lú rẹ̀ ni a fi ń’ tún àtẹnumọ́ ἐν αὐτῇ ṣe ní ẹ̀ẹ̀mejì.
