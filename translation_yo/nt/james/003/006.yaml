id: JAS.3.6
reference: James 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: yo
  text: Ahọ́n sì jẹ́ iná. Ahọ́n jẹ́ ayé àìṣòdodo láàárín àwọn ẹ̀yà ara wa; ó ń sọ gbogbo ara di aláìmọ́[a], ó ń mú kẹ̀kẹ́ ìbí jó[b], Géhẹ́nà sì ń mú un jó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń sọ gbogbo ara di aláàbàwọ́n.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀nà ìgbésí ayé” tàbí “àyíká ìgbésí ayé.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tí a lò níbí ni Géhẹ́nà; ní ìtumọ̀ ìbílẹ̀, a máa ń túmọ̀ rẹ̀ sí “ọ̀run àpáàdì.”
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: ahọ́n
  rationale: A mú orúkọ ẹ̀yà ara náà ní tààràtà, nítorí àkòrí Jakọbu ń lo ahọ́n gẹ́gẹ́ bí ẹ̀yà ara, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ tí ènìyàn ń sọ tún wà nínú ìtumọ̀ rẹ̀.
- source_word: πῦρ
  choice: iná
  rationale: Èyí pa àkàwé iná apanirun mọ́ ní ọ̀nà tó ṣe déédéé ní Yorùbá.
- source_word: κόσμος τῆς ἀδικίας
  choice: ayé àìṣòdodo kan
  rationale: A pa àwòrán gbígbòòrò inú Gíríìkì mọ́, dípò kí a sọ ọ́ di ‘ohun búburú púpọ̀’; ‘àìṣòdodo’ gba ìwà àìtọ́ ní ìtumọ̀ tó gbòòrò.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: wà láàárín àwọn ẹ̀yà ara wa
  rationale: Ọ̀rọ̀ yìí sọ ipò ahọ́n láàárín àwọn ẹ̀yà ara ní Yorùbá àdánidá, láìfi ẹni tí ó gbé e síbẹ̀ kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: σπιλοῦσα
  choice: ń sọ ... di aláàbàwọ́n
  rationale: Èyí pa àwòrán àbàwọ́n àti ìbàjẹ́ ìwà mọ́; àlàyé ìsàlẹ̀ fúnni ní ọ̀nà ìtumọ̀ ‘sọ di aláìmọ́.’
- source_word: ὅλον τὸ σῶμα
  choice: gbogbo ara
  rationale: Ó pa agbára ọ̀rọ̀ ὅλον mọ́ ní ṣókí àti ní kedere.
- source_word: φλογίζουσα
  choice: ń dáná sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún mímú ohun jó, ó sì pa àwòrán iná tó ń tẹ̀ síwájú mọ́.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: àgbá ìbí
  rationale: A yan ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì kí àwòrán rẹ̀ tó ṣòro má bàa pòórá; àwọn ìtumọ̀ tó ṣàlàyé e sí ‘ipa ọ̀nà ìgbésí ayé’ tàbí ‘àyíká ìgbésí ayé’ wà nínú àlàyé ìsàlẹ̀.
- source_word: φλογιζομένη ὑπὸ τῆς γεέννης
  choice: Gẹhẹ́nà sì ni ó ń dáná sí i
  rationale: Ìṣètò yìí fi Gẹhẹ́nà hàn gẹ́gẹ́ bí orísun iná ahọ́n, ó sì pa ìṣe àfaraṣe inú Gíríìkì mọ́ ní Yorùbá tó ń ṣàn dáadáa.
- source_word: γέεννα
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ pàtó Gíríìkì náà mọ́ fún ìpéye ìtàn àti èrò inú ọ̀rọ̀; ìtumọ̀ àṣà ‘ọ̀run àpáàdì’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Gíríìkì lo γέεννα ní pàtó. Pípa orúkọ yìí mọ́ kò jẹ́ kí ìtumọ̀ fi gbogbo èrò ẹ̀kọ́ ìgbà tó tẹ̀ lé e sínú ẹsẹ náà láìnídìí.
- issue: Ìtumọ̀ τὸν τροχὸν τῆς γενέσεως
  choice: àgbá ìbí
  alternative: ipa ọ̀nà ìgbésí ayé; àyíká ìgbésí ayé
  rationale: Gbólóhùn Gíríìkì náà ṣòro, ó sì lè tọ́ka sí gbogbo ìlọsíwájú tàbí àyíká ìgbésí ayé. Ọ̀rọ̀ inú ẹsẹ pa àwòrán àgbá àti àìdánilójú náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní àwọn ìtumọ̀ àlàyé.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àwòrán ahọ́n, iná, ayé àìṣòdodo, àbàwọ́n, àti àgbá ìbí mọ́, ṣùgbọ́n a ṣètò gbólóhùn náà ní ọ̀nà tó ṣe déédéé fún olùkà Yorùbá.
