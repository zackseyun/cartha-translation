  to: Ahọ́n sì jẹ́ iná. Ahọ́n jẹ́ ayé àìṣòdodo láàárín àwọn ẹ̀yà ara wa; ó ń sọ gbogbo ara di aláìmọ́[a], ó ń mú kẹ̀kẹ́ ìbí jó[b], Géhẹ́nà sì ń mú un jó[c].
