id: JAS.3.14
reference: James 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá ní owú kíkorò[a] àti ìfẹ́kúfẹ̀ẹ́ ti ara ẹni[b] nínú ọkàn yín, ẹ má ṣe fọ́nnu, kí ẹ sì má ṣe purọ́ lòdì sí òtítọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìtara kíkorò” tàbí “ìlara kíkorò.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìfigagbága” tàbí “ìpínya sí ẹgbẹ́-ẹgbẹ́ nítorí ìmọtara-ẹni-nìkan.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “kí ẹ sì má ṣe sọ ohun tí ó lòdì sí òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: owú kíkorò
  rationale: “Owú” fi ìtumọ̀ búburú ti ζῆλος hàn ní àyíká yìí, “kíkorò” sì pa agbára πικρόν mọ́. Àwọn ìtumọ̀ bí “ìtara kíkorò” tàbí “ìlara kíkorò” ṣì ṣeé ṣe.
- source_word: ἐριθείαν
  choice: ìlépa ipò fún ire ara yín
  rationale: Gbólóhùn yìí mú ìlépa ọlá tàbí ipò tí ìmọtara-ẹni-nìkan ń darí jáde, ó sì túbọ̀ fi agbára ọ̀rọ̀ Gíríìkì hàn ju “ìmọtara-ẹni-nìkan” nìkan lọ.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ọ̀rọ̀ Gíríìkì lo “ọkàn” ní ẹyọ ọ̀kan pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀; èdè Yorùbá lè pa ìṣètò alápín yìí mọ́ lọ́nà àdánidá.
- source_word: μὴ κατακαυχᾶσθε
  choice: ẹ má ṣe fọ́nnu
  rationale: “Fọ́nnu” sọ ìgbéraga àti gbígbé ara ẹni ga tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí ní ṣókí àti ní èdè Yorùbá tó ṣe kedere.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: kí ẹ sì má ṣe purọ́ lòdì sí òtítọ́
  rationale: “Purọ́” pa agbára ψεύδεσθε mọ́, “lòdì sí” sì fi ìtakò tí κατά pẹ̀lú ọ̀rọ̀ olùní ń sọ hàn.
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó fi ìyàtọ̀ sí ọgbọ́n láti òkè tí àyíká ẹsẹ̀ ṣáájú ṣàpèjúwe hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ “òtítọ́”
  choice: Pa á mọ́ gẹ́gẹ́ bí “òtítọ́” láì dín ìtumọ̀ rẹ̀ kù.
  alternative: “Òtítọ́ ìhìnrere,” “ọ̀nà ọgbọ́n tòótọ́,” tàbí òtítọ́ nínú ọ̀rọ̀ sísọ nìkan.
  rationale: ἀλήθεια gbòòrò níhìn-ín; kò yẹ kí a fi tipátipá sọ ọ́ di ètò ẹ̀kọ́ kan pàtó tàbí òtítọ́ inú ọ̀rọ̀ sísọ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, tó ní ọlá, tó sì ṣe kedere fún gbogbo ènìyàn. A lo “ọkàn yín” gẹ́gẹ́ bí ẹyọ ọ̀kan alápín, bí orísun Gíríìkì ṣe rí, láì jẹ́ kó dà bí ẹni pé ẹnì kan ṣoṣo ni a ń bá sọ̀rọ̀.
