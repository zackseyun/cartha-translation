id: JAS.3.16
reference: James 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: yo
  text: Nítorí níbi tí owú[a] àti ìlépa láti gbé ara ẹni ga bá wà, níbẹ̀ ni rúdurùdu àti gbogbo ìṣe búburú[b] wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ìlara.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ìtara’ ní àyíká mìíràn, ṣùgbọ́n àyíká ọ̀rọ̀ níhìn-ín fi hàn pé ìtumọ̀ òdì ni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘gbogbo ohun búburú’ tàbí ‘gbogbo iṣẹ́ búburú.’ Ní tààrà, ‘gbogbo ohun ẹ̀gàn/búburú.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó ṣe àgbékalẹ̀ ipò gbogbogbò, ó sì bá ἐκεῖ mu nínú ìṣètò ‘níbi tí… níbẹ̀ ni…’.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé ẹsẹ yìí mọ́ pẹ̀lú ohun tí a sọ ṣáájú.
- source_word: ζῆλος
  choice: owú
  rationale: Àyíká ẹsẹ 14–15 fi hàn pé ìtumọ̀ òdì ni ọ̀rọ̀ náà ní níhìn-ín. ‘Owú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìwà burúkú yìí, nígbà tí ‘ìlara’ tún ṣeé ṣe.
- source_word: ἐριθεία
  choice: ìlépa láti gbé ara ẹni ga
  rationale: Gbólóhùn yìí sọ ìtara onímọtara-ẹni-nìkan láti tẹ̀ síwájú tàbí láti borí àwọn ẹlòmíràn, láìfi èrò ẹgbẹ́ ìsìn kan kún ọ̀rọ̀ náà.
- source_word: ἐκεῖ
  choice: níbẹ̀ ni
  rationale: Ó bá ὅπου mu, ó sì mú àgbékalẹ̀ ọ̀rọ̀ Gíríìkì náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἀκαταστασία
  choice: rúdurùdu
  rationale: Ó tọ́ka sí àìṣètò àti ìdàrúdàpọ̀ láàárín àwùjọ, kì í ṣe ìdàrúdàpọ̀ inú ọpọlọ nìkan.
- source_word: πᾶν
  choice: gbogbo
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún ohun kọ̀ọ̀kan nínú gbogbo irú iṣẹ́ tí a ń sọ̀rọ̀ rẹ̀.
- source_word: φαῦλον
  choice: búburú
  rationale: Ó mú agbára ìwà-bí-Ọlọ́run-kò-fẹ́ inú ọ̀rọ̀ náà jáde lọ́nà tó ṣe kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí ohun tí kò dára tàbí ohun ẹ̀gàn.
- source_word: πρᾶγμα
  choice: ìṣe
  rationale: Nínú àyíká ìwà burúkú yìí, ‘ìṣe’ jẹ́ adayeba ju ‘ohun’ lọ, ó sì tọ́ka sí iṣẹ́ tàbí ìhùwàsí tí ènìyàn ń ṣe.
theological_decisions:
- issue: Agbára òdì tí ζῆλος ní nínú àyíká yìí
  choice: A túmọ̀ ọ́ sí ‘owú,’ ìyẹn ìwà burúkú.
  alternative: ‘Ìlara’ ṣeé lò; ‘ìtara’ lè jẹ́ ìtumọ̀ rere tàbí àárín ní àyíká mìíràn.
  rationale: Jákọ́bù 3:14–15 ti pe irú owú yìí ní kíkorò, ó sì so ó mọ́ ọgbọ́n ayé tí kì í ṣe ti Ẹ̀mí. Nítorí náà, ìtumọ̀ rere bí ‘ìtara’ kò bá àríyànjiyàn rẹ̀ mu.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò ‘níbi tí… níbẹ̀ ni…’ pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, nígbà tí ‘ìlépa láti gbé ara ẹni ga’ sọ ἐριθεία ní ọ̀nà tí òǹkàwé lásán lè lóye.
