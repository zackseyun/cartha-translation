id: JAS.3.10
reference: James 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: yo
  text: Láti inú ẹnu kan náà ni ìbùkún àti èébú ti ń jáde. Ẹ̀yin arákùnrin mi[a], kò yẹ kí nǹkan wọ̀nyí rí bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin arákùnrin àti arábìnrin mi.” Ọ̀rọ̀ Gíríìkì sọ pé “arákùnrin,” ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí Jákọ́bù ń bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Láti inú ẹnu kan náà
  rationale: Ó pa àwòrán orísun ọ̀rọ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun méjèèjì ń jáde láti ẹnu kan náà.
- source_word: ἐξέρχεται
  choice: ni ... ti ń jáde
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìbùkún àti èébú ń jáde láti ẹnu; ìṣètò ‘ni ... ti’ tún tẹnu mọ́ orísun kan náà gẹ́gẹ́ bí Gíríìkì.
- source_word: εὐλογία
  choice: ìbùkún
  rationale: ‘Ìbùkún’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù fún ọ̀rọ̀ ìbùkún tí ẹnu ń sọ, ó sì pa ìtakora rẹ̀ pẹ̀lú èébú mọ́.
- source_word: κατάρα
  choice: èébú
  rationale: ‘Èébú’ túmọ̀ sí ọ̀rọ̀ ìfibú tàbí ìpe ibi sí orí ẹlòmíràn, ó sì bá àyíká ọ̀rọ̀ nípa ohun tí ẹnu ń sọ mu.
- source_word: οὐ χρή
  choice: kò yẹ
  rationale: Ó sọ ìdájọ́ nípa ohun tí kò tọ́ tàbí kò bójú mu láìsọ ọ́ di àṣẹ líle ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀδελφοί μου
  choice: Ẹ̀yin arákùnrin mi
  rationale: Ó pa ọ̀rọ̀ akọ́ ọ̀pọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó lè kan gbogbo àwùjọ àwọn onígbàgbọ́ hàn.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: kí nǹkan wọ̀nyí rí bẹ́ẹ̀
  rationale: Ó pa ọ̀pọ̀ ‘nǹkan wọ̀nyí’ àti ọ̀nà tí wọ́n rí, ‘bẹ́ẹ̀,’ mọ́, ó sì dun bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìbánisọ̀rọ̀ ẹbí akọ́ nínú ἀδελφοί μου
  choice: Ẹ̀yin arákùnrin mi
  alternative: Ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ́ ọ̀pọ̀ ní ìrísí rẹ̀, nítorí náà a pa á mọ́ nínú ẹsẹ̀. Síbẹ̀, nínú àyíká lẹ́tà Jákọ́bù, ó ṣeé ṣe kó ń bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀; a fi èyí sínú àlàyé ìsàlẹ̀ láìfipá yanjú ìtumọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘èébú’ fún ọ̀rọ̀ ìfibú, a sì pa àwòrán ẹnu kan náà tí ohun méjèèjì ti ń jáde mọ́.
