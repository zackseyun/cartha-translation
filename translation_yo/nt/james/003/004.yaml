source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: yo
  text: 'Ẹ wo àwọn ọkọ̀ ojú omi náà pẹ̀lú: bí wọ́n tilẹ̀ tóbi tó bẹ́ẹ̀, tí àwọn ẹ̀fúùfù líle sì ń gbá wọn lọ, a ń fi ìdarí ọkọ̀ kékeré púpọ̀ darí wọn sí ibikíbi tí ìtẹ̀sí ẹni tó ń darí ọkọ̀ bá fẹ́.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ibikíbi tí ẹni tó ń darí ọkọ̀ bá fẹ́ lọ.” Ní ìtumọ̀ gangan, Gíríìkì náà sọ pé, “sí ibikíbi tí ìtẹ̀sí ẹni tó ń darí ọkọ̀ bá fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Ẹ wo àwọn ọkọ̀ ojú omi pẹ̀lú
  rationale: “Ẹ wo” jẹ́ ọ̀nà Yorùbá àdánidá láti pe àfiyèsí sí àpẹẹrẹ mìíràn; “pẹ̀lú” fi ìbáṣepọ̀ rẹ̀ pẹ̀lú àpẹẹrẹ ẹṣin nínú ẹsẹ tó ṣáájú hàn.
- source_word: τηλικαῦτα ὄντα
  choice: bí wọ́n tilẹ̀ tóbi tó bẹ́ẹ̀
  rationale: Ó mú ìtẹnumọ́ lórí bí ọkọ̀ ṣe tóbi àti ìyàtọ̀ rẹ̀ sí ohun ìdarí kékeré jáde ní Yorùbá tó ṣe déédé.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: tí ẹ̀fúùfù líle sì ń gbá wọn lọ
  rationale: “Ẹ̀fúùfù líle” bá ọ̀rọ̀ ojú omi mu, “ń gbá wọn lọ” sì pa agbára àti ìṣe àìṣe-tìfẹ́ ẹni inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μετάγεται ὑπὸ ἐλαχίστου πηδαλίου
  choice: ìdarí ọkọ̀ kékeré púpọ̀ ni a fi ń darí wọn
  rationale: “Ìdarí ọkọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún rudder; “kékeré púpọ̀” fi agbára superlative ἐλαχίστου hàn láì sọ pé ó jẹ́ èyí tó kéré jù lọ ní gbogbo ayé.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: sí ibikíbi tí ìfẹ́ ẹni tó ń darí ọkọ̀ bá fẹ́
  rationale: Ó pa èrò ibi tí ẹni tó ń darí ọkọ̀ pinnu sí mọ́, ó sì jẹ́ Yorùbá àdánidá. Àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí ìtumọ̀ gangan tó ní “ìtẹ̀sí.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ὁρμή àti βούλεται nínú àkàwé ọkọ̀
  choice: sí ibikíbi tí ìfẹ́ ẹni tó ń darí ọkọ̀ bá fẹ́
  alternative: sí ibikíbi tí ìtẹ̀sí ẹni tó ń darí ọkọ̀ bá fẹ́
  rationale: Àṣàyàn inú ẹsẹ jẹ́ àdánidá sí olùkà Yorùbá, ṣùgbọ́n àlàyé [a] pa àwọ̀ lexical “ìtẹ̀sí/ìsún” mọ́. Kò fi ẹ̀kọ́ ìsìn àfikún sí ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A lo “ẹni tó ń darí ọkọ̀” dípò orúkọ iṣẹ́ amọ̀já kan, kí a lè dúró sún mọ́ participle Gíríìkì. Àmì ohùn ni a fi sí ibi tó yẹ.
