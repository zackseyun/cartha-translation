  source_fidelity: 'Ìtumọ̀ náà mú àwòrán Gíríìkì náà wá dáadáa: ọkọ̀ ńlá, ẹ̀fúùfù líle, ìdarí kékeré, àti ìtọ́sọ́nà ẹni tó ń darí ọkọ̀. Síbẹ̀, “ìfẹ́ ẹni tó ń darí ọkọ̀ bá fẹ́” tún ọ̀rọ̀ ìfẹ́ ṣe ní ọ̀nà tí ó dà bí ìfẹ́ náà fúnra rẹ̀ ni ó ń fẹ́; ó sì bo ὁρμή (‘ìtẹ̀sí/ìsún’) mọ́ ju bó ṣe yẹ lọ. “Ìtẹ̀sí ... bá fẹ́” pa ìyàtọ̀ ὁρμή àti βούλεται mọ́.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa tí ó rọrùn láti kà. “A ń fi ìdarí ọkọ̀ ... darí wọn” jẹ́ ìlò ìṣe tí ó ṣàn ju “ìdarí ọkọ̀ ... ni a fi ń darí wọn” lọ díẹ̀. Lílo ọ̀pọ̀ “àwọn ẹ̀fúùfù líle” tún bá plural Gíríìkì mu.
  terminology: “Ọkọ̀ ojú omi,” “ìdarí ọkọ̀,” àti “ẹni tó ń darí ọkọ̀” yẹ, wọ́n sì dá participle τοῦ εὐθύνοντος dúró láì fi ipò iṣẹ́ amọ̀já kan kún un. “Ìtẹ̀sí” yẹ fún ὁρμή nínú àyíká yìí, níbi tí ìfẹ́/èrò inú ẹni tó ń darí ń pinnu ibi tí ọkọ̀ yóò lọ.
