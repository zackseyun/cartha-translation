- from: 'Ẹ wo àwọn ọkọ̀ ojú omi pẹ̀lú: bí wọ́n tilẹ̀ tóbi tó bẹ́ẹ̀, tí ẹ̀fúùfù líle sì ń gbá wọn lọ, ìdarí ọkọ̀ kékeré púpọ̀ ni a fi ń darí wọn sí ibikíbi tí ìfẹ́ ẹni tó ń darí ọkọ̀ bá fẹ́.[a]'
  to: 'Ẹ wo àwọn ọkọ̀ ojú omi náà pẹ̀lú: bí wọ́n tilẹ̀ tóbi tó bẹ́ẹ̀, tí àwọn ẹ̀fúùfù líle sì ń gbá wọn lọ, a ń fi ìdarí ọkọ̀ kékeré púpọ̀ darí wọn sí ibikíbi tí ìtẹ̀sí ẹni tó ń darí ọkọ̀ bá fẹ́.[a]'
  rationale: A ṣàtúnṣe gbólóhùn ìkẹyìn láti pa ìyàtọ̀ lexical tó wà láàárín ὁρμή (“ìtẹ̀sí”) àti βούλεται (“bá fẹ́”) mọ́, láì jẹ́ kí Yorùbá náà di àìdánidá. A tún lo ọ̀pọ̀ fún “ẹ̀fúùfù” gẹ́gẹ́ bí ìfaramọ́ sí ἀνέμων, a sì mú ìṣètò gbólóhùn ìdarí ọkọ̀ rọrùn díẹ̀.
