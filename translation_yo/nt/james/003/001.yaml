language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ọ̀pọ̀ lára yín di olùkọ́, ẹ̀yin arákùnrin mi,[a] níwọ̀n bí ẹ ti mọ̀ pé àwa yóò gba ìdájọ́ tí ó pọ̀ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí “arákùnrin” níhìn-ín ń tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn arábìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ … γίνεσθε
  choice: Ẹ má ṣe jẹ́ kí ọ̀pọ̀ lára yín di
  rationale: Ọ̀rọ̀ yìí fi ìkìlọ̀ tàbí ìṣílétí hàn pé kí ọ̀pọ̀ nínú àwọn tí a ń bá sọ̀rọ̀ má ṣe wọ ipò náà; “di” mú ìtumọ̀ γίνεσθε gẹ́gẹ́ bí wíwọ ipò tuntun hàn.
- source_word: διδάσκαλοι
  choice: olùkọ́
  rationale: “Olùkọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ń kọ́ni, kò sì fi dandan sọ pé ipò iṣẹ́ ìjọ kan pàtó ni.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Èyí pa àwòrán ìbátan àti ìrísí akọ ti ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ó kan gbogbo àwùjọ, títí kan àwọn obìnrin.
- source_word: εἰδότες
  choice: níwọ̀n bí ẹ ti mọ̀
  rationale: Gbólóhùn yìí sọ ìmọ̀ tí wọ́n ní di ìpìlẹ̀ fún ìkìlọ̀ náà, láì mú un di ìdí kan ṣoṣo tí Gíríìkì kò fi dandan sọ.
- source_word: μεῖζον κρίμα
  choice: ìdájọ́ tí ó pọ̀ jù
  rationale: “Ìdájọ́” pa ìtumọ̀ gbòòrò κρίμα mọ́, dípò “ìdálẹ́bi”; “tí ó pọ̀ jù” sì fi ìfiwéra μεῖζον hàn láì sọ ọ́ di “ìdájọ́ líle” nìkan.
- source_word: λημψόμεθα
  choice: àwa yóò gba
  rationale: Èyí pa ọjọ́ iwájú àti ẹni àkọ́kọ́ ọ̀pọ̀ mọ́, ó sì fi hàn pé akọ̀wé ka ara rẹ̀ mọ́ àwọn tí ìkìlọ̀ náà kàn.
theological_decisions:
- issue: Ààlà ìtumọ̀ ἀδελφοί μου nínú àwùjọ tí ọkùnrin àti obìnrin wà
  choice: ẹ̀yin arákùnrin mi, pẹ̀lú àlàyé pé ó ṣeé ṣe kí ó kan gbogbo àwùjọ
  alternative: ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: Ọ̀rọ̀ inú ẹsẹ̀ pa akọ gírámà Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ ìtumọ̀ àkópọ̀ tí ó ṣeé ṣe.
- issue: Ìtumọ̀ κρίμα nínú ìkìlọ̀ sí àwọn olùkọ́
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: κρίμα lè túmọ̀ sí ìdájọ́, ìpinnu, tàbí ìdálẹ́bi; “ìdájọ́” pa ìkìlọ̀ àti àìdánilójú tó wà nínú ọ̀rọ̀ náà mọ́ láì fi ìdálẹ́bi òpin sí i.
- issue: Agbára μεῖζον pẹ̀lú κρίμα
  choice: ìdájọ́ tí ó pọ̀ jù
  alternative: ìdájọ́ tí ó le jù
  rationale: Yíyan “p pọ̀ jù” tẹ̀ lé ìtumọ̀ ìfiwéra “greater” ní tààrà, ó sì yẹra fún fífi “líle” ṣe àlàyé irú ìdájọ́ náà ju ohun tí ọ̀rọ̀ sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún àwùjọ, “àwa” sì tẹnumọ́ pé akọ̀wé ka ara rẹ̀ mọ́ àwọn tí yóò gba ìdájọ́.
