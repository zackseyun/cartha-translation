  source_fidelity: Ìtumọ̀ náà mú ìfẹ̀hónúhàn ìkìlọ̀ Μὴ ... γίνεσθε, ìtumọ̀ “di” fún γίνεσθε, àti ẹni-àkọ́kọ́ púpọ̀ ọjọ́ iwájú nínú λημψόμεθα dáadáa. Ṣùgbọ́n “ìdájọ́ tí ó pọ̀ jù” lè jẹ́ ìtumọ̀ pé ìdájọ́ náà pọ̀/juwọ́ lọ ní àìmúdájú tàbí pé ó pọ̀ jù lọ, dípò ìfiwéra kedere ti μεῖζον. “tí ó pọ̀ sí i” ń fi ìfiwéra náà hàn ní kedere láì sọ irú ìdájọ́ náà di ‘líle’ tàbí ìdálẹ́bi.
