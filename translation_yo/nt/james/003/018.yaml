  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: yo
  text: Àti èso òdodo[a] ni a ń gbìn ní àlàáfíà láti ọwọ́ àwọn tí ń mú àlàáfíà wá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èso ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìwà títọ́ àti ti ìdájọ́ tàbí ìbáṣepọ̀ títọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún àwọn tí ń mú àlàáfíà wá.” Dative Gíríìkì náà lè túmọ̀ sí ọ̀nà yìí pẹ̀lú, bí ó tilẹ̀ jẹ́ pé “láti ọwọ́ àwọn tí ń mú àlàáfíà wá” bá ọ̀rọ̀-ìṣe àìsọ olùṣe mu dáadáa níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: èso
  rationale: “Èso” jẹ́ ìtumọ̀ àdánidá fún ọ̀rọ̀ olódù kan náà, ó sì pa àkàwé ohun tí gbígbìn ń mú jáde mọ́ ju “ìkórè” lọ.
- source_word: δὲ
  choice: Àti
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó tẹ̀ lé àpèjúwe ọgbọ́n láti òkè; “Àti” kò fi ìtakora líle kún ọ̀rọ̀ náà.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” lè tọ́ka sí ìwà títọ́ àti ohun tí ó bá ìdájọ́ tàbí ìbáṣepọ̀ títọ́ mu. A pa àpapọ̀ “èso òdodo” mọ́ láì pinnu bóyá èso náà jẹ́ òdodo tàbí ó ń mú òdodo jáde.
- source_word: ἐν εἰρήνῃ
  choice: ní àlàáfíà
  rationale: Ìtumọ̀ yìí pa àyè sílẹ̀ fún àlàáfíà gẹ́gẹ́ bí ọ̀nà tàbí ipò tí gbígbìn náà ti ń ṣẹlẹ̀.
- source_word: σπείρεται
  choice: ni a ń fún
  rationale: “A ń fún” fi ìṣe ìsinsìnyí àti fọ́ọ̀mù àìsọ ẹni tó ń ṣe é hàn lọ́nà Yorùbá àdánidá, ó sì pa àwòrán gbígbìn mọ́.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: láti ọwọ́ àwọn tí ń mú àlàáfíà wá
  rationale: “Láti ọwọ́” fi ìtumọ̀ pé àwọn olùmú-àlàáfíà-wá ni olùṣe ìgbìn náà hàn, nígbà tí “ń mú àlàáfíà wá” ń ṣàfihàn kedere ìṣe ποιέω + εἰρήνην.
theological_decisions:
- issue: Ìtumọ̀ “èso òdodo”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí èso tàbí àbájáde tí òdodo ń ṣàpèjúwe, láì dá pàtó lórí irú ìbáṣepọ̀ gírámà tó wà láàárín àwọn ọ̀rọ̀ méjèèjì.
  alternative: Ó lè jẹ́ ìkórè tí í ṣe òdodo, tàbí èso tí ń mú òdodo jáde.
  rationale: Genitive δικαιοσύνης lè jẹ́ àpèjúwe tàbí àfihàn ohun tí èso náà jẹ́. Ìtumọ̀ yìí pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. “Àlàáfíà” jẹ́ ọ̀rọ̀ àdánidá fún εἰρήνη, “àwọn tí ń mú àlàáfíà wá” sì ṣe kedere ju ọ̀rọ̀ àkójọpọ̀ kan lọ.
