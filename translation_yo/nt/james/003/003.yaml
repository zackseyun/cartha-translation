source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: yo
  text: Bí[b] a bá fi irin ìjánu[a] sí ẹnu àwọn ẹṣin kí wọ́n lè gbọ́ràn sí wa, a sì ń darí gbogbo ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjánu”; ṣùgbọ́n ní pàtó, ọ̀rọ̀ náà ń tọ́ka sí irin tí a fi sínú ẹnu ẹṣin.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní, “Wò ó, a máa ń fi …” dípò “Bí a bá fi …”
    reason: textual_variant
lexical_decisions:
- source_word: εἰ δὲ
  choice: Bí … bá
  rationale: Ó mú ìtumọ̀ gbólóhùn onípò náà jáde ní Yorùbá àdánidá. Agbára àsopọ̀ δέ kò lágbára tó fi yẹ kí a fi “ṣùgbọ́n” kún un níbí.
- source_word: χαλινοὺς
  choice: irin ìjánu
  rationale: Nítorí ohun tí a fi sínú ẹnu ẹṣin ni ọ̀rọ̀ náà ń tọ́ka sí ní pàtó, “irin ìjánu” ṣe kedere ju “ìjánu” lásán lọ.
- source_word: εἰς τὰ στόματα
  choice: sí ẹnu àwọn ẹṣin
  rationale: “Sí ẹnu” fi ìṣípò sínú ẹnu hàn ní Yorùbá àdánidá; ẹnu kọ̀ọ̀kan ni a túmọ̀ ní ìbámu pẹ̀lú ọ̀pọ̀ ẹṣin.
- source_word: βάλλομεν
  choice: a bá fi … sí
  rationale: “Fi … sí” ni ọ̀nà Yorùbá tí ó rọrùn, tí ó sì péye fún fífi ohun kan sí ibi kan; “sọ” tàbí “ju” yóò le jù fún àyíká yìí.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: kí wọ́n lè gbọ́ tiwa
  rationale: Ó pa ète gbólóhùn Gíríìkì mọ́, ó sì lo ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ìgbọ́ràn láì sọ pé a fipá mú wọn.
- source_word: μετάγομεν
  choice: a tún máa ń darí
  rationale: “Darí” bá àwòrán bí a ṣe ń darí ìrìn ẹṣin mu, ó sì fi agbára ohun kékeré láti ṣàkóso ohun ńlá hàn.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: gbogbo ara wọn
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún ara ẹṣin kọ̀ọ̀kan ní àwùjọ; kò pọndandan láti sọ “àwọn ara wọn.”
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá òde òní tí ó níyì, tí ó sì ṣeé lóye ni a lò. “Irin ìjánu” ṣe ìyàtọ̀ láàárín ohun tí a fi sínú ẹnu ẹṣin àti gbogbo ohun èlò ìjánu; “gbọ́ tiwa” jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbọ́ràn.
