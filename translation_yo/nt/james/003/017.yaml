id: JAS.3.17
reference: James 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: yo
  text: Ṣùgbọ́n ọgbọ́n tí ó ti òkè wá jẹ́ mímọ́ ní àkọ́kọ́; lẹ́yìn náà, ó fẹ́ràn àlàáfíà, ó jẹ́ pẹ̀lẹ́, ó sì ṣe tán láti fetí sí ìmọ̀ràn; ó kún fún àánú àti àwọn èso rere, kò ṣe ojúsàájú[a], kò sì ní àgàbàgebè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aláìpín” tàbí “láìsí iyèméjì.” Ọ̀rọ̀ Gíríìkì náà lè ní ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: tí ó ti òkè wá
  rationale: Ó pa àwòrán ibi-orísun náà mọ́ gẹ́gẹ́ bí ‘láti òkè wá,’ láì fi ‘ọ̀run’ kún un ní pàtó; ó sì yà á sí ọgbọ́n ti ayé ní àyíká ẹsẹ̀ náà.
- source_word: σοφία
  choice: ọgbọ́n
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún irú ìmọ̀ àti ìwà ọlọ́gbọ́n tí àyíká náà ń ṣàpèjúwe.
- source_word: πρῶτον μὲν
  choice: ní àkọ́kọ́
  rationale: Ó fi hàn pé ìwà mímọ́ ni àkọ́kọ́ nínú àtòjọ náà.
- source_word: ἁγνή
  choice: mímọ́
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ìwà tí kò ní èérí tàbí àdàlú búburú.
- source_word: ἔπειτα
  choice: lẹ́yìn náà
  rationale: Ó pa ìtẹ̀lé àwọn ànímọ́ inú àtòjọ náà mọ́ ní Yorùbá àdánidá.
- source_word: εἰρηνική
  choice: ní ìfẹ́ àlàáfíà
  rationale: Ó túmọ̀ ìtẹ̀sí láti fẹ́ àti láti gbé àlàáfíà lárugẹ, kì í ṣe ipò ìdákẹ́jẹ́ lásán.
- source_word: ἐπιεικής
  choice: onínú tútù
  rationale: Ó sọ ìwà pẹ̀lẹ́, ìfaradà àti àìle koko ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: εὐπειθής
  choice: múra tán láti fetí sí ọ̀rọ̀
  rationale: Ó fi ìmúrasílẹ̀ láti gbọ́, gba ìtọ́nisọ́nà àti fèsì sí ohun tó tọ́ hàn, láì túmọ̀ sí pé ẹni náà rọrùn láti tàn.
- source_word: μεστὴ ἐλέους
  choice: kún fún àánú
  rationale: Ó pa èrò ọ̀pọ̀lọpọ̀ àánú inú gbólóhùn Gíríìkì náà mọ́.
- source_word: καρπῶν ἀγαθῶν
  choice: àwọn èso rere
  rationale: Ó pa àfiwé ‘èso’ àti nọ́mbà púpọ̀ inú Gíríìkì mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí iṣẹ́ rere.
- source_word: ἀδιάκριτος
  choice: kò ṣe ojúsàájú
  rationale: Ìtumọ̀ yìí bá àtòjọ ìwà rere náà àti ìkìlọ̀ Jákọ́bù nípa ojúsàájú mu; àmọ́ a pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἀνυπόκριτος
  choice: kò ní àgàbàgebè
  rationale: Ó sọ àìsí ìwà àfarawé tàbí ẹ̀tàn ní kedere, ó sì pa ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδιάκριτος
  choice: kò ṣe ojúsàájú
  alternative: aláìpín ọkàn; láìsí iyèméjì tàbí iyèméjì-ọkàn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àìṣe ojúsàájú, àìpín ọkàn, tàbí àìṣiyèméjì. Nítorí àtòjọ ìwà tó ní àánú, èso rere àti àìní àgàbàgebè, ‘kò ṣe ojúsàájú’ bá ìṣàn ọ̀rọ̀ mu jù; ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú ìtumọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní ọlá, àti àmì ohùn ní kíkún níbi tí ó ti yẹ. Àwọn ànímọ́ ni a sọ ní fọ́ọ̀mù gbólóhùn kéékèèké kí àtòjọ náà lè dun bí Yorùbá àdánidá, nígbà tí a tún pa ìtẹ̀lé àti àwọn àwòrán pàtàkì inú Gíríìkì mọ́.
