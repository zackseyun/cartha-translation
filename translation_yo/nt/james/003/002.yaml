id: JAS.3.2
reference: James 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: yo
  text: Nítorí gbogbo wa ni a ń kọsẹ̀ ní ọ̀pọ̀lọpọ̀ ọ̀nà. Bí ẹnikẹ́ni kò bá kọsẹ̀ nínú ọ̀rọ̀ ẹnu[b], ẹni náà jẹ́ ọkùnrin[c] tí ó dàgbà dénú[a], ó sì lè fi ìjánu mú gbogbo ara rẹ̀ pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọkùnrin pípé.” Ọ̀rọ̀ Gíríìkì τέλειος lè túmọ̀ sí “pípé,” “pé tán,” tàbí “dàgbà dénú”; níbí, ó ṣeé ṣe kó ń tọ́ka sí ìdàgbà nípa ìwà rere dípò àìní ẹ̀ṣẹ̀ rárá.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nínú ọ̀rọ̀,” ìyẹn ni, nínú ọ̀rọ̀ ẹnu tàbí ohun tí ẹni náà ń sọ.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì sọ pé “ọkùnrin” (ἀνήρ); níbí a lò ó gẹ́gẹ́ bí aṣojú nínú gbólóhùn tí ó kan gbogbo ènìyàn.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: ní ọ̀pọ̀lọpọ̀ ọ̀nà
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń ṣiṣẹ́ bí ọ̀rọ̀-àpèjúwe sí πταίομεν, ó sì túmọ̀ sí pé a ń kọsẹ̀ ní onírúurú ọ̀nà, kì í ṣe pé a ń kọsẹ̀ lórí ‘ọ̀pọ̀ nǹkan’ gẹ́gẹ́ bí àfojúsùn ọ̀rọ̀-ìṣe.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún ìkìlọ̀ tó ṣáájú múlẹ̀, láì fi ìtumọ̀ míì kún un.
- source_word: πταίομεν / πταίει
  choice: a ń kọsẹ̀ / kò bá kọsẹ̀
  rationale: ‘Kọsẹ̀’ pa àwòrán ìkọsẹ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí àṣìṣe tàbí ìkùnà nípa ìwà rere nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἅπαντες
  choice: gbogbo wa
  rationale: Ó pa ìtẹnumọ́ pé gbogbo ènìyàn ni ọ̀rọ̀ náà kàn mọ́, ó sì fi Jákọ́bù fúnra rẹ̀ sínú wọn.
- source_word: εἴ τις
  choice: Bí ẹnikẹ́ni
  rationale: Ó jẹ́ gbólóhùn oníṣ条件 tí ó ń sọ òtítọ́ gbogbogbò nípa ẹnikẹ́ni.
- source_word: ἐν λόγῳ
  choice: nínú ọ̀rọ̀ sísọ
  rationale: Nínú àyíká yìí, λόγος ń tọ́ka sí ọ̀rọ̀ ẹnu tàbí ohun tí ènìyàn ń sọ. Ìtumọ̀ yìí ṣe kedere ní Yorùbá láì dín un kù sí ọ̀rọ̀ kan ṣoṣo.
- source_word: οὗτος
  choice: ẹni náà
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka náà mọ́, nípa títọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
- source_word: τέλειος
  choice: tí ó dàgbà dénú
  rationale: Nínú àyíká ìwà rere yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdàgbà, ìpé, tàbí jíjẹ́ ẹni pípé ní ìwà, kì í ṣe dandan àìní ẹ̀ṣẹ̀ rárá. ‘Dàgbà dénú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdàgbà ní ìwà.
- source_word: ἀνήρ
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní pàtó, ṣùgbọ́n a lò ó gẹ́gẹ́ bí aṣojú nínú gbólóhùn gbogbogbò yìí; ‘ẹnikẹ́ni’ ní ìbẹ̀rẹ̀ ti fi hàn pé ìlànà náà kan gbogbo ènìyàn.
- source_word: δυνατὸς
  choice: ó sì lè
  rationale: Ó sọ agbára tàbí ànímọ́ ẹni náà láti ṣe ohun tí ó tẹ̀ lé ní ọ̀nà àdánidá ní Yorùbá.
- source_word: χαλιναγωγῆσαι
  choice: kó ... ní ìjánu
  rationale: Ó pa àwòrán ìjánu ẹṣin mọ́, èyí tí Jákọ́bù ń tẹ̀ síwájú láti lò nínú àwọn ẹsẹ tó tẹ̀ lé; ó tún túmọ̀ sí ṣíṣe àkóso.
- source_word: καὶ
  choice: sì ... pẹ̀lú
  rationale: Ó fi agbára láti ṣàkóso gbogbo ara kún agbára láti ṣàkóso ọ̀rọ̀ ẹnu.
theological_decisions:
- issue: Ìtumọ̀ τέλειος nínú àyíká ìwà rere
  choice: tí ó dàgbà dénú
  alternative: pípé / pé tán
  rationale: Jákọ́bù ń sọ nípa ìdàgbà àti ìpé ìwà. Ìtumọ̀ tí yóò túmọ̀ sí ẹni tí kò lè dẹ́ṣẹ̀ rárá yóò tako ìjẹ́wọ́ tó wà ní ìbẹ̀rẹ̀ ẹsẹ pé gbogbo wa ń kọsẹ̀. Àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn ‘pípé’ mọ́.
- issue: Ìlò ἀνήρ akọ gẹ́gẹ́ bí aṣojú
  choice: ọkùnrin, pẹ̀lú agbára aṣojú gbogbogbò
  alternative: ènìyàn
  rationale: A pa irú akọ tó wà nínú orísun mọ́, ṣùgbọ́n ‘bí ẹnikẹ́ni’ àti àkọsílẹ̀ ìsàlẹ̀ mú kedere pé kì í ṣe ọkùnrin nìkan ni òtítọ́ yìí kàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Kó ... ní ìjánu’ pa àwòrán orísun mọ́, nígbà tí ‘dàgbà dénú’ sọ ìtumọ̀ ìwà rere ní ọ̀nà tí òǹkàwé Yorùbá lè lóye ní rọ́rùn.
