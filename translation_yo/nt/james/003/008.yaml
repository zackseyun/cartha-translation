source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: yo
  text: Ṣùgbọ́n kò sí ẹnì kankan nínú àwọn ènìyàn tí ó lè tẹ́ ahọ́n lórí[a]. Ohun búburú aláìbalẹ̀ ni[b], ó kún fún oró apaniyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó rọrùn sí i, “kò sí ènìyàn kankan tí ó lè tẹ́ ahọ́n lórí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ohun búburú aláìdúróṣinṣin” tàbí “ohun búburú tí kò ní ìṣàkóso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: ahọ́n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹ̀yà ara ní tààrà, ṣùgbọ́n ní àyíká yìí ó dúró fún ọ̀rọ̀ ẹnu ènìyàn. “Ahọ́n” pa àwòrán àti ìṣọ̀kan pẹ̀lú àyíká ẹsẹ náà mọ́.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: kò sí ẹnì kankan nínú àwọn ènìyàn
  rationale: Èyí fi ìbáṣepọ̀ partitive genitive hàn ní ti ẹ̀dá, ó sì jẹ́ Yorùbá àdánidá láì fi ìtumọ̀ ọkùnrin nìkan sí ọ̀rọ̀ Gíríìkì tí ó ń tọ́ka sí gbogbo ènìyàn.
- source_word: δαμάσαι δύναται
  choice: tí ó lè tẹ́ … lórí
  rationale: “Tẹ́ … lórí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pípa ohun aláìgbọ́ràn mọ́ra tàbí mímú un wá sábẹ́ àkóso; ó tún bá àkòrí títẹ́ ẹranko lórí nínú àyíká mu.
- source_word: ἀκατάστατον
  choice: tí kò ṣeé dá dúró
  rationale: Ó mú ìtumọ̀ àìní ìdúróṣinṣin, àìbalẹ̀, àti ohun tí kò fara mọ́ àkóso jáde láì dín ọ̀rọ̀ náà sí ìtumọ̀ kan ṣoṣo.
- source_word: κακόν
  choice: ohun búburú
  rationale: Ó pa agbára ìwà-búburú κακόν mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: μεστὴ
  choice: ó kún fún
  rationale: Ìtumọ̀ àdánidá tí ó pa àwòrán ohun tí ó kún dé ẹnu mọ́.
- source_word: ἰοῦ θανατηφόρου
  choice: oró apanirun
  rationale: Nínú àyíká yìí ἰός jẹ́ oró, θανατηφόρος sì jẹ́ ohun tí ń mú ikú wá. “Oró apanirun” jẹ́ kedere, ó lágbára, ó sì yẹ fún èdè ìtẹ̀jáde.
theological_decisions:
- issue: Bó ṣe yẹ kí a túmọ̀ οὐδεὶς pẹ̀lú ἀνθρώπων
  choice: kò sí ẹnì kankan nínú àwọn ènìyàn
  alternative: kò sí ènìyàn kankan tí ó lè tẹ́ ahọ́n lórí
  rationale: Ọ̀rọ̀ Gíríìkì ń sọ nípa ẹnikẹ́ni lára gbogbo ènìyàn, kì í ṣe ọkùnrin nìkan. Àṣàyàn yìí pa ìṣètò ìtumọ̀ partitive náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá tí ó rọrùn sí i.
- issue: Ìtumọ̀ ἀκατάστατον
  choice: tí kò ṣeé dá dúró
  alternative: aláìbalẹ̀; aláìgbọ́ràn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àìdúró, àìbalẹ̀, tàbí àìní ìṣàkóso. A kò yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tó dín àfojúsùn ọ̀rọ̀ náà kù; àlàyé ìsàlẹ̀ pa àwọn ìyàtọ̀ pàtàkì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Tẹ́ ahọ́n lórí” pa àwòrán títẹ́ ohun alààyè lórí mọ́, “oró apanirun” sì mú ewu ikú jáde ní kedere.
