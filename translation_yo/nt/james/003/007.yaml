  to: Nítorí gbogbo irú ẹranko igbó àti ẹyẹ, ohun tí ń rákò àti ẹ̀dá inú òkun ni a ń tẹ́ lójú, a sì ti tẹ́ wọn lójú nípasẹ̀ ẹ̀dá ènìyàn.[a]
