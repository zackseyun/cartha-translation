id: JAS.3.7
reference: James 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: yo
  text: Nítorí gbogbo irú ẹranko igbó àti ẹyẹ, ohun tí ń rákò àti ẹ̀dá inú òkun ni a ń tẹ́ lójú, a sì ti tẹ́ wọn lójú nípasẹ̀ ẹ̀dá ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ gbogbo ènìyàn” tàbí “nípasẹ̀ ìwà ẹ̀dá ènìyàn.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ènìyàn lápapọ̀, tàbí sí ẹ̀dá/ìwà ènìyàn ní ọ̀nà àfojúrí; ìtumọ̀ inú ẹsẹ yìí pa àìdájú náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: gbogbo irú
  rationale: Nínú àkójọ àwọn ẹ̀dá alààyè yìí, φύσις ń tọ́ka sí ‘irú’ tàbí ‘ẹ̀yà,’ kì í ṣe ìwà ẹ̀dá ní pàtó; ‘gbogbo irú’ sì jẹ́ Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ọ̀rọ̀ tó ṣáájú.
- source_word: θηρίων
  choice: ẹranko igbó
  rationale: Ó mú ìtumọ̀ ẹranko tí kì í ṣe ti ilé jáde ní èdè Yorùbá òde òní.
- source_word: πετεινῶν
  choice: ẹyẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àkójọ náà mu.
- source_word: ἑρπετῶν
  choice: ohun tí ń rákò
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ‘ẹranko afàyàfà’ lọ, ó sì lè túmọ̀ sí gbogbo ẹ̀dá tí ń rákò.
- source_word: ἐναλίων
  choice: ẹ̀dá inú òkun
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti àwọn ohun alààyè inú òkun mọ́ láì dín in kù sí irú kan ṣoṣo.
- source_word: δαμάζεται
  choice: ni a ń tọ́ lójú
  rationale: Ìṣe àkókò ìsinsìnyí àti ohùn àìṣe taara dúró nínú ‘a ń tọ́ lójú,’ tó ń sọ nípa ìṣe tí ń bá a lọ tàbí tí ó sábà máa ń ṣẹlẹ̀.
- source_word: δεδάμασται
  choice: a sì ti tọ́ wọn lójú
  rationale: ‘ti ... lójú’ fi ipò tí ìṣe tó ti parí yọrí sí hàn, ó sì pa ìyàtọ̀ àkókò láàárín àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: nípasẹ̀ ìran ènìyàn
  rationale: Ìtumọ̀ àpapọ̀, ìyẹn gbogbo aráyé, bá ọ̀rọ̀ nípa títọ́ àwọn ẹranko lójú mu; àkọ́lé ìsàlẹ̀ ojú ewé pa ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Bóyá τῇ φύσει τῇ ἀνθρωπίνῃ túmọ̀ sí aráyé lápapọ̀ tàbí ẹ̀dá/ìwà ènìyàn ní ọ̀nà àfojúrí
  choice: nípasẹ̀ ìran ènìyàn
  alternative: nípasẹ̀ ẹ̀dá ènìyàn tàbí agbára ènìyàn
  rationale: Àyíká ọ̀rọ̀ mú kí aráyé gẹ́gẹ́ bí olùṣe ṣeé ṣe jù, ṣùgbọ́n Gíríìkì gba ìtumọ̀ àfojúrí náà láyè; a kò fi ìtumọ̀ kejì pamọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. ‘Tọ́ lójú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ẹranko sábẹ́ àkóso tàbí mímú un rọ̀; a fi àmì ohùn síbi tí ó yẹ.
