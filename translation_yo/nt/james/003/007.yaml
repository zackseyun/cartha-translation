    rationale: ‘Human power’ kì í ṣe àṣàyàn lexical tó sunmọ́ τῇ φύσει τῇ ἀνθρωπίνῃ; a yẹ kí akọ́lé náà ṣàlàyé àìdájú humanity/human nature nìkan.
