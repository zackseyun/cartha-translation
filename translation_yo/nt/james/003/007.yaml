  verdict: revise
  source_fidelity: Ìtumọ̀ àkójọ àwọn ẹ̀dá alààyè, ìṣe ìsinsìnyí passive (δαμάζεται), àti ìṣe perfect passive (δεδάμασται) dára ní pàtàkì. Ṣùgbọ́n ‘tọ́ lójú’ kì í ṣe ọ̀rọ̀ tó péye jù fún δαμάζω nínú àyíká rírọ́ tàbí títẹ́ ẹranko lójú. Bákan náà, ‘ìran ènìyàn’ lè tọ́ka sí ìran/gẹ́nẹ́réṣọ̀n kan, kò sì pa àìdájú tó wà nínú τῇ φύσει τῇ ἀνθρωπίνῃ mọ́ dáadáa.
  naturalness: ‘Tẹ́ lójú’ jẹ́ ọ̀nà Yorùbá tó bá ìṣàkóso àti rírọ́ ẹranko mu dáadáa. ‘Nípasẹ̀ ẹ̀dá ènìyàn’ sì jẹ́ ìsọ̀rọ̀ tó mọ́, tó sì lè jẹ́ ‘humanity’ tàbí ‘human nature,’ gẹ́gẹ́ bí Gíríìkì ṣe gba.
  terminology: A pa ‘ẹranko igbó,’ ‘ẹyẹ,’ ‘ohun tí ń rákò,’ àti ‘ẹ̀dá inú òkun’ mọ́. A rọ́pò ‘ìran ènìyàn’ pẹ̀lú ‘ẹ̀dá ènìyàn,’ a sì tún akọ́lé ìsàlẹ̀ ojú ewé ṣe kí ó má ṣe fi ‘agbára ènìyàn,’ tí kì í ṣe yíyàn ìtumọ̀ tó péye fún φύσις, kún un.
