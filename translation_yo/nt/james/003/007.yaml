  - severity: medium
    issue: ‘ìran ènìyàn’ fún τῇ φύσει τῇ ἀνθρωπίνῃ
    rationale: ‘Ìran’ sábà máa ń jẹ́ generation tàbí lineage, nígbà tí Gíríìkì lè túmọ̀ sí humanity ní àpapọ̀ tàbí human nature. ‘Ẹ̀dá ènìyàn’ pa ìtumọ̀ méjèèjì sílẹ̀.
  - severity: low
