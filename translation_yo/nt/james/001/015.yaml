language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: yo
  text: Nígbà náà, ìfẹ́kúfẹ̀ẹ́, lẹ́yìn tí ó ti lóyún,[a] ń bí ẹ̀ṣẹ̀; ẹ̀ṣẹ̀ sì, nígbà tí ó bá dàgbà tán,[b] ń bí ikú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ti lóyún.” Ọ̀rọ̀ Gíríìkì náà so àwòrán oyún mọ́ ìfẹ́kúfẹ̀ẹ́ ní pẹkipẹki.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ó bá pé tán” tàbí “nígbà tí ó bá dàgbà dé ìpele kíkún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Nígbà náà
  rationale: Ó ń fi ìtẹ̀síwájú ọ̀rọ̀ hàn nínú ìpele láti inú ìdẹwò dé ikú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘lẹ́yìn náà/nígbà náà.’
- source_word: ἐπιθυμία
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìfẹ́ tí kò tọ́ ní gbogbogbòò, kì í ṣe ìfẹ́kúfẹ̀ẹ́ ti ìbálòpọ̀ nìkan.
- source_word: συλλαβοῦσα
  choice: lẹ́yìn tí ó bá lóyún
  rationale: Ó pa àwòrán oyún mọ́, ó sì fi hàn pé oyún ṣáájú ìbímọ̀ nínú àkójọpọ̀ ìṣẹ̀lẹ̀ náà.
- source_word: τίκτει
  choice: ń bí
  rationale: 'Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àwòrán ìbímọ̀ mọ́: ìfẹ́kúfẹ̀ẹ́ ló ń bí ẹ̀ṣẹ̀.'
- source_word: ἁμαρτίαν
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ìwà búburú níwájú Ọlọ́run.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ ń tẹ̀síwájú nínú ọ̀rọ̀ náà láì dá ìyàtọ̀ líle sílẹ̀.
- source_word: ἀποτελεσθεῖσα
  choice: nígbà tí ó bá dàgbà tán
  rationale: Ó mú èrò pé ẹ̀ṣẹ̀ ti dé ìpele kíkún tàbí ìdàgbàsókè rẹ̀ wá, ó sì bá àwòrán ohun alààyè tó ń dàgbà mu.
- source_word: ἀποκύει
  choice: ń bí
  rationale: Ó pa àwòrán ìbímọ̀ kejì mọ́ ní kedere. Àtúnlò ọ̀rọ̀ ‘ń bí’ jẹ́ ohun àdánidá ní Yorùbá, ó sì so ìpele méjèèjì pọ̀.
- source_word: θάνατον
  choice: ikú
  rationale: Ìtumọ̀ tààrà ni; a kò fi kún un pé ikú ti ara, ti ẹ̀mí, tàbí ayérayé ni, nítorí orísun kò sọ bẹ́ẹ̀.
theological_decisions:
- issue: Àwòrán oyún àti ìbímọ̀ tó so ìfẹ́kúfẹ̀ẹ́, ẹ̀ṣẹ̀ àti ikú pọ̀
  choice: Pa àwòrán náà mọ́ nípasẹ̀ ‘lóyún’ àti ‘ń bí.’
  alternative: Ìfẹ́kúfẹ̀ẹ́ ń yọrí sí ẹ̀ṣẹ̀, ẹ̀ṣẹ̀ sì ń yọrí sí ikú.
  rationale: Ìtumọ̀ tó sọ ìdí àti àbájáde lásán yóò sọ agbára àwòrán inú Gíríìkì di pẹlẹbẹ; ẹsẹ náà ń fi ìlọsíwájú ìdẹwò hàn bí oyún, ìbímọ̀ àti ìdàgbàsókè.
- issue: Ìtumọ̀ θάνατος
  choice: ikú
  alternative: ikú ẹ̀mí tàbí ikú ayérayé
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘ikú’ lásán. Ìtumọ̀ náà gbọ́dọ̀ pa ìwọ̀n àti àìṣàlàyé yẹn mọ́, láìfi ẹ̀kọ́ kan tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbòò. A pa ìṣàpẹẹrẹ oyún–ìbímọ̀–ìdàgbàsókè mọ́, láìdín ‘ikú’ kù sí ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
