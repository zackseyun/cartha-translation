source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: yo
  text: Ẹ ka a sí ayọ̀ pátápátá, ẹ̀yin ará mi[a], nígbàkígbà tí ẹ bá bọ́ sínú onírúurú àdánwò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, ọ̀rọ̀ Gíríìkì ni “àwọn arákùnrin mi,” ṣùgbọ́n ó ṣeé ṣe kó ń pe gbogbo àwùjọ àwọn onígbàgbọ́, àwọn arákùnrin àti arábìnrin.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àdánwò,” “ìdánwò,” tàbí, ní àwọn àyíká kan, “ìdẹwò.” Níhìn-ín, ó ṣeé ṣe jù pé ó ń tọ́ka sí àwọn ìṣòro láti òde tó ń dán ìgbàgbọ́ wò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: ka gbogbo rẹ̀ sí ayọ̀
  rationale: Gbólóhùn yìí jẹ́ àṣepé fún ἡγήσασθε, ó sì túmọ̀ sí kí wọ́n wo gbogbo ohun tí ó ṣẹlẹ̀ náà gẹ́gẹ́ bí ayọ̀. Èyí sun mọ́ ‘all joy’ láìlo ọ̀rọ̀ tí kò bá èdè Yorùbá mu.
- source_word: ἡγήσασθε
  choice: Ẹ ka ... sí
  rationale: Ọ̀rọ̀ ìṣe àṣẹ yìí ń béèrè fún ìgbéyẹ̀wò tàbí ìṣírò inú. ‘Ka ... sí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ènìyàn gbà tàbí wo ohun kan gẹ́gẹ́ bí ohun mìíràn.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin ará mi
  rationale: ‘Ará mi’ jẹ́ ọ̀rọ̀ ìpè Yorùbá tó ní iyì, tí ó sì lè kan gbogbo àwọn onígbàgbọ́ láìka akọ tàbí abo; àlàyé ìsàlẹ̀ fi irú akọ ọ̀rọ̀ Gíríìkì hàn.
- source_word: ὅταν
  choice: nígbàkígbà tí
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe subjunctive, ὅταν ní ìtumọ̀ àkókò tí a kò dá mọ́ ohun kan ṣoṣo; ‘nígbàkígbà tí’ mú agbára ‘whenever’ yìí jáde.
- source_word: πειρασμοῖς
  choice: àdánwò
  rationale: Nínú àyíká ẹsẹ yìí, ọ̀rọ̀ náà tọ́ka sí ìṣòro tó ń dán ìgbàgbọ́ wò ju sí ìfẹ́kúfẹ̀ẹ́ tó ń fà ènìyàn sínú ẹ̀ṣẹ̀ lọ. Àlàyé ìsàlẹ̀ pa ìfẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: περιπέσητε
  choice: ẹ bá bọ́ sínú
  rationale: Èyí pa àwòrán gidi ọ̀rọ̀ Gíríìkì náà mọ́—bí ẹni tó bọ́ sínú ipò kan—ó sì jẹ́ Yorùbá tó ṣe déédéé.
- source_word: ποικίλοις
  choice: onírúurú
  rationale: ‘Onírúurú’ sọ ìyàtọ̀ àti ọ̀pọ̀lọpọ̀ irú tí ποικίλοις ń tọ́ka sí ní kúkúrú àti ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ἀδελφοί tó jẹ́ ọ̀rọ̀ akọ ní gírámà ń pe àwọn ọkùnrin nìkan tàbí gbogbo ìjọ
  choice: Lo ‘ẹ̀yin ará mi’ nínú ẹsẹ, kí àlàyé sì sọ pé ọ̀rọ̀ Gíríìkì ní ìtumọ̀ gangan ‘àwọn arákùnrin mi.’
  alternative: ẹ̀yin arákùnrin mi
  rationale: Nínú lẹ́tà sí ìjọ, ἀδελφοί sábà máa ń pe gbogbo àwùjọ àwọn onígbàgbọ́. ‘Ará’ jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ àwùjọ yìí mu, láìfi abo kún orísun; àlàyé náà jẹ́ kí irú gírámà Gíríìkì ṣì ṣe àyẹ̀wò.
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ọ̀rọ̀ àṣẹ ‘Ẹ ka’ àti ìpè ‘ẹ̀yin ará mi’ bá ọ̀pọ̀ ènìyàn mu; ‘bọ́ sínú’ pa àwòrán ọ̀rọ̀ orísun mọ́ láìjẹ́ kí gbolohun náà le láti lóye.
