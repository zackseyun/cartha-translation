id: JAS.1.25
reference: James 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó tẹjú wo inú òfin pípé náà[a], èyí tí í ṣe òfin òmìnira, tí ó sì dúró ṣinṣin nínú rẹ̀—tí kò di olùgbọ́ tí ń gbàgbé[b], bí kò ṣe olùṣe iṣẹ́[c]—ẹni yìí ni yóò jẹ́ alábùkún nínú ohun tí ó ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “òfin pípé ti òmìnira.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “olùgbọ́ ìgbàgbé”; ìyẹn ni, olùgbọ́ tí ó máa ń gbàgbé.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “olùṣe iṣẹ́.” Ọ̀rọ̀ náà tẹnumọ́ ẹni tí ń ṣe iṣẹ́, kì í ṣe ẹni tí ń gbọ́ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: tẹjú mọ́ inú
  rationale: Ó fi ìwòye pẹ̀lú àkíyèsí hàn, kì í ṣe wíwo lásán; ó tún jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: òfin pípé náà, èyí tí í ṣe òfin òmìnira
  rationale: Ìtumọ̀ yìí pa ìṣètò àfikún-àlàyé Gíríìkì mọ́, láì pinnu bóyá ó túmọ̀ sí òfin tí ń fúnni ní òmìnira.
- source_word: παραμείνας
  choice: dúró ṣinṣin nínú rẹ̀
  rationale: Ó sọ ìfaradà àti títẹ̀síwájú nínú ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, kì í ṣe dídúró fún ìgbà díẹ̀.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: tí kò di olùgbọ́ tí ń gbàgbé
  rationale: Ó sọ ìtumọ̀ ìsọ̀rí-orúkọ Gíríìkì náà ní Yorùbá tí ó ṣe kedere, ó sì pa ìṣe dídì olùgbọ́ bẹ́ẹ̀ mọ́.
- source_word: ποιητὴς ἔργου
  choice: olùṣe iṣẹ́
  rationale: Ó pa ἔργον mọ́ gẹ́gẹ́ bí ‘iṣẹ́/ìṣe,’ dípò yíyí i padà sí ‘ọ̀rọ̀’ nítorí àyíká ẹsẹ tó ṣáájú.
- source_word: μακάριος
  choice: alábùkún
  rationale: Ó pa ìtumọ̀ ìbùkún Ọlọ́run àti ìdùnnú rere mọ́ ju ‘aláyọ̀’ lásán lọ.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: nínú ohun tí ó ń ṣe
  rationale: Ìtumọ̀ Yorùbá àdánidá ni fún ‘nínú ṣíṣe rẹ̀,’ ó sì so mọ́ ìtẹnumọ́ lórí ìṣe.
- source_word: ὁ ... οὗτος
  choice: ẹni tí ... ẹni yìí
  rationale: Ó pa ẹyọ aṣojú náà mọ́ láì fi ìtumọ̀ náà mọ́ akọ nìkan.
theological_decisions:
- issue: Ìtumọ̀ ‘òfin òmìnira’
  choice: Pa á mọ́ gẹ́gẹ́ bí ‘òfin òmìnira.’
  alternative: ‘òfin tí ń fúnni ní òmìnira’ tàbí ìdánimọ̀ rẹ̀ ní pàtó pẹ̀lú ìhìnrere tàbí òfin ìwà rere
  rationale: Gíríìkì fi àjọṣe náà sílẹ̀ ní fífẹ̀; ìtumọ̀ kò gbọ́dọ̀ fi ẹ̀kọ́ ìjọ kan pàtó kún un.
- issue: Akọ gírámà gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: Lo ‘ẹni’ àti ‘ẹni yìí.’
  alternative: ‘ọkùnrin náà’
  rationale: Nínú àyíká yìí, akọ ẹyọ Gíríìkì dúró fún ẹnikẹ́ni, kì í ṣe ọkùnrin nìkan.
- issue: Ìbùkún àti ìṣe
  choice: Sọ pé ẹni náà ‘yóò jẹ́ alábùkún nínú ohun tí ó ń ṣe.’
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìgbàlà nípasẹ̀ iṣẹ́ tàbí gẹ́gẹ́ bí àṣeyọrí ayé nìkan
  rationale: Ọ̀rọ̀ náà so ìbùkún mọ́ ìṣe, ṣùgbọ́n kò ṣe àlàyé ẹ̀kọ́ nípa ìdáláre tàbí irú ìbùkún náà; a pa ìfọ̀kànbalẹ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. ‘Tẹjú mọ́ inú’ mú àwòrán ìwòye pẹ̀lú àkíyèsí wá, ‘dúró ṣinṣin’ sì fi ìfaradà hàn. A lo ‘ẹni’ fún akọ aṣojú Gíríìkì.
