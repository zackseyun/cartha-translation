base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: yo
  text: Nítorí ó wo ara rẹ̀, ó sì lọ; lẹ́sẹ̀kẹsẹ̀ ni ó gbàgbé irú ẹni tí ó jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ti rí.” Gbólóhùn Gíríìkì náà ń tọ́ka sí irú tàbí ànímọ́ ẹni tí ó jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: ó wo
  rationale: Nínú àpèjúwe dígí yìí, “ó wo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ojú kíyè sí ara ẹni, ó sì bá ìṣe pàtó tí ọ̀rọ̀ Gíríìkì náà ń sọ mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé tí γάρ ní pẹ̀lú ẹsẹ tó ṣáájú mọ́.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ afẹniṣe náà túmọ̀ sí “ara rẹ̀”; kò yẹ kí a tún “ojú” fi kún un nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé dígí àti ojú wà nínú àyíká ọ̀rọ̀ náà.
- source_word: ἀπελήλυθεν
  choice: ó sì kúrò níbẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ perfect, ó wà nínú tẹ̀léńtẹ̀lé ìtàn; “ó sì kúrò níbẹ̀” jẹ́ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ lílọ kúrò mọ́.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: “Lẹ́sẹ̀kẹsẹ̀” fi bí ìgbàgbé náà ṣe ṣẹlẹ̀ kíákíá hàn ní kíkún.
- source_word: ἐπελάθετο
  choice: ó gbàgbé
  rationale: “Ó gbàgbé” ni ọ̀nà Yorùbá tó tààrà jù lọ láti sọ pé ẹni náà kò rántí mọ́.
- source_word: ὁποῖος ἦν
  choice: irú ẹni tí òun jẹ́
  rationale: ὁποῖος ń béèrè nípa irú tàbí ànímọ́ ẹni, kì í ṣe ìdánimọ̀ rẹ̀ nìkan. “Irú ẹni tí òun jẹ́” pa ìtumọ̀ yìí mọ́, ó sì jẹ́ kí àpẹẹrẹ náà kan gbogbo ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ akọ tí a lò gẹ́gẹ́ bí àpẹẹrẹ gbogbo ènìyàn nínú àkàwé dígí
  choice: irú ẹni tí òun jẹ́
  alternative: irú ọkùnrin tí ó jẹ́
  rationale: Bí àwọn ọ̀rọ̀ Gíríìkì ṣe jẹ́ akọ ẹyọ ní gírámà, ẹni tí a ń sọ̀rọ̀ rẹ̀ dúró fún ẹnikẹ́ni. “Ẹni” fi ìtumọ̀ gbogbogbò náà hàn láìfi akọ tàbí abo tí orísun kò tẹnumọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ, ni a lò. Èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì. Àmì olódídá méjì pín ìṣe lílọ kúrò àti ìgbàgbé lẹ́sẹ̀kẹsẹ̀ ní ọ̀nà tó rọrùn láti kà.
