id: JAS.1.26
reference: James 1:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá rò pé òun jẹ́ ẹni ẹlẹ́sìn, tí kò fi ìjánu di ahọ́n rẹ̀ ṣùgbọ́n tí ó ń tan ọkàn rẹ̀ jẹ, ẹ̀sìn ẹni náà jẹ́ asán.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖ
  choice: rò pé
  rationale: Ó fi ìdájọ́ tí ẹni náà ṣe nípa ara rẹ̀ hàn, dípò kí a sọ pé ó kàn dà bí ẹni pé ó jẹ́ bẹ́ẹ̀.
- source_word: θρησκὸς
  choice: olùfọkànsìn sí ẹ̀sìn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ẹni tí ó ka ara rẹ̀ sí olùṣe ẹ̀sìn tàbí olùbọ̀wọ̀ fún ẹ̀sìn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, kò sì fi í mọ́ ẹ̀ya ìjọ kan.
- source_word: χαλιναγωγῶν
  choice: kó ìjánu sí
  rationale: Ó pa àwòrán ìjánu tí a fi ń darí ẹranko mọ́, ó sì bá lílo àwòrán kan náà ní Jákọ́bù 3:2 mu.
- source_word: γλῶσσαν αὐτοῦ
  choice: ahọ́n rẹ̀
  rationale: Ìtumọ̀ gidi yìí pa àwòrán ahọ́n mọ́ dípò yíyí i sí ọ̀rọ̀ ẹnu lásán.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: ń tan ọkàn ara rẹ̀ jẹ
  rationale: Ó pa ọkàn gẹ́gẹ́ bí inú ẹni mọ́, ó sì sọ ìtan ara ẹni jẹ ní Yorùbá tí ó ṣe kedere.
- source_word: τούτου
  choice: ẹni náà
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka mọ́, ó sì tọ́ka padà sí ẹni tí a ṣàpèjúwe.
- source_word: μάταιος
  choice: asán
  rationale: “Asán” sọ pé ẹ̀sìn náà ṣófo, kò ní èrè tàbí ìwúlò; ó pa ìtumọ̀ μάταιος mọ́ ní ṣókí.
- source_word: ἡ θρησκεία
  choice: ẹ̀sìn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó taara fún ìṣe àti ìfarahàn ẹ̀sìn, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú θρησκός mọ́.
theological_decisions:
- issue: Ìtọ́kasí gbogbogbò sí akọ tàbí abo
  choice: ẹnikẹ́ni ... òun ... rẹ̀ ... ẹni náà
  alternative: ọkùnrin kan ... tirẹ̀
  rationale: Àwọn arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn. “Ẹnikẹ́ni” pa agbára gbogbogbò ti εἴ τις mọ́ láì dín ìtumọ̀ sí akọ nìkan.
- issue: Ìtumọ̀ θρησκεία/θρησκός
  choice: olùfọkànsìn sí ẹ̀sìn / ẹ̀sìn
  alternative: olùfọkànsìn / ìfọkànsìn
  rationale: Yíyan “ẹ̀sìn” pa ìsopọ̀ ọ̀rọ̀ méjèèjì mọ́, ó sì jẹ́ kí ó ṣe kedere pé Jákọ́bù ń dán ìṣe ẹ̀sìn tí ẹni ń jẹ́wọ́ wò, kì í ṣe pé ó ń kọ gbogbo ẹ̀sìn sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ìjánu àti ọkàn mọ́ láti inú Gíríìkì.
