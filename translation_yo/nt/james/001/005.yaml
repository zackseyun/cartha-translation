id: JAS.1.5
reference: James 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni nínú yín bá ṣe aláìní ọgbọ́n, kí ó béèrè lọ́wọ́ Ọlọ́run, ẹni tí ń fún gbogbo ènìyàn ní ọ̀làwọ́, láì gàn ẹnikẹ́ni[a]; a ó sì fi í fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láì wá àléébù.”
    reason: lexical_alternative
  - marker: b
    text: Èdè Gíríìkì lo ọ̀nà akọ ẹni kan ṣoṣo ní ìtumọ̀ aṣojú fún ẹnikẹ́ni nínú wọn. Àwọn ọ̀rọ̀ Yorùbá “ó” àti “un” kò fi akọ tàbí abo hàn.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ṣùgbọ́n bí
  rationale: “Ṣùgbọ́n” fi ìtẹ̀síwájú tàbí ìyàtọ̀ kékeré tí δέ ń tọ́ka sí hàn, “bí” sì ṣàfihàn gbólóhùn àídájú.
- source_word: τις ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni àìdá kan láàárín àwọn tí a ń bá sọ̀rọ̀.
- source_word: λείπεται σοφίας
  choice: bá ṣe aláìní ọgbọ́n
  rationale: Ó sọ ipò àìní ọgbọ́n ní kedere láì dín ìtumọ̀ σοφία kù sí irú ọgbọ́n kan pàtó.
- source_word: αἰτείτω παρὰ ... θεοῦ
  choice: kí ó béèrè lọ́wọ́ Ọlọ́run
  rationale: “Kí ó béèrè” dúró fún àṣẹ ẹni-kẹta, “lọ́wọ́ Ọlọ́run” sì jẹ́ ọ̀nà Yorùbá àdánidá fún béèrè ohun kan láti ọ̀dọ̀ Ọlọ́run.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Ọlọ́run, ẹni tí ń fún gbogbo ènìyàn
  rationale: Ó pa àpèjúwe Ọlọ́run gẹ́gẹ́ bí ẹni tí ń fúnni mọ́, ó sì jẹ́ kí ìwọ̀n gbígbòòrò πᾶσιν hàn.
- source_word: ἁπλῶς
  choice: ní ọ̀pọ̀ yanturu
  rationale: Nínú ọ̀rọ̀ nípa fífúnni, gbólóhùn yìí sọ ìwà ọ̀làwọ́ àti fífúnni láì háwọ́ jáde ní Yorùbá tí ó ṣe kedere.
- source_word: μὴ ὀνειδίζοντος
  choice: láì gàn ẹnikẹ́ni
  rationale: Ó mú èrò pé Ọlọ́run kì í gàn tàbí dójú ti ẹni tí ó béèrè jáde; “ẹnikẹ́ni” ni a fi kun gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà kàn ní Yorùbá.
- source_word: δοθήσεται αὐτῷ
  choice: a ó sì fi í fún un
  rationale: Ìṣe aláìlórúkọ “a ó fi” pa ìrísí ọ̀rọ̀-ìṣe passive mọ́ lọ́nà Yorùbá àdánidá; “í” ń tọ́ka sí ọgbọ́n.
theological_decisions:
- issue: Èdè akọ tó dúró fún gbogbo ènìyàn
  choice: kí ó béèrè ... a ó sì fi í fún un
  alternative: kí ẹni náà béèrè ... a ó sì fi í fún ẹni náà
  rationale: Gíríìkì lo ẹni kan ṣoṣo ní ìtumọ̀ aṣojú. Àwọn arọ́pò-orúkọ Yorùbá “ó” àti “un” kò fi akọ tàbí abo hàn, nítorí náà wọ́n pa ẹni kan ṣoṣo àti ìtumọ̀ gbogbogbò mọ́ láì ṣàfikún akọ tàbí abo.
- issue: Ìtumọ̀ ἁπλῶς nínú fífúnni Ọlọ́run
  choice: ní ọ̀pọ̀ yanturu
  alternative: tọkàntọkàn; láì háwọ́
  rationale: Yíyan “ní ọ̀pọ̀ yanturu” tẹnu mọ́ ìwà ọ̀làwọ́ Ọlọ́run nínú fífúnni, ṣùgbọ́n kò sọ ẹ̀kọ́ ọrọ̀-ajé tàbí ìlérí ọrọ̀ sí i.
- issue: Ohun tí μὴ ὀνειδίζοντος túmọ̀ sí
  choice: láì gàn ẹnikẹ́ni
  alternative: láì wá àléébù
  rationale: Ìtumọ̀ pàtàkì ni pé Ọlọ́run kì í fi ẹ̀gàn tàbí ìtìjú bá ẹni tí ó béèrè; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀ láti pa ìbú ìtumọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. “Ní ọ̀pọ̀ yanturu” jẹ́ gbólóhùn àdánidá fún fífúnni lọ́pọ̀ àti lọ́wọ́ ọ̀làwọ́; “láì gàn ẹnikẹ́ni” yàgò fún èdè ẹ̀sìn àtijọ́ tí ó le ṣòro láti lóye.
