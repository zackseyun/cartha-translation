reference: James 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: yo
  text: Alábùkún-fún ni ọkùnrin tí ó ń fara da ìdánwò[a], nítorí lẹ́yìn tí ó bá ti yege nínú ìdánwò, yóò gba adé ìyè[b], èyí tí Ọlọ́run ṣèlérí fún àwọn tí wọ́n nífẹ̀ẹ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìdẹwò” tàbí “ìdánwò láti mọ bí ẹni ṣe rí.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì—ìṣòro tí ń dán ẹni wò àti ohun tí ń fà ẹni sínú ẹ̀ṣẹ̀—ṣùgbọ́n níbí, ọ̀rọ̀ yìí tẹnu mọ́ fífarada nígbà ìdánwò.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “adé” lè tọ́ka sí adé ewé tí a máa ń fi fún ẹni tó borí nínú ìdíje, kì í ṣe dandan adé ọba.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Alábùkún ni
  rationale: Ó pa ìró àti ìwọ̀n ọ̀rọ̀ ìbùkún mọ́ ju “aláyọ̀” lọ, tí ó lè dà bí ìmọ̀lára inú nìkan.
- source_word: ἀνὴρ
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ẹyọ, ó sì dúró gẹ́gẹ́ bí àpẹẹrẹ fún ẹni tí ó fara da ìdánwò; “ọkùnrin” pa ìrísí orísun náà mọ́.
- source_word: ὑπομένει
  choice: ń fara da
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti ìwòde-òní, ó sì fi ìfaradà tí ó dúró ṣinṣin lábẹ́ ìnira hàn.
- source_word: πειρασμόν
  choice: ìdánwò
  rationale: Àyíká ọ̀rọ̀ tẹnu mọ́ ìfaradà lábẹ́ ohun tí ń dán ẹni wò. Àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ mìíràn, “ìdẹwò,” mọ́.
- source_word: δόκιμος γενόμενος
  choice: lẹ́yìn tí ó bá ti yege nínú ìdánwò náà
  rationale: Èyí sọ ipa àkókò ti participle náà àti èrò jíjẹ́ ẹni tí a ti dán wò tí ó sì yege ní Yorùbá àdánidá.
- source_word: λήμψεται
  choice: yóò gba
  rationale: Ó sọ ọjọ́ iwájú àti gbígba ohun tí a ṣèlérí ní kedere.
- source_word: στέφανον τῆς ζωῆς
  choice: adé ìyè
  rationale: Ó pa àwòrán àti ìbáṣepọ̀ genitive ti orísun mọ́; àlàyé ìsàlẹ̀ ojú-ewé ṣàlàyé pé ó lè jẹ́ adé ẹni tó borí, kì í ṣe adé ọba.
- source_word: ἐπηγγείλατο
  choice: Ọlọ́run ṣèlérí
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì kò sọ olùṣe ní gbangba, ṣùgbọ́n àyíká àti “àwọn tí ó nífẹ̀ẹ́ rẹ̀” fi Ọlọ́run hàn gẹ́gẹ́ bí olùṣe; sísọ orúkọ náà mú kí Yorùbá má ṣe dà bí ẹni pé ọkùnrin tí a mẹ́nu kàn ni ó ṣe ìlérí.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: fún àwọn tí ó nífẹ̀ẹ́ rẹ̀
  rationale: Ó fi dative àti ìfẹ́ tí ń jẹ́ ànímọ́ wọn hàn ní Yorùbá tí ó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ πειρασμός nínú Jákọ́bù 1:12
  choice: ìdánwò
  alternative: ìdẹwò; ìdánwò láti mọ bí ẹni ṣe rí
  rationale: Ìfaradà, jíjẹ́ ẹni tí ó yege, àti èrè ni àyíká ẹsẹ yìí tẹnu mọ́. Síbẹ̀, àlàyé ìsàlẹ̀ ojú-ewé pa agbègbè ìtumọ̀ tí ó tún lè kan ìdẹwò mọ́.
- issue: Ta ni olùṣe ἐπηγγείλατο?
  choice: Ọlọ́run
  alternative: lílo arọ́pò-orúkọ “ó” láì sọ ẹni náà ní pàtó
  rationale: Kókó ọ̀rọ̀-ìṣe náà farapamọ́ nínú Gíríìkì, ṣùgbọ́n àwọn tí ó “nífẹ̀ẹ́ rẹ̀” àti àyíká lẹ́tà náà tọ́ka sí Ọlọ́run. Yorùbá nílò ìtọ́kasí tó ṣe kedere kí arọ́pò-orúkọ má bàa tọ́ka sí ọkùnrin tó fara da ìdánwò.
translation_notes:
  register: Yorùbá boṣewa, ti ìwòde-òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ń fara da” àti “yege nínú ìdánwò” fún ìtumọ̀ tó ṣe kedere sí òǹkàwé lasán, nígbà tí “adé ìyè” pa àwòrán Bíbélì mọ́.
