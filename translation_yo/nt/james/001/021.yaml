  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: yo
  text: Nítorí náà, ẹ mú gbogbo ìwà ẹlẹ́gbin àti àpọ̀jù ìwà búburú[a] kúrò, kí ẹ sì fi ìwà pẹ̀lẹ́[b] gba ọ̀rọ̀ tí a gbìn sínú yín[c], èyí tí ó lè gba ọkàn yín là[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀pọ̀lọpọ̀ ìwà búburú” tàbí “ìwà arankàn tí ó pọ̀ rékọjá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú ìwà tútù” tàbí “nínú ìrẹ̀lẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ọ̀rọ̀ tí ó wà nínú yín láti ìbí”; ìtumọ̀ àtijọ́ kan ni, “ọ̀rọ̀ tí a fi wọ́ sínú yín.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìyè yín” tàbí “ẹ̀yin fúnra yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìkìlọ̀ yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti so ọ̀rọ̀ pọ̀ ní Yorùbá.
- source_word: ἀποθέμενοι
  choice: bí ẹ ti mú ... kúrò
  rationale: Ó pa ipa participle mọ́ gẹ́gẹ́ bí ìṣe tí ó ṣáájú tàbí tí ó bá àṣẹ ‘ẹ ... gba’ lọ, láì sọ ọ́ di àṣẹ mìíràn tí ó dúró lọ́tọ̀.
- source_word: πᾶσαν ῥυπαρίαν
  choice: gbogbo ohun ẹlẹ́gbin
  rationale: Ó pa àwòrán ìdọ̀tí mọ́, ṣùgbọ́n nínú àyíká yìí ó ń tọ́ka sí ohun tí ó bàjẹ́ nípa ìwà.
- source_word: περισσείαν κακίας
  choice: àpọ̀jù ìwà búburú
  rationale: ‘Àpọ̀jù’ mú èrò ohun tí ó pọ̀ rékọjá tàbí tí ó kún boṣewa wá; ‘ìwà búburú’ kò fi κακία mọ́ sí ìkórìíra nìkan.
- source_word: ἐν πραΰτητι
  choice: ẹ fi inú tútù
  rationale: Gbólóhùn Yorùbá yìí jẹ́ àdánidá fún ìwà pẹ̀lẹ́, tí kò le tàbí gbéraga, nígbà tí àlàyé ìsàlẹ̀ fi ìrẹ̀lẹ̀ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: δέξασθε
  choice: ẹ ... gba
  rationale: Ó pa agbára àṣẹ náà mọ́, ó sì lè túmọ̀ sí gbígba ohun kan tọkàntọkàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τὸν ἔμφυτον λόγον
  choice: ọ̀rọ̀ tí a ti gbìn sí inú yín
  rationale: Ó pa àwòrán ohun tí a gbìn sínú ènìyàn mọ́, láìsọ ẹni tó gbìn ín tàbí ọ̀nà tí a fi gbìn ín ní pàtó.
- source_word: τὸν δυνάμενον σῶσαι
  choice: èyí tí ó lè ... là
  rationale: Ó sọ agbára ọ̀rọ̀ náà láti gba ni là, láìsọ ọ̀nà iṣẹ́ náà ju ohun tí Gíríìkì sọ lọ.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: ọkàn yín
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún inú ènìyàn tàbí ẹni rẹ̀ ní àyíká ìgbàlà; àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ìyè’ àti ‘ẹ̀yin fúnra yín’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχὰς ὑμῶν nínú ọ̀rọ̀ ìgbàlà
  choice: ọkàn yín
  alternative: ìyè yín; ẹ̀yin fúnra yín
  rationale: Yíyan ‘ọkàn yín’ pa ìwọ̀n ẹ̀kọ́ ìgbàlà inú gbólóhùn náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àwọn ìtumọ̀ gbooro ti ψυχή ṣì hàn.
- issue: Ìtumọ̀ ἔμφυτον λόγον
  choice: ọ̀rọ̀ tí a ti gbìn sí inú yín
  alternative: ọ̀rọ̀ tí ó wà nínú yín láti ìbẹ̀rẹ̀; ọ̀rọ̀ tí a lọ́ mọ́ yín
  rationale: Ìtumọ̀ yìí pa àwòrán gbígbìn àti ìwànínú mọ́, láìdáhùn ní pàtó bóyá ohun tí a tẹnu mọ́ ni ìṣe Ọlọ́run tàbí bí ọ̀rọ̀ náà ṣe ti ta gbòǹgbò nínú àwọn olùgbọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀pọ̀ ènìyàn ‘ẹ’ gẹ́gẹ́ bí ó ṣe yẹ fún ὑμῶν àti àṣẹ ọ̀pọ̀; a sì fi àmì ohùn sí ibi tí ó jẹ́ àdánidá.
