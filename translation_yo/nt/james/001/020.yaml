  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: yo
  text: Nítorí ìbínú ènìyàn kì í mú òdodo Ọlọ́run ṣẹ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ
  choice: ìbínú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìbínú tàbí ìrunú; “ìbínú” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọ̀rọ̀ inú ẹsẹ náà mu.
- source_word: ἀνδρὸς
  choice: ènìyàn
  rationale: Nínú gbólóhùn yìí, ἀνήρ tọ́ka sí ènìyàn ní ìyàtọ̀ sí Ọlọ́run, kì í ṣe dandan pé ọkùnrin nìkan; “ènìyàn” jẹ́ àfihàn àpapọ̀ tó yẹ.
- source_word: δικαιοσύνην θεοῦ
  choice: òdodo Ọlọ́run
  rationale: Èyí pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láì pinnu bóyá ó túmọ̀ sí òdodo tí Ọlọ́run ní, tí ó ń béèrè, tàbí tí ó ń mú wá.
- source_word: οὐκ ἐργάζεται
  choice: kì í mú ... ṣẹ
  rationale: Gbólóhùn Yorùbá yìí sọ pé ìbínú ènìyàn kì í ṣàṣeyọrí tàbí mú òdodo Ọlọ́run jáde, ó sì dá ìtumọ̀ ọ̀rọ̀ Gíríìkì dúró ní èdè àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘òdodo Ọlọ́run’ (δικαιοσύνη θεοῦ)
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘òdodo Ọlọ́run’ láì fi àlàyé kún un.
  alternative: ‘ohun tí ó tọ́ níwájú Ọlọ́run’ tàbí ‘òdodo tí Ọlọ́run ń fẹ́’
  rationale: Gíríìkì lè gba ìtumọ̀ tó ju ọ̀kan lọ; yíyan gbolohun genitive taara ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú orísun náà mọ́.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn kíkún níbi tó yẹ. ‘Kì í mú ... ṣẹ’ jẹ́ gbólóhùn tó rọrùn fún òǹkàwé lónìí, tí kò sì sọ pé ìbínú kan ṣoṣo ni a ń tọ́ka sí, bí kò ṣe ohun tí ìbínú ènìyàn máa ń ṣe.
