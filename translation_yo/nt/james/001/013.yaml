id: JAS.1.13
reference: James 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: yo
  text: Kí ẹnikẹ́ni tí a ń dán wò má ṣe sọ pé, “Ọlọ́run ni ó ń dán mi wò,” nítorí a kò lè fi ohun búburú dán Ọlọ́run wò,[a] òun fúnra rẹ̀ kò sì dán ẹnikẹ́ni wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀-ọ̀rọ̀, Gíríìkì náà sọ pé, “Ọlọ́run jẹ́ ẹni tí ohun búburú kò lè dán wò.” Ọ̀rọ̀ náà ṣọ̀wọ́n, ó sì nira láti túmọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: Kí ẹnikẹ́ni ... má ṣe sọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìfòfindè ẹni-kẹta hàn, ó sì pa agbára àṣẹ Gíríìkì mọ́.
- source_word: πειραζόμενος
  choice: tí a ń dán wò
  rationale: Ọ̀rọ̀ náà jẹ́ participle aláìṣe ní àkókò tí ń lọ; ‘a ń dán wò’ pa ìtumọ̀ aláìṣe àti ohun tí ń ṣẹlẹ̀ lọ́wọ́ mọ́. Ní àyíká ẹsẹ yìí, ó tọ́ka sí ìdẹwò sí ibi, bí ó tilẹ̀ jẹ́ pé gbólóhùn Yorùbá náà tún lè ní ìtumọ̀ fífi ẹni yẹ̀ wò.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Ọlọ́run ni ó ń dán mi wò
  rationale: Ìṣètò ‘X ni ó...’ fi Ọlọ́run hàn gẹ́gẹ́ bí orísun tàbí olùṣe, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ju títúmọ̀ ἀπό ní ọ̀rọ̀-ọ̀rọ̀ lọ.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: a kò lè fi ohun búburú dán Ọlọ́run wò
  rationale: Adjective ἀπείραστος ṣòro, ó sì ṣọ̀wọ́n. Ìtumọ̀ yìí fi hàn ní Yorùbá àdánidá pé ibi kò lè dẹ Ọlọ́run wò, nígbà tí àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ Gíríìkì tó sún mọ́ ọ̀rọ̀-ọ̀rọ̀.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: òun fúnra rẹ̀ kò sì dán ẹnikẹ́ni wò
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́; ‘ẹnikẹ́ni’ jẹ́ ohun tí ọ̀rọ̀ ìṣe kọ̀, ó sì bá Yorùbá àdánidá mu.
theological_decisions:
- issue: Ìtumọ̀ πειράζω nínú ẹsẹ yìí
  choice: Lo ‘dán ... wò’ ní gbogbo ibi, pẹ̀lú àyíká tó fi ìdẹwò sí ibi hàn.
  alternative: Lo ‘dẹ ... wò’ tàbí ‘tan ... sínú ẹ̀ṣẹ̀’ ní gbogbo ibi.
  rationale: ‘Dán wò’ pa àtúnṣe ọ̀rọ̀ Gíríìkì àti ìwọ̀n ìtumọ̀ rẹ̀ mọ́, nígbà tí ‘ohun búburú’ àti àyíká ẹsẹ tó tẹ̀ lé e ṣàlàyé pé ìdẹwò sí ibi ni a ń sọ. Èyí kò tako ẹ̀kọ́ Bíbélì ní ibòmíràn pé Ọlọ́run lè dán ènìyàn wò ní ọ̀nà fífi ìgbàgbọ́ rẹ̀ yẹ̀.
- issue: Ìtumọ̀ ἀπείραστός ἐστιν κακῶν
  choice: ‘a kò lè fi ohun búburú dán Ọlọ́run wò’
  alternative: ‘Ọlọ́run kò mọ ìrírí ibi’ tàbí ‘a kò gbọ́dọ̀ fi ibi dán Ọlọ́run wò’
  rationale: 'Ìtumọ̀ yìí bá ìjiyàn ẹsẹ náà mu jù: ibi kò ní agbára láti dẹ Ọlọ́run wò, òun náà kò sì dẹ ẹnikẹ́ni wò. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì náà ṣọ̀wọ́n, ó sì nira láti túmọ̀.'
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn ‘a ń dán wò’ ní ìwọ̀n ìtumọ̀ tí ó lè jẹ́ ìdánwò tàbí ìdẹwò; àyíká ‘ohun búburú’ ló sọ ìtumọ̀ ibi di mímọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan kún ọ̀rọ̀ orísun.
