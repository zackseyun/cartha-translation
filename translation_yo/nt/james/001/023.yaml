id: JAS.1.23
reference: James 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: yo
  text: Nítorí bí ẹnikẹ́ni bá jẹ́ olùgbọ́ ọ̀rọ̀ náà, tí kì í sì í ṣe olùṣe rẹ̀, ẹni náà dàbí ọkùnrin kan tí ń wo ojú ìbí rẹ̀[a] dáadáa nínú dígí,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ojú àdánidá rẹ̀.” Ní Gíríìkì, gbólóhùn náà túmọ̀ ní tààrà pé “ojú ìbí rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς
  choice: olùgbọ́
  rationale: Ó pa ìfiwéra orúkọ-ìṣe tó wà láàárín ẹni tí ń gbọ́ àti ẹni tí ń ṣe mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: λόγου
  choice: ọ̀rọ̀ náà
  rationale: ‘Ọ̀rọ̀’ ni ìtumọ̀ tààrà fún λόγος níbí, ó sì bá àyíká ọ̀rọ̀ Jákọ́bù mu, níbi tí ó ti ń tọ́ka sí ọ̀rọ̀ Ọlọ́run tí a kéde.
- source_word: ποιητής
  choice: olùṣe rẹ̀
  rationale: Ó fi orúkọ ẹni tó ń ṣe ohun kan hàn, ó sì mú kí ìyàtọ̀ láàárín ‘olùgbọ́’ àti ‘olùṣe’ ṣe kedere; ‘rẹ̀’ mú kí ó ṣe kedere pé ṣíṣe ọ̀rọ̀ náà ni a ń sọ.
- source_word: ἔοικεν
  choice: dàbí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìfiwéra tí ọ̀rọ̀ Gíríìkì náà ń ṣe.
- source_word: ἀνδρὶ
  choice: ọkùnrin kan
  rationale: Ó pa ìtumọ̀ akọ pàtó ti ἀνήρ mọ́, bí ó tilẹ̀ jẹ́ pé àpẹẹrẹ náà kan gbogbo ènìyàn.
- source_word: κατανοοῦντι
  choice: tí ń wo ... dáadáa
  rationale: ‘Dáadáa’ mú ìfiyèsí pẹkipẹki tó wà nínú κατανοέω jáde, kì í ṣe wíwo lásán.
- source_word: τὸ πρόσωπον
  choice: ojú
  rationale: ‘Ojú’ ni ìtumọ̀ tààrà àti àdánidá nínú àwòrán dígí yìí.
- source_word: τῆς γενέσεως αὐτοῦ
  choice: ojú ìbí rẹ̀
  rationale: A pa ọ̀nà ìsọ̀rọ̀ Gíríìkì náà mọ́ ní tààrà, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ àdánidá rẹ̀ hàn.
- source_word: ἐν ἐσόπτρῳ
  choice: nínú dígí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ohun tí ènìyàn fi ń wo àwòrán ara rẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tó dúró fún àpẹẹrẹ gbogbogbò nínú ἀνδρὶ
  choice: ọkùnrin kan
  alternative: ènìyàn kan
  rationale: Nítorí ἀνήρ jẹ́ ọ̀rọ̀ akọ pàtó, a pa ìyẹn mọ́ láì dí àpẹẹrẹ gbogbogbò tí àyíká ọ̀rọ̀ ń fi hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere ni a lò. ‘Olùgbọ́’ àti ‘olùṣe’ pa ìfarajọ́ ìsọ̀rọ̀ orísun mọ́; ‘ojú ìbí rẹ̀’ jẹ́ ìtumọ̀ tó sún mọ́ Gíríìkì, pẹ̀lú àlàyé fún ọ̀nà àdánidá jù lọ.
