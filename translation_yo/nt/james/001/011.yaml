id: JAS.1.11
reference: James 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: yo
  text: Nítorí oòrùn yọ pẹ̀lú ìgbóná líle[a], ó sì mú koríko gbẹ; òdòdó rẹ̀ ṣubú, ẹwà ìrísí rẹ̀ sì pòórá. Bákan náà ni ọlọ́rọ̀ yóò rọ ní àwọn ìgbòkègbodò rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú ẹ̀fúùfù gbígbóná.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbóná tó ń jóni, àti ní àwọn àyíká kan, sí ẹ̀fúùfù gbígbóná tó ń mú irú ìgbóná bẹ́ẹ̀ wá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní àwọn ìrìn-àjò rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìrìn-àjò gidi tàbí, ní ìtumọ̀ gbòòrò, sí ipa ìgbésí ayé, iṣẹ́, àti ohun tí ènìyàn ń lépa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: yọ
  rationale: Ọ̀rọ̀ yìí ṣe àpẹẹrẹ ohun tó ṣẹlẹ̀ ní kánkán; “yọ” jẹ́ ọ̀nà Yorùbá àdánidá fún bí oòrùn ṣe gòkè, ó sì bá ìtumọ̀ aorist mu láìfi ìtumọ̀ míì kún un.
- source_word: σὺν τῷ καύσωνι
  choice: pẹ̀lú ìgbóná líle
  rationale: καύσων lè túmọ̀ sí ooru tó ń jóni tàbí ẹ̀fúùfù gbígbóná. Nítorí oòrùn ni olùṣe nínú gbólóhùn náà, “ìgbóná líle” jẹ́ èdè Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ẹ̀fúùfù sílẹ̀.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: mú koríko gbẹ
  rationale: Èyí sọ ipa tí ìgbóná ní lórí ewéko ní ọ̀nà Yorùbá tó wọ́pọ̀, ó sì pa àwòrán gidi ti koríko gbígbẹ mọ́.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: òdòdó rẹ̀ jábọ́
  rationale: “Jábọ́” pa ìṣe gidi ti òdòdó tó bọ́ kúrò lára koríko mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: ẹwà ìrísí rẹ̀
  rationale: Nínú àwòrán òdòdó yìí, πρόσωπον ń tọ́ka sí ìrísí rẹ̀ dípò ojú gidi; “ẹwà ìrísí rẹ̀” mú èrò náà hàn láìsọ òdòdó di ènìyàn.
- source_word: ἀπώλετο
  choice: pòórá
  rationale: Fọ́ọ̀mù yìí tọ́ka sí bí ẹwà náà ṣe parí tàbí sọnù. “Pòórá” jẹ́ ọ̀rọ̀ tó ṣe kedere, tó sì bá àwòrán ẹwà tó kọjá lọ mu.
- source_word: ὁ πλούσιος
  choice: ọlọ́rọ̀
  rationale: “Ọlọ́rọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tó lówó. Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo fọ́ọ̀mù akọ ẹyọ kan, Yorùbá kò ní àmì akọ tàbí abo nínú ọ̀rọ̀ yìí; fífi “ọkùnrin” kún un lè dín ìkìlọ̀ náà kù ju ohun tí gírámà Gíríìkì fúnra rẹ̀ béèrè lọ.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: ní àárín àwọn ìgbòkègbodò rẹ̀
  rationale: πορεία lè jẹ́ ìrìn-àjò gidi tàbí ipa ọ̀nà àti iṣẹ́ tí ènìyàn ń lépa. “Àwọn ìgbòkègbodò rẹ̀” mú ìtumọ̀ gbòòrò tó bá àyíká ọ̀rọ̀ mu, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gidi ti ìrìn-àjò mọ́.
- source_word: μαρανθήσεται
  choice: yóò ṣe rọ
  rationale: “Rọ” tẹ̀ síwájú pẹ̀lú àwòrán koríko àti òdòdó tí ooru mú kí ó rẹ̀, ó sì fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí kò ṣeé yẹ̀ sílẹ̀ hàn.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú ὁ πλούσιος
  choice: ọlọ́rọ̀
  alternative: ọkùnrin ọlọ́rọ̀
  rationale: Gíríìkì jẹ́ akọ ẹyọ nípa gírámà, ṣùgbọ́n ọ̀rọ̀ náà ń dúró fún ẹni ọlọ́rọ̀ gẹ́gẹ́ bí àpẹẹrẹ. Níwọ̀n bí “ọlọ́rọ̀” kò ti ní akọ tàbí abo ní Yorùbá, ó pa ìtọ́kasí ẹni ẹyọ àti ìkìlọ̀ gbòòrò mọ́ láìfi ìyàtọ̀ akọ-abo tí èdè Yorùbá kò béèrè sí i.
- issue: Ìwọ̀n ìtumọ̀ πορείαις nínú ìkìlọ̀ sí ọlọ́rọ̀
  choice: àwọn ìgbòkègbodò rẹ̀
  alternative: àwọn ìrìn-àjò rẹ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìrìn-àjò tàbí sí gbogbo ipa iṣẹ́ àti ohun tí ẹni náà ń lépa. Àyíká ọ̀rọ̀ ń fi ọlọ́rọ̀ hàn bí ẹni tí yóò rọ nígbà tó ṣì ń ṣe àwọn ohun rẹ̀; ìtumọ̀ yìí kò dín ọ̀rọ̀ náà sí ìrìn-àjò gidi nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa àwòrán koríko, òdòdó, àti rírọ mọ́ láti so apá méjèèjì ti ẹsẹ náà pọ̀.
