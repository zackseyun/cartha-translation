id: JAS.1.6
reference: James 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: yo
  text: Ṣùgbọ́n kí ó béèrè ní ìgbàgbọ́[a], kí ó má ṣe ṣiyèméjì rárá; nítorí ẹni tí ń ṣiyèméjì dàbí ìgbì òkun tí afẹ́fẹ́ ń gbá, tí a sì ń sọ síwá-sẹ́yìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí fífi ọkàn gbẹ́ Ọlọ́run ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: kí ó béèrè
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ ẹni-kẹta ní àsìkò ìsinsìnyí. ‘Kí ó béèrè’ fi agbára ìṣírí-àṣẹ náà hàn ní Yorùbá àdánidá, ó sì bá ọ̀rọ̀ béèrè ọgbọ́n lọ́wọ́ Ọlọ́run ní ẹsẹ tó ṣáájú mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré tàbí ìlọsíwájú èrò hàn láàárín ìlérí pé Ọlọ́run yóò fi fúnni àti bí ẹni náà ṣe gbọ́dọ̀ béèrè.
- source_word: ἐν πίστει
  choice: ní ìgbàgbọ́
  rationale: Ó tẹ̀lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì jẹ́ Yorùbá tó ṣe kedere. Ní àyíká yìí, ìgbàgbọ́ ní ìtumọ̀ fífi ọkàn gbẹ́ Ọlọ́run.
- source_word: μηδὲν διακρινόμενος
  choice: kí ó má ṣe ṣiyèméjì rárá
  rationale: διακρινόμενος níbí ń tọ́ka sí iyèméjì tàbí ọkàn méjì, kì í ṣe sí fífi ìyàtọ̀ sáàárín nǹkan. ‘Rárá’ mú agbára μηδέν, ‘kò sí ohun kan,’ jáde lọ́nà àdánidá.
- source_word: ὁ γὰρ διακρινόμενος
  choice: nítorí ẹni tí ń ṣiyèméjì
  rationale: A tú participle tí a lò gẹ́gẹ́ bí orúkọ sí ọ̀nà tó kan ẹnikẹ́ni, láìfi akọ tàbí abo kún ohun tí Gíríìkì kò tẹnumọ́.
- source_word: ἔοικεν
  choice: dàbí
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì péye láti sọ ìfiwé.
- source_word: κλύδωνι θαλάσσης
  choice: ìgbì òkun
  rationale: κλύδων ń tọ́ka sí ìgbì tàbí ìrú omi òkun; ‘ìgbì òkun’ ṣe kedere, ó sì pa àwòrán ọ̀rọ̀ náà mọ́.
- source_word: ἀνεμιζομένῳ
  choice: tí afẹ́fẹ́ ń gbá
  rationale: Participle náà jẹ́ ti ohun tí afẹ́fẹ́ ń darí tàbí ń gbá. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ohùn ìṣe-aláìṣe náà mọ́.
- source_word: καὶ ῥιπιζομένῳ
  choice: tí ó sì ń sọ síwá-sẹ́yìn
  rationale: Ó fi ìgbì tí kò dúró ṣinṣin, tí a ń gbá káàkiri, hàn ní kedere láìfi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní àyíká ìbéèrè lọ́wọ́ Ọlọ́run
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú ìlò πίστις nínú Májẹ̀mú Tuntun mọ́. Síbẹ̀, àyíká yìí tún ní ìtumọ̀ fífi ọkàn gbẹ́ Ọlọ́run; a fi ‘ìgbẹ́kẹ̀lé’ sí àlàyé ìsàlẹ̀ láti pa ìtumọ̀ yẹn mọ́ láìdá àríyànjiyàn inú ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá òde òní tó lọ́lá, tó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn gbólóhùn ‘kí ó béèrè’ àti ‘kí ó má ṣe ṣiyèméjì rárá’ pa ìṣírí-àṣẹ orísun mọ́; àwòrán ìgbì òkun náà sì dúró láìsí àfikún ẹ̀kọ́ ìjọ kan.
