source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa ṣe ohun tí ọ̀rọ̀ náà sọ, ẹ má ṣe jẹ́ olùgbọ́ nìkan, ẹ ń tan ara yín jẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ ń mú ara yín ṣìnà’ tàbí ‘ẹ ń fi èrò tí kò tọ́ tan ara yín jẹ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: ẹ máa ṣe
  rationale: Àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì ń tọ́ka sí ìṣe tí ó yẹ kí ó máa bá a lọ. ‘Ẹ máa ṣe’ sọ ìtumọ̀ yìí ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín gbígbọ́ ọ̀rọ̀ náà àti ṣíṣe ohun tí ó sọ, ó sì bá ìṣàn ọ̀rọ̀ ẹsẹ tó ṣáájú mu.
- source_word: ποιηταὶ λόγου
  choice: ṣe ohun tí ọ̀rọ̀ náà sọ
  rationale: Dípò gbólóhùn líle bí ‘olùṣe ọ̀rọ̀,’ èyí sọ ní Yorùbá tí ó ṣe kedere pé ẹni náà ń ṣe ohun tí ọ̀rọ̀ náà pàṣẹ tàbí kọ́ni, láì sọ λόγος di ‘ẹ̀kọ́’ nìkan.
- source_word: ἀκροαταὶ μόνον
  choice: olùgbọ́ nìkan
  rationale: 'Ó pa ìfìwéra inú ọ̀rọ̀ Gíríìkì mọ́: kì í ṣe pé gbígbọ́ burú, ṣùgbọ́n gbígbọ́ láìṣe ohun tí a gbọ́ ni a ń kìlọ̀ fún.'
- source_word: παραλογιζόμενοι
  choice: ẹ ń tan ara yín jẹ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtan ara ẹni jẹ; àlàyé ìsàlẹ̀ fi ẹ̀ka ìtumọ̀ rẹ̀ nípa èrò tí kò tọ́ hàn.
- source_word: ἑαυτούς
  choice: ara yín
  rationale: Ó túmọ̀ arọ́pò-orúkọ afẹ̀hìntì fún ọ̀pọ̀ ènìyàn ní tààràtà.
theological_decisions:
- issue: Ìtumọ̀ λόγος nínú Jákọ́bù 1:22
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà; ẹ̀kọ́ náà
  rationale: ‘Ọ̀rọ̀ náà’ so ẹsẹ yìí pọ̀ mọ́ ọ̀rọ̀ tí a gbìn sínú ẹni ní 1:21, ó sì pa ìwọ̀n ìtumọ̀ Bíbélì rẹ̀ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ó dín kù kún un.
- issue: Agbára àṣẹ Γίνεσθε
  choice: ìṣísẹ̀ tí ó yẹ kí ó máa bá a lọ
  alternative: ẹ di olùṣe
  rationale: Àṣẹ ìsinsìnyí lè tọ́ka sí ìgbé-ayé tí ń bá a lọ. ‘Ẹ máa ṣe’ mú èyí ṣe kedere, ṣùgbọ́n kò sọ pé ìyípadà ẹ̀ẹ̀kan ṣoṣo ni.
- issue: Ìbáṣepọ̀ participle παραλογιζόμενοι pẹ̀lú àṣẹ náà
  choice: bí bẹ́ẹ̀ kọ́, ẹ ń tan ara yín jẹ
  alternative: ẹ sì ń tan ara yín jẹ
  rationale: Ọ̀rọ̀ náà ṣàlàyé ohun tí jíjẹ́ olùgbọ́ nìkan ń yọrí sí. Ìtúmọ̀ yìí pa ìkìlọ̀ náà mọ́ láìsọ pé gbogbo gbígbọ́ fúnra rẹ̀ jẹ́ ìtan ara ẹni jẹ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A lo ‘ṣe ohun tí ọ̀rọ̀ náà sọ’ fún òye kedere àti èdè àdánidá, nígbà tí ‘olùgbọ́ nìkan’ pa ìfìwéra ọ̀rọ̀ Gíríìkì mọ́. Ohùn ọ̀rọ̀ náà jẹ́ ọ̀wọ̀, tààrà, ó sì yẹ fún kíkà ní gbangba.
