  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: yo
  text: níwọ̀n bí ẹ ti mọ̀ pé dídán ìgbàgbọ́ yín wò ń mú ìfaradà wá[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdánilójú pé ìgbàgbọ́ yín jẹ́ tòótọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìlànà dídán ohun wò tàbí ànímọ́ òtítọ́ tí àdánwò fi hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdúróṣinṣin” tàbí “ìfaradà títí dé òpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: nítorí ẹ̀yin mọ̀
  rationale: 'Ọ̀rọ̀ aláìlẹ́gbẹ́ yìí so ẹsẹ̀ náà mọ́ àṣẹ inú ẹsẹ̀ 2, ó sì ní agbára ìdí: wọ́n lè ka àwọn àdánwò sí ayọ̀ nítorí ohun tí wọ́n mọ̀.'
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣe àgbékalẹ̀ ohun tí àwọn olùkà mọ̀; ‘pé’ ni ọ̀nà Yorùbá tó ṣe kedere jù lọ fún ìtumọ̀ yìí.
- source_word: τὸ δοκίμιον
  choice: dídán ... wò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìlànà dídán ohun wò tàbí sí ìdánilójú òtítọ́ rẹ̀ tí àdánwò fi hàn. Ní àyíká ọ̀rọ̀ yìí, dídán ìgbàgbọ́ wò bá ìjíròrò nípa àdánwò mu jù lọ.
- source_word: ὑμῶν τῆς πίστεως
  choice: ìgbàgbọ́ yín
  rationale: Àkójọpọ̀ ọ̀rọ̀ oníṣe-ìbátan náà tọ́ka sí ìgbàgbọ́ àwọn olùkà gẹ́gẹ́ bí ohun tí a ń dán wò.
- source_word: κατεργάζεται
  choice: ń mú ... wá
  rationale: Ọ̀rọ̀-ìṣe náà sọ pé dídánwò náà ń fa àbájáde kan; ‘ń mú ... wá’ jẹ́ èdè Yorùbá àdánidá tó pa agbára ìdí àti àbájáde mọ́.
- source_word: ὑπομονήν
  choice: ìfaradà
  rationale: ‘Ìfaradà’ túmọ̀ sí agbára láti dúró ṣinṣin lábẹ́ ìṣòro, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ìgbàgbọ́ àwọn olùkà tí a ń dán wò. ‘Ìgbàgbọ́’ ni ìtumọ̀ tó ṣe kedere jù lọ, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti jẹ́ kí ọ̀pọ̀ ènìyàn inú γινώσκοντες àti ὑμῶν hàn gbangba; àmi ohùn ni a fi sí ibi tó bá èdè àdánidá mu.
