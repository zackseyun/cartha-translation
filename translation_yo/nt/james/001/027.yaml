id: JAS.1.27
reference: James 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: yo
  text: 'Ẹ̀sìn tí ó mọ́, tí kò sì ní àbàwọ́n níwájú Ọlọ́run, ẹni tí í ṣe Baba, ni èyí: láti tọ́jú àwọn ọmọ aláìní òbí àti àwọn opó nínú ìpọ́njú wọn,[a] àti láti pa ara ẹni mọ́ láìní àbàwọ́n láti ara ayé.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti lọ bẹ àwọn ọmọ aláìní òbí àti àwọn opó wò nínú ìpọ́njú wọn.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ lílọ bẹ wọn wò àti títọ́jú wọn nípa ìṣe.
    reason: lexical_alternative
  - marker: b
    text: “Ayé” níbí tọ́ka sí ètò ìwà búburú tó lòdì sí Ọlọ́run, kì í ṣe gbogbo ìṣẹ̀dá fúnra rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: Ẹ̀sìn
  rationale: Ó tọ́ka sí ìfọkànsìn ẹ̀sìn tí a ń fi hàn nípa ìṣe, kì í ṣe ìgbàgbọ́ lásán; “ẹ̀sìn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ náà mu.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: tí ó mọ́, tí kò sì ní àbàwọ́n
  rationale: Àwọn gbólóhùn méjèèjì pa ìtumọ̀ ìwà mímọ́ àti àìbàjẹ́ mọ́, wọ́n sì mú ìtẹnumọ́ Gíríìkì jáde lọ́nà àdánidá.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: níwájú Ọlọ́run, ẹni tí í ṣe Baba
  rationale: παρά pẹ̀lú dative túmọ̀ sí bí Ọlọ́run ṣe ń wo tàbí ṣe ìdájọ́ ohun kan. Ìtumọ̀ yìí tún pa àìdájú kékeré inú “Ọlọ́run àti Baba” mọ́ láìfi ọ̀rọ̀ “wa” kún un.
- source_word: ἐπισκέπτεσθαι
  choice: láti tọ́jú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí lílọ bẹ ẹnì kan wò, ṣùgbọ́n níbí ó ní ìtumọ̀ fífi ìfẹ́ àti ìrànlọ́wọ́ tó ṣeé fojú rí hàn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ “lọ bẹ̀ wò” mọ́.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: àwọn ọmọ aláìní òbí àti àwọn opó
  rationale: Èyí jẹ́ ìtumọ̀ tó ṣe kedere fún àwọn ènìyàn tí kò ní ààbò tàbí olùtọ́jú láwùjọ; “ọmọ aláìní òbí” gbòòrò tó láti gba ìtumọ̀ ὀρφανός.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: nínú ìpọ́njú wọn
  rationale: “Ìpọ́njú” sọ ìnira, wàhálà àti ìtẹ̀sí líle tí θλῖψις ní jáde ní Yorùbá òde òní.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: láti pa ara ẹni mọ́ láìní àbàwọ́n
  rationale: Ó pa àwòrán ìdọ̀tí tàbí àbàwọ́n ìwà búburú mọ́, “ara ẹni” sì fi agbára gbogbogbò ti ọ̀rọ̀ Gíríìkì hàn láìdín un sí akọ nìkan.
- source_word: ἀπὸ τοῦ κόσμου
  choice: kúrò nínú ayé
  rationale: A pa “ayé” mọ́ nínú ọ̀rọ̀ pàtàkì, dípò fífi ìtumọ̀ àlàyé bí “ìbàjẹ́ ayé” sínú ẹsẹ náà; ní Yorùbá, “kúrò nínú” dára pẹ̀lú ìtumọ̀ yíyàgò fún èérí tó ti ibi kan wá.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú àyíká ìwà rere
  choice: A lo “ayé” nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé pé ó tọ́ka sí ètò ìwà búburú tó lòdì sí Ọlọ́run.
  alternative: “ìbàjẹ́ ayé” tàbí “ètò ayé ìsinsìnyí”
  rationale: Èyí pa ọ̀rọ̀ orísun àti ẹrù ẹ̀kọ́ rẹ̀ mọ́ láìsọ pé gbogbo ìṣẹ̀dá tàbí àwùjọ fúnra rẹ̀ jẹ́ ohun búburú.
- issue: Agbára gbogbogbò ti ἑαυτόν
  choice: “ara ẹni”
  alternative: “ara rẹ̀” tàbí “ara ọkùnrin náà”
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní akọ ẹyọ, òwe ìwà rere yìí kan gbogbo ènìyàn; “ara ẹni” sọ ète yẹn jáde lọ́nà pípé.
- issue: Ọlọ́run καὶ πατήρ gẹ́gẹ́ bí ẹni kan náà
  choice: “Ọlọ́run, ẹni tí í ṣe Baba”
  alternative: “Ọlọ́run àti Baba” tàbí “Ọlọ́run Baba”
  rationale: Ìkọ̀wé Gíríìkì tọ́ka sí ẹni kan náà gẹ́gẹ́ bí Ọlọ́run àti Baba, ṣùgbọ́n kò ní arọ́pò-orúkọ “wa”; a kò fi “wa” kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere fún òǹkàwé òde òní, ó sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó. A yan “Ọlọ́run, ẹni tí í ṣe Baba” láti jẹ́ àdánidá ju “Ọlọ́run àti Baba” lọ, láìfi “wa” tí kò sí nínú orísun kún un.
