revisions:
- from: 'Ẹ̀sìn tí ó mọ́, tí kò sì ní àbàwọ́n níwájú Ọlọ́run, ẹni tí í ṣe Baba, ni èyí: láti tọ́jú àwọn ọmọ aláìní òbí àti àwọn opó nínú ìpọ́njú wọn,[a] àti láti pa ara ẹni mọ́ láìní àbàwọ́n kúrò nínú ayé.[b]'
  to: 'Ẹ̀sìn tí ó mọ́, tí kò sì ní àbàwọ́n níwájú Ọlọ́run, ẹni tí í ṣe Baba, ni èyí: láti tọ́jú àwọn ọmọ aláìní òbí àti àwọn opó nínú ìpọ́njú wọn,[a] àti láti pa ara ẹni mọ́ láìní àbàwọ́n láti ara ayé.[b]'
  rationale: A ṣàtúnṣe gbolohun kan ṣoṣo láti mú ἀπὸ τοῦ κόσμου hàn gẹ́gẹ́ bí orísun ìbàjẹ́ tí ẹni ń pa ara rẹ̀ mọ́ kúrò nínú èérí rẹ̀, láìyí ìtumọ̀ “ayé” padà sí ìtumọ̀ tí ó ṣàlàyé ju ti orísun lọ. Àwọn àmì ìsàlẹ̀ ojú ìwé wọnú ipò tó tọ́, wọ́n sì pa àwọn ìtumọ̀ mìíràn tó yẹ mọ́.
