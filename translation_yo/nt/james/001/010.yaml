id: JAS.1.10
reference: James 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: yo
  text: ṣùgbọ́n ọkùnrin ọlọ́rọ̀ nínú ìrẹ̀sílẹ̀ rẹ̀[a], nítorí pé bí òdòdó koríko[b] ni yóò kọjá lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá mú ọ̀rọ̀-ìṣe tí a kò tún sọ wá láti ẹsẹ tó ṣáájú: “ṣùgbọ́n kí ọkùnrin ọlọ́rọ̀ máa ṣògo nínú ìrẹ̀sílẹ̀ rẹ̀.”'
    reason: alternative_reading
  - marker: b
    text: “Òdòdó koríko” jẹ́ ìtumọ̀ tààràtà ti àwòrán Gíríìkì; ó tẹnumọ́ bí ọlọ́rọ̀ ṣe máa ń yára kọjá lọ bí koríko tí ó yọ òdòdó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: ṣùgbọ́n ọkùnrin ọlọ́rọ̀
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tó wà láàárín ẹni ipò rẹ̀ rẹlẹ̀ ní ẹsẹ 9 àti ọlọ́rọ̀ hàn láìfi agbára tó pọ̀ ju ti δέ sí i. “Ọkùnrin ọlọ́rọ̀” mú ẹni tí ajẹtífù akọ ẹyọ kan dúró fún un jáde ní kedere.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: nínú ìrẹ̀sílẹ̀ rẹ̀
  rationale: “Ìrẹ̀sílẹ̀” lè túmọ̀ sí bí a ṣe sọ ipò ẹni di kékeré tàbí bí a ṣe mú un rẹlẹ̀; ó bá àlàyé nípa bí ọrọ̀ àti ìyè ṣe máa ń kọjá lọ mu, kò sì dín ọ̀rọ̀ náà kù sí ìwà ìrẹ̀lẹ̀ nìkan.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó pa ìtumọ̀ ìdí tí ὅτι ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìdí ní Yorùbá òde òní.
- source_word: ὡς ἄνθος χόρτου
  choice: bí òdòdó koríko
  rationale: 'Ìtumọ̀ yìí pa àwòrán Gíríìkì mọ́ ní tààràtà: òdòdó tí ó jẹ́ ti koríko, tí ó sì máa ń yára rẹ̀. A kò fi “pápá” tàbí “òdòdó igbó” kún ohun tí orísun kò sọ.'
- source_word: παρελεύσεται
  choice: yóò ṣe kọjá lọ
  rationale: Ó fi ìgbà díẹ̀ tí ọlọ́rọ̀ àti ọlá rẹ̀ wà hàn, ó sì pa ààyè sílẹ̀ fún ìtumọ̀ pípòórá tàbí ikú láìyan ọ̀kan ṣoṣo lára wọn.
theological_decisions:
- issue: Ọ̀rọ̀-ìṣe tí a kò tún sọ láti ẹsẹ 9
  choice: A kò fi ọ̀rọ̀-ìṣe “kí ó máa ṣògo” sínú àkọsílẹ̀ pàtàkì; a jẹ́ kí gbólóhùn náà gbára lé ẹsẹ tó ṣáájú gẹ́gẹ́ bí Gíríìkì.
  alternative: “ṣùgbọ́n kí ọkùnrin ọlọ́rọ̀ máa ṣògo nínú ìrẹ̀sílẹ̀ rẹ̀”
  rationale: Ọ̀rọ̀ Gíríìkì ẹsẹ 10 kò tún ọ̀rọ̀-ìṣe náà sọ. Pípa àlàfo yìí mọ́ ń jẹ́ kí ìtumọ̀ náà ṣeé yẹ̀ wò pẹ̀lú orísun, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹsẹ 9 di mímọ̀.
- issue: Ìtumọ̀ “ìrẹ̀sílẹ̀” ọlọ́rọ̀
  choice: Ó ń tọ́ka sí bí a ṣe mú ọlọ́rọ̀ sọ̀kalẹ̀ tàbí bí ipò rẹ̀ ṣe di kékeré, ní pàtàkì nítorí ọrọ̀ àti ìyè rẹ̀ kì í pé.
  alternative: Ìwà ìrẹ̀lẹ̀ tí ọlọ́rọ̀ yàn fúnra rẹ̀, tàbí ipò àwùjọ kékeré lásán.
  rationale: Ìdí tí ẹsẹ náà fún—pé yóò kọjá lọ bí òdòdó koríko—tẹnumọ́ bí ọrọ̀, ọlá àti ìyè ṣe kúrú ju pé ó ń sọ nípa ìwà rere kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa gbólóhùn àlàfo ti Gíríìkì mọ́, nítorí náà ẹsẹ yìí yẹ kí a kà ní ìbáṣepọ̀ pẹ̀lú ẹsẹ 9.
