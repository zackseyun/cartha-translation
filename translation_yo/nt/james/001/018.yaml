id: JAS.1.18
reference: James 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: yo
  text: Nípa ìfẹ́ tirẹ̀ ni ó fi ọ̀rọ̀ òtítọ́ bí wa[a], kí àwa lè jẹ́ àkọ́so kan lára àwọn ohun tí ó dá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ó fẹ́ bẹ́ẹ̀, ó sì fi ọ̀rọ̀ òtítọ́ bí wa.”'
    reason: alternative_reading
  - marker: b
    text: “Àkọ́so” ń tọ́ka sí apá àkọ́kọ́ irè oko tí a yà sí mímọ́, tí a sì mú wá fún Ọlọ́run; níhìn-ín ó ṣàpẹẹrẹ àwọn onígbàgbọ́ gẹ́gẹ́ bí apá àkọ́kọ́ tí a yà sí mímọ́ lára àwọn ohun tí Ọlọ́run dá.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Nítorí ó fẹ́ bẹ́ẹ̀
  rationale: Aorist participle náà ń fi ìfẹ́ Ọlọ́run tí ó ṣáájú iṣẹ́ pàtàkì hàn; ìtumọ̀ oníṣe-okùnfà yìí jẹ́ adayeba ní Yorùbá, kò sì fi ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
- source_word: ἀπεκύησεν
  choice: ó ... bí wa
  rationale: Ó pa àwòrán ìbímọ tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì tún bá ìlò ọ̀rọ̀ náà ní Jákọ́bù 1:15 mu.
- source_word: λόγῳ ἀληθείας
  choice: fi ọ̀rọ̀ òtítọ́
  rationale: Ìṣàmúlò ọ̀nà ni dative náà; “fi” sọ ọ̀nà tí ó gbà bí wa, nígbà tí “ọ̀rọ̀ òtítọ́” pa gbólóhùn Bíbélì àti ìtọ́kasí rẹ̀ sí ìhìn òtítọ́ mọ́.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: kí àwa lè jẹ́
  rationale: Ó fi ète tàbí àbájáde tí a pinnu hàn láì mú ọ̀kan nínú méjèèjì le ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἀπαρχήν
  choice: ìdámẹ́wàá àkọ́kọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí apá àkọ́kọ́ irè oko tí a yà sí mímọ́ fún Ọlọ́run; gbólóhùn náà ń gbìyànjú láti pa àwòrán ìkórè àti ìyàsímímọ́ mọ́.
- source_word: τινα
  choice: bí
  rationale: Ó mú àsọyé náà rọ̀ gẹ́gẹ́ bí τινα ṣe ń ṣe, dípò kí ó sọ pé àwọn onígbàgbọ́ ni àkọ́so ní ìtumọ̀ gígùn pátápátá.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: lára àwọn ohun tí ó dá
  rationale: Ó pa ọ̀pọ̀ nǹkan/ẹ̀dá tí κτίσματα lè tọ́ka sí mọ́, láì dín ìtumọ̀ rẹ̀ kù sí ènìyàn nìkan.
theological_decisions:
- issue: Ìbẹ̀rẹ̀ Ọlọ́run nínú ìbí tuntun
  choice: A sọ ìfẹ́ Ọlọ́run di ìdí tí ó fi bí wa, ṣùgbọ́n a kò fi ètò ẹ̀kọ́ ìsìn kan nípa àyànmọ́ tàbí àtúnbí kún un.
  alternative: “Nípa ìfẹ́ tirẹ̀ ni ó bí wa” tàbí ìtumọ̀ tí yóò sọ ẹ̀kọ́ àtúnbí ní kedere ju orísun lọ.
  rationale: Gíríìkì fi hàn pé ìfẹ́ Ọlọ́run ṣáájú, ó sì ní ipa lórí iṣẹ́ náà, ṣùgbọ́n ẹsẹ̀ náà kò ṣàlàyé gbogbo ètò ẹ̀kọ́ ìsìn kan.
- issue: Ìwọ̀n ìtumọ̀ κτισμάτων
  choice: “àwọn ohun tí ó dá” ni a lò ní ìtumọ̀ gbòòrò.
  alternative: “gbogbo ìṣẹ̀dá rẹ̀” tàbí “àwọn ènìyàn tí ó dá.”
  rationale: Ọ̀rọ̀ náà lè kan àwọn ẹ̀dá tàbí ohun tí a dá ní gbogbogbòò; dídín rẹ̀ kù sí ènìyàn nìkan yóò fi ohun tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá àṣàtẹ̀jáde, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì yẹ fún òǹkàwé òde òní. A fi àmì àlàyé [a] sí gbólóhùn ìfẹ́ Ọlọ́run, a sì fi [b] sí àwòrán ἀπαρχή.
