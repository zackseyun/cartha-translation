source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: yo
  text: Kí ìfaradà sì mú iṣẹ́ rẹ̀ dé òpin[a], kí ẹ lè dàgbà dénú, kí ẹ sì jẹ́ pípé ní gbogbo apá, láìní ohun kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jẹ́ kí ìfaradà ṣe iṣẹ́ pípé rẹ̀.” Àwọn ọ̀rọ̀ Gíríìkì tí a lò níhìn-ín ní ìbátan pẹ̀lú dídé ibi tí a pinnu àti jíjẹ́ odindi ní gbogbo apá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: ìfaradà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí dídúró ṣinṣin lábẹ́ ìdánwò. “Ìfaradà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìtẹ̀síwájú láìyẹsẹ̀ hàn, kì í sì í dún bí ìdúró lásán.
- source_word: ἔργον τέλειον ἐχέτω
  choice: kí ... mú iṣẹ́ rẹ̀ dé òpin
  rationale: Ìtumọ̀ yìí pa àṣẹ ẹni kẹta ἐχέτω mọ́, ó sì fi iṣẹ́ tí ó dé ibi tí a pinnu fún un hàn. Ó tún jẹ́ Yorùbá àdánidá ju lílo gbólóhùn líle bí “ní iṣẹ́ pípé” lọ.
- source_word: ἵνα ἦτε
  choice: kí ẹ̀yin lè dàgbà dénú
  rationale: “Kí ... lè” pa ète tàbí àbájáde ἵνα mọ́; a fi “ẹ̀yin” hàn nítorí ọ̀rọ̀ náà ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀.
- source_word: τέλειοι
  choice: dàgbà dénú
  rationale: Nípa ènìyàn, τέλειος lè tọ́ka sí dídàgbà dé ibi tí a pinnu, kì í ṣe dandan àìní ẹ̀ṣẹ̀ rárá. “Dàgbà dénú” jẹ́ ọ̀rọ̀ òde òní tí ó bójú mu èrò ìdàgbàsókè yìí.
- source_word: ὁλόκληροι
  choice: pé pérépéré
  rationale: ὁλόκληρος tẹnu mọ́ jíjẹ́ odindi, tí kò ní apá kan tí ó ṣaláìpé. “Pé pérépéré” yà á sọ́tọ̀ díẹ̀ sí “dàgbà dénú,” ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: kí ohunkóhun má ṣe kù fún un yín
  rationale: Ìtumọ̀ yìí pa agbára “ní ohun kankan” mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọn kò ní ṣe aláìní ní apá kankan.
- source_word: δὲ
  choice: sì
  rationale: δέ ń tẹ̀síwájú nínú èrò ẹsẹ tó ṣáájú ju kí ó fi ìtakora líle hàn; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ τέλειοι nínú ọ̀rọ̀ ìdàgbàsókè ẹ̀mí
  choice: dàgbà dénú
  alternative: pé
  rationale: “Dàgbà dénú” fi ibi tí ìfaradà ń darí onígbàgbọ́ sí hàn láìsọ pé ẹsẹ̀ náà ń kọ́ni nípa àìní ẹ̀ṣẹ̀ pátápátá. Àlàyé ìsàlẹ̀ ṣì jẹ́ kí ìbátan τέλειος àti ὁλόκληρος hàn, kí a má bàa pa ìtumọ̀ “pípé” rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àṣẹ, ète, àti ìyàtọ̀ tó wà láàárín τέλειοι àti ὁλόκληροι mọ́.
