id: JAS.1.19
reference: James 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: yo
  text: 'Ẹ mọ èyí,[a] ẹ̀yin arákùnrin mi olùfẹ́[b]: kí olúkúlùkù ènìyàn máa yára láti gbọ́, kí ó lọ́ra láti sọ̀rọ̀, kí ó sì lọ́ra láti bínú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè lóye rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìdánilójú pé, ‘Ẹ̀yin arákùnrin mi olùfẹ́ mọ èyí,’ dípò àṣẹ pé, ‘Ẹ mọ èyí.’
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà sọ pé ‘arákùnrin,’ ṣùgbọ́n ó ṣeé ṣe kí Jákọ́bù máa bá gbogbo àwùjọ àwọn onígbàgbọ́—ọkùnrin àti obìnrin—sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: Ẹ mọ èyí
  rationale: Fọ́ọ̀mù Gíríìkì yìí lè jẹ́ àṣẹ, ‘Ẹ mọ̀,’ tàbí ọ̀rọ̀ ìdánilójú, ‘Ẹ mọ̀.’ Àyíká ìṣílétí náà àti àwọn ọ̀rọ̀ àṣẹ tó tẹ̀ lé e mú kí ìtumọ̀ àṣẹ bá ọ̀rọ̀ mu; a fi ‘èyí’ kún un láti jẹ́ kí Yorùbá ṣe kedere ní ti ìṣàn ọ̀rọ̀.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ẹ̀yin arákùnrin mi olùfẹ́
  rationale: ‘Arákùnrin’ tẹ̀ lé akọ ọ̀pọ̀ nínú Gíríìkì, ‘olùfẹ́’ sì túmọ̀ ἀγαπητοί. Ní àwùjọ Kristẹni, ọ̀rọ̀ yìí lè kan àwọn ọkùnrin àti obìnrin lápapọ̀; a tọ́ka sí ìyẹn nínú àlàyé ìsàlẹ̀.
- source_word: ἔστω δὲ
  choice: kí ... máa
  rationale: Èyí fi àṣẹ ẹni-kẹta hàn. Ìṣètò ‘kí ... máa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwúrí tàbí àṣẹ tí ó yẹ kí gbogbo ènìyàn tẹ̀ lé. δέ jẹ́ àsopọ̀ fẹ́ẹ́rẹ́, a sì fi ìṣàn gbolohun hàn láìfi ‘ṣùgbọ́n’ líle kún un.
- source_word: πᾶς ἄνθρωπος
  choice: olúkúlùkù ènìyàn
  rationale: ἄνθρωπος túmọ̀ sí ènìyàn ní agbára gbogbogbò, πᾶς sì mú kí ó túmọ̀ sí olúkúlùkù. Yorùbá kò fi akọ tàbí abo hàn nínú ‘ènìyàn,’ nítorí náà yíyan yìí bójú mu ìtumọ̀ gbogbogbò náà láìdín àwùjọ tí ọ̀rọ̀ náà kàn kù.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: máa yára láti gbọ́
  rationale: Ó pa ìtumọ̀ ‘yára ní ti gbígbọ́’ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere àti àdánidá.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: lọ́ra láti sọ̀rọ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì bójú mu ìlò Yorùbá fún ṣíṣe kìlọ̀ pé kí ènìyàn má ṣe tètè sọ̀rọ̀.
- source_word: βραδὺς εἰς ὀργήν
  choice: lọ́ra láti bínú
  rationale: Ọ̀rọ̀ yìí mú àpẹẹrẹ Gíríìkì ‘lọ́ra sí ìbínú’ wá sí Yorùbá àdánidá, láìsọ pé ὀργή jẹ́ ìdájọ́ tàbí ìrunú oníbàjẹ́ nìkan.
theological_decisions:
- issue: Bóyá Ἴστε jẹ́ àṣẹ tàbí ọ̀rọ̀ ìdánilójú
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ: ‘Ẹ mọ èyí’'
  alternative: ‘Ẹ mọ èyí’ gẹ́gẹ́ bí ọ̀rọ̀ ìdánilójú, ìyẹn, ‘Ẹ̀yin ... mọ èyí’
  rationale: Fọ́ọ̀mù Gíríìkì náà gba méjèèjì láyè. Ìṣàn ọ̀rọ̀ ìkìlọ̀ àti ἔστω tó tẹ̀ lé e ṣe àtìlẹ́yìn fún àṣẹ, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ nínú àlàyé.
- issue: Ọ̀rọ̀ akọ tó dúró fún gbogbo àwùjọ
  choice: A pa ‘arákùnrin’ mọ́ nínú ìkíni, ṣùgbọ́n a lo ‘ènìyàn’ fún ἄνθρωπος
  alternative: ‘ẹ̀yin arákùnrin àti arábìnrin mi olùfẹ́’ àti ‘gbogbo ènìyàn’
  rationale: ἀδελφοί jẹ́ akọ ọ̀pọ̀ ní ìrísí rẹ̀, bó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí gbogbo àwùjọ onígbàgbọ́ ni Jákọ́bù ń bá sọ̀rọ̀. ἄνθρωπος sì jẹ́ ọ̀rọ̀ gbogbogbò fún ènìyàn; Yorùbá kò ní akọ tàbí abo nínú ‘ènìyàn.’ Èyí pa ìrísí àti agbára gbogbogbò orísun mọ́ níbi tí èdè Yorùbá ti lè ṣe bẹ́ẹ̀ lọ́nà àdánidá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá. Àtúnsọ ‘kí ...’ àti ‘máa’ mú àṣẹ náà dun bí Yorùbá gidi, nígbà tí ‘yára láti gbọ́ / lọ́ra láti sọ̀rọ̀ / lọ́ra láti bínú’ pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
