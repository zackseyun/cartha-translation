source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: yo
  text: Ṣùgbọ́n ìfẹ́kúfẹ̀ẹ́ tirẹ̀ ni ń dán olúkúlùkù wò sí ẹ̀ṣẹ̀, nígbà tí ìfẹ́kúfẹ̀ẹ́ náà ń fà á lọ, tí ó sì ń fi ìdẹ tàn án.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìfẹ́kúfẹ̀ẹ́ sí ‘ìfẹ́ líle’ tàbí ‘ìfẹ́kúfẹ̀ẹ́ ara ẹni.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìfẹ́ líle ní gbogbogbòò, kì í sì í ṣe ìfẹ́ ìbálòpọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọ̀rọ̀ méjèèjì náà ń mú àwòrán fífà ohun ọdẹ jáde àti fífi ìdẹ tàn án wá sí ọkàn, bí ẹranko tàbí ẹja tí ìdẹ ń fà sínú pakute.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ pínpín ti ẹnì kọ̀ọ̀kan mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó fi ìyàtọ̀ kékeré hàn sí ẹsẹ ṣáájú: Ọlọ́run kì í dán ènìyàn wò sí ibi, ṣùgbọ́n ìfẹ́kúfẹ̀ẹ́ ẹni fúnra rẹ̀ ló ń ṣe bẹ́ẹ̀.'
- source_word: πειράζεται
  choice: ń dán wò
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí dídán ènìyàn wò láti dé inú ẹ̀ṣẹ̀, kì í ṣe àdánwò tàbí ìṣòro lásán.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: ìfẹ́kúfẹ̀ẹ́ tirẹ̀ … ni … ń dán wò
  rationale: Ìṣètò yìí sọ ìfẹ́kúfẹ̀ẹ́ ẹni fúnra rẹ̀ di orísun ìdẹwò, ó sì tẹnu mọ́ ojúṣe ara ẹni gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: ἐξελκόμενος
  choice: nípa fífà á lọ
  rationale: Ó pa àwòrán ohun tí a ń fà jáde tàbí fà lọ mọ́ láìfi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: δελεαζόμενος
  choice: fífi ìdẹ tàn án
  rationale: Ìtumọ̀ yìí mú àwòrán ìdẹ tàbí ohun ìdẹ mú jáde ní Yorùbá àdánidá, dípò kí ó sọ ọ́ di ‘títàn’ lásán.
theological_decisions:
- issue: Orísun ìdẹwò ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run
  choice: A sọ pé ìfẹ́kúfẹ̀ẹ́ ẹni fúnra rẹ̀ ni ó ń dán an wò.
  alternative: Kí a sọ ọ́ di àdánwò tí ipò òde ń fà lásán.
  rationale: Ẹsẹ 13 kọ̀ pé Ọlọ́run ń dán ẹnikẹ́ni wò sí ibi; ẹsẹ yìí sì tọ́ka sí ìfẹ́kúfẹ̀ẹ́ ẹni fúnra rẹ̀ gẹ́gẹ́ bí orísun ìdẹwò tó sún mọ́ ọn jù, láìṣe àfikún ẹ̀kọ́ nípa gbogbo ohun tó lè fa ẹ̀ṣẹ̀.
- issue: Ẹni kan ṣoṣo tí ó dúró fún gbogbo ènìyàn
  choice: A lo ‘olúkúlùkù’ àti arọ́pò-orúkọ ẹni kan ṣoṣo.
  alternative: Kí a yí ọ̀rọ̀ náà sí ọ̀pọ̀ ènìyàn.
  rationale: Èyí pa agbára ẹni-kan-kọ̀ọ̀kan ti Gíríìkì mọ́, ó sì bá ìlò Yorùbá mu láìsọ ìtumọ̀ náà di ti ọ̀pọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó níyì, tí ó sì yẹ fún kíkà ní gbangba. A lo ‘ìfẹ́kúfẹ̀ẹ́’ fún ìfẹ́ líle tó ń darí sí ibi, àti ‘fi ìdẹ tàn’ láti pa àwòrán ìpẹja tàbí ìdẹ ọdẹ inú Gíríìkì mọ́.
