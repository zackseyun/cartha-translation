revisions:
- from: Ṣùgbọ́n olúkúlùkù ni ìfẹ́kúfẹ̀ẹ́ tirẹ̀[a] ń dán wò, nípa fífà á lọ àti fífi ìdẹ tàn án.[b]
  to: Ṣùgbọ́n ìfẹ́kúfẹ̀ẹ́ tirẹ̀ ni ń dán olúkúlùkù wò sí ẹ̀ṣẹ̀, nígbà tí ìfẹ́kúfẹ̀ẹ́ náà ń fà á lọ, tí ó sì ń fi ìdẹ tàn án.[a][b]
  rationale: A tún gbolohun náà kọ́ kí ìfẹ́kúfẹ̀ẹ́ ẹni fúnra rẹ̀ jẹ́ ohun tí ń dán ẹni wò sí ẹ̀ṣẹ̀, tí ń fà á lọ, tí ń fi ìdẹ tàn án. Èyí pa ìyàtọ̀ tó wà láàárín Ọlọ́run ní ẹsẹ̀ 13 àti ìfẹ́kúfẹ̀ẹ́ ara ẹni ní ẹsẹ̀ 14 mọ́, láìfi ẹ̀kọ́ míràn kún un. A tún ṣe àwọn àlàyé ẹsẹ̀ ìsàlẹ̀ náà ní Yorùbá tó mọ́gbọn-dágbọn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:08:38Z'
review_pass:
  verdict: revise
  source_fidelity: Àkọlé náà mú ‘olúkúlùkù’ àti ìfẹ́kúfẹ̀ẹ́ tirẹ̀ gẹ́gẹ́ bí orísun ìdẹwò jáde. Ṣùgbọ́n ‘ìfẹ́kúfẹ̀ẹ́ tirẹ̀ ... ń dán wò, nípa fífà á lọ’ yí àwọn apá-ìṣe Gíríìkì méjèèjì, tí ń ṣàpèjúwe ẹni tí a ń dán wò, sí ọ̀nà ‘nípa’ tí kò dáa ní Yorùbá, ó sì jẹ́ kí ìbáṣepọ̀ àwọn gbolohun náà ṣòro. Àtúnṣe náà sọ pé ìfẹ́kúfẹ̀ẹ́ náà ń fà á lọ, ó sì ń fi ìdẹ tàn án, nítorí náà ó pa àwòrán ἐξελκόμενος καὶ δελεαζόμενος mọ́ ní Yorùbá àdánidá.
  naturalness: Ìsọ̀rọ̀ ìpilẹ̀ ‘olúkúlùkù ni ... ń dán wò’ lè gbọ́ bí ẹni pé ‘olúkúlùkù’ ni kókó-ọrọ̀, nígbà tí ìfẹ́kúfẹ̀ẹ́ ni kókó-ọrọ̀ gangan. ‘Fífà á lọ àti fífi ìdẹ tàn án’ tún jẹ́ ìsopọ̀ orúkọ-ìṣe tí kò rọrùn nínú gbolohun yìí. Àtúnṣe náà lo àwọn gbolohun ìṣe tó ṣe kedere, tó sì yẹ fún kíkà ní gbangba.
  terminology: ‘Ìfẹ́kúfẹ̀ẹ́’ dáa fún ἐπιθυμία nítorí kò fi í mọ́ ìfẹ́ ìbálòpọ̀ nìkan. ‘Dán ... wò sí ẹ̀ṣẹ̀’ sọ ìmọ̀ ọrọ̀ πειράζεται nínú àyíká ẹsẹ̀ 13–15 di mímọ́. ‘Fi ìdẹ tàn’ pa àwòrán ìdẹ/ìpẹja ti δελεαζόμενος mọ́.
  issues:
  - severity: medium
    issue: Ìkọ́lé gbolohun àti ipa àwọn apá-ìṣe
    rationale: ‘nípa fífà á lọ àti fífi ìdẹ tàn án’ mú kí fífà àti fífi ìdẹ tàn dà bí ọ̀nà tí a fi ń dán ẹni wò, dípò kí wọ́n ṣàpèjúwe bí ìfẹ́kúfẹ̀ẹ́ ṣe ń lò ẹni náà. Ó sì kù díẹ̀ kí kókó-ọrọ̀/ohun-ìṣe gbolohun ìpilẹ̀ dàrú.
