id: JAS.1.7
reference: James 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: yo
  text: Nítorí ẹni náà[a] kò gbọ́dọ̀ rò pé òun yóò gba ohunkóhun lọ́wọ́ Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ènìyàn náà.” Ọ̀rọ̀ Gíríìkì wà ní akọ ẹyọ, ṣùgbọ́n ó ń tọ́ka gẹ́gẹ́ bí aṣojú sí ẹnikẹ́ni tó ń ṣiyèméjì tí ẹsẹ tó ṣáájú ṣàpèjúwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Nítorí ... kò gbọ́dọ̀
  rationale: “Nítorí” pa ìsopọ̀ àlàyé γάρ mọ́ pẹ̀lú ẹsẹ tó ṣáájú; “kò gbọ́dọ̀” sì fi agbára ìkìlọ̀ μή hàn ní Yorùbá àdánidá.
- source_word: οἰέσθω
  choice: rò
  rationale: “Rò” túmọ̀ sí láti ní èrò tàbí láti gbà pé ohun kan rí bẹ́ẹ̀; ó bá ìkìlọ̀ inú ọ̀rọ̀ náà mu láì fi ìtumọ̀ “retí” kún un.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ẹni náà
  rationale: ἄνθρωπος lè tọ́ka sí ènìyàn ní gbogbogbò, ẹni náà sì ń tọ́ka padà sí ẹni tó ń ṣiyèméjì nínú ẹsẹ tó ṣáájú. “Ẹni náà” jẹ́ ọ̀nà Yorùbá àdánidá, ó sì pa ìtumọ̀ aṣojú ẹni kọ̀ọ̀kan mọ́.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ni àmì gbólóhùn àṣekún tó bá ὅτι mu ní Yorùbá.
- source_word: λήμψεταί
  choice: òun yóò gba
  rationale: “Yóò gba” pa ìgbà ọjọ́ iwájú àti ìtumọ̀ λαμβάνω mọ́; “òun” tọ́ka sí ẹni náà láìsí ìdàrúdàpọ̀.
- source_word: τι
  choice: ohunkóhun
  rationale: 'Nínú gbólóhùn òdì, “ohunkóhun” fi agbára àkópọ̀ τι hàn: kò sí ohun kan pàápàá tí ẹni náà yóò gba.'
- source_word: παρὰ τοῦ κυρίου
  choice: lọ́wọ́ Olúwa
  rationale: “Lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orísun ohun tí a gbà; “Olúwa” pa akọ́lé κύριος mọ́ láìsọ ẹni tí akọ́lé náà ń tọ́ka sí ní pàtó ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Ẹni tí “Olúwa” (τοῦ κυρίου) ń tọ́ka sí
  choice: Olúwa
  alternative: Ọlọ́run; Olúwa Ọlọ́run
  rationale: Gíríìkì lo κύριος láìfi àlàyé míì kún un. “Olúwa” pa ọ̀rọ̀ orísun àti àìdánilójú ẹni tí akọ́lé náà ń tọ́ka sí mọ́.
- issue: Bí a ṣe túmọ̀ akọ ẹyọ nínú ὁ ἄνθρωπος ἐκεῖνος
  choice: ẹni náà
  alternative: ọkùnrin náà; ènìyàn náà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ẹyọ, ἄνθρωπος ń ṣiṣẹ́ níbí gẹ́gẹ́ bí ẹni aṣojú tó ń ṣiyèméjì, kì í ṣe dandan gẹ́gẹ́ bí ọkùnrin ní ti ìbálòpọ̀. “Ẹni náà” pa ìtọ́kasí ẹyọ àti agbára aṣojú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye. A lo “kò gbọ́dọ̀ rò” dípò ìṣètò ọ̀rọ̀ tó lè dà bí ti àtijọ́, a sì lo “lọ́wọ́ Olúwa” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún orísun.
