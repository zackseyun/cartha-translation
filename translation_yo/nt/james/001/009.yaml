  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: yo
  text: Ṣùgbọ́n kí arákùnrin tí ó wà ní ipò rírẹlẹ̀ máa ṣògo nínú ìgbéga rẹ̀[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin tí ó wà ní ipò rírẹlẹ̀.” Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan, “arákùnrin,” ṣùgbọ́n ó lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ipò gíga rẹ̀.” Gbólóhùn náà lè tọ́ka sí ọlá tí onígbàgbọ́ tí ipò rẹ̀ rẹlẹ̀ ní níwájú Ọlọ́run, pẹ̀lú ìrísí ìyípadà ipò ní ìsinsìnyí àti ní ọjọ́ iwájú.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: kí ... máa ṣògo
  rationale: Àṣẹ onítẹ̀síwájú yìí jẹ́ ìṣírí. “Máa ṣògo” pa agbára καυχάομαι mọ́ ju ọ̀rọ̀ tí ó rọ̀ bí “máa yọ̀” lọ, nígbà tí ohun tí a fi ń ṣògo jẹ́ ìgbéga tí Ọlọ́run fúnni, kì í ṣe gbígbé ara ẹni ga.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ pẹ̀lẹ́ tàbí ìyípadà ọ̀rọ̀ hàn, ó sì ṣí ọ̀nà sí ìfiwéra ẹni tí ó rẹ̀lẹ̀ àti ọlọ́rọ̀ ní ẹsẹ tó tẹ̀ lé.
- source_word: ὁ ἀδελφὸς
  choice: arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan, ó sì sábà ń tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ nínú Jákọ́bù. A pa akọ àti ẹyọ rẹ̀ mọ́ nínú ẹsẹ, a sì ṣàlàyé agbára aṣojú rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: ὁ ταπεινὸς
  choice: tí ó wà ní ipò rírẹlẹ̀
  rationale: ταπεινός lè túmọ̀ sí ẹni tí ipò rẹ̀ rẹlẹ̀ ní àwùjọ tàbí ẹni onírẹ̀lẹ̀. Nítorí ìfiwéra rẹ̀ pẹ̀lú ọlọ́rọ̀ ní ẹsẹ 10, “tí ó wà ní ipò rírẹlẹ̀” jẹ́ èdè àdánidá tí kò fi ìtumọ̀ náà mọ́ òṣì tàbí ìwà ìrẹ̀lẹ̀ nìkan.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: nínú ìgbéga rẹ̀
  rationale: ὕψος túmọ̀ sí gíga tàbí ìgbéga. “Ìgbéga” pa àwòrán ìyípadà ipò mọ́, ó sì lè tọ́ka sí ọlá ẹni náà níwájú Ọlọ́run ní ìsinsìnyí tàbí ní ọjọ́ iwájú láìfi òpin sí ìtumọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ “ìgbéga” arákùnrin tí ipò rẹ̀ rẹlẹ̀
  choice: A túmọ̀ ọ́ sí “ìgbéga rẹ̀,” èyí tí ó lè jẹ́ ọlá tàbí ipò gíga rẹ̀ níwájú Ọlọ́run, pẹ̀lú ìtumọ̀ ìyípadà ipò.
  alternative: Ìgbéga ní àwùjọ ní ìsinsìnyí; ipò ẹ̀mí níwájú Ọlọ́run; tàbí ìgbéga ọjọ́ iwájú ní òpin ayé.
  rationale: Ìfiwéra ẹni tí ipò rẹ̀ rẹlẹ̀ àti ọlọ́rọ̀ ní ẹsẹ 9–10 ní èdè ìyípadà ipò. “Ìgbéga” jẹ́ kí ìtumọ̀ tó gbòòrò yìí dúró láìdín in kù sí ẹ̀kọ́ kan ṣoṣo.
- issue: Ìtumọ̀ akọ nínú ἀδελφός
  choice: A lo “arákùnrin” nínú ẹsẹ gẹ́gẹ́ bí akọ ẹyọ inú orísun, ṣùgbọ́n a jẹ́wọ́ nínú àlàyé pé ó lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ lápapọ̀.
  alternative: “Arákùnrin tàbí arábìnrin” tàbí “onígbàgbọ́ ẹlẹgbẹ́.”
  rationale: Èyí pa akọ àti iye ọ̀rọ̀ Gíríìkì mọ́, láìsọ pé agbára aṣojú rẹ̀ kò sí nínú àyíká ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye. “Ipò rírẹlẹ̀” yàgò fún dídín ταπεινός kù sí òṣì tàbí ìwà ìrẹ̀lẹ̀ nìkan; “ṣògo” àti “ìgbéga” sì pa agbára àti àìdánilójú tó wà nínú orísun mọ́.
