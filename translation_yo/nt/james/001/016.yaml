  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí a tàn yín jẹ, ẹ̀yin arákùnrin mi ọ̀wọ́n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin mi ọ̀wọ́n.” Ọ̀rọ̀ Gíríìkì fún “arákùnrin” lè tọ́ka sí gbogbo àwọn onígbàgbọ́ lápapọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Ẹ má ṣe
  rationale: Ó fi ìfòfindè hàn ní ọ̀nà Yorùbá tó ṣe kedere, láìfi ìtumọ̀ apá-ìṣe míì kún un.
- source_word: πλανᾶσθε
  choice: jẹ́ kí a tàn yín jẹ
  rationale: Ọ̀rọ̀ yìí sọ pé kí àwọn olùgbọ́ má ṣe gba èrò èké gbọ́ tàbí jẹ́ kí ẹlòmíràn ṣì wọ́n lọ́nà; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára passive/middle mọ́.
- source_word: ἀδελφοί
  choice: arákùnrin
  rationale: Èyí pa ìrísí akọ ọ̀pọ̀ nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè dúró fún gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin.
- source_word: μου
  choice: mi
  rationale: Ó túmọ̀ ìbátan àti ìfẹ́ olùkọ̀wé sí àwọn tí ó ń bá sọ̀rọ̀ ní tààrà.
- source_word: ἀγαπητοί
  choice: olùfẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ ìfẹ́ tó ní iyì, tó sì bá ἀγαπητοί mu láìsọ ọ́ di ọ̀rọ̀ ojoojúmọ́ lásán.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tí a fi ń pe gbogbo ìjọ onígbàgbọ́
  choice: A lo “arákùnrin” nínú ẹsẹ̀, a sì ṣàlàyé agbára àkópọ̀ rẹ̀ ní àkọsílẹ̀.
  alternative: “arákùnrin àti arábìnrin” tàbí “ẹ̀yin ọmọ ìyá”
  rationale: ἀδελφοί jẹ́ akọ ọ̀pọ̀ ní gírámà, ṣùgbọ́n nínú ọ̀rọ̀ sí ìjọ ó lè kó àwọn ọkùnrin àti obìnrin jọ. Ìtumọ̀ yìí pa ìrísí orísun mọ́, láìfi agbára àkópọ̀ rẹ̀ pamọ́.
translation_notes:
  register: Yorùbá àpéjọ tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. A lo ọ̀pọ̀-orúkọ ọ̀wọ̀ “ẹ/yín” fún àwùjọ tí Jákọ́bù ń bá sọ̀rọ̀.
