  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: yo
  text: ọkùnrin[a] tí ọkàn rẹ̀ pín sí méjì, tí kò dúró ṣinṣin ní gbogbo ọ̀nà rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ọkàn rẹ̀ pín sí méjì, tí kò dúró ṣinṣin ní gbogbo ọ̀nà rẹ̀.” Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ, ṣùgbọ́n ó ṣeé ṣe kó dúró fún ènìyàn lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ, ó sì ń tọ́ka padà sí ẹni tó ń béèrè ní ẹsẹ tó ṣáájú. “Ọkùnrin” pa ìrísí gírámà orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó lè dúró fún ènìyàn lápapọ̀.
- source_word: δίψυχος
  choice: tí ọkàn rẹ̀ pín sí méjì
  rationale: 'Àpèjúwe yìí sọ ìtumọ̀ ọ̀rọ̀ náà ní Yorùbá àdánidá: ẹni tí inú rẹ̀ pín, tí kò ní ìdúróṣinṣin nínú ìgbàgbọ́ tàbí ìfaramọ́. Ó yẹra fún ìtumọ̀ líle bí “olókàn méjì,” èyí tó lè dà bí ẹni pé ó ní ọkàn méjì ní ti ara.'
- source_word: ἀκατάστατος
  choice: tí kò dúró ṣinṣin
  rationale: Gbólóhùn yìí mú àìdúróṣinṣin àti àìṣeégbẹ́kẹ̀lé ẹni náà jáde láìfi ìtumọ̀ àìtò tàbí ìwà ọ̀daràn kún un.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: ní gbogbo ọ̀nà rẹ̀
  rationale: “Ọ̀nà” jẹ́ àwòrán èdè Yorùbá tó bá ọ̀rọ̀ Gíríìkì mu, ó sì lè tọ́ka sí gbogbo ìgbésí ayé àti ìṣe ẹni náà láìsọ àwòrán orísun nù.
theological_decisions:
- issue: Èdè akọ tó dúró fún gbogbo ènìyàn
  choice: A pa “ọkùnrin” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “ẹni tí ọkàn rẹ̀ pín sí méjì, tí kò dúró ṣinṣin ní gbogbo ọ̀nà rẹ̀”
  rationale: Orísun Gíríìkì lo akọ ní ẹyọ, ṣùgbọ́n nínú àyíká ọ̀rọ̀ ó ṣeé ṣe kó jẹ́ aṣojú fún ẹnikẹ́ni tó bá ń béèrè pẹ̀lú iyèméjì. Àlàyé ìsàlẹ̀ pa ìrísí orísun àti agbára aṣojú rẹ̀ mọ́ láìfi ìtumọ̀ náà mọ́ àwọn ọkùnrin nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ àjákù gẹ́gẹ́ bí orísun, ó sì lo èdè tó ṣe kedere, tó níyì, tí àwọn òǹkàwé òde òní lè lóye.
