  source_fidelity: 'Ìtumọ̀ náà mú èrò pàtàkì ẹsẹ̀ náà dáadáa: gbogbo ohun ìfẹ́ rere wá láti òkè, láti ọ̀dọ̀ Baba àwọn ìmọ́lẹ̀, ẹni tí kò ní ìyípadà. Síbẹ̀, “ó ti ń wá” kò bá copula ἐστιν mu dáadáa, ó sì ń dun bí ìṣe tó ti bẹ̀rẹ̀ ní ìgbà kan. “Òjìji tí ń yí padà” tún lè sọ pé òjìji fúnra rẹ̀ ni ó ń yí padà, dípò kí ó pa genitive τροπῆς ἀποσκίασμα mọ́ ní ìwọ̀n tó pé.'
  naturalness: Àtúnṣe náà lo Yòrùbá boṣewa tó rọrùn fún kíkà ní gbangba. “Wá láti òkè” àti “wọ́n ń sọ̀kalẹ̀” jẹ́ ìlò àdánidá fún ìpilẹ̀ṣẹ̀ àti participle tí ń ṣàpèjúwe ìsọ̀kalẹ̀. “Òjìji ìyípo” jẹ́ ìtumọ̀ tó sun mọ́ ọ̀rọ̀ orísun, tí ó sì fi ìṣòro àwòrán náà sílẹ̀ láì fi ìdí kan mú un dájú.
  terminology: “Ẹ̀bùn,” “Baba àwọn ìmọ́lẹ̀,” àti “ìyípadà” yẹ, wọ́n sì pa ìforígbárí ìṣọ̀kan àti ìyípadà nínú àwòrán náà mọ́. A pa ìyàtọ̀ tó ṣeé ṣe láàrin δόσις àti δώρημα sínú àlàyé ìsàlẹ̀ ojú ìwé.
