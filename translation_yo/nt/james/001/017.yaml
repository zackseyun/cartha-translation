  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: yo
  text: Gbogbo ẹ̀bùn rere àti gbogbo ẹ̀bùn pípé[a] wá láti òkè, wọ́n ń sọ̀kalẹ̀ láti ọ̀dọ̀ Baba àwọn ìmọ́lẹ̀; lọ́dọ̀ rẹ̀, kò sí ìyípadà tàbí òjìji ìyípo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo fífúnni rere àti gbogbo ẹ̀bùn pípé.” Ọ̀rọ̀ àkọ́kọ́ lè tẹnumọ́ ìṣe fífúnni, nígbà tí èkejì ń tẹnumọ́ ohun tí a fi fúnni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òjìji nítorí ìyípo” tàbí “òjìji tí ń ṣí kiri.” Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí àwọn òjìji tí ń yí padà nítorí ìyípo àwọn ìmọ́lẹ̀ ojú ọ̀run.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον
  choice: Gbogbo ẹ̀bùn rere àti gbogbo ẹ̀bùn pípé
  rationale: Èdè Yòrùbá àdánidá máa ń lo “ẹ̀bùn” fún ohun tí a fi fúnni. Àtúnṣe yìí pa ìfarakanra àwọn gbólóhùn méjèèjì àti agbára distributive Πᾶσα/πᾶν mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì tọ́ka sí pé δόσις tún lè tẹnumọ́ ìṣe fífúnni.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: láti òkè ni ó ti ń wá, ó ń sọ̀kalẹ̀
  rationale: “Láti òkè” pa ìtumọ̀ ἄνωθεν mọ́, “ó ń sọ̀kalẹ̀” sì fi ìṣísẹ̀ tí participle καταβαῖνον sọ hàn ní Yòrùbá tó ṣe kedere.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: láti ọ̀dọ̀ Baba àwọn ìmọ́lẹ̀
  rationale: A pa àwòrán “Baba àwọn ìmọ́lẹ̀” mọ́ láì sọ ní pàtó nínú ọ̀rọ̀ àkọ́kọ́ pé àwọn ìmọ́lẹ̀ náà ni àwọn ìràwọ̀ ojú ọ̀run.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: lọ́dọ̀ rẹ̀, kò sí ìyípadà
  rationale: “Lọ́dọ̀ rẹ̀” ṣàfihàn ìbáṣepọ̀ παρά pẹ̀lú arọ́pò-orúkọ náà; “kò sí ìyípadà” sì jẹ́ ọ̀nà Yòrùbá tó ṣe kedere fún existential οὐκ ἔνι àti παραλλαγή.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: tàbí òjìji tí ń yí padà
  rationale: Àtúnṣe yìí pa àwòrán òjìji àti ìyípo tàbí yíyípadà mọ́, ó sì jẹ́ Yòrùbá àdánidá. Àlàyé ìsàlẹ̀ ojú ìwé fi àwọn ìṣeéṣe ìtumọ̀ genitive tó ṣòro yìí hàn.
theological_decisions:
- issue: Àwòrán “Baba àwọn ìmọ́lẹ̀” àti àìyípadà Ọlọ́run
  choice: Pa àwòrán náà àti gbólóhùn nípa àìyípadà mọ́ láì tú wọn sí ẹ̀kọ́ ìgbàgbọ́ gígùn.
  alternative: Ṣàlàyé “àwọn ìmọ́lẹ̀” gẹ́gẹ́ bí àwọn ohun ìmọ́lẹ̀ ojú ọ̀run nínú ọ̀rọ̀ àkọ́kọ́, tàbí sọ apá ìkẹyìn ní ṣókí pé “ẹni tí kì í yí padà.”
  rationale: Ọ̀rọ̀ Gíríìkì fi Ọlọ́run, orísun gbogbo ohun rere, wé àwọn ìmọ́lẹ̀ ẹ̀dá tí ìpo àti òjìji wọn ń yí padà. Mímú àwòrán àti ìṣòro gbólóhùn náà dúró yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yòrùbá boṣewa, olóhùn kíkún níbi tó bá bá àṣà ìkọ̀wé mu; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “láti ọ̀dọ̀” àti “lọ́dọ̀ rẹ̀” láti mú ìbáṣepọ̀ orísun àti wíwà-pẹ̀lú yà kedere.
