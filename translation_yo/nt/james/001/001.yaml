id: JAS.1.1
reference: James 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: yo
  text: 'Jákọ́bù, ẹrú[a] Ọlọ́run àti ti Olúwa Jésù Mèsáyà[b], sí àwọn ẹ̀yà méjìlá tí wọ́n fọ́n káàkiri[c]: mo kí yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì δοῦλος ń tọ́ka sí ẹni tí ó jẹ́ ti ọ̀gá kan; “ẹrú” pa ìtumọ̀ líle yẹn mọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé “Jésù Kristi.” Akọ́lé Gíríìkì Χριστός lè jẹ́ “Mèsáyà,” tàbí “Kristi” níbi tí ó ti ń ṣiṣẹ́ bí apá orúkọ.
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ “ìtànká” náà sábà ń tọ́ka sí àwọn Júù tí wọ́n ń gbé ní òde ilẹ̀ Ísírẹ́lì, ṣùgbọ́n ọ̀rọ̀ pàtàkì ẹsẹ̀ yìí pa àwòrán “àwọn ẹ̀yà méjìlá” mọ́.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Jákọ́bù
  rationale: Èyí ni ọ̀nà tí orúkọ náà gbà wọ́pọ̀ nínú Yorùbá Bíbélì, ó sì bá Ἰάκωβος mu dáadáa.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ó pa ìbátan oníni inú gbólóhùn ‘ẹrú Ọlọ́run’ mọ́ láìfi àlàyé kún un.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ akọ́lé àṣẹ fún Jésù, ó sì jẹ́ ọ̀rọ̀ tí ó ti fìdí múlẹ̀ nínú Yorùbá Kristẹni.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: ‘Mèsáyà’ tú ìtumọ̀ akọ́lé Χριστός jáde dípò kí a ka a sí apá orúkọ lásán.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà fi jíjẹ́ ohun-ìní ọ̀gá àti ìfaramọ́ pátápátá hàn ju ‘ìránṣẹ́’ lọ; èyí bá agbára δοῦλος mu.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: sí àwọn ẹ̀yà méjìlá
  rationale: Ó pa èdè májẹ̀mú Ísírẹ́lì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: διασπορᾷ
  choice: tí wọ́n fọ́n káàkiri
  rationale: Ó sọ ìtumọ̀ ìtànká àwọn Júù ní èdè Yorùbá tí ó ṣe kedere, láìsọ ibi tí Gíríìkì kò sọ ní tààrà.
- source_word: χαίρειν
  choice: mo kí yín
  rationale: Èyí ni ìkíni àdánidá ní ìbẹ̀rẹ̀ lẹ́tà Yorùbá, ó sì mú iṣẹ́ àṣà-lẹ́tà infinitive Gíríìkì náà jáde.
theological_decisions:
- issue: Bí a ṣe tú Χριστοῦ nínú àkọlé Jésù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ní agbára akọ́lé ẹni tí a fòróró yàn níbí; ‘Mèsáyà’ mú ìtumọ̀ yẹn hàn, nígbà tí ‘Kristi’ jẹ́ àṣàyàn tí ó ti dà bí orúkọ nínú lílò Yorùbá.
- issue: Bí a ṣe tú δοῦλος nínú ìdánimọ̀ Jákọ́bù
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: ‘Ẹrú’ pa èrò jíjẹ́ ti ọ̀gá àti ìfaramọ́ pátápátá mọ́; ‘ìránṣẹ́’ rọrùn sí etí ṣùgbọ́n ó lè dín agbára ọ̀rọ̀ Gíríìkì náà kù.
- issue: Àwọn ‘ẹ̀yà méjìlá’ àti ìtànká
  choice: pa àwòrán àwọn ẹ̀yà Ísírẹ́lì àti ìtànká wọn mọ́
  alternative: sọ ọ́ di àwọn Júù tí ń gbé ní òde ilẹ̀ Ísírẹ́lì
  rationale: Gbólóhùn orísun lè ní ìwòye májẹ̀mú tí ó jinlẹ̀ ju àlàyé àgbègbè lọ; nítorí náà a kò fi àlàyé tóóró sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún ìbẹ̀rẹ̀ lẹ́tà. A lo ‘mo kí yín’ gẹ́gẹ́ bí ìkíni lẹ́tà àdánidá, a sì pa ìṣọ̀kan gbólóhùn Gíríìkì mọ́.
