source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: yo
  text: Ó sì tún gbàdúrà, òjò sì rọ láti ojú ọ̀run[a], ilẹ̀ sì mú èso rẹ̀ jáde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀run sì fúnni ní òjò.” Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run”; “ojú ọ̀run” bá ọ̀rọ̀ nípa ojú ọjọ́ mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ilẹ̀ sì mú èso rẹ̀ hù,” tàbí “ilẹ̀ náà sì mú irè oko rẹ̀ jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ó tún ṣe ohun náà lẹ́ẹ̀kan sí i; “tún” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé jù lọ nínú gbólóhùn yìí.
- source_word: προσηύξατο
  choice: ó gbàdúrà
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé ó gbàdúrà. A kò fi “takuntakun” kún un, nítorí èrò yẹn wà ní ẹsẹ̀ 17, kò sì sí nínú ọ̀rọ̀ ẹsẹ̀ yìí.
- source_word: ὁ οὐρανὸς
  choice: ojú ọ̀run
  rationale: Nínú ọ̀rọ̀ nípa ojú ọjọ́ yìí, ó ń tọ́ka sí ojú ọ̀run tí a ń rí, kì í ṣe dandan ibùgbé Ọlọ́run. “Ojú ọ̀run” jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: ὑετὸν ἔδωκεν
  choice: òjò sì rọ láti ojú ọ̀run
  rationale: Gíríìkì ní tààràtà pé ojú ọ̀run “fúnni ní òjò.” Ìtumọ̀ yìí sọ ọ́ ní Yorùbá àdánidá láì fi Ọlọ́run gẹ́gẹ́ bí olùṣe kún ọ̀rọ̀ náà.
- source_word: ἡ γῆ
  choice: ilẹ̀
  rationale: “Ilẹ̀” lè tọ́ka sí ilẹ̀ ayé tàbí ilẹ̀ tí ohun ọ̀gbìn ti ń hù, ó sì bá àyíká iṣẹ́ àgbẹ̀ yìí mu.
- source_word: ἐβλάστησεν
  choice: mú ... jáde
  rationale: Ọ̀rọ̀ náà ń sọ nípa yíyọ hù tàbí mímú ohun ọ̀gbìn so èso. “Mú èso rẹ̀ jáde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì bá ohun àgbìn mu.
- source_word: τὸν καρπὸν αὐτῆς
  choice: èso rẹ̀
  rationale: Ó ń tọ́ka sí èso tàbí ohun ọ̀gbìn tí ilẹ̀ mú jáde. “Èso rẹ̀” pa àwòrán inú Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí irúgbìn kan ṣoṣo.
theological_decisions:
- issue: Àdúrà Èlíjà àti èsì tí ó tẹ̀ lé e
  choice: Ṣàpèjúwe ohun tí ó ṣẹlẹ̀ lẹ́yìn àdúrà náà láì fi àlàyé kún un nípa ẹni tí ó mú òjò rọ.
  alternative: Sọ ní gbangba pé Ọlọ́run rán òjò.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé èyí jẹ́ èsì Ọlọ́run, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ nípa òjò láti ojú ọ̀run àti ilẹ̀ tí ó mú èso jáde. Ìtumọ̀ náà pa ọ̀nà tí orísun gbà sọ ọ́ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “òjò sì rọ láti ojú ọ̀run” dípò àdàkọ líle ti “ojú ọ̀run fúnni ní òjò,” nítorí èyí ni ọ̀nà Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí àṣàyàn.
