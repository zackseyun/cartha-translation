source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: yo
  text: Kí ẹni náà mọ̀ pé ẹnikẹ́ni tí ó bá mú ẹlẹ́ṣẹ̀ kan padà kúrò nínú ìṣìnà nínú ọ̀nà rẹ̀ yóò gba ọkàn rẹ̀ là[a][b] kúrò lọ́wọ́ ikú, yóò sì bo ọ̀pọ̀lọpọ̀ ẹ̀ṣẹ̀ mọ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò gba ìyè rẹ̀ là kúrò lọ́wọ́ ikú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọkàn” tàbí “ìyè.”
    reason: lexical_alternative
  - marker: b
    text: “Rẹ̀” lè tọ́ka sí ẹlẹ́ṣẹ̀ tí a mú padà; àwọn kan gbà pé ó ń tọ́ka sí ẹni tó mú un padà.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: Kí ẹni náà mọ̀
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ fún ẹni kan. Gbólóhùn yìí mú agbára ìṣílétí náà jáde ní Yorùbá àdánidá, ó sì tọ́ka sí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ nínú àyíká ẹsẹ náà.
- source_word: ὁ ἐπιστρέψας
  choice: ẹnikẹ́ni tí ó bá yí ... padà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹnikẹ́ni tó dá ẹni tó ti ṣìnà padà sí ọ̀nà; “yí ... padà” pa àwòrán ìpadàbọ̀ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἁμαρτωλὸν
  choice: ẹlẹ́ṣẹ̀ kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ nípa ẹnikẹ́ni nínú irú ẹ̀ka yìí, kì í ṣe ẹlẹ́ṣẹ̀ kan pàtó.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: kúrò nínú ìṣìnà ọ̀nà rẹ̀
  rationale: “Ìṣìnà” lè ní ìtumọ̀ ṣíṣìnà tàbí àṣìṣe, “ọ̀nà” sì pa àwòrán ìrìn àti ìwà ìgbésí ayé inú orísun mọ́.
- source_word: σώσει
  choice: yóò gba ... là
  rationale: “Gba ... là” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìgbàlà tàbí ìdáǹdè, ó sì pa agbára ọ̀rọ̀ orísun mọ́.
- source_word: ψυχὴν αὐτοῦ
  choice: ọkàn rẹ̀
  rationale: “Ọkàn” lè gbé ìtumọ̀ ẹni inú tàbí ọkàn ènìyàn, ó sì bá ọ̀rọ̀ ìgbàlà mu. Àlàyé ìsàlẹ̀ fi “ìyè” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn, ó sì pa àìdánilójú ẹni tí “rẹ̀” ń tọ́ka sí mọ́.
- source_word: ἐκ θανάτου
  choice: kúrò lọ́wọ́ ikú
  rationale: Gbólóhùn Yorùbá yìí jẹ́ àdánidá, kò sì pinnu bóyá ikú ti ara ni tàbí ikú ní ìtumọ̀ ẹ̀mí.
- source_word: καλύψει
  choice: yóò ... bo ... mọ́lẹ̀
  rationale: Èyí pa àkànlò èdè Bíbélì ti “bo ẹ̀ṣẹ̀” mọ́, láìṣàlàyé rẹ̀ ju ohun tí orísun sọ lọ.
- source_word: πλῆθος ἁμαρτιῶν
  choice: ọ̀pọ̀lọpọ̀ ẹ̀ṣẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì fi hàn pé ẹ̀ṣẹ̀ náà pọ̀ gidigidi.
theological_decisions:
- issue: Ohun tí αὐτοῦ nínú ψυχὴν αὐτοῦ ń tọ́ka sí
  choice: A túmọ̀ arọ́pò-orúkọ náà sí “rẹ̀” láìsọ ẹni tí ó ń tọ́ka sí ní pàtó nínú ẹsẹ náà.
  alternative: Ó lè jẹ́ ọkàn ẹlẹ́ṣẹ̀ tí a yí padà, tàbí, gẹ́gẹ́ bí òye àwọn kan, ọkàn ẹni tó yí i padà.
  rationale: Gíríìkì kò mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí dájú pátápátá. Yorùbá “rẹ̀” pa àìdánilójú yẹn mọ́, àlàyé ìsàlẹ̀ sì sọ àwọn ọ̀nà méjèèjì.
- issue: Ìtumọ̀ ψυχή àti θάνατος
  choice: A lo “ọkàn” àti “ikú” ní ìtumọ̀ gbòòrò wọn.
  alternative: A lè sọ “ìyè ... kúrò lọ́wọ́ ikú,” tàbí kí a mú “ikú” mọ́ ikú nípa ẹ̀mí nìkan.
  rationale: Orísun lè ní ìtumọ̀ pípa ìyè mọ́, ìgbàlà nípa ẹ̀mí, tàbí méjèèjì. Ìtumọ̀ náà kò fi ẹsẹ náà sínú ètò ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, àti èdè tó ṣe kedere fún òǹkàwé gbogbogbò. Àwọn àmì ohùn wà níbi tí wọ́n ti bá èdè àdánidá mu. Gbólóhùn náà pa àwòrán ọ̀nà, ìpadà, ìgbàlà, àti bíbo ẹ̀ṣẹ̀ mọ́.
