id: JAS.5.14
reference: James 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: yo
  text: Ṣé ẹnikẹ́ni nínú yín ń ṣàìsàn? Kí ó pe àwọn alàgbà ìjọ[a], kí wọ́n sì gbàdúrà lórí rẹ̀, kí wọ́n fi òróró pa á ní orúkọ Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹnikẹ́ni nínú yín jẹ́ aláìlera?” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí àìlera ní ọ̀nà tó gbòòrò, ṣùgbọ́n níbí ó ṣeé ṣe jù pé àìsàn ni ó ń tọ́ka sí, nítorí àdúrà, fífi òróró pa ẹni náà, àti ọ̀rọ̀ ìwòsàn ní ẹsẹ tó tẹ̀ lé.
    reason: lexical_alternative
  - marker: b
    text: Fífi òróró pa ẹni náà lè jẹ́ fún ìtọ́jú ara, lè jẹ́ ìṣe àpẹẹrẹ, tàbí kí ó jẹ́ méjèèjì; ẹsẹ yìí kò sọ pàtó ìtumọ̀ tàbí ète ìṣe náà.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: ń ṣàìsàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, pípé àwọn alàgbà, àdúrà, fífi òróró yàn ẹni náà, àti ìwòsàn tí ẹsẹ tó tẹ̀ lé mẹ́nu kàn fi hàn pé àìsàn ara ni ọ̀rọ̀ náà ń tọ́ka sí ní pàtàkì, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí àìlera lápapọ̀.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó pa ìtumọ̀ arọ́pò-orúkọ aláìlẹ́ni-pàtó mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé láìfi akọ tàbí abo kún un.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ẹni náà wà lára àwùjọ tí a ń bá sọ̀rọ̀.
- source_word: προσκαλεσάσθω
  choice: kí ó pe
  rationale: Ó pa agbára àṣẹ ẹni-kẹta ẹyọ kan mọ́, ó sì túmọ̀ sí pé kí aláìsàn náà ké sí àwọn alàgbà láti wá sọ́dọ̀ rẹ̀.
- source_word: τοὺς πρεσβυτέρους
  choice: àwọn alàgbà
  rationale: Pẹ̀lú ‘ìjọ,’ ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú tí ìjọ mọ̀ sí ipò yìí, kì í ṣe àwọn ọkùnrin àgbà lásán.
- source_word: τῆς ἐκκλησίας
  choice: ìjọ
  rationale: ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún àwùjọ àwọn onígbàgbọ́ tí ἐκκλησία ń tọ́ka sí níbí.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: kí wọ́n sì gbàdúrà lórí rẹ̀
  rationale: Ó pa ìtumọ̀ àṣẹ ọ̀pọ̀ ènìyàn àti àwòrán àdúrà ‘lórí’ ẹni aláìsàn mọ́, láìyí i sí ‘fún un’ nìkan.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: kí wọ́n fi òróró yàn án
  rationale: Ó sọ ìṣe fífi òróró sí ẹni náà ní èdè Yorùbá adayeba, láìpinnu bóyá ìṣe náà jẹ́ ti ìtọ́jú ara, àmì ẹ̀sìn, tàbí méjèèjì.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: ní orúkọ Olúwa
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì àti ìtumọ̀ ṣíṣe ohun kan ní ìbáṣepọ̀ pẹ̀lú ẹni àti àṣẹ Olúwa mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος gẹ́gẹ́ bí oyè; kò sì fi ìdánimọ̀ tó ju ohun tí oyè Gíríìkì náà sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ ἀσθενεῖ ní àyíká ọ̀rọ̀ yìí
  choice: Àìsàn ara ni a fi sí àkọ́kọ́
  alternative: Àìlera ẹ̀mí tàbí àìlera lápapọ̀
  rationale: Àwọn àlàyé àyíká—àwọn alàgbà, àdúrà lórí ẹni náà, fífi òróró yàn án, àti ọ̀rọ̀ ìmúláradá ní ẹsẹ tó tẹ̀ lé—tìlẹ́yìn fún àìsàn ara. Àkọsílẹ̀ ìsàlẹ̀ ṣì jẹ́ kí ìtumọ̀ àìlera tó gbòòrò hàn.
- issue: Ìdí tàbí iṣẹ́ fífi òróró yàn ẹni náà
  choice: A sọ ìṣe náà láìṣàlàyé ọ̀nà tí ó gbà ń ṣiṣẹ́
  alternative: Ìtọ́jú ara nìkan, àmì ẹ̀sìn nìkan, tàbí àṣà sákrámẹ́ǹtì kan
  rationale: Gíríìkì sọ ohun tí wọ́n ṣe, ṣùgbọ́n kò ṣàlàyé bóyá òróró náà jẹ́ oogun, àmì, tàbí méjèèjì; nítorí náà a kò gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ ọ̀rọ̀ náà.
- issue: Ìtọ́ka akọ tàbí abo nínú àwọn fọ́ọ̀mù ẹyọ kan
  choice: A lo àwọn arọ́pò-orúkọ Yorùbá tí kò fi akọ tàbí abo hàn
  alternative: Ṣíṣe àfikún ‘ọkùnrin’ tàbí fọ́ọ̀mù akọ
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú ‘ó,’ ‘rẹ̀,’ àti ‘án.’ Èyí tẹ̀ lé gírámà adayeba Yorùbá, ó sì pa ìtọ́ka sí ẹnikẹ́ni mọ́ láìfi ohun tí Gíríìkì kò sọ kún un.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn níbi tó bá yẹ, tí ó sì jẹ́ ti òde òní, ọlọ́lá, àti kíkà-rọrùn. ‘Ṣé’ mú ìbéèrè náà jẹ́ adayeba; ‘kí ó… kí wọ́n sì…’ pa ìtẹ̀sí àwọn àṣẹ Gíríìkì mọ́. A yan ‘ìjọ’ àti ‘àwọn alàgbà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa.
