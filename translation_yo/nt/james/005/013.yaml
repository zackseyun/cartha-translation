id: JAS.5.13
reference: James 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: yo
  text: Ṣé ẹnikẹ́ni nínú yín ń jìyà? Kí ó gbàdúrà. Ṣé inú ẹnikẹ́ni ń dùn? Kí ó kọ orin ìyìn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó kọ Sáàmù”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí kíkọ Sáàmù, tàbí ní gbòòrò sí kíkọ orin ìyìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: ń jìyà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjìyà tàbí fífarada ìnira ní ìtumọ̀ gbígbòòrò; “ń jìyà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ọ̀rọ̀ náà mọ́ àìsàn tàbí inúnibíni nìkan.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Arọ́pò-orúkọ àìdánimọ̀ náà jẹ́ ẹyọ ṣùgbọ́n ó ní ìtumọ̀ gbogbogbò; “ẹnikẹ́ni” pa àwọn méjèèjì mọ́ láìfi akọ tàbí abo kún un.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó fi ẹni tí a ń sọ̀rọ̀ rẹ̀ hàn gẹ́gẹ́ bí ọ̀kan lára àwọn ènìyàn inú àwùjọ tí a kọ̀wé sí.
- source_word: προσευχέσθω
  choice: Kí ó máa gbàdúrà
  rationale: Ìṣílétí ẹni-kẹta ẹyọ náà ń rọ ẹni tó wà nínú ipò yìí láti gbàdúrà; “kí ó máa” tún fi ìṣe tí ó ń bá a lọ hàn, gẹ́gẹ́ bí ìrísí àkókò ìsinsìnyí inú Gíríìkì.
- source_word: εὐθυμεῖ
  choice: inú ... dùn
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé ẹnì kan wà ní inú rere tàbí inú dídùn, ó sì bá ìyàtọ̀ rẹ̀ sí jíjìyà mu.
- source_word: ψαλλέτω
  choice: Kí ó máa kọ orin ìyìn
  rationale: Yíyan yìí sọ ìṣe orin ìyìn sí Ọlọ́run ní kedere, láìdín ọ̀rọ̀ Gíríìkì náà kù sí orin Sáàmù nìkan; àṣàyàn tóóró náà wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìṣílétí ẹyọ tí a lò fún ẹnikẹ́ni lápapọ̀
  choice: Lo “ẹnikẹ́ni” pẹ̀lú “kí ó” ní ẹyọ
  alternative: Lo ọ̀pọ̀, bí “kí wọ́n máa gbàdúrà”
  rationale: Èdè Gíríìkì lo arọ́pò-orúkọ àìdánimọ̀ àti ìṣílétí ẹni-kẹta ní ẹyọ. Yorùbá lè pa ẹyọ àti ìtumọ̀ gbogbogbò náà mọ́ lọ́nà àdánidá láìsọ akọ tàbí abo.
- issue: Ìtumọ̀ ψαλλέτω
  choice: kọ orin ìyìn
  alternative: kọ Sáàmù
  rationale: Ọ̀rọ̀ náà lè tọ́ka ní pàtó sí kíkọ Sáàmù tàbí ní gbígbòòrò sí kíkọ orin ìyìn. Ọ̀rọ̀ inú àyíká yìí ṣe àtìlẹ́yìn fún ìtumọ̀ ìyìn sí Ọlọ́run, ṣùgbọ́n a pa ìtumọ̀ tóóró náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ, ni a lò. Àwọn ìbéèrè méjèèjì àti ìṣílétí “kí ó máa” mú ìṣètò Gíríìkì jáde ní ọ̀nà àdánidá, ọ̀wọ̀, tí òǹkàwé òde òní sì lè lóye.
