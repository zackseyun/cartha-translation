id: JAS.5.3
reference: James 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: yo
  text: Wúrà àti fàdákà yín ti bàjẹ́[a], ìjẹrà wọn yóò sì jẹ́ ẹ̀rí lòdì sí yín, yóò sì jẹ ẹran ara yín bí iná[b]. Ẹ ti kó ìṣúra jọ ní àwọn ọjọ́ ìkẹyìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ti ní ipata.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ipata tàbí ìjẹrà irin lápapọ̀, bí ó tilẹ̀ jẹ́ pé wúrà àti fàdákà kì í ní ipata bí irin ṣe máa ń ní i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ ti kó ìṣúra bí iná jọ ní àwọn ọjọ́ ìkẹyìn.” Àwọn kan so “bí iná” mọ́ gbólóhùn ìkẹyìn dípò kí wọ́n so ó mọ́ “yóò jẹ ẹran ara yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: ti jẹrà
  rationale: Ọ̀rọ̀ náà wà ní àkókò perfect, ó ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ipò rẹ̀ sì ṣì wà. “Ti jẹrà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé irin iyebíye náà ti bàjẹ́ nítorí ìjẹrà, láì fi dandan sọ pé ipata irin gangan ni.
- source_word: ἰὸς
  choice: ìjẹrà
  rationale: Ní àyíká ọ̀rọ̀ nípa wúrà àti fàdákà, ó túmọ̀ sí ìbàjẹ́ tàbí ohun tí ìbàjẹ́ irin mú jáde. “Ìjẹrà” bá àwòrán náà mu, ó sì yẹra fún fífi ipata tí a sábà so mọ́ irin lásán lé wúrà àti fàdákà lórí.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: yóò jẹ́ ẹ̀rí lòdì sí yín
  rationale: Gbólóhùn náà ní ìtumọ̀ ilé-ẹjọ́; ìjẹrà ọrọ̀ wọn yóò fi ẹ̀sùn wọn hàn. “Ẹ̀rí lòdì sí yín” sọ agbára ọ̀rọ̀ náà ní Yorùbá kedere.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: yóò jẹ ẹran ara yín
  rationale: Èyí pa àwòrán líle àti amúnikún-fún-ẹ̀rù inú Gíríìkì mọ́; kò sọ ọ́ di ọ̀rọ̀ pẹ̀lẹ́ bí “yóò pa ara yín run.”
- source_word: σάρκας
  choice: ẹran ara
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ẹran ara ènìyàn nínú àwòrán ìparun àti ìdájọ́, kì í ṣe ìwà ẹ̀ṣẹ̀ ní ìtumọ̀ àpẹẹrẹ.
- source_word: ὡς πῦρ
  choice: bí iná
  rationale: 'Ó bá ọ̀rọ̀ tó ṣáájú rẹ̀ mu lọ́nà àdánidá: ìjẹrà náà yóò jẹ ẹran ara wọn bí iná. Ó pa àfiwé Gíríìkì mọ́ ní ṣókí.'
- source_word: ἐθησαυρίσατε
  choice: Ẹ ti kó ìṣúra jọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí kíkó ohun ìṣúra pamọ́ tàbí jọ. Àṣàyàn yìí pa èrò ìṣúra inú ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtumọ̀ àfikún bí “wọ̀bù” sí i.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: ní àwọn ọjọ́ ìkẹyìn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti ọ̀nà tí ó wọ́pọ̀ ní Yorùbá fún gbólóhùn nípa àkókò ìkẹyìn.
theological_decisions:
- issue: Ibi tí ὡς πῦρ (“bí iná”) so mọ́ nínú gbólóhùn náà
  choice: 'A so ó mọ́ ọ̀rọ̀ tó ṣáájú: ìjẹrà náà yóò jẹ ẹran ara wọn “bí iná.”'
  alternative: 'A lè so ó mọ́ gbólóhùn tó tẹ̀ lé e: “Ẹ ti kó ìṣúra bí iná jọ ní àwọn ọjọ́ ìkẹyìn.”'
  rationale: Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ àti ìtumọ̀ tó ṣàn dáadáa jù lọ ń ṣe àtìlẹ́yìn fún kíkà á pẹ̀lú ọ̀rọ̀ tó ṣáájú. Síbẹ̀, nítorí pé Gíríìkì lè gba ìsopọ̀ kejì, a fi í sínú àlàyé ìsàlẹ̀ láti pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ. “Ẹ” àti “yín” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ, “ẹran ara” sì pa àwòrán líle ti ẹsẹ náà mọ́.
