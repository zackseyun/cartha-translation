id: JAS.5.15
reference: James 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: yo
  text: Àdúrà ìgbàgbọ́[b] yóò gba ẹni tí ó ń ṣàìsàn là[a], Olúwa yóò sì gbé e dìde. Bí ó bá sì ti ṣe ẹ̀ṣẹ̀[c], a ó dárí jì í.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò mú ẹni tí ó ń ṣàìsàn lára dá,” tàbí “yóò wò ó sàn”; ní Gíríìkì, “yóò gbà á là.”
    reason: lexical_alternative
  - marker: b
    text: “Àdúrà ìgbàgbọ́” tún lè túmọ̀ sí àdúrà tí ìgbẹ́kẹ̀lé hàn nínú rẹ̀, tàbí—èyí tí kò ṣeé ṣe tó níbí—àdúrà tí ìṣòtítọ́ hàn nínú rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àní bí ó bá ti ṣe ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: àdúrà
  rationale: Nínú ọ̀rọ̀ nípa àwọn alàgbà tí wọ́n ń gbàdúrà fún aláìsàn (ẹsẹ 14), εὐχή túmọ̀ sí àdúrà, kì í ṣe ẹ̀jẹ́ tàbí ìlérí.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Ìtumọ̀ àkọ́kọ́ nínú àyíká yìí ni ìgbẹ́kẹ̀lé Ọlọ́run tí ó ń ṣe àdúrà náà ní àdúrà ìgbàgbọ́; àkọsílẹ̀ ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì tí ó ṣeé ṣe mọ́.
- source_word: σώσει
  choice: yóò ... gbà ... là
  rationale: Ọ̀rọ̀ Yorùbá yìí pa ìtumọ̀ gbígbàlà mọ́, ó sì lè ní ìtumọ̀ ìmúláradá nínú àyíká àìsàn, láì dín ọ̀rọ̀ Gíríìkì kù sí ìwòsàn nìkan.
- source_word: τὸν κάμνοντα
  choice: ẹni tí ó ń ṣàìsàn
  rationale: Bí κάμνω tilẹ̀ lè túmọ̀ sí ẹni tí ó rẹ̀ tàbí tí ó rẹ̀wẹ̀sì, àyíká ẹsẹ yìí nípa àìsàn, àmì òróró àti gbígbé dìde fi hàn pé ẹni tí ó ń ṣàìsàn ni ìtumọ̀ tí ó bá a mu jù.
- source_word: ἐγερεῖ
  choice: yóò ... gbé e dìde
  rationale: Èyí pa àwòrán ọ̀rọ̀ ἐγείρω mọ́, ó sì yẹ fún mímú aláìsàn dìde kúrò lórí ibùsùn, láì pa àwọn ìró ìmúpadàbọ̀sípò míì rẹ́.
- source_word: κύριος
  choice: Olúwa
  rationale: Olúwa ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún κύριος ní Majẹmu Tuntun, ó sì pa agbára iṣẹ́ Ọlọ́run nínú gbólóhùn náà mọ́.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: Bí ó bá sì ti dá àwọn ẹ̀ṣẹ̀
  rationale: Gbólóhùn yìí jẹ́ kí ẹ̀ṣẹ̀ jẹ́ ohun tí ó ṣeé ṣe, kì í ṣe ohun tí ẹsẹ náà sọ pé ó wà lẹ́yìn gbogbo àìsàn. Àkọsílẹ̀ fi ìtumọ̀ ìyọ̀ǹda ‘àní bí’ hàn.
- source_word: ἀφεθήσεται αὐτῷ
  choice: a ó dárí jì í
  rationale: Ìṣe aláìlórúkọ ní Yorùbá sọ ìdáríjì náà lọ́nà àdánidá, ó sì pa ìṣe àìṣe-taara Gíríìkì mọ́ láì fi ẹni tó ń dáríjì kún ohun tí ọ̀rọ̀ náà sọ ní tààrà.
theological_decisions:
- issue: Bóyá σώσει yẹ kí ó túmọ̀ sí ìwòsàn ara nìkan tàbí gbígbàlà àti ìmúpadàbọ̀sípò ní ìtumọ̀ gbígbòòrò
  choice: A lo ‘yóò gba ... là’ nínú ọ̀rọ̀ pàtàkì, nígbà tí àyíká àìsàn fi ìtumọ̀ ìmúláradá hàn.
  alternative: ‘yóò mú un lára dá’ tàbí ‘yóò wò ó sàn’
  rationale: Jakọbu lo σῴζω, kì í ṣe ọ̀rọ̀ ìṣègùn tó dín sí ìwòsàn ara nìkan. Ìtumọ̀ yìí pa fífẹ̀ ọ̀rọ̀ náà mọ́, nígbà tí àkọsílẹ̀ ṣàlàyé ìtumọ̀ rẹ̀ nínú àyíká.
- issue: Bóyá ẹsẹ náà ń ṣe ìlérí pé àdúrà yóò wo gbogbo aláìsàn sàn láìsí àyọkúrò
  choice: A sọ àwọn ọ̀rọ̀ ọjọ́ iwájú náà ní tààrà bí Gíríìkì ṣe sọ wọ́n, láì fi àlàyé tí yóò sọ wọ́n di aláìlágbára tàbí di òfin ìwòsàn aládàáṣe kún un.
  alternative: ‘lè mú un lára dá’ tàbí ‘yóò wo gbogbo aláìsàn sàn dájúdájú’
  rationale: Ìtumọ̀ kò gbọ́dọ̀ sọ agbára ọ̀rọ̀ ọjọ́ iwájú náà di kékeré, bẹ́ẹ̀ ni kò gbọ́dọ̀ fi ẹ̀kọ́ ẹgbẹ́ kan nípa ìwòsàn tí kò ní àyọkúrò wọ inú rẹ̀.
- issue: Bóyá ìdáríjì túmọ̀ sí pé ẹ̀ṣẹ̀ ẹni náà ló fa àìsàn rẹ̀
  choice: 'A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí àdéhùn: ‘Bí ó bá ... ti dá àwọn ẹ̀ṣẹ̀.’'
  alternative: Kí a sọ pé gbogbo àìsàn jẹ́ àbájáde ẹ̀ṣẹ̀ ẹni náà, tàbí kí a yọ ìdáríjì kúrò nínú àdéhùn náà.
  rationale: Gíríìkì fi ẹ̀ṣẹ̀ hàn gẹ́gẹ́ bí ohun tí ó ṣeé ṣe, kì í ṣe ohun tó ń fa gbogbo àìsàn ní gbogbo ìgbà.
translation_notes:
  register: A lo Yorùbá àjùmọ̀lò tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Gbé e dìde’ pa àwòrán orísun mọ́; ‘a ó dárí jì í’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe àìṣe-taara tí kò sọ olùṣe ní gbangba.
