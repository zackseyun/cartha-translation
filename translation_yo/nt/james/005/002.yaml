  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: yo
  text: Ọ̀rọ̀ yín ti jẹrà, àwọn aṣọ yín sì ti di ohun tí kòkòrò aṣọ ti jẹ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: ọrọ̀
  rationale: “Ọrọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọrọ̀-ajé tàbí ohun ìní púpọ̀; ó bá ìbáwí Jákọ́bù sí àwọn ọlọ́rọ̀ mu.
- source_word: σέσηπεν
  choice: ti jẹrà
  rationale: Àkókò perfect ní Gíríìkì fi ìṣe tó ti ṣẹlẹ̀ àti ipò tó yọ lára rẹ̀ hàn. “Ti jẹrà” pa àwòrán ìbàjẹ́ mọ́, ó sì fi hàn pé ọrọ̀ náà wà ní ipò jíjẹrà nísinsìnyí.
- source_word: ἱμάτια
  choice: àwọn aṣọ
  rationale: “Àwọn aṣọ” jẹ́ ọ̀nà àdánidá, òde òní, tí ó sì gbòòrò láti sọ onírúurú aṣọ ìwọ̀.
- source_word: σητόβρωτα
  choice: ohun tí kòkòrò aṣọ jẹ
  rationale: Gbólóhùn yìí sọ àwòrán gidi ti aṣọ tí kòkòrò aṣọ ti jẹ ní Yorùbá tó ṣe kedere, dípò lílo àkójọpọ̀ ọ̀rọ̀ tí kò ní dùn bí èdè àdánidá.
- source_word: γέγονεν
  choice: ti di
  rationale: “Ti di” ṣàfihàn ìyípadà sí ipò tuntun àti àbájáde tó ṣì wà, gẹ́gẹ́ bí perfect ti γίνομαι ṣe túmọ̀ sí níbí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtumọ̀ náà pa àwọn àwòrán méjèèjì—ọrọ̀ tó jẹrà àti aṣọ tí kòkòrò jẹ—mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
