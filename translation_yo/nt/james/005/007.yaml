id: JAS.5.7
reference: James 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: yo
  text: Nítorí náà, ẹ ní sùúrù, ẹ̀yin ará[a], títí di dídé Olúwa.[b] Ẹ wo! Àgbẹ̀ ń dúró de èso ilẹ̀ tí ó ṣeyebíye; ó sì ń fi sùúrù dúró de èso náà títí yóò fi gba òjò àkọ́kọ́ àti òjò ìkẹyìn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “àwọn arákùnrin,” ṣùgbọ́n a sábà máa ń lò ó láti bá gbogbo àwùjọ àwọn onígbàgbọ́—ọkùnrin àti obìnrin—sọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì παρουσία tún lè túmọ̀ sí “wíwà” tàbí “ìbọ̀”; níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí dídé Olúwa tí a ń retí.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tàbí ohun tí ó “gba” òjò ní gbangba. A lè lóye rẹ̀ pé ó tọ́ka sí àgbẹ̀, tàbí sí èso/irè oko náà.
    reason: ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: ẹ ní sùúrù / ó sì ń fi sùúrù dúró
  rationale: Àwọn ọ̀rọ̀ méjèèjì wá láti gbòǹgbò kan náà, wọ́n sì ń tọ́ka sí sùúrù tí ó fara da ìdádúró. Àtúmọ̀ yìí pa ìtẹnumọ́ àti ìtúnrọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣílétí yìí jẹ́ àbájáde ohun tí Jakọbu ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” ni ọ̀rọ̀ Yorùbá àdánidá fún àkíyèsí àwọn ọmọ ìjọ; kò fi akọ tàbí abo hàn, bí gírámà Yorùbá ṣe rí.
- source_word: παρουσίας
  choice: ìbọ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí dídé Olúwa tí a ń retí. “Ìbọ̀” pa ìtumọ̀ dídé mọ́ láìfi èrò “padà” kún ọ̀rọ̀ Gíríìkì.
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ó fa àfiyèsí àwọn olùgbọ́ sí àpẹẹrẹ àgbẹ̀ ní ọ̀nà Yorùbá tí ó ṣe àdánidá.
- source_word: γεωργὸς
  choice: àgbẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ẹni tó ń ṣiṣẹ́ oko.
- source_word: ἐκδέχεται
  choice: ń dúró de
  rationale: Ó sọ ìfojúsọ́nà tí ó ń bá a lọ, ó sì bá kókó sùúrù mu.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: èso ilẹ̀ tí ó ṣeyebíye
  rationale: Ó pa àwòrán “èso ilẹ̀” àti iye rẹ̀ mọ́, láìdín un kù sí irú irè oko kan pàtó.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: òjò àkọ́kọ́ àti òjò ìkẹyìn
  rationale: Orúkọ “òjò” kò sí ní gbangba nínú gbolóhùn Gíríìkì, ṣùgbọ́n a lóye rẹ̀ láti inú àṣà iṣẹ́ àgbẹ̀ àti lílo àwọn ajẹtífù wọ̀nyí.
theological_decisions:
- issue: Ìtumọ̀ παρουσία τοῦ κυρίου
  choice: ìbọ̀ Olúwa
  alternative: wíwà Olúwa / dídé Olúwa
  rationale: “Ìbọ̀” bá ìretí dídé Olúwa mu nínú àyíká ọ̀rọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé παρουσία tún lè túmọ̀ sí “wíwà” tàbí “dídé.” Kò sọ ètò ẹ̀kọ́ nípa ọjọ́ iwájú kan pàtó ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ẹni tàbí ohun tí ó gba òjò nínú ἕως λάβῃ
  choice: ilẹ̀ ni a sọ ní gbangba gẹ́gẹ́ bí ohun tí ó gba òjò
  alternative: àgbẹ̀ ni ó gba òjò
  rationale: Ọ̀rọ̀ ìṣe Gíríìkì kò sọ olùṣe rẹ̀ ní gbangba. Ilẹ̀ gẹ́gẹ́ bí ohun tí ó gba òjò jẹ́ àdánidá nínú àwòrán iṣẹ́ àgbẹ̀, ṣùgbọ́n a pa ìtumọ̀ míràn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn ni a lò, pẹ̀lú ohùn ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. “Ẹ ní sùúrù” jẹ́ àṣẹ púpọ̀; “ẹ̀yin ará” jẹ́ ọ̀nà àdánidá tí ìjọ Yorùbá fi ń pe gbogbo àwọn ọmọ ìjọ. A yàgò fún “ìpadàbọ̀” nítorí pé ó lè fi ìtumọ̀ “padà” kún παρουσία ju bí ọ̀rọ̀ náà ṣe sọ ní tààrà lọ.
