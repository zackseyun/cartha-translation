  - severity: low
    issue: «Nígbà tí ó bá ń ṣiṣẹ́» ní àwọ̀n ìtumọ̀ ìṣàdédé tàbí ohun tí yóò ṣẹlẹ̀.
    rationale: ἐνεργουμένη jẹ́ participle present tí ó ṣàpèjúwe àdúrà bí ó ṣe ń ṣiṣẹ́/ní ipa. «Nígbà tí ó ń ṣiṣẹ́» sun mọ́ ọ̀nà yẹn ju.
