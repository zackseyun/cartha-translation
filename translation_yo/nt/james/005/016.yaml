  source_fidelity: Ìtumọ̀ náà pa ìfẹ̀hàn ìbáṣepọ̀ nínú ἀλλήλοις, ète ìmúláradá, àti agbára àdúrà mọ́ dáadáa. Ṣùgbọ́n «Àdúrà olódodo» lè túmọ̀ sí àdúrà tí ó jẹ́ olódodo, kì í ṣe àdúrà *ẹni* olódodo (δικαίου). A gbọdọ̀ sọ ẹni tí àdúrà náà jẹ́ tirẹ̀ ní kedere.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti kà. «Àdúrà ẹni olódodo» jẹ́ àtúnṣe kékèké tí ó jẹ́ adayeba síi. «Nígbà tí ó ń ṣiṣẹ́» fi participle náà hàn ní taara ju «nígbà tí ó bá ń ṣiṣẹ́» lọ, láìfi ìtumọ̀ ìṣàdédé tàbí ìwọ̀n mìíràn kún un.
  terminology: «Ẹ̀ṣẹ̀», «jẹ́wọ́», «gbàdúrà», «mú ... láradá», àti «olódodo» yẹ, wọ́n sì pa àìdánilójú nípa ìwọ̀n ìmúláradá mọ́. A tún ṣe àtúnṣe ìsàlẹ̀ ọrọ̀ kí «ẹni olódodo» má bàa sọnù nínú rẹ̀.
  issues:
  - severity: medium
    issue: «Àdúrà olódodo» kò sọ genitive δικαίου di ẹni tí ó ni àdúrà náà ní kedere.
