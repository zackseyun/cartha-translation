id: JAS.5.16
reference: James 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: yo
  text: Nítorí náà, ẹ máa jẹ́wọ́ ẹ̀ṣẹ̀ yín fún ara yín, kí ẹ sì máa gbàdúrà fún ara yín, kí a lè mú yín láradá. Àdúrà ẹni olódodo lágbára púpọ̀ nígbà tí ó ń ṣiṣẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀bẹ̀ ẹni olódodo ní agbára ńlá nígbà tí ó ń ṣiṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: ẹ máa jẹ́wọ́
  rationale: Ó fi àṣẹ tí ń béèrè ìjẹ́wọ́ ní gbangba hàn ní èdè Yorùbá àdánidá, láìfi ètò ìjẹ́wọ́ ẹ̀ṣẹ̀ ti ẹ̀sìn kan pàtó kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú nípa àdúrà, ẹ̀ṣẹ̀ àti ìmúláradá.
- source_word: ἀλλήλοις
  choice: fún ara yín
  rationale: Ó sọ ìṣe alábàápín láàárín àwọn ọmọ ìjọ ní kedere àti ní Yorùbá tó wọ́pọ̀.
- source_word: τὰς ἁμαρτίας
  choice: ẹ̀ṣẹ̀ yín
  rationale: ‘Ẹ̀ṣẹ̀’ ni ìtumọ̀ tààrà; ‘yín’ sì bá àṣẹ alábàápín náà mu ní Yorùbá.
- source_word: εὔχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Ó jẹ́ ọ̀nà àdánidá, tó ṣe kedere láti sọ àṣẹ ìtẹ̀síwájú náà.
- source_word: ὑπὲρ ἀλλήλων
  choice: fún ara yín
  rationale: Ó pa ìtumọ̀ àdúrà ní ipò tàbí nítorí ẹnì kejì mọ́.
- source_word: ὅπως
  choice: kí ... lè
  rationale: Ìṣètò yìí fi ète tàbí àbájáde tí a fẹ́ hàn ní Yorùbá àdánidá.
- source_word: ἰαθῆτε
  choice: kí a lè mú yín láradá
  rationale: Ó pa ohùn àìṣe àti ìtumọ̀ ìmúláradá tó gbòòrò mọ́, láìdín in kù sí ti ara tàbí ti ẹ̀mí nìkan.
- source_word: πολὺ ἰσχύει
  choice: lágbára púpọ̀
  rationale: Ó sọ agbára tàbí ipa ńlá tí gbólóhùn Gíríìkì náà ní, láìtúmọ̀ rẹ̀ sí àbájáde pàtó.
- source_word: δέησις
  choice: Àdúrà
  rationale: Ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì náà lè tẹnu mọ́ ẹ̀bẹ̀.
- source_word: δικαίου
  choice: olódodo
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí kò fi akọ tàbí abo hàn, ó sì bá ìlò àkànlò èdè Gíríìkì fún ẹni olódodo mu.
- source_word: ἐνεργουμένη
  choice: nígbà tí ó bá ń ṣiṣẹ́
  rationale: Ó pa ìṣòro ìtumọ̀ participle náà mọ́ gẹ́gẹ́ bí àdúrà tó ń ṣiṣẹ́ tàbí tó ní ipa, láìyan ìtumọ̀ passive tàbí middle ní pàtó.
theological_decisions:
- issue: Bóyá ẹsẹ yìí pàṣẹ ìjẹ́wọ́ ẹ̀ṣẹ̀ fún àlùfáà tàbí ìjẹ́wọ́ alábàápín láàárín àwọn onígbàgbọ́
  choice: ìjẹ́wọ́ ẹ̀ṣẹ̀ fún ara wọn
  alternative: ìjẹ́wọ́ ẹ̀ṣẹ̀ nípasẹ̀ àwọn olórí ìjọ tí a yàn
  rationale: ἀλλήλοις sọ ìbáṣepọ̀ alábàápín láàárín àwọn tí a ń bá sọ̀rọ̀ ní kedere; ìtumọ̀ náà kò fi àṣà ẹ̀sìn kan pàtó kún ọ̀rọ̀.
- issue: Ìwọ̀n ìmúláradá inú ἰαθῆτε
  choice: ìmúláradá ní ìtumọ̀ gbòòrò
  alternative: ìwòsàn ara nìkan tàbí ìmúláradá ẹ̀mí nìkan
  rationale: Àyíká náà sọ̀rọ̀ nípa àìsàn ara, ṣùgbọ́n ó tún mẹ́nu kan ẹ̀ṣẹ̀; ‘mú ... láradá’ jẹ́ kí ìfẹ̀ ìtumọ̀ méjèèjì dúró.
- issue: Ìtọ́kasí akọ tàbí abo nínú δικαίου
  choice: olódodo
  alternative: ọkùnrin olódodo
  rationale: Adjective náà ń ṣiṣẹ́ bí orúkọ ẹni lápapọ̀; ‘olódodo’ kò fi akọ tàbí abo tí orísun kò béèrè kún un.
- issue: Ìtumọ̀ ἐνεργουμένη
  choice: nígbà tí àdúrà bá ń ṣiṣẹ́
  alternative: àdúrà tí Ọlọ́run ń fi agbára ṣiṣẹ́ nínú rẹ̀
  rationale: Fọ́ọ̀mù Gíríìkì lè gba ìmọ̀ middle tàbí passive; ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa àìdánilójú yẹn mọ́ láìyan olùṣiṣẹ́ kan ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ máa ...’ mú àwọn àṣẹ present imperative méjèèjì jáde lọ́nà àdánidá. ‘Ara yín’ pa ìfọwọ́sowọ́pọ̀ mọ́, ‘olódodo’ sì yẹra fún fífi akọ tàbí abo kún ọ̀rọ̀.
