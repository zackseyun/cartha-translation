id: JAS.5.4
reference: James 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: yo
  text: Wò ó, owó iṣẹ́ àwọn òṣìṣẹ́ tí wọ́n kórè oko yín, tí ẹ ti dá dúró, ń ké jáde; igbe àwọn tí wọ́n kórè náà sì ti wọ etí Olúwa àwọn ọmọ-ogun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa Sábáótì.” Nínú Gíríìkì, a pa àkọlé Hébérù náà mọ́ gẹ́gẹ́ bí “Sabaoth.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìkìlọ̀ tí ń pe àfiyèsí olùgbọ́ ní kánkán; ‘Ẹ wò ó’ jẹ́ Yorùbá òde òní tí ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: μισθὸς
  choice: owó iṣẹ́
  rationale: Ó túmọ̀ sí èrè iṣẹ́ tí ó yẹ kí àwọn òṣìṣẹ́ gbà; ‘owó iṣẹ́’ jẹ́ ọ̀rọ̀ àdánidá tí gbogbo ènìyàn lè lóye.
- source_word: ἐργατῶν
  choice: àwọn òṣìṣẹ́
  rationale: Ó tọ́ka sí àwọn tí a gbà síṣẹ́; ọ̀rọ̀ yìí bá iṣẹ́ oko mu, kò sì fi akọ tàbí abo kún ohun tí Gíríìkì sọ.
- source_word: ἀμησάντων
  choice: tí wọ́n kórè
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pípa tàbí kíkórè irè oko; ‘kórè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere nínú àyíká yìí.
- source_word: χώρας
  choice: oko
  rationale: Nínú àyíká iṣẹ́ ìkórè, ó tọ́ka sí ilẹ̀ tí a ń dáko lé; ‘oko’ jẹ́ ìtumọ̀ tó ṣe déédé.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: tí ẹ fawọ́ rẹ̀ sẹ́yìn
  rationale: Ó fi hàn pé àwọn ọlọ́rọ̀ náà mọ̀ọ́mọ̀ dá owó tí ó yẹ kí wọ́n san dúró; ìtumọ̀ yìí pa ẹ̀sùn tààrà náà mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: κράζει
  choice: ń ké jáde
  rationale: Ó pa àwòrán aláàyè mọ́ pé owó iṣẹ́ tí a kò san dà bí ẹni pé ó ń ké fún ìdájọ́.
- source_word: βοαὶ
  choice: igbe
  rationale: Ó sọ igbe kíkankíkan fún ìrànlọ́wọ́ tàbí ìdájọ́; ‘igbe’ jẹ́ ọ̀rọ̀ tó ṣe kedere tí ó sì ní agbára.
- source_word: θερισάντων
  choice: àwọn tí wọ́n kórè
  rationale: Ó tọ́ka sí àwọn tó ṣe iṣẹ́ ìkórè; ìtumọ̀ yìí jẹ́ ti àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ìkórè mọ́.
- source_word: εἰς τὰ ὦτα
  choice: wọ etí
  rationale: Ó pa àwòrán èdè Gíríìkì-Sémítì náà mọ́ dípò fífi ìtumọ̀ rẹ̀ rọ̀ sí ‘dé ọ̀dọ̀.’
- source_word: Κυρίου Σαβαὼθ
  choice: Olúwa àwọn ọmọ-ogun
  rationale: ‘Sabaoth’ jẹ́ àkọlé Hébérù tí ó ní ìtumọ̀ àwọn ẹgbẹ́ ọmọ-ogun tàbí àwọn ogun ọ̀run; títúmọ̀ àkọlé náà mú kí ó yé òǹkàwé Yorùbá, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa ìkọlórúkọ náà mọ́.
- source_word: εἰσεληλύθασιν
  choice: ti wọ
  rationale: 'Ó pa àkókò pípé mọ́: igbe náà ti wọ etí Olúwa, ipa rẹ̀ sì wà títí di ìsinsìnyí.'
theological_decisions:
- issue: Ìtumọ̀ àkọlé Ọlọ́run Κυρίου Σαβαὼθ
  choice: Olúwa àwọn ọmọ-ogun
  alternative: Olúwa Sábáótì
  rationale: Àkọlé náà wá láti inú àṣà Májẹ̀mú Láéláé, ó sì ń fi Olúwa hàn gẹ́gẹ́ bí ẹni tó jẹ́ olórí gbogbo ogun. A túmọ̀ àkọlé náà nínú ẹsẹ̀ kí ìtumọ̀ rẹ̀ lè ṣe kedere, a sì fi ọ̀nà ìkọlórúkọ sí àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún àwọn òǹkàwé òde òní. A pa àwòrán aláàyè ti owó iṣẹ́ tí ń ké àti igbe tí ń wọ etí Olúwa mọ́. A gbé àmì àkọsílẹ̀ [a] síbi àkọlé Ọlọ́run tí àkọsílẹ̀ náà ń ṣàlàyé.
