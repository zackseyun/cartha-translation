id: JAS.5.8
reference: James 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: yo
  text: Ẹ̀yin náà, ẹ ní sùúrù; ẹ mú ọkàn yín dúró ṣinṣin, nítorí wíwá Olúwa[a] ti súnmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wíwà Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “wíwà” tàbí “wíwá”; nínú àyíká yìí, ó ń tọ́ka sí dídé Olúwa ní òpin ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: ẹ ní sùúrù
  rationale: Ọ̀rọ̀-ìṣe àṣẹ yìí ń tọ́ka sí fífaradà pẹ̀lú sùúrù lábẹ́ ìnira tàbí ìdààmú. ‘Ẹ ní sùúrù’ jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì bá àpẹẹrẹ àgbẹ̀ àti fífaradà nínú àwọn ẹsẹ tó yí i ká mu.
- source_word: καὶ ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: Ó so àwọn òǹkàwé pọ̀ mọ́ àpẹẹrẹ tí a ṣẹ̀ṣẹ̀ sọ, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́ lọ́nà àdánidá.
- source_word: στηρίξατε
  choice: ẹ mú ... dúró ṣinṣin
  rationale: Ọ̀rọ̀-ìṣe àṣẹ náà túmọ̀ sí láti mú ohun kan lágbára tàbí kí ó fìdí múlẹ̀. Gbólóhùn yìí jẹ́ àdánidá pẹ̀lú ‘ọkàn’ ó sì fi ìpinnu inú tó fẹsẹ̀ múlẹ̀ hàn.
- source_word: τὰς καρδίας ὑμῶν
  choice: ọkàn yín
  rationale: Èyí pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́. Nínú lílò Bíbélì, ‘ọkàn’ dúró fún inú ènìyàn, títí kan ìfẹ́-inú, ìgboyà àti ìpinnu.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún àwọn àṣẹ méjèèjì, ‘nítorí’ sì jẹ́ àsopọ̀ okùnfà tó ṣe kedere ní Yorùbá.
- source_word: ἡ παρουσία
  choice: wíwá
  rationale: Nínú ọ̀rọ̀ nípa òpin ayé yìí, παρουσία ń tọ́ka sí dídé Olúwa. ‘Wíwá’ jẹ́ ọ̀nà àdánidá láti sọ èyí láì fi èrò ‘ìpadàbọ̀’ tí kò fara hàn gbangba nínú ọ̀rọ̀ náà kún un.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Jésù nínú ọ̀rọ̀ yìí.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: 'Ìṣe àṣepé Gíríìkì náà fi ipò tó ti wáyé hàn: wíwá náà ti sún mọ́lé. Ìtumọ̀ yìí pa ìrísí àṣepé àti ìmọ̀lára ìsúnmọ́ náà mọ́.'
theological_decisions:
- issue: Ìtumọ̀ παρουσία nínú gbólóhùn nípa wíwá Olúwa ní òpin ayé
  choice: wíwá Olúwa
  alternative: wíwà Olúwa
  rationale: Bí παρουσία tilẹ̀ lè túmọ̀ sí ‘wíwà’ tàbí ‘wíwá,’ ọ̀rọ̀ Jákọ́bù 5:7–8 ń wo dídé Olúwa tí a ń retí. ‘Wíwá’ bá ọ̀rọ̀ yìí mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa àwòrán ‘ọkàn’ mọ́, a sì lo ‘dúró ṣinṣin’ láti sọ ìgboyà àti ìpinnu inú.
