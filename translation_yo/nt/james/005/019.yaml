translation:
  language: yo
  text: Ẹ̀yin ará mi[a], bí ẹnikẹ́ni nínú yín bá ṣìnà kúrò nínú òtítọ́[b], tí ẹnì kan sì mú un padà[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú èdè Gíríìkì, ọ̀rọ̀ náà jẹ́ “àwọn arákùnrin mi,” ṣùgbọ́n fọ́ọ̀mù akọ ọ̀pọ̀ yìí lè tọ́ka sí gbogbo àwùjọ, títí kan àwọn obìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a mú un ṣìnà kúrò nínú òtítọ́” tàbí “a tàn án kúrò nínú òtítọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “yí i padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ẹ̀yin ará mi
  rationale: Ọ̀rọ̀ ìpè yìí jẹ́ ti ọ̀pọ̀ ènìyàn. “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọmọ ẹgbẹ́ ìdílé tàbí àwùjọ, ó sì lè kan gbogbo àwọn onígbàgbọ́ láìpa ìtumọ̀ ìbátan tó wà nínú Gíríìkì rẹ́.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: bí ẹnikẹ́ni nínú yín bá
  rationale: Ó pa ìtumọ̀ àídájú àti ẹni kọ̀ọ̀kan tí τις ní mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédé.
- source_word: πλανηθῇ
  choice: bá ṣìnà
  rationale: Ìṣe náà lè túmọ̀ sí yíyapa kúrò ní ọ̀nà tàbí jíjẹ́ ẹni tí a mú ṣìnà. “Ṣìnà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìyapa kúrò nínú òtítọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ojú ìtumọ̀ aláìṣe mọ́.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: kúrò nínú òtítọ́
  rationale: Ó tẹ̀lé àwòrán ìyapa kúrò lọ́dọ̀ òtítọ́ láìfi kún un pé òtítọ́ náà jẹ́ ẹ̀kọ́ kan pàtó.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: tí ẹnì kan sì yí i padà
  rationale: “Yí i padà” pa àwòrán ἐπιστρέφω mọ́, ó sì ń tọ́ka sí pípadà ẹni tó ṣìnà sí òtítọ́. “Ẹnì kan” tún pa ìtumọ̀ àìsọ ẹni pàtó ti τις mọ́.
theological_decisions:
- issue: Ìtumọ̀ akọ nínú ọ̀rọ̀ ìpè àti arọ́pò-orúkọ
  choice: Lo “Ẹ̀yin ará mi” àti “i” nínú ọ̀rọ̀ pàtàkì.
  alternative: Ẹ̀yin arákùnrin mi; wọn
  rationale: Gíríìkì lo fọ́ọ̀mù akọ, ṣùgbọ́n “ará” ni Yorùbá jẹ́ ọ̀rọ̀ ìbátan tó bá ọ̀rọ̀ ìpè àwùjọ mu, tí kò sì fi abo sílẹ̀. Arọ́pò-orúkọ Yorùbá “i” kò ní àmì akọ tàbí abo, nítorí náà kò yẹ kí a fi akọ tí èdè Yorùbá kò ń fi hàn sí i.
- issue: Ìfojúsùn aláìṣe ti πλανηθῇ
  choice: Lo “ṣìnà” nínú ọ̀rọ̀ pàtàkì, kí a sì sọ ojú ìtumọ̀ jíjẹ́ ẹni tí a mú ṣìnà nínú àlàyé.
  alternative: jẹ́ kí a mú un ṣìnà; jẹ́ ẹni tí a tàn kúrò nínú òtítọ́
  rationale: Fọ́ọ̀mù Gíríìkì lè gba ìtumọ̀ aláìṣe, ṣùgbọ́n nínú àyíká yìí ó tún lè ṣàpèjúwe ẹni tó yapa kúrò nínú òtítọ́. Ìtumọ̀ náà kò gbọ́dọ̀ pinnu ẹni tó fa ìṣìnà níbi tí orísun kò ti pinnu rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmi ohùn ní kíkún. Àtẹ̀jáde náà pa ìsopọ̀ mọ́ ẹsẹ tó tẹ̀ lé e mọ́ nípasẹ̀ àmì kọ́má ní òpin, bí ó ti rí nínú orísun.
