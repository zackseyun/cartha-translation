id: JAS.5.1
reference: James 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: yo
  text: Ẹ wá nísinsìnyí, ẹ̀yin ọlọ́rọ̀, ẹ sọkún, ẹ sì hu igbe ẹkún nítorí àwọn ìpọ́njú tí ń bọ̀ wá bá yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hu igbe ẹkún” túmọ̀ sí kíké tàbí híhu igbe ọ̀fọ̀ sókè. “Ìpọ́njú” lè túmọ̀ sí “àjálù,” “ìdààmú,” tàbí “wàhálà líle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Ẹ wá
  rationale: Àmì ọ̀rọ̀ yìí jẹ́ ìpè tààrà, tó sì ní agbára ìbáwí. “Ẹ wá” jẹ́ ọ̀nà Yorùbá àdánidá láti pe àfiyèsí àwọn ẹni tí a ń bá sọ.
- source_word: οἱ πλούσιοι
  choice: ẹ̀yin ọlọ́rọ̀
  rationale: Nominative náà ń ṣiṣẹ́ bí vocative. “Ẹ̀yin ọlọ́rọ̀” pa ìbáni-sọ̀rọ̀ tààrà mọ́ láì fi kún un pé wọ́n jẹ́ onígbàgbọ́ tàbí aláìgbàgbọ́.
- source_word: κλαύσατε
  choice: ẹ sọkún
  rationale: Ọ̀rọ̀ àṣẹ aorist náà ń ké sí ẹkún gbangba. “Sọkún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní ìwọ̀n tó yẹ.
- source_word: ὀλολύζοντες
  choice: kí ẹ sì pohùnréré
  rationale: Participle yìí mú àṣẹ náà lágbára, ó sì tọ́ka sí ẹkún tàbí igbe ọ̀fọ̀ tí a ń pa sókè. “Pohùnréré” sọ ìró ẹkún gbangba náà ní èdè Yorùbá àdánidá.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: nítorí àwọn ìpọ́njú
  rationale: ἐπί pẹ̀lú dative níbí ń fi ohun tó fa ẹkún hàn. “Nítorí” mú ìbáṣepọ̀ náà ṣe kedere, “ìpọ́njú” sì gba ìtumọ̀ ìṣòro líle tàbí àjálù tó wà nínú ταλαιπωρίαις.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: tí ń bọ̀ wá bá yín
  rationale: Participle present náà ṣàpèjúwe àwọn ìpọ́njú bí ohun tó ń sún mọ́ wọn. “Ń bọ̀ wá bá yín” yẹra fún ìtumọ̀ possession lasan, ó sì fi hàn pé àwọn ìpọ́njú náà yóò dé bá wọn.
theological_decisions:
- issue: Ìró àti ẹni tí ọ̀rọ̀ sí àwọn ọlọ́rọ̀ ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí ìbáwí alásọtẹ́lẹ̀ sí àwọn ọlọ́rọ̀ tí ìpọ́njú ń bọ̀ wá bá, láì sọ pé wọ́n jẹ́ onígbàgbọ́ tàbí aláìgbàgbọ́.
  alternative: Kí a sọ ọ́ di pàtó sí àwọn ọlọ́rọ̀ onílẹ̀ aláìgbàgbọ́ tó ń ni àwọn òṣìṣẹ́ lára, tàbí sí àwọn ọlọ́rọ̀ inú ìjọ.
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ kàn pe “àwọn ọlọ́rọ̀” ní tààrà, ó sì kéde ìpọ́njú tó ń bọ̀; kò sọ ipò wọn nípa ìgbàgbọ́ ní pàtó. Ìtumọ̀ náà kò fi ẹ̀kọ́ ẹ̀sìn tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. Àṣẹ plural “ẹ” bá ìbáni-sọ̀rọ̀ sí ẹgbẹ́ àwọn ọlọ́rọ̀ mu; ìró gbolohun náà jẹ́ líle bí ìkéde alásọtẹ́lẹ̀, ṣùgbọ́n kò di ẹni tí a ń bá sọ mọ́ ẹ̀ka ẹ̀sìn kan.
