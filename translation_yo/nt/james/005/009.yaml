language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: yo
  text: Ẹ má ṣe kùn sí ara yín, ẹ̀yin ará[a], kí a má bàa dá yín lẹ́jọ́. Ẹ kíyèsí i, Onídàájọ́ dúró níwájú àwọn ilẹ̀kùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì adelphoi túmọ̀ ní ìpilẹ̀ṣẹ̀ sí “àwọn arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìpè fún gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, títí kan àwọn obìnrin, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: kùn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, pẹ̀lú κατ’ ἀλλήλων, ọ̀rọ̀ náà ń tọ́ka sí kíkùn tàbí ìráhùn tí a darí sí àwọn ẹlòmíràn, kì í ṣe ìmí ẹ̀dùn lásán.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pe àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè kan ọkùnrin àti obìnrin láìsọ ìtumọ̀ ẹgbẹ́ ìgbàgbọ́ náà di pẹlẹbẹ.
- source_word: κατ’ ἀλλήλων
  choice: sí ara yín
  rationale: Àkójọpọ̀ yìí fi hàn pé ìkùn náà ń dojú kọ ara wọn; “sí ara yín” mú ìtakò láàárín wọn jáde ní Yorùbá àdánidá.
- source_word: κριθῆτε
  choice: kí a má bàa dá yín lẹ́jọ́
  rationale: Èyí pa ìtumọ̀ ìṣe aláìlórúkọ mọ́, ó sì ṣàfihàn ìkìlọ̀ ἵνα μή láìmú “dá lẹ́bi” wọlé, èyí tí yóò lágbára ju ohun tí κρίνω sọ lọ.
- source_word: κριτὴς
  choice: Onídàájọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí Adájọ́ ọ̀run ní àyíká ìdájọ́ ọjọ́ ìkẹyìn; fífi í sí bí orúkọ oyè ń pa agbára rẹ̀ mọ́ láìsọ ẹni náà ní pàtó ju Gíríìkì lọ.
- source_word: πρὸ τῶν θυρῶν
  choice: níwájú àwọn ilẹ̀kùn
  rationale: Èyí pa ọ̀pọ̀ θυρῶν mọ́, ó sì ṣàfihàn ìsúnmọ́ àti ìmúrasílẹ̀ Onídàájọ́.
- source_word: ἕστηκεν
  choice: dúró
  rationale: Ní Yorùbá, “dúró” lè sọ ipò tí ó wà nísinsìnyí lẹ́yìn tí ẹni náà ti dé síbẹ̀, ó sì bá agbára perfect Gíríìkì mu ní ọ̀nà àdánidá.
theological_decisions:
- issue: Ẹni tí “Onídàájọ́” ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “Onídàájọ́,” Adájọ́ ọ̀run ti ìdájọ́ ọjọ́ ìkẹyìn
  alternative: Láti sọ ní pàtó pé Olúwa/Kírísítì ni, tàbí Ọlọ́run ní gbogbogbòò
  rationale: Àyíká Jákọ́bù mú kí Olúwa/Kírísítì ṣeé ṣe jù, ṣùgbọ́n Gíríìkì kò dárúkọ ẹni náà níbí; ìtumọ̀ náà pa àìdájú àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ẹ má ṣe … ẹ̀yin ará” pa ìpè ọ̀pọ̀ ènìyàn mọ́; “Ẹ wò ó” mú ἰδού jáde pẹ̀lú ìtẹnumọ́. A pa ọ̀pọ̀ “àwọn ilẹ̀kùn” mọ́ dípò yíyí i sí ẹyọ kan.
