id: JAS.5.5
reference: James 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: yo
  text: Ẹ ti gbé ìgbé ayé adùn lórí ilẹ̀ ayé, ẹ sì ti fi ara yín fún ìgbádùn[a][b]; ẹ ti sọ ọkàn yín sanra ní ọjọ́ ìpakúpa[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ti gbé nínú adùn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ ti gbé ìgbé ayé àṣejù” ní ipò “ẹ ti fi ara yín fún ìgbádùn.”
    reason: lexical_alternative
  - marker: c
    text: Àwòrán náà dà bí ti ẹran tí a ń sọ sanra kí a tó pa á; ó ṣeé ṣe kí ó ń tọ́ka sí ìdájọ́ tó ń bọ̀.
    reason: cultural_note
  - marker: d
    text: Tàbí, “fún ọjọ́ ìpakúpa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: ẹ ti gbé ìgbé ayé adùn
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí gbígbé nínú adùn àti ọ̀pọ̀lọpọ̀ ohun ìgbádùn, pẹ̀lú ìbáwí tó wà nínú àyíká ọ̀rọ̀; ó ju jíjẹ́ kí ayọ̀ wọni lásán lọ.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: γῆ lè túmọ̀ sí ilẹ̀ tàbí ilẹ̀ ayé; níbí, ìtumọ̀ gbígbòòrò ‘ilẹ̀ ayé’ bá ìbáwí sí ìgbé ayé ti ayé mu.
- source_word: ἐσπαταλήσατε
  choice: ẹ sì ti fi ara yín fún ìgbádùn
  rationale: Gbólóhùn yìí fi ìgbé ayé àṣejù àti àìní ìkóra-ẹni-níjàánu hàn, ó sì mú ìtumọ̀ tó tẹnu mọ́ ara ẹni nínú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἐθρέψατε
  choice: ẹ ti sọ ... sanra
  rationale: Bí ó tilẹ̀ jẹ́ pé τρέφω sábà máa ń túmọ̀ sí bọ́ tàbí tọ́, àwòrán ọ̀rọ̀ níbí ni ti ẹran tí a ń sọ sanra kí a tó pa á; ‘sọ ... sanra’ pa ìtànná ọ̀rọ̀ náà mọ́.
- source_word: τὰς καρδίας ὑμῶν
  choice: ọkàn yín
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ọkàn nínú èdè Bíbélì àti agbára ọ̀rọ̀ ìbáwí náà mọ́, láì sọ ọ́ di àlàyé.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: ní ọjọ́ ìpakúpa
  rationale: ‘Ní’ tẹ̀lé ἐν pẹ́kípẹ́kí, ó sì pa àìdánilójú mọ́ bóyá ọjọ́ náà ti dé tàbí pé ìsọra náà ń lọ sí ọjọ́ tó ń bọ̀.
theological_decisions:
- issue: Agbára àpèjúwe ‘ọjọ́ ìpakúpa’
  choice: Pa àpèjúwe ìpakúpa tí ń tọ́ka sí ìdájọ́ tó sún mọ́lé mọ́, láì sọ ẹni tàbí ohun tí ìpakúpa náà kan ní pàtó nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ọjọ́ ìdájọ́ Ọlọ́run, tàbí gẹ́gẹ́ bí ìpakúpa àwọn aláìṣẹ̀ nínú àyíká ọ̀rọ̀.
  rationale: Ọ̀rọ̀ Gíríìkì mú ìdájọ́ wá sí ọkàn gidigidi, ṣùgbọ́n kò sọ ìtumọ̀ rẹ̀ ní pàtó. Dídá àwòrán náà dúró pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ àti àìdánilójú tó wà nínú orísun mọ́.
- issue: Ìtumọ̀ ἐν nínú ‘ἐν ἡμέρᾳ σφαγῆς’
  choice: ní ọjọ́ ìpakúpa
  alternative: fún ọjọ́ ìpakúpa
  rationale: ‘Ní’ ni ìbámu tó sún mọ́ ἐν jù, kò sì tú àlàyé ìdí tàbí ibi-afẹ́ tí ọ̀rọ̀ náà kò sọ ní gbangba wọ inú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí a ń bá wí. ‘Ìgbé ayé adùn’ àti ‘fi ara yín fún ìgbádùn’ jẹ́ èdè òde òní tó ṣe kedere, nígbà tí ‘sọ ọkàn yín sanra’ pa àwòrán líle àti ìbáwí orísun náà mọ́.
