id: JAS.5.12
reference: James 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: yo
  text: Ṣùgbọ́n ju ohun gbogbo lọ, ẹ̀yin arákùnrin mi[a], ẹ má ṣe fi ọ̀run búra, tàbí fi ayé búra, tàbí fi ìbúra mìíràn èyíkéyìí búra. Kàkà bẹ́ẹ̀, kí “Bẹ́ẹ̀ ni” yín jẹ́ “Bẹ́ẹ̀ ni,” kí “Bẹ́ẹ̀ kọ́” yín sì jẹ́ “Bẹ́ẹ̀ kọ́,” kí ẹ má bàa ṣubú sábẹ́ ìdájọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin arákùnrin àti arábìnrin mi”; Gíríìkì sọ pé “arákùnrin,” ó sì ṣeé ṣe kí ó ń bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí ẹ má bàa ṣubú sábẹ́ ìdálẹ́bi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: ju ohun gbogbo lọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ohun kan sí ipò pàtàkì jù lọ, ó sì pa agbára ìtẹnumọ́ Gíríìkì mọ́ láì sọ ọ́ di bí ìtòlẹ́sẹẹsẹ àkókò.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: “Arákùnrin” pa ìrísí akọ púpọ̀ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin, wà nínú àkọlé náà.
- source_word: μὴ ὀμνύετε
  choice: ẹ má ṣe búra
  rationale: Èyí jẹ́ èèwọ̀ gbogbogbò lórí ṣíṣe ìbúra, kì í ṣe èèwọ̀ lórí ọ̀rọ̀ èébú; àwọn àpẹẹrẹ tó tẹ̀ lé mú ìtumọ̀ náà ṣe kedere.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: yálà fífi ọ̀run búra, fífi ayé búra
  rationale: Ìtumọ̀ yìí sọ ọ̀nà ìbúra nípa ọ̀run àti ayé ní Yorùbá àdánidá, ó sì pa ìbámu àwọn èèwọ̀ méjèèjì mọ́.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: tàbí ṣíṣe ìbúra mìíràn èyíkéyìí
  rationale: Ó pa gbólóhùn Gíríìkì tó gbòòrò mọ́, pé irú ìbúra mìíràn kankan kò yọ sílẹ̀.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Kàkà bẹ́ẹ̀, kí “Bẹ́ẹ̀ ni” yín jẹ́ “Bẹ́ẹ̀ ni,” kí “Bẹ́ẹ̀ kọ́” yín sì jẹ́ “Bẹ́ẹ̀ kọ́”
  rationale: Àtúnsọ náà pa kíkuru àti agbára òwe inú Gíríìkì mọ́, ó sì ń béèrè ọ̀rọ̀ òtítọ́ tó ṣe tààrà.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: kí ẹ má bàa ṣubú sábẹ́ ìdájọ́
  rationale: “Sábẹ́ ìdájọ́” pa àwòrán πέσητε àti ìtumọ̀ gbòòrò κρίσις mọ́ láì fi dandan túmọ̀ rẹ̀ sí ìdálẹ́bi ìkẹyìn.
theological_decisions:
- issue: Bóyá κρίσις túmọ̀ sí ìdájọ́ tàbí ìdálẹ́bi
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Κρίσις lè túmọ̀ sí ìdájọ́ ní ọ̀nà gbòòrò; “ìdálẹ́bi” lè mú ìtumọ̀ náà há ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ béèrè lọ. Nítorí náà, a fi ìtumọ̀ gbòòrò sí àkọ́kọ́, a sì tọ́ka sí èkejì nínú àlàyé.
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί nínú ọ̀rọ̀ sí àwùjọ adalu
  choice: ẹ̀yin arákùnrin mi
  alternative: ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: Ìtumọ̀ àkọ́kọ́ pa akọ púpọ̀ inú Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ọ̀rọ̀ náà dúró fún gbogbo àwùjọ onígbàgbọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àṣàjọ, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “búra” pẹ̀lú àwọn àpẹẹrẹ rẹ̀ láti yà ìbúra sọ́tọ̀ kúrò nínú ọ̀rọ̀ èébú, a sì pa àtúnsọ “Bẹ́ẹ̀ ni/Bẹ́ẹ̀ kọ́” mọ́ fún agbára òwe inú ẹsẹ náà.
