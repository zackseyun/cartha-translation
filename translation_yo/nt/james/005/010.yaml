id: JAS.5.10
reference: James 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: yo
  text: Ẹ̀yin arákùnrin[a], ẹ fi àwọn wòlíì tí wọ́n sọ̀rọ̀ ní orúkọ Olúwa ṣe àpẹẹrẹ nínú ìjìyà àti sùúrù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin” túmọ̀ ἀδελφοί, ọ̀rọ̀ ọ̀pọ̀ akọ; nínú àyíká yìí, ó ṣeé ṣe kí Jakọbu máa bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: ẹ fi ... ṣe àpẹẹrẹ
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí kí a mú ẹnì kan gẹ́gẹ́ bí àpẹẹrẹ láti tẹ̀ lé; ‘ẹ fi ... ṣe àpẹẹrẹ’ jẹ́ èdè Yorùbá àdánidá tó sì pa agbára àṣẹ náà mọ́.
- source_word: ἀδελφοί
  choice: Ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ akọ ní ìpè tààrà. ‘Ẹ̀yin arákùnrin’ pa ìrísí akọ orísun náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó kan gbogbo ìjọ onígbàgbọ́.
- source_word: κακοπαθίας
  choice: jíjẹ ìyà
  rationale: κακοπαθία tọ́ka sí ìrírí ìpọ́njú tàbí ìyà. ‘Jíjẹ ìyà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì bá àpẹẹrẹ àwọn wòlíì mu.
- source_word: μακροθυμίας
  choice: sùúrù
  rationale: μακροθυμία túmọ̀ sí fífi sùúrù pẹ́ ní abẹ́ ìṣòro tàbí sí àwọn ènìyàn; ‘sùúrù’ jẹ́ ọ̀rọ̀ Yorùbá ìgbàlódé tó wọ́pọ̀, tí àyíká sì mú kí ìfaradà rẹ̀ hàn.
- source_word: τοὺς προφήτας
  choice: àwọn wòlíì
  rationale: Èyí ni olùgbà iṣẹ́-ìṣe náà, àwọn ẹni tí Jakọbu ní kí a fi ṣe àpẹẹrẹ.
- source_word: ἐλάλησαν
  choice: tí ó sọ̀rọ̀
  rationale: λαλέω jẹ́ ọ̀rọ̀ ìṣe lasán fún sísọ̀rọ̀; ‘sọ̀rọ̀’ kò fi ìtumọ̀ àfikún bí ‘kéde’ sí i.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Èyí pa àṣà ọ̀rọ̀ Bíbélì mọ́, ó sì lè tọ́ka sí sísọ̀rọ̀ gẹ́gẹ́ bí aṣojú àti pẹ̀lú àṣẹ Olúwa láì dín ìtumọ̀ rẹ̀ kù sí ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìpè akọ ἀδελφοί sí àwùjọ ìjọ
  choice: ‘Ẹ̀yin arákùnrin’ nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó ṣeé ṣe kí ó kan gbogbo àwùjọ onígbàgbọ́
  alternative: ‘Ẹ̀yin arákùnrin àti arábìnrin’ tàbí ‘ẹ̀yin ọmọ ìdílé’
  rationale: Yíyan yìí pa akọ gírámà Gíríìkì mọ́, kò sì sọ pé àwọn obìnrin kò sí nínú àwọn tí a ń bá sọ̀rọ̀; àlàyé ìsàlẹ̀ ṣàlàyé agbára àkópọ̀ rẹ̀.
- issue: Ìbáṣepọ̀ àwọn wòlíì pẹ̀lú ὑπόδειγμα àti àwọn ọ̀rọ̀ oní-ìní méjèèjì
  choice: fi àwọn wòlíì ṣe àpẹẹrẹ jíjẹ ìyà àti sùúrù
  alternative: wo àwọn wòlíì gẹ́gẹ́ bí àpẹẹrẹ nínú ìyà àti sùúrù
  rationale: Àwọn wòlíì ni olùgbà ‘láβετε’, àwọn ọ̀rọ̀ oní-ìní sì sọ ohun tí wọ́n jẹ́ àpẹẹrẹ rẹ̀. Ìtumọ̀ yìí pa ìtòlẹ́sẹẹsẹ yẹn mọ́ láì yanju ju bó ṣe yẹ lọ bóyá κακοπαθία tẹnumọ́ ìrírí ìyà tàbí ìfaradà rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo ‘wòlíì’ àti ‘Olúwa’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì Yorùbá tó ti fìdí múlẹ̀. ‘Ẹ fi ... ṣe àpẹẹrẹ’ jẹ́ àdánidá ju títẹ̀ lé ìtò Gíríìkì lọ, ṣùgbọ́n ó pa ìtumọ̀ àti agbára àṣẹ mọ́.
