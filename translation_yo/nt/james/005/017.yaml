  source_fidelity: 'Ìtumọ̀ náà mú àwọn kókó Gíríìkì náà wá dáadáa: Èlíjà jẹ́ ènìyàn, àdúrà rẹ̀ jẹ́ ti ìfẹ́kúfẹ̀ẹ́/ìfẹ́kàn, òjò kò rọ̀, àkókò náà sì jẹ́ ọdún mẹ́ta àti oṣù mẹ́fà. Síbẹ̀, “sí orí ilẹ̀” ń tọ́ka sí ìṣísẹ̀ sí ibi kan; “lórí ilẹ̀” ni ọ̀nà Yorùbá tó pé fún òjò tí ń rọ̀. “Ènìyàn bíi àwa náà” jẹ́ ìtumọ̀ àdánidá tí ó pa ìbáṣepọ̀ ὁμοιοπαθὴς mọ́, nígbà tí àlàyé ìsàlẹ̀ ń dáàbò bo ìtumọ̀ ‘irú ẹ̀dá kan náà.’'
