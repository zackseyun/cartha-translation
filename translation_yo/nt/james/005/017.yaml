  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: yo
  text: Èlíjà jẹ́ ènìyàn bíi àwa náà[a], ó sì fi taratara gbàdúrà pé kí òjò má rọ̀; òjò kò sì rọ̀ lórí ilẹ̀ fún ọdún mẹ́ta àti oṣù mẹ́fà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èlíjà ní irú ẹ̀dá kan náà bí tiwa,” tàbí, “Èlíjà ní ìmọ̀lára àti ìfẹ́kúfẹ̀ẹ́ kan náà bí tiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Ìrísí orúkọ wòlíì náà tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Ó fi hàn pé Èlíjà jẹ́ ẹ̀dá ènìyàn lásán; ọ̀rọ̀ yìí jẹ́ ti ẹ̀dá ènìyàn ní gbogbogbòò, bí ó tilẹ̀ jẹ́ pé Èlíjà jẹ́ ọkùnrin.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: tí ó ní irú ẹ̀dá bí tiwa
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti bí Èlíjà ṣe jọ àwọn òǹkàwé ní ipò àti ìrírí ẹ̀dá ènìyàn mọ́, láì fi sí ìmọ̀lára tàbí ìfẹ́kúfẹ̀ẹ́ nìkan.
- source_word: προσευχῇ προσηύξατο
  choice: ó fi taratara gbàdúrà
  rationale: Ọ̀nà yìí mú agbára ìtẹnumọ́ inú àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá àdánidá.
- source_word: τοῦ μὴ βρέξαι
  choice: pé kí òjò má rọ̀
  rationale: Ó ṣàfihàn ohun tí àdúrà náà béèrè ní Yorùbá tí ó ṣe kedere.
- source_word: οὐκ ἔβρεξεν
  choice: òjò kò sì rọ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe aláìní olùṣe yìí.
- source_word: ἐπὶ τῆς γῆς
  choice: sí orí ilẹ̀
  rationale: “Ilẹ̀” bá àyíká ọ̀rọ̀ ọ̀dá ní ilẹ̀ Èlíjà mu, ó sì yẹra fún fífi ìtumọ̀ gbogbo ayé lé e lórí.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: fún ọdún mẹ́ta àti oṣù mẹ́fà
  rationale: “Fún” fi gígùn àkókò ọ̀dá náà hàn ní kedere.
theological_decisions:
- issue: Ìtumọ̀ ὁμοιοπαθὴς nípa jíjẹ́ ènìyàn Èlíjà
  choice: Èlíjà ní irú ẹ̀dá ènìyàn bí tiwa.
  alternative: Èlíjà ní ìmọ̀lára tàbí ìfẹ́kúfẹ̀ẹ́ kan náà bí tiwa.
  rationale: Ọ̀rọ̀ náà ń fún àwọn onígbàgbọ́ ní ìgboyà nípa fífi hàn pé Èlíjà jẹ́ ẹ̀dá ènìyàn bí wọn; ìtumọ̀ tí a yàn pa agbára gbígbòòrò náà mọ́ láì dín in kù sí ìmọ̀lára nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé gbogbogbòò; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
