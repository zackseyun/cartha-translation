id: JAS.5.11
reference: James 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: yo
  text: Ẹ kíyèsí i, a ka àwọn tí ó faradà sí alábùkún. Ẹ ti gbọ́ ìfaradà Jóòbù, ẹ sì ti rí àbájáde tí Olúwa[a] mú wá—pé Olúwa kún fún ìyọ́nú gidigidi, ó sì jẹ́ aláàánú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “òpin Olúwa.” Ó lè tọ́ka sí bí Olúwa ṣe mú ọ̀ràn Jóòbù parí, tàbí sí àbájáde iṣẹ́ Olúwa.
    reason: Láti pa ìtumọ̀ τὸ τέλος κυρίου mọ́, nítorí ìbátan genitive κυρίου lè jẹ́ ohun tí Olúwa mú ṣẹlẹ̀ tàbí ohun tí ó jẹ́ tirẹ̀ ní òpin.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ ìkìlọ̀ tí ó pe àwọn olùgbọ́ láti fiyè sí ohun tí ó tẹ̀ lé; ó jẹ́ adayeba, ó sì bá ọ̀rọ̀ tí a ń sọ sí ọ̀pọ̀ ènìyàn mu.
- source_word: μακαρίζομεν
  choice: a ka ... sí alábùkún
  rationale: Ó pa ìtumọ̀ pé a mọ̀ tàbí a kéde àwọn ènìyàn náà gẹ́gẹ́ bí ẹni tí Ọlọ́run ṣe ojúrere sí mọ́, láì dín un kù sí ayọ̀ inú lásán.
- source_word: τοὺς ὑπομείναντας / ὑπομονή
  choice: àwọn tí ó ti fara dà á / ìfaradà
  rationale: Àwọn ọ̀rọ̀ yìí fi ìdúró ṣinṣin lábẹ́ ìpọ́njú hàn, wọ́n sì pa ìbátan ọ̀rọ̀ inú Gíríìkì mọ́ ní Yorùbá.
- source_word: τὸ τέλος κυρίου
  choice: ìyọrísí láti ọ̀dọ̀ Olúwa
  rationale: τέλος níhìn-ín tọ́ka sí bí ọ̀ràn Jóòbù ṣe parí tàbí ohun tí Olúwa mú jáde ní òpin; ‘ìyọrísí’ yẹra fún yíyí ọ̀rọ̀ náà padà sí ‘ètò’ nìkan.
- source_word: πολύσπλαγχνος
  choice: kún fún ìyọ́nú gidigidi
  rationale: Ó mú agbára ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí ìyọ́nú jíjinlẹ̀ tàbí púpọ̀ jáde ní èdè Yorùbá adayeba.
- source_word: οἰκτίρμων
  choice: aláàánú
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún ẹni tí ń ṣàánú, ó sì yà díẹ̀ sí ‘ìyọ́nú’ tó ṣáájú rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τὸ τέλος κυρίου
  choice: ìyọrísí láti ọ̀dọ̀ Olúwa
  alternative: ètò Olúwa; òpin Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìparí tàbí àbájáde tí Olúwa mú wá, nígbà tí genitive náà kò sọ ìbátan náà ní kíkún. Ìtumọ̀ yìí bá àyíká ìtàn Jóòbù mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìfọ̀rọ̀wérọ̀ orísun náà mọ́.
- issue: Ìbùkún àwọn tí ó fara da ìpọ́njú
  choice: a ka ... sí alábùkún
  alternative: a pè ... ní aláyọ̀
  rationale: ‘Alábùkún’ pa èrò ojúrere Ọlọ́run àti ìdájọ́ rere nípa wọn mọ́, láì fi hàn pé ìrírí ìpọ́njú fúnra rẹ̀ jẹ́ ayọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́wọ̀ àti yíyé fún gbogbo ènìyàn. A lo ‘Ẹ’ nítorí Jakọbu ń bá àwùjọ sọ̀rọ̀, a sì lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ.
