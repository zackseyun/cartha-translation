  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: yo
  text: Ẹ dá olódodo náà[a] lẹ́bi, ẹ sì pa á. Kò takò yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni olódodo náà.” Àwọn atúmọ̀ kan rí i gẹ́gẹ́ bí ìtọ́ka tó ṣeé ṣe sí Jésù, “Olódodo náà”; síbẹ̀, àyíká ọ̀rọ̀ náà tún lè tọ́ka sí aṣojú ẹni olódodo tí àwọn ọlọ́rọ̀ ń pọ́n lójú.
    reason: alternative_reading
  - marker: b
    text: A tún lè ka gbólóhùn Gíríìkì náà sí ìbéèrè àsọyé pé, “Ṣé kò takò yín?”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: Ẹ dá … lẹ́bi
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ìdájọ́ àti fífi ẹ̀bi kan ẹni hàn ní Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ ìbáwí aorist mọ́.
- source_word: ἐφονεύσατε
  choice: ẹ sì pa á
  rationale: ‘Pa’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún pípa ènìyàn; nínú ọ̀rọ̀ ẹ̀sùn yìí, ó ní agbára ìwà búburú tí φονεύω ní, láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τὸν δίκαιον
  choice: olódodo náà
  rationale: Adjective olódodo tí a lò gẹ́gẹ́ bí orúkọ ẹni bá substantival adjective Gíríìkì mu. Yorùbá kò fi akọ tàbí abo hàn nínú ọ̀rọ̀ yìí, bẹ́ẹ̀ ni ìtumọ̀ náà ṣì lè tọ́ka sí aṣojú ẹni olódodo tàbí, bó bá yẹ, sí ẹni kan pàtó.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Kò dojú ìjà kọ yín
  rationale: Gbólóhùn yìí túmọ̀ ἀντιτάσσομαι gẹ́gẹ́ bí dídìde tàbí kíkojú ẹni ní ìjà. A fi í ṣe gbólóhùn ìròyìn tó ṣe kedere, ṣùgbọ́n a pa ìṣeéṣe pé ìbéèrè àsọyé ni mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ẹni tí ‘olódodo náà’ ń tọ́ka sí
  choice: A kò sọ nínú ọ̀rọ̀ pàtàkì pé Jésù ni; ó lè jẹ́ ẹni olódodo tí àwọn ọlọ́rọ̀ ń pọ́n lójú gẹ́gẹ́ bí aṣojú gbogbo irú ẹni bẹ́ẹ̀.
  alternative: Ó lè jẹ́ ìtọ́ka àṣírí sí Jésù gẹ́gẹ́ bí ‘Olódodo náà.’
  rationale: Àyíká ọ̀rọ̀ Jákọ́bù ń bá àwọn ọlọ́rọ̀ aninilára wí ní gbogbogbòò. Síbẹ̀, ọ̀rọ̀ ẹyọ náà lè mú kí àwọn kan gbọ́ ìró ìtọ́ka sí Jésù; àlàyé ìsàlẹ̀ pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìpa gbólóhùn ìkẹyìn
  choice: A tú un sí gbólóhùn ìròyìn pé, ‘Kò dojú ìjà kọ yín.’
  alternative: A lè kà á sí ìbéèrè àsọyé pé, ‘Ṣé kò dojú ìjà kọ yín?’
  rationale: Àmì ìbéèrè inú SBLGNT jẹ́ ìpinnu àwọn olóòtú, nítorí àwọn àfọwọ́kọ àkọ́kọ́ kò fi àmì ìdákẹ́jẹ bẹ́ẹ̀ dá ìtumọ̀ náà. Gbólóhùn ìròyìn ṣe ìtumọ̀ àyíká ọ̀rọ̀ náà kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ míì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àwọn ọ̀rọ̀ náà taara, wọ́pọ̀, wọ́n sì pa irú ìbáwí líle inú orísun Gíríìkì mọ́.
