id: JAS.4.5
reference: James 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: yo
  text: Tàbí ẹ̀yin rò pé lásán ni Ìwé Mímọ́ ń sọ pé Ẹ̀mí tí Ọlọ́run mú kí ó máa gbé inú wa ń fẹ́ wa gidigidi pẹ̀lú owú[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “ẹ̀mí tí Ọlọ́run mú kí ó máa gbé inú wa ń fẹ́ wa gidigidi pẹ̀lú ìlara.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí ènìyàn; gbólóhùn tí a túmọ̀ sí “pẹ̀lú owú” sì tún lè túmọ̀ sí “pẹ̀lú ìlara.”
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: lásán
  rationale: “Lásán” fi hàn pé ọ̀rọ̀ Ìwé Mímọ́ kì í ṣe aláìní ète tàbí aláìní ìmúṣẹ, ó sì bá ìbéèrè àsọyé náà mu ní Yorùbá àdánidá.
- source_word: ἡ γραφὴ
  choice: Ìwé Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó ní iyì, láti tọ́ka sí Scripture gẹ́gẹ́ bí ìkọ̀wé mímọ́ aláṣẹ.
- source_word: Πρὸς φθόνον
  choice: pẹ̀lú owú
  rationale: “Owú” lè túmọ̀ sí ìfẹ́ àníyàn tí ń béèrè ìdúróṣinṣin, ṣùgbọ́n ó tún lè ní ìtumọ̀ ìlara; àlàyé ìsàlẹ̀ pa ìṣòro yìí mọ́.
- source_word: ἐπιποθεῖ
  choice: ń ṣe àfẹ́rí wa
  rationale: “Ṣe àfẹ́rí” sọ ìfẹ́ líle àti ìyánhànhàn tí ọ̀rọ̀ Gíríìkì náà ní, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Lẹ́tà ńlá tọ́ka sí Ẹ̀mí Mímọ́ nínú àyọkà pàtàkì, ṣùgbọ́n gírámà Gíríìkì tún gba “ẹ̀mí” ènìyàn láàyè; àlàyé ìsàlẹ̀ sọ èyí kedere.
- source_word: κατῴκισεν
  choice: tí ó mú kí ó máa gbé
  rationale: 'Ìtumọ̀ yìí pa agbára ìṣe olùmúṣẹ́ ti κατοικίζω mọ́: ẹni kan ni ó mú Ẹ̀mí náà wá sí ibùgbé, kì í ṣe pé ó kan “ń gbé” níbẹ̀.'
- source_word: ἐν ἡμῖν
  choice: inú wa
  rationale: “Inú wa” fi ìgbé-inú ẹni hàn ní kedere ju “láàárín wa” lọ, ó sì bá ìtumọ̀ Ẹ̀mí Mímọ́ mu.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ tí Ọlọ́run mú kí ó máa gbé inú àwọn onígbàgbọ́
  alternative: ẹ̀mí ènìyàn tí Ọlọ́run mú kí ó máa gbé inú wa
  rationale: Gírámà ẹsẹ̀ náà lè gba ìtumọ̀ méjèèjì. Àyọkà pàtàkì yan Ẹ̀mí Mímọ́ nítorí èdè ìgbé inú wa àti owú mímọ́ Ọlọ́run, ṣùgbọ́n àlàyé ìsàlẹ̀ kò fi ìtumọ̀ kejì pamọ́.
- issue: Ìwà rere tàbí búburú inú φθόνος
  choice: owú gẹ́gẹ́ bí ìfẹ́ àníyàn tí ń béèrè ìdúróṣinṣin
  alternative: ìlara tàbí ìfẹ́ tí ó ní ìlara nínú
  rationale: Nítorí àyọkà pàtàkì ka Ẹ̀mí náà sí Ẹ̀mí Mímọ́, “owú” lè sọ ẹ̀tọ́ Ọlọ́run lórí àwọn ènìyàn rẹ̀ láìfi ìwà ẹ̀ṣẹ̀ kún un. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ odi, a sì tọ́ka sí i nínú àlàyé.
- issue: Bóyá gbólóhùn lẹ́yìn λέγει jẹ́ àyọlò taara láti inú Ìwé Mímọ́
  choice: fi sí inú àmì àyọlò gẹ́gẹ́ bí ohun tí Ìwé Mímọ́ sọ
  alternative: ka á sí àlàyé Jákọ́bù tí ó tẹ̀ lé ìbéèrè náà, kì í ṣe àyọlò ọ̀rọ̀-gangan
  rationale: Àkọsílẹ̀ Gíríìkì gbé gbólóhùn náà kalẹ̀ lẹ́yìn “Ìwé Mímọ́ ń sọ,” ṣùgbọ́n kò sí àyọlò Majẹmu Láéláé kan tí ó bá a mu ní ọ̀rọ̀-gangan. Àmì àyọlò ràn òǹkàwé lọ́wọ́ láti rí ìsopọ̀ gírámà, láìsọ pé a mọ orísun kan pàtó.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. “Lásán,” “ṣe àfẹ́rí,” àti “owú” jẹ́ ọ̀rọ̀ àdánidá; àlàyé ìsàlẹ̀ ni a fi pa àìdánilójú gírámà àti ẹ̀kọ́ ìgbàgbọ́ mọ́.
