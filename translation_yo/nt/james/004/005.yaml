  source_fidelity: Ìtumọ̀ náà mú ìbéèrè àsọyé ti κενῶς, ọlá-ọba ti ἡ γραφή, àti àìdánilójú tó wà nínú Πρὸς φθόνον, τὸ πνεῦμα, àti κατῴκισεν hàn dáadáa. Síbẹ̀, ìpìlẹ̀ gírámà Yorùbá nínú ọ̀rọ̀ àpẹẹrẹ náà jẹ́ kí Ẹ̀mí fúnra rẹ̀ dà bí ẹni tí ó mú ara rẹ̀ wá gbé inú wa, dípò Ọlọ́run ẹni tí a lóye gẹ́gẹ́ bí olùmúṣẹ́ nínú Gíríìkì.
  naturalness: “Ń ṣe àfẹ́rí wa” kò jẹ́ ọ̀nà Yorùbá boṣewa tí ó mọ́gbọ́n dání láti sọ ἐπιποθεῖ nínú ọ̀rọ̀ yìí. “Ń fẹ́ wa gidigidi pẹ̀lú owú” jẹ́ ìsọ̀rọ̀ àdánidá, ó sì fi ìfẹ́kúfẹ̀ẹ́ líle náà hàn. Fífi “Ọlọ́run” sílẹ̀ gẹ́gẹ́ bí olùmúṣẹ́ tún mú gbolohun náà yé ẹni dáadáa.
  terminology: Ìwé Mímọ́, Ẹ̀mí, owú, àti ìlara bá ìforúkọsílẹ̀ ìjọsìn Yorùbá boṣewa mu. “Owú” nínú ọ̀rọ̀ pàtàkì náà lè ṣiṣẹ́ fún ìfẹ́-owú ọlọ́run, níwọ̀n bí àlàyé ìsàlẹ̀ ti pa ìtumọ̀ “ìlara” àti kí ẹ̀mí náà jẹ́ ẹ̀mí ènìyàn mọ́.
  issues:
