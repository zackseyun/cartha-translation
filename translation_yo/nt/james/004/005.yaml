    issue: Olùmúṣẹ́ nínú “tí ó mú kí ó máa gbé inú wa” kò ṣe kedere, ó sì lè yí ìtumọ̀ padà.
    rationale: Nínú ìṣètò Yorùbá yìí, “ó” àkọ́kọ́ lè tọ́ka sí “Ẹ̀mí,” nítorí náà ó dà bí ẹni pé Ẹ̀mí ló mú kí ara rẹ̀ gbé inú wa. Κατῴκισεν jẹ́ ọ̀rọ̀ ìṣe causative; ní ìka tí a yan, Ọlọ́run ni olùmúṣẹ́ tí a lóye. “Tí Ọlọ́run mú kí ó máa gbé inú wa” ṣàtúnṣe èyí.
