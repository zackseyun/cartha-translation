id: JAS.4.10
reference: James 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: yo
  text: Ẹ rẹ ara yín sílẹ̀ níwájú Olúwa[a], òun yóò sì gbé yín ga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìwàásù Olúwa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òun yóò gbé yín sókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Ẹ rẹ ara yín sílẹ̀
  rationale: Àṣẹ náà jẹ́ ti ẹni kejì ọ̀pọ̀, ó sì lè ní agbára ìtumọ̀ afẹ̀yìntì pé kí àwọn olùgbọ́ fi ara wọn sí ipò ìrẹ̀lẹ̀. Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìpè sí ìrẹ̀lẹ̀ àtinúwá mọ́.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: “Níwájú” lè túmọ̀ sí ní ojú tàbí níwàásù ẹnìkan, ó sì mú ìbáṣepọ̀ àti ìmọ̀ pé Olúwa wà níbẹ̀ jáde lọ́nà ṣókí.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó yẹ fún κύριος, kò sì fi kún ọ̀rọ̀ náà bóyá Ọlọ́run ni tàbí Jesu ni a ń tọ́ka sí ní pàtó.
- source_word: ὑψώσει
  choice: yóò gbé ... ga
  rationale: Gbólóhùn yìí fi ìgbéga tàbí fífi ọlá fún ẹni hàn, ó sì bá àwòrán gíríìkì ti gbígbé sókè mu ní èdè Yorùbá ti òde òní.
- source_word: ὑμᾶς
  choice: yín
  rationale: “Yín” fi hàn pé ẹni kejì ọ̀pọ̀ ni a ń bá sọ̀rọ̀, gẹ́gẹ́ bí ọ̀rọ̀ orísun.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “Olúwa,” láì sọ ní pàtó pé Ọlọ́run ni tàbí Jesu Olúwa.
  alternative: Ọlọ́run; Jesu Olúwa
  rationale: Ìwé Jakọbu lè lo κύριος fún Ọlọ́run tàbí fún Jesu. Ẹsẹ̀ yìí fúnra rẹ̀ kò yan ọ̀kan ní pàtó; nítorí náà, “Olúwa” pa àìdánilójú tó wà nínú orísun mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó bójú mu, tí ó ní iyì, ni a lò. Àṣẹ “Ẹ” àti arọ́pò-orúkọ “yín” pa ọ̀pọ̀ ẹni tí gíríìkì ń bá sọ̀rọ̀ mọ́. “Òun” tẹnumọ́ pé Olúwa fúnra rẹ̀ ni yóò ṣe ìgbéga náà.
