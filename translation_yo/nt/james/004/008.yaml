id: JAS.4.8
reference: James 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: yo
  text: Ẹ sún mọ́ Ọlọ́run, òun yóò sì sún mọ́ yín. Ẹ wẹ ọwọ́ yín mọ́, ẹ̀yin ẹlẹ́ṣẹ̀; ẹ sì sọ ọkàn yín di mímọ́, ẹ̀yin tí ọkàn yín pín sí méjì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “ẹ̀yin olókàn méjì.” Ó ń ṣàpèjúwe àwọn tí ìfaramọ́ tàbí ìpinnu inú wọn pín sí méjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Ẹ sún mọ́
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó pa ìtumọ̀ sísúnmọ́ Ọlọ́run mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Ó túmọ̀ ẹni tí a ń sún mọ́ ní tààrà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐγγιεῖ
  choice: òun yóò sì sún mọ́ yín
  rationale: 'Ó pa àfiwé ọ̀rọ̀-ìṣe kan náà mọ́: bí àwọn olùgbọ́ ṣe ń sún mọ́ Ọlọ́run, bẹ́ẹ̀ ni òun yóò sún mọ́ wọn.'
- source_word: καθαρίσατε
  choice: Ẹ wẹ ... mọ́
  rationale: Ó jẹ́ àṣẹ tó lágbára, ó sì pa àwòrán ìwẹ̀nùmọ́, pẹ̀lú ìtumọ̀ ìṣe rere inú rẹ̀, mọ́.
- source_word: χεῖρας
  choice: ọwọ́ yín
  rationale: A pa àwòrán ọwọ́ mọ́ dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí ìwà tàbí iṣẹ́ òde.
- source_word: ἁμαρτωλοί
  choice: ẹ̀yin ẹlẹ́ṣẹ̀
  rationale: Ó pa ìbáwí tààrà ti ọ̀rọ̀ ìpè ọ̀pọ̀ ènìyàn mọ́.
- source_word: ἁγνίσατε
  choice: ẹ sì sọ ... di mímọ́
  rationale: Yíyan ọ̀rọ̀ yìí yàtọ̀ sí ‘wẹ ... mọ́,’ bí àwọn ọ̀rọ̀ Gíríìkì méjèèjì ṣe yàtọ̀, ó sì bá ìwẹ̀nùmọ́ inú mu.
- source_word: καρδίας
  choice: ọkàn yín
  rationale: ‘Ọkàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí inú ènìyàn, ìfẹ́, èrò àti ìdúróṣinṣin rẹ̀, nígbà tí àwòrán ara ṣì wà.
- source_word: δίψυχοι
  choice: ẹ̀yin tí ọkàn yín pín sí méjì
  rationale: Ó fi ìpín inú àti àìdúró ṣinṣin nínú ìfaramọ́ hàn ní èdè Yorùbá tí ó ṣe kedere, láìsọ àwòrán Gíríìkì di ẹ̀kọ́ pàtó kan.
theological_decisions:
- issue: Àwòrán ara nínú ìpè sí ìwẹ̀nùmọ́ ìwà
  choice: A pa ‘ọwọ́’ àti ‘ọkàn’ mọ́ nínú ẹsẹ náà.
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí ìṣe òde àti èrò inú.
  rationale: Ọ̀rọ̀ náà lè ní ìró ìwẹ̀nùmọ́ ẹ̀sìn àti ìwà rere papọ̀; pípa àwòrán náà mọ́ kò fi tipátipá yan ọ̀kan ṣoṣo.
- issue: Ìtumọ̀ δίψυχοι
  choice: ẹ̀yin tí ọkàn yín pín sí méjì
  alternative: ẹ̀yin olókàn méjì
  rationale: Àṣàyàn inú ẹsẹ náà ṣe kedere pé ìfaramọ́ wọn pín, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán Gíríìkì tó túmọ̀ ní tààrà sí ‘olókàn méjì’ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣe kedere ni a lò. A lo àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ,’ a sì pa ìṣọ̀kan ọ̀rọ̀ ‘sún mọ́’ àti ìyàtọ̀ láàárín ‘wẹ ... mọ́’ àti ‘sọ ... di mímọ́’ mọ́.
