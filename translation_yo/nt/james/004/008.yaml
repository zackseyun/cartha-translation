  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: àwọn àṣẹ ọ̀pọ̀ ènìyàn mẹ́ta náà wà ní kedere, ìfarakanra “Ẹ sún mọ́ ... òun yóò sì sún mọ́” sì pa ìfararora ọ̀rọ̀-ìṣe ἐγγίζω mọ́. ‘Ọwọ́’ àti ‘ọkàn’ pa àwòrán ìwẹ̀nùmọ́ ìta àti inú mọ́, nígbà tí ìpè sí àwọn ẹlẹ́ṣẹ̀ àti àwọn tí ìfaramọ́ wọn pín kò dín kù.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó rọrùn, tí tónì rẹ̀ sì pé. ‘Ẹ wẹ ọwọ́ yín mọ́’ àti ‘ẹ sọ ọkàn yín di mímọ́’ jẹ́ ọ̀nà àdánidá fún àwọn àṣẹ wọ̀nyí. ‘Ẹ̀yin tí ọkàn yín pín sí méjì’ ṣàlàyé δίψυχοι ní kedere láìsọ ọ́ di àlàyé gígùn.
  terminology: ‘Ọlọ́run,’ ‘ẹlẹ́ṣẹ̀,’ ‘ọwọ́,’ ‘ọkàn,’ àti ‘mímọ́’ bá ìforúkọsílẹ̀ ìwé mímọ́ Yorùbá àti ìtumọ̀ àkóónú Gíríìkì mu. Àlàyé ìsàlẹ̀ ‘olókàn méjì’ dára gẹ́gẹ́ bí àṣàyàn tó sún mọ́ àwòrán ‘two-souled,’ ó sì ṣàlàyé ìpín ìfaramọ́ láìfi ẹ̀kọ́ ìjọ kún un.
