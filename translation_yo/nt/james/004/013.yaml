id: JAS.4.13
reference: James 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: yo
  text: Ẹ gbọ́ ná, ẹ̀yin tí ń sọ pé, “Lónìí tàbí lọ́la, a ó lọ sí ìlú yìí[a], a ó lo ọdún kan níbẹ̀, a ó ṣe òwò, a ó sì jèrè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní ọ̀nà àdánidá pé, “sí ìlú báyìí-báyìí.” Ọ̀rọ̀ Giriki náà sọ pé “ìlú yìí,” ó sì lo atọ́ka fún ìlú pàtó kan nínú ètò àwọn olùsọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Ẹ gbọ́ ná
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà fífi pe àfiyèsí àwọn olùgbọ́ kí a tó bá wọn wí. “Ẹ gbọ́ ná” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtọ́kasí tààrà àti agbára ìkìlọ̀ náà mọ́.
- source_word: οἱ λέγοντες
  choice: ẹ̀yin tí ń sọ pé
  rationale: Ọ̀rọ̀-orúkọ aláìṣe yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ìpè tààrà sí àwọn tí Jákọ́bù ń bá sọ̀rọ̀; “ẹ̀yin” mú ìtọ́kasí yẹn hàn kedere.
- source_word: Σήμερον ἢ αὔριον
  choice: Lónìí tàbí lọ́la
  rationale: ἤ jẹ́ àsopọ̀ àṣàyàn, nítorí náà “tàbí” pa ìtumọ̀ orísun mọ́.
- source_word: πορευσόμεθα
  choice: a ó lọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí lílọ ní àyíká ọ̀rọ̀ yìí; “a ó lọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọjọ́ iwájú mu.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: sí ìlú yìí
  rationale: “Sí” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò lọ sí ibì kan, “yìí” sì pa atọ́ka sí ìlú pàtó kan nínú ètò àwọn olùsọ̀rọ̀ mọ́.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: a ó lo ọdún kan níbẹ̀
  rationale: ποιέω pẹ̀lú àkókò níbí jẹ́ àṣàmúlò tí ó túmọ̀ sí lílo àkókò kan. “Lo ọdún kan níbẹ̀” sọ ìtumọ̀ náà ní Yorùbá àdánidá.
- source_word: ἐμπορευσόμεθα
  choice: a ó ṣe òwò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ṣíṣe òwò tàbí iṣẹ́ okòwò; “ṣe òwò” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye.
- source_word: κερδήσομεν
  choice: a ó sì jèrè
  rationale: Nínú àyíká òwò yìí, κερδαίνω ń tọ́ka sí èrè owó. “Jèrè” mú ìtumọ̀ okòwò náà jáde láìfi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ohùn ìbáwí tààrà sí àwọn olùgbọ́
  choice: “ẹ̀yin tí ń sọ pé” gẹ́gẹ́ bí ọ̀rọ̀ tí a sọ tààrà sí wọn
  alternative: “àwọn tí ń sọ pé” gẹ́gẹ́ bí àpèjúwe àwọn ẹlòmíràn
  rationale: Ọ̀rọ̀ Giriki náà ń ṣiṣẹ́ bí ìpè tààrà. Yíyan “ẹ̀yin” pa agbára ìbáwí Jákọ́bù mọ́, láìsọ ọ́ di àlàyé nípa ẹgbẹ́ tí kò sí níwájú.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé navin; “Ẹ gbọ́ ná” mú ìkìlọ̀ ìbẹ̀rẹ̀ náà dun bí èdè Yorùbá àdánidá, nígbà tí ìtẹ̀sí ọjọ́ iwájú “a ó” pa ìgboyà aláìní ìrẹ̀lẹ̀ inú ètò àwọn olùsọ̀rọ̀ mọ́.
