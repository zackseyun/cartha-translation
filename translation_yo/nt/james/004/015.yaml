id: JAS.4.15
reference: James 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: yo
  text: Kàkà bẹ́ẹ̀[a], ẹ yẹ kí ẹ sọ pé, “Bí Olúwa bá fẹ́, a ó wà láàyè, a ó sì ṣe èyí tàbí èyẹn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó túbọ̀ tààrà, “dípò kí ẹ sọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Kàkà bẹ́ẹ̀, ó yẹ kí ẹ máa sọ
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ‘dípò kí ẹ máa sọ,’ ṣùgbọ́n ìtumọ̀ yìí mú àtúnṣe tí ọ̀rọ̀ náà ń béèrè jáde ní Yorùbá àdánidá, láìfi èrò tuntun kún un.
- source_word: Ἐὰν
  choice: Bí ... bá
  rationale: Ìṣètò ‘bí ... bá’ ni ọ̀nà Yorùbá àdánidá láti fi gbé gbólóhùn oníṣ条件̀ kalẹ̀ níhìn-ín.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìbámu Yorùbá tó wọ́pọ̀ fún κύριος, ó sì pa àìdájú ẹni pàtó tí ọ̀rọ̀ náà ń tọ́ka sí mọ́.
- source_word: θελήσῃ
  choice: fẹ́
  rationale: ‘Fẹ́’ sọ ìfẹ́-inú àti ìpinnu Olúwa ní Yorùbá àdánidá; nínú àyíká yìí kò kàn túmọ̀ sí ìfẹ́ lasán.
- source_word: καὶ ζήσομεν
  choice: a ó wà láàyè
  rationale: Ó fi hàn pé ìwàláàyè wa lọ́jọ́ iwájú pàápàá sinmi lórí ìfẹ́ Olúwa.
- source_word: καὶ ποιήσομεν
  choice: a ó sì ṣe
  rationale: ‘Ṣe’ ni ìtumọ̀ tààrà tó sì gbòòrò fún ποιέω; ‘sì’ dúró fún àsopọ̀ καί ní Yorùbá tó ṣe déédé.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: èyí tàbí èyẹn
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtọ́kasí gbogbogbò sí àwọn ohun tí ènìyàn lè pète láti ṣe mọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí àti agbára ọ̀rọ̀ náà
  choice: Lo ‘Olúwa’ láìsọ pé ó jẹ́ Ọlọ́run Baba tàbí Jésù ní pàtó.
  alternative: Ọlọ́run; Olúwa Jésù
  rationale: Gíríìkì sọ ὁ κύριος nìkan. Ìtumọ̀ náà yẹ kí ó pa àìdájú yìí mọ́, nígbà tí ó ń tẹnumọ́ pé ìwàláàyè àti ètò ènìyàn wà lábẹ́ ìfẹ́ Olúwa.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμᾶς; àmì ohùn sì wà níbi tó yẹ.
