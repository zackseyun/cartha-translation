  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: yo
  text: Ẹ ń béèrè, ẹ kò sì gba, nítorí pé ẹ ń béèrè lọ́nà tí kò tọ́[a], kí ẹ lè ná a fún àwọn ìgbádùn ara yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ń béèrè lọ́nà búburú,” tàbí “pẹ̀lú èrò inú tí kò tọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ná a nínú àwọn ìgbádùn ara yín.” “Ìgbádùn” níbí tún lè ní ìtumọ̀ ìfẹ́kúfẹ̀ẹ́ tàbí ìtẹ́lọ́rùn ara ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: Ẹ ń béèrè
  rationale: Ọ̀rọ̀ náà jẹ́ ìṣe tí ń lọ lọ́wọ́, ó sì ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀. “Béèrè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìbéèrè tàbí ẹ̀bẹ̀; a kò fi “lọ́wọ́ Ọlọ́run” kún un nítorí kò sí ní gbangba nínú Gíríìkì.
- source_word: οὐ λαμβάνετε
  choice: ẹ kò sì rí gbà
  rationale: “Rí gbà” sọ ìtumọ̀ gbígba ohun tí a béèrè fún ní Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ tó wà láàárín béèrè àti gbà mọ́.
- source_word: διότι
  choice: nítorí pé
  rationale: Ó fi ìdí tí wọn kò fi rí gbà hàn ní kedere.
- source_word: κακῶς αἰτεῖσθε
  choice: ẹ ń béèrè lọ́nà tí kò tọ́
  rationale: Èyí pa ìtumọ̀ gbòòrò κακῶς mọ́ gẹ́gẹ́ bí “lọ́nà búburú/tí kò tọ́,” láì dín in kù sí èrò inú nìkan; gbólóhùn tó tẹ̀ lé ló ṣàlàyé ète búburú náà.
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí àbájáde tí a ń lépa hàn ní Yorùbá tó já geere.
- source_word: δαπανήσητε
  choice: ná a
  rationale: “Ná” jẹ́ ọ̀rọ̀ àìṣàfikún fún lílo tàbí píparí ohun kan; a kò lo “fi ṣòfò” nítorí ìyẹn yóò fi ìdájọ́ tó lágbára ju ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lọ kún un.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: sí ìgbádùn ara yín
  rationale: “Ìgbádùn ara” lè sọ pleasure àti ìfẹ́ ìtẹ́lọ́rùn ara ẹni nínú àyíká ọ̀rọ̀ yìí. “Sí” bá ọ̀rọ̀-ìṣe “ná” mu ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé Ọlọ́run ni wọ́n ń béèrè lọ́wọ́ rẹ̀
  choice: 'A fi ẹni tí wọ́n ń béèrè lọ́wọ́ rẹ̀ sílẹ̀ láì dárúkọ rẹ̀: “Ẹ ń béèrè”'
  alternative: Ẹ ń béèrè lọ́wọ́ Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí àdúrà, ṣùgbọ́n ẹsẹ yìí kò dárúkọ Ọlọ́run. Fífi í sílẹ̀ bí ó ti rí ń pa àìsọ-ní-kedere inú orísun mọ́.
- issue: Bóyá κακῶς yẹ kí ó túmọ̀ sí èrò inú búburú nìkan
  choice: “lọ́nà tí kò tọ́” nínú ọ̀rọ̀ pàtàkì
  alternative: pẹ̀lú èrò inú búburú
  rationale: κακῶς gbòòrò ju èrò inú nìkan lọ. Gbólóhùn ète tó tẹ̀ lé ló tú irú àìtọ́ náà síwájú, nítorí náà a kò yẹ kí a dín ìtumọ̀ rẹ̀ kù ṣáájú.
translation_notes:
  register: A lo Yorùbá boṣewa tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àpẹẹrẹ “Ẹ ń …” pa ẹni kejì ọ̀pọ̀ àti ìṣe tí ń lọ lọ́wọ́ mọ́. Ọ̀rọ̀ náà jẹ́ ọlọ́lá láì di àtijọ́ tàbí èdè ẹ̀kọ́ ẹ̀sìn kan pàtó.
