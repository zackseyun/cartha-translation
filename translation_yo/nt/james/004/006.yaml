revisions:
- from: Ṣùgbọ́n ó ń fúnni ní oore-ọ̀fẹ́ tí ó pọ̀ jù. Nítorí náà, ó wí pé,[a] “Ọlọ́run ń kọjú ìjà sí àwọn agbéraga, ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ fún àwọn onírẹ̀lẹ̀.”
  to: Ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ tí ó pọ̀ sí i fúnni. Nítorí náà, ó wí pé,[a] “Ọlọ́run ń tako àwọn agbéraga, ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ fún àwọn onírẹ̀lẹ̀.”
  rationale: A rọ́pò ọ̀rọ̀ ìfiwéra náà kí μείζονα má bàa dà bí superlative tàbí ìpọ̀jù. A tún lo ọ̀rọ̀ ìtakò tí ó wọ́pọ̀ nínú Yorùbá, a sì tún ọ̀nà fífi oore-ọ̀fẹ́ fúnni ṣe kí ó jẹ́ adayeba láì sọ olùgbà náà di ẹni pàtó. Àmì ìsàlẹ̀ náà dúró láti ṣàlàyé àìsọ-kókó-ọ̀rọ̀ λέγει.
