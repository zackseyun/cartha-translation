id: JAS.4.6
reference: James 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: yo
  text: Ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ tí ó pọ̀ sí i fúnni. Nítorí náà, ó wí pé,[a] “Ọlọ́run ń tako àwọn agbéraga, ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ fún àwọn onírẹ̀lẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà, Ọlọ́run wí pé,” tàbí, “Nítorí náà, Ìwé Mímọ́ wí pé.” Èdè Gíríìkì kò sọ ẹni tàbí ohun tí ó “wí” ní gbangba.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: tí ó pọ̀ jù
  rationale: Ó pa agbára ìfiwéra mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘greater’ nípa oore-ọ̀fẹ́ ní Yorùbá.
- source_word: δίδωσιν χάριν
  choice: ń fúnni ní oore-ọ̀fẹ́ / ń fi oore-ọ̀fẹ́ fún
  rationale: Ó túmọ̀ ọ̀rọ̀-ìṣe àti ohun tí a ń fún ní tààrà, ó sì pa àtúnlò χάριν mọ́ nínú ẹsẹ náà.
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí tàbí ìmọ̀ràn tí ó jáde láti inú gbólóhùn tó ṣáájú hàn ní kedere.
- source_word: λέγει
  choice: ó wí pé
  rationale: Yorùbá nílò kókó-ọ̀rọ̀ tí a sọ jáde; ‘ó’ jẹ́ arọ́pò-orúkọ tí kò sọ bóyá Ọlọ́run tàbí Ìwé Mímọ́ ni kókó-ọ̀rọ̀ náà, nígbà tí àlàyé ìsàlẹ̀ fi àìdánilójú Gíríìkì hàn.
- source_word: ὑπερηφάνοις
  choice: àwọn agbéraga
  rationale: Ó sọ àwọn ènìyàn tí ìgbéraga ń ṣàpèjúwe, ó sì bá ìtakora pẹ̀lú àwọn onírẹ̀lẹ̀ mu.
- source_word: ἀντιτάσσεται
  choice: ń kọjú ìjà sí
  rationale: Ó fi ìdíjú àti ìtakò tí ó lágbára hàn, kì í ṣe pé Ọlọ́run kàn kò fara mọ́ wọn.
- source_word: ταπεινοῖς
  choice: àwọn onírẹ̀lẹ̀
  rationale: Ó mú ìtumọ̀ ìwà ìrẹ̀lẹ̀ jáde láì fi dandan túmọ̀ sí ipò àwùjọ ẹni tí ó rẹlẹ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó pa agbára ìtakora mọ́ ní ìbẹ̀rẹ̀ ẹsẹ náà àti nínú ọ̀rọ̀ àyọkà.
theological_decisions:
- issue: Kókó-ọ̀rọ̀ tí a kò sọ jáde nínú λέγει
  choice: “ó wí pé” pẹ̀lú àlàyé ìsàlẹ̀
  alternative: “Ọlọ́run wí pé” tàbí “Ìwé Mímọ́ wí pé”
  rationale: Gíríìkì kò sọ kókó-ọ̀rọ̀ náà ní gbangba. Arọ́pò-orúkọ ‘ó’ àti àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́, wọn kò sì yan Ọlọ́run tàbí Ìwé Mímọ́ láìsí ẹ̀rí tó pé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí ọ̀rọ̀ Kristẹni tí ó wọ́pọ̀, a sì fi àmì ohùn sí ibi tí ó yẹ.
