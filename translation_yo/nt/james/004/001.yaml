  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: yo
  text: Níbo ni àwọn ogun ti ń wá, níbo sì ni àwọn ìjà láàárín yín ti ń wá?[a][b] Ṣé kì í ṣe láti inú àwọn ìgbádùn yín tí ń jagun nínú àwọn ẹ̀yà ara yín?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “ìforígbárí … awuyewuye.” Ọ̀rọ̀ Gíríìkì lò àwọn ọ̀rọ̀ ológun, ní tààrà, “ogun” àti “ìjà,” fún àwọn aáwọ̀ inú àwùjọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “nínú yín,” dípò “láàárín yín.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìjà láàárín àwọn òǹkàwé tàbí ìjà inú wọn. Gbogbo ẹsẹ náà so aáwọ̀ òde pọ̀ mọ́ ìfẹ́kúfẹ̀ẹ́ inú.
    reason: alternative_reading
  - marker: c
    text: “Àwọn ẹ̀yà ara” ni ìtumọ̀ tààrà; ó lè tọ́ka sí àwọn apá ara tàbí, ní ìtumọ̀ tó gbòòrò, sí àwọn agbára inú ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Ibo ni ... ti ń wá
  rationale: Ó pa ìbéèrè nípa orísun mọ́, ó sì tún un ṣe lẹ́ẹ̀mejì gẹ́gẹ́ bí èdè Gíríìkì, ní ọ̀nà tí ó bá èdè Yorùbá òde òní mu.
- source_word: πόλεμοι
  choice: àwọn ogun
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ náà, ó sì pa àwòrán ológun tí Jákọ́bù lò fún ìforígbárí inú àwùjọ mọ́.
- source_word: μάχαι
  choice: àwọn ìjà
  rationale: “Ìjà” yàtọ̀ sí “ogun,” ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìjà tàbí awuyewuye tó le.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ní ibi yìí, gbólóhùn náà tọ́ka ní pàtàkì sí ìjà tó wà láàárín àwọn ọmọ ìjọ, bí ó tilẹ̀ jẹ́ pé a fi àṣàyàn “nínú yín” sínú àlàyé ìsàlẹ̀.
- source_word: οὐκ ἐντεῦθεν
  choice: Ṣé kì í ṣe láti ibí
  rationale: Ó mú ìbéèrè àsọyé tí ó ń retí ìdáhùn bẹ́ẹ̀ ni jáde, ó sì tọ́ka sí orísun tí gbólóhùn tó tẹ̀ lé e máa ṣàlàyé.
- source_word: ἡδονῶν
  choice: àwọn ìgbádùn yín
  rationale: “Ìgbádùn” fi ìtumọ̀ pleasure hàn ní tààrà, ó sì pa ìsọ̀rí ẹni tí àwọn ìgbádùn ń “jagun” mọ́; ó lè ní ìtumọ̀ ìgbádùn ara ẹni tí kò ní ìjánu nínú àyíká yìí.
- source_word: στρατευομένων
  choice: tí ń jagun
  rationale: Ó pa àwòrán ológun àti ìṣe tó ń bá a lọ mọ́, ó sì tún ìró “ogun” tó wà ní ìbẹ̀rẹ̀ ẹsẹ náà sọ.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: nínú àwọn ẹ̀yà ara yín
  rationale: Ó pa àwòrán ti μέλη gẹ́gẹ́ bí àwọn ẹ̀yà ara mọ́, láì fi tipátipá pinnu bóyá ó túmọ̀ sí àwọn ẹ̀yà ara gan-an tàbí agbára àti ìfẹ́ tó ń ṣiṣẹ́ nínú ènìyàn.
theological_decisions:
- issue: Bóyá àwọn ìjà ìbẹ̀rẹ̀ ẹsẹ náà jẹ́ ìforígbárí inú ọkàn nìkan tàbí ìjà láàárín àwọn ènìyàn
  choice: A túmọ̀ ἐν ὑμῖν sí “láàárín yín,” a sì fi gbólóhùn tó kẹ́yìn sílẹ̀ gẹ́gẹ́ bí “nínú àwọn ẹ̀yà ara yín.”
  alternative: A lè túmọ̀ àkọ́kọ́ sí “nínú yín,” tàbí túmọ̀ èyí tó kẹ́yìn ní ṣókí sí “nínú yín.”
  rationale: Ọ̀rọ̀ Jákọ́bù so ìjà tó hàn níta láàárín àwùjọ pọ̀ mọ́ ìgbádùn tàbí ìfẹ́ inú ènìyàn. Ìtumọ̀ yìí pa apá méjèèjì àti ìfọ̀rọ̀wérọ̀ tó wà láàárín wọn mọ́.
translation_notes:
  register: A lo èdè Yorùbá àtijọ́-kò-jù, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe Πόθεν lẹ́ẹ̀mejì àti àwòrán ológun ni a pa mọ́, ṣùgbọ́n ìṣètò gbólóhùn jẹ́ ti Yorùbá àdánidá.
