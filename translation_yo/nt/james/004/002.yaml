  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì àwọn ọ̀rọ̀ Gíríìkì náà dáadáa: ìfẹ́kúfẹ̀ẹ́ tí kò rí ìtẹ́lọ́rùn, pípa ènìyàn, ìlara, àìlè rí ohun tí a fẹ́ gbà, ìjà àti ogun, àti àìní tí ó wá nítorí àìbéèrè. Ṣùgbọ́n ‘ṣùgbọ́n’ nínú gbólóhùn kejì ń sọ καί di ìyàtọ̀/alátakò, níbi tí ọ̀rọ̀ Gíríìkì ti ń so àwọn ìṣe wọ̀nyí pọ̀ lásán. A tún ṣàtúnṣe ọ̀rọ̀ ìsàlẹ̀ d kí ó bá olùgbọ́ ‘ẹ’ mu.'
