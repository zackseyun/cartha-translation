id: JAS.4.2
reference: James 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: yo
  text: Ẹ ń fẹ́ ohun kan, ẹ kò sì ní i[a]; ẹ ń paniyan[b], ẹ sì ń ṣe ìlara[c], ẹ sì kò lè rí ohun náà gbà; ẹ ń jà, ẹ sì ń jagun. Ẹ kò ní nítorí pé ẹ kò béèrè[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ ń ṣe ojúkòkòrò.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìfẹ́ tó lágbára, tí ó sábà máa ń jẹ́ ìfẹ́ tí kò tọ́ nínú àyíká bí èyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ ń pa ènìyàn.” Ọ̀rọ̀ Gíríìkì sábà máa ń túmọ̀ sí pípa ènìyàn lọ́nà ẹ̀ṣẹ̀ ní pàtó. Àwọn kan ka ọ̀rọ̀ yìí sí àsọdùn, ṣùgbọ́n ìtumọ̀ náà pa agbára ọ̀rọ̀ orísun mọ́.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹ ń jowú.”
    reason: lexical_alternative
  - marker: d
    text: Àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni ẹni tí ẹ ń béèrè lọ́wọ́, bí ó tilẹ̀ jẹ́ pé ẹsẹ̀ Gíríìkì yìí kò sọ ọ́ ní tààrà.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: Ẹ ń fẹ́ ohun kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìfẹ́ tó lágbára, èyí tí àyíká ọ̀rọ̀ fi hàn pé kò tọ́. Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, kò sì fi ìtumọ̀ ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ kún un.
- source_word: ἔχετε
  choice: ẹ kò sì ní i
  rationale: Èyí túmọ̀ ἔχω ní ọ̀nà tó rọrùn, tó sì wọ́pọ̀ nínú Yorùbá.
- source_word: φονεύετε
  choice: ẹ ń paniyan
  rationale: φονεύω sábà máa ń tọ́ka sí pípa ènìyàn lọ́nà ẹ̀ṣẹ̀, kì í ṣe pípa lásán; ‘paniyan’ pa agbára ìtumọ̀ náà mọ́.
- source_word: ζηλοῦτε
  choice: ẹ sì ń ṣe ìlara
  rationale: Nínú àyíká ìfẹ́ tí kò rí ìtẹ́lọ́rùn àti ìjà, ζηλόω ní ìtumọ̀ odi pé kí ènìyàn máa ṣe ìlara.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: ẹ kò lè rí ohun náà gbà
  rationale: Gbólóhùn Yorùbá yìí sọ àìlè dé ọ̀dọ̀ tàbí gba ohun tí wọ́n ń fẹ́, ó sì jẹ́ èdè àdánidá.
- source_word: μάχεσθε
  choice: ẹ ń jà
  rationale: ‘Ń jà’ lè sọ ìforígbárí tàbí ìjà ní kíkún, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πολεμεῖτε
  choice: ẹ sì ń jagun
  rationale: ‘Ń jagun’ lágbára ju ‘ń jà’ lọ, ó sì pa ìgbéga tó wà láàárín μάχεσθε àti πολεμεῖτε mọ́.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: nítorí pé ẹ kò béèrè
  rationale: διά pẹ̀lú infinitive oní-artíkù ń fi okùnfà hàn. ‘Nítorí pé’ sọ èyí ní Yorùbá àdánidá, a kò sì fi ẹni tí wọ́n ń béèrè lọ́wọ́ kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá kí a dín agbára φονεύετε kù tàbí kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí àkàwé
  choice: A lo ‘ẹ ń paniyan’ nínú ẹsẹ̀ pàtàkì.
  alternative: ẹ ń pa ènìyàn; ẹ ń paniyan nínú ọkàn yín
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lágbára. Bóyá ọ̀rọ̀ àsọdùn tàbí àkàwé ni, ìtumọ̀ ẹsẹ̀ ni ìyẹn, kì í ṣe ohun tó yẹ kí a fi rọ́pò ìtumọ̀ gangan.
- issue: Bóyá kí a fi Ọlọ́run hàn gbangba gẹ́gẹ́ bí ẹni tí a ń béèrè lọ́wọ́
  choice: 'A fi ẹni tí wọ́n ń béèrè lọ́wọ́ sílẹ̀ ní àfojúsùn: ‘ẹ kò béèrè.’'
  alternative: ẹ kò béèrè lọ́wọ́ Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí wọ́n ń béèrè lọ́wọ́, ṣùgbọ́n ẹsẹ̀ Gíríìkì yìí kò dárúkọ rẹ̀. Ìtumọ̀ náà pa àfojúsùn yìí mọ́ láìfi ọ̀rọ̀ kún orísun.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn ọ̀rọ̀ ‘ń jà’ àti ‘ń jagun’ pa ìlọsíwájú agbára àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́; a kò sọ ohun tó jẹ́ àfojúsùn nínú orísun di ohun tí a sọ gbangba.
