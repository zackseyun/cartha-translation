id: JAS.4.11
reference: James 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: yo
  text: Ẹ má ṣe sọ̀rọ̀ lòdì sí ara yín[a], ẹ̀yin arákùnrin[b]. Ẹni tí ó bá ń sọ̀rọ̀ lòdì sí arákùnrin kan tàbí tí ó ń dá arákùnrin rẹ̀ lẹ́jọ́ ń sọ̀rọ̀ lòdì sí òfin, ó sì ń dá òfin lẹ́jọ́. Ṣùgbọ́n bí ìwọ bá ń dá òfin lẹ́jọ́, ìwọ kì í ṣe olùṣe òfin, bí kò ṣe onídàájọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe ba ara yín lórúkọ jẹ́”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí sísọ̀rọ̀ lòdì sí ẹnì kan lọ́nà tí ń ba orúkọ rẹ̀ jẹ́.
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” níbí jẹ́ ọ̀rọ̀ akọ ọ̀pọ̀ nínú Gíríìkì, ó sì ṣeé ṣe kí ó ń bá gbogbo ìjọ sọ̀rọ̀, ìyẹn àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: sọ̀rọ̀ lòdì sí
  rationale: Ó túmọ̀ sí sísọ̀rọ̀ sí ẹnì kan lọ́nà ọ̀tá tàbí tí ń ba orúkọ rẹ̀ jẹ́. Yíyan ọ̀rọ̀ yìí pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìtumọ̀ mọ́ sí ìbanilórúkọjẹ́ nìkan.
- source_word: ἀλλήλων
  choice: ara yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìṣe tí àwọn ọmọ ẹgbẹ́ ń ṣe sí ara wọn.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa ìrísí akọ ọ̀pọ̀ nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí gbogbo ìjọ, ọkùnrin àti obìnrin, wà nínú àkọlé náà.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin kan / arákùnrin rẹ̀
  rationale: Ó pa àpẹẹrẹ ìdílé tí Jákọ́bù lò mọ́, ó sì yẹra fún fífi ìtumọ̀ àlàyé bí ‘onígbàgbọ́ ẹlẹgbẹ́’ sínú ẹsẹ̀.
- source_word: ἢ
  choice: tàbí
  rationale: 'Ó fi àwọn ìṣe méjèèjì hàn gẹ́gẹ́ bí ohun méjì tí ó jọra: sísọ̀rọ̀ lòdì sí arákùnrin tàbí dídá a lẹ́jọ́.'
- source_word: κρίνων / κρίνει / κρίνεις
  choice: dá ... lẹ́jọ́
  rationale: Èyí pa àtúnwí ọ̀rọ̀ náà mọ́ ní gbogbo ẹsẹ̀, kò sì dín ìtumọ̀ rẹ̀ kù sí dídálẹ́bi nìkan.
- source_word: νόμου / νόμον
  choice: òfin
  rationale: Yorùbá kò nílò atúmọ̀ pàtó bí ti Gẹ̀ẹ́sì níbí. Ọ̀rọ̀ náà dúró ní fífẹ̀ láì sọ pé òfin Mósè, òfin ọba, tàbí òfin Ọlọ́run ní pàtó.
- source_word: ποιητὴς
  choice: olùṣe
  rationale: Ó jẹ́ ọ̀rọ̀ kúkúrú tí ó pa ìyàtọ̀ Jákọ́bù láàárín ẹni tí ń ṣe òfin àti ẹni tí ń dá a lẹ́jọ́ mọ́.
- source_word: κριτής
  choice: onídàájọ́
  rationale: Ó jẹ́ orúkọ ẹni tí ń ṣe ìdájọ́, ó sì mú ìtakora pẹ̀lú ‘olùṣe’ hàn kedere.
theological_decisions:
- issue: Ààlà àwọn tí ἀδελφοί ń tọ́ka sí nínú ìjọ
  choice: Fi ‘ẹ̀yin arákùnrin’ sínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì sọ pé ó ṣeé ṣe kí ó kan arákùnrin àti arábìnrin.
  alternative: ẹ̀yin arákùnrin àti arábìnrin / ẹ̀yin ọmọ ìdílé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ọ̀pọ̀, ṣùgbọ́n ní àyíká yìí ó ṣeé ṣe kí ó dúró fún gbogbo àwùjọ onígbàgbọ́. Ìtumọ̀ náà pa ìrísí orísun mọ́, àlàyé sì dáàbò bo ìtumọ̀ àkópọ̀.
- issue: Ohun tí ‘òfin’ ń tọ́ka sí
  choice: Lo ‘òfin’ láì fi àlàyé pàtó kún un nínú ọ̀rọ̀ pàtàkì.
  alternative: òfin Mósè / òfin ọba / òfin Ọlọ́run
  rationale: Ó ṣeé ṣe kí Jákọ́bù ń tọ́ka sí ìtọ́ni Ọlọ́run tí lẹ́tà náà ti sọ tẹ́lẹ̀, pàápàá òfin ìfẹ́ aládùúgbò; síbẹ̀ ẹsẹ̀ yìí kò sọ ọ́ di pàtó, nítorí náà a pa fífẹ̀ ìtumọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, tí ó sì yé òǹkàwé òde òní. A lo ‘sọ̀rọ̀ lòdì sí’ láti pa àtúnwí orísun mọ́, àti ‘dá ... lẹ́jọ́’ fún gbogbo ìfarahàn κρίνω.
