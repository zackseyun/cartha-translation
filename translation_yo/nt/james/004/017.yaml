base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: yo
  text: Nítorí náà[a], ẹni tí ó mọ̀ pé ohun rere ni ó yẹ kí ó ṣe, tí kò sì ṣe é, ó jẹ́ ẹ̀ṣẹ̀ fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà, ẹni tí ó mọ̀ ohun rere láti ṣe, tí kò sì ṣe é, ẹ̀ṣẹ̀ ni fún un.”
    reason: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ìtumọ̀ ní ṣókí gẹ́gẹ́ bí “mọ̀ ohun rere láti ṣe”; ìtumọ̀ inú ẹsẹ̀ náà ni pé ẹni náà mọ ohun rere tí ó yẹ kí ó ṣe.
lexical_decisions:
- source_word: εἰδότι
  choice: ẹni tí ó mọ̀
  rationale: Aorist-like perfect-form participle of οἶδα is dative singular and functions substantivally. “Ẹni tí ó mọ̀” preserves its generic singular personal reference naturally in Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: This marks an inference from the preceding discussion; “Nítorí náà” clearly and naturally preserves that logical connection.
- source_word: καλὸν
  choice: rere
  rationale: Here καλόν denotes what is morally good or right. “Rere” retains the broad ethical sense without restricting it to one particular duty.
- source_word: ποιεῖν
  choice: láti ṣe
  rationale: The infinitive combines with καλόν in the sense of doing what is good. “Láti ṣe” is direct and idiomatic.
- source_word: μὴ ποιοῦντι
  choice: tí kò sì ṣe é
  rationale: This contrasts knowledge of the good with failure to act. The pronoun “é” naturally supplies the understood object in Yorùbá while “sì” marks the contrast.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: The anarthrous predicate identifies the omission as sin. The unqualified Yorùbá noun “ẹ̀ṣẹ̀” preserves the qualitative force without unnecessarily rendering it as one discrete sinful act.
- source_word: αὐτῷ
  choice: fún un
  rationale: The dative expresses reference to the person concerned. “Fún un” is natural Yorùbá and preserves the personal application.
- source_word: ἐστιν
  choice: ni
  rationale: The Yorùbá focus/copular construction “ẹ̀ṣẹ̀ ni fún un” naturally links the knowingly omitted good with the predicate “sin.”
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ nípa rere tí ẹni kan mọ̀ ṣùgbọ́n tí kò ṣe
  choice: Ẹsẹ̀ náà sọ pé bí ẹni kan bá mọ rere tí ó yẹ kí ó ṣe, tí kò sì ṣe é, ẹ̀ṣẹ̀ ni fún un; a kò fi ọ̀rọ̀ náà mọ́ ètò ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
  alternative: Kí a fi ẹsẹ̀ náà mọ́ ọ̀rọ̀ ìṣètò ìgbésí ayé pẹ̀lú ìgbéraga nìkan, tàbí kí a sọ ọ́ di ìlànà ẹ̀kọ́ nípa gbogbo ẹ̀ṣẹ̀ àìṣe rere.
  rationale: Àyíká ẹsẹ̀ náà ń sọ nípa ètò tí ènìyàn ń ṣe pẹ̀lú ìgbéraga láìka Olúwa sí, ṣùgbọ́n gbólóhùn Gíríìkì náà gbooro. Ìtumọ̀ yìí pa ìbáṣepọ̀ rẹ̀ mọ́ àyíká rẹ̀ mọ́, ó sì tún jẹ́ kí ìlànà ìwà rere tó gbooro inú rẹ̀ dúró láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ kúkúrú, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹni” gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ tí kò fi akọ tàbí abo kan pàtó sí i.
