id: JAS.4.9
reference: James 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: yo
  text: Ẹ jìyà[a], ẹ ṣọ̀fọ̀, kí ẹ sì sọkún. Kí ẹ̀rín yín yí padà sí ọ̀fọ̀, kí ayọ̀ yín sì yí padà sí ìrẹ̀wẹ̀sì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ wà nínú ìbànújẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí jíjẹ́ nínú ìpọ́njú tàbí ìbànújẹ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìbànújẹ́ ìtẹ̀ríba.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò ìbànújẹ́ àti ìrẹ̀wẹ̀sì tí ojú ẹni rẹ̀wẹ̀sì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Ẹ wà nínú ìbànújẹ́
  rationale: Àṣẹ náà ń ké sí wọn láti mọ ìpọ́njú àti ìbànújẹ́ tó yẹ fún ìrònúpìwàdà. Èyí jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì yàtọ̀ díẹ̀ sí àwọn ọ̀rọ̀ tó tẹ̀ lé e, ‘ẹ ṣọ̀fọ̀’ àti ‘ẹ sọkún.’
- source_word: πενθήσατε
  choice: ẹ ṣọ̀fọ̀
  rationale: ‘Ṣọ̀fọ̀’ fi ìbànújẹ́ jíjinlẹ̀ hàn, ó sì bá agbára ọ̀rọ̀ ìrònúpìwàdà inú àyíká ẹsẹ náà mu.
- source_word: κλαύσατε
  choice: kí ẹ sì sọkún
  rationale: ‘Sọkún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹkún, ó sì pa ìlọsíwájú láti inú ìbànújẹ́ sí ọ̀fọ̀ àti ẹkún mọ́.
- source_word: ὁ γέλως ὑμῶν εἰς πένθος μετατραπήτω
  choice: Kí ẹ̀rín yín yí padà sí ọ̀fọ̀
  rationale: Ìtumọ̀ yìí pa àwòrán ìyípadà láti inú ẹ̀rín sí ọ̀fọ̀ mọ́, ó sì fi àṣẹ ẹni kẹta tó wà nínú Gíríìkì hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἡ χαρὰ εἰς κατήφειαν
  choice: kí ayọ̀ yín sì yí padà sí ìrẹ̀wẹ̀sì
  rationale: ‘Ìrẹ̀wẹ̀sì’ lè sọ ipò ẹni tí inú rẹ̀ rẹ̀ sílẹ̀, tí ojú rẹ̀ sì rẹ̀wẹ̀sì. A mú ‘yín’ wọ inú gbólóhùn kejì gẹ́gẹ́ bí ìṣọ̀kan àfiwé tó ṣe kedere nínú Gíríìkì.
theological_decisions:
- issue: Agbára ìpè sí ìrònúpìwàdà
  choice: A pa gbogbo àwọn àṣẹ náà mọ́ gẹ́gẹ́ bí ìpè líle sí ìbànújẹ́ àti ìrẹ̀lẹ̀ níwájú Ọlọ́run.
  alternative: Kí a rọ ọ̀rọ̀ náà sí ìkìlọ̀ lásán pé kí wọn ṣe pàtàkì tàbí kí wọ́n má ṣe yọ̀ jù.
  rationale: Nínú àyíká Jákọ́bù 4:6–10, ọ̀rọ̀ náà ń ké sí ìrònúpìwàdà onírẹ̀lẹ̀; kò yẹ kí ìtumọ̀ dín agbára àwọn àṣẹ náà kù, bẹ́ẹ̀ ni kò yẹ kí ó fi ẹ̀kọ́ àfikún tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, líle, ó sì ṣeé lóye fún òǹkàwé lásán; a yẹra fún ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
