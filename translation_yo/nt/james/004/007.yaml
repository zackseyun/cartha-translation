id: JAS.4.7
reference: James 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: yo
  text: Nítorí náà, ẹ fi ara yín sábẹ́ àṣẹ Ọlọ́run[a]. Ṣùgbọ́n ẹ dojú kọ Èṣù, yóò sì sá kúrò lọ́dọ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ tẹríba fún Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: ẹ fi ara yín sábẹ́ àṣẹ
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn olùgbọ́ púpọ̀ láti fi tinútinú gba ipò lábẹ́ Ọlọ́run. Àfikún “àṣẹ” mú ìtumọ̀ ìbámu sábẹ́ ẹni tó ní ọlá-àṣẹ ṣe kedere ní Yorùbá láìyí agbára ọ̀rọ̀ Gíríìkì padà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú mọ́ pẹ̀lú ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti fi ìyọrísí hàn ní Yorùbá.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Ó jẹ́ ẹni tí ὑποτάγητε ń tọ́ka sí; “sábẹ́ àṣẹ Ọlọ́run” jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἀντίστητε
  choice: ẹ dojú kọ
  rationale: Ó sọ ìdúró lòdì sí ọ̀tá ní ṣókí, ó sì jẹ́ èdè Yorùbá òde òní tí àwọn ènìyàn lóye.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín fífi ara ẹni sábẹ́ Ọlọ́run àti dídúró lòdì sí Èṣù hàn.
- source_word: τῷ διαβόλῳ
  choice: Èṣù
  rationale: Nínú àyíká yìí διάβολος jẹ́ orúkọ ọ̀tá ẹ̀mí kan pàtó; “Èṣù” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún un.
- source_word: καὶ
  choice: yóò sì
  rationale: “sì” so àṣẹ náà mọ́ àbájáde tí a ṣèlérí ní ọ̀nà àdánidá.
- source_word: φεύξεται
  choice: yóò sá
  rationale: Ó pa ọjọ́ iwájú àti ìtumọ̀ fífi ojú ogun sá mọ́.
- source_word: ἀφ’ ὑμῶν
  choice: kúrò lọ́dọ̀ yín
  rationale: Ó sọ ìṣípò kúrò níbi àwọn olùgbọ́ púpọ̀ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ διάβολος
  choice: Èṣù gẹ́gẹ́ bí ọ̀tá ẹ̀mí tó jẹ́ ẹnìkan
  alternative: asọ̀rọ̀-èké tàbí agbára ibi lásán
  rationale: Àpilẹ̀kọ ọ̀rọ̀ Gíríìkì àti àyíká ìjà ẹ̀mí fi hàn pé ọ̀tá kan pàtó ni a ń tọ́ka sí, kì í ṣe agbára ibi tí kò ní ìwà-ẹni.
- issue: Ìbáṣepọ̀ láàárín àṣẹ àti àbájáde
  choice: Àṣẹ láti dojú kọ Èṣù, lẹ́yìn náà ìlérí pé yóò sá
  alternative: Kí a túmọ̀ καὶ bí “nígbà náà” láti mú ìtẹ̀lé náà le sí i
  rationale: “sì” pa ìsopọ̀ Gíríìkì tó rọrùn mọ́ láìfi ìtumọ̀ ìtẹ̀lé tó lágbára ju ti orísun lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ fún ọ̀pọ̀ ènìyàn (“ẹ … yín”), gẹ́gẹ́ bí fọ́ọ̀mù Gíríìkì ṣe rí. Àmì ohùn ni a fi sí ibi tí ó yẹ.
