revisions:
- from: Olùfúnni ní òfin àti onídàájọ́ kan ṣoṣo ni ó wà—ẹni tí ó lè gbà là, tí ó sì lè pa run. Ṣùgbọ́n ìwọ, ta ni ọ́—ìwọ tí ń dá ẹni ẹlẹgbẹ́ rẹ lẹ́jọ́?
  to: Ẹni kan ṣoṣo ló jẹ́ Olùfúnni ní òfin àti Onídàájọ́, ẹni tí ó lè gbà là, tí ó sì lè pa run. Ṣùgbọ́n ta ni ìwọ tí ń dá ẹni ẹlẹgbẹ́ rẹ lẹ́jọ́?
  rationale: The revision preserves the source’s singular predication, its two coordinated titles, and the participial force of “the one judging,” while using smoother Standard Yorùbá syntax. It does not supply “Ọlọ́run,” narrow πλησίον to a physical neighbor, or resolve “destroy” beyond its stated wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:15:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the singular Lawgiver-and-Judge, the paired capacities “to save and to destroy,” and the final rhetorical question. However, its opening word order is somewhat calqued and less idiomatic than a construction that makes the singular subject explicit.
  naturalness: “Olùfúnni ní òfin àti onídàájọ́ kan ṣoṣo ni ó wà” is understandable, but “Ẹni kan ṣoṣo ló jẹ́ ...” is more natural, direct Standard Yorùbá. The revised final question also avoids the somewhat heavy repeated “ìwọ.”
  terminology: “Olùfúnni ní òfin” accurately renders νομοθέτης without adding the explicit name of God. “Onídàájọ́,” “gbà là,” and “pa run” suitably preserve the source sense. “ẹni ẹlẹgbẹ́ rẹ” is retained as a broad, relational rendering of πλησίον rather than restricting it to a residential neighbor.
  issues:
  - severity: low
    issue: Opening clause has marked, less natural word order.
    rationale: Although grammatically intelligible, placing “kan ṣoṣo” after the paired titles and using “ni ó wà” sounds more like a literal structural imitation than idiomatic modern Yorùbá. A singular-subject construction better carries εἷς ἐστιν.
  - severity: low
    issue: The final question unnecessarily repeats “ìwọ.”
    rationale: The Greek uses an emphatic pronoun followed by a substantival participial description; Yorùbá can express this naturally with one pronoun and a relative clause, without loss of the ongoing judging sense.
  revised_text: Ẹni kan ṣoṣo ló jẹ́ Olùfúnni ní òfin àti Onídàájọ́, ẹni tí ó lè gbà là, tí ó sì lè pa run. Ṣùgbọ́n ta ni ìwọ tí ń dá ẹni ẹlẹgbẹ́ rẹ lẹ́jọ́?
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s singular predication, its two coordinated titles, and the participial force of “the one judging,” while using smoother Standard Yorùbá syntax. It does not supply “Ọlọ́run,” narrow πλησίον to a physical neighbor, or resolve “destroy” beyond its stated wording.
