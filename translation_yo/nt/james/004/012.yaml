id: JAS.4.12
reference: James 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: yo
  text: Ẹni kan ṣoṣo ló jẹ́ Olùfúnni ní òfin àti Onídàájọ́, ẹni tí ó lè gbà là, tí ó sì lè pa run. Ṣùgbọ́n ta ni ìwọ tí ń dá ẹni ẹlẹgbẹ́ rẹ lẹ́jọ́?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Olùfúnni ní òfin
  rationale: Ó túmọ̀ sí ẹni tí ń fi òfin lélẹ̀ tàbí tí ń fúnni ní òfin; gbólóhùn yìí ṣe kedere sí òǹkàwé òde òní ju ọ̀rọ̀ àkójọpọ̀ kan lọ.
- source_word: κριτής / ὁ κρίνων
  choice: onídàájọ́ / ìwọ tí ń dá ... lẹ́jọ́
  rationale: A fi ìyàtọ̀ tó wà láàárín orúkọ oyè ‘onídàájọ́’ àti iṣẹ́ alábápín àkókò ‘ẹni tí ń dájọ́’ hàn; ‘tí ń’ tún pa ìṣe tó ń lọ mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: σῶσαι
  choice: gbà là
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìgbàlà tàbí yíyan ẹni kúrò nínú ewu, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
- source_word: ἀπολέσαι
  choice: pa run
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́, èyí tí ó lè túmọ̀ sí píparun tàbí pípa ẹni run.
- source_word: πλησίον
  choice: ẹni ẹlẹgbẹ́ rẹ
  rationale: Ó gbòòrò ju ‘aládùúgbò’ ní ìtumọ̀ ibi gbígbé lọ, ó sì lè tọ́ka sí ẹnì kejì tàbí ẹni ọ̀dọ̀ ẹni gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ta ni ‘Olùfúnni ní òfin àti onídàájọ́’ ń tọ́ka sí?
  choice: A kò fi orúkọ ‘Ọlọ́run’ kún un, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí i ní kedere nínú àyíká.
  alternative: ‘Ọlọ́run nìkan ni Olùfúnni ní òfin àti Onídàájọ́.’
  rationale: Orísun Gíríìkì kò sọ orúkọ Ọlọ́run ní tààràtà; títẹ̀lé ìsọ̀rí rẹ̀ ń pa ìtẹnumọ́ àti àkíyèsí rẹ̀ mọ́ láìṣe àlàyé sínú ẹsẹ̀.
- issue: Ìbáṣepọ̀ ‘kan ṣoṣo’ pẹ̀lú àwọn oyè méjèèjì
  choice: A mú un gẹ́gẹ́ bí ẹni kan ṣoṣo tó jẹ́ mejeeji olùfúnni ní òfin àti onídàájọ́.
  alternative: Kí a ya ‘olùfúnni ní òfin’ àti ‘onídàájọ́’ sí ẹni méjì.
  rationale: εἷς àti ìṣọ̀kan gbólóhùn Gíríìkì fi hàn pé ẹni kan ṣoṣo ló ru àwọn ipò méjèèjì.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. Àmì gígùn náà ń mú ìtẹnumọ́ ìbéèrè ìkẹyìn hàn, ó sì pa àkópọ̀ alábápín Gíríìkì ‘ìwọ tí ń dá ... lẹ́jọ́’ mọ́.
