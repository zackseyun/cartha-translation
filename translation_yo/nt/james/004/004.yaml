  source_fidelity: 'Àkọsílẹ̀ náà mú ọ̀pọ̀ nǹkan Gíríìkì náà dáadáa: ìpè abo ọ̀pọ̀ μοιχαλίδες, ìbéèrè àròsọ, ìfararọ φιλία/φίλος, ìtumọ̀ κόσμος gẹ́gẹ́ bí “ayé,” àti ìtakora ọ̀rẹ́ ayé sí ọ̀tá Ọlọ́run. Síbẹ̀, “ó sọ ara rẹ̀ di” gbé ìṣe ìfìfẹ́-sọ́rí ẹni ga ju καθίσταται lọ; ọ̀rọ̀ náà ń sọ ipò tí ẹni náà ń wọ̀ sí (“ó di”).'
  naturalness: “Ìbádọ́rẹ̀ẹ́” kò jẹ́ ọ̀nà tó wọ́pọ̀, tó sì rọrùn jù lọ nínú Yorùbá òde òní fún “friendship.” “Ìbádọ̀rẹ̀ pẹ̀lú ayé” jẹ́ àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú “ọ̀rẹ́ ayé.” “Ẹ̀yin panṣágà” jẹ́ ìpè tó ṣókí, tó ní agbára, tí ó sì bá àkàwé Gíríìkì náà mu; fifi “obìnrin” kún un kò pọndandan.
  terminology: “Panṣágà” ń pa ọ̀rọ̀ ìpè tí ó ṣe kedere, tí ó sì ní àmì abo, mọ́ láìtú u sí àlàyé ẹ̀kọ́ ìsìn. “Ìṣọ̀tá sí Ọlọ́run,” “ayé,” “ọ̀rẹ́,” àti “ọ̀tá Ọlọ́run” yẹ, wọ́n sì bá ìlànà ọ̀rọ̀ inú ẹsẹ̀ náà mu. Àlàyé ìsàlẹ̀ nípa “ayé” àti àkàwé panṣágà tún yẹ.
