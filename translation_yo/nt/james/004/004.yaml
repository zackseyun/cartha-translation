id: JAS.4.4
reference: James 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: yo
  text: Ẹ̀yin panṣágà[a], ẹ kò mọ̀ pé ìbádọ̀rẹ̀ pẹ̀lú ayé[c] jẹ́ ìṣọ̀tá sí Ọlọ́run[b]? Nítorí náà, ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ọ̀rẹ́ ayé di ọ̀tá Ọlọ́run[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin obìnrin panṣágà.” Ó ṣeé ṣe kí ọ̀rọ̀ yìí jẹ́ àkàwé fún àìṣòótọ́ sí Ọlọ́run, bí èdè àwọn wòlíì nípa májẹ̀mú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìṣọ̀tá pẹ̀lú Ọlọ́run.”
    reason: alternative_reading
  - marker: c
    text: “Ayé” níbí ń tọ́ka sí ètò àti ìlànà ènìyàn tó lòdì sí Ọlọ́run, kì í ṣe gbogbo ìṣẹ̀dá fúnra rẹ̀.
    reason: cultural_note
  - marker: d
    text: Tàbí, “a mú un di ọ̀tá Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Ẹ̀yin obìnrin panṣágà
  rationale: Ó pa àrọ́pò-orúkọ ìpè abo ọ̀pọ̀ àti ìtumọ̀ gidi ‘àwọn obìnrin panṣágà’ mọ́, láìrọ̀ ọ́ di àlàyé nípa àìṣòótọ́ sí májẹ̀mú nínú ọ̀rọ̀ pàtàkì.
- source_word: οὐκ οἴδατε
  choice: ṣé ẹ kò mọ̀
  rationale: Ìbéèrè odi yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìbéèrè àròsọ Gíríìkì mọ́.
- source_word: φιλία
  choice: ìbádọ́rẹ̀ẹ́
  rationale: Ó túmọ̀ sí ìbáṣepọ̀ ọ̀rẹ́, ó sì bá φίλος (‘ọ̀rẹ́’) mu ní apá kejì ẹsẹ̀ náà.
- source_word: κόσμου
  choice: ayé
  rationale: ‘Ayé’ ni ìtumọ̀ Yorùbá tó ṣe déédé fún κόσμος; a kò fi àlàyé pé ètò ènìyàn tó lòdì sí Ọlọ́run sínú ọ̀rọ̀ pàtàkì.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: ìṣọ̀tá sí Ọlọ́run
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìṣọ̀tá tí a darí sí Ọlọ́run, bí àyíká ọ̀rọ̀ ṣe ń tọ́ka sí.
- source_word: ὃς ἐὰν οὖν
  choice: Nítorí náà, ẹnikẹ́ni tí ó bá
  rationale: Ó pa ìyọrísí οὖν àti ìtumọ̀ gbogbogbò ti gbólóhùn arọ́pò-orúkọ aláìdánimọ̀ mọ́.
- source_word: βουληθῇ
  choice: fẹ́
  rationale: Ó fi ìfẹ́ inú tàbí ìpinnu ẹni hàn ní èdè Yorùbá àdánidá.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: jẹ́ ọ̀rẹ́ ayé
  rationale: Ó pa àwòrán ọ̀rẹ́ àti ìsopọ̀ ọ̀rọ̀ rẹ̀ pẹ̀lú ìbádọ́rẹ̀ẹ́ mọ́.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: ọ̀tá Ọlọ́run
  rationale: Ó túmọ̀ àsọyé orúkọ náà ní tààràtà, ó sì pa ìtakora ọ̀rẹ́ ayé àti ọ̀tá Ọlọ́run mọ́.
- source_word: καθίσταται
  choice: ó sọ ara rẹ̀ di
  rationale: Ó fi hàn pé ìfẹ́ ẹni láti bá ayé dọ́rẹ̀ẹ́ ló mú un dúró ní ipò ọ̀tá Ọlọ́run; ‘ó di’ tún ṣeé ṣe.
theological_decisions:
- issue: Agbára àkàwé μοιχαλίδες
  choice: A fi ‘Ẹ̀yin obìnrin panṣágà’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Ẹ̀yin aláìṣòótọ́ sí Ọlọ́run
  rationale: Ó ṣeé ṣe kí Jákọ́bù máa lo panṣágà gẹ́gẹ́ bí àkàwé àìṣòótọ́ sí Ọlọ́run, ní ìlànà èdè àwọn wòlíì nípa májẹ̀mú. Síbẹ̀, títúmọ̀ rẹ̀ sí ‘aláìṣòótọ́’ nìkan yóò mú àkàwé tó mú gan-an kúrò.
- issue: Ìtumọ̀ κόσμος
  choice: A túmọ̀ ọ́ sí ‘ayé’ láìfikún àlàyé sínú ọ̀rọ̀ pàtàkì.
  alternative: ètò ayé tó lòdì sí Ọlọ́run
  rationale: Nínú àyíká yìí, ‘ayé’ ń tọ́ka sí ìlànà àti ìfẹ́ ènìyàn tó dojú kọ Ọlọ́run, kì í ṣe ìṣẹ̀dá Ọlọ́run fúnra rẹ̀; ṣùgbọ́n a pa àìsọ́wọ́rọ̀ Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì.
- issue: Agbára καθίσταται
  choice: ó sọ ara rẹ̀ di ọ̀tá Ọlọ́run
  alternative: ó di ọ̀tá Ọlọ́run
  rationale: Àṣàyàn yìí mú ìbáṣepọ̀ tó wà láàárín ìfẹ́ ẹni àti ipò tó yọrí sí hàn, láìsọ pé ènìyàn ni ó dá ìdájọ́ Ọlọ́run sílẹ̀ fúnra rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa bí ìkìlọ̀ ẹsẹ̀ náà ṣe mú gan-an mọ́.
