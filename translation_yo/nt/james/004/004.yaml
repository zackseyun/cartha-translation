- from: Ẹ̀yin obìnrin panṣágà[a], ṣé ẹ kò mọ̀ pé ìbádọ́rẹ̀ẹ́ pẹ̀lú ayé[c] jẹ́ ìṣọ̀tá sí Ọlọ́run[b]? Nítorí náà, ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ọ̀rẹ́ ayé, ó sọ ara rẹ̀ di ọ̀tá Ọlọ́run[d].
  to: Ẹ̀yin panṣágà[a], ẹ kò mọ̀ pé ìbádọ̀rẹ̀ pẹ̀lú ayé[c] jẹ́ ìṣọ̀tá sí Ọlọ́run[b]? Nítorí náà, ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ọ̀rẹ́ ayé di ọ̀tá Ọlọ́run[d].
  rationale: A tún “ìbádọ́rẹ̀ẹ́” ṣe sí “ìbádọ̀rẹ̀” fún ìlò Yorùbá tó rọrùn. A yí “ó sọ ara rẹ̀ di” sí “ó di” kí ìtumọ̀ καθίσταται má ṣe fi ìṣe ìfìfẹ́ ẹni kún ọ̀rọ̀ ju ohun tí Gíríìkì sọ lọ. A tún ṣètò ìsàlẹ̀ a kí ó ṣàfihàn ìpè abo náà gẹ́gẹ́ bí aṣàyàn, nígbà tí ọ̀rọ̀ pàtàkì ń pa àkàwé tó mú gan-an mọ́.
