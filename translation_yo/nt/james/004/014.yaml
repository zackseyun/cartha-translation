source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: yo
  text: Ẹ kò mọ ohun tí yóò ṣẹlẹ̀ lọ́la. Kí ni ìwàláàyè yín? Nítorí ẹ jẹ́ kùrukùru omi tí ó farahàn fún ìgbà díẹ̀, lẹ́yìn náà ó sì pòórá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: ẹ kò mọ
  rationale: Ó sọ ní tààrà nípa àìmọ̀ ènìyàn nípa ọjọ́ iwájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τὸ τῆς αὔριον
  choice: ohun tí yóò ṣẹlẹ̀ lọ́la
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì ń tọ́ka sí ohun tí ọjọ́ ọ̀la ní nínú; yíyọ ọ́ sí ‘ohun tí yóò ṣẹlẹ̀ lọ́la’ mú un ṣe kedere láìṣe àfikún èrò.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Kí ni ìwàláàyè yín?
  rationale: Ó pa agbára ìbéèrè àsọyé náà mọ́, ó sì béèrè nípa irú ohun tí ìwàláàyè ènìyàn jẹ́.
- source_word: ἀτμὶς
  choice: ìkùukùu tín-ín-rín
  rationale: Ó mú àwòrán ohun tó fẹ́ẹ́rẹ́, tí ó farahàn fún ìgbà kúkúrú, tí ó sì tètè pòórá jáde ní Yorùbá. ‘Òru’ tún ṣeé lò gẹ́gẹ́ bí àṣàyàn ọ̀rọ̀.
- source_word: πρὸς ὀλίγον
  choice: fún ìgbà díẹ̀
  rationale: Ó fi kíkúrú àkókò hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: φαινομένη
  choice: tí ó farahàn
  rationale: Ó ṣàfihàn bí ìkùukùu náà ṣe hàn sí ojú fún ìgbà díẹ̀.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: lẹ́yìn náà tí ó sì pòórá
  rationale: Ó pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ àti àwòrán bí ohun náà ṣe di àìrí mọ́ mọ́.
theological_decisions:
- issue: Àpèjúwe ìwàláàyè ènìyàn gẹ́gẹ́ bí ohun tí ó kúrú tí kò sì dájú
  choice: Pa àwòrán ìkùukùu tín-ín-rín mọ́ gẹ́gẹ́ bí àsọyé nípa kíkúrú àti àìdájú ìwàláàyè ènìyàn.
  alternative: Túmọ̀ ọ́ ní ṣíṣàlàyé sí i pé ‘ìwàláàyè yín kúrú gan-an.’
  rationale: Àwòrán inú ọ̀rọ̀ ìpilẹ̀ ní agbára lítíréṣọ̀ àti ẹ̀kọ́ nípa ààlà ènìyàn; kò yẹ kí a fi ẹ̀kọ́ míràn nípa ikú tàbí ìdájọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà níyì, ó sì ṣeé lóye fún àwọn òǹkàwé òde òní. A lo ‘ìwàláàyè’ láti dá ìtumọ̀ ζωή mọ́ kedere, àti ‘ìkùukùu tín-ín-rín’ láti mú àwòrán ἀτμίς hàn.
