  to: Ẹ kò mọ ohun tí yóò ṣẹlẹ̀ lọ́la. Kí ni ìwàláàyè yín? Nítorí ẹ jẹ́ kùrukùru omi tí ó farahàn fún ìgbà díẹ̀, lẹ́yìn náà ó sì pòórá.
