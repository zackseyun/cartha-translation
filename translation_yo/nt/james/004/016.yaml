source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí, ẹ ń ṣògo nínú ìwà ìfọ́nnu yín.[a] Gbogbo irú ìṣògo bẹ́ẹ̀ jẹ́ ibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “nínú ìgbéraga yín,” “nínú ìwà fífi ara ẹni hàn ju bí ẹ ṣe rí lọ,” tàbí “nínú àwọn ọ̀rọ̀ ìfọ́nnu yín.” Ọ̀rọ̀ Giriki náà lè túmọ̀ sí ìfọ́nnu onígbéraga lápapọ̀; níbí, ó ṣeé ṣe kó ń tọ́ka ní pàtó sí àwọn ètò tí wọ́n gbẹ́kẹ̀ lé ara wọn láti ṣe, gẹ́gẹ́ bí àwọn ẹsẹ tó ṣáájú ti sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n ní báyìí
  rationale: Ó pa agbára ìyàtọ̀ δέ àti ìtọ́ka sí ipò wọn lọ́wọ́lọ́wọ́ nínú νῦν mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: καυχᾶσθε
  choice: ẹ ń ṣe ìgbéraga
  rationale: Ó fi ìṣe fífi ara ẹni yangàn tàbí ṣògo hàn ní èdè Yorùbá àdánidá.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: nítorí àwọn ìfọ́nnu asán yín
  rationale: ‘Ìfọ́nnu asán’ ń sọ ìgbéraga tí ó kún fún ìgbẹ́kẹ̀lé ara ẹni àti àsọtẹ́lẹ̀ aláfojúdi; ‘àwọn’ tún pa ọ̀pọ̀ nǹkan inú Giriki mọ́ láì fi ‘ètò’ kún ọ̀rọ̀ náà.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Gbogbo irú ìṣògo bẹ́ẹ̀
  rationale: Ó pa ìtumọ̀ gbogbogbò πᾶσα àti ìwúlò àfihàn τοιαύτη (‘irú ... bẹ́ẹ̀’) mọ́.
- source_word: πονηρά
  choice: jẹ́ ibi
  rationale: ‘Ibi’ fi ìdájọ́ ìwà búburú hàn, kì í ṣe pé ohun náà kò dára lásán.
theological_decisions:
- issue: Irú ìṣògo tí a dá lẹ́bi
  choice: A dá ìfọ́nnu àti ìgbẹ́kẹ̀lé ara ẹni nínú ètò ènìyàn lẹ́bi ní àyíká ẹsẹ 13–15, ṣùgbọ́n a kò fi ọ̀rọ̀ ‘ètò’ sínú ẹsẹ yìí.
  alternative: Kí a túmọ̀ ọ́ sí ‘àwọn ètò ìgbéraga yín,’ tàbí gẹ́gẹ́ bí ìdálẹ́bi gbogbo ìgbẹ́kẹ̀lé ara ẹni láìka àyíká sí.
  rationale: Àyíká ń tọ́ka sí ètò ìrìn-àjò àti òwò tí kò tẹríba fún ìfẹ́ Olúwa, ṣùgbọ́n ἀλαζονείαις fúnra rẹ̀ túbọ̀ túmọ̀ sí ìfọ́nnu tàbí àṣehàn ìgbéraga; ìtumọ̀ náà yẹ kí ó pa ààyè ìtumọ̀ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá àkókò yìí, tó ní iyì, tó sì ṣeé lóye ni a lò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμῶν àti ìtọ́ka sí ẹgbẹ́ àwọn olùgbọ́.
