id: 3JN.1.4
reference: 3 John 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: yo
  text: 'Èmi kò ní ayọ̀ tí ó tóbi ju èyí lọ: láti gbọ́ pé àwọn ọmọ mi ń rìn nínú òtítọ́[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀ sí ọ̀rọ̀, “Èmi kò ní ayọ̀ tí ó tóbi ju àwọn ohun wọ̀nyí lọ.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ọmọ mi” ṣeé ṣe kí ó tọ́ka sí àwọn onígbàgbọ́ tí ó wà lábẹ́ ìtọ́jú rẹ̀ nípa ẹ̀mí.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: tí ó tóbi ju
  rationale: Ó jẹ́ ọ̀rọ̀ ìfiwéra tó ń ṣàpèjúwe ayọ̀; gbólóhùn yìí jẹ́ ọ̀nà àdánidá láti sọ ‘greater’ ní Yorùbá.
- source_word: τούτων
  choice: ju èyí lọ
  rationale: Ọ̀rọ̀ náà jẹ́ ohun tí a fi ayọ̀ wé lẹ́yìn ọ̀rọ̀ ìfiwéra. Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ó wà ní Gíríìkì, ‘èyí’ ń tọ́ka lọ́nà àdánidá sí ohun tí gbólóhùn tó tẹ̀ lé ń ṣàlàyé; àlàyé ìsàlẹ̀ fi ìtumọ̀ ọ̀rọ̀ sí ọ̀rọ̀ hàn.
- source_word: χαράν
  choice: ayọ̀
  rationale: ‘Ayọ̀’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìmọ̀lára alágbára tí χαρά ń sọ.
- source_word: ἵνα ἀκούω
  choice: láti máa gbọ́ pé
  rationale: Níhìn-ín ἵνα ń ṣàlàyé ohun tó dá ayọ̀ náà sílẹ̀, kì í ṣe ète kan lásán. ‘Láti máa gbọ́ pé’ jẹ́ Yorùbá àdánidá, ó sì pa ìṣe tó ń bá a lọ mọ́.
- source_word: τὰ ἐμὰ τέκνα
  choice: àwọn ọmọ mi
  rationale: Ó pa àwòrán ìbátan ẹbí inú τέκνα mọ́ láì pinnu nínú ẹsẹ̀ náà pé ọmọ nípa ẹ̀jẹ̀ ni tàbí ọmọ nípa ẹ̀mí.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: Ó pa ìtumọ̀ gbooro tí ọ̀rọ̀ náà ní nínú àwọn ìwé Jòhánù mọ́—òye òtítọ́ àti ìgbé ayé tó bá òtítọ́ mu—láì dín in kù sí òtítọ́ ọkàn tàbí ẹ̀kọ́ nìkan.
- source_word: περιπατοῦντα
  choice: ń rìn
  rationale: Ó pa àkàwé Bíbélì fún ọ̀nà ìgbé ayé mọ́, ó sì jẹ́ gbólóhùn tí àwọn òǹkàwé Yorùbá lè lóye nínú àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá τέκνα túmọ̀ sí ọmọ nípa ẹ̀jẹ̀ tàbí ọmọ nípa ẹ̀mí
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn ọmọ mi’ nínú ẹsẹ̀ náà.
  alternative: àwọn ọmọ mi nípa ẹ̀mí; àwọn tí mo yí padà
  rationale: Àyíká 3 Jòhánù fi hàn pé ó ṣeé ṣe kí ó ń tọ́ka sí àwọn onígbàgbọ́ tó wà lábẹ́ ìtọ́jú rẹ̀, ṣùgbọ́n Gíríìkì lo ọ̀rọ̀ ìbátan ẹbí. Pípa àwòrán náà mọ́ kò jẹ́ kí ìtumọ̀ túmọ̀ ọ̀rọ̀ ju ẹ̀rí inú ọ̀rọ̀ lọ.
- issue: Ìtumọ̀ ἐν τῇ ἀληθείᾳ
  choice: nínú òtítọ́
  alternative: ní òtítọ́ inú; ní ìbámu pẹ̀lú ẹ̀kọ́ òtítọ́
  rationale: Lílò ọ̀rọ̀ ‘òtítọ́’ nínú àwọn ìwé Jòhánù lè gba ìgbàgbọ́ òtítọ́ àti ìwà tó bá a mu pọ̀. Ìtumọ̀ yìí pa ìsopọ̀ àti àìdánilójú tó yẹ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àkàwé ‘ń rìn nínú òtítọ́’ mọ́ nítorí pé ó ṣe pàtàkì nínú ọ̀rọ̀ Jòhánù, kò sì ṣàjèjì débi tí yóò fi ṣòro fún òǹkàwé.
