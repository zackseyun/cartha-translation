  to: Olùfẹ́, má ṣe farawe ohun búburú, ṣùgbọ́n farawe ohun rere. Ẹni tí ń ṣe rere[a] ti Ọlọ́run wá; ẹni tí ń ṣe búburú kò tíì rí Ọlọ́run.
  rationale: A tún ‘fara wé’ ṣe sí ‘farawe’ kí ọ̀rọ̀ Yorùbá náà lè túmọ̀ ìfarawé, kì í ṣe ìfi ara ẹni wé ohun kan. A pa ìtumọ̀, ìfararora, àti àìdánilójú ẹ̀kọ́ ìsìn tí ó wà nínú Gíríìkì mọ́. Ìtẹ̀síwájú ‘farawe’ nínú apá kejì jẹ́ ìpèsè Yorùbá fún ọ̀rọ̀ ìṣè tí Gíríìkì fi sílẹ̀ nínú ìlòdì náà.
