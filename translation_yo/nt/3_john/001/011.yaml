  source_fidelity: Ìtumọ̀ náà pa ìlòdì Gíríìkì náà, ìpè ọlọ́wọ̀ náà, ìpilẹ̀ṣẹ̀ ‘láti ọ̀dọ̀ Ọlọ́run,’ àti ọ̀rọ̀ ‘rí Ọlọ́run’ mọ́ dáadáa. Síbẹ̀, ‘fara wé’ sábà máa ń túmọ̀ sí fí ara ẹni wé ohun kan, kì í ṣe ṣíṣe àfarawé; ‘farawe’ ni ọ̀rọ̀ tó péye jù lọ fún μιμοῦ nínú àyíká yìí. A tún mú ìpèṣẹ̀ kejì tí Gíríìkì fi sílẹ̀ ní ìfọ̀rọ̀wérọ̀ wá sínú Yorùbá, nítorí pé ó jẹ́ ohun adayeba nínú ìlòdì yìí.
