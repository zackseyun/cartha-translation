id: 3JN.1.11
reference: 3 John 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: yo
  text: Olùfẹ́, má ṣe farawe ohun búburú, ṣùgbọ́n farawe ohun rere. Ẹni tí ń ṣe rere[a] ti Ọlọ́run wá; ẹni tí ń ṣe búburú kò tíì rí Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ẹni tó ń bá a nìṣó láti máa ṣe rere … ẹni tó ń bá a nìṣó láti máa ṣe búburú”; àwọn participle Gíríìkì lè tẹnu mọ́ ìṣe tí ń bá a lọ tàbí ìwà tí ó ti di àṣà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ẹnìkan ṣoṣo ni, ó sì fi ìfẹ́ hàn. “Olùfẹ́” pa ìfẹ́ inú ọ̀rọ̀ náà àti ara ọ̀rọ̀ Johanu mọ́.
- source_word: μὴ μιμοῦ
  choice: má ṣe fara wé
  rationale: Ọ̀rọ̀ ìṣè ní ìlànà ìdènà ni. “Fara wé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ènìyàn má ṣe tẹ̀ lé àpẹẹrẹ ohun kan.
- source_word: τὸ κακὸν
  choice: ohun búburú
  rationale: Àjùmọ̀lò àpèjúwe aláìdárúkọ yìí ń tọ́ka sí ohun gbogbo tí ó burú ní ti ìwà, kì í ṣe ìṣe búburú kan ṣoṣo.
- source_word: τὸ ἀγαθόν
  choice: ohun rere
  rationale: Ó bá “ohun búburú” ṣe ní ìlòdì, ó sì pa ìtumọ̀ gbogbogbò ti ohun tí ó dára ní ti ìwà mọ́.
- source_word: ὁ ἀγαθοποιῶν
  choice: Ẹni tí ń ṣe rere
  rationale: Participle ìsinsìnyí tí a lò gẹ́gẹ́ bí orúkọ ni; “tí ń ṣe” lè fi ìṣe tí ń bá a lọ tàbí ìwà tí ó máa ń hù hàn.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ti Ọlọ́run wá
  rationale: Ó pa èrò orísun tàbí jíjẹ́ ti Ọlọ́run mọ́ láì sọ ọ́ di ẹ̀kọ́ ìsìn kan pàtó.
- source_word: ὁ κακοποιῶν
  choice: ẹni tí ń ṣe búburú
  rationale: Ó bá gbólóhùn tó ṣáájú mu, ó sì lè tọ́ka sí ìṣe tí ń bá a lọ tàbí ìwà àfihàn.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: kò tíì rí Ọlọ́run
  rationale: “Kò tíì rí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe pípé tí abajade rẹ̀ wà títí di ìsinsìnyí hàn, ó sì pa àwòrán “rí Ọlọ́run” mọ́ dípò ṣíṣàlàyé rẹ̀ sí “mọ Ọlọ́run.”
theological_decisions:
- issue: Ìbáṣepọ̀ ìwà rere tàbí búburú pẹ̀lú jíjẹ́ ti Ọlọ́run
  choice: A pa ọ̀rọ̀ Johanu náà mọ́ pé ẹni tí ń ṣe rere “ti Ọlọ́run wá,” ẹni tí ń ṣe búburú sì “kò tíì rí Ọlọ́run.”
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà sí ẹ̀kọ́ kan nípa àtúnbí, àìlẹ́ṣẹ̀, tàbí àìní ìbáṣepọ̀ kankan pẹ̀lú Ọlọ́run.
  rationale: Gíríìkì ń lo àwọn ọ̀rọ̀ Johanu gẹ́gẹ́ bí àfihàn ipò ẹ̀mí àti ìwà. Ìtumọ̀ náà kò dín ìkìlọ̀ kù, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọ “Olùfẹ́” jẹ́ ọlọ́wọ̀ àti ọ̀wọ̀; “fara wé” sì jẹ́ àdánidá fún ìtẹ̀lé àpẹẹrẹ. A tún “fara wé” sọ nínú apá kejì láti jẹ́ kí ìlòdì náà ṣe kedere ní Yorùbá, bó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀ ìṣè náà sílẹ̀ láti lóye.
