  terminology: ‘Olùfẹ́,’ ‘ohun búburú/ohun rere,’ ‘ti Ọlọ́run wá,’ àti ‘rí Ọlọ́run’ tọ́, wọ́n sì yẹ fún ọ̀rọ̀ Johanu láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
