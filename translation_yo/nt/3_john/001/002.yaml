id: 3JN.1.2
reference: 3 John 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: yo
  text: Olùfẹ́, mo ń gbàdúrà pé kí ohun gbogbo máa lọ dáadáa fún ọ[a], kí ara rẹ̀ sì le[b], gẹ́gẹ́ bí ó ti ń lọ dáadáa fún ọkàn rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó máa lọ dáadáa fún ọ ní gbogbo ọ̀nà.” Èdè Gíríìkì ń sọ bí ìfẹ́-ọkàn náà ṣe kan gbogbo apá ìgbésí ayé, kì í ṣe “ju gbogbo ohun lọ.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí o sì wà ní ìlera rere.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gẹ́gẹ́ bí inú rẹ̀ ti ń ṣe rere.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọkàn, ìwàláàyè, tàbí inú ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ẹnì kan tí a nífẹ̀ẹ́ ni; “Olùfẹ́” pa ìsopọ̀ rẹ̀ mọ́ ìfẹ́, ó sì yẹ fún ọ̀rọ̀ ọlọ́lá.
- source_word: περὶ πάντων
  choice: kí ohun gbogbo máa lọ dáadáa fún ọ
  rationale: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ohun tó ń fi bí àdúrà náà ṣe gbòòrò hàn, kì í ṣe pé èyí ni ohun tó ṣe pàtàkì jù lọ.
- source_word: εὔχομαί
  choice: mo ń gbàdúrà
  rationale: Nínú lẹ́tà yìí, ọ̀rọ̀ náà lè jẹ́ ìfẹ́-ọkàn tàbí àdúrà; “mo ń gbàdúrà” mú ìtumọ̀ ẹ̀sìn inú rẹ̀ jáde lọ́nà àdánidá.
- source_word: σε εὐοδοῦσθαι
  choice: kí ohun gbogbo máa lọ dáadáa fún ọ
  rationale: Èyí sọ pé kí ẹni náà máa ṣe rere tàbí kí nǹkan máa lọ dáadáa fún un, láìdín ìtumọ̀ rẹ̀ kù sí ọrọ̀ tàbí ohun ìní nìkan.
- source_word: ὑγιαίνειν
  choice: kí ara rẹ sì le
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìlera ara níbí; gbólóhùn Yorùbá yìí jẹ́ èyí tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn láàárín bí nǹkan ṣe ń lọ fún ẹni náà àti bí ó ṣe ń lọ fún ọkàn rẹ̀.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: bí ó ti ń lọ dáadáa fún ọkàn rẹ
  rationale: A tún lo “lọ dáadáa” láti pa àtúnlò ọ̀rọ̀ εὐοδόομαι mọ́ ní apá méjèèjì ẹsẹ náà.
- source_word: ψυχή
  choice: ọkàn
  rationale: “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún inú ẹni tàbí soul ní àyíká yìí, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ààyè sílẹ̀ fún fífi í yé wa gẹ́gẹ́ bí inú ẹni.
theological_decisions:
- issue: Ìtumọ̀ περὶ πάντων nínú ìfẹ́-ọkàn ìbẹ̀rẹ̀
  choice: ó ń fi gbogbo apá ìgbésí ayé tí àdúrà náà kàn hàn
  alternative: ju gbogbo ohun mìíràn lọ
  rationale: Èdè Gíríìkì túbọ̀ ń fi bí ohun náà ṣe gbòòrò hàn ju pé ó ń ṣètò ohun kan sí ipò àkọ́kọ́ lọ.
- issue: Ìtumọ̀ ψυχή
  choice: ọkàn
  alternative: inú ẹni; ìwàláàyè ẹni
  rationale: “Ọkàn” pa ìyàtọ̀ tó wà láàárín ìlera ara àti ipò inú ẹni mọ́, láìfi èrò ẹ̀kọ́ ìsìn kan pàtó lé ọ̀rọ̀ náà lórí.
- issue: Irú aásìkí tí εὐοδοῦσθαι ń sọ
  choice: kí ohun gbogbo máa lọ dáadáa fún ọ
  alternative: kí o di ọlọ́rọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ọrọ̀ ajé tàbí ohun ìní lọ; ìtumọ̀ náà kò sọ ìlérí ọrọ̀ di ohun tí ẹsẹ náà ń kọ́ni.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, tó sì rọrùn fún gbogbo ènìyàn. “Kí ohun gbogbo máa lọ dáadáa fún ọ” yàgò fún lílo ọ̀rọ̀ “aásìkí” ní ọ̀nà tí ó lè mú kí ẹsẹ náà dà bí ìlérí ọrọ̀ ajé. A tún ọ̀rọ̀ “lọ dáadáa” ṣe ní apá méjèèjì láti fi àtúnlò ọ̀rọ̀ Gíríìkì hàn.
