id: 3JN.1.10
reference: 3 John 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: yo
  text: 'Nítorí èyí, bí mo bá dé, èmi yóò sọ àwọn iṣẹ́ tí ó ń ṣe di mímọ̀: ó ń fi ọ̀rọ̀ búburú sọ ọ̀rọ̀ asán sórí wa. Kò sì dáwọ́ dúró sí àwọn nǹkan wọ̀nyí; òun fúnra rẹ̀ kò gba àwọn arákùnrin náà gẹ́gẹ́ bí àlejò[a][b], ó sì ń dá àwọn tí ó fẹ́ ṣe bẹ́ẹ̀ dúró, ó sì ń lé wọn jáde kúrò nínú ìjọ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘kò gba àwọn arákùnrin náà.’ Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí gbígba tàbí kíka ẹni sí, pàápàá jù lọ ní ti fífi àlejò ṣe.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ‘àwọn arákùnrin náà’ tọ́ka sí àwọn arákùnrin Kristẹni tàbí àwọn òjíṣẹ́ tí ń rìnrìn-àjò. Àwọn ìtumọ̀ kan sọ ọ́ di ‘àwọn arákùnrin àti arábìnrin’ tàbí ‘àwọn onígbàgbọ́.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘ó ń yọ wọ́n kúrò nínú ìjọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó pa ìbáṣepọ̀ ìdí-àbájáde tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐὰν ἔλθω
  choice: bí mo bá dé
  rationale: Ó fi ipò àídájú ọjọ́ iwájú hàn ní Yorùbá àdánidá; ‘dé’ bá àyíká ìrìnàjò mu.
- source_word: ὑπομνήσω
  choice: èmi yóò mú ... wá sí ìrántí
  rationale: Ó pa ìtumọ̀ ìpilẹ̀ ti rírántí tàbí mímú wá sí ọkàn mọ́, láì pinnu bóyá yóò jẹ́ ìbáwí ní gbangba.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: àwọn iṣẹ́ tí ó ń ṣe
  rationale: Ó pa ọ̀pọ̀ ‘iṣẹ́’ àti ìṣe tí ń bá a lọ nínú ọ̀rọ̀ orísun mọ́.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: bí ó ti ń fi ọ̀rọ̀ búburú sọ ọ̀rọ̀ asán sí wa
  rationale: ‘Ọ̀rọ̀ búburú’ túmọ̀ πονηροῖς ní tààrà, ‘sọ ọ̀rọ̀ asán’ sì mú ìtumọ̀ ọ̀rọ̀ òfo tàbí aláìníláárí ti φλυαρέω jáde; ‘sí wa’ fi ẹni tí ọ̀rọ̀ náà dojú kọ hàn.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: kò sì tẹ́ ẹ lọ́rùn pẹ̀lú àwọn nǹkan wọ̀nyí
  rationale: Ìtumọ̀ àdánidá ni fún pé ìwà búburú rẹ̀ kò dúró síbẹ̀.
- source_word: ἐπιδέχεται τοὺς ἀδελφούς
  choice: gba àwọn arákùnrin náà lálejò
  rationale: Nínú àyíká yìí, ọ̀rọ̀-ìṣe náà ní ìtumọ̀ gbígba tàbí kíka àwọn arìnrìn-àjò sí; ‘lálejò’ mú ọ̀ràn àlejò hàn kedere.
- source_word: τοὺς ἀδελφούς
  choice: àwọn arákùnrin náà
  rationale: Ó pa akọ ọ̀pọ̀ inú Gíríìkì mọ́, ó sì ṣeé ṣe kí ó tọ́ka sí àwọn Kristẹni ọkùnrin tí ń rìnrìn-àjò.
- source_word: τοὺς βουλομένους κωλύει
  choice: ó ń dá àwọn tí ó fẹ́ ṣe bẹ́ẹ̀ dúró
  rationale: Ó pa ìfẹ́ inú βούλομαι àti ìdènà κωλύω mọ́, nígbà tí ‘ṣe bẹ́ẹ̀’ ń tọ́ka padà sí gbígba wọn lálejò.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: ó ń lé wọn jáde kúrò nínú ìjọ
  rationale: Ó fi agbára ìléjáde ἐκβάλλει àti ìjọ Kristẹni agbègbè hàn ní kedere.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τοὺς ἀδελφούς nínú ọ̀ràn àlejò ìjọ
  choice: àwọn arákùnrin náà
  alternative: àwọn onígbàgbọ́ / àwọn arákùnrin àti arábìnrin
  rationale: Akọ ọ̀pọ̀ Gíríìkì àti àyíká àwọn òjíṣẹ́ Kristẹni arìnrìn-àjò mú kí ìtumọ̀ akọ ṣeé gbà; a kò fẹ̀ẹ́ sọ ọ́ di ọ̀rọ̀ tí kò ní ìyàtọ̀ akọ-abo láìsí ẹ̀rí.
- issue: Iye agbára ìbáwí nínú ὑπομνήσω
  choice: mú àwọn iṣẹ́ ... wá sí ìrántí
  alternative: fa àfiyèsí sí àwọn iṣẹ́ rẹ̀ / tú wọn síta
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ ‘rán létí’ tàbí ‘mú wá sí ọkàn’; àyíká lè ní ìbáwí nínú, ṣùgbọ́n a kò fi ìtumọ̀ ìdájọ́ ní gbangba kún un láìṣe dandan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘ìjọ’ fún ἐκκλησία, ‘gba ... lálejò’ fún àyíká hospitality, àti àwọn ọ̀rọ̀-ìṣe àsìkò tí ń lọ lọ́wọ́ láti fi ìwà tí ó ń bá a lọ hàn.
