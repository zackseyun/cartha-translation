  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: yo
  text: Alàgbà, sí Gáyù olùfẹ́, ẹni tí èmi fẹ́ràn nínú òtítọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí mo fẹ́ràn ní tòótọ́”; tàbí, “nínú òtítọ́ náà.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ìfẹ́ àtọkànwá, ìfẹ́ tí ó da lórí òtítọ́ ìhìnrere, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Alàgbà
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ tí olùkọ̀wé fi pe ara rẹ̀. “Alàgbà” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ipò tàbí iyì rẹ̀, láìfi orúkọ ipò ìjọ kan tí ó túbọ̀ jẹ́ ti ẹ̀kọ́ ìsìn kún un.
- source_word: Γαΐῳ
  choice: Gáyù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí tó bá ìró àti ìlànà kíkọ Yorùbá mu.
- source_word: τῷ ἀγαπητῷ
  choice: olùfẹ́
  rationale: “Olùfẹ́” fi ìfẹ́ ọkàn nínú ìkíni náà hàn, ó sì ní ìbátan pẹ̀lú “fẹ́ràn” tó tẹ̀ lé e.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: ẹni tí èmi fẹ́ràn
  rationale: “Ẹni tí” ṣe iṣẹ́ arọ́pò-orúkọ olùgbà iṣẹ́ náà, “èmi” sì pa ìtẹnumọ́ díẹ̀ tó wà nínú ἐγώ mọ́; “fẹ́ràn” jẹ́ ọ̀nà àdánidá láti sọ ìfẹ́ sí ènìyàn ní Yorùbá.
- source_word: ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: Ìtumọ̀ yìí fara mọ́ àwòrán ọ̀rọ̀ Gíríìkì, ó sì jẹ́ kí gbólóhùn náà lè tọ́ka sí ìfẹ́ tòótọ́, ìfẹ́ tó fìdí múlẹ̀ nínú òtítọ́ ìhìnrere, tàbí àwọn méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ ἀλήθεια nínú gbólóhùn ìparí
  choice: nínú òtítọ́
  alternative: ní tòótọ́; nínú òtítọ́ náà
  rationale: Àwọn ìwé Johanu sábà máa ń lo “òtítọ́” pẹ̀lú ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́, ṣùgbọ́n ẹsẹ yìí kò fi dandan mú wa yan láàárín òótọ́ inú ọkàn àti òtítọ́ ìhìnrere. Ìtumọ̀ àkọ́kọ́ pa ìṣòro àti ààyè ìtumọ̀ méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó ní ìfẹ́ ọkàn, ó sì yẹ fún ìbẹ̀rẹ̀ lẹ́tà. A pa ìrísí kúkúrú ti àkọlé lẹ́tà Gíríìkì mọ́ ní ọ̀nà tó ṣì ṣeé lóye ní Yorùbá.
