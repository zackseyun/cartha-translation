source:
  edition: SBLGNT
  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: yo
  text: Mo ní ọ̀pọ̀ ohun láti kọ sí ọ, ṣùgbọ́n mi ò fẹ́ fi ìnkì àti kálámù kọ sí ọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “pẹ̀lú ìnkì àti kálámù esùsú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: ọ̀pọ̀lọpọ̀ ohun
  rationale: Ọ̀rọ̀ ajẹtífù aláìlẹ́mìí ọ̀pọ̀ ni a lò gẹ́gẹ́ bí orúkọ; ‘ọ̀pọ̀lọpọ̀ ohun’ mú ìtumọ̀ ọ̀pọ̀ rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: εἶχον
  choice: Mo ní
  rationale: Ìṣe àìpé yìí dá ọ̀rọ̀ náà sí ìgbà tí ẹni tó kọ lẹ́tà ní ohun púpọ̀ lọ́kàn láti kọ; ‘Mo ní’ pa ìṣètò ìgbà yẹn mọ́.
- source_word: γράψαι σοι
  choice: láti kọ sí ọ
  rationale: Aoristi infinitive náà tọ́ka sí iṣẹ́ kíkọ tí a pinnu; ‘láti kọ sí ọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ẹni tí a ń kọ lẹ́tà sí.
- source_word: ἀλλ’ οὐ θέλω
  choice: ṣùgbọ́n èmi kò fẹ́
  rationale: θέλω sọ ìfẹ́ tàbí ìpinnu; fífi ‘èmi’ hàn fún un ní ìtẹnumọ́ díẹ̀, ó sì bá ìyípadà láti ohun tó lè kọ sí ohun tí kò fẹ́ ṣe mu.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: fi taǹkálẹ̀ àti kálámù
  rationale: διά pẹ̀lú genitive fi ohun èlò hàn. ‘Taǹkálẹ̀’ ni omi dúdú ìkọ̀wé, ‘kálámù’ sì jẹ́ ohun èlò ìkọ̀wé; àlàyé ìtumọ̀ gangan ti κάλαμος wà ní àlàyé ìsàlẹ̀.
- source_word: γράφειν
  choice: kọ sí ọ
  rationale: Infinitive ìsinsìnyí lè tẹnumọ́ ìṣe kíkọ tó ń lọ, ṣùgbọ́n Yorùbá ‘kọ sí ọ’ sọ ìtumọ̀ náà ní kedere láìfi ohun tí kò sí nínú Gíríìkì kún un.
