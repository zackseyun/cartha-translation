  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ohun èlò ìkọ̀wé mọ́, a sì ṣàlàyé pé κάλαμος jẹ́ kálámù esùsú ní àlàyé ìsàlẹ̀.
