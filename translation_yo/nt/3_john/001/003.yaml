id: 3JN.1.3
reference: 3 John 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: yo
  text: Nítorí mo yọ̀ gidigidi nígbà tí àwọn arákùnrin wá, tí wọ́n sì jẹ́rìí nípa òtítọ́ rẹ,[a] gẹ́gẹ́ bí ìwọ ṣe ń rìn nínú òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n jẹ́rìí sí òtítọ́ rẹ”; ìyẹn, wọ́n jẹ́rìí nípa ìṣòtítọ́ rẹ sí òtítọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Nítorí inú mi dùn gidigidi
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ayọ̀ ńlá àti àsopọ̀ àlàyé γάρ jáde ní Yorùbá àdánidá.
- source_word: ἐρχομένων ἀδελφῶν
  choice: nígbà tí àwọn arákùnrin dé
  rationale: Ó tú genitive absolute náà sí gbólóhùn àkókò tó ṣe kedere; “àwọn arákùnrin” pa akọ ọ̀pọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ó tún lè tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́.
- source_word: μαρτυρούντων
  choice: tí wọ́n sì jẹ́rìí sí
  rationale: “Jẹ́rìí sí” pa èdè ẹ̀rí μαρτυρέω mọ́, ó sì bá dative tó tẹ̀ lé e mu.
- source_word: σου τῇ ἀληθείᾳ
  choice: bí ìwọ ṣe dúró ṣinṣin nínú òtítọ́
  rationale: Dative phrase náà ní àìdánilójú díẹ̀. Ìtumọ̀ yìí yàgò fún èrò pé Gáyù ní “òtítọ́ tirẹ̀,” ó sì so ẹ̀rí àwọn arákùnrin mọ́ ìbáṣepọ̀ rẹ̀ pẹ̀lú òtítọ́. Àṣàyàn tó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹkipẹki wà nínú àlàyé ìsàlẹ̀.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu láàárín ẹ̀rí wọn àti ìwà Gáyù hàn.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: ìwọ ti ń rìn nínú òtítọ́
  rationale: Ó pa àkàwé ìrìn gẹ́gẹ́ bí ìwà ayé mọ́, ó sì ṣàfihàn iṣẹ́ tó ń bá a lọ nínú present tense.
theological_decisions:
- issue: Ìtumọ̀ ἀλήθεια nínú ọ̀rọ̀ ìgbàgbọ́ àti ìwà Johanu
  choice: òtítọ́ ní ibi méjèèjì
  alternative: ìṣòtítọ́; òtítọ́ tó wà nínú rẹ
  rationale: Yíyan “òtítọ́” pa ìfọ̀rọ̀wérọ̀ láàárín ohun tí a gbà gbọ́ àti bí a ṣe ń gbé ayé mọ́, láì dín ọ̀rọ̀ náà kù sí ẹ̀kọ́ tàbí ìwà rere nìkan.
- issue: Ìtumọ̀ σου τῇ ἀληθείᾳ
  choice: bí ìwọ ṣe dúró ṣinṣin nínú òtítọ́
  alternative: òtítọ́ rẹ; òtítọ́ tó wà nínú rẹ
  rationale: Possessive àti dative Gíríìkì lè tọ́ka sí òtítọ́ Gáyù, tàbí sí ìṣòtítọ́ rẹ̀ sí òtítọ́. Ọ̀rọ̀ àkọ́kọ́ yan ìtumọ̀ tó ṣe kedere ní Yorùbá, ṣùgbọ́n àlàyé pa ìtumọ̀ gígúnṣọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣeé lóye. A pa àkàwé “rìn nínú òtítọ́” mọ́ nítorí ó ṣe pàtàkì nínú ara ọ̀rọ̀ Johanu.
