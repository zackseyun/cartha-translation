source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: yo
  text: Wọ́n jẹ́rìí níwájú ìjọ nípa ìfẹ́ rẹ; ìwọ yóò sì ṣe dáadáa bí o bá rán wọn lọ síwájú ní ọ̀nà tí ó yẹ níwájú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ràn wọ́n lọ́wọ́ nínú ìrìn-àjò wọn”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí rírán àwọn arìnrìn-àjò lọ síwájú pẹ̀lú ìrànlọ́wọ́ tó wúlò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: jẹ́rìí
  rationale: Ọ̀rọ̀ yìí sọ ní tààrà nípa ẹ̀rí tí wọ́n ti jẹ́ níwájú ìjọ; àkókò ìṣe tó kọjá nínú Gíríìkì ni a fi hàn nípa àyíká gbólóhùn Yorùbá.
- source_word: σου τῇ ἀγάπῃ
  choice: nípa ìfẹ́ rẹ
  rationale: Ó fi ohun tí ẹ̀rí wọn dá lé lórí hàn ní Yorùbá adayébá, láì yí ìtumọ̀ ἀγάπη padà.
- source_word: ἐνώπιον ἐκκλησίας
  choice: níwájú ìjọ
  rationale: Ó pa ìtumọ̀ wíwà ní iwájú àwùjọ àwọn onígbàgbọ́ mọ́ ní ọ̀nà ṣókí.
- source_word: καλῶς ποιήσεις
  choice: ìwọ yóò sì ṣe dáadáa
  rationale: Ó pa ìrísí ọjọ́ iwájú àti agbára ìṣírí onírẹ̀lẹ̀ ti gbólóhùn Gíríìkì mọ́.
- source_word: προπέμψας
  choice: bí o bá rán wọn lọ síwájú
  rationale: Ó sọ fífi àwọn arìnrìn-àjò ránṣẹ́ síwájú ní kedere, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ ìrànlọ́wọ́ tó lè wà nínú ọ̀rọ̀ náà mọ́.
- source_word: ἀξίως τοῦ θεοῦ
  choice: ní ọ̀nà tí ó yẹ fún Ọlọ́run
  rationale: Ó sọ bí a ṣe gbọdọ̀ ṣe ìṣe náà, ó sì pa ìwọ̀n ìwà tí ọlá Ọlọ́run béèrè mọ́.
theological_decisions:
- issue: Ìtumọ̀ προπέμπω nínú àlejò àti ìrànlọ́wọ́ Kristẹni
  choice: rán wọn lọ síwájú nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè kan ìrànlọ́wọ́ fún ìrìn-àjò
  alternative: pèsè ohun tí wọ́n nílò fún ìrìn-àjò wọn
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí fífi arìnrìn-àjò ránṣẹ́ síwájú pẹ̀lú ìrànlọ́wọ́ tó wúlò, ṣùgbọ́n kò sọ irú ìrànlọ́wọ́ náà ní pàtó; nítorí náà, a pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayébá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì àlàyé [a] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí ó ṣe àlàyé rẹ̀, dípò lẹ́gbẹ̀ẹ́ “ìfẹ́ rẹ” bí ó ti hàn nínú ìpele ìmọ̀ràn Gẹ̀ẹ́sì.
