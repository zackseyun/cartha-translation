revisions:
- from: Nítorí náà, ó yẹ kí àwa náà máa gba irú àwọn ẹni bẹ́ẹ̀ lálejò[a], kí a lè di alábàáṣiṣẹ́pọ̀ fún òtítọ́[b].
  to: Nítorí náà, ó yẹ kí àwa gba irú àwọn ènìyàn bẹ́ẹ̀ lálejò[a], kí a lè di alábàáṣiṣẹ́ fún òtítọ́[b].
  rationale: Àtúnṣe náà yọ ìtumọ̀ ‘also’ tí kò sí nínú Gíríìkì kúrò, yọ aspect ìṣe-àṣà tí ‘máa’ lè dá sílẹ̀ kúrò, ó sì lo ‘alábàáṣiṣẹ́,’ ọ̀rọ̀ Yorùbá tó dára fún συνεργοὶ. Àwọn àlàyé ẹsẹ̀ ìsàlẹ̀ ṣì pa ìtumọ̀ gbígbàlejò/ìtìlẹ́yìn àti àìdánilójú dative τῇ ἀληθείᾳ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:43:10Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ìjápọ̀ ìyọrísí οὖν, ojúṣe ὀφείλομεν, ìtẹ́wọ́gbà/ìtìlẹ́yìn àwọn òjíṣẹ́, ète ἵνα, àti ìtumọ̀ ‘wá di’ ti γινώμεθα hàn dáadáa. Ṣùgbọ́n ‘náà’ nínú ‘àwa náà’ fi ìtumọ̀ ‘also’ kún un, èyí tí kò sí nínú ἡμεῖς, àti ‘máa’ lè sọ ìṣe náà di àṣà tí ń tẹ̀síwájú ju ohun tí Gíríìkì béèrè lọ.
  naturalness: ‘Ó yẹ kí àwa gba irú àwọn ènìyàn bẹ́ẹ̀ lálejò’ jẹ́ Yorùbá àpéjọ tí ó mọ́, tí ó sì kedere. ‘Alábàáṣiṣẹ́’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì rọrùn ju ‘alábàáṣiṣẹ́pọ̀’ lọ níbí.
  terminology: ‘Lálejò’ yẹ fún ìtẹ́wọ́gbà àwọn arìnrìn-àjò, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ ṣàlàyé ìtìlẹ́yìn ohun-ìní tí ọ̀rọ̀ náà lè ní. ‘Òtítọ́’ pa ἀλήθεια mọ́; ‘fún òtítọ́’ jẹ́ ìpinnu ìtumọ̀ tó bojú mu, pẹ̀lú àwọn aṣàyàn dative tí a pa mọ́ nínú àlàyé.
