  - severity: low
    issue: ‘Máa gba’
    rationale: ‘Máa’ sábà ń fi ìṣe àṣà tàbí ìṣe tí ń tẹ̀síwájú hàn. Infinitive ὑπολαμβάνειν lẹ́yìn ὀφείλομεν kò béèrè fún àfikún aspect yìí; ‘gba’ pa ojúṣe náà mọ́ láì fikún un.
  - severity: low
    issue: ‘Alábàáṣiṣẹ́pọ̀’
    rationale: Ó ṣeé lóye, ṣùgbọ́n ‘alábàáṣiṣẹ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún συνεργός, ó sì yẹ fún ìforúkọsílẹ̀ lẹ́tà náà.
