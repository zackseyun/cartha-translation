id: 3JN.1.8
reference: 3 John 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: yo
  text: Nítorí náà, ó yẹ kí àwa gba irú àwọn ènìyàn bẹ́ẹ̀ lálejò[a], kí a lè di alábàáṣiṣẹ́ fún òtítọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a túmọ̀ sí “gba ... lálejò” tún lè ní ìtumọ̀ títẹ́wọ́ gba irú àwọn òjíṣẹ́ arìnrìn-àjò bẹ́ẹ̀ àti pípèsè ohun tí wọ́n nílò fún wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ apá yìí sí “alábàáṣiṣẹ́ pẹ̀lú òtítọ́” tàbí “alábàáṣiṣẹ́ nínú òtítọ́.” Dative Gíríìkì náà lè ní ju ìtumọ̀ kan lọ; ọ̀rọ̀ inú ẹsẹ̀ yìí mú un gẹ́gẹ́ bí ṣíṣe àtìlẹ́yìn fún iṣẹ́ òtítọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: àwa náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́; ‘àwa náà’ fi hàn pé àwọn onígbàgbọ́ ní ojúṣe tiwọn ní ìdáhùn sí àwọn òjíṣẹ́ tí a mẹ́nu kàn ṣáájú.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìdí tí a sọ ní ẹsẹ̀ ṣáájú, ó sì fi ìyọrísí ọgbọ́n inú rẹ̀ hàn.
- source_word: ὀφείλομεν
  choice: ó yẹ kí ... máa
  rationale: Ó sọ ojúṣe ìwà rere àti ohun tí a jẹ ní gbèsè láti ṣe, láì sọ ọ́ di àṣẹ líle ju bí Gíríìkì ṣe wí lọ.
- source_word: ὑπολαμβάνειν
  choice: gba ... lálejò
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí kí a tẹ́wọ́ gba àwọn òjíṣẹ́ arìnrìn-àjò, kí a sì pèsè ìrànlọ́wọ́ fún wọn; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìwọ̀n ìtumọ̀ rẹ̀ mọ́.
- source_word: τοὺς τοιούτους
  choice: irú àwọn ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí àwọn ẹni tí ó dà bí àwọn òjíṣẹ́ olóòótọ́ tí a ṣàpèjúwe ṣáájú, láì fi akọ nìkan mọ́ ọ̀rọ̀ náà.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde ìtìlẹ́yìn náà hàn ní Yorùbá àdánidá.
- source_word: συνεργοὶ
  choice: alábàáṣiṣẹ́pọ̀
  rationale: Ó pa èrò pé àwọn olùgbàlejò ń kópa pọ̀ nínú iṣẹ́ àwọn òjíṣẹ́ náà mọ́.
- source_word: γινώμεθα
  choice: di
  rationale: 'Ó pa ìtumọ̀ ‘wá di’ mọ́: nípa ìtìlẹ́yìn wọn, àwa náà ń di alábàáṣiṣẹ́pọ̀.'
- source_word: τῇ ἀληθείᾳ
  choice: fún òtítọ́
  rationale: Ó fi iṣẹ́ tí a ń ṣe nítorí ìlọsíwájú òtítọ́ hàn, ṣùgbọ́n àlàyé ẹsẹ̀ ìsàlẹ̀ jẹ́wọ́ pé dative Gíríìkì náà tún lè túmọ̀ sí ‘pẹ̀lú òtítọ́’ tàbí ‘nínú òtítọ́.’
theological_decisions:
- issue: Ìbáṣepọ̀ τῇ ἀληθείᾳ pẹ̀lú συνεργοὶ
  choice: ‘fún òtítọ́,’ ní ìtumọ̀ kíkópa nínú àti ṣíṣe àtìlẹ́yìn fún iṣẹ́ òtítọ́
  alternative: ‘pẹ̀lú òtítọ́’ tàbí ‘nínú òtítọ́’
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ṣíṣe àtìlẹ́yìn fún àwọn òjíṣẹ́ arìnrìn-àjò tí wọ́n jáde nítorí Orúkọ náà. ‘Fún òtítọ́’ bá ète iṣẹ́ náà mu, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ pa àìdánilójú gírámà Gíríìkì mọ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘gba ... lálejò’ dípò ‘gbà’ lásán láti mú àyíká ìtẹ́wọ́gbà àti ìtọ́jú àwọn òjíṣẹ́ arìnrìn-àjò hàn; àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
