id: 3JN.1.5
reference: 3 John 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: yo
  text: Olùfẹ́[a], o ń fi ìdúróṣinṣin hùwà nínú gbogbo ohun tí o bá ṣe fún àwọn arákùnrin[b], àti pàápàá fún àwọn tí ó jẹ́ àjèjì sí ọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ẹni ọ̀wọ́n.” “Olùfẹ́” jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ sí ẹni kan ṣoṣo.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” túmọ̀ akọ ọ̀pọ̀ ἀδελφοὺς. Ní àyíká yìí, ó ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́; ó sì ṣeé ṣe kí àwọn obìnrin wà lára ẹgbẹ́ náà.
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààrà sí i: “àti èyí fún àwọn àjèjì.” Ìṣètò ọ̀rọ̀ Gíríìkì lè fi “àwọn àjèjì” hàn gẹ́gẹ́ bí àwọn arákùnrin tí Gáyù kò mọ̀ tẹ́lẹ̀. Kì í ṣe dandan pé wọ́n jẹ́ ọmọ òkèèrè.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Olùfẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe onífẹ̀ẹ́ sí ẹni kan ṣoṣo. “Olùfẹ́” pa ìfẹ́ àti ọ̀wọ̀ inú ọ̀rọ̀ ìkíni lẹ́tà náà mọ́ láìfi “ọ̀rẹ́” kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: πιστὸν ποιεῖς
  choice: o ń hùwà pẹ̀lú ìṣòtítọ́
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí ṣíṣe ohun olóòótọ́. Èdè Yorùbá yìí sọ ìyìn fún ìdúróṣinṣin àti ìgbẹ́kẹ̀lé Gáyù lọ́nà àdánidá, láìsọ ọ́ di ọ̀rọ̀ nípa sísọ òtítọ́ nìkan.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: nínú gbogbo ohun tí o bá ṣe
  rationale: Àpapọ̀ arọ́pò-orúkọ àti ἐάν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ní ìtumọ̀ àìlópin, “ohunkóhun tí o bá ṣe.” “Gbogbo ohun” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ yẹn hàn.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: fún àwọn arákùnrin
  rationale: “Fún” fi ipa benefactive εἰς hàn lọ́nà Yorùbá tí ó rọrùn. “Àwọn arákùnrin” pa akọ ọ̀pọ̀ ἀδελφοὺς mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́.
- source_word: καὶ τοῦτο ξένους
  choice: àní bí wọ́n tilẹ̀ jẹ́ àjèjì sí ọ
  rationale: Ọ̀rọ̀ yìí tẹnu mọ́ pé Gáyù ń ran àwọn arákùnrin tí kò mọ̀ tẹ́lẹ̀ lọ́wọ́. “Àní bí … tilẹ̀” sọ agbára ìtẹnumọ́ náà ní Yorùbá àdánidá, nígbà tí àlàyé [c] pa ìṣètò ọ̀rọ̀ Gíríìkì tí ó ṣeé túmọ̀ lọ́nà míì mọ́.
- source_word: ξένους
  choice: àjèjì sí ọ
  rationale: Ní àyíká ìtẹ́wọ́gbà àlejò yìí, ξένος túmọ̀ sí àwọn tí ẹni tó gbà wọ́n kò mọ̀, kì í ṣe dandan pé wọ́n jẹ́ ọmọ orílẹ̀-èdè òkèèrè. Fífi “sí ọ” kún un mú ìtumọ̀ yẹn ṣe kedere láìyí ìtọ́kasí rẹ̀ padà.
theological_decisions:
- issue: Ta ni “àwọn arákùnrin” ń tọ́ka sí?
  choice: A pa ọ̀rọ̀ akọ ọ̀pọ̀ náà mọ́ nínú àyọkà, a sì ṣàlàyé pé ó ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́.
  alternative: “Àwọn arákùnrin àti arábìnrin” tàbí “àwọn onígbàgbọ́ ẹlẹgbẹ́.”
  rationale: Gíríìkì lo akọ ọ̀pọ̀ ἀδελφοὺς. Àyíká fi hàn pé wọ́n jẹ́ àwọn Kristẹni ẹlẹgbẹ́, ṣùgbọ́n àyọkà kò sọ ní pàtó bóyá obìnrin wà lára wọn; nítorí náà, àlàyé ni ibi tó yẹ láti tọ́ka sí àǹfààní yẹn.
- issue: Ìbáṣepọ̀ “àwọn arákùnrin” àti “àjèjì.”
  choice: A túmọ̀ wọn sí àwọn arákùnrin tí wọ́n jẹ́ àjèjì sí Gáyù.
  alternative: 'Kí a ka wọn sí ẹgbẹ́ méjì ọ̀tọ̀: àwọn arákùnrin àti àwọn àjèjì.'
  rationale: Accusative ξένους bá τοὺς ἀδελφοὺς mu, ó sì ṣeé ka gẹ́gẹ́ bí àpèjúwe wọn. Èyí bá àyíká àwọn arìnrìn-àjò onígbàgbọ́ mu, ṣùgbọ́n àlàyé [c] jẹ́ kí òǹkàwé mọ ìṣètò ọ̀rọ̀ tó túbọ̀ sun mọ́ Gíríìkì.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ìgbàlódé, àti àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, onífẹ̀ẹ́, ó sì yẹ fún lẹ́tà àpọ́sítélì. Arọ́pò-orúkọ “o” pa ẹni kejì ẹyọ kan mọ́ láìlo ọ̀rọ̀ ọlá ọ̀pọ̀ “ẹ” tí ó lè bo iye ẹni mọ́.
