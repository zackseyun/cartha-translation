id: 3JN.1.7
reference: 3 John 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: yo
  text: Nítorí Orúkọ náà ni wọ́n ṣe jáde lọ, wọ́n kò sì gba ohunkóhun lọ́wọ́ àwọn Kèfèrí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àwọn abọ̀rìṣà’ tàbí ‘àwọn aláìgbàgbọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ oníṣe-ẹni kejì ‘Orúkọ náà,’ ὑπέρ ń tọ́ka sí ìdí tàbí ohun tí wọ́n fi ṣe iṣẹ́ náà, kì í ṣe sí ṣíṣe ohun kan ní ipò ẹlòmíràn. ‘Nítorí’ sọ èrò yìí ní Yorùbá àdánidá.
- source_word: τοῦ ὀνόματος
  choice: Orúkọ náà
  rationale: Èdè Gíríìkì sọ ní pàtó pé ‘Orúkọ náà,’ ó sì jẹ́ ọ̀nà ọ̀wọ̀ tí àwọn Kristẹni ìgbà àkọ́kọ́ fi ń tọ́ka sí Jésù/Olúwa láìdárúkọ rẹ̀ ní tààrà. Títọ́jú ọ̀rọ̀ náà bẹ́ẹ̀ kò fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐξῆλθον
  choice: wọ́n ṣe jáde lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n jáde tàbí wọ́n gbéra lọ, ó sì bá ọ̀rọ̀ ìrìn-àjò iṣẹ́ ìránṣẹ́ mu. Ìkọ̀ ‘ni wọ́n ṣe jáde lọ’ so ìgbésẹ̀ náà mọ́ ìdí rẹ̀ lọ́nà Yorùbá tó ṣe déédéé.
- source_word: μηδὲν λαμβάνοντες
  choice: wọn kò sì gba ohunkóhun
  rationale: 'Èyí mú ìtumọ̀ kíkún ti gbólóhùn alábápín náà jáde: nígbà tí wọ́n ń lọ, wọn kò gba ìrànlọ́wọ́ ohun ìní tàbí owó kankan.'
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: lọ́wọ́ àwọn Kèfèrí
  rationale: ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún àwọn tí wọ́n wà níta àwọn ènìyàn Ọlọ́run tàbí ìgbàgbọ́ Kristẹni ní irú àyíká yìí. Ó pa àwọ̀ ìtumọ̀ ẹ̀yà àti ẹ̀sìn inú ἐθνικοί mọ́ ju ‘àwọn aláìgbàgbọ́’ lọ, bí ó tilẹ̀ jẹ́ pé àwọn ìtumọ̀ míì ṣeé ṣe.
theological_decisions:
- issue: Ẹni tí ‘Orúkọ náà’ ń tọ́ka sí
  choice: A fi ọ̀nà ọ̀wọ̀ tí ẹsẹ náà gbà tọ́ka sí Jésù/Olúwa sílẹ̀ gẹ́gẹ́ bí ‘Orúkọ náà.’
  alternative: ‘orúkọ Kristi’ tàbí ‘orúkọ rẹ̀’
  rationale: Àyíká iṣẹ́ ìránṣẹ́ Kristẹni mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí yé, ṣùgbọ́n orísun kò dárúkọ Jésù tàbí Kristi ní tààrà. Ìtumọ̀ náà pa ìfọ̀wọ̀sowọ́pọ̀ àti ìfarasin inú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìtumọ̀ ἐθνικῶν
  choice: ‘àwọn Kèfèrí’ nínú ẹsẹ pàtàkì
  alternative: ‘àwọn abọ̀rìṣà’ tàbí ‘àwọn aláìgbàgbọ́’
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè jẹ́ àmì fún àwọn tí kì í ṣe Kristẹni, ṣùgbọ́n ó tún ní àwọ̀ ìtumọ̀ àwọn orílẹ̀-èdè tí kì í ṣe Júù. ‘Àwọn Kèfèrí’ pa méjèèjì mọ́ dé ìwọ̀n kan; àkọ́silẹ̀ ìsàlẹ̀ sì fi àwọn ìtumọ̀ àyíká hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye. A lo ‘Orúkọ’ pẹ̀lú lẹ́tà ńlá láti fi ipa ọ̀wọ̀ àti ìtọ́kasí pàtàkì rẹ̀ hàn. A gbé àmì àkọ́silẹ̀ [a] sí ẹ̀yìn ‘àwọn Kèfèrí,’ nítorí ibẹ̀ ni àwọn yíyan ọ̀rọ̀ inú àkọ́silẹ̀ ti kan.
