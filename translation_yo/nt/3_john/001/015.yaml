  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: yo
  text: Àlàáfíà fún ọ[a]. Àwọn ọ̀rẹ́ kí ọ. Kí àwọn ọ̀rẹ́ kọ̀ọ̀kan ní orúkọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí àlàáfíà wà pẹ̀lú rẹ.” Gíríìkì túmọ̀ ní tààràtà sí “Àlàáfíà fún ọ,” ìyẹn ìbùkún kúkúrú tí a máa ń lò nínú lẹ́tà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kí àwọn ọ̀rẹ́ kọ̀ọ̀kan.” Gíríìkì sọ ní tààràtà pé “ní orúkọ,” èyí tó tẹnumọ́ pé kí ó kí olúkúlùkù ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Àlàáfíà fún ọ
  rationale: 'Ó pa ìkíni ìbùkún kúkúrú ti Gíríìkì mọ́: ‘àlàáfíà fún ọ,’ láìfi ọ̀rọ̀-ìṣe tí kò sí nínú orísun kún un.'
- source_word: ἀσπάζονταί σε
  choice: kí ọ
  rationale: ‘Kí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìkíni ránṣẹ́ sí ẹnì kan, ó sì bá ìlò lẹ́tà ti ọ̀rọ̀ Gíríìkì mu.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: àwọn ọ̀rẹ́
  rationale: Ó tú φίλοι ní tààràtà gẹ́gẹ́ bí ‘ọ̀rẹ́,’ ó sì pa ọ̀rọ̀ kan náà mọ́ ní ibi méjèèjì láìyí i sí ‘ará.’
- source_word: κατ’ ὄνομα
  choice: ní ọ̀kọ̀ọ̀kan, ní orúkọ
  rationale: Ó jẹ́ kí ìtumọ̀ ti kí olúkúlùkù ní pàtó ṣe kedere, nígbà tí ó tún pa àwòrán ‘ní orúkọ’ ti Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì bá ìparí lẹ́tà mu. Ọ̀rọ̀ arọ́pò-orúkọ ẹyọ ‘ọ’ ni a lò nítorí pé σοι àti σε jẹ́ ẹyọ.
