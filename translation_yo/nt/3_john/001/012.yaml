  source_fidelity: 'Ìtumọ̀ náà gba ìlànà ẹsẹ náà dáadáa: ìfẹ̀sílẹ̀ ti a ti fi hàn fún Demetiriusi láti ọ̀dọ̀ gbogbo ènìyàn, ẹ̀rí òtítọ́ fúnra rẹ̀, àti ẹ̀rí àwọn olùkọ̀wé. Ṣùgbọ́n ‘rere’ nínú ‘jẹ́rìí rere sí’ fi àjẹ́tífù kún μεμαρτύρηται tí Gíríìkì kò sọ ní gbangba. Àyíká ọ̀rọ̀ ń fi hàn pé ẹ̀rí náà jẹ́ ìfọwọ́sí, ṣugbọn ó dára kí ìtumọ̀ pàtàkì má fi ‘rere’ kún un.'
