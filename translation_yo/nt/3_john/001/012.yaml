id: 3JN.1.12
reference: 3 John 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: yo
  text: Gbogbo ènìyàn ti jẹ́rìí sí Demetiriusi[a], òtítọ́ fúnra rẹ̀[b] sì ti jẹ́rìí sí i. Àwa náà sì jẹ́rìí sí i, ìwọ sì mọ̀ pé ẹ̀rí wa jẹ́ òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì náà lo fọ́ọ̀mù perfect passive ti “jẹ́rìí,” tó ń fi hàn pé a ti jẹ́rìí sí Demetiriusi tẹ́lẹ̀, ẹ̀rí náà sì ṣì dúró gẹ́gẹ́ bí ìfẹ̀sílẹ̀ fún un.
    reason: lexical_alternative
  - marker: b
    text: “Òtítọ́ fúnra rẹ̀” lè túmọ̀ sí pé ìgbésí ayé Demetiriusi bá òtítọ́ mu, tàbí, ní ìtumọ̀ tó gbòòrò, pé ìhìn rere/òtítọ́ ń jẹ́rìí fún un.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Demetiriusi
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ọ̀nà tó bá ìró Yorùbá mu, láì túmọ̀ ìtumọ̀ orúkọ náà.
- source_word: μεμαρτύρηται
  choice: ti jẹ́rìí rere sí
  rationale: Ọ̀rọ̀ náà jẹ́ perfect passive, ó sì tọ́ka sí ẹ̀rí ìfọwọ́sí tí a ti fi lélẹ̀, tí ipa rẹ̀ ṣì wà. ‘Rere’ mú kí ìfọwọ́sí inú àyíká ọ̀rọ̀ hàn, bí ó tilẹ̀ jẹ́ pé kò sí ajẹtífù tó túmọ̀ sí ‘rere’ nínú Gíríìkì.
- source_word: ὑπὸ πάντων
  choice: gbogbo ènìyàn
  rationale: ὑπό pẹ̀lú genitive fi àwọn tó ń jẹ́rìí hàn; ìṣètò gbolohun Yorùbá tó jẹ́ ti ara ni a lò.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: òtítọ́ fúnra rẹ̀
  rationale: ‘Fúnra rẹ̀’ pa agbára αὐτῆς mọ́, ‘òtítọ́’ sì mọ̀ọ́mọ̀ kò ṣe àlàyé rẹ̀ sí ‘ìhìn rere’ tàbí ìwà Demetiriusi.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Àwa pẹ̀lú jẹ́rìí sí i
  rationale: ‘Pẹ̀lú’ mú agbára àfikún δέ àti καί jáde ní Yorùbá àdánidá; ‘sí i’ mú ẹni tí ẹ̀rí náà ń tọ́ka sí hàn láti inú àyíká ọ̀rọ̀.
- source_word: οἶδας
  choice: ìwọ mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù rẹ̀ jẹ́ perfect, οἶδα ní ìtumọ̀ ipò ìsinsìnyí nínú Gíríìkì Koine.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: ẹ̀rí wa
  rationale: ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún testimony, ó sì bá ‘jẹ́rìí’ mu ní ìtumọ̀.
- source_word: ἀληθής ἐστιν
  choice: jẹ́ òtítọ́
  rationale: Ìtumọ̀ tààrà yìí tún pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἀληθείας (‘òtítọ́’) tó ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ ‘òtítọ́ fúnra rẹ̀’ nínú ọ̀nà ìsọ̀rọ̀ Johanu
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘òtítọ́ fúnra rẹ̀.’
  alternative: ‘Ìhìn rere fúnra rẹ̀’ tàbí ‘ìgbésí ayé rẹ̀ jẹ́rìí sí i.’
  rationale: Gíríìkì kò fi dájú bóyá òtítọ́ ń tọ́ka sí ìhìn rere tàbí sí bí ìgbésí ayé Demetiriusi ṣe bá òtítọ́ mu. Ìtumọ̀ náà pa àìdánilójú àti ìjinlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A tún ìṣe ‘jẹ́rìí rere sí’ ṣe láti pa ìṣọ̀kan gbólóhùn àti ìtumọ̀ ìfọwọ́sí mọ́; a kò sọ ‘òtítọ́ fúnra rẹ̀’ di ẹ̀kọ́ kan pàtó.
