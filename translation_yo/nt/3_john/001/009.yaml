id: 3JN.1.9
reference: 3 John 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: yo
  text: Mo kọ ohun kan sí ìjọ[a]; ṣùgbọ́n Díótíréfè, ẹni tí ó fẹ́ràn láti jẹ́ ẹni àkọ́kọ́ láàárín wọn, kò gba wa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo kọ ìwé kúkúrú kan sí ìjọ.” Ọ̀rọ̀ Gíríìkì náà sọ láìnídìí pé “Mo kọ ohun kan”; àwọn àfọwọ́kọ kan mú ọ̀rọ̀ ibí yìí gùn sí i.
    reason: textual_variant
  - marker: b
    text: Tàbí, “kò káàbọ̀ fún wa” tàbí “kò mọyì wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Mo kọ
  rationale: Ọ̀rọ̀-ìṣe aorist náà tọ́ka sí ohun tí akọ̀wé ṣe nígbà kan sẹ́yìn; ìgbà àtẹ̀yìnwá rọrùn ni ó bá Yorùbá mu jù.
- source_word: τι
  choice: ohun kan
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìnídìí náà túmọ̀ sí ‘ohun kan’; yíyan èyí kò fi ohun tí Gíríìkì kò sọ kún ọ̀rọ̀ náà.
- source_word: τῇ ἐκκλησίᾳ
  choice: sí ìjọ
  rationale: Ní àyíká yìí, ἐκκλησία ni àwùjọ àwọn onígbàgbọ́ ní agbègbè kan; ‘ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín ohun tí akọ̀wé ṣe àti ìhùwàsí Díótíréfè.
- source_word: ὁ φιλοπρωτεύων
  choice: ẹni tí ó fẹ́ràn láti jẹ́ ẹni àkọ́kọ́
  rationale: Gbólóhùn yìí mú ìfẹ́ rẹ̀ sí ipò àkọ́kọ́ hàn ní èdè Yorùbá àdánidá, láì sọ ọ́ di oyè ìjọ kan pàtó.
- source_word: αὐτῶν
  choice: láàárín wọn
  rationale: Genitive náà tọ́ka sí ẹgbẹ́ tí ó fẹ́ jẹ́ ẹni àkọ́kọ́ nínú rẹ̀; ‘láàárín wọn’ pa ìtumọ̀ yẹn mọ́ láì sọ pé ó ní àṣẹ lórí wọn.
- source_word: Διοτρέφης
  choice: Díótíréfè
  rationale: A ṣe àfọwọ́kọ orúkọ Gíríìkì náà sí bí a ṣe lè pè é ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: kò gba wa
  rationale: ‘Gba wa’ lè ní ìtumọ̀ kíkọ̀ láti káàbọ̀ fún wa, láti tẹ́wọ́ gbà wá, tàbí láti fọwọ́ sí wa; ó pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Irú àtakò tí Díótíréfè ṣe
  choice: kò gba wa
  alternative: kò káàbọ̀ fún wa; kò sì mọyì wa tàbí gba àṣẹ wa
  rationale: ἐπιδέχεται lè tọ́ka sí ìkáàbọ̀, ìtẹ́wọ́gbà ẹni, tàbí fífi ọlá fún aṣojú àti ọ̀rọ̀ rẹ̀. Ìtumọ̀ ‘kò gba wa’ kò fi ipa mú kíkà ẹsẹ náà sí ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní ọlá, tí ó sì yé òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan tàbí fífi oyè ìjọ kan lé Díótíréfè lórí.
