  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: yo
  text: Ṣùgbọ́n mo ní ìrètí pé màá rí ọ láìpẹ́[a], a ó sì bá ara wa sọ̀rọ̀ ní ojúkojú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹnu sí ẹnu.” Gbólóhùn náà túmọ̀ sí ìbánisọ̀rọ̀ tààrà ní ojúkojú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: mo ní ìrètí
  rationale: Ó fi ìrètí tàbí ìfojúsọ́nà ẹni tí ó kọ lẹ́tà hàn ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó pa ìyípadà kékeré àti ìtakora pẹ̀lẹ́ mọ́ láti inú ọ̀rọ̀ tí ó ṣáájú.
- source_word: εὐθέως
  choice: láìpẹ́
  rationale: Ní àyíká ètò ìbẹ̀wò, ọ̀rọ̀ náà túmọ̀ sí pé àkókò náà sún mọ́lé, kì í ṣe dandan pé lẹ́sẹ̀kẹsẹ̀.
- source_word: σε ἰδεῖν
  choice: èmi yóò rí ọ
  rationale: Ó tẹ̀ lé ìtumọ̀ tààrà ‘láti rí ọ,’ láì fi ìtumọ̀ àfikún ‘láti bẹ̀ ọ wò’ sí i.
- source_word: στόμα πρὸς στόμα
  choice: ní ojúkojú
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìjíròrò níwájú ara ẹni; yíyí i ní tààrà sí ‘ẹnu sí ẹnu’ lè mú òye mìíràn wá.
- source_word: λαλήσομεν
  choice: a ó sì bá ara wa sọ̀rọ̀
  rationale: Ó fi ìṣe ọjọ́ iwájú hàn, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe déédé fún ìjíròrò láàárín àwọn ẹni méjì.
