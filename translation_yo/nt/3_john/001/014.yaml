  terminology: “Ìrètí,” “láìpẹ́,” àti “ní ojúkojú” bá ìtumọ̀ àti ìforúkọsílẹ̀ lẹ́tà náà mu. Àlàyé “ẹnu sí ẹnu” pa ìtumọ̀ tààrà στόμα πρὸς στόμα mọ́, nígbà tí “ní ojúkojú” ń fún ni ní ìtumọ̀ Yorùbá tí ó yẹ ní àyíká yìí.
