    rationale: Bí ó tilẹ̀ jẹ́ pé ‘ó’ tọ́ nípa ìtọ́kasí ẹni, ‘òun’ dá ìyàtọ̀ pẹ̀lẹ́ tí demonstrative náà ní hàn dáadáa ní Yorùbá.
  - severity: low
    issue: Ìkọ̀wé ‘tẹ́ńpìlì’ ní nasal ‘ń’ ṣáájú /p/.
    rationale: Nínú ìṣàfihàn ìró Yorùbá, nasal tó ṣáájú /p/ máa ń jẹ́ ‘m’; ‘tẹ́mpìlì’ ni ìkọ̀wé tó yẹ.
