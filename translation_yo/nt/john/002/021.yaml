  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ gírámà Gíríìkì náà dáadáa: ἔλεγεν jẹ́ ìṣe aláìparí, àti περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ ni a ti túmọ̀ ní tààrà. Síbẹ̀, ἐκεῖνος ní ìtẹnumọ́/ìyàtọ̀ díẹ̀ ju ‘ó’ lọ nínú àyíká yìí; ‘òun’ dá ìyàtọ̀ náà sílẹ̀ dáadáa láìṣe é pọ̀jù.'
  naturalness: ‘Òun ń sọ̀rọ̀ nípa ...’ jẹ́ Yorùbá boṣewa, ìgbẹ́kẹ̀lé, tí ó sì rọrùn láti ka. Àmì kọ̀ǹsónáǹtì imú tó bá /p/ mu nínú ọ̀rọ̀ ìyáwó náà yẹ kí ó jẹ́ ‘m’, kì í ṣe ‘ń’.
  terminology: ‘Tẹ́mpìlì’ yẹ fún ναός nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé ìsàlẹ̀ tó ṣàlàyé ìtumọ̀ ‘ibi mímọ́’/agọ́ mímọ́. ‘Ara rẹ̀’ pa ìṣọ̀kan gẹnítífù náà àti àfiwé tí ó wà nínú orísun mọ́.
  issues:
