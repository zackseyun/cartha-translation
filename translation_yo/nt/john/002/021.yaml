source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: yo
  text: Ṣùgbọ́n òun ń sọ̀rọ̀ nípa tẹ́mpìlì ara rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi mímọ́ ara rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, naos, sábà máa ń tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́mpìlì, kì í ṣe gbogbo àgbègbè tẹ́mpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ó
  rationale: Ní àyíká ọ̀rọ̀ yìí, arọ́pò-orúkọ ẹni kẹta tọ́ka sí Jésù lọ́nà àdánidá; títúmọ̀ rẹ̀ ní gígún bí ‘ẹni náà’ yóò fi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ náà fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín àìgbọ́ye àwọn olùgbọ́ ní ẹsẹ tó ṣáájú àti àlàyé tí Johanu ṣe níbí.
- source_word: ἔλεγεν
  choice: ń sọ̀rọ̀
  rationale: Ìṣe aláìparí nínú èdè Gíríìkì ṣàpèjúwe ohun tí Jésù ń sọ nígbà náà; ‘ń sọ̀rọ̀’ pa ìrísí ìṣe yìí mọ́ láìtúmọ̀ rẹ̀ sí ‘ó túmọ̀ sí.’
- source_word: περὶ
  choice: nípa
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún ìtumọ̀ ‘concerning/about.’
- source_word: ναοῦ
  choice: tẹ́ńpìlì
  rationale: ναός lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, ṣùgbọ́n ‘tẹ́ńpìlì’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣeé kà; àlàyé ẹ̀kúnrẹ́rẹ́ wà nínú àlàyé ìsàlẹ̀.
- source_word: σώματος
  choice: ara
  rationale: ‘Ara’ ni ìbámu Yorùbá tààrà fún σῶμα, ó sì pa àwòrán pé ara Jésù ni tẹ́ńpìlì mọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ ohun-ìní náà fi hàn pé ara Jésù fúnra rẹ̀ ni a ń sọ̀rọ̀ nípa rẹ̀.
theological_decisions:
- issue: Àfiwé ara Jésù sí tẹ́ńpìlì
  choice: Pa àfiwé náà mọ́ tààrà gẹ́gẹ́ bí ‘tẹ́ńpìlì ara rẹ̀.’
  alternative: ‘ara rẹ̀ gẹ́gẹ́ bí tẹ́ńpìlì’ tàbí ‘ibi mímọ́ ara rẹ̀’
  rationale: Ètò ọ̀rọ̀ orísun fi tẹ́ńpìlì àti ara rẹ̀ so pọ̀ láìṣàlàyé ẹ̀kọ́ ìgbàgbọ́ sí i; ìtumọ̀ tààrà yìí pa agbára àfiwé àti ìtumọ̀ nípa ẹni Kristi mọ́ láìfi ìtumọ̀ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. ‘Ó ń sọ̀rọ̀’ pa ìṣe aláìparí orísun mọ́; ‘tẹ́ńpìlì ara rẹ̀’ sì pa ìṣọ̀kan àfiwé inú Gíríìkì mọ́.
