id: JHN.2.25
reference: John 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: yo
  text: Kò sì nílò kí ẹnikẹ́ni jẹ́rìí nípa ènìyàn[a], nítorí òun fúnra rẹ̀ mọ ohun tí ó wà nínú ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ẹnì kan” / “ohun tí ó wà nínú ẹnì kan.” Ọ̀rọ̀ Gíríìkì lo “ènìyàn” ní ẹyọ láti tọ́ka sí ẹ̀dá ènìyàn ní gbogbogbò.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: Kò sì nílò
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘ní àìní’ tàbí ‘ní ìdí láti nílò’; ‘kò nílò’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: kí ẹnikẹ́ni jẹ́rìí
  rationale: ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fífi ẹ̀rí sọ; ‘ẹnikẹ́ni’ bá τις mu nínú gbólóhùn tí a sẹ́.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: nípa ènìyàn
  rationale: ἄνθρωπος jẹ́ ẹyọ ọ̀rọ̀ tí a lò ní ìtumọ̀ gbogbogbò fún ẹ̀dá ènìyàn; ‘ènìyàn’ jẹ́ aláìṣègbè, ó sì pa ìṣọ̀kan pẹ̀lú gbólóhùn ìkẹyìn mọ́.
- source_word: αὐτὸς γὰρ
  choice: nítorí òun fúnra rẹ̀
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́, ‘nítorí’ sì fi hàn pé gbólóhùn náà ń ṣàlàyé ìdí.
- source_word: ἐγίνωσκεν
  choice: mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé imperfect lè tọ́ka sí ìmọ̀ tí ó ń bá a lọ tàbí tí ó jẹ́ àbùdá rẹ̀, ‘mọ’ ni ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìṣe ipò yìí.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: ohun tí ó wà nínú ènìyàn
  rationale: Èyí pa ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, láì dín un kù sí èrò inú, ìwà, tàbí ẹ̀dá ènìyàn nìkan.
theological_decisions:
- issue: Ìwọ̀n ìmọ̀ Jésù nípa ènìyàn
  choice: A sọ ọ́ ní tààrà pé òun fúnra rẹ̀ mọ ohun tí ó wà nínú ènìyàn.
  alternative: Ó mọ ohun tí ó wà nínú olúkúlùkù ènìyàn; tàbí ó mọ irú ẹ̀dá ènìyàn lápapọ̀.
  rationale: Ẹyọ ἀνθρώπου/ἀνθρώπῳ lè dúró fún ènìyàn kọ̀ọ̀kan tàbí fún ẹ̀dá ènìyàn lápapọ̀. Ìtumọ̀ náà kò pinnu èyíkéyìí láìsí ẹ̀rí tó pọ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì ṣeé lóye. A tún “ènìyàn” sọ ní ìparí láti pa ìbáramu ọ̀rọ̀ Gíríìkì mọ́.
