id: JHN.2.4
reference: John 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: yo
  text: Jésù sì sọ fún un pé, “Kí ni ó kàn mí àti yín, Obìnrin?[a] Wákàtí mi kò tíì dé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ náà gan-an, “Kí ni èmi àti ìwọ ní í ṣe pẹ̀lú ara wa?” Àkànlò èdè yìí ń fi ìjìnnà nínú ọ̀ràn tàbí ohun tí ẹnì kọ̀ọ̀kan ní lọ́kàn hàn; kò pọn dandan kí ó túmọ̀ sí ìkórìíra. “Obìnrin” jẹ́ ọ̀nà ìpè tí ó lè ní ọ̀wọ̀ ní àyíká ìgbà náà, bí ó tilẹ̀ jẹ́ pé ó lè dún bí ọ̀rọ̀ líle tàbí òjijì ní Yorùbá òde òní. “Yín” níbí jẹ́ ọ̀rọ̀ ìbòwò fún ẹni kan.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú ìtàn, lílo “sọ” nínú àsìkò tí ó ti kọjá bá ìròyìn Yorùbá mu dáadáa, kò sì yí iṣẹ́ ọ̀rọ̀ náà padà.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Kí ni èyí jẹ mọ́ tèmi àti tiyín?
  rationale: 'Èyí fi àkànlò èdè náà hàn ní Yorùbá àdánidá: ó ń fi àlà tàbí ìyàtọ̀ nínú ohun tí ẹnì kọ̀ọ̀kan ní lọ́kàn hàn, láì sọ ọ́ di ọ̀rọ̀ ìkórìíra tàbí ìkọlù líle.'
- source_word: γύναι
  choice: Obìnrin
  rationale: Ìtumọ̀ tààrà ni “obìnrin.” A kò fi ọ̀rọ̀ onífẹ̀ẹ́ kún un, bẹ́ẹ̀ ni a kò sọ ọ́ di ẹ̀gàn; àlàyé ìsàlẹ̀ ojú ìwé ń ṣàlàyé bí a ṣe máa ń lo irú ìpè yìí ní àyíká ìgbà náà.
- source_word: οὔπω
  choice: kò tíì
  rationale: “Kò tíì” fi hàn ní kedere pé àsìkò náà kò dé títí di àkókò tí a ń sọ̀rọ̀, ṣùgbọ́n ó lè dé lẹ́yìn náà.
- source_word: ἥκει
  choice: dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwá tàbí dídé; “dé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá pẹ̀lú “wákàtí.”
- source_word: ἡ ὥρα μου
  choice: wákàtí mi
  rationale: “Wákàtí mi” pa àwòrán “wákàtí” inú Jòhánù mọ́, èyí tí ó lè tọ́ka sí àkókò tí a yàn fún iṣẹ́ Jésù àti ògo rẹ̀, láì ṣe àlàyé ìtumọ̀ náà jù nínú ẹsẹ̀.
theological_decisions:
- issue: Ohùn àti agbára ọ̀rọ̀ Jésù sí ìyá rẹ̀
  choice: Ìdáhùn tí ó ní ọ̀wọ̀ ṣùgbọ́n tí ó fi àlà sí ọ̀ràn náà
  alternative: Ìbáwí líle tàbí ọ̀rọ̀ onífẹ̀ẹ́ gan-an
  rationale: Àkànlò “Τί ἐμοὶ καὶ σοί” fi ìjìnnà tàbí ìyàtọ̀ nínú ohun tí wọ́n ní lọ́kàn hàn, nígbà tí “γύναι” kò pọn dandan kí ó jẹ́ ẹ̀gàn. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ àti ìdọ̀tí inú ọ̀rọ̀ Gíríìkì mọ́ láì pinnu rẹ̀ ju ẹ̀rí lọ.
- issue: Ìtumọ̀ “wákàtí mi” nínú ẹ̀kọ́ ìwé Jòhánù
  choice: Wákàtí tí a yàn fún Jésù, tí ó ní ìtumọ̀ tó jinlẹ̀ sí iṣẹ́ àti ògo rẹ̀
  alternative: Àkókò iṣẹ́ àmì yìí nìkan, tàbí àkókò lásán tí kò ní ìtumọ̀ àkànṣe
  rationale: Nínú Jòhánù, “wákàtí” jẹ́ ọ̀rọ̀ àkòrí tí ó sábà máa ń ní í ṣe pẹ̀lú iṣẹ́ Jésù, ìjìyà, ikú, àjíǹde àti ògo rẹ̀. Fífi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí “wákàtí” jẹ́ kí òǹkàwé rí ìbáṣepọ̀ náà láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Tiyín” jẹ́ ọ̀nà ọ̀wọ̀ tí Yorùbá máa ń lò sí ẹni àgbà tàbí ìyá; ó kò mú ìtumọ̀ ọ̀pọ̀ ènìyàn wọ inú ọ̀rọ̀ Gíríìkì. A pa “obìnrin” àti “wákàtí mi” mọ́ láti dáàbò bo ìdọ̀tí inú ọ̀rọ̀ àti àkòrí ìwé Jòhánù.
