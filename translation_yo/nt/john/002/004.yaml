revisions:
- from: Jésù sì sọ fún un pé, “Kí ni èyí jẹ mọ́ tèmi àti tiyín?[a] Obìnrin,[b] wákàtí mi kò tíì dé.”
  to: Jésù sì sọ fún un pé, “Kí ni ó kàn mí àti yín, Obìnrin?[a] Wákàtí mi kò tíì dé.”
  rationale: Àtúnṣe náà rọ́pò ìtúmọ̀ àkànlò tí kò wọ́pọ̀ nínú Yorùbá pẹ̀lú “Kí ni ó kàn mí àti yín?”, tí ó fi ìjìnnà tàbí ìyàtọ̀ nínú ọ̀ràn náà hàn láì sọ ọ́ di ìbínú tàbí ìkórìíra. A pa “Obìnrin” àti “Wákàtí mi kò tíì dé” mọ́ gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì. A so àlàyé méjèèjì pọ̀ sí àkọsílẹ̀ kan nítorí ìpè náà wà ní inú gbolohun kan náà, àti láti ṣàlàyé lílo “yín” gẹ́gẹ́ bí ìbòwò fún ẹni kan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the Greek sequence and central sense: Jesus responds to her, uses a distancing idiom without making it openly hostile, addresses her as γύναι, and says that his hour has not yet arrived. However, “Kí ni èyí jẹ mọ́ tèmi àti tiyín?” is not an idiomatic or sufficiently clear Yoruba equivalent for Τί ἐμοὶ καὶ σοί.'
  naturalness: Replace the awkward possessive construction “jẹ mọ́ tèmi àti tiyín” with the natural Yoruba idiomatic question “Kí ni ó kàn mí àti yín?” The respectful singular use of yín is appropriate in address to Jesus’ mother, provided the note explains it.
  terminology: “Obìnrin” appropriately retains γύναι without importing either affection or contempt; the cultural note properly qualifies its historical pragmatics. “Wákàtí mi” faithfully retains the Johannine wording and resonance. “kò tíì dé” accurately conveys οὔπω ἥκει.
  issues:
  - severity: medium
    issue: The rendering of Τί ἐμοὶ καὶ σοί is unnatural and semantically opaque.
    rationale: “Kí ni èyí jẹ mọ́ tèmi àti tiyín?” uses possessive forms in a way that does not naturally express the Yoruba equivalent of ‘What is this to me and to you?’ and may obscure the idiom’s distancing force. “Kí ni ó kàn mí àti yín?” is clear, natural, and maintains the source’s restrained ambiguity.
  revised_text: Jésù sì sọ fún un pé, “Kí ni ó kàn mí àti yín, Obìnrin?[a] Wákàtí mi kò tíì dé.”
