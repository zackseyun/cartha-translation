id: JHN.2.13
reference: John 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: yo
  text: Àjọ Ìrékọjá àwọn Júù sì ti sún mọ́lé[a], Jésù sì gòkè lọ sí Jerúsálẹ́mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àjọ Ìrékọjá àwọn ará Jùdíà.” Nínú Jòhánù, Ἰουδαῖοι lè túmọ̀ sí “àwọn ará Jùdíà” dípò “àwọn Júù” ní àwọn àyíká kan; ṣùgbọ́n níhìn-ín, ó ṣeé ṣe jù pé ó ń dá àjọ náà mọ̀ gẹ́gẹ́ bí àjọ àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: ti sún mọ́lé
  rationale: Ó ń tọ́ka sí bí àkókò àjọ náà ti sún mọ́lé; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìsúnmọ́ àkókò mọ́.
- source_word: πάσχα
  choice: Àjọ Ìrékọjá
  rationale: Èyí ni orúkọ Yorùbá tó ṣe kedere fún àjọ ìrántí ìrékọjá náà.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú ọ̀rọ̀ yìí, gbólóhùn náà ń dá àjọ náà mọ̀ gẹ́gẹ́ bí àjọ àwọn Júù; a fi ìtumọ̀ míì tí ó ṣeé ṣe sí àlàyé ìsàlẹ̀.
- source_word: ἀνέβη
  choice: gòkè lọ
  rationale: Ó pa àwòrán ìrìnàjò gòkè lọ sí Jerúsálẹ́mù mọ́, ní ti ibi gíga àti ní ti èdè ìrìn-àjò ìjọsìn.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọtọ̀ Yorùbá tí ó wọ́pọ̀ fún orúkọ ìlú náà.
- source_word: Καὶ
  choice: sì
  rationale: Ẹ̀ka méjèèjì ni καί so pọ̀. ‘Sì’ jẹ́ àsopọ̀ ìtàn tí ó bá èdè Yorùbá mu láìfi ọ̀rọ̀ àkókò tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖοι nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣàpèjúwe Ìrékọjá gẹ́gẹ́ bí àjọ àwọn Júù lápapọ̀, kì í ṣe ẹgbẹ́ agbègbè tàbí ẹgbẹ́ alátakò kan pàtó. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘àwọn ará Jùdíà’ tí ọ̀rọ̀ náà lè ní ní àwọn àyíká kan mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá bá àdánidá mu; a sì lo ‘sì’ láti gbé ìtẹ̀síwájú ìtàn àti àsopọ̀ καί méjèèjì jáde.
