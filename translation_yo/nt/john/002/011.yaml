id: JHN.2.11
reference: John 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: yo
  text: Èyí ni Jésù ṣe gẹ́gẹ́ bí ìbẹ̀rẹ̀ àwọn àmì rẹ̀ ní Kánà ti Galili[a]. Ó fi ògo rẹ̀ hàn, àwọn ọmọ-ẹ̀yìn rẹ̀ sì gbà á gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àmì àkọ́kọ́ nínú àwọn àmì rẹ̀.”
    reason: Ọ̀rọ̀ ἀρχὴν τῶν σημείων lè túmọ̀ sí “ìbẹ̀rẹ̀ àwọn àmì” tàbí “àmì àkọ́kọ́ nínú àwọn àmì rẹ̀.”
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: ṣe èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe; “ṣe èyí” pa ìrọ̀rùn Gíríìkì mọ́ láìfi “iṣẹ́ ìyanu” tàbí “àmì” kún un níbi tí kò sí nínú gbólóhùn náà.
- source_word: ἀρχὴν τῶν σημείων
  choice: gẹ́gẹ́ bí ìbẹ̀rẹ̀ àwọn àmì rẹ̀
  rationale: “Ìbẹ̀rẹ̀” ṣàfihàn ἀρχή ní tààrà, ó sì jẹ́ kí a mọ̀ pé iṣẹ́ yìí ló bẹ̀rẹ̀ ọ̀wọ́ àwọn àmì Jésù. “Rẹ̀” wá láti inú àyíká ọ̀rọ̀.
- source_word: σημείων
  choice: àwọn àmì
  rationale: Nínú Jòhánù, σημεῖον ń tọ́ka sí iṣẹ́ tí ó ń fi ẹni tí Jésù jẹ́ hàn, kì í ṣe ìfihàn agbára lásán; “àmì” pa ìtumọ̀ pàtàkì yìí mọ́ ju “iṣẹ́ ìyanu” lọ.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ní Kánà ti Galili
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ibi náà, ó sì pa ìbáṣepọ̀ Kánà pẹ̀lú Galili mọ́.
- source_word: ἐφανέρωσεν τὴν δόξαν αὐτοῦ
  choice: Ó fi ògo rẹ̀ hàn
  rationale: “Fi … hàn” jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣí ohun kan payá tàbí mímú un hàn; “ògo” sì pa ọ̀rọ̀ ẹ̀kọ́-ìgbàgbọ́ δόξα mọ́.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: gbà á gbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ìgbàgbọ́ àti ìgbẹ́kẹ̀lé tí a darí sí Jésù.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún àwọn tí wọ́n ń tẹ̀ lé Jésù gẹ́gẹ́ bí olùkọ́ wọn.
theological_decisions:
- issue: Ìlò ọ̀rọ̀ σημεῖον nínú Jòhánù
  choice: àwọn àmì
  alternative: àwọn iṣẹ́ ìyanu
  rationale: '“Àmì” pa ipa ìṣípayá àwọn iṣẹ́ náà mọ́: wọ́n ń tọ́ka rékọjá ara wọn sí ẹni tí Jésù jẹ́ àti sí ògo rẹ̀, láìsẹ́ ìtumọ̀ agbára wọn kù.'
- issue: Agbára ọ̀rọ̀ ἀρχὴν τῶν σημείων
  choice: gẹ́gẹ́ bí ìbẹ̀rẹ̀ àwọn àmì rẹ̀
  alternative: gẹ́gẹ́ bí àmì rẹ̀ àkọ́kọ́
  rationale: “Ìbẹ̀rẹ̀” dúró sún mọ́ ἀρχή, ṣùgbọ́n “àmì àkọ́kọ́” tún jẹ́ ìtumọ̀ tó ṣeé ṣe. A pa ọ̀nà kejì mọ́ nínú àlàyé ìsàlẹ̀ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún gbogbo ènìyàn ni a lò. A lo “àmì” ní ìṣọ̀kan pẹ̀lú ìlò pàtàkì ọ̀rọ̀ náà nínú Ìhìn Rere Jòhánù; àwọn àmì ohùn ni a fi sí ibi tí wọ́n ti yẹ.
