  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn èrò pàtàkì Gíríìkì mọ́: Jésù ni olùṣe, èyí ni ìbẹ̀rẹ̀ àwọn àmì, ibi náà ni Kánà ti Galili, ó fi ògo rẹ̀ hàn, àwọn ọmọ-ẹ̀yìn rẹ̀ sì gbà á gbọ́. Ṣùgbọ́n ìtòlẹ́sẹẹsẹ lọwọlọwọ, “ṣe èyí ní Kánà ... gẹ́gẹ́ bí ìbẹ̀rẹ̀,” lè jẹ́ kí “ní Kánà” dà bí apá tí ó sún mọ́ ìbẹ̀rẹ̀ ju iṣẹ́ Jésù lọ. Àtúnṣe náà mú ìsopọ̀ appositional ti ἀρχὴν τῶν σημείων hàn kedere.'
