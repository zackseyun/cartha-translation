  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ gírámà Gíríìkì dáadáa: ‘rántí,’ ìtọ́kasí Ìwé Mímọ́, àti ọjọ́ iwájú nínú καταφάγεταί. Ṣùgbọ́n ‘yóò jó mi run’ yí àwòrán ‘jẹ/devour, consume’ ti καταφάγεταί padà sí ‘burn,’ èyí tí kò péye.'
  naturalness: ‘A ti kọ ọ́ sílẹ̀ pé’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì wọ́pọ̀ fún ìlànà ìtọ́kasí Ìwé Mímọ́. ‘Yóò jẹ mí run’ pa àwòrán ọ̀rọ̀ náà mọ́, ó sì jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá nínú àyọlò yìí.
