source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ rántí pé a ti kọ ọ́ sílẹ̀ pé, “Ìtara fún ilé rẹ yóò jẹ mí run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti jẹ mí run,” gẹ́gẹ́ bí ọ̀rọ̀ Sáàmù 69:9 ṣe rí nínú àwọn ìtàn ọ̀rọ̀ kan; ṣùgbọ́n èdè Gíríìkì Jòhánù níbí sọ pé, “yóò jẹ mí run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: rántí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé àwọn ọmọ-ẹ̀yìn náà rántí ohun tí a ti kọ; ‘rántí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó sì ṣe kedere.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ìtumọ̀ Májẹ̀mú Tuntun tó wọ́pọ̀ fún μαθητής, ó sì fi ìbáṣepọ̀ wọn pẹ̀lú Jésù hàn.
- source_word: γεγραμμένον ἐστίν
  choice: a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bójú mu láti gbé ọ̀rọ̀ ìtọ́kasí Ìwé Mímọ́ jáde, ó sì pa ìtumọ̀ perfect náà mọ́ pé ohun tí a kọ ṣì dúró.
- source_word: ζῆλος
  choice: ìtara
  rationale: ‘Ìtara’ sọ ìfọkànsìn àti ìfẹ́ líle tí ζῆλος ní nínú àyọlò yìí, láìfi èrò owú kún un.
- source_word: τοῦ οἴκου σου
  choice: fún ilé rẹ
  rationale: A pa ‘ilé’ mọ́ dípò ‘tẹ́ńpìlì’ nítorí pé ọ̀rọ̀ àyọlò Sáàmù náà ni ‘ilé,’ bí ó tilẹ̀ jẹ́ pé ilé Ọlọ́run ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: καταφάγεταί με
  choice: yóò jó mi run
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ọjọ́ iwájú, ó sì ní àwòrán ohun tí ń jẹ tàbí ń run ẹni. ‘Yóò jó mi run’ jẹ́ àdánidá pẹ̀lú ‘ìtara’ ní Yorùbá, ó sì pa agbára àwòrán ìparun náà mọ́.
theological_decisions:
- issue: Ìṣe ọjọ́ iwájú nínú àyọlò Sáàmù tí a lò sí Jésù
  choice: 'A pa ọ̀rọ̀ ọjọ́ iwájú mọ́: “yóò jó mi run.”'
  alternative: “ti jó mi run” tàbí “ti jẹ mí run.”
  rationale: SBLGNT ní καταφάγεταί, ọ̀rọ̀ ọjọ́ iwájú. Nítorí náà, a kò mú ọ̀rọ̀ Jòhánù bá àwọn àṣà ọ̀rọ̀ Sáàmù tí ó ní ìṣe àtijọ́ mu.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn. A lo ‘sì’ láti so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú. A fi àmì àlàyé [a] sí òpin àyọlò, níbi tí ó ti ń ṣàlàyé ìyàtọ̀ ọ̀rọ̀-ìṣe náà.
