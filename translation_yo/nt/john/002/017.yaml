    rationale: Nítorí ìyàtọ̀ ẹsẹ̀ náà kan àkókò ọ̀rọ̀-ìṣe, kì í ṣe ìyípadà láti ‘jẹ’ sí ‘jó,’ ó yẹ kí ìtumọ̀ yíyàn náà lo ‘ti jẹ mí run.’
