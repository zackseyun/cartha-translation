revisions:
- from: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì rántí pé a ti kọ ọ́ pé, “Ìtara fún ilé rẹ yóò jó mi run.”[a]
  to: Àwọn ọmọ-ẹ̀yìn rẹ̀ rántí pé a ti kọ ọ́ sílẹ̀ pé, “Ìtara fún ilé rẹ yóò jẹ mí run.”[a]
  rationale: A rọ́pò ‘jó mi run’ pẹ̀lú ‘jẹ mí run’ láti tú καταφάγεταί (‘will consume/devour me’) ní ìbámu pẹ̀lú orísun Gíríìkì, láìyí ọjọ́ iwájú rẹ̀ padà. A tún ṣe ìtọ́kasí Ìwé Mímọ́ náà ní ‘a ti kọ ọ́ sílẹ̀ pé,’ kí ó le jẹ́ Yorùbá boṣewa tó mọ́gbọ́n dání.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:30Z'
