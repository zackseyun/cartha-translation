  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: yo
  text: Ṣùgbọ́n Jésù fúnra rẹ̀ kò fi ara rẹ̀ lé wọn lọ́wọ́[a], nítorí ó mọ gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀-ìṣe kan náà ni èdè Gíríìkì lò bíi ti ẹsẹ tó ṣáájú: ọ̀pọ̀ ènìyàn “gba Jésù gbọ́,” ṣùgbọ́n Jésù kò “fi ara rẹ̀ lé wọn lọ́wọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Ṣùgbọ́n Jésù fúnra rẹ̀
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ hàn, “fúnra rẹ̀” sì pa ìtẹnumọ́ αὐτός mọ́.
- source_word: οὐκ ἐπίστευεν
  choice: kò fi ara rẹ̀ lé … lọ́wọ́
  rationale: Níhìn-ín πιστεύω ní ẹni gẹ́gẹ́ bí ohun tí a fi ara ẹni lé lọ́wọ́; ọ̀rọ̀ Yorùbá yìí sọ ìgbẹ́kẹ̀lé àti fífi ara ẹni sí abẹ́ ìtọ́jú wọn lọ́nà àdánidá. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní àkókò imperfect, “kò fi” lè sọ ìṣe tí ó ń bá a lọ nínú àyíká ìtàn yìí láì mú kí gbolohun le.
- source_word: αὑτὸν αὐτοῖς
  choice: ara rẹ̀ lé wọn lọ́wọ́
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ arọ́pò onítọ́kasí ẹni fúnra rẹ̀ àti ẹni tí a fi ara ẹni lé lọ́wọ́ mọ́.
- source_word: διὰ τὸ
  choice: nítorí
  rationale: διά pẹ̀lú infinitive tí article ṣáájú rẹ̀ ń sọ ìdí; “nítorí” ni ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu.
- source_word: αὐτὸν γινώσκειν
  choice: ó mọ
  rationale: A sọ gbólóhùn infinitive náà di gbólóhùn pípé ní Yorùbá; γινώσκω níhìn-ín túmọ̀ sí mímọ̀ tàbí òye nípa ẹni.
- source_word: πάντας
  choice: gbogbo ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; yíyan “gbogbo ènìyàn” tún mú ohun tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Bí a ṣe máa fi ìbáṣepọ̀ πιστεύω nínú ẹsẹ 23–24 hàn
  choice: Lo “gbà … gbọ́” ní ẹsẹ 23, kí a sì lo “fi ara rẹ̀ lé … lọ́wọ́” ní ẹsẹ 24, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
  alternative: Lo gbólóhùn kan náà ní ẹsẹ méjèèjì, bí ó tilẹ̀ jẹ́ pé yóò le tàbí kò ní ṣe kedere ní Yorùbá.
  rationale: Gíríìkì mọ̀ọ́mọ̀ tún ọ̀rọ̀-ìṣe kan náà lò, ṣùgbọ́n ìtumọ̀ rẹ̀ yàtọ̀ gẹ́gẹ́ bí ìṣètò gbólóhùn. Ìtumọ̀ yìí pa ìtumọ̀ àdánidá mọ́, ó sì jẹ́ kí àlàyé ìsàlẹ̀ tọ́ka sí eré-ọ̀rọ̀ náà.
- issue: Ìwọ̀n àwọn tí πάντας kàn
  choice: gbogbo ènìyàn
  alternative: gbogbo wọn; gbogbo ọkùnrin
  rationale: Ẹsẹ náà sọ pé ìmọ̀ Jésù kan gbogbo ènìyàn, láì dín wọn kù sí ẹgbẹ́ kan pàtó tàbí fi ẹ̀kọ́ mìíràn kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bá ìgbà mu, tó níyì, tó sì ṣeé yé fún gbogbo ènìyàn. “Fi ara rẹ̀ lé wọn lọ́wọ́” jẹ́ ọ̀nà àdánidá láti sọ fífi ara ẹni sí ìgbẹ́kẹ̀lé ẹlòmíràn; a pa àwọn àmì ohùn mọ́ níbi tí wọ́n ti yẹ.
