source:
  edition: SBLGNT
  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: yo
  text: Nígbà tí wáìnì náà tán[a], ìyá Jesu sọ fún un[b] pé, “Wọ́n kò ní wáìnì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, “nígbà tí wáìnì kò tó mọ́.”
    reason: lexical_alternative
  - marker: b
    text: 'Nínú Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní àkókò òde òní nínú ìtàn: “ń sọ.” Yorùbá lè lo “sọ” nínú ìtàn láìfi àmì àkókò sí ọ̀rọ̀-ìṣe náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: Nígbà tí ọtí wáìnì náà tán
  rationale: Gbólóhùn yìí sọ àyíká ìṣẹ̀lẹ̀ tó ṣáájú ọ̀rọ̀ ìyá Jesu ní Yorùbá àdánidá. ‘Tán’ fi hàn pé ọtí wáìnì kò sí mọ́, láìsọ ju ohun tí Gíríìkì sọ lọ.
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀-ìṣe Yorùbá kì í yí fọ́ọ̀mù gẹ́gẹ́ bí àkókò bí ti Gíríìkì; ‘sọ’ bá ìtàn Yorùbá mu, ó sì lè gbé ìtumọ̀ present historical Gíríìkì láìfi àkókò míì kún un.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ìyá Jesu
  rationale: Èyí tẹ̀ lé ọ̀nà tí Jòhánù gbà ń tọ́ka sí i, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: πρὸς αὐτόν
  choice: fún un
  rationale: Pẹ̀lú ‘sọ,’ ‘fún un’ ni ọ̀nà Yorùbá àdánidá láti fi ẹni tí a bá sọ̀rọ̀ hàn.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Wọn kò ní ọtí wáìnì
  rationale: A fi olùṣe ọ̀pọ̀ tí kò hàn gbangba sílẹ̀ gẹ́gẹ́ bí ‘wọn,’ láìsọ pé àwọn wo gan-an ni. Gbólóhùn náà pa ọ̀rọ̀ ìyá Jesu mọ́ ní kúkúrú àti tààrà.
- source_word: οἶνος
  choice: ọtí wáìnì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún wáìnì; kò sí ohun kan nínú àyíká ọ̀rọ̀ tó béèrè pé kí a dín ìtumọ̀ rẹ̀ kù tàbí kí a pè é ní ohun mímu lásán.
theological_decisions:
- issue: Present historical nínú ìtàn Jòhánù
  choice: Lo ‘sọ,’ ọ̀rọ̀-ìṣe Yorùbá tí kò ní àmì àkókò nínú ara rẹ̀
  alternative: Lo ‘ó sì wí’ tàbí gbólóhùn tí yóò túmọ̀ rẹ̀ ní pàtó sí ohun tó ti kọjá
  rationale: Yorùbá kò ní ìyàtọ̀ fọ́ọ̀mù present/past lórí ọ̀rọ̀-ìṣe bí Gíríìkì. ‘Sọ’ jẹ́ àdánidá, ó sì yẹra fún fífi ìtumọ̀ àkókò tí kò pọndandan kún un.
- issue: Ẹni tí ‘wọn’ ń tọ́ka sí nínú ‘Wọn kò ní ọtí wáìnì’
  choice: Fi sílẹ̀ gẹ́gẹ́ bí ‘wọn’
  alternative: Sọ ní pàtó pé àwọn olùgbàlejò tàbí àwọn ará ibi ìgbéyàwó ni
  rationale: Gíríìkì kò dárúkọ ẹni tí ọ̀rọ̀-ìṣe ọ̀pọ̀ náà ń tọ́ka sí. ‘Wọn’ pa àìsọ pàtó yẹn mọ́, kò sì fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: A lo Yorùbá boṣewa tó ṣe kedere, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. ‘Ọtí wáìnì’ yẹra fún àìmọ̀ tí ‘wáìnì’ nìkan lè fa, nígbà tí ‘ìyá Jesu’ àti ‘wọn’ pa ọ̀nà ìtọ́kasí Gíríìkì mọ́.
