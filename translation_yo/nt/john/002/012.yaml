id: JHN.2.12
reference: John 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: yo
  text: Lẹ́yìn èyí, ó sọ̀kalẹ̀ lọ sí Kápánáúmù, òun àti ìyá rẹ̀, àwọn arákùnrin rẹ̀[a], àti àwọn ọmọ-ẹ̀yìn rẹ̀; wọ́n kò sì dúró níbẹ̀ fún ọjọ́ púpọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìbátan rẹ̀” tàbí “àwọn mọ̀lẹ́bí rẹ̀”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn arákùnrin ní ìtumọ̀ tóóró, tàbí, ní àwọn àyíká kan, ìbátan ẹbí tó gbòòrò sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Lẹ́yìn èyí
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìyípadà àkókò hàn, ó sì pa agbára ẹyọ ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: κατέβη
  choice: ó sọ̀kalẹ̀ lọ
  rationale: Ó pa ìtumọ̀ ìrìn-àjò sísàlẹ̀ mọ́, ó sì bá ìrìn láti Kánà lọ sí Kápánáúmù mu.
- source_word: εἰς Καφαρναοὺμ
  choice: sí Kápánáúmù
  rationale: Àṣàyàn 'sí' jẹ́ ọ̀nà Yorùbá àdánidá fún ibi tí ẹnì kan ń lọ; a kọ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: αὐτὸς
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà dúró ní kedere nínú Gíríìkì, ó sì ṣàfihàn ẹni pàtàkì nínú ẹgbẹ́ tí a mẹ́nu kàn.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ìyá rẹ̀
  rationale: Èyí túmọ̀ gẹ́gẹ́ bí Gíríìkì láìfi orúkọ Màríà kún ohun tí ẹsẹ náà kò sọ.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ akọ ní ọ̀pọ̀, ìtumọ̀ rẹ̀ tó sún mọ́ jù ni àwọn arákùnrin; àlàyé ìbátan tó lè gbòòrò sí i wà nínú àlàyé ìsàlẹ̀.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ akẹ́kọ̀ọ́ àti olùtẹ̀lé mọ́.
- source_word: ἐκεῖ ἔμειναν
  choice: wọ́n sì dúró níbẹ̀
  rationale: Ọ̀rọ̀-ìṣe ọ̀pọ̀ náà tọ́ka sí gbogbo ẹgbẹ́; gbólóhùn yìí sì jẹ́ Yorùbá àdánidá.
- source_word: οὐ πολλὰς ἡμέρας
  choice: fún ọjọ́ tí kò pọ̀
  rationale: Ó pa ọ̀nà tí Gíríìkì gbà sọ pé ọjọ́ náà kò pọ̀ mọ́, dípò yíyí i padà sí 'ọjọ́ díẹ̀'.
theological_decisions:
- issue: Ìtumọ̀ οἱ ἀδελφοὶ nípa ìbátan wọn pẹ̀lú Jésù
  choice: àwọn arákùnrin rẹ̀
  alternative: àwọn ìbátan rẹ̀ tàbí àwọn mọ̀lẹ́bí rẹ̀
  rationale: Ìtumọ̀ tààrà tó wọ́pọ̀ jù lọ fún ọ̀rọ̀ akọ ọ̀pọ̀ náà ni 'àwọn arákùnrin.' Àmọ́ nítorí pé ní àwọn àyíká kan ó lè tọ́ka sí ìbátan ẹbí tó gbòòrò, àlàyé ìsàlẹ̀ pa àṣàyàn yẹn mọ́ láìdáhùn àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ kan nípasẹ̀ ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo 'Jésù' nínú àlàyé nìkan; a kò fi orúkọ náà kún ẹsẹ tí Gíríìkì kò ti sọ ọ́.
