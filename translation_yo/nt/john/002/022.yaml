id: JHN.2.22
reference: John 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: yo
  text: Nítorí náà, nígbà tí a jí i dìde kúrò láàárín àwọn òkú,[a] àwọn ọmọ-ẹ̀yìn rẹ̀ rántí pé ó ti ń sọ èyí,[b] wọ́n sì gba Ìwé Mímọ́ àti ọ̀rọ̀ tí Jésù sọ gbọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jí dìde kúrò láàárín àwọn òkú.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn ìṣe-àìṣe (“a jí i dìde”), èyí tí a pa mọ́ nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń sọ èyí” tàbí “ó sọ èyí.” Ìrísí ọ̀rọ̀-ìṣe Gíríìkì lè tọ́ka sí ọ̀rọ̀ tí ń lọ tàbí tí a sọ léraléra ní àkókò ìṣáájú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gbólóhùn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ tí a sọ, gbólóhùn, tàbí ìhìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: “Nígbà tí” mú ìtumọ̀ àkókò ὅτε jáde, “nítorí náà” sì pa ipa ìtẹ̀síwájú àti àbájáde οὖν mọ́ ní Yorùbá àdánidá.
- source_word: ἠγέρθη
  choice: a jí i dìde
  rationale: Èyí pa ohùn àìṣe ti Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún jíjí Jesu dìde nínú òkú.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó ṣàfihàn ẹ̀kúnrẹ́rẹ́ ọ̀rọ̀ Gíríìkì tó túmọ̀ sí jíjí kúrò láàárín àwọn tí ó kú, láìsọ ọ̀rọ̀ náà di èrò ẹ̀kọ́ kan pàtó.
- source_word: ἐμνήσθησαν
  choice: rántí
  rationale: Ọ̀rọ̀ Yorùbá yìí ni ó bá ìtumọ̀ wíwọ ohun tí ó ti ṣẹlẹ̀ padà sí ọkàn mu jù lọ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún àwọn tí ń tẹ̀lé Jesu gẹ́gẹ́ bí akẹ́kọ̀ọ́ rẹ̀.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: pé ó ti ń sọ èyí
  rationale: “Ti ń sọ” fi àbùdá imperfect ἔλεγεν hàn bí ọ̀rọ̀ tí ń lọ ní àkókò ìṣáájú, nígbà tí “pé” ṣe àgbékalẹ̀ ohun tí wọ́n rántí.
- source_word: ἐπίστευσαν
  choice: wọ́n ... gba ... gbọ́
  rationale: “Gba ... gbọ́” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún gbígbà pé ohun tí Ìwé Mímọ́ àti ọ̀rọ̀ Jesu sọ jẹ́ òótọ́, láìfikún ìtumọ̀ ẹ̀kọ́ mìíràn.
- source_word: τῇ γραφῇ
  choice: Ìwé Mímọ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì fún γραφή gẹ́gẹ́ bí àkọsílẹ̀ mímọ́ tí ó ní àṣẹ; fọ́ọ̀mù ẹyọ ọ̀rọ̀ Gíríìkì ni a pa mọ́.
- source_word: τῷ λόγῳ
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” lè tọ́ka sí ohun tí Jesu sọ, ó sì pa ìbáṣepọ̀ pẹ̀lú λόγος mọ́ láìfi “iṣẹ́” tàbí “ìhìn” tí kò pọndandan kún un.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: tí Jesu sọ
  rationale: Gbólóhùn ìbátan yìí so “ọ̀rọ̀” mọ́ Jesu ní ọ̀nà Yorùbá tó rọrùn, ó sì tọ́ka sí ohun tí ó ti sọ ṣáájú.
theological_decisions:
- issue: Ohùn ọ̀rọ̀-ìṣe nípa àjíǹde
  choice: a jí i dìde kúrò láàárín àwọn òkú
  alternative: ó jí dìde kúrò láàárín àwọn òkú
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àìṣe, nítorí náà àkọ́kọ́ pa ìrísí gírámà náà mọ́ láìkọ́ ohun tí àwọn ẹsẹ Bíbélì mìíràn sọ nípa àjíǹde.
- issue: Ìtumọ̀ πιστεύω pẹ̀lú àwọn ohun tí a gbà gbọ́
  choice: wọ́n gba Ìwé Mímọ́ àti ọ̀rọ̀ ... gbọ́
  alternative: wọ́n ní ìgbàgbọ́ nínú Ìwé Mímọ́ àti ọ̀rọ̀ náà
  rationale: “Gba ... gbọ́” tẹ̀lé ohun tí ẹsẹ náà sọ pé wọ́n gbà pé ó jẹ́ òótọ́, láìmú un lọ sí ìtumọ̀ ẹ̀kọ́ tí ó ju ọ̀rọ̀ orísun lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “A jí i dìde” pa ohùn àìṣe mọ́; “láàárín àwọn òkú” mú plural Gíríìkì hàn; “ó ti ń sọ” pa ìṣòro imperfect mọ́ dípò yíyanju rẹ̀ ní ìkọ̀kọ̀.
