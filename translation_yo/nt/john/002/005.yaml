id: JHN.2.5
reference: John 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: yo
  text: Ìyá rẹ̀ sọ fún àwọn ìránṣẹ́ náà pé, “Ohunkóhun tí ó bá sọ fún yín, ẹ ṣe é.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: Ìyá rẹ̀
  rationale: Ó túmọ̀ ìbátan náà ní Yorùbá àdánidá, ó sì pa ìdánimọ̀ ìyá Jésù mọ́ láìfi orúkọ Jésù kún ọ̀rọ̀ Gíríìkì.
- source_word: διακόνοις
  choice: àwọn ìránṣẹ́ náà
  rationale: Nínú àyíká àsè ìgbéyàwó yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ń ṣiṣẹ́ fún àsè, kì í ṣe ipò ‘díákónì’ nínú ìjọ.
- source_word: Ὅ τι ἂν
  choice: Ohunkóhun tí ó bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ohun tí kò ní ààlà tí ó sì lè ṣẹlẹ̀ hàn; ‘ohunkóhun tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìtumọ̀ náà jáde.
- source_word: λέγῃ ὑμῖν
  choice: sọ fún yín
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ‘say/tell you’; àkójọpọ̀ ‘tí ó bá’ ti mú ìtumọ̀ ohun tí ó lè sọ nígbà tó bá yá wọ inú gbólóhùn náà.
- source_word: ποιήσατε
  choice: ẹ ṣe é
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn, ‘é’ sì tọ́ka padà sí ohunkóhun tí yóò sọ, gẹ́gẹ́ bí Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí ó jẹ́ olùṣe tí a kò dárúkọ nínú ‘λέγῃ’
  choice: A lò ‘ó,’ tí ó ń tọ́ka sí Jésù láti inú àyíká ọ̀rọ̀, láìfi orúkọ rẹ̀ kún un.
  alternative: Ohunkóhun tí Jésù bá sọ fún yín, ẹ ṣe é.
  rationale: Gíríìkì kò tún orúkọ Jésù sọ níbí, bí ó tilẹ̀ jẹ́ pé àyíká fi ẹni tí a ń tọ́ka sí hàn kedere. Fífipamọ́ arọ́pò-orúkọ náà ń tẹ̀ lé ìṣókí orísun, kò sì ṣàfikún àlàyé tí kò pọndandan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí ‘tí ó bá sọ’ ti fi ìtumọ̀ subjunctive/indefinite náà hàn ní Yorùbá àdánidá.
