  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Ẹ fi omi kún àwọn ìkòkò omi náà.” Wọ́n sì kún wọn dé ẹnu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní àkókò ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni èdè Yorùbá máa ń lò lọ́nà àdánidá nínú irú ìtàn yìí.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí tọ́ka sí àwọn tí Jésù ń bá sọ̀rọ̀.
- source_word: Γεμίσατε
  choice: Ẹ fi omi kún
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn, ìtumọ̀ rẹ̀ sì ni pé kí wọ́n fi omi kún àwọn ohun èlò náà. Ìpilẹ̀ ‘Ẹ’ mú ọ̀pọ̀ ènìyàn tí àṣẹ náà kan hàn.
- source_word: τὰς ὑδρίας
  choice: àwọn ìkòkò omi náà
  rationale: ὑδρία túmọ̀ sí ìkòkò tàbí ohun èlò tí a fi ń pọn tàbí pa omi mọ́; ‘ìkòkò omi’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì fi ohun tí ẹsẹ yìí kò tún sọ kún un.
- source_word: ὕδατος
  choice: omi
  rationale: Ọ̀rọ̀ náà sọ ohun tí wọ́n fi kún àwọn ìkòkò náà; ‘fi omi kún’ ni ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἐγέμισαν
  choice: wọ́n sì kún wọn
  rationale: Ìṣe náà jẹ́ ohun tí wọ́n parí; ‘wọ́n sì kún wọn’ ń tẹ̀síwájú nínú ìtàn lọ́nà ṣókí, ó sì ṣe kedere láti inú gbólóhùn tó ṣáájú pé omi ni wọ́n fi kún wọn.
- source_word: ἕως ἄνω
  choice: dé ẹnu
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí pé omi dé apá òkè àwọn ìkòkò náà. ‘Dé ẹnu’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé wọ́n kún wọn dé ibi tí wọ́n fi ń da nǹkan sínú wọn.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. ‘Ìkòkò omi’ yàgò fún fífi ‘òkúta’ kún ẹsẹ yìí bó tilẹ̀ jẹ́ pé ẹsẹ 6 ti sọ ohun tí a fi ṣe wọn. Kò sí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí a fi kún ọ̀rọ̀ náà.
