id: JHN.2.15
reference: John 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: yo
  text: Lẹ́yìn tí ó ṣe pàṣán kan láti inú àwọn okùn, ó lé gbogbo wọn jáde kúrò ní àgbàlá tẹ́ńpìlì[a], pẹ̀lú àwọn àgùntàn àti màlúù náà[b][c]; ó tú àwọn owó àwọn olùpàṣípààrọ̀ owó sílẹ̀, ó sì do àwọn tábìlì wọn bolẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν túmọ̀ sí gbogbo agbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “àgùntàn àti àwọn akọ màlúù.”
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì kọ́kọ́ sọ pé “gbogbo wọn,” lẹ́yìn náà ó mẹ́nu kan àgùntàn àti màlúù; kò sọ ní pàtó pé Jésù fi pàṣán náà lé àwọn ènìyàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας φραγέλλιον ἐκ σχοινίων
  choice: fi okùn kéékèèké ṣe pàṣán
  rationale: Ó fi hàn pé Jésù ṣe ohun èlò bí pàṣán láti inú àwọn okùn, ó sì mú ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: πάντας ἐξέβαλεν
  choice: lé gbogbo wọn jáde
  rationale: Èyí pa agbára πάντας mọ́ láì pinnu ní pàtó pé ènìyàn nìkan tàbí ẹranko nìkan ni ó tọ́ka sí.
- source_word: τοῦ ἱεροῦ
  choice: àgbàlá tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; ‘àgbàlá tẹ́ńpìlì’ jẹ́ kó yé òǹkàwé Yorùbá.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: àti àgùntàn àti màlúù
  rationale: Ìsọ̀rọ̀ náà tọ́ka sí oríṣi ẹranko méjèèjì. ‘Màlúù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè dúró fún βοῦς ní àyíká yìí.
- source_word: κολλυβιστῶν
  choice: àwọn olùpàṣípààrọ̀ owó
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe àwọn tó ń pàṣípààrọ̀ owó ní agbègbè tẹ́ńpìlì lọ́nà tó ṣe kedere.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: da àwọn owó ... sílẹ̀
  rationale: ‘Da ... sílẹ̀’ mú àwòrán ìtú àwọn owó jáde mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: do àwọn tábìlì wọn dé
  rationale: Èyí sọ ìṣe yíyí tábìlì náà ṣubú tàbí fífi ojú rẹ̀ dé ilẹ̀ lọ́nà kedere àti àdánidá.
theological_decisions:
- issue: Ààlà àwọn tí Jésù lé jáde àti bí ó ṣe lo pàṣán náà
  choice: A túmọ̀ πάντας sí ‘gbogbo wọn,’ lẹ́yìn náà a mẹ́nu kan àgùntàn àti màlúù, láì sọ pé Jésù fi pàṣán lu àwọn ènìyàn.
  alternative: A lè túmọ̀ ọ́ pé ó lé gbogbo ènìyàn àti ẹranko jáde, tàbí pé àwọn ẹranko nìkan ni ó lé jáde.
  rationale: Gíríìkì fi πάντας síwájú àlàyé nípa àgùntàn àti màlúù, ṣùgbọ́n kò sọ ní pàtó pé a lo pàṣán náà lára ènìyàn. Ìtumọ̀ yìí pa àìdánilójú àti ìforígbárí inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní ibi tó yẹ. ‘Àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ ἱερόν àti ibi mímọ́ inú tẹ́ńpìlì hàn; ìṣètò gbólóhùn náà sì mọ̀ọ́mọ̀ pa àìdánilójú πάντας mọ́.
