  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ pọn díẹ̀ jáde nísinsìnyí, kí ẹ sì gbé e lọ fún olùdarí àsè.”[a] Wọ́n sì gbé e lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “olórí àsè” tàbí “alábòójútó àsè.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ó ń bójú tó àsè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì sọ
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní Gíríìkì jẹ́ historical present nínú ìtàn; àsìkò tí ó ti kọjá ló bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Ἀντλήσατε
  choice: Ẹ pọn díẹ̀ jáde
  rationale: Ọ̀rọ̀ náà tọ́ka sí fífi ohun èlò pọn omi tàbí ohun mímu; ‘díẹ̀’ mú ohun tí a ní lọ́kàn hàn láìṣe àfikún ìtumọ̀ tí kò pọn dandan.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó pa ìtumọ̀ àkókò àti ìjẹ́kánjú àṣẹ náà mọ́.
- source_word: φέρετε
  choice: kí ẹ sì gbé e lọ
  rationale: Ní ojú ìwòye àwọn ìránṣẹ́, gbígbé ohun náà lọ sọ́dọ̀ ẹlòmíràn jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà.
- source_word: ἀρχιτρικλίνῳ
  choice: olùdarí àsè
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ẹni tí ó ń ṣe àbójútó àsè; yíyan ọ̀rọ̀ yìí ṣe kedere, ó sì bójú mu fún èdè ọlọ́lá òde òní.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Wọ́n sì gbé e lọ
  rationale: δέ jẹ́ àsopọ̀ tí kò lágbára níhìn-ín, ἤνεγκαν sì jẹ́ ìṣe gbígbé ohun náà dé ibi tí a pàṣẹ; ‘e’ jẹ́ arọ́pò-orúkọ tí ọ̀rọ̀ tó ṣáájú mú kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A lo ‘Ẹ’ fún àṣẹ sí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí ó ń ṣàlàyé.
