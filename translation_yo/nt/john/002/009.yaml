  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: yo
  text: Nígbà tí olùdarí àsè náà[a] dán omi tí ó ti di wáìnì[b] náà wò, tí kò sì mọ ibi tí ó ti wá (ṣùgbọ́n àwọn ìránṣẹ́ tí wọ́n pọn omi náà mọ̀), olùdarí àsè náà ń pe ọkọ ìyàwó náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “olùbojútó àsè.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tó ń ṣàkóso àsè náà.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “omi tí ó ti di wáìnì”; a tún lè sọ pé, “omi tí ó yí padà sí wáìnì.”
    reason: lexical_alternative
  - marker: c
    text: Jòhánù lo ọ̀rọ̀ ìṣe ìsinsìnyí nínú ìtàn níbí, ìyẹn, “ó ń pe,” bí ó tilẹ̀ jẹ́ pé àwọn èdè kan máa ń lò ọ̀rọ̀ ìṣe àtijọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: olùdarí àsè
  rationale: Ó ń tọ́ka sí ẹni tí ó ń ṣàkóso tàbí bojú tó àsè náà; “olùdarí àsè” jẹ́ èdè Yorùbá tó ṣe kedere, tí kò sì sọ ipa náà di ti olùpèsè nìkan.
- source_word: ἐγεύσατο
  choice: tọ́ … wò
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti tọ́ ohun kan wò; gbólóhùn Yorùbá yìí jẹ́ ti àdánidá nínú àyíká yìí.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: omi tí ó ti di wáìnì
  rationale: “Ó ti di” fi ìyípadà tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì wà nígbà náà, hàn gẹ́gẹ́ bí perfect participle Gíríìkì.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: kò … mọ ibi tí ó ti wá
  rationale: Èyí sọ orísun ohun náà ní Yorùbá àdánidá láìfi àlàyé míì kún un.
- source_word: διάκονοι
  choice: àwọn ìránṣẹ́
  rationale: Nínú àyíká àsè yìí, àwọn tó ń ṣiṣẹ́ níbi àsè ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe ipò iṣẹ́ ìjọ.
- source_word: ἠντληκότες
  choice: tí wọ́n pọn omi náà
  rationale: “Pọn omi” ni ọ̀nà Yorùbá àdánidá láti sọ fífa omi jáde láti inú ohun tí omi wà.
- source_word: φωνεῖ
  choice: pe
  rationale: “Pe” bá ìṣe pípe ẹni mu, ó sì lè dúró ní ìtàn Yorùbá láìfi àmì àkókò tí kò sí nínú èdè náà kún un.
- source_word: νυμφίον
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọkùnrin tó ń ṣe ìgbéyàwó.
- source_word: ὡς δὲ
  choice: Nígbà tí
  rationale: Ó ṣàgbékalẹ̀ ìṣẹ̀lẹ̀ tó tẹ̀ lé e lọ́nà àdánidá, láìfi “nísinsìnyí” tàbí ìtakora líle tí kò hàn gbangba sínú rẹ̀.
theological_decisions:
- issue: Àpèjúwe ìyípadà omi sí wáìnì
  choice: omi tí ó ti di wáìnì
  alternative: omi tí a sọ di wáìnì
  rationale: Gíríìkì sọ ní tààrà pé omi náà ti di wáìnì. Ìtumọ̀ yìí kò sọ ọ́ di ìrísí lásán, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀n, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa àkíyèsí àárín gbólóhùn mọ́ láìdá ìṣàn ìtàn rú.
