source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: yo
  text: Ó sì rí nínú tẹ́ńpìlì àwọn tí ń ta màlúù, àgùntàn àti àdàbà, àti àwọn olùpàṣípààrọ̀ owó tí wọ́n jókòó síbẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “tẹ́ńpìlì” níbí ni ἱερόν; ó ń tọ́ka sí àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: ó rí
  rationale: Aorist εὗρεν sọ ohun tí Jésù bá níbẹ̀; “ó rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè túmọ̀ sí pé ó bá wọn níbẹ̀, kì í ṣe wíwo lásán.
- source_word: ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì” jẹ́ yíyan tí ó ṣe kedere, a sì ṣàlàyé ìwọ̀n ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: πωλοῦντας
  choice: àwọn tí ń ta
  rationale: Ọ̀rọ̀ alábápín àsìkò ìsinsìnyí náà fi hàn pé iṣẹ́ títà náà ń lọ lọ́wọ́; “àwọn tí ń ta” pa ìtumọ̀ yìí mọ́ ní Yorùbá àdánidá.
- source_word: βόας
  choice: màlúù
  rationale: βόας lè tọ́ka sí ẹran ọ̀sìn oríṣiríṣi lábẹ́ ẹ̀yà màlúù. “Màlúù” kò fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ.
- source_word: πρόβατα
  choice: àgùntàn
  rationale: Nínú ọ̀rọ̀ yìí, πρόβατα túmọ̀ sí àgùntàn, ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ fún ẹran ìrúbọ yìí.
- source_word: περιστερὰς
  choice: àdàbà
  rationale: περιστερά lè jẹ́ dove tàbí pigeon; “àdàbà” ni ọ̀rọ̀ Yorùbá gbòòrò tí ó bá àyíká ẹran ìrúbọ mu láìfi ìyàtọ̀ tí orísun kò sọ kún un.
- source_word: κερματιστὰς
  choice: àwọn pàṣípààrọ̀ owó
  rationale: κερματιστής ni ẹni tí ń pàṣípààrọ̀ owó tàbí ẹyọ owó. Yíyan yìí sọ iṣẹ́ wọn ní kedere fún òǹkàwé Yorùbá òde òní.
- source_word: καθημένους
  choice: tí wọ́n jókòó síbẹ̀
  rationale: καθημένους ṣàpèjúwe wọn gẹ́gẹ́ bí ẹni tí ó jókòó; “sí bẹ̀” jẹ́ kí ìṣètò ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n ibi tí ἱερόν ń tọ́ka sí nínú tẹ́ńpìlì Jerúsálẹ́mù
  choice: “nínú tẹ́ńpìlì” nínú ẹsẹ̀, pẹ̀lú àlàyé pé gbogbo àgbègbè rẹ̀ ni ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí
  alternative: “nínú àgbàlá tẹ́ńpìlì” tàbí “nínú àgbègbè tẹ́ńpìlì”
  rationale: Ìtàn àwọn olùta ẹran àti àwọn pàṣípààrọ̀ owó bá àgbègbè tàbí àgbàlá tẹ́ńpìlì mu, kì í ṣe ibi mímọ́ inú ilé náà. “Tẹ́ńpìlì” jẹ́ Yorùbá tó rọrùn, àlàyé ìsàlẹ̀ sì pa ìyàtọ̀ ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá àfọwọ́kọ, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A yàn “pàṣípààrọ̀ owó” dípò gbígbé ọ̀rọ̀ Gẹ̀ẹ́sì wọlé, a sì pa ìtòlẹ́sẹẹsẹ àwọn ẹgbẹ́ méjì nínú Gíríìkì mọ́.
