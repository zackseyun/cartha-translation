  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Ẹ wó tẹ́ńpìlì yìí lulẹ̀, èmi yóò sì gbé e dìde ní ọjọ́ mẹ́ta.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Ẹ tú tẹ́ńpìlì yìí ká … èmi yóò tún un kọ́.” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “gbé e dìde” lè ní ìró ìjíǹde nínú àyíká yìí; Jòhánù ṣàlàyé lẹ́yìn náà pé Jésù ń sọ̀rọ̀ nípa tẹ́ńpìlì ara rẹ̀ (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: dá wọn lóhùn pé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà láì fi àtúnṣe tí kò pọndandan kún un.
- source_word: Λύσατε
  choice: Ẹ wó … lulẹ̀
  rationale: Nínú àyíká yìí, λύω túmọ̀ sí wíwó ilé tàbí pípa á run; ọ̀rọ̀ yìí tún jẹ́ kí àwòrán tẹ́ńpìlì dúró kedere.
- source_word: τὸν ναὸν τοῦτον
  choice: tẹ́ńpìlì yìí
  rationale: “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún ναός níhìn-ín; “yìí” pa agbára ọ̀rọ̀ atọ́ka τοῦτον mọ́.
- source_word: ἐν τρισὶν ἡμέραις
  choice: ní ọjọ́ mẹ́ta
  rationale: Gbólóhùn yìí jẹ́ ti àdánidá ní Yorùbá, ó sì yẹra fún fífi ìtumọ̀ àkókò tí ó le ju ti Gíríìkì lọ kún un.
- source_word: ἐγερῶ αὐτόν
  choice: èmi yóò sì gbé e dìde
  rationale: “Gbé … dìde” bá ἐγείρω mu, ó sì pa ìró ìjíǹde mọ́ láì sọ ìtumọ̀ àwòrán tẹ́ńpìlì di ohun kan ṣoṣo.
theological_decisions:
- issue: Bóyá kí a sọ ní tààrà pé ara Jésù ni tẹ́ńpìlì náà
  choice: Pa “tẹ́ńpìlì yìí” mọ́ láì fi àlàyé sínú ẹsẹ náà.
  alternative: Ẹ wó tẹ́ńpìlì yìí—ìyẹn ni ara mi—lulẹ̀.
  rationale: Jòhánù fúnra rẹ̀ ṣàlàyé ohun tí Jésù ní lọ́kàn ní 2:21; fífi àlàyé náà sínú 2:19 yóò mú àdììtú àti ìfọ̀kànsìn ìtàn náà kúrò.
- issue: Bóyá kí ἐγερῶ jẹ́ ọ̀rọ̀ iṣẹ́ ilé tàbí ọ̀rọ̀ tí ó tún ń tọ́ka sí ìjíǹde
  choice: èmi yóò sì gbé e dìde
  alternative: èmi yóò tún un kọ́
  rationale: “Gbé e dìde” lè bá àwòrán mímú tẹ́ńpìlì padà dúró mu, ó sì tún pa ìtọ́ka sí ìjíǹde tí àyíká Jòhánù fi hàn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò. “Dá wọn lóhùn pé” jẹ́ àdánidá ju títú àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì lọ ní ọ̀tọ̀ọ̀tọ̀; “ẹ” pa àṣẹ ọ̀pọ̀ ènìyàn mọ́; “èmi” sì fi ìtẹnumọ́ orúkọ arọ́pò ẹni àkọ́kọ́ hàn.
