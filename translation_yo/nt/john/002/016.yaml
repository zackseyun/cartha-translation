id: JHN.2.16
reference: John 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: yo
  text: Ó sì sọ fún àwọn tí ń ta àdàbà pé, “Ẹ gbé àwọn nǹkan wọ̀nyí kúrò níhìn-ín; ẹ má ṣe sọ ilé Baba mi di ilé òwò[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọjà.” Ní ìtumọ̀ gidi, Gíríìkì ní “ilé òwò,” èyí tí ó pa àtúnwí ọ̀rọ̀ “ilé” mọ́ nínú gbólóhùn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: àdàbà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹyẹ tí wọ́n ń tà fún ẹbọ; “àdàbà” ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká tẹ́ńpìlì mu.
- source_word: πωλοῦσιν
  choice: àwọn tí ń ta
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ nínú participle Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti dá ẹgbẹ́ náà mọ̀ ní Yorùbá.
- source_word: Ἄρατε
  choice: Ẹ gbé ... kúrò
  rationale: Àṣẹ yìí béèrè ìgbésẹ̀ pàtó lẹ́sẹ̀kẹsẹ̀; “Ẹ gbé ... kúrò” jẹ́ àṣẹ Yorùbá tó ṣe kedere, tó sì ní agbára.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa demonstrative neuter plural mọ́ láì sọ pàtó ju ohun tí ẹsẹ náà sọ lọ; ó lè ní àwọn ohun ìtajà tàbí ohun èlò wọn nínú.
- source_word: ἐντεῦθεν
  choice: kúrò níhìn-ín
  rationale: Ó fi ìṣípadà kúrò ní ibi tí wọ́n wà hàn, ó sì darapọ̀ mọ́ “Ẹ gbé” lọ́nà àdánidá.
- source_word: μὴ ποιεῖτε
  choice: ẹ má ṣe sọ ... di
  rationale: Ó jẹ́ ìfòfin-lè ní kedere, ó sì tú ìtumọ̀ “má ṣe mú X di Y” jáde ní Yorùbá láì fi ìtumọ̀ míì kún un.
- source_word: οἶκον τοῦ πατρός μου
  choice: ilé Baba mi
  rationale: Ó pa ìbátan ọmọ sí Baba tí “μου” fi hàn mọ́, bẹ́ẹ̀ ni ó tọ́ka sí tẹ́ńpìlì gẹ́gẹ́ bí ilé náà.
- source_word: οἶκον ἐμπορίου
  choice: ilé òwò
  rationale: Ó pa àtúnwí οἶκον ... οἶκον (“ilé ... ilé”) àti ìyàtọ̀ ọ̀rọ̀ tí Jésù dá sílẹ̀ mọ́; “òwò” bo ìtajà tàbí iṣẹ́ ajé ní àyíká yìí.
theological_decisions:
- issue: Bí a ṣe tú ọ̀rọ̀ Jésù pé tẹ́ńpìlì jẹ́ “ilé Baba mi”
  choice: ilé Baba mi
  alternative: ilé Baba wa; ilé Ọlọ́run
  rationale: Gíríìkì ní possessive singular μου pẹ̀lú πατρός. Nítorí náà, a pa ọ̀rọ̀ Jésù nípa ìbátan tirẹ̀ pẹ̀lú Baba àti àṣẹ rẹ̀ mọ́, láì rọ̀ ọ́ tàbí fi ohun tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èdè tí gbogbo ènìyàn lè lóye ni a lò. Àṣẹ ọ̀pọ̀ ènìyàn “Ẹ” bá ẹgbẹ́ àwọn olùtajà mu. A fi àmì ohùn sí ibi tí ó bá èdè Yorùbá àdánidá mu, a sì pa àtúnwí “ilé ... ilé” ti Gíríìkì mọ́.
