  to: Ó sì sọ fún un pé, “Gbogbo ènìyàn[a] ni ó máa ń kọ́kọ́ gbé wáìnì rere kalẹ̀; nígbà tí wọ́n bá sì ti mutí yó[b], ó máa ń gbé èyí tí kò dára bẹ́ẹ̀ kalẹ̀. Ṣùgbọ́n ìwọ ti pa wáìnì rere mọ́ títí di ìsinsìnyí.”
