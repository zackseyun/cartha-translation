id: JHN.2.10
reference: John 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Gbogbo ènìyàn[a] ni ó máa ń kọ́kọ́ gbé wáìnì rere kalẹ̀; nígbà tí wọ́n bá sì ti mutí yó[b], ó máa ń gbé èyí tí kò dára bẹ́ẹ̀ kalẹ̀. Ṣùgbọ́n ìwọ ti pa wáìnì rere mọ́ títí di ìsinsìnyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, gbólóhùn náà jẹ́ ‘gbogbo ènìyàn’ ní ẹyọ, ṣùgbọ́n ó ń sọ̀rọ̀ nípa àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘nígbà tí wọ́n bá ti yó’ tàbí ‘nígbà tí wọ́n bá ti mu lọ́pọ̀.’ Ọ̀rọ̀-ìṣe Gíríìkì sábà túmọ̀ sí ‘mutí yó’; àwọn ìtumọ̀ kan máa ń mú un rọ̀ láti tẹnu mọ́ bí agbára láti mọ ìyàtọ̀ ṣe dín kù dípò ìmutíyó ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ó sì sọ fún un pé
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ present historical; lílo ìgbà àtijọ́ bá ìtàn Yorùbá mu, ó sì pa agbára ọ̀rọ̀ tààrà mọ́.
- source_word: Πᾶς ἄνθρωπος
  choice: Gbogbo ènìyàn
  rationale: Gbólóhùn ẹyọ aṣojú yìí túmọ̀ sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; ‘gbogbo ènìyàn’ jẹ́ èdè Yorùbá àdánidá tó péye.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi bí nǹkan ṣe tẹ̀ lé ara wọn hàn ní kedere, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘first’ ní Yorùbá.
- source_word: τὸν καλὸν οἶνον
  choice: wáìnì rere
  rationale: καλός ń tọ́ka sí dídára wáìnì; ‘wáìnì rere’ pa ìyàtọ̀ rẹ̀ sí èyí tí kò dára tó mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: τίθησιν
  choice: gbé … kalẹ̀
  rationale: Nínú àyíká àsè, gbólóhùn yìí túmọ̀ sí mímú wáìnì jáde fún àwọn àlejò, ó sì sún mọ́ ìtumọ̀ ‘fi sílẹ̀/gbé kalẹ̀’ ti Gíríìkì.
- source_word: ὅταν μεθυσθῶσιν
  choice: nígbà tí àwọn ènìyàn bá sì ti mutí yó
  rationale: μεθύω sábà máa ń túmọ̀ sí mímutí yó; ‘bá … ti mutí yó’ fi ìṣẹ̀lẹ̀ tí ó ti dé ipò kan hàn, ó sì yẹra fún mímú ọ̀rọ̀ Gíríìkì náà rọ̀.
- source_word: τὸν ἐλάσσω
  choice: èyí tí kò dára tó
  rationale: Ọ̀rọ̀ afiwéra ἐλάσσων túmọ̀ sí èyí tí ó rẹlẹ̀ ní dídára; Yorùbá yìí dá ìtumọ̀ wáìnì tí a kò tún dárúkọ sílẹ̀ mọ́, ó sì jẹ́ àdánidá ju ìtumọ̀ líle lọ.
- source_word: τετήρηκας
  choice: ìwọ ti pa … mọ́
  rationale: Ìrísí perfect náà fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì wà hàn; ‘ti pa mọ́’ ṣàfihàn rẹ̀ dáadáa.
- source_word: ἕως ἄρτι
  choice: títí di ìsinsìnyí
  rationale: Ó tọ́ka sí àsìkò yìí gan-an nínú ìtàn, èyí sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ μεθυσθῶσιν nínú ìtàn iṣẹ́ àmì tí wáìnì wà nínú rẹ̀
  choice: Pa ìtumọ̀ tààrà ‘mutí yó’ mọ́
  alternative: mu tẹ́ńbẹ́lú / mu débi pé wọn kò lè fi ìyàtọ̀ sáàárín wáìnì mọ́
  rationale: μεθύω sábà ń sọ nípa mímutí yó ní kedere. Ọ̀rọ̀ olórí àsè ni ẹsẹ̀ náà ń ròyìn, kì í ṣe pé ó ń fọwọ́ sí ìmutíyó; nítorí náà, a kò mú ìtumọ̀ náà rọ̀ nítorí èrò ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lápapọ̀ lè lóye ni a lò. ‘Ó máa ń’ fi àṣà tí olórí àsè sọ pé ó wọ́pọ̀ hàn; àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
