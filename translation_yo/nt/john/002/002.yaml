translation:
  language: yo
  text: A sì tún pe Jésù pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀ sí ibi ìgbéyàwó náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, pẹ̀lú ìṣètò ọ̀rọ̀ tí ó sún mọ́ ti Gíríìkì: “A sì tún pe Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ sí ibi ìgbéyàwó náà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλήθη
  choice: A sì pe ... sí
  rationale: Ní àyíká ayẹyẹ ìgbéyàwó, àìṣe ti καλέω túmọ̀ sí pé a ké sí ẹnì kan; gbolohun Yorùbá “pe ... sí” fi ìtumọ̀ ìkésíni yìí hàn lọ́nà àdánidá.
- source_word: δὲ καὶ
  choice: sì ... pẹ̀lú
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀, καὶ àkọ́kọ́ sì ń fi Jésù kún àwọn tí ẹsẹ tó ṣáájú mẹ́nu kàn. “Sì” so ìṣẹ̀lẹ̀ náà pọ̀ mọ́ ti iṣáájú, “pẹ̀lú” sì mú èrò àfikún náà jáde.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Ọmọ-ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής, ó sì pa ìbáṣepọ̀ akẹ́kọ̀ọ́ àti olùtẹ̀lé mọ́; “rẹ̀” dúró fún αὐτοῦ.
- source_word: εἰς τὸν γάμον
  choice: sí ibi ìgbéyàwó náà
  rationale: γάμος níbí tọ́ka sí ayẹyẹ tàbí ibi ìgbéyàwó. “Ibi ìgbéyàwó” jẹ́ àdánidá ní Yorùbá láìfi àsè kún ohun tí ẹsẹ náà kò sọ ní tààrà.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtumọ̀ náà tẹ̀lé àìṣe ἐκλήθη, ó sì fi ìṣọ̀kan Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ hàn láìjẹ́ kí gbolohun le.
