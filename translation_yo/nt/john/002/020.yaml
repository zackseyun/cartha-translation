id: JHN.2.20
reference: John 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù sọ pé,[a] “Ọdún mẹ́rìndínláàádọ́ta ni a fi kọ tẹ́ńpìlì yìí, ìwọ yóò ha sì gbé e dìde ní ọjọ́ mẹ́ta?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará Jùdíà.” Gíríìkì ní “àwọn Júù,” ọ̀rọ̀ tí Jòhánù ń lò ní onírúurú ọ̀nà gẹ́gẹ́ bí àyíká.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “tún un kọ́.” Ọ̀rọ̀-ìṣe Gíríìkì lè ní òye ìkọ́lé níbi tí àwọn olùsọ ti ń lò ó, ṣùgbọ́n “gbé e dìde” pa ọ̀rọ̀ tí Jòhánù so mọ́ àjíǹde Jésù lẹ́yìn náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ wọn mọ́ ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì fi àbájáde tàbí ìdáhùn hàn ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì láì fi ìtumọ̀ tóóró bí ‘àwọn olórí Júù’ kún un; àlàyé ìsàlẹ̀ sọ pé ó tún lè tọ́ka sí àwọn ará Jùdíà gẹ́gẹ́ bí àyíká ṣe ń béèrè.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: Ọdún mẹ́rìndínláàádọ́ta ni a fi
  rationale: Ìkọ̀rọ̀ yìí sọ iye àkókò tí iṣẹ́ ìkọ́lé náà gba, Yorùbá ‘ni a fi’ sì mú ìtumọ̀ àkókò náà jáde lọ́nà àdánidá.
- source_word: οἰκοδομήθη
  choice: kọ
  rationale: Aorist passive náà ni a mú jáde pẹ̀lú àgbékalẹ̀ Yorùbá aláìdárúkọ olùṣe, ‘a fi kọ,’ láì sọ pé iṣẹ́ náà ṣì ń lọ lọ́wọ́.
- source_word: ὁ ναὸς οὗτος
  choice: tẹ́ńpìlì yìí
  rationale: ναός ń tọ́ka sí ibi mímọ́ tẹ́ńpìlì ní pàtó, ṣùgbọ́n ‘tẹ́ńpìlì’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ jù fún àyíká yìí.
- source_word: καὶ σὺ
  choice: ìwọ yóò ha sì
  rationale: Aṣojú ‘ìwọ’ tí a sọ ní gbangba àti patikulu ìbéèrè ‘ha’ pa ìtẹnumọ́ àti ìyàlẹ́nu inú ìbéèrè náà mọ́.
- source_word: ἐν τρισὶν ἡμέραις
  choice: láàárín ọjọ́ mẹ́ta
  rationale: Ó sọ àkókò tí ohun náà yóò wáyé nínú rẹ̀ ní Yorùbá àdánidá, láì yí iye ọjọ́ tàbí ìtumọ̀ gbolohun náà padà.
- source_word: ἐγερεῖς
  choice: gbé e dìde
  rationale: 'Èyí pa ìtumọ̀ méjì tó ṣe pàtàkì mọ́: àwọn olùgbọ́ lè gbọ́ ọ gẹ́gẹ́ bí gbígbé ilé náà ró, nígbà tí Jòhánù yóò so ọ̀rọ̀ náà mọ́ àjíǹde Jésù.'
- source_word: αὐτόν
  choice: e
  rationale: Aṣojú ohun náà tọ́ka padà sí tẹ́ńpìlì, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
theological_decisions:
- issue: Ó ṣeé ṣe kí ‘οἱ Ἰουδαῖοι’ fa òye pé gbogbo àwọn Júù ni a ń sọ̀rọ̀ sí
  choice: Pa ‘àwọn Júù’ mọ́ nínú ọ̀rọ̀ pàtàkì, kí a sì ṣàlàyé ìlò rẹ̀ ní àlàyé ìsàlẹ̀.
  alternative: àwọn ará Jùdíà; àwọn olórí Júù
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ‘àwọn olórí’ ní pàtó, ìlò Jòhánù sì ń yàtọ̀ síra gẹ́gẹ́ bí àyíká; nítorí náà a kò dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù láìsí ẹ̀rí.
- issue: Ìbáṣepọ̀ ‘ἐγερεῖς’ pẹ̀lú àwòrán àjíǹde
  choice: Lo ‘gbé e dìde.’
  alternative: tún un kọ́
  rationale: '‘Gbé e dìde’ pa ẹ̀gàn àràmàǹdà inú ìtàn náà mọ́: àwọn olùgbọ́ ń ronú nípa ilé tẹ́ńpìlì, ṣùgbọ́n akọ̀wé yóò ṣàlàyé rẹ̀ nípa ara Jésù àti àjíǹde rẹ̀.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo ìbéèrè ‘ha’ láti pa ìyàlẹ́nu àti àìgbàgbọ́ àwọn olùsọ mọ́.
