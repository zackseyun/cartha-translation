reference: John 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: yo
  text: Nígbà tí ó sì wà ní Jerúsálẹ́mù ní Ìrékọjá, ní àjọ̀dún náà, ọ̀pọ̀ ènìyàn gba orúkọ rẹ̀ gbọ́[a] nígbà tí wọ́n ń wo àwọn àmì[b] tí ó ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “gba òun gbọ́.” Ní tààrà, Gíríìkì sọ pé, “gba orúkọ rẹ̀ gbọ́”; èyí jẹ́ ọ̀nà àsọyé tí Jòhánù máa ń lò láti tẹnumọ́ ìgbẹ́kẹ̀lé nínú ẹni tí a ti fi Jésù hàn pé ó jẹ́.
    reason: lexical_alternative
  - marker: b
    text: “Àmì” ni ọ̀rọ̀ pàtàkì tí Jòhánù máa ń lò fún àwọn iṣẹ́ tí ń tọ́ka kọjá ara wọn sí ẹni tí Jésù jẹ́; àwọn ìtumọ̀ kan máa ń pè wọ́n ní “àwọn àmì iṣẹ́ ìyanu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nígbà tí ó sì
  rationale: Ó fi ìbáṣepọ̀ pẹ̀lú ohun tí ó ṣáájú hàn, ó sì bẹ̀rẹ̀ gbólóhùn àkókò láìfi ọ̀rọ̀ kan tí ó túmọ̀ sí ‘nísinsìnyí’ kún un.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: ó wà ní Jerúsálẹ́mù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ ibi tí ẹnì kan wà.
- source_word: ἐν τῷ πάσχα
  choice: ní àkókò Ìrékọjá
  rationale: Πάσχα ń tọ́ka sí àjọ̀dún Ìrékọjá; ‘ní àkókò’ jẹ́ kó ṣe kedere pé àkókò àjọ̀dún náà ni a ń sọ.
- source_word: ἐν τῇ ἑορτῇ
  choice: ní àkókò àjọ̀dún náà
  rationale: Ó pa àlàyé àfikún nípa Ìrékọjá gẹ́gẹ́ bí àjọ̀dún mọ́, ó sì tún àsọtẹ́lẹ̀ ἐν náà hàn lọ́nà Yorùbá tí ó bójú mu.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Fífi ‘ènìyàn’ kún un jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere àti tí ó wọ́pọ̀ fún ọ̀pọ̀ ènìyàn.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: gba orúkọ rẹ̀ gbọ́
  rationale: Ó pa àsọyé pàtàkì ti Jòhánù, ‘gbà ... orúkọ ... gbọ́,’ mọ́ dípò yíyí i padà sí ‘gba òun gbọ́’ lásán.
- source_word: θεωροῦντες
  choice: bí wọ́n ti ń rí
  rationale: Àpólà aláìlópin náà ń sọ ìṣe tí ó ń lọ ní àkókò kan náà; ‘bí wọ́n ti ń rí’ pa ìtumọ̀ àkókò yìí mọ́ láìfipá sọ pé ó jẹ́ okùnfà.
- source_word: τὰ σημεῖα
  choice: àwọn àmì
  rationale: ‘Àmì’ pa ọ̀rọ̀ Jòhánù mọ́ fún àwọn iṣẹ́ tí ń tọ́ka kọjá ara wọn sí ẹni tí Jésù jẹ́, láìfi ‘iṣẹ́ ìyanu’ kún ọ̀rọ̀ orísun.
- source_word: ἃ ἐποίει
  choice: tí ó ń ṣe
  rationale: ‘Ń ṣe’ ṣe àfihàn ìṣe tí ó ń bá a lọ ní àkókò àtijọ́, gẹ́gẹ́ bí imperfect ἐποίει.
theological_decisions:
- issue: Irú ìgbàgbọ́ tí ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ ń ṣàpèjúwe
  choice: A túmọ̀ ọ́ ní tààrà pé ‘ọ̀pọ̀ ènìyàn gba orúkọ rẹ̀ gbọ́,’ láìdín ìgbàgbọ́ náà kù nínú ẹsẹ yìí.
  alternative: Kí a túmọ̀ ọ́ sí ìgbàgbọ́ àkọ́kọ́ tàbí ìgbàgbọ́ tí kò jinlẹ̀ nítorí àwọn iṣẹ́ ìyanu.
  rationale: Gíríìkì sọ ní tààrà pé wọ́n gba orúkọ rẹ̀ gbọ́. Ẹsẹ tó tẹ̀ lé e ló mú ìṣòro àti ìwọ̀ntúnwọ̀nsì wá; nítorí náà, ìtumọ̀ kò yẹ kí ó yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà ṣáájú ọ̀rọ̀ inú ìtàn.
translation_notes:
  register: Yorùbá àpéjọ, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa àsọyé Jòhánù ‘gba orúkọ rẹ̀ gbọ́’ àti ‘àwọn àmì’ mọ́, a sì lo fọ́ọ̀mù ìṣe ‘ń’ láti fi ìṣe tí ó ń lọ hàn.
