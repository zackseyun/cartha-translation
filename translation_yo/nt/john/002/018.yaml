id: JHN.2.18
reference: John 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] dá a lóhùn, wọ́n sì wí fún un pé, “Àmì wo ni o fi hàn wá pé o ń ṣe àwọn nǹkan wọ̀nyí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà.” Nínú Ìhìn Rere Jòhánù, “àwọn Júù” lè tọ́ka sí ẹgbẹ́ aṣojú kan ní pàtó, pàápàá àwọn aláṣẹ ní Jùdíà, gẹ́gẹ́ bí àyíká ṣe fi hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: dá a lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn sí ọ̀rọ̀ tàbí ìṣe kan hàn, ó sì pa ìṣètò ìjíròrò mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè wọn pọ̀ mọ́ ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe nínú tẹ́ńpìlì, ó sì fi ìtẹ̀síwájú tó ní ìdí hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà. Àyíká lè túmọ̀ sí ẹgbẹ́ aṣojú tàbí àwọn aláṣẹ Júù, ṣùgbọ́n ẹsẹ yìí kò sọ ìdíwọ̀ yẹn ní gbangba.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n sì wí fún un pé
  rationale: Ìtumọ̀ tó ṣe kedere fún ọ̀rọ̀ ìtàn tó ń ṣáájú ọ̀rọ̀ tààrà.
- source_word: Τί σημεῖον
  choice: Àmì wo
  rationale: '“Àmì” pa ìtumọ̀ Johannine mọ́: iṣẹ́ tó ń fi ẹ̀rí hàn tí ó sì ń tọ́ka sí ohun tó jinlẹ̀ ju iṣẹ́ ìyanu lásán lọ.'
- source_word: δεικνύεις ἡμῖν
  choice: ni ìwọ fi hàn wá
  rationale: Ó fi ìpèníjà wọn hàn láti rí àmì tó lè jẹ́rìí sí àṣẹ Jésù; fífi “ìwọ” hàn mú ìtẹnumọ́ ìbéèrè náà jáde lọ́nà àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: 'Ó pa àìdánilójú ìbáṣepọ̀ gírámà mọ́: ó lè tọ́ka sí ìdí tàbí ìpìlẹ̀ tí Jésù fi ń ṣe àwọn nǹkan wọ̀nyí, láìfi ìtumọ̀ kan ṣoṣo lé e lórí.'
- source_word: ταῦτα ποιεῖς
  choice: o ń ṣe àwọn nǹkan wọ̀nyí
  rationale: Ìṣe amúlò “ń ṣe” fi ìṣe tó ń lọ lọ́wọ́ nínú àyíká hàn, “àwọn nǹkan wọ̀nyí” sì pa ọ̀pọ̀ nọ́ńbà ταῦτα mọ́.
theological_decisions:
- issue: Ohun tí “οἱ Ἰουδαῖοι” ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: Pa “àwọn Júù” mọ́ nínú ẹsẹ pàtàkì
  alternative: “àwọn olórí Júù” tàbí “àwọn ará Jùdíà”
  rationale: Gíríìkì kò fi ọ̀rọ̀ “olórí” kun un. Bí ó tilẹ̀ jẹ́ pé Jòhánù lè lo gbólóhùn náà fún ẹgbẹ́ kan pàtó, ó yẹ kí a fi àlàyé yẹn sínú àkọsílẹ̀ dípò kí a yanju rẹ̀ nínú ẹsẹ.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Ìtòlẹ́sẹẹsẹ “dá a lóhùn, wọ́n sì wí” pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́ láìjẹ́ kí gbolohun náà di aláìṣeé lóye.
