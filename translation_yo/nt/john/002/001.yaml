source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: yo
  text: Ní ọjọ́ kẹta, ìgbéyàwó kan wáyé ní Kánà, ní ilẹ̀ Gálílì[a], ìyá Jésù sì wà níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayẹyẹ ìgbéyàwó kan.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbéyàwó fúnra rẹ̀ tàbí sí ayẹyẹ ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ní
  rationale: A kò túmọ̀ Καὶ lọ́tọ̀ gẹ́gẹ́ bí “Àti” ní ìbẹ̀rẹ̀, nítorí “Ní ọjọ́ kẹta” ń so ìtàn náà pọ̀ lọ́nà àdánidá ní Yorùbá, láìfi ìtumọ̀ tuntun kún un.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: ní ọjọ́ kẹta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àmì àkókò pàtó inú Gíríìkì mọ́.
- source_word: γάμος
  choice: ìgbéyàwó kan
  rationale: “Ìgbéyàwó” lè tọ́ka sí ìṣẹ̀lẹ̀ ìgbéyàwó àti ayẹyẹ rẹ̀; ó bá àìdánilójú ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐγένετο
  choice: wáyé
  rationale: “Wáyé” jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣe àfihàn pé ìṣẹ̀lẹ̀ kan ṣẹlẹ̀.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ní Kánà ti Gálílì
  rationale: Ó pa ìbáṣepọ̀ genitive Gíríìkì mọ́, ó sì dá orúkọ ibi méjèèjì sílẹ̀ ní ọ̀nà tó ṣe kedere.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ìyá Jésù
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe déédéé, tó sì tẹ̀lé ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì láìfi orúkọ ìyá náà kún un.
- source_word: ἦν … ἐκεῖ
  choice: wà níbẹ̀
  rationale: Ìtumọ̀ tààrà, tó sì pa ìró ìtàn pẹ̀lẹ́pẹ̀lẹ́ ti imperfect náà mọ́ láìṣàlàyé sí i.
theological_decisions:
- issue: Àmì àkókò “ọjọ́ kẹta”
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ìtọ́kasí àkókò nínú ìtàn.
  alternative: Kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí àpẹẹrẹ tàbí ìtọ́kasí sí àjíǹde.
  rationale: Bí ó tilẹ̀ jẹ́ pé àwọn òǹkàwé lè rí ìtumọ̀ jinlẹ̀ nínú rẹ̀, ẹsẹ̀ yìí fúnra rẹ̀ fi í hàn gẹ́gẹ́ bí àmì àkókò; ìtumọ̀ kò gbọ́dọ̀ pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì yẹ fún òǹkàwé òde òní. A yan “ìyá Jésù” dípò gbólóhùn gígùn “ìyá ti Jésù,” nítorí èyí ni ìṣàmúlò Yorùbá tó ṣe déédéé.
