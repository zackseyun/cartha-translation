  to: Àwọn ìkòkò omi mẹ́fà tí a fi òkúta ṣe wà níbẹ̀, tí a gbé kalẹ̀ fún àṣà ìwẹ̀nù àwọn Júù.[a] Ọ̀kọ̀ọ̀kan wọn gba òṣùwọ̀n méjì tàbí mẹ́ta.[b]
  rationale: A tún “gẹ́gẹ́ bí” ṣe sí “fún” nínú ọ̀rọ̀ pàtàkì kí o lè fi hàn pé a gbé àwọn ìkòkò náà kalẹ̀ fún àṣà ìwẹ̀nù àwọn Júù, kì í ṣe pé ọ̀nà gbígbé wọn kalẹ̀ ni ó tẹ̀lé àṣà náà. A tún yọ “lè” kúrò nínú gbolóhùn agbára ìkòkò, nítorí χωροῦσαι ń ṣàpèjúwe agbára tí wọ́n ní ní tòótọ́ nínú ìtàn náà. Àkọsílẹ̀ [a] ń pa ìtumọ̀ “gẹ́gẹ́ bí” tí ó ṣeé ṣe mọ́.
