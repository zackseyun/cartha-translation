  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: yo
  text: Àwọn ìkòkò omi mẹ́fà tí a fi òkúta ṣe wà níbẹ̀, tí a gbé kalẹ̀ fún àṣà ìwẹ̀nù àwọn Júù.[a] Ọ̀kọ̀ọ̀kan wọn gba òṣùwọ̀n méjì tàbí mẹ́ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “gẹ́gẹ́ bí àṣà ìwẹ̀nù àwọn Júù.” Gbólóhùn náà ń tọ́ka sí ìwẹ̀nù àṣà ẹ̀sìn àwọn Júù.
    reason: lexical_alternative
  - marker: b
    text: “Òṣùwọ̀n” níbí ni metretēs ní èdè Gíríìkì, ìwọ̀n ohun olómi kan ní ayé àtijọ́; ó tó nǹkan bí gálọ́ọ̀nù 8 sí 9, tàbí lítà 35 sí 40.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: sì wà níbẹ̀
  rationale: “Sì” fi ìsopọ̀ fẹ́ẹ́rẹ́ tí δέ ní hàn láìfi ọ̀rọ̀ àkókò kan kun un; “níbẹ̀” túmọ̀ ἐκεῖ ní tààrà.
- source_word: λίθιναι ὑδρίαι ἓξ
  choice: àwọn ìkòkò omi mẹ́fà tí a fi òkúta ṣe
  rationale: Ìtumọ̀ yìí pa irú ohun èlò náà, ohun tí a fi ṣe é, àti iye rẹ̀ mọ́ ní èdè Yorùbá àdánidá.
- source_word: κείμεναι
  choice: tí a gbé kalẹ̀
  rationale: κεῖμαι níbí ń tọ́ka sí pé àwọn ìkòkò náà wà ní ibi tí a gbé wọn sí; “gbé kalẹ̀” yẹra fún ìtumọ̀ pé wọ́n dùbúlẹ̀.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: gẹ́gẹ́ bí àṣà ìwẹ̀nù àwọn Júù
  rationale: “Gẹ́gẹ́ bí” pa agbára κατά mọ́, “àṣà ìwẹ̀nù” sì sọ pé ìwẹ̀nù àṣà ẹ̀sìn ni καθαρισμός ń tọ́ka sí láìsọ ọ́ di ẹ̀kọ́ ìjọ kan pàtó.
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ọ̀kọ̀ọ̀kan wọn lè gba òṣùwọ̀n méjì tàbí mẹ́ta
  rationale: “Lè gba” fi agbára ohun èlò náà hàn, “ọ̀kọ̀ọ̀kan” sì mú ìtumọ̀ pínpín ἀνά jáde. “Òṣùwọ̀n” pa ẹ̀ka ìwọ̀n ayé àtijọ́ mọ́ láìfi ìṣírò òde òní tí ó dà bí ẹni pé ó péye sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ τῶν Ἰουδαίων nínú àlàyé Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí àṣà ìwẹ̀nù ẹ̀sìn tí a mọ̀ sí ti àwọn Júù, kì í ṣe pàtàkì sí ibi tí ènìyàn ti wá. Yíyan “àwọn Júù” kò fi ìtumọ̀ àtakò kankan kún un.
- issue: Agbára κατά nínú κατὰ τὸν καθαρισμὸν
  choice: gẹ́gẹ́ bí àṣà ìwẹ̀nù
  alternative: fún àṣà ìwẹ̀nù
  rationale: κατά lè fi ìbámu pẹ̀lú àṣà tàbí ète lílò hàn níbí. Ọ̀rọ̀ pàtàkì yan ìbámu pẹ̀lú àṣà, àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ ète lílò tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yà gbólóhùn agbára àwọn ìkòkò sí gbolohun kejì fún ìmúlò àdánidá àti ìtúmọ̀ kedere, láìyí ìbáṣepọ̀ àwọn èrò inú orísun padà.
