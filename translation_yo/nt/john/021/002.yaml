source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: yo
  text: Símónì Pétérù, Tómásì tí a ń pè ní Dídímù[a], Nátáníẹ́lì ará Kánà ti Gálílì, àwọn ọmọkùnrin Sébédè, àti àwọn méjì mìíràn lára àwọn ọmọ-ẹ̀yìn rẹ̀ wà papọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dídímù” jẹ́ ọ̀rọ̀ Gíríìkì tó túmọ̀ sí “Ìbejì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: wà papọ̀
  rationale: Àkójọpọ̀ yìí sọ ipò wọn ní àkókò ìtàn náà, ó sì fi hàn pé wọ́n wà ní ibi kan náà; “wà papọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó mú ìtumọ̀ méjèèjì jáde.
- source_word: Σίμων Πέτρος
  choice: Símónì Pétérù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń pe àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tómásì tí a ń pè ní Dídímù[a]
  rationale: “Tí a ń pè ní” túmọ̀ λεγόμενος lọ́nà àdánidá. A ṣe àkọsílẹ̀ Δίδυμος gẹ́gẹ́ bí orúkọ àpèjẹ, a sì ṣàlàyé ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Nátáníẹ́lì ará Kánà ti Galili
  rationale: “Ará Kánà” fi ibi tí Nátáníẹ́lì ti wá hàn ní Yorùbá tó rọrùn, “ti Galili” sì pa ìtọ́kasí agbègbè náà mọ́.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: àwọn ọmọ Sébédè
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àfihàn ìbátan tí ó ń tọ́ka sí àwọn ọmọkùnrin Sébédè; Yorùbá lè lo “àwọn ọmọ” láìfi akọ kún un nítorí àyíká ọ̀rọ̀ náà ṣe kedere.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: àwọn méjì mìíràn lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Lára” pa ìtumọ̀ partitive ἐκ mọ́, ó sì jẹ́ kedere pé àwọn méjì náà wà lára gbogbo àwọn ọmọ-ẹ̀yìn rẹ̀.
- source_word: καί ... καί
  choice: àkójọ tí àmì kọ́mà pín, pẹ̀lú “àti” ní ìparí
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti tò àkójọ ní Yorùbá láìsọ ìbáṣepọ̀ àwọn ẹ̀yà rẹ̀ nù.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àkọsílẹ̀ orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn níbi tí ó bá bá ìlò àdánidá mu.
