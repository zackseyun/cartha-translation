  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Ẹ mú díẹ̀ nínú àwọn ẹja tí ẹ ṣẹ̀ṣẹ̀ mú wá.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀ yìí jẹ́ historical present nínú ìtàn Gíríìkì; lílo àkókò tí ó ti kọjá nínú Yorùbá bá ìtàn àdánidá mu láìsọ iṣẹ́ ìtàn rẹ̀ nù.
- source_word: Ἐνέγκατε
  choice: Ẹ mú … wá
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni; ‘Ẹ mú … wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n gbé ẹja náà tọ Jésù wá.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: lára ẹja
  rationale: ἀπό pẹ̀lú genitive níbí ní ìtumọ̀ partitive, ìyẹn apá kan lára gbogbo ẹja tí wọ́n mú; ‘lára ẹja’ sọ èyí ní kedere láìfi ‘díẹ̀’ tí kò sí ní tààrà sínú ọ̀rọ̀ náà.
- source_word: ὀψαρίων
  choice: ẹja
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ẹja tí wọ́n ṣẹ̀ṣẹ̀ mú, láìjẹ́ dandan pé kí a sọ pé ó kéré tàbí pé a ti sè é.
- source_word: ὧν ἐπιάσατε
  choice: tí ẹ … mú
  rationale: Gbólóhùn ìbátan náà dá àwọn ẹja tí Jésù ń tọ́ka sí mọ̀ gẹ́gẹ́ bí èyí tí àwọn ọmọ-ẹ̀yìn mú.
- source_word: νῦν
  choice: ṣẹ̀ṣẹ̀
  rationale: Ní àyíká yìí, νῦν fi hàn pé ìmú ẹja náà ṣẹlẹ̀ ní kété ṣáájú; ‘ṣẹ̀ṣẹ̀’ jẹ́ Yorùbá àdánidá fún ìtumọ̀ yẹn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasan. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú αὐτοῖς àti àṣẹ ọ̀pọ̀ ènìyàn.
