id: JHN.21.18
reference: John 21:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo wí fún ọ, nígbà tí o wà ní ọ̀dọ́, o máa ń di aṣọ mọ́ ara rẹ[a], o sì máa ń rìn lọ sí ibi tí o bá fẹ́; ṣùgbọ́n nígbà tí o bá darúgbó, iwọ yóò na ọwọ́ rẹ̀ jáde[b], ẹlòmíràn yóò sì di aṣọ mọ́ ọ, yóò sì mú ọ lọ sí ibi tí o kò fẹ́ lọ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “o máa ń di àmùrè mọ́ ara rẹ.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí dídì tàbí fífi aṣọ mọ́ ara; níbí, ó fi òmìnira Pétérù tẹ́lẹ̀ wé bí yóò ṣe gbára lé ẹlòmíràn lẹ́yìn náà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀pọ̀ ènìyàn ló lóye “na ọwọ́ rẹ̀ jáde” gẹ́gẹ́ bí ìtọ́ka sí ikú Pétérù lórí àgbélébùú; ẹsẹ tó tẹ̀ lé e ṣàlàyé pé Jesu sọ èyí láti fi irú ikú tí Pétérù yóò fi fún Ọlọ́run ní ògo hàn.
    reason: cross_reference
  - marker: c
    text: Tàbí, “yóò sì gbé ọ lọ” tàbí “yóò sì kó ọ lọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé a gbé ẹni tàbí a mú un lọ sí ibi tí kò fẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí ìtẹnumọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ọ̀wọ̀ gbolohun náà mu.
- source_word: λέγω σοι
  choice: ni mo wí fún ọ
  rationale: Ó pa ọ̀rọ̀ tààrà sí ẹni kan àti ìlànà ọ̀rọ̀ Johanu mọ́.
- source_word: ὅτε ἦς νεώτερος
  choice: nígbà tí o wà ní ọ̀dọ́
  rationale: Èyí sọ ìgbà èwe Pétérù ní ìyàtọ̀ sí ọjọ́ ogbó tí a mẹ́nu kàn lẹ́yìn náà, ní Yorùbá tí ó ṣe déédéé.
- source_word: ἐζώννυες σεαυτόν
  choice: ìwọ a máa di aṣọ mọ́ ara rẹ
  rationale: Ó fi ìṣe tí ó ń ṣẹlẹ̀ déédéé ní ìgbà àtijọ́ hàn, ó sì pa àwòrán gíríìkì ti dídì aṣọ mọ́ ara ẹni àti òmìnira Pétérù mọ́.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: kí o sì máa rìn lọ sí ibi tí o bá fẹ́
  rationale: Ó tọ́ka sí ìrìn tàbí lílọ gidi, kì í ṣe ìwà ẹ̀mí, ó sì fi òmìnira yíyan ibi tí yóò lọ hàn.
- source_word: ὅταν δὲ γηράσῃς
  choice: ṣùgbọ́n nígbà tí o bá darúgbó
  rationale: Ó túmọ̀ ìṣẹ̀lẹ̀ ọjọ́ iwájú lọ́nà àdánidá, ṣùgbọ́n ó sì pa ìyàtọ̀ δέ mọ́.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: ìwọ yóò na ọwọ́ rẹ̀ jáde
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí kò fi ìtumọ̀ ikú àgbélébùú sínú ọ̀rọ̀ Jesu ṣáájú àlàyé ẹsẹ tó tẹ̀ lé e.
- source_word: ἄλλος σε ζώσει
  choice: ẹlòmíràn yóò sì di aṣọ mọ́ ọ
  rationale: Ó pa ìfarakanra lexical mọ́ pẹ̀lú ἐζώννυες, ó sì mú ìyàtọ̀ láàárín ṣíṣe fún ara ẹni àti ohun tí ẹlòmíràn yóò ṣe sí i hàn.
- source_word: οἴσει
  choice: yóò sì mú ọ lọ
  rationale: φέρω lè túmọ̀ sí gbígbé, mímú, tàbí kíkó ẹni lọ; ‘mú ọ lọ’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣísẹ̀ sí ibi tí ẹni náà kò fẹ́ mọ́.
- source_word: ὅπου οὐ θέλεις
  choice: sí ibi tí o kò fẹ́ lọ
  rationale: A fi ‘lọ’ kún un gẹ́gẹ́ bí ohun tí gíríìkì fi sílẹ̀ lábẹ́ òye, kí Yorùbá lè ṣe kedere àti àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ àsọtẹ́lẹ̀ ikú àgbélébùú ní gbangba nínú ẹsẹ yìí
  choice: Pa àwòrán ‘na ọwọ́ rẹ̀ jáde’ mọ́ láì sọ àgbélébùú ní pàtó nínú ọ̀rọ̀ pàtàkì
  alternative: Túmọ̀ ọ́ ní gbangba gẹ́gẹ́ bí àsọtẹ́lẹ̀ pé a ó kan Pétérù mọ́ àgbélébùú
  rationale: Ẹsẹ tó tẹ̀ lé e ló ṣàlàyé pé Jesu ń tọ́ka sí irú ikú tí Pétérù yóò fi yin Ọlọ́run lógo. Ìtumọ̀ yìí pa bí ìwé náà ṣe ń ṣí ìtumọ̀ náà payá ní ìpele mọ́, kò sì yanjú àwòrán náà ṣáájú àsìkò.
- issue: Bóyá ζώννυμι túmọ̀ sí wíwọ aṣọ tàbí dídè ẹni
  choice: Lo ‘di aṣọ mọ́’ ní ìgbà méjèèjì
  alternative: Lo ‘dè ọ́’ ní apá kejì láti tẹnumọ́ ìfipámúni àti ikú
  rationale: Àtúnlò gbọ́ngbò ọ̀rọ̀ kan náà nínú gíríìkì dá ìyàtọ̀ sílẹ̀ láàárín òmìnira Pétérù tẹ́lẹ̀ àti ìgbẹ́kẹ̀lé rẹ̀ ní ọjọ́ iwájú. ‘Di aṣọ mọ́’ pa ìfarakanra yìí mọ́ láì fi ìtumọ̀ kan ṣoṣo lé àwòrán náà lórí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Àtúnwí “Lóòótọ́, lóòótọ́” pa ìtẹnumọ́ Johanu mọ́. “Di aṣọ mọ́” jẹ́ kedere ju ọ̀rọ̀ àtijọ́ tàbí èdè ẹ̀sìn pàtó lọ, ó sì pa àwòrán dídì aṣọ mọ́ ara àti ìyàtọ̀ láàárín òmìnira àti ìgbẹ́kẹ̀lé mọ́.
