source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: yo
  text: Nítorí náà, Símónì Pétérù gun ọkọ̀[a], ó sì fa àwọ̀n náà wá sí etíkun, tí ó kún fún ẹja ńlá, ọgọ́rùn-ún àti àádọ́ta mẹ́ta; bí wọ́n tilẹ̀ pọ̀ tó bẹ́ẹ̀, àwọ̀n náà kò ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gòkè.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “gòkè,” ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó túmọ̀ sí pé Símónì Pétérù gun ọkọ̀ láti fa àwọ̀n náà wọlé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: gun inú ọkọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘gòkè/gun,’ ṣùgbọ́n nínú àyíká ìtàn yìí ó ṣeé ṣe kí ó tọ́ka sí wíwọ inú ọkọ̀; ‘gun inú ọkọ̀’ jẹ́ èdè Yorùbá àdánidá tí ó tún pa àwòrán ìgòkè mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe Pétérù pọ̀ mọ́ àṣẹ àti ìdáhùn inú ẹsẹ tó ṣáájú, gẹ́gẹ́ bí àbájáde ìtàn.
- source_word: εἵλκυσεν
  choice: fa ... wá
  rationale: Ó fi ìṣe fífa àwọ̀n sí etíkun hàn ní kedere láìfi ìtumọ̀ àfikún kún un.
- source_word: τὸ δίκτυον
  choice: àwọ̀n náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ohun èlò ìpẹja yìí.
- source_word: εἰς τὴν γῆν
  choice: sí etíkun
  rationale: Ní tààrà, ó jẹ́ ‘sí ilẹ̀’; nínú ìṣẹ̀lẹ̀ ìpẹja yìí, ‘sí etíkun’ sọ ibi tí wọ́n ń fa àwọ̀n náà lọ ní èdè àdánidá.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: ó kún fún ẹja ńlá
  rationale: Ìtumọ̀ tààrà, ó sì ye òǹkàwé Yorùbá òde òní ní rọrùn.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: àádọ́jọ ó lé mẹ́ta
  rationale: Ó pa nọ́ńbà pàtó 153 mọ́ ní ọ̀nà ìṣírò Yorùbá tí ó tọ́.
- source_word: τοσούτων ὄντων
  choice: bí wọ́n tilẹ̀ pọ̀ tó bẹ́ẹ̀
  rationale: 'Ó fi ìtumọ̀ ìyọ̀ǹda genitive absolute náà hàn: bí iye ẹja náà tilẹ̀ pọ̀ tó.'
- source_word: οὐκ ἐσχίσθη
  choice: kò ya
  rationale: Ọ̀nà Yorùbá àdánidá ni láti sọ pé àwọ̀n kò ya; ó pa àbájáde passive náà mọ́ láìsọ ẹni tó ṣe é.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘gun inú ọkọ̀’ fún ìtumọ̀ àyíká ἀνέβη, a sì fi àlàyé ìtumọ̀ tààrà sínú àlàyé ìsàlẹ̀. ‘Àádọ́jọ ó lé mẹ́ta’ jẹ́ ọ̀nà Yorùbá àdánidá fún 153.
