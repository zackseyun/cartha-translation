reference: John 21:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Bí mo bá fẹ́[a] kí ó dúró títí èmi yóò fi dé[b], kí ni ìyẹn kàn ọ́? Ìwọ, tẹ̀lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí mo bá pinnu.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè sọ ohun tí ẹni fẹ́ tàbí ohun tí ó pinnu.
    reason: lexical_alternative
  - marker: b
    text: A mọ̀ọ́mọ̀ fi “títí èmi yóò fi dé” sílẹ̀ láìṣàlàyé rẹ̀ síwájú. Àwọn atúmọ̀ yàtọ̀ lórí bóyá ó ń tọ́ka sí dídé Jésù nínú ìṣẹ̀lẹ̀ kan lẹ́yìn náà tàbí sí dídé rẹ̀ ní òpin.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: A lo ọ̀rọ̀ àsìkò tí ó ti kọjá tí ó bá ìtàn Yorùbá mu, bí ó tilẹ̀ jẹ́ pé àsìkò ìsinsìnyí ni Gíríìkì lò gẹ́gẹ́ bí ọ̀nà ìtàn.
- source_word: Ἐὰν
  choice: Bí ... bá
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi sọ gbólóhùn oníṣ شرط, ó sì pa ìtumọ̀ àròsọ-ipò inú Gíríìkì mọ́.
- source_word: θέλω
  choice: fẹ́
  rationale: “Fẹ́” lè sọ ìfẹ́-inú tàbí ìpinnu ẹni, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere láìfi ìtumọ̀ kan ṣoṣo lé Gíríìkì lórí.
- source_word: μένειν
  choice: kí ó dúró
  rationale: “Dúró” pa ìtumọ̀ pé kí ẹni náà máa wà síbẹ̀ tàbí kí ó ṣì wà mọ́, láìṣàlàyé rẹ̀ ní pàtó bí “kí ó wà láàyè.”
- source_word: ἕως ἔρχομαι
  choice: títí èmi yóò fi dé
  rationale: “Dé” sọ wíwá sí ibi kan ní ọ̀nà àdánidá, kò sì túmọ̀ rẹ̀ sí “padà dé,” èyí tí ì bá ti fi èrò àfikún kún ọ̀rọ̀ náà. Fífi “èmi” hàn tún mú ẹni tí ń bọ̀ ṣe kedere.
- source_word: τί πρὸς σέ;
  choice: kí ni ìyẹn kàn ọ́?
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tí ó fi ìbéèrè tààrà hàn, ó sì sọ pé ọ̀ràn ọmọ-ẹ̀yìn kejì kì í ṣe ohun tí ó yẹ kí Pétérù dá sí.
- source_word: σύ
  choice: Ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba pa ìtẹnumọ́ àti ìyàtọ̀ láàárín “òun” àti “ìwọ” mọ́.
- source_word: μοι ἀκολούθει
  choice: máa tọ̀ mí lẹ́yìn
  rationale: “Máa tọ̀ mí lẹ́yìn” jẹ́ àṣẹ àdánidá ní Yorùbá, ó sì lè fi ìṣe tí ó ń bá a lọ hàn gẹ́gẹ́ bí àṣẹ àsìkò ìsinsìnyí inú Gíríìkì.
theological_decisions:
- issue: Ohun tí “títí èmi yóò fi dé” (ἕως ἔρχομαι) ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ ní gbogbogbòò sí “títí èmi yóò fi dé,” láìsọ irú dídé tí Jésù ní lọ́kàn.
  alternative: A lè túmọ̀ rẹ̀ gẹ́gẹ́ bí dídé Jésù nínú ìṣẹ̀lẹ̀ kan lẹ́yìn náà tàbí gẹ́gẹ́ bí dídé rẹ̀ ní òpin.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò sọ ohun tí dídé yìí jẹ́ ní pàtó, àyíká ẹsẹ 22–23 sì kìlọ̀ fún ẹni tí yóò fa ìtumọ̀ tí Jésù kò sọ jáde. Nítorí náà, a pa àìdánilójú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “máa tọ̀ mí lẹ́yìn” láti fi ipa àṣẹ tí ń bá a lọ hàn, a sì lo “Ìwọ” ní gbangba láti pa ìtẹnumọ́ Gíríìkì mọ́.
