source:
  edition: SBLGNT
  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: yo
  text: Èyí ni ìgbà kẹta báyìí tí a fi Jésù hàn sí àwọn ọmọ-ẹ̀yìn lẹ́yìn tí a ti jí i dìde láti inú òkú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èyí ni ìgbà kẹta báyìí tí Jésù farahàn sí àwọn ọmọ-ẹ̀yìn lẹ́yìn tí a ti jí i dìde láti inú òkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Èyí sì ni ìgbà kẹta
  rationale: “Èyí” tọ́ka sí ìfarahàn tí a ṣẹ̀ṣẹ̀ ròyìn; “ìgbà kẹta” fi ìtumọ̀ ordinal adverbial τρίτον hàn ní Yorùbá àdánidá. “Sì” jẹ́ kí ìṣàn ìtàn náà dùn, ó sì ń fi ibi tí ìṣírò náà dé hàn.
- source_word: ἐφανερώθη
  choice: tí a fi Jésù hàn
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì dá ìtumọ̀ ‘ṣe ní gbangba/fihàn’ dúró; “farahàn” jẹ́ àṣàyàn àdánidá tí àkọsílẹ̀ ìsàlẹ̀ fi hàn.
- source_word: τοῖς μαθηταῖς
  choice: sí àwọn ọmọ-ẹ̀yìn
  rationale: Ó tẹ̀ lé dative Gíríìkì, kò sì fi ‘rẹ̀’ kún un níbi tí orísun kò ti sọ ọ́ ní tààrà.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: lẹ́yìn tí a ti jí i dìde kúrò nínú òkú
  rationale: Ó sọ ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì di mímọ̀, ó sì pa ohùn àìṣe ἐγερθεὶς mọ́. “Kúrò nínú òkú” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ἐκ νεκρῶν.
theological_decisions:
- issue: Ohùn àìṣe nínú ἐγερθεὶς ἐκ νεκρῶν
  choice: lẹ́yìn tí a ti jí i dìde kúrò nínú òkú
  alternative: lẹ́yìn tí ó jí dìde kúrò nínú òkú
  rationale: Orísun lo participle àìṣe, nítorí náà ọ̀rọ̀ àkọ́kọ́ pa ohùn náà mọ́ láì sọ ẹni tó ṣe ìṣe náà ní pàtó, bí Gíríìkì náà kò ti sọ ọ́.
- issue: Ìtumọ̀ ἐφανερώθη
  choice: a fi Jésù hàn
  alternative: Jésù farahàn
  rationale: Àkọ́kọ́ pa fọ́ọ̀mù àìṣe àti àṣà ọ̀rọ̀ Johanu mọ́; èkejì jẹ́ ìtumọ̀ àyíká tó bófin mu, nítorí náà a fi sí àkọsílẹ̀ ìsàlẹ̀ láti pa àìdájú lexical náà mọ́.
translation_notes:
  register: Yorùbá àgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘ọmọ-ẹ̀yìn’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀, a sì yàgò fún fífi ‘rẹ̀’ kún ‘àwọn ọmọ-ẹ̀yìn’ nítorí kò sí ní tààrà nínú Gíríìkì.
