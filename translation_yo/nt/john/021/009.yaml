  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìtẹ̀lé ìṣẹ̀lẹ̀, ìbálẹ̀ sí ilẹ̀, àti wíwo iná, ẹja, àti búrẹ́dì. Ṣùgbọ́n “àkàrà” ní Yorùbá òde òní máa ń túmọ̀ sí oúnjẹ ẹ̀wà tí a fried, kì í ṣe ἄρτον (‘búrẹ́dì’). “Iná ẹ̀yín” kò sì jẹ́ ọ̀rọ̀ Yorùbá boṣewa tó ṣe kedere fún ἀνθρακιά; “iná èédú” ni ó dáa jù.
