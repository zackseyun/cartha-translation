id: JHN.21.9
reference: John 21:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: yo
  text: Nítorí náà, nígbà tí wọ́n jáde wá sí ilẹ̀[a], wọ́n rí iná èédú[b] tí a gbé kalẹ̀, ẹja tí a gbé sórí i, àti búrẹ́dì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n dé etíkun.” Gíríìkì sọ ní pẹkipẹki pé, “wọ́n jáde sí ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “iná èédú” tún fara hàn ní Jòhánù 18:18, ó sì so ìṣẹ̀lẹ̀ yìí pọ̀ nípa ọ̀rọ̀ pẹ̀lú ibi tí Pétérù ti sẹ́ Jésù tẹ́lẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó pa ìtumọ̀ àsopọ̀ οὖν àti àkókò ὡς mọ́, ó sì bá ìṣàn ìtàn Yorùbá mu.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: wọ́n jáde sí orí ilẹ̀
  rationale: Ó fi hàn pé wọ́n jáde kúrò nínú ọkọ̀ ojú omi dé ilẹ̀, láì fi ọ̀rọ̀ etíkun kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: βλέπουσιν
  choice: wọ́n rí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí inú ìtàn, àkókò tí ó ti kọjá ni ó jẹ́ ti ẹ̀dá Yorùbá nínú ìtàn yìí.
- source_word: ἀνθρακιὰν
  choice: iná ẹ̀yín
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún iná tí a fi ẹ̀yín dá, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ pẹ̀lú Jòhánù 18:18 mọ́.
- source_word: κειμένην
  choice: tí a ti dá síbẹ̀
  rationale: Ó sọ ipò iná náà lọ́nà àdánidá ní Yorùbá, láì jẹ́ kí iná dà bí ohun tí ó kan dùbúlẹ̀.
- source_word: ὀψάριον
  choice: ẹja
  rationale: Nínú Jòhánù, ọ̀rọ̀ náà tọ́ka sí ẹja gẹ́gẹ́ bí oúnjẹ; Yorùbá kò fi dandan mú un jẹ́ ẹja kan ṣoṣo tàbí ọ̀pọ̀ ẹja.
- source_word: ἐπικείμενον
  choice: wà lórí rẹ̀
  rationale: Ó ṣàlàyé pé ẹja náà wà lórí iná ẹ̀yín, bí ọ̀rọ̀ Gíríìkì ṣe tọ́ka sí i.
- source_word: ἄρτον
  choice: àkàrà
  rationale: Àkàrà ni ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀ fún búrẹ́dì tàbí ìṣù búrẹ́dì; kò sọ iye tàbí ìrísí rẹ̀ ju orísun lọ.
theological_decisions:
- issue: Ìsinsìnyí inú ìtàn (historical present)
  choice: 'Túmọ̀ βλέπουσιν sí àkókò tí ó ti kọjá: “wọ́n rí”'
  alternative: 'Pa àkókò ìsinsìnyí mọ́: “wọ́n rí i” nínú ìsinsìnyí ìtàn'
  rationale: Èyí jẹ́ ọ̀nà ìsọ̀tàn ju ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ lọ; àkókò tí ó ti kọjá mú un jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A yan ìṣọ̀kan tó wà láàárín ìtẹ̀lé orísun àti àdánidá Yorùbá.
