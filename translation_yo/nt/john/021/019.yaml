id: JHN.21.19
reference: John 21:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: yo
  text: Ó sọ èyí láti fi hàn irú ikú tí yóò fi yin Ọlọ́run lógo[a]. Nígbà tí ó sì ti sọ èyí tan, ó wí fún un[b] pé, “Tẹ̀lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà ikú tí yóò gbà yin Ọlọ́run lógo.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ìṣe-ìsinsìnyí nínú ìtàn níbí: “ó wí fún un.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: láti fi hàn
  rationale: Ó sọ pé ohun tí Jésù wí ń tọ́ka sí ohun kan láìṣàlàyé rẹ̀ ní tààràtà; “láti fi hàn” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: ποίῳ θανάτῳ
  choice: irú ikú tí yóò fi
  rationale: “Irú ikú” pa ìtumọ̀ ànímọ́ ποίῳ mọ́, èyí tí ó ń béèrè irú tàbí ọ̀nà ikú, kì í ṣe ikú lásán.
- source_word: δοξάσει
  choice: yóò fi yin ... lógo
  rationale: “Yóò” pa agbára ọ̀rọ̀ ọjọ́ iwájú mọ́, “yin Ọlọ́run lógo” sì jẹ́ ọ̀nà Yorùbá àdánidá fún δοξάζω ní àyíká yìí.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún θεός níbí.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sì sọ èyí
  rationale: Ó mú ìbáṣepọ̀ àkókò inú aorist participle jáde ní Yorùbá tó ṣe kedere, ó sì pa καί mọ́ pẹ̀lú “sì.”
- source_word: λέγει αὐτῷ
  choice: ó wí fún un
  rationale: “Ó wí fún un” jẹ́ ọ̀rọ̀ ìtàn oníyì tí ó bá ìlò vivid historical present mu dé ìwọ̀n tí èdè Yorùbá, tí kò ní àmì tense lórí ọ̀rọ̀-ìṣe bí Gíríìkì, ti lè fi hàn.
- source_word: Ἀκολούθει μοι
  choice: Tọ̀ mí lẹ́yìn
  rationale: Àṣẹ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì lè ní agbára ìpè lẹ́sẹ̀kẹsẹ̀ àti ti ọmọ-ẹ̀yìn tó ń bá a lọ láìfi ọ̀kan ṣoṣo múlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ pé ikú Pétérù yóò yin Ọlọ́run lógo
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí “yóò fi yin Ọlọ́run lógo,” láìfi àlàyé míì kún un.
  alternative: Láti túmọ̀ rẹ̀ ní pàtó sí pé ikú ajẹ́rìí Pétérù yóò yin Ọlọ́run lógo nípasẹ̀ ìjẹ́rìí olóòótọ́ rẹ̀.
  rationale: Ẹsẹ̀ náà sọ pé ikú yìí yóò yin Ọlọ́run lógo, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí èyí yóò gbà ṣẹlẹ̀. Ìtumọ̀ náà pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́ láìfi ẹ̀kọ́ àfikún sínú ọ̀rọ̀ pàtàkì.
- issue: Agbára àṣẹ Ἀκολούθει μοι
  choice: “Tọ̀ mí lẹ́yìn” ni a lò kí ó lè gba ìtẹ̀lé lẹ́sẹ̀kẹsẹ̀ àti ìtẹ̀síwájú ọmọ-ẹ̀yìn.
  alternative: “Máa tọ̀ mí lẹ́yìn,” èyí tí yóò tẹnu mọ́ ìtẹ̀síwájú jù.
  rationale: Present imperative Gíríìkì lè ní agbára tó ń bá a lọ, ṣùgbọ́n àyíká náà tún jẹ́ ìpè tààrà. Àṣẹ Yorùbá aláìní “máa” kò fi ọ̀kan nínú méjèèjì múlẹ̀ ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá àpapọ̀ oníyì pẹ̀lú àmì ohùn ni a lò. Ọ̀rọ̀ náà rọrùn fún òǹkàwé òde òní, ṣùgbọ́n ó pa ìṣísẹ̀ gbolohun àti ìdákẹ́jẹ ẹ̀kọ́ ìgbàgbọ́ inú orísun Gíríìkì mọ́.
