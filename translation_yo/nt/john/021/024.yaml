id: JHN.21.24
reference: John 21:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: yo
  text: Èyí ni ọmọ-ẹ̀yìn náà tí ó ń jẹ́rìí nípa àwọn nǹkan wọ̀nyí, tí ó sì kọ àwọn nǹkan wọ̀nyí sílẹ̀; àwa sì mọ̀ pé òótọ́ ni ẹ̀rí rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ń ṣe ẹ̀rí nípa àwọn nǹkan wọ̀nyí ... òótọ́ ni ẹ̀rí rẹ̀.” Nínú Gíríìkì, ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ fún jíjẹ́rìí àti ẹ̀rí ní gbòǹgbò kan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka yìí ń tọ́ka sí ọmọ-ẹ̀yìn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “Èyí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi dá ẹni náà mọ̀.
- source_word: μαθητὴς
  choice: ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ọ̀rọ̀ Johanu mu fún ẹni tí ń tẹ̀lé tí ó sì ń kọ́ lábẹ́ Jesu.
- source_word: μαρτυρῶν
  choice: tí ó ń jẹ́rìí
  rationale: Àmì “ń” fi ìṣe tí ó ń bá a lọ tàbí ìṣe tí ó jẹ́ àbùdá ẹni náà hàn, ó sì pa èdè ẹ̀rí mọ́.
- source_word: περὶ τούτων
  choice: nípa àwọn nǹkan wọ̀nyí
  rationale: Ó túmọ̀ gbólóhùn orísun ní tààrà, ó sì ń tọ́ka padà sí àwọn ohun tí ìwé Ìhìn Rere náà sọ.
- source_word: ὁ γράψας ταῦτα
  choice: tí ó sì kọ àwọn nǹkan wọ̀nyí sílẹ̀
  rationale: Ó fi hàn pé ìkọ̀wé náà jẹ́ ìṣe tí a ti ṣe parí; “kọ ... sílẹ̀” jẹ́ Yorùbá àdánidá fún kíkọ ohun kan sí inú ìwé.
- source_word: οἴδαμεν
  choice: àwa sì mọ̀
  rationale: Ó pa ẹni-kìíní ọ̀pọ̀ “àwa” mọ́ ní kedere láì sọ ẹni tí “àwa” náà ń tọ́ka sí.
- source_word: ἀληθὴς
  choice: òótọ́
  rationale: “Òótọ́” ni ìtumọ̀ tààrà, ó sì lè ní ìtumọ̀ pé ẹ̀rí náà bá òtítọ́ mu.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: ẹ̀rí rẹ̀
  rationale: Èyí jẹ́ ìṣètò ọ̀rọ̀ Yorùbá àdánidá fún ọ̀rọ̀-orúkọ oníhun àti “ẹ̀rí.”
- source_word: μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” bá “jẹ́rìí” mu ní gbòǹgbò àti ní ìtumọ̀, ó sì pa ìbátan ọ̀rọ̀ μαρτυρῶν/μαρτυρία mọ́ dé ibi tí Yorùbá àdánidá gbà.
theological_decisions:
- issue: Ta ni “àwa mọ̀” ń tọ́ka sí?
  choice: Fi ẹni-kìíní ọ̀pọ̀ náà hàn ní tààrà gẹ́gẹ́ bí “àwa sì mọ̀,” láì dá àwọn olùsọ̀rọ̀ mọ̀.
  alternative: Kí a túmọ̀ rẹ̀ bí ohùn olóòtú onkọ̀wé tàbí bí ìjẹ́rìí àwùjọ kan.
  rationale: Gíríìkì sọ “àwa” ní kedere, ṣùgbọ́n kò sọ ẹni tí wọ́n jẹ́; ìtumọ̀ kò gbọ́dọ̀ pinnu ọ̀ràn onkọ̀wé tàbí àwùjọ tí ẹsẹ náà fi sílẹ̀ láìyanjú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ ti ìgbàlódé, ó níyì, ó sì rọrùn fún òǹkàwé lásán. A lo “ọmọ-ẹ̀yìn,” “jẹ́rìí,” àti “ẹ̀rí” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
