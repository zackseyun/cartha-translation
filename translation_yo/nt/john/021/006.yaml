id: JHN.21.6
reference: John 21:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ẹ ju àwọ̀n náà sí ìhà ọ̀tún ọkọ̀ náà, ẹ ó sì rí.”[a] Nítorí náà, wọ́n ju ú síbẹ̀, wọ́n kò sì lè fà á wọlé mọ́ nítorí ọ̀pọ̀lọpọ̀ ẹja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ṣókí pé, “ẹ ó sì rí”; Gíríìkì kò sọ ohun tí wọn yóò rí ní tààrà, ṣùgbọ́n àyíká ìpẹja fi hàn pé ẹja ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Ẹ ju
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí kí wọ́n ju àwọ̀n; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ fífi àwọ̀n sínú omi.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: sí apá ọ̀tún ọkọ̀ ojú omi náà
  rationale: Ó pa ìtọ́kasí sí ẹ̀gbẹ́ ọ̀tún ọkọ̀ mọ́ láìlo ọ̀rọ̀ amọ̀jà ọkọ̀ ojú omi.
- source_word: τὸ δίκτυον
  choice: àwọ̀n náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọ̀n ìpẹja; àfihàn náà sì bá definite article Gíríìkì mu.
- source_word: εὑρήσετε
  choice: ẹ ó sì rí
  rationale: A kò fi ohun tí wọn yóò rí kún un, nítorí Gíríìkì kò sọ ohun náà ní tààrà; àyíká ìpẹja mú ìtumọ̀ rẹ̀ yé ni.
- source_word: ἑλκύσαι
  choice: fà á wọlé
  rationale: Ó ṣàfihàn fífà àwọ̀n náà padà sínú ọkọ̀ ní èdè Yorùbá àdánidá.
- source_word: οὐκέτι … ἴσχυον
  choice: wọn kò sì lè … mọ́
  rationale: Àkójọpọ̀ yìí sọ ìyípadà sí àìní agbára láti ṣe ohun náà lẹ́yìn tí ẹja kún àwọ̀n.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: nítorí ọ̀pọ̀lọpọ̀ ẹja tí ó wà nínú rẹ̀
  rationale: “Nítorí” mú ipa ìdí ti ἀπό hàn, “ọ̀pọ̀lọpọ̀ ẹja” sì sọ πλήθος ní Yorùbá tí ó ṣe kedere; “tí ó wà nínú rẹ̀” mú ìbáṣepọ̀ pẹ̀lú àwọ̀n náà hàn gẹ́gẹ́ bí àyíká ṣe béèrè.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. A lo ọ̀pọ̀ ẹni inú ọ̀rọ̀ àṣẹ (“Ẹ ju”) àti nínú ìlérí (“ẹ ó sì rí”). Gbólóhùn náà pa ohun tí εὑρήσετε ń tọ́ka sí mọ́ láìsọ ọ́ ní tààrà, bí ó ti rí nínú Gíríìkì.
