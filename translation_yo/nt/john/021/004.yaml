id: JHN.21.4
reference: John 21:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ ti mọ́[a], Jésù dúró ní etíkun; síbẹ̀ àwọn ọmọ-ẹ̀yìn náà kò mọ̀ pé Jésù ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí òwúrọ̀ ti dé.”
    reason: Ìtumọ̀ mìíràn fún πρωΐας ... ἤδη γενομένης; ọ̀rọ̀ náà lè tọ́ka sí ìmọ́lẹ̀ ìbẹ̀rẹ̀ ọjọ́ tàbí dídé òwúrọ̀.
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Nígbà tí ilẹ̀ ti mọ́ tán
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ gbólóhùn àkókò; ìṣàpẹẹrẹ Yorùbá ‘ilẹ̀ ti mọ́ tán’ fi hàn pé òwúrọ̀ ti dé, ó sì mú ἤδη (‘ti ... tán’) wọ inú ìtumọ̀ lọ́nà àdánidá. A kò fi δέ ṣe ọ̀rọ̀ ìbẹ̀rẹ̀ ọ̀tọ̀, nítorí ó jẹ́ àsopọ̀ ìtàn kékeré níbí.
- source_word: ἔστη
  choice: dúró
  rationale: Ó túmọ̀ sí pé Jésù dúró tàbí wà ní ìdúró níbẹ̀; ‘dúró’ pa ìrísí ìṣẹ̀lẹ̀ aorist mọ́ láìfi àlàyé kún un.
- source_word: εἰς τὸν αἰγιαλόν
  choice: sí etíkun
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘dúró,’ gbólóhùn náà tọ́ka sí ibi tí Jésù wà. ‘Sí etíkun’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, ó sì pa ìtọ́sọ́nà εἰς mọ́ ní ìwọ̀n tó ṣeé ṣe.
- source_word: οὐ μέντοι
  choice: síbẹ̀ ... kò
  rationale: ‘Síbẹ̀’ fi ìyàtọ̀ tó wà láàárín wíwà Jésù ní etíkun àti àìmọ̀ àwọn ọmọ-ẹ̀yìn hàn láìsọ ọ́ di ìtakò líle.
- source_word: ᾔδεισαν
  choice: kò mọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ οἶδα, ‘mọ̀.’ Àyíká lè túmọ̀ sí àìdámọ̀, ṣùgbọ́n ‘kò mọ̀’ pa ọ̀rọ̀ orísun àti àìdánilójú rẹ̀ mọ́.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Àmì ìdánimọ̀ Gíríìkì tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀ nínú àyíká; ‘náà’ mú ìtọ́kasí yẹn hàn láìfi ‘tirẹ̀’ kún ọ̀rọ̀ orísun.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: pé Jésù ni
  rationale: Èyí jẹ́ ìsọ̀rí ìdánimọ̀ tó ṣe déédé ní Yorùbá, ó sì bá ìtumọ̀ ‘that it was Jesus’ mu láìdi ọ̀rọ̀ mọ́ ọn ní ti gírámà Gíríìkì.
theological_decisions:
- issue: Ìdánimọ̀ Jésù lẹ́yìn àjíǹde
  choice: A sọ pé àwọn ọmọ-ẹ̀yìn kò mọ̀ pé Jésù ni, láìṣàlàyé ìdí tí wọn kò fi mọ̀ ọ́n.
  alternative: A lè túmọ̀ ọ́ ní pàtó sí ‘wọn kò dá a mọ̀ pé Jésù ni.’
  rationale: Ẹsẹ náà sọ àìmọ̀ tàbí àìdámọ̀ wọn, ṣùgbọ́n kò ṣàlàyé ohun tó fà á. Ìtumọ̀ yìí pa ìkóra-ẹni-níjàánu ìtàn náà mọ́, kò sì fi ẹ̀kọ́ nípa ìrísí Jésù tàbí agbára ìríran àwọn ọmọ-ẹ̀yìn kún un.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ilẹ̀ mọ́’ gẹ́gẹ́ bí àsọyé Yorùbá àdánidá fún ìmọ́lẹ̀ òwúrọ̀; a sì pa ‘kò mọ̀’ mọ́ kí àìdánilójú tó wà láàárín mímọ̀ àti dídámọ̀ má bàa parẹ́.
