id: JHN.21.20
reference: John 21:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: yo
  text: Pétérù yí padà, ó sì rí ọmọ-ẹ̀yìn tí Jesu fẹ́ràn, tí ó ń tọ̀ lẹ́yìn[a]. Òun ni ẹni tí ó ti tẹ̀ sí àyà Jesu níbi oúnjẹ alẹ́ náà[b], tí ó sì sọ pé, “Olúwa, ta ni ẹni tí ń fi ọ́ hàn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “tí ó ń tọ̀ Jesu lẹ́yìn” tàbí “tí ó ń tọ̀ wọ́n lẹ́yìn”; Gíríìkì kò sọ ẹni tí ó ń tọ̀ lẹ́yìn ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “tí ó rọ̀ sẹ́yìn sí àyà Jesu níbi oúnjẹ alẹ́ náà.” Gíríìkì ń ṣàpèjúwe ìdúró jíjẹun ní ìrọ̀gbọ̀kú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: yí padà
  rationale: Ó sọ ìṣe Pétérù ní ọ̀nà àdánidá, ó sì pa bí ìṣe náà ṣe ṣáájú rírí mọ́.
- source_word: βλέπει
  choice: ó sì rí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí ti ìtàn, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá mu jù.
- source_word: μαθητὴν
  choice: ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó dúró ṣinṣin fún μαθητής, ó sì ju ọ̀rọ̀ gbogbogbò bíi ‘olùtẹ̀lé’ lọ.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: tí Jesu fẹ́ràn
  rationale: Ìtumọ̀ àdánidá ni èyí fún gbólóhùn ìbátan náà, láìfi ìtumọ̀ míì kún un.
- source_word: ἀκολουθοῦντα
  choice: tí ó ń tọ̀ lẹ́yìn
  rationale: Gbólóhùn náà jẹ́ àdánidá ní Yorùbá, ó sì kò sọ ẹni tí ọmọ-ẹ̀yìn náà ń tọ̀ lẹ́yìn ní pàtó, gẹ́gẹ́ bí Gíríìkì.
- source_word: ἀνέπεσεν
  choice: rọ̀ sẹ́yìn
  rationale: Ó ṣàpèjúwe bí ẹni tí ó jókòó rọ̀ sẹ́yìn níbi oúnjẹ láti sún mọ́ àyà ẹni mìíràn.
- source_word: ἐν τῷ δείπνῳ
  choice: nígbà oúnjẹ alẹ́
  rationale: Ó fi ibi àti àkókò oúnjẹ náà hàn ní èdè Yorùbá òde òní láìsọ ọ́ di ọ̀rọ̀ ìsìn àkànṣe.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: sí àyà Jesu
  rationale: ‘Àyà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún στῆθος; dídárúkọ Jesu mú ìtọ́kasí arọ́pò-orúkọ náà ṣe kedere nínú Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ọ̀wọ̀ inú ọ̀rọ̀ ìpè náà àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Ìhìn Rere Jòhánù mọ́.
- source_word: ὁ παραδιδούς
  choice: ẹni tí ń fi ọ́ hàn
  rationale: ‘Fi ẹni hàn’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìwà ọ̀dà nínú ọ̀rọ̀ yìí, ó sì pa ìṣe tí ń lọ lọ́wọ́ inú participle náà mọ́.
theological_decisions:
- issue: Àkókò ìsinsìnyí ti ìtàn nínú βλέπει
  choice: ó sì rí
  alternative: ó sì rí i / ó sì ń rí
  rationale: Àkókò tí ó ti kọjá jẹ́ àdánidá jù nínú ìtàn Yorùbá, láìyí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
- issue: Ẹni tí ἀκολουθοῦντα tọ́ka sí
  choice: tí ó ń tọ̀ lẹ́yìn
  alternative: tí ó ń tọ̀ Jesu lẹ́yìn / tí ó ń tọ̀ wọ́n lẹ́yìn
  rationale: Gíríìkì kò sọ object náà ní gbangba. Ìtumọ̀ yìí pa àìdánilójú gidi náà mọ́ dípò yíyan Jesu tàbí Jesu àti Pétérù láìsí ọ̀rọ̀ tí ó ṣe kedere.
- issue: Ìtumọ̀ παραδιδούς nínú ọ̀rọ̀ ìjìyà Jesu
  choice: ẹni tí ń fi ọ́ hàn
  alternative: ẹni tí ń fi ọ́ lé wọn lọ́wọ́ / ẹni tí ń da ọ́
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìwà ọ̀dà, ṣùgbọ́n gbólóhùn Yorùbá náà tún ní ìmọ̀ pé a fi Jesu lé àwọn ọ̀tá lọ́wọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà yàgò fún èdè àtijọ́ tí ó le, ó sì pa àìdánilójú Gíríìkì mọ́ nípa ẹni tí ọmọ-ẹ̀yìn náà ń tọ̀ lẹ́yìn.
