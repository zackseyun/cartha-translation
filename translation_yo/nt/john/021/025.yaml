id: JHN.21.25
reference: John 21:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: yo
  text: Àwọn ohun púpọ̀ mìíràn sì tún wà tí Jésù ṣe. Bí a bá kọ ọ̀kọ̀ọ̀kan wọn sílẹ̀, mo rò pé ayé pàápàá kì bá lè ní ààyè fún àwọn ìwé tí a ó kọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ayé pàápàá kì bá lè gba àwọn ìwé tí a ó kọ.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ní ààyè fún” tàbí “gbà sínú.” Ọ̀rọ̀ náà fún “àwọn ìwé” wà ní ìrísí “tí a ń kọ,” ṣùgbọ́n nínú ipò àròsọ yìí a lè sọ ọ́ ní Yorùbá gẹ́gẹ́ bí àwọn ìwé tí a ó kọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Àwọn ohun púpọ̀ mìíràn sì tún wà
  rationale: “Sì tún” fi ìtẹ̀síwájú ọ̀rọ̀ àti èrò ohun mìíràn sí i hàn láìfi ọ̀rọ̀ àkókò kan tí kò sí nínú Gíríìkì kún un.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: tí Jésù ṣe
  rationale: “Ṣe” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì gbòòrò tó láti dúró fún àwọn iṣẹ́ àti ìṣe Jésù.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: Bí a bá kọ ọ̀kọ̀ọ̀kan wọn sílẹ̀
  rationale: Ilana “bí ... bá” mú ipò àròsọ náà jáde, “ọ̀kọ̀ọ̀kan” sì pa agbára pínpín καθ’ ἕν mọ́.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ayé pàápàá
  rationale: “Pàápàá” mú ìtẹnumọ́ αὐτόν àti “kódà ayé fúnra rẹ̀” jáde lọ́nà Yorùbá àdánidá.
- source_word: οἶμαι
  choice: mo rò pé
  rationale: Ó pa àfikún èrò ẹni tó ń sọ̀rọ̀ mọ́, láìsọ ọ́ di ìdánilójú pípé.
- source_word: χωρήσειν
  choice: kì bá tí ní ààyè fún
  rationale: Ó pa àwòrán ibi tí ó tó sí mọ́, ó sì bá ipò àròsọ ti gbólóhùn náà mu.
- source_word: τὰ γραφόμενα βιβλία
  choice: àwọn ìwé tí a ó kọ
  rationale: Èdè Yorùbá yìí sọ àbájáde ọjọ́ iwájú inú àròsọ náà ní kedere ju títú present passive participle náà ní ọ̀rọ̀-ọ̀rọ̀ lọ.
theological_decisions:
- issue: Àsọdùn nípa agbára ayé láti gba àwọn ìwé náà
  choice: A pa àwòrán pé ayé pàápàá kò ní ààyè fún wọn mọ́.
  alternative: Láti sọ ọ́ di “àwọn ìwé náà yóò pọ̀ débi àìníye.”
  rationale: Ọ̀rọ̀ Gíríìkì lo àsọdùn tí ó lágbára láti gbé ọ̀pọ̀lọpọ̀ iṣẹ́ Jésù ga; ìtumọ̀ náà kò dín àwòrán yìí kù, bẹ́ẹ̀ ni kò fipá mú un di àlàyé gangan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A ya gbólóhùn náà sí méjì fún ìṣàn Yorùbá tó dára, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
