id: JHN.21.12
reference: John 21:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Ẹ wá jẹ oúnjẹ àárọ̀.”[a] Ṣùgbọ́n kò sí ọ̀kan nínú àwọn ọmọ-ẹ̀yìn náà tí ó láyà láti bi í pé, “Ta ni ìwọ?”[b] wọ́n sì mọ̀ pé Olúwa ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ẹ wá jẹ oúnjẹ òwúrọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka pàtó sí oúnjẹ tí a ń jẹ ní òwúrọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “bi í” tún lè ní ìtumọ̀ “béèrè lọ́wọ́ rẹ̀ dáadáa” tàbí “wádìí lọ́wọ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Ẹ wá
  rationale: Ó jẹ́ ìpè tàbí àṣẹ ní ọ̀pọ̀ ènìyàn; “Ẹ wá” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìpè Jésù mu.
- source_word: ἀριστήσατε
  choice: jẹ oúnjẹ òwúrọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí jíjẹ oúnjẹ àárọ̀; ìtumọ̀ yìí pa àkókò oúnjẹ náà mọ́.
- source_word: οὐδεὶς δὲ
  choice: Ṣùgbọ́n kò sí ọ̀kan
  rationale: δέ fi ìyípadà pẹ̀lẹ́ tàbí ìtakora hàn; “Ṣùgbọ́n” bá ìṣípò láti inú ìpè sí ìdákẹ́jẹ àwọn ọmọ-ẹ̀yìn mu.
- source_word: ἐτόλμα
  choice: tí ó láyà
  rationale: Ó sọ nípa níní ìgboyà láti ṣe ohun kan; gbólóhùn “kò sí ... tí ó láyà” jẹ́ Yorùbá àdánidá.
- source_word: ἐξετάσαι
  choice: láti bi í
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí fífi ìbéèrè kan sí i, bó tilẹ̀ jẹ́ pé ó tún lè ní agbára ìtumọ̀ bí fífẹ̀sùn wádìí tàbí bíbẹ̀rẹ̀ lọ́wọ́ rẹ̀ dáadáa.
- source_word: Σὺ τίς εἶ;
  choice: Ta ni ìwọ?
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Σὺ mọ́ nípasẹ̀ “ìwọ,” ó sì jẹ́ ìbéèrè ìdánimọ̀ tí ó ṣe kedere ní Yorùbá.
- source_word: εἰδότες ὅτι
  choice: nítorí wọn mọ̀ pé
  rationale: 'A mú participle náà gẹ́gẹ́ bí ohun tó ń fi ìdí hàn nínú àyíká yìí: wọn kò béèrè nítorí pé wọn ti mọ ẹni tí ó jẹ́. Ìtumọ̀ náà jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé a lè túmọ̀ ọ́ lọ́nà tí kò fi ìdí hàn ní tààrà.'
- source_word: ὁ κύριός
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος nígbà tí a ń tọ́ka sí Jésù; ó pa ìwọ̀n Kristọ́lọ́jì ọ̀rọ̀ náà mọ́ láìfi àlàyé ẹ̀kọ́ kan kún un.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí ó ń tọ́ka sí Jésù
  choice: Olúwa
  alternative: olúwa / ọ̀gá
  rationale: Nínú ìfarahàn lẹ́yìn àjíǹde yìí, “Olúwa” jẹ́ ìdánimọ̀ ìtàn tí ó yẹ, ó sì pa ìjẹ́pàtàkì Kristọ́lọ́jì rẹ̀ mọ́ láìyanju ju ohun tí orísun sọ lọ.
- issue: Ìbáṣepọ̀ εἰδότες sí gbólóhùn tó ṣáájú
  choice: nítorí wọn mọ̀ pé
  alternative: wọ́n sì mọ̀ pé / bí wọ́n ti mọ̀ pé
  rationale: Àyíká náà lè gba participle náà gẹ́gẹ́ bí ìdí tí wọn kò fi béèrè; síbẹ̀, Gíríìkì kò ní àmì ìdí tó ṣe kedere, nítorí náà àṣàyàn tí kò fi ìdí hàn ní tààrà ṣì ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lasán. A lo “Ẹ” fún ọ̀pọ̀ ọmọ-ẹ̀yìn, “Olúwa” sì jẹ́ orúkọ oyè níbí.
