id: JHN.21.17
reference: John 21:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: yo
  text: Ó wí fún un lẹ́ẹ̀kẹta[a] pé, “Símónì, ọmọ Jòhánù, ǹjẹ́ o nífẹ̀ẹ́ mi?” Inú Pétérù bà jẹ́ nítorí pé ó béèrè lọ́wọ́ rẹ̀ lẹ́ẹ̀kẹta pé, “Ǹjẹ́ o nífẹ̀ẹ́ mi?” Ó sì dá a lóhùn pé, “Olúwa, ìwọ mọ ohun gbogbo; ìwọ mọ̀ pé mo nífẹ̀ẹ́ rẹ.”[b] Jésù wí fún un pé, “Bọ́ àwọn àgùntàn mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Níhìn-ín, Gíríìkì lo φιλέω (‘nífẹ̀ẹ́, ní ìfẹ́ni sí’), nígbà tí Jésù ti lo ἀγαπάω nínú àwọn ìbéèrè méjì tó ṣáájú. Àwọn kan rí ìyàtọ̀ tó ní ìtumọ̀ láàárín wọn; àwọn mìíràn sì gbà pé ìtumọ̀ wọn bára mu nínú àyíká yìí. A lo ‘nífẹ̀ẹ́’ láti má ṣe fi ìyàtọ̀ tó lágbára ju èyí tí Gíríìkì fi hàn lọ sí i.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ọ̀rọ̀-ìṣe méjì fún ‘mọ̀’ nínú ìdáhùn Pétérù: οἶδα àti γινώσκω. Yorùbá máa ń lo ‘mọ̀’ fún àwọn méjèèjì níhìn-ín; àtúnsọ náà lè ní ìtumọ̀ kékeré kan, ṣùgbọ́n fífi ọ̀rọ̀ ọ̀tọ̀ tú wọn lè sọ ohun tí ẹsẹ̀ náà kò fi dájú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: lẹ́ẹ̀kẹta
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ní ìgbà kẹta,’ ó sì pa àkòrí ìbéèrè tí a tún ṣe mọ́.
- source_word: Σίμων Ἰωάννου
  choice: Símónì, ọmọ Jòhánù
  rationale: Ìbáṣepọ̀ oníṣúra Ἰωάννου ń tọ́ka sí orúkọ baba; ‘ọmọ Jòhánù’ sì yàgò fún fífi àṣà ìwé mìíràn, ‘ọmọ Jónà,’ wọ inú ẹ̀rí Gíríìkì yìí.
- source_word: φιλεῖς / φιλῶ
  choice: nífẹ̀ẹ́ / nífẹ̀ẹ́
  rationale: ‘Nífẹ̀ẹ́’ mú ìfẹ́ àti ìfẹ́ni tó wà nínú φιλέω jáde ní Yorùbá àdánidá, láìfi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò dájú lé àyípadà ọ̀rọ̀ Gíríìkì náà lórí.
- source_word: ἐλυπήθη
  choice: Inú Pétérù bà jẹ́
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ìwọ̀n láti fi ìbànújẹ́ àti ìrora ọkàn Pétérù hàn.
- source_word: Κύριε
  choice: Olúwa
  rationale: Nínú ọ̀rọ̀ Pétérù sí Jésù ẹni tí ó jíǹde, ‘Olúwa’ bá agbára àti ọlá κύριε mu ju ọ̀rọ̀ ìkíni lásán lọ.
- source_word: πάντα σὺ οἶδας
  choice: ìwọ mọ ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ σὺ àti ìgbòòrò πάντα mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: οἶδας ... γινώσκεις
  choice: mọ ... mọ̀
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì ń sọ nípa mímọ̀; lílo ọ̀rọ̀ Yorùbá kan náà yàgò fún fífi ìtumọ̀ tí ó ju ẹ̀rí ọ̀rọ̀ náà lọ kún un, nígbà tí àtúnsọ náà ṣì dúró.
- source_word: Βόσκε
  choice: Bọ́
  rationale: βόσκω túmọ̀ ní pàtó sí fífún ẹran ní oúnjẹ tàbí pápá ìjẹ; ‘bọ́’ pa ìtumọ̀ pàtó yẹn mọ́, dípò ọ̀rọ̀ gbòòrò fún ṣíṣe olùṣọ́.
- source_word: πρόβατά
  choice: àwọn àgùntàn
  rationale: πρόβατα jẹ́ àgùntàn, kì í ṣe àwọn ọ̀dọ́-àgùntàn ní pàtó; èyí pa ìyàtọ̀ ọ̀rọ̀ inú àyíká ẹsẹ̀ náà mọ́.
theological_decisions:
- issue: Bóyá kí a fi ìyàtọ̀ líle hàn láàárín φιλέω àti ἀγαπάω nínú ìjíròrò Jésù àti Pétérù
  choice: A lo ‘nífẹ̀ẹ́’ fún φιλέω láìfi irú ìfẹ́ mìíràn hàn nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè lo ọ̀rọ̀ méjì bí ‘nífẹ̀ẹ́’ àti ‘ní ìfẹ́ni sí,’ kí a sì ka àyípadà náà sí ohun tó ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó.
  rationale: Ìyàtọ̀ ìtumọ̀ àwọn ọ̀rọ̀ náà nínú Gíríìkì Koiné kò dúró ṣinṣin tó láti fi tipátipá hàn ní Yorùbá. Àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ìtumọ̀ náà mọ́ láìyanjú aáwọ̀ ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
- issue: Agbára ọ̀rọ̀ Pétérù pé ‘ìwọ mọ ohun gbogbo’
  choice: A túmọ̀ ọ́ tààrà gẹ́gẹ́ bí ìjẹ́wọ́ tó lágbára nípa ìmọ̀ Jésù nínú ìjíròrò náà.
  alternative: A lè dín in kù sí ‘ìwọ mọ gbogbo ohun nípa èyí,’ tàbí kí a fi àlàyé ẹ̀kọ́ nípa mímọ ohun gbogbo kún ọ̀rọ̀ náà.
  rationale: Gíríìkì sọ ‘ohun gbogbo’ ní kedere. Ìtumọ̀ náà gbọ́dọ̀ pa agbára ọ̀rọ̀ mọ́ láìdín in kù tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn ọ̀nà bí ‘Inú Pétérù bà jẹ́,’ ‘dá a lóhùn,’ àti ‘Bọ́ àwọn àgùntàn mi’ jẹ́ àdánidá fún òǹkàwé Yorùbá lónìí, láìsọ ọ̀rọ̀ náà di èdè àtijọ́ tàbí èdè ẹ̀ya ìjọ kan.
