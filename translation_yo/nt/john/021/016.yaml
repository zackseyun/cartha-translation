id: JHN.21.16
reference: John 21:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: yo
  text: Ó tún sọ fún un lẹ́ẹ̀kejì pé, “Símónì ọmọ Jòhánù, ṣé o nífẹ̀ẹ́ mi?”[a] Ó dá a lóhùn pé, “Bẹ́ẹ̀ ni, Olúwa; ìwọ mọ̀ pé mo nífẹ̀ẹ́ rẹ.” Ó sọ fún un pé, “Máa ṣe olùṣọ́ àwọn àgùntàn mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nínú Gíríìkì, Jésù àti Pétérù lo ọ̀rọ̀-ìṣe méjì ọ̀tọ̀ fún “nífẹ̀ẹ́”: Jésù lo agapaō, Pétérù sì lo phileō. Àwọn kan rí ìyàtọ̀ nínú wọn; àwọn mìíràn sì kà á sí ìyípadà ọ̀nà ìsọ̀rọ̀. A tú méjèèjì sí “nífẹ̀ẹ́” nínú ọ̀rọ̀ pàtàkì, kí a má bàa fi ìyàtọ̀ tí kò dájú kún un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: Ó tún sọ fún un lẹ́ẹ̀kejì
  rationale: “Tún” àti “lẹ́ẹ̀kejì” pa ìtumọ̀ àtúnṣe àti iye ìgbà méjì tí Gíríìkì tẹnumọ́ mọ́, bí ó tilẹ̀ jẹ́ pé wọ́n dà bí àfikún ara wọn ní Yorùbá.
- source_word: Σίμων Ἰωάννου
  choice: Símónì ọmọ Jòhánù
  rationale: Ìsọ̀rí oníjẹnatífù náà jẹ́ ọ̀nà ìdánimọ̀ ọmọ nípasẹ̀ orúkọ baba rẹ̀; “ọmọ Jòhánù” bá ẹ̀rí Gíríìkì yìí mu.
- source_word: ἀγαπᾷς / φιλῶ
  choice: nífẹ̀ẹ́
  rationale: A lo “nífẹ̀ẹ́” fún ọ̀rọ̀-ìṣe méjèèjì nínú ẹsẹ̀, nítorí pé ìyàtọ̀ tó lágbára láàárín wọn kò dájú nínú lílo Jòhánù; àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀ ni.
- source_word: Ναί, κύριε
  choice: Bẹ́ẹ̀ ni, Olúwa
  rationale: “Bẹ́ẹ̀ ni” jẹ́ ìdáhùn ìfọwọ́sí àdánidá, “Olúwa” sì fi ọ̀wọ̀ àti ìdánimọ̀ Pétérù sí Jésù hàn.
- source_word: σὺ οἶδας
  choice: ìwọ mọ̀
  rationale: Fífi “ìwọ” hàn pa ìtẹnumọ́ arọ́pò-orúkọ tó wà ní Gíríìkì mọ́ lọ́nà àdánidá.
- source_word: Ποίμαινε τὰ πρόβατά μου
  choice: Máa ṣe olùṣọ́ àgùntàn mi
  rationale: Ìtumọ̀ yìí pa àwòrán iṣẹ́ olùṣọ́-àgùntàn mọ́, tó ní ìtọ́jú, ìdarí àti bíbójútó àwọn àgùntàn Jésù nínú.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ Yorùbá méjì ọ̀tọ̀ túmọ̀ ἀγαπάω àti φιλέω
  choice: A túmọ̀ méjèèjì sí “nífẹ̀ẹ́” nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìyàtọ̀ ọ̀rọ̀ Gíríìkì nínú àlàyé ìsàlẹ̀.
  alternative: A lè tú φιλέω sí “fẹ́ràn” tàbí “ní ìfẹ́ ọ̀rẹ́ sí,” kí a sì tú ἀγαπάω sí “nífẹ̀ẹ́.”
  rationale: Àwọn ọ̀rọ̀-ìṣe náà lè ní ìtẹnumọ́ tó yàtọ̀, ṣùgbọ́n wọ́n tún lè jẹ́ ìyípadà ọ̀nà ìsọ̀rọ̀ nínú Jòhánù. Fífi ìyàtọ̀ tó muna sínú ọ̀rọ̀ pàtàkì lè yanju ohun tí ẹsẹ̀ náà fi sílẹ̀ ní àìdájú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. “Máa ṣe olùṣọ́ àgùntàn mi” pa àkàwé pastoral mọ́ láì dín un kù sí fífún wọn ní oúnjẹ nìkan.
