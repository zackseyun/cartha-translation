  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọmọ-ẹ̀yìn yòókù wá nínú ọkọ̀ ojú omi kékeré náà, nítorí wọn kò jìnnà sí ilẹ̀[c], bí kò ṣe ní ìjìnnà nǹkan bí igba ìgbọ̀nwọ́ sí i[a]; wọ́n sì ń fa àwọ̀n tí àwọn ẹja wà nínú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìwọ̀n igba ìgbọ̀nwọ́ fẹ́rẹ̀ẹ́ tó mítà àádọ́rùn-ún (ẹsẹ̀ ọ̀ọ́dúnrún).
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “àwọ̀n ẹja.” Gbólóhùn Gíríìkì náà lè gba ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ rẹ̀ gan-an, ṣùgbọ́n ó ṣeé ṣe kó túmọ̀ sí àwọ̀n tí àwọn ẹja wà nínú rẹ̀ níbí.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé “etíkun” dípò “ilẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Ṣùgbọ́n àwọn ọmọ-ẹ̀yìn yòókù
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ iṣẹ́ wọn sí ti Peteru nínú ẹsẹ tó ṣáájú hàn, nígbà tí “àwọn ọmọ-ẹ̀yìn yòókù” túmọ̀ ἄλλοι μαθηταί ní tààrà.
- source_word: τῷ πλοιαρίῳ
  choice: nínú ọkọ̀ ojú omi kékeré náà
  rationale: Ọ̀rọ̀ πλοιάριον ní ìtumọ̀ ọkọ̀ ojú omi kékeré; “nínú” sì bá lílo ọ̀nà ọkọ̀ yìí mu ní Yorùbá àdánidá.
- source_word: ἦλθον
  choice: wá
  rationale: Ó sọ ìṣe tó ṣẹlẹ̀ nínú ìtàn ní ọ̀nà tó rọrùn, ó sì bá ojú-ìwòye ibi tí Jesu wà mu.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: nítorí wọn kò jìnnà sí ilẹ̀
  rationale: γάρ jẹ́ àlàyé ìdí, γῆ sì túmọ̀ sí ilẹ̀ ní ìyàtọ̀ sí omi; “etíkun” jẹ́ àṣàyàn tó bá àyíká mu.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: bí kò ṣe ìwọ̀n igba ìgbọ̀nwọ́ péré
  rationale: ὡς fi hàn pé ìwọ̀n náà kò pé gẹ́lẹ́. “Ìgbọ̀nwọ́” pa ìwọ̀n àṣà ìgbàanì πῆχυς mọ́, ìtumọ̀ òde òní sì wà nínú àlàyé ìsàlẹ̀.
- source_word: σύροντες
  choice: wọ́n sì ń fa
  rationale: Ìṣe aláìparí yìí ń lọ lẹ́gbẹ̀ẹ́ bí wọ́n ṣe ń bọ̀, “ń fa” sì sọ ìsapá tí fífa àwọ̀n náà béèrè ní Yorùbá àdánidá.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: àwọ̀n tí àwọn ẹja wà nínú rẹ̀
  rationale: A lóye genitive τῶν ἰχθύων gẹ́gẹ́ bí ohun tí àwọ̀n náà ní nínú rẹ̀. Ìtumọ̀ yìí ṣe kedere láì fi ọ̀rọ̀ “kún” kún Gíríìkì; àlàyé ìsàlẹ̀ pa ìtumọ̀ gẹ́gẹ́ bí “àwọ̀n ẹja” mọ́.
