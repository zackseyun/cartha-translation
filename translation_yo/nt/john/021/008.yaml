translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, pẹ̀lú èdè ìtàn tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A pa ìwọ̀n àṣà orísun mọ́ nínú ẹsẹ, a sì ṣàlàyé rẹ̀ ní ìsàlẹ̀.
