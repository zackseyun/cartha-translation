  to: Ṣùgbọ́n àwọn ọmọ-ẹ̀yìn yòókù wá nínú ọkọ̀ ojú omi kékeré náà, nítorí wọn kò jìnnà sí ilẹ̀[c], bí kò ṣe ní ìjìnnà nǹkan bí igba ìgbọ̀nwọ́ sí i[a]; wọ́n sì ń fa àwọ̀n tí àwọn ẹja wà nínú rẹ̀[b].
