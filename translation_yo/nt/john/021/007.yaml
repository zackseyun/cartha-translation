  to: Nítorí náà, ọmọ-ẹ̀yìn náà tí Jésù fẹ́ràn sọ fún Pétérù pé, “Olúwa ni.” Nígbà tí Símónì Pétérù gbọ́ pé Olúwa ni, ó di aṣọ àwọ̀lékè rẹ̀ mọ́ ara rẹ̀ (nítorí aṣọ rẹ̀ kò pé)[a], ó sì ju ara rẹ̀ sínú òkun.
