id: JHN.21.7
reference: John 21:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: yo
  text: Nítorí náà, ọmọ-ẹ̀yìn náà tí Jésù fẹ́ràn sọ fún Pétérù pé, “Olúwa ni.” Nígbà tí Símónì Pétérù gbọ́ pé Olúwa ni, ó di aṣọ àwọ̀lékè rẹ̀ mọ́ ara rẹ̀ (nítorí aṣọ rẹ̀ kò pé)[a], ó sì ju ara rẹ̀ sínú òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ó wà ní ìhòòhò.” Ọ̀rọ̀ Gíríìkì γυμνός lè túmọ̀ sí ẹni tí kò wọ aṣọ rárá tàbí ẹni tí aṣọ rẹ̀ kò pé, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Nítorí náà, ... sọ
  rationale: οὖν ń so ìdánimọ̀ ọmọ-ẹ̀yìn náà mọ́ ohun tó tẹ̀ lé e; “Nítorí náà” pa agbára àsopọ̀ náà mọ́ ní Yorùbá.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ọmọ-ẹ̀yìn náà tí Jesu fẹ́ràn
  rationale: “náà” dúró fún ἐκεῖνος, gbólóhùn yòókù sì pa àpèjúwe pàtàkì ti Johanu mọ́.
- source_word: Ὁ κύριός ἐστιν
  choice: Olúwa ni
  rationale: Ìṣètò “X ni” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni tí a dá mọ̀ hàn; “Olúwa” pa ìtumọ̀ κύριος àti ìwọ̀n Kristoloji rẹ̀ mọ́.
- source_word: ἀκούσας
  choice: Nígbà tí ... gbọ́
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó ṣe kedere, láì pàdánù ìtẹ̀lé ìṣẹ̀lẹ̀.
- source_word: τὸν ἐπενδύτην
  choice: aṣọ àwọ̀lékè rẹ̀
  rationale: ἐπενδύτης jẹ́ aṣọ tí a wọ̀ lókè aṣọ mìíràn; yíyan yìí kò fi irú aṣọ pàtó tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: διεζώσατο
  choice: ó di ... mọ́ ara rẹ̀
  rationale: Ó pa ìṣe dídì tàbí fífi aṣọ náà múlẹ̀ yí ara ẹni ká mọ́, dípò ìtumọ̀ fífẹ̀ bí “ó wọ̀.”
- source_word: ἦν γὰρ γυμνός
  choice: nítorí aṣọ díẹ̀ ni ó wọ̀
  rationale: γυμνός lè túmọ̀ sí ẹni tí kò wọ aṣọ rárá tàbí ẹni tí aṣọ rẹ̀ kò pé. Àyíká iṣẹ́ inú ọkọ̀ ojú omi àti aṣọ àwọ̀lékè tó wà níbẹ̀ mú kí ìtumọ̀ aṣọ díẹ̀ bá ọ̀rọ̀ mu, ṣùgbọ́n akọsilẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: ó ju ara rẹ̀ sínú òkun
  rationale: Ó pa agbára àti àwòrán βάλλω pẹ̀lú arọ́pò-orúkọ ara ẹni mọ́ ju “ó fò” lọ; θάλασσα ni a túmọ̀ sí “òkun.”
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí a dá Jesu mọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ àkọ́lé náà àti ìwọ̀n Kristoloji rẹ̀ mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
- issue: Ipò aṣọ Peteru nínú γυμνός
  choice: aṣọ díẹ̀ ni ó wọ̀
  alternative: kò wọ aṣọ rárá / ó wà ní ìhòòhò
  rationale: Ọ̀rọ̀ Gíríìkì gba ìtumọ̀ méjèèjì. Ọ̀rọ̀ inú ẹsẹ náà dára pọ̀ mọ́ ẹni tí kò wọ aṣọ tó pé, ṣùgbọ́n a pa ìtumọ̀ gidi ti ìhòòhò mọ́ nínú akọsilẹ̀.
translation_notes:
  register: 'Yorùbá boṣewa, èdè ọlọ́lá tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ; a sì lo àwọn orúkọ Bíbélì tó wọ́pọ̀: Jesu, Peteru, àti Simoni.'
