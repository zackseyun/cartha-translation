  source_fidelity: Ìtumọ̀ náà gba ìtẹ̀lé ọ̀rọ̀ Giriki, ìdánimọ̀ Jesu gẹ́gẹ́ bí Olúwa, ìṣe Peteru láti di aṣọ àwọ̀lékè rẹ̀ mọ́ ara rẹ̀, àti ìṣe rẹ̀ láti ju ara rẹ̀ sínú òkun. Ìtumọ̀ ‘aṣọ díẹ̀ ni ó wọ̀’ pa ìṣiyèméjì γυμνός mọ́, a sì tọ́ka sí ìtumọ̀ ‘ní ìhòòhò’ nínú àlàyé ìsàlẹ̀.
