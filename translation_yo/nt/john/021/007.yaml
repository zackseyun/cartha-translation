  terminology: ‘Olúwa’ bá κύριος mu dáadáa nínú àyíká ìdánimọ̀ Jesu yìí. ‘Aṣọ àwọ̀lékè’ jẹ́ ìtumọ̀ tó ṣọ́ra fún ἐπενδύτης, láì sọ irú aṣọ pàtó. ‘Òkun’ bá θάλασσα mu.
