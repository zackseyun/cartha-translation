id: JHN.21.3
reference: John 21:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: yo
  text: Símónì Pétérù sọ fún wọn pé,[a] “Mo ń lọ pẹja.” Wọ́n sọ fún un pé, “Àwa náà ń bá ọ lọ.” Wọ́n jáde, wọ́n sì wọ inú ọkọ̀ ojú omi náà; ní òru náà, wọn kò mú ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì lo àsìkò ìsinsìnyí ìtàn (“Símónì Pétérù sọ fún wọn … wọ́n sọ fún un”), èyí tí ó wọ́pọ̀ nínú ìtàn; a sábà máa ń túmọ̀ rẹ̀ pẹ̀lú àsìkò àtẹ̀yìnwá ní Yorùbá.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ fún wọn pé
  rationale: A lo àsìkò àtẹ̀yìnwá tí ó bá ìtàn Yorùbá mu, bí ó tilẹ̀ jẹ́ pé àsìkò ìsinsìnyí ìtàn ni Gíríìkì lò.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Mo ń lọ pẹja
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ète Peteru láti lọ mú ẹja, láìtún ọ̀rọ̀ ìlọ náà sọ ju bí orísun ṣe sọ lọ.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Àwa náà ń bá ọ lọ
  rationale: “Àwa náà” pa ìtẹnumọ́ καὶ ἡμεῖς mọ́, “ń bá ọ lọ” sì fi ìbákẹ́gbẹ́ σύν hàn ní Yorùbá àdánidá.
- source_word: ἐξῆλθον
  choice: Wọ́n jáde
  rationale: Ó pa ìtumọ̀ ìṣípò ti ọ̀rọ̀ Gíríìkì mọ́ láìfikún ibi tí wọ́n ti jáde.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: wọ́n sì wọ inú ọkọ̀ ojú omi náà
  rationale: “Wọ inú” túmọ̀ ìwọ ọkọ̀ ní kedere; “ọkọ̀ ojú omi” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún πλοῖον, àrokò náà sì ń tọ́ka sí ọkọ̀ kan pàtó.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: ní òru ọjọ́ náà
  rationale: Èyí jẹ́ gbólóhùn àdánidá ní Yorùbá fún àkókò òru tí a ń sọ̀rọ̀ rẹ̀.
- source_word: ἐπίασαν οὐδέν
  choice: wọn kò mú nǹkan kan
  rationale: Nínú ọ̀rọ̀ ìpẹja, “mú” túmọ̀ píázō gẹ́gẹ́ bí mímú ẹja; “kò mú nǹkan kan” pa àìsí àṣeyọrí pátápátá mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Pẹja” jẹ́ ọ̀rọ̀ àdánidá fún lílọ mú ẹja, “ọkọ̀ ojú omi” sì yà ọkọ̀ náà sọ́tọ̀ kúrò ní ọkọ̀ ilẹ̀.
