revisions:
- from: Símónì Peteru sọ fún wọn pé,[a] “Mo ń lọ pẹja.” Wọ́n sọ fún un pé, “Àwa náà ń bá ọ lọ.” Wọ́n jáde, wọ́n sì wọ inú ọkọ̀ ojú omi náà; ní òru ọjọ́ náà, wọn kò mú nǹkan kan.
  to: Símónì Pétérù sọ fún wọn pé,[a] “Mo ń lọ pẹja.” Wọ́n sọ fún un pé, “Àwa náà ń bá ọ lọ.” Wọ́n jáde, wọ́n sì wọ inú ọkọ̀ ojú omi náà; ní òru náà, wọn kò mú ohunkóhun.
  rationale: Àtúnṣe náà ṣètò ìkọ̀wé orúkọ sí ìlò Yorùbá tí ó wọ́pọ̀, yọ ‘ọjọ́’ tí orísun kò sọ kúrò nínú gbólóhùn àkókò, ó sì lo ‘ohunkóhun’ gẹ́gẹ́ bí àìfẹ́sẹ̀mulẹ̀ pátápátá fún ohun tí wọ́n kò mú. Kò sí ìyípadà sí ìtumọ̀, ìforígbárí, tàbí ìtòlẹ́sẹẹsẹ ìtàn orísun náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:35Z'
