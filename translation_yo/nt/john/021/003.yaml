  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ Gíríìkì dáadáa: ìsinsìnyí ìtàn ni a ti sọ di àsìkò àtẹ̀yìnwá, ìtẹnumọ́ ‘àwa náà’ wà, ìbákẹ́gbẹ́ ‘pẹ̀lú rẹ’ sì wà. Síbẹ̀, ‘ní òru ọjọ́ náà’ túmọ̀ sí òru ọjọ́ pàtó kan ní ọ̀nà tí ó ṣàfikún ‘ọjọ́’; ἐν ἐκείνῃ τῇ νυκτί jẹ́ ‘ní òru náà/ní òru ìgbà náà’ nìkan.'
