  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: yo
  text: Nígbà tí Peteru sì rí i, ó sọ fún Jesu pé, “Olúwa, ẹni yìí ńkọ́?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: nígbà tí Peteru sì rí i
  rationale: Ó mú ìtumọ̀ participle aorist náà jáde gẹ́gẹ́ bí ìṣe tó ṣáájú ọ̀rọ̀ Peteru, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: λέγει
  choice: ó sọ
  rationale: Present tense ìtàn Gíríìkì ni; Yorùbá sábà máa ń lo àkókò ìtàn láìfi àmì progressive kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún ọ̀rọ̀ ìbọ̀wọ̀ κύριε nígbà tí a ń bá Jesu sọ̀rọ̀.
- source_word: οὗτος δὲ τί;
  choice: ọkùnrin yìí ńkọ́?
  rationale: Ìbéèrè Gíríìkì jẹ́ kúkúrú, ó sì fi ohun tí ó ṣẹlẹ̀ sí ọkùnrin náà sílẹ̀ fún àyíká ọ̀rọ̀; “ńkọ́?” pa ìkúkúrú àti àìsọ ohun gbogbo yẹn mọ́ ní Yorùbá.
theological_decisions:
- issue: Àìpé gírámà nínú ìbéèrè οὗτος δὲ τί;
  choice: “ọkùnrin yìí ńkọ́?”
  alternative: “kí ni yóò sì ṣẹlẹ̀ sí ọkùnrin yìí?”
  rationale: A kò fi ohun tí Gíríìkì kò sọ ní tààràtà kún un; a pa àìní ìpinnu pàtó àti ìfarahàn ìbéèrè náà mọ́.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo “Peteru” àti “Jesu” gẹ́gẹ́ bí àwọn orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá; “ńkọ́?” jẹ́ ọ̀nà àdánidá láti sọ “what about ...?”
