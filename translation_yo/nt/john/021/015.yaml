id: JHN.21.15
reference: John 21:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: yo
  text: Nítorí náà, nígbà tí wọ́n jẹ oúnjẹ àárọ̀ tán, Jésù sọ fún Símónì Pétérù pé, “Símónì, ọmọ Jòhánù, ṣé ìwọ nífẹ̀ẹ́ mi ju àwọn wọ̀nyí lọ?[a][b]” Ó dá a lóhùn pé, “Bẹ́ẹ̀ ni, Olúwa; ìwọ mọ̀ pé mo nífẹ̀ẹ́ rẹ.” Jésù sọ fún un pé, “Máa bọ́ àwọn ọ̀dọ́-àgùntàn mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì méjì ọ̀tọ̀ ni a lò níbí: Jésù béèrè pẹ̀lú ἀγαπάω (‘nífẹ̀ẹ́’), Pétérù sì dáhùn pẹ̀lú φιλέω (‘nífẹ̀ẹ́, ní ìfẹ́ ọ̀rẹ́ sí’). Àwọn kan rí ìyàtọ̀ nínú wọn; àwọn mìíràn gbà pé ìyípadà ọ̀nà ìkọ̀wé lásán ni. Ọ̀rọ̀ pàtàkì tú àwọn méjèèjì sí ‘nífẹ̀ẹ́’ kí ó má bàa tẹnumọ́ ìyàtọ̀ tí àyíká ọ̀rọ̀ kò sọ ní kedere.'
    reason: lexical_alternative
  - marker: b
    text: ‘Ju àwọn wọ̀nyí lọ’ lè túmọ̀ sí ‘ju bí àwọn ọkùnrin wọ̀nyí ṣe nífẹ̀ẹ́ mi lọ’ tàbí ‘ju bí o ṣe nífẹ̀ẹ́ àwọn nǹkan wọ̀nyí lọ.’ Gíríìkì fi ohun tí a ń fi wé sílẹ̀ láì sọ ó ní kedere.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: wọ́n jẹ oúnjẹ àárọ̀ tán
  rationale: Ọ̀rọ̀-ìṣe náà tọ́ka sí jíjẹ oúnjẹ òwúrọ̀; gbólóhùn yìí tún fi hàn pé wọ́n ti jẹ ẹ́ parí kí ìjíròrò náà tó bẹ̀rẹ̀.
- source_word: Σίμων Ἰωάννου
  choice: Símónì ọmọ Jòhánù
  rationale: Ìbátan oníbi tí ọ̀rọ̀ Gíríìkì fi hàn ni a túmọ̀ ní tààrà gẹ́gẹ́ bí ‘ọmọ Jòhánù,’ láì fi orúkọ Jònà tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἀγαπᾷς / φιλῶ
  choice: nífẹ̀ẹ́ / nífẹ̀ẹ́
  rationale: ‘Nífẹ̀ẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti ti ẹ̀dá láti sọ ìfẹ́ ẹni sí ẹlòmíràn. Lílo ọ̀rọ̀ kan náà ní àkọ́kọ́ kò fi ìyàtọ̀ tó lè má jẹ́ ohun tí onkọ̀wé ń tẹnumọ́ wọ inú ẹsẹ náà; àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀ ni wọ́n lò.
- source_word: πλέον τούτων
  choice: ju àwọn wọ̀nyí lọ
  rationale: Gbólóhùn náà dá ohun tí a fi wé sílẹ̀ láì sọ ó jáde; ìtumọ̀ yìí pa àìdánilójú gidi náà mọ́.
- source_word: κύριε
  choice: Olúwa
  rationale: Nínú àyíká ìwé Jòhánù, Pétérù ń bá Jésù sọ̀rọ̀ pẹ̀lú ọ̀wọ̀ gẹ́gẹ́ bí Olúwa, kì í ṣe bí ìkíni ọ̀wọ̀ lásán.
- source_word: οἶδας
  choice: ìwọ mọ̀
  rationale: 'Èyí jẹ́ ìtumọ̀ tààrà, tó sì pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́: Pétérù fi ohun tí Jésù fúnra rẹ̀ mọ̀ ṣe ẹ̀rí.'
- source_word: Βόσκε
  choice: Máa bọ́
  rationale: βόσκω túmọ̀ sí fífún ẹran ní oúnjẹ, kì í ṣe gbogbo iṣẹ́ olùṣọ́-àgùntàn lápapọ̀. ‘Máa’ mú àṣẹ iṣẹ́ tí yóò máa bá a lọ jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τὰ ἀρνία μου
  choice: àwọn ọ̀dọ́-àgùntàn mi
  rationale: ‘Ọ̀dọ́-àgùntàn’ sọ ìtumọ̀ ẹran àgùntàn kékeré ní kedere, ‘mi’ sì pa ìní àti ìtọ́jú Jésù lórí agbo náà mọ́.
theological_decisions:
- issue: Bóyá kí a fi ìyàtọ̀ líle sí ἀγαπάω àti φιλέω nínú ọ̀rọ̀ pàtàkì
  choice: A túmọ̀ àwọn méjèèjì sí ‘nífẹ̀ẹ́,’ a sì ṣàlàyé ìyípadà ọ̀rọ̀ Gíríìkì ní àlàyé ìsàlẹ̀.
  alternative: Kí a túmọ̀ ἀγαπάω sí ‘nífẹ̀ẹ́’ àti φιλέω sí ‘ní ìfẹ́ ọ̀rẹ́ sí’ tàbí gbólóhùn mìíràn tó fi ìpele ìfẹ́ hàn.
  rationale: Àwọn ọ̀rọ̀-ìṣe Gíríìkì méjì ọ̀tọ̀ wà, ṣùgbọ́n ọ̀rọ̀ inú ẹsẹ náà kò fi hàn ní kedere pé ìpele ìfẹ́ méjì ni a gbọ́dọ̀ rí. Yíyan ọ̀rọ̀ Yorùbá méjì tó yà gidigidi lè gbé ẹ̀kọ́ tí a ń ṣe àríyànjiyàn lé ẹsẹ náà lórí.
- issue: Ohun tí πλέον τούτων, ‘ju àwọn wọ̀nyí lọ,’ ń fi wé
  choice: A pa àìdánilójú náà mọ́ pẹ̀lú ‘ju àwọn wọ̀nyí lọ.’
  alternative: ‘Ju bí àwọn ọkùnrin wọ̀nyí ṣe nífẹ̀ẹ́ mi lọ’ tàbí ‘ju bí o ṣe nífẹ̀ẹ́ àwọn nǹkan wọ̀nyí lọ.’
  rationale: Gíríìkì kò sọ ní kedere bóyá a ń fi ìfẹ́ Pétérù wé ti àwọn ọmọ-ẹ̀yìn yòókù tàbí ìfẹ́ rẹ̀ sí àwọn ènìyàn tàbí ohun tó wà níbẹ̀. Ìtumọ̀ kò yẹ kí ó yan ọ̀kan níbi tí orísun kò ti yan.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn níbi tó yẹ, ni a lò. Èdè náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. ‘Máa bọ́’ jẹ́ àṣẹ àdánidá fún ojúṣe tó ń bá a lọ, ‘àwọn ọ̀dọ́-àgùntàn mi’ sì pa àwòrán iṣẹ́ olùṣọ́-àgùntàn mọ́.
