    rationale: Ní Yorùbá boṣewa tí a kọ́ pẹ̀lú àmì ohùn, ‘Jésù’ àti ‘Tìbéríà’ ni ìkọ̀wé tí ó bá ìlò Bíbélì Yorùbá àti ìpè Yorùbá mu dáadáa.
  - severity: low
    issue: Ọ̀rọ̀ ìsàlẹ̀ lọwọlọwọ náà sọ ‘mímú kí a rí ẹni,’ èyí tí kò fi ìtumọ̀ arọ́pò-orúkọ ara-ẹni nínú ἐφανέρωσεν ἑαυτὸν hàn ní kedere.
    rationale: ‘Fífi ara ẹni hàn’ tàbí ‘mímú kí a mọ ẹni’ ṣàlàyé yíyan ọ̀rọ̀ náà ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì àti ìtumọ̀ Gẹ̀ẹ́sì.
