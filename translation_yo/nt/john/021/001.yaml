id: JHN.21.1
reference: John 21:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: yo
  text: Lẹ́yìn àwọn nǹkan wọ̀nyí, Jésù tún fi ara rẹ̀ hàn[a] fún àwọn ọmọ-ẹ̀yìn lẹ́bàá Òkun Tìbéríà; báyìí ni ó sì ṣe fi ara rẹ̀ hàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “farahàn”; ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi ara ẹni hàn tàbí mímú kí a mọ ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ìyípadà àkókò tí ó bá ọ̀nà ìtàn Jòhánù mu.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: fi ara rẹ̀ hàn
  rationale: Ọ̀rọ̀ yìí sọ pé Jesu fúnra rẹ̀ mú kí àwọn ọmọ-ẹ̀yìn rí i, kí wọ́n sì mọ̀ ọ́n; ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ olùṣe mọ́ láì dín ìṣẹ̀lẹ̀ náà kù sí wíwá sí ojú wọn lásán.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé èyí jẹ́ ìfarahàn mìíràn lẹ́yìn àwọn ìfarahàn àjíǹde tó ti ṣẹlẹ̀ ṣáájú.
- source_word: τοῖς μαθηταῖς
  choice: fún àwọn ọmọ-ẹ̀yìn
  rationale: A kò fi ọ̀rọ̀ ohun-ìní “rẹ̀” kún un, nítorí kò sí ní gbangba nínú Gíríìkì.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: lẹ́bàá Òkun Tiberia
  rationale: “Lẹ́bàá” sọ ibi tí ìṣẹ̀lẹ̀ náà ti wáyé ní èdè Yorùbá àdánidá, ó sì pa orúkọ ibi náà mọ́.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: báyìí ni ó sì ṣe fi ara rẹ̀ hàn
  rationale: A tún ọ̀rọ̀-ìṣe náà sọ gẹ́gẹ́ bí Gíríìkì, “báyìí” sì ṣí ọ̀nà fún àlàyé bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ tí a lò fún ìfarahàn Jesu lẹ́yìn àjíǹde
  choice: fi ara rẹ̀ hàn
  alternative: farahàn; jẹ́ kí wọ́n mọ òun
  rationale: “Fi ara rẹ̀ hàn” pa ìtumọ̀ ìfihàn ara ẹni mọ́, ó sì ṣì jẹ́rìí sí ìpàdé gidi pẹ̀lú Jesu tó jíǹde láì sọ ohun tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
