review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: ó pa ìtẹ̀lé àkókò ‘Lẹ́yìn àwọn nǹkan wọ̀nyí,’ ìtumọ̀ ìpadà ‘tún,’ ìfarahàn ara-ẹni, ipò lẹ́bàá òkun náà, àti ìtẹnumọ́ ‘báyìí’ mọ́. Kò fi ohun-ìní ‘rẹ̀’ kún ‘àwọn ọmọ-ẹ̀yìn,’ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe rí.'
  naturalness: ‘Fi ara rẹ̀ hàn’ jẹ́ ọ̀nà Yorùbá tí ó hàn gbangba, tí ó sì bá àkọsílẹ̀ ìtàn mu. Gbólóhùn kejì náà, ‘Báyìí ni ó sì ṣe fi ara rẹ̀ hàn,’ jẹ́ àdánidá, ó sì ń tọ́ka sí àlàyé tó ń bọ̀.
  terminology: 'A yẹ kí àwọn orúkọ náà gba àmì ohùn Yorùbá níbi tí wọ́n ti wọ́pọ̀: ‘Jésù’ àti ‘Tìbéríà.’ Àlàyé ìsàlẹ̀ náà yẹ kí ó ṣàlàyé ìtumọ̀ ọ̀rọ̀-ìṣe náà ní ọ̀nà tí ó péye síi, ní pàtàkì nítorí pé kókó rẹ̀ ni fífi ara ẹni hàn tàbí mímú kí a mọ ẹni.'
  issues:
