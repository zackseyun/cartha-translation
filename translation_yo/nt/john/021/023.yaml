id: JHN.21.23
reference: John 21:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: yo
  text: Nítorí náà, ọ̀rọ̀ yìí[a] tàn ká láàárín àwọn ará[b] pé ọmọ-ẹ̀yìn náà kì yóò kú. Ṣùgbọ́n Jésù kò sọ fún un pé ọmọ-ẹ̀yìn náà kì yóò kú; kàkà bẹ́ẹ̀, ó ní, “Bí mo bá fẹ́ kí ó dúró títí tí mo fi dé, kí ni ìyẹn kàn ọ́?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àsọjáde yìí” tàbí “ìròyìn yìí.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí ọ̀rọ̀, àsọjáde, tàbí ìròyìn.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ará” níbí ń tọ́ka sí àwùjọ àwọn ọmọ-ẹ̀yìn; ọ̀rọ̀ Gíríìkì ἀδελφοί wà ní ọ̀pọ̀ akọ.
    reason: cultural_note
  - marker: c
    text: Ìyẹn ni pé, Jésù kò ṣèlérí pé ọmọ-ẹ̀yìn yìí kò ní kú láéláé; ó sọ gbólóhùn onípò pé, “Bí mo bá fẹ́ kí ó dúró títí tí mo fi dé ...”
    reason: cross_reference
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: tàn ká
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ nípa ìròyìn tàbí àsọjáde tí ó tàn dé ọ̀dọ̀ àwọn ènìyàn; “tàn ká” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: οὗτος ὁ λόγος
  choice: ọ̀rọ̀ yìí
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí a sọ tàbí ìròyìn tí ń tàn; ó pa ìtúmọ̀ λόγος mọ́ láì fi dandan pè é ní ìròyìn èké.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: láàárín àwọn ará
  rationale: Àkópọ̀ ọ̀rọ̀-ìṣe àti atókùn níbí ń tọ́ka sí bí ọ̀rọ̀ ṣe tàn nínú àwùjọ àwọn ọmọ-ẹ̀yìn.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: ọmọ-ẹ̀yìn náà
  rationale: “Náà” pa ìtọ́kasí pàtó ti ἐκεῖνος mọ́, ó sì tẹ̀ lé ọ̀nà ìsọ̀rọ̀ Jòhánù.
- source_word: οὐκ ἀποθνῄσκει
  choice: kì yóò kú
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àsìkò ìsinsìnyí, inú àsọjáde ọ̀rọ̀ tí ó ti tàn ni Yorùbá àdánidá ti fi ọjọ́ iwájú hàn.
- source_word: οὐκ εἶπεν δὲ
  choice: Ṣùgbọ́n Jésù kò sọ
  rationale: “Ṣùgbọ́n” fi ìtakora àti àtúnṣe òye tí kò tọ́ hàn ní kedere.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Bí mo bá fẹ́ kí ó dúró
  rationale: “Bí ... bá” pa ipò àídájú mọ́; “fẹ́” sọ ìfẹ́-inú, “dúró” sì mú ìtumọ̀ pé kí ó máa bá a lọ láti wà títí di àsìkò kan.
- source_word: ἕως ἔρχομαι
  choice: títí tí mo fi dé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó sún mọ́ “títí mo fi dé,” láì fi ìtumọ̀ àlàyé bí “padà wá” kún un.
- source_word: τί πρὸς σέ
  choice: kí ni ìyẹn kàn ọ́?
  rationale: 'Àpólà Yorùbá yìí sọ ìbéèrè tààrà náà ní àdánidá: ọ̀ràn ọmọ-ẹ̀yìn kejì kì í ṣe ohun tí ó yẹ kí Pétérù dá sí.'
theological_decisions:
- issue: Irú ọ̀rọ̀ tí ó tàn nípa ọmọ-ẹ̀yìn náà
  choice: Lo “ọ̀rọ̀ yìí” kí ẹsẹ̀ náà lè fi ohun tí ó tàn hàn láì sọ pé Jésù ṣe ìlérí pé ọmọ-ẹ̀yìn náà kì yóò kú.
  alternative: “ìròyìn yìí” tàbí “àsọjáde yìí”
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ń ṣàtúnṣe òye tí kò tọ́. “Ọ̀rọ̀” pa ààyè ìtumọ̀ λόγος mọ́, nígbà tí gbólóhùn kejì sọ ní kedere pé Jésù kò ṣe ìlérí bẹ́ẹ̀.
- issue: Ìwà àídájú ọ̀rọ̀ Jésù
  choice: Pa “Bí mo bá fẹ́ ...” mọ́ gẹ́gẹ́ bí gbólóhùn onípò.
  alternative: Túmọ̀ ọ́ bí ìlérí pé ọmọ-ẹ̀yìn náà yóò wà láàyè títí Jésù yóò fi dé.
  rationale: Ἐὰν fi ipò àídájú hàn; ẹsẹ̀ náà kò jẹ́rìí pé ipò náà yóò ṣẹ, ó sì ń tako ìrò tí ó tàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé lóye. A yan “ọ̀rọ̀ yìí tàn ká” àti “kí ni ìyẹn kàn ọ́?” gẹ́gẹ́ bí àwọn àpólà Yorùbá àdánidá, nígbà tí a pa ìtakora àti àídájú inú Gíríìkì mọ́.
