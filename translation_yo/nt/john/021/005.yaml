  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: yo
  text: Nígbà náà, Jésù sọ fún wọn pé, “Ẹ̀yin ọmọ, ẹ̀yin kò ní ẹja kankan, àbí?” Wọ́n dá a lóhùn pé, “Rárá.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun kan fún jíjẹ.” Ọ̀rọ̀ Gíríìkì προσφάγιον lè tọ́ka ní pàtàkì sí oúnjẹ tí a ń jẹ pẹ̀lú búrẹ́dì; nínú àyíká ìpẹja yìí, ó ṣeé ṣe kí ó tọ́ka sí ẹja.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè Jésù pọ̀ mọ́ ìtẹ̀síwájú ìtàn; ọ̀rọ̀ náà jẹ́ ti Yorùbá àdánidá, ó sì lè túmọ̀ sí ‘nígbà náà’ nínú àyíká yìí.
- source_word: Παιδία
  choice: Ẹ̀yin ọmọ
  rationale: Ó pa ìtumọ̀ tààrà àti ohùn ìfaramọ́ ti ọ̀rọ̀ ìpè náà mọ́, láì sọ ọjọ́-orí wọn di ohun pàtó.
- source_word: μή τι
  choice: ẹ̀yin kò ní ... kankan, àbí?
  rationale: Ìbéèrè Gíríìkì náà ń retí ìdáhùn òdì; ìlànà ‘kò ... àbí?’ fi èyí hàn lọ́nà Yorùbá àdánidá.
- source_word: προσφάγιον
  choice: ẹja
  rationale: Ọ̀rọ̀ náà tọ́ka sí oúnjẹ tí a máa ń jẹ pẹ̀lú búrẹ́dì; nínú àyíká pípa ẹja yìí, ó ṣeé ṣe jù pé ẹja ni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro rẹ̀ mọ́.
- source_word: ἔχετε
  choice: ní
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ́ pé ohun kan wà lọ́wọ́ ẹni.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Wọ́n dá a lóhùn
  rationale: Ìlò Yorùbá tó wọ́pọ̀, tó sì ní iyì fún gbólóhùn ìdáhùn inú ìtàn.
- source_word: Οὔ
  choice: Rárá
  rationale: Ìdáhùn òdì kúkúrú tó bá Gíríìkì mu.
