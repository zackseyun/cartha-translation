base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: yo
  text: Jésù wá, ó mú búrẹ́dì náà, ó sì fi fún wọn; ó sì ṣe bẹ́ẹ̀ náà pẹ̀lú ẹja náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gangan: “àti ẹja náà bẹ́ẹ̀ náà.” Ìyẹn túmọ̀ sí pé ó ṣe sí ẹja náà gẹ́gẹ́ bí ó ti ṣe sí búrẹ́dì náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: wá
  rationale: Ọ̀rọ̀-ìṣe yìí jẹ́ present historical nínú Gíríìkì. Èdè Yorùbá kì í fi àkókò hàn lórí ọ̀rọ̀-ìṣe ní ọ̀nà kan náà; “wá” jẹ́ àrọ́pò àdánidá tí kò fi dandan pinnu bóyá a ó pè é ní present tàbí past.
- source_word: λαμβάνει
  choice: mú
  rationale: “Mú” sọ ìgbésẹ̀ tí Jésù ṣe sí búrẹ́dì náà ní ṣókí, láì fi ìtumọ̀ àfikún bí “pèsè” tàbí “ṣe ìránṣẹ́” kún un.
- source_word: τὸν ἄρτον
  choice: búrẹ́dì náà
  rationale: “Búrẹ́dì” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere; “náà” dúró fún article náà, ó sì tọ́ka sí búrẹ́dì pàtó tí ó wà níbẹ̀.
- source_word: δίδωσιν αὐτοῖς
  choice: fi fún wọn
  rationale: Ìṣètò “fi [ohun] fún wọn” jẹ́ Yorùbá àdánidá. Ohun tí a fi fún wọn—búrẹ́dì náà—ti hàn gbangba láti inú gbólóhùn náà.
- source_word: τὸ ὀψάριον
  choice: ẹja náà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹja gẹ́gẹ́ bí oúnjẹ. A kò fi “tí a sè” kún un nítorí Gíríìkì kò sọ ìyẹn ní pàtó.
- source_word: ὁμοίως
  choice: ṣe bákan náà sí
  rationale: 'Gbólóhùn yìí mú kí ìṣe tí a kò tún sọ ní Gíríìkì ṣe kedere ní Yorùbá: Jésù mú ẹja náà, ó sì fi fún wọn gẹ́gẹ́ bí ó ti ṣe sí búrẹ́dì.'
theological_decisions:
- issue: Àwọn ọ̀rọ̀-ìṣe present historical nínú ìtàn ìfarahàn lẹ́yìn àjíǹde
  choice: 'Lo ọ̀rọ̀-ìṣe Yorùbá aláìní àmì-àkókò: “wá ... mú ... fi fún”'
  alternative: Fi àmì ìgbà tí ó ti kọjá hàn kedere, bí “Ó dé, ó mú ... ó sì fi ... fún wọn”
  rationale: Èdè Yorùbá kò ní ìyàtọ̀ present/past lórí fọ́ọ̀mù ọ̀rọ̀-ìṣe bí Gíríìkì. Fífi ọ̀rọ̀-ìṣe Yorùbá rọrùn sílẹ̀ ń pa ìrìn ìtàn mọ́, kò sì yanjú àkókò náà ju ohun tí èdè Yorùbá béèrè lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A yan “búrẹ́dì” àti “ẹja” fún òye àwọn òǹkàwé gbogbo; a tún ìṣe tí Gíríìkì fi sílẹ̀ láìsọ hàn ní ọ̀nà àdánidá, ṣùgbọ́n àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìṣókí àti ìtòlẹ́sẹẹsẹ Gíríìkì mọ́.
