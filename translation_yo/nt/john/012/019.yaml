  to: Nítorí náà, àwọn Farisí sọ fún ara wọn pé, “Ẹ rí i pé ẹ kò ṣe àṣeyọrí ohunkóhun. Wò ó—ayé ti tẹ̀ lé e[a].”
  rationale: 'Àtúnṣe náà ní ìwọ̀n kékeré: ó rọ́pò ọ̀nà tí kò wọ́pọ̀ ‘tọ̀ ọ́ lẹ́yìn’ pẹ̀lú ‘tẹ̀ lé e,’ tí ó jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá fún lílọ tẹ̀ lé ẹnì kan. Ó tún yọ ìtẹnumọ́ tí kò wúlò nínú ‘Ẹ̀yin rí i.’ Ìtumọ̀, àsọdùn κόσμος, àti ìjìnlẹ̀ ìtumọ̀ ẹsẹ̀ kò yí padà.'
