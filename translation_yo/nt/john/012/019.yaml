id: JHN.12.19
reference: John 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: yo
  text: Nítorí náà, àwọn Farisí sọ fún ara wọn pé, “Ẹ rí i pé ẹ kò ṣe àṣeyọrí ohunkóhun. Wò ó—ayé ti tẹ̀ lé e[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ènìyàn ti tẹ̀ lé e.” Gíríìkì ní “ayé”; ó ṣeé ṣe kó jẹ́ àsọdùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ̀ náà mọ́ ohun tó ṣáájú.
- source_word: πρὸς ἑαυτούς
  choice: sọ fún ara wọn
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí pé àwọn Farisí ń bá ara wọn sọ̀rọ̀ gẹ́gẹ́ bí ẹgbẹ́ kan.
- source_word: Θεωρεῖτε
  choice: Ẹ̀yin rí i
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣèlúpọ̀ ẹni kejì ní ìṣesí ìròyìn; ó ń fi ìbànújẹ́ wọn hàn pé ohun tí wọ́n ń sọ ti ṣe kedere sí wọn.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: ẹ kò ṣe àṣeyọrí ohunkóhun
  rationale: Èyí mú ìtumọ̀ àìní èso àti asán ìsapá wọn jáde ní Yorùbá òde òní, láìdì mọ́ ìtumọ̀ gidi ti gbólóhùn Gíríìkì.
- source_word: ἴδε
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: κόσμος
  choice: ayé
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ dípò yíyí i sí ‘gbogbo ènìyàn’; nínú ẹsẹ̀ yìí, ó jẹ́ àsọdùn tí àwọn Farisí fi ìbànújẹ́ sọ.
- source_word: ὀπίσω αὐτοῦ
  choice: tọ̀ ọ́ lẹ́yìn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún lílọ tẹ̀ lé ẹnì kan, ó sì pa àwòrán ‘lẹ́yìn rẹ̀’ mọ́.
- source_word: ἀπῆλθεν
  choice: ti tọ̀
  rationale: Àmì ‘ti’ fi àbájáde tí àwọn Farisí rí ní àkókò ọ̀rọ̀ wọn hàn, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ aorist.
theological_decisions:
- issue: Ìwọ̀n κόσμος nínú ọ̀rọ̀ àwọn Farisí
  choice: Pa ‘ayé’ mọ́ gẹ́gẹ́ bí àsọdùn.
  alternative: ‘gbogbo ènìyàn’ tàbí ‘gbogbo ogunlọ́gọ̀ náà’
  rationale: Àwọn Farisí ń sọ̀rọ̀ àsọdùn nítorí ìbànújẹ́. ‘Ayé’ pa ọ̀rọ̀ Gíríìkì àti ìró pàtàkì rẹ̀ nínú ìwé Jòhánù mọ́, láìsọ ọ́ di ẹ̀kọ́ pé gbogbo ènìyàn ló di ọmọ-ẹ̀yìn Jésù.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. Àmì ìdádúró gígùn lẹ́yìn ‘Wò ó’ ń pa ìyára àti agbára ọ̀rọ̀ ìbànújẹ́ náà mọ́.
