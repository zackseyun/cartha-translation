  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́ dáadáa: οὖν jẹ́ ìyípadà àbájáde; πρὸς ἑαυτούς jẹ́ ọ̀rọ̀ láàárín ara wọn; àti κόσμος wà gẹ́gẹ́ bí àsọdùn, kì í ṣe ìkéde pé gbogbo ènìyàn di ọmọ-ẹ̀yìn Jésù. Àmì ìsinsìnyí ti ‘ti’ tún lè sọ àbájáde tí ó hàn nígbà náà. Síbẹ̀, ‘tọ̀ ọ́ lẹ́yìn’ kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ fún ὀπίσω αὐτοῦ ἀπῆλθεν nínú àyíká yìí.'
  naturalness: ‘Tẹ̀ lé e’ ni ọ̀nà Yorùbá àpapọ̀ tó mọ́gbọ́n dání láti sọ ‘has gone after him/followed him.’ ‘Ẹ rí i’ sì dára ju ‘Ẹ̀yin rí i’ lọ nínú ọ̀rọ̀ tí àwọn ẹgbẹ́ kan ń bá ara wọn sọ, nítorí pé kò fi ìtẹnumọ́ ẹni kejì tí kò sí nínú Gíríìkì kún un.
  terminology: ‘Àwọn Farisí’ yẹ, ‘ayé’ pa κόσμος mọ́, àti ‘àsọdùn’ nínú àlàyé ìsàlẹ̀ jẹ́ ọ̀rọ̀ tó yẹ. A kò nílò láti ṣàlàyé ìtumọ̀ ẹ̀kọ́ kan nínú ẹsẹ̀ tàbí àlàyé ìsàlẹ̀.
  issues:
