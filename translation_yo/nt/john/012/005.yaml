translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘òróró olóòórùn dídùn’ dípò ọ̀rọ̀ àjèjì fún perfume, a sì pa ‘dẹ́nárí’ mọ́ gẹ́gẹ́ bí owó ìtàn náà.
