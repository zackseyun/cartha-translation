  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: yo
  text: “Èé ṣe tí a kò fi ta òróró olóòórùn yìí ní ọ̀ọ́dúnrún dẹ́nárí, kí a sì fi owó náà fún àwọn òtòṣì?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dẹ́nárí kan jẹ́ ìwọ̀n owó-iṣẹ́ ọjọ́ kan fún òṣìṣẹ́; ọ̀ọ́dúnrún dẹ́nárí fẹ́rẹ̀ẹ́ tó owó-iṣẹ́ ọdún kan, bí a bá yọ àwọn ọjọ́ tí a kì í ṣiṣẹ́ kúrò.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Èé ṣe tí
  rationale: Ọ̀nà ìbéèrè Yorùbá tó ṣe déédéé, tó sì mú ìtumọ̀ ‘nítorí kí ni?’ jáde ní ṣókí.
- source_word: μύρον
  choice: òróró olóòórùn dídùn
  rationale: Ó tọ́ka sí òróró tàbí ohun ìkunra olówó iyebíye tó ní òórùn dídùn; ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní, ó sì bá iṣẹ́ ìtasórí mu.
- source_word: οὐκ ἐπράθη
  choice: a kò fi ta
  rationale: Ó pa ìṣe àìṣe tó wà nínú ìbéèrè ẹ̀sùn náà mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ̀rọ̀ ìṣe aláìṣe ní Yorùbá.
- source_word: τριακοσίων δηναρίων
  choice: ní ọ̀ọ́dúnrún owó dẹ́nárí
  rationale: Genitive náà sọ iye tí a ó fi tà á. A pa orúkọ owó ìgbà náà mọ́, dípò yíyí i padà sí owó òde òní; àlàyé iye rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: καὶ ἐδόθη
  choice: kí a sì fi owó náà fún
  rationale: Nínú Yorùbá, fífi ohun tí a rí nínú títà fún ẹlòmíràn ni ọ̀nà tó ṣe kedere jù; ‘owó náà’ mú ohun tí a fẹ́ pín hàn láìyí ìtumọ̀ padà.
- source_word: πτωχοῖς
  choice: àwọn òtòṣì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn ènìyàn tí wọ́n jẹ́ aláìní nípa ọrọ̀ ajé.
