id: JHN.12.17
reference: John 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: yo
  text: Nítorí náà, ogunlọ́gọ̀ tí ó wà pẹ̀lú rẹ̀ nígbà tí ó pe Lásárù jáde láti inú ibojì, tí ó sì jí i dìde kúrò nínú òkú, ń jẹ́rìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń fúnni ní ẹ̀rí”; ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí jíjẹ́rìí tàbí fífi ẹ̀rí hàn, ó sì jẹ́ kókó ọ̀rọ̀ tí ó máa ń tún farahàn nínú ìwé Jòhánù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: ń jẹ́rìí sí i
  rationale: Àkókò imperfect fi hàn pé iṣẹ́ jíjẹ́rìí náà ń lọ lọ́wọ́ tàbí pé wọ́n ń ṣe é léraléra. ‘Jẹ́rìí sí i’ tún pa kókó ọ̀rọ̀ μαρτυρέω mọ́ gẹ́gẹ́ bí ó ti máa ń hàn nínú Jòhánù.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú, ó sì fi ìbáṣepọ̀ ìtàn tàbí àbájáde hàn.
- source_word: ὁ ὄχλος
  choice: ogunlọ́gọ̀ àwọn ènìyàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì bá ὄχλος mu.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: tí ó wà pẹ̀lú rẹ̀
  rationale: Gbólóhùn alápejuwe náà dá ogunlọ́gọ̀ pàtó yìí mọ̀ gẹ́gẹ́ bí àwọn tí ó wà níbẹ̀ pẹ̀lú Jésù nígbà iṣẹ̀lẹ̀ náà.
- source_word: ὅτε
  choice: nígbà tí
  rationale: Ó ṣàfihàn àkókò iṣẹ̀lẹ̀ tí àwọn ènìyàn náà rí.
- source_word: ἐφώνησεν
  choice: ó pe
  rationale: ‘Pe’ túmọ̀ ìṣe tí Jésù ṣe sí Lásárù ní tààràtà láìfi ìtẹnumọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐκ τοῦ μνημείου
  choice: jáde láti inú ibojì
  rationale: ‘Ibojì’ jẹ́ ibi ìsìnkú; ‘jáde láti inú’ mú ìṣípò láti inú ibojì hàn ní kedere.
- source_word: ἤγειρεν
  choice: jí i dìde
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde, ‘jí ... dìde’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ἐγείρω.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí pa ìtumọ̀ ἐκ νεκρῶν mọ́ pé a jí Lásárù dìde kúrò láàárín àwọn tí ó ti kú, ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe tú gbólóhùn nípa jíjí Lásárù dìde
  choice: jí i dìde kúrò láàárín àwọn òkú
  alternative: mú un padà wá láti inú ikú
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààràtà pé Jésù jí Lásárù dìde kúrò láàárín àwọn òkú. Ìtumọ̀ yìí pa ìjẹ́wọ́ iṣẹ́ ìyanu náà mọ́ láìrọ̀ ọ́ tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ń jẹ́rìí’ láti fi ìṣe tí ń lọ lọ́wọ́ hàn.
