source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: yo
  text: Àwọn Gíríìkì kan sì wà lára àwọn tí wọ́n ń gòkè lọ láti jọ́sìn ní àjọ̀dún náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn Gíríìkì díẹ̀”; ó ṣeé ṣe kí wọ́n jẹ́ àwọn tí kì í ṣe Júù tí wọ́n gòkè wá láti jọ́sìn ní àjọ̀dún náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: sì wà
  rationale: Ἦσαν ní ìtumọ̀ pé àwọn kan wà, δέ sì jẹ́ àsopọ̀ ọ̀rọ̀ fẹ́lẹ́fẹ́lẹ́; “sì wà” jẹ́ ọ̀nà àdánidá láti fi méjèèjì hàn ní Yorùbá láì fi ọ̀rọ̀ àsìkò kún un.
- source_word: Ἕλληνές τινες
  choice: Àwọn Gíríìkì kan
  rationale: Ἕλληνες túmọ̀ sí àwọn Gíríìkì ní ti ẹ̀yà tàbí àṣà, τινες sì fi hàn pé iye wọn kò ṣe pàtó. A kò sọ ọ́ di “àwọn Kèfèrí,” kí ìtumọ̀ ọrọ̀ náà má bàa fẹ̀ sí i ju orísun lọ.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: lára àwọn tí wọ́n ń gòkè lọ
  rationale: ἐκ fi hàn pé àwọn Gíríìkì náà wà lára ẹgbẹ́ àwọn arìnrìn-àjò náà; “ń gòkè lọ” tún pa èdè ìrìn-àjò mímọ́ sí Jerúsálẹ́mù mọ́ láì ṣe àlàyé àfikún.
- source_word: ἵνα προσκυνήσωσιν
  choice: láti jọ́sìn
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń sọ ète; “láti jọ́sìn” jẹ́ Yorùbá àdánidá tí ó sì mú ìtumọ̀ ìjọ́sìn ẹ̀sìn ti προσκυνέω jáde.
- source_word: ἐν τῇ ἑορτῇ
  choice: ní àjọ̀dún náà
  rationale: ἑορτή tọ́ka sí àjọ̀dún ẹ̀sìn Júù tí ọ̀rọ̀ inú Jòhánù ń sọ; “ní àjọ̀dún náà” jẹ́ kedere, ó sì yẹ fún Yorùbá òde òní.
theological_decisions:
- issue: Ta ni Ἕλληνες ń tọ́ka sí?
  choice: A pa á mọ́ gẹ́gẹ́ bí “àwọn Gíríìkì.”
  alternative: Àwọn Kèfèrí
  rationale: Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ ni Ἕλληνες, ìtumọ̀ rẹ̀ tí ó ṣe tààrà jù ni “àwọn Gíríìkì.” Ẹsẹ̀ náà kò sọ bóyá wọ́n jẹ́ Júù tó ń sọ èdè Gíríìkì, àwọn tó yí padà sí ẹ̀sìn Júù, tàbí àwọn aláìní-Júù tó bẹ̀rù Ọlọ́run; nítorí náà, ìtumọ̀ yìí kò pinnu ohun tí orísun kò pinnu.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “ń gòkè lọ” pa àwòrán ìrìn-àjò sí Jerúsálẹ́mù mọ́, ṣùgbọ́n a kò fi Jerúsálẹ́mù kún ọ̀rọ̀ nítorí kò sí ní ẹsẹ̀ orísun.
