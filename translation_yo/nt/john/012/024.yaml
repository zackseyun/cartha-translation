id: JHN.12.24
reference: John 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo sọ fún yín, bí ẹyọ àlìkámà kan kò bá ṣubú sínú ilẹ̀ tí ó sì kú, ó máa wà ní òun nìkan[a]; ṣùgbọ́n bí ó bá kú[b], ó máa so èso púpọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó máa dá wà.”
    reason: lexical_alternative
  - marker: b
    text: Àwòrán yìí ń tọ́ka sí ẹyọ irúgbìn tí ó gbọdọ̀ kú nínú ilẹ̀ kí ó tó lè so èso. Nínú àyíká ọ̀rọ̀, Jésù lo àpẹẹrẹ yìí fún ikú ara rẹ̀ àti fún àwọn tí ń tẹ̀ lé e.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: λέγω ὑμῖν
  choice: ni mo sọ fún yín
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ tí Jésù ń sọ tààrà sí ọ̀pọ̀ ènìyàn mọ́, ó sì bá ìlò Yorùbá mu.
- source_word: ἐὰν μὴ
  choice: bí ... kò bá
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi sọ ipò tí ó túmọ̀ sí ‘àfi bí’ tàbí ‘bí kò bá ṣe pé.’
- source_word: ὁ κόκκος τοῦ σίτου
  choice: ẹyọ àlìkámà kan
  rationale: ‘Ẹyọ’ fi hàn pé irúgbìn ọ̀kọ̀ọ̀kan ni κόκκος ń tọ́ka sí; ‘àlìkámà’ sì jẹ́ orúkọ àdánidá fún wheat ní Yorùbá.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: bọ́ sínú ilẹ̀
  rationale: Ó pa ìṣísẹ̀ irúgbìn tí ó bọ́ sínú ilẹ̀ mọ́, láì sọ ọ́ di pé ó kàn bọ́ sórí ilẹ̀.
- source_word: ἀποθάνῃ
  choice: kú
  rationale: A pa àwòrán ikú irúgbìn mọ́ ní tààrà, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ti ṣe.
- source_word: αὐτὸς μόνος μένει
  choice: ó máa dá wà
  rationale: Ó fi hàn pé ẹyọ náà ṣì wà ní òun nìkan, láì fi èrò ìmọ̀lára ìdánìkanwà kún àwòrán náà.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: ṣùgbọ́n bí ó bá kú
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tí δέ dá sílẹ̀ hàn kedere.
- source_word: πολὺν καρπὸν φέρει
  choice: ó máa so èso púpọ̀
  rationale: ‘So èso’ jẹ́ gbólóhùn àdánidá ní Yorùbá, ó sì pa àkàwé èso inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Àwòrán iṣẹ́ àgbẹ̀ tí ó ní ìtumọ̀ nípa Kristi àti ọmọ-ẹ̀yìn rẹ̀ nínú àyíká ọ̀rọ̀
  choice: A fi àwòrán irúgbìn, ikú, àti síso èso sílẹ̀ gẹ́gẹ́ bí ó ti rí nínú ẹsẹ náà.
  alternative: Kí a fi kún un ní tààrà pé Jésù ń sọ nípa ikú ara rẹ̀ àti àbájáde rẹ̀.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ń tọ́ka sí ikú ara rẹ̀, ó sì tún kan àwọn tí ń tẹ̀ lé e; ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ gbé àwòrán náà kalẹ̀ láì túmọ̀ rẹ̀ ní kíkún. Nítorí náà, a kò fi ẹ̀kọ́ ìtumọ̀ tí kò fara hàn gbangba sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹyọ àlìkámà’ dípò ọ̀rọ̀ imọ̀ iṣẹ́ àgbẹ̀ tí ó lè ṣòro fún òǹkàwé gbogbogbò.
