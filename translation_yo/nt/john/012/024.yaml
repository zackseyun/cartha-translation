review_pass:
  verdict: revise
  source_fidelity: The conditional structure, repeated solemn affirmation, agricultural image, contrast, and result are retained. However, “bọ́ sínú ilẹ̀” normally means ‘go/come down into the ground’ and does not adequately convey πεσών (‘having fallen’). “Ṣubú sínú ilẹ̀” directly preserves the image and sequence. The revised wording also renders αὐτὸς μόνος μένει more precisely as remaining alone/by itself.
  naturalness: The revision is idiomatic Standard Yorùbá for public reading, retains natural conditional phrasing, and uses full tone marks.
  terminology: “Ẹyọ àlìkámà,” “ilẹ̀,” “kú,” and “so èso púpọ̀” are suitable and preserve the metaphor without importing its interpretation into the main text.
  issues:
  - severity: medium
    issue: “bọ́ sínú ilẹ̀” is not an exact rendering of πεσών.
    rationale: The Greek explicitly depicts the grain as falling into the ground. “Ṣubú sínú ilẹ̀” conveys this action, whereas “bọ́” can merely indicate descending or entering.
  - severity: low
    issue: “ó máa dá wà” is somewhat less precise for αὐτὸς μόνος μένει.
    rationale: It can be understood as ‘be alone,’ but “ó máa wà ní òun nìkan” more directly expresses that the grain remains by itself/alone.
  revised_text: “Lóòótọ́, lóòótọ́ ni mo sọ fún yín, bí ẹyọ àlìkámà kan kò bá ṣubú sínú ilẹ̀ tí ó sì kú, ó máa wà ní òun nìkan[a]; ṣùgbọ́n bí ó bá kú[b], ó máa so èso púpọ̀.”
