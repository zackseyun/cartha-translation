  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: yo
  text: Fílípì wá, ó sì sọ fún Áńdérù[a]; Áńdérù àti Fílípì wá, wọ́n sì sọ fún Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èdè Gíríìkì lo àkókò ìsinsìnyí nínú gbogbo ẹsẹ yìí (“wá … sọ … wá … sọ”), èyí tí ó jẹ́ ọ̀nà ìsọ̀rọ̀ ìtàn tí ó wọ́pọ̀, tí ó sì ń mú kí ìṣẹ̀lẹ̀ dà bí ohun tó ń ṣẹlẹ̀ lójú ẹni. Ọ̀pọ̀ ìtumọ̀ sábà máa ń yí irú ọ̀rọ̀ bẹ́ẹ̀ sí àkókò tí ó ti kọjá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: wá
  rationale: A lo ọ̀rọ̀ ìṣe àkókò ìsinsìnyí “wá” láti pa ìtàn alárinrin tí Jòhánù ń sọ ní àkókò ìsinsìnyí mọ́; ó tún fi ìlọsí ẹni tí a mẹ́nu kàn lẹ́yìn náà hàn.
- source_word: λέγει
  choice: sọ fún
  rationale: “Sọ fún” jẹ́ ọ̀nà Yorùbá àdánidá fún jíjíṣẹ́ tàbí sísọ ohun kan fún ẹnì kan, ó sì bá dative τῷ Ἀνδρέᾳ mu.
- source_word: Ἀνδρέᾳ
  choice: Áńdérù
  rationale: A kọ orúkọ ẹni náà ní ìró Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: λέγουσιν
  choice: wọ́n sì sọ fún
  rationale: A fi arọ́pò-orúkọ púpọ̀ “wọ́n” hàn kedere nítorí èdè Yorùbá, a sì pa ìtumọ̀ ìbánisọ̀rọ̀ náà mọ́.
- source_word: τῷ Ἰησοῦ
  choice: Jésù
  rationale: “Sọ fún Jésù” ṣe àfihàn dative Gíríìkì ní ọ̀nà Yorùbá tó bójú mu; a kọ orúkọ náà ní ìrísí Yorùbá tí ó wọ́pọ̀.
- source_word: καί
  choice: sì / àti
  rationale: “Àti” so àwọn orúkọ pọ̀, “sì” sì so àwọn ìṣe tàbí gbólóhùn pọ̀ ní Yorùbá àdánidá, láìfi ìtumọ̀ àkókò tàbí ìdí tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ Φίλιππος
  choice: Fílípì
  rationale: A kọ orúkọ ẹni náà ní ìrísí Yorùbá tí ó wọ́pọ̀; a kò túmọ̀ article Gíríìkì nítorí kò ní àmì pàtàkì níbí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó ṣe kedere ni a lò. A pa historical present mọ́, bí ó tilẹ̀ jẹ́ pé “wá” kò fi ìyàtọ̀ àkókò hàn láìsí àyíká; àlàyé ìsàlẹ̀ ni ó mú èyí ṣe kedere. Àwọn àmì ohùn ni a fi sí ibi tí ó bá ẹ̀dá ọ̀rọ̀ mu.
