language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: yo
  text: Èmi sì, nígbà tí a bá gbé mi sókè[a][b] kúrò ní ilẹ̀, èmi yóò fa gbogbo ènìyàn[c] sọ́dọ̀ ara mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “bí a bá gbé mi sókè.” Gíríìkì lo ìrísí gbólóhùn onípò, ṣùgbọ́n nínú àyíká ọ̀rọ̀, ó ń tọ́ka sí ikú Jésù tó ń bọ̀ gẹ́gẹ́ bí ohun tí yóò ṣẹlẹ̀ dájúdájú.
    reason: alternative_reading
  - marker: b
    text: '“Gbé ... sókè” tún lè ní ìtumọ̀ “gbé ... ga” tàbí “yìn ... lógo.” Èyí pa ìtumọ̀ méjì tí Jòhánù lò mọ́: kíkàn Jésù mọ́ àgbélébùú àti gbígbé e ga nínú ògo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààràtà: “gbogbo.” Ó ṣeé ṣe jù pé Gíríìkì ń tọ́ka sí gbogbo ènìyàn, láì sọ ní pàtó bí ọ̀rọ̀ yìí ṣe kan àwọn àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tó wáyé lẹ́yìn náà nípa ìwọ̀n ìgbàlà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Èmi sì
  rationale: Àkójọpọ̀ καί àti ἐγώ so ọ̀rọ̀ yìí mọ́ èyí tó ṣáájú, ó sì tẹnumọ́ ẹni tó ń sọ̀rọ̀. “Èmi sì” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìsopọ̀ àti ìtẹnumọ́ náà mọ́.
- source_word: ἐὰν
  choice: nígbà tí ... bá
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐὰν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive lè túmọ̀ sí “bí,” àyíká ọ̀rọ̀ fi ikú Jésù hàn gẹ́gẹ́ bí ohun tó ń bọ̀ tí yóò sì ṣẹlẹ̀ dájúdájú. “Nígbà tí ... bá” bá èyí mu, ó sì tún pa ìrísí tí kò tíì ṣẹlẹ̀ mọ́.
- source_word: ὑψωθῶ
  choice: a bá gbé mi sókè
  rationale: “Gbé ... sókè” lè tọ́ka sí gbígbé Jésù sókè lórí àgbélébùú, ó sì tún lè ní ìtumọ̀ yíyìn ín lógo tàbí gbígbé e ga. Ó pa ìtumọ̀ méjèèjì tí Jòhánù mọ̀ọ́mọ̀ lò mọ́.
- source_word: ἐκ τῆς γῆς
  choice: kúrò lórí ilẹ̀
  rationale: Nínú àyíká yìí, γῆ tọ́ka sí ilẹ̀ tí a gbé Jésù kúrò lórí rẹ̀ nígbà kíkàn án mọ́ àgbélébùú. Gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: πάντας
  choice: gbogbo ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ accusative plural akọ tí a lè lò fún àwọn ènìyàn lápapọ̀. “Gbogbo ènìyàn” sọ ohun tí ọ̀rọ̀ náà ń tọ́ka sí di mímọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí ẹsẹ̀ náà kò sọ kún un.
- source_word: ἑλκύσω
  choice: yóò fa
  rationale: “Fa” pa ìtumọ̀ ìfa tàbí mímú ẹnì kan wá sí ọ̀dọ̀ ẹni mọ́, láì pinnu ní pàtó bí agbára ìfa náà ṣe ń ṣiṣẹ́.
- source_word: πρὸς ἐμαυτόν
  choice: sọ́dọ̀ ara mi
  rationale: “Ara mi” pa ìtẹnumọ́ arọ́pò-orúkọ reflexive ἐμαυτόν mọ́, “sọ́dọ̀” sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìṣípò sí ọ̀dọ̀ ẹni.
theological_decisions:
- issue: Ìwọ̀n àwọn tí πάντας ń tọ́ka sí nínú ọ̀rọ̀ nípa ìgbàlà
  choice: gbogbo ènìyàn
  alternative: gbogbo; gbogbo onírúurú ènìyàn; olúkúlùkù ènìyàn láìyọ ẹnikẹ́ni sílẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ènìyàn, kì í ṣe gbogbo ohun aláìlẹ́mìí. Ìtumọ̀ náà pa fífẹ̀ gbólóhùn Jésù mọ́, ṣùgbọ́n kò pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tó wáyé lẹ́yìn náà nípa bóyá ó túmọ̀ sí olúkúlùkù ènìyàn tàbí gbogbo ẹ̀ka ènìyàn.
- issue: Ìtumọ̀ méjì ti ὑψωθῶ nínú Jòhánù
  choice: gbé mi sókè
  alternative: gbé mi ga; yìn mí lógo
  rationale: “Gbé mi sókè” lè ṣe àpèjúwe kíkàn Jésù mọ́ àgbélébùú, ó sì tún lè sọ nípa gbígbé e ga àti ògo rẹ̀. Yíyan “yìn mí lógo” nìkan yóò mú kí ìtumọ̀ ti ara tó wà nínú ọ̀rọ̀ náà sọnù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, àdánidá, tó sì ṣeé lóye fún òǹkàwé òde òní. Àtúnsọ “Èmi” nínú “Èmi sì ... èmi yóò” jẹ́ ìtẹnumọ́ tó bójú mu ní Yorùbá, ó sì bá κἀγὼ mu.
