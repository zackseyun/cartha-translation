id: JHN.12.46
reference: John 12:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: yo
  text: Èmi ti wá sínú ayé gẹ́gẹ́ bí ìmọ́lẹ̀,[a] kí gbogbo ẹni tí ó bá gbà mí gbọ́ má bàa dúró nínú òkùnkùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘bí ìmọ́lẹ̀ kan.’ Ọ̀rọ̀ Gíríìkì kò ní árítíkù níbí, ó sì lè ṣàpèjúwe Jésù gẹ́gẹ́ bí ìmọ́lẹ̀ tàbí pè é ní ìmọ́lẹ̀ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Ọ̀rọ̀ náà kò ní árítíkù nínú Gíríìkì, ó sì ń ṣàpèjúwe ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀. ‘Gẹ́gẹ́ bí ìmọ́lẹ̀’ pa àwòrán ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: εἰς τὸν κόσμον
  choice: sínú ayé
  rationale: εἰς pẹ̀lú ọ̀rọ̀ accusative fi ìlọ sí inú àgbègbè kan hàn; ‘sínú ayé’ dá ìtumọ̀ wíwá Jésù sínú ayé padà lọ́nà àdánidá.
- source_word: ἐλήλυθα
  choice: ti wá
  rationale: Perfect tense náà tẹnumọ́ ìṣe wíwá tí àbájáde rẹ̀ ṣì wà; àkójọpọ̀ ‘ti wá’ ni Yorùbá fi ń sọ èyí lọ́nà àdánidá.
- source_word: ἵνα
  choice: kí ... má bàa
  rationale: Ó ń tọ́ka sí ète, pàápàá pẹ̀lú μή; ìṣètò Yorùbá ‘kí ... má bàa’ mú ète òdì náà jáde kedere.
- source_word: πᾶς ὁ πιστεύων
  choice: gbogbo ẹni tí ó bá ... gbọ́
  rationale: Ó tọ́ka sí gbogbo ẹni tó wà nínú ẹgbẹ́ àwọn olùgbàgbọ́. Ìṣètò ‘gbogbo ẹni tí ó bá’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò náà mọ́.
- source_word: πιστεύων εἰς ἐμέ
  choice: gbà mí gbọ́
  rationale: Nínú ọ̀rọ̀ Jòhánù, πιστεύω εἰς pẹ̀lú ẹni gẹ́gẹ́ bí object túmọ̀ sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí a darí sí ẹni náà. ‘Gbà mí gbọ́’ ni ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ èyí.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: ‘Òkùnkùn’ pa àwòrán ti ẹ̀mí àti ìwà rere nínú Jòhánù mọ́; Yorùbá kò nílò ọ̀rọ̀ ìtọ́kasí kan tí yóò bá árítíkù Gíríìkì mu ní gbogbo ibi.
- source_word: μὴ μείνῃ
  choice: má bàa dúró
  rationale: Aorist subjunctive lẹ́yìn ἵνα pẹ̀lú μή sọ ète òdì; ‘má bàa dúró’ fi ìtumọ̀ ṣíṣe bẹ́ẹ̀ lọ nínú ipò òkùnkùn hàn lọ́nà tó ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ Kristi nínú àwòrán ìmọ́lẹ̀ ti Jòhánù
  choice: ‘Gẹ́gẹ́ bí ìmọ́lẹ̀’ ni a lò, kí Jésù lè farahàn gẹ́gẹ́ bí ìmọ́lẹ̀ tó wọ ayé.
  alternative: ‘Mo ti wá bí ìmọ́lẹ̀ kan sínú ayé’ tàbí ‘Mo ti wá láti mú ìmọ́lẹ̀ wá sí ayé.’
  rationale: Ìtumọ̀ yìí pa àfiwé inú ẹsẹ náà mọ́, kò sì sọ ọ́ di àlàyé ẹ̀kọ́ nípa ẹni Kristi tàbí iṣẹ́ rẹ̀.
- issue: Ìwọ̀n πᾶς ὁ πιστεύων
  choice: ‘Gbogbo ẹni tí ó bá gbà mí gbọ́’ ni a lò láìfi ẹ̀kọ́ ẹ̀sìn kan nípa bí ìgbàgbọ́ ṣe ń bẹ̀rẹ̀ kún un.
  alternative: ‘Ẹnikẹ́ni tí ó bá gbà mí gbọ́.’
  rationale: Gíríìkì ń sọ nípa gbogbo ẹgbẹ́ àwọn tó gbàgbọ́; ẹsẹ yìí fúnra rẹ̀ kò yanjú àríyànjiyàn ẹ̀kọ́ ẹ̀sìn nípa ìfẹ́ ènìyàn tàbí yíyan Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A yàn ‘gbà mí gbọ́’ dípò ọ̀nà líle bí ‘ní ìgbàgbọ́ sínú mi,’ a sì pa àwòrán ‘ìmọ́lẹ̀/òkùnkùn’ ti Jòhánù mọ́.
