  to: Bí ẹnikẹ́ni bá ń sìn mí[a], kí ó máa tọ̀ mí lẹ́yìn; àti níbi tí mo wà, ibẹ̀ náà ni ìránṣẹ́ mi yóò wà. Bí ẹnikẹ́ni bá ń sìn mí, Baba yóò bu ọlá fún un.
