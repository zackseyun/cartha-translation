id: JHN.12.26
reference: John 12:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ń sìn mí[a], kí ó máa tọ̀ mí lẹ́yìn; àti níbi tí mo wà, ibẹ̀ náà ni ìránṣẹ́ mi yóò wà. Bí ẹnikẹ́ni bá ń sìn mí, Baba yóò bu ọlá fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì lo ọ̀rọ̀-orúkọ àìdánimọ̀ ẹyọ akọ, pé: “Bí ẹnikẹ́ni bá ń sìn mí … Baba yóò bu ọlá fún un.” Àwọn arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: ń sìn mí
  rationale: “Sìn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe iṣẹ́ ìránṣẹ́ fún Jesu; ó yẹra fún ìtumọ̀ tó dín kù sí ipò iṣẹ́ ìjọ.
- source_word: ἀκολουθείτω
  choice: kí ó máa tọ̀ mí lẹ́yìn
  rationale: Ìṣètò “kí ó máa” fi agbára àṣẹ àti ìtẹ̀síwájú ọmọ-ẹ̀yìn hàn ní Yorùbá àdánidá, láìfi ju ohun tí gírámà Gíríìkì sọ lọ.
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí ẹni tó ń sin Jesu lápapọ̀, kì í ṣe ipò díákónì nínú ìjọ.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ibi tí mo bá wà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ibi tí ẹni kan wà, ó sì pa ìtumọ̀ gbólóhùn Gíríìkì mọ́.
- source_word: ἐκεῖ καὶ
  choice: ibẹ̀ náà ni
  rationale: '“Náà” mú ìtumọ̀ àfikún καί jáde: ìránṣẹ́ náà yóò wà ní ibẹ̀ pẹ̀lú Jesu.'
- source_word: τιμήσει
  choice: yóò bu ọlá fún un
  rationale: “Bu ọlá fún” jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún fífi ọlá fún ẹnì kan, ó sì pa ìlérí ọjọ́ iwájú mọ́.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Gíríìkì ní “Baba,” kò ní arọ́pò-orúkọ olóhun “mi”; nítorí náà, a kò fi “Baba mi” kún un.
- source_word: τις / αὐτόν
  choice: ẹnikẹ́ni / un
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú àwọn ọ̀rọ̀ wọ̀nyí; “ẹnikẹ́ni” àti “un” tọ́ka sí ẹni kan ṣoṣo láìyí ìwọ̀n ìtumọ̀ padà.
theological_decisions:
- issue: Ìtọ́kasí akọ lápapọ̀ nínú gbólóhùn oníṣ条件
  choice: Lo “ẹnikẹ́ni” àti arọ́pò-orúkọ Yorùbá “ó/un,” kí àlàyé ìsàlẹ̀ ojú ìwé sì sọ irú ètò Gíríìkì.
  alternative: Láti fi ọ̀rọ̀ akọ bí “ọkùnrin” sínú àyọkà.
  rationale: Gíríìkì lo ẹyọ ọ̀rọ̀ akọ gẹ́gẹ́ bí ìtọ́kasí gbogbogbò, ṣùgbọ́n Yorùbá kò ní akọ tàbí abo nínú arọ́pò-orúkọ ẹni kẹta. Fífi “ọkùnrin” kún un yóò dín ìtumọ̀ “ẹnikẹ́ni” kù.
- issue: Irú ọlá tí Baba yóò fi fún ìránṣẹ́ Jesu
  choice: Ṣe é ní tààrà gẹ́gẹ́ bí “Baba yóò bu ọlá fún un,” láìṣàlàyé irú ọlá náà.
  alternative: Ṣàlàyé ọlá náà ní pàtó gẹ́gẹ́ bí ẹ̀san ọ̀run tàbí ògo ọjọ́ ìkẹyìn.
  rationale: Ẹsẹ̀ náà kò sọ irú ọlá náà ní pàtó; ìtumọ̀ yìí pa ààyè ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ìránṣẹ́” dípò ọ̀rọ̀ tó lè túmọ̀ sí ipò àṣẹ nínú ìjọ.
