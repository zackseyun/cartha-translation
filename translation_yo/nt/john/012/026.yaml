  source_fidelity: Ìtumọ̀ náà ṣàfihàn iṣẹ́ sísìn Jesu, àṣẹ láti tọ̀ ọ́ lẹ́yìn, ìlérí pé ìránṣẹ́ rẹ̀ yóò wà níbi tí òun wà, àti pé Baba yóò bu ọlá fún ẹni náà. Ṣùgbọ́n “ibi tí mo bá wà” lè dà bí gbolohun onígbẹ́kẹ̀lé ní Yorùbá, nígbà tí ὅπου εἰμὶ ἐγώ jẹ́ “níbi tí mo wà.” Ọ̀rọ̀ àfikún καί tó ṣí apá kejì náà tún yẹ kí ó hàn.
