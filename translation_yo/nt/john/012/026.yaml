  terminology: “Sìn,” “tọ̀ ... lẹ́yìn,” “ìránṣẹ́,” “Baba,” àti “bu ọlá fún” yẹ, wọ́n sì yẹra fún fífi διάκονος di ipò díákónì nínú ìjọ. Àlàyé ìsàlẹ̀ ojú ìwé yẹ kí ó pe τις ní ọ̀rọ̀-orúkọ àìdánimọ̀ ẹyọ akọ, kì í ṣe “ètò ẹyọ ọ̀rọ̀ akọ,” kí ó le ṣàlàyé gírámà náà ní kedere.
