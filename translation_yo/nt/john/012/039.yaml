  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: yo
  text: 'Nítorí èyí ni wọ́n kò fi lè gbàgbọ́, nítorí pé Àìsáyà tún sọ pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí ìdí èyí
  rationale: Ọ̀rọ̀ yìí fi ìdí tàbí ohun tó fà á hàn, ó sì so gbólóhùn náà mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: οὐκ ἠδύναντο
  choice: wọn kò lè
  rationale: Ó sọ àìlè ṣe ohun kan ní tààràtà; a kò sọ ọ́ di pé wọn kò fẹ́, kí ìtumọ̀ Gíríìkì má bàa rọ̀.
- source_word: πιστεύειν
  choice: gbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ fún πιστεύω ní irú gbólóhùn yìí, ó sì bá lílo ọ̀rọ̀ náà nínú Jòhánù mu.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ní àyíká ọ̀rọ̀ yìí, ὅτι ń ṣàlàyé ìdí àìlè gbàgbọ́ wọn nípasẹ̀ ọ̀rọ̀ Àìsáyà tó tẹ̀ lé e.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé àyọlò mìíràn láti ọ̀dọ̀ Àìsáyà ń bọ̀ lẹ́yìn èyí tí a ti sọ ṣáájú.
- source_word: εἶπεν
  choice: sọ
  rationale: “Sọ” jẹ́ ọ̀nà àdánidá àti tó péye láti mú ọ̀rọ̀ àyọlò wọlé ní Yorùbá.
- source_word: Ἠσαΐας
  choice: Àìsáyà
  rationale: A lo ìkọ̀wé orúkọ wòlíì náà tí ó wọ́pọ̀ nínú Yorùbá.
theological_decisions:
- issue: Irú àìlè gbàgbọ́ tí ẹsẹ̀ náà sọ
  choice: wọn kò lè gbàgbọ́
  alternative: wọn kò fẹ́ gbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì sọ àìlè gbàgbọ́, kì í ṣe àìfẹ́ nìkan. Ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ mọ́ láìfi èrò ẹ̀sìn kan pàtó ṣàlàyé bí àìlè náà ṣe ń ṣiṣẹ́.
- issue: Ipa ὅτι nínú gbólóhùn
  choice: nítorí pé
  alternative: pé
  rationale: A mú un gẹ́gẹ́ bí àsopọ̀ tó ń fi ìdí hàn, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ àti àyọlò Àìsáyà tó tẹ̀ lé e; síbẹ̀, a kò ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ sí ohun tí ọ̀rọ̀ náà sọ.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn ní kíkún, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A pa àtẹ̀lé ìdí méjèèjì mọ́ nípasẹ̀ “Nítorí ìdí èyí” àti “nítorí pé,” bí ó tilẹ̀ jẹ́ pé àtúnwí náà wà nínú orísun náà.
