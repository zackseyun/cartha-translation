  to: Nítorí náà, àwọn wọ̀nyí wá sí ọ̀dọ̀ Fílípì, ẹni tí ó jẹ́ ará Bẹtisáídà ní Galili, wọ́n sì ń béèrè lọ́wọ́ rẹ̀ pé, “Ọ̀gbẹ́ni[a], a fẹ́ rí Jésù.”
  rationale: A rọ́pò ọ̀nà ìsọ̀rọ̀ fún προσῆλθον pẹ̀lú ‘wá sí ọ̀dọ̀’ kí ó lè jẹ́ Yorùbá àdánidá tó sì dúró ṣinṣin mọ́ ìtumọ̀ orísun. A tún yan ‘Ọ̀gbẹ́ni’ fún κύριε nítorí pé Fílípì, kì í ṣe Jésù, ni a ń bá sọ̀rọ̀; àlàyé ìsàlẹ̀ ń ṣètìlẹ́yìn fún ìtumọ̀ ‘Olúwa’ láì pa àìdájú ọ̀rọ̀ Gíríìkì rẹ́.
