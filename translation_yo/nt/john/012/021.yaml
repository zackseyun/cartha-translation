id: JHN.12.21
reference: John 12:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: yo
  text: Nítorí náà, àwọn wọ̀nyí wá sí ọ̀dọ̀ Fílípì, ẹni tí ó jẹ́ ará Bẹtisáídà ní Galili, wọ́n sì ń béèrè lọ́wọ́ rẹ̀ pé, “Ọ̀gbẹ́ni[a], a fẹ́ rí Jésù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa, a fẹ́ rí Jésù.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń pe ènìyàn, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ọ̀rọ̀ atọ́ka ọ̀pọ̀ yìí ń tọ́ka padà sí àwọn ará Gíríìkì tí ẹsẹ tó ṣáájú mẹ́nu kàn; ‘àwọn wọ̀nyí’ pa ìsopọ̀ ọ̀rọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú tàbí àbájáde nínú ìtàn hàn, ó sì jẹ́ àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: προσῆλθον
  choice: tọ … wá
  rationale: Ó túmọ̀ sí pé wọ́n sún mọ́ Fílípì tàbí wọ́n wá bá a; ‘tọ … wá’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: Φιλίππῳ
  choice: Fílípì
  rationale: Àkọsílẹ̀ orúkọ Φίλιππος ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: ẹni tí ó jẹ́ ará Bẹtisáídà ní Galili
  rationale: Gbólóhùn yìí dá Fílípì mọ̀ gẹ́gẹ́ bí ẹni tó wá láti Bẹtisáídà, ìlú kan ní Galili; ìtumọ̀ náà jẹ́ ti ẹ̀dá Yorùbá láì pàdánù ìsọfúnni ibi.
- source_word: ἠρώτων
  choice: wọ́n sì ń béèrè lọ́wọ́ rẹ̀
  rationale: Àkókò imperfect Gíríìkì lè fi ìṣe tó ń lọ lọ́wọ́ hàn; ‘ń béèrè’ pa apá yẹn mọ́, ‘lọ́wọ́ rẹ̀’ sì fi ẹni tí wọ́n ń béèrè lọ́wọ́ hàn.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ tí ẹni kan sọ lẹ́yìn ọ̀rọ̀ bí ‘béèrè’; kò pọndandan láti tún ‘sọ pé’ fi kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: Èyí pa ìtumọ̀ ìbílẹ̀ κύριος mọ́, ṣùgbọ́n nítorí pé Fílípì ni wọ́n ń bá sọ̀rọ̀ níbí, ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ ni a fi sínú àlàyé ìsàlẹ̀.
- source_word: θέλομεν
  choice: a fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ète wọn ní ọ̀nà Yorùbá tó rọrùn, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ Ἰησοῦς ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: ἰδεῖν
  choice: rí
  rationale: Ìtumọ̀ tààrà ni ‘rí’; bí ó tilẹ̀ jẹ́ pé àyíká lè túmọ̀ sí pé wọ́n fẹ́ bá a pàdé, a kò fi èrò yẹn rọ́pò ọ̀rọ̀ orísun.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ tí wọ́n sọ fún Fílípì
  choice: Olúwa
  alternative: Ọ̀gbẹ́ni
  rationale: Κύριε lè jẹ́ ‘Olúwa,’ ó sì tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ fún ènìyàn. Nítorí Fílípì ni wọ́n ń bá sọ̀rọ̀, ‘Ọ̀gbẹ́ni’ ṣeé ṣe gidigidi; àlàyé ìsàlẹ̀ pa ìtumọ̀ yìí mọ́ láì sọ pé ọ̀kan ṣoṣo ni ó dájú.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ń béèrè’ láti fi ìṣe tó ń lọ lọ́wọ́ hàn, a sì lo ‘pé’ dípò àtúnsọ gígùn ti λέγοντες kí gbólóhùn náà lè dun bí Yorùbá àdánidá.
