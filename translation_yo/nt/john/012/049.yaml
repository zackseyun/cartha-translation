id: JHN.12.49
reference: John 12:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: yo
  text: Nítorí èmi kò sọ̀rọ̀ láti ara mi[a], ṣùgbọ́n Baba tí ó rán mi, òun fúnra rẹ̀, ti fún mi ní àṣẹ nípa ohun tí mo gbọdọ̀ sọ àti ohun tí mo gbọdọ̀ sọ̀rọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní tìrẹ̀” tàbí “nípa àṣẹ ti ara mi.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀-ìṣe méjì ọ̀tọ̀, “sọ” àti “sọ̀rọ̀”; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: láti ọ̀dọ̀ ara mi
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì fi hàn pé Jésù kò sọ̀rọ̀ ní ìdásílẹ̀ kúrò lọ́dọ̀ Baba. Àlàyé ẹsẹ̀ ìsàlẹ̀ fúnni ní àwọn ọ̀nà Yorùbá tó túmọ̀ ìtumọ̀ náà síwájú.
- source_word: οὐκ ἐλάλησα
  choice: kò sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí iṣẹ́ sísọ Jésù; àkókò tí ó ti kọjá ni Yorùbá adayeba lò níbí, láìfi ipa àkókò Gíríìkì lé gírámà Yorùbá.
- source_word: ὁ πέμψας με πατὴρ
  choice: Baba tí ó rán mi
  rationale: Ó tú participle náà sí gbólóhùn aláṣepọ̀ tó ṣe kedere, ó sì pa ‘Baba’ mọ́ gẹ́gẹ́ bí orúkọ oyè Ọlọ́run nínú àyíká Jòhánù.
- source_word: αὐτός
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ ní Yorùbá adayeba.
- source_word: ἐντολήν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ mú agbára ìtọ́nisọ́nà ọ̀rọ̀ náà jáde dáadáa, láìdín in kù sí ìmọ̀ràn tàbí mú un dà bí òfin àkọsílẹ̀ kan pàtó.
- source_word: δέδωκεν
  choice: ti fún
  rationale: Àmì ‘ti’ ń fi iṣẹ́ tí a ti ṣe tí ipa rẹ̀ ṣì dúró hàn ní Yorùbá.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: ohun tí èmi yóò sọ àti ohun tí èmi yóò sọ̀rọ̀
  rationale: A pa ìyàtọ̀ láàárín λέγω (‘sọ’) àti λαλέω (‘sọ̀rọ̀’) mọ́, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ wọn sún mọ́ra. ‘Yóò’ nínú gbólóhùn àìṣe-taara yìí ń tọ́ka sí ohun tí àṣẹ náà yàn fún un láti sọ.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ Ọmọ sí àṣẹ Baba
  choice: A sọ pé Jésù kò sọ̀rọ̀ láti ọ̀dọ̀ ara rẹ̀, ṣùgbọ́n ó sọ gẹ́gẹ́ bí àṣẹ Baba tó rán an.
  alternative: Kí a túmọ̀ ọ́ pé Jésù kàn ń sọ̀rọ̀ ní àṣẹ tirẹ̀ ṣùgbọ́n ó fara mọ́ Baba, tàbí pé òun kì í ṣe ju wòlíì ènìyàn lọ.
  rationale: Ẹsẹ náà fúnra rẹ̀ tẹnumọ́ pé orísun àti ìtọ́nisọ́nà iṣẹ́ sísọ Jésù wá láti ọ̀dọ̀ Baba. Ìtumọ̀ náà pa ìbáṣepọ̀ iṣẹ́ ìránṣẹ́ yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ kún un.
- issue: πατήρ gẹ́gẹ́ bí oyè
  choice: Baba
  alternative: baba
  rationale: Nínú àyíká Jòhánù, ọ̀rọ̀ náà ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba; lẹ́tà ńlá mú iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè hàn.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. A yan ‘láti ọ̀dọ̀ ara mi’ láti pa àwòrán orísun ọ̀rọ̀ mọ́, a sì fi àwọn ìtumọ̀ Yorùbá adayeba sí ẹsẹ̀ ìsàlẹ̀. Àtúnṣe ìtẹ̀jáde gbọ́dọ̀ jẹ́rìí sí bí àwọn olùkà ṣe ń lóye ‘ohun tí èmi yóò sọ’ gẹ́gẹ́ bí ohun tí àṣẹ Baba yàn, kì í ṣe àsọtẹ́lẹ̀ lasan.
