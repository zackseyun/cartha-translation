  verdict: revise
  source_fidelity: Àtúnṣe ni a nílò fún ìbámu gírámà àti ìtumọ̀. «Láti ara mi» jẹ́ ìfihàn Yorùbá tó rọrùn, tó sì sún mọ́ ἐξ ἐμαυτοῦ ju «láti ọ̀dọ̀ ara mi» lọ. «Mo gbọdọ̀» nínú àwọn ìbéèrè-àìṣe-taara náà ń jẹ́ kí ipa àṣẹ ἐντολή hàn, láìsọ ohun tí kò sí nínú Gíríìkì.
  naturalness: Ìṣọ̀kan «Baba tí ó rán mi ni òun fúnra rẹ̀» kò rọrùn ní Yorùbá. Fífi «òun fúnra rẹ̀» sílẹ̀ gẹ́gẹ́ bí ìtẹnumọ́ àlàyé—«Baba tí ó rán mi, òun fúnra rẹ̀»—jẹ́ adayeba, ó sì pa αὐτός mọ́. Yíyọ «èmi» tó ń tún ara rẹ̀ sọ nínú apá ìkẹyìn kúrò mú gbólóhùn náà rọrùn láti kà.
  terminology: «Baba», «àṣẹ», «sọ», àti «sọ̀rọ̀» yẹ. Ìtumọ̀ náà ń pa ìyàtọ̀ ìṣe-ọrọ̀ εἴπω/λαλήσω mọ́, bí ó tilẹ̀ jẹ́ pé ìyàtọ̀ yìí kì í ṣe mímú títumọ̀ méjèèjì jìnnà síra ju bó ti wà nínú Gíríìkì lọ.
