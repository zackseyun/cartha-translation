  to: Nítorí èmi kò sọ̀rọ̀ láti ara mi[a], ṣùgbọ́n Baba tí ó rán mi, òun fúnra rẹ̀, ti fún mi ní àṣẹ nípa ohun tí mo gbọdọ̀ sọ àti ohun tí mo gbọdọ̀ sọ̀rọ̀.[b]
