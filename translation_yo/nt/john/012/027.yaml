id: JHN.12.27
reference: John 12:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: yo
  text: Nísinsin yìí, ọkàn mi dàrú; kí ni kí n wí? Baba, gbà mí là kúrò nínú wákàtí yìí.[a] Ṣùgbọ́n nítorí èyí ni mo ṣe dé wákàtí yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni kí n wí? ‘Baba, gbà mí là kúrò nínú wákàtí yìí’?” A tún lè ka ọ̀rọ̀ Gíríìkì náà gẹ́gẹ́ bí ìbéèrè àsọyé dípò ẹ̀bẹ̀ tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Nísinsin yìí
  rationale: Ó fi hàn pé ìdààmú náà ń ṣẹlẹ̀ ní àkókò yìí gan-an; gbólóhùn náà jẹ́ èdè Yorùbá àdánidá.
- source_word: ψυχή
  choice: ọkàn
  rationale: Níhìn-ín, ọ̀rọ̀ náà tọ́ka sí inú ẹni àti gbogbo ìmọ̀lára rẹ̀; “ọkàn” sọ èyí ní Yorùbá láì dá a mọ́ “ẹ̀mí.”
- source_word: τετάρακται
  choice: dàrú
  rationale: Ó mú ipò ìdààmú tó wà nísinsin yìí jáde, èyí tó jẹ́ àbájáde ohun tó ti ru inú Jésù.
- source_word: τί εἴπω
  choice: kí ni kí n sì wí?
  rationale: Ìbéèrè náà fi ìrònú jinlẹ̀ àti bí ẹni ń ronú ohun tó yẹ kó sọ hàn; “wí” bá ìforúkọsílẹ̀ ọ̀wọ̀ mu.
- source_word: πάτερ
  choice: Baba
  rationale: Èyí jẹ́ ọ̀rọ̀ ìpè tààrà sí Ọlọ́run, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: gbà mí kúrò nínú wákàtí yìí
  rationale: “Gbà mí” sọ ìgbàlà tàbí ìdáǹdè jáde, “kúrò nínú” sì pa agbára ἐκ mọ́.
- source_word: ὥρα
  choice: wákàtí
  rationale: A pa àwòrán pàtàkì tí Jòhánù ń lò fún àkókò tí a yàn fún ìjìyà, ikú àti ògo Jésù mọ́, dípò fífi “àkókò” rọ́pò rẹ̀.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Ṣùgbọ́n nítorí èyí
  rationale: Ó pa ìyàtọ̀ àti ìtumọ̀ ìdí tàbí ète tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: ni mo ṣe dé wákàtí yìí
  rationale: “Dé” sọ dídé ibi ìparí tí a yàn jáde, kò sì tú εἰς sí “fún” bí ẹni pé ìtumọ̀ ète nìkan ló ṣeé ṣe.
theological_decisions:
- issue: Bóyá “Baba, gbà mí kúrò nínú wákàtí yìí” jẹ́ àdúrà tààrà tàbí apá kan nínú ìbéèrè àsọyé.
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àdúrà tààrà.
  alternative: 'A lè kà á pé: “Kí ni kí n sì wí? ‘Baba, gbà mí kúrò nínú wákàtí yìí’?”'
  rationale: Àwọn ìwé àfọwọ́kọ ìjímìjí kò ní àmì ìdádúró tó pinnu ọ̀nà kan ṣoṣo. Àmì ìdádúró SBLGNT ṣe é ní àdúrà tààrà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ọ̀nà kejì mọ́, kí a má bàa mú ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ kan wọ inú ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. “Wákàtí” pa àkòrí pàtàkì inú Ìhìn Rere Jòhánù mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó túmọ̀ sí àkókò tí a yàn, kì í ṣe ọgọ́ta ìṣẹ́jú lásán.
