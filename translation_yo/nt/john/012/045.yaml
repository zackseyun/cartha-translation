  source_fidelity: Àkọsílẹ̀ náà ń pa ìtúnsọ̀rọ̀ θεωρέω/θεωρεῖ mọ́, ó sì ń sọ τὸν πέμψαντά με di “ẹni tí ó rán mi” láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un. Síbẹ̀, “tí ó bá rí” ní ìrísí ipò-àídájú/ìṣẹ̀lẹ̀ ọjọ́ iwájú tí kò wà nínú participle àsìkò lọwọlọwọ Gíríìkì náà. “Tí ó rí” ń ṣàfihàn ẹni gbogbogbò tí ó ń rí dáadáa ju. “Sì” ń mú καὶ hàn gẹ́gẹ́ bí àsopọ̀ pẹ̀lú ìtumọ̀ ‘pẹ̀lú náà.’
