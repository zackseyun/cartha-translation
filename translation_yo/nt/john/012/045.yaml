  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: yo
  text: Ẹni tí ó rí mi sì rí ẹni tí ó rán mi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wò pẹ̀lú àkíyèsí”; ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ rírí tàbí wíwo pẹ̀lú àkíyèsí àti òye, kì í ṣe rírí lójú lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ní àyíká ọ̀rọ̀ yìí, “sì” jẹ́ àsopọ̀ Yorùbá tó bá καὶ mu, ó sì so gbólóhùn náà mọ́ ohun tó ṣáájú lọ́nà àdánidá.
- source_word: ὁ θεωρῶν
  choice: ẹni tí ó bá rí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe yìí ń tọ́ka sí ẹnikẹ́ni tí ìṣe náà bá ṣàpèjúwe. “Ẹni tí ó bá rí” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò àti ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐμὲ
  choice: mi
  rationale: Ó jẹ́ arọ́pò-orúkọ ẹni àkọ́kọ́ ẹyọ gẹ́gẹ́ bí àbọ̀ ìṣe; “mi” ni ìtumọ̀ Yorùbá tó tọ́.
- source_word: θεωρεῖ
  choice: ó rí
  rationale: θεωρέω lè túmọ̀ sí rírí, wíwo fínnífínní, tàbí mímọ ohun nípasẹ̀ ìwòye. “Ó rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì tún ọ̀rọ̀-ìṣe àkọ́kọ́ ṣe bí Gíríìkì ti ṣe.
- source_word: τὸν πέμψαντά
  choice: ẹni tí ó rán
  rationale: Ó ṣàpèjúwe ẹni tó rán Jésù láìfi oyè kan tí kò sí nínú Gíríìkì kún un. “Ẹni tí ó rán” jẹ́ kedere, ó sì pa àjọṣe olùránṣẹ́ àti ẹni tí a rán mọ́.
- source_word: με
  choice: mi
  rationale: Arọ́pò-orúkọ ẹni àkọ́kọ́ ẹyọ ni, ó sì jẹ́ àbọ̀ fún “rán”; “mi” ni ìtumọ̀ tààrà.
theological_decisions:
- issue: Ìbáṣepọ̀ tó wà láàárín rírí Jésù àti rírí ẹni tó rán an
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí gbólóhùn tààrà nípa ìṣọ̀kan nínú ìfihàn: ẹni tó rí Jésù rí ẹni tó rán an.'
  alternative: Kí a sọ ọ́ di pé ẹni tó rí Jésù kàn mọ ohun kan nípa Olùránṣẹ́, tàbí kí a fi àlàyé kún un pé àwọn méjèèjì jẹ́ ẹni kan náà ní gbogbo ọ̀nà.
  rationale: Gíríìkì sọ ìbámu tó lágbára nínú rírí wọn, ṣùgbọ́n kò ṣàlàyé rẹ̀ síwájú. Ìtumọ̀ náà pa agbára ẹ̀kọ́ ìgbàgbọ́ àti ìfarahàn ọ̀rọ̀ náà mọ́ láìdín in kù tàbí fi ẹ̀kọ́ àlàyé tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé láti lóye. Àtúnṣe “ẹni tí ó bá rí” mú ìtumọ̀ gbogbogbò ti participle náà jáde lọ́nà Yorùbá àdánidá.
