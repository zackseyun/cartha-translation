source:
  edition: SBLGNT
  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: yo
  text: Ṣùgbọ́n Júdásì Ísíkáríótù, ọ̀kan nínú àwọn ọmọ-ẹ̀yìn rẹ̀—ẹni tí yóò fi í hàn—sọ pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ìsinsìnyí ìtàn, lílo àkókò tí ó ti kọjá ní èdè Yorùbá jẹ́ àdánidá nínú ìtàn, ‘pé’ sì mú kí ọ̀rọ̀ tí ó tẹ̀ lé e wọlé dáadáa.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà oníwọ̀nba àti ìtakora hàn láàárín ohun tí obìnrin náà ṣe àti àtakò Júdásì.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Júdásì Isikariotu
  rationale: Àkọtọ̀ orúkọ náà tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀ fún ẹni yìí, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè mu.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ mọ́, ó sì ṣe pàtó ju ‘olùtẹ̀lé’ lọ nínú àyíká Ìhìn Rere.
- source_word: ὁ μέλλων
  choice: ẹni tí ó fẹ́
  rationale: Ní àyíká yìí, gbólóhùn náà ń tọ́ka sí ohun tí ó ń bọ̀ tí ẹni náà sì ti pinnu láti ṣe; ‘ó fẹ́’ jẹ́ àdánidá ní Yorùbá láì sọ ìṣẹ̀lẹ̀ náà di ohun tí ó ṣẹlẹ̀ tẹ́lẹ̀.
- source_word: παραδιδόναι
  choice: dà á
  rationale: Nínú àyíká Júdásì àti Jésù, ‘dà á’ sọ ìwà ọ̀dàlẹ̀ inú ìṣe náà ní kedere. Ìtumọ̀ gígúnná sí ọ̀rọ̀ náà, ‘fi í lé wọn lọ́wọ́,’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδιδόναι nípa ohun tí Júdásì ṣe sí Jésù
  choice: dà á
  alternative: fi í lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnìkan lé ẹlòmíràn lọ́wọ́, ṣùgbọ́n nípa Júdásì ó tún ní ìtumọ̀ ọ̀dàlẹ̀. Ọ̀rọ̀ inú ẹsẹ̀ fi ìtumọ̀ àyíká náà hàn; àlàyé ìsàlẹ̀ sì pa àwòrán gígúnná ti ọ̀rọ̀ Gíríìkì mọ́ láì dá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti bá ìlò àdánidá mu; àmì gígùn fi gbólóhùn àfikún nípa Júdásì yà sọ́tọ̀.
