  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì náà wá dáadáa: δέ, orúkọ Júdásì, ìpèjúwe rẹ̀ gẹ́gẹ́ bí ọ̀kan nínú àwọn ọmọ-ẹ̀yìn, àti ìṣe παραδιδόναι. Ṣùgbọ́n “ẹni tí ó fẹ́ dà á” lè túmọ̀ sí ìfẹ́ tàbí ìpinnu rẹ̀ ju ìtọ́kasí ọjọ́ iwájú/ìṣẹ̀lẹ̀ tí ń bọ̀ ti ὁ μέλλων lọ, “dà á” sì kì í ṣe ọ̀rọ̀ Yorùbá tí ó hàn gbangba fún ìwà ọ̀dàlẹ̀ nínú àyíká yìí.'
