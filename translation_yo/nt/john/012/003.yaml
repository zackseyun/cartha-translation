id: JHN.12.3
reference: John 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: yo
  text: Nígbà náà, Màríà mú lítrà kan ti òróró olóòórùn nárdì ojúlówó, tí ó níye lórí púpọ̀[a][b], ó sì fi òróró náà pa ẹsẹ̀ Jésù lárò; ó sì fi irun rẹ̀ nu ẹsẹ̀ rẹ̀. Ilé náà sì kún fún òórùn dídùn òróró náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lítrà jẹ́ ìwọ̀n ìwúwo Róòmù kan, tó jẹ́ nǹkan bí gírámù 327, ìyẹn fẹ́rẹ̀ẹ́ tó ìdá mẹ́ta kílọ́gírámù.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ Gíríìkì náà sí “nárdì mímọ́”; ìtumọ̀ rẹ̀ kò dájú pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nígbà náà ni
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn, láìfi ìtumọ̀ ìyọrísí tó lágbára kún un.
- source_word: λίτραν
  choice: lítrà kan
  rationale: A pa orúkọ ìwọ̀n Róòmù àtijọ́ náà mọ́ ní àkọsílẹ̀ ohùn, a sì ṣàlàyé iye rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: μύρου
  choice: òróró olóòórùn dídùn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí òróró tàbí ohun ìkunra olóòórùn dídùn tí a lè fi kun ara; yíyan yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: νάρδου
  choice: nárìdì
  rationale: A ṣe àkọsílẹ̀ orúkọ ohun ọ̀gbìn olóòórùn dídùn náà dípò lílo ọ̀rọ̀ gbogbogbò, kí ìsọ pàtó orísun má bàa sọnù.
- source_word: πιστικῆς
  choice: mímọ́
  rationale: Ìtumọ̀ ọ̀rọ̀ yìí ní Gíríìkì ṣì jẹ́ àríyànjiyàn; ‘mímọ́’ fi èrò pé kò ní àdàlú hàn, ṣùgbọ́n a pa ìtumọ̀ mìíràn ‘ojúlówó’ mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: πολυτίμου
  choice: tí ó sì níye lórí púpọ̀
  rationale: Ó fi iye owó rẹ̀ tó ga hàn ní èdè Yorùbá àdánidá.
- source_word: ἤλειψεν
  choice: ó fi kun
  rationale: Ó sọ ìṣe fífi òróró náà sí ẹsẹ̀ ní kedere, ó sì yẹra fún fífi ìtumọ̀ ẹ̀sìn kan pàtó tí ọ̀rọ̀ náà kò fipá mú kún un.
- source_word: ἐξέμαξεν
  choice: ó sì fi irun rẹ̀ nu
  rationale: Ó pa ìṣe nù àti ohun èlò tí Màríà fi ṣe é mọ́ ní ọ̀nà àdánidá.
- source_word: ἐπληρώθη ἐκ τῆς ὀσμῆς
  choice: kún fún òórùn dídùn
  rationale: Ìtumọ̀ aláìṣe ti Gíríìkì àti bí òórùn náà ṣe tàn ká ilé ni gbólóhùn yìí mú jáde.
theological_decisions:
- issue: Ìtumọ̀ àmì tàbí ẹ̀kọ́ tí ó lè wà nínú fífi òróró kun Jésù
  choice: A túmọ̀ ìṣe náà ní tààrà gẹ́gẹ́ bí fífi òróró olóòórùn dídùn kun ẹsẹ̀ Jésù.
  alternative: Lílo ọ̀rọ̀ bí ‘fi àmì òróró yàn án,’ èyí tí ó lè tẹnumọ́ ìyàn sí ipò ọba tàbí ìṣe mímọ́ kan.
  rationale: Àyíká náà sọ ìṣe fífi òróró sí ara ní kedere, ṣùgbọ́n ẹsẹ yìí nìkan kò pàṣẹ pé kí a pinnu gbogbo ìtumọ̀ àmì tàbí ẹ̀kọ́ rẹ̀; ìtumọ̀ náà jẹ́ kí àfojúsùn bẹ́ẹ̀ ṣì ṣeé ṣe láìfipá mú un.
translation_notes:
  register: Èdè Yorùbá àdánidá, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A pa ‘lítrà’ àti ‘nárìdì’ mọ́ gẹ́gẹ́ bí orúkọ àṣà àti ohun èlò pàtó, pẹ̀lú àlàyé fún òǹkàwé.
