  to: Nígbà náà, Màríà mú lítrà kan ti òróró olóòórùn nárdì ojúlówó, tí ó níye lórí púpọ̀[a][b], ó sì fi òróró náà pa ẹsẹ̀ Jésù lárò; ó sì fi irun rẹ̀ nu ẹsẹ̀ rẹ̀. Ilé náà sì kún fún òórùn dídùn òróró náà.
