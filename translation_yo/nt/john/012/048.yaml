  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: yo
  text: 'Ẹni tí ó kọ̀ mí sílẹ̀, tí kò sì gba àwọn ọ̀rọ̀ mi, ó ní ẹni tí ń dá a lẹ́jọ́: ọ̀rọ̀ tí mo sọ, òun náà ni yóò dá a lẹ́jọ́ ní ọjọ́ ìkẹyìn[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sì tẹ́wọ́ gba àwọn ọ̀rọ̀ mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba, kíkíni káàbọ̀, tàbí títẹ́wọ́ gba.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìn tí mo sọ.” Ọ̀rọ̀ Gíríìkì logos lè túmọ̀ sí “ọ̀rọ̀” tàbí “ìhìn,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: kọ̀ mí sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé ẹni náà kọ Jesu fúnra rẹ̀, kì í ṣe pé ó kàn ṣàìnáání rẹ̀.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: tí kò sì gba àwọn ọ̀rọ̀ mi
  rationale: “Gba” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ gbígba tàbí tẹ́wọ́ gba ọ̀rọ̀ tí a sọ, ó sì pa ìtumọ̀ ìbáṣepọ̀ náà mọ́.
- source_word: τὰ ῥήματά μου
  choice: àwọn ọ̀rọ̀ mi
  rationale: Ọ̀pọ̀ nọ́ńbà náà tọ́ka sí àwọn ohun tí Jesu sọ; “àwọn ọ̀rọ̀ mi” jẹ́ kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: ó ní ẹni tí yóò dá a lẹ́jọ́
  rationale: Èyí pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́ pé ẹni tí ó kọ Jesu ní ẹni tí ń dúró gẹ́gẹ́ bí adájọ́ rẹ̀, láìṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ὁ λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” pa ìtumọ̀ ẹyọ kan àti agbára rẹ̀ mọ́; ó tún lè tọ́ka sí ìhìn iṣẹ́ tí Jesu sọ.
- source_word: ὃν ἐλάλησα
  choice: tí mo sọ
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá fún aorist ἐλάλησα.
- source_word: ἐκεῖνος
  choice: òun náà ni
  rationale: Gbólóhùn yìí fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn, ó sì tọ́ka padà sí ọ̀rọ̀ tí Jesu sọ.
- source_word: κρινεῖ
  choice: yóò dá a lẹ́jọ́
  rationale: “Dá lẹ́jọ́” pa ìtumọ̀ ìdájọ́ mọ́ láìsọ pé àbájáde náà gbọ́dọ̀ jẹ́ ìdálẹ́bi.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àsìkò ìdájọ́ ọjọ́ ìkẹyìn, láìfi ètò ẹ̀kọ́ ìgbà ìkẹyìn kún un.
theological_decisions:
- issue: Irú ẹni tàbí ohun tí ń ṣe ìdájọ́ nínú ẹsẹ náà
  choice: A fi ọ̀rọ̀ tí Jesu sọ hàn gẹ́gẹ́ bí ohun tí yóò dá ẹni náà lẹ́jọ́ ní ọjọ́ ìkẹyìn.
  alternative: A lè ka ọ̀rọ̀ náà sí ẹni tí a fi àwòrán ènìyàn wé, tàbí sí ìlànà tí Jesu fúnra rẹ̀ yóò lò láti dájọ́.
  rationale: 'Ìtumọ̀ náà tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì: ẹni tí ó kọ Jesu ní ẹni tí yóò dá a lẹ́jọ́, lẹ́yìn náà ni a sì dá ẹni náà mọ̀ gẹ́gẹ́ bí ọ̀rọ̀ tí Jesu sọ. A kò yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ pẹ̀lú àwọn ibi mìíràn tí ó sọ ipa Jesu nínú ìdájọ́.'
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Kọ̀ mí sílẹ̀” mú agbára ìkọ̀sílẹ̀ ẹni hàn, “òun náà ni” sì pa ìtẹnumọ́ ἐκεῖνος mọ́.
