source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: yo
  text: Nítorí ẹ ní àwọn òtòṣì pẹ̀lú yín nígbà gbogbo[a], ṣùgbọ́n ẹ kò ní èmi pẹ̀lú yín nígbà gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “àwọn ènìyàn òtòṣì.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ajẹ́tífù tí a lò gẹ́gẹ́ bí orúkọ: “àwọn òtòṣì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: àwọn òtòṣì
  rationale: Ọ̀rọ̀ ajẹ́tífù náà dúró gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ àwọn ènìyàn tí wọ́n jẹ́ òtòṣì; “àwọn òtòṣì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtọ́kasí gbogbogbò mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó ń fi ìdí fún ọ̀rọ̀ tó ṣáájú; “Nítorí” mú ìsopọ̀ àlàyé náà hàn ní Yorùbá àdánidá.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí wíwà tàbí àǹfààní láti wà ní gbogbo ìgbà nínú àyíká yìí; a lò ó bákan náà ní abala méjèèjì.
- source_word: ἔχετε
  choice: ẹ̀yin ní
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí wíwà pẹ̀lú wọn, kì í ṣe jíjẹ́ ohun ìní; àkójọpọ̀ “ní ... pẹ̀lú yín” sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: μεθ’ ἑαυτῶν
  choice: pẹ̀lú yín
  rationale: Gbólóhùn náà túmọ̀ sí wíwà ní àárín tàbí ní ìbáṣepọ̀ pẹ̀lú wọn; “pẹ̀lú yín” jẹ́ àdánidá ní Yorùbá.
- source_word: ἐμέ
  choice: èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùsọ̀rọ̀ tó ń tọ́ka sí Jésù fúnra rẹ̀; ìṣíwájú rẹ̀ nínú Gíríìkì tún fún un ní ìtẹnumọ́, èyí tí “èmi ni” ń ṣàfihàn.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín wíwà àwọn òtòṣì nígbà gbogbo àti àkókò díẹ̀ tí Jésù yóò fi wà pẹ̀lú wọn.
- source_word: οὐ πάντοτε
  choice: kò ... nígbà gbogbo
  rationale: Èyí pa ìkọ̀ àti àfojúsùn adverb náà mọ́ láì sọ ọ́ di “láéláé” tàbí yí ìtumọ̀ àkókò padà.
theological_decisions:
- issue: Ó ṣeé ṣe kí a ṣi ọ̀rọ̀ Jésù lò bí ẹni pé ó ń dín ojúṣe sí àwọn òtòṣì kù.
  choice: A túmọ̀ ọ̀rọ̀ náà tààrà gẹ́gẹ́ bí ìyàtọ̀ nípa wíwà àti àkókò, láì fi hàn pé ìtọju àwọn òtòṣì kò ṣe pàtàkì.
  alternative: Ìtumọ̀ àlàyé tí yóò sọ pé àwọn òtòṣì kò ṣe pàtàkì tó Jésù, tàbí ìtumọ̀ rírọ̀ tí yóò bo ìyàtọ̀ náà mọ́lẹ̀.
  rationale: 'Gíríìkì sọ ìyàtọ̀ òtítọ́ kan: àwọn òtòṣì ń bẹ pẹ̀lú àwọn ọmọ-ẹ̀yìn nígbà gbogbo, ṣùgbọ́n wíwà Jésù pẹ̀lú wọn nípa ti ara ní àkókò yẹn ní ààlà. A kò gbọdọ̀ fikún ẹ̀kọ́ pé àwọn òtòṣì kò ṣe pàtàkì, bẹ́ẹ̀ ni a kò gbọdọ̀ dín ìjẹ́kánjú àkókò náà kù.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lásán. A pa ìtẹnumọ́ ἐμέ mọ́ nípasẹ̀ “èmi ni,” a sì lo “ẹ̀yin” láti mú púpọ̀ ẹni kejì hàn.
