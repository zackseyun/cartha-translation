  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ ipilẹ̀ Gíríìkì mọ́: γάρ jẹ́ ìdí/ìtúmọ̀ àlàyé, πάντοτε wà ní ìgbà méjèèjì, ìyàtọ̀ δέ sì hàn. Ṣùgbọ́n ìlànà ọ̀rọ̀ “àwọn òtòṣì ni ẹ̀yin ní” lè sọ “àwọn òtòṣì” di kókó ìfojúsùn (‘àwọn òtòṣì ni ẹ ní,’ ní ìyàtọ̀ sí ẹlòmíràn), èyí tí kò sí nínú Gíríìkì. Àtúnṣe náà mú ìbáṣepọ̀ ‘ẹ ní ... pẹ̀lú yín’ hàn ní kedere.'
