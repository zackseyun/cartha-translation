  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: yo
  text: Jésù dáhùn, ó sì wí pé, “Ohùn yìí kò wá fún mi, bí kò ṣe fún yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohùn yìí kò ṣẹlẹ̀ nítorí mi, bí kò ṣe nítorí yín.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà tún lè tọ́ka sí ìdí ohun kan, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ń ṣètìlẹ́yìn fún ìtumọ̀ “fún àǹfààní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìdáhùn nínú ìjíròrò, ó sì pa iṣẹ́ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἶπεν
  choice: ó sì wí pé
  rationale: Mímú ọ̀rọ̀-ìṣe kejì yìí wọlé pa àkójọpọ̀ ἀπεκρίθη ... καὶ εἶπεν mọ́ ní èdè Yorùbá ọlọ́lá tí ó sì ṣe kedere.
- source_word: φωνή
  choice: ohùn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ọ̀rọ̀ láti ọ̀run tí wọ́n ṣẹ̀ṣẹ̀ gbọ́, kì í ṣe ariwo lásán.
- source_word: γέγονεν
  choice: kò wá
  rationale: Perfect γέγονεν ń tọ́ka sí ìṣẹ̀lẹ̀ àti àbájáde ohùn náà; ‘kò wá’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé pẹ̀lú ‘ohùn.’
- source_word: δι’ ἐμέ
  choice: nítorí mi
  rationale: Ní àyíká yìí, ó lè sọ ète tàbí àǹfààní—ohùn náà kì í ṣe fún àǹfààní Jésù—ṣùgbọ́n ‘nítorí’ tún pa àìdánilójú díẹ̀ tó wà nínú διά mọ́.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: Ó bá δι’ ἐμέ mu ní ìfararọ, ó sì fi hàn pé àwọn olùgbọ́ ni ohùn náà wá fún; ó tún lè gba ìtumọ̀ onídìí ní ìtẹ̀lé ọ̀rọ̀ gírámà.
- source_word: Οὐ ... ἀλλὰ
  choice: kò ... bí kò ṣe
  rationale: Ọ̀nà Yorùbá yìí fi ìtakora ‘kì í ṣe ... ṣùgbọ́n’ hàn ní kedere àti lọ́nà àdánidá.
theological_decisions:
- issue: Ète ohùn láti ọ̀run
  choice: Ohùn náà kò wá fún àǹfààní Jésù, bí kò ṣe fún àǹfààní àwọn olùgbọ́.
  alternative: Ohùn náà ṣẹlẹ̀ nítorí Jésù, ṣùgbọ́n ó jẹ́ fún àwọn ènìyàn tó yí i ká.
  rationale: διά pẹ̀lú accusative nínú àwọn gbólóhùn méjèèjì ṣeé lóye gẹ́gẹ́ bí ète tàbí àǹfààní ní àyíká yìí. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀, ó sì pa ìtakora tí Jésù sọ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘wí’ láti bá ìforúkọsílẹ̀ Bíbélì ọlọ́lá mu, ṣùgbọ́n ìṣètò gbólóhùn náà ṣì jẹ́ àdánidá. Àmì àlàyé [a] wà lẹ́yìn ẹsẹ̀ ọ̀rọ̀ tí ó kan.
