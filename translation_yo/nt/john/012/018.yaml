  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: yo
  text: Nítorí èyí ni ogunlọ́gọ̀ náà pẹ̀lú fi lọ pàdé rẹ̀[a], nítorí wọ́n gbọ́ pé ó ṣe àmì yìí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “ogunlọ́gọ̀ náà pàdé rẹ̀” tàbí “ogunlọ́gọ̀ náà lọ pàdé rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ní ìmọ̀ lílọ láti pàdé ẹnì kan nínú.
    reason: lexical_alternative
  - marker: b
    text: “Àmì” ni ọ̀rọ̀ tí Jòhánù sábà máa ń lò fún iṣẹ́ ìyanu tí ń tọ́ka rékọjá ara rẹ̀ sí ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀; a tún lè túmọ̀ ọ́ sí “iṣẹ́ ìyanu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí ìdí èyí
  rationale: Ó pa agbára ìdí tí διά pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ náà ní mọ́, ó sì so ìṣe ogunlọ́gọ̀ mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi agbára àfikún ọ̀rọ̀ náà hàn lọ́nà àdánidá nínú Yorùbá.
- source_word: ὑπήντησεν αὐτῷ
  choice: jáde lọ pàdé rẹ̀
  rationale: ὑπαντάω ní ìtumọ̀ lílọ láti pàdé ẹnì kan; ‘jáde lọ pàdé rẹ̀’ mú ìtọ́sọ́nà yẹn hàn láìfi àlàyé àfikún tí kò sí sínú ẹsẹ náà kún un.
- source_word: ὁ ὄχλος
  choice: ogunlọ́gọ̀ náà
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá òde òní tó bójú mu fún àwùjọ ènìyàn púpọ̀ tí ὄχλος ń tọ́ka sí.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín, ὅτι ń sọ ìdí tí ogunlọ́gọ̀ fi lọ pàdé Jésù, kì í ṣe pé ó kàn ń bẹ̀rẹ̀ ọ̀rọ̀ tí a ròyìn.
- source_word: ἤκουσαν
  choice: wọ́n gbọ́
  rationale: Ó tú aorist náà sí Yorùbá lọ́nà tó rọrùn; ìṣètò gbólóhùn náà ti jẹ́ kí a mọ̀ pé gbígbọ́ náà ṣáájú lílọ pàdé.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: pé òun ni ó ṣe iṣẹ́ àmì yìí
  rationale: ‘Òun ni ó’ pa ìtẹnumọ́ ẹni tó ṣe àmì náà mọ́, ‘ṣe’ sì bá ποιέω mu; ‘àmì yìí’ pa agbára demonstrative τοῦτο mọ́.
- source_word: τὸ σημεῖον
  choice: iṣẹ́ àmì
  rationale: ‘Iṣẹ́ àmì’ jẹ́ kó ṣe kedere pé ìṣe alágbára ni, ṣùgbọ́n ó tún pa ìtumọ̀ Johannine ti σημεῖον gẹ́gẹ́ bí ohun tó tọ́ka rékọjá ara rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ σημεῖον nínú Ìhìn Rere Jòhánù
  choice: iṣẹ́ àmì
  alternative: iṣẹ́ ìyanu
  rationale: '‘Iṣẹ́ àmì’ pa ìtumọ̀ ìfihàn ọ̀rọ̀ náà mọ́: iṣẹ́ náà kì í ṣe ohun ìyanu lásán, ó tún ń tọ́ka sí ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀. Àṣàyàn yìí kò fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A ṣètò àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ ìpàdé, àti [b] lẹ́yìn ‘iṣẹ́ àmì yìí,’ kí àmì kọ̀ọ̀kan lè tọ́ka sí ọ̀rọ̀ tó ń ṣàlàyé.
