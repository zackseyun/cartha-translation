id: JHN.12.40
reference: John 12:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: yo
  text: Ó ti sọ ojú wọn di afọ́jú, ó sì sọ ọkàn wọn di líle, kí wọn má bàa fi ojú wọn rí, kí wọn má bàa fi ọkàn wọn lóye, kí wọn má sì yí padà,[a] kí èmi sì mú wọn láradá.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “yí padà” sí “padà sọ́dọ̀ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà wà ní fọ́ọ̀mù ọjọ́ iwájú, “èmi yóò mú wọn láradá.” Nínú ìtẹ̀lé gbólóhùn ète tàbí àbájáde yìí, “kí èmi sì mú wọn láradá” fi ìwòsàn tí ìyípadà wọn ì bá yọrí sí hàn.
    reason: lexical_alternative
  - marker: c
    text: Ìlà yìí ń ṣe àtúnsọ Aísáyà 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: Ó ti sọ ojú wọn di afọ́jú
  rationale: Àkókò perfect nínú Gíríìkì fi hàn pé ìṣe náà ti ṣẹlẹ̀, ipò tí ó sì mú wá ṣì ń bá a lọ; “ti sọ ... di afọ́jú” mú agbára yìí jáde ní Yorùbá.
- source_word: ἐπώρωσεν
  choice: sọ ọkàn wọn di líle
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi líle tàbí àìgbọ́ràn ọkàn hàn, ó sì pa ìtumọ̀ ìdájọ́ inú àsọtẹ́lẹ̀ mọ́.
- source_word: καρδίαν / καρδίᾳ
  choice: ọkàn
  rationale: “Ọkàn” pa àwòrán ẹ̀dá ènìyàn ti Bíbélì mọ́; ọ̀rọ̀ “lóye” ló gbé ìtumọ̀ nípa ìrònú jáde.
- source_word: ἵνα μὴ
  choice: kí wọn má bàa
  rationale: Gbólóhùn yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì lè gbé ìtumọ̀ ète tàbí àbájáde inú ọ̀rọ̀ Gíríìkì.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: fi ojú wọn rí
  rationale: Ó pa àwòrán ojú àti ìbáramu rẹ̀ pẹ̀lú “fi ọkàn wọn lóye” mọ́ ní èdè àdánidá.
- source_word: νοήσωσιν
  choice: lóye
  rationale: “Lóye” túmọ̀ sí mímọ̀ tàbí mímú ohun kan yé ẹni, ó sì bá àyíká àsọtẹ́lẹ̀ náà mu.
- source_word: στραφῶσιν
  choice: yípadà
  rationale: “Yípadà” pa ìtumọ̀ fífẹ̀ ti ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan pàtó kún un; a tọ́ka sí àṣàyàn míì nínú àlàyé ìsàlẹ̀.
- source_word: ἰάσομαι
  choice: èmi yóò sì mú wọn lára dá
  rationale: “Yóò” ṣe àfihàn fọ́ọ̀mù ọjọ́ iwájú Gíríìkì ní tààrà, nígbà tí “mú ... lára dá” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìwòsàn.
- source_word: αὐτῶν τὴν καρδίαν
  choice: ọkàn wọn
  rationale: Yorùbá lè lo “ọkàn wọn” fún ọ̀pọ̀ ènìyàn láìsọ ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì nù.
theological_decisions:
- issue: Ẹni tí ó fọ́ wọn lójú tí ó sì sọ ọkàn wọn di líle
  choice: A pa ẹni kẹta ẹyọ, “Ó,” mọ́ gẹ́gẹ́ bí olùṣe.
  alternative: Lílo gbólóhùn aláìlórúkọ tàbí gbólóhùn àfarawà láti rọ agbára pé Ọlọ́run ni olùṣe.
  rationale: Àwọn ọ̀rọ̀-ìṣe Gíríìkì tọ́ka sí olùṣe kan ṣoṣo, gẹ́gẹ́ bí àyọlò Aísáyà; a kò gbọdọ̀ dín ìṣòro ẹ̀kọ́ nípa líle-ọkàn gẹ́gẹ́ bí ìdájọ́ kù.
- issue: Ìtumọ̀ στραφῶσιν nípa ìyípadà
  choice: yípadà
  alternative: di ẹni ìyípadà / gba ìgbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ fífẹ̀ ju ọ̀rọ̀ ẹ̀kọ́ ìjọ kan lọ; “yípadà” pa àìdánilójú àti èdè àwọn wòlíì mọ́.
- issue: Fọ́ọ̀mù ọjọ́ iwájú ἰάσομαι nínú gbólóhùn ète/àbájáde
  choice: èmi yóò sì mú wọn lára dá
  alternative: kí èmi sì mú wọn lára dá / èmi ìbá sì mú wọn lára dá
  rationale: Akọ́kọ́ pa ọjọ́ iwájú Gíríìkì mọ́ ní kedere; àlàyé ìsàlẹ̀ jẹ́wọ́ pé àyíká gbólóhùn náà lè mú kí àwọn èdè kan fi í hàn gẹ́gẹ́ bí ohun tí ìyípadà wọn ì bá yọrí sí.
translation_notes:
  register: A lo Yorùbá boṣewa òde òní pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé gbogbogbò; a pa àwòrán “ojú/ọkàn,” olùṣe ẹni kẹta, àti ìṣòro ẹ̀kọ́ inú àsọtẹ́lẹ̀ mọ́.
