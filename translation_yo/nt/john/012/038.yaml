id: JHN.12.38
reference: John 12:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: yo
  text: 'kí ọ̀rọ̀ tí wòlíì Aísáyà sọ lè ṣẹ pé:


    “Olúwa, ta ni ó gba ìròyìn wa gbọ́[a]?

    Àti fún ta ni a ti fi apá Olúwa hàn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a gbọ́” tàbí “ọ̀rọ̀ wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti so gbólóhùn àbájáde tàbí ète mọ́ ohun tí ó ṣáájú, láìfi tipátipá yan ète tàbí àbájáde nìkan.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: ọ̀rọ̀ tí wòlíì Aísáyà sọ
  rationale: Ó mú ìtumọ̀ náà jáde ní Yorùbá àdánidá, ó sì pa ‘ọ̀rọ̀’ àti oyè Aísáyà gẹ́gẹ́ bí wòlíì mọ́.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: ‘Ṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìmúṣẹ ọ̀rọ̀ Ìwé Mímọ́; ‘lè’ bá ìṣesí subjunctive lẹ́yìn ἵνα mu.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó yẹ fún κύριος ní ipò ìpè tààrà yìí.
- source_word: ἐπίστευσεν τῇ ἀκοῇ ἡμῶν
  choice: ó gba ìròyìn wa gbọ́
  rationale: Gbólóhùn ‘gba ... gbọ́’ jẹ́ Yorùbá àdánidá fún gbígbà ohun tí a kéde gbọ́; ‘ìròyìn’ pa ìtumọ̀ àkóónú ohun tí a gbọ́ mọ́.
- source_word: ὁ βραχίων κυρίου
  choice: apá Olúwa
  rationale: Ó pa àkàwé Bíbélì fún agbára àti iṣẹ́ Ọlọ́run mọ́, dípò ṣíṣe àlàyé rẹ̀ kúrò nínú ẹsẹ náà.
- source_word: ἀπεκαλύφθη
  choice: a ti fi ... hàn
  rationale: Ìkọ̀lé yìí pa ohùn àìṣe (passive) àti ìtumọ̀ ìṣípayá mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìmúṣẹ ọ̀rọ̀ àti bóyá ἵνα ń tọ́ka sí ète tàbí àbájáde
  choice: kí ... lè ṣẹ
  alternative: tí ó fi jẹ́ pé ... ṣẹ; kí ... bàa lè ṣẹ
  rationale: Ìtumọ̀ tí a yàn kò pinnu pé ète nìkan tàbí àbájáde nìkan ni Jòhánù ní lọ́kàn; ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
- issue: Ìtumọ̀ ἀκοή nínú ọ̀rọ̀ Aísáyà
  choice: ìròyìn wa
  alternative: ohun tí a gbọ́; ọ̀rọ̀ wa
  rationale: ἀκοή lè túmọ̀ sí ohun tí a gbọ́ tàbí ohun tí a kéde. ‘Ìròyìn wa’ bá àyíká ìkéde mu, a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣe kedere fún òǹkàwé gbogbo; a pa àkàwé ‘apá Olúwa’ mọ́.
