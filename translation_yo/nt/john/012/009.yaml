  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ó fi ìmọ̀ tí ogunlọ́gọ̀ náà ṣẹ̀ṣẹ̀ rí hàn, ìdí méjì tí wọ́n fi wá, àti ète wọn láti rí Lásárù. Síbẹ̀, ọ̀rọ̀ ìgbẹ̀yìn náà nílò àtúnṣe kékeré kí ó má bàa dà bí ẹni pé Jésù fúnra rẹ̀ ni ó ‘jí dìde.’'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì ní àmì ohùn tó pé. “Ogunlọ́gọ̀ Júù” rọrùn, ó sì dára ju ìṣọ̀kan “ogunlọ́gọ̀ àwọn Júù” lọ nínú ọ̀rọ̀ ìtàn yìí. “Jí Lásárù dìde” sọ ipa Jésù gẹ́gẹ́ bí ẹni tí ó gbé e dìde ní kedere.
  terminology: A ti pa Jésù àti Lásárù mọ́ gẹ́gẹ́ bí orúkọ tí a ti máa lò. “Àwọn Júù” jẹ́ ìtumọ̀ tó bójú mu fún Ἰουδαίων níbí, pẹ̀lú àlàyé ìsàlẹ̀ tí ń pa aṣàyàn “àwọn ará Jùdíà” mọ́. “Òkú” dára fún ìlò ìdásílẹ̀ ἐκ νεκρῶν.
  issues:
