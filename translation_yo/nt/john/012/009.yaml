id: JHN.12.9
reference: John 12:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: yo
  text: Nítorí náà, ogunlọ́gọ̀ Júù[a] gbọ́ pé ó wà níbẹ̀, wọ́n sì wá, kì í ṣe nítorí Jésù nìkan, ṣùgbọ́n kí wọ́n lè rí Lásárù pẹ̀lú, ẹni tí Jésù ti jí dìde kúrò nínú òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ogunlọ́gọ̀ kan láti inú àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀, tàbí, ní àwọn àyíká kan nínú Jòhánù, sí àwọn ará Jùdíà ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: gbọ́ pé
  rationale: Aorist γινώσκω níbí ń tọ́ka sí pé àwọn ènìyàn ṣẹ̀ṣẹ̀ rí ìròyìn náà gbọ́ tàbí mọ̀ ọ́; “gbọ́ pé” jẹ́ ọ̀nà àdánidá nínú Yorùbá fún ìròyìn tí ó dé etí wọn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àbájáde ìtàn.
- source_word: ὄχλος πολὺς
  choice: ogunlọ́gọ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwùjọ ńlá kan ni, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọ̀pọ̀ ènìyàn tí ó péjọ.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó dá àwùjọ náà mọ̀ gẹ́gẹ́ bí àwọn ènìyàn láti inú àwọn Júù. Ìtumọ̀ tó lè jẹ́ “àwọn ará Jùdíà” ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: pé ó wà níbẹ̀
  rationale: A pa àsìkò ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá; ẹni tí “ó” ń tọ́ka sí ni Jésù láti inú àyíká ọ̀rọ̀.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: kì í ṣe nítorí Jésù nìkan
  rationale: διά pẹ̀lú accusative ń sọ ìdí tàbí ohun tó mú wọn wá; ìtumọ̀ yìí bójú mu ìtumọ̀ yẹn.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: ṣùgbọ́n kí wọ́n lè rí ... pẹ̀lú
  rationale: Ó pa ìyàtọ̀ “kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú” àti ète tí ἵνα ń fi hàn mọ́.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: ẹni tí Jésù ti jí dìde kúrò nínú àwọn òkú
  rationale: Ọ̀rọ̀ náà sọ pé Jésù mú Lásárù padà sí ìyè. A tún lo “ti” láti fi hàn pé ìjí dìde náà ti ṣẹlẹ̀ ṣáájú wíwá ogunlọ́gọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú Ìhìn Rere Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà lè tọ́ka sí àwọn Júù gẹ́gẹ́ bí ènìyàn, ṣùgbọ́n ó tún lè ní ìtumọ̀ agbègbè, ìyẹn àwọn ará Jùdíà. A lo ìtumọ̀ tó wọ́pọ̀ nínú ẹsẹ̀, a sì fi èkejì sínú àlàyé láti má ṣe pa àìdánilójú gidi ti ọ̀rọ̀ Gíríìkì rẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó ṣe kedere, tó níyì, tí ó sì yé òǹkàwé òde òní. A yan “ogunlọ́gọ̀” fún àwùjọ ńlá, a sì sọ Jésù ní gbangba nínú gbólóhùn ìkẹyìn láti yẹra fún ìtumọ̀ Yorùbá tí kò ṣe kedere nípa ẹni tó jí Lásárù dìde.
