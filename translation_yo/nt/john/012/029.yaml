  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ gíga ti Gíríìkì dáadáa: ẹgbẹ́ ènìyàn tí ó dúró tí ó sì gbọ́ ohùn náà, ìtẹ̀síwájú ìsọ̀rọ̀ wọn, àti ìyàtọ̀ ẹgbẹ́ kejì ni a pa mọ́. Ṣùgbọ́n ‘àrá ni ó sán’ ń tọ́ka sí mànàmáná tí ń yọ tàbí tí ń lù, kì í ṣe àrá/tàrádà tí a gbọ́. βροντὴν γεγονέναι ń fẹ́ ìtumọ̀ pé àrá ti dún tàbí pé àrá ṣẹlẹ̀.'
