id: JHN.12.29
reference: John 12:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: yo
  text: Nítorí náà, àwọn ènìyàn tí wọ́n dúró níbẹ̀, tí wọ́n sì gbọ́ ohùn náà, ń sọ pé àrá náà dún; àwọn mìíràn sì ń sọ pé, “Áńgẹ́lì kan ti bá a sọ̀rọ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohùn láti ọ̀run nínú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹ̀síwájú tàbí àbájáde hàn.
- source_word: ὄχλος
  choice: àwọn ènìyàn
  rationale: Nínú àyíká yìí ó tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; gbolohun yìí wọ́pọ̀, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: ὁ ἑστὼς
  choice: tí wọ́n dúró níbẹ̀
  rationale: Ó fi ipò àwọn ènìyàn náà ní ibi ìṣẹ̀lẹ̀ hàn, ó sì bá agbára perfect participle mu ní ọ̀nà Yorùbá àdánidá.
- source_word: ἀκούσας
  choice: tí wọ́n sì gbọ́ ohùn náà
  rationale: Ìgbọ́ náà ṣáájú ọ̀rọ̀ tí wọ́n sọ. A mú ohun tí wọ́n gbọ́ jáde gẹ́gẹ́ bí ‘ohùn náà’ láti inú àyíká ẹsẹ tó ṣáájú.
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àmì ìṣe ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ tàbí ọ̀rọ̀ tí ọ̀pọ̀ wọn ń sọ hàn, ní ìbámu pẹ̀lú imperfect.
- source_word: βροντὴν γεγονέναι
  choice: àrá ni ó sán
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá fún ìtumọ̀ pé àrá ṣẹlẹ̀, láìfi èrò míì kún un.
- source_word: ἄλλοι
  choice: àwọn mìíràn
  rationale: Ó ya ẹgbẹ́ kejì sọ́tọ̀ láàárín àwọn ènìyàn náà.
- source_word: Ἄγγελος
  choice: Áńgẹ́lì kan
  rationale: Àyíká náà ń tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe ońṣẹ́ ènìyàn; ‘Áńgẹ́lì’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá mọ̀ dáadáa.
- source_word: αὐτῷ
  choice: bá a
  rationale: Nínú ìsọ̀rọ̀ Yorùbá, ‘bá a sọ̀rọ̀’ túmọ̀ sí sísọ fún un tàbí sí i; ẹni tí ‘a’ dúró fún ni Jésù.
- source_word: λελάληκεν
  choice: ti bá a sọ̀rọ̀
  rationale: Àmì ‘ti’ fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ sì wà nísinsìnyí hàn, ní ìbámu pẹ̀lú perfect tense.
theological_decisions:
- issue: Irú ẹni ọ̀run tí àwọn ènìyàn rò pé ó sọ̀rọ̀
  choice: Áńgẹ́lì kan ti bá a sọ̀rọ̀
  alternative: Ońṣẹ́ kan ti bá a sọ̀rọ̀
  rationale: Ní àyíká ohùn láti ọ̀run, ἄγγελος ṣeé lóye jù lọ gẹ́gẹ́ bí ẹ̀dá ọ̀run. Ìtumọ̀ náà ṣàfihàn ohun tí àwọn ènìyàn rò, kì í ṣe àlàyé olùtumọ̀ nípa ẹni tó sọ̀rọ̀ ní tòótọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo ‘àrá ni ó sán’ dípò ìtumọ̀ gígùn tí kò wọ́pọ̀ ní Yorùbá.
