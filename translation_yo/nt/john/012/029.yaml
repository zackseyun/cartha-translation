  to: Nítorí náà, àwọn ènìyàn tí wọ́n dúró níbẹ̀, tí wọ́n sì gbọ́ ohùn náà, ń sọ pé àrá náà dún; àwọn mìíràn sì ń sọ pé, “Áńgẹ́lì kan ti bá a sọ̀rọ̀.”
