  rationale: 'A tún orúkọ Aísáyà ṣe sí fífi àmì ohùn boṣewa hàn, a sì ṣàtúnṣe ọ̀rọ̀ àlàyé ìsàlẹ̀ díẹ̀ kí ó le jẹ́ Yorùbá àdánidá. A kò yí ìtumọ̀ ẹsẹ̀ náà padà: ó ṣì pa ìdí tí ὅτι fi wà mọ́, ó sì ṣì dá ìtọ́kasí àwọn ọ̀rọ̀ arọ́pò-orúkọ sílẹ̀ láì fi ìpinnu ẹ̀kọ́ ìjọ kan kún un.'
