source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: yo
  text: Aísáyà sọ nǹkan wọ̀nyí nítorí pé ó rí ògo rẹ̀, ó sì sọ̀rọ̀ nípa rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Aísáyà sọ nǹkan wọ̀nyí nítorí pé ó rí ògo Ọlọ́run, ó sì sọ̀rọ̀ nípa rẹ̀.” Ní àyíká ọ̀rọ̀ Jòhánù, ó ṣeé ṣe gan-an pé àwọn ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù; ṣùgbọ́n ìpìlẹ̀ ìtọ́kasí náà nínú Aísáyà ni ìran ògo Olúwa (Aísáyà 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ náà ń tọ́ka sí àwọn àsọtẹ́lẹ̀ tí a ṣẹ̀ṣẹ̀ fa yọ; ‘nǹkan wọ̀nyí’ jẹ́ Yorùbá àdánidá.
- source_word: εἶπεν
  choice: sọ
  rationale: Aorist λέγω túmọ̀ sí ‘sọ’; ó sì yà díẹ̀ sí ἐλάλησεν tí a túmọ̀ sí ‘sọ̀rọ̀.’
- source_word: Ἠσαΐας
  choice: Àìsáyà
  rationale: Èyí ni ọ̀nà tí orúkọ wòlíì náà gbà wọ́pọ̀ nínú Yorùbá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ὅτι ń fi ìdí tí Àìsáyà fi sọ nǹkan wọ̀nyí hàn; bí ó tilẹ̀ jẹ́ pé a tún lè túmọ̀ rẹ̀ sí ‘pé.’
- source_word: εἶδεν
  choice: rí
  rationale: Ìtumọ̀ tààrà àti àdánidá fún aorist ὁράω ni ‘rí.’
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ pa ìtumọ̀ ẹ̀sìn àti ti Jòhánù ti δόξα mọ́ ju ‘ọlá’ tàbí ‘ìmọ́lẹ̀ ńlá’ lọ.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníjẹ̀ẹ́ ni; Yorùbá ‘rẹ̀’ kò fi orúkọ ẹni tí a ń tọ́ka sí kún ohun tí Gíríìkì sọ.
- source_word: ἐλάλησεν
  choice: sọ̀rọ̀
  rationale: ‘Sọ̀rọ̀’ ṣe àfihàn λαλέω, ó sì pa ìyàtọ̀ kékeré mọ́ láàárín rẹ̀ àti εἶπεν (‘sọ’).
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: περί pẹ̀lú genitive túmọ̀ sí ‘nípa’; ‘nípa rẹ̀’ jẹ́ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ẹni tí αὐτοῦ / αὐτοῦ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí ‘rẹ̀,’ nígbà tí àlàyé ìsàlẹ̀ fi hàn pé nínú àyíká Jòhánù ó ṣeé ṣe jù pé Jésù ni a ń tọ́ka sí.
  alternative: Kí a sọ ‘ògo Ọlọ́run’ tààrà, kí a sì ka ọ̀rọ̀ náà sí ìtọ́ka gbogbogbò sí Ọlọ́run/Olúwa.
  rationale: Àyíká Jòhánù 12:37–41 fi àsọtẹ́lẹ̀ Àìsáyà sí ìhà ìdáhùn àwọn ènìyàn sí Jésù, nítorí náà Jésù ni ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ṣeé ṣe jù pé ó ń tọ́ka sí. Síbẹ̀, Gíríìkì fúnra rẹ̀ lo ọ̀rọ̀ arọ́pò-orúkọ, ìran Àìsáyà 6 sì jẹ́ ti ògo Olúwa; nítorí náà, a kò fi orúkọ tí kò sí nínú gbólóhùn náà sí ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu; ‘nǹkan’ ni àkọtọ̀ boṣewa.
