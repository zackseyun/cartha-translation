  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí pé ọ̀rọ̀ Jésù ń fi irú/ọ̀nà ikú rẹ̀ hàn, kò sì dárúkọ àgbélébùú ju ohun tí ẹsẹ̀ sọ lọ. Ṣùgbọ́n “fẹ́rẹ̀ẹ́ kú” túmọ̀ sí pé ó sún mọ́ ikú tàbí pé ó fẹ́ kú díẹ̀ sí i (‘almost died’), kì í ṣe ìwòye ọjọ́ iwájú nínú ìtàn tí ἤμελλεν ἀποθνῄσκειν ń sọ. “Máa kú” jẹ́ ìtumọ̀ tó péye sí i níhìn-ín.
