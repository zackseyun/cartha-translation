  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: yo
  text: Ó ń sọ èyí láti fi hàn irú ikú tí òun máa fi kú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ọ̀nà tí òun yóò gbà kú.” Ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ ọ̀nà tàbí irú ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka aláìlẹ́mìí ẹyọ kan yìí tọ́ka sí ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ; “èyí” jẹ́ èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: kò ní ìtumọ̀ ọ̀tọ̀ nínú gbólóhùn
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; Yorùbá kò nílò kí a fi “ṣùgbọ́n” tàbí àsopọ̀ mìíràn kún un, nítorí bẹ́ẹ̀ lè mú ìtakora tí kò sí wọlé.
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect tọ́ka sí ìṣe tó ń lọ ní àyíká ìtàn náà; “ń sọ” pa ìrísí ìṣe náà mọ́ lẹ́yìn àmì àkókò “Ó” nínú àyíká ìtàn àtijọ́.
- source_word: σημαίνων
  choice: láti fi hàn
  rationale: Ó túmọ̀ sí fífi ohun kan hàn tàbí jíjẹ́ kí a mọ̀ ọ́ nípasẹ̀ àmì; “láti fi hàn” jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ποίῳ θανάτῳ
  choice: irú ikú ... sí
  rationale: Dative náà lè tẹnumọ́ irú tàbí ọ̀nà ikú. “Irú ikú ... kú sí” jẹ́ ọ̀nà Yorùbá tó bójú mu láti pa ìtumọ̀ méjèèjì mọ́.
- source_word: ἤμελλεν
  choice: fẹ́rẹ̀ẹ́
  rationale: μέλλω níhìn-ín tọ́ka sí ohun tó fẹ́ ṣẹlẹ̀; “fẹ́rẹ̀ẹ́” kò fi èrò ìpinnu àyànmọ́ tó lágbára ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ἀποθνῄσκειν
  choice: kú
  rationale: Ó jẹ́ infinitive tó parí ìtumọ̀ ἤμελλεν; “kú” ni ìtumọ̀ Yorùbá tààrà.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé ikú àgbélébùú ni ẹsẹ̀ náà ń tọ́ka sí
  choice: 'Pa ọ̀rọ̀ náà mọ́ lọ́nà àìsọ̀rọ̀-tààrà: “irú ikú tí òun fẹ́rẹ̀ẹ́ kú sí”'
  alternative: irú ikú lórí àgbélébùú tí òun fẹ́rẹ̀ẹ́ kú
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àgbélébùú ni, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò dárúkọ rẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ ṣàlàyé ju ohun tí ọ̀rọ̀ orísun sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “òun” láti jẹ́ kí ó ṣe kedere pé ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ ni yóò kú, láìdárúkọ àgbélébùú tí ẹsẹ̀ náà kò sọ ní tààrà.
