id: JHN.12.34
reference: John 12:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: yo
  text: Nítorí náà, ọ̀pọ̀ ènìyàn náà dá a lóhùn pé, “Àwa ti gbọ́ láti inú Òfin pé Mèsáyà[b] yóò wà títí láé. Báwo ni ìwọ sì ṣe lè sọ pé a gbọ́dọ̀ gbé Ọmọ Ènìyàn sókè[a]? Ta ni Ọmọ Ènìyàn yìí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “gbé ga.” Nínú Jòhánù, “gbé sókè” lè túmọ̀ sí gbígbé ẹni sókè ní ti ara, ó sì tún lè ní ìtumọ̀ ìgbéga.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Nítorí náà, ọ̀pọ̀ ènìyàn náà dá a lóhùn
  rationale: “Nítorí náà” ń pa ipa ìsopọ̀ οὖν mọ́; “ọ̀pọ̀ ènìyàn náà” jẹ́ ọ̀nà Yorùbá àdánidá fún ὁ ὄχλος, “dá a lóhùn” sì túmọ̀ ἀπεκρίθη αὐτῷ ní kedere.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Àwa ti gbọ́ láti inú Òfin
  rationale: “Àwa” fi ìtẹnumọ́ arọ́pò-orúkọ hàn, “ti gbọ́” sì sọ ìṣe tí wọ́n ti gba gẹ́gẹ́ bí ẹ̀kọ́ tí ó ṣì ní í ṣe pẹ̀lú ọ̀rọ̀ yìí. “Òfin” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di “Ìwé Mímọ́” ní gbangba.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí, χριστός jẹ́ oyè ẹni tí àwọn ènìyàn ń retí; “Mèsáyà” mú àyíká ìrètí Júù náà jáde dáadáa ju lílo ọ̀rọ̀ náà bí orúkọ ẹni lọ.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: yóò wà títí láé
  rationale: Gbólóhùn yìí jẹ́ Yorùbá òde òní tó ṣe kedere fún ìwà tí kò ní òpin, ó sì pa agbára durative μένει mọ́.
- source_word: πῶς λέγεις σὺ
  choice: Báwo ni ìwọ sì ṣe lè sọ
  rationale: “Báwo ni ... ṣe lè” fi ìyàlẹ́nu àti ìtakora inú ìbéèrè náà hàn, “ìwọ” sì pa ìtẹnumọ́ σὺ mọ́.
- source_word: δεῖ ὑψωθῆναι
  choice: a gbọ́dọ̀ gbé ... sókè
  rationale: “gbọ́dọ̀” sọ dandan δεῖ; “gbé ... sókè” kò fi ọ̀rọ̀ náà mọ́ àgbélébùú nìkan tàbí ìgbéga nìkan, nítorí náà ó pa ìtumọ̀ onípele méjì ti ὑψόω nínú Jòhánù mọ́.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ oyè náà ní tààrà, ó sì pa ìró Dáníẹ́lì àti lílo rẹ̀ gẹ́gẹ́ bí oyè mọ́.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ta ni Ọmọ Ènìyàn yìí?
  rationale: Ìbéèrè Yorùbá yìí jẹ́ àdánidá, ó sì pa οὗτος (“yìí”) àti ìdánimọ̀ oyè náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ὁ χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè nínú gbólóhùn “Mèsáyà yóò wà títí láé”; “Mèsáyà” pa àyíká ìrètí Júù mọ́ láì mú un dà bí orúkọ ẹni lasán.
- issue: Ìtumọ̀ ὑψωθῆναι nínú Jòhánù
  choice: a gbọ́dọ̀ gbé Ọmọ Ènìyàn sókè
  alternative: a gbọ́dọ̀ gbé Ọmọ Ènìyàn ga
  rationale: “Gbé ... sókè” lè tọ́ka sí gbígbé ara sókè, ó sì tún lè ní ìró ìgbéga; èyí pa ìfọ̀rọ̀wérọ̀ láàárín ikú lórí àgbélébùú àti ìgbéga mọ́ dípò yíyan ọ̀kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A yà àwọn ìbéèrè sí gbolohun lọ́tọ̀ fún ìṣàn ọ̀rọ̀ àdánidá, a sì pa ìtẹnumọ́ “Àwa” àti “ìwọ” mọ́.
