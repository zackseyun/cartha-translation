id: JHN.12.44
reference: John 12:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù ké sókè, ó sì wí pé, “Ẹni tí ó gba mí gbọ́[a] kì í ṣe èmi ni ó gbà gbọ́, bí kò ṣe ẹni tí ó rán mi;[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí ó bá gba mí gbọ́.”
    reason: lexical_alternative
  - marker: b
    text: Èyí kì í sẹ́ pé Jésù jẹ́ ẹni tí ìgbàgbọ́ tọ́ sí; ó ń fi hàn pé gbígba òun gbọ́ kò ṣeé yà sọ́tọ̀ kúrò nínú gbígba ẹni tí ó rán an gbọ́.
    reason: theological_clarification
lexical_decisions:
- source_word: ἔκραξεν
  choice: ké sókè
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohùn gíga ní gbangba. “Ké sókè” jẹ́ Yorùbá àdánidá tí ó pa agbára àti ìjẹ́mímọ́ ọ̀rọ̀ Jésù mọ́.
- source_word: Ὁ πιστεύων
  choice: Ẹni tí ó gba mí gbọ́
  rationale: Àpólà arọ́pò-orúkọ yìí ní ìtumọ̀ gbogbogbò pé ẹni tí ó bá ń gba Jésù gbọ́. Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, ó sì ṣe kedere ní Yorùbá.
- source_word: πιστεύων / πιστεύει
  choice: gba … gbọ́
  rationale: “Gba … gbọ́” ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìgbàgbọ́ tí a darí sí ẹnì kan; ó tún pa àtúnwí ọ̀rọ̀-ìṣe náà mọ́.
- source_word: εἰς ἐμέ
  choice: mí / èmi
  rationale: Pẹ̀lú πιστεύω, ète εἰς ni a fi hàn ní Yorùbá nínú ìṣètò “gba ẹnì kan gbọ́.” “Mí” jẹ́ arọ́pò-orúkọ àfikún, “èmi” sì gba ìtẹnumọ́ nínú gbólóhùn ìyàtọ̀ náà.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: bí kò ṣe ẹni tí ó rán mi
  rationale: “Bí kò ṣe” fi ìyàtọ̀ οὐ … ἀλλά hàn lọ́nà Yorùbá àdánidá. “Ẹni tí ó rán mi” pa ìtọ́kasí aláìsọ-orúkọ ti Gíríìkì mọ́, láìfi “Baba” kún ọ̀rọ̀ pàtàkì.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níhìn-ín δέ ń ṣe àyípadà kékeré tí ó ní ìyàtọ̀ sí ọ̀rọ̀ tí ó ṣáájú; “Ṣùgbọ́n” mú ìṣísẹ̀ ọ̀rọ̀ náà jáde kedere.
theological_decisions:
- issue: Gbólóhùn “kì í ṣe èmi ni ó gbà gbọ́, bí kò ṣe ẹni tí ó rán mi” lè dà bí ẹni pé ó ń sẹ́ pé Jésù jẹ́ ẹni tí ìgbàgbọ́ tọ́ sí.
  choice: A pa ọ̀rọ̀ oníjàngbọ̀n náà mọ́ gẹ́gẹ́ bí ìjẹ́wọ́ pé gbígba Jésù gbọ́ kò ṣeé yà sọ́tọ̀ kúrò nínú gbígba ẹni tí ó rán an gbọ́.
  alternative: “Kì í ṣe èmi nìkan ni ó gbà gbọ́” tàbí fífi “Baba” sínú ọ̀rọ̀ pàtàkì.
  rationale: Gíríìkì kò ní ọ̀rọ̀ tí ó túmọ̀ sí “nìkan.” Fífi í kún un yóò tú ìnira ẹ̀kọ́-ìgbàgbọ́ náà ká dípò pípa a mọ́. Bákan náà, orísun náà sọ “ẹni tí ó rán mi,” kò sọ “Baba” ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀nà ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “wí pé” fún ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ tí ó bójú mu, “ké sókè” sì pa agbára ìkéde ní gbangba mọ́.
