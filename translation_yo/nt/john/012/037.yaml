  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé ó ti ṣe àmì púpọ̀ bẹ́ẹ̀ níwájú wọn[a], wọn kò gbàgbọ́ nínú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n bí ó tilẹ̀ jẹ́ pé ó ti ṣe àmì púpọ̀ bẹ́ẹ̀ níwájú wọn.”
    reason: previous_rendering
  - marker: b
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní àkókò aláìpé, èyí tó lè fi hàn pé àìgbàgbọ́ wọn ń bá a lọ tàbí pé ó ń ṣẹlẹ̀ léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: ọ̀pọ̀ àmì tó bẹ́ẹ̀
  rationale: Gbólóhùn yìí fi iye púpọ̀ tí τοσαῦτα ń tẹnumọ́ hàn ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Bí ó tilẹ̀ jẹ́ pé
  rationale: Ní àyíká yìí, δὲ ń fi ìyàtọ̀ hàn; ìṣètò gbólóhùn onígbàgbọ́ ‘Bí ó tilẹ̀ jẹ́ pé …, …’ mú ìtumọ̀ atakò náà jáde láìsọ ọ́ di líle tàbí àìdánidá.
- source_word: σημεῖα
  choice: àmì
  rationale: ‘Àmì’ pa ìtumọ̀ Johanu mọ́ pé iṣẹ́ náà ń tọ́ka sí ẹni àti iṣẹ́ Jésù, dípò fífi ‘iṣẹ́ ìyanu’ rọ́pò rẹ̀.
- source_word: πεποιηκότος
  choice: ó ti ṣe
  rationale: ‘Ó ti ṣe’ fi hàn pé àwọn iṣẹ́ náà ti ṣẹlẹ̀ ṣáájú, síbẹ̀ ipa wọn ṣì kan ọ̀rọ̀ àìgbàgbọ́ tó tẹ̀ lé e.
- source_word: ἔμπροσθεν αὐτῶν
  choice: níwájú wọn
  rationale: Èyí pa ìtumọ̀ pé ó ṣe àwọn àmì náà ní gbangba ní ojú wọn mọ́.
- source_word: οὐκ ἐπίστευον
  choice: wọn kò gbà á gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àìgbàgbọ́ wọn; àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí pé àkókò ọ̀rọ̀ Gíríìkì lè fi ìwà tí ń bá a lọ tàbí tí ń ṣẹlẹ̀ léraléra hàn.
- source_word: εἰς αὐτόν
  choice: á
  rationale: Nínú gbólóhùn ‘gbà á gbọ́,’ arọ́pò-orúkọ náà tọ́ka sí Jésù, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún πιστεύω εἰς nínú àyíká yìí.
theological_decisions:
- issue: Bí a ṣe máa sọ àìgbàgbọ́ nínú Johanu ní ti àkókò aláìpé (imperfect) ti ọ̀rọ̀-ìṣe náà
  choice: wọn kò gbà á gbọ́
  alternative: wọn kò sì máa gbà á gbọ́
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá tó ṣe kedere, tó sì bá àyíká mu. A kò fi ọ̀rọ̀ bí ‘wọn ń kọ̀ láti gbà á gbọ́’ kún un, nítorí ìyẹn lè fi ìfẹ́ inú tí ẹsẹ̀ náà kò sọ ní tààrà sí i; àlàyé ìsàlẹ̀ ojú ìwé ló pa àǹfààní ìtumọ̀ ìwà tó ń bá a lọ mọ́.
- issue: Ìbáṣepọ̀ atakò láàárín àwọn àmì àti àìgbàgbọ́
  choice: Bí ó tilẹ̀ jẹ́ pé …, wọn kò …
  alternative: Ṣùgbọ́n bí ó tilẹ̀ jẹ́ pé …, wọn kò …
  rationale: Ìṣètò onígbàgbọ́ náà fúnra rẹ̀ ti fi atakò hàn, ó sì yẹra fún àfikún àsopọ̀ tí ó lè dà bí àtúnwí ní Yorùbá.
translation_notes:
  register: Yorùbá ìgbàlódé, tó níyì, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó bá ti jẹ́ àdánidá, a sì yan ‘àmì’ láti pa ọ̀rọ̀ pàtàkì Johanu mọ́.
