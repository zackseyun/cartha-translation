  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìtumọ̀ concessive ti genitive absolute náà, iye púpọ̀ nínú τοσαῦτα, àti ìtumọ̀ ‘àmì’ nínú Johanu dáadáa. Ṣùgbọ́n ‘wọn kò gbà á gbọ́’ lè túmọ̀ sí pé wọn kò gba ohun tí ó sọ gbọ́, tàbí pé wọn kò gbà á ní òtítọ́; kò fi ìtọ́sọ́nà πιστεύω εἰς αὐτόν (‘gbọ́gbọ́ nínú rẹ̀’) hàn kedere.
  naturalness: ‘Bí ó tilẹ̀ jẹ́ pé’ àti ‘níwájú wọn’ jẹ́ Yorùbá ìgbàlódé tó dára. ‘Àmì púpọ̀ bẹ́ẹ̀’ jẹ́ ìṣètò tó rọrùn àti tó dára ju ‘ọ̀pọ̀ àmì tó bẹ́ẹ̀’ lọ nínú àyíká yìí. ‘Gbàgbọ́ nínú rẹ̀’ sì jẹ́ ọ̀nà tí ó ṣe kedere, tí ó sì hàn gbangba pé ìgbàgbọ́ nínú ẹni ni a ń sọ.
  terminology: A yẹ kí a pa ‘àmì’ mọ́ fún σημεῖα. ‘Gbàgbọ́ nínú rẹ̀’ dá ìyàtọ̀ sílẹ̀ láàárín gbígba ọ̀rọ̀ ẹni kan gbọ́ àti ìgbàgbọ́ nínú Jésù, ní ìbámu pẹ̀lú ọ̀nà tí Johanu fi πιστεύω + εἰς lò.
