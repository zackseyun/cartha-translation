revisions:
- from: Bí ó tilẹ̀ jẹ́ pé ó ti ṣe ọ̀pọ̀ àmì tó bẹ́ẹ̀ níwájú wọn[a], wọn kò gbà á gbọ́[b].
  to: Bí ó tilẹ̀ jẹ́ pé ó ti ṣe àmì púpọ̀ bẹ́ẹ̀ níwájú wọn[a], wọn kò gbàgbọ́ nínú rẹ̀[b].
  rationale: A tún ‘wọn kò gbà á gbọ́’ ṣe sí ‘wọn kò gbàgbọ́ nínú rẹ̀’ kí ìtumọ̀ πιστεύω εἰς αὐτόν—ìgbàgbọ́ nínú Jésù—má bàa dà pọ̀ mọ́ gbígba ọ̀rọ̀ rẹ̀ gbọ́. A tún ṣètò ọ̀rọ̀ iye náà sí ‘àmì púpọ̀ bẹ́ẹ̀’ fún Yorùbá tó dára síi. Àkókò aláìpé náà ni a fi sí àlàyé ìsàlẹ̀ ojú ìwé, láìfi ìmọ̀lára ìkọ̀sílẹ̀ tí Gíríìkì kò sọ kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:27:08Z'
