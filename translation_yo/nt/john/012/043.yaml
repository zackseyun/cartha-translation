id: JHN.12.43
reference: John 12:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: yo
  text: Nítorí wọ́n fẹ́ràn ògo ènìyàn ju ògo Ọlọ́run lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìyìn àwọn ènìyàn ju ìyìn Ọlọ́run lọ,” tàbí “ìtẹ́wọ́gbà láti ọ̀dọ̀ ènìyàn ju èyí láti ọ̀dọ̀ Ọlọ́run lọ.”
    reason: Àwọn ìtumọ̀ míì fún δόξα àti genitive tó lè fi orísun hàn.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: wọ́n fẹ́ràn
  rationale: Ó jẹ́ aorist active indicative, ẹni kẹta ọ̀pọ̀, láti ἀγαπάω. “Fẹ́ràn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ ìfẹ́ tí ó lágbára mọ́; àkójọpọ̀ “ju … lọ” ló mú ìtumọ̀ yíyan ọ̀kan sí ojú kejì hàn.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń sọ ìdí fún gbólóhùn tó ṣáájú. “Nítorí” so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú ní kedere láìfi àlàyé míì kún un.
- source_word: δόξαν
  choice: ògo
  rationale: δόξα lè túmọ̀ sí ògo, ọlá, ìyìn, tàbí ìtẹ́wọ́gbà. “Ògo” pa àtúnlò ọ̀rọ̀ kan náà ní apá méjèèjì mọ́, ó sì bá ìlò rẹ̀ jakejado Ìhìn Rere Jòhánù mu.
- source_word: τῶν ἀνθρώπων
  choice: ènìyàn
  rationale: ἄνθρωποι níbí ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan. “Ènìyàn” jẹ́ àkójọpọ̀ àdánidá ní Yorùbá, ó sì jẹ́ kí genitive náà dúró ní ìtumọ̀ gbòòrò rẹ̀—ògo tí ó jẹ́ ti ènìyàn tàbí tí ó ti ọ̀dọ̀ wọn wá.
- source_word: μᾶλλον ἤπερ
  choice: ju … lọ
  rationale: Àkójọpọ̀ yìí fi àfiwé àti ìfẹ́ sí ọ̀kan ju èkejì lọ hàn. “Ju … lọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ ti ìsinsìnyí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: A pa ìṣọ̀kan ètò ọ̀rọ̀ mọ́ pẹ̀lú “ògo Ọlọ́run,” láìpinnu bóyá genitive náà túmọ̀ sí ohun-ìní tàbí orísun nìkan.
theological_decisions:
- issue: Ìtumọ̀ δόξα nínú ìyàtọ̀ láàárín ti ènìyàn àti ti Ọlọ́run
  choice: ògo
  alternative: ìyìn; ọlá; ìtẹ́wọ́gbà
  rationale: “Ògo” pa ìbú ìtumọ̀ Gíríìkì àti ìsopọ̀ ẹ̀kọ́ nípa ògo nínú Jòhánù mọ́. Àwọn àṣàyàn míì ṣeé ṣe, ṣùgbọ́n wọ́n dín ìtumọ̀ náà kù sí apá kan.
- issue: Bí a ṣe túmọ̀ ἀνθρώπων tí ó ń tọ́ka sí gbogbo ènìyàn
  choice: ènìyàn
  alternative: àwọn ènìyàn; aráyé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀. “Ènìyàn” kò sọ ọ́ di ti akọ nìkan, ó sì jẹ́ ìlò Yorùbá tó wọ́pọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ; a pa ìfiwéra àti àtúnlò “ògo” inú orísun mọ́.
