id: JHN.12.36
reference: John 12:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: yo
  text: Níwọ̀n ìgbà tí ẹ ṣì ní ìmọ́lẹ̀ náà, ẹ gbàgbọ́ nínú ìmọ́lẹ̀ náà, kí ẹ lè di àwọn ọmọ ìmọ́lẹ̀.[a] Jésù sọ nǹkan wọ̀nyí, ó sì kúrò, ó farapamọ́ fún wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gígúnlẹ̀ mọ́ ọ̀rọ̀ Giriki: “àwọn ọmọkùnrin ìmọ́lẹ̀.” Àṣà ọ̀rọ̀ náà túmọ̀ sí àwọn ènìyàn tí ìmọ́lẹ̀ ń ṣe àpèjúwe wọn.'
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè túmọ̀ sí: “nígbà tí ó sì ti kúrò, ó fi ara rẹ̀ pamọ́ fún wọn.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Nígbà tí ẹ ṣì ní ìmọ́lẹ̀ náà
  rationale: “Nígbà tí … ṣì” fi ìtumọ̀ àkókò “nígbà tí/níwọ̀n ìgbà tí” hàn, ó sì pa ìkìlọ̀ pé àǹfààní náà kò ní wà títí mọ́.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀ náà
  rationale: A pa atọ́ka pàtó náà mọ́; “ìmọ́lẹ̀ náà” tún jẹ́ kí àwòrán àti ìtumọ̀ ẹ̀kọ́ nípa Kristi nínú Jòhánù dúró láì ṣe àlàyé rẹ̀ sínú ọ̀rọ̀.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: ẹ gbàgbọ́ nínú ìmọ́lẹ̀ náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ píστεύω εἰς, ó sì pa àṣẹ láti ní ìgbàgbọ́ nínú ìmọ́lẹ̀ náà mọ́.
- source_word: ἵνα
  choice: kí … lè
  rationale: Ìṣọ̀kan “kí … lè” fi ète tàbí àbájáde tí gbolohun Giriki náà ń tọ́ka sí hàn lọ́nà àdánidá.
- source_word: υἱοὶ φωτός
  choice: ọmọ ìmọ́lẹ̀
  rationale: Nínú Yorùbá, “ọmọ” kò fi akọ tàbí abo hàn, ó sì jẹ́ ọ̀nà àdánidá láti pa àṣà ọ̀rọ̀ Semitic/Johannine náà mọ́. Àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Giriki lo orúkọ akọ ní ọ̀pọ̀.
- source_word: γένησθε
  choice: ẹ lè di
  rationale: “Di” fi ìtumọ̀ yíyí padà sí ipò kan hàn, dípò kìkì wíwà ní ipò náà.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Jésù sọ nǹkan wọ̀nyí
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì tẹ̀ lé ohun tí λαλέω àti Ταῦτα túmọ̀ sí ní àyíká yìí.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: ó sì kúrò, ó fi ara rẹ̀ pamọ́ fún wọn
  rationale: Àwọn ọ̀rọ̀-ìṣe méjèèjì fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá. “Fi ara rẹ̀ pamọ́” bá ìtumọ̀ àárín tí fọ́ọ̀mù ἐκρύβη ní nínú àyíká yìí mu.
theological_decisions:
- issue: Gbólóhùn ìdílé akọ nínú υἱοὶ φωτός
  choice: ọmọ ìmọ́lẹ̀
  alternative: àwọn ọmọkùnrin ìmọ́lẹ̀
  rationale: Yorùbá máa ń lo “ọmọ” fún ọmọ akọ tàbí abo, àti nínú irú àṣà ọ̀rọ̀ yìí fún àwọn ènìyàn tí ìmọ́lẹ̀ ń ṣe àpèjúwe wọn. Lílo “ọmọkùnrin” nínú àkọsílẹ̀ pàtàkì yóò dín ìtumọ̀ aṣojú gbolohun náà kù; àmọ́ àlàyé ìsàlẹ̀ pa ìrísí akọ ti Giriki mọ́.
- issue: Ọ̀rọ̀ Jòhánù πιστεύω εἰς
  choice: gbàgbọ́ nínú ìmọ́lẹ̀ náà
  alternative: gbẹ́kẹ̀ lé ìmọ́lẹ̀ náà
  rationale: “Gbàgbọ́ nínú” jẹ́ ìbámu taara pẹ̀lú ọ̀rọ̀ Jòhánù, kò sì fi ìtumọ̀ ẹ̀kọ́ míì kún un. “Gbẹ́kẹ̀ lé” lè tẹnu mọ́ ìgbẹ́kẹ̀lé ju bí ọ̀rọ̀ orísun ṣe béèrè lọ.
- issue: Ohun tí ἐκρύβη ń ṣe nínú gbolohun
  choice: ó fi ara rẹ̀ pamọ́ fún wọn
  alternative: ó fara sin kúrò lọ́dọ̀ wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ náà jẹ́ aláìṣe ní Giriki, ó lè ní agbára àárín níbí. Ìtumọ̀ yìí kò sọ pé ẹlòmíràn ló fi Jésù pamọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Arọ́pò-orúkọ “ẹ” pa ọ̀pọ̀ ènìyàn tí a ń bá sọ mọ́. Ìtẹ̀lé ọ̀rọ̀ náà sun mọ́ Giriki, ṣùgbọ́n a lo ìṣètò gbolohun Yorùbá tó rọrùn láti lóye.
