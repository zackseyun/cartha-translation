  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: ó sẹ́ pé ìbákẹ́gbẹ́ àwọn òtòṣì ni ìdí rẹ̀, ó sì fi Júdásì hàn gẹ́gẹ́ bí olè tí ó ní àpótí owó náà lọ́wọ́, tí ó ń kó ohun inú rẹ̀ lọ. Àmì [a] àti [b] wà ní ibi tí ó yẹ. Síbẹ̀, “ohun tí a bá fi sínú rẹ̀” ní àwọ̀n ìtumọ̀ ìṣèjọ́ iwájú tàbí ìpò-ìfọ̀kànsìn (“whatever may be put”), níbi tí τὰ βαλλόμενα ń tọ́ka sí ohun tí a ń fi sínú àpótí náà/ohun tí a fi sínú rẹ̀. “ohun tí wọ́n fi sínú rẹ̀” dá ìtumọ̀ náà dúró dáadáa jù.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó ṣeé kà, ìlò “ó máa ń kó … lọ” sì fi imperfect ἐβάσταζεν hàn ní ti ìṣe àṣà. Àtúnṣe kékeré sí “wọ́n fi” mú gbolóhùn náà dà bí Yorùbá àdánidá, ó sì yọ ìmọ̀lára àdéhùn tí “a bá fi” lè ní kúrò.
