  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: yo
  text: Ó sọ èyí, kì í ṣe nítorí pé ó bìkítà nípa àwọn òtòṣì, ṣùgbọ́n nítorí pé olè ni, ó sì ní àpótí owó náà lọ́wọ́[a], ó máa ń kó ohun tí wọ́n fi sínú rẹ̀ lọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “àpò owó náà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun èlò tí a fi ń pa owó mọ́, yálà àpótí tàbí àpò.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u sí “ó máa ń gbé ohun tí wọ́n fi sínú rẹ̀” tàbí “ó máa ń jí ohun tí wọ́n fi sínú rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà sábà máa ń túmọ̀ sí “gbé” tàbí “rù,” ṣùgbọ́n àyíká ọ̀rọ̀ pé olè ni tọ́ka sí pé ó ń kó o fún ara rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Ó sọ èyí
  rationale: A tú ọ̀rọ̀ náà ní ṣókí àti ní èdè Yorùbá àdánidá; δέ jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́ tí kò pọndandan láti fi ọ̀rọ̀ ìyàtọ̀ kan hàn níbí.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: kì í ṣe nítorí pé ó bìkítà nípa àwọn òtòṣì
  rationale: Gbólóhùn yìí sẹ́ pé àníyàn fún àwọn òtòṣì ni ìdí tí ó fi sọ ọ́; “bìkítà nípa” jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: ṣùgbọ́n nítorí pé olè ni
  rationale: Ó pa ìwọ̀ntúnwọ̀nsì οὐχ ὅτι … ἀλλ’ ὅτι mọ́, “olè” sì jẹ́ ìtumọ̀ tààrà fún κλέπτης.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: ó sì ní àpótí owó náà lọ́wọ́
  rationale: “Àpótí owó” fi ohun èlò tí a fi ń pa owó mọ́ hàn kedere, “ní … lọ́wọ́” sì sọ pé ó wà ní ìkáwọ́ tàbí àbójútó rẹ̀ láìfi ẹ̀kọ́ míì kún un.
- source_word: τὰ βαλλόμενα
  choice: ohun tí a bá fi sínú rẹ̀
  rationale: Ó mú ìṣe àìlórúkọ participle náà wá sí Yorùbá àdánidá, ó sì sọ ibi tí a fi àwọn ohun náà sí di mímọ̀.
- source_word: ἐβάσταζεν
  choice: ó máa ń kó … lọ
  rationale: “Ó máa ń” pa ìṣe tí ó ń ṣẹlẹ̀ léraléra nínú imperfect mọ́; “kó … lọ” lè túmọ̀ sí gbígbé ohun kúrò, àyíká ọ̀rọ̀ pé olè ni sì fi ìlò àìtọ́ hàn.
theological_decisions:
- issue: Ìtumọ̀ ἐβάσταζεν ní ìbámu pẹ̀lú ẹ̀sùn pé Júdásì jẹ́ olè
  choice: ó máa ń kó ohun tí a bá fi sínú rẹ̀ lọ
  alternative: ó máa ń jí ohun tí a bá fi sínú rẹ̀
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí mímú owó náà fún ara rẹ̀, ṣùgbọ́n “kó … lọ” pa àyè ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí “gbé/rù” mọ́ díẹ̀, dípò fífi “jí” sínú ọ̀rọ̀-ìṣe náà láìsí àlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì pa ẹ̀sùn inú àyíká ọ̀rọ̀ mọ́ láìmú ìtumọ̀ ọ̀rọ̀-ìṣe Gíríìkì le ju ẹ̀rí rẹ̀ lọ.
