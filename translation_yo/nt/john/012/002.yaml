base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: yo
  text: Nítorí náà, wọ́n pèsè oúnjẹ fún un níbẹ̀; Mátà sì ń ṣiṣẹ́ láti pèsè oúnjẹ, ṣùgbọ́n Lásárù jẹ́ ọ̀kan lára àwọn tí wọ́n rọ̀gbọ̀kú síbi oúnjẹ pẹ̀lú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àṣà ìgbà náà, àwọn ènìyàn máa ń rọ̀gbọ̀kú síbi oúnjẹ nígbà oúnjẹ pàtàkì, kì í ṣe pé wọ́n jókòó lórí àga bí ó ti wọ́pọ̀ lónìí.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν οὖν αὐτῷ δεῖπνον
  choice: Nítorí náà, wọ́n pèsè àsè fún un
  rationale: “Nítorí náà” pa ipa ìsopọ̀ οὖν mọ́; “wọ́n” kò dá ẹni tí ó ṣe àsè náà lórúkọ ju Gíríìkì lọ; “pèsè àsè fún un” jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣe oúnjẹ pàtàkì fún Jesu.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó tọ́ka sí ibi tí a ti mẹ́nu kàn ṣáájú, ìyẹn Betani.
- source_word: ἡ Μάρθα διηκόνει
  choice: Mátà sì ń ṣe ìránṣẹ́
  rationale: “Ń ṣe” fi ìṣe tí ó ń lọ lọ́wọ́ tí imperfect διηκόνει ní hàn; ọ̀rọ̀ náà bá ṣíṣe ìránṣẹ́ níbi àsè mu láìsọ ọ́ di ọ̀rọ̀ ipò ìjọ.
- source_word: ὁ δὲ Λάζαρος εἷς ἦν ἐκ
  choice: ṣùgbọ́n Lasaru jẹ́ ọ̀kan lára
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ kékeré δέ hàn láàárín Mátà tí ń ṣe ìránṣẹ́ àti Lasaru tí ó wà lára àwọn tó ń jẹun.
- source_word: τῶν ἀνακειμένων σὺν αὐτῷ
  choice: àwọn tí wọ́n jókòó síbi oúnjẹ pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ náà sọ ìṣẹ̀lẹ̀ oúnjẹ di mímọ̀ ní Yorùbá àdánidá. Nítorí pé Yorùbá òde òní lè lóye “dùbúlẹ̀” gẹ́gẹ́ bí sísùn tàbí àìsàn, a fi ìṣesí ìbílẹ̀ náà sínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àpapọ̀, olóhùn kíkún, tí ó lọ́wọ́lọ́wọ́, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbo. A yàgò fún èdè ìjọ tó ní ìtumọ̀ àkànṣe àti fún fífi ẹni tí ó pèsè àsè náà hàn ju ohun tí Gíríìkì sọ lọ.
