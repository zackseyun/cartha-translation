  - severity: low
    issue: “Àsè” fún δεῖπνον
    rationale: “Àsè” lè fi ìmọ̀ràn oúnjẹ àgbàyanu tàbí àjọyọ̀ ńlá kún un. “Oúnjẹ” jẹ́ àṣàyàn tó dájú jù, láì fi ìpele àsè kan kún ìtumọ̀ náà.
  - severity: low
    issue: Ìkọ̀wé orúkọ “Lasaru”
    rationale: “Lásárù” pẹ̀lú àmì ohùn kún fún ìlànà Yorùbá tí a béèrè àti fún ìlò tí ó wọ́pọ̀.
