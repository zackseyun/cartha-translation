id: JHN.12.50
reference: John 12:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: yo
  text: Mo sì mọ̀ pé àṣẹ rẹ̀ ni ìyè àìnípẹ̀kun. Nítorí náà, ohun tí mo ń sọ[a], gẹ́gẹ́ bí Baba ti sọ fún mi, bẹ́ẹ̀ ni mo ń sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àṣẹ rẹ̀ ń yọrí sí ìyè àìnípẹ̀kun,” tàbí, “àṣẹ rẹ̀ dá lórí ìyè àìnípẹ̀kun.” Ní tààrà jù lọ, Gíríìkì wí pé, “àṣẹ rẹ̀ ni ìyè àìnípẹ̀kun.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ẹni tó ní ọlá-àṣẹ pàṣẹ; ó bá ìtumọ̀ ἐντολή mu láìfi àlàyé kún un.
- source_word: ζωὴ αἰώνιος
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀ fún ọ̀rọ̀ Johanu yìí, ó sì pa èrò ìyè tí kò ní òpin mọ́.
- source_word: ἃ
  choice: ohun tí
  rationale: “Ohun tí” tú ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí náà sí Yorùbá àdánidá láìsọ ọ́ di “ohunkóhun.”
- source_word: λαλῶ
  choice: mo ń sọ
  rationale: Lílo “mo ń sọ” ní ibi méjèèjì pa àtúnwí ọ̀rọ̀-ìṣe λαλέω mọ́, ó sì jẹ́ Yorùbá tó ṣe déédéé.
- source_word: καθὼς
  choice: bí ... gan-an
  rationale: Àkópọ̀ yìí fi ìbámu pẹkipẹki láàárín ohun tí Baba sọ àti ohun tí Jésù ń sọ hàn ní Yorùbá àdánidá.
- source_word: εἴρηκέν μοι
  choice: ti sọ fún mi
  rationale: “Ti sọ fún mi” fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn ní kíkún tó yẹ nínú Yorùbá.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: A kò fi “mi” kún un, nítorí Giriki ní “Baba” pẹ̀lú akọ́tọ̀ pàtó, kì í ṣe “Baba mi.”
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú àti àbájáde tó wà nínú οὖν mọ́ ní èdè tó ní iyì.
- source_word: οἶδα
  choice: Mo mọ̀
  rationale: Èyí ni ìtumọ̀ tààrà, àdánidá fún οἶδα, ó sì fi ìdánilójú ọ̀rọ̀ náà hàn.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn “àṣẹ rẹ̀ ni ìyè àìnípẹ̀kun”
  choice: 'A pa ìdọ́gba tààrà inú Giriki mọ́: “àṣẹ rẹ̀ ni ìyè àìnípẹ̀kun.”'
  alternative: Àṣẹ rẹ̀ ń yọrí sí ìyè àìnípẹ̀kun; tàbí àṣẹ rẹ̀ dá lórí ìyè àìnípẹ̀kun.
  rationale: Giriki lo gbólóhùn ìdọ́gba tààrà (“ni ìyè àìnípẹ̀kun”). Pípa èyí mọ́ kò jẹ́ ká yanju ìṣòro ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà mọ̀ọ́mọ̀ fi sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá; a pa àtúnwí “mo ń sọ” àti orúkọ oyè “Baba” mọ́.
