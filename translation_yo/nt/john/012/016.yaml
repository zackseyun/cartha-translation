  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń fara mọ́ Gíríìkì dáadáa ní ọ̀pọ̀ ibi: “kò lóye,” “ní àkọ́kọ́,” “a ṣe Jésù lógo,” àti “a ti kọ ... nípa rẹ̀” jẹ́ ìpinnu tó péye. Ṣùgbọ́n “àwọn ènìyàn” fi kókó-ọrọ̀ kan tí Gíríìkì kò sọ ní kedere kún un. Ọ̀rọ̀-ìṣe ọ̀pọ̀ náà (ἐποίησαν) gbọ́dọ̀ dúró gẹ́gẹ́ bí “wọ́n,” láì dá ẹni tí wọ́n jẹ́ mọ́ ẹgbẹ́ pàtó kan.'
  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì ní àmì ohùn tó dára. “Wọ́n sì ṣe nǹkan wọ̀nyí sí i” ń pa kókó-ọrọ̀ tí a kò dárúkọ mọ́, ó sì dára ju fífi “àwọn ènìyàn” kún un. Àfikún “sì” tún so àwọn apá méjèèjì ìrántí wọn pọ̀ lọ́nà àdánidá.
  terminology: “A ṣe Jésù lógo” pa ọ̀rọ̀ Johannine ti ògo mọ́ láì ṣàlàyé rẹ̀ lọ́nà ẹ̀kọ́ ìsìn kan. A tún fi àmì ẹsẹ̀ c kún “nípa rẹ̀” kí yíyàn “nípa rẹ̀ / ní ti rẹ̀” lè ní ìdí rẹ̀ níbi tó yẹ; àmì yìí wà nínú ọ̀nà ìtẹ̀lé Gẹ̀ẹ́sì ṣùgbọ́n ó sọnù nínú àwòkọ́ṣe Yorùbá.
  issues:
  - severity: medium
    issue: “Àwọn ènìyàn” ni a lò gẹ́gẹ́ bí kókó-ọrọ̀ fún ἐποίησαν.
    rationale: Gíríìkì fi kókó-ọrọ̀ ọ̀pọ̀ sílẹ̀ nínú ọ̀rọ̀-ìṣe, ṣùgbọ́n kò dárúkọ wọn gẹ́gẹ́ bí “àwọn ènìyàn.” Bí ó tilẹ̀ jẹ́ pé àyíká ìtàn lè tọ́ka sí ìjọ ènìyàn, fífi orúkọ ẹgbẹ́ náà sí i jẹ́ àlàyé tí kò wà nínú ẹsẹ̀.
  - severity: low
    issue: Àmì ẹsẹ̀ fún àyípadà “had been written about/concerning him” kò sí nínú àwòkọ́ṣe Yorùbá.
    rationale: Ẹsẹ̀ Gẹ̀ẹ́sì ní àkọsílẹ̀ lexical-alternative fún ἐπ’ αὐτῷ γεγραμμένα. Fífi [c] sí “nípa rẹ̀” àti fífi àlàyé Yorùbá rẹ̀ kún un ń mú àwọn àmì ẹsẹ̀ bá ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
