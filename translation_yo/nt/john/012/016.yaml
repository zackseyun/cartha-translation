  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: yo
  text: Àwọn ọmọ ẹ̀yìn rẹ̀ kò lóye nǹkan wọ̀nyí ní àkọ́kọ́[a]. Ṣùgbọ́n nígbà tí a ṣe Jésù lógo[b], nígbà náà ni wọ́n rántí pé a ti kọ nǹkan wọ̀nyí nípa rẹ̀[c], àti pé wọ́n sì ṣe nǹkan wọ̀nyí sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò mọ nǹkan wọ̀nyí ní àkọ́kọ́.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Jòhánù, ọ̀rọ̀ pé “a ṣe Jésù lógo” sábà máa ń ní í ṣe pẹ̀lú ògo rẹ̀ nípasẹ̀ ikú, àjíǹde àti ìgbéga rẹ̀.
    reason: cross_reference
  - marker: c
    text: Tàbí, “a ti kọ ọ́ ní ti rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: kò lóye
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ju àìmọ̀ lásán lọ; àwọn ọmọ ẹ̀yìn kò tíì lóye ìtumọ̀ ohun tó ń ṣẹlẹ̀. “Kò lóye” jẹ́ Yorùbá àdánidá tó mú èrò yìí jáde.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníhun náà fi hàn pé ọmọ ẹ̀yìn Jésù ni wọ́n; èyí ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τὸ πρῶτον
  choice: ní àkọ́kọ́
  rationale: Ó jẹ́ gbólóhùn àkókò tó túmọ̀ sí “ní ìbẹ̀rẹ̀” tàbí “ní àkọ́kọ́”; yíyan yìí ṣe kúkúrú, ó sì wọ́pọ̀.
- source_word: ἐδοξάσθη
  choice: a ṣe Jésù lógo
  rationale: Ìṣe aláìlórúkọ ní Gíríìkì ni a fi sí Yorùbá gẹ́gẹ́ bí “a ṣe ... lógo,” èyí tó pa èdè ògo pàtàkì nínú Jòhánù mọ́ láì sọ ọ́ di “a gbé e ga” tàbí “a bu ọlá fún un” nìkan.
- source_word: ἐμνήσθησαν
  choice: wọ́n rántí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì bá ìtẹ̀síwájú ìtàn mu.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: a ti kọ ... nípa rẹ̀
  rationale: ἐπί pẹ̀lú dative níbí túmọ̀ sí “nípa rẹ̀” tàbí “ní ti rẹ̀,” kì í ṣe ibi tí a kọ nǹkan sí. “A ti kọ” tún fi hàn pé ìkọ̀wé náà ti ṣáájú ìrántí wọn.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: àwọn ènìyàn ti ṣe nǹkan wọ̀nyí sí i
  rationale: Gíríìkì kò sọ ẹni tí ó ṣe wọ́n ní kedere, ṣùgbọ́n fáwẹ́lì ẹni-kẹta púpọ̀ béèrè kókó-ọrọ̀ ní Yorùbá; “àwọn ènìyàn” jẹ́ kókó-ọrọ̀ gbogbogbò tí kò dín un kù sí ẹgbẹ́ kan. “Sí i” pa ìbáṣepọ̀ dative mọ́ láì túmọ̀ rẹ̀ sí “fún un.”
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Àfihàn ọ̀pọ̀ náà ń tọ́ka sí àwọn ìṣe àti kúlẹ̀kúlẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; títún un ṣe ń pa ìṣọ̀kan ẹsẹ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ pé a ṣe Jésù lógo nínú Jòhánù
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “a ṣe Jésù lógo.”
  alternative: “a gbé Jésù ga” tàbí “a bu ọlá fún Jésù”
  rationale: Èdè ògo nínú Jòhánù ní ìtumọ̀ onípele tó lè tọ́ka sí ikú, àjíǹde àti ìgbéga Jésù. Ìtumọ̀ náà kò fi tipátipá dín un kù sí ọ̀kan ṣoṣo nínú wọn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. A lo “nǹkan” gẹ́gẹ́ bí àkọtọ̀ boṣewa, a sì yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
