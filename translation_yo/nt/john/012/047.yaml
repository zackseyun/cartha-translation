id: JHN.12.47
reference: John 12:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá gbọ́ àwọn ọ̀rọ̀ mi, tí kò sì pa wọ́n mọ́[a], èmi kò dá ẹni náà lẹ́jọ́[b]; nítorí èmi kò wá láti dá ayé lẹ́jọ́, bí kò ṣe láti gba ayé là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sì ṣègbọràn sí wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípa ohun kan mọ́, ṣíṣọ́ ọ, tàbí títẹ̀lé e.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èmi kò dá ẹni náà lẹ́bi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídájọ́, ó sì lè ní ìtumọ̀ ìdájọ́ tí kò dára nínú àyíká ọ̀rọ̀ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: Bí ẹnikẹ́ni bá
  rationale: Ó fi ipò àìdájú tí ó kan ẹnikẹ́ni hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀκούσῃ τῶν ῥημάτων μου
  choice: gbọ́ àwọn ọ̀rọ̀ mi
  rationale: ‘Gbọ́’ pa ìtumọ̀ ìpilẹ̀ ti ἀκούω mọ́ láìfi èrò pé ẹni náà ti fetí sílẹ̀ tàbí ti ṣègbọràn kún un; ‘àwọn ọ̀rọ̀ mi’ sì bá ọ̀rọ̀ tí a sọ mu.
- source_word: φυλάξῃ
  choice: pa wọ́n mọ́
  rationale: Gbólóhùn yìí lè ní ìtumọ̀ pípa ọ̀rọ̀ mọ́, títẹ̀lé e, àti ṣíṣe ohun tí ó wí; kò dín ìtumọ̀ náà kù sí ṣíṣègbọràn nìkan.
- source_word: οὐ κρίνω αὐτόν
  choice: èmi kò dá ẹni náà lẹ́jọ́
  rationale: ‘Dá ... lẹ́jọ́’ jẹ́ ìtumọ̀ àdánidá fún κρίνω, ‘ẹni náà’ sì tọ́ka sí ẹnikẹ́ni tí a mẹ́nu kàn láìfi akọ tàbí abo kún ọ̀rọ̀ Gíríìkì tí ó ní agbára gbogbogbò.
- source_word: οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον
  choice: nítorí èmi kò wá láti dá ayé lẹ́jọ́
  rationale: Ó pa ìdí tí Jésù fi wá àti àtúnlò ọ̀rọ̀ κρίνω mọ́, ó sì tú κόσμος sí ‘ayé’ gẹ́gẹ́ bí ó ṣe wọ́pọ̀ nínú Jòhánù.
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: bí kò ṣe láti gba ayé là
  rationale: ‘Gba ... là’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún σώζω, ó sì pa ìyàtọ̀ tó wà láàárín ìdájọ́ àti ìgbàlà mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ Jésù pé òun kò dá ẹni náà lẹ́jọ́ àti àwọn ẹsẹ mìíràn nínú Jòhánù nípa ìdájọ́
  choice: A tú κρίνω sí ‘dá ... lẹ́jọ́’ ní ibi méjèèjì, a kò sì ṣàlàyé rẹ̀ sí ‘kò dá a lẹ́jọ́ nísinsìnyí.’
  alternative: A lè tú u sí ‘kò dá ẹni náà lẹ́bi’ tàbí fi ‘nísinsìnyí’ kún un.
  rationale: Àtúmọ̀ yìí pa àtúnlò ọ̀rọ̀ náà àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tí ó wà nínú ọ̀rọ̀ Jòhánù mọ́, dípò kí ó yanju rẹ̀ nípasẹ̀ àlàyé tí kò sí nínú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Ẹni náà’ yàgò fún akọ tàbí abo tí Yorùbá kò fi hàn nínú arọ́pò-orúkọ, ó sì pa agbára gbogbogbò ti τις mọ́.
