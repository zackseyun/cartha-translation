id: JHN.12.7
reference: John 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: yo
  text: Nítorí náà, Jésù wí[a] pé, “Fi í sílẹ̀[b], kí ó lè pa á mọ́ fún ọjọ́ ìsìnkú mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Fi í sílẹ̀; ó ti pa á mọ́ fún ọjọ́ ìsìnkú mi.” Àwọn kan lóye gbólóhùn náà gẹ́gẹ́ bí ohun tí obìnrin náà ti ṣe tán, kì í ṣe ohun tí ó ṣì lè ṣe lọ́jọ́ iwájú.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Fi í sílẹ̀, kí ó lè pa á mọ́ títí di ọjọ́ ìsìnkú mi.” A tún lè lóye ìṣètò ọ̀rọ̀ Gíríìkì náà pẹ̀lú ìtumọ̀ àsìkò tó ṣe kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń fi ìtẹ̀síwájú tàbí ìbáṣepọ̀ ọ̀rọ̀ inú ìtàn hàn; ‘Nítorí náà’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa ìsopọ̀ náà mọ́.
- source_word: Ἄφες αὐτήν
  choice: Fi obìnrin yìí sílẹ̀
  rationale: Àṣẹ náà ń sọ pé kí ẹni tí Jésù ń bá sọ má ṣe dá obìnrin náà dúró tàbí yọ ọ́ lẹ́nu mọ́. Ṣíṣe ‘αὐτήν’ ní ‘obìnrin yìí’ mú ẹni tí àṣẹ náà tọ́ka sí ṣe kedere nínú Yorùbá.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ń ṣe àgbékalẹ̀ ète tàbí àbájáde tí a fẹ́; ‘kí ó lè’ jẹ́ ìtumọ̀ Yorùbá àdánidá tí kò mú ìbáṣepọ̀ gbólóhùn náà kúrò.
- source_word: εἰς τὴν ἡμέραν
  choice: fún ọjọ́
  rationale: Ó tọ́ka sí ọjọ́ iwájú tí a ní lọ́kàn láìfi dandan pinnu pé ìtumọ̀ rẹ̀ ni ‘títí di’; a fi ìtumọ̀ àsìkò tó túbọ̀ ṣe kedere sí àlàyé ìsàlẹ̀.
- source_word: ἐνταφιασμοῦ
  choice: ìsìnkú
  rationale: ‘Ìsìnkú’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún fífi òkú sínú ibojì.
- source_word: τηρήσῃ
  choice: kí ó lè pa á mọ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pípa ohun kan mọ́ tàbí fífi í pamọ́ fún àkókò kan. Àgbékalẹ̀ yìí pa agbára gbólóhùn ète náà mọ́.
- source_word: αὐτό
  choice: á
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí òróró olóòórùn dídùn; arọ́pò-orúkọ Yorùbá ‘á’ pa ìtọ́kasí Gíríìkì mọ́ láìfi orúkọ míì kún un.
theological_decisions:
- issue: Bí ọ̀rọ̀ Jésù nípa ìfòróró ṣe ní í ṣe pẹ̀lú ikú àti ìsìnkú rẹ̀
  choice: 'A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ète tó ń wo ọjọ́ ìsìnkú Jésù níwájú: ‘kí ó lè pa á mọ́ fún ọjọ́ ìsìnkú mi.’'
  alternative: A tún lè lóye rẹ̀ pé, ‘ó ti pa á mọ́ fún ọjọ́ ìsìnkú mi,’ tàbí pé kí ó pa á mọ́ ‘títí di’ ọjọ́ náà.
  rationale: Ìṣètò gbólóhùn Gíríìkì náà ṣòro, ó sì gba ìtumọ̀ tó ju ẹyọ kan lọ. Ọ̀rọ̀ àkọ́kọ́ ń tẹ̀ lé agbára ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́ṣà, ṣùgbọ́n àwọn ìtumọ̀ míì tí ó ṣeé ṣe ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé lásán. Àṣẹ ‘Fi obìnrin yìí sílẹ̀’ jẹ́ tààrà, ó sì yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
