id: JHN.12.42
reference: John 12:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: yo
  text: Síbẹ̀, ọ̀pọ̀ lára àwọn olórí pàápàá gba a gbọ́; ṣùgbọ́n nítorí àwọn Farisí, wọn kò jẹ́wọ́ rẹ̀ ní gbangba, kí a má bàa lé wọn jáde kúrò nínú sínágọ́gù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má bàa yọ wọ́n kúrò nínú àwùjọ sínágọ́gù.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí yíyọ ẹnì kan kúrò nínú àwùjọ sínágọ́gù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Síbẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìyàtọ̀ alágbára hàn sí ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ concession/contrast ní Yorùbá.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: ọ̀pọ̀ lára àwọn olórí pàápàá
  rationale: “Lára” fi ìjẹ́ ọmọ ẹgbẹ́ tí ἐκ pẹ̀lú genitive ń tọ́ka sí hàn, “pàápàá” sì mú agbára καί ní àyíká yìí jáde.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: gba a gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe àdánidá fún ìgbàgbọ́ tí a darí sí ẹni kan; kò dín ìgbàgbọ́ náà kù sí àfihàn èké, bẹ́ẹ̀ ni kò túmọ̀ rẹ̀ sí ìdánilójú ìgbàlà.
- source_word: διὰ τοὺς Φαρισαίους
  choice: nítorí àwọn Farisí
  rationale: διά pẹ̀lú accusative ń sọ ìdí; a kò fi “nítorí ìbẹ̀rù” sí i, nítorí bí ó tilẹ̀ jẹ́ pé àyíká lè túmọ̀ sí ìbẹ̀rù, ọ̀rọ̀ náà kò sọ ọ́ ní tààrà.
- source_word: οὐχ ὡμολόγουν
  choice: wọn kò jẹ́wọ́ rẹ̀ ní gbangba
  rationale: Imperfect náà tọ́ka sí ohun tí wọn ń kọ̀ láti ṣe déédéé tàbí ní àkókò náà. “Rẹ̀” fi ẹni tí ìjẹ́wọ́ náà dá lé hàn láìfi ohun tí Gíríìkì kò sọ kún un; “ní gbangba” mú ìtumọ̀ ìjẹ́wọ́ ní àyíká yìí ṣe kedere.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ìkọ̀ Yorùbá yìí fi ète wọn láti yẹra fún àbájáde kan hàn ní ọ̀nà àdánidá.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: lé wọn jáde kúrò nínú sínágọ́gù
  rationale: Èyí sọ ìyọkúrò kúrò nínú àwùjọ sínágọ́gù ní kedere. Ìkọ̀ Yorùbá aláìní ẹni “kí a ...” yẹ fún èrò passive/resultative ti Gíríìkì.
theological_decisions:
- issue: Irú ìgbàgbọ́ àwọn olórí náà ní ìmọ̀-ẹ̀sìn Johanu
  choice: Túmọ̀ ἐπίστευσαν ní tààrà gẹ́gẹ́ bí “gba a gbọ́,” kí a sì pa ìforígbárí mọ́ pé wọn kò jẹ́wọ́ rẹ̀ ní gbangba.
  alternative: Láti pè é ní ìgbàgbọ́ èké lásán tàbí láti sọ pé ó dájú pé wọn ní ìgbàgbọ́ ìgbàlà.
  rationale: Ẹsẹ náà sọ pé wọn gba Jésù gbọ́, ṣùgbọ́n wọn kò jẹ́wọ́ rẹ̀ nítorí àwọn Farisí. Ìtumọ̀ kò gbọ́dọ̀ pinnu ipò ẹ̀mí wọn ju ohun tí ọ̀rọ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ tí a mọ̀ fún ibi àti àwùjọ ìjọsìn Júù; àlàyé ìsàlẹ̀ fi ìtumọ̀ àwùjọ rẹ̀ hàn.
