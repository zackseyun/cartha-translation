  to: Ní báyìí ni ìdájọ́ ayé yìí wà; ní báyìí ni a ó lé alákòóso ayé yìí[a] jáde.[b]
  rationale: A rọ́pò ‘dé’ pẹ̀lú ‘wà’ láti pa ìṣe-ìwà (ἐστίν) nínú ọ̀rọ̀ ìpilẹ̀ mọ́, láì sọ ìdájọ́ náà di ìṣẹ̀lẹ̀ tí ó ṣẹ̀ṣẹ̀ dé. A tún ṣàtúnṣe àlàyé aṣàyàn ‘prince’ kí ó má bàa pe alákòóso náà ní ọmọ ọba. Àwọn àmì àlàyé a àti b ṣì wà níbi tí ó tọ́, ìdánimọ̀ ẹni náà sì ṣì jẹ́ àìsọ pàtó nínú ìtumọ̀ àkọ́kọ́.
  reviewer_model: gpt-5.6-terra
