  source_fidelity: Ìtumọ̀ náà pa ìtẹnumọ́ ‘ní báyìí’ lẹ́ẹ̀mejì, ‘ayé yìí,’ àti ọjọ́ iwájú aláìlórúkọ nínú ‘a ó lé ... jáde’ mọ́ dáadáa. Ṣùgbọ́n ‘ìdájọ́ ... dé’ yí gbolohun ἐστίν (‘ni/wà’) padà sí ìṣẹ̀lẹ̀ ìbọ̀wọ̀lé (‘has arrived’), èyí tí kò sí nínú ọ̀rọ̀ Gíríìkì.
