source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: yo
  text: Ní báyìí ni ìdájọ́ ayé yìí wà; ní báyìí ni a ó lé alákòóso ayé yìí[a] jáde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọba ayé yìí.”
    reason: lexical_alternative
  - marker: b
    text: A sábà máa ń lóye gbólóhùn “alákòóso ayé yìí” gẹ́gẹ́ bí ìtọ́ka sí Sátánì.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: ní báyìí
  rationale: Ó pa agbára àkókò tí ọ̀rọ̀ Gíríìkì ní mọ́, a sì tún un lò lẹ́ẹ̀mejì láti pa ìtẹnumọ́ àti ìbáradọ́gba gbólóhùn mọ́.
- source_word: κρίσις
  choice: ìdájọ́ ... dé
  rationale: “Ìdájọ́” ni ìtumọ̀ pàtàkì níbí; lílo “dé” mú kí gbólóhùn náà jẹ́ Yorùbá àdánidá láì sọ ọ́ di ìdálẹ́bi nìkan.
- source_word: κόσμου τούτου
  choice: ayé yìí
  rationale: Ó pa atọ́ka τούτου (“yìí”) àti ìyàtọ̀ tí Jòhánù ń fi ayé ìsinsìnyí hàn mọ́.
- source_word: ἄρχων
  choice: alákòóso
  rationale: Ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ẹni tí ó ń lo àṣẹ; kò fi ìdánimọ̀ ẹni náà kún ohun tí Gíríìkì sọ.
- source_word: ἐκβληθήσεται ἔξω
  choice: a ó lé ... jáde
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe aláìlórúkọ àti agbára ìléjáde tí ἐκβάλλω pẹ̀lú ἔξω ní hàn.
theological_decisions:
- issue: Ta ni “alákòóso ayé yìí” ń tọ́ka sí?
  choice: A fi orúkọ oyè náà sílẹ̀ nínú ọ̀rọ̀ àkọ́kọ́, láì fi “Sátánì” kún un.
  alternative: Sátánì/Èṣù; tàbí ètò ayé ìsinsìnyí tí a sọ di ẹni.
  rationale: Nínú Jòhánù, ọ̀pọ̀ ènìyàn ló lóye rẹ̀ gẹ́gẹ́ bí ìtọ́ka sí Sátánì, ṣùgbọ́n Gíríìkì lo orúkọ oyè, kì í ṣe orúkọ náà; ìtumọ̀ yìí pa àìsọ pàtó àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere sí òǹkàwé òde òní. A lo “a ó lé ... jáde” gẹ́gẹ́ bí ìṣe aláìlórúkọ àdánidá ní Yorùbá, a sì pa àtúnṣe “ní báyìí” lẹ́ẹ̀mejì mọ́.
