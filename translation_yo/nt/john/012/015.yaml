  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: yo
  text: “Má bẹ̀rù[a], ọmọbìnrin Síónì[b]. Wò ó[c], Ọba rẹ ń bọ̀[e], ó sì jókòó lórí ọmọ kẹ́tẹ́kẹ́tẹ́[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má fòyà.”
    reason: lexical_alternative
  - marker: b
    text: “Ọmọbìnrin Síónì” jẹ́ àwòrán àsọtẹ́lẹ̀ tí ó ń sọ̀rọ̀ nípa Síónì tàbí Jerúsálẹ́mù bí ẹni pé ọmọbìnrin ni.
    reason: cultural_note
  - marker: c
    text: Tàbí, “Kíyèsí i” tàbí “Wò ó dáadáa.”
    reason: lexical_alternative
  - marker: d
    text: Ní tààrà, “lórí ọmọ kẹ́tẹ́kẹ́tẹ́ kan.”
    reason: lexical_alternative
  - marker: e
    text: Ọ̀rọ̀ yìí ń ṣe ìrántí Sekaráyà 9:9, ó sì ń fi Jésù hàn gẹ́gẹ́ bí Ọba tí a ṣèlérí fún Síónì.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Ọ̀nà àṣẹ ìkọ̀sílẹ̀ yìí jẹ́ Yorùbá àdánidá fún dídènà ìbẹ̀rù, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: θυγάτηρ Σιών
  choice: ọmọbìnrin Síónì
  rationale: Ó pa àwòrán àsọtẹ́lẹ̀ tí ó fi Síónì/Jerúsálẹ́mù hàn bí ọmọbìnrin mọ́ láì túmọ̀ rẹ̀ sí ìlú Jerúsálẹ́mù nínú ẹsẹ náà.
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀nà Yorùbá òde òní tí ń pe àfiyèsí olùgbọ́, bí ἰδοὺ ṣe ń ṣe.
- source_word: ὁ βασιλεύς σου
  choice: Ọba rẹ
  rationale: Ó túmọ̀ gbolohun orúkọ náà ní tààrà; lílo lẹ́tà ńlá fún Ọba fi agbára oyè rẹ̀ nínú àyíká Mèsáyà hàn láì fi ìtumọ̀ mìíràn kún un.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ mú ìtumọ̀ ìsinsìnyí alààyè ti ọ̀rọ̀ Gíríìkì jáde lọ́nà àdánidá.
- source_word: καθήμενος
  choice: ó jókòó
  rationale: Ó sọ bí Ọba náà ṣe ń bọ̀, láì fi èrò ‘gùn’ tí kò fara hàn gbangba nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐπὶ πῶλον ὄνου
  choice: lórí ọmọ kẹ́tẹ́kẹ́tẹ́
  rationale: ‘Ọmọ kẹ́tẹ́kẹ́tẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ọmọ ẹranko tí ὄνου fi hàn pé kẹ́tẹ́kẹ́tẹ́ ni.
theological_decisions:
- issue: Ìtọ́kasí àsọtẹ́lẹ̀ sí Sekaráyà 9:9 àti Ọba Mèsáyà
  choice: Pa ‘ọmọbìnrin Síónì’ àti ‘Ọba rẹ’ mọ́ nínú ọ̀rọ̀ ẹsẹ náà, kí àlàyé ìmúṣẹ àsọtẹ́lẹ̀ wà ní àlàyé ìsàlẹ̀.
  alternative: Tú ‘Síónì’ sí ‘Jerúsálẹ́mù,’ tàbí ṣàfikún pé Jésù ni Ọba Mèsáyà nínú ẹsẹ náà fúnra rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì ń pa èdè àsọtẹ́lẹ̀ náà mọ́, kò sì tú gbogbo ìtumọ̀ rẹ̀ jáde nínú ẹsẹ; ìtumọ̀ náà yẹ kí ó pa ìfarapamọ́ àti agbára ìtọ́kasí yìí mọ́.
- issue: Lẹ́tà ńlá nínú ‘Ọba’
  choice: Lo ‘Ọba’ pẹ̀lú lẹ́tà ńlá.
  alternative: Lo ‘ọba’ pẹ̀lú lẹ́tà kékeré.
  rationale: Àwọn ìwé Gíríìkì àtijọ́ kò yan ọ̀nà yìí fún wa; lẹ́tà ńlá jẹ́ àṣà àtúnṣe tí ó fi agbára oyè ọba Jésù nínú àyíká náà hàn, kì í ṣe fífi ẹ̀kọ́ ìsìn tuntun kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa èdè àsọtẹ́lẹ̀ mọ́ ní ṣókí láì sọ ọ́ di èdè ìjọ kan pàtó.
