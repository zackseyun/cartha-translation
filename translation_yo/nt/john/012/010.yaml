review_pass:
  verdict: revise
  source_fidelity: 'The core sense is accurate: the chief-priestly leaders reached a deliberate decision to kill Lazarus, with Lazarus added to those targeted. However, “Nítorí náà” (‘therefore’) gives δέ a more explicitly causal force than the Greek requires. In this context its mild adversative/narrative transition is better represented by “Ṣùgbọ́n.”'
  naturalness: “Àwọn olórí àlùfáà pinnu láti pa Lasaru” is clear, idiomatic Standard Yorùbá. Replacing clause-final “pẹ̀lú” with “náà” more naturally and unambiguously expresses the additive force (‘Lazarus also/too’) rather than a possible accompaniment sense.
  terminology: “Àwọn olórí àlùfáà” appropriately represents the plural ἀρχιερεῖς, and “Lasaru” is a suitable established Yorùbá form. “Pinnu” and “pa” accurately retain the deliberate intent and direct sense of ἀποκτείνωσιν without importing judicial or conspiratorial language.
  issues:
  - severity: medium
    issue: “Nítorí náà” over-specifies the connective δέ.
    rationale: δέ can mark simple continuation or mild contrast; it does not itself establish the strong causal inference expressed by ‘therefore.’ The immediate context supports a contrastive transition.
  - severity: low
    issue: Clause-final “pẹ̀lú” is less precise for καί than “náà.”
    rationale: Although understandable, “pẹ̀lú” can suggest ‘with/together with.’ “Lasaru náà” directly marks Lazarus as an additional target.
  revised_text: Ṣùgbọ́n àwọn olórí àlùfáà pinnu láti pa Lasaru náà,[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọn olórí àlùfáà gbèrò láti pa Lasaru náà.”
    reason: lexical_alternative
  revision_rationale: The revision avoids making the Greek connective explicitly causal and renders the additive καί with the more idiomatic and less ambiguous Yorùbá náà. The alternative footnote retains the viable ‘planned’ sense of ἐβουλεύσαντο while preserving the same intended action.
