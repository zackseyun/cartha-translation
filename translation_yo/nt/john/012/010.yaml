  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: yo
  text: Ṣùgbọ́n àwọn olórí àlùfáà pinnu láti pa Lasaru náà,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn olórí àlùfáà gbèrò láti pa Lasaru náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: pinnu
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìgbìmọ̀ tí ó yọrí sí ìpinnu kan tí wọ́n ti mú; “pinnu” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, ó sì pa ìmọ̀lára ìfẹ́-inú tí a ti pinnu mọ́.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Ní àyíká ìtàn yìí, àsopọ̀ náà ń tẹ̀ síwájú láti inú ohun tí ẹsẹ tó ṣáájú sọ, ó sì ní ìmọ̀lára àbájáde; “Nítorí náà” mú ìṣàn yẹn jáde láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà, kì í ṣe sí olórí àlùfáà kan ṣoṣo.
- source_word: ἵνα
  choice: láti
  rationale: Lẹ́yìn “pinnu,” ọ̀nà àdánidá jù lọ ní Yorùbá láti sọ ète tàbí ohun tí ìpinnu náà dá lé ni “láti” àti ọ̀rọ̀-ìṣe.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi Lasaru kún ẹni mìíràn tí wọ́n fẹ́ pa, gẹ́gẹ́ bí àyíká ìtàn ṣe fi hàn; “pẹ̀lú” mú agbára àfikún náà jáde láìfi ìtẹnumọ́ àfikún sí i.
- source_word: τὸν Λάζαρον
  choice: Lasaru
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tí ó wọ́pọ̀, tí ó sì ṣeé kà ní Yorùbá.
- source_word: ἀποκτείνωσιν
  choice: pa
  rationale: “Pa” ni ìtumọ̀ tààrà, àdánidá fún pípa ẹ̀mí ẹni; kò fi èrò ìdájọ́ òfin tàbí àlàyé ìwà ọ̀daràn tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ète àwọn olórí àlùfáà sí Lasaru
  choice: Sọ ọ́ ní tààrà pé wọ́n pinnu láti pa Lasaru, láìfi ìdí mìíràn tàbí èrò ìdìtẹ̀ tí ẹsẹ náà kò sọ kún un.
  alternative: Lílo ọ̀rọ̀ alágbára bí “wọ́n dìtẹ̀” tàbí “wọ́n gbìmọ̀ pọ̀” láti pa á.
  rationale: Ẹsẹ náà fi ìpinnu tí a mọ̀ọ́mọ̀ ṣe hàn, ṣùgbọ́n kò lo ọ̀rọ̀ pàtó fún ìdìtẹ̀. Ìtumọ̀ yìí pa bí ète wọn ṣe burú mọ́ láìkọjá ohun tí orísun sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “àwọn olórí àlùfáà” fún ẹgbẹ́ aṣáájú àwọn àlùfáà, àti “pinnu” gẹ́gẹ́ bí ọ̀rọ̀ kedere fún ìgbìmọ̀ tí ó yọrí sí ìpinnu.
