revisions:
- from: Nítorí náà, àwọn olórí àlùfáà pinnu láti pa Lasaru pẹ̀lú,[a]
  to: Ṣùgbọ́n àwọn olórí àlùfáà pinnu láti pa Lasaru náà,[a]
  rationale: The revision avoids making the Greek connective explicitly causal and renders the additive καί with the more idiomatic and less ambiguous Yorùbá náà. The alternative footnote retains the viable ‘planned’ sense of ἐβουλεύσαντο while preserving the same intended action.
