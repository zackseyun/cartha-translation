revisions:
- from: “Baba, ṣe orúkọ rẹ lógo.” Nígbà náà ni ohùn kan láti ọ̀run wá pé, “Mo ti ṣe é lógo[a], èmi yóò sì tún ṣe é lógo.”
  to: “Baba, ṣe orúkọ rẹ lógo.” Nígbà náà, ohùn kan wá láti ọ̀run, ó ní, “Mo ti ṣe é lógo[a], mo sì máa tún ṣe é lógo.”
  rationale: Àtúnṣe náà mú ìṣàn ọ̀rọ̀ Yorùbá rọrùn, ó sì yọ ìtẹnumọ́ “èmi” tí kò hàn nínú Gíríìkì kúrò. Kò yí ìtumọ̀, ohun tí “é” ń tọ́ka sí, tàbí ìjápọ̀ ọ̀rọ̀ nípa ògo padà. Àmì ẹsẹ̀ náà ṣì dúró níbi ìtumọ̀ aorist àkọ́kọ́ ti yàtọ̀ sí “mo ti ṣe.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:27:14Z'
