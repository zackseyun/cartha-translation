  verdict: revise
  source_fidelity: Ìtumọ̀ náà fi πάτερ, àṣẹ δόξασον, “orúkọ rẹ,” àti ìdáhùn ohùn láti ọ̀run hàn ní ìbámu pẹ̀lú Gíríìkì. “É” ń tọ́ka sí orúkọ náà gẹ́gẹ́ bí a ti lè gbà láti inú àyíká. Àfikún “èmi” nínú ìdáhùn kejì, bí ó tilẹ̀ jẹ́ pé kì í yí ìtumọ̀ pàtó padà, lè fi ìtẹnumọ́ kan kún un tí Gíríìkì kò ní.
  naturalness: “Ohùn kan láti ọ̀run wá pé” ṣeé gbọ́, ṣùgbọ́n ìkọ́lé “ohùn kan wá láti ọ̀run, ó ní,” rọrùn, ó sì wọ́pọ̀ sí i nínú Yorùbá òde òní. Lílò “mo” dípò “èmi yóò” nínú apá kejì tún dáa sí i láì mú ìtẹnumọ́ tí kò pọndandan wá.
  terminology: “Baba,” “orúkọ,” “ògo,” àti “ọ̀run” jẹ́ ọ̀rọ̀ tó bójú mu fún ìforúkọsílẹ̀ Bíbélì Yorùbá. “Ṣe … lógo” pa èrò ògo/ìsọ ògo nínú Jòhánù mọ́. Àlàyé ẹsẹ̀ náà dá ìyàtọ̀ láàárín aorist Gíríìkì àti ìtumọ̀ Yorùbá “mo ti ṣe” hàn dáadáa.
