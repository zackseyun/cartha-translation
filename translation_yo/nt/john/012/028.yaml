id: JHN.12.28
reference: John 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: yo
  text: “Baba, ṣe orúkọ rẹ lógo.” Nígbà náà, ohùn kan wá láti ọ̀run, ó ní, “Mo ti ṣe é lógo[a], mo sì máa tún ṣe é lógo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìrísí ọ̀rọ̀ Gíríìkì pẹ̀lú ẹsẹ̀: “Mo ṣe é lógo, mo sì máa tún ṣe é lógo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Baba
  rationale: Ọ̀rọ̀ ìpè tààrà sí Ọlọ́run ni; “Baba” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ ní Yorùbá, kò sì fi ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní “mi” kún ohun tí Gíríìkì kò sọ.
- source_word: δόξασόν
  choice: ṣe ... lógo
  rationale: Ó pa èrò δοξάζω mọ́ gẹ́gẹ́ bí fífi ògo hàn tàbí mímú kí ògo ẹni farahàn; ó lágbára ju “bọ̀wọ̀ fún” lọ, ó sì bá èdè Yorùbá òde òní mu.
- source_word: σου τὸ ὄνομα
  choice: orúkọ rẹ
  rationale: Ó jẹ́ ìtumọ̀ àdánidá tí ó tún pa ìtumọ̀ Bíbélì mọ́, níbi tí “orúkọ” ti dúró fún ẹni tí Ọlọ́run jẹ́ àti bí ó ti fi ara rẹ̀ hàn.
- source_word: ἦλθεν οὖν
  choice: Nígbà náà ni ... wá
  rationale: “Nígbà náà” fi ìtẹ̀síwájú ìtàn hàn, “ni ... wá” sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún dídé ohùn náà.
- source_word: φωνὴ
  choice: ohùn kan
  rationale: Ọ̀rọ̀ tààrà tí ó tẹ̀ lé e fi hàn pé ohùn tí ń sọ̀rọ̀ ni, kì í ṣe ariwo lásán.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó tọ́ka sí ibi tí ohùn náà ti wá àti ìpilẹ̀ rẹ̀ lọ́dọ̀ Ọlọ́run, láì sọ ọ́ di ojú-ọ̀run lásán.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Mo ti ṣe é lógo, èmi yóò sì tún ṣe é lógo
  rationale: “Mo ti ṣe é” sọ ìṣe tí ó ti parí ṣùgbọ́n tí ó ní ìbáṣepọ̀ pẹ̀lú àsìkò yìí ní Yorùbá àdánidá; “tún ... ṣe” so πάλιν mọ́ ọ̀rọ̀ ọjọ́ iwájú. “É” tọ́ka padà sí “orúkọ” gẹ́gẹ́ bí àyíká ṣe fi hàn.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ tí a kò sọ nínú ìdáhùn Ọlọ́run ń tọ́ka sí
  choice: Lo “é” láti tọ́ka padà sí “orúkọ rẹ”
  alternative: 'Fi ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí sílẹ̀ láì sọ ọ́: “Mo ti ṣe lógo, èmi yóò sì tún ṣe lógo.”'
  rationale: Gíríìkì lè fi ohun náà sílẹ̀ nítorí àyíká ti mú un ṣe kedere, ṣùgbọ́n Yorùbá àdánidá nílò arọ́pò-orúkọ níbí; “é” kò fi ohun tuntun kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ δοξάζω nínú ọ̀rọ̀ ẹ̀kọ́ nípa ògo nínú Jòhánù
  choice: ṣe ... lógo
  alternative: bọ̀wọ̀ fún; fi ògo hàn sí
  rationale: Yíyan “ṣe ... lógo” pa àsopọ̀ ọ̀rọ̀ nípa ògo Baba àti Ọmọ mọ́, kò sì dín ọ̀rọ̀ náà kù sí fífi ọ̀wọ̀ hàn lásán.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ṣe ... lógo” láti pa àkójọpọ̀ ọ̀rọ̀ nípa ògo nínú Jòhánù mọ́, a sì fi àmì ohùn sí ibi tí ó yẹ.
