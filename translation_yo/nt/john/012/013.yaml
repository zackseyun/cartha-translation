id: JHN.12.13
reference: John 12:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: yo
  text: Wọ́n mú àwọn ẹ̀ka igi ọ̀pẹ, wọ́n sì jáde lọ pàdé rẹ̀. Wọ́n ń ké pé, “Hòsánà![a] Ìbùkún ni fún ẹni tí ń bọ̀ ní orúkọ Olúwa,[b] àní Ọba Ísírẹ́lì!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hòsánà” jẹ́ igbe tí ó wá láti èdè Hébérù, tí ìtumọ̀ rẹ̀ jẹ́ “gbà wá là nísinsìnyí” tàbí “jọ̀wọ́, gbà wá là.” Ní àkókò yìí, ó tún ti di igbe ìyìn.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí ń tọ́ka sí Sáàmù 118:26.
    reason: cross_reference
  - marker: c
    text: 'Ó tún lè jẹ́: “àti Ọba Ísírẹ́lì.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: àwọn ẹ̀ka igi ọ̀pẹ
  rationale: Èyí sọ ‘àwọn ẹ̀ka’ àti irú igi náà, ‘igi ọ̀pẹ,’ ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: wọ́n sì jáde lọ pàdé rẹ̀
  rationale: Ó túmọ̀ gbólóhùn Gíríìkì náà ní tààrà láì fi ìtumọ̀ àfikún bí ‘láti kí i káàbọ̀’ sí i.
- source_word: ἐκραύγαζον
  choice: Wọ́n ń ké pé
  rationale: Àmì ìṣe aláìparí nínú èdè Gíríìkì ń fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; ‘ń ké’ pa èyí mọ́.
- source_word: Ὡσαννά
  choice: Hósánà
  rationale: A pa igbe ìjọsìn tí ó ti wá láti èdè Hébérù mọ́ nípa kíkọ ọ́ bí ó ṣe ń dún, nígbà tí àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Alábùkún-fún ni ẹni tí ń bọ̀
  rationale: Èyí jẹ́ Yorùbá òde òní tí ó bá ẹsẹ̀-orin náà mu, ó sì pa ẹni tí ọ̀rọ̀ náà ń tọ́ka sí àti ìṣe ‘tí ń bọ̀’ mọ́.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Èyí pa àpólà Bíbélì náà mọ́ ní ọ̀nà tí ó ṣe déédé, ó sì ṣe àfihàn κυρίου gẹ́gẹ́ bí ‘Olúwa.’
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: àní Ọba Ísírẹ́lì
  rationale: ‘Àní’ mú kí orúkọ oyè ọba náà jẹ́ àfikún ìtẹnumọ́ sí ẹni tí ń bọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ‘àti’ mọ́ gẹ́gẹ́ bí ìtumọ̀ míì tó ṣeé ṣe fún καί.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ tí ó ń tọ́ka sí Sáàmù 118:26
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì ní κυρίου; ‘Olúwa’ ni ìtumọ̀ rẹ̀ ní tààrà. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí ibi tí orúkọ Ọlọ́run wà nínú Hébérù, a kò yí ìrísí Gíríìkì padà sí lẹ́tà ńlá gbogbo.
- issue: Agbára ọba àti Mèsáyà nínú igbe àwọn ènìyàn
  choice: Pa orúkọ oyè ‘Ọba Ísírẹ́lì’ mọ́ láì rọ̀ ọ́ tàbí ṣàlàyé rẹ̀ síwájú
  alternative: ọba Ísírẹ́lì; Ọba àwọn ọmọ Ísírẹ́lì
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ pe Jésù ní Ọba Ísírẹ́lì. Ìtumọ̀ náà pa oyè yìí mọ́ láì fi ẹ̀kọ́ ìsìn àfikún sínú ọ̀rọ̀.
- issue: Ìbáṣepọ̀ καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ pẹ̀lú ẹni tí ń bọ̀
  choice: àní Ọba Ísírẹ́lì
  alternative: àti Ọba Ísírẹ́lì
  rationale: ‘Àní’ ka oyè náà sí àfikún ìdánimọ̀ àti ìtẹnumọ́, ṣùgbọ́n καί tún lè jẹ́ ‘àti’; a pa àṣàyàn kejì náà mọ́ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó rọrùn fún òǹkàwé lásán, ó sì pa ìgbóná igbe àwọn ènìyàn àti ìtumọ̀ oyè ọba mọ́.
