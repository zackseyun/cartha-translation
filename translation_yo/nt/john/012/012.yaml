  source_fidelity: Àfikún “nígbà tí wọ́n gbọ́” ń fi agbára àkókò ti participle ἀκούσαντες hàn ní kedere. “Ń bọ̀” yẹ fún ἔρχεται, ìṣe àsìkò ìsinsìnyí nínú ìtàn. Kọ́mà ìparí ni a pa mọ́, nítorí pé gbolohun náà ń tẹ̀ síwájú sí ẹsẹ̀ 13.
  naturalness: “Àjọyọ̀” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó dára síi fún ἑορτή nínú àyíká àjọ ìsìn ju “àjọ̀dún,” èyí tí ó lè túmọ̀ sí ìpàdé ọdúnọdún. Fífì “nígbà tí wọ́n gbọ́” kún un tún mú kí ìbáṣepọ̀ gbolohun náà rọrùn, ó sì yà ìṣe àwọn ènìyàn inú ogunlọ́gọ̀ náà sọ́tọ̀ ní ti ẹ̀dá.
