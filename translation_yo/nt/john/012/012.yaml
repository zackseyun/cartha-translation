  rationale: A so participle náà mọ́ àwọn ènìyàn inú ìjọ náà ní ọ̀nà Yorùbá àdánidá, láìfi ìtumọ̀ àkókò tí kò pọndandan kún un.
- source_word: ὅτι ἔρχεται
  choice: pé Jésù ń bọ̀
  rationale: “Ń bọ̀” pa àwòrán Greek historical present mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tó ń lọ lọ́wọ́ nínú ìtàn.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà gẹ́gẹ́ bí ìlò Yorùbá tí ó fìdí múlẹ̀.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerusalẹmu
  rationale: “Sí” fi ìrìn sí ibi kan hàn ní kedere, “Jerusalẹmu” sì ni àkọsílẹ̀ orúkọ tí ó wọ́pọ̀ ní Yorùbá.
