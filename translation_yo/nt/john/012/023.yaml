  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fara mọ́ Gíríìkì dáadáa nípa ‘dá wọn lóhùn,’ perfect ‘ti dé,’ ‘wákàtí,’ àti oyè ‘Ọmọ Ènìyàn.’ Ṣùgbọ́n ‘kí a yin’ nílò ‘lè’ kí ìbáṣepọ̀ ète/tí àkókò náà dé fún un (ἵνα) lè hàn kedere, kí Yorùbá náà sì rọrùn.
