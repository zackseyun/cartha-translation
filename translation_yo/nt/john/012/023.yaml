id: JHN.12.23
reference: John 12:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Wákàtí náà ti dé[a] kí a lè yin Ọmọ Ènìyàn[b] lógo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àkókò náà ti dé.” Gíríìkì sọ ní tààrà pé “wákàtí”; Jòhánù máa ń lo ọ̀rọ̀ yìí fún àsìkò tí a yàn fún ìjìyà àti ògo Jésù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹni Ènìyàn.” Oyè Gíríìkì yìí ní ìṣọ̀kan pẹ̀lú Dáníẹ́lì 7; a pa “Ọmọ Ènìyàn” mọ́ nítorí agbára ẹ̀kọ́ àti ìtọ́kasí rẹ̀ sí apá Bíbélì yẹn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ó dá wọn lóhùn, ó sì bẹ̀rẹ̀ ọ̀rọ̀ tààrà; kò pọndandan láti tún λέγων ṣe lọ́tọ̀ gẹ́gẹ́ bí ‘ó ń wí pé.’
- source_word: Ἐλήλυθεν
  choice: ti dé
  rationale: ‘Ti dé’ fi ìṣe tó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì wà nísinsìnyí hàn, ó sì bá perfect Gíríìkì mu.
- source_word: ἡ ὥρα
  choice: Wákàtí náà
  rationale: ‘Wákàtí’ pa àwòrán ọ̀rọ̀ pàtàkì tí Jòhánù máa ń lò mọ́, dípò ọ̀rọ̀ gbogbogbò bí ‘àkókò.’
- source_word: ἵνα δοξασθῇ
  choice: kí a ... yin ... lógo
  rationale: Ọ̀nà àìdárúkọ olùṣe yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ohùn àfarawà passive náà mọ́ láìsọ ẹni tó ń fi ògo fún un ní pàtó.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni oyè ìbílẹ̀ tó pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 àti lílò rẹ̀ nínú Jòhánù mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa agbára oyè Kristẹni náà àti ìtọ́kasí rẹ̀ sí Dáníẹ́lì 7 mọ́; ‘Ẹni Ènìyàn’ lè mú un dà bí ìtọ́kasí gbogbogbò sí ènìyàn lásán.
- issue: Ìtumọ̀ Ἐλήλυθεν ἡ ὥρα
  choice: Wákàtí náà ti dé
  alternative: Àkókò náà ti dé
  rationale: ‘Wákàtí’ pa àkòrí pàtàkì Jòhánù mọ́ nípa àsìkò tí a yàn fún ìjìyà àti ògo Jésù, ‘ti dé’ sì fi ipò tó wà lẹ́yìn dídé náà hàn.
- issue: Ẹni tó ń ṣe ìṣe nínú δοξασθῇ
  choice: kí a yin Ọmọ Ènìyàn lógo
  alternative: fún Ọmọ Ènìyàn láti gba ògo
  rationale: Gíríìkì fi ìṣe náà sí ohùn àfarawà láìdárúkọ olùṣe. Yorùbá ‘a’ aláìdárúkọ pa àìsọtẹ́lẹ̀ yẹn mọ́, nígbà tí ‘gba ògo’ lè tẹnu mọ́ Ọmọ Ènìyàn gẹ́gẹ́ bí olùgbà ju bí ọrọ̀-orúkọ náà ṣe sọ lọ.
translation_notes:
  register: A lo Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ kedere fún òǹkàwé lásán, ó sì pa àwọn ọ̀rọ̀ pàtàkì ti Jòhánù—‘wákàtí,’ ‘ògo,’ àti ‘Ọmọ Ènìyàn’—mọ́.
