  terminology: ‘Wákàtí,’ ‘Ọmọ Ènìyàn,’ àti ‘yin ... lógo’ yẹ, wọ́n sì pa àkòrí Jòhánù àti oyè tí ó ní ìtọ́kasí sí Dáníẹ́lì mọ́. A rọ́pò ‘Oye Gíríìkì’ pẹ̀lú ‘Oyè Gíríìkì yìí’ nínú àlàyé ẹsẹ̀, nítorí pé ó ṣe kedere pé àkọlé náà ni a ń sọ̀rọ̀ rẹ̀.
