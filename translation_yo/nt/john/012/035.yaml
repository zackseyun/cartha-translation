id: JHN.12.35
reference: John 12:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ fún wọn pé, “Ìmọ́lẹ̀ ṣì wà láàárín yín[a] fún ìgbà díẹ̀. Ẹ máa rìn nígbà tí ẹ ní ìmọ́lẹ̀, kí òkùnkùn má bàa dé bá yín. Ẹni tí ó bá ń rìn nínú òkùnkùn kò mọ ibi tí òun ń lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “nínú yín” tàbí “pẹ̀lú yín.” Gbólóhùn Gíríìkì náà lè ní ju ìtumọ̀ kan lọ, bí ó tilẹ̀ jẹ́ pé “láàárín yín” bá àyíká ọ̀rọ̀ yìí mu jù, níbi tí Jésù ti ń sọ nípa wíwà rẹ̀ ní gbangba ní àárín wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ Jésù pọ̀ mọ́ ìjíròrò tó ṣáájú, láìfi agbára ìtumọ̀ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ṣì wà ... fún ìgbà díẹ̀
  rationale: Ó mú èrò ἔτι, ‘ṣì,’ àti àkókò kúkúrú μικρὸν χρόνον jáde ní Yorùbá àdánidá.
- source_word: τὸ φῶς
  choice: Ìmọ́lẹ̀
  rationale: A pa àwòrán ìmọ́lẹ̀ mọ́ ní tààràtà nítorí ipa rẹ̀ nínú Ìhìn Rere Jòhánù, láìṣàlàyé rẹ̀ sínú ẹsẹ náà.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Nínú àyíká yìí, ó tọ́ka sí wíwà Jésù ní àárín àwọn ènìyàn. Àmọ́ gbólóhùn Gíríìkì náà lè tún túmọ̀ sí ‘nínú yín’ tàbí ‘pẹ̀lú yín,’ a sì pa ìyẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: περιπατεῖτε
  choice: Ẹ máa rìn
  rationale: Ó pa àwòrán ‘rírìn’ mọ́, èyí tí ó lè tọ́ka sí ìrìn gangan àti ọ̀nà ìgbésí ayé.
- source_word: ὡς
  choice: nígbà tí
  rationale: 'A lóye rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àkókò níbí: kí wọ́n rìn nígbà tí wọ́n ṣì ní ìmọ́lẹ̀.'
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète àti ìkìlọ̀ tí gbólóhùn Gíríìkì náà ní.
- source_word: σκοτία
  choice: òkùnkùn
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó sì pa ìyàtọ̀ pàtàkì láàárín ìmọ́lẹ̀ àti òkùnkùn mọ́.
- source_word: καταλάβῃ
  choice: dé bá
  rationale: ‘Dé bá’ fi hàn pé òkùnkùn lè bá ẹni náà lójijì tàbí ká a mọ́lẹ̀, ó sì bá àwòrán ìrìn nínú ẹsẹ náà mu.
- source_word: ὁ περιπατῶν
  choice: Ẹni tí ó bá ń rìn
  rationale: Ó mú olùṣe aláìdárúkọ tó dúró fún ẹnikẹ́ni jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: Ó pa àwòrán pé ẹni náà ń rìn lábẹ́ agbègbè tàbí ipò òkùnkùn mọ́.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: kò mọ ibi tí òun ń lọ
  rationale: Ó jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ìtọ́sọ́nà àti àìmọ̀ ibi tí ẹni náà ń lọ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐν ὑμῖν ní ìbáṣepọ̀ pẹ̀lú ‘ìmọ́lẹ̀’
  choice: láàárín yín
  alternative: nínú yín; pẹ̀lú yín
  rationale: Àyíká ìtàn náà fi hàn pé Jésù ń sọ nípa àkókò díẹ̀ tí òun, gẹ́gẹ́ bí ìmọ́lẹ̀, ṣì máa wà ní gbangba ní àárín wọn. Síbẹ̀, ἐν lè ní ìtumọ̀ inú tàbí ìbáṣepọ̀, nítorí náà a kò pa àwọn ìtumọ̀ míì náà rẹ́; a fi wọ́n sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì pa àwòrán ìmọ́lẹ̀, òkùnkùn, àti rírìn mọ́.
