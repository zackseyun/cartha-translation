language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: yo
  text: nítorí pé ọ̀pọ̀ lára àwọn Júù[a] ń lọ kúrò[b] nítorí rẹ̀, wọ́n sì ń gba Jésù gbọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “ọ̀pọ̀ lára àwọn ará Jùdíà.” Nínú ìhìn rere Jòhánù, “àwọn Júù” lè tọ́ka sí àwọn ará Jùdíà tàbí àwọn aṣáájú Júù ní àwọn àyíká ọ̀rọ̀ kan.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ń kúrò” tàbí “ń fi sílẹ̀.” Ọ̀rọ̀ Gíríìkì fi ìkúrò tó ń bá a lọ hàn, ṣùgbọ́n kò sọ ohun tí wọ́n ń fi sílẹ̀ ní tààrà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wọ́n sì ń gbẹ́kẹ̀ lé Jésù” tàbí “wọ́n sì ń ní ìgbàgbọ́ nínú Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń sọ ìdí tí àwọn olórí àlùfáà fi fẹ́ pa Lásárù ní ẹsẹ ìṣáájú; ‘nítorí pé’ jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ ìdí hàn ní Yorùbá.
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: ọ̀pọ̀ lára àwọn Júù
  rationale: Èyí fi ìbáṣepọ̀ apá-sí-odidi inú Gíríìkì hàn, ó sì mú kedere pé ẹsẹ náà ń sọ̀rọ̀ nípa ọ̀pọ̀ ènìyàn lára ẹgbẹ́ náà, kì í ṣe gbogbo Júù.
- source_word: δι’ αὐτὸν
  choice: nítorí rẹ̀
  rationale: 'διά pẹ̀lú ọ̀rọ̀ ní accusative níbí ń tọ́ka sí okùnfà: Lásárù ni ohun tó mú kí ọ̀pọ̀ ènìyàn dáhùn lọ́nà yìí. Ọ̀rọ̀ arọ́pò-orúkọ náà tún pa ìtọ́kasí akọ mọ́.'
- source_word: ὑπῆγον
  choice: ń lọ kúrò
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn. ‘Ń lọ kúrò’ pa àwòrán ìkúrò mọ́ láì fi ohun tí wọ́n ń fi sílẹ̀ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: wọ́n sì ń gba Jésù gbọ́
  rationale: ‘Gba ẹnì kan gbọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìgbàgbọ́ tí a darí sí ẹni náà; ‘ń’ sì fi ìṣe tó ń bá a lọ hàn gẹ́gẹ́ bí imperfect Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú ìhìn rere Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn aṣáájú Júù
  rationale: Jòhánù máa ń lo ọ̀rọ̀ náà fún àwọn ẹgbẹ́ tó yàtọ̀ síra ní ibámu pẹ̀lú àyíká ọ̀rọ̀. Níhìn-ín, ‘ọ̀pọ̀ lára’ fi hàn pé apá kan nínú ẹgbẹ́ tó tóbi ni a ń sọ, kì í ṣe ìdálẹ́bi gbogbo Júù. Ìtumọ̀ àgbègbè ‘àwọn ará Jùdíà’ wà nínú àlàyé ìsàlẹ̀.
- issue: Agbára ọ̀rọ̀ πιστεύω εἰς
  choice: ń gba Jésù gbọ́
  alternative: ń gbẹ́kẹ̀ lé Jésù; ń fi ìgbàgbọ́ wọn sínú Jésù
  rationale: Ẹsẹ náà sọ pé ìgbàgbọ́ wọn darí sí Jésù, ṣùgbọ́n kò sọ gbogbo àbájáde ẹ̀kọ́ ìgbàgbọ́ náà. Nítorí náà, a kò túmọ̀ rẹ̀ sí ‘wọ́n di ọmọ-ẹ̀yìn’ tàbí ‘wọ́n rí ìgbàlà.’
- issue: Ohun tí ὑπῆγον túmọ̀ sí pé wọ́n ń fi sílẹ̀
  choice: A fi ohun tí wọ́n ń fi sílẹ̀ sílẹ̀ láì sọ ní pàtó
  alternative: wọ́n ń fi àwọn aṣáájú Júù sílẹ̀; wọ́n ń kúrò ní ipò àwọn alátakò Jésù
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí pé wọ́n ń yà kúrò lábẹ́ ipa àwọn alátakò Jésù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò dárúkọ ohun tí wọ́n fi sílẹ̀. ‘Ń lọ kúrò’ pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìlànà ọ̀rọ̀ tó bójú mu, tó sì yẹ fún kíkà ní gbangba. A lo ‘ọ̀pọ̀ lára’ láti jẹ́ kí ìtumọ̀ partitive ṣe kedere, a sì lo ‘ń’ lẹ́ẹ̀mejì láti pa ìṣe imperfect méjèèjì mọ́. Gbólóhùn náà bẹ̀rẹ̀ pẹ̀lú ‘nítorí pé’ nítorí ó ń tẹ̀ síwájú láti inú ẹsẹ 10.
