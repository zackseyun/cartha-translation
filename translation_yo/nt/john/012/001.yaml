source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: yo
  text: Nítorí náà, ní ọjọ́ mẹ́fà ṣáájú Àjọ Ìrékọjá, Jésù wá sí Bẹ́tánì, níbi tí Lásárù wà, ẹni tí Jésù ti jí dìde kúrò nínú òkú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ jù bẹ́ẹ̀ lọ, “kúrò láàárín àwọn òkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìtàn mọ́ pẹ̀lú ohun tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún àsopọ̀ náà.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: ọjọ́ mẹ́fà ṣáájú Àjọ Ìrékọjá
  rationale: Èyí sọ ìtumọ̀ àsìkò Gíríìkì náà ní Yorùbá àdánidá, ó sì fi hàn pé Àjọ Ìrékọjá àwọn Júù ni a ń tọ́ka sí.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: wá sí Bẹ́tánì
  rationale: “Wá sí” bá ìrìn ìtàn mu láìfi àlàyé míì kún un; orúkọ ibìkan náà ni a kọ ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: ὅπου ἦν Λάζαρος
  choice: níbi tí Lásárù wà
  rationale: Ó pa gbólóhùn ipò Gíríìkì mọ́ láìsọ pé ibẹ̀ ni Lásárù ń gbé tàbí pé ó ń dúró síbẹ̀, nítorí àwọn ìtumọ̀ wọ̀nyẹn kò ṣe kedere nínú orísun.
- source_word: ἤγειρεν
  choice: ti jí dìde
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí jí ẹnì kan dìde kúrò nínú ikú; “ti” fi hàn pé ó ti ṣẹlẹ̀ ṣáájú wíwá Jésù sí Bẹ́tánì.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú òkú
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀ fún jíjí dìde, ó sì pa èrò orísun mọ́ pé a mú un jáde kúrò láàárín àwọn tí ó kú.
theological_decisions:
- issue: Ọ̀rọ̀ nípa jíjí Lásárù dìde
  choice: ẹni tí Jésù ti jí dìde kúrò nínú òkú
  alternative: ẹni tí ó ti jí dìde kúrò nínú òkú
  rationale: Orísun Gíríìkì tún orúkọ Jésù sọ ní òpin gbólóhùn náà. Títún “Jésù” sọ pa ìtẹnumọ́ náà mọ́, ó sì fi ẹni tó jí Lásárù dìde hàn kedere láìrọ́pò rẹ̀ pẹ̀lú arọ́pò-orúkọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A fi àmì àlàyé [a] sí lẹ́yìn “òkú,” ibi tí àlàyé ọ̀rọ̀ ἐκ νεκρῶν ti jẹ mọ́, dípò lẹ́yìn “Àjọ Ìrékọjá.”
