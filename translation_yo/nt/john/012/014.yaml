id: JHN.12.14
reference: John 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: yo
  text: 'Jésù sì rí ọmọ kẹ́tẹ́kẹ́tẹ́ kan[a], ó sì jókòó lórí rẹ̀, gẹ́gẹ́ bí a ti kọ ọ́ pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kẹ́tẹ́kẹ́tẹ́ kékeré kan.” Ọ̀rọ̀ Gíríìkì ὀνάριον ń tọ́ka sí kẹ́tẹ́kẹ́tẹ́, ní ọ̀pọ̀ ìgbà èyí tí ó ṣì kéré.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: sì rí
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist yìí fi ìṣe tí ó ṣáájú jíjókòó hàn. Ìtẹ̀lé ọ̀rọ̀-ìṣe pẹ̀lú “sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle.
- source_word: ὀνάριον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́ kan
  rationale: ὀνάριον jẹ́ ọ̀rọ̀ tí a lè lò fún kẹ́tẹ́kẹ́tẹ́ kékeré tàbí ọ̀dọ́. “Ọmọ kẹ́tẹ́kẹ́tẹ́” ṣe kedere, ó sì bá ìtọ́kasí Sekaráyà mu láìfi àlàyé tí ọ̀rọ̀ náà kò fi dandan mú wọ inú ẹsẹ náà.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: ó sì jókòó lórí rẹ̀
  rationale: Èyí pa ìtumọ̀ tààrà náà mọ́, ó sì jẹ́ Yorùbá àdánidá ju ọ̀rọ̀ tí yóò túmọ̀ rẹ̀ ní pàtó sí gígun ẹranko lọ.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìfihàn àyọlò Ìwé Mímọ́, ó sì pa agbára ìfiwéra καθώς mọ́.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ ẹni ni; Yorùbá kò nílò àfihàn kan tí yóò dúró fún áríkìlì Gíríìkì níwájú rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ìṣe Jésù pẹ̀lú àyọlò Ìwé Mímọ́
  choice: A sọ ìṣe Jésù, lẹ́yìn náà a fi “gẹ́gẹ́ bí a ti kọ ọ́” so ó mọ́ ohun tí Ìwé Mímọ́ sọ.
  alternative: Ṣíṣe ìtumọ̀ náà ní ọ̀nà tí yóò sọ ní tààrà pé Jésù mọ̀ọ́mọ̀ ṣe iṣẹ́ àmì kan láti mú àsọtẹ́lẹ̀ ṣẹ.
  rationale: Ẹsẹ náà fi ìbámu pẹ̀lú Ìwé Mímọ́ hàn, ṣùgbọ́n kò sọ ìdí inú Jésù ní tààrà. Ìtumọ̀ náà kò yanjú ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ láìsọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Lílo “sì” lẹ́ẹ̀mejì ń jẹ́ kí ìtẹ̀lé ìṣe náà ṣàn bí Yorùbá àdánidá.
