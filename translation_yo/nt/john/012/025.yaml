id: JHN.12.25
reference: John 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: yo
  text: Ẹni tí ó fẹ́ràn ìwàláàyè rẹ̀ ń pàdánù rẹ̀,[a] ẹni tí ó sì kórìíra ìwàláàyè rẹ̀ nínú ayé yìí yóò pa á mọ́ fún ìyè àìnípẹ̀kun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí rẹ̀” tàbí “ara ẹni.” Ọ̀rọ̀ Gíríìkì ψυχή lè túmọ̀ sí ìwàláàyè, ẹ̀mí, tàbí ara ẹni, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Kórìíra ìwàláàyè rẹ̀” jẹ́ ọ̀rọ̀ àfiwé tó mọ̀ọ́mọ̀ múni ronú, nípa kí ènìyàn kọ ìfẹ́ àṣejù sí ìwàláàyè rẹ̀ nínú ètò ayé ìsinsìnyí; fi wé Lúùkù 14:26. Kò túmọ̀ sí pé kí ènìyàn kórìíra ara rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: Ẹni tí ó bá nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ iṣe alábápín pẹ̀lú atọ́ka náà ń tọ́ka sí ẹnikẹ́ni ní gbogbogbòò; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ẹ̀mí ara rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ψυχή túmọ̀ sí ìwàláàyè tàbí gbogbo ẹni náà, kì í ṣe dandan apá àìrí ènìyàn. ‘Ẹ̀mí ara rẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó bá pípa ẹ̀mí mọ́ tàbí pípadánù rẹ̀ mu; àlàyé ìsàlẹ̀ fi ‘ìwàláàyè’ àti ‘ara ẹni’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: ἀπολλύει
  choice: yóò pàdánù
  rationale: Ó bá ohun tí ó ṣẹlẹ̀ sí ‘ẹ̀mí’ mu, ó sì ṣe ìtakora kedere pẹ̀lú ‘yóò pa á mọ́.’ Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí, ọ̀rọ̀ ọgbọ́n Yorùbá yìí lo ‘yóò’ lọ́nà àbájáde gbogbogbòò.
- source_word: ὁ μισῶν
  choice: ẹni tí ó bá kórìíra
  rationale: A pa agbára μισέω mọ́ dípò fífọ ọ́ sí ‘fẹ́ràn díẹ̀.’ Èyí dá ìtakora tí Jésù mọ̀ọ́mọ̀ lò mọ́.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: nínú ayé yìí
  rationale: Ìtumọ̀ taara, tí ó sì ṣe ààlà ìkórìíra ẹ̀mí sí ìdè tí ènìyàn ní mọ́ ìwàláàyè nínú ètò ayé ìsinsìnyí.
- source_word: φυλάξει
  choice: yóò pa á mọ́
  rationale: Ó fi ìtọ́jú tàbí pípa ohun kan mọ́ hàn, ó sì tako ‘pàdánù’ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: εἰς ζωὴν αἰώνιον
  choice: fún ìyè àìnípẹ̀kun
  rationale: ‘Fún’ fi ibi tí pípa ẹ̀mí náà mọ́ ń forí lé tàbí àbájáde rẹ̀ hàn; ‘ìyè àìnípẹ̀kun’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún ζωὴ αἰώνιος.
theological_decisions:
- issue: Ìtumọ̀ ‘kórìíra ẹ̀mí ara rẹ̀’
  choice: A pa ọ̀rọ̀ líle náà mọ́ gẹ́gẹ́ bí ìpè láti kọ ìfẹ́ àṣejù sí pípa ara ẹni mọ́ nínú ayé yìí.
  alternative: fẹ́ràn ẹ̀mí ara rẹ̀ díẹ̀; má ṣe ka ẹ̀mí ara rẹ̀ sí púpọ̀
  rationale: Gíríìkì lo μισέω (‘kórìíra’), ó sì yẹ kí ìtumọ̀ pa àdììtú ọ̀rọ̀ náà mọ́. Kì í pàṣẹ ìkórìíra ara ẹni; gbólóhùn ‘nínú ayé yìí’ ló ń fi ìtumọ̀ rẹ̀ sí àyíká tó yẹ.
- issue: Ìtumọ̀ ψυχή
  choice: ẹ̀mí ara rẹ̀, pẹ̀lú àlàyé pé ó lè túmọ̀ sí ìwàláàyè tàbí ara ẹni
  alternative: ìwàláàyè ara rẹ̀; ara rẹ̀; ọkàn rẹ̀
  rationale: Àyíká náà ń sọ nípa ohun tí a lè pàdánù tàbí pa mọ́ de ìyè àìnípẹ̀kun. A kò fi ẹ̀kọ́ pé ara àti ẹ̀mí jẹ́ ohun méjì ọ̀tọ̀ sínú ẹsẹ náà láìjẹ́ pé ọ̀rọ̀ Gíríìkì béèrè rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀mí ara rẹ̀’ gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn kíkún. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ apá tí wọ́n ń ṣàlàyé.
