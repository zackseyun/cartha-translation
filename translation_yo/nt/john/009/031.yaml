  to: Àwa mọ̀ pé Ọlọ́run kì í fetí sí àwọn ẹlẹ́ṣẹ̀; ṣùgbọ́n bí ẹnikẹ́ni bá bẹ̀rù Ọlọ́run[a], tí ó sì ń ṣe ìfẹ́ rẹ̀, ó máa ń fetí sí irú ẹni bẹ́ẹ̀.
