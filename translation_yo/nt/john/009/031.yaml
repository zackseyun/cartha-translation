id: JHN.9.31
reference: John 9:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: yo
  text: Àwa mọ̀ pé Ọlọ́run kì í fetí sí àwọn ẹlẹ́ṣẹ̀; ṣùgbọ́n bí ẹnikẹ́ni bá bẹ̀rù Ọlọ́run[a], tí ó sì ń ṣe ìfẹ́ rẹ̀, ó máa ń fetí sí irú ẹni bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó jẹ́ olùjọsìn Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Àwa mọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ àsìkò ìsinsìnyí ní Gíríìkì Koiné; fífi “Àwa” hàn dá ìtẹnumọ́ ẹni púpọ̀ dúró.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹgbẹ́ àwọn ènìyàn tí ẹsẹ̀ ń ṣàpèjúwe.
- source_word: ἀκούει
  choice: fetí sí
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà kọjá gbígbọ́ ohùn lásán; ó túmọ̀ sí gbígbọ́ pẹ̀lú ojúrere tàbí fífèsì, láì fi ìtumọ̀ “dáhùn” kún un.
- source_word: θεοσεβὴς
  choice: bẹ̀rù Ọlọ́run
  rationale: Ó pa ìtumọ̀ ẹni tí ó bọ̀wọ̀ fún Ọlọ́run mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìbẹ̀rù ọlọ́wọ̀ àti ìfọkànsìn sí Ọlọ́run.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: ń ṣe ìfẹ́ rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá, tó sì sún mọ́ ọ̀rọ̀ Gíríìkì fún ṣíṣe ohun tí Ọlọ́run fẹ́.
- source_word: τούτου ἀκούει
  choice: Ọlọ́run a fetí sí irú ẹni bẹ́ẹ̀
  rationale: “Irú ẹni bẹ́ẹ̀” mú ìtọ́kasí ìtẹnumọ́ τούτου hàn, ṣíṣe orúkọ Ọlọ́run ní kedere sì yọ àìdánilójú arọ́pò-orúkọ kúrò láì yí ìtumọ̀ padà.
- source_word: ἀλλ’ ἐάν τις
  choice: ṣùgbọ́n bí ẹnikẹ́ni bá
  rationale: Ó pa ìyàtọ̀ àti ipò àdéhùn tí Gíríìkì gbé kalẹ̀ mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ààlà ọ̀rọ̀ náà pé “Ọlọ́run kì í fetí sí àwọn ẹlẹ́ṣẹ̀”
  choice: A túmọ̀ gbólóhùn náà bí olùsọ ṣe sọ ọ́, láì rọ̀ ọ́ tàbí sọ ọ́ di ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò ju àyíká rẹ̀ lọ.
  alternative: “Ọlọ́run kì í gbọ́ àdúrà àwọn ẹlẹ́ṣẹ̀” tàbí “Ọlọ́run kò tẹ́wọ́ gba àwọn ẹlẹ́ṣẹ̀.”
  rationale: Gíríìkì sọ pé Ọlọ́run kì í “fetí sí” àwọn ẹlẹ́ṣẹ̀. Ìtumọ̀ náà gbọ́dọ̀ pa agbára àti ìfòyemọ̀ ọ̀rọ̀ olùsọ mọ́ láì pinnu gbogbo ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tó lè jẹ mọ́ ọn.
- issue: Ìtumọ̀ θεοσεβής
  choice: bẹ̀rù Ọlọ́run
  alternative: olùjọsìn Ọlọ́run
  rationale: “Bẹ̀rù Ọlọ́run” pa ìtumọ̀ ìbọ̀wọ̀ oníjìnlẹ̀ mọ́, kò sì fi ọ̀rọ̀ náà mọ́ ìṣe ìjọsìn nìkan. A fi ìtumọ̀ míì sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo “fetí sí” láti fi ìgbọ́ ojúrere hàn, a sì lo “Ọlọ́run a fetí sí” gẹ́gẹ́ bí àṣà gbólóhùn ọjọ́ iwájú/ìṣe àṣà ní Yorùbá.
