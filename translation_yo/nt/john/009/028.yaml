source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: yo
  text: Wọ́n sì fi ọ̀rọ̀ ẹ̀gàn kàn án, wọ́n sì ní, “Ìwọ ni ọmọ-ẹ̀yìn ẹni yẹn[a], ṣùgbọ́n àwa jẹ́ ọmọ-ẹ̀yìn Mósè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ ni ọmọ-ẹ̀yìn rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ní “ẹni yẹn,” èyí tí ó lè ní ohùn ìjìnnà tàbí ẹ̀gàn níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: Wọ́n sì bú u
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n fi ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ burúkú kọ lu ẹni náà. “Bú u” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa bí ọ̀rọ̀ náà ṣe le koko mọ́.
- source_word: Σὺ μαθητὴς εἶ ἐκείνου
  choice: Ìwọ ni ọmọ-ẹ̀yìn ẹni yẹn
  rationale: “Ìwọ” ní ìbẹ̀rẹ̀ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́. “Ọmọ-ẹ̀yìn” fi ìfarajìn àti títẹ̀lé olùkọ́ hàn, “ẹni yẹn” sì pa ìjìnnà àti ẹ̀gàn tó ṣeé ṣe kí ἐκείνου ní nínú àyíká ọ̀tá yìí mọ́.
- source_word: ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: ṣùgbọ́n àwa jẹ́ ọmọ-ẹ̀yìn Mósè
  rationale: “Ṣùgbọ́n àwa” mú ìyàtọ̀ àti ìtẹnumọ́ δὲ àti ἡμεῖς jáde. Lílo “ọmọ-ẹ̀yìn” lẹ́ẹ̀kejì pa ìfiwéra inú gbólóhùn náà mọ́.
theological_decisions:
- issue: Ohùn ἐκείνου nígbà tí wọ́n ń tọ́ka sí Jésù
  choice: ẹni yẹn
  alternative: rẹ̀
  rationale: Ní àyíká tí wọ́n ti ń bú ọkùnrin náà, arọ́pò-orúkọ atọ́ka náà lè ní ohùn ìjìnnà tàbí ẹ̀gàn. “Ẹni yẹn” pa èyí mọ́ láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà; àmọ́ “rẹ̀” jẹ́ ìtumọ̀ dídán mọ́rán tó tún ṣeé ṣe.
- issue: Ìtumọ̀ μαθητής ní ẹ̀ẹ̀mejì
  choice: ọmọ-ẹ̀yìn
  alternative: olùtẹ̀lé tàbí akẹ́kọ̀ọ́
  rationale: “Ọmọ-ẹ̀yìn” bá ìbáṣepọ̀ olùkọ́ àti ẹni tó fi ara rẹ̀ mọ́ ọn mu ju “akẹ́kọ̀ọ́” lọ, ó sì pa ìtakora tó wà láàárín Jésù àti Mósè mọ́ láìyanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ọ̀rọ̀ náà jẹ́ ti ìtàn, ó ṣe kedere, ó sì ní iyì; “bú u” jẹ́ èdè ojoojúmọ́ tó tún lè gbé líle ἐλοιδόρησαν, nígbà tí “ẹni yẹn” ń pa ohùn ìkọ̀sílẹ̀ tó ṣeé ṣe mọ́.
