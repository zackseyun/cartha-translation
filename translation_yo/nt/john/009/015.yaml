  to: Nígbà náà, àwọn Farisí náà tún béèrè lọ́wọ́ rẹ̀ bí ojú rẹ̀ ṣe là.[a] Ó sì sọ fún wọn pé, “Ó fi ẹrẹ̀[b] sí ojú mi, mo sì fọ ojú mi, mo sì ríran.”
