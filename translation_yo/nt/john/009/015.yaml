id: JHN.9.15
reference: John 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: yo
  text: Nígbà náà, àwọn Farisí náà tún béèrè lọ́wọ́ rẹ̀ bí ojú rẹ̀ ṣe là.[a] Ó sì sọ fún wọn pé, “Ó fi ẹrẹ̀[b] sí ojú mi, mo sì fọ ojú mi, mo sì ríran.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ṣe ríran.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí bí ó ṣe ríran tàbí bí ó ṣe gba ìran.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “amọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Nítorí náà ... tún
  rationale: “Nítorí náà” so ẹsẹ̀ náà mọ́ ìtàn tó ṣáájú láìfi agbára ìparí ọgbọ́n kún οὖν; “tún” sì fi hàn pé wọ́n ń béèrè ohun kan náà lẹ́ẹ̀kan sí i.
- source_word: ἠρώτων
  choice: bi í léèrè
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà lè tọ́ka sí ìbéèrè tó ń lọ lọ́wọ́ tàbí tó ń tún wáyé; “tún” pẹ̀lú “bi í léèrè” mú èyí ṣe kedere ní Yorùbá àdánidá.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: àwọn Farisí náà
  rationale: “Náà” níbí mú ìtumọ̀ καί gẹ́gẹ́ bí ‘àwọn Farisí pẹ̀lú’ jáde lọ́nà tó rọrùn nínú ìtàn Yorùbá.
- source_word: πῶς ἀνέβλεψεν
  choice: bí ó ṣe bẹ̀rẹ̀ sí í ríran
  rationale: Nínú ọ̀rọ̀ ìwòsàn ẹni tí a bí ní afọ́jú, ἀναβλέπω túmọ̀ sí pé ó rí ìran gbà, kì í ṣe pé ó kàn gbé ojú sókè. “Bẹ̀rẹ̀ sí í ríran” tún yẹra fún fífi hàn pé ó ti ríran rí.
- source_word: Πηλὸν
  choice: ẹrẹ̀
  rationale: πηλός lè jẹ́ ẹrẹ̀ tàbí amọ̀; “ẹrẹ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ohun tí a fi omi tú ṣe mu.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: Ó fi ẹrẹ̀ sí ojú mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó gbé ohun náà lé ojú rẹ̀; “ojú mi” lè dúró fún ojú méjèèjì ní Yorùbá.
- source_word: ἐνιψάμην
  choice: mo sì wẹ̀
  rationale: Aorist middle náà sọ ìṣe ẹni náà fúnra rẹ̀. “Mo wẹ̀” pa àkótán Gíríìkì mọ́ láìfi ohun tí a kò sọ ní tààrà kún un.
- source_word: βλέπω
  choice: mo sì ríran
  rationale: Àkókò ìsinsìnyí fi ipò rẹ̀ lọ́wọ́lọ́wọ́ hàn. “Mo ríran” pa ìmúnibíni àti kíkún ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá ἀνέβλεψεν yẹ kí a túmọ̀ sí ‘ríran padà’
  choice: bí ó ṣe bẹ̀rẹ̀ sí í ríran
  alternative: bí ó ṣe ríran padà / bí ojú rẹ̀ ṣe là
  rationale: Àyíká Jòhánù 9 sọ pé afọ́jú ni ọkùnrin náà láti ìbí; “ríran padà” lè dà bí ẹni pé ó ti ríran rí. Ìtumọ̀ tí a yàn pa iṣẹ́ ìwòsàn náà mọ́ láìdá ìtàn tuntun sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A tún àyè àwọn àmì àlàyé ṣe kí [a] tọ́ka sí ἀνέβλεψεν, kí [b] sì tọ́ka sí πηλός, ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì.
