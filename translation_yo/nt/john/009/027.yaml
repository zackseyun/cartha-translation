id: JHN.9.27
reference: John 9:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: yo
  text: Ó dá wọn lóhùn pé, “Mo ti sọ fún yín tẹ́lẹ̀, ẹ kò sì fetí sí i.[a] Èé ṣe tí ẹ tún fẹ́ gbọ́ ọ? Ẹ̀yin náà kò fẹ́ di ọmọ-ẹ̀yìn rẹ̀, àbí?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò sì gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbọ́” tàbí “fetí sí”; níhìn-ín ó ṣeé ṣe kí ó túmọ̀ sí pé wọn kò gba ohun tí a sọ sí ọkàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ó dájú pé ẹ̀yin náà kò fẹ́ di ọmọ-ẹ̀yìn rẹ̀, àbí?” Ìbéèrè Gíríìkì náà ń retí ìdáhùn òdì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Ó dá wọn lóhùn
  rationale: Ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìdáhùn nínú ìtàn ni èyí, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἤδη
  choice: tẹ́lẹ̀
  rationale: Ó fi hàn pé ó ti sọ ọ̀rọ̀ náà ṣáájú; ‘tẹ́lẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere ní àyíká yìí.
- source_word: οὐκ ἠκούσατε
  choice: ẹ kò sì fetí sílẹ̀
  rationale: ἀκούω lè túmọ̀ sí gbígbọ́ lásán tàbí fífetí sí ohun tí a sọ. Níhìn-ín, ẹ̀gàn náà dá lórí pé wọn kò gba ohun tí wọ́n gbọ́ sí ọkàn.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Èé ṣe tí ẹ tún fẹ́ gbọ́ ọ?
  rationale: τί ní àyíká yìí ń béèrè ìdí pẹ̀lú ìbínú díẹ̀; ‘gbọ́ ọ’ mú ohun tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: μὴ καὶ ὑμεῖς
  choice: Ẹ̀yin náà kò fẹ́ ... àbí ẹ fẹ́ bẹ́ẹ̀?
  rationale: Ìbéèrè tí μή bẹ̀rẹ̀ ń retí ìdáhùn òdì. Ìbéèrè àfikún ‘àbí ẹ fẹ́ bẹ́ẹ̀?’ mú agbára àsọyé náà jáde lọ́nà Yorùbá àdánidá.
- source_word: αὐτοῦ μαθηταὶ
  choice: ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún μαθητής nínú àyíká Jòhánù.
- source_word: γενέσθαι
  choice: di
  rationale: ‘Di’ pa ìtumọ̀ wíwọ ipò tuntun mọ́, dípò wíwà ní ipò náà lásán.
theological_decisions:
- issue: Agbára àsọyé inú ìbéèrè ìkẹyìn
  choice: 'Ìbéèrè ẹ̀gàn tí ó ń retí ìdáhùn òdì: “Ẹ̀yin náà kò fẹ́ di ọmọ-ẹ̀yìn rẹ̀, àbí ẹ fẹ́ bẹ́ẹ̀?”'
  alternative: “Ṣé ẹ̀yin náà fẹ́ di ọmọ-ẹ̀yìn rẹ̀ ni?”
  rationale: μή sábà máa ń fi hàn pé olùbéèrè ń retí ìdáhùn òdì. Àyànfẹ́ yìí pa ìrẹ́rìn-ín ẹ̀gàn ọkùnrin náà mọ́ láìfi èrò ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀n ọ̀rọ̀ ìtàn tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, ‘ọmọ-ẹ̀yìn’ fún μαθητής, àti àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá.
