  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: yo
  text: Nítorí èyí ni àwọn òbí rẹ̀ fi sọ pé[a], “Ó ti dàgbà tó; ẹ bi í léèrè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọjọ́ orí rẹ̀ ti tó; ẹ fọ̀rọ̀ wá a lẹ́nu wò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó tọ́ka padà sí ìdí tí a sọ ní ẹsẹ 22, ó sì pa agbára ìtumọ̀ ìdí mọ́ ní Yorùbá àdánidá.
- source_word: γονεῖς
  choice: àwọn òbí rẹ̀
  rationale: Ọ̀rọ̀ ọ̀pọ̀ náà ń tọ́ka sí bàbá àti ìyá ọkùnrin náà papọ̀; ‘àwọn òbí rẹ̀’ ni ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: εἶπαν
  choice: sọ pé
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ gbígbà sọ lásán; ‘sọ pé’ kò fi ìtumọ̀ míì tí kò sí nínú Gíríìkì kún un.
- source_word: Ἡλικίαν ἔχει
  choice: Ó ti dàgbà tó
  rationale: Àpólà náà túmọ̀ sí pé ọjọ́ orí rẹ̀ ti tó láti dáhùn fún ara rẹ̀. Èyí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àwùjọ tàbí ti ojúṣe mọ́.
- source_word: αὐτὸν
  choice: í
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ọkùnrin tí ó ti fọ́jú rí tẹ́lẹ̀ gẹ́gẹ́ bí ẹni tí wọ́n yẹ kí wọ́n béèrè lọ́wọ́ rẹ̀.
- source_word: ἐπερωτήσατε
  choice: ẹ bi í léèrè
  rationale: Àṣẹ náà ní kí wọ́n darí ìbéèrè sí ọkùnrin náà; ‘ẹ bi í léèrè’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá bá èdè mu. ‘Ó ti dàgbà tó’ àti ‘ẹ bi í léèrè’ jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, láì sọ àpólà Gíríìkì di ọ̀rọ̀ òfin tó le jù.
