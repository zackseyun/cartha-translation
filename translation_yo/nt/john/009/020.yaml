  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: yo
  text: Nítorí náà, àwọn òbí rẹ̀ dáhùn, wọ́n sì wí pé, “Àwa mọ̀ pé èyí ni ọmọ wa, àti pé afọ́jú ni wọ́n bí i.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń fi ìtẹ̀síwájú tó ní ìbáṣepọ̀ pẹ̀lú ìbéèrè tí ó ṣáájú hàn, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ ọlọ́lá mu.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Ọ̀rọ̀ ọ̀pọ̀ yìí ń tọ́ka sí bàbá àti ìyá ọkùnrin náà lápapọ̀; ‘àwọn òbí’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: dáhùn, wọ́n sì wí pé
  rationale: Ìtumọ̀ yìí pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ gẹ́gẹ́ bí ó ti rí nínú orísun, láì jẹ́ kí gbolohun náà dà bí èyí tí kò bá Yorùbá mu.
- source_word: Οἴδαμεν
  choice: Àwa mọ̀
  rationale: ‘Mọ̀’ sọ ìmọ̀ tàbí ìdánilójú wọn ní tààrà; lílo ‘Àwa’ fi ìtẹnumọ́ díẹ̀ hàn ní ìdáhùn wọn.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: ọmọ wa ni èyí
  rationale: Èyí jẹ́ àgbékalẹ̀ Yorùbá adayeba tó pa ìdánimọ̀ àti agbára ọ̀rọ̀ atọ́ka οὗτος mọ́.
- source_word: τυφλὸς
  choice: afọ́jú
  rationale: ‘Afọ́jú’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ipò àìríran tí ọ̀rọ̀ náà ń ṣàpèjúwe.
- source_word: ἐγεννήθη
  choice: wọ́n bí i
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ àṣeṣe, èdè Yorùbá máa ń lo àgbékalẹ̀ aláṣe tí a kò dárúkọ, ‘wọ́n bí i,’ lọ́nà adayeba fún ‘a bí i.’
- source_word: τυφλὸς ἐγεννήθη
  choice: afọ́jú ni wọ́n bí i
  rationale: Àgbékalẹ̀ yìí jẹ́ adayeba ní Yorùbá, ó sì sọ ní tààrà pé ipò afọ́jú náà ti wà láti ìgbà ìbí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ adayeba, ọlọ́lá, ó sì pa ìṣọ̀kan ọ̀rọ̀ méjì ‘dáhùn ... wí’ nínú orísun mọ́. Kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún un.
