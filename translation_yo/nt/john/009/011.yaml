  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: yo
  text: Ó dáhùn pé, “Ọkùnrin tí wọ́n ń pè ní Jésù ṣe ẹrẹ̀[a], ó sì fi ẹrẹ̀ náà pa ojú mi[b]. Ó sọ fún mi pé, ‘Lọ sí Sílóámù, kí o sì wẹ̀.’ Nítorí náà, mo lọ, mo wẹ̀, mo sì ríran[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “amọ̀.” Ọ̀rọ̀ Gíríìkì πηλός lè tọ́ka sí ẹrẹ̀ tàbí amọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ó rọ̀ ojú mi” tàbí “ó fi í sí ojú mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi tàbí rírò ohun kan sí ohun mìíràn.
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ rẹ̀ níbí ni pé ó gba agbára láti rí. A kò lò “tún ríran,” nítorí àyíká sọ pé afọ́jú láti ìbí ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Ó dáhùn pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ìdáhùn nínú ìtàn; arọ́pò-orúkọ náà tọ́ka sí ọkùnrin tí a ti ń sọ̀rọ̀ nípa rẹ̀.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Ọkùnrin tí wọ́n ń pè ní Jésù
  rationale: Ó pa ìdánimọ̀ tí olùsọ̀rọ̀ fún Jésù mọ́ gẹ́gẹ́ bí ọkùnrin kan tí orúkọ rẹ̀ ń jẹ́ Jésù, láìfi oyè ẹ̀kọ́ ìsìn kún un.
- source_word: πηλὸν ἐποίησεν
  choice: ṣe ẹrẹ̀
  rationale: “Ẹrẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tútù tí a fi ilẹ̀ ṣe; ó tún lè ní ìtumọ̀ amọ̀ ní ibámu pẹ̀lú àyíká.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: fi í pa ojú mi
  rationale: Gbólóhùn yìí ṣàlàyé fífi ẹrẹ̀ náà sí ojú rẹ̀ láìfi ìtumọ̀ àṣà ìtasórí tí kò ṣe kedere nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: εἶπέν μοι ὅτι
  choice: Ó sọ fún mi pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé láti mú ọ̀rọ̀ àṣẹ tààrà wọlé.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: Lọ sí Sílóámù, kí o sì wẹ̀
  rationale: Ó mú àṣẹ méjèèjì jáde ní èdè Yorùbá àdánidá, kò sì fi “adágún” kún orúkọ ibi tí kò sí nínú ẹsẹ yìí.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Nítorí náà, mo lọ, mo wẹ̀
  rationale: “Nítorí náà” fi àbájáde tí οὖν ń tọ́ka sí hàn, ìtẹ̀lé àwọn ọ̀rọ̀-ìṣe náà sì ṣe kedere.
- source_word: ἀνέβλεψα
  choice: mo sì ríran
  rationale: Nínú àyíká ìwòsàn afọ́jú, ọ̀rọ̀ náà túmọ̀ sí pé agbára láti rí dé bá a; “ríran” jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi hàn pé ó ti ríran rí tẹ́lẹ̀.
theological_decisions:
- issue: Bí olùsọ̀rọ̀ ṣe dá Jésù mọ̀
  choice: Ọkùnrin tí wọ́n ń pè ní Jésù
  alternative: Jésù
  rationale: 'A pa ìpele òye ọkùnrin tí a mú láradá mọ́ nínú ìtàn: níbí, ó kàn dá Jésù mọ̀ gẹ́gẹ́ bí “ọkùnrin,” kò tíì fi oyè gíga kan pè é.'
- issue: Bóyá ọkùnrin náà gba ìríran padà tàbí ó ṣẹ̀ṣẹ̀ ríran
  choice: mo sì ríran
  alternative: mo sì tún ríran
  rationale: Àyíká sọ pé afọ́jú láti ìbí ni ọkùnrin náà; nítorí náà, “tún ríran” lè fi èrò tí kò tọ́ hàn pé ó ti ríran rí tẹ́lẹ̀. “Mo sì ríran” pa ìtumọ̀ ìwòsàn mọ́ láìyanju ìṣòro náà lọ́nà tí kò bá àyíká mu.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ojú” gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni “àwọn ojú” nínú Gíríìkì. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
