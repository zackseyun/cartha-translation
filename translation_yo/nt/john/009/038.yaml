  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: yo
  text: Ó sì wí pé, “Mo gbàgbọ́, Olúwa[a],” ó sì foríbalẹ̀ fún un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ìkíni ọ̀wọ̀; “Olúwa” ni a yàn níbí nítorí pé àyíká náà dé òpin rẹ̀ nínú ìjẹ́wọ́ ìgbàgbọ́ àti ìforíbalẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ó sì jọ́sìn fún un” tàbí “ó sì fi ọlá gíga fún un.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí fífi ara balẹ̀, fífi ọlá hàn, tàbí jíjọ́sìn; àyíká yìí ń fún ìtumọ̀ ‘jọ́sìn’ ní agbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: Àpilẹ̀kọ náà dúró gẹ́gẹ́ bí arọ́pò-orúkọ fún ọkùnrin tí a mú láradá; δέ sì jẹ́ àsopọ̀ ìtàn tí ‘sì’ mú jáde lọ́nà àdánidá láì fi ìtakora kún un.
- source_word: ἔφη
  choice: wí pé
  rationale: Aorist φημί jẹ́ ọ̀nà ìbílẹ̀ láti ṣáájú ọ̀rọ̀ taara; ‘wí pé’ bá èdè Yorùbá ọ̀wọ̀ àti ìtàn Bíbélì mu.
- source_word: Πιστεύω
  choice: Mo gbàgbọ́
  rationale: Èyí dáhùn taara sí ìfihàn Jésù, ó sì pa ìsopọ̀ pẹ̀lú èdè ìgbàgbọ́ inú Jòhánù mọ́ láì túmọ̀ rẹ̀ sí àlàyé gígùn.
- source_word: κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ tó yẹ ní àyíká yìí, níbi tí ìjẹ́wọ́ ìgbàgbọ́ àti ìforíbalẹ̀ ti tẹ̀ lé; síbẹ̀, ìtumọ̀ ìkíni ọ̀wọ̀ bí ‘Ọ̀gá’ ṣeé ṣe, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- source_word: προσεκύνησεν
  choice: foríbalẹ̀ fún
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi ara balẹ̀, jíjọ́sìn, tàbí fífi ọlá gíga hàn. ‘Foríbalẹ̀ fún’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìṣe ara àti ìtumọ̀ ọlá/jíjọ́sìn mọ́ láì yanjú àìdánilójú ọ̀rọ̀ náà ju bó ṣe yẹ lọ.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dative náà sọ ẹni tí ìforíbalẹ̀ náà tọ́ sí; ‘fún un’ jẹ́ ìṣètò Yorùbá tó yẹ pẹ̀lú ‘foríbalẹ̀.’
theological_decisions:
- issue: Bóyá κύριε jẹ́ ìkíni ọ̀wọ̀ lásán tàbí ìjẹ́wọ́ ‘Olúwa’ tó ní ìwọ̀n Kristẹni gíga
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Àyíká náà ń gòkè lọ sí ìjẹ́wọ́ ìgbàgbọ́ àti προσκύνησις lẹ́yìn tí Jésù fi ara rẹ̀ hàn. ‘Olúwa’ pa agbára ẹ̀kọ́ ìgbàgbọ́ tó ṣeé ṣe mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ ìtumọ̀ ìkíni ọ̀wọ̀ náà.
- issue: Bóyá προσεκύνησεν yẹ kí a túmọ̀ ní kedere sí ‘jọ́sìn’ tàbí sí ìṣe fífi ara balẹ̀/fífi ọlá hàn
  choice: foríbalẹ̀ fún
  alternative: jọ́sìn
  rationale: Nítorí ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìforíbalẹ̀ ara, ọlá gíga, tàbí ìjọ́sìn, ìtumọ̀ pàtàkì yìí pa àìdánilójú tòótọ́ mọ́. Àyíká ìgbàgbọ́ sí Jésù ń fún ‘jọ́sìn’ ní agbára, a sì fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘wí pé’ gẹ́gẹ́ bí ìforúkọsílẹ̀ Bíbélì tó ní iyì, ‘gbàgbọ́’ fún èdè pàtàkì Jòhánù, àti ‘foríbalẹ̀ fún’ láti pa ìṣe àti àìdánilójú προσκυνέω mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
