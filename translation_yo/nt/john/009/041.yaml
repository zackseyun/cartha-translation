id: JHN.9.41
reference: John 9:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Bí ẹ bá jẹ́ afọ́jú, ẹ kì bá ní ẹ̀ṣẹ̀.[a] Ṣùgbọ́n nísinsìnyí ẹ sọ pé, ‘A rí’; ẹ̀ṣẹ̀ yín sì ṣì wà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kì bá jẹ̀bi.” Ọ̀rọ̀ Gíríìkì náà sọ pé “ẹ̀ṣẹ̀,” ṣùgbọ́n níbí ó lè tún ní ìtumọ̀ jíjẹ̀bi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: afọ́jú
  rationale: Ó túmọ̀ sí ‘afọ́jú’ ní tààrà; ọ̀rọ̀ yìí tún ní agbára àkàwé nípa ìríran ẹ̀mí nínú àyíká ọ̀rọ̀ náà, láìfi ‘nípa ẹ̀mí’ kún un.
- source_word: οὐκ ἂν εἴχετε
  choice: ẹ̀yin kì bá tí ní
  rationale: Ìṣètò ọ̀rọ̀ yìí fi àbájáde ipò àròsọ tí kò rí bẹ́ẹ̀ hàn; ‘kì bá tí ní’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἁμαρτίαν
  choice: ẹ̀ṣẹ̀
  rationale: ‘Ẹ̀ṣẹ̀’ ni ìtumọ̀ tààrà, ó sì pa ìlò ọ̀rọ̀ Johanu mọ́; nínú àyíká yìí ó lè ní ìtumọ̀ jíjẹ̀bi pẹ̀lú.
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó fi ìyàtọ̀ hàn láàárín ipò àròsọ náà àti bí ọ̀ràn ṣe rí lọ́wọ́lọ́wọ́.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: ẹ̀yin sọ pé, ‘Àwa ríran,’
  rationale: Ó pa ìyípadà láti ‘ẹ̀yin sọ’ sí ọ̀rọ̀ tààrà ‘Àwa ríran’ mọ́, pẹ̀lú ìtànìyàn inú ọ̀rọ̀ Jésù.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: ẹ̀ṣẹ̀ yín ṣì wà
  rationale: ‘Ṣì wà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó fi ipò tí ń bá a lọ hàn, gẹ́gẹ́ bí μένει ṣe túmọ̀ sí nínú ẹsẹ yìí.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé afọ́jú nípa ẹ̀mí ni àti pé ẹ̀ṣẹ̀ túmọ̀ sí jíjẹ̀bi níwájú Ọlọ́run
  choice: A fi ‘afọ́jú’ àti ‘ẹ̀ṣẹ̀’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ, láìfi àlàyé ìtumọ̀ kún ọ̀rọ̀ pàtàkì.
  alternative: “Ká ní afọ́jú nípa ẹ̀mí ni ẹ̀yin, ẹ̀yin kì bá jẹ̀bi ẹ̀ṣẹ̀.”
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí ìríran ẹ̀mí, ṣùgbọ́n ọ̀rọ̀ Jésù mọ̀ọ́mọ̀ ń bá àkàwé afọ́jú àti ríran tó gba orí kẹsàn-án já kọjá lọ. Ìtumọ̀ tààrà pa àìdánilójú àti agbára ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ká ní ... ni’ fún ipò àròsọ, ‘ríran’ sì pa eré ọ̀rọ̀ afọ́jú/ríran mọ́. Àmì ìtọ́kasí [a] wà lẹ́yìn gbólóhùn tí àlàyé náà kan.
