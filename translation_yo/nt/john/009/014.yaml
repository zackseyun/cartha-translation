  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: yo
  text: Ọjọ́ tí Jésù ṣe ẹrẹ̀[a], tí ó sì la ojú ọkùnrin náà[b], jẹ́ Ọjọ́ Ìsinmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “amọ̀.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “la ojú rẹ̀”; gbólóhùn tó ṣeé fojú inú rí fún bí Jésù ṣe mú un láradá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: Ọjọ́ Ìsinmi
  rationale: Ó tọ́ka sí ọjọ́ Sábáàtì; ‘Ọjọ́ Ìsinmi’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ ọjọ́ inú kàlẹ́ńdà mọ́ láìfi àlàyé òfin kún un.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: ni ọjọ́ tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbátan àkókò náà.
- source_word: πηλόν
  choice: ẹrẹ̀
  rationale: Nínú àyíká yìí, ‘ẹrẹ̀’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ilẹ̀ tútù tí a pò; ‘amọ̀’ tún ṣeé ṣe.
- source_word: ἐποίησεν
  choice: fi ṣe
  rationale: Ìṣètò ‘ọjọ́ tí ... fi ṣe’ jẹ́ Yorùbá àdánidá fún ohun tí Jésù ṣe ní ọjọ́ náà.
- source_word: ἀνέῳξεν
  choice: la
  rationale: ‘La ojú’ pa àwòrán gidi ti ọ̀rọ̀ Gíríìkì ‘ṣí ojú’ mọ́, dípò lílo ìtumọ̀ àlàyé bí ‘mú kí ó ríran.’
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: ojú ọkùnrin náà
  rationale: Rírò αὐτοῦ sí ‘ọkùnrin náà’ mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá, láìyí ìtumọ̀ padà.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀
  rationale: δὲ jẹ́ àmì ìtẹ̀síwájú ìtàn pẹ̀lẹ́; Yorùbá kò nílò kí a fi ‘nígbà náà’ tàbí ọ̀rọ̀ míì sí ìbẹ̀rẹ̀ níhìn-ín.
theological_decisions:
- issue: Ìtọ́kasí Ọjọ́ Ìsinmi ní ìbámu pẹ̀lú ìwòsàn tí Jésù ṣe
  choice: Túmọ̀ ìsọfúnni nípa ọjọ́ náà ní tààrà, láìfi ìdájọ́ nípa òfin Ọjọ́ Ìsinmi kún un.
  alternative: Ṣàlàyé pé ìṣe náà ló fa àríyànjiyàn nípa òfin Ọjọ́ Ìsinmi.
  rationale: Ẹsẹ yìí kàn sọ òtítọ́ kan tó ń pèsè ọ̀nà fún àríyànjiyàn tó tẹ̀ lé e; kò yẹ kí ìtumọ̀ yanju ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọkùnrin náà’ nínú ọ̀rọ̀ pàtàkì fún ìtànkálẹ̀ arọ́pò-orúkọ tó ṣe kedere.
