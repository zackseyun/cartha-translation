  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: yo
  text: Nítorí náà, wọ́n ń sọ fún un pé, “Báwo ni ojú rẹ ṣe là?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni a ṣe la ojú rẹ?” Ọ̀rọ̀ Gíríìkì náà wà ní ohùn àìsọ ẹni tó ṣe é.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Ìṣe aláìpé náà lè tọ́ka sí ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń tún sọ; ‘wọ́n ń sọ’ pa ìrísí yìí mọ́ ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìtumọ̀ ìtẹ̀síwájú tó ní ìdí tàbí àbájáde mọ́ nínú ìtàn.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ẹni tí a bá sọ̀rọ̀ sí hàn.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Ìbéèrè yìí ń béèrè ọ̀nà tàbí bí ohun náà ṣe ṣẹlẹ̀.
- source_word: ἠνεῴχθησάν
  choice: a ṣe la
  rationale: Àpẹẹrẹ ‘a ṣe’ pa ohùn àìsọ ẹni tó ṣe iṣẹ́ náà mọ́, dípò yíyí ọ̀rọ̀ náà sí ìṣe tí ojú ṣe fúnra rẹ̀.
- source_word: σου οἱ ὀφθαλμοί
  choice: ojú rẹ
  rationale: Ní Yorùbá, ‘ojú rẹ’ ni ọ̀rọ̀ àdánidá fún ohun tí Gíríìkì sọ ní ọ̀pọ̀ ‘àwọn ojú rẹ’.
theological_decisions:
- issue: Ẹni tó la ojú rẹ kò jẹ́ mímọ̀ nínú gbolohun náà
  choice: a ṣe la ojú rẹ
  alternative: ojú rẹ ṣe là
  rationale: A kò fi ẹni tó ṣe iṣẹ́ náà kún ọ̀rọ̀; a sì pa ìṣe àìsọ ẹni náà mọ́ níwọ̀n tí Yorùbá fi lè ṣe é.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé lóye. A lo ‘wọ́n ń sọ’ láti pa ìrísí ìṣe aláìpé mọ́; ‘la ojú’ jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá fún mímú kí ẹni afọ́jú ríran.
