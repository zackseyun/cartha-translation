id: JHN.9.26
reference: John 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: yo
  text: Nítorí náà, wọ́n sọ fún un pé, “Kí ni ó ṣe sí ọ? Báwo ni ó ṣe la ojú rẹ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: wọ́n sọ
  rationale: Ọ̀rọ̀ náà jẹ́ àkókò tí ó kọjá ti λέγω, ó sì ń mú ọ̀rọ̀ tààrà tí ẹgbẹ́ náà sọ wọlé. “Wọ́n sọ” pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àwọn gbólóhùn tó tẹ̀ lé e jẹ́ ìbéèrè.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú tàbí àbájáde nínú ìjíròrò; “Nítorí náà” fi agbára àsopọ̀ náà hàn kedere.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù náà tọ́ka sí ọkùnrin tí a bí ní afọ́jú; “fún un” ni ọ̀nà Yorùbá àdánidá láti sọ ẹni tí wọ́n bá sọ̀rọ̀ sí.
- source_word: Τί ἐποίησέν σοι
  choice: Kí ni ó ṣe sí ọ?
  rationale: “Ṣe sí ọ” pa àìdánilójú díẹ̀ tó wà nínú ποιέω pẹ̀lú dátífù mọ́, kò sì fi ìtumọ̀ pé ohun rere ni ó ṣe fún un kún ọ̀rọ̀ àwọn olùfọ̀rọ̀wánilẹ́nuwò.
- source_word: πῶς
  choice: Báwo ni
  rationale: Ó béèrè ọ̀nà tàbí ìlànà tí ìṣe náà fi ṣẹlẹ̀; “Báwo ni” ni ìbámu Yorùbá tó ṣe déédé.
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: ó ṣe la ojú rẹ
  rationale: “La ojú” jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣí ojú ẹni, ó sì pa àwòrán ìṣe ἀνοίγω mọ́. Ẹyọ “ojú” lè dúró fún ojú méjèèjì ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A pa ìrísí ìbéèrè méjì àti ìró ìwádìí tó le koko mọ́.
