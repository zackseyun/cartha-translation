id: JHN.9.24
reference: John 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: yo
  text: Nítorí náà, wọ́n pe ọkùnrin tí ó ti fọ́jú náà lẹ́ẹ̀kejì, wọ́n sì sọ fún un pé, “Fi ògo fún Ọlọ́run;[a] àwa mọ̀ pé ẹlẹ́ṣẹ̀ ni ọkùnrin yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí ó ṣeé ṣe kí èyí jẹ́ ọ̀nà àkànṣe láti fi ẹni búra pé: “Fi ògo fún Ọlọ́run,” ìyẹn ni pé, “Sọ òtítọ́ níwájú Ọlọ́run” tàbí “Jẹ́wọ́ ní gbangba níwájú Ọlọ́run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: wọ́n pe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n pe ọkùnrin náà padà wá síwájú wọn; “wọ́n pe” jẹ́ èdè Yorùbá àdánidá, kò sì fi agbára àṣẹ kún ohun tí Gíríìkì kò sọ ní kedere.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: τὸν ἄνθρωπον
  choice: ọkùnrin
  rationale: Níhìn-ín ἄνθρωπος ń tọ́ka sí akọ kan pàtó, nítorí náà “ọkùnrin” bá ìtumọ̀ àti àyíká mu.
- source_word: ἐκ δευτέρου
  choice: tún ... lẹ́ẹ̀kejì
  rationale: Gbólóhùn Gíríìkì túmọ̀ sí “ní ìgbà kejì”; àkójọpọ̀ “tún ... lẹ́ẹ̀kejì” jẹ́ kedere, ó sì bá ìṣètò gbolohun Yorùbá mu.
- source_word: ὃς ἦν τυφλός
  choice: tí ó ti fọ́jú
  rationale: Ọkùnrin náà ti ríran báyìí; àmì “ti” fi hàn pé ìfọ́jú jẹ́ ipò rẹ̀ tẹ́lẹ̀, láìsọ pé ó ṣì fọ́jú.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Fi ògo fún Ọlọ́run
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì mọ́ ní tààrà, nígbà tí àlàyé ìtumọ̀ àkànṣe rẹ̀ gẹ́gẹ́ bí ìkìlọ̀ láti sọ òtítọ́ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡμεῖς οἴδαμεν
  choice: àwa mọ̀
  rationale: Lílo “àwa” ní kedere pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ọkùnrin yìí
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá tí kò fi ẹ̀gàn tí kò sí ní kedere nínú Gíríìkì kún un.
- source_word: ἁμαρτωλός
  choice: ẹlẹ́ṣẹ̀
  rationale: “Ẹlẹ́ṣẹ̀” jẹ́ ọ̀rọ̀-orúkọ Yorùbá tó bá ẹ̀sùn pé ẹni náà jẹ́ sinner mu, dípò kí a sọ ọ́ di àpèjúwe àìmọ́kan bí “ó kún fún ẹ̀ṣẹ̀.”
theological_decisions:
- issue: Ìtumọ̀ àkànṣe Δὸς δόξαν τῷ θεῷ
  choice: Pa ọ̀rọ̀ tààrà “Fi ògo fún Ọlọ́run” mọ́ nínú ẹsẹ̀ náà.
  alternative: Túmọ̀ ọ́ ní ìtumọ̀ àlàyé bí “Sọ òtítọ́ níwájú Ọlọ́run” tàbí “Jẹ́wọ́ ní gbangba níwájú Ọlọ́run.”
  rationale: Ó ṣeé ṣe kí gbólóhùn náà jẹ́ ọ̀nà pàtàkì láti fi ẹni búra tàbí rọ̀ ọ́ pé kó sọ òtítọ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ nípa fífi ògo fún Ọlọ́run. Ìtumọ̀ àkọ́kọ́ pa ọ̀rọ̀ náà àti ìṣòro ìtumọ̀ rẹ̀ mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé agbára àkànṣe rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún ní ibi tí ó bá ti jẹ́ àdánidá. “Fi ògo fún Ọlọ́run” pa àwòrán orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ń jẹ́ kí agbára ọ̀rọ̀ náà yé òǹkàwé.
