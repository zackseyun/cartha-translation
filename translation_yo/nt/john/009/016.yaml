id: JHN.9.16
reference: John 9:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: yo
  text: Nítorí náà, àwọn kan lára àwọn Farisí ń sọ pé, “Ọkùnrin yìí kò ti ọ̀dọ̀ Ọlọ́run wá, nítorí kò pa ọjọ́ Ìsinmi mọ́.” Ṣùgbọ́n àwọn mìíràn ń sọ pé, “Báwo ni ọkùnrin ẹlẹ́ṣẹ̀[a] ṣe lè ṣe irú àwọn àmì[b] wọ̀nyí?” Ìyapa sì wà láàárín wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹlẹ́ṣẹ̀ kan.” Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ “ọkùnrin ẹlẹ́ṣẹ̀,” níbi tí “ẹlẹ́ṣẹ̀” ti ń ṣe àpèjúwe “ọkùnrin.”
    reason: lexical_alternative
  - marker: b
    text: Jòhánù sábà máa ń lo “àwọn àmì” fún àwọn iṣẹ́ Jésù láti tẹnu mọ́ ohun tí wọ́n ń fi hàn nípa rẹ̀; a tún lè sọ ọ́ ní kedere sí i pé “àwọn iṣẹ́ àmì ìyanu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: àwọn kan ... ń sọ
  rationale: Àkókò imperfect ἔλεγον fi ìṣe tí ń lọ lọ́wọ́ nínú ìṣẹ̀lẹ̀ náà hàn; “ń sọ” pa apá yìí mọ́. “Àwọn kan” sì jẹ́ ìtumọ̀ àdánidá fún τινές.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìròyìn hàn.
- source_word: ἐκ τῶν Φαρισαίων
  choice: lára àwọn Farisí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí apá kan nínú ẹgbẹ́ àwọn Farisí; “lára” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ èyí.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Ọkùnrin yìí
  rationale: Ó tọ́ka sí ọkùnrin pàtó, ó sì pa agbára ọ̀rọ̀ atọ́ka “yìí” mọ́ láìfi ẹ̀gàn tí kò sí nínú orísun kún un.
- source_word: παρὰ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó fi orísun tàbí ibi tí ẹni náà ti wá hàn. A kò fi “Ọlọ́run rán” sí i, nítorí ọ̀rọ̀ “rán” kò fara hàn ní Gíríìkì.
- source_word: τηρεῖ τὸ σάββατον
  choice: pa ọjọ́ Ìsinmi mọ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípa òfin ọjọ́ Sabbath mọ́.
- source_word: Πῶς δύναται
  choice: Báwo ni ... ṣe lè
  rationale: Ìṣètò yìí jẹ́ ìbéèrè Yorùbá tó ṣe déédéé, ó sì pa ìtumọ̀ agbára tàbí ṣíṣeéṣe inú δύναται mọ́.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: ọkùnrin ẹlẹ́ṣẹ̀
  rationale: ἁμαρτωλός jẹ́ àpèjúwe fún ἄνθρωπος níbí; “ọkùnrin ẹlẹ́ṣẹ̀” tẹ̀ lé ìṣètò àti ìtumọ̀ náà ní ti ẹ̀dá Yorùbá.
- source_word: τοιαῦτα σημεῖα
  choice: irú àwọn àmì wọ̀nyí
  rationale: “Àmì” pa ìtumọ̀ pàtàkì σημεῖα nínú Jòhánù mọ́, níbi tí iṣẹ́ náà ti ń tọ́ka sí òtítọ́ tó ju iṣẹ́ ìyanu fúnra rẹ̀ lọ.
- source_word: σχίσμα
  choice: Ìyapa
  rationale: Ọ̀rọ̀ yìí fi pípín tàbí àìṣọ̀kan ẹgbẹ́ náà hàn ní kedere, láìsọ ọ́ di ọ̀rọ̀ àríyànjiyàn lásán.
theological_decisions:
- issue: Ìtumọ̀ σημεῖα nínú Jòhánù
  choice: àwọn àmì
  alternative: àwọn iṣẹ́ àmì ìyanu; àwọn iṣẹ́ ìyanu
  rationale: Jòhánù máa ń lo σημεῖα fún iṣẹ́ tí ń fi ẹni tí Jésù jẹ́ hàn. “Àmì” pa ìwúwo ìtumọ̀ yìí mọ́ láìfi ọ̀rọ̀ míì kún orísun.
- issue: Ọ̀rọ̀ pé Jésù wá láti ọ̀dọ̀ Ọlọ́run
  choice: kò ti ọ̀dọ̀ Ọlọ́run wá
  alternative: Ọlọ́run kò rán an
  rationale: παρὰ θεοῦ sọ nípa orísun tàbí àṣẹ láti ọ̀dọ̀ Ọlọ́run. Yíyí i sí “Ọlọ́run kò rán an” yóò mú èrò iṣẹ́ ìránṣẹ́ wọlé ní kedere ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: A lo Yorùbá àkànṣe òde òní tó bójú mu, tó ní iyì, tí òǹkàwé gbogbo lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Ọjọ́ Ìsinmi” jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa fún Sabbath, “ń sọ” sì pa ìṣe tó ń lọ lọ́wọ́ nínú ìtàn náà mọ́.
