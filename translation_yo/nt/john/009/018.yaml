revisions:
- from: Nítorí náà, àwọn Júù kò gbà nípa rẹ̀ pé afọ́jú ni ó ti jẹ́, ó sì ti ríran, títí tí wọ́n fi pe àwọn òbí ẹni tí ó ríran náà wá.[a]
  to: Nítorí náà, àwọn Júù[a] kò gbàgbọ́ pé ẹni náà ti jẹ́ afọ́jú, ó sì ti bẹ̀rẹ̀ sí í ríran, títí tí wọ́n fi pe àwọn òbí ẹni tí ó ti bẹ̀rẹ̀ sí í ríran náà wá.
  rationale: The revision improves Yoruba idiom while preserving the source meaning, narrative temporal relationship, and the unresolved contextual breadth of οἱ Ἰουδαῖοι. It also moves the footnote marker to the term addressed by the note.
