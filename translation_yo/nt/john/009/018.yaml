review_pass:
  verdict: revise
  source_fidelity: The draft follows the Greek sequence and preserves the broad, contextually debated reference of οἱ Ἰουδαῖοι. However, “kò gbà nípa rẹ̀ pé” is not the clearest idiomatic way to express πιστεύω with a content clause, and “ó sì ti ríran” is less natural than an explicit expression of coming to see.
  naturalness: A small revision gives more natural modern Standard Yoruba, including a clearer verbal expression for believing and for the healed man’s receiving sight. The footnote marker should be attached to “àwọn Júù,” the expression it qualifies, rather than placed at the end of the verse.
  terminology: “Àwọn Júù” appropriately retains the Greek wording in the main text. The footnote responsibly notes “àwọn olórí Júù” and “àwọn ará Jùdíà” as contextual alternatives without imposing either one. “Bẹ̀rẹ̀ sí í ríran” conveys recovery of sight without implying prior sight.
  issues:
  - severity: medium
    issue: The phrase “kò gbà nípa rẹ̀ pé” is syntactically and idiomatically weak for ‘did not believe concerning him that …’.
    rationale: In this context, “kò gbàgbọ́ pé” is the normal Yoruba expression for not accepting a stated claim as true. The referent is already maintained by the following clause.
  - severity: medium
    issue: “Ó sì ti ríran” is less natural and may be unclear as a rendering of ἀνέβλεψεν.
    rationale: “Ó sì ti bẹ̀rẹ̀ sí í ríran” naturally communicates that he came to see, matching the healing-context sense of the Greek without asserting that he had previously possessed sight.
  - severity: low
    issue: Footnote anchor placement is imprecise.
    rationale: The note explains “àwọn Júù,” so its marker should immediately follow that phrase.
  revised_text: Nítorí náà, àwọn Júù[a] kò gbàgbọ́ pé ẹni náà ti jẹ́ afọ́jú, ó sì ti bẹ̀rẹ̀ sí í ríran, títí tí wọ́n fi pe àwọn òbí ẹni tí ó ti bẹ̀rẹ̀ sí í ríran náà wá.
  revised_footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà,” ní ìbámu pẹ̀lú bí a ṣe lóye lílo ọ̀rọ̀ “àwọn Júù” nínú Jòhánù ní àyíká yìí.
    reason: alternative_reading
  revision_rationale: The revision improves Yoruba idiom while preserving the source meaning, narrative temporal relationship, and the unresolved contextual breadth of οἱ Ἰουδαῖοι. It also moves the footnote marker to the term addressed by the note.
