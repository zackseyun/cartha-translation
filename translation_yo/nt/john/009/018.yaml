id: JHN.9.18
reference: John 9:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] kò gbàgbọ́ pé ẹni náà ti jẹ́ afọ́jú, ó sì ti bẹ̀rẹ̀ sí í ríran, títí tí wọ́n fi pe àwọn òbí ẹni tí ó ti bẹ̀rẹ̀ sí í ríran náà wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà,” ní ìbámu pẹ̀lú bí a ṣe lóye lílo ọ̀rọ̀ “àwọn Júù” nínú Jòhánù ní àyíká yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: kò gbà
  rationale: Písτεύω pẹ̀lú gbólóhùn ὅτι túmọ̀ sí gbigba ohun kan gbọ́ gẹ́gẹ́ bí òtítọ́; “kò gbà” jẹ́ ọ̀nà Yorùbá àdánidá fún èyí.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí pa ìtumọ̀ gígún ti ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtumọ̀ tó dín sí “àwọn olórí Júù” sínú àyọkà pàtàkì.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: “Nípa rẹ̀” ni ìbámu Yorùbá tó ṣe déédéé fún περί pẹ̀lú genitive.
- source_word: ἦν τυφλὸς
  choice: afọ́jú ni ó ti jẹ́
  rationale: Ọ̀rọ̀ yìí fi ipò ìfọ́jú tó ṣáájú ìmúláradá hàn ní Yorùbá àdánidá.
- source_word: ἀνέβλεψεν
  choice: ó sì ti ríran
  rationale: Nínú àyíká ìwòsàn, ἀναβλέπω túmọ̀ sí pé ẹni náà bẹ̀rẹ̀ sí í ríran; yíyàn yìí kò sọ pé ó ti ríran rí tẹ́lẹ̀.
- source_word: ἕως ὅτου
  choice: títí tí ... fi
  rationale: Èyí ni àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá fún ààlà àkókò “títí di ìgbà tí.”
- source_word: ἐφώνησαν
  choice: wọ́n ... pe ... wá
  rationale: Φωνέω níbí lè túmọ̀ sí pípe tàbí ránṣẹ́ pe; “pe ... wá” mú ìṣe náà ṣe kedere láì mú un le ju bó ṣe yẹ lọ.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Èyí ni ìtumọ̀ taara àti àdánidá ti γονεῖς.
- source_word: τοῦ ἀναβλέψαντος
  choice: ẹni tí ó ríran náà
  rationale: Ó pa ipa participle oní-artíkù mọ́, ó sì dá ẹni náà mọ̀ nípa ìṣẹ̀lẹ̀ ríran láì fi “ọkùnrin” kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Àyọkà pàtàkì pa ọ̀rọ̀ Gíríìkì tó gbòòrò mọ́. Àlàyé ìsàlẹ̀ tọ́ka sí àwọn ìtumọ̀ tó lè bá àyíká ìwádìí yìí mu, láì yan ọ̀kan dípò ohun tí àkọsílẹ̀ sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “pe ... wá” fún ìṣàn ọ̀rọ̀ àdánidá, a sì pa àìdánilójú nípa “àwọn Júù” mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
