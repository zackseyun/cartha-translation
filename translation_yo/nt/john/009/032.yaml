source:
  edition: SBLGNT
  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: yo
  text: Láti ìgbà àtijọ́ wá, a kò tíì gbọ́ rí pé ẹnikẹ́ni ṣí ojú ẹni tí ó jẹ́ afọ́jú láti ìbí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Láti ìgbà tí ayé ti bẹ̀rẹ̀, a kò tíì gbọ́ rí pé …”
    reason: Àṣàyàn míì fún títúmọ̀ ἐκ τοῦ αἰῶνος.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Láti ìgbà àtijọ́ wá
  rationale: Ó fi hàn pé láti gbogbo ìgbà tí ènìyàn lè rántí ni, láì sọ ọ́ di ọ̀rọ̀ nípa ayérayé.
- source_word: οὐκ ἠκούσθη
  choice: a kò tíì gbọ́ rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé irú ìṣẹ̀lẹ̀ bẹ́ẹ̀ kò ní àpẹẹrẹ tí a ti gbọ́ tẹ́lẹ̀, ó sì pa ìtumọ̀ àìṣe aláṣẹ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń mú àkóónú ohun tí a kò tíì gbọ́ rí wọlé ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: ἠνέῳξέν
  choice: ṣí
  rationale: Pẹ̀lú ‘ojú,’ ‘ṣí’ ni ìtumọ̀ tààrà àti àdánidá; a kò túmọ̀ rẹ̀ sí ‘mú padà bọ̀ sípò,’ èyí tí yóò fi àlàyé kún ọ̀rọ̀ náà.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó bá àyíká gbólóhùn òdì tó kan gbogbo ènìyàn mu.
- source_word: ὀφθαλμοὺς
  choice: ojú
  rationale: ‘Ṣí ojú’ ni gbólóhùn Yorùbá àdánidá tó bá ọ̀rọ̀ Gíríìkì mu.
- source_word: τυφλοῦ γεγεννημένου
  choice: ẹni tí a bí ní afọ́jú
  rationale: Ó ṣàpèjúwe ẹni náà gẹ́gẹ́ bí afọ́jú láti ìbí, láì fi ‘ọkùnrin’ kún ibi tí ọ̀rọ̀ Gíríìkì kò ti béèrè rẹ̀ ní pàtó.
theological_decisions:
- issue: Ìwọ̀n àkókò tí ἐκ τοῦ αἰῶνος ń tọ́ka sí
  choice: Láti ìgbà àtijọ́ wá—ìyẹn, láti gbogbo ìgbà tí a lè rántí
  alternative: Láti ìgbà tí ayé ti bẹ̀rẹ̀
  rationale: Olùsọ̀rọ̀ ń sọ nípa ohun tí a kò ní àpẹẹrẹ rẹ̀ nínú ìrírí ènìyàn; kì í ṣe gbólóhùn nípa ayérayé. A pa àṣàyàn ‘láti ìgbà tí ayé ti bẹ̀rẹ̀’ mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹni’ dípò fífi akọ tàbí abo kún ọ̀rọ̀ náà, a sì lo ‘a kò tíì gbọ́ rí’ fún ìṣàn ọ̀rọ̀ Yorùbá àdánidá.
