  rationale: A rọ́pò ‘ẹni tí a bí ní afọ́jú’ pẹ̀lú ‘ẹni tí ó jẹ́ afọ́jú láti ìbí’ láti jẹ́ kí ìtumọ̀ ‘born blind’ hàn gbangba ní Yorùbá àdánidá. A fi gbogbo àwọn ìpinnu ìtumọ̀ mìíràn àti àmì àlàyé ìsàlẹ̀ sílẹ̀ láìyí ìtumọ̀ ẹsẹ̀ náà padà.
