  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: yo
  text: Jésù gbọ́ pé wọ́n ti lé e jáde[a]. Nígbà tí ó sì rí i, ó wí fún un pé, “Ìwọ ha gbàgbọ́ nínú Ọmọ Ènìyàn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “Ọmọ Ọlọ́run” dípò “Ọmọ Ènìyàn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: wọ́n ti lé e jáde
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n lé e kúrò láàárín wọn; “lé e jáde” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún pa agbára ìtumọ̀ náà mọ́.
- source_word: εὑρὼν
  choice: Nígbà tí ó sì rí i
  rationale: A tú participle aorist náà ní ìtumọ̀ àkókò, láti fi tẹ̀lé bí àwọn ìṣẹ̀lẹ̀ ṣe ń lọ ní ọ̀nà Yorùbá àdánidá.
- source_word: Σὺ πιστεύεις
  choice: Ìwọ ha gbàgbọ́
  rationale: “Ìwọ” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, “ha” sì mú kí ìbéèrè náà ṣe kedere ní èdè Yorùbá ọlọ́lá.
- source_word: πιστεύεις εἰς
  choice: gbàgbọ́ nínú
  rationale: Àkójọpọ̀ yìí sọ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí a darí sí ẹni kan; “gbàgbọ́ nínú” ni gbólóhùn Yorùbá tí ó wọ́pọ̀ fún un.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ akọ́lé náà tí ó ti fìdí múlẹ̀, tí ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 àti lílò rẹ̀ nínú Jòhánù mọ́.
theological_decisions:
- issue: Ọ̀nà kíkà akọ́lé ní inú ìbéèrè náà
  choice: Ọmọ Ènìyàn
  alternative: Ọmọ Ọlọ́run
  rationale: Ìwé SBLGNT ní ἀνθρώπου (“Ènìyàn”), nítorí náà a lò ó nínú ẹsẹ̀. Àwọn ìwé àfọwọ́kọ kan ní “Ọmọ Ọlọ́run”; a pa ìyàtọ̀ pàtàkì yìí mọ́ sínú àlàyé ìsàlẹ̀ láìyanjú aáwọ̀ ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A lo “ha” láti mú ìbéèrè náà ṣe kedere, àti “lé e jáde” láti ṣàfihàn ìléni-kúrò láàárín ẹgbẹ́.
