  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: yo
  text: Níwọ̀n ìgbà tí mo bá wà nínú ayé, èmi ni ìmọ́lẹ̀ ayé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Níwọ̀n ìgbà tí ... bá
  rationale: Ó fi àkókò tí ipò náà bá ń dúró hàn ní Yorùbá àdánidá; ó bá ‘while/as long as’ mu, láì sọ ọ́ di ‘nígbàkigbà’ tí yóò lè yí ìtumọ̀ àyíká ọ̀rọ̀ náà padà.
- source_word: ἐν τῷ κόσμῳ
  choice: nínú ayé
  rationale: ‘Ayé’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún κόσμος ní àyíká yìí.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: èmi ni ìmọ́lẹ̀ ayé
  rationale: Ó pa àpẹẹrẹ ìmọ́lẹ̀ mọ́, ó sì lo ‘èmi’ láti gbé ìtẹnumọ́ tí ọ̀nà gbólóhùn Gíríìkì náà ní jáde.
theological_decisions:
- issue: Bí ὅταν ṣe ní ìtumọ̀ nínú ọ̀rọ̀ yìí
  choice: Níwọ̀n ìgbà tí mo bá wà nínú ayé
  alternative: Nígbàkigbà tí mo bá wà nínú ayé
  rationale: Àṣàyàn náà tẹnumọ́ àkókò tí Jésù wà nínú ayé gẹ́gẹ́ bí àyíká gbólóhùn ṣe ń tọ́ka sí, láì dá ẹ̀kọ́ míì kún un tàbí sọ pé ó ń wọ ayé léraléra.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
