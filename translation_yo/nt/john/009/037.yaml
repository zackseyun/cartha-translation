  source_fidelity: 'Ìtumọ̀ náà mú ìdánimọ̀ taara Jésù àti ìṣe àṣepé nínú ἑώρακας (“ti rí i”) hàn dáadáa. “Ń bá ọ sọ̀rọ̀” sì jẹ́ ìtumọ̀ tó tọ́, tó sì jẹ́ èdè Yorùbá àdánidá fún ὁ λαλῶν μετὰ σοῦ. Ṣùgbọ́n “yìí” nínú àkọsílẹ̀ náà kò bá ἐκεῖνος mu dáadáa: yìí túmọ̀ sí “this,” nígbà tí ọ̀rọ̀ Gíríìkì náà jẹ́ arọ́pò ìdánimọ̀ “that one/he,” tí “ni òun” ti gbé kalẹ̀ tẹ́lẹ̀.'
  naturalness: “Ẹni tí ó sì ń bá ọ sọ̀rọ̀ ni òun” jẹ́ ìṣètò Yorùbá boṣewa, ó sì mọ́, ó rọrùn láti ka nínú ọ̀rọ̀ taara. Yíyọ “yìí” kúrò ń yẹra fún ìtọ́ka “this” tí kò sí nínú ìtumọ̀ orísun àti fún ìtẹnumọ́ tó pọ̀ ju.
