  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Ìwọ ti rí i, ẹni tí ó sì ń bá ọ sọ̀rọ̀ ni òun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣe sísọ àti ẹni tí a ń bá sọ̀rọ̀ hàn, láìfi ìtumọ̀ míì kún Gíríìkì.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Ìwọ ti rí i
  rationale: Ìṣe àṣepé ἑώρακας ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ó sì ṣe pàtàkì ní ìsinsìnyí; “ti rí i” mú èyí jáde ní Yorùbá. Fífìdí “ìwọ” múlẹ̀ ń jẹ́ kí ìdánimọ̀ náà ṣe kedere.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: ẹni tí ó ń bá ọ sọ̀rọ̀ yìí
  rationale: “ń bá ọ sọ̀rọ̀” pa ìtumọ̀ μετά σοῦ, ‘pẹ̀lú rẹ/with you,’ mọ́ ju “ń sọ̀rọ̀ sí ọ” lọ, ó sì jẹ́ àdánidá ní Yorùbá. “yìí” ṣe iṣẹ́ ìtọ́ka tí ἐκεῖνος ní nínú gbólóhùn ìdánimọ̀ náà.
- source_word: ἐκεῖνός ἐστιν
  choice: ni òun
  rationale: Ìṣètò “... ni òun” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìdánimọ̀ taara, láìṣe àfikún oyè ẹni tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Jésù ń fi ara rẹ̀ hàn gẹ́gẹ́ bí ẹni tí ọkùnrin náà béèrè nípa rẹ̀ ní àyíká ẹsẹ náà.
  choice: “ẹni tí ó sì ń bá ọ sọ̀rọ̀ yìí ni òun”
  alternative: “òun ni ẹni tí ó ń sọ̀rọ̀ sí ọ”
  rationale: Àṣàyàn náà pa ìdánimọ̀ Jésù mọ́ ní ṣókí, ó pa “bá ... sọ̀rọ̀” ti μετά σοῦ mọ́, kò sì tún oyè “Ọmọ Ènìyàn” ṣe níbi tí Gíríìkì kò ti tún un sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún ìtàn àti ọ̀rọ̀ taara nínú Bíbélì.
