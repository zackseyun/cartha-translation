id: JHN.9.39
reference: John 9:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: yo
  text: Jésù sì wí pé, “Fún ìdájọ́ ni mo wá sínú ayé yìí,[a] kí àwọn tí kò rí lè rí, kí àwọn tí ń rí sì di afọ́jú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìdájọ́ kan.” Ọ̀rọ̀ Gíríìkì εἰς κρίμα lè tẹnu mọ́ àbájáde ìdájọ́ tí wíwá Jésù mú wá, kì í ṣe ìdálẹ́bi nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: ìdájọ́
  rationale: “Ìdájọ́” pa agbára ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí àbájáde ìṣe onídàájọ́ tàbí ìyàtọ̀ tí dídé Jésù mú wá; “ìdálẹ́bi” yóò dín ìtumọ̀ náà kù jù.
- source_word: κόσμον
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó bójú mu fún κόσμος níhìn-ín, ó sì lè tọ́ka sí gbogbo ayé ènìyàn gẹ́gẹ́ bí ìlò rẹ̀ nínú Jòhánù.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: àwọn tí kò rí / àwọn tí wọ́n rí
  rationale: Ìtumọ̀ yìí pa ìbáradọ́gba àwọn participle méjèèjì àti àìdánilójú láàárín ìríran ti ara àti ti ẹ̀mí mọ́.
- source_word: βλέπωσιν
  choice: lè ríran
  rationale: “Lè ríran” jẹ́ ọ̀nà àdánidá láti sọ subjunctive lẹ́yìn ἵνα, ó sì gba ìtumọ̀ ìríran ti ara àti ti ẹ̀mí láàyè.
- source_word: τυφλοὶ
  choice: afọ́jú
  rationale: “Afọ́jú” mú àwòrán ìyípadà líle náà jáde ní kedere, láìfi ìtumọ̀ rẹ̀ mọ́ ìfọ́jú ti ara nìkan.
- source_word: γένωνται
  choice: di
  rationale: “Di” fi ìtumọ̀ ìyípadà tàbí dídé sí ipò kan hàn, dípò pé a kàn fi hàn pé irú ẹni bẹ́ẹ̀ ni wọ́n ti jẹ́ tẹ́lẹ̀.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: mo ṣe wá sínú ayé yìí
  rationale: “Wá sínú ayé yìí” jẹ́ Yorùbá àdánidá tó sì pa èdè Jòhánù nípa wíwá Jésù sínú ayé mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú Jòhánù 3:17, níbi tí a ti sọ pé Ọmọ kò wá láti dá ayé lẹ́jọ́
  choice: Lo “ìdájọ́” láìrọ̀ ọ́ tàbí mú ìforígbárí náà kúrò.
  alternative: Lo “ìpínya” tàbí “ìdálẹ́bi” láti ṣàlàyé irú àbájáde kan pàtó.
  rationale: 'Ẹsẹ náà fi dídé Jésù hàn gẹ́gẹ́ bí ohun tó mú ìyàtọ̀ onídàájọ́ ṣẹlẹ̀: àwọn tí kò rí bẹ̀rẹ̀ sí ríran, àwọn tí wọ́n rò pé wọ́n rí sì di afọ́jú. “Ìdájọ́” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Jòhánù mọ́ láìyanjú rẹ̀ ní ìkọ̀kọ̀.'
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “rí/ríran” láti pa eré ọ̀rọ̀ àti àìdánilójú láàárín ìríran ti ara àti ti ẹ̀mí mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó ní “ìdájọ́” nítorí ibẹ̀ ni àṣàyàn ọ̀rọ̀ náà ti kan.
