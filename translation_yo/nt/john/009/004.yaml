id: JHN.9.4
reference: John 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: yo
  text: Àwa gbọ́dọ̀ ṣe àwọn iṣẹ́ ẹni tí ó rán mi nígbà tí ó ṣì jẹ́ ọ̀sán; òru ń bọ̀, nígbà tí kò sí ẹni tí ó lè ṣiṣẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμᾶς
  choice: Àwa
  rationale: Ọ̀rọ̀ Gíríìkì tí SBLGNT lò jẹ́ ọ̀pọ̀ ènìyàn, ó sì túmọ̀ sí pé ‘ó pọndandan fún wa’; fífi ‘Àwa’ sí iwájú mú ìyàtọ̀ rẹ̀ sí ẹ̀dà ‘Èmi’ hàn kedere.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: ‘Gbọ́dọ̀’ sọ ìpọndandan tàbí ojúṣe ní Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: máa ṣe àwọn iṣẹ́
  rationale: ‘Ṣe àwọn iṣẹ́’ yẹra fún àtúnsọ tí kò dùn létí, ó sì pa ìbáṣepọ̀ mọ́ àwọn iṣẹ́ tí Ọlọ́run fi fún Jésù láti ṣe; ‘máa’ tún bá ìṣe tí ó ń lọ ní àkókò ọ̀sán mu.
- source_word: τοῦ πέμψαντός με
  choice: ẹni tí ó rán mi
  rationale: Ó túmọ̀ àpólà arọ́pò-orúkọ aláṣeyọrí náà lọ́nà kedere láì fi ‘Ọlọ́run’ kún ohun tí ẹsẹ̀ náà kò sọ ní tààrà.
- source_word: ἕως ἡμέρα ἐστίν
  choice: níwọ̀n ìgbà tí ilẹ̀ ṣì mọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ‘nígbà tí ó ṣì jẹ́ ọ̀sán,’ ó sì pa ìtakora ọ̀sán àti òru mọ́.
- source_word: ἔρχεται νὺξ
  choice: òru ń bọ̀
  rationale: Àkókò ìsinsìnyí Gíríìkì ní agbára ohun tí ó ń sún mọ́lé; ‘ń bọ̀’ sọ èyí ní Yorùbá àdánidá.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: nígbà tí ẹnikẹ́ni kò lè ṣiṣẹ́
  rationale: ‘Ẹnikẹ́ni kò lè’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún àìlèṣe gbogbo ènìyàn, ‘ṣiṣẹ́’ sì yẹ nítorí pé ọ̀rọ̀-ìṣe náà kò ní àfojúsùn níbí.
theological_decisions:
- issue: 'Ìyàtọ̀ àfọwọ́kọ ní ìbẹ̀rẹ̀ ẹsẹ̀: ἡμᾶς (‘àwa’) tàbí ἐμέ (‘èmi’)'
  choice: Àwa gbọ́dọ̀ máa ṣe àwọn iṣẹ́ ẹni tí ó rán mi
  alternative: Èmi gbọ́dọ̀ máa ṣe àwọn iṣẹ́ ẹni tí ó rán mi
  rationale: A tẹ̀lé SBLGNT tí a pèsè, èyí tí ó ní ἡμᾶς (‘àwa’). Nítorí pé ẹ̀dà ẹyọ ‘èmi’ gbajúmọ̀ nínú àwọn àfọwọ́kọ àti àwọn ìtumọ̀ kan, a fi í sínú àlàyé ìsàlẹ̀ láti fi ẹ̀rí hàn gbangba.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ológo, tí ó sì yé òǹkàwé òde òní ni a lò. A lo ‘ilẹ̀ ṣì mọ́’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ pé ọ̀sán ṣì wà, ní ìtakora pẹ̀lú ‘òru ń bọ̀.’ Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
