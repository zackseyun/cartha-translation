source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: yo
  text: Ó dáhùn pé, “Ta sì ni ẹni náà, Olúwa,[a] kí n lè gbàgbọ́ nínú rẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ fún ẹnì kan, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Ó dáhùn pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìtumọ̀ àpapọ̀ ọ̀rọ̀ ìtàn Gíríìkì náà, ‘ẹni náà dáhùn, ó sì wí,’ láìfi àtúnwí tí kò wọ́pọ̀ kún gbolohun.
- source_word: Καὶ τίς ἐστιν
  choice: Ta sì ni ẹni náà
  rationale: ‘Sì’ pa ipa àsopọ̀ Καὶ mọ́, ‘Ta ni’ sì tú ìbéèrè náà ní tààrà; ‘ẹni náà’ tọ́ka sí ọkùnrin tí a ń béèrè nípa rẹ̀.
- source_word: κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ àkọ́kọ́ fún κύριε, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ bí ‘ọ̀gá’; a pa àìdánilójú yìí mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: kí n lè gbà á gbọ́
  rationale: ‘Kí n lè’ fi ète ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́lẹ̀ hàn, ‘gbà á gbọ́’ sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún gbígbàgbọ́ nínú ẹni kan.
theological_decisions:
- issue: Ìtumọ̀ κύριε ṣáájú ìjẹ́wọ́ ọkùnrin náà ní ẹsẹ tó tẹ̀ lé e
  choice: Olúwa
  alternative: ọ̀gá
  rationale: κύριε lè túmọ̀ sí ‘Olúwa’ tàbí kó jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ ‘ọ̀gá.’ Àyíká ọ̀rọ̀ kò fi ìpele ìmọ̀ ọkùnrin náà hàn ní kíkún, nítorí náà a lo ‘Olúwa’ nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí ìtumọ̀ kejì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A tú àtúnwí Semitic ‘dáhùn, ó sì wí’ sí ‘dáhùn pé’ kí gbolohun lè jẹ́ àdánidá ní Yorùbá, láìyí ìtumọ̀ rẹ̀ padà.
