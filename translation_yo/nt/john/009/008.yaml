revisions:
- from: Nítorí náà, àwọn aládùúgbò rẹ̀ àti àwọn tí wọ́n ti máa ń rí i tẹ́lẹ̀ gẹ́gẹ́ bí alágbe ń sọ pé, “Ṣé kì í ṣe ẹni yìí ni ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe?”[a]
  to: Nítorí náà, àwọn aládùúgbò náà àti àwọn tí wọ́n ti máa ń rí i tẹ́lẹ̀ gẹ́gẹ́ bí alágbe ń sọ pé, “Ṣé kì í ṣe ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe ni ẹni yìí?”[a]
  rationale: Àtúnṣe náà yọ aṣojú-ìní tí kò hàn nínú Gíríìkì kúrò, mú ìbéèrè ìdánimọ̀ náà rọrùn ní Yorùbá, ó sì tún ọ̀rọ̀ ìmọ̀ èdè inú àlàyé ìsàlẹ̀ ṣe. ‘Gẹ́gẹ́ bí alágbe’ ni a pa mọ́, nítorí ó fi ìbáṣepọ̀ ìdánimọ̀ tó wà nínú ὅτι προσαίτης ἦν hàn láì fipá mú un di ìdí pàtó.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èrò Gíríìkì dáadáa: οὖν jẹ́ ìtẹ̀síwájú/àbájáde, θεωροῦντες ... τὸ πρότερον jẹ́ àwọn tí wọ́n ti rí i tẹ́lẹ̀, àti ἔλεγον ní ìṣe tí ń lọ. Síbẹ̀, ‘rẹ̀’ nínú ‘àwọn aládùúgbò rẹ̀’ kò sí ní ojú ọ̀rọ̀ Gíríìkì, nítorí náà a yọ ọ́ kúrò láti má fi ìní kún un.'
  naturalness: 'Ọ̀rọ̀ náà dára ní Yorùbá òde òní, ṣùgbọ́n ìbéèrè náà túbọ̀ rọrùn, ó sì dára sí i bí a bá gbé ‘ẹni yìí’ sí ipò kẹ́yìn: ‘Ṣé kì í ṣe ẹni tí ... ni ẹni yìí?’ A tún ṣe àtúnṣe kékeré sí gbolohun àlàyé ìsàlẹ̀ kí ó lè jẹ́ Yorùbá adayeba.'
  terminology: ‘Alágbe’ àti ‘ṣagbe’ yẹ fún προσαίτης àti προσαιτῶν. ‘Ọ̀rọ̀-ìṣe alábápín’ jẹ́ ọ̀rọ̀ ìmọ̀ èdè tí ó péye ju ‘ọ̀rọ̀-ìṣe alápín’ lọ fún participle.
  issues:
  - severity: low
    issue: ‘rẹ̀’ ni ‘àwọn aládùúgbò rẹ̀’ ń fi ìní kún ọrọ̀ náà.
    rationale: Gíríìkì náà ní οἱ γείτονες (‘àwọn aládùúgbò náà’) láì sí aṣojú-ìní. Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè jẹ́ kí ìtọ́kasí náà hàn, ìtumọ̀ tó sún mọ́ ojú ọ̀rọ̀ yẹ kí ó má fi ‘rẹ̀’ kún un.
  - severity: low
    issue: Ìṣètò ìbéèrè náà tún ‘ẹni’ ṣe ní ọ̀nà tí kò rọrùn jù.
    rationale: ‘Ṣé kì í ṣe ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe ni ẹni yìí?’ jẹ́ ìbéèrè Yorùbá tó mọ́, ó sì pa ìdánimọ̀ ẹni náà mọ́ gẹ́gẹ́ bí Gíríìkì.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ lò ‘ọ̀rọ̀-ìṣe alápín.’
    rationale: ‘Ọ̀rọ̀-ìṣe alábápín’ jẹ́ ọ̀rọ̀ ìmọ̀ èdè Yorùbá tó péye fún participle; a tún mú ìbẹ̀rẹ̀ gbolohun náà rọrùn.
  revised_text: Nítorí náà, àwọn aládùúgbò náà àti àwọn tí wọ́n ti máa ń rí i tẹ́lẹ̀ gẹ́gẹ́ bí alágbe ń sọ pé, “Ṣé kì í ṣe ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe ni ẹni yìí?”[a]
