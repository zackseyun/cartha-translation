  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo ‘ṣagbe’ fún ìṣe bíbẹ̀bẹ̀ fún owó tàbí ìrànlọ́wọ́.
