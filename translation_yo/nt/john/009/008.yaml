id: JHN.9.8
reference: John 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: yo
  text: Nítorí náà, àwọn aládùúgbò náà àti àwọn tí wọ́n ti máa ń rí i tẹ́lẹ̀ gẹ́gẹ́ bí alágbe ń sọ pé, “Ṣé kì í ṣe ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe ni ẹni yìí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìtumọ̀ tààrà sí i, “Ṣé kì í ṣe ẹni yìí ni ẹni tí ń jókòó tí ó sì ń ṣagbe?” Gíríìkì lo àwọn ọ̀rọ̀-ìṣe alábápín (“tí ń jókòó” àti “tí ń ṣagbe”) láti dá a mọ̀ nípa ohun tí ó máa ń ṣe tẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde hàn.
- source_word: γείτονες
  choice: àwọn aládùúgbò rẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn tí ń gbé nítòsí rẹ̀; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: àwọn tí wọ́n ti máa ń rí i tẹ́lẹ̀
  rationale: Àkópọ̀ yìí tọ́ka sí àwọn tí wọ́n mọ̀ ọ́n nípasẹ̀ rírí i ní àkókò ṣáájú; ‘ti máa ń rí i’ tún mú ìṣe àṣà wọn jáde.
- source_word: ὅτι προσαίτης ἦν
  choice: gẹ́gẹ́ bí alágbe
  rationale: Èyí fi bí wọ́n ṣe mọ̀ ọ́n tẹ́lẹ̀ hàn láì fi ìtumọ̀ ìdí pàtó lé ὅτι lórí.
- source_word: ἔλεγον
  choice: ń sọ pé
  rationale: Ìṣe aláìparí náà lè fi ọ̀rọ̀ tí ń lọ lọ́wọ́ láàárín àwọn ènìyàn hàn.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ṣé kì í ṣe ẹni yìí ni
  rationale: Ìbéèrè náà ń retí ìdáhùn ìfọwọ́sí, bí ìṣètò Gíríìkì ṣe fi hàn.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: ẹni tí ó máa ń jókòó tí ó sì ń ṣagbe
  rationale: Àwọn participle náà dá ẹni náà mọ̀ nípasẹ̀ ìṣe àṣà rẹ̀ tẹ́lẹ̀; ‘máa ń’ mú àṣà yẹn hàn ní Yorùbá àdánidá.
theological_decisions: []
