id: JHN.9.7
reference: John 9:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Lọ wẹ̀ ní adágún Sílóámù” (èyí tí a túmọ̀ sí “Ẹni tí a rán”[a]). Nítorí náà, ó lọ, ó sì wẹ̀, ó sì padà wá, ó ń ríran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí ó túmọ̀ sí ‘Ẹni tí a rán.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Lọ
  rationale: Àṣẹ kíkúrò tàbí lílọ ni ọ̀rọ̀ náà; “Lọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìtẹ̀lé àṣẹ náà mu.
- source_word: νίψαι / ἐνίψατο
  choice: wẹ̀ / wẹ̀
  rationale: νίπτω ń tọ́ka sí fífọ ara tàbí apá kan ara, kì í ṣe dandan pé kí ènìyàn wẹ̀ pátápátá. “Wẹ̀” bá ọ̀rọ̀ náà mu, ipò ọ̀rọ̀ náà sì fi hàn pé ara rẹ̀ ni ọkùnrin náà wẹ̀.
- source_word: εἰς τὴν κολυμβήθραν
  choice: ní adágún
  rationale: κολυμβήθρα jẹ́ adágún tàbí ibi ìkó omi. Pẹ̀lú ọ̀rọ̀ “wẹ̀,” “ní adágún” jẹ́ èdè Yorùbá àdánidá, láìfi dandan kún un pé ó wọ inú adágún náà.
- source_word: Σιλωάμ
  choice: Sílóámù
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: èyí tí a túmọ̀ sí “Ẹni tí a rán”
  rationale: ἑρμηνεύεται mú àlàyé ìtumọ̀ orúkọ náà wọlé, Ἀπεσταλμένος sì jẹ́ àpèjúwe ẹni tí a ti rán. “Ẹni tí a rán” sọ ìtumọ̀ náà ní Yorùbá tó ṣe kedere láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ọ̀rọ̀ náà fi àbájáde ìgbọ́ràn sí àṣẹ náà hàn, “Nítorí náà” sì pa ìsopọ̀ ìtàn yẹn mọ́.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Aoristi ìtàn náà sọ pé ó kúrò lọ; “ó lọ” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye.
- source_word: ἦλθεν βλέπων
  choice: ó sì padà dé, ó ń ríran
  rationale: ἦλθεν sọ pé ó dé wá, ipò ìtàn sì fi hàn pé ó padà dé; βλέπων fi ipò tuntun rẹ̀ hàn nígbà tó dé. “ó ń ríran” pa àwòrán participle náà mọ́ láìsọ ọ́ di àlàyé gígùn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àlàyé orúkọ Sílóámù láìṣe àfikún àmì ẹ̀kọ́ ìgbàgbọ́ tí kò fara hàn gbangba
  choice: Fi àlàyé “èyí tí a túmọ̀ sí ‘Ẹni tí a rán’” sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí Gíríìkì ṣe ní i.
  alternative: Ṣàlàyé rẹ̀ síwájú sí i gẹ́gẹ́ bí àmì pé Jésù ni Ẹni tí Baba rán.
  rationale: Gíríìkì fúnra rẹ̀ ní àlàyé orúkọ náà, nítorí náà ó yẹ kó wà nínú ọ̀rọ̀ pàtàkì. Síbẹ̀, ẹsẹ yìí kò ṣàlàyé ìbáṣepọ̀ àmì náà ní kedere, nítorí náà a kò mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan wọlé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá, a sì kọ orúkọ Sílóámù ní ìbámu pẹ̀lú ìró Yorùbá.
