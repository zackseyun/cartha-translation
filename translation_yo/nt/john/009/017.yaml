source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: yo
  text: Nítorí náà, wọ́n tún bi ọkùnrin afọ́jú náà pé, “Kí ni ìwọ sọ nípa rẹ̀, níwọ̀n bí ó ti là ojú rẹ?” Ó sì dáhùn pé, “Wòlíì ni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè yìí mọ́ ìjíròrò tó ṣáájú, ó sì pa ìṣàn ìtumọ̀ àti ìtàn mọ́.
- source_word: τῷ τυφλῷ
  choice: ọkùnrin afọ́jú náà
  rationale: Àjẹtífù Gíríìkì náà dúró gẹ́gẹ́ bí orúkọ; gbólóhùn Yorùbá yìí jẹ́ kedere, kò sì fi èrò míì kún ohun tí ẹsẹ náà sọ.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé wọ́n tún béèrè lọ́wọ́ rẹ̀ nínú ìfọ̀rọ̀wánilẹ́nuwò náà.
- source_word: Τί σὺ λέγεις
  choice: Kí ni ìwọ sọ
  rationale: Lílo “ìwọ” ní kedere pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ σὺ mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bá περί pẹ̀lú ọ̀rọ̀ inú genitive mu.
- source_word: ὅτι
  choice: níwọ̀n bí
  rationale: Nínú àyíká yìí, ὅτι ń fi ìdí ìbéèrè náà hàn; “níwọ̀n bí” pa ìtumọ̀ ìdí tàbí ipò náà mọ́ láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ jù.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: ó ti la ojú rẹ
  rationale: “La ojú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣí ojú ẹni, “ti” sì fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ wà hàn.
- source_word: Προφήτης ἐστίν
  choice: Wòlíì ni
  rationale: Àkójọpọ̀ “X ni” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánimọ̀ tàbí irú ẹni; “wòlíì” kò fi ipò akọ́lé pàtó kan lé ọ̀rọ̀ Gíríìkì náà lórí.
theological_decisions:
- issue: Bóyá Προφήτης jẹ́ akọ́lé pàtó tàbí orúkọ tó túmọ̀ sí ọ̀kan lára àwọn wòlíì
  choice: Wòlíì ni
  alternative: Òun ni Wòlíì náà
  rationale: Àyíká ìtàn náà fi hàn pé ọkùnrin náà ń sọ bí ó ṣe mọ Jésù sí i ní ìpele yìí. “Wòlíì ni” pa àfojúsùn náà mọ́, kò sì sọ ọ́ di akọ́lé Mèsáyà pàtó tí Gíríìkì kò fi hàn gbangba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. Ìtẹnumọ́ σὺ wà nínú “ìwọ,” nítorí náà kò sí ìdí fún àlàyé ìsàlẹ̀ ojú ìwé.
