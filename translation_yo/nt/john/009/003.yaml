  to: Jésù dáhùn pé, “Kì í ṣe ọkùnrin yìí ló dẹ́ṣẹ̀, bẹ́ẹ̀ ni kì í ṣe àwọn òbí rẹ̀; ṣùgbọ́n kí àwọn iṣẹ́ Ọlọ́run lè farahàn nínú rẹ̀.”[a]
