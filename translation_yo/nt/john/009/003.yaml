reference: John 9:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: yo
  text: Jésù dáhùn pé, “Kì í ṣe ọkùnrin yìí ló dẹ́ṣẹ̀, bẹ́ẹ̀ ni kì í ṣe àwọn òbí rẹ̀; ṣùgbọ́n kí àwọn iṣẹ́ Ọlọ́run lè farahàn nínú rẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé túmọ̀ sí “nípasẹ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “nínú rẹ̀,” ṣùgbọ́n ó lè tọ́ka sí ẹni tí a fi iṣẹ́ Ọlọ́run hàn nípasẹ̀ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ìdáhùn nínú ìjíròrò.
- source_word: Οὔτε ... οὔτε
  choice: Kì í ṣe pé ... bẹ́ẹ̀ ni kì í ṣe pé
  rationale: Ìṣètò yìí jẹ́ ti Yorùbá àdánidá, ó sì tẹnu mọ́ ìkọ̀sílẹ̀ àwọn àṣàyàn méjèèjì.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó mú ẹni tí Jésù ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere láìfi ìtumọ̀ tuntun kún un.
- source_word: ἥμαρτεν
  choice: dẹ́ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé, tí ó sì ṣe kedere fún ṣíṣe ẹ̀ṣẹ̀.
- source_word: γονεῖς
  choice: àwọn òbí
  rationale: Èyí túmọ̀ γονεῖς ní ṣókí àti ní ti àdánidá.
- source_word: ἀλλ’ ἵνα
  choice: ṣùgbọ́n èyí ṣẹlẹ̀ kí
  rationale: A fi ‘èyí ṣẹlẹ̀’ kún un láti mú ìsopọ̀ gbólóhùn náà ṣe kedere ní Yorùbá; àlàyé ìsàlẹ̀ fi ọ̀rọ̀ Gíríìkì gangan hàn, tí kò sọ àwọn ọ̀rọ̀ wọ̀nyí ní tààràtà.
- source_word: φανερωθῇ
  choice: lè farahàn
  rationale: Ó pa ìtumọ̀ ohun tí a mú wá sí ìmọ́lẹ̀ mọ́, ó sì bá ìṣètò ἵνα pẹ̀lú subjunctive mu.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: àwọn iṣẹ́ Ọlọ́run
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa ọ̀nà tí Jòhánù gbà ń sọ nípa iṣẹ́ Ọlọ́run mọ́.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ fún ἐν αὐτῷ, ó sì pa àìdánilójú mọ́ bóyá ibi tí iṣẹ́ náà ti farahàn ni tàbí ọ̀nà tí a fi hàn án.
theological_decisions:
- issue: Bóyá Jésù ń kọ gbogbo ìbáṣepọ̀ láàárín ẹ̀ṣẹ̀ àti ìjìyà, tàbí pé ó ń kọ ìdí tí àwọn ọmọ-ẹ̀yìn dá sílẹ̀ fún ọ̀ràn pàtó yìí nìkan
  choice: A sọ ìkọ̀sílẹ̀ náà nípa ọkùnrin yìí àti àwọn òbí rẹ̀ nínú ọ̀ràn yìí.
  alternative: Ṣíṣe àtúnṣọ tó sọ pé ìjìyà kò ní ìbáṣepọ̀ pẹ̀lú ẹ̀ṣẹ̀ rárá ní gbogbo ipò.
  rationale: Ẹsẹ náà dáhùn ìbéèrè pàtó àwọn ọmọ-ẹ̀yìn; kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ àgbáyé kan kún ohun tí ọ̀rọ̀ náà kò sọ.
- issue: Bóyá ἵνα ń fi ète hàn tàbí àbájáde lásán
  choice: A lò ‘kí ... lè’ láti pa ìtumọ̀ ète mọ́.
  alternative: Lílo ọ̀rọ̀ tó túmọ̀ sí ‘èyí sì yọrí sí pé’ tàbí yí àmì ìdákẹ́jẹ padà láti yẹra fún ète.
  rationale: Ìtumọ̀ ète ni ìkàwé tó ṣe tààrà jù lọ fún ἵνα pẹ̀lú subjunctive; a kò sì fi àlàyé míì kún un nípa bí Ọlọ́run ṣe fa ipò náà.
- issue: Bóyá ἐν αὐτῷ túmọ̀ sí ‘nínú rẹ̀’ tàbí ‘nípasẹ̀ rẹ̀’
  choice: nínú rẹ̀
  alternative: nípasẹ̀ rẹ̀
  rationale: ‘Nínú rẹ̀’ tẹ̀ lé Gíríìkì ní tààrà, ó sì jẹ́ kí àìdánilójú nípa ibi tàbí ọ̀nà ìfarahàn iṣẹ́ Ọlọ́run wà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà ní ọlá, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ìṣètò Yorùbá àdánidá fún οὔτε ... οὔτε, nígbà tí a pa ìforígbárí ẹ̀kọ́ inú gbólóhùn ἵνα àti àìdánilójú ἐν αὐτῷ mọ́.
