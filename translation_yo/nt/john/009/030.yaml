  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: yo
  text: 'Ọkùnrin náà dá wọn lóhùn pé, “Èyí gan-an ni ohun ìyanu náà[a]: ẹ̀yin kò mọ ibi tí ó ti wá[b], síbẹ̀ ó là ojú mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ohun ìyàlẹ́nu nínú èyí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ibi tí ó ti ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Ọkùnrin náà dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọkùnrin náà fèsì sí wọn, láìfi agbára míì kún ọ̀rọ̀ Gíríìkì.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Ohun ìyanu nínú èyí ni pé
  rationale: Ó pa ìtẹnumọ́ ohun tí wọ́n ń jíròrò mọ́, ó sì fi ìyàlẹ́nu àti ìfọ̀rọ̀ṣẹ̀lẹ̀ inú θαυμαστόν hàn ní Yorùbá tó ṣe déédéé.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: ẹ̀yin kò mọ
  rationale: Ẹ̀yin jẹ́ ọ̀pọ̀ ènìyàn, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ tó hàn gbangba nínú Gíríìkì mọ́.
- source_word: πόθεν ἐστίν
  choice: ibi tí ó ti wá
  rationale: Ó sọ orísun tàbí ibi tí ẹni náà ti wá ní ọ̀nà Yorùbá àdánidá, láìdá irú orísun náà lẹ́jọ́.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: síbẹ̀ ó la ojú mi
  rationale: Síbẹ̀ mú ìtakora àti ìfọ̀rọ̀ṣẹ̀lẹ̀ inú àyíká ọ̀rọ̀ jáde; “ó la ojú mi” sì tọ́ka sí ìwòsàn ojú gidi láìfi ìtumọ̀ ẹ̀mí kún un ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ tó lè wà nínú “ó la ojú mi” nínú Ìhìn Rere Jòhánù
  choice: Pa ọ̀rọ̀ ìwòsàn ojú gidi náà mọ́, kí ìtumọ̀ nípa ìríran ẹ̀mí lè jáde láti inú àyíká ọ̀rọ̀.
  alternative: Túmọ̀ ọ́ ní ọ̀nà tí yóò sọ ìmọ́lẹ̀ tàbí òye ẹ̀mí ní gbangba.
  rationale: Ohun tí ẹsẹ̀ náà ń tọ́ka sí lẹ́sẹ̀kẹsẹ̀ ni ìmúláradá ojú ọkùnrin náà. Àkòrí ìríran àti ìfọ́jú ẹ̀mí wà nínú Jòhánù, ṣùgbọ́n kò yẹ kí ìtumọ̀ fi í sínú ọ̀rọ̀ náà ní agbára.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe déédéé, tó ní iyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. Àmì ohùn ni a lò níbi tó bá yẹ; “ẹ̀yin” pa ìtẹnumọ́ àti ọ̀pọ̀ ènìyàn nínú Gíríìkì mọ́.
