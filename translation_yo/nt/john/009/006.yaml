  source_fidelity: 'Ìtumọ̀ pàtàkì náà fara mọ́ Gíríìkì: ó sọ ìtẹ̀lé ìṣe náà, títutọ́ sí ilẹ̀, ṣíṣe ẹrẹ̀ láti inú itọ́, àti fífi ẹrẹ̀ náà pa ojú ọkùnrin náà. Ṣùgbọ́n àlàyé ìsàlẹ̀ ojú-ewé lọwọlọwọ fi ‘kun ojú’ hàn gẹ́gẹ́ bí àṣàyàn, èyí tí kò dá ìṣe ἐπέχρισεν/ἐπὶ τοὺς ὀφθαλμούς lójú dáadáa, nítorí ó lè túmọ̀ sí pípa ojú náà kún.'
