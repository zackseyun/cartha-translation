id: JHN.9.6
reference: John 9:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí, ó tutọ́ sí ilẹ̀, ó sì fi itọ́ náà ṣe ẹrẹ̀; ó sì fi ẹrẹ̀ náà pa ojú ọkùnrin náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ ìṣe Gíríìkì náà tún lè túmọ̀ sí “yan ẹni ní òróró”; níbí, ó ń tọ́ka sí fífi ẹrẹ̀ pa ojú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí
  rationale: Aorist participle náà fi hàn pé ọ̀rọ̀ sísọ ṣáájú àwọn ìṣe tó tẹ̀ lé e; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àkókò mọ́.
- source_word: ἔπτυσεν χαμαί
  choice: ó tutọ́ sí ilẹ̀
  rationale: Èyí sọ ìṣe náà ní kedere, ó sì túmọ̀ χαμαί gẹ́gẹ́ bí ‘sí ilẹ̀’ ní Yorùbá àdánidá.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: ó fi itọ́ náà ṣe ẹrẹ̀
  rationale: Ẹrẹ̀ dára ju ‘amọ̀’ lọ ní àyíká yìí nítorí πηλός ń tọ́ka sí ilẹ̀ tútù tí itọ́ dá sílẹ̀; ‘fi … ṣe’ tún pa ìtumọ̀ ἐκ mọ́ lọ́nà àdánidá.
- source_word: ἐπέχρισεν
  choice: ó fi … pa
  rationale: Nínú Yorùbá, fífi ohun kan ‘pa’ ara ń sọ fífi ohun tútù tàbí ohun líle díẹ̀ rọ̀ mọ́ ara. Ó mú ìṣe ti ara hàn láìfi ìtumọ̀ àṣà ẹ̀sìn kún un.
- source_word: αὐτοῦ … ἐπὶ τοὺς ὀφθαλμούς
  choice: ojú ọkùnrin náà
  rationale: Orúkọ náà tún ẹni tí a bí ní afọ́jú nínú àyíká ọ̀rọ̀ yìí sọ ní kedere, ó sì yẹra fún àìdánilójú tí aṣojú-orúkọ ‘rẹ̀’ lè mú wá ní Yorùbá.
- source_word: τὸν πηλόν
  choice: ẹrẹ̀ náà
  rationale: Atọ́ka náà ń tọ́ka padà sí ẹrẹ̀ tí ó ṣẹ̀ṣẹ̀ ṣe, nítorí náà ‘náà’ pa agbára àtọ́ka ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ àṣà tàbí àmì ẹ̀sìn tí ἐπέχρισεν lè ní
  choice: A lo ọ̀rọ̀ ìṣe ti ara, ‘ó fi ẹrẹ̀ náà pa ojú,’ nínú ẹsẹ̀ pàtàkì.
  alternative: ‘ó fi ẹrẹ̀ náà kun ojú rẹ̀’ tàbí ‘ó fi ẹrẹ̀ náà ṣe àmì òróró sí ojú rẹ̀’
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí fífi ohun kan pa ara tàbí fífi òróró yan ẹni. Nítorí ohun tí a fi sí ojú jẹ́ ẹrẹ̀, ọ̀rọ̀ ìṣe ti ara ni àyíká náà béèrè. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ kejì tí ó ṣeé ṣe mọ́ láìfi ẹ̀kọ́ ìsìn kan tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ẹrẹ̀’ àti ‘itọ́’ jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye; semicolon náà yà ṣíṣe ẹrẹ̀ sílẹ̀ kúrò ní fífi rẹ̀ pa ojú.
