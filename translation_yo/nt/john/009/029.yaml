source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: yo
  text: Àwa mọ̀ pé Ọlọ́run ti sọ̀rọ̀ sí Mósè; ṣùgbọ́n ní ti ọkùnrin yìí, àwa kò mọ̀ ibi tí ó ti wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi tí ó ti ń bọ̀.” Nínú Ìhìn Rere Jòhánù, ìbéèrè nípa ibi tí Jésù ti wá lè ní ìtumọ̀ ojoojúmọ́, ó sì lè tún ní ìtumọ̀ tó jinlẹ̀ nípa orísun rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere fi ìtẹnumọ́ àti ìyàtọ̀ hàn; “Àwa” dá ìyàtọ̀ sí “ọkùnrin yìí” dúró lọ́nà àdánidá ní Yorùbá.
- source_word: οἴδαμεν
  choice: mọ̀
  rationale: “Mọ̀” túmọ̀ sí níní ìmọ̀ tàbí ìdánilójú, ó sì yẹ kí a lò ó ní ìṣọ̀kan fún ìgbà méjèèjì tí ọ̀rọ̀ náà fara hàn.
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: Ọlọ́run ti bá Mósè sọ̀rọ̀
  rationale: “Ti bá ... sọ̀rọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run ti sọ̀rọ̀ sí Mósè; “ti” tún mú kí ipa ìṣe tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí ó ṣì ṣe pàtàkì hàn.
- source_word: τοῦτον δὲ
  choice: ṣùgbọ́n ní ti ọkùnrin yìí
  rationale: Gbólóhùn yìí pa ìtakora àti yíyí àfiyèsí sí ẹni tí wọ́n ń sọ̀rọ̀ nípa rẹ̀ mọ́, ó sì dá ìró jíjìnnà tàbí àìfọwọ́sí dúró láì fi ẹ̀gàn kún un.
- source_word: οὐκ οἴδαμεν
  choice: a kò mọ
  rationale: Ó tún ọ̀rọ̀ ìmọ̀ inú apá àkọ́kọ́ ṣe ní ọ̀nà tí ó ṣe kedere, tí ó sì bójú mu fún Yorùbá.
- source_word: πόθεν ἐστίν
  choice: ibi tí ó ti wá
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí ibi ìpilẹ̀ṣẹ̀ ẹni ní ìtumọ̀ ojoojúmọ́ tàbí sí orísun rẹ̀ ní ìtumọ̀ jíjinlẹ̀; “ibi tí ó ti wá” pa ìṣòro ìtumọ̀ méjèèjì yìí mọ́.
theological_decisions:
- issue: Ìtumọ̀ orísun Jésù nínú πόθεν ἐστίν
  choice: ibi tí ó ti wá
  alternative: ibi tí ó ti ń bọ̀; ohun tí ó jẹ́ orísun rẹ̀
  rationale: Nínú Ìhìn Rere Jòhánù, ọ̀rọ̀ nípa ibi tí Jésù ti wá lè ní ìtumọ̀ ibi ìbí tàbí ìbùgbé, ó sì tún lè ní ìtumọ̀ nípa orísun àti àṣẹ rẹ̀ láti ọ̀dọ̀ Ọlọ́run. A kò yan ọ̀kan lára wọn ní pàtó, kí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ àti àfiwé ìtàn náà lè dúró.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àmì ohùn wà níbi tí ó yẹ. “Ọkùnrin yìí” pa ìró jíjìnnà àwọn olùsọ̀rọ̀ mọ́ láì sọ ọ́ di ẹ̀gàn ju ohun tí Gíríìkì sọ lọ.
