id: JHN.9.1
reference: John 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: yo
  text: Nígbà tí ó ń kọjá lọ[a], ó rí ọkùnrin kan tí ó jẹ́ afọ́jú láti ìbí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ti ń kọjá lọ”; participle Gíríìkì náà fi hàn pé Jésù ń lọ kọjá nígbà tí ó rí ọkùnrin náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Bí … sì
  rationale: Àsopọ̀ “sì” ń tẹ̀síwájú nínú ìtàn náà, nígbà tí “bí … ti” darapọ̀ mọ́ participle náà lọ́nà àdánidá ní Yorùbá.
- source_word: παράγων
  choice: bí ó ti ń kọjá lọ
  rationale: Ìtumọ̀ yìí pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì fi hàn pé ìkọjá lọ náà ń ṣẹlẹ̀ nígbà tí ó rí ọkùnrin náà.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ tààrà fún ὁράω ni “rí”; kò fi ìtumọ̀ àfikún bí “ṣàkíyèsí” kún un.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος lè túmọ̀ sí ènìyàn, ọ̀rọ̀ inú ìtàn yìí tọ́ka sí ọkùnrin pàtó kan.
- source_word: τυφλὸν
  choice: tí ó ti fọ́jú
  rationale: Gbólóhùn aláṣe-ìṣe yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá láti ṣàpèjúwe ipò afọ́jú ọkùnrin náà.
- source_word: ἐκ γενετῆς
  choice: láti ìgbà ìbí
  rationale: Ó túmọ̀ sí pé afọ́jú náà ti wà láti ìbí, láìṣàfikún ìdí tàbí àlàyé ìṣègùn.
theological_decisions:
- issue: Ìtumọ̀ akọ tàbí àpapọ̀ fún ἄνθρωπον
  choice: ọkùnrin kan
  alternative: ènìyàn kan
  rationale: Ọ̀rọ̀ náà lè jẹ́ àpapọ̀ ní àwọn àyíká mìíràn, ṣùgbọ́n ẹni pàtó nínú ìtàn yìí jẹ́ ọkùnrin; “ọkùnrin kan” bá orísun àti àyíká mu.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn níbi tó bá yẹ. Orúkọ Jésù wà nínú àlàyé ìsàlẹ̀ nítorí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ tọ́ka sí nínú àyíká, ṣùgbọ́n a kò fi í kún ọ̀rọ̀ ẹsẹ̀ náà.
