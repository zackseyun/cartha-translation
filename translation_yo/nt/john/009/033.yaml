  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: yo
  text: Ká ní ọkùnrin yìí kò ti ọ̀dọ̀ Ọlọ́run wá[a], kò lè ṣe ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí kò ṣe pé ọkùnrin yìí ti ọ̀dọ̀ Ọlọ́run wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ
  choice: Ká ní ... kò
  rationale: Ọ̀nà yìí fi ìtumọ̀ ipò tí kò bá òtítọ́ mu hàn ní Yorùbá àdánidá, ó sì pa ìṣètò ‘bí ... kò bá’ mọ́ dípò lílo gbólóhùn ‘bí kò ṣe pé’ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἦν
  choice: ti ... wá
  rationale: Ní ìṣọ̀kan pẹ̀lú ‘Ká ní,’ ọ̀rọ̀ yìí ń fi ipò àròsọ tí kò bá òtítọ́ mu hàn; Yorùbá kò nílò ọ̀nà ọ̀rọ̀-ìṣe ọ̀tọ̀ bí ‘were’ Gẹ̀ẹ́sì.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí Jésù, ẹni ọkùnrin tí wọ́n ti ń sọ̀rọ̀ nípa rẹ̀; ‘ọkùnrin yìí’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: παρὰ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó pa ìtumọ̀ orísun mọ́ ní tààràtà láì túmọ̀ rẹ̀ sí ‘Ọlọ́run rán’ tàbí ‘Ọlọ́run fún ní àṣẹ,’ èyí tí yóò fi àlàyé kún ọ̀rọ̀ Gíríìkì.
- source_word: οὐκ ἠδύνατο
  choice: kò lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ṣókí láti sọ àìlágbára láti ṣe ohun kan.
- source_word: ποιεῖν
  choice: ṣe
  rationale: ‘Ṣe’ pa ìtumọ̀ gbòòrò ποιέω mọ́, ó sì yẹ ní àyíká iṣẹ́ àmì yìí láì fi ‘ṣe iṣẹ́ ìyanu’ kún ohun tí ẹsẹ náà kò sọ ní pàtó.
- source_word: οὐδέν
  choice: ohunkóhun
  rationale: Pẹ̀lú ‘kò lè,’ ọ̀rọ̀ yìí fi àìlágbára pátápátá hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘ti ọ̀dọ̀ Ọlọ́run wá’ nípa Jésù
  choice: Pa gbólóhùn orísun náà mọ́ gẹ́gẹ́ bí ‘ti ọ̀dọ̀ Ọlọ́run wá.’
  alternative: ‘Ọlọ́run rán an’ tàbí ‘Ọlọ́run fún un ní àṣẹ.’
  rationale: παρὰ θεοῦ lè tọ́ka sí orísun tàbí ibi tí ẹni ti wá, ṣùgbọ́n kò sọ ní pàtó pé ‘rán’ tàbí ‘fún ní àṣẹ.’ Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láì pinnu rẹ̀ ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ká ní’ ń sọ ipò àròsọ tí kò bá òtítọ́ mu lọ́nà àdánidá; àmi ohùn ni a lò ní kíkún níbi tí ó yẹ.
