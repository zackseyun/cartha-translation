  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: yo
  text: Àwọn kan lára àwọn Farisí tí wọ́n wà pẹ̀lú rẹ̀ gbọ́ nǹkan wọ̀nyí, wọ́n sì wí fún un pé, “Àwa náà kì í ṣe afọ́jú, àbí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìbéèrè náà bẹ̀rẹ̀ pẹ̀lú μή ní Gíríìkì; ọ̀nà yìí sábà máa ń retí ìdáhùn òdì, ìyẹn, “Bẹ́ẹ̀ kọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: gbọ́
  rationale: Ọ̀rọ̀ yìí sọ pé wọ́n gbọ́ ohun tí Jésù sọ; “gbọ́” ni ìtumọ̀ àdánidá nínú ìtàn yìí.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Àwọn kan lára àwọn Farisí
  rationale: Ẹ̀yà ọ̀rọ̀ ἐκ pẹ̀lú ọ̀rọ̀ olùní fi hàn pé kì í ṣe gbogbo àwọn Farisí, bí kò ṣe àwọn kan lára wọn.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ hàn, ó sì tọ́ka sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ láì fi kún un pé ọ̀rọ̀ nìkan ni.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: tí wọ́n wà pẹ̀lú rẹ̀
  rationale: Ó dá ìtumọ̀ gbólóhùn alápejuwe náà dúró ní Yorùbá àdánidá.
- source_word: εἶπον αὐτῷ
  choice: wọ́n sì wí fún un pé
  rationale: Ó tẹ̀lé ìtumọ̀ λέγω, nígbà tí àyọlò tó tẹ̀ lé e fúnra rẹ̀ fi hàn pé ìbéèrè ni.
- source_word: Μὴ
  choice: kì í ṣe … àbí?
  rationale: Ìbéèrè tí μή bẹ̀rẹ̀ sábà máa ń retí ìdáhùn òdì; ìbéèrè afárá “àbí?” pẹ̀lú gbólóhùn òdì mú ìfojúsọ́nà yẹn jáde ní Yorùbá.
- source_word: καὶ
  choice: náà
  rationale: Ó so “àwa” mọ́ àwọn afọ́jú tí a ti mẹ́nu kàn tẹ́lẹ̀, ìyẹn “àwa pẹ̀lú.”
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Lílò arọ́pò-orúkọ ní kedere pa ìtẹnumọ́ tó wà nínú Gíríìkì mọ́.
- source_word: τυφλοί
  choice: afọ́jú
  rationale: A pa ọ̀rọ̀ àwòrán náà mọ́ láì fi “nípa ẹ̀mí” kún un; àyíká ló ṣàlàyé ìtumọ̀ àpèjúwe rẹ̀.
- source_word: ἐσμεν
  choice: kì í ṣe
  rationale: A ṣe ọ̀rọ̀ ìṣe ìwà ní ọ̀nà òdì gẹ́gẹ́ bí ìbéèrè Gíríìkì ṣe nílò, ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ ìtumọ̀ àpèjúwe τυφλοί di mímọ̀ pé “afọ́jú nípa ẹ̀mí”
  choice: A fi “afọ́jú” sílẹ̀ láì fi “nípa ẹ̀mí” kún un nínú ọ̀rọ̀ pàtàkì.
  alternative: afọ́jú nípa ẹ̀mí
  rationale: Àyíká fi hàn pé ìfọ́jú àpèjúwe ni wọ́n ń sọ, ṣùgbọ́n Gíríìkì kò fi àlàyé kankan kún ọ̀rọ̀ náà. Èyí pa ìfọ̀rọ̀ṣọ̀rọ̀ àti ìyọ́nú ọ̀rọ̀ inú Jòhánù mọ́ láì yanju rẹ̀ nípasẹ̀ àfikún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá bá èdè àdánidá mu. Ohùn náà bójú mu, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. “Wí fún un pé” ní ìforúkọsílẹ̀ Bíbélì díẹ̀ ṣùgbọ́n ó ṣì ṣe kedere; “kì í ṣe … àbí?” ń gbé ìbéèrè tó retí ìdáhùn òdì jáde.
