  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: yo
  text: Àwọn òbí rẹ̀ sọ nǹkan wọ̀nyí nítorí ẹ̀rù àwọn Júù[a] ń bà wọ́n; nítorí àwọn Júù ti jọ fohùn ṣọ̀kan tẹ́lẹ̀ pé bí ẹnikẹ́ni bá jẹ́wọ́ rẹ̀ gẹ́gẹ́ bí Mèsáyà[b], kí a lé ẹni náà jáde kúrò nínú sínágọ́gù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “àwọn Júù.” Nínú àyíká yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà ń tọ́ka sí àwọn aláṣẹ Júù, kì í ṣe gbogbo àwọn Júù láìsí ìyàtọ̀.'
    reason: cultural_note
  - marker: b
    text: Tàbí “jẹ́wọ́ rẹ̀ gẹ́gẹ́ bí Kristi,” tàbí “fọwọ́ sí i pé òun ni Kristi náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ
  choice: Àwọn òbí rẹ̀ sọ nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀-orúkọ ταῦτα mọ́ ní ‘nǹkan wọ̀nyí,’ ó sì lo ọ̀rọ̀ Yorùbá àdánidá fún ‘àwọn òbí rẹ̀ sọ.’
- source_word: ὅτι ἐφοβοῦντο
  choice: nítorí ẹ̀rù ... ń bà wọ́n
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ ìbẹ̀rù tí ó ń bá a lọ, gẹ́gẹ́ bí imperfect ἐφοβοῦντο ṣe fi hàn.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ‘àwọn olórí Júù’; àlàyé ìṣàkóso sínágọ́gù wà ní àlàyé ìsàlẹ̀.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: nítorí àwọn Júù ti jọ fohùn ṣọ̀kan tẹ́lẹ̀
  rationale: ‘Ti ... tẹ́lẹ̀’ fi ìṣe tí a ti parí ṣáájú hàn, ‘jọ fohùn ṣọ̀kan’ sì mú ìpinnu àpapọ̀ συντίθεμαι jáde láì sọ ọ́ di ìdìtẹ̀.
- source_word: ἵνα ἐάν τις
  choice: pé bí ẹnikẹ́ni bá
  rationale: Èyí sọ àkóónú àdéhùn náà ní Yorùbá tó ṣe kedere àti àdánidá.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: bá jẹ́wọ́ rẹ̀ gẹ́gẹ́ bí Mèsáyà
  rationale: ‘Jẹ́wọ́’ mú ìtumọ̀ ìjẹ́wọ́ tàbí ìfọwọ́sí ní gbangba jáde; ‘Mèsáyà’ fi hàn pé χριστός jẹ́ oyè níhìn-ín.
- source_word: ἀποσυνάγωγος γένηται
  choice: wọn yóò lé ẹni náà jáde kúrò nínú sínágọ́gù
  rationale: Ó tú àbájáde ‘di ẹni tí a yọ kúrò ní sínágọ́gù’ sí Yorùbá tí ó ṣe kedere, láì fi ohun míì kún un.
theological_decisions:
- issue: Ìtumọ̀ χριστός
  choice: Mèsáyà
  alternative: Kristi; Kristi náà
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì-òróró tí a ń retí, kì í ṣe bí orúkọ ẹni níhìn-ín.
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí
  choice: àwọn Júù, pẹ̀lú àlàyé ìsàlẹ̀
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Àkọlé pàtàkì pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́; àyíká fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí àwọn aláṣẹ Júù tí wọ́n lè lé ènìyàn jáde ní sínágọ́gù, kì í ṣe gbogbo Júù láìsí ìyàtọ̀.
- issue: Agbára tí ó lé ẹni jáde
  choice: wọn yóò lé ẹni náà jáde
  alternative: a ó lé ẹni náà jáde
  rationale: Yorùbá nílò olùṣe tó ṣe kedere ní ọ̀nà yìí; ‘wọn’ tọ́ka sí ẹgbẹ́ tó ṣe àdéhùn, nígbà tí Gíríìkì fi àbájáde náà hàn pẹ̀lú ἀποσυνάγωγος γένηται.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Sínágọ́gù’ jẹ́ ọ̀rọ̀ àyálò tó wọ́pọ̀ fún ibi ìjọsìn Júù; gbolohun náà pa ìtẹ̀síwájú ìròyìn àti ìdí tí àwọn òbí fi sọ̀rọ̀ bẹ́ẹ̀ mọ́.
