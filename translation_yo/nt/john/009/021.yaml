  to: Ṣùgbọ́n báwo ni ó ṣe ń ríran báyìí, a kò mọ̀; tàbí ẹni tí ó la ojú rẹ̀, àwa kò mọ̀. Ẹ bi í léèrè; ó ti dàgbà tó. Òun fúnra rẹ̀ yóò sọ̀rọ̀ nípa ara rẹ̀.[a]
