  terminology: “La ojú rẹ̀,” “Ẹ bi í léèrè,” “ó ti dàgbà tó,” àti “Òun fúnra rẹ̀ yóò sọ̀rọ̀ nípa ara rẹ̀” jẹ́ àwọn ọ̀rọ̀ tó bá àyíká ìfọ̀rọ̀wánilẹ́nuwò mu. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí “ability” má ṣe di “lágbára,” èyí tí ó lè túmọ̀ sí alágbára ju ẹni tí ó lè dáhùn lọ.
