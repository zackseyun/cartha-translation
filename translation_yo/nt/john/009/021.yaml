  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtẹ̀numọ́ àti ìṣètò ẹ̀rí nínú Gíríìkì dáadáa: a tún pa ìtúnsọ́ “kò mọ̀” mọ́, a sì túmọ̀ ἡλικίαν ἔχει gẹ́gẹ́ bí ọjọ́-orí ìdáhùn olómìnira. Síbẹ̀, “bí ó ṣe ríran” nílò àmì ìlọ́siwaju “ń” láti jẹ́ ìlò Yorùbá tó pé fún βλέπει nínú ọ̀rọ̀ yìí.'
