id: JHN.9.21
reference: John 9:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: yo
  text: Ṣùgbọ́n báwo ni ó ṣe ń ríran báyìí, a kò mọ̀; tàbí ẹni tí ó la ojú rẹ̀, àwa kò mọ̀. Ẹ bi í léèrè; ó ti dàgbà tó. Òun fúnra rẹ̀ yóò sọ̀rọ̀ nípa ara rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó lè sọ̀rọ̀ fúnra rẹ̀.” Ìṣe ọjọ́ iwájú náà nínú èdè Gíríìkì lè ṣiṣẹ́ gẹ́gẹ́ bí ìfọ̀kànsìn pé ó lè dáhùn tàbí pé ojúṣe rẹ̀ ni láti dáhùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Ṣùgbọ́n bí ó ṣe ríran nísinsìnyí
  rationale: “Bí” mú ìbéèrè πῶς jáde, “ṣùgbọ́n” fi agbára δέ hàn, “nísinsìnyí” sì bá νῦν mu. “Ó ṣe ríran” jẹ́ ọ̀nà Yorùbá àdánidá fún ìríran rẹ̀ báyìí láì fi ọ̀rọ̀ agbára kún un.
- source_word: οὐκ οἴδαμεν
  choice: àwa kò mọ̀
  rationale: Ó túmọ̀ οὐκ οἴδαμεν ní tààrà; a pa àtúnsọ rẹ̀ mọ́, a sì lo “àwa” láti fi ìtẹnumọ́ ἡμεῖς hàn ní ibi kejì, bí ó tilẹ̀ jẹ́ pé ó tún jẹ́ àdánidá ní àkọ́kọ́.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: tàbí ẹni tí ó la ojú rẹ̀
  rationale: “Tàbí” bá ἤ mu, “ẹni tí” dúró fún τίς nínú gbólóhùn tí kò jẹ́ ìbéèrè tààrà, “la ojú rẹ̀” sì pa àwòrán ìtàn náà mọ́.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Ẹ bi í léèrè
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn; “Ẹ” fi ọ̀pọ̀ hàn, “bi í léèrè” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún bíbéèrè lọ́wọ́ rẹ̀.
- source_word: ἡλικίαν ἔχει
  choice: ó ti dàgbà tó
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ọjọ́-orí tó tó fún un láti dáhùn fúnra rẹ̀, kì í ṣe sí gíga ara. “Ó ti dàgbà tó” jẹ́ àdánidá, ó sì pa èrò ìdàgbà tó pé mọ́.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Òun fúnra rẹ̀ yóò sọ̀rọ̀ nípa ara rẹ̀
  rationale: “Òun fúnra rẹ̀” fi ìtẹnumọ́ αὐτός hàn; “nípa ara rẹ̀” tẹ̀ lé περί ἑαυτοῦ, “yóò sọ̀rọ̀” sì pa ìṣe ọjọ́ iwájú λαλήσει mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἡλικίαν ἔχει nínú àyíká ọ̀rọ̀
  choice: Ó ti dàgbà tó láti dáhùn fúnra rẹ̀
  alternative: Ó jẹ́ àgbàlagbà; tàbí ó ti dàgbà ní gbogbogbòò
  rationale: Ìfọ̀rọ̀wánilẹ́nuwò àwọn aláṣẹ àti ìkọ̀sílẹ̀ àwọn òbí fi hàn pé ọjọ́-orí tó fún ẹ̀rí tàbí ìdáhùn olómìnira ni a ń sọ, kì í ṣe gíga ara.
- issue: Agbára αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Gbólóhùn ọjọ́ iwájú pé òun fúnra rẹ̀ yóò dáhùn nípa ara rẹ̀
  alternative: Ó lè sọ̀rọ̀ fúnra rẹ̀
  rationale: A pa fọ́ọ̀mù ọjọ́ iwájú Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ọjọ́ iwájú náà tún lè sọ agbára tàbí ojúṣe rẹ̀ láti dáhùn.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A pa àtúnsọ “àwa kò mọ̀” àti àwòrán “la ojú rẹ̀” mọ́, a sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé ọrọ̀ náà lórí.
