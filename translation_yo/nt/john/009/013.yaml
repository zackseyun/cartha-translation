  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: yo
  text: Wọ́n mú ọkùnrin tí ó ti fọ́jú rí náà lọ sọ́dọ̀ àwọn Farisí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n mú ọkùnrin náà lọ sọ́dọ̀ àwọn Farisí, ẹni tí ó ti fọ́jú rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Wọ́n mú … lọ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìsinsìnyí ìtàn, ṣùgbọ́n bí Yorùbá ṣe máa ń sọ ìtàn lọ́nà àdánidá ni a fi túmọ̀ rẹ̀ sí ìṣe tí ó ti ṣẹlẹ̀; “mú … lọ” tún fi ìlọsíwájú sí ọ̀dọ̀ àwọn ènìyàn hàn.
- source_word: αὐτὸν
  choice: ọkùnrin … náà
  rationale: A sọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní kedere, ní ìbámu pẹ̀lú gbólóhùn tó tẹ̀ lé e.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: sọ́dọ̀ àwọn Farisí
  rationale: “Sọ́dọ̀” fi ìṣípò lọ sí ọ̀dọ̀ àwọn ènìyàn hàn láì fi ìtumọ̀ àfikún bíi pé wọ́n mú un wá síwájú ilé-ẹjọ́ kún un.
- source_word: Φαρισαίους
  choice: àwọn Farisí
  rationale: Èyí ni àkọsílẹ̀ orúkọ ẹgbẹ́ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: τόν ποτε τυφλόν
  choice: ọkùnrin tí ó ti fọ́jú rí náà
  rationale: Gbólóhùn aláṣepọ̀ yìí sọ ẹni náà di mímọ̀, ó sì fi hàn pé ìfọ́jú jẹ́ ipò rẹ̀ tẹ́lẹ̀, kì í ṣe ipò rẹ̀ nígbà yìí.
- source_word: ποτε
  choice: tí ó ti … rí
  rationale: Ìṣètò “ti … rí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “nígbà kan rí” tàbí “tẹ́lẹ̀ rí,” ó sì pa ìyàtọ̀ àkókò mọ́.
- source_word: τυφλόν
  choice: fọ́jú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà fún ipò àìríran tí ọ̀rọ̀ Gíríìkì náà ń ṣàpèjúwe.
