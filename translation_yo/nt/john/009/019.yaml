  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: àwọn Farisí béèrè lọ́wọ́ àwọn òbí, wọ́n sì ń béèrè bóyá ọmọdékùnrin náà ni ẹni tí wọ́n sọ pé a bí ní afọ́jú, àti bí ó ṣe ń rí nísinsìnyí. Àmọ́, ìṣètò ìṣe ìkẹyìn nílò àtúnṣe kékeré kí ó lè fi présent βλέπει hàn ní Yorùbá tó péye.'
  naturalness: “Ó ṣe ríran” kò rọrùn gẹ́gẹ́ bí ọ̀nà tí Yorùbá ìgbàlódé máa ń gbà béèrè nípa ipò rírí ẹni. “Ó ṣe ń ríran” jẹ́ àdánidá sí i, ó sì fi ipò/ìṣe lọ́wọ́lọ́wọ́ hàn. Fífún un ní “i” nínú “a bí i” tún mú ìtọ́kasí sí ọmọ náà kedere.
  terminology: “Ọmọ yín,” “afọ́jú,” àti “nísinsìnyí” jẹ́ àwọn ọ̀rọ̀ tó bójú mu. Kò sí ọ̀rọ̀ ẹ̀sìn pàtàkì nínú ẹsẹ̀ yìí tí ó nílò ìṣọ́ra ìtumọ̀ àfikún.
  issues:
