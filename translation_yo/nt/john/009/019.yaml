    issue: “ó ṣe ríran” nínú ìbéèrè ìkẹyìn kò péye ní ìṣètò Yorùbá.
    rationale: Fọ́ọ̀mù náà lè dà bí ìṣe àṣà tàbí agbára rírí, dípò pé ó ń sọ nípa òtítọ́ pé ẹni náà ń rí ní àkókò yẹn. “Ó ṣe ń ríran” ń mú ìtumọ̀ présent βλέπει àti ἄρτι hàn dáadáa.
  - severity: low
    issue: A kò fi arọ́pò-orúkọ ohun sí “a bí ní afọ́jú.”
    rationale: Bí ó tilẹ̀ jẹ́ pé a lè gbọ́ ellipsis náà nínú ọ̀rọ̀ ojoojúmọ́, “a bí i ní afọ́jú” kedere sí i, ó sì tọ́ka sí ọmọ náà láìsí ìdààmú.
