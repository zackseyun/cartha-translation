  to: Wọ́n sì béèrè lọ́wọ́ wọn pé, “Ṣé èyí ni ọmọ yín, ẹni tí ẹ̀yin sọ pé a bí i ní afọ́jú? Báwo ni ó wá ṣe ń ríran nísinsìnyí?”
  rationale: A tún ìṣètò ìbéèrè ìkẹyìn ṣe sí “Báwo ni ó wá ṣe ń ríran nísinsìnyí?” láti pa ìtumọ̀ ìbéèrè àti présent βλέπει mọ́ ní Yorùbá àdánidá. A tún fi “i” kún “a bí i ní afọ́jú” láti jẹ́ kí olùfaragba ìṣe bíbí náà hàn gbangba. Àwọn ìyókù ni a pa mọ́ nítorí wọ́n bá orísun mu.
