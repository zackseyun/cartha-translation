  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: yo
  text: Wọ́n sì béèrè lọ́wọ́ wọn pé, “Ṣé èyí ni ọmọ yín, ẹni tí ẹ̀yin sọ pé a bí i ní afọ́jú? Báwo ni ó wá ṣe ń ríran nísinsìnyí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: béèrè lọ́wọ́
  rationale: Ó fi ìṣe bíbéèrè ìbéèrè tààrà hàn ní Yorùbá àdánidá, láìfi agbára ìfọ̀rọ̀wánilẹ́nuwò kun ọ̀rọ̀ náà.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣàgbékalẹ̀ ohun tí wọ́n béèrè, dípò títẹ̀lé ìṣètò Gíríìkì pẹ̀lú ‘ní wí pé.’
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Ṣé èyí ni ọmọ yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí Gíríìkì dà bí gbólóhùn ìjẹ́rìí, àyíká fi hàn pé ìbéèrè ni; ‘Ṣé’ mú iṣẹ́ ìbéèrè náà ṣe kedere ní Yorùbá.
- source_word: ὃν ὑμεῖς λέγετε
  choice: ẹni tí ẹ̀yin sọ pé
  rationale: ‘Ẹ̀yin’ pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, nígbà tí ‘sọ pé’ dúró ní àárín láìfi iyèméjì tàbí ẹ̀sùn kún un.
- source_word: τυφλὸς ἐγεννήθη
  choice: a bí ní afọ́jú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀ fún afọ́jú láti ìbí.
- source_word: πῶς οὖν
  choice: Báwo wá
  rationale: ‘Wá’ níbí ń fi ìyọrísí tàbí ìbéèrè tó jáde láti inú ohun tí a ṣẹ̀ṣẹ̀ sọ hàn, gẹ́gẹ́ bí οὖν.
- source_word: βλέπει
  choice: ó ṣe ríran
  rationale: ‘Ríran’ ń tọ́ka sí ipò rírí rẹ̀ lọ́wọ́lọ́wọ́; ìṣètò ‘Báwo ... ni ó ṣe’ jẹ́ Yorùbá àdánidá fún ìbéèrè ọ̀nà tàbí ìdí.
- source_word: ἄρτι
  choice: nísinsìnyí
  rationale: Ó fi ìyàtọ̀ tó wà láàárín afọ́jú rẹ̀ tẹ́lẹ̀ àti rírí rẹ̀ lọ́wọ́lọ́wọ́ hàn ní kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti ìgbàlódé, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọmọ’ fún υἱός nítorí pé ìbáṣepọ̀ ọmọkùnrin ti hàn nínú àyíká, Yorùbá sì máa ń lo ‘ọmọ’ lọ́nà àdánidá fún ‘ọmọ yín.’
