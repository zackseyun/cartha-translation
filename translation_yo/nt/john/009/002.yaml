id: JHN.9.2
reference: John 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì béèrè lọ́wọ́ rẹ̀ pé, “Rábì, ta ni ó ṣẹ̀, ọkùnrin yìí tàbí àwọn òbí rẹ̀, kí a bí i ní afọ́jú?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “tó fi jẹ́ pé a bí i ní afọ́jú.” Gbólóhùn Gíríìkì náà lè fi ìbáṣepọ̀ ète tàbí àbájáde tí àwọn ọmọ-ẹ̀yìn gbà pé ó wà nínú ìbéèrè wọn hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan béèrè ohun kan lọ́wọ́ ẹlòmíràn; kò fi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn tí ń tẹ̀ lé olùkọ́, tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú gbólóhùn Yorùbá, “pé” ló fi ọ̀rọ̀ tí wọ́n sọ hàn lọ́nà àdánidá; fífi “wọ́n ní” kún un lẹ́yìn “béèrè” yóò wuwo.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A ṣe àkọsílẹ̀ orúkọ oyè Júù yìí ní ìró Yorùbá, kí àyíká ìtàn náà má bàa sọnù.
- source_word: τίς
  choice: ta ni
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún ẹni tí ó ṣe ohun tí a ń sọ̀rọ̀ rẹ̀.
- source_word: ἥμαρτεν
  choice: ó ṣẹ̀
  rationale: Ó túmọ̀ ìṣe ẹ̀ṣẹ̀ náà ní ṣókí, láìfi ìtumọ̀ míì kún un.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó mú kí ó ṣe kedere pé ẹni tí wọ́n ń tọ́ka sí ni ọkùnrin afọ́jú náà; “èyí” nìkan lè má ṣe kedere tó.
- source_word: γονεῖς
  choice: àwọn òbí rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ fún bàbá àti ìyá ẹni.
- source_word: ἵνα
  choice: tí a fi
  rationale: Ìṣọ̀kan yìí lè fi ìbáṣepọ̀ tí àwọn ọmọ-ẹ̀yìn rò pé ó wà láàárín ẹ̀ṣẹ̀ àti bí a ṣe bí i ní afọ́jú hàn, láìsọ pé olùkọ̀wé fọwọ́ sí ìrònú náà.
- source_word: τυφλὸς
  choice: ní afọ́jú
  rationale: Gbólóhùn “bí i ní afọ́jú” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé afọ́jú ni ẹni náà láti ìgbà ìbí.
- source_word: γεννηθῇ
  choice: a bí i
  rationale: Ìṣe aláìṣe-ẹni-nǹkan náà ni a túmọ̀ ní ti ẹ̀dá Yorùbá gẹ́gẹ́ bí “a bí i,” èyí tí ó pa ìtumọ̀ ìbí mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìdí tàbí àbájáde inú ἵνα nínú ìbéèrè nípa ẹ̀ṣẹ̀ àti afọ́jú láti ìbí
  choice: “tí a fi bí i ní afọ́jú”
  alternative: “tó fi jẹ́ pé a bí i ní afọ́jú” tàbí “kí a lè bí i ní afọ́jú”
  rationale: Yíyan yìí pa ìbáṣepọ̀ ìdí/àbájáde tí àwọn ọmọ-ẹ̀yìn gbà pé ó wà mọ́, ṣùgbọ́n kò gbé e kalẹ̀ bí ẹ̀kọ́ tí olùkọ̀wé tàbí Jésù fọwọ́ sí. A kò yan “kí a lè” nítorí ó lè mú ète tààrà lágbára ju ohun tí ọ̀rọ̀ Gíríìkì níbí fi dandan mú lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa “Rábì” mọ́ gẹ́gẹ́ bí oyè Júù, a sì yẹra fún ṣíṣe ìbéèrè àwọn ọmọ-ẹ̀yìn di ìmúdájú ẹ̀kọ́ nípa ohun tó fa afọ́jú.
