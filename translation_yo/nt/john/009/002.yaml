  source_fidelity: 'Ìtumọ̀ náà gbé gbogbo àwọn ẹ̀yà pàtàkì ti Gíríìkì kalẹ̀ dáadáa: àwọn ọmọ-ẹ̀yìn béèrè lọ́wọ́ Jésù, wọ́n pè é ní Rábì, wọ́n sì fi ọkùnrin náà àti àwọn òbí rẹ̀ wé ara wọn gẹ́gẹ́ bí ẹni tí ó ṣẹ̀. Ṣùgbọ́n “tí a fi bí i ní afọ́jú” lè túmọ̀ sí ọ̀nà tàbí ohun èlò tí a fi ṣe ìbí náà, kì í sì jẹ́ ìfi-hàn ἵνα tó péye nínú ìbéèrè náà. “kí a bí i ní afọ́jú” ń pa ìtumọ̀ ìbéèrè tó ní ìsopọpọ̀ ìdí/àbájáde mọ́.'
