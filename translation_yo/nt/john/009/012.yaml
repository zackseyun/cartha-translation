  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Níbo ni ọkùnrin yẹn wà?” Ó ní, “Mi ò mọ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìtàn tó ṣáájú láì fi ìtumọ̀ míì kún un.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n sọ fún un pé
  rationale: Èyí tẹ̀ lé ìtumọ̀ λέγω àti ẹni tí wọ́n ń bá sọ̀rọ̀; bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ wọn, a kò yí ọ̀rọ̀ náà sí ‘wọ́n béèrè’.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Ibo ni ọkùnrin yẹn wà?
  rationale: ‘Ibo’ jẹ́ ọ̀nà àdánidá láti béèrè ibi ní Yorùbá; ‘ọkùnrin yẹn’ sì pa agbára arọ́pò-orúkọ atọ́ka ἐκεῖνος mọ́ ní ọ̀nà tó ṣe kedere nínú àyíká yìí.
- source_word: λέγει
  choice: Ó ní
  rationale: Ọ̀nà àdánidá àti ọ̀wọ̀ fún fífi èsì tààrà hàn ní Yorùbá; Yorùbá kò nílò kí a fi ìsinsìnyí ìtàn Gíríìkì hàn pẹ̀lú fọ́ọ̀mù àkókò pàtó.
- source_word: Οὐκ οἶδα
  choice: Èmi kò mọ̀
  rationale: Ó mú ìtumọ̀ ìsẹ́ Gíríìkì jáde ní kedere, ‘Èmi’ sì bá èsì tààrà àti tẹnumọ́ ẹni tó ń sọ̀rọ̀ mu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọkùnrin yẹn’ dípò ‘òun’ láti pa agbára atọ́ka ἐκεῖνος mọ́ láì nílò àlàyé àlàyé-ẹsẹ̀.
