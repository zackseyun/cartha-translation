id: JHN.9.25
reference: John 9:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: yo
  text: 'Nígbà náà ni ọkùnrin náà dáhùn pé, “Bóyá ẹlẹ́ṣẹ̀ ni ó jẹ́[a], èmi kò mọ̀. Ohun kan ni mo mọ̀: bí mo tilẹ̀ jẹ́ afọ́jú tẹ́lẹ̀, nísinsìnyí mo ríran.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ó bá jẹ́ ẹlẹ́ṣẹ̀, èmi kò mọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọ̀rọ̀ ìfèsì nínú ìjíròrò mu ni.
- source_word: οὖν
  choice: Nígbà náà
  rationale: Ó so ìdáhùn yìí mọ́ ìjíròrò tó ṣáájú láìfi ìtumọ̀ ìyọrísí tó lágbára ju ti Gíríìkì lọ.
- source_word: ἐκεῖνος
  choice: ọkùnrin náà
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka Gíríìkì mọ́, ó sì tọ́ka sí ọkùnrin tí ó ti fọ́jú rí.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Bóyá ẹlẹ́ṣẹ̀ ni ó jẹ́
  rationale: Nínú gbólóhùn tí ó tẹ̀ lé ọ̀rọ̀ mímọ̀, ‘bóyá’ fi ìbéèrè aláìdánilójú hàn lọ́nà àdánidá ní Yorùbá, láì sọ pé olùsọ ti dá Jesu lẹ́bi.
- source_word: οὐκ οἶδα
  choice: èmi kò mọ̀
  rationale: ‘Èmi’ mú ìtakora pẹ̀lú ohun kan tí ọkùnrin náà mọ̀ jáde, ó sì túmọ̀ ọ̀rọ̀ náà ní tààrà.
- source_word: ἓν οἶδα
  choice: Ohun kan ni mo mọ̀
  rationale: Ìṣètò gbólóhùn yìí tẹnu mọ́ ‘ohun kan’ bí Gíríìkì ṣe ṣe.
- source_word: τυφλὸς ὢν
  choice: bí mo tilẹ̀ jẹ́ afọ́jú tẹ́lẹ̀
  rationale: Ó sọ ipò rẹ̀ àtijọ́ ní Yorùbá àdánidá, ó sì pa ìtakora rẹ̀ pẹ̀lú ríríran nísinsìnyí mọ́.
- source_word: ἄρτι βλέπω
  choice: nísinsìnyí mo ríran
  rationale: Ó pa ìtakora àkókò àti gbólóhùn ṣókí tó lágbára mọ́; ‘ríran’ ni ọ̀rọ̀ Yorùbá àdánidá fún níní agbára ojú.
theological_decisions:
- issue: Bí a ṣe máa sọ àìdánilójú ọkùnrin náà nípa ẹ̀sùn pé Jesu jẹ́ ẹlẹ́ṣẹ̀
  choice: Bóyá ẹlẹ́ṣẹ̀ ni ó jẹ́, èmi kò mọ̀.
  alternative: Bí ó bá jẹ́ ẹlẹ́ṣẹ̀, èmi kò mọ̀.
  rationale: ‘Bóyá’ pa ààlà ohun tí ọkùnrin náà sọ pé òun mọ̀ mọ́, láìyí gbólóhùn náà sí ìdájọ́ onítúmọ̀ nípa àìlẹ́ṣẹ̀ Jesu. Àṣàyàn ‘bí ... bá’ ṣì ṣeé ṣe nítorí ìtumọ̀ εἰ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì yà ìtakora ‘kò mọ̀ / mọ̀’ àti ‘afọ́jú tẹ́lẹ̀ / ríran nísinsìnyí’ síta ní kedere.
