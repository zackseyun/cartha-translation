  source_fidelity: Àtúnṣe kékeré ni a nílò. Ọ̀rọ̀ ìtumọ̀ náà mú ìbínú ìbéèrè àfojúdi náà, ìtẹnumọ́ ‘ìwọ,’ àti ìléjáde oníṣekúṣe jáde dáadáa. Síbẹ̀, ‘Nínú ẹ̀ṣẹ̀ pátápátá’ àti àlàyé ìsàlẹ̀ rẹ̀ lè mú kí ‘pátápátá’ dà bí ẹni pé ó ń ṣàpèjúwe àwọn ẹ̀ṣẹ̀, dípò ẹni tí a bí. A tún yẹ kí a fi ọ̀pọ̀ ‘ἁμαρτίαις’ hàn nínú ọ̀rọ̀ pàtàkì náà níbi tí Yorùbá ti lè gbà á lọ́nà àdánidá.
  naturalness: ‘Wọ́n dá a lóhùn, wọ́n sì wí fún un pé’ jẹ́ Yorùbá boṣewa tó dára, ó sì pa àwòkọ́ṣe òrò-ìṣe méjì ti Gíríìkì mọ́. ‘Wọ́n sì lé e jáde’ tún jẹ́ ìsọ̀rọ̀ àdánidá. Ìṣètò ‘A bí ọ́ pátápátá nínú àwọn ẹ̀ṣẹ̀’ so ìfẹ̀sẹ̀mulẹ̀ pátápátá mọ́ ẹni náà kedere ju ti àkọ́kọ́ lọ.
