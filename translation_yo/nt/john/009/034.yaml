  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: yo
  text: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé, “A bí ọ́ pátápátá nínú àwọn ẹ̀ṣẹ̀[a], ìwọ sì ń kọ́ wa?” Wọ́n sì lé e jáde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì lo ọ̀pọ̀, “nínú àwọn ẹ̀ṣẹ̀,” ó sì tẹnumọ́ ẹni náà pé a bí i pátápátá nínú wọn. Ìsọ̀rọ̀ ẹ̀gàn àwọn tí ń fẹ̀sùn kàn án ni èyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n lé e kúrò.” Èyí lè túmọ̀ sí pé wọ́n lé e kúrò níwájú wọn; nínú àyíká ìtàn náà, ó tún lè tọ́ka sí yíyọ ọ́ kúrò nínú àwùjọ sínágọ́gù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé
  rationale: Ó pa ìṣe méjèèjì tí Jòhánù lò mọ́, ṣùgbọ́n ó tún jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye, tó sì bá ìforígbárí inú ìtàn mu.
- source_word: Ἐν ἁμαρτίαις
  choice: Nínú ẹ̀ṣẹ̀
  rationale: Yorùbá sábà máa ń lo ‘ẹ̀ṣẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ ní irú gbólóhùn yìí; àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì jẹ́ ọ̀pọ̀, kí agbára ẹ̀gàn àwọn olùfisùn má bàa sọnù.
- source_word: ἐγεννήθης ὅλος
  choice: pátápátá ni a bí ọ́
  rationale: ‘Pátápátá’ mú agbára ὅλος jáde, ó sì so gbogbo ipò ẹni náà láti ìbí pọ̀ mọ́ ẹ̀ṣẹ̀, gẹ́gẹ́ bí ẹ̀sùn tí wọ́n fi kàn án.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: ìwọ sì ń kọ́ wa?
  rationale: Ìtẹnumọ́ ‘ìwọ’ àti ìbéèrè àfojúdi mú σὺ àti ohùn ìbínú inú Gíríìkì jáde.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: Wọ́n sì lé e jáde
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìléjáde pẹ̀lú agbára; kò pinnu bóyá wọ́n lé e kúrò níwájú wọn nìkan tàbí nínú àwùjọ sínágọ́gù.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀sùn pé a bí ọkùnrin náà nínú ẹ̀ṣẹ̀
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí ẹ̀sùn líle pé gbogbo ipò rẹ̀ láti ìbí wà nínú ẹ̀ṣẹ̀.
  alternative: A bí ọ́ gẹ́gẹ́ bí ẹlẹ́ṣẹ̀ pátápátá; tàbí a bí ọ́ lábẹ́ ẹ̀bi ẹ̀ṣẹ̀ àwọn òbí rẹ.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ bóyá ẹ̀ṣẹ̀ tirẹ̀, ẹ̀ṣẹ̀ àjogúnbá, tàbí ẹ̀ṣẹ̀ tí wọ́n so mọ́ àìlera rẹ̀ ni wọ́n ní lọ́kàn. Ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìwọ̀n ìléjáde náà
  choice: Wọ́n lé e jáde, láì sọ ibi tí wọ́n lé e kúrò ní pàtó.
  alternative: Wọ́n yọ ọ́ kúrò nínú àwùjọ sínágọ́gù.
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé wọ́n lé e kúrò níwájú wọn, ó sì tún lè ní ìtumọ̀ yíyọ kúrò nínú àwùjọ sínágọ́gù ní àyíká ìtàn náà; a kò fi èyíkéyìí múlẹ̀ ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘wí fún un’ láti pa àṣà ìtàn oníṣe méjì mọ́, ‘lé e jáde’ sì jẹ́ àdánidá láì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó ju orísun lọ.
