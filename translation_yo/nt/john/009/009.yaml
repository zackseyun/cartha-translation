id: JHN.9.9
reference: John 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: yo
  text: Àwọn kan ń sọ pé, “Òun ni.” Àwọn mìíràn ń sọ pé, “Rárá, ṣùgbọ́n ó jọ ọ́.” Ọkùnrin náà sì ń sọ léraléra pé, “Èmi ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi ni ẹni náà.” Níhìn-ín, ọkùnrin náà ń fi ara rẹ̀ hàn pé òun ni ẹni tí wọ́n ń jíròrò nípa rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Àwọn kan … Àwọn mìíràn
  rationale: Àwọn ọ̀rọ̀ yìí fi ẹgbẹ́ méjì tí èrò wọn yàtọ̀ síra hàn; ìtumọ̀ yìí bá èdè Yorùbá àdánidá mu.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect fi ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn.
- source_word: Οὗτός ἐστιν
  choice: Òun nìyí
  rationale: Ó pa ìdánimọ̀ tààrà àti kúkúrú inú Gíríìkì mọ́ láìfi ‘ọkùnrin náà’ kún un.
- source_word: Οὐχί, ἀλλὰ
  choice: Rárá, ṣùgbọ́n
  rationale: Ó ṣe àtakò ọ̀rọ̀ ẹgbẹ́ kejì ní Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ ti ìjíròrò.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: ó jọ ọ́
  rationale: Ó sọ ìfarajọ, kì í ṣe pé ẹni kan náà ni wọ́n.
- source_word: ἐκεῖνος
  choice: Ọkùnrin náà
  rationale: Ní Yorùbá, yíyan orúkọ náà padà sí ‘ọkùnrin náà’ mú kí ẹni tí ó ń sọ̀rọ̀ ṣe kedere láìdàrúdàpọ̀ pẹ̀lú àwọn tí wọ́n ń jíròrò.
- source_word: ἔλεγεν
  choice: ń sọ léraléra
  rationale: Imperfect náà lè fi ìtẹnumọ́ tí ó ń tẹ̀ síwájú hàn bí ọkùnrin náà ṣe ń dá àwọn tó ń jiyàn lóhùn.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti dá ara ẹni mọ̀ gẹ́gẹ́ bí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀, ó sì tún sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ Ἐγώ εἰμι nínú ìwé Jòhánù
  choice: Èmi ni
  alternative: Èmi ni ẹni náà
  rationale: Ní àyíká ẹsẹ̀ yìí, ọkùnrin tí a mú láradá ń fi ara rẹ̀ hàn pé òun ni ẹni tí wọ́n ń jíròrò nípa rẹ̀. ‘Èmi ni’ jẹ́ ìdánimọ̀ ara ẹni tí ó wọ́pọ̀ ní Yorùbá, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí àyíká kò béèrè kún ọ̀rọ̀ náà. Àlàyé ìsàlẹ̀ mú iṣẹ́ rẹ̀ ní àyíká yìí ṣe kedere.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
