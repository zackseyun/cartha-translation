id: JHN.15.26
reference: John 15:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: yo
  text: Nígbà tí Alágbàwí[a] náà bá dé, ẹni tí èmi yóò rán sí yín láti ọ̀dọ̀ Baba—Ẹ̀mí òtítọ́, ẹni tí ó ń jáde wá láti ọ̀dọ̀ Baba[c]—òun yóò jẹ́rìí[b] nípa mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Olùrànlọ́wọ́,’ ‘Agbani-nímọ̀ràn,’ ‘Olùtùnú,’ tàbí kí a kọ ọ́ gẹ́gẹ́ bí ‘Parakílẹ́ẹ̀tì’; ọ̀rọ̀ Gíríìkì ni παράκλητος.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘yóò ṣe ẹ̀rí nípa mi.’
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì sọ pé Ẹ̀mí ‘ń jáde wá láti ọ̀dọ̀ Baba’; ọ̀rọ̀ yìí wá ṣe pàtàkì nínú ìjíròrò ẹ̀kọ́ Mẹtalọ́kan nígbà tó yá.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Nígbà tí ... bá dé
  rationale: Àkópọ̀ ọ̀rọ̀ yìí tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí; ìlò ‘nígbà tí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn àsìkò bẹ́ẹ̀.
- source_word: ὁ παράκλητος
  choice: Alágbàwí
  rationale: ‘Alágbàwí’ fi ipa ẹni tí ń dúró fún ẹlòmíràn, ń ràn án lọ́wọ́, tàbí ń sọ̀rọ̀ ní tìrẹ hàn; ó tún bá àyíká ọ̀rọ̀ ẹ̀rí mu.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: ẹni tí èmi yóò rán sí yín
  rationale: ‘Èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘yóò rán sí yín’ sì túmọ̀ ọ̀rọ̀ ọjọ́ iwájú àti ẹni tí a rán sí ní tààrà.
- source_word: παρὰ τοῦ πατρός
  choice: láti ọ̀dọ̀ Baba
  rationale: Ìlò yìí jẹ́ Yorùbá àdánidá fún ohun tàbí ẹni tí ó wá láti ọ̀dọ̀ ẹnì kan, ó sì pa ìtumọ̀ ‘from the Father’ mọ́.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Ẹ̀mí òtítọ́
  rationale: Ó pa ìkọ́lé ọ̀rọ̀ Gíríìkì àti àkọlé Johanu mọ́ láì fi ìtumọ̀ kan tí kò dájú kún un.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: ẹni tí ó ń jáde wá láti ọ̀dọ̀ Baba
  rationale: ‘Ń jáde wá’ pa ìṣe ìsinsìnyí àti ìtumọ̀ pàtó ti ἐκπορεύεται mọ́ ju gígùn ún sí ‘wá’ lásán lọ; ‘ẹni tí’ fi Ẹ̀mí hàn gẹ́gẹ́ bí ẹni, bí àyíká ọ̀rọ̀ ṣe ń ṣe.
- source_word: ἐκεῖνος
  choice: òun
  rationale: ‘Òun’ jẹ́ arọ́pò-orúkọ ìtẹnumọ́ tó bá agbára ἐκεῖνος mu, ó sì ń tọ́ka sí Alágbàwí náà gẹ́gẹ́ bí ẹni.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: yóò jẹ́rìí nípa mi
  rationale: ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa àwọ̀ ìtumọ̀ ẹlẹ́rìí tàbí ẹ̀rí mọ́; ‘nípa mi’ bá περί pẹ̀lú àpólà orúkọ mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παράκλητος nínú àyíká ọ̀rọ̀ nípa Ẹ̀mí
  choice: Alágbàwí
  alternative: Olùrànlọ́wọ́; Olùtùnú; Agbani-nímọ̀ràn; Parakílẹ́ẹ̀tì
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ púpọ̀. ‘Alágbàwí’ pa ìṣe aṣojú àti ìbáṣepọ̀ rẹ̀ pẹ̀lú jíjẹ́rìí nínú ẹsẹ yìí mọ́, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
- issue: Ṣíṣe àpèjúwe Ẹ̀mí gẹ́gẹ́ bí ẹni
  choice: ẹni tí ... òun yóò jẹ́rìí
  alternative: èyí tí ... yóò jẹ́rìí
  rationale: Bí πνεῦμα tilẹ̀ jẹ́ akọ-orúkọ aláìní akọ tàbí abo ní Gíríìkì, ἐκεῖνος jẹ́ arọ́pò-orúkọ akọ tí ó ní ìtẹnumọ́, àyíká náà sì fi Ẹ̀mí hàn gẹ́gẹ́ bí ẹni.
- issue: Ìtumọ̀ ἐκπορεύεται
  choice: ń jáde wá láti ọ̀dọ̀ Baba
  alternative: ń bọ̀ láti ọ̀dọ̀ Baba; ti ọ̀dọ̀ Baba wá
  rationale: Yíyan ‘ń jáde wá’ pa ìtumọ̀ ọ̀rọ̀-ìṣe Gíríìkì mọ́ láì ṣàfikún àlàyé ẹ̀kọ́ Mẹtalọ́kan tí ó wáyé lẹ́yìn náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àmì gígùn——ya àlàyé ‘Ẹ̀mí òtítọ́’ sọ́tọ̀, ‘òun’ sì pa ìtẹnumọ́ orísun mọ́.
