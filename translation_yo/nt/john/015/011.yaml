id: JHN.15.11
reference: John 15:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: yo
  text: Mo ti sọ àwọn nǹkan wọ̀nyí fún yín, kí ayọ̀ tèmi lè wà nínú yín[b], kí ayọ̀ yín sì lè kún[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ayọ̀ yín lè pé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láàárín yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ni; yíyan yìí pa ọ̀pọ̀ rẹ̀ mọ́, ó sì bá ọ̀nà tí Jòhánù gbà ń sọ̀rọ̀ mu.
- source_word: λελάληκα
  choice: Mo ti sọ
  rationale: Ìṣe àsìkò pípé náà tọ́ka sí ohun tí Jésù ti sọ tí ipa rẹ̀ ṣì wà; ‘Mo ti sọ’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yẹn mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó jẹ́ ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ní ọ̀pọ̀; ‘fún yín’ fi ọ̀pọ̀ hàn ní kedere.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète tàbí àbájáde tí a fẹ́.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: ayọ̀ tèmi
  rationale: ‘Ayọ̀ tèmi’ pa ìtẹnumọ́ Gíríìkì mọ́ pé ayọ̀ náà jẹ́ ti Jésù, láì túmọ̀ rẹ̀ sí ‘ayọ̀ tí mo fún yín.’
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: ‘Nínú yín’ pa àwòrán inú tàbí ìgbé-inú mọ́; síbẹ̀, Gíríìkì tún lè túmọ̀ sí ‘láàárín yín,’ èyí tí àlàyé ìsàlẹ̀ fi hàn.
- source_word: ᾖ
  choice: lè wà
  rationale: Ìṣe subjunctive lẹ́yìn ἵνα ni; ‘lè wà’ bá gbólóhùn ète Yorùbá mu.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so apá kejì mọ́ ti àkọ́kọ́ lọ́nà àdánidá, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí ‘àti’ nínú àyíká yìí.
- source_word: ἡ χαρὰ ὑμῶν
  choice: ayọ̀ yín
  rationale: Èyí jẹ́ ìtumọ̀ ohun-ìní tààrà, ó sì pa ìyàtọ̀ tó wà láàárín ‘ayọ̀ tèmi’ àti ‘ayọ̀ yín’ mọ́.
- source_word: πληρωθῇ
  choice: lè kún
  rationale: ‘Kún’ pa àwòrán ẹ̀kúnrẹ́rẹ́ inú πληρόω mọ́. Nínú Yorùbá, ó lè sọ pé ayọ̀ dé ẹ̀kúnrẹ́rẹ́ láìfi dandan sọ ẹni tó mú un kún, nítorí náà ó bá ìṣe aláìṣe Gíríìkì mu lọ́nà àdánidá.
theological_decisions:
- issue: Irú ‘ayọ̀ tèmi’ nínú àyíká Jòhánù
  choice: ayọ̀ tèmi
  alternative: ayọ̀ tí mo fún yín
  rationale: Gíríìkì sọ ní ṣókí pé ‘ayọ̀ tèmi.’ A kò ṣàlàyé rẹ̀ síwájú, kí ó lè ní ìtumọ̀ ayọ̀ Jésù fúnra rẹ̀ tí àwọn ọmọ-ẹ̀yìn ń pín àti ayọ̀ tí ìrẹ́pọ̀ pẹ̀lú rẹ̀ ń mú.
- issue: Ìtumọ̀ ἐν ὑμῖν
  choice: nínú yín
  alternative: láàárín yín
  rationale: ‘Nínú yín’ bá ìtumọ̀ inú ẹni mu, pàápàá pẹ̀lú ayọ̀ àwọn ọmọ-ẹ̀yìn tí yóò kún; ṣùgbọ́n a pa ìtumọ̀ ‘láàárín yín’ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo ‘tèmi’ láti pa ìtẹnumọ́ Gíríìkì mọ́, àti ‘lè kún’ láti jẹ́ kí àwòrán ẹ̀kúnrẹ́rẹ́ dùn bí Yorùbá àdánidá.
