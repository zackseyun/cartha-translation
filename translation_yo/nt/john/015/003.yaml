  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: yo
  text: Ẹ ti mọ́ tẹ́lẹ̀ nítorí ọ̀rọ̀ tí mo ti sọ fún yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọ̀rọ̀ tí mo ti sọ fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: nísinsìnyí
  rationale: Ó fi hàn pé ipò náà ti wà nípa wọn báyìí; pẹ̀lú ‘Ẹ ti mọ́ ní mímọ́,’ ó mú ìtumọ̀ ‘ẹ ti mọ́ ní mímọ́ báyìí’ jáde ní Yorùbá àdánidá.
- source_word: ὑμεῖς
  choice: Ẹ
  rationale: Arọ́pò-orúkọ olórí ọ̀pọ̀ ni; ‘Ẹ’ bá ọ̀pọ̀ àwọn ọmọ-ẹ̀yìn mu, ó sì jẹ́ ọ̀rọ̀ ọ̀wọ̀ ní Yorùbá.
- source_word: καθαροί
  choice: mọ́ ní mímọ́
  rationale: Ó pa àwòrán ìmọ́tótó mọ́, ó sì yẹra fún yíyí ọ̀rọ̀ náà sí ẹ̀kọ́ ìgbàgbọ́ pàtó kan. Àsọyé yìí tún jẹ́ àdánidá fún ipò tí ìwẹ̀nùmọ́ ti mú wá.
- source_word: διὰ τὸν λόγον
  choice: nítorí ọ̀rọ̀ náà
  rationale: διά pẹ̀lú accusative sábà ń fi ìdí tàbí ohun tó fà á hàn níbí; ‘nítorí’ ni ìtumọ̀ ìdí tó ṣe kedere jù ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ‘nípasẹ̀’ tún ṣeé ṣe.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì pa ìlò ọ̀rọ̀ Jòhánù mọ́ láì túmọ̀ rẹ̀ sí ‘ìránṣẹ́’ tàbí ‘ẹ̀kọ́’ nìkan.
- source_word: ὃν λελάληκα
  choice: tí mo ti sọ
  rationale: ‘ti sọ’ fi iṣẹ́ tí a ṣe tẹ́lẹ̀ tí àbájáde rẹ̀ ṣì dúró hàn, ní ìbámu pẹ̀lú perfect λελάληκα.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó túmọ̀ dative indirect object ní Yorùbá àdánidá, ‘yín’ sì fi ọ̀pọ̀ ènìyàn hàn.
theological_decisions:
- issue: Irú ìmọ́tótó àwọn ọmọ-ẹ̀yìn
  choice: A sọ ọ́ gẹ́gẹ́ bí ipò ìmọ́tótó tí ó ti wà nípa wọn, láì sọ ọ́ di ọ̀rọ̀ ìmọ̀-ẹ̀sìn pàtó.
  alternative: Ìwẹ̀nùmọ́ sakírámẹ́ǹtì tàbí ìdáláre ní ojú òfin ní pàtó.
  rationale: Àyíká ẹsẹ̀ náà ń lo àwòrán àjàrà àti pípa ẹ̀ka rẹ́; Jésù sì so ìmọ́tótó wọn mọ́ ọ̀rọ̀ tí ó sọ. Ìtumọ̀ náà gbọ́dọ̀ jẹ́ kí ààyè ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà dúró.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì yé àwọn òǹkàwé lasán. A lo ‘Ẹ/yín’ fún ọ̀pọ̀ àwọn ọmọ-ẹ̀yìn; àwọn àmì ohùn ni a kọ ní kíkún níbi tí ó bá jẹ́ àdánidá.
