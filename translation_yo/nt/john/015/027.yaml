  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: yo
  text: Ẹ̀yin náà sì ń jẹ́rìí[a], nítorí ẹ ti wà pẹ̀lú mi láti ìbẹ̀rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń fi ẹ̀rí hàn.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, èdè Gíríìkì ní, “ẹ wà”; a lo “ẹ ti wà” láti fi ipò tí ó ń bá a lọ láti ìbẹ̀rẹ̀ títí dé ìsinsìnyí hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Ẹ̀yin pẹ̀lú sì
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ náà ní ìtẹnumọ́, δέ sì ń bá ọ̀rọ̀ iṣáájú lọ pẹ̀lú ìyàtọ̀ díẹ̀; èyí fi hàn pé àwọn ọmọ-ẹ̀yìn náà, pẹ̀lú Olùrànlọ́wọ́ tí ẹsẹ iṣáájú mẹ́nu kàn, ń jẹ́rìí.
- source_word: μαρτυρεῖτε
  choice: ń jẹ́rìí
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí fún ọ̀pọ̀ ènìyàn, ó sì pa ìtumọ̀ jíjẹ́ ẹlẹ́rìí tàbí fífi ẹ̀rí hàn mọ́ ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ὅτι ń sọ ìdí tí àwọn ọmọ-ẹ̀yìn fi ń jẹ́rìí.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí kò sọ ní pàtó ohun tí ‘ìbẹ̀rẹ̀’ tọ́ka sí, nítorí náà ó pa ìwọ̀n àìsọtẹ́lẹ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: Ó sọ ìbáṣepọ̀ àti wíwà ní ẹgbẹ́ Jesu ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἐστε
  choice: ẹ ti wà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ àsìkò ìsinsìnyí ní ìrísí, ‘ẹ ti wà’ fi ipò tí ó bẹ̀rẹ̀ sẹ́yìn tí ó sì ń bá a lọ dé ìsinsìnyí hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘láti ìbẹ̀rẹ̀’
  choice: A fi gbólóhùn náà sílẹ̀ láìsọ ní pàtó ohun tí ìbẹ̀rẹ̀ náà jẹ́.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìbẹ̀rẹ̀ iṣẹ́ Jesu ní gbangba tàbí ìbẹ̀rẹ̀ jíjẹ́ ọmọ-ẹ̀yìn wọn.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìbá-kẹ́gbẹ́ àwọn ọmọ-ẹ̀yìn pẹ̀lú Jesu gẹ́gẹ́ bí ìpìlẹ̀ ẹ̀rí wọn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ àlàyé yẹn ní pàtó; ìtumọ̀ náà pa àìsọtẹ́lẹ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ẹ̀yin’ àti ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì yan ‘ń jẹ́rìí’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí ó tún pa àwọ̀ ìtumọ̀ ẹlẹ́rìí mọ́.
