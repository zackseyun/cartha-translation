source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: yo
  text: 'Ṣùgbọ́n èyí ṣẹlẹ̀ kí ọ̀rọ̀ tí a kọ sínú Òfin wọn lè ṣẹ, pé: “Wọ́n kórìíra mi láìnídìí.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó sún mọ́ Gíríìkì jù, “Ṣùgbọ́n kí ọ̀rọ̀ tí a kọ sínú Òfin wọn lè ṣẹ.” Gíríìkì kò sọ gbólóhùn àkọ́kọ́ náà ní kíkún; àyíká ọ̀rọ̀ ló fi “èyí ṣẹlẹ̀” hàn.
    reason: lexical_alternative
  - marker: b
    text: “Òfin wọn” ń lo “Òfin” ní ìtumọ̀ gbòòrò fún Ìwé Mímọ́ àwọn Júù; inú àwọn Sáàmù ni àyọlò náà ti wá (fi wé Sm 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: Tàbí, “láìsí ìdí kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín ẹsẹ yìí àti ọ̀rọ̀ tó ṣáájú, ní èdè Yorùbá tó ṣe déédé.
- source_word: ἵνα πληρωθῇ
  choice: kí ... lè ṣẹ
  rationale: Ó fi èrò ìdí tàbí àbájáde inú ἵνα pẹ̀lú ọ̀rọ̀-ìṣe aláìṣe hàn, láìfi ìpinnu dandan kún ohun tí gírámà Gíríìkì sọ.
- source_word: ὁ λόγος
  choice: ọ̀rọ̀
  rationale: Níhìn-ín λόγος ń tọ́ka sí ọ̀rọ̀ kan pàtó nínú Ìwé Mímọ́, kì í ṣe orúkọ oyè “Ọ̀rọ̀” tó wà ní ìbẹ̀rẹ̀ Ìhìn Rere Jòhánù.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: tí a kọ sínú Òfin wọn
  rationale: Ó mú ìtumọ̀ ohun tí ó dúró ní kíkọ sílẹ̀ àti arọ́pò-orúkọ “wọn” jáde ní kedere, ní ọ̀nà àdánidá ní Yorùbá.
- source_word: νόμῳ
  choice: Òfin
  rationale: Ó pa ọ̀rọ̀ Gíríìkì νόμος mọ́, bí ó tilẹ̀ jẹ́ pé ní àyíká yìí ó ní ìtumọ̀ gbòòrò tó lè ní àwọn Sáàmù nínú.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ó túmọ̀ arọ́pò-orúkọ náà ní tààrà, ó sì pa ìjìnnà ọ̀rọ̀ tí Jésù fi hàn sí àwọn alátakò rẹ̀ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàfihàn àkóónú ọ̀rọ̀ Ìwé Mímọ́ tí a ń tọ́ka sí, ní ìṣètò gbolohun Yorùbá tó ṣe déédé.
- source_word: Ἐμίσησάν με
  choice: Wọ́n kórìíra mi
  rationale: Ó sọ aorist náà gẹ́gẹ́ bí ìṣe àtijọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkórìíra.
- source_word: δωρεάν
  choice: láìnídìí
  rationale: Ó túmọ̀ pé kò sí ìdí tó tọ́ fún ìkórìíra náà; ó ṣe kúkúrú, ó sì yé òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Ìtumọ̀ “Òfin wọn” nígbà tí àyọlò náà ti wá láti inú àwọn Sáàmù
  choice: A lo “Òfin” nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a ṣàlàyé pé ó lè tọ́ka sí Ìwé Mímọ́ àwọn Júù lápapọ̀.
  alternative: A lè lo “Ìwé Mímọ́” tàbí “òfin” láti mú ìtumọ̀ gbòòrò náà hàn tààrà.
  rationale: Nítorí Gíríìkì sọ νόμος ní pàtó, “Òfin” pa ìrísí orísun mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì dènà ìtumọ̀ tó dín un mọ́ àwọn ìwé òfin nìkan.
- issue: Gbolohun Gíríìkì tí ó fi gbólóhùn àkọ́kọ́ sílẹ̀ láìsọ ọ́ ní kíkún
  choice: A fi “èyí ṣẹlẹ̀” kún un fún Yorùbá tó mọ́gbọ́n dání.
  alternative: “Ṣùgbọ́n kí ọ̀rọ̀ tí a kọ sínú Òfin wọn lè ṣẹ.”
  rationale: Gíríìkì gbẹ́kẹ̀ lé àyíká ọ̀rọ̀ tó ṣáájú. Fífi “èyí ṣẹlẹ̀” kún un mú ìbáṣepọ̀ náà ṣe kedere láìfi ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. “Kórìíra” àti “láìnídìí” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tí kò sì ní ìfarahàn ẹ̀kọ́ ìjọ kan pàtó.
