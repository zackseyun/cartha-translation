id: JHN.15.15
reference: John 15:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: yo
  text: Èmi kò tún pè yín ní ẹrú mọ́,[a] nítorí ẹrú kò mọ ohun tí ọ̀gá rẹ̀[b] ń ṣe. Ṣùgbọ́n mo ti pè yín ní ọ̀rẹ́, nítorí mo ti jẹ́ kí ẹ mọ̀ gbogbo ohun tí mo gbọ́ láti ọ̀dọ̀ Baba mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́.” Níhìn-ín, “ẹrú” mú ìyàtọ̀ ipò tó wà láàárín ẹni tó wà lábẹ́ àṣẹ àti ọ̀rẹ́ hàn kedere.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “olúwa.” Níhìn-ín, a túmọ̀ rẹ̀ sí “ọ̀gá” nítorí pé àkàwé náà jẹ́ ti ìbáṣepọ̀ láàárín ẹrú àti ẹni tó ní àṣẹ lórí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: Èmi kò tún pè yín ... mọ́
  rationale: Ìtumọ̀ yìí fi hàn pé ipò tàbí orúkọ tí Jésù ń lò fún wọn ti yí padà; ‘pè ... ní’ jẹ́ ọ̀nà Yorùbá àdánidá fún lílo λέγω gẹ́gẹ́ bí fífi orúkọ tàbí ipò kan ènìyàn.
- source_word: δούλους / δοῦλος
  choice: ẹrú / ẹrú
  rationale: ‘Ẹrú’ pa ìtẹnumọ́ lórí ipò ẹni tí ó wà lábẹ́ àṣẹ mọ́, ó sì mú ìyàtọ̀ tó wà láàárín ẹrú àti ọ̀rẹ́ hàn kedere ju ‘ìránṣẹ́’ lọ.
- source_word: οἶδεν τί ποιεῖ
  choice: kò mọ ohun tí ... ń ṣe
  rationale: ‘Mọ̀’ túmọ̀ ìmọ̀ tí οἶδα ń sọ, àmì ‘ń’ sì mú ìṣe tí ó ń lọ lọ́wọ́ inú ποιεῖ hàn lọ́nà àdánidá.
- source_word: αὐτοῦ ὁ κύριος
  choice: ọ̀gá rẹ̀
  rationale: Nínú àkàwé ìbáṣepọ̀ ẹrú àti ẹni tó ni ín, ‘ọ̀gá’ ṣe àfihàn ẹni tó ní àṣẹ lórí ẹrú láìsọ κύριος di oyè Ọlọ́run tàbí ti Mèsáyà.
- source_word: εἴρηκα φίλους
  choice: mo ti pè yín ní ọ̀rẹ́
  rationale: ‘Mo ti pè’ fi ipò tó jẹ́ àbájáde ohun tí Jésù ti sọ tẹ́lẹ̀ hàn, ‘ọ̀rẹ́’ sì pa ìyàtọ̀ pẹ̀lú ‘ẹrú’ mọ́.
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: gbogbo ohun tí mo gbọ́ láti ọ̀dọ̀ Baba mi
  rationale: Ìtumọ̀ yìí pa ìkúnrẹ́rẹ́ πάντα ἃ, ìgbọ́ran ἤκουσα, àti Baba gẹ́gẹ́ bí orísun nínú παρά mọ́.
- source_word: ἐγνώρισα ὑμῖν
  choice: mo ti jẹ́ kí ẹ mọ̀
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé a sọ ohun kan di mímọ̀ fún ẹlòmíràn, ‘ti’ sì fi ìṣe tí a ti ṣe tí ó ṣì ní ipa hàn.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ìyàtọ̀ ipò ọmọ-ẹ̀yìn
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àyíká ọ̀rọ̀ tẹnumọ́ ìwà lábẹ́ àṣẹ àti àìmọ ohun tí ẹni tó ní àṣẹ ń ṣe; ‘ẹrú’ pa agbára ìyàtọ̀ náà mọ́ láìrọ̀ ọ́ sí ìránṣẹ́ lasán.
- issue: Ìtumọ̀ κύριος nínú àkàwé ilé
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Níhìn-ín κύριος ni ẹni tó ní àṣẹ lórí ẹrú, kì í ṣe oyè Ọlọ́run tàbí Mèsáyà; ‘ọ̀gá’ yẹ mọ́ àyíká yìí.
- issue: Agbára perfect nínú εἴρηκα àti ìṣe ἐγνώρισα tó ní ìjẹ́pàtàkì lọ́wọ́lọ́wọ́
  choice: mo ti pè ... mo ti jẹ́ kí ẹ mọ̀
  alternative: mo pè ... mo jẹ́ kí ẹ mọ̀
  rationale: 'Àmì ‘ti’ nínú Yorùbá fi hàn pé àwọn ìṣe náà ti ṣẹlẹ̀, àbájáde wọn sì dúró: àwọn ọmọ-ẹ̀yìn wà ní ipò ọ̀rẹ́, wọ́n sì ti gba ìmọ̀ náà.'
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kò tún ... mọ́’ àti ‘jẹ́ kí ẹ mọ̀’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
