  source_fidelity: 'Ìtumọ̀ náà ń fi ọ̀pọ̀ èrò Gíríìkì hàn dáadáa: àṣẹ ‘Ẹ rántí,’ ìfiwéra ẹrú àti olúwa, ìnúnibíni, àti ìfarajọ ‘ọ̀rọ̀ mi ... ọ̀rọ̀ yín.’ Ṣùgbọ́n àwọn aláìpé Gíríìkì ἐδίωξαν àti ἐτήρησαν tọ́ka sí ohun tí a ti ṣe sí Jésù/tí a ti ṣe sí ọ̀rọ̀ rẹ̀; fífi ‘ti’ kún un ń ṣàfihàn èyí dáadáa ní Yorùbá láì yi ìtumọ̀ padà.'
  naturalness: ‘Ọ̀rọ̀ tiyín’ kò bójú mu gẹ́gẹ́ bí ohun-ìní tí ń tẹ̀lé orúkọ; ‘ọ̀rọ̀ yín’ ni Yorùbá boṣewa. ‘Ọ̀rọ̀ tí mo sọ fún yín náà’ sì jẹ́ kí ìtọ́kasí sí ọ̀rọ̀ tí Jésù ti sọ tẹ́lẹ̀ hàn kedere, ó sì rọrùn láti ka.
  terminology: ‘Ẹrú,’ ‘olúwa,’ ‘ṣe inúnibíni sí,’ àti ‘pa ọ̀rọ̀ mọ́’ jẹ́ àwọn yíyan tó bójú mu. ‘Ẹrú ... olúwa’ ń pa ìbáṣepọ̀ δοῦλος/κύριος mọ́, ‘pa ọ̀rọ̀ mọ́’ sì ń dá ìbáṣepọ̀ ọ̀rọ̀/τηρέω nínú Jòhánù dúró.
  issues:
